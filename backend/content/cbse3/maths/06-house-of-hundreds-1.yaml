# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 6
title: House of Hundreds–I
concepts:
- code: cbse3m.hh.place
  title: Hundreds, tens and ones up to 999
  notes: |
    3-digit numbers: hundreds, tens, ones. 345 = 3 hundreds + 4 tens + 5 ones = 300 + 40 + 5. Zero holds a place: 405
    = 4 hundreds, 0 tens, 5 ones. The biggest 3-digit number is 999; the smallest is 100. Number names: three hundred
    forty-five.
  explanations:
    text: 'A 3-digit number has hundreds, tens and ones. 345 means 3 hundreds, 4 tens and 5 ones, or 300 + 40 + 5. A zero keeps a place empty: 405 has no tens.'
    visual: Draw a place-value chart with H, T, O columns. Write 3, 4, 5 in them and draw 3 big squares, 4 sticks and 5 dots.
    step_by_step: 'Step 1: Read the hundreds digit. Step 2: Read the tens digit. Step 3: Read the ones digit. Step 4: Say or write the number.'
    real_world: Bus numbers, house numbers and page numbers in a book are often 3-digit numbers.
  picture:
    kind: compare
    columns:
    - title: Hundreds
      points:
      - '3'
      - '300'
    - title: Tens
      points:
      - '4'
      - '40'
    - title: Ones
      points:
      - '5'
      - '5'
    alt: 345 is 3 hundreds (300), 4 tens (40) and 5 ones (5).
  activity:
    type: formula
    prompt: Build a number from hundreds, tens and ones.
    inputs:
    - name: h
      label: Hundreds
      min: 0
      max: 9
      step: 1
      start: 0
    - name: t
      label: Tens
      min: 0
      max: 9
      step: 1
      start: 0
    - name: o
      label: Ones
      min: 0
      max: 9
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: 100*h+10*t+o
    goals:
    - prompt: Make 345.
      want:
        val: 345
      mistakes:
      - when:
          h: 5
          t: 4
          o: 3
        say: That's 543, back to front. The 3 is hundreds.
    - prompt: Make 405.
      want:
        val: 405
      mistakes:
      - when:
          h: 4
          t: 5
          o: 0
        say: 'That''s 450. 405 has no tens: the 0 keeps the tens empty.'
    - prompt: Make 760.
      want:
        val: 760
      mistakes:
      - when:
          h: 7
          t: 0
          o: 6
        say: That's 706. The 6 is in the tens place.
  items:
  - prompt: '3 hundreds, 4 tens and 5 ones make:'
    answer: '345'
    check: 300 + 40 + 5
    difficulty: 1
    hints:
    - Write H, T, O in order.
    - 300 + 40 + 5.
    solution: 300 + 40 + 5 = 345.
    mistakes:
      '543': c3_place
      '12': c3_place
  - prompt: What is the value of 7 in 472?
    answer: '70'
    check: 7*10
    difficulty: 1
    hints:
    - 7 is in the tens place.
    - 7 tens.
    solution: 7 tens = 70.
    mistakes:
      '7': c3_place
      '700': c3_place
  - prompt: '4 hundreds and 5 ones (no tens) make:'
    answer: '405'
    check: 400 + 5
    difficulty: 2
    hints:
    - Put 0 in the tens place.
    - 4 _ 5.
    solution: 400 + 0 + 5 = 405.
    mistakes:
      '45': c3_place
  - prompt: What is the biggest 3-digit number?
    answer: '999'
    check: '999'
    difficulty: 1
    hints:
    - Use the biggest digit everywhere.
    - 9, 9, 9.
    solution: 999 is the biggest 3-digit number.
  - prompt: How many hundreds are in 800?
    answer: '8'
    check: 800 // 100
    difficulty: 1
    hints:
    - 800 = 8 × 100.
    - Look at the first digit.
    solution: 800 has 8 hundreds.
  - prompt: '''Six hundred twelve'' is written as:'
    options:
    - '612'
    - '6012'
    - '621'
    - '60012'
    answer: '612'
    difficulty: 2
    hints:
    - 600 + 12.
    - Three digits.
    solution: Six hundred twelve = 612.
    mistakes:
      '6012': c3_place
      '60012': c3_place
- code: cbse3m.hh.compare
  title: Comparing and ordering 3-digit numbers
  after:
  - cbse3m.hh.place
  notes: |
    Compare hundreds first; if equal, compare tens; if equal, compare ones. 532 > 498 (5 hundreds > 4 hundreds). 361 <
    367 (same hundreds and tens, 1 < 7). Order from smallest to largest. Before and after: 499, 500, 501.
  explanations:
    text: To find which number is bigger, look at the hundreds first. If they are the same, look at the tens, then the ones. The open mouth of > or < always faces the bigger number.
    visual: 'Draw two place-value charts, 532 and 498, and circle the hundreds: 5 is more than 4.'
    step_by_step: 'Step 1: Compare the hundreds. Step 2: If equal, compare the tens. Step 3: If equal, compare the ones.'
    real_world: To find the house number 357 on a street, you check whether you are before or after it.
  picture:
    kind: number_line
    from: 300
    to: 600
    step: 50
    points:
    - at: 361
      label: '361'
    - at: 498
      label: '498'
    - at: 532
      label: '532'
    alt: On a number line 361 comes before 498, which comes before 532, so 532 is the biggest.
  activity:
    type: sort
    prompt: Which is bigger?
    bins:
    - First is bigger
    - Second is bigger
    items:
    - label: 528 or 385
      bin: First is bigger
      clue: Look at the hundreds first.
      why: 5 hundreds beat 3 hundreds.
    - label: 703 or 699
      bin: First is bigger
      clue: 7 hundreds or 6 hundreds?
      why: 703 is bigger.
    - label: 460 or 406
      bin: First is bigger
      clue: Same hundreds. Look at the tens.
      why: 6 tens beat 0 tens.
    - label: 291 or 912
      bin: Second is bigger
      clue: Hundreds first.
      why: 9 hundreds beat 2.
    - label: 357 or 375
      bin: Second is bigger
      clue: Same hundreds. Now the tens.
      why: 7 tens beat 5 tens.
    - label: 89 or 102
      bin: Second is bigger
      clue: How many digits?
      why: 102 has hundreds.
  items:
  - prompt: Which is bigger, 532 or 498?
    options:
    - '532'
    - '498'
    - they are equal
    - cannot tell
    answer: '532'
    difficulty: 1
    hints:
    - Look at the hundreds.
    - 5 or 4?
    solution: 5 hundreds > 4 hundreds, so 532.
    mistakes:
      '498': c3_place
  - prompt: Which is smaller, 361 or 367?
    options:
    - '361'
    - '367'
    - they are equal
    - cannot tell
    answer: '361'
    difficulty: 1
    hints:
    - Hundreds and tens are the same.
    - Compare ones.
    solution: 1 < 7, so 361 is smaller.
  - prompt: What number comes just after 499?
    answer: '500'
    check: 499 + 1
    difficulty: 1
    hints:
    - One more.
    - 499 + 1.
    solution: 499 + 1 = 500.
    mistakes:
      '4910': c3_place
  - prompt: What number comes just before 700?
    answer: '699'
    check: 700 - 1
    difficulty: 2
    hints:
    - One less.
    - 700 − 1.
    solution: 700 − 1 = 699.
    mistakes:
      '799': c3_place
  - prompt: Which list goes from smallest to largest?
    options:
    - 208, 280, 802
    - 802, 280, 208
    - 280, 208, 802
    - 208, 802, 280
    answer: 208, 280, 802
    difficulty: 2
    hints:
    - Find the smallest first.
    - Compare hundreds, then tens.
    solution: 208 < 280 < 802.
  - prompt: 'Make the biggest number from the digits 4, 7, 1:'
    options:
    - '741'
    - '147'
    - '471'
    - '714'
    answer: '741'
    difficulty: 2
    hints:
    - Put the biggest digit in the hundreds place.
    - Then the next biggest.
    solution: 7, 4, 1 makes 741.
    mistakes:
      '147': c3_place
