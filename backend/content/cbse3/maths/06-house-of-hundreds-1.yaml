# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 6
title: House of Hundreds–I
tips:
  m3_biggest_3digit: "The biggest digit is 9. Use it in every place."
  m3_order: "Smallest to largest: each number must be bigger than the one before it."
  m3_smaller: "Both start with 36. Compare the ones digit."
  c3m6_place: 'Write the number in three boxes: hundreds, tens, ones. Read each box.'
  c3m6_zero: If a place has nothing, write 0 there so the other digits stay in their places.
  c3m6_first: Compare the hundreds digits first. Only look at tens if the hundreds are the same.
  c3m6_next: Say the number, then count one more (or one less). Watch for 9s turning into 0s.
  pqc3m6_cards: Line the cards up from the biggest digit to the smallest. Which card should sit in the hundreds place?

concepts:
- code: cbse3m.hh.place
  title: Hundreds, tens and ones up to 999
  notes: |
    3-digit numbers: hundreds, tens, ones. 345 = 3 hundreds + 4 tens + 5 ones = 300 + 40 + 5. Zero holds a place: 405
    = 4 hundreds, 0 tens, 5 ones. The biggest 3-digit number is 999; the smallest is 100. Number names: three hundred
    forty-five.
  explanations:
    text: 'A 3-digit number has hundreds, tens and ones. 345 means 3 hundreds, 4 tens and 5 ones, or 300 + 40 + 5. A zero keeps a place empty: 405 has no tens.'
    visual: Draw a place-value chart with H, T, O columns. Write 3, 4, 5 in them and draw 3 big squares, 4 sticks and 5 dots.
    step_by_step: 'Step 1: Read the hundreds digit. Step 2: Read the tens digit. Step 3: Read the ones digit. Step 4: Say or write the number.'
    real_world: Bus numbers, house numbers and page numbers in a book are often 3-digit numbers.
  picture:
    kind: compare
    columns:
    - title: Hundreds
      points:
      - '3'
      - '300'
    - title: Tens
      points:
      - '4'
      - '40'
    - title: Ones
      points:
      - '5'
      - '5'
    alt: 345 is 3 hundreds (300), 4 tens (40) and 5 ones (5).
  activity:
    type: formula
    prompt: Build a number from hundreds, tens and ones.
    inputs:
    - name: h
      label: Hundreds
      min: 0
      max: 9
      step: 1
      start: 0
    - name: t
      label: Tens
      min: 0
      max: 9
      step: 1
      start: 0
    - name: o
      label: Ones
      min: 0
      max: 9
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: 100*h+10*t+o
    goals:
    - prompt: Make 345.
      want:
        val: 345
      mistakes:
      - when:
          h: 5
          t: 4
          o: 3
        say: That's 543, back to front. The 3 is hundreds.
    - prompt: Make 405.
      want:
        val: 405
      mistakes:
      - when:
          h: 4
          t: 5
          o: 0
        say: 'That''s 450. 405 has no tens: the 0 keeps the tens empty.'
    - prompt: Make 760.
      want:
        val: 760
      mistakes:
      - when:
          h: 7
          t: 0
          o: 6
        say: That's 706. The 6 is in the tens place.
  lesson:
    - teach: 'Big numbers have three places: hundreds, tens and ones. 10 tens make 1 hundred. In 268, the 2 means 2 hundreds, the 6 means 6 tens, and the 8 means 8 ones.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: hundreds
        - size: 1
          label: tens
        - size: 1
          label: ones
        rows:
        - size: 1
          label: '268'
        cells:
        - - 2 → 200
          - 6 → 60
          - 8 → 8
        alt: '268 in a place value table: 200, 60 and 8.'
      check:
        prompt: In 268, what does the 6 stand for?
        options:
        - '60'
        - '6'
        - '600'
        answer: '60'
        why: 'The 6 is in the tens place: 6 tens = 60.'
      ways:
      - style: step_by_step
        teach: 'Read the number 526. Step 1: Look at the first digit, 5: it is in the hundreds place, so 5 hundreds. Step 2: The 2 is in the tens place: 2 tens. Step 3: The 6 is in the ones place: 6 ones. Step 4: Say it: five hundred twenty-six.'
      - style: real_world
        teach: Cinema seats and train berths have numbers like 126 or 351. The hundreds digit often tells you the row or coach, so people find their seats faster.
    - teach: 'We can write a number as a sum of its places: 268 = 200 + 60 + 8. This is called the expanded form.'
      check:
        prompt: 500 + 30 + 9 = ?
        options:
        - '539'
        - '5309'
        - '593'
        answer: '539'
        why: '5 hundreds, 3 tens, 9 ones: 539.'
      ways:
      - style: visual
        teach: 'A 3-digit number broken into its places: the expanded form.'
        picture:
          kind: compare
          columns:
          - title: Number
            points:
            - '739'
          - title: Places
            points:
            - 7 hundreds
            - 3 tens
            - 9 ones
          - title: Expanded
            points:
            - 700 + 30 + 9
          alt: 739 is 7 hundreds, 3 tens and 9 ones. In expanded form it is 700 + 30 + 9.
      - style: real_world
        teach: When you pay 342 rupees at a shop, you might give 3 hundred-rupee notes, 4 ten-rupee notes and 2 one-rupee coins. That is 300 + 40 + 2.
    - teach: Zero keeps a place empty. 3 hundreds and 7 ones, with no tens, is 307, not 37. The 0 holds the tens place.
      check:
        prompt: '6 hundreds and 2 ones (no tens) make:'
        options:
        - '602'
        - '62'
        - '620'
        answer: '602'
        why: The 0 in the middle shows there are no tens.
      ways:
      - style: visual
        teach: 'Why the zero matters: two numbers that use the same digits 6 and 4.'
        picture:
          kind: compare
          columns:
          - title: '604'
            points:
            - 6 hundreds
            - 0 tens
            - 4 ones
          - title: '64'
            points:
            - 0 hundreds
            - 6 tens
            - 4 ones
          alt: 604 is 6 hundreds, 0 tens and 4 ones. 64 is only 6 tens and 4 ones. The zero in 604 holds the tens place so that the 6 stays in the hundreds place.
      - style: step_by_step
        teach: 'Write two hundred and nine. Step 1: Draw three boxes: hundreds, tens, ones. Step 2: Put 2 in the hundreds box. Step 3: There are no tens, so put 0 in the tens box. Step 4: Put 9 in the ones box: 209.'
  items:
  - prompt: '3 hundreds, 4 tens and 5 ones make:'
    answer: '345'
    check: 300 + 40 + 5
    difficulty: 1
    hints:
    - Write H, T, O in order.
    - 300 + 40 + 5.
    solution: 300 + 40 + 5 = 345.
    mistakes:
      '543': c3_place
      '12': c3_place
  - prompt: What is the value of 7 in 472?
    answer: '70'
    check: 7*10
    difficulty: 1
    hints:
    - 7 is in the tens place.
    - 7 tens.
    solution: 7 tens = 70.
    mistakes:
      '7': c3_place
      '700': c3_place
  - prompt: '4 hundreds and 5 ones (no tens) make:'
    answer: '405'
    check: 400 + 5
    difficulty: 2
    hints:
    - Put 0 in the tens place.
    - 4 _ 5.
    solution: 400 + 0 + 5 = 405.
    mistakes:
      '45': c3_place
  - prompt: What is the biggest 3-digit number?
    answer: '999'
    check: '999'
    difficulty: 1
    hints:
    - Use the biggest digit everywhere.
    - 9, 9, 9.
    solution: 999 is the biggest 3-digit number.
    mistakes: {"100": "m3_biggest_3digit", "900": "m3_biggest_3digit"}
  - prompt: How many hundreds are in 800?
    answer: '8'
    check: 800 // 100
    difficulty: 1
    hints:
    - 800 = 8 × 100.
    - Look at the first digit.
    solution: 800 has 8 hundreds.
    mistakes: {"80": "m4_hundreds", "800": "m4_hundreds"}
  - prompt: '''Six hundred twelve'' is written as:'
    options:
    - '612'
    - '6012'
    - '621'
    - '60012'
    answer: '612'
    difficulty: 2
    hints:
    - 600 + 12.
    - Three digits.
    solution: Six hundred twelve = 612.
    mistakes:
      '6012': c3_place
      '60012': c3_place
  - prompt: What is the value of 9 in 912?
    answer: '900'
    check: '900'
    difficulty: 1
    hints:
    - Which place is the 9 in?
    - It is in the hundreds place.
    solution: 'Step 1: 912 = 900 + 10 + 2. Step 2: The 9 stands for 900.'
    mistakes:
      '9': c3m6_place
      '90': c3m6_place
  - prompt: 400 + 70 + 3 = ?
    answer: '473'
    check: 400+70+3
    difficulty: 1
    hints:
    - Hundreds, then tens, then ones.
    - 4, 7, 3.
    solution: 'Step 1: 4 hundreds, 7 tens, 3 ones. Step 2: = 473.'
    mistakes:
      '4073': c3m6_place
      '437': c3m6_place
  - prompt: '8 hundreds and 6 tens (no ones) make:'
    answer: '860'
    check: 800+60
    difficulty: 2
    hints:
    - There are no ones.
    - Which place needs a 0?
    solution: 'Step 1: 800 + 60. Step 2: = 860.'
    mistakes:
      '86': c3m6_zero
      '806': c3m6_zero
  - prompt: How many tens are in 300?
    answer: '30'
    check: 300/10
    difficulty: 2
    hints:
    - 1 hundred = 10 tens.
    - 3 hundreds = how many tens?
    solution: 'Step 1: Each hundred is 10 tens. Step 2: 3 × 10 = 30 tens.'
    mistakes:
      '3': c3m6_place
      '300': c3m6_place
  - prompt: Write 'seven hundred eight' in numbers.
    answer: '708'
    check: '708'
    difficulty: 2
    hints:
    - Seven hundred = 700, eight = 8.
    - Are there any tens?
    solution: 'Step 1: 700 + 8, no tens. Step 2: = 708.'
    mistakes:
      '78': c3m6_zero
      '7008': c3m6_zero
  - prompt: What is the smallest 3-digit number?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - 99 is the biggest 2-digit number.
    - What comes after 99?
    solution: 'Step 1: 99 has only 2 digits. Step 2: 99 + 1 = 100, the smallest 3-digit number.'
    mistakes:
      '111': c3m6_place
      '101': c3m6_place
  - prompt: Which number has 5 in the tens place?
    options:
    - '153'
    - '531'
    - '315'
    answer: '153'
    difficulty: 2
    hints:
    - The tens place is the middle digit.
    - Look at the middle of each number.
    solution: 'Step 1: Middle digits: 5, 3, 1. Step 2: 153 has 5 in the tens place.'
    mistakes:
      '531': c3m6_place
      '315': c3m6_place
  - prompt: A shop packs pencils in boxes of 100 and packets of 10. It has 2 boxes, 4 packets and 6 loose pencils. How many pencils?
    answer: '246'
    check: 200+40+6
    difficulty: 3
    hints:
    - Boxes are hundreds, packets are tens.
    - 200 + 40 + 6.
    solution: 'Step 1: 2 boxes = 200, 4 packets = 40. Step 2: 200 + 40 + 6 = 246.'
    mistakes:
      '12': c3m6_place
      '2406': c3m6_place
  - prompt: What is 999 + 1?
    answer: '1000'
    check: 999+1
    difficulty: 3
    hints:
    - 9 ones and 1 more make a ten.
    - Every place fills up.
    solution: 'Step 1: Ones, tens and hundreds all fill up. Step 2: 999 + 1 = 1000.'
    mistakes:
      '9910': c3m6_next
      '100': c3m6_next
  - prompt: 'Case: A school is collecting old newspapers for recycling. They have 5 big bundles of 100 sheets, no bundles of 10, and 3 loose sheets. A child writes the total as 53. What should it be?'
    options:
    - 503, because the zero holds the tens place
    - 53 is right
    - 530, because the zero goes at the end
    answer: 503, because the zero holds the tens place
    hints:
    - How many hundreds, tens and ones are there?
    - What goes in a place that has nothing in it?
    solution: 5 hundreds, 0 tens and 3 ones is 503. Without the 0, the 5 would slip into the tens place and the number would be far too small.
    mistakes:
      53 is right: c3m6_zero
      530, because the zero goes at the end: c3m6_zero
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are reading a bus number: 381. Your friend says the 8 is worth 8. What is the 8 really worth?'
    options:
    - 80, because it is in the tens place
    - 8, because it is the digit 8
    - 800, because it is a big digit
    answer: 80, because it is in the tens place
    hints:
    - Which place is the 8 in?
    - What is each digit in that place worth?
    solution: In 381, the 8 is in the tens place, so it stands for 8 tens, which is 80.
    mistakes:
      8, because it is the digit 8: c3m6_place
      800, because it is a big digit: c3m6_place
    exam: competency
    difficulty: 2
- code: cbse3m.hh.compare
  title: Comparing and ordering 3-digit numbers
  after:
  - cbse3m.hh.place
  notes: |
    Compare hundreds first; if equal, compare tens; if equal, compare ones. 532 > 498 (5 hundreds > 4 hundreds). 361 <
    367 (same hundreds and tens, 1 < 7). Order from smallest to largest. Before and after: 499, 500, 501.
  explanations:
    text: To find which number is bigger, look at the hundreds first. If they are the same, look at the tens, then the ones. The open mouth of > or < always faces the bigger number.
    visual: 'Draw two place-value charts, 532 and 498, and circle the hundreds: 5 is more than 4.'
    step_by_step: 'Step 1: Compare the hundreds. Step 2: If equal, compare the tens. Step 3: If equal, compare the ones.'
    real_world: To find the house number 357 on a street, you check whether you are before or after it.
  picture:
    kind: number_line
    from: 300
    to: 600
    step: 50
    points:
    - at: 361
      label: '361'
    - at: 498
      label: '498'
    - at: 532
      label: '532'
    alt: On a number line 361 comes before 498, which comes before 532, so 532 is the biggest.
  activity:
    type: sort
    prompt: Which is bigger?
    bins:
    - First is bigger
    - Second is bigger
    items:
    - label: 528 or 385
      bin: First is bigger
      clue: Look at the hundreds first.
      why: 5 hundreds beat 3 hundreds.
    - label: 703 or 699
      bin: First is bigger
      clue: 7 hundreds or 6 hundreds?
      why: 703 is bigger.
    - label: 460 or 406
      bin: First is bigger
      clue: Same hundreds. Look at the tens.
      why: 6 tens beat 0 tens.
    - label: 291 or 912
      bin: Second is bigger
      clue: Hundreds first.
      why: 9 hundreds beat 2.
    - label: 357 or 375
      bin: Second is bigger
      clue: Same hundreds. Now the tens.
      why: 7 tens beat 5 tens.
    - label: 89 or 102
      bin: Second is bigger
      clue: How many digits?
      why: 102 has hundreds.
  lesson:
    - teach: 'To compare two 3-digit numbers, look at the hundreds first. More hundreds means a bigger number: 612 > 589 because 6 hundreds is more than 5 hundreds, even though 89 looks big.'
      check:
        prompt: Which is bigger, 701 or 699?
        options:
        - '701'
        - '699'
        - they are equal
        answer: '701'
        why: 7 hundreds is more than 6 hundreds.
      ways:
      - style: step_by_step
        teach: 'Compare 731 and 689. Step 1: Look at the hundreds: 7 and 6. Step 2: 7 hundreds is more than 6 hundreds. Step 3: So 731 is bigger, even though 89 is bigger than 31.'
      - style: visual
        teach: Compare two numbers one place at a time, starting from the left.
        picture:
          kind: flow
          steps:
          - Compare the hundreds
          - Different? The bigger one wins
          - Same? Compare the tens
          - Same again? Compare the ones
          alt: First compare the hundreds. If they are different, the number with more hundreds is bigger. If they are the same, compare the tens, and if those are the same too, compare the ones.
    - teach: If the hundreds are the same, compare the tens. If the tens are the same too, compare the ones. 452 < 458 because 2 ones < 8 ones.
      picture:
        kind: number_line
        from: 440
        to: 460
        step: 2
        points:
        - at: 452
          label: '452'
        - at: 458
          label: '458'
        alt: 452 lies to the left of 458 on the number line, so it is smaller.
      check:
        prompt: Which is smaller, 345 or 354?
        options:
        - '345'
        - '354'
        - they are equal
        answer: '345'
        why: Same hundreds; 4 tens < 5 tens.
      ways:
      - style: real_world
        teach: 'Two shops sell the same school bag, one for 344 rupees and one for 341 rupees. The hundreds and tens match, so the ones decide: the bag for 341 rupees is cheaper.'
      - style: step_by_step
        teach: 'Order 263, 236 and 326 from smallest to largest. Step 1: Hundreds: 2, 2 and 3. So 326 is the largest. Step 2: Compare 263 and 236: the tens are 6 and 3, so 236 is smaller. Step 3: Write 236, 263, 326.'
    - teach: 'To make the biggest number from digits, put the biggest digit in the hundreds place, then the next biggest. From 3, 8, 5: 853. For the smallest, start with the smallest digit: 358.'
      check:
        prompt: 'Smallest number from 6, 2, 9:'
        options:
        - '269'
        - '962'
        - '296'
        answer: '269'
        why: Smallest digit first, then the next smallest.
      ways:
      - style: visual
        teach: Making the biggest and smallest numbers from the digits 6, 2 and 9.
        picture:
          kind: compare
          columns:
          - title: Biggest
            points:
            - 'Biggest digit first: 9'
            - Then 6
            - Then 2
            - '962'
          - title: Smallest
            points:
            - 'Smallest digit first: 2'
            - Then 6
            - Then 9
            - '269'
          alt: 'To make the biggest number from 6, 2 and 9, put the biggest digit first: 962. To make the smallest, put the smallest digit first: 269.'
      - style: real_world
        teach: In a game, players get three number cards and try to make the biggest number. The player who puts the biggest card in the hundreds place usually wins the round.
  items:
  - prompt: Which is bigger, 532 or 498?
    options:
    - '532'
    - '498'
    - they are equal
    - cannot tell
    answer: '532'
    difficulty: 1
    hints:
    - Look at the hundreds.
    - 5 or 4?
    solution: 5 hundreds > 4 hundreds, so 532.
    mistakes:
      '498': c3_place
  - prompt: Which is smaller, 361 or 367?
    options:
    - '361'
    - '367'
    - they are equal
    - cannot tell
    answer: '361'
    difficulty: 1
    hints:
    - Hundreds and tens are the same.
    - Compare ones.
    solution: 1 < 7, so 361 is smaller.
    mistakes: {"367": "m3_smaller"}
  - prompt: What number comes just after 499?
    answer: '500'
    check: 499 + 1
    difficulty: 1
    hints:
    - One more.
    - 499 + 1.
    solution: 499 + 1 = 500.
    mistakes:
      '4910': c3_place
  - prompt: What number comes just before 700?
    answer: '699'
    check: 700 - 1
    difficulty: 2
    hints:
    - One less.
    - 700 − 1.
    solution: 700 − 1 = 699.
    mistakes:
      '799': c3_place
  - prompt: Which list goes from smallest to largest?
    options:
    - 208, 280, 802
    - 802, 280, 208
    - 280, 208, 802
    - 208, 802, 280
    answer: 208, 280, 802
    difficulty: 2
    hints:
    - Find the smallest first.
    - Compare hundreds, then tens.
    solution: 208 < 280 < 802.
    mistakes: {"208, 802, 280": "m3_order"}
  - prompt: 'Make the biggest number from the digits 4, 7, 1:'
    options:
    - '741'
    - '147'
    - '471'
    - '714'
    answer: '741'
    difficulty: 2
    hints:
    - Put the biggest digit in the hundreds place.
    - Then the next biggest.
    solution: 7, 4, 1 makes 741.
    mistakes:
      '147': c3_place
  - prompt: Which is bigger, 480 or 408?
    options:
    - '480'
    - '408'
    - they are equal
    answer: '480'
    difficulty: 1
    hints:
    - Hundreds are the same.
    - Compare the tens.
    solution: 'Step 1: Both have 4 hundreds. Step 2: 8 tens > 0 tens, so 480 is bigger.'
    mistakes:
      '408': c3m6_first
      they are equal: c3m6_first
  - prompt: What comes just after 509?
    answer: '510'
    check: 509+1
    difficulty: 1
    hints:
    - Add 1.
    - 9 ones and 1 more make a ten.
    solution: 'Step 1: 509 + 1. Step 2: = 510.'
    mistakes:
      '5010': c3m6_next
      '508': c3m6_next
  - prompt: What comes just before 400?
    answer: '399'
    check: 400-1
    difficulty: 2
    hints:
    - Take 1 away.
    - The hundreds go down by 1 and the 0s become 9s.
    solution: 'Step 1: 400 − 1. Step 2: = 399.'
    mistakes:
      '401': c3m6_next
      '300': c3m6_next
  - prompt: Make the biggest number from the digits 2, 9, 4.
    answer: '942'
    check: '942'
    difficulty: 2
    hints:
    - Put the biggest digit first.
    - Then the next biggest.
    solution: 'Step 1: Order: 9, 4, 2. Step 2: = 942.'
    mistakes:
      '249': c3m6_first
      '924': c3m6_first
  - prompt: Which list is from largest to smallest?
    options:
    - 730, 703, 370
    - 370, 703, 730
    - 703, 730, 370
    answer: 730, 703, 370
    difficulty: 2
    hints:
    - Find the largest first.
    - Compare hundreds, then tens.
    solution: 'Step 1: 730 > 703 (3 tens > 0 tens). Step 2: Both > 370.'
    mistakes:
      370, 703, 730: c3m6_first
      703, 730, 370: c3m6_first
  - prompt: Which number is between 250 and 260?
    options:
    - '256'
    - '265'
    - '246'
    answer: '256'
    difficulty: 1
    hints:
    - It must have 2 hundreds and 5 tens.
    - More than 250, less than 260.
    solution: 'Step 1: 256 > 250. Step 2: 256 < 260.'
    mistakes:
      '265': c3m6_first
      '246': c3m6_first
  - prompt: Village A has 615 people and Village B has 651. Which village has more people?
    options:
    - Village B
    - Village A
    - both the same
    answer: Village B
    difficulty: 2
    hints:
    - Both have 6 hundreds.
    - Compare the tens.
    solution: 'Step 1: Same hundreds. Step 2: 5 tens > 1 ten, so 651 is more.'
    mistakes:
      Village A: c3m6_first
      both the same: c3m6_first
  - prompt: 'Count on by 100: 250, 350, 450, ___'
    answer: '550'
    check: 450+100
    difficulty: 1
    hints:
    - Only the hundreds digit changes.
    - Add 1 hundred.
    solution: 'Step 1: Each step adds 100. Step 2: 450 + 100 = 550.'
    mistakes:
      '460': c3m6_next
      '451': c3m6_next
  - prompt: Using 0, 5 and 7 once each, what is the smallest 3-digit number?
    answer: '507'
    check: '507'
    difficulty: 3
    hints:
    - A 3-digit number cannot start with 0.
    - Start with the smallest digit that is not 0.
    solution: 'Step 1: 5 goes first. Step 2: Then 0, then 7: 507.'
    mistakes:
      '57': c3m6_zero
      '570': c3m6_first
  - prompt: 'Case: Two schools collected cans for a food drive. Hill School collected 487 and River School collected 512. Hill School says, ''We won, because 87 is more than 12!'' Are they right?'
    options:
    - No, River School collected more, because 5 hundreds is more than 4 hundreds
    - Yes, Hill School collected more
    - They collected the same
    answer: No, River School collected more, because 5 hundreds is more than 4 hundreds
    hints:
    - Which place do you compare first?
    - Compare the hundreds digits.
    solution: 'Compare the hundreds first: 5 hundreds is more than 4 hundreds, so 512 is bigger than 487.'
    mistakes:
      Yes, Hill School collected more: c3m6_first
      They collected the same: c3m6_first
    exam: case
    difficulty: 2
  - prompt: 'Situation: In a class game, you get the cards 3, 0 and 8. You must make the biggest 3-digit number. What do you make?'
    options:
    - '830'
    - '308'
    - '380'
    answer: '830'
    hints:
    - Which card should go in the hundreds place?
    - Put the cards from biggest to smallest.
