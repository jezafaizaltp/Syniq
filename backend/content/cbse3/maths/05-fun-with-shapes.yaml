# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 5
title: Fun with Shapes
tips:
  m3_house: "Draw a square and put a triangle on top like a roof."
  m3_join_back: "The triangles were cut from a shape. Put them back the way they were."
  m3_rect_corners: "A rectangle is like a door or a book. Touch each corner and count."
  m3_straight_letter: "S, C and O curve. Which letter has only straight strokes?"
  m3_tiles: "Circles leave gaps when you put them together. Floor tiles must cover the floor fully."
  m3_two_squares: "Put two square tiles side by side. Is the new shape round? Is it still square?"

concepts:
- code: cbse3m.shape.flat
  title: 'Flat shapes: sides and corners'
  notes: |
    Flat (2D) shapes: triangle (3 sides, 3 corners), square (4 equal sides), rectangle (4 sides, opposite sides
    equal), circle (curved, no corners). Lines can be straight or curved. Tangram pieces (triangles, square,
    parallelogram) join to make animals and objects.
  explanations:
    text: Flat shapes are drawn on paper. A triangle has 3 sides and 3 corners. A square has 4 equal sides. A rectangle has 4 sides, with the opposite sides equal. A circle is curved, with no corners.
    visual: Draw a triangle, a square, a rectangle and a circle. Put a dot on every corner and count the dots.
    step_by_step: 'Step 1: Count the straight sides. Step 2: Count the corners. Step 3: Name the shape.'
    real_world: A roti is a circle, a door is a rectangle, and a slice of watermelon looks like a triangle.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Triangle
      - Square
      - Circle
    - title: Corners
      points:
      - '3'
      - '4'
      - '0'
    alt: A triangle has 3 corners, a square 4, and a circle none.
  activity:
    type: sort
    prompt: How many sides does it have? Name it.
    bins:
    - Triangle
    - Square
    - Rectangle
    - Circle
    items:
    - label: 3 sides, 3 corners
      bin: Triangle
      clue: Count the corners.
      why: A triangle.
    - label: A samosa from the side
      bin: Triangle
      clue: Count its sides.
      why: A triangle.
    - label: 4 equal sides
      bin: Square
      clue: Are all sides the same?
      why: A square.
    - label: A ludo board
      bin: Square
      clue: Every side equal.
      why: A square.
    - label: 4 sides; the long ones face each other
      bin: Rectangle
      clue: Long and short sides.
      why: A rectangle.
    - label: A blackboard
      bin: Rectangle
      clue: Wider than tall.
      why: A rectangle.
    - label: No corners, round
      bin: Circle
      clue: Any corners?
      why: A circle.
    - label: A chapati
      bin: Circle
      clue: Round.
      why: A circle.
  items:
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri means three.
    - Count the lines.
    solution: A triangle has 3 sides.
    mistakes: {"4": "m4_tri", "2": "m4_tri"}
  - prompt: How many corners does a rectangle have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Look at a door.
    - One at each end of each side.
    solution: A rectangle has 4 corners.
    mistakes: {"2": "m3_rect_corners", "3": "m3_rect_corners"}
  - prompt: Which shape has only a curved line?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - Round.
    - Like a bangle.
    solution: A circle has one curved line and no corners.
    mistakes: {"triangle": "m5_no_corners"}
  - prompt: Which shape has 4 equal sides?
    options:
    - square
    - triangle
    - circle
    - long rectangle
    answer: square
    difficulty: 1
    hints:
    - Carrom board.
    - All sides the same.
    solution: A square has 4 equal sides.
    mistakes: {"long rectangle": "m4_four_equal"}
  - prompt: 2 triangles and 1 square. How many corners in all?
    answer: '10'
    check: 3 + 3 + 4
    difficulty: 2
    hints:
    - Triangle 3, square 4.
    - 3 + 3 + 4.
    solution: 3 + 3 + 4 = 10.
    mistakes:
      '9': c3_count_once
      '3': c3_count_once
  - prompt: Which letter is made of only straight lines?
    options:
    - E
    - O
    - S
    - C
    answer: E
    difficulty: 2
    hints:
    - Look for curves.
    - O, S and C bend.
    solution: E has only straight lines.
    mistakes: {"S": "m3_straight_letter"}
- code: cbse3m.shape.pattern
  title: Making pictures and patterns with shapes
  after:
  - cbse3m.shape.flat
  notes: |
    Shapes can be joined to make pictures (a house = square + triangle; a fish = triangle + oval). Two triangles can
    make a square; two squares make a rectangle. Shapes repeat to make patterns: triangle, circle, triangle, circle...
  explanations:
    text: We can join shapes to make pictures. A square with a triangle on top makes a house. Two triangles put together make a square. Shapes that repeat make a pattern.
    visual: 'Draw a house: a square for the walls, a triangle for the roof and a small rectangle for the door.'
    step_by_step: 'Step 1: Pick the shapes. Step 2: Join their sides. Step 3: See what picture or bigger shape you made.'
    real_world: Rangoli and floor tiles use repeating shapes to make beautiful patterns.
  picture:
    kind: flow
    steps:
    - Square
    - + triangle on top
    - + rectangle door
    - A house!
    alt: A square plus a triangle on top plus a rectangle door makes a house.
  activity:
    type: number_line
    min: 0
    max: 12
    step: 1
    start: 0
    prompt: Make pictures from shapes. Mark how many shapes you need.
    goals:
    - prompt: 'A house: one square and one triangle on top. How many shapes for 3 houses?'
      target: 6
      mistakes:
      - when:
          v: 3
        say: Each house uses 2 shapes.
      - when:
          v: 5
        say: 'Count: 3 squares and 3 triangles.'
    - prompt: Two triangles make one square. How many triangles for 4 squares?
      target: 8
      mistakes:
      - when:
          v: 4
        say: Each square needs 2 triangles.
      - when:
          v: 2
        say: That's one square. You need 4.
    - prompt: A pattern of circle, square, circle, square … How many circles in 10 shapes?
      target: 5
      mistakes:
      - when:
          v: 10
        say: Only every other shape is a circle.
      - when:
          v: 4
        say: 'Count again: shapes 1, 3, 5, 7, 9 are circles.'
  items:
  - prompt: 'A square with a triangle on top looks like a:'
    options:
    - house
    - ball
    - fish
    - car
    answer: house
    difficulty: 1
    hints:
    - The triangle is the roof.
    - Walls and roof.
    solution: It looks like a house.
    mistakes: {"car": "m3_house"}
  - prompt: What comes next? triangle, circle, triangle, circle, ___
    options:
    - triangle
    - circle
    - square
    - star
    answer: triangle
    difficulty: 1
    hints:
    - The pattern repeats.
    - After circle comes ...
    solution: Triangle comes next.
    mistakes: {"circle": "m5_alternate"}
  - prompt: 'Two squares joined side by side make a:'
    options:
    - rectangle
    - circle
    - triangle
    - star
    answer: rectangle
    difficulty: 2
    hints:
    - It becomes longer.
    - Four corners.
    solution: Two squares make a rectangle.
    mistakes: {"circle": "m3_two_squares"}
  - prompt: 'Two triangles cut from a square can be joined back to make a:'
    options:
    - square
    - circle
    - pentagon
    - star
    answer: square
    difficulty: 2
    hints:
    - "Think of how the two triangles were cut out in the first place."
    - Put them back.
    solution: They make the square again.
    mistakes: {"pentagon": "m3_join_back"}
  - prompt: What comes next? square, square, circle, square, square, ___
    options:
    - circle
    - square
    - triangle
    - star
    answer: circle
    difficulty: 2
    hints:
    - "Find the part that repeats, then carry it on."
    - Repeat.
    solution: The pattern is square, square, circle, so circle comes next.
    mistakes:
      square: c3_count_once
  - prompt: 'Floor tiles often use shapes that:'
    options:
    - fit together with no gaps
    - are all circles
    - have no sides
    - are different every time
    answer: fit together with no gaps
    difficulty: 1
    hints:
    - Squares fit well.
    - No holes in the floor.
    solution: Tiles fit together with no gaps.
    mistakes: {"are all circles": "m3_tiles"}
