# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 5
title: Fun with Shapes
tips:
  m3_house: "Draw a square and put a triangle on top like a roof."
  m3_join_back: "The triangles were cut from a shape. Put them back the way they were."
  m3_rect_corners: "A rectangle is like a door or a book. Touch each corner and count."
  m3_straight_letter: "S, C and O curve. Which letter has only straight strokes?"
  m3_tiles: "Circles leave gaps when you put them together. Floor tiles must cover the floor fully."
  m3_two_squares: "Put two square tiles side by side. Is the new shape round? Is it still square?"
  c3m5_side: Trace each side with your finger and count as you go round.
  c3m5_corner: Put a dot where two sides meet, then count the dots.
  c3m5_repeat: Find the part that repeats, then say the pattern again from the start.
  c3m5_fit: Picture the pieces sliding together. Which edges would touch?

concepts:
- code: cbse3m.shape.flat
  title: 'Flat shapes: sides and corners'
  notes: |
    Flat (2D) shapes: triangle (3 sides, 3 corners), square (4 equal sides), rectangle (4 sides, opposite sides
    equal), circle (curved, no corners). Lines can be straight or curved. Tangram pieces (triangles, square,
    parallelogram) join to make animals and objects.
  explanations:
    text: Flat shapes are drawn on paper. A triangle has 3 sides and 3 corners. A square has 4 equal sides. A rectangle has 4 sides, with the opposite sides equal. A circle is curved, with no corners.
    visual: Draw a triangle, a square, a rectangle and a circle. Put a dot on every corner and count the dots.
    step_by_step: 'Step 1: Count the straight sides. Step 2: Count the corners. Step 3: Name the shape.'
    real_world: A roti is a circle, a door is a rectangle, and a slice of watermelon looks like a triangle.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Triangle
      - Square
      - Circle
    - title: Corners
      points:
      - '3'
      - '4'
      - '0'
    alt: A triangle has 3 corners, a square 4, and a circle none.
  activity:
    type: sort
    prompt: How many sides does it have? Name it.
    bins:
    - Triangle
    - Square
    - Rectangle
    - Circle
    items:
    - label: 3 sides, 3 corners
      bin: Triangle
      clue: Count the corners.
      why: A triangle.
    - label: A samosa from the side
      bin: Triangle
      clue: Count its sides.
      why: A triangle.
    - label: 4 equal sides
      bin: Square
      clue: Are all sides the same?
      why: A square.
    - label: A ludo board
      bin: Square
      clue: Every side equal.
      why: A square.
    - label: 4 sides; the long ones face each other
      bin: Rectangle
      clue: Long and short sides.
      why: A rectangle.
    - label: A blackboard
      bin: Rectangle
      clue: Wider than tall.
      why: A rectangle.
    - label: No corners, round
      bin: Circle
      clue: Any corners?
      why: A circle.
    - label: A chapati
      bin: Circle
      clue: Round.
      why: A circle.
  lesson:
    - teach: Lines can be straight (like the edge of a ruler) or curved (like the edge of a bangle). Flat shapes are made of these lines.
      check:
        prompt: 'The edge of a bangle is:'
        options:
        - curved
        - straight
        - a corner
        answer: curved
        why: A bangle bends all the way round.
    - teach: 'Shapes with straight sides have corners where two sides meet. Triangle: 3 sides, 3 corners. Square and rectangle: 4 sides, 4 corners. A circle has one curved line and no corners.'
      picture:
        kind: compare
        columns:
        - title: Triangle
          points:
          - 3 sides
          - 3 corners
        - title: Rectangle
          points:
          - 4 sides
          - 4 corners
        - title: Circle
          points:
          - 1 curved line
          - 0 corners
        alt: Sides and corners of a triangle, rectangle and circle.
      check:
        prompt: How many corners does a square have?
        options:
        - '4'
        - '3'
        - '0'
        answer: '4'
        why: A square has 4 sides, and they meet at 4 corners.
    - teach: 'A square has 4 sides all the same length. A rectangle has 4 sides too, but only the opposite sides are equal: two long, two short.'
      check:
        prompt: 'A shape has 2 long sides and 2 short sides. It is a:'
        options:
        - rectangle
        - square
        - triangle
        answer: rectangle
        why: A square's sides would all be the same length.
  items:
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri means three.
    - Count the lines.
    solution: A triangle has 3 sides.
    mistakes: {"4": "m4_tri", "2": "m4_tri"}
  - prompt: How many corners does a rectangle have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Look at a door.
    - One at each end of each side.
    solution: A rectangle has 4 corners.
    mistakes: {"2": "m3_rect_corners", "3": "m3_rect_corners"}
  - prompt: Which shape has only a curved line?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - Round.
    - Like a bangle.
    solution: A circle has one curved line and no corners.
    mistakes: {"triangle": "m5_no_corners"}
  - prompt: Which shape has 4 equal sides?
    options:
    - square
    - triangle
    - circle
    - long rectangle
    answer: square
    difficulty: 1
    hints:
    - Carrom board.
    - All sides the same.
    solution: A square has 4 equal sides.
    mistakes: {"long rectangle": "m4_four_equal"}
  - prompt: 2 triangles and 1 square. How many corners in all?
    answer: '10'
    check: 3 + 3 + 4
    difficulty: 2
    hints:
    - Triangle 3, square 4.
    - 3 + 3 + 4.
    solution: 3 + 3 + 4 = 10.
    mistakes:
      '9': c3_count_once
      '3': c3_count_once
  - prompt: Which letter is made of only straight lines?
    options:
    - E
    - O
    - S
    - C
    answer: E
    difficulty: 2
    hints:
    - Look for curves.
    - O, S and C bend.
    solution: E has only straight lines.
    mistakes: {"S": "m3_straight_letter"}
  - prompt: How many sides do 3 triangles have in all?
    answer: '9'
    check: 3*3
    difficulty: 2
    hints:
    - One triangle has 3 sides.
    - 3 + 3 + 3.
    solution: 'Step 1: Each triangle has 3 sides. Step 2: 3 + 3 + 3 = 9.'
    mistakes:
      '6': c3m5_side
      '3': c3m5_side
  - prompt: How many corners does a circle have?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Does a circle have straight sides?
    - Corners need two sides meeting.
    solution: 'Step 1: A circle is one curved line. Step 2: Nothing meets, so 0 corners.'
    mistakes:
      '1': c3m5_corner
      '4': c3m5_corner
  - prompt: Which letter has a curved line?
    options:
    - C
    - L
    - T
    answer: C
    difficulty: 1
    hints:
    - Draw each letter in the air.
    - Which one bends?
    solution: 'Step 1: L and T use only straight lines. Step 2: C is curved.'
    mistakes:
      L: c3m5_side
      T: c3m5_side
  - prompt: A square and a rectangle together have how many corners?
    answer: '8'
    check: 4+4
    difficulty: 2
    hints:
    - Each has 4 corners.
    - Add them.
    solution: 'Step 1: 4 + 4. Step 2: = 8 corners.'
    mistakes:
      '4': c3m5_corner
      '6': c3m5_corner
  - prompt: Which is shaped like a triangle?
    options:
    - a samosa
    - a chapati
    - a carrom board
    answer: a samosa
    difficulty: 1
    hints:
    - Count the corners of each.
    - Which has 3 corners?
    solution: 'Step 1: A chapati is a circle; a carrom board is a square. Step 2: A samosa has 3 corners.'
    mistakes:
      a chapati: c3m5_corner
      a carrom board: c3m5_corner
  - prompt: A rectangle's long side is 6 cm. How long is the opposite long side?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Opposite sides of a rectangle are equal.
    - Look across the shape.
    solution: 'Step 1: Opposite sides match. Step 2: So it is also 6 cm.'
    mistakes:
      '3': c3m5_side
      '12': c3m5_side
  - prompt: How many straight lines make the letter H?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Draw H slowly.
    - Two standing lines and one in the middle.
    solution: 'Step 1: Two upright lines. Step 2: One across, so 3.'
    mistakes:
      '2': c3m5_side
      '4': c3m5_side
  - prompt: Which shape has 4 sides all the same length?
    options:
    - square
    - rectangle with long and short sides
    - triangle
    answer: square
    difficulty: 1
    hints:
    - Which shape has 4 equal sides?
    - A rectangle has two long, two short.
    solution: 'Step 1: A triangle has 3 sides. Step 2: Only the square has 4 equal sides.'
    mistakes:
      rectangle with long and short sides: c3m5_side
      triangle: c3m5_side
  - prompt: A picture uses 2 squares and 3 triangles. How many sides in all?
    answer: '17'
    check: 2*4+3*3
    difficulty: 3
    hints:
    - 'Squares: 4 sides each. Triangles: 3 sides each.'
    - Add both groups.
    solution: 'Step 1: 2 squares = 8 sides, 3 triangles = 9 sides. Step 2: 8 + 9 = 17.'
    mistakes:
      '5': c3m5_side
      '14': c3m5_side
- code: cbse3m.shape.pattern
  title: Making pictures and patterns with shapes
  after:
  - cbse3m.shape.flat
  notes: |
    Shapes can be joined to make pictures (a house = square + triangle; a fish = triangle + oval). Two triangles can
    make a square; two squares make a rectangle. Shapes repeat to make patterns: triangle, circle, triangle, circle...
  explanations:
    text: We can join shapes to make pictures. A square with a triangle on top makes a house. Two triangles put together make a square. Shapes that repeat make a pattern.
    visual: 'Draw a house: a square for the walls, a triangle for the roof and a small rectangle for the door.'
    step_by_step: 'Step 1: Pick the shapes. Step 2: Join their sides. Step 3: See what picture or bigger shape you made.'
    real_world: Rangoli and floor tiles use repeating shapes to make beautiful patterns.
  picture:
    kind: flow
    steps:
    - Square
    - + triangle on top
    - + rectangle door
    - A house!
    alt: A square plus a triangle on top plus a rectangle door makes a house.
  activity:
    type: number_line
    min: 0
    max: 12
    step: 1
    start: 0
    prompt: Make pictures from shapes. Mark how many shapes you need.
    goals:
    - prompt: 'A house: one square and one triangle on top. How many shapes for 3 houses?'
      target: 6
      mistakes:
      - when:
          v: 3
        say: Each house uses 2 shapes.
      - when:
          v: 5
        say: 'Count: 3 squares and 3 triangles.'
    - prompt: Two triangles make one square. How many triangles for 4 squares?
      target: 8
      mistakes:
      - when:
          v: 4
        say: Each square needs 2 triangles.
      - when:
          v: 2
        say: That's one square. You need 4.
    - prompt: A pattern of circle, square, circle, square … How many circles in 10 shapes?
      target: 5
      mistakes:
      - when:
          v: 10
        say: Only every other shape is a circle.
      - when:
          v: 4
        say: 'Count again: shapes 1, 3, 5, 7, 9 are circles.'
  lesson:
    - teach: Shapes can be put together to make pictures. A triangle on a square makes a house. A circle on a rectangle can make a lollipop.
      check:
        prompt: 'A triangle on top of a square looks like a:'
        options:
        - house
        - ball
        - car wheel
        answer: house
        why: The triangle is the roof and the square is the walls.
    - teach: Shapes can be cut and joined. A square cut corner to corner gives 2 triangles; join them back and you get the square. 2 squares side by side make a rectangle.
      picture:
        kind: flow
        steps:
        - 1 square
        - cut corner to corner
        - 2 triangles
        - join back
        - 1 square
        alt: A square cut into two triangles and joined back.
      check:
        prompt: '2 squares side by side make a:'
        options:
        - rectangle
        - triangle
        - circle
        answer: rectangle
        why: The new shape is twice as long as it is wide.
    - teach: A pattern repeats the same group again and again. In square, circle, square, circle, the group 'square, circle' repeats. Find the group, then say what comes next.
      check:
        prompt: What comes next? star, moon, star, moon, ___
        options:
        - star
        - moon
        - sun
        answer: star
        why: The group 'star, moon' repeats, so star starts it again.
  items:
  - prompt: 'A square with a triangle on top looks like a:'
    options:
    - house
    - ball
    - fish
    - car
    answer: house
    difficulty: 1
    hints:
    - The triangle is the roof.
    - Walls and roof.
    solution: It looks like a house.
    mistakes: {"car": "m3_house"}
  - prompt: What comes next? triangle, circle, triangle, circle, ___
    options:
    - triangle
    - circle
    - square
    - star
    answer: triangle
    difficulty: 1
    hints:
    - The pattern repeats.
    - After circle comes ...
    solution: Triangle comes next.
    mistakes: {"circle": "m5_alternate"}
  - prompt: 'Two squares joined side by side make a:'
    options:
    - rectangle
    - circle
    - triangle
    - star
    answer: rectangle
    difficulty: 2
    hints:
    - It becomes longer.
    - Four corners.
    solution: Two squares make a rectangle.
    mistakes: {"circle": "m3_two_squares"}
  - prompt: 'Two triangles cut from a square can be joined back to make a:'
    options:
    - square
    - circle
    - pentagon
    - star
    answer: square
    difficulty: 2
    hints:
    - "Think of how the two triangles were cut out in the first place."
    - Put them back.
    solution: They make the square again.
    mistakes: {"pentagon": "m3_join_back"}
  - prompt: What comes next? square, square, circle, square, square, ___
    options:
    - circle
    - square
    - triangle
    - star
    answer: circle
    difficulty: 2
    hints:
    - "Find the part that repeats, then carry it on."
    - Repeat.
    solution: The pattern is square, square, circle, so circle comes next.
    mistakes:
      square: c3_count_once
  - prompt: 'Floor tiles often use shapes that:'
    options:
    - fit together with no gaps
    - are all circles
    - have no sides
    - are different every time
    answer: fit together with no gaps
    difficulty: 1
    hints:
    - Squares fit well.
    - No holes in the floor.
    solution: Tiles fit together with no gaps.
    mistakes: {"are all circles": "m3_tiles"}
  - prompt: What comes next? circle, circle, square, circle, circle, ___
    options:
    - square
    - circle
    - triangle
    answer: square
    difficulty: 1
    hints:
    - Find the group that repeats.
    - circle, circle, square...
    solution: 'Step 1: The group is ''circle, circle, square''. Step 2: After two circles comes a square.'
    mistakes:
      circle: c3m5_repeat
      triangle: c3m5_repeat
  - prompt: In the pattern triangle, square, circle, triangle, square, circle, how many shapes are in the repeating group?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Where does it start again?
    - Count the shapes before the first repeat.
    solution: 'Step 1: The group is triangle, square, circle. Step 2: That is 3 shapes.'
    mistakes:
      '6': c3m5_repeat
      '2': c3m5_repeat
  - prompt: How many small triangles do you get by cutting a square corner to corner once?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - One cut from one corner to the opposite corner.
    - How many pieces?
    solution: 'Step 1: One cut makes 2 pieces. Step 2: Each piece is a triangle.'
    mistakes:
      '4': c3m5_fit
      '3': c3m5_fit
  - prompt: '3 squares in a row make a:'
    options:
    - long rectangle
    - triangle
    - circle
    answer: long rectangle
    difficulty: 2
    hints:
    - Picture three tiles side by side.
    - It is longer than it is wide.
    solution: 'Step 1: Three squares in a row are 3 times as long. Step 2: That is a long rectangle.'
    mistakes:
      triangle: c3m5_fit
      circle: c3m5_fit
  - prompt: Why are round tiles not used to cover a floor?
    options:
    - they leave gaps between them
    - they are too heavy
    - they have too many corners
    answer: they leave gaps between them
    difficulty: 2
    hints:
    - Put coins together on a table.
    - Is any space left over?
    solution: 'Step 1: Circles touch only at points. Step 2: So gaps are left between them.'
    mistakes:
      they are too heavy: c3m5_fit
      they have too many corners: c3m5_fit
  - prompt: In the pattern red, blue, blue, red, blue, blue, what is the 7th colour?
    options:
    - red
    - blue
    - green
    answer: red
    difficulty: 3
    hints:
    - The group 'red, blue, blue' has 3 colours.
    - The 7th starts a new group.
    solution: 'Step 1: Groups end at 3rd and 6th. Step 2: The 7th starts again with red.'
    mistakes:
      blue: c3m5_repeat
      green: c3m5_repeat
  - prompt: A rocket picture uses 1 rectangle, 1 triangle and 2 small triangles. How many shapes?
    answer: '4'
    check: 1+1+2
    difficulty: 1
    hints:
    - Count each shape.
    - 1 + 1 + 2.
    solution: 'Step 1: 1 rectangle + 1 triangle + 2 triangles. Step 2: 4 shapes.'
    mistakes:
      '3': c3m5_fit
      '2': c3m5_fit
  - prompt: What comes next? 1 dot, 2 dots, 3 dots, ___
    options:
    - 4 dots
    - 1 dot
    - 6 dots
    answer: 4 dots
    difficulty: 1
    hints:
    - How many dots are added each time?
    - 1 more each step.
    solution: 'Step 1: The pattern grows by 1. Step 2: After 3 comes 4.'
    mistakes:
      1 dot: c3m5_repeat
      6 dots: c3m5_repeat
  - prompt: 4 small squares can make one big square. How many small squares make a big square with 3 on each side?
    answer: '9'
    check: 3*3
    difficulty: 3
    hints:
    - 3 rows with 3 in each.
    - 3 + 3 + 3.
    solution: 'Step 1: 3 rows of 3. Step 2: 3 + 3 + 3 = 9.'
    mistakes:
      '6': c3m5_fit
      '12': c3m5_fit
