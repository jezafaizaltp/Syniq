# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 14. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 14
title: The Surajkund Fair
tips:
  m3_money_left: "Money spent goes out of your purse. Is that adding or taking away?"
  m3_picture_graph: "The name 'picture graph' tells you what it uses."
  c3m14_key: 'Read the key first: how many does one picture stand for? Then skip count the pictures.'
  c3m14_read: Put your finger on the row or bar, read its number, then compare.
  c3m14_op: "Ask what is happening in the story: are things joining, leaving, coming in equal groups, or being shared out?"
  c3m14_sense: Estimate first. Does your answer make sense for the story?

concepts:
- code: cbse3m.fair.data
  title: Collecting and reading data
  notes: |
    At a fair, we can count things and record them: tally marks, tables and picture graphs (pictographs, where one
    picture stands for one or more things). Reading data: which is most, which is least, how many more. Bar graphs show
    the same data as bars.
  explanations:
    text: Data means information we collect by counting. We can show it in a table or a picture graph. In a picture graph, each picture stands for a number of things. Then we can see which is most and which is least.
    visual: 'Draw a picture graph of stalls at a fair: 4 pots for pottery stalls, 6 bangles for bangle stalls, 2 toys for toy stalls.'
    step_by_step: 'Step 1: Count each kind. Step 2: Write or draw the counts. Step 3: Compare: most, least, how many more.'
    real_world: 'The Surajkund Crafts Fair in Haryana has stalls from all over India: pottery, cloth, toys and food.'
  picture:
    kind: bars
    bars:
    - label: Pottery
      value: 4
    - label: Bangles
      value: 6
    - label: Toys
      value: 2
    alt: There are 4 pottery stalls, 6 bangle stalls and 2 toy stalls.
    unit: stalls
  activity:
    type: formula
    prompt: A picture graph. Each picture stands for k children.
    inputs:
    - name: k
      label: Children per picture
      min: 1
      max: 10
      step: 1
      start: 1
    - name: p
      label: Pictures
      min: 0
      max: 20
      step: 1
      start: 0
    outputs:
    - name: tot
      label: Children shown
      expr: k*p
    goals:
    - prompt: Each picture = 2 children. Show 10 children.
      want:
        k: 2
        tot: 10
      mistakes:
      - when:
          k: 2
          p: 10
        say: 10 pictures show 20 children. Each picture is 2.
    - prompt: Each picture = 5 children. Show 20 children.
      want:
        k: 5
        tot: 20
      mistakes:
      - when:
          k: 5
          p: 20
        say: 20 pictures show 100! Each picture is 5.
    - prompt: Each picture = 1 child. Show 7 children.
      want:
        k: 1
        tot: 7
      mistakes:
      - when:
          k: 1
          p:
          - 8
          - 20
        say: Too many pictures. One picture for each child.
  lesson:
    - teach: When we count things at a fair, we can write them in a table so they are easy to read. Each row shows a thing and its count.
      check:
        prompt: 'Table: Pots 5, Toys 3. How many pots?'
        options:
        - '5'
        - '3'
        - '8'
        answer: '5'
        why: Read the number next to Pots.
      ways:
      - style: step_by_step
        teach: 'Make a table of things at a fair. Step 1: Write the things in one column: kites, masks, drums. Step 2: Count each thing with tally marks as you walk round. Step 3: Write each count next to its thing. Step 4: Read the table to answer questions.'
      - style: visual
        teach: 'A table of stalls at a fair: each row shows a thing and its count.'
        picture:
          kind: compare
          columns:
          - title: Stall
            points:
            - Kites
            - Masks
            - Drums
          - title: Count
            points:
            - '9'
            - '3'
            - '6'
          alt: A table shows 9 kite stalls, 3 mask stalls and 6 drum stalls.
    - teach: A picture graph uses pictures for numbers. A key tells what one picture means. If 1 🎈 = 2 balloons, then 3 🎈 = 6 balloons.
      check:
        prompt: 1 🍎 = 5 apples. How many apples do 4 🍎 show?
        options:
        - '20'
        - '4'
        - '9'
        answer: '20'
        why: 5 + 5 + 5 + 5 = 20.
      ways:
      - style: visual
        teach: 'Reading a picture graph with a key: 1 🍦 = 5 ice creams.'
        picture:
          kind: compare
          columns:
          - title: Key
            points:
            - 1 🍦 = 5 ice creams
          - title: Shown
            points:
            - 🍦🍦🍦🍦
          - title: So
            points:
            - 5, 10, 15, 20
            - 20 ice creams
          alt: 'The key says one ice-cream picture stands for 5 ice creams. Four pictures are shown, so skip count 5, 10, 15, 20: 20 ice creams.'
      - style: real_world
        teach: Newspapers sometimes show how many people voted using little pictures of people, where each picture stands for a thousand voters. The key tells you how to read it.
    - teach: A bar graph shows the same counts as bars. The longest bar is the most; the shortest is the least. To find 'how many more', subtract the shorter from the longer.
      picture:
        kind: bars
        unit: stalls
        bars:
        - label: Pottery
          value: 4
        - label: Bangles
          value: 6
        - label: Toys
          value: 2
        alt: 'Bar graph: Pottery 4, Bangles 6, Toys 2 stalls.'
      check:
        prompt: Pottery 4, Toys 2. How many more pottery stalls?
        options:
        - '2'
        - '6'
        - '4'
        answer: '2'
        why: 4 − 2 = 2.
      ways:
      - style: visual
        teach: 'A bar graph of the stalls: the longest bar shows the most.'
        picture:
          kind: bars
          bars:
          - label: Kites
            value: 9
          - label: Masks
            value: 3
          - label: Drums
            value: 6
          alt: The bar graph shows kites 9, masks 3 and drums 6. Kites have the longest bar and masks the shortest. There are 9 − 3 = 6 more kite stalls than mask stalls.
      - style: real_world
        teach: A school notice board may show a bar graph of how many books each class read this month. One look tells you which class read the most.
  items:
  - prompt: Pottery 4, Bangles 6, Toys 2 stalls. Which has the most stalls?
    options:
    - Bangles
    - Pottery
    - Toys
    - all equal
    answer: Bangles
    difficulty: 1
    hints:
    - Find the biggest number.
    - '6.'
    solution: Bangles have the most.
    mistakes: {"Pottery": "m5_most"}
  - prompt: Pottery 4, Bangles 6, Toys 2 stalls. Which has the fewest?
    options:
    - Toys
    - Bangles
    - Pottery
    - all equal
    answer: Toys
    difficulty: 1
    hints:
    - Smallest number.
    - '2.'
    solution: Toys have the fewest.
    mistakes: {"Pottery": "m5_least_popular"}
  - prompt: Pottery 4, Bangles 6, Toys 2 stalls. How many stalls in all?
    answer: '12'
    check: 4 + 6 + 2
    difficulty: 1
    hints:
    - Add all.
    - 4 + 6 + 2.
    solution: 12 stalls.
    mistakes: {"10": "m5_add_all", "8": "m5_add_all"}
  - prompt: Bangles 6 and Toys 2. How many more bangle stalls?
    answer: '4'
    check: 6 - 2
    difficulty: 2
    hints:
    - Bigger − smaller.
    - 6 − 2.
    solution: 4 more.
    mistakes:
      '8': c3_count_once
  - prompt: In a picture graph, each 🙂 = 2 children. 5 faces mean how many children?
    answer: '10'
    check: 5*2
    difficulty: 2
    hints:
    - Each face is 2.
    - 5 × 2.
    solution: 10 children.
    mistakes:
      '5': c3_count_once
  - prompt: 'A picture graph uses:'
    options:
    - pictures to show numbers
    - only words
    - only colours
    - nothing
    answer: pictures to show numbers
    difficulty: 1
    hints:
    - Picture + graph.
    - Each picture counts.
    solution: A picture graph uses pictures to show numbers.
    mistakes: {"only words": "m3_picture_graph"}
  - prompt: 'Rides: Swing 8, Wheel 5, Train 3. How many rides in all?'
    answer: '16'
    check: 8+5+3
    difficulty: 1
    hints:
    - Add all three.
    - 8 + 5 + 3.
    solution: 'Step 1: 8 + 5 = 13. Step 2: 13 + 3 = 16.'
    mistakes:
      '13': c3m14_read
      '15': c3m14_read
  - prompt: 'Rides: Swing 8, Wheel 5, Train 3. Which has the fewest?'
    options:
    - Train
    - Swing
    - Wheel
    answer: Train
    difficulty: 1
    hints:
    - Fewest means smallest number.
    - Compare 8, 5 and 3.
    solution: 'Step 1: 3 is the smallest. Step 2: Train.'
    mistakes:
      Swing: c3m14_read
      Wheel: c3m14_read
  - prompt: 'Rides: Swing 8, Wheel 5. How many more swings than wheels?'
    answer: '3'
    check: 8-5
    difficulty: 1
    hints:
    - Bigger minus smaller.
    - 8 − 5.
    solution: 'Step 1: 8 − 5. Step 2: = 3 more.'
    mistakes:
      '13': c3m14_read
      '5': c3m14_read
  - prompt: 'Key: 1 ⭐ = 10 visitors. How many visitors do 6 ⭐ show?'
    answer: '60'
    check: 6*10
    difficulty: 2
    hints:
    - Each star is 10.
    - Skip count by 10, six times.
    solution: 'Step 1: 10, 20, ..., 60. Step 2: 60 visitors.'
    mistakes:
      '6': c3m14_key
      '16': c3m14_key
  - prompt: 'Key: 1 🙂 = 2 children. 14 children are shown. How many 🙂?'
    answer: '7'
    check: 14/2
    difficulty: 2
    hints:
    - Each face stands for 2.
    - How many 2s make 14?
    solution: 'Step 1: 2 × 7 = 14. Step 2: 7 faces.'
    mistakes:
      '14': c3m14_key
      '28': c3m14_key
  - prompt: In a bar graph, which bar shows the most?
    options:
    - the longest bar
    - the shortest bar
    - the first bar
    answer: the longest bar
    difficulty: 1
    hints:
    - Longer bar, bigger number.
    - Which bar reaches furthest?
    solution: 'Step 1: Bar length shows the count. Step 2: The longest bar shows the most.'
    mistakes:
      the shortest bar: c3m14_read
      the first bar: c3m14_read
  - prompt: 'Tally: Kulfi |||| ||, Chaat ||||. How many more kulfi than chaat sold?'
    answer: '3'
    check: 7-4
    difficulty: 2
    hints:
    - 'Count each tally: a crossed bundle is 5.'
    - Kulfi 7, Chaat 4.
    solution: 'Step 1: Kulfi = 5 + 2 = 7, Chaat = 4. Step 2: 7 − 4 = 3.'
    mistakes:
      '11': c3m14_read
      '2': c3m14_key
  - prompt: 'Key: 1 🎈 = 5 balloons. Red has 3 🎈, Blue has 5 🎈. How many balloons in all?'
    answer: '40'
    check: (3+5)*5
    difficulty: 3
    hints:
    - Count all the pictures first.
    - Then multiply by 5.
    solution: 'Step 1: 3 + 5 = 8 pictures. Step 2: 8 × 5 = 40 balloons.'
    mistakes:
      '8': c3m14_key
      '13': c3m14_key
  - prompt: Why does a picture graph need a key?
    options:
    - "to tell how many each picture stands for"
    - "to make the graph bright and colourful"
    - "to show the date the graph was made"
    answer: to tell how many each picture stands for
    difficulty: 2
    hints:
    - One picture can mean more than one thing.
    - How would you know?
    solution: 'Step 1: A picture may stand for 2, 5 or 10. Step 2: The key tells you which.'
    mistakes:
      "to make the graph bright and colourful": c3m14_key
      "to show the date the graph was made": c3m14_key
  - prompt: 'Case: Children make a picture graph of the snacks sold at the fair. The key says 1 🙂 = 2 snacks. Chaat has 4 🙂. A child says 4 plates of chaat were sold. What is the mistake?'
    options:
    - "The key was not used: 4 pictures show 8 plates"
    - "There is no mistake: 4 pictures show 4 plates"
    - "The key was used wrongly: 4 pictures show 6 plates"
    answer: 'The key was not used: 4 pictures show 8 plates'
    hints:
    - What does one picture stand for?
    - Skip count by that number for each picture.
    solution: 'Each 🙂 stands for 2 snacks. Skip count 2, 4, 6, 8: 4 pictures show 8 plates of chaat.'
    mistakes:
      "There is no mistake: 4 pictures show 4 plates": c3m14_key
      "The key was used wrongly: 4 pictures show 6 plates": c3m14_key
    exam: case
    difficulty: 2
  - prompt: 'Situation: A bar graph shows rides at the fair. The camel ride bar reaches 7 and the boat ride bar reaches 12. How many more people went on the boat ride?'
    options:
    - '5'
    - '19'
    - '12'
    answer: '5'
    hints:
    - Read the number at the top of each bar.
    - How many more means take the shorter from the longer.
    solution: The boat bar is 12 and the camel bar is 7. 12 − 7 = 5 more people went on the boat ride.
    mistakes:
      '19': c3m14_read
      '12': c3m14_read
    exam: competency
    difficulty: 2
- code: cbse3m.fair.shop
  title: Shopping at the fair
  after:
  - cbse3m.fair.data
  notes: |
    Mixed problems at a fair: buying several things (add), finding change (subtract), buying many of the same (multiply),
    sharing (divide). Read the question to choose the operation. Estimate: is the answer sensible?
  explanations:
    text: 'At a fair we add prices, find change, buy many of the same thing and share. Read the question carefully: does it ask for a total, what is left, many of the same, or a fair share?'
    visual: 'Draw a toy stall: a clay pot ₹30, a whistle ₹10, a bangle set ₹25.'
    step_by_step: 'Step 1: Read the question. Step 2: Decide: add, subtract, multiply or share. Step 3: Work it out. Step 4: Check that the answer makes sense.'
    real_world: Families visiting a fair plan a budget so they don't run out of money.
  picture:
    kind: compare
    columns:
    - title: Question asks
      points:
      - total cost
      - money left
      - many of the same
    - title: Do this
      points:
      - add
      - subtract
      - multiply
    alt: For a total cost, add; for money left, subtract; for many of the same, multiply.
  activity:
    type: formula
    prompt: At the fair, balloons cost ₹6 each. Set how many you buy.
    inputs:
    - name: n
      label: Balloons
      min: 0
      max: 10
      step: 1
      start: 0
    outputs:
    - name: cost
      label: Cost
      expr: 6*n
      unit: ₹
    - name: chg
      label: Change from ₹50
      expr: 50-6*n
      unit: ₹
    goals:
    - prompt: Spend ₹30.
      want:
        cost: 30
      mistakes:
      - when:
          n: 6
        say: 6 balloons cost ₹36. 30 is 5 sixes.
    - prompt: Buy as many as you can with ₹50.
      want:
        n: 8
      mistakes:
      - when:
          n: 9
        say: '9 balloons cost ₹54: more than ₹50.'
      - when:
          n:
          - 1
          - 7
        say: You can still buy one more.
    - prompt: Get ₹26 change.
      want:
        chg: 26
      mistakes:
      - when:
          n: 5
        say: 5 balloons cost ₹30, leaving ₹20. You spent 50 − 26 = 24.
  lesson:
    - teach: 'At a fair you buy, pay and share. Each story asks for one operation. Buying several different things: add. Money left or change: subtract.'
      check:
        prompt: 'A doll ₹40 and a ball ₹20. To find the total we:'
        options:
        - add
        - subtract
        - share
        answer: add
        why: We put two prices together.
      ways:
      - style: visual
        teach: Story words at the fair and which operation each one needs.
        picture:
          kind: compare
          columns:
          - title: Add or subtract
            points:
            - 'Different things together: add'
            - 'Money left or change: subtract'
          - title: Multiply or divide
            points:
            - 'Many of the same thing: multiply'
            - 'Sharing equally: divide'
          alt: Buying different things together means add. Money left or change means subtract. Buying many of the same thing means multiply. Sharing equally means divide.
      - style: real_world
        teach: 'Shopkeepers at a mela do all four in a day: they add up bills, give change, work out the cost of many of the same thing, and share the money among helpers at the end.'
    - teach: 'Buying many of the same thing: multiply. 4 balloons at ₹5 each: 4 × 5 = ₹20. Sharing equally: divide. ₹30 shared by 3 friends: ₹10 each.'
      picture:
        kind: compare
        columns:
        - title: Add
          points:
          - different things together
        - title: Subtract
          points:
          - money left
          - change
        - title: Multiply / Divide
          points:
          - many the same
          - share equally
        alt: Which operation fits which kind of fair story.
      check:
        prompt: 3 tickets at ₹10 each. Total?
        options:
        - ₹30
        - ₹13
        - ₹7
        answer: ₹30
        why: 3 × 10 = 30.
      ways:
      - style: step_by_step
        teach: 'Find the cost of 6 bangles at ₹4 each. Step 1: It is many of the same thing, so multiply. Step 2: Skip count by 4, six times: 4, 8, 12, 16, 20, 24. Step 3: The bangles cost ₹24.'
      - style: real_world
        teach: 'Four friends win ₹36 in a fair game and share it equally. Sharing equally means divide: 4 times what is 36? Since 4 × 9 = 36, each friend gets ₹9.'
    - teach: Before you finish, check if the answer makes sense. If you had ₹50 and spent some, the money left must be less than ₹50.
      check:
        prompt: You had ₹60 and bought a toy. Which could be the money left?
        options:
        - ₹25
        - ₹75
        - ₹100
        answer: ₹25
        why: Money left must be less than ₹60.
      ways:
      - style: visual
        teach: Does the answer make sense? A quick check after shopping.
        picture:
          kind: flow
          steps:
          - You had ₹60
          - You spent some money
          - Money left must be less than ₹60
          - If your answer is more than ₹60, check again
          alt: If you had ₹60 and spent some money, the money left must be less than ₹60. If your answer is more than ₹60, something went wrong, so check again.
      - style: real_world
        teach: 'Before paying at a fair, many people quickly estimate in their head: ''about ₹30 and about ₹20, so about ₹50.'' If the stall asks for ₹500, they know something is wrong.'
  items:
  - prompt: A clay pot costs ₹30 and a whistle ₹10. Total in ₹?
    answer: '40'
    check: 30 + 10
    difficulty: 1
    hints:
    - Add.
    - 30 + 10.
    solution: ₹40.
    mistakes: {"20": "m3_add_money", "310": "m3_add_money"}
  - prompt: 3 whistles at ₹10 each cost how many ₹?
    answer: '30'
    check: 3*10
    difficulty: 1
    hints:
    - 3 × 10.
    - 10 + 10 + 10.
    solution: ₹30.
    mistakes:
      '13': c3_count_once
  - prompt: Riya has ₹50 and buys a bangle set for ₹25. How much is left in ₹?
    answer: '25'
    check: 50 - 25
    difficulty: 1
    hints:
    - Subtract.
    - 50 − 25.
    solution: ₹25 left.
    mistakes:
      '75': c3_count_once
  - prompt: 4 friends share ₹40 of ride tickets equally. Each gets ₹?
    answer: '10'
    check: 40/4
    difficulty: 2
    hints:
    - Share equally.
    - 40 ÷ 4.
    solution: ₹10 each.
    mistakes:
      '36': c3_count_once
  - prompt: 'To find the money left after shopping, we:'
    options:
    - subtract
    - add
    - multiply
    - do nothing
    answer: subtract
    difficulty: 1
    hints:
    - Money goes away.
    - Take away.
    solution: We subtract.
    mistakes: {"add": "m3_money_left"}
  - prompt: A pot ₹30 and a bangle set ₹25. Pay ₹100. Change in ₹?
    answer: '45'
    check: 100 - (30 + 25)
    difficulty: 2
    hints:
    - 'First add: 30 + 25.'
    - Then 100 − 55.
    solution: 100 − 55 = ₹45.
    mistakes:
      '55': c3_count_once
  - prompt: A clay horse costs ₹45 and a mask ₹30. Total in ₹?
    answer: '75'
    check: 45+30
    difficulty: 1
    hints:
    - Add the two prices.
    - 45 + 30.
    solution: 'Step 1: 45 + 30. Step 2: = ₹75.'
    mistakes:
      '15': c3m14_op
      '65': c3m14_op
  - prompt: 5 bangles at ₹6 each. Total in ₹?
    answer: '30'
    check: 5*6
    difficulty: 1
    hints:
    - 'Many the same: multiply.'
    - 6, 12, 18...
    solution: 'Step 1: 5 × 6. Step 2: = ₹30.'
    mistakes:
      '11': c3m14_op
      '36': c3m14_op
  - prompt: Arjun has ₹80 and spends ₹35 on a toy. How much is left in ₹?
    answer: '45'
    check: 80-35
    difficulty: 2
    hints:
    - 'Money left: subtract.'
    - 80 − 35.
    solution: 'Step 1: 80 − 35. Step 2: = ₹45.'
    mistakes:
      '115': c3m14_op
      '55': c3m14_sense
  - prompt: 3 friends share ₹60 equally. How much each in ₹?
    answer: '20'
    check: 60/3
    difficulty: 2
    hints:
    - 'Sharing: divide.'
    - 3 × ? = 60.
    solution: 'Step 1: 60 ÷ 3. Step 2: = ₹20 each.'
    mistakes:
      '57': c3m14_op
      '180': c3m14_op
  - prompt: Which operation finds the cost of 4 tickets at ₹20 each?
    options:
    - multiply
    - subtract
    - divide
    answer: multiply
    difficulty: 1
    hints:
    - Many of the same thing.
    - 4 groups of 20.
    solution: 'Step 1: 4 tickets, same price. Step 2: Multiply: 4 × 20.'
    mistakes:
      subtract: c3m14_op
      divide: c3m14_op
  - prompt: A ride costs ₹15. Pay ₹50. Change in ₹?
    answer: '35'
    check: 50-15
    difficulty: 2
    hints:
    - 'Change: subtract.'
    - 15 → 20 → 50.
    solution: 'Step 1: 50 − 15. Step 2: = ₹35.'
    mistakes:
      '65': c3m14_op
      '45': c3m14_sense
  - prompt: Neha has ₹100 and spends some at the fair. Which answer for money left does NOT make sense?
    options:
    - ₹120
    - ₹40
    - ₹15
    answer: ₹120
    difficulty: 2
    hints:
    - After spending, money goes down.
    - Can it be more than ₹100?
    solution: 'Step 1: Money left is less than ₹100. Step 2: ₹120 cannot be right.'
    mistakes:
      ₹40: c3m14_sense
      ₹15: c3m14_sense
  - prompt: 2 pots at ₹25 each and a whistle at ₹10. Total in ₹?
    answer: '60'
    check: 2*25+10
    difficulty: 3
    hints:
    - 'Pots first: 2 × 25.'
    - Then add the whistle.
    solution: 'Step 1: 2 × 25 = 50. Step 2: 50 + 10 = ₹60.'
    mistakes:
      '35': c3m14_op
      '50': c3m14_op
  - prompt: 4 friends pay ₹10 each for a ride, using one ₹50 note. Change in ₹?
    answer: '10'
    check: 50-4*10
    difficulty: 3
    hints:
    - 'Cost: 4 × 10.'
    - Then change from ₹50.
    solution: 'Step 1: 4 × 10 = 40. Step 2: 50 − 40 = ₹10.'
    mistakes:
      '40': c3m14_op
      '46': c3m14_op
  - prompt: 'Case: At the fair, a child has ₹70. The child wants a kite for ₹32 and two balloons at ₹20 each. Can the child buy all three?'
    options:
    - "No, they cost ₹72 in all, so ₹2 more is needed"
    - "Yes, they cost ₹52 in all, so ₹18 will be left"
    - "Yes, they cost exactly ₹70 in all, just enough"
    answer: No, they cost ₹72 in all, so ₹2 more is needed
    hints:
    - First find the cost of the two balloons.
