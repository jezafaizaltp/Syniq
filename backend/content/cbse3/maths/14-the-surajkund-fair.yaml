# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 14. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 14
title: The Surajkund Fair
concepts:
- code: cbse3m.fair.data
  title: Collecting and reading data
  notes: |
    At a fair, we can count things and record them: tally marks, tables and picture graphs (pictographs, where one
    picture stands for one or more things). Reading data: which is most, which is least, how many more. Bar graphs show
    the same data as bars.
  explanations:
    text: Data means information we collect by counting. We can show it in a table or a picture graph. In a picture graph, each picture stands for a number of things. Then we can see which is most and which is least.
    visual: 'Draw a picture graph of stalls at a fair: 4 pots for pottery stalls, 6 bangles for bangle stalls, 2 toys for toy stalls.'
    step_by_step: 'Step 1: Count each kind. Step 2: Write or draw the counts. Step 3: Compare: most, least, how many more.'
    real_world: 'The Surajkund Crafts Fair in Haryana has stalls from all over India: pottery, cloth, toys and food.'
  picture:
    kind: bars
    bars:
    - label: Pottery
      value: 4
    - label: Bangles
      value: 6
    - label: Toys
      value: 2
    alt: There are 4 pottery stalls, 6 bangle stalls and 2 toy stalls.
    unit: stalls
  items:
  - prompt: Pottery 4, Bangles 6, Toys 2 stalls. Which has the most stalls?
    options:
    - Bangles
    - Pottery
    - Toys
    - all equal
    answer: Bangles
    difficulty: 1
    hints:
    - Find the biggest number.
    - '6.'
    solution: Bangles have the most.
  - prompt: Pottery 4, Bangles 6, Toys 2 stalls. Which has the fewest?
    options:
    - Toys
    - Bangles
    - Pottery
    - all equal
    answer: Toys
    difficulty: 1
    hints:
    - Smallest number.
    - '2.'
    solution: Toys have the fewest.
  - prompt: Pottery 4, Bangles 6, Toys 2 stalls. How many stalls in all?
    answer: '12'
    check: 4 + 6 + 2
    difficulty: 1
    hints:
    - Add all.
    - 4 + 6 + 2.
    solution: 12 stalls.
  - prompt: Bangles 6 and Toys 2. How many more bangle stalls?
    answer: '4'
    check: 6 - 2
    difficulty: 2
    hints:
    - Bigger − smaller.
    - 6 − 2.
    solution: 4 more.
    mistakes:
      '8': c3_count_once
  - prompt: In a picture graph, each 🙂 = 2 children. 5 faces mean how many children?
    answer: '10'
    check: 5*2
    difficulty: 2
    hints:
    - Each face is 2.
    - 5 × 2.
    solution: 10 children.
    mistakes:
      '5': c3_count_once
  - prompt: 'A picture graph uses:'
    options:
    - pictures to show numbers
    - only words
    - only colours
    - nothing
    answer: pictures to show numbers
    difficulty: 1
    hints:
    - Picture + graph.
    - Each picture counts.
    solution: A picture graph uses pictures to show numbers.
- code: cbse3m.fair.shop
  title: Shopping at the fair
  after:
  - cbse3m.fair.data
  notes: |
    Mixed problems at a fair: buying several things (add), finding change (subtract), buying many of the same (multiply),
    sharing (divide). Read the question to choose the operation. Estimate: is the answer sensible?
  explanations:
    text: 'At a fair we add prices, find change, buy many of the same thing and share. Read the question carefully: does it ask for a total, what is left, many of the same, or a fair share?'
    visual: 'Draw a toy stall: a clay pot ₹30, a whistle ₹10, a bangle set ₹25.'
    step_by_step: 'Step 1: Read the question. Step 2: Decide: add, subtract, multiply or share. Step 3: Work it out. Step 4: Check that the answer makes sense.'
    real_world: Families visiting a fair plan a budget so they don't run out of money.
  picture:
    kind: compare
    columns:
    - title: Question asks
      points:
      - total cost
      - money left
      - many of the same
    - title: Do this
      points:
      - add
      - subtract
      - multiply
    alt: For a total cost, add; for money left, subtract; for many of the same, multiply.
  items:
  - prompt: A clay pot costs ₹30 and a whistle ₹10. Total in ₹?
    answer: '40'
    check: 30 + 10
    difficulty: 1
    hints:
    - Add.
    - 30 + 10.
    solution: ₹40.
  - prompt: 3 whistles at ₹10 each cost how many ₹?
    answer: '30'
    check: 3*10
    difficulty: 1
    hints:
    - 3 × 10.
    - 10 + 10 + 10.
    solution: ₹30.
    mistakes:
      '13': c3_count_once
  - prompt: Riya has ₹50 and buys a bangle set for ₹25. How much is left in ₹?
    answer: '25'
    check: 50 - 25
    difficulty: 1
    hints:
    - Subtract.
    - 50 − 25.
    solution: ₹25 left.
    mistakes:
      '75': c3_count_once
  - prompt: 4 friends share ₹40 of ride tickets equally. Each gets ₹?
    answer: '10'
    check: 40/4
    difficulty: 2
    hints:
    - Share equally.
    - 40 ÷ 4.
    solution: ₹10 each.
    mistakes:
      '36': c3_count_once
  - prompt: 'To find the money left after shopping, we:'
    options:
    - subtract
    - add
    - multiply
    - do nothing
    answer: subtract
    difficulty: 1
    hints:
    - Money goes away.
    - Take away.
    solution: We subtract.
  - prompt: A pot ₹30 and a bangle set ₹25. Pay ₹100. Change in ₹?
    answer: '45'
    check: 100 - (30 + 25)
    difficulty: 2
    hints:
    - 'First add: 30 + 25.'
    - Then 100 − 55.
    solution: 100 − 55 = ₹45.
    mistakes:
      '55': c3_count_once
