# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 12
title: Give and Take
tips:
  m3_add_money: "Total cost means add the prices."
  m3_change: "Change = money paid minus the price. Count on from 7 to 10."
  m3_change_def: "The shopkeeper gives back what you paid extra. Is that adding or taking away?"
  m3_make_100: "Add each choice. Which one makes exactly 100?"
  m3_notes: "Count in 10s until you reach 50. How many notes?"
  c3m12_total: Line up the prices and add them, rupee by rupee or ten by ten.
  c3m12_count_up: Start at the price and count up to the money you gave. The count is your change.
  c3m12_notes: Lay the notes or coins out and skip count their values until you reach the amount.
  c3m12_check: 'Check: price + change should be exactly the money you gave.'

concepts:
- code: cbse3m.gt.money
  title: 'Money: notes and coins'
  notes: |
    Indian money: coins of ₹1, ₹2, ₹5, ₹10, ₹20; notes of ₹10, ₹20, ₹50, ₹100, ₹200, ₹500. Make an amount in different
    ways: ₹20 = ₹10 + ₹10 = ₹10 + ₹5 + ₹5. Adding prices to find the total cost.
  explanations:
    text: 'We pay with coins and notes. ₹20 can be made in many ways: two ₹10 notes, or a ₹10 note and two ₹5 coins. To find the total cost, add the prices.'
    visual: Draw a ₹10 note and two ₹5 coins and write ₹10 + ₹5 + ₹5 = ₹20.
    step_by_step: 'Step 1: Write each price. Step 2: Add them up. Step 3: Choose notes and coins that make that amount.'
    real_world: At a shop, a pencil for ₹5 and an eraser for ₹3 cost ₹8 in all.
  picture:
    kind: bars
    bars:
    - label: Pencil
      value: 5
    - label: Eraser
      value: 3
    - label: Total
      value: 8
    alt: A ₹5 pencil and a ₹3 eraser cost ₹8 in all.
    unit: ₹
  activity:
    type: formula
    prompt: Make ₹ amounts with ₹10 notes and ₹5 coins.
    inputs:
    - name: t
      label: ₹10 notes
      min: 0
      max: 10
      step: 1
      start: 0
    - name: f
      label: ₹5 coins
      min: 0
      max: 10
      step: 1
      start: 0
    outputs:
    - name: tot
      label: Total
      expr: 10*t+5*f
      unit: ₹
    goals:
    - prompt: Make ₹20 using one ₹10 note.
      want:
        t: 1
        tot: 20
      mistakes:
      - when:
          t: 1
          f: 10
        say: 'That''s ₹60. Each coin is ₹5: two of them make ₹10.'
    - prompt: Make ₹35.
      want:
        tot: 35
      mistakes:
      - when:
          tot: 30
        say: Close. ₹5 more.
      - when:
          tot: 40
        say: ₹5 too much.
    - prompt: Make ₹50 using only ₹5 coins.
      want:
        t: 0
        tot: 50
      mistakes:
      - when:
          t: 0
          f: 5
        say: 5 coins of ₹5 is ₹25. Count in 5s to 50.
  lesson:
    - teach: Indian money comes as coins (₹1, ₹2, ₹5, ₹10, ₹20) and notes (₹10, ₹20, ₹50, ₹100, ₹200, ₹500). Each has a number on it that tells its value.
      check:
        prompt: Which is a note, not a coin, in India?
        options:
        - ₹100
        - ₹1
        - ₹2
        answer: ₹100
        why: ₹1 and ₹2 come as coins; ₹100 is a note.
      ways:
      - style: visual
        teach: Indian coins and notes, sorted from small values to big values.
        picture:
          kind: compare
          columns:
          - title: Coins
            points:
            - ₹1
            - ₹2
            - ₹5
            - ₹10
            - ₹20
          - title: Notes
            points:
            - ₹10
            - ₹20
            - ₹50
            - ₹100
            - ₹200
            - ₹500
          alt: Indian coins are ₹1, ₹2, ₹5, ₹10 and ₹20. Indian notes are ₹10, ₹20, ₹50, ₹100, ₹200 and ₹500.
      - style: real_world
        teach: The ₹10 and ₹20 come both as coins and as notes. A coin and a note with the same number are worth exactly the same.
    - teach: One amount can be made in many ways. ₹50 = one ₹50 note, or five ₹10 notes, or two ₹20 notes and one ₹10 note. Skip count to check.
      picture:
        kind: compare
        columns:
        - title: Way 1
          points:
          - ₹50 note
        - title: Way 2
          points:
          - ₹10 × 5
        - title: Way 3
          points:
          - ₹20
          - ₹20
          - ₹10
        alt: Three different ways to make ₹50.
      check:
        prompt: How many ₹5 coins make ₹20?
        options:
        - '4'
        - '5'
        - '15'
        answer: '4'
        why: '5, 10, 15, 20: four coins.'
      ways:
      - style: visual
        teach: Three different ways to make the same amount, ₹70.
        picture:
          kind: compare
          columns:
          - title: Way 1
            points:
            - ₹50 + ₹20
          - title: Way 2
            points:
            - Seven ₹10 notes
          - title: Way 3
            points:
            - ₹20 + ₹20 + ₹20 + ₹10
          alt: ₹70 can be one ₹50 note and one ₹20 note, or seven ₹10 notes, or three ₹20 notes and one ₹10 note.
      - style: step_by_step
        teach: 'Count a pile of money. Step 1: Sort the notes and coins by value. Step 2: Start with the biggest. Step 3: Skip count each group: 50, 70, 90, 95, 97. Step 4: The last number is the total.'
    - teach: 'To find the total cost, add the prices. A pen ₹12 and a notebook ₹25: 12 + 25 = ₹37.'
      check:
        prompt: A ball costs ₹20 and a bat ₹30. Total?
        options:
        - ₹50
        - ₹10
        - ₹2030
        answer: ₹50
        why: 20 + 30 = 50.
      ways:
      - style: step_by_step
        teach: 'Add the cost of a ruler at ₹18 and a sharpener at ₹26. Step 1: Add the tens: 10 + 20 = 30. Step 2: Add the ones: 8 + 6 = 14. Step 3: 30 + 14 = ₹44.'
      - style: visual
        teach: Adding ₹18 and ₹26 by splitting into tens and ones.
        picture:
          kind: compare
          columns:
          - title: Tens
            points:
            - 10 + 20
            - = 30
          - title: Ones
            points:
            - 8 + 6
            - = 14
          - title: Total
            points:
            - 30 + 14
            - = ₹44
          alt: '₹18 + ₹26: the tens make 10 + 20 = 30, the ones make 8 + 6 = 14, and 30 + 14 = ₹44.'
  items:
  - prompt: A pencil costs ₹5 and an eraser ₹3. Total cost in ₹?
    answer: '8'
    check: 5 + 3
    difficulty: 1
    hints:
    - Add the prices.
    - 5 + 3.
    solution: ₹5 + ₹3 = ₹8.
    mistakes: {"2": "m3_add_money", "15": "m3_add_money"}
  - prompt: How many ₹10 notes make ₹50?
    answer: '5'
    check: 50/10
    difficulty: 1
    hints:
    - Count in 10s to 50.
    - 10, 20, 30, 40, 50.
    solution: 5 notes of ₹10.
    mistakes: {"10": "m3_notes", "500": "m3_notes"}
  - prompt: ₹10 + ₹5 + ₹5 = ₹?
    answer: '20'
    check: 10 + 5 + 5
    difficulty: 1
    hints:
    - Add.
    - 10 + 10.
    solution: ₹20.
    mistakes: {"15": "m3_add_money", "25": "m3_add_money"}
  - prompt: How many ₹2 coins make ₹10?
    answer: '5'
    check: 10/2
    difficulty: 2
    hints:
    - Count in 2s to 10.
    - 10 ÷ 2.
    solution: 5 coins of ₹2.
    mistakes:
      '8': c3_count_once
  - prompt: A book costs ₹45 and a pen ₹15. Total in ₹?
    answer: '60'
    check: 45 + 15
    difficulty: 2
    hints:
    - 45 + 15.
    - 5 + 5 = 10, carry.
    solution: ₹60.
    mistakes:
      '50': c3_place
  - prompt: Which makes ₹100?
    options:
    - two ₹50 notes
    - two ₹20 notes
    - five ₹10 notes
    - one ₹50 note
    answer: two ₹50 notes
    difficulty: 1
    hints:
    - 50 + 50.
    - Check each.
    solution: ₹50 + ₹50 = ₹100.
    mistakes: {"five ₹10 notes": "m3_make_100"}
  - prompt: How many ₹20 notes make ₹100?
    answer: '5'
    check: 100/20
    difficulty: 1
    hints:
    - Skip count by 20.
    - 20, 40, 60...
    solution: 'Step 1: 20, 40, 60, 80, 100. Step 2: 5 notes.'
    mistakes:
      '4': c3m12_notes
      '80': c3m12_notes
  - prompt: ₹50 + ₹20 + ₹5 = ₹?
    answer: '75'
    check: 50+20+5
    difficulty: 1
    hints:
    - Add the big ones first.
    - 50 + 20, then + 5.
    solution: 'Step 1: 50 + 20 = 70. Step 2: 70 + 5 = 75.'
    mistakes:
      '70': c3m12_total
      '502005': c3m12_total
  - prompt: A notebook costs ₹28 and a pencil box ₹35. Total in ₹?
    answer: '63'
    check: 28+35
    difficulty: 2
    hints:
    - Add tens and ones.
    - 8 + 5 needs a carry.
    solution: 'Step 1: 8 + 5 = 13, carry 1. Step 2: 20 + 30 + 10 = 60, total 63.'
    mistakes:
      '53': c3m12_total
      '7': c3m12_total
  - prompt: Which does NOT make ₹30?
    options:
    - ₹20 + ₹5
    - ₹10 + ₹10 + ₹10
    - ₹20 + ₹10
    answer: ₹20 + ₹5
    difficulty: 2
    hints:
    - Add each set.
    - Which total is not 30?
    solution: 'Step 1: 20 + 5 = 25. Step 2: The others make 30.'
    mistakes:
      ₹10 + ₹10 + ₹10: c3m12_notes
      ₹20 + ₹10: c3m12_notes
  - prompt: How many ₹1 coins make ₹10?
    answer: '10'
    check: '10'
    difficulty: 1
    hints:
    - Each coin is ₹1.
    - Count to 10.
    solution: 'Step 1: One rupee for each coin. Step 2: 10 coins.'
    mistakes:
      '1': c3m12_notes
      '5': c3m12_notes
  - prompt: 3 ₹10 notes and 4 ₹2 coins make how many ₹?
    answer: '38'
    check: 3*10+4*2
    difficulty: 2
    hints:
    - 'Notes: 10, 20, 30.'
    - 'Coins: 2, 4, 6, 8.'
    solution: 'Step 1: Notes = 30, coins = 8. Step 2: 30 + 8 = 38.'
    mistakes:
      '7': c3m12_notes
      '34': c3m12_notes
  - prompt: A toy costs ₹65. Which is enough to pay?
    options:
    - ₹50 + ₹20
    - ₹50 + ₹10
    - ₹20 + ₹20 + ₹20
    answer: ₹50 + ₹20
    difficulty: 2
    hints:
    - Add each set.
    - It must be ₹65 or more.
    solution: 'Step 1: 70, 60, 60. Step 2: Only ₹70 is enough.'
    mistakes:
      ₹50 + ₹10: c3m12_total
      ₹20 + ₹20 + ₹20: c3m12_total
  - prompt: Kiran saves ₹5 each day for 6 days. How much is saved?
    answer: '30'
    check: 5*6
    difficulty: 2
    hints:
    - ₹5, six times.
    - Skip count by 5.
    solution: 'Step 1: 5, 10, 15, 20, 25, 30. Step 2: ₹30.'
    mistakes:
      '11': c3m12_total
      '25': c3m12_notes
  - prompt: Fruit costs ₹40, vegetables ₹35 and milk ₹25. What is the total in ₹?
    answer: '100'
    check: 40+35+25
    difficulty: 3
    hints:
    - Add two first.
    - 35 + 25 makes a round number.
    solution: 'Step 1: 35 + 25 = 60. Step 2: 60 + 40 = 100.'
    mistakes:
      '90': c3m12_total
      '95': c3m12_total
  - prompt: 'Case: Before a school trip, a child has to pay ₹85. The child has one ₹50 note, two ₹20 notes, one ₹10 note and one ₹5 coin. Which notes and coins make exactly ₹85?'
    options:
    - ₹50 + ₹20 + ₹10 + ₹5
    - ₹50 + ₹20 + ₹20
    - ₹20 + ₹20 + ₹10 + ₹5
    answer: ₹50 + ₹20 + ₹10 + ₹5
    hints:
    - Start with the biggest note and skip count.
    - 'Check each choice: does it stop exactly at 85?'
    solution: ₹50 + ₹20 = ₹70, + ₹10 = ₹80, + ₹5 = ₹85. That is exactly ₹85.
    mistakes:
      ₹50 + ₹20 + ₹20: c3m12_notes
      ₹20 + ₹20 + ₹10 + ₹5: c3m12_notes
    exam: case
    difficulty: 2
  - prompt: 'Situation: You want to buy a storybook for ₹46 and a pencil box for ₹38. You have ₹80. Do you have enough?'
    options:
    - No, the total is ₹84, so ₹4 more is needed
    - Yes, the total is ₹74
    - Yes, exactly ₹80
    answer: No, the total is ₹84, so ₹4 more is needed
    hints:
    - Add the two prices, tens first, then ones.
    - Compare the total with ₹80.
    solution: '₹46 + ₹38: tens 40 + 30 = 70, ones 6 + 8 = 14. 70 + 14 = ₹84. That is ₹4 more than ₹80.'
    mistakes:
      Yes, the total is ₹74: c3m12_total
      Yes, exactly ₹80: c3m12_total
    exam: competency
    difficulty: 2
- code: cbse3m.gt.change
  title: Paying and getting change
  after:
  - cbse3m.gt.money
  notes: |
    Change = money given − cost. Pay ₹20 for a ₹12 toy, get ₹8 back. Count up from the cost: 12 → 20 is 8. Checking:
    cost + change = money given.
  explanations:
    text: If you pay more than the price, the shopkeeper gives you change. Change is the money you paid minus the price. Count up from the price to the money you gave.
    visual: 'Draw a number line from 12 to 20 and jump up: 12 to 20 is 8. That is the change.'
    step_by_step: 'Step 1: Write the money given. Step 2: Write the price. Step 3: Subtract (or count up). Step 4: Check: price + change = money given.'
    real_world: Pay ₹50 for a ₹35 snack and the shopkeeper gives back ₹15.
  picture:
    kind: number_line
    from: 10
    to: 20
    step: 1
    points:
    - at: 12
      label: price ₹12
    - at: 20
      label: paid ₹20
    alt: Counting up from a price of ₹12 to ₹20 paid is 8, so the change is ₹8.
    jumps:
    - from: 12
      to: 20
      label: change ₹8
  activity:
    type: formula
    prompt: You pay with a ₹50 note. Set the price.
    inputs:
    - name: x
      label: Price
      min: 0
      max: 50
      step: 1
      start: 0
      unit: ₹
    outputs:
    - name: chg
      label: Change
      expr: 50-x
      unit: ₹
    goals:
    - prompt: You get ₹15 change. What did it cost?
      want:
        chg: 15
      mistakes:
      - when:
          x: 15
        say: ₹15 is the change. The price is 50 − 15.
    - prompt: A toy costs ₹32. Set the price and read the change.
      want:
        x: 32
      mistakes:
      - when:
          x: 18
        say: ₹18 is the change. Set the price, ₹32.
    - prompt: You get ₹8 change.
      want:
        chg: 8
      mistakes:
      - when:
          x: 8
        say: ₹8 came back to you. The price is 50 − 8.
  lesson:
    - teach: 'When you pay more than the price, the shopkeeper gives back change. Change = money given − price. Pay ₹20 for a ₹15 snack: change is ₹5.'
      check:
        prompt: Pay ₹10 for a ₹6 pencil. Change?
        options:
        - ₹4
        - ₹16
        - ₹6
        answer: ₹4
        why: 10 − 6 = 4.
      ways:
      - style: visual
        teach: Change is the money paid minus the price of the thing.
        picture:
          kind: flow
          steps:
          - You give the shopkeeper a note
          - The price is taken out
          - What is left comes back to you
          - That is your change
          alt: You give the shopkeeper a note, the price is taken out, and what is left comes back to you. That is your change.
      - style: real_world
        teach: When an auto ride costs ₹40 and you pay with a ₹50 note, the driver gives back a ₹10 note. Paying more than the price means you get change.
    - teach: 'Shopkeepers often count up from the price. Price ₹36, paid ₹50: 36 → 40 is 4, 40 → 50 is 10, so change is 4 + 10 = ₹14.'
      picture:
        kind: number_line
        from: 30
        to: 50
        step: 2
        jumps:
        - from: 36
          to: 40
        - from: 40
          to: 50
        alt: Counting up from 36 to 40 (4) and 40 to 50 (10) gives ₹14 change.
      check:
        prompt: 'Price ₹45, paid ₹50. Count up: change?'
        options:
        - ₹5
        - ₹15
        - ₹95
        answer: ₹5
        why: 45 → 50 is 5.
      ways:
      - style: visual
        teach: Counting up from ₹27 to ₹50, the way shopkeepers do.
        picture:
          kind: number_line
          from: 25
          to: 50
          step: 1
          jumps:
          - from: 27
            to: 30
            label: '+3'
          - from: 30
            to: 50
            label: '+20'
          alt: Count up from 27 to 30, which is 3, then from 30 to 50, which is 20. The change is 3 + 20 = ₹23.
      - style: step_by_step
        teach: 'Find the change from ₹100 for a ₹66 cap. Step 1: Count up from 66 to 70: ₹4. Step 2: Count up from 70 to 100: ₹30. Step 3: Add them: 4 + 30 = ₹34.'
    - teach: 'Always check: price + change = money given. If ₹36 + ₹14 = ₹50, the change was right.'
      check:
        prompt: Price ₹28, change ₹2. How much was paid?
        options:
        - ₹30
        - ₹26
        - ₹56
        answer: ₹30
        why: 28 + 2 = 30.
      ways:
      - style: step_by_step
        teach: 'Check your change before you leave. Step 1: Look at the price. Step 2: Add the change you got to the price. Step 3: If it makes the note you gave, the change is right. If not, ask politely.'
      - style: visual
        teach: 'Checking the change: price + change should equal the note you gave.'
        picture:
          kind: flow
          steps:
          - 'Price: ₹66'
          - 'Change you got: ₹34'
          - 66 + 34 = 100
          - You gave ₹100, so the change is right
          alt: The price is ₹66 and the change is ₹34. 66 + 34 = 100. You gave ₹100, so the change is right.
  items:
  - prompt: You pay ₹20 for a ₹12 toy. Change in ₹?
    answer: '8'
    check: 20 - 12
    difficulty: 1
    hints:
    - 20 − 12.
    - Count up from 12.
    solution: ₹20 − ₹12 = ₹8.
    mistakes:
      '32': c3_count_once
  - prompt: You pay ₹10 for a ₹7 pen. Change in ₹?
    answer: '3'
    check: 10 - 7
    difficulty: 1
    hints:
    - 10 − 7.
    - Count up 8, 9, 10.
    solution: ₹3.
    mistakes: {"17": "m3_change", "7": "m3_change"}
  - prompt: You pay ₹50 for a ₹35 snack. Change in ₹?
    answer: '15'
    check: 50 - 35
    difficulty: 2
    hints:
    - 50 − 35.
    - 35 → 40 → 50.
    solution: ₹15.
    mistakes:
      '25': c3_place
  - prompt: You pay ₹100 for a ₹60 book. Change in ₹?
    answer: '40'
    check: 100 - 60
    difficulty: 1
    hints:
    - 100 − 60.
    - Count up in 10s.
    solution: ₹40.
    mistakes: {"160": "m3_change", "60": "m3_change"}
  - prompt: Price ₹23, change ₹7. How much did you pay in ₹?
    answer: '30'
    check: 23 + 7
    difficulty: 2
    hints:
    - Price + change = money given.
    - 23 + 7.
    solution: ₹30.
    mistakes:
      '16': c3_count_once
  - prompt: 'Change is:'
    options:
    - money paid minus the price
    - price plus money paid
    - the price only
    - always ₹10
    answer: money paid minus the price
    difficulty: 1
    hints:
    - What you gave back.
    - Extra money.
    solution: Change = money paid − price.
    mistakes: {"price plus money paid": "m3_change_def"}
  - prompt: Pay ₹50 for a ₹42 kite. Change in ₹?
    answer: '8'
    check: 50-42
    difficulty: 1
    hints:
    - Count up from 42 to 50.
    - 42 → 50.
    solution: 'Step 1: 50 − 42. Step 2: = ₹8.'
    mistakes:
      '92': c3m12_count_up
      '12': c3m12_count_up
  - prompt: Pay ₹100 for a ₹75 shirt. Change in ₹?
    answer: '25'
    check: 100-75
    difficulty: 2
    hints:
    - 75 → 80 → 100.
    - 5 + 20.
    solution: 'Step 1: 75 → 80 is 5, 80 → 100 is 20. Step 2: 5 + 20 = ₹25.'
    mistakes:
      '35': c3m12_count_up
      '175': c3m12_count_up
  - prompt: Pay ₹20 for a ₹20 book. Change in ₹?
    answer: '0'
    check: 20-20
    difficulty: 1
    hints:
    - You paid exactly the price.
    - 20 − 20.
    solution: 'Step 1: 20 − 20. Step 2: = ₹0, no change.'
    mistakes:
      '20': c3m12_count_up
      '40': c3m12_count_up
  - prompt: Price ₹64, change ₹36. How much was paid in ₹?
    answer: '100'
    check: 64+36
    difficulty: 2
    hints:
    - Price + change = paid.
    - 64 + 36.
    solution: 'Step 1: 64 + 36. Step 2: = ₹100.'
    mistakes:
      '28': c3m12_check
      '90': c3m12_check
  - prompt: 'A shopkeeper says: price ₹18, you paid ₹20, change ₹3. Is that right?'
    options:
    - no, the change should be ₹2
    - yes, it is right
    - no, the change should be ₹38
    answer: no, the change should be ₹2
    difficulty: 2
    hints:
    - 'Check: price + change = paid.'
    - 18 + 3 = ?
    solution: 'Step 1: 18 + 3 = 21, not 20. Step 2: Change should be 20 − 18 = ₹2.'
