# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 12
title: Give and Take
concepts:
- code: cbse3m.gt.money
  title: 'Money: notes and coins'
  notes: |
    Indian money: coins of ₹1, ₹2, ₹5, ₹10, ₹20; notes of ₹10, ₹20, ₹50, ₹100, ₹200, ₹500. Make an amount in different
    ways: ₹20 = ₹10 + ₹10 = ₹10 + ₹5 + ₹5. Adding prices to find the total cost.
  explanations:
    text: 'We pay with coins and notes. ₹20 can be made in many ways: two ₹10 notes, or a ₹10 note and two ₹5 coins. To find the total cost, add the prices.'
    visual: Draw a ₹10 note and two ₹5 coins and write ₹10 + ₹5 + ₹5 = ₹20.
    step_by_step: 'Step 1: Write each price. Step 2: Add them up. Step 3: Choose notes and coins that make that amount.'
    real_world: At a shop, a pencil for ₹5 and an eraser for ₹3 cost ₹8 in all.
  picture:
    kind: bars
    bars:
    - label: Pencil
      value: 5
    - label: Eraser
      value: 3
    - label: Total
      value: 8
    alt: A ₹5 pencil and a ₹3 eraser cost ₹8 in all.
    unit: ₹
  items:
  - prompt: A pencil costs ₹5 and an eraser ₹3. Total cost in ₹?
    answer: '8'
    check: 5 + 3
    difficulty: 1
    hints:
    - Add the prices.
    - 5 + 3.
    solution: ₹5 + ₹3 = ₹8.
  - prompt: How many ₹10 notes make ₹50?
    answer: '5'
    check: 50/10
    difficulty: 1
    hints:
    - Count in 10s to 50.
    - 10, 20, 30, 40, 50.
    solution: 5 notes of ₹10.
  - prompt: ₹10 + ₹5 + ₹5 = ₹?
    answer: '20'
    check: 10 + 5 + 5
    difficulty: 1
    hints:
    - Add.
    - 10 + 10.
    solution: ₹20.
  - prompt: How many ₹2 coins make ₹10?
    answer: '5'
    check: 10/2
    difficulty: 2
    hints:
    - Count in 2s to 10.
    - 10 ÷ 2.
    solution: 5 coins of ₹2.
    mistakes:
      '8': c3_count_once
  - prompt: A book costs ₹45 and a pen ₹15. Total in ₹?
    answer: '60'
    check: 45 + 15
    difficulty: 2
    hints:
    - 45 + 15.
    - 5 + 5 = 10, carry.
    solution: ₹60.
    mistakes:
      '50': c3_place
  - prompt: Which makes ₹100?
    options:
    - two ₹50 notes
    - two ₹20 notes
    - five ₹10 notes
    - one ₹50 note
    answer: two ₹50 notes
    difficulty: 1
    hints:
    - 50 + 50.
    - Check each.
    solution: ₹50 + ₹50 = ₹100.
- code: cbse3m.gt.change
  title: Paying and getting change
  after:
  - cbse3m.gt.money
  notes: |
    Change = money given − cost. Pay ₹20 for a ₹12 toy, get ₹8 back. Count up from the cost: 12 → 20 is 8. Checking:
    cost + change = money given.
  explanations:
    text: If you pay more than the price, the shopkeeper gives you change. Change is the money you paid minus the price. Count up from the price to the money you gave.
    visual: 'Draw a number line from 12 to 20 and jump up: 12 to 20 is 8. That is the change.'
    step_by_step: 'Step 1: Write the money given. Step 2: Write the price. Step 3: Subtract (or count up). Step 4: Check: price + change = money given.'
    real_world: Pay ₹50 for a ₹35 snack and the shopkeeper gives back ₹15.
  picture:
    kind: number_line
    from: 10
    to: 20
    step: 1
    points:
    - at: 12
      label: price ₹12
    - at: 20
      label: paid ₹20
    alt: Counting up from a price of ₹12 to ₹20 paid is 8, so the change is ₹8.
    jumps:
    - from: 12
      to: 20
      label: change ₹8
  items:
  - prompt: You pay ₹20 for a ₹12 toy. Change in ₹?
    answer: '8'
    check: 20 - 12
    difficulty: 1
    hints:
    - 20 − 12.
    - Count up from 12.
    solution: ₹20 − ₹12 = ₹8.
    mistakes:
      '32': c3_count_once
  - prompt: You pay ₹10 for a ₹7 pen. Change in ₹?
    answer: '3'
    check: 10 - 7
    difficulty: 1
    hints:
    - 10 − 7.
    - Count up 8, 9, 10.
    solution: ₹3.
  - prompt: You pay ₹50 for a ₹35 snack. Change in ₹?
    answer: '15'
    check: 50 - 35
    difficulty: 2
    hints:
    - 50 − 35.
    - 35 → 40 → 50.
    solution: ₹15.
    mistakes:
      '25': c3_place
  - prompt: You pay ₹100 for a ₹60 book. Change in ₹?
    answer: '40'
    check: 100 - 60
    difficulty: 1
    hints:
    - 100 − 60.
    - Count up in 10s.
    solution: ₹40.
  - prompt: Price ₹23, change ₹7. How much did you pay in ₹?
    answer: '30'
    check: 23 + 7
    difficulty: 2
    hints:
    - Price + change = money given.
    - 23 + 7.
    solution: ₹30.
    mistakes:
      '16': c3_count_once
  - prompt: 'Change is:'
    options:
    - money paid minus the price
    - price plus money paid
    - the price only
    - always ₹10
    answer: money paid minus the price
    difficulty: 1
    hints:
    - What you gave back.
    - Extra money.
    solution: Change = money paid − price.
