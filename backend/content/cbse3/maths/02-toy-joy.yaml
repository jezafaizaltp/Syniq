# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 2
title: Toy Joy
tips:
  m3_clown_hat: "A clown's hat is round at the bottom and pointed at the top."
  m3_cone_base: "From the side a cone looks pointed, but its base is round."
  m3_dice_face: "All faces of a dice are flat with 4 equal straight sides."
  m3_no_flat: "A cone has a flat round base. Which shape is curved all over?"
  m3_only_roll: "A cylinder can stand on its flat end and slide. Which shape has no flat face at all?"
  m3_tin_end: "The end of a tin is round."

concepts:
- code: cbse3m.toy.solids
  title: Solid shapes in toys
  notes: |
    Toys are made of solid (3D) shapes: a ball is a sphere, a dice is a cube, a box is a cuboid, a drum or tin is a
    cylinder, a party hat or ice-cream cone is a cone. Solids have faces (flat or curved). A sphere only rolls, a cube
    only slides, a cylinder can roll and slide.
  explanations:
    text: Many toys are built from solid shapes. A ball is a sphere, a dice is a cube, a box is a cuboid, a drum is a cylinder and a clown's hat is a cone. Round shapes roll; flat-faced shapes slide.
    visual: 'Draw a toy train: a cuboid engine, cylinder wheels and a cone on top for a chimney.'
    step_by_step: 'Step 1: Look at the toy. Step 2: Are its faces flat, curved or both? Step 3: Name the solid.'
    real_world: Wooden toys from Channapatna are made of cylinders, spheres and cones.
  picture:
    kind: compare
    columns:
    - title: Solid
      points:
      - Sphere
      - Cube
      - Cylinder
    - title: Toy
      points:
      - ball
      - dice, blocks
      - drum, tin
    alt: A sphere is like a ball, a cube like a dice or block, and a cylinder like a drum or tin.
  activity:
    type: sort
    prompt: Which shape is the toy?
    bins:
    - Sphere
    - Cube
    - Cuboid
    - Cylinder
    - Cone
    items:
    - label: A ball
      bin: Sphere
      clue: Round all over.
      why: A sphere.
    - label: A marble
      bin: Sphere
      clue: Tiny and round.
      why: A sphere.
    - label: A dice
      bin: Cube
      clue: All faces the same square.
      why: A cube.
    - label: A toy block with equal sides
      bin: Cube
      clue: Same length every way.
      why: A cube.
    - label: A shoe box
      bin: Cuboid
      clue: Long, with flat faces.
      why: A cuboid.
    - label: A drum
      bin: Cylinder
      clue: Round at the top and bottom.
      why: A cylinder.
    - label: A pencil box tin, round
      bin: Cylinder
      clue: Rolls on its side.
      why: A cylinder.
    - label: A clown's hat
      bin: Cone
      clue: Pointy at the top.
      why: A cone.
  items:
  - prompt: 'A ball is shaped like a:'
    options:
    - sphere
    - cube
    - cone
    - cuboid
    answer: sphere
    difficulty: 1
    hints:
    - Round all over.
    - It rolls everywhere.
    solution: A ball is a sphere.
    mistakes: {"cube": "m4_sphere"}
  - prompt: 'A dice is shaped like a:'
    options:
    - cube
    - sphere
    - cone
    - cylinder
    answer: cube
    difficulty: 1
    hints:
    - All faces are squares.
    - Six faces.
    solution: A dice is a cube.
    mistakes: {"sphere": "m4_dice"}
  - prompt: Which shape can roll and also slide?
    options:
    - cylinder
    - cube
    - sphere
    - cuboid
    answer: cylinder
    difficulty: 2
    hints:
    - Flat ends and a curved side.
    - Like a drum.
    solution: A cylinder rolls on its curved side and slides on its flat end.
    mistakes: {"sphere": "m4_roll_slide"}
  - prompt: 'A clown''s hat is shaped like a:'
    options:
    - cone
    - cube
    - cylinder
    - sphere
    answer: cone
    difficulty: 1
    hints:
    - Pointed at the top.
    - Round at the bottom.
    solution: A clown's hat is a cone.
    mistakes: {"cylinder": "m3_clown_hat"}
  - prompt: How many faces does a cube have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'Think of a dice: numbers 1 to 6.'
    - Count.
    solution: A cube has 6 faces.
    mistakes: {"4": "m5_cube_faces", "8": "m5_cube_faces"}
  - prompt: Which shape can only roll, never slide?
    options:
    - sphere
    - cube
    - cylinder
    - cuboid
    answer: sphere
    difficulty: 2
    hints:
    - It has no flat face.
    - A ball.
    solution: A sphere has no flat face, so it only rolls.
    mistakes: {"cylinder": "m3_only_roll"}
- code: cbse3m.toy.faces
  title: Tracing faces of solids
  after:
  - cbse3m.toy.solids
  notes: |
    If you trace the flat face of a solid on paper, you get a flat (2D) shape: a cube gives a square, a cuboid gives
    rectangles (and sometimes squares), a cylinder's flat end gives a circle, a cone's base gives a circle. A sphere has
    no flat face to trace.
  explanations:
    text: Put a solid on paper and draw around its flat face. A cube gives a square, a box gives a rectangle, and a tin or cone gives a circle.
    visual: Trace around a matchbox, a dice and a bangle-box on paper and name the shapes you get.
    step_by_step: 'Step 1: Find a flat face. Step 2: Put it on paper and draw around it. Step 3: Name the flat shape.'
    real_world: 'Kids make stamps by dipping the flat end of a cylinder in paint: it prints circles.'
  picture:
    kind: flow
    steps:
    - Pick a solid
    - Place its flat face on paper
    - Draw around it
    - Name the flat shape
    alt: Pick a solid, place its flat face on paper, draw around it, and name the flat shape you get.
  activity:
    type: sort
    prompt: Trace around the flat face. What shape do you get?
    bins:
    - Square
    - Rectangle
    - Circle
    items:
    - label: A dice
      bin: Square
      clue: All sides of the face are the same.
      why: A square.
    - label: A toy block with equal sides
      bin: Square
      clue: Equal sides.
      why: A square.
    - label: A matchbox, on its big face
      bin: Rectangle
      clue: Long and short sides.
      why: A rectangle.
    - label: A brick
      bin: Rectangle
      clue: Longer than it is wide.
      why: A rectangle.
    - label: The bottom of a tin
      bin: Circle
      clue: Round.
      why: A circle.
    - label: The bottom of an ice-cream cone
      bin: Circle
      clue: Round opening.
      why: A circle.
    - label: The end of a drum
      bin: Circle
      clue: Round.
      why: A circle.
  items:
  - prompt: 'Tracing a face of a dice gives a:'
    options:
    - square
    - circle
    - triangle
    - rectangle that is very long
    answer: square
    difficulty: 1
    hints:
    - All faces of a cube are the same.
    - Equal sides.
    solution: A cube's face is a square.
    mistakes: {"circle": "m3_dice_face"}
  - prompt: 'Tracing the flat end of a tin gives a:'
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - The end is round.
    - Like a coin.
    solution: The end of a cylinder is a circle.
    mistakes: {"square": "m3_tin_end"}
  - prompt: 'Tracing the long face of a matchbox gives a:'
    options:
    - rectangle
    - circle
    - triangle
    - cone
    answer: rectangle
    difficulty: 1
    hints:
    - Longer than it is wide.
    - Four corners.
    solution: It gives a rectangle.
    mistakes: {"circle": "m4_matchbox"}
  - prompt: Which solid has no flat face to trace?
    options:
    - sphere
    - cube
    - cone
    - cylinder
    answer: sphere
    difficulty: 2
    hints:
    - It is round everywhere.
    - A ball.
    solution: A sphere has no flat face.
    mistakes: {"cone": "m3_no_flat"}
  - prompt: How many circles can you trace from one cylinder?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Look at both ends.
    - Top and bottom.
    solution: A cylinder has 2 flat circle ends.
    mistakes:
      '1': c3_count_once
  - prompt: 'Tracing the base of an ice-cream cone gives a:'
    options:
    - circle
    - triangle
    - square
    - star
    answer: circle
    difficulty: 1
    hints:
    - The open end is round.
    - Base.
    solution: The base of a cone is a circle.
    mistakes: {"triangle": "m3_cone_base"}
