# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 2
title: Toy Joy
tips:
  m3_clown_hat: "A clown's hat is round at the bottom and pointed at the top."
  m3_cone_base: "From the side a cone looks pointed, but its base is round."
  m3_dice_face: "All faces of a dice are flat with 4 equal straight sides."
  m3_no_flat: "A cone has a flat round base. Which shape is curved all over?"
  m3_only_roll: "A cylinder can stand on its flat end and slide. Which shape has no flat face at all?"
  m3_tin_end: "The end of a tin is round."
  c3m2_roll: Imagine the toy on a slope. A curved surface lets it roll; a flat face lets it slide.
  c3m2_face: Run your finger over the toy. Count each flat face you can press flat on a table.
  c3m2_trace: Press only the flat face on paper and draw round it. What outline would you see?
  c3m2_name: 'Think of a real thing with that shape in your house: a ball, a dice, a tin, a cap.'

concepts:
- code: cbse3m.toy.solids
  title: Solid shapes in toys
  notes: |
    Toys are made of solid (3D) shapes: a ball is a sphere, a dice is a cube, a box is a cuboid, a drum or tin is a
    cylinder, a party hat or ice-cream cone is a cone. Solids have faces (flat or curved). A sphere only rolls, a cube
    only slides, a cylinder can roll and slide.
  explanations:
    text: Many toys are built from solid shapes. A ball is a sphere, a dice is a cube, a box is a cuboid, a drum is a cylinder and a clown's hat is a cone. Round shapes roll; flat-faced shapes slide.
    visual: 'Draw a toy train: a cuboid engine, cylinder wheels and a cone on top for a chimney.'
    step_by_step: 'Step 1: Look at the toy. Step 2: Are its faces flat, curved or both? Step 3: Name the solid.'
    real_world: Wooden toys from Channapatna are made of cylinders, spheres and cones.
  picture:
    kind: compare
    columns:
    - title: Solid
      points:
      - Sphere
      - Cube
      - Cylinder
    - title: Toy
      points:
      - ball
      - dice, blocks
      - drum, tin
    alt: A sphere is like a ball, a cube like a dice or block, and a cylinder like a drum or tin.
  activity:
    type: sort
    prompt: Which shape is the toy?
    bins:
    - Sphere
    - Cube
    - Cuboid
    - Cylinder
    - Cone
    items:
    - label: A ball
      bin: Sphere
      clue: Round all over.
      why: A sphere.
    - label: A marble
      bin: Sphere
      clue: Tiny and round.
      why: A sphere.
    - label: A dice
      bin: Cube
      clue: All faces the same square.
      why: A cube.
    - label: A toy block with equal sides
      bin: Cube
      clue: Same length every way.
      why: A cube.
    - label: A shoe box
      bin: Cuboid
      clue: Long, with flat faces.
      why: A cuboid.
    - label: A drum
      bin: Cylinder
      clue: Round at the top and bottom.
      why: A cylinder.
    - label: A pencil box tin, round
      bin: Cylinder
      clue: Rolls on its side.
      why: A cylinder.
    - label: A clown's hat
      bin: Cone
      clue: Pointy at the top.
      why: A cone.
  lesson:
    - teach: 'Toys are solid shapes: you can hold them, and they have thickness. A ball is a sphere, a dice is a cube, a box like a matchbox is a cuboid, a tin or drum is a cylinder, and a party cap is a cone.'
      check:
        prompt: 'A drum is shaped like a:'
        options:
        - cylinder
        - cube
        - sphere
        answer: cylinder
        why: A drum has two round flat ends and a curved side, like a cylinder.
      ways:
      - style: visual
        teach: Five solid shapes and a toy or thing at home for each one.
        picture:
          kind: compare
          columns:
          - title: Solid
            points:
            - Sphere
            - Cube
            - Cuboid
            - Cylinder
            - Cone
          - title: Like a
            points:
            - Football
            - Dice
            - Brick
            - Drum
            - Party cap
          alt: A sphere is like a football, a cube is like a dice, a cuboid is like a brick, a cylinder is like a drum and a cone is like a party cap.
      - style: real_world
        teach: In a toy shop, footballs are kept in baskets so they do not roll away, while boxes of games are stacked in neat piles. The shape of each toy decides how it is stored.
    - teach: Solids have faces. A face can be flat (like the side of a dice) or curved (like the outside of a ball). A cube has 6 flat faces, all squares.
      check:
        prompt: What kind of face does a ball have?
        options:
        - one curved face
        - 6 flat faces
        - 2 flat faces
        answer: one curved face
        why: A ball is round all over, with no flat part.
      ways:
      - style: step_by_step
        teach: 'Find the faces of a matchbox. Step 1: Touch the top and the bottom: 2 faces. Step 2: Touch the two long sides: 2 more. Step 3: Touch the two short ends: 2 more. Step 4: Count them: 6 flat faces.'
      - style: visual
        teach: Flat faces and curved faces on different solids.
        picture:
          kind: compare
          columns:
          - title: Only flat faces
            points:
            - Cube
            - Cuboid
          - title: Flat and curved
            points:
            - Cylinder
            - Cone
          - title: Only curved
            points:
            - Sphere
          alt: A cube and a cuboid have only flat faces. A cylinder and a cone have flat and curved faces. A sphere has only a curved face.
    - teach: Curved faces roll; flat faces slide. A ball only rolls. A dice only slides. A tin can roll on its side and slide on its flat end. A cone rolls in a circle and slides on its base.
      picture:
        kind: compare
        columns:
        - title: Only rolls
          points:
          - sphere (ball)
        - title: Only slides
          points:
          - cube (dice)
          - cuboid (box)
        - title: Rolls and slides
          points:
          - cylinder (tin)
          - cone (cap)
        alt: Which solids roll, which slide, which do both.
      check:
        prompt: Which can roll and slide?
        options:
        - a tin
        - a dice
        - a matchbox
        answer: a tin
        why: A tin has a curved side to roll and flat ends to slide on.
      ways:
      - style: step_by_step
        teach: 'Do a roll-or-slide test. Step 1: Make a slope with a book and a few blocks. Step 2: Put a solid at the top. Step 3: Watch: does it roll, slide or stay still? Step 4: Turn it to a different face and try again.'
      - style: real_world
        teach: Oil drums are rolled on their curved side when workers move them, but stood on their flat end when they are stored, so they do not roll away.
  items:
  - prompt: 'A ball is shaped like a:'
    options:
    - sphere
    - cube
    - cone
    - cuboid
    answer: sphere
    difficulty: 1
    hints:
    - Round all over.
    - It rolls everywhere.
    solution: A ball is a sphere.
    mistakes: {"cube": "m4_sphere"}
  - prompt: 'A dice is shaped like a:'
    options:
    - cube
    - sphere
    - cone
    - cylinder
    answer: cube
    difficulty: 1
    hints:
    - All faces are squares.
    - Six faces.
    solution: A dice is a cube.
    mistakes: {"sphere": "m4_dice"}
  - prompt: Which shape can roll and also slide?
    options:
    - cylinder
    - cube
    - sphere
    - cuboid
    answer: cylinder
    difficulty: 2
    hints:
    - Flat ends and a curved side.
    - Like a drum.
    solution: A cylinder rolls on its curved side and slides on its flat end.
    mistakes: {"sphere": "m4_roll_slide"}
  - prompt: 'A clown''s hat is shaped like a:'
    options:
    - cone
    - cube
    - cylinder
    - sphere
    answer: cone
    difficulty: 1
    hints:
    - Pointed at the top.
    - Round at the bottom.
    solution: A clown's hat is a cone.
    mistakes: {"cylinder": "m3_clown_hat"}
  - prompt: How many faces does a cube have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'Think of a dice: numbers 1 to 6.'
    - Count.
    solution: A cube has 6 faces.
    mistakes: {"4": "m5_cube_faces", "8": "m5_cube_faces"}
  - prompt: Which shape can only roll, never slide?
    options:
    - sphere
    - cube
    - cylinder
    - cuboid
    answer: sphere
    difficulty: 2
    hints:
    - It has no flat face.
    - A ball.
    solution: A sphere has no flat face, so it only rolls.
    mistakes: {"cylinder": "m3_only_roll"}
  - prompt: 'A matchbox is shaped like a:'
    options:
    - cuboid
    - sphere
    - cone
    answer: cuboid
    difficulty: 1
    hints:
    - It has flat faces, some long and some short.
    - Like a brick or a box.
    solution: 'Step 1: A matchbox has 6 flat rectangle faces. Step 2: That is a cuboid.'
    mistakes:
      sphere: c3m2_name
      cone: c3m2_name
  - prompt: 'An ice-cream cone is shaped like a:'
    options:
    - cone
    - cylinder
    - cube
    answer: cone
    difficulty: 1
    hints:
    - It has a pointed tip.
    - One round end and a point.
    solution: 'Step 1: It is round at the top and pointed at the bottom. Step 2: That is a cone.'
    mistakes:
      cylinder: c3m2_name
      cube: c3m2_name
  - prompt: Which toy can only slide, never roll?
    options:
    - "a building block shaped like a cube"
    - "a small round glass marble"
    - "a short, hollow piece of pipe"
    answer: a building block shaped like a cube
    difficulty: 1
    hints:
    - Rolling needs a curved surface.
    - Which one has only flat faces?
    solution: 'Step 1: A marble and a pipe have curved surfaces. Step 2: The cube block has only flat faces, so it only slides.'
    mistakes:
      "a small round glass marble": c3m2_roll
      "a short, hollow piece of pipe": c3m2_roll
  - prompt: How many flat faces does a cylinder have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Look at the top and bottom of a tin.
    - The side is curved, so do not count it.
    solution: 'Step 1: The top and bottom are flat circles. Step 2: So 2 flat faces.'
    mistakes:
      '3': c3m2_face
      '0': c3m2_face
  - prompt: How many flat faces does a cone have?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - The pointed part is not flat.
    - Only the base can sit flat on a table.
    solution: 'Step 1: The base is flat. Step 2: The rest is curved, so 1 flat face.'
    mistakes:
      '2': c3m2_face
      '0': c3m2_face
  - prompt: 2 dice are put together. How many flat faces do the 2 dice have in all, counted separately?
    answer: '12'
    check: 6*2
    difficulty: 2
    hints:
    - One dice has how many faces?
    - Double it.
    solution: 'Step 1: One dice has 6 faces. Step 2: 6 + 6 = 12.'
    mistakes:
      '6': c3m2_face
      '8': c3m2_face
  - prompt: Which shape has no flat face at all?
    options:
    - sphere
    - cylinder
    - cone
    answer: sphere
    difficulty: 1
    hints:
    - Which one could never stand still on a slope?
    - It is round everywhere.
    solution: 'Step 1: Cylinders and cones have flat ends. Step 2: A sphere is curved all over.'
    mistakes:
      cylinder: c3m2_face
      cone: c3m2_face
  - prompt: You want a toy that will stay still on a sloping table. Which is best?
    options:
    - a cuboid box
    - a ball
    - a tin lying on its side
    answer: a cuboid box
    difficulty: 3
    hints:
    - Things with a curved surface touching the table will roll.
    - Which one rests on a flat face?
    solution: 'Step 1: The ball and the tin on its side will roll. Step 2: The box rests on a flat face, so it stays.'
    mistakes:
      a ball: c3m2_roll
      a tin lying on its side: c3m2_roll
  - prompt: A toy has 2 round flat ends and a curved side. What is it?
    options:
    - cylinder
    - cone
    - cube
    answer: cylinder
    difficulty: 2
    hints:
    - Count the round flat ends.
    - A cone has only one.
    solution: 'Step 1: Two round flat ends and one curved side. Step 2: That is a cylinder.'
    mistakes:
      cone: c3m2_face
      cube: c3m2_face
  - prompt: 'Case: Children are building a tall tower from toy shapes. They have a ball, two dice and a party cap. Which shape should go at the very top, where nothing else will be stacked on it?'
    options:
    - "The party cap, because its pointed top cannot hold anything"
    - "The ball, because its round top can hold everything on it"
    - "The party cap, but at the bottom, turned upside down"
    answer: The party cap, because its pointed top cannot hold anything
    hints:
    - Which shapes have a flat face to stack on?
    - Which shape has a point instead of a flat top?
    solution: Dice have flat faces and stack well. The cone-shaped cap has a flat base to stand on, but a pointed top, so it can only go at the top.
    mistakes:
      "The ball, because its round top can hold everything on it": c3m2_roll
      "The party cap, but at the bottom, turned upside down": c3m2_face
    exam: case
    difficulty: 2
  - prompt: 'Situation: You want a shape for wheels on a toy cart, so that the cart moves smoothly. Which solid would you cut slices from?'
    options:
    - A cylinder
    - A cube
    - A cuboid
    answer: A cylinder
    hints:
    - Wheels need to roll.
    - Which of these solids has round, flat ends and a curved side?
    solution: A slice of a cylinder is a round disc that rolls smoothly. Cubes and cuboids have only flat faces and corners.
    mistakes:
      A cube: c3m2_roll
      A cuboid: c3m2_roll
    exam: competency
    difficulty: 2
- code: cbse3m.toy.faces
  title: Tracing faces of solids
  after:
  - cbse3m.toy.solids
  notes: |
    If you trace the flat face of a solid on paper, you get a flat (2D) shape: a cube gives a square, a cuboid gives
    rectangles (and sometimes squares), a cylinder's flat end gives a circle, a cone's base gives a circle. A sphere has
    no flat face to trace.
  explanations:
    text: Put a solid on paper and draw around its flat face. A cube gives a square, a box gives a rectangle, and a tin or cone gives a circle.
    visual: Trace around a matchbox, a dice and a bangle-box on paper and name the shapes you get.
    step_by_step: 'Step 1: Find a flat face. Step 2: Put it on paper and draw around it. Step 3: Name the flat shape.'
    real_world: 'Kids make stamps by dipping the flat end of a cylinder in paint: it prints circles.'
  picture:
    kind: flow
    steps:
    - Pick a solid
    - Place its flat face on paper
    - Draw around it
    - Name the flat shape
    alt: Pick a solid, place its flat face on paper, draw around it, and name the flat shape you get.
  activity:
    type: sort
    prompt: Trace around the flat face. What shape do you get?
    bins:
    - Square
    - Rectangle
    - Circle
    items:
    - label: A dice
      bin: Square
      clue: All sides of the face are the same.
      why: A square.
    - label: A toy block with equal sides
      bin: Square
      clue: Equal sides.
      why: A square.
    - label: A matchbox, on its big face
      bin: Rectangle
      clue: Long and short sides.
      why: A rectangle.
    - label: A brick
      bin: Rectangle
      clue: Longer than it is wide.
      why: A rectangle.
    - label: The bottom of a tin
      bin: Circle
      clue: Round.
      why: A circle.
    - label: The bottom of an ice-cream cone
      bin: Circle
      clue: Round opening.
      why: A circle.
    - label: The end of a drum
      bin: Circle
      clue: Round.
      why: A circle.
  lesson:
    - teach: If you put a flat face of a solid on paper and draw round it, you get a flat (2D) shape. The solid is 3D; its traced face is 2D.
      check:
        prompt: 'Tracing a face of a solid gives a:'
        options:
        - flat shape
        - solid shape
        - ball
        answer: flat shape
        why: Your drawing on paper has no thickness, so it is flat.
      ways:
      - style: visual
        teach: A solid shape (3D) and the flat shape (2D) you get from tracing it.
        picture:
          kind: flow
          steps:
          - Put a flat face of the solid on paper
          - Hold it still
          - Draw round its edge with a pencil
          - 'Lift it: a flat 2D shape is left on paper'
          alt: Put a flat face of a solid on paper, hold it still, draw round its edge and lift it. A flat 2D shape is left on the paper.
      - style: real_world
        teach: A tailor puts a paper pattern on cloth and draws round it with chalk before cutting. Tracing round a solid works in the same way.
    - teach: 'Each solid gives its own traced shapes. Cube: square. Cuboid: rectangles (sometimes squares). Cylinder end: circle. Cone base: circle.'
      picture:
        kind: compare
        columns:
        - title: Solid
          points:
          - cube
          - cuboid
          - cylinder
          - cone
        - title: Traced face
          points:
          - square
          - rectangle
          - circle
          - circle
        alt: Each solid next to the flat shape its face traces.
      check:
        prompt: 'Tracing a dice gives a:'
        options:
        - square
        - circle
        - triangle
        answer: square
        why: Every face of a cube is a square.
      ways:
      - style: step_by_step
        teach: 'Trace an eraser shaped like a cuboid. Step 1: Lay it on its biggest face and draw round it: a long rectangle. Step 2: Stand it on its side: a thinner rectangle. Step 3: Stand it on its end: a small rectangle or square. Step 4: Compare your three shapes.'
      - style: real_world
        teach: Many biscuit tins are cylinders. If you press the bottom of one into soft sand on the beach, it leaves a round print, just like a circle traced on paper.
    - teach: A curved face cannot be traced, because it does not lie flat. So a sphere gives no traced shape, and a cylinder gives only its 2 round ends.
      check:
        prompt: How many shapes can you trace from a cone?
        options:
        - '1'
        - '2'
        - '0'
        answer: '1'
        why: Only the flat round base lies on paper.
      ways:
      - style: visual
        teach: Which solids can be traced, and what each one leaves behind.
        picture:
          kind: compare
          columns:
          - title: Can be traced
            points:
            - 'Cube: squares'
            - 'Cylinder: 2 circles'
            - 'Cone: 1 circle'
          - title: Cannot be traced
            points:
            - 'Sphere: no flat face'
            - The curved side of a tin or cone
          alt: A cube traces squares, a cylinder traces 2 circles and a cone traces 1 circle. A sphere has no flat face, and the curved side of a tin or cone cannot be traced.
      - style: real_world
        teach: If you dip a ball in paint and press it on paper, you get only a small dot, not a full shape. The ball touches the paper at just one point because it has no flat face.
  items:
  - prompt: 'Tracing a face of a dice gives a:'
    options:
    - square
    - circle
    - triangle
    - rectangle that is very long
    answer: square
    difficulty: 1
    hints:
    - All faces of a cube are the same.
    - Equal sides.
    solution: A cube's face is a square.
    mistakes: {"circle": "m3_dice_face"}
  - prompt: 'Tracing the flat end of a tin gives a:'
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - The end is round.
    - Like a coin.
    solution: The end of a cylinder is a circle.
    mistakes: {"square": "m3_tin_end"}
  - prompt: 'Tracing the long face of a matchbox gives a:'
    options:
    - rectangle
    - circle
    - triangle
    - cone
    answer: rectangle
    difficulty: 1
    hints:
    - Longer than it is wide.
    - Four corners.
    solution: It gives a rectangle.
    mistakes: {"circle": "m4_matchbox"}
  - prompt: Which solid has no flat face to trace?
    options:
    - sphere
    - cube
    - cone
    - cylinder
    answer: sphere
    difficulty: 2
    hints:
    - It is round everywhere.
    - A ball.
    solution: A sphere has no flat face.
    mistakes: {"cone": "m3_no_flat"}
  - prompt: How many circles can you trace from one cylinder?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Look at both ends.
    - Top and bottom.
    solution: A cylinder has 2 flat circle ends.
    mistakes:
      '1': c3_count_once
  - prompt: 'Tracing the base of an ice-cream cone gives a:'
    options:
    - circle
    - triangle
    - square
    - star
    answer: circle
    difficulty: 1
    hints:
    - The open end is round.
    - Base.
    solution: The base of a cone is a circle.
    mistakes: {"triangle": "m3_cone_base"}
  - prompt: 'Tracing the end of a round pencil box gives a:'
    options:
    - circle
    - square
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - The box is shaped like a cylinder.
    - What shape is the end of a tin?
    solution: 'Step 1: The end is flat and round. Step 2: It traces a circle.'
    mistakes:
      square: c3m2_trace
      rectangle: c3m2_trace
  - prompt: How many squares can you trace from one cube?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Every face of a cube is a square.
    - How many faces does a cube have?
    solution: 'Step 1: A cube has 6 faces. Step 2: Each one traces a square, so 6.'
    mistakes:
      '4': c3m2_face
      '1': c3m2_face
  - prompt: Which solid could give you a rectangle when you trace it?
    options:
    - a brick
    - a ball
    - a cone
    answer: a brick
    difficulty: 1
    hints:
    - Rectangles have 4 straight sides.
    - Which solid has long flat faces?
    solution: 'Step 1: A brick is a cuboid. Step 2: Its long faces trace rectangles.'
    mistakes:
      a ball: c3m2_trace
      a cone: c3m2_trace
  - prompt: You trace a shape and get a circle. Which solid could it be from?
    options:
    - a cylinder
    - a cube
    - a cuboid
    answer: a cylinder
    difficulty: 2
    hints:
    - Cubes and cuboids have only straight edges.
    - Which solid has a round flat end?
    solution: 'Step 1: A circle comes from a round flat face. Step 2: A cylinder has round flat ends.'
    mistakes:
      a cube: c3m2_trace
      a cuboid: c3m2_trace
  - prompt: Why can't you trace the side of a tin?
    options:
    - "it is curved, so it does not lie flat"
    - "it is too small to draw around"
    - "it has too many sharp corners"
    answer: it is curved, so it does not lie flat
    difficulty: 2
    hints:
    - Try pressing the side of a tin on paper.
    - Does all of it touch the paper?
    solution: 'Step 1: The side bends round. Step 2: Only a thin line touches the paper, so you cannot trace it.'
    mistakes:
      "it is too small to draw around": c3m2_trace
      "it has too many sharp corners": c3m2_trace
  - prompt: From 2 cylinders, how many circles can you trace in all?
    answer: '4'
    check: 2*2
    difficulty: 2
    hints:
    - One cylinder gives how many circles?
    - Then double it.
    solution: 'Step 1: One cylinder gives 2 circles. Step 2: 2 + 2 = 4.'
    mistakes:
      '2': c3m2_face
      '6': c3m2_face
  - prompt: How many corners does the shape you trace from a dice have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Tracing a dice gives which shape?
    - Count the corners of that shape.
    solution: 'Step 1: A dice face traces a square. Step 2: A square has 4 corners.'
    mistakes:
      '6': c3m2_trace
      '8': c3m2_trace
  - prompt: Which pair of solids both trace a circle?
    options:
    - cone and cylinder
    - cube and cone
    - cuboid and cube
    answer: cone and cylinder
    difficulty: 2
    hints:
    - Which solids have round flat faces?
    - Cubes and cuboids have straight edges.
    solution: 'Step 1: A cone base is round. Step 2: A cylinder end is round too.'
    mistakes:
      cube and cone: c3m2_trace
      cuboid and cube: c3m2_trace
  - prompt: A box has 2 square faces and 4 rectangle faces. How many faces can you trace in all?
    answer: '6'
    check: 2+4
    difficulty: 3
    hints:
    - All its faces are flat.
    - Add the squares and the rectangles.
    solution: 'Step 1: 2 squares + 4 rectangles. Step 2: 2 + 4 = 6 faces.'
    mistakes:
      '4': c3m2_face
      '2': c3m2_face
  - prompt: 'Case: In an art class, children press painted solids on paper to make prints. One child''s paper shows a square, a circle and a rectangle. Which set of solids could make all three?'
    options:
    - A dice, a tin and a brick
    - A ball, a dice and a brick
    - Three balls
    answer: A dice, a tin and a brick
    hints:
    - What shape does each solid's flat face make?
