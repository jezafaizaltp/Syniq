# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 4
title: Vacation with My Nani Maa
tips:
  m3_add_places: "Add ones to ones and tens to tens: 4 + 3, then 2 tens + 1 ten."
  m3_ten_and_ten: "Put the two amounts together and add them."
  c3m4_carry: Add the ones first. If they make 10 or more, move one ten over to the tens.
  c3m4_borrow: If the top ones digit is smaller, open one ten into 10 ones before taking away.
  c3m4_which: 'Ask: are things being put together, or taken away, or compared?'
  c3m4_back: Check by adding your answer back to the number you took away.

concepts:
- code: cbse3m.nani.add
  title: Adding in everyday stories
  notes: |
    Adding means putting together. Word problems from a village holiday: hens and chicks, mangoes picked, steps
    climbed. Add 2-digit numbers by adding tens and ones separately (24 + 13 = 30 + 7 = 37), carrying when ones make 10
    or more (28 + 15: 8 + 5 = 13, so 1 ten carries).
  explanations:
    text: When things are put together, we add. To add 24 and 13, add the tens (20 + 10 = 30) and the ones (4 + 3 = 7) to get 37. If the ones make ten or more, carry the ten over.
    visual: 'Draw 24 mangoes as 2 sticks of ten and 4 dots, and 13 as 1 stick and 3 dots. Put them together: 3 sticks and 7 dots.'
    step_by_step: 'Step 1: Add the ones. Step 2: If 10 or more, carry 1 ten. Step 3: Add the tens. Step 4: Read the answer.'
    real_world: 'At Nani''s house you might pick 24 mangoes in the morning and 13 in the evening: 37 in all.'
  picture:
    kind: bars
    bars:
    - label: Morning
      value: 24
    - label: Evening
      value: 13
    - label: Total
      value: 37
    alt: 24 mangoes in the morning and 13 in the evening make 37 in all.
    unit: mangoes
  activity:
    type: sort
    prompt: Nani's sums. Which answer does each one make?
    bins:
    - '37'
    - '63'
    - '90'
    items:
    - label: 24 + 13
      bin: '37'
      clue: Add the tens, then the ones.
      why: 30 + 7.
    - label: 25 + 12
      bin: '37'
      clue: 'Tens first: 20 + 10.'
      why: 30 + 7.
    - label: 30 + 7
      bin: '37'
      clue: 3 tens and 7 ones.
      why: '37.'
    - label: 36 + 27
      bin: '63'
      clue: '6 + 7 is more than ten: carry it.'
      why: 13 ones = 1 ten and 3 ones; 5 + 1 = 6 tens.
    - label: 55 + 8
      bin: '63'
      clue: 5 + 8 makes more than ten.
      why: 'Carry the ten: 63.'
    - label: 40 + 23
      bin: '63'
      clue: Tens, then ones.
      why: 6 tens and 3 ones.
    - label: 45 + 45
      bin: '90'
      clue: '5 + 5 makes a ten: carry it.'
      why: 8 tens + 1 ten = 9 tens.
    - label: 82 + 8
      bin: '90'
      clue: 2 + 8 makes a ten.
      why: 9 tens, 0 ones.
    - label: 60 + 30
      bin: '90'
      clue: 6 tens and 3 tens.
      why: 9 tens.
  lesson:
    - teach: 'Adding means putting together. Nani has 13 mangoes and picks 5 more: together that is 13 + 5 = 18. Words like ''in all'', ''altogether'' and ''more'' (when things join) tell you to add.'
      check:
        prompt: Nani has 10 hens and buys 4 more. How many hens in all?
        options:
        - '14'
        - '6'
        - '104'
        answer: '14'
        why: 'Buying more puts hens together: 10 + 4 = 14.'
      ways:
      - style: visual
        teach: Words in a word problem that tell you that you need to add.
        picture:
          kind: compare
          columns:
          - title: Story words
            points:
            - in all
            - altogether
            - total
            - more joined
          - title: Do this
            points:
            - Add the numbers
          alt: Words like in all, altogether, total and more joined tell you to add the numbers.
      - style: real_world
        teach: At a shop, the shopkeeper adds up the prices of everything you buy to find the total. Putting things together is adding.
    - teach: 'For 2-digit numbers, add tens with tens and ones with ones. 32 + 25: tens 30 + 20 = 50, ones 2 + 5 = 7, so 57.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: tens
        - size: 1
          label: ones
        rows:
        - size: 1
          label: '32'
        - size: 1
          label: '25'
        - size: 1
          label: sum
        cells:
        - - '30'
          - '2'
        - - '20'
          - '5'
        - - '50'
          - '7'
        alt: '32 + 25 split into tens and ones: 50 and 7 make 57.'
      check:
        prompt: 41 + 36 = ?
        options:
        - '77'
        - '68'
        - '717'
        answer: '77'
        why: 40 + 30 = 70 and 1 + 6 = 7, so 77.
      ways:
      - style: visual
        teach: 'Adding 41 + 34: tens go with tens, and ones go with ones.'
        picture:
          kind: compare
          columns:
          - title: Tens
            points:
            - 40 + 30
            - = 70
          - title: Ones
            points:
            - 1 + 4
            - = 5
          - title: Answer
            points:
            - 70 + 5 = 75
          alt: 'To add 41 and 34, add the tens: 40 + 30 = 70, and the ones: 1 + 4 = 5. Together that is 75.'
      - style: step_by_step
        teach: 'Add 53 + 24 in your head. Step 1: Start at 53. Step 2: Add the 2 tens: 63, 73. Step 3: Add the 4 ones: 74, 75, 76, 77. Step 4: The answer is 77.'
    - teach: 'If the ones make 10 or more, carry 1 ten. 27 + 16: ones 7 + 6 = 13, that is 1 ten and 3 ones. Tens 20 + 10 + 10 = 40. Answer 43.'
      check:
        prompt: 18 + 14 = ?
        options:
        - '32'
        - '22'
        - '212'
        answer: '32'
        why: 8 + 4 = 12 (carry 1 ten), 10 + 10 + 10 = 30, so 32.
      ways:
      - style: step_by_step
        teach: 'Add 38 + 47 with carrying. Step 1: Add the ones: 8 + 7 = 15. Step 2: Write 5 and carry 1 ten. Step 3: Add the tens: 3 + 4 + 1 = 8 tens. Step 4: The answer is 85.'
      - style: visual
        teach: When 10 ones are made, they are swapped for 1 ten.
        picture:
          kind: flow
          steps:
          - 'Add the ones: 8 + 7 = 15 ones'
          - 15 ones = 1 ten and 5 ones
          - Carry the 1 ten to the tens
          - Add all the tens
          alt: Adding 8 and 7 ones gives 15 ones, which is 1 ten and 5 ones. The 1 ten is carried over and added to the tens.
  items:
  - prompt: Nani has 12 hens and 7 chicks. How many birds in all?
    answer: '19'
    check: 12 + 7
    difficulty: 1
    hints:
    - Put them together.
    - 12 + 7.
    solution: 12 + 7 = 19.
    mistakes: {"5": "m5_add_carry", "18": "m5_add_carry"}
  - prompt: 24 + 13 = ?
    answer: '37'
    check: 24 + 13
    difficulty: 1
    hints:
    - 'Tens: 20 + 10. Ones: 4 + 3.'
    - 30 + 7.
    solution: 24 + 13 = 37.
    mistakes: {"11": "m3_add_places", "47": "m3_add_places"}
  - prompt: 28 + 15 = ?
    answer: '43'
    check: 28 + 15
    difficulty: 2
    hints:
    - 'Ones: 8 + 5 = 13, carry 1.'
    - 'Tens: 2 + 1 + 1 = 4.'
    solution: 28 + 15 = 43.
    mistakes:
      '33': c3_place
      '313': c3_place
  - prompt: We climbed 35 steps, then 25 more to the temple. How many steps?
    answer: '60'
    check: 35 + 25
    difficulty: 2
    hints:
    - 35 + 25.
    - 5 + 5 = 10, carry.
    solution: 35 + 25 = 60.
    mistakes:
      '50': c3_place
  - prompt: Nani gave 10 laddoos to Raju and 10 to Meena. How many in all?
    answer: '20'
    check: 10 + 10
    difficulty: 1
    hints:
    - 10 + 10.
    - Two tens.
    solution: 10 + 10 = 20.
    mistakes: {"10": "m3_ten_and_ten", "100": "m3_ten_and_ten"}
  - prompt: 46 + 30 = ?
    answer: '76'
    check: 46 + 30
    difficulty: 1
    hints:
    - Add the tens only.
    - 4 tens + 3 tens.
    solution: 46 + 30 = 76.
    mistakes: {"49": "m3_add_places", "79": "m3_add_places"}
  - prompt: Nani picked 23 guavas and Raju picked 14. How many guavas in all?
    answer: '37'
    check: 23+14
    difficulty: 1
    hints:
    - Put the two amounts together.
    - Add tens, then ones.
    solution: 'Step 1: 20 + 10 = 30, 3 + 4 = 7. Step 2: 37 guavas.'
    mistakes:
      '9': c3m4_which
      '27': c3m4_carry
  - prompt: 52 + 36 = ?
    answer: '88'
    check: 52+36
    difficulty: 1
    hints:
    - 'Tens: 50 + 30.'
    - 'Ones: 2 + 6.'
    solution: 'Step 1: 50 + 30 = 80. Step 2: 2 + 6 = 8, so 88.'
    mistakes:
      '16': c3m4_which
      '818': c3m4_carry
  - prompt: 39 + 25 = ?
    answer: '64'
    check: 39+25
    difficulty: 2
    hints:
    - Do 9 + 5 first.
    - The ones make more than 10.
    solution: 'Step 1: 9 + 5 = 14, carry 1 ten. Step 2: 30 + 20 + 10 = 60, so 64.'
    mistakes:
      '54': c3m4_carry
      '514': c3m4_carry
  - prompt: A bus took 26 people to the fair. Another bus took 38. How many people went?
    answer: '64'
    check: 26+38
    difficulty: 2
    hints:
    - Add the two buses.
    - 6 + 8 is more than 10.
    solution: 'Step 1: 6 + 8 = 14, carry 1 ten. Step 2: 20 + 30 + 10 = 60, so 64.'
    mistakes:
      '54': c3m4_carry
      '12': c3m4_which
  - prompt: There are 45 coconuts on one tree and 45 on another. How many coconuts?
    answer: '90'
    check: 45+45
    difficulty: 2
    hints:
    - 5 + 5 makes a full ten.
    - Add the tens and the carried ten.
    solution: 'Step 1: 5 + 5 = 10, carry 1. Step 2: 40 + 40 + 10 = 90.'
    mistakes:
      '80': c3m4_carry
      '810': c3m4_carry
  - prompt: Which words tell you to add?
    options:
    - how many in all
    - how many are left
    - how many fewer
    answer: how many in all
    difficulty: 1
    hints:
    - Adding is putting together.
    - Which words mean everything together?
    solution: 'Step 1: ''Left'' and ''fewer'' mean taking away or comparing. Step 2: ''In all'' means put together.'
    mistakes:
      how many are left: c3m4_which
      how many fewer: c3m4_which
  - prompt: Raju walked 18 steps to the well and 18 steps back. How many steps in all?
    answer: '36'
    check: 18+18
    difficulty: 2
    hints:
    - Double 18.
    - 8 + 8 makes more than 10.
    solution: 'Step 1: 8 + 8 = 16, carry 1. Step 2: 10 + 10 + 10 = 30, so 36.'
    mistakes:
      '26': c3m4_carry
      '216': c3m4_carry
  - prompt: 60 + 27 = ?
    answer: '87'
    check: 60+27
    difficulty: 1
    hints:
    - 60 has no ones.
    - Just add the tens, keep the 7 ones.
    solution: 'Step 1: 60 + 20 = 80. Step 2: 80 + 7 = 87.'
    mistakes:
      '67': c3m4_carry
      '33': c3m4_which
  - prompt: Nani made 24 laddoos in the morning, 17 at noon and 10 in the evening. How many laddoos?
    answer: '51'
    check: 24+17+10
    difficulty: 3
    hints:
    - Add two numbers first, then the third.
    - 24 + 17 needs a carry.
    solution: 'Step 1: 24 + 17 = 41. Step 2: 41 + 10 = 51.'
    mistakes:
      '41': c3m4_which
      '61': c3m4_carry
  - prompt: 'Case: On holiday, a family walks 34 minutes to the river in the morning and 29 minutes to the market in the evening. A child says they walked 53 minutes in all. What went wrong?'
    options:
    - 'The 10 from the ones was not carried: the real total is 63 minutes'
    - 'Nothing: 53 minutes is right'
    - 'The tens were added twice: the real total is 43 minutes'
    answer: 'The 10 from the ones was not carried: the real total is 63 minutes'
    hints:
    - 'Add the ones first: 4 + 9. Is it more than 10?'
    - Where should the extra ten go?
    solution: '4 + 9 = 13 ones: write 3 and carry 1 ten. 3 + 2 + 1 = 6 tens. 34 + 29 = 63 minutes.'
    mistakes:
      'Nothing: 53 minutes is right': c3m4_carry
      'The tens were added twice: the real total is 43 minutes': c3m4_carry
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are packing snacks for a trip. One box has 26 biscuits and another has 33. Your group has 60 children. Is there one biscuit each?'
    options:
    - No, there are 59 biscuits, 1 short
    - Yes, there are 69 biscuits
    - Yes, there are exactly 60
    answer: No, there are 59 biscuits, 1 short
    hints:
    - Add the two boxes.
    - Compare the total with 60.
    solution: 26 + 33 = 59. That is 1 less than 60, so one child would have none.
    mistakes:
      Yes, there are 69 biscuits: m3_add_places
      Yes, there are exactly 60: m3_add_places
    exam: competency
    difficulty: 2
- code: cbse3m.nani.sub
  title: Taking away and comparing
  after:
  - cbse3m.nani.add
  notes: |
    Taking away (subtraction): 25 mangoes, 8 eaten, 17 left. Comparing: how many more / fewer = bigger − smaller. Borrow
    a ten when the ones digit is too small (42 − 17: 12 − 7 = 5, 3 − 1 = 2, so 25). Check by adding back: 25 + 17 = 42.
  explanations:
    text: When things are taken away or we want to know how many more, we subtract. If the ones are too few, break one ten into ten ones. Check your answer by adding back.
    visual: Draw 42 as 4 sticks and 2 dots. To take away 17, break one stick into 10 dots, then cross out 1 stick and 7 dots.
    step_by_step: 'Step 1: Subtract the ones (borrow a ten if needed). Step 2: Subtract the tens. Step 3: Check by adding.'
    real_world: If Nani had 30 eggs and used 12 for a cake, 18 are left.
  picture:
    kind: flow
    steps:
    - 42 − 17
    - 'Borrow: 12 − 7 = 5'
    - 'Tens: 3 − 1 = 2'
    - Answer 25
    - 'Check: 25 + 17 = 42'
    alt: To find 42 minus 17, borrow a ten so 12 minus 7 is 5, then 3 minus 1 is 2, giving 25; check by adding 25 and 17 to get 42.
  activity:
    type: sort
    prompt: Take away. Which answer does each one make?
    bins:
    - '27'
    - '28'
    - '35'
    items:
    - label: 45 − 18
      bin: '27'
      clue: '5 − 8 can''t be done: break a ten.'
      why: 15 − 8 = 7, and 3 − 1 = 2 tens.
    - label: 30 − 3
      bin: '27'
      clue: Break a ten into ones.
      why: '27.'
    - label: 50 − 23
      bin: '27'
      clue: 0 − 3 needs a ten broken.
      why: 10 − 3 = 7, 4 − 2 = 2.
    - label: 52 − 24
      bin: '28'
      clue: 2 − 4 needs a ten broken.
      why: 12 − 4 = 8, 4 − 2 = 2.
    - label: 40 − 12
      bin: '28'
      clue: '0 − 2: break a ten.'
      why: '28.'
    - label: 31 − 3
      bin: '28'
      clue: '1 − 3: break a ten.'
      why: 11 − 3 = 8.
    - label: 70 − 35
      bin: '35'
      clue: '0 − 5: break a ten.'
      why: '35. Check: 35 + 35 = 70.'
    - label: 50 − 15
      bin: '35'
      clue: Break a ten.
      why: '35.'
    - label: 42 − 7
      bin: '35'
      clue: '2 − 7: break a ten.'
      why: 12 − 7 = 5, 3 tens left.
  lesson:
    - teach: 'Taking away (subtraction) means some go away and we find what is left. 20 mangoes, 6 eaten: 20 − 6 = 14 left. Words like ''left'', ''gave away'', ''ate'' tell you to subtract.'
      check:
        prompt: 15 birds, 5 fly away. How many are left?
        options:
        - '10'
        - '20'
        - '5'
        answer: '10'
        why: 'Flying away takes them out: 15 − 5 = 10.'
      ways:
      - style: visual
        teach: Words in a story that tell you to take away.
        picture:
          kind: compare
          columns:
          - title: Take away
            points:
            - left
            - gave away
            - ate
            - spent
          - title: Compare
            points:
            - how many more
            - how many fewer
            - difference
          alt: Words like left, gave away, ate and spent tell you to take away. Words like how many more, how many fewer and difference tell you to compare by subtracting.
      - style: real_world
        teach: When you buy something for 18 rupees with a 20-rupee note, the shopkeeper takes away 18 from 20 and gives you back 2 rupees.
    - teach: 'To compare, find the difference: bigger minus smaller. 14 cows and 9 goats: 14 − 9 = 5 more cows. ''How many more'' and ''how many fewer'' both use the difference.'
      picture:
        kind: bars
        unit: animals
        bars:
        - label: cows
          value: 14
        - label: goats
          value: 9
        alt: 14 cows and 9 goats; the difference is 5.
      check:
        prompt: 12 boys and 8 girls. How many fewer girls?
        options:
        - '4'
        - '20'
        - '8'
        answer: '4'
        why: 12 − 8 = 4.
      ways:
      - style: visual
        teach: Comparing 16 hens and 9 ducks with two bars side by side.
        picture:
          kind: bars
          bars:
          - label: Hens
            value: 16
          - label: Ducks
            value: 9
          alt: The hens bar shows 16 and the ducks bar shows 9. The hens bar is longer by 7, so there are 7 more hens.
      - style: step_by_step
        teach: 'Find how many more by counting on. Step 1: Start at the smaller number, 9. Step 2: Count on to the bigger number, 16: 10, 11, 12, 13, 14, 15, 16. Step 3: You counted 7 steps, so there are 7 more.'
    - teach: 'If the top ones digit is too small, borrow a ten. 52 − 18: 2 − 8 cannot be done, so open one ten: 12 − 8 = 4, and 4 tens − 1 ten = 3 tens. Answer 34. Check: 34 + 18 = 52.'
      check:
        prompt: 31 − 14 = ?
        options:
        - '17'
        - '23'
        - '27'
        answer: '17'
        why: '11 − 4 = 7 and 2 − 1 = 1 ten, so 17. Check: 17 + 14 = 31.'
      ways:
      - style: step_by_step
        teach: 'Work out 71 − 36 by borrowing. Step 1: Ones: 1 − 6 cannot be done. Step 2: Open one ten: now 11 ones and 6 tens. Step 3: 11 − 6 = 5 ones. Step 4: 6 tens − 3 tens = 3 tens. The answer is 35. Check: 35 + 36 = 71.'
      - style: visual
        teach: 'Borrowing: one ten is opened into ten ones.'
        picture:
          kind: flow
          steps:
          - Top ones digit is too small
          - Take 1 ten from the tens
          - Open it into 10 ones
          - Now subtract the ones, then the tens
          - Check by adding back
          alt: When the top ones digit is too small, take 1 ten from the tens, open it into 10 ones, then subtract the ones and the tens, and check by adding back.
  items:
  - prompt: 25 mangoes, 8 were eaten. How many are left?
    answer: '17'
    check: 25 - 8
    difficulty: 1
    hints:
    - Take away 8.
    - 25 − 8.
    solution: 25 − 8 = 17.
    mistakes:
      '33': c3_count_once
  - prompt: 42 − 17 = ?
    answer: '25'
    check: 42 - 17
    difficulty: 2
    hints:
    - 'Borrow a ten: 12 − 7.'
    - Then 3 − 1.
    solution: 42 − 17 = 25.
    mistakes:
      '35': c3_place
  - prompt: Raju is 9 years old and Nani is 65. How many years older is Nani?
    answer: '56'
    check: 65 - 9
    difficulty: 2
    hints:
    - Bigger − smaller.
    - 65 − 9.
    solution: 65 − 9 = 56.
    mistakes: {"74": "m5_subtract_not_add", "66": "m5_subtract_not_add"}
  - prompt: 30 − 12 = ?
    answer: '18'
    check: 30 - 12
    difficulty: 2
    hints:
    - 'Borrow: 10 − 2 = 8.'
    - 2 − 1 = 1.
    solution: 30 − 12 = 18.
    mistakes:
      '22': c3_place
  - prompt: 50 − 20 = ?
    answer: '30'
    check: 50 - 20
    difficulty: 1
    hints:
    - 5 tens − 2 tens.
    - Count back in tens.
    solution: 50 − 20 = 30.
    mistakes: {"70": "m3_take_tens", "3": "m3_take_tens"}
  - prompt: There are 14 cows and 9 goats. How many more cows than goats?
    answer: '5'
    check: 14 - 9
    difficulty: 1
    hints:
    - 'Compare: 14 − 9.'
    - Count up from 9 to 14.
    solution: 14 − 9 = 5.
    mistakes:
      '23': c3_count_once
  - prompt: Nani had 48 eggs. 15 broke. How many eggs are left?
    answer: '33'
    check: 48-15
    difficulty: 1
    hints:
    - Broken eggs are taken away.
    - 'Ones: 8 − 5; tens: 4 − 1.'
    solution: 'Step 1: 8 − 5 = 3. Step 2: 40 − 10 = 30, so 33.'
    mistakes:
      '63': c3m4_which
      '43': c3m4_borrow
  - prompt: 63 − 27 = ?
    answer: '36'
    check: 63-27
    difficulty: 2
    hints:
    - Can you take 7 from 3?
    - Open one ten first.
    solution: 'Step 1: 13 − 7 = 6. Step 2: 5 tens − 2 tens = 3 tens, so 36.'
    mistakes:
      '44': c3m4_borrow
      '90': c3m4_which
  - prompt: A train has 70 seats. 45 are taken. How many seats are empty?
    answer: '25'
    check: 70-45
    difficulty: 2
    hints:
    - Take the taken seats away from all seats.
    - 0 − 5 needs a borrowed ten.
    solution: 'Step 1: 10 − 5 = 5. Step 2: 6 tens − 4 tens = 2 tens, so 25.'
    mistakes:
      '35': c3m4_borrow
      '115': c3m4_which
  - prompt: Raju has 23 marbles and Meena has 31. How many more does Meena have?
    answer: '8'
    check: 31-23
    difficulty: 2
    hints:
    - Bigger minus smaller.
    - Count on from 23 to 31.
    solution: 'Step 1: 31 − 23. Step 2: 11 − 3 = 8, 2 tens − 2 tens = 0, so 8.'
    mistakes:
      '54': c3m4_which
      '12': c3m4_borrow
  - prompt: Which question needs subtraction?
    options:
    - How many sweets are left after eating 4?
    - How many sweets in two boxes?
    - How many sweets if Nani adds 6?
    answer: How many sweets are left after eating 4?
    difficulty: 1
    hints:
    - Subtraction takes away.
    - Look for 'left'.
    solution: 'Step 1: Eating takes sweets away. Step 2: ''Left'' means subtract.'
    mistakes:
      How many sweets in two boxes?: c3m4_which
      How many sweets if Nani adds 6?: c3m4_which
  - prompt: 90 − 34 = ?
    answer: '56'
    check: 90-34
    difficulty: 2
    hints:
    - 0 − 4 needs a borrowed ten.
    - 10 − 4, then 8 tens − 3 tens.
    solution: 'Step 1: 10 − 4 = 6. Step 2: 8 tens − 3 tens = 5 tens, so 56.'
    mistakes:
      '64': c3m4_borrow
      '66': c3m4_borrow
  - prompt: You worked out 45 − 19 = 26. Which sum checks it?
    options:
    - 26 + 19
    - 45 + 19
    - 26 + 45
    answer: 26 + 19
    difficulty: 2
    hints:
    - Add the answer back to what you took away.
    - You should get 45.
    solution: 'Step 1: 26 + 19 = 45. Step 2: It matches, so the answer is right.'
    mistakes:
      45 + 19: c3m4_back
      26 + 45: c3m4_back
  - prompt: Nani's village is 80 km away. We have travelled 52 km. How many km are left?
    answer: '28'
    check: 80-52
    difficulty: 2
    hints:
    - Distance left = total − travelled.
    - 0 − 2 needs a borrowed ten.
    solution: 'Step 1: 10 − 2 = 8. Step 2: 7 tens − 5 tens = 2 tens, so 28 km.'
    mistakes:
      '32': c3m4_borrow
      '132': c3m4_which
  - prompt: Nani had 60 rupees and spent 25 on vegetables and 18 on milk. How much is left?
    answer: '17'
