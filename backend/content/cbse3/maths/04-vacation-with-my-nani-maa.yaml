  - prompt: 'Case: Nani''s garden had 54 tomatoes. On Monday the family picked 17. A child worked out 54 − 17 = 43 and said there were 43 left. What is the mistake?'
    options:
    - '4 − 7 was done as 7 − 4 instead of borrowing: there are 37 left'
    - There is no mistake
    - 'The numbers should be added: there are 71 left'
    answer: '4 − 7 was done as 7 − 4 instead of borrowing: there are 37 left'
    hints:
    - Can you take 7 ones from 4 ones?
    - Borrow a ten, then check your answer by adding back.
    solution: '4 − 7 cannot be done, so open a ten: 14 − 7 = 7 ones, and 4 − 1 = 3 tens. 54 − 17 = 37. Check: 37 + 17 = 54.'
    mistakes:
      There is no mistake: c3m4_borrow
      'The numbers should be added: there are 71 left': c3m4_which
    exam: case
    difficulty: 2
