# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 4
title: Vacation with My Nani Maa
tips:
  m3_add_places: "Add ones to ones and tens to tens: 4 + 3, then 2 tens + 1 ten."
  m3_ten_and_ten: "10 for Raju and 10 for Meena. Add them."

concepts:
- code: cbse3m.nani.add
  title: Adding in everyday stories
  notes: |
    Adding means putting together. Word problems from a village holiday: hens and chicks, mangoes picked, steps
    climbed. Add 2-digit numbers by adding tens and ones separately (24 + 13 = 30 + 7 = 37), carrying when ones make 10
    or more (28 + 15: 8 + 5 = 13, so 1 ten carries).
  explanations:
    text: When things are put together, we add. To add 24 and 13, add the tens (20 + 10 = 30) and the ones (4 + 3 = 7) to get 37. If the ones make ten or more, carry the ten over.
    visual: 'Draw 24 mangoes as 2 sticks of ten and 4 dots, and 13 as 1 stick and 3 dots. Put them together: 3 sticks and 7 dots.'
    step_by_step: 'Step 1: Add the ones. Step 2: If 10 or more, carry 1 ten. Step 3: Add the tens. Step 4: Read the answer.'
    real_world: 'At Nani''s house you might pick 24 mangoes in the morning and 13 in the evening: 37 in all.'
  picture:
    kind: bars
    bars:
    - label: Morning
      value: 24
    - label: Evening
      value: 13
    - label: Total
      value: 37
    alt: 24 mangoes in the morning and 13 in the evening make 37 in all.
    unit: mangoes
  activity:
    type: sort
    prompt: Nani's sums. Which answer does each one make?
    bins:
    - '37'
    - '63'
    - '90'
    items:
    - label: 24 + 13
      bin: '37'
      clue: Add the tens, then the ones.
      why: 30 + 7.
    - label: 25 + 12
      bin: '37'
      clue: 'Tens first: 20 + 10.'
      why: 30 + 7.
    - label: 30 + 7
      bin: '37'
      clue: 3 tens and 7 ones.
      why: '37.'
    - label: 36 + 27
      bin: '63'
      clue: '6 + 7 is more than ten: carry it.'
      why: 13 ones = 1 ten and 3 ones; 5 + 1 = 6 tens.
    - label: 55 + 8
      bin: '63'
      clue: 5 + 8 makes more than ten.
      why: 'Carry the ten: 63.'
    - label: 40 + 23
      bin: '63'
      clue: Tens, then ones.
      why: 6 tens and 3 ones.
    - label: 45 + 45
      bin: '90'
      clue: '5 + 5 makes a ten: carry it.'
      why: 8 tens + 1 ten = 9 tens.
    - label: 82 + 8
      bin: '90'
      clue: 2 + 8 makes a ten.
      why: 9 tens, 0 ones.
    - label: 60 + 30
      bin: '90'
      clue: 6 tens and 3 tens.
      why: 9 tens.
  items:
  - prompt: Nani has 12 hens and 7 chicks. How many birds in all?
    answer: '19'
    check: 12 + 7
    difficulty: 1
    hints:
    - Put them together.
    - 12 + 7.
    solution: 12 + 7 = 19.
    mistakes: {"5": "m5_add_carry", "18": "m5_add_carry"}
  - prompt: 24 + 13 = ?
    answer: '37'
    check: 24 + 13
    difficulty: 1
    hints:
    - 'Tens: 20 + 10. Ones: 4 + 3.'
    - 30 + 7.
    solution: 24 + 13 = 37.
    mistakes: {"11": "m3_add_places", "47": "m3_add_places"}
  - prompt: 28 + 15 = ?
    answer: '43'
    check: 28 + 15
    difficulty: 2
    hints:
    - 'Ones: 8 + 5 = 13, carry 1.'
    - 'Tens: 2 + 1 + 1 = 4.'
    solution: 28 + 15 = 43.
    mistakes:
      '33': c3_place
      '313': c3_place
  - prompt: We climbed 35 steps, then 25 more to the temple. How many steps?
    answer: '60'
    check: 35 + 25
    difficulty: 2
    hints:
    - 35 + 25.
    - 5 + 5 = 10, carry.
    solution: 35 + 25 = 60.
    mistakes:
      '50': c3_place
  - prompt: Nani gave 10 laddoos to Raju and 10 to Meena. How many in all?
    answer: '20'
    check: 10 + 10
    difficulty: 1
    hints:
    - 10 + 10.
    - Two tens.
    solution: 10 + 10 = 20.
    mistakes: {"10": "m3_ten_and_ten", "100": "m3_ten_and_ten"}
  - prompt: 46 + 30 = ?
    answer: '76'
    check: 46 + 30
    difficulty: 1
    hints:
    - Add the tens only.
    - 4 tens + 3 tens.
    solution: 46 + 30 = 76.
    mistakes: {"49": "m3_add_places", "79": "m3_add_places"}
- code: cbse3m.nani.sub
  title: Taking away and comparing
  after:
  - cbse3m.nani.add
  notes: |
    Taking away (subtraction): 25 mangoes, 8 eaten, 17 left. Comparing: how many more / fewer = bigger − smaller. Borrow
    a ten when the ones digit is too small (42 − 17: 12 − 7 = 5, 3 − 1 = 2, so 25). Check by adding back: 25 + 17 = 42.
  explanations:
    text: When things are taken away or we want to know how many more, we subtract. If the ones are too few, break one ten into ten ones. Check your answer by adding back.
    visual: Draw 42 as 4 sticks and 2 dots. To take away 17, break one stick into 10 dots, then cross out 1 stick and 7 dots.
    step_by_step: 'Step 1: Subtract the ones (borrow a ten if needed). Step 2: Subtract the tens. Step 3: Check by adding.'
    real_world: If Nani had 30 eggs and used 12 for a cake, 18 are left.
  picture:
    kind: flow
    steps:
    - 42 − 17
    - 'Borrow: 12 − 7 = 5'
    - 'Tens: 3 − 1 = 2'
    - Answer 25
    - 'Check: 25 + 17 = 42'
    alt: To find 42 minus 17, borrow a ten so 12 minus 7 is 5, then 3 minus 1 is 2, giving 25; check by adding 25 and 17 to get 42.
  activity:
    type: sort
    prompt: Take away. Which answer does each one make?
    bins:
    - '27'
    - '28'
    - '35'
    items:
    - label: 45 − 18
      bin: '27'
      clue: '5 − 8 can''t be done: break a ten.'
      why: 15 − 8 = 7, and 3 − 1 = 2 tens.
    - label: 30 − 3
      bin: '27'
      clue: Break a ten into ones.
      why: '27.'
    - label: 50 − 23
      bin: '27'
      clue: 0 − 3 needs a ten broken.
      why: 10 − 3 = 7, 4 − 2 = 2.
    - label: 52 − 24
      bin: '28'
      clue: 2 − 4 needs a ten broken.
      why: 12 − 4 = 8, 4 − 2 = 2.
    - label: 40 − 12
      bin: '28'
      clue: '0 − 2: break a ten.'
      why: '28.'
    - label: 31 − 3
      bin: '28'
      clue: '1 − 3: break a ten.'
      why: 11 − 3 = 8.
    - label: 70 − 35
      bin: '35'
      clue: '0 − 5: break a ten.'
      why: '35. Check: 35 + 35 = 70.'
    - label: 50 − 15
      bin: '35'
      clue: Break a ten.
      why: '35.'
    - label: 42 − 7
      bin: '35'
      clue: '2 − 7: break a ten.'
      why: 12 − 7 = 5, 3 tens left.
  items:
  - prompt: 25 mangoes, 8 were eaten. How many are left?
    answer: '17'
    check: 25 - 8
    difficulty: 1
    hints:
    - Take away 8.
    - 25 − 8.
    solution: 25 − 8 = 17.
    mistakes:
      '33': c3_count_once
  - prompt: 42 − 17 = ?
    answer: '25'
    check: 42 - 17
    difficulty: 2
    hints:
    - 'Borrow a ten: 12 − 7.'
    - Then 3 − 1.
    solution: 42 − 17 = 25.
    mistakes:
      '35': c3_place
  - prompt: Raju is 9 years old and Nani is 65. How many years older is Nani?
    answer: '56'
    check: 65 - 9
    difficulty: 2
    hints:
    - Bigger − smaller.
    - 65 − 9.
    solution: 65 − 9 = 56.
    mistakes: {"74": "m5_subtract_not_add", "66": "m5_subtract_not_add"}
  - prompt: 30 − 12 = ?
    answer: '18'
    check: 30 - 12
    difficulty: 2
    hints:
    - 'Borrow: 10 − 2 = 8.'
    - 2 − 1 = 1.
    solution: 30 − 12 = 18.
    mistakes:
      '22': c3_place
  - prompt: 50 − 20 = ?
    answer: '30'
    check: 50 - 20
    difficulty: 1
    hints:
    - 5 tens − 2 tens.
    - Count back in tens.
    solution: 50 − 20 = 30.
    mistakes: {"70": "m3_take_tens", "3": "m3_take_tens"}
  - prompt: There are 14 cows and 9 goats. How many more cows than goats?
    answer: '5'
    check: 14 - 9
    difficulty: 1
    hints:
    - 'Compare: 14 − 9.'
    - Count up from 9 to 14.
    solution: 14 − 9 = 5.
    mistakes:
      '23': c3_count_once
