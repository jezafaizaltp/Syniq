# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 8
title: Fair Share
tips:
  m3_equal_parts: "A half must be one of 2 equal parts."
  m3_fair: "'Fair' means nobody gets more than anyone else."
  m3_groups_of: "Make groups of 2 from 10 pencils and count the groups."
  m3_halves: "'Half' comes from cutting something into equal parts, one for you and one for a friend. How many parts is that?"
  m3_quarters_half: "Fold a paper in half, then fold that half again. How many quarters are in it?"
  m3_seven_apples: "4 + 4 is 8. Do we have 8 apples?"

concepts:
- code: cbse3m.fs.share
  title: Sharing equally
  notes: |
    Sharing equally (division): 12 bananas among 3 children, give one at a time, each gets 4. 12 ÷ 3 = 4. Check: 3 × 4
    = 12. Grouping: 10 pencils in groups of 2 makes 5 groups. Sometimes some are left over.
  explanations:
    text: Fair share means everyone gets the same amount. To share 12 bananas among 3 children, hand them out one by one until none are left. Each child gets 4. We write 12 ÷ 3 = 4.
    visual: Draw 3 children and 12 dots. Draw a line from each dot to a child, taking turns, until all dots are used.
    step_by_step: 'Step 1: Count the things. Step 2: Count the people. Step 3: Give one to each in turn. Step 4: Count what one person has.'
    real_world: Sharing a packet of biscuits fairly with friends is division.
  picture:
    kind: flow
    steps:
    - 12 bananas
    - Give one to each of 3 children, again and again
    - Each gets 4
    - 'Check: 3 × 4 = 12'
    alt: '12 bananas are given one at a time to 3 children until each has 4; check: 3 times 4 is 12.'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Share fairly. Mark how many each one gets.
    goals:
    - prompt: 12 bananas for 3 children.
      target: 4
      mistakes:
      - when:
          v: 9
        say: '12 − 3 takes away. Hand them out one by one: each gets 4.'
      - when:
          v: 3
        say: 3 is the number of children.
    - prompt: 10 pencils for 2 friends.
      target: 5
      mistakes:
      - when:
          v: 8
        say: '10 − 2 takes away. Share: each gets half of 10.'
    - prompt: 16 marbles for 4 children.
      target: 4
      mistakes:
      - when:
          v: 12
        say: 16 − 4 takes away. 4 children each get 4.
  items:
  - prompt: 12 bananas shared equally by 3 children. How many each?
    answer: '4'
    check: 12/3
    difficulty: 1
    hints:
    - Hand out one at a time.
    - 3 × ? = 12.
    solution: 12 ÷ 3 = 4.
    mistakes:
      '9': c3_count_once
      '15': c3_count_once
  - prompt: 10 pencils in groups of 2. How many groups?
    answer: '5'
    check: 10/2
    difficulty: 1
    hints:
    - Count in 2s to 10.
    - 2, 4, 6, 8, 10.
    solution: 10 ÷ 2 = 5.
    mistakes: {"2": "m3_groups_of", "8": "m3_groups_of"}
  - prompt: 20 sweets shared by 4 friends. How many each?
    answer: '5'
    check: 20/4
    difficulty: 2
    hints:
    - 4 × ? = 20.
    - Count in 4s.
    solution: 20 ÷ 4 = 5.
    mistakes:
      '16': c3_count_once
  - prompt: 15 flowers in 5 vases equally. How many in each?
    answer: '3'
    check: 15/5
    difficulty: 2
    hints:
    - 5 × ? = 15.
    - 'Count in 5s: 5, 10, 15.'
    solution: 15 ÷ 5 = 3.
    mistakes: {"5": "m5_share", "20": "m5_share"}
  - prompt: 7 apples for 2 children fairly. What happens?
    options:
    - each gets 3, and 1 is left over
    - each gets 4
    - one gets all 7
    - each gets 7
    answer: each gets 3, and 1 is left over
    difficulty: 2
    hints:
    - 2 × 3 = 6.
    - 7 − 6 = ?
    solution: Each gets 3 and 1 is left.
    mistakes: {"each gets 4": "m3_seven_apples"}
  - prompt: 'Fair share means:'
    options:
    - everyone gets the same
    - the biggest gets most
    - the first one gets all
    - nobody gets any
    answer: everyone gets the same
    difficulty: 1
    hints:
    - Fair.
    - Equal.
    solution: Fair share means equal parts for everyone.
    mistakes: {"the biggest gets most": "m3_fair"}
- code: cbse3m.fs.half
  title: Halves and quarters
  after:
  - cbse3m.fs.share
  notes: |
    Cutting one whole into 2 equal parts gives halves (½); into 4 equal parts gives quarters (¼). The parts must be
    equal. 2 halves make a whole; 4 quarters make a whole; 2 quarters make a half. Half of 10 is 5.
  explanations:
    text: When we cut one thing into 2 equal parts, each part is a half. When we cut it into 4 equal parts, each part is a quarter. The parts must be the same size to be halves or quarters.
    visual: Draw a roti cut into 2 equal parts (halves) and another cut into 4 equal parts (quarters).
    step_by_step: 'Step 1: Count the parts. Step 2: Check they are equal. Step 3: 2 equal parts = halves; 4 equal parts = quarters.'
    real_world: Half a glass of milk, a quarter of a cake, half of a chapati are all fractions we use at home.
  picture:
    kind: compare
    columns:
    - title: Cut into
      points:
      - 2 equal parts
      - 4 equal parts
    - title: Each part
      points:
      - one half
      - one quarter
    alt: A whole cut into 2 equal parts gives halves; cut into 4 equal parts gives quarters.
  activity:
    type: sort
    prompt: Is each part a half, a quarter, or not equal?
    bins:
    - Halves
    - Quarters
    - Not fair shares
    items:
    - label: A roti cut into 2 equal parts
      bin: Halves
      clue: How many equal parts?
      why: '2 equal parts: halves.'
    - label: An apple cut down the middle into 2 same pieces
      bin: Halves
      clue: Two pieces the same size.
      why: Halves.
    - label: A cake cut into 4 equal pieces
      bin: Quarters
      clue: How many equal pieces?
      why: '4: quarters.'
    - label: A square paper folded twice into 4 same parts
      bin: Quarters
      clue: Count the parts.
      why: Quarters.
    - label: A roti torn into one big and one small piece
      bin: Not fair shares
      clue: Are the parts the same size?
      why: 'Not equal: not halves.'
    - label: A chocolate broken into 4 different-sized bits
      bin: Not fair shares
      clue: Same size?
      why: 'Not equal: not quarters.'
  items:
  - prompt: How many halves make one whole?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Cut into 2 equal parts.
    - Half and half.
    solution: 2 halves make a whole.
    mistakes: {"1": "m3_halves", "4": "m3_halves"}
  - prompt: How many quarters make one whole?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Quarter means one of 4 equal parts.
    - Count them.
    solution: 4 quarters make a whole.
    mistakes: {"2": "m5_quarters", "3": "m5_quarters"}
  - prompt: 'Half of 10 is:'
    answer: '5'
    check: 10/2
    difficulty: 1
    hints:
    - Share 10 between 2.
    - 5 + 5 = 10.
    solution: Half of 10 is 5.
    mistakes: {"2": "m4_half", "20": "m4_half"}
  - prompt: A roti is cut into 2 parts, one big and one small. Is each part a half?
    options:
    - no, the parts are not equal
    - 'yes'
    - yes, if it is hot
    - only the big one
    answer: no, the parts are not equal
    difficulty: 2
    hints:
    - Halves must be equal.
    - Look at the sizes.
    solution: Halves must be equal, so these are not halves.
    mistakes: {"yes": "m3_equal_parts"}
  - prompt: How many quarters make a half?
    answer: '2'
    check: 4/2
    difficulty: 2
    hints:
    - 4 quarters = 1 whole.
    - Half of 4.
    solution: 2 quarters make a half.
    mistakes: {"4": "m3_quarters_half", "1": "m3_quarters_half"}
  - prompt: Half of 8 laddoos is how many laddoos?
    answer: '4'
    check: 8/2
    difficulty: 1
    hints:
    - Share between 2.
    - 4 + 4.
    solution: Half of 8 is 4.
    mistakes: {"2": "m4_half", "16": "m4_half"}
