# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 8
title: Fair Share
tips:
  m3_equal_parts: "A half must be one of 2 equal parts."
  m3_fair: "'Fair' means nobody gets more than anyone else."
  m3_groups_of: "Make groups of 2 from 10 pencils and count the groups."
  m3_halves: "'Half' comes from cutting something into equal parts, one for you and one for a friend. How many parts is that?"
  m3_quarters_half: "Fold a paper in half, then fold that half again. How many quarters are in it?"
  m3_seven_apples: "4 + 4 is 8. Do we have 8 apples?"
  c3m8_deal: Deal them out one at a time, one to each person, round and round, then count one person's pile.
  c3m8_check: 'Check by multiplying: number of people × each share should give back the total.'
  c3m8_equal: 'Look at the parts: are they exactly the same size? Fold one onto the other in your head.'
  c3m8_half: Half means split into 2 equal parts. Make two equal piles and count one.

concepts:
- code: cbse3m.fs.share
  title: Sharing equally
  notes: |
    Sharing equally (division): 12 bananas among 3 children, give one at a time, each gets 4. 12 ÷ 3 = 4. Check: 3 × 4
    = 12. Grouping: 10 pencils in groups of 2 makes 5 groups. Sometimes some are left over.
  explanations:
    text: Fair share means everyone gets the same amount. To share 12 bananas among 3 children, hand them out one by one until none are left. Each child gets 4. We write 12 ÷ 3 = 4.
    visual: Draw 3 children and 12 dots. Draw a line from each dot to a child, taking turns, until all dots are used.
    step_by_step: 'Step 1: Count the things. Step 2: Count the people. Step 3: Give one to each in turn. Step 4: Count what one person has.'
    real_world: Sharing a packet of biscuits fairly with friends is division.
  picture:
    kind: flow
    steps:
    - 12 bananas
    - Give one to each of 3 children, again and again
    - Each gets 4
    - 'Check: 3 × 4 = 12'
    alt: '12 bananas are given one at a time to 3 children until each has 4; check: 3 times 4 is 12.'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Share fairly. Mark how many each one gets.
    goals:
    - prompt: 12 bananas for 3 children.
      target: 4
      mistakes:
      - when:
          v: 9
        say: '12 − 3 takes away. Hand them out one by one: each gets 4.'
      - when:
          v: 3
        say: 3 is the number of children.
    - prompt: 10 pencils for 2 friends.
      target: 5
      mistakes:
      - when:
          v: 8
        say: '10 − 2 takes away. Share: each gets half of 10.'
    - prompt: 16 marbles for 4 children.
      target: 4
      mistakes:
      - when:
          v: 12
        say: 16 − 4 takes away. 4 children each get 4.
  lesson:
    - teach: Sharing fairly means everyone gets the same. To share 12 bananas among 3 children, give one to each child, again and again, until none are left. Each child ends up with 4.
      picture:
        kind: compare
        columns:
        - title: Child 1
          points:
          - 4 bananas
        - title: Child 2
          points:
          - 4 bananas
        - title: Child 3
          points:
          - 4 bananas
        alt: '12 bananas shared fairly: 4 for each of 3 children.'
      check:
        prompt: 8 sweets shared fairly by 2 children. How many each?
        options:
        - '4'
        - '6'
        - '10'
        answer: '4'
        why: Dealing one each in turn gives 4 to each child.
      ways:
      - style: step_by_step
        teach: 'Share 16 crayons between 2 children. Step 1: Give one crayon to each child: 2 are gone. Step 2: Keep going, one each, again and again. Step 3: Stop when none are left. Step 4: Count one child''s pile: 8 each.'
      - style: real_world
        teach: 'When friends share a packet of biscuits, they often deal them out like cards: one for you, one for me. Dealing out one at a time is a fair way to share.'
    - teach: 'Sharing is written with ÷. 12 ÷ 3 = 4 means ''12 shared into 3 equal parts gives 4 each''. You can check with multiplication: 3 × 4 = 12.'
      check:
        prompt: If 15 ÷ 3 = 5, which multiplication checks it?
        options:
        - 3 × 5 = 15
        - 15 × 3 = 45
        - 5 + 3 = 8
        answer: 3 × 5 = 15
        why: 3 shares of 5 make back the 15.
      ways:
      - style: visual
        teach: Sharing and multiplying are two sides of the same fact.
        picture:
          kind: compare
          columns:
          - title: Share
            points:
            - 16 ÷ 2 = 8
            - 16 shared by 2 gives 8 each
          - title: Check
            points:
            - 2 × 8 = 16
            - 2 groups of 8 make 16
          alt: 16 ÷ 2 = 8 means 16 shared by 2 gives 8 each. We can check with 2 × 8 = 16, because 2 groups of 8 make 16.
      - style: real_world
        teach: A cook who has to share 24 idlis among the plates on a table can check the sharing by counting the plates and the idlis on each plate, then multiplying.
    - teach: 'Grouping is another way to divide: 12 pencils in groups of 4 gives 3 groups. Sometimes things do not share exactly: 9 among 2 gives 4 each and 1 left over.'
      check:
        prompt: 11 apples for 2 children fairly. How many are left over?
        options:
        - '1'
        - '0'
        - '2'
        answer: '1'
        why: Each gets 5 (10 used), and 1 is left over.
      ways:
      - style: visual
        teach: 'Grouping: 14 balls are put into boxes that hold 7 each.'
        picture:
          kind: number_line
          from: 0
          to: 14
          step: 1
          jumps:
          - from: 0
            to: 7
            label: box 1
          - from: 7
            to: 14
            label: box 2
          alt: Putting 14 balls in boxes of 7 is two jumps of 7 on the number line, from 0 to 7 and from 7 to 14. So 2 boxes are filled.
      - style: step_by_step
        teach: 'Share 11 marbles among 3 children. Step 1: Deal them out one each. Step 2: After 3 rounds, each child has 3 and 9 are used. Step 3: 2 marbles are left, not enough for another round. Step 4: Each gets 3, and 2 are left over.'
  items:
  - prompt: 12 bananas shared equally by 3 children. How many each?
    answer: '4'
    check: 12/3
    difficulty: 1
    hints:
    - Hand out one at a time.
    - 3 × ? = 12.
    solution: 12 ÷ 3 = 4.
    mistakes:
      '9': c3_count_once
      '15': c3_count_once
  - prompt: 10 pencils in groups of 2. How many groups?
    answer: '5'
    check: 10/2
    difficulty: 1
    hints:
    - Count in 2s to 10.
    - 2, 4, 6, 8, 10.
    solution: 10 ÷ 2 = 5.
    mistakes: {"2": "m3_groups_of", "8": "m3_groups_of"}
  - prompt: 20 sweets shared by 4 friends. How many each?
    answer: '5'
    check: 20/4
    difficulty: 2
    hints:
    - 4 × ? = 20.
    - Count in 4s.
    solution: 20 ÷ 4 = 5.
    mistakes:
      '16': c3_count_once
  - prompt: 15 flowers in 5 vases equally. How many in each?
    answer: '3'
    check: 15/5
    difficulty: 2
    hints:
    - 5 × ? = 15.
    - 'Count in 5s: 5, 10, 15.'
    solution: 15 ÷ 5 = 3.
    mistakes: {"5": "m5_share", "20": "m5_share"}
  - prompt: 7 apples for 2 children fairly. What happens?
    options:
    - "each gets 3, and 1 is left over"
    - "each gets 4, and none are left"
    - "one child gets all 7 apples"
    - "each child gets 7 apples"
    answer: each gets 3, and 1 is left over
    difficulty: 2
    hints:
    - 2 × 3 = 6.
    - 7 − 6 = ?
    solution: Each gets 3 and 1 is left.
    mistakes: {"each gets 4, and none are left": "m3_seven_apples"}
  - prompt: 'Fair share means:'
    options:
    - everyone gets the same
    - the biggest gets most
    - the first one gets all
    - nobody gets any
    answer: everyone gets the same
    difficulty: 1
    hints:
    - Fair.
    - Equal.
    solution: Fair share means equal parts for everyone.
    mistakes: {"the biggest gets most": "m3_fair"}
  - prompt: 18 marbles shared equally by 2 friends. How many each?
    answer: '9'
    check: 18/2
    difficulty: 1
    hints:
    - Make 2 equal piles.
    - What doubled makes 18?
    solution: 'Step 1: 9 + 9 = 18. Step 2: Each gets 9.'
    mistakes:
      '16': c3m8_deal
      '8': c3m8_check
  - prompt: 24 chairs in rows of 6. How many rows?
    answer: '4'
    check: 24/6
    difficulty: 2
    hints:
    - Make groups of 6.
    - Skip count by 6 to 24.
    solution: 'Step 1: 6, 12, 18, 24. Step 2: That is 4 rows.'
    mistakes:
      '6': c3m8_check
      '18': c3m8_deal
  - prompt: 30 ÷ 5 = ?
    answer: '6'
    check: 30/5
    difficulty: 2
    hints:
    - How many 5s make 30?
    - Count 5, 10, 15...
    solution: 'Step 1: 5 × 6 = 30. Step 2: So 30 ÷ 5 = 6.'
    mistakes:
      '25': c3m8_deal
      '5': c3m8_check
  - prompt: 'Is this a fair share? 10 sweets: one child gets 6, the other gets 4.'
    options:
    - no, the shares are not the same
    - yes, all sweets were given
    - yes, both got some
    answer: no, the shares are not the same
    difficulty: 1
    hints:
    - What does fair share mean?
    - Compare 6 and 4.
    solution: 'Step 1: Fair means equal. Step 2: 6 and 4 are not equal, so it is not fair.'
    mistakes:
      yes, all sweets were given: c3m8_equal
      yes, both got some: c3m8_equal
  - prompt: 16 laddoos put in boxes of 4. How many boxes?
    answer: '4'
    check: 16/4
    difficulty: 1
    hints:
    - Count in 4s to 16.
    - 4, 8, 12, 16.
    solution: 'Step 1: 4 × 4 = 16. Step 2: 4 boxes.'
    mistakes:
      '12': c3m8_deal
      '8': c3m8_check
  - prompt: 13 pencils shared by 4 children equally. How many pencils are left over?
    answer: '1'
    check: 13-12
    difficulty: 3
    hints:
    - How many does each child get first?
    - 4 × 3 = 12.
    solution: 'Step 1: Each gets 3, using 12. Step 2: 13 − 12 = 1 left over.'
    mistakes:
      '3': c3m8_check
      '0': c3m8_deal
  - prompt: 40 ÷ 10 = ?
    answer: '4'
    check: 40/10
    difficulty: 1
    hints:
    - How many tens in 40?
    - 10 × ? = 40.
    solution: 'Step 1: 10 × 4 = 40. Step 2: So 40 ÷ 10 = 4.'
    mistakes:
      '30': c3m8_deal
      '10': c3m8_check
  - prompt: A teacher has 21 crayons for 3 tables, the same at each table. How many crayons go to each table?
    answer: '7'
    check: 21/3
    difficulty: 2
    hints:
    - Share 21 into 3 equal parts.
    - 3 × ? = 21.
    solution: 'Step 1: 3 × 7 = 21. Step 2: 7 crayons each.'
    mistakes:
      '18': c3m8_deal
      '8': c3m8_check
  - prompt: Riya shares 20 stickers equally with 3 friends (4 children in all). How many does each child get?
    answer: '5'
    check: 20/4
    difficulty: 3
    hints:
    - Count all the children sharing, including Riya.
    - 20 shared by 4.
    solution: 'Step 1: Riya + 3 friends = 4 children. Step 2: 20 ÷ 4 = 5 each.'
    mistakes:
      '6': c3m8_deal
      '7': c3m8_deal
  - prompt: 'Case: A teacher has 28 sheets of coloured paper for 4 groups. One group gets 10 sheets, and the other three get 6 each. The children say it is unfair. How should the sheets be shared?'
    options:
    - "7 sheets for each group, because 28 ÷ 4 = 7"
    - "Give the group with 10 sheets even more"
    - "Give 10 sheets to every one of the groups"
    answer: 7 sheets for each group, because 28 ÷ 4 = 7
    hints:
    - A fair share means every group gets the same.
    - Share 28 into 4 equal parts. Check with multiplication.
    solution: '28 shared into 4 equal parts is 7 each. Check: 4 × 7 = 28.'
    mistakes:
      "Give the group with 10 sheets even more": c3m8_equal
      "Give 10 sheets to every one of the groups": c3m8_check
    exam: case
    difficulty: 2
  - prompt: 'Situation: You have 17 stickers to share fairly with 2 friends, so 3 children in all. What will happen?'
    options:
    - Each child gets 5 and 2 are left over
    - Each child gets 6, with none left over
    - One child gets 7 and the others get 5
    answer: Each child gets 5 and 2 are left over
    hints:
    - Deal them out one each, again and again.
    - When fewer than 3 are left, can you go round again?
    solution: After 5 rounds, 15 stickers are used and each child has 5. 2 are left, which is not enough for one more each.
    mistakes:
      Each child gets 6, with none left over: c3m8_deal
      One child gets 7 and the others get 5: c3m8_equal
    exam: competency
    difficulty: 2
- code: cbse3m.fs.half
  title: Halves and quarters
  after:
  - cbse3m.fs.share
  notes: |
    Cutting one whole into 2 equal parts gives halves (½); into 4 equal parts gives quarters (¼). The parts must be
    equal. 2 halves make a whole; 4 quarters make a whole; 2 quarters make a half. Half of 10 is 5.
  explanations:
    text: When we cut one thing into 2 equal parts, each part is a half. When we cut it into 4 equal parts, each part is a quarter. The parts must be the same size to be halves or quarters.
    visual: Draw a roti cut into 2 equal parts (halves) and another cut into 4 equal parts (quarters).
    step_by_step: 'Step 1: Count the parts. Step 2: Check they are equal. Step 3: 2 equal parts = halves; 4 equal parts = quarters.'
    real_world: Half a glass of milk, a quarter of a cake, half of a chapati are all fractions we use at home.
  picture:
    kind: compare
    columns:
    - title: Cut into
      points:
      - 2 equal parts
      - 4 equal parts
    - title: Each part
      points:
      - one half
      - one quarter
    alt: A whole cut into 2 equal parts gives halves; cut into 4 equal parts gives quarters.
  activity:
    type: sort
    prompt: Is each part a half, a quarter, or not equal?
    bins:
    - Halves
    - Quarters
    - Not fair shares
    items:
    - label: A roti cut into 2 equal parts
      bin: Halves
      clue: How many equal parts?
      why: '2 equal parts: halves.'
    - label: An apple cut down the middle into 2 same pieces
      bin: Halves
      clue: Two pieces the same size.
      why: Halves.
    - label: A cake cut into 4 equal pieces
      bin: Quarters
      clue: How many equal pieces?
      why: '4: quarters.'
    - label: A square paper folded twice into 4 same parts
      bin: Quarters
      clue: Count the parts.
      why: Quarters.
    - label: A roti torn into one big and one small piece
      bin: Not fair shares
      clue: Are the parts the same size?
      why: 'Not equal: not halves.'
    - label: A chocolate broken into 4 different-sized bits
      bin: Not fair shares
      clue: Same size?
      why: 'Not equal: not quarters.'
  lesson:
    - teach: A half is one of 2 equal parts of a whole. If you fold a roti exactly in the middle and cut, each piece is a half. We write half as ½.
      check:
        prompt: 'One whole cut into 2 equal parts. Each part is:'
        options:
        - a half
        - a quarter
        - a whole
        answer: a half
        why: 2 equal parts make halves.
      ways:
      - style: visual
        teach: Halves are 2 equal parts; two unequal parts are not halves.
        picture:
          kind: compare
          columns:
          - title: Halves
            points:
            - Cut exactly in the middle
            - Both parts the same size
          - title: Not halves
            points:
            - Cut off to one side
            - One big part, one small part
          alt: When something is cut exactly in the middle, the two parts are the same size and each is a half. When it is cut off to one side, there is one big part and one small part, so they are not halves.
      - style: real_world
        teach: When two friends share a chocolate bar, one breaks it and the other chooses first. The one breaking it tries hard to make both halves equal.
    - teach: A quarter is one of 4 equal parts. Fold in half, then in half again. 4 quarters make a whole, and 2 quarters make a half.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: ¼
        - size: 1
          label: ¼
        - size: 1
          label: ¼
        - size: 1
          label: ¼
        rows:
        - size: 1
          label: whole
        cells:
        - - ½
          - ½
          - other ½
          - other ½
        alt: A strip in 4 equal quarters; 2 quarters together make a half.
      check:
        prompt: How many quarters make a whole?
        options:
        - '4'
        - '2'
        - '3'
        answer: '4'
        why: A whole cut into 4 equal parts has 4 quarters.
      ways:
      - style: step_by_step
        teach: 'Make quarters from a paper square. Step 1: Fold it in half. Step 2: Fold it in half again. Step 3: Open it: the folds show 4 equal parts. Step 4: Each part is a quarter, and 2 of them together make a half.'
      - style: visual
        teach: A whole, halves and quarters of the same roti.
        picture:
          kind: compare
          columns:
          - title: Whole
            points:
            - 1 whole roti
          - title: Halves
            points:
            - 2 equal parts
            - Each is ½
          - title: Quarters
            points:
            - 4 equal parts
            - Each is ¼
            - 2 quarters = ½
          alt: One whole roti can be cut into 2 equal halves, each ½, or into 4 equal quarters, each ¼. Two quarters make a half.
    - teach: 'The parts must be equal. A roti cut into one big and one small piece does not give halves. Half of a group: make 2 equal piles. Half of 6 pencils is 3 pencils.'
      check:
        prompt: 'Half of 12 is:'
        options:
        - '6'
        - '10'
        - '24'
        answer: '6'
        why: Two equal piles of 6 make 12.
      ways:
      - style: step_by_step
        teach: 'Find half of 22 pencils. Step 1: Make 2 piles. Step 2: Put one pencil on each pile, again and again. Step 3: When all are used, count one pile: 11. Half of 22 is 11.'
      - style: visual
        teach: 'Half of 22 pencils: two equal piles, then count one pile.'
        picture:
          kind: compare
          columns:
          - title: Pile 1
            points:
            - 11 pencils
          - title: Pile 2
            points:
            - 11 pencils
          alt: 22 pencils are dealt into two equal piles of 11. One pile is half, so half of 22 is 11.
  items:
  - prompt: How many halves make one whole?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Cut into 2 equal parts.
    - Half and half.
    solution: 2 halves make a whole.
    mistakes: {"1": "m3_halves", "4": "m3_halves"}
  - prompt: How many quarters make one whole?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Quarter means one of 4 equal parts.
    - Count them.
    solution: 4 quarters make a whole.
    mistakes: {"2": "m5_quarters", "3": "m5_quarters"}
  - prompt: 'Half of 10 is:'
    answer: '5'
    check: 10/2
    difficulty: 1
    hints:
    - Share 10 between 2.
    - 5 + 5 = 10.
    solution: Half of 10 is 5.
    mistakes: {"2": "m4_half", "20": "m4_half"}
  - prompt: A roti is cut into 2 parts, one big and one small. Is each part a half?
    options:
    - "no, the parts are not equal"
    - "yes, any 2 parts are halves"
    - "yes, but only if it is hot"
    - "only the big part is a half"
    answer: no, the parts are not equal
    difficulty: 2
    hints:
    - Halves must be equal.
    - Look at the sizes.
    solution: Halves must be equal, so these are not halves.
    mistakes: {"yes, any 2 parts are halves": "m3_equal_parts"}
  - prompt: How many quarters make a half?
    answer: '2'
    check: 4/2
    difficulty: 2
    hints:
    - 4 quarters = 1 whole.
    - Half of 4.
    solution: 2 quarters make a half.
    mistakes: {"4": "m3_quarters_half", "1": "m3_quarters_half"}
  - prompt: Half of 8 laddoos is how many laddoos?
    answer: '4'
    check: 8/2
    difficulty: 1
    hints:
    - Share between 2.
    - 4 + 4.
    solution: Half of 8 is 4.
    mistakes: {"2": "m4_half", "16": "m4_half"}
  - prompt: 'Half of 14 is:'
    answer: '7'
    check: 14/2
    difficulty: 1
    hints:
    - Make 2 equal piles.
    - What plus itself makes 14?
    solution: 'Step 1: 7 + 7 = 14. Step 2: Half is 7.'
    mistakes:
      '12': c3m8_half
      '28': c3m8_half
  - prompt: 'A cake is cut into 4 equal pieces. Each piece is:'
    options:
    - a quarter
    - a half
    - a whole
    answer: a quarter
    difficulty: 1
    hints:
    - How many equal pieces?
    - 4 equal parts are called...
    solution: 'Step 1: 4 equal pieces. Step 2: Each is a quarter.'
    mistakes:
      a half: c3m8_equal
      a whole: c3m8_equal
  - prompt: How many halves are in 3 whole oranges?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - Each orange makes 2 halves.
    - 2 + 2 + 2.
    solution: 'Step 1: 1 orange = 2 halves. Step 2: 3 oranges = 6 halves.'
    mistakes:
      '3': c3m8_half
      '4': c3m8_half
  - prompt: A quarter of 8 sweets is how many sweets?
    answer: '2'
    check: 8/4
    difficulty: 2
    hints:
    - Make 4 equal piles.
    - 8 shared by 4.
    solution: 'Step 1: 4 piles of 2 = 8. Step 2: A quarter is 2.'
    mistakes:
      '4': c3m8_half
      '6': c3m8_equal
  - prompt: A paper is folded into 2 parts that do not match. Are they halves?
    options:
    - no, the parts are not equal
    - yes, there are 2 parts
    - yes, it was folded
    answer: no, the parts are not equal
    difficulty: 1
    hints:
    - What must be true about halves?
    - Do the parts match?
    solution: 'Step 1: Halves must be equal. Step 2: These do not match, so they are not halves.'
    mistakes:
      yes, there are 2 parts: c3m8_equal
      yes, it was folded: c3m8_equal
  - prompt: Half of 20 rupees is how many rupees?
    answer: '10'
    check: 20/2
    difficulty: 1
    hints:
    - Split 20 into 2 equal parts.
    - 10 + 10.
    solution: 'Step 1: 10 + 10 = 20. Step 2: Half is ₹10.'
    mistakes:
      '5': c3m8_half
      '40': c3m8_half
  - prompt: 'Which is bigger: half of a roti or a quarter of the same roti?'
    options:
    - half
    - quarter
    - they are the same
    answer: half
    difficulty: 2
    hints:
    - A half needs 2 quarters.
    - Fewer parts means bigger parts.
    solution: 'Step 1: Half = 2 quarters. Step 2: So the half is bigger.'
    mistakes:
      quarter: c3m8_equal
      they are the same: c3m8_equal
  - prompt: 3 quarters of a pizza are eaten. How many quarters are left?
    answer: '1'
    check: 4-3
    difficulty: 2
    hints:
    - A whole pizza has 4 quarters.
    - 4 − 3.
    solution: 'Step 1: Whole = 4 quarters. Step 2: 4 − 3 = 1 quarter left.'
    mistakes:
      '3': c3m8_equal
      '2': c3m8_equal
  - prompt: Ali had 16 marbles and gave half to a friend, then half of what was left to a cousin. How many does Ali have now?
    answer: '4'
    check: 16/2/2
    difficulty: 3
    hints:
    - Half of 16 first.
    - Then half of that.
    solution: 'Step 1: Half of 16 = 8. Step 2: Half of 8 = 4.'
    mistakes:
      '8': c3m8_half
      '12': c3m8_half
  - prompt: 'Case: Two children share a long sugarcane. One cuts it near one end and says, ''Here is your half.'' The other piece is much longer. Is that fair?'
    options:
    - "No, halves must be equal, so it should be cut in the middle"
    - "Yes, any 2 pieces of one thing are always its halves"
    - "Yes, because the shorter piece is the sweeter half"
    answer: No, halves must be equal, so it should be cut in the middle
    hints:
    - What must be true about the two parts to call them halves?
    - Are the two pieces the same length?
    solution: Halves are 2 equal parts. A cut near the end makes one short and one long piece, so they are not halves.
    mistakes:
      "Yes, any 2 pieces of one thing are always its halves": c3m8_half
      "Yes, because the shorter piece is the sweeter half": c3m8_half
    exam: case
    difficulty: 2
  - prompt: 'Situation: You have 12 grapes and want to give a quarter of them to your little sister. How many grapes do you give?'
    options:
    - '3'
    - '6'
    - '4'
    answer: '3'
    hints:
    - A quarter means one of how many equal parts?
    - Make that many equal piles from 12.
    solution: A quarter is one of 4 equal parts. 12 grapes in 4 equal piles gives 3 in each pile.
    mistakes:
      '6': m3_quarters_half
      '4': c3m8_half
    exam: competency
    difficulty: 2
