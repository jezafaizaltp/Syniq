# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 3
title: Double Century
concepts:
- code: cbse3m.dc.tens
  title: Counting in tens and hundreds up to 200
  notes: |
    10 ones make 1 ten; 10 tens make 1 hundred. Counting by tens: 10, 20 ... 100, 110 ... 200. 100 runs is a century in
    cricket; 200 runs is a double century. Numbers from 101 to 200: 1 hundred, some tens, some ones (e.g. 156 = 100 + 50
    + 6).
  explanations:
    text: 'Ten ones make a ten, and ten tens make a hundred. Count in tens: 10, 20, 30 ... 100, 110, 120 ... 200. In cricket, 100 runs is a century, and 200 runs is a double century!'
    visual: Draw 2 big squares for 2 hundreds, then show 156 as 1 hundred square, 5 sticks of ten and 6 dots.
    step_by_step: 'Step 1: Count the hundreds. Step 2: Count the tens. Step 3: Count the ones. Step 4: Put them together.'
    real_world: A batter who scores 200 runs in one match has hit a double century.
  picture:
    kind: number_line
    from: 0
    to: 200
    step: 20
    points:
    - at: 100
      label: century
    - at: 200
      label: double century
    alt: 'Counting by twenties from 0 to 200: 100 is a century and 200 is a double century.'
    jumps:
    - from: 0
      to: 100
      label: '+100'
    - from: 100
      to: 200
      label: '+100'
  items:
  - prompt: '10 tens make:'
    answer: '100'
    check: 10*10
    difficulty: 1
    hints:
    - Count 10, 20, 30 ... ten times.
    - One hundred.
    solution: 10 tens = 100.
  - prompt: What comes after 190 when counting in tens?
    answer: '200'
    check: 190 + 10
    difficulty: 1
    hints:
    - 190 + 10.
    - Double century.
    solution: 190 + 10 = 200.
    mistakes:
      '191': c3_place
  - prompt: '1 hundred, 5 tens and 6 ones make:'
    answer: '156'
    check: 100 + 50 + 6
    difficulty: 1
    hints:
    - 100 + 50 + 6.
    - Write the digits in order.
    solution: 100 + 50 + 6 = 156.
    mistakes:
      '651': c3_place
  - prompt: How many tens are in 120?
    answer: '12'
    check: 120 // 10
    difficulty: 2
    hints:
    - 100 has 10 tens.
    - Then 2 more tens.
    solution: 120 = 12 tens.
    mistakes:
      '2': c3_place
  - prompt: A batter has 170 runs. How many more for a double century?
    answer: '30'
    check: 200 - 170
    difficulty: 2
    hints:
    - Count up in tens from 170.
    - 180, 190, 200.
    solution: 200 − 170 = 30.
  - prompt: Which number is bigger?
    options:
    - '181'
    - '118'
    - '108'
    - '180'
    answer: '181'
    difficulty: 2
    hints:
    - All have 1 hundred.
    - Compare the tens.
    solution: 181 has 8 tens and 1 one, the most.
- code: cbse3m.dc.add
  title: Adding and taking away tens
  after:
  - cbse3m.dc.tens
  notes: |
    Adding tens: 120 + 30 = 150 (12 tens + 3 tens = 15 tens). Taking away tens: 180 − 40 = 140. Number line jumps of 10.
    Before and after numbers: before 150 is 149, after 150 is 151. Skip counting by 5s and 2s also helps.
  explanations:
    text: 'To add tens, just add the tens digits: 120 + 30 is 12 tens and 3 tens, which is 15 tens, or 150. To take away tens, count back in tens.'
    visual: 'Draw a number line from 100 to 200 and make three jumps of 10 from 120: 130, 140, 150.'
    step_by_step: 'Step 1: Start at the first number. Step 2: Jump forward (add) or back (take away) in tens. Step 3: Read where you land.'
    real_world: A cricket score jumps by 10 when a team hits a four, a four and two runs (4 + 4 + 2).
  picture:
    kind: number_line
    from: 100
    to: 200
    step: 10
    points:
    - at: 120
      label: start
    - at: 150
      label: end
    alt: Starting at 120 and jumping three tens forward lands on 150.
    jumps:
    - from: 120
      to: 130
      label: '+10'
    - from: 130
      to: 140
      label: '+10'
    - from: 140
      to: 150
      label: '+10'
  items:
  - prompt: 120 + 30 = ?
    answer: '150'
    check: 120 + 30
    difficulty: 1
    hints:
    - 12 tens + 3 tens.
    - Count on 130, 140, 150.
    solution: 120 + 30 = 150.
    mistakes:
      '123': c3_place
  - prompt: 180 − 40 = ?
    answer: '140'
    check: 180 - 40
    difficulty: 1
    hints:
    - Count back in tens.
    - 170, 160, 150, 140.
    solution: 180 − 40 = 140.
  - prompt: What number comes just before 150?
    answer: '149'
    check: 150 - 1
    difficulty: 1
    hints:
    - One less.
    - 150 − 1.
    solution: 149 comes just before 150.
  - prompt: What number comes just after 199?
    answer: '200'
    check: 199 + 1
    difficulty: 2
    hints:
    - One more.
    - 199 + 1.
    solution: 199 + 1 = 200.
    mistakes:
      '1910': c3_place
  - prompt: Start at 110 and make 5 jumps of 10. Where do you land?
    answer: '160'
    check: 110 + 5*10
    difficulty: 2
    hints:
    - 5 jumps of 10 = 50.
    - 110 + 50.
    solution: 110 + 50 = 160.
  - prompt: 100 + 60 + 4 = ?
    answer: '164'
    check: 100 + 60 + 4
    difficulty: 1
    hints:
    - Hundreds, tens, ones.
    - Write 1, 6, 4.
    solution: 100 + 60 + 4 = 164.
