# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 1
title: What's in a Name?
tips:
  c3_count_once: Touch each thing as you count it, so you count every one exactly once.
  c3_place: 'Read the digits from the left: hundreds, tens, ones.'
concepts:
- code: cbse3m.name.tally
  title: Counting with tally marks
  notes: |
    Tally marks help us count things one by one: draw one stick for each thing; the fifth stick crosses the first four,
    making a bundle of 5. Count the bundles in fives, then add the extra sticks. A shepherd can keep count of sheep this
    way, one mark for each sheep as it goes through the gate.
  explanations:
    text: 'Tally marks are a quick way to count. Draw one line for each thing. When you reach five, draw the fifth line across the other four. Then count the bundles in fives: 5, 10, 15, and add the lines left over.'
    visual: 'Draw three bundles of five tally marks and two extra lines. Count: 5, 10, 15, 16, 17.'
    step_by_step: 'Step 1: Draw one line for each thing. Step 2: Cross every group of four with the fifth line. Step 3: Count in fives, then add the single lines.'
    real_world: A shepherd puts a mark on a stick each time a sheep goes into the pen, so no sheep is missed.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 5
    points:
    - at: 5
      label: 1 bundle
    - at: 10
      label: 2 bundles
    - at: 15
      label: 3 bundles
    - at: 17
      label: '+2'
    alt: 'Counting tally bundles on a number line: 5, 10, 15, then 2 more makes 17.'
    jumps:
    - from: 0
      to: 5
      label: '+5'
    - from: 5
      to: 10
      label: '+5'
    - from: 10
      to: 15
      label: '+5'
    - from: 15
      to: 17
      label: '+2'
  items:
  - prompt: One bundle of tally marks stands for how many things?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count the lines in a bundle.
    - Four lines and one across.
    solution: One bundle is 5.
  - prompt: How many things do 2 bundles of tally marks show?
    answer: '10'
    check: 5 + 5
    difficulty: 1
    hints:
    - Count in fives.
    - 5, 10.
    solution: 2 bundles = 5 + 5 = 10.
  - prompt: 3 bundles and 2 single marks. How many things?
    answer: '17'
    check: 3*5 + 2
    difficulty: 2
    hints:
    - 'Count the bundles: 5, 10, 15.'
    - Then 2 more.
    solution: 15 + 2 = 17.
    mistakes:
      '5': c3_count_once
      '32': c3_count_once
  - prompt: A shepherd has 12 sheep. How many full bundles of 5 can he make?
    answer: '2'
    check: 12 // 5
    difficulty: 2
    hints:
    - 5, 10 ... is 15 too many?
    - Count the bundles.
    solution: 12 has two bundles of 5 (10) and 2 left over.
  - prompt: 4 bundles of tally marks show how many?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - 5, 10, 15, 20.
    - Count in fives.
    solution: 4 × 5 = 20.
  - prompt: Why do we cross the fifth tally mark?
    options:
    - to make bundles of 5 that are easy to count
    - because 5 is unlucky
    - to rub out a mistake
    - to show zero
    answer: to make bundles of 5 that are easy to count
    difficulty: 1
    hints:
    - Counting in fives is quick.
    - It groups the marks.
    solution: The crossing line makes a bundle of 5.
- code: cbse3m.name.compare
  title: Names, lists and comparing counts
  after:
  - cbse3m.name.tally
  notes: |
    Giving each thing a name or a number helps us keep track: names of children in class, names of cows in a herd.
    Lists can be counted and compared: which list is longer, by how many. Words: more than, fewer than, the same as.
    Names can also be sorted: by first letter, by number of letters.
  explanations:
    text: 'When we give each thing a name, it is easy to see if one is missing. We can count the names in a list and compare two lists: which has more, and how many more.'
    visual: Write the names of 5 friends in one list and 3 in another. Draw lines matching them one-to-one. Two names in the first list have no partner.
    step_by_step: 'Step 1: Count each list. Step 2: Match one-to-one. Step 3: The extra ones show how many more.'
    real_world: Teachers call the names on the attendance list to see who is absent.
  picture:
    kind: bars
    bars:
    - label: Class A
      value: 8
    - label: Class B
      value: 6
    alt: Class A has 8 names and Class B has 6, so Class A has 2 more.
    unit: names
  items:
  - prompt: Riya's name has how many letters? (R-I-Y-A)
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count each letter.
    - R, I, Y, A.
    solution: RIYA has 4 letters.
  - prompt: Team Red has 8 players and Team Blue has 6. How many more in Team Red?
    answer: '2'
    check: 8 - 6
    difficulty: 1
    hints:
    - Match players one-to-one.
    - 8 − 6.
    solution: 8 − 6 = 2.
    mistakes:
      '14': c3_count_once
  - prompt: Which name has the most letters?
    options:
    - Lakshmi
    - Ravi
    - Anu
    - Om
    answer: Lakshmi
    difficulty: 1
    hints:
    - Count each one.
    - L-a-k-s-h-m-i.
    solution: Lakshmi has 7 letters, the most.
  - prompt: A farmer named 15 cows. 3 are in the shed. How many are outside?
    answer: '12'
    check: 15 - 3
    difficulty: 2
    hints:
    - Take away the cows in the shed.
    - 15 − 3.
    solution: 15 − 3 = 12.
    mistakes:
      '18': c3_count_once
  - prompt: In ABC order, which name comes first?
    options:
    - Ajay
    - Meena
    - Sunil
    - Zara
    answer: Ajay
    difficulty: 2
    hints:
    - Look at the first letter.
    - A comes before M.
    solution: A is first in the alphabet, so Ajay comes first.
  - prompt: 'List 1 has 9 names, List 2 has 9 names. The lists are:'
    options:
    - the same length
    - List 1 longer
    - List 2 longer
    - impossible to tell
    answer: the same length
    difficulty: 1
    hints:
    - 9 and 9.
    - Equal.
    solution: Both have 9 names, so they are the same.
