# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 1
title: What's in a Name?
tips:
  m5_count_again: "Count again slowly, one at a time, and touch each one as you count."
  c3_count_once: Touch each thing as you count it, so you count every one exactly once.
  c3_place: 'Read the digits from the left: hundreds, tens, ones.'
  m3_abc: "Look at the first letter of each name. Which comes earliest in A, B, C...?"
  m3_bundle: "Draw it: four lines, then one line across them. Count every line."
  m3_bundles_count: "Each bundle is 5. Two bundles: 5 and 5 more."
  m3_full_bundles: "Make bundles of 5 from 12: 5, then 5 more... can you make a third full one?"
  m3_most_letters: "Count the letters in each name. Spell them slowly."
  m3_same_length: "9 and 9 are the same number."
  m3_why_cross: "Crossing makes groups. Is it easier to count by ones or by fives?"
  c3m1_stick: Point at each thing as you draw one stick for it. One thing, one stick.
  c3m1_five: Circle each bundle of 5 first, count the bundles in fives, then add the loose sticks.
  c3m1_diff: Line the two counts up side by side. How many are left over in the bigger one?
  c3m1_letters: Say the name slowly and put one finger down for each letter.
concepts:
- code: cbse3m.name.tally
  title: Counting with tally marks
  notes: |
    Tally marks help us count things one by one: draw one stick for each thing; the fifth stick crosses the first four,
    making a bundle of 5. Count the bundles in fives, then add the extra sticks. A shepherd can keep count of sheep this
    way, one mark for each sheep as it goes through the gate.
  explanations:
    text: 'Tally marks are a quick way to count. Draw one line for each thing. When you reach five, draw the fifth line across the other four. Then count the bundles in fives: 5, 10, 15, and add the lines left over.'
    visual: 'Draw three bundles of five tally marks and two extra lines. Count: 5, 10, 15, 16, 17.'
    step_by_step: 'Step 1: Draw one line for each thing. Step 2: Cross every group of four with the fifth line. Step 3: Count in fives, then add the single lines.'
    real_world: A shepherd puts a mark on a stick each time a sheep goes into the pen, so no sheep is missed.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 5
    points:
    - at: 5
      label: 1 bundle
    - at: 10
      label: 2 bundles
    - at: 15
      label: 3 bundles
    - at: 17
      label: '+2'
    alt: 'Counting tally bundles on a number line: 5, 10, 15, then 2 more makes 17.'
    jumps:
    - from: 0
      to: 5
      label: '+5'
    - from: 5
      to: 10
      label: '+5'
    - from: 10
      to: 15
      label: '+5'
    - from: 15
      to: 17
      label: '+2'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: A bundle is 4 lines with a 5th line across. Count the tally marks.
    goals:
    - prompt: 1 bundle and 2 lines.
      target: 7
      mistakes:
      - when:
          v: 3
        say: The bundle is 5, not 1. Count by 5, then add the lines.
      - when:
          v: 6
        say: 'Don''t forget the line across the bundle: it makes 5.'
    - prompt: 3 bundles.
      target: 15
      mistakes:
      - when:
          v: 3
        say: Each bundle is 5. Count 5, 10, 15.
      - when:
          v: 12
        say: Each bundle has 5 lines, not 4.
    - prompt: 2 bundles and 4 lines.
      target: 14
      mistakes:
      - when:
          v: 6
        say: Each bundle is 5. 5, 10, then 4 more.
  lesson:
    - teach: When things pass by one at a time, like sheep through a gate, it is hard to keep a number in your head. Instead, draw one small stick for each thing. One sheep, one stick.
      check:
        prompt: 7 sheep went through the gate. How many sticks should you draw?
        options:
        - '7'
        - '1'
        - '5'
        answer: '7'
        why: Each sheep gets its own stick, so 7 sheep need 7 sticks.
      ways:
      - style: visual
        teach: One stick for each thing that passes, as the cows walk through the gate.
        picture:
          kind: flow
          steps:
          - 'Cow 1 passes: draw |'
          - 'Cow 2 passes: draw ||'
          - 'Cow 3 passes: draw |||'
          - Each new cow adds one more stick
          alt: 'As each cow passes the gate, one more stick is drawn: one stick for the first cow, two for the second, three for the third, and so on.'
      - style: real_world
        teach: At a school sports day, a teacher keeps score of laps by making a stick on a card each time a runner passes. Nobody has to remember the number; the sticks remember it.
    - teach: Draw 4 sticks standing up. For the fifth thing, draw a stick across the four. Now you have a bundle that always means 5. Then start a new bundle.
      picture:
        kind: compare
        columns:
        - title: One bundle
          points:
          - 4 standing sticks
          - 1 stick across
          - means 5
        - title: Two bundles
          points:
          - 5 and 5
          - means 10
        alt: One tally bundle means 5; two bundles mean 10.
      check:
        prompt: Which stick is drawn across the others?
        options:
        - the fifth
        - the first
        - the tenth
        answer: the fifth
        why: The fifth stick closes the bundle of 5.
      ways:
      - style: step_by_step
        teach: 'Show 7 with tally marks. Step 1: Draw 4 sticks standing up. Step 2: Draw the fifth stick across them: that is one bundle of 5. Step 3: Draw 2 more sticks next to it. Step 4: Read it: 5, then 6, 7.'
      - style: real_world
        teach: At an election for class monitor, the teacher draws tally marks on the board for each vote. Crossed bundles of 5 make it easy for the whole class to check the count from their seats.
    - teach: 'To read tally marks, count the bundles in fives: 5, 10, 15... Then count on the loose sticks. 2 bundles and 3 sticks: 5, 10, then 11, 12, 13.'
      check:
        prompt: 2 bundles and 3 loose sticks. How many?
        options:
        - '13'
        - '23'
        - '5'
        answer: '13'
        why: 5, 10 for the bundles, then 11, 12, 13 for the loose sticks.
      ways:
      - style: visual
        teach: Reading 4 bundles and 1 loose stick by counting on in fives.
        picture:
          kind: number_line
          from: 0
          to: 25
          step: 5
          jumps:
          - from: 0
            to: 5
            label: bundle
          - from: 5
            to: 10
            label: bundle
          - from: 10
            to: 15
            label: bundle
          - from: 15
            to: 20
            label: bundle
          points:
          - at: 21
            label: +1 stick
          alt: 'Four bundles are four jumps of 5 on the number line: 5, 10, 15, 20. One loose stick takes us to 21.'
      - style: step_by_step
        teach: 'Read tally marks quickly. Step 1: Put a finger on each bundle and say 5, 10, 15... Step 2: Stop when the bundles end. Step 3: Count on one for each loose stick. Step 4: Say the last number: that is the total.'
  items:
  - prompt: One bundle of tally marks stands for how many things?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count the lines in a bundle.
    - Four lines and one across.
    solution: One bundle is 5.
    mistakes: {"4": "m3_bundle", "6": "m3_bundle"}
  - prompt: How many things do 2 bundles of tally marks show?
    answer: '10'
    check: 5 + 5
    difficulty: 1
    hints:
    - Count in fives.
    - 5, 10.
    solution: 2 bundles = 5 + 5 = 10.
    mistakes: {"2": "m3_bundles_count", "7": "m3_bundles_count"}
  - prompt: 3 bundles and 2 single marks. How many things?
    answer: '17'
    check: 3*5 + 2
    difficulty: 2
    hints:
    - 'Count the bundles: 5, 10, 15.'
    - Then 2 more.
    solution: 15 + 2 = 17.
    mistakes:
      '5': c3_count_once
      '32': c3_count_once
  - prompt: A shepherd has 12 sheep. How many full bundles of 5 can he make?
    answer: '2'
    check: 12 // 5
    difficulty: 2
    hints:
    - 5, 10 ... is 15 too many?
    - Count the bundles.
    solution: 12 has two bundles of 5 (10) and 2 left over.
    mistakes: {"3": "m3_full_bundles", "12": "m3_full_bundles"}
  - prompt: 4 bundles of tally marks show how many?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - "Each bundle of tally marks is 5. Count in fives, once for each bundle."
    - Count in fives.
    solution: 4 × 5 = 20.
    mistakes: {"4": "m3_bundles_count", "9": "m3_bundles_count"}
  - prompt: Why do we cross the fifth tally mark?
    options:
    - to make bundles of 5 that are easy to count
    - because 5 is unlucky
    - to rub out a mistake
    - to show zero
    answer: to make bundles of 5 that are easy to count
    difficulty: 1
    hints:
    - Counting in fives is quick.
    - It groups the marks.
    solution: The crossing line makes a bundle of 5.
    mistakes: {"to rub out a mistake": "m3_why_cross"}
  - prompt: 1 bundle and 4 loose sticks show how many?
    answer: '9'
    check: 5+4
    difficulty: 1
    hints:
    - A bundle is worth 5.
    - Count on from 5 for the loose sticks.
    solution: 'Step 1: 1 bundle = 5. Step 2: 5 + 4 = 9.'
    mistakes:
      '5': c3m1_five
      '14': c3m1_five
  - prompt: How many sticks are in 3 full bundles of tally marks?
    answer: '15'
    check: 5*3
    difficulty: 1
    hints:
    - Each bundle has 5 sticks.
    - Count in fives three times.
    solution: 'Step 1: Count in fives: 5, 10, 15. Step 2: 3 bundles have 15 sticks.'
    mistakes:
      '3': c3m1_five
      '12': c3m1_five
  - prompt: A goat herder counts 8 goats with tally marks. How many full bundles are there?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - How many sticks fill one bundle?
    - Is 8 enough for two bundles of 5?
    solution: 'Step 1: One bundle is 5. Step 2: 8 = 5 + 3, so 1 full bundle and 3 loose sticks.'
    mistakes:
      '2': c3m1_five
      '8': c3m1_five
  - prompt: How many loose sticks are left when you draw 13 with tally marks?
    answer: '3'
    check: 13-10
    difficulty: 2
    hints:
    - Count bundles of 5 first.
    - How far past the last bundle is 13?
    solution: 'Step 1: 2 bundles make 10. Step 2: 13 − 10 = 3 loose sticks.'
    mistakes:
      '13': c3m1_five
      '8': c3m1_five
  - prompt: 'Children voted for their favourite fruit: mango got 3 bundles and 1 stick. How many votes?'
    answer: '16'
    check: 5*3+1
    difficulty: 2
    hints:
    - Count the bundles in fives.
    - Then add the single stick.
    solution: 'Step 1: 3 bundles = 15. Step 2: 15 + 1 = 16 votes.'
    mistakes:
      '4': c3m1_five
      '31': c3m1_five
  - prompt: Banana got 12 votes and guava got 7 votes. How many more votes did banana get?
    answer: '5'
    check: 12-7
    difficulty: 2
    hints:
    - Which count is bigger?
    - Take the smaller count away from the bigger.
    solution: 'Step 1: 12 is more than 7. Step 2: 12 − 7 = 5 more votes.'
    mistakes:
      '19': c3m1_diff
      '7': c3m1_diff
  - prompt: A shop counted 4 bundles of pencils sold on Monday. How many pencils?
    answer: '20'
    check: 5*4
    difficulty: 1
    hints:
    - One bundle means 5.
    - Count 5, 10, 15... four times.
    solution: 'Step 1: Count in fives: 5, 10, 15, 20. Step 2: 20 pencils.'
    mistakes:
      '4': c3m1_five
      '16': c3m1_five
  - prompt: Why is counting with tally marks useful at a gate?
    options:
    - you add one stick as each thing passes, without forgetting
    - it makes the sheep walk faster
    - you only need to count once a week
    answer: you add one stick as each thing passes, without forgetting
    difficulty: 1
    hints:
    - Think of things passing one at a time.
    - What does each stick stand for?
    solution: 'Step 1: Each thing gets a stick as it passes. Step 2: So the count is kept on paper, not in your head.'
    mistakes:
      it makes the sheep walk faster: c3m1_stick
      you only need to count once a week: c3m1_stick
  - prompt: You have drawn 2 full bundles. Then 6 more birds land. How many birds in all?
    answer: '16'
    check: 10+6
    difficulty: 3
    hints:
    - What do 2 bundles show?
    - Add the 6 new birds to that.
    solution: 'Step 1: 2 bundles = 10. Step 2: 10 + 6 = 16 birds.'
    mistakes:
      '8': c3m1_five
      '12': c3m1_five
  - prompt: 'Case: Children count the birds landing on a school wall. Asha draws this: two crossed bundles of 5 and then 4 loose sticks. Asha''s friend says there are 6 birds. Who is right, and how many birds are there?'
    options:
    - Asha's marks show 14 birds
    - 'The friend is right: 6 birds'
    - Asha's marks show 24 birds
    answer: Asha's marks show 14 birds
    hints:
    - How much is each crossed bundle worth?
    - Count the bundles in fives, then count on the loose sticks.
    solution: 'Two bundles are 5, 10. Then four loose sticks: 11, 12, 13, 14. There are 14 birds.'
    mistakes:
      'The friend is right: 6 birds': c3m1_five
      Asha's marks show 24 birds: c3m1_five
    exam: case
    difficulty: 2
  - prompt: 'Situation: You stand at the school gate to count how many children come in late, one at a time. What is the best way to keep count?'
    options:
    - Draw one tally stick as each child comes in, crossing every fifth
    - Try to remember the number in your head
    - Count only the children you know
    answer: Draw one tally stick as each child comes in, crossing every fifth
    hints:
    - Children arrive one by one. What makes it easy not to forget?
    - What do we draw for each thing that passes?
    solution: A tally stick for each child keeps the count safe on paper, and bundles of 5 make it quick to read at the end.
    mistakes:
      Try to remember the number in your head: c3m1_stick
      Count only the children you know: c3m1_stick
    exam: competency
    difficulty: 2
- code: cbse3m.name.compare
  title: Names, lists and comparing counts
  after:
  - cbse3m.name.tally
  notes: |
    Giving each thing a name or a number helps us keep track: names of children in class, names of cows in a herd.
    Lists can be counted and compared: which list is longer, by how many. Words: more than, fewer than, the same as.
    Names can also be sorted: by first letter, by number of letters.
  explanations:
    text: 'When we give each thing a name, it is easy to see if one is missing. We can count the names in a list and compare two lists: which has more, and how many more.'
    visual: Write the names of 5 friends in one list and 3 in another. Draw lines matching them one-to-one. Two names in the first list have no partner.
    step_by_step: 'Step 1: Count each list. Step 2: Match one-to-one. Step 3: The extra ones show how many more.'
    real_world: Teachers call the names on the attendance list to see who is absent.
  picture:
    kind: bars
    bars:
    - label: Class A
      value: 8
    - label: Class B
      value: 6
    alt: Class A has 8 names and Class B has 6, so Class A has 2 more.
    unit: names
  activity:
    type: number_line
    min: 0
    max: 25
    step: 1
    start: 0
    prompt: Compare the two lists. Mark how many more.
    goals:
    - prompt: Class A has 12 names. Class B has 9. How many more in Class A?
      target: 3
      mistakes:
      - when:
          v: 21
        say: 'That adds them. ''How many more'' means take away: 12 − 9.'
      - when:
          v: 12
        say: That's just Class A.
    - prompt: Riya picked 15 flowers. Sam picked 8. How many more did Riya pick?
      target: 7
      mistakes:
      - when:
          v: 8
        say: That's Sam's flowers. Count up from 8 to 15.
    - prompt: A list has 6 names. The other has 6 too. How many more?
      target: 0
      mistakes:
      - when:
          v: 12
        say: That adds them. When both lists are the same, the difference is nothing.
  lesson:
    - teach: 'Every child in a class has a name, and we can count the letters in a name. Say it slowly: M-A-N-U has 4 letters.'
      check:
        prompt: How many letters are in the name ANU?
        options:
        - '3'
        - '4'
        - '2'
        answer: '3'
        why: 'A-N-U: one, two, three letters.'
      ways:
      - style: visual
        teach: Counting the letters in two names, one box for each letter.
        picture:
          kind: compare
          columns:
          - title: D-E-E-P-A
            points:
            - D
            - E
            - E
            - P
            - A
            - 5 letters
          - title: J-O-H-N
            points:
            - J
            - O
            - H
            - N
            - 4 letters
          alt: 'DEEPA is written as D, E, E, P, A: 5 letters. JOHN is written as J, O, H, N: 4 letters.'
      - style: real_world
        teach: When names are painted on the back of sports shirts, the painter counts the letters first. A long name needs smaller letters so that it fits across the shirt.
    - teach: 'We can put names in ABC order. Look at the first letter of each name and follow the alphabet: A comes before B, B before C. Ajay comes before Bina.'
      check:
        prompt: Which name comes first in ABC order?
        options:
        - Deepa
        - Kiran
        - Tara
        answer: Deepa
        why: D comes before K and T in the alphabet.
      ways:
      - style: step_by_step
        teach: 'Put these names in ABC order: Neha, Dev, Tara. Step 1: Look at the first letters: N, D, T. Step 2: Find them in the alphabet: D comes first, then N, then T. Step 3: Write Dev, Neha, Tara.'
      - style: visual
        teach: Putting three names in ABC order by looking at their first letters.
        picture:
          kind: flow
          steps:
          - Dev (D)
          - Neha (N)
          - Tara (T)
          alt: Dev starts with D, Neha with N and Tara with T. D comes first in the alphabet, then N, then T, so the order is Dev, Neha, Tara.
    - teach: 'To compare two lists, count each one. The bigger number has more. To find how many more, take the smaller count from the bigger: 9 − 6 = 3 more.'
      picture:
        kind: bars
        unit: names
        bars:
        - label: List A
          value: 9
        - label: List B
          value: 6
        alt: List A has 9 names, List B has 6 names.
      check:
        prompt: List A has 9 names and List B has 6. How many more in List A?
        options:
        - '3'
        - '15'
        - '6'
        answer: '3'
        why: 9 − 6 = 3.
      ways:
      - style: visual
        teach: 'Two lists side by side: the longer list has more names.'
        picture:
          kind: bars
          bars:
          - label: Dance club
            value: 11
          - label: Art club
            value: 8
          alt: The dance club list has 11 names and the art club list has 8. The dance club bar is longer, by 3.
      - style: real_world
        teach: Before a bus trip, the teacher compares the list of children who paid with the list of children on the bus. If the counts are different, someone is missing or someone extra has got on.
  items:
  - prompt: Riya's name has how many letters? (R-I-Y-A)
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count each letter.
    - R, I, Y, A.
    solution: RIYA has 4 letters.
    mistakes: {"3": "m5_count_again", "5": "m5_count_again"}
  - prompt: Team Red has 8 players and Team Blue has 6. How many more in Team Red?
    answer: '2'
    check: 8 - 6
    difficulty: 1
    hints:
    - Match players one-to-one.
    - 8 − 6.
    solution: 8 − 6 = 2.
    mistakes:
      '14': c3_count_once
  - prompt: Which name has the most letters?
    options:
    - Lakshmi
    - Ravi
    - Anu
    - Om
    answer: Lakshmi
    difficulty: 1
    hints:
    - Count each one.
    - L-a-k-s-h-m-i.
    solution: Lakshmi has 7 letters, the most.
    mistakes: {"Ravi": "m3_most_letters"}
  - prompt: A farmer named 15 cows. 3 are in the shed. How many are outside?
    answer: '12'
    check: 15 - 3
    difficulty: 2
    hints:
    - Take away the cows in the shed.
    - 15 − 3.
    solution: 15 − 3 = 12.
    mistakes:
      '18': c3_count_once
  - prompt: In ABC order, which name comes first?
    options:
    - Ajay
    - Meena
    - Sunil
    - Zara
    answer: Ajay
    difficulty: 2
    hints:
    - Look at the first letter.
    - A comes before M.
    solution: A is first in the alphabet, so Ajay comes first.
    mistakes: {"Meena": "m3_abc"}
  - prompt: 'List 1 has 9 names, List 2 has 9 names. The lists are:'
    options:
    - the same length
    - List 1 longer
    - List 2 longer
    - impossible to tell
    answer: the same length
    difficulty: 1
    hints:
    - 9 and 9.
    - Equal.
    solution: Both have 9 names, so they are the same.
    mistakes: {"List 1 longer": "m3_same_length"}
  - prompt: How many letters are in the name SUNITA?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'Say each letter: S, U, N...'
    - Put one finger down for each letter.
    solution: 'Step 1: S-U-N-I-T-A. Step 2: That is 6 letters.'
    mistakes:
      '5': c3m1_letters
      '7': c3m1_letters
  - prompt: Which name has the fewest letters?
    options:
    - Om
    - Ravi
    - Pooja
    answer: Om
    difficulty: 1
    hints:
    - Count the letters in each name.
    - Which count is smallest?
    solution: 'Step 1: Om = 2, Ravi = 4, Pooja = 5. Step 2: Om has the fewest.'
    mistakes:
      Ravi: c3m1_letters
      Pooja: c3m1_letters
  - prompt: In ABC order, which name comes last?
    options:
    - Yusuf
    - Mani
    - Gita
    answer: Yusuf
    difficulty: 2
    hints:
    - 'Look at the first letters: Y, M, G.'
    - Which letter is nearest the end of the alphabet?
    solution: 'Step 1: The first letters are G, M, Y. Step 2: Y comes last, so Yusuf is last.'
    mistakes:
      Mani: c3m1_letters
      Gita: c3m1_letters
  - prompt: Class 3A has 32 children and Class 3B has 28. How many more children are in 3A?
    answer: '4'
    check: 32-28
    difficulty: 2
    hints:
    - Which class has more?
    - Take the smaller number from the bigger.
    solution: 'Step 1: 32 is more than 28. Step 2: 32 − 28 = 4 more.'
    mistakes:
      '60': c3m1_diff
      '6': c3m1_diff
  - prompt: A list of cows' names has 11 names. 4 cows were sold. How many names are still on the list of cows at home?
    answer: '7'
    check: 11-4
    difficulty: 2
    hints:
    - Some names leave the list.
    - 11 take away 4.
    solution: 'Step 1: Start with 11. Step 2: 11 − 4 = 7 names.'
    mistakes:
      '15': c3m1_diff
      '6': c3m1_diff
  - prompt: Ravi has 4 letters and Gopal has 5. Together, how many letters?
    answer: '9'
    check: 4+5
    difficulty: 1
    hints:
    - Put the two counts together.
    - 4 and 5 more.
    solution: 'Step 1: Ravi 4, Gopal 5. Step 2: 4 + 5 = 9 letters.'
    mistakes:
      '1': c3m1_diff
      '8': c3m1_letters
  - prompt: Two lists both have 12 names. Which is true?
    options:
    - both lists have the same number
    - the first list is longer
    - the second list is longer
    answer: both lists have the same number
    difficulty: 1
    hints:
    - Compare 12 and 12.
    - Is either count bigger?
    solution: 'Step 1: 12 and 12 are equal. Step 2: So the lists have the same number of names.'
    mistakes:
      the first list is longer: c3m1_diff
      the second list is longer: c3m1_diff
  - prompt: Which two names start with the same letter?
    options:
    - Kavya and Kabir
    - Kavya and Arun
    - Arun and Neha
    answer: Kavya and Kabir
    difficulty: 1
    hints:
    - Look only at the first letter of each name.
    - Find a matching pair.
    solution: 'Step 1: Kavya and Kabir both start with K. Step 2: The others start with different letters.'
    mistakes:
      Kavya and Arun: c3m1_letters
      Arun and Neha: c3m1_letters
  - prompt: A team has 15 players. 6 have names starting with S. How many do not start with S?
    answer: '9'
    check: 15-6
    difficulty: 3
