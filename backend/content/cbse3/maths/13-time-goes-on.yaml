# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 13. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 13
title: Time Goes On
tips:
  m3_after_friday: "Thursday comes before Friday. Say the days in order and find the next one."
  m3_after_march: "February comes before March. Say the months in order."
  m3_count_hours: "Count on from the start time, one hour at a time, until you reach the end time."
  m3_days_wait: "Count on from 10 to 25, or take 10 away from 25."
  m3_minutes_hour: "The long hand goes all the way round once in an hour. Count the small marks on the clock face."
  m3_short_hand: "The long hand moves fast and shows minutes. The short hand moves slowly."
  c3m13_order: Say the days (or months) in order from the start, pointing at each one.
  c3m13_count: Count on from the first date to the second, one day at a time, or subtract.
  c3m13_hands: 'Look at the long hand first: on 12 means o''clock, on 6 means half past. Then read the short hand.'
  c3m13_hours: Count the hours on your fingers from the start time to the end time.

concepts:
- code: cbse3m.time.calendar
  title: Days, weeks, months and years
  notes: |
    7 days make a week (Sunday to Saturday); about 30 days make a month; 12 months make a year (January to December).
    Some months have 30 days, some 31, February 28 or 29. Reading a calendar: what day is the 15th, how many days to a
    festival.
  explanations:
    text: A week has 7 days. A year has 12 months, from January to December. Most months have 30 or 31 days. A calendar shows the dates so we can plan birthdays, holidays and festivals.
    visual: Draw one page of a calendar with 7 columns (Sun to Sat) and circle your birthday.
    step_by_step: 'Step 1: Find the month. Step 2: Find the date. Step 3: Look at the top of the column for the day.'
    real_world: Calendars help us know when Onam, Diwali, Eid or Christmas will come.
  picture:
    kind: compare
    columns:
    - title: Unit
      points:
      - Week
      - Month
      - Year
    - title: Has
      points:
      - 7 days
      - 28 to 31 days
      - 12 months
    alt: A week has 7 days, a month 28 to 31 days, and a year 12 months.
  activity:
    type: number_line
    min: 1
    max: 31
    step: 1
    start: 1
    prompt: Use the calendar. Mark the date.
    goals:
    - prompt: Today is the 3rd. What date is one week later?
      target: 10
      mistakes:
      - when:
          v: 4
        say: That's tomorrow. A week is 7 days.
      - when:
          v: 9
        say: 'Count 7 days from the 3rd: 4, 5, 6, 7, 8, 9, 10.'
    - prompt: The last day of January.
      target: 31
      mistakes:
      - when:
          v: 30
        say: January has 31 days.
    - prompt: Today is the 15th. What date was it a week ago?
      target: 8
      mistakes:
      - when:
          v: 22
        say: That's a week later. Go back 7 days.
      - when:
          v: 14
        say: That's yesterday.
  lesson:
    - teach: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. Then it starts again with Sunday.'
      check:
        prompt: Which day comes after Saturday?
        options:
        - Sunday
        - Friday
        - Monday
        answer: Sunday
        why: 'The week goes round: after Saturday comes Sunday.'
      ways:
      - style: visual
        teach: The seven days of the week go round and round in the same order.
        picture:
          kind: flow
          steps:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          - back to Sunday
          alt: The days go Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, and then back to Sunday.
      - style: step_by_step
        teach: 'Find the day 4 days after Wednesday. Step 1: Put your finger on Wednesday. Step 2: Count on 4: Thursday 1, Friday 2, Saturday 3, Sunday 4. Step 3: The answer is Sunday.'
    - teach: 'A year has 12 months: January, February, March, April, May, June, July, August, September, October, November, December. Most months have 30 or 31 days; February has 28 (29 in a leap year).'
      picture:
        kind: flow
        steps:
        - Jan-Mar
        - Apr-Jun
        - Jul-Sep
        - Oct-Dec
        alt: The 12 months of the year in four groups of three.
      check:
        prompt: Which month comes before June?
        options:
        - May
        - July
        - April
        answer: May
        why: May, then June.
      ways:
      - style: step_by_step
        teach: 'Use your knuckles to remember the months. Step 1: Make a fist. Step 2: Touch the knuckles and the dips between them, starting with January on the first knuckle. Step 3: Months on a knuckle have 31 days; months in a dip have 30 (or fewer for February).'
      - style: real_world
        teach: School terms, exams and holidays are planned month by month. The summer holiday in many states falls in April and May, and the new school year starts in June.
    - teach: 'On a calendar you can count days. From the 5th to the 12th: 12 − 5 = 7 days, which is one week.'
      check:
        prompt: From the 3rd to the 10th of a month, how many days?
        options:
        - '7'
        - '13'
        - '3'
        answer: '7'
        why: 10 − 3 = 7.
      ways:
      - style: visual
        teach: Counting the days from the 6th to the 19th on a calendar.
        picture:
          kind: number_line
          from: 5
          to: 20
          step: 1
          jumps:
          - from: 6
            to: 19
            label: 13 days
          alt: On a number line of dates, from the 6th to the 19th is 19 − 6 = 13 days.
      - style: real_world
        teach: Families mark a wedding or a festival on the wall calendar and cross out each day as it passes. The days left are easy to count.
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: A week has 7 days.
    mistakes: {"5": "m4_week_days", "30": "m4_week_days"}
  - prompt: How many months are in a year?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - January to December.
    - Count them.
    solution: A year has 12 months.
    mistakes: {"10": "m4_months", "52": "m4_months"}
  - prompt: Which day comes after Friday?
    options:
    - Saturday
    - Sunday
    - Thursday
    - Monday
    answer: Saturday
    difficulty: 1
    hints:
    - The weekend starts.
    - Fri, ...
    solution: Saturday comes after Friday.
    mistakes: {"Thursday": "m3_after_friday"}
  - prompt: How many days are in 2 weeks?
    answer: '14'
    check: 2*7
    difficulty: 2
    hints:
    - 7 + 7.
    - 2 × 7.
    solution: 14 days.
    mistakes:
      '9': c3_count_once
  - prompt: Which month comes right after March?
    options:
    - April
    - May
    - February
    - June
    answer: April
    difficulty: 1
    hints:
    - Jan, Feb, Mar, ...
    - Say them in order.
    solution: April comes after March.
    mistakes: {"February": "m3_after_march"}
  - prompt: Today is the 10th. A festival is on the 25th. How many days to wait?
    answer: '15'
    check: 25 - 10
    difficulty: 2
    hints:
    - 25 − 10.
    - Count up.
    solution: 15 days.
    mistakes: {"35": "m3_days_wait", "14": "m3_days_wait"}
  - prompt: How many days are in 3 weeks?
    answer: '21'
    check: 7*3
    difficulty: 1
    hints:
    - One week = 7 days.
    - 7 + 7 + 7.
    solution: 'Step 1: 7 × 3. Step 2: = 21 days.'
    mistakes:
      '10': c3m13_count
      '14': c3m13_count
  - prompt: Which day comes before Wednesday?
    options:
    - Tuesday
    - Thursday
    - Monday
    answer: Tuesday
    difficulty: 1
    hints:
    - Say the days in order.
    - Sunday, Monday, ...
    solution: 'Step 1: Monday, Tuesday, Wednesday. Step 2: Tuesday is just before.'
    mistakes:
      Thursday: c3m13_order
      Monday: c3m13_order
  - prompt: Which month comes after October?
    options:
    - November
    - September
    - December
    answer: November
    difficulty: 1
    hints:
    - Say the months in order.
    - September, October, ...
    solution: 'Step 1: October, then November. Step 2: November.'
    mistakes:
      September: c3m13_order
      December: c3m13_order
  - prompt: Today is the 8th. A birthday is on the 20th. How many days to wait?
    answer: '12'
    check: 20-8
    difficulty: 2
    hints:
    - Subtract the dates.
    - 20 − 8.
    solution: 'Step 1: 20 − 8. Step 2: = 12 days.'
    mistakes:
      '28': c3m13_count
      '13': c3m13_count
  - prompt: Which month is the shortest?
    options:
    - February
    - January
    - December
    answer: February
    difficulty: 1
    hints:
    - Most months have 30 or 31 days.
    - One has only 28 or 29.
    solution: 'Step 1: January and December have 31. Step 2: February has 28 or 29.'
    mistakes:
      January: c3m13_order
      December: c3m13_order
  - prompt: If today is Monday, what day will it be in 3 days?
    options:
    - Thursday
    - Wednesday
    - Friday
    answer: Thursday
    difficulty: 2
    hints:
    - Count on 3 days.
    - Tuesday is 1.
    solution: 'Step 1: Tuesday (1), Wednesday (2), Thursday (3). Step 2: Thursday.'
    mistakes:
      Wednesday: c3m13_order
      Friday: c3m13_order
  - prompt: How many months are in half a year?
    answer: '6'
    check: 12/2
    difficulty: 2
    hints:
    - A year has 12 months.
    - Half of 12.
    solution: 'Step 1: 12 ÷ 2. Step 2: = 6 months.'
    mistakes:
      '12': c3m13_count
      '24': c3m13_count
  - prompt: January has 31 days. How many days are in January and February together in a year when February has 28 days?
    answer: '59'
    check: 31+28
    difficulty: 3
    hints:
    - Add the two months.
    - 31 + 28.
    solution: 'Step 1: 31 + 28. Step 2: = 59 days.'
    mistakes:
      '58': c3m13_count
      '60': c3m13_count
  - prompt: A school holiday starts on the 1st and lasts 2 weeks. How many days is that?
    answer: '14'
    check: 7*2
    difficulty: 2
    hints:
    - 1 week = 7 days.
    - 2 weeks?
    solution: 'Step 1: 7 + 7. Step 2: = 14 days.'
    mistakes:
      '7': c3m13_count
      '2': c3m13_count
  - prompt: 'Case: A child borrows a library book on Monday the 4th. The book must be returned in exactly 2 weeks. The child plans to return it on the 14th. Is that right?'
    options:
    - No, 2 weeks is 14 days, so it is due on Monday the 18th
    - Yes, the 14th, because 2 weeks means 14
    - No, it is due on the 6th
    answer: No, 2 weeks is 14 days, so it is due on Monday the 18th
    hints:
    - How many days are in 2 weeks?
    - Count on that many days from the 4th.
    solution: 2 weeks is 7 + 7 = 14 days. 4 + 14 = 18, and 14 days after a Monday is again a Monday. The book is due on Monday the 18th.
    mistakes:
      Yes, the 14th, because 2 weeks means 14: c3m13_count
      No, it is due on the 6th: c3m13_count
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class is planning a picnic for the month just after the summer holiday month of May. Which month will the picnic be in?'
    options:
    - June
    - April
    - July
    answer: June
    hints:
    - Say the months in order.
    - Which month comes straight after May?
    solution: The months go ... April, May, June, July ... The month straight after May is June.
    mistakes:
      April: c3m13_order
      July: c3m13_order
    exam: competency
    difficulty: 2
- code: cbse3m.time.clock
  title: Reading the clock
  after:
  - cbse3m.time.calendar
  notes: |
    A clock has a short hour hand and a long minute hand. When the minute hand points at 12, it is "o'clock" (hour hand
    shows the hour). At 6 it is half past. 60 minutes = 1 hour; half an hour = 30 minutes. Morning activities and
    evening activities.
  explanations:
    text: The short hand shows the hour and the long hand shows the minutes. When the long hand is on 12, it is something o'clock. When it is on 6, it is half past. One hour has 60 minutes.
    visual: 'Draw a clock face showing 3 o''clock: the long hand on 12 and the short hand on 3.'
    step_by_step: 'Step 1: Look at the short hand for the hour. Step 2: Look at the long hand: 12 means o''clock, 6 means half past. Step 3: Say the time.'
    real_world: School may start at 9 o'clock, and lunch break could be at half past 12.
  picture:
    kind: flow
    steps:
    - Long hand on 12
    - Short hand on 3
    - It is 3 o'clock
    alt: With the long hand on 12 and the short hand on 3, it is 3 o'clock.
  activity:
    type: sort
    prompt: What time is it?
    bins:
    - Something o'clock
    - Half past
    items:
    - label: Long hand on 12, short hand on 3
      bin: Something o'clock
      clue: Where is the long hand?
      why: 3 o'clock.
    - label: Long hand on 12, short hand on 8
      bin: Something o'clock
      clue: The long hand is at the top.
      why: 8 o'clock.
    - label: Long hand on 12, short hand on 1
      bin: Something o'clock
      clue: The long hand points straight up.
      why: 1 o'clock.
    - label: Long hand on 6, short hand between 4 and 5
      bin: Half past
      clue: The long hand points down.
      why: Half past 4.
    - label: Long hand on 6, short hand between 9 and 10
      bin: Half past
      clue: The long hand is at the bottom.
      why: Half past 9.
    - label: Long hand on 6, short hand between 12 and 1
      bin: Half past
      clue: Long hand straight down.
      why: Half past 12.
  lesson:
    - teach: A clock has two hands. The short hand shows the hour. The long hand shows the minutes. When the long hand points at 12, the time is exactly 'o'clock'.
      check:
        prompt: Long hand on 12, short hand on 8. What time?
        options:
        - 8 o'clock
        - 12 o'clock
        - half past 8
        answer: 8 o'clock
        why: Long hand on 12 means o'clock; the short hand says the hour is 8.
      ways:
      - style: visual
        teach: The two hands on a clock and what each one shows.
        picture:
          kind: compare
          columns:
          - title: Short hand
            points:
            - Shows the hour
            - Moves slowly
          - title: Long hand
            points:
            - Shows the minutes
            - Goes round once every hour
          alt: The short hand shows the hour and moves slowly. The long hand shows the minutes and goes all the way round once every hour.
      - style: real_world
        teach: At 1 o'clock a school bell may ring for lunch. If you look at the clock then, the long hand points straight up at 12 and the short hand points at 1.
    - teach: 'The long hand goes all the way round in 60 minutes, which is 1 hour. Halfway round, at 6, is 30 minutes: we say ''half past''. The short hand is then halfway between two numbers.'
      picture:
        kind: compare
        columns:
        - title: Long hand on 12
          points:
          - o'clock
          - 0 minutes past
        - title: Long hand on 6
          points:
          - half past
          - 30 minutes past
        alt: Long hand on 12 means o'clock; on 6 means half past.
      check:
        prompt: Long hand on 6, short hand between 2 and 3. What time?
        options:
        - half past 2
        - half past 3
        - 6 o'clock
        answer: half past 2
        why: Half past means 30 minutes after; the short hand has passed 2 but not reached 3.
      ways:
      - style: step_by_step
        teach: 'Read half past 9. Step 1: Look at the long hand: it points at 6, so it is half past. Step 2: Look at the short hand: it is between 9 and 10. Step 3: It has passed 9, so the time is half past 9.'
      - style: visual
        teach: How far the long hand travels in half an hour and in one hour.
        picture:
          kind: compare
          columns:
          - title: Half an hour
            points:
            - Long hand goes from 12 to 6
            - 30 minutes
          - title: One hour
            points:
            - Long hand goes all the way round
            - 60 minutes
          alt: 'In half an hour, the long hand goes from 12 to 6: 30 minutes. In one hour, it goes all the way round: 60 minutes.'
    - teach: 'To find how long something takes, count the hours from start to end. School from 9 o''clock to 1 o''clock: 10, 11, 12, 1 is 4 hours.'
      check:
        prompt: From 4 o'clock to 6 o'clock is how many hours?
        options:
        - '2'
        - '10'
        - '6'
        answer: '2'
        why: '5, 6: two hours.'
      ways:
      - style: visual
        teach: Counting hours from 7 o'clock to 12 o'clock.
        picture:
          kind: number_line
          from: 7
          to: 12
          step: 1
          jumps:
          - from: 7
            to: 8
            label: '1'
          - from: 8
            to: 9
            label: '2'
          - from: 9
            to: 10
            label: '3'
          - from: 10
            to: 11
            label: '4'
          - from: 11
            to: 12
            label: '5'
          alt: 'From 7 o''clock to 12 o''clock is five jumps of one hour: 8, 9, 10, 11, 12. That is 5 hours.'
      - style: real_world
        teach: A shop that opens at 7 o'clock in the morning and closes for lunch at 12 o'clock is open for 5 hours before lunch.
  items:
  - prompt: 'The short hand on a clock shows the:'
    options:
    - hour
    - minute
    - day
    - month
    answer: hour
    difficulty: 1
    hints:
    - It moves slowly.
    - Short = hour.
    solution: The short hand shows the hour.
    mistakes: {"minute": "m3_short_hand"}
  - prompt: Long hand on 12, short hand on 3. What time is it?
    options:
    - 3 o'clock
    - 12 o'clock
    - half past 3
    - half past 12
    answer: 3 o'clock
    difficulty: 1
    hints:
    - Long on 12 means o'clock.
    - Read the short hand.
    solution: It is 3 o'clock.
    mistakes:
      12 o'clock: c3_place
  - prompt: How many minutes are in one hour?
    answer: '60'
    check: '60'
    difficulty: 1
    hints:
    - The long hand goes all the way round.
    - Sixty.
    solution: 1 hour = 60 minutes.
    mistakes: {"100": "m3_minutes_hour", "30": "m3_minutes_hour"}
  - prompt: How many minutes are in half an hour?
    answer: '30'
    check: 60/2
    difficulty: 2
    hints:
    - Half of 60.
    - 60 ÷ 2.
    solution: 30 minutes.
    mistakes: {"50": "m4_half_hour", "60": "m4_half_hour"}
  - prompt: Long hand on 6, short hand just after 4. What time is it?
    options:
    - half past 4
    - 6 o'clock
    - 4 o'clock
    - half past 6
    answer: half past 4
    difficulty: 2
    hints:
    - Long hand on 6 means half past.
    - The hour is 4.
    solution: It is half past 4.
    mistakes: {"half past 6": "m4_short_hand"}
  - prompt: A film starts at 2 o'clock and ends at 5 o'clock. How many hours long?
    answer: '3'
    check: 5 - 2
    difficulty: 2
    hints:
    - Count from 2 to 5.
    - 5 − 2.
    solution: 3 hours.
    mistakes: {"7": "m3_count_hours", "2": "m3_count_hours"}
  - prompt: Long hand on 12, short hand on 11. What time is it?
    options:
    - 11 o'clock
    - 12 o'clock
    - half past 11
    answer: 11 o'clock
    difficulty: 1
    hints:
    - Long hand on 12 means o'clock.
    - Read the short hand.
    solution: 'Step 1: o''clock. Step 2: Short hand on 11: 11 o''clock.'
    mistakes:
      12 o'clock: c3m13_hands
      half past 11: c3m13_hands
  - prompt: How many minutes are in 2 hours?
    answer: '120'
    check: 60*2
    difficulty: 2
    hints:
    - 1 hour = 60 minutes.
    - 60 + 60.
    solution: 'Step 1: 60 + 60. Step 2: = 120 minutes.'
    mistakes:
      '62': c3m13_hours
      '100': c3m13_hours
  - prompt: Long hand on 6, short hand between 7 and 8. What time is it?
    options:
    - half past 7
    - half past 8
    - 6 o'clock
    answer: half past 7
    difficulty: 2
    hints:
    - Long hand on 6 means half past.
    - The short hand has passed which number?
    solution: 'Step 1: Half past. Step 2: It has passed 7, so half past 7.'
    mistakes:
      half past 8: c3m13_hands
      6 o'clock: c3m13_hands
  - prompt: A match starts at 3 o'clock and ends at 7 o'clock. How many hours?
    answer: '4'
    check: 7-3
    difficulty: 1
    hints:
    - Count from 3 to 7.
    - 4, 5, 6, 7.
    solution: 'Step 1: 7 − 3. Step 2: = 4 hours.'
    mistakes:
      '10': c3m13_hours
      '3': c3m13_hours
  - prompt: What time is 1 hour after 6 o'clock?
    options:
    - 7 o'clock
    - 5 o'clock
    - half past 6
    answer: 7 o'clock
    difficulty: 1
    hints:
    - Add 1 hour.
    - The short hand moves to the next number.
    solution: 'Step 1: 6 + 1 = 7. Step 2: 7 o''clock.'
    mistakes:
      5 o'clock: c3m13_hours
      half past 6: c3m13_hours
  - prompt: Which is usually done in the morning?
    options:
    - brushing teeth after waking up
    - eating dinner
    - going to bed
    answer: brushing teeth after waking up
    difficulty: 1
    hints:
    - Think of the start of your day.
    - What do you do right after waking?
    solution: 'Step 1: Dinner and bed are at night. Step 2: Brushing after waking is in the morning.'
    mistakes:
      eating dinner: c3m13_order
      going to bed: c3m13_order
  - prompt: A cake bakes for half an hour. How many minutes is that?
    answer: '30'
    check: 60/2
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - Half of 60.
    solution: 'Step 1: 60 ÷ 2. Step 2: = 30 minutes.'
    mistakes:
      '60': c3m13_hours
      '15': c3m13_hours
  - prompt: Long hand on 12, short hand on 12, at night. What is it called?
    options:
    - midnight
    - noon
    - half past 12
    answer: midnight
    difficulty: 2
    hints:
    - 12 o'clock happens twice a day.
    - At night it has a special name.
    solution: 'Step 1: 12 o''clock at night. Step 2: It is called midnight.'
    mistakes:
      noon: c3m13_hands
      half past 12: c3m13_hands
  - prompt: A train leaves at half past 2 and the trip takes 2 hours. When does it arrive?
    options:
    - half past 4
    - 4 o'clock
    - half past 3
    answer: half past 4
    difficulty: 3
    hints:
    - Add 2 hours to the hour.
    - The 'half past' stays the same.
    solution: 'Step 1: 2 + 2 = 4. Step 2: Still half past: half past 4.'
    mistakes:
      4 o'clock: c3m13_hours
      half past 3: c3m13_hours
  - prompt: 'Case: The school bus comes at half past 7 in the morning. A child needs 1 hour to wake up, wash, dress and eat. A parent sets the alarm for 7 o''clock. What will happen?'
    options:
    - The child will be late; the alarm should be at half past 6
    - The child will be on time
    - The alarm should be at half past 8
    answer: The child will be late; the alarm should be at half past 6
    hints:
    - How much time is there from 7 o'clock to half past 7?
    - Count back 1 hour from half past 7.
    solution: From 7 o'clock to half past 7 is only half an hour, but the child needs 1 hour. One hour before half past 7 is half past 6.
    mistakes:
      The child will be on time: c3m13_hours
      The alarm should be at half past 8: c3m13_hours
    exam: case
    difficulty: 2
  - prompt: 'Situation: You look at the clock. The long hand points at 12 and the short hand points at 9. Your friend says it is 12 o''clock. What time is it?'
    options:
    - 9 o'clock
    - 12 o'clock
    - half past 9
    answer: 9 o'clock
    hints:
    - Which hand shows the hour?
    - Where is the long hand pointing, and what does that mean?
    solution: 'The short hand shows the hour: 9. The long hand at 12 means exactly o''clock. So it is 9 o''clock.'
    mistakes:
      12 o'clock: c3m13_hands
      half past 9: c3m13_hands
    exam: competency
    difficulty: 2
