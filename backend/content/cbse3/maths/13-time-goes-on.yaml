# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 13. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 13
title: Time Goes On
tips:
  m3_after_friday: "Thursday comes before Friday. Say the days in order and find the next one."
  m3_after_march: "February comes before March. Say the months in order."
  m3_count_hours: "Count on from the start time, one hour at a time, until you reach the end time."
  m3_days_wait: "Count on from 10 to 25, or take 10 away from 25."
  m3_minutes_hour: "The long hand goes all the way round once in an hour. Count the small marks on the clock face."
  m3_short_hand: "The long hand moves fast and shows minutes. The short hand moves slowly."

concepts:
- code: cbse3m.time.calendar
  title: Days, weeks, months and years
  notes: |
    7 days make a week (Sunday to Saturday); about 30 days make a month; 12 months make a year (January to December).
    Some months have 30 days, some 31, February 28 or 29. Reading a calendar: what day is the 15th, how many days to a
    festival.
  explanations:
    text: A week has 7 days. A year has 12 months, from January to December. Most months have 30 or 31 days. A calendar shows the dates so we can plan birthdays, holidays and festivals.
    visual: Draw one page of a calendar with 7 columns (Sun to Sat) and circle your birthday.
    step_by_step: 'Step 1: Find the month. Step 2: Find the date. Step 3: Look at the top of the column for the day.'
    real_world: Calendars help us know when Onam, Diwali, Eid or Christmas will come.
  picture:
    kind: compare
    columns:
    - title: Unit
      points:
      - Week
      - Month
      - Year
    - title: Has
      points:
      - 7 days
      - 28 to 31 days
      - 12 months
    alt: A week has 7 days, a month 28 to 31 days, and a year 12 months.
  activity:
    type: number_line
    min: 1
    max: 31
    step: 1
    start: 1
    prompt: Use the calendar. Mark the date.
    goals:
    - prompt: Today is the 3rd. What date is one week later?
      target: 10
      mistakes:
      - when:
          v: 4
        say: That's tomorrow. A week is 7 days.
      - when:
          v: 9
        say: 'Count 7 days from the 3rd: 4, 5, 6, 7, 8, 9, 10.'
    - prompt: The last day of January.
      target: 31
      mistakes:
      - when:
          v: 30
        say: January has 31 days.
    - prompt: Today is the 15th. What date was it a week ago?
      target: 8
      mistakes:
      - when:
          v: 22
        say: That's a week later. Go back 7 days.
      - when:
          v: 14
        say: That's yesterday.
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: A week has 7 days.
    mistakes: {"5": "m4_week_days", "30": "m4_week_days"}
  - prompt: How many months are in a year?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - January to December.
    - Count them.
    solution: A year has 12 months.
    mistakes: {"10": "m4_months", "52": "m4_months"}
  - prompt: Which day comes after Friday?
    options:
    - Saturday
    - Sunday
    - Thursday
    - Monday
    answer: Saturday
    difficulty: 1
    hints:
    - The weekend starts.
    - Fri, ...
    solution: Saturday comes after Friday.
    mistakes: {"Thursday": "m3_after_friday"}
  - prompt: How many days are in 2 weeks?
    answer: '14'
    check: 2*7
    difficulty: 2
    hints:
    - 7 + 7.
    - 2 × 7.
    solution: 14 days.
    mistakes:
      '9': c3_count_once
  - prompt: Which month comes right after March?
    options:
    - April
    - May
    - February
    - June
    answer: April
    difficulty: 1
    hints:
    - Jan, Feb, Mar, ...
    - Say them in order.
    solution: April comes after March.
    mistakes: {"February": "m3_after_march"}
  - prompt: Today is the 10th. A festival is on the 25th. How many days to wait?
    answer: '15'
    check: 25 - 10
    difficulty: 2
    hints:
    - 25 − 10.
    - Count up.
    solution: 15 days.
    mistakes: {"35": "m3_days_wait", "14": "m3_days_wait"}
- code: cbse3m.time.clock
  title: Reading the clock
  after:
  - cbse3m.time.calendar
  notes: |
    A clock has a short hour hand and a long minute hand. When the minute hand points at 12, it is "o'clock" (hour hand
    shows the hour). At 6 it is half past. 60 minutes = 1 hour; half an hour = 30 minutes. Morning activities and
    evening activities.
  explanations:
    text: The short hand shows the hour and the long hand shows the minutes. When the long hand is on 12, it is something o'clock. When it is on 6, it is half past. One hour has 60 minutes.
    visual: 'Draw a clock face showing 3 o''clock: the long hand on 12 and the short hand on 3.'
    step_by_step: 'Step 1: Look at the short hand for the hour. Step 2: Look at the long hand: 12 means o''clock, 6 means half past. Step 3: Say the time.'
    real_world: School may start at 9 o'clock, and lunch break could be at half past 12.
  picture:
    kind: flow
    steps:
    - Long hand on 12
    - Short hand on 3
    - It is 3 o'clock
    alt: With the long hand on 12 and the short hand on 3, it is 3 o'clock.
  activity:
    type: sort
    prompt: What time is it?
    bins:
    - Something o'clock
    - Half past
    items:
    - label: Long hand on 12, short hand on 3
      bin: Something o'clock
      clue: Where is the long hand?
      why: 3 o'clock.
    - label: Long hand on 12, short hand on 8
      bin: Something o'clock
      clue: The long hand is at the top.
      why: 8 o'clock.
    - label: Long hand on 12, short hand on 1
      bin: Something o'clock
      clue: The long hand points straight up.
      why: 1 o'clock.
    - label: Long hand on 6, short hand between 4 and 5
      bin: Half past
      clue: The long hand points down.
      why: Half past 4.
    - label: Long hand on 6, short hand between 9 and 10
      bin: Half past
      clue: The long hand is at the bottom.
      why: Half past 9.
    - label: Long hand on 6, short hand between 12 and 1
      bin: Half past
      clue: Long hand straight down.
      why: Half past 12.
  items:
  - prompt: 'The short hand on a clock shows the:'
    options:
    - hour
    - minute
    - day
    - month
    answer: hour
    difficulty: 1
    hints:
    - It moves slowly.
    - Short = hour.
    solution: The short hand shows the hour.
    mistakes: {"minute": "m3_short_hand"}
  - prompt: Long hand on 12, short hand on 3. What time is it?
    options:
    - 3 o'clock
    - 12 o'clock
    - half past 3
    - half past 12
    answer: 3 o'clock
    difficulty: 1
    hints:
    - Long on 12 means o'clock.
    - Read the short hand.
    solution: It is 3 o'clock.
    mistakes:
      12 o'clock: c3_place
  - prompt: How many minutes are in one hour?
    answer: '60'
    check: '60'
    difficulty: 1
    hints:
    - The long hand goes all the way round.
    - Sixty.
    solution: 1 hour = 60 minutes.
    mistakes: {"100": "m3_minutes_hour", "30": "m3_minutes_hour"}
  - prompt: How many minutes are in half an hour?
    answer: '30'
    check: 60/2
    difficulty: 2
    hints:
    - Half of 60.
    - 60 ÷ 2.
    solution: 30 minutes.
    mistakes: {"50": "m4_half_hour", "60": "m4_half_hour"}
  - prompt: Long hand on 6, short hand just after 4. What time is it?
    options:
    - half past 4
    - 6 o'clock
    - 4 o'clock
    - half past 6
    answer: half past 4
    difficulty: 2
    hints:
    - Long hand on 6 means half past.
    - The hour is 4.
    solution: It is half past 4.
    mistakes: {"half past 6": "m4_short_hand"}
  - prompt: A film starts at 2 o'clock and ends at 5 o'clock. How many hours long?
    answer: '3'
    check: 5 - 2
    difficulty: 2
    hints:
    - Count from 2 to 5.
    - 5 − 2.
    solution: 3 hours.
    mistakes: {"7": "m3_count_hours", "2": "m3_count_hours"}
