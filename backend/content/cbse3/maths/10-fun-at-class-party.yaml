# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 10
title: Fun at Class Party!
concepts:
- code: cbse3m.party.pattern
  title: Patterns in decorations
  notes: |
    Patterns repeat in a rule: colours (red, yellow, red, yellow), shapes, numbers (2, 4, 6, 8 adds 2 each time; 50, 45,
    40 takes 5 each time). Find the repeating part (the core) and continue it. Growing patterns get bigger each time.
  explanations:
    text: A pattern follows a rule. In red, yellow, red, yellow, the part that repeats is red, yellow. In 2, 4, 6, 8, the rule is add 2. Find the rule to say what comes next.
    visual: 'Draw a string of party flags: red, yellow, green, red, yellow, green. Circle the part that repeats.'
    step_by_step: 'Step 1: Look at the first few things. Step 2: Find the part that repeats or the rule. Step 3: Use it to continue.'
    real_world: Party buntings, bead necklaces and rangoli borders all use patterns.
  picture:
    kind: number_line
    from: 0
    to: 12
    step: 2
    points:
    - at: 2
      label: '2'
    - at: 4
      label: '4'
    - at: 6
      label: '6'
    - at: 8
      label: '8'
    - at: 10
      label: '?'
    alt: The pattern 2, 4, 6, 8 adds 2 each time, so 10 comes next.
    jumps:
    - from: 2
      to: 4
      label: '+2'
    - from: 4
      to: 6
      label: '+2'
    - from: 6
      to: 8
      label: '+2'
    - from: 8
      to: 10
      label: '+2'
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: Find the rule. Mark the next number.
    goals:
    - prompt: 2, 4, 6, 8, …
      target: 10
      mistakes:
      - when:
          v: 9
        say: The rule is add 2, not add 1.
    - prompt: 5, 10, 15, …
      target: 20
      mistakes:
      - when:
          v: 16
        say: Each step adds 5.
    - prompt: 20, 18, 16, …
      target: 14
      mistakes:
      - when:
          v: 18
        say: The numbers go down by 2.
      - when:
          v: 15
        say: Take away 2, not 1.
  items:
  - prompt: What comes next? red, yellow, red, yellow, ___
    options:
    - red
    - yellow
    - green
    - blue
    answer: red
    difficulty: 1
    hints:
    - The pair repeats.
    - After yellow comes ...
    solution: Red comes next.
  - prompt: What comes next? 2, 4, 6, 8, ___
    answer: '10'
    check: 8 + 2
    difficulty: 1
    hints:
    - Add 2 each time.
    - 8 + 2.
    solution: 8 + 2 = 10.
    mistakes:
      '9': c3_count_once
  - prompt: What comes next? 50, 45, 40, 35, ___
    answer: '30'
    check: 35 - 5
    difficulty: 2
    hints:
    - Take 5 each time.
    - 35 − 5.
    solution: 35 − 5 = 30.
  - prompt: What comes next? 10, 20, 30, 40, ___
    answer: '50'
    check: 40 + 10
    difficulty: 1
    hints:
    - Add 10 each time.
    - 40 + 10.
    solution: 40 + 10 = 50.
  - prompt: 'Balloons: big, small, small, big, small, small, ___'
    options:
    - big
    - small
    - medium
    - none
    answer: big
    difficulty: 2
    hints:
    - The repeating part is big, small, small.
    - Start again.
    solution: Big comes next.
  - prompt: 'A growing pattern: 1, 3, 5, 7, ___'
    answer: '9'
    check: 7 + 2
    difficulty: 2
    hints:
    - What is added each time?
    - Add 2.
    solution: 7 + 2 = 9.
- code: cbse3m.party.length
  title: Measuring length
  after:
  - cbse3m.party.pattern
  notes: |
    Length can be measured with hand spans, footsteps, or a scale in centimetres (cm). 100 cm = 1 metre (m). Long things
    (rooms, ribbons for decorating) in metres; short things (pencils, erasers) in cm. Measure from 0 on the scale.
  explanations:
    text: We measure length to know how long something is. Hand spans and steps change from person to person, so we use a scale. Small things are measured in centimetres; long things in metres. 100 centimetres make 1 metre.
    visual: Draw a ruler from 0 to 15 cm with a pencil lying along it from 0 to 12.
    step_by_step: 'Step 1: Put one end at 0 on the scale. Step 2: Look where the other end reaches. Step 3: Read the number and write cm.'
    real_world: To decorate the classroom for a party, we measure how many metres of ribbon we need.
  picture:
    kind: bars
    bars:
    - label: Eraser
      value: 4
    - label: Pencil
      value: 12
    - label: Notebook
      value: 25
    alt: An eraser is 4 cm, a pencil 12 cm, and a notebook 25 cm long.
    unit: cm
  activity:
    type: sort
    prompt: Would you measure it in centimetres or metres?
    bins:
    - Centimetres
    - Metres
    items:
    - label: A pencil
      bin: Centimetres
      clue: Small, fits in your hand.
      why: Centimetres.
    - label: An eraser
      bin: Centimetres
      clue: Tiny.
      why: Centimetres.
    - label: Your hand span
      bin: Centimetres
      clue: Short.
      why: Centimetres.
    - label: A balloon string for the party
      bin: Metres
      clue: Longer than you.
      why: Metres.
    - label: The classroom
      bin: Metres
      clue: Walk across it.
      why: Metres.
    - label: A sari
      bin: Metres
      clue: Very long cloth.
      why: Metres.
  items:
  - prompt: Which unit is best for the length of a pencil?
    options:
    - centimetre
    - metre
    - kilogram
    - litre
    answer: centimetre
    difficulty: 1
    hints:
    - A pencil is short.
    - Small unit.
    solution: Short things are measured in centimetres.
  - prompt: How many centimetres make 1 metre?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Look at a metre stick.
    - One hundred.
    solution: 100 cm = 1 m.
  - prompt: A ribbon is 3 metres. How many centimetres?
    answer: '300'
    check: 3*100
    difficulty: 2
    hints:
    - 1 m = 100 cm.
    - 3 × 100.
    solution: 3 × 100 = 300 cm.
    mistakes:
      '3': c3_place
      '30': c3_place
  - prompt: Why do hand-span measurements of the same table differ?
    options:
    - different people have different hand sizes
    - the table grows
    - spans are always wrong
    - tables change shape
    answer: different people have different hand sizes
    difficulty: 2
    hints:
    - Compare your hand with a teacher's.
    - Spans are not all equal.
    solution: Hand sizes differ, so counts differ.
  - prompt: A pencil starts at 0 and ends at 12 on a scale. How long is it in cm?
    answer: '12'
    check: 12 - 0
    difficulty: 1
    hints:
    - Read the end.
    - Start was 0.
    solution: It is 12 cm long.
  - prompt: 'Two ribbons: 25 cm and 15 cm. Together how long?'
    answer: '40'
    check: 25 + 15
    difficulty: 1
    hints:
    - Add.
    - 25 + 15.
    solution: 25 + 15 = 40 cm.
