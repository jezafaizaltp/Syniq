# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 10
title: Fun at Class Party!
tips:
  m3_cm: "A pencil is short. Use the smaller unit on your ruler."
  m3_cm_in_m: "'Centi' means hundredth: a centimetre is one hundredth of a metre."
  m3_odd_jump: "The numbers go up by 2 each time and stay odd."
  c3m10_core: Find the smallest part that repeats, mark where it starts again, and keep going.
  c3m10_rule: Look at how much changes from one number to the next. Is it the same every time?
  c3m10_unit: 'Think how long the thing is: does it fit on your ruler (cm), or is it longer than you (m)?'
  c3m10_zero: Read where the thing starts and where it ends on the scale. The length is the gap between them.

concepts:
- code: cbse3m.party.pattern
  title: Patterns in decorations
  notes: |
    Patterns repeat in a rule: colours (red, yellow, red, yellow), shapes, numbers (2, 4, 6, 8 adds 2 each time; 50, 45,
    40 takes 5 each time). Find the repeating part (the core) and continue it. Growing patterns get bigger each time.
  explanations:
    text: A pattern follows a rule. In red, yellow, red, yellow, the part that repeats is red, yellow. In 2, 4, 6, 8, the rule is add 2. Find the rule to say what comes next.
    visual: 'Draw a string of party flags: red, yellow, green, red, yellow, green. Circle the part that repeats.'
    step_by_step: 'Step 1: Look at the first few things. Step 2: Find the part that repeats or the rule. Step 3: Use it to continue.'
    real_world: Party buntings, bead necklaces and rangoli borders all use patterns.
  picture:
    kind: number_line
    from: 0
    to: 12
    step: 2
    points:
    - at: 2
      label: '2'
    - at: 4
      label: '4'
    - at: 6
      label: '6'
    - at: 8
      label: '8'
    - at: 10
      label: '?'
    alt: The pattern 2, 4, 6, 8 adds 2 each time, so 10 comes next.
    jumps:
    - from: 2
      to: 4
      label: '+2'
    - from: 4
      to: 6
      label: '+2'
    - from: 6
      to: 8
      label: '+2'
    - from: 8
      to: 10
      label: '+2'
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: Find the rule. Mark the next number.
    goals:
    - prompt: 2, 4, 6, 8, …
      target: 10
      mistakes:
      - when:
          v: 9
        say: The rule is add 2, not add 1.
    - prompt: 5, 10, 15, …
      target: 20
      mistakes:
      - when:
          v: 16
        say: Each step adds 5.
    - prompt: 20, 18, 16, …
      target: 14
      mistakes:
      - when:
          v: 18
        say: The numbers go down by 2.
      - when:
          v: 15
        say: Take away 2, not 1.
  lesson:
    - teach: 'A repeating pattern has a core: the smallest part that repeats. In red, red, blue, red, red, blue, the core is ''red, red, blue''. Once you know the core, you can say what comes next.'
      check:
        prompt: 'What is the core of: cap, bell, cap, bell, cap, bell?'
        options:
        - cap, bell
        - cap
        - cap, bell, cap
        answer: cap, bell
        why: Those two repeat again and again.
      ways:
      - style: visual
        teach: 'Finding the core of a pattern: the smallest part that repeats.'
        picture:
          kind: compare
          columns:
          - title: Pattern
            points:
            - blue, green, green, blue, green, green
          - title: Core
            points:
            - blue, green, green
          - title: Next
            points:
            - blue
          alt: In the pattern blue, green, green, blue, green, green, the core is blue, green, green. The core starts again, so blue comes next.
      - style: real_world
        teach: Paper chains for a class party are often made in a colour pattern. If the chain breaks, the core tells you which colour to add next to fix it.
    - teach: Number patterns follow a rule. 3, 6, 9, 12 adds 3 each time. 40, 36, 32 takes away 4 each time. Find the rule by checking the gap between neighbours.
      picture:
        kind: number_line
        from: 0
        to: 15
        jumps:
        - from: 3
          to: 6
        - from: 6
          to: 9
        - from: 9
          to: 12
        alt: '3, 6, 9, 12 on a number line: each jump is 3.'
      check:
        prompt: Rule for 5, 10, 15, 20?
        options:
        - add 5
        - add 10
        - take away 5
        answer: add 5
        why: Each number is 5 more than the one before.
      ways:
      - style: visual
        teach: 'Finding the rule: 48, 42, 36 takes away 6 each time.'
        picture:
          kind: number_line
          from: 30
          to: 50
          step: 2
          jumps:
          - from: 48
            to: 42
            label: −6
          - from: 42
            to: 36
            label: −6
          alt: On the number line, 48 jumps back 6 to 42, and 42 jumps back 6 to 36. The rule is take away 6, so the next number is 30.
      - style: step_by_step
        teach: 'Find the rule in 7, 14, 21, 28. Step 1: Find the gap from 7 to 14: 7. Step 2: Check the next gap, 14 to 21: also 7. Step 3: Check 21 to 28: 7 again. Step 4: The rule is add 7, so the next number is 35.'
    - teach: 'A growing pattern gets bigger each step: 1 star, 2 stars, 3 stars... or 2, 4, 6, 8. A shrinking pattern gets smaller.'
      check:
        prompt: What comes next? 1, 2, 3, 4, ___
        options:
        - '5'
        - '4'
        - '6'
        answer: '5'
        why: It grows by 1 each time.
      ways:
      - style: visual
        teach: A growing pattern made of block towers that get taller.
        picture:
          kind: bars
          bars:
          - label: Step 1
            value: 2
          - label: Step 2
            value: 5
          - label: Step 3
            value: 8
          - label: Step 4
            value: 11
          alt: The block towers have 2, 5, 8 and 11 blocks. Each step adds 3 blocks, so the pattern grows.
      - style: real_world
        teach: 'When a candle burns, it gets a little shorter every hour: a shrinking pattern. A plant that grows a few centimetres each week is a growing pattern.'
  items:
  - prompt: What comes next? red, yellow, red, yellow, ___
    options:
    - red
    - yellow
    - green
    - blue
    answer: red
    difficulty: 1
    hints:
    - The pair repeats.
    - After yellow comes ...
    solution: Red comes next.
    mistakes: {"yellow": "m5_alternate"}
  - prompt: What comes next? 2, 4, 6, 8, ___
    answer: '10'
    check: 8 + 2
    difficulty: 1
    hints:
    - Add 2 each time.
    - 8 + 2.
    solution: 8 + 2 = 10.
    mistakes:
      '9': c3_count_once
  - prompt: What comes next? 50, 45, 40, 35, ___
    answer: '30'
    check: 35 - 5
    difficulty: 2
    hints:
    - Take 5 each time.
    - 35 − 5.
    solution: 35 − 5 = 30.
    mistakes: {"25": "m5_pattern_rule", "40": "m5_pattern_rule"}
  - prompt: What comes next? 10, 20, 30, 40, ___
    answer: '50'
    check: 40 + 10
    difficulty: 1
    hints:
    - Add 10 each time.
    - 40 + 10.
    solution: 40 + 10 = 50.
    mistakes: {"41": "m5_pattern_rule", "60": "m5_pattern_rule"}
  - prompt: 'Balloons: big, small, small, big, small, small, ___'
    options:
    - big
    - small
    - medium
    - none
    answer: big
    difficulty: 2
    hints:
    - The repeating part is big, small, small.
    - Start again.
    solution: Big comes next.
    mistakes: {"small": "m4_core"}
  - prompt: 'A growing pattern: 1, 3, 5, 7, ___'
    answer: '9'
    check: 7 + 2
    difficulty: 2
    hints:
    - What is added each time?
    - Add 2.
    solution: 7 + 2 = 9.
    mistakes: {"8": "m3_odd_jump", "11": "m3_odd_jump"}
  - prompt: What comes next? 5, 10, 15, 20, ___
    answer: '25'
    check: 20+5
    difficulty: 1
    hints:
    - What is added each time?
    - 20 + 5.
    solution: 'Step 1: The rule is add 5. Step 2: 20 + 5 = 25.'
    mistakes:
      '30': c3m10_rule
      '21': c3m10_rule
  - prompt: What comes next? 30, 27, 24, 21, ___
    answer: '18'
    check: 21-3
    difficulty: 2
    hints:
    - Is the pattern going up or down?
    - How much less each time?
    solution: 'Step 1: The rule is take away 3. Step 2: 21 − 3 = 18.'
    mistakes:
      '24': c3m10_rule
      '20': c3m10_rule
  - prompt: 'Flags: green, white, white, green, white, white, ___'
    options:
    - green
    - white
    - orange
    answer: green
    difficulty: 1
    hints:
    - Find the core.
    - green, white, white...
    solution: 'Step 1: The core is green, white, white. Step 2: It starts again with green.'
    mistakes:
      white: c3m10_core
      orange: c3m10_core
  - prompt: What comes next? 100, 90, 80, 70, ___
    answer: '60'
    check: 70-10
    difficulty: 1
    hints:
    - Take away the same each time.
    - 70 − 10.
    solution: 'Step 1: The rule is take away 10. Step 2: 70 − 10 = 60.'
    mistakes:
      '80': c3m10_rule
      '69': c3m10_rule
  - prompt: In the pattern A, B, C, A, B, C, what is the 8th letter?
    options:
    - B
    - A
    - C
    answer: B
    difficulty: 3
    hints:
    - The core has 3 letters.
    - The 7th letter starts a new core.
    solution: 'Step 1: Letters 7, 8, 9 are A, B, C. Step 2: The 8th is B.'
    mistakes:
      A: c3m10_core
      C: c3m10_core
  - prompt: What comes next? 2, 4, 8, 16, ___
    answer: '32'
    check: 16*2
    difficulty: 3
    hints:
    - The gaps are not the same.
    - Each number is double the one before.
    solution: 'Step 1: Rule: double it. Step 2: 16 × 2 = 32.'
    mistakes:
      '18': c3m10_rule
      '24': c3m10_rule
  - prompt: A garland has 3 marigolds then 1 rose, again and again. How many marigolds come before the 2nd rose?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - Each core has 3 marigolds and 1 rose.
    - Count two cores.
    solution: 'Step 1: 2 cores up to the 2nd rose. Step 2: 3 + 3 = 6 marigolds.'
    mistakes:
      '3': c3m10_core
      '8': c3m10_core
  - prompt: What is the rule? 11, 22, 33, 44
    options:
    - add 11
    - add 10
    - add 2
    answer: add 11
    difficulty: 2
    hints:
    - Find the gap from 11 to 22.
    - Is the gap the same each time?
    solution: 'Step 1: 22 − 11 = 11. Step 2: Every gap is 11, so the rule is add 11.'
    mistakes:
      add 10: c3m10_rule
      add 2: c3m10_rule
  - prompt: What comes next? 1, 3, 5, 7, 9, ___
    answer: '11'
    check: 9+2
    difficulty: 1
    hints:
    - Odd numbers.
    - Add 2 each time.
    solution: 'Step 1: Rule: add 2. Step 2: 9 + 2 = 11.'
    mistakes:
      '10': c3m10_rule
      '13': c3m10_rule
  - prompt: 'Case: For a class party, children hang balloons in the pattern red, red, yellow, red, red, yellow. They have 3 balloons left: one red and two yellow. They want to add the next 3 balloons in the pattern. What is the problem?'
    options:
    - The next 3 should be red, red, yellow, so they need one more red balloon
    - 'There is no problem: yellow, yellow, red is next'
    - They should start a new pattern
    answer: The next 3 should be red, red, yellow, so they need one more red balloon
    hints:
    - What is the core of the pattern?
    - How many red balloons does one core need?
    solution: The core is red, red, yellow. The next three must be red, red, yellow, which needs 2 red and 1 yellow. They have only 1 red.
    mistakes:
      'There is no problem: yellow, yellow, red is next': c3m10_core
      They should start a new pattern: c3m10_core
    exam: case
    difficulty: 2
  - prompt: 'Situation: A sticker book has page numbers 12, 15, 18, 21, but the next number is smudged. What should it be?'
    options:
    - '24'
    - '22'
    - '25'
    answer: '24'
    hints:
    - What is the gap between neighbours?
    - Is the gap the same each time?
    solution: 'The gap is 3 each time: 12, 15, 18, 21. Adding 3 to 21 gives 24.'
    mistakes:
      '22': c3m10_rule
      '25': c3m10_rule
    exam: competency
    difficulty: 2
- code: cbse3m.party.length
  title: Measuring length
  after:
  - cbse3m.party.pattern
  notes: |
    Length can be measured with hand spans, footsteps, or a scale in centimetres (cm). 100 cm = 1 metre (m). Long things
    (rooms, ribbons for decorating) in metres; short things (pencils, erasers) in cm. Measure from 0 on the scale.
  explanations:
    text: We measure length to know how long something is. Hand spans and steps change from person to person, so we use a scale. Small things are measured in centimetres; long things in metres. 100 centimetres make 1 metre.
    visual: Draw a ruler from 0 to 15 cm with a pencil lying along it from 0 to 12.
    step_by_step: 'Step 1: Put one end at 0 on the scale. Step 2: Look where the other end reaches. Step 3: Read the number and write cm.'
    real_world: To decorate the classroom for a party, we measure how many metres of ribbon we need.
  picture:
    kind: bars
    bars:
    - label: Eraser
      value: 4
    - label: Pencil
      value: 12
    - label: Notebook
      value: 25
    alt: An eraser is 4 cm, a pencil 12 cm, and a notebook 25 cm long.
    unit: cm
  activity:
    type: sort
    prompt: Would you measure it in centimetres or metres?
    bins:
    - Centimetres
    - Metres
    items:
    - label: A pencil
      bin: Centimetres
      clue: Small, fits in your hand.
      why: Centimetres.
    - label: An eraser
      bin: Centimetres
      clue: Tiny.
      why: Centimetres.
    - label: Your hand span
      bin: Centimetres
      clue: Short.
      why: Centimetres.
    - label: A balloon string for the party
      bin: Metres
      clue: Longer than you.
      why: Metres.
    - label: The classroom
      bin: Metres
      clue: Walk across it.
      why: Metres.
    - label: A sari
      bin: Metres
      clue: Very long cloth.
      why: Metres.
  lesson:
    - teach: 'We can measure with our body: hand spans, foot lengths, steps. But different people have different hand sizes, so their counts differ. That is why we use a fixed unit.'
      check:
        prompt: Why do a child and a teacher get different hand-span counts for the same table?
        options:
        - their hands are different sizes
        - the table changes
        - one counted wrong
        answer: their hands are different sizes
        why: A bigger hand covers more each time, so fewer spans are needed.
      ways:
      - style: visual
        teach: The same desk measured in hand spans by two different people.
        picture:
          kind: bars
          bars:
          - label: Teacher's spans
            value: 4
          - label: Child's spans
            value: 6
          alt: The same desk is 4 hand spans long for the teacher and 6 hand spans long for a child, because the child's hand is smaller.
      - style: real_world
        teach: Long ago, cloth was measured by the length of a forearm. Every seller's arm was different, so buyers got different amounts. That is why the whole country now uses the same metre.
    - teach: A scale (ruler) measures in centimetres (cm). Put one end of the object at 0 and read the number at the other end. A pencil from 0 to 15 is 15 cm.
      picture:
        kind: number_line
        from: 0
        to: 20
        jumps:
        - from: 0
          to: 15
        alt: A pencil lying from 0 to 15 on a ruler measures 15 cm.
      check:
        prompt: An eraser lies from 0 to 4 on a scale. How long is it?
        options:
        - 4 cm
        - 0 cm
        - 40 cm
        answer: 4 cm
        why: 'Start at 0, end at 4: 4 cm.'
      ways:
      - style: step_by_step
        teach: 'Measure a pencil that does not start at 0. Step 1: Read where it starts: 4. Step 2: Read where it ends: 17. Step 3: Find the gap: 17 − 4 = 13. Step 4: The pencil is 13 cm long.'
      - style: visual
        teach: A book placed along a ruler, with one end at 0.
        picture:
          kind: number_line
          from: 0
          to: 25
          step: 1
          jumps:
          - from: 0
            to: 22
            label: book
          alt: A book is put with one end at 0 on the ruler. Its other end is at 22, so the book is 22 cm long.
    - teach: For long things like a room or a ribbon, we use metres (m). 1 metre = 100 centimetres. So 2 m = 200 cm.
      check:
        prompt: Which unit for the length of a classroom?
        options:
        - metre
        - centimetre
        - litre
        answer: metre
        why: A classroom is very long, so metres are easier.
      ways:
      - style: visual
        teach: 'Which unit to use: centimetres for short things, metres for long things.'
        picture:
          kind: compare
          columns:
          - title: Centimetres (cm)
            points:
            - Pencil
            - Book
            - Your finger
          - title: Metres (m)
            points:
            - Classroom
            - Saree
            - Playground
          alt: Short things like a pencil, a book or your finger are measured in centimetres. Long things like a classroom, a saree or a playground are measured in metres.
      - style: real_world
        teach: A tailor's measuring tape is 150 cm long, which is one and a half metres. It is long enough to measure round your waist or across your shoulders.
  items:
  - prompt: Which unit is best for the length of a pencil?
    options:
    - centimetre
    - metre
    - kilogram
    - litre
    answer: centimetre
    difficulty: 1
    hints:
    - A pencil is short.
    - Small unit.
    solution: Short things are measured in centimetres.
    mistakes: {"metre": "m3_cm"}
  - prompt: How many centimetres make 1 metre?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Look at a metre stick.
    - One hundred.
    solution: 100 cm = 1 m.
    mistakes: {"10": "m3_cm_in_m", "1000": "m3_cm_in_m"}
  - prompt: A ribbon is 3 metres. How many centimetres?
    answer: '300'
    check: 3*100
    difficulty: 2
    hints:
    - 1 m = 100 cm.
    - 3 × 100.
    solution: 3 × 100 = 300 cm.
    mistakes:
      '3': c3_place
      '30': c3_place
  - prompt: Why do hand-span measurements of the same table differ?
    options:
    - different people have different hand sizes
    - the table grows
    - spans are always wrong
    - tables change shape
    answer: different people have different hand sizes
    difficulty: 2
    hints:
    - Compare your hand with a teacher's.
    - Spans are not all equal.
    solution: Hand sizes differ, so counts differ.
    mistakes: {"the table grows": "m4_standard"}
  - prompt: A pencil starts at 0 and ends at 12 on a scale. How long is it in cm?
    answer: '12'
    check: 12 - 0
    difficulty: 1
    hints:
    - Read the end.
    - Start was 0.
    solution: It is 12 cm long.
    mistakes: {"11": "m4_ruler", "13": "m4_ruler"}
  - prompt: 'Two ribbons: 25 cm and 15 cm. Together how long?'
    answer: '40'
    check: 25 + 15
    difficulty: 1
    hints:
    - Add.
    - 25 + 15.
    solution: 25 + 15 = 40 cm.
    mistakes: {"10": "m3_add_places", "30": "m3_add_places"}
  - prompt: How many centimetres are in 2 metres?
    answer: '200'
    check: 2*100
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - Double it.
    solution: 'Step 1: 100 + 100. Step 2: = 200 cm.'
    mistakes:
      '20': c3m10_unit
      '102': c3m10_unit
  - prompt: Which unit is best for the length of an eraser?
    options:
    - centimetre
    - metre
    - kilogram
    answer: centimetre
    difficulty: 1
    hints:
    - An eraser is small.
    - It fits on a ruler.
    solution: 'Step 1: An eraser is a few cm long. Step 2: Use centimetres.'
    mistakes:
      metre: c3m10_unit
      kilogram: c3m10_unit
  - prompt: A crayon lies from 0 to 9 on a scale. How long is it in cm?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - Where does it start?
    - Where does it end?
    solution: 'Step 1: From 0 to 9. Step 2: 9 cm.'
    mistakes:
      '10': c3m10_zero
      '8': c3m10_zero
  - prompt: A ribbon of 50 cm and another of 35 cm are joined. How long is the new ribbon?
    answer: '85'
    check: 50+35
    difficulty: 2
    hints:
    - Joining means adding.
    - 50 + 35.
    solution: 'Step 1: 50 + 35. Step 2: = 85 cm.'
    mistakes:
      '15': c3m10_zero
      '75': c3m10_zero
  - prompt: A 100 cm string is cut and 40 cm is used. How much is left?
    answer: '60'
    check: 100-40
    difficulty: 2
    hints:
    - Take away what is used.
    - 100 − 40.
    solution: 'Step 1: 100 − 40. Step 2: = 60 cm.'
    mistakes:
      '140': c3m10_zero
      '40': c3m10_zero
  - prompt: 'Which is longer: 1 metre or 90 cm?'
    options:
    - 1 metre
    - 90 cm
    - they are equal
    answer: 1 metre
    difficulty: 2
    hints:
    - Change 1 metre into cm.
    - Compare 100 and 90.
    solution: 'Step 1: 1 m = 100 cm. Step 2: 100 > 90, so 1 metre is longer.'
    mistakes:
      90 cm: c3m10_unit
      they are equal: c3m10_unit
  - prompt: A table is 6 hand spans long for a teacher. Would a child's count be more or fewer spans?
    options:
    - more, because a child's span is smaller
    - fewer, because a child's span is smaller
    - the same
    answer: more, because a child's span is smaller
    difficulty: 3
    hints:
    - Smaller steps need more of them.
    - Who has the smaller hand?
    solution: 'Step 1: A child''s span is smaller. Step 2: So more spans fit along the table.'
    mistakes:
      fewer, because a child's span is smaller: c3m10_unit
      the same: c3m10_unit
  - prompt: A pencil lies from 2 to 10 on a scale. How long is it in cm?
    answer: '8'
    check: 10-2
    difficulty: 3
    hints:
    - It does not start at 0.
    - Count from 2 to 10.
    solution: 'Step 1: End − start. Step 2: 10 − 2 = 8 cm.'
    mistakes:
      '10': c3m10_zero
      '12': c3m10_zero
  - prompt: For a class party, 4 streamers of 1 metre each are needed. How many cm is that?
    answer: '400'
    check: 4*100
    difficulty: 2
    hints:
    - 1 m = 100 cm.
    - 4 × 100.
    solution: 'Step 1: Each is 100 cm. Step 2: 4 × 100 = 400 cm.'
    mistakes:
      '40': c3m10_unit
      '104': c3m10_unit
  - prompt: 'Case: Two children measure the same classroom bench by walking heel to toe. One gets 8 foot-lengths and the other gets 11. They start arguing about who is right. What is the best way to settle it?'
    options:
    - Both counts can be right; measure with a metre scale so the answer is the same for everyone
    - The bigger number is always right
    - The child with bigger feet is wrong
    answer: Both counts can be right; measure with a metre scale so the answer is the same for everyone
    hints:
    - Are the two children's feet the same size?
    - What kind of unit gives the same answer for everyone?
    solution: Different feet give different counts, so both can be right. A fixed unit, like centimetres on a metre scale, gives everyone the same answer.
    mistakes:
      The bigger number is always right: c3m10_unit
      The child with bigger feet is wrong: c3m10_unit
    exam: case
    difficulty: 2
  - prompt: 'Situation: You need 150 cm of ribbon to wrap a gift box. You have a roll with exactly 1 metre of ribbon. Is it enough?'
    options:
    - No, 1 metre is 100 cm, so 50 cm more is needed
    - Yes, 1 metre is more than 150 cm
    - Yes, exactly enough
    answer: No, 1 metre is 100 cm, so 50 cm more is needed
    hints:
    - How many centimetres are in 1 metre?
    - Compare that with 150 cm.
    solution: 1 metre = 100 cm. 100 cm is less than 150 cm, so 150 − 100 = 50 cm more is needed.
    mistakes:
      Yes, 1 metre is more than 150 cm: m3_cm_in_m
      Yes, exactly enough: m3_cm_in_m
    exam: competency
    difficulty: 2
