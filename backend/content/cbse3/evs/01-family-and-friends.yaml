# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 1
title: Family and Friends
tips:
  c3v_think: Think about your own home, school or street. What have you seen there?
  c3v_reread: Read the question again slowly and find the key word.
concepts:
- code: cbse3v.fam.family
  title: Family and Friends
  notes: |
    Unit 1: Our Families and Communities. Families can be small or big (joint, with grandparents). Family members love,
    care and share work. Friends play, share and help. Elders have stories and skills to teach. Families look different
    but all care for each other.
  explanations:
    text: Our family looks after us. Some families are small and some are big, with grandparents, aunts and cousins. Everyone shares the work at home. Friends play with us, share and help us too.
    visual: Draw your family and two friends. Write one thing each person does to help.
    step_by_step: 1. Name the people in your family. 2. Say what each one does at home. 3. Name a friend and how they help you.
    real_world: Grandparents often tell bedtime stories and teach old games like pallanguzhi or kho-kho.
  picture:
    kind: compare
    columns:
    - title: Small family
      points:
      - parents
      - children
    - title: Big (joint) family
      points:
      - grandparents, parents
      - uncles, aunts, cousins
    alt: A small family has parents and children; a big joint family also has grandparents, uncles, aunts and cousins.
  items:
  - prompt: 'A family with grandparents, uncles and cousins living together is a:'
    options:
    - joint family
    - small family
    - class
    - team
    answer: joint family
    difficulty: 1
    hints:
    - Many people.
    - Joined together.
    solution: That is a joint family.
    mistakes:
      small family: c3v_reread
  - prompt: Who usually tells old stories in a family?
    options:
    - grandparents
    - babies
    - pets
    - visitors
    answer: grandparents
    difficulty: 1
    hints:
    - The oldest people.
    - Dadi, Nani.
    solution: Grandparents often tell stories.
  - prompt: How can a child help at home?
    options:
    - by setting the table and watering plants
    - by breaking dishes
    - by hiding the broom
    - by making noise
    answer: by setting the table and watering plants
    difficulty: 1
    hints:
    - Small helpful jobs.
    - Think of home.
    solution: Setting the table and watering plants help.
    mistakes:
      by hiding the broom: c3v_think
  - prompt: 'A good friend:'
    options:
    - shares and helps
    - always fights
    - takes your things
    - laughs when you fall
    answer: shares and helps
    difficulty: 1
    hints:
    - Kind.
    - Helps you.
    solution: A good friend shares and helps.
  - prompt: Why do family members share work at home?
    options:
    - so no one gets too tired and work is done faster
    - to fight
    - because work is fun only alone
    - for no reason
    answer: so no one gets too tired and work is done faster
    difficulty: 2
    hints:
    - Many hands.
    - Help each other.
    solution: Sharing work makes it lighter for everyone.
  - prompt: 'Families are different, but all families:'
    options:
    - care for each other
    - have the same number of people
    - live in the same house
    - eat the same food
    answer: care for each other
    difficulty: 2
    hints:
    - What is the same in every family?
    - Love and care.
    solution: All families care for each other.
  - prompt: Your friend is sad. What can you do?
    options:
    - talk kindly and ask what is wrong
    - laugh at them
    - walk away
    - take their lunch
    answer: talk kindly and ask what is wrong
    difficulty: 1
    hints:
    - How would you feel?
    - Kindness.
    solution: Talking kindly helps a sad friend.
