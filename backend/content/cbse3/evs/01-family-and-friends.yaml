# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 1
title: Family and Friends
tips:
  c3v_think: Think about your own home, school or street. What have you seen there?
  c3v_reread: Read the question again slowly and find the key word.
  v3_families: "Families can be big or small. What is the same in all of them?"
  v3_stories: "Babies can't talk yet. Who in the family has lived the longest?"
  c3v1_who: Picture the people living in one home. Who is there besides parents and children?
  c3v1_kind: Think how you would feel in that place. What would help you most?
  c3v1_share: Think what happens when everyone helps a little at home.
concepts:
- code: cbse3v.fam.family
  title: Family and Friends
  notes: |
    Unit 1: Our Families and Communities. Families can be small or big (joint, with grandparents). Family members love,
    care and share work. Friends play, share and help. Elders have stories and skills to teach. Families look different
    but all care for each other.
  explanations:
    text: Our family looks after us. Some families are small and some are big, with grandparents, aunts and cousins. Everyone shares the work at home. Friends play with us, share and help us too.
    visual: Draw your family and two friends. Write one thing each person does to help.
    step_by_step: 1. Name the people in your family. 2. Say what each one does at home. 3. Name a friend and how they help you.
    real_world: Grandparents often tell bedtime stories and teach old games like pallanguzhi or kho-kho.
  picture:
    kind: compare
    columns:
    - title: Small family
      points:
      - parents
      - children
    - title: Big (joint) family
      points:
      - grandparents, parents
      - uncles, aunts, cousins
    alt: A small family has parents and children; a big joint family also has grandparents, uncles, aunts and cousins.
  activity:
    type: sort
    prompt: Is it a good way to help your family or friends?
    bins:
    - Good way to help
    - Not helpful
    items:
    - label: Helping to set the table
      bin: Good way to help
      clue: Does it share the work?
      why: Yes.
    - label: Sharing your toys with a friend
      bin: Good way to help
      clue: Friends share.
      why: Kind.
    - label: Fetching water for grandpa
      bin: Good way to help
      clue: He's happy.
      why: Helping.
    - label: Putting your shoes in their place
      bin: Good way to help
      clue: Less mess.
      why: Helping.
    - label: Fighting over the TV
      bin: Not helpful
      clue: Does anyone enjoy it?
      why: Not helpful.
    - label: Not letting a friend play
      bin: Not helpful
      clue: How does the friend feel?
      why: Not kind.
  lesson:
    - teach: 'A family is the people who live with us and care for us. Some families are small: parents and children. Some are big joint families, with grandparents, uncles, aunts and cousins in one home.'
      picture:
        kind: compare
        columns:
        - title: Small family
          points:
          - parents
          - children
        - title: Joint family
          points:
          - grandparents
          - parents
          - uncles and aunts
          - cousins
        alt: A small family and a joint family side by side.
      check:
        prompt: 'Grandparents, parents and cousins living together make a:'
        options:
        - joint family
        - small family
        - school
        answer: joint family
        why: Many relatives in one home is a joint family.
      ways:
      - style: real_world
        teach: In some homes, a child lives with a parent and a grandparent. In others, three generations share one big house with cousins. Both are families, because the people in them look after each other.
      - style: step_by_step
        teach: 'Draw your family tree. Step 1: Draw yourself at the bottom. Step 2: Draw the people who look after you above you. Step 3: Draw their parents above them. Step 4: Add brothers, sisters or cousins beside you.'
    - teach: 'Family members share work: cooking, cleaning, shopping, looking after the young and the old. Children help too, with small jobs like watering plants or folding clothes. Elders share stories and skills.'
      check:
        prompt: Which is a job a Class 3 child can do at home?
        options:
        - fold clothes
        - drive the car
        - fix the electric wires
        answer: fold clothes
        why: It is safe and helps everyone.
      ways:
      - style: visual
        teach: Jobs at home and who in the family might do each one.
        picture:
          kind: compare
          columns:
          - title: Grown-ups
            points:
            - Cooking
            - Shopping
            - Paying bills
          - title: Children
            points:
            - Watering plants
            - Folding clothes
            - Setting the table
          - title: Elders
            points:
            - Telling stories
            - Teaching old skills
          alt: Grown-ups may cook, shop and pay bills. Children can water plants, fold clothes and set the table. Elders tell stories and teach old skills.
      - style: real_world
        teach: When everyone helps clear up after dinner, the kitchen is clean in ten minutes. When one person does it all alone, it takes much longer and that person gets very tired.
    - teach: Friends play together, share and help each other. A good friend is kind, listens, and says sorry when wrong. Families and friends look different, but all of them care.
      check:
        prompt: Your friend forgot a pencil. What does a good friend do?
        options:
        - lend a pencil
        - laugh at the friend
        - tell everyone
        answer: lend a pencil
        why: Sharing and helping is what friends do.
      ways:
      - style: visual
        teach: What a good friend does, and what a good friend does not do.
        picture:
          kind: compare
          columns:
          - title: A good friend
            points:
            - Shares
            - Listens
            - Says sorry when wrong
            - Helps when you are stuck
          - title: Not a good friend
            points:
            - Grabs and never shares
            - Makes fun of you
            - Leaves others out on purpose
          alt: A good friend shares, listens, says sorry when wrong and helps when you are stuck. Grabbing and never sharing, making fun of you and leaving others out on purpose are not what a good friend does.
      - style: step_by_step
        teach: 'Make up after a quarrel with a friend. Step 1: Take a deep breath and calm down. Step 2: Say what upset you, without shouting. Step 3: Listen to your friend''s side. Step 4: Say sorry for your part, and find a way to play together again.'
  items:
  - prompt: 'A family with grandparents, uncles and cousins living together is a:'
    options:
    - joint family
    - small family
    - class
    - team
    answer: joint family
    difficulty: 1
    hints:
    - Many people.
    - Joined together.
    solution: That is a joint family.
    mistakes:
      small family: c3v_reread
  - prompt: Who usually tells old stories in a family?
    options:
    - grandparents
    - babies
    - pets
    - visitors
    answer: grandparents
    difficulty: 1
    hints:
    - The oldest people.
    - Dadi, Nani.
    solution: Grandparents often tell stories.
    mistakes: {"babies": "v3_stories"}
  - prompt: How can a child help at home?
    options:
    - "by setting the table and watering plants"
    - "by breaking dishes when washing them"
    - "by hiding the broom so nobody sweeps"
    - "by making noise while others rest"
    answer: by setting the table and watering plants
    difficulty: 1
    hints:
    - Small helpful jobs.
    - Think of home.
    solution: Setting the table and watering plants help.
    mistakes:
      "by hiding the broom so nobody sweeps": c3v_think
  - prompt: 'A good friend:'
    options:
    - shares and helps
    - always fights
    - takes your things
    - laughs when you fall
    answer: shares and helps
    difficulty: 1
    hints:
    - Kind.
    - Helps you.
    solution: A good friend shares and helps.
    mistakes: {"takes your things": "v4_good_friend"}
  - prompt: Why do family members share work at home?
    options:
    - "so no one gets too tired and work is done faster"
    - "so that they can fight about who does what"
    - "because work is only fun when done all alone"
    - "for no reason at all, it does not really help"
    answer: so no one gets too tired and work is done faster
    difficulty: 2
    hints:
    - Many hands.
    - Help each other.
    solution: Sharing work makes it lighter for everyone.
    mistakes: {"so that they can fight about who does what": "v4_share_work"}
  - prompt: 'Families are different, but all families:'
    options:
    - care for each other
    - have the same number of people
    - live in the same house
    - eat the same food
    answer: care for each other
    difficulty: 2
    hints:
    - What is the same in every family?
    - Love and care.
    solution: All families care for each other.
    mistakes: {"have the same number of people": "v3_families"}
  - prompt: Your friend is sad. What can you do?
    options:
    - "talk kindly and ask what is wrong"
    - "laugh at them for being sad"
    - "walk away and leave them alone"
    - "take their lunch box from them"
    answer: talk kindly and ask what is wrong
    difficulty: 1
    hints:
    - How would you feel?
    - Kindness.
    solution: Talking kindly helps a sad friend.
    mistakes: {"laugh at them for being sad": "v4_sad_friend"}
  - prompt: Who in a joint family is usually the oldest?
    options:
    - grandparents
    - cousins
    - the baby
    answer: grandparents
    difficulty: 1
    hints:
    - Think of who came first in the family.
    - Your parents' parents.
    solution: 'Step 1: Grandparents are the parents of your parents. Step 2: So they are usually the oldest.'
    mistakes:
      cousins: c3v1_who
      the baby: c3v1_who
  - prompt: Why is it good when everyone in a family shares the housework?
    options:
    - "the work gets done and no one gets too tired"
    - "so that the children can skip going to school"
    - "so that nobody in the family has to talk"
    answer: the work gets done and no one gets too tired
    difficulty: 1
    hints:
    - Think of one person doing all the work.
    - What changes when many help?
    solution: 'Step 1: Many hands share the load. Step 2: Work is faster and no one is worn out.'
    mistakes:
      "so that the children can skip going to school": c3v1_share
      "so that nobody in the family has to talk": c3v1_share
  - prompt: A new child joins your class and sits alone. What can you do?
    options:
    - say hello and invite the child to play
    - ignore the child
    - tell the child to sit somewhere else
    answer: say hello and invite the child to play
    difficulty: 1
    hints:
    - How would you feel on a first day?
    - What would make it better?
    solution: 'Step 1: Being new can feel lonely. Step 2: A hello and an invitation help.'
    mistakes:
      ignore the child: c3v1_kind
      tell the child to sit somewhere else: c3v1_kind
  - prompt: Your grandmother knows how to make pickles. What can you learn from her?
    options:
    - how to make pickles
    - how to drive
    - how to fly a plane
    answer: how to make pickles
    difficulty: 1
    hints:
    - Elders share their skills.
    - What skill was named?
    solution: 'Step 1: Grandmother knows a skill. Step 2: You can learn it from her.'
    mistakes:
      how to drive: c3v1_who
      how to fly a plane: c3v1_who
  - prompt: Which of these is NOT a kind thing to do for a friend?
    options:
    - "breaking their toy on purpose"
    - "sharing your lunch with them"
    - "helping them with homework"
    answer: breaking their toy on purpose
    difficulty: 1
    hints:
    - Which one would hurt a friend?
    - Two of them help.
    solution: 'Step 1: Sharing and helping are kind. Step 2: Breaking a toy on purpose hurts.'
    mistakes:
      "sharing your lunch with them": c3v1_kind
      "helping them with homework": c3v1_kind
  - prompt: Some families have one parent, some have two, some live with grandparents. What is true about all of them?
    options:
    - they care for each other
    - they all have five people
    - they all live in big houses
    answer: they care for each other
    difficulty: 2
    hints:
    - Families look different.
    - What do they all share?
    solution: 'Step 1: Families differ in size and shape. Step 2: Caring for each other is common to all.'
    mistakes:
      they all have five people: c3v1_who
      they all live in big houses: c3v1_who
  - prompt: Your little cousin is crying because of a fall. What should you do first?
    options:
    - "comfort the child and call an elder"
    - "laugh at the child for falling down"
    - "walk away and carry on playing"
    answer: comfort the child and call an elder
    difficulty: 2
    hints:
    - The child is hurt and scared.
    - Who can help with the hurt?
    solution: 'Step 1: Comfort the child. Step 2: Call an elder to check the hurt.'
    mistakes:
      "laugh at the child for falling down": c3v1_kind
      "walk away and carry on playing": c3v1_kind
  - prompt: You and a friend both want the same swing. What is a fair way?
    options:
    - take turns
    - push the friend off
    - never play on swings again
    answer: take turns
    difficulty: 2
    hints:
    - Both of you should get a go.
    - What lets both play?
    solution: 'Step 1: Both want it. Step 2: Taking turns lets both play.'
    mistakes:
      push the friend off: c3v1_kind
      never play on swings again: c3v1_kind
  - prompt: 'Case: In a family, one parent comes home tired from work every evening and then cooks, cleans and washes all alone. The children watch TV. What would make this home fairer?'
    options:
    - "Everyone shares the jobs: children can set the table, fold clothes and help clean up"
    - "The tired parent should just learn to cook, clean and wash much faster every evening"
    - "The children should watch more TV in the evening so that they are not in the way"
    answer: 'Everyone shares the jobs: children can set the table, fold clothes and help clean up'
    hints:
    - Is the work shared now?
    - What small jobs can children do?
    solution: When the work is shared, it gets done faster and no one gets too tired. Children can help with small jobs.
    mistakes:
      "The tired parent should just learn to cook, clean and wash much faster every evening": c3v1_share
      "The children should watch more TV in the evening so that they are not in the way": c3v1_share
    exam: case
    difficulty: 2
  - prompt: 'Situation: During a game, you accidentally knock over your friend''s tower of blocks. Your friend is upset. What is the best thing to do?'
    options:
    - Say sorry and help build it again
    - Laugh and walk away
    - Say it was your friend's fault
    answer: Say sorry and help build it again
    hints:
    - How does your friend feel?
    - What does a good friend do after a mistake?
    solution: A good friend says sorry when something goes wrong and helps to fix it.
    mistakes:
      Laugh and walk away: c3v1_kind
      Say it was your friend's fault: c3v1_kind
    exam: competency
    difficulty: 2
