# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 5
title: Plants and Animals Live Together
concepts:
- code: cbse3v.together.depend
  title: Plants and Animals Live Together
  notes: |
    Plants and animals depend on each other: animals get food and shelter from plants (birds nest in trees, monkeys eat
    fruit, cows eat grass); animals help plants (bees carry pollen, birds spread seeds, dung makes soil rich). Animals
    live in different homes: nest, hole, burrow, water, cowshed. Some eat plants, some eat other animals, some eat both.
  explanations:
    text: 'Plants and animals help each other. Trees give birds a home and fruit. Cows eat grass. Bees help flowers make fruit, and birds drop seeds that grow into new plants. Animals live in many homes: nests, holes, burrows and water.'
    visual: Draw a tree with a nest, a squirrel on a branch, a bee on a flower and a cow eating grass.
    step_by_step: 1. What does the animal get from the plant? 2. What does the plant get from the animal? 3. Where does the animal live?
    real_world: Elephants eat fruits and drop the seeds far away, helping forests grow.
  picture:
    kind: compare
    columns:
    - title: Plants give animals
      points:
      - food
      - shelter (homes)
    - title: Animals give plants
      points:
      - help with pollen (bees)
      - spread seeds (birds)
    alt: Plants give animals food and shelter; animals help plants by carrying pollen and spreading seeds.
  activity:
    type: sort
    prompt: Who helps whom?
    bins:
    - Plants help animals
    - Animals help plants
    items:
    - label: A tree gives a bird a home
      bin: Plants help animals
      clue: Who lives in the branches?
      why: The tree helps the bird.
    - label: Grass feeds a cow
      bin: Plants help animals
      clue: What does the cow eat?
      why: The grass helps the cow.
    - label: Fruit feeds a monkey
      bin: Plants help animals
      clue: Who eats it?
      why: The plant helps.
    - label: A bee carries pollen so fruit can grow
      bin: Animals help plants
      clue: Without bees, fewer fruits.
      why: The bee helps the plant.
    - label: A bird drops a seed that grows into a tree
      bin: Animals help plants
      clue: Seeds travel far.
      why: The bird helps.
    - label: An earthworm makes the soil soft
      bin: Animals help plants
      clue: Roots grow better.
      why: The worm helps.
  items:
  - prompt: Where does a bird usually live?
    options:
    - in a nest
    - in a burrow
    - in water
    - in a shell
    answer: in a nest
    difficulty: 1
    hints:
    - Made of twigs.
    - On a tree.
    solution: A bird lives in a nest.
  - prompt: How do bees help plants?
    options:
    - they carry pollen from flower to flower
    - they eat the roots
    - they cut the leaves
    - they don't help
    answer: they carry pollen from flower to flower
    difficulty: 2
    hints:
    - They visit flowers.
    - Yellow dust.
    solution: Bees carry pollen, which helps make fruits.
  - prompt: 'A rabbit lives in a:'
    options:
    - burrow
    - nest
    - tree hole high up
    - pond
    answer: burrow
    difficulty: 1
    hints:
    - A hole in the ground.
    - Digs.
    solution: A rabbit lives in a burrow.
  - prompt: 'A cow eats:'
    options:
    - grass and plants
    - meat
    - stones
    - plastic
    answer: grass and plants
    difficulty: 1
    hints:
    - It grazes.
    - Green.
    solution: A cow eats plants.
  - prompt: 'Birds help plants by:'
    options:
    - spreading seeds
    - eating all the leaves
    - pulling out roots
    - stopping rain
    answer: spreading seeds
    difficulty: 2
    hints:
    - They eat fruit and fly away.
    - Seeds drop.
    solution: Birds spread seeds.
  - prompt: 'A tiger eats:'
    options:
    - other animals
    - only grass
    - only fruits
    - soil
    answer: other animals
    difficulty: 1
    hints:
    - It hunts.
    - Sharp teeth.
    solution: A tiger eats other animals.
  - prompt: 'Cutting down a tree can harm animals because:'
    options:
    - they lose their homes and food
    - trees are noisy
    - animals hate shade
    - it has no effect
    answer: they lose their homes and food
    difficulty: 2
    hints:
    - Who lives in the tree?
    - Nests, fruit.
    solution: Animals lose homes and food.
    mistakes:
      it has no effect: c3v_think
