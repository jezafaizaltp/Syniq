# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 5
title: Plants and Animals Live Together
tips:
  v3_burrow: "A rabbit digs its home under the ground."
  v3_cow_food: "Watch a cow in a field. What is it chewing?"
  v3_nest: "Birds build their homes in trees, from twigs."
  v3_tiger_food: "A tiger has sharp teeth and claws for hunting."
  c3v5_give: Think what the animal gets from the plant, or what the plant gets from the animal.
  c3v5_home: Picture where the animal sleeps and keeps its young.
  c3v5_eat: Think of the animal's teeth or beak and what it is usually seen eating.

concepts:
- code: cbse3v.together.depend
  title: Plants and Animals Live Together
  notes: |
    Plants and animals depend on each other: animals get food and shelter from plants (birds nest in trees, monkeys eat
    fruit, cows eat grass); animals help plants (bees carry pollen, birds spread seeds, dung makes soil rich). Animals
    live in different homes: nest, hole, burrow, water, cowshed. Some eat plants, some eat other animals, some eat both.
  explanations:
    text: 'Plants and animals help each other. Trees give birds a home and fruit. Cows eat grass. Bees help flowers make fruit, and birds drop seeds that grow into new plants. Animals live in many homes: nests, holes, burrows and water.'
    visual: Draw a tree with a nest, a squirrel on a branch, a bee on a flower and a cow eating grass.
    step_by_step: 1. What does the animal get from the plant? 2. What does the plant get from the animal? 3. Where does the animal live?
    real_world: Elephants eat fruits and drop the seeds far away, helping forests grow.
  picture:
    kind: compare
    columns:
    - title: Plants give animals
      points:
      - food
      - shelter (homes)
    - title: Animals give plants
      points:
      - help with pollen (bees)
      - spread seeds (birds)
    alt: Plants give animals food and shelter; animals help plants by carrying pollen and spreading seeds.
  activity:
    type: sort
    prompt: Who helps whom?
    bins:
    - Plants help animals
    - Animals help plants
    items:
    - label: A tree gives a bird a home
      bin: Plants help animals
      clue: Who lives in the branches?
      why: The tree helps the bird.
    - label: Grass feeds a cow
      bin: Plants help animals
      clue: What does the cow eat?
      why: The grass helps the cow.
    - label: Fruit feeds a monkey
      bin: Plants help animals
      clue: Who eats it?
      why: The plant helps.
    - label: A bee carries pollen so fruit can grow
      bin: Animals help plants
      clue: Without bees, fewer fruits.
      why: The bee helps the plant.
    - label: A bird drops a seed that grows into a tree
      bin: Animals help plants
      clue: Seeds travel far.
      why: The bird helps.
    - label: An earthworm makes the soil soft
      bin: Animals help plants
      clue: Roots grow better.
      why: The worm helps.
  lesson:
    - teach: Animals need plants. Plants give food (grass for cows, fruit for monkeys, nectar for bees) and shelter (birds build nests in trees; squirrels live in tree holes).
      check:
        prompt: 'A bird builds its nest in a tree. The tree gives the bird:'
        options:
        - shelter
        - milk
        - medicine
        answer: shelter
        why: The tree is a safe place for the nest.
      ways:
      - style: visual
        teach: What a single tree gives to the animals that live around it.
        picture:
          kind: compare
          columns:
          - title: Food
            points:
            - Fruit for monkeys and bats
            - Nectar for bees
            - Leaves for caterpillars
          - title: Shelter
            points:
            - Nests for birds
            - Holes for squirrels and owls
            - Shade for cows and dogs
          alt: 'A tree gives food, such as fruit for monkeys and bats, nectar for bees and leaves for caterpillars. It also gives shelter: nests for birds, holes for squirrels and owls, and shade for cows and dogs.'
      - style: real_world
        teach: A big banyan tree in a village can be home to parrots, squirrels, ants and owls at the same time. In the afternoon, goats and people rest in its shade too.
    - teach: Plants need animals too. Bees carry pollen from flower to flower so fruits can form. Birds eat fruits and drop the seeds far away, where new plants grow. Animal dung makes the soil rich.
      picture:
        kind: compare
        columns:
        - title: Plants give animals
          points:
          - food
          - shelter
        - title: Animals give plants
          points:
          - pollen carried
          - seeds spread
          - rich soil from dung
        alt: What plants and animals give each other.
      check:
        prompt: How do birds help plants?
        options:
        - they spread seeds
        - they cut the stems
        - they pull out roots
        answer: they spread seeds
        why: Seeds in eaten fruit are dropped in new places.
      ways:
      - style: step_by_step
        teach: 'Follow a seed on its journey. Step 1: A bird eats a ripe fruit from a tree. Step 2: It flies far away. Step 3: It drops the seed in its droppings. Step 4: The seed falls on the soil and, with rain, grows into a new tree far from the first one.'
      - style: real_world
        teach: Farmers who grow mangoes, apples or mustard often keep beehives near their fields. More bees visiting the flowers means more fruits and seeds form.
    - teach: 'Animals eat different things. Some eat plants (cow, deer). Some eat other animals (tiger, lion). Some eat both (crow, bear). Animals also live in different homes: nests, burrows, holes, water, sheds.'
      check:
        prompt: 'A lion eats:'
        options:
        - other animals
        - only grass
        - only fruit
        answer: other animals
        why: Tigers hunt animals for food.
      ways:
      - style: visual
        teach: Animals sorted into groups by what they eat.
        picture:
          kind: compare
          columns:
          - title: Plants
            points:
            - Cow
            - Deer
            - Goat
          - title: Other animals
            points:
            - Tiger
            - Lion
            - Eagle
          - title: Both
            points:
            - Crow
            - Bear
            - Hen
          alt: A cow, a deer and a goat eat plants. A tiger, a lion and an eagle eat other animals. A crow, a bear and a hen eat both.
      - style: real_world
        teach: Some animals live in homes that they make, like a weaver bird's nest or a rabbit's burrow. Others, like cows and hens, live in sheds that people build for them.
  items:
  - prompt: Where does a bird usually live?
    options:
    - in a nest
    - in a burrow
    - in water
    - in a shell
    answer: in a nest
    difficulty: 1
    hints:
    - Made of twigs.
    - On a tree.
    solution: A bird lives in a nest.
    mistakes: {"in a burrow": "v3_nest"}
  - prompt: How do bees help plants?
    options:
    - they carry pollen from flower to flower
    - they eat the roots
    - they cut the leaves
    - they don't help
    answer: they carry pollen from flower to flower
    difficulty: 2
    hints:
    - They visit flowers.
    - Yellow dust.
    solution: Bees carry pollen, which helps make fruits.
    mistakes: {"they eat the roots": "v5_bees"}
  - prompt: 'A rabbit lives in a:'
    options:
    - burrow
    - nest
    - tree hole high up
    - pond
    answer: burrow
    difficulty: 1
    hints:
    - A hole in the ground.
    - Digs.
    solution: A rabbit lives in a burrow.
    mistakes: {"nest": "v3_burrow"}
  - prompt: 'A cow eats:'
    options:
    - grass and plants
    - meat
    - stones
    - plastic
    answer: grass and plants
    difficulty: 1
    hints:
    - It grazes.
    - Green.
    solution: A cow eats plants.
    mistakes: {"meat": "v3_cow_food"}
  - prompt: 'Birds help plants by:'
    options:
    - spreading seeds
    - eating all the leaves
    - pulling out roots
    - stopping rain
    answer: spreading seeds
    difficulty: 2
    hints:
    - They eat fruit and fly away.
    - Seeds drop.
    solution: Birds spread seeds.
    mistakes: {"eating all the leaves": "v5_seed_dispersal"}
  - prompt: 'A tiger eats:'
    options:
    - other animals
    - only grass
    - only fruits
    - soil
    answer: other animals
    difficulty: 1
    hints:
    - It hunts.
    - Sharp teeth.
    solution: A tiger eats other animals.
    mistakes: {"only grass": "v3_tiger_food"}
  - prompt: 'Cutting down a tree can harm animals because:'
    options:
    - they lose their homes and food
    - trees are noisy
    - animals hate shade
    - it has no effect
    answer: they lose their homes and food
    difficulty: 2
    hints:
    - Who lives in the tree?
    - Nests, fruit.
    solution: Animals lose homes and food.
    mistakes:
      it has no effect: c3v_think
  - prompt: Which animal lives in a shed made by people?
    options:
    - a cow
    - a fish
    - a sparrow
    answer: a cow
    difficulty: 1
    hints:
    - Farmers build it.
    - Which animal gives milk at home?
    solution: 'Step 1: Farmers keep cows in a cowshed. Step 2: So the cow.'
    mistakes:
      a fish: c3v5_home
      a sparrow: c3v5_home
  - prompt: A monkey eats a mango and throws the seed far away. A new mango tree grows there. How did the monkey help?
    options:
    - it spread the seed
    - it watered the tree
    - it cut the roots
    answer: it spread the seed
    difficulty: 2
    hints:
    - Where did the new tree grow?
    - What did the monkey carry there?
    solution: 'Step 1: The seed was carried to a new place. Step 2: The monkey spread the seed.'
    mistakes:
      it watered the tree: c3v5_give
      it cut the roots: c3v5_give
  - prompt: Which animal eats both plants and animals?
    options:
    - crow
    - cow
    - goat
    answer: crow
    difficulty: 2
    hints:
    - Cows and goats graze on plants.
    - Which one eats almost anything?
    solution: 'Step 1: Cows and goats eat plants. Step 2: A crow eats grain, fruit and insects.'
    mistakes:
      cow: c3v5_eat
      goat: c3v5_eat
  - prompt: 'Fish live in:'
    options:
    - water
    - burrows
    - nests
    answer: water
    difficulty: 1
    hints:
    - How do fish move?
    - They swim.
    solution: 'Step 1: Fish swim and breathe in water. Step 2: Water is their home.'
    mistakes:
      burrows: c3v5_home
      nests: c3v5_home
  - prompt: How does cow dung help plants?
    options:
    - it makes the soil rich
    - it scares birds away
    - it makes leaves fall
    answer: it makes the soil rich
    difficulty: 2
    hints:
    - Farmers put it in their fields.
    - What does it add to soil?
    solution: 'Step 1: Dung breaks down in soil. Step 2: It makes the soil rich so plants grow well.'
    mistakes:
      it scares birds away: c3v5_give
      it makes leaves fall: c3v5_give
  - prompt: A frog can live both in water and on land. Where is it often found?
    options:
    - near ponds
    - in deserts far from water
    - in tree nests
    answer: near ponds
    difficulty: 2
    hints:
    - It needs water nearby.
    - Listen for it in the rainy season.
    solution: 'Step 1: Frogs need water to stay wet and lay eggs. Step 2: They live near ponds.'
    mistakes:
      in deserts far from water: c3v5_home
      in tree nests: c3v5_home
  - prompt: 'A deer eats:'
    options:
    - grass and leaves
    - other animals
    - fish
    answer: grass and leaves
    difficulty: 1
    hints:
    - Deer graze in forests.
    - They do not hunt.
    solution: 'Step 1: Deer graze. Step 2: They eat grass and leaves.'
    mistakes:
      other animals: c3v5_eat
      fish: c3v5_eat
  - prompt: 'A squirrel lives in a tree hole and eats nuts from the tree. The tree gives the squirrel:'
    options:
    - food and shelter
    - only water
    - nothing
    answer: food and shelter
    difficulty: 3
    hints:
    - Where does it live?
    - What does it eat?
    solution: 'Step 1: The hole is shelter. Step 2: The nuts are food.'
    mistakes:
      only water: c3v5_give
      nothing: c3v5_give
  - prompt: 'Case: A village cuts down a large patch of trees to make a new road. A few months later, villagers notice fewer birds, fewer bees, and their fruit trees give less fruit. Why?'
    options:
    - Birds and bees lost their homes and food, and fewer bees means fewer fruits form
    - The road made the fruit taste bad
    - Birds and bees do not need trees, so it must be the weather
    answer: Birds and bees lost their homes and food, and fewer bees means fewer fruits form
    hints:
    - What did the trees give to birds and bees?
    - How do bees help fruit trees?
    solution: Trees gave birds and bees food and shelter. With fewer bees carrying pollen from flower to flower, fewer fruits form on the village fruit trees.
    mistakes:
      The road made the fruit taste bad: c3v5_give
      Birds and bees do not need trees, so it must be the weather: c3v5_give
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your school garden has many flowers but very few fruits on its plants. Which idea would help most?'
    options:
    - Grow more flowering plants and avoid sprays that kill bees and butterflies
    - Cut off all the flowers
    - Cover every flower with plastic bags
    answer: Grow more flowering plants and avoid sprays that kill bees and butterflies
    hints:
    - Who carries pollen from flower to flower?
    - What would keep those visitors coming?
    solution: Bees and butterflies carry pollen so that fruits can form. More flowers and no harmful sprays bring more of them to the garden.
    mistakes:
      Cut off all the flowers: c3v5_give
      Cover every flower with plastic bags: c3v5_give
    exam: competency
    difficulty: 2
