# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 12
title: Taking Charge of Waste
tips:
  v3_cloth_bag: "Choose a bag that can be used again and again for years."
  v3_compost: "Peels and leftovers rot in a pit and turn into rich soil."
  c3v12_type: 'Ask: will it rot in soil in a few weeks (wet), or stay as it is (dry)?'
  c3v12_r: "Think of the three Rs: using less, using something again as it is, or making something new from old."
  c3v12_harm: 'Think where the waste ends up: in the air, the drain, the soil, or an animal''s stomach?'

concepts:
- code: cbse3v.waste.waste
  title: Taking Charge of Waste
  notes: |
    Waste: wet (kitchen peels, leftover food; can become compost) and dry (paper, plastic, glass, metal; can be recycled).
    Put them in separate bins: green for wet, blue for dry. Reduce (use less), reuse (use again: jars, bags), recycle
    (make new things from old). Avoid plastic bags; carry a cloth bag. Don't litter or burn waste.
  explanations:
    text: 'Waste is what we throw away. Wet waste like peels and leftover food can become compost for plants. Dry waste like paper and plastic can be recycled. Put them in separate bins, and remember: reduce, reuse, recycle.'
    visual: Draw a green bin with vegetable peels and a blue bin with paper and a plastic bottle.
    step_by_step: 1. Is it wet or dry waste? 2. Can I reuse it? 3. Put it in the right bin.
    real_world: Many cities ask families to keep wet and dry waste separate for collection.
  picture:
    kind: compare
    columns:
    - title: Wet waste (green bin)
      points:
      - vegetable peels
      - leftover food
    - title: Dry waste (blue bin)
      points:
      - paper
      - plastic bottle
    alt: Wet waste like peels and leftover food goes in the green bin; dry waste like paper and plastic bottles goes in the blue bin.
  activity:
    type: sort
    prompt: Which bin does it go in?
    bins:
    - Wet waste (compost)
    - Dry waste (recycle)
    items:
    - label: Banana peel
      bin: Wet waste (compost)
      clue: It rots and becomes soil food.
      why: Wet waste.
    - label: Leftover rice
      bin: Wet waste (compost)
      clue: Food that rots.
      why: Wet waste.
    - label: Tea leaves
      bin: Wet waste (compost)
      clue: Used and soggy.
      why: Wet waste.
    - label: Dry leaves from the garden
      bin: Wet waste (compost)
      clue: They rot into compost.
      why: Goes to compost.
    - label: Old newspaper
      bin: Dry waste (recycle)
      clue: Can be made into new paper.
      why: Dry waste.
    - label: Plastic bottle
      bin: Dry waste (recycle)
      clue: Never rots.
      why: Dry waste.
    - label: Empty tin can
      bin: Dry waste (recycle)
      clue: Metal can be melted again.
      why: Dry waste.
  lesson:
    - teach: 'Waste is what we throw away. Wet waste is from the kitchen: peels, leftover food, tea leaves. It rots and can become compost (rich soil). Dry waste is paper, plastic, glass and metal. It can often be recycled.'
      picture:
        kind: compare
        columns:
        - title: Wet (green bin)
          points:
          - peels
          - leftover food
          - tea leaves
        - title: Dry (blue bin)
          points:
          - paper
          - plastic
          - glass
          - metal
        alt: Wet waste goes in the green bin, dry waste in the blue bin.
      check:
        prompt: 'Tea leaves after making tea are:'
        options:
        - wet waste
        - dry waste
        - not waste
        answer: wet waste
        why: They come from the kitchen and rot in soil.
      ways:
      - style: step_by_step
        teach: 'Make compost at home. Step 1: Put peels, tea leaves and leftover vegetables in a pot with holes. Step 2: Cover each layer with dry leaves or soil. Step 3: Keep it damp and mix it once a week. Step 4: After about two months, it turns into dark, rich compost.'
      - style: real_world
        teach: A scrap dealer who comes to the door buys old newspapers, bottles and tins. They are sent to factories where they are made into new things. That is dry waste being recycled.
    - teach: 'Keep wet and dry waste in separate bins: green for wet, blue for dry. Then wet waste can become compost, and dry waste can be sorted and recycled.'
      check:
        prompt: Which bin is for a plastic bottle?
        options:
        - blue (dry)
        - green (wet)
        - no bin, the road
        answer: blue (dry)
        why: Plastic does not rot; it is dry waste.
      ways:
      - style: visual
        teach: Which coloured bin each kind of waste should go in.
        picture:
          kind: compare
          columns:
          - title: Green bin (wet)
            points:
            - Fruit peels
            - Leftover food
            - Tea leaves
            - Flowers
          - title: Blue bin (dry)
            points:
            - Paper
            - Plastic bottles
            - Glass jars
            - Tins
          alt: 'The green bin is for wet waste: fruit peels, leftover food, tea leaves and flowers. The blue bin is for dry waste: paper, plastic bottles, glass jars and tins.'
      - style: real_world
        teach: When wet and dry waste are mixed, the paper gets soggy and smelly, and it can no longer be recycled. Keeping them apart from the start saves both.
    - teach: 'The three Rs help: Reduce (use less, like a cloth bag instead of plastic bags), Reuse (use again, like an old jar for pencils), Recycle (make new things from old, like new paper from old paper). Never litter or burn waste.'
      check:
        prompt: 'Using an old tin as a pen stand is:'
        options:
        - reuse
        - litter
        - burning
        answer: reuse
        why: The tin is used again as it is.
      ways:
      - style: visual
        teach: The three Rs, each with an example you can do at home.
        picture:
          kind: compare
          columns:
          - title: Reduce
            points:
            - Use less
            - Carry a cloth bag
          - title: Reuse
            points:
            - Use again
            - Old jar for pencils
          - title: Recycle
            points:
            - Make new from old
            - Old paper into new paper
          alt: Reduce means use less, like carrying a cloth bag. Reuse means use again, like an old jar for pencils. Recycle means making new things from old, like old paper into new paper.
      - style: real_world
        teach: Some schools hold a book swap at the end of the year. Children give away last year's books to younger children, so the books are used again instead of thrown away.
  items:
  - prompt: 'Banana peels are:'
    options:
    - wet waste
    - dry waste
    - not waste
    - metal
    answer: wet waste
    difficulty: 1
    hints:
    - From the kitchen.
    - They rot.
    solution: Peels are wet waste.
    mistakes: {"dry waste": "v5_wet_waste"}
  - prompt: 'An old newspaper is:'
    options:
    - dry waste
    - wet waste
    - food
    - compost
    answer: dry waste
    difficulty: 1
    hints:
    - Paper.
    - It does not rot fast.
    solution: Newspaper is dry waste.
    mistakes: {"wet waste": "v5_dry_waste"}
  - prompt: 'Wet waste can be turned into:'
    options:
    - compost for plants
    - plastic
    - glass
    - metal
    answer: compost for plants
    difficulty: 2
    hints:
    - It rots into soil.
    - Plant food.
    solution: Wet waste becomes compost.
    mistakes: {"plastic": "v3_compost"}
  - prompt: 'Using a glass jar again to store things is:'
    options:
    - reusing
    - littering
    - burning
    - wasting
    answer: reusing
    difficulty: 1
    hints:
    - Use again.
    - Re-use.
    solution: That is reusing.
    mistakes: {"littering": "v4_reuse"}
  - prompt: 'Instead of plastic bags, we can carry:'
    options:
    - a cloth bag
    - more plastic bags
    - nothing ever
    - a paper plate
    answer: a cloth bag
    difficulty: 1
    hints:
    - It can be used many times.
    - Cotton.
    solution: Carry a cloth bag.
    mistakes: {"more plastic bags": "v3_cloth_bag"}
  - prompt: Why should we not burn waste?
    options:
    - "the smoke harms our health and air"
    - "burning it makes the waste bigger"
    - "it is far too cold to burn waste"
    - "burning waste is always good"
    answer: the smoke harms our health and air
    difficulty: 2
    hints:
    - Think of smoke.
    - Breathing.
    solution: Smoke from burning waste harms health and air.
    mistakes:
      "burning waste is always good": c3v_think
  - prompt: 'Making new paper from old paper is:'
    options:
    - recycling
    - reducing
    - littering
    - composting
    answer: recycling
    difficulty: 2
    hints:
    - Re-cycle.
    - Made into something new.
    solution: That is recycling.
    mistakes: {"reducing": "v5_recycle"}
  - prompt: Which of these is dry waste?
    options:
    - an empty juice can
    - a mango peel
    - leftover rice
    answer: an empty juice can
    difficulty: 1
    hints:
    - Which one will not rot?
    - Metal stays as it is.
    solution: 'Step 1: Peels and rice rot. Step 2: A metal can is dry waste.'
    mistakes:
      a mango peel: c3v12_type
      leftover rice: c3v12_type
  - prompt: 'Compost is made from:'
    options:
    - "wet waste like peels and leaves"
    - "old plastic bags and wrappers"
    - "empty glass bottles and jars"
    answer: wet waste like peels and leaves
    difficulty: 1
    hints:
    - Compost is rich soil.
    - What rots into soil?
    solution: 'Step 1: Wet waste rots. Step 2: It becomes compost.'
    mistakes:
      "old plastic bags and wrappers": c3v12_type
      "empty glass bottles and jars": c3v12_type
  - prompt: 'Switching off a fan when leaving the room and buying less packaged food are ways to:'
    options:
    - reduce
    - litter
    - burn
    answer: reduce
    difficulty: 2
    hints:
    - Both mean using less.
    - Which R is 'use less'?
    solution: 'Step 1: Both use less. Step 2: That is reducing.'
    mistakes:
      litter: c3v12_r
      burn: c3v12_r
  - prompt: Why is plastic harmful when thrown on the ground?
    options:
    - "it does not rot and animals may eat it"
    - "it turns into compost very quickly"
    - "it makes the plants grow taller"
    answer: it does not rot and animals may eat it
    difficulty: 2
    hints:
    - How long does plastic last?
    - Cows sometimes eat from garbage.
    solution: 'Step 1: Plastic stays for many years. Step 2: Animals may swallow it and get sick.'
    mistakes:
      "it turns into compost very quickly": c3v12_harm
      "it makes the plants grow taller": c3v12_type
  - prompt: 'Old clothes that still fit someone can be:'
    options:
    - "given to someone who needs them"
    - "burnt in a fire in the backyard"
    - "thrown into a drain on the road"
    answer: given to someone who needs them
    difficulty: 1
    hints:
    - They can still be worn.
    - Who could use them?
    solution: 'Step 1: The clothes are still good. Step 2: Giving them away lets them be reused.'
    mistakes:
      "burnt in a fire in the backyard": c3v12_harm
      "thrown into a drain on the road": c3v12_harm
  - prompt: 'Throwing waste into drains can cause:'
    options:
    - "blocked drains and dirty, flooded streets"
    - "clean water flowing through the town"
    - "more trees growing along the roads"
    answer: blocked drains and dirty, flooded streets
    difficulty: 2
    hints:
    - Drains carry rainwater away.
    - What if they are stuffed with waste?
    solution: 'Step 1: Waste blocks the drain. Step 2: Water cannot flow and streets flood.'
    mistakes:
      "clean water flowing through the town": c3v12_harm
      "more trees growing along the roads": c3v12_harm
  - prompt: Which bin should vegetable peels go in?
    options:
    - green (wet)
    - blue (dry)
    - no bin, the street
    answer: green (wet)
    difficulty: 1
    hints:
    - Do peels rot?
    - Wet waste bin colour.
    solution: 'Step 1: Peels rot, so they are wet waste. Step 2: Green bin.'
    mistakes:
      blue (dry): c3v12_type
      no bin, the street: c3v12_harm
  - prompt: A class makes 6 bags of waste a week. By reusing and reducing, it makes 2 fewer. How many bags now?
    answer: '4'
    check: 6-2
    difficulty: 3
    hints:
    - Fewer means take away.
    - 6 − 2.
    solution: 'Step 1: 6 − 2. Step 2: = 4 bags a week.'
    mistakes:
      '8': c3v12_r
      '3': c3v12_r
  - prompt: 'Case: A family throws everything into one dustbin: vegetable peels, milk packets, newspaper and leftover rice. The bin smells, and nothing gets recycled. What should they change?'
    options:
    - "Keep two bins: one for wet waste like peels and rice, one for dry waste like packets and paper"
    - "Burn the waste in the backyard every evening so the dustbin does not get full"
    - "Throw the waste into the drain outside the house so the dustbin stays empty"
    answer: 'Keep two bins: one for wet waste like peels and rice, one for dry waste like packets and paper'
    hints:
    - Which waste rots, and which does not?
    - What happens to paper mixed with wet food?
    solution: Wet waste rots and can become compost; dry waste can be sorted and recycled. Two separate bins keep both useful.
    mistakes:
      "Burn the waste in the backyard every evening so the dustbin does not get full": c3v12_harm
      "Throw the waste into the drain outside the house so the dustbin stays empty": c3v12_harm
    exam: case
    difficulty: 2
  - prompt: 'Situation: You have an empty plastic bottle after a school sports day. Which is a way to reuse it?'
    options:
    - "Cut it and use it as a pot for a small plant"
    - "Throw it on the playground after the race"
    - "Burn it in a fire along with other rubbish"
    answer: Cut it and use it as a pot for a small plant
    hints:
    - Reuse means using something again for a new job.
    - Which choice does not harm the ground or air?
    solution: Using the bottle again as a plant pot is reusing it. Throwing or burning plastic harms the ground and the air.
    mistakes:
      "Throw it on the playground after the race": c3v12_r
      "Burn it in a fire along with other rubbish": c3v12_harm
    exam: competency
    difficulty: 2
