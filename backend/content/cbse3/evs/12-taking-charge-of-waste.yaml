# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 12
title: Taking Charge of Waste
concepts:
- code: cbse3v.waste.waste
  title: Taking Charge of Waste
  notes: |
    Waste: wet (kitchen peels, leftover food; can become compost) and dry (paper, plastic, glass, metal; can be recycled).
    Put them in separate bins: green for wet, blue for dry. Reduce (use less), reuse (use again: jars, bags), recycle
    (make new things from old). Avoid plastic bags; carry a cloth bag. Don't litter or burn waste.
  explanations:
    text: 'Waste is what we throw away. Wet waste like peels and leftover food can become compost for plants. Dry waste like paper and plastic can be recycled. Put them in separate bins, and remember: reduce, reuse, recycle.'
    visual: Draw a green bin with vegetable peels and a blue bin with paper and a plastic bottle.
    step_by_step: 1. Is it wet or dry waste? 2. Can I reuse it? 3. Put it in the right bin.
    real_world: Many cities ask families to keep wet and dry waste separate for collection.
  picture:
    kind: compare
    columns:
    - title: Wet waste (green bin)
      points:
      - vegetable peels
      - leftover food
    - title: Dry waste (blue bin)
      points:
      - paper
      - plastic bottle
    alt: Wet waste like peels and leftover food goes in the green bin; dry waste like paper and plastic bottles goes in the blue bin.
  items:
  - prompt: 'Banana peels are:'
    options:
    - wet waste
    - dry waste
    - not waste
    - metal
    answer: wet waste
    difficulty: 1
    hints:
    - From the kitchen.
    - They rot.
    solution: Peels are wet waste.
  - prompt: 'An old newspaper is:'
    options:
    - dry waste
    - wet waste
    - food
    - compost
    answer: dry waste
    difficulty: 1
    hints:
    - Paper.
    - It does not rot fast.
    solution: Newspaper is dry waste.
  - prompt: 'Wet waste can be turned into:'
    options:
    - compost for plants
    - plastic
    - glass
    - metal
    answer: compost for plants
    difficulty: 2
    hints:
    - It rots into soil.
    - Plant food.
    solution: Wet waste becomes compost.
  - prompt: 'Using a glass jar again to store things is:'
    options:
    - reusing
    - littering
    - burning
    - wasting
    answer: reusing
    difficulty: 1
    hints:
    - Use again.
    - Re-use.
    solution: That is reusing.
  - prompt: 'Instead of plastic bags, we can carry:'
    options:
    - a cloth bag
    - more plastic bags
    - nothing ever
    - a paper plate
    answer: a cloth bag
    difficulty: 1
    hints:
    - It can be used many times.
    - Cotton.
    solution: Carry a cloth bag.
  - prompt: Why should we not burn waste?
    options:
    - the smoke harms our health and air
    - it makes waste bigger
    - it is too cold
    - burning is good
    answer: the smoke harms our health and air
    difficulty: 2
    hints:
    - Think of smoke.
    - Breathing.
    solution: Smoke from burning waste harms health and air.
    mistakes:
      burning is good: c3v_think
  - prompt: 'Making new paper from old paper is:'
    options:
    - recycling
    - reducing
    - littering
    - composting
    answer: recycling
    difficulty: 2
    hints:
    - Re-cycle.
    - Made into something new.
    solution: That is recycling.
