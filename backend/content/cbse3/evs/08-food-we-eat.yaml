# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 8
title: Food We Eat
tips:
  v3_food_waste: "Farmers work for months to grow food, and many people go hungry."
  v3_idli: "Idli and dosa are made of rice and dal, eaten for breakfast in Kerala and Tamil Nadu."
  v3_milk: "Milk comes from mother animals on a dairy farm."
  v3_rice_plant: "Rice grows in wet green fields."
  c3v8_from: 'Trace the food back: did it grow on a plant or come from an animal?'
  c3v8_place: 'Think what grows well there: lots of rain and rivers, or dry wheat fields?'
  c3v8_habit: 'Ask: which choice keeps germs and waste away from food?'

concepts:
- code: cbse3v.food.food
  title: Food We Eat
  notes: |
    Food comes from plants (rice, wheat, dal, vegetables, fruits) and animals (milk, eggs, fish, meat). Different regions eat
    different food: rice and fish in Kerala and Bengal, roti in Punjab, idli-dosa in the south. Eat a mix of foods (a
    balanced plate); wash hands before eating; don't waste food; cooked food should be covered.
  explanations:
    text: Our food comes from plants and animals. Rice, dal, fruits and vegetables come from plants. Milk, eggs and fish come from animals. People in different places eat different food. Eating a mix of foods keeps us healthy.
    visual: 'Draw a plate divided into parts: rice or roti, dal, vegetables, a fruit and a glass of milk.'
    step_by_step: 1. Name the food. 2. Does it come from a plant or an animal? 3. Is my plate a healthy mix?
    real_world: In Kerala, a meal of rice and fish curry on a banana leaf is common; in Punjab, roti and sarson ka saag.
  picture:
    kind: compare
    columns:
    - title: From plants
      points:
      - rice
      - dal
      - banana
    - title: From animals
      points:
      - milk
      - egg
      - fish
    alt: Rice, dal and bananas come from plants; milk, eggs and fish come from animals.
  activity:
    type: sort
    prompt: Does it come from a plant or an animal?
    bins:
    - From plants
    - From animals
    items:
    - label: Rice
      bin: From plants
      clue: Grows in fields.
      why: A plant.
    - label: Dal
      bin: From plants
      clue: Seeds of a plant.
      why: A plant.
    - label: Banana
      bin: From plants
      clue: Grows on a tree.
      why: A plant.
    - label: Spinach
      bin: From plants
      clue: Green leaves.
      why: A plant.
    - label: Milk
      bin: From animals
      clue: From cows and buffaloes.
      why: An animal.
    - label: Eggs
      bin: From animals
      clue: From hens.
      why: An animal.
    - label: Honey
      bin: From animals
      clue: Made by bees.
      why: An animal.
    - label: Fish
      bin: From animals
      clue: From the sea or rivers.
      why: An animal.
  lesson:
    - teach: 'Our food comes from plants and animals. From plants: rice, wheat, dal, vegetables, fruits, oil, sugar. From animals: milk, curd, eggs, fish, meat, honey.'
      picture:
        kind: compare
        columns:
        - title: From plants
          points:
          - rice
          - wheat
          - dal
          - fruits
        - title: From animals
          points:
          - milk
          - eggs
          - fish
          - honey
        alt: Foods that come from plants and foods that come from animals.
      check:
        prompt: 'Curd comes from:'
        options:
        - an animal
        - a plant
        - a stone
        answer: an animal
        why: Curd is made from milk, which comes from cows or buffaloes.
      ways:
      - style: step_by_step
        teach: 'Sort your lunch box. Step 1: Take out each food. Step 2: Ask: did it come from a plant or an animal? Step 3: Roti, rice and vegetables go in the plant group. Step 4: Curd, egg or paneer go in the animal group.'
      - style: real_world
        teach: 'A cup of tea has both plant and animal food in it: tea leaves and sugar come from plants, and milk comes from a cow or buffalo.'
    - teach: 'Different places eat different food, often what grows nearby. Kerala and Bengal have rain and rivers: rice and fish. Punjab grows wheat: roti. South India loves idli and dosa made from rice and dal.'
      check:
        prompt: 'Roti is a main food in Punjab because Punjab grows a lot of:'
        options:
        - wheat
        - coconut
        - tea
        answer: wheat
        why: Roti is made from wheat flour.
      ways:
      - style: visual
        teach: Foods people eat in different parts of India, and why.
        picture:
          kind: compare
          columns:
          - title: Kerala and Bengal
            points:
            - Lots of rain and rivers
            - Rice and fish
          - title: Punjab
            points:
            - Wheat fields
            - Roti and paratha
          - title: South India
            points:
            - Rice and dal
            - Idli and dosa
          alt: Kerala and Bengal have lots of rain and rivers, so people eat rice and fish. Punjab has wheat fields, so people eat roti and paratha. In South India, rice and dal are made into idli and dosa.
      - style: real_world
        teach: Near the sea, fishing boats bring in fresh fish every morning, so fish is a big part of meals there. In the hills, people eat more of what grows on their slopes, like corn and millets.
    - teach: 'Good food habits: eat a mix of foods (a balanced plate), wash hands before eating, cover cooked food, and do not waste food.'
      check:
        prompt: Why should cooked food be covered?
        options:
        - to keep flies and dust away
        - to make it cold
        - to make it taste salty
        answer: to keep flies and dust away
        why: Flies and dust carry germs.
      ways:
      - style: visual
        teach: A balanced plate has a mix of different kinds of foods.
        picture:
          kind: compare
          columns:
          - title: Grains
            points:
            - Rice
            - Roti
          - title: Dal and milk
            points:
            - Dal
            - Curd
          - title: Vegetables and fruit
            points:
            - Spinach
            - Banana
          alt: A balanced plate has grains like rice or roti, dal and milk foods like curd, and vegetables and fruit like spinach and a banana.
      - style: step_by_step
        teach: 'Get ready for a meal. Step 1: Wash your hands with soap. Step 2: Take only as much food as you can eat. Step 3: Eat slowly and chew well. Step 4: Cover the food that is left and keep it safely.'
  items:
  - prompt: 'Milk comes from:'
    options:
    - animals like cows and buffaloes
    - trees
    - rice fields
    - rocks
    answer: animals like cows and buffaloes
    difficulty: 1
    hints:
    - Who gives milk?
    - Cows.
    solution: Milk comes from animals.
    mistakes: {"trees": "v3_milk"}
  - prompt: 'Rice comes from:'
    options:
    - a plant
    - a hen
    - a fish
    - a cow
    answer: a plant
    difficulty: 1
    hints:
    - It grows in fields.
    - Paddy.
    solution: Rice comes from a plant.
    mistakes: {"a hen": "v3_rice_plant"}
  - prompt: Which food comes from an animal?
    options:
    - egg
    - potato
    - apple
    - wheat
    answer: egg
    difficulty: 1
    hints:
    - Hens lay them.
    - Animal.
    solution: Eggs come from hens.
    mistakes: {"potato": "v5_animal_food"}
  - prompt: What should you do before eating?
    options:
    - wash your hands
    - play in mud
    - touch the dustbin
    - nothing
    answer: wash your hands
    difficulty: 1
    hints:
    - Germs.
    - Soap and water.
    solution: Wash your hands before eating.
    mistakes: {"play in mud": "v5_handwash"}
  - prompt: 'A healthy plate has:'
    options:
    - a mix of grains, dal, vegetables and fruit
    - only sweets
    - only chips
    - only one food every day
    answer: a mix of grains, dal, vegetables and fruit
    difficulty: 2
    hints:
    - Different foods give different help.
    - Mix.
    solution: A healthy plate has a mix of foods.
    mistakes:
      only sweets: c3v_think
  - prompt: 'Idli and dosa are common in:'
    options:
    - South India
    - only the North Pole
    - the desert only
    - nowhere
    answer: South India
    difficulty: 1
    hints:
    - Tamil Nadu, Kerala, Karnataka.
    - Breakfast.
    solution: Idli and dosa are common in South India.
    mistakes: {"only the North Pole": "v3_idli"}
  - prompt: Why should we not waste food?
    options:
    - many people do not have enough, and farmers work hard to grow it
    - food grows on its own
    - wasting is fun
    - food has no value
    answer: many people do not have enough, and farmers work hard to grow it
    difficulty: 2
    hints:
    - Who grows food?
    - Who goes hungry?
    solution: Food takes hard work, and many people are hungry.
    mistakes: {"food grows on its own": "v3_food_waste"}
  - prompt: 'Honey comes from:'
    options:
    - bees
    - cows
    - trees directly
    answer: bees
    difficulty: 1
    hints:
    - It is made in a hive.
    - A tiny buzzing insect.
    solution: 'Step 1: Bees collect nectar. Step 2: They make honey in hives.'
    mistakes:
      cows: c3v8_from
      trees directly: c3v8_from
  - prompt: Which food comes from a plant?
    options:
    - dal
    - egg
    - fish
    answer: dal
    difficulty: 1
    hints:
    - Dal is made from seeds called pulses.
    - Seeds grow on plants.
    solution: 'Step 1: Dal is from pulses. Step 2: Pulses grow on plants.'
    mistakes:
      egg: c3v8_from
      fish: c3v8_from
  - prompt: 'Idli and dosa are made from:'
    options:
    - rice and urad dal
    - wheat and sugar
    - milk and eggs
    answer: rice and urad dal
    difficulty: 2
    hints:
    - They are from South India.
    - Rice is a main grain there.
    solution: 'Step 1: The batter is ground rice and dal. Step 2: So rice and urad dal.'
    mistakes:
      wheat and sugar: c3v8_place
      milk and eggs: c3v8_from
  - prompt: Which food comes from both a plant and an animal in one dish?
    options:
    - kheer made with rice and milk
    - plain boiled rice
    - a raw apple
    answer: kheer made with rice and milk
    difficulty: 3
    hints:
    - Look for a dish with two main foods.
    - Which one has milk in it?
    solution: 'Step 1: Rice is from a plant; milk is from an animal. Step 2: Kheer has both.'
    mistakes:
      plain boiled rice: c3v8_from
      a raw apple: c3v8_from
  - prompt: 'A balanced plate has:'
    options:
    - a mix of grains, dal, vegetables and fruit
    - only sweets
    - only chips
    answer: a mix of grains, dal, vegetables and fruit
    difficulty: 1
    hints:
    - Balanced means a bit of everything good.
    - Not just one food.
    solution: 'Step 1: The body needs many kinds of food. Step 2: A mix makes a balanced plate.'
    mistakes:
      only sweets: c3v8_habit
      only chips: c3v8_habit
  - prompt: 'In Kerala, many people eat rice and fish because Kerala has:'
    options:
    - lots of rain, rivers and a sea coast
    - deserts
    - snowy mountains everywhere
    answer: lots of rain, rivers and a sea coast
    difficulty: 2
    hints:
    - Rice needs lots of water.
    - Fish live in water.
    solution: 'Step 1: Rain helps rice grow. Step 2: The sea and rivers give fish.'
    mistakes:
      deserts: c3v8_place
      snowy mountains everywhere: c3v8_place
  - prompt: What is the best thing to do with leftover food at home?
    options:
    - store it well and eat it later or share it
    - throw it on the road
    - leave it open overnight
    answer: store it well and eat it later or share it
    difficulty: 2
    hints:
    - Food should not be wasted.
    - But it must stay safe.
    solution: 'Step 1: Do not waste food. Step 2: Store it safely and eat it or share it.'
    mistakes:
      throw it on the road: c3v8_habit
      leave it open overnight: c3v8_habit
  - prompt: 'Rice grows in fields that are often:'
    options:
    - full of water
    - dry and sandy
    - covered in snow
    answer: full of water
    difficulty: 2
    hints:
    - Rice plants like their feet wet.
    - Think of green flooded fields.
    solution: 'Step 1: Rice needs lots of water. Step 2: Its fields are often flooded.'
    mistakes:
      dry and sandy: c3v8_place
      covered in snow: c3v8_place
  - prompt: 'Case: After a birthday party at school, lots of uneaten rice and sabzi is left over. Some children want to throw it in the bin. What would be the best thing to do?'
    options:
    - Cover it, keep it cool, and share it with people who need food
    - Throw it in the bin quickly
    - Leave it open on the table till tomorrow
    answer: Cover it, keep it cool, and share it with people who need food
    hints:
    - Why should we not waste food?
    - How can food be kept safe to eat?
    solution: Farmers work hard to grow food, and many people do not have enough. Covering it, keeping it cool and sharing it stops waste.
    mistakes:
      Throw it in the bin quickly: c3v8_habit
      Leave it open on the table till tomorrow: c3v8_habit
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making a poster of foods from animals. Which set belongs on it?'
    options:
    - Milk, egg and honey
    - Rice, dal and banana
    - Wheat, sugar and oil
    answer: Milk, egg and honey
    hints:
    - Which foods are given by cows, hens and bees?
    - Which foods grow on plants?
    solution: Milk comes from cows, eggs from hens and honey from bees. Rice, dal, banana, wheat, sugar and oil come from plants.
    mistakes:
      Rice, dal and banana: c3v8_from
      Wheat, sugar and oil: c3v8_from
    exam: competency
    difficulty: 2
