# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 8
title: Food We Eat
tips:
  v3_food_waste: "Farmers work for months to grow food, and many people go hungry."
  v3_idli: "Idli and dosa are made of rice and dal, eaten for breakfast in Kerala and Tamil Nadu."
  v3_milk: "Milk comes from mother animals on a dairy farm."
  v3_rice_plant: "Rice grows in wet green fields."

concepts:
- code: cbse3v.food.food
  title: Food We Eat
  notes: |
    Food comes from plants (rice, wheat, dal, vegetables, fruits) and animals (milk, eggs, fish, meat). Different regions eat
    different food: rice and fish in Kerala and Bengal, roti in Punjab, idli-dosa in the south. Eat a mix of foods (a
    balanced plate); wash hands before eating; don't waste food; cooked food should be covered.
  explanations:
    text: Our food comes from plants and animals. Rice, dal, fruits and vegetables come from plants. Milk, eggs and fish come from animals. People in different places eat different food. Eating a mix of foods keeps us healthy.
    visual: 'Draw a plate divided into parts: rice or roti, dal, vegetables, a fruit and a glass of milk.'
    step_by_step: 1. Name the food. 2. Does it come from a plant or an animal? 3. Is my plate a healthy mix?
    real_world: In Kerala, a meal of rice and fish curry on a banana leaf is common; in Punjab, roti and sarson ka saag.
  picture:
    kind: compare
    columns:
    - title: From plants
      points:
      - rice
      - dal
      - banana
    - title: From animals
      points:
      - milk
      - egg
      - fish
    alt: Rice, dal and bananas come from plants; milk, eggs and fish come from animals.
  activity:
    type: sort
    prompt: Does it come from a plant or an animal?
    bins:
    - From plants
    - From animals
    items:
    - label: Rice
      bin: From plants
      clue: Grows in fields.
      why: A plant.
    - label: Dal
      bin: From plants
      clue: Seeds of a plant.
      why: A plant.
    - label: Banana
      bin: From plants
      clue: Grows on a tree.
      why: A plant.
    - label: Spinach
      bin: From plants
      clue: Green leaves.
      why: A plant.
    - label: Milk
      bin: From animals
      clue: From cows and buffaloes.
      why: An animal.
    - label: Eggs
      bin: From animals
      clue: From hens.
      why: An animal.
    - label: Honey
      bin: From animals
      clue: Made by bees.
      why: An animal.
    - label: Fish
      bin: From animals
      clue: From the sea or rivers.
      why: An animal.
  items:
  - prompt: 'Milk comes from:'
    options:
    - animals like cows and buffaloes
    - trees
    - rice fields
    - rocks
    answer: animals like cows and buffaloes
    difficulty: 1
    hints:
    - Who gives milk?
    - Cows.
    solution: Milk comes from animals.
    mistakes: {"trees": "v3_milk"}
  - prompt: 'Rice comes from:'
    options:
    - a plant
    - a hen
    - a fish
    - a cow
    answer: a plant
    difficulty: 1
    hints:
    - It grows in fields.
    - Paddy.
    solution: Rice comes from a plant.
    mistakes: {"a hen": "v3_rice_plant"}
  - prompt: Which food comes from an animal?
    options:
    - egg
    - potato
    - apple
    - wheat
    answer: egg
    difficulty: 1
    hints:
    - Hens lay them.
    - Animal.
    solution: Eggs come from hens.
    mistakes: {"potato": "v5_animal_food"}
  - prompt: What should you do before eating?
    options:
    - wash your hands
    - play in mud
    - touch the dustbin
    - nothing
    answer: wash your hands
    difficulty: 1
    hints:
    - Germs.
    - Soap and water.
    solution: Wash your hands before eating.
    mistakes: {"play in mud": "v5_handwash"}
  - prompt: 'A healthy plate has:'
    options:
    - a mix of grains, dal, vegetables and fruit
    - only sweets
    - only chips
    - only one food every day
    answer: a mix of grains, dal, vegetables and fruit
    difficulty: 2
    hints:
    - Different foods give different help.
    - Mix.
    solution: A healthy plate has a mix of foods.
    mistakes:
      only sweets: c3v_think
  - prompt: 'Idli and dosa are common in:'
    options:
    - South India
    - only the North Pole
    - the desert only
    - nowhere
    answer: South India
    difficulty: 1
    hints:
    - Tamil Nadu, Kerala, Karnataka.
    - Breakfast.
    solution: Idli and dosa are common in South India.
    mistakes: {"only the North Pole": "v3_idli"}
  - prompt: Why should we not waste food?
    options:
    - many people do not have enough, and farmers work hard to grow it
    - food grows on its own
    - wasting is fun
    - food has no value
    answer: many people do not have enough, and farmers work hard to grow it
    difficulty: 2
    hints:
    - Who grows food?
    - Who goes hungry?
    solution: Food takes hard work, and many people are hungry.
    mistakes: {"food grows on its own": "v3_food_waste"}
