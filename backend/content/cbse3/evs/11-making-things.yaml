# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 11
title: Making Things
concepts:
- code: cbse3v.make.crafts
  title: Making Things
  notes: |
    People make things with skill: a potter shapes clay on a wheel, a weaver makes cloth on a loom, a carpenter makes
    furniture from wood, a blacksmith shapes iron, a basket maker weaves bamboo or cane. Steps of making: collect material,
    shape it, finish (dry, bake, paint). Children can make things too: paper boats, clay toys, rakhis.
  explanations:
    text: Many people make things with their hands. A potter shapes clay, a weaver makes cloth, a carpenter makes furniture from wood, and a basket maker weaves bamboo. Each job has steps and needs skill and practice.
    visual: 'Draw a potter at a wheel and the steps: wet clay, shape on the wheel, dry, bake, paint.'
    step_by_step: '1. Collect the material. 2. Shape it. 3. Finish it: dry, bake or paint. 4. Use or sell it.'
    real_world: Kerala has coir mats from coconut fibre and Assam has bamboo baskets.
  picture:
    kind: flow
    steps:
    - Get wet clay
    - Shape it on the wheel
    - Dry it in the sun
    - Bake it in a kiln
    - Paint it
    alt: 'To make a pot: get wet clay, shape it on the wheel, dry it in the sun, bake it in a kiln and paint it.'
  activity:
    type: sort
    prompt: Who makes it?
    bins:
    - Potter
    - Weaver
    - Carpenter
    - Basket maker
    items:
    - label: A clay pot
      bin: Potter
      clue: Made on a spinning wheel.
      why: A potter.
    - label: A diya
      bin: Potter
      clue: Small clay lamp.
      why: A potter.
    - label: A sari
      bin: Weaver
      clue: Made on a loom.
      why: A weaver.
    - label: A cotton towel
      bin: Weaver
      clue: Threads woven together.
      why: A weaver.
    - label: A wooden chair
      bin: Carpenter
      clue: Cut and joined wood.
      why: A carpenter.
    - label: A door
      bin: Carpenter
      clue: Wood, nails and a saw.
      why: A carpenter.
    - label: A bamboo basket
      bin: Basket maker
      clue: Woven strips of bamboo.
      why: A basket maker.
  items:
  - prompt: 'A carpenter makes things from:'
    options:
    - wood
    - clay
    - cloth
    - glass
    answer: wood
    difficulty: 1
    hints:
    - Chairs, tables.
    - Saw and hammer.
    solution: A carpenter works with wood.
  - prompt: 'A weaver uses a:'
    options:
    - loom
    - wheel for clay
    - hammer and anvil
    - oven
    answer: loom
    difficulty: 1
    hints:
    - To make cloth.
    - Threads go across.
    solution: A weaver uses a loom.
  - prompt: 'After shaping a clay pot, the potter:'
    options:
    - dries and bakes it
    - throws it in water
    - freezes it
    - folds it
    answer: dries and bakes it
    difficulty: 2
    hints:
    - To make it hard.
    - Sun and kiln.
    solution: The pot is dried and baked.
  - prompt: 'Baskets are often made from:'
    options:
    - bamboo or cane
    - iron
    - glass
    - stone
    answer: bamboo or cane
    difficulty: 1
    hints:
    - Plant material that bends.
    - Woven.
    solution: Baskets are made of bamboo or cane.
  - prompt: 'A blacksmith works with:'
    options:
    - iron
    - paper
    - cotton
    - clay
    answer: iron
    difficulty: 1
    hints:
    - Hot fire.
    - Hammer.
    solution: A blacksmith works with iron.
  - prompt: 'Coir mats are made from:'
    options:
    - coconut fibre
    - plastic
    - glass
    - metal
    answer: coconut fibre
    difficulty: 2
    hints:
    - A Kerala craft.
    - From coconuts.
    solution: Coir comes from coconut fibre.
  - prompt: Why do craftspeople need practice?
    options:
    - making things well needs skill
    - it is not needed
    - machines do everything
    - to waste time
    answer: making things well needs skill
    difficulty: 2
    hints:
    - Try making a clay pot.
    - It gets better.
    solution: Skill comes with practice.
