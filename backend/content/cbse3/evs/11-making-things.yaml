# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 11
title: Making Things
tips:
  v3_basket: "Baskets are woven from long, bendy stems of tall plants."
  v3_practice: "Hand-made things look good only when the maker is skilled. How do you get skilled?"
  c3v11_who: "Name the material first: clay, thread, wood, iron, bamboo. Then think who works with it and what they make."
  c3v11_steps: 'Put the steps in order: get the material, shape it, then finish it.'
  c3v11_skill: Think how hard it would be to do it well the very first time.

concepts:
- code: cbse3v.make.crafts
  title: Making Things
  notes: |
    People make things with skill: a potter shapes clay on a wheel, a weaver makes cloth on a loom, a carpenter makes
    furniture from wood, a blacksmith shapes iron, a basket maker weaves bamboo or cane. Steps of making: collect material,
    shape it, finish (dry, bake, paint). Children can make things too: paper boats, clay toys, rakhis.
  explanations:
    text: Many people make things with their hands. A potter shapes clay, a weaver makes cloth, a carpenter makes furniture from wood, and a basket maker weaves bamboo. Each job has steps and needs skill and practice.
    visual: 'Draw a potter at a wheel and the steps: wet clay, shape on the wheel, dry, bake, paint.'
    step_by_step: '1. Collect the material. 2. Shape it. 3. Finish it: dry, bake or paint. 4. Use or sell it.'
    real_world: Kerala has coir mats from coconut fibre and Assam has bamboo baskets.
  picture:
    kind: flow
    steps:
    - Get wet clay
    - Shape it on the wheel
    - Dry it in the sun
    - Bake it in a kiln
    - Paint it
    alt: 'To make a pot: get wet clay, shape it on the wheel, dry it in the sun, bake it in a kiln and paint it.'
  activity:
    type: sort
    prompt: Who makes it?
    bins:
    - Potter
    - Weaver
    - Carpenter
    - Basket maker
    items:
    - label: A clay pot
      bin: Potter
      clue: Made on a spinning wheel.
      why: A potter.
    - label: A diya
      bin: Potter
      clue: Small clay lamp.
      why: A potter.
    - label: A sari
      bin: Weaver
      clue: Made on a loom.
      why: A weaver.
    - label: A cotton towel
      bin: Weaver
      clue: Threads woven together.
      why: A weaver.
    - label: A wooden chair
      bin: Carpenter
      clue: Cut and joined wood.
      why: A carpenter.
    - label: A door
      bin: Carpenter
      clue: Wood, nails and a saw.
      why: A carpenter.
    - label: A bamboo basket
      bin: Basket maker
      clue: Woven strips of bamboo.
      why: A basket maker.
  lesson:
    - teach: Many people make things by hand with great skill. A potter shapes clay on a wheel. A weaver makes cloth on a loom. A carpenter makes furniture from wood. A blacksmith heats and shapes iron. A basket maker weaves bamboo or cane.
      picture:
        kind: compare
        columns:
        - title: Potter
          points:
          - clay
          - wheel
        - title: Carpenter
          points:
          - wood
          - saw
        - title: Blacksmith
          points:
          - iron
          - fire and hammer
        alt: Three makers, their material and their tool.
      check:
        prompt: Who uses a wheel to shape clay?
        options:
        - a potter
        - a weaver
        - a blacksmith
        answer: a potter
        why: The spinning wheel helps the potter shape round pots.
    - teach: Making something has steps. First collect the material, then shape it, then finish it. A clay pot is shaped, dried in the sun, then baked in a fire to make it hard.
      picture:
        kind: flow
        steps:
        - collect clay
        - shape on wheel
        - dry in sun
        - bake in fire
        alt: Steps to make a clay pot.
      check:
        prompt: What happens after a clay pot is shaped?
        options:
        - it is dried and baked
        - it is thrown away
        - it is woven
        answer: it is dried and baked
        why: Drying and baking make the clay hard.
    - teach: 'Craftspeople get better with practice. You can make things too: a paper boat, a clay toy, a rakhi. Follow the steps and try again if it does not work the first time.'
      check:
        prompt: Your paper boat tears. What should you do?
        options:
        - try again, folding more gently
        - never make one again
        - blame the paper forever
        answer: try again, folding more gently
        why: Practice makes the skill better.
  items:
  - prompt: 'A carpenter makes things from:'
    options:
    - wood
    - clay
    - cloth
    - glass
    answer: wood
    difficulty: 1
    hints:
    - Chairs, tables.
    - Saw and hammer.
    solution: A carpenter works with wood.
    mistakes: {"clay": "v4_wood"}
  - prompt: 'A weaver uses a:'
    options:
    - loom
    - wheel for clay
    - hammer and anvil
    - oven
    answer: loom
    difficulty: 1
    hints:
    - To make cloth.
    - Threads go across.
    solution: A weaver uses a loom.
    mistakes: {"oven": "v4_loom"}
  - prompt: 'After shaping a clay pot, the potter:'
    options:
    - dries and bakes it
    - throws it in water
    - freezes it
    - folds it
    answer: dries and bakes it
    difficulty: 2
    hints:
    - To make it hard.
    - Sun and kiln.
    solution: The pot is dried and baked.
    mistakes: {"throws it in water": "v4_kiln"}
  - prompt: 'Baskets are often made from:'
    options:
    - bamboo or cane
    - iron
    - glass
    - stone
    answer: bamboo or cane
    difficulty: 1
    hints:
    - Plant material that bends.
    - Woven.
    solution: Baskets are made of bamboo or cane.
    mistakes: {"iron": "v3_basket"}
  - prompt: 'A blacksmith works with:'
    options:
    - iron
    - paper
    - cotton
    - clay
    answer: iron
    difficulty: 1
    hints:
    - Hot fire.
    - Hammer.
    solution: A blacksmith works with iron.
    mistakes: {"paper": "v4_blacksmith"}
  - prompt: 'Coir mats are made from:'
    options:
    - coconut fibre
    - plastic
    - glass
    - metal
    answer: coconut fibre
    difficulty: 2
    hints:
    - A Kerala craft.
    - From coconuts.
    solution: Coir comes from coconut fibre.
    mistakes: {"plastic": "v4_coir"}
  - prompt: Why do craftspeople need practice?
    options:
    - making things well needs skill
    - it is not needed
    - machines do everything
    - to waste time
    answer: making things well needs skill
    difficulty: 2
    hints:
    - Try making a clay pot.
    - It gets better.
    solution: Skill comes with practice.
    mistakes: {"machines do everything": "v3_practice"}
  - prompt: 'A loom is used to make:'
    options:
    - cloth
    - pots
    - chairs
    answer: cloth
    difficulty: 1
    hints:
    - Threads go across and up-down on it.
    - A weaver uses it.
    solution: 'Step 1: A loom weaves threads. Step 2: It makes cloth.'
    mistakes:
      pots: c3v11_who
      chairs: c3v11_who
  - prompt: Who makes tables and doors?
    options:
    - a carpenter
    - a potter
    - a weaver
    answer: a carpenter
    difficulty: 1
    hints:
    - They are made of wood.
    - Who works with wood?
    solution: 'Step 1: Tables and doors are wood. Step 2: A carpenter makes them.'
    mistakes:
      a potter: c3v11_who
      a weaver: c3v11_who
  - prompt: Why does a blacksmith heat iron in a fire?
    options:
    - so it becomes soft enough to shape
    - to clean it
    - to make it lighter
    answer: so it becomes soft enough to shape
    difficulty: 2
    hints:
    - Cold iron is very hard.
    - What does heat do to it?
    solution: 'Step 1: Hot iron becomes soft. Step 2: Then it can be hammered into shape.'
    mistakes:
      to clean it: c3v11_steps
      to make it lighter: c3v11_steps
  - prompt: What is the first step in making a clay toy?
    options:
    - get and soften the clay
    - paint it
    - bake it
    answer: get and soften the clay
    difficulty: 2
    hints:
    - You cannot paint what is not made yet.
    - What do you need before shaping?
    solution: 'Step 1: First get the clay and make it soft. Step 2: Then shape, dry, bake and paint.'
    mistakes:
      paint it: c3v11_steps
      bake it: c3v11_steps
  - prompt: Which of these do people make from bamboo?
    options:
    - baskets and mats
    - glass bottles
    - iron nails
    answer: baskets and mats
    difficulty: 1
    hints:
    - Bamboo can be split into thin strips.
    - Strips can be woven.
    solution: 'Step 1: Bamboo strips bend and weave. Step 2: They make baskets and mats.'
    mistakes:
      glass bottles: c3v11_who
      iron nails: c3v11_who
  - prompt: Why are handmade things special?
    options:
    - each takes skill, time and care
    - they are made by machines
    - they are all the same
    answer: each takes skill, time and care
    difficulty: 2
    hints:
    - Think of a weaver at a loom all day.
    - Who makes them?
    solution: 'Step 1: People make them by hand. Step 2: Each needs skill, time and care.'
    mistakes:
      they are made by machines: c3v11_skill
      they are all the same: c3v11_skill
  - prompt: 'Coconut husk fibre (coir) is used to make:'
    options:
    - ropes
    - glass
    - paper money
    answer: ropes
    difficulty: 2
    hints:
    - Coir is strong and stringy.
    - What can be twisted from fibres?
    solution: 'Step 1: Coir fibres are strong. Step 2: They are twisted into ropes.'
    mistakes:
      glass: c3v11_who
      paper money: c3v11_who
  - prompt: 'Put in order to make a paper boat: fold, choose paper, sail it.'
    options:
    - choose paper, fold, sail it
    - sail it, fold, choose paper
    - fold, sail it, choose paper
    answer: choose paper, fold, sail it
    difficulty: 3
    hints:
    - What do you need before folding?
    - You sail only when it is made.
    solution: 'Step 1: Choose paper first. Step 2: Fold it, then sail it.'
    mistakes:
      sail it, fold, choose paper: c3v11_steps
      fold, sail it, choose paper: c3v11_steps
