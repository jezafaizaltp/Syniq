# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 4
title: Getting to Know Plants
tips:
  v3_herb: "Shrubs are bushy with hard stems. Plants with soft, green stems are called ..."
  v3_plant_needs: "Plants dry up without water and turn pale without light."
  v3_seeds: "Cut open a mango or an orange. Where are the seeds?"
  c3v4_part: 'Picture the plant from bottom to top: what does each part do for the plant?'
  c3v4_size: 'Think about the stem: is it thick and woody, a bit woody and bushy, soft and green, or too weak to stand?'
  c3v4_need: Think what happens to a pot plant left in a dark cupboard without water.

concepts:
- code: cbse3v.plant.parts
  title: Getting to Know Plants
  notes: |
    Unit 2: Life Around Us. Parts of a plant: roots (hold the plant, take in water), stem (holds it up, carries water),
    leaves (make food using sunlight; mostly green), flowers, fruits, seeds. Plants are big (trees), medium (shrubs) or
    small (herbs), or climbers and creepers. Leaves differ in shape, size, edges. Plants need water, air and sunlight.
  explanations:
    text: A plant has roots, a stem, leaves, flowers, fruits and seeds. Roots hold the plant and drink water. The stem holds it up. Green leaves make food from sunlight. Plants can be tall trees, bushy shrubs, small herbs, or climbers.
    visual: Draw a plant and label its roots, stem, leaves, flower and fruit.
    step_by_step: '1. Start at the bottom: roots. 2. Move up: stem. 3. Then leaves, flowers, fruits. 4. Say what each part does.'
    real_world: A mango tree is a tree, a rose plant is a shrub, mint (pudina) is a herb, and a money plant is a climber.
  picture:
    kind: flow
    steps:
    - Roots take in water
    - Stem carries it up
    - Leaves make food with sunlight
    - Flowers become fruits with seeds
    alt: Roots take in water, the stem carries it up, leaves make food with sunlight, and flowers become fruits with seeds.
  activity:
    type: sort
    prompt: Which part of the plant does this job?
    bins:
    - Root
    - Stem
    - Leaf
    - Flower
    items:
    - label: Holds the plant in the soil
      bin: Root
      clue: Under the ground.
      why: The root.
    - label: Drinks water from the soil
      bin: Root
      clue: Under the ground.
      why: The root.
    - label: Holds the plant up
      bin: Stem
      clue: Standing tall.
      why: The stem.
    - label: Carries water up to the leaves
      bin: Stem
      clue: Like a pipe.
      why: The stem.
    - label: Makes food using sunlight
      bin: Leaf
      clue: Green and flat.
      why: The leaf.
    - label: Green and flat, catches sunlight
      bin: Leaf
      clue: Many of them on a tree.
      why: Leaves.
    - label: Turns into a fruit
      bin: Flower
      clue: Bees visit it.
      why: The flower.
    - label: Colourful, with a sweet smell
      bin: Flower
      clue: Bees and butterflies come.
      why: The flower.
  lesson:
    - teach: A plant has parts, each with a job. Roots grow in the soil, hold the plant firm and take in water. The stem holds the plant up and carries water to the leaves. Leaves use sunlight to make food.
      picture:
        kind: flow
        steps:
        - roots take in water
        - stem carries it up
        - leaves make food
        alt: Water goes from roots up the stem to the leaves, which make food.
      check:
        prompt: Which part carries water from the roots to the leaves?
        options:
        - stem
        - flower
        - seed
        answer: stem
        why: The stem is like a pipe between roots and leaves.
    - teach: Plants come in sizes. Trees are big with thick woody trunks (mango, neem). Shrubs are medium and bushy (rose, hibiscus). Herbs are small with soft green stems (mint, tulsi). Climbers climb with support; creepers spread on the ground.
      check:
        prompt: 'A rose bush is a:'
        options:
        - shrub
        - tree
        - creeper
        answer: shrub
        why: It is medium-sized and bushy with hard stems.
    - teach: Flowers turn into fruits, and fruits hold seeds. A seed can grow into a new plant. To grow, plants need water, air and sunlight.
      check:
        prompt: 'A new plant can grow from a:'
        options:
        - seed
        - leaf of paper
        - stone
        answer: seed
        why: A seed holds a baby plant.
  items:
  - prompt: Which part of a plant takes in water from the soil?
    options:
    - roots
    - flowers
    - fruits
    - leaves
    answer: roots
    difficulty: 1
    hints:
    - Under the ground.
    - Like straws.
    solution: Roots take in water.
    mistakes:
      leaves: c3v_reread
  - prompt: Which part makes food for the plant?
    options:
    - leaves
    - roots
    - seeds
    - stem
    answer: leaves
    difficulty: 1
    hints:
    - Green parts.
    - Need sunlight.
    solution: Leaves make food.
    mistakes: {"roots": "v4_leaf"}
  - prompt: 'A big plant with a thick, woody trunk is a:'
    options:
    - tree
    - herb
    - creeper
    - grass
    answer: tree
    difficulty: 1
    hints:
    - Tall and strong.
    - Mango.
    solution: It is a tree.
    mistakes: {"herb": "v4_tree"}
  - prompt: 'Mint (pudina) is a small plant with a soft, green stem. It is a:'
    options:
    - herb
    - tree
    - shrub
    - climber
    answer: herb
    difficulty: 2
    hints:
    - Small with a soft stem.
    - Not woody.
    solution: Mint is a herb.
    mistakes: {"shrub": "v3_herb"}
  - prompt: 'A money plant that climbs a wall is a:'
    options:
    - climber
    - tree
    - herb
    - root
    answer: climber
    difficulty: 1
    hints:
    - It goes up with support.
    - Climbs.
    solution: It is a climber.
    mistakes: {"herb": "v4_climber"}
  - prompt: What do plants need to grow?
    options:
    - water, air and sunlight
    - only darkness
    - plastic
    - nothing
    answer: water, air and sunlight
    difficulty: 1
    hints:
    - Think of watering plants.
    - Sun.
    solution: Plants need water, air and sunlight.
    mistakes: {"only darkness": "v3_plant_needs"}
  - prompt: 'Seeds are usually found inside the:'
    options:
    - fruit
    - root
    - stem
    - leaf
    answer: fruit
    difficulty: 2
    hints:
    - Cut a mango or apple.
    - Inside.
    solution: Seeds are inside fruits.
    mistakes: {"root": "v3_seeds"}
  - prompt: Which part of a plant holds it firmly in the soil?
    options:
    - roots
    - leaves
    - flowers
    answer: roots
    difficulty: 1
    hints:
    - It is under the ground.
    - 'Pull a weed: what holds on?'
    solution: 'Step 1: Roots spread in the soil. Step 2: They hold the plant firm.'
    mistakes:
      leaves: c3v4_part
      flowers: c3v4_part
  - prompt: Most leaves are which colour?
    options:
    - green
    - blue
    - black
    answer: green
    difficulty: 1
    hints:
    - Look at a tree.
    - The colour of grass.
    solution: 'Step 1: Leaves have a green colouring. Step 2: It helps them make food.'
    mistakes:
      blue: c3v4_part
      black: c3v4_part
  - prompt: 'A pumpkin plant spreads along the ground. It is a:'
    options:
    - creeper
    - tree
    - shrub
    answer: creeper
    difficulty: 2
    hints:
    - Its stem is too weak to stand.
    - It spreads, not climbs.
    solution: 'Step 1: Its weak stem lies on the ground. Step 2: That is a creeper.'
    mistakes:
      tree: c3v4_size
      shrub: c3v4_size
  - prompt: 'A hibiscus plant is medium-sized and bushy, with hard stems. It is a:'
    options:
    - shrub
    - herb
    - creeper
    answer: shrub
    difficulty: 2
    hints:
    - Not as big as a tree.
    - Not soft like mint.
    solution: 'Step 1: It is bushy and middle-sized with hard stems. Step 2: That is a shrub.'
    mistakes:
      herb: c3v4_size
      creeper: c3v4_size
  - prompt: 'A plant kept in a dark cupboard for many days will:'
    options:
    - become weak and pale
    - grow faster
    - turn into a tree
    answer: become weak and pale
    difficulty: 2
    hints:
    - What does a plant need to make food?
    - Is there light in a cupboard?
    solution: 'Step 1: Leaves need sunlight to make food. Step 2: Without it the plant grows weak and pale.'
    mistakes:
      grow faster: c3v4_need
      turn into a tree: c3v4_need
  - prompt: 'A flower later turns into a:'
    options:
    - fruit
    - root
    - stem
    answer: fruit
    difficulty: 2
    hints:
    - Watch a mango tree after it flowers.
    - What grows where the flowers were?
    solution: 'Step 1: After flowering, small fruits appear. Step 2: The flower turns into a fruit.'
    mistakes:
      root: c3v4_part
      stem: c3v4_part
  - prompt: 'Leaves are different from each other in:'
    options:
    - shape, size and edges
    - the number of roots they have
    - the seeds inside them
    answer: shape, size and edges
    difficulty: 2
    hints:
    - Compare a banana leaf and a tulsi leaf.
    - What looks different?
    solution: 'Step 1: A banana leaf is huge, a tulsi leaf small. Step 2: Leaves differ in shape, size and edges.'
    mistakes:
      the number of roots they have: c3v4_part
      the seeds inside them: c3v4_part
  - prompt: Why should we water a plant at its roots, not only on its leaves?
    options:
    - the roots take in the water
    - the leaves need washing
    - the flowers drink first
    answer: the roots take in the water
    difficulty: 3
    hints:
    - Which part takes in water?
    - Where is it?
    solution: 'Step 1: Roots take in water from the soil. Step 2: So water the soil near the roots.'
    mistakes:
      the leaves need washing: c3v4_part
      the flowers drink first: c3v4_part
