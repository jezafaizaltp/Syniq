# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 4
title: Getting to Know Plants
concepts:
- code: cbse3v.plant.parts
  title: Getting to Know Plants
  notes: |
    Unit 2: Life Around Us. Parts of a plant: roots (hold the plant, take in water), stem (holds it up, carries water),
    leaves (make food using sunlight; mostly green), flowers, fruits, seeds. Plants are big (trees), medium (shrubs) or
    small (herbs), or climbers and creepers. Leaves differ in shape, size, edges. Plants need water, air and sunlight.
  explanations:
    text: A plant has roots, a stem, leaves, flowers, fruits and seeds. Roots hold the plant and drink water. The stem holds it up. Green leaves make food from sunlight. Plants can be tall trees, bushy shrubs, small herbs, or climbers.
    visual: Draw a plant and label its roots, stem, leaves, flower and fruit.
    step_by_step: '1. Start at the bottom: roots. 2. Move up: stem. 3. Then leaves, flowers, fruits. 4. Say what each part does.'
    real_world: A mango tree is a tree, a rose plant is a shrub, mint (pudina) is a herb, and a money plant is a climber.
  picture:
    kind: flow
    steps:
    - Roots take in water
    - Stem carries it up
    - Leaves make food with sunlight
    - Flowers become fruits with seeds
    alt: Roots take in water, the stem carries it up, leaves make food with sunlight, and flowers become fruits with seeds.
  activity:
    type: sort
    prompt: Which part of the plant does this job?
    bins:
    - Root
    - Stem
    - Leaf
    - Flower
    items:
    - label: Holds the plant in the soil
      bin: Root
      clue: Under the ground.
      why: The root.
    - label: Drinks water from the soil
      bin: Root
      clue: Under the ground.
      why: The root.
    - label: Holds the plant up
      bin: Stem
      clue: Standing tall.
      why: The stem.
    - label: Carries water up to the leaves
      bin: Stem
      clue: Like a pipe.
      why: The stem.
    - label: Makes food using sunlight
      bin: Leaf
      clue: Green and flat.
      why: The leaf.
    - label: Green and flat, catches sunlight
      bin: Leaf
      clue: Many of them on a tree.
      why: Leaves.
    - label: Turns into a fruit
      bin: Flower
      clue: Bees visit it.
      why: The flower.
    - label: Colourful, with a sweet smell
      bin: Flower
      clue: Bees and butterflies come.
      why: The flower.
  items:
  - prompt: Which part of a plant takes in water from the soil?
    options:
    - roots
    - flowers
    - fruits
    - leaves
    answer: roots
    difficulty: 1
    hints:
    - Under the ground.
    - Like straws.
    solution: Roots take in water.
    mistakes:
      leaves: c3v_reread
  - prompt: Which part makes food for the plant?
    options:
    - leaves
    - roots
    - seeds
    - stem
    answer: leaves
    difficulty: 1
    hints:
    - Green parts.
    - Need sunlight.
    solution: Leaves make food.
  - prompt: 'A big plant with a thick, woody trunk is a:'
    options:
    - tree
    - herb
    - creeper
    - grass
    answer: tree
    difficulty: 1
    hints:
    - Tall and strong.
    - Mango.
    solution: It is a tree.
  - prompt: 'Mint (pudina) is a small plant with a soft, green stem. It is a:'
    options:
    - herb
    - tree
    - shrub
    - climber
    answer: herb
    difficulty: 2
    hints:
    - Small with a soft stem.
    - Not woody.
    solution: Mint is a herb.
  - prompt: 'A money plant that climbs a wall is a:'
    options:
    - climber
    - tree
    - herb
    - root
    answer: climber
    difficulty: 1
    hints:
    - It goes up with support.
    - Climbs.
    solution: It is a climber.
  - prompt: What do plants need to grow?
    options:
    - water, air and sunlight
    - only darkness
    - plastic
    - nothing
    answer: water, air and sunlight
    difficulty: 1
    hints:
    - Think of watering plants.
    - Sun.
    solution: Plants need water, air and sunlight.
  - prompt: 'Seeds are usually found inside the:'
    options:
    - fruit
    - root
    - stem
    - leaf
    answer: fruit
    difficulty: 2
    hints:
    - Cut a mango or apple.
    - Inside.
    solution: Seeds are inside fruits.
