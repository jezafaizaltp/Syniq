# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 6
title: Living in Harmony
concepts:
- code: cbse3v.harmony.care
  title: Living in Harmony
  notes: |
    Living in harmony means sharing the Earth kindly with plants and animals. Be kind: give water to birds in summer, do not
    tease or hurt animals, do not pluck flowers needlessly. Some communities protect trees and animals (the Bishnoi of
    Rajasthan protect blackbuck and khejri trees; Chipko movement hugged trees). Plant trees; keep places clean.
  explanations:
    text: Living in harmony means living kindly with plants, animals and people. We can keep a water bowl for birds in summer, never hurt animals, plant trees and keep our surroundings clean. The Bishnoi people of Rajasthan protect trees and deer.
    visual: Draw a water bowl on a balcony with sparrows drinking, and a child planting a sapling.
    step_by_step: 1. Who shares our surroundings? 2. What do they need? 3. What can I do to help?
    real_world: In the Chipko movement in Uttarakhand, villagers hugged trees to stop them being cut.
  picture:
    kind: flow
    steps:
    - Notice animals and plants around you
    - Think what they need
    - 'Help: water, care, no harm'
    - Live together happily
    alt: Notice the animals and plants around you, think about what they need, help them with water and care, and live together happily.
  items:
  - prompt: 'Living in harmony means:'
    options:
    - living kindly together with plants and animals
    - fighting with animals
    - cutting all trees
    - keeping animals in boxes
    answer: living kindly together with plants and animals
    difficulty: 1
    hints:
    - Harmony is peace.
    - Together.
    solution: Living kindly together.
  - prompt: In hot summers, how can you help birds?
    options:
    - keep a bowl of water for them
    - chase them away
    - throw stones
    - close all windows
    answer: keep a bowl of water for them
    difficulty: 1
    hints:
    - They get thirsty.
    - Water.
    solution: Keep a water bowl for birds.
  - prompt: 'The Bishnoi people are known for:'
    options:
    - protecting trees and animals
    - cutting forests
    - hunting deer
    - building factories
    answer: protecting trees and animals
    difficulty: 2
    hints:
    - Rajasthan.
    - Blackbuck and khejri trees.
    solution: They protect trees and animals.
  - prompt: 'In the Chipko movement, people:'
    options:
    - hugged trees to save them
    - planted plastic trees
    - cut trees faster
    - sold trees
    answer: hugged trees to save them
    difficulty: 2
    hints:
    - Chipko means to stick or hug.
    - To stop cutting.
    solution: They hugged trees to save them.
  - prompt: Which is a kind action?
    options:
    - planting a sapling
    - plucking all the flowers
    - teasing a dog
    - breaking a nest
    answer: planting a sapling
    difficulty: 1
    hints:
    - Helps nature.
    - Grows into a tree.
    solution: Planting a sapling is kind.
    mistakes:
      teasing a dog: c3v_think
  - prompt: A stray puppy is hurt. What should you do?
    options:
    - tell an adult so it can get help
    - throw a stone
    - pull its tail
    - ignore it and laugh
    answer: tell an adult so it can get help
    difficulty: 1
    hints:
    - Be kind.
    - Get help.
    solution: Tell an adult.
  - prompt: Why should we not litter in parks?
    options:
    - it harms animals and makes places dirty
    - parks like rubbish
    - it helps plants
    - nobody minds
    answer: it harms animals and makes places dirty
    difficulty: 2
    hints:
    - Animals may eat plastic.
    - Clean place.
    solution: Litter harms animals and dirties places.
