# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 6
title: Living in Harmony
tips:
  v3_birds_water: "In summer ponds dry up. What do thirsty birds need?"
  v3_bishnoi: "The Bishnoi of Rajasthan gave their lives to stop people cutting trees."
  v3_chipko: "'Chipko' means to cling or stick to."
  v3_harmony: "Harmony means getting along well together."
  v3_hurt_puppy: "A hurt puppy needs care. Who can help it safely?"
  v3_litter: "Rubbish can hurt animals that eat it, and makes the park dirty for everyone."
  c3v6_kind: Imagine you are the animal or plant. Which choice would you want?
  c3v6_story: Remember what those people did for trees or animals, and why.
  c3v6_clean: Think about who uses the place after you leave.

concepts:
- code: cbse3v.harmony.care
  title: Living in Harmony
  notes: |
    Living in harmony means sharing the Earth kindly with plants and animals. Be kind: give water to birds in summer, do not
    tease or hurt animals, do not pluck flowers needlessly. Some communities protect trees and animals (the Bishnoi of
    Rajasthan protect blackbuck and khejri trees; Chipko movement hugged trees). Plant trees; keep places clean.
  explanations:
    text: Living in harmony means living kindly with plants, animals and people. We can keep a water bowl for birds in summer, never hurt animals, plant trees and keep our surroundings clean. The Bishnoi people of Rajasthan protect trees and deer.
    visual: Draw a water bowl on a balcony with sparrows drinking, and a child planting a sapling.
    step_by_step: 1. Who shares our surroundings? 2. What do they need? 3. What can I do to help?
    real_world: In the Chipko movement in Uttarakhand, villagers hugged trees to stop them being cut.
  picture:
    kind: flow
    steps:
    - Notice animals and plants around you
    - Think what they need
    - 'Help: water, care, no harm'
    - Live together happily
    alt: Notice the animals and plants around you, think about what they need, help them with water and care, and live together happily.
  activity:
    type: sort
    prompt: Is it kind to living things?
    bins:
    - Kind
    - Unkind
    items:
    - label: Keeping a water bowl for birds in summer
      bin: Kind
      clue: Birds get thirsty too.
      why: Kind.
    - label: Planting a tree
      bin: Kind
      clue: Homes and food for many.
      why: Kind.
    - label: Feeding a stray dog gently
      bin: Kind
      clue: It's hungry.
      why: Kind.
    - label: Watering a dry plant
      bin: Kind
      clue: It needs water to live.
      why: Kind.
    - label: Throwing stones at a dog
      bin: Unkind
      clue: It hurts.
      why: Unkind.
    - label: Plucking flowers just to throw them
      bin: Unkind
      clue: The plant needs them.
      why: Unkind.
    - label: Breaking a bird's nest
      bin: Unkind
      clue: It's their home.
      why: Unkind.
  lesson:
    - teach: Living in harmony means sharing the Earth kindly with people, plants and animals. Every living thing needs food, water and a safe home.
      check:
        prompt: What does it mean to live in harmony with nature?
        options:
        - sharing the Earth kindly
        - keeping everything for ourselves
        - cutting all trees
        answer: sharing the Earth kindly
        why: Everyone, people and animals, needs a place on Earth.
    - teach: 'We can be kind every day: keep a bowl of water for birds in summer, never tease or hurt animals, don''t pluck flowers for no reason, plant trees and keep places clean.'
      picture:
        kind: compare
        columns:
        - title: Kind
          points:
          - water bowl for birds
          - plant a tree
          - put litter in bins
        - title: Unkind
          points:
          - throw stones at dogs
          - pluck flowers needlessly
          - litter the park
        alt: Kind and unkind ways to treat nature.
      check:
        prompt: Which is kind to birds in summer?
        options:
        - keep a bowl of water out
        - chase them away
        - cut their tree
        answer: keep a bowl of water out
        why: In hot weather birds need water to drink.
    - teach: Some communities protect nature. The Bishnoi people of Rajasthan protect blackbuck deer and khejri trees. In the Chipko movement, villagers hugged trees to stop them being cut.
      check:
        prompt: What did people do in the Chipko movement?
        options:
        - hugged trees to save them
        - planted crackers
        - built roads in forests
        answer: hugged trees to save them
        why: '''Chipko'' means to stick to or hug.'
  items:
  - prompt: 'Living in harmony means:'
    options:
    - living kindly together with plants and animals
    - fighting with animals
    - cutting all trees
    - keeping animals in boxes
    answer: living kindly together with plants and animals
    difficulty: 1
    hints:
    - Harmony is peace.
    - Together.
    solution: Living kindly together.
    mistakes: {"fighting with animals": "v3_harmony"}
  - prompt: In hot summers, how can you help birds?
    options:
    - keep a bowl of water for them
    - chase them away
    - throw stones
    - close all windows
    answer: keep a bowl of water for them
    difficulty: 1
    hints:
    - They get thirsty.
    - Water.
    solution: Keep a water bowl for birds.
    mistakes: {"chase them away": "v3_birds_water"}
  - prompt: 'The Bishnoi people are known for:'
    options:
    - protecting trees and animals
    - cutting forests
    - hunting deer
    - building factories
    answer: protecting trees and animals
    difficulty: 2
    hints:
    - Rajasthan.
    - Blackbuck and khejri trees.
    solution: They protect trees and animals.
    mistakes: {"hunting deer": "v3_bishnoi"}
  - prompt: 'In the Chipko movement, people:'
    options:
    - hugged trees to save them
    - planted plastic trees
    - cut trees faster
    - sold trees
    answer: hugged trees to save them
    difficulty: 2
    hints:
    - Chipko means to stick or hug.
    - To stop cutting.
    solution: They hugged trees to save them.
    mistakes: {"cut trees faster": "v3_chipko"}
  - prompt: Which is a kind action?
    options:
    - planting a sapling
    - plucking all the flowers
    - teasing a dog
    - breaking a nest
    answer: planting a sapling
    difficulty: 1
    hints:
    - Helps nature.
    - Grows into a tree.
    solution: Planting a sapling is kind.
    mistakes:
      teasing a dog: c3v_think
  - prompt: A stray puppy is hurt. What should you do?
    options:
    - tell an adult so it can get help
    - throw a stone
    - pull its tail
    - ignore it and laugh
    answer: tell an adult so it can get help
    difficulty: 1
    hints:
    - Be kind.
    - Get help.
    solution: Tell an adult.
    mistakes: {"throw a stone": "v3_hurt_puppy"}
  - prompt: Why should we not litter in parks?
    options:
    - it harms animals and makes places dirty
    - parks like rubbish
    - it helps plants
    - nobody minds
    answer: it harms animals and makes places dirty
    difficulty: 2
    hints:
    - Animals may eat plastic.
    - Clean place.
    solution: Litter harms animals and dirties places.
    mistakes: {"parks like rubbish": "v3_litter"}
  - prompt: A bird's nest has fallen with eggs in it. What should you do?
    options:
    - tell an adult who can put it back gently
    - take the eggs home to play
    - throw the nest away
    answer: tell an adult who can put it back gently
    difficulty: 2
    hints:
    - The eggs need their parents.
    - Who can help safely?
    solution: 'Step 1: The eggs belong with the bird parents. Step 2: An adult can put the nest back gently.'
    mistakes:
      take the eggs home to play: c3v6_kind
      throw the nest away: c3v6_kind
  - prompt: Which place is shared by people, plants and animals?
    options:
    - a village pond
    - a locked cupboard
    - a closed box
    answer: a village pond
    difficulty: 1
    hints:
    - Think where cows drink, birds bathe and people wash.
    - Plants grow around it too.
    solution: 'Step 1: People, animals and plants all use a pond. Step 2: We must share it kindly.'
    mistakes:
      a locked cupboard: c3v6_kind
      a closed box: c3v6_kind
  - prompt: 'After a picnic in the park, you should:'
    options:
    - put all waste in a bin
    - leave the wrappers on the grass
    - throw bottles in the pond
    answer: put all waste in a bin
    difficulty: 1
    hints:
    - Others will use the park later.
    - Where does waste belong?
    solution: 'Step 1: Litter spoils the park and harms animals. Step 2: Put waste in a bin.'
    mistakes:
      leave the wrappers on the grass: c3v6_clean
      throw bottles in the pond: c3v6_clean
  - prompt: Why should we not pluck flowers for no reason?
    options:
    - flowers become fruits and seeds and feed bees
    - flowers are too heavy
    - flowers grow back in one minute
    answer: flowers become fruits and seeds and feed bees
    difficulty: 2
    hints:
    - What do flowers turn into?
    - Who visits flowers?
    solution: 'Step 1: Flowers become fruits and seeds. Step 2: Bees and butterflies need their nectar.'
    mistakes:
      flowers are too heavy: c3v6_kind
      flowers grow back in one minute: c3v6_kind
  - prompt: Which action helps the Earth the most?
    options:
    - planting a tree and caring for it
    - cutting a tree for fun
    - burning dry leaves
    answer: planting a tree and caring for it
    difficulty: 1
    hints:
    - Which gives shade, fruit and homes?
    - Which adds smoke?
    solution: 'Step 1: Trees give shade, fruit and homes. Step 2: Planting one helps.'
    mistakes:
      cutting a tree for fun: c3v6_kind
      burning dry leaves: c3v6_clean
  - prompt: A cat comes to your house every day. What is a kind way to treat it?
    options:
    - be gentle and give it clean water
    - lock it in a box
    - scare it with loud noises
    answer: be gentle and give it clean water
    difficulty: 1
    hints:
    - How would you like to be treated?
    - Animals feel fear and pain.
    solution: 'Step 1: Animals feel pain and fear. Step 2: Being gentle is kind.'
    mistakes:
      lock it in a box: c3v6_kind
      scare it with loud noises: c3v6_kind
  - prompt: Why did the Chipko villagers hug trees?
    options:
    - to stop the trees from being cut
    - to keep warm
    - to climb them
    answer: to stop the trees from being cut
    difficulty: 2
    hints:
    - Their forest was in danger.
    - What were they protecting the trees from?
    solution: 'Step 1: Loggers came to cut the trees. Step 2: Villagers hugged them so they could not be cut.'
    mistakes:
      to keep warm: c3v6_story
      to climb them: c3v6_story
  - prompt: Ants are walking across your path. What should you do?
    options:
    - step around them
    - stamp on them
    - pour water on them
    answer: step around them
    difficulty: 2
    hints:
    - Ants are small living things.
    - Can you avoid hurting them?
    solution: 'Step 1: Ants are alive too. Step 2: Step around and let them go.'
    mistakes:
      stamp on them: c3v6_kind
      pour water on them: c3v6_kind
