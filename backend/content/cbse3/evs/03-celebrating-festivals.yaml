# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 3
title: Celebrating Festivals
tips:
  v3_christmas: "A star on top of a tree and a plum cake belong to a December festival."
  v3_diwali: "Holi is the festival of colours. Which festival has rows of diyas?"
  v3_festival_together: "At festivals people visit, cook and celebrate. Do they come together or stay apart?"
  v3_harvest: "Pongal and Bihu come when crops are cut and brought home."
  v3_holi: "People throw gulal at each other on Holi."
  v3_pookalam: "Pookalam is made in Kerala for a harvest festival with boat races."
  c3v3_sign: Think of the special thing people make, wear or do for each festival.
  c3v3_nature: 'Ask: which choice leaves no smoke, noise or plastic behind?'
  c3v3_together: Think what families and neighbours do together on festival days.

concepts:
- code: cbse3v.fest.festivals
  title: Celebrating Festivals
  notes: |
    India celebrates many festivals: Diwali (lamps), Eid (prayers, sewaiyan, Eid greetings), Christmas (star, cake),
    Onam (pookalam, sadya), Pongal (harvest, sweet pongal), Holi (colours), Guru Nurpurab (langar), Bihu (harvest dance).
    Festivals bring families and neighbours together; people share food, wear new clothes, decorate. Celebrate without
    harming the environment: clay diyas, flowers, no loud crackers.
  explanations:
    text: India has many festivals. Diwali is the festival of lamps, Eid brings prayers and sweet sewaiyan, Christmas has stars and cake, Onam has flower carpets and a big feast, and Pongal and Bihu celebrate the harvest. Festivals bring people together to share.
    visual: 'Draw three festivals: a diya for Diwali, a pookalam for Onam, a star for Christmas.'
    step_by_step: 1. Name the festival. 2. What do people do? 3. What food is made? 4. How can we celebrate kindly to nature?
    real_world: In many neighbourhoods, people of different religions share sweets on each other's festivals.
  picture:
    kind: compare
    columns:
    - title: Festival
      points:
      - Diwali
      - Onam
      - Eid
    - title: Special thing
      points:
      - lamps (diyas)
      - pookalam, sadya
      - prayers, sewaiyan
    alt: Diwali has lamps, Onam has pookalam flower carpets and the sadya feast, and Eid has prayers and sewaiyan.
  activity:
    type: sort
    prompt: Which festival is it?
    bins:
    - Diwali
    - Eid
    - Christmas
    - Onam
    - Pongal
    items:
    - label: The festival of lamps
      bin: Diwali
      clue: Rows of diyas.
      why: Diwali.
    - label: Rangoli and diyas everywhere
      bin: Diwali
      clue: Lights at night.
      why: Diwali.
    - label: Prayers and sweet sewaiyan
      bin: Eid
      clue: After a month of fasting.
      why: Eid.
    - label: A star and a cake on 25 December
      bin: Christmas
      clue: Carols are sung.
      why: Christmas.
    - label: Flower carpets (pookalam) in Kerala
      bin: Onam
      clue: A harvest festival.
      why: Onam.
    - label: A big feast on a banana leaf and boat races
      bin: Onam
      clue: Kerala.
      why: Onam.
    - label: Rice cooked until it boils over
      bin: Pongal
      clue: Tamil Nadu harvest.
      why: Pongal.
  lesson:
    - teach: India has many festivals. Diwali is the festival of lamps. Eid begins with prayers and sweet sewaiyan. Christmas has a star and cake. Onam has a flower carpet (pookalam) and a feast (sadya). Holi is played with colours.
      picture:
        kind: compare
        columns:
        - title: Diwali
          points:
          - lamps (diyas)
        - title: Onam
          points:
          - pookalam
          - sadya
        - title: Holi
          points:
          - colours
        alt: Three festivals and one sign of each.
      check:
        prompt: Which festival has a flower carpet called pookalam?
        options:
        - Onam
        - Holi
        - Christmas
        answer: Onam
        why: Pookalam is made in Kerala for Onam.
    - teach: 'Some festivals celebrate the harvest, when crops are ready: Pongal in Tamil Nadu, Bihu in Assam, Baisakhi in Punjab, Onam in Kerala. Farmers thank nature for the crops.'
      check:
        prompt: 'Pongal celebrates the:'
        options:
        - harvest
        - first rain
        - new school year
        answer: harvest
        why: Pongal thanks nature for the new crop.
    - teach: 'Festivals bring people together: families visit, neighbours share sweets, everyone wears new clothes. We can celebrate without harming nature: clay diyas, flowers, no loud crackers, no plastic.'
      check:
        prompt: Which choice is kind to nature at festival time?
        options:
        - decorate with flowers and clay diyas
        - burst many loud crackers
        - use plastic decorations and throw them away
        answer: decorate with flowers and clay diyas
        why: Flowers and clay go back into the soil; smoke and plastic do not.
  items:
  - prompt: Which festival is called the festival of lamps?
    options:
    - Diwali
    - Holi
    - Onam
    - Christmas
    answer: Diwali
    difficulty: 1
    hints:
    - Diyas are lit.
    - Lights.
    solution: Diwali is the festival of lamps.
    mistakes: {"Holi": "v3_diwali"}
  - prompt: 'A flower carpet called pookalam is made for:'
    options:
    - Onam
    - Holi
    - Eid
    - Christmas
    answer: Onam
    difficulty: 1
    hints:
    - A Kerala festival.
    - Flowers on the floor.
    solution: Pookalam is made for Onam.
    mistakes: {"Holi": "v3_pookalam"}
  - prompt: 'Holi is played with:'
    options:
    - colours
    - kites only
    - snow
    - candles
    answer: colours
    difficulty: 1
    hints:
    - "Think of what people throw on each other at Holi."
    - Gulal.
    solution: Holi is played with colours.
    mistakes: {"candles": "v3_holi"}
  - prompt: 'Pongal and Bihu celebrate the:'
    options:
    - harvest
    - rain only
    - school year
    - new car
    answer: harvest
    difficulty: 2
    hints:
    - Farmers cut crops.
    - New rice.
    solution: They celebrate the harvest.
    mistakes: {"rain only": "v3_harvest"}
  - prompt: Which is a nature-friendly way to celebrate?
    options:
    - using clay diyas and flowers
    - bursting many loud crackers
    - throwing plastic everywhere
    - wasting food
    answer: using clay diyas and flowers
    difficulty: 2
    hints:
    - Kind to nature.
    - No smoke, no plastic.
    solution: Clay diyas and flowers are nature-friendly.
    mistakes:
      bursting many loud crackers: c3v_think
  - prompt: What do festivals do for people?
    options:
    - bring them together to share
    - keep them apart
    - make them angry
    - stop them talking
    answer: bring them together to share
    difficulty: 1
    hints:
    - Families meet.
    - Sharing food.
    solution: Festivals bring people together.
    mistakes: {"keep them apart": "v3_festival_together"}
  - prompt: 'A star and cake are part of:'
    options:
    - Christmas
    - Diwali
    - Pongal
    - Bihu
    answer: Christmas
    difficulty: 1
    hints:
    - December.
    - Santa.
    solution: Christmas.
    mistakes: {"Diwali": "v3_christmas"}
  - prompt: 'Langar, a free shared meal, is part of:'
    options:
    - Guru Nanak's birthday (Gurpurab)
    - Holi
    - Christmas
    answer: Guru Nanak's birthday (Gurpurab)
    difficulty: 2
    hints:
    - Langar is served at gurudwaras.
    - It is a Sikh festival.
    solution: 'Step 1: Langar is served at gurudwaras. Step 2: It is part of Gurpurab.'
    mistakes:
      Holi: c3v3_sign
      Christmas: c3v3_sign
  - prompt: 'Sewaiyan is a sweet often made on:'
    options:
    - Eid
    - Pongal
    - Holi
    answer: Eid
    difficulty: 1
    hints:
    - Families greet each other after prayers.
    - A sweet made with thin noodles.
    solution: 'Step 1: Sewaiyan is shared on Eid. Step 2: Eid.'
    mistakes:
      Pongal: c3v3_sign
      Holi: c3v3_sign
  - prompt: Bihu is a harvest festival of which state?
    options:
    - Assam
    - Kerala
    - Punjab
    answer: Assam
    difficulty: 2
    hints:
    - It has a famous dance.
    - A state in north-east India.
    solution: 'Step 1: Bihu is danced in the north-east. Step 2: It is from Assam.'
    mistakes:
      Kerala: c3v3_sign
      Punjab: c3v3_sign
  - prompt: Why are loud crackers harmful?
    options:
    - they scare animals, hurt ears and dirty the air
    - they make sweets taste bad
    - they stop the rain forever
    answer: they scare animals, hurt ears and dirty the air
    difficulty: 2
    hints:
    - Think of a dog on Diwali night.
    - And the smoke.
    solution: 'Step 1: Loud bangs scare animals and hurt ears. Step 2: Smoke makes the air dirty.'
    mistakes:
      they make sweets taste bad: c3v3_nature
      they stop the rain forever: c3v3_nature
  - prompt: What do neighbours often do at festivals?
    options:
    - share sweets and greetings
    - stop talking
    - close all doors
    answer: share sweets and greetings
    difficulty: 1
    hints:
    - Festivals bring people together.
    - What is passed from house to house?
    solution: 'Step 1: Festivals are for coming together. Step 2: Neighbours share sweets and greetings.'
    mistakes:
      stop talking: c3v3_together
      close all doors: c3v3_together
  - prompt: Which colours are best for Holi?
    options:
    - natural colours made from flowers and turmeric
    - paint from a factory
    - oil and grease
    answer: natural colours made from flowers and turmeric
    difficulty: 2
    hints:
    - Colours touch skin and eyes.
    - Which is safe and gentle?
    solution: 'Step 1: Factory paint and grease can hurt skin. Step 2: Natural colours are safe.'
    mistakes:
      paint from a factory: c3v3_nature
      oil and grease: c3v3_nature
  - prompt: 'Onam''s big feast served on a banana leaf is called:'
    options:
    - sadya
    - langar
    - sewaiyan
    answer: sadya
    difficulty: 2
    hints:
    - It is a Kerala meal.
    - Many dishes on one leaf.
    solution: 'Step 1: Onam is Kerala''s festival. Step 2: Its feast is the sadya.'
    mistakes:
      langar: c3v3_sign
      sewaiyan: c3v3_sign
  - prompt: Your friend celebrates a festival your family does not. What is a kind thing to do?
    options:
    - wish your friend and learn about it
    - say your festival is better
    - ignore it
    answer: wish your friend and learn about it
    difficulty: 1
    hints:
    - How would you like your festival to be treated?
    - Be curious and kind.
    solution: 'Step 1: All festivals matter to people. Step 2: Wish your friend and learn.'
    mistakes:
      say your festival is better: c3v3_together
      ignore it: c3v3_together
