# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 3
title: Celebrating Festivals
concepts:
- code: cbse3v.fest.festivals
  title: Celebrating Festivals
  notes: |
    India celebrates many festivals: Diwali (lamps), Eid (prayers, sewaiyan, Eid greetings), Christmas (star, cake),
    Onam (pookalam, sadya), Pongal (harvest, sweet pongal), Holi (colours), Guru Nurpurab (langar), Bihu (harvest dance).
    Festivals bring families and neighbours together; people share food, wear new clothes, decorate. Celebrate without
    harming the environment: clay diyas, flowers, no loud crackers.
  explanations:
    text: India has many festivals. Diwali is the festival of lamps, Eid brings prayers and sweet sewaiyan, Christmas has stars and cake, Onam has flower carpets and a big feast, and Pongal and Bihu celebrate the harvest. Festivals bring people together to share.
    visual: 'Draw three festivals: a diya for Diwali, a pookalam for Onam, a star for Christmas.'
    step_by_step: 1. Name the festival. 2. What do people do? 3. What food is made? 4. How can we celebrate kindly to nature?
    real_world: In many neighbourhoods, people of different religions share sweets on each other's festivals.
  picture:
    kind: compare
    columns:
    - title: Festival
      points:
      - Diwali
      - Onam
      - Eid
    - title: Special thing
      points:
      - lamps (diyas)
      - pookalam, sadya
      - prayers, sewaiyan
    alt: Diwali has lamps, Onam has pookalam flower carpets and the sadya feast, and Eid has prayers and sewaiyan.
  items:
  - prompt: Which festival is called the festival of lamps?
    options:
    - Diwali
    - Holi
    - Onam
    - Christmas
    answer: Diwali
    difficulty: 1
    hints:
    - Diyas are lit.
    - Lights.
    solution: Diwali is the festival of lamps.
  - prompt: 'A flower carpet called pookalam is made for:'
    options:
    - Onam
    - Holi
    - Eid
    - Christmas
    answer: Onam
    difficulty: 1
    hints:
    - A Kerala festival.
    - Flowers on the floor.
    solution: Pookalam is made for Onam.
  - prompt: 'Holi is played with:'
    options:
    - colours
    - kites only
    - snow
    - candles
    answer: colours
    difficulty: 1
    hints:
    - Festival of colours.
    - Gulal.
    solution: Holi is played with colours.
  - prompt: 'Pongal and Bihu celebrate the:'
    options:
    - harvest
    - rain only
    - school year
    - new car
    answer: harvest
    difficulty: 2
    hints:
    - Farmers cut crops.
    - New rice.
    solution: They celebrate the harvest.
  - prompt: Which is a nature-friendly way to celebrate?
    options:
    - using clay diyas and flowers
    - bursting many loud crackers
    - throwing plastic everywhere
    - wasting food
    answer: using clay diyas and flowers
    difficulty: 2
    hints:
    - Kind to nature.
    - No smoke, no plastic.
    solution: Clay diyas and flowers are nature-friendly.
    mistakes:
      bursting many loud crackers: c3v_think
  - prompt: What do festivals do for people?
    options:
    - bring them together to share
    - keep them apart
    - make them angry
    - stop them talking
    answer: bring them together to share
    difficulty: 1
    hints:
    - Families meet.
    - Sharing food.
    solution: Festivals bring people together.
  - prompt: 'A star and cake are part of:'
    options:
    - Christmas
    - Diwali
    - Pongal
    - Bihu
    answer: Christmas
    difficulty: 1
    hints:
    - December.
    - Santa.
    solution: Christmas.
