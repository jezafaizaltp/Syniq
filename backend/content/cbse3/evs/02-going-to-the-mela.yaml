# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 2
title: Going to the Mela
tips:
  v3_crowd: "In a big crowd you can get lost easily. How can you stay close to your family?"
  v3_giant_wheel: "A mela ride goes round and round high in the air."
  v3_mela: "A mela has stalls, rides and lots of people having fun."
  v3_phone: "If you get lost, how can a helper reach your family?"
  v3_potter: "A tailor sews clothes. Who shapes clay on a spinning wheel?"
  v3_weaver: "A loom weaves threads together; a potter shapes clay on a wheel. Match the person to the right tool and what it makes."
  c3v2_maker: Think of what the thing is made from, then who works with that material.
  c3v2_safe: 'Ask: which choice keeps you near people who can help you?'
  c3v2_mela: 'Picture a busy fair: what do people go there to do?'

concepts:
- code: cbse3v.mela.fair
  title: Going to the Mela
  notes: |
    A mela (fair) brings people of a community together: stalls of toys, bangles, food, pots; rides like the giant wheel;
    artisans (potters, weavers, toy makers) selling their work; music and puppet shows. Stay with elders, hold hands in
    crowds, know what to do if lost (stay put, tell a police officer or stall keeper, know your parent's phone number).
  explanations:
    text: A mela is a big fair where people come together. There are stalls with toys, bangles, pots and tasty food, and rides like the giant wheel. Artisans sell what they make. In a crowd, always stay close to your family.
    visual: 'Draw a mela: a giant wheel, a bangle stall, a balloon seller and a family holding hands.'
    step_by_step: 1. Who comes to a mela? 2. What do people sell? 3. What can you see and do? 4. How do you stay safe?
    real_world: The Pushkar fair in Rajasthan and the Surajkund fair in Haryana are famous melas.
  picture:
    kind: flow
    steps:
    - Lost at a mela?
    - Stay where you are
    - Tell a police officer or stall keeper
    - Give your parent's name and phone number
    alt: If you are lost at a mela, stay where you are, tell a police officer or stall keeper, and give your parent's name and phone number.
  activity:
    type: sort
    prompt: What would you find at this mela stall?
    bins:
    - Toys
    - Food
    - Bangles
    - Pots
    items:
    - label: A spinning top
      bin: Toys
      clue: Something to play with.
      why: A toy.
    - label: A wooden doll
      bin: Toys
      clue: Children play with it.
      why: A toy.
    - label: Hot jalebis
      bin: Food
      clue: Sweet and tasty.
      why: Food.
    - label: Pani puri
      bin: Food
      clue: A snack to eat.
      why: Food.
    - label: Colourful glass rings for wrists
      bin: Bangles
      clue: You wear them.
      why: Bangles.
    - label: Lac bangles
      bin: Bangles
      clue: Worn on the wrist.
      why: Bangles.
    - label: Clay water pots
      bin: Pots
      clue: Made by a potter.
      why: Pots.
    - label: Clay diyas
      bin: Pots
      clue: Made from clay, like matkas.
      why: From the pottery stall.
  lesson:
    - teach: A mela is a big fair where many people of a place come together. There are stalls of toys, bangles, food and pots, rides like the giant wheel, music and puppet shows.
      check:
        prompt: What is a mela?
        options:
        - a fair where people come together
        - a school exam
        - a kind of tree
        answer: a fair where people come together
        why: Melas bring a whole community to one place.
      ways:
      - style: visual
        teach: Things you can see, do, eat and buy at a big mela.
        picture:
          kind: compare
          columns:
          - title: Buy
            points:
            - Toys
            - Bangles
            - Clay pots
          - title: Eat
            points:
            - Jalebi
            - Chaat
            - Candy floss
          - title: Enjoy
            points:
            - Giant wheel
            - Puppet show
            - Music
          alt: At a mela you can buy toys, bangles and clay pots, eat jalebi, chaat and candy floss, and enjoy the giant wheel, a puppet show and music.
      - style: real_world
        teach: Some melas happen at the same place every year, at the same festival time. Families from many villages come, and it becomes a time to meet relatives they have not seen for months.
    - teach: Artisans sell what they make at melas. A potter makes clay pots, a weaver makes cloth, a toy maker makes wooden or clay toys, a bangle maker makes glass or lac bangles.
      picture:
        kind: compare
        columns:
        - title: Potter
          points:
          - clay pots
          - diyas
        - title: Weaver
          points:
          - cloth
          - sarees
        - title: Toy maker
          points:
          - wooden toys
          - clay dolls
        alt: Three artisans and what each makes.
      check:
        prompt: Who makes cloth on a loom?
        options:
        - a weaver
        - a potter
        - a cobbler
        answer: a weaver
        why: A weaver weaves threads into cloth.
      ways:
      - style: visual
        teach: How a potter turns a lump of wet clay into a pot.
        picture:
          kind: flow
          steps:
          - Mix clay with water
          - Put a lump on the spinning wheel
          - Shape it with wet hands
          - Dry the pot in the sun
          - Bake it in a hot kiln
          alt: A potter mixes clay with water, puts a lump on the spinning wheel, shapes it with wet hands, dries the pot in the sun and bakes it in a hot kiln.
      - style: real_world
        teach: Many artisans learn their craft from their parents and grandparents. A weaving family may have used the same kind of loom for a hundred years.
    - teach: 'Melas are crowded. Stay with an elder and hold hands. If you get lost: stay where you are, go to a police officer or a stall keeper, and tell them your parent''s phone number.'
      check:
        prompt: 'If you are lost at a mela, you should:'
        options:
        - stay where you are and ask a police officer
        - go home alone
        - hide behind a stall
        answer: stay where you are and ask a police officer
        why: Staying put makes it easy for your family to find you.
      ways:
      - style: step_by_step
        teach: 'Get ready before going to a crowded mela. Step 1: Learn a parent''s phone number by heart. Step 2: Agree on a meeting place, such as the main gate. Step 3: Wear something bright so you are easy to spot. Step 4: Keep holding an elder''s hand.'
      - style: visual
        teach: Safe and unsafe things to do if you are lost at the mela.
        picture:
          kind: compare
          columns:
          - title: Safe
            points:
            - Stay where you are
            - Go to a police officer or stall keeper
            - Tell them a parent's phone number
          - title: Unsafe
            points:
            - Run around looking
            - Go with a stranger
            - Leave the mela alone
          alt: If you are lost, it is safe to stay where you are, go to a police officer or stall keeper and tell them a parent's phone number. It is unsafe to run around looking, go with a stranger or leave the mela alone.
  items:
  - prompt: 'A mela is a:'
    options:
    - "fair where people come together"
    - "test that we write at school"
    - "kind of fruit grown in villages"
    - "hospital where sick people go"
    answer: fair where people come together
    difficulty: 1
    hints:
    - Stalls and rides.
    - A big gathering.
    solution: A mela is a fair.
    mistakes: {"test that we write at school": "v3_mela"}
  - prompt: Who makes clay pots sold at a mela?
    options:
    - a potter
    - a tailor
    - a pilot
    - a doctor
    answer: a potter
    difficulty: 1
    hints:
    - Works with clay.
    - On a wheel.
    solution: A potter makes clay pots.
    mistakes: {"a tailor": "v3_potter"}
  - prompt: 'If you get lost at a mela, you should:'
    options:
    - "stay where you are and tell a police officer"
    - "run around everywhere looking for your family"
    - "leave the mela and try to go home alone"
    - "go along with any stranger who offers help"
    answer: stay where you are and tell a police officer
    difficulty: 2
    hints:
    - Don't wander.
    - Ask a safe helper.
    solution: Stay put and tell a police officer or stall keeper.
    mistakes:
      "go along with any stranger who offers help": c3v_think
  - prompt: Which ride is found at many melas?
    options:
    - giant wheel
    - aeroplane
    - submarine
    - rocket
    answer: giant wheel
    difficulty: 1
    hints:
    - Goes round and up.
    - Big wheel.
    solution: The giant wheel.
    mistakes: {"submarine": "v3_giant_wheel"}
  - prompt: Why is it good to know your parent's phone number?
    options:
    - "so a helper can call them if you are lost"
    - "so that you can play games on their phone"
    - "so that you can order food on the phone"
    - "it is not useful for anything at all"
    answer: so a helper can call them if you are lost
    difficulty: 2
    hints:
    - If you are lost ...
    - Someone can call.
    solution: A helper can call your parent.
    mistakes: {"so that you can play games on their phone": "v3_phone"}
  - prompt: 'A weaver makes:'
    options:
    - cloth
    - pots
    - bread
    - shoes
    answer: cloth
    difficulty: 1
    hints:
    - Uses a loom.
    - Threads.
    solution: A weaver makes cloth.
    mistakes: {"pots": "v3_weaver"}
  - prompt: 'In a crowd, it is safest to:'
    options:
    - hold an elder's hand
    - walk far ahead
    - hide under a stall
    - climb a pole
    answer: hold an elder's hand
    difficulty: 1
    hints:
    - Stay together.
    - Hand in hand.
    solution: Hold an elder's hand.
    mistakes: {"walk far ahead": "v3_crowd"}
  - prompt: Who makes clay diyas?
    options:
    - a potter
    - a weaver
    - a carpenter
    answer: a potter
    difficulty: 1
    hints:
    - Diyas are made of clay.
    - Who works with clay?
    solution: 'Step 1: Diyas are clay. Step 2: A potter shapes clay.'
    mistakes:
      a weaver: c3v2_maker
      a carpenter: c3v2_maker
  - prompt: Why do people go to a mela?
    options:
    - "to shop, eat, enjoy rides and meet people"
    - "to sit and write their school exams"
    - "to lie down and sleep for the whole day"
    answer: to shop, eat, enjoy rides and meet people
    difficulty: 1
    hints:
    - Think of what you find at a mela.
    - Stalls, rides, shows.
    solution: 'Step 1: A mela has stalls and rides. Step 2: People shop, eat, play and meet.'
    mistakes:
      "to sit and write their school exams": c3v2_mela
      "to lie down and sleep for the whole day": c3v2_mela
  - prompt: Which should you know by heart in case you get lost?
    options:
    - a parent's phone number
    - the price of balloons
    - the name of a ride
    answer: a parent's phone number
    difficulty: 1
    hints:
    - Who needs to be called?
    - A helper will call your family.
    solution: 'Step 1: A helper needs a way to reach your family. Step 2: So learn a parent''s number.'
    mistakes:
      the price of balloons: c3v2_safe
      the name of a ride: c3v2_safe
  - prompt: A stranger at the mela offers to take you home. What should you do?
    options:
    - "say no and go to a police officer or stall keeper"
    - "say yes and go along with the stranger at once"
    - "follow the stranger quietly without telling anyone"
    answer: say no and go to a police officer or stall keeper
    difficulty: 2
    hints:
    - Do not go anywhere with a stranger.
    - Who is there to help at a mela?
    solution: 'Step 1: Never go with a stranger. Step 2: Ask a police officer or stall keeper.'
    mistakes:
      "say yes and go along with the stranger at once": c3v2_safe
      "follow the stranger quietly without telling anyone": c3v2_safe
  - prompt: 'Puppet shows at a mela are a kind of:'
    options:
    - entertainment
    - farming
    - medicine
    answer: entertainment
    difficulty: 1
    hints:
    - People watch them for fun.
    - Like a play with dolls.
    solution: 'Step 1: Puppets act out stories. Step 2: That is entertainment.'
    mistakes:
      farming: c3v2_mela
      medicine: c3v2_mela
  - prompt: 'Buying a toy from an artisan at a mela helps:'
    options:
    - "the artisan earn a living"
    - "the toy break more quickly"
    - "the mela close down early"
    answer: the artisan earn a living
    difficulty: 2
    hints:
    - The artisan made the toy.
    - What does the money do?
    solution: 'Step 1: The money goes to the maker. Step 2: It helps them earn a living.'
    mistakes:
      "the toy break more quickly": c3v2_maker
      "the mela close down early": c3v2_maker
  - prompt: Who makes wooden toys?
    options:
    - "a toy maker who works with wood"
    - "a weaver who works on a loom"
    - "a potter who works with clay"
    answer: a toy maker who works with wood
    difficulty: 1
    hints:
    - What are these toys made of?
    - Who works with wood?
    solution: 'Step 1: The toys are wood. Step 2: A wood toy maker carves them.'
    mistakes:
      "a weaver who works on a loom": c3v2_maker
      "a potter who works with clay": c3v2_maker
  - prompt: Why should you not run in a crowded mela?
    options:
    - "you may fall, bump into people or get lost"
    - "running is not allowed anywhere at all"
    - "running fast makes all the rides stop"
    answer: you may fall, bump into people or get lost
    difficulty: 2
    hints:
    - Think of many people close together.
    - What could go wrong?
    solution: 'Step 1: Crowds are tight. Step 2: Running can cause falls, bumps and getting lost.'
    mistakes:
      "running is not allowed anywhere at all": c3v2_safe
      "running fast makes all the rides stop": c3v2_safe
  - prompt: 'Case: A family visits a mela. They see a stall of handmade clay toys and a stall of cheap plastic toys from a factory. The clay toy maker says business is slow. How can the family help the artisan?'
    options:
    - Buy a clay toy from the artisan
    - Buy only from the plastic stall
    - Tell the artisan to stop making toys
    answer: Buy a clay toy from the artisan
    hints:
    - Who made the clay toys?
    - How does an artisan earn money?
    solution: Artisans earn a living by selling what they make. Buying a clay toy from the artisan helps the artisan and the craft continue.
    mistakes:
      Buy only from the plastic stall: c3v2_maker
      Tell the artisan to stop making toys: c3v2_maker
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are at the mela with your grandparent. The giant wheel queue is very long and pushing starts. What should you do?'
    options:
    - "Hold your grandparent's hand and step away from the pushing"
    - "Push hard through the crowd to get to the front quickly"
    - "Let go of your grandparent's hand and run to another ride"
    answer: Hold your grandparent's hand and step away from the pushing
    hints:
    - Is pushing in a crowd safe?
    - What keeps you from getting lost?
    solution: Pushing in a crowd can make people fall. Holding an elder's hand and stepping away keeps you safe and together.
    mistakes:
      "Push hard through the crowd to get to the front quickly": c3v2_safe
      "Let go of your grandparent's hand and run to another ride": c3v2_safe
    exam: competency
    difficulty: 2
