# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 2
title: Going to the Mela
concepts:
- code: cbse3v.mela.fair
  title: Going to the Mela
  notes: |
    A mela (fair) brings people of a community together: stalls of toys, bangles, food, pots; rides like the giant wheel;
    artisans (potters, weavers, toy makers) selling their work; music and puppet shows. Stay with elders, hold hands in
    crowds, know what to do if lost (stay put, tell a police officer or stall keeper, know your parent's phone number).
  explanations:
    text: A mela is a big fair where people come together. There are stalls with toys, bangles, pots and tasty food, and rides like the giant wheel. Artisans sell what they make. In a crowd, always stay close to your family.
    visual: 'Draw a mela: a giant wheel, a bangle stall, a balloon seller and a family holding hands.'
    step_by_step: 1. Who comes to a mela? 2. What do people sell? 3. What can you see and do? 4. How do you stay safe?
    real_world: The Pushkar fair in Rajasthan and the Surajkund fair in Haryana are famous melas.
  picture:
    kind: flow
    steps:
    - Lost at a mela?
    - Stay where you are
    - Tell a police officer or stall keeper
    - Give your parent's name and phone number
    alt: If you are lost at a mela, stay where you are, tell a police officer or stall keeper, and give your parent's name and phone number.
  activity:
    type: sort
    prompt: What would you find at this mela stall?
    bins:
    - Toys
    - Food
    - Bangles
    - Pots
    items:
    - label: A spinning top
      bin: Toys
      clue: Something to play with.
      why: A toy.
    - label: A wooden doll
      bin: Toys
      clue: Children play with it.
      why: A toy.
    - label: Hot jalebis
      bin: Food
      clue: Sweet and tasty.
      why: Food.
    - label: Pani puri
      bin: Food
      clue: A snack to eat.
      why: Food.
    - label: Colourful glass rings for wrists
      bin: Bangles
      clue: You wear them.
      why: Bangles.
    - label: Lac bangles
      bin: Bangles
      clue: Worn on the wrist.
      why: Bangles.
    - label: Clay water pots
      bin: Pots
      clue: Made by a potter.
      why: Pots.
    - label: Clay diyas
      bin: Pots
      clue: Made from clay, like matkas.
      why: From the pottery stall.
  items:
  - prompt: 'A mela is a:'
    options:
    - fair where people come together
    - school exam
    - kind of fruit
    - hospital
    answer: fair where people come together
    difficulty: 1
    hints:
    - Stalls and rides.
    - A big gathering.
    solution: A mela is a fair.
  - prompt: Who makes clay pots sold at a mela?
    options:
    - a potter
    - a tailor
    - a pilot
    - a doctor
    answer: a potter
    difficulty: 1
    hints:
    - Works with clay.
    - On a wheel.
    solution: A potter makes clay pots.
  - prompt: 'If you get lost at a mela, you should:'
    options:
    - stay where you are and tell a police officer
    - run around looking
    - go home alone
    - go with a stranger
    answer: stay where you are and tell a police officer
    difficulty: 2
    hints:
    - Don't wander.
    - Ask a safe helper.
    solution: Stay put and tell a police officer or stall keeper.
    mistakes:
      go with a stranger: c3v_think
  - prompt: Which ride is found at many melas?
    options:
    - giant wheel
    - aeroplane
    - submarine
    - rocket
    answer: giant wheel
    difficulty: 1
    hints:
    - Goes round and up.
    - Big wheel.
    solution: The giant wheel.
  - prompt: Why is it good to know your parent's phone number?
    options:
    - so a helper can call them if you are lost
    - to play games
    - to order food
    - it is not useful
    answer: so a helper can call them if you are lost
    difficulty: 2
    hints:
    - If you are lost ...
    - Someone can call.
    solution: A helper can call your parent.
  - prompt: 'A weaver makes:'
    options:
    - cloth
    - pots
    - bread
    - shoes
    answer: cloth
    difficulty: 1
    hints:
    - Uses a loom.
    - Threads.
    solution: A weaver makes cloth.
  - prompt: 'In a crowd, it is safest to:'
    options:
    - hold an elder's hand
    - walk far ahead
    - hide under a stall
    - climb a pole
    answer: hold an elder's hand
    difficulty: 1
    hints:
    - Stay together.
    - Hand in hand.
    solution: Hold an elder's hand.
