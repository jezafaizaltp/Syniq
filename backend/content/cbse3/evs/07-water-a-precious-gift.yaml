# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 7
title: Water—A Precious Gift
tips:
  v3_precious: "'Precious' means very valuable. Could we live without water?"

concepts:
- code: cbse3v.water.save
  title: Water—A Precious Gift
  notes: |
    Unit 3: Gifts of Nature. Water comes from rain, rivers, lakes, wells, ponds, taps (from a tank or pipeline). Uses:
    drinking, cooking, bathing, washing, farming, animals. Clean water is precious; many people walk far for it. Save
    water: close taps, fix leaks, use a bucket instead of a shower, reuse water for plants, collect rainwater.
  explanations:
    text: 'Water is a precious gift. It comes from rain, rivers, lakes and wells. We need it to drink, cook, wash and grow food. Clean water is not endless, so we must save it: close taps, fix leaks and collect rainwater.'
    visual: Draw a dripping tap with a sad face and a closed tap with a happy face.
    step_by_step: 1. Where does water come from? 2. How do we use it? 3. How can we save it?
    real_world: In many villages, families collect rainwater from roofs in tanks to use later.
  picture:
    kind: compare
    columns:
    - title: Wastes water
      points:
      - leaving the tap on while brushing
      - a leaking tap
    - title: Saves water
      points:
      - using a mug while brushing
      - fixing the leak
    alt: Leaving the tap on and leaking taps waste water; using a mug and fixing leaks save it.
  activity:
    type: sort
    prompt: Does it save water or waste it?
    bins:
    - Saves water
    - Wastes water
    items:
    - label: Closing the tap while brushing
      bin: Saves water
      clue: Water doesn't run away.
      why: Saves.
    - label: Telling an adult about a leaking tap
      bin: Saves water
      clue: It can be fixed.
      why: Saves.
    - label: Watering plants with water left in your bottle
      bin: Saves water
      clue: Used again.
      why: Saves.
    - label: Collecting rain in a bucket
      bin: Saves water
      clue: Water from the sky.
      why: Saves.
    - label: Playing with the hose pipe
      bin: Wastes water
      clue: Water runs out on the ground.
      why: Wastes.
    - label: Leaving the tap open
      bin: Wastes water
      clue: Water goes down the drain.
      why: Wastes.
    - label: Throwing away a half-full water bottle
      bin: Wastes water
      clue: Clean water thrown out.
      why: Wastes.
  items:
  - prompt: Where does most of our water first come from?
    options:
    - rain
    - shops
    - trees
    - fire
    answer: rain
    difficulty: 1
    hints:
    - It falls from clouds.
    - Fills rivers and wells.
    solution: Water comes from rain.
    mistakes: {"shops": "v5_rain"}
  - prompt: Which saves water?
    options:
    - closing the tap while brushing
    - leaving the tap running
    - playing with the hose for fun
    - letting a tap leak
    answer: closing the tap while brushing
    difficulty: 1
    hints:
    - Use only what you need.
    - Turn it off.
    solution: Close the tap while brushing.
    mistakes:
      leaving the tap running: c3v_think
  - prompt: A tap keeps dripping. What should we do?
    options:
    - get it fixed
    - ignore it
    - open it more
    - put a toy under it
    answer: get it fixed
    difficulty: 1
    hints:
    - Drops add up.
    - Repair.
    solution: Get the leak fixed.
    mistakes: {"ignore it": "v5_drip"}
  - prompt: 'Collecting rainwater from roofs is called:'
    options:
    - rainwater harvesting
    - rain dancing
    - cloud making
    - water wasting
    answer: rainwater harvesting
    difficulty: 2
    hints:
    - Harvest means collect.
    - Rain.
    solution: It is rainwater harvesting.
    mistakes: {"rain dancing": "v5_harvest"}
  - prompt: 'Water used to wash vegetables can be reused to:'
    options:
    - water plants
    - drink
    - cook rice
    - brush teeth
    answer: water plants
    difficulty: 2
    hints:
    - It is not dirty with soap.
    - Plants like it.
    solution: It can water plants.
    mistakes: {"drink": "v5_reuse"}
  - prompt: Why is water called precious?
    options:
    - we cannot live without it and clean water is limited
    - it is gold coloured
    - it is very heavy
    - it is sold in shops only
    answer: we cannot live without it and clean water is limited
    difficulty: 2
    hints:
    - Can we live without water?
    - Not endless.
    solution: We need it to live, and clean water is limited.
    mistakes: {"it is gold coloured": "v3_precious"}
  - prompt: Which is a source of water?
    options:
    - well
    - chair
    - pencil
    - road
    answer: well
    difficulty: 1
    hints:
    - Water comes up from it.
    - Bucket and rope.
    solution: A well is a source of water.
    mistakes: {"chair": "v5_source"}
