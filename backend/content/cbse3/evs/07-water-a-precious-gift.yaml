# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 7
title: Water—A Precious Gift
tips:
  v3_precious: "'Precious' means very valuable. Could we live without water?"
  c3v7_source: 'Trace the water back: before it reached the tap or bucket, where did it come from?'
  c3v7_save: 'Ask: which choice lets less water run away unused?'
  c3v7_use: Think of your whole day, from brushing to dinner. Where is water used?

concepts:
- code: cbse3v.water.save
  title: Water—A Precious Gift
  notes: |
    Unit 3: Gifts of Nature. Water comes from rain, rivers, lakes, wells, ponds, taps (from a tank or pipeline). Uses:
    drinking, cooking, bathing, washing, farming, animals. Clean water is precious; many people walk far for it. Save
    water: close taps, fix leaks, use a bucket instead of a shower, reuse water for plants, collect rainwater.
  explanations:
    text: 'Water is a precious gift. It comes from rain, rivers, lakes and wells. We need it to drink, cook, wash and grow food. Clean water is not endless, so we must save it: close taps, fix leaks and collect rainwater.'
    visual: Draw a dripping tap with a sad face and a closed tap with a happy face.
    step_by_step: 1. Where does water come from? 2. How do we use it? 3. How can we save it?
    real_world: In many villages, families collect rainwater from roofs in tanks to use later.
  picture:
    kind: compare
    columns:
    - title: Wastes water
      points:
      - leaving the tap on while brushing
      - a leaking tap
    - title: Saves water
      points:
      - using a mug while brushing
      - fixing the leak
    alt: Leaving the tap on and leaking taps waste water; using a mug and fixing leaks save it.
  activity:
    type: sort
    prompt: Does it save water or waste it?
    bins:
    - Saves water
    - Wastes water
    items:
    - label: Closing the tap while brushing
      bin: Saves water
      clue: Water doesn't run away.
      why: Saves.
    - label: Telling an adult about a leaking tap
      bin: Saves water
      clue: It can be fixed.
      why: Saves.
    - label: Watering plants with water left in your bottle
      bin: Saves water
      clue: Used again.
      why: Saves.
    - label: Collecting rain in a bucket
      bin: Saves water
      clue: Water from the sky.
      why: Saves.
    - label: Playing with the hose pipe
      bin: Wastes water
      clue: Water runs out on the ground.
      why: Wastes.
    - label: Leaving the tap open
      bin: Wastes water
      clue: Water goes down the drain.
      why: Wastes.
    - label: Throwing away a half-full water bottle
      bin: Wastes water
      clue: Clean water thrown out.
      why: Wastes.
  lesson:
    - teach: Water comes from rain. Rainwater fills rivers, lakes and ponds, and soaks into the ground where wells reach it. Taps bring water from a tank or a pipeline that takes it from these sources.
      picture:
        kind: flow
        steps:
        - rain
        - rivers, lakes, ground
        - tank or pipeline
        - our taps
        alt: Water travels from rain to rivers and ground, then to tanks and taps.
      check:
        prompt: Where does the water in rivers and wells first come from?
        options:
        - rain
        - the tap
        - the bucket
        answer: rain
        why: Rain fills rivers and soaks down to wells.
    - teach: We use water for drinking, cooking, bathing, washing, growing crops and giving animals a drink. No living thing can live without water.
      check:
        prompt: Which needs water?
        options:
        - plants, animals and people
        - only people
        - only fish
        answer: plants, animals and people
        why: All living things need water.
    - teach: 'Clean water is precious: in many places people walk far to fetch it. Save water: close taps, fix leaks, bathe with a bucket, reuse water from washing vegetables for plants, and collect rainwater.'
      check:
        prompt: Which of these saves water?
        options:
        - closing the tap while brushing
        - leaving a tap dripping
        - washing a scooter with a running hose
        answer: closing the tap while brushing
        why: Water does not run away while you brush.
  items:
  - prompt: Where does most of our water first come from?
    options:
    - rain
    - shops
    - trees
    - fire
    answer: rain
    difficulty: 1
    hints:
    - It falls from clouds.
    - Fills rivers and wells.
    solution: Water comes from rain.
    mistakes: {"shops": "v5_rain"}
  - prompt: Which saves water?
    options:
    - closing the tap while brushing
    - leaving the tap running
    - playing with the hose for fun
    - letting a tap leak
    answer: closing the tap while brushing
    difficulty: 1
    hints:
    - Use only what you need.
    - Turn it off.
    solution: Close the tap while brushing.
    mistakes:
      leaving the tap running: c3v_think
  - prompt: A tap keeps dripping. What should we do?
    options:
    - get it fixed
    - ignore it
    - open it more
    - put a toy under it
    answer: get it fixed
    difficulty: 1
    hints:
    - Drops add up.
    - Repair.
    solution: Get the leak fixed.
    mistakes: {"ignore it": "v5_drip"}
  - prompt: 'Collecting rainwater from roofs is called:'
    options:
    - rainwater harvesting
    - rain dancing
    - cloud making
    - water wasting
    answer: rainwater harvesting
    difficulty: 2
    hints:
    - Harvest means collect.
    - Rain.
    solution: It is rainwater harvesting.
    mistakes: {"rain dancing": "v5_harvest"}
  - prompt: 'Water used to wash vegetables can be reused to:'
    options:
    - water plants
    - drink
    - cook rice
    - brush teeth
    answer: water plants
    difficulty: 2
    hints:
    - It is not dirty with soap.
    - Plants like it.
    solution: It can water plants.
    mistakes: {"drink": "v5_reuse"}
  - prompt: Why is water called precious?
    options:
    - we cannot live without it and clean water is limited
    - it is gold coloured
    - it is very heavy
    - it is sold in shops only
    answer: we cannot live without it and clean water is limited
    difficulty: 2
    hints:
    - Can we live without water?
    - Not endless.
    solution: We need it to live, and clean water is limited.
    mistakes: {"it is gold coloured": "v3_precious"}
  - prompt: Which is a source of water?
    options:
    - well
    - chair
    - pencil
    - road
    answer: well
    difficulty: 1
    hints:
    - Water comes up from it.
    - Bucket and rope.
    solution: A well is a source of water.
    mistakes: {"chair": "v5_source"}
  - prompt: Why do some people in villages walk far every day?
    options:
    - to fetch water from a well or hand pump
    - to buy toys
    - to find snow
    answer: to fetch water from a well or hand pump
    difficulty: 2
    hints:
    - Not every home has a tap.
    - What do families need every day?
    solution: 'Step 1: Some homes have no tap. Step 2: People walk to a well or pump to fetch water.'
    mistakes:
      to buy toys: c3v7_use
      to find snow: c3v7_source
  - prompt: Which gets its water from under the ground?
    options:
    - a well
    - a rain cloud
    - a roof
    answer: a well
    difficulty: 1
    hints:
    - Rain soaks deep into the soil.
    - What is dug down to reach it?
    solution: 'Step 1: Rainwater soaks into the ground. Step 2: A well is dug to reach it.'
    mistakes:
      a rain cloud: c3v7_source
      a roof: c3v7_source
  - prompt: Why do farmers need water?
    options:
    - to grow crops
    - to paint houses
    - to make the soil hard
    answer: to grow crops
    difficulty: 1
    hints:
    - Fields have plants.
    - What do plants need?
    solution: 'Step 1: Crops are plants. Step 2: They need water to grow.'
    mistakes:
      to paint houses: c3v7_use
      to make the soil hard: c3v7_use
  - prompt: Which way of bathing uses less water?
    options:
    - a bucket and mug
    - a shower left running
    - filling a bathtub
    answer: a bucket and mug
    difficulty: 2
    hints:
    - A bucket holds a fixed amount.
    - A running shower keeps going.
    solution: 'Step 1: A bucket has a set amount. Step 2: So it uses less water.'
    mistakes:
      a shower left running: c3v7_save
      filling a bathtub: c3v7_save
  - prompt: Which way of washing a car or scooter wastes the least water?
    options:
    - a bucket and a cloth
    - a hose running the whole time
    - pouring water from the tank top
    answer: a bucket and a cloth
    difficulty: 2
    hints:
    - A hose keeps flowing.
    - Which has a fixed amount?
    solution: 'Step 1: A hose runs non-stop. Step 2: A bucket and cloth use only what is in the bucket.'
    mistakes:
      a hose running the whole time: c3v7_save
      pouring water from the tank top: c3v7_save
  - prompt: 'Animals at a farm need water for:'
    options:
    - drinking and keeping cool
    - reading
    - playing cards
    answer: drinking and keeping cool
    difficulty: 1
    hints:
    - Animals are living things.
    - Think of a buffalo in a pond.
    solution: 'Step 1: Animals drink water. Step 2: Some, like buffaloes, cool off in it too.'
    mistakes:
      reading: c3v7_use
      playing cards: c3v7_use
  - prompt: A school tank overflows every morning. What should be done?
    options:
    - switch off the pump in time
    - let it overflow
    - open more taps to use it up
    answer: switch off the pump in time
    difficulty: 3
    hints:
    - Overflow water runs away.
    - What fills the tank?
    solution: 'Step 1: The pump keeps filling after the tank is full. Step 2: Switch it off in time.'
    mistakes:
      let it overflow: c3v7_save
      open more taps to use it up: c3v7_save
  - prompt: A family uses a bucket of 20 litres instead of a 60-litre shower each day. How many litres do they save each day?
    answer: '40'
    check: 60-20
    difficulty: 3
    hints:
    - Shower water minus bucket water.
    - 60 − 20.
    solution: 'Step 1: 60 − 20. Step 2: = 40 litres saved.'
    mistakes:
      '80': c3v7_save
      '20': c3v7_save
