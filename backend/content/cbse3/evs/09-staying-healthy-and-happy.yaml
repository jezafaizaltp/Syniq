# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 9
title: Staying Healthy and Happy
tips:
  v3_happy: "Which choice makes you and others feel good?"
  v3_nails: "Dirt gets stuck under long nails. Then it goes into our food."
  v3_soap: "Soap washes away tiny things we can't see that can make us ill."
  v3_talk: "Sharing a worry with someone who cares makes it lighter."

concepts:
- code: cbse3v.health.habits
  title: Staying Healthy and Happy
  notes: |
    Healthy habits: brush teeth twice, bathe daily, trim nails, wash hands with soap, eat healthy food, drink clean water,
    play outdoors, sleep well (about 10 hours for this age). Happy habits: share feelings, play with friends, help others.
    Tell a trusted adult if something feels wrong. Yoga and exercise keep the body strong.
  explanations:
    text: To stay healthy, brush your teeth twice a day, bathe, wash hands with soap, eat good food, play outside and sleep well. To stay happy, play with friends, talk about your feelings and help others.
    visual: 'Draw a daily chart: brushing in the morning, playing in the evening, sleeping at night.'
    step_by_step: 1. Keep clean. 2. Eat well. 3. Play and move. 4. Sleep well. 5. Share feelings.
    real_world: Many schools start the day with yoga or a morning assembly exercise.
  picture:
    kind: flow
    steps:
    - Wake up and brush
    - Bathe and eat breakfast
    - Learn and play
    - Wash hands, eat dinner
    - Brush and sleep
    alt: 'A healthy day: wake up and brush, bathe and eat breakfast, learn and play, wash hands and eat dinner, then brush and sleep.'
  activity:
    type: sort
    prompt: Is it a healthy habit?
    bins:
    - Healthy
    - Not healthy
    items:
    - label: Brushing teeth in the morning and at night
      bin: Healthy
      clue: Keeps teeth clean.
      why: Healthy.
    - label: Washing hands with soap before eating
      bin: Healthy
      clue: Removes germs.
      why: Healthy.
    - label: Playing outside
      bin: Healthy
      clue: Moves your body.
      why: Healthy.
    - label: Sleeping early
      bin: Healthy
      clue: Your body rests.
      why: Healthy.
    - label: Eating chips instead of lunch
      bin: Not healthy
      clue: Little goodness.
      why: Not healthy.
    - label: Not bathing for days
      bin: Not healthy
      clue: Germs and smell.
      why: Not healthy.
    - label: Watching TV till late at night
      bin: Not healthy
      clue: Less sleep.
      why: Not healthy.
  items:
  - prompt: How many times a day should we brush our teeth?
    options:
    - twice
    - never
    - once a week
    - ten times
    answer: twice
    difficulty: 1
    hints:
    - Morning and night.
    - Two.
    solution: Brush twice a day.
    mistakes: {"once a week": "v4_brush"}
  - prompt: Why should we wash hands with soap?
    options:
    - to remove germs
    - to make them blue
    - to waste water
    - to grow taller
    answer: to remove germs
    difficulty: 1
    hints:
    - Tiny things that make us sick.
    - Soap.
    solution: Soap removes germs.
    mistakes: {"to make them blue": "v3_soap"}
  - prompt: Which is a healthy habit?
    options:
    - playing outdoors
    - watching TV all day
    - skipping meals
    - sleeping very late every night
    answer: playing outdoors
    difficulty: 1
    hints:
    - Move your body.
    - Fresh air.
    solution: Playing outdoors is healthy.
    mistakes:
      watching TV all day: c3v_think
  - prompt: 'When you feel sad or worried, it helps to:'
    options:
    - talk to someone you trust
    - keep it a secret forever
    - shout at friends
    - stop eating
    answer: talk to someone you trust
    difficulty: 2
    hints:
    - Share feelings.
    - Parent, teacher.
    solution: Talking to someone you trust helps.
    mistakes: {"keep it a secret forever": "v3_talk"}
  - prompt: 'Long nails can:'
    options:
    - collect dirt and germs
    - make you run faster
    - help you read
    - keep you warm
    answer: collect dirt and germs
    difficulty: 2
    hints:
    - Look under them.
    - Dirt hides.
    solution: Long nails collect dirt and germs.
    mistakes: {"make you run faster": "v3_nails"}
  - prompt: Children of your age need about how much sleep each night?
    options:
    - about 10 hours
    - 1 hour
    - no sleep
    - 20 hours
    answer: about 10 hours
    difficulty: 2
    hints:
    - Quite a lot.
    - Growing bodies.
    solution: About 10 hours.
    mistakes: {"1 hour": "v4_sleep"}
  - prompt: Which helps us stay happy?
    options:
    - playing and sharing with friends
    - being alone and angry all the time
    - teasing others
    - breaking toys
    answer: playing and sharing with friends
    difficulty: 1
    hints:
    - Friends.
    - Kind.
    solution: Playing and sharing makes us happy.
    mistakes: {"teasing others": "v3_happy"}
