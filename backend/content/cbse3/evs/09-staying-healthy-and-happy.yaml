# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 9
title: Staying Healthy and Happy
tips:
  v3_happy: "Which choice makes you and others feel good?"
  v3_nails: "Dirt gets stuck under long nails. Then it goes into our food."
  v3_soap: "Soap washes away tiny things we can't see that can make us ill."
  v3_talk: "Sharing a worry with someone who cares makes it lighter."
  c3v9_clean: 'Ask: which choice washes germs away or stops them from spreading?'
  c3v9_body: 'Think what your body needs to grow strong: food, rest, play.'
  c3v9_feel: Think who you trust and how sharing a feeling can make it lighter.

concepts:
- code: cbse3v.health.habits
  title: Staying Healthy and Happy
  notes: |
    Healthy habits: brush teeth twice, bathe daily, trim nails, wash hands with soap, eat healthy food, drink clean water,
    play outdoors, sleep well (about 10 hours for this age). Happy habits: share feelings, play with friends, help others.
    Tell a trusted adult if something feels wrong. Yoga and exercise keep the body strong.
  explanations:
    text: To stay healthy, brush your teeth twice a day, bathe, wash hands with soap, eat good food, play outside and sleep well. To stay happy, play with friends, talk about your feelings and help others.
    visual: 'Draw a daily chart: brushing in the morning, playing in the evening, sleeping at night.'
    step_by_step: 1. Keep clean. 2. Eat well. 3. Play and move. 4. Sleep well. 5. Share feelings.
    real_world: Many schools start the day with yoga or a morning assembly exercise.
  picture:
    kind: flow
    steps:
    - Wake up and brush
    - Bathe and eat breakfast
    - Learn and play
    - Wash hands, eat dinner
    - Brush and sleep
    alt: 'A healthy day: wake up and brush, bathe and eat breakfast, learn and play, wash hands and eat dinner, then brush and sleep.'
  activity:
    type: sort
    prompt: Is it a healthy habit?
    bins:
    - Healthy
    - Not healthy
    items:
    - label: Brushing teeth in the morning and at night
      bin: Healthy
      clue: Keeps teeth clean.
      why: Healthy.
    - label: Washing hands with soap before eating
      bin: Healthy
      clue: Removes germs.
      why: Healthy.
    - label: Playing outside
      bin: Healthy
      clue: Moves your body.
      why: Healthy.
    - label: Sleeping early
      bin: Healthy
      clue: Your body rests.
      why: Healthy.
    - label: Eating chips instead of lunch
      bin: Not healthy
      clue: Little goodness.
      why: Not healthy.
    - label: Not bathing for days
      bin: Not healthy
      clue: Germs and smell.
      why: Not healthy.
    - label: Watching TV till late at night
      bin: Not healthy
      clue: Less sleep.
      why: Not healthy.
  lesson:
    - teach: Keeping clean keeps germs away. Brush your teeth twice a day, bathe daily, keep nails short, and wash hands with soap before eating and after using the toilet.
      picture:
        kind: flow
        steps:
        - wet hands
        - rub with soap
        - scrub between fingers and nails
        - rinse
        - dry
        alt: Steps to wash hands well.
      check:
        prompt: Why do we wash hands with soap before eating?
        options:
        - to remove germs
        - to make hands cold
        - to make food salty
        answer: to remove germs
        why: Soap washes off germs that could go into our food.
      ways:
      - style: step_by_step
        teach: 'Brush your teeth well. Step 1: Put a pea-sized bit of toothpaste on the brush. Step 2: Brush the front, the back and the top of every tooth. Step 3: Brush for about two minutes. Step 4: Rinse your mouth with clean water.'
      - style: real_world
        teach: Germs are too small to see. After a child plays in the mud, the hands look only a little dirty, but they carry many germs. Soap and water wash them away before they reach the mouth.
    - teach: A strong body needs healthy food, clean water, outdoor play and enough sleep. Children of your age need about 10 hours of sleep. Exercise and yoga keep the body fit.
      check:
        prompt: About how many hours of sleep do children of your age need?
        options:
        - about 10
        - about 2
        - about 20
        answer: about 10
        why: Growing bodies need long, good sleep.
      ways:
      - style: visual
        teach: Four things a strong body needs every day.
        picture:
          kind: compare
          columns:
          - title: Food and water
            points:
            - Healthy food
            - Clean water
          - title: Play
            points:
            - Outdoor games
            - Exercise or yoga
          - title: Rest
            points:
            - About 10 hours of sleep
          alt: A strong body needs healthy food and clean water, outdoor games and exercise or yoga, and about 10 hours of sleep for children of your age.
      - style: real_world
        teach: When a child sleeps very late, the next day at school they may yawn, find it hard to listen and feel cranky. Enough sleep helps both the body and the mind.
    - teach: 'Being happy matters too. Play with friends, help others, and share your feelings. If something feels wrong or scary, tell a trusted adult: a parent, a teacher or an elder.'
      check:
        prompt: Someone makes you feel unsafe. What should you do?
        options:
        - tell a trusted adult
        - keep it a secret
        - feel bad alone
        answer: tell a trusted adult
        why: A trusted adult can help keep you safe.
      ways:
      - style: visual
        teach: Feelings, and something that can help with each one.
        picture:
          kind: compare
          columns:
          - title: Feeling
            points:
            - Sad
            - Angry
            - Scared
          - title: What can help
            points:
            - Talk to a friend or elder
            - Breathe slowly and count to ten
            - Tell a trusted adult
          alt: When you feel sad, talk to a friend or an elder. When you feel angry, breathe slowly and count to ten. When you feel scared, tell a trusted adult.
      - style: step_by_step
        teach: 'Calm down when you feel angry. Step 1: Stop what you are doing. Step 2: Breathe in slowly through your nose. Step 3: Breathe out slowly through your mouth. Step 4: Count to ten, then say how you feel in words.'
  items:
  - prompt: How many times a day should we brush our teeth?
    options:
    - twice
    - never
    - once a week
    - ten times
    answer: twice
    difficulty: 1
    hints:
    - Morning and night.
    - Two.
    solution: Brush twice a day.
    mistakes: {"once a week": "v4_brush"}
  - prompt: Why should we wash hands with soap?
    options:
    - to remove germs
    - to make them blue
    - to waste water
    - to grow taller
    answer: to remove germs
    difficulty: 1
    hints:
    - Tiny things that make us sick.
    - Soap.
    solution: Soap removes germs.
    mistakes: {"to make them blue": "v3_soap"}
  - prompt: Which is a healthy habit?
    options:
    - playing outdoors
    - watching TV all day
    - skipping meals
    - sleeping very late every night
    answer: playing outdoors
    difficulty: 1
    hints:
    - Move your body.
    - Fresh air.
    solution: Playing outdoors is healthy.
    mistakes:
      watching TV all day: c3v_think
  - prompt: 'When you feel sad or worried, it helps to:'
    options:
    - talk to someone you trust
    - keep it a secret forever
    - shout at friends
    - stop eating
    answer: talk to someone you trust
    difficulty: 2
    hints:
    - Share feelings.
    - Parent, teacher.
    solution: Talking to someone you trust helps.
    mistakes: {"keep it a secret forever": "v3_talk"}
  - prompt: 'Long nails can:'
    options:
    - collect dirt and germs
    - make you run faster
    - help you read
    - keep you warm
    answer: collect dirt and germs
    difficulty: 2
    hints:
    - Look under them.
    - Dirt hides.
    solution: Long nails collect dirt and germs.
    mistakes: {"make you run faster": "v3_nails"}
  - prompt: Children of your age need about how much sleep each night?
    options:
    - about 10 hours
    - 1 hour
    - no sleep
    - 20 hours
    answer: about 10 hours
    difficulty: 2
    hints:
    - Quite a lot.
    - Growing bodies.
    solution: About 10 hours.
    mistakes: {"1 hour": "v4_sleep"}
  - prompt: Which helps us stay happy?
    options:
    - playing and sharing with friends
    - being alone and angry all the time
    - teasing others
    - breaking toys
    answer: playing and sharing with friends
    difficulty: 1
    hints:
    - Friends.
    - Kind.
    solution: Playing and sharing makes us happy.
    mistakes: {"teasing others": "v3_happy"}
  - prompt: When should you wash your hands with soap?
    options:
    - after using the toilet and before eating
    - only on Sundays
    - only when they look dirty
    answer: after using the toilet and before eating
    difficulty: 1
    hints:
    - Germs are not always seen.
    - Think of times germs reach hands or food.
    solution: 'Step 1: Germs get on hands in the toilet. Step 2: Wash after the toilet and before eating.'
    mistakes:
      only on Sundays: c3v9_clean
      only when they look dirty: c3v9_clean
  - prompt: Which is a good way to calm down when you feel angry?
    options:
    - take slow deep breaths and count to ten
    - shout at everyone
    - hit a friend
    answer: take slow deep breaths and count to ten
    difficulty: 2
    hints:
    - Anger cools if you slow down.
    - Which choice hurts no one?
    solution: 'Step 1: Slow breathing calms the body. Step 2: Then you can talk about the problem.'
    mistakes:
      shout at everyone: c3v9_feel
      hit a friend: c3v9_feel
  - prompt: Which is a healthy snack?
    options:
    - a banana
    - a packet of chips every day
    - a fizzy drink
    answer: a banana
    difficulty: 1
    hints:
    - Which one is a fruit?
    - Fresh food is best.
    solution: 'Step 1: Chips and fizzy drinks have lots of salt or sugar. Step 2: A banana is healthy.'
    mistakes:
      a packet of chips every day: c3v9_body
      a fizzy drink: c3v9_body
  - prompt: You feel sad after a fight with a friend. What can help?
    options:
    - talk about it and make up
    - never speak to anyone again
    - break things
    answer: talk about it and make up
    difficulty: 1
    hints:
    - Sharing feelings helps.
    - Friends can fix a fight.
    solution: 'Step 1: Talking helps feelings. Step 2: Making up brings the friendship back.'
    mistakes:
      never speak to anyone again: c3v9_feel
      break things: c3v9_feel
  - prompt: Why should we cover our mouth when we sneeze?
    options:
    - to stop germs spreading to others
    - to look funny
    - to stop the sneeze
    answer: to stop germs spreading to others
    difficulty: 2
    hints:
    - Sneezes spray tiny drops.
    - Who might catch your cold?
    solution: 'Step 1: Sneezes spread germs. Step 2: Covering stops them reaching others.'
    mistakes:
      to look funny: c3v9_clean
      to stop the sneeze: c3v9_clean
  - prompt: Which keeps your body strong?
    options:
    - playing outdoors every day
    - watching TV all day
    - skipping meals
    answer: playing outdoors every day
    difficulty: 1
    hints:
    - Your body likes to move.
    - Which one makes you run?
    solution: 'Step 1: Moving makes muscles and bones strong. Step 2: Outdoor play helps.'
    mistakes:
      watching TV all day: c3v9_body
      skipping meals: c3v9_body
  - prompt: 'Drinking water should be:'
    options:
    - clean, boiled or filtered
    - from any puddle
    - left open for flies
    answer: clean, boiled or filtered
    difficulty: 2
    hints:
    - Dirty water can make you sick.
    - How is water made safe?
    solution: 'Step 1: Dirty water has germs. Step 2: Boiling or filtering makes it safe.'
    mistakes:
      from any puddle: c3v9_clean
      left open for flies: c3v9_clean
  - prompt: A child sleeps at 9 at night and wakes at 7 in the morning. How many hours of sleep is that?
    answer: '10'
    check: 3+7
    difficulty: 3
    hints:
    - 9 to 12 midnight is 3 hours.
    - Then 12 to 7.
    solution: 'Step 1: 9 → 12 is 3 hours, 12 → 7 is 7 hours. Step 2: 3 + 7 = 10 hours.'
    mistakes:
      '2': c3v9_body
      '16': c3v9_body
  - prompt: 'Case: A child often has a stomach ache. The child eats snacks straight after playing in the mud, without washing, and the nails are long and dirty. What change would help most?'
    options:
    - Wash hands with soap before eating and keep nails short and clean
    - Eat more snacks
    - Play only indoors and never wash
    answer: Wash hands with soap before eating and keep nails short and clean
    hints:
    - Where could the germs be coming from?
    - What removes germs from hands and nails?
    solution: Dirty hands and long nails carry germs into the mouth while eating. Washing with soap and keeping nails short stops this.
    mistakes:
      Eat more snacks: c3v9_clean
      Play only indoors and never wash: c3v9_clean
    exam: case
    difficulty: 2
  - prompt: 'Situation: An older child at the bus stop keeps saying mean things to you and makes you feel scared. What should you do?'
    options:
    - Tell a trusted adult like a parent or teacher
    - Keep it a secret
    - Say mean things back
    answer: Tell a trusted adult like a parent or teacher
    hints:
    - Is this something you should handle alone?
    - Who can help keep you safe?
    solution: If something feels wrong or scary, tell a trusted adult. They can help make it stop.
    mistakes:
      Keep it a secret: c3v9_feel
      Say mean things back: c3v9_feel
    exam: competency
    difficulty: 2
