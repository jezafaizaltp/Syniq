# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 10
title: This World of Things
concepts:
- code: cbse3v.things.materials
  title: This World of Things
  notes: |
    Unit 4: Things Around Us. Things are made of materials: wood (chair, door), metal (spoon, key), plastic (bucket),
    glass (bottle, window), clay (pot, diya), cloth (shirt), paper (book). Materials can be hard/soft, rough/smooth,
    see-through/not, can break or bend. Some things are natural (stone, wood, cotton), others made by people (plastic).
  explanations:
    text: 'Everything around us is made of some material: wood, metal, plastic, glass, clay, cloth or paper. Materials can be hard or soft, rough or smooth, and some let light through, like glass. Some come from nature; some are made by people.'
    visual: Draw a chair (wood), a spoon (metal), a bottle (glass) and a pot (clay), and label the material.
    step_by_step: '1. Look at the thing. 2. Feel it: hard, soft, rough, smooth? 3. Can you see through it? 4. Name the material.'
    real_world: Kitchens have steel vessels, clay pots, glass jars and wooden spoons.
  picture:
    kind: compare
    columns:
    - title: Material
      points:
      - Wood
      - Metal
      - Glass
    - title: Example
      points:
      - chair, door
      - spoon, key
      - window, bottle
    alt: Wood makes chairs and doors, metal makes spoons and keys, and glass makes windows and bottles.
  activity:
    type: sort
    prompt: What is it made of?
    bins:
    - Wood
    - Metal
    - Plastic
    - Glass
    - Cloth
    items:
    - label: A table
      bin: Wood
      clue: From a tree.
      why: Wood.
    - label: A pencil
      bin: Wood
      clue: Sharpen it and see the shavings.
      why: Wood.
    - label: A spoon
      bin: Metal
      clue: Shiny and hard.
      why: Metal.
    - label: A key
      bin: Metal
      clue: Cold and shiny.
      why: Metal.
    - label: A water bottle that doesn't break
      bin: Plastic
      clue: Light and bendy.
      why: Plastic.
    - label: A bucket
      bin: Plastic
      clue: Light and smooth.
      why: Plastic.
    - label: A mirror
      bin: Glass
      clue: Breaks if dropped.
      why: Glass.
    - label: A towel
      bin: Cloth
      clue: Soft and soaks up water.
      why: Cloth.
  items:
  - prompt: 'A spoon is usually made of:'
    options:
    - metal
    - paper
    - cloth
    - clay only
    answer: metal
    difficulty: 1
    hints:
    - Shiny and hard.
    - Steel.
    solution: A spoon is metal.
  - prompt: Which material can you see through?
    options:
    - glass
    - wood
    - stone
    - brick
    answer: glass
    difficulty: 1
    hints:
    - Windows.
    - Clear.
    solution: Glass is see-through.
  - prompt: 'A diya is made of:'
    options:
    - clay
    - plastic
    - glass
    - cloth
    answer: clay
    difficulty: 1
    hints:
    - The potter makes it.
    - Soil.
    solution: A diya is made of clay.
  - prompt: Which material is soft?
    options:
    - cotton
    - stone
    - iron
    - glass
    answer: cotton
    difficulty: 1
    hints:
    - Pillows.
    - Fluffy.
    solution: Cotton is soft.
  - prompt: Which material comes from nature?
    options:
    - wood
    - plastic
    - nylon
    - polythene
    answer: wood
    difficulty: 2
    hints:
    - From trees.
    - Not made in a factory.
    solution: Wood comes from trees.
    mistakes:
      plastic: c3v_reread
  - prompt: Why are windows made of glass?
    options:
    - light can pass through it
    - it is soft
    - it is cheap paper
    - it bends easily
    answer: light can pass through it
    difficulty: 2
    hints:
    - See outside.
    - Light comes in.
    solution: Glass lets light in.
  - prompt: 'A notebook is made of:'
    options:
    - paper
    - metal
    - clay
    - glass
    answer: paper
    difficulty: 1
    hints:
    - Pages.
    - From wood pulp.
    solution: A notebook is paper.
