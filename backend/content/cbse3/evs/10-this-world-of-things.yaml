# CBSE Class 3 Environmental Studies (NCERT Our Wondrous World, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-evs
chapter: 10
title: This World of Things
tips:
  v3_notebook: "You write on its pages with a pencil. They are made from wood pulp."
  v3_soft: "Which one would feel nice in a pillow?"
  v3_spoon: "A spoon must be hard and not melt in hot food. Most are shiny."
  c3v10_mat: 'Picture the thing in your hand: is it cold and shiny, light and bendy, hard and brown, or see-through?'
  c3v10_prop: 'Think what you could do with it: bend it, see through it, scratch it, drop it?'
  c3v10_why: Ask what job the thing does, and which material is best for that job.

concepts:
- code: cbse3v.things.materials
  title: This World of Things
  notes: |
    Unit 4: Things Around Us. Things are made of materials: wood (chair, door), metal (spoon, key), plastic (bucket),
    glass (bottle, window), clay (pot, diya), cloth (shirt), paper (book). Materials can be hard/soft, rough/smooth,
    see-through/not, can break or bend. Some things are natural (stone, wood, cotton), others made by people (plastic).
  explanations:
    text: 'Everything around us is made of some material: wood, metal, plastic, glass, clay, cloth or paper. Materials can be hard or soft, rough or smooth, and some let light through, like glass. Some come from nature; some are made by people.'
    visual: Draw a chair (wood), a spoon (metal), a bottle (glass) and a pot (clay), and label the material.
    step_by_step: '1. Look at the thing. 2. Feel it: hard, soft, rough, smooth? 3. Can you see through it? 4. Name the material.'
    real_world: Kitchens have steel vessels, clay pots, glass jars and wooden spoons.
  picture:
    kind: compare
    columns:
    - title: Material
      points:
      - Wood
      - Metal
      - Glass
    - title: Example
      points:
      - chair, door
      - spoon, key
      - window, bottle
    alt: Wood makes chairs and doors, metal makes spoons and keys, and glass makes windows and bottles.
  activity:
    type: sort
    prompt: What is it made of?
    bins:
    - Wood
    - Metal
    - Plastic
    - Glass
    - Cloth
    items:
    - label: A table
      bin: Wood
      clue: From a tree.
      why: Wood.
    - label: A pencil
      bin: Wood
      clue: Sharpen it and see the shavings.
      why: Wood.
    - label: A spoon
      bin: Metal
      clue: Shiny and hard.
      why: Metal.
    - label: A key
      bin: Metal
      clue: Cold and shiny.
      why: Metal.
    - label: A water bottle that doesn't break
      bin: Plastic
      clue: Light and bendy.
      why: Plastic.
    - label: A bucket
      bin: Plastic
      clue: Light and smooth.
      why: Plastic.
    - label: A mirror
      bin: Glass
      clue: Breaks if dropped.
      why: Glass.
    - label: A towel
      bin: Cloth
      clue: Soft and soaks up water.
      why: Cloth.
  lesson:
    - teach: Everything around us is made of some material. A chair may be wood, a key is metal, a bucket is plastic, a bottle is glass, a pot is clay, a shirt is cloth, a book is paper.
      picture:
        kind: compare
        columns:
        - title: Wood
          points:
          - chair
          - door
        - title: Metal
          points:
          - key
          - spoon
        - title: Glass
          points:
          - bottle
          - window
        alt: Things made of wood, metal and glass.
      check:
        prompt: 'A key is usually made of:'
        options:
        - metal
        - paper
        - cloth
        answer: metal
        why: Keys must be strong and hard to bend.
      ways:
      - style: step_by_step
        teach: 'Go on a material hunt in your classroom. Step 1: Pick five things: a desk, a window, a bottle, a key and a duster. Step 2: Touch each one. Step 3: Write what it is made of: wood, glass, plastic, metal, cloth. Step 4: Find one more thing for each material.'
      - style: real_world
        teach: 'A kitchen has many materials side by side: steel plates, clay pots, glass jars, wooden spoons, plastic boxes and cotton cloths. Each one is chosen for its job.'
    - teach: Materials feel and behave differently. Some are hard (stone), some soft (cotton). Some are rough (sandpaper), some smooth (glass). Some let light through (glass), some do not (wood). Some break (glass, clay), some bend (plastic, rubber).
      check:
        prompt: Which material breaks easily if dropped?
        options:
        - glass
        - rubber
        - cloth
        answer: glass
        why: Glass is hard but cracks when it falls.
      ways:
      - style: visual
        teach: Pairs of opposite properties, with a material for each one.
        picture:
          kind: compare
          columns:
          - title: Property
            points:
            - Hard
            - Rough
            - Lets light through
            - Bends
          - title: Opposite
            points:
            - Soft
            - Smooth
            - Stops light
            - Breaks
          - title: Examples
            points:
            - Stone / cotton
            - Sandpaper / glass
            - Glass / wood
            - Rubber / clay
          alt: Stone is hard and cotton is soft. Sandpaper is rough and glass is smooth. Glass lets light through and wood stops it. Rubber bends and clay breaks.
      - style: step_by_step
        teach: 'Test if a material lets light through. Step 1: Hold it up in front of a torch or a window. Step 2: Look at it. Step 3: If you can see the light clearly, it lets light through. Step 4: If it looks dark, it stops light.'
    - teach: 'Some materials come from nature: wood from trees, cotton from plants, stone from the ground, wool from sheep. Others are made by people in factories, like plastic.'
      check:
        prompt: 'Cotton comes from:'
        options:
        - a plant
        - a factory only
        - a stone
        answer: a plant
        why: Cotton grows in fluffy balls on the cotton plant.
      ways:
      - style: visual
        teach: Materials from nature, and materials that people make.
        picture:
          kind: compare
          columns:
          - title: From nature
            points:
            - Wood from trees
            - Cotton from plants
            - Wool from sheep
            - Stone from the ground
          - title: Made by people
            points:
            - Plastic
            - Glass
            - Steel
          alt: Wood comes from trees, cotton from plants, wool from sheep and stone from the ground. Plastic, glass and steel are made by people in factories.
      - style: real_world
        teach: Silk comes from the cocoons of silkworms, and leather comes from the skin of animals. Some of the softest things we wear come from animals and plants.
  items:
  - prompt: 'A spoon is usually made of:'
    options:
    - metal
    - paper
    - cloth
    - clay only
    answer: metal
    difficulty: 1
    hints:
    - Shiny and hard.
    - Steel.
    solution: A spoon is metal.
    mistakes: {"paper": "v3_spoon"}
  - prompt: Which material can you see through?
    options:
    - glass
    - wood
    - stone
    - brick
    answer: glass
    difficulty: 1
    hints:
    - Windows.
    - Clear.
    solution: Glass is see-through.
    mistakes: {"wood": "v4_transparent"}
  - prompt: 'A diya is made of:'
    options:
    - clay
    - plastic
    - glass
    - cloth
    answer: clay
    difficulty: 1
    hints:
    - The potter makes it.
    - Soil.
    solution: A diya is made of clay.
    mistakes: {"plastic": "v4_clay"}
  - prompt: Which material is soft?
    options:
    - cotton
    - stone
    - iron
    - glass
    answer: cotton
    difficulty: 1
    hints:
    - Pillows.
    - Fluffy.
    solution: Cotton is soft.
    mistakes: {"stone": "v3_soft"}
  - prompt: Which material comes from nature?
    options:
    - wood
    - plastic
    - nylon
    - polythene
    answer: wood
    difficulty: 2
    hints:
    - From trees.
    - Not made in a factory.
    solution: Wood comes from trees.
    mistakes:
      plastic: c3v_reread
  - prompt: Why are windows made of glass?
    options:
    - light can pass through it
    - it is soft
    - it is cheap paper
    - it bends easily
    answer: light can pass through it
    difficulty: 2
    hints:
    - See outside.
    - Light comes in.
    solution: Glass lets light in.
    mistakes: {"it is soft": "v4_transparent"}
  - prompt: 'A notebook is made of:'
    options:
    - paper
    - metal
    - clay
    - glass
    answer: paper
    difficulty: 1
    hints:
    - Pages.
    - From wood pulp.
    solution: A notebook is paper.
    mistakes: {"metal": "v3_notebook"}
  - prompt: 'A rubber band can:'
    options:
    - stretch and go back
    - break like glass
    - let light through
    answer: stretch and go back
    difficulty: 1
    hints:
    - Pull one gently.
    - What happens when you let go?
    solution: 'Step 1: Rubber stretches when pulled. Step 2: It goes back when let go.'
    mistakes:
      break like glass: c3v10_prop
      let light through: c3v10_prop
  - prompt: 'A cooking pot is made of metal because metal:'
    options:
    - is strong and lets heat through
    - is soft like cotton
    - melts at once on the stove
    answer: is strong and lets heat through
    difficulty: 2
    hints:
    - The pot sits on a flame.
    - Heat must reach the food.
    solution: 'Step 1: Metal does not burn or break on a stove. Step 2: It passes heat to the food.'
    mistakes:
      is soft like cotton: c3v10_why
      melts at once on the stove: c3v10_why
  - prompt: 'Wool comes from:'
    options:
    - sheep
    - trees
    - plastic
    answer: sheep
    difficulty: 1
    hints:
    - It is an animal's soft coat.
    - A woolly farm animal.
    solution: 'Step 1: Sheep grow thick hair. Step 2: It is cut and spun into wool.'
    mistakes:
      trees: c3v10_mat
      plastic: c3v10_mat
  - prompt: Which material feels rough?
    options:
    - sandpaper
    - a glass window
    - a silk scarf
    answer: sandpaper
    difficulty: 1
    hints:
    - Run your finger over each one.
    - Which one scratches?
    solution: 'Step 1: Glass and silk feel smooth. Step 2: Sandpaper feels rough.'
    mistakes:
      a glass window: c3v10_prop
      a silk scarf: c3v10_prop
  - prompt: Which thing is made by people, not found in nature?
    options:
    - a plastic bucket
    - a stone
    - a leaf
    answer: a plastic bucket
    difficulty: 1
    hints:
    - Which one comes from a factory?
    - Stones and leaves are found outside.
    solution: 'Step 1: Stones and leaves come from nature. Step 2: Plastic is made in factories.'
    mistakes:
      a stone: c3v10_mat
      a leaf: c3v10_mat
  - prompt: Why are raincoats made of plastic or rubber, not cotton?
    options:
    - they do not let water through
    - they are rough
    - they break easily
    answer: they do not let water through
    difficulty: 2
    hints:
    - What must a raincoat stop?
    - Cotton soaks up water.
    solution: 'Step 1: A raincoat must keep you dry. Step 2: Plastic and rubber keep water out.'
    mistakes:
      they are rough: c3v10_why
      they break easily: c3v10_why
  - prompt: 'A door is usually made of wood because wood is:'
    options:
    - strong and easy to cut and shape
    - see-through
    - soft like cloth
    answer: strong and easy to cut and shape
    difficulty: 2
    hints:
    - A door must be firm.
    - A carpenter must be able to shape it.
    solution: 'Step 1: Wood is strong. Step 2: It can be cut and shaped into a door.'
    mistakes:
      see-through: c3v10_why
      soft like cloth: c3v10_why
  - prompt: Which two things are made of the same material?
    options:
    - a clay pot and a diya
    - a spoon and a shirt
    - a book and a bottle
    answer: a clay pot and a diya
    difficulty: 3
    hints:
    - Name the material of each.
    - Which pair matches?
    solution: 'Step 1: Pot and diya are both clay. Step 2: The other pairs differ.'
    mistakes:
      a spoon and a shirt: c3v10_mat
      a book and a bottle: c3v10_mat
  - prompt: 'Case: A family is buying a new water bottle for a child going on a school trip. They want one that will not break if it falls on a rocky path. Which material should they choose?'
    options:
    - Steel or strong plastic
    - Glass
    - Clay
    answer: Steel or strong plastic
    hints:
    - Which materials break when they fall?
    - Which materials can take a knock?
    solution: Glass and clay break when dropped on rocks. Steel and strong plastic do not break easily, so they are better for a trip.
    mistakes:
      Glass: c3v10_prop
      Clay: c3v10_prop
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making a sign for a classroom door that must be easy to read from the corridor and must not get spoilt by rain on the open corridor. Which material is best for the sign?'
    options:
    - Plastic or painted wood
    - Plain paper
    - Cotton cloth
    answer: Plastic or painted wood
    hints:
    - What happens to paper and cloth in the rain?
    - Which materials stay firm when wet?
    solution: Paper and cotton cloth soak up rain and get spoilt. Plastic and painted wood keep water out and stay firm.
    mistakes:
      Plain paper: c3v10_why
      Cotton cloth: c3v10_why
    exam: competency
    difficulty: 2
