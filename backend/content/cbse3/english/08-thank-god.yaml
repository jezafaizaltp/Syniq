# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 8. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 8
title: 'Thank God (Unit 3: Good Food)'
concepts:
- code: cbse3e.u3.thank
  title: 'Thank God (Unit 3: Good Food)'
  notes: |
    A short story or prayer-like lesson about being thankful for food and the people and nature that give it to us:
    sun, rain, farmers, cooks. Exact details are not reproduced here; questions focus on gratitude, where food comes from
    and polite words (thank you, please).
  explanations:
    text: This lesson is about saying thank you for our food. The sun and rain help crops grow, farmers grow them, and our families cook them. Being thankful means not wasting food.
    visual: Draw a plate of food with arrows to the sun, rain, a farmer and a cook.
    step_by_step: 1. What food do we eat? 2. Who helps it reach us? 3. How can we show thanks? 4. Don't waste it.
    real_world: Many families say a short prayer of thanks before meals.
  picture:
    kind: flow
    steps:
    - Sun and rain
    - Farmer grows the crop
    - Cook makes the meal
    - We eat and say thank you
    alt: The sun and rain help the farmer grow crops, the cook makes the meal, and we eat and say thank you.
  items:
  - prompt: Who grows rice and wheat?
    options:
    - farmers
    - pilots
    - tailors
    - drivers
    answer: farmers
    difficulty: 1
    hints:
    - They work in fields.
    - Plough.
    solution: Farmers grow rice and wheat.
  - prompt: 'Being thankful for food means we should:'
    options:
    - not waste it
    - throw it away
    - complain about it
    - hide it
    answer: not waste it
    difficulty: 1
    hints:
    - Respect the food.
    - Eat what you take.
    solution: Thankful people don't waste food.
    mistakes:
      throw it away: eng3_read_again
  - prompt: What do we say when someone gives us food?
    options:
    - thank you
    - go away
    - 'no'
    - hurry up
    answer: thank you
    difficulty: 1
    hints:
    - Polite words.
    - Show thanks.
    solution: We say thank you.
  - prompt: What helps crops grow?
    options:
    - sun and rain
    - smoke and dust
    - plastic
    - darkness
    answer: sun and rain
    difficulty: 2
    hints:
    - From the sky.
    - Light and water.
    solution: Sun and rain help crops grow.
  - prompt: '''Grateful'' means:'
    options:
    - thankful
    - angry
    - hungry
    - sleepy
    answer: thankful
    difficulty: 2
    hints:
    - Saying thank you.
    - Feeling thanks.
    solution: Grateful means thankful.
    mistakes:
      hungry: eng3_word
  - prompt: 'Choose the polite request:'
    options:
    - Please pass the rice.
    - Give rice now!
    - Rice. Me.
    - I want rice, quick!
    answer: Please pass the rice.
    difficulty: 1
    hints:
    - Magic word.
    - Please.
    solution: '''Please pass the rice'' is polite.'
