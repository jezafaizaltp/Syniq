# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 8. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 8
title: 'Thank God (Unit 3: Good Food)'
tips:
  e3_crops: "Plants need light and water to grow."
  e3_polite: "A polite request uses the magic word."
  c3e8_who: 'Trace your food back: who grew it, who carried it, who cooked it?'
  c3e8_polite: "Think which words show good manners: when we ask, when we get something, when we make a mistake, or when we need to get past."
  c3e8_nature: Think what a seed needs to grow into a crop.

concepts:
- code: cbse3e.u3.thank
  title: 'Thank God (Unit 3: Good Food)'
  notes: |
    A short story or prayer-like lesson about being thankful for food and the people and nature that give it to us:
    sun, rain, farmers, cooks. Exact details are not reproduced here; questions focus on gratitude, where food comes from
    and polite words (thank you, please).
  explanations:
    text: This lesson is about saying thank you for our food. The sun and rain help crops grow, farmers grow them, and our families cook them. Being thankful means not wasting food.
    visual: Draw a plate of food with arrows to the sun, rain, a farmer and a cook.
    step_by_step: 1. What food do we eat? 2. Who helps it reach us? 3. How can we show thanks? 4. Don't waste it.
    real_world: Many families say a short prayer of thanks before meals.
  picture:
    kind: flow
    steps:
    - Sun and rain
    - Farmer grows the crop
    - Cook makes the meal
    - We eat and say thank you
    alt: The sun and rain help the farmer grow crops, the cook makes the meal, and we eat and say thank you.
  activity:
    type: order
    prompt: 'Thank God: how does rice reach your plate?'
    steps:
    - Sun and rain help the plant grow
    - The farmer harvests the rice
    - The shop sells it
    - The cook makes the meal
    - We say thank you and eat
    reasons:
      The farmer harvests the rice: Plants must grow first.
      The shop sells it: Harvested rice is taken to market.
      The cook makes the meal: It's bought and cooked.
      We say thank you and eat: The meal is ready.
  lesson:
    - teach: 'Thank God is about being thankful for our food. Many helped bring it: the sun and rain helped crops grow, farmers grew them, sellers brought them, and someone at home cooked.'
      picture:
        kind: flow
        steps:
        - sun and rain
        - farmer grows crops
        - seller brings food
        - cook makes meal
        - we eat
        alt: How food reaches our plate.
      check:
        prompt: Who grows rice in the fields?
        options:
        - farmers
        - pilots
        - tailors
        answer: farmers
        why: Farmers plant and look after crops.
      ways:
      - style: step_by_step
        teach: 'Follow your roti back to the field. Step 1: Someone at home rolled and cooked it. Step 2: The flour came from a shop. Step 3: A mill ground the wheat into flour. Step 4: A farmer grew the wheat, with help from sun, rain and soil.'
      - style: real_world
        teach: Many families say a short prayer or a thank you before eating. It is a moment to remember everyone who helped the food reach the plate.
    - teach: Being thankful (grateful) means we value something. We show it by saying thank you and by not wasting food.
      check:
        prompt: Which word means the same as 'grateful'?
        options:
        - thankful
        - angry
        - sleepy
        answer: thankful
        why: A grateful person feels thanks.
      ways:
      - style: visual
        teach: Ways to show that you are thankful for your food.
        picture:
          kind: compare
          columns:
          - title: Say it
            points:
            - Thank you for the meal
            - This is tasty
          - title: Show it
            points:
            - Take only what you can eat
            - Help to clear the table
            - Do not throw food away
          alt: You can say thank you for the meal or this is tasty. You can show you are thankful by taking only what you can eat, helping to clear the table and not throwing food away.
      - style: real_world
        teach: On the farm, a farmer may wake up before sunrise to water the fields. Knowing how hard the work is helps us value every grain of rice.
    - teach: 'Polite words make others feel good: ''please'' when we ask, ''thank you'' when we get something, ''sorry'' when we make a mistake, ''excuse me'' to get attention.'
      check:
        prompt: What do you say to ask for water politely?
        options:
        - May I have some water, please?
        - Give water now!
        - Water!
        answer: May I have some water, please?
        why: '''Please'' makes a request polite.'
      ways:
      - style: visual
        teach: Four polite words and the right time to use each one.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - Please
            - Thank you
            - Sorry
            - Excuse me
          - title: When
            points:
            - When you ask
            - When you get something
            - When you make a mistake
            - When you need attention or to pass
          alt: Say please when you ask, thank you when you get something, sorry when you make a mistake, and excuse me when you need attention or need to pass.
      - style: step_by_step
        teach: 'Ask a shopkeeper for something politely. Step 1: Wait for your turn. Step 2: Say ''Excuse me'' to get attention. Step 3: Ask: ''May I have a notebook, please?'' Step 4: Say ''Thank you'' when you get it.'
  items:
  - prompt: Who grows rice and wheat?
    options:
    - farmers
    - pilots
    - tailors
    - drivers
    answer: farmers
    difficulty: 1
    hints:
    - They work in fields.
    - Plough.
    solution: Farmers grow rice and wheat.
    mistakes: {"pilots": "v4_farmer"}
  - prompt: 'Being thankful for food means we should:'
    options:
    - not waste it
    - throw it away
    - complain about it
    - hide it
    answer: not waste it
    difficulty: 1
    hints:
    - Respect the food.
    - Eat what you take.
    solution: Thankful people don't waste food.
    mistakes:
      throw it away: eng3_read_again
  - prompt: What do we say when someone gives us food?
    options:
    - thank you
    - go away
    - 'no'
    - hurry up
    answer: thank you
    difficulty: 1
    hints:
    - Polite words.
    - Show thanks.
    solution: We say thank you.
    mistakes: {"go away": "e1_thank_you"}
  - prompt: What helps crops grow?
    options:
    - sun and rain
    - smoke and dust
    - plastic
    - darkness
    answer: sun and rain
    difficulty: 2
    hints:
    - From the sky.
    - Light and water.
    solution: Sun and rain help crops grow.
    mistakes: {"smoke and dust": "e3_crops"}
  - prompt: '''Grateful'' means:'
    options:
    - thankful
    - angry
    - hungry
    - sleepy
    answer: thankful
    difficulty: 2
    hints:
    - Saying thank you.
    - Feeling thanks.
    solution: Grateful means thankful.
    mistakes:
      hungry: eng3_word
  - prompt: 'Choose the polite request:'
    options:
    - Please pass the rice.
    - Give rice now!
    - Rice. Me.
    - I want rice, quick!
    answer: Please pass the rice.
    difficulty: 1
    hints:
    - Magic word.
    - Please.
    solution: '''Please pass the rice'' is polite.'
    mistakes: {"Give rice now!": "e3_polite"}
  - prompt: What do we say when someone serves us food?
    options:
    - Thank you.
    - Go away.
    - Hurry up.
    answer: Thank you.
    difficulty: 1
    hints:
    - Someone did something kind.
    - Which words show thanks?
    solution: 'Step 1: Serving food is kind. Step 2: Say thank you.'
    mistakes:
      Go away.: c3e8_polite
      Hurry up.: c3e8_polite
  - prompt: Which two things from nature help crops grow?
    options:
    - sunlight and rain
    - smoke and noise
    - plastic and glass
    answer: sunlight and rain
    difficulty: 1
    hints:
    - Plants need light.
    - And water from the sky.
    solution: 'Step 1: Plants need light and water. Step 2: Sunlight and rain.'
    mistakes:
      smoke and noise: c3e8_nature
      plastic and glass: c3e8_nature
  - prompt: You bump into someone by mistake. What do you say?
    options:
    - Sorry.
    - Thank you.
    - Please.
    answer: Sorry.
    difficulty: 1
    hints:
    - It was your mistake.
    - Which word fixes a mistake?
    solution: 'Step 1: You made a mistake. Step 2: Say sorry.'
    mistakes:
      Thank you.: c3e8_polite
      Please.: c3e8_polite
  - prompt: Who brings vegetables from the farm to our market?
    options:
    - "sellers and truck drivers"
    - "astronauts in rockets"
    - "doctors and nurses"
    answer: sellers and truck drivers
    difficulty: 2
    hints:
    - Vegetables travel from farm to town.
    - Who carries and sells them?
    solution: 'Step 1: Trucks carry the vegetables. Step 2: Sellers sell them at the market.'
    mistakes:
      "astronauts in rockets": c3e8_who
      "doctors and nurses": c3e8_who
  - prompt: Which shows being grateful for food?
    options:
    - finishing what is on your plate
    - throwing half the food away
    - complaining about every meal
    answer: finishing what is on your plate
    difficulty: 1
    hints:
    - Grateful people do not waste.
    - Which choice values the food?
    solution: 'Step 1: Wasting and complaining do not value food. Step 2: Finishing your plate does.'
    mistakes:
      throwing half the food away: c3e8_polite
      complaining about every meal: c3e8_polite
  - prompt: You need to pass someone in a narrow corridor. What do you say?
    options:
    - Excuse me.
    - Move!
    - Thank God.
    answer: Excuse me.
    difficulty: 2
    hints:
    - You are asking politely to pass.
    - Which words do we use to get by?
    solution: 'Step 1: You need to pass politely. Step 2: Say excuse me.'
    mistakes:
      Move!: c3e8_polite
      Thank God.: c3e8_polite
  - prompt: 'Wheat flour is used to make:'
    options:
    - chapatis
    - idlis
    - ice
    answer: chapatis
    difficulty: 2
    hints:
    - Think of a flat round bread.
    - Idlis are from rice.
    solution: 'Step 1: Idlis use rice. Step 2: Chapatis are made from wheat flour.'
    mistakes:
      idlis: c3e8_who
      ice: c3e8_who
  - prompt: Choose the polite sentence.
    options:
    - "Could you please help me?"
    - "Help me right now, quickly!"
    - "You must help me at once."
    answer: Could you please help me?
    difficulty: 2
    hints:
    - Look for 'please'.
    - A gentle question.
    solution: 'Step 1: ''Please'' and a question are polite. Step 2: Could you please help me?'
    mistakes:
      "Help me right now, quickly!": c3e8_polite
      "You must help me at once.": c3e8_polite
  - prompt: The word 'thankful' is made of 'thank' + ___
    options:
    - ful
    - full
    - fall
    answer: ful
    difficulty: 3
    hints:
    - Look carefully at the spelling of thankful.
    - Only one l at the end.
    solution: 'Step 1: thank + ful. Step 2: The ending has one l.'
    mistakes:
      full: c3e8_polite
      fall: c3e8_polite
  - prompt: 'Case: At a school lunch, a child takes a big pile of rice, eats half and throws the rest into the bin. A friend says, ''A farmer worked for months to grow that.'' What should the child do next time?'
    options:
    - "Take a small amount first and ask for more if still hungry"
    - "Take even more next time so there is plenty to choose from"
    - "Throw food away whenever it does not taste very nice"
    answer: Take a small amount first and ask for more if still hungry
    hints:
    - Why was food wasted?
    - How can we show we are thankful for food?
    solution: Taking only what you can eat stops waste. It shows respect for the farmer and everyone who helped bring the food.
    mistakes:
      "Take even more next time so there is plenty to choose from": c3e8_who
      "Throw food away whenever it does not taste very nice": c3e8_who
    exam: case
    difficulty: 2
  - prompt: 'Situation: At dinner, the salt is at the far end of the table. How should you ask for it?'
    options:
    - "Could you please pass the salt?"
    - "Give me the salt, right now."
    - "Salt! Salt! Over here, salt!"
    answer: Could you please pass the salt?
    hints:
    - Which word do we use when we ask for something?
    - Which one sounds kind?
    solution: A polite request uses 'please'. 'Could you please pass the salt?' is kind and clear.
    mistakes:
      "Give me the salt, right now.": c3e8_polite
      "Salt! Salt! Over here, salt!": c3e8_polite
    exam: competency
    difficulty: 2
