# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 2. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 2
title: 'Badal and Moti (Unit 1: Fun with Friends)'
tips:
  e3_badal_friends: "Badal looks after Moti and Moti follows him everywhere."
  e3_badal_word: "Badal is up in the sky and brings rain."
  e3_kind_animals: "Animals feel pain and fear just like us."

concepts:
- code: cbse3e.u1.badal
  title: 'Badal and Moti (Unit 1: Fun with Friends)'
  notes: |
    A story about a child, Badal, and a pet or animal friend, Moti, and their friendship. Exact story details are not
    reproduced here; questions focus on friendship with animals, caring for pets (food, water, kindness), naming words
    and the story's message.
  explanations:
    text: This story is about Badal and his friend Moti. It shows how friends, even animal friends, care for each other. A pet needs food, water, a clean place and lots of love.
    visual: Draw a boy sitting under a tree with his pet, sharing a bowl of water.
    step_by_step: 1. Who is in the story? 2. How are they friends? 3. What does Badal do to care for Moti? 4. What is the message?
    real_world: Many families keep pets like dogs, cats or birds and look after them every day.
  picture:
    kind: flow
    steps:
    - Badal meets Moti
    - They become friends
    - Badal cares for Moti
    - Friendship grows
    alt: Badal meets Moti, they become friends, Badal cares for Moti, and their friendship grows.
  activity:
    type: sort
    prompt: 'Badal and Moti: kind to a pet, or not?'
    bins:
    - Kind
    - Not kind
    items:
    - label: Giving fresh water
      bin: Kind
      clue: Pets get thirsty.
      why: Fresh water keeps a pet healthy.
    - label: Pulling its tail
      bin: Not kind
      clue: Does that hurt?
      why: Pulling a tail hurts the animal.
    - label: Feeding it on time
      bin: Kind
      clue: Every day.
      why: Regular food is caring.
    - label: Shouting at it
      bin: Not kind
      clue: It gets scared.
      why: Shouting frightens a pet.
    - label: Gently stroking it
      bin: Kind
      clue: Soft touch.
      why: A gentle touch shows love.
  items:
  - prompt: What does a pet need every day?
    options:
    - food, water and care
    - only toys
    - nothing
    - only a name
    answer: food, water and care
    difficulty: 1
    hints:
    - What do you need?
    - Look after it.
    solution: A pet needs food, water and care.
    mistakes:
      nothing: eng3_read_again
  - prompt: 'Badal and Moti are:'
    options:
    - friends
    - enemies
    - strangers
    - teachers
    answer: friends
    difficulty: 1
    hints:
    - Look at the unit name.
    - Fun with Friends.
    solution: They are friends.
    mistakes: {"enemies": "e3_badal_friends"}
  - prompt: How should we treat animals?
    options:
    - kindly
    - roughly
    - cruelly
    - angrily
    answer: kindly
    difficulty: 1
    hints:
    - Animals feel pain.
    - Be gentle.
    solution: We should treat animals kindly.
    mistakes: {"roughly": "e3_kind_animals"}
  - prompt: '''Badal'' in Hindi means:'
    options:
    - cloud
    - river
    - tree
    - sun
    answer: cloud
    difficulty: 2
    hints:
    - It is in the sky.
    - Brings rain.
    solution: Badal means cloud.
    mistakes: {"river": "e3_badal_word"}
  - prompt: Which is a naming word (noun)?
    options:
    - dog
    - run
    - happy
    - slowly
    answer: dog
    difficulty: 2
    hints:
    - It names an animal.
    - A thing you can see.
    solution: Dog is a naming word.
    mistakes:
      run: eng3_grammar
  - prompt: 'Choose the correct sentence:'
    options:
    - Moti is a good friend.
    - Moti are a good friend.
    - Moti am a good friend.
    - Moti be a good friend.
    answer: Moti is a good friend.
    difficulty: 1
    hints:
    - One friend takes 'is'.
    - Read aloud.
    solution: '''Moti is a good friend'' is correct.'
    mistakes:
      Moti are a good friend.: eng3_grammar
