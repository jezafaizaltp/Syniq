# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 2. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 2
title: 'Badal and Moti (Unit 1: Fun with Friends)'
tips:
  e3_badal_friends: "Badal looks after Moti and Moti follows him everywhere."
  e3_badal_word: "Badal is up in the sky and brings rain."
  e3_kind_animals: "Animals feel pain and fear just like us."
  c3e2_noun: 'A naming word answers ''who?'' or ''what?'': a person, animal, place or thing.'
  c3e2_care: Think what you need each day to feel well. Pets need much the same.
  c3e2_sent: Check the capital letter, the full stop, and that the words make sense in order.

concepts:
- code: cbse3e.u1.badal
  title: 'Badal and Moti (Unit 1: Fun with Friends)'
  notes: |
    A story about a child, Badal, and a pet or animal friend, Moti, and their friendship. Exact story details are not
    reproduced here; questions focus on friendship with animals, caring for pets (food, water, kindness), naming words
    and the story's message.
  explanations:
    text: This story is about Badal and his friend Moti. It shows how friends, even animal friends, care for each other. A pet needs food, water, a clean place and lots of love.
    visual: Draw a boy sitting under a tree with his pet, sharing a bowl of water.
    step_by_step: 1. Who is in the story? 2. How are they friends? 3. What does Badal do to care for Moti? 4. What is the message?
    real_world: Many families keep pets like dogs, cats or birds and look after them every day.
  picture:
    kind: flow
    steps:
    - Badal meets Moti
    - They become friends
    - Badal cares for Moti
    - Friendship grows
    alt: Badal meets Moti, they become friends, Badal cares for Moti, and their friendship grows.
  activity:
    type: sort
    prompt: 'Badal and Moti: kind to a pet, or not?'
    bins:
    - Kind
    - Not kind
    items:
    - label: Giving fresh water
      bin: Kind
      clue: Pets get thirsty.
      why: Fresh water keeps a pet healthy.
    - label: Pulling its tail
      bin: Not kind
      clue: Does that hurt?
      why: Pulling a tail hurts the animal.
    - label: Feeding it on time
      bin: Kind
      clue: Every day.
      why: Regular food is caring.
    - label: Shouting at it
      bin: Not kind
      clue: It gets scared.
      why: Shouting frightens a pet.
    - label: Gently stroking it
      bin: Kind
      clue: Soft touch.
      why: A gentle touch shows love.
  lesson:
    - teach: Badal and Moti is a story about friendship between a child and an animal. Friends, even animal friends, spend time together, play and look after each other.
      check:
        prompt: What is the story mainly about?
        options:
        - friendship between a child and an animal
        - a cricket match
        - a trip to the moon
        answer: friendship between a child and an animal
        why: Badal and Moti are friends.
      ways:
      - style: visual
        teach: Things that friends do together, whether they are children or animals.
        picture:
          kind: compare
          columns:
          - title: Play
            points:
            - Run in the park
            - Play with a ball
          - title: Care
            points:
            - Share food
            - Stay close when one is scared
          alt: Friends play together, like running in the park or playing with a ball. They also care for each other, like sharing food and staying close when one is scared.
      - style: real_world
        teach: Many families have a pet that waits at the door when a child comes home from school. The pet is happy to see them, and the child is happy too.
    - teach: 'A pet needs care every day: clean water, the right food, a safe place to rest, and kindness. We never hit or tease animals.'
      picture:
        kind: compare
        columns:
        - title: A pet needs
          points:
          - clean water
          - food
          - a safe place
          - kindness
        - title: Never
          points:
          - hit
          - tease
          - leave without water
        alt: What a pet needs and what we must never do.
      check:
        prompt: Which is caring for a pet?
        options:
        - giving it clean water
        - pulling its ears
        - shouting at it
        answer: giving it clean water
        why: Water keeps the pet healthy.
      ways:
      - style: step_by_step
        teach: 'Look after a pet dog for a day. Step 1: Give it fresh, clean water in the morning. Step 2: Feed it the right food, not sweets or spicy food. Step 3: Take it for a walk. Step 4: Give it a clean, shady place to rest.'
      - style: visual
        teach: Kind ways and unkind ways to treat an animal.
        picture:
          kind: compare
          columns:
          - title: Kind
            points:
            - Give water and food
            - Stroke it gently
            - Let it rest
          - title: Unkind
            points:
            - Pull its tail
            - Throw stones
            - Wake it up to tease it
          alt: Giving water and food, stroking an animal gently and letting it rest are kind. Pulling its tail, throwing stones and waking it up to tease it are unkind.
    - teach: 'Naming words (nouns) name a person, animal, place or thing: Badal, dog, park, ball. Names of people and pets start with a capital letter: Badal, Moti.'
      check:
        prompt: Which is a naming word?
        options:
        - park
        - run
        - happy
        answer: park
        why: Park names a place.
      ways:
      - style: visual
        teach: Naming words sorted into people, animals, places and things.
        picture:
          kind: compare
          columns:
          - title: Person or animal
            points:
            - Badal
            - Moti
            - farmer
            - cat
          - title: Place or thing
            points:
            - park
            - school
            - ball
            - gate
          alt: Badal, Moti, farmer and cat name people and animals. Park, school, ball and gate name places and things. All of them are naming words, or nouns.
      - style: step_by_step
        teach: 'Find the naming words in a sentence. Step 1: Read: ''Badal threw a stick in the garden.'' Step 2: Ask: who? Badal. Step 3: Ask: what? stick. Step 4: Ask: where? garden. The naming words are Badal, stick and garden.'
  items:
  - prompt: What does a pet need every day?
    options:
    - food, water and care
    - only toys
    - nothing
    - only a name
    answer: food, water and care
    difficulty: 1
    hints:
    - What do you need?
    - Look after it.
    solution: A pet needs food, water and care.
    mistakes:
      nothing: eng3_read_again
  - prompt: 'Badal and Moti are:'
    options:
    - friends
    - enemies
    - strangers
    - teachers
    answer: friends
    difficulty: 1
    hints:
    - Look at the unit name.
    - Fun with Friends.
    solution: They are friends.
    mistakes: {"enemies": "e3_badal_friends"}
  - prompt: How should we treat animals?
    options:
    - kindly
    - roughly
    - cruelly
    - angrily
    answer: kindly
    difficulty: 1
    hints:
    - Animals feel pain.
    - Be gentle.
    solution: We should treat animals kindly.
    mistakes: {"roughly": "e3_kind_animals"}
  - prompt: '''Badal'' in Hindi means:'
    options:
    - cloud
    - river
    - tree
    - sun
    answer: cloud
    difficulty: 2
    hints:
    - It is in the sky.
    - Brings rain.
    solution: Badal means cloud.
    mistakes: {"river": "e3_badal_word"}
  - prompt: Which is a naming word (noun)?
    options:
    - dog
    - run
    - happy
    - slowly
    answer: dog
    difficulty: 2
    hints:
    - It names an animal.
    - A thing you can see.
    solution: Dog is a naming word.
    mistakes:
      run: eng3_grammar
  - prompt: 'Choose the correct sentence:'
    options:
    - Moti is a good friend.
    - Moti are a good friend.
    - Moti am a good friend.
    - Moti be a good friend.
    answer: Moti is a good friend.
    difficulty: 1
    hints:
    - One friend takes 'is'.
    - Read aloud.
    solution: '''Moti is a good friend'' is correct.'
    mistakes:
      Moti are a good friend.: eng3_grammar
  - prompt: Which naming word is an animal?
    options:
    - cow
    - chair
    - school
    answer: cow
    difficulty: 1
    hints:
    - Which one is alive and says 'moo'?
    - The others are a thing and a place.
    solution: 'Step 1: Chair is a thing, school a place. Step 2: Cow is an animal.'
    mistakes:
      chair: c3e2_noun
      school: c3e2_noun
  - prompt: Why does 'Moti' start with a capital letter?
    options:
    - it is a name
    - it is a doing word
    - it is at the end
    answer: it is a name
    difficulty: 2
    hints:
    - Badal also starts with a capital.
    - What kind of word are they?
    solution: 'Step 1: Moti is the pet''s own name. Step 2: Names start with capital letters.'
    mistakes:
      it is a doing word: c3e2_noun
      it is at the end: c3e2_noun
  - prompt: 'A dog wags its tail when it is:'
    options:
    - happy
    - asleep
    - eating a book
    answer: happy
    difficulty: 1
    hints:
    - Think of a dog seeing its friend.
    - How does it feel?
    solution: 'Step 1: Dogs wag tails to show joy. Step 2: Happy.'
    mistakes:
      asleep: c3e2_care
      eating a book: c3e2_care
  - prompt: 'Find the naming word in: ''Moti ran to the gate.'''
    options:
    - gate
    - ran
    - to
    answer: gate
    difficulty: 2
    hints:
    - Which word names a thing?
    - Ran is a doing word.
    solution: 'Step 1: Moti and gate name things. Step 2: Of the choices, gate is the naming word.'
    mistakes:
      ran: c3e2_noun
      to: c3e2_noun
  - prompt: 'On a hot day, a pet most needs:'
    options:
    - shade and water
    - a woollen blanket
    - a long run in the sun
    answer: shade and water
    difficulty: 2
    hints:
    - What do you want on a hot day?
    - Cool and a drink.
    solution: 'Step 1: Heat makes pets thirsty and tired. Step 2: Give shade and water.'
    mistakes:
      a woollen blanket: c3e2_care
      a long run in the sun: c3e2_care
  - prompt: Which sentence is correct?
    options:
    - Badal feeds Moti.
    - badal feeds moti.
    - Feeds Badal Moti.
    answer: Badal feeds Moti.
    difficulty: 2
    hints:
    - Names need capitals.
    - Who does what?
    solution: 'Step 1: Capitals for names, full stop at the end. Step 2: Order: Badal feeds Moti.'
    mistakes:
      badal feeds moti.: c3e2_sent
      Feeds Badal Moti.: c3e2_sent
  - prompt: What is the plural of 'puppy'?
    options:
    - puppies
    - puppys
    - puppy
    answer: puppies
    difficulty: 3
    hints:
    - Words ending in a consonant + y change the y.
    - Like baby → babies.
    solution: 'Step 1: Change y to i. Step 2: Add es: puppies.'
    mistakes:
      puppys: c3e2_noun
      puppy: c3e2_noun
  - prompt: If you see someone teasing a street dog, what should you do?
    options:
    - "ask them to stop and tell an adult"
    - "join in and tease the dog as well"
    - "throw a stone at the dog too"
    answer: ask them to stop and tell an adult
    difficulty: 2
    hints:
    - The dog can be hurt.
    - Who can help?
    solution: 'Step 1: Teasing hurts and scares animals. Step 2: Ask them to stop and tell an adult.'
    mistakes:
      "join in and tease the dog as well": c3e2_care
      "throw a stone at the dog too": c3e2_care
  - prompt: Which word describes a friend you can trust?
    options:
    - loyal
    - rude
    - lazy
    answer: loyal
    difficulty: 3
    hints:
    - A friend who always stands by you.
    - The other two are not good things.
    solution: 'Step 1: Rude and lazy are not kind. Step 2: Loyal means faithful.'
    mistakes:
      rude: c3e2_care
      lazy: c3e2_care
  - prompt: 'Case: A family gets a new puppy. On the first hot afternoon, the children leave it tied in the sun with no water while they go to play. The puppy is panting and whining. What should they do?'
    options:
    - "Move the puppy into the shade and give it clean water"
    - "Let it keep barking in the sun until it gets tired"
    - "Give it a cold ice cream and leave it where it is"
    answer: Move the puppy into the shade and give it clean water
    hints:
    - Why is the puppy panting?
    - What does a pet need on a hot day?
    solution: The puppy is too hot and thirsty. On a hot day a pet most needs shade and clean water.
    mistakes:
      "Let it keep barking in the sun until it gets tired": c3e2_care
      "Give it a cold ice cream and leave it where it is": c3e2_care
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing about your neighbour''s cat. Which sentence is written correctly?'
    options:
    - Our neighbour's cat is called Coco.
    - our neighbour's cat is called coco.
    - Our neighbour's cat is called coco
    answer: Our neighbour's cat is called Coco.
    hints:
    - Which letters must be capitals?
    - How must a sentence end?
    solution: The sentence begins with a capital letter, the pet's name Coco starts with a capital, and there is a full stop at the end.
    mistakes:
      our neighbour's cat is called coco.: c3e2_sent
      Our neighbour's cat is called coco: c3e2_noun
    exam: competency
    difficulty: 2
