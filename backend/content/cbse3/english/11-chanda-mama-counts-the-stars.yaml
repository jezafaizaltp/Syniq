subject: cbse3-eng
chapter: 11
title: 'Chanda Mama Counts the Stars (Unit 4: The Sky)'
tips:
  e3_after_nine: "Count: seven, eight, nine, ..."
  e3_chanda: "'Chanda' comes from 'Chand'. What is that in the night sky?"
