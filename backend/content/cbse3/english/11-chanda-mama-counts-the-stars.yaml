# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 11. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 11
title: 'Chanda Mama Counts the Stars (Unit 4: The Sky)'
tips:
  e3_after_nine: "Count: seven, eight, nine, ..."
  e3_chanda: "'Chanda' comes from 'Chand'. What is that in the night sky?"
  e3_count_stars: "Look up on a clear night. Could you count them all?"
  c3e11_count: Say the number words in order, one, two, three, and keep going.
  c3e11_imag: 'Ask: could this happen in real life, or only in a story?'
  c3e11_plural: For more than one, most words add -s; words ending in s, sh, ch, x add -es.

concepts:
- code: cbse3e.u4.chanda
  title: 'Chanda Mama Counts the Stars (Unit 4: The Sky)'
  notes: |
    A story in which Chanda Mama (Uncle Moon, as children in India call the moon) tries to count the stars. Exact story
    details are not reproduced here; questions focus on the moon and stars, numbers and counting words, imagination
    (the moon as a character) and the idea that there are too many stars to count.
  explanations:
    text: In Indian stories, the moon is called Chanda Mama, or Uncle Moon. In this story, Chanda Mama tries to count all the stars in the sky. But there are so many stars that counting them is very hard!
    visual: Draw a smiling moon with glasses counting stars on its fingers.
    step_by_step: 1. Who is Chanda Mama? 2. What does he try to do? 3. What happens? 4. What does it tell us about the stars?
    real_world: Indian lullabies like 'Chanda Mama door ke' are sung to babies at bedtime.
  picture:
    kind: flow
    steps:
    - Night comes
    - Chanda Mama starts counting stars
    - More and more stars appear
    - There are too many to count!
    alt: Night comes, Chanda Mama starts counting stars, more and more appear, and there are too many to count.
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Chanda Mama counts stars. Help him count.
    goals:
    - prompt: 'Count on: 3 stars, then 4 more.'
      target: 7
      mistakes:
      - when:
          v: 4
        say: That's only the new stars. Start from 3, then count on 4 more.
      - when:
          v: 6
        say: 'Count again: start at 3 and move 4 steps, one for each new star.'
    - prompt: 'Count on: 7 stars, then 5 more.'
      target: 12
      mistakes:
      - when:
          v: 5
        say: That's only the new stars. Start from 7 and count on.
  lesson:
    - teach: Children in India often call the moon Chanda Mama (Uncle Moon). In this story Chanda Mama tries to count the stars. A moon that talks and counts is make-believe.
      check:
        prompt: '''Chanda Mama'' is a loving name for:'
        options:
        - the moon
        - a star
        - the sun
        answer: the moon
        why: Chanda Mama is a loving name for the moon.
      ways:
      - style: visual
        teach: What the real moon does, and what Chanda Mama does in the story.
        picture:
          kind: compare
          columns:
          - title: The real moon
            points:
            - Shines with sunlight
            - Changes shape through the month
            - Cannot talk
          - title: Chanda Mama in the story
            points:
            - Talks like a person
            - Tries to count the stars
            - Has feelings
          alt: The real moon shines with sunlight, changes shape through the month and cannot talk. In the story, Chanda Mama talks like a person, tries to count the stars and has feelings.
      - style: real_world
        teach: Grandparents in many Indian homes sing lullabies about Chanda Mama to put little children to sleep. The moon becomes a kind uncle in the song.
    - teach: 'There are so many stars that nobody can count them all. Counting needs number words in order: one, two, three... nine, ten, eleven, twelve...'
      picture:
        kind: flow
        steps:
        - one
        - two
        - three
        - '...'
        - nine
        - ten
        - eleven
        alt: Number words in counting order.
      check:
        prompt: Which number word comes after 'ten'?
        options:
        - eleven
        - nine
        - twenty
        answer: eleven
        why: Ten, eleven, twelve...
      ways:
      - style: step_by_step
        teach: 'Count a big group without losing your place. Step 1: Touch each thing as you say a number word. Step 2: Move each counted thing to one side. Step 3: Make groups of ten when you can. Step 4: Count the tens, then the ones left.'
      - style: visual
        teach: Number words in order, from eleven to twenty.
        picture:
          kind: flow
          steps:
          - eleven
          - twelve
          - thirteen
          - fourteen
          - fifteen
          - sixteen
          - seventeen
          - eighteen
          alt: The number words go eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, then nineteen and twenty.
    - teach: 'For more than one, add -s: star → stars, moon → moons. Some words add -es: wish → wishes. A few words change: child → children.'
      check:
        prompt: What is the plural of 'wish'?
        options:
        - wishes
        - wishs
        - wish
        answer: wishes
        why: Words ending in sh add -es.
      ways:
      - style: visual
        teach: Three ways to make a word mean more than one.
        picture:
          kind: compare
          columns:
          - title: Add -s
            points:
            - cloud → clouds
            - planet → planets
          - title: Add -es
            points:
            - bus → buses
            - box → boxes
          - title: Word changes
            points:
            - man → men
            - foot → feet
          alt: 'Most words add -s: cloud becomes clouds, planet becomes planets. Some add -es: bus becomes buses, box becomes boxes. A few change: man becomes men, foot becomes feet.'
      - style: real_world
        teach: On a clear night, people in the countryside can see thousands of stars. Even scientists with big telescopes cannot count every star in the sky.
  items:
  - prompt: Who is Chanda Mama?
    options:
    - the moon
    - the sun
    - a star
    - a cloud
    answer: the moon
    difficulty: 1
    hints:
    - Uncle Moon.
    - Chand.
    solution: Chanda Mama is the moon.
    mistakes: {"the sun": "e3_chanda"}
  - prompt: What does Chanda Mama try to do?
    options:
    - count the stars
    - eat the clouds
    - hide the sun
    - make rain
    answer: count the stars
    difficulty: 1
    hints:
    - Look at the title.
    - Counts the ...
    solution: He tries to count the stars.
    mistakes:
      make rain: eng3_read_again
  - prompt: Why is it hard to count the stars?
    options:
    - there are too many
    - they are too heavy
    - they are asleep
    - they are in the sea
    answer: there are too many
    difficulty: 2
    hints:
    - Look at the night sky.
    - So many.
    solution: There are too many stars.
    mistakes: {"they are too heavy": "e3_count_stars"}
  - prompt: 'A story where the moon talks is:'
    options:
    - imaginary (make-believe)
    - a science report
    - a recipe
    - a timetable
    answer: imaginary (make-believe)
    difficulty: 2
    hints:
    - Can the real moon talk?
    - Imagination.
    solution: It is imaginary.
    mistakes: {"a science report": "e3_make_believe"}
  - prompt: Which number word comes after 'nine'?
    options:
    - ten
    - eight
    - seven
    - eleven
    answer: ten
    difficulty: 1
    hints:
    - 'Count: seven, eight, nine ...'
    - One more.
    solution: Ten comes after nine.
    mistakes: {"eight": "e3_after_nine"}
  - prompt: 'Choose the plural of ''star'':'
    options:
    - stars
    - stares
    - staries
    - star
    answer: stars
    difficulty: 1
    hints:
    - Add s.
    - More than one.
    solution: One star, many stars.
    mistakes:
      stares: eng3_grammar
  - prompt: Which number word comes before 'twenty'?
    options:
    - nineteen
    - twenty-one
    - ten
    answer: nineteen
    difficulty: 2
    hints:
    - Count back from twenty.
    - One less than twenty.
    solution: 'Step 1: 20 − 1 = 19. Step 2: nineteen.'
    mistakes:
      twenty-one: c3e11_count
      ten: c3e11_count
  - prompt: Write 'twelve' as a number.
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - 'Count: ten, eleven, twelve.'
    - Two more than ten.
    solution: 'Step 1: ten, eleven, twelve. Step 2: = 12.'
    mistakes:
      '20': c3e11_count
      '2': c3e11_count
  - prompt: What is the plural of 'child'?
    options:
    - children
    - childs
    - childes
    answer: children
    difficulty: 3
    hints:
    - This word does not just add -s.
    - 'It changes: one child, many ...'
    solution: 'Step 1: Child is a special word. Step 2: Its plural is children.'
    mistakes:
      childs: c3e11_plural
      childes: c3e11_plural
  - prompt: Which of these could only happen in a story?
    options:
    - "the moon counts stars out loud"
    - "stars shine in the sky at night"
    - "the moon looks round some nights"
    answer: the moon counts stars out loud
    difficulty: 1
    hints:
    - Two can really be seen.
    - Can the moon speak?
    solution: 'Step 1: Stars shine and the moon looks round in real life. Step 2: A counting moon is make-believe.'
    mistakes:
      "stars shine in the sky at night": c3e11_imag
      "the moon looks round some nights": c3e11_imag
  - prompt: Why can we see stars at night but not in the day?
    options:
    - "the bright sun hides them in the day"
    - "the stars go back home in the day"
    - "the stars fall asleep in the day"
    answer: the bright sun hides them in the day
    difficulty: 3
    hints:
    - Stars are always there.
    - What is too bright in the day?
    solution: 'Step 1: Stars shine all the time. Step 2: Sunlight is so bright we cannot see them.'
    mistakes:
      "the stars go back home in the day": c3e11_imag
      "the stars fall asleep in the day": c3e11_imag
  - prompt: What is the plural of 'sky'?
    options:
    - skies
    - skys
    - skyes
    answer: skies
    difficulty: 3
    hints:
    - Change y to i.
    - Like baby → babies.
    solution: 'Step 1: y → i. Step 2: add es: skies.'
    mistakes:
      skys: c3e11_plural
      skyes: c3e11_plural
  - prompt: 'Chanda Mama is called ''Mama'' because children think of the moon as a:'
    options:
    - loving uncle
    - teacher
    - doctor
    answer: loving uncle
    difficulty: 2
    hints:
    - In Hindi, 'mama' is a family word.
    - Mother's brother.
    solution: 'Step 1: Mama means mother''s brother. Step 2: The moon is a loving uncle.'
    mistakes:
      teacher: c3e11_imag
      doctor: c3e11_imag
  - prompt: 'Count the stars: ★ ★ ★ ★ ★ ★ ★. How many?'
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Touch each star once.
    - Say a number for each.
    solution: 'Step 1: Count one by one. Step 2: 7 stars.'
    mistakes:
      '6': c3e11_count
      '8': c3e11_count
  - prompt: Which word is spelt correctly?
    options:
    - eight
    - aight
    - eigt
    answer: eight
    difficulty: 2
    hints:
    - It has a silent 'gh'.
    - e-i-g-h-t.
    solution: 'Step 1: The number 8 is spelt e-i-g-h-t. Step 2: eight.'
    mistakes:
      aight: c3e11_count
      eigt: c3e11_count
  - prompt: 'Case: A child tries to count the stars from the roof but keeps losing count after twenty. A friend says, ''You must have counted wrong. Try again and you will finish.'' What is true?'
    options:
    - "There are far too many stars for anyone to count them all"
    - "The child will finish counting if they try just once more"
    - "There are only twenty stars, so the counting is done"
    answer: There are far too many stars for anyone to count them all
    hints:
    - How many stars are in the sky?
    - Could even Chanda Mama count them all?
    solution: There are so many stars that nobody can count them all. That is also why Chanda Mama finds it so hard in the story.
    mistakes:
      "The child will finish counting if they try just once more": c3e11_count
      "There are only twenty stars, so the counting is done": c3e11_count
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a list for a space poster. You have more than one of each. Which list is spelt correctly?'
    options:
    - planets, clouds, rockets
    - planetes, cloudes, rocketes
    - planet, cloud, rocket
    answer: planets, clouds, rockets
    hints:
    - Do these words end in s, x, ch or sh?
    - So do they take -s or -es?
    solution: 'Planet, cloud and rocket do not end in s, x, ch or sh, so they just add -s: planets, clouds, rockets.'
    mistakes:
      planetes, cloudes, rocketes: c3e11_plural
      planet, cloud, rocket: c3e11_plural
    exam: competency
    difficulty: 2
