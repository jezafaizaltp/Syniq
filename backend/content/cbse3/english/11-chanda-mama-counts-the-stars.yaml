concepts:
- code: cbse3e.u4.chanda
  title: 'Chanda Mama Counts the Stars (Unit 4: The Sky)'
  notes: |
    A story in which Chanda Mama (Uncle Moon, as children in India call the moon) tries to count the stars. Exact story
    details are not reproduced here; questions focus on the moon and stars, numbers and counting words, imagination
    (the moon as a character) and the idea that there are too many stars to count.
  explanations:
    text: In Indian stories, the moon is called Chanda Mama, or Uncle Moon. In this story, Chanda Mama tries to count all the stars in the sky. But there are so many stars that counting them is very hard!
    visual: Draw a smiling moon with glasses counting stars on its fingers.
    step_by_step: 1. Who is Chanda Mama? 2. What does he try to do? 3. What happens? 4. What does it tell us about the stars?
    real_world: Indian lullabies like 'Chanda Mama door ke' are sung to babies at bedtime.
  picture:
    kind: flow
    steps:
    - Night comes
    - Chanda Mama starts counting stars
    - More and more stars appear
    - There are too many to count!
    alt: Night comes, Chanda Mama starts counting stars, more and more appear, and there are too many to count.
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Chanda Mama counts stars. Help him count.
    goals:
    - prompt: 'Count on: 3 stars, then 4 more.'
      target: 7
      mistakes:
      - when:
          v: 4
        say: That's only the new stars. Start from 3, then count on 4 more.
      - when:
          v: 6
        say: 'Count again: start at 3 and move 4 steps, one for each new star.'
    - prompt: 'Count on: 7 stars, then 5 more.'
      target: 12
      mistakes:
      - when:
          v: 5
        say: That's only the new stars. Start from 7 and count on.
  items:
  - prompt: Who is Chanda Mama?
    options:
    - the moon
    - the sun
    - a star
    - a cloud
    answer: the moon
    difficulty: 1
    hints:
    - Uncle Moon.
    - Chand.
    solution: Chanda Mama is the moon.
    mistakes: {"the sun": "e3_chanda"}
  - prompt: What does Chanda Mama try to do?
    options:
    - count the stars
    - eat the clouds
    - hide the sun
    - make rain
    answer: count the stars
    difficulty: 1
    hints:
    - Look at the title.
    - Counts the ...
    solution: He tries to count the stars.
    mistakes:
      make rain: eng3_read_again
  - prompt: Why is it hard to count the stars?
    options:
    - there are too many
    - they are too heavy
    - they are asleep
    - they are in the sea
    answer: there are too many
    difficulty: 2
    hints:
    - Look at the night sky.
    - So many.
    solution: There are too many stars.
    mistakes: {"they are too heavy": "e3_count_stars"}
  - prompt: 'A story where the moon talks is:'
    options:
    - imaginary (make-believe)
    - a science report
    - a recipe
    - a timetable
    answer: imaginary (make-believe)
    difficulty: 2
    hints:
    - Can the real moon talk?
    - Imagination.
    solution: It is imaginary.
    mistakes: {"a science report": "e3_make_believe"}
  - prompt: Which number word comes after 'nine'?
    options:
    - ten
    - eight
    - seven
    - eleven
    answer: ten
    difficulty: 1
    hints:
    - 'Count: seven, eight, nine ...'
    - One more.
    solution: Ten comes after nine.
    mistakes: {"eight": "e3_after_nine"}
  - prompt: 'Choose the plural of ''star'':'
    options:
    - stars
    - stares
    - staries
    - star
    answer: stars
    difficulty: 1
    hints:
    - Add s.
    - More than one.
    solution: One star, many stars.
    mistakes:
      stares: eng3_grammar
