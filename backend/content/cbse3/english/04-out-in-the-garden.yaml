# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 4. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 4
title: 'Out in the Garden (Unit 2: Toys and Games)'
tips:
  e3_butterfly: "Spiders have 8 legs and no wings. Which insect has bright wings?"
  e3_garden: "What grows in a garden?"
  e3_poem_feel: "The poem talks about sunshine, flowers and play."
  e3_rhyme_play: "Rhyming words end with the same sound: pl-ay, d-?"

concepts:
- code: cbse3e.u2.garden
  title: 'Out in the Garden (Unit 2: Toys and Games)'
  notes: |
    A poem about playing outdoors in a garden: running, swinging, flowers, butterflies, birds and the joy of open air.
    Exact lines are not reproduced here; questions focus on garden words, action words (run, jump, swing), rhymes and the
    poem's happy mood.
  explanations:
    text: This poem is about the fun of playing in a garden. Children run, jump and swing. There are flowers, butterflies and birds. Being outside in fresh air makes us happy.
    visual: Draw a garden with a swing, flowers, a butterfly and children running.
    step_by_step: 1. Read the poem aloud. 2. Find the action words. 3. Find what is in the garden. 4. Say how the poem feels.
    real_world: Playing in a park after school keeps us fit and happy.
  picture:
    kind: compare
    columns:
    - title: In the garden
      points:
      - flowers
      - butterflies
      - swing
    - title: Action words
      points:
      - run
      - jump
      - swing
    alt: In the garden there are flowers, butterflies and a swing; children run, jump and swing.
  activity:
    type: sort
    prompt: 'Out in the Garden: action word or naming word?'
    bins:
    - Action word
    - Naming word
    items:
    - label: run
      bin: Action word
      clue: Can you do it?
      why: 'You can run: it''s an action.'
    - label: flower
      bin: Naming word
      clue: Can you point to it?
      why: 'A flower is a thing: a naming word.'
    - label: swing
      bin: Action word
      clue: Move back and forth.
      why: To swing is an action here.
    - label: butterfly
      bin: Naming word
      clue: A living thing.
      why: Butterfly names an insect.
    - label: jump
      bin: Action word
      clue: Both feet off the ground.
      why: Jump is an action.
  items:
  - prompt: Which is an action word?
    options:
    - jump
    - flower
    - green
    - garden
    answer: jump
    difficulty: 1
    hints:
    - Something you do.
    - Use your legs.
    solution: Jump is an action word.
    mistakes:
      flower: eng3_grammar
  - prompt: Which of these do we find in a garden?
    options:
    - flowers
    - a fridge
    - a bus
    - a blackboard
    answer: flowers
    difficulty: 1
    hints:
    - Plants and colours.
    - Bees love them.
    solution: Flowers are in a garden.
    mistakes: {"a fridge": "e3_garden"}
  - prompt: Which word rhymes with 'play'?
    options:
    - day
    - run
    - tree
    - ball
    answer: day
    difficulty: 1
    hints:
    - Same ending sound.
    - -ay.
    solution: Play and day rhyme.
    mistakes: {"run": "e3_rhyme_play"}
  - prompt: How does the poem make us feel?
    options:
    - happy
    - scared
    - angry
    - bored
    answer: happy
    difficulty: 1
    hints:
    - Playing outside.
    - Fun.
    solution: It makes us happy.
    mistakes: {"scared": "e3_poem_feel"}
  - prompt: 'A small insect with colourful wings that visits flowers is a:'
    options:
    - butterfly
    - spider
    - ant
    - worm
    answer: butterfly
    difficulty: 1
    hints:
    - Pretty wings.
    - Flies flower to flower.
    solution: A butterfly.
    mistakes: {"spider": "e3_butterfly"}
  - prompt: 'Choose the correct sentence:'
    options:
    - The children are playing.
    - The children is playing.
    - The children am playing.
    - The children playing is.
    answer: The children are playing.
    difficulty: 2
    hints:
    - '''Children'' is more than one.'
    - Read aloud.
    solution: '''The children are playing'' is correct.'
    mistakes:
      The children is playing.: eng3_grammar
