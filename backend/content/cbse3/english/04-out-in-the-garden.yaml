# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 4. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 4
title: 'Out in the Garden (Unit 2: Toys and Games)'
tips:
  e3_butterfly: "Spiders have 8 legs and no wings. Which insect has bright wings?"
  e3_garden: "What grows in a garden?"
  e3_poem_feel: "The poem talks about sunshine, flowers and play."
  e3_rhyme_play: "Rhyming words end with the same sound: pl-ay, d-?"
  c3e4_action: An action word is something you can do. Try acting it out.
  c3e4_rhyme: Say both words aloud and listen only to the end sound.
  c3e4_garden: 'Picture a garden: what grows, flies or crawls there?'

concepts:
- code: cbse3e.u2.garden
  title: 'Out in the Garden (Unit 2: Toys and Games)'
  notes: |
    A poem about playing outdoors in a garden: running, swinging, flowers, butterflies, birds and the joy of open air.
    Exact lines are not reproduced here; questions focus on garden words, action words (run, jump, swing), rhymes and the
    poem's happy mood.
  explanations:
    text: This poem is about the fun of playing in a garden. Children run, jump and swing. There are flowers, butterflies and birds. Being outside in fresh air makes us happy.
    visual: Draw a garden with a swing, flowers, a butterfly and children running.
    step_by_step: 1. Read the poem aloud. 2. Find the action words. 3. Find what is in the garden. 4. Say how the poem feels.
    real_world: Playing in a park after school keeps us fit and happy.
  picture:
    kind: compare
    columns:
    - title: In the garden
      points:
      - flowers
      - butterflies
      - swing
    - title: Action words
      points:
      - run
      - jump
      - swing
    alt: In the garden there are flowers, butterflies and a swing; children run, jump and swing.
  activity:
    type: sort
    prompt: 'Out in the Garden: action word or naming word?'
    bins:
    - Action word
    - Naming word
    items:
    - label: run
      bin: Action word
      clue: Can you do it?
      why: 'You can run: it''s an action.'
    - label: flower
      bin: Naming word
      clue: Can you point to it?
      why: 'A flower is a thing: a naming word.'
    - label: swing
      bin: Action word
      clue: Move back and forth.
      why: To swing is an action here.
    - label: butterfly
      bin: Naming word
      clue: A living thing.
      why: Butterfly names an insect.
    - label: jump
      bin: Action word
      clue: Both feet off the ground.
      why: Jump is an action.
  lesson:
    - teach: 'Out in the Garden is a happy poem about playing outdoors: running, swinging, smelling flowers, watching butterflies and birds.'
      check:
        prompt: What is the poem about?
        options:
        - playing outdoors in a garden
        - a rainy day at school
        - cooking dinner
        answer: playing outdoors in a garden
        why: It talks about garden fun.
    - teach: 'Action words (verbs) tell what someone does: run, jump, swing, climb, sing, play. You can act them out.'
      picture:
        kind: compare
        columns:
        - title: Action words
          points:
          - run
          - jump
          - swing
          - climb
        - title: Not action words
          points:
          - flower
          - green
          - garden
        alt: Action words beside naming and describing words.
      check:
        prompt: Which of these is a word for something you can do?
        options:
        - climb
        - tree
        - tall
        answer: climb
        why: You can climb; you cannot 'tree'.
    - teach: 'Rhyming words end with the same sound: play / day / way, sun / fun / run, tree / bee / see.'
      check:
        prompt: Which word rhymes with 'sun'?
        options:
        - fun
        - sand
        - sit
        answer: fun
        why: Sun and fun both end in 'un'.
  items:
  - prompt: Which is an action word?
    options:
    - jump
    - flower
    - green
    - garden
    answer: jump
    difficulty: 1
    hints:
    - Something you do.
    - Use your legs.
    solution: Jump is an action word.
    mistakes:
      flower: eng3_grammar
  - prompt: Which of these do we find in a garden?
    options:
    - flowers
    - a fridge
    - a bus
    - a blackboard
    answer: flowers
    difficulty: 1
    hints:
    - Plants and colours.
    - Bees love them.
    solution: Flowers are in a garden.
    mistakes: {"a fridge": "e3_garden"}
  - prompt: Which word rhymes with 'play'?
    options:
    - day
    - run
    - tree
    - ball
    answer: day
    difficulty: 1
    hints:
    - Same ending sound.
    - -ay.
    solution: Play and day rhyme.
    mistakes: {"run": "e3_rhyme_play"}
  - prompt: How does the poem make us feel?
    options:
    - happy
    - scared
    - angry
    - bored
    answer: happy
    difficulty: 1
    hints:
    - Playing outside.
    - Fun.
    solution: It makes us happy.
    mistakes: {"scared": "e3_poem_feel"}
  - prompt: 'A small insect with colourful wings that visits flowers is a:'
    options:
    - butterfly
    - spider
    - ant
    - worm
    answer: butterfly
    difficulty: 1
    hints:
    - Pretty wings.
    - Flies flower to flower.
    solution: A butterfly.
    mistakes: {"spider": "e3_butterfly"}
  - prompt: 'Choose the correct sentence:'
    options:
    - The children are playing.
    - The children is playing.
    - The children am playing.
    - The children playing is.
    answer: The children are playing.
    difficulty: 2
    hints:
    - '''Children'' is more than one.'
    - Read aloud.
    solution: '''The children are playing'' is correct.'
    mistakes:
      The children is playing.: eng3_grammar
  - prompt: Which word rhymes with 'tree'?
    options:
    - bee
    - leaf
    - tall
    answer: bee
    difficulty: 1
    hints:
    - Say 'tree' and listen to the end.
    - Which ends with 'ee'?
    solution: 'Step 1: Tree ends in ''ee''. Step 2: Bee does too.'
    mistakes:
      leaf: c3e4_rhyme
      tall: c3e4_rhyme
  - prompt: 'Find the action word: ''The children swing high.'''
    options:
    - swing
    - children
    - high
    answer: swing
    difficulty: 1
    hints:
    - What are the children doing?
    - Act it out.
    solution: 'Step 1: Children is a naming word. Step 2: Swing is what they do.'
    mistakes:
      children: c3e4_action
      high: c3e4_action
  - prompt: Which of these do we usually find in a garden?
    options:
    - a bee on a flower
    - a fridge
    - a blackboard
    answer: a bee on a flower
    difficulty: 1
    hints:
    - Gardens are outdoors.
    - What lives among plants?
    solution: 'Step 1: Fridges and blackboards are indoors. Step 2: Bees visit garden flowers.'
    mistakes:
      a fridge: c3e4_garden
      a blackboard: c3e4_garden
  - prompt: Which word rhymes with 'flower'?
    options:
    - shower
    - floor
    - flat
    answer: shower
    difficulty: 2
    hints:
    - Listen to the 'ower' sound.
    - Which one ends the same?
    solution: 'Step 1: Flower ends in ''ower''. Step 2: Shower ends in ''ower''.'
    mistakes:
      floor: c3e4_rhyme
      flat: c3e4_rhyme
  - prompt: 'Fill in with an action word: ''Birds ___ in the sky.'''
    options:
    - fly
    - blue
    - nest
    answer: fly
    difficulty: 1
    hints:
    - What do birds do in the sky?
    - It is something they do.
    solution: 'Step 1: We need a doing word. Step 2: Birds fly.'
    mistakes:
      blue: c3e4_action
      nest: c3e4_action
  - prompt: Which line sounds most like a happy garden poem?
    options:
    - We run and play the whole bright day.
    - The test is long and hard.
    - The bus is late again.
    answer: We run and play the whole bright day.
    difficulty: 2
    hints:
    - Look for play and rhyme.
    - Which one is joyful?
    solution: 'Step 1: It has play and a rhyme (play/day). Step 2: It feels happy.'
    mistakes:
      The test is long and hard.: c3e4_garden
      The bus is late again.: c3e4_garden
  - prompt: 'A creature that crawls slowly and carries its shell is a:'
    options:
    - snail
    - parrot
    - fish
    answer: snail
    difficulty: 2
    hints:
    - It leaves a shiny trail.
    - It has a home on its back.
    solution: 'Step 1: Parrots fly, fish swim. Step 2: A snail crawls with its shell.'
    mistakes:
      parrot: c3e4_garden
      fish: c3e4_garden
  - prompt: 'Add -ing: ''jump'' becomes ___'
    options:
    - jumping
    - jumpping
    - jumpeing
    answer: jumping
    difficulty: 2
    hints:
    - Just add -ing at the end.
    - No letters change.
    solution: 'Step 1: jump + ing. Step 2: = jumping.'
    mistakes:
      jumpping: c3e4_action
      jumpeing: c3e4_action
  - prompt: 'Add -ing: ''run'' becomes ___'
    options:
    - running
    - runing
    - runeing
    answer: running
    difficulty: 3
    hints:
    - Short words ending in one vowel + one consonant double the last letter.
    - Like sit → sitting.
    solution: 'Step 1: Double the n. Step 2: run → running.'
    mistakes:
      runing: c3e4_action
      runeing: c3e4_action
