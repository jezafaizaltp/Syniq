# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 12. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 12
title: 'Chandrayaan (Unit 4: The Sky)'
concepts:
- code: cbse3e.u4.chandrayaan
  title: 'Chandrayaan (Unit 4: The Sky)'
  notes: |
    A lesson about India's moon missions, Chandrayaan, by ISRO. Chandrayaan-3 landed near the Moon's south pole on 23
    August 2023 (now National Space Day); its lander was Vikram and its rover Pragyan. Exact text is not reproduced here;
    questions focus on these facts and space words (rocket, moon, rover, scientist).
  explanations:
    text: Chandrayaan means 'moon vehicle'. It is the name of India's missions to the Moon, made by ISRO. In 2023, Chandrayaan-3 landed near the Moon's south pole. Its lander was called Vikram, and its small rover, Pragyan, moved on the Moon's surface.
    visual: Draw a rocket going to the Moon, and a small rover with wheels on the grey Moon surface.
    step_by_step: 1. What is Chandrayaan? 2. Who made it? 3. Where did it land? 4. What did the rover do?
    real_world: 23 August is now celebrated as National Space Day in India because of Chandrayaan-3's landing.
  picture:
    kind: flow
    steps:
    - Rocket launches from Sriharikota
    - Travels to the Moon
    - Vikram lander lands (2023)
    - Pragyan rover explores
    alt: A rocket launches from Sriharikota, travels to the Moon, the Vikram lander lands in 2023, and the Pragyan rover explores.
  activity:
    type: sort
    prompt: 'Chandrayaan: which word?'
    bins:
    - Vikram
    - Pragyan
    - ISRO
    items:
    - label: The lander that touched the Moon
      bin: Vikram
      clue: It landed gently.
      why: Vikram was the lander.
    - label: The rover that moved on the Moon
      bin: Pragyan
      clue: It has wheels.
      why: Pragyan was the rover.
    - label: India's space agency
      bin: ISRO
      clue: Who built it?
      why: ISRO made Chandrayaan.
    - label: Rolled out of the lander
      bin: Pragyan
      clue: Came out after landing.
      why: The rover rolled out of Vikram.
  items:
  - prompt: '''Chandrayaan'' means:'
    options:
    - moon vehicle
    - sun ship
    - star house
    - rain cloud
    answer: moon vehicle
    difficulty: 1
    hints:
    - Chandra = moon.
    - Yaan = vehicle.
    solution: Chandrayaan means moon vehicle.
    mistakes:
      sun ship: eng3_word
  - prompt: Which Indian space agency made Chandrayaan?
    options:
    - ISRO
    - a bakery
    - a school bus company
    - a zoo
    answer: ISRO
    difficulty: 1
    hints:
    - Indian Space Research Organisation.
    - Four letters.
    solution: ISRO made Chandrayaan.
  - prompt: What was the name of Chandrayaan-3's rover?
    options:
    - Pragyan
    - Vikram
    - Mangal
    - Surya
    answer: Pragyan
    difficulty: 2
    hints:
    - The lander was Vikram.
    - The small one with wheels.
    solution: The rover was Pragyan.
    mistakes:
      Vikram: eng3_read_again
  - prompt: 'Chandrayaan-3 landed near the Moon''s:'
    options:
    - south pole
    - north pole of the Earth
    - sun
    - ocean
    answer: south pole
    difficulty: 2
    hints:
    - A part of the Moon no one had landed on before.
    - South.
    solution: It landed near the Moon's south pole.
  - prompt: 'A rover is a machine that:'
    options:
    - moves around on another world's surface
    - flies like a bird
    - swims in the sea
    - cooks food
    answer: moves around on another world's surface
    difficulty: 2
    hints:
    - It has wheels.
    - Explores.
    solution: A rover moves around exploring the surface.
  - prompt: 'National Space Day in India is on:'
    options:
    - 23 August
    - 1 January
    - 25 December
    - 15 August
    answer: 23 August
    difficulty: 2
    hints:
    - The day of the landing.
    - August 2023.
    solution: 23 August is National Space Day.
    mistakes:
      15 August: eng3_read_again
