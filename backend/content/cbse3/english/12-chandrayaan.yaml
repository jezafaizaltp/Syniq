# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 12. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 12
title: 'Chandrayaan (Unit 4: The Sky)'
tips:
  e3_rover: "'Rove' means wander. A rover drives about on wheels."
  e3_south_pole: "Chandrayaan went to the Moon, not the Earth. It landed near the Moon's bottom end."
  c3e12_fact: 'Remember the mission facts: who made it, where it landed, and the names of its parts.'
  c3e12_word: 'Think what job that space word does: carry up, land, move around, or study?'
  c3e12_order: 'Put the trip in order: leave Earth first, land last.'

concepts:
- code: cbse3e.u4.chandrayaan
  title: 'Chandrayaan (Unit 4: The Sky)'
  notes: |
    A lesson about India's moon missions, Chandrayaan, by ISRO. Chandrayaan-3 landed near the Moon's south pole on 23
    August 2023 (now National Space Day); its lander was Vikram and its rover Pragyan. Exact text is not reproduced here;
    questions focus on these facts and space words (rocket, moon, rover, scientist).
  explanations:
    text: Chandrayaan means 'moon vehicle'. It is the name of India's missions to the Moon, made by ISRO. In 2023, Chandrayaan-3 landed near the Moon's south pole. Its lander was called Vikram, and its small rover, Pragyan, moved on the Moon's surface.
    visual: Draw a rocket going to the Moon, and a small rover with wheels on the grey Moon surface.
    step_by_step: 1. What is Chandrayaan? 2. Who made it? 3. Where did it land? 4. What did the rover do?
    real_world: 23 August is now celebrated as National Space Day in India because of Chandrayaan-3's landing.
  picture:
    kind: flow
    steps:
    - Rocket launches from Sriharikota
    - Travels to the Moon
    - Vikram lander lands (2023)
    - Pragyan rover explores
    alt: A rocket launches from Sriharikota, travels to the Moon, the Vikram lander lands in 2023, and the Pragyan rover explores.
  activity:
    type: sort
    prompt: 'Chandrayaan: which word?'
    bins:
    - Vikram
    - Pragyan
    - ISRO
    items:
    - label: The lander that touched the Moon
      bin: Vikram
      clue: It landed gently.
      why: Vikram was the lander.
    - label: The rover that moved on the Moon
      bin: Pragyan
      clue: It has wheels.
      why: Pragyan was the rover.
    - label: India's space agency
      bin: ISRO
      clue: Who built it?
      why: ISRO made Chandrayaan.
    - label: Rolled out of the lander
      bin: Pragyan
      clue: Came out after landing.
      why: The rover rolled out of Vikram.
  lesson:
    - teach: Chandrayaan means 'moon vehicle'. It is India's mission to the Moon, made by ISRO, the Indian Space Research Organisation. Scientists and engineers worked together to build it.
      check:
        prompt: Which agency made Chandrayaan?
        options:
        - ISRO
        - a bus company
        - a school
        answer: ISRO
        why: ISRO is India's space agency.
    - teach: A rocket carried Chandrayaan-3 from Earth. Its lander, Vikram, landed near the Moon's south pole on 23 August 2023. Then its rover, Pragyan, rolled out to explore.
      picture:
        kind: flow
        steps:
        - rocket leaves Earth
        - travels to the Moon
        - Vikram lander lands
        - Pragyan rover explores
        alt: The steps of Chandrayaan-3's journey.
      check:
        prompt: What was the lander called?
        options:
        - Vikram
        - Pragyan
        - Mangal
        answer: Vikram
        why: Vikram landed; Pragyan was the rover.
    - teach: 'Space words: rocket (carries things to space), lander (lands softly), rover (moves around on the surface), scientist (studies and finds out). 23 August is now National Space Day in India.'
      check:
        prompt: What does a rover do?
        options:
        - moves around on the surface
        - flies like a bird
        - cooks food
        answer: moves around on the surface
        why: Rovers roll around to explore.
  items:
  - prompt: '''Chandrayaan'' means:'
    options:
    - moon vehicle
    - sun ship
    - star house
    - rain cloud
    answer: moon vehicle
    difficulty: 1
    hints:
    - Chandra = moon.
    - Yaan = vehicle.
    solution: Chandrayaan means moon vehicle.
    mistakes:
      sun ship: eng3_word
  - prompt: Which Indian space agency made Chandrayaan?
    options:
    - ISRO
    - a bakery
    - a school bus company
    - a zoo
    answer: ISRO
    difficulty: 1
    hints:
    - Indian Space Research Organisation.
    - Four letters.
    solution: ISRO made Chandrayaan.
    mistakes: {"a zoo": "v4_isro"}
  - prompt: What was the name of Chandrayaan-3's rover?
    options:
    - Pragyan
    - Vikram
    - Mangal
    - Surya
    answer: Pragyan
    difficulty: 2
    hints:
    - The lander was Vikram.
    - The small one with wheels.
    solution: The rover was Pragyan.
    mistakes:
      Vikram: eng3_read_again
  - prompt: 'Chandrayaan-3 landed near the Moon''s:'
    options:
    - south pole
    - north pole of the Earth
    - sun
    - ocean
    answer: south pole
    difficulty: 2
    hints:
    - A part of the Moon no one had landed on before.
    - South.
    solution: It landed near the Moon's south pole.
    mistakes: {"north pole of the Earth": "e3_south_pole"}
  - prompt: 'A rover is a machine that:'
    options:
    - moves around on another world's surface
    - flies like a bird
    - swims in the sea
    - cooks food
    answer: moves around on another world's surface
    difficulty: 2
    hints:
    - It has wheels.
    - Explores.
    solution: A rover moves around exploring the surface.
    mistakes: {"flies like a bird": "e3_rover"}
  - prompt: 'National Space Day in India is on:'
    options:
    - 23 August
    - 1 January
    - 25 December
    - 15 August
    answer: 23 August
    difficulty: 2
    hints:
    - The day of the landing.
    - August 2023.
    solution: 23 August is National Space Day.
    mistakes:
      15 August: eng3_read_again
  - prompt: What carries a spacecraft up from Earth?
    options:
    - a rocket
    - a bicycle
    - a boat
    answer: a rocket
    difficulty: 1
    hints:
    - It roars and shoots up into the sky.
    - It has powerful engines.
    solution: 'Step 1: A spacecraft must leave Earth. Step 2: A rocket carries it.'
    mistakes:
      a bicycle: c3e12_word
      a boat: c3e12_word
  - prompt: What was the name of Chandrayaan-3's lander?
    options:
    - Vikram
    - Pragyan
    - Aryabhata
    answer: Vikram
    difficulty: 2
    hints:
    - Pragyan was the rover.
    - The lander was named after the father of India's space programme.
    solution: 'Step 1: The rover was Pragyan. Step 2: The lander was Vikram.'
    mistakes:
      Pragyan: c3e12_fact
      Aryabhata: c3e12_fact
  - prompt: In which year did Chandrayaan-3 land on the Moon?
    answer: '2023'
    check: '2023'
    difficulty: 2
    hints:
    - It was on 23 August.
    - Only a few years ago.
    solution: 'Step 1: The landing was on 23 August. Step 2: The year was 2023.'
    mistakes:
      '2020': c3e12_fact
      '2024': c3e12_fact
  - prompt: 'Put in order: lander lands, rocket leaves Earth, rover explores.'
    options:
    - rocket leaves Earth, lander lands, rover explores
    - rover explores, rocket leaves Earth, lander lands
    - lander lands, rover explores, rocket leaves Earth
    answer: rocket leaves Earth, lander lands, rover explores
    difficulty: 2
    hints:
    - What must happen first?
    - The rover comes out of the lander.
    solution: 'Step 1: The rocket leaves first. Step 2: The lander lands, then the rover explores.'
    mistakes:
      rover explores, rocket leaves Earth, lander lands: c3e12_order
      lander lands, rover explores, rocket leaves Earth: c3e12_order
  - prompt: 'A person who studies and finds out how things work is a:'
    options:
    - scientist
    - shopkeeper
    - driver
    answer: scientist
    difficulty: 1
    hints:
    - They work in labs.
    - ISRO has many of them.
    solution: 'Step 1: Studying and testing is their job. Step 2: Scientist.'
    mistakes:
      shopkeeper: c3e12_word
      driver: c3e12_word
  - prompt: Why do we celebrate National Space Day on 23 August?
    options:
    - Chandrayaan-3 landed on the Moon that day
    - it is a harvest day
    - it is the first day of school
    answer: Chandrayaan-3 landed on the Moon that day
    difficulty: 2
    hints:
    - Something big happened in space that day.
    - Think of the Moon.
    solution: 'Step 1: 23 August 2023 was the landing. Step 2: So the day is National Space Day.'
    mistakes:
      it is a harvest day: c3e12_fact
      it is the first day of school: c3e12_fact
  - prompt: Which word is a space word?
    options:
    - astronaut
    - tractor
    - kitchen
    answer: astronaut
    difficulty: 1
    hints:
    - A person who travels to space.
    - The others are on Earth.
    solution: 'Step 1: Tractor and kitchen belong on Earth. Step 2: An astronaut goes to space.'
    mistakes:
      tractor: c3e12_word
      kitchen: c3e12_word
  - prompt: Which sentence is correct?
    options:
    - The rover moves on the Moon.
    - The rover move on the Moon.
    - the rover moves on the moon
    answer: The rover moves on the Moon.
    difficulty: 2
    hints:
    - One rover takes 'moves'.
    - Moon is a special name here, with a capital.
    solution: 'Step 1: One rover moves. Step 2: Capital T, capital M, full stop.'
    mistakes:
      The rover move on the Moon.: c3e12_word
      the rover moves on the moon: c3e12_word
  - prompt: Many people worked together to build Chandrayaan. What does this teach us?
    options:
    - teamwork helps us do big things
    - one person can do everything alone
    - space is easy
    answer: teamwork helps us do big things
    difficulty: 3
    hints:
    - Think of scientists, engineers and many helpers.
    - Could one person do it all?
    solution: 'Step 1: Thousands worked together. Step 2: Teamwork made it possible.'
    mistakes:
      one person can do everything alone: c3e12_fact
      space is easy: c3e12_fact
