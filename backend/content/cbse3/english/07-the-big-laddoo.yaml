# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 7. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 7
title: 'The Big Laddoo (Unit 3: Good Food)'
concepts:
- code: cbse3e.u3.laddoo
  title: 'The Big Laddoo (Unit 3: Good Food)'
  notes: |
    A fun poem about a huge laddoo, the sweet many Indian families make for festivals. Exact lines are not reproduced
    here; questions focus on food words, describing words (big, round, sweet), rhymes, and sharing.
  explanations:
    text: 'This funny poem is about a big laddoo: round, sweet and yummy. Laddoos are made for festivals and happy days. A big laddoo is even better when it is shared.'
    visual: Draw a giant round laddoo with children around it, each holding a small piece.
    step_by_step: 1. Read the poem aloud. 2. Find the words that describe the laddoo. 3. Find the rhymes. 4. Who shares the laddoo?
    real_world: Families make besan and boondi laddoos for Diwali, weddings and birthdays.
  picture:
    kind: compare
    columns:
    - title: The laddoo is
      points:
      - big
      - round
      - sweet
    - title: Made for
      points:
      - festivals
      - birthdays
      - happy news
    alt: The laddoo is big, round and sweet, and is made for festivals, birthdays and happy news.
  items:
  - prompt: What shape is a laddoo?
    options:
    - round
    - square
    - flat
    - triangle
    answer: round
    difficulty: 1
    hints:
    - Like a ball.
    - Rolled.
    solution: A laddoo is round.
  - prompt: How does a laddoo taste?
    options:
    - sweet
    - salty
    - sour
    - bitter
    answer: sweet
    difficulty: 1
    hints:
    - It is a sweet.
    - Sugar or jaggery.
    solution: A laddoo is sweet.
  - prompt: Which word rhymes with 'big'?
    options:
    - pig
    - small
    - round
    - sweet
    answer: pig
    difficulty: 1
    hints:
    - Same ending sound.
    - -ig.
    solution: Big and pig rhyme.
  - prompt: Which is a describing word in 'a big laddoo'?
    options:
    - big
    - a
    - laddoo
    - none
    answer: big
    difficulty: 2
    hints:
    - It tells what the laddoo is like.
    - Size.
    solution: Big describes the laddoo.
    mistakes:
      laddoo: eng3_grammar
  - prompt: 'Laddoos are usually made for:'
    options:
    - festivals and happy days
    - only for medicine
    - feeding fish
    - school exams
    answer: festivals and happy days
    difficulty: 1
    hints:
    - Diwali.
    - Celebrations.
    solution: Festivals and happy days.
  - prompt: What is the opposite of 'big'?
    options:
    - small
    - huge
    - large
    - giant
    answer: small
    difficulty: 2
    hints:
    - Not big.
    - Tiny.
    solution: Small is the opposite of big.
    mistakes:
      huge: eng3_word
