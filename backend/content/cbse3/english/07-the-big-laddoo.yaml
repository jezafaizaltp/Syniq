# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 7. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 7
title: 'The Big Laddoo (Unit 3: Good Food)'
tips:
  e3_laddoo_shape: "A laddoo is rolled between the palms like a ball."
  e3_laddoo_taste: "A laddoo is a mithai made with sugar or jaggery."
  e3_laddoo_when: "When does your family make sweets to share?"
  e3_rhyme_big: "Rhyming words end with the same sound: b-ig, p-?"
  c3e7_describe: 'Ask what kind: how does it look, taste, feel or how big is it?'
  c3e7_rhyme: Say the two words and listen to the last sound only.
  c3e7_share: Think what makes a festival happy for everyone, not just one person.

concepts:
- code: cbse3e.u3.laddoo
  title: 'The Big Laddoo (Unit 3: Good Food)'
  notes: |
    A fun poem about a huge laddoo, the sweet many Indian families make for festivals. Exact lines are not reproduced
    here; questions focus on food words, describing words (big, round, sweet), rhymes, and sharing.
  explanations:
    text: 'This funny poem is about a big laddoo: round, sweet and yummy. Laddoos are made for festivals and happy days. A big laddoo is even better when it is shared.'
    visual: Draw a giant round laddoo with children around it, each holding a small piece.
    step_by_step: 1. Read the poem aloud. 2. Find the words that describe the laddoo. 3. Find the rhymes. 4. Who shares the laddoo?
    real_world: Families make besan and boondi laddoos for Diwali, weddings and birthdays.
  picture:
    kind: compare
    columns:
    - title: The laddoo is
      points:
      - big
      - round
      - sweet
    - title: Made for
      points:
      - festivals
      - birthdays
      - happy news
    alt: The laddoo is big, round and sweet, and is made for festivals, birthdays and happy news.
  activity:
    type: sort
    prompt: 'The Big Laddoo: describing word or naming word?'
    bins:
    - Describing word
    - Naming word
    items:
    - label: round
      bin: Describing word
      clue: Tells us the shape.
      why: Round describes the laddoo.
    - label: laddoo
      bin: Naming word
      clue: A sweet.
      why: Laddoo is the name of a sweet.
    - label: sweet
      bin: Describing word
      clue: Tells us the taste.
      why: Sweet describes how it tastes.
    - label: festival
      bin: Naming word
      clue: A celebration.
      why: Festival names an event.
    - label: big
      bin: Describing word
      clue: Tells us the size.
      why: Big describes size.
  lesson:
    - teach: The Big Laddoo is a fun poem about a huge laddoo. Laddoos are round sweets made in many Indian homes for festivals and happy days.
      check:
        prompt: When are laddoos often made?
        options:
        - for festivals and happy days
        - only when someone is ill
        - never
        answer: for festivals and happy days
        why: Sweets are shared to celebrate.
      ways:
      - style: step_by_step
        teach: 'How a besan laddoo is made at home. Step 1: Roast gram flour (besan) in ghee until it smells nutty. Step 2: Let it cool a little. Step 3: Mix in powdered sugar. Step 4: Press small handfuls into round balls.'
      - style: visual
        teach: Making besan laddoos, from flour to round sweets.
        picture:
          kind: flow
          steps:
          - Roast besan in ghee
          - Let it cool a little
          - Mix in powdered sugar
          - Press into round balls
          alt: To make besan laddoos, roast gram flour in ghee, let it cool a little, mix in powdered sugar and press small handfuls into round balls.
    - teach: 'Describing words tell us about food: big, small, round, sweet, soft, crunchy, hot, cold. ''A big, round, sweet laddoo.'''
      picture:
        kind: compare
        columns:
        - title: Looks
          points:
          - big
          - round
          - yellow
        - title: Tastes
          points:
          - sweet
          - salty
          - sour
        - title: Feels
          points:
          - soft
          - crunchy
        alt: Describing words for how food looks, tastes and feels.
      check:
        prompt: Which word tells how a laddoo tastes?
        options:
        - sweet
        - round
        - big
        answer: sweet
        why: Sweet is a taste; round and big tell how it looks.
      ways:
      - style: visual
        teach: Describing words for food, sorted by what they tell us.
        picture:
          kind: compare
          columns:
          - title: Size and shape
            points:
            - tiny
            - long
            - flat
          - title: Taste
            points:
            - salty
            - sour
            - spicy
          - title: Feel
            points:
            - chewy
            - sticky
            - smooth
          alt: Tiny, long and flat tell size and shape. Salty, sour and spicy tell taste. Chewy, sticky and smooth tell how food feels.
      - style: step_by_step
        teach: 'Describe a food in three words. Step 1: Pick a food, like a samosa. Step 2: Say its shape: ''three-sided''. Step 3: Say its taste: ''spicy''. Step 4: Say how it feels: ''crisp''. Now say it: ''a crisp, spicy, three-sided samosa''.'
    - teach: 'The poem plays with rhymes: big / pig / dig, round / ground / sound, sweet / eat / treat. And sharing a big laddoo makes many people happy.'
      check:
        prompt: Which word rhymes with 'sweet'?
        options:
        - treat
        - sour
        - swim
        answer: treat
        why: Sweet and treat both end with 'eet'.
      ways:
      - style: visual
        teach: Rhyming word families you can use in a funny food poem.
        picture:
          kind: compare
          columns:
          - title: -ake
            points:
            - cake
            - bake
            - lake
          - title: -ice
            points:
            - rice
            - nice
            - mice
          - title: -ot
            points:
            - hot
            - pot
            - lot
          alt: Cake, bake and lake end with -ake. Rice, nice and mice end with -ice. Hot, pot and lot end with -ot.
      - style: real_world
        teach: When there is only one big sweet at home, a grandparent often breaks it into pieces so that every child gets a bit. Everyone smiles, and no one feels left out.
  items:
  - prompt: What shape is a laddoo?
    options:
    - round
    - square
    - flat
    - triangle
    answer: round
    difficulty: 1
    hints:
    - Like a ball.
    - Rolled.
    solution: A laddoo is round.
    mistakes: {"square": "e3_laddoo_shape"}
  - prompt: How does a laddoo taste?
    options:
    - sweet
    - salty
    - sour
    - bitter
    answer: sweet
    difficulty: 1
    hints:
    - "Laddoos are made with sugar or jaggery."
    - Sugar or jaggery.
    solution: A laddoo is sweet.
    mistakes: {"salty": "e3_laddoo_taste"}
  - prompt: Which word rhymes with 'big'?
    options:
    - pig
    - small
    - round
    - sweet
    answer: pig
    difficulty: 1
    hints:
    - Same ending sound.
    - -ig.
    solution: Big and pig rhyme.
    mistakes: {"small": "e3_rhyme_big"}
  - prompt: Which is a describing word in 'a big laddoo'?
    options:
    - big
    - a
    - laddoo
    - none
    answer: big
    difficulty: 2
    hints:
    - It tells what the laddoo is like.
    - Size.
    solution: Big describes the laddoo.
    mistakes:
      laddoo: eng3_grammar
  - prompt: 'Laddoos are usually made for:'
    options:
    - festivals and happy days
    - only for medicine
    - feeding fish
    - school exams
    answer: festivals and happy days
    difficulty: 1
    hints:
    - Diwali.
    - Celebrations.
    solution: Festivals and happy days.
    mistakes: {"only for medicine": "e3_laddoo_when"}
  - prompt: What is the opposite of 'big'?
    options:
    - small
    - huge
    - large
    - giant
    answer: small
    difficulty: 2
    hints:
    - Not big.
    - Tiny.
    solution: Small is the opposite of big.
    mistakes:
      huge: eng3_word
  - prompt: Which word rhymes with 'round'?
    options:
    - ground
    - rain
    - red
    answer: ground
    difficulty: 1
    hints:
    - Listen to 'ound'.
    - Which one ends the same?
    solution: 'Step 1: Round ends in ''ound''. Step 2: Ground does too.'
    mistakes:
      rain: c3e7_rhyme
      red: c3e7_rhyme
  - prompt: Which describing word tells how a papad feels when you bite it?
    options:
    - crunchy
    - sweet
    - round
    answer: crunchy
    difficulty: 2
    hints:
    - Think of the sound when you bite it.
    - Not taste, not shape.
    solution: 'Step 1: The question is about feel. Step 2: Papad is crunchy.'
    mistakes:
      sweet: c3e7_describe
      round: c3e7_describe
  - prompt: 'Find the describing word: ''Amma made a huge laddoo.'''
    options:
    - huge
    - made
    - laddoo
    answer: huge
    difficulty: 1
    hints:
    - Which word tells what kind of laddoo?
    - Made is an action.
    solution: 'Step 1: Laddoo is a naming word. Step 2: Huge describes it.'
    mistakes:
      made: c3e7_describe
      laddoo: c3e7_describe
  - prompt: A laddoo is too big for one child. What is the best thing to do?
    options:
    - "share it with family and friends"
    - "throw half of it in the bin"
    - "hide it so nobody else sees"
    answer: share it with family and friends
    difficulty: 1
    hints:
    - Food should not be wasted.
    - More people can enjoy it.
    solution: 'Step 1: Do not waste it. Step 2: Share it so all can enjoy.'
    mistakes:
      "throw half of it in the bin": c3e7_share
      "hide it so nobody else sees": c3e7_share
  - prompt: Which of these is a sweet?
    options:
    - jalebi
    - pickle
    - chilli
    answer: jalebi
    difficulty: 1
    hints:
    - Which one is dipped in sugar syrup?
    - Pickle and chilli are spicy.
    solution: 'Step 1: Pickle and chilli are not sweet. Step 2: Jalebi is a sweet.'
    mistakes:
      pickle: c3e7_describe
      chilli: c3e7_describe
  - prompt: What is the opposite of 'sweet' in taste?
    options:
    - bitter
    - soft
    - big
    answer: bitter
    difficulty: 2
    hints:
    - Think of how karela or neem leaves taste.
    - It is a taste word.
    solution: 'Step 1: Soft and big are not tastes. Step 2: Bitter is the opposite taste.'
    mistakes:
      soft: c3e7_describe
      big: c3e7_describe
  - prompt: Find a word that rhymes with 'big'.
    options:
    - dig
    - bag
    - bug
    answer: dig
    difficulty: 2
    hints:
    - The middle sound must match too.
    - Big has 'ig'.
    solution: 'Step 1: Big ends in ''ig''. Step 2: Dig ends in ''ig''.'
    mistakes:
      bag: c3e7_rhyme
      bug: c3e7_rhyme
  - prompt: 'Bigger than big is:'
    options:
    - bigger
    - biger
    - more big
    answer: bigger
    difficulty: 3
    hints:
    - Double the last letter before adding -er.
    - Like hot → hotter.
    solution: 'Step 1: big → double the g. Step 2: add -er: bigger.'
    mistakes:
      biger: c3e7_describe
      more big: c3e7_describe
  - prompt: Which sentence uses describing words?
    options:
    - "The soft, sweet laddoo melted."
    - "The laddoo melted in my hand."
    - "It melted and then it was gone."
    answer: The soft, sweet laddoo melted.
    difficulty: 2
    hints:
    - Look for words that tell what kind.
    - Which sentence has them?
    solution: 'Step 1: Soft and sweet describe the laddoo. Step 2: Only that sentence has them.'
    mistakes:
      "The laddoo melted in my hand.": c3e7_describe
      "It melted and then it was gone.": c3e7_describe
  - prompt: 'Case: A child gets one very big laddoo at a festival. Three cousins are watching. The child wants to eat it alone, but it is far too big for one person. What would make the most people happy?'
    options:
    - "Break it into pieces and share it with the cousins"
    - "Hide it in a pocket and eat it later alone"
    - "Eat it fast before the cousins can ask for some"
    answer: Break it into pieces and share it with the cousins
    hints:
    - Can one child finish such a big laddoo?
    - What could the cousins enjoy too?
    solution: A big laddoo is too much for one child. Sharing it lets everyone enjoy it, and nothing is wasted.
    mistakes:
      "Hide it in a pocket and eat it later alone": c3e7_share
      "Eat it fast before the cousins can ask for some": c3e7_share
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a menu card for a class food fair. Which line uses the most describing words to make the food sound tasty?'
    options:
    - "Hot, crispy, golden pakoras"
    - "Pakoras are here for you"
    - "Come and eat some pakoras"
    answer: Hot, crispy, golden pakoras
    hints:
    - Which words tell what kind of food it is?
    - Which line has the most of them?
    solution: '''Hot'', ''crispy'' and ''golden'' are describing words. They tell how the pakoras feel, look and taste.'
    mistakes:
      "Pakoras are here for you": c3e7_describe
      "Come and eat some pakoras": c3e7_describe
    exam: competency
    difficulty: 2
