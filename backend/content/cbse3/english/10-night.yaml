# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 10. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 10
title: 'Night (Unit 4: The Sky)'
tips:
  e3_birds_night: "Birds rest at night in their homes in the trees."
  e3_night_mood: "Night is quiet, with everyone sleeping."
  e3_night_sky: "The sun is out in the day. What shines at night?"
  e3_owl: "This bird has big round eyes and hoots in the dark."
  e3_rhyme_night: "Rhyming words end with the same sound: n-ight, l-?"
  c3e10_sky: Picture looking up after dark. What shines up there?
  c3e10_opp: Opposites are at the two far ends, like day and its partner.
  c3e10_rhyme: Say both words aloud. Listen only to the ending sound.

concepts:
- code: cbse3e.u4.night
  title: 'Night (Unit 4: The Sky)'
  notes: |
    A poem about night: the moon and stars appear, birds go to their nests, the world becomes quiet and people sleep.
    Exact lines are not reproduced here; questions focus on day and night words, opposites, rhymes and the calm mood.
  explanations:
    text: This poem is about the night. The sun sets, the moon and stars come out, birds fly back to their nests and everything becomes quiet. It is time to rest and sleep.
    visual: Draw a night sky with a moon, stars, a sleeping village and birds in a nest.
    step_by_step: 1. Read the poem slowly. 2. What do we see at night? 3. What do animals and people do? 4. How does the poem feel?
    real_world: At night, owls wake up and hoot while most birds sleep.
  picture:
    kind: compare
    columns:
    - title: Day
      points:
      - sun
      - bright
      - work and play
    - title: Night
      points:
      - moon and stars
      - dark
      - rest and sleep
    alt: In the day there is the sun, it is bright and we work and play; at night there are the moon and stars, it is dark and we rest and sleep.
  activity:
    type: sort
    prompt: 'Night: day or night?'
    bins:
    - Day
    - Night
    items:
    - label: 🌙 The moon and stars
      bin: Night
      clue: In a dark sky.
      why: We see them at night.
    - label: 🌞 The sun is up
      bin: Day
      clue: Bright sky.
      why: The sun shines in the day.
    - label: 🐦 Birds go to their nests
      bin: Night
      clue: Time to rest.
      why: Birds return home at night.
    - label: 🏫 Children go to school
      bin: Day
      clue: Morning.
      why: School is in the day.
    - label: 😴 People sleep
      bin: Night
      clue: Quiet.
      why: Night is for sleep.
  lesson:
    - teach: Night is a calm poem. At night the moon and stars shine, birds fly back to their nests, the world grows quiet, and people go to sleep.
      check:
        prompt: What shines in the sky at night?
        options:
        - the moon and stars
        - the rainbow
        - the sun
        answer: the moon and stars
        why: The sun has set; the moon and stars appear.
    - teach: 'Day and night are opposites. Many words come in opposite pairs: light / dark, awake / asleep, noisy / quiet, morning / evening.'
      picture:
        kind: compare
        columns:
        - title: Day
          points:
          - light
          - awake
          - noisy
        - title: Night
          points:
          - dark
          - asleep
          - quiet
        alt: Day words and their night opposites.
      check:
        prompt: What is the opposite of 'awake'?
        options:
        - asleep
        - early
        - bright
        answer: asleep
        why: Awake means not sleeping; asleep means sleeping.
    - teach: 'The poem uses rhymes: night / light / bright, moon / soon / tune, sleep / deep / peep. The mood (feeling) of the poem is calm and quiet.'
      check:
        prompt: Which word rhymes with 'moon'?
        options:
        - soon
        - moan
        - mine
        answer: soon
        why: Moon and soon both end with 'oon'.
  items:
  - prompt: What do we see in the sky at night?
    options:
    - the moon and stars
    - the sun
    - a rainbow
    - white clouds in sunshine
    answer: the moon and stars
    difficulty: 1
    hints:
    - Look up at night.
    - Twinkle.
    solution: The moon and stars.
    mistakes: {"the sun": "e3_night_sky"}
  - prompt: What is the opposite of 'night'?
    options:
    - day
    - dark
    - moon
    - sleep
    answer: day
    difficulty: 1
    hints:
    - When the sun shines.
    - Morning.
    solution: Day is the opposite of night.
    mistakes:
      dark: eng3_word
  - prompt: Where do birds go at night?
    options:
    - to their nests
    - to school
    - to the sea
    - to the shop
    answer: to their nests
    difficulty: 1
    hints:
    - Their home.
    - To sleep.
    solution: Birds go to their nests.
    mistakes: {"to school": "e3_birds_night"}
  - prompt: Which word rhymes with 'night'?
    options:
    - light
    - moon
    - star
    - dark
    answer: light
    difficulty: 2
    hints:
    - Same ending sound.
    - -ight.
    solution: Night and light rhyme.
    mistakes: {"dark": "e3_rhyme_night"}
  - prompt: 'The mood of the poem is:'
    options:
    - calm and quiet
    - loud and angry
    - fast and noisy
    - scary
    answer: calm and quiet
    difficulty: 2
    hints:
    - Everyone is resting.
    - Peaceful.
    solution: The poem is calm and quiet.
    mistakes: {"loud and angry": "e3_night_mood"}
  - prompt: Which bird stays awake at night?
    options:
    - owl
    - crow
    - sparrow
    - parrot
    answer: owl
    difficulty: 1
    hints:
    - Hoot hoot.
    - Big eyes.
    solution: The owl stays awake at night.
    mistakes: {"crow": "e3_owl"}
  - prompt: What is the opposite of 'dark'?
    options:
    - light
    - night
    - black
    answer: light
    difficulty: 1
    hints:
    - Night and black are dark things.
    - What does a lamp give?
    solution: 'Step 1: Night and black go with dark. Step 2: Light is the opposite.'
    mistakes:
      night: c3e10_opp
      black: c3e10_opp
  - prompt: Which word rhymes with 'sleep'?
    options:
    - deep
    - slip
    - sheet
    answer: deep
    difficulty: 1
    hints:
    - Listen to 'eep'.
    - Which word ends the same?
    solution: 'Step 1: Sleep ends in ''eep''. Step 2: Deep ends in ''eep''.'
    mistakes:
      slip: c3e10_rhyme
      sheet: c3e10_rhyme
  - prompt: Which animal is awake and hunting at night?
    options:
    - a bat
    - a hen
    - a cow
    answer: a bat
    difficulty: 2
    hints:
    - Hens and cows sleep at night.
    - It flies in the dark.
    solution: 'Step 1: Hens and cows rest at night. Step 2: Bats come out at night.'
    mistakes:
      a hen: c3e10_sky
      a cow: c3e10_sky
  - prompt: What is the opposite of 'noisy'?
    options:
    - quiet
    - loud
    - busy
    answer: quiet
    difficulty: 1
    hints:
    - Loud means the same as noisy.
    - Night is ...
    solution: 'Step 1: Loud is like noisy. Step 2: Quiet is the opposite.'
    mistakes:
      loud: c3e10_opp
      busy: c3e10_opp
  - prompt: 'The moon looks bright at night because:'
    options:
    - sunlight falls on it
    - it is a big lamp
    - it is on fire
    answer: sunlight falls on it
    difficulty: 3
    hints:
    - The moon has no light of its own.
    - Where does its light come from?
    solution: 'Step 1: The moon does not make light. Step 2: It shines because sunlight falls on it.'
    mistakes:
      it is a big lamp: c3e10_sky
      it is on fire: c3e10_sky
  - prompt: Which word fits a calm night?
    options:
    - peaceful
    - crowded
    - loud
    answer: peaceful
    difficulty: 2
    hints:
    - Calm means still and quiet.
    - Which word matches that?
    solution: 'Step 1: Crowded and loud are busy words. Step 2: Peaceful fits a calm night.'
    mistakes:
      crowded: c3e10_opp
      loud: c3e10_opp
  - prompt: What is the opposite of 'morning'?
    options:
    - evening
    - noon
    - sunrise
    answer: evening
    difficulty: 2
    hints:
    - Morning starts the day.
    - Which part ends it?
    solution: 'Step 1: Morning is the start of the day. Step 2: Evening is near its end.'
    mistakes:
      noon: c3e10_opp
      sunrise: c3e10_opp
  - prompt: Which word rhymes with 'bright'?
    options:
    - kite
    - brick
    - bread
    answer: kite
    difficulty: 2
    hints:
    - Listen to 'ight' and 'ite'.
    - They sound the same though spelt differently.
    solution: 'Step 1: Bright ends with the ''ite'' sound. Step 2: Kite ends the same.'
    mistakes:
      brick: c3e10_rhyme
      bread: c3e10_rhyme
  - prompt: Choose the correct sentence.
    options:
    - The stars twinkle at night.
    - The stars twinkles at night.
    - the stars twinkle at night
    answer: The stars twinkle at night.
    difficulty: 2
    hints:
    - Stars are many.
    - Check the capital and full stop.
    solution: 'Step 1: Many stars take ''twinkle'' (no s). Step 2: Capital T and a full stop.'
    mistakes:
      The stars twinkles at night.: c3e10_opp
      the stars twinkle at night: c3e10_opp
