# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 10. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 10
title: 'Night (Unit 4: The Sky)'
concepts:
- code: cbse3e.u4.night
  title: 'Night (Unit 4: The Sky)'
  notes: |
    A poem about night: the moon and stars appear, birds go to their nests, the world becomes quiet and people sleep.
    Exact lines are not reproduced here; questions focus on day and night words, opposites, rhymes and the calm mood.
  explanations:
    text: This poem is about the night. The sun sets, the moon and stars come out, birds fly back to their nests and everything becomes quiet. It is time to rest and sleep.
    visual: Draw a night sky with a moon, stars, a sleeping village and birds in a nest.
    step_by_step: 1. Read the poem slowly. 2. What do we see at night? 3. What do animals and people do? 4. How does the poem feel?
    real_world: At night, owls wake up and hoot while most birds sleep.
  picture:
    kind: compare
    columns:
    - title: Day
      points:
      - sun
      - bright
      - work and play
    - title: Night
      points:
      - moon and stars
      - dark
      - rest and sleep
    alt: In the day there is the sun, it is bright and we work and play; at night there are the moon and stars, it is dark and we rest and sleep.
  activity:
    type: sort
    prompt: 'Night: day or night?'
    bins:
    - Day
    - Night
    items:
    - label: 🌙 The moon and stars
      bin: Night
      clue: In a dark sky.
      why: We see them at night.
    - label: 🌞 The sun is up
      bin: Day
      clue: Bright sky.
      why: The sun shines in the day.
    - label: 🐦 Birds go to their nests
      bin: Night
      clue: Time to rest.
      why: Birds return home at night.
    - label: 🏫 Children go to school
      bin: Day
      clue: Morning.
      why: School is in the day.
    - label: 😴 People sleep
      bin: Night
      clue: Quiet.
      why: Night is for sleep.
  items:
  - prompt: What do we see in the sky at night?
    options:
    - the moon and stars
    - the sun
    - a rainbow
    - white clouds in sunshine
    answer: the moon and stars
    difficulty: 1
    hints:
    - Look up at night.
    - Twinkle.
    solution: The moon and stars.
  - prompt: What is the opposite of 'night'?
    options:
    - day
    - dark
    - moon
    - sleep
    answer: day
    difficulty: 1
    hints:
    - When the sun shines.
    - Morning.
    solution: Day is the opposite of night.
    mistakes:
      dark: eng3_word
  - prompt: Where do birds go at night?
    options:
    - to their nests
    - to school
    - to the sea
    - to the shop
    answer: to their nests
    difficulty: 1
    hints:
    - Their home.
    - To sleep.
    solution: Birds go to their nests.
  - prompt: Which word rhymes with 'night'?
    options:
    - light
    - moon
    - star
    - dark
    answer: light
    difficulty: 2
    hints:
    - Same ending sound.
    - -ight.
    solution: Night and light rhyme.
  - prompt: 'The mood of the poem is:'
    options:
    - calm and quiet
    - loud and angry
    - fast and noisy
    - scary
    answer: calm and quiet
    difficulty: 2
    hints:
    - Everyone is resting.
    - Peaceful.
    solution: The poem is calm and quiet.
  - prompt: Which bird stays awake at night?
    options:
    - owl
    - crow
    - sparrow
    - parrot
    answer: owl
    difficulty: 1
    hints:
    - Hoot hoot.
    - Big eyes.
    solution: The owl stays awake at night.
