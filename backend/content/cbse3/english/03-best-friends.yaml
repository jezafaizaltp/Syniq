# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 3. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 3
title: 'Best Friends (Unit 1: Fun with Friends)'
concepts:
- code: cbse3e.u1.best
  title: 'Best Friends (Unit 1: Fun with Friends)'
  notes: |
    A story about two best friends who are different but care for each other, perhaps quarrel and make up. Exact story
    details are not reproduced here; questions focus on what makes a good friend (sharing, helping, saying sorry),
    opposites and feelings words.
  explanations:
    text: Best friends play together, share things and help each other. Sometimes friends quarrel, but they say sorry and become friends again. Being different does not stop two people from being best friends.
    visual: Draw two friends sharing an umbrella in the rain.
    step_by_step: 1. Who are the friends? 2. What do they like doing? 3. Is there a problem? 4. How do they solve it?
    real_world: Sharing your tiffin with a friend who forgot theirs is what a best friend does.
  picture:
    kind: flow
    steps:
    - Two friends play
    - They quarrel
    - One says sorry
    - They are friends again
    alt: Two friends play, they quarrel, one says sorry, and they are friends again.
  items:
  - prompt: What do best friends do?
    options:
    - share and help each other
    - never talk
    - take each other's things
    - laugh at each other
    answer: share and help each other
    difficulty: 1
    hints:
    - Kind actions.
    - Together.
    solution: Best friends share and help.
  - prompt: 'After a quarrel, a good friend:'
    options:
    - says sorry
    - never speaks again
    - shouts more
    - runs away
    answer: says sorry
    difficulty: 1
    hints:
    - Make up.
    - Magic word.
    solution: A good friend says sorry.
    mistakes:
      never speaks again: eng3_read_again
  - prompt: What is the opposite of 'happy'?
    options:
    - sad
    - glad
    - joyful
    - merry
    answer: sad
    difficulty: 1
    hints:
    - Not happy.
    - Tears.
    solution: Sad is the opposite of happy.
    mistakes:
      glad: eng3_word
  - prompt: Which is a feelings word?
    options:
    - angry
    - table
    - blue
    - seven
    answer: angry
    difficulty: 2
    hints:
    - How you feel.
    - Mood.
    solution: Angry is a feeling.
  - prompt: Can two very different children be best friends?
    options:
    - yes, if they care for each other
    - no, never
    - only if they look the same
    - only on Sundays
    answer: yes, if they care for each other
    difficulty: 2
    hints:
    - What matters in friendship?
    - Caring.
    solution: Yes, caring matters more than being the same.
  - prompt: 'Choose the correct word: ''Riya and Anu ___ best friends.'''
    options:
    - are
    - is
    - am
    - was
    answer: are
    difficulty: 2
    hints:
    - Two people.
    - More than one takes 'are'.
    solution: Riya and Anu are best friends.
    mistakes:
      is: eng3_grammar
