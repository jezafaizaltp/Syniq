# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 3. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 3
title: 'Best Friends (Unit 1: Fun with Friends)'
tips:
  e3_different_friends: "What matters more in a friend: how they look, or how they care?"
  e3_feelings: "Which word tells how someone feels inside?"
  c3e3_friend: Think how you would want a friend to treat you.
  c3e3_opp: An opposite means the very other end. Picture the two side by side.
  c3e3_isare: 'Count the people: one takes ''is'', two or more take ''are''.'

concepts:
- code: cbse3e.u1.best
  title: 'Best Friends (Unit 1: Fun with Friends)'
  notes: |
    A story about two best friends who are different but care for each other, perhaps quarrel and make up. Exact story
    details are not reproduced here; questions focus on what makes a good friend (sharing, helping, saying sorry),
    opposites and feelings words.
  explanations:
    text: Best friends play together, share things and help each other. Sometimes friends quarrel, but they say sorry and become friends again. Being different does not stop two people from being best friends.
    visual: Draw two friends sharing an umbrella in the rain.
    step_by_step: 1. Who are the friends? 2. What do they like doing? 3. Is there a problem? 4. How do they solve it?
    real_world: Sharing your tiffin with a friend who forgot theirs is what a best friend does.
  picture:
    kind: flow
    steps:
    - Two friends play
    - They quarrel
    - One says sorry
    - They are friends again
    alt: Two friends play, they quarrel, one says sorry, and they are friends again.
  activity:
    type: sort
    prompt: 'Best Friends: what''s the opposite?'
    bins:
    - sad
    - short
    - slow
    - small
    items:
    - label: happy
      bin: sad
      clue: How do you feel when you cry?
      why: The opposite of happy is sad.
    - label: tall
      bin: short
      clue: Height.
      why: Tall and short are opposites.
    - label: fast
      bin: slow
      clue: Speed.
      why: Fast and slow are opposites.
    - label: big
      bin: small
      clue: Size.
      why: Big and small are opposites.
  lesson:
    - teach: Best Friends is about two friends who are different from each other but care for each other. Friends can like different things and still be close.
      check:
        prompt: Can friends like different games and still be best friends?
        options:
        - 'yes'
        - 'no'
        - only on Sundays
        answer: 'yes'
        why: Caring matters more than liking the same things.
      ways:
      - style: visual
        teach: Two best friends who like different things but still share a lot.
        picture:
          kind: compare
          columns:
          - title: Friend 1 likes
            points:
            - Drawing
            - Quiet games
            - Mangoes
          - title: Friend 2 likes
            points:
            - Football
            - Running games
            - Bananas
          - title: Both like
            points:
            - Stories
            - Helping each other
          alt: One friend likes drawing, quiet games and mangoes. The other likes football, running games and bananas. Both like stories and helping each other.
      - style: real_world
        teach: In a class, a child who loves maths and a child who loves music can be best friends. They teach each other what they know, and both learn something new.
    - teach: Friends sometimes quarrel. A good friend says 'sorry', listens, and makes up. Sharing, helping and being honest keep a friendship strong.
      picture:
        kind: flow
        steps:
        - quarrel
        - feel sad
        - say sorry
        - listen
        - friends again
        alt: From a quarrel back to friendship.
      check:
        prompt: After a quarrel, what helps most?
        options:
        - saying sorry and talking
        - never talking again
        - telling lies
        answer: saying sorry and talking
        why: Sorry and talking mend a friendship.
      ways:
      - style: step_by_step
        teach: 'Make up after a quarrel. Step 1: Wait until you both feel calm. Step 2: Say ''I''m sorry'' for your part. Step 3: Listen while your friend talks. Step 4: Agree on how to play fairly next time.'
      - style: visual
        teach: Things that keep a friendship strong, and things that can hurt it.
        picture:
          kind: compare
          columns:
          - title: Keeps it strong
            points:
            - Sharing
            - Helping
            - Telling the truth
            - Saying sorry
          - title: Can hurt it
            points:
            - Laughing at a friend
            - Telling lies
            - Never sharing
          alt: Sharing, helping, telling the truth and saying sorry keep a friendship strong. Laughing at a friend, telling lies and never sharing can hurt it.
    - teach: 'Feelings words tell how we feel: happy, sad, angry, scared, excited. Many have opposites: happy / sad, brave / scared, kind / unkind.'
      check:
        prompt: What is the opposite of 'brave'?
        options:
        - scared
        - strong
        - tall
        answer: scared
        why: Brave means not afraid; scared means afraid.
      ways:
      - style: visual
        teach: Some feelings words, set out in pairs of opposites.
        picture:
          kind: compare
          columns:
          - title: Feeling
            points:
            - brave
            - calm
            - excited
          - title: Opposite
            points:
            - scared
            - upset
            - bored
          alt: The opposite of brave is scared, of calm is upset, and of excited is bored.
      - style: real_world
        teach: Some classrooms have a feelings chart near the door. In the morning, each child points to a face, happy, sad, tired or excited, so the teacher knows how everyone feels.
  items:
  - prompt: What do best friends do?
    options:
    - share and help each other
    - never talk
    - take each other's things
    - laugh at each other
    answer: share and help each other
    difficulty: 1
    hints:
    - Kind actions.
    - Together.
    solution: Best friends share and help.
    mistakes: {"never talk": "v4_good_friend"}
  - prompt: 'After a quarrel, a good friend:'
    options:
    - says sorry
    - never speaks again
    - shouts more
    - runs away
    answer: says sorry
    difficulty: 1
    hints:
    - Make up.
    - Magic word.
    solution: A good friend says sorry.
    mistakes:
      never speaks again: eng3_read_again
  - prompt: What is the opposite of 'happy'?
    options:
    - sad
    - glad
    - joyful
    - merry
    answer: sad
    difficulty: 1
    hints:
    - Not happy.
    - Tears.
    solution: Sad is the opposite of happy.
    mistakes:
      glad: eng3_word
  - prompt: Which is a feelings word?
    options:
    - angry
    - table
    - blue
    - seven
    answer: angry
    difficulty: 2
    hints:
    - How you feel.
    - Mood.
    solution: Angry is a feeling.
    mistakes: {"table": "e3_feelings"}
  - prompt: Can two very different children be best friends?
    options:
    - yes, if they care for each other
    - no, never
    - only if they look the same
    - only on Sundays
    answer: yes, if they care for each other
    difficulty: 2
    hints:
    - What matters in friendship?
    - Caring.
    solution: Yes, caring matters more than being the same.
    mistakes: {"no, never": "e3_different_friends"}
  - prompt: 'Choose the correct word: ''Riya and Anu ___ best friends.'''
    options:
    - are
    - is
    - am
    - was
    answer: are
    difficulty: 2
    hints:
    - Two people.
    - More than one takes 'are'.
    solution: Riya and Anu are best friends.
    mistakes:
      is: eng3_grammar
  - prompt: Which is NOT what a good friend does?
    options:
    - laughs when you fall
    - helps you up
    - shares a snack
    answer: laughs when you fall
    difficulty: 1
    hints:
    - Two choices are kind.
    - Which one would hurt?
    solution: 'Step 1: Helping and sharing are kind. Step 2: Laughing when you fall is not.'
    mistakes:
      helps you up: c3e3_friend
      shares a snack: c3e3_friend
  - prompt: What is the opposite of 'kind'?
    options:
    - unkind
    - nice
    - good
    answer: unkind
    difficulty: 1
    hints:
    - Add 'un' to the start.
    - It means not kind.
    solution: 'Step 1: ''Un-'' means not. Step 2: Unkind is the opposite.'
    mistakes:
      nice: c3e3_opp
      good: c3e3_opp
  - prompt: 'Fill in: ''Anu ___ my best friend.'''
    options:
    - is
    - are
    - am
    answer: is
    difficulty: 1
    hints:
    - Anu is one person.
    - One person takes ...
    solution: 'Step 1: One person. Step 2: Use ''is''.'
    mistakes:
      are: c3e3_isare
      am: c3e3_isare
  - prompt: Your friend wins a prize. You feel glad for your friend. Which feelings word fits?
    options:
    - happy
    - angry
    - scared
    answer: happy
    difficulty: 1
    hints:
    - Glad means...
    - A smiling feeling.
    solution: 'Step 1: Glad is a good feeling. Step 2: Happy.'
    mistakes:
      angry: c3e3_friend
      scared: c3e3_friend
  - prompt: What is the opposite of 'big'?
    options:
    - small
    - huge
    - large
    answer: small
    difficulty: 1
    hints:
    - Huge and large mean the same as big.
    - Think of an ant and an elephant.
    solution: 'Step 1: Huge and large are like big. Step 2: Small is the opposite.'
    mistakes:
      huge: c3e3_opp
      large: c3e3_opp
  - prompt: 'Fill in: ''We ___ best friends.'''
    options:
    - are
    - is
    - am
    answer: are
    difficulty: 2
    hints:
    - '''We'' is more than one person.'
    - Many take ...
    solution: 'Step 1: We means two or more. Step 2: Use ''are''.'
    mistakes:
      is: c3e3_isare
      am: c3e3_isare
  - prompt: Your friend broke your pencil by mistake and said sorry. What is a good reply?
    options:
    - It's okay, we can share mine.
    - I will never talk to you.
    - Give me your bag.
    answer: It's okay, we can share mine.
    difficulty: 2
    hints:
    - It was a mistake.
    - Forgiving keeps friends.
    solution: 'Step 1: The friend said sorry. Step 2: Forgive kindly.'
    mistakes:
      I will never talk to you.: c3e3_friend
      Give me your bag.: c3e3_friend
  - prompt: Which word means the same as 'friend'?
    options:
    - pal
    - enemy
    - stranger
    answer: pal
    difficulty: 2
    hints:
    - A short friendly word.
    - Enemy is the opposite.
    solution: 'Step 1: Enemy and stranger are not friends. Step 2: Pal means friend.'
    mistakes:
      enemy: c3e3_opp
      stranger: c3e3_opp
  - prompt: Which sentence shows sharing?
    options:
    - "Tara gave half of the roti to Sam."
    - "Tara hid the roti under the table."
    - "Tara ate both the rotis all alone."
    answer: Tara gave half of the roti to Sam.
    difficulty: 2
    hints:
    - Sharing means giving part to another.
    - Who gave something?
    solution: 'Step 1: Sharing means giving some. Step 2: Tara gave half to Sam.'
    mistakes:
      "Tara hid the roti under the table.": c3e3_friend
      "Tara ate both the rotis all alone.": c3e3_friend
  - prompt: 'Case: Two friends, Nisha and Kabir, want to play different games at break. Nisha wants to play hopscotch; Kabir wants to play catch. They start to argue and both feel angry. What is the best way to solve it?'
    options:
    - "Play one game first and the other game next, taking turns"
    - "Stop being friends because they like different games"
    - "Shout at each other until one of them gives up"
    answer: Play one game first and the other game next, taking turns
    hints:
    - Can friends like different things?
    - What is a fair way for both to get a turn?
    solution: Friends can like different things. Taking turns lets both play their game, and the friendship stays strong.
    mistakes:
      "Stop being friends because they like different games": c3e3_friend
      "Shout at each other until one of them gives up": c3e3_friend
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a sentence about yourself and your friend. Which is correct?'
    options:
    - Sara and I are best friends.
    - Sara and I is best friends.
    - Sara and I am best friends.
    answer: Sara and I are best friends.
    hints:
    - How many people is 'Sara and I'?
    - Which word goes with more than one person?
    solution: '''Sara and I'' means two people, so we use ''are''.'
    mistakes:
      Sara and I is best friends.: c3e3_isare
      Sara and I am best friends.: c3e3_isare
    exam: competency
    difficulty: 2
