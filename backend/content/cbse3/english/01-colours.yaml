# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 1. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 1
title: 'Colours (Unit 1: Fun with Friends)'
tips:
  eng3_read_again: Go back to the lesson and find the part about this. The answer is there.
  eng3_word: Say the word in your own sentence. Does the meaning fit?
  eng3_grammar: Read the sentence aloud with each choice. Which one sounds right?
concepts:
- code: cbse3e.u1.colours
  title: 'Colours (Unit 1: Fun with Friends)'
  notes: |
    A poem about the colours around us: the blue sky, green grass and leaves, yellow sun, red flowers, the rainbow. Exact
    lines are not reproduced here; questions focus on colour words, things of each colour, rhyming words and enjoying
    the poem.
  explanations:
    text: 'This poem is about the colours we see every day: the blue sky, green leaves, the yellow sun and red flowers. When they all come together, we see a rainbow.'
    visual: Draw a rainbow over green grass, with a yellow sun and red flowers. Label each colour.
    step_by_step: 1. Read the poem aloud. 2. Find the colour words. 3. Match each colour with a thing. 4. Find words that rhyme.
    real_world: After rain, if the sun comes out, you may see a rainbow in the sky.
  picture:
    kind: compare
    columns:
    - title: Colour
      points:
      - blue
      - green
      - yellow
    - title: Thing
      points:
      - sky
      - leaves, grass
      - sun
    alt: The sky is blue, leaves and grass are green, and the sun is yellow.
  activity:
    type: sort
    prompt: 'Colours: what colour is it?'
    bins:
    - Blue
    - Green
    - Yellow
    - Red
    items:
    - label: 🌊 The sea
      bin: Blue
      clue: Look at the water.
      why: The sea looks blue.
    - label: 🌿 Leaves
      bin: Green
      clue: Most plants are this colour.
      why: Leaves are green.
    - label: 🌞 The sun
      bin: Yellow
      clue: Bright and warm.
      why: We draw the sun yellow.
    - label: 🍎 An apple
      bin: Red
      clue: A ripe one.
      why: Ripe apples are often red.
    - label: 🌻 A sunflower
      bin: Yellow
      clue: Its petals.
      why: Sunflower petals are yellow.
    - label: 🐸 A frog
      bin: Green
      clue: It hides in grass.
      why: Many frogs are green.
  items:
  - prompt: What colour are most leaves?
    options:
    - green
    - blue
    - black
    - purple
    answer: green
    difficulty: 1
    hints:
    - Look at a tree.
    - Like grass.
    solution: Most leaves are green.
  - prompt: What colour is a clear sky in the day?
    options:
    - blue
    - red
    - brown
    - pink
    answer: blue
    difficulty: 1
    hints:
    - Look up on a sunny day.
    - Like the sea.
    solution: A clear day sky is blue.
  - prompt: Which word is a colour?
    options:
    - yellow
    - happy
    - jump
    - chair
    answer: yellow
    difficulty: 1
    hints:
    - It describes how things look.
    - The sun.
    solution: Yellow is a colour.
    mistakes:
      happy: eng3_word
  - prompt: Which word rhymes with 'red'?
    options:
    - bed
    - blue
    - green
    - dog
    answer: bed
    difficulty: 2
    hints:
    - Same ending sound.
    - -ed.
    solution: Red and bed rhyme.
  - prompt: A rainbow has how many colours?
    options:
    - seven
    - two
    - one
    - twenty
    answer: seven
    difficulty: 2
    hints:
    - VIBGYOR.
    - Count the letters.
    solution: A rainbow has seven colours.
  - prompt: 'Choose the correct sentence:'
    options:
    - The grass is green.
    - The grass are green.
    - The grass am green.
    - The grass be green.
    answer: The grass is green.
    difficulty: 2
    hints:
    - '''Grass'' takes ''is''.'
    - Read aloud.
    solution: '''The grass is green'' is correct.'
    mistakes:
      The grass are green.: eng3_grammar
