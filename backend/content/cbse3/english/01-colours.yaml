# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 1. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 1
title: 'Colours (Unit 1: Fun with Friends)'
tips:
  eng3_read_again: Go back to the lesson and find the part about this. The answer is there.
  eng3_word: Say the word in your own sentence. Does the meaning fit?
  eng3_grammar: Read the sentence aloud with each choice. Which one sounds right?
  e3_leaves: "Leaves are the colour of grass."
  e3_rhyme_red: "Rhyming words end with the same sound: r-ed, b-?"
  e3_sky: "Look up on a sunny day."
  c3e1_colour: Close your eyes and picture the thing. What colour do you see?
  c3e1_rhyme: Say both words aloud. Do their ending sounds match?
  c3e1_sent: A sentence starts with a capital letter, ends with a full stop, and makes sense.
concepts:
- code: cbse3e.u1.colours
  title: 'Colours (Unit 1: Fun with Friends)'
  notes: |
    A poem about the colours around us: the blue sky, green grass and leaves, yellow sun, red flowers, the rainbow. Exact
    lines are not reproduced here; questions focus on colour words, things of each colour, rhyming words and enjoying
    the poem.
  explanations:
    text: 'This poem is about the colours we see every day: the blue sky, green leaves, the yellow sun and red flowers. When they all come together, we see a rainbow.'
    visual: Draw a rainbow over green grass, with a yellow sun and red flowers. Label each colour.
    step_by_step: 1. Read the poem aloud. 2. Find the colour words. 3. Match each colour with a thing. 4. Find words that rhyme.
    real_world: After rain, if the sun comes out, you may see a rainbow in the sky.
  picture:
    kind: compare
    columns:
    - title: Colour
      points:
      - blue
      - green
      - yellow
    - title: Thing
      points:
      - sky
      - leaves, grass
      - sun
    alt: The sky is blue, leaves and grass are green, and the sun is yellow.
  activity:
    type: sort
    prompt: 'Colours: what colour is it?'
    bins:
    - Blue
    - Green
    - Yellow
    - Red
    items:
    - label: 🌊 The sea
      bin: Blue
      clue: Look at the water.
      why: The sea looks blue.
    - label: 🌿 Leaves
      bin: Green
      clue: Most plants are this colour.
      why: Leaves are green.
    - label: 🌞 The sun
      bin: Yellow
      clue: Bright and warm.
      why: We draw the sun yellow.
    - label: 🍎 An apple
      bin: Red
      clue: A ripe one.
      why: Ripe apples are often red.
    - label: 🌻 A sunflower
      bin: Yellow
      clue: Its petals.
      why: Sunflower petals are yellow.
    - label: 🐸 A frog
      bin: Green
      clue: It hides in grass.
      why: Many frogs are green.
  lesson:
    - teach: 'Colour words tell us how things look: red, blue, green, yellow, orange, white, black, pink, purple, brown. The sky is blue, grass is green, the sun looks yellow.'
      check:
        prompt: Which is a colour word?
        options:
        - orange
        - run
        - table
        answer: orange
        why: Orange tells how something looks.
      ways:
      - style: visual
        teach: Colour words matched with things that are often that colour.
        picture:
          kind: compare
          columns:
          - title: Colour
            points:
            - Red
            - Orange
            - White
            - Brown
          - title: Often seen on
            points:
            - A tomato
            - A carrot
            - Milk
            - Tree bark
          alt: Red is the colour of a tomato, orange of a carrot, white of milk and brown of tree bark.
      - style: real_world
        teach: 'Traffic lights use colour words we all know: red means stop, yellow means get ready, and green means go.'
    - teach: 'Poems often use rhyming words: words whose ending sounds match. Red / bed / fed. Blue / shoe / true. Green / seen / clean. Rhymes make a poem fun to say.'
      picture:
        kind: compare
        columns:
        - title: red
          points:
          - bed
          - fed
        - title: blue
          points:
          - shoe
          - 'true'
        - title: green
          points:
          - seen
          - clean
        alt: Colour words and words that rhyme with them.
      check:
        prompt: Which word rhymes with 'blue'?
        options:
        - shoe
        - black
        - bell
        answer: shoe
        why: Blue and shoe both end with the 'oo' sound.
      ways:
      - style: step_by_step
        teach: 'Find a rhyme for ''blue''. Step 1: Say ''blue'' slowly. Step 2: Listen to the end sound: ''-oo''. Step 3: Think of words that end with ''-oo'': shoe, true, two, zoo. Step 4: Check each one by saying it next to ''blue''.'
      - style: real_world
        teach: Many skipping songs and clapping games use rhymes, like 'one, two, buckle my shoe'. The rhyme helps everyone keep the beat and remember the words.
    - teach: 'We use ''is'' to tell the colour of one thing and ''are'' for many: The apple is red. The leaves are green. A sentence begins with a capital letter and ends with a full stop.'
      check:
        prompt: Choose the correct sentence.
        options:
        - The leaves are green.
        - The leaves is green.
        - the leaves are green
        answer: The leaves are green.
        why: Many leaves take 'are', and the sentence needs a capital and a full stop.
      ways:
      - style: visual
        teach: When to use 'is' and when to use 'are' with colour words.
        picture:
          kind: compare
          columns:
          - title: 'One thing: is'
            points:
            - The ball is red.
            - My shirt is white.
          - title: 'Many things: are'
            points:
            - The balls are red.
            - The clouds are white.
          alt: 'For one thing we use is: The ball is red. My shirt is white. For many things we use are: The balls are red. The clouds are white.'
      - style: step_by_step
        teach: 'Write a colour sentence. Step 1: Start with a capital letter: ''The''. Step 2: Name the thing: ''The mango''. Step 3: Add ''is'' for one thing: ''The mango is''. Step 4: Add the colour and a full stop: ''The mango is yellow.'''
  items:
  - prompt: What colour are most leaves?
    options:
    - green
    - blue
    - black
    - purple
    answer: green
    difficulty: 1
    hints:
    - Look at a tree.
    - Like grass.
    solution: Most leaves are green.
    mistakes: {"blue": "e3_leaves"}
  - prompt: What colour is a clear sky in the day?
    options:
    - blue
    - red
    - brown
    - pink
    answer: blue
    difficulty: 1
    hints:
    - Look up on a sunny day.
    - Like the sea.
    solution: A clear day sky is blue.
    mistakes: {"red": "e3_sky"}
  - prompt: Which word is a colour?
    options:
    - yellow
    - happy
    - jump
    - chair
    answer: yellow
    difficulty: 1
    hints:
    - It describes how things look.
    - The sun.
    solution: Yellow is a colour.
    mistakes:
      happy: eng3_word
  - prompt: Which word rhymes with 'red'?
    options:
    - bed
    - blue
    - green
    - dog
    answer: bed
    difficulty: 2
    hints:
    - Same ending sound.
    - -ed.
    solution: Red and bed rhyme.
    mistakes: {"blue": "e3_rhyme_red"}
  - prompt: A rainbow has how many colours?
    options:
    - seven
    - two
    - one
    - twenty
    answer: seven
    difficulty: 2
    hints:
    - VIBGYOR.
    - Count the letters.
    solution: A rainbow has seven colours.
    mistakes: {"two": "e1_seven_colours"}
  - prompt: 'Choose the correct sentence:'
    options:
    - The grass is green.
    - The grass are green.
    - The grass am green.
    - The grass be green.
    answer: The grass is green.
    difficulty: 2
    hints:
    - '''Grass'' takes ''is''.'
    - Read aloud.
    solution: '''The grass is green'' is correct.'
    mistakes:
      The grass are green.: eng3_grammar
  - prompt: What colour is a ripe banana?
    options:
    - yellow
    - blue
    - purple
    answer: yellow
    difficulty: 1
    hints:
    - Picture a banana ready to eat.
    - The colour of the sun in drawings.
    solution: 'Step 1: Ripe bananas turn from green to... Step 2: yellow.'
    mistakes:
      blue: c3e1_colour
      purple: c3e1_colour
  - prompt: Which word rhymes with 'green'?
    options:
    - clean
    - grass
    - gate
    answer: clean
    difficulty: 1
    hints:
    - Say 'green' and listen to its end.
    - Which word ends with 'een'?
    solution: 'Step 1: Green ends in ''een''. Step 2: Clean ends in ''een'' too.'
    mistakes:
      grass: c3e1_rhyme
      gate: c3e1_rhyme
  - prompt: Mix blue and yellow paint. What colour do you get?
    options:
    - green
    - red
    - black
    answer: green
    difficulty: 2
    hints:
    - Think of leaves and grass.
    - It is a colour of plants.
    solution: 'Step 1: Blue + yellow paint mix. Step 2: They make green.'
    mistakes:
      red: c3e1_colour
      black: c3e1_colour
  - prompt: 'Fill in: ''The sky ___ blue.'''
    options:
    - is
    - are
    - am
    answer: is
    difficulty: 1
    hints:
    - There is one sky.
    - One thing takes ...
    solution: 'Step 1: The sky is one thing. Step 2: Use ''is''.'
    mistakes:
      are: c3e1_sent
      am: c3e1_sent
  - prompt: Which thing is usually white?
    options:
    - milk
    - grass
    - a crow
    answer: milk
    difficulty: 1
    hints:
    - Grass is green, a crow is black.
    - What do we pour in a glass?
    solution: 'Step 1: Grass and crows are not white. Step 2: Milk is white.'
    mistakes:
      grass: c3e1_colour
      a crow: c3e1_colour
  - prompt: Which word does NOT rhyme with 'red'?
    options:
    - rain
    - bed
    - fed
    answer: rain
    difficulty: 2
    hints:
    - Two words end like 'red'.
    - Which ending is different?
    solution: 'Step 1: Bed and fed end in ''ed''. Step 2: Rain does not.'
    mistakes:
      bed: c3e1_rhyme
      fed: c3e1_rhyme
  - prompt: Which sentence is written correctly?
    options:
    - My bag is red.
    - my bag is red
    - My bag red is.
    answer: My bag is red.
    difficulty: 2
    hints:
    - Look at the first letter and the end mark.
    - Do the words come in the right order?
    solution: 'Step 1: Capital M and a full stop. Step 2: Words in order: My bag is red.'
    mistakes:
      my bag is red: c3e1_sent
      My bag red is.: c3e1_sent
  - prompt: 'A poem about colours is fun to read aloud mostly because of its:'
    options:
    - rhyming words and rhythm
    - long numbers
    - maps
    answer: rhyming words and rhythm
    difficulty: 2
    hints:
    - What makes a poem sound like a song?
    - Words that sound alike at the end.
    solution: 'Step 1: Poems use rhyme and beat. Step 2: That makes them fun to say.'
    mistakes:
      long numbers: c3e1_rhyme
      maps: c3e1_rhyme
  - prompt: 'Fill in: ''The roses ___ red.'''
    options:
    - are
    - is
    - am
    answer: are
    difficulty: 2
    hints:
    - Roses means more than one.
    - Many things take ...
    solution: 'Step 1: Roses are many. Step 2: Use ''are''.'
    mistakes:
      is: c3e1_sent
      am: c3e1_sent
  - prompt: 'Case: A child writes a note for a class display: ''the parrots is green'' Under it, the teacher asks the class to find the mistakes. What should the corrected sentence be?'
    options:
    - The parrots are green.
    - the parrots are green
    - The parrots is green.
    answer: The parrots are green.
    hints:
    - How should a sentence begin and end?
    - Is it one parrot or many? Which word goes with many?
    solution: A sentence starts with a capital letter and ends with a full stop. 'Parrots' means many, so we use 'are'.
    mistakes:
      the parrots are green: c3e1_sent
      The parrots is green.: c3e1_sent
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a short colour poem. Your first line ends with ''sky''. Which word would make a good rhyme to end your second line?'
    options:
    - fly
    - cloud
    - blue
    answer: fly
    hints:
    - Say 'sky' and listen to its last sound.
    - Which word ends with the same sound?
    solution: '''Sky'' ends with the sound ''-y'', like ''eye''. ''Fly'' ends with the same sound, so it rhymes.'
    mistakes:
      cloud: c3e1_rhyme
      blue: c3e1_rhyme
    exam: competency
    difficulty: 2
