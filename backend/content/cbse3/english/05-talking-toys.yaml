# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 5. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 5
title: 'Talking Toys (Unit 2: Toys and Games)'
concepts:
- code: cbse3e.u2.toys
  title: 'Talking Toys (Unit 2: Toys and Games)'
  notes: |
    A story in which toys come alive and talk, perhaps at night, sharing their feelings about how children treat them.
    Exact story details are not reproduced here; questions focus on imagination, taking care of toys, describing words
    and speech (who says what).
  explanations:
    text: In this story, toys come alive and talk to each other. They tell us how they feel when children play with them kindly or break them. It reminds us to take care of our toys.
    visual: Draw a teddy bear, a doll and a toy car talking to each other at night on a shelf.
    step_by_step: 1. Which toys are in the story? 2. What do they say? 3. How do they feel? 4. What should we do with our toys?
    real_world: Putting toys back in a box after playing keeps them safe and lasts longer.
  picture:
    kind: flow
    steps:
    - Night comes
    - The toys wake up and talk
    - They share their feelings
    - We learn to care for toys
    alt: Night comes, the toys wake up and talk, they share their feelings, and we learn to care for our toys.
  items:
  - prompt: 'In the story, the toys can:'
    options:
    - talk
    - fly to the moon
    - cook food
    - drive a real bus
    answer: talk
    difficulty: 1
    hints:
    - Look at the title.
    - Talking ...
    solution: The toys can talk.
    mistakes:
      fly to the moon: eng3_read_again
  - prompt: How should we treat our toys?
    options:
    - take care of them and put them away
    - throw them around
    - break them
    - leave them in the rain
    answer: take care of them and put them away
    difficulty: 1
    hints:
    - They last longer.
    - Care.
    solution: Take care of toys and put them away.
  - prompt: 'A story where toys talk is:'
    options:
    - make-believe (imaginary)
    - a news report
    - a maths sum
    - a recipe
    answer: make-believe (imaginary)
    difficulty: 2
    hints:
    - Can real toys talk?
    - Imagination.
    solution: It is a make-believe story.
  - prompt: Which is a describing word?
    options:
    - soft
    - teddy
    - sleep
    - toy
    answer: soft
    difficulty: 2
    hints:
    - It tells how something is.
    - A soft teddy.
    solution: Soft is a describing word.
    mistakes:
      teddy: eng3_grammar
  - prompt: Which word is the plural of 'toy'?
    options:
    - toys
    - toies
    - toyes
    - toy
    answer: toys
    difficulty: 1
    hints:
    - Add s.
    - More than one.
    solution: One toy, many toys.
    mistakes:
      toies: eng3_grammar
  - prompt: 'A toy with a broken arm would feel:'
    options:
    - sad
    - excited
    - proud
    - sleepy
    answer: sad
    difficulty: 1
    hints:
    - Imagine you were hurt.
    - Not happy.
    solution: It would feel sad.
