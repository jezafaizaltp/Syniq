# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 5. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 5
title: 'Talking Toys (Unit 2: Toys and Games)'
tips:
  e3_make_believe: "Can toys really talk? Then is the story real or imagined?"
  e3_toy_care: "Toys last longer when you're gentle and tidy."
  e3_toy_feel: "How would you feel if you were hurt?"
  c3e5_real: 'Ask: could this really happen in our world, or only in a story?'
  c3e5_describe: A describing word tells how something looks, feels or sounds. Does it answer 'what kind?'
  c3e5_plural: More than one usually adds -s. Words ending in s, sh, ch or x add -es.

concepts:
- code: cbse3e.u2.toys
  title: 'Talking Toys (Unit 2: Toys and Games)'
  notes: |
    A story in which toys come alive and talk, perhaps at night, sharing their feelings about how children treat them.
    Exact story details are not reproduced here; questions focus on imagination, taking care of toys, describing words
    and speech (who says what).
  explanations:
    text: In this story, toys come alive and talk to each other. They tell us how they feel when children play with them kindly or break them. It reminds us to take care of our toys.
    visual: Draw a teddy bear, a doll and a toy car talking to each other at night on a shelf.
    step_by_step: 1. Which toys are in the story? 2. What do they say? 3. How do they feel? 4. What should we do with our toys?
    real_world: Putting toys back in a box after playing keeps them safe and lasts longer.
  picture:
    kind: flow
    steps:
    - Night comes
    - The toys wake up and talk
    - They share their feelings
    - We learn to care for toys
    alt: Night comes, the toys wake up and talk, they share their feelings, and we learn to care for our toys.
  activity:
    type: sort
    prompt: 'Talking Toys: taking care of toys, or not?'
    bins:
    - Taking care
    - Not taking care
    items:
    - label: Putting toys back in the box
      bin: Taking care
      clue: After playing.
      why: Putting them away keeps them safe.
    - label: Throwing toys on the floor
      bin: Not taking care
      clue: They can break.
      why: Throwing them can break them.
    - label: Sharing toys gently
      bin: Taking care
      clue: With friends.
      why: Gentle sharing is caring.
    - label: Leaving toys out in the rain
      bin: Not taking care
      clue: Water damage.
      why: Rain spoils toys.
  lesson:
    - teach: In Talking Toys, the toys come alive and talk about how children treat them. Toys cannot really talk, so this is a make-believe (imaginary) story.
      check:
        prompt: 'Toys that talk belong in a story that is:'
        options:
        - make-believe
        - a news report
        - a science fact
        answer: make-believe
        why: Real toys cannot talk; only stories can make them.
      ways:
      - style: visual
        teach: Things that can happen in real life, and things only in make-believe.
        picture:
          kind: compare
          columns:
          - title: Real
            points:
            - A child plays with a teddy
            - A toy car rolls down a slope
          - title: Make-believe
            points:
            - A teddy says hello
            - A toy car drives itself to school
          alt: In real life, a child plays with a teddy and a toy car rolls down a slope. Only in make-believe does a teddy say hello or a toy car drive itself to school.
      - style: real_world
        teach: Cartoons and puppet shows often have animals and toys that talk. We enjoy them, but we know it is make-believe.
    - teach: The story helps us think about how we treat our things. Toys left on the floor can get stepped on and broken. Taking care of toys means playing gently and putting them away.
      check:
        prompt: Which is taking care of toys?
        options:
        - putting them back in the box after play
        - throwing them at the wall
        - leaving them in the rain
        answer: putting them back in the box after play
        why: Then they stay safe and clean.
      ways:
      - style: step_by_step
        teach: 'Look after your toys. Step 1: Play gently, without throwing them. Step 2: Keep them out of the rain and away from the floor where people walk. Step 3: Wipe them clean when they get dirty. Step 4: Put them back in their box after playing.'
      - style: visual
        teach: What happens to toys that are cared for, and to toys that are not.
        picture:
          kind: compare
          columns:
          - title: Cared for
            points:
            - Clean and safe
            - Last a long time
            - Can be given to a younger child
          - title: Not cared for
            points:
            - Stepped on and broken
            - Lost under the bed
            - Spoilt by rain
          alt: Toys that are cared for stay clean and safe, last a long time and can be given to a younger child. Toys that are not cared for get stepped on and broken, lost under the bed or spoilt by rain.
    - teach: 'Describing words (adjectives) tell what kind: a soft teddy, a red car, a small doll, a noisy drum. To talk about more than one, add -s (toy → toys) or -es (box → boxes).'
      picture:
        kind: compare
        columns:
        - title: Describing word
          points:
          - soft
          - red
          - noisy
        - title: Naming word
          points:
          - teddy
          - car
          - drum
        alt: Describing words next to the toys they describe.
      check:
        prompt: Which is a describing word in 'a noisy drum'?
        options:
        - noisy
        - drum
        - a
        answer: noisy
        why: Noisy tells what kind of drum.
      ways:
      - style: step_by_step
        teach: 'Make a plural. Step 1: Look at the end of the word. Step 2: For most words, add -s: ball → balls. Step 3: For words ending in s, x, ch or sh, add -es: bus → buses, dish → dishes, watch → watches. Step 4: Say both words aloud and listen.'
      - style: real_world
        teach: 'Toy shop labels use describing words to help you choose: ''big blue ball'', ''soft white rabbit'', ''shiny red car''. The describing words tell you what kind of toy it is.'
  items:
  - prompt: 'In the story, the toys can:'
    options:
    - talk
    - fly to the moon
    - cook food
    - drive a real bus
    answer: talk
    difficulty: 1
    hints:
    - Look at the title.
    - Talking ...
    solution: The toys can talk.
    mistakes:
      fly to the moon: eng3_read_again
  - prompt: How should we treat our toys?
    options:
    - "take care of them and put them away"
    - "throw them around the room"
    - "break them when we are bored"
    - "leave them out in the rain"
    answer: take care of them and put them away
    difficulty: 1
    hints:
    - They last longer.
    - Care.
    solution: Take care of toys and put them away.
    mistakes: {"throw them around the room": "e3_toy_care"}
  - prompt: 'A story where toys talk is:'
    options:
    - make-believe (imaginary)
    - a news report
    - a maths sum
    - a recipe
    answer: make-believe (imaginary)
    difficulty: 2
    hints:
    - Can real toys talk?
    - Imagination.
    solution: It is a make-believe story.
    mistakes: {"a news report": "e3_make_believe"}
  - prompt: Which is a describing word?
    options:
    - soft
    - teddy
    - sleep
    - toy
    answer: soft
    difficulty: 2
    hints:
    - It tells how something is.
    - "Which word tells us how a toy feels to touch?"
    solution: Soft is a describing word.
    mistakes:
      teddy: eng3_grammar
  - prompt: Which word is the plural of 'toy'?
    options:
    - toys
    - toies
    - toyes
    - toy
    answer: toys
    difficulty: 1
    hints:
    - Add s.
    - More than one.
    solution: One toy, many toys.
    mistakes:
      toies: eng3_grammar
  - prompt: 'A toy with a broken arm would feel:'
    options:
    - sad
    - excited
    - proud
    - sleepy
    answer: sad
    difficulty: 1
    hints:
    - Imagine you were hurt.
    - Not happy.
    solution: It would feel sad.
    mistakes: {"excited": "e3_toy_feel"}
  - prompt: 'Find the describing word: ''The teddy is soft.'''
    options:
    - soft
    - teddy
    - is
    answer: soft
    difficulty: 1
    hints:
    - Which word tells what the teddy is like?
    - How does it feel?
    solution: 'Step 1: Teddy is a naming word. Step 2: Soft describes it.'
    mistakes:
      teddy: c3e5_describe
      is: c3e5_describe
  - prompt: What is the plural of 'box'?
    options:
    - boxes
    - boxs
    - box
    answer: boxes
    difficulty: 2
    hints:
    - Box ends with x.
    - Add -es.
    solution: 'Step 1: Words ending in x add -es. Step 2: boxes.'
    mistakes:
      boxs: c3e5_plural
      box: c3e5_plural
  - prompt: Which of these could happen only in a make-believe story?
    options:
    - a doll says good night
    - a child plays with a doll
    - a doll falls off a shelf
    answer: a doll says good night
    difficulty: 1
    hints:
    - Which one is impossible in real life?
    - Can dolls speak?
    solution: 'Step 1: Playing and falling can happen. Step 2: A doll speaking is make-believe.'
    mistakes:
      a child plays with a doll: c3e5_real
      a doll falls off a shelf: c3e5_real
  - prompt: 'A toy left out in the rain may get:'
    options:
    - wet and spoilt
    - new and shiny
    - bigger
    answer: wet and spoilt
    difficulty: 1
    hints:
    - What does rain do to things?
    - Paint and cloth do not like water.
    solution: 'Step 1: Rain soaks the toy. Step 2: It may get spoilt.'
    mistakes:
      new and shiny: c3e5_real
      bigger: c3e5_real
  - prompt: Which describing word tells a colour?
    options:
    - blue
    - big
    - happy
    answer: blue
    difficulty: 1
    hints:
    - One tells size, one a feeling.
    - Which one is in a rainbow?
    solution: 'Step 1: Big is size, happy is feeling. Step 2: Blue is a colour.'
    mistakes:
      big: c3e5_describe
      happy: c3e5_describe
  - prompt: 'In a story, the words a toy says are put inside:'
    options:
    - speech marks “ ”
    - brackets ( )
    - a full stop
    answer: speech marks “ ”
    difficulty: 2
    hints:
    - They go around the spoken words.
    - They look like little raised commas.
    solution: 'Step 1: Spoken words need marks around them. Step 2: Speech marks.'
    mistakes:
      brackets ( ): c3e5_real
      a full stop: c3e5_real
  - prompt: What is the plural of 'doll'?
    options:
    - dolls
    - dolles
    - dollies
    answer: dolls
    difficulty: 1
    hints:
    - Just add one letter.
    - Most words add -s.
    solution: 'Step 1: doll + s. Step 2: dolls.'
    mistakes:
      dolles: c3e5_plural
      dollies: c3e5_plural
  - prompt: 'Choose the best describing word: ''The ___ train went round the track.'''
    options:
    - little
    - run
    - track
    answer: little
    difficulty: 2
    hints:
    - The blank tells what kind of train.
    - Run is an action; track is a thing.
    solution: 'Step 1: We need a describing word. Step 2: little.'
    mistakes:
      run: c3e5_describe
      track: c3e5_describe
  - prompt: If your toy could talk, which would it most likely thank you for?
    options:
    - keeping it clean and safe
    - breaking its wheel
    - losing it in the park
    answer: keeping it clean and safe
    difficulty: 2
    hints:
    - Think what a toy would like.
    - Which one is kind?
    solution: 'Step 1: Breaking and losing are not kind. Step 2: Keeping it clean and safe is.'
    mistakes:
      breaking its wheel: c3e5_real
      losing it in the park: c3e5_real
  - prompt: 'Case: In a story a child writes, a toy elephant says, ''I am sad because I was left out in the rain.'' A classmate says the story is wrong because toys cannot talk. What is the best reply?'
    options:
    - It is a make-believe story, so toys can talk in it
    - Toys really can talk
    - The story must be changed so the elephant is a real animal
    answer: It is a make-believe story, so toys can talk in it
    hints:
    - Can toys talk in real life?
    - What kind of story lets things happen that cannot really happen?
    solution: Toys cannot really talk, but in a make-believe story they can. The story helps us think about how toys are treated.
    mistakes:
      Toys really can talk: c3e5_real
      The story must be changed so the elephant is a real animal: c3e5_real
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a list for a toy cupboard. You have more than one of each toy. Which list has the plurals spelt correctly?'
    options:
    - balls, boxes, brushes
    - balles, boxs, brushs
    - ball, box, brush
    answer: balls, boxes, brushes
    hints:
    - Which words end in x or sh?
    - Do those words take -s or -es?
    solution: 'Most words add -s: balls. Words ending in x or sh add -es: boxes, brushes.'
    mistakes:
      balles, boxs, brushs: c3e5_plural
      ball, box, brush: c3e5_plural
    exam: competency
    difficulty: 2
