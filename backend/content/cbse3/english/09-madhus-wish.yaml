# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 9. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 9
title: 'Madhu''s Wish (Unit 3: Good Food)'
tips:
  e3_wish_true: "Getting what you wished for feels good."
  c3e9_own: The 's after a name shows that something belongs to that person.
  c3e9_ask: Polite asking uses 'please' and a gentle question.
  c3e9_wish: 'A wish is something hoped for. Ask: has it happened yet?'

concepts:
- code: cbse3e.u3.madhu
  title: 'Madhu''s Wish (Unit 3: Good Food)'
  notes: |
    A story about a girl, Madhu, and a wish connected with food (perhaps to eat or make a special dish). Exact story
    details are not reproduced here and are kept general; questions focus on wishes, feelings, food words and asking
    politely.
  explanations:
    text: This story is about Madhu and her wish. Like all children, Madhu wishes for something special. The story shows how wishes can come true with patience, help from family and asking nicely.
    visual: 'Draw Madhu with a thought bubble showing her wish: a plate of her favourite food.'
    step_by_step: 1. Who is Madhu? 2. What does she wish for? 3. What happens? 4. How does she feel at the end?
    real_world: Children often wish for their favourite dish on their birthday.
  picture:
    kind: flow
    steps:
    - Madhu has a wish
    - She waits or asks politely
    - Someone helps
    - She is happy
    alt: Madhu has a wish, she waits or asks politely, someone helps, and she is happy.
  activity:
    type: sort
    prompt: 'Madhu''s Wish: polite or not?'
    bins:
    - Polite
    - Not polite
    items:
    - label: May I have some, please?
      bin: Polite
      clue: '''May I'' and ''please''.'
      why: Asking with please is polite.
    - label: Give it to me now!
      bin: Not polite
      clue: An order.
      why: That's a demand, not a request.
    - label: Thank you, Amma.
      bin: Polite
      clue: After getting something.
      why: Saying thank you is polite.
    - label: I want it. Give!
      bin: Not polite
      clue: No kind words.
      why: No 'please' or 'may I'.
  lesson:
    - teach: Madhu's Wish is a story about Madhu, who has a wish connected with food. A wish is something you hope for and would like to happen.
      check:
        prompt: What is a wish?
        options:
        - something you hope for
        - something you already ate
        - a kind of fruit
        answer: something you hope for
        why: We wish for things that have not happened yet.
    - teach: 'The ''s after a name shows ownership: Madhu''s wish is the wish that belongs to Madhu. Ravi''s bag is the bag that belongs to Ravi.'
      picture:
        kind: compare
        columns:
        - title: With 's
          points:
          - Madhu's wish
          - Ravi's bag
        - title: Means
          points:
          - the wish of Madhu
          - the bag of Ravi
        alt: Names with 's and what they mean.
      check:
        prompt: '''Asha''s book'' means:'
        options:
        - the book that belongs to Asha
        - many books
        - Asha is a book
        answer: the book that belongs to Asha
        why: The 's shows the book is Asha's.
    - teach: 'When we want something, we ask politely: ''May I have some kheer, please?'' ''Could you make dosa today, please?'' We wait kindly for the answer.'
      check:
        prompt: Which is a polite way to ask?
        options:
        - May I have a banana, please?
        - Banana now!
        - I want it!
        answer: May I have a banana, please?
        why: It uses 'may I' and 'please'.
  items:
  - prompt: Who is the main character in this story?
    options:
    - Madhu
    - a tiger
    - a teacher only
    - a car
    answer: Madhu
    difficulty: 1
    hints:
    - Look at the title.
    - Madhu's ...
    solution: Madhu is the main character.
    mistakes:
      a car: eng3_read_again
  - prompt: 'A wish is:'
    options:
    - something you hope for
    - something you hate
    - a kind of food
    - a game
    answer: something you hope for
    difficulty: 1
    hints:
    - You want it to happen.
    - Birthday candles.
    solution: A wish is something you hope for.
    mistakes:
      a kind of food: eng3_word
  - prompt: How do you feel when a wish comes true?
    options:
    - happy
    - angry
    - sad
    - scared
    answer: happy
    difficulty: 1
    hints:
    - Good news.
    - Smile.
    solution: We feel happy.
    mistakes: {"sad": "e3_wish_true"}
  - prompt: 'The best way to ask for something is:'
    options:
    - politely, saying please
    - by shouting
    - by crying loudly
    - by grabbing
    answer: politely, saying please
    difficulty: 2
    hints:
    - Magic word.
    - Kind voice.
    solution: Ask politely with please.
    mistakes: {"by shouting": "e3_polite"}
  - prompt: 'In ''Madhu''s wish'', the ''s shows that the wish:'
    options:
    - belongs to Madhu
    - is many wishes
    - is a question
    - is a place
    answer: belongs to Madhu
    difficulty: 2
    hints:
    - Apostrophe s.
    - Whose wish?
    solution: '''s shows the wish belongs to Madhu.'
    mistakes:
      is many wishes: eng3_grammar
  - prompt: 'Choose the correct sentence:'
    options:
    - Madhu wishes for a cake.
    - Madhu wish for a cake.
    - Madhu wishing for a cake.
    - Madhu are wish for a cake.
    answer: Madhu wishes for a cake.
    difficulty: 2
    hints:
    - One person takes 'wishes'.
    - Read aloud.
    solution: '''Madhu wishes for a cake'' is correct.'
    mistakes:
      Madhu wish for a cake.: eng3_grammar
  - prompt: 'Choose the correct one: ''This is ___ pencil.'' (It belongs to Sita.)'
    options:
    - Sita's
    - Sitas
    - Sita
    answer: Sita's
    difficulty: 2
    hints:
    - Something belongs to Sita.
    - Add apostrophe and s.
    solution: 'Step 1: Belonging uses ''s. Step 2: Sita''s pencil.'
    mistakes:
      Sitas: c3e9_own
      Sita: c3e9_own
  - prompt: How do you feel when your wish does not come true?
    options:
    - a little sad
    - very hungry
    - very tall
    answer: a little sad
    difficulty: 1
    hints:
    - You hoped for it.
    - It did not happen.
    solution: 'Step 1: A hope did not happen. Step 2: We may feel a little sad.'
    mistakes:
      very hungry: c3e9_wish
      very tall: c3e9_wish
  - prompt: Which sentence is a wish?
    options:
    - I wish I could eat payasam today.
    - I ate payasam yesterday.
    - Payasam is in the pot.
    answer: I wish I could eat payasam today.
    difficulty: 1
    hints:
    - Look for the word 'wish'.
    - Something hoped for, not done.
    solution: 'Step 1: The other two tell facts. Step 2: ''I wish...'' is a wish.'
    mistakes:
      I ate payasam yesterday.: c3e9_wish
      Payasam is in the pot.: c3e9_wish
  - prompt: Which is a food word?
    options:
    - chapati
    - chair
    - cloud
    answer: chapati
    difficulty: 1
    hints:
    - Which one can you eat?
    - The others cannot be eaten.
    solution: 'Step 1: Chair and cloud are not food. Step 2: Chapati is.'
    mistakes:
      chair: c3e9_wish
      cloud: c3e9_wish
  - prompt: '''The cat''s tail'' means:'
    options:
    - the tail of the cat
    - many cats
    - the cat is a tail
    answer: the tail of the cat
    difficulty: 2
    hints:
    - Whose tail is it?
    - The 's shows belonging.
    solution: 'Step 1: The tail belongs to the cat. Step 2: The tail of the cat.'
    mistakes:
      many cats: c3e9_own
      the cat is a tail: c3e9_own
  - prompt: 'Fill in: ''Madhu ___ for a big plate of idlis.'''
    options:
    - wishes
    - wish
    - wishing
    answer: wishes
    difficulty: 2
    hints:
    - One person, now.
    - Add -es to wish.
    solution: 'Step 1: Madhu is one person. Step 2: Madhu wishes.'
    mistakes:
      wish: c3e9_own
      wishing: c3e9_own
  - prompt: Your friend wants your last biscuit. Which reply is kind and honest?
    options:
    - Let's share it, half each.
    - No! Go away!
    - Biscuits are bad.
    answer: Let's share it, half each.
    difficulty: 2
    hints:
    - Can you both have some?
    - Which reply is kind?
    solution: 'Step 1: Sharing lets both enjoy. Step 2: Half each is kind.'
    mistakes:
      No! Go away!: c3e9_ask
      Biscuits are bad.: c3e9_ask
  - prompt: Which word means the same as 'wish'?
    options:
    - hope
    - eat
    - forget
    answer: hope
    difficulty: 2
    hints:
    - You wish for what you want to happen.
    - Another word for wanting something to happen.
    solution: 'Step 1: Eat and forget are different. Step 2: Hope is like wish.'
    mistakes:
      eat: c3e9_wish
      forget: c3e9_wish
  - prompt: Which is written correctly?
    options:
    - Madhu's mother cooked dal.
    - madhus mother cooked dal.
    - Madhu mother's cooked dal.
    answer: Madhu's mother cooked dal.
    difficulty: 3
    hints:
    - Names start with capitals.
    - The 's goes after the owner's name.
    solution: 'Step 1: Capital M. Step 2: The ''s goes on Madhu: Madhu''s mother.'
    mistakes:
      madhus mother cooked dal.: c3e9_own
      Madhu mother's cooked dal.: c3e9_own
