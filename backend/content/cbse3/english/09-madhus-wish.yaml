# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 9. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 9
title: 'Madhu''s Wish (Unit 3: Good Food)'
concepts:
- code: cbse3e.u3.madhu
  title: 'Madhu''s Wish (Unit 3: Good Food)'
  notes: |
    A story about a girl, Madhu, and a wish connected with food (perhaps to eat or make a special dish). Exact story
    details are not reproduced here and are kept general; questions focus on wishes, feelings, food words and asking
    politely.
  explanations:
    text: This story is about Madhu and her wish. Like all children, Madhu wishes for something special. The story shows how wishes can come true with patience, help from family and asking nicely.
    visual: 'Draw Madhu with a thought bubble showing her wish: a plate of her favourite food.'
    step_by_step: 1. Who is Madhu? 2. What does she wish for? 3. What happens? 4. How does she feel at the end?
    real_world: Children often wish for their favourite dish on their birthday.
  picture:
    kind: flow
    steps:
    - Madhu has a wish
    - She waits or asks politely
    - Someone helps
    - She is happy
    alt: Madhu has a wish, she waits or asks politely, someone helps, and she is happy.
  activity:
    type: sort
    prompt: 'Madhu''s Wish: polite or not?'
    bins:
    - Polite
    - Not polite
    items:
    - label: May I have some, please?
      bin: Polite
      clue: '''May I'' and ''please''.'
      why: Asking with please is polite.
    - label: Give it to me now!
      bin: Not polite
      clue: An order.
      why: That's a demand, not a request.
    - label: Thank you, Amma.
      bin: Polite
      clue: After getting something.
      why: Saying thank you is polite.
    - label: I want it. Give!
      bin: Not polite
      clue: No kind words.
      why: No 'please' or 'may I'.
  items:
  - prompt: Who is the main character in this story?
    options:
    - Madhu
    - a tiger
    - a teacher only
    - a car
    answer: Madhu
    difficulty: 1
    hints:
    - Look at the title.
    - Madhu's ...
    solution: Madhu is the main character.
    mistakes:
      a car: eng3_read_again
  - prompt: 'A wish is:'
    options:
    - something you hope for
    - something you hate
    - a kind of food
    - a game
    answer: something you hope for
    difficulty: 1
    hints:
    - You want it to happen.
    - Birthday candles.
    solution: A wish is something you hope for.
    mistakes:
      a kind of food: eng3_word
  - prompt: How do you feel when a wish comes true?
    options:
    - happy
    - angry
    - sad
    - scared
    answer: happy
    difficulty: 1
    hints:
    - Good news.
    - Smile.
    solution: We feel happy.
  - prompt: 'The best way to ask for something is:'
    options:
    - politely, saying please
    - by shouting
    - by crying loudly
    - by grabbing
    answer: politely, saying please
    difficulty: 2
    hints:
    - Magic word.
    - Kind voice.
    solution: Ask politely with please.
  - prompt: 'In ''Madhu''s wish'', the ''s shows that the wish:'
    options:
    - belongs to Madhu
    - is many wishes
    - is a question
    - is a place
    answer: belongs to Madhu
    difficulty: 2
    hints:
    - Apostrophe s.
    - Whose wish?
    solution: '''s shows the wish belongs to Madhu.'
    mistakes:
      is many wishes: eng3_grammar
  - prompt: 'Choose the correct sentence:'
    options:
    - Madhu wishes for a cake.
    - Madhu wish for a cake.
    - Madhu wishing for a cake.
    - Madhu are wish for a cake.
    answer: Madhu wishes for a cake.
    difficulty: 2
    hints:
    - One person takes 'wishes'.
    - Read aloud.
    solution: '''Madhu wishes for a cake'' is correct.'
    mistakes:
      Madhu wish for a cake.: eng3_grammar
