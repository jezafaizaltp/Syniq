# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 6. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 6
title: 'Paper Boats (Unit 2: Toys and Games)'
tips:
  e3_boat_sink: "What happens to paper when it soaks in water?"
  e3_paper_boat: "The boat's name tells you what it's made of."
  e3_puddles: "Boats need water. When is there water on the ground?"
  e3_rain_word: "Which word is about water on the ground after rain?"
  c3e6_order: Ask what must be done before anything else can happen, then what comes last.
  c3e6_float: Think what happens to paper when it soaks up water.
  c3e6_verb: An instruction starts with a doing word that tells you what to do.

concepts:
- code: cbse3e.u2.boats
  title: 'Paper Boats (Unit 2: Toys and Games)'
  notes: |
    A lesson about making and floating paper boats, especially in the rain. It may include steps for folding a boat and
    the joy of watching it sail. Exact text is not reproduced here; questions focus on sequence (first, next, then,
    finally), rain words and following instructions.
  explanations:
    text: Paper boats are fun to make. You fold a sheet of paper step by step until it becomes a boat. On a rainy day, children float paper boats in puddles and watch them sail away.
    visual: Draw the steps of folding a paper boat and a boat sailing in a rain puddle.
    step_by_step: 1. First, take a sheet of paper. 2. Next, fold it in half. 3. Then fold the corners. 4. Finally, open it into a boat and float it.
    real_world: During the monsoon, children float paper boats in the water that collects on the road.
  picture:
    kind: flow
    steps:
    - Take a sheet of paper
    - Fold it in half
    - Fold the corners
    - Open it into a boat
    - Float it
    alt: Take a sheet of paper, fold it in half, fold the corners, open it into a boat and float it.
  activity:
    type: order
    prompt: 'Paper Boats: put the steps in order.'
    steps:
    - Take a sheet of paper
    - Fold it in half
    - Fold the corners down
    - Open it out into a boat
    - Float it on rainwater
    reasons:
      Fold it in half: First fold the paper.
      Fold the corners down: Then make the pointed top.
      Open it out into a boat: Then pull it open.
      Float it on rainwater: Finally, sail it.
  lesson:
    - teach: Paper Boats is about making boats from paper and floating them in rain puddles. To make one, you follow steps in order.
      picture:
        kind: flow
        steps:
        - take a sheet of paper
        - fold it in half
        - fold the corners
        - open into a boat
        - float it
        alt: Steps to make and float a paper boat.
      check:
        prompt: What do you need first to make a paper boat?
        options:
        - a sheet of paper
        - a puddle
        - a stone
        answer: a sheet of paper
        why: You cannot fold anything without paper.
    - teach: 'Order words help us follow steps: first, next, then, finally. ''First fold the paper. Next fold the corners. Then open it. Finally float it.'''
      check:
        prompt: Which order word comes at the start?
        options:
        - first
        - finally
        - then
        answer: first
        why: First tells the starting step.
    - teach: 'Instructions begin with a doing word: fold, press, open, float. A paper boat floats for a while, but slowly soaks up water, becomes soft and sinks.'
      check:
        prompt: Why does a paper boat sink after a while?
        options:
        - the paper soaks up water and gets soft
        - the boat gets hungry
        - the rain stops
        answer: the paper soaks up water and gets soft
        why: Wet paper is too soft to hold its shape.
  items:
  - prompt: What do we need to make a paper boat?
    options:
    - a sheet of paper
    - a hammer
    - wood and nails
    - glue and a saw
    answer: a sheet of paper
    difficulty: 1
    hints:
    - Look at the title.
    - Paper ...
    solution: We need a sheet of paper.
    mistakes: {"a hammer": "e3_paper_boat"}
  - prompt: 'Children often float paper boats:'
    options:
    - in rainwater puddles
    - in a hot oven
    - on a road with no water
    - in sand
    answer: in rainwater puddles
    difficulty: 1
    hints:
    - Boats need water.
    - Rainy day.
    solution: In rainwater puddles.
    mistakes: {"in a hot oven": "e3_puddles"}
  - prompt: Which word tells the last step?
    options:
    - finally
    - first
    - next
    - then
    answer: finally
    difficulty: 2
    hints:
    - It means at the end.
    - Last of all.
    solution: Finally tells the last step.
    mistakes:
      first: eng3_word
  - prompt: Why does a paper boat sink after some time?
    options:
    - the paper gets wet and soft
    - it gets tired
    - it is too light
    - boats hate water
    answer: the paper gets wet and soft
    difficulty: 2
    hints:
    - Paper soaks water.
    - Gets soggy.
    solution: The paper gets wet and soft.
    mistakes: {"it gets tired": "e3_boat_sink"}
  - prompt: Which is a rain word?
    options:
    - puddle
    - desert
    - sunburn
    - dust
    answer: puddle
    difficulty: 1
    hints:
    - Water on the ground.
    - After rain.
    solution: Puddle is a rain word.
    mistakes: {"sunburn": "e3_rain_word"}
  - prompt: 'Choose the correct sentence:'
    options:
    - I fold the paper.
    - I folds the paper.
    - I folding the paper.
    - I is fold the paper.
    answer: I fold the paper.
    difficulty: 1
    hints:
    - '''I'' takes ''fold''.'
    - Read aloud.
    solution: '''I fold the paper'' is correct.'
    mistakes:
      I folds the paper.: eng3_grammar
  - prompt: Which word tells the step after 'first'?
    options:
    - next
    - finally
    - last
    answer: next
    difficulty: 1
    hints:
    - It comes second.
    - Finally and last are at the end.
    solution: 'Step 1: First is the start. Step 2: Next comes after it.'
    mistakes:
      finally: c3e6_order
      last: c3e6_order
  - prompt: In 'Fold the paper in half', which word tells you what to do?
    options:
    - fold
    - paper
    - half
    answer: fold
    difficulty: 1
    hints:
    - Which word is an action?
    - You do it with your hands.
    solution: 'Step 1: Paper is a thing. Step 2: Fold is the doing word.'
    mistakes:
      paper: c3e6_verb
      half: c3e6_verb
  - prompt: Which would float the longest?
    options:
    - a boat made of plastic sheet
    - a paper boat
    - a boat of tissue paper
    answer: a boat made of plastic sheet
    difficulty: 2
    hints:
    - Which one does not soak up water?
    - Tissue gets soggy fastest.
    solution: 'Step 1: Paper and tissue soak water. Step 2: Plastic does not, so it floats longest.'
    mistakes:
      a paper boat: c3e6_float
      a boat of tissue paper: c3e6_float
  - prompt: 'Put in order: ''float it'', ''take paper'', ''fold it''.'
    options:
    - take paper, fold it, float it
    - fold it, float it, take paper
    - float it, take paper, fold it
    answer: take paper, fold it, float it
    difficulty: 2
    hints:
    - What is needed before folding?
    - You float only when it is made.
    solution: 'Step 1: Take paper, then fold. Step 2: Float last.'
    mistakes:
      fold it, float it, take paper: c3e6_order
      float it, take paper, fold it: c3e6_order
  - prompt: Which word is about rain?
    options:
    - drizzle
    - desert
    - dust
    answer: drizzle
    difficulty: 2
    hints:
    - It means light rain.
    - The others are dry.
    solution: 'Step 1: Desert and dust are dry. Step 2: Drizzle is light rain.'
    mistakes:
      desert: c3e6_float
      dust: c3e6_float
  - prompt: Choose the correct instruction.
    options:
    - Press the folds flat.
    - press the folds flat
    - The folds flat press.
    answer: Press the folds flat.
    difficulty: 2
    hints:
    - It starts with a capital and a doing word.
    - It ends with a full stop.
    solution: 'Step 1: Capital P, doing word first. Step 2: Full stop at the end.'
    mistakes:
      press the folds flat: c3e6_verb
      The folds flat press.: c3e6_verb
  - prompt: Write the plural of 'boat'.
    options:
    - boats
    - boates
    - boaties
    answer: boats
    difficulty: 1
    hints:
    - Most words just add one letter.
    - Add -s.
    solution: 'Step 1: boat + s. Step 2: boats.'
    mistakes:
      boates: c3e6_verb
      boaties: c3e6_verb
  - prompt: Which word means 'at the end'?
    options:
    - finally
    - first
    - next
    answer: finally
    difficulty: 1
    hints:
    - It is the last order word.
    - Not the start.
    solution: 'Step 1: First and next are early steps. Step 2: Finally means at the end.'
    mistakes:
      first: c3e6_order
      next: c3e6_order
  - prompt: Two friends race paper boats in a puddle. One boat sinks first. What is the most likely reason?
    options:
    - its paper got wet faster
    - it was the happier boat
    - the puddle liked the other boat
    answer: its paper got wet faster
    difficulty: 3
    hints:
    - Boats cannot feel.
    - What makes a paper boat sink?
    solution: 'Step 1: Wet paper goes soft. Step 2: The boat whose paper soaked first sank first.'
    mistakes:
      it was the happier boat: c3e6_float
      the puddle liked the other boat: c3e6_float
