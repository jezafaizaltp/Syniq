# CBSE Class 3 English (NCERT Santoor, 2024-25), chapter 6. Format: content/README.md.
# Chapter list from the CBSE syllabus and published lists; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse3-eng
chapter: 6
title: 'Paper Boats (Unit 2: Toys and Games)'
concepts:
- code: cbse3e.u2.boats
  title: 'Paper Boats (Unit 2: Toys and Games)'
  notes: |
    A lesson about making and floating paper boats, especially in the rain. It may include steps for folding a boat and
    the joy of watching it sail. Exact text is not reproduced here; questions focus on sequence (first, next, then,
    finally), rain words and following instructions.
  explanations:
    text: Paper boats are fun to make. You fold a sheet of paper step by step until it becomes a boat. On a rainy day, children float paper boats in puddles and watch them sail away.
    visual: Draw the steps of folding a paper boat and a boat sailing in a rain puddle.
    step_by_step: 1. First, take a sheet of paper. 2. Next, fold it in half. 3. Then fold the corners. 4. Finally, open it into a boat and float it.
    real_world: During the monsoon, children float paper boats in the water that collects on the road.
  picture:
    kind: flow
    steps:
    - Take a sheet of paper
    - Fold it in half
    - Fold the corners
    - Open it into a boat
    - Float it
    alt: Take a sheet of paper, fold it in half, fold the corners, open it into a boat and float it.
  items:
  - prompt: What do we need to make a paper boat?
    options:
    - a sheet of paper
    - a hammer
    - wood and nails
    - glue and a saw
    answer: a sheet of paper
    difficulty: 1
    hints:
    - Look at the title.
    - Paper ...
    solution: We need a sheet of paper.
  - prompt: 'Children often float paper boats:'
    options:
    - in rainwater puddles
    - in a hot oven
    - on a road with no water
    - in sand
    answer: in rainwater puddles
    difficulty: 1
    hints:
    - Boats need water.
    - Rainy day.
    solution: In rainwater puddles.
  - prompt: Which word tells the last step?
    options:
    - finally
    - first
    - next
    - then
    answer: finally
    difficulty: 2
    hints:
    - It means at the end.
    - Last of all.
    solution: Finally tells the last step.
    mistakes:
      first: eng3_word
  - prompt: Why does a paper boat sink after some time?
    options:
    - the paper gets wet and soft
    - it gets tired
    - it is too light
    - boats hate water
    answer: the paper gets wet and soft
    difficulty: 2
    hints:
    - Paper soaks water.
    - Gets soggy.
    solution: The paper gets wet and soft.
  - prompt: Which is a rain word?
    options:
    - puddle
    - desert
    - sunburn
    - dust
    answer: puddle
    difficulty: 1
    hints:
    - Water on the ground.
    - After rain.
    solution: Puddle is a rain word.
  - prompt: 'Choose the correct sentence:'
    options:
    - I fold the paper.
    - I folds the paper.
    - I folding the paper.
    - I is fold the paper.
    answer: I fold the paper.
    difficulty: 1
    hints:
    - '''I'' takes ''fold''.'
    - Read aloud.
    solution: '''I fold the paper'' is correct.'
    mistakes:
      I folds the paper.: eng3_grammar
