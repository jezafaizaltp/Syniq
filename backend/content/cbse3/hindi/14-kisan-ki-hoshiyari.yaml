subject: cbse3-hin
chapter: 14
title: किसान की होशियारी
tips:
  h3_upar_fasal: "गाजर, मूली, आलू खोदकर निकालते हैं। किसके दाने पौधे पर ऊपर लगते हैं और तोड़े जाते हैं?"
  c3h14_fasal: 'उस फसल का खाने वाला भाग सोचो: वह मिट्टी के नीचे बनता है या पौधे के ऊपर?'
  c3h14_buddhi: 'सोचो: कमज़ोर होकर भी किसान ने बिना लड़े मुश्किल कैसे हल की?'
  c3h14_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v5.kisan
  title: किसान की होशियारी
  notes: |
    एक किसान की चतुराई की लोककथा। प्रसिद्ध रूप में: किसान और भालू/राक्षस फसल बाँटते हैं; पहली बार 'ऊपर का हिस्सा' चुनने पर किसान
    आलू/शकरकंद बोता है, दूसरी बार 'नीचे का हिस्सा' चुनने पर गेहूँ/मक्का। इस पुस्तक का सटीक रूप पक्का नहीं, इसलिए प्रश्न सामान्य हैं:
    किसान की बुद्धि, फसल के भाग (जड़ वाली और ऊपर वाली), सीख।
  explanations:
    text: इस कहानी में एक किसान अपनी होशियारी से मुसीबत से बच जाता है। किसान जानता है कि कुछ फसलें ज़मीन के नीचे उगती हैं, जैसे आलू, और कुछ ऊपर, जैसे गेहूँ। इसी समझ से वह सही फ़ैसला करता है।
    visual: 'चित्र बनाइए: एक खेत, जिसमें ऊपर गेहूँ की बालियाँ हों और दूसरे खेत में ज़मीन के नीचे आलू दिख रहे हों।'
    step_by_step: 1. किसान कौन है? 2. उसकी मुसीबत क्या है? 3. वह क्या उपाय करता है? 4. होशियारी से क्या मिलता है?
    real_world: किसान मौसम और मिट्टी देखकर तय करते हैं कि कौन-सी फसल बोनी है।
  picture:
    kind: compare
    columns:
    - title: ज़मीन के नीचे
      points:
      - आलू
      - गाजर
      - मूली
    - title: ज़मीन के ऊपर
      points:
      - गेहूँ
      - मक्का
      - धान
    alt: आलू, गाजर और मूली ज़मीन के नीचे उगते हैं; गेहूँ, मक्का और धान ऊपर।
  activity:
    type: sort
    prompt: फसल का खाने वाला भाग ज़मीन के ऊपर है या नीचे?
    bins:
    - ऊपर का भाग
    - नीचे का भाग (जड़)
    items:
    - label: गेहूँ
      bin: ऊपर का भाग
      clue: गेहूँ के दाने बालियों में कहाँ लगते हैं?
      why: दाने ऊपर बालियों में।
    - label: मक्का
      bin: ऊपर का भाग
      clue: भुट्टा पौधे पर कहाँ लगता है?
      why: भुट्टा ऊपर।
    - label: आलू
      bin: नीचे का भाग (जड़)
      clue: आलू खोदकर निकालते हैं या तोड़कर?
      why: आलू ज़मीन के नीचे।
    - label: गाजर
      bin: नीचे का भाग (जड़)
      clue: गाजर का खाने वाला भाग कहाँ है?
      why: गाजर जड़ है।
    - label: मूली
      bin: नीचे का भाग (जड़)
      clue: मूली उखाड़ते हैं या तोड़ते हैं?
      why: मूली ज़मीन के नीचे।
  lesson:
    - teach: '''किसान की होशियारी'' एक लोककथा है। किसान ताकतवर नहीं, पर समझदार है। मुश्किल आने पर वह लड़ता नहीं, सोचकर ऐसा उपाय करता है कि उसका नुकसान न हो।'
      check:
        prompt: किसान ने मुश्किल कैसे हल की?
        options:
        - समझदारी से
        - लड़ाई करके
        - भागकर
        answer: समझदारी से
        why: कहानी का नाम ही होशियारी है।
      ways:
      - style: visual
        teach: ताकत से हल निकालना, और समझदारी से हल निकालना।
        picture:
          kind: compare
          columns:
          - title: ताकत से
            points:
            - लड़ाई होती है
            - कमज़ोर हार जाता है
            - नुकसान होता है
          - title: समझदारी से (किसान)
            points:
            - लड़ाई नहीं होती
            - सोचकर उपाय निकलता है
            - अपना नुकसान नहीं होता
          alt: ताकत से हल निकालने में लड़ाई होती है, कमज़ोर हार जाता है और नुकसान होता है। किसान की तरह समझदारी से कोई लड़ाई नहीं होती, सोचकर उपाय निकलता है और अपना नुकसान नहीं होता।
      - style: real_world
        teach: लोककथाएँ दादा-दादी से बच्चों तक मुँह-ज़बानी चलती आई हैं। गाँवों में शाम को बैठकर ऐसी कहानियाँ सुनाई जाती हैं, जिनमें छोटा पर समझदार पात्र जीतता है।
    - teach: 'कुछ फसलों का खाने वाला भाग ज़मीन के नीचे होता है: आलू, शकरकंद, गाजर, मूली। कुछ का ऊपर: गेहूँ, मक्का, धान (बाली में दाने)।'
      picture:
        kind: compare
        columns:
        - title: नीचे (मिट्टी में)
          points:
          - आलू
          - गाजर
          - मूली
        - title: ऊपर (पौधे पर)
          points:
          - गेहूँ
          - मक्का
          - धान
        alt: ज़मीन के नीचे और ऊपर बनने वाली फसलें।
      check:
        prompt: गाजर कहाँ बनती है?
        options:
        - ज़मीन के नीचे
        - पेड़ की डाल पर
        - पत्तों के ऊपर
        answer: ज़मीन के नीचे
        why: गाजर जड़ है, मिट्टी में बढ़ती है।
      ways:
      - style: step_by_step
        teach: 'किसी फसल का खाने वाला भाग पहचानो। पहला: फसल का नाम लो, जैसे शकरकंद। दूसरा: सोचो, हम उसका कौन-सा भाग खाते हैं। तीसरा: सोचो, वह भाग मिट्टी के नीचे बनता है या ऊपर। चौथा: शकरकंद का खाने वाला भाग नीचे बनता है।'
      - style: real_world
        teach: खेत में गाजर का पौधा ऊपर से सिर्फ़ हरी पत्तियों जैसा दिखता है। असली नारंगी गाजर तो मिट्टी के अंदर छिपी होती है, जिसे उखाड़कर निकालना पड़ता है।
    - teach: 'किसान खेत में मेहनत करता है: हल चलाना, बीज बोना, पानी देना, फसल काटना। उसकी मेहनत से हमें अनाज मिलता है।'
      check:
        prompt: बीज बोने से पहले खेत में क्या करते हैं?
        options:
        - हल चलाते हैं
        - फसल काटते हैं
        - अनाज बेचते हैं
        answer: हल चलाते हैं
        why: हल से मिट्टी नरम होती है, तब बीज बोते हैं।
      ways:
      - style: visual
        teach: 'किसान की मेहनत: खेत से फसल हमारे घर तक, क्रम से।'
        picture:
          kind: flow
          steps:
          - हल चलाकर खेत तैयार करना
          - बीज बोना
          - पानी देना और देखभाल
          - फसल काटना (कटाई)
          - अनाज बाज़ार और हमारे घर तक
          alt: किसान पहले हल चलाकर खेत तैयार करता है, फिर बीज बोता है, पानी देता है और देखभाल करता है, फिर फसल काटता है, और अनाज बाज़ार होकर हमारे घर तक पहुँचता है।
      - style: real_world
        teach: किसान को अक्सर सुबह सूरज निकलने से पहले खेत पहुँचना पड़ता है, और धूप, बारिश, ठंड में भी काम करना पड़ता है। इसीलिए अनाज का एक दाना भी बर्बाद नहीं करना चाहिए।
  items:
  - prompt: '''होशियारी'' का अर्थ है:'
    options:
    - चतुराई / समझदारी
    - आलस
    - डर
    - गुस्सा
    answer: चतुराई / समझदारी
    difficulty: 1
    hints:
    - होशियार होना।
    - बुद्धि।
    solution: होशियारी यानी चतुराई।
    mistakes:
      आलस: hin3_word
  - prompt: आलू कहाँ उगता है?
    options:
    - ज़मीन के नीचे
    - पेड़ की डाल पर
    - पानी के ऊपर
    - हवा में
    answer: ज़मीन के नीचे
    difficulty: 1
    hints:
    - खोदकर निकालते हैं।
    - मिट्टी में।
    solution: आलू ज़मीन के नीचे उगता है।
    mistakes: {"पेड़ की डाल पर": "h1_mitti_andar", "पानी के ऊपर": "h1_mitti_andar", "हवा में": "h1_mitti_andar"}
  - prompt: गेहूँ का दाना पौधे के किस भाग में होता है?
    options:
    - ऊपर बाली में
    - जड़ में
    - मिट्टी में
    - पत्तों के नीचे ज़मीन में
    answer: ऊपर बाली में
    difficulty: 2
    hints:
    - सुनहरी बालियाँ।
    - ऊपर।
    solution: गेहूँ ऊपर बाली में होता है।
    mistakes:
      जड़ में: hin3_read_again
  - prompt: किसान कहाँ काम करता है?
    options:
    - खेत में
    - अस्पताल में
    - दफ़्तर में
    - जहाज़ पर
    answer: खेत में
    difficulty: 1
    hints:
    - फसल उगाता है।
    - हल।
    solution: किसान खेत में काम करता है।
    mistakes: {"अस्पताल में": "h2_kisan", "दफ़्तर में": "h2_kisan", "जहाज़ पर": "h2_kisan"}
  - prompt: इस कहानी से क्या सीख मिलती है?
    options:
    - समझदारी से मुश्किल हल होती है
    - मेहनत बेकार है
    - हमेशा डरो
    - दूसरों को धोखा दो
    answer: समझदारी से मुश्किल हल होती है
    difficulty: 2
    hints:
    - किसान कैसे बचा?
    - बुद्धि।
    solution: समझदारी से मुश्किल हल होती है।
    mistakes:
      मेहनत बेकार है: hin3_lesson
  - prompt: कौन-सी फसल ज़मीन के ऊपर उगती है?
    options:
    - मक्का
    - गाजर
    - मूली
    - आलू
    answer: मक्का
    difficulty: 2
    hints:
    - भुट्टा।
    - ऊँचा पौधा।
    solution: मक्का ज़मीन के ऊपर उगता है।
    mistakes: {"गाजर": "h3_upar_fasal", "मूली": "h3_upar_fasal", "आलू": "h3_upar_fasal"}
  - prompt: इनमें से कौन ज़मीन के नीचे उगता है?
    options:
    - मूली
    - गेहूँ
    - मक्का
    answer: मूली
    difficulty: 1
    hints:
    - गेहूँ और मक्का के दाने ऊपर लगते हैं।
    - सफ़ेद, लंबी जड़।
    solution: 'चरण 1: गेहूँ, मक्का ऊपर। चरण 2: मूली ज़मीन के नीचे।'
    mistakes:
      गेहूँ: c3h14_fasal
      मक्का: c3h14_fasal
  - prompt: धान के दाने पौधे के किस भाग में लगते हैं?
    options:
    - ऊपर की बाली में
    - जड़ में
    - तने के अंदर
    answer: ऊपर की बाली में
    difficulty: 2
    hints:
    - धान, गेहूँ जैसा ही है।
    - पौधे के सबसे ऊपर।
    solution: 'चरण 1: धान अनाज है। चरण 2: उसके दाने ऊपर बाली में लगते हैं।'
    mistakes:
      जड़ में: c3h14_fasal
      तने के अंदर: c3h14_fasal
  - prompt: खेत जोतने के लिए किसका उपयोग होता है?
    options:
    - हल या ट्रैक्टर
    - छाता
    - पतंग
    answer: हल या ट्रैक्टर
    difficulty: 1
    hints:
    - मिट्टी पलटनी है।
    - बैल या मशीन खींचते हैं।
    solution: 'चरण 1: जोतना यानी मिट्टी पलटना। चरण 2: हल या ट्रैक्टर से।'
    mistakes:
      छाता: c3h14_fasal
      पतंग: c3h14_fasal
  - prompt: '''किसान'' का समान अर्थ वाला शब्द है:'
    options:
    - कृषक
    - व्यापारी
    - सैनिक
    answer: कृषक
    difficulty: 2
    hints:
    - '''कृषि'' यानी खेती।'
    - खेती करने वाला।
    solution: 'चरण 1: कृषि = खेती। चरण 2: कृषक = किसान।'
    mistakes:
      व्यापारी: c3h14_shabd
      सैनिक: c3h14_shabd
  - prompt: अगर कोई ज़बरदस्ती फसल का 'नीचे का भाग' माँगे, तो होशियार किसान क्या बोएगा?
    options:
    - गेहूँ, जिसके दाने ऊपर होते हैं
    - आलू, जो नीचे होता है
    - गाजर, जो नीचे होती है
    answer: गेहूँ, जिसके दाने ऊपर होते हैं
    difficulty: 3
    hints:
    - किसान अच्छा भाग अपने पास रखना चाहता है।
    - नीचे का भाग बेकार हो, ऐसी फसल।
    solution: 'चरण 1: माँगने वाले को नीचे का भाग मिलेगा। चरण 2: गेहूँ में काम के दाने ऊपर हैं, तो किसान फ़ायदे में।'
    mistakes:
      आलू, जो नीचे होता है: c3h14_buddhi
      गाजर, जो नीचे होती है: c3h14_buddhi
  - prompt: '''मेहनती'' का उलटा क्या है?'
    options:
    - आलसी
    - होशियार
    - किसान
    answer: आलसी
    difficulty: 1
    hints:
    - जो काम न करना चाहे।
    - होशियार उलटा नहीं है।
    solution: 'चरण 1: मेहनती खूब काम करता है। चरण 2: उलटा आलसी।'
    mistakes:
      होशियार: c3h14_shabd
      किसान: c3h14_shabd
  - prompt: फसल काटने को क्या कहते हैं?
    options:
    - कटाई
    - बुआई
    - सिंचाई
    answer: कटाई
    difficulty: 2
    hints:
    - बुआई में बीज बोते हैं।
    - सिंचाई में पानी देते हैं।
    solution: 'चरण 1: बुआई = बोना, सिंचाई = पानी। चरण 2: काटना = कटाई।'
    mistakes:
      बुआई: c3h14_fasal
      सिंचाई: c3h14_fasal
  - prompt: किसान ने 25 बोरी गेहूँ उगाया। 10 बोरी बेच दीं। कितनी बोरी बचीं?
    answer: '15'
    check: 25-10
    difficulty: 2
    hints:
