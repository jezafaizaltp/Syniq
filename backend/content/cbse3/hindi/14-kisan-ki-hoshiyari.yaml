subject: cbse3-hin
chapter: 14
title: किसान की होशियारी
tips:
  h3_upar_fasal: "गाजर, मूली, आलू खोदकर निकालते हैं। किसके दाने पौधे पर ऊपर लगते हैं और तोड़े जाते हैं?"

concepts:
- code: cbse3h.v5.kisan
  title: किसान की होशियारी
  notes: |
    एक किसान की चतुराई की लोककथा। प्रसिद्ध रूप में: किसान और भालू/राक्षस फसल बाँटते हैं; पहली बार 'ऊपर का हिस्सा' चुनने पर किसान
    आलू/शकरकंद बोता है, दूसरी बार 'नीचे का हिस्सा' चुनने पर गेहूँ/मक्का। इस पुस्तक का सटीक रूप पक्का नहीं, इसलिए प्रश्न सामान्य हैं:
    किसान की बुद्धि, फसल के भाग (जड़ वाली और ऊपर वाली), सीख।
  explanations:
    text: इस कहानी में एक किसान अपनी होशियारी से मुसीबत से बच जाता है। किसान जानता है कि कुछ फसलें ज़मीन के नीचे उगती हैं, जैसे आलू, और कुछ ऊपर, जैसे गेहूँ। इसी समझ से वह सही फ़ैसला करता है।
    visual: 'चित्र बनाइए: एक खेत, जिसमें ऊपर गेहूँ की बालियाँ हों और दूसरे खेत में ज़मीन के नीचे आलू दिख रहे हों।'
    step_by_step: 1. किसान कौन है? 2. उसकी मुसीबत क्या है? 3. वह क्या उपाय करता है? 4. होशियारी से क्या मिलता है?
    real_world: किसान मौसम और मिट्टी देखकर तय करते हैं कि कौन-सी फसल बोनी है।
  picture:
    kind: compare
    columns:
    - title: ज़मीन के नीचे
      points:
      - आलू
      - गाजर
      - मूली
    - title: ज़मीन के ऊपर
      points:
      - गेहूँ
      - मक्का
      - धान
    alt: आलू, गाजर और मूली ज़मीन के नीचे उगते हैं; गेहूँ, मक्का और धान ऊपर।
  activity:
    type: sort
    prompt: फसल का खाने वाला भाग ज़मीन के ऊपर है या नीचे?
    bins:
    - ऊपर का भाग
    - नीचे का भाग (जड़)
    items:
    - label: गेहूँ
      bin: ऊपर का भाग
      clue: गेहूँ के दाने बालियों में कहाँ लगते हैं?
      why: दाने ऊपर बालियों में।
    - label: मक्का
      bin: ऊपर का भाग
      clue: भुट्टा पौधे पर कहाँ लगता है?
      why: भुट्टा ऊपर।
    - label: आलू
      bin: नीचे का भाग (जड़)
      clue: आलू खोदकर निकालते हैं या तोड़कर?
      why: आलू ज़मीन के नीचे।
    - label: गाजर
      bin: नीचे का भाग (जड़)
      clue: गाजर का खाने वाला भाग कहाँ है?
      why: गाजर जड़ है।
    - label: मूली
      bin: नीचे का भाग (जड़)
      clue: मूली उखाड़ते हैं या तोड़ते हैं?
      why: मूली ज़मीन के नीचे।
  items:
  - prompt: '''होशियारी'' का अर्थ है:'
    options:
    - चतुराई / समझदारी
    - आलस
    - डर
    - गुस्सा
    answer: चतुराई / समझदारी
    difficulty: 1
    hints:
    - होशियार होना।
    - बुद्धि।
    solution: होशियारी यानी चतुराई।
    mistakes:
      आलस: hin3_word
  - prompt: आलू कहाँ उगता है?
    options:
    - ज़मीन के नीचे
    - पेड़ की डाल पर
    - पानी के ऊपर
    - हवा में
    answer: ज़मीन के नीचे
    difficulty: 1
    hints:
    - खोदकर निकालते हैं।
    - मिट्टी में।
    solution: आलू ज़मीन के नीचे उगता है।
    mistakes: {"पेड़ की डाल पर": "h1_mitti_andar", "पानी के ऊपर": "h1_mitti_andar", "हवा में": "h1_mitti_andar"}
  - prompt: गेहूँ का दाना पौधे के किस भाग में होता है?
    options:
    - ऊपर बाली में
    - जड़ में
    - मिट्टी में
    - पत्तों के नीचे ज़मीन में
    answer: ऊपर बाली में
    difficulty: 2
    hints:
    - सुनहरी बालियाँ।
    - ऊपर।
    solution: गेहूँ ऊपर बाली में होता है।
    mistakes:
      जड़ में: hin3_read_again
  - prompt: किसान कहाँ काम करता है?
    options:
    - खेत में
    - अस्पताल में
    - दफ़्तर में
    - जहाज़ पर
    answer: खेत में
    difficulty: 1
    hints:
    - फसल उगाता है।
    - हल।
    solution: किसान खेत में काम करता है।
    mistakes: {"अस्पताल में": "h2_kisan", "दफ़्तर में": "h2_kisan", "जहाज़ पर": "h2_kisan"}
  - prompt: इस कहानी से क्या सीख मिलती है?
    options:
    - समझदारी से मुश्किल हल होती है
    - मेहनत बेकार है
    - हमेशा डरो
    - दूसरों को धोखा दो
    answer: समझदारी से मुश्किल हल होती है
    difficulty: 2
    hints:
    - किसान कैसे बचा?
    - बुद्धि।
    solution: समझदारी से मुश्किल हल होती है।
    mistakes:
      मेहनत बेकार है: hin3_lesson
  - prompt: कौन-सी फसल ज़मीन के ऊपर उगती है?
    options:
    - मक्का
    - गाजर
    - मूली
    - आलू
    answer: मक्का
    difficulty: 2
    hints:
    - भुट्टा।
    - ऊँचा पौधा।
    solution: मक्का ज़मीन के ऊपर उगता है।
    mistakes: {"गाजर": "h3_upar_fasal", "मूली": "h3_upar_fasal", "आलू": "h3_upar_fasal"}
