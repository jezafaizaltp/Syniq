subject: cbse3-hin
chapter: 2
title: चींटी
tips:
  h3_cheenti_ghar: "चींटियों की कतार ज़मीन के किसी छोटे छेद में जाती दिखती है। ज़मीन के अंदर के घर को क्या कहते हैं?"
  h3_cheenti_taakat: "चींटी छोटी है, पर उसकी ताकत की तारीफ़ होती है। तारीफ़ तभी होगी जब दाना उसके वज़न से कैसा हो?"

concepts:
- code: cbse3h.v1.cheenti
  title: चींटी
  notes: |
    नन्ही चींटी पर एक कविता। चींटी छोटी होकर भी मेहनती है, कतार में चलती है, अपने से भारी दाना उठाती है और मिलकर काम करती है।
    (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: छोटा-बड़ा, कतार, मेहनत, मिलजुलकर काम।
  explanations:
    text: चींटी बहुत छोटी होती है, पर बहुत मेहनती। वह कतार में चलती है, अपने से भारी दाना उठा लेती है और सब चींटियाँ मिलकर काम करती हैं।
    visual: 'चित्र बनाइए: कतार में चलती चींटियाँ, जिनमें से एक बड़ा दाना उठाए है।'
    step_by_step: 1. कविता पढ़ें। 2. चींटी कैसी है? 3. वह क्या करती है? 4. हम चींटी से क्या सीखें?
    real_world: बरसात से पहले चींटियाँ अपने बिल में खाना जमा करती दिखती हैं।
  picture:
    kind: flow
    steps:
    - चींटी दाना देखती है
    - साथियों को बताती है
    - सब मिलकर उठाती हैं
    - बिल में ले जाती हैं
    alt: चींटी दाना देखती है, साथियों को बताती है, सब मिलकर उठाती हैं और बिल में ले जाती हैं।
  items:
  - prompt: चींटी कैसे चलती है?
    options:
    - कतार में
    - उड़कर
    - तैरकर
    - कूदकर
    answer: कतार में
    difficulty: 1
    hints:
    - एक के पीछे एक।
    - लाइन।
    solution: चींटियाँ कतार में चलती हैं।
    mistakes: {"उड़कर": "h2_cheenti_chal", "तैरकर": "h2_cheenti_chal", "कूदकर": "h2_cheenti_chal"}
  - prompt: चींटी का स्वभाव कैसा है?
    options:
    - मेहनती
    - आलसी
    - डरपोक
    - गुस्सैल
    answer: मेहनती
    difficulty: 1
    hints:
    - दिन भर काम।
    - थकती नहीं।
    solution: चींटी मेहनती होती है।
    mistakes:
      आलसी: hin3_lesson
  - prompt: चींटी कहाँ रहती है?
    options:
    - बिल में
    - घोंसले में
    - पानी में
    - पेड़ की चोटी पर
    answer: बिल में
    difficulty: 1
    hints:
    - ज़मीन के नीचे।
    - छोटा छेद।
    solution: चींटी बिल में रहती है।
    mistakes: {"घोंसले में": "h3_cheenti_ghar", "पानी में": "h3_cheenti_ghar", "पेड़ की चोटी पर": "h3_cheenti_ghar"}
  - prompt: '''छोटी'' का उलटा क्या है?'
    options:
    - बड़ी
    - नन्ही
    - पतली
    - हल्की
    answer: बड़ी
    difficulty: 1
    hints:
    - छोटा नहीं।
    - हाथी।
    solution: छोटी का उलटा बड़ी है।
    mistakes:
      नन्ही: hin3_word
  - prompt: चींटी से हमें क्या सीखना चाहिए?
    options:
    - मिलकर मेहनत करना
    - अकेले रहना
    - सोते रहना
    - दूसरों को तंग करना
    answer: मिलकर मेहनत करना
    difficulty: 2
    hints:
    - सब साथ काम करती हैं।
    - टीम।
    solution: मिलकर मेहनत करना।
    mistakes: {"अकेले रहना": "h2_cheenti_seekh", "सोते रहना": "h2_cheenti_seekh", "दूसरों को तंग करना": "h2_cheenti_seekh"}
  - prompt: चींटी अपने वज़न से ___ दाना उठा सकती है।
    options:
    - भारी
    - हल्का ही
    - कोई नहीं
    - हवा
    answer: भारी
    difficulty: 2
    hints:
    - वह बहुत ताकतवर है।
    - अपने से ज़्यादा।
    solution: चींटी अपने से भारी दाना उठा लेती है।
    mistakes: {"हल्का ही": "h3_cheenti_taakat", "कोई नहीं": "h3_cheenti_taakat", "हवा": "h3_cheenti_taakat"}
