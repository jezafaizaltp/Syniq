subject: cbse3-hin
chapter: 2
title: चींटी
tips:
  h3_cheenti_ghar: "चींटियों की कतार ज़मीन के किसी छोटे छेद में जाती दिखती है। ज़मीन के अंदर के घर को क्या कहते हैं?"
  h3_cheenti_taakat: "चींटी छोटी है, पर उसकी ताकत की तारीफ़ होती है। तारीफ़ तभी होगी जब दाना उसके वज़न से कैसा हो?"
  c3h2_cheenti: चींटियों की कतार को याद करो। वे क्या करती दिखती हैं?
  c3h2_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है। दोनों को साथ रखकर सोचो।
  c3h2_ginti: चित्र बनाओ और एक-एक करके गिनो।

concepts:
- code: cbse3h.v1.cheenti
  title: चींटी
  notes: |
    नन्ही चींटी पर एक कविता। चींटी छोटी होकर भी मेहनती है, कतार में चलती है, अपने से भारी दाना उठाती है और मिलकर काम करती है।
    (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: छोटा-बड़ा, कतार, मेहनत, मिलजुलकर काम।
  explanations:
    text: चींटी बहुत छोटी होती है, पर बहुत मेहनती। वह कतार में चलती है, अपने से भारी दाना उठा लेती है और सब चींटियाँ मिलकर काम करती हैं।
    visual: 'चित्र बनाइए: कतार में चलती चींटियाँ, जिनमें से एक बड़ा दाना उठाए है।'
    step_by_step: 1. कविता पढ़ें। 2. चींटी कैसी है? 3. वह क्या करती है? 4. हम चींटी से क्या सीखें?
    real_world: बरसात से पहले चींटियाँ अपने बिल में खाना जमा करती दिखती हैं।
  picture:
    kind: flow
    steps:
    - चींटी दाना देखती है
    - साथियों को बताती है
    - सब मिलकर उठाती हैं
    - बिल में ले जाती हैं
    alt: चींटी दाना देखती है, साथियों को बताती है, सब मिलकर उठाती हैं और बिल में ले जाती हैं।
  activity:
    type: sort
    prompt: चींटी के बारे में सही बात चुनो।
    bins:
    - सही
    - सही नहीं
    items:
    - label: कतार में चलती है
      bin: सही
      clue: चींटियाँ एक के पीछे एक?
      why: चींटियाँ कतार में चलती हैं।
    - label: अपने से भारी दाना उठाती है
      bin: सही
      clue: छोटी होकर भी कितनी ताक़तवर?
      why: सही।
    - label: मिलकर काम करती है
      bin: सही
      clue: अकेले या साथ-साथ?
      why: मिलकर काम।
    - label: आलसी होती है
      bin: सही नहीं
      clue: चींटी मेहनती है या आलसी?
      why: चींटी मेहनती है।
  lesson:
    - teach: '''चींटी'' कविता नन्ही चींटी के बारे में है। चींटी छोटी है, पर बहुत मेहनती है। वह अपने वज़न से भी भारी दाना उठाकर ले जाती है।'
      check:
        prompt: चींटी कैसी होती है?
        options:
        - छोटी पर मेहनती
        - बड़ी और आलसी
        - ऊँची और धीमी
        answer: छोटी पर मेहनती
        why: चींटी नन्ही है, फिर भी पूरे दिन काम करती है।
    - teach: चींटियाँ कतार में चलती हैं और मिलकर काम करती हैं। वे सर्दी के लिए दाना इकट्ठा करती हैं और अपने बिल में रखती हैं।
      picture:
        kind: flow
        steps:
        - दाना ढूँढना
        - कतार में चलना
        - मिलकर उठाना
        - बिल में रखना
        alt: चींटियाँ दाना ढूँढकर बिल तक ले जाती हैं।
      check:
        prompt: चींटियाँ दाना कहाँ रखती हैं?
        options:
        - बिल में
        - पेड़ की चोटी पर
        - नदी में
        answer: बिल में
        why: बिल चींटी का घर है।
    - teach: 'कविता में उलटे शब्द आते हैं: छोटी-बड़ी, हल्का-भारी, आगे-पीछे, आलसी-मेहनती।'
      check:
        prompt: '''हल्का'' का उलटा क्या है?'
        options:
        - भारी
        - छोटा
        - मीठा
        answer: भारी
        why: हल्का और भारी वज़न के दो छोर हैं।
  items:
  - prompt: चींटी कैसे चलती है?
    options:
