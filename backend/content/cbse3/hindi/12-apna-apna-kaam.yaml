subject: cbse3-hin
chapter: 12
title: अपना-अपना काम
tips:
  h3_bachche_kaam: "तुम रोज़ सुबह बस्ता लेकर कहाँ जाते हो और वहाँ क्या करते हो?"
  h3_kaam: "हर व्यक्ति का अपना काम: डाकिया पत्र बाँटता है, दर्ज़ी सिलता है, शिक्षक पढ़ाते हैं। खेत में काम करने वाला क्या करता है?"
  h3_kaam_na: "सोचो, एक दिन सूरज न निकले, किसान खेती न करे, डाकिया न आए। फिर क्या होगा?"

concepts:
- code: cbse3h.v4.kaam
  title: अपना-अपना काम
  notes: |
    पाठ/कविता जो बताता है कि हर किसी का अपना काम है और हर काम ज़रूरी है: सूरज रोशनी देता है, बादल पानी, किसान अनाज, डाकिया पत्र,
    शिक्षक पढ़ाते हैं, बच्चे पढ़ते हैं। अपना काम अच्छे से और समय पर करना। (ठीक पाठ यहाँ नहीं दिया गया है।)
  explanations:
    text: इस पाठ की सीख है कि हर किसी का अपना काम है। सूरज रोशनी देता है, बादल पानी बरसाते हैं, किसान अनाज उगाता है, शिक्षक पढ़ाते हैं। हर काम ज़रूरी है, और हमें अपना काम अच्छे से करना चाहिए।
    visual: 'चित्र बनाइए: सूरज, बादल, किसान, डाकिया और पढ़ता हुआ बच्चा, हर एक के नीचे उसका काम।'
    step_by_step: 1. पाठ पढ़ें। 2. किसका क्या काम है? 3. कोई काम छोटा या बड़ा नहीं। 4. मेरा काम क्या है?
    real_world: 'घर में भी सबके काम बँटे होते हैं: कोई खाना बनाता है, कोई सामान लाता है, बच्चे अपना बस्ता सँभालते हैं।'
  picture:
    kind: compare
    columns:
    - title: कौन
      points:
      - सूरज
      - किसान
      - शिक्षक
    - title: काम
      points:
      - रोशनी देना
      - अनाज उगाना
      - पढ़ाना
    alt: सूरज रोशनी देता है, किसान अनाज उगाता है और शिक्षक पढ़ाते हैं।
  activity:
    type: sort
    prompt: कौन क्या काम करता है?
    bins:
    - रोशनी
    - पानी
    - अनाज
    - पत्र
    items:
    - label: सूरज
      bin: रोशनी
      clue: दिन में उजाला कौन देता है?
      why: सूरज रोशनी देता है।
    - label: बादल
      bin: पानी
      clue: बारिश कौन लाता है?
      why: बादल पानी देते हैं।
    - label: किसान
      bin: अनाज
      clue: खेत में कौन उगाता है?
      why: किसान अनाज उगाता है।
    - label: डाकिया
      bin: पत्र
      clue: चिट्ठी कौन लाता है?
      why: डाकिया पत्र लाता है।
  items:
  - prompt: किसान का काम क्या है?
    options:
    - अनाज उगाना
    - पत्र बाँटना
    - कपड़े सिलना
    - पढ़ाना
    answer: अनाज उगाना
    difficulty: 1
    hints:
    - खेत में।
    - गेहूँ, चावल।
    solution: किसान अनाज उगाता है।
    mistakes: {"पत्र बाँटना": "h3_kaam", "कपड़े सिलना": "h3_kaam", "पढ़ाना": "h3_kaam"}
  - prompt: सूरज का काम क्या है?
    options:
    - रोशनी और गर्मी देना
    - बारिश करना
    - रात लाना
    - हवा रोकना
    answer: रोशनी और गर्मी देना
    difficulty: 1
    hints:
    - दिन में चमकता है।
    - धूप।
    solution: सूरज रोशनी और गर्मी देता है।
    mistakes: {"बारिश करना": "h2_din_roshni", "रात लाना": "h2_din_roshni", "हवा रोकना": "h2_din_roshni"}
  - prompt: बच्चों का मुख्य काम क्या है?
    options:
    - पढ़ना और सीखना
    - दिन भर सोना
    - झगड़ा करना
    - कुछ नहीं
    answer: पढ़ना और सीखना
    difficulty: 1
    hints:
    - स्कूल।
    - सीखना।
    solution: बच्चों का काम पढ़ना और सीखना है।
    mistakes: {"दिन भर सोना": "h3_bachche_kaam", "झगड़ा करना": "h3_bachche_kaam", "कुछ नहीं": "h3_bachche_kaam"}
  - prompt: कौन-सा काम छोटा है?
    options:
    - कोई काम छोटा नहीं, हर काम ज़रूरी है
    - सफ़ाई का काम
    - किसान का काम
    - डाकिये का काम
    answer: कोई काम छोटा नहीं, हर काम ज़रूरी है
    difficulty: 2
    hints:
    - सफ़ाई न हो तो?
    - सब ज़रूरी।
    solution: कोई काम छोटा नहीं।
    mistakes:
      सफ़ाई का काम: hin3_lesson
  - prompt: '''काम'' का समान अर्थ वाला शब्द है:'
    options:
    - कार्य
    - आराम
    - खेल
    - नींद
    answer: कार्य
    difficulty: 2
    hints:
    - दूसरा शब्द।
    - कर्म।
    solution: काम को कार्य भी कहते हैं।
    mistakes:
      आराम: hin3_word
  - prompt: अगर सब अपना-अपना काम न करें तो क्या होगा?
    options:
    - सब कुछ गड़बड़ हो जाएगा
    - सब ठीक रहेगा
    - छुट्टी हो जाएगी
    - कुछ नहीं बदलेगा
    answer: सब कुछ गड़बड़ हो जाएगा
    difficulty: 2
    hints:
    - किसान अनाज न उगाए तो?
    - सोचें।
    solution: सब कुछ गड़बड़ हो जाएगा।
    mistakes: {"सब ठीक रहेगा": "h3_kaam_na", "छुट्टी हो जाएगी": "h3_kaam_na", "कुछ नहीं बदलेगा": "h3_kaam_na"}
