subject: cbse3-hin
chapter: 12
title: अपना-अपना काम
tips:
  h3_bachche_kaam: "तुम रोज़ सुबह बस्ता लेकर कहाँ जाते हो और वहाँ क्या करते हो?"
  h3_kaam: "हर व्यक्ति का अपना काम: डाकिया पत्र बाँटता है, दर्ज़ी सिलता है, शिक्षक पढ़ाते हैं। खेत में काम करने वाला क्या करता है?"
  h3_kaam_na: "सोचो, एक दिन सूरज न निकले, किसान खेती न करे, डाकिया न आए। फिर क्या होगा?"
  c3h12_kaam: उस व्यक्ति या चीज़ के बिना एक दिन सोचो। किस काम की कमी लगेगी?
  c3h12_samay: 'सोचो: काम समय पर न हो तो आगे क्या गड़बड़ होगी?'
  c3h12_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v4.kaam
  title: अपना-अपना काम
  notes: |
    पाठ/कविता जो बताता है कि हर किसी का अपना काम है और हर काम ज़रूरी है: सूरज रोशनी देता है, बादल पानी, किसान अनाज, डाकिया पत्र,
    शिक्षक पढ़ाते हैं, बच्चे पढ़ते हैं। अपना काम अच्छे से और समय पर करना। (ठीक पाठ यहाँ नहीं दिया गया है।)
  explanations:
    text: इस पाठ की सीख है कि हर किसी का अपना काम है। सूरज रोशनी देता है, बादल पानी बरसाते हैं, किसान अनाज उगाता है, शिक्षक पढ़ाते हैं। हर काम ज़रूरी है, और हमें अपना काम अच्छे से करना चाहिए।
    visual: 'चित्र बनाइए: सूरज, बादल, किसान, डाकिया और पढ़ता हुआ बच्चा, हर एक के नीचे उसका काम।'
    step_by_step: 1. पाठ पढ़ें। 2. किसका क्या काम है? 3. कोई काम छोटा या बड़ा नहीं। 4. मेरा काम क्या है?
    real_world: 'घर में भी सबके काम बँटे होते हैं: कोई खाना बनाता है, कोई सामान लाता है, बच्चे अपना बस्ता सँभालते हैं।'
  picture:
    kind: compare
    columns:
    - title: कौन
      points:
      - सूरज
      - किसान
      - शिक्षक
    - title: काम
      points:
      - रोशनी देना
      - अनाज उगाना
      - पढ़ाना
    alt: सूरज रोशनी देता है, किसान अनाज उगाता है और शिक्षक पढ़ाते हैं।
  activity:
    type: sort
    prompt: कौन क्या काम करता है?
    bins:
    - रोशनी
    - पानी
    - अनाज
    - पत्र
    items:
    - label: सूरज
      bin: रोशनी
      clue: दिन में उजाला कौन देता है?
      why: सूरज रोशनी देता है।
    - label: बादल
      bin: पानी
      clue: बारिश कौन लाता है?
      why: बादल पानी देते हैं।
    - label: किसान
      bin: अनाज
      clue: खेत में कौन उगाता है?
      why: किसान अनाज उगाता है।
    - label: डाकिया
      bin: पत्र
      clue: चिट्ठी कौन लाता है?
      why: डाकिया पत्र लाता है।
  lesson:
    - teach: '''अपना-अपना काम'' बताता है कि हर किसी का अपना काम है। सूरज रोशनी देता है, बादल पानी बरसाते हैं, किसान अनाज उगाता है, डाकिया पत्र लाता है, शिक्षक पढ़ाते हैं।'
      picture:
        kind: compare
        columns:
        - title: कौन
          points:
          - सूरज
          - बादल
          - किसान
          - डाकिया
        - title: काम
          points:
          - रोशनी
          - पानी
          - अनाज
          - पत्र
        alt: कौन क्या काम करता है।
      check:
        prompt: बादल का काम क्या है?
        options:
        - पानी बरसाना
        - पत्र लाना
        - पढ़ाना
        answer: पानी बरसाना
        why: बादलों से बारिश होती है।
    - teach: हर काम ज़रूरी है, कोई काम छोटा नहीं। सफ़ाई करने वाले, दर्ज़ी, ड्राइवर, रसोइया, सबके काम से हमारा जीवन आसान बनता है।
      check:
        prompt: सफ़ाई करने वाले का काम कैसा है?
        options:
        - बहुत ज़रूरी
        - बेकार
        - छोटा
        answer: बहुत ज़रूरी
        why: उनके बिना गली-मोहल्ले गंदे हो जाएँ।
    - teach: अपना काम अच्छे से और समय पर करना चाहिए। बच्चों का काम है पढ़ना, सीखना, और घर में छोटे-छोटे कामों में हाथ बँटाना।
      check:
        prompt: बच्चे घर में कौन-सा काम कर सकते हैं?
        options:
        - अपना बस्ता ठीक रखना
        - गाड़ी चलाना
        - बिजली ठीक करना
        answer: अपना बस्ता ठीक रखना
        why: यह बच्चों के लिए सुरक्षित और ज़रूरी काम है।
  items:
  - prompt: किसान का काम क्या है?
    options:
    - अनाज उगाना
    - पत्र बाँटना
    - कपड़े सिलना
    - पढ़ाना
    answer: अनाज उगाना
    difficulty: 1
    hints:
    - खेत में।
    - गेहूँ, चावल।
    solution: किसान अनाज उगाता है।
    mistakes: {"पत्र बाँटना": "h3_kaam", "कपड़े सिलना": "h3_kaam", "पढ़ाना": "h3_kaam"}
  - prompt: सूरज का काम क्या है?
    options:
    - रोशनी और गर्मी देना
    - बारिश करना
    - रात लाना
    - हवा रोकना
    answer: रोशनी और गर्मी देना
    difficulty: 1
    hints:
    - दिन में चमकता है।
    - धूप।
    solution: सूरज रोशनी और गर्मी देता है।
    mistakes: {"बारिश करना": "h2_din_roshni", "रात लाना": "h2_din_roshni", "हवा रोकना": "h2_din_roshni"}
  - prompt: बच्चों का मुख्य काम क्या है?
    options:
    - पढ़ना और सीखना
    - दिन भर सोना
    - झगड़ा करना
    - कुछ नहीं
    answer: पढ़ना और सीखना
    difficulty: 1
    hints:
    - स्कूल।
    - सीखना।
    solution: बच्चों का काम पढ़ना और सीखना है।
    mistakes: {"दिन भर सोना": "h3_bachche_kaam", "झगड़ा करना": "h3_bachche_kaam", "कुछ नहीं": "h3_bachche_kaam"}
  - prompt: कौन-सा काम छोटा है?
    options:
    - कोई काम छोटा नहीं, हर काम ज़रूरी है
    - सफ़ाई का काम
    - किसान का काम
    - डाकिये का काम
    answer: कोई काम छोटा नहीं, हर काम ज़रूरी है
    difficulty: 2
    hints:
    - सफ़ाई न हो तो?
    - सब ज़रूरी।
    solution: कोई काम छोटा नहीं।
    mistakes:
      सफ़ाई का काम: hin3_lesson
  - prompt: '''काम'' का समान अर्थ वाला शब्द है:'
    options:
    - कार्य
    - आराम
    - खेल
    - नींद
    answer: कार्य
    difficulty: 2
    hints:
    - दूसरा शब्द।
    - कर्म।
    solution: काम को कार्य भी कहते हैं।
    mistakes:
      आराम: hin3_word
  - prompt: अगर सब अपना-अपना काम न करें तो क्या होगा?
    options:
    - सब कुछ गड़बड़ हो जाएगा
    - सब ठीक रहेगा
    - छुट्टी हो जाएगी
    - कुछ नहीं बदलेगा
    answer: सब कुछ गड़बड़ हो जाएगा
    difficulty: 2
    hints:
    - किसान अनाज न उगाए तो?
    - सोचें।
    solution: सब कुछ गड़बड़ हो जाएगा।
    mistakes: {"सब ठीक रहेगा": "h3_kaam_na", "छुट्टी हो जाएगी": "h3_kaam_na", "कुछ नहीं बदलेगा": "h3_kaam_na"}
  - prompt: डाकिया क्या काम करता है?
    options:
    - पत्र घर-घर पहुँचाता है
    - खेत जोतता है
    - कपड़े सिलता है
    answer: पत्र घर-घर पहुँचाता है
    difficulty: 1
    hints:
    - उसके थैले में चिट्ठियाँ होती हैं।
    - डाक से जुड़ा काम।
    solution: 'चरण 1: डाकिया डाक लाता है। चरण 2: पत्र घर-घर पहुँचाता है।'
    mistakes:
      खेत जोतता है: c3h12_kaam
      कपड़े सिलता है: c3h12_kaam
  - prompt: कपड़े कौन सिलता है?
    options:
    - दर्ज़ी
    - किसान
    - डाकिया
    answer: दर्ज़ी
    difficulty: 1
    hints:
    - सुई-धागा और सिलाई मशीन।
    - कपड़ों का काम।
    solution: 'चरण 1: सिलाई का काम। चरण 2: दर्ज़ी करता है।'
    mistakes:
      किसान: c3h12_kaam
      डाकिया: c3h12_kaam
  - prompt: अगर किसान अनाज न उगाए तो क्या होगा?
    options:
    - हमें खाने को अनाज नहीं मिलेगा
    - बारिश ज़्यादा होगी
    - स्कूल बंद होंगे
    answer: हमें खाने को अनाज नहीं मिलेगा
    difficulty: 2
    hints:
    - गेहूँ-चावल कहाँ से आते हैं?
    - रसोई में क्या कम पड़ेगा?
    solution: 'चरण 1: अनाज खेत से आता है। चरण 2: किसान न उगाए तो खाने को नहीं मिलेगा।'
    mistakes:
      बारिश ज़्यादा होगी: c3h12_kaam
      स्कूल बंद होंगे: c3h12_kaam
  - prompt: गृहकार्य कब करना चाहिए?
    options:
    - समय पर, रोज़
    - परीक्षा से एक रात पहले सब
    - कभी नहीं
    answer: समय पर, रोज़
    difficulty: 1
    hints:
    - काम जमा हो जाए तो क्या होगा?
    - रोज़ थोड़ा-थोड़ा।
    solution: 'चरण 1: काम टालने से बोझ बढ़ता है। चरण 2: समय पर रोज़ करना ठीक है।'
    mistakes:
      परीक्षा से एक रात पहले सब: c3h12_samay
      कभी नहीं: c3h12_samay
  - prompt: '''मेहनत'' का समान अर्थ वाला शब्द है:'
    options:
    - परिश्रम
    - आराम
    - खेल
    answer: परिश्रम
    difficulty: 2
    hints:
    - आराम इसका उलटा है।
    - किसान दिन भर करता है।
    solution: 'चरण 1: मेहनत = लगकर काम करना। चरण 2: परिश्रम।'
    mistakes:
      आराम: c3h12_shabd
      खेल: c3h12_shabd
  - prompt: डॉक्टर का काम क्या है?
    options:
    - बीमारों का इलाज करना
    - पत्र बाँटना
    - रोटी बनाना
    answer: बीमारों का इलाज करना
    difficulty: 1
    hints:
    - बीमार होने पर हम किसके पास जाते हैं?
    - दवाई देने वाले।
    solution: 'चरण 1: बीमार होने पर डॉक्टर के पास जाते हैं। चरण 2: वे इलाज करते हैं।'
    mistakes:
      पत्र बाँटना: c3h12_kaam
      रोटी बनाना: c3h12_kaam
  - prompt: अगर बस ड्राइवर समय पर न आए तो क्या होगा?
    options:
    - बच्चे स्कूल देर से पहुँचेंगे
    - बस उड़ने लगेगी
    - छुट्टी बढ़ जाएगी
    answer: बच्चे स्कूल देर से पहुँचेंगे
    difficulty: 2
    hints:
    - बस बच्चों को कहाँ ले जाती है?
    - देर का असर किस पर पड़ेगा?
    solution: 'चरण 1: बस स्कूल ले जाती है। चरण 2: ड्राइवर देर करे तो सब देर से पहुँचेंगे।'
    mistakes:
      बस उड़ने लगेगी: c3h12_samay
      छुट्टी बढ़ जाएगी: c3h12_samay
  - prompt: '''काम'' का उलटा क्या है?'
    options:
    - आराम
    - कार्य
    - मेहनत
    answer: आराम
    difficulty: 2
    hints:
    - कार्य और मेहनत काम जैसे ही हैं।
    - काम के बाद हम क्या करते हैं?
    solution: 'चरण 1: कार्य और मेहनत समान अर्थ हैं। चरण 2: उलटा आराम।'
    mistakes:
      कार्य: c3h12_shabd
      मेहनत: c3h12_shabd
  - prompt: कक्षा में 30 बच्चे हैं। हर दिन 5 बच्चे सफ़ाई में मदद करते हैं। सबकी बारी आने में कितने दिन लगेंगे?
    answer: '6'
    check: 30/5
    difficulty: 3
    hints:
    - हर दिन 5 बच्चे।
    - 30 में 5 कितनी बार?
    solution: 'चरण 1: 30 ÷ 5। चरण 2: = 6 दिन।'
    mistakes:
      '25': c3h12_samay
      '35': c3h12_samay
