subject: cbse3-hin
chapter: 11
title: एक जादुई पिटारा
tips:
  h3_ee_pratyay: "शब्द को तोड़ो: जादू + ई। जैसे 'रंग + ईन' में रंग होता है, वैसे ही इसमें क्या होगा?"
  h3_pitara: "जादुई पिटारा खोलो तो हर बार कुछ नया निकलता है। किस चीज़ को खोलने पर हर बार नई दुनिया मिलती है?"
  h3_utsuk: "बंद डिब्बे में क्या है, यह जानने की जल्दी कैसी लगती है? उस भाव का नाम सोचो।"
  c3h11_kalpana: 'सोचो: क्या यह सच में हो सकता है, या सिर्फ़ मन की उड़ान है?'
  c3h11_pratyay: शब्द के अंत में 'ई' या 'इक' जोड़कर देखो, नया शब्द कैसा बनता है।
  c3h11_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v4.pitara
  title: एक जादुई पिटारा
  notes: |
    'जादुई पिटारा' पर पाठ/कविता: एक पिटारे (डिब्बे) में से तरह-तरह की चीज़ें निकलती हैं, जो कल्पना को उड़ान देती हैं। कुछ स्रोत
    इसे किताबों/कहानियों के पिटारे के रूप में बताते हैं। सटीक बातें यहाँ नहीं दी गई हैं और सामान्य रखी गई हैं। अभ्यास: कल्पना,
    जादू, चीज़ों के नाम, 'अगर मेरे पास ... होता'।
  explanations:
    text: 'इस पाठ में एक जादुई पिटारा है। उसे खोलते ही उसमें से नई-नई चीज़ें निकलती हैं: कहानियाँ, खिलौने, रंग और सपने। यह पाठ हमारी कल्पना को उड़ान देता है।'
    visual: 'चित्र बनाइए: एक खुला संदूक जिसमें से तारे, किताबें, खिलौने और रंग निकल रहे हों।'
    step_by_step: 1. पाठ पढ़ें। 2. पिटारे से क्या-क्या निकलता है? 3. आपको कैसा लगता है? 4. आप अपने पिटारे में क्या रखेंगे?
    real_world: 'पुस्तकालय भी एक जादुई पिटारे जैसा है: हर किताब में एक नई दुनिया।'
  picture:
    kind: flow
    steps:
    - पिटारा खुलता है
    - चीज़ें निकलती हैं
    - कल्पना जागती है
    - नई दुनिया
    alt: पिटारा खुलता है, उसमें से चीज़ें निकलती हैं, कल्पना जागती है और एक नई दुनिया दिखती है।
  activity:
    type: sort
    prompt: '''अगर मेरे पास ... होता'' : कौन-सी चीज़ सच में होती है और कौन-सी कल्पना की?'
    bins:
    - सच में होती है
    - कल्पना की चीज़
    items:
    - label: किताबों से भरा डिब्बा
      bin: सच में होती है
      clue: क्या ऐसा डिब्बा तुम्हारे घर में हो सकता है?
      why: यह सच में होता है।
    - label: रंगीन पेंसिलें
      bin: सच में होती है
      clue: क्या ये दुकान में मिलती हैं?
      why: सच की चीज़।
    - label: उड़ने वाला कालीन
      bin: कल्पना की चीज़
      clue: क्या कालीन सच में उड़ता है?
      why: यह कल्पना है।
    - label: बोलने वाला पेड़
      bin: कल्पना की चीज़
      clue: क्या पेड़ सच में बात करते हैं?
      why: कल्पना की उड़ान।
  lesson:
    - teach: '''एक जादुई पिटारा'' में एक पिटारा (डिब्बा या संदूक) है, जिसमें से तरह-तरह की चीज़ें निकलती हैं। यह हमारी कल्पना को उड़ान देता है: क्या-क्या निकल सकता है?'
      check:
        prompt: पिटारा क्या होता है?
        options:
        - एक डिब्बा या संदूक
        - एक पेड़
        - एक पक्षी
        answer: एक डिब्बा या संदूक
        why: पिटारे में चीज़ें रखी जाती हैं।
      ways:
      - style: visual
        teach: जो सच में हो सकता है, और जो सिर्फ़ कल्पना में हो सकता है।
        picture:
          kind: compare
          columns:
          - title: सच में हो सकता है
            points:
            - पिटारे में खिलौने हों
            - पिटारे में किताबें हों
          - title: सिर्फ़ कल्पना में
            points:
            - पिटारे से बात करने वाला तोता निकले
            - पिटारा उड़कर चाँद पर जाए
          alt: पिटारे में खिलौने या किताबें होना सच में हो सकता है। पिटारे से बात करने वाला तोता निकलना या पिटारे का उड़कर चाँद पर जाना सिर्फ़ कल्पना में हो सकता है।
      - style: step_by_step
        teach: 'अपना जादुई पिटारा सोचो। पहला: आँखें बंद करो। दूसरा: सोचो कि तुम्हारे सामने एक पुराना संदूक है। तीसरा: उसे धीरे से खोलो और सोचो उसमें से क्या निकला। चौथा: आँखें खोलकर उसका चित्र बनाओ और दो वाक्य लिखो।'
    - teach: 'किताबें भी जादुई पिटारे जैसी हैं: एक किताब खोलो और जंगल, समुद्र, चाँद, परियाँ सब मिल जाते हैं। कल्पना का मतलब है मन में नई चीज़ें सोचना।'
      picture:
        kind: compare
        columns:
        - title: जादुई पिटारा
          points:
          - खोलो
          - नई चीज़ें निकलें
        - title: किताब
          points:
          - खोलो
          - नई दुनिया मिले
        alt: जादुई पिटारा और किताब, दोनों नई चीज़ें देते हैं।
      check:
        prompt: किताब को जादुई पिटारा क्यों कह सकते हैं?
        options:
        - उसे खोलकर नई दुनिया मिलती है
        - वह भारी होती है
        - उसमें खिलौने होते हैं
        answer: उसे खोलकर नई दुनिया मिलती है
        why: किताब में कहानियाँ और ज्ञान छिपे होते हैं।
      ways:
      - style: step_by_step
        teach: 'किताब को जादुई पिटारे की तरह खोलो। पहला: पुस्तकालय से कोई कहानी की किताब चुनो। दूसरा: उसका चित्र देखकर सोचो कि कहानी कहाँ ले जाएगी। तीसरा: पढ़ते हुए मन में उस जगह की तस्वीर बनाओ। चौथा: दोस्तों को बताओ कि तुम कहाँ ''घूम'' आए।'
      - style: real_world
        teach: दादी-नानी की कहानियों में राजा, परियाँ और बोलने वाले जानवर आते हैं। सुनते-सुनते बच्चे मन में पूरी दुनिया बना लेते हैं, यही कल्पना है।
    - teach: 'शब्द बनाना: जादू + ई = जादुई, रंग + ईन = रंगीन, भारत + ईय = भारतीय। ''उत्सुक'' यानी कुछ जानने के लिए बेचैन।'
      check:
        prompt: '''रंग'' से बना शब्द कौन-सा है?'
        options:
        - रंगीन
        - रंगना नहीं
        - रगड़
        answer: रंगीन
        why: रंग + ईन = रंगीन।
      ways:
      - style: visual
        teach: शब्द के अंत में कुछ जोड़कर नए शब्द कैसे बनते हैं।
        picture:
          kind: compare
          columns:
          - title: + ई
            points:
            - गुलाब + ई = गुलाबी
            - पहाड़ + ई = पहाड़ी
          - title: + ईन
            points:
            - नमक + ईन = नमकीन
            - रंग + ईन = रंगीन
          - title: + ईय
            points:
            - राष्ट्र + ईय = राष्ट्रीय
          alt: गुलाब में ई जोड़ने से गुलाबी बनता है, और पहाड़ से पहाड़ी। नमक में ईन जोड़ने से नमकीन, और रंग से रंगीन। राष्ट्र में ईय जोड़ने से राष्ट्रीय बनता है।
      - style: real_world
        teach: मिठाई की दुकान पर 'नमकीन' और 'मीठा' अलग-अलग रखे जाते हैं। 'नमकीन' शब्द 'नमक' से बना है, यानी जिसमें नमक हो।
  items:
  - prompt: '''पिटारा'' का अर्थ है:'
    options:
    - डिब्बा / संदूक
    - पेड़
    - नदी
    - पहाड़
    answer: डिब्बा / संदूक
    difficulty: 1
    hints:
    - जिसमें चीज़ें रखते हैं।
    - बक्सा।
    solution: पिटारा यानी डिब्बा या संदूक।
    mistakes:
      पेड़: hin3_word
  - prompt: '''जादुई'' का अर्थ है:'
    options:
    - जिसमें जादू हो
    - बहुत पुराना
    - टूटा हुआ
    - छोटा
    answer: जिसमें जादू हो
    difficulty: 1
    hints:
    - जादू से जुड़ा।
    - हैरान करने वाला।
    solution: जादुई यानी जिसमें जादू हो।
    mistakes: {"बहुत पुराना": "h3_ee_pratyay", "टूटा हुआ": "h3_ee_pratyay", "छोटा": "h3_ee_pratyay"}
  - prompt: यह पाठ हमें किस ओर ले जाता है?
    options:
    - कल्पना की दुनिया
    - गणित के सवाल
    - बाज़ार
    - अस्पताल
    answer: कल्पना की दुनिया
    difficulty: 2
    hints:
    - जादू, सपने।
    - सोचने की उड़ान।
    solution: यह कल्पना की दुनिया में ले जाता है।
    mistakes:
      बाज़ार: hin3_read_again
  - prompt: कौन-सी चीज़ भी जादुई पिटारे जैसी है?
    options:
    - पुस्तकालय की किताबें
    - खाली डिब्बा
    - टूटी कुर्सी
    - कूड़ा
    answer: पुस्तकालय की किताबें
    difficulty: 2
    hints:
    - हर किताब में नई दुनिया।
    - पढ़ना।
    solution: किताबें भी जादुई पिटारे जैसी हैं।
    mistakes: {"खाली डिब्बा": "h3_pitara", "टूटी कुर्सी": "h3_pitara", "कूड़ा": "h3_pitara"}
  - prompt: '''पिटारा'' का बहुवचन है:'
    options:
    - पिटारे
    - पिटारा
    - पिटारियाँ
    - पिटारो
    answer: पिटारे
    difficulty: 2
    hints:
    - आ से ए।
    - एक घोड़ा, दो घोड़े।
    solution: एक पिटारा, दो पिटारे।
    mistakes: {"पिटारा": "h2_bahuvachan", "पिटारियाँ": "h2_bahuvachan", "पिटारो": "h2_bahuvachan"}
  - prompt: पिटारा खोलते समय मन कैसा होता है?
    options:
    - उत्सुक
    - दुखी
    - गुस्से से भरा
    - डरा हुआ ही
    answer: उत्सुक
    difficulty: 1
    hints:
    - अंदर क्या है?
    - जानने की इच्छा।
    solution: मन उत्सुक होता है।
    mistakes: {"दुखी": "h3_utsuk", "गुस्से से भरा": "h3_utsuk", "डरा हुआ ही": "h3_utsuk"}
  - prompt: अगर तुम्हारे पास जादुई पिटारा हो, तो इनमें से कौन-सी बात कल्पना है?
    options:
    - उसमें से उड़ने वाला घोड़ा निकले
    - उसमें किताबें रखी हों
    - उसे ढक्कन से बंद करें
    answer: उसमें से उड़ने वाला घोड़ा निकले
    difficulty: 1
    hints:
    - दो बातें सच में हो सकती हैं।
    - क्या घोड़े उड़ते हैं?
    solution: 'चरण 1: किताबें रखना, ढक्कन बंद करना सच हैं। चरण 2: उड़ता घोड़ा कल्पना है।'
    mistakes:
      उसमें किताबें रखी हों: c3h11_kalpana
      उसे ढक्कन से बंद करें: c3h11_kalpana
  - prompt: '''कल्पना'' का अर्थ है:'
    options:
    - मन में नई बातें सोचना
    - सो जाना
    - भूल जाना
    answer: मन में नई बातें सोचना
    difficulty: 1
    hints:
    - जादुई पिटारा किसे उड़ान देता है?
    - मन की उड़ान।
    solution: 'चरण 1: कल्पना मन में होती है। चरण 2: नई बातें सोचना।'
    mistakes:
      सो जाना: c3h11_shabd
      भूल जाना: c3h11_shabd
  - prompt: '''भारत'' में ''ईय'' जोड़ने पर कौन-सा शब्द बनेगा?'
    options:
    - भारतीय
    - भारती
    - भारतक
    answer: भारतीय
    difficulty: 2
    hints:
    - भारत का रहने वाला।
    - भारत + ईय।
    solution: 'चरण 1: भारत + ईय। चरण 2: भारतीय।'
    mistakes:
      भारती: c3h11_pratyay
      भारतक: c3h11_pratyay
  - prompt: '''खोलना'' का उलटा क्या है?'
    options:
    - बंद करना
    - देखना
    - रखना
    answer: बंद करना
    difficulty: 1
    hints:
    - पिटारे के ढक्कन के साथ क्या करते हैं?
    - खुला का उलटा।
    solution: 'चरण 1: खोलना एक काम है। चरण 2: उलटा बंद करना।'
    mistakes:
      देखना: c3h11_shabd
      रखना: c3h11_shabd
  - prompt: पिटारे में 3 कहानी की किताबें और 4 कविता की किताबें हैं। कुल कितनी किताबें?
    answer: '7'
    check: 3+4
    difficulty: 1
    hints:
    - दोनों तरह की किताबें जोड़ो।
    - 3 + 4।
    solution: 'चरण 1: 3 + 4। चरण 2: = 7 किताबें।'
    mistakes:
      '1': c3h11_kalpana
      '12': c3h11_kalpana
  - prompt: '''उत्सुक'' बच्चा क्या करता है?'
    options:
    - नई बातें जानने के लिए सवाल पूछता है
    - हर बात से ऊब जाता है
    - आँखें बंद रखता है
    answer: नई बातें जानने के लिए सवाल पूछता है
    difficulty: 2
    hints:
    - उत्सुक यानी जानने को बेचैन।
    - वह क्या करेगा?
    solution: 'चरण 1: उत्सुक बच्चा जानना चाहता है। चरण 2: इसलिए सवाल पूछता है।'
    mistakes:
      हर बात से ऊब जाता है: c3h11_shabd
      आँखें बंद रखता है: c3h11_shabd
  - prompt: पुस्तकालय में क्या होता है?
    options:
    - बहुत सारी किताबें
    - बहुत सारे खिलौने
    - बहुत सारे जानवर
    answer: बहुत सारी किताबें
    difficulty: 1
    hints:
