subject: cbse3-hin
chapter: 11
title: एक जादुई पिटारा
tips:
  h3_ee_pratyay: "शब्द को तोड़ो: जादू + ई। जैसे 'रंग + ईन' में रंग होता है, वैसे ही इसमें क्या होगा?"
  h3_pitara: "जादुई पिटारा खोलो तो हर बार कुछ नया निकलता है। किस चीज़ को खोलने पर हर बार नई दुनिया मिलती है?"
  h3_utsuk: "बंद डिब्बे में क्या है, यह जानने की जल्दी कैसी लगती है? उस भाव का नाम सोचो।"

concepts:
- code: cbse3h.v4.pitara
  title: एक जादुई पिटारा
  notes: |
    'जादुई पिटारा' पर पाठ/कविता: एक पिटारे (डिब्बे) में से तरह-तरह की चीज़ें निकलती हैं, जो कल्पना को उड़ान देती हैं। कुछ स्रोत
    इसे किताबों/कहानियों के पिटारे के रूप में बताते हैं। सटीक बातें यहाँ नहीं दी गई हैं और सामान्य रखी गई हैं। अभ्यास: कल्पना,
    जादू, चीज़ों के नाम, 'अगर मेरे पास ... होता'।
  explanations:
    text: 'इस पाठ में एक जादुई पिटारा है। उसे खोलते ही उसमें से नई-नई चीज़ें निकलती हैं: कहानियाँ, खिलौने, रंग और सपने। यह पाठ हमारी कल्पना को उड़ान देता है।'
    visual: 'चित्र बनाइए: एक खुला संदूक जिसमें से तारे, किताबें, खिलौने और रंग निकल रहे हों।'
    step_by_step: 1. पाठ पढ़ें। 2. पिटारे से क्या-क्या निकलता है? 3. आपको कैसा लगता है? 4. आप अपने पिटारे में क्या रखेंगे?
    real_world: 'पुस्तकालय भी एक जादुई पिटारे जैसा है: हर किताब में एक नई दुनिया।'
  picture:
    kind: flow
    steps:
    - पिटारा खुलता है
    - चीज़ें निकलती हैं
    - कल्पना जागती है
    - नई दुनिया
    alt: पिटारा खुलता है, उसमें से चीज़ें निकलती हैं, कल्पना जागती है और एक नई दुनिया दिखती है।
  activity:
    type: sort
    prompt: '''अगर मेरे पास ... होता'' : कौन-सी चीज़ सच में होती है और कौन-सी कल्पना की?'
    bins:
    - सच में होती है
    - कल्पना की चीज़
    items:
    - label: किताबों से भरा डिब्बा
      bin: सच में होती है
      clue: क्या ऐसा डिब्बा तुम्हारे घर में हो सकता है?
      why: यह सच में होता है।
    - label: रंगीन पेंसिलें
      bin: सच में होती है
      clue: क्या ये दुकान में मिलती हैं?
      why: सच की चीज़।
    - label: उड़ने वाला कालीन
      bin: कल्पना की चीज़
      clue: क्या कालीन सच में उड़ता है?
      why: यह कल्पना है।
    - label: बोलने वाला पेड़
      bin: कल्पना की चीज़
      clue: क्या पेड़ सच में बात करते हैं?
      why: कल्पना की उड़ान।
  items:
  - prompt: '''पिटारा'' का अर्थ है:'
    options:
    - डिब्बा / संदूक
    - पेड़
    - नदी
    - पहाड़
    answer: डिब्बा / संदूक
    difficulty: 1
    hints:
    - जिसमें चीज़ें रखते हैं।
    - बक्सा।
    solution: पिटारा यानी डिब्बा या संदूक।
    mistakes:
      पेड़: hin3_word
  - prompt: '''जादुई'' का अर्थ है:'
    options:
    - जिसमें जादू हो
    - बहुत पुराना
    - टूटा हुआ
    - छोटा
    answer: जिसमें जादू हो
    difficulty: 1
    hints:
    - जादू से जुड़ा।
    - हैरान करने वाला।
    solution: जादुई यानी जिसमें जादू हो।
    mistakes: {"बहुत पुराना": "h3_ee_pratyay", "टूटा हुआ": "h3_ee_pratyay", "छोटा": "h3_ee_pratyay"}
  - prompt: यह पाठ हमें किस ओर ले जाता है?
    options:
    - कल्पना की दुनिया
    - गणित के सवाल
    - बाज़ार
    - अस्पताल
    answer: कल्पना की दुनिया
    difficulty: 2
    hints:
    - जादू, सपने।
    - सोचने की उड़ान।
    solution: यह कल्पना की दुनिया में ले जाता है।
    mistakes:
      बाज़ार: hin3_read_again
  - prompt: कौन-सी चीज़ भी जादुई पिटारे जैसी है?
    options:
    - पुस्तकालय की किताबें
    - खाली डिब्बा
    - टूटी कुर्सी
    - कूड़ा
    answer: पुस्तकालय की किताबें
    difficulty: 2
    hints:
    - हर किताब में नई दुनिया।
    - पढ़ना।
    solution: किताबें भी जादुई पिटारे जैसी हैं।
    mistakes: {"खाली डिब्बा": "h3_pitara", "टूटी कुर्सी": "h3_pitara", "कूड़ा": "h3_pitara"}
  - prompt: '''पिटारा'' का बहुवचन है:'
    options:
    - पिटारे
    - पिटारा
    - पिटारियाँ
    - पिटारो
    answer: पिटारे
    difficulty: 2
    hints:
    - आ से ए।
    - एक घोड़ा, दो घोड़े।
    solution: एक पिटारा, दो पिटारे।
    mistakes: {"पिटारा": "h2_bahuvachan", "पिटारियाँ": "h2_bahuvachan", "पिटारो": "h2_bahuvachan"}
  - prompt: पिटारा खोलते समय मन कैसा होता है?
    options:
    - उत्सुक
    - दुखी
    - गुस्से से भरा
    - डरा हुआ ही
    answer: उत्सुक
    difficulty: 1
    hints:
    - अंदर क्या है?
    - जानने की इच्छा।
    solution: मन उत्सुक होता है।
    mistakes: {"दुखी": "h3_utsuk", "गुस्से से भरा": "h3_utsuk", "डरा हुआ ही": "h3_utsuk"}
