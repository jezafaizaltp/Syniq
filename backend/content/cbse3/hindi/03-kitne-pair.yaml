subject: cbse3-hin
chapter: 3
title: कितने पैर?
tips:
  h3_bina_pair: "हर जानवर के चलने का तरीका सोचो। कौन-सा जीव पेट के बल ज़मीन पर सरकता है?"
  h3_pakshi_pair: "पक्षी के दो हिस्से ज़मीन पर, दो हवा में: पंख उड़ने के लिए, बाकी चलने के लिए।"

concepts:
- code: cbse3h.v1.pair
  title: कितने पैर?
  notes: |
    जानवरों और जीवों के पैरों की गिनती पर पाठ: मनुष्य और पक्षी 2 पैर, गाय-कुत्ता-बिल्ली 4 पैर, कीड़े 6 पैर, मकड़ी 8 पैर,
    साँप और मछली के पैर नहीं। (ठीक पाठ यहाँ नहीं दिया गया है।) अभ्यास: गिनती, जानवरों के नाम, प्रश्न पूछना।
  explanations:
    text: अलग-अलग जीवों के अलग-अलग पैर होते हैं। हमारे और चिड़िया के 2 पैर हैं, गाय और कुत्ते के 4, चींटी के 6, मकड़ी के 8, और साँप के पैर ही नहीं होते!
    visual: 'चित्र बनाइए: एक मुर्गी, एक गाय, एक चींटी और एक मकड़ी, और हर एक के नीचे पैरों की गिनती लिखिए।'
    step_by_step: '1. जीव को देखें। 2. उसके पैर गिनें। 3. संख्या लिखें। 4. तुलना करें: किसके सबसे ज़्यादा पैर?'
    real_world: मकड़ी को कीड़ा समझा जाता है, पर उसके 8 पैर होते हैं, कीड़ों के 6।
  picture:
    kind: compare
    columns:
    - title: जीव
      points:
      - मुर्गी
      - गाय
      - मकड़ी
    - title: पैर
      points:
      - '2'
      - '4'
      - '8'
    alt: मुर्गी के 2, गाय के 4 और मकड़ी के 8 पैर होते हैं।
  items:
  - prompt: गाय के कितने पैर होते हैं?
    options:
    - चार
    - दो
    - छह
    - आठ
    answer: चार
    difficulty: 1
    hints:
    - गिनें।
    - कुत्ते जितने।
    solution: गाय के चार पैर होते हैं।
    mistakes: {"दो": "h1_pair", "छह": "h1_pair", "आठ": "h1_pair"}
  - prompt: चिड़िया के कितने पैर होते हैं?
    options:
    - दो
    - चार
    - छह
    - एक भी नहीं
    answer: दो
    difficulty: 1
    hints:
    - हमारे जितने।
    - दो।
    solution: चिड़िया के दो पैर होते हैं।
    mistakes: {"चार": "h3_pakshi_pair", "छह": "h3_pakshi_pair", "एक भी नहीं": "h3_pakshi_pair"}
  - prompt: किसके पैर नहीं होते?
    options:
    - साँप
    - बिल्ली
    - बकरी
    - मोर
    answer: साँप
    difficulty: 1
    hints:
    - रेंगता है।
    - लंबा शरीर।
    solution: साँप के पैर नहीं होते।
    mistakes: {"बिल्ली": "h3_bina_pair", "बकरी": "h3_bina_pair", "मोर": "h3_bina_pair"}
  - prompt: मकड़ी के कितने पैर होते हैं?
    options:
    - आठ
    - छह
    - चार
    - दो
    answer: आठ
    difficulty: 2
    hints:
    - कीड़ों से दो ज़्यादा।
    - आठ।
    solution: मकड़ी के आठ पैर होते हैं।
    mistakes:
      छह: hin3_read_again
  - prompt: चींटी के कितने पैर होते हैं?
    options:
    - छह
    - आठ
    - चार
    - दो
    answer: छह
    difficulty: 2
    hints:
    - कीड़ों के छह पैर।
    - तीन जोड़े।
    solution: चींटी के छह पैर होते हैं।
    mistakes: {"आठ": "h2_keet_pair", "चार": "h2_keet_pair", "दो": "h2_keet_pair"}
  - prompt: '''पैर'' का एक और शब्द है:'
    options:
    - पाँव
    - हाथ
    - सिर
    - आँख
    answer: पाँव
    difficulty: 2
    hints:
    - जिससे हम चलते हैं।
    - समान अर्थ।
    solution: पैर को पाँव भी कहते हैं।
    mistakes:
      हाथ: hin3_word
