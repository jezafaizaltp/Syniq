subject: cbse3-hin
chapter: 3
title: कितने पैर?
tips:
  h3_bina_pair: "हर जानवर के चलने का तरीका सोचो। कौन-सा जीव पेट के बल ज़मीन पर सरकता है?"
  h3_pakshi_pair: "पक्षी के दो हिस्से ज़मीन पर, दो हवा में: पंख उड़ने के लिए, बाकी चलने के लिए।"
  c3h3_pair: उस जीव को चलते हुए सोचो। वह किन चीज़ों पर खड़ा होता है? एक-एक गिनो।
  c3h3_jod: हर जीव के पैर अलग-अलग गिनकर फिर जोड़ो।
  c3h3_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v1.pair
  title: कितने पैर?
  notes: |
    जानवरों और जीवों के पैरों की गिनती पर पाठ: मनुष्य और पक्षी 2 पैर, गाय-कुत्ता-बिल्ली 4 पैर, कीड़े 6 पैर, मकड़ी 8 पैर,
    साँप और मछली के पैर नहीं। (ठीक पाठ यहाँ नहीं दिया गया है।) अभ्यास: गिनती, जानवरों के नाम, प्रश्न पूछना।
  explanations:
    text: अलग-अलग जीवों के अलग-अलग पैर होते हैं। हमारे और चिड़िया के 2 पैर हैं, गाय और कुत्ते के 4, चींटी के 6, मकड़ी के 8, और साँप के पैर ही नहीं होते!
    visual: 'चित्र बनाइए: एक मुर्गी, एक गाय, एक चींटी और एक मकड़ी, और हर एक के नीचे पैरों की गिनती लिखिए।'
    step_by_step: '1. जीव को देखें। 2. उसके पैर गिनें। 3. संख्या लिखें। 4. तुलना करें: किसके सबसे ज़्यादा पैर?'
    real_world: मकड़ी को कीड़ा समझा जाता है, पर उसके 8 पैर होते हैं, कीड़ों के 6।
  picture:
    kind: compare
    columns:
    - title: जीव
      points:
      - मुर्गी
      - गाय
      - मकड़ी
    - title: पैर
      points:
      - '2'
      - '4'
      - '8'
    alt: मुर्गी के 2, गाय के 4 और मकड़ी के 8 पैर होते हैं।
  activity:
    type: sort
    prompt: किसके कितने पैर?
    bins:
    - 2 पैर
    - 4 पैर
    - 6 पैर
    - 8 पैर
    - पैर नहीं
    items:
    - label: मनुष्य
      bin: 2 पैर
      clue: अपने पैर गिनो।
      why: मनुष्य के 2 पैर।
    - label: कबूतर
      bin: 2 पैर
      clue: पक्षी के कितने पैर?
      why: पक्षी के 2 पैर।
    - label: गाय
      bin: 4 पैर
      clue: गाय के पैर गिनो।
      why: 4 पैर।
    - label: चींटी
      bin: 6 पैर
      clue: कीड़ों के कितने पैर?
      why: कीड़ों के 6 पैर।
    - label: मकड़ी
      bin: 8 पैर
      clue: मकड़ी कीड़ों से ज़्यादा पैर वाली?
      why: मकड़ी के 8 पैर।
    - label: साँप
      bin: पैर नहीं
      clue: साँप कैसे चलता है?
      why: साँप रेंगता है, पैर नहीं।
    - label: मछली
      bin: पैर नहीं
      clue: मछली किससे तैरती है?
      why: पंखों से तैरती है, पैर नहीं।
  lesson:
    - teach: '''कितने पैर?'' पाठ में जीवों के पैर गिनते हैं। मनुष्य और पक्षी दो पैरों पर चलते हैं। गाय, कुत्ता, बिल्ली, बकरी चार पैरों पर चलते हैं।'
      picture:
        kind: compare
        columns:
        - title: 2 पैर
          points:
          - मनुष्य
          - मुर्गी
          - मोर
        - title: 4 पैर
          points:
          - गाय
          - कुत्ता
          - बिल्ली
        alt: दो पैर और चार पैर वाले जीव।
      check:
        prompt: बकरी के कितने पैर होते हैं?
        options:
        - चार
        - दो
        - छह
        answer: चार
        why: बकरी गाय की तरह चार पैरों पर चलती है।
    - teach: 'कीड़ों के छह पैर होते हैं: चींटी, मक्खी, तितली। मकड़ी कीड़ा नहीं है, उसके आठ पैर होते हैं। साँप, मछली और केंचुए के पैर नहीं होते।'
      check:
        prompt: तितली के कितने पैर होते हैं?
        options:
        - छह
        - आठ
        - दो
        answer: छह
        why: तितली कीड़ा है, और कीड़ों के छह पैर होते हैं।
    - teach: '''पैर'' को ''पाँव'' भी कहते हैं। सवाल पूछने के लिए ''कितने'' शब्द आता है: ''कुत्ते के कितने पैर हैं?'''
      check:
        prompt: गिनती पूछने के लिए कौन-सा शब्द आता है?
        options:
        - कितने
        - कहाँ
        - कब
        answer: कितने
        why: '''कितने'' से संख्या पूछते हैं।'
  items:
  - prompt: गाय के कितने पैर होते हैं?
    options:
    - चार
    - दो
    - छह
    - आठ
    answer: चार
    difficulty: 1
    hints:
    - गिनें।
    - कुत्ते जितने।
    solution: गाय के चार पैर होते हैं।
    mistakes: {"दो": "h1_pair", "छह": "h1_pair", "आठ": "h1_pair"}
  - prompt: चिड़िया के कितने पैर होते हैं?
    options:
    - दो
    - चार
    - छह
    - एक भी नहीं
    answer: दो
    difficulty: 1
    hints:
    - हमारे जितने।
    - दो।
    solution: चिड़िया के दो पैर होते हैं।
    mistakes: {"चार": "h3_pakshi_pair", "छह": "h3_pakshi_pair", "एक भी नहीं": "h3_pakshi_pair"}
  - prompt: किसके पैर नहीं होते?
    options:
    - साँप
    - बिल्ली
    - बकरी
    - मोर
    answer: साँप
    difficulty: 1
    hints:
    - रेंगता है।
    - लंबा शरीर।
    solution: साँप के पैर नहीं होते।
    mistakes: {"बिल्ली": "h3_bina_pair", "बकरी": "h3_bina_pair", "मोर": "h3_bina_pair"}
  - prompt: मकड़ी के कितने पैर होते हैं?
    options:
    - आठ
    - छह
    - चार
    - दो
    answer: आठ
    difficulty: 2
    hints:
    - कीड़ों से दो ज़्यादा।
    - आठ।
    solution: मकड़ी के आठ पैर होते हैं।
    mistakes:
      छह: hin3_read_again
  - prompt: चींटी के कितने पैर होते हैं?
    options:
    - छह
    - आठ
    - चार
    - दो
    answer: छह
    difficulty: 2
    hints:
    - कीड़ों के छह पैर।
    - तीन जोड़े।
    solution: चींटी के छह पैर होते हैं।
    mistakes: {"आठ": "h2_keet_pair", "चार": "h2_keet_pair", "दो": "h2_keet_pair"}
  - prompt: '''पैर'' का एक और शब्द है:'
    options:
    - पाँव
    - हाथ
    - सिर
    - आँख
    answer: पाँव
    difficulty: 2
    hints:
    - जिससे हम चलते हैं।
    - समान अर्थ।
    solution: पैर को पाँव भी कहते हैं।
    mistakes:
      हाथ: hin3_word
  - prompt: मुर्गी के कितने पैर होते हैं?
    options:
    - दो
    - चार
    - छह
    answer: दो
    difficulty: 1
    hints:
    - मुर्गी एक पक्षी है।
    - पक्षी किस पर चलते हैं?
    solution: 'चरण 1: मुर्गी पक्षी है। चरण 2: पक्षियों के दो पैर होते हैं।'
    mistakes:
      चार: c3h3_pair
      छह: c3h3_pair
  - prompt: दो गायों के कुल कितने पैर होंगे?
    answer: '8'
    check: 4*2
    difficulty: 2
    hints:
    - एक गाय के 4 पैर।
    - 4 + 4।
    solution: 'चरण 1: 4 + 4। चरण 2: = 8 पैर।'
    mistakes:
      '4': c3h3_jod
      '6': c3h3_jod
  - prompt: इनमें से किस जीव के पैर नहीं होते?
    options:
    - मछली
    - मेंढक
    - बिल्ली
    answer: मछली
    difficulty: 1
    hints:
    - कौन तैरता है, चलता नहीं?
    - उसके पंख जैसे भाग होते हैं।
    solution: 'चरण 1: मेंढक और बिल्ली पैरों पर चलते हैं। चरण 2: मछली के पैर नहीं होते।'
    mistakes:
      मेंढक: c3h3_pair
      बिल्ली: c3h3_pair
  - prompt: एक मकड़ी और एक चींटी के कुल कितने पैर?
    answer: '14'
    check: 8+6
    difficulty: 3
    hints:
    - मकड़ी के 8, चींटी के 6।
    - दोनों जोड़ो।
    solution: 'चरण 1: 8 + 6। चरण 2: = 14 पैर।'
    mistakes:
      '12': c3h3_jod
      '16': c3h3_jod
  - prompt: '''पाँव'' का समान अर्थ वाला शब्द है:'
    options:
    - पैर
    - हाथ
    - सिर
    answer: पैर
    difficulty: 1
    hints:
    - हम किस पर चलते हैं?
    - हाथ और सिर अलग अंग हैं।
    solution: 'चरण 1: पाँव से हम चलते हैं। चरण 2: उसका दूसरा नाम पैर।'
    mistakes:
      हाथ: c3h3_shabd
      सिर: c3h3_shabd
  - prompt: तुम्हारे और तुम्हारे दोस्त के कुल कितने पैर?
    answer: '4'
    check: 2+2
    difficulty: 1
    hints:
    - हर इंसान के 2 पैर।
    - 2 + 2।
    solution: 'चरण 1: 2 + 2। चरण 2: = 4 पैर।'
    mistakes:
      '2': c3h3_jod
      '8': c3h3_jod
  - prompt: केंचुआ कैसे चलता है?
    options:
    - रेंगकर
    - दौड़कर
    - उड़कर
    answer: रेंगकर
    difficulty: 2
    hints:
    - उसके पैर नहीं होते।
    - वह ज़मीन पर सरकता है।
    solution: 'चरण 1: केंचुए के पैर नहीं होते। चरण 2: वह रेंगकर चलता है।'
    mistakes:
      दौड़कर: c3h3_pair
      उड़कर: c3h3_pair
  - prompt: सही प्रश्न वाक्य चुनो।
    options:
    - बिल्ली के कितने पैर हैं?
    - बिल्ली के कितने पैर हैं।
    - कितने बिल्ली पैर हैं
    answer: बिल्ली के कितने पैर हैं?
    difficulty: 2
    hints:
    - प्रश्न के अंत में कौन-सा चिह्न लगता है?
    - शब्दों का क्रम भी देखो।
    solution: 'चरण 1: प्रश्न के अंत में ''?'' लगता है। चरण 2: क्रम: बिल्ली के कितने पैर हैं?'
    mistakes:
      बिल्ली के कितने पैर हैं।: c3h3_shabd
      कितने बिल्ली पैर हैं: c3h3_shabd
  - prompt: 3 कुत्तों के कुल कितने पैर होंगे?
    answer: '12'
    check: 4*3
    difficulty: 2
    hints:
    - एक कुत्ते के 4 पैर।
    - 4 को 3 बार जोड़ो।
    solution: 'चरण 1: 4 + 4 + 4। चरण 2: = 12 पैर।'
    mistakes:
      '7': c3h3_jod
      '8': c3h3_jod
