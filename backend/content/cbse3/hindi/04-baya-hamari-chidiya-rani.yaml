subject: cbse3-hin
chapter: 4
title: बया हमारी चिड़िया रानी
tips:
  h3_baya: "बया को 'बुनकर पक्षी' कहते हैं। बुनकर क्या बनाता है? बया अपने लिए क्या बुनती है?"
  h3_baya_chonch: "चिड़िया के हाथ नहीं होते। वह दाना किससे उठाती है? उसी से धागे गूँथती है।"
  h3_baya_saman: "छोटी चिड़िया भारी ईंट-पत्थर नहीं उठा सकती। खेत से वह कौन-सी हल्की, लंबी चीज़ें चुनती है?"
  c3h4_ghonsla: बया के लटकते घोंसले को याद करो। वह किससे और कैसे बनता है?
  c3h4_ling: "पुल्लिंग शब्द के अंत में क्या जोड़ने या बदलने से स्त्रीलिंग बनता है? शेर-शेरनी जैसी जोड़ी से मिलाकर देखो।"
  c3h4_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse3h.v2.baya
  title: बया हमारी चिड़िया रानी
  notes: |
    बया पक्षी पर कविता। बया (वीवर बर्ड) घास और तिनकों से लटकता हुआ, बुना हुआ सुंदर घोंसला बनाती है, इसलिए उसे बुनकर पक्षी
    कहते हैं। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: पक्षियों के नाम, घोंसला, कारीगरी, लगन।
  explanations:
    text: बया एक छोटी चिड़िया है जो सबसे सुंदर घोंसला बनाती है। वह घास के तिनकों को बुनकर लटकता हुआ घोंसला बनाती है, इसलिए उसे बुनकर चिड़िया भी कहते हैं।
    visual: 'चित्र बनाइए: पेड़ की डाल से लटकता बोतल जैसा घोंसला और उसके पास पीली-भूरी बया।'
    step_by_step: 1. कविता पढ़ें। 2. बया क्या बनाती है? 3. किससे बनाती है? 4. हम बया से क्या सीखें?
    real_world: बया के घोंसले अक्सर पानी के ऊपर झुकी डालियों पर लटके दिखते हैं, ताकि साँप न पहुँच सकें।
  picture:
    kind: flow
    steps:
    - तिनके लाती है
    - चोंच से बुनती है
    - लटकता घोंसला बनता है
    - उसमें अंडे देती है
    alt: बया तिनके लाती है, चोंच से बुनती है, लटकता घोंसला बनता है और वह उसमें अंडे देती है।
  activity:
    type: order
    prompt: बया अपना घोंसला कैसे बनाती है? क्रम से लगाओ।
    steps:
    - घास और तिनके इकट्ठा करती है
    - तिनकों को बुनती है
    - लटकता हुआ घोंसला तैयार
    reasons:
      तिनकों को बुनती है: बुनने के लिए पहले तिनके चाहिए।
      लटकता हुआ घोंसला तैयार: बुनाई पूरी होने पर घोंसला बनता है।
  lesson:
    - teach: '''बया हमारी चिड़िया रानी'' कविता बया पक्षी के बारे में है। बया छोटी-सी चिड़िया है जो बहुत सुंदर घोंसला बुनती है, इसलिए उसे बुनकर पक्षी कहते हैं।'
      check:
        prompt: बया को बुनकर पक्षी क्यों कहते हैं?
        options:
        - वह घोंसला बुनती है
        - वह कपड़े सिलती है
        - वह गाना गाती है
        answer: वह घोंसला बुनती है
        why: बया तिनकों को बुनकर घोंसला बनाती है।
    - teach: बया एक-एक तिनका और घास चोंच में लाती है, फिर चोंच से गाँठें लगाकर बुनती है। उसका घोंसला पेड़ की डाल से लटकता है, ताकि साँप जैसे दुश्मन आसानी से न पहुँचें।
      picture:
        kind: flow
        steps:
        - तिनके और घास लाना
        - चोंच से बुनना
        - डाल से लटकाना
        - अंडे सुरक्षित
        alt: बया का घोंसला बनाने का क्रम।
      check:
        prompt: बया अपना घोंसला किससे बुनती है?
        options:
        - चोंच से
        - पूँछ से
        - पंजों से नहीं, पंखों से
        answer: चोंच से
        why: चोंच ही बया की सुई जैसी है।
    - teach: 'कविता लगन की सीख देती है: धीरे-धीरे, मन लगाकर काम करने से सुंदर चीज़ बनती है। शब्द-ज्ञान: रानी-राजा, चिड़िया-चिड़ा (स्त्रीलिंग-पुल्लिंग)।'
      check:
        prompt: बया से क्या सीख मिलती है?
        options:
        - लगन से काम करना
        - जल्दी में काम बिगाड़ना
        - काम छोड़ देना
        answer: लगन से काम करना
        why: बया बहुत धैर्य से घोंसला बनाती है।
  items:
  - prompt: बया किस चीज़ के लिए प्रसिद्ध है?
    options:
    - सुंदर बुना हुआ घोंसला
    - तेज़ दौड़
    - ज़ोर की आवाज़
    - पानी में तैरना
    answer: सुंदर बुना हुआ घोंसला
    difficulty: 1
    hints:
    - कविता का विषय।
    - बुनकर पक्षी।
    solution: बया अपने सुंदर घोंसले के लिए प्रसिद्ध है।
    mistakes: {"तेज़ दौड़": "h3_baya", "ज़ोर की आवाज़": "h3_baya", "पानी में तैरना": "h3_baya"}
  - prompt: बया घोंसला किससे बनाती है?
    options:
    - घास और तिनकों से
    - ईंटों से
    - प्लास्टिक से
    - पत्थरों से
    answer: घास और तिनकों से
    difficulty: 1
    hints:
    - पेड़-पौधों से।
    - पतली घास।
    solution: घास और तिनकों से।
    mistakes: {"ईंटों से": "h3_baya_saman", "प्लास्टिक से": "h3_baya_saman", "पत्थरों से": "h3_baya_saman"}
  - prompt: बया का घोंसला कैसा होता है?
    options:
    - लटकता हुआ
    - ज़मीन में गड्ढा
    - पानी के नीचे
    - चपटा पत्थर
    answer: लटकता हुआ
    difficulty: 2
    hints:
    - डाल से झूलता है।
    - बोतल जैसा।
    solution: बया का घोंसला लटकता हुआ होता है।
    mistakes:
      ज़मीन में गड्ढा: hin3_read_again
  - prompt: बया घोंसला किससे बुनती है?
    options:
    - अपनी चोंच से
    - हाथों से
    - सुई से
    - मशीन से
    answer: अपनी चोंच से
    difficulty: 2
    hints:
    - पक्षी के हाथ नहीं होते।
    - चोंच।
    solution: बया चोंच से बुनती है।
    mistakes: {"हाथों से": "h3_baya_chonch", "सुई से": "h3_baya_chonch", "मशीन से": "h3_baya_chonch"}
  - prompt: '''रानी'' का पुल्लिंग क्या है?'
    options:
    - राजा
    - रानीजी
    - राजकुमारी
    - महल
    answer: राजा
    difficulty: 1
    hints:
    - रानी का पति।
    - पुरुष।
    solution: रानी का पुल्लिंग राजा है।
    mistakes:
      राजकुमारी: hin3_word
  - prompt: बया से हमें क्या सीख मिलती है?
    options:
    - लगन और मेहनत से सुंदर काम करना
    - जल्दी हार मान लेना
    - दूसरों का घर तोड़ना
    - कुछ न करना
    answer: लगन और मेहनत से सुंदर काम करना
    difficulty: 2
    hints:
    - घोंसला बनाने में बहुत समय लगता है।
    - धैर्य।
    solution: लगन और मेहनत से काम करना।
    mistakes:
      जल्दी हार मान लेना: hin3_lesson
  - prompt: बया का घोंसला लटकता हुआ क्यों होता है?
    options:
    - ताकि दुश्मन आसानी से न पहुँच सकें
    - ताकि बारिश अंदर आए
    - ताकि वह जल्दी गिर जाए
    answer: ताकि दुश्मन आसानी से न पहुँच सकें
    difficulty: 2
    hints:
    - साँप पेड़ पर चढ़ सकता है।
    - पतली डाल से लटकी चीज़ तक पहुँचना आसान है क्या?
    solution: 'चरण 1: लटकता घोंसला पतली डाल पर होता है। चरण 2: वहाँ तक दुश्मन नहीं पहुँच पाते।'
    mistakes:
      ताकि बारिश अंदर आए: c3h4_ghonsla
      ताकि वह जल्दी गिर जाए: c3h4_ghonsla
  - prompt: '''मोर'' का स्त्रीलिंग क्या है?'
    options:
    - मोरनी
    - मोरी
    - मोरा
    answer: मोरनी
    difficulty: 1
    hints:
    - जैसे शेर से शेरनी।
    - '''नी'' जोड़ो।'
    solution: 'चरण 1: मोर + नी। चरण 2: मोरनी।'
    mistakes:
      मोरी: c3h4_ling
      मोरा: c3h4_ling
  - prompt: '''घोंसला'' किसका घर है?'
    options:
    - पक्षी का
    - मछली का
    - गाय का
    answer: पक्षी का
    difficulty: 1
    hints:
    - यह पेड़ पर बनता है।
    - तिनकों से कौन बनाता है?
    solution: 'चरण 1: घोंसला तिनकों से पेड़ पर बनता है। चरण 2: यह पक्षी का घर है।'
    mistakes:
      मछली का: c3h4_ghonsla
      गाय का: c3h4_ghonsla
  - prompt: '''राजा'' का स्त्रीलिंग क्या है?'
    options:
    - रानी
    - राजी
    - राजनी
    answer: रानी
    difficulty: 1
    hints:
    - कविता के शीर्षक में यह शब्द है।
    - चिड़िया ___।
    solution: 'चरण 1: राजा पुल्लिंग है। चरण 2: स्त्रीलिंग रानी।'
    mistakes:
      राजी: c3h4_ling
      राजनी: c3h4_ling
  - prompt: '''लगन'' का अर्थ है:'
    options:
    - मन लगाकर काम करना
    - जल्दी भाग जाना
    - सो जाना
    answer: मन लगाकर काम करना
    difficulty: 2
    hints:
    - बया कैसे घोंसला बनाती है?
    - पूरे ध्यान से।
    solution: 'चरण 1: लगन में मन और ध्यान लगता है। चरण 2: अर्थ है मन लगाकर काम करना।'
    mistakes:
      जल्दी भाग जाना: c3h4_shabd
      सो जाना: c3h4_shabd
  - prompt: इनमें से कौन-सा पक्षी है?
    options:
    - गौरैया
    - बकरी
    - मछली
    answer: गौरैया
    difficulty: 1
    hints:
    - कौन उड़ सकता है?
    - छोटी भूरी चिड़िया।
    solution: 'चरण 1: बकरी और मछली पक्षी नहीं। चरण 2: गौरैया पक्षी है।'
    mistakes:
      बकरी: c3h4_ghonsla
      मछली: c3h4_ghonsla
  - prompt: '''तिनका'' का बहुवचन क्या है?'
    options:
    - तिनके
    - तिनकाएँ
    - तिनकों
    answer: तिनके
    difficulty: 2
    hints:
    - '''आ'' से ख़त्म होने वाले शब्द ''ए'' में बदलते हैं।'
    - जैसे घोड़ा से घोड़े।
    solution: 'चरण 1: आ → ए। चरण 2: तिनके।'
    mistakes:
      तिनकाएँ: c3h4_shabd
      तिनकों: c3h4_shabd
  - prompt: अगर तुम्हें कोई कठिन चित्र बनाना हो तो बया की तरह क्या करोगे?
    options:
    - धीरे-धीरे, ध्यान से बनाऊँगा/बनाऊँगी
    - पहली गलती पर छोड़ दूँगा/दूँगी
    - बिना देखे जल्दी-जल्दी बनाऊँगा/बनाऊँगी
    answer: धीरे-धीरे, ध्यान से बनाऊँगा/बनाऊँगी
    difficulty: 3
    hints:
    - बया हार नहीं मानती।
    - वह हर तिनका ध्यान से लगाती है।
    solution: 'चरण 1: बया धैर्य से काम करती है। चरण 2: हम भी धीरे-धीरे ध्यान से काम करें।'
    mistakes:
      पहली गलती पर छोड़ दूँगा/दूँगी: c3h4_shabd
      बिना देखे जल्दी-जल्दी बनाऊँगा/बनाऊँगी: c3h4_shabd
  - prompt: बया को 'चिड़िया रानी' कहना कैसा भाव दिखाता है?
    options:
    - प्यार और सम्मान
    - गुस्सा
    - डर
    answer: प्यार और सम्मान
    difficulty: 2
    hints:
    - रानी किसे कहते हैं?
    - जिसे हम बहुत पसंद करते हैं।
    solution: 'चरण 1: ''रानी'' आदर का शब्द है। चरण 2: यह प्यार और सम्मान दिखाता है।'
    mistakes:
      गुस्सा: c3h4_shabd
      डर: c3h4_shabd
