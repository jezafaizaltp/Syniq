subject: cbse3-hin
chapter: 4
title: बया हमारी चिड़िया रानी
concepts:
- code: cbse3h.v2.baya
  title: बया हमारी चिड़िया रानी
  notes: |
    बया पक्षी पर कविता। बया (वीवर बर्ड) घास और तिनकों से लटकता हुआ, बुना हुआ सुंदर घोंसला बनाती है, इसलिए उसे बुनकर पक्षी
    कहते हैं। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: पक्षियों के नाम, घोंसला, कारीगरी, लगन।
  explanations:
    text: बया एक छोटी चिड़िया है जो सबसे सुंदर घोंसला बनाती है। वह घास के तिनकों को बुनकर लटकता हुआ घोंसला बनाती है, इसलिए उसे बुनकर चिड़िया भी कहते हैं।
    visual: 'चित्र बनाइए: पेड़ की डाल से लटकता बोतल जैसा घोंसला और उसके पास पीली-भूरी बया।'
    step_by_step: 1. कविता पढ़ें। 2. बया क्या बनाती है? 3. किससे बनाती है? 4. हम बया से क्या सीखें?
    real_world: बया के घोंसले अक्सर पानी के ऊपर झुकी डालियों पर लटके दिखते हैं, ताकि साँप न पहुँच सकें।
  picture:
    kind: flow
    steps:
    - तिनके लाती है
    - चोंच से बुनती है
    - लटकता घोंसला बनता है
    - उसमें अंडे देती है
    alt: बया तिनके लाती है, चोंच से बुनती है, लटकता घोंसला बनता है और वह उसमें अंडे देती है।
  items:
  - prompt: बया किस चीज़ के लिए प्रसिद्ध है?
    options:
    - सुंदर बुना हुआ घोंसला
    - तेज़ दौड़
    - ज़ोर की आवाज़
    - पानी में तैरना
    answer: सुंदर बुना हुआ घोंसला
    difficulty: 1
    hints:
    - कविता का विषय।
    - बुनकर पक्षी।
    solution: बया अपने सुंदर घोंसले के लिए प्रसिद्ध है।
  - prompt: बया घोंसला किससे बनाती है?
    options:
    - घास और तिनकों से
    - ईंटों से
    - प्लास्टिक से
    - पत्थरों से
    answer: घास और तिनकों से
    difficulty: 1
    hints:
    - पेड़-पौधों से।
    - पतली घास।
    solution: घास और तिनकों से।
  - prompt: बया का घोंसला कैसा होता है?
    options:
    - लटकता हुआ
    - ज़मीन में गड्ढा
    - पानी के नीचे
    - चपटा पत्थर
    answer: लटकता हुआ
    difficulty: 2
    hints:
    - डाल से झूलता है।
    - बोतल जैसा।
    solution: बया का घोंसला लटकता हुआ होता है।
    mistakes:
      ज़मीन में गड्ढा: hin3_read_again
  - prompt: बया घोंसला किससे बुनती है?
    options:
    - अपनी चोंच से
    - हाथों से
    - सुई से
    - मशीन से
    answer: अपनी चोंच से
    difficulty: 2
    hints:
    - पक्षी के हाथ नहीं होते।
    - चोंच।
    solution: बया चोंच से बुनती है।
  - prompt: '''रानी'' का पुल्लिंग क्या है?'
    options:
    - राजा
    - रानीजी
    - राजकुमारी
    - महल
    answer: राजा
    difficulty: 1
    hints:
    - रानी का पति।
    - पुरुष।
    solution: रानी का पुल्लिंग राजा है।
    mistakes:
      राजकुमारी: hin3_word
  - prompt: बया से हमें क्या सीख मिलती है?
    options:
    - लगन और मेहनत से सुंदर काम करना
    - जल्दी हार मान लेना
    - दूसरों का घर तोड़ना
    - कुछ न करना
    answer: लगन और मेहनत से सुंदर काम करना
    difficulty: 2
    hints:
    - घोंसला बनाने में बहुत समय लगता है।
    - धैर्य।
    solution: लगन और मेहनत से काम करना।
    mistakes:
      जल्दी हार मान लेना: hin3_lesson
