    - धूप तेज़।
    solution: आम गर्मी में पकते हैं।
    mistakes: {"सर्दी": "h3_aam_ritu", "बरसात के बाद ही": "h3_aam_ritu", "कभी नहीं": "h3_aam_ritu"}
  - prompt: आम के पेड़ पर कौन-सा पक्षी मीठा कूकता है?
