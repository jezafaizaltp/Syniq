  - prompt: 'स्थिति (केस): गाँव के लोग एक पुराने आम के पेड़ को काटकर वहाँ दुकान बनाना चाहते हैं। उस पेड़ पर कोयल और तोते रहते हैं, और गर्मी में बच्चे उसकी छाया में खेलते हैं। सबसे अच्छा उपाय क्या है?'
