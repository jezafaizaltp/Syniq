subject: cbse3-hin
chapter: 5
title: आम का पेड़
concepts:
- code: cbse3h.v2.aam
  title: आम का पेड़
  notes: |
    आम के पेड़ पर पाठ/कविता। आम का पेड़ छाया, मीठे फल, पक्षियों को घर देता है; कोयल आम के पेड़ पर कूकती है; गर्मी में आम पकते
    हैं; आम फलों का राजा है। (ठीक पाठ यहाँ नहीं दिया गया है।) अभ्यास: पेड़ के भाग, फल, ऋतु, स्वाद।
  explanations:
    text: आम का पेड़ हमें गर्मी में ठंडी छाया और मीठे आम देता है। उस पर चिड़ियाँ घोंसला बनाती हैं और कोयल कूकती है। आम को फलों का राजा कहते हैं।
    visual: 'चित्र बनाइए: आम का बड़ा पेड़, उस पर लटके हरे-पीले आम, डाल पर बैठी कोयल और नीचे छाया में खेलते बच्चे।'
    step_by_step: 1. पाठ पढ़ें। 2. आम का पेड़ क्या-क्या देता है? 3. आम कब पकते हैं? 4. हमें पेड़ों की रक्षा क्यों करनी चाहिए?
    real_world: 'भारत में आम की कई किस्में हैं: अल्फांसो, दशहरी, लंगड़ा, तोतापुरी।'
  picture:
    kind: compare
    columns:
    - title: आम का पेड़ देता है
      points:
      - छाया
      - मीठे फल
      - पक्षियों को घर
    - title: कब
      points:
      - गर्मी में
      - गर्मी में पकते हैं
      - पूरे साल
    alt: आम का पेड़ गर्मी में छाया और मीठे फल देता है, और पूरे साल पक्षियों को घर।
  items:
  - prompt: फलों का राजा किसे कहते हैं?
    options:
    - आम
    - केला
    - अमरूद
    - बेर
    answer: आम
    difficulty: 1
    hints:
    - पाठ का नाम।
    - गर्मी का फल।
    solution: आम को फलों का राजा कहते हैं।
  - prompt: आम किस ऋतु में पकते हैं?
    options:
    - गर्मी
    - सर्दी
    - बरसात के बाद ही
    - कभी नहीं
    answer: गर्मी
    difficulty: 1
    hints:
    - छुट्टियों में।
    - धूप तेज़।
    solution: आम गर्मी में पकते हैं।
  - prompt: आम के पेड़ पर कौन-सा पक्षी मीठा कूकता है?
    options:
    - कोयल
    - कौआ
    - मुर्गा
    - बत्तख
    answer: कोयल
    difficulty: 1
    hints:
    - कुहू-कुहू।
    - मीठी आवाज़।
    solution: कोयल कूकती है।
  - prompt: कच्चा आम स्वाद में कैसा होता है?
    options:
    - खट्टा
    - मीठा
    - नमकीन
    - कड़वा
    answer: खट्टा
    difficulty: 2
    hints:
    - अचार बनता है।
    - पका नहीं।
    solution: कच्चा आम खट्टा होता है।
    mistakes:
      मीठा: hin3_read_again
  - prompt: '''पेड़'' का समान अर्थ वाला शब्द है:'
    options:
    - वृक्ष
    - पत्ता
    - फल
    - फूल
    answer: वृक्ष
    difficulty: 2
    hints:
    - दूसरा नाम।
    - तरु।
    solution: पेड़ को वृक्ष भी कहते हैं।
    mistakes:
      पत्ता: hin3_word
  - prompt: हमें पेड़ क्यों नहीं काटने चाहिए?
    options:
    - वे छाया, फल, हवा और पक्षियों को घर देते हैं
    - वे शोर करते हैं
    - वे बेकार हैं
    - वे चलते हैं
    answer: वे छाया, फल, हवा और पक्षियों को घर देते हैं
    difficulty: 2
    hints:
    - पेड़ क्या-क्या देते हैं?
    - सोचें।
    solution: पेड़ बहुत कुछ देते हैं।
    mistakes:
      वे बेकार हैं: hin3_lesson
