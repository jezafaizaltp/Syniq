    - पेड़ कटने से किसका नुकसान होगा?
    solution: पेड़ छाया, फल, हवा और पक्षियों को घर देता है। पेड़ बचाकर दुकान दूसरी जगह बनाने से सबका भला होगा।
    mistakes:
      पेड़ काटकर पक्षियों को भगा देना: c3h5_ped
      पेड़ की सारी डालें काट देना: c3h5_ped
    exam: case
    difficulty: 2
  - prompt: 'परिस्थिति: तुम्हें अचार बनाने के लिए आम चुनना है। दो आम हैं: एक हरा और सख़्त, दूसरा पीला और नरम। कौन-सा लोगे?'
    options:
    - हरा और सख़्त कच्चा आम
    - पीला और नरम पका आम
    - कोई भी, फ़र्क़ नहीं पड़ता
    answer: हरा और सख़्त कच्चा आम
    hints:
    - अचार खट्टा होता है या मीठा?
    - कौन-सा आम खट्टा होता है?
    solution: अचार खट्टे कच्चे आम (कैरी) से बनता है। हरा और सख़्त आम कच्चा होता है।
    mistakes:
      पीला और नरम पका आम: c3h5_swad
      कोई भी, फ़र्क़ नहीं पड़ता: c3h5_swad
