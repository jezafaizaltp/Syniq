subject: cbse3-hin
chapter: 5
title: आम का पेड़
tips:
  h3_aam_raja: "पाठ का नाम याद करो। गर्मी की छुट्टियों में भारत के बच्चे सबसे ज़्यादा किस फल का इंतज़ार करते हैं?"
  h3_aam_ritu: "आम का रस किन छुट्टियों में पिया जाता है, जब बाहर लू चलती है?"
  c3h5_ped: 'आम के पेड़ के पास खड़े होकर सोचो: वह किस-किस को क्या देता है?'
  c3h5_swad: मुँह में उस चीज़ का स्वाद याद करो।
  c3h5_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse3h.v2.aam
  title: आम का पेड़
  notes: |
    आम के पेड़ पर पाठ/कविता। आम का पेड़ छाया, मीठे फल, पक्षियों को घर देता है; कोयल आम के पेड़ पर कूकती है; गर्मी में आम पकते
    हैं; आम फलों का राजा है। (ठीक पाठ यहाँ नहीं दिया गया है।) अभ्यास: पेड़ के भाग, फल, ऋतु, स्वाद।
  explanations:
    text: आम का पेड़ हमें गर्मी में ठंडी छाया और मीठे आम देता है। उस पर चिड़ियाँ घोंसला बनाती हैं और कोयल कूकती है। आम को फलों का राजा कहते हैं।
    visual: 'चित्र बनाइए: आम का बड़ा पेड़, उस पर लटके हरे-पीले आम, डाल पर बैठी कोयल और नीचे छाया में खेलते बच्चे।'
    step_by_step: 1. पाठ पढ़ें। 2. आम का पेड़ क्या-क्या देता है? 3. आम कब पकते हैं? 4. हमें पेड़ों की रक्षा क्यों करनी चाहिए?
    real_world: 'भारत में आम की कई किस्में हैं: अल्फांसो, दशहरी, लंगड़ा, तोतापुरी।'
  picture:
    kind: compare
    columns:
    - title: आम का पेड़ देता है
      points:
      - छाया
      - मीठे फल
      - पक्षियों को घर
    - title: कब
      points:
      - गर्मी में
      - गर्मी में पकते हैं
      - पूरे साल
    alt: आम का पेड़ गर्मी में छाया और मीठे फल देता है, और पूरे साल पक्षियों को घर।
  activity:
    type: sort
    prompt: आम का पेड़ किसे क्या देता है?
    bins:
    - हमें
    - पक्षियों को
    items:
    - label: मीठे फल
      bin: हमें
      clue: गर्मी में हम क्या खाते हैं?
      why: आम का फल।
    - label: ठंडी छाया
      bin: हमें
      clue: धूप में कहाँ बैठते हैं?
      why: पेड़ की छाया।
    - label: रहने का घर
      bin: पक्षियों को
      clue: पक्षी घोंसला कहाँ बनाते हैं?
      why: पेड़ पक्षियों का घर।
    - label: कोयल के कूकने की जगह
      bin: पक्षियों को
      clue: कोयल कहाँ बैठकर गाती है?
      why: आम के पेड़ पर कोयल कूकती है।
  lesson:
    - teach: '''आम का पेड़'' पाठ बताता है कि आम का पेड़ बहुत कुछ देता है: गर्मी में ठंडी छाया, मीठे फल, और पक्षियों को रहने की जगह।'
      picture:
        kind: compare
        columns:
        - title: हमें
          points:
          - छाया
          - मीठे आम
          - ताज़ी हवा
        - title: पक्षियों को
          points:
          - घर
          - फल
        alt: आम का पेड़ क्या-क्या देता है।
      check:
        prompt: गर्मी की दोपहर में आम का पेड़ हमें क्या देता है?
        options:
        - ठंडी छाया
        - बर्फ़
        - बारिश
        answer: ठंडी छाया
        why: पेड़ की घनी पत्तियाँ धूप रोकती हैं।
      ways:
      - style: step_by_step
        teach: 'एक पेड़ को ध्यान से देखो। पहला: पेड़ के नीचे खड़े हो जाओ और महसूस करो कि छाया कितनी ठंडी है। दूसरा: ऊपर देखो, कौन-से पक्षी बैठे हैं। तीसरा: उसके फल या फूल देखो। चौथा: लिखो कि पेड़ ने किस-किस को क्या दिया।'
      - style: real_world
        teach: गर्मी की दोपहर में गाँव के लोग, गाय-भैंसें और कुत्ते सब आम या नीम के बड़े पेड़ के नीचे आराम करते हैं। पेड़ बिना कुछ माँगे सबको छाया देता है।
    - teach: आम गर्मी की ऋतु में पकते हैं। कच्चा आम (कैरी) खट्टा होता है, पका आम मीठा और पीला। आम को फलों का राजा कहते हैं।
      check:
        prompt: कच्चे आम को और क्या कहते हैं?
        options:
        - कैरी
        - केला
        - नारियल
        answer: कैरी
        why: कच्चा हरा आम कैरी कहलाता है।
      ways:
      - style: visual
        teach: 'कच्चा आम और पका आम: रंग, स्वाद और उनसे क्या बनता है।'
        picture:
          kind: compare
          columns:
          - title: कच्चा आम (कैरी)
            points:
            - हरा
            - खट्टा
            - आम पन्ना बनता है
          - title: पका आम
            points:
            - पीला
            - मीठा
            - आमरस बनता है
          alt: कच्चा आम, या कैरी, हरा और खट्टा होता है, उससे आम पन्ना बनता है। पका आम पीला और मीठा होता है, उससे आमरस बनता है।
      - style: real_world
        teach: गर्मी की छुट्टियों में कई बच्चे नानी-दादी के गाँव जाते हैं, जहाँ पेड़ से तोड़कर ताज़े आम खाने का मज़ा ही अलग होता है।
    - teach: 'आम के पेड़ पर कोयल मीठा कूकती है: कुहू-कुहू। पेड़ के भाग: जड़, तना, डाल, पत्ते, फूल (बौर), फल।'
      check:
        prompt: आम के फूल को क्या कहते हैं?
        options:
        - बौर
        - बीज
        - गुठली
        answer: बौर
        why: आम के छोटे-छोटे फूल बौर कहलाते हैं।
      ways:
      - style: visual
        teach: आम के पेड़ के सारे भाग, नीचे ज़मीन से ऊपर तक क्रम में।
        picture:
          kind: flow
          steps:
          - जड़
          - तना
          - डाल
          - पत्ते
          - बौर (फूल)
          - आम (फल)
          alt: 'आम के पेड़ के भाग नीचे से ऊपर: जड़, तना, डाल, पत्ते, बौर यानी फूल, और फल यानी आम।'
      - style: real_world
        teach: वसंत में जब आम के पेड़ पर बौर आता है, तो उसकी ख़ुशबू दूर तक फैल जाती है। इसी समय कोयल की कुहू-कुहू सुनाई देने लगती है।
  items:
  - prompt: फलों का राजा किसे कहते हैं?
