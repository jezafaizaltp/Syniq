subject: cbse3-hin
chapter: 7
title: मित्र को पत्र
concepts:
- code: cbse3h.v3.patra
  title: मित्र को पत्र
  notes: |
    मित्र को पत्र लिखने पर पाठ। पत्र के भाग: पता और तारीख (ऊपर), संबोधन (प्रिय मित्र ...), नमस्ते/अभिवादन, मुख्य बात, अंत
    (तुम्हारा मित्र/तुम्हारी सहेली, नाम)। लिफ़ाफ़े पर पता। आजकल ईमेल और संदेश भी, पर पत्र की बात अलग है। (ठीक पाठ यहाँ नहीं दिया गया है।)
  explanations:
    text: पत्र से हम दूर रहने वाले मित्र को अपनी बातें बताते हैं। पत्र में ऊपर पता और तारीख, फिर 'प्रिय मित्र', फिर अपनी बात, और अंत में 'तुम्हारा मित्र' या 'तुम्हारी सहेली' लिखकर अपना नाम लिखते हैं।
    visual: 'चित्र बनाइए: एक पत्र जिस पर तारीख, ''प्रिय मित्र'', बात और नाम लिखा हो, और पास में डाक टिकट लगा लिफ़ाफ़ा।'
    step_by_step: '1. ऊपर पता और तारीख। 2. संबोधन: प्रिय ...। 3. अपनी बात। 4. अंत: तुम्हारा मित्र और नाम। 5. लिफ़ाफ़े पर पता।'
    real_world: डाकिया हमारे घर पत्र लाता है।
  picture:
    kind: flow
    steps:
    - पता और तारीख
    - प्रिय मित्र
    - अपनी बात
    - तुम्हारा मित्र / तुम्हारी सहेली, नाम
    alt: पत्र में पहले पता और तारीख, फिर प्रिय मित्र, फिर अपनी बात, और अंत में तुम्हारा मित्र या तुम्हारी सहेली और नाम।
  items:
  - prompt: मित्र को पत्र कैसे शुरू करते हैं?
    options:
    - प्रिय मित्र
    - आदरणीय प्रधानाचार्य जी
    - सेवा में
    - धन्यवाद
    answer: प्रिय मित्र
    difficulty: 1
    hints:
    - मित्र प्यारा होता है।
    - प्रिय।
    solution: मित्र को 'प्रिय मित्र' लिखते हैं।
    mistakes:
      आदरणीय प्रधानाचार्य जी: hin3_read_again
  - prompt: पत्र हमारे घर कौन लाता है?
    options:
    - डाकिया
    - डॉक्टर
    - किसान
    - दर्ज़ी
    answer: डाकिया
    difficulty: 1
    hints:
    - खाकी वर्दी।
    - थैला।
    solution: डाकिया पत्र लाता है।
  - prompt: पत्र में तारीख कहाँ लिखते हैं?
    options:
    - ऊपर
    - सबसे नीचे बीच में
    - लिफ़ाफ़े के अंदर अलग से
    - कहीं नहीं
    answer: ऊपर
    difficulty: 2
    hints:
    - पत्र की शुरुआत में।
    - पते के साथ।
    solution: तारीख ऊपर लिखते हैं।
  - prompt: पत्र के अंत में क्या लिखते हैं?
    options:
    - तुम्हारा मित्र / तुम्हारी सहेली और नाम
    - प्रिय मित्र
    - तारीख
    - कुछ नहीं
    answer: तुम्हारा मित्र / तुम्हारी सहेली और नाम
    difficulty: 2
    hints:
    - किसने लिखा?
    - अपना नाम।
    solution: अंत में 'तुम्हारा मित्र' और नाम लिखते हैं।
  - prompt: '''मित्र'' का समान अर्थ वाला शब्द है:'
    options:
    - दोस्त
    - दुश्मन
    - पड़ोसी
    - मेहमान
    answer: दोस्त
    difficulty: 1
    hints:
    - साथी।
    - यार।
    solution: मित्र यानी दोस्त।
    mistakes:
      दुश्मन: hin3_word
  - prompt: पत्र को डाक में भेजने से पहले उस पर क्या लगाते हैं?
    options:
    - डाक टिकट
    - मिठाई
    - फूल
    - पानी
    answer: डाक टिकट
    difficulty: 2
    hints:
    - छोटा कागज़ का टुकड़ा।
    - डाकघर से मिलता है।
    solution: डाक टिकट लगाते हैं।
