subject: cbse3-hin
chapter: 7
title: मित्र को पत्र
tips:
  h3_dak_tikat: "डाक से चिट्ठी भेजने का किराया एक छोटे चिपकने वाले चौकोर कागज़ से चुकाते हैं।"
  h3_dakiya: "हर काम का एक व्यक्ति: डॉक्टर इलाज करता है, दर्ज़ी कपड़े सिलता है। चिट्ठी डाकघर से घर तक कौन लाता है?"
  h3_patra_ant: "'प्रिय मित्र' से पत्र शुरू होता है। विदा लेते समय लिखने वाला अपना परिचय कैसे देता है?"
  h3_patra_dhancha: "पत्र पढ़ने वाला सबसे पहले जानना चाहता है कि पत्र कब लिखा गया। वह सबसे पहले कहाँ देखेगा?"
  c3h7_bhag: 'पत्र को ऊपर से नीचे तक सोचो: पहले क्या आता है, बीच में क्या, अंत में क्या?'
  c3h7_dak: पत्र घर से निकलकर दोस्त तक कैसे पहुँचता है? हर कदम सोचो।
  c3h7_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v3.patra
  title: मित्र को पत्र
  notes: |
    मित्र को पत्र लिखने पर पाठ। पत्र के भाग: पता और तारीख (ऊपर), संबोधन (प्रिय मित्र ...), नमस्ते/अभिवादन, मुख्य बात, अंत
    (तुम्हारा मित्र/तुम्हारी सहेली, नाम)। लिफ़ाफ़े पर पता। आजकल ईमेल और संदेश भी, पर पत्र की बात अलग है। (ठीक पाठ यहाँ नहीं दिया गया है।)
  explanations:
    text: पत्र से हम दूर रहने वाले मित्र को अपनी बातें बताते हैं। पत्र में ऊपर पता और तारीख, फिर 'प्रिय मित्र', फिर अपनी बात, और अंत में 'तुम्हारा मित्र' या 'तुम्हारी सहेली' लिखकर अपना नाम लिखते हैं।
    visual: 'चित्र बनाइए: एक पत्र जिस पर तारीख, ''प्रिय मित्र'', बात और नाम लिखा हो, और पास में डाक टिकट लगा लिफ़ाफ़ा।'
    step_by_step: '1. ऊपर पता और तारीख। 2. संबोधन: प्रिय ...। 3. अपनी बात। 4. अंत: तुम्हारा मित्र और नाम। 5. लिफ़ाफ़े पर पता।'
    real_world: डाकिया हमारे घर पत्र लाता है।
  picture:
    kind: flow
    steps:
    - पता और तारीख
    - प्रिय मित्र
    - अपनी बात
    - तुम्हारा मित्र / तुम्हारी सहेली, नाम
    alt: पत्र में पहले पता और तारीख, फिर प्रिय मित्र, फिर अपनी बात, और अंत में तुम्हारा मित्र या तुम्हारी सहेली और नाम।
  activity:
    type: order
    prompt: मित्र को पत्र के भाग क्रम से लगाओ।
    steps:
    - पता और तारीख
    - प्रिय मित्र
    - नमस्ते
    - मुख्य बात
    - तुम्हारा मित्र, नाम
    reasons:
      प्रिय मित्र: पता और तारीख सबसे ऊपर।
      नमस्ते: पहले संबोधन, फिर अभिवादन।
      मुख्य बात: अभिवादन के बाद असली बात।
      तुम्हारा मित्र, नाम: अंत में अपना नाम।
  lesson:
    - teach: 'पत्र में अपनी बात लिखकर दूर बैठे मित्र को भेजते हैं। पत्र के भाग क्रम से: ऊपर पता और तारीख, फिर संबोधन (प्रिय मित्र ...), अभिवादन (नमस्ते), मुख्य बात, और अंत में ''तुम्हारा मित्र'' या ''तुम्हारी सहेली'' और नाम।'
      picture:
        kind: flow
        steps:
        - पता और तारीख
        - प्रिय मित्र
        - नमस्ते
        - मुख्य बात
        - तुम्हारा मित्र, नाम
        alt: मित्र को पत्र के भाग, ऊपर से नीचे।
      check:
        prompt: पत्र में मुख्य बात कहाँ आती है?
        options:
        - अभिवादन के बाद, अंत से पहले
        - सबसे ऊपर
        - लिफ़ाफ़े पर
        answer: अभिवादन के बाद, अंत से पहले
        why: पहले संबोधन और नमस्ते, फिर अपनी बात।
    - teach: पत्र को लिफ़ाफ़े में रखकर उस पर मित्र का पूरा पता लिखते हैं और डाक टिकट लगाते हैं। फिर लाल डाक-पेटी में डालते हैं। डाकिया उसे मित्र के घर पहुँचाता है।
      check:
        prompt: लिफ़ाफ़े पर किसका पता लिखते हैं?
        options:
        - जिसे पत्र भेजना है
        - डाकिए का
        - स्कूल का
        answer: जिसे पत्र भेजना है
        why: पता बताता है कि पत्र कहाँ पहुँचना है।
    - teach: आजकल ईमेल और फ़ोन संदेश जल्दी पहुँचते हैं, पर हाथ से लिखे पत्र में अपनापन होता है और उसे सँभालकर रखा जा सकता है।
      check:
        prompt: हाथ से लिखे पत्र की ख़ास बात क्या है?
        options:
        - उसमें अपनापन होता है
        - वह सबसे तेज़ पहुँचता है
        - उसमें तारीख नहीं होती
        answer: उसमें अपनापन होता है
        why: अपने हाथ से लिखी बात दिल के करीब लगती है।
  items:
  - prompt: मित्र को पत्र कैसे शुरू करते हैं?
    options:
    - प्रिय मित्र
    - आदरणीय प्रधानाचार्य जी
    - सेवा में
    - धन्यवाद
    answer: प्रिय मित्र
    difficulty: 1
    hints:
    - मित्र प्यारा होता है।
    - प्रिय।
    solution: मित्र को 'प्रिय मित्र' लिखते हैं।
    mistakes:
      आदरणीय प्रधानाचार्य जी: hin3_read_again
  - prompt: पत्र हमारे घर कौन लाता है?
    options:
    - डाकिया
    - डॉक्टर
    - किसान
    - दर्ज़ी
    answer: डाकिया
    difficulty: 1
    hints:
    - खाकी वर्दी।
    - थैला।
    solution: डाकिया पत्र लाता है।
    mistakes: {"डॉक्टर": "h3_dakiya", "किसान": "h3_dakiya", "दर्ज़ी": "h3_dakiya"}
  - prompt: पत्र में तारीख कहाँ लिखते हैं?
    options:
    - ऊपर
    - सबसे नीचे बीच में
    - लिफ़ाफ़े के अंदर अलग से
    - कहीं नहीं
    answer: ऊपर
    difficulty: 2
    hints:
    - पत्र की शुरुआत में।
    - पते के साथ।
    solution: तारीख ऊपर लिखते हैं।
    mistakes: {"सबसे नीचे बीच में": "h3_patra_dhancha", "लिफ़ाफ़े के अंदर अलग से": "h3_patra_dhancha", "कहीं नहीं": "h3_patra_dhancha"}
  - prompt: पत्र के अंत में क्या लिखते हैं?
    options:
    - तुम्हारा मित्र / तुम्हारी सहेली और नाम
    - प्रिय मित्र
    - तारीख
    - कुछ नहीं
    answer: तुम्हारा मित्र / तुम्हारी सहेली और नाम
    difficulty: 2
    hints:
    - किसने लिखा?
    - अपना नाम।
    solution: अंत में 'तुम्हारा मित्र' और नाम लिखते हैं।
    mistakes: {"प्रिय मित्र": "h3_patra_ant", "तारीख": "h3_patra_ant", "कुछ नहीं": "h3_patra_ant"}
  - prompt: '''मित्र'' का समान अर्थ वाला शब्द है:'
    options:
    - दोस्त
    - दुश्मन
    - पड़ोसी
    - मेहमान
    answer: दोस्त
    difficulty: 1
    hints:
    - साथी।
    - यार।
    solution: मित्र यानी दोस्त।
    mistakes:
      दुश्मन: hin3_word
  - prompt: पत्र को डाक में भेजने से पहले उस पर क्या लगाते हैं?
    options:
    - डाक टिकट
    - मिठाई
    - फूल
    - पानी
    answer: डाक टिकट
    difficulty: 2
    hints:
    - छोटा कागज़ का टुकड़ा।
    - डाकघर से मिलता है।
    solution: डाक टिकट लगाते हैं।
    mistakes: {"मिठाई": "h3_dak_tikat", "फूल": "h3_dak_tikat", "पानी": "h3_dak_tikat"}
  - prompt: पत्र डालने के लिए डाक-पेटी किस रंग की होती है?
    options:
    - लाल
    - हरी
    - काली
    answer: लाल
    difficulty: 1
    hints:
    - सड़क किनारे की डाक-पेटी याद करो।
    - आग जैसा रंग।
    solution: 'चरण 1: भारत में डाक-पेटी का रंग चमकीला होता है। चरण 2: वह लाल है।'
    mistakes:
      हरी: c3h7_dak
      काली: c3h7_dak
  - prompt: पत्र को किसमें रखकर भेजते हैं?
    options:
    - लिफ़ाफ़े में
    - थैले में
    - बोतल में
    answer: लिफ़ाफ़े में
    difficulty: 1
    hints:
    - यह कागज़ का बना होता है।
    - उस पर पता लिखते हैं।
    solution: 'चरण 1: पत्र मोड़कर कागज़ के खोल में रखते हैं। चरण 2: उसे लिफ़ाफ़ा कहते हैं।'
    mistakes:
      थैले में: c3h7_dak
      बोतल में: c3h7_dak
  - prompt: पत्र के भागों का सही क्रम चुनो।
    options:
    - तारीख → प्रिय मित्र → बात → तुम्हारा मित्र
    - बात → तारीख → प्रिय मित्र
    - तुम्हारा मित्र → बात → तारीख
    answer: तारीख → प्रिय मित्र → बात → तुम्हारा मित्र
    difficulty: 2
    hints:
    - तारीख सबसे ऊपर होती है।
    - नाम सबसे नीचे।
    solution: 'चरण 1: ऊपर तारीख, फिर संबोधन। चरण 2: बात, फिर अंत।'
    mistakes:
      बात → तारीख → प्रिय मित्र: c3h7_bhag
      तुम्हारा मित्र → बात → तारीख: c3h7_bhag
  - prompt: '''पत्र'' का समान अर्थ वाला शब्द है:'
    options:
    - चिट्ठी
    - किताब
    - डिब्बा
    answer: चिट्ठी
    difficulty: 1
    hints:
    - डाकिया जो लाता है।
    - छोटा, अपनापन भरा शब्द।
    solution: 'चरण 1: पत्र में बात लिखी होती है। चरण 2: उसे चिट्ठी भी कहते हैं।'
    mistakes:
      किताब: c3h7_shabd
      डिब्बा: c3h7_shabd
  - prompt: डाक टिकट क्यों लगाते हैं?
    options:
    - पत्र भेजने का शुल्क देने के लिए
    - सजाने के लिए
    - पत्र भारी करने के लिए
    answer: पत्र भेजने का शुल्क देने के लिए
    difficulty: 2
    hints:
    - डाक विभाग पत्र मुफ़्त नहीं भेजता।
    - टिकट पैसे से ख़रीदते हैं।
    solution: 'चरण 1: टिकट ख़रीदकर पैसे दिए जाते हैं। चरण 2: यह पत्र भेजने का शुल्क है।'
    mistakes:
      सजाने के लिए: c3h7_dak
      पत्र भारी करने के लिए: c3h7_dak
  - prompt: किसे पत्र लिखते समय 'प्रिय सहेली' लिखेंगे?
    options:
    - जिस सहेली को पत्र भेजना है
    - डाकिए को
    - प्रधानाचार्य को
    answer: जिस सहेली को पत्र भेजना है
    difficulty: 2
    hints:
    - संबोधन उसी के लिए होता है जिसे पत्र जाना है।
    - प्रधानाचार्य को 'आदरणीय' लिखते हैं।
    solution: 'चरण 1: संबोधन पढ़ने वाले के लिए है। चरण 2: सहेली को ''प्रिय सहेली''।'
    mistakes:
      डाकिए को: c3h7_bhag
      प्रधानाचार्य को: c3h7_bhag
  - prompt: आज के समय में संदेश सबसे जल्दी कैसे पहुँचता है?
    options:
    - ईमेल या फ़ोन संदेश से
    - कबूतर से
    - पैदल चलकर
    answer: ईमेल या फ़ोन संदेश से
    difficulty: 1
    hints:
    - एक बटन दबाओ और पहुँच जाए।
    - कंप्यूटर या मोबाइल से।
    solution: 'चरण 1: ईमेल और फ़ोन संदेश तुरंत पहुँचते हैं। चरण 2: वही सबसे तेज़।'
    mistakes:
      कबूतर से: c3h7_dak
      पैदल चलकर: c3h7_dak
  - prompt: पत्र में अपने मित्र से उसका हाल पूछने के लिए कौन-सा वाक्य ठीक है?
    options:
    - तुम कैसे हो?
    - तुम कहाँ हो।
    - कैसे तुम हो
    answer: तुम कैसे हो?
    difficulty: 2
    hints:
    - प्रश्न के अंत में कौन-सा चिह्न?
    - शब्दों का क्रम देखो।
    solution: 'चरण 1: हाल पूछने का प्रश्न। चरण 2: तुम कैसे हो?'
    mistakes:
      तुम कहाँ हो।: c3h7_shabd
      कैसे तुम हो: c3h7_shabd
  - prompt: पत्र पहुँचने का सही क्रम क्या है?
    options:
    - लिखना → लिफ़ाफ़ा, टिकट → डाक-पेटी → डाकिया → मित्र
    - डाकिया → लिखना → टिकट
    - मित्र → डाक-पेटी → लिखना
    answer: लिखना → लिफ़ाफ़ा, टिकट → डाक-पेटी → डाकिया → मित्र
    difficulty: 3
    hints:
    - पहले पत्र लिखा जाता है।
    - आख़िर में मित्र पढ़ता है।
    solution: 'चरण 1: लिखकर लिफ़ाफ़े में, टिकट लगाकर डाक-पेटी में। चरण 2: डाकिया मित्र तक पहुँचाता है।'
    mistakes:
      डाकिया → लिखना → टिकट: c3h7_dak
      मित्र → डाक-पेटी → लिखना: c3h7_dak
