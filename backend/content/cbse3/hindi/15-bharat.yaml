subject: cbse3-hin
chapter: 15
title: भारत
concepts:
- code: cbse3h.v5.bharat
  title: भारत
  notes: |
    भारत देश पर कविता: हिमालय उत्तर में, तीन ओर समुद्र, बहती नदियाँ (गंगा, यमुना), अनेक भाषाएँ, पहनावे और त्योहार, फिर भी एक।
    तिरंगा, देशप्रेम। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: देश, नदियों-पहाड़ों के नाम, राष्ट्रीय प्रतीक।
  explanations:
    text: यह कविता हमारे देश भारत के बारे में है। उत्तर में ऊँचा हिमालय है, तीन ओर समुद्र है, और गंगा जैसी नदियाँ बहती हैं। यहाँ अनेक भाषाएँ और त्योहार हैं, फिर भी हम सब एक हैं।
    visual: 'चित्र बनाइए: भारत का नक्शा, ऊपर हिमालय, नीचे समुद्र, और बीच में लहराता तिरंगा।'
    step_by_step: 1. कविता गर्व से पढ़ें। 2. भारत में क्या-क्या है? 3. भारत की विशेषता क्या है? 4. हम देश के लिए क्या कर सकते हैं?
    real_world: स्वतंत्रता दिवस (15 अगस्त) और गणतंत्र दिवस (26 जनवरी) पर हम तिरंगा फहराते हैं।
  picture:
    kind: compare
    columns:
    - title: राष्ट्रीय प्रतीक
      points:
      - राष्ट्रीय ध्वज
      - राष्ट्रीय पक्षी
      - राष्ट्रीय पशु
    - title: नाम
      points:
      - तिरंगा
      - मोर
      - बाघ
    alt: हमारा राष्ट्रीय ध्वज तिरंगा, राष्ट्रीय पक्षी मोर और राष्ट्रीय पशु बाघ है।
  items:
  - prompt: भारत के उत्तर में कौन-सा पर्वत है?
    options:
    - हिमालय
    - अरावली ही
    - आल्प्स
    - एंडीज़
    answer: हिमालय
    difficulty: 1
    hints:
    - बर्फ़ से ढका।
    - सबसे ऊँचा।
    solution: उत्तर में हिमालय है।
  - prompt: हमारे राष्ट्रीय ध्वज को क्या कहते हैं?
    options:
    - तिरंगा
    - दोरंगा
    - सतरंगा
    - एकरंगा
    answer: तिरंगा
    difficulty: 1
    hints:
    - तीन रंग।
    - केसरिया, सफ़ेद, हरा।
    solution: राष्ट्रीय ध्वज तिरंगा है।
  - prompt: 'भारत का राष्ट्रीय पक्षी है:'
    options:
    - मोर
    - कौआ
    - तोता
    - कबूतर
    answer: मोर
    difficulty: 1
    hints:
    - सुंदर पंख।
    - नाचता है।
    solution: मोर राष्ट्रीय पक्षी है।
  - prompt: 'भारत की एक बड़ी नदी है:'
    options:
    - गंगा
    - नील
    - अमेज़न
    - टेम्स
    answer: गंगा
    difficulty: 2
    hints:
    - हिमालय से निकलती है।
    - भारत में।
    solution: गंगा भारत की बड़ी नदी है।
    mistakes:
      नील: hin3_read_again
  - prompt: 'भारत में अनेक भाषाएँ हैं, फिर भी हम:'
    options:
    - एक हैं
    - अलग-अलग देश हैं
    - बात नहीं करते
    - लड़ते हैं
    answer: एक हैं
    difficulty: 2
    hints:
    - अनेकता में एकता।
    - एक देश।
    solution: हम सब एक हैं।
    mistakes:
      लड़ते हैं: hin3_lesson
  - prompt: '''देश'' का समान अर्थ वाला शब्द है:'
    options:
    - राष्ट्र
    - गाँव
    - घर
    - गली
    answer: राष्ट्र
    difficulty: 2
    hints:
    - बड़ा, पूरा।
    - राष्ट्रीय।
    solution: देश को राष्ट्र भी कहते हैं।
    mistakes:
      गाँव: hin3_word
