# CBSE Class 3 Hindi (NCERT Veena, 2024-25), chapter 15. Format: content/README.md.
# Chapter names and order from published chapter lists, not the printed book; details from general knowledge; kept general where unsure.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse3-hin
chapter: 15
title: भारत
tips:
  h3_himalaya: "आल्प्स और एंडीज़ दूसरे देशों में हैं। भारत के मुकुट जैसे बर्फ़ीले पहाड़ों का नाम 'हिम' (बर्फ़) से बना है।"
  h3_mor: "राष्ट्रीय पक्षी बारिश में अपने रंग-बिरंगे पंख फैलाकर नाचता है।"
  h3_tiranga: "झंडे की पट्टियाँ गिनो: केसरिया, सफ़ेद, हरा। अब गिनती को 'रंगा' से जोड़ो।"
  c3h15_desh: 'भारत का नक्शा सोचो: ऊपर क्या है, तीन तरफ़ क्या है, बीच से क्या बहता है?'
  c3h15_prateek: 'हमारे राष्ट्रीय प्रतीकों को याद करो: झंडा, पक्षी, पशु, फूल।'
  c3h15_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v5.bharat
  title: भारत
  notes: |
    भारत देश पर कविता: हिमालय उत्तर में, तीन ओर समुद्र, बहती नदियाँ (गंगा, यमुना), अनेक भाषाएँ, पहनावे और त्योहार, फिर भी एक।
    तिरंगा, देशप्रेम। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: देश, नदियों-पहाड़ों के नाम, राष्ट्रीय प्रतीक।
  explanations:
    text: यह कविता हमारे देश भारत के बारे में है। उत्तर में ऊँचा हिमालय है, तीन ओर समुद्र है, और गंगा जैसी नदियाँ बहती हैं। यहाँ अनेक भाषाएँ और त्योहार हैं, फिर भी हम सब एक हैं।
    visual: 'चित्र बनाइए: भारत का नक्शा, ऊपर हिमालय, नीचे समुद्र, और बीच में लहराता तिरंगा।'
    step_by_step: 1. कविता गर्व से पढ़ें। 2. भारत में क्या-क्या है? 3. भारत की विशेषता क्या है? 4. हम देश के लिए क्या कर सकते हैं?
    real_world: स्वतंत्रता दिवस (15 अगस्त) और गणतंत्र दिवस (26 जनवरी) पर हम तिरंगा फहराते हैं।
  picture:
    kind: compare
    columns:
    - title: राष्ट्रीय प्रतीक
      points:
      - राष्ट्रीय ध्वज
      - राष्ट्रीय पक्षी
      - राष्ट्रीय पशु
    - title: नाम
      points:
      - तिरंगा
      - मोर
      - बाघ
    alt: हमारा राष्ट्रीय ध्वज तिरंगा, राष्ट्रीय पक्षी मोर और राष्ट्रीय पशु बाघ है।
  activity:
    type: sort
    prompt: भारत के चारों ओर क्या है?
    bins:
    - उत्तर में
    - तीन ओर
    items:
    - label: हिमालय
      bin: उत्तर में
      clue: बर्फ़ीले पहाड़ भारत की किस दिशा में हैं?
      why: हिमालय उत्तर में।
    - label: बर्फ़ से ढकी चोटियाँ
      bin: उत्तर में
      clue: ये किस पर्वत की हैं?
      why: हिमालय की चोटियाँ।
    - label: समुद्र
      bin: तीन ओर
      clue: भारत को तीन ओर से क्या घेरे है?
      why: तीन ओर समुद्र।
    - label: लहरें और तट
      bin: तीन ओर
      clue: ये पहाड़ की बात है या समुद्र की?
      why: समुद्र-तट तीन ओर।
  lesson:
    - teach: '''भारत'' कविता हमारे देश की सुंदरता बताती है। उत्तर में ऊँचा हिमालय पर्वत है। तीन ओर समुद्र है। गंगा, यमुना जैसी नदियाँ बहती हैं।'
      picture:
        kind: compare
        columns:
        - title: उत्तर
          points:
          - हिमालय
        - title: तीन ओर
          points:
          - समुद्र
        - title: बीच में
          points:
          - गंगा
          - यमुना
        alt: भारत में हिमालय, समुद्र और नदियाँ।
      check:
        prompt: भारत के कितनी ओर समुद्र है?
        options:
        - तीन
        - एक
        - चारों
        answer: तीन
        why: पूर्व, पश्चिम और दक्षिण में समुद्र है।
    - teach: भारत में अनेक भाषाएँ, पहनावे, खान-पान और त्योहार हैं, फिर भी हम सब एक हैं। यही हमारे देश की ताकत है।
      check:
        prompt: 'अलग-अलग भाषाएँ होने पर भी हम:'
        options:
        - सब भारतीय हैं
        - एक-दूसरे से दूर हैं
        - बात नहीं करते
        answer: सब भारतीय हैं
        why: भाषा अलग है, देश एक है।
    - teach: 'हमारे राष्ट्रीय प्रतीक: झंडा तिरंगा (केसरिया, सफ़ेद, हरा, बीच में नीला चक्र), पक्षी मोर, पशु बाघ, फूल कमल।'
      check:
        prompt: भारत का राष्ट्रीय फूल कौन-सा है?
        options:
        - कमल
        - गुलाब
        - गेंदा
        answer: कमल
        why: कमल हमारा राष्ट्रीय फूल है।
  items:
  - prompt: भारत के उत्तर में कौन-सा पर्वत है?
    options:
    - हिमालय
    - अरावली ही
    - आल्प्स
    - एंडीज़
    answer: हिमालय
    difficulty: 1
    hints:
    - बर्फ़ से ढका।
    - सबसे ऊँचा।
    solution: उत्तर में हिमालय है।
    mistakes: {"अरावली ही": "h3_himalaya", "आल्प्स": "h3_himalaya", "एंडीज़": "h3_himalaya"}
  - prompt: हमारे राष्ट्रीय ध्वज को क्या कहते हैं?
    options:
    - तिरंगा
    - दोरंगा
    - सतरंगा
    - एकरंगा
    answer: तिरंगा
    difficulty: 1
    hints:
    - तीन रंग।
    - केसरिया, सफ़ेद, हरा।
    solution: राष्ट्रीय ध्वज तिरंगा है।
    mistakes: {"दोरंगा": "h3_tiranga", "सतरंगा": "h3_tiranga", "एकरंगा": "h3_tiranga"}
  - prompt: 'भारत का राष्ट्रीय पक्षी है:'
    options:
    - मोर
    - कौआ
    - तोता
    - कबूतर
    answer: मोर
    difficulty: 1
    hints:
    - सुंदर पंख।
    - नाचता है।
    solution: मोर राष्ट्रीय पक्षी है।
    mistakes: {"कौआ": "h3_mor", "तोता": "h3_mor", "कबूतर": "h3_mor"}
  - prompt: 'भारत की एक बड़ी नदी है:'
    options:
    - गंगा
    - नील
    - अमेज़न
    - टेम्स
    answer: गंगा
    difficulty: 2
    hints:
    - हिमालय से निकलती है।
    - भारत में।
    solution: गंगा भारत की बड़ी नदी है।
    mistakes:
      नील: hin3_read_again
  - prompt: 'भारत में अनेक भाषाएँ हैं, फिर भी हम:'
    options:
    - एक हैं
    - अलग-अलग देश हैं
    - बात नहीं करते
    - लड़ते हैं
    answer: एक हैं
    difficulty: 2
    hints:
    - अनेकता में एकता।
    - एक देश।
    solution: हम सब एक हैं।
    mistakes:
      लड़ते हैं: hin3_lesson
  - prompt: '''देश'' का समान अर्थ वाला शब्द है:'
    options:
    - राष्ट्र
    - गाँव
    - घर
    - गली
    answer: राष्ट्र
    difficulty: 2
    hints:
    - बड़ा, पूरा।
    - राष्ट्रीय।
    solution: देश को राष्ट्र भी कहते हैं।
    mistakes:
      गाँव: hin3_word
  - prompt: भारत का राष्ट्रीय पशु कौन-सा है?
    options:
    - बाघ
    - हाथी
    - घोड़ा
    answer: बाघ
    difficulty: 1
    hints:
    - धारियों वाला बड़ा जंगली जानवर।
    - जंगल का ताकतवर शिकारी।
    solution: 'चरण 1: राष्ट्रीय प्रतीकों में पशु भी है। चरण 2: वह बाघ है।'
    mistakes:
      हाथी: c3h15_prateek
      घोड़ा: c3h15_prateek
  - prompt: तिरंगे के बीच में चक्र किस रंग का है?
    options:
    - नीला
    - लाल
    - पीला
    answer: नीला
    difficulty: 2
    hints:
    - सफ़ेद पट्टी के बीच में।
    - आसमान जैसा रंग।
    solution: 'चरण 1: चक्र सफ़ेद पट्टी पर है। चरण 2: उसका रंग नीला है।'
    mistakes:
      लाल: c3h15_prateek
      पीला: c3h15_prateek
  - prompt: तिरंगे में सबसे ऊपर कौन-सा रंग है?
    options:
    - केसरिया
    - हरा
    - सफ़ेद
    answer: केसरिया
    difficulty: 2
    hints:
    - हरा सबसे नीचे है।
    - सफ़ेद बीच में है।
    solution: 'चरण 1: नीचे हरा, बीच में सफ़ेद। चरण 2: ऊपर केसरिया।'
    mistakes:
      हरा: c3h15_prateek
      सफ़ेद: c3h15_prateek
  - prompt: हिमालय भारत की किस दिशा में है?
    options:
    - उत्तर
    - दक्षिण
    - पश्चिम
    answer: उत्तर
    difficulty: 1
    hints:
    - नक्शे में सबसे ऊपर।
    - बर्फ़ से ढके पहाड़।
    solution: 'चरण 1: हिमालय नक्शे में ऊपर है। चरण 2: ऊपर उत्तर दिशा।'
    mistakes:
      दक्षिण: c3h15_desh
      पश्चिम: c3h15_desh
  - prompt: '''पर्वत'' का समान अर्थ वाला शब्द है:'
    options:
    - पहाड़
    - नदी
    - मैदान
    answer: पहाड़
    difficulty: 1
    hints:
    - हिमालय एक ... है।
    - ऊँची ज़मीन।
    solution: 'चरण 1: पर्वत ऊँचा होता है। चरण 2: पहाड़ भी वही।'
    mistakes:
      नदी: c3h15_shabd
      मैदान: c3h15_shabd
  - prompt: इनमें से भारत की नदी कौन-सी है?
    options:
    - यमुना
    - हिमालय
    - दिल्ली
    answer: यमुना
    difficulty: 1
    hints:
    - हिमालय पर्वत है, दिल्ली शहर।
    - जो बहती है।
    solution: 'चरण 1: हिमालय पर्वत, दिल्ली शहर। चरण 2: यमुना नदी।'
    mistakes:
      हिमालय: c3h15_desh
      दिल्ली: c3h15_desh
  - prompt: हम स्वतंत्रता दिवस कब मनाते हैं?
    options:
    - 15 अगस्त
    - 26 जनवरी
    - 2 अक्टूबर
    answer: 15 अगस्त
    difficulty: 2
    hints:
    - 26 जनवरी गणतंत्र दिवस है।
    - 1947 में आज़ादी मिली।
    solution: 'चरण 1: 26 जनवरी गणतंत्र दिवस, 2 अक्टूबर गांधी जयंती। चरण 2: स्वतंत्रता दिवस 15 अगस्त।'
    mistakes:
      26 जनवरी: c3h15_desh
      2 अक्टूबर: c3h15_desh
  - prompt: देश से प्रेम दिखाने का अच्छा तरीका कौन-सा है?
    options:
    - देश को साफ़ रखना और सबसे प्यार से रहना
    - सड़क पर कूड़ा फेंकना
    - दूसरों से लड़ना
    answer: देश को साफ़ रखना और सबसे प्यार से रहना
    difficulty: 2
    hints:
    - देश के लिए अच्छा क्या है?
    - दो विकल्प नुकसान करते हैं।
    solution: 'चरण 1: कूड़ा और लड़ाई देश को नुकसान पहुँचाते हैं। चरण 2: सफ़ाई और प्रेम देशप्रेम है।'
    mistakes:
      सड़क पर कूड़ा फेंकना: c3h15_desh
      दूसरों से लड़ना: c3h15_desh
  - prompt: तिरंगे में कुल कितने रंग की पट्टियाँ हैं?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - 'नाम में ही संख्या छिपी है: ''ति'' + ''रंगा''।'
    - चक्र पट्टी नहीं है।
    solution: 'चरण 1: केसरिया, सफ़ेद, हरा पट्टियाँ। चरण 2: कुल 3।'
    mistakes:
      '4': c3h15_prateek
      '2': c3h15_prateek
