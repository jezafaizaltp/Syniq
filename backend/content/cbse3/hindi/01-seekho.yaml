subject: cbse3-hin
chapter: 1
title: सीखो
tips:
  hin3_read_again: पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है।
  hin3_word: शब्द को अपने वाक्य में बोलकर देखें। क्या अर्थ ठीक बैठता है?
  hin3_lesson: 'सोचें: इस पाठ से हमें क्या सीख मिलती है?'
concepts:
- code: cbse3h.v1.seekho
  title: सीखो
  notes: |
    एक कविता जो बताती है कि हम प्रकृति से बहुत कुछ सीख सकते हैं: फूलों से हँसना, पेड़ों से देना, नदी से आगे बढ़ते रहना,
    चींटी से मेहनत। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: प्रकृति के नाम, अच्छी आदतें, तुकांत शब्द।
  explanations:
    text: यह कविता कहती है कि प्रकृति हमारी शिक्षक है। फूल हमें मुस्कुराना सिखाते हैं, पेड़ देना सिखाते हैं, नदी आगे बढ़ते रहना और चींटी मेहनत करना सिखाती है।
    visual: 'चित्र बनाइए: एक फूल, एक पेड़, एक बहती नदी और एक चींटी, और हर एक के पास लिखिए कि वह क्या सिखाता है।'
    step_by_step: 1. कविता लय से पढ़ें। 2. कौन-कौन सी चीज़ें आईं? 3. हर चीज़ क्या सिखाती है? 4. तुकांत शब्द खोजें।
    real_world: पेड़ हमें फल, छाया और लकड़ी देते हैं, बदले में कुछ नहीं माँगते।
  picture:
    kind: compare
    columns:
    - title: प्रकृति
      points:
      - फूल
      - पेड़
      - चींटी
    - title: सीख
      points:
      - मुस्कुराना
      - देना
      - मेहनत करना
    alt: फूल मुस्कुराना, पेड़ देना और चींटी मेहनत करना सिखाती है।
  items:
  - prompt: फूल हमें क्या सिखाते हैं?
    options:
    - मुस्कुराना
    - रोना
    - लड़ना
    - सोना
    answer: मुस्कुराना
    difficulty: 1
    hints:
    - फूल खिले रहते हैं।
    - खुशी।
    solution: फूल हमें मुस्कुराना सिखाते हैं।
  - prompt: चींटी से हमें क्या सीख मिलती है?
    options:
    - मेहनत करना
    - आलस करना
    - झगड़ा करना
    - चोरी करना
    answer: मेहनत करना
    difficulty: 1
    hints:
    - चींटी दिन भर काम करती है।
    - परिश्रम।
    solution: चींटी मेहनत करना सिखाती है।
    mistakes:
      आलस करना: hin3_lesson
  - prompt: पेड़ हमें क्या देते हैं?
    options:
    - फल और छाया
    - शोर
    - धुआँ
    - प्लास्टिक
    answer: फल और छाया
    difficulty: 1
    hints:
    - गर्मी में पेड़ के नीचे।
    - आम।
    solution: पेड़ फल और छाया देते हैं।
  - prompt: '''सीखो'' शब्द का अर्थ है:'
    options:
    - ज्ञान लो
    - भूल जाओ
    - सो जाओ
    - भाग जाओ
    answer: ज्ञान लो
    difficulty: 2
    hints:
    - कुछ नया जानो।
    - स्कूल में हम क्या करते हैं?
    solution: सीखो यानी कुछ नया जानो।
    mistakes:
      भूल जाओ: hin3_word
  - prompt: नदी हमें क्या सिखाती है?
    options:
    - आगे बढ़ते रहना
    - रुक जाना
    - डरना
    - गुस्सा करना
    answer: आगे बढ़ते रहना
    difficulty: 2
    hints:
    - नदी हमेशा बहती है।
    - रुकती नहीं।
    solution: नदी आगे बढ़ते रहना सिखाती है।
  - prompt: '''फूल'' का बहुवचन क्या है?'
    options:
    - फूल
    - फूलें
    - फूलो
    - फुलियाँ
    answer: फूल
    difficulty: 2
    hints:
    - एक फूल, दो ...
    - पुल्लिंग शब्द बदलता नहीं।
    solution: एक फूल, कई फूल।
