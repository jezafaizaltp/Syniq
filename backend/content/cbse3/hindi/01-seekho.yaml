subject: cbse3-hin
chapter: 1
title: सीखो
tips:
  hin3_read_again: पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है।
  hin3_word: शब्द को अपने वाक्य में बोलकर देखें। क्या अर्थ ठीक बैठता है?
  hin3_lesson: 'सोचें: इस पाठ से हमें क्या सीख मिलती है?'
  h3_nadi_seekh: "नदी के रास्ते में पत्थर आते हैं, फिर भी वह कहीं ठहरती है क्या? सोचो वह क्या करती रहती है।"
  h3_phool_bahu: "हर शब्द बहुवचन में नहीं बदलता। 'एक फूल', 'चार ___' बोलकर देखो: कान को क्या ठीक लगता है?"
  h3_phool_seekh: "खिले फूल को देखो: वह कैसा दिखता है? उसे देखकर तुम्हारे चेहरे पर क्या आता है?"
  c3h1_prakriti: 'सोचो: वह चीज़ प्रकृति में क्या करती दिखती है? उससे हम कौन-सी आदत सीख सकते हैं?'
  c3h1_tuk: दोनों शब्द ज़ोर से बोलो और सिर्फ़ आख़िरी आवाज़ सुनो।
  c3h1_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा ठीक बैठता है?
concepts:
- code: cbse3h.v1.seekho
  title: सीखो
  notes: |
    एक कविता जो बताती है कि हम प्रकृति से बहुत कुछ सीख सकते हैं: फूलों से हँसना, पेड़ों से देना, नदी से आगे बढ़ते रहना,
    चींटी से मेहनत। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: प्रकृति के नाम, अच्छी आदतें, तुकांत शब्द।
  explanations:
    text: यह कविता कहती है कि प्रकृति हमारी शिक्षक है। फूल हमें मुस्कुराना सिखाते हैं, पेड़ देना सिखाते हैं, नदी आगे बढ़ते रहना और चींटी मेहनत करना सिखाती है।
    visual: 'चित्र बनाइए: एक फूल, एक पेड़, एक बहती नदी और एक चींटी, और हर एक के पास लिखिए कि वह क्या सिखाता है।'
    step_by_step: 1. कविता लय से पढ़ें। 2. कौन-कौन सी चीज़ें आईं? 3. हर चीज़ क्या सिखाती है? 4. तुकांत शब्द खोजें।
    real_world: पेड़ हमें फल, छाया और लकड़ी देते हैं, बदले में कुछ नहीं माँगते।
  picture:
    kind: compare
    columns:
    - title: प्रकृति
      points:
      - फूल
      - पेड़
      - चींटी
    - title: सीख
      points:
      - मुस्कुराना
      - देना
      - मेहनत करना
    alt: फूल मुस्कुराना, पेड़ देना और चींटी मेहनत करना सिखाती है।
  activity:
    type: sort
    prompt: प्रकृति में किससे क्या सीखें?
    bins:
    - फूल
    - पेड़
    - नदी
    - चींटी
    items:
    - label: हँसना
      bin: फूल
      clue: खिला हुआ कौन मुस्कुराता-सा लगता है?
      why: फूल से हँसना।
    - label: देना
      bin: पेड़
      clue: फल और छाया कौन देता है?
      why: पेड़ से देना।
    - label: आगे बढ़ते रहना
      bin: नदी
      clue: कौन कभी रुके बिना बहता है?
      why: नदी से आगे बढ़ना।
    - label: मेहनत
      bin: चींटी
      clue: भारी दाना कौन उठाती है?
      why: चींटी से मेहनत।
  lesson:
    - teach: '''सीखो'' कविता कहती है कि प्रकृति हमारी शिक्षक है। फूल हँसना सिखाते हैं, पेड़ देना सिखाते हैं, नदी आगे बढ़ते रहना सिखाती है।'
      picture:
        kind: compare
        columns:
        - title: प्रकृति
          points:
          - फूल
          - पेड़
          - नदी
        - title: सीख
          points:
          - मुस्कुराना
          - देना
          - आगे बढ़ना
        alt: प्रकृति की चीज़ें और उनसे मिलने वाली सीख।
      check:
        prompt: पेड़ से हम कौन-सी आदत सीखते हैं?
        options:
        - दूसरों को देना
        - झगड़ना
        - सोते रहना
        answer: दूसरों को देना
        why: पेड़ बिना माँगे फल और छाया देते हैं।
    - teach: 'छोटे जीव भी सिखाते हैं: चींटी मेहनत करना, मधुमक्खी मिलकर काम करना, सूरज समय पर उठना। हर चीज़ से कुछ अच्छा सीखा जा सकता है।'
      check:
        prompt: सूरज रोज़ समय पर निकलता है। इससे क्या सीख मिलती है?
        options:
        - समय का पालन करना
        - देर से उठना
        - रोना
        answer: समय का पालन करना
        why: सूरज कभी देर नहीं करता।
    - teach: 'कविता में तुकांत शब्द होते हैं, जिनकी आख़िरी आवाज़ मिलती है: हँसना-बसना, देना-लेना, चलना-पलना। तुक से कविता गाने जैसी लगती है।'
      check:
        prompt: '''देना'' से तुक मिलाने वाला शब्द है:'
        options:
        - लेना
        - फूल
        - पानी
        answer: लेना
        why: दोनों के अंत में 'एना' की आवाज़ है।
  items:
  - prompt: फूल हमें क्या सिखाते हैं?
    options:
    - मुस्कुराना
    - रोना
    - लड़ना
    - सोना
    answer: मुस्कुराना
    difficulty: 1
    hints:
    - फूल खिले रहते हैं।
    - खुशी।
    solution: फूल हमें मुस्कुराना सिखाते हैं।
    mistakes: {"रोना": "h3_phool_seekh", "लड़ना": "h3_phool_seekh", "सोना": "h3_phool_seekh"}
  - prompt: चींटी से हमें क्या सीख मिलती है?
    options:
    - मेहनत करना
    - आलस करना
    - झगड़ा करना
    - चोरी करना
    answer: मेहनत करना
    difficulty: 1
    hints:
    - चींटी दिन भर काम करती है।
    - परिश्रम।
    solution: चींटी मेहनत करना सिखाती है।
    mistakes:
      आलस करना: hin3_lesson
  - prompt: पेड़ हमें क्या देते हैं?
    options:
    - फल और छाया
    - शोर
    - धुआँ
    - प्लास्टिक
    answer: फल और छाया
    difficulty: 1
    hints:
    - गर्मी में पेड़ के नीचे।
    - आम।
    solution: पेड़ फल और छाया देते हैं।
    mistakes: {"शोर": "h1_ped_dete", "धुआँ": "h1_ped_dete", "प्लास्टिक": "h1_ped_dete"}
  - prompt: '''सीखो'' शब्द का अर्थ है:'
    options:
    - ज्ञान लो
    - भूल जाओ
    - सो जाओ
    - भाग जाओ
    answer: ज्ञान लो
    difficulty: 2
    hints:
    - कुछ नया जानो।
    - स्कूल में हम क्या करते हैं?
    solution: सीखो यानी कुछ नया जानो।
    mistakes:
      भूल जाओ: hin3_word
  - prompt: नदी हमें क्या सिखाती है?
    options:
    - आगे बढ़ते रहना
    - रुक जाना
    - डरना
    - गुस्सा करना
    answer: आगे बढ़ते रहना
    difficulty: 2
    hints:
    - नदी हमेशा बहती है।
    - रुकती नहीं।
    solution: नदी आगे बढ़ते रहना सिखाती है।
    mistakes: {"रुक जाना": "h3_nadi_seekh", "डरना": "h3_nadi_seekh", "गुस्सा करना": "h3_nadi_seekh"}
  - prompt: '''फूल'' का बहुवचन क्या है?'
    options:
    - फूल
    - फूलें
    - फूलो
    - फुलियाँ
    answer: फूल
    difficulty: 2
    hints:
    - एक फूल, दो ...
    - पुल्लिंग शब्द बदलता नहीं।
    solution: एक फूल, कई फूल।
    mistakes: {"फूलें": "h3_phool_bahu", "फूलो": "h3_phool_bahu", "फुलियाँ": "h3_phool_bahu"}
  - prompt: सूरज हमें क्या सिखाता है?
    options:
    - समय पर उठना और चमकना
    - देर तक सोना
    - छिप जाना
    answer: समय पर उठना और चमकना
    difficulty: 1
    hints:
    - सूरज रोज़ कब निकलता है?
    - क्या वह कभी देर करता है?
    solution: 'चरण 1: सूरज रोज़ ठीक समय पर निकलता है। चरण 2: इससे समय पर उठना सीखते हैं।'
    mistakes:
      देर तक सोना: c3h1_prakriti
      छिप जाना: c3h1_prakriti
  - prompt: मधुमक्खियों से हम क्या सीखते हैं?
    options:
    - मिलकर काम करना
    - अकेले रहना
    - आलस करना
    answer: मिलकर काम करना
    difficulty: 1
    hints:
    - मधुमक्खियाँ छत्ता कैसे बनाती हैं?
    - क्या वे अकेले काम करती हैं?
    solution: 'चरण 1: सब मधुमक्खियाँ साथ मिलकर छत्ता बनाती हैं। चरण 2: सीख है मिलकर काम करना।'
    mistakes:
      अकेले रहना: c3h1_prakriti
      आलस करना: c3h1_prakriti
  - prompt: '''नदी'' का बहुवचन क्या है?'
    options:
    - नदियाँ
    - नदीयों
    - नदिये
    answer: नदियाँ
    difficulty: 2
    hints:
    - '''ई'' से ख़त्म होने वाले शब्द कैसे बदलते हैं?'
    - जैसे लड़की से लड़कियाँ।
    solution: 'चरण 1: ''ई'' को ''इ'' करके ''याँ'' जोड़ते हैं। चरण 2: नदियाँ।'
    mistakes:
      नदीयों: c3h1_shabd
      नदिये: c3h1_shabd
  - prompt: '''हँसना'' का उलटा क्या है?'
    options:
    - रोना
    - गाना
    - खेलना
    answer: रोना
    difficulty: 1
    hints:
    - दुख में हम क्या करते हैं?
    - खुशी का उलटा भाव।
    solution: 'चरण 1: हँसना खुशी में होता है। चरण 2: उलटा है रोना।'
    mistakes:
      गाना: c3h1_shabd
      खेलना: c3h1_shabd
  - prompt: '''चलना'' से तुक मिलाने वाला शब्द है:'
    options:
    - पलना
    - चलो
    - जाना
    answer: पलना
    difficulty: 2
    hints:
    - आख़िरी आवाज़ 'अलना' सुनो।
    - कौन-सा शब्द वैसे ही ख़त्म होता है?
    solution: 'चरण 1: चलना का अंत ''अलना''। चरण 2: पलना का अंत भी ''अलना''।'
    mistakes:
      चलो: c3h1_tuk
      जाना: c3h1_tuk
  - prompt: पर्वत ऊँचा और अटल खड़ा रहता है। इससे हमें क्या सीख मिलती है?
    options:
    - मुश्किल में भी डटे रहना
    - डरकर भागना
    - रोज़ जगह बदलना
    answer: मुश्किल में भी डटे रहना
    difficulty: 3
    hints:
    - अटल का मतलब है जो हिले नहीं।
    - आँधी आए तब भी पर्वत क्या करता है?
    solution: 'चरण 1: पर्वत आँधी-तूफ़ान में भी नहीं हिलता। चरण 2: सीख है डटे रहना।'
    mistakes:
      डरकर भागना: c3h1_prakriti
      रोज़ जगह बदलना: c3h1_prakriti
  - prompt: '''फूल'' शब्द से वाक्य: कौन-सा ठीक है?'
    options:
    - बगीचे में सुंदर फूल खिले हैं।
    - फूल ने खाना पकाया।
    - फूल स्कूल गया।
    answer: बगीचे में सुंदर फूल खिले हैं।
    difficulty: 2
    hints:
    - फूल असल में क्या करते हैं?
    - जो सच में हो सकता है, वही चुनो।
    solution: 'चरण 1: फूल खाना नहीं पकाते, स्कूल नहीं जाते। चरण 2: फूल खिलते हैं।'
    mistakes:
      फूल ने खाना पकाया।: c3h1_shabd
      फूल स्कूल गया।: c3h1_shabd
  - prompt: हवा सबको बिना भेदभाव के मिलती है। इससे हम क्या सीखते हैं?
    options:
    - सबके साथ बराबर व्यवहार करना
    - किसी से बात न करना
    - सिर्फ़ अपना सोचना
    answer: सबके साथ बराबर व्यवहार करना
    difficulty: 3
    hints:
    - हवा किसी को कम या ज़्यादा देती है क्या?
    - भेदभाव न करना।
    solution: 'चरण 1: हवा सबको एक जैसी मिलती है। चरण 2: सीख है सबसे बराबर व्यवहार।'
    mistakes:
      किसी से बात न करना: c3h1_prakriti
      सिर्फ़ अपना सोचना: c3h1_prakriti
  - prompt: '''पेड़'' का समान अर्थ वाला शब्द चुनो।'
    options:
    - तरु
    - पत्ता
    - जड़
    answer: तरु
    difficulty: 2
    hints:
    - पत्ता और जड़ पेड़ के भाग हैं।
    - पेड़ का दूसरा नाम।
    solution: 'चरण 1: पत्ता और जड़ भाग हैं। चरण 2: तरु का अर्थ पेड़ है।'
    mistakes:
      पत्ता: c3h1_shabd
      जड़: c3h1_shabd
