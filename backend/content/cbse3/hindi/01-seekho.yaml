subject: cbse3-hin
chapter: 1
title: सीखो
tips:
  hin3_read_again: पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है।
  hin3_word: शब्द को अपने वाक्य में बोलकर देखें। क्या अर्थ ठीक बैठता है?
  hin3_lesson: 'सोचें: इस पाठ से हमें क्या सीख मिलती है?'
  h3_nadi_seekh: "नदी के रास्ते में पत्थर आते हैं, फिर भी वह कहीं ठहरती है क्या? सोचो वह क्या करती रहती है।"
  h3_phool_bahu: "हर शब्द बहुवचन में नहीं बदलता। 'एक फूल', 'चार ___' बोलकर देखो: कान को क्या ठीक लगता है?"
  h3_phool_seekh: "खिले फूल को देखो: वह कैसा दिखता है? उसे देखकर तुम्हारे चेहरे पर क्या आता है?"
concepts:
- code: cbse3h.v1.seekho
  title: सीखो
  notes: |
    एक कविता जो बताती है कि हम प्रकृति से बहुत कुछ सीख सकते हैं: फूलों से हँसना, पेड़ों से देना, नदी से आगे बढ़ते रहना,
    चींटी से मेहनत। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: प्रकृति के नाम, अच्छी आदतें, तुकांत शब्द।
  explanations:
    text: यह कविता कहती है कि प्रकृति हमारी शिक्षक है। फूल हमें मुस्कुराना सिखाते हैं, पेड़ देना सिखाते हैं, नदी आगे बढ़ते रहना और चींटी मेहनत करना सिखाती है।
    visual: 'चित्र बनाइए: एक फूल, एक पेड़, एक बहती नदी और एक चींटी, और हर एक के पास लिखिए कि वह क्या सिखाता है।'
    step_by_step: 1. कविता लय से पढ़ें। 2. कौन-कौन सी चीज़ें आईं? 3. हर चीज़ क्या सिखाती है? 4. तुकांत शब्द खोजें।
    real_world: पेड़ हमें फल, छाया और लकड़ी देते हैं, बदले में कुछ नहीं माँगते।
  picture:
    kind: compare
    columns:
    - title: प्रकृति
      points:
      - फूल
      - पेड़
      - चींटी
    - title: सीख
      points:
      - मुस्कुराना
      - देना
      - मेहनत करना
    alt: फूल मुस्कुराना, पेड़ देना और चींटी मेहनत करना सिखाती है।
  activity:
    type: sort
    prompt: प्रकृति में किससे क्या सीखें?
    bins:
    - फूल
    - पेड़
    - नदी
    - चींटी
    items:
    - label: हँसना
      bin: फूल
      clue: खिला हुआ कौन मुस्कुराता-सा लगता है?
      why: फूल से हँसना।
    - label: देना
      bin: पेड़
      clue: फल और छाया कौन देता है?
      why: पेड़ से देना।
    - label: आगे बढ़ते रहना
      bin: नदी
      clue: कौन कभी रुके बिना बहता है?
      why: नदी से आगे बढ़ना।
    - label: मेहनत
      bin: चींटी
      clue: भारी दाना कौन उठाती है?
      why: चींटी से मेहनत।
  items:
  - prompt: फूल हमें क्या सिखाते हैं?
    options:
    - मुस्कुराना
    - रोना
    - लड़ना
    - सोना
    answer: मुस्कुराना
    difficulty: 1
    hints:
    - फूल खिले रहते हैं।
    - खुशी।
    solution: फूल हमें मुस्कुराना सिखाते हैं।
    mistakes: {"रोना": "h3_phool_seekh", "लड़ना": "h3_phool_seekh", "सोना": "h3_phool_seekh"}
  - prompt: चींटी से हमें क्या सीख मिलती है?
    options:
    - मेहनत करना
    - आलस करना
    - झगड़ा करना
    - चोरी करना
    answer: मेहनत करना
    difficulty: 1
    hints:
    - चींटी दिन भर काम करती है।
    - परिश्रम।
    solution: चींटी मेहनत करना सिखाती है।
    mistakes:
      आलस करना: hin3_lesson
  - prompt: पेड़ हमें क्या देते हैं?
    options:
    - फल और छाया
    - शोर
    - धुआँ
    - प्लास्टिक
    answer: फल और छाया
    difficulty: 1
    hints:
    - गर्मी में पेड़ के नीचे।
    - आम।
    solution: पेड़ फल और छाया देते हैं।
    mistakes: {"शोर": "h1_ped_dete", "धुआँ": "h1_ped_dete", "प्लास्टिक": "h1_ped_dete"}
  - prompt: '''सीखो'' शब्द का अर्थ है:'
    options:
    - ज्ञान लो
    - भूल जाओ
    - सो जाओ
    - भाग जाओ
    answer: ज्ञान लो
    difficulty: 2
    hints:
    - कुछ नया जानो।
    - स्कूल में हम क्या करते हैं?
    solution: सीखो यानी कुछ नया जानो।
    mistakes:
      भूल जाओ: hin3_word
  - prompt: नदी हमें क्या सिखाती है?
    options:
    - आगे बढ़ते रहना
    - रुक जाना
    - डरना
    - गुस्सा करना
    answer: आगे बढ़ते रहना
    difficulty: 2
    hints:
    - नदी हमेशा बहती है।
    - रुकती नहीं।
    solution: नदी आगे बढ़ते रहना सिखाती है।
    mistakes: {"रुक जाना": "h3_nadi_seekh", "डरना": "h3_nadi_seekh", "गुस्सा करना": "h3_nadi_seekh"}
  - prompt: '''फूल'' का बहुवचन क्या है?'
    options:
    - फूल
    - फूलें
    - फूलो
    - फुलियाँ
    answer: फूल
    difficulty: 2
    hints:
    - एक फूल, दो ...
    - पुल्लिंग शब्द बदलता नहीं।
    solution: एक फूल, कई फूल।
    mistakes: {"फूलें": "h3_phool_bahu", "फूलो": "h3_phool_bahu", "फुलियाँ": "h3_phool_bahu"}
