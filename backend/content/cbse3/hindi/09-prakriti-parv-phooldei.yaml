subject: cbse3-hin
chapter: 9
title: प्रकृति पर्व – फूलदेई
tips:
  h3_dehri: "बच्चे घर-घर जाकर शुभकामना देते हैं। घर में घुसने की जगह, दरवाज़े की चौखट के नीचे, क्या कहलाती है?"
  h3_phooldei: "फूलदेई फूलों का त्योहार है। साल की किस ऋतु में सबसे ज़्यादा फूल खिलते हैं?"
  h3_phooldei_badla: "बच्चे शुभकामना लेकर आते हैं; घर वाले खुश होकर उन्हें कुछ मीठा और दुआएँ देते हैं।"

concepts:
- code: cbse3h.v3.phooldei
  title: प्रकृति पर्व – फूलदेई
  notes: |
    उत्तराखंड का बाल-पर्व फूलदेई, जो चैत्र महीने की शुरुआत (मार्च) में वसंत में मनाया जाता है। बच्चे सुबह टोकरी में फूल (जैसे
    फ्यूँली, बुरांश) इकट्ठा करते हैं और घरों की देहरी पर डालते हैं, और बदले में उन्हें गुड़, चावल, आशीर्वाद मिलते हैं। सीख: प्रकृति
    का धन्यवाद, मिलजुलकर रहना।
  explanations:
    text: फूलदेई उत्तराखंड का बच्चों का त्योहार है, जो वसंत ऋतु में मनाया जाता है। बच्चे सुबह-सुबह फूल चुनते हैं और घर-घर जाकर दरवाज़े की देहरी पर फूल डालते हैं। बदले में उन्हें गुड़, चावल और आशीर्वाद मिलते हैं।
    visual: 'चित्र बनाइए: पहाड़ी गाँव, फूलों की टोकरी लिए बच्चे और घर की देहरी पर बिखरे पीले-लाल फूल।'
    step_by_step: 1. यह त्योहार कहाँ मनाया जाता है? 2. कब? 3. बच्चे क्या करते हैं? 4. उन्हें क्या मिलता है?
    real_world: भारत के हर हिस्से में फसल और ऋतु के अपने त्योहार हैं, जैसे केरल में ओणम और असम में बिहू।
  picture:
    kind: flow
    steps:
    - वसंत आता है
    - बच्चे फूल चुनते हैं
    - देहरी पर फूल डालते हैं
    - गुड़-चावल और आशीर्वाद पाते हैं
    alt: वसंत आता है, बच्चे फूल चुनते हैं, देहरी पर फूल डालते हैं, और गुड़-चावल और आशीर्वाद पाते हैं।
  activity:
    type: order
    prompt: फूलदेई के दिन बच्चे क्या करते हैं? क्रम से लगाओ।
    steps:
    - सुबह टोकरी में फूल इकट्ठा करना
    - घरों की देहरी पर फूल डालना
    - बदले में गुड़, चावल, आशीर्वाद पाना
    reasons:
      घरों की देहरी पर फूल डालना: डालने के लिए पहले फूल इकट्ठा करने होंगे।
      बदले में गुड़, चावल, आशीर्वाद पाना: फूल डालने के बदले ये मिलते हैं।
  items:
  - prompt: फूलदेई किस राज्य का त्योहार है?
    options:
    - उत्तराखंड
    - केरल
    - गुजरात
    - असम
    answer: उत्तराखंड
    difficulty: 1
    hints:
    - पहाड़ी राज्य।
    - पाठ में।
    solution: फूलदेई उत्तराखंड का त्योहार है।
    mistakes:
      केरल: hin3_read_again
