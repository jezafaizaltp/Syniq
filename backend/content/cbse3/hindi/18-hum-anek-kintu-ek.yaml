    - हम केवल एक भाषा बोलते हैं
    answer: अलग-अलग होकर भी हम सब एक हैं
    difficulty: 2
    hints:
    - अनेकता में एकता।
    - भारतीय।
    solution: अलग-अलग होकर भी हम एक हैं।
