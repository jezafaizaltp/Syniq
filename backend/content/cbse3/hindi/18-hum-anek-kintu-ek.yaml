    - और
    - क्योंकि
    - इसलिए
    answer: परंतु / लेकिन
    difficulty: 2
    hints:
    - दो उलटी बातें जोड़ता है।
    - पर।
    solution: किंतु यानी परंतु या लेकिन।
    mistakes:
