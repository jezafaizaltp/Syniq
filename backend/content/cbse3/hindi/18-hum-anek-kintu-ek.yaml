subject: cbse3-hin
chapter: 18
title: हम अनेक किंतु एक
tips:
  h3_bhasha: "फ्रेंच फ्रांस की, जापानी जापान की भाषा है। केरल में लोग कौन-सी भाषा बोलते हैं?"

concepts:
- code: cbse3h.v6.anek
  title: हम अनेक किंतु एक
  notes: |
    भारत की अनेकता में एकता पर कविता/पाठ: अलग-अलग भाषाएँ, धर्म, पहनावे, खान-पान, त्योहार, फिर भी हम सब भारतीय, एक परिवार
    की तरह। (ठीक पाठ यहाँ नहीं दिया गया है।) अभ्यास: 'अनेक' और 'एक', भाषाओं/त्योहारों के नाम, मिलजुलकर रहना।
  explanations:
    text: भारत में लोग अलग-अलग भाषाएँ बोलते हैं, अलग कपड़े पहनते हैं, अलग खाना खाते हैं और अलग त्योहार मनाते हैं। फिर भी हम सब भारतीय हैं और एक परिवार की तरह मिलकर रहते हैं। इसे अनेकता में एकता कहते हैं।
    visual: 'चित्र बनाइए: अलग-अलग पोशाकों में बच्चे हाथ पकड़कर गोला बनाए हुए, बीच में तिरंगा।'
    step_by_step: 1. पाठ पढ़ें। 2. हम किन बातों में अलग हैं? 3. किस बात में एक हैं? 4. हम मिलकर कैसे रहें?
    real_world: भारत में 22 भाषाएँ संविधान की आठवीं अनुसूची में हैं, जैसे हिंदी, मलयालम, तमिल, बांग्ला।
  picture:
    kind: compare
    columns:
    - title: अनेक (अलग-अलग)
      points:
      - भाषाएँ
      - पहनावा
      - त्योहार
    - title: एक
      points:
      - हम सब भारतीय
      - एक देश
      - एक तिरंगा
    alt: हमारी भाषाएँ, पहनावा और त्योहार अनेक हैं, पर हम सब भारतीय हैं, एक देश और एक तिरंगा।
  activity:
    type: sort
    prompt: भारत में क्या 'अनेक' है और क्या 'एक'?
    bins:
    - अनेक
    - एक
    items:
    - label: भाषाएँ
      bin: अनेक
      clue: भारत में कितनी भाषाएँ बोली जाती हैं?
      why: बहुत-सी भाषाएँ।
    - label: त्योहार
      bin: अनेक
      clue: 'ओणम, बिहू, दीवाली, ईद: कितने?'
      why: अनेक त्योहार।
    - label: पहनावे
      bin: अनेक
      clue: हर राज्य के कपड़े एक-से?
      why: अलग-अलग पहनावे।
    - label: हम सब भारतीय
      bin: एक
      clue: इतने अलग होकर भी हम क्या हैं?
      why: अनेकता में एकता।
    - label: तिरंगा
      bin: एक
      clue: सबका झंडा कितने?
      why: एक देश, एक झंडा।
  items:
  - prompt: '''अनेक'' का अर्थ है:'
    options:
    - बहुत सारे
    - केवल एक
    - कोई नहीं
    - आधा
    answer: बहुत सारे
    difficulty: 1
    hints:
