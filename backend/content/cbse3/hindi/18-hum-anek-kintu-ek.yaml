    mistakes: {"फ्रेंच": "h3_bhasha", "जापानी": "h3_bhasha", "स्पेनिश": "h3_bhasha"}
  - prompt: दूसरे धर्म के मित्र के त्योहार पर हमें क्या करना चाहिए?
    options:
    - बधाई देकर खुशी में शामिल होना
    - मज़ाक उड़ाना
    - दूर रहना
    - झगड़ना
    answer: बधाई देकर खुशी में शामिल होना
    difficulty: 2
    hints:
