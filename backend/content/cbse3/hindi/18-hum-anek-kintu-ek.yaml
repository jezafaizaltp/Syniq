subject: cbse3-hin
chapter: 18
title: हम अनेक किंतु एक
tips:
  h3_bhasha: "फ्रेंच फ्रांस की, जापानी जापान की भाषा है। केरल में लोग कौन-सी भाषा बोलते हैं?"
  c3h18_ekta: 'सोचो: अलग-अलग होकर भी हम किस बात में एक हैं?'
  c3h18_bhasha: भारत के राज्यों और वहाँ बोली जाने वाली भाषाओं को याद करो।
  c3h18_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v6.anek
  title: हम अनेक किंतु एक
  notes: |
    भारत की अनेकता में एकता पर कविता/पाठ: अलग-अलग भाषाएँ, धर्म, पहनावे, खान-पान, त्योहार, फिर भी हम सब भारतीय, एक परिवार
    की तरह। (ठीक पाठ यहाँ नहीं दिया गया है।) अभ्यास: 'अनेक' और 'एक', भाषाओं/त्योहारों के नाम, मिलजुलकर रहना।
  explanations:
    text: भारत में लोग अलग-अलग भाषाएँ बोलते हैं, अलग कपड़े पहनते हैं, अलग खाना खाते हैं और अलग त्योहार मनाते हैं। फिर भी हम सब भारतीय हैं और एक परिवार की तरह मिलकर रहते हैं। इसे अनेकता में एकता कहते हैं।
    visual: 'चित्र बनाइए: अलग-अलग पोशाकों में बच्चे हाथ पकड़कर गोला बनाए हुए, बीच में तिरंगा।'
    step_by_step: 1. पाठ पढ़ें। 2. हम किन बातों में अलग हैं? 3. किस बात में एक हैं? 4. हम मिलकर कैसे रहें?
    real_world: भारत में 22 भाषाएँ संविधान की आठवीं अनुसूची में हैं, जैसे हिंदी, मलयालम, तमिल, बांग्ला।
  picture:
    kind: compare
    columns:
    - title: अनेक (अलग-अलग)
      points:
      - भाषाएँ
      - पहनावा
      - त्योहार
    - title: एक
      points:
      - हम सब भारतीय
      - एक देश
      - एक तिरंगा
    alt: हमारी भाषाएँ, पहनावा और त्योहार अनेक हैं, पर हम सब भारतीय हैं, एक देश और एक तिरंगा।
  activity:
    type: sort
    prompt: भारत में क्या 'अनेक' है और क्या 'एक'?
    bins:
    - अनेक
    - एक
    items:
    - label: भाषाएँ
      bin: अनेक
      clue: भारत में कितनी भाषाएँ बोली जाती हैं?
      why: बहुत-सी भाषाएँ।
    - label: त्योहार
      bin: अनेक
      clue: 'ओणम, बिहू, दीवाली, ईद: कितने?'
      why: अनेक त्योहार।
    - label: पहनावे
      bin: अनेक
      clue: हर राज्य के कपड़े एक-से?
      why: अलग-अलग पहनावे।
    - label: हम सब भारतीय
      bin: एक
      clue: इतने अलग होकर भी हम क्या हैं?
      why: अनेकता में एकता।
    - label: तिरंगा
      bin: एक
      clue: सबका झंडा कितने?
      why: एक देश, एक झंडा।
  lesson:
    - teach: '''हम अनेक किंतु एक'' का अर्थ है: हम बहुत सारे और अलग-अलग हैं, फिर भी एक हैं। ''अनेक'' यानी बहुत सारे, ''किंतु'' यानी लेकिन।'
      check:
        prompt: '''किंतु'' का अर्थ क्या है?'
        options:
        - लेकिन
        - और
        - क्योंकि
        answer: लेकिन
        why: किंतु, परंतु, लेकिन तीनों एक जैसे हैं।
      ways:
      - style: visual
        teach: 'पाठ के नाम के शब्द तोड़कर समझो: हम, अनेक, किंतु, एक।'
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - हम
            - अनेक
            - किंतु
            - एक
          - title: अर्थ
            points:
            - हम सब लोग
            - बहुत सारे, अलग-अलग
            - लेकिन
            - एक साथ, एक परिवार
          alt: '''हम'' यानी हम सब लोग, ''अनेक'' यानी बहुत सारे और अलग-अलग, ''किंतु'' यानी लेकिन, और ''एक'' यानी एक साथ, एक परिवार।'
      - style: real_world
        teach: 'एक घर में भी सबकी पसंद अलग होती है: किसी को मीठा पसंद है, किसी को नमकीन; कोई सुबह जल्दी उठता है, कोई देर से। फिर भी सब एक परिवार हैं।'
    - teach: 'भारत में अलग-अलग भाषाएँ बोली जाती हैं: हिंदी, मलयालम, तमिल, बंगाली, मराठी, पंजाबी... अलग पहनावे और खाने हैं, अलग त्योहार हैं।'
      picture:
        kind: compare
        columns:
        - title: राज्य
          points:
          - केरल
          - तमिलनाडु
          - पश्चिम बंगाल
        - title: भाषा
          points:
          - मलयालम
          - तमिल
          - बंगाली
        alt: कुछ राज्य और उनकी भाषाएँ।
      check:
        prompt: केरल में कौन-सी भाषा बोली जाती है?
        options:
        - मलयालम
        - पंजाबी
        - मराठी
        answer: मलयालम
        why: केरल की भाषा मलयालम है।
      ways:
      - style: visual
        teach: भारत के कुछ राज्य और वहाँ बोली जाने वाली भाषाएँ।
        picture:
          kind: compare
          columns:
          - title: राज्य
            points:
            - केरल
            - पश्चिम बंगाल
            - महाराष्ट्र
            - गुजरात
          - title: भाषा
            points:
            - मलयालम
            - बंगाली
            - मराठी
            - गुजराती
          alt: केरल में मलयालम, पश्चिम बंगाल में बंगाली, महाराष्ट्र में मराठी और गुजरात में गुजराती बोली जाती है।
      - style: step_by_step
        teach: 'अलग-अलग भाषाओं में धन्यवाद कहना सीखो। पहला: हिंदी में ''धन्यवाद''। दूसरा: बंगाली में ''धन्नोबाद''। तीसरा: मराठी में ''धन्यवाद'' या ''आभारी आहे''। चौथा: अपनी कक्षा के दोस्तों से उनकी भाषा का शब्द पूछो।'
    - teach: इतनी अनेकता के बीच हम सब भारतीय हैं, एक परिवार की तरह। हम एक-दूसरे के त्योहारों में खुशी से शामिल होते हैं और मिलकर रहते हैं। इसे 'अनेकता में एकता' कहते हैं।
      check:
        prompt: '''अनेकता में एकता'' का मतलब है:'
        options:
        - अलग-अलग होकर भी मिलकर रहना
        - सबका एक जैसा होना ज़रूरी
        - अलग रहना
        answer: अलग-अलग होकर भी मिलकर रहना
        why: अंतर रहते हुए भी हम एक हैं।
      ways:
      - style: step_by_step
        teach: 'अपनी कक्षा में ''अनेकता में एकता'' दिवस मनाओ। पहला: हर बच्चा अपने घर का एक खाना या पहनावा बताए। दूसरा: हर बच्चा अपनी भाषा का एक शब्द सिखाए। तीसरा: सब मिलकर एक गीत गाएँ। चौथा: देखो, कितने अलग होकर भी हम एक हैं।'
      - style: visual
        teach: एक कक्षा में अनेकता भी है और एकता भी, साथ रखकर देखो।
        picture:
          kind: compare
          columns:
          - title: अनेकता
            points:
            - घर में अलग भाषाएँ
            - अलग-अलग खाना
            - अलग-अलग त्योहार
          - title: एकता
            points:
            - एक ही कक्षा
            - साथ खेलना और पढ़ना
            - एक-दूसरे के त्योहार में शामिल होना
          alt: एक कक्षा में बच्चों के घर की भाषाएँ, खाना और त्योहार अलग-अलग होते हैं, यह अनेकता है। फिर भी वे एक ही कक्षा में साथ खेलते-पढ़ते हैं और एक-दूसरे के त्योहार में शामिल होते हैं, यह एकता है।
  items:
  - prompt: '''अनेक'' का अर्थ है:'
    options:
    - बहुत सारे
    - केवल एक
    - कोई नहीं
    - आधा
    answer: बहुत सारे
    difficulty: 1
    hints:
    - एक से ज़्यादा।
    - कई।
    solution: अनेक यानी बहुत सारे।
    mistakes:
      केवल एक: hin3_word
  - prompt: '''अनेक'' का उलटा है:'
    options:
    - एक
    - कई
    - बहुत
    - सारे
    answer: एक
    difficulty: 1
    hints:
    - पाठ के नाम में।
    - अनेक किंतु ...
    solution: अनेक का उलटा एक है।
    mistakes: {"कई": "h1_ulta", "बहुत": "h1_ulta", "सारे": "h1_ulta"}
  - prompt: '''हम अनेक किंतु एक'' का अर्थ है:'
    options:
    - अलग-अलग होकर भी हम सब एक हैं
    - हम सब बिल्कुल एक जैसे हैं
    - हम कभी नहीं मिलते
    - हम केवल एक भाषा बोलते हैं
    answer: अलग-अलग होकर भी हम सब एक हैं
    difficulty: 2
    hints:
    - अनेकता में एकता।
    - भारतीय।
    solution: अलग-अलग होकर भी हम एक हैं।
    mistakes:
      हम सब बिल्कुल एक जैसे हैं: hin3_read_again
  - prompt: इनमें से कौन-सी भारत की एक भाषा है?
    options:
    - मलयालम
    - फ्रेंच
    - जापानी
    - स्पेनिश
    answer: मलयालम
    difficulty: 1
    hints:
    - केरल की भाषा।
    - भारत में।
    solution: मलयालम भारत की एक भाषा है।
    mistakes: {"फ्रेंच": "h3_bhasha", "जापानी": "h3_bhasha", "स्पेनिश": "h3_bhasha"}
  - prompt: दूसरे धर्म के मित्र के त्योहार पर हमें क्या करना चाहिए?
    options:
    - बधाई देकर खुशी में शामिल होना
    - मज़ाक उड़ाना
    - दूर रहना
    - झगड़ना
    answer: बधाई देकर खुशी में शामिल होना
    difficulty: 2
    hints:
    - मिलजुलकर रहना।
    - सम्मान।
    solution: बधाई देकर खुशी में शामिल होना चाहिए।
    mistakes:
      दूर रहना: hin3_lesson
  - prompt: '''किंतु'' का समान अर्थ वाला शब्द है:'
    options:
    - परंतु / लेकिन
    - और
    - क्योंकि
    - इसलिए
    answer: परंतु / लेकिन
    difficulty: 2
    hints:
    - दो उलटी बातें जोड़ता है।
    - पर।
    solution: किंतु यानी परंतु या लेकिन।
    mistakes:
      और: hin3_word
  - prompt: तमिलनाडु में कौन-सी भाषा बोली जाती है?
    options:
    - तमिल
    - गुजराती
    - असमिया
    answer: तमिल
    difficulty: 1
    hints:
    - राज्य के नाम में भाषा का नाम छिपा है।
    - तमिल + नाडु।
    solution: 'चरण 1: तमिलनाडु = तमिल लोगों की धरती। चरण 2: भाषा तमिल।'
    mistakes:
      गुजराती: c3h18_bhasha
      असमिया: c3h18_bhasha
  - prompt: '''एकता'' का अर्थ है:'
    options:
    - मिलकर एक रहना
    - अकेले रहना
    - झगड़ा करना
    answer: मिलकर एक रहना
    difficulty: 1
    hints:
    - '''एक'' शब्द से बना है।'
    - सब साथ।
    solution: 'चरण 1: एक + ता। चरण 2: अर्थ मिलकर एक रहना।'
    mistakes:
      अकेले रहना: c3h18_shabd
      झगड़ा करना: c3h18_shabd
  - prompt: कक्षा में अलग-अलग भाषा बोलने वाले बच्चे हैं। हमें क्या करना चाहिए?
    options:
    - सबसे दोस्ती करके एक-दूसरे की भाषा के शब्द सीखना
    - उनका मज़ाक उड़ाना
    - उनसे बात न करना
    answer: सबसे दोस्ती करके एक-दूसरे की भाषा के शब्द सीखना
    difficulty: 2
    hints:
    - अनेकता में एकता याद करो।
    - कौन-सा विकल्प सबको जोड़ता है?
    solution: 'चरण 1: मज़ाक और दूरी से मन दुखता है। चरण 2: दोस्ती और सीखना जोड़ता है।'
    mistakes:
      उनका मज़ाक उड़ाना: c3h18_ekta
      उनसे बात न करना: c3h18_ekta
  - prompt: '''नमस्ते'' को मलयालम में अक्सर कैसे कहते हैं?'
    options:
    - नमस्कारम्
    - सत श्री अकाल
    - वणक्कम
    answer: नमस्कारम्
    difficulty: 3
    hints:
    - वणक्कम तमिल में है।
    - सत श्री अकाल पंजाबी में।
    solution: 'चरण 1: वणक्कम तमिल, सत श्री अकाल पंजाबी। चरण 2: मलयालम में नमस्कारम्।'
    mistakes:
      सत श्री अकाल: c3h18_bhasha
      वणक्कम: c3h18_bhasha
  - prompt: पंजाब में कौन-सी भाषा बोली जाती है?
    options:
    - पंजाबी
    - उड़िया
    - कन्नड़
    answer: पंजाबी
    difficulty: 1
    hints:
    - राज्य और भाषा का नाम मिलता-जुलता है।
    - पंजाब → ...
    solution: 'चरण 1: पंजाब राज्य। चरण 2: भाषा पंजाबी।'
    mistakes:
      उड़िया: c3h18_bhasha
      कन्नड़: c3h18_bhasha
  - prompt: '''अलग'' का उलटा क्या है?'
    options:
    - साथ
    - दूर
    - अनेक
    answer: साथ
    difficulty: 2
    hints:
    - दूर, अलग जैसा ही है।
    - मिलकर रहना = ...
    solution: 'चरण 1: अलग यानी दूर-दूर। चरण 2: उलटा साथ।'
    mistakes:
      दूर: c3h18_shabd
      अनेक: c3h18_shabd
  - prompt: कौन-सी बात हम सब भारतीयों को जोड़ती है?
    options:
    - हमारा देश भारत और एक-दूसरे से प्रेम
    - एक जैसे कपड़े
    - एक ही खाना
    answer: हमारा देश भारत और एक-दूसरे से प्रेम
    difficulty: 2
    hints:
    - कपड़े और खाना अलग-अलग हैं।
    - फिर भी हम एक क्यों हैं?
    solution: 'चरण 1: कपड़े-खाना अलग हैं। चरण 2: देश और प्रेम हमें जोड़ते हैं।'
    mistakes:
      एक जैसे कपड़े: c3h18_ekta
      एक ही खाना: c3h18_ekta
  - prompt: एक माला में 5 लाल, 4 पीले और 3 सफ़ेद फूल हैं। कुल कितने फूल?
    answer: '12'
    check: 5+4+3
    difficulty: 2
    hints:
    - तीनों रंग जोड़ो।
