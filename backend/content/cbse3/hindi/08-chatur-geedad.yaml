subject: cbse3-hin
chapter: 8
title: चतुर गीदड़
tips:
  h3_jangal: "गीदड़, शेर, लोमड़ी जैसे जानवर पेड़ों और झाड़ियों के बीच कहाँ रहते हैं?"
  h3_panchtantra: "पंचतंत्र की कहानियाँ याद करो: चतुर गीदड़, बोलती मांद, बंदर और मगरमच्छ। उनमें बातें कौन करता है?"
  c3h8_buddhi: 'सोचो: छोटे जानवर के पास ताकत कम है, तो वह मुसीबत से कैसे बच सकता है?'
  c3h8_jaanvar: उस जानवर को उसके घर या आदत से पहचानो।
  c3h8_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v3.geedad
  title: चतुर गीदड़
  notes: |
    एक चतुर गीदड़ की कहानी (पंचतंत्र जैसी)। गीदड़ अपनी चतुराई से मुसीबत से बच जाता है या बड़े जानवर को चकमा देता है। सटीक घटनाएँ
    यहाँ नहीं दी गई हैं और सामान्य रखी गई हैं। अभ्यास: चतुर, बुद्धि, जानवरों के नाम, कहानी का क्रम, सीख: मुसीबत में घबराओ नहीं, सोचो।
  explanations:
    text: यह कहानी एक चतुर गीदड़ की है। जब गीदड़ मुसीबत में फँसता है, तो वह घबराता नहीं। वह सोचता है और अपनी बुद्धि से बच निकलता है। ताकत से बड़ी बुद्धि होती है।
    visual: 'चित्र बनाइए: जंगल में एक गीदड़, जिसके सिर पर सोचने का बादल है, और पास में एक बड़ा जानवर।'
    step_by_step: 1. कहानी में कौन-कौन है? 2. गीदड़ किस मुसीबत में है? 3. वह क्या उपाय सोचता है? 4. सीख क्या है?
    real_world: पंचतंत्र की कहानियाँ जानवरों के ज़रिए बच्चों को समझदारी सिखाती हैं।
  picture:
    kind: flow
    steps:
    - गीदड़ मुसीबत में
    - घबराता नहीं, सोचता है
    - चतुर उपाय करता है
    - बच निकलता है
    alt: गीदड़ मुसीबत में फँसता है, घबराता नहीं, चतुर उपाय करता है और बच निकलता है।
  activity:
    type: sort
    prompt: मुसीबत में चतुर गीदड़ क्या करता है?
    bins:
    - चतुर करता है
    - चतुर नहीं करता
    items:
    - label: सोचकर उपाय निकालता है
      bin: चतुर करता है
      clue: बुद्धि का उपयोग?
      why: सोचना ही चतुराई।
    - label: शांत रहता है
      bin: चतुर करता है
      clue: घबराहट में उपाय सूझता है?
      why: शांत रहकर बचता है।
    - label: डरकर रोने लगता है
      bin: चतुर नहीं करता
      clue: क्या इससे बचाव होगा?
      why: घबराने से बात बिगड़ती है।
    - label: बिना सोचे मुसीबत में कूद जाता है
      bin: चतुर नहीं करता
      clue: चतुर पहले क्या करता है?
      why: चतुर पहले सोचता है।
  lesson:
    - teach: '''चतुर गीदड़'' पंचतंत्र जैसी कहानी है। गीदड़ जंगल में रहने वाला छोटा जानवर है। कहानी में वह मुसीबत में घबराता नहीं, सोचकर उपाय निकालता है।'
      check:
        prompt: मुसीबत में घबराने की जगह क्या करना चाहिए?
        options:
        - शांत रहकर सोचना
        - रोने लगना
        - भाग जाना और कभी न लौटना
        answer: शांत रहकर सोचना
        why: शांत मन से ही उपाय सूझता है।
      ways:
      - style: visual
        teach: 'गीदड़ कैसा जानवर है: उसका रूप और उसकी आदतें।'
        picture:
          kind: compare
          columns:
          - title: रूप
            points:
            - कुत्ते जैसा
            - भूरा-सा रंग
            - झबरीली पूँछ
          - title: आदतें
            points:
            - जंगल और खेतों के पास रहता है
            - रात में ज़्यादा घूमता है
            - हुआँ-हुआँ की आवाज़ करता है
          alt: गीदड़ कुत्ते जैसा दिखता है, उसका रंग भूरा-सा और पूँछ झबरीली होती है। वह जंगल और खेतों के पास रहता है, रात में ज़्यादा घूमता है और हुआँ-हुआँ की आवाज़ करता है।
      - style: step_by_step
        teach: 'मुसीबत में गीदड़ की तरह सोचो। पहला: घबराओ मत, एक गहरी साँस लो। दूसरा: देखो कि मुसीबत क्या है। तीसरा: सोचो, बचने के कौन-कौन से रास्ते हैं। चौथा: सबसे अच्छा रास्ता चुनो।'
    - teach: पंचतंत्र की कहानियों में जानवर बोलते हैं, और हर कहानी के अंत में एक सीख होती है। इन्हें विष्णु शर्मा ने राजकुमारों को समझाने के लिए लिखा था।
      picture:
        kind: compare
        columns:
        - title: पंचतंत्र की कहानी
          points:
          - जानवर बोलते हैं
          - चतुराई की बातें
          - अंत में सीख
        - title: सीख
          points:
          - बुद्धि ताकत से बड़ी
          - घबराओ नहीं, सोचो
        alt: पंचतंत्र की कहानियों की पहचान और उनकी सीख।
      check:
        prompt: पंचतंत्र की कहानियों के अंत में क्या होता है?
        options:
        - एक सीख
        - एक गाना
        - एक पहेली का उत्तर
        answer: एक सीख
        why: हर कहानी कुछ सिखाती है।
      ways:
      - style: visual
        teach: पंचतंत्र की कहानियों की कुछ बातें, जो सब में मिलती हैं।
        picture:
          kind: flow
          steps:
          - जानवर पात्र होते हैं
          - जानवर इंसानों की तरह बोलते हैं
          - कहानी में कोई मुसीबत आती है
          - बुद्धि से हल निकलता है
          - अंत में एक सीख मिलती है
          alt: पंचतंत्र की कहानियों में जानवर पात्र होते हैं और इंसानों की तरह बोलते हैं। कहानी में कोई मुसीबत आती है, बुद्धि से हल निकलता है, और अंत में एक सीख मिलती है।
      - style: real_world
        teach: पंचतंत्र की कहानियाँ सैकड़ों साल पुरानी हैं और दुनिया की बहुत सी भाषाओं में पढ़ी जाती हैं। बंदर और मगरमच्छ की कहानी इन्हीं में से एक है।
    - teach: 'शब्द-ज्ञान: चतुर = होशियार, बुद्धिमान। उलटा: मूर्ख। कहानी का क्रम समझने के लिए पूछो: पहले क्या हुआ, फिर क्या, अंत में क्या?'
      check:
        prompt: '''बुद्धिमान'' का समान अर्थ वाला शब्द है:'
        options:
        - होशियार
        - मूर्ख
        - सुस्त
        answer: होशियार
        why: बुद्धिमान और होशियार दोनों समझदार के लिए हैं।
      ways:
      - style: step_by_step
        teach: 'कहानी का क्रम याद रखो। पहला: पूछो, शुरू में क्या हुआ? दूसरा: पूछो, फिर कौन-सी मुसीबत आई? तीसरा: पूछो, पात्र ने क्या किया? चौथा: पूछो, अंत में क्या हुआ और क्या सीख मिली?'
      - style: visual
        teach: कहानी का क्रम समझने के लिए चार सवाल, शुरू से अंत तक।
        picture:
          kind: flow
          steps:
          - शुरू में क्या हुआ?
          - फिर कौन-सी मुसीबत आई?
          - पात्र ने क्या उपाय किया?
          - अंत में क्या हुआ, और क्या सीख मिली?
          alt: 'कहानी का क्रम समझने के लिए पूछो: शुरू में क्या हुआ, फिर कौन-सी मुसीबत आई, पात्र ने क्या उपाय किया, और अंत में क्या हुआ और क्या सीख मिली।'
  items:
  - prompt: '''चतुर'' का अर्थ है:'
    options:
    - होशियार
    - मूर्ख
    - आलसी
    - डरपोक
    answer: होशियार
    difficulty: 1
    hints:
    - बुद्धिमान।
    - तेज़ दिमाग़।
    solution: चतुर यानी होशियार।
    mistakes:
      मूर्ख: hin3_word
  - prompt: गीदड़ कहाँ रहता है?
    options:
    - जंगल में
    - समुद्र में
    - आसमान में
    - स्कूल में
    answer: जंगल में
    difficulty: 1
    hints:
    - जंगली जानवर।
    - पेड़ और झाड़ियाँ।
    solution: गीदड़ जंगल में रहता है।
    mistakes: {"समुद्र में": "h3_jangal", "आसमान में": "h3_jangal", "स्कूल में": "h3_jangal"}
  - prompt: मुसीबत में गीदड़ क्या करता है?
    options:
    - सोचकर उपाय निकालता है
    - रोने लगता है
    - सो जाता है
    - हार मान लेता है
    answer: सोचकर उपाय निकालता है
    difficulty: 1
    hints:
    - वह चतुर है।
    - दिमाग़ लगाता है।
    solution: वह सोचकर उपाय निकालता है।
    mistakes:
      हार मान लेता है: hin3_read_again
  - prompt: 'इस कहानी की सीख है:'
    options:
    - बुद्धि ताकत से बड़ी है
    - हमेशा भाग जाओ
    - झगड़ा करो
    - किसी की मत सुनो
    answer: बुद्धि ताकत से बड़ी है
    difficulty: 2
    hints:
    - गीदड़ छोटा था, फिर भी बचा।
    - कैसे?
    solution: बुद्धि ताकत से बड़ी है।
    mistakes:
      हमेशा भाग जाओ: hin3_lesson
  - prompt: '''चतुर'' का उलटा क्या है?'
    options:
    - मूर्ख
    - होशियार
    - समझदार
    - तेज़
    answer: मूर्ख
    difficulty: 2
    hints:
    - होशियार नहीं।
    - उलटा अर्थ।
    solution: चतुर का उलटा मूर्ख है।
    mistakes:
      समझदार: hin3_word
  - prompt: पंचतंत्र की कहानियों में अक्सर कौन बोलते हैं?
    options:
    - जानवर
    - मशीनें
    - पहाड़
    - गाड़ियाँ
    answer: जानवर
    difficulty: 2
    hints:
    - शेर, गीदड़, बंदर।
    - जंगल की कहानियाँ।
    solution: पंचतंत्र में जानवर बोलते हैं।
    mistakes: {"मशीनें": "h3_panchtantra", "पहाड़": "h3_panchtantra", "गाड़ियाँ": "h3_panchtantra"}
  - prompt: गीदड़ किस जानवर जैसा दिखता है?
    options:
    - कुत्ते जैसा
    - मछली जैसा
    - चिड़िया जैसा
    answer: कुत्ते जैसा
    difficulty: 1
    hints:
    - उसके चार पैर और पूँछ होती है।
    - गाँव में भी दिखने वाले एक पालतू जानवर से मिलता है।
    solution: 'चरण 1: गीदड़ के चार पैर, लंबी पूँछ। चरण 2: वह कुत्ते जैसा दिखता है।'
    mistakes:
      मछली जैसा: c3h8_jaanvar
      चिड़िया जैसा: c3h8_jaanvar
  - prompt: शेर बहुत ताकतवर है, गीदड़ छोटा। फिर भी गीदड़ कैसे बच सकता है?
    options:
    - अपनी बुद्धि से
    - शेर से लड़कर
    - ज़ोर से रोकर
    answer: अपनी बुद्धि से
    difficulty: 2
    hints:
    - गीदड़ ताकत में कम है।
    - उसके पास और क्या है?
    solution: 'चरण 1: ताकत में गीदड़ हारेगा। चरण 2: बुद्धि से वह बच सकता है।'
    mistakes:
      शेर से लड़कर: c3h8_buddhi
      ज़ोर से रोकर: c3h8_buddhi
  - prompt: '''जंगल'' का समान अर्थ वाला शब्द है:'
    options:
    - वन
    - गाँव
    - नदी
    answer: वन
    difficulty: 1
    hints:
    - जहाँ बहुत पेड़ हों।
    - गाँव और नदी अलग जगहें हैं।
    solution: 'चरण 1: जंगल में घने पेड़। चरण 2: उसे वन भी कहते हैं।'
    mistakes:
      गाँव: c3h8_shabd
      नदी: c3h8_shabd
  - prompt: शेर कहाँ रहता है?
    options:
    - गुफा में
    - घोंसले में
    - पानी में
    answer: गुफा में
    difficulty: 1
    hints:
    - घोंसला पक्षी का घर है।
    - पहाड़ी में बनी जगह।
    solution: 'चरण 1: घोंसला पक्षी का, पानी मछली का। चरण 2: शेर की माँद गुफा।'
    mistakes:
      घोंसले में: c3h8_jaanvar
      पानी में: c3h8_jaanvar
  - prompt: पंचतंत्र की कहानियाँ किसने लिखीं?
    options:
    - विष्णु शर्मा
    - बीरबल
    - तेनालीराम
    answer: विष्णु शर्मा
    difficulty: 2
    hints:
    - बीरबल और तेनालीराम ख़ुद कहानियों के पात्र हैं।
    - राजकुमारों को सिखाने वाले गुरु।
    solution: 'चरण 1: बीरबल, तेनालीराम पात्र हैं। चरण 2: पंचतंत्र विष्णु शर्मा ने लिखा।'
    mistakes:
      बीरबल: c3h8_shabd
      तेनालीराम: c3h8_shabd
  - prompt: '''मुसीबत'' का समान अर्थ वाला शब्द है:'
    options:
    - संकट
    - खुशी
    - खेल
    answer: संकट
    difficulty: 2
    hints:
    - जब कोई परेशानी आ जाए।
    - खुशी इसका उलटा भाव है।
    solution: 'चरण 1: मुसीबत यानी परेशानी। चरण 2: संकट भी वही।'
    mistakes:
      खुशी: c3h8_shabd
      खेल: c3h8_shabd
  - prompt: 'कहानी में बोलने वाला गीदड़ होना बताता है कि यह कहानी:'
    options:
    - कल्पना की है
    - अख़बार की ख़बर है
    - विज्ञान का प्रयोग है
    answer: कल्पना की है
    difficulty: 2
    hints:
    - क्या असली गीदड़ बोलते हैं?
    - जो सच में न हो, वह ...
    solution: 'चरण 1: असली जानवर बोलते नहीं। चरण 2: इसलिए यह कल्पना की कहानी है।'
    mistakes:
