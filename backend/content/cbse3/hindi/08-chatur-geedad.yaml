subject: cbse3-hin
chapter: 8
title: चतुर गीदड़
tips:
  h3_jangal: "गीदड़, शेर, लोमड़ी जैसे जानवर पेड़ों और झाड़ियों के बीच कहाँ रहते हैं?"
  h3_panchtantra: "पंचतंत्र की कहानियाँ याद करो: चतुर गीदड़, बोलती मांद, बंदर और मगरमच्छ। उनमें बातें कौन करता है?"

concepts:
- code: cbse3h.v3.geedad
  title: चतुर गीदड़
  notes: |
    एक चतुर गीदड़ की कहानी (पंचतंत्र जैसी)। गीदड़ अपनी चतुराई से मुसीबत से बच जाता है या बड़े जानवर को चकमा देता है। सटीक घटनाएँ
    यहाँ नहीं दी गई हैं और सामान्य रखी गई हैं। अभ्यास: चतुर, बुद्धि, जानवरों के नाम, कहानी का क्रम, सीख: मुसीबत में घबराओ नहीं, सोचो।
  explanations:
    text: यह कहानी एक चतुर गीदड़ की है। जब गीदड़ मुसीबत में फँसता है, तो वह घबराता नहीं। वह सोचता है और अपनी बुद्धि से बच निकलता है। ताकत से बड़ी बुद्धि होती है।
    visual: 'चित्र बनाइए: जंगल में एक गीदड़, जिसके सिर पर सोचने का बादल है, और पास में एक बड़ा जानवर।'
    step_by_step: 1. कहानी में कौन-कौन है? 2. गीदड़ किस मुसीबत में है? 3. वह क्या उपाय सोचता है? 4. सीख क्या है?
    real_world: पंचतंत्र की कहानियाँ जानवरों के ज़रिए बच्चों को समझदारी सिखाती हैं।
  picture:
    kind: flow
    steps:
    - गीदड़ मुसीबत में
    - घबराता नहीं, सोचता है
    - चतुर उपाय करता है
    - बच निकलता है
    alt: गीदड़ मुसीबत में फँसता है, घबराता नहीं, चतुर उपाय करता है और बच निकलता है।
  activity:
    type: sort
    prompt: मुसीबत में चतुर गीदड़ क्या करता है?
    bins:
    - चतुर करता है
    - चतुर नहीं करता
    items:
    - label: सोचकर उपाय निकालता है
      bin: चतुर करता है
      clue: बुद्धि का उपयोग?
      why: सोचना ही चतुराई।
    - label: शांत रहता है
      bin: चतुर करता है
      clue: घबराहट में उपाय सूझता है?
      why: शांत रहकर बचता है।
    - label: डरकर रोने लगता है
      bin: चतुर नहीं करता
      clue: क्या इससे बचाव होगा?
      why: घबराने से बात बिगड़ती है।
    - label: बिना सोचे मुसीबत में कूद जाता है
      bin: चतुर नहीं करता
      clue: चतुर पहले क्या करता है?
      why: चतुर पहले सोचता है।
  items:
  - prompt: '''चतुर'' का अर्थ है:'
    options:
    - होशियार
    - मूर्ख
    - आलसी
    - डरपोक
    answer: होशियार
    difficulty: 1
    hints:
    - बुद्धिमान।
    - तेज़ दिमाग़।
    solution: चतुर यानी होशियार।
    mistakes:
      मूर्ख: hin3_word
  - prompt: गीदड़ कहाँ रहता है?
    options:
    - जंगल में
    - समुद्र में
    - आसमान में
    - स्कूल में
    answer: जंगल में
    difficulty: 1
    hints:
    - जंगली जानवर।
    - पेड़ और झाड़ियाँ।
    solution: गीदड़ जंगल में रहता है।
    mistakes: {"समुद्र में": "h3_jangal", "आसमान में": "h3_jangal", "स्कूल में": "h3_jangal"}
  - prompt: मुसीबत में गीदड़ क्या करता है?
    options:
    - सोचकर उपाय निकालता है
    - रोने लगता है
    - सो जाता है
    - हार मान लेता है
    answer: सोचकर उपाय निकालता है
    difficulty: 1
    hints:
    - वह चतुर है।
    - दिमाग़ लगाता है।
    solution: वह सोचकर उपाय निकालता है।
    mistakes:
      हार मान लेता है: hin3_read_again
  - prompt: 'इस कहानी की सीख है:'
    options:
    - बुद्धि ताकत से बड़ी है
    - हमेशा भाग जाओ
    - झगड़ा करो
    - किसी की मत सुनो
    answer: बुद्धि ताकत से बड़ी है
    difficulty: 2
    hints:
    - गीदड़ छोटा था, फिर भी बचा।
    - कैसे?
    solution: बुद्धि ताकत से बड़ी है।
    mistakes:
      हमेशा भाग जाओ: hin3_lesson
  - prompt: '''चतुर'' का उलटा क्या है?'
    options:
    - मूर्ख
    - होशियार
    - समझदार
    - तेज़
    answer: मूर्ख
    difficulty: 2
    hints:
    - होशियार नहीं।
    - उलटा अर्थ।
    solution: चतुर का उलटा मूर्ख है।
    mistakes:
      समझदार: hin3_word
  - prompt: पंचतंत्र की कहानियों में अक्सर कौन बोलते हैं?
    options:
    - जानवर
    - मशीनें
    - पहाड़
    - गाड़ियाँ
    answer: जानवर
    difficulty: 2
    hints:
    - शेर, गीदड़, बंदर।
    - जंगल की कहानियाँ।
    solution: पंचतंत्र में जानवर बोलते हैं।
    mistakes: {"मशीनें": "h3_panchtantra", "पहाड़": "h3_panchtantra", "गाड़ियाँ": "h3_panchtantra"}
