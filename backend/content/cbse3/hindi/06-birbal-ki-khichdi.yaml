    - झूठ बोलना अच्छा है
    - गरीबों की मदद मत करो
    - खिचड़ी जल्दी पकती है
    answer: बुद्धि से न्याय दिलाया जा सकता है
    difficulty: 2
    hints:
    - बीरबल ने क्या किया?
    - सच्चाई।
    solution: बुद्धि से न्याय दिलाया जा सकता है।
    mistakes:
      झूठ बोलना अच्छा है: hin3_lesson
  - prompt: खिचड़ी किससे बनती है?
    options:
    - चावल और दाल
    - आटा और चीनी
    - दूध और बर्फ़
    - फल और रस
    answer: चावल और दाल
    difficulty: 1
    hints:
    - दो अनाज।
    - पतली, नरम।
    solution: खिचड़ी चावल और दाल से बनती है।
    mistakes: {"आटा और चीनी": "h3_khichdi", "दूध और बर्फ़": "h3_khichdi", "फल और रस": "h3_khichdi"}
