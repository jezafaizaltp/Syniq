subject: cbse3-hin
chapter: 6
title: बीरबल की खिचड़ी
tips:
  h3_birbal: "बीरबल के चतुर किस्से जिस मुगल बादशाह से जुड़े हैं, उसी के नौ रत्न थे।"
  h3_birbal_handi: "बीरबल बादशाह को समझाना चाहते थे कि दूर की आग से गरमी नहीं पहुँचती। तो हाँडी आग से कितनी दूर रखी?"
  h3_birbal_thand: "कहानी की शर्त कठिन थी: रात भर ठिठुरना। इनाम तभी मिलता जब वह कहाँ टिका रहे?"
  h3_khichdi: "बीमार होने पर घर में बनने वाला नरम खाना याद करो: उसमें दो चीज़ें एक साथ उबलती हैं।"

concepts:
- code: cbse3h.v2.birbal
  title: बीरबल की खिचड़ी
  notes: |
    अकबर-बीरबल की प्रसिद्ध कहानी। अकबर ने कहा कि जो ठंडे पानी में रात भर खड़ा रहेगा उसे इनाम मिलेगा। एक गरीब आदमी रात भर
    खड़ा रहा, दूर जलते दीये को देखते हुए। अकबर ने कहा कि दीये से उसे गर्मी मिली, इसलिए इनाम नहीं। बीरबल ने बहुत ऊँचे बाँस पर
    हाँडी लटकाकर नीचे आग जलाई और कहा "खिचड़ी पक रही है"। अकबर समझ गए कि इतनी दूर की आग से गर्मी नहीं मिलती, और उस आदमी को
    इनाम दिया। सीख: न्याय, बुद्धिमानी।
  explanations:
    text: अकबर ने वादा किया कि जो ठंडे पानी में रात भर खड़ा रहेगा, उसे इनाम मिलेगा। एक गरीब आदमी खड़ा रहा, पर अकबर ने कहा कि दूर के दीये से उसे गर्मी मिली। तब बीरबल ने बहुत ऊँचाई पर हाँडी टाँगकर नीचे आग जलाई और कहा, खिचड़ी पक रही है! अकबर समझ गए और आदमी को इनाम दिया।
    visual: 'चित्र बनाइए: ऊँचे बाँस पर लटकी हाँडी, नीचे छोटी-सी आग, और हैरान अकबर।'
    step_by_step: 1. अकबर ने क्या वादा किया? 2. आदमी ने क्या किया? 3. अकबर ने इनाम क्यों नहीं दिया? 4. बीरबल ने कैसे समझाया?
    real_world: अकबर-बीरबल की कहानियाँ पूरे भारत में बच्चों को बुद्धिमानी सिखाने के लिए सुनाई जाती हैं।
  picture:
    kind: flow
    steps:
    - आदमी रात भर ठंडे पानी में खड़ा
    - 'अकबर: दीये से गर्मी मिली'
    - बीरबल की ऊँची हाँडी, नीचे आग
    - अकबर समझे, इनाम दिया
    alt: आदमी रात भर ठंडे पानी में खड़ा रहा; अकबर ने कहा दीये से गर्मी मिली; बीरबल ने ऊँची हाँडी के नीचे आग जलाई; अकबर समझे और इनाम दिया।
  items:
  - prompt: बीरबल किस बादशाह के दरबार में थे?
    options:
    - अकबर
    - अशोक
    - शिवाजी
    - बाबर
    answer: अकबर
    difficulty: 1
    hints:
    - अकबर-बीरबल।
    - मुगल बादशाह।
    solution: बीरबल अकबर के दरबार में थे।
    mistakes: {"अशोक": "h3_birbal", "शिवाजी": "h3_birbal", "बाबर": "h3_birbal"}
  - prompt: गरीब आदमी रात भर कहाँ खड़ा रहा?
    options:
    - ठंडे पानी में
    - आग के पास
    - महल में
    - पेड़ पर
    answer: ठंडे पानी में
    difficulty: 1
    hints:
    - सर्दी की रात।
    - तालाब।
    solution: वह ठंडे पानी में खड़ा रहा।
