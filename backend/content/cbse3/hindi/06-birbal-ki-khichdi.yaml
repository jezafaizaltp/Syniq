subject: cbse3-hin
chapter: 6
title: बीरबल की खिचड़ी
tips:
  h3_birbal: "बीरबल के चतुर किस्से जिस मुगल बादशाह से जुड़े हैं, उसी के नौ रत्न थे।"
  h3_birbal_handi: "बीरबल बादशाह को समझाना चाहते थे कि दूर की आग से गरमी नहीं पहुँचती। तो हाँडी आग से कितनी दूर रखी?"
  h3_birbal_thand: "कहानी की शर्त कठिन थी: रात भर ठिठुरना। इनाम तभी मिलता जब वह कहाँ टिका रहे?"
  h3_khichdi: "बीमार होने पर घर में बनने वाला नरम खाना याद करो: उसमें दो चीज़ें एक साथ उबलती हैं।"
  c3h6_kahani: 'कहानी का क्रम याद करो: शर्त, ठंडी रात, दूर का दीया, फिर बीरबल की हाँडी।'
  c3h6_buddhi: 'सोचो: बीरबल ने सीधे बहस क्यों नहीं की? उसने क्या करके दिखाया?'
  c3h6_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v2.birbal
  title: बीरबल की खिचड़ी
  notes: |
    अकबर-बीरबल की प्रसिद्ध कहानी। अकबर ने कहा कि जो ठंडे पानी में रात भर खड़ा रहेगा उसे इनाम मिलेगा। एक गरीब आदमी रात भर
    खड़ा रहा, दूर जलते दीये को देखते हुए। अकबर ने कहा कि दीये से उसे गर्मी मिली, इसलिए इनाम नहीं। बीरबल ने बहुत ऊँचे बाँस पर
    हाँडी लटकाकर नीचे आग जलाई और कहा "खिचड़ी पक रही है"। अकबर समझ गए कि इतनी दूर की आग से गर्मी नहीं मिलती, और उस आदमी को
    इनाम दिया। सीख: न्याय, बुद्धिमानी।
  explanations:
    text: अकबर ने वादा किया कि जो ठंडे पानी में रात भर खड़ा रहेगा, उसे इनाम मिलेगा। एक गरीब आदमी खड़ा रहा, पर अकबर ने कहा कि दूर के दीये से उसे गर्मी मिली। तब बीरबल ने बहुत ऊँचाई पर हाँडी टाँगकर नीचे आग जलाई और कहा, खिचड़ी पक रही है! अकबर समझ गए और आदमी को इनाम दिया।
    visual: 'चित्र बनाइए: ऊँचे बाँस पर लटकी हाँडी, नीचे छोटी-सी आग, और हैरान अकबर।'
    step_by_step: 1. अकबर ने क्या वादा किया? 2. आदमी ने क्या किया? 3. अकबर ने इनाम क्यों नहीं दिया? 4. बीरबल ने कैसे समझाया?
    real_world: अकबर-बीरबल की कहानियाँ पूरे भारत में बच्चों को बुद्धिमानी सिखाने के लिए सुनाई जाती हैं।
  picture:
    kind: flow
    steps:
    - आदमी रात भर ठंडे पानी में खड़ा
    - 'अकबर: दीये से गर्मी मिली'
    - बीरबल की ऊँची हाँडी, नीचे आग
    - अकबर समझे, इनाम दिया
    alt: आदमी रात भर ठंडे पानी में खड़ा रहा; अकबर ने कहा दीये से गर्मी मिली; बीरबल ने ऊँची हाँडी के नीचे आग जलाई; अकबर समझे और इनाम दिया।
  activity:
    type: order
    prompt: बीरबल की खिचड़ी की कहानी क्रम से लगाओ।
    steps:
    - गरीब आदमी रात भर ठंडे पानी में खड़ा रहा
    - अकबर बोले, दीये से गर्मी मिली, इनाम नहीं
    - बीरबल ने ऊँचे बाँस पर हाँडी लटकाई
    - अकबर समझे, आदमी को इनाम दिया
    reasons:
      अकबर बोले, दीये से गर्मी मिली, इनाम नहीं: आदमी के खड़े रहने के बाद ही इनाम की बात आई।
      बीरबल ने ऊँचे बाँस पर हाँडी लटकाई: अकबर की गलत बात समझाने के लिए बीरबल ने यह किया।
      अकबर समझे, आदमी को इनाम दिया: हाँडी देखकर ही अकबर को बात समझ आई।
  lesson:
    - teach: 'अकबर ने घोषणा की: जो रात भर ठंडे पानी में खड़ा रहेगा, उसे इनाम मिलेगा। एक गरीब आदमी पूरी रात खड़ा रहा। वह दूर महल में जलते एक दीये को देखता रहा।'
      check:
        prompt: इनाम पाने के लिए क्या करना था?
        options:
        - रात भर ठंडे पानी में खड़े रहना
        - दौड़ जीतना
        - गाना गाना
        answer: रात भर ठंडे पानी में खड़े रहना
        why: यही अकबर की शर्त थी।
      ways:
      - style: visual
        teach: 'कहानी की शुरुआत: अकबर की शर्त और गरीब आदमी की रात।'
        picture:
          kind: flow
          steps:
          - अकबर ने इनाम की शर्त रखी
          - गरीब आदमी ठंडे पानी में उतरा
          - रात भर वह दूर के दीये को देखता रहा
          - सुबह तक वह पानी में डटा रहा
          alt: अकबर ने इनाम की शर्त रखी। गरीब आदमी ठंडे पानी में उतरा, रात भर दूर के दीये को देखता रहा, और सुबह तक पानी में डटा रहा।
      - style: real_world
        teach: सर्दी की रात में ठंडे पानी में पाँच मिनट खड़े रहना भी बहुत मुश्किल होता है। सोचो, पूरी रात खड़े रहने में कितनी हिम्मत चाहिए।
    - teach: 'अकबर ने कहा कि दीये से उसे गर्मी मिली, इसलिए इनाम नहीं। बीरबल ने अगले दिन ऊँचे बाँस पर हाँडी टाँगी और नीचे आग जलाई। बोले: ''खिचड़ी पक रही है।'''
      picture:
        kind: flow
        steps:
        - ठंडे पानी में रात
        - दूर का दीया
        - इनाम से इनकार
        - ऊँची हाँडी, नीचे आग
        - अकबर समझे, इनाम दिया
        alt: बीरबल की खिचड़ी कहानी का क्रम।
      check:
        prompt: बीरबल की हाँडी में खिचड़ी क्यों नहीं पकी?
        options:
        - आग हाँडी से बहुत दूर थी
        - चावल नहीं थे
        - बारिश हो गई
        answer: आग हाँडी से बहुत दूर थी
        why: इतनी दूर की आग से गर्मी नहीं पहुँचती।
      ways:
      - style: step_by_step
        teach: 'बीरबल की चाल समझो। पहला: हाँडी बहुत ऊँचे बाँस पर है। दूसरा: आग नीचे ज़मीन पर है। तीसरा: इतनी दूर से आग की गर्मी हाँडी तक नहीं पहुँचती, इसलिए खिचड़ी कभी नहीं पकेगी। चौथा: वैसे ही, दूर के दीये की गर्मी आदमी तक नहीं पहुँच सकती थी।'
      - style: real_world
        teach: अगर तुम कमरे के एक कोने में मोमबत्ती जलाओ और दूसरे कोने में खड़े हो, तो तुम्हें कोई गर्मी महसूस नहीं होगी। गर्मी के लिए आग के पास होना पड़ता है।
    - teach: अकबर समझ गए कि दूर के दीये से भी गर्मी नहीं मिल सकती थी, और उन्होंने उस आदमी को इनाम दिया। बीरबल ने बिना झगड़े, बुद्धि से सच दिखाया और न्याय दिलाया।
      check:
        prompt: बीरबल ने अपनी बात कैसे समझाई?
        options:
        - करके दिखाकर
        - चिल्लाकर
        - रोकर
        answer: करके दिखाकर
        why: हाँडी का उदाहरण देखकर अकबर ख़ुद समझ गए।
      ways:
      - style: visual
        teach: झगड़े से बात सुलझाना, और बुद्धि से बात सुलझाना।
        picture:
          kind: compare
          columns:
          - title: झगड़े से
            points:
            - गुस्सा
            - चिल्लाना
            - बात और बिगड़ती है
          - title: बुद्धि से (बीरबल)
            points:
            - शांत रहना
            - सच दिखाने का तरीका सोचना
            - सबको बात समझ आती है
          alt: झगड़े में गुस्सा और चिल्लाना होता है और बात और बिगड़ती है। बीरबल की तरह बुद्धि से शांत रहकर सच दिखाने का तरीका सोचा जाता है, और सबको बात समझ आती है।
      - style: real_world
        teach: कक्षा में अगर दो बच्चे एक ही बात पर लड़ें, तो एक समझदार दोस्त दोनों की बात सुनकर, शांति से सही बात सामने रखता है, जैसे बीरबल ने किया।
  items:
  - prompt: बीरबल किस बादशाह के दरबार में थे?
    options:
    - अकबर
    - अशोक
    - शिवाजी
    - बाबर
    answer: अकबर
    difficulty: 1
    hints:
    - "बीरबल एक मुग़ल बादशाह के नौ रत्नों में से थे। वह बादशाह कौन था?"
    - मुगल बादशाह।
    solution: बीरबल अकबर के दरबार में थे।
    mistakes: {"अशोक": "h3_birbal", "शिवाजी": "h3_birbal", "बाबर": "h3_birbal"}
  - prompt: गरीब आदमी रात भर कहाँ खड़ा रहा?
    options:
    - ठंडे पानी में
    - आग के पास
    - महल में
    - पेड़ पर
    answer: ठंडे पानी में
    difficulty: 1
    hints:
    - सर्दी की रात।
    - तालाब।
    solution: वह ठंडे पानी में खड़ा रहा।
    mistakes: {"आग के पास": "h3_birbal_thand", "महल में": "h3_birbal_thand", "पेड़ पर": "h3_birbal_thand"}
  - prompt: अकबर ने इनाम क्यों नहीं दिया?
    options:
    - "उन्हें लगा दूर के दीये से गर्मी मिली"
    - "आदमी रात में पानी में ही सो गया"
    - "आदमी रात में चुपके से भाग गया"
    - "तालाब का पानी पहले से गर्म था"
    answer: उन्हें लगा दूर के दीये से गर्मी मिली
    difficulty: 2
    hints:
    - दूर एक दीया जल रहा था।
    - गर्मी।
    solution: अकबर को लगा कि दीये से गर्मी मिली।
    mistakes:
      "तालाब का पानी पहले से गर्म था": hin3_read_again
  - prompt: बीरबल ने हाँडी कहाँ टाँगी?
    options:
    - बहुत ऊँचे बाँस पर
    - आग के ठीक ऊपर, पास
    - पानी में
    - ज़मीन पर
    answer: बहुत ऊँचे बाँस पर
    difficulty: 2
    hints:
    - आग से बहुत दूर।
    - ऊँचाई।
    solution: हाँडी बहुत ऊँचे बाँस पर थी।
    mistakes: {"आग के ठीक ऊपर, पास": "h3_birbal_handi", "पानी में": "h3_birbal_handi", "ज़मीन पर": "h3_birbal_handi"}
  - prompt: इस कहानी से क्या सीख मिलती है?
    options:
    - "बुद्धि से न्याय दिलाया जा सकता है"
    - "झूठ बोलना हमेशा अच्छा होता है"
    - "कभी भी गरीबों की मदद मत करो"
    - "खिचड़ी बहुत जल्दी पक जाती है"
    answer: बुद्धि से न्याय दिलाया जा सकता है
    difficulty: 2
    hints:
    - बीरबल ने क्या किया?
    - सच्चाई।
    solution: बुद्धि से न्याय दिलाया जा सकता है।
    mistakes:
      "झूठ बोलना हमेशा अच्छा होता है": hin3_lesson
  - prompt: खिचड़ी किससे बनती है?
