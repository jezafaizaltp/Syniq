    mistakes: {"आग के ठीक ऊपर, पास": "h3_birbal_handi", "पानी में": "h3_birbal_handi", "ज़मीन पर": "h3_birbal_handi"}
  - prompt: इस कहानी से क्या सीख मिलती है?
    options:
