subject: cbse3-hin
chapter: 10
title: रस्साकशी
tips:
  h3_rassa: "खेल का नाम तोड़ो: रस्सा + कशी (खींचना)।"
  h3_rassa_team: "रस्सी के दो सिरे होते हैं, और हर सिरे पर एक टोली खींचती है।"
  c3h10_khel: 'रस्साकशी का मैदान सोचो: रस्सी, दो टीमें, बीच का निशान। जीतने के लिए क्या होना चाहिए?'
  c3h10_team: 'सोचो: अगर सब अलग-अलग समय पर खींचें तो क्या होगा?'
  c3h10_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v4.rassa
  title: रस्साकशी
  notes: |
    रस्साकशी खेल पर पाठ। दो टीमें रस्सी के दोनों सिरों को खींचती हैं; बीच में निशान होता है; जो टीम दूसरी को अपनी ओर खींच ले, वह
    जीतती है। मिलकर ज़ोर लगाना, एक साथ खींचना, खेल भावना। (ठीक पाठ यहाँ नहीं दिया गया है।)
  explanations:
    text: रस्साकशी एक खेल है जिसमें दो टीमें एक मोटी रस्सी को अपनी-अपनी ओर खींचती हैं। जो टीम बीच का निशान अपनी ओर खींच ले, वह जीतती है। इसमें मिलकर, एक साथ ज़ोर लगाना ज़रूरी है।
    visual: 'चित्र बनाइए: एक रस्सी, दोनों ओर बच्चों की टीमें, बीच में लाल निशान।'
    step_by_step: '1. दो टीमें बनाओ। 2. रस्सी पकड़ो। 3. एक साथ खींचो: हैया हो! 4. निशान जिसकी ओर जाए, वह जीते।'
    real_world: स्कूल के खेल दिवस पर रस्साकशी सबसे मज़ेदार खेलों में से एक है।
  picture:
    kind: flow
    steps:
    - दो टीमें
    - रस्सी के दोनों सिरे पकड़ो
    - एक साथ खींचो
    - निशान अपनी ओर, जीत!
    alt: दो टीमें रस्सी के दोनों सिरे पकड़ती हैं, एक साथ खींचती हैं, और जो निशान अपनी ओर कर ले वह जीतती है।
  activity:
    type: order
    prompt: रस्साकशी कैसे खेलते हैं? क्रम से लगाओ।
    steps:
    - दो टीमें बनाओ
    - रस्सी के दोनों सिरे पकड़ो, बीच में निशान
    - एक साथ ज़ोर से खींचो
    - जो टीम दूसरी को अपनी ओर खींच ले, जीती
    reasons:
      रस्सी के दोनों सिरे पकड़ो, बीच में निशान: सिरे पकड़ने के लिए पहले टीमें चाहिए।
      एक साथ ज़ोर से खींचो: पकड़ने के बाद ही खींच सकते हैं।
      जो टीम दूसरी को अपनी ओर खींच ले, जीती: जीत खींचने के बाद तय होती है।
  lesson:
    - teach: रस्साकशी में दो टीमें एक लंबी रस्सी के दोनों सिरों को पकड़कर खींचती हैं। बीच में एक निशान होता है। जो टीम निशान को अपनी ओर खींच ले, वह जीतती है।
      picture:
        kind: compare
        columns:
        - title: टीम 1
          points:
          - रस्सी का एक सिरा
          - अपनी ओर खींचे
        - title: बीच
          points:
          - निशान
        - title: टीम 2
          points:
          - रस्सी का दूसरा सिरा
          - अपनी ओर खींचे
        alt: 'रस्साकशी: दो टीमें, बीच में निशान।'
      check:
        prompt: रस्साकशी में बीच में क्या होता है?
        options:
        - एक निशान
        - एक गेंद
        - एक जाल
        answer: एक निशान
        why: निशान से पता चलता है कौन जीता।
      ways:
      - style: step_by_step
        teach: 'रस्साकशी खेलने की तैयारी करो। पहला: एक लंबी, मज़बूत रस्सी लो। दूसरा: ज़मीन पर बीच में एक लकीर खींचो और रस्सी के बीच में एक कपड़ा बाँधो। तीसरा: दोनों टीमें बराबर बच्चों की बनाओ। चौथा: ''तैयार, खींचो!'' कहकर खेल शुरू करो।'
      - style: real_world
        teach: कई गाँवों में मेलों और त्योहारों पर रस्साकशी की प्रतियोगिता होती है। पूरा गाँव इकट्ठा होकर अपनी-अपनी टीम के लिए ताली बजाता है।
    - teach: 'जीतने के लिए सबको एक साथ, एक ताल पर ज़ोर लगाना होता है: ''एक, दो, तीन, खींचो!'' अकेले ताकतवर से ज़्यादा काम आता है मिलकर खींचना।'
      check:
        prompt: रस्साकशी में टीम क्यों जीतती है?
        options:
        - सब एक साथ ज़ोर लगाते हैं
        - सब अलग-अलग समय पर खींचते हैं
        - एक ही बच्चा खींचता है
        answer: सब एक साथ ज़ोर लगाते हैं
        why: सबका ज़ोर एक साथ जुड़कर बड़ा हो जाता है।
      ways:
      - style: visual
        teach: 'एक साथ खींचना और अलग-अलग खींचना: क्या फ़र्क़ पड़ता है।'
        picture:
          kind: compare
          columns:
          - title: अलग-अलग समय पर
            points:
            - कोई अभी खींचता, कोई बाद में
            - ज़ोर बिखर जाता है
            - रस्सी आगे नहीं आती
          - title: एक साथ, एक ताल पर
            points:
            - '''एक, दो, तीन, खींचो!'''
            - सबका ज़ोर एक साथ लगता है
            - रस्सी अपनी ओर आती है
          alt: जब सब अलग-अलग समय पर खींचते हैं, तो ज़ोर बिखर जाता है और रस्सी आगे नहीं आती। जब सब 'एक, दो, तीन, खींचो!' बोलकर एक ताल पर खींचते हैं, तो सबका ज़ोर एक साथ लगता है और रस्सी अपनी ओर आती है।
      - style: real_world
        teach: मछुआरे जब किनारे पर भारी जाल खींचते हैं, तो वे एक साथ गीत गाते हैं। गीत की ताल पर सब एक साथ ज़ोर लगाते हैं, और भारी जाल भी आसानी से आ जाता है।
    - teach: 'खेल भावना: जीत में घमंड नहीं, हार में गुस्सा नहीं। हारने वाली टीम जीतने वाली को बधाई देती है, और अगली बार फिर कोशिश करती है।'
      check:
        prompt: जीतने वाली टीम को क्या करना चाहिए?
        options:
        - हारी टीम से हाथ मिलाना
        - उनका मज़ाक उड़ाना
        - रस्सी फेंक देना
        answer: हारी टीम से हाथ मिलाना
        why: यही अच्छी खेल भावना है।
      ways:
      - style: visual
        teach: 'अच्छी खेल भावना: जीतने पर और हारने पर क्या करें।'
        picture:
          kind: compare
          columns:
          - title: जीतने पर
            points:
            - घमंड न करें
            - हारने वाली टीम से हाथ मिलाएँ
          - title: हारने पर
            points:
            - गुस्सा न करें
            - जीतने वाली टीम को बधाई दें
            - अगली बार फिर कोशिश करें
          alt: जीतने पर घमंड न करें और हारने वाली टीम से हाथ मिलाएँ। हारने पर गुस्सा न करें, जीतने वाली टीम को बधाई दें और अगली बार फिर कोशिश करें।
      - style: step_by_step
        teach: 'हार के बाद क्या करें। पहला: गहरी साँस लेकर शांत हो जाओ। दूसरा: जीतने वाली टीम से हाथ मिलाकर बधाई दो। तीसरा: अपनी टीम से बात करो कि कहाँ कमी रही। चौथा: अगली बार के लिए मिलकर अभ्यास करो।'
  items:
  - prompt: रस्साकशी में किस चीज़ से खेलते हैं?
    options:
    - रस्सी
    - गेंद
    - बल्ला
    - पतंग
    answer: रस्सी
    difficulty: 1
    hints:
    - नाम में ही है।
    - रस्सा।
    solution: रस्साकशी रस्सी से खेलते हैं।
    mistakes: {"गेंद": "h3_rassa", "बल्ला": "h3_rassa", "पतंग": "h3_rassa"}
  - prompt: रस्साकशी में कितनी टीमें होती हैं?
    options:
    - दो
    - एक
    - पाँच
    - दस
    answer: दो
    difficulty: 1
    hints:
    - रस्सी के दो सिरे।
    - आमने-सामने।
    solution: दो टीमें होती हैं।
    mistakes: {"एक": "h3_rassa_team", "पाँच": "h3_rassa_team", "दस": "h3_rassa_team"}
  - prompt: रस्साकशी जीतने के लिए सबसे ज़रूरी क्या है?
    options:
    - सबका एक साथ ज़ोर लगाना
    - अकेले खींचना
    - रस्सी छोड़ देना
    - बैठ जाना
    answer: सबका एक साथ ज़ोर लगाना
    difficulty: 2
    hints:
    - टीम का काम।
    - एक साथ।
    solution: सबका एक साथ ज़ोर लगाना।
    mistakes:
      अकेले खींचना: hin3_lesson
  - prompt: '''खींचना'' का उलटा है:'
    options:
    - धकेलना
    - पकड़ना
    - उठाना
    - देखना
    answer: धकेलना
    difficulty: 2
    hints:
    - अपनी ओर नहीं, दूर।
    - ढकेलना।
    solution: खींचने का उलटा धकेलना है।
    mistakes:
      पकड़ना: hin3_word
  - prompt: हारने पर एक अच्छा खिलाड़ी क्या करता है?
    options:
    - जीतने वाली टीम को बधाई देता है
    - रोता और झगड़ता है
    - रस्सी फेंक देता है
    - खेल छोड़ देता है
    answer: जीतने वाली टीम को बधाई देता है
    difficulty: 1
    hints:
    - खेल भावना।
    - अच्छा व्यवहार।
    solution: वह जीतने वाली टीम को बधाई देता है।
    mistakes: {"रोता और झगड़ता है": "h2_khel_bhavna", "रस्सी फेंक देता है": "h2_khel_bhavna", "खेल छोड़ देता है": "h2_khel_bhavna"}
  - prompt: बीच का निशान किस ओर जाने पर टीम जीतती है?
    options:
    - अपनी ओर
    - दूसरी टीम की ओर
    - ऊपर
    - कहीं नहीं
    answer: अपनी ओर
    difficulty: 2
    hints:
    - खींचकर लाना।
    - अपनी तरफ़।
    solution: निशान अपनी ओर आने पर टीम जीतती है।
    mistakes:
      दूसरी टीम की ओर: hin3_read_again
  - prompt: रस्सी खींचते समय पैर कैसे रखने चाहिए?
    options:
    - ज़मीन पर मज़बूती से जमाकर
    - एक पैर पर खड़े होकर
    - उछलते हुए
    answer: ज़मीन पर मज़बूती से जमाकर
    difficulty: 2
    hints:
    - फिसलना नहीं है।
    - ज़ोर लगाने के लिए ठोस पकड़ चाहिए।
    solution: 'चरण 1: पैर फिसले तो टीम हार सकती है। चरण 2: पैर मज़बूती से जमाओ।'
    mistakes:
      एक पैर पर खड़े होकर: c3h10_khel
      उछलते हुए: c3h10_khel
  - prompt: '''जीत'' का उलटा क्या है?'
    options:
    - हार
    - खेल
    - टीम
    answer: हार
    difficulty: 1
    hints:
    - एक टीम जीतती है, दूसरी ...
    - खेल और टीम उलटे नहीं हैं।
    solution: 'चरण 1: जीत का दूसरा छोर। चरण 2: हार।'
    mistakes:
      खेल: c3h10_shabd
      टीम: c3h10_shabd
  - prompt: '''एक, दो, तीन, खींचो!'' बोलने से क्या फ़ायदा है?'
    options:
    - सब एक साथ खींचते हैं
    - खेल रुक जाता है
    - रस्सी लंबी हो जाती है
    answer: सब एक साथ खींचते हैं
    difficulty: 2
    hints:
    - गिनती से सबको पता चलता है कब खींचना है।
    - ताल मिलाना।
    solution: 'चरण 1: गिनती सबको एक साथ तैयार करती है। चरण 2: सब एक साथ खींचते हैं।'
    mistakes:
      खेल रुक जाता है: c3h10_team
      रस्सी लंबी हो जाती है: c3h10_team
  - prompt: हर टीम में 6 बच्चे हैं। दो टीमों में कुल कितने बच्चे?
    answer: '12'
    check: 6*2
    difficulty: 1
    hints:
    - दो टीमें, हर एक में 6।
    - 6 + 6।
    solution: 'चरण 1: 6 + 6। चरण 2: = 12 बच्चे।'
    mistakes:
      '6': c3h10_team
      '8': c3h10_team
  - prompt: '''मिलकर'' काम करने को एक शब्द में क्या कहते हैं?'
    options:
    - एकता
    - आलस
    - झगड़ा
    answer: एकता
    difficulty: 2
    hints:
    - सब एक हो जाएँ।
    - '''एक'' शब्द से बना है।'
    solution: 'चरण 1: सब एक साथ = एक। चरण 2: एकता।'
    mistakes:
      आलस: c3h10_shabd
      झगड़ा: c3h10_shabd
  - prompt: रस्साकशी खेलते समय हाथ छिल न जाएँ, इसके लिए क्या कर सकते हैं?
    options:
    - रस्सी को सही ढंग से पकड़ें और झटके से न छोड़ें
    - रस्सी को दाँत से पकड़ें
    - नंगे हाथ रस्सी पर फिसलाएँ
    answer: रस्सी को सही ढंग से पकड़ें और झटके से न छोड़ें
    difficulty: 3
    hints:
    - रस्सी तेज़ी से फिसले तो हाथ छिलते हैं।
    - सुरक्षित पकड़ कौन-सी है?
    solution: 'चरण 1: अचानक छोड़ने या फिसलने से चोट लगती है। चरण 2: सही पकड़, झटका नहीं।'
    mistakes:
      रस्सी को दाँत से पकड़ें: c3h10_khel
      नंगे हाथ रस्सी पर फिसलाएँ: c3h10_khel
  - prompt: '''रस्सी'' का बहुवचन क्या है?'
    options:
    - रस्सियाँ
    - रस्सीयाँ
    - रस्से
    answer: रस्सियाँ
    difficulty: 2
    hints:
    - '''ई'' से ख़त्म होने वाले स्त्रीलिंग शब्द।'
    - जैसे लड़की से लड़कियाँ।
    solution: 'चरण 1: ई → इ + याँ। चरण 2: रस्सियाँ।'
    mistakes:
      रस्सीयाँ: c3h10_shabd
