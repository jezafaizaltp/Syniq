subject: cbse3-hin
chapter: 10
title: रस्साकशी
tips:
  h3_rassa: "खेल का नाम तोड़ो: रस्सा + कशी (खींचना)।"
  h3_rassa_team: "रस्सी के दो सिरे होते हैं, और हर सिरे पर एक टोली खींचती है।"

concepts:
- code: cbse3h.v4.rassa
  title: रस्साकशी
  notes: |
    रस्साकशी खेल पर पाठ। दो टीमें रस्सी के दोनों सिरों को खींचती हैं; बीच में निशान होता है; जो टीम दूसरी को अपनी ओर खींच ले, वह
    जीतती है। मिलकर ज़ोर लगाना, एक साथ खींचना, खेल भावना। (ठीक पाठ यहाँ नहीं दिया गया है।)
  explanations:
    text: रस्साकशी एक खेल है जिसमें दो टीमें एक मोटी रस्सी को अपनी-अपनी ओर खींचती हैं। जो टीम बीच का निशान अपनी ओर खींच ले, वह जीतती है। इसमें मिलकर, एक साथ ज़ोर लगाना ज़रूरी है।
    visual: 'चित्र बनाइए: एक रस्सी, दोनों ओर बच्चों की टीमें, बीच में लाल निशान।'
    step_by_step: '1. दो टीमें बनाओ। 2. रस्सी पकड़ो। 3. एक साथ खींचो: हैया हो! 4. निशान जिसकी ओर जाए, वह जीते।'
    real_world: स्कूल के खेल दिवस पर रस्साकशी सबसे मज़ेदार खेलों में से एक है।
  picture:
    kind: flow
    steps:
    - दो टीमें
    - रस्सी के दोनों सिरे पकड़ो
    - एक साथ खींचो
    - निशान अपनी ओर, जीत!
    alt: दो टीमें रस्सी के दोनों सिरे पकड़ती हैं, एक साथ खींचती हैं, और जो निशान अपनी ओर कर ले वह जीतती है।
  items:
  - prompt: रस्साकशी में किस चीज़ से खेलते हैं?
    options:
    - रस्सी
    - गेंद
    - बल्ला
    - पतंग
    answer: रस्सी
    difficulty: 1
    hints:
    - नाम में ही है।
    - रस्सा।
    solution: रस्साकशी रस्सी से खेलते हैं।
    mistakes: {"गेंद": "h3_rassa", "बल्ला": "h3_rassa", "पतंग": "h3_rassa"}
  - prompt: रस्साकशी में कितनी टीमें होती हैं?
    options:
    - दो
    - एक
    - पाँच
    - दस
    answer: दो
    difficulty: 1
    hints:
    - रस्सी के दो सिरे।
    - आमने-सामने।
    solution: दो टीमें होती हैं।
    mistakes: {"एक": "h3_rassa_team", "पाँच": "h3_rassa_team", "दस": "h3_rassa_team"}
  - prompt: रस्साकशी जीतने के लिए सबसे ज़रूरी क्या है?
    options:
    - सबका एक साथ ज़ोर लगाना
    - अकेले खींचना
    - रस्सी छोड़ देना
    - बैठ जाना
    answer: सबका एक साथ ज़ोर लगाना
    difficulty: 2
    hints:
    - टीम का काम।
    - एक साथ।
    solution: सबका एक साथ ज़ोर लगाना।
    mistakes:
      अकेले खींचना: hin3_lesson
  - prompt: '''खींचना'' का उलटा है:'
    options:
    - धकेलना
    - पकड़ना
    - उठाना
    - देखना
    answer: धकेलना
    difficulty: 2
    hints:
    - अपनी ओर नहीं, दूर।
    - ढकेलना।
    solution: खींचने का उलटा धकेलना है।
    mistakes:
      पकड़ना: hin3_word
  - prompt: हारने पर एक अच्छा खिलाड़ी क्या करता है?
    options:
    - जीतने वाली टीम को बधाई देता है
    - रोता और झगड़ता है
    - रस्सी फेंक देता है
    - खेल छोड़ देता है
    answer: जीतने वाली टीम को बधाई देता है
    difficulty: 1
    hints:
    - खेल भावना।
    - अच्छा व्यवहार।
    solution: वह जीतने वाली टीम को बधाई देता है।
    mistakes: {"रोता और झगड़ता है": "h2_khel_bhavna", "रस्सी फेंक देता है": "h2_khel_bhavna", "खेल छोड़ देता है": "h2_khel_bhavna"}
  - prompt: बीच का निशान किस ओर जाने पर टीम जीतती है?
    options:
    - अपनी ओर
    - दूसरी टीम की ओर
    - ऊपर
    - कहीं नहीं
    answer: अपनी ओर
    difficulty: 2
    hints:
    - खींचकर लाना।
    - अपनी तरफ़।
    solution: निशान अपनी ओर आने पर टीम जीतती है।
    mistakes:
      दूसरी टीम की ओर: hin3_read_again
