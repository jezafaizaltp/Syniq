subject: cbse3-hin
chapter: 13
title: पेड़ों की अम्मा 'थिमक्का'
tips:
  h3_thimmakka: "पाठ का नाम ध्यान से पढ़ो। थिमक्का ने सड़क किनारे सैकड़ों क्या लगाए?"
  h3_thimmakka_paal: "लोग उन्हें 'अम्मा' क्यों कहते हैं? एक माँ अपने छोटों की देखभाल कैसे करती है?"
  h3_thimmakka_rajya: "'थिमक्का' नाम दक्षिण भारत का है। बेंगलुरु जिस राज्य की राजधानी है, वही सोचो।"
  c3h13_kahani: 'थिमक्का की कहानी याद करो: उन्होंने कहाँ, कौन-से पेड़ लगाए और उन्हें कैसे बड़ा किया?'
  c3h13_ped: 'सोचो: एक बड़ा पेड़ आसपास के लोगों और जीवों को क्या-क्या देता है?'
  c3h13_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v5.thimmakka
  title: पेड़ों की अम्मा 'थिमक्का'
  notes: |
    सालूमरदा थिमक्का (कर्नाटक) की सच्ची कहानी। उनके कोई बच्चा नहीं था, तो उन्होंने और उनके पति ने हुलिकल और कुदूर के बीच सड़क
    किनारे बरगद के सैकड़ों (लगभग 385) पेड़ लगाए और उन्हें बच्चों की तरह पाला, दूर से पानी लाकर। 'सालूमरदा' का अर्थ कन्नड़ में
    'पेड़ों की कतार'। उन्हें 2019 में पद्मश्री मिला। सीख: पेड़ लगाओ, प्रकृति से प्रेम।
  explanations:
    text: थिमक्का कर्नाटक की एक महिला हैं जिन्होंने अपने पति के साथ सड़क के किनारे सैकड़ों बरगद के पेड़ लगाए। वे दूर से पानी लाकर पेड़ों को अपने बच्चों की तरह पालती थीं। इसलिए लोग उन्हें पेड़ों की अम्मा कहते हैं।
    visual: 'चित्र बनाइए: एक लंबी सड़क, दोनों ओर बरगद के पेड़ों की कतार, और घड़े से पौधे को पानी देती एक बुज़ुर्ग महिला।'
    step_by_step: 1. थिमक्का कौन हैं? 2. उन्होंने क्या किया? 3. उन्हें 'पेड़ों की अम्मा' क्यों कहते हैं? 4. हम क्या कर सकते हैं?
    real_world: थिमक्का को 2019 में भारत सरकार ने पद्मश्री सम्मान दिया।
  picture:
    kind: flow
    steps:
    - पौधा लगाया
    - दूर से पानी लाकर सींचा
    - जानवरों से बचाया
    - बड़ा पेड़ बना
    alt: थिमक्का ने पौधा लगाया, दूर से पानी लाकर सींचा, जानवरों से बचाया, और वह बड़ा पेड़ बना।
  activity:
    type: order
    prompt: थिमक्का की कहानी क्रम से लगाओ।
    steps:
    - थिमक्का और पति ने बरगद के पौधे लगाए
    - दूर से पानी लाकर बच्चों की तरह पाला
    - सड़क किनारे पेड़ों की लंबी कतार
    - 2019 में पद्मश्री
    reasons:
      दूर से पानी लाकर बच्चों की तरह पाला: पालने के लिए पहले पौधे लगाने होंगे।
      सड़क किनारे पेड़ों की लंबी कतार: बरसों की देखभाल से पौधे पेड़ बने।
      2019 में पद्मश्री: पेड़ों की कतार देखकर ही उन्हें सम्मान मिला।
  lesson:
    - teach: सालूमरदा थिमक्का कर्नाटक की एक साधारण महिला हैं। उन्होंने और उनके पति ने सड़क किनारे बरगद के सैकड़ों पेड़ लगाए और उन्हें अपने बच्चों की तरह पाला। इसलिए लोग उन्हें 'पेड़ों की अम्मा' कहते हैं।
      check:
        prompt: थिमक्का ने पेड़ कहाँ लगाए?
        options:
        - सड़क किनारे
        - घर की छत पर
        - समुद्र में
        answer: सड़क किनारे
        why: दो गाँवों के बीच की सड़क के किनारे पेड़ लगाए गए।
      ways:
      - style: visual
        teach: थिमक्का ने एक नन्हे पौधे को बड़ा पेड़ कैसे बनाया, क्रम से।
        picture:
          kind: flow
          steps:
          - सड़क किनारे बरगद का छोटा पौधा लगाया
          - रोज़ दूर से घड़ों में पानी लाकर सींचा
          - जानवरों से बचाने के लिए काँटेदार घेरा बनाया
          - बरसों तक देखभाल की
          - पौधा घना, बड़ा पेड़ बन गया
          alt: थिमक्का ने सड़क किनारे बरगद का छोटा पौधा लगाया, रोज़ दूर से घड़ों में पानी लाकर सींचा, जानवरों से बचाने के लिए काँटेदार घेरा बनाया, बरसों तक देखभाल की, और पौधा घना, बड़ा पेड़ बन गया।
      - style: real_world
        teach: आज भी कर्नाटक में उस सड़क से गुज़रने वाले लोग गर्मी में उन बरगद के पेड़ों की छाया में रुककर आराम करते हैं, जो थिमक्का ने बरसों पहले लगाए थे।
    - teach: छोटे पौधों को रोज़ पानी चाहिए था। थिमक्का दूर से घड़ों में पानी लाकर सींचतीं, और जानवरों से बचाने के लिए काँटेदार झाड़ियों से घेरा बनातीं। धीरे-धीरे पौधे बड़े पेड़ बन गए।
      picture:
        kind: flow
        steps:
        - पौधा लगाना
        - दूर से पानी लाना
        - जानवरों से बचाना
        - बड़ा बरगद
        alt: थिमक्का ने पौधे को पेड़ कैसे बनाया।
      check:
        prompt: छोटे पौधों को जानवरों से कैसे बचाया?
        options:
        - काँटेदार झाड़ियों का घेरा बनाकर
        - उन पर रंग लगाकर
        - उन्हें घर ले जाकर
        answer: काँटेदार झाड़ियों का घेरा बनाकर
        why: घेरे से जानवर पौधे नहीं खा पाते।
      ways:
      - style: step_by_step
        teach: 'थिमक्का की तरह एक पौधा पालो। पहला: स्कूल या घर के पास पौधा लगाने की जगह चुनो। दूसरा: बड़ों की मदद से पौधा लगाओ। तीसरा: रोज़ उसे पानी दो। चौथा: उसके चारों ओर डंडियों का घेरा बनाओ, ताकि जानवर उसे न खाएँ।'
      - style: real_world
        teach: कई स्कूलों में हर बच्चा अपने जन्मदिन पर एक पौधा लगाता है और उस पर अपना नाम लिखता है। बच्चा बड़ा होता है, और साथ-साथ उसका पेड़ भी।
    - teach: '''सालूमरदा'' कन्नड़ शब्द है, जिसका अर्थ है ''पेड़ों की कतार''। थिमक्का को 2019 में पद्मश्री सम्मान मिला। उनकी सीख: पेड़ लगाओ और उनकी देखभाल करो।'
      check:
        prompt: '''सालूमरदा'' का अर्थ क्या है?'
        options:
        - पेड़ों की कतार
        - फूलों का बाग
        - नदी का किनारा
        answer: पेड़ों की कतार
        why: सड़क किनारे लगी पेड़ों की कतार से यह नाम मिला।
      ways:
      - style: visual
        teach: '''सालूमरदा'' नाम का अर्थ और थिमक्का को मिला सम्मान।'
        picture:
          kind: compare
          columns:
          - title: नाम
            points:
            - सालूमरदा
            - कन्नड़ शब्द
            - 'अर्थ: पेड़ों की कतार'
          - title: सम्मान
            points:
            - 2019 में पद्मश्री
            - लोग कहते हैं 'पेड़ों की अम्मा'
          alt: '''सालूमरदा'' कन्नड़ शब्द है, जिसका अर्थ है पेड़ों की कतार। थिमक्का को 2019 में पद्मश्री सम्मान मिला, और लोग उन्हें पेड़ों की अम्मा कहते हैं।'
      - style: real_world
        teach: थिमक्का के पास न ज़्यादा पैसे थे, न बड़ी पढ़ाई, फिर भी उनके काम को पूरे देश ने सराहा। अच्छा काम करने के लिए बड़ा आदमी होना ज़रूरी नहीं।
