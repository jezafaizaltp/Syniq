subject: cbse3-hin
chapter: 13
title: पेड़ों की अम्मा 'थिमक्का'
concepts:
- code: cbse3h.v5.thimmakka
  title: पेड़ों की अम्मा 'थिमक्का'
  notes: |
    सालूमरदा थिमक्का (कर्नाटक) की सच्ची कहानी। उनके कोई बच्चा नहीं था, तो उन्होंने और उनके पति ने हुलिकल और कुदूर के बीच सड़क
    किनारे बरगद के सैकड़ों (लगभग 385) पेड़ लगाए और उन्हें बच्चों की तरह पाला, दूर से पानी लाकर। 'सालूमरदा' का अर्थ कन्नड़ में
    'पेड़ों की कतार'। उन्हें 2019 में पद्मश्री मिला। सीख: पेड़ लगाओ, प्रकृति से प्रेम।
  explanations:
    text: थिमक्का कर्नाटक की एक महिला हैं जिन्होंने अपने पति के साथ सड़क के किनारे सैकड़ों बरगद के पेड़ लगाए। वे दूर से पानी लाकर पेड़ों को अपने बच्चों की तरह पालती थीं। इसलिए लोग उन्हें पेड़ों की अम्मा कहते हैं।
    visual: 'चित्र बनाइए: एक लंबी सड़क, दोनों ओर बरगद के पेड़ों की कतार, और घड़े से पौधे को पानी देती एक बुज़ुर्ग महिला।'
    step_by_step: 1. थिमक्का कौन हैं? 2. उन्होंने क्या किया? 3. उन्हें 'पेड़ों की अम्मा' क्यों कहते हैं? 4. हम क्या कर सकते हैं?
    real_world: थिमक्का को 2019 में भारत सरकार ने पद्मश्री सम्मान दिया।
  picture:
    kind: flow
    steps:
    - पौधा लगाया
    - दूर से पानी लाकर सींचा
    - जानवरों से बचाया
    - बड़ा पेड़ बना
    alt: थिमक्का ने पौधा लगाया, दूर से पानी लाकर सींचा, जानवरों से बचाया, और वह बड़ा पेड़ बना।
  items:
  - prompt: थिमक्का को लोग क्या कहते हैं?
    options:
    - पेड़ों की अम्मा
    - फूलों की रानी
    - नदी की बेटी
    - पहाड़ों की दादी
    answer: पेड़ों की अम्मा
    difficulty: 1
    hints:
    - पाठ का नाम।
    - पेड़ों की ...
    solution: उन्हें पेड़ों की अम्मा कहते हैं।
  - prompt: थिमक्का ने कौन-से पेड़ लगाए?
    options:
    - बरगद
    - आम
    - नारियल
    - केला
    answer: बरगद
    difficulty: 2
    hints:
    - बहुत बड़ा, घनी छाया।
    - जटाएँ लटकती हैं।
    solution: उन्होंने बरगद के पेड़ लगाए।
    mistakes:
      आम: hin3_read_again
  - prompt: थिमक्का किस राज्य की हैं?
    options:
    - कर्नाटक
    - पंजाब
    - बिहार
    - असम
    answer: कर्नाटक
    difficulty: 2
    hints:
    - दक्षिण भारत।
    - भाषा कन्नड़।
    solution: थिमक्का कर्नाटक की हैं।
  - prompt: थिमक्का पेड़ों को कैसे पालती थीं?
    options:
    - अपने बच्चों की तरह
    - बिना पानी के
    - काटकर
    - भूलकर
    answer: अपने बच्चों की तरह
    difficulty: 1
    hints:
    - बहुत प्यार से।
    - अम्मा।
    solution: बच्चों की तरह प्यार से।
  - prompt: '''अम्मा'' का अर्थ है:'
    options:
    - माँ
    - बहन
    - दादा
    - मित्र
    answer: माँ
    difficulty: 1
    hints:
    - माता।
    - मम्मी।
    solution: अम्मा यानी माँ।
    mistakes:
      बहन: hin3_word
  - prompt: थिमक्का से हम क्या सीखते हैं?
    options:
    - पेड़ लगाना और उनकी देखभाल करना
    - पेड़ काटना
    - पानी बर्बाद करना
    - सिर्फ़ बातें करना
    answer: पेड़ लगाना और उनकी देखभाल करना
    difficulty: 2
    hints:
    - उन्होंने क्या किया?
    - प्रकृति से प्रेम।
    solution: पेड़ लगाना और उनकी देखभाल करना।
    mistakes:
      पेड़ काटना: hin3_lesson
