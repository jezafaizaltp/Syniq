subject: cbse3-hin
chapter: 16
title: चंद्रयान (संवाद)
tips:
  h3_chandra: "'चंद्रमा' और 'चंदा मामा' में भी यही शब्द छिपा है। रात के आसमान में कौन दिखता है?"
  h3_chandrayaan: "चंद्रयान चाँद पर उतरा, तो जगह भी चाँद की होगी। भारत वहाँ पहुँचा जहाँ पहले कोई नहीं उतरा था: चाँद का नीचे वाला छोर।"
  h3_prashnvachak: "प्रश्नवाचक शब्द से सवाल पूछा जाता है: कौन, क्या, कब, ___? चीज़ों के नाम सवाल नहीं पूछते।"

concepts:
- code: cbse3h.v5.chandrayaan
  title: चंद्रयान (संवाद)
  notes: |
    चंद्रयान पर संवाद (बातचीत के रूप में पाठ)। इसरो (ISRO) का चंद्रयान-3, 23 अगस्त 2023 को चाँद के दक्षिणी ध्रुव के पास उतरा;
    लैंडर 'विक्रम', रोवर 'प्रज्ञान'; 23 अगस्त राष्ट्रीय अंतरिक्ष दिवस। संवाद के पात्रों के नाम यहाँ नहीं दिए गए हैं। अभ्यास: संवाद
    पढ़ना, प्रश्नवाचक शब्द, अंतरिक्ष शब्द।
  explanations:
    text: इस पाठ में बच्चे आपस में बातचीत करके चंद्रयान के बारे में जानते हैं। चंद्रयान भारत का चाँद पर भेजा गया यान है, जिसे इसरो ने बनाया। 2023 में चंद्रयान-3 चाँद के दक्षिणी ध्रुव के पास उतरा। उसके लैंडर का नाम विक्रम और रोवर का नाम प्रज्ञान था।
    visual: 'चित्र बनाइए: दो बच्चे बात कर रहे हों, उनके ऊपर बादल में रॉकेट और चाँद पर चलता छोटा रोवर।'
    step_by_step: '1. संवाद बारी-बारी से पढ़ें। 2. कौन क्या पूछता है? 3. चंद्रयान के बारे में क्या पता चला? 4. प्रश्नवाचक शब्द खोजें: क्या, कब, कहाँ।'
    real_world: 23 अगस्त को अब भारत में राष्ट्रीय अंतरिक्ष दिवस मनाया जाता है।
  picture:
    kind: flow
    steps:
    - रॉकेट श्रीहरिकोटा से उड़ा
    - चाँद तक पहुँचा
    - विक्रम लैंडर उतरा (2023)
    - प्रज्ञान रोवर चला
    alt: रॉकेट श्रीहरिकोटा से उड़ा, चाँद तक पहुँचा, 2023 में विक्रम लैंडर उतरा और प्रज्ञान रोवर चला।
  activity:
    type: sort
    prompt: चंद्रयान-3 के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: लैंडर का नाम विक्रम
      bin: सही
      clue: चाँद पर उतरने वाला भाग?
      why: लैंडर विक्रम।
    - label: रोवर का नाम प्रज्ञान
      bin: सही
      clue: चाँद पर चलने वाली छोटी गाड़ी?
      why: रोवर प्रज्ञान।
    - label: 23 अगस्त 2023 को चाँद पर उतरा
      bin: सही
      clue: राष्ट्रीय अंतरिक्ष दिवस कब है?
      why: 23 अगस्त।
    - label: सूरज के पास गया
      bin: सही नहीं
      clue: सूर्य मिशन का नाम?
      why: वह आदित्य-एल1 है।
  items:
  - prompt: '''संवाद'' का अर्थ है:'
    options:
    - बातचीत
    - कविता
    - चित्र
    - गाना
    answer: बातचीत
    difficulty: 1
    hints:
    - दो लोग बोलते हैं।
    - आपस में।
    solution: संवाद यानी बातचीत।
    mistakes:
      कविता: hin3_word
  - prompt: चंद्रयान किसने बनाया?
    options:
    - इसरो
    - एक बेकरी
    - एक स्कूल बस कंपनी
    - चिड़ियाघर
    answer: इसरो
    difficulty: 1
    hints:
    - भारतीय अंतरिक्ष अनुसंधान संगठन।
    - ISRO।
    solution: चंद्रयान इसरो ने बनाया।
    mistakes: {"एक बेकरी": "v4_isro", "एक स्कूल बस कंपनी": "v4_isro", "चिड़ियाघर": "v4_isro"}
  - prompt: 'चंद्रयान-3 के रोवर का नाम था:'
    options:
    - प्रज्ञान
    - विक्रम
    - मंगल
    - सूर्य
    answer: प्रज्ञान
    difficulty: 2
    hints:
    - लैंडर विक्रम था।
    - छोटा, पहियों वाला।
    solution: रोवर का नाम प्रज्ञान था।
    mistakes:
      विक्रम: hin3_read_again
  - prompt: चंद्रयान-3 चाँद के किस भाग के पास उतरा?
    options:
    - दक्षिणी ध्रुव
    - पृथ्वी का उत्तरी ध्रुव
    - सूरज
    - समुद्र
    answer: दक्षिणी ध्रुव
    difficulty: 2
    hints:
    - जहाँ पहले कोई नहीं उतरा था।
    - दक्षिण।
    solution: दक्षिणी ध्रुव के पास।
    mistakes: {"पृथ्वी का उत्तरी ध्रुव": "h3_chandrayaan", "सूरज": "h3_chandrayaan", "समुद्र": "h3_chandrayaan"}
  - prompt: '''चंद्र'' का अर्थ है:'
    options:
    - चाँद
    - सूरज
    - तारा
    - बादल
    answer: चाँद
    difficulty: 1
    hints:
    - चंदा मामा।
    - रात में चमकता।
    solution: चंद्र यानी चाँद।
    mistakes: {"सूरज": "h3_chandra", "तारा": "h3_chandra", "बादल": "h3_chandra"}
  - prompt: कौन-सा प्रश्नवाचक शब्द है?
    options:
    - कहाँ
    - चाँद
    - रॉकेट
    - सुंदर
    answer: कहाँ
    difficulty: 2
    hints:
    - सवाल पूछने वाला शब्द।
    - क्या, कब, ...
    solution: कहाँ प्रश्नवाचक शब्द है।
    mistakes: {"चाँद": "h3_prashnvachak", "रॉकेट": "h3_prashnvachak", "सुंदर": "h3_prashnvachak"}
