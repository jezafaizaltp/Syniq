    - गाना
    answer: बातचीत
    difficulty: 1
    hints:
    - दो लोग बोलते हैं।
    - आपस में।
    solution: संवाद यानी बातचीत।
    mistakes:
      कविता: hin3_word
  - prompt: चंद्रयान किसने बनाया?
    options:
    - इसरो
    - एक बेकरी
    - एक स्कूल बस कंपनी
    - चिड़ियाघर
    answer: इसरो
    difficulty: 1
    hints:
    - भारतीय अंतरिक्ष अनुसंधान संगठन।
    - ISRO।
