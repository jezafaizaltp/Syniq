    - रॉकेट वहाँ जाता है।
    solution: 'चरण 1: तारे, ग्रह, चाँद अंतरिक्ष में हैं। चरण 2: धरती से ऊपर और आगे।'
    mistakes:
      समुद्र के नीचे: c3h16_shabd
      ज़मीन के अंदर: c3h16_shabd
  - prompt: सही प्रश्न वाक्य कौन-सा है?
