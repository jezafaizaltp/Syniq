    - रॉकेट ज़ोर से ऊपर उड़ता है।
    - वह क्या लेकर जाता है?
    solution: 'चरण 1: यान ख़ुद धरती से नहीं उड़ सकता। चरण 2: रॉकेट उसे अंतरिक्ष ले जाता है।'
    mistakes:
      खेत जोतना: c3h16_shabd
      पानी साफ़ करना: c3h16_shabd
  - prompt: कारण पूछने के लिए कौन-सा शब्द आता है?
