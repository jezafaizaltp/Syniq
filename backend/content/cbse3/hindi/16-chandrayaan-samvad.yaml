    answer: क्यों
    difficulty: 1
    hints:
    - कौन व्यक्ति के लिए है।
    - कितना मात्रा के लिए।
    solution: 'चरण 1: कौन = व्यक्ति, कितना = मात्रा। चरण 2: क्यों = कारण।'
    mistakes:
