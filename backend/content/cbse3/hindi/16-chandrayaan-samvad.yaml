    solution: 'चरण 1: यान बनाने में सालों लगते हैं। चरण 2: बहुत-से लोग मिलकर करते हैं।'
    mistakes:
      एक व्यक्ति अकेले एक दिन में: c3h16_tathya
      अपने-आप: c3h16_tathya
