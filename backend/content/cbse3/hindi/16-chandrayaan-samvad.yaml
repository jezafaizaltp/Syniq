    - कब
    - क्यों
    answer: कहाँ
    difficulty: 1
    hints:
    - कब समय के लिए है।
    - क्यों कारण के लिए।
    solution: 'चरण 1: कब = समय, क्यों = कारण। चरण 2: कहाँ = जगह।'
    mistakes:
