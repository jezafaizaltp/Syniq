subject: cbse3-hin
chapter: 17
title: बोलने वाली मांद
concepts:
- code: cbse3h.v6.maand
  title: बोलने वाली मांद
  notes: |
    पंचतंत्र की प्रसिद्ध कथा। एक भूखा शेर एक गुफ़ा (मांद) में छिप जाता है, जो एक गीदड़ का घर है। गीदड़ लौटकर पैरों के निशान
    देखता है जो अंदर जाते हैं पर बाहर नहीं आते। वह पुकारता है, "ओ मांद! आज बोलती क्यों नहीं?" शेर सोचता है मांद रोज़ बोलती होगी,
    और जवाब दे देता है। गीदड़ समझ जाता है और भाग जाता है। सीख: सावधानी और सूझबूझ।
  explanations:
    text: एक भूखा शेर गीदड़ की मांद में छिप गया। गीदड़ ने लौटकर देखा कि पैरों के निशान अंदर गए हैं, बाहर नहीं आए। उसने पुकारा, ओ मांद, आज बोलती क्यों नहीं? शेर ने सोचा मांद रोज़ बोलती होगी और जवाब दे दिया। गीदड़ समझ गया और भाग गया!
    visual: 'चित्र बनाइए: गुफ़ा के अंदर छिपा शेर, बाहर पैरों के निशान देखता गीदड़।'
    step_by_step: 1. शेर ने क्या किया? 2. गीदड़ ने क्या देखा? 3. गीदड़ ने कौन-सी चाल चली? 4. अंत में क्या हुआ?
    real_world: यह कहानी पंचतंत्र से है, जिसे विष्णु शर्मा ने लिखा माना जाता है।
  picture:
    kind: flow
    steps:
    - शेर मांद में छिपा
    - गीदड़ ने निशान देखे
    - 'गीदड़: ओ मांद, बोलो!'
    - शेर बोला, गीदड़ भागा
    alt: शेर मांद में छिपा, गीदड़ ने निशान देखे और पुकारा, शेर बोल पड़ा और गीदड़ भाग गया।
  items:
  - prompt: '''मांद'' का अर्थ है:'
    options:
    - गुफ़ा / जानवर का घर
    - नदी
    - पेड़
    - मैदान
    answer: गुफ़ा / जानवर का घर
    difficulty: 1
    hints:
    - जहाँ जानवर रहते हैं।
    - गुफ़ा।
    solution: मांद यानी जानवर का घर या गुफ़ा।
    mistakes:
      नदी: hin3_word
  - prompt: मांद में कौन छिपा था?
    options:
    - शेर
    - खरगोश
    - हिरन
    - बंदर
    answer: शेर
    difficulty: 1
    hints:
    - भूखा जानवर।
    - जंगल का राजा।
    solution: मांद में शेर छिपा था।
  - prompt: गीदड़ को कैसे पता चला कि अंदर कोई है?
    options:
    - पैरों के निशान अंदर गए थे, बाहर नहीं आए
    - उसने शेर को देख लिया
    - किसी ने बताया
    - मांद का दरवाज़ा बंद था
    answer: पैरों के निशान अंदर गए थे, बाहर नहीं आए
    difficulty: 2
    hints:
    - ज़मीन पर देखें।
    - निशान।
    solution: पैरों के निशान अंदर गए थे, बाहर नहीं आए।
    mistakes:
      उसने शेर को देख लिया: hin3_read_again
  - prompt: शेर ने जवाब क्यों दिया?
    options:
    - उसे लगा मांद रोज़ बोलती होगी
    - वह गाना चाहता था
    - उसे गीदड़ पसंद था
    - वह सो रहा था
    answer: उसे लगा मांद रोज़ बोलती होगी
    difficulty: 2
    hints:
    - गीदड़ ने क्या कहा था?
    - आज बोलती क्यों नहीं?
    solution: शेर को लगा मांद रोज़ बोलती है।
  - prompt: इस कहानी से क्या सीख मिलती है?
    options:
    - सावधानी और सूझबूझ से जान बचती है
    - बिना सोचे अंदर चले जाओ
    - शेर से दोस्ती करो
    - हमेशा सोते रहो
    answer: सावधानी और सूझबूझ से जान बचती है
    difficulty: 2
    hints:
    - गीदड़ कैसे बचा?
    - ध्यान से देखो।
    solution: सावधानी और सूझबूझ से जान बचती है।
    mistakes:
      बिना सोचे अंदर चले जाओ: hin3_lesson
  - prompt: यह कहानी किस प्रसिद्ध पुस्तक से है?
    options:
    - पंचतंत्र
    - रामायण
    - गणित की किताब
    - शब्दकोश
    answer: पंचतंत्र
    difficulty: 1
    hints:
    - जानवरों की कहानियाँ।
    - पाँच तंत्र।
    solution: यह पंचतंत्र की कहानी है।
