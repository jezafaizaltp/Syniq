subject: cbse3-hin
chapter: 17
title: बोलने वाली मांद
tips:
  h3_panch_kitab: "जानवरों की ऐसी शिक्षा भरी कहानियाँ विष्णु शर्मा ने राजकुमारों के लिए लिखीं: पाँच भागों वाली एक किताब।"
  h3_maand_chal: "गीदड़ ने चाल चली: 'मांद, आज तुम चुप क्यों हो?' यह सुनकर छिपे हुए जानवर ने क्या मान लिया होगा?"
  h3_maand_sher: "मांद किस बड़े शिकारी जानवर का घर होता है? गीदड़ उसी से बचना चाहता था।"
  c3h17_chal: "ज़मीन पर दिखे सबूत के बारे में सोचो: वह किस ओर जा रहा था, और क्या कोई लौटा?"
  c3h17_seekh: "सोचो: कहानी में किसने आँख-कान खुले रखे और जल्दबाज़ी के बजाय सोचकर काम किया?"
  c3h17_shabd: हर विकल्प को वाक्य में रखकर पढ़ो।

concepts:
- code: cbse3h.v6.maand
  title: बोलने वाली मांद
  notes: |
    पंचतंत्र की प्रसिद्ध कथा। एक भूखा शेर एक गुफ़ा (मांद) में छिप जाता है, जो एक गीदड़ का घर है। गीदड़ लौटकर पैरों के निशान
    देखता है जो अंदर जाते हैं पर बाहर नहीं आते। वह पुकारता है, "ओ मांद! आज बोलती क्यों नहीं?" शेर सोचता है मांद रोज़ बोलती होगी,
    और जवाब दे देता है। गीदड़ समझ जाता है और भाग जाता है। सीख: सावधानी और सूझबूझ।
  explanations:
    text: एक भूखा शेर गीदड़ की मांद में छिप गया। गीदड़ ने लौटकर देखा कि पैरों के निशान अंदर गए हैं, बाहर नहीं आए। उसने पुकारा, ओ मांद, आज बोलती क्यों नहीं? शेर ने सोचा मांद रोज़ बोलती होगी और जवाब दे दिया। गीदड़ समझ गया और भाग गया!
    visual: 'चित्र बनाइए: गुफ़ा के अंदर छिपा शेर, बाहर पैरों के निशान देखता गीदड़।'
    step_by_step: 1. शेर ने क्या किया? 2. गीदड़ ने क्या देखा? 3. गीदड़ ने कौन-सी चाल चली? 4. अंत में क्या हुआ?
    real_world: यह कहानी पंचतंत्र से है, जिसे विष्णु शर्मा ने लिखा माना जाता है।
  picture:
    kind: flow
    steps:
    - शेर मांद में छिपा
    - गीदड़ ने निशान देखे
    - 'गीदड़: ओ मांद, बोलो!'
    - शेर बोला, गीदड़ भागा
    alt: शेर मांद में छिपा, गीदड़ ने निशान देखे और पुकारा, शेर बोल पड़ा और गीदड़ भाग गया।
  activity:
    type: order
    prompt: बोलने वाली मांद की कहानी क्रम से लगाओ।
    steps:
    - भूखा शेर गीदड़ की मांद में छिपता है
    - गीदड़ अंदर जाते पैरों के निशान देखता है
    - '"ओ मांद! आज बोलती क्यों नहीं?"'
    - शेर जवाब दे देता है
    - गीदड़ समझकर भाग जाता है
    reasons:
      गीदड़ अंदर जाते पैरों के निशान देखता है: निशान तभी बने जब शेर अंदर गया।
      '"ओ मांद! आज बोलती क्यों नहीं?"': निशान देखकर ही गीदड़ को शक हुआ।
      शेर जवाब दे देता है: गीदड़ के पुकारने पर ही शेर बोला।
      गीदड़ समझकर भाग जाता है: मांद से आवाज़ आई, तब वह समझा।
  lesson:
    - teach: '''बोलने वाली मांद'' पंचतंत्र की कहानी है। एक भूखा शेर शिकार न मिलने पर एक गुफ़ा (मांद) में छिप जाता है। यह मांद एक गीदड़ का घर है। शेर सोचता है: गीदड़ लौटेगा तो उसे खा लूँगा।'
      check:
        prompt: शेर मांद में क्यों छिपा?
        options:
        - गीदड़ का शिकार करने के लिए
        - बारिश से बचने के लिए
        - सोने के लिए
        answer: गीदड़ का शिकार करने के लिए
        why: शेर भूखा था और गीदड़ के लौटने का इंतज़ार कर रहा था।
      ways:
      - style: visual
        teach: 'कहानी के दो पात्र: शेर और गीदड़, और उनकी सोच।'
        picture:
          kind: compare
          columns:
          - title: शेर
            points:
            - ताकतवर, पर भूखा
            - गीदड़ की मांद में छिप गया
            - 'सोचा: गीदड़ लौटेगा तो खा लूँगा'
          - title: गीदड़
            points:
            - छोटा, पर चतुर
            - शाम को अपनी मांद लौटा
            - जल्दबाज़ी नहीं की, ध्यान से देखा
          alt: शेर ताकतवर पर भूखा था, गीदड़ की मांद में छिप गया और सोचा कि गीदड़ लौटेगा तो उसे खा लेगा। गीदड़ छोटा पर चतुर था, शाम को अपनी मांद लौटा, और जल्दबाज़ी करने के बजाय ध्यान से देखा।
      - style: real_world
        teach: जंगल में कई जानवर दिन भर बाहर भोजन ढूँढते हैं और शाम को अपनी गुफ़ा या बिल में लौटते हैं। इसलिए किसी और के घर में छिपकर इंतज़ार करना शेर की चाल थी।
    - teach: 'गीदड़ लौटा तो उसने देखा कि शेर के पैरों के निशान अंदर गए हैं, पर बाहर नहीं आए। उसने सोचा: अंदर कोई है। तब उसने एक चाल चली।'
      picture:
        kind: compare
        columns:
        - title: निशान अंदर
          points:
          - हाँ, दिखे
        - title: निशान बाहर
          points:
          - नहीं दिखे
        - title: मतलब
          points:
          - कोई अंदर है
        alt: पैरों के निशान से गीदड़ ने ख़तरा पहचाना।
      check:
        prompt: निशान अंदर गए, बाहर नहीं आए। इसका मतलब?
        options:
        - कोई अभी अंदर है
        - मांद ख़ाली है
        - बारिश हुई
        answer: कोई अभी अंदर है
        why: जो अंदर गया और बाहर नहीं आया, वह अंदर ही है।
      ways:
      - style: step_by_step
        teach: 'सबूत देखकर सोचो, जैसे गीदड़ ने सोचा। पहला: ज़मीन पर पैरों के निशान देखो। दूसरा: देखो वे किस ओर जा रहे हैं: अंदर। तीसरा: देखो क्या कोई निशान बाहर आया: नहीं। चौथा: नतीजा निकालो: जो अंदर गया, वह अभी अंदर ही है।'
      - style: real_world
        teach: गीली मिट्टी या रेत पर चलने से पैरों के निशान बनते हैं। वन विभाग के लोग बाघ के पंजों के निशान देखकर बताते हैं कि बाघ किस ओर गया।
    - teach: 'गीदड़ ने पुकारा: ''ओ मांद! आज बोलती क्यों नहीं?'' शेर ने सोचा मांद रोज़ बोलती होगी, और जवाब दे दिया। गीदड़ समझ गया और भाग गया। सीख: सावधानी और सूझबूझ से जान बचती है।'
      check:
        prompt: शेर की आवाज़ सुनकर गीदड़ ने क्या किया?
        options:
        - भाग गया
        - अंदर चला गया
        - सो गया
        answer: भाग गया
        why: उसे पता चल गया कि अंदर शेर है।
      ways:
      - style: visual
        teach: गीदड़ ने कौन-सी चाल चली, एक-एक कदम क्रम से।
        picture:
          kind: flow
          steps:
          - 'गीदड़ ने मांद को पुकारा: ''ओ मांद! आज बोलती क्यों नहीं?'''
          - शेर ने सोचा मांद रोज़ बोलती होगी
          - शेर ने मांद बनकर जवाब दे दिया
          - गीदड़ समझ गया कि अंदर शेर है
          - गीदड़ भाग गया और बच गया
          alt: 'गीदड़ ने पुकारा: ओ मांद, आज बोलती क्यों नहीं? शेर ने सोचा कि मांद रोज़ बोलती होगी और मांद बनकर जवाब दे दिया। गीदड़ समझ गया कि अंदर शेर है, और भागकर बच गया।'
      - style: real_world
        teach: घर में अकेले होने पर अगर कोई अनजान व्यक्ति दरवाज़ा खटखटाए, तो समझदार बच्चा बिना देखे दरवाज़ा नहीं खोलता, पहले खिड़की से देखता है या बड़ों को फ़ोन करता है।
  items:
  - prompt: '''मांद'' का अर्थ है:'
    options:
    - गुफ़ा / जानवर का घर
    - नदी
    - पेड़
    - मैदान
    answer: गुफ़ा / जानवर का घर
    difficulty: 1
    hints:
    - जहाँ जानवर रहते हैं।
    - गुफ़ा।
    solution: मांद यानी जानवर का घर या गुफ़ा।
    mistakes:
      नदी: hin3_word
  - prompt: मांद में कौन छिपा था?
    options:
    - शेर
    - खरगोश
    - हिरन
    - बंदर
    answer: शेर
    difficulty: 1
    hints:
    - भूखा जानवर।
    - जंगल का राजा।
    solution: मांद में शेर छिपा था।
    mistakes: {"खरगोश": "h3_maand_sher", "हिरन": "h3_maand_sher", "बंदर": "h3_maand_sher"}
  - prompt: गीदड़ को कैसे पता चला कि अंदर कोई है?
    options:
    - पैरों के निशान अंदर गए थे, बाहर नहीं आए
    - उसने शेर को देख लिया
    - किसी ने बताया
    - मांद का दरवाज़ा बंद था
    answer: पैरों के निशान अंदर गए थे, बाहर नहीं आए
    difficulty: 2
    hints:
    - ज़मीन पर देखें।
    - निशान।
    solution: पैरों के निशान अंदर गए थे, बाहर नहीं आए।
    mistakes:
      उसने शेर को देख लिया: hin3_read_again
  - prompt: शेर ने जवाब क्यों दिया?
    options:
    - उसे लगा मांद रोज़ बोलती होगी
    - वह गाना चाहता था
    - उसे गीदड़ पसंद था
    - वह सो रहा था
    answer: उसे लगा मांद रोज़ बोलती होगी
    difficulty: 2
    hints:
    - गीदड़ ने क्या कहा था?
    - आज बोलती क्यों नहीं?
    solution: शेर को लगा मांद रोज़ बोलती है।
    mistakes: {"वह गाना चाहता था": "h3_maand_chal", "उसे गीदड़ पसंद था": "h3_maand_chal", "वह सो रहा था": "h3_maand_chal"}
  - prompt: इस कहानी से क्या सीख मिलती है?
    options:
    - सावधानी और सूझबूझ से जान बचती है
    - बिना सोचे अंदर चले जाओ
    - शेर से दोस्ती करो
    - हमेशा सोते रहो
    answer: सावधानी और सूझबूझ से जान बचती है
    difficulty: 2
    hints:
    - गीदड़ कैसे बचा?
    - ध्यान से देखो।
    solution: सावधानी और सूझबूझ से जान बचती है।
    mistakes:
      बिना सोचे अंदर चले जाओ: hin3_lesson
  - prompt: यह कहानी किस प्रसिद्ध पुस्तक से है?
    options:
    - पंचतंत्र
    - रामायण
    - गणित की किताब
    - शब्दकोश
    answer: पंचतंत्र
    difficulty: 1
    hints:
    - जानवरों की कहानियाँ।
    - पाँच तंत्र।
    solution: यह पंचतंत्र की कहानी है।
    mistakes: {"रामायण": "h3_panch_kitab", "गणित की किताब": "h3_panch_kitab", "शब्दकोश": "h3_panch_kitab"}
  - prompt: शेर ने गलती कहाँ की?
    options:
    - उसने मांद की जगह जवाब दे दिया
    - वह बहुत तेज़ दौड़ा
    - उसने खाना खा लिया
    answer: उसने मांद की जगह जवाब दे दिया
    difficulty: 2
    hints:
    - क्या मांद सच में बोल सकती है?
    - आवाज़ किसकी थी?
    solution: 'चरण 1: मांद बोल नहीं सकती। चरण 2: शेर के बोलने से गीदड़ समझ गया।'
    mistakes:
      वह बहुत तेज़ दौड़ा: c3h17_seekh
      उसने खाना खा लिया: c3h17_seekh
  - prompt: गीदड़ ने मांद में जाने से पहले क्या देखा?
    options:
