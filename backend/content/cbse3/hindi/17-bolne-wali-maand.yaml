    - आसमान
    - पेड़ के फल
    answer: पैरों के निशान
    difficulty: 1
    hints:
    - ज़मीन पर कुछ दिखा।
    - शेर के आने का सबूत।
    solution: 'चरण 1: गीदड़ ने ज़मीन देखी। चरण 2: वहाँ पैरों के निशान थे।'
    mistakes:
      आसमान: c3h17_chal
      पेड़ के फल: c3h17_chal
  - prompt: '''सावधान'' रहने का अर्थ है:'
    options:
    - ध्यान से, सोच-समझकर काम करना
    - बिना देखे दौड़ना
    - डरकर रोना
    answer: ध्यान से, सोच-समझकर काम करना
    difficulty: 1
    hints:
    - गीदड़ कैसे बचा?
    - आँखें खुली रखना।
    solution: 'चरण 1: गीदड़ ने ध्यान से देखा और सोचा। चरण 2: यही सावधानी है।'
    mistakes:
      बिना देखे दौड़ना: c3h17_shabd
      डरकर रोना: c3h17_shabd
  - prompt: '''गुफ़ा'' का समान अर्थ वाला शब्द इस कहानी में कौन-सा है?'
    options:
    - मांद
    - घोंसला
    - नदी
    answer: मांद
    difficulty: 1
    hints:
    - कहानी के नाम में यह शब्द है।
    - जानवर का घर।
    solution: 'चरण 1: गीदड़ का घर गुफ़ा में था। चरण 2: उसे मांद कहा गया।'
    mistakes:
      घोंसला: c3h17_shabd
      नदी: c3h17_shabd
  - prompt: कहानी का सही क्रम चुनो।
    options:
