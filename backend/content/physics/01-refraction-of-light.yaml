# Class 9 Physics, chapter 1. Format: content/README.md.
subject: phy
chapter: 1
title: Refraction of Light

tips:
  two_faces: "Follow the ray through both faces. It bends at the first face and again at the second, between the same two media but in the opposite direction."
  raised_by: "How much it looks raised is the gap between the real depth and the apparent depth."
  each_layer: "Each layer looks shallower by its own refractive index. Find each layer's apparent depth, then add them."
  mirage_layers: "Air close to a hot road is hotter and rarer than the air above it. Think about light passing from denser to rarer air at a very slanting angle."
  smaller_critical: "A denser medium bends light more strongly, so light inside it reaches the critical angle sooner. Compare the critical angles with that in mind."
  bends_wrong_way: "Light is slower in the medium with the higher refractive index. Picture a cart rolling at a slant from a smooth floor onto a rug: the wheel that reaches the rug first slows first and the cart turns. Which way does it turn compared with the normal? A ray along the normal meets the new medium all at once."
  angle_from_surface: "Angles of incidence and refraction are measured from the normal, the line at right angles to the surface, not from the surface."
  index_upside_down: "Refractive index = speed of light in vacuum ÷ speed in the medium. It is never less than 1."
  depth_multiplied: "Objects under water look nearer, not deeper: apparent depth = real depth ÷ refractive index."
  tir_wrong_direction: "Total internal reflection only happens when light goes from a denser medium to a rarer one."
  critical_angle_rule: "Total internal reflection needs the angle of incidence to be greater than the critical angle."
  speed_same: "Light changes speed when it enters a new medium. That change in speed is why it bends."
  diamond_index: "A bigger refractive index means light slows down more and bends more. Recall the index of each: air about 1, water 1.33, glass 1.5, and one gem far higher."
  fibre_tir: "Total internal reflection happens when light inside a dense material hits the edge at a steep angle and cannot get out. Which device keeps light trapped inside a thin glass thread?"
  stick_refraction: "The stick doesn't bend; light from the underwater part bends as it leaves the water."

concepts:
  - code: phy9.refraction.bending
    title: Bending of light
    notes: |
      Refraction is the change in direction of light when it passes obliquely from one transparent
      medium to another, because its speed changes. Angles are measured from the normal. Going from
      a rarer to a denser medium (air to water or glass), light slows and bends towards the normal;
      from denser to rarer it speeds up and bends away. Light along the normal goes straight through.
      The frequency stays the same; speed and wavelength change.
    explanations:
      text: "Light travels fastest in a vacuum, a little slower in air, slower in water and slower still in glass. When a ray crosses from air into water at a slant, it slows down and turns towards the normal (the line drawn at right angles to the surface). Coming out of water into air it speeds up and turns away from the normal. That is why a pencil in a glass of water looks bent at the surface."
      visual: "Draw a horizontal line for the water surface and a dotted vertical line, the normal, where the ray hits. The ray from the air comes in at a slant; below the surface draw it closer to the dotted line. Light going the other way retraces the same path."
      step_by_step: "To predict the bending: Step 1: Draw the normal where the ray meets the surface. Step 2: Ask which medium is denser (light is slower there). Step 3: Entering the denser medium, the ray bends towards the normal; entering the rarer one, away from it. Step 4: If the ray is along the normal, it goes straight on."
      real_world: "A lifeguard running along the sand then swimming to a swimmer takes a bent path: running is faster than swimming, so it pays to run further on the sand. Light 'chooses' its bent path through air and water the same way."
    activity:
      type: sort
      prompt: Which way does the light bend?
      bins:
      - Towards the normal
      - Away from the normal
      - Goes straight
      items:
      - label: From air into glass, at a slant
        bin: Towards the normal
        why: Light slows down entering glass, so it bends towards the normal.
        clue: Is the light going into a material where it slows down, or one where it speeds up?
      - label: From glass into air, at a slant
        bin: Away from the normal
        clue: Is the light slowing down or speeding up as it crosses?
        why: Light speeds up leaving glass, so it bends away from the normal.
      - label: From air into water, at a slant
        bin: Towards the normal
        clue: Does light go slower in water or in air?
        why: Light is slower in water, so it bends towards the normal.
      - label: From water into air, at a slant
        bin: Away from the normal
        clue: Does light speed up or slow down as it leaves water?
        why: Speeding up into air, it bends away from the normal. That's why a pool looks shallower.
      - label: Along the normal into glass
        bin: Goes straight
        why: Going straight along the normal, it slows down but doesn't change direction.
        clue: Is there any slant at all?
    lesson:
      - teach: 'Put a pencil in a glass of water and look from the side: it seems broken at the surface. Light changes direction when it passes at a slant from one transparent material into another. This bending is called refraction.'
        check:
          prompt: What is refraction?
          options:
          - Light changing direction as it passes from one medium into another
          - Light bouncing back from a mirror
          - Light splitting into colours only
          answer: Light changing direction as it passes from one medium into another
          why: Bouncing back is reflection. Refraction is the bend when light goes into a new medium.
      - teach: 'Light bends because its speed changes. It is fastest in air and slower in water and glass. Picture a toy car rolling at a slant from a smooth floor onto a carpet: the wheel that hits the carpet first slows first, so the car turns.'
        check:
          prompt: Why does light bend when it enters water at a slant?
          options:
          - Its speed changes
          - Its colour changes
          - Water pulls it down
          answer: Its speed changes
          why: Light slows down in water. The part of the beam that enters first slows first, so the beam turns.
      - teach: Angles are measured from the normal, a line drawn at 90° to the surface. Going from a rarer medium into a denser one (air into glass), light slows and bends towards the normal. Going from denser to rarer (water into air), it speeds up and bends away from the normal. Along the normal, it goes straight on.
        picture:
          kind: compare
          columns:
          - title: Air → glass
            points:
            - slows down
            - bends towards the normal
          - title: Glass → air
            points:
            - speeds up
            - bends away from the normal
          alt: Light entering glass slows and bends towards the normal; leaving glass it speeds up and bends away.
        check:
          prompt: A ray hits a surface making 20° with the surface. What is its angle of incidence?
          options:
          - 70°
          - 20°
          - 110°
          answer: 70°
          why: 'Angles are measured from the normal, which is at 90° to the surface: 90° − 20° = 70°.'
      - teach: Through a glass block with parallel sides, light bends towards the normal going in and away from it coming out, by the same amount. So the ray that comes out is parallel to the one that went in, just shifted sideways. The light's frequency (its colour) never changes; only its speed and wavelength do.
        check:
          prompt: A ray leaves a parallel-sided glass block. How is it related to the ray that went in?
          options:
          - Parallel to it, shifted sideways
          - At right angles to it
          - Exactly the same line
          answer: Parallel to it, shifted sideways
          why: The two bends cancel out in direction but the ray has moved across inside the glass.
    items:
      - prompt: "A ray of light goes from air into glass at a slant. Which way does it bend?"
        options: ["Towards the normal", "Away from the normal", "It does not bend", "Along the surface"]
        answer: "Towards the normal"
        difficulty: 1
        hints: ["Glass is denser than air for light: light is slower in it."]
        solution: "Light slows down entering glass, so it bends towards the normal."
        mistakes: {"Away from the normal": bends_wrong_way, "It does not bend": speed_same}
      - prompt: "A ray of light goes from water into air at a slant. Which way does it bend?"
        options: ["Away from the normal", "Towards the normal", "It does not bend", "It always reflects back"]
        answer: "Away from the normal"
        difficulty: 1
        hints: ["Light speeds up when it leaves water."]
        solution: "Water to air is denser to rarer, so the ray bends away from the normal."
        mistakes: {"Towards the normal": bends_wrong_way}
      - prompt: "What causes light to bend when it passes from one medium into another?"
        options: ["A change in its speed", "A change in its colour", "Reflection at the surface", "The heat of the medium"]
        answer: "A change in its speed"
        difficulty: 1
        hints: ["Think of a car wheel going from road onto sand at a slant."]
        solution: "Light travels at different speeds in different media. The change in speed at the boundary makes it change direction."
        mistakes: {"Reflection at the surface": speed_same}
      - prompt: "A ray of light strikes a glass block along the normal. What happens to it?"
        options: ["It goes straight through without bending", "It bends towards the normal", "It bends away from the normal", "It is totally reflected"]
        answer: "It goes straight through without bending"
        difficulty: 2
        hints: ["Along the normal, the angle of incidence is 0°."]
        solution: "With angle of incidence 0°, the angle of refraction is also 0°. The light slows down but does not change direction."
        mistakes: {"It bends towards the normal": bends_wrong_way}
      - prompt: "A ray hits a water surface making an angle of 30° with the surface. What is the angle of incidence, in degrees?"
        answer: "60"
        check: "90 - 30"
        difficulty: 2
        hints: ["The normal is at 90° to the surface."]
        solution: "Angle of incidence is measured from the normal: 90° − 30° = 60°."
        mistakes: {"30": angle_from_surface}
      - prompt: "When light passes from air into water, which of these stays the same?"
        options: ["Frequency", "Speed", "Wavelength", "Direction (for a slanting ray)"]
        answer: "Frequency"
        difficulty: 3
        hints: ["The source decides how many waves arrive each second."]
        solution: "The number of waves per second (frequency) is set by the source and does not change. Speed and wavelength both decrease in water, and a slanting ray changes direction."
        mistakes: {"Speed": speed_same}
      - prompt: "A ray goes at a slant from glass (n = 1.5) into water (n = 1.33). Which way does it bend?"
        options: ["Away from the normal", "Towards the normal", "It does not bend", "It is always reflected back"]
        answer: "Away from the normal"
        difficulty: 3
        hints: ["Which of the two has the higher refractive index?", "Is the light speeding up or slowing down as it enters water?"]
        solution: "Step 1: Glass has the higher index, so light is faster in water. Step 2: Going into a medium where it is faster, light bends away from the normal."
        mistakes: {"Towards the normal": bends_wrong_way, "It does not bend": speed_same, "It is always reflected back": critical_angle_rule}
      - prompt: "A ray passes at a slant through a glass block with parallel faces. How does the ray that comes out compare with the ray that went in?"
        options: ["Parallel to it, but shifted sideways", "Bent towards the normal for good", "Exactly in line with it", "At right angles to it"]
        answer: "Parallel to it, but shifted sideways"
        difficulty: 3
        hints: ["At the first face light goes air → glass. At the second, glass → air.", "Do the two bends cancel in direction? Does the path inside move the ray across?"]
        solution: "Step 1: At the first face the ray bends towards the normal; at the second it bends away by the same amount. Step 2: So it comes out parallel to the ray that went in. Step 3: It travelled slantwise inside, so it is shifted sideways."
        mistakes: {"Bent towards the normal for good": two_faces, "Exactly in line with it": two_faces, "At right angles to it": two_faces}
      - prompt: "A ray in air meets a water surface with an angle of incidence of 40°. Which of these could be its angle of refraction?"
        options: ["29°", "40°", "52°", "90°"]
        answer: "29°"
        difficulty: 2
        hints: ["Air to water: is the light slowing down?", "Slowing down bends it towards the normal, so the angle gets smaller."]
        solution: "Step 1: Water is denser, so the ray bends towards the normal. Step 2: The angle of refraction must be less than 40°, so 29°."
        mistakes: {"40°": speed_same, "52°": bends_wrong_way, "90°": bends_wrong_way}
      - prompt: A ray of light goes from air into water at a slant. Which way does it bend?
        options:
        - Towards the normal
        - Away from the normal
        - It does not bend
        answer: Towards the normal
        difficulty: 1
        hints:
        - Is water denser or rarer than air, for light?
        - Light slows down in water.
        solution: 'Step 1: Water is optically denser than air. Step 2: Light slows as it enters. Step 3: So it bends towards the normal.'
        mistakes:
          Away from the normal: bends_wrong_way
      - prompt: Light passes from glass into air at a slant. What happens to its speed?
        options:
        - It increases
        - It decreases
        - It stays the same
        answer: It increases
        difficulty: 1
        hints:
        - 'Where is light faster: glass or air?'
        - Air is the rarer medium.
        solution: 'Step 1: Light is slower in glass. Step 2: Air is rarer. Step 3: So the light speeds up as it leaves the glass.'
        mistakes:
          It stays the same: speed_same
          It decreases: bends_wrong_way
      - prompt: A ray makes an angle of 50° with a glass surface. What is its angle of incidence, in degrees?
        answer: '40'
        check: 90 - 50
        difficulty: 2
        hints:
        - The angle of incidence is measured from the normal.
        - The normal is at 90° to the surface.
        solution: 'Step 1: The normal is at 90° to the surface. Step 2: 90° − 50° = 40°. Step 3: So the angle of incidence is 40°.'
        mistakes:
          '50': angle_from_surface
      - prompt: A ray goes from water into glass with an angle of incidence of 45°. Which could be its angle of refraction?
        options:
        - 38°
        - 45°
        - 55°
        - 90°
        answer: 38°
        difficulty: 2
        hints:
        - Glass is denser than water.
        - 'Going into a denser medium, the ray bends towards the normal: the angle gets smaller.'
        solution: 'Step 1: Water to glass is rarer to denser. Step 2: The ray bends towards the normal. Step 3: So the angle of refraction is less than 45°: 38°.'
        mistakes:
          55°: bends_wrong_way
          45°: speed_same
      - prompt: When light passes from water into air, which of these changes?
        options:
        - Its speed and wavelength
        - Its frequency
        - Its colour
        - Nothing changes
        answer: Its speed and wavelength
        difficulty: 3
        hints:
        - The colour of light is set by its frequency.
        - Does a red light turn another colour in water?
        solution: 'Step 1: Frequency, and so colour, stays the same. Step 2: Speed increases in air. Step 3: So the wavelength changes too.'
        mistakes:
          Its frequency: speed_same
      - prompt: A ray passes from air through a glass slab and out into air again. The angle of incidence at the first face is 35°. What is the angle at which it leaves the second face, in degrees?
        answer: '35'
        check: '35'
        difficulty: 3
        hints:
        - The two faces are parallel.
        - The bends going in and coming out undo each other.
        solution: 'Step 1: The ray bends towards the normal going in. Step 2: It bends away by the same amount coming out. Step 3: So it leaves at 35°, parallel to the incoming ray.'
        mistakes:
          '55': angle_from_surface

  - code: phy9.refraction.index
    title: Refractive index
    after: [phy9.refraction.bending]
    notes: |
      The absolute refractive index of a medium is n = c ÷ v, where c = 3 × 10⁸ m/s is the speed of
      light in vacuum and v its speed in the medium. It has no unit and is at least 1. A bigger n
      means slower light and stronger bending (optically denser). Typical values: air ≈ 1, water
      ≈ 1.33, glass ≈ 1.5, diamond ≈ 2.42. Relative refractive index of medium 2 with respect to
      medium 1 is n₂ ÷ n₁ = v₁ ÷ v₂.
    explanations:
      text: "The refractive index says how many times slower light goes in a material than in a vacuum. In glass light travels at 2 × 10⁸ m/s, and in a vacuum at 3 × 10⁸ m/s, so the refractive index of glass is 3 ÷ 2 = 1.5. Diamond has 2.42: light goes less than half as fast, which is why diamonds sparkle so much."
      visual: "Picture a race: light in a vacuum runs 3 squares a second; in glass only 2. Glass's refractive index is the ratio of the two speeds, 3/2. The slower the runner, the bigger the number."
      step_by_step: "Speed of light in water, n = 4/3: Step 1: n = c ÷ v, so v = c ÷ n. Step 2: v = 3 × 10⁸ ÷ (4/3). Step 3: v = 3 × 10⁸ × 3/4 = 2.25 × 10⁸ m/s."
      real_world: "Optical fibres carrying internet signals are made of glass with a carefully chosen refractive index so light stays trapped inside for kilometres."
    activity:
      type: formula
      prompt: Refractive index n = speed of light in air ÷ speed in the material (3 × 10⁸ m/s in air).
      inputs:
      - name: v
        label: Speed in material (× 10⁸ m/s)
        min: 1
        max: 3
        step: 0.25
        start: 3
      outputs:
      - name: n
        label: Refractive index
        expr: 3/v
        places: 2
      goals:
      - prompt: Glass has n = 1.5. Set the speed of light in glass.
        want:
          n: 1.5
        mistakes:
        - when:
            v:
            - 2.25
            - 3
          say: At this speed n is less than 1.5. The faster light travels in a material, the smaller its refractive index. Glass slows light down more than that.
      - prompt: Water has n ≈ 1.33.
        want:
          n:
          - 1.33
          - 1.34
        mistakes:
        - when:
            v:
            - 2.5
            - 3
          say: 'At this speed n is too small. Water slows light down: less than in glass, but still a lot.'
    lesson:
      - teach: 'How much a material slows light is given by its refractive index: n = speed of light in vacuum ÷ speed of light in the material. Light in vacuum goes at 3 × 10⁸ m/s. In glass it goes at 2 × 10⁸ m/s, so glass has n = 3 ÷ 2 = 1.5.'
        check:
          prompt: Light travels at 2.25 × 10⁸ m/s in water. What is water's refractive index?
          options:
          - 4/3 (about 1.33)
          - '0.75'
          - '6.75'
          answer: 4/3 (about 1.33)
          why: n = 3 ÷ 2.25 = 4/3. It is speed in vacuum over speed in the material, never the other way up.
      - teach: n has no unit (it is speed ÷ speed) and is never less than 1, since nothing is faster than light in vacuum. A bigger n means slower light, and we call the material optically denser. Air ≈ 1, water ≈ 1.33, glass ≈ 1.5, diamond ≈ 2.42.
        check:
          prompt: In which of these is light slowest?
          options:
          - Diamond (n = 2.42)
          - Water (n = 1.33)
          - Air (n = 1)
          answer: Diamond (n = 2.42)
          why: The biggest refractive index means the slowest light.
      - teach: 'Going backwards: speed in a material = 3 × 10⁸ ÷ n. And the relative refractive index of medium 2 with respect to medium 1 is n₂ ÷ n₁, which equals v₁ ÷ v₂. Glass relative to water is 1.5 ÷ 1.33 ≈ 1.13.'
        check:
          prompt: Glass has n = 1.5. What is the speed of light in glass?
          options:
          - 2 × 10⁸ m/s
          - 4.5 × 10⁸ m/s
          - 1.5 × 10⁸ m/s
          answer: 2 × 10⁸ m/s
          why: v = 3 × 10⁸ ÷ 1.5 = 2 × 10⁸ m/s.
    items:
      - prompt: "Light travels at 3 × 10⁸ m/s in a vacuum and 2 × 10⁸ m/s in glass. What is the refractive index of the glass?"
        answer: "1.5"
        check: "3/2"
        difficulty: 1
        hints: ["n = speed in vacuum ÷ speed in the medium."]
        solution: "n = 3 × 10⁸ ÷ 2 × 10⁸ = 1.5"
        mistakes: {"2/3": index_upside_down}
      - prompt: "Which of these media has the largest refractive index?"
        options: ["Diamond", "Water", "Glass", "Air"]
        answer: "Diamond"
        difficulty: 1
        hints: ["In which is light slowest?"]
        solution: "Diamond (about 2.42) is greater than glass (1.5), water (1.33) and air (about 1)."
        mistakes: {"Glass": "diamond_index", "Water": "diamond_index", "Air": "diamond_index"}
      - prompt: "The refractive index of water is 4/3. What is the speed of light in water, in units of 10⁸ m/s?"
        answer: "2.25"
        check: "3/Rational(4, 3)"
        difficulty: 2
        hints: ["v = c ÷ n.", "3 ÷ (4/3) = 3 × 3/4."]
        solution: "Step 1: v = c ÷ n. Step 2: 3 × 10⁸ × 3/4 = 2.25 × 10⁸ m/s."
        mistakes: {"4": index_upside_down}
      - prompt: "Light travels at 1.24 × 10⁸ m/s in diamond. What is the refractive index of diamond? Give it to two decimal places."
        answer: "2.42"
        check: "round(3/1.24, 2)"
        difficulty: 2
        hints: ["n = 3 × 10⁸ ÷ 1.24 × 10⁸."]
        solution: "3 ÷ 1.24 ≈ 2.42"
        mistakes: {"0.41": index_upside_down}
      - prompt: "Light goes from medium A (n = 1.33) into medium B (n = 1.5). Which statement is true?"
        options: ["It slows down and bends towards the normal", "It speeds up and bends away from the normal", "It slows down and bends away from the normal", "Its speed does not change"]
        answer: "It slows down and bends towards the normal"
        difficulty: 2
        hints: ["The bigger refractive index is the optically denser medium."]
        solution: "B has the larger index, so light is slower there and bends towards the normal."
        mistakes: {"It speeds up and bends away from the normal": bends_wrong_way, "Its speed does not change": speed_same}
      - prompt: "Light travels at 2.25 × 10⁸ m/s in water and 2 × 10⁸ m/s in glass. What is the refractive index of glass relative to water?"
        answer: "1.125"
        check: "Rational(225, 100)/2"
        difficulty: 3
        hints: ["Relative index of glass with respect to water = speed in water ÷ speed in glass."]
        solution: "n = 2.25 ÷ 2 = 1.125 (also 1.5 ÷ 1.333… = 1.125)."
        mistakes: {"8/9": index_upside_down}
      - prompt: "Light travels at 2 × 10⁸ m/s in glass. The refractive index of glass relative to water is 1.125. What is the speed of light in water, in units of 10⁸ m/s?"
        answer: "2.25"
        check: "1.125*2"
        difficulty: 3
        hints: ["Index of glass relative to water = speed in water ÷ speed in glass.", "Speed in water = 1.125 × 2."]
        solution: "Step 1: n(glass, water) = v(water) ÷ v(glass). Step 2: v(water) = 1.125 × 2 = 2.25 × 10⁸ m/s."
        mistakes: {"1.78": index_upside_down, "3": index_upside_down}
      - prompt: "In which of these does light travel slowest: ice (n = 1.31), water (n = 1.33), kerosene (n = 1.44) or glass (n = 1.5)?"
        options: ["Glass", "Ice", "Water", "Kerosene"]
        answer: "Glass"
        difficulty: 2
        hints: ["n = speed in vacuum ÷ speed in the medium.", "The bigger n is, the smaller the speed must be."]
        solution: "Step 1: v = c ÷ n, so the largest n gives the smallest speed. Step 2: Glass has the largest n."
        mistakes: {"Ice": index_upside_down, "Water": index_upside_down, "Kerosene": index_upside_down}
      - prompt: "In a certain plastic, light travels at 60% of its speed in a vacuum. What is the refractive index of the plastic?"
        answer: "5/3"
        check: "1/(6/10)"
        difficulty: 3
        hints: ["Write the speed in the plastic as 0.6c.", "n = c ÷ 0.6c."]
        solution: "Step 1: v = 0.6c. Step 2: n = c ÷ 0.6c = 1 ÷ 0.6 = 5/3 ≈ 1.67."
        mistakes: {"0.6": index_upside_down, "1.6": index_upside_down, "0.4": index_upside_down}
      - prompt: Light travels at 1.5 × 10⁸ m/s in a material. What is its refractive index?
        answer: '2'
        check: 3/1.5
        difficulty: 1
        hints:
        - n = speed in vacuum ÷ speed in the material.
        - 3 × 10⁸ ÷ 1.5 × 10⁸.
        solution: 'Step 1: n = c ÷ v. Step 2: = 3 ÷ 1.5. Step 3: = 2.'
        mistakes:
          '0.5': index_upside_down
      - prompt: What is the unit of refractive index?
        options:
        - It has no unit
        - m/s
        - degrees
        - metres
        answer: It has no unit
        difficulty: 1
        hints:
        - n is one speed divided by another.
        - What happens to m/s ÷ m/s?
        solution: 'Step 1: n = speed ÷ speed. Step 2: The units m/s cancel. Step 3: So n has no unit.'
        mistakes:
          m/s: index_upside_down
      - prompt: A liquid has a refractive index of 1.25. What is the speed of light in it, in units of 10⁸ m/s?
        answer: '2.4'
        check: 3/1.25
        difficulty: 2
        hints:
        - v = c ÷ n.
        - 3 ÷ 1.25.
        solution: 'Step 1: v = c ÷ n. Step 2: 3 ÷ 1.25 = 2.4. Step 3: So 2.4 × 10⁸ m/s.'
        mistakes:
          '3.75': index_upside_down
      - prompt: Light goes from glass (n = 1.5) into water (n = 1.33). What happens?
        options:
        - It speeds up and bends away from the normal
        - It slows down and bends towards the normal
        - It speeds up and bends towards the normal
        - Nothing changes
        answer: It speeds up and bends away from the normal
        difficulty: 2
        hints:
        - Which has the smaller refractive index?
        - Smaller n means faster light.
        solution: 'Step 1: Water''s n is smaller than glass''s. Step 2: So light is faster in water. Step 3: Going denser to rarer, it bends away from the normal.'
        mistakes:
          It slows down and bends towards the normal: bends_wrong_way
      - prompt: The refractive index of glass is 1.5 and of water 4/3. What is the refractive index of glass relative to water? Type a fraction like 2/3.
        answer: 9/8
        check: 1.5/(4/3)
        difficulty: 3
        hints:
        - Relative index of glass w.r.t. water = n_glass ÷ n_water.
        - 1.5 = 3/2, so (3/2) ÷ (4/3).
        solution: 'Step 1: n = 3/2 ÷ 4/3. Step 2: = 3/2 × 3/4. Step 3: = 9/8 = 1.125.'
        mistakes:
          8/9: index_upside_down
      - prompt: Why does a diamond bend light more than glass does?
        options:
        - 'Light is much slower in diamond: its refractive index is larger'
        - Diamond is heavier than glass
        - Diamond reflects all light
        - Light is faster in diamond
        answer: 'Light is much slower in diamond: its refractive index is larger'
        difficulty: 3
        hints:
        - Bending depends on how much the speed changes.
        - Diamond's n is about 2.42; glass's about 1.5.
        solution: 'Step 1: Diamond''s n ≈ 2.42, glass''s ≈ 1.5. Step 2: Light slows much more in diamond. Step 3: A bigger change in speed means more bending.'
        mistakes:
          Light is faster in diamond: diamond_index

  - code: phy9.refraction.depth
    title: Apparent depth
    after: [phy9.refraction.index]
    notes: |
      An object under water seen from above appears raised, because rays from it bend away from the
      normal as they leave the water. For viewing from nearly straight above, apparent depth = real
      depth ÷ n, and n = real depth ÷ apparent depth. The object appears raised by real − apparent
      depth. Pools look shallower than they are; a coin in a glass appears raised.
    explanations:
      text: "Look straight down into a pool 2 m deep: it seems only about 1.5 m deep. Light from the bottom bends away from the normal as it leaves the water, and our eyes trace it back in a straight line, to a point higher than the real bottom. For water, apparent depth = real depth ÷ 1.33."
      visual: "Draw a coin at the bottom of a beaker, two rays leaving it, bending outwards at the surface, and dotted lines tracing them back. The dotted lines meet above the coin: that is where the coin seems to be."
      step_by_step: "A tank 120 cm deep with water (n = 4/3): Step 1: Apparent depth = real ÷ n. Step 2: 120 ÷ (4/3) = 120 × 3/4 = 90 cm. Step 3: It seems raised by 120 − 90 = 30 cm."
      real_world: "Swimmers misjudge pool depth because the bottom looks nearer. Fishermen who spear fish aim below where the fish seems to be."
    activity:
      type: formula
      prompt: 'A pool looks shallower than it is: apparent depth = real depth ÷ 1.33.'
      inputs:
      - name: d
        label: Real depth
        min: 1
        max: 8
        step: 0.5
        start: 1
        unit: m
      outputs:
      - name: a
        label: Looks this deep
        expr: d/1.33
        unit: m
        places: 2
      goals:
      - prompt: Make the pool look 3 m deep.
        want:
          a:
          - 2.98
          - 3.02
        mistakes:
        - when:
            d:
            - 1
            - 3
          say: A pool 3 m deep or less would look even shallower than 3 m. A pool always looks shallower than it really is, so the real depth must be more than 3 m.
    lesson:
      - teach: Put a coin at the bottom of an empty cup, step back until it just disappears behind the rim, then have someone pour in water. The coin comes back into view! Light from the coin bends away from the normal as it leaves the water, so the coin seems higher than it is.
        check:
          prompt: Why does the coin reappear when water is poured in?
          options:
          - Light from it bends as it leaves the water, so it looks raised
          - The water lifts the coin
          - Water reflects the coin like a mirror
          answer: Light from it bends as it leaves the water, so it looks raised
          why: The coin stays where it is. Refraction at the surface makes it appear higher.
      - teach: Seen from straight above, apparent depth = real depth ÷ n. A pool 2 m deep with water of n = 4/3 looks 2 ÷ 4/3 = 1.5 m deep. That is why ponds and pools are deeper than they look, which can be dangerous.
        check:
          prompt: A tank is 60 cm deep, full of water (n = 4/3). How deep does it look from above?
          options:
          - 45 cm
          - 80 cm
          - 60 cm
          answer: 45 cm
          why: 60 ÷ 4/3 = 60 × 3/4 = 45 cm. Multiplying by n would make it look deeper, which is wrong.
      - teach: The object appears raised by real depth − apparent depth. And n = real depth ÷ apparent depth, so measuring both gives you the refractive index. A stick dipped in water looks bent at the surface for the same reason.
        check:
          prompt: A mark under 9 cm of glass (n = 1.5) looks 6 cm deep. By how much is it raised?
          options:
          - 3 cm
          - 6 cm
          - 13.5 cm
          answer: 3 cm
          why: Raised by real − apparent = 9 − 6 = 3 cm.
    items:
      - prompt: "A coin lies at the bottom of a glass of water. Seen from above, how does it appear?"
        options: ["Raised, nearer the surface", "Deeper than it is", "At its real depth", "Upside down"]
        answer: "Raised, nearer the surface"
        difficulty: 1
        hints: ["A swimming pool looks shallower than it is."]
        solution: "Rays leaving the water bend away from the normal, so the coin appears raised."
        mistakes: {"Deeper than it is": depth_multiplied}
      - prompt: "A tank is 120 cm deep and full of water (n = 4/3). Seen from straight above, how deep does it appear, in cm?"
        answer: "90"
        check: "120/Rational(4, 3)"
        difficulty: 1
        hints: ["Apparent depth = real depth ÷ n."]
        solution: "120 ÷ 4/3 = 120 × 3/4 = 90 cm"
        mistakes: {"160": depth_multiplied}
      - prompt: "A pool is 2 m deep but looks 1.5 m deep from above. What is the refractive index of the water?"
        answer: "4/3"
        check: "2/Rational(3, 2)"
        difficulty: 2
        hints: ["n = real depth ÷ apparent depth."]
        solution: "n = 2 ÷ 1.5 = 4/3 ≈ 1.33"
        mistakes: {"3/4": index_upside_down}
      - prompt: "A mark under a glass slab 6 cm thick (n = 1.5) is seen from above. By how many cm does it appear raised?"
        answer: "2"
        check: "6 - 6/Rational(3, 2)"
        difficulty: 2
        hints: ["Find the apparent depth first: 6 ÷ 1.5.", "Raised by real − apparent."]
        solution: "Step 1: Apparent depth = 6 ÷ 1.5 = 4 cm. Step 2: Raised by 6 − 4 = 2 cm."
        mistakes: {"4": depth_multiplied}
      - prompt: "A fish seems to be 30 cm below the water surface (n = 4/3). How deep is it really, in cm?"
        answer: "40"
        check: "30*Rational(4, 3)"
        difficulty: 3
        hints: ["Real depth = apparent depth × n."]
        solution: "Real depth = 30 × 4/3 = 40 cm. It is deeper than it looks."
        mistakes: {"45/2": depth_multiplied}
      - prompt: "Why does a straight stick partly dipped in water look bent at the surface?"
        options: ["Light from the dipped part bends as it leaves the water", "Water really bends the stick", "Light reflects off the water surface", "Light slows down in air"]
        answer: "Light from the dipped part bends as it leaves the water"
        difficulty: 2
        hints: ["Every point of the dipped part looks raised."]
        solution: "Light from the part under water refracts away from the normal at the surface, so that part appears raised and the stick looks bent."

        mistakes: {"Water really bends the stick": "stick_refraction", "Light reflects off the water surface": "stick_refraction"}
      - prompt: "A coin lies under 12 cm of water (n = 4/3). Seen from straight above, by how many cm does it appear raised?"
        answer: "3"
        check: "12 - 12/(4/3)"
        difficulty: 2
        hints: ["First find the apparent depth.", "Apparent depth = 12 ÷ 4/3."]
        solution: "Step 1: Apparent depth = 12 ÷ 4/3 = 9 cm. Step 2: Raised by 12 − 9 = 3 cm."
        mistakes: {"9": raised_by, "16": depth_multiplied, "4": depth_multiplied}
      - prompt: "A beaker has a 6 cm layer of oil (n = 1.5) floating on 8 cm of water (n = 4/3). Seen from straight above, how deep does the bottom appear, in cm?"
        answer: "10"
        check: "6/1.5 + 8/(4/3)"
        difficulty: 3
        hints: ["Find the apparent thickness of the oil and of the water separately.", "Oil: 6 ÷ 1.5. Water: 8 ÷ 4/3."]
        solution: "Step 1: Oil looks 6 ÷ 1.5 = 4 cm thick. Step 2: Water looks 8 ÷ 4/3 = 6 cm deep. Step 3: The bottom appears 4 + 6 = 10 cm down."
        mistakes: {"14": each_layer, "4": each_layer, "6": each_layer}
      - prompt: "Why is it unsafe to judge how deep a pond is just by looking into it from above?"
        options: ["It is deeper than it looks", "It is shallower than it looks", "Water makes the bottom invisible", "The pond's depth keeps changing with the light"]
        answer: "It is deeper than it looks"
        difficulty: 2
        hints: ["What happens to a coin at the bottom of a glass of water?", "Light from the bottom bends away from the normal as it leaves the water."]
        solution: "Step 1: Light from the bottom bends as it leaves the water, so the bottom appears raised. Step 2: The real depth is more than it seems."
        mistakes: {"It is shallower than it looks": depth_multiplied, "Water makes the bottom invisible": stick_refraction, "The pond's depth keeps changing with the light": stick_refraction}
      - prompt: A swimming pool looks shallower than it really is. Why?
        options:
        - Light from the bottom bends away from the normal as it leaves the water
        - Water magnifies the pool
        - Light bends towards the normal as it leaves the water
        - The pool reflects the sky
        answer: Light from the bottom bends away from the normal as it leaves the water
        difficulty: 1
        hints:
        - Light goes from water into air.
        - 'Denser to rarer: which way does it bend?'
        solution: 'Step 1: Light from the bottom goes from water into air. Step 2: It bends away from the normal. Step 3: Traced back, the rays seem to come from a higher point.'
        mistakes:
          Light bends towards the normal as it leaves the water: bends_wrong_way
      - prompt: A coin lies under 8 cm of water (n = 4/3). How deep does it appear from straight above, in cm?
        answer: '6'
        check: 8/(4/3)
        difficulty: 1
        hints:
        - Apparent depth = real depth ÷ n.
        - 8 ÷ 4/3 = 8 × 3/4.
        solution: 'Step 1: Apparent depth = 8 ÷ 4/3. Step 2: = 8 × 3/4. Step 3: = 6 cm.'
        mistakes:
          '10.667': depth_multiplied
          '2': raised_by
      - prompt: A tank 1.6 m deep is full of water (n = 4/3). Seen from above, by how many metres does the bottom appear raised?
        answer: '0.4'
        check: 1.6 - 1.6*3/4
        difficulty: 2
        hints:
        - First find the apparent depth.
        - Apparent depth = 1.6 × 3/4 = 1.2 m.
        solution: 'Step 1: Apparent depth = 1.6 ÷ 4/3 = 1.2 m. Step 2: Raised by 1.6 − 1.2. Step 3: = 0.4 m.'
        mistakes:
          '1.2': raised_by
      - prompt: A mark under a glass slab 7.5 cm thick looks 5 cm deep from above. What is the refractive index of the glass?
        answer: '1.5'
        check: 7.5/5
        difficulty: 2
        hints:
        - n = real depth ÷ apparent depth.
        - 7.5 ÷ 5.
        solution: 'Step 1: n = real ÷ apparent. Step 2: = 7.5 ÷ 5. Step 3: = 1.5.'
        mistakes:
          '0.667': index_upside_down
      - prompt: A fish seems to be 45 cm below the surface of a pond (n = 4/3). How deep is it really, in cm?
        answer: '60'
        check: 45*4/3
        difficulty: 3
        hints:
        - Real depth = apparent depth × n.
        - 45 × 4/3.
        solution: 'Step 1: Real = apparent × n. Step 2: 45 × 4/3. Step 3: = 60 cm.'
        mistakes:
          '33.75': depth_multiplied
      - prompt: Why should a fisherman aim his spear below where he sees a fish?
        options:
        - The fish is really deeper than it appears
        - The fish is really higher than it appears
        - The water slows the spear
        - The fish moves away
        answer: The fish is really deeper than it appears
        difficulty: 3
        hints:
        - Objects under water look raised.
        - So where is the real fish?
        solution: 'Step 1: Refraction makes the fish look nearer the surface. Step 2: The real fish is lower. Step 3: So he must aim below the image.'
        mistakes:
          The fish is really higher than it appears: raised_by
  - code: phy9.refraction.tir
    title: Total internal reflection
    after: [phy9.refraction.bending]
    notes: |
      When light goes from a denser to a rarer medium, the refracted ray bends away from the normal.
      At one angle of incidence, the critical angle, the refracted ray grazes along the surface
      (angle of refraction 90°). For larger angles no light gets out: it is all reflected back into
      the denser medium. This is total internal reflection. Conditions: denser to rarer, and angle of
      incidence greater than the critical angle. Critical angle: glass ≈ 42°, water ≈ 49°, diamond
      ≈ 24°. Uses: optical fibres, endoscopes, diamond sparkle, mirages.
    explanations:
      text: "Shine a torch from under water towards the surface. At small angles most light escapes into the air. Tilt it more and the escaping ray leans closer to the surface. Past the critical angle (about 49° for water) no light escapes: the surface acts as a perfect mirror. That is total internal reflection."
      visual: "Draw three rays from one point under water: a steep one escaping and bending away from the normal, one at the critical angle grazing along the surface, and a shallow one bouncing back down like a mirror reflection."
      step_by_step: "Will light in glass (critical angle 42°) hitting the surface at 50° escape? Step 1: Glass to air is denser to rarer, so it is possible. Step 2: 50° > 42°. Step 3: So it is totally internally reflected."
      real_world: "Doctors look inside the stomach with an endoscope: light travels through bundles of thin glass fibres, bouncing off the inside walls by total internal reflection without leaking out."
    activity:
      type: scale
      min: 0
      max: 90
      step: 1
      start: 20
      unit: °
      orientation: horizontal
      prompt: Light going from glass into air. The critical angle for glass is about 42°.
      zones:
      - from: 0
        to: 42
        label: Refracts out
        says: Below the critical angle the light gets out of the glass, bending away from the normal.
      - from: 42
        to: 90
        label: Reflects back inside
        says: 'Past the critical angle no light gets out: it all reflects back inside. Optical fibres work this way.'
      goals:
      - prompt: Set an angle of incidence where all the light reflects back inside.
        zone: Reflects back inside
      - prompt: Set the critical angle itself.
        value: 42
    lesson:
      - teach: Shine light from water up towards the air. At small angles of incidence it comes out, bending away from the normal. Make the angle bigger and the outgoing ray bends further, until at one angle it skims along the surface at 90°. That angle of incidence is the critical angle.
        check:
          prompt: At the critical angle, what is the angle of refraction?
          options:
          - 90°
          - 0°
          - 45°
          answer: 90°
          why: The refracted ray grazes along the surface, at 90° to the normal.
      - teach: 'Beyond the critical angle, no light gets out at all: it is all reflected back inside. This is total internal reflection. It needs two things: the light must be going from a denser to a rarer medium, and the angle of incidence must be bigger than the critical angle.'
        picture:
          kind: flow
          steps:
          - 'Less than critical angle: most light refracts out'
          - 'At critical angle: refracted ray grazes the surface'
          - 'More than critical angle: all light reflects back inside'
          alt: As the angle of incidence inside water grows, light first refracts out, then grazes the surface, then is totally reflected back.
        check:
          prompt: Light in glass (critical angle 42°) meets the surface at 50°. What happens?
          options:
          - Total internal reflection
          - It refracts out into air
          - It stops
          answer: Total internal reflection
          why: 50° is more than 42°, and light is going from denser glass to rarer air.
      - teach: 'A denser material has a smaller critical angle: water ≈ 49°, glass ≈ 42°, diamond ≈ 24°. Uses: optical fibres carry light (and internet data) by bouncing it inside thin glass threads; doctors use them in endoscopes; diamonds sparkle because light is trapped and reflected many times; mirages form over hot roads.'
        check:
          prompt: How does light travel along a bent optical fibre?
          options:
          - By total internal reflection again and again
          - By going straight through the glass
          - By refracting out and back in
          answer: By total internal reflection again and again
          why: Each time it meets the fibre's side above the critical angle, it is totally reflected back inside.
    items:
      - prompt: "For total internal reflection, light must travel from:"
        options: ["A denser medium to a rarer medium", "A rarer medium to a denser medium", "Air to glass", "Any medium to any other"]
        answer: "A denser medium to a rarer medium"
        difficulty: 1
        hints: ["The refracted ray must bend away from the normal."]
        solution: "Only from denser to rarer does the ray bend away from the normal, so only then can it reach 90° and be trapped."
        mistakes: {"A rarer medium to a denser medium": tir_wrong_direction, "Air to glass": tir_wrong_direction}
      - prompt: "Which of these works by total internal reflection?"
        options: ["Optical fibre", "Plane mirror", "Magnifying glass", "Pinhole camera"]
        answer: "Optical fibre"
        difficulty: 1
        hints: ["Which one keeps light trapped inside glass?"]
        solution: "Light in an optical fibre keeps hitting the walls beyond the critical angle and stays inside."
        mistakes: {"Plane mirror": "fibre_tir", "Magnifying glass": "fibre_tir"}
      - prompt: "The critical angle of glass is 42°. Light inside the glass meets the surface at 30°. What happens?"
        options: ["Most of it refracts out into the air", "It is totally internally reflected", "It grazes along the surface", "It stops"]
        answer: "Most of it refracts out into the air"
        difficulty: 2
        hints: ["Compare 30° with 42°."]
        solution: "30° is less than the critical angle, so the light refracts out (bending away from the normal)."
        mistakes: {"It is totally internally reflected": critical_angle_rule}
      - prompt: "The critical angle of water is about 49°. Light in water meets the surface at 60°. What happens?"
        options: ["It is totally internally reflected", "It refracts out into the air", "It grazes along the surface", "It goes straight out without bending"]
        answer: "It is totally internally reflected"
        difficulty: 2
        hints: ["Compare 60° with 49°."]
        solution: "60° is greater than the critical angle, so no light escapes: total internal reflection."
        mistakes: {"It refracts out into the air": critical_angle_rule}
      - prompt: "At the critical angle, what is the angle of refraction, in degrees?"
        answer: "90"
        check: "90"
        difficulty: 2
        hints: ["The refracted ray grazes along the surface."]
        solution: "At the critical angle the refracted ray runs along the surface, at 90° to the normal."
        mistakes: {"0": angle_from_surface}
      - prompt: "Diamond's critical angle (about 24°) is much smaller than glass's (about 42°). Why does this make diamonds sparkle more?"
        options: ["More of the light inside is totally internally reflected", "Diamond lets more light straight through", "Diamond makes its own light", "Light speeds up in diamond"]
        answer: "More of the light inside is totally internally reflected"
        difficulty: 3
        hints: ["Any ray meeting the surface at more than 24° is trapped."]
        solution: "With a small critical angle, most rays inside hit the faces above 24° and are reflected many times before leaving through the top, so the diamond flashes brightly."
        mistakes: {"Light speeds up in diamond": speed_same}
      - prompt: "Light goes from air into glass with an angle of incidence of 60°. Glass's critical angle is 42°. Can total internal reflection happen at this surface?"
        options: ["No: the light is going from a rarer to a denser medium", "Yes: 60° is more than the critical angle", "Yes: glass always reflects some light", "Only if the glass is thick"]
        answer: "No: the light is going from a rarer to a denser medium"
        difficulty: 3
        hints: ["Total internal reflection has two conditions.", "Which way is the light travelling: from denser to rarer, or rarer to denser?"]
        solution: "Step 1: Total internal reflection needs light going from denser to rarer. Step 2: Here it goes from air (rarer) into glass, so it cannot happen, whatever the angle."
        mistakes: {"Yes: 60° is more than the critical angle": tir_wrong_direction, "Yes: glass always reflects some light": tir_wrong_direction, "Only if the glass is thick": tir_wrong_direction}
      - prompt: "On a hot day, a road far ahead seems to have a pool of water on it. What causes this mirage?"
        options: ["Light from the sky bends through hot air layers and is totally internally reflected near the road", "There really is a thin layer of water on the road", "The tar reflects light like a mirror", "Heat waves from the road are coloured blue"]
        answer: "Light from the sky bends through hot air layers and is totally internally reflected near the road"
        difficulty: 3
        hints: ["Air near the hot road is rarer than the air above.", "What can happen to light going from denser to rarer at a very slanting angle?"]
        solution: "Step 1: Light from the sky passes into hotter, rarer air near the road and bends away from the normal. Step 2: At a large enough angle it is totally internally reflected upwards. Step 3: We see the sky's image on the road, which looks like water."
        mistakes: {"There really is a thin layer of water on the road": mirage_layers, "The tar reflects light like a mirror": mirage_layers, "Heat waves from the road are coloured blue": mirage_layers}
      - prompt: "Three materials have critical angles of 24°, 42° and 49°. Which has the largest refractive index?"
        options: ["The one with 24°", "The one with 49°", "The one with 42°", "They all have the same index"]
        answer: "The one with 24°"
        difficulty: 3
        hints: ["Diamond has a very large index. What is its critical angle?", "The denser the medium, the sooner light inside gets trapped."]
        solution: "Step 1: A larger refractive index bends light away more strongly as it leaves. Step 2: So the refracted ray reaches 90° at a smaller angle of incidence. Step 3: The smallest critical angle, 24°, goes with the largest index."
        mistakes: {"The one with 49°": smaller_critical, "The one with 42°": smaller_critical, "They all have the same index": smaller_critical}
      - prompt: Which two conditions are needed for total internal reflection?
        options:
        - Denser to rarer, and angle of incidence greater than the critical angle
        - Rarer to denser, and angle greater than the critical angle
        - Denser to rarer, and angle less than the critical angle
        - Any medium, any angle
        answer: Denser to rarer, and angle of incidence greater than the critical angle
        difficulty: 1
        hints:
        - Light must be trying to leave a denser medium.
        - And the angle must be too big for it to get out.
        solution: 'Step 1: Light must go from denser to rarer. Step 2: The angle of incidence must be more than the critical angle. Step 3: Then all of it reflects back.'
        mistakes:
          Rarer to denser, and angle greater than the critical angle: tir_wrong_direction
          Denser to rarer, and angle less than the critical angle: critical_angle_rule
      - prompt: Which of these does NOT use total internal reflection?
        options:
        - A plane mirror
        - An optical fibre
        - The sparkle of a diamond
        - An endoscope
        answer: A plane mirror
        difficulty: 1
        hints:
        - Total internal reflection happens inside a transparent material.
        - A mirror reflects from a shiny coating.
        solution: 'Step 1: Fibres, endoscopes and diamonds trap light inside by total internal reflection. Step 2: A mirror reflects from its silvered back. Step 3: So the plane mirror is the odd one out.'
        mistakes:
          An optical fibre: fibre_tir
      - prompt: Water's critical angle is about 49°. Light in water meets the surface at 40°. What happens?
        options:
        - Most of it refracts out into the air
        - It is totally internally reflected
        - It goes straight up without bending
        answer: Most of it refracts out into the air
        difficulty: 2
        hints:
        - Compare 40° with the critical angle.
        - Is it bigger or smaller?
        solution: 'Step 1: 40° is less than 49°. Step 2: So the light is not trapped. Step 3: Most of it refracts out, bending away from the normal.'
        mistakes:
          It is totally internally reflected: critical_angle_rule
      - prompt: Which material has the smallest critical angle?
        options:
        - Diamond (n = 2.42)
        - Glass (n = 1.5)
        - Water (n = 1.33)
        - Ice (n = 1.31)
        answer: Diamond (n = 2.42)
        difficulty: 2
        hints:
        - A larger refractive index gives a smaller critical angle.
        - Which has the largest n?
        solution: 'Step 1: Critical angle gets smaller as n gets bigger. Step 2: Diamond has the largest n. Step 3: So diamond''s critical angle (about 24°) is smallest.'
        mistakes:
          Ice (n = 1.31): smaller_critical
      - prompt: Light in glass meets the glass–air surface exactly at the critical angle, 42°. What is the angle of refraction, in degrees?
        answer: '90'
        check: '90'
        difficulty: 3
        hints:
        - At the critical angle the refracted ray grazes the surface.
        - What angle is that from the normal?
        solution: 'Step 1: At the critical angle, the ray skims along the surface. Step 2: The surface is at 90° to the normal. Step 3: So the angle of refraction is 90°.'
        mistakes:
          '42': critical_angle_rule
      - prompt: Light in air hits a glass block at 70°. Glass's critical angle is 42°. Will there be total internal reflection at this surface?
        options:
        - 'No: light is going from air into glass, rarer to denser'
        - 'Yes: 70° is more than 42°'
        - Only if the glass is thick
        answer: 'No: light is going from air into glass, rarer to denser'
        difficulty: 3
        hints:
        - Check the direction the light is going.
        - Total internal reflection needs denser to rarer.
        solution: 'Step 1: Air to glass is rarer to denser. Step 2: Total internal reflection can only happen going denser to rarer. Step 3: So no, whatever the angle.'
        mistakes:
          'Yes: 70° is more than 42°': tir_wrong_direction
