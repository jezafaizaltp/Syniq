# Class 9 Physics, chapter 5. Format: content/README.md.
subject: phy
chapter: 5
title: Buoyant Force

tips:
  compare_up_down: "Compare the two forces on the ball: its weight pulls down, the buoyant force pushes up. Which is bigger?"
  deeper_same: "Buoyant force depends on the volume under the liquid and the liquid's density. Once the cube is fully under, does either of these change as it goes deeper?"
  half_immersed: "Only the part under the water pushes water aside."
  other_liquid: "The same volume of liquid is pushed aside, but a lighter liquid weighs less per cm³. Scale the buoyant force by the liquid's density, then subtract."
  part_above: "The fraction under the water matches the object's density compared with water. The question asks about the rest."
  apparent_weight: "Apparent weight in a liquid = real weight − buoyant force."
  displaced_not_object: "Buoyant force = weight of the liquid pushed aside. It also equals the loss of weight in water (weight in air − weight in water). Change grams to kg before × g."
  density_formula: "Density = mass ÷ volume. Divide the mass by the volume."
  floats_if_less_dense: "An object floats if its average density is less than the liquid's density, and sinks if it is greater."
  floating_balance: "A floating object displaces liquid whose weight equals its own weight."
  relative_density_units: "Relative density compares with water, so it has no unit: density of substance ÷ density of water."
  pressure_depth: "Pressure in a liquid increases with depth, so the upward push on the bottom is bigger than the downward push on the top."
  sea_water_denser: "Sea water is denser than fresh water, so it gives more buoyant force for the same volume displaced."
  bucket_buoyancy: "Under water, the well's water pushes up on the bucket. Gravity is the same."
  buoyancy_up: "Gravity pulls a floating object down; buoyancy is the force that balances it. Which way must it act?"
  buoyant_from_volume: "Buoyant force = weight of water displaced: 200 g is 0.2 kg, times 10."
  relative_density: "Relative density = density ÷ density of water (1 g/cm³), so it's the same number with no unit."

concepts:
  - code: phy9.buoyancy.force
    title: Buoyant force and apparent weight
    notes: |
      A liquid pushes up on any object placed in it: the buoyant force (upthrust). It arises because
      pressure increases with depth, so the push on the bottom of the object is greater than on the
      top. An object weighed in a liquid seems lighter: apparent weight = real weight − buoyant force,
      so loss of weight = buoyant force. Buoyant force depends on the volume immersed and the density
      of the liquid.
    explanations:
      text: "Lift a friend in a swimming pool and they feel much lighter. The water is pushing them up. Hang a stone of weight 5 N from a spring balance and lower it into water: the reading drops to 3 N. The water is pushing up with 5 − 3 = 2 N. That upward push is the buoyant force."
      visual: "Draw a block under water with a short arrow pushing down on its top and a longer arrow pushing up on its bottom. The bottom is deeper, so the water pushes harder there. The difference between the arrows is the buoyant force."
      step_by_step: "A stone weighs 12 N in air and 9 N in water. Step 1: Loss of weight = 12 − 9 = 3 N. Step 2: The buoyant force is 3 N."
      real_world: "Divers carry lead weights so they don't keep bobbing up to the surface: the water's buoyant force on their body and suit is large."
    activity:
      type: formula
      prompt: Weigh a stone in air and then in water. The loss of weight is the buoyant force.
      inputs:
      - name: w
        label: Weight in air
        min: 1
        max: 20
        step: 1
        start: 10
        unit: N
      - name: ww
        label: Weight in water
        min: 0
        max: 20
        step: 1
        start: 10
        unit: N
      outputs:
      - name: b
        label: Buoyant force
        expr: w-ww
        unit: N
      goals:
      - prompt: A 10 N stone feels 2 N lighter in water. Set its weight in water.
        want:
          w: 10
          b: 2
        mistakes:
        - when:
            ww: 2
          say: Weight in water 2 N would mean it lost 8 N. The 2 N is how much lighter it feels, not its new weight.
        - when:
            ww: 12
          say: Heavier in water? The water pushes up, so the stone feels lighter, not heavier.
    lesson:
      - teach: 'Push an empty plastic bottle down into a bucket of water: you feel the water pushing it back up. Every liquid pushes upward on anything put into it. This upward push is called the buoyant force, or upthrust.'
        check:
          prompt: Which way does the buoyant force act?
          options:
          - Upward
          - Downward
          - Sideways
          answer: Upward
          why: The liquid pushes the object up, against its weight.
      - teach: Why up? Pressure in a liquid grows with depth. The bottom of an object is deeper than its top, so the liquid pushes harder on the bottom than on the top. The difference is an upward push.
        check:
          prompt: Where is the liquid's push on a submerged brick greatest?
          options:
          - On its bottom face
          - On its top face
          - The same everywhere
          answer: On its bottom face
          why: The bottom is deepest, and pressure increases with depth.
      - teach: 'Weigh a stone on a spring balance in air, then with it under water: it seems lighter. Apparent weight = real weight − buoyant force. So the loss of weight tells you the buoyant force. A stone weighing 12 N in air and 9 N in water has a buoyant force of 3 N.'
        picture:
          kind: compare
          columns:
          - title: In air
            points:
            - balance reads 12 N
          - title: In water
            points:
            - balance reads 9 N
            - buoyant force = 3 N
          alt: 'A stone reads 12 N in air and 9 N in water: the water pushes up with 3 N.'
        check:
          prompt: A block weighs 30 N in air and 22 N in water. What is the buoyant force?
          options:
          - 8 N
          - 52 N
          - 22 N
          answer: 8 N
          why: Loss of weight = 30 − 22 = 8 N.
      - teach: The buoyant force grows with the volume under the liquid and with the liquid's density. Salt water pushes harder than fresh water. But once an object is fully under, going deeper doesn't change the buoyant force.
        check:
          prompt: A fully submerged ball is pushed deeper. What happens to the buoyant force?
          options:
          - It stays the same
          - It increases
          - It decreases
          answer: It stays the same
          why: It displaces the same volume of liquid at any depth once fully under.
    items:
      - prompt: "A stone weighs 12 N in air and 9 N when fully under water. What is the buoyant force on it, in N?"
        answer: "3"
        check: "12 - 9"
        difficulty: 1
        hints: ["Buoyant force = loss of weight."]
        solution: "12 − 9 = 3 N"
        mistakes: {"21": apparent_weight}
      - prompt: "In which direction does the buoyant force act?"
        options: ["Upward", "Downward", "Sideways", "In every direction equally"]
        answer: "Upward"
        difficulty: 1
        hints: ["It makes things feel lighter."]
        solution: "The buoyant force acts upward, opposite to the weight."
        mistakes: {"Downward": "buoyancy_up", "In every direction equally": "buoyancy_up"}
      - prompt: "An object weighs 20 N in air. The buoyant force on it in water is 6 N. What is its apparent weight in water, in N?"
        answer: "14"
        check: "20 - 6"
        difficulty: 1
        hints: ["Real weight − buoyant force."]
        solution: "20 − 6 = 14 N"
        mistakes: {"26": apparent_weight}
      - prompt: "Why does a liquid push upward on an object in it?"
        options: ["Pressure is greater at the bottom of the object, which is deeper", "The liquid is lighter than air", "The object pushes itself up", "Gravity is weaker in liquids"]
        answer: "Pressure is greater at the bottom of the object, which is deeper"
        difficulty: 2
        hints: ["How does pressure change with depth?"]
        solution: "Pressure increases with depth, so the upward push on the bottom is larger than the downward push on the top."
        mistakes: {"Gravity is weaker in liquids": pressure_depth}
      - prompt: "The same block is fully dipped first in fresh water and then in salt water. Where is the buoyant force greater?"
        options: ["Salt water", "Fresh water", "The same in both", "It depends on the block's colour"]
        answer: "Salt water"
        difficulty: 2
        hints: ["Which liquid is denser?"]
        solution: "Salt water is denser, so the same displaced volume weighs more and pushes up harder."
        mistakes: {"The same in both": sea_water_denser, "Fresh water": sea_water_denser}
      - prompt: "A block weighs 15 N in air, 10 N in water and 9 N in salt water. How much greater, in N, is the buoyant force in salt water than in water?"
        answer: "1"
        check: "(15 - 9) - (15 - 10)"
        difficulty: 3
        hints: ["Find each buoyant force first: 5 N and 6 N."]
        solution: "Step 1: In water: 15 − 10 = 5 N. Step 2: In salt water: 15 − 9 = 6 N. Step 3: Difference 1 N."
        mistakes: {"-1": apparent_weight}
      - prompt: "A ball weighing 3 N is held fully under water, where the buoyant force on it is 5 N. What happens when it is let go?"
        options: ["It rises, because the upward push is bigger than its weight", "It sinks, because it has weight", "It stays where it is", "It rises only if it is hollow"]
        answer: "It rises, because the upward push is bigger than its weight"
        difficulty: 2
        hints: ["Two forces act on it: which way does each point?", "Which is bigger, 3 N down or 5 N up?"]
        solution: "Step 1: Weight 3 N down, buoyant force 5 N up. Step 2: Net force 2 N upward, so it rises (until it floats with less of it under)."
        mistakes: {"It sinks, because it has weight": compare_up_down, "It stays where it is": compare_up_down, "It rises only if it is hollow": compare_up_down}
      - prompt: "An iron cube already fully under water is lowered further down. What happens to the buoyant force on it?"
        options: ["It stays the same", "It increases", "It decreases", "It becomes zero at the bottom"]
        answer: "It stays the same"
        difficulty: 3
        hints: ["What does the buoyant force depend on?", "Does the volume of water pushed aside change with depth?"]
        solution: "Step 1: Buoyant force = weight of the water displaced. Step 2: Fully under, the cube always displaces its own volume, so the force does not change with depth. (Pressure grows on top and bottom alike.)"
        mistakes: {"It increases": deeper_same, "It decreases": deeper_same, "It becomes zero at the bottom": deeper_same}
      - prompt: "A block weighs 25 N in air, 15 N in water and 17 N in oil. The buoyant force in oil is what fraction of the buoyant force in water?"
        answer: "0.8"
        check: "(25-17)/(25-15)"
        difficulty: 3
        hints: ["Buoyant force = weight in air − weight in the liquid.", "Water: 10 N. Oil: 8 N."]
        solution: "Step 1: In water: 25 − 15 = 10 N. Step 2: In oil: 25 − 17 = 8 N. Step 3: 8 ÷ 10 = 0.8."
        mistakes: {"1.13": apparent_weight, "1.25": apparent_weight, "0.88": apparent_weight}
      - prompt: A brass weight reads 5 N in air and 4.4 N in water. What is the buoyant force, in N?
        answer: '0.6'
        check: 5 - 4.4
        difficulty: 1
        hints:
        - Buoyant force = loss of weight.
        - 5 − 4.4.
        solution: 'Step 1: Real weight 5 N. Step 2: Apparent weight 4.4 N. Step 3: Buoyant force = 0.6 N.'
        mistakes:
          '9.4': apparent_weight
      - prompt: An object weighs 18 N in air. In water the buoyant force on it is 4 N. What does a spring balance read when it is under water, in N?
        answer: '14'
        check: 18 - 4
        difficulty: 1
        hints:
        - Apparent weight = real weight − buoyant force.
        - 18 − 4.
        solution: 'Step 1: Apparent weight = 18 − 4. Step 2: = 14 N. Step 3: The balance reads 14 N.'
        mistakes:
          '22': buoyancy_up
          '4': apparent_weight
      - prompt: An egg sinks in fresh water but floats when lots of salt is stirred in. Why?
        options:
        - Salt water is denser, so it gives a bigger buoyant force
        - The salt makes the egg lighter
        - Salt water pulls the egg up
        - The egg absorbs the salt
        answer: Salt water is denser, so it gives a bigger buoyant force
        difficulty: 2
        hints:
        - Buoyant force depends on the liquid's density.
        - Is salt water denser or less dense than fresh water?
        solution: 'Step 1: Dissolving salt makes the water denser. Step 2: A denser liquid pushes up harder on the same volume. Step 3: The upthrust becomes bigger than the egg''s weight.'
        mistakes:
          The salt makes the egg lighter: sea_water_denser
      - prompt: A cork weighing 0.5 N is held under water, where the buoyant force on it is 2 N. When let go, what is the net upward force on it, in N?
        answer: '1.5'
        check: 2 - 0.5
        difficulty: 2
        hints:
        - Upward push minus weight.
        - 2 − 0.5.
        solution: 'Step 1: Up: 2 N. Step 2: Down: 0.5 N. Step 3: Net force = 1.5 N upward, so it rises.'
        mistakes:
          '2.5': compare_up_down
      - prompt: A block weighs 12 N in air and 7 N when half of it is under water. What will it read when fully under water, in N?
        answer: '2'
        check: 12 - 2*(12 - 7)
        difficulty: 3
        hints:
        - Half under gives 5 N of buoyant force.
        - Fully under displaces twice as much water.
        solution: 'Step 1: Half under: buoyant force = 5 N. Step 2: Fully under: 10 N. Step 3: Apparent weight = 12 − 10 = 2 N.'
        mistakes:
          '7': half_immersed
      - prompt: Which change makes the buoyant force on a fully submerged object bigger?
        options:
        - Moving it into a denser liquid
        - Lowering it deeper in the same liquid
        - Painting it a darker colour
        - Making it heavier without changing its size
        answer: Moving it into a denser liquid
        difficulty: 3
        hints:
        - Buoyant force depends on the volume under the liquid and the liquid's density.
        - Which option changes one of these?
        solution: 'Step 1: Depth doesn''t matter once fully under. Step 2: The object''s own weight doesn''t change the push. Step 3: A denser liquid gives a bigger buoyant force.'
        mistakes:
          Lowering it deeper in the same liquid: deeper_same

  - code: phy9.buoyancy.archimedes
    title: Archimedes' principle
    after: [phy9.buoyancy.force]
    notes: |
      Archimedes' principle: when an object is wholly or partly immersed in a liquid, it experiences a
      buoyant force equal to the weight of the liquid it displaces. Loss of weight = weight of liquid
      displaced. A fully immersed object displaces its own volume of liquid. With g = 10 m/s² and water
      density 1000 kg/m³, 1 litre (0.001 m³) of water weighs 10 N.
    explanations:
      text: "Archimedes noticed the water rise as he got into his bath. Push an object into a full glass of water and some spills out: the object has displaced that water. The water pushes up on the object with a force exactly equal to the weight of the water that spilled."
      visual: "Picture an overflow can full to the spout. Lower a stone on a spring balance into it. Catch the spilled water in a beaker and weigh it: it equals the drop in the spring-balance reading."
      step_by_step: "A 200 cm³ stone is fully under water. Step 1: It displaces 200 cm³ of water. Step 2: That water has mass 200 g = 0.2 kg. Step 3: Its weight is 0.2 × 10 = 2 N. Step 4: Buoyant force = 2 N."
      real_world: "Ships are measured by displacement: a ship of 50,000 tonnes displacement pushes aside 50,000 tonnes of sea water."
    activity:
      type: formula
      prompt: Buoyant force = weight of liquid pushed aside. 1 litre of water weighs 9.8 N.
      inputs:
      - name: v
        label: Volume under water
        min: 0
        max: 10
        step: 0.5
        start: 0
        unit: litres
      outputs:
      - name: b
        label: Buoyant force
        expr: 9.8*v
        unit: N
        places: 1
      goals:
      - prompt: Get a buoyant force of 49 N.
        want:
          b:
          - 48.9
          - 49.1
    lesson:
      - teach: Fill a jug to the brim and gently lower a stone into it. Water spills out. That water was displaced, pushed aside to make room for the stone. A fully submerged object displaces its own volume of liquid.
        check:
          prompt: A 50 cm³ stone is fully dropped into a brim-full jug. How much water spills?
          options:
          - 50 cm³
          - Less than 50 cm³
          - It depends on the stone's weight
          answer: 50 cm³
          why: 'Fully submerged, it displaces its own volume: 50 cm³.'
      - teach: 'Archimedes'' principle: an object wholly or partly in a liquid feels an upward buoyant force equal to the weight of the liquid it displaces. Weigh the spilled water and you know the buoyant force.'
        check:
          prompt: An object displaces water weighing 4 N. What is the buoyant force?
          options:
          - 4 N
          - It depends on the object's weight
          - 0 N
          answer: 4 N
          why: 'Archimedes: buoyant force = weight of liquid displaced.'
      - teach: 'For water, 1 cm³ has a mass of 1 g, and with g = 10 m/s², 100 g weighs 1 N. So a stone of volume 200 cm³ under water displaces 200 g of water, weighing 2 N: the buoyant force is 2 N. Going backwards, a loss of weight of 4 N means 400 g of water displaced, so the volume is 400 cm³.'
        picture:
          kind: flow
          steps:
          - 'Volume under water: 200 cm³'
          - 'Water displaced: 200 g'
          - 'Its weight: 2 N'
          - Buoyant force = 2 N
          alt: A 200 cm³ object displaces 200 g of water, weighing 2 N, so the buoyant force is 2 N.
        check:
          prompt: A 300 cm³ block is fully under water. What is the buoyant force? (g = 10 m/s²)
          options:
          - 3 N
          - 300 N
          - 30 N
          answer: 3 N
          why: 300 cm³ of water has a mass of 300 g = 0.3 kg, which weighs 0.3 × 10 = 3 N.
    items:
      - prompt: "According to Archimedes' principle, the buoyant force equals:"
        options: ["The weight of the liquid displaced", "The weight of the object", "The volume of the object", "The density of the liquid"]
        answer: "The weight of the liquid displaced"
        difficulty: 1
        hints: ["Think of the water that spills out."]
        solution: "Buoyant force = weight of liquid displaced."
        mistakes: {"The weight of the object": displaced_not_object}
      - prompt: "An object fully under water displaces 300 g of water. What is the buoyant force on it, in N? (g = 10 m/s²)"
        answer: "3"
        check: "Rational(300, 1000)*10"
        difficulty: 1
        hints: ["300 g = 0.3 kg."]
        solution: "Weight of water = 0.3 × 10 = 3 N."
        mistakes: {"3000": displaced_not_object}
      - prompt: "A stone of volume 200 cm³ is fully under water. What is the buoyant force on it, in N? (1 cm³ of water has mass 1 g; g = 10 m/s²)"
        answer: "2"
        check: "Rational(200, 1000)*10"
        difficulty: 2
        hints: ["It displaces 200 cm³ = 200 g of water."]
        solution: "200 g = 0.2 kg; 0.2 × 10 = 2 N."
        mistakes: {"2000": "grams_not_kg", "200": "buoyant_from_volume"}
      - prompt: "A metal piece weighs 8 N in air and 6.5 N in water. What is the weight of the water it displaces, in N?"
        answer: "1.5"
        check: "8 - Rational(13, 2)"
        difficulty: 2
        hints: ["Loss of weight = weight of liquid displaced."]
        solution: "8 − 6.5 = 1.5 N"
        mistakes: {"6.5": displaced_not_object, "14.5": apparent_weight}
      - prompt: "A block weighs 10 N in air and 6 N in water. What is its volume, in cm³? (g = 10 m/s²; 1 cm³ of water has mass 1 g)"
        answer: "400"
        check: "(10 - 6)/10*1000"
        difficulty: 3
        hints: ["Buoyant force 4 N means 0.4 kg of water displaced.", "0.4 kg of water is 400 cm³."]
        solution: "Step 1: Buoyant force = 4 N. Step 2: Water displaced = 0.4 kg = 400 g. Step 3: Volume = 400 cm³."
        mistakes: {"600": displaced_not_object, "1000": displaced_not_object}
      - prompt: "A half-filled bucket of water is lifted while still under the water of a well. Why does it feel lighter than after it comes out?"
        options: ["Water in the well gives it a buoyant force", "The water in the bucket weighs nothing", "Gravity is weaker in a well", "The rope gets stronger in water"]
        answer: "Water in the well gives it a buoyant force"
        difficulty: 2
        hints: ["What pushes up on things under water?"]
        solution: "While under water, the bucket and its water feel an upward buoyant force, so less pull is needed."

        mistakes: {"Gravity is weaker in a well": "bucket_buoyancy", "The water in the bucket weighs nothing": "bucket_buoyancy"}
      - prompt: "A wooden block of volume 500 cm³ floats with exactly half of it under water. What is the buoyant force on it, in N? (1 cm³ of water has a mass of 1 g; g = 10 m/s²)"
        answer: "2.5"
        check: "250/1000*10"
        difficulty: 2
        hints: ["How many cm³ are under water?", "250 cm³ of water has a mass of 250 g."]
        solution: "Step 1: Volume under water = 250 cm³. Step 2: That water has a mass of 0.25 kg and weighs 2.5 N."
        mistakes: {"5": half_immersed, "2500": grams_not_kg, "250": grams_not_kg}
      - prompt: "A stone weighs 6 N in air and 4 N in water. What is its density, in g/cm³? (g = 10 m/s²; 1 cm³ of water has a mass of 1 g)"
        answer: "3"
        check: "600/200"
        difficulty: 3
        hints: ["Loss of weight = weight of water displaced = 2 N, which is 200 g of water.", "So the stone's volume is 200 cm³. Its mass is 600 g."]
        solution: "Step 1: Loss of weight = 2 N, so 200 g of water is displaced and the volume is 200 cm³. Step 2: Mass = 6 ÷ 10 = 0.6 kg = 600 g. Step 3: Density = 600 ÷ 200 = 3 g/cm³."
        mistakes: {"1.5": apparent_weight, "2": density_formula, "1/3": density_formula}
      - prompt: "A stone weighs 6 N in air and 4 N in water. What would it weigh when fully dipped in a liquid of density 0.8 g/cm³, in N?"
        answer: "4.4"
        check: "6 - 2*0.8"
        difficulty: 3
        hints: ["In water the buoyant force is 2 N.", "The liquid is 0.8 times as dense, so the buoyant force is 0.8 × 2."]
        solution: "Step 1: Buoyant force in water = 2 N. Step 2: In the liquid: 0.8 × 2 = 1.6 N. Step 3: Weight in the liquid = 6 − 1.6 = 4.4 N."
        mistakes: {"4": other_liquid, "4.8": other_liquid, "3.5": other_liquid}
      - prompt: A ball fully under water displaces 0.5 kg of water. What is the buoyant force on it, in N? (g = 10 m/s²)
        answer: '5'
        check: 0.5*10
        difficulty: 1
        hints:
        - Buoyant force = weight of water displaced.
        - 0.5 × 10.
        solution: 'Step 1: Mass of water displaced = 0.5 kg. Step 2: Its weight = 0.5 × 10 = 5 N. Step 3: So the buoyant force is 5 N.'
        mistakes:
          '0.5': displaced_not_object
      - prompt: A stone of volume 150 cm³ is fully under water. What is the buoyant force on it, in N? (1 cm³ of water has mass 1 g; g = 10 m/s²)
        answer: '1.5'
        check: 150/1000*10
        difficulty: 1
        hints:
        - It displaces 150 cm³ of water.
        - 150 g of water weighs 1.5 N.
        solution: 'Step 1: Water displaced = 150 cm³ = 150 g. Step 2: 150 g = 0.15 kg. Step 3: 0.15 × 10 = 1.5 N.'
        mistakes:
          '150': buoyant_from_volume
      - prompt: A metal block weighs 9 N in air and 7.8 N in water. What is the weight of the water it displaces, in N?
        answer: '1.2'
        check: 9 - 7.8
        difficulty: 2
        hints:
        - Loss of weight = buoyant force.
        - Buoyant force = weight of water displaced.
        solution: 'Step 1: Loss of weight = 9 − 7.8 = 1.2 N. Step 2: This is the buoyant force. Step 3: By Archimedes, the displaced water weighs 1.2 N.'
        mistakes:
          '7.8': apparent_weight
      - prompt: A stone weighs 5 N in air and 3 N in water. What is its volume, in cm³? (g = 10 m/s²; 1 cm³ of water has mass 1 g)
        answer: '200'
        check: (5 - 3)/10*1000
        difficulty: 2
        hints:
        - Buoyant force = 2 N = weight of water displaced.
        - 2 N of water has a mass of 200 g.
        solution: 'Step 1: Buoyant force = 2 N. Step 2: Displaced water''s mass = 2 ÷ 10 = 0.2 kg = 200 g. Step 3: 200 g of water is 200 cm³, the stone''s volume.'
        mistakes:
          '300': apparent_weight
          '500': displaced_not_object
      - prompt: A stone weighs 8 N in air and 6 N in water. What is its density, in g/cm³?
        answer: '4'
        check: 8/(8 - 6)
        difficulty: 3
        hints:
        - Density ÷ water's density = weight in air ÷ loss of weight.
        - 8 ÷ 2.
        solution: 'Step 1: Loss of weight = 2 N, the weight of an equal volume of water. Step 2: The stone weighs 8 ÷ 2 = 4 times as much as the same volume of water. Step 3: So its density is 4 g/cm³.'
        mistakes:
          '1.333': density_formula
      - prompt: A block weighs 10 N in air and 8 N in water. What does it weigh when fully in a liquid of density 1.2 g/cm³, in N?
        answer: '7.6'
        check: 10 - 2*1.2
        difficulty: 3
        hints:
        - In water, buoyant force = 2 N.
        - In the denser liquid, it is 1.2 times as much.
        solution: 'Step 1: Buoyant force in water = 2 N. Step 2: In the liquid it is 2 × 1.2 = 2.4 N. Step 3: Apparent weight = 10 − 2.4 = 7.6 N.'
        mistakes:
          '8': other_liquid
  - code: phy9.buoyancy.density
    title: Density, floating and sinking
    after: [phy9.buoyancy.archimedes]
    notes: |
      Density = mass ÷ volume (kg/m³ or g/cm³). Water: 1000 kg/m³ = 1 g/cm³. Relative density =
      density of the substance ÷ density of water (no unit). An object floats if its density is less
      than the liquid's and sinks if greater. A floating object sinks until the liquid it displaces
      weighs as much as the object (law of flotation). A hydrometer measures the density of liquids.
      Ships float, though made of steel, because their hollow shape gives a low average density.
    explanations:
      text: "Iron sinks but a ship made of iron floats. A solid iron block is much denser than water. A ship's hull is mostly air inside, so its average density is less than water's. It settles until it has pushed aside its own weight of water, and then floats."
      visual: "Draw three beakers: a wooden block floating high (low density), an ice cube floating mostly underwater (density 0.92 g/cm³), and a stone on the bottom (density more than water)."
      step_by_step: "A 60 g block has volume 75 cm³. Will it float in water? Step 1: Density = 60 ÷ 75 = 0.8 g/cm³. Step 2: Water is 1 g/cm³. Step 3: 0.8 < 1, so it floats."
      real_world: "A lactometer, a kind of hydrometer, checks milk for added water: watered-down milk is less dense, so the lactometer sinks deeper."
    activity:
      type: sort
      prompt: Water's density is 1 g/cm³. Does it float or sink?
      bins:
      - Floats
      - Sinks
      items:
      - label: Wood (0.6 g/cm³)
        bin: Floats
        clue: Compare 0.6 with water's 1.
        why: '0.6 is less than 1: wood floats.'
      - label: Iron (7.8 g/cm³)
        bin: Sinks
        clue: Compare 7.8 with water's 1.
        why: '7.8 is more than 1: a block of iron sinks. Iron ships float only because their shape holds lots of air.'
      - label: Ice (0.92 g/cm³)
        bin: Floats
        why: Just less dense than water, so it floats with most of it under water.
        clue: Compare 0.92 with water's 1.
      - label: Stone (2.5 g/cm³)
        bin: Sinks
        clue: Compare 2.5 with water's 1.
        why: '2.5 is more than 1: stone sinks.'
      - label: Cork (0.24 g/cm³)
        bin: Floats
        clue: Compare 0.24 with water's 1.
        why: '0.24 is much less than 1: cork floats high.'
      - label: Aluminium (2.7 g/cm³)
        bin: Sinks
        clue: Compare 2.7 with water's 1.
        why: '2.7 is more than 1: a block of aluminium sinks.'
    lesson:
      - teach: 'Density tells you how much mass is packed into each bit of volume: density = mass ÷ volume. Water has a density of 1 g/cm³ (1000 kg/m³). Iron is about 7.9 g/cm³; wood can be 0.6 g/cm³. Relative density compares with water: density ÷ water''s density, with no unit.'
        check:
          prompt: A 40 g block has a volume of 50 cm³. What is its density?
          options:
          - 0.8 g/cm³
          - 1.25 g/cm³
          - 2000 g/cm³
          answer: 0.8 g/cm³
          why: 40 ÷ 50 = 0.8 g/cm³. Divide mass by volume, not the other way.
      - teach: Whether something floats depends on density. If it is less dense than the liquid, it floats; if it is denser, it sinks. A wooden block (0.6 g/cm³) floats on water; an iron nail (7.9 g/cm³) sinks.
        check:
          prompt: A plastic toy has a density of 1.2 g/cm³. In water, will it float or sink?
          options:
          - Sink
          - Float
          answer: Sink
          why: 1.2 g/cm³ is more than water's 1 g/cm³.
      - teach: 'A floating object sinks until the liquid it displaces weighs as much as the object: the law of flotation. So a floating 5000 N boat displaces 5000 N of water. A steel ship floats because its hollow shape, full of air, makes its average density less than water''s. Ice (0.9 g/cm³) floats with 9/10 under water.'
        picture:
          kind: compare
          columns:
          - title: Floats
            points:
            - density less than liquid
            - weight = weight of liquid displaced
          - title: Sinks
            points:
            - density more than liquid
            - weight > largest possible upthrust
          alt: An object floats when it is less dense than the liquid and sinks when it is denser.
        check:
          prompt: A floating log weighs 800 N. What is the weight of the water it displaces?
          options:
          - 800 N
          - Less than 800 N
          - More than 800 N
          answer: 800 N
          why: 'Law of flotation: a floating object displaces its own weight of liquid.'
    items:
      - prompt: "A block has mass 60 g and volume 75 cm³. What is its density, in g/cm³?"
        answer: "0.8"
        check: "Rational(60, 75)"
        difficulty: 1
        hints: ["Density = mass ÷ volume."]
        solution: "60 ÷ 75 = 0.8 g/cm³"
        mistakes: {"5/4": density_formula, "4500": density_formula}
      - prompt: "A substance has density 2.7 g/cm³. What is its relative density?"
        answer: "2.7"
        check: "Rational(27, 10)/1"
        difficulty: 1
        hints: ["Divide by water's density, 1 g/cm³."]
        solution: "2.7 ÷ 1 = 2.7 (no unit)."
        mistakes: {"2700": "relative_density", "0.27": "relative_density"}
      - prompt: "Which object will float in water (density 1 g/cm³)?"
        options: ["A block of density 0.6 g/cm³", "A block of density 2.7 g/cm³", "A block of density 7.8 g/cm³", "A block of density 1.2 g/cm³"]
        answer: "A block of density 0.6 g/cm³"
        difficulty: 1
        hints: ["It must be less dense than water."]
        solution: "Only 0.6 g/cm³ is less than 1 g/cm³."
        mistakes: {"A block of density 1.2 g/cm³": floats_if_less_dense}
      - prompt: "A floating boat weighs 5000 N. What is the weight of water it displaces, in N?"
        answer: "5000"
        check: "5000"
        difficulty: 2
        hints: ["Law of flotation."]
        solution: "A floating object displaces its own weight of liquid: 5000 N."
        mistakes: {"0": floating_balance}
      - prompt: "Why does a steel ship float while a steel nail sinks?"
        options: ["The ship's hollow shape makes its average density less than water's", "Ships are made of lighter steel", "Sea water pulls ships up", "Nails are magnetic"]
        answer: "The ship's hollow shape makes its average density less than water's"
        difficulty: 2
        hints: ["What fills most of a ship's hull?"]
        solution: "The hull encloses a lot of air, so the ship's overall density is lower than water's."
        mistakes: {"Ships are made of lighter steel": floats_if_less_dense}
      - prompt: "A lactometer sinks deeper in a milk sample than in pure milk. What does this suggest?"
        options: ["Water has been added to the milk", "The milk is extra thick", "The milk is hotter", "The lactometer is broken"]
        answer: "Water has been added to the milk"
        difficulty: 3
        hints: ["A hydrometer sinks deeper in a less dense liquid."]
        solution: "Watered-down milk is less dense, so the lactometer must displace more of it to float, and sinks deeper."
        mistakes: {"The milk is extra thick": floats_if_less_dense}
      - prompt: "Ice has density 0.9 g/cm³. What fraction of a floating ice block is under fresh water (density 1 g/cm³)?"
        answer: "9/10"
        check: "Rational(9, 10)/1"
        difficulty: 3
        hints: ["Fraction submerged = density of object ÷ density of liquid."]
        solution: "0.9 ÷ 1 = 9/10: most of an iceberg is hidden under water."
        mistakes: {"1/10": floating_balance}
      - prompt: "A wooden block of density 0.6 g/cm³ floats in fresh water. What fraction of its volume is above the water?"
        answer: "2/5"
        check: "1 - 6/10"
        difficulty: 3
        hints: ["The fraction under water = 0.6 ÷ 1.", "Above = whole − under."]
        solution: "Step 1: Under water: 0.6 = 3/5. Step 2: Above: 1 − 3/5 = 2/5."
        mistakes: {"3/5": part_above, "0.6": part_above}
      - prompt: "A ship sails from a river into the sea. How does it sit in the water?"
        options: ["It rises a little", "It sinks a little lower", "No change", "It sinks completely"]
        answer: "It rises a little"
        difficulty: 3
        hints: ["The ship's weight stays the same.", "Sea water is denser. How much of it must be pushed aside to match the same weight?"]
        solution: "Step 1: A floating ship displaces its own weight of water. Step 2: Sea water is denser, so a smaller volume weighs the same. Step 3: Less of the ship is under water, so it rises a little."
        mistakes: {"It sinks a little lower": sea_water_denser, "No change": floating_balance, "It sinks completely": floats_if_less_dense}
      - prompt: "An object of volume 200 cm³ and mass 180 g is put into oil of density 0.8 g/cm³. What happens?"
        options: ["It sinks", "It floats with most of it under", "It floats with half of it under", "You cannot tell without its shape"]
        answer: "It sinks"
        difficulty: 2
        hints: ["Find the object's density first.", "Compare it with 0.8 g/cm³."]
        solution: "Step 1: Density = 180 ÷ 200 = 0.9 g/cm³. Step 2: 0.9 is more than the oil's 0.8, so it sinks (it would float in water)."
        mistakes: {"It floats with most of it under": floats_if_less_dense, "It floats with half of it under": floats_if_less_dense, "You cannot tell without its shape": density_formula}
      - prompt: A stone has mass 75 g and volume 30 cm³. What is its density, in g/cm³?
        answer: '2.5'
        check: 75/30
        difficulty: 1
        hints:
        - Density = mass ÷ volume.
        - 75 ÷ 30.
        solution: 'Step 1: Density = mass ÷ volume. Step 2: 75 ÷ 30. Step 3: = 2.5 g/cm³.'
        mistakes:
          '0.4': density_formula
      - prompt: Which object sinks in water?
        options:
        - A glass marble, density 2.5 g/cm³
        - A cork, density 0.25 g/cm³
        - A block of wax, density 0.9 g/cm³
        - A dry coconut shell, density 0.7 g/cm³
        answer: A glass marble, density 2.5 g/cm³
        difficulty: 1
        hints:
        - Compare each density with water's 1 g/cm³.
        - Denser than water sinks.
        solution: 'Step 1: Water''s density is 1 g/cm³. Step 2: Only the marble is denser. Step 3: So the marble sinks; the others float.'
        mistakes:
          A block of wax, density 0.9 g/cm³: floats_if_less_dense
      - prompt: Silver has a density of 10.5 g/cm³. What is its relative density?
        options:
        - '10.5'
        - 10.5 g/cm³
        - '1.05'
        - '0.105'
        answer: '10.5'
        difficulty: 2
        hints:
        - Relative density = density ÷ density of water.
        - Water's density is 1 g/cm³, and the units cancel.
        solution: 'Step 1: 10.5 ÷ 1 = 10.5. Step 2: The units cancel. Step 3: So the relative density is 10.5, with no unit.'
        mistakes:
          10.5 g/cm³: relative_density_units
      - prompt: A floating raft weighs 2400 N. What mass of water does it displace, in kg? (g = 10 m/s²)
        answer: '240'
        check: 2400/10
        difficulty: 2
        hints:
        - 'It displaces its own weight of water: 2400 N.'
        - Mass = weight ÷ g.
        solution: 'Step 1: Displaced water weighs 2400 N. Step 2: Mass = 2400 ÷ 10. Step 3: = 240 kg.'
        mistakes:
          '2400': floating_balance
      - prompt: A block of density 0.75 g/cm³ floats in water. What fraction of its volume is under water? Type a fraction like 2/3.
        answer: 3/4
        check: 0.75/1
        difficulty: 3
        hints:
        - Fraction under = density of block ÷ density of water.
        - 0.75 ÷ 1.
        solution: 'Step 1: Floating: weight of block = weight of water displaced. Step 2: So fraction under = 0.75 ÷ 1. Step 3: = 3/4.'
        mistakes:
          1/4: part_above
      - prompt: A ship sails from the sea into a river. What happens to how deep it sits?
        options:
        - It sinks a little deeper
        - It rises a little
        - No change
        - It sinks completely
        answer: It sinks a little deeper
        difficulty: 3
        hints:
        - River water is less dense than sea water.
        - It must still displace its own weight.
        solution: 'Step 1: The ship''s weight doesn''t change. Step 2: River water is less dense, so more volume is needed for the same weight. Step 3: The ship sits a little deeper.'
        mistakes:
          It rises a little: sea_water_denser
