# Class 9 Physics, chapter 7. Format: content/README.md.
subject: phy
chapter: 7
title: Electric Current

tips:
  volt_meaning: "Potential difference is the work done to move each coulomb of charge. Which pair of units says 'work per charge'?"
  seconds_needed: "Current is coulombs per second, so the time must be in seconds before you multiply."
  work_vq: "Potential difference is work per coulomb, so the work is V × Q. The time is not needed for this."
  stretched_wire: "Stretching changes two things: the wire gets longer and also thinner. Each change raises the resistance."
  mixed_circuit: "Work out the parallel pair first, as one resistor, then add the resistor in series with it."
  whole_bulbs_only: "Find the most power the fuse allows (P = VI). You can only switch on whole bulbs, and you must stay within that limit."
  charge_time: "Current = charge ÷ time (I = Q ÷ t). Charge = current × time."
  ohm_rearrange: "Ohm's law: V = IR. For current divide V by R; for resistance divide V by I."
  series_add: "In series, resistances add: R = R₁ + R₂ + …"
  parallel_reciprocal: "In parallel, 1/R = 1/R₁ + 1/R₂ + … The total is smaller than the smallest resistor."
  ammeter_voltmeter: "An ammeter measures the current flowing through a part, so all of it must pass through the meter. A voltmeter measures across a part, side by side with it."
  power_vi: "Electric power P = VI (= I²R = V²/R). Energy = power × time."
  current_direction: "Conventional current was defined before electrons were found. Electrons are negative, so they actually move the opposite way to conventional current."
  electrons_move: "In a metal, the nucleus and its protons are fixed in place. Only the loosely held outer particles are free to drift along the wire."
  nichrome_high: "A heater needs a material that resists current strongly and gets hot: high resistivity."
  resistance_length: "Resistance is proportional to length: twice as long, twice the resistance."

concepts:
  - code: phy9.current.charge
    title: Charge, current and potential difference
    notes: |
      Electric current is the rate of flow of charge: I = Q ÷ t, unit ampere (1 A = 1 C/s). Current in
      metals is a flow of electrons; conventional current flows from + to −. Potential difference
      (voltage) is the work done per unit charge, V = W ÷ Q, unit volt (1 V = 1 J/C), measured with a
      voltmeter connected in parallel. Current is measured with an ammeter connected in series. A
      cell or battery maintains the potential difference.
    explanations:
      text: "Think of water in pipes: the current is how much water flows past each second, and the potential difference is the push from a raised tank. A battery provides the push; electrons drift through the wires. If 10 coulombs of charge pass a point in 2 seconds, the current is 10 ÷ 2 = 5 A."
      visual: "Draw a circuit: a cell, a switch, a bulb. Put the ammeter in the loop itself (series). Put the voltmeter on a side branch across the bulb (parallel)."
      step_by_step: "Charge through a bulb carrying 0.5 A for 1 minute: Step 1: t = 60 s. Step 2: Q = I × t = 0.5 × 60. Step 3: Q = 30 C."
      real_world: "A mobile charger label like '5 V, 2 A' tells you the push (voltage) and the flow (current) it supplies."
    activity:
      type: formula
      prompt: Current = charge ÷ time.
      inputs:
      - name: q
        label: Charge
        min: 0
        max: 60
        step: 2
        start: 0
        unit: C
      - name: t
        label: Time
        min: 1
        max: 20
        step: 1
        start: 1
        unit: s
      outputs:
      - name: i
        label: Current
        expr: q/t
        unit: A
        places: 2
      goals:
      - prompt: Make a current of 2 A for 5 s.
        want:
          i: 2
          t: 5
    lesson:
      - teach: 'Switch on a torch and charge starts to flow round the circuit. Electric current is how much charge flows past a point each second: I = Q ÷ t. Charge is measured in coulombs (C), current in amperes (A). 1 A means 1 coulomb every second.'
        check:
          prompt: 6 C of charge flows past a point in 3 s. What is the current?
          options:
          - 2 A
          - 18 A
          - 0.5 A
          answer: 2 A
          why: I = Q ÷ t = 6 ÷ 3 = 2 A.
      - teach: In a metal wire, the particles that move are electrons, tiny negative charges. They drift from the − end to the + end of the cell. But long before electrons were found, scientists agreed that current flows from + to −. We still draw this 'conventional current', opposite to the electrons.
        picture:
          kind: compare
          columns:
          - title: Conventional current
            points:
            - drawn from + to −
            - agreed before electrons were known
          - title: Electron flow
            points:
            - electrons drift from − to +
            - what really moves in a metal
          alt: Conventional current goes from + to −; electrons actually drift from − to +.
        check:
          prompt: In a copper wire, which way do the electrons drift?
          options:
          - From the − end to the + end
          - From the + end to the − end
          - They don't move
          answer: From the − end to the + end
          why: Electrons are negative, so they move opposite to conventional current.
      - teach: 'Charge flows only when there is a potential difference (voltage), kept up by a cell or battery. Potential difference is the work done to move each coulomb: V = W ÷ Q. 1 volt = 1 joule per coulomb. A 3 V cell gives each coulomb 3 J of energy.'
        check:
          prompt: A 9 V battery pushes 2 C of charge round a circuit. How much work does it do?
          options:
          - 18 J
          - 4.5 J
          - 11 J
          answer: 18 J
          why: W = V × Q = 9 × 2 = 18 J.
      - teach: 'Meters: an ammeter measures current, so all the current must pass through it. Connect it in series. A voltmeter measures the potential difference across a part, so it goes side by side with it: in parallel.'
        check:
          prompt: How is a voltmeter connected to measure the voltage across a bulb?
          options:
          - In parallel with the bulb
          - In series with the bulb
          - Anywhere in the circuit
          answer: In parallel with the bulb
          why: It measures across the bulb, so its two ends join the bulb's two ends.
    items:
      - prompt: "10 C of charge flows through a wire in 2 s. What is the current, in A?"
        answer: "5"
        check: "10/2"
        difficulty: 1
        hints: ["I = Q ÷ t."]
        solution: "10 ÷ 2 = 5 A"
        mistakes: {"20": charge_time, "1/5": charge_time}
      - prompt: "How is an ammeter connected in a circuit?"
        options: ["In series", "In parallel", "Across the cell only", "It is not connected"]
        answer: "In series"
        difficulty: 1
        hints: ["All the current must flow through it."]
        solution: "An ammeter goes in series so the whole current passes through it."
        mistakes: {"In parallel": ammeter_voltmeter}
      - prompt: "A current of 0.5 A flows through a bulb for 1 minute. How much charge passes, in C?"
        answer: "30"
        check: "Rational(1, 2)*60"
        difficulty: 2
        hints: ["1 minute = 60 s."]
        solution: "Q = 0.5 × 60 = 30 C"
        mistakes: {"1/2": charge_time}
      - prompt: "12 J of work moves 4 C of charge between two points. What is the potential difference, in V?"
        answer: "3"
        check: "12/4"
        difficulty: 2
        hints: ["V = W ÷ Q."]
        solution: "12 ÷ 4 = 3 V"
        mistakes: {"48": charge_time}
      - prompt: "In a metal wire, which particles actually move to carry the current?"
        options: ["Electrons", "Protons", "Neutrons", "Whole atoms"]
        answer: "Electrons"
        difficulty: 1
        hints: ["They are free to move in metals."]
        solution: "Free electrons drift through the metal."
        mistakes: {"Protons": "electrons_move", "Whole atoms": "electrons_move"}
      - prompt: "Conventional current flows from + to −. In which direction do electrons flow in the wire?"
        options: ["From − to +", "From + to −", "Both ways equally", "They do not move"]
        answer: "From − to +"
        difficulty: 3
        hints: ["Electrons are negative."]
        solution: "Electrons move opposite to conventional current, from the negative terminal to the positive."
        mistakes: {"From + to −": current_direction}
      - prompt: "Which of these is the same as 1 volt?"
        options: ["1 joule per coulomb", "1 coulomb per second", "1 joule per second", "1 coulomb per joule"]
        answer: "1 joule per coulomb"
        difficulty: 2
        hints: ["V = W ÷ Q.", "Which unit is work and which is charge?"]
        solution: "Step 1: Potential difference = work ÷ charge. Step 2: So 1 V = 1 J ÷ 1 C. (1 C/s is an ampere; 1 J/s is a watt.)"
        mistakes: {"1 coulomb per second": volt_meaning, "1 joule per second": volt_meaning, "1 coulomb per joule": volt_meaning}
      - prompt: "A phone charges at a steady 2 A for 1.5 hours. How much charge flows into it, in C?"
        answer: "10800"
        check: "2*1.5*3600"
        difficulty: 3
        hints: ["Q = I × t, with t in seconds.", "1.5 hours = 5400 s."]
        solution: "Step 1: t = 1.5 × 3600 = 5400 s. Step 2: Q = 2 × 5400 = 10,800 C."
        mistakes: {"3": seconds_needed, "180": seconds_needed, "1.33": charge_time}
      - prompt: "A bulb has 6 V across it, and 3 C of charge flows through it in 1.5 s. How much energy does the bulb take from the charge in that time, in J?"
        answer: "18"
        check: "6*3"
        difficulty: 3
        hints: ["V = W ÷ Q.", "W = 6 × 3."]
        solution: "Step 1: Each coulomb gives up 6 J. Step 2: 3 C give up 6 × 3 = 18 J."
        mistakes: {"2": work_vq, "27": work_vq, "12": work_vq}
      - prompt: A current of 3 A flows for 20 s. How much charge passes, in C?
        answer: '60'
        check: 3*20
        difficulty: 1
        hints:
        - Current is charge per second.
        - Charge = current × time.
        solution: 'Step 1: Q = I × t. Step 2: Q = 3 × 20. Step 3: Q = 60 C.'
        mistakes:
          '23': charge_time
      - prompt: Which instrument measures electric current?
        options:
        - Ammeter
        - Voltmeter
        - Ohmmeter
        - Barometer
        answer: Ammeter
        difficulty: 1
        hints:
        - Current is measured in amperes.
        - The meter's name comes from the unit.
        solution: 'Step 1: Current is in amperes. Step 2: The ampere-meter is the ammeter. Step 3: It is connected in series.'
        mistakes:
          Voltmeter: volt_meaning
      - prompt: 120 C of charge flows through a wire in 1 minute. What is the current, in A?
        answer: '2'
        check: 120/60
        difficulty: 2
        hints:
        - Change the time to seconds.
        - I = Q ÷ t.
        solution: 'Step 1: 1 minute = 60 s. Step 2: I = 120 ÷ 60. Step 3: I = 2 A.'
        mistakes:
          '120': seconds_needed
      - prompt: A 1.5 V cell moves 10 C of charge through a torch bulb. How much energy does it give the charge, in J?
        answer: '15'
        check: 1.5*10
        difficulty: 2
        hints:
        - Potential difference is energy per coulomb.
        - W = V × Q.
        solution: 'Step 1: Each coulomb gets 1.5 J. Step 2: W = 1.5 × 10. Step 3: W = 15 J.'
        mistakes:
          '0.15': work_vq
      - prompt: A battery does 48 J of work moving charge through a 12 V lamp. How much charge flowed, in C?
        answer: '4'
        check: 48/12
        difficulty: 2
        hints:
        - V = W ÷ Q.
        - Rearrange to find Q.
        solution: 'Step 1: Q = W ÷ V. Step 2: Q = 48 ÷ 12. Step 3: Q = 4 C.'
        mistakes:
          '576': work_vq
      - prompt: A current of 0.2 A flows through a radio for 10 minutes. How much charge flows, in C?
        answer: '120'
        check: 0.2*10*60
        difficulty: 3
        hints:
        - Change minutes to seconds first.
        - Q = I × t.
        solution: 'Step 1: 10 minutes = 600 s. Step 2: Q = 0.2 × 600. Step 3: Q = 120 C.'
        mistakes:
          '2': seconds_needed

  - code: phy9.current.ohm
    title: Ohm's law and resistance
    after: [phy9.current.charge]
    notes: |
      Ohm's law: at constant temperature the current through a conductor is proportional to the
      potential difference across it: V = IR, where R is the resistance in ohms (Ω). Resistance
      increases with length, decreases with area of cross-section, and depends on the material
      (resistivity) and temperature. Nichrome has high resistivity (heating elements); copper low
      (connecting wires).
    explanations:
      text: "Resistance is how hard it is for current to flow. With 12 V across a 4 Ω resistor, the current is 12 ÷ 4 = 3 A. A longer wire is harder to get through; a thicker wire is easier, like a wide road compared with a narrow lane."
      visual: "Draw the V–I graph for a resistor: a straight line through the origin. Its slope (V ÷ I) is the resistance."
      step_by_step: "Resistance of a bulb that takes 0.5 A at 230 V: Step 1: R = V ÷ I. Step 2: R = 230 ÷ 0.5. Step 3: R = 460 Ω."
      real_world: "Electric irons and heaters use nichrome coils because its high resistance turns current into heat; house wiring uses copper so little energy is wasted."
    activity:
      type: formula
      prompt: 'Ohm''s law: I = V ÷ R.'
      inputs:
      - name: v
        label: Voltage
        min: 0
        max: 24
        step: 1
        start: 0
        unit: V
      - name: r
        label: Resistance
        min: 1
        max: 24
        step: 1
        start: 1
        unit: Ω
      outputs:
      - name: i
        label: Current
        expr: v/r
        unit: A
        places: 2
      goals:
      - prompt: Get 0.5 A through a 12 Ω resistor.
        want:
          i: 0.5
          r: 12
        mistakes:
        - when:
            v: 24
          say: 24 V across 12 Ω drives 2 A. Did you multiply 12 by 2? I = V ÷ R, so V = I × R.
      - prompt: Get 2 A from a 6 V cell.
        want:
          i: 2
          v: 6
        mistakes:
        - when:
            r: 12
          say: 12 Ω lets only 0.5 A through. A smaller resistance lets more current flow.
        - when:
            r: 2
          say: '2 Ω lets 3 A through: too much. A bigger resistance lets less current flow.'
    lesson:
      - teach: 'Connect a wire to 1, 2, then 3 cells. The current goes up in step with the voltage: twice the voltage, twice the current. Ohm found this: at a steady temperature, V ∝ I, or V = IR. R, the resistance, is how strongly the wire opposes the current. Its unit is the ohm (Ω).'
        picture:
          kind: bars
          bars:
          - label: 2 V
            value: 0.5
          - label: 4 V
            value: 1
          - label: 6 V
            value: 1.5
          unit: A
          alt: 'Through a 4 Ω wire: 0.5 A at 2 V, 1 A at 4 V, 1.5 A at 6 V. The current grows in step with the voltage.'
        check:
          prompt: A resistor has 1 A through it at 5 V. At 10 V, what current flows?
          options:
          - 2 A
          - 1 A
          - 0.5 A
          answer: 2 A
          why: 'Double the voltage, double the current: 2 A.'
      - teach: Use V = IR three ways. To find V, multiply I × R. To find I, divide V ÷ R. To find R, divide V ÷ I. A 10 Ω lamp on 5 V takes I = 5 ÷ 10 = 0.5 A.
        check:
          prompt: A 20 Ω resistor has 0.5 A flowing through it. What is the voltage across it?
          options:
          - 10 V
          - 40 V
          - 20.5 V
          answer: 10 V
          why: V = IR = 0.5 × 20 = 10 V.
      - teach: 'What decides resistance? A longer wire has more resistance (double the length, double R). A thicker wire has less (double the area, half R). The material matters too: copper has low resistivity, nichrome high. Heat usually raises it.'
        check:
          prompt: 'A wire is replaced with one of the same material and length but twice the thickness (area). Its resistance:'
          options:
          - Halves
          - Doubles
          - Stays the same
          answer: Halves
          why: 'Resistance falls as the cross-section area grows: twice the area, half the resistance.'
      - teach: That is why house wiring is thick copper, which wastes little energy, while the coil in an iron or heater is nichrome, which resists strongly and gets hot. The bulb filament is tungsten, which glows white-hot without melting.
        check:
          prompt: Why are connecting wires made of copper?
          options:
          - Copper has low resistivity
          - Copper has high resistivity
          - Copper melts easily
          answer: Copper has low resistivity
          why: Low resistance means little energy is wasted as heat in the wires.
    items:
      - prompt: "A 4 Ω resistor has 12 V across it. What current flows, in A?"
        answer: "3"
        check: "12/4"
        difficulty: 1
        hints: ["I = V ÷ R."]
        solution: "12 ÷ 4 = 3 A"
        mistakes: {"48": ohm_rearrange, "1/3": ohm_rearrange}
      - prompt: "A current of 2 A flows through a 6 Ω resistor. What is the potential difference across it, in V?"
        answer: "12"
        check: "2*6"
        difficulty: 1
        hints: ["V = IR."]
        solution: "2 × 6 = 12 V"
        mistakes: {"3": ohm_rearrange}
      - prompt: "A bulb takes 0.5 A from a 230 V supply. What is its resistance, in Ω?"
        answer: "460"
        check: "230/Rational(1, 2)"
        difficulty: 2
        hints: ["R = V ÷ I."]
        solution: "230 ÷ 0.5 = 460 Ω"
        mistakes: {"115": ohm_rearrange}
      - prompt: "A wire is replaced by one of the same material and thickness but twice as long. Its resistance:"
        options: ["Doubles", "Halves", "Stays the same", "Becomes four times"]
        answer: "Doubles"
        difficulty: 2
        hints: ["Resistance is proportional to length."]
        solution: "R ∝ length, so twice the length gives twice the resistance."
        mistakes: {"Halves": "resistance_length", "Becomes four times": "resistance_length"}
      - prompt: "Why is nichrome used for the heating coil of an electric iron?"
        options: ["It has high resistivity", "It has very low resistivity", "It is magnetic", "It is a good insulator"]
        answer: "It has high resistivity"
        difficulty: 2
        hints: ["The coil must get hot."]
        solution: "High resistivity means a lot of heat for the current passing (and nichrome doesn't oxidise easily)."
        mistakes: {"It has very low resistivity": "nichrome_high", "It is a good insulator": "nichrome_high"}
      - prompt: "When the voltage across a resistor is raised from 6 V to 9 V, the current rises from 2 A to what value, in A?"
        answer: "3"
        check: "9/(6/2)"
        difficulty: 3
        hints: ["R = 6 ÷ 2 = 3 Ω stays the same."]
        solution: "Step 1: R = 3 Ω. Step 2: I = 9 ÷ 3 = 3 A."
        mistakes: {"5": ohm_rearrange}
      - prompt: "A wire has a resistance of 10 Ω. It is stretched to twice its length, so its cross-section becomes half as big. What is its new resistance, in Ω?"
        answer: "40"
        check: "10*2*2"
        difficulty: 3
        hints: ["Twice as long: resistance × 2.", "Half the cross-section: resistance × 2 again."]
        solution: "Step 1: Double length doubles R: 20 Ω. Step 2: Half the area doubles R again: 40 Ω."
        mistakes: {"20": stretched_wire, "10": stretched_wire, "5": stretched_wire}
      - prompt: "On a graph of potential difference V against current I, a resistor's line is straight and passes through (2 A, 10 V). What is its resistance, in Ω?"
        answer: "5"
        check: "10/2"
        difficulty: 2
        hints: ["R = V ÷ I.", "Read V and I from the point."]
        solution: "Step 1: R = 10 ÷ 2 = 5 Ω. Step 2: Because the line is straight, R is the same at every point."
        mistakes: {"0.2": ohm_rearrange, "20": ohm_rearrange}
      - prompt: "A heater takes 3 A from a 12 V supply. What voltage is needed to make 5 A flow through the same heater, in V?"
        answer: "20"
        check: "12/3*5"
        difficulty: 2
        hints: ["Find the heater's resistance first.", "R = 12 ÷ 3 = 4 Ω."]
        solution: "Step 1: R = 4 Ω. Step 2: V = 5 × 4 = 20 V."
        mistakes: {"14": ohm_rearrange, "7.2": ohm_rearrange}
      - prompt: A 10 Ω resistor is connected to a 5 V supply. What current flows, in A?
        answer: '0.5'
        check: 5/10
        difficulty: 1
        hints:
        - 'Ohm''s law: V = IR.'
        - For current, divide V by R.
        solution: 'Step 1: I = V ÷ R. Step 2: I = 5 ÷ 10. Step 3: I = 0.5 A.'
        mistakes:
          '50': ohm_rearrange
          '2': ohm_rearrange
      - prompt: What is the SI unit of resistance?
        options:
        - Ohm
        - Volt
        - Ampere
        - Watt
        answer: Ohm
        difficulty: 1
        hints:
        - It is named after the scientist who found V = IR.
        - Its symbol is the Greek letter Ω.
        solution: 'Step 1: Volt is for potential difference, ampere for current, watt for power. Step 2: Resistance R = V ÷ I. Step 3: Its unit is the ohm, Ω.'
        mistakes:
          Volt: volt_meaning
      - prompt: A current of 0.25 A flows through a resistor with 5 V across it. What is the resistance, in Ω?
        answer: '20'
        check: 5/0.25
        difficulty: 2
        hints:
        - R = V ÷ I.
        - Dividing by 0.25 is the same as multiplying by 4.
        solution: 'Step 1: R = V ÷ I. Step 2: R = 5 ÷ 0.25. Step 3: R = 20 Ω.'
        mistakes:
          '1.25': ohm_rearrange
      - prompt: A wire of resistance 6 Ω is cut into two equal halves. What is the resistance of one half, in Ω?
        answer: '3'
        check: 6/2
        difficulty: 2
        hints:
        - Resistance depends on length.
        - Half the length means half the resistance.
        solution: 'Step 1: Same material and thickness. Step 2: Length is halved. Step 3: R = 6 ÷ 2 = 3 Ω.'
        mistakes:
          '12': resistance_length
      - prompt: Which material is best for the element of an electric heater?
        options:
        - Nichrome
        - Copper
        - Silver
        - Aluminium
        answer: Nichrome
        difficulty: 2
        hints:
        - A heater must turn electrical energy into heat.
        - Which material resists the current strongly?
        solution: 'Step 1: Copper, silver and aluminium have low resistivity. Step 2: They would barely heat. Step 3: Nichrome has high resistivity, so it gets hot and does not oxidise easily.'
        mistakes:
          Copper: nichrome_high
      - prompt: A resistor takes 0.4 A when 8 V is applied. What current will flow when the voltage is raised to 20 V, in A?
        answer: '1'
        check: 20/(8/0.4)
        difficulty: 3
        hints:
        - First find the resistance.
        - Then use I = V ÷ R with the new voltage.
        solution: 'Step 1: R = 8 ÷ 0.4 = 20 Ω. Step 2: I = 20 ÷ 20. Step 3: I = 1 A.'
        mistakes:
          '0.4': ohm_rearrange

  - code: phy9.current.circuits
    title: Series and parallel circuits
    after: [phy9.current.ohm]
    notes: |
      Series: the same current flows through every resistor; total R = R₁ + R₂ + …; the voltages add up
      to the supply voltage. Parallel: each resistor has the full supply voltage; 1/R = 1/R₁ + 1/R₂ + …
      (total smaller than the smallest); the currents add up. Household appliances are connected in
      parallel so each gets 230 V and can be switched independently.
    explanations:
      text: "In series, current has one path through every resistor, so resistances add: 3 Ω + 6 Ω = 9 Ω. In parallel, current has several paths, so it flows more easily: 3 Ω and 6 Ω in parallel give just 2 Ω. Homes use parallel wiring, so switching off the fan doesn't turn off the light."
      visual: "Draw series as beads on one string. Draw parallel as a ladder: each rung is a separate path between the same two rails."
      step_by_step: "3 Ω and 6 Ω in parallel: Step 1: 1/R = 1/3 + 1/6. Step 2: = 2/6 + 1/6 = 3/6 = 1/2. Step 3: R = 2 Ω."
      real_world: "Old-style serial lamp sets for festivals all go dark when one bulb fails: they are in series. Home lights stay on independently: they are in parallel."
    activity:
      type: formula
      prompt: Two resistors R₁ and R₂ joined in series and in parallel.
      inputs:
      - name: a
        label: R₁
        min: 1
        max: 12
        step: 1
        start: 1
        unit: Ω
      - name: b
        label: R₂
        min: 1
        max: 12
        step: 1
        start: 1
        unit: Ω
      outputs:
      - name: s
        label: In series
        expr: a+b
        unit: Ω
        places: 2
      - name: p
        label: In parallel
        expr: a*b/(a+b)
        unit: Ω
        places: 2
      goals:
      - prompt: Find R₁ and R₂ that give 9 Ω in series and 2 Ω in parallel.
        want:
          s: 9
          p: 2
        mistakes:
        - when:
            s: 9
          say: In series they add to 9 Ω, but the parallel value isn't 2 Ω yet. In parallel the total is always less than the smaller resistor.
        - when:
            p: 2
          say: In parallel it's 2 Ω, but in series they don't add up to 9 Ω.
    lesson:
      - teach: 'In a series circuit, parts are joined one after another, in a single loop. The same current flows through each. The resistances add: R = R₁ + R₂. If one bulb breaks, the loop is broken and everything goes off.'
        picture:
          kind: flow
          steps:
          - Cell
          - Bulb 1
          - Bulb 2
          - Back to cell
          alt: 'A series circuit: one path from the cell through bulb 1, then bulb 2, and back.'
        check:
          prompt: A 2 Ω and a 5 Ω resistor are joined in series. What is the total resistance?
          options:
          - 7 Ω
          - 10 Ω
          - 3 Ω
          answer: 7 Ω
          why: 'In series, resistances add: 2 + 5 = 7 Ω.'
      - teach: In a parallel circuit, each part has its own path between the same two points. Each gets the full supply voltage, and the currents add up. The total resistance is found from 1/R = 1/R₁ + 1/R₂. It is always smaller than the smallest resistor, because the current has more ways to go.
        check:
          prompt: Two 10 Ω resistors are in parallel. What is the total resistance?
          options:
          - 5 Ω
          - 20 Ω
          - 10 Ω
          answer: 5 Ω
          why: 1/R = 1/10 + 1/10 = 2/10, so R = 5 Ω.
      - teach: Homes are wired in parallel. Every appliance gets the full 230 V, and each has its own switch, so turning off the fan doesn't turn off the light.
        check:
          prompt: In a house, one bulb burns out. What happens to the others?
          options:
          - They stay on
          - They all go off
          - They get dimmer
          answer: They stay on
          why: In parallel, each appliance has its own path, so the others still work.
      - teach: 'Electric power is how fast electrical energy is used: P = VI, in watts. A 230 V iron taking 4 A uses 920 W. Energy = power × time: in kWh, multiply kW by hours.'
        check:
          prompt: A lamp on 230 V takes 0.5 A. What is its power?
          options:
          - 115 W
          - 460 W
          - 230.5 W
          answer: 115 W
          why: P = VI = 230 × 0.5 = 115 W.
