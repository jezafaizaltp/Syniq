# Class 9 Physics, chapter 4. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_half, forgot_square.
subject: phy
chapter: 4
title: Gravitation

tips:
  tiny_force: "Every two masses attract. Look at how small G is, and how small a person's mass is compared with the Earth's."
  g_mass_radius: "g = GM ÷ R². Change one thing at a time: mass on top, radius squared underneath."
  up_down_time: "The time going up equals the time coming down. The ball stops for an instant at the top."
  fall_in_one_second: "Find how far it has fallen after 4 s and after 3 s. The 4th second is the gap between them."
  inverse_not_square: "Gravitational force goes as 1 ÷ distance². If the distance becomes k times larger, divide the force by k × k. Masses multiply the force directly."
  mass_changes_on_moon: "Mass is the amount of matter and is the same everywhere. Only weight changes from place to place."
  weight_in_kg: "Mass, in kg, is how much matter something has. The pull of gravity on that mass is a force, in newtons: force = mass × g. To go back from the force to the mass, or to find g, divide."
  heavier_falls_faster: "Without air resistance all bodies fall with the same acceleration g, whatever their mass."
  moon_sixth: "On the Moon, g is about one sixth of the Earth's, so weight is divided by 6."
  g_sign: "Going up, a thrown body slows down by g every second until its velocity is zero."
  big_g_small_g: "Big G is a tiny universal constant with units N m²/kg², the same everywhere. Small g is the acceleration of a falling body on a planet, in m/s²."
  force_mass_direct: "Force is proportional to each mass: double one mass, double the force."
  free_fall_speed: "v = g × t from rest: 10 × 3."
  g_poles: "The Earth bulges at the equator. Where you are closest to the Earth's centre, gravity pulls slightly harder."
  gravity_holds_moon: "Earth's gravity pulls the Moon into its curved orbit."
  speed_not_distance: "That is how far it falls (½gt²). The question asks for its speed: v = gt."

concepts:
  - code: phy9.gravity.universal_law
    title: The universal law of gravitation
    notes: |
      Every two bodies in the universe attract each other with a force F = G m₁m₂ ÷ r², where r is
      the distance between their centres and G = 6.67 × 10⁻¹¹ N m²/kg² is the universal
      gravitational constant. The force is proportional to each mass and inversely proportional to
      the square of the distance. The Earth's pull keeps the Moon in orbit and causes tides with the
      Moon's pull.
    explanations:
      text: "Newton realised that the force pulling an apple down is the same force holding the Moon in orbit. Any two masses attract. Double one mass and the pull doubles. Double the distance and the pull drops to a quarter, because distance is squared."
      visual: "Picture a torch shining on a wall. Move it twice as far and the same light spreads over 4 times the area, so each patch is 4 times dimmer. Gravity weakens with distance the same way."
      step_by_step: "Two masses attract with 36 N. The distance is tripled. Step 1: Force ∝ 1/r². Step 2: r × 3 means r² × 9. Step 3: New force = 36 ÷ 9 = 4 N."
      real_world: "The Moon's pull on the oceans raises the water on the side nearest it, giving the tides that fishermen on the Kerala coast plan around."
    activity:
      type: formula
      prompt: Gravitational force F ∝ (m₁ × m₂) ÷ d². Change the masses and the distance.
      inputs:
      - name: m
        label: Masses multiplied by
        min: 1
        max: 4
        step: 1
        start: 1
      - name: d
        label: Distance multiplied by
        min: 1
        max: 4
        step: 1
        start: 1
      outputs:
      - name: f
        label: Force multiplied by
        expr: m/d^2
        places: 4
      goals:
      - prompt: Keep the masses and make the force a quarter.
        want:
          f: 0.25
          m: 1
        mistakes:
        - when:
            d: 4
          say: 'Distance × 4 makes the force 1/16, not 1/4: the force falls with the square of the distance.'
        - when:
            m:
            - 2
            - 4
            d: 1
          say: Changing the masses makes the force bigger, but the goal is to make it smaller while keeping the masses.
      - prompt: Keep the distance and make the force 4 times as big.
        want:
          f: 4
          d: 1
        mistakes:
        - when:
            m: 2
            d: 1
          say: Doubling the masses only doubles the force.
        - when:
            d:
            - 2
            - 4
          say: The distance must stay as it was.
      - prompt: Double the distance, then make the force what it was at the start.
        want:
          d: 2
          f: 1
        mistakes:
        - when:
            m: 2
            d: 2
          say: 'Doubling the mass doubles the force, but doubling the distance makes it a quarter: 2 × 1/4 = 1/2.'
    lesson:
      - teach: An apple falls because the Earth pulls it. Newton realised that the same pull keeps the Moon going round the Earth. In fact every two bodies in the universe attract each other. This pull is gravitation.
        check:
          prompt: Which force keeps the Earth going round the Sun?
          options:
          - The Sun's gravitational pull
          - Friction
          - Magnetism
          answer: The Sun's gravitational pull
          why: Gravitation acts between all bodies; the Sun's pull bends the Earth's path into an orbit.
      - teach: 'The force grows with each mass: double one mass, double the force. It falls with the square of the distance between their centres: double the distance and the force becomes 1/4; triple it and it becomes 1/9. Together: F = G m₁m₂ ÷ r².'
        picture:
          kind: compare
          columns:
          - title: Change
            points:
            - one mass × 2
            - distance × 2
            - distance × 3
          - title: Force becomes
            points:
            - F × 2
            - F ÷ 4
            - F ÷ 9
          alt: Doubling a mass doubles the force; doubling the distance makes it a quarter; tripling the distance makes it a ninth.
        check:
          prompt: Two masses attract with 20 N. The distance is doubled. What is the new force?
          options:
          - 5 N
          - 10 N
          - 40 N
          answer: 5 N
          why: 'Doubling the distance divides the force by 2² = 4: 20 ÷ 4 = 5 N.'
      - teach: G = 6.67 × 10⁻¹¹ N m²/kg² is the same everywhere in the universe. It is tiny, so the pull between everyday objects, like two people, is far too small to notice. Only huge masses like the Earth give a strong pull. And by the third law, the Earth pulls the Moon exactly as hard as the Moon pulls the Earth.
        check:
          prompt: Why don't two books on a table move towards each other?
          options:
          - The pull between them is tiny because G is so small
          - Books don't have gravity
          - The table blocks gravity
          answer: The pull between them is tiny because G is so small
          why: They do attract, but the force is far smaller than the friction holding them in place.
    items:
      - prompt: "Two masses attract each other with a force F. If the distance between them is doubled, what is the new force?"
        options: ["F/4", "F/2", "2F", "4F"]
        answer: "F/4"
        difficulty: 1
        hints: ["F ∝ 1/r²."]
        solution: "r² becomes 4r², so the force becomes F/4."
        mistakes: {"F/2": inverse_not_square}
      - prompt: "Two masses attract with 10 N. One of the masses is doubled and the distance stays the same. What is the new force, in N?"
        answer: "20"
        check: "10*2"
        difficulty: 1
        hints: ["Force is proportional to each mass."]
        solution: "Doubling one mass doubles the force: 20 N."
        mistakes: {"40": "force_mass_direct", "5": "force_mass_direct"}
      - prompt: "Which force keeps the Moon moving in its orbit around the Earth?"
        options: ["The Earth's gravitational pull", "Magnetism", "Friction", "The Sun's light"]
        answer: "The Earth's gravitational pull"
        difficulty: 1
        hints: ["The same force that makes an apple fall."]
        solution: "The Earth's gravity pulls the Moon towards it, bending its path into an orbit."
        mistakes: {"Magnetism": "gravity_holds_moon", "The Sun's light": "gravity_holds_moon"}
      - prompt: "Two masses attract with 36 N. The distance between them is made 3 times larger. What is the new force, in N?"
        answer: "4"
        check: "36/3**2"
        difficulty: 2
        hints: ["3 times the distance: 9 times smaller."]
        solution: "36 ÷ 3² = 36 ÷ 9 = 4 N"
        mistakes: {"12": inverse_not_square}
      - prompt: "What is the value of the universal gravitational constant G?"
        options: ["6.67 × 10⁻¹¹ N m²/kg²", "9.8 m/s²", "3 × 10⁸ m/s", "1.6 m/s²"]
        answer: "6.67 × 10⁻¹¹ N m²/kg²"
        difficulty: 2
        hints: ["G is very small, and it is not the acceleration due to gravity."]
        solution: "G = 6.67 × 10⁻¹¹ N m²/kg². 9.8 m/s² is g, the acceleration due to gravity on Earth."
        mistakes: {"9.8 m/s²": big_g_small_g}
      - prompt: "Both masses are doubled and the distance between them is also doubled. By what factor does the force change?"
        answer: "1"
        check: "2*2/2**2"
        difficulty: 3
        hints: ["Masses: × 2 × 2 = × 4.", "Distance squared: × 4."]
        solution: "Step 1: Masses multiply the force by 4. Step 2: The distance divides it by 2² = 4. Step 3: Overall × 1, no change."
        mistakes: {"2": inverse_not_square}
      - prompt: "Two masses attract each other with 100 N. One mass is tripled and the distance between them is halved. What is the new force, in N?"
        answer: "1200"
        check: "100*3*2**2"
        difficulty: 3
        hints: ["Tripling a mass triples the force.", "Halving the distance multiplies the force by 2²."]
        solution: "Step 1: Mass ×3 → force ×3. Step 2: Distance ÷2 → force ×4. Step 3: 100 × 3 × 4 = 1200 N."
        mistakes: {"600": inverse_not_square, "150": inverse_not_square, "75": inverse_not_square}
      - prompt: "How does the Moon's pull on the Earth compare with the Earth's pull on the Moon?"
        options: ["Equal in size", "Much smaller", "Much bigger", "There is no pull on the Earth"]
        answer: "Equal in size"
        difficulty: 2
        hints: ["F = G m₁m₂ ÷ r²: does it matter which mass is m₁?", "These two pulls are an action–reaction pair."]
        solution: "Step 1: The same formula gives the force on each body. Step 2: The pulls are equal and opposite; the Earth just moves far less because its mass is much bigger."
        mistakes: {"Much smaller": reaction_smaller, "Much bigger": reaction_smaller, "There is no pull on the Earth": reaction_smaller}
      - prompt: "Why don't two people sitting next to each other feel pulled together by gravity?"
        options: ["The force between such small masses is tiny because G is very small", "Only the Earth has gravity", "Gravity acts only between planets", "The air between them blocks gravity"]
        answer: "The force between such small masses is tiny because G is very small"
        difficulty: 2
        hints: ["The law of gravitation applies to every two bodies.", "G = 6.67 × 10⁻¹¹. Try 60 kg and 60 kg, 1 m apart."]
        solution: "Step 1: They do attract. Step 2: F = 6.67 × 10⁻¹¹ × 60 × 60 ÷ 1² ≈ 2.4 × 10⁻⁷ N, far too small to feel."
        mistakes: {"Only the Earth has gravity": tiny_force, "Gravity acts only between planets": tiny_force, "The air between them blocks gravity": tiny_force}
      - prompt: Two masses attract with a force F. The distance between them is halved. What is the new force?
        options:
        - 4F
        - 2F
        - F/2
        - F/4
        answer: 4F
        difficulty: 1
        hints:
        - Force depends on 1 ÷ distance².
        - Halving r makes r² a quarter.
        solution: 'Step 1: F ∝ 1/r². Step 2: r becomes r/2, so r² becomes r²/4. Step 3: The force becomes 4F.'
        mistakes:
          2F: inverse_not_square
          F/4: inverse_not_square
      - prompt: Two masses attract with 12 N. Both masses are doubled; the distance stays the same. What is the new force, in N?
        answer: '48'
        check: 12*2*2
        difficulty: 1
        hints:
        - Each doubled mass doubles the force.
        - 12 × 2 × 2.
        solution: 'Step 1: Doubling one mass gives 24 N. Step 2: Doubling the other gives 48 N. Step 3: So the force is 48 N.'
        mistakes:
          '24': force_mass_direct
      - prompt: Which pair attracts each other with the strongest gravitational force?
        options:
        - The Earth and the Moon
        - Two cars parked side by side
        - Two people shaking hands
        - Two apples on a plate
        answer: The Earth and the Moon
        difficulty: 2
        hints:
        - The force grows with the masses.
        - Which pair has enormous masses?
        solution: 'Step 1: F = G m₁m₂ ÷ r². Step 2: G is tiny, so only huge masses give large forces. Step 3: The Earth and Moon win easily, despite the big distance.'
        mistakes:
          Two people shaking hands: tiny_force
      - prompt: Two masses attract with 90 N. The distance between them is tripled. What is the new force, in N?
        answer: '10'
        check: 90/3**2
        difficulty: 2
        hints:
        - Tripling the distance divides the force by 3².
        - 90 ÷ 9.
        solution: 'Step 1: F ∝ 1/r². Step 2: 3² = 9. Step 3: 90 ÷ 9 = 10 N.'
        mistakes:
          '30': inverse_not_square
      - prompt: One mass is halved and the distance is also halved. What happens to the force?
        options:
        - It doubles
        - It halves
        - It stays the same
        - It becomes 4 times
        answer: It doubles
        difficulty: 3
        hints:
        - Halving the mass halves the force.
        - Halving the distance makes it 4 times.
        solution: 'Step 1: Mass halved: × 1/2. Step 2: Distance halved: × 4. Step 3: 1/2 × 4 = 2, so the force doubles.'
        mistakes:
          It stays the same: inverse_not_square
      - prompt: The Earth pulls a 1 kg book with about 10 N. With what force does the book pull the Earth, in N?
        answer: '10'
        check: '10'
        difficulty: 3
        hints:
        - Gravitation is a pair of forces.
        - Newton's third law.
        solution: 'Step 1: The forces form an action–reaction pair. Step 2: They are equal in size. Step 3: The book pulls the Earth with 10 N; the Earth barely moves because its mass is huge.'
        mistakes:
          '0': gravity_holds_moon

  - code: phy9.gravity.weight
    title: Mass, weight and g
    after: [phy9.gravity.universal_law]
    notes: |
      The acceleration due to gravity near the Earth's surface is g ≈ 9.8 m/s² (often taken as
      10 m/s²), g = GM/R². Weight is the force of gravity on a body: W = mg, in newtons. Mass (kg) is
      the same everywhere; weight changes with g. On the Moon g is about 1/6 of the Earth's, so
      weight is about 1/6. g is slightly larger at the poles than at the equator.
    explanations:
      text: "Your mass is how much matter you are made of: 60 kg on Earth, 60 kg on the Moon. Your weight is how hard gravity pulls you: on Earth 60 × 9.8 = 588 N, on the Moon about one sixth of that, 98 N. Scales marked in kg really measure weight and divide by g."
      visual: "Hang the same bag on a spring balance on Earth and then on the Moon. The bag (the mass) is the same; the spring stretches only a sixth as much on the Moon (the weight)."
      step_by_step: "Weight of a 50 kg girl, g = 10 m/s²: Step 1: W = mg. Step 2: W = 50 × 10 = 500 N. Step 3: On the Moon: 500 ÷ 6 ≈ 83 N, mass still 50 kg."
      real_world: "Astronauts on the Moon could leap high with heavy space suits because their weight there was only a sixth of their weight on Earth."
    activity:
      type: formula
      prompt: Weight = mass × g. On Earth g = 9.8 m/s²; on the Moon it is about 1.6 m/s².
      inputs:
      - name: m
        label: Mass
        min: 1
        max: 100
        step: 1
        start: 1
        unit: kg
      outputs:
      - name: we
        label: Weight on Earth
        expr: 9.8*m
        unit: N
        places: 1
      - name: wm
        label: Weight on the Moon
        expr: 1.6*m
        unit: N
        places: 1
      goals:
      - prompt: Make the weight on Earth 490 N. Does the mass change on the Moon?
        want:
          we: 490
        mistakes:
        - when:
            m:
            - 1
            - 49
          say: That mass weighs less than 490 N on Earth. Each kilogram weighs 9.8 N.
      - prompt: Someone weighs 160 N on the Moon. Find their mass and their weight on Earth.
        want:
          wm: 160
        mistakes:
        - when:
            m:
            - 16
            - 17
          say: About 16 kg is what weighs 160 N on Earth. On the Moon each kilogram weighs only 1.6 N, so 160 N there needs much more mass.
    lesson:
      - teach: Near the Earth's surface, gravity makes every falling body speed up by about 9.8 m/s every second. This is the acceleration due to gravity, g ≈ 9.8 m/s² (we often round it to 10 m/s²).
        check:
          prompt: Dropped from rest, about how fast is a stone falling after 1 s?
          options:
          - About 10 m/s
          - About 1 m/s
          - About 100 m/s
          answer: About 10 m/s
          why: It gains about 9.8 m/s each second.
      - teach: 'Mass is how much matter a body has, in kg; it is the same everywhere. Weight is the force of gravity on it: W = m × g, in newtons. A 50 kg girl weighs 50 × 10 = 500 N on Earth. Saying ''I weigh 50 kg'' really gives your mass.'
        check:
          prompt: What is the weight of a 3 kg bag on Earth? (g = 10 m/s²)
          options:
          - 30 N
          - 3 kg
          - 0.3 N
          answer: 30 N
          why: W = mg = 3 × 10 = 30 N. Weight is a force, in newtons.
      - teach: 'On the Moon, g is about 1/6 of the Earth''s, so you weigh 1/6 as much, but your mass doesn''t change. g also varies a little on Earth: it is slightly larger at the poles than at the equator, because the Earth is a bit flattened.'
        check:
          prompt: An astronaut's mass is 72 kg on Earth. What is it on the Moon?
          options:
          - 72 kg
          - 12 kg
          - 720 kg
          answer: 72 kg
          why: Mass doesn't change from place to place. Only weight changes.
    items:
      - prompt: "What is the weight of a 50 kg girl on Earth, in N? (Take g = 10 m/s².)"
        answer: "500"
        check: "50*10"
        difficulty: 1
        hints: ["W = mg."]
        solution: "W = 50 × 10 = 500 N"
        mistakes: {"50": weight_in_kg, "5": weight_in_kg}
      - prompt: "An astronaut has a mass of 60 kg on Earth. What is the astronaut's mass on the Moon, in kg?"
        answer: "60"
        check: "60"
        difficulty: 1
        hints: ["Does the amount of matter change?"]
        solution: "Mass does not change: 60 kg."
        mistakes: {"10": mass_changes_on_moon}
      - prompt: "Which of these is measured in newtons?"
        options: ["Weight", "Mass", "Acceleration", "Distance"]
        answer: "Weight"
        difficulty: 1
        hints: ["The newton is a unit of force."]
        solution: "Weight is a force, so it is measured in newtons. Mass is in kg."
        mistakes: {"Mass": weight_in_kg}
      - prompt: "A box weighs 600 N on Earth. What does it weigh on the Moon, in N? (Moon's g is 1/6 of Earth's.)"
        answer: "100"
        check: "600*Rational(1, 6)"
        difficulty: 2
        hints: ["Divide by 6."]
        solution: "600 ÷ 6 = 100 N"
        mistakes: {"3600": moon_sixth, "600": mass_changes_on_moon}
      - prompt: "A bag weighs 98 N on Earth (g = 9.8 m/s²). What is its mass, in kg?"
        answer: "10"
        check: "98/Rational(98, 10)"
        difficulty: 2
        hints: ["m = W ÷ g."]
        solution: "m = 98 ÷ 9.8 = 10 kg"
        mistakes: {"98": weight_in_kg}
      - prompt: "Where on the Earth is the value of g the greatest?"
        options: ["At the poles", "At the equator", "On a mountain top", "It is the same everywhere"]
        answer: "At the poles"
        difficulty: 3
        hints: ["g = GM/R². Where is the Earth's radius smallest?"]
        solution: "The Earth is slightly flattened at the poles, so R is smaller there and g is larger."
        mistakes: {"At the equator": "g_poles", "It is the same everywhere": "g_poles"}
      - prompt: "A 30 kg child weighs 48 N on the Moon. What is g on the Moon, in m/s²?"
        answer: "1.6"
        check: "Rational(48, 30)"
        difficulty: 3
        hints: ["g = W ÷ m."]
        solution: "g = 48 ÷ 30 = 1.6 m/s²"
        mistakes: {"5/8": weight_in_kg}
      - prompt: "A person weighs 588 N on Earth (g = 9.8 m/s²). What do they weigh on the Moon, where g = 1.63 m/s², in N?"
        answer: "97.8"
        check: "588/9.8*1.63"
        difficulty: 3
        hints: ["Find the mass first: 588 ÷ 9.8.", "Weight on the Moon = mass × 1.63."]
        solution: "Step 1: Mass = 588 ÷ 9.8 = 60 kg. Step 2: Moon weight = 60 × 1.63 = 97.8 N."
        mistakes: {"588": mass_changes_on_moon, "60": weight_in_kg, "3528": moon_sixth}
      - prompt: "A planet has the same radius as the Earth but twice the Earth's mass. How does g on its surface compare with g on Earth?"
        options: ["Twice as big", "The same", "Half as big", "Four times as big"]
        answer: "Twice as big"
        difficulty: 3
        hints: ["g = GM ÷ R².", "Only M changes."]
        solution: "Step 1: g is proportional to M when R is fixed. Step 2: Double the mass gives double g."
        mistakes: {"The same": g_mass_radius, "Half as big": g_mass_radius, "Four times as big": g_mass_radius}
      - prompt: "A planet has the same mass as the Earth but half the Earth's radius. How many times Earth's g is g on its surface?"
        answer: "4"
        check: "1/(0.5)**2"
        difficulty: 3
        hints: ["g = GM ÷ R².", "R becomes ½, so R² becomes ¼."]
        solution: "Step 1: R² is ¼ as big. Step 2: Dividing by ¼ multiplies g by 4."
        mistakes: {"2": inverse_not_square, "0.5": g_mass_radius, "0.25": g_mass_radius}
      - prompt: What is the weight of a 25 kg suitcase on Earth, in N? (g = 10 m/s²)
        answer: '250'
        check: 25*10
        difficulty: 1
        hints:
        - W = mg.
        - 25 × 10.
        solution: 'Step 1: W = m × g. Step 2: 25 × 10. Step 3: = 250 N.'
        mistakes:
          '25': weight_in_kg
          '2.5': weight_in_kg
      - prompt: Which of these changes when you go from the Earth to the Moon?
        options:
        - Your weight
        - Your mass
        - The amount of matter in you
        - Your height
        answer: Your weight
        difficulty: 1
        hints:
        - Weight = m × g.
        - Which one depends on g?
        solution: 'Step 1: Mass stays the same. Step 2: g on the Moon is smaller. Step 3: So weight changes.'
        mistakes:
          Your mass: mass_changes_on_moon
      - prompt: A rock weighs 120 N on the Moon. What would it weigh on Earth, in N? (Moon's g is 1/6 of Earth's.)
        answer: '720'
        check: 120*6
        difficulty: 2
        hints:
        - Earth's g is 6 times the Moon's.
        - 120 × 6.
        solution: 'Step 1: Weight is 6 times bigger on Earth. Step 2: 120 × 6. Step 3: = 720 N.'
        mistakes:
          '20': moon_sixth
      - prompt: A sack weighs 490 N on Earth (g = 9.8 m/s²). What is its mass, in kg?
        answer: '50'
        check: 490/9.8
        difficulty: 2
        hints:
        - m = W ÷ g.
        - 490 ÷ 9.8.
        solution: 'Step 1: W = mg, so m = W ÷ g. Step 2: 490 ÷ 9.8. Step 3: = 50 kg.'
        mistakes:
          '4802': weight_in_kg
      - prompt: A spring balance shows slightly different readings for the same mass at the equator and at a pole. Where does it read more?
        options:
        - At the pole
        - At the equator
        - The same at both
        - It depends on the weather
        answer: At the pole
        difficulty: 3
        hints:
        - The balance shows weight, mg.
        - Where is g larger?
        solution: 'Step 1: The Earth''s radius is smaller at the poles. Step 2: So g is larger there. Step 3: The weight reading is larger at the pole.'
        mistakes:
          At the equator: g_poles
      - prompt: A planet has twice the Earth's radius and the same mass. How does g on its surface compare with g on Earth?
        options:
        - One quarter
        - Half
        - Twice
        - Four times
        answer: One quarter
        difficulty: 3
        hints:
        - g = GM ÷ R².
        - Doubling R makes R² four times.
        solution: 'Step 1: g ∝ 1/R² for the same mass. Step 2: R × 2 means R² × 4. Step 3: So g is 1/4 of Earth''s.'
        mistakes:
          Half: g_mass_radius

  - code: phy9.gravity.free_fall
    title: Free fall
    after: [phy9.gravity.weight]
    notes: |
      A body falling only under gravity is in free fall, with acceleration g downward whatever its
      mass. The equations of motion apply with a = g (≈ 10 m/s²): v = u + gt, h = ut + ½gt²,
      v² = u² + 2gh. For a body thrown up, a = −g; it stops at the top (v = 0), and the time up
      equals the time down. Air resistance makes light, wide objects like feathers fall slower.
    explanations:
      text: "Drop a stone and a ball from the same height and they land together: gravity speeds every object up by about 10 m/s every second. A feather drifts slowly only because air pushes on it. On the Moon, with no air, an astronaut showed a hammer and a feather landing together."
      visual: "Picture a stone dropped from a tower, with its position marked each second: it falls 5 m in the first second, 20 m after 2 s, 45 m after 3 s. The gaps keep growing because it keeps speeding up."
      step_by_step: "A ball is thrown up at 20 m/s (g = 10 m/s²). Step 1: At the top v = 0. Step 2: Time up: 0 = 20 − 10t, so t = 2 s. Step 3: Height: v² = u² − 2gh, so 0 = 400 − 20h, h = 20 m."
      real_world: "Divers on a 10 m board hit the water at about 14 m/s, worked out from v² = 2gh. That is why high diving needs training."
    activity:
      type: formula
      prompt: 'A stone falls from rest: v = gt and h = ½gt² (g = 9.8 m/s²).'
      inputs:
      - name: t
        label: Time
        min: 0
        max: 6
        step: 0.5
        start: 0
        unit: s
      outputs:
      - name: v
        label: Speed
        expr: 9.8*t
        unit: m/s
        places: 1
      - name: h
        label: Distance fallen
        expr: 4.9*t^2
        unit: m
        places: 1
      goals:
      - prompt: Fall 44.1 m.
        want:
          h:
          - 44
          - 44.2
        mistakes:
        - when:
            t: 4.5
          say: 'In 4.5 s it falls about 99 m. Falling objects speed up, so the distance grows with t²: you need a shorter time.'
      - prompt: Reach a speed of 49 m/s.
        want:
          v:
          - 48.9
          - 49.1
        mistakes:
        - when:
            t: 6
          say: After 6 s it is going about 59 m/s. It gains 9.8 m/s every second.
    lesson:
      - teach: 'A body falling only under gravity is in free fall. Without air resistance, all bodies fall with the same acceleration g, whatever their mass: a heavy stone and a light stone dropped together land together. On the Moon, a hammer and a feather were dropped and landed at the same time.'
        check:
          prompt: 'Without air, which falls faster: a 1 kg ball or a 10 kg ball?'
          options:
          - They fall together
          - The 10 kg ball
          - The 1 kg ball
          answer: They fall together
          why: In free fall every body has the same acceleration g.
      - teach: 'Free fall is uniform acceleration with a = g ≈ 10 m/s², so the equations of motion work: v = u + gt, h = ut + ½gt², v² = u² + 2gh. A stone dropped (u = 0) for 2 s reaches 20 m/s and falls ½ × 10 × 4 = 20 m.'
        check:
          prompt: A stone is dropped from rest. How far does it fall in 3 s? (g = 10 m/s²)
          options:
          - 45 m
          - 30 m
          - 90 m
          answer: 45 m
          why: h = ½ × 10 × 3² = 45 m. 30 m/s is its speed, not its distance.
      - teach: Thrown straight up, a body slows by 10 m/s every second (a = −g), stops for an instant at the top (v = 0), then falls back. The time going up equals the time coming down. Thrown up at 20 m/s, it takes 2 s to stop and reaches 20 m.
        check:
          prompt: A ball is thrown up at 30 m/s. How long until it stops at the top? (g = 10 m/s²)
          options:
          - 3 s
          - 300 s
          - 6 s
          answer: 3 s
          why: 'It loses 10 m/s each second: 30 ÷ 10 = 3 s. 6 s is the whole trip up and down.'
    items:
      - prompt: "A heavy stone and a light stone are dropped together from the same height, with no air resistance. Which lands first?"
        options: ["They land together", "The heavy stone", "The light stone", "It depends on their shape"]
        answer: "They land together"
        difficulty: 1
        hints: ["Every body falls with the same acceleration g."]
        solution: "Both fall with acceleration g, so they land at the same time."
        mistakes: {"The heavy stone": heavier_falls_faster}
      - prompt: "A stone is dropped from rest. What is its speed after 3 s, in m/s? (g = 10 m/s²)"
        answer: "30"
        check: "0 + 10*3"
        difficulty: 1
        hints: ["v = u + gt."]
        solution: "v = 0 + 10 × 3 = 30 m/s"
        mistakes: {"13": "free_fall_speed", "45": "speed_not_distance"}
      - prompt: "A stone is dropped from the top of a building and reaches the ground in 2 s. How tall is the building, in m? (g = 10 m/s²)"
        answer: "20"
        check: "Rational(1, 2)*10*2**2"
        difficulty: 2
        hints: ["h = ½gt²."]
        solution: "h = ½ × 10 × 4 = 20 m"
        mistakes: {"40": forgot_half, "10": forgot_square}
      - prompt: "A ball is thrown straight up at 20 m/s. How long does it take to reach the top, in s? (g = 10 m/s²)"
        answer: "2"
        check: "solve(Eq(0, 20 - 10*t), t)[0]"
        difficulty: 2
        hints: ["At the top v = 0.", "0 = 20 − 10t."]
        solution: "0 = 20 − 10t, so t = 2 s."
        mistakes: {"200": g_sign}
      - prompt: "A ball is thrown straight up at 20 m/s. What maximum height does it reach, in m? (g = 10 m/s²)"
        answer: "20"
        check: "20**2/(2*10)"
        difficulty: 3
        hints: ["v² = u² − 2gh with v = 0."]
        solution: "0 = 400 − 20h, so h = 20 m."
        mistakes: {"40": forgot_half}
      - prompt: "A diver drops from rest from a 5 m board. How fast is the diver moving on reaching the water, in m/s? (g = 10 m/s²)"
        answer: "10"
        check: "sqrt(2*10*5)"
        difficulty: 3
        hints: ["v² = 2gh."]
        solution: "v² = 2 × 10 × 5 = 100, so v = 10 m/s."
        mistakes: {"100": forgot_square}
      - prompt: "A stone is thrown straight down at 5 m/s from a bridge and hits the water 2 s later. How high is the bridge above the water, in m? (g = 10 m/s²)"
        answer: "30"
        check: "5*2 + 0.5*10*2**2"
        difficulty: 3
        hints: ["The stone does not start from rest: u = 5 m/s.", "h = ut + ½gt²."]
        solution: "Step 1: ut = 5 × 2 = 10 m. Step 2: ½gt² = ½ × 10 × 4 = 20 m. Step 3: h = 30 m."
        mistakes: {"20": forgot_initial_velocity, "50": forgot_half, "25": forgot_square}
      - prompt: "A ball thrown straight up comes back to the thrower's hand 4 s later. How fast was it thrown, in m/s? (g = 10 m/s²)"
        answer: "20"
        check: "10*4/2"
        difficulty: 3
        hints: ["How long did it take to reach the top?", "At the top v = 0, so u = g × time up."]
        solution: "Step 1: Time up = time down = 2 s. Step 2: u = 10 × 2 = 20 m/s."
        mistakes: {"40": up_down_time, "10": up_down_time}
      - prompt: "A stone dropped from rest falls freely. How far does it fall during the 4th second alone, in m? (g = 10 m/s²)"
        answer: "35"
        check: "0.5*10*4**2 - 0.5*10*3**2"
        difficulty: 3
        hints: ["Distance after 4 s = ½ × 10 × 16.", "Take away the distance after 3 s."]
        solution: "Step 1: After 4 s: 80 m. Step 2: After 3 s: 45 m. Step 3: In the 4th second: 80 − 45 = 35 m."
        mistakes: {"80": fall_in_one_second, "40": fall_in_one_second, "5": fall_in_one_second}
      - prompt: A stone is dropped from rest. What is its speed after 5 s, in m/s? (g = 10 m/s²)
        answer: '50'
        check: 10*5
        difficulty: 1
        hints:
        - v = u + gt, with u = 0.
        - 10 × 5.
        solution: 'Step 1: u = 0. Step 2: v = 0 + 10 × 5. Step 3: = 50 m/s.'
        mistakes:
          '125': speed_not_distance
      - prompt: Why does a feather fall more slowly than a stone in air?
        options:
        - Air resistance slows the feather much more
        - Gravity pulls the feather less strongly per kg
        - The feather has no weight
        - Stones fall faster than g
        answer: Air resistance slows the feather much more
        difficulty: 1
        hints:
        - In a vacuum they fall together.
        - What is different in air?
        solution: 'Step 1: Without air, both fall with acceleration g. Step 2: The feather is light and wide. Step 3: Air resistance slows it much more than the stone.'
        mistakes:
          Gravity pulls the feather less strongly per kg: heavier_falls_faster
      - prompt: A coconut falls from a tree and takes 1.5 s to reach the ground. How high was it, in m? (g = 10 m/s²)
        answer: '11.25'
        check: 0.5*10*1.5**2
        difficulty: 2
        hints:
        - h = ½gt².
        - ½ × 10 × 2.25.
        solution: 'Step 1: u = 0. Step 2: h = ½ × 10 × 1.5². Step 3: = 5 × 2.25 = 11.25 m.'
        mistakes:
          '15': speed_not_distance
      - prompt: A ball is thrown straight up at 15 m/s. How high does it go, in m? (g = 10 m/s²)
        answer: '11.25'
        check: 15**2/(2*10)
        difficulty: 2
        hints:
        - At the top v = 0. Use v² = u² − 2gh.
        - 0 = 225 − 20h.
        solution: 'Step 1: 0 = 15² − 2 × 10 × h. Step 2: 20h = 225. Step 3: h = 11.25 m.'
        mistakes:
          '22.5': up_down_time
      - prompt: A stone is dropped from a 45 m tower. How long does it take to reach the ground, in s? (g = 10 m/s²)
        answer: '3'
        check: sqrt(2*45/10)
        difficulty: 3
        hints:
        - h = ½gt².
        - 45 = 5t², so t² = 9.
        solution: 'Step 1: 45 = ½ × 10 × t². Step 2: t² = 9. Step 3: t = 3 s.'
        mistakes:
          '4.5': fall_in_one_second
          '9': forgot_square
      - prompt: A ball thrown straight up is caught 6 s later at the same height. What was its greatest height, in m? (g = 10 m/s²)
        answer: '45'
        check: 0.5*10*3**2
        difficulty: 3
        hints:
        - Time up = time down = 3 s.
        - 'Falling from rest for 3 s: h = ½gt².'
        solution: 'Step 1: It goes up for 3 s and down for 3 s. Step 2: Falling 3 s from rest: h = ½ × 10 × 9. Step 3: = 45 m.'
        mistakes:
          '180': up_down_time
          '30': speed_not_distance
