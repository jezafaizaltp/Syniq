# Class 9 Physics, chapter 4. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_half, forgot_square.
subject: phy
chapter: 4
title: Gravitation

tips:
  inverse_not_square: "Gravitational force depends on 1 ÷ distance². Doubling the distance makes the force 4 times smaller, not 2."
  mass_changes_on_moon: "Mass is the amount of matter and is the same everywhere. Only weight changes from place to place."
  weight_in_kg: "Weight is a force: multiply mass by g to get newtons."
  heavier_falls_faster: "Without air resistance all bodies fall with the same acceleration g, whatever their mass."
  moon_sixth: "On the Moon, g is about one sixth of the Earth's, so weight is divided by 6."
  g_sign: "Going up, a thrown body slows down by g every second until its velocity is zero."
  big_g_small_g: "G is the universal constant (6.67 × 10⁻¹¹ N m²/kg²), the same everywhere. g is the acceleration due to gravity, about 9.8 m/s² on Earth."

concepts:
  - code: phy9.gravity.universal_law
    title: The universal law of gravitation
    notes: |
      Every two bodies in the universe attract each other with a force F = G m₁m₂ ÷ r², where r is
      the distance between their centres and G = 6.67 × 10⁻¹¹ N m²/kg² is the universal
      gravitational constant. The force is proportional to each mass and inversely proportional to
      the square of the distance. The Earth's pull keeps the Moon in orbit and causes tides with the
      Moon's pull.
    explanations:
      text: "Newton realised that the force pulling an apple down is the same force holding the Moon in orbit. Any two masses attract. Double one mass and the pull doubles. Double the distance and the pull drops to a quarter, because distance is squared."
      visual: "Picture a torch shining on a wall. Move it twice as far and the same light spreads over 4 times the area, so each patch is 4 times dimmer. Gravity weakens with distance the same way."
      step_by_step: "Two masses attract with 36 N. The distance is tripled. Step 1: Force ∝ 1/r². Step 2: r × 3 means r² × 9. Step 3: New force = 36 ÷ 9 = 4 N."
      real_world: "The Moon's pull on the oceans raises the water on the side nearest it, giving the tides that fishermen on the Kerala coast plan around."
    items:
      - prompt: "Two masses attract each other with a force F. If the distance between them is doubled, what is the new force?"
        options: ["F/4", "F/2", "2F", "4F"]
        answer: "F/4"
        difficulty: 1
        hints: ["F ∝ 1/r²."]
        solution: "r² becomes 4r², so the force becomes F/4."
        mistakes: {"F/2": inverse_not_square}
      - prompt: "Two masses attract with 10 N. One of the masses is doubled and the distance stays the same. What is the new force, in N?"
        answer: "20"
        check: "10*2"
        difficulty: 1
        hints: ["Force is proportional to each mass."]
        solution: "Doubling one mass doubles the force: 20 N."
      - prompt: "Which force keeps the Moon moving in its orbit around the Earth?"
        options: ["The Earth's gravitational pull", "Magnetism", "Friction", "The Sun's light"]
        answer: "The Earth's gravitational pull"
        difficulty: 1
        hints: ["The same force that makes an apple fall."]
        solution: "The Earth's gravity pulls the Moon towards it, bending its path into an orbit."
      - prompt: "Two masses attract with 36 N. The distance between them is made 3 times larger. What is the new force, in N?"
        answer: "4"
        check: "36/3**2"
        difficulty: 2
        hints: ["3 times the distance: 9 times smaller."]
        solution: "36 ÷ 3² = 36 ÷ 9 = 4 N"
        mistakes: {"12": inverse_not_square}
      - prompt: "What is the value of the universal gravitational constant G?"
        options: ["6.67 × 10⁻¹¹ N m²/kg²", "9.8 m/s²", "3 × 10⁸ m/s", "1.6 m/s²"]
        answer: "6.67 × 10⁻¹¹ N m²/kg²"
        difficulty: 2
        hints: ["G is very small, and it is not the acceleration due to gravity."]
        solution: "G = 6.67 × 10⁻¹¹ N m²/kg². 9.8 m/s² is g, the acceleration due to gravity on Earth."
        mistakes: {"9.8 m/s²": big_g_small_g}
      - prompt: "Both masses are doubled and the distance between them is also doubled. By what factor does the force change?"
        answer: "1"
        check: "2*2/2**2"
        difficulty: 3
        hints: ["Masses: × 2 × 2 = × 4.", "Distance squared: × 4."]
        solution: "Step 1: Masses multiply the force by 4. Step 2: The distance divides it by 2² = 4. Step 3: Overall × 1, no change."
        mistakes: {"2": inverse_not_square}

  - code: phy9.gravity.weight
    title: Mass, weight and g
    after: [phy9.gravity.universal_law]
    notes: |
      The acceleration due to gravity near the Earth's surface is g ≈ 9.8 m/s² (often taken as
      10 m/s²), g = GM/R². Weight is the force of gravity on a body: W = mg, in newtons. Mass (kg) is
      the same everywhere; weight changes with g. On the Moon g is about 1/6 of the Earth's, so
      weight is about 1/6. g is slightly larger at the poles than at the equator.
    explanations:
      text: "Your mass is how much matter you are made of: 60 kg on Earth, 60 kg on the Moon. Your weight is how hard gravity pulls you: on Earth 60 × 9.8 = 588 N, on the Moon about one sixth of that, 98 N. Scales marked in kg really measure weight and divide by g."
      visual: "Hang the same bag on a spring balance on Earth and then on the Moon. The bag (the mass) is the same; the spring stretches only a sixth as much on the Moon (the weight)."
      step_by_step: "Weight of a 50 kg girl, g = 10 m/s²: Step 1: W = mg. Step 2: W = 50 × 10 = 500 N. Step 3: On the Moon: 500 ÷ 6 ≈ 83 N, mass still 50 kg."
      real_world: "Astronauts on the Moon could leap high with heavy space suits because their weight there was only a sixth of their weight on Earth."
    items:
      - prompt: "What is the weight of a 50 kg girl on Earth, in N? (Take g = 10 m/s².)"
        answer: "500"
        check: "50*10"
        difficulty: 1
        hints: ["W = mg."]
        solution: "W = 50 × 10 = 500 N"
        mistakes: {"50": weight_in_kg, "5": weight_in_kg}
      - prompt: "An astronaut has a mass of 60 kg on Earth. What is the astronaut's mass on the Moon, in kg?"
        answer: "60"
        check: "60"
        difficulty: 1
        hints: ["Does the amount of matter change?"]
        solution: "Mass does not change: 60 kg."
        mistakes: {"10": mass_changes_on_moon}
      - prompt: "Which of these is measured in newtons?"
        options: ["Weight", "Mass", "Acceleration", "Distance"]
        answer: "Weight"
        difficulty: 1
        hints: ["The newton is a unit of force."]
        solution: "Weight is a force, so it is measured in newtons. Mass is in kg."
        mistakes: {"Mass": weight_in_kg}
      - prompt: "A box weighs 600 N on Earth. What does it weigh on the Moon, in N? (Moon's g is 1/6 of Earth's.)"
        answer: "100"
        check: "600*Rational(1, 6)"
        difficulty: 2
        hints: ["Divide by 6."]
        solution: "600 ÷ 6 = 100 N"
        mistakes: {"3600": moon_sixth, "600": mass_changes_on_moon}
      - prompt: "A bag weighs 98 N on Earth (g = 9.8 m/s²). What is its mass, in kg?"
        answer: "10"
        check: "98/Rational(98, 10)"
        difficulty: 2
        hints: ["m = W ÷ g."]
        solution: "m = 98 ÷ 9.8 = 10 kg"
        mistakes: {"98": weight_in_kg}
      - prompt: "Where on the Earth is the value of g the greatest?"
        options: ["At the poles", "At the equator", "On a mountain top", "It is the same everywhere"]
        answer: "At the poles"
        difficulty: 3
        hints: ["g = GM/R². Where is the Earth's radius smallest?"]
        solution: "The Earth is slightly flattened at the poles, so R is smaller there and g is larger."
      - prompt: "A 30 kg child weighs 48 N on the Moon. What is g on the Moon, in m/s²?"
        answer: "1.6"
        check: "Rational(48, 30)"
        difficulty: 3
        hints: ["g = W ÷ m."]
        solution: "g = 48 ÷ 30 = 1.6 m/s²"
        mistakes: {"5/8": weight_in_kg}

  - code: phy9.gravity.free_fall
    title: Free fall
    after: [phy9.gravity.weight]
    notes: |
      A body falling only under gravity is in free fall, with acceleration g downward whatever its
      mass. The equations of motion apply with a = g (≈ 10 m/s²): v = u + gt, h = ut + ½gt²,
      v² = u² + 2gh. For a body thrown up, a = −g; it stops at the top (v = 0), and the time up
      equals the time down. Air resistance makes light, wide objects like feathers fall slower.
    explanations:
      text: "Drop a stone and a ball from the same height and they land together: gravity speeds every object up by about 10 m/s every second. A feather drifts slowly only because air pushes on it. On the Moon, with no air, an astronaut showed a hammer and a feather landing together."
      visual: "Picture a stone dropped from a tower, with its position marked each second: it falls 5 m in the first second, 20 m after 2 s, 45 m after 3 s. The gaps keep growing because it keeps speeding up."
      step_by_step: "A ball is thrown up at 20 m/s (g = 10 m/s²). Step 1: At the top v = 0. Step 2: Time up: 0 = 20 − 10t, so t = 2 s. Step 3: Height: v² = u² − 2gh, so 0 = 400 − 20h, h = 20 m."
      real_world: "Divers on a 10 m board hit the water at about 14 m/s, worked out from v² = 2gh. That is why high diving needs training."
    items:
      - prompt: "A heavy stone and a light stone are dropped together from the same height, with no air resistance. Which lands first?"
        options: ["They land together", "The heavy stone", "The light stone", "It depends on their shape"]
        answer: "They land together"
        difficulty: 1
        hints: ["Every body falls with the same acceleration g."]
        solution: "Both fall with acceleration g, so they land at the same time."
        mistakes: {"The heavy stone": heavier_falls_faster}
      - prompt: "A stone is dropped from rest. What is its speed after 3 s, in m/s? (g = 10 m/s²)"
        answer: "30"
        check: "0 + 10*3"
        difficulty: 1
        hints: ["v = u + gt."]
        solution: "v = 0 + 10 × 3 = 30 m/s"
      - prompt: "A stone is dropped from the top of a building and reaches the ground in 2 s. How tall is the building, in m? (g = 10 m/s²)"
        answer: "20"
        check: "Rational(1, 2)*10*2**2"
        difficulty: 2
        hints: ["h = ½gt²."]
        solution: "h = ½ × 10 × 4 = 20 m"
        mistakes: {"40": forgot_half, "10": forgot_square}
      - prompt: "A ball is thrown straight up at 20 m/s. How long does it take to reach the top, in s? (g = 10 m/s²)"
        answer: "2"
        check: "solve(Eq(0, 20 - 10*t), t)[0]"
        difficulty: 2
        hints: ["At the top v = 0.", "0 = 20 − 10t."]
        solution: "0 = 20 − 10t, so t = 2 s."
        mistakes: {"200": g_sign}
      - prompt: "A ball is thrown straight up at 20 m/s. What maximum height does it reach, in m? (g = 10 m/s²)"
        answer: "20"
        check: "20**2/(2*10)"
        difficulty: 3
        hints: ["v² = u² − 2gh with v = 0."]
        solution: "0 = 400 − 20h, so h = 20 m."
        mistakes: {"40": forgot_half}
      - prompt: "A diver drops from rest from a 5 m board. How fast is the diver moving on reaching the water, in m/s? (g = 10 m/s²)"
        answer: "10"
        check: "sqrt(2*10*5)"
        difficulty: 3
        hints: ["v² = 2gh."]
        solution: "v² = 2 × 10 × 5 = 100, so v = 10 m/s."
        mistakes: {"100": forgot_square}
