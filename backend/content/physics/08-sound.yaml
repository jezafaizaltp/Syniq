# Class 9 Physics, chapter 8. Format: content/README.md.
subject: phy
chapter: 8
title: Sound

tips:
  frequency_stays: "The frequency is set by the vibrating source and does not change in a new medium. Use the new speed."
  one_way: "The thunder travels only once, from the lightning to you. There is no return trip."
  quality: "Two instruments can play the same note equally loudly and still sound different. Which property is about the shape of the wave, not its size or how often it vibrates?"
  other_ears: "The human range is about 20 Hz to 20 kHz. Other animals have different ranges, and dogs hear much higher than we do."
  tension_pitch: "Tightening a string makes it vibrate more times each second. Which property depends on how many vibrations per second?"
  clap_with_echo: "Find the time for the echo to come back (there and back). One clap fits in each of those intervals."
  wave_equation: "Speed = frequency × wavelength (v = fλ). For wavelength divide speed by frequency."
  period_frequency: "Period and frequency are reciprocals: T = 1 ÷ f."
  echo_double: "In an echo the sound travels to the wall and back, so the distance to the wall is half of speed × time."
  sound_needs_medium: "Sound is a vibration passed from particle to particle, so it needs particles. It is fastest where particles are packed tightly and bonded strongly, and impossible where there are none."
  speed_in_media: "Sound travels fastest in solids, slower in liquids and slowest in gases."
  pitch_loudness: "Pitch is how high or low a note is: it depends on how many vibrations per second. Loudness depends on how big each vibration is."
  audible_range: "Humans hear from about 20 Hz to 20 kHz. Sounds below are infra- (below), above are ultra- (beyond). Some night animals and SONAR use sounds too high for us."
  longitudinal: "In a sound wave the particles of the medium vibrate back and forth along the direction the wave travels: a longitudinal wave."
  absorb_sound: "Soft rough materials absorb sound so it doesn't keep bouncing around."

concepts:
  - code: phy9.sound.waves
    title: Sound as a wave
    notes: |
      Sound is produced by vibrating objects and travels as a longitudinal wave of compressions and
      rarefactions. It needs a medium and cannot travel through a vacuum. Wave quantities: wavelength λ
      (distance between two compressions), frequency f (vibrations per second, hertz), period T = 1/f,
      amplitude, speed v = fλ. Speed of sound in air ≈ 340 m/s; it is faster in liquids and fastest in
      solids, and increases with temperature.
    explanations:
      text: "Strike a tuning fork and touch it to water: it splashes, because it vibrates. These vibrations push and pull the air, making regions where air is squashed (compressions) and spread out (rarefactions). This pattern travels to your ear. On the Moon, with no air, astronauts need radios to talk."
      visual: "Picture a slinky stretched on a table. Push one end back and forth: bunched-up coils travel along it. That is how a sound wave moves through air."
      step_by_step: "A sound of frequency 170 Hz in air (340 m/s): Step 1: v = fλ. Step 2: λ = v ÷ f = 340 ÷ 170. Step 3: λ = 2 m."
      real_world: "Put your ear to a railway track (only when no train is near!): you hear a distant train earlier through the steel than through the air."
    activity:
      type: formula
      prompt: Speed of a wave = frequency × wavelength.
      inputs:
      - name: f
        label: Frequency
        min: 10
        max: 1000
        step: 10
        start: 100
        unit: Hz
      - name: l
        label: Wavelength
        min: 0.1
        max: 5
        step: 0.1
        start: 1
        unit: m
      outputs:
      - name: v
        label: Speed
        expr: f*l
        unit: m/s
        places: 1
      goals:
      - prompt: 'A 170 Hz sound in air (340 m/s): set its wavelength.'
        want:
          v: 340
          f: 170
        mistakes:
        - when:
            l: 0.5
            f: 170
          say: 0.5 m × 170 Hz = 85 m/s, far too slow for sound in air. Did you divide 170 by 340? Wavelength = speed ÷ frequency.
    items:
      - prompt: "Sound cannot travel through:"
        options: ["A vacuum", "Water", "Steel", "Air"]
        answer: "A vacuum"
        difficulty: 1
        hints: ["Sound needs particles to vibrate."]
        solution: "Sound needs a medium; a vacuum has none."
        mistakes: {"Steel": sound_needs_medium, "Water": sound_needs_medium}
      - prompt: "A sound wave has frequency 170 Hz and speed 340 m/s. What is its wavelength, in m?"
        answer: "2"
        check: "340/170"
        difficulty: 1
        hints: ["λ = v ÷ f."]
        solution: "340 ÷ 170 = 2 m"
        mistakes: {"57800": wave_equation, "1/2": wave_equation}
      - prompt: "In which medium does sound travel fastest?"
        options: ["Steel", "Water", "Air", "Vacuum"]
        answer: "Steel"
        difficulty: 1
        hints: ["Solids > liquids > gases."]
        solution: "Sound is fastest in solids such as steel."
        mistakes: {"Air": speed_in_media, "Vacuum": sound_needs_medium}
      - prompt: "A wave has frequency 50 Hz. What is its time period, in s?"
        answer: "1/50"
        check: "1/50"
        difficulty: 2
        hints: ["T = 1 ÷ f."]
        solution: "T = 1 ÷ 50 = 0.02 s"
        mistakes: {"50": period_frequency}
      - prompt: "A sound wave has wavelength 0.5 m and frequency 680 Hz. What is its speed, in m/s?"
        answer: "340"
        check: "Rational(1, 2)*680"
        difficulty: 2
        hints: ["v = fλ."]
        solution: "680 × 0.5 = 340 m/s"
        mistakes: {"1360": wave_equation}
      - prompt: "Sound waves in air are called longitudinal because:"
        options: ["Air particles vibrate along the direction the wave travels", "Air particles vibrate at right angles to the wave", "They are very long", "They travel only in straight lines"]
        answer: "Air particles vibrate along the direction the wave travels"
        difficulty: 3
        hints: ["Think of the slinky being pushed and pulled."]
        solution: "The particles move back and forth parallel to the wave's direction, forming compressions and rarefactions."
        mistakes: {"Air particles vibrate at right angles to the wave": longitudinal}
      - prompt: "A 500 Hz sound passes from air (speed 340 m/s) into water (speed 1500 m/s). What is its wavelength in water, in m?"
        answer: "3"
        check: "1500/500"
        difficulty: 3
        hints: ["Does the frequency change when sound enters water?", "λ = v ÷ f, using the speed in water."]
        solution: "Step 1: The frequency stays 500 Hz. Step 2: λ = 1500 ÷ 500 = 3 m."
        mistakes: {"0.68": frequency_stays, "750000": wave_equation, "1/3": wave_equation}
      - prompt: "The time between two compressions passing a point is 0.004 s. What is the frequency of the sound, in Hz?"
        answer: "250"
        check: "1/0.004"
        difficulty: 2
        hints: ["The time between compressions is the period T.", "f = 1 ÷ T."]
        solution: "Step 1: T = 0.004 s. Step 2: f = 1 ÷ 0.004 = 250 Hz."
        mistakes: {"0.004": period_frequency, "4": period_frequency}
      - prompt: "Lightning is seen and its thunder is heard 3 s later. Sound travels at 340 m/s and the light arrives almost at once. How far away is the lightning, in m?"
        answer: "1020"
        check: "340*3"
        difficulty: 2
        hints: ["How long did the sound take to reach you?", "Distance = speed × time."]
        solution: "Step 1: Sound took 3 s. Step 2: Distance = 340 × 3 = 1020 m."
        mistakes: {"510": one_way, "113.33": speed_time_swapped}

  - code: phy9.sound.properties
    title: Pitch, loudness and hearing
    after: [phy9.sound.waves]
    notes: |
      Pitch is how high or low a sound is and depends on frequency. Loudness depends on amplitude (and
      is measured in decibels, dB). Quality (timbre) lets us tell instruments apart. Human hearing:
      about 20 Hz to 20 kHz. Below 20 Hz: infrasound (elephants, earthquakes). Above 20 kHz:
      ultrasound (bats, dolphins, medical scanning). Noise above about 80 dB for long periods harms
      hearing.
    explanations:
      text: "A small bell rings high (high frequency); a big temple bell booms low (low frequency). Hit a drum harder and the skin vibrates further (bigger amplitude), so the sound is louder but not higher. Bats squeak above 20,000 Hz, too high for us, and use the echoes to find insects."
      visual: "Draw two waves: one with peaks close together (high pitch) and one spread out (low pitch). Then two waves with the same spacing but one much taller (louder)."
      step_by_step: "Can a person hear a 25,000 Hz whistle? Step 1: Human range is 20 Hz to 20,000 Hz. Step 2: 25,000 Hz is above the range. Step 3: No: it is ultrasound (dogs can hear it)."
      real_world: "Doctors use ultrasound scans to see a baby before birth, without the harm of X-rays."
    activity:
      type: sort
      prompt: Does it change the pitch or the loudness?
      bins:
      - Pitch
      - Loudness
      items:
      - label: Tightening a guitar string
        bin: Pitch
        clue: Does it change how fast the string vibrates, or how far it swings?
        why: 'A tighter string vibrates faster: higher frequency, higher pitch.'
      - label: Plucking a string harder
        bin: Loudness
        clue: Does it change how fast it vibrates, or how far it swings?
        why: It swings further (bigger amplitude), so it's louder. The pitch stays the same.
      - label: Shortening the air column in a flute
        bin: Pitch
        clue: Does a shorter air column vibrate faster or slower?
        why: 'A shorter column vibrates faster: higher pitch.'
      - label: Beating a drum harder
        bin: Loudness
        clue: Does it change how fast the skin vibrates, or how far it moves?
        why: 'The skin moves further: bigger amplitude, louder.'
      - label: Higher frequency
        bin: Pitch
        clue: Frequency is how many vibrations each second. Which does that set?
        why: More vibrations each second means a higher pitch.
      - label: Bigger amplitude
        bin: Loudness
        clue: Amplitude is how far it vibrates. Which does that set?
        why: 'Bigger vibrations carry more energy: louder.'
    items:
      - prompt: "The pitch of a sound depends on its:"
        options: ["Frequency", "Amplitude", "Speed", "Medium only"]
        answer: "Frequency"
        difficulty: 1
        hints: ["High notes vibrate more times a second."]
        solution: "Higher frequency means higher pitch."
        mistakes: {"Amplitude": pitch_loudness}
      - prompt: "Hitting a drum harder makes the sound louder. What has increased?"
        options: ["Amplitude", "Frequency", "Wavelength", "Speed of sound"]
        answer: "Amplitude"
        difficulty: 1
        hints: ["The drum skin moves further."]
        solution: "A bigger amplitude gives a louder sound."
        mistakes: {"Frequency": pitch_loudness}
      - prompt: "What is the upper limit of human hearing, in Hz?"
        answer: "20000"
        check: "20*1000"
        difficulty: 1
        hints: ["20 kHz."]
        solution: "About 20,000 Hz (20 kHz)."
        mistakes: {"20": audible_range}
      - prompt: "Sound with frequency above 20,000 Hz is called:"
        options: ["Ultrasound", "Infrasound", "Audible sound", "Echo"]
        answer: "Ultrasound"
        difficulty: 2
        hints: ["Ultra means beyond."]
        solution: "Above the human range is ultrasound."
        mistakes: {"Infrasound": audible_range}
      - prompt: "Which animal uses ultrasound to find its way and its prey in the dark?"
        options: ["Bat", "Elephant", "Cow", "Snake"]
        answer: "Bat"
        difficulty: 2
        hints: ["Echolocation."]
        solution: "Bats send out ultrasonic squeaks and listen to the echoes."
        mistakes: {"Elephant": audible_range}
      - prompt: "A tuning fork makes 512 vibrations per second. A second fork makes 256. Which statement is true?"
        options: ["The first fork has a higher pitch", "The second fork has a higher pitch", "Both have the same pitch", "The first fork is louder"]
        answer: "The first fork has a higher pitch"
        difficulty: 3
        hints: ["Pitch follows frequency, not loudness."]
        solution: "512 Hz is higher than 256 Hz, so the first fork sounds higher. Loudness depends on how hard they are struck."
        mistakes: {"The first fork is louder": pitch_loudness}
      - prompt: "A flute and a violin play the same note equally loudly. What lets us tell which is which?"
        options: ["Quality (timbre)", "Pitch", "Loudness", "Speed of the sound"]
        answer: "Quality (timbre)"
        difficulty: 2
        hints: ["Same note means the same pitch.", "Equally loud means the same amplitude."]
        solution: "Step 1: Pitch and loudness are the same. Step 2: The difference is the shape of the wave, called its quality or timbre."
        mistakes: {"Pitch": quality, "Loudness": quality, "Speed of the sound": quality}
      - prompt: "A whistle of 25 kHz is blown near a dog and a person. Who can hear it?"
        options: ["Only the dog", "Only the person", "Both", "Neither"]
        answer: "Only the dog"
        difficulty: 2
        hints: ["What is the upper limit of human hearing?", "Dogs hear higher sounds than people."]
        solution: "Step 1: 25 kHz is above 20 kHz, so it is ultrasound for us. Step 2: Dogs hear up to about 45 kHz, so only the dog hears it."
        mistakes: {"Only the person": other_ears, "Both": audible_range, "Neither": other_ears}
      - prompt: "A guitar string is tightened, so it vibrates faster. What happens to the sound?"
        options: ["The pitch goes up", "It gets louder", "The pitch goes down", "It travels faster through the air"]
        answer: "The pitch goes up"
        difficulty: 2
        hints: ["Faster vibration means higher frequency.", "Which property depends on frequency?"]
        solution: "Step 1: A tighter string vibrates at a higher frequency. Step 2: Higher frequency means higher pitch."
        mistakes: {"It gets louder": pitch_loudness, "The pitch goes down": tension_pitch, "It travels faster through the air": speed_in_media}
      - prompt: "A bat makes sounds of 50 000 Hz. Why can't we hear them?"
        options:
        - "They are ultrasound, above our upper limit of about 20 000 Hz"
        - "They are too loud"
        - "They are infrasound, below 20 Hz"
        - "Sound cannot travel through air at night"
        answer: "They are ultrasound, above our upper limit of about 20 000 Hz"
        difficulty: 3
        hints: ["Recall the range of frequencies humans can hear.", "Is 50 000 Hz above or below that range?"]
        solution: "Step 1: Humans hear about 20 Hz to 20 000 Hz. Step 2: 50 000 Hz is above the upper limit. Step 3: Sound above 20 kHz is ultrasound, which we cannot hear."
        mistakes: {"They are too loud": pitch_loudness, "They are infrasound, below 20 Hz": audible_range}

  - code: phy9.sound.echo
    title: Reflection of sound and echoes
    after: [phy9.sound.waves]
    notes: |
      Sound reflects from hard surfaces. An echo is heard if the reflected sound reaches us at least
      0.1 s after the original, which in air (≈ 340 m/s) needs the reflector to be at least 17 m away.
      Distance to the reflector = (speed × time) ÷ 2, because the sound goes there and back. SONAR
      uses ultrasound echoes to find the depth of the sea. Repeated reflections that blend together
      cause reverberation, reduced in halls by soft materials.
    explanations:
      text: "Shout towards a cliff and you hear your voice again: the sound bounced back. If the echo comes 2 s later, the sound travelled 340 × 2 = 680 m in total, there and back, so the cliff is 340 m away. Ships measure the depth of the sea the same way with ultrasound."
      visual: "Draw a person, an arrow going to a cliff and an arrow coming back. Label the full round trip v × t and the distance to the cliff half of that."
      step_by_step: "A ship's sonar pulse returns after 4 s; sound in sea water travels at 1500 m/s. Step 1: Total path = 1500 × 4 = 6000 m. Step 2: Depth = 6000 ÷ 2 = 3000 m."
      real_world: "Cinema halls and auditoriums have curtains, carpets and soft panels to soak up sound and stop echoes from muddling speech."
    activity:
      type: formula
      prompt: 'An echo goes to the wall and back: time = 2 × distance ÷ 340 m/s.'
      inputs:
      - name: d
        label: Distance to the wall
        min: 10
        max: 400
        step: 10
        start: 10
        unit: m
      outputs:
      - name: t
        label: Echo time
        expr: 2*d/340
        unit: s
        places: 2
      goals:
      - prompt: Hear the echo after 1 s.
        want:
          t:
          - 0.99
          - 1.01
        mistakes:
        - when:
            d: 340
          say: 'At 340 m the echo takes 2 s: the sound goes to the wall and back, so it travels twice the distance.'
      - prompt: The smallest gap we can hear as an echo is 0.1 s. Find the shortest distance.
        want:
          t:
          - 0.1
          - 0.12
        mistakes:
        - when:
            d: 10
          say: 'At 10 m the echo comes back in about 0.06 s: too quick for the ear to hear it as a separate sound.'
    items:
      - prompt: "A boy hears the echo of his shout from a cliff 2 s later. Sound travels at 340 m/s. How far away is the cliff, in m?"
        answer: "340"
        check: "340*2/2"
        difficulty: 1
        hints: ["The sound goes there and back."]
        solution: "Step 1: Total path = 340 × 2 = 680 m. Step 2: Distance = 680 ÷ 2 = 340 m."
        mistakes: {"680": echo_double}
      - prompt: "A ship's sonar signal returns after 4 s. Sound travels at 1500 m/s in sea water. How deep is the sea, in m?"
        answer: "3000"
        check: "1500*4/2"
        difficulty: 2
        hints: ["Halve the total path."]
        solution: "1500 × 4 = 6000 m round trip; depth = 3000 m."
        mistakes: {"6000": echo_double}
      - prompt: "What is the minimum distance from a reflecting wall needed to hear a distinct echo, in m? (speed 340 m/s; minimum gap 0.1 s)"
        answer: "17"
        check: "340*Rational(1, 10)/2"
        difficulty: 2
        hints: ["The round trip must take 0.1 s: 34 m."]
        solution: "340 × 0.1 = 34 m round trip, so the wall must be at least 17 m away."
        mistakes: {"34": echo_double}
      - prompt: "SONAR uses which kind of sound?"
        options: ["Ultrasound", "Infrasound", "Audible sound", "Light"]
        answer: "Ultrasound"
        difficulty: 1
        hints: ["High frequency, travels well in water."]
        solution: "SONAR sends ultrasonic pulses and times their echoes."
        mistakes: {"Infrasound": audible_range}
      - prompt: "Why are the walls of concert halls often covered with soft, rough materials?"
        options: ["To absorb sound and reduce reverberation", "To make the sound louder", "To increase echoes", "To keep the hall warm"]
        answer: "To absorb sound and reduce reverberation"
        difficulty: 2
        hints: ["Hard surfaces reflect sound."]
        solution: "Soft materials absorb sound, so fewer reflections blur the music or speech."
        mistakes: {"To make the sound louder": "absorb_sound", "To increase echoes": "absorb_sound"}
      - prompt: "A person stands between two cliffs and claps. The first echo comes after 1 s and the second after 2 s. How far apart are the cliffs, in m? (speed 340 m/s)"
        answer: "510"
        check: "340*1/2 + 340*2/2"
        difficulty: 3
        hints: ["Distance to each cliff = 340 × t ÷ 2.", "170 m and 340 m."]
        solution: "Step 1: Nearer cliff: 340 × 1 ÷ 2 = 170 m. Step 2: Farther cliff: 340 × 2 ÷ 2 = 340 m. Step 3: 170 + 340 = 510 m."
        mistakes: {"1020": echo_double}
      - prompt: "A man stands 85 m from a wall and claps once. After how many seconds does he hear the echo? (speed of sound 340 m/s)"
        answer: "0.5"
        check: "2*85/340"
        difficulty: 2
        hints: ["The sound goes to the wall and back.", "Total distance = 170 m."]
        solution: "Step 1: Distance travelled = 2 × 85 = 170 m. Step 2: Time = 170 ÷ 340 = 0.5 s."
        mistakes: {"0.25": echo_double, "4": speed_time_swapped}
      - prompt: "A bat sends out ultrasound and hears the echo from a moth 0.02 s later. Sound travels at 340 m/s. How far away is the moth, in m?"
        answer: "3.4"
        check: "340*0.02/2"
        difficulty: 2
        hints: ["Distance travelled = 340 × 0.02.", "The sound went to the moth and back."]
        solution: "Step 1: 340 × 0.02 = 6.8 m there and back. Step 2: The moth is 3.4 m away."
        mistakes: {"6.8": echo_double, "17000": speed_time_swapped}
      - prompt: "A boy stands 34 m from a wall and claps so that each clap comes exactly as the echo of the last one arrives. How many claps does he make each second? (speed of sound 340 m/s)"
        answer: "5"
        check: "340/(2*34)"
        difficulty: 3
        hints: ["How long does the echo take to come back?", "Echo time = 68 ÷ 340."]
        solution: "Step 1: Echo time = 2 × 34 ÷ 340 = 0.2 s. Step 2: One clap every 0.2 s means 5 claps a second."
        mistakes: {"10": echo_double, "0.2": clap_with_echo}
