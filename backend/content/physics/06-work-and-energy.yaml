# Class 9 Physics, chapter 6. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_half, forgot_square.
subject: phy
chapter: 6
title: Work and Energy

tips:
  add_each_part: "Find the work for each part with its own force and distance, then add."
  lift_then_carry: "Against gravity, only the upward part of the motion counts. Moving along a level floor is at right angles to gravity."
  orbit_right_angle: "Gravity pulls towards the Earth's centre while the satellite moves along the circle. What is the angle between the force and the motion?"
  elastic_store: "Where is the energy stored before the arrow is let go, and what does the arrow have once it flies?"
  minutes_to_hours: "Units (kWh) need power in kilowatts and time in hours. Change minutes to hours and add up all the days."
  work_needs_displacement: "Work is done only when the force moves something in the direction of the force: W = F × s. No movement, no work."
  work_divided: "Work = force × displacement. Multiply, don't divide."
  power_per_time: "Power = work ÷ time. Divide the work by the time taken."
  ke_speed_squared: "Kinetic energy = ½mv². The speed is squared, so doubling the speed makes KE four times bigger."
  pe_mgh: "Potential energy = mgh: mass × g × height."
  energy_conserved: "Energy is not lost: as a body falls, potential energy turns into kinetic energy and the total stays the same."
  kw_to_w: "Units of electricity are kWh: change watts to kilowatts first (divide by 1000), then multiply by hours. To get joules, multiply watts by seconds: 1000 W for 3600 s."
  hydro_chain: "In a dam: stored water (potential) falls (kinetic) and turns a generator (electrical)."
  pe_position: "Potential energy comes from position, like water held high. Moving things have kinetic energy."
  work_joule: "Each quantity has its own unit: force in newtons, power in watts. Work (force × distance) has a unit named after James Prescott ___."

concepts:
  - code: phy9.energy.work
    title: Work
    notes: |
      Work is done when a force moves an object in the direction of the force: W = F × s, unit joule
      (1 J = 1 N × 1 m). If there is no displacement, or the force is at right angles to the motion,
      no work is done. Work is negative when the force opposes the motion (friction, lifting against
      a falling body). Lifting a mass m through height h needs work mgh.
    explanations:
      text: "Pushing a heavy box 5 m across the floor with a 40 N force does 40 × 5 = 200 J of work. Pushing hard against a wall that doesn't move does no work in physics, however tired you get. Carrying a bag while walking on level ground does no work on the bag against gravity, because the force (up) is at right angles to the motion (along)."
      visual: "Draw a box with a force arrow and a displacement arrow. If they point the same way, work is positive; opposite ways, negative; at right angles, zero."
      step_by_step: "Work to lift a 10 kg bag onto a 1.5 m shelf (g = 10 m/s²): Step 1: Force needed = weight = 10 × 10 = 100 N. Step 2: Displacement = 1.5 m upward. Step 3: W = 100 × 1.5 = 150 J."
      real_world: "A coolie who lifts a 30 kg load onto his head (about 1.5 m) does about 450 J of work each time."
    activity:
      type: formula
      prompt: Work = force × distance moved in the direction of the force.
      inputs:
      - name: f
        label: Force
        min: 0
        max: 50
        step: 5
        start: 0
        unit: N
      - name: s
        label: Distance
        min: 0
        max: 10
        step: 1
        start: 0
        unit: m
      outputs:
      - name: w
        label: Work done
        expr: f*s
        unit: J
      goals:
      - prompt: Do 120 J of work by pushing a box 4 m.
        want:
          w: 120
          s: 4
    lesson:
      - teach: 'In everyday talk, reading or thinking is ''work''. In physics, work has a strict meaning: work is done only when a force makes something move. Push a trolley and it rolls: you did work. Push a wall that doesn''t budge: no work, however tired you feel.'
        check:
          prompt: In which case is work done on the object?
          options:
          - A girl kicks a ball and it rolls away
          - A man holds a heavy box still
          - A boy pushes a wall that does not move
          answer: A girl kicks a ball and it rolls away
          why: Only the ball moves under the force. Holding still or pushing a fixed wall moves nothing.
        ways:
        - style: step_by_step
          teach: 'Step 1: is there a force on the object? Step 2: did the object move? Step 3: did it move along the direction of the force? Only if all three are yes is work done. Pushing a wall that doesn''t move fails step 2, so no work.'
      - teach: 'How much work? Multiply the force by the distance moved in the direction of the force: W = F × s. The unit is the joule (J): 1 J is the work done when 1 N moves something 1 m. A 10 N push over 3 m does 30 J of work.'
        picture:
          kind: flow
          steps:
          - Force F (newtons)
          - Moves the object s metres along the force
          - Work W = F × s (joules)
          alt: Force times distance along the force gives work in joules.
        check:
          prompt: A 25 N force moves a cart 4 m along the force. How much work is done?
          options:
          - 100 J
          - 29 J
          - 6.25 J
          answer: 100 J
          why: W = F × s = 25 × 4 = 100 J.
        ways:
        - style: step_by_step
          teach: 'Step 1: find the force in newtons. Step 2: find the distance moved along the force in metres. Step 3: multiply: W = F × s. The answer is in joules.'
      - teach: 'Direction matters. If the force is at right angles to the motion, it does no work: carrying a bag across a level floor, your hand pushes up but the bag moves sideways. If the force acts against the motion, like friction on a sliding box, the work is negative.'
        check:
          prompt: A box slides 5 m while friction of 4 N acts against it. What work does friction do?
          options:
          - −20 J
          - 20 J
          - Zero
          answer: −20 J
          why: 'Friction opposes the motion, so its work is negative: −4 × 5 = −20 J.'
        ways:
        - style: real_world
          teach: 'Carrying a bucket across the courtyard, your arm pulls up, but the bucket moves sideways: your pull does no work on it in physics. Friction on a sliding chair pulls backwards while the chair moves forwards: that is negative work, taking energy away.'
      - teach: Lifting is a special case. To lift a mass m steadily, you push up with a force equal to its weight, mg. Through a height h, the work is mgh. Lifting a 2 kg bag 3 m (g = 10 m/s²) takes 2 × 10 × 3 = 60 J.
        check:
          prompt: How much work lifts a 4 kg pot 2 m? (g = 10 m/s²)
          options:
          - 80 J
          - 8 J
          - 40 J
          answer: 80 J
          why: W = mgh = 4 × 10 × 2 = 80 J.
        ways:
        - style: step_by_step
          teach: 'Step 1: to lift something steadily, the force you need equals its weight, mg. Step 2: multiply that force by the height h. Step 3: W = mgh. Step 4: use g = 10 m/s² unless told otherwise.'
    items:
      - prompt: "A force of 40 N pushes a box 5 m in the direction of the force. How much work is done, in J?"
        answer: "200"
        check: "40*5"
        difficulty: 1
        hints: ["W = F × s."]
        solution: "W = 40 × 5 = 200 J"
        mistakes: {"8": work_divided, "45": work_divided}
      - prompt: "A boy pushes hard against a wall but it does not move. How much work does he do on the wall?"
        options: ["Zero", "A lot", "Equal to his weight", "Depends on how long he pushes"]
        answer: "Zero"
        difficulty: 1
        hints: ["Is there any displacement?"]
        solution: "No displacement, so W = F × 0 = 0."
        mistakes: {"A lot": work_needs_displacement, "Depends on how long he pushes": work_needs_displacement}
      - prompt: "How much work is needed to lift a 10 kg bag through 1.5 m? (g = 10 m/s²) Give the answer in J."
        answer: "150"
        check: "10*10*Rational(3, 2)"
        difficulty: 2
        hints: ["Force = weight = mg."]
        solution: "Step 1: Weight = 100 N. Step 2: W = 100 × 1.5 = 150 J."
        mistakes: {"15": pe_mgh}
      - prompt: "What is the SI unit of work?"
        options: ["Joule", "Newton", "Watt", "Pascal"]
        answer: "Joule"
        difficulty: 1
        hints: ["Newton × metre."]
        solution: "1 J = 1 N × 1 m."
        mistakes: {"Newton": "work_joule", "Watt": "work_joule"}
      - prompt: "Friction of 20 N acts on a sledge as it moves 10 m. How much work does friction do, in J?"
        answer: "-200"
        check: "-20*10"
        difficulty: 3
        hints: ["Friction opposes the motion."]
        solution: "W = −20 × 10 = −200 J: negative because the force is opposite to the motion."
        mistakes: {"200": work_needs_displacement}
      - prompt: "A girl carries a bag along a level road. How much work does the upward force of her hand do on the bag?"
        options: ["Zero, because the force is at right angles to the motion", "Positive", "Negative", "Equal to the bag's weight × distance"]
        answer: "Zero, because the force is at right angles to the motion"
        difficulty: 2
        hints: ["The force is up; the motion is along the road."]
        solution: "Force and displacement are perpendicular, so no work is done by that force."
        mistakes: {"Equal to the bag's weight × distance": work_needs_displacement}
      - prompt: "A 50 kg box is lifted 2 m onto a cart and then pushed 10 m along a level floor. How much work is done against gravity in all, in J? (g = 10 m/s²)"
        answer: "1000"
        check: "50*10*2"
        difficulty: 3
        hints: ["Which part of the motion is against gravity?", "Work against gravity = mgh."]
        solution: "Step 1: Lifting: 50 × 10 × 2 = 1000 J. Step 2: The level part is at right angles to gravity, so no work against gravity. Step 3: Total = 1000 J."
        mistakes: {"6000": lift_then_carry, "100": pe_mgh, "5000": lift_then_carry}
      - prompt: "A force of 30 N moves a trolley 4 m. Then a force of 20 N moves it a further 6 m in the same direction. How much work is done in all, in J?"
        answer: "240"
        check: "30*4 + 20*6"
        difficulty: 2
        hints: ["Work for the first part = 30 × 4.", "Add the work for the second part."]
        solution: "Step 1: 30 × 4 = 120 J. Step 2: 20 × 6 = 120 J. Step 3: Total = 240 J."
        mistakes: {"500": add_each_part, "120": add_each_part, "60": work_divided}
      - prompt: "A satellite moves in a circular orbit around the Earth. How much work does the Earth's gravity do on it during one orbit?"
        options: ["Zero", "A positive amount", "A negative amount", "It depends on the satellite's speed"]
        answer: "Zero"
        difficulty: 3
        hints: ["Which way does gravity pull the satellite?", "Which way is the satellite moving at each moment?"]
        solution: "Step 1: Gravity points to the centre; the motion is along the circle. Step 2: Force at right angles to motion does no work."
        mistakes: {"A positive amount": orbit_right_angle, "A negative amount": orbit_right_angle, "It depends on the satellite's speed": orbit_right_angle}
      - prompt: A horse pulls a cart with a force of 300 N along a road for 50 m. How much work does the horse do, in J?
        answer: '15000'
        check: 300*50
        difficulty: 1
        hints:
        - Work = force × distance moved along the force.
        - Multiply 300 by 50.
        solution: 'Step 1: F = 300 N, s = 50 m. Step 2: W = F × s = 300 × 50. Step 3: W = 15000 J.'
        mistakes:
          '6': work_divided
          '350': work_divided
      - prompt: A force does 120 J of work while moving a box 6 m along the force. What is the force, in N?
        answer: '20'
        check: 120/6
        difficulty: 2
        hints:
        - Start from W = F × s.
        - Rearrange it to find F.
        solution: 'Step 1: W = F × s, so F = W ÷ s. Step 2: F = 120 ÷ 6. Step 3: F = 20 N.'
        mistakes:
          '720': work_divided
      - prompt: In which of these does the named force do NO work?
        options:
        - A waiter's upward push on a tray as he walks across a level room
        - Gravity on a falling coconut
        - A boy's push on a cycle he is pedalling forward
        - An engine's pull on a moving train
        answer: A waiter's upward push on a tray as he walks across a level room
        difficulty: 2
        hints:
        - Compare the direction of the force with the direction the object moves.
        - Which force is at right angles to the motion?
        solution: 'Step 1: The waiter pushes up on the tray. Step 2: The tray moves sideways across the room. Step 3: The force is at right angles to the motion, so it does no work.'
        mistakes:
          Gravity on a falling coconut: lift_then_carry
      - prompt: A student holds a 5 kg bag above the ground for 2 minutes without moving. How much work is done on the bag, in J?
        answer: '0'
        check: '0'
        difficulty: 2
        hints:
        - Does the bag move?
        - W = F × s, and s is the distance moved.
        solution: 'Step 1: The force holds the bag up. Step 2: The bag does not move, so s = 0. Step 3: W = F × 0 = 0 J.'
        mistakes:
          '50': work_needs_displacement
          '6000': work_needs_displacement
      - prompt: A crane lifts a 200 kg load to a height of 15 m. How much work does it do against gravity, in J? (g = 10 m/s²)
        answer: '30000'
        check: 200*10*15
        difficulty: 2
        hints:
        - The force needed equals the weight, mg.
        - W = mgh.
        solution: 'Step 1: Weight = 200 × 10 = 2000 N. Step 2: Height = 15 m. Step 3: W = 2000 × 15 = 30000 J.'
        mistakes:
          '3000': pe_mgh
      - prompt: A 40 kg boy climbs a 5 m staircase, then walks 20 m along a level corridor. How much work does he do against gravity in all, in J? (g = 10 m/s²)
        answer: '2000'
        check: 40*10*5
        difficulty: 3
        hints:
        - Only the height gained matters for work against gravity.
        - Is walking along a level corridor moving up or sideways?
        solution: 'Step 1: Climbing: W = mgh = 40 × 10 × 5 = 2000 J. Step 2: The level walk is at right angles to gravity: no work against it. Step 3: Total = 2000 J.'
        mistakes:
          '10000': lift_then_carry

  - code: phy9.energy.kinetic_potential
    title: Kinetic and potential energy
    after: [phy9.energy.work]
    notes: |
      Energy is the capacity to do work (joule). Kinetic energy, the energy of motion, is KE = ½mv².
      Gravitational potential energy, the energy due to height, is PE = mgh. Other forms: elastic
      (stretched spring), chemical, heat, light, sound, electrical. Doubling the speed makes KE four
      times as large; doubling the height doubles PE.
    explanations:
      text: "A moving cricket ball can knock over stumps: it has kinetic energy. A coconut high on a tree can crack a roof if it falls: it has potential energy because of its height. KE = ½mv²; PE = mgh. Speed counts twice in KE because it is squared."
      visual: "Picture a ball rolling down a slide. At the top: tall bar for PE, no bar for KE. Halfway: two medium bars. At the bottom: no PE, tall KE bar."
      step_by_step: "KE of a 2 kg ball at 3 m/s: Step 1: KE = ½ × m × v². Step 2: = ½ × 2 × 9. Step 3: = 9 J."
      real_world: "The speed limit near schools is low because a car's KE grows with the square of speed: at 60 km/h it has four times the energy it has at 30 km/h."
    activity:
      type: formula
      prompt: A 2 kg ball. KE = ½mv² and PE = mgh (g = 10 m/s²).
      inputs:
      - name: v
        label: Speed
        min: 0
        max: 20
        step: 1
        start: 0
        unit: m/s
      - name: h
        label: Height
        min: 0
        max: 20
        step: 1
        start: 0
        unit: m
      outputs:
      - name: ke
        label: Kinetic energy
        expr: 0.5*2*v^2
        unit: J
      - name: pe
        label: Potential energy
        expr: 2*10*h
        unit: J
      goals:
      - prompt: Give it 100 J of kinetic energy and 100 J of potential energy.
        want:
          ke: 100
          pe: 100
        mistakes:
        - when:
            ke: 100
          say: Kinetic energy is right, but potential energy isn't 100 J yet.
        - when:
            pe: 100
          say: 'Potential energy is right, but kinetic energy isn''t 100 J yet. KE grows with v²: double the speed, four times the energy.'
    lesson:
      - teach: Energy is the capacity to do work. A moving cricket ball can knock over the stumps; a raised hammer can drive in a nail. Both can do work, so both have energy. Energy is measured in joules, like work.
        check:
          prompt: What is energy?
          options:
          - The capacity to do work
          - The force on an object
          - The speed of an object
          answer: The capacity to do work
          why: Anything that can do work has energy, measured in joules.
        ways:
        - style: real_world
          teach: A rolling bowling ball knocks the pins over; water raised in a tank turns a tap's flow into a fountain. Anything that can make a push move something has energy. Energy is the capacity to do work, measured in joules, just like work.
      - teach: 'Energy of motion is kinetic energy: KE = ½mv². The speed is squared, so it matters most. A 2 kg ball at 4 m/s has KE = ½ × 2 × 16 = 16 J. Double the speed to 8 m/s and KE becomes 64 J: four times as much.'
        picture:
          kind: bars
          bars:
          - label: 4 m/s
            value: 16
          - label: 8 m/s
            value: 64
          unit: J
          alt: 'A 2 kg ball: 16 J at 4 m/s, 64 J at 8 m/s. Twice the speed, four times the energy.'
        check:
          prompt: 'A ball''s speed is tripled. Its kinetic energy becomes:'
          options:
          - Nine times as much
          - Three times as much
          - Six times as much
          answer: Nine times as much
          why: KE depends on v², and 3² = 9.
        ways:
        - style: step_by_step
          teach: 'Step 1: write the mass m and the speed v. Step 2: square the speed. Step 3: multiply by the mass and halve it: KE = ½mv². Because the speed is squared, double speed gives four times the energy; triple gives nine times.'
      - teach: 'Energy due to height is gravitational potential energy: PE = mgh. Lifting a body stores the work you did in it. A 3 kg coconut 10 m up a tree has PE = 3 × 10 × 10 = 300 J (g = 10 m/s²). Double the height, double the PE.'
        check:
          prompt: A 1 kg book sits on a shelf 2 m high. What is its PE? (g = 10 m/s²)
          options:
          - 20 J
          - 2 J
          - 12 J
          answer: 20 J
          why: PE = mgh = 1 × 10 × 2 = 20 J.
        ways:
        - style: step_by_step
          teach: 'Step 1: write the mass in kg. Step 2: multiply by g = 10 m/s². Step 3: multiply by the height in metres. That is PE = mgh in joules. Double the height, double the stored energy.'
      - teach: 'Energy has many forms: elastic (a stretched rubber band, a wound spring), chemical (food, fuel, a battery), heat, light, sound and electrical. Machines and living things change energy from one form to another.'
        check:
          prompt: What kind of energy does a stretched catapult rubber store?
          options:
          - Elastic potential energy
          - Kinetic energy
          - Sound energy
          answer: Elastic potential energy
          why: It is stored by the stretch, and released when the rubber is let go.
        ways:
        - style: real_world
          teach: 'Look around: a wound-up toy car stores energy in its spring, food stores chemical energy, a mobile battery stores electrical energy, and a stretched catapult stores elastic energy. Machines and our bodies keep changing energy from one form to another.'
    items:
      - prompt: "What is the kinetic energy of a 2 kg ball moving at 3 m/s, in J?"
        answer: "9"
        check: "Rational(1, 2)*2*3**2"
        difficulty: 1
        hints: ["KE = ½mv²."]
        solution: "½ × 2 × 9 = 9 J"
        mistakes: {"3": forgot_square, "18": forgot_half}
      - prompt: "What is the potential energy of a 5 kg box on a shelf 2 m high? (g = 10 m/s²) Give it in J."
        answer: "100"
        check: "5*10*2"
        difficulty: 1
        hints: ["PE = mgh."]
        solution: "5 × 10 × 2 = 100 J"
        mistakes: {"10": pe_mgh}
      - prompt: "A car's speed is doubled. Its kinetic energy becomes:"
        options: ["Four times as much", "Twice as much", "Half as much", "The same"]
        answer: "Four times as much"
        difficulty: 2
        hints: ["Speed is squared in ½mv²."]
        solution: "2² = 4, so KE becomes four times as much."
        mistakes: {"Twice as much": ke_speed_squared}
      - prompt: "Which has potential energy because of its position?"
        options: ["Water stored in a dam", "A rolling football", "A moving bus", "Wind blowing"]
        answer: "Water stored in a dam"
        difficulty: 1
        hints: ["Energy because of height."]
        solution: "Water held high in a dam has gravitational potential energy."
        mistakes: {"A rolling football": "pe_position", "A moving bus": "pe_position"}
      - prompt: "A 1000 kg car moves at 20 m/s. What is its kinetic energy, in J?"
        answer: "200000"
        check: "Rational(1, 2)*1000*20**2"
        difficulty: 2
        hints: ["½ × 1000 × 400."]
        solution: "½ × 1000 × 400 = 200,000 J"
        mistakes: {"10000": forgot_square, "400000": forgot_half}
      - prompt: "A 0.5 kg ball has 25 J of kinetic energy. What is its speed, in m/s?"
        answer: "10"
        check: "sqrt(2*25/Rational(1, 2))"
        difficulty: 3
        hints: ["25 = ½ × 0.5 × v².", "v² = 100."]
        solution: "Step 1: v² = 2 × 25 ÷ 0.5 = 100. Step 2: v = 10 m/s."
        mistakes: {"100": forgot_square}
      - prompt: "A 2 kg ball moving at 6 m/s has the same kinetic energy as an 8 kg ball. How fast is the 8 kg ball moving, in m/s?"
        answer: "3"
        check: "sqrt(2*(0.5*2*6**2)/8)"
        difficulty: 3
        hints: ["KE of the 2 kg ball = ½ × 2 × 36.", "½ × 8 × v² = 36."]
        solution: "Step 1: KE = 36 J. Step 2: 4v² = 36, so v² = 9 and v = 3 m/s."
        mistakes: {"1.5": ke_speed_squared, "9": forgot_square, "24": ke_speed_squared}
      - prompt: "How high must a 2 kg ball be lifted so that its potential energy equals the kinetic energy it would have moving at 10 m/s? (g = 10 m/s²) Give the height in m."
        answer: "5"
        check: "0.5*2*10**2/(2*10)"
        difficulty: 3
        hints: ["KE = ½ × 2 × 10².", "mgh = 100, so h = 100 ÷ 20."]
        solution: "Step 1: KE = 100 J. Step 2: 2 × 10 × h = 100. Step 3: h = 5 m."
        mistakes: {"10": forgot_half, "50": pe_mgh, "0.5": forgot_square}
      - prompt: "An archer pulls back a bowstring and lets the arrow fly. Which energy change happens?"
        options: ["Elastic potential energy → kinetic energy", "Kinetic energy → elastic potential energy", "Chemical energy → sound energy", "Heat energy → kinetic energy"]
        answer: "Elastic potential energy → kinetic energy"
        difficulty: 2
        hints: ["The stretched bow stores energy.", "The flying arrow has energy of motion."]
        solution: "Step 1: Pulling back stores elastic potential energy in the bow. Step 2: On release it becomes the arrow's kinetic energy."
        mistakes: {"Kinetic energy → elastic potential energy": elastic_store, "Chemical energy → sound energy": elastic_store, "Heat energy → kinetic energy": elastic_store}
      - prompt: A 60 kg runner moves at 5 m/s. What is her kinetic energy, in J?
        answer: '750'
        check: 0.5*60*5**2
        difficulty: 1
        hints:
        - KE = ½mv².
        - Square the speed first.
        solution: 'Step 1: v² = 25. Step 2: KE = ½ × 60 × 25. Step 3: KE = 750 J.'
        mistakes:
          '150': ke_speed_squared
          '1500': ke_speed_squared
      - prompt: A 4 kg pot is kept on a shelf 2.5 m high. What is its potential energy, in J? (g = 10 m/s²)
        answer: '100'
        check: 4*10*2.5
        difficulty: 1
        hints:
        - PE = mgh.
        - Multiply mass, g and height.
        solution: 'Step 1: m = 4 kg, g = 10 m/s², h = 2.5 m. Step 2: PE = 4 × 10 × 2.5. Step 3: PE = 100 J.'
        mistakes:
          '10': pe_mgh
      - prompt: Which of these has chemical energy stored in it?
        options:
        - A torch battery
        - A rolling ball
        - A stretched spring
        - A ringing bell
        answer: A torch battery
        difficulty: 1
        hints:
        - Chemical energy is stored in substances and released by reactions.
        - Food, fuel and cells store this kind.
        solution: 'Step 1: A rolling ball has kinetic energy. Step 2: A stretched spring has elastic energy; a bell gives sound. Step 3: A battery stores chemical energy that becomes electrical energy.'
        mistakes:
          A stretched spring: elastic_store
      - prompt: A box on a shelf has 60 J of potential energy. It is moved to a shelf twice as high. What is its potential energy now, in J?
        answer: '120'
        check: 60*2
        difficulty: 2
        hints:
        - 'PE = mgh: how does PE change when only h changes?'
        - PE is proportional to height.
        solution: 'Step 1: m and g stay the same. Step 2: h is doubled. Step 3: PE doubles to 120 J.'
        mistakes:
          '240': ke_speed_squared
      - prompt: A ball's kinetic energy is 40 J. Its speed is halved. What is its kinetic energy now, in J?
        answer: '10'
        check: 40/4
        difficulty: 3
        hints:
        - KE depends on the square of the speed.
        - What is (½)²?
        solution: 'Step 1: KE ∝ v². Step 2: Halving v multiplies KE by (½)² = ¼. Step 3: KE = 40 ÷ 4 = 10 J.'
        mistakes:
          '20': ke_speed_squared
      - prompt: Which object has BOTH kinetic and potential energy?
        options:
        - A bird flying above a tree
        - A car parked on a hilltop
        - A ball rolling on the ground
        - A book on a table
        answer: A bird flying above a tree
        difficulty: 2
        hints:
        - Kinetic energy needs motion; potential energy needs height.
        - Which one is both moving and high up?
        solution: 'Step 1: The parked car and the book have only PE (they are not moving). Step 2: The rolling ball has KE but no height. Step 3: The flying bird is both moving and high up.'
        mistakes:
          A car parked on a hilltop: pe_position

  - code: phy9.energy.conservation
    title: Conservation of energy and power
    after: [phy9.energy.kinetic_potential]
    notes: |
      Energy can neither be created nor destroyed; it changes from one form to another (law of
      conservation of energy). For a freely falling body, PE + KE stays constant (ignoring air
      resistance). Power is the rate of doing work: P = W ÷ t, unit watt (1 W = 1 J/s); 1 kW = 1000 W.
      Commercial unit of energy: 1 kWh = 3.6 × 10⁶ J (one 'unit' on the electricity bill).
    explanations:
      text: "Drop a 1 kg stone from 20 m. At the top it has PE = 1 × 10 × 20 = 200 J and no KE. Just before it lands it has no PE and 200 J of KE. Halfway down: 100 J of each. The total is always 200 J. Power tells you how fast work is done: a motor lifting the same load in half the time has twice the power."
      visual: "Draw a tall stack of 200 coins at the top labelled PE. As the stone falls, coins move one by one into a KE stack. The total never changes."
      step_by_step: "A 100 W bulb runs for 10 hours. Step 1: Power = 0.1 kW. Step 2: Energy = 0.1 × 10 = 1 kWh. Step 3: That is 1 unit of electricity."
      real_world: "Hydroelectric dams in Idukki turn the potential energy of stored water into kinetic energy and then into electrical energy."
    activity:
      type: formula
      prompt: 'A ball dropped from height h: all its PE becomes KE, so v = √(2gh) (g = 10 m/s²).'
      inputs:
      - name: h
        label: Height
        min: 0
        max: 45
        step: 1
        start: 0
        unit: m
      outputs:
      - name: v
        label: Speed at the bottom
        expr: sqrt(2*10*h)
        unit: m/s
        places: 1
      goals:
      - prompt: Hit the ground at 10 m/s.
        want:
          v: 10
        mistakes:
        - when:
            h: 10
          say: 'From 10 m it lands at about 14 m/s. The speed doesn''t grow as fast as the height: v² is what doubles when h doubles.'
      - prompt: Hit the ground at 30 m/s.
        want:
          v: 30
        mistakes:
        - when:
            h: 15
          say: From 15 m it lands at about 17 m/s, not 30. To go 3 times as fast you need 9 times the height, because v² grows with h.
    lesson:
      - teach: Energy never disappears and is never made from nothing. It only changes form. This is the law of conservation of energy. In a torch, chemical energy in the cell becomes electrical energy, then light and heat.
        check:
          prompt: What does the law of conservation of energy say?
          options:
          - Energy cannot be created or destroyed, only changed in form
          - Energy is used up when work is done
          - Machines create energy
          answer: Energy cannot be created or destroyed, only changed in form
          why: Energy only changes from one form to another; the total stays the same.
        ways:
        - style: real_world
          teach: Switch on a torch. The cell's chemical energy becomes electricity, then light, and the bulb gets warm too. Add up all of it and nothing has been lost or gained. Energy only changes form; it is never created or destroyed.
      - teach: Watch a falling coconut. At the top it has only PE. As it falls, PE turns into KE. Just before it lands, it has only KE. Ignoring air, PE + KE stays the same all the way down. A 2 kg coconut dropped from 10 m has 200 J at the top, so 200 J of KE just before landing.
        picture:
          kind: bars
          bars:
          - label: 'Top: PE'
            value: 200
          - label: 'Half way: PE'
            value: 100
          - label: 'Half way: KE'
            value: 100
          - label: 'Bottom: KE'
            value: 200
          unit: J
          alt: 'A 2 kg coconut from 10 m: 200 J of PE at the top, 100 J PE and 100 J KE half way, 200 J of KE at the bottom.'
        check:
          prompt: A falling stone has 50 J of PE and 30 J of KE at one point. What is its total energy?
          options:
          - 80 J
          - 20 J
          - 50 J
          answer: 80 J
          why: Total = PE + KE = 50 + 30 = 80 J, and it stays 80 J as it falls.
        ways:
        - style: step_by_step
          teach: 'Step 1: at the top of the fall, all the energy is PE = mgh. Step 2: as it falls, PE decreases and KE increases by the same amount. Step 3: at any point, PE + KE equals the starting total. Step 4: just before landing it is all KE.'
      - teach: 'Power tells how fast work is done: P = W ÷ t, measured in watts (1 W = 1 J/s). Two people climbing the same stairs do the same work, but the one who climbs faster has more power. 1 kW = 1000 W.'
        check:
          prompt: A machine does 1000 J of work in 4 s. What is its power?
          options:
          - 250 W
          - 4000 W
          - 1004 W
          answer: 250 W
          why: P = W ÷ t = 1000 ÷ 4 = 250 W.
        ways:
        - style: step_by_step
          teach: 'Step 1: find the work done, in joules. Step 2: find the time taken, in seconds. Step 3: divide: P = W ÷ t, in watts. Faster for the same work means more power.'
      - teach: The electricity bill counts energy in kilowatt-hours (kWh), called units. Power in kW × time in hours = kWh. A 1 kW iron used for 2 hours uses 2 units. 1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J.
        check:
          prompt: A 500 W mixer runs for 2 hours. How many units does it use?
          options:
          - 1 unit
          - 1000 units
          - 250 units
          answer: 1 unit
          why: 500 W = 0.5 kW, and 0.5 × 2 = 1 kWh.
        ways:
        - style: step_by_step
          teach: 'Step 1: change the power to kW: 500 W = 0.5 kW. Step 2: write the time in hours. Step 3: multiply kW × hours: that is kWh, the ''units'' on the electricity bill.'
    items:
      - prompt: "A 1 kg stone is dropped from 20 m. What is its kinetic energy just before hitting the ground, in J? (g = 10 m/s²; ignore air)"
        answer: "200"
        check: "1*10*20"
        difficulty: 1
        hints: ["All its PE becomes KE."]
        solution: "PE at the top = 1 × 10 × 20 = 200 J, all turned into KE."
        mistakes: {"0": energy_conserved, "20": pe_mgh}
      - prompt: "A motor does 6000 J of work in 30 s. What is its power, in W?"
        answer: "200"
        check: "6000/30"
        difficulty: 1
        hints: ["P = W ÷ t."]
        solution: "6000 ÷ 30 = 200 W"
        mistakes: {"180000": power_per_time}
      - prompt: "A 100 W bulb is used for 10 hours. How many units (kWh) of electricity does it use?"
        answer: "1"
        check: "Rational(100, 1000)*10"
        difficulty: 2
        hints: ["100 W = 0.1 kW."]
        solution: "0.1 kW × 10 h = 1 kWh"
        mistakes: {"1000": kw_to_w}
      - prompt: "A 2 kg ball is dropped from 10 m. What is its kinetic energy when it has fallen halfway, in J? (g = 10 m/s²)"
        answer: "100"
        check: "2*10*10 - 2*10*5"
        difficulty: 2
        hints: ["Energy is conserved. At halfway, how much of the starting potential energy has become kinetic energy?"]
        solution: "Step 1: Total = 2 × 10 × 10 = 200 J. Step 2: PE at 5 m = 100 J. Step 3: KE = 100 J."
        mistakes: {"200": energy_conserved}
      - prompt: "Which energy change happens in a hydroelectric power station?"
        options: ["Potential energy of water → kinetic energy → electrical energy", "Chemical energy → heat → electrical energy", "Light energy → electrical energy", "Electrical energy → potential energy"]
        answer: "Potential energy of water → kinetic energy → electrical energy"
        difficulty: 2
        hints: ["Water falls from a height and turns turbines."]
        solution: "Stored water (PE) falls, moving fast (KE), turning turbines and generators (electrical)."
        mistakes: {"Chemical energy → heat → electrical energy": "hydro_chain", "Light energy → electrical energy": "hydro_chain"}
      - prompt: "A 50 kg girl climbs 6 m of stairs in 15 s. What is her power, in W? (g = 10 m/s²)"
        answer: "200"
        check: "50*10*6/15"
        difficulty: 3
        hints: ["Work = mgh = 3000 J.", "Power = work ÷ time."]
        solution: "Step 1: W = 50 × 10 × 6 = 3000 J. Step 2: P = 3000 ÷ 15 = 200 W."
        mistakes: {"20": pe_mgh, "45000": power_per_time}
      - prompt: "How many joules are in 1 kWh?"
        answer: "3600000"
        check: "1000*3600"
        difficulty: 3
        hints: ["1 kW = 1000 W and 1 h = 3600 s."]
        solution: "1000 × 3600 = 3.6 × 10⁶ J"
        mistakes: {"1000": kw_to_w, "3600": kw_to_w}
      - prompt: "A ball is dropped from 20 m. How fast is it moving just before it hits the ground, in m/s? (g = 10 m/s²; ignore air resistance)"
        answer: "20"
        check: "sqrt(2*10*20)"
        difficulty: 2
        hints: ["All the PE (mgh) becomes KE (½mv²).", "The mass cancels: v² = 2gh."]
        solution: "Step 1: mgh = ½mv², so v² = 2 × 10 × 20 = 400. Step 2: v = 20 m/s."
        mistakes: {"400": forgot_square, "200": energy_conserved, "14.1": forgot_half}
      - prompt: "A pump lifts 600 kg of water through a height of 15 m in 1 minute. What is its power, in W? (g = 10 m/s²)"
        answer: "1500"
        check: "600*10*15/60"
        difficulty: 3
        hints: ["Work = mgh = 600 × 10 × 15.", "Divide by the time in seconds."]
        solution: "Step 1: Work = 90,000 J. Step 2: Power = 90,000 ÷ 60 = 1500 W."
        mistakes: {"90000": power_per_time, "150": pe_mgh, "9000": pe_mgh}
      - prompt: "A 2 kW heater is used for 30 minutes every day for 30 days. Electricity costs ₹6 a unit. What is the cost, in rupees?"
        answer: "180"
        check: "2*0.5*30*6"
        difficulty: 3
        hints: ["Energy per day = 2 kW × 0.5 h.", "Units in 30 days, then × ₹6."]
        solution: "Step 1: Per day: 2 × 0.5 = 1 kWh. Step 2: 30 days: 30 kWh. Step 3: Cost = 30 × 6 = ₹180."
        mistakes: {"10800": minutes_to_hours, "6": minutes_to_hours, "360": minutes_to_hours}
      - prompt: A machine does 4500 J of work in 15 s. What is its power, in W?
        answer: '300'
        check: 4500/15
        difficulty: 1
        hints:
        - Power is work done per second.
        - Divide the work by the time.
        solution: 'Step 1: P = W ÷ t. Step 2: P = 4500 ÷ 15. Step 3: P = 300 W.'
        mistakes:
          '67500': power_per_time
      - prompt: Which energy change happens when you switch on an electric fan?
        options:
        - Electrical energy → kinetic energy
        - Kinetic energy → electrical energy
        - Chemical energy → light energy
        - Heat energy → electrical energy
        answer: Electrical energy → kinetic energy
        difficulty: 1
        hints:
        - What does the fan take in from the socket?
        - What does it give out as its blades turn?
        solution: 'Step 1: The fan takes in electrical energy. Step 2: Its motor turns the blades. Step 3: Electrical energy becomes kinetic energy (with a little heat and sound).'
        mistakes:
          Kinetic energy → electrical energy: energy_conserved
      - prompt: A 3 kg stone falls from 12 m. When it is 4 m above the ground, what is its kinetic energy, in J? (g = 10 m/s²; ignore air)
        answer: '240'
        check: 3*10*(12-4)
        difficulty: 2
        hints:
        - Total energy at the top is all PE.
        - KE gained = PE lost as it falls from 12 m to 4 m.
        solution: 'Step 1: PE at the top = 3 × 10 × 12 = 360 J. Step 2: PE at 4 m = 3 × 10 × 4 = 120 J. Step 3: KE = 360 − 120 = 240 J.'
        mistakes:
          '120': energy_conserved
          '360': energy_conserved
      - prompt: A 1500 W water heater runs for 2 hours. How many units (kWh) of electricity does it use?
        answer: '3'
        check: 1.5*2
        difficulty: 2
        hints:
        - Change watts to kilowatts first.
        - Units = kW × hours.
        solution: 'Step 1: 1500 W = 1.5 kW. Step 2: Units = 1.5 × 2. Step 3: = 3 kWh.'
        mistakes:
          '3000': kw_to_w
      - prompt: Two girls of the same mass climb the same flight of stairs. Asha takes 10 s and Meena takes 20 s. Which is true?
        options:
        - They do the same work, but Asha has more power
        - Asha does more work
        - Meena has more power
        - They have the same power
        answer: They do the same work, but Asha has more power
        difficulty: 3
        hints:
        - 'Work against gravity is mgh: is it the same for both?'
        - Power = work ÷ time.
        solution: 'Step 1: Same mass, same height, so the same work mgh. Step 2: Asha takes less time. Step 3: Same work in less time means more power.'
        mistakes:
          Asha does more work: power_per_time
