# Class 9 Physics, chapter 2. Format: content/README.md.
subject: phy
chapter: 2
title: Equations of Motion

tips:
  round_trip_zero: "Think of a trip that ends exactly where it started. Which quantity looks only at the start and end points, not the path?"
  displacement_round: "Displacement only cares where you start and where you finish. Draw the path and join start to finish with a straight line."
  average_of_speeds: "Average speed is total distance ÷ total time. Find how long each part took; don't just average the two speeds."
  which_equation: "List what you know (u, v, a, t, s) and what you want. Pick the equation that has exactly those."
  area_under_both: "Split the velocity–time graph into shapes, find the area of each, then add."
  distance_not_displacement: "Displacement is the straight-line change in position, with direction. Distance is the whole path travelled."
  speed_time_swapped: "Speed = distance ÷ time. Divide the distance by the time, not the other way round."
  forgot_initial_velocity: "Start from the initial velocity u. Speed gained is added to what the body already had."
  acceleration_not_change: "Acceleration is change in velocity ÷ time taken, not just the change in velocity."
  forgot_half: "In s = ut + ½at², the at² term is halved."
  forgot_square: "In s = ut + ½at² the time is squared, and in v² = u² + 2as the velocities are squared."
  unit_kmh: "Convert km/h to m/s by multiplying by 5/18 (1000 m ÷ 3600 s)."
  retardation_sign: "When a body slows down, its acceleration is negative."
  graph_slope_area: "On a velocity–time graph, the steepness tells you how fast velocity changes. The area under the line gives distance; for a triangle use ½ × base × height."
  acceleration_unit: "Acceleration is change of velocity per second. Velocity is in m/s, so divide that by seconds again."
  horizontal_rest: "A flat line on a distance–time graph means distance isn't changing: the body is still."
  v_from_rest: "From rest, v = a × t."

concepts:
  - code: phy9.motion.speed_velocity
    title: Distance, displacement, speed and velocity
    notes: |
      Distance is the length of path travelled (scalar). Displacement is the shortest distance from
      start to finish, with direction (vector). Speed = distance ÷ time; velocity = displacement ÷
      time. Average speed = total distance ÷ total time. Unit m/s; 1 km/h = 5/18 m/s. Uniform motion
      covers equal distances in equal times.
    explanations:
      text: "Walk 3 m east and then 4 m north. You have walked 7 m (distance), but you are only 5 m from where you started (displacement, towards the north-east). If this took 2 s, your average speed is 7 ÷ 2 = 3.5 m/s, but your average velocity is 5 ÷ 2 = 2.5 m/s."
      visual: "Draw the path as a bent line from start to finish and then a straight arrow from start to finish. The bent line's length is the distance; the arrow is the displacement."
      step_by_step: "A bus covers 120 km in 2 h, then 60 km in 1 h. Step 1: Total distance = 180 km. Step 2: Total time = 3 h. Step 3: Average speed = 180 ÷ 3 = 60 km/h. Step 4: In m/s: 60 × 5/18 = 16.7 m/s."
      real_world: "A runner on a 400 m track who finishes one lap where they started has run 400 m, but their displacement is zero."
    activity:
      type: formula
      prompt: Speed = distance ÷ time.
      inputs:
      - name: s
        label: Distance
        min: 0
        max: 200
        step: 10
        start: 0
        unit: m
      - name: t
        label: Time
        min: 1
        max: 20
        step: 1
        start: 1
        unit: s
      outputs:
      - name: v
        label: Speed
        expr: s/t
        unit: m/s
        places: 1
      goals:
      - prompt: Run at 20 m/s for 5 s.
        want:
          v: 20
          t: 5
        mistakes:
        - when:
            s: 20
          say: 'You set the distance to 20 m: that''s the speed, not the distance. Going 20 m every second for 5 seconds covers more than that.'
      - prompt: Cover 150 m at 10 m/s.
        want:
          s: 150
          v: 10
        mistakes:
        - when:
            t: 10
            s: 150
          say: 'Covering 150 m in 10 s means going 15 m every second: too fast. At 10 m/s, 150 m takes longer.'
    lesson:
      - teach: 'Distance is how much ground you cover along your path. Displacement is the straight-line gap from where you started to where you ended, with a direction. Walk 3 m east then 4 m north: distance 7 m, but displacement only 5 m (the straight line back to the start).'
        picture:
          kind: flow
          steps:
          - 3 m east
          - then 4 m north
          - 'distance walked: 7 m'
          - 'displacement: √(3² + 4²) = 5 m'
          alt: Walking 3 m east and 4 m north covers 7 m but ends only 5 m from the start.
        check:
          prompt: You run one full lap of a 400 m track and stop where you started. What is your displacement?
          options:
          - 0 m
          - 400 m
          - 200 m
          answer: 0 m
          why: You end where you began, so the straight-line gap is zero, even though you ran 400 m.
        ways:
        - style: real_world
          teach: 'An autorickshaw takes you round the town and back home. The meter counts every metre it drove: that is distance. But from home to home, the straight-line gap is zero: that is displacement. Displacement only cares about where you started and ended, and in which direction.'
      - teach: 'Speed = distance ÷ time. Velocity = displacement ÷ time, so it also has a direction. Both are measured in m/s. To change km/h into m/s, multiply by 5/18: 72 km/h = 72 × 5/18 = 20 m/s.'
        check:
          prompt: What is 36 km/h in m/s?
          options:
          - 10 m/s
          - 129.6 m/s
          - 36 m/s
          answer: 10 m/s
          why: 36 × 5/18 = 10. (1 km = 1000 m and 1 h = 3600 s.)
        ways:
        - style: step_by_step
          teach: 'Step 1: for speed, divide distance by time. Step 2: for velocity, divide displacement by time and give the direction. Step 3: to change km/h into m/s, multiply by 1000 (metres) and divide by 3600 (seconds), which is the same as × 5/18.'
      - teach: 'Average speed = total distance ÷ total time. It is not always the average of the two speeds: going 10 km at 20 km/h (½ h) and back at 10 km/h (1 h) is 20 km in 1.5 h, which is 13.3 km/h, not 15.'
        check:
          prompt: A bus goes 100 km in 2 h, then 50 km in 1 h. What is its average speed?
          options:
          - 50 km/h
          - 37.5 km/h
          - 75 km/h
          answer: 50 km/h
          why: 'Total 150 km in 3 h: 150 ÷ 3 = 50 km/h.'
        ways:
        - style: step_by_step
          teach: 'Step 1: add all the distances of the trip. Step 2: add all the times. Step 3: divide total distance by total time. Don''t just average the two speeds: the slower part takes longer, so it counts for more.'
    items:
      - prompt: "A boy walks 3 m east and then 4 m north. What is his displacement, in m?"
        answer: "5"
        check: "sqrt(3**2 + 4**2)"
        difficulty: 1
        hints: ["Straight line from start to finish: a right triangle."]
        solution: "√(3² + 4²) = √25 = 5 m, towards the north-east."
        mistakes: {"7": distance_not_displacement}
      - prompt: "A car travels 150 m in 10 s. What is its average speed, in m/s?"
        answer: "15"
        check: "150/10"
        difficulty: 1
        hints: ["Speed = distance ÷ time."]
        solution: "150 ÷ 10 = 15 m/s"
        mistakes: {"1/15": speed_time_swapped, "1500": speed_time_swapped}
      - prompt: "An athlete runs one full lap of a 400 m track and stops at the starting line. What is the displacement, in m?"
        answer: "0"
        check: "0"
        difficulty: 1
        hints: ["Where did she finish compared with where she started?"]
        solution: "She ends where she began, so displacement = 0 m (the distance is 400 m)."
        mistakes: {"400": distance_not_displacement}
      - prompt: "A train moves at 72 km/h. What is its speed in m/s?"
        answer: "20"
        check: "72*Rational(5, 18)"
        difficulty: 2
        hints: ["Multiply km/h by 5/18."]
        solution: "72 × 5/18 = 20 m/s"
        mistakes: {"72": unit_kmh}
      - prompt: "A bus covers 120 km in 2 h and then 60 km in 1 h. What is its average speed, in km/h?"
        answer: "60"
        check: "(120 + 60)/(2 + 1)"
        difficulty: 2
        hints: ["Total distance ÷ total time."]
        solution: "Step 1: Total distance 180 km. Step 2: Total time 3 h. Step 3: 180 ÷ 3 = 60 km/h."
        mistakes: {"90": "average_speed_total", "180": "average_speed_total"}
      - prompt: "A cyclist goes 10 km at 20 km/h and returns the same 10 km at 10 km/h. What is the average speed for the whole trip, in km/h?"
        answer: "40/3"
        check: "20/(Rational(10, 20) + Rational(10, 10))"
        difficulty: 3
        hints: ["Find the time for each half.", "Total distance is 20 km."]
        solution: "Step 1: Times: 10 ÷ 20 = 0.5 h and 10 ÷ 10 = 1 h. Step 2: Total time 1.5 h. Step 3: 20 ÷ 1.5 = 40/3 ≈ 13.3 km/h (not 15)."
        mistakes: {"15": speed_time_swapped}
      - prompt: "An athlete runs half a lap of a circular track of radius 35 m. Using π ≈ 22/7, what is the size of the displacement, in m?"
        answer: "70"
        check: "2*35"
        difficulty: 3
        hints: ["Where does the athlete end up after half a lap?", "Start and finish are at opposite ends of a diameter."]
        solution: "Step 1: After half a lap the athlete is directly across the circle. Step 2: Displacement = diameter = 2 × 35 = 70 m (the distance run is 110 m)."
        mistakes: {"110": displacement_round, "0": displacement_round, "35": displacement_round}
      - prompt: "A car goes 30 km at 60 km/h and then 30 km at 30 km/h. What is its average speed for the whole trip, in km/h?"
        answer: "40"
        check: "60/(30/60 + 30/30)"
        difficulty: 3
        hints: ["How long does each part take?", "Total distance 60 km ÷ total time."]
        solution: "Step 1: First part takes 0.5 h, second part 1 h. Step 2: Total time = 1.5 h. Step 3: Average speed = 60 ÷ 1.5 = 40 km/h."
        mistakes: {"45": average_of_speeds, "90": speed_time_swapped}
      - prompt: "A bus travels at 54 km/h for 10 minutes. How far does it go, in m?"
        answer: "9000"
        check: "54*5/18*10*60"
        difficulty: 2
        hints: ["Change 54 km/h to m/s.", "Change 10 minutes to seconds."]
        solution: "Step 1: 54 km/h = 15 m/s. Step 2: 10 min = 600 s. Step 3: Distance = 15 × 600 = 9000 m."
        mistakes: {"540": unit_kmh, "150": unit_kmh}
      - prompt: A girl walks 6 m north and then 8 m east. What is her displacement, in m?
        answer: '10'
        check: sqrt(6**2 + 8**2)
        difficulty: 1
        hints:
        - Displacement is the straight line from start to finish.
        - The two walks make a right angle.
        solution: 'Step 1: The walks are at right angles. Step 2: √(6² + 8²) = √100. Step 3: = 10 m.'
        mistakes:
          '14': distance_not_displacement
      - prompt: A runner covers 200 m in 25 s. What is the runner's average speed, in m/s?
        answer: '8'
        check: 200/25
        difficulty: 1
        hints:
        - Speed = distance ÷ time.
        - 200 ÷ 25.
        solution: 'Step 1: Speed = distance ÷ time. Step 2: 200 ÷ 25. Step 3: = 8 m/s.'
        mistakes:
          '0.125': speed_time_swapped
          '5000': speed_time_swapped
      - prompt: A car moves at 90 km/h. What is its speed in m/s?
        answer: '25'
        check: 90*5/18
        difficulty: 2
        hints:
        - Multiply km/h by 5/18.
        - 90 × 5 ÷ 18.
        solution: 'Step 1: 1 km/h = 5/18 m/s. Step 2: 90 × 5/18. Step 3: = 25 m/s.'
        mistakes:
          '324': unit_kmh
      - prompt: Which of these can be zero even when a body has moved?
        options:
        - Displacement
        - Distance
        - Time taken
        - Speed while moving
        answer: Displacement
        difficulty: 2
        hints:
        - Think of a round trip.
        - Which one only cares about the start and end points?
        solution: 'Step 1: On a round trip the body returns to its start. Step 2: Distance is still more than zero. Step 3: But displacement is zero.'
        mistakes:
          Distance: round_trip_zero
      - prompt: A cyclist rides 12 km at 12 km/h and then 12 km at 24 km/h. What is the average speed for the whole ride, in km/h?
        answer: '16'
        check: 24/(12/12 + 12/24)
        difficulty: 3
        hints:
        - Find the time for each part.
        - '1 h and 0.5 h: 24 km in 1.5 h.'
        solution: 'Step 1: First part takes 1 h, second 0.5 h. Step 2: Total 24 km in 1.5 h. Step 3: 24 ÷ 1.5 = 16 km/h.'
        mistakes:
          '18': average_of_speeds
      - prompt: A boy goes round half of a circular park of radius 21 m. Using π ≈ 22/7, how far does he walk, in m?
        answer: '66'
        check: 22/7*21
        difficulty: 3
        hints:
        - Half the circumference is πr.
        - 22/7 × 21.
        solution: 'Step 1: Half circumference = πr. Step 2: 22/7 × 21 = 66. Step 3: He walks 66 m (his displacement is the diameter, 42 m).'
        mistakes:
          '42': displacement_round

  - code: phy9.motion.acceleration
    title: Acceleration
    after: [phy9.motion.speed_velocity]
    notes: |
      Acceleration is the rate of change of velocity: a = (v − u) ÷ t, unit m/s². u is the initial
      and v the final velocity. Slowing down gives negative acceleration (retardation). Uniform
      acceleration means the velocity changes by equal amounts in equal times.
    explanations:
      text: "A scooter starts from rest and reaches 10 m/s in 5 s. Each second its velocity rises by 2 m/s: its acceleration is (10 − 0) ÷ 5 = 2 m/s². When brakes bring a car from 20 m/s to rest in 4 s, the acceleration is (0 − 20) ÷ 4 = −5 m/s²."
      visual: "Write the velocity every second: 0, 2, 4, 6, 8, 10 m/s. It goes up by the same 2 each second: that steady jump is the acceleration."
      step_by_step: "A car speeds up from 10 m/s to 25 m/s in 5 s. Step 1: Change in velocity = 25 − 10 = 15 m/s. Step 2: Time = 5 s. Step 3: a = 15 ÷ 5 = 3 m/s²."
      real_world: "Car adverts boast '0 to 100 km/h in 8 seconds': a measure of acceleration."
    activity:
      type: formula
      prompt: Acceleration = change in velocity ÷ time.
      inputs:
      - name: u
        label: Starting velocity u
        min: 0
        max: 30
        step: 1
        start: 0
        unit: m/s
      - name: v
        label: Final velocity v
        min: 0
        max: 30
        step: 1
        start: 0
        unit: m/s
      - name: t
        label: Time
        min: 1
        max: 10
        step: 1
        start: 1
        unit: s
      outputs:
      - name: a
        label: Acceleration
        expr: (v-u)/t
        unit: m/s²
        places: 2
      goals:
      - prompt: Speed up at 2 m/s² for 5 s, starting from 10 m/s.
        want:
          a: 2
          t: 5
          u: 10
        mistakes:
        - when:
            a: 2
            u: 10
          say: Acceleration and start are right, but the time must be 5 s.
      - prompt: 'Now slow down: acceleration −3 m/s².'
        want:
          a: -3
        mistakes:
        - when:
            a: 3
          say: +3 m/s² means speeding up. Slowing down means the final velocity is less than the starting one, so v − u is negative.
    lesson:
      - teach: 'When velocity changes, the body is accelerating. Acceleration is how fast velocity changes: a = (v − u) ÷ t, where u is the starting velocity, v the final velocity and t the time. A scooter going from 0 to 10 m/s in 5 s has a = 10 ÷ 5 = 2 m/s².'
        check:
          prompt: A bike goes from 4 m/s to 16 m/s in 3 s. What is its acceleration?
          options:
          - 4 m/s²
          - 12 m/s²
          - 5.3 m/s²
          answer: 4 m/s²
          why: (16 − 4) ÷ 3 = 12 ÷ 3 = 4 m/s². The change, 12, is not yet the acceleration.
        ways:
        - style: step_by_step
          teach: 'Step 1: write the starting velocity u and the final velocity v. Step 2: subtract: v − u is the change in velocity. Step 3: divide by the time taken. That is the acceleration a, in m/s².'
      - teach: 'The unit m/s² means ''metres per second, every second''. 2 m/s² means the velocity goes up by 2 m/s each second: 0, 2, 4, 6… If it changes by equal amounts in equal times, the acceleration is uniform.'
        check:
          prompt: A body starts from rest with acceleration 3 m/s². What is its velocity after 4 s?
          options:
          - 12 m/s
          - 7 m/s
          - 0.75 m/s
          answer: 12 m/s
          why: 'It gains 3 m/s every second: 3 × 4 = 12 m/s.'
        ways:
        - style: real_world
          teach: 'Watch a bus speedometer as it pulls away: 0, 2, 4, 6 m/s, one reading every second. The speed goes up by 2 m/s every second: that is an acceleration of 2 m/s². Equal increases in equal times means uniform acceleration.'
      - teach: Slowing down gives a negative acceleration, also called retardation. A car braking from 20 m/s to 0 in 4 s has a = (0 − 20) ÷ 4 = −5 m/s². Change km/h to m/s before you calculate.
        check:
          prompt: A ball slows from 10 m/s to 4 m/s in 2 s. What is its acceleration?
          options:
          - −3 m/s²
          - 3 m/s²
          - −7 m/s²
          answer: −3 m/s²
          why: (4 − 10) ÷ 2 = −3 m/s². The minus sign shows it is slowing down.
        ways:
        - style: real_world
          teach: When a scooter brakes, its speed drops, so v is smaller than u and v − u is negative. A negative acceleration means slowing down, also called retardation. Always change km/h into m/s first, because the answer must be in m/s².
    items:
      - prompt: "A scooter starts from rest and reaches 10 m/s in 5 s. What is its acceleration, in m/s²?"
        answer: "2"
        check: "(10 - 0)/5"
        difficulty: 1
        hints: ["a = (v − u) ÷ t, with u = 0."]
        solution: "a = (10 − 0) ÷ 5 = 2 m/s²"
        mistakes: {"10": acceleration_not_change, "50": acceleration_not_change}
      - prompt: "A car speeds up from 10 m/s to 25 m/s in 5 s. What is its acceleration, in m/s²?"
        answer: "3"
        check: "(25 - 10)/5"
        difficulty: 1
        hints: ["Change in velocity first."]
        solution: "Step 1: 25 − 10 = 15 m/s. Step 2: 15 ÷ 5 = 3 m/s²."
        mistakes: {"5": forgot_initial_velocity, "15": acceleration_not_change}
      - prompt: "A car moving at 20 m/s brakes to rest in 4 s. What is its acceleration, in m/s²?"
        answer: "-5"
        check: "(0 - 20)/4"
        difficulty: 2
        hints: ["Final velocity is 0.", "Slowing down: the answer is negative."]
        solution: "a = (0 − 20) ÷ 4 = −5 m/s² (a retardation of 5 m/s²)."
        mistakes: {"5": retardation_sign}
      - prompt: "What is the SI unit of acceleration?"
        options: ["m/s²", "m/s", "m", "N"]
        answer: "m/s²"
        difficulty: 1
        hints: ["Velocity (m/s) divided by time (s)."]
        solution: "(m/s) ÷ s = m/s²"
        mistakes: {"m/s": "acceleration_unit", "N": "acceleration_unit"}
      - prompt: "A body moves with a uniform acceleration of 4 m/s² from rest. What is its velocity after 6 s, in m/s?"
        answer: "24"
        check: "0 + 4*6"
        difficulty: 2
        hints: ["Each second the velocity rises by 4 m/s."]
        solution: "v = 0 + 4 × 6 = 24 m/s"
        mistakes: {"10": "v_from_rest", "1.5": "v_from_rest"}
      - prompt: "A train slows uniformly from 72 km/h to 36 km/h in 10 s. What is its acceleration, in m/s²?"
        answer: "-1"
        check: "(36 - 72)*Rational(5, 18)/10"
        difficulty: 3
        hints: ["Convert to m/s: 72 km/h = 20 m/s, 36 km/h = 10 m/s."]
        solution: "Step 1: u = 20 m/s, v = 10 m/s. Step 2: a = (10 − 20) ÷ 10 = −1 m/s²."
        mistakes: {"-18/5": unit_kmh, "1": retardation_sign}
      - prompt: "A ball rolls up a slope at 6 m/s and comes back down. After 5 s it is rolling down at 4 m/s. Taking up the slope as positive, what is its acceleration, in m/s²?"
        answer: "-2"
        check: "(-4 - 6)/5"
        difficulty: 3
        hints: ["Down the slope is negative, so the final velocity is −4 m/s.", "a = (v − u) ÷ t."]
        solution: "Step 1: u = +6 m/s, v = −4 m/s. Step 2: a = (−4 − 6) ÷ 5 = −10 ÷ 5 = −2 m/s²."
        mistakes: {"-0.4": retardation_sign, "0.4": retardation_sign, "2": retardation_sign}
      - prompt: "A car accelerates uniformly at 1.5 m/s². How many seconds does it take to go from 36 km/h to 72 km/h?"
        answer: "20/3"
        check: "(72*5/18 - 36*5/18)/(3/2)"
        difficulty: 3
        hints: ["Change both speeds to m/s first.", "t = (v − u) ÷ a."]
        solution: "Step 1: 36 km/h = 10 m/s, 72 km/h = 20 m/s. Step 2: t = (20 − 10) ÷ 1.5 = 20/3 ≈ 6.7 s."
        mistakes: {"24": unit_kmh, "15": acceleration_not_change}
      - prompt: "A velocity–time graph is a straight line from 5 m/s at t = 0 to 25 m/s at t = 4 s. What is the acceleration, in m/s²?"
        answer: "5"
        check: "(25-5)/4"
        difficulty: 2
        hints: ["Acceleration is the slope of the v–t line.", "Change in velocity ÷ change in time."]
        solution: "Step 1: Change in velocity = 20 m/s. Step 2: a = 20 ÷ 4 = 5 m/s²."
        mistakes: {"6.25": forgot_initial_velocity, "20": acceleration_not_change, "60": graph_slope_area}
      - prompt: A cyclist speeds up from 2 m/s to 8 m/s in 3 s. What is the acceleration, in m/s²?
        answer: '2'
        check: (8 - 2)/3
        difficulty: 1
        hints:
        - a = (v − u) ÷ t.
        - (8 − 2) ÷ 3.
        solution: 'Step 1: v − u = 6 m/s. Step 2: t = 3 s. Step 3: a = 6 ÷ 3 = 2 m/s².'
        mistakes:
          '6': acceleration_not_change
          '3.333': forgot_initial_velocity
      - prompt: A car starts from rest and accelerates at 2.5 m/s². What is its velocity after 8 s, in m/s?
        answer: '20'
        check: 2.5*8
        difficulty: 1
        hints:
        - It gains 2.5 m/s every second.
        - 2.5 × 8.
        solution: 'Step 1: u = 0. Step 2: v = u + at = 0 + 2.5 × 8. Step 3: = 20 m/s.'
        mistakes:
          '3.2': speed_time_swapped
      - prompt: A bus moving at 15 m/s stops in 5 s. What is its acceleration, in m/s²?
        answer: '-3'
        check: (0 - 15)/5
        difficulty: 2
        hints:
        - Final velocity is 0.
        - (0 − 15) ÷ 5.
        solution: 'Step 1: v − u = 0 − 15 = −15. Step 2: t = 5 s. Step 3: a = −3 m/s².'
        mistakes:
          '3': retardation_sign
      - prompt: Which of these is a correct unit of acceleration?
        options:
        - m/s²
        - m/s
        - m²/s
        - s/m
        answer: m/s²
        difficulty: 2
        hints:
        - Acceleration is change in velocity ÷ time.
        - (m/s) ÷ s.
        solution: 'Step 1: Velocity is in m/s. Step 2: Divide by time in s. Step 3: (m/s) ÷ s = m/s².'
        mistakes:
          m/s: acceleration_unit
      - prompt: A train speeds up uniformly from 18 km/h to 54 km/h in 20 s. What is its acceleration, in m/s²?
        answer: '0.5'
        check: (54*5/18 - 18*5/18)/20
        difficulty: 3
        hints:
        - Change both speeds to m/s first.
        - 18 km/h = 5 m/s and 54 km/h = 15 m/s.
        solution: 'Step 1: u = 5 m/s, v = 15 m/s. Step 2: v − u = 10 m/s. Step 3: a = 10 ÷ 20 = 0.5 m/s².'
        mistakes:
          '1.8': unit_kmh
      - prompt: A car accelerates at 2 m/s² from 5 m/s. How many seconds does it take to reach 25 m/s?
        answer: '10'
        check: (25 - 5)/2
        difficulty: 3
        hints:
        - t = (v − u) ÷ a.
        - (25 − 5) ÷ 2.
        solution: 'Step 1: v − u = 20 m/s. Step 2: a = 2 m/s². Step 3: t = 20 ÷ 2 = 10 s.'
        mistakes:
          '12.5': forgot_initial_velocity

  - code: phy9.motion.equations
    title: The three equations of motion
    after: [phy9.motion.acceleration]
    notes: |
      For uniform acceleration a, initial velocity u, final velocity v, time t and displacement s:
      v = u + at; s = ut + ½at²; v² = u² + 2as. Choose the equation that uses the three known
      quantities and the one you want. For a body starting from rest, u = 0.
    explanations:
      text: "Three equations connect u, v, a, t and s. v = u + at: velocity after time t. s = ut + ½at²: distance covered in time t. v² = u² + 2as: velocity after covering a distance s, without needing the time. Pick the one that has what you know and what you want."
      visual: "Make a five-box table: u, v, a, t, s. Fill the three you know, mark the one you want with '?'. Choose the equation that leaves out the fifth box."
      step_by_step: "A car at 10 m/s accelerates at 2 m/s² for 5 s. How far does it go? Step 1: Know u = 10, a = 2, t = 5; want s. Step 2: s = ut + ½at². Step 3: s = 10 × 5 + ½ × 2 × 25 = 50 + 25 = 75 m."
      real_world: "Road safety engineers use v² = u² + 2as to work out how far a car travels while braking, and so how long the skid marks will be."
    activity:
      type: formula
      prompt: v = u + at and s = ut + ½at².
      inputs:
      - name: u
        label: u
        min: 0
        max: 20
        step: 1
        start: 0
        unit: m/s
      - name: a
        label: a
        min: 0
        max: 10
        step: 1
        start: 0
        unit: m/s²
      - name: t
        label: t
        min: 0
        max: 10
        step: 1
        start: 0
        unit: s
      outputs:
      - name: v
        label: Final velocity v
        expr: u+a*t
        unit: m/s
      - name: s
        label: Distance s
        expr: u*t+0.5*a*t^2
        unit: m
      goals:
      - prompt: Make v = 20 m/s and s = 75 m.
        want:
          v: 20
          s: 75
        hint: Pick a time first, then find u and a that give v = 20. Then check s.
        mistakes:
        - when:
            v: 20
          say: v is 20 m/s, but the distance is wrong. Different u, a and t can give the same final speed but cover different distances.
        - when:
            s: 75
          say: The distance is 75 m, but the final velocity isn't 20 m/s.
    lesson:
      - teach: 'For uniform acceleration there are three equations linking u (start velocity), v (final velocity), a (acceleration), t (time) and s (displacement). The first comes straight from a = (v − u) ÷ t: v = u + at.'
        check:
          prompt: u = 3 m/s, a = 2 m/s², t = 5 s. What is v?
          options:
          - 13 m/s
          - 10 m/s
          - 30 m/s
          answer: 13 m/s
          why: v = 3 + 2 × 5 = 13 m/s. Forgetting u gives 10.
        ways:
        - style: step_by_step
          teach: 'Step 1: acceleration means the velocity grows by a every second. Step 2: after t seconds it has grown by a × t. Step 3: add that to the starting velocity: v = u + at.'
      - teach: 'The second gives the distance: s = ut + ½at². A car starting from rest (u = 0) at 2 m/s² for 5 s goes ½ × 2 × 25 = 25 m. Don''t forget the ½, and square the time.'
        check:
          prompt: From rest, a = 4 m/s² for 3 s. How far?
          options:
          - 18 m
          - 36 m
          - 6 m
          answer: 18 m
          why: s = 0 + ½ × 4 × 3² = ½ × 4 × 9 = 18 m.
        ways:
        - style: step_by_step
          teach: 'Step 1: list u, a and t. Step 2: work out ut, the distance you''d go without speeding up. Step 3: work out ½ × a × t², the extra distance from speeding up. Step 4: add them. From rest, the first part is zero.'
      - teach: 'The third leaves out time: v² = u² + 2as. Use it when you know speeds and distance but not time. To pick an equation, list the three things you know and the one you want, then choose the equation that has exactly those four.'
        picture:
          kind: compare
          columns:
          - title: Equation
            points:
            - v = u + at
            - s = ut + ½at²
            - v² = u² + 2as
          - title: Leaves out
            points:
            - s
            - v
            - t
          alt: 'Each equation of motion leaves out one quantity: v = u + at has no s, s = ut + ½at² has no v, v² = u² + 2as has no t.'
        check:
          prompt: You know u, a and s, and want v. Which equation?
          options:
          - v² = u² + 2as
          - v = u + at
          - s = ut + ½at²
          answer: v² = u² + 2as
          why: It is the only one with u, a, s and v and no t.
        ways:
        - style: step_by_step
          teach: 'Step 1: list the three quantities you know. Step 2: add the one you want. Step 3: find the equation that has exactly those four: v = u + at has no s; s = ut + ½at² has no v; v² = u² + 2as has no t.'
    items:
      - prompt: "A body starts at 5 m/s and accelerates at 2 m/s² for 4 s. What is its final velocity, in m/s?"
        answer: "13"
        check: "5 + 2*4"
        difficulty: 1
        hints: ["v = u + at."]
        solution: "v = 5 + 2 × 4 = 13 m/s"
        mistakes: {"8": forgot_initial_velocity}
      - prompt: "A car starts from rest and accelerates at 2 m/s² for 5 s. How far does it travel, in m?"
        answer: "25"
        check: "Rational(1, 2)*2*5**2"
        difficulty: 1
        hints: ["s = ut + ½at², with u = 0."]
        solution: "s = 0 + ½ × 2 × 5² = 25 m"
        mistakes: {"50": forgot_half, "5": forgot_square}
      - prompt: "A car at 10 m/s accelerates at 2 m/s² for 5 s. How far does it go, in m?"
        answer: "75"
        check: "10*5 + Rational(1, 2)*2*5**2"
        difficulty: 2
        hints: ["s = ut + ½at²."]
        solution: "Step 1: ut = 50. Step 2: ½at² = ½ × 2 × 25 = 25. Step 3: s = 75 m."
        mistakes: {"25": forgot_initial_velocity, "100": forgot_half}
      - prompt: "A body starts from rest and accelerates at 4 m/s² over a distance of 50 m. What is its final velocity, in m/s?"
        answer: "20"
        check: "sqrt(0 + 2*4*50)"
        difficulty: 2
        hints: ["v² = u² + 2as.", "v² = 400."]
        solution: "Step 1: v² = 0 + 2 × 4 × 50 = 400. Step 2: v = 20 m/s."
        mistakes: {"400": forgot_square}
      - prompt: "A car moving at 20 m/s brakes with an acceleration of −5 m/s². How far does it travel before stopping, in m?"
        answer: "40"
        check: "solve(Eq(0, 20**2 + 2*(-5)*s), s)[0]"
        difficulty: 3
        hints: ["v = 0. Use v² = u² + 2as.", "0 = 400 − 10s."]
        solution: "Step 1: 0 = 20² + 2(−5)s. Step 2: 10s = 400. Step 3: s = 40 m."
        mistakes: {"-40": retardation_sign, "2": forgot_square}
      - prompt: "A stone is dropped from rest and falls for 3 s with acceleration 10 m/s². How far does it fall, in m?"
        answer: "45"
        check: "Rational(1, 2)*10*3**2"
        difficulty: 3
        hints: ["s = ½at², u = 0."]
        solution: "s = ½ × 10 × 9 = 45 m"
        mistakes: {"90": forgot_half, "15": forgot_square}
      - prompt: "A train starting from rest reaches 20 m/s after travelling 400 m. What is its acceleration, in m/s²?"
        answer: "0.5"
        check: "20**2/(2*400)"
        difficulty: 3
        hints: ["You know u, v and s, but not t.", "Use v² = u² + 2as."]
        solution: "Step 1: 20² = 0 + 2 × a × 400. Step 2: 400 = 800a, so a = 0.5 m/s²."
        mistakes: {"0.05": forgot_square, "1": forgot_half, "20": which_equation}
      - prompt: "A car moving at 15 m/s brakes and stops in 3 s with uniform deceleration. How far does it travel while braking, in m?"
        answer: "22.5"
        check: "15*3 + 0.5*(-5)*3**2"
        difficulty: 3
        hints: ["First find the acceleration: a = (0 − 15) ÷ 3.", "Then s = ut + ½at², with a negative."]
        solution: "Step 1: a = −5 m/s². Step 2: s = 15 × 3 + ½ × (−5) × 9 = 45 − 22.5 = 22.5 m."
        mistakes: {"45": forgot_half, "67.5": retardation_sign, "0": retardation_sign}
      - prompt: "A body moving at 4 m/s accelerates at 3 m/s² until it reaches 10 m/s. How far does it travel while speeding up, in m?"
        answer: "14"
        check: "(10**2 - 4**2)/(2*3)"
        difficulty: 3
        hints: ["You know u, v and a, but not t.", "v² = u² + 2as."]
        solution: "Step 1: 100 = 16 + 6s. Step 2: 6s = 84, so s = 14 m."
        mistakes: {"1": forgot_square, "28": forgot_half, "16.67": forgot_initial_velocity}
      - prompt: A body starts at 10 m/s and accelerates at 3 m/s² for 4 s. What is its final velocity, in m/s?
        answer: '22'
        check: 10 + 3*4
        difficulty: 1
        hints:
        - v = u + at.
        - 10 + 3 × 4.
        solution: 'Step 1: v = u + at. Step 2: = 10 + 12. Step 3: = 22 m/s.'
        mistakes:
          '12': forgot_initial_velocity
      - prompt: A ball rolls from rest down a slope with acceleration 2 m/s². How far does it roll in 6 s, in m?
        answer: '36'
        check: 0.5*2*6**2
        difficulty: 1
        hints:
        - s = ut + ½at², with u = 0.
        - ½ × 2 × 36.
        solution: 'Step 1: u = 0, so s = ½at². Step 2: = ½ × 2 × 6². Step 3: = 36 m.'
        mistakes:
          '72': forgot_half
          '6': forgot_square
      - prompt: A car moving at 5 m/s accelerates at 2 m/s² for 4 s. How far does it go, in m?
        answer: '36'
        check: 5*4 + 0.5*2*4**2
        difficulty: 2
        hints:
        - s = ut + ½at².
        - 5 × 4 + ½ × 2 × 16.
        solution: 'Step 1: ut = 20 m. Step 2: ½at² = 16 m. Step 3: s = 36 m.'
        mistakes:
          '16': forgot_initial_velocity
          '52': forgot_half
      - prompt: A bike at 6 m/s accelerates at 2 m/s² over 16 m. What is its final velocity, in m/s?
        answer: '10'
        check: sqrt(6**2 + 2*2*16)
        difficulty: 2
        hints:
        - No time is given, so use v² = u² + 2as.
        - 36 + 64.
        solution: 'Step 1: v² = 6² + 2 × 2 × 16. Step 2: = 36 + 64 = 100. Step 3: v = 10 m/s.'
        mistakes:
          '100': forgot_square
      - prompt: A bus at 25 m/s brakes at −2.5 m/s². How far does it go before stopping, in m?
        answer: '125'
        check: 25**2/(2*2.5)
        difficulty: 3
        hints:
        - v = 0. Use v² = u² + 2as.
        - 0 = 625 − 5s.
        solution: 'Step 1: 0 = 25² + 2 × (−2.5) × s. Step 2: 5s = 625. Step 3: s = 125 m.'
        mistakes:
          '250': forgot_half
      - prompt: A stone dropped from a bridge hits the water after 2 s. Taking its acceleration as 10 m/s², how high is the bridge above the water, in m?
        answer: '20'
        check: 0.5*10*2**2
        difficulty: 3
        hints:
        - Dropped means u = 0.
        - s = ½ × 10 × 2².
        solution: 'Step 1: u = 0. Step 2: s = ½ × 10 × 4. Step 3: = 20 m.'
        mistakes:
          '40': forgot_half
          '10': forgot_square

  - code: phy9.motion.graphs
    title: Motion graphs
    after: [phy9.motion.acceleration]
    notes: |
      On a distance–time graph, the slope is the speed; a straight line means uniform speed and a
      flat line means rest. On a velocity–time graph, the slope is the acceleration and the area
      under the graph is the displacement. A horizontal v–t line means constant velocity.
    explanations:
      text: "A velocity–time graph tells the whole story of a trip. If the line climbs from 0 to 20 m/s in 4 s, the slope 20 ÷ 4 = 5 m/s² is the acceleration. The area of the triangle under it, ½ × 4 × 20 = 40 m, is the distance covered."
      visual: "Shade the region under a v–t graph. Split it into rectangles and triangles: add their areas to get the distance travelled."
      step_by_step: "A car goes at a steady 15 m/s for 6 s. Step 1: The v–t graph is a flat line at 15. Step 2: Area = rectangle 6 × 15 = 90. Step 3: Distance = 90 m; slope 0, so acceleration 0."
      real_world: "A train's data recorder stores a velocity–time graph. Investigators work out braking and distances from its slopes and areas."
    activity:
      type: graph
      mode: line
      range:
      - -2
      - 10
      m_step: 0.5
      x_label: time
      y_label: velocity
      prompt: A velocity–time graph. The slope is the acceleration; where it meets the velocity axis is the starting velocity.
      goals:
      - prompt: Start at 2 m/s and speed up by 1 m/s every second.
        m: 1
        c: 2
        mistakes:
        - when:
            m: 2
            c: 1
          say: 'You swapped them: this starts at 1 m/s and speeds up by 2 every second. Where the line crosses the velocity axis is the start.'
      - prompt: Start at 8 m/s and slow down by 2 m/s every second.
        m: -2
        c: 8
        mistakes:
        - when:
            m: 2
            c: 8
          say: Your line slopes up, so the object speeds up. Slowing down means the line slopes down.
        - when:
            m:
            - -10
            - 10
            c: 2
          say: 'This starts at 2 m/s. Where the line meets the velocity axis is the starting velocity: 8 m/s here.'
      - prompt: Move at a steady 5 m/s.
        m: 0
        c: 5
        mistakes:
        - when:
            m: 5
            c: 0
          say: 'Slope 5 means speeding up by 5 m/s every second. A steady speed means the velocity never changes: what does that look like?'
    lesson:
      - teach: 'A distance–time graph shows how far a body has gone at each moment. A straight sloping line means steady speed, and the steeper the line, the faster. A flat line means the distance isn''t changing: the body is at rest. The slope (rise ÷ run) is the speed.'
        check:
          prompt: A distance–time graph goes from (0 s, 0 m) to (4 s, 20 m) in a straight line. What is the speed?
          options:
          - 5 m/s
          - 80 m/s
          - 20 m/s
          answer: 5 m/s
          why: Slope = 20 m ÷ 4 s = 5 m/s.
        ways:
        - style: real_world
          teach: 'Picture a graph of a walk to school: distance up the side, time along the bottom. A steep stretch is running, a gentle slope is strolling, and a flat stretch is standing at the signal. The steepness of the line tells you the speed.'
      - teach: 'A velocity–time graph shows velocity at each moment. Here the slope is the acceleration: a straight rising line is steady speeding up, a flat line is constant velocity, and a falling line is slowing down.'
        check:
          prompt: On a velocity–time graph, what does a flat horizontal line mean?
          options:
          - Constant velocity
          - At rest
          - Speeding up
          answer: Constant velocity
          why: Velocity isn't changing. It is at rest only if that line is at 0.
        ways:
        - style: step_by_step
          teach: 'Step 1: check the axes: velocity up the side, time along the bottom. Step 2: a line going up means speeding up. Step 3: a flat line means the velocity isn''t changing. Step 4: a line going down means slowing down. The slope is the acceleration.'
      - teach: 'The area under a velocity–time graph is the displacement. A flat line at 15 m/s for 6 s is a rectangle: 15 × 6 = 90 m. A line rising from 0 to 20 m/s in 4 s is a triangle: ½ × 4 × 20 = 40 m. Split harder shapes into rectangles and triangles.'
        picture:
          kind: flow
          steps:
          - 'Rectangle: velocity × time'
          - 'Triangle: ½ × time × velocity change'
          - Add the pieces for the total distance
          alt: The area under a velocity–time graph, found from rectangles and triangles, gives the distance.
        check:
          prompt: A v–t graph is flat at 8 m/s for 5 s. How far does the body go?
          options:
          - 40 m
          - 13 m
          - 1.6 m
          answer: 40 m
          why: Area of the rectangle = 8 × 5 = 40 m.
        ways:
        - style: step_by_step
          teach: 'Step 1: on a velocity–time graph, shade the area under the line. Step 2: split it into rectangles and triangles. Step 3: rectangle: velocity × time. Triangle: ½ × time × velocity. Step 4: add the parts: that is how far the body went.'
    items:
      - prompt: "On a distance–time graph, a horizontal straight line means the body is:"
        options: ["At rest", "Moving with uniform speed", "Accelerating", "Slowing down"]
        answer: "At rest"
        difficulty: 1
        hints: ["The distance doesn't change as time passes."]
        solution: "Distance stays the same, so the body is not moving."
        mistakes: {"Moving with uniform speed": "horizontal_rest", "Accelerating": "horizontal_rest"}
      - prompt: "On a velocity–time graph, what does the slope of the line give?"
        options: ["Acceleration", "Distance", "Speed", "Time"]
        answer: "Acceleration"
        difficulty: 1
        hints: ["Slope = change in velocity ÷ change in time."]
        solution: "Change in velocity ÷ time is acceleration."
        mistakes: {"Distance": graph_slope_area}
      - prompt: "A velocity–time graph is a flat line at 15 m/s from t = 0 to t = 6 s. How far does the body travel, in m?"
        answer: "90"
        check: "15*6"
        difficulty: 2
        hints: ["Area under the line: a rectangle."]
        solution: "Area = 15 × 6 = 90 m"
        mistakes: {"5/2": speed_time_swapped}
      - prompt: "A velocity–time graph rises in a straight line from 0 to 20 m/s in 4 s. How far does the body travel in this time, in m?"
        answer: "40"
        check: "Rational(1, 2)*4*20"
        difficulty: 2
        hints: ["Area of a triangle = ½ × base × height."]
        solution: "½ × 4 × 20 = 40 m"
        mistakes: {"80": forgot_half, "5": graph_slope_area}
      - prompt: "A distance–time graph is a straight line through (0 s, 0 m) and (5 s, 40 m). What is the speed, in m/s?"
        answer: "8"
        check: "40/5"
        difficulty: 2
        hints: ["Slope of a distance–time graph is speed."]
        solution: "40 ÷ 5 = 8 m/s"
        mistakes: {"1/8": speed_time_swapped}
      - prompt: "A car speeds up from 0 to 10 m/s in 5 s, then keeps 10 m/s for 10 s. Using the velocity–time graph, what is the total distance, in m?"
        answer: "125"
        check: "Rational(1, 2)*5*10 + 10*10"
        difficulty: 3
        hints: ["A triangle then a rectangle.", "25 + 100."]
        solution: "Step 1: Triangle ½ × 5 × 10 = 25 m. Step 2: Rectangle 10 × 10 = 100 m. Step 3: Total 125 m."
        mistakes: {"150": forgot_half}
      - prompt: "A velocity–time graph rises in a straight line from 10 m/s to 30 m/s between t = 0 and t = 4 s. How far does the body travel in these 4 s, in m?"
        answer: "80"
        check: "10*4 + 0.5*4*20"
        difficulty: 3
        hints: ["The area under the line is a rectangle plus a triangle (or one trapezium).", "Rectangle 10 × 4, triangle ½ × 4 × 20."]
        solution: "Step 1: Rectangle = 10 × 4 = 40 m. Step 2: Triangle = ½ × 4 × 20 = 40 m. Step 3: Total = 80 m."
        mistakes: {"120": area_under_both, "40": area_under_both, "5": graph_slope_area}
      - prompt: "A distance–time graph of a car is a curve that gets steeper as time goes on. What is the car doing?"
        options: ["Speeding up", "Moving at a steady speed", "Slowing down", "Standing still"]
        answer: "Speeding up"
        difficulty: 2
        hints: ["The slope of a distance–time graph is the speed.", "Steeper means a bigger slope."]
        solution: "Step 1: Slope = speed. Step 2: A slope that keeps getting bigger means the speed is increasing."
        mistakes: {"Moving at a steady speed": graph_slope_area, "Slowing down": graph_slope_area, "Standing still": horizontal_rest}
      - prompt: "A body moves at 20 m/s for 5 s, then slows uniformly to rest in the next 4 s. Using the velocity–time graph, how far does it travel in all, in m?"
        answer: "140"
        check: "20*5 + 0.5*4*20"
        difficulty: 3
        hints: ["The graph is a rectangle followed by a triangle.", "Rectangle 20 × 5, triangle ½ × 4 × 20."]
        solution: "Step 1: Steady part = 20 × 5 = 100 m. Step 2: Slowing part = ½ × 4 × 20 = 40 m. Step 3: Total = 140 m."
        mistakes: {"180": forgot_half, "100": area_under_both}
      - prompt: 'On a distance–time graph, a straight line sloping upwards means the body is:'
        options:
        - Moving at a steady speed
        - At rest
        - Speeding up
        - Slowing down
        answer: Moving at a steady speed
        difficulty: 1
        hints:
        - A straight line has the same slope all along.
        - The slope is the speed.
        solution: 'Step 1: The slope of a d–t graph is the speed. Step 2: A straight line has a constant slope. Step 3: So the speed is steady.'
        mistakes:
          Speeding up: graph_slope_area
          At rest: horizontal_rest
      - prompt: On a velocity–time graph, what does the area under the line give?
        options:
        - Displacement
        - Acceleration
        - Speed
        - Time
        answer: Displacement
        difficulty: 1
        hints:
        - Area = velocity × time for a rectangle.
        - What is velocity × time?
        solution: 'Step 1: Area = velocity × time. Step 2: (m/s) × s = m. Step 3: So the area is displacement.'
        mistakes:
          Acceleration: graph_slope_area
      - prompt: A velocity–time graph rises in a straight line from 0 to 12 m/s in 6 s. What is the acceleration, in m/s²?
        answer: '2'
        check: 12/6
        difficulty: 2
        hints:
        - Acceleration is the slope.
        - 12 ÷ 6.
        solution: 'Step 1: Slope = change in velocity ÷ time. Step 2: 12 ÷ 6. Step 3: = 2 m/s².'
        mistakes:
          '36': graph_slope_area
      - prompt: A velocity–time graph rises in a straight line from 0 to 12 m/s in 6 s. How far does the body travel, in m?
        answer: '36'
        check: 0.5*6*12
        difficulty: 2
        hints:
        - The area under the line is a triangle.
        - ½ × 6 × 12.
        solution: 'Step 1: The area is a triangle. Step 2: ½ × base × height = ½ × 6 × 12. Step 3: = 36 m.'
        mistakes:
          '72': forgot_half
          '2': graph_slope_area
      - prompt: A body moves at 10 m/s for 4 s, then speeds up steadily to 20 m/s over the next 2 s. Using the velocity–time graph, how far does it travel in the 6 s, in m?
        answer: '70'
        check: 10*4 + (10 + 20)/2*2
        difficulty: 3
        hints:
        - Split the area into a rectangle and a trapezium.
        - 40 m for the first part; the second is (10 + 20) ÷ 2 × 2.
        solution: 'Step 1: First 4 s: 10 × 4 = 40 m. Step 2: Next 2 s: average velocity 15 m/s × 2 s = 30 m. Step 3: Total = 70 m.'
        mistakes:
          '80': area_under_both
      - prompt: A distance–time graph of a bus is a curve that gets flatter as time goes on. What is the bus doing?
        options:
        - Slowing down
        - Speeding up
        - Moving at a steady speed
        - Going backwards
        answer: Slowing down
        difficulty: 3
        hints:
        - The slope of a d–t graph is the speed.
        - A flatter slope means…?
        solution: 'Step 1: Slope = speed. Step 2: The slope gets smaller. Step 3: So the speed is falling: the bus is slowing down.'
        mistakes:
          Speeding up: graph_slope_area
