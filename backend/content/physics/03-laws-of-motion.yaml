# Class 9 Physics, chapter 3. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_initial_velocity, unit_kmh.
subject: phy
chapter: 3
title: Laws of Motion

tips:
  inertia_turn: "Your body tends to keep moving in the straight line it was already going in, while the bus turns under you. Which side of the bus comes towards you?"
  balanced_steady: "A steady speed in a straight line means no change in motion, so the forces on the box must balance."
  dust_inertia: "When the stick hits, which moves suddenly: the carpet or the dust? Which one tends to stay where it was?"
  impulse_time: "Force × time = change in momentum. Find the change in momentum first, then divide by the force."
  rebound_change: "Momentum has direction. Bouncing straight back turns +p into −p, so find how far apart those are."
  horse_cart: "The horse's pull on the cart and the cart's pull on the horse act on different bodies. To see whether the horse moves, look at all the forces on the horse, including the ground's push on its hooves."
  wall_pushes_back: "When she pushes the wall, the wall pushes back on her with a force of the same size. That force acts on her mass."
  combined_mass: "After the jump both move together. Total momentum before = (both masses added) × common speed."
  opposite_momenta: "Momentum has direction. Count the trolley moving the other way as negative before adding."
  force_needed_to_move: "A moving body does not need a force to keep moving. It needs a force only to change its speed or direction."
  mass_divided: "F = ma: multiply mass by acceleration. To find acceleration, divide force by mass."
  momentum_added: "Momentum = mass × velocity. Multiply, don't add."
  grams_not_kg: "Change grams to kilograms first: divide by 1000."
  action_reaction_same_body: "Action and reaction act on different bodies, so they don't cancel out."
  reaction_smaller: "Action and reaction always match each other in size, even when one body is much heavier."
  recoil_direction: "The total momentum stays zero, so the gun or boat moves backwards, opposite to the bullet or person."
  heavier_more_inertia: "Inertia depends on mass only: the more massive body has more inertia."
  catch_longer_time: "The ball must stop either way. Pulling back makes it take longer, so the force is smaller."
  ground_pushes: "Your foot pushes the ground back; the ground pushes you forward. Muscles alone can't move you."
  inertia_of_rest: "The coin was at rest and stays at rest when the card is flicked away."
  momentum_transfer: "Momentum is conserved: all of the first ball's momentum passes to the second."

concepts:
  - code: phy9.laws.inertia
    title: Inertia and the first law
    notes: |
      Newton's first law: a body stays at rest, or moving with uniform velocity in a straight line,
      unless an unbalanced external force acts on it. Inertia is this tendency to resist a change in
      state of motion; its measure is mass. Balanced forces cause no change in motion. Friction is
      why moving things on Earth usually stop.
    explanations:
      text: "A ball rolling on a smooth floor keeps going until friction slows it. Without friction it would roll forever. Objects keep doing what they are doing (staying still or moving steadily) unless a force makes them change. This 'laziness' is called inertia, and heavier objects have more of it."
      visual: "Picture a coin on a card on top of a glass. Flick the card away: the coin, at rest, wants to stay at rest, so it drops straight into the glass."
      step_by_step: "Why do passengers lurch forward when a bus brakes? Step 1: Before braking, the passengers move with the bus. Step 2: The brakes stop the bus, but no force acts directly on the upper body. Step 3: By inertia the body keeps moving forward."
      real_world: "Seat belts stop you continuing forward when a car stops suddenly. Shaking a tree makes fruit fall: the branch moves, the fruit stays where it was and breaks off."
    activity:
      type: sort
      prompt: Which kind of inertia is it?
      bins:
      - Inertia of rest
      - Inertia of motion
      items:
      - label: You fall back when a bus suddenly starts
        bin: Inertia of rest
        clue: Before the bus started, was your body still or moving?
        why: Your body was at rest and tends to stay at rest while the bus moves forward.
      - label: You fall forward when a bus suddenly stops
        bin: Inertia of motion
        clue: Before the bus stopped, was your body still or moving?
        why: Your body was moving and tends to keep moving when the bus stops.
      - label: Dust leaves a carpet when it is beaten
        bin: Inertia of rest
        clue: When the carpet is hit, what moves and what stays still?
        why: The carpet moves suddenly; the dust, at rest, stays behind and falls out.
      - label: A runner can't stop right at the finish line
        bin: Inertia of motion
        clue: Is the runner still or moving?
        why: The runner is moving and tends to keep moving.
      - label: A coin drops into a glass when the card under it is flicked
        bin: Inertia of rest
        clue: Before the flick, was the coin still or moving?
        why: The coin was at rest and stays put as the card shoots away, then it falls.
    lesson:
      - teach: A ball on the ground stays still until something pushes it. A ball rolling on grass slows and stops, but only because friction pushes against it. On a perfectly smooth surface with no air, it would keep rolling for ever at the same speed in a straight line.
        check:
          prompt: Why does a ball rolling on grass stop?
          options:
          - Friction from the grass acts against it
          - Moving things always stop by themselves
          - It runs out of speed
          answer: Friction from the grass acts against it
          why: Without a force like friction, it would keep moving.
      - teach: 'Newton''s first law: a body stays at rest, or keeps moving at a steady velocity in a straight line, unless an unbalanced force acts on it. This tendency to keep doing what it''s doing is called inertia. The more mass a body has, the more inertia: a loaded truck is harder to start or stop than a bicycle.'
        check:
          prompt: Which has more inertia?
          options:
          - A 2 kg stone
          - A 200 g stone
          - Both the same
          answer: A 2 kg stone
          why: Inertia depends on mass, and 2 kg is more than 200 g.
      - teach: Inertia explains everyday moments. When a bus brakes, your body keeps moving forward (inertia of motion). When a bus starts, you fall back (inertia of rest). When a bus turns left, you feel pushed right, because your body tries to keep going straight.
        check:
          prompt: A bus starts suddenly. Standing passengers fall backwards. Why?
          options:
          - Their bodies tend to stay at rest while the bus moves forward
          - The bus pushes them backwards
          - The air pushes them
          answer: Their bodies tend to stay at rest while the bus moves forward
          why: 'The feet move with the bus, but the upper body tends to stay at rest: inertia of rest.'
      - teach: If forces on a body balance (for example 20 N left and 20 N right), the net force is zero and its motion doesn't change. A box pushed at a steady speed has the push exactly balanced by friction.
        check:
          prompt: A cart is pulled at a steady speed with a 30 N force. What is the friction on it?
          options:
          - 30 N
          - 0 N
          - More than 30 N
          answer: 30 N
          why: 'Steady speed means no change in motion, so the forces balance: friction = 30 N.'
    items:
      - prompt: "When a moving bus suddenly brakes, the passengers lean forward. This is due to:"
        options: ["Inertia of motion", "Inertia of rest", "Gravity", "Friction of the seats"]
        answer: "Inertia of motion"
        difficulty: 1
        hints: ["The passengers were moving with the bus."]
        solution: "Their bodies tend to keep moving forward when the bus stops: inertia of motion."
        mistakes: {"Inertia of rest": force_needed_to_move}
      - prompt: "Which has more inertia?"
        options: ["A loaded truck", "A bicycle", "A football", "They all have the same"]
        answer: "A loaded truck"
        difficulty: 1
        hints: ["Inertia depends on mass."]
        solution: "The truck has the most mass, so it has the most inertia."
        mistakes: {"They all have the same": heavier_more_inertia}
      - prompt: "A ball rolls on a perfectly smooth, level floor with no air and no friction. What happens to it?"
        options: ["It keeps moving at the same speed in a straight line", "It slows down and stops", "It speeds up", "It moves in a circle"]
        answer: "It keeps moving at the same speed in a straight line"
        difficulty: 2
        hints: ["Is there any unbalanced force on it?"]
        solution: "With no unbalanced force, by the first law its velocity does not change."
        mistakes: {"It slows down and stops": force_needed_to_move}
      - prompt: "A card on a glass has a coin on it. The card is flicked away quickly. Why does the coin fall into the glass?"
        options: ["Because of the coin's inertia of rest", "Because the card pushes it down", "Because of the coin's inertia of motion", "Because air pushes it"]
        answer: "Because of the coin's inertia of rest"
        difficulty: 2
        hints: ["Was the coin moving before?"]
        solution: "The coin was at rest and tends to stay at rest while the card moves away, so gravity pulls it into the glass."
        mistakes: {"Because of the coin's inertia of motion": "inertia_of_rest", "Because the card pushes it down": "inertia_of_rest"}
      - prompt: "Two forces act on a box: 20 N to the right and 20 N to the left. What is the net force on it, in N?"
        answer: "0"
        check: "20 - 20"
        difficulty: 1
        hints: ["Forces in opposite directions subtract."]
        solution: "20 − 20 = 0 N: balanced forces, so no change in motion."
        mistakes: {"40": action_reaction_same_body}
      - prompt: "A spacecraft far from any planet switches off its engines while moving at 5 km/s. What happens to its speed?"
        options: ["It stays 5 km/s", "It falls slowly to 0", "It falls at once to 0", "It keeps increasing"]
        answer: "It stays 5 km/s"
        difficulty: 3
        hints: ["Is anything there to slow it down?"]
        solution: "In empty space there is no friction or air, so no unbalanced force: it keeps moving at 5 km/s."
        mistakes: {"It falls slowly to 0": force_needed_to_move, "It falls at once to 0": force_needed_to_move}
      - prompt: "A bus moving straight ahead suddenly turns left. Which way do the standing passengers feel thrown?"
        options: ["Towards the right", "Towards the left", "Forwards", "Backwards"]
        answer: "Towards the right"
        difficulty: 3
        hints: ["Before the turn, everyone is moving straight ahead.", "Your body keeps going straight while the bus turns left."]
        solution: "Step 1: Passengers' bodies tend to keep moving straight ahead (inertia of motion). Step 2: The bus turns left under them, so they lurch towards the right side."
        mistakes: {"Towards the left": inertia_turn, "Forwards": inertia_turn, "Backwards": inertia_turn}
      - prompt: "A box is pushed across a floor with a force of 50 N and moves at a steady speed. What is the friction force on the box, in N?"
        answer: "50"
        check: "50"
        difficulty: 2
        hints: ["Is the box speeding up?", "No change in motion means no unbalanced force."]
        solution: "Step 1: Steady speed in a straight line means zero net force. Step 2: Friction must balance the push: 50 N backwards."
        mistakes: {"0": balanced_steady, "25": balanced_steady, "100": balanced_steady}
      - prompt: "Why does dust come out of a carpet when it is beaten with a stick?"
        options: ["The carpet moves suddenly but the dust tends to stay at rest", "The stick pushes each dust particle out", "Beating makes the dust lighter than air", "Air from the swinging stick blows the dust"]
        answer: "The carpet moves suddenly but the dust tends to stay at rest"
        difficulty: 2
        hints: ["Which one does the stick actually hit?", "Think of the coin on the card."]
        solution: "Step 1: The stick sets the carpet moving suddenly. Step 2: The dust, because of its inertia of rest, stays behind and falls out."
        mistakes: {"The stick pushes each dust particle out": dust_inertia, "Beating makes the dust lighter than air": dust_inertia, "Air from the swinging stick blows the dust": dust_inertia}
      - prompt: A bus moving fast stops suddenly. Which way do the passengers lurch?
        options:
        - Forwards
        - Backwards
        - Sideways
        - They don't move
        answer: Forwards
        difficulty: 1
        hints:
        - Their bodies were moving with the bus.
        - When the bus stops, what do their bodies tend to do?
        solution: 'Step 1: The passengers were moving forward with the bus. Step 2: Their bodies tend to keep moving (inertia of motion). Step 3: So they lurch forward.'
        mistakes:
          Backwards: inertia_of_rest
      - prompt: Which needs the biggest force to start it moving from rest in the same time?
        options:
        - A full gas cylinder
        - An empty gas cylinder
        - A football
        - A pencil
        answer: A full gas cylinder
        difficulty: 1
        hints:
        - Inertia depends on mass.
        - Which has the most mass?
        solution: 'Step 1: More mass means more inertia. Step 2: The full cylinder has the most mass. Step 3: So it needs the biggest force.'
        mistakes:
          An empty gas cylinder: heavier_more_inertia
      - prompt: Forces of 35 N to the left and 50 N to the right act on a trolley. What is the net force, in N, to the right?
        answer: '15'
        check: 50 - 35
        difficulty: 2
        hints:
        - Opposite forces subtract.
        - 50 − 35.
        solution: 'Step 1: The forces are in opposite directions. Step 2: 50 − 35 = 15 N. Step 3: The net force is 15 N to the right.'
        mistakes:
          '85': balanced_steady
      - prompt: Why do we shake a wet umbrella before folding it?
        options:
        - The umbrella stops suddenly but the water drops keep moving and fly off
        - Shaking dries the cloth with heat
        - The water is pushed by the air
        - The water is pulled down by gravity only
        answer: The umbrella stops suddenly but the water drops keep moving and fly off
        difficulty: 2
        hints:
        - Think about the drops when the umbrella stops.
        - Which law is about keeping on moving?
        solution: 'Step 1: The drops move with the umbrella. Step 2: When it stops, the drops keep going by inertia. Step 3: So they fly off.'
        mistakes:
          The water is pushed by the air: dust_inertia
      - prompt: A car moves at a steady 60 km/h on a straight road. The engine's forward force is 2000 N. What is the total backward force from friction and air, in N?
        answer: '2000'
        check: '2000'
        difficulty: 3
        hints:
        - Steady speed in a straight line means the forces balance.
        - Forward = backward.
        solution: 'Step 1: The velocity isn''t changing. Step 2: So the net force is zero. Step 3: The backward forces add up to 2000 N.'
        mistakes:
          '0': force_needed_to_move
      - prompt: A stone tied to a string is whirled in a circle. The string breaks. Which way does the stone fly?
        options:
        - Straight on, along the direction it was moving at that moment
        - Straight out from the centre
        - Towards the centre
        - It keeps going round
        answer: Straight on, along the direction it was moving at that moment
        difficulty: 3
        hints:
        - Once the string breaks, no force pulls the stone round.
        - What does the first law say about a body with no force on it?
        solution: 'Step 1: The string was the force turning the stone. Step 2: Without it, the stone keeps its velocity. Step 3: So it moves in a straight line along the way it was going.'
        mistakes:
          It keeps going round: inertia_turn

  - code: phy9.laws.momentum
    title: Momentum and the second law
    after: [phy9.laws.inertia]
    notes: |
      Momentum p = mv (kg m/s), a vector in the direction of velocity. Newton's second law: the rate
      of change of momentum equals the applied force, which for fixed mass gives F = ma. 1 newton is
      the force that gives 1 kg an acceleration of 1 m/s². Force × time = change in momentum
      (impulse), which is why a longer stopping time means a smaller force.
    explanations:
      text: "Momentum is how hard something is to stop: mass times velocity. A 1000 kg car at 20 m/s has 20,000 kg m/s; a 0.15 kg cricket ball at 30 m/s has just 4.5 kg m/s. Force changes momentum: F = ma. Push 2 kg with 10 N and it accelerates at 5 m/s²."
      visual: "Picture pushing an empty shopping trolley and a full one with the same push. The empty one speeds up quickly; the full one slowly. Same force, more mass, less acceleration: a = F ÷ m."
      step_by_step: "A 1200 kg car goes from 10 m/s to 20 m/s in 5 s. Step 1: a = (20 − 10) ÷ 5 = 2 m/s². Step 2: F = ma = 1200 × 2 = 2400 N."
      real_world: "A cricketer pulls the hands back while catching a fast ball. Stopping it over a longer time makes the force on the hands smaller."
    activity:
      type: formula
      prompt: Momentum p = mass × velocity.
      inputs:
      - name: m
        label: Mass
        min: 1
        max: 10
        step: 1
        start: 1
        unit: kg
      - name: v
        label: Velocity
        min: 0
        max: 20
        step: 1
        start: 0
        unit: m/s
      outputs:
      - name: p
        label: Momentum
        expr: m*v
        unit: kg m/s
      goals:
      - prompt: Give a 4 kg ball a momentum of 20 kg m/s.
        want:
          p: 20
          m: 4
        mistakes:
        - when:
            m: 4
            v: 16
          say: 4 × 16 = 64 kg m/s. Did you add 4 + 16 = 20? Momentum multiplies mass by velocity.
      - prompt: Now a lighter ball, 2 kg or less, with the same momentum.
        want:
          p: 20
          m:
          - 1
          - 2
        mistakes:
        - when:
            m: 2
            v: 18
          say: 2 × 18 = 36 kg m/s. Momentum is mass × velocity, not mass + velocity.
    lesson:
      - teach: 'Which is harder to stop: a slow bicycle or a fast lorry? It depends on both mass and speed. Their product is momentum: p = m × v, measured in kg m/s. A 2 kg ball at 5 m/s has momentum 10 kg m/s. Momentum has a direction, the same as the velocity.'
        check:
          prompt: What is the momentum of a 3 kg ball at 4 m/s?
          options:
          - 12 kg m/s
          - 7 kg m/s
          - 0.75 kg m/s
          answer: 12 kg m/s
          why: p = mv = 3 × 4 = 12 kg m/s.
      - teach: 'Newton''s second law: the force on a body equals how fast its momentum changes. For a fixed mass this gives F = m × a. One newton (1 N) is the force that gives 1 kg an acceleration of 1 m/s².'
        check:
          prompt: A 4 kg box is pushed with a net force of 12 N. What is its acceleration?
          options:
          - 3 m/s²
          - 48 m/s²
          - 16 m/s²
          answer: 3 m/s²
          why: a = F ÷ m = 12 ÷ 4 = 3 m/s².
      - teach: Force × time = change in momentum. To stop the same ball, a longer stopping time needs a smaller force. That's why a cricketer pulls the hands back when catching, why vehicles have air bags, and why a high jumper lands on a soft mattress.
        check:
          prompt: Why do high jumpers land on a thick foam bed?
          options:
          - It makes them stop over a longer time, so the force is smaller
          - It makes them stop faster
          - It reduces their mass
          answer: It makes them stop over a longer time, so the force is smaller
          why: The momentum to be lost is the same; spreading it over more time lowers the force.
      - teach: 'Use kilograms and m/s. A 150 g cricket ball is 0.15 kg. If the velocity changes direction (a ball bouncing back), the change in momentum is bigger: going from +20 m/s to −20 m/s is a change of 40 m/s.'
        check:
          prompt: What is the momentum of a 200 g ball moving at 10 m/s?
          options:
          - 2 kg m/s
          - 2000 kg m/s
          - 20 kg m/s
          answer: 2 kg m/s
          why: 200 g = 0.2 kg, and 0.2 × 10 = 2 kg m/s.
    items:
      - prompt: "What is the momentum of a 2 kg ball moving at 5 m/s, in kg m/s?"
        answer: "10"
        check: "2*5"
        difficulty: 1
        hints: ["p = mv."]
        solution: "p = 2 × 5 = 10 kg m/s"
        mistakes: {"7": momentum_added}
      - prompt: "A force of 10 N acts on a 2 kg mass. What is its acceleration, in m/s²?"
        answer: "5"
        check: "10/2"
        difficulty: 1
        hints: ["a = F ÷ m."]
        solution: "a = 10 ÷ 2 = 5 m/s²"
        mistakes: {"20": mass_divided}
      - prompt: "What force, in N, gives a 50 kg box an acceleration of 3 m/s²?"
        answer: "150"
        check: "50*3"
        difficulty: 1
        hints: ["F = ma."]
        solution: "F = 50 × 3 = 150 N"
        mistakes: {"50/3": mass_divided}
      - prompt: "A cricket ball of mass 150 g moves at 20 m/s. What is its momentum, in kg m/s?"
        answer: "3"
        check: "Rational(150, 1000)*20"
        difficulty: 2
        hints: ["150 g = 0.15 kg."]
        solution: "p = 0.15 × 20 = 3 kg m/s"
        mistakes: {"3000": grams_not_kg}
      - prompt: "A 1200 kg car speeds up from 10 m/s to 20 m/s in 5 s. What force acts on it, in N?"
        answer: "2400"
        check: "1200*(20 - 10)/5"
        difficulty: 2
        hints: ["Find the acceleration first."]
        solution: "Step 1: a = 10 ÷ 5 = 2 m/s². Step 2: F = 1200 × 2 = 2400 N."
        mistakes: {"4800": forgot_initial_velocity}
      - prompt: "Why does a cricketer pull the hands back while catching a fast ball?"
        options: ["To increase the stopping time and so reduce the force", "To increase the force on the ball", "To reduce the ball's mass", "To increase the ball's momentum"]
        answer: "To increase the stopping time and so reduce the force"
        difficulty: 2
        hints: ["Force = change in momentum ÷ time."]
        solution: "The ball's momentum must fall to zero either way. Taking longer makes the force (change in momentum ÷ time) smaller."
        mistakes: {"To increase the force on the ball": "catch_longer_time", "To reduce the ball's mass": "catch_longer_time"}
      - prompt: "A 0.5 kg ball moving at 10 m/s is stopped in 0.1 s. What average force stops it, in N?"
        answer: "50"
        check: "Rational(1, 2)*10/Rational(1, 10)"
        difficulty: 3
        hints: ["Change in momentum = 0.5 × 10 = 5 kg m/s.", "Force = change in momentum ÷ time."]
        solution: "Step 1: Δp = 5 kg m/s. Step 2: F = 5 ÷ 0.1 = 50 N."
        mistakes: {"1/2": mass_divided}
      - prompt: "A 1000 kg car moving at 20 m/s is stopped by a steady braking force of 4000 N. How many seconds does it take to stop?"
        answer: "5"
        check: "1000*20/4000"
        difficulty: 3
        hints: ["Change in momentum = 1000 × 20.", "Force × time = change in momentum."]
        solution: "Step 1: Change in momentum = 20,000 kg m/s. Step 2: t = 20,000 ÷ 4000 = 5 s."
        mistakes: {"0.2": impulse_time, "4": impulse_time, "80000": impulse_time}
      - prompt: "Two balls have the same momentum. One has a mass of 2 kg and moves at 6 m/s. The other has a mass of 3 kg. How fast does it move, in m/s?"
        answer: "4"
        check: "2*6/3"
        difficulty: 2
        hints: ["Momentum of the first ball = 2 × 6.", "Speed = momentum ÷ mass."]
        solution: "Step 1: p = 2 × 6 = 12 kg m/s. Step 2: v = 12 ÷ 3 = 4 m/s."
        mistakes: {"9": mass_divided, "36": momentum_added, "5": momentum_added}
      - prompt: "A 0.15 kg ball hits a wall at 20 m/s and bounces straight back at 20 m/s. What is the size of its change in momentum, in kg m/s?"
        answer: "6"
        check: "0.15*20 - 0.15*(-20)"
        difficulty: 3
        hints: ["Take towards the wall as positive. Coming back is negative.", "Change = final − initial."]
        solution: "Step 1: Before: +0.15 × 20 = +3 kg m/s. Step 2: After: −3 kg m/s. Step 3: Change = −3 − 3 = −6, size 6 kg m/s."
        mistakes: {"0": rebound_change, "3": rebound_change}
      - prompt: What is the momentum of a 60 kg runner moving at 5 m/s, in kg m/s?
        answer: '300'
        check: 60*5
        difficulty: 1
        hints:
        - p = m × v.
        - 60 × 5.
        solution: 'Step 1: p = mv. Step 2: 60 × 5. Step 3: = 300 kg m/s.'
        mistakes:
          '65': momentum_added
          '12': mass_divided
      - prompt: A net force of 24 N acts on a 6 kg trolley. What is its acceleration, in m/s²?
        answer: '4'
        check: 24/6
        difficulty: 1
        hints:
        - a = F ÷ m.
        - 24 ÷ 6.
        solution: 'Step 1: F = ma, so a = F ÷ m. Step 2: 24 ÷ 6. Step 3: = 4 m/s².'
        mistakes:
          '144': mass_divided
      - prompt: A 50 g tennis ball moves at 30 m/s. What is its momentum, in kg m/s?
        answer: '1.5'
        check: 0.05*30
        difficulty: 2
        hints:
        - Change grams to kilograms first.
        - 50 g = 0.05 kg.
        solution: 'Step 1: 50 g = 0.05 kg. Step 2: p = 0.05 × 30. Step 3: = 1.5 kg m/s.'
        mistakes:
          '1500': grams_not_kg
      - prompt: A 800 kg car speeds up from 5 m/s to 15 m/s in 4 s. What net force acts on it, in N?
        answer: '2000'
        check: 800*(15 - 5)/4
        difficulty: 2
        hints:
        - Find the acceleration first.
        - a = (15 − 5) ÷ 4 = 2.5 m/s².
        solution: 'Step 1: a = 10 ÷ 4 = 2.5 m/s². Step 2: F = ma = 800 × 2.5. Step 3: = 2000 N.'
        mistakes:
          '8000': impulse_time
      - prompt: Why do vehicles have air bags?
        options:
        - They make a passenger stop over a longer time, so the force on them is smaller
        - They stop the car faster
        - They make the passenger lighter
        - They push the car backwards
        answer: They make a passenger stop over a longer time, so the force on them is smaller
        difficulty: 3
        hints:
        - Force × time = change in momentum.
        - The passenger's momentum change is the same either way.
        solution: 'Step 1: In a crash the passenger must lose the same momentum. Step 2: An air bag makes the stop take longer. Step 3: So the force on the body is smaller.'
        mistakes:
          They stop the car faster: catch_longer_time
      - prompt: A 0.2 kg ball hits a bat at 15 m/s and goes straight back at 25 m/s. What is the size of its change in momentum, in kg m/s?
        answer: '8'
        check: 0.2*(25 + 15)
        difficulty: 3
        hints:
        - The direction reverses, so the speeds add.
        - Change in velocity = 25 − (−15) = 40 m/s.
        solution: 'Step 1: Taking the return direction as positive, u = −15 and v = 25. Step 2: Change in velocity = 40 m/s. Step 3: Change in momentum = 0.2 × 40 = 8 kg m/s.'
        mistakes:
          '2': rebound_change

  - code: phy9.laws.third_law
    title: Action and reaction
    after: [phy9.laws.inertia]
    notes: |
      Newton's third law: to every action there is an equal and opposite reaction. The two forces act
      on different bodies, at the same time, and are of the same kind. Because they act on different
      bodies they never cancel each other. Examples: walking, swimming, rockets, a gun's recoil.
    explanations:
      text: "When you push a wall, the wall pushes back on you just as hard. When you walk, your foot pushes the ground backwards and the ground pushes you forwards. Forces always come in pairs, equal in size and opposite in direction, acting on two different objects."
      visual: "Draw two skaters facing each other. One pushes the other: draw an arrow on each, equal length, pointing away from each other. Both roll apart."
      step_by_step: "A rocket: Step 1: The engine pushes hot gas down and out (action on the gas). Step 2: The gas pushes the rocket up (reaction on the rocket). Step 3: These act on different bodies, so the rocket rises."
      real_world: "A swimmer pushes water backwards with the arms; the water pushes the swimmer forwards. A boat moves away when you jump from it to the shore."
    activity:
      type: sort
      prompt: True or false? (Action and reaction)
      bins:
      - 'True'
      - 'False'
      items:
      - label: Action and reaction act on different objects
        bin: 'True'
        clue: When you push a wall, who pushes whom?
        why: You push the wall; the wall pushes you. Two different objects, so true.
      - label: Action and reaction cancel each other out
        bin: 'False'
        why: They act on different objects, so they don't cancel.
        clue: Forces cancel only when they act on the same object. Do these?
      - label: They are equal in size
        bin: 'True'
        clue: Two skaters push off each other. Does one push harder?
        why: They are always equal in size. True.
      - label: They act in opposite directions
        bin: 'True'
        clue: A rocket pushes gas down. Which way does the gas push the rocket?
        why: Up, the opposite way. True.
      - label: The reaction comes a moment after the action
        bin: 'False'
        why: They happen at the same time.
        clue: Can you push a wall without it pushing back at that same moment?
    lesson:
      - teach: 'Push a wall and you feel it push back on your hands. Newton''s third law: when one body pushes on another, the second pushes back on the first with an equal force in the opposite direction. Forces always come in pairs: action and reaction.'
        check:
          prompt: You push a wall with 40 N. How hard does the wall push on you?
          options:
          - 40 N, towards you
          - 0 N
          - Less than 40 N
          answer: 40 N, towards you
          why: The reaction is equal in size and opposite in direction.
      - teach: Action and reaction act on different bodies, so they never cancel each other. When you walk, your foot pushes the ground backwards, and the ground pushes you forwards. The forward push on you moves you; the backward push on the ground hardly moves the huge Earth.
        check:
          prompt: Why don't action and reaction cancel out?
          options:
          - They act on different bodies
          - One is always bigger
          - They act at different times
          answer: They act on different bodies
          why: Forces only cancel when they act on the same body. Action and reaction never do.
      - teach: 'Examples: a swimmer pushes water back and moves forward; a rocket pushes gas down and the gas pushes the rocket up; a gun pushes a bullet forward and the bullet pushes the gun back (recoil). Equal forces can give different accelerations, because a = F ÷ m.'
        picture:
          kind: compare
          columns:
          - title: Action
            points:
            - foot pushes ground back
            - rocket pushes gas down
            - gun pushes bullet forward
          - title: Reaction
            points:
            - ground pushes foot forward
            - gas pushes rocket up
            - bullet pushes gun back
          alt: 'Pairs of action and reaction forces: walking, a rocket and a gun.'
        check:
          prompt: A truck and a bicycle collide. Which feels the larger force?
          options:
          - Both feel equal forces
          - The bicycle
          - The truck
          answer: Both feel equal forces
          why: The forces are equal. The bicycle's smaller mass gives it a bigger acceleration, so it is affected more.
    items:
      - prompt: "When you walk, what pushes you forward?"
        options: ["The ground, pushing back on your foot", "Your own muscles alone", "The air behind you", "Gravity"]
        answer: "The ground, pushing back on your foot"
        difficulty: 1
        hints: ["Your foot pushes the ground backwards."]
        solution: "Your foot pushes the ground backwards (action); the ground pushes you forwards (reaction)."
        mistakes: {"Your own muscles alone": "ground_pushes", "Gravity": "ground_pushes"}
      - prompt: "A book rests on a table and pushes down on it with 5 N. With what force, in N, does the table push up on the book?"
        answer: "5"
        check: "5"
        difficulty: 1
        hints: ["Action and reaction are equal."]
        solution: "The table pushes up with an equal 5 N."
        mistakes: {"0": reaction_smaller}
      - prompt: "A truck and a small car collide. Which statement about the forces is true?"
        options: ["Each pushes the other with the same force", "The truck pushes harder", "The car pushes harder", "Only the truck pushes"]
        answer: "Each pushes the other with the same force"
        difficulty: 2
        hints: ["Third law: equal and opposite."]
        solution: "The forces are equal and opposite. The car is damaged more because its mass is smaller, so the same force gives it a bigger acceleration."
        mistakes: {"The truck pushes harder": reaction_smaller}
      - prompt: "Action and reaction are equal and opposite. Why don't they cancel each other?"
        options: ["They act on different bodies", "They act at different times", "One is always bigger", "They are different kinds of force"]
        answer: "They act on different bodies"
        difficulty: 2
        hints: ["Forces cancel only when they act on the same body."]
        solution: "Action acts on one body and reaction on the other, so each body feels only one of them."
        mistakes: {"One is always bigger": reaction_smaller}
      - prompt: "How does a rocket move upward in space where there is no air to push against?"
        options: ["It pushes gas out backwards, and the gas pushes the rocket forwards", "Air pressure lifts it", "Gravity pushes it up", "It needs no force"]
        answer: "It pushes gas out backwards, and the gas pushes the rocket forwards"
        difficulty: 3
        hints: ["What does the engine push on?"]
        solution: "The rocket pushes on its own exhaust gas. By the third law the gas pushes back on the rocket."
        mistakes: {"It needs no force": force_needed_to_move}
      - prompt: "A horse pulls a cart. By the third law, the cart pulls back on the horse with an equal force. Why can they still move forward?"
        options: ["The ground pushes the horse forward harder than the cart pulls it back", "The horse pulls harder than the cart pulls back", "The cart's pull is only a reaction, so it does not count", "Action and reaction cancel, so nothing stops them"]
        answer: "The ground pushes the horse forward harder than the cart pulls it back"
        difficulty: 3
        hints: ["The two equal pulls act on different bodies.", "What pushes the horse forward when it digs its hooves in?"]
        solution: "Step 1: The horse's pull acts on the cart; the cart's pull acts on the horse. Step 2: The horse pushes back on the ground and the ground pushes the horse forward. Step 3: If that push beats the cart's pull, the horse speeds up, dragging the cart."
        mistakes: {"The horse pulls harder than the cart pulls back": reaction_smaller, "The cart's pull is only a reaction, so it does not count": horse_cart, "Action and reaction cancel, so nothing stops them": action_reaction_same_body}
      - prompt: "A 40 kg girl on roller skates pushes a wall with a force of 80 N. What is her acceleration away from the wall, in m/s², just as she pushes?"
        answer: "2"
        check: "80/40"
        difficulty: 3
        hints: ["What force acts on her, and who gives it?", "a = F ÷ m."]
        solution: "Step 1: The wall pushes back on her with 80 N. Step 2: a = 80 ÷ 40 = 2 m/s²."
        mistakes: {"0": wall_pushes_back, "3200": mass_divided, "0.5": mass_divided}
      - prompt: "When a gun fires a bullet, how do the force of the gun on the bullet and the force of the bullet on the gun compare?"
        options: ["Equal in size and opposite in direction", "Bigger on the bullet", "Bigger on the gun", "Equal in size and in the same direction"]
        answer: "Equal in size and opposite in direction"
        difficulty: 2
        hints: ["These two forces are an action–reaction pair.", "Then why does the bullet move much faster? Think of their masses."]
        solution: "Step 1: The forces are an action–reaction pair, so they are equal and opposite. Step 2: The bullet speeds up much more only because its mass is much smaller."
        mistakes: {"Bigger on the bullet": reaction_smaller, "Bigger on the gun": reaction_smaller, "Equal in size and in the same direction": recoil_direction}
      - prompt: A swimmer moves forward through water. What pushes the swimmer forward?
        options:
        - The water, pushing back on the swimmer's hands and feet
        - The swimmer's own muscles directly
        - The air above the water
        - Gravity
        answer: The water, pushing back on the swimmer's hands and feet
        difficulty: 1
        hints:
        - The swimmer pushes the water backwards.
        - What does the water do in return?
        solution: 'Step 1: Action: hands push water backwards. Step 2: Reaction: water pushes the swimmer forwards. Step 3: That reaction moves the swimmer.'
        mistakes:
          The swimmer's own muscles directly: ground_pushes
      - prompt: A boy pulls a rope tied to a tree with a force of 150 N. How hard does the rope pull the boy, in N?
        answer: '150'
        check: '150'
        difficulty: 1
        hints:
        - Action and reaction are equal.
        - Only their directions differ.
        solution: 'Step 1: The boy pulls the rope with 150 N. Step 2: By the third law the rope pulls back equally. Step 3: So 150 N towards the tree.'
        mistakes:
          '0': reaction_smaller
          '75': reaction_smaller
      - prompt: A book lies on a table. Earth pulls the book down with its weight. What is the reaction to this force?
        options:
        - The book pulls the Earth up
        - The table pushes the book up
        - The book pushes the table down
        - There is no reaction
        answer: The book pulls the Earth up
        difficulty: 2
        hints:
        - Action and reaction act on the two bodies involved in the force.
        - The weight is between the Earth and the book.
        solution: 'Step 1: Action: the Earth pulls the book. Step 2: The reaction must be on the Earth, from the book. Step 3: So the book pulls the Earth up with an equal force.'
        mistakes:
          The table pushes the book up: action_reaction_same_body
      - prompt: Why does a gun move backwards (recoil) when fired?
        options:
        - The bullet pushes back on the gun as the gun pushes the bullet forward
        - The air pushes the gun
        - The person pushes it back
        - The gun is lighter than the bullet
        answer: The bullet pushes back on the gun as the gun pushes the bullet forward
        difficulty: 2
        hints:
        - The gun pushes the bullet forward.
        - What does the bullet do to the gun?
        solution: 'Step 1: Action: the gun pushes the bullet forward. Step 2: Reaction: the bullet pushes the gun backward. Step 3: That reaction is the recoil.'
        mistakes:
          The air pushes the gun: recoil_direction
      - prompt: A 50 kg boy and a 25 kg girl on skates push each other with 100 N. What is the girl's acceleration, in m/s²?
        answer: '4'
        check: 100/25
        difficulty: 3
        hints:
        - Each feels 100 N.
        - a = F ÷ m for the girl.
        solution: 'Step 1: The girl feels 100 N. Step 2: a = 100 ÷ 25. Step 3: = 4 m/s² (the boy''s is only 2 m/s²).'
        mistakes:
          '2': reaction_smaller
      - prompt: A boat is tied loosely to a jetty. A man steps forward from it onto the jetty and the boat drifts away. Why?
        options:
        - He pushes the boat backward as the boat pushes him forward
        - The water pulls the boat
        - His weight leaves the boat
        - The jetty pushes the boat away
        answer: He pushes the boat backward as the boat pushes him forward
        difficulty: 3
        hints:
        - To move forward, his feet push on something.
        - What do his feet push?
        solution: 'Step 1: His feet push the boat backwards. Step 2: The boat pushes him forwards. Step 3: So he moves forward and the boat moves back.'
        mistakes:
          His weight leaves the boat: wall_pushes_back

  - code: phy9.laws.conservation
    title: Conservation of momentum
    after: [phy9.laws.momentum, phy9.laws.third_law]
    notes: |
      When no external force acts on a system, its total momentum stays constant:
      m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂. Total momentum before = total momentum after. A gun at rest
      has zero momentum, so after firing the bullet's forward momentum equals the gun's backward
      momentum (recoil): m_b v_b = m_g v_g.
    explanations:
      text: "Before a gun fires, gun and bullet are at rest: total momentum 0. After, the bullet flies forward with momentum mv. For the total to stay 0, the gun must move back with the same momentum. It is heavy, so it moves back slowly: that is the recoil."
      visual: "Two trolleys held together by a squeezed spring. Release them: they fly apart. Measure: the heavier trolley moves slower, and mass × speed is the same for both."
      step_by_step: "A 4 kg gun fires a 0.02 kg bullet at 400 m/s. Step 1: Bullet momentum = 0.02 × 400 = 8 kg m/s. Step 2: Gun momentum = 8 kg m/s backwards. Step 3: Recoil speed = 8 ÷ 4 = 2 m/s."
      real_world: "When you jump out of a small boat onto the shore, the boat moves backwards away from the shore."
    activity:
      type: formula
      prompt: A 4 kg gun fires a 0.02 kg bullet. Momentum is conserved, so the gun recoils.
      inputs:
      - name: vb
        label: Bullet speed
        min: 100
        max: 500
        step: 50
        start: 100
        unit: m/s
      outputs:
      - name: vg
        label: Gun recoil speed
        expr: 0.02*vb/4
        unit: m/s
        places: 2
      goals:
      - prompt: Make the gun recoil at 1.5 m/s.
        want:
          vg: 1.5
        mistakes:
        - when:
            vb:
            - 350
            - 500
          say: The gun is recoiling too fast. A faster bullet carries more momentum, so the gun kicks back harder.
    lesson:
      - teach: 'When two bodies push on each other and nothing outside acts on them, the total momentum stays the same. Momentum lost by one is gained by the other. This is the law of conservation of momentum: total momentum before = total momentum after.'
        check:
          prompt: Two trolleys collide with no outside force. What happens to their total momentum?
          options:
          - It stays the same
          - It becomes zero
          - It doubles
          answer: It stays the same
          why: With no external force, the total momentum is conserved.
      - teach: 'Example: a 2 kg trolley at 3 m/s hits a 1 kg trolley at rest and they stick. Before: 2 × 3 + 1 × 0 = 6 kg m/s. After: (2 + 1) × v = 6, so v = 2 m/s. Remember to add the masses when they move together.'
        picture:
          kind: flow
          steps:
          - 'Before: 2 × 3 + 1 × 0 = 6 kg m/s'
          - 'After: (2 + 1) × v'
          - 3v = 6, so v = 2 m/s
          alt: 'A 2 kg trolley at 3 m/s sticks to a 1 kg trolley: together they move at 2 m/s.'
        check:
          prompt: A 4 kg trolley at 2 m/s sticks to a 4 kg trolley at rest. What is their speed together?
          options:
          - 1 m/s
          - 2 m/s
          - 8 m/s
          answer: 1 m/s
          why: 'Momentum 8 kg m/s shared by 8 kg: 8 ÷ 8 = 1 m/s.'
      - teach: 'If everything starts at rest, total momentum is zero, so afterwards the two momenta must be equal and opposite. A gun at rest fires a bullet: m_bullet × v_bullet = m_gun × v_gun. The light bullet goes very fast; the heavy gun recoils slowly.'
        check:
          prompt: A 2 kg gun fires a 10 g bullet at 200 m/s. How fast does it recoil?
          options:
          - 1 m/s
          - 100 m/s
          - 2000 m/s
          answer: 1 m/s
          why: 0.01 × 200 = 2 kg m/s, and 2 ÷ 2 kg = 1 m/s backwards.
    items:
      - prompt: "A 4 kg gun fires a 20 g bullet at 400 m/s. What is the recoil speed of the gun, in m/s?"
        answer: "2"
        check: "Rational(20, 1000)*400/4"
        difficulty: 1
        hints: ["Bullet momentum = gun momentum.", "20 g = 0.02 kg."]
        solution: "Step 1: 0.02 × 400 = 8 kg m/s. Step 2: 8 ÷ 4 = 2 m/s backwards."
        mistakes: {"2000": grams_not_kg}
      - prompt: "A person jumps forward out of a boat onto the shore. What happens to the boat?"
        options: ["It moves backwards, away from the shore", "It moves forwards with the person", "It stays still", "It sinks a little and stays still"]
        answer: "It moves backwards, away from the shore"
        difficulty: 1
        hints: ["Total momentum was zero before the jump."]
        solution: "The person gains forward momentum, so the boat gains equal backward momentum."
        mistakes: {"It moves forwards with the person": recoil_direction}
      - prompt: "A 2 kg trolley at 3 m/s hits a 1 kg trolley at rest and they stick together. What is their common speed, in m/s?"
        answer: "2"
        check: "(2*3 + 1*0)/(2 + 1)"
        difficulty: 2
        hints: ["Momentum before = 6 kg m/s.", "Total mass after is 3 kg."]
        solution: "Step 1: Before: 2 × 3 = 6 kg m/s. Step 2: After: 3 × v = 6. Step 3: v = 2 m/s."
        mistakes: {"3": momentum_added}
      - prompt: "Two trolleys at rest are pushed apart by a spring. The 1 kg trolley moves at 6 m/s. How fast does the 3 kg trolley move, in m/s?"
        answer: "2"
        check: "1*6/3"
        difficulty: 2
        hints: ["Their momenta are equal and opposite."]
        solution: "3 × v = 1 × 6, so v = 2 m/s in the opposite direction."
        mistakes: {"18": mass_divided}
      - prompt: "A 50 kg skater at rest throws a 5 kg ball forward at 10 m/s. With what speed does the skater move backwards, in m/s?"
        answer: "1"
        check: "5*10/50"
        difficulty: 3
        hints: ["Ball momentum = 50 kg m/s."]
        solution: "Step 1: 5 × 10 = 50 kg m/s. Step 2: 50 ÷ 50 = 1 m/s backwards."
        mistakes: {"100": mass_divided}
      - prompt: "A 1 kg ball at 4 m/s hits a 1 kg ball at rest. The first ball stops. How fast does the second ball move, in m/s?"
        answer: "4"
        check: "(1*4 + 1*0 - 1*0)/1"
        difficulty: 3
        hints: ["Total momentum before = 4 kg m/s."]
        solution: "Momentum before = 4 kg m/s. After, the first ball has 0, so the second has 4 kg m/s: v = 4 m/s."
        mistakes: {"2": "momentum_transfer", "0": "momentum_transfer"}
      - prompt: "A 60 kg boy runs at 3 m/s and jumps onto a 40 kg cart at rest. How fast do the boy and cart move together, in m/s?"
        answer: "1.8"
        check: "60*3/(60+40)"
        difficulty: 3
        hints: ["Momentum before = 60 × 3.", "After, 100 kg moves together."]
        solution: "Step 1: Momentum before = 180 kg m/s. Step 2: After: 100 × v = 180. Step 3: v = 1.8 m/s."
        mistakes: {"4.5": combined_mass, "3": combined_mass, "1.2": combined_mass}
      - prompt: "A 2 kg trolley at 3 m/s and a 1 kg trolley at 3 m/s move towards each other, collide and stick together. What is their velocity afterwards, in m/s, in the direction the 2 kg trolley was going?"
        answer: "1"
        check: "(2*3 - 1*3)/3"
        difficulty: 3
        hints: ["Take the 2 kg trolley's direction as positive; the 1 kg trolley has −3 m/s.", "Total momentum ÷ total mass."]
        solution: "Step 1: Momentum before = 2 × 3 + 1 × (−3) = 3 kg m/s. Step 2: v = 3 ÷ 3 = 1 m/s."
        mistakes: {"3": opposite_momenta, "0": opposite_momenta}
      - prompt: "A 5 kg gun recoils at 1.2 m/s when it fires a bullet at 300 m/s. What is the mass of the bullet, in grams?"
        answer: "20"
        check: "5*1.2/300*1000"
        difficulty: 3
        hints: ["Gun's backward momentum = bullet's forward momentum.", "5 × 1.2 = m × 300; give m in grams."]
        solution: "Step 1: 5 × 1.2 = 6 kg m/s. Step 2: m = 6 ÷ 300 = 0.02 kg = 20 g."
        mistakes: {"0.02": grams_not_kg, "1250": mass_divided}
      - prompt: A 5 kg gun fires a 25 g bullet at 300 m/s. What is the gun's recoil speed, in m/s?
        answer: '1.5'
        check: 0.025*300/5
        difficulty: 1
        hints:
        - Bullet's momentum = gun's momentum.
        - 0.025 × 300 = 7.5 kg m/s.
        solution: 'Step 1: Bullet''s momentum = 0.025 × 300 = 7.5 kg m/s. Step 2: Gun''s momentum is equal and opposite. Step 3: v = 7.5 ÷ 5 = 1.5 m/s.'
        mistakes:
          '1500': grams_not_kg
      - prompt: A girl throws a heavy bag forward while standing on a skateboard. What happens to her?
        options:
        - She rolls backwards
        - She rolls forwards
        - She stays still
        - She moves sideways
        answer: She rolls backwards
        difficulty: 1
        hints:
        - Before the throw, total momentum is zero.
        - The bag gets forward momentum.
        solution: 'Step 1: Total momentum starts at zero. Step 2: The bag moves forward. Step 3: So she must move backwards to keep the total zero.'
        mistakes:
          She rolls forwards: recoil_direction
      - prompt: A 3 kg trolley at 4 m/s hits a 1 kg trolley at rest and they stick together. What is their common speed, in m/s?
        answer: '3'
        check: 3*4/(3 + 1)
        difficulty: 2
        hints:
        - Momentum before = 3 × 4 = 12 kg m/s.
        - Afterwards both masses move together.
        solution: 'Step 1: Before: 12 kg m/s. Step 2: After: (3 + 1) × v = 12. Step 3: v = 3 m/s.'
        mistakes:
          '4': combined_mass
          '12': combined_mass
      - prompt: Two skaters stand still and push apart. The 40 kg skater moves at 3 m/s. How fast does the 60 kg skater move, in m/s?
        answer: '2'
        check: 40*3/60
        difficulty: 2
        hints:
        - Their momenta must be equal and opposite.
        - 40 × 3 = 60 × v.
        solution: 'Step 1: Total momentum stays 0. Step 2: 40 × 3 = 60 × v. Step 3: v = 2 m/s, in the opposite direction.'
        mistakes:
          '4.5': mass_divided
      - prompt: A 1 kg ball at 6 m/s hits a 2 kg ball at rest. The first ball stops. How fast does the 2 kg ball move, in m/s?
        answer: '3'
        check: 1*6/2
        difficulty: 3
        hints:
        - All the momentum goes to the second ball.
        - 1 × 6 = 2 × v.
        solution: 'Step 1: Before: 6 kg m/s. Step 2: After: 2 × v. Step 3: v = 3 m/s.'
        mistakes:
          '6': momentum_transfer
          '12': mass_divided
      - prompt: A 3 kg trolley at 2 m/s and a 1 kg trolley at 4 m/s move towards each other and stick together. What is their speed afterwards, in m/s?
        answer: '0.5'
        check: (3*2 - 1*4)/4
        difficulty: 3
        hints:
        - 'Take one direction as positive: the 1 kg trolley''s momentum is negative.'
        - 3 × 2 − 1 × 4 = 2 kg m/s.
        solution: 'Step 1: Total momentum = 6 − 4 = 2 kg m/s. Step 2: Together the mass is 4 kg. Step 3: v = 2 ÷ 4 = 0.5 m/s, in the 3 kg trolley''s direction.'
        mistakes:
          '2.5': opposite_momenta
