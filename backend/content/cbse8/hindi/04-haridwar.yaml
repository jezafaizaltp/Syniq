    - पहाड़ की चोटी
    - बाज़ार
    answer: नदी किनारे बनी सीढ़ियाँ, जहाँ लोग स्नान करते हैं
    difficulty: 1
    hints:
    - हरिद्वार में लोग गंगा में यहाँ स्नान करते हैं।
    - यह नदी के किनारे होता है।
    solution: घाट नदी किनारे की सीढ़ियाँ हैं, जहाँ स्नान और पूजा होती है।
