subject: cbse8-hin
chapter: 4
title: हरिद्वार (पत्र)
tips:
  h8_dhara: "लेखक गंगा की तारीफ़ कर रहे हैं। पहाड़ से उतरी धारा कैसी होगी?"
  h8_ganga: "हरिद्वार वह जगह है जहाँ एक पवित्र नदी पहाड़ों से मैदान में आती है, 'हर की पौड़ी' पर।"
  h8_patra: "पाठ 'प्रिय...' से शुरू होता है और किसी को यात्रा का हाल लिखा गया है।"
  h8d_vidha: "पाठ किसी को संबोधित करके लिखा गया है और उसमें घूमने के अनुभव हैं। ऐसी रचना किस विधा की है?"
  h8d_arth: वाक्य में शब्द कहाँ आया है, उससे अर्थ समझो।
  h8d_varnan: लेखक ने हरिद्वार को सुंदर और पवित्र बताया है। कौन-सा विकल्प उससे मेल खाता है?
  h8d_lekhak: "भारतेंदु ने आधुनिक हिंदी गद्य की नींव रखी। नींव रखने वाले को किस शब्द से सम्मान दिया जाता है?"

concepts:
- code: cbse8h.m4.haridwar
  title: हरिद्वार (पत्र)
  notes: |
    लेखक: भारतेंदु हरिश्चंद्र (आधुनिक हिंदी के जनक)। यह एक पत्र के रूप में लिखा यात्रा-वर्णन है, जो उनकी पत्रिका
    'कविवचन सुधा' में छपा। लेखक हरिद्वार की यात्रा का वर्णन करते हैं: चारों ओर हरे-भरे पहाड़, पवित्र गंगा की
    निर्मल, शीतल और तेज़ धारा, घाटों पर स्नान, पेड़ों और लताओं की शोभा, शांत और पवित्र वातावरण। वे गंगा-तट पर
    भोजन और वहाँ के लोगों की सादगी का भी उल्लेख करते हैं। हरिद्वार उत्तराखंड में, गंगा के मैदान में प्रवेश-स्थल
    पर बसा तीर्थ है। विधा: पत्र / यात्रा-वृत्तांत।
  explanations:
    text: 'भारतेंदु हरिश्चंद्र ने पत्र के रूप में अपनी हरिद्वार-यात्रा का वर्णन किया है: हरे पहाड़, गंगा की निर्मल और तेज़ धारा, घाट, पेड़-लताएँ और शांत, पवित्र वातावरण। पढ़ते हुए लगता है जैसे हम स्वयं वहाँ हों।'
    visual: 'कल्पना कीजिए: हरे पहाड़ों के बीच बहती चमकीली, ठंडी गंगा, सीढ़ियों वाले घाट, स्नान करते लोग, और किनारे बैठे लेखक जो यह सब पत्र में लिख रहे हैं।'
    step_by_step: '1. विधा पहचानें: पत्र और यात्रा-वर्णन। 2. लेखक: भारतेंदु हरिश्चंद्र। 3. प्रकृति का वर्णन: पहाड़, गंगा, पेड़। 4. धार्मिक और सांस्कृतिक महत्त्व। 5. लेखक की भावना: शांति और आनंद।'
    real_world: आज लोग यात्रा के बाद ब्लॉग या वीडियो बनाते हैं; भारतेंदु ने वही काम पत्र लिखकर किया था।
  picture:
    kind: compare
    columns:
    - title: प्रकृति
      points:
      - हरे-भरे पहाड़
      - गंगा की निर्मल, तेज़ धारा
      - पेड़ और लताएँ
    - title: संस्कृति
      points:
      - पवित्र तीर्थ
      - घाटों पर स्नान
      - शांत, सादा वातावरण
    alt: हरिद्वार की प्रकृति (पहाड़, गंगा, पेड़-लताएँ) और संस्कृति (तीर्थ, घाट, सादगी) का वर्णन।
  activity:
    type: sort
    prompt: लेखक ने हरिद्वार में क्या देखा और यह पाठ किस रूप में लिखा है?
    bins:
    - हरिद्वार की प्रकृति
    - पाठ की विधा
    items:
    - label: चारों ओर हरे-भरे पहाड़
      bin: हरिद्वार की प्रकृति
      clue: यह जगह का वर्णन है या लिखने का ढंग?
      why: हरिद्वार का प्राकृतिक दृश्य।
    - label: गंगा की निर्मल, शीतल, तेज़ धारा
      bin: हरिद्वार की प्रकृति
      clue: लेखक नदी के बारे में क्या बताते हैं?
      why: गंगा का वर्णन।
    - label: पेड़ों और लताओं की शोभा
      bin: हरिद्वार की प्रकृति
      clue: यह दृश्य है या विधा?
      why: प्रकृति की शोभा।
    - label: पत्र के रूप में लिखा
      bin: पाठ की विधा
      clue: पाठ किस रूप में लिखा गया है?
      why: पत्र के रूप में लिखा यात्रा-वर्णन।
    - label: '''कविवचन सुधा'' पत्रिका में छपा'
      bin: पाठ की विधा
      clue: यह पाठ के छपने की बात है या हरिद्वार की?
      why: भारतेंदु की पत्रिका में छपा।
  lesson:
    - teach: '''हरिद्वार'' पाठ भारतेंदु हरिश्चंद्र ने लिखा है, जिन्हें आधुनिक हिंदी का जनक कहा जाता है। यह पत्र के रूप में लिखा यात्रा-वर्णन है, जो उनकी पत्रिका ''कविवचन सुधा'' में छपा।'
      check:
        prompt: यह पाठ किस रूप में लिखा गया है?
        options:
        - पत्र के रूप में यात्रा-वर्णन
        - कविता
        - नाटक
        answer: पत्र के रूप में यात्रा-वर्णन
        why: लेखक ने अपनी यात्रा पत्र लिखकर बताई।
    - teach: 'लेखक हरिद्वार का सुंदर वर्णन करते हैं: चारों ओर हरे-भरे पहाड़, गंगा की निर्मल, शीतल और तेज़ धारा, घाटों पर स्नान, पेड़ों और लताओं की शोभा, और शांत, पवित्र वातावरण।'
      picture:
        kind: compare
        columns:
        - title: प्रकृति
          points:
          - हरे-भरे पहाड़
          - गंगा की तेज़ धारा
          - पेड़ और लताएँ
        - title: आस्था
          points:
          - घाटों पर स्नान
          - पवित्र वातावरण
          - तीर्थ-स्थान
        alt: हरिद्वार में प्रकृति (पहाड़, गंगा, पेड़-लताएँ) और आस्था (घाट, स्नान, पवित्रता) दोनों हैं।
      check:
        prompt: '''निर्मल'' का अर्थ है:'
        options:
        - साफ़, स्वच्छ
        - गंदा
        - गहरा
        answer: साफ़, स्वच्छ
        why: गंगा का जल साफ़ और स्वच्छ बताया गया है।
    - teach: हरिद्वार उत्तराखंड में है, जहाँ गंगा पहाड़ों से निकलकर मैदान में प्रवेश करती है। लेखक वहाँ के लोगों की सादगी और गंगा-तट पर भोजन का भी उल्लेख करते हैं।
      check:
        prompt: हरिद्वार में गंगा कहाँ से कहाँ आती है?
        options:
        - पहाड़ों से मैदान में
        - समुद्र से पहाड़ में
        - रेगिस्तान से जंगल में
        answer: पहाड़ों से मैदान में
        why: हरिद्वार गंगा का मैदान में प्रवेश-द्वार है।
  items:
  - prompt: '''हरिद्वार'' पाठ के लेखक कौन हैं?'
    options:
    - भारतेंदु हरिश्चंद्र
    - भीष्म साहनी
    - सुभाषचंद्र बोस
    - कबीर
    answer: भारतेंदु हरिश्चंद्र
    difficulty: 1
    hints:
    - आधुनिक हिंदी के जनक।
    - '''कविवचन सुधा'' के संपादक।'
    solution: पाठ भारतेंदु हरिश्चंद्र का है।
    mistakes:
