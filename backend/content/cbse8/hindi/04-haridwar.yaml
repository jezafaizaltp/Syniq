    solution: हरिद्वार में समुद्र नहीं है; पहाड़ और गंगा का वर्णन है।
    mistakes:
      हरे-भरे पहाड़ों का: h8_dhara
      गंगा की धारा का: h8_dhara
  - prompt: '''यात्रा-वृत्तांत'' का अर्थ है:'
