subject: cbse8-hin
chapter: 4
title: हरिद्वार (पत्र)
concepts:
- code: cbse8h.m4.haridwar
  title: हरिद्वार (पत्र)
  notes: |
    लेखक: भारतेंदु हरिश्चंद्र (आधुनिक हिंदी के जनक)। यह एक पत्र के रूप में लिखा यात्रा-वर्णन है, जो उनकी पत्रिका
    'कविवचन सुधा' में छपा। लेखक हरिद्वार की यात्रा का वर्णन करते हैं: चारों ओर हरे-भरे पहाड़, पवित्र गंगा की
    निर्मल, शीतल और तेज़ धारा, घाटों पर स्नान, पेड़ों और लताओं की शोभा, शांत और पवित्र वातावरण। वे गंगा-तट पर
    भोजन और वहाँ के लोगों की सादगी का भी उल्लेख करते हैं। हरिद्वार उत्तराखंड में, गंगा के मैदान में प्रवेश-स्थल
    पर बसा तीर्थ है। विधा: पत्र / यात्रा-वृत्तांत।
  explanations:
    text: 'भारतेंदु हरिश्चंद्र ने पत्र के रूप में अपनी हरिद्वार-यात्रा का वर्णन किया है: हरे पहाड़, गंगा की निर्मल और तेज़ धारा, घाट, पेड़-लताएँ और शांत, पवित्र वातावरण। पढ़ते हुए लगता है जैसे हम स्वयं वहाँ हों।'
    visual: 'कल्पना कीजिए: हरे पहाड़ों के बीच बहती चमकीली, ठंडी गंगा, सीढ़ियों वाले घाट, स्नान करते लोग, और किनारे बैठे लेखक जो यह सब पत्र में लिख रहे हैं।'
    step_by_step: '1. विधा पहचानें: पत्र और यात्रा-वर्णन। 2. लेखक: भारतेंदु हरिश्चंद्र। 3. प्रकृति का वर्णन: पहाड़, गंगा, पेड़। 4. धार्मिक और सांस्कृतिक महत्त्व। 5. लेखक की भावना: शांति और आनंद।'
    real_world: आज लोग यात्रा के बाद ब्लॉग या वीडियो बनाते हैं; भारतेंदु ने वही काम पत्र लिखकर किया था।
  picture:
    kind: compare
    columns:
    - title: प्रकृति
      points:
      - हरे-भरे पहाड़
      - गंगा की निर्मल, तेज़ धारा
      - पेड़ और लताएँ
    - title: संस्कृति
      points:
      - पवित्र तीर्थ
      - घाटों पर स्नान
      - शांत, सादा वातावरण
    alt: हरिद्वार की प्रकृति (पहाड़, गंगा, पेड़-लताएँ) और संस्कृति (तीर्थ, घाट, सादगी) का वर्णन।
  items:
  - prompt: '''हरिद्वार'' पाठ के लेखक कौन हैं?'
    options:
    - भारतेंदु हरिश्चंद्र
    - भीष्म साहनी
    - सुभाषचंद्र बोस
    - कबीर
    answer: भारतेंदु हरिश्चंद्र
    difficulty: 1
    hints:
    - आधुनिक हिंदी के जनक।
    - '''कविवचन सुधा'' के संपादक।'
    solution: पाठ भारतेंदु हरिश्चंद्र का है।
    mistakes:
      सुभाषचंद्र बोस: hin8_read_again
  - prompt: यह पाठ किस विधा में लिखा गया है?
    options:
    - पत्र (यात्रा-वर्णन)
    - कविता
    - एकांकी
    - जीवनी
    answer: पत्र (यात्रा-वर्णन)
    difficulty: 1
    hints:
    - शीर्षक के साथ विधा दी है।
    - किसी को लिखा गया।
    solution: यह पत्र के रूप में लिखा यात्रा-वर्णन है।
  - prompt: हरिद्वार किस नदी के किनारे बसा है?
    options:
    - गंगा
    - यमुना
    - नर्मदा
    - गोदावरी
    answer: गंगा
    difficulty: 1
    hints:
    - पवित्र नदी।
    - पहाड़ों से मैदान में आती है।
    solution: हरिद्वार गंगा के तट पर है।
  - prompt: हरिद्वार किस राज्य में है?
    options:
    - उत्तराखंड
    - उत्तर प्रदेश
    - हिमाचल प्रदेश
    - बिहार
    answer: उत्तराखंड
    difficulty: 2
    hints:
    - पहाड़ी राज्य।
    - देहरादून इसकी राजधानी है।
    solution: हरिद्वार उत्तराखंड में है।
    mistakes:
      उत्तर प्रदेश: hin8_read_again
  - prompt: लेखक ने गंगा की धारा को कैसा बताया है?
    options:
    - निर्मल, शीतल और तेज़
    - गंदी और धीमी
    - सूखी
    - खारी
    answer: निर्मल, शीतल और तेज़
    difficulty: 1
    hints:
    - पहाड़ से उतरती नदी।
    - साफ़ और ठंडी।
    solution: लेखक गंगा की निर्मल, शीतल और वेगवती धारा का वर्णन करते हैं।
  - prompt: पाठ पढ़कर हरिद्वार के बारे में कौन-सी बात सबसे सही लगती है?
    options:
    - वह प्राकृतिक सौंदर्य और आस्था का स्थान है
    - वह एक रेगिस्तानी शहर है
    - वह समुद्र-तट पर है
    - वह एक बड़ा कारख़ाना-नगर है
    answer: वह प्राकृतिक सौंदर्य और आस्था का स्थान है
    difficulty: 2
    hints:
    - पहाड़, गंगा, घाट।
    - तीर्थ-स्थान।
    solution: पाठ हरिद्वार की प्राकृतिक सुंदरता और धार्मिक महत्त्व दोनों दिखाता है।
    mistakes:
      वह एक बड़ा कारख़ाना-नगर है: hin8_whole
