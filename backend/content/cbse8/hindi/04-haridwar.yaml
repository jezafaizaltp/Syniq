    - तीर्थ-स्थान।
    solution: पाठ हरिद्वार की प्राकृतिक सुंदरता और धार्मिक महत्त्व दोनों दिखाता है।
    mistakes:
      वह एक बड़ा कारख़ाना-नगर है: hin8_whole
  - prompt: भारतेंदु हरिश्चंद्र को क्या कहा जाता है?
    options:
    - आधुनिक हिंदी का जनक
    - राष्ट्रकवि
    - भारत कोकिला
    answer: आधुनिक हिंदी का जनक
    difficulty: 2
    hints:
    - उन्होंने आधुनिक हिंदी गद्य को नई दिशा दी।
    - '''जनक'' यानी पिता, शुरू करने वाला।'
    solution: भारतेंदु को आधुनिक हिंदी का जनक कहा जाता है।
    mistakes:
      राष्ट्रकवि: h8d_lekhak
      भारत कोकिला: h8d_lekhak
  - prompt: यह पाठ किस पत्रिका में छपा था?
