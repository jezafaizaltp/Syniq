subject: cbse8-hin
chapter: 6
title: एक टोकरी भर मिट्टी (कहानी)
tips:
  h8_ahata: "ज़मींदार के पास महल था। झोंपड़ी उसके महल के पास थी।"
  h8_bhaari: "एक टोकरी मिट्टी शरीर से ज़्यादा मन पर भारी पड़ी।"
  h8_chulha: "विधवा की पोती खाना नहीं खा रही थी। वह अपने पुराने घर की मिट्टी से क्या बनाना चाहती थी?"
  h8_prashn: "विधवा ने एक टोकरी की तुलना पूरी झोंपड़ी की ज़मीन से की।"
  h8t_kram: 'कहानी को शुरू से दोहराओ: पहले क्या हुआ, फिर क्या?'
  h8t_arth: वाक्य में शब्द कहाँ आया है, उससे अर्थ समझो।
  h8t_paatra: पात्र ने क्या किया और क्यों, उसे याद करो।
  h8t_bhaav: विधवा का सवाल केवल मिट्टी के बारे में नहीं, अन्याय के बोझ के बारे में है।

concepts:
- code: cbse8h.m6.tokri
  title: एक टोकरी भर मिट्टी (कहानी)
  notes: |
    लेखक: माधवराव सप्रे (इसे हिंदी की पहली कहानियों में गिना जाता है)। एक ज़मींदार अपने महल का अहाता बढ़ाना
    चाहता है। पास में एक गरीब, अनाथ बूढ़ी विधवा की झोंपड़ी है, जहाँ उसके पति और बेटे की यादें हैं और अब केवल
    उसकी छोटी पोती उसके साथ है। वह झोंपड़ी नहीं छोड़ना चाहती। ज़मींदार अदालत से कब्ज़ा ले लेता है। विधवा एक दिन
    आकर विनती करती है कि उसे झोंपड़ी से एक टोकरी भर मिट्टी ले जाने दें, ताकि उससे चूल्हा बनाए और पोती को
    रोटी खिला सके, क्योंकि पोती ने झोंपड़ी छोड़ने के बाद खाना छोड़ दिया है। वह ज़मींदार से टोकरी उठवाने में मदद
    माँगती है, पर वह उसे हिला भी नहीं पाता। विधवा कहती है: जब एक टोकरी मिट्टी का भार नहीं उठा सकते, तो इस
    पूरी ज़मीन का भार जन्म भर कैसे उठाओगे? ज़मींदार को पश्चाताप होता है और वह झोंपड़ी लौटा देता है।
  explanations:
    text: 'एक ज़मींदार गरीब बूढ़ी विधवा की झोंपड़ी छीन लेता है। विधवा केवल एक टोकरी मिट्टी माँगती है, और जब ज़मींदार वह टोकरी उठा नहीं पाता, तो वह पूछती है: एक टोकरी नहीं उठा सकते, तो पूरी ज़मीन का भार कैसे उठाओगे? ज़मींदार को अपनी ग़लती समझ आती है और वह झोंपड़ी लौटा देता है।'
    visual: 'कल्पना कीजिए: एक बड़े महल के पास छोटी-सी झोंपड़ी, मिट्टी से भरी टोकरी उठाने की कोशिश में झुका ज़मींदार, और पास खड़ी शांत बूढ़ी विधवा।'
    step_by_step: '1. ज़मींदार की इच्छा: अहाता बढ़ाना। 2. विधवा का झोंपड़ी से लगाव: पति, बेटे की यादें, पोती। 3. अदालत से कब्ज़ा। 4. एक टोकरी मिट्टी की माँग। 5. टोकरी न उठा पाना और ज़मींदार का पश्चाताप।'
    real_world: किसी का घर केवल ईंट-मिट्टी नहीं, यादों और भावनाओं का स्थान होता है; दूसरों से कुछ लेने से पहले उनकी भावना समझनी चाहिए।
  picture:
    kind: flow
    steps:
    - ज़मींदार अहाता बढ़ाना चाहता है
    - विधवा झोंपड़ी नहीं छोड़ना चाहती
    - अदालत से ज़मींदार कब्ज़ा ले लेता है
    - विधवा एक टोकरी मिट्टी माँगती है
    - ज़मींदार टोकरी नहीं उठा पाता और झोंपड़ी लौटा देता है
    alt: 'कहानी का क्रम: ज़मींदार की इच्छा, विधवा का लगाव, अदालत का फ़ैसला, एक टोकरी मिट्टी की माँग, और ज़मींदार का पश्चाताप।'
  activity:
    type: order
    prompt: कहानी की घटनाएँ क्रम से लगाओ।
    steps:
    - ज़मींदार अहाता बढ़ाना चाहता है
    - विधवा झोंपड़ी नहीं छोड़ती
    - अदालत से ज़मींदार कब्ज़ा लेता है
    - विधवा एक टोकरी मिट्टी माँगती है
    - ज़मींदार टोकरी हिला भी नहीं पाता
    reasons:
      विधवा झोंपड़ी नहीं छोड़ती: झगड़ा तभी शुरू हुआ जब ज़मींदार को उसकी ज़मीन चाहिए थी।
      अदालत से ज़मींदार कब्ज़ा लेता है: विधवा के मना करने पर ही वह अदालत गया।
      विधवा एक टोकरी मिट्टी माँगती है: कब्ज़े के बाद झोंपड़ी उसकी नहीं रही, इसलिए माँगना पड़ा।
      ज़मींदार टोकरी हिला भी नहीं पाता: 'विधवा ने टोकरी उठवाने में मदद माँगी: तब यह हुआ।'
  lesson:
    - teach: '''एक टोकरी भर मिट्टी'' माधवराव सप्रे की कहानी है, जिसे हिंदी की पहली कहानियों में गिना जाता है। एक ज़मींदार अपने महल का अहाता बढ़ाना चाहता है। पास में एक गरीब बूढ़ी विधवा की झोंपड़ी है, जहाँ उसके पति और बेटे की यादें हैं। अब केवल उसकी छोटी पोती उसके साथ है।'
      check:
        prompt: '''अहाता'' का अर्थ क्या है?'
        options:
        - घर के चारों ओर घिरी ज़मीन
        - रसोई
        - नदी का किनारा
        answer: घर के चारों ओर घिरी ज़मीन
        why: ज़मींदार अपनी घिरी ज़मीन बड़ी करना चाहता था।
    - teach: विधवा झोंपड़ी नहीं छोड़ना चाहती, पर ज़मींदार अदालत से कब्ज़ा ले लेता है। पोती झोंपड़ी छोड़ने के बाद खाना छोड़ देती है। विधवा विनती करती है कि उसे झोंपड़ी से एक टोकरी मिट्टी ले जाने दें, ताकि चूल्हा बनाकर पोती को रोटी खिला सके।
      picture:
        kind: flow
        steps:
        - ज़मींदार झोंपड़ी चाहता है
        - अदालत से कब्ज़ा
        - विधवा टोकरी भर मिट्टी माँगती है
        - ज़मींदार टोकरी नहीं उठा पाता
        - पछतावा, झोंपड़ी लौटाई
        alt: ज़मींदार झोंपड़ी लेता है, विधवा मिट्टी माँगती है, ज़मींदार टोकरी नहीं उठा पाता, पछताता है और झोंपड़ी लौटा देता है।
      check:
        prompt: विधवा मिट्टी से क्या बनाना चाहती थी?
        options:
        - चूल्हा
        - मूर्ति
        - दीवार
        answer: चूल्हा
        why: चूल्हे पर रोटी बनाकर पोती को खिलाने के लिए।
    - teach: 'वह ज़मींदार से टोकरी उठवाने में मदद माँगती है, पर वह उसे हिला भी नहीं पाता। विधवा पूछती है: एक टोकरी मिट्टी नहीं उठा सकते, तो पूरी ज़मीन का भार जन्म भर कैसे उठाओगे? ज़मींदार को पश्चाताप होता है और वह झोंपड़ी लौटा देता है।'
      check:
        prompt: '''पश्चाताप'' का अर्थ है:'
        options:
        - अपनी गलती पर पछतावा
        - खुशी
        - गुस्सा
        answer: अपनी गलती पर पछतावा
        why: ज़मींदार को अपने अन्याय पर पछतावा हुआ।
  items:
  - prompt: '''एक टोकरी भर मिट्टी'' कहानी के लेखक कौन हैं?'
    options:
    - माधवराव सप्रे
    - भीष्म साहनी
    - प्रेमचंद
    - भारतेंदु हरिश्चंद्र
    answer: माधवराव सप्रे
    difficulty: 1
    hints:
    - हिंदी की आरंभिक कहानियों के लेखक।
    - मराठी-भाषी, पर हिंदी में लिखा।
    solution: कहानी माधवराव सप्रे की है।
    mistakes:
      प्रेमचंद: hin8_read_again
  - prompt: ज़मींदार विधवा की झोंपड़ी क्यों लेना चाहता था?
    options:
    - अपने महल का अहाता बढ़ाने के लिए
    - उसमें रहने के लिए
    - उसे बेचने के लिए
    - वहाँ खेत बनाने के लिए
    answer: अपने महल का अहाता बढ़ाने के लिए
    difficulty: 1
    hints:
    - झोंपड़ी महल के पास थी।
    - जगह चाहिए थी।
    solution: वह महल का अहाता बढ़ाना चाहता था।
    mistakes: {"उसमें रहने के लिए": "h8_ahata"}
  - prompt: विधवा टोकरी भर मिट्टी क्यों ले जाना चाहती थी?
    options:
    - चूल्हा बनाकर पोती को रोटी खिलाने के लिए
    - बेचने के लिए
    - बगीचा बनाने के लिए
    - ज़मींदार को चिढ़ाने के लिए
    answer: चूल्हा बनाकर पोती को रोटी खिलाने के लिए
    difficulty: 1
    hints:
    - पोती ने खाना छोड़ दिया था।
    - उसी मिट्टी का चूल्हा।
    solution: पोती झोंपड़ी छोड़ने के बाद खाना नहीं खा रही थी; विधवा उसी मिट्टी से चूल्हा बनाना चाहती थी।
    mistakes: {"बेचने के लिए": "h8_chulha"}
  - prompt: ज़मींदार टोकरी क्यों नहीं उठा सका?
    options:
    - टोकरी बहुत भारी थी, और उसका मन भी भारी हो गया था
    - उसके हाथ में चोट थी
    - टोकरी टूटी हुई थी
    - विधवा ने रोक दिया
    answer: टोकरी बहुत भारी थी, और उसका मन भी भारी हो गया था
    difficulty: 2
    hints:
    - शाब्दिक और भावनात्मक भार दोनों।
    - विधवा का प्रश्न सोचें।
    solution: टोकरी भारी थी; और विधवा के प्रश्न ने उसके अपराध का भार भी दिखा दिया।
    mistakes: {"उसके हाथ में चोट थी": "h8_bhaari"}
  - prompt: विधवा ने ज़मींदार से क्या प्रश्न किया?
    options:
    - एक टोकरी नहीं उठा सकते तो पूरी ज़मीन का भार कैसे उठाओगे?
    - मुझे पैसे कब दोगे?
    - अदालत क्यों गए?
    - महल कब बनेगा?
    answer: एक टोकरी नहीं उठा सकते तो पूरी ज़मीन का भार कैसे उठाओगे?
    difficulty: 2
    hints:
    - कहानी का सबसे महत्त्वपूर्ण वाक्य।
    - भार का अर्थ।
    solution: उसका प्रश्न ज़मींदार को उसके अन्याय का बोध कराता है।
    mistakes: {"मुझे पैसे कब दोगे?": "h8_prashn"}
  - prompt: कहानी के अंत में क्या होता है?
    options:
    - ज़मींदार पछताकर झोंपड़ी लौटा देता है
    - विधवा गाँव छोड़ देती है
    - ज़मींदार महल बना लेता है
    - अदालत फिर फ़ैसला देती है
    answer: ज़मींदार पछताकर झोंपड़ी लौटा देता है
    difficulty: 1
    hints:
    - उसका हृदय बदल गया।
    - पश्चाताप।
    solution: ज़मींदार को पश्चाताप होता है और वह विधवा को झोंपड़ी लौटा देता है।
    mistakes:
      ज़मींदार महल बना लेता है: hin8_whole
  - prompt: विधवा झोंपड़ी क्यों नहीं छोड़ना चाहती थी?
    options:
    - उसमें उसके पति और बेटे की यादें थीं
    - वह बहुत बड़ी थी
    - उसमें सोना छिपा था
    answer: उसमें उसके पति और बेटे की यादें थीं
    difficulty: 2
    hints:
    - झोंपड़ी उसके लिए केवल घर नहीं थी।
    - उसके परिवार के लोग अब नहीं रहे।
    solution: झोंपड़ी में उसके प्रियजनों की यादें बसी थीं।
    mistakes:
      वह बहुत बड़ी थी: h8t_paatra
      उसमें सोना छिपा था: h8t_paatra
  - prompt: ज़मींदार ने झोंपड़ी पर कब्ज़ा कैसे किया?
    options:
    - अदालत के ज़रिए
    - खरीदकर
    - विधवा से उपहार में पाकर
    answer: अदालत के ज़रिए
    difficulty: 2
    hints:
    - विधवा उसे बेचना नहीं चाहती थी।
    - धनी व्यक्ति ने कानून का सहारा लिया।
    solution: ज़मींदार ने अदालत से झोंपड़ी पर कब्ज़ा ले लिया।
    mistakes:
      खरीदकर: h8t_kram
      विधवा से उपहार में पाकर: h8t_kram
  - prompt: पोती ने खाना क्यों छोड़ दिया था?
    options:
    - झोंपड़ी छूटने का दुख था
    - वह बीमार थी
    - खाना अच्छा नहीं था
    answer: झोंपड़ी छूटने का दुख था
    difficulty: 2
    hints:
    - यह झोंपड़ी छोड़ने के बाद हुआ।
    - बच्ची को अपना घर याद आता था।
    solution: अपना घर छूटने के दुख से पोती ने खाना छोड़ दिया।
    mistakes:
      वह बीमार थी: h8t_paatra
      खाना अच्छा नहीं था: h8t_paatra
  - prompt: शुरू में ज़मींदार कैसा था?
    options:
    - स्वार्थी और कठोर
    - दयालु
    - गरीब
    answer: स्वार्थी और कठोर
    difficulty: 1
    hints:
