subject: cbse8-hin
chapter: 5
title: कबीर के दोहे
tips:
  h8_bani: "कबीर कहते हैं ऐसी बोली बोलो कि सुनने वाले और बोलने वाले दोनों का मन ठंडा हो।"
  h8_dhai_akhar: "कबीर कहते हैं पोथियाँ पढ़कर कोई पंडित नहीं बना। 'प्रेम' शब्द में ढाई अक्षर हैं।"
  h8_doha: "'दोहा' शब्द में ही संख्या छिपी है।"
  h8_kal: "'काल' यानी कल। कबीर कहते हैं कल वाला काम कब करो?"
  h8_nindak: "निंदक हमारी बुराई करता है। इससे हम अपनी कमियाँ कैसे सुधारते हैं?"

concepts:
- code: cbse8h.m5.kabir
  title: कबीर के दोहे
  notes: |
    कबीर (15वीं सदी के संत कवि) की सधुक्कड़ी भाषा में दोहे। दोहा दो पंक्तियों का छंद है। मुख्य शिक्षाएँ:
    गुरु की महिमा ("गुरु गोविंद दोऊ खड़े, काके लागूँ पाँय। बलिहारी गुरु आपने, गोविंद दियो बताय।"); मीठी वाणी
    ("ऐसी बानी बोलिए, मन का आपा खोय। औरन को सीतल करै, आपहु सीतल होय।"); निंदक को पास रखो, वह बिना पानी-साबुन
    स्वभाव निर्मल करता है; कल का काम आज करो ("काल करै सो आज कर"); धैर्य ("धीरे-धीरे रे मना, धीरे सब कुछ होय");
    सच्चा ज्ञान पोथी पढ़ने से नहीं, प्रेम से ("ढाई आखर प्रेम का, पढ़ै सो पंडित होय")। जाति नहीं, ज्ञान पूछो।
  explanations:
    text: 'कबीर के दोहे दो पंक्तियों में जीवन की बड़ी बातें कहते हैं: गुरु का आदर करो, मीठा बोलो, कल का काम आज करो, धीरज रखो, और याद रखो कि प्रेम के ढाई अक्षर पढ़ने वाला ही सच्चा ज्ञानी है।'
    visual: 'कल्पना कीजिए: एक जुलाहा करघे पर कपड़ा बुनते हुए दोहे गा रहा है, और हर दोहा एक छोटा दीपक है जो एक बात रोशन करता है: गुरु, वाणी, धैर्य, प्रेम।'
    step_by_step: 1. दोहा पढ़ें। 2. कठिन शब्दों के अर्थ समझें (गोविंद, बानी, आपा)। 3. सरल भाषा में भाव लिखें। 4. आज के जीवन से एक उदाहरण जोड़ें।
    real_world: 'परीक्षा से पहले ''काल करै सो आज कर'' याद रखना काम आता है: आज का पाठ आज ही दोहरा लें।'
  picture:
    kind: compare
    columns:
    - title: दोहा
      points:
      - गुरु गोविंद दोऊ खड़े
      - ऐसी बानी बोलिए
      - काल करै सो आज कर
      - धीरे-धीरे रे मना
    - title: शिक्षा
      points:
      - गुरु ने ही ईश्वर तक पहुँचाया
      - मीठी वाणी सबको शीतल करती है
      - काम टालो मत
      - धैर्य रखो, सब समय पर होता है
    alt: 'कबीर के चार दोहे और उनकी शिक्षाएँ: गुरु का आदर, मीठी वाणी, काम न टालना, और धैर्य।'
  items:
  - prompt: '''दोहा'' कितनी पंक्तियों का छंद होता है?'
    options:
    - दो
    - चार
    - छह
    - आठ
    answer: दो
    difficulty: 1
    hints:
    - '''दो'' शब्द से जुड़ा।'
    - बहुत छोटा छंद।
    solution: दोहा दो पंक्तियों का छंद है।
    mistakes: {"चार": "h8_doha"}
  - prompt: '''गुरु गोविंद दोऊ खड़े'' दोहे में कबीर पहले किसे प्रणाम करते हैं?'
    options:
    - गुरु को
    - गोविंद को
    - माता को
    - राजा को
    answer: गुरु को
    difficulty: 1
    hints:
    - '''बलिहारी गुरु आपने''।'
    - गुरु ने ही गोविंद को बताया।
    solution: गुरु ने ही ईश्वर का ज्ञान दिया, इसलिए पहले गुरु को प्रणाम।
    mistakes:
      गोविंद को: hin8_poem_meaning
  - prompt: '''ऐसी बानी बोलिए'' दोहे में कैसी वाणी बोलने को कहा गया है?'
    options:
    - जो दूसरों को और स्वयं को शीतल करे
    - ऊँची और कठोर
    - बहुत तेज़
    - केवल सच, चाहे कड़वा हो
    answer: जो दूसरों को और स्वयं को शीतल करे
    difficulty: 1
    hints:
    - '''औरन को सीतल करै''।'
    - मीठी वाणी।
    solution: मीठी वाणी सुनने वाले और बोलने वाले, दोनों को शांति देती है।
    mistakes: {"ऊँची और कठोर": "h8_bani"}
  - prompt: '''काल करै सो आज कर'' का अर्थ है:'
    options:
    - कल का काम आज ही करो
    - काम कल पर टालो
    - आराम करो
    - समय बर्बाद करो
    answer: कल का काम आज ही करो
    difficulty: 1
    hints:
    - '''काल'' = कल।'
    - टालना नहीं।
    solution: काम को टालना नहीं चाहिए; कल का काम आज और आज का अभी करो।
    mistakes: {"काम कल पर टालो": "h8_kal"}
  - prompt: '''ढाई आखर प्रेम का, पढ़ै सो पंडित होय'' का भाव है:'
    options:
    - सच्चा ज्ञानी वह है जो प्रेम को समझता है
    - पंडित बनने के लिए बहुत पोथियाँ पढ़ो
    - ढाई अक्षर लिखना कठिन है
    - प्रेम व्यर्थ है
    answer: सच्चा ज्ञानी वह है जो प्रेम को समझता है
    difficulty: 2
    hints:
    - पोथी पढ़कर कोई पंडित नहीं हुआ।
    - '''प्रेम'' के ढाई अक्षर।'
    solution: किताबी ज्ञान से नहीं, प्रेम को समझने से मनुष्य सच्चा ज्ञानी बनता है।
    mistakes: {"पंडित बनने के लिए बहुत पोथियाँ पढ़ो": "h8_dhai_akhar"}
  - prompt: कबीर निंदक को पास रखने की सलाह क्यों देते हैं?
    options:
    - वह हमारी कमियाँ बताकर स्वभाव निर्मल करता है
    - वह हमारी प्रशंसा करता है
    - वह हमें धन देता है
    - वह हमारा काम करता है
    answer: वह हमारी कमियाँ बताकर स्वभाव निर्मल करता है
    difficulty: 2
    hints:
    - बिना पानी-साबुन…
    - कमियाँ सुधरती हैं।
    solution: निंदक हमारी कमियाँ दिखाता है, जिससे हम सुधरते हैं।
    mistakes: {"वह हमारी प्रशंसा करता है": "h8_nindak"}
