subject: cbse8-hin
chapter: 5
title: कबीर के दोहे
tips:
  h8_bani: "कबीर कहते हैं ऐसी बोली बोलो कि सुनने वाले और बोलने वाले दोनों का मन ठंडा हो।"
  h8_dhai_akhar: "कबीर कहते हैं पोथियाँ पढ़कर कोई पंडित नहीं बना। 'प्रेम' शब्द में ढाई अक्षर हैं।"
  h8_doha: "'दोहा' शब्द में ही संख्या छिपी है।"
  h8_kal: "'काल' यानी कल। कबीर कहते हैं कल वाला काम कब करो?"
  h8_nindak: "निंदक हमारी बुराई करता है। इससे हम अपनी कमियाँ कैसे सुधारते हैं?"
  h8k_bhav: 'दोहे का सीधा अर्थ नहीं, उसकी सीख सोचो: कबीर क्या करने को कह रहे हैं?'
  h8k_shabd: दोहे में शब्द कहाँ आया है, उससे अर्थ समझो। कबीर की भाषा में शब्द थोड़े बदले रूप में आते हैं।
  h8k_doha: दोहे का हर चरण गिनती से बनता है। पहले और तीसरे चरण में 13, दूसरे और चौथे में 11 मात्राएँ।

concepts:
- code: cbse8h.m5.kabir
  title: कबीर के दोहे
  notes: |
    कबीर (15वीं सदी के संत कवि) की सधुक्कड़ी भाषा में दोहे। दोहा दो पंक्तियों का छंद है। मुख्य शिक्षाएँ:
    गुरु की महिमा ("गुरु गोविंद दोऊ खड़े, काके लागूँ पाँय। बलिहारी गुरु आपने, गोविंद दियो बताय।"); मीठी वाणी
    ("ऐसी बानी बोलिए, मन का आपा खोय। औरन को सीतल करै, आपहु सीतल होय।"); निंदक को पास रखो, वह बिना पानी-साबुन
    स्वभाव निर्मल करता है; कल का काम आज करो ("काल करै सो आज कर"); धैर्य ("धीरे-धीरे रे मना, धीरे सब कुछ होय");
    सच्चा ज्ञान पोथी पढ़ने से नहीं, प्रेम से ("ढाई आखर प्रेम का, पढ़ै सो पंडित होय")। जाति नहीं, ज्ञान पूछो।
  explanations:
    text: 'कबीर के दोहे दो पंक्तियों में जीवन की बड़ी बातें कहते हैं: गुरु का आदर करो, मीठा बोलो, कल का काम आज करो, धीरज रखो, और याद रखो कि प्रेम के ढाई अक्षर पढ़ने वाला ही सच्चा ज्ञानी है।'
    visual: 'कल्पना कीजिए: एक जुलाहा करघे पर कपड़ा बुनते हुए दोहे गा रहा है, और हर दोहा एक छोटा दीपक है जो एक बात रोशन करता है: गुरु, वाणी, धैर्य, प्रेम।'
    step_by_step: 1. दोहा पढ़ें। 2. कठिन शब्दों के अर्थ समझें (गोविंद, बानी, आपा)। 3. सरल भाषा में भाव लिखें। 4. आज के जीवन से एक उदाहरण जोड़ें।
    real_world: 'परीक्षा से पहले ''काल करै सो आज कर'' याद रखना काम आता है: आज का पाठ आज ही दोहरा लें।'
  picture:
    kind: compare
    columns:
    - title: दोहा
      points:
      - गुरु गोविंद दोऊ खड़े
      - ऐसी बानी बोलिए
      - काल करै सो आज कर
      - धीरे-धीरे रे मना
    - title: शिक्षा
      points:
      - गुरु ने ही ईश्वर तक पहुँचाया
      - मीठी वाणी सबको शीतल करती है
      - काम टालो मत
      - धैर्य रखो, सब समय पर होता है
    alt: 'कबीर के चार दोहे और उनकी शिक्षाएँ: गुरु का आदर, मीठी वाणी, काम न टालना, और धैर्य।'
  activity:
    type: sort
    prompt: कबीर का कौन-सा दोहा किस सीख का है?
    bins:
    - गुरु की महिमा
    - मीठी वाणी
    - समय और धैर्य
    - सच्चा ज्ञान
    items:
    - label: गुरु गोविंद दोऊ खड़े, काके लागूँ पाँय
      bin: गुरु की महिमा
      clue: पहले किसके पाँव लगें?
      why: गुरु ने गोविंद को बताया, इसलिए गुरु बड़े।
    - label: ऐसी बानी बोलिए, मन का आपा खोय
      bin: मीठी वाणी
      clue: कैसी बोली दूसरों को शीतल करती है?
      why: मीठी वाणी की सीख।
    - label: काल करै सो आज कर
      bin: समय और धैर्य
      clue: कल का काम कब करना चाहिए?
      why: समय का मूल्य।
    - label: धीरे-धीरे रे मना, धीरे सब कुछ होय
      bin: समय और धैर्य
      clue: सब कुछ कैसे होता है?
      why: धैर्य की सीख।
    - label: ढाई आखर प्रेम का, पढ़ै सो पंडित होय
      bin: सच्चा ज्ञान
      clue: पोथी से बड़ा ज्ञान कौन-सा?
      why: प्रेम ही सच्चा ज्ञान।
  lesson:
    - teach: 'कबीर 15वीं सदी के संत कवि थे। उन्होंने सधुक्कड़ी भाषा में दोहे लिखे। दोहा दो पंक्तियों का छंद है। कबीर जाति-पाँति और दिखावे के विरोधी थे: ''जाति न पूछो साधु की, पूछ लीजिए ज्ञान।'''
      check:
        prompt: कबीर के अनुसार साधु से क्या पूछना चाहिए?
        options:
        - उसका ज्ञान
        - उसकी जाति
        - उसका धन
        answer: उसका ज्ञान
        why: कबीर जाति को नहीं, ज्ञान को महत्व देते हैं।
    - teach: 'गुरु की महिमा: ''गुरु गोविंद दोऊ खड़े, काके लागूँ पाँय। बलिहारी गुरु आपने, गोविंद दियो बताय।'' गुरु ने ही भगवान का रास्ता दिखाया, इसलिए पहले गुरु को प्रणाम। मीठी वाणी: ''ऐसी बानी बोलिए, मन का आपा खोय। औरन को सीतल करै, आपहु सीतल होय।'''
      check:
        prompt: '''आपा खोना'' का अर्थ यहाँ है:'
        options:
        - घमंड छोड़ना
        - रास्ता भूलना
        - सो जाना
        answer: घमंड छोड़ना
        why: मन का अहंकार छोड़कर मीठा बोलो।
    - teach: 'और सीखें: निंदक को पास रखो, वह बिना पानी-साबुन स्वभाव साफ़ करता है; ''काल करै सो आज कर'': समय मत गँवाओ; ''धीरे-धीरे रे मना, धीरे सब कुछ होय'': धैर्य रखो; ''ढाई आखर प्रेम का, पढ़ै सो पंडित होय'': प्रेम समझने वाला ही सच्चा ज्ञानी है।'
      picture:
        kind: compare
        columns:
        - title: दोहे की पंक्ति
          points:
          - काल करै सो आज कर
          - धीरे-धीरे रे मना
          - ढाई आखर प्रेम का
        - title: सीख
          points:
          - आज का काम आज
          - धैर्य रखो
          - प्रेम ही सच्चा ज्ञान
        alt: 'काल करै सो आज कर: आज का काम आज; धीरे-धीरे रे मना: धैर्य; ढाई आखर प्रेम का: प्रेम ही ज्ञान।'
      check:
        prompt: '''धीरे-धीरे रे मना, धीरे सब कुछ होय'' क्या सिखाता है?'
        options:
        - धैर्य रखना
        - जल्दबाज़ी करना
        - आलस करना
        answer: धैर्य रखना
        why: हर काम अपने समय पर होता है।
  items:
  - prompt: '''दोहा'' कितनी पंक्तियों का छंद होता है?'
    options:
    - दो
    - चार
    - छह
    - आठ
    answer: दो
    difficulty: 1
    hints:
    - '''दो'' शब्द से जुड़ा।'
    - बहुत छोटा छंद।
    solution: दोहा दो पंक्तियों का छंद है।
    mistakes: {"चार": "h8_doha"}
  - prompt: '''गुरु गोविंद दोऊ खड़े'' दोहे में कबीर पहले किसे प्रणाम करते हैं?'
    options:
    - गुरु को
    - गोविंद को
    - माता को
    - राजा को
    answer: गुरु को
    difficulty: 1
    hints:
    - '''बलिहारी गुरु आपने''।'
    - गुरु ने ही गोविंद को बताया।
    solution: गुरु ने ही ईश्वर का ज्ञान दिया, इसलिए पहले गुरु को प्रणाम।
    mistakes:
      गोविंद को: hin8_poem_meaning
  - prompt: '''ऐसी बानी बोलिए'' दोहे में कैसी वाणी बोलने को कहा गया है?'
    options:
    - जो दूसरों को और स्वयं को शीतल करे
    - ऊँची और कठोर
    - बहुत तेज़
    - केवल सच, चाहे कड़वा हो
    answer: जो दूसरों को और स्वयं को शीतल करे
    difficulty: 1
    hints:
    - '''औरन को सीतल करै''।'
    - मीठी वाणी।
    solution: मीठी वाणी सुनने वाले और बोलने वाले, दोनों को शांति देती है।
    mistakes: {"ऊँची और कठोर": "h8_bani"}
  - prompt: '''काल करै सो आज कर'' का अर्थ है:'
    options:
    - कल का काम आज ही करो
    - काम कल पर टालो
    - आराम करो
    - समय बर्बाद करो
    answer: कल का काम आज ही करो
    difficulty: 1
    hints:
    - '''काल'' = कल।'
    - टालना नहीं।
    solution: काम को टालना नहीं चाहिए; कल का काम आज और आज का अभी करो।
    mistakes: {"काम कल पर टालो": "h8_kal"}
  - prompt: '''ढाई आखर प्रेम का, पढ़ै सो पंडित होय'' का भाव है:'
    options:
    - सच्चा ज्ञानी वह है जो प्रेम को समझता है
    - पंडित बनने के लिए बहुत पोथियाँ पढ़ो
    - ढाई अक्षर लिखना कठिन है
    - प्रेम व्यर्थ है
    answer: सच्चा ज्ञानी वह है जो प्रेम को समझता है
    difficulty: 2
    hints:
    - पोथी पढ़कर कोई पंडित नहीं हुआ।
    - '''प्रेम'' के ढाई अक्षर।'
    solution: किताबी ज्ञान से नहीं, प्रेम को समझने से मनुष्य सच्चा ज्ञानी बनता है।
    mistakes: {"पंडित बनने के लिए बहुत पोथियाँ पढ़ो": "h8_dhai_akhar"}
  - prompt: कबीर निंदक को पास रखने की सलाह क्यों देते हैं?
    options:
    - वह हमारी कमियाँ बताकर स्वभाव निर्मल करता है
    - वह हमारी प्रशंसा करता है
    - वह हमें धन देता है
    - वह हमारा काम करता है
    answer: वह हमारी कमियाँ बताकर स्वभाव निर्मल करता है
    difficulty: 2
    hints:
    - बिना पानी-साबुन…
    - कमियाँ सुधरती हैं।
    solution: निंदक हमारी कमियाँ दिखाता है, जिससे हम सुधरते हैं।
    mistakes: {"वह हमारी प्रशंसा करता है": "h8_nindak"}
  - prompt: कबीर ने किस भाषा में दोहे लिखे?
    options:
    - सधुक्कड़ी
    - संस्कृत
    - अंग्रेज़ी
    answer: सधुक्कड़ी
    difficulty: 2
    hints:
    - यह कई बोलियों की मिली-जुली भाषा है।
    - साधु-संतों की भाषा से इसका नाम बना।
    solution: कबीर की भाषा सधुक्कड़ी कहलाती है, जिसमें कई बोलियाँ मिली हैं।
    mistakes:
      संस्कृत: h8k_shabd
      अंग्रेज़ी: h8k_shabd
  - prompt: '''बानी'' शब्द का अर्थ है:'
    options:
    - वाणी, बोली
    - पानी
    - बाग
    answer: वाणी, बोली
    difficulty: 1
    hints:
    - '''ऐसी बानी बोलिए'' में यह आया है।'
    - जो बोली जाती है।
    solution: बानी = वाणी या बोली।
    mistakes:
      पानी: h8k_shabd
      बाग: h8k_shabd
  - prompt: कबीर किसे सबसे पहले प्रणाम करने को कहते हैं, और क्यों?
    options:
    - गुरु को, क्योंकि उन्होंने भगवान का रास्ता बताया
    - राजा को, क्योंकि वह धनी है
    - स्वयं को, क्योंकि हम सबसे बड़े हैं
    answer: गुरु को, क्योंकि उन्होंने भगवान का रास्ता बताया
    difficulty: 2
    hints:
    - दोहे में दोनों कौन खड़े हैं?
    - '''गोविंद दियो बताय'' पर ध्यान दो।'
    solution: गुरु ने गोविंद का ज्ञान दिया, इसलिए पहले गुरु को प्रणाम।
    mistakes:
      राजा को, क्योंकि वह धनी है: h8k_bhav
      स्वयं को, क्योंकि हम सबसे बड़े हैं: h8k_bhav
  - prompt: '''निंदक'' किसे कहते हैं?'
    options:
    - जो हमारी कमियाँ बताए या बुराई करे
    - जो हमेशा तारीफ़ करे
    - जो सोता रहे
    answer: जो हमारी कमियाँ बताए या बुराई करे
    difficulty: 2
    hints:
    - कबीर उसे आँगन में कुटिया बनाकर पास रखने को कहते हैं।
    - वह बिना साबुन स्वभाव साफ़ करता है।
    solution: निंदक हमारी कमियाँ बताता है, जिससे हम सुधरते हैं।
    mistakes:
      जो हमेशा तारीफ़ करे: h8_nindak
      जो सोता रहे: h8_nindak
  - prompt: '''ढाई आखर'' में ''आखर'' का अर्थ है:'
    options:
    - अक्षर
    - आँख
    - आकाश
    answer: अक्षर
    difficulty: 2
    hints:
    - '''प्रेम'' शब्द को लिखकर देखो: उसमें ढाई क्या गिने जाते हैं?'
    - पढ़ने-लिखने से जुड़ा शब्द।
    solution: आखर = अक्षर; 'प्रेम' में ढाई अक्षर माने जाते हैं।
    mistakes:
      आँख: h8k_shabd
      आकाश: h8k_shabd
  - prompt: आज के जीवन में 'काल करै सो आज कर' का पालन कैसे होगा?
    options:
    - गृहकार्य उसी दिन पूरा करना
    - परीक्षा से एक रात पहले पढ़ना
    - हर काम कल पर टालना
    answer: गृहकार्य उसी दिन पूरा करना
    difficulty: 1
    hints:
    - कबीर काम टालने से मना करते हैं।
    - कौन-सा विकल्प काम समय पर करता है?
    solution: काम को समय पर करना ही इस दोहे की सीख है।
    mistakes:
      परीक्षा से एक रात पहले पढ़ना: h8_kal
      हर काम कल पर टालना: h8_kal
  - prompt: मीठी वाणी से किसे शीतलता मिलती है?
    options:
    - सुनने वाले को और बोलने वाले को भी
    - केवल सुनने वाले को
    - किसी को नहीं
    answer: सुनने वाले को और बोलने वाले को भी
    difficulty: 2
    hints:
    - '''औरन को सीतल करै, आपहु सीतल होय।'''
    - '''आपहु'' का अर्थ है स्वयं भी।'
    solution: मीठी वाणी दूसरों को और स्वयं को भी शांति देती है।
    mistakes:
      केवल सुनने वाले को: h8k_bhav
      किसी को नहीं: h8k_bhav
