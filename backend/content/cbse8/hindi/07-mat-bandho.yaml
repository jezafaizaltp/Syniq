subject: cbse8-hin
chapter: 7
title: मत बाँधो (कविता)
tips:
  h8_man_sapne: "कविता बाहरी रस्सी की नहीं, भीतर की उड़ान की बात करती है।"
  h8_reetiyan: "कविता के अनुसार सपनों को पुराने कड़े नियम और भय बाँधते हैं।"
  h8_swatantrata: "'मत बाँधो' यानी बंधन मत डालो। बंधन के उलट क्या है?"
  h8_vilom: "विलोम उलटा अर्थ होता है। कसना तो बाँधने जैसा ही है।"
  h8m_pratik: कविता में हवा, नदी, पक्षी और प्रकाश किस गुण के कारण आए हैं? सब खुले में ही खिलते हैं।
  h8m_vilom: "'स्व' (अपना) का उलटा 'पर' (दूसरा) होता है। दो विकल्प तो समान अर्थ वाले हैं।"
  h8m_arth: वाक्य में शब्द कहाँ आया है, उससे अर्थ समझो।
  h8m_bhav: कवयित्री मन और सपनों के लिए क्या चाहती हैं? पूरी कविता का स्वर याद करो।
  h8m_kavi: यह कविता छायावाद की प्रमुख कवयित्री की है, जिन्हें 'आधुनिक मीरा' भी कहा जाता है।

concepts:
- code: cbse8h.m7.matbandho
  title: मत बाँधो (कविता)
  notes: |
    कविता का भाव: स्वतंत्रता। कवयित्री (महादेवी वर्मा) कहती हैं कि मन, सपनों और विचारों को बंधनों में मत
    बाँधो। जैसे पक्षी, हवा, नदी और प्रकाश खुले में ही पूरी तरह खिलते हैं, वैसे ही मनुष्य की कल्पना और प्रतिभा
    भी आज़ादी में ही बढ़ती है। कठोर रीतियाँ, डर और रोक-टोक सपनों की उड़ान रोक देते हैं। संदेश: सपनों को उड़ने दो,
    खुले मन से सोचो, और दूसरों की स्वतंत्रता का भी सम्मान करो।
  explanations:
    text: 'यह कविता कहती है: मन और सपनों को मत बाँधो। जैसे पक्षी आकाश में और नदी खुले रास्ते पर ही अच्छी लगती है, वैसे ही हमारी कल्पना और प्रतिभा आज़ादी में ही बढ़ती है।'
    visual: 'कल्पना कीजिए: पिंजरे का दरवाज़ा खुलता है और एक पक्षी खुले आकाश में उड़ जाता है; नीचे एक नदी बिना रुकावट बह रही है।'
    step_by_step: '1. शीर्षक का अर्थ: बंधन में मत डालो। 2. प्रतीक पहचानें: पक्षी, नदी, हवा। 3. देखें कि किन बंधनों की बात है: रीतियाँ, डर। 4. संदेश: सपनों और विचारों की स्वतंत्रता।'
    real_world: जब किसी बच्चे को अपनी रुचि (चित्रकला, खेल, विज्ञान) चुनने की आज़ादी मिलती है, तो उसकी प्रतिभा सबसे अच्छी तरह खिलती है।
  picture:
    kind: compare
    columns:
    - title: बंधन
      points:
      - पिंजरा
      - कठोर रीतियाँ
      - डर और रोक-टोक
    - title: स्वतंत्रता
      points:
      - खुला आकाश
      - सपनों की उड़ान
      - खुला मन
    alt: बंधन (पिंजरा, कठोर रीतियाँ, डर) और स्वतंत्रता (खुला आकाश, सपनों की उड़ान, खुला मन) की तुलना।
  activity:
    type: sort
    prompt: कविता में किसे खुला छोड़ने की बात है और क्या बंधन है?
    bins:
    - जो खुले में खिलते हैं
    - बंधन
    items:
    - label: पक्षी
      bin: जो खुले में खिलते हैं
      clue: पक्षी कहाँ पूरी तरह खिलता है?
      why: पक्षी आज़ादी में उड़ता है।
    - label: नदी
      bin: जो खुले में खिलते हैं
      clue: नदी को बाँधा जाए तो?
      why: नदी बहकर ही नदी है।
    - label: सपने और कल्पना
      bin: जो खुले में खिलते हैं
      clue: कवयित्री किसे न बाँधने को कहती हैं?
      why: सपनों की उड़ान आज़ादी में।
    - label: कठोर रीतियाँ
      bin: बंधन
      clue: सपनों की उड़ान कौन रोकता है?
      why: कठोर रीतियाँ बंधन हैं।
    - label: डर और रोक-टोक
      bin: बंधन
      clue: यह आज़ादी है या बंधन?
      why: डर और रोक-टोक सपनों को रोकते हैं।
  lesson:
    - teach: '''मत बाँधो'' महादेवी वर्मा की कविता है। इसका भाव है स्वतंत्रता। कवयित्री कहती हैं कि मन, सपनों और विचारों को बंधनों में मत बाँधो।'
      check:
        prompt: कविता किसे न बाँधने को कहती है?
        options:
        - मन और सपनों को
        - पशुओं को
        - नावों को
        answer: मन और सपनों को
        why: कविता विचारों और सपनों की आज़ादी की बात करती है।
    - teach: 'जैसे पक्षी, हवा, नदी और प्रकाश खुले में ही पूरी तरह खिलते हैं, वैसे ही मनुष्य की कल्पना और प्रतिभा भी आज़ादी में बढ़ती है। ये प्रकृति के प्रतीक हैं: खुलेपन के उदाहरण।'
      picture:
        kind: compare
        columns:
        - title: खुले में
          points:
          - पक्षी उड़ता है
          - नदी बहती है
          - प्रकाश फैलता है
        - title: बंधन में
          points:
          - पंख रुक जाते हैं
          - पानी ठहर जाता है
          - अँधेरा रहता है
        alt: खुले में पक्षी उड़ता, नदी बहती, प्रकाश फैलता है; बंधन में सब रुक जाता है।
      check:
        prompt: कविता में पक्षी किसका प्रतीक है?
        options:
        - स्वतंत्र मन का
        - डर का
        - भोजन का
        answer: स्वतंत्र मन का
        why: पक्षी खुले आकाश में उड़ता है, जैसे आज़ाद मन।
    - teach: 'कठोर रीतियाँ, डर और रोक-टोक सपनों की उड़ान रोक देते हैं। संदेश: सपनों को उड़ने दो, खुले मन से सोचो, और दूसरों की स्वतंत्रता का भी सम्मान करो।'
      check:
        prompt: कविता दूसरों के बारे में क्या सिखाती है?
        options:
        - उनकी स्वतंत्रता का सम्मान करो
        - उन पर रोक लगाओ
        - उनसे डरो
        answer: उनकी स्वतंत्रता का सम्मान करो
        why: जैसे हमें आज़ादी चाहिए, वैसे ही दूसरों को भी।
  items:
  - prompt: '''मत बाँधो'' कविता का मुख्य भाव क्या है?'
