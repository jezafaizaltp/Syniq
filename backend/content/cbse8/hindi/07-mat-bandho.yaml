concepts:
- code: cbse8h.m7.matbandho
  title: मत बाँधो (कविता)
  notes: |
    कविता का भाव: स्वतंत्रता। कवयित्री (महादेवी वर्मा) कहती हैं कि मन, सपनों और विचारों को बंधनों में मत
    बाँधो। जैसे पक्षी, हवा, नदी और प्रकाश खुले में ही पूरी तरह खिलते हैं, वैसे ही मनुष्य की कल्पना और प्रतिभा
    भी आज़ादी में ही बढ़ती है। कठोर रीतियाँ, डर और रोक-टोक सपनों की उड़ान रोक देते हैं। संदेश: सपनों को उड़ने दो,
    खुले मन से सोचो, और दूसरों की स्वतंत्रता का भी सम्मान करो।
  explanations:
    text: 'यह कविता कहती है: मन और सपनों को मत बाँधो। जैसे पक्षी आकाश में और नदी खुले रास्ते पर ही अच्छी लगती है, वैसे ही हमारी कल्पना और प्रतिभा आज़ादी में ही बढ़ती है।'
    visual: 'कल्पना कीजिए: पिंजरे का दरवाज़ा खुलता है और एक पक्षी खुले आकाश में उड़ जाता है; नीचे एक नदी बिना रुकावट बह रही है।'
    step_by_step: '1. शीर्षक का अर्थ: बंधन में मत डालो। 2. प्रतीक पहचानें: पक्षी, नदी, हवा। 3. देखें कि किन बंधनों की बात है: रीतियाँ, डर। 4. संदेश: सपनों और विचारों की स्वतंत्रता।'
    real_world: जब किसी बच्चे को अपनी रुचि (चित्रकला, खेल, विज्ञान) चुनने की आज़ादी मिलती है, तो उसकी प्रतिभा सबसे अच्छी तरह खिलती है।
  picture:
    kind: compare
    columns:
    - title: बंधन
      points:
      - पिंजरा
      - कठोर रीतियाँ
      - डर और रोक-टोक
    - title: स्वतंत्रता
      points:
      - खुला आकाश
      - सपनों की उड़ान
      - खुला मन
    alt: बंधन (पिंजरा, कठोर रीतियाँ, डर) और स्वतंत्रता (खुला आकाश, सपनों की उड़ान, खुला मन) की तुलना।
  activity:
    type: sort
    prompt: कविता में किसे खुला छोड़ने की बात है और क्या बंधन है?
    bins:
    - जो खुले में खिलते हैं
    - बंधन
    items:
    - label: पक्षी
      bin: जो खुले में खिलते हैं
      clue: पक्षी कहाँ पूरी तरह खिलता है?
      why: पक्षी आज़ादी में उड़ता है।
    - label: नदी
      bin: जो खुले में खिलते हैं
      clue: नदी को बाँधा जाए तो?
      why: नदी बहकर ही नदी है।
    - label: सपने और कल्पना
      bin: जो खुले में खिलते हैं
      clue: कवयित्री किसे न बाँधने को कहती हैं?
      why: सपनों की उड़ान आज़ादी में।
    - label: कठोर रीतियाँ
      bin: बंधन
      clue: सपनों की उड़ान कौन रोकता है?
      why: कठोर रीतियाँ बंधन हैं।
    - label: डर और रोक-टोक
      bin: बंधन
      clue: यह आज़ादी है या बंधन?
      why: डर और रोक-टोक सपनों को रोकते हैं।
  items:
  - prompt: '''मत बाँधो'' कविता का मुख्य भाव क्या है?'
    options:
    - स्वतंत्रता
    - डर
    - युद्ध
    - दुख
    answer: स्वतंत्रता
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - बंधन का उलटा।
    solution: कविता मन और सपनों की स्वतंत्रता की बात करती है।
    mistakes: {"डर": "h8_swatantrata"}
  - prompt: कविता के अनुसार किसे बंधन में नहीं बाँधना चाहिए?
    options:
    - मन और सपनों को
    - पशुओं को
    - पेड़ों को
    - घर को
    answer: मन और सपनों को
    difficulty: 1
    hints:
    - कविता भीतर की बात कहती है।
    - कल्पना और विचार।
    solution: कविता कहती है कि मन, सपनों और विचारों को न बाँधो।
    mistakes: {"पशुओं को": "h8_man_sapne"}
  - prompt: कविता में पक्षी किसका प्रतीक है?
    options:
    - स्वतंत्र मन और सपनों का
    - भोजन का
    - डर का
    - बंधन का
    answer: स्वतंत्र मन और सपनों का
    difficulty: 2
    hints:
    - पक्षी आकाश में उड़ता है।
    - उड़ान = सपने।
    solution: उड़ता पक्षी स्वतंत्र मन और सपनों की उड़ान का प्रतीक है।
    mistakes:
      बंधन का: hin8_poem_meaning
  - prompt: '''बाँधना'' शब्द का विलोम है:'
    options:
    - खोलना
    - कसना
    - रोकना
    - पकड़ना
    answer: खोलना
    difficulty: 1
    hints:
    - उलटा अर्थ।
    - बंधन हटाना।
    solution: बाँधना का विलोम खोलना है।
    mistakes: {"कसना": "h8_vilom"}
  - prompt: सपनों की उड़ान को कौन-सी चीज़ रोकती है?
    options:
    - कठोर रीतियाँ और डर
    - पढ़ाई
    - खेल
    - दोस्ती
    answer: कठोर रीतियाँ और डर
    difficulty: 2
    hints:
    - बंधन किस रूप में आते हैं?
    - रोक-टोक।
    solution: कठोर रीतियाँ, डर और रोक-टोक सपनों को रोकते हैं।
    mistakes: {"पढ़ाई": "h8_reetiyan"}
  - prompt: कविता हमें क्या सिखाती है?
    options:
    - सपनों को उड़ने दो और दूसरों की स्वतंत्रता का सम्मान करो
    - हमेशा नियम तोड़ो
    - सपने देखना बेकार है
    - घर से बाहर मत निकलो
    answer: सपनों को उड़ने दो और दूसरों की स्वतंत्रता का सम्मान करो
    difficulty: 2
    hints:
    - स्वतंत्रता अपनी भी, दूसरों की भी।
    - नियम तोड़ना नहीं।
    solution: कविता खुले मन और सबकी स्वतंत्रता के सम्मान की सीख देती है।
    mistakes:
      हमेशा नियम तोड़ो: hin8_whole
