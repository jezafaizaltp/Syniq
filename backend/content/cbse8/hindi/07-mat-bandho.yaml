subject: cbse8-hin
chapter: 7
title: मत बाँधो (कविता)
tips:
  h8_man_sapne: "कविता बाहरी रस्सी की नहीं, भीतर की उड़ान की बात करती है।"
  h8_reetiyan: "कविता के अनुसार सपनों को पुराने कड़े नियम और भय बाँधते हैं।"
  h8_swatantrata: "'मत बाँधो' यानी बंधन मत डालो। बंधन के उलट क्या है?"
  h8_vilom: "विलोम उलटा अर्थ होता है। कसना तो बाँधने जैसा ही है।"
  h8m_pratik: कविता में हवा, नदी, पक्षी और प्रकाश किस गुण के कारण आए हैं? सब खुले में ही खिलते हैं।
  h8m_vilom: "'स्व' (अपना) का उलटा 'पर' (दूसरा) होता है। दो विकल्प तो समान अर्थ वाले हैं।"
  h8m_arth: वाक्य में शब्द कहाँ आया है, उससे अर्थ समझो।
  h8m_bhav: कवयित्री मन और सपनों के लिए क्या चाहती हैं? पूरी कविता का स्वर याद करो।
  h8m_kavi: यह कविता छायावाद की प्रमुख कवयित्री की है, जिन्हें 'आधुनिक मीरा' भी कहा जाता है।

concepts:
- code: cbse8h.m7.matbandho
  title: मत बाँधो (कविता)
  notes: |
    कविता का भाव: स्वतंत्रता। कवयित्री (महादेवी वर्मा) कहती हैं कि मन, सपनों और विचारों को बंधनों में मत
    बाँधो। जैसे पक्षी, हवा, नदी और प्रकाश खुले में ही पूरी तरह खिलते हैं, वैसे ही मनुष्य की कल्पना और प्रतिभा
    भी आज़ादी में ही बढ़ती है। कठोर रीतियाँ, डर और रोक-टोक सपनों की उड़ान रोक देते हैं। संदेश: सपनों को उड़ने दो,
    खुले मन से सोचो, और दूसरों की स्वतंत्रता का भी सम्मान करो।
  explanations:
    text: 'यह कविता कहती है: मन और सपनों को मत बाँधो। जैसे पक्षी आकाश में और नदी खुले रास्ते पर ही अच्छी लगती है, वैसे ही हमारी कल्पना और प्रतिभा आज़ादी में ही बढ़ती है।'
    visual: 'कल्पना कीजिए: पिंजरे का दरवाज़ा खुलता है और एक पक्षी खुले आकाश में उड़ जाता है; नीचे एक नदी बिना रुकावट बह रही है।'
    step_by_step: '1. शीर्षक का अर्थ: बंधन में मत डालो। 2. प्रतीक पहचानें: पक्षी, नदी, हवा। 3. देखें कि किन बंधनों की बात है: रीतियाँ, डर। 4. संदेश: सपनों और विचारों की स्वतंत्रता।'
    real_world: जब किसी बच्चे को अपनी रुचि (चित्रकला, खेल, विज्ञान) चुनने की आज़ादी मिलती है, तो उसकी प्रतिभा सबसे अच्छी तरह खिलती है।
  picture:
    kind: compare
    columns:
    - title: बंधन
      points:
      - पिंजरा
      - कठोर रीतियाँ
      - डर और रोक-टोक
    - title: स्वतंत्रता
      points:
      - खुला आकाश
      - सपनों की उड़ान
      - खुला मन
    alt: बंधन (पिंजरा, कठोर रीतियाँ, डर) और स्वतंत्रता (खुला आकाश, सपनों की उड़ान, खुला मन) की तुलना।
  activity:
    type: sort
    prompt: कविता में किसे खुला छोड़ने की बात है और क्या बंधन है?
    bins:
    - जो खुले में खिलते हैं
    - बंधन
    items:
    - label: पक्षी
      bin: जो खुले में खिलते हैं
      clue: पक्षी कहाँ पूरी तरह खिलता है?
      why: पक्षी आज़ादी में उड़ता है।
    - label: नदी
      bin: जो खुले में खिलते हैं
      clue: नदी को बाँधा जाए तो?
      why: नदी बहकर ही नदी है।
    - label: सपने और कल्पना
      bin: जो खुले में खिलते हैं
      clue: कवयित्री किसे न बाँधने को कहती हैं?
      why: सपनों की उड़ान आज़ादी में।
    - label: कठोर रीतियाँ
      bin: बंधन
      clue: सपनों की उड़ान कौन रोकता है?
      why: कठोर रीतियाँ बंधन हैं।
    - label: डर और रोक-टोक
      bin: बंधन
      clue: यह आज़ादी है या बंधन?
      why: डर और रोक-टोक सपनों को रोकते हैं।
  lesson:
    - teach: '''मत बाँधो'' महादेवी वर्मा की कविता है। इसका भाव है स्वतंत्रता। कवयित्री कहती हैं कि मन, सपनों और विचारों को बंधनों में मत बाँधो।'
      check:
        prompt: कविता किसे न बाँधने को कहती है?
        options:
        - मन और सपनों को
        - पशुओं को
        - नावों को
        answer: मन और सपनों को
        why: कविता विचारों और सपनों की आज़ादी की बात करती है।
      ways:
      - style: visual
        teach: कविता किसे बाँधने से मना करती है, और यह किसकी रचना है।
        picture:
          kind: compare
          columns:
          - title: किसे मत बाँधो
            points:
            - मन
            - सपने
            - विचार
          - title: कविता की पहचान
            points:
            - 'कवयित्री: महादेवी वर्मा'
            - 'भाव: स्वतंत्रता'
          alt: कविता कहती है कि मन, सपनों और विचारों को मत बाँधो; यह महादेवी वर्मा की रचना है और इसका भाव स्वतंत्रता है।
      - style: real_world
        teach: पिंजरे का पक्षी दाना-पानी पाकर भी उड़ना भूल जाता है। जिस बच्चे से हर बात पर कहा जाए 'यह मत सोचो, वह मत पूछो', उसका मन भी धीरे-धीरे सवाल करना छोड़ देता है। कविता इसी बंधन के विरुद्ध है।
    - teach: 'जैसे पक्षी, हवा, नदी और प्रकाश खुले में ही पूरी तरह खिलते हैं, वैसे ही मनुष्य की कल्पना और प्रतिभा भी आज़ादी में बढ़ती है। ये प्रकृति के प्रतीक हैं: खुलेपन के उदाहरण।'
      picture:
        kind: compare
        columns:
        - title: खुले में
          points:
          - पक्षी उड़ता है
          - नदी बहती है
          - प्रकाश फैलता है
        - title: बंधन में
          points:
          - पंख रुक जाते हैं
          - पानी ठहर जाता है
          - अँधेरा रहता है
        alt: खुले में पक्षी उड़ता, नदी बहती, प्रकाश फैलता है; बंधन में सब रुक जाता है।
      check:
        prompt: 'जाँचो: कविता में पक्षी किसका प्रतीक है?'
        options:
        - स्वतंत्र मन का
        - डर का
        - भोजन का
        answer: स्वतंत्र मन का
        why: पक्षी खुले आकाश में उड़ता है, जैसे आज़ाद मन।
      ways:
      - style: step_by_step
        teach: 'पहला: प्रकृति के चार उदाहरण देखो: पक्षी, हवा, नदी और प्रकाश। दूसरा: इनमें समान बात खोजो: सब खुले में ही पूरी तरह खिलते हैं। तीसरा: अब मनुष्य की कल्पना और प्रतिभा को इनके साथ रखो। चौथा: ये प्रतीक बताते हैं कि प्रतिभा भी आज़ादी में ही बढ़ती है।'
      - style: real_world
        teach: पौधे को छोटे गमले में रखो तो वह छोटा रह जाता है; उसी को खुली ज़मीन में लगा दो तो पेड़ बन जाता है। कल्पना और प्रतिभा के साथ भी ऐसा ही होता है।
    - teach: 'कठोर रीतियाँ, डर और रोक-टोक सपनों की उड़ान रोक देते हैं। संदेश: सपनों को उड़ने दो, खुले मन से सोचो, और दूसरों की स्वतंत्रता का भी सम्मान करो।'
      check:
        prompt: कविता दूसरों के बारे में क्या सिखाती है?
        options:
        - उनकी स्वतंत्रता का सम्मान करो
        - उन पर रोक लगाओ
        - उनसे डरो
        answer: उनकी स्वतंत्रता का सम्मान करो
        why: जैसे हमें आज़ादी चाहिए, वैसे ही दूसरों को भी।
      ways:
      - style: visual
        teach: सपनों को क्या रोकता है, और कविता क्या करने को कहती है।
        picture:
          kind: compare
          columns:
          - title: जो सपनों को रोकता है
            points:
            - कठोर रीतियाँ
            - डर
            - रोक-टोक
          - title: कविता का संदेश
            points:
            - सपनों को उड़ने दो
            - खुले मन से सोचो
            - दूसरों की स्वतंत्रता का भी सम्मान करो
          alt: कठोर रीतियाँ, डर और रोक-टोक सपनों को रोकते हैं; कविता कहती है कि सपनों को उड़ने दो, खुले मन से सोचो और दूसरों की स्वतंत्रता का सम्मान करो।
      - style: real_world
        teach: खेल के मैदान में हर खिलाड़ी को खेलने की आज़ादी है, पर इतनी नहीं कि वह दूसरे को धक्का दे। अपनी स्वतंत्रता तभी टिकती है जब हम दूसरों की स्वतंत्रता का भी सम्मान करें।
  items:
  - prompt: '''मत बाँधो'' कविता का मुख्य भाव क्या है?'
    options:
    - स्वतंत्रता
    - डर
    - युद्ध
    - दुख
    answer: स्वतंत्रता
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - बंधन का उलटा।
    solution: कविता मन और सपनों की स्वतंत्रता की बात करती है।
    mistakes: {"डर": "h8_swatantrata"}
  - prompt: कविता के अनुसार किसे बंधन में नहीं बाँधना चाहिए?
    options:
    - मन और सपनों को
    - पशुओं को
    - पेड़ों को
    - घर को
    answer: मन और सपनों को
    difficulty: 1
    hints:
    - कविता भीतर की बात कहती है।
    - कल्पना और विचार।
    solution: कविता कहती है कि मन, सपनों और विचारों को न बाँधो।
    mistakes: {"पशुओं को": "h8_man_sapne"}
  - prompt: कविता में पक्षी किसका प्रतीक है?
    options:
    - स्वतंत्र मन और सपनों का
    - भोजन का
    - डर का
    - बंधन का
    answer: स्वतंत्र मन और सपनों का
    difficulty: 2
    hints:
    - पक्षी आकाश में उड़ता है।
    - उड़ान = सपने।
    solution: उड़ता पक्षी स्वतंत्र मन और सपनों की उड़ान का प्रतीक है।
    mistakes:
      बंधन का: hin8_poem_meaning
  - prompt: '''बाँधना'' शब्द का विलोम है:'
    options:
    - खोलना
    - कसना
    - रोकना
    - पकड़ना
    answer: खोलना
    difficulty: 1
    hints:
    - उलटा अर्थ।
    - बंधन हटाना।
    solution: बाँधना का विलोम खोलना है।
    mistakes: {"कसना": "h8_vilom"}
  - prompt: सपनों की उड़ान को कौन-सी चीज़ रोकती है?
    options:
    - कठोर रीतियाँ और डर
    - पढ़ाई
    - खेल
    - दोस्ती
    answer: कठोर रीतियाँ और डर
    difficulty: 2
    hints:
    - बंधन किस रूप में आते हैं?
    - रोक-टोक।
    solution: कठोर रीतियाँ, डर और रोक-टोक सपनों को रोकते हैं।
    mistakes: {"पढ़ाई": "h8_reetiyan"}
  - prompt: कविता हमें क्या सिखाती है?
    options:
    - "सपनों को उड़ने दो और दूसरों की स्वतंत्रता का सम्मान करो"
    - "हमेशा हर नियम तोड़ो, चाहे उससे किसी का नुकसान हो"
    - "सपने देखना बेकार है, उनसे कुछ हासिल नहीं होता"
    - "घर से कभी बाहर मत निकलो, बाहर ख़तरा ही ख़तरा है"
    answer: सपनों को उड़ने दो और दूसरों की स्वतंत्रता का सम्मान करो
    difficulty: 2
    hints:
    - स्वतंत्रता अपनी भी, दूसरों की भी।
    - नियम तोड़ना नहीं।
    solution: कविता खुले मन और सबकी स्वतंत्रता के सम्मान की सीख देती है।
    mistakes:
      "हमेशा हर नियम तोड़ो, चाहे उससे किसी का नुकसान हो": hin8_whole
  - prompt: '''मत बाँधो'' कविता की रचनाकार कौन हैं?'
    options:
    - महादेवी वर्मा
    - सुभद्राकुमारी चौहान
    - मीराबाई
    answer: महादेवी वर्मा
    difficulty: 1
    hints:
    - वे छायावाद की प्रमुख कवयित्री हैं।
    - उन्हें 'आधुनिक मीरा' कहा जाता है।
    solution: कविता महादेवी वर्मा की है।
    mistakes:
      सुभद्राकुमारी चौहान: h8m_kavi
      मीराबाई: h8m_kavi
  - prompt: '''स्वतंत्रता'' शब्द का विलोम है:'
    options:
    - परतंत्रता
    - स्वाधीनता
    - आज़ादी
    answer: परतंत्रता
    difficulty: 2
    hints:
    - '''स्व'' (अपना) का उलटा ''पर'' (दूसरा) है।'
    - दो विकल्प तो समानार्थी हैं।
    solution: स्वतंत्रता का विलोम परतंत्रता है।
    mistakes:
      स्वाधीनता: h8m_vilom
      आज़ादी: h8m_vilom
  - prompt: नदी को बाँध दिया जाए तो उसके पानी का क्या होगा, कविता के भाव के अनुसार?
    options:
    - "वह ठहर जाएगा और बहना रुक जाएगा"
    - "वह पहले से और भी तेज़ बहने लगेगा"
    - "वह अपने आप मीठा और साफ़ हो जाएगा"
    answer: वह ठहर जाएगा और बहना रुक जाएगा
    difficulty: 2
    hints:
    - कविता में बंधन से चीज़ें रुक जाती हैं।
    - बहना नदी का स्वभाव है।
    solution: बंधन से नदी का स्वाभाविक बहाव रुक जाता है, जैसे सपनों की उड़ान।
    mistakes:
      "वह पहले से और भी तेज़ बहने लगेगा": h8m_pratik
      "वह अपने आप मीठा और साफ़ हो जाएगा": h8m_pratik
  - prompt: '''प्रतिभा'' शब्द का अर्थ है:'
    options:
    - विशेष योग्यता
    - डर
    - बंधन
    answer: विशेष योग्यता
