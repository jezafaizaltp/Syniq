subject: cbse8-hin
chapter: 10
title: तरुण के स्वप्न (उद्बोधन)
tips:
  h8_netaji_bharat: "नेताजी सबके लिए आज़ादी और बराबरी चाहते थे।"
  h8_tarun: "'तरुणाई' जवानी को कहते हैं।"
  h8_tyag: "नेताजी ने खुद सब कुछ छोड़कर संघर्ष किया। वे युवाओं से क्या माँगते हैं?"
  h8_udbodhan: "'बोध' जगाना। उद्बोधन लोगों को जगाने और प्रेरित करने वाली बात है।"
  h8s_naam: "आज़ाद हिंद फ़ौज के नेता को लोग किस आदर-भरे नाम से पुकारते थे?"
  h8s_arth: वाक्य में शब्द कहाँ आया है, उससे अर्थ समझो।
  h8s_sapna: "नेताजी का भारत समता पर आधारित था, बिना किसी भेदभाव के। समता का अर्थ सोचो।"
  h8s_gun: सपने केवल चाहने से पूरे नहीं होते। उनके लिए कौन-से गुण चाहिए?
  h8s_vidha: युवाओं को जगाने और प्रेरित करने वाली रचना को क्या कहते हैं?

concepts:
- code: cbse8h.m10.tarun
  title: तरुण के स्वप्न (उद्बोधन)
  notes: |
    लेखक/वक्ता: नेताजी सुभाषचंद्र बोस। उद्बोधन (युवाओं को प्रेरित करने वाला भाषण/लेख)। नेताजी युवाओं (तरुणों) से
    बड़े सपने देखने को कहते हैं। उनका सपना एक स्वतंत्र, समृद्ध और समतामूलक भारत का है, जहाँ जाति, धर्म, ऊँच-नीच
    और अमीर-ग़रीब का भेद न हो; जहाँ स्त्री-पुरुष बराबर हों; जहाँ हर व्यक्ति को शिक्षा और अवसर मिले। वे कहते
    हैं कि सपनों को सच करने के लिए त्याग, साहस, अनुशासन और कठोर परिश्रम चाहिए, और युवा ही देश का भविष्य
    बनाते हैं। संदेश: युवा अपने सपनों को देश और समाज की सेवा से जोड़ें।
  explanations:
    text: 'इस उद्बोधन में नेताजी सुभाषचंद्र बोस युवाओं से बड़े सपने देखने को कहते हैं: एक स्वतंत्र, बराबरी वाला भारत, जहाँ जाति, धर्म और अमीर-ग़रीब का भेद न हो। वे कहते हैं कि ऐसे सपने त्याग, साहस और परिश्रम से ही पूरे होते हैं, और युवा ही देश का भविष्य बनाते हैं।'
    visual: 'कल्पना कीजिए: मंच पर खड़े नेताजी, सामने युवाओं की भीड़, और पीछे एक चित्र: स्कूल जाते सब बच्चे, बराबरी से काम करते स्त्री-पुरुष, और खुशहाल गाँव-शहर।'
    step_by_step: '1. विधा: उद्बोधन, यानी प्रेरणा देने वाला भाषण। 2. वक्ता: नेताजी सुभाषचंद्र बोस। 3. सपना: स्वतंत्र, समतामूलक भारत। 4. रास्ता: त्याग, साहस, अनुशासन, परिश्रम। 5. युवाओं की भूमिका।'
    real_world: आज भी युवा स्टार्टअप, विज्ञान, खेल और सेवा के कामों से नेताजी के 'तरुण के स्वप्न' को आगे बढ़ा रहे हैं।
  picture:
    kind: compare
    columns:
    - title: नेताजी का सपना
      points:
      - स्वतंत्र और समृद्ध भारत
      - कोई जाति-धर्म का भेद नहीं
      - स्त्री-पुरुष बराबर
      - सबको शिक्षा
    - title: सपना पूरा करने का रास्ता
      points:
      - त्याग
      - साहस
      - अनुशासन
      - कठोर परिश्रम
    alt: नेताजी का सपना (स्वतंत्र, समतामूलक भारत, सबको शिक्षा) और उसे पूरा करने का रास्ता (त्याग, साहस, अनुशासन, परिश्रम)।
  activity:
    type: sort
    prompt: नेताजी के सपनों का भारत कैसा है, और सपना सच करने के लिए क्या चाहिए?
    bins:
    - सपनों का भारत
    - सपना सच करने के लिए
    items:
    - label: जाति-धर्म और ऊँच-नीच का भेद न हो
      bin: सपनों का भारत
      clue: यह भारत का चित्र है या साधन?
      why: समतामूलक भारत का सपना।
    - label: स्त्री-पुरुष बराबर हों
      bin: सपनों का भारत
      clue: यह कैसा समाज है?
      why: बराबरी वाला भारत।
    - label: हर व्यक्ति को शिक्षा और अवसर
      bin: सपनों का भारत
      clue: यह लक्ष्य है या साधन?
      why: सपनों के भारत की पहचान।
    - label: त्याग और साहस
      bin: सपना सच करने के लिए
      clue: सपने को सच करने के लिए युवाओं में क्या चाहिए?
      why: 'त्याग, साहस: साधन।'
    - label: अनुशासन और कठोर परिश्रम
      bin: सपना सच करने के लिए
      clue: यह मंज़िल है या रास्ता?
      why: परिश्रम सपने तक पहुँचने का रास्ता।
  lesson:
    - teach: '''तरुण के स्वप्न'' नेताजी सुभाषचंद्र बोस का उद्बोधन है: युवाओं को प्रेरित करने वाला भाषण या लेख। ''तरुण'' का अर्थ है युवा। नेताजी युवाओं से बड़े सपने देखने को कहते हैं।'
      check:
        prompt: '''तरुण'' का अर्थ है:'
        options:
        - युवा
        - बूढ़ा
        - बच्चा
        answer: युवा
        why: तरुण = नौजवान।
    - teach: नेताजी का सपना एक स्वतंत्र, समृद्ध और समतामूलक भारत का है, जहाँ जाति, धर्म, ऊँच-नीच और अमीर-ग़रीब का भेद न हो; जहाँ स्त्री-पुरुष बराबर हों; और हर व्यक्ति को शिक्षा और अवसर मिले।
      picture:
        kind: compare
        columns:
        - title: नेताजी का भारत
          points:
          - स्वतंत्र
          - समृद्ध
          - सब बराबर
          - सबको शिक्षा
        - title: जो नहीं चाहिए
          points:
          - जाति-धर्म का भेद
          - ऊँच-नीच
          - अमीर-ग़रीब की खाई
        alt: नेताजी का भारत स्वतंत्र, समृद्ध, बराबरी वाला और सबको शिक्षा देने वाला है, बिना जाति-धर्म और ऊँच-नीच के भेद के।
      check:
        prompt: '''समतामूलक'' का अर्थ है:'
        options:
        - बराबरी पर आधारित
        - धन पर आधारित
        - डर पर आधारित
        answer: बराबरी पर आधारित
        why: समता = बराबरी।
    - teach: 'नेताजी कहते हैं कि सपनों को सच करने के लिए त्याग, साहस, अनुशासन और कठोर परिश्रम चाहिए। युवा ही देश का भविष्य बनाते हैं। संदेश: अपने सपनों को देश और समाज की सेवा से जोड़ो।'
      check:
        prompt: सपने पूरे करने के लिए क्या चाहिए?
        options:
        - त्याग, साहस और परिश्रम
        - केवल भाग्य
        - आराम
        answer: त्याग, साहस और परिश्रम
        why: मेहनत और साहस के बिना सपने सपने ही रहते हैं।
  items:
  - prompt: '''तरुण के स्वप्न'' के लेखक कौन हैं?'
    options:
    - सुभाषचंद्र बोस
    - भारतेंदु हरिश्चंद्र
    - भीष्म साहनी
    - गिरिजाकुमार माथुर
    answer: सुभाषचंद्र बोस
    difficulty: 1
    hints:
    - '''नेताजी''।'
    - आज़ाद हिंद फ़ौज।
    solution: यह नेताजी सुभाषचंद्र बोस का उद्बोधन है।
    mistakes:
      भारतेंदु हरिश्चंद्र: hin8_read_again
  - prompt: '''तरुण'' शब्द का अर्थ है:'
    options:
    - युवा
    - बूढ़ा
    - बच्चा
    - राजा
    answer: युवा
    difficulty: 1
    hints:
    - जवान।
    - तरुणाई = जवानी।
    solution: तरुण का अर्थ है युवा।
    mistakes: {"बूढ़ा": "h8_tarun"}
  - prompt: '''उद्बोधन'' किसे कहते हैं?'
    options:
    - प्रेरणा देने वाला भाषण या लेख
    - कहानी
    - यात्रा-वर्णन
    - पत्र
    answer: प्रेरणा देने वाला भाषण या लेख
    difficulty: 1
    hints:
    - '''बोधन'' = जगाना।'
    - श्रोताओं को प्रेरित करना।
    solution: उद्बोधन वह भाषण या लेख है जो लोगों को जगाए और प्रेरित करे।
    mistakes: {"कहानी": "h8_udbodhan"}
  - prompt: नेताजी कैसे भारत का सपना देखते हैं?
    options:
    - स्वतंत्र और बराबरी वाला, बिना जाति-धर्म के भेद के
    - केवल धनी लोगों का
    - विदेशी शासन वाला
    - केवल शहरों वाला
    answer: स्वतंत्र और बराबरी वाला, बिना जाति-धर्म के भेद के
    difficulty: 2
    hints:
    - समानता।
    - सबको अवसर।
    solution: उनका सपना स्वतंत्र, समृद्ध और समतामूलक भारत का है।
    mistakes: {"केवल धनी लोगों का": "h8_netaji_bharat"}
  - prompt: नेताजी के अनुसार सपने पूरे करने के लिए क्या चाहिए?
    options:
    - त्याग, साहस और कठोर परिश्रम
    - केवल भाग्य
    - बहुत धन
    - दूसरों की मदद का इंतज़ार
    answer: त्याग, साहस और कठोर परिश्रम
    difficulty: 2
    hints:
    - अपने प्रयास से।
    - आराम से नहीं।
    solution: सपने त्याग, साहस, अनुशासन और परिश्रम से पूरे होते हैं।
    mistakes: {"केवल भाग्य": "h8_tyag"}
  - prompt: इस पाठ का मुख्य संदेश क्या है?
    options:
    - युवा अपने सपनों को देश और समाज की सेवा से जोड़ें
    - सपने देखना समय की बर्बादी है
    - केवल अपने लिए जियो
    - युवाओं को राजनीति से दूर रहना चाहिए
    answer: युवा अपने सपनों को देश और समाज की सेवा से जोड़ें
    difficulty: 2
    hints:
    - युवा ही देश का भविष्य।
    - सेवा।
    solution: नेताजी युवाओं को बड़े सपने देखने और उन्हें देश-सेवा से जोड़ने को कहते हैं।
    mistakes:
      केवल अपने लिए जियो: hin8_whole
  - prompt: सुभाषचंद्र बोस को प्यार से क्या कहा जाता है?
    options:
    - नेताजी
    - बापू
    - चाचा
    answer: नेताजी
    difficulty: 1
    hints:
    - उन्होंने आज़ाद हिंद फ़ौज का नेतृत्व किया।
    - '''बापू'' गांधीजी को कहते हैं।'
    solution: सुभाषचंद्र बोस को 'नेताजी' कहा जाता है।
    mistakes:
      बापू: h8s_naam
      चाचा: h8s_naam
  - prompt: '''अनुशासन'' का अर्थ है:'
    options:
    - नियमों का पालन
    - छुट्टी
    - शोर
    answer: नियमों का पालन
    difficulty: 1
    hints:
    - सैनिक और खिलाड़ी इसके बिना सफल नहीं होते।
    - समय और नियम से काम करना।
    solution: अनुशासन = नियमों का पालन।
    mistakes:
      छुट्टी: h8s_arth
      शोर: h8s_arth
  - prompt: नेताजी के सपनों के भारत में स्त्री-पुरुष कैसे होंगे?
    options:
    - बराबर
    - स्त्री पुरुष से कम
    - अलग-अलग नियमों में बँधे
    answer: बराबर
    difficulty: 1
    hints:
    - उनका भारत समता पर आधारित है।
    - भेदभाव नहीं होगा।
    solution: नेताजी स्त्री-पुरुष समानता चाहते थे।
    mistakes:
      स्त्री पुरुष से कम: h8s_sapna
      अलग-अलग नियमों में बँधे: h8s_sapna
  - prompt: '''समृद्ध'' का अर्थ है:'
    options:
    - धन-धान्य से भरपूर
    - गरीब
    - छोटा
    answer: धन-धान्य से भरपूर
    difficulty: 2
    hints:
    - नेताजी का भारत केवल स्वतंत्र नहीं, सम्पन्न भी है।
    - उन्नत और खुशहाल।
    solution: समृद्ध = सम्पन्न, खुशहाल।
    mistakes:
      गरीब: h8s_arth
      छोटा: h8s_arth
  - prompt: नेताजी के अनुसार देश का भविष्य कौन बनाता है?
    options:
    - युवा
    - केवल राजा
    - केवल विदेशी
    answer: युवा
    difficulty: 1
    hints:
    - पाठ किसे संबोधित है?
    - शीर्षक में ही उत्तर का संकेत है।
    solution: नेताजी युवाओं को देश का भविष्य मानते हैं।
    mistakes:
      केवल राजा: h8_tarun
      केवल विदेशी: h8_tarun
  - prompt: आज का कौन-सा काम नेताजी के सपने से मेल खाता है?
    options:
    - गाँव के बच्चों को मुफ़्त पढ़ाना
    - जाति के आधार पर दोस्त चुनना
    - पढ़ाई छोड़ देना
    answer: गाँव के बच्चों को मुफ़्त पढ़ाना
    difficulty: 2
    hints:
    - उनका सपना था सबको शिक्षा और अवसर।
    - कौन-सा विकल्प समाज की सेवा है?
    solution: सबको शिक्षा देना नेताजी के सपने को आगे बढ़ाता है।
    mistakes:
      जाति के आधार पर दोस्त चुनना: h8s_sapna
      पढ़ाई छोड़ देना: h8s_sapna
  - prompt: '''त्याग'' का अर्थ है:'
    options:
    - बड़े लक्ष्य के लिए अपना सुख छोड़ना
    - चीज़ें इकट्ठी करना
    - सो जाना
    answer: बड़े लक्ष्य के लिए अपना सुख छोड़ना
    difficulty: 2
    hints:
    - स्वतंत्रता सेनानियों ने बहुत कुछ छोड़ा।
    - अपने हित से ऊपर उठना।
