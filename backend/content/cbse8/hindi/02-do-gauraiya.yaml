subject: cbse8-hin
chapter: 2
title: दो गौरैया (कहानी)
concepts:
- code: cbse8h.m2.gauraiya
  title: दो गौरैया (कहानी)
  notes: |
    लेखक: भीष्म साहनी। घर में तीन ही लोग रहते हैं: माँ, पिताजी और कथावाचक (बेटा)। पर पिताजी कहते हैं कि घर
    सराय बन गया है: चूहे, बिल्ली, चमगादड़, कबूतर, सब आते-जाते हैं। एक दिन दो गौरैया घर में घुसकर छत के पंखे के
    गोले में घोंसला बना लेती हैं। पिताजी उन्हें भगाने के लिए लाठी लेकर, तालियाँ बजाकर, घोंसले के तिनके निकालकर
    बहुत कोशिश करते हैं; माँ हँसती हैं। गौरैया बार-बार लौट आती हैं। अंत में पिताजी घोंसला गिराने चढ़ते हैं तो
    भीतर से नन्हे बच्चों की 'चीं-चीं' सुनाई देती है। पिताजी रुक जाते हैं, मुस्कुराते हैं और लाठी रख देते हैं;
    गौरैया अपने बच्चों को दाना खिलाती हैं। संदेश: छोटे जीवों के प्रति करुणा; घर सबका है।
  explanations:
    text: पिताजी घर में घोंसला बनाने वाली दो गौरैया को भगाने की बहुत कोशिश करते हैं, पर वे बार-बार लौट आती हैं। आख़िर में जब घोंसले से नन्हे बच्चों की चीं-चीं सुनाई देती है, तो पिताजी का गुस्सा पिघल जाता है और वे मुस्कुराकर उन्हें रहने देते हैं।
    visual: 'कल्पना कीजिए: छत के पंखे पर तिनकों का छोटा घोंसला, नीचे लाठी लिए पिताजी, पास खड़ी हँसती माँ, और घोंसले से झाँकती दो नन्ही चोंचें।'
    step_by_step: 1. घर 'सराय' क्यों है? 2. गौरैया घोंसला बनाती हैं। 3. पिताजी की भगाने की कोशिशें। 4. बच्चों की चीं-चीं। 5. पिताजी का मन बदलना।
    real_world: शहरों में गौरैया कम हो रही हैं; कई लोग घरों में उनके लिए छोटे घोंसला-डिब्बे लगाते हैं ताकि वे सुरक्षित रह सकें।
  picture:
    kind: flow
    steps:
    - 'पिताजी: घर सराय बन गया है'
    - दो गौरैया पंखे में घोंसला बनाती हैं
    - पिताजी उन्हें भगाने की कोशिश करते हैं
    - घोंसले से बच्चों की चीं-चीं आती है
    - पिताजी मुस्कुराकर उन्हें रहने देते हैं
    alt: 'कहानी का क्रम: घर सराय जैसा, गौरैया का घोंसला, भगाने की कोशिशें, बच्चों की आवाज़, और पिताजी का मन बदलना।'
  items:
  - prompt: '''दो गौरैया'' कहानी के लेखक कौन हैं?'
    options:
    - भीष्म साहनी
    - प्रेमचंद
    - माधवराव सप्रे
    - भारतेंदु हरिश्चंद्र
    answer: भीष्म साहनी
    difficulty: 1
    hints:
    - '''तमस'' के लेखक।'
    - आधुनिक कहानीकार।
    solution: कहानी भीष्म साहनी की है।
    mistakes:
      प्रेमचंद: hin8_read_again
  - prompt: घर में कुल कितने व्यक्ति रहते हैं?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - माँ, पिताजी और…
    - कथावाचक भी गिनें।
    solution: 'माँ, पिताजी और कथावाचक: तीन व्यक्ति।'
  - prompt: पिताजी घर को क्या कहते हैं?
    options:
    - सराय
    - महल
    - मंदिर
    - जंगल
    answer: सराय
    difficulty: 1
    hints:
    - जहाँ सब आते-जाते हैं।
    - चूहे, बिल्ली, चमगादड़…
    solution: पिताजी कहते हैं कि घर सराय बन गया है।
  - prompt: गौरैया ने घोंसला कहाँ बनाया?
    options:
    - छत के पंखे में
    - पेड़ पर
    - रसोई की अलमारी में
    - खिड़की के बाहर
    answer: छत के पंखे में
    difficulty: 2
    hints:
    - छत पर लटकी चीज़।
    - पिताजी को लाठी से पहुँचना पड़ा।
    solution: उन्होंने छत के पंखे के गोले में घोंसला बनाया।
  - prompt: पिताजी का मन किस बात से बदल गया?
    options:
    - घोंसले से बच्चों की चीं-चीं सुनकर
    - माँ के डाँटने से
    - गौरैया के उड़ जाने से
    - पड़ोसी के कहने से
    answer: घोंसले से बच्चों की चीं-चीं सुनकर
    difficulty: 1
    hints:
    - घोंसले के अंदर कौन था?
    - नन्हे बच्चे।
    solution: नन्हे बच्चों की आवाज़ सुनकर पिताजी का गुस्सा पिघल गया।
  - prompt: कहानी का मुख्य संदेश क्या है?
    options:
    - छोटे जीवों के प्रति करुणा और सहनशीलता
    - घर में पक्षी नहीं आने चाहिए
    - पिताजी हमेशा सही होते हैं
    - पंखे साफ़ रखने चाहिए
    answer: छोटे जीवों के प्रति करुणा और सहनशीलता
    difficulty: 2
    hints:
    - अंत में पिताजी ने क्या किया?
    - गुस्सा करुणा में बदला।
    solution: कहानी सिखाती है कि हर जीव को जगह और प्यार चाहिए।
    mistakes:
      पिताजी हमेशा सही होते हैं: hin8_whole
