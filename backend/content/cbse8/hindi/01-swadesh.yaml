# CBSE Class 8 Hindi (NCERT Malhar, 2025), chapter 1. Format: content/README.md.
# Written from memory and study notes, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse8-hin
chapter: 1
title: स्वदेश (कविता)
tips:
  hin8_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है: उस पात्र या घटना वाला हिस्सा खोजें।'
  hin8_poem_meaning: 'कविता की बात के पीछे का भाव समझें: यह चित्र जीवन की किस बात की ओर इशारा करता है?'
  hin8_whole: 'पूरे पाठ के बारे में सोचें, केवल एक पंक्ति के बारे में नहीं: शुरुआत से अंत तक क्या बदलता है?'
  h8_deshprem: "कविता का शीर्षक बताता है कि यह किसके प्रति प्रेम की है।"
  h8_patthar: "फूल कोमल होता है। कवि कहते हैं ऐसा हृदय भावहीन और कठोर है।"
  h8_swadesh: "'स्व' का अर्थ है अपना।"
  h8_tulna: "यहाँ पत्थर की तारीफ़ नहीं है। पत्थर में भावना होती है क्या?"
  h8x_seva: "कौन-सा काम देश और लोगों का भला करता है?"
  h8x_arth: 'शब्द को तोड़कर देखो: ''स्व'' यानी अपना। फिर वाक्य में अर्थ बैठाओ।'
  h8x_bhav: कविता किस भावना को जगाना चाहती है? पूरी कविता का स्वर याद करो।
  h8x_vilom: विलोम शब्द उलटा अर्थ देता है। जो शब्द पूछा है, उसका उलटा सोचो।
  h8x_kavi: कवि का नाम पाठ के ऊपर लिखा है। दूसरे पाठों के लेखकों से मिलाकर देखो।
concepts:
- code: cbse8h.m1.swadesh
  title: स्वदेश (कविता)
  notes: |
    कवि: गयाप्रसाद शुक्ल 'सनेही'। देशप्रेम की कविता। प्रसिद्ध पंक्ति: "वह हृदय नहीं है पत्थर है, जिसमें स्वदेश का
    प्यार नहीं।" कवि कहते हैं कि जिस मनुष्य में अपने देश के लिए प्रेम, गौरव और उत्साह नहीं, उसका जीवन व्यर्थ है।
    जो देश की उन्नति, उसकी मिट्टी, नदियों और संस्कृति पर गर्व नहीं करता, जो देश के लिए कुछ करने का संकल्प नहीं
    रखता, उसका हृदय पत्थर के समान है। संदेश: देश से प्रेम करो और उसकी सेवा का भाव रखो।
  explanations:
    text: इस कविता में कवि कहते हैं कि जिस दिल में अपने देश के लिए प्यार नहीं, वह दिल नहीं, पत्थर है। देश की धरती, संस्कृति और लोगों पर गर्व करना और उसके लिए कुछ करना ही सच्चा जीवन है।
    visual: 'कल्पना कीजिए: एक ओर तिरंगे को देखकर चमकती आँखों वाला बच्चा, दूसरी ओर एक ठंडा, भारी पत्थर। कवि कहते हैं: देश-प्रेम के बिना दिल उसी पत्थर जैसा है।'
    step_by_step: '1. कवि और विषय पहचानें: देशप्रेम। 2. मुख्य पंक्ति समझें: हृदय और पत्थर की तुलना। 3. देखें कि कवि किन लोगों का जीवन व्यर्थ कहते हैं। 4. संदेश लिखें: देश से प्रेम और सेवा।'
    real_world: 'स्वतंत्रता दिवस पर हम झंडा फहराते हैं, पर सच्चा देश-प्रेम रोज़ के कामों में दिखता है: साफ़-सफ़ाई, ईमानदारी और दूसरों की मदद।'
  picture:
    kind: compare
    columns:
    - title: देश-प्रेम वाला हृदय
      points:
      - देश पर गर्व
      - सेवा का संकल्प
      - उत्साह से भरा
    - title: देश-प्रेम के बिना हृदय
      points:
      - पत्थर के समान
      - जीवन व्यर्थ
      - कोई उत्साह नहीं
    alt: देश-प्रेम वाला हृदय गर्व, सेवा और उत्साह से भरा है; उसके बिना हृदय कवि के अनुसार पत्थर के समान है।
  activity:
    type: sort
    prompt: कविता के अनुसार, किसका हृदय 'पत्थर' है और किसका सच्चा हृदय?
    bins:
    - सच्चा हृदय
    - पत्थर-सा हृदय
    items:
    - label: देश की मिट्टी और नदियों पर गर्व
      bin: सच्चा हृदय
      clue: कवि किन भावों वाले हृदय को सच्चा मानते हैं?
      why: देश पर गर्व सच्चे हृदय की पहचान है।
    - label: देश के लिए कुछ करने का संकल्प
      bin: सच्चा हृदय
      clue: यह देश-प्रेम है या उदासीनता?
      why: 'सेवा का भाव: सच्चा हृदय।'
    - label: देश की उन्नति से कोई मतलब नहीं
      bin: पत्थर-सा हृदय
      clue: जिसमें स्वदेश का प्यार न हो, वह क्या है?
      why: देश से उदासीन हृदय पत्थर है।
    - label: न गौरव, न उत्साह
      bin: पत्थर-सा हृदय
      clue: ऐसे जीवन को कवि क्या कहते हैं?
      why: कवि ऐसे जीवन को व्यर्थ कहते हैं।
  lesson:
    - teach: '''स्वदेश'' गयाप्रसाद शुक्ल ''सनेही'' की देशप्रेम की कविता है। ''स्वदेश'' का अर्थ है अपना देश (''स्व'' = अपना, ''देश'' = देश)।'
      check:
        prompt: '''स्व'' का अर्थ क्या है?'
        options:
        - अपना
        - पराया
        - बड़ा
        answer: अपना
        why: स्वदेश = अपना देश।
    - teach: 'प्रसिद्ध पंक्ति है: ''वह हृदय नहीं है पत्थर है, जिसमें स्वदेश का प्यार नहीं।'' यहाँ कवि हृदय की तुलना पत्थर से करते हैं: जिसमें देश-प्रेम नहीं, वह कठोर और भावहीन है।'
      check:
        prompt: कवि ने देश-प्रेम से खाली हृदय की तुलना किससे की है?
        options:
        - पत्थर से
        - फूल से
        - नदी से
        answer: पत्थर से
        why: पत्थर कठोर होता है, उसमें भावना नहीं होती।
    - teach: 'कवि कहते हैं कि जो अपने देश की मिट्टी, नदियों और संस्कृति पर गर्व नहीं करता, और देश के लिए कुछ करने का संकल्प नहीं रखता, उसका जीवन व्यर्थ है। संदेश: देश से प्रेम करो और उसकी सेवा करो।'
      picture:
        kind: compare
        columns:
        - title: देश-प्रेमी हृदय
          points:
          - गर्व
          - उत्साह
          - सेवा का संकल्प
        - title: पत्थर जैसा हृदय
          points:
          - उदासीनता
          - कठोरता
          - व्यर्थ जीवन
        alt: देश-प्रेमी हृदय में गर्व, उत्साह और सेवा का संकल्प है; पत्थर जैसे हृदय में उदासीनता और कठोरता।
      check:
        prompt: कविता हमें क्या करने को कहती है?
        options:
        - देश से प्रेम और उसकी सेवा
        - दूसरे देश जाना
        - केवल अपना हित सोचना
        answer: देश से प्रेम और उसकी सेवा
        why: यही कविता का मुख्य संदेश है।
  items:
  - prompt: '''स्वदेश'' कविता के कवि कौन हैं?'
    options:
    - गयाप्रसाद शुक्ल 'सनेही'
    - कबीर
    - महादेवी वर्मा
    - दुष्यंत कुमार
    answer: गयाप्रसाद शुक्ल 'सनेही'
    difficulty: 1
    hints:
    - उपनाम 'सनेही'।
    - देशप्रेम के कवि।
    solution: कविता गयाप्रसाद शुक्ल 'सनेही' की है।
    mistakes:
      कबीर: hin8_read_again
  - prompt: कवि के अनुसार जिस हृदय में स्वदेश का प्यार नहीं, वह क्या है?
    options:
    - पत्थर
    - फूल
    - दीपक
    - सागर
    answer: पत्थर
    difficulty: 1
    hints:
    - कठोर और भावहीन चीज़।
    - '''वह हृदय नहीं है…'''
    solution: '''वह हृदय नहीं है पत्थर है, जिसमें स्वदेश का प्यार नहीं।'''
    mistakes: {"फूल": "h8_patthar"}
  - prompt: '''स्वदेश'' शब्द का अर्थ है:'
    options:
    - अपना देश
    - विदेश
    - पड़ोसी देश
    - पूरा संसार
    answer: अपना देश
    difficulty: 1
    hints:
    - '''स्व'' का अर्थ ''अपना''।'
    - विदेश का उलटा।
    solution: स्व + देश = अपना देश।
    mistakes: {"विदेश": "h8_swadesh"}
  - prompt: कविता का मुख्य भाव क्या है?
    options:
    - देशप्रेम
    - प्रकृति-सौंदर्य
    - हास्य
    - बचपन की यादें
    answer: देशप्रेम
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - देश के प्रति प्रेम।
    solution: कविता देशप्रेम की भावना जगाती है।
    mistakes: {"प्रकृति-सौंदर्य": "h8_deshprem"}
  - prompt: कवि किसका जीवन व्यर्थ मानते हैं?
    options:
    - जिसमें देश के लिए प्रेम और उत्साह नहीं
    - जो गरीब है
    - जो गाँव में रहता है
    - जो कविता नहीं लिखता
    answer: जिसमें देश के लिए प्रेम और उत्साह नहीं
    difficulty: 2
    hints:
    - मुख्य पंक्ति से जोड़ें।
    - पत्थर जैसा हृदय।
    solution: देश-प्रेम से रहित जीवन को कवि व्यर्थ कहते हैं।
    mistakes:
      जो गरीब है: hin8_poem_meaning
  - prompt: '''हृदय'' और ''पत्थर'' की तुलना से कवि क्या दिखाना चाहते हैं?'
    options:
    - देश-प्रेम के बिना मनुष्य भावहीन और कठोर है
    - पत्थर बहुत मज़बूत होते हैं
    - हृदय एक अंग है
    - पत्थर सुंदर होते हैं
    answer: देश-प्रेम के बिना मनुष्य भावहीन और कठोर है
    difficulty: 2
    hints:
    - पत्थर में भावना नहीं होती।
    - यह प्रतीक है।
    solution: 'पत्थर भावहीनता का प्रतीक है: देश-प्रेम के बिना हृदय में कोई भाव नहीं।'
    mistakes: {"पत्थर बहुत मज़बूत होते हैं": "h8_tulna"}
  - prompt: '''व्यर्थ'' शब्द का अर्थ है:'
    options:
    - बेकार
    - सुंदर
    - लंबा
    answer: बेकार
    difficulty: 1
    hints:
    - कवि ऐसे जीवन की बात करते हैं जिसमें देश-प्रेम नहीं।
    - जिसका कोई उपयोग न हो।
    solution: व्यर्थ = बेकार, जिसका कोई लाभ न हो।
    mistakes:
      सुंदर: h8x_arth
      लंबा: h8x_arth
  - prompt: '''स्वदेश'' का विलोम शब्द क्या है?'
    options:
    - विदेश
    - प्रदेश
    - देशभक्त
    answer: विदेश
    difficulty: 2
    hints:
    - अपने देश का उलटा क्या होगा?
    - दूसरे देश को क्या कहते हैं?
    solution: स्वदेश (अपना देश) का विलोम विदेश (दूसरा देश) है।
    mistakes:
      प्रदेश: h8x_vilom
      देशभक्त: h8x_vilom
  - prompt: कविता किस प्रकार की है?
    options:
    - देशभक्ति की कविता
    - प्रकृति-वर्णन की कविता
    - हास्य कविता
    answer: देशभक्ति की कविता
    difficulty: 1
    hints:
    - कवि किसके प्रति प्रेम जगाना चाहते हैं?
    - शीर्षक पर ध्यान दो।
    solution: कविता अपने देश के प्रति प्रेम जगाती है।
    mistakes:
      प्रकृति-वर्णन की कविता: h8x_bhav
      हास्य कविता: h8x_bhav
  - prompt: '''हृदय'' शब्द का पर्यायवाची है:'
    options:
    - दिल
    - दिमाग
    - हाथ
    answer: दिल
    difficulty: 1
    hints:
    - जहाँ प्रेम और भावना रहती है, ऐसा माना जाता है।
    - शरीर का वह अंग जो धड़कता है।
    solution: हृदय = दिल।
    mistakes:
      दिमाग: h8x_arth
      हाथ: h8x_arth
  - prompt: पत्थर की कौन-सी विशेषता कवि को कठोर हृदय की याद दिलाती है?
    options:
    - उसमें भावना और कोमलता नहीं होती
    - वह चमकता है
    - वह बहुत भारी है
    answer: उसमें भावना और कोमलता नहीं होती
    difficulty: 2
    hints:
    - तुलना भावनाओं की है, वज़न की नहीं।
    - पत्थर कुछ महसूस नहीं करता।
    solution: पत्थर भावहीन और कठोर है, जैसे देश-प्रेम से खाली हृदय।
    mistakes:
      वह चमकता है: h8_patthar
      वह बहुत भारी है: h8_patthar
  - prompt: निम्न में से कौन-सा काम देश-सेवा का उदाहरण है?
    options:
    - गाँव में साफ़-सफ़ाई अभियान चलाना
    - सड़क पर कूड़ा फेंकना
    - सार्वजनिक संपत्ति तोड़ना
    answer: गाँव में साफ़-सफ़ाई अभियान चलाना
    difficulty: 1
    hints:
    - देश-सेवा देश और लोगों का भला करती है।
    - कौन-सा काम किसी का भला करता है?
    solution: सफ़ाई अभियान देश और समाज की सेवा है।
    mistakes:
      सड़क पर कूड़ा फेंकना: h8x_seva
      सार्वजनिक संपत्ति तोड़ना: h8x_seva
  - prompt: कवि का उपनाम क्या है?
    options:
    - सनेही
    - निराला
    - दिनकर
    answer: सनेही
    difficulty: 2
    hints:
    - नाम के बाद उद्धरण-चिह्नों में लिखा है।
    - इसका अर्थ है स्नेह करने वाला।
    solution: गयाप्रसाद शुक्ल का उपनाम 'सनेही' है।
    mistakes:
      निराला: h8x_kavi
      दिनकर: h8x_kavi
  - prompt: '''गौरव'' शब्द का अर्थ है:'
    options:
    - गर्व, सम्मान
    - दुख
    - डर
    answer: गर्व, सम्मान
    difficulty: 2
    hints:
    - देश की मिट्टी और संस्कृति पर यह भाव होना चाहिए।
    - अच्छी बात पर होने वाला भाव।
    solution: गौरव = गर्व या सम्मान।
    mistakes:
      दुख: h8x_arth
      डर: h8x_arth
  - prompt: कवि के अनुसार देश-प्रेम के साथ और क्या होना चाहिए?
    options:
