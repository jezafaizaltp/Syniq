subject: cbse8-hin
chapter: 8
title: नए मेहमान (एकांकी)
tips:
  h8_bhatt: "यह एकांकी एक प्रसिद्ध नाटककार की है जिनका नाम 'उदय' से शुरू होता है।"
  h8_galat_pata: "रेवती का भाई अंत में आता है। पहले वाले मेहमान किसी और के घर जा रहे थे।"
  h8_garmi_raat: "परिवार पसीने से परेशान है और छत पर सोने की बात हो रही है।"
  h8_pareshani: "एकांकी में बाढ़ नहीं है। छोटे घर में गर्मी और अनजान लोग क्या माँग रहे थे?"

concepts:
- code: cbse8h.m8.mehman
  title: नए मेहमान (एकांकी)
  notes: |
    लेखक: उदयशंकर भट्ट। एकांकी (एक अंक का नाटक)। गर्मी की रात, शहर का एक छोटा-सा मकान। विश्वनाथ और उनकी पत्नी
    रेवती गर्मी, छोटे घर और रूखे पड़ोसियों से परेशान हैं; बच्चे भी गर्मी से बेचैन हैं। तभी दो अनजान 'मेहमान'
    आ धमकते हैं और ऐसे व्यवहार करते हैं मानो पुराने परिचित हों: पानी, खाना, बिस्तर, सब माँगते हैं। मेज़बान
    संकोच में उनका सत्कार करते हैं, पर बाद में पता चलता है कि वे किसी दूसरे व्यक्ति के घर जाना चाहते थे और
    ग़लत पते पर आ गए थे। अंत में रेवती का भाई आता है, जो सचमुच का अपना मेहमान है। विषय: शहरी जीवन की कठिनाइयाँ,
    आतिथ्य, और मेहमानों को भी मेज़बान की परिस्थिति समझनी चाहिए। हास्य और व्यंग्य से भरा।
  explanations:
    text: गर्मी की रात में एक छोटे-से शहरी घर में दो अनजान मेहमान आ जाते हैं और पुराने परिचितों की तरह आराम माँगते हैं। परेशान मेज़बान उनकी सेवा करते हैं, पर पता चलता है कि वे ग़लत घर आ गए थे। यह एकांकी हँसाते हुए आतिथ्य और शहरी जीवन की कठिनाइयाँ दिखाता है।
    visual: 'कल्पना कीजिए: गर्मी से तपता छोटा-सा कमरा, पंखा झलती रेवती, और दरवाज़े पर सामान लिए दो अनजान आदमी जो कहते हैं: ''हम आ गए!'''
    step_by_step: '1. परिस्थिति: गर्मी की रात, छोटा घर। 2. अनजान मेहमानों का आना। 3. उनकी माँगें और मेज़बानों की परेशानी। 4. भेद खुलना: वे ग़लत पते पर आए थे। 5. असली मेहमान का आना।'
    real_world: मेहमान बनकर किसी के घर जाते समय पहले से बताना और उनकी सुविधा का ध्यान रखना अच्छा आतिथ्य दोनों ओर से निभाता है।
  picture:
    kind: flow
    steps:
    - गर्मी की रात, छोटा शहरी घर
    - दो अनजान मेहमान आ जाते हैं
    - वे पानी, खाना, बिस्तर माँगते हैं
    - 'पता चलता है: वे ग़लत घर आए थे'
    - रेवती का भाई, असली मेहमान, आता है
    alt: 'एकांकी का क्रम: गर्मी की रात, अनजान मेहमानों का आना, उनकी माँगें, ग़लत पते का भेद, और असली मेहमान का आना।'
  items:
  - prompt: '''नए मेहमान'' किस विधा की रचना है?'
    options:
    - एकांकी
    - कविता
    - पत्र
    - आत्मकथा
    answer: एकांकी
    difficulty: 1
    hints:
    - एक अंक का नाटक।
    - संवाद और पात्र।
    solution: यह उदयशंकर भट्ट का एकांकी है।
    mistakes:
      पत्र: hin8_read_again
  - prompt: एकांकी में घटनाएँ किस समय होती हैं?
    options:
    - गर्मी की रात
    - सर्दी की सुबह
    - बरसात की दोपहर
    - त्योहार का दिन
    answer: गर्मी की रात
    difficulty: 1
    hints:
    - सब बेचैन हैं।
    - पंखा झलना।
    solution: कहानी गर्मी की एक रात की है।
    mistakes: {"सर्दी की सुबह": "h8_garmi_raat"}
  - prompt: एकांकी के लेखक कौन हैं?
    options:
    - उदयशंकर भट्ट
    - भीष्म साहनी
    - माधवराव सप्रे
    - दुष्यंत कुमार
    answer: उदयशंकर भट्ट
    difficulty: 1
    hints:
    - एकांकीकार।
    - नाटक लिखने वाले।
    solution: लेखक उदयशंकर भट्ट हैं।
    mistakes: {"भीष्म साहनी": "h8_bhatt"}
  - prompt: अनजान मेहमानों के बारे में अंत में क्या पता चलता है?
    options:
    - वे ग़लत पते पर आ गए थे
    - वे रेवती के भाई थे
    - वे चोर थे
    - वे पड़ोसी थे
    answer: वे ग़लत पते पर आ गए थे
    difficulty: 2
    hints:
    - वे किसी और से मिलने आए थे।
    - भेद खुलता है।
    solution: वे किसी दूसरे के घर जाना चाहते थे और ग़लती से यहाँ आ गए।
    mistakes: {"वे रेवती के भाई थे": "h8_galat_pata"}
  - prompt: मेज़बान परिवार किस बात से सबसे ज़्यादा परेशान था?
    options:
    - गर्मी, छोटा घर और अनजान मेहमानों की माँगें
    - बाढ़
    - परीक्षा
    - बीमारी
    answer: गर्मी, छोटा घर और अनजान मेहमानों की माँगें
    difficulty: 2
    hints:
    - शहर का छोटा मकान।
    - ऊपर से मेहमान।
    solution: छोटे घर, गर्मी और अनजान मेहमानों की माँगों ने उन्हें परेशान किया।
    mistakes: {"बाढ़": "h8_pareshani"}
  - prompt: एकांकी से क्या सीख मिलती है?
    options:
    - मेहमान को भी मेज़बान की परिस्थिति का ध्यान रखना चाहिए
    - मेहमानों को कभी घर में मत आने दो
    - शहर में रहना अच्छा है
    - गर्मी में सोना नहीं चाहिए
    answer: मेहमान को भी मेज़बान की परिस्थिति का ध्यान रखना चाहिए
    difficulty: 2
    hints:
    - आतिथ्य दोनों ओर से।
    - अनजान मेहमानों का व्यवहार।
    solution: आतिथ्य तभी सुखद है जब मेहमान भी मेज़बान की सुविधा का ध्यान रखें।
    mistakes:
      मेहमानों को कभी घर में मत आने दो: hin8_whole
