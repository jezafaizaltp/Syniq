subject: cbse8-hin
chapter: 8
title: नए मेहमान (एकांकी)
tips:
  h8_bhatt: "यह एकांकी एक प्रसिद्ध नाटककार की है जिनका नाम 'उदय' से शुरू होता है।"
  h8_galat_pata: "रेवती का भाई अंत में आता है। पहले वाले मेहमान किसी और के घर जा रहे थे।"
  h8_garmi_raat: "परिवार पसीने से परेशान है और छत पर सोने की बात हो रही है।"
  h8_pareshani: "एकांकी में बाढ़ नहीं है। छोटे घर में गर्मी और अनजान लोग क्या माँग रहे थे?"
  h8n_vidha: जो नाटक एक ही अंक में पूरा हो जाए, उसे क्या कहते हैं?
  h8n_kram: 'एकांकी की घटनाओं को शुरू से दोहराओ: पहले क्या हुआ, फिर क्या?'
  h8n_arth: वाक्य में शब्द कहाँ आया है, उससे अर्थ समझो।
  h8n_paatra: पात्र ने क्या किया और क्यों, उसे याद करो।

concepts:
- code: cbse8h.m8.mehman
  title: नए मेहमान (एकांकी)
  notes: |
    लेखक: उदयशंकर भट्ट। एकांकी (एक अंक का नाटक)। गर्मी की रात, शहर का एक छोटा-सा मकान। विश्वनाथ और उनकी पत्नी
    रेवती गर्मी, छोटे घर और रूखे पड़ोसियों से परेशान हैं; बच्चे भी गर्मी से बेचैन हैं। तभी दो अनजान 'मेहमान'
    आ धमकते हैं और ऐसे व्यवहार करते हैं मानो पुराने परिचित हों: पानी, खाना, बिस्तर, सब माँगते हैं। मेज़बान
    संकोच में उनका सत्कार करते हैं, पर बाद में पता चलता है कि वे किसी दूसरे व्यक्ति के घर जाना चाहते थे और
    ग़लत पते पर आ गए थे। अंत में रेवती का भाई आता है, जो सचमुच का अपना मेहमान है। विषय: शहरी जीवन की कठिनाइयाँ,
    आतिथ्य, और मेहमानों को भी मेज़बान की परिस्थिति समझनी चाहिए। हास्य और व्यंग्य से भरा।
  explanations:
    text: गर्मी की रात में एक छोटे-से शहरी घर में दो अनजान मेहमान आ जाते हैं और पुराने परिचितों की तरह आराम माँगते हैं। परेशान मेज़बान उनकी सेवा करते हैं, पर पता चलता है कि वे ग़लत घर आ गए थे। यह एकांकी हँसाते हुए आतिथ्य और शहरी जीवन की कठिनाइयाँ दिखाता है।
    visual: 'कल्पना कीजिए: गर्मी से तपता छोटा-सा कमरा, पंखा झलती रेवती, और दरवाज़े पर सामान लिए दो अनजान आदमी जो कहते हैं: ''हम आ गए!'''
    step_by_step: '1. परिस्थिति: गर्मी की रात, छोटा घर। 2. अनजान मेहमानों का आना। 3. उनकी माँगें और मेज़बानों की परेशानी। 4. भेद खुलना: वे ग़लत पते पर आए थे। 5. असली मेहमान का आना।'
    real_world: मेहमान बनकर किसी के घर जाते समय पहले से बताना और उनकी सुविधा का ध्यान रखना अच्छा आतिथ्य दोनों ओर से निभाता है।
  picture:
    kind: flow
    steps:
    - गर्मी की रात, छोटा शहरी घर
    - दो अनजान मेहमान आ जाते हैं
    - वे पानी, खाना, बिस्तर माँगते हैं
    - 'पता चलता है: वे ग़लत घर आए थे'
    - रेवती का भाई, असली मेहमान, आता है
    alt: 'एकांकी का क्रम: गर्मी की रात, अनजान मेहमानों का आना, उनकी माँगें, ग़लत पते का भेद, और असली मेहमान का आना।'
  activity:
    type: order
    prompt: एकांकी की घटनाएँ क्रम से लगाओ।
    steps:
    - गर्मी और छोटे घर से विश्वनाथ-रेवती परेशान
    - दो अनजान मेहमान आ धमकते हैं
    - मेज़बान संकोच में सत्कार करते हैं
    - पता चलता है, मेहमान ग़लत पते पर आए
    - रेवती का भाई, सच्चा मेहमान, आता है
    reasons:
      दो अनजान मेहमान आ धमकते हैं: पहले घर की परेशानी दिखाई जाती है, जिसमें मेहमान और मुश्किल बढ़ाते हैं।
      मेज़बान संकोच में सत्कार करते हैं: सत्कार तभी हो सकता है जब मेहमान आ चुके हों।
      पता चलता है, मेहमान ग़लत पते पर आए: सत्कार के बाद ही यह भेद खुला।
      रेवती का भाई, सच्चा मेहमान, आता है: एकांकी अपने असली मेहमान के आने पर खत्म होती है।
  lesson:
    - teach: '''नए मेहमान'' उदयशंकर भट्ट का एकांकी है: एक अंक का नाटक। गर्मी की रात है, शहर का एक छोटा-सा मकान। विश्वनाथ और उनकी पत्नी रेवती गर्मी, छोटे घर और रूखे पड़ोसियों से परेशान हैं; बच्चे भी बेचैन हैं।'
      check:
        prompt: एकांकी किसे कहते हैं?
        options:
        - एक अंक का नाटक
        - लंबा उपन्यास
        - कविता
        answer: एक अंक का नाटक
        why: '''एक'' + ''अंक'' = एकांकी।'
      ways:
      - style: visual
        teach: एकांकी कब और कहाँ घटता है, और परिवार किन बातों से परेशान है।
        picture:
          kind: compare
          columns:
          - title: समय और स्थान
            points:
            - गर्मी की रात
            - शहर का छोटा-सा मकान
          - title: परिवार की परेशानियाँ
            points:
            - गर्मी
            - छोटा घर
            - रूखे पड़ोसी
            - बेचैन बच्चे
          alt: एकांकी गर्मी की रात में शहर के एक छोटे मकान में घटता है; विश्वनाथ और रेवती गर्मी, छोटे घर, रूखे पड़ोसियों और बेचैन बच्चों से परेशान हैं।
      - style: real_world
        teach: 'एकांकी उस छोटे नाटक जैसा है जो स्कूल के वार्षिकोत्सव में पंद्रह-बीस मिनट में पूरा हो जाता है: एक जगह, थोड़े पात्र, एक ही समस्या। ''नए मेहमान'' भी एक रात और एक घर में पूरा हो जाता है।'
    - teach: 'तभी दो अनजान मेहमान आ धमकते हैं और ऐसे व्यवहार करते हैं मानो पुराने परिचित हों: पानी, खाना, बिस्तर, सब माँगते हैं। मेज़बान संकोच में उनका सत्कार करते हैं।'
      picture:
        kind: flow
        steps:
        - गर्मी की रात, परेशान परिवार
        - दो अनजान मेहमान आते हैं
        - संकोच में सत्कार
        - 'पता चला: ग़लत पता'
        - रेवती का भाई आता है
        alt: गर्मी की रात, अनजान मेहमान आते हैं, परिवार संकोच में सत्कार करता है, पता चलता है वे ग़लत पते पर आए थे, फिर रेवती का भाई आता है।
      check:
        prompt: '''संकोच'' का अर्थ है:'
        options:
        - झिझक, शर्म के कारण कुछ न कह पाना
        - बहुत गुस्सा
        - बड़ी खुशी
        answer: झिझक, शर्म के कारण कुछ न कह पाना
        why: परिवार झिझक के कारण मेहमानों से कुछ पूछ नहीं पाया।
      ways:
      - style: step_by_step
        teach: 'पहला: दो अनजान लोग अचानक आ धमकते हैं। दूसरा: वे पुराने परिचितों जैसा व्यवहार करते हैं। तीसरा: वे पानी, खाना और बिस्तर माँगते हैं। चौथा: विश्वनाथ और रेवती संकोच में कुछ पूछ नहीं पाते और सत्कार करते रहते हैं।'
      - style: real_world
        teach: कभी-कभी शादी के भोज में कोई अनजान व्यक्ति पूरे अधिकार से खाना खा रहा होता है, और हर कोई सोचता है कि वह दूसरे पक्ष का मेहमान होगा। संकोच में कोई पूछता नहीं। एकांकी की हँसी इसी संकोच से पैदा होती है।
    - teach: बाद में पता चलता है कि वे किसी और के घर जाना चाहते थे और ग़लत पते पर आ गए थे। अंत में रेवती का भाई आता है, जो सचमुच का अपना मेहमान है। एकांकी हास्य और व्यंग्य से शहरी जीवन की कठिनाइयाँ दिखाता है।
      check:
        prompt: अंत में असली मेहमान कौन निकला?
