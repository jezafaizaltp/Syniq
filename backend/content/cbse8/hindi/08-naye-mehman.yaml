      - style: step_by_step
        teach: 'पहला: हँसी कहाँ है: परिवार अनजान लोगों की सेवा करता रहा। दूसरा: व्यंग्य किस पर है: शहरी जीवन की तंगी पर, जहाँ छोटे घर में मेहमान भी बोझ लगने लगता है। तीसरा: और उस संकोच पर, जो सीधा सवाल पूछने से रोकता है। चौथा: इस तरह एकांकी हँसाते-हँसाते सोचने पर मजबूर करता है।'
  items:
