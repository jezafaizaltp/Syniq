    - मकान बनाना
    - बाग़ लगाना
    answer: लोगों के बीच भेदभाव और दूरी बनाना
    difficulty: 2
    hints:
    - यहाँ ईंट की दीवार की बात नहीं है।
    - एक कमरे के दो लोग भी बँटे हैं।
    solution: मन की दीवारें यानी भेदभाव, अहंकार और दूरी।
    mistakes:
      मकान बनाना: h8p_bhav
      बाग़ लगाना: h8p_bhav
  - prompt: कवि मनुष्य की किस कमी पर दुख प्रकट करते हैं?
    options:
    - छोटा होकर भी घमंड और घृणा
    - उसका कद छोटा होना
    - उसका गरीब होना
    answer: छोटा होकर भी घमंड और घृणा
    difficulty: 2
    hints:
    - कवि का दुख आकार का नहीं, स्वभाव का है।
    - मनुष्य के मन में क्या भरा है?
    solution: इतना छोटा होकर भी मनुष्य अहंकार और घृणा पालता है।
    mistakes:
      उसका कद छोटा होना: h8_chhota
      उसका गरीब होना: h8_chhota
  - prompt: '''आदमी का अनुपात'' के कवि कौन हैं?'
    options:
    - गिरिजाकुमार माथुर
    - दुष्यंत कुमार
    - भारतेंदु हरिश्चंद्र
    answer: गिरिजाकुमार माथुर
    difficulty: 1
    hints:
    - '''एक आशीर्वाद'' दूसरे कवि की है।'
    - भारतेंदु ने 'हरिद्वार' लिखा।
    solution: कविता गिरिजाकुमार माथुर की है।
    mistakes:
      दुष्यंत कुमार: h8p_kavi
      भारतेंदु हरिश्चंद्र: h8p_kavi
  - prompt: '''विनम्र'' का विलोम है:'
    options:
    - अहंकारी
    - दयालु
    - शांत
    answer: अहंकारी
    difficulty: 2
    hints:
    - विनम्र व्यक्ति झुककर बात करता है।
    - उलटा भाव कवि ने मनुष्य में दिखाया है।
    solution: विनम्र का विलोम अहंकारी (घमंडी) है।
    mistakes:
