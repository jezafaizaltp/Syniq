      शांत: h8p_arth
  - prompt: 'कविता में कमरे से पृथ्वी तक कितने स्तर हैं: कमरा, घर, मोहल्ला, नगर, प्रदेश, देश, पृथ्वी?'
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - हर नाम को एक-एक करके गिनो।
    - उँगलियों पर गिन सकते हो।
    solution: 'कमरा, घर, मोहल्ला, नगर, प्रदेश, देश, पृथ्वी: 7 स्तर।'
    mistakes:
      '6': h8p_kram
  - prompt: कविता का कौन-सा भाव विज्ञान से भी जुड़ता है?
    options:
    - ब्रह्मांड बहुत विशाल है और पृथ्वी उसका छोटा-सा हिस्सा
    - पृथ्वी ब्रह्मांड का केंद्र है
    - तारे गिने जा सकते हैं
    answer: ब्रह्मांड बहुत विशाल है और पृथ्वी उसका छोटा-सा हिस्सा
    difficulty: 2
    hints:
