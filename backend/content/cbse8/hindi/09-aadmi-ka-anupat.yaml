subject: cbse8-hin
chapter: 9
title: आदमी का अनुपात (कविता)
tips:
  h8_anupat: "अनुपात में दो चीज़ों की तुलना होती है: कौन कितना बड़ा या छोटा।"
  h8_chhota: "इतने बड़े ब्रह्मांड में एक आदमी का अनुपात सोचो।"
  h8_prithvi: "कविता कमरे से शुरू होकर बाहर फैलती जाती है: घर, नगर, देश, पृथ्वी, फिर उससे आगे।"
  h8_vinamra: "इतने छोटे होकर भी मनुष्य आपस में दीवारें खड़ी करता है। कवि क्या सीख देते हैं?"

concepts:
- code: cbse8h.m9.anupat
  title: आदमी का अनुपात (कविता)
  notes: |
    कवि: गिरिजाकुमार माथुर। कवि ब्रह्मांड में मनुष्य का 'अनुपात' (आकार की तुलना) दिखाते हैं: दो व्यक्ति कमरे
    में हैं, कमरा घर में, घर मोहल्ले में, मोहल्ला नगर में, नगर प्रदेश में, प्रदेश देश में, देश पृथ्वी पर, पृथ्वी
    अनगिनत नक्षत्रों और आकाशगंगाओं के बीच। इतने विशाल ब्रह्मांड में मनुष्य बहुत छोटा है, फिर भी वह ईर्ष्या,
    अहंकार, स्वार्थ और घृणा से भरा है और अपने चारों ओर दीवारें खड़ी करता है; एक ही कमरे के दो व्यक्ति भी
    अलग-अलग बँटे रहते हैं। संदेश: अपने छोटेपन को समझकर विनम्र बनो, भेदभाव और अहंकार छोड़ो।
  explanations:
    text: कवि दिखाते हैं कि आदमी कमरे में, कमरा घर में, घर शहर में, शहर देश में, देश पृथ्वी पर, और पृथ्वी अनगिनत तारों के बीच है। इतने बड़े ब्रह्मांड में इतना छोटा होकर भी मनुष्य अहंकार और ईर्ष्या से दीवारें खड़ी करता है। कविता विनम्रता और मेल-जोल सिखाती है।
    visual: 'कल्पना कीजिए: एक के अंदर एक बड़े होते घेरे: कमरा, घर, शहर, देश, पृथ्वी, तारे, आकाशगंगाएँ; और सबसे छोटे घेरे में दो आदमी जिनके बीच भी एक दीवार है।'
    step_by_step: '1. ''अनुपात'' का अर्थ समझें: तुलना में आकार। 2. घेरों का क्रम लिखें: कमरा से ब्रह्मांड तक। 3. मनुष्य के अवगुण पहचानें: ईर्ष्या, अहंकार, दीवारें। 4. संदेश: विनम्रता और एकता।'
    real_world: अंतरिक्ष से ली गई पृथ्वी की तस्वीर में देशों की सीमाएँ नहीं दिखतीं; वहाँ से पूरी मानवता एक ही छोटे नीले ग्रह पर दिखती है।
  picture:
    kind: flow
    steps:
    - दो व्यक्ति एक कमरे में
    - कमरा घर में, घर नगर में
    - नगर प्रदेश में, प्रदेश देश में
    - देश पृथ्वी पर
    - पृथ्वी अनगिनत तारों और आकाशगंगाओं के बीच
    alt: 'कविता का क्रम: कमरे से घर, नगर, प्रदेश, देश, पृथ्वी और फिर पूरे ब्रह्मांड तक, जिससे मनुष्य का छोटापन दिखता है।'
  items:
  - prompt: '''आदमी का अनुपात'' कविता के कवि कौन हैं?'
    options:
    - गिरिजाकुमार माथुर
    - दुष्यंत कुमार
    - महादेवी वर्मा
    - कबीर
    answer: गिरिजाकुमार माथुर
    difficulty: 1
    hints:
    - आधुनिक हिंदी कवि।
    - '''हम होंगे कामयाब'' के हिंदी रूपांतरकार।'
    solution: कविता गिरिजाकुमार माथुर की है।
    mistakes:
      दुष्यंत कुमार: hin8_read_again
  - prompt: '''अनुपात'' शब्द का अर्थ है:'
    options:
    - तुलना में आकार या मात्रा
    - दूरी
    - गति
    - रंग
    answer: तुलना में आकार या मात्रा
    difficulty: 1
    hints:
    - गणित में भी आता है।
    - एक चीज़ दूसरी की तुलना में कितनी।
    solution: अनुपात का अर्थ है दो चीज़ों की तुलना में आकार या मात्रा।
    mistakes: {"दूरी": "h8_anupat"}
  - prompt: कविता के अनुसार पृथ्वी कहाँ है?
    options:
    - अनगिनत तारों और आकाशगंगाओं के बीच
    - एक कमरे में
    - देश के अंदर
    - नगर के बीच
    answer: अनगिनत तारों और आकाशगंगाओं के बीच
    difficulty: 1
    hints:
    - सबसे बड़ा घेरा।
    - ब्रह्मांड।
    solution: पृथ्वी अनगिनत नक्षत्रों और आकाशगंगाओं के बीच एक छोटा-सा ग्रह है।
    mistakes: {"एक कमरे में": "h8_prithvi"}
  - prompt: ब्रह्मांड की तुलना में मनुष्य कैसा है?
    options:
    - बहुत छोटा
    - बहुत बड़ा
    - सबसे शक्तिशाली
    - ब्रह्मांड के बराबर
    answer: बहुत छोटा
    difficulty: 1
    hints:
    - घेरे बढ़ते जाते हैं।
    - सबसे अंदर मनुष्य।
    solution: विशाल ब्रह्मांड में मनुष्य अत्यंत छोटा है।
    mistakes: {"बहुत बड़ा": "h8_chhota"}
  - prompt: कवि को मनुष्य की किस बात पर दुख है?
    options:
    - इतना छोटा होकर भी वह अहंकार और ईर्ष्या से दीवारें खड़ी करता है
    - वह बहुत पढ़ता है
    - वह यात्रा करता है
    - वह तारे देखता है
    answer: इतना छोटा होकर भी वह अहंकार और ईर्ष्या से दीवारें खड़ी करता है
    difficulty: 2
    hints:
    - कमरे के दो व्यक्ति भी बँटे हैं।
    - अवगुण।
    solution: कवि दुखी हैं कि छोटा मनुष्य भी अहंकार, ईर्ष्या और भेदभाव की दीवारें बनाता है।
    mistakes:
      वह तारे देखता है: hin8_poem_meaning
  - prompt: कविता का संदेश क्या है?
    options:
    - अपने छोटेपन को समझकर विनम्र बनो और भेदभाव छोड़ो
    - बड़ा घर बनाओ
    - दूसरे ग्रह पर जाओ
    - अकेले रहो
    answer: अपने छोटेपन को समझकर विनम्र बनो और भेदभाव छोड़ो
    difficulty: 2
    hints:
    - अहंकार का उलटा।
    - दीवारें गिराओ।
    solution: कविता विनम्रता, एकता और भेदभाव छोड़ने का संदेश देती है।
    mistakes: {"बड़ा घर बनाओ": "h8_vinamra"}
