      घर के: h8p_kram
  - prompt: '''ईर्ष्या'' शब्द का अर्थ है:'
    options:
    - जलन
    - प्रेम
    - दया
    answer: जलन
    difficulty: 1
    hints:
    - दूसरे की उन्नति देखकर मन में उठने वाला बुरा भाव।
    - कवि इसे मनुष्य की बुराई बताते हैं।
    solution: ईर्ष्या = जलन, डाह।
    mistakes:
      प्रेम: h8p_arth
      दया: h8p_arth
  - prompt: '''दीवारें खड़ी करना'' का कविता में क्या अर्थ है?'
    options:
