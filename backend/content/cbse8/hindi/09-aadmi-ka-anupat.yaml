    answer: अपने छोटेपन को समझकर विनम्र बनो और भेदभाव छोड़ो
    difficulty: 2
    hints:
    - अहंकार का उलटा।
    - दीवारें गिराओ।
    solution: कविता विनम्रता, एकता और भेदभाव छोड़ने का संदेश देती है।
    mistakes: {"बड़ा घर बनाओ": "h8_vinamra"}
  - prompt: मोहल्ला किसके अंदर है?
    options:
    - नगर के
    - कमरे के
    - घर के
    answer: नगर के
    difficulty: 1
    hints:
    - 'कविता की सीढ़ी याद करो: घर, मोहल्ला, फिर?'
    - मोहल्ले से बड़ा क्या है?
    solution: घर मोहल्ले में और मोहल्ला नगर में है।
    mistakes:
