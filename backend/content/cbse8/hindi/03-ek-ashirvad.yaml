subject: cbse8-hin
chapter: 3
title: एक आशीर्वाद (कविता)
tips:
  h8_ashirvad_sandesh: "कवि चाहते हैं बच्चा अपने पैरों पर खड़ा हो।"
  h8_bade_swapn: "कवि धन की नहीं, मन की उड़ान की बात करते हैं।"
  h8_machalna: "बच्चे चाँद माँगकर ज़िद करते हैं। कवि ऐसी चीज़ों की ज़िद छोड़ने को कहते हैं।"
  h8_ungli: "यह मुहावरा है: जो दीपक छूता है वह सीखता है कि आग जलाती है।"
  h8a_khushi: "कवि बच्चे का जीवन आनंद से भरा देखना चाहते हैं। कौन-से काम खुशी देते हैं?"
  h8a_atma: "आत्मनिर्भर व्यक्ति दूसरों के सहारे नहीं रहता। कौन-सा विकल्प खुद करने का है?"
  h8a_arth: 'पंक्ति का सीधा अर्थ नहीं, छिपा अर्थ सोचो: कवि जीवन के बारे में क्या कह रहे हैं?'
  h8a_shabd: वाक्य में शब्द कहाँ आया है, उससे अर्थ समझो।
  h8a_kavi: हर कविता का कवि अलग है। पाठ के ऊपर लिखा नाम याद करो।

concepts:
- code: cbse8h.m3.ashirvad
  title: एक आशीर्वाद (कविता)
  notes: |
    कवि: दुष्यंत कुमार। कविता एक बच्चे (या युवा) को दिया गया आशीर्वाद है: "जा तेरे स्वप्न बड़े हों।" कवि चाहते हैं
    कि बच्चा भावना की गोद से उतरकर जल्दी पृथ्वी पर चलना सीखे, यानी कल्पना से निकलकर जीवन की सच्चाई का
    सामना करे; चाँद-तारों जैसी असंभव चीज़ों के लिए मचलना छोड़े; हँसे-मुस्कुराए-गाए; हर दीपक की लौ पकड़ने को
    उँगली जलाए, अर्थात अनुभव से सीखे; और अपने पाँवों पर खड़ा हो। संदेश: बड़े सपने देखो, पर संघर्ष और अनुभव से
    आत्मनिर्भर बनो।
  explanations:
    text: 'कवि एक बच्चे को आशीर्वाद देते हैं: तुम्हारे सपने बड़े हों। वे चाहते हैं कि वह कल्पना की दुनिया से निकलकर असली जीवन में चलना सीखे, ग़लतियों और अनुभवों से सीखे, हँसता-गाता रहे और अपने पैरों पर खड़ा हो।'
    visual: 'कल्पना कीजिए: माँ की गोद से उतरकर ज़मीन पर पहला कदम रखता बच्चा, ऊपर चाँद-तारे, और सामने एक दीपक जिसकी लौ को छूकर वह सीखता है।'
    step_by_step: '1. आशीर्वाद पहचानें: ''जा तेरे स्वप्न बड़े हों।'' 2. ''भावना की गोद से उतरना'' का अर्थ समझें। 3. ''उँगली जलाना'' का अर्थ: अनुभव से सीखना। 4. संदेश: बड़े सपने और आत्मनिर्भरता।'
    real_world: साइकिल चलाना सीखते समय गिरना पड़ता है; हर गिरना एक 'जली उँगली' है जिससे हम आगे बढ़ना सीखते हैं।
  picture:
    kind: flow
    steps:
    - 'आशीर्वाद: तेरे स्वप्न बड़े हों'
    - भावना की गोद से उतरकर धरती पर चल
    - असंभव चीज़ों के लिए मचलना छोड़
    - 'अनुभव से सीख: लौ छूकर उँगली जला'
    - हँस, गा और अपने पैरों पर खड़ा हो
    alt: 'कविता का भाव: बड़े सपनों का आशीर्वाद, कल्पना से वास्तविकता की ओर, अनुभव से सीखना, और आत्मनिर्भर बनना।'
  activity:
    type: sort
    prompt: कवि बच्चे से क्या करने को कहते हैं और क्या छोड़ने को?
    bins:
    - करने को कहते हैं
    - छोड़ने को कहते हैं
    items:
    - label: बड़े सपने देखना
      bin: करने को कहते हैं
      clue: '''जा तेरे स्वप्न बड़े हों'' का अर्थ?'
      why: आशीर्वाद ही बड़े सपनों का है।
    - label: पृथ्वी पर चलना सीखना
      bin: करने को कहते हैं
      clue: भावना की गोद से उतरकर क्या करना है?
      why: जीवन की सच्चाई का सामना करना।
    - label: दीपक की लौ पकड़ने को उँगली जलाना
      bin: करने को कहते हैं
      clue: उँगली जलने से क्या मिलता है?
      why: अनुभव से सीखना।
    - label: चाँद-तारों के लिए मचलना
      bin: छोड़ने को कहते हैं
      clue: असंभव चीज़ों की ज़िद?
      why: कवि यह मचलना छोड़ने को कहते हैं।
    - label: भावना की गोद में ही रहना
      bin: छोड़ने को कहते हैं
      clue: कवि चाहते हैं बच्चा कहाँ से उतरे?
      why: कल्पना से निकलकर यथार्थ में आना।
  lesson:
    - teach: '''एक आशीर्वाद'' दुष्यंत कुमार की कविता है। इसमें कवि एक बच्चे को आशीर्वाद देते हैं: ''जा तेरे स्वप्न बड़े हों।'' यानी तुम बड़े सपने देखो।'
      check:
        prompt: '''स्वप्न'' का अर्थ क्या है?'
        options:
        - सपना
        - खिलौना
        - घर
        answer: सपना
        why: स्वप्न = सपना।
    - teach: 'कवि चाहते हैं कि बच्चा ''भावना की गोद से उतरकर'' पृथ्वी पर चलना सीखे: कल्पना से निकलकर जीवन की सच्चाई का सामना करे। वह चाँद-तारों जैसी असंभव चीज़ों के लिए मचलना छोड़ दे।'
      check:
        prompt: '''मचलना'' का अर्थ है:'
        options:
        - किसी चीज़ के लिए ज़िद करना
        - सो जाना
        - पढ़ना
        answer: किसी चीज़ के लिए ज़िद करना
        why: बच्चे चाँद-तारों के लिए ज़िद करते हैं, कवि उसे छोड़ने को कहते हैं।
    - teach: 'कवि चाहते हैं कि बच्चा हँसे, मुस्कुराए, गाए, और ''हर दीपक की लौ पकड़ने को उँगली जलाए'', यानी खुद अनुभव करके सीखे। अंत में वह अपने पाँवों पर खड़ा हो: आत्मनिर्भर बने।'
      picture:
        kind: flow
        steps:
        - बड़े सपने देखो
        - सच्चाई का सामना करो
        - अनुभव से सीखो
        - आत्मनिर्भर बनो
        alt: बड़े सपने देखो, सच्चाई का सामना करो, अनुभव से सीखो और आत्मनिर्भर बनो।
      check:
        prompt: '''अपने पाँवों पर खड़ा होना'' का अर्थ है:'
        options:
        - आत्मनिर्भर होना
        - खड़े होकर पढ़ना
        - दौड़ना
        answer: आत्मनिर्भर होना
        why: यह मुहावरा है, अर्थ है किसी पर निर्भर न रहना।
  items:
  - prompt: '''एक आशीर्वाद'' कविता के कवि कौन हैं?'
    options:
    - दुष्यंत कुमार
    - महादेवी वर्मा
    - कबीर
    - गिरिजाकुमार माथुर
    answer: दुष्यंत कुमार
    difficulty: 1
    hints:
    - ग़ज़लों के लिए प्रसिद्ध।
    - '''साये में धूप''।'
    solution: कविता दुष्यंत कुमार की है।
    mistakes:
      महादेवी वर्मा: hin8_read_again
  - prompt: कवि बच्चे को क्या आशीर्वाद देते हैं?
    options:
    - तेरे स्वप्न बड़े हों
    - तू बहुत धनी बने
    - तू कभी न गिरे
    - तू राजा बने
    answer: तेरे स्वप्न बड़े हों
    difficulty: 1
    hints:
    - पहली पंक्ति।
    - सपनों के बारे में।
    solution: '''जा तेरे स्वप्न बड़े हों।'''
    mistakes: {"तू बहुत धनी बने": "h8_bade_swapn"}
  - prompt: '''भावना की गोद से उतरकर पृथ्वी पर चलना'' का अर्थ है:'
    options:
    - कल्पना से निकलकर जीवन की सच्चाई का सामना करना
    - माँ की गोद छोड़ देना
    - बहुत तेज़ चलना
    - ज़मीन पर सो जाना
    answer: कल्पना से निकलकर जीवन की सच्चाई का सामना करना
    difficulty: 2
    hints:
    - यह मुहावरेदार अर्थ है।
    - भावना = कल्पना; पृथ्वी = वास्तविकता।
    solution: इसका अर्थ है सपनों की दुनिया से निकलकर असली जीवन में कदम रखना।
    mistakes:
      माँ की गोद छोड़ देना: hin8_poem_meaning
  - prompt: '''उँगली जलाना'' से कवि का क्या आशय है?'
    options:
    - अनुभव से सीखना
    - खाना बनाना
    - दीपक जलाना
    - चोट से डरना
    answer: अनुभव से सीखना
    difficulty: 2
    hints:
    - लौ छूकर बच्चा सीखता है।
    - ग़लती से सबक।
    solution: ग़लतियों और अनुभवों से ही सच्ची सीख मिलती है।
    mistakes: {"दीपक जलाना": "h8_ungli"}
  - prompt: कवि बच्चे को किन चीज़ों के लिए मचलना छोड़ने को कहते हैं?
    options:
    - चाँद-तारों जैसी असंभव चीज़ों के लिए
    - खिलौनों के लिए
    - किताबों के लिए
    - दोस्तों के लिए
    answer: चाँद-तारों जैसी असंभव चीज़ों के लिए
    difficulty: 1
    hints:
    - जो पहुँच से बाहर हैं।
    - आकाश में।
    solution: कवि चाहते हैं कि बच्चा असंभव चीज़ों के लिए ज़िद न करे।
    mistakes: {"किताबों के लिए": "h8_machalna"}
  - prompt: कविता का मुख्य संदेश क्या है?
    options:
    - बड़े सपने देखो और संघर्ष से आत्मनिर्भर बनो
    - कभी सपने मत देखो
    - हमेशा गोद में रहो
    - दीपक से दूर रहो
    answer: बड़े सपने देखो और संघर्ष से आत्मनिर्भर बनो
    difficulty: 2
    hints:
    - आशीर्वाद और सीख दोनों।
    - अपने पैरों पर खड़ा होना।
    solution: कविता बड़े सपनों और अनुभव से मिलने वाली आत्मनिर्भरता का संदेश देती है।
    mistakes: {"हमेशा गोद में रहो": "h8_ashirvad_sandesh"}
  - prompt: '''आशीर्वाद'' कौन देता है, आमतौर पर?'
    options:
    - बड़े लोग, छोटों को
    - छोटे बच्चे, बड़ों को
    - केवल दुकानदार
    answer: बड़े लोग, छोटों को
    difficulty: 1
    hints:
    - दादा-दादी, माता-पिता बच्चों को देते हैं।
    - कविता में कवि एक बच्चे को दे रहे हैं।
    solution: आशीर्वाद बड़े अपने से छोटों को शुभकामना के रूप में देते हैं।
    mistakes:
      छोटे बच्चे, बड़ों को: h8a_shabd
      केवल दुकानदार: h8a_shabd
  - prompt: '''हर दीपक की लौ पकड़ने को उँगली जलाना'' में ''लौ'' का अर्थ है:'
    options:
    - आग की ज्वाला
    - हवा
    - पानी
    answer: आग की ज्वाला
    difficulty: 1
    hints:
    - दीपक में जलती है।
    - इसे छूने से उँगली जलती है।
    solution: लौ = दीपक की जलती ज्योति।
    mistakes:
      हवा: h8a_shabd
      पानी: h8a_shabd
  - prompt: कवि बच्चे को किससे निकलकर सच्चाई का सामना करने को कहते हैं?
    options:
    - भावना और कल्पना की दुनिया से
    - स्कूल से
    - खेल के मैदान से
    answer: भावना और कल्पना की दुनिया से
    difficulty: 2
    hints:
    - '''भावना की गोद'' का अर्थ सोचो।'
    - पृथ्वी पर चलना यानी असली जीवन।
    solution: कवि चाहते हैं कि बच्चा कल्पना से निकलकर जीवन की सच्चाई देखे।
    mistakes:
      स्कूल से: h8a_arth
      खेल के मैदान से: h8a_arth
  - prompt: कवि के अनुसार अनुभव से सीखना क्यों ज़रूरी है?
    options:
    - खुद करके सीखी बात पक्की होती है
    - किताबें बेकार हैं
    - उँगली जलाना अच्छा है
    answer: खुद करके सीखी बात पक्की होती है
    difficulty: 3
    hints:
    - '''उँगली जलाना'' का छिपा अर्थ क्या है?'
    - गलतियों से भी सीख मिलती है।
    solution: अपने अनुभव से सीखा हुआ ज्ञान जीवन भर साथ रहता है।
    mistakes:
      किताबें बेकार हैं: h8_ungli
      उँगली जलाना अच्छा है: h8_ungli
  - prompt: '''असंभव'' शब्द का विलोम है:'
    options:
    - संभव
    - कठिन
    - सुंदर
    answer: संभव
    difficulty: 1
    hints:
    - '''अ'' हटाकर देखो।'
    - जो हो सकता हो।
    solution: असंभव का विलोम संभव है।
    mistakes:
      कठिन: h8a_shabd
      सुंदर: h8a_shabd
  - prompt: कविता का स्वर कैसा है?
    options:
    - प्रेरणा और शुभकामना से भरा
    - दुख और निराशा से भरा
    - गुस्से से भरा
    answer: प्रेरणा और शुभकामना से भरा
    difficulty: 2
    hints:
    - यह एक आशीर्वाद है।
    - कवि बच्चे का भला चाहते हैं।
    solution: कविता बच्चे को प्रेरित करती है और शुभकामना देती है।
    mistakes:
      दुख और निराशा से भरा: h8_ashirvad_sandesh
      गुस्से से भरा: h8_ashirvad_sandesh
  - prompt: '''एक आशीर्वाद'' के कवि ने और कौन-सी विधा में प्रसिद्धि पाई?'
    options:
    - ग़ज़ल
    - नाटक
    - उपन्यास
    answer: ग़ज़ल
    difficulty: 3
    hints:
    - उनकी 'साये में धूप' बहुत प्रसिद्ध है।
    - यह शेरों से बनी कविता है।
    solution: दुष्यंत कुमार हिंदी ग़ज़ल के लिए बहुत प्रसिद्ध हैं।
    mistakes:
      नाटक: h8a_kavi
      उपन्यास: h8a_kavi
