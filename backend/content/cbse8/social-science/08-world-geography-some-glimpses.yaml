# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 8 (Part 2 chapter 1). Format: content/README.md.
subject: cbse8-ss
chapter: 8
title: 'World Geography: Some Glimpses'
tips:
  c8ss_land_vs_water: "29% is the land. Oceans cover the rest of the Earth's surface; subtract from 100."
  s8_antarctica: "Most fresh water is frozen. Which continent is covered by an ice sheet?"
  s8_arctic: "The Indian Ocean is third largest. Which ocean is around the North Pole?"
  s8_asia: "Africa is second. Which continent is the biggest?"
  s8_continents: "Name them one by one around a globe: remember the Americas are two, and the frozen land at the South Pole counts too."
  s8_coral: "Rainforests are known for variety of life. What do reefs share with them?"
  s8_gulf_stream: "Western Europe isn't near the equator. What warms its coast?"
  s8_mercator: "On Mercator maps Greenland looks as big as Africa. What is distorted near the poles?"
  s8_pacific: "The Atlantic is second. Which ocean is bigger than all the land put together?"
  s8_sahara: "The Thar is in India and much smaller. Which desert covers north Africa?"
  s8_third_pole: "The North and South Poles are full of ice. What does Tibet hold that is like them?"
  s8_urals: "The Alps are inside Europe. Which range divides Europe from Asia?"
  s8w_ocean_order: "Picture the globe: which ocean is at the very top, which circles the bottom, and which touches India?"
  s8w_land: "Land and oceans together make the whole surface, 100%. Take away the ocean share."
  s8w_water: "All of Earth's water together is 100%. Take away the ocean share."
  s8w_mountains: "Match the range to its continent: the Andes are in South America and the Himalayas in Asia. Which is left for Europe?"
  s8w_diff: "How much longer means find the difference: take the shorter length from the longer one."
  s8w_current: Warm currents carry heat from the tropics; cold currents bring cold water from the poles.
  s8w_projection: A round Earth cannot be flattened without stretching. Which part does the Mercator map stretch?
  s8w_continent_size: "Which continent is also a single country, and smaller even than Europe?"
  s8w_desert: Hot deserts are near the tropics; cold deserts are high or far from the sea.
  s8w_rivers: "Picture the river on a map: does it flow through Egypt, Brazil or China?"
concepts:
- code: cbse8ss.world.oceans
  title: Oceans and maps of the world
  notes: |
    Oceans cover about 71% of the Earth (the 'blue planet') and hold about 97% of its water. The five oceans:
    Pacific (largest and deepest; the Mariana Trench's Challenger Deep is over 11,000 m), Atlantic, Indian,
    Southern and Arctic (smallest). Ocean currents move heat: the warm Gulf Stream keeps western Europe mild.
    Coral reefs, the 'rainforests of the sea', like the Great Barrier Reef, are threatened by warming and
    pollution. Because the Earth is round, flat maps distort it: the Mercator projection keeps directions
    for navigation but enlarges areas near the poles.
  explanations:
    text: Most of our planet is ocean, about 71%. The Pacific is the biggest and deepest; its deepest point, in the Mariana Trench, is deeper than Mount Everest is tall. Ocean currents carry warm and cold water around the world and change the climate of the lands they pass.
    visual: 'Draw a pie of the Earth''s surface: a large blue slice of 71% for oceans and a 29% slice for land. Next to it, list the five oceans from largest (Pacific) to smallest (Arctic).'
    step_by_step: 'Step 1: Remember that oceans cover about 71% of Earth. Step 2: Order the oceans: Pacific, Atlantic, Indian, Southern, Arctic. Step 3: Warm currents warm nearby coasts; cold currents cool them. Step 4: Flat maps always stretch something, so check the projection.'
    real_world: On many wall maps (Mercator), Greenland looks as big as Africa, but Africa is actually about 14 times larger.
  picture:
    kind: bars
    bars:
    - label: Pacific
      value: 165
    - label: Atlantic
      value: 106
    - label: Indian
      value: 70
    - label: Southern
      value: 21
    - label: Arctic
      value: 14
    unit: million km² (approx.)
    caption: The Pacific is bigger than all the land on Earth put together.
    alt: 'Bars of approximate ocean areas: Pacific 165, Atlantic 106, Indian 70, Southern 21 and Arctic 14 million square kilometres.'
  activity:
    type: sort
    prompt: Which ocean fact?
    bins:
    - Pacific
    - Atlantic
    - Arctic
    items:
    - label: Challenger Deep, over 11,000 m
      bin: Pacific
      clue: Deepest.
      why: Pacific.
    - label: Warm Gulf Stream keeps Europe mild
      bin: Atlantic
      clue: Between America and Europe.
      why: Atlantic.
    - label: Smallest ocean
      bin: Arctic
      clue: Top of the world.
      why: Arctic.
    - label: Largest ocean
      bin: Pacific
      clue: Biggest.
      why: Pacific.
  lesson:
    - teach: 'Oceans cover about 71% of the Earth''s surface and hold about 97% of its water, so Earth is called the blue planet. There are five oceans: Pacific (largest and deepest), Atlantic, Indian, Southern and Arctic (smallest).'
      picture:
        kind: bars
        bars:
        - label: Pacific
          value: 165
        - label: Atlantic
          value: 106
        - label: Indian
          value: 70
        - label: Southern
          value: 22
        - label: Arctic
          value: 14
        unit: million km²
        alt: 'Ocean sizes: Pacific about 165, Atlantic 106, Indian 70, Southern 22, Arctic 14 million square km.'
      check:
        prompt: Which ocean is third largest?
        options:
        - Indian
        - Atlantic
        - Arctic
        answer: Indian
        why: Pacific, then Atlantic, then Indian.
    - teach: Ocean currents are rivers of water inside the sea. Warm currents carry heat from the tropics; cold ones bring cold water from the poles. The warm Gulf Stream keeps western Europe's winters mild. The deepest point is Challenger Deep in the Pacific's Mariana Trench, over 11,000 m down.
      check:
        prompt: What does a warm ocean current do to the coast it flows past?
        options:
        - Makes it milder and warmer
        - Makes it colder
        - Makes it a desert
        answer: Makes it milder and warmer
        why: Warm water warms the air above it.
    - teach: Coral reefs, like Australia's Great Barrier Reef, are called the rainforests of the sea because so many creatures live there. Warming and pollution are damaging them. Because Earth is round, flat maps stretch it; the Mercator map keeps directions for sailors but makes places near the poles look much bigger.
      check:
        prompt: On a Mercator map, Greenland looks as big as Africa. Why?
        options:
        - The map stretches areas near the poles
        - Greenland is really that big
        - Africa is shrinking
        answer: The map stretches areas near the poles
        why: Africa is about 14 times bigger than Greenland.
  items:
  - prompt: About what percentage of the Earth's surface is covered by oceans? Type the number only.
    answer: '71'
    check: '71'
    difficulty: 1
    hints:
    - More than two-thirds.
    - Seventy-one.
    solution: Oceans cover about 71% of the Earth's surface.
    mistakes:
      '29': c8ss_land_vs_water
  - prompt: Which is the largest and deepest ocean?
    options:
    - Pacific Ocean
    - Atlantic Ocean
    - Indian Ocean
    - Arctic Ocean
    answer: Pacific Ocean
    difficulty: 1
    hints:
    - Mariana Trench is in it.
    - P...
    solution: The Pacific is both the largest and the deepest.
    mistakes: {"Atlantic Ocean": "s8_pacific"}
  - prompt: Which is the smallest ocean?
    options:
    - Arctic Ocean
    - Indian Ocean
    - Southern Ocean
    - Atlantic Ocean
    answer: Arctic Ocean
    difficulty: 1
    hints:
    - Around the North Pole.
    - Mostly frozen.
    solution: The Arctic is the smallest and shallowest ocean.
    mistakes: {"Indian Ocean": "s8_arctic", "Southern Ocean": "s8_arctic"}
  - prompt: Why does western Europe have milder winters than other places as far north?
    options:
    - The warm Gulf Stream current
    - It is near the equator
    - It has many mountains
    - It has no oceans nearby
    answer: The warm Gulf Stream current
    difficulty: 2
    hints:
    - An ocean current.
    - Warm water from the tropics.
    solution: The warm Gulf Stream (North Atlantic Drift) carries heat to western Europe.
    mistakes: {"It is near the equator": "s8_gulf_stream"}
  - prompt: Why are coral reefs called 'rainforests of the sea'?
    options:
    - They are home to a huge variety of sea life
    - They are made of trees
    - It rains a lot over them
    - They are green
    answer: They are home to a huge variety of sea life
    difficulty: 2
    hints:
    - Biodiversity.
    - About a quarter of ocean species.
    solution: Coral reefs support an enormous variety of marine species.
    mistakes: {"They are made of trees": "s8_coral"}
  - prompt: What is the problem with the Mercator map projection?
    options:
    - It makes lands near the poles look much bigger
    - It shows wrong directions
    - It leaves out oceans
    - It only shows India
    answer: It makes lands near the poles look much bigger
    difficulty: 3
    hints:
    - Greenland looks as big as Africa.
    - Area distortion.
    solution: Mercator keeps directions but greatly enlarges high-latitude areas.
    mistakes: {"It shows wrong directions": "s8_mercator"}
  - prompt: Which ocean lies to the south of India?
    options:
    - Indian Ocean
    - Pacific Ocean
    - Arctic Ocean
    answer: Indian Ocean
    difficulty: 1
    hints:
    - It is named after our country.
    - The Arctic is at the far north.
    solution: The Indian Ocean lies south of India.
    mistakes:
      Pacific Ocean: s8w_ocean_order
      Arctic Ocean: s8w_ocean_order
  - prompt: Which ocean surrounds Antarctica?
    options:
    - Southern Ocean
    - Arctic Ocean
    - Indian Ocean
    answer: Southern Ocean
    difficulty: 2
    hints:
    - Antarctica is at the South Pole.
    - The Arctic is at the North Pole.
    solution: The Southern Ocean circles Antarctica.
    mistakes:
      Arctic Ocean: s8_arctic
      Indian Ocean: s8w_ocean_order
  - prompt: About what percentage of Earth's surface is land, if oceans cover 71%?
    answer: '29'
    check: 100-71
    difficulty: 1
    hints:
    - Land and water together make the whole surface.
    - Take 71 from 100.
    solution: 100 − 71 = 29% is land.
    mistakes:
      '71': s8w_land
  - prompt: What kind of current brings cold water from the poles?
    options:
    - A cold current
    - A warm current
    - A river current
    answer: A cold current
    difficulty: 1
    hints:
    - Poles are icy.
    - Water from there is not warm.
    solution: Cold currents flow from polar regions towards the equator.
    mistakes:
      A warm current: s8w_current
      A river current: s8w_current
  - prompt: In which ocean is the Mariana Trench, the deepest place on Earth?
    options:
    - Pacific
    - Atlantic
    - Indian
    answer: Pacific
    difficulty: 2
    hints:
    - It is also the largest ocean.
    - It lies east of the Philippines.
    solution: The Mariana Trench is in the western Pacific.
    mistakes:
      Atlantic: s8_pacific
      Indian: s8_pacific
  - prompt: Which threatens coral reefs most today?
    options:
    - Warming seas and pollution
    - Too many mountains
    - Cold winds from the Sahara
    answer: Warming seas and pollution
    difficulty: 2
    hints:
    - Corals are sensitive to water temperature.
    - Warm water makes them turn white.
    solution: Warmer water bleaches corals; pollution and plastic harm them too.
    mistakes:
      Too many mountains: s8_coral
      Cold winds from the Sahara: s8_coral
  - prompt: Why do sailors still like the Mercator map?
    options:
    - It keeps directions correct for steering
    - It shows the true size of countries
    - It shows ocean depths
    answer: It keeps directions correct for steering
    difficulty: 3
    hints:
    - Its sizes are wrong, but something else is right.
    - A straight line on it is a constant compass direction.
    solution: Mercator keeps directions true, which helps navigation, though sizes near the poles are stretched.
    mistakes:
      It shows the true size of countries: s8w_projection
      It shows ocean depths: s8w_projection
  - prompt: If oceans hold 97% of Earth's water, what percentage is everywhere else (ice, rivers, lakes, ground)?
    answer: '3'
    check: 100-97
    difficulty: 2
    hints:
    - All the water together is 100%.
    - Take the ocean share from the whole.
    solution: 100 − 97 = 3%, and most of that is frozen as ice.
    mistakes:
      '97': s8w_water
  - prompt: Which ocean is the smallest and mostly frozen?
    options:
    - Arctic
    - Southern
    - Indian
    answer: Arctic
    difficulty: 1
    hints:
    - It is at the top of the globe.
    - Polar bears live near it.
    solution: The Arctic Ocean, around the North Pole, is the smallest.
    mistakes:
      Southern: s8w_ocean_order
      Indian: s8w_ocean_order
- code: cbse8ss.world.continents
  title: Continents and their landforms
  after:
  - cbse8ss.world.oceans
  notes: |
    There are seven continents: Asia (largest), Africa, North America, South America, Antarctica, Europe and
    Australia (smallest). Major landforms: the Himalayas and the Tibetan Plateau ('the Third Pole', source of
    the Indus, Brahmaputra and Yangtze); the Ural Mountains between Europe and Asia; the Alps; the Sahara
    (largest hot desert) and the Nile (about 6,650 km, often called the longest river); the Andes and the
    Amazon; the Atacama, one of the driest places; and Antarctica, the coldest, driest continent, holding about
    70% of the world's fresh water as ice. The Gobi is a cold desert.
  explanations:
    text: 'The land on Earth is divided into seven continents. Asia is the largest and Australia the smallest. Each has famous landforms: the Himalayas in Asia, the Sahara and the Nile in Africa, the Andes and the Amazon in South America, and the icy desert of Antarctica.'
    visual: 'Draw a rough world map with the seven continents and stick a symbol on each: mountains on Asia, a pyramid and river on Africa, a rainforest on South America, an ice sheet on Antarctica.'
    step_by_step: 'Step 1: List the seven continents by size: Asia, Africa, North America, South America, Antarctica, Europe, Australia. Step 2: Link each with one big landform. Step 3: Think how landforms shape climate and how people live.'
    real_world: The Tibetan Plateau is called the 'Third Pole' because its glaciers hold more ice than anywhere outside the Arctic and Antarctic, feeding rivers that over a billion people depend on.
  picture:
    kind: compare
    columns:
    - title: Continent
      points:
      - Asia
      - Africa
      - South America
      - Europe
      - Antarctica
    - title: A famous feature
      points:
      - Himalayas, Tibetan Plateau
      - Sahara Desert, River Nile
      - Andes, Amazon
      - Alps, European Plain
      - Ice sheet, 70% of fresh water
    alt: 'Continents matched with famous features: Asia and the Himalayas, Africa and the Sahara and Nile, South America and the Andes and Amazon, Europe and the Alps, Antarctica and its ice sheet.'
    caption: Each continent has landforms that shape life there.
  activity:
    type: sort
    prompt: Which continent?
    bins:
    - Asia
    - Africa
    - South America
    - Antarctica
    items:
    - label: Tibetan Plateau, 'the Third Pole'
      bin: Asia
      clue: Himalayas.
      why: Asia.
    - label: Sahara and the Nile
      bin: Africa
      clue: Largest hot desert.
      why: Africa.
    - label: Andes and Amazon
      bin: South America
      clue: Long mountain chain.
      why: South America.
    - label: Holds about 70% of fresh water as ice
      bin: Antarctica
      clue: Coldest.
      why: Antarctica.
    - label: Atacama, one of the driest places
      bin: South America
      clue: Near the Andes.
      why: South America.
    - label: Gobi, a cold desert
      bin: Asia
      clue: Mongolia.
      why: Asia.
  lesson:
    - teach: 'There are seven continents: Asia (largest), Africa, North America, South America, Antarctica, Europe and Australia (smallest). Asia and Europe share one landmass; the Ural Mountains mark the line between them.'
      picture:
        kind: bars
        bars:
        - label: Asia
          value: 44
        - label: Africa
          value: 30
        - label: N. America
          value: 24
        - label: S. America
          value: 18
        - label: Antarctica
          value: 14
        - label: Europe
          value: 10
        - label: Australia
          value: 9
        unit: million km²
        alt: Continent sizes from Asia (44) down to Australia (about 9) million square km.
      check:
        prompt: Which continent is second largest?
        options:
        - Africa
        - Europe
        - Antarctica
        answer: Africa
        why: Asia is first, Africa second.
    - teach: 'The Himalayas and Tibetan Plateau are called the Third Pole: their glaciers feed the Indus, Brahmaputra and Yangtze. The Alps are in Europe and the Andes run along South America, with the Amazon rainforest and river east of them.'
      check:
        prompt: Which mountain range runs along the west of South America?
        options:
        - Andes
        - Alps
        - Urals
        answer: Andes
        why: The Andes are the longest mountain range on land.
    - teach: The Sahara in Africa is the largest hot desert, and the Nile, about 6,650 km, is often called the longest river. The Atacama in Chile is one of the driest places, the Gobi is a cold desert, and Antarctica is the coldest, driest continent, holding about 70% of the world's fresh water as ice.
      check:
        prompt: Which desert is cold rather than hot?
        options:
        - Gobi
        - Sahara
        - Thar
        answer: Gobi
        why: The Gobi in Mongolia and China has freezing winters.
  items:
  - prompt: How many continents are there?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Asia, Africa, the Americas ...
    - Seven.
    solution: There are seven continents.
    mistakes: {"5": "s8_continents", "6": "s8_continents"}
  - prompt: Which is the largest continent?
    options:
    - Asia
    - Africa
    - North America
    - Europe
    answer: Asia
    difficulty: 1
    hints:
    - India is in it.
    - A...
    solution: Asia is the largest continent.
    mistakes: {"Africa": "s8_asia"}
  - prompt: Which mountain range separates Europe from Asia?
    options:
    - The Urals
    - The Alps
    - The Andes
    - The Rockies
    answer: The Urals
    difficulty: 2
    hints:
    - In Russia.
    - U...
    solution: The Ural Mountains form a boundary between Europe and Asia.
    mistakes: {"The Alps": "s8_urals"}
  - prompt: Which is the world's largest hot desert?
    options:
    - Sahara
    - Thar
    - Gobi
    - Atacama
    answer: Sahara
    difficulty: 1
    hints:
    - In North Africa.
    - S...
    solution: The Sahara in Africa is the largest hot desert.
    mistakes: {"Thar": "s8_sahara", "Gobi": "s8_sahara"}
  - prompt: Why is the Tibetan Plateau called the 'Third Pole'?
    options:
    - It holds huge amounts of ice in its glaciers
    - It is at the South Pole
    - It is very hot
    - It has three peaks
    answer: It holds huge amounts of ice in its glaciers
    difficulty: 2
    hints:
    - After the North and South Poles.
    - Glaciers feed big rivers.
    solution: Its glaciers store more ice than anywhere outside the polar regions.
    mistakes: {"It is at the South Pole": "s8_third_pole"}
  - prompt: Which continent holds about 70% of the world's fresh water?
    options:
    - Antarctica
    - Asia
    - South America
    - Africa
    answer: Antarctica
    difficulty: 2
    hints:
    - As ice.
    - The coldest continent.
    solution: Antarctica's ice sheet holds about 70% of Earth's fresh water.
    mistakes: {"Asia": "s8_antarctica"}
  - prompt: Which is the smallest continent?
    options:
    - Australia
    - Europe
    - Antarctica
    answer: Australia
    difficulty: 1
    hints:
    - It is also a single country.
    - Europe is a little bigger.
    solution: Australia is the smallest continent.
    mistakes:
      Europe: s8w_continent_size
      Antarctica: s8w_continent_size
  - prompt: On which continent is the Nile?
    options:
    - Africa
    - Asia
    - South America
    answer: Africa
    difficulty: 1
    hints:
    - It flows through Egypt.
    - The Amazon is in South America.
    solution: The Nile flows north through Africa into the Mediterranean.
    mistakes:
      Asia: s8w_rivers
      South America: s8w_rivers
  - prompt: Which river flows through the world's largest rainforest?
    options:
    - Amazon
    - Nile
    - Yangtze
    answer: Amazon
    difficulty: 2
    hints:
    - The rainforest is in South America.
    - It starts in the Andes.
    solution: The Amazon flows through the Amazon rainforest to the Atlantic.
    mistakes:
      Nile: s8w_rivers
      Yangtze: s8w_rivers
  - prompt: Which mountains are in Europe?
    options:
    - Alps
    - Andes
    - Himalayas
    answer: Alps
    difficulty: 1
    hints:
    - Switzerland is among them.
    - The Andes are in South America; the Himalayas in Asia.
    solution: The Alps run through France, Switzerland, Italy and Austria.
    mistakes:
      Andes: s8w_mountains
      Himalayas: s8_third_pole
  - prompt: Which of these rivers is fed by glaciers of the 'Third Pole'?
    options:
    - Brahmaputra
    - Nile
    - Amazon
    answer: Brahmaputra
    difficulty: 2
    hints:
    - The Third Pole is the Himalaya–Tibet region.
    - Which river flows through Assam?
    solution: The Brahmaputra rises in Tibet and is fed by Himalayan glaciers.
    mistakes:
      Nile: s8_third_pole
      Amazon: s8_third_pole
  - prompt: The Nile is about 6,650 km and the Ganga about 2,525 km. About how much longer is the Nile?
    answer: '4125'
    check: 6650-2525
    difficulty: 2
    hints:
    - Find the difference.
    - Take the Ganga's length from the Nile's.
    solution: 6650 − 2525 = 4125 km longer.
    mistakes:
      '9175': s8w_diff
  - prompt: Why is Antarctica called the driest continent though it is covered in ice?
    options:
    - Very little rain or snow falls there each year
    - It has no ice at all
    - It is the hottest place
    answer: Very little rain or snow falls there each year
    difficulty: 3
    hints:
    - Dry means little precipitation.
    - The ice has built up over a very long time.
    solution: Antarctica gets very little new snow each year; its ice built up over millions of years.
    mistakes:
      It has no ice at all: s8_antarctica
      It is the hottest place: s8_antarctica
  - prompt: The Atacama, one of the driest places on Earth, is on which continent?
    options:
    - South America
    - Africa
    - Australia
    answer: South America
    difficulty: 3
    hints:
    - It is in Chile.
    - It lies west of the Andes.
    solution: The Atacama Desert is in northern Chile, South America.
    mistakes:
      Africa: s8w_desert
      Australia: s8w_desert
  - prompt: Which continent has no permanent population of its own, only research stations?
    options:
    - Antarctica
    - Australia
    - Europe
    answer: Antarctica
    difficulty: 2
    hints:
    - It is the coldest continent.
    - India has stations there, Maitri and Bharati.
    solution: Only scientists live in Antarctica for some months at a time.
    mistakes:
      Australia: s8_antarctica
      Europe: s8_antarctica
