concepts:
- code: cbse8ss.world.oceans
  title: Oceans and maps of the world
  notes: |
    Oceans cover about 71% of the Earth (the 'blue planet') and hold about 97% of its water. The five oceans:
    Pacific (largest and deepest; the Mariana Trench's Challenger Deep is over 11,000 m), Atlantic, Indian,
    Southern and Arctic (smallest). Ocean currents move heat: the warm Gulf Stream keeps western Europe mild.
    Coral reefs, the 'rainforests of the sea', like the Great Barrier Reef, are threatened by warming and
    pollution. Because the Earth is round, flat maps distort it: the Mercator projection keeps directions
    for navigation but enlarges areas near the poles.
  explanations:
    text: Most of our planet is ocean, about 71%. The Pacific is the biggest and deepest; its deepest point, in the Mariana Trench, is deeper than Mount Everest is tall. Ocean currents carry warm and cold water around the world and change the climate of the lands they pass.
    visual: 'Draw a pie of the Earth''s surface: a large blue slice of 71% for oceans and a 29% slice for land. Next to it, list the five oceans from largest (Pacific) to smallest (Arctic).'
    step_by_step: 'Step 1: Remember that oceans cover about 71% of Earth. Step 2: Order the oceans: Pacific, Atlantic, Indian, Southern, Arctic. Step 3: Warm currents warm nearby coasts; cold currents cool them. Step 4: Flat maps always stretch something, so check the projection.'
    real_world: On many wall maps (Mercator), Greenland looks as big as Africa, but Africa is actually about 14 times larger.
  picture:
    kind: bars
    bars:
    - label: Pacific
      value: 165
    - label: Atlantic
      value: 106
    - label: Indian
      value: 70
    - label: Southern
      value: 21
    - label: Arctic
      value: 14
    unit: million km² (approx.)
    caption: The Pacific is bigger than all the land on Earth put together.
    alt: 'Bars of approximate ocean areas: Pacific 165, Atlantic 106, Indian 70, Southern 21 and Arctic 14 million square kilometres.'
  activity:
    type: sort
    prompt: Which ocean fact?
    bins:
    - Pacific
    - Atlantic
    - Arctic
    items:
    - label: Challenger Deep, over 11,000 m
      bin: Pacific
      clue: Deepest.
      why: Pacific.
    - label: Warm Gulf Stream keeps Europe mild
      bin: Atlantic
      clue: Between America and Europe.
      why: Atlantic.
    - label: Smallest ocean
      bin: Arctic
      clue: Top of the world.
      why: Arctic.
    - label: Largest ocean
      bin: Pacific
      clue: Biggest.
      why: Pacific.
  items:
  - prompt: About what percentage of the Earth's surface is covered by oceans? Type the number only.
    answer: '71'
    check: '71'
    difficulty: 1
    hints:
    - More than two-thirds.
    - Seventy-one.
    solution: Oceans cover about 71% of the Earth's surface.
    mistakes:
      '29': c8ss_land_vs_water
  - prompt: Which is the largest and deepest ocean?
    options:
    - Pacific Ocean
    - Atlantic Ocean
    - Indian Ocean
    - Arctic Ocean
    answer: Pacific Ocean
    difficulty: 1
    hints:
    - Mariana Trench is in it.
    - P...
    solution: The Pacific is both the largest and the deepest.
    mistakes: {"Atlantic Ocean": "s8_pacific"}
  - prompt: Which is the smallest ocean?
    options:
    - Arctic Ocean
    - Indian Ocean
    - Southern Ocean
    - Atlantic Ocean
    answer: Arctic Ocean
    difficulty: 1
    hints:
    - Around the North Pole.
    - Mostly frozen.
    solution: The Arctic is the smallest and shallowest ocean.
    mistakes: {"Indian Ocean": "s8_arctic", "Southern Ocean": "s8_arctic"}
  - prompt: Why does western Europe have milder winters than other places as far north?
    options:
    - The warm Gulf Stream current
    - It is near the equator
    - It has many mountains
    - It has no oceans nearby
    answer: The warm Gulf Stream current
    difficulty: 2
    hints:
    - An ocean current.
    - Warm water from the tropics.
    solution: The warm Gulf Stream (North Atlantic Drift) carries heat to western Europe.
    mistakes: {"It is near the equator": "s8_gulf_stream"}
  - prompt: Why are coral reefs called 'rainforests of the sea'?
    options:
    - They are home to a huge variety of sea life
    - They are made of trees
    - It rains a lot over them
    - They are green
    answer: They are home to a huge variety of sea life
    difficulty: 2
    hints:
    - Biodiversity.
    - About a quarter of ocean species.
    solution: Coral reefs support an enormous variety of marine species.
    mistakes: {"They are made of trees": "s8_coral"}
  - prompt: What is the problem with the Mercator map projection?
    options:
    - It makes lands near the poles look much bigger
    - It shows wrong directions
    - It leaves out oceans
    - It only shows India
    answer: It makes lands near the poles look much bigger
    difficulty: 3
    hints:
    - Greenland looks as big as Africa.
    - Area distortion.
    solution: Mercator keeps directions but greatly enlarges high-latitude areas.
    mistakes: {"It shows wrong directions": "s8_mercator"}
- code: cbse8ss.world.continents
  title: Continents and their landforms
  after:
  - cbse8ss.world.oceans
  notes: |
    There are seven continents: Asia (largest), Africa, North America, South America, Antarctica, Europe and
    Australia (smallest). Major landforms: the Himalayas and the Tibetan Plateau ('the Third Pole', source of
    the Indus, Brahmaputra and Yangtze); the Ural Mountains between Europe and Asia; the Alps; the Sahara
    (largest hot desert) and the Nile (about 6,650 km, often called the longest river); the Andes and the
    Amazon; the Atacama, one of the driest places; and Antarctica, the coldest, driest continent, holding about
    70% of the world's fresh water as ice. The Gobi is a cold desert.
  explanations:
    text: 'The land on Earth is divided into seven continents. Asia is the largest and Australia the smallest. Each has famous landforms: the Himalayas in Asia, the Sahara and the Nile in Africa, the Andes and the Amazon in South America, and the icy desert of Antarctica.'
    visual: 'Draw a rough world map with the seven continents and stick a symbol on each: mountains on Asia, a pyramid and river on Africa, a rainforest on South America, an ice sheet on Antarctica.'
    step_by_step: 'Step 1: List the seven continents by size: Asia, Africa, North America, South America, Antarctica, Europe, Australia. Step 2: Link each with one big landform. Step 3: Think how landforms shape climate and how people live.'
    real_world: The Tibetan Plateau is called the 'Third Pole' because its glaciers hold more ice than anywhere outside the Arctic and Antarctic, feeding rivers that over a billion people depend on.
  picture:
    kind: compare
    columns:
    - title: Continent
      points:
      - Asia
      - Africa
      - South America
      - Europe
      - Antarctica
    - title: A famous feature
      points:
      - Himalayas, Tibetan Plateau
      - Sahara Desert, River Nile
      - Andes, Amazon
      - Alps, European Plain
      - Ice sheet, 70% of fresh water
    alt: 'Continents matched with famous features: Asia and the Himalayas, Africa and the Sahara and Nile, South America and the Andes and Amazon, Europe and the Alps, Antarctica and its ice sheet.'
    caption: Each continent has landforms that shape life there.
  activity:
    type: sort
    prompt: Which continent?
    bins:
    - Asia
    - Africa
    - South America
    - Antarctica
    items:
    - label: Tibetan Plateau, 'the Third Pole'
      bin: Asia
      clue: Himalayas.
      why: Asia.
    - label: Sahara and the Nile
      bin: Africa
      clue: Largest hot desert.
      why: Africa.
    - label: Andes and Amazon
      bin: South America
      clue: Long mountain chain.
      why: South America.
    - label: Holds about 70% of fresh water as ice
      bin: Antarctica
      clue: Coldest.
      why: Antarctica.
    - label: Atacama, one of the driest places
      bin: South America
      clue: Near the Andes.
      why: South America.
    - label: Gobi, a cold desert
      bin: Asia
      clue: Mongolia.
      why: Asia.
  items:
  - prompt: How many continents are there?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Asia, Africa, the Americas ...
    - Seven.
    solution: There are seven continents.
    mistakes: {"5": "s8_continents", "6": "s8_continents"}
  - prompt: Which is the largest continent?
    options:
    - Asia
    - Africa
    - North America
    - Europe
    answer: Asia
    difficulty: 1
    hints:
    - India is in it.
    - A...
    solution: Asia is the largest continent.
    mistakes: {"Africa": "s8_asia"}
  - prompt: Which mountain range separates Europe from Asia?
    options:
    - The Urals
    - The Alps
    - The Andes
    - The Rockies
    answer: The Urals
    difficulty: 2
    hints:
    - In Russia.
    - U...
    solution: The Ural Mountains form a boundary between Europe and Asia.
    mistakes: {"The Alps": "s8_urals"}
  - prompt: Which is the world's largest hot desert?
    options:
    - Sahara
    - Thar
    - Gobi
    - Atacama
    answer: Sahara
    difficulty: 1
    hints:
    - In North Africa.
    - S...
    solution: The Sahara in Africa is the largest hot desert.
    mistakes: {"Thar": "s8_sahara", "Gobi": "s8_sahara"}
  - prompt: Why is the Tibetan Plateau called the 'Third Pole'?
    options:
    - It holds huge amounts of ice in its glaciers
    - It is at the South Pole
    - It is very hot
    - It has three peaks
    answer: It holds huge amounts of ice in its glaciers
    difficulty: 2
    hints:
    - After the North and South Poles.
    - Glaciers feed big rivers.
    solution: Its glaciers store more ice than anywhere outside the polar regions.
    mistakes: {"It is at the South Pole": "s8_third_pole"}
  - prompt: Which continent holds about 70% of the world's fresh water?
    options:
    - Antarctica
    - Asia
    - South America
    - Africa
    answer: Antarctica
    difficulty: 2
    hints:
    - As ice.
    - The coldest continent.
    solution: Antarctica's ice sheet holds about 70% of Earth's fresh water.
    mistakes: {"Asia": "s8_antarctica"}
