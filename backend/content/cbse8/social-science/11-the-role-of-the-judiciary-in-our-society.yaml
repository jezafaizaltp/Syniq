# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 11 (Part 2 chapter 4). Format: content/README.md.
subject: cbse8-ss
chapter: 11
title: The Role of the Judiciary in Our Society
tips:
  s8_appeal: "An appeal goes up to a higher court."
  s8_art32: "Article 51A lists our duties. Ambedkar called a different Article 'the heart and soul' of the Constitution: the one that lets you go to court for your rights."
  s8_civil: "Nobody committed a crime. It is a dispute about rights over land."
  s8_criminal: "Theft is a crime against the law."
  s8_independent: "Judges must not be afraid of the government."
  s8_judge_removal: "Judges must be protected from pressure. Can the PM remove them easily?"
  s8_judicial_review: "Judicial review checks laws against the Constitution."
  s8_lok_adalat: "'Lok' means people. It settles cases by agreement."
  s8_pil: "A PIL is about the public interest, not a private quarrel."
  s8_rule_of_law: "Under the rule of law nobody is above the law, not even the government."
  s8_sc_delhi: "The Supreme Court sits in the national capital."
  s8_supreme_court: "High Courts are for states. Which court is above them?"
  s8j_hc: "One Article lets you go straight to the Supreme Court; another, with a bigger number, is for the High Courts."
  s8j_fir: "It is the very first written record the police make when someone reports a crime. What could each letter stand for?"
  s8j_settled: "Settled cases are no longer pending, so take them away; don't add them."
  s8j_interpret: "Laws can be read in more than one way. What does the court do about the meaning?"
  s8j_gap: "Difference means take the smaller number away from the larger one."
  s8j_ladder: 'Courts are like a ladder: district courts at the bottom, then the state''s court, then the one court for the whole country.'
  s8j_kind: Is someone accused of breaking the law and punished, or are two sides arguing over money or property?
  s8j_who_files: In a crime, the state brings the case against the accused. In a dispute, the person wronged files it.
  s8j_independence: Which choice keeps judges free from pressure by the government?
  s8j_equal: Does the law treat the powerful differently from ordinary people?

concepts:
- code: cbse8ss.judiciary.courts
  title: The courts of India
  notes: |
    India has an integrated judiciary: the Supreme Court in New Delhi at the top, a High Court for each state
    or group of states, and district and subordinate courts below. Cases can go up by appeal. The Supreme
    Court is the final court of appeal and guardian of the Constitution. Civil cases deal with disputes over
    property, money or contracts; criminal cases deal with crimes like theft or assault, where the state
    prosecutes. Lok Adalats settle cases quickly and cheaply by agreement.
  explanations:
    text: India's courts form a ladder. Most cases start in district courts. If someone is unhappy with the decision, they can appeal to the High Court, and finally to the Supreme Court in New Delhi, whose decision is final.
    visual: 'Draw a pyramid: the Supreme Court at the top, High Courts in the middle, district courts at the wide base, with arrows going up labelled ''appeal''.'
    step_by_step: 'Step 1: A case starts in a district court. Step 2: An appeal can go to the state''s High Court. Step 3: A further appeal can go to the Supreme Court. Step 4: The Supreme Court''s decision is final for everyone.'
    real_world: Lok Adalats (people's courts) have settled crores of cases, such as small accident claims and bank loan disputes, in a single day by bringing both sides to agree.
  picture:
    kind: flow
    steps:
    - District court hears the case
    - Appeal to the High Court
    - Appeal to the Supreme Court
    - The Supreme Court's decision is final
    alt: 'The ladder of appeal in India''s courts: district court, then High Court, then the Supreme Court, whose decision is final.'
  activity:
    type: sort
    prompt: Civil or criminal case?
    bins:
    - Civil
    - Criminal
    items:
    - label: A dispute over who owns a field
      bin: Civil
      clue: Property.
      why: Civil.
    - label: A theft
      bin: Criminal
      clue: The state prosecutes.
      why: Criminal.
    - label: Unpaid rent
      bin: Civil
      clue: Money.
      why: Civil.
    - label: An assault
      bin: Criminal
      clue: A crime.
      why: Criminal.
    - label: A broken contract
      bin: Civil
      clue: Agreement.
      why: Civil.
  lesson:
    - teach: India has one integrated system of courts. District and subordinate courts are at the bottom, a High Court serves each state or group of states, and the Supreme Court in New Delhi is at the top.
      picture:
        kind: flow
        steps:
        - District court
        - High Court (state)
        - Supreme Court (New Delhi)
        alt: Cases go up from the district court to the High Court and finally to the Supreme Court.
      check:
        prompt: Which court is just above a district court?
        options:
        - The High Court
        - The Supreme Court
        - The Lok Adalat
        answer: The High Court
        why: District court, then High Court, then Supreme Court.
    - teach: 'If a person is unhappy with a decision, they can appeal: ask a higher court to look at the case again. The Supreme Court is the final court of appeal and the guardian of the Constitution.'
      check:
        prompt: Ramesh loses a case in the district court. What can he do?
        options:
        - Appeal to the High Court
        - Go to the Election Commission
        - Nothing at all
        answer: Appeal to the High Court
        why: He can ask a higher court to review the decision.
    - teach: Civil cases are disputes over property, money, rent or contracts; the person wronged files the case. Criminal cases are about crimes like theft, assault or murder; the police investigate and the state prosecutes. Lok Adalats settle cases quickly and cheaply by agreement.
      picture:
        kind: compare
        columns:
        - title: Civil
          points:
          - Land, money, rent, contracts
          - Wronged person files
          - Ends in payment or order
        - title: Criminal
          points:
          - Theft, assault, murder
          - Police file FIR; state prosecutes
          - Can end in jail or fine
        alt: Civil cases are disputes over property and money filed by the person wronged; criminal cases are crimes prosecuted by the state.
      check:
        prompt: A tenant refuses to pay rent. What kind of case is this?
        options:
        - Civil
        - Criminal
        - Constitutional
        answer: Civil
        why: It is a dispute over money between two people.
  items:
  - prompt: Which is the highest court in India?
    options:
    - The Supreme Court
    - The High Court
    - The district court
    - Lok Adalat
    answer: The Supreme Court
    difficulty: 1
    hints:
    - In New Delhi.
    - Final appeal.
    solution: The Supreme Court is the highest court.
    mistakes: {"The High Court": "s8_supreme_court"}
  - prompt: Where is the Supreme Court located?
    options:
    - New Delhi
    - Mumbai
    - Kolkata
    - Chennai
    answer: New Delhi
    difficulty: 1
    hints:
    - The capital.
    - Tilak Marg.
    solution: The Supreme Court sits in New Delhi.
    mistakes: {"Mumbai": "s8_sc_delhi"}
  - prompt: A dispute between neighbours over land is which kind of case?
    options:
    - Civil
    - Criminal
    - Military
    - Religious
    answer: Civil
    difficulty: 2
    hints:
    - No crime has been committed.
    - Property dispute.
    solution: Disputes over property or money are civil cases.
    mistakes: {"Criminal": "s8_civil"}
  - prompt: A case about a theft is which kind of case?
    options:
    - Criminal
    - Civil
    - Family
    - Constitutional only
    answer: Criminal
    difficulty: 1
    hints:
    - A crime has been committed.
    - Police and prosecution.
    solution: Theft is a crime, so it is a criminal case.
    mistakes: {"Civil": "s8_criminal"}
  - prompt: What is meant by an appeal?
    options:
    - Asking a higher court to review a lower court's decision
    - Starting a new law
    - Electing a judge
    - Paying a fine
    answer: Asking a higher court to review a lower court's decision
    difficulty: 2
    hints:
    - Going up the ladder.
    - Unhappy with the verdict.
    solution: An appeal asks a higher court to look at the case again.
    mistakes: {"Starting a new law": "s8_appeal"}
  - prompt: What is a Lok Adalat?
    options:
    - A people's court that settles cases quickly by agreement
    - A village council
    - A police station
    - A part of Parliament
    answer: A people's court that settles cases quickly by agreement
    difficulty: 2
    hints:
    - Fast and cheap.
    - Compromise.
    solution: Lok Adalats help parties settle disputes quickly and cheaply.
    mistakes: {"A village council": "s8_lok_adalat"}
  - prompt: Where is the High Court for Kerala?
    options:
    - Ernakulam (Kochi)
    - New Delhi
    - Chennai
    answer: Ernakulam (Kochi)
    difficulty: 2
    hints:
    - Each state has its own High Court.
    - It is in Kerala's main port city.
    solution: The Kerala High Court sits in Ernakulam, Kochi; it also serves Lakshadweep.
    mistakes:
      New Delhi: s8j_ladder
      Chennai: s8j_ladder
  - prompt: A man is caught stealing a phone. Who brings the case against him?
    options:
    - The state, through the police and prosecutor
    - Only his neighbour
    - The Election Commission
    answer: The state, through the police and prosecutor
    difficulty: 2
    hints:
    - Theft is a crime.
    - In crimes, the case is the state against the accused.
    solution: In criminal cases the police investigate and the state prosecutes.
    mistakes:
      Only his neighbour: s8j_who_files
      The Election Commission: s8j_who_files
  - prompt: Two brothers argue over who owns the family field. What kind of case is it?
    options:
    - Civil
    - Criminal
    - Military
    answer: Civil
    difficulty: 1
    hints:
    - Is anyone accused of a crime?
    - It is about property.
    solution: Disputes over property are civil cases.
    mistakes:
      Criminal: s8j_kind
      Military: s8j_kind
  - prompt: Which court can hear an appeal against a High Court's judgment?
    options:
    - The Supreme Court
    - A district court
    - A Lok Adalat
    answer: The Supreme Court
    difficulty: 1
    hints:
    - Appeals go up, not down.
    - Which court is above the High Court?
    solution: The Supreme Court is the only court above High Courts.
    mistakes:
      A district court: s8j_ladder
      A Lok Adalat: s8j_ladder
  - prompt: What does FIR stand for?
    options:
    - First Information Report
    - Final Investigation Result
    - Federal Income Record
    answer: First Information Report
    difficulty: 2
    hints:
    - It is the first step in a criminal case.
    - The police write it down when a crime is reported.
    solution: An FIR (First Information Report) is the police record that starts a criminal case.
    mistakes:
      Final Investigation Result: s8j_fir
      Federal Income Record: s8j_fir
  - prompt: Why are Lok Adalats useful?
    options:
    - They settle cases quickly and cheaply by agreement
    - They give the harshest punishments
    - They make new laws
    answer: They settle cases quickly and cheaply by agreement
    difficulty: 2
    hints:
    - '''Lok'' means people.'
    - Courts can take years; these are faster.
    solution: Lok Adalats bring both sides to agree, saving time and money.
    mistakes:
      They give the harshest punishments: s8_lok_adalat
      They make new laws: s8_lok_adalat
  - prompt: A district court has 1200 pending cases. A Lok Adalat settles 300 in one day. How many are left?
    answer: '900'
    check: 1200-300
    difficulty: 1
    hints:
    - Some cases are now settled.
    - Take the settled cases from the total.
    solution: 1200 − 300 = 900 cases still pending.
    mistakes:
      '1500': s8j_settled
  - prompt: Why is the Supreme Court called the 'guardian of the Constitution'?
    options:
    - It decides finally what the Constitution means and protects it
    - It writes new constitutions every year
    - It runs the army
    answer: It decides finally what the Constitution means and protects it
    difficulty: 3
    hints:
    - A guardian protects.
    - Its word on the Constitution is final.
    solution: The Supreme Court interprets the Constitution and strikes down actions that break it.
    mistakes:
      It writes new constitutions every year: s8_supreme_court
      It runs the army: s8_supreme_court
  - prompt: Someone attacks and injures a person on the road. What kind of case is this?
    options:
    - Criminal
    - Civil
    - Lok Adalat only
    answer: Criminal
    difficulty: 1
    hints:
    - Is this a crime?
    - Assault can be punished with jail.
    solution: Assault is a crime, so it is a criminal case.
    mistakes:
      Civil: s8j_kind
      Lok Adalat only: s8j_kind
- code: cbse8ss.judiciary.role
  title: An independent judiciary and our rights
  after:
  - cbse8ss.judiciary.courts
  notes: |
    The judiciary must be independent: judges are protected from pressure by the government, cannot easily be
    removed (only by Parliament through a difficult process), and their salaries are secure. Its roles:
    settling disputes, interpreting laws and the Constitution, judicial review (striking down laws that break
    the Constitution), and protecting Fundamental Rights; anyone whose rights are violated can go directly to
    the Supreme Court (Article 32) or a High Court (Article 226). Public Interest Litigation (PIL) lets any
    person approach the court on behalf of those who cannot. The rule of law means everyone, including the
    government, is equal before the law.
  explanations:
    text: 'Courts must be free from pressure so they can judge fairly, even against the government. They protect our rights: if a law breaks the Constitution, courts can cancel it, and anyone can go to court on behalf of people who can''t go themselves.'
    visual: Draw a scale of justice balanced between a citizen and the government, with the Constitution as its base, and a shield marked 'Fundamental Rights' held by the court.
    step_by_step: 'Step 1: Judges are protected so they can decide freely. Step 2: Courts settle disputes and interpret laws. Step 3: Judicial review: laws against the Constitution are struck down. Step 4: Citizens can go to court directly to protect their rights, or file a PIL for others.'
    real_world: In 1979, after newspaper reports about prisoners held for years without trial in Bihar, a PIL led the Supreme Court to order the release of thousands of undertrial prisoners.
  picture:
    kind: compare
    columns:
    - title: Why independent?
      points:
      - No pressure from government
      - Judges hard to remove
      - Fair to everyone
    - title: What it does
      points:
      - Settles disputes
      - Judicial review of laws
      - Protects Fundamental Rights
      - Hears PILs
    alt: 'Why the judiciary must be independent and what it does: settling disputes, reviewing laws, protecting rights and hearing public interest cases.'
    caption: Fair courts protect every citizen.
  activity:
    type: sort
    prompt: Which article or tool?
    bins:
    - Article 32
    - Article 226
    - PIL
    - Judicial review
    items:
    - label: Go straight to the Supreme Court for your rights
      bin: Article 32
      clue: Supreme Court.
      why: Article 32.
    - label: Go to a High Court for your rights
      bin: Article 226
      clue: High Court.
      why: Article 226.
    - label: Anyone files on behalf of those who can't
      bin: PIL
      clue: Public interest.
      why: PIL.
    - label: Striking down a law that breaks the Constitution
      bin: Judicial review
      clue: Checks laws.
      why: Judicial review.
  lesson:
    - teach: The judiciary must be independent. Judges cannot be removed easily (only by Parliament through a hard process), their salaries are secure, and the government cannot tell them how to decide. This lets them judge fairly, even in cases against the government.
      check:
        prompt: Why are judges' salaries protected?
        options:
        - So no one can pressure them by cutting their pay
        - So they can buy more land
        - So they can vote twice
        answer: So no one can pressure them by cutting their pay
        why: Secure pay is one safeguard of independence.
    - teach: Courts settle disputes, interpret laws and protect Fundamental Rights. Through judicial review they can strike down laws that go against the Constitution. If your rights are violated, you can go straight to the Supreme Court (Article 32) or a High Court (Article 226).
      picture:
        kind: flow
        steps:
        - Law passed
        - Someone challenges it
        - Court checks it against the Constitution
        - Kept or struck down
        alt: 'Judicial review: a law is challenged, the court checks it against the Constitution, and keeps it or strikes it down.'
      check:
        prompt: A new law takes away free speech without good reason. What can a court do?
        options:
        - Strike it down by judicial review
        - Nothing; laws can't be checked
        - Arrest Parliament
        answer: Strike it down by judicial review
        why: Laws that break the Constitution can be struck down.
    - teach: Public Interest Litigation (PIL) lets anyone go to court for people who cannot, such as bonded labourers or people harmed by pollution; even a letter has been treated as a petition. The rule of law means everyone, including ministers, is equal before the law.
      check:
        prompt: 'A student writes to the court about children working in a dangerous factory. This can become:'
        options:
        - A PIL
        - An election
        - A budget
        answer: A PIL
        why: Anyone can approach the court in the public interest.
  items:
  - prompt: Why must the judiciary be independent?
    options:
    - So judges can decide fairly without pressure from the government
    - So judges can make laws
    - So courts can collect taxes
    - So judges can run elections
    answer: So judges can decide fairly without pressure from the government
    difficulty: 1
    hints:
    - Courts may have to rule against the government.
    - Fairness.
    solution: Independence lets judges rule fairly, even against those in power.
    mistakes: {"So judges can make laws": "s8_independent"}
  - prompt: What is judicial review?
    options:
    - Courts striking down laws that go against the Constitution
    - Judges reviewing books
    - Parliament reviewing judges
    - Police reviewing cases
    answer: Courts striking down laws that go against the Constitution
    difficulty: 2
    hints:
    - Checking laws.
    - The Constitution is supreme.
    solution: Judicial review lets courts declare unconstitutional laws invalid.
    mistakes: {"Parliament reviewing judges": "s8_judicial_review"}
  - prompt: What is a Public Interest Litigation (PIL)?
    options:
    - A case filed in the public interest, even on behalf of others
    - A private quarrel
    - A tax
    - An election petition
    answer: A case filed in the public interest, even on behalf of others
    difficulty: 2
    hints:
    - For people who can't approach the court.
    - Public good.
    solution: A PIL lets anyone approach the court for a public cause or for those unable to.
    mistakes: {"A private quarrel": "s8_pil"}
  - prompt: What does 'rule of law' mean?
    options:
    - Everyone, including the government, is equal before the law
    - The richest person makes the rules
    - Only judges follow the law
    - Laws apply only to the poor
    answer: Everyone, including the government, is equal before the law
    difficulty: 1
    hints:
    - No one is above the law.
    - Equality.
    solution: Under the rule of law, all are equal before the law.
    mistakes: {"Only judges follow the law": "s8_rule_of_law"}
  - prompt: Under which Article can a person go directly to the Supreme Court if their Fundamental Rights are violated?
    options:
    - Article 32
    - Article 51A
    - Article 370
    - Article 1
    answer: Article 32
    difficulty: 3
    hints:
    - Ambedkar called it the heart and soul of the Constitution.
    - Thirty-two.
    solution: Article 32 gives the right to constitutional remedies in the Supreme Court.
    mistakes: {"Article 51A": "s8_art32"}
  - prompt: How can a Supreme Court judge be removed?
    options:
    - Only by Parliament through a special, difficult process
    - By the Prime Minister at any time
    - By a vote of citizens
    - By the police
    answer: Only by Parliament through a special, difficult process
    difficulty: 2
    hints:
    - Protection from pressure.
    - Impeachment-like process.
    solution: Judges can only be removed by a special majority in both Houses of Parliament.
    mistakes: {"By the Prime Minister at any time": "s8_judge_removal"}
  - prompt: Under which Article can a person go to a High Court if their rights are violated?
    options:
    - Article 226
    - Article 32
    - Article 51A
    answer: Article 226
    difficulty: 3
    hints:
    - Article 32 is for the Supreme Court.
    - Article 51A lists duties.
    solution: Article 226 lets High Courts protect rights; Article 32 is for the Supreme Court.
    mistakes:
      Article 32: s8j_hc
      Article 51A: s8j_hc
  - prompt: A minister is accused of a crime. What does the rule of law say?
    options:
    - The minister faces the law like anyone else
    - Ministers cannot be tried
    - Only the PM can judge him
    answer: The minister faces the law like anyone else
    difficulty: 2
    hints:
    - Everyone is equal before the law.
    - Power gives no special treatment.
    solution: The rule of law means no one, however powerful, is above the law.
    mistakes:
      Ministers cannot be tried: s8j_equal
      Only the PM can judge him: s8j_equal
  - prompt: Which safeguards the independence of judges?
    options:
    - They can be removed only by Parliament through a hard process
    - The PM can sack them any time
    - They must join a party
    answer: They can be removed only by Parliament through a hard process
    difficulty: 2
    hints:
    - Would a judge be fair if the government could sack them?
    - Removal is made very difficult.
    solution: Hard removal protects judges from being punished for fair decisions.
    mistakes:
      The PM can sack them any time: s8j_independence
      They must join a party: s8j_independence
  - prompt: Why was PIL important for poor people?
    options:
    - Others could go to court on their behalf
    - It made courts charge more
    - It stopped all appeals
    answer: Others could go to court on their behalf
    difficulty: 2
    hints:
    - Many poor people cannot afford lawyers.
    - Who can file a PIL?
    solution: PIL lets anyone raise their cause, so lack of money or knowledge is no barrier.
    mistakes:
      It made courts charge more: s8_pil
      It stopped all appeals: s8_pil
  - prompt: What does it mean when a court 'interprets' a law?
    options:
    - It explains what the law means in a real case
    - It translates it into English
    - It writes a new law
    answer: It explains what the law means in a real case
    difficulty: 2
    hints:
    - Laws can be read in more than one way.
    - Who settles the meaning?
    solution: Courts decide what the words of a law mean when applied to a real situation.
    mistakes:
      It translates it into English: s8j_interpret
      It writes a new law: s8j_interpret
  - prompt: Which branch makes laws, and which checks them against the Constitution?
    options:
    - Parliament makes; courts check
    - Courts make; Parliament checks
    - Police make; voters check
    answer: Parliament makes; courts check
    difficulty: 2
    hints:
    - The legislature makes laws.
    - Judicial review is done by judges.
    solution: Parliament makes laws; the judiciary reviews whether they fit the Constitution.
    mistakes:
      Courts make; Parliament checks: s8_judicial_review
      Police make; voters check: s8_judicial_review
  - prompt: Why must courts be able to rule against the government?
    options:
    - So citizens' rights are protected even from those in power
    - So the government always wins
    - So judges can become ministers
    answer: So citizens' rights are protected even from those in power
    difficulty: 3
    hints:
    - 'Think of who is strongest in a case: a citizen or the state?'
    - Independence matters most here.
    solution: An independent court can stop the government if it violates rights.
    mistakes:
      So the government always wins: s8j_independence
      So judges can become ministers: s8j_independence
  - prompt: Articles 32 and 226 both protect rights. What is the difference between their numbers?
    answer: '194'
    check: 226-32
    difficulty: 1
    hints:
    - Find the gap between the two numbers.
    - Take the smaller from the larger.
    solution: 226 − 32 = 194. (32 is the Supreme Court; 226 the High Courts.)
    mistakes:
      '258': s8j_gap
  - prompt: Which of these would a court protect under Fundamental Rights?
    options:
    - A child forced to work in a fireworks factory
    - A shop wanting higher profits
    - A team wanting to win a match
    answer: A child forced to work in a fireworks factory
    difficulty: 2
    hints:
    - Rights protect people from injustice.
    - Hazardous child labour is banned.
    solution: Child labour in dangerous work violates the Right against Exploitation; courts can stop it.
    mistakes:
      A shop wanting higher profits: s8_pil
      A team wanting to win a match: s8_pil
