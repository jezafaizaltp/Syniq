# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 5. Format: content/README.md.
subject: cbse8-ss
chapter: 5
title: Universal Franchise and India's Electoral System
tips:
  c8ss_voting_age: The voting age was 21 until 1988; since the 61st Amendment it has been 18.
concepts:
- code: cbse8ss.vote.franchise
  title: Universal adult franchise
  notes: |
    Universal adult franchise means every adult citizen can vote, whatever their religion, caste, gender,
    wealth or education: one person, one vote, one value. India adopted it from the start (Constitution,
    1950), when many older democracies had only recently given women the vote. The voting age was lowered
    from 21 to 18 by the 61st Amendment (1988). India's first general election was held in 1951–52; it is now
    the world's largest democratic exercise.
  explanations:
    text: In India every citizen aged 18 or over has one vote, and every vote counts the same, whether the voter is rich or poor, a man or a woman, educated or not. This is universal adult franchise, and India gave it to everyone from the very beginning.
    visual: 'Draw a long queue outside a polling booth: a farmer, a teacher, a woman with a baby, an elderly man with a stick, a young student, each holding one ballot that weighs the same.'
    step_by_step: 'Step 1: Universal: every citizen. Step 2: Adult: aged 18 or more. Step 3: Franchise: the right to vote. Step 4: One person, one vote, one value.'
    real_world: In the 2024 Lok Sabha election, about 97 crore people were registered to vote, making it the biggest election the world has ever seen.
  picture:
    kind: flow
    steps:
    - '1950: Constitution gives the vote to all adults'
    - '1951–52: first general election'
    - '1988: voting age lowered from 21 to 18'
    - 'Today: the world''s largest elections'
    alt: Milestones of India's universal adult franchise from the 1950 Constitution to today's elections.
  activity:
    type: number_line
    min: 15
    max: 25
    step: 1
    start: 15
    prompt: Voting in India. Mark the age or year.
    goals:
    - prompt: Voting age today
      target: 18
      mistakes:
      - when:
          v: 21
        say: 21 was the voting age until the 61st Amendment (1988). It was lowered then.
    - prompt: Voting age before 1988
      target: 21
      mistakes:
      - when:
          v: 18
        say: That's today's age. Before 1988 it was higher.
  items:
  - prompt: What is the minimum voting age in India, in years?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - It was lowered from 21.
    - The 61st Amendment.
    solution: Citizens aged 18 or over can vote.
    mistakes:
      '21': c8ss_voting_age
  - prompt: What does universal adult franchise mean?
    options:
    - Every adult citizen has the right to vote
    - Only educated people can vote
    - Only men can vote
    - Only taxpayers can vote
    answer: Every adult citizen has the right to vote
    difficulty: 1
    hints:
    - Universal means all.
    - Franchise means the right to vote.
    solution: All adult citizens can vote regardless of caste, religion, gender or wealth.
  - prompt: When was India's first general election held?
    options:
    - 1951–52
    - '1947'
    - '1950'
    - '1962'
    answer: 1951–52
    difficulty: 2
    hints:
    - After the Constitution came into force.
    - It took months.
    solution: The first general election was held in 1951–52.
  - prompt: Which amendment lowered the voting age from 21 to 18?
    options:
    - The 61st Amendment
    - The 42nd Amendment
    - The 1st Amendment
    - The 73rd Amendment
    answer: The 61st Amendment
    difficulty: 3
    hints:
    - Passed in 1988.
    - Sixty-first.
    solution: The 61st Amendment (1988) lowered the voting age to 18.
  - prompt: What does 'one person, one vote, one value' mean?
    options:
    - Every vote counts equally
    - Rich people get extra votes
    - Each family gets one vote
    - Votes are bought
    answer: Every vote counts equally
    difficulty: 1
    hints:
    - Equality.
    - No vote is worth more.
    solution: Each citizen's vote has exactly the same weight.
  - prompt: Why was India's adoption of universal franchise in 1950 remarkable?
    options:
    - Many poorer and less literate citizens got the vote at once, including all women
    - Only a few people could vote
    - It copied a rule that every country already had
    - It ended elections
    answer: Many poorer and less literate citizens got the vote at once, including all women
    difficulty: 2
    hints:
    - Some older democracies gave women the vote late.
    - India gave it to all at once.
    solution: India gave every adult the vote from the start, at a time when many people predicted it would fail.
- code: cbse8ss.vote.ec
  title: How elections are run
  after:
  - cbse8ss.vote.franchise
  notes: |
    The Election Commission of India (set up in 1950) conducts free and fair elections to Parliament, state
    assemblies and the offices of President and Vice-President. It prepares voter lists, announces schedules,
    enforces the Model Code of Conduct on parties and candidates, and counts votes. Voters show an ID and get
    indelible ink on a finger; votes are cast on EVMs (electronic voting machines) with a VVPAT paper slip to
    verify; NOTA ('None of the Above') lets voters reject all candidates. In the first-past-the-post system,
    the candidate with the most votes in a constituency wins.
  explanations:
    text: Elections in India are run by an independent body, the Election Commission. It makes the voter lists, sets the dates, makes parties follow rules, and counts the votes. You vote on an electronic machine and a paper slip shows whom you voted for.
    visual: 'Draw the voting steps: show ID, finger inked, press a button on the EVM next to a symbol, check the VVPAT slip in the window, then the counting day with the winner announced.'
    step_by_step: 'Step 1: The Election Commission announces the election. Step 2: Candidates file nominations and campaign under the Model Code of Conduct. Step 3: Voters cast votes on EVMs. Step 4: Votes are counted; the candidate with the most votes wins the constituency.'
    real_world: 'Polling stations are set up even for a single voter: in Gir forest in Gujarat a booth was set up for one priest, so that no voter has to travel more than about 2 km.'
  picture:
    kind: flow
    steps:
    - Election Commission announces dates
    - Model Code of Conduct begins
    - Campaigning
    - Voting on EVMs with VVPAT
    - 'Counting: most votes wins'
    alt: 'How an Indian election runs: the Election Commission announces it, parties campaign under rules, people vote on EVMs and the candidate with most votes wins.'
  activity:
    type: sort
    prompt: What is it for?
    bins:
    - EVM
    - VVPAT
    - NOTA
    - Indelible ink
    items:
    - label: Recording votes electronically
      bin: EVM
      clue: A machine.
      why: EVM.
    - label: A paper slip to check your vote
      bin: VVPAT
      clue: Verify.
      why: VVPAT.
    - label: Rejecting all candidates
      bin: NOTA
      clue: None of the above.
      why: NOTA.
    - label: Stops anyone voting twice
      bin: Indelible ink
      clue: On the finger.
      why: Ink.
  items:
  - prompt: Which body conducts elections in India?
    options:
    - The Election Commission of India
    - The Supreme Court
    - Parliament
    - The Prime Minister's Office
    answer: The Election Commission of India
    difficulty: 1
    hints:
    - Set up in 1950.
    - Independent body.
    solution: The Election Commission conducts elections independently.
  - prompt: What does EVM stand for?
    options:
    - Electronic Voting Machine
    - Election Vote Monitor
    - Electronic Voter Mark
    - Elected Village Member
    answer: Electronic Voting Machine
    difficulty: 1
    hints:
    - Used to cast votes.
    - Electronic.
    solution: EVM means Electronic Voting Machine.
  - prompt: What is NOTA?
    options:
    - An option to reject all candidates
    - A political party
    - A voter ID card
    - A type of election
    answer: An option to reject all candidates
    difficulty: 2
    hints:
    - None Of The Above.
    - On the EVM.
    solution: NOTA lets a voter reject every candidate.
  - prompt: What is the Model Code of Conduct?
    options:
    - Rules parties and candidates must follow during elections
    - A dress code for voters
    - A law for schools
    - The rules of Parliament
    answer: Rules parties and candidates must follow during elections
    difficulty: 2
    hints:
    - Set by the Election Commission.
    - No bribes, no hate speech.
    solution: It sets rules of behaviour for parties and candidates from announcement to results.
  - prompt: Why is indelible ink put on a voter's finger?
    options:
    - So the same person can't vote twice
    - For decoration
    - To count voters
    - To show the party they chose
    answer: So the same person can't vote twice
    difficulty: 1
    hints:
    - It doesn't wash off quickly.
    - Prevents fraud.
    solution: The ink shows a person has already voted.
  - prompt: In India's first-past-the-post system, who wins a constituency?
    options:
    - The candidate with the most votes
    - The candidate with more than half the votes only
    - The oldest candidate
    - The candidate chosen by the party leader
    answer: The candidate with the most votes
    difficulty: 2
    hints:
    - Even without a majority.
    - Most votes.
    solution: The candidate with the highest number of votes wins, even with less than 50%.
