# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 5. Format: content/README.md.
subject: cbse8-ss
chapter: 5
title: Universal Franchise and India's Electoral System
tips:
  c8ss_voting_age: "21 was the old voting age, changed by the 61st Amendment in 1988. It was lowered to the age you become an adult."
  s8_61st: "The voting age changed in the late 1980s. The 42nd was earlier, in 1976."
  s8_ec: "Elections need an independent referee, not the government."
  s8_evm: "EVM is a machine. Expand the letters."
  s8_first_election: "The Constitution came into force in 1950. The first election came after that, over the winter."
  s8_fptp: "'First past the post': the winner just needs more votes than anyone else."
  s8_ink: "The ink doesn't show your vote. What does it stop?"
  s8_mcc: "A code of conduct is a set of rules for behaviour. For whom, and when?"
  s8_nota: "NOTA stands for 'None of the Above'."
  s8_one_vote: "'One value' means every vote weighs the same."
  s8_remarkable: "Many older democracies gave the vote slowly. What did India do in one step?"
  s8_universal: "'Universal' means everyone. Every adult, with no extra conditions."
  s8v_reject: "There is a button that records a vote for none of the candidates. What is its short name?"
  s8v_who_votes: 'Universal adult franchise looks only at two things: is the person a citizen, and an adult?'
  s8v_equal: Does a rich person's vote count for more than a poor person's?
  s8v_vvpat: Which machine prints a small paper slip so you can see your vote went to the right candidate?
  s8v_gap: "Lowered means the age went down. Find the gap between the old age and the new one; do not add them."
  s8v_constituency: Count votes only inside that one area; the highest number wins, even without half.
  s8v_secret: Should anyone, even your family, know whom you voted for?
concepts:
- code: cbse8ss.vote.franchise
  title: Universal adult franchise
  notes: |
    Universal adult franchise means every adult citizen can vote, whatever their religion, caste, gender,
    wealth or education: one person, one vote, one value. India adopted it from the start (Constitution,
    1950), when many older democracies had only recently given women the vote. The voting age was lowered
    from 21 to 18 by the 61st Amendment (1988). India's first general election was held in 1951–52; it is now
    the world's largest democratic exercise.
  explanations:
    text: In India every citizen aged 18 or over has one vote, and every vote counts the same, whether the voter is rich or poor, a man or a woman, educated or not. This is universal adult franchise, and India gave it to everyone from the very beginning.
    visual: 'Draw a long queue outside a polling booth: a farmer, a teacher, a woman with a baby, an elderly man with a stick, a young student, each holding one ballot that weighs the same.'
    step_by_step: 'Step 1: Universal: every citizen. Step 2: Adult: aged 18 or more. Step 3: Franchise: the right to vote. Step 4: One person, one vote, one value.'
    real_world: In the 2024 Lok Sabha election, about 97 crore people were registered to vote, making it the biggest election the world has ever seen.
  picture:
    kind: flow
    steps:
    - '1950: Constitution gives the vote to all adults'
    - '1951–52: first general election'
    - '1988: voting age lowered from 21 to 18'
    - 'Today: the world''s largest elections'
    alt: Milestones of India's universal adult franchise from the 1950 Constitution to today's elections.
  activity:
    type: number_line
    min: 15
    max: 25
    step: 1
    start: 15
    prompt: Voting in India. Mark the age or year.
    goals:
    - prompt: Voting age today
      target: 18
      mistakes:
      - when:
          v: 21
        say: 21 was the voting age until the 61st Amendment (1988). It was lowered then.
    - prompt: Voting age before 1988
      target: 21
      mistakes:
      - when:
          v: 18
        say: That's today's age. Before 1988 it was higher.
  lesson:
    - teach: 'Universal adult franchise means every adult citizen can vote, whatever their religion, caste, gender, wealth or education. Each vote has the same value: one person, one vote, one value.'
      check:
        prompt: Who can vote in India under universal adult franchise?
        options:
        - Every adult citizen
        - Only people who own land
        - Only people who went to school
        answer: Every adult citizen
        why: No condition of property, education, caste or gender is placed on the vote.
    - teach: India gave this right to everyone from the start of the Constitution in 1950. Many older democracies had given women the vote only shortly before, and some had long limited it by property or race. India's first general election was held in 1951–52.
      picture:
        kind: flow
        steps:
        - '1950 Constitution: all adults vote'
        - 1951–52 first general election
        - '1988 61st Amendment: age 21 → 18'
        alt: 1950 constitution gives all adults the vote; 1951–52 first election; 1988 voting age lowered from 21 to 18.
      check:
        prompt: What was unusual about India's choice in 1950?
        options:
        - All adults, including all women, got the vote at once
        - Only men could vote
        - Only rich people could vote
        answer: All adults, including all women, got the vote at once
        why: Many countries gave the vote step by step; India gave it to all adults together.
    - teach: In 1988 the 61st Amendment lowered the voting age from 21 to 18. Today India's general election is the largest democratic exercise in the world, with nearly a billion voters.
      check:
        prompt: Before 1988, what was the voting age?
        options:
        - '21'
        - '18'
        - '25'
        answer: '21'
        why: The 61st Amendment brought it down from 21 to 18.
  items:
  - prompt: What is the minimum voting age in India, in years?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - It was lowered from 21.
    - The 61st Amendment.
    solution: Citizens aged 18 or over can vote.
    mistakes:
      '21': c8ss_voting_age
  - prompt: What does universal adult franchise mean?
    options:
    - Every adult citizen has the right to vote
    - Only educated people can vote
    - Only men can vote
    - Only taxpayers can vote
    answer: Every adult citizen has the right to vote
    difficulty: 1
    hints:
    - Universal means all.
    - Franchise means the right to vote.
    solution: All adult citizens can vote regardless of caste, religion, gender or wealth.
    mistakes: {"Only educated people can vote": "s8_universal"}
  - prompt: When was India's first general election held?
    options:
    - 1951–52
    - '1947'
    - '1950'
    - '1962'
    answer: 1951–52
    difficulty: 2
    hints:
    - After the Constitution came into force.
    - It took months.
    solution: The first general election was held in 1951–52.
    mistakes: {"1947": "s8_first_election", "1950": "s8_first_election"}
  - prompt: Which amendment lowered the voting age from 21 to 18?
    options:
    - The 61st Amendment
    - The 42nd Amendment
    - The 1st Amendment
    - The 73rd Amendment
    answer: The 61st Amendment
    difficulty: 3
    hints:
    - Passed in 1988.
    - Sixty-first.
    solution: The 61st Amendment (1988) lowered the voting age to 18.
    mistakes: {"The 42nd Amendment": "s8_61st"}
  - prompt: What does 'one person, one vote, one value' mean?
    options:
    - Every vote counts equally
    - Rich people get extra votes
    - Each family gets one vote
    - Votes are bought
    answer: Every vote counts equally
    difficulty: 1
    hints:
    - Equality.
    - No vote is worth more.
    solution: Each citizen's vote has exactly the same weight.
    mistakes: {"Each family gets one vote": "s8_one_vote"}
  - prompt: Why was India's adoption of universal franchise in 1950 remarkable?
    options:
    - Many poorer and less literate citizens got the vote at once, including all women
    - Only a few people could vote
    - It copied a rule that every country already had
    - It ended elections
    answer: Many poorer and less literate citizens got the vote at once, including all women
    difficulty: 2
    hints:
    - Some older democracies gave women the vote late.
    - India gave it to all at once.
    solution: India gave every adult the vote from the start, at a time when many people predicted it would fail.
    mistakes: {"It copied a rule that every country already had": "s8_remarkable"}
  - prompt: Ravi is 19 and an Indian citizen. Can he vote?
    options:
    - Yes, he is an adult citizen
    - No, he must be 21
    - Only if he owns land
    answer: Yes, he is an adult citizen
    difficulty: 1
    hints:
    - Check the voting age today.
    - Is 19 at least the minimum?
    solution: The voting age is 18, so a 19-year-old citizen can vote.
    mistakes:
      No, he must be 21: c8ss_voting_age
      Only if he owns land: s8v_who_votes
  - prompt: A businessman and a farm worker both vote. Whose vote counts more?
    options:
    - Both count the same
    - The businessman's
    - The farm worker's
    answer: Both count the same
    difficulty: 1
    hints:
    - Remember 'one person, one vote, one value'.
    - Wealth does not change a vote.
    solution: Every vote has equal value, whoever casts it.
    mistakes:
      The businessman's: s8v_equal
      The farm worker's: s8v_equal
  - prompt: Which of these does NOT decide whether a citizen can vote in India?
    options:
    - Their education
    - Their age
    - Their citizenship
    answer: Their education
    difficulty: 2
    hints:
    - Two of these are real conditions.
    - Universal franchise removes conditions like schooling.
    solution: Only citizenship and age (18+) matter; education does not.
    mistakes:
      Their age: s8v_who_votes
      Their citizenship: s8v_who_votes
  - prompt: Why did some leaders in 1950 worry about giving every adult the vote?
    options:
    - Many voters could not read or write
    - There were too few adults
    - Voting was already common
    answer: Many voters could not read or write
    difficulty: 3
    hints:
    - Think of literacy in 1950.
    - How can a voter who cannot read choose a candidate?
    solution: Most Indians could not read then; party symbols on ballots helped them vote.
    mistakes:
      There were too few adults: s8_remarkable
      Voting was already common: s8_remarkable
  - prompt: Why do ballot papers and EVMs show party symbols like a lotus or a hand?
    options:
    - So voters who cannot read can still choose
    - To decorate the machine
    - Because names are not allowed
    answer: So voters who cannot read can still choose
    difficulty: 2
    hints:
    - A picture can be recognised without reading.
    - Think of the first election in 1951–52.
    solution: Symbols let every voter find their candidate, whether or not they can read.
    mistakes:
      To decorate the machine: s8_remarkable
      Because names are not allowed: s8_remarkable
  - prompt: The voting age was lowered from 21 to 18. By how many years?
    answer: '3'
    check: 21-18
    difficulty: 1
    hints:
    - Find the difference between the two ages.
    - Take 18 from 21.
    solution: 21 − 18 = 3 years younger.
    mistakes:
      '39': s8v_gap
  - prompt: What does 'adult' mean for voting in India today?
    options:
    - 18 years or older
    - Married
    - Earning money
    answer: 18 years or older
    difficulty: 1
    hints:
    - It is about age only.
    - The 61st Amendment set it.
    solution: An adult voter is any citizen aged 18 or more.
    mistakes:
      Married: c8ss_voting_age
      Earning money: s8v_who_votes
  - prompt: Why is the vote kept secret?
    options:
    - So people can vote freely without fear or pressure
    - So results are never counted
    - So only rich people know
    answer: So people can vote freely without fear or pressure
    difficulty: 2
    hints:
    - What if your employer could see your vote?
    - Secrecy protects choice.
    solution: A secret ballot means nobody can punish or reward you for your vote.
    mistakes:
      So results are never counted: s8v_secret
      So only rich people know: s8v_secret
  - prompt: Which group got the vote in India at the same time as men, unlike in many older democracies?
    options:
    - Women
    - Children
    - Foreign visitors
    answer: Women
    difficulty: 2
    hints:
    - In Britain and the USA they had to fight for it.
    - India gave it from 1950.
    solution: Indian women voted from the first election, together with men.
    mistakes:
      Children: s8_universal
      Foreign visitors: s8_universal
- code: cbse8ss.vote.ec
  title: How elections are run
  after:
  - cbse8ss.vote.franchise
  notes: |
    The Election Commission of India (set up in 1950) conducts free and fair elections to Parliament, state
    assemblies and the offices of President and Vice-President. It prepares voter lists, announces schedules,
    enforces the Model Code of Conduct on parties and candidates, and counts votes. Voters show an ID and get
    indelible ink on a finger; votes are cast on EVMs (electronic voting machines) with a VVPAT paper slip to
    verify; NOTA ('None of the Above') lets voters reject all candidates. In the first-past-the-post system,
    the candidate with the most votes in a constituency wins.
  explanations:
    text: Elections in India are run by an independent body, the Election Commission. It makes the voter lists, sets the dates, makes parties follow rules, and counts the votes. You vote on an electronic machine and a paper slip shows whom you voted for.
    visual: 'Draw the voting steps: show ID, finger inked, press a button on the EVM next to a symbol, check the VVPAT slip in the window, then the counting day with the winner announced.'
    step_by_step: 'Step 1: The Election Commission announces the election. Step 2: Candidates file nominations and campaign under the Model Code of Conduct. Step 3: Voters cast votes on EVMs. Step 4: Votes are counted; the candidate with the most votes wins the constituency.'
    real_world: 'Polling stations are set up even for a single voter: in Gir forest in Gujarat a booth was set up for one priest, so that no voter has to travel more than about 2 km.'
  picture:
    kind: flow
    steps:
    - Election Commission announces dates
    - Model Code of Conduct begins
    - Campaigning
    - Voting on EVMs with VVPAT
    - 'Counting: most votes wins'
    alt: 'How an Indian election runs: the Election Commission announces it, parties campaign under rules, people vote on EVMs and the candidate with most votes wins.'
  activity:
    type: sort
    prompt: What is it for?
    bins:
    - EVM
    - VVPAT
    - NOTA
    - Indelible ink
    items:
    - label: Recording votes electronically
      bin: EVM
      clue: A machine.
      why: EVM.
    - label: A paper slip to check your vote
      bin: VVPAT
      clue: Verify.
      why: VVPAT.
    - label: Rejecting all candidates
      bin: NOTA
      clue: None of the above.
      why: NOTA.
    - label: Stops anyone voting twice
      bin: Indelible ink
      clue: On the finger.
      why: Ink.
  lesson:
    - teach: The Election Commission of India, set up in 1950, runs elections to Parliament, state assemblies, and the offices of President and Vice-President. It is independent, so no party can control it. It prepares voter lists and announces election dates.
      check:
        prompt: Why must the Election Commission be independent?
        options:
        - So elections are fair to every party
        - So it can choose the winner
        - So it can make laws
        answer: So elections are fair to every party
        why: An umpire who belongs to one team cannot be fair.
    - teach: 'Once dates are announced, the Model Code of Conduct applies: parties and candidates must not bribe voters, use religion or caste to seek votes, or misuse government power. On voting day, voters show an ID, get indelible ink on a finger, and vote on an EVM. A VVPAT slip shows whom they voted for. NOTA lets them reject all candidates.'
      picture:
        kind: flow
        steps:
        - Show ID
        - Ink on finger
        - Press button on EVM
        - Check VVPAT slip
        alt: 'Voting day: show ID, get ink on finger, press the EVM button, check the VVPAT paper slip.'
      check:
        prompt: What does the VVPAT slip let a voter check?
        options:
        - That the vote went to the chosen candidate
        - Who won
        - How many people voted
        answer: That the vote went to the chosen candidate
        why: VVPAT means Voter Verifiable Paper Audit Trail.
    - teach: 'India uses first-past-the-post: in each constituency, the candidate with the most votes wins, even with less than half. The party with a majority of seats in the Lok Sabha forms the government.'
      picture:
        kind: bars
        bars:
        - label: Candidate A
          value: 40
        - label: Candidate B
          value: 35
        - label: Candidate C
          value: 25
        unit: '% of votes'
        alt: Candidate A has 40%, B 35%, C 25%. A wins with the most votes, though less than half.
      check:
        prompt: A gets 40%, B 35%, C 25%. Who wins?
        options:
        - A
        - Nobody, as no one got half
        - B and C together
        answer: A
        why: Most votes wins; half is not needed.
  items:
  - prompt: Which body conducts elections in India?
    options:
    - The Election Commission of India
    - The Supreme Court
    - Parliament
    - The Prime Minister's Office
    answer: The Election Commission of India
    difficulty: 1
    hints:
    - Set up in 1950.
    - Independent body.
    solution: The Election Commission conducts elections independently.
    mistakes: {"The Prime Minister's Office": "s8_ec", "Parliament": "s8_ec"}
  - prompt: What does EVM stand for?
    options:
    - Electronic Voting Machine
    - Election Vote Monitor
    - Electronic Voter Mark
    - Elected Village Member
    answer: Electronic Voting Machine
    difficulty: 1
    hints:
    - Used to cast votes.
    - Electronic.
    solution: EVM means Electronic Voting Machine.
    mistakes: {"Election Vote Monitor": "s8_evm"}
  - prompt: What is NOTA?
    options:
    - An option to reject all candidates
    - A political party
    - A voter ID card
    - A type of election
    answer: An option to reject all candidates
    difficulty: 2
    hints:
    - None Of The Above.
    - On the EVM.
    solution: NOTA lets a voter reject every candidate.
    mistakes: {"A political party": "s8_nota"}
  - prompt: What is the Model Code of Conduct?
    options:
    - Rules parties and candidates must follow during elections
    - A dress code for voters
    - A law for schools
    - The rules of Parliament
    answer: Rules parties and candidates must follow during elections
    difficulty: 2
    hints:
    - Set by the Election Commission.
    - No bribes, no hate speech.
    solution: It sets rules of behaviour for parties and candidates from announcement to results.
    mistakes: {"A dress code for voters": "s8_mcc"}
  - prompt: Why is indelible ink put on a voter's finger?
    options:
    - So the same person can't vote twice
    - For decoration
    - To count voters
    - To show the party they chose
    answer: So the same person can't vote twice
    difficulty: 1
    hints:
    - It doesn't wash off quickly.
    - Prevents fraud.
    solution: The ink shows a person has already voted.
    mistakes: {"To show the party they chose": "s8_ink"}
  - prompt: In India's first-past-the-post system, who wins a constituency?
    options:
    - The candidate with the most votes
    - The candidate with more than half the votes only
    - The oldest candidate
    - The candidate chosen by the party leader
    answer: The candidate with the most votes
    difficulty: 2
    hints:
    - Even without a majority.
    - Most votes.
    solution: The candidate with the highest number of votes wins, even with less than 50%.
    mistakes: {"The candidate with more than half the votes only": "s8_fptp"}
  - prompt: What does VVPAT stand for?
    options:
    - Voter Verifiable Paper Audit Trail
    - Very Valid Party Account Total
    - Vote Value Per Adult Test
    answer: Voter Verifiable Paper Audit Trail
    difficulty: 2
    hints:
    - It prints on paper.
    - The voter can 'verify' with it.
    solution: VVPAT prints a slip so the voter can verify the vote and it can be audited.
    mistakes:
      Very Valid Party Account Total: s8v_vvpat
      Vote Value Per Adult Test: s8v_vvpat
  - prompt: During elections a minister announces a new road scheme to win votes. Which rule is broken?
    options:
    - The Model Code of Conduct
    - Universal adult franchise
    - The 61st Amendment
    answer: The Model Code of Conduct
    difficulty: 2
    hints:
    - Which rules apply only once dates are announced?
    - They stop misuse of government power.
    solution: The Model Code bars new schemes and promises using government power during elections.
    mistakes:
      Universal adult franchise: s8_mcc
      The 61st Amendment: s8_mcc
  - prompt: In a constituency, P gets 30,000 votes, Q gets 45,000 and R gets 25,000. Who wins?
    options:
    - Q
    - P
    - Nobody
    answer: Q
    difficulty: 1
    hints:
    - Find the highest number.
    - First-past-the-post needs just the most votes.
    solution: Q has the most votes (45,000), so Q wins.
    mistakes:
      P: s8v_constituency
      Nobody: s8v_constituency
  - prompt: In the same constituency (P 30,000, Q 45,000, R 25,000), how many votes were cast in all?
    answer: '100000'
    check: 30000+45000+25000
    difficulty: 2
    hints:
    - Add the three candidates' votes.
    - 30,000 + 45,000 first, then add 25,000.
    solution: 30,000 + 45,000 + 25,000 = 1,00,000 votes.
    mistakes:
      '75000': s8v_constituency
  - prompt: Who announces the dates of a general election?
    options:
    - The Election Commission
    - The Prime Minister
    - The largest party
    answer: The Election Commission
    difficulty: 1
    hints:
    - It must be someone not in the race.
    - It also makes voter lists.
    solution: The independent Election Commission decides and announces the schedule.
    mistakes:
      The Prime Minister: s8_ec
      The largest party: s8_ec
  - prompt: A voter dislikes every candidate. What can she press on the EVM?
    options:
    - NOTA
    - Any button at random
    - Nothing; she cannot vote
    answer: NOTA
    difficulty: 1
    hints:
    - There is a button for 'none of these'.
    - It records that she voted but chose no one.
    solution: NOTA ('None of the Above') lets her reject all candidates.
    mistakes:
      Any button at random: s8v_reject
      Nothing; she cannot vote: s8v_reject
  - prompt: Why does the Election Commission keep a list of voters (electoral roll)?
    options:
    - To check that only eligible people vote, once each
    - To choose who wins
    - To collect taxes
    answer: To check that only eligible people vote, once each
    difficulty: 2
    hints:
    - At the booth, officers look for your name.
    - It stops fake and repeat voting.
    solution: The roll lists every eligible voter so booths can check names and stop fraud.
    mistakes:
      To choose who wins: s8_ec
      To collect taxes: s8_ec
  - prompt: Which is against the Model Code of Conduct?
    options:
    - Asking for votes in the name of caste or religion
    - Holding a peaceful rally with permission
    - Printing a manifesto
    answer: Asking for votes in the name of caste or religion
    difficulty: 2
    hints:
    - Two are normal parts of campaigning.
    - Which one divides voters unfairly?
    solution: Appeals to caste or religion are banned; rallies and manifestos are allowed.
    mistakes:
      Holding a peaceful rally with permission: s8_mcc
      Printing a manifesto: s8_mcc
  - prompt: Why are EVMs used instead of paper ballots?
    options:
    - Faster counting and no invalid or torn ballots
    - They choose the winner
    - They let people vote twice
    answer: Faster counting and no invalid or torn ballots
    difficulty: 2
    hints:
    - Think of counting millions of papers.
    - A button press can't be smudged.
    solution: EVMs count quickly and avoid spoilt ballots; the VVPAT keeps a paper check.
    mistakes:
      They choose the winner: s8_evm
      They let people vote twice: s8_ink
