    - The press law
    - The arms law
    - The forest law
    answer: The salt law
    difficulty: 1
    hints:
    - He picked something up from the seashore.
    - Salt March.
    solution: Gandhi made salt at Dandi, breaking the British salt monopoly.
  - prompt: What was Gandhi's call during the Quit India Movement of 1942?
    options:
    - Do or Die
    - Swaraj is my birthright
    - Inquilab Zindabad
    - Jai Hind
    answer: Do or Die
    difficulty: 2
    hints:
    - August 1942.
    - Karo ya maro.
    solution: Gandhi's Quit India call was 'Do or Die'.
  - prompt: Who formed the Indian National Army's Azad Hind government?
    options:
    - Subhas Chandra Bose
    - Bhagat Singh
    - Jawaharlal Nehru
    - Sardar Patel
    answer: Subhas Chandra Bose
    difficulty: 2
    hints:
    - Netaji.
    - '''Give me blood and I will give you freedom''.'
    solution: Subhas Chandra Bose led the INA and the Azad Hind government.
  - prompt: Who brought the princely states into India after independence?
    options:
    - Sardar Vallabhbhai Patel
    - B. R. Ambedkar
    - Rajendra Prasad
    - Maulana Azad
    answer: Sardar Vallabhbhai Patel
    difficulty: 2
    hints:
    - The 'Iron Man of India'.
    - Over 560 states.
    solution: Sardar Patel integrated over 560 princely states into India.
