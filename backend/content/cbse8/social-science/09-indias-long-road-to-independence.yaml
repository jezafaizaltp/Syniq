- code: cbse8ss.freedom.gandhi
  title: Gandhi, mass movements and independence
  after:
  - cbse8ss.freedom.early
  notes: |
    Mahatma Gandhi returned from South Africa in 1915 with satyagraha (non-violent resistance) and led
    Champaran (1917), Kheda and Ahmedabad. After the Rowlatt Act and the Jallianwala Bagh massacre (13 April
    1919), he led the Non-Cooperation Movement (1920–22), called off after Chauri Chaura. The Lahore session
    (1929) demanded Purna Swaraj; the Salt March to Dandi (1930) began Civil Disobedience. Revolutionaries like
    Bhagat Singh and Chandrashekhar Azad, and Subhas Chandra Bose's Indian National Army, fought on. The Quit
    India Movement (August 1942, 'Do or Die') was followed by independence on 15 August 1947, along with the
    Partition of India. Sardar Patel integrated over 560 princely states.
  explanations:
    text: Gandhi turned the freedom struggle into a movement of millions using non-violent resistance. From Champaran to the Salt March and Quit India, ordinary people joined in. Others, like Bhagat Singh and Subhas Chandra Bose, took different paths. India became free on 15 August 1947, though Partition brought great suffering.
    visual: 'Draw a long road from 1915 to 1947 with milestones: Champaran 1917, Jallianwala Bagh 1919, Non-Cooperation 1920, Dandi 1930, Quit India 1942, Independence 1947.'
    step_by_step: 'Step 1: 1915: Gandhi returns. Step 2: 1919: Jallianwala Bagh. Step 3: 1920–22: Non-Cooperation. Step 4: 1930: Salt March and Civil Disobedience. Step 5: 1942: Quit India. Step 6: 1947: Independence and Partition.'
    real_world: On the Salt March in 1930, Gandhi and 78 followers walked about 390 km from Sabarmati to Dandi, where he picked up salt to break the British salt law.
  picture:
    kind: flow
    steps:
    - '1917: Champaran satyagraha'
    - '1919: Jallianwala Bagh massacre'
    - '1920–22: Non-Cooperation'
    - '1930: Salt March to Dandi'
    - '1942: Quit India'
    - '15 August 1947: Independence'
    alt: The Gandhian phase of the freedom struggle from Champaran in 1917 to independence on 15 August 1947.
  activity:
    type: order
    prompt: Put the freedom struggle in order.
    steps:
    - Champaran satyagraha (1917)
    - Non-Cooperation Movement (1920–22)
    - Salt March to Dandi (1930)
    - Quit India (August 1942)
    - Independence (15 August 1947)
    reasons:
      Non-Cooperation Movement (1920–22): It followed Jallianwala Bagh (1919).
      Salt March to Dandi (1930): Civil Disobedience came after Purna Swaraj (1929).
      Quit India (August 1942): Quit India came during the Second World War.
      Independence (15 August 1947): Freedom came five years after Quit India.
  lesson:
    - teach: 'Mahatma Gandhi returned from South Africa in 1915 with satyagraha: resisting injustice by truth and non-violence. He led indigo farmers at Champaran (1917), peasants at Kheda and mill workers at Ahmedabad.'
      check:
        prompt: What is satyagraha?
        options:
        - Non-violent resistance based on truth
        - An armed revolt
        - A tax on salt
        answer: Non-violent resistance based on truth
        why: '''Satya'' is truth and ''agraha'' is holding firm.'
    - teach: After the Jallianwala Bagh massacre on 13 April 1919, Gandhi launched Non-Cooperation (1920–22), called off after violence at Chauri Chaura. In 1929 at Lahore, Congress demanded Purna Swaraj (complete freedom). In 1930 the Salt March to Dandi began Civil Disobedience.
      picture:
        kind: flow
        steps:
        - 1917 Champaran
        - 1919 Jallianwala Bagh
        - 1920 Non-Cooperation
        - 1930 Salt March
        - 1942 Quit India
        - 1947 Independence
        alt: 1917 Champaran, 1919 Jallianwala Bagh, 1920 Non-Cooperation, 1930 Salt March, 1942 Quit India, 1947 independence.
      check:
        prompt: Why did Gandhi call off Non-Cooperation in 1922?
        options:
        - Violence at Chauri Chaura
        - Britain gave freedom
        - He went to South Africa
        answer: Violence at Chauri Chaura
        why: A police station was burnt; Gandhi wanted the movement to stay non-violent.
    - teach: Revolutionaries like Bhagat Singh and Chandrashekhar Azad, and Subhas Chandra Bose's Indian National Army, also fought for freedom. In August 1942 Gandhi called 'Do or Die' in the Quit India Movement. India became free on 15 August 1947, with the painful Partition. Sardar Patel then brought over 560 princely states into India.
      check:
        prompt: Who brought the princely states into India?
        options:
        - Sardar Vallabhbhai Patel
        - Lord Curzon
        - Bhagat Singh
        answer: Sardar Vallabhbhai Patel
        why: As Home Minister, Patel persuaded the princes to join India.
