concepts:
- code: cbse8ss.freedom.early
  title: From 1857 to the early national movement
  notes: |
    After 1857 the British Crown ruled India directly. Social reformers (Raja Ram Mohan Roy's Brahmo Samaj,
    Dayananda Saraswati's Arya Samaj, Jyotirao and Savitribai Phule) and thinkers like Swami Vivekananda
    awakened pride and questioned injustice. The Indian National Congress was founded in 1885; early
    'Moderates' (Dadabhai Naoroji, Gopal Krishna Gokhale) petitioned for reforms, while 'Extremists' (Bal
    Gangadhar Tilak: 'Swaraj is my birthright', Lala Lajpat Rai, Bipin Chandra Pal) demanded more. The
    Partition of Bengal (1905) sparked the Swadeshi and Boycott movements. Revolutionaries, the Ghadar party
    and the Home Rule League (1916) kept the struggle going.
  explanations:
    text: After 1857, Indians began organising to win their rights. Reformers challenged unfair customs, the Indian National Congress was formed in 1885, and when the British split Bengal in 1905 people boycotted British goods and chose swadeshi, Indian-made things.
    visual: 'Draw a timeline: 1857 revolt, 1885 Congress founded, 1905 Partition of Bengal and Swadeshi, 1916 Home Rule League, with pictures of reformers along the way.'
    step_by_step: 'Step 1: 1857: the great revolt and Crown rule. Step 2: Reformers and thinkers build pride and unity. Step 3: 1885: the Congress is founded. Step 4: 1905: Bengal is partitioned; Swadeshi begins. Step 5: Moderates, Extremists and revolutionaries push forward.'
    real_world: During the Swadeshi movement people burned British cloth in bonfires and set up Indian mills, banks and national schools; V. O. Chidambaram Pillai even started an Indian shipping company to rival British ships.
  picture:
    kind: flow
    steps:
    - '1857: Revolt; Crown takes over'
    - Reformers spread new ideas
    - '1885: Indian National Congress founded'
    - '1905: Partition of Bengal, Swadeshi'
    - '1916: Home Rule League'
    alt: The early national movement from the 1857 revolt to the Home Rule League in 1916.
  activity:
    type: sort
    prompt: Moderate or Extremist?
    bins:
    - Moderate
    - Extremist
    items:
    - label: Dadabhai Naoroji
      bin: Moderate
      clue: Petitions and reforms.
      why: Moderate.
    - label: Gopal Krishna Gokhale
      bin: Moderate
      clue: Patient requests.
      why: Moderate.
    - label: 'Bal Gangadhar Tilak: ''Swaraj is my birthright'''
      bin: Extremist
      clue: Demanded more.
      why: Extremist.
    - label: Lala Lajpat Rai
      bin: Extremist
      clue: Lal of Lal-Bal-Pal.
      why: Extremist.
    - label: Bipin Chandra Pal
      bin: Extremist
      clue: Pal of Lal-Bal-Pal.
      why: Extremist.
  lesson:
    - teach: 'After 1857 the British Crown ruled India directly. Reformers questioned injustice and built pride: Raja Ram Mohan Roy (Brahmo Samaj) worked against sati, Dayananda Saraswati founded the Arya Samaj, Jyotirao and Savitribai Phule opened schools for girls and lower castes, and Swami Vivekananda spoke of India''s strength.'
      check:
        prompt: Who opened schools for girls in Pune in the 1840s?
        options:
        - Jyotirao and Savitribai Phule
        - Bal Gangadhar Tilak
        - Annie Besant
        answer: Jyotirao and Savitribai Phule
        why: The Phules started one of the first girls' schools in 1848.
    - teach: 'The Indian National Congress was founded in 1885. Early ''Moderates'' like Dadabhai Naoroji and Gopal Krishna Gokhale sent petitions for reform. ''Extremists'' like Lala Lajpat Rai, Bal Gangadhar Tilak and Bipin Chandra Pal (Lal-Bal-Pal) demanded swaraj. Tilak said: ''Swaraj is my birthright and I shall have it.'''
      picture:
        kind: compare
        columns:
        - title: Moderates
          points:
          - Naoroji, Gokhale
          - Petitions and speeches
          - Reforms within British rule
        - title: Extremists
          points:
          - Lal, Bal, Pal
          - Protests and boycott
          - Swaraj (self-rule)
        alt: Moderates like Naoroji and Gokhale used petitions for reform; Extremists Lal-Bal-Pal used protest and demanded swaraj.
      check:
        prompt: Which group used petitions and speeches?
        options:
        - Moderates
        - Extremists
        - Revolutionaries
        answer: Moderates
        why: Moderates believed polite requests would bring reform.
    - teach: In 1905 Lord Curzon divided Bengal. Indians answered with Swadeshi (buy Indian-made goods) and Boycott (refuse British goods). Revolutionaries, the Ghadar Party abroad, and the Home Rule League of Tilak and Annie Besant (1916) kept the struggle alive.
      picture:
        kind: flow
        steps:
        - 1885 Congress founded
        - 1905 Bengal partition
        - Swadeshi and Boycott
        - 1916 Home Rule League
        alt: 1885 Congress, 1905 partition of Bengal, Swadeshi and Boycott, 1916 Home Rule League.
      check:
        prompt: 'Burning British cloth in 1905 was part of:'
        options:
        - The Boycott movement
        - The Salt March
        - Quit India
        answer: The Boycott movement
        why: Refusing British goods was the boycott.
