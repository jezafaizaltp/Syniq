    options:
    - Champaran
    - Dandi
    - Kheda
    - Bardoli
    answer: Champaran
    difficulty: 1
    hints:
    - In Bihar, 1917.
    - Indigo planters.
    solution: Gandhi's first satyagraha in India was at Champaran in 1917.
  - prompt: In which year did the Jallianwala Bagh massacre take place?
