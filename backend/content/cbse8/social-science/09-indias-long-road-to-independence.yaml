# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 9 (Part 2 chapter 2). Format: content/README.md.
subject: cbse8-ss
chapter: 9
title: India's Long Road to Independence
concepts:
- code: cbse8ss.freedom.early
  title: From 1857 to the early national movement
  notes: |
    After 1857 the British Crown ruled India directly. Social reformers (Raja Ram Mohan Roy's Brahmo Samaj,
    Dayananda Saraswati's Arya Samaj, Jyotirao and Savitribai Phule) and thinkers like Swami Vivekananda
    awakened pride and questioned injustice. The Indian National Congress was founded in 1885; early
    'Moderates' (Dadabhai Naoroji, Gopal Krishna Gokhale) petitioned for reforms, while 'Extremists' (Bal
    Gangadhar Tilak: 'Swaraj is my birthright', Lala Lajpat Rai, Bipin Chandra Pal) demanded more. The
    Partition of Bengal (1905) sparked the Swadeshi and Boycott movements. Revolutionaries, the Ghadar party
    and the Home Rule League (1916) kept the struggle going.
  explanations:
    text: After 1857, Indians began organising to win their rights. Reformers challenged unfair customs, the Indian National Congress was formed in 1885, and when the British split Bengal in 1905 people boycotted British goods and chose swadeshi, Indian-made things.
    visual: 'Draw a timeline: 1857 revolt, 1885 Congress founded, 1905 Partition of Bengal and Swadeshi, 1916 Home Rule League, with pictures of reformers along the way.'
    step_by_step: 'Step 1: 1857: the great revolt and Crown rule. Step 2: Reformers and thinkers build pride and unity. Step 3: 1885: the Congress is founded. Step 4: 1905: Bengal is partitioned; Swadeshi begins. Step 5: Moderates, Extremists and revolutionaries push forward.'
    real_world: During the Swadeshi movement people burned British cloth in bonfires and set up Indian mills, banks and national schools; V. O. Chidambaram Pillai even started an Indian shipping company to rival British ships.
  picture:
    kind: flow
    steps:
    - '1857: Revolt; Crown takes over'
    - Reformers spread new ideas
    - '1885: Indian National Congress founded'
    - '1905: Partition of Bengal, Swadeshi'
    - '1916: Home Rule League'
    alt: The early national movement from the 1857 revolt to the Home Rule League in 1916.
  items:
  - prompt: In which year was the Indian National Congress founded?
    answer: '1885'
    check: '1885'
    difficulty: 1
    hints:
    - Late 19th century.
    - In Bombay.
    solution: The Congress was founded in 1885.
  - prompt: Who said 'Swaraj is my birthright and I shall have it'?
    options:
    - Bal Gangadhar Tilak
    - Gopal Krishna Gokhale
    - Dadabhai Naoroji
    - Jawaharlal Nehru
    answer: Bal Gangadhar Tilak
    difficulty: 1
    hints:
    - An 'Extremist' leader.
    - Edited Kesari.
    solution: Tilak's famous call was 'Swaraj is my birthright'.
  - prompt: Which event in 1905 started the Swadeshi movement?
    options:
    - The Partition of Bengal
    - The Jallianwala Bagh massacre
    - The Salt March
    - The founding of Congress
    answer: The Partition of Bengal
    difficulty: 1
    hints:
    - Lord Curzon.
    - '1905.'
    solution: Curzon's Partition of Bengal triggered Swadeshi and Boycott.
  - prompt: What did 'Swadeshi' mean?
    options:
    - Using Indian-made goods instead of British goods
    - Moving to Britain
    - Fighting with weapons
    - Learning English
    answer: Using Indian-made goods instead of British goods
    difficulty: 1
    hints:
    - Swa = own, desh = country.
    - Boycott foreign goods.
    solution: Swadeshi meant using goods made in one's own country.
  - prompt: Who founded the Arya Samaj?
    options:
    - Dayananda Saraswati
    - Raja Ram Mohan Roy
    - Swami Vivekananda
    - Jyotirao Phule
    answer: Dayananda Saraswati
    difficulty: 2
    hints:
    - '1875.'
    - Back to the Vedas.
    solution: Swami Dayananda Saraswati founded the Arya Samaj in 1875.
  - prompt: Who started the Home Rule movement in 1916 with Tilak?
    options:
    - Annie Besant
    - Sarojini Naidu
    - Rani Lakshmibai
    - Kasturba Gandhi
    answer: Annie Besant
    difficulty: 2
    hints:
    - An Irish-born leader.
    - Theosophical Society.
    solution: Annie Besant and Tilak led the Home Rule movement.
- code: cbse8ss.freedom.gandhi
  title: Gandhi, mass movements and independence
  after:
  - cbse8ss.freedom.early
  notes: |
    Mahatma Gandhi returned from South Africa in 1915 with satyagraha (non-violent resistance) and led
    Champaran (1917), Kheda and Ahmedabad. After the Rowlatt Act and the Jallianwala Bagh massacre (13 April
    1919), he led the Non-Cooperation Movement (1920–22), called off after Chauri Chaura. The Lahore session
    (1929) demanded Purna Swaraj; the Salt March to Dandi (1930) began Civil Disobedience. Revolutionaries like
    Bhagat Singh and Chandrashekhar Azad, and Subhas Chandra Bose's Indian National Army, fought on. The Quit
    India Movement (August 1942, 'Do or Die') was followed by independence on 15 August 1947, along with the
    Partition of India. Sardar Patel integrated over 560 princely states.
  explanations:
    text: Gandhi turned the freedom struggle into a movement of millions using non-violent resistance. From Champaran to the Salt March and Quit India, ordinary people joined in. Others, like Bhagat Singh and Subhas Chandra Bose, took different paths. India became free on 15 August 1947, though Partition brought great suffering.
    visual: 'Draw a long road from 1915 to 1947 with milestones: Champaran 1917, Jallianwala Bagh 1919, Non-Cooperation 1920, Dandi 1930, Quit India 1942, Independence 1947.'
    step_by_step: 'Step 1: 1915: Gandhi returns. Step 2: 1919: Jallianwala Bagh. Step 3: 1920–22: Non-Cooperation. Step 4: 1930: Salt March and Civil Disobedience. Step 5: 1942: Quit India. Step 6: 1947: Independence and Partition.'
    real_world: On the Salt March in 1930, Gandhi and 78 followers walked about 390 km from Sabarmati to Dandi, where he picked up salt to break the British salt law.
  picture:
    kind: flow
    steps:
    - '1917: Champaran satyagraha'
    - '1919: Jallianwala Bagh massacre'
    - '1920–22: Non-Cooperation'
    - '1930: Salt March to Dandi'
    - '1942: Quit India'
    - '15 August 1947: Independence'
    alt: The Gandhian phase of the freedom struggle from Champaran in 1917 to independence on 15 August 1947.
  items:
