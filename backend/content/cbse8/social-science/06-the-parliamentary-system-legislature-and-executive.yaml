- code: cbse8ss.parl.exec
  title: The executive and accountability
  after:
  - cbse8ss.parl.houses
  notes: |
    The President is the head of state; real executive power lies with the Council of Ministers headed by the
    Prime Minister. The party or coalition with a majority in the Lok Sabha forms the government, and the
    President appoints its leader as Prime Minister. Ministers head departments and are collectively
    responsible to the Lok Sabha: if it passes a no-confidence motion, the government must resign. Parliament
    checks the government through Question Hour, debates, committees and control of the budget. The
    opposition questions and criticises government policies.
  explanations:
    text: The government that runs the country is led by the Prime Minister and the ministers. They stay in power only as long as most Lok Sabha members support them, so they must answer questions in Parliament and explain their decisions. That is how voters, through their MPs, keep the government accountable.
    visual: Draw voters → elect MPs → majority party → Prime Minister and ministers, with a loop back from Parliament to the ministers labelled 'questions, debates, no-confidence vote'.
    step_by_step: 'Step 1: Voters elect MPs to the Lok Sabha. Step 2: The majority party''s leader becomes Prime Minister. Step 3: The PM chooses ministers. Step 4: Parliament questions and checks them. Step 5: If the Lok Sabha loses confidence, the government resigns.'
    real_world: During Question Hour, any MP can ask a minister about problems in their constituency, from a broken railway bridge to delayed school scholarships, and the minister must reply.
  picture:
    kind: flow
    steps:
    - Voters elect MPs
    - Majority party or coalition forms the government
    - President appoints the Prime Minister
    - PM and Council of Ministers run the country
    - Parliament questions and checks them
    alt: 'How the government is formed and held accountable: voters elect MPs, the majority forms the government led by the Prime Minister, and Parliament checks it.'
  activity:
    type: order
    prompt: Forming and checking a government. Put it in order.
    steps:
    - Lok Sabha election results
    - The majority party chooses its leader
    - The President appoints that leader Prime Minister
    - Ministers run departments
    - Lok Sabha can pass a no-confidence motion
    reasons:
      The majority party chooses its leader: The party needs a majority before it picks a leader to form the government.
      The President appoints that leader Prime Minister: The President appoints whoever has the majority's support.
      Ministers run departments: Ministers are chosen after the PM is appointed.
      Lok Sabha can pass a no-confidence motion: Parliament checks a government that is already in office.
  items:
  - prompt: Who is the head of state in India?
    options:
    - The President
    - The Prime Minister
    - The Chief Justice
    - The Speaker
    answer: The President
    difficulty: 1
    hints:
    - A ceremonial head.
    - Lives in Rashtrapati Bhavan.
    solution: The President is the head of state.
    mistakes: {"The Prime Minister": "s8_head_state"}
  - prompt: Who usually becomes Prime Minister?
    options:
    - The leader of the majority party or coalition in the Lok Sabha
    - The oldest MP
    - The Chief Justice
    - The person with the most money
    answer: The leader of the majority party or coalition in the Lok Sabha
    difficulty: 1
    hints:
    - Who has the support of most MPs?
    - Majority.
    solution: The President appoints the leader with majority support in the Lok Sabha.
    mistakes: {"The oldest MP": "s8_pm"}
  - prompt: What happens if the Lok Sabha passes a no-confidence motion?
    options:
    - The government must resign
    - The President resigns
    - Elections are cancelled
    - Nothing happens
    answer: The government must resign
    difficulty: 2
    hints:
    - Ministers are responsible to the Lok Sabha.
    - No confidence means no support.
    solution: The Council of Ministers must resign if it loses the Lok Sabha's confidence.
    mistakes: {"The President resigns": "s8_no_confidence"}
  - prompt: What is Question Hour?
    options:
    - Time when MPs ask ministers questions
    - A school exam
    - Time for voting on the budget
    - A break for MPs
    answer: Time when MPs ask ministers questions
    difficulty: 1
    hints:
    - Usually the first hour.
    - Accountability.
    solution: During Question Hour MPs question ministers on their work.
    mistakes: {"Time for voting on the budget": "s8_question_hour"}
  - prompt: What is the role of the opposition?
    options:
    - To question and criticise the government's policies
    - To run the government
    - To appoint judges
    - To conduct elections
    answer: To question and criticise the government's policies
    difficulty: 2
    hints:
    - They are not in power.
    - A watchdog.
    solution: The opposition keeps the government in check by questioning it.
    mistakes: {"To run the government": "s8_opposition"}
  - prompt: Who heads the Council of Ministers?
    options:
    - The Prime Minister
    - The President
    - The Vice-President
    - The Speaker
    answer: The Prime Minister
    difficulty: 1
    hints:
    - The real executive.
    - Head of government.
    solution: The Prime Minister heads the Council of Ministers.
    mistakes: {"The President": "s8_council"}
