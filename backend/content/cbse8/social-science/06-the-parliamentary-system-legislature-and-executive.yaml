    - A signature.
    solution: A bill becomes an Act after the President's assent.
    mistakes: {"The Supreme Court approves it": "s8_assent"}
  - prompt: Why is the Rajya Sabha called a permanent House?
    options:
    - It is never dissolved; one-third of members retire every two years
    - Its members are appointed for life
    - It meets every day
    - It has the most members
    answer: It is never dissolved; one-third of members retire every two years
    difficulty: 3
    hints:
    - The Lok Sabha is dissolved after 5 years.
    - Staggered terms.
    solution: The Rajya Sabha is never dissolved; members serve 6 years with one-third retiring every 2 years.
