      why: Lok Sabha.
    - label: Presided over by the Speaker
      bin: Lok Sabha
      clue: House of the People.
      why: Lok Sabha.
    - label: 12 members nominated by the President
      bin: Rajya Sabha
      clue: Art, science, literature.
      why: Rajya Sabha.
    - label: Permanent; a third retire every two years
      bin: Rajya Sabha
      clue: Never dissolved.
      why: Rajya Sabha.
    - label: Chaired by the Vice-President
      bin: Rajya Sabha
      clue: Council of States.
      why: Rajya Sabha.
  items:
