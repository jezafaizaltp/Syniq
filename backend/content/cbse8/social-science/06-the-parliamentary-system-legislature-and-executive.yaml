concepts:
- code: cbse8ss.parl.houses
  title: 'Parliament: Lok Sabha and Rajya Sabha'
  notes: |
    India's Parliament has the President and two Houses. The Lok Sabha (House of the People) has up to 543
    elected members, chosen directly by voters for 5 years; it is presided over by the Speaker. The Rajya Sabha
    (Council of States) has up to 250 members: elected by state legislatures, with 12 nominated by the
    President for their work in art, science, literature or social service; it is permanent, with one-third
    retiring every two years, and the Vice-President chairs it. Parliament makes laws, controls government
    money (the budget) and holds the government to account through questions and debates.
  explanations:
    text: 'Parliament is where India''s laws are made. It has two houses: the Lok Sabha, whose members you elect directly every five years, and the Rajya Sabha, whose members are chosen by the states. A bill must pass both houses and be signed by the President to become law.'
    visual: 'Draw a building with two halls: a green one (Lok Sabha, 543 seats, Speaker) and a red one (Rajya Sabha, up to 250 seats, Chairman), with the President above both.'
    step_by_step: 'Step 1: A bill is introduced in either House. Step 2: It is debated and voted on. Step 3: It goes to the other House. Step 4: The President gives assent. Step 5: It becomes an Act (law).'
    real_world: The new Parliament House in New Delhi, opened in 2023, has a Lok Sabha chamber designed on the theme of the peacock, the national bird, and a Rajya Sabha chamber on the lotus, the national flower.
  picture:
    kind: compare
    columns:
    - title: Lok Sabha
      points:
      - House of the People
      - Up to 543 elected members
      - Elected directly for 5 years
      - Presided over by the Speaker
    - title: Rajya Sabha
      points:
      - Council of States
      - Up to 250 members
      - Chosen by state legislatures; 12 nominated
      - Chaired by the Vice-President
    alt: The Lok Sabha has up to 543 directly elected members led by the Speaker; the Rajya Sabha has up to 250 members chosen by states and chaired by the Vice-President.
    caption: Two Houses, one Parliament.
