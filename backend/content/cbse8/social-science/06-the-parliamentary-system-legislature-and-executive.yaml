# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 6. Format: content/README.md.
subject: cbse8-ss
chapter: 6
title: 'The Parliamentary System: Legislature and Executive'
tips:
  c8ss_which_house: That number belongs to the other House. The Lok Sabha has up to 543 elected members; the Rajya Sabha up to 250.
concepts:
- code: cbse8ss.parl.houses
  title: 'Parliament: Lok Sabha and Rajya Sabha'
  notes: |
    India's Parliament has the President and two Houses. The Lok Sabha (House of the People) has up to 543
    elected members, chosen directly by voters for 5 years; it is presided over by the Speaker. The Rajya Sabha
    (Council of States) has up to 250 members: elected by state legislatures, with 12 nominated by the
    President for their work in art, science, literature or social service; it is permanent, with one-third
    retiring every two years, and the Vice-President chairs it. Parliament makes laws, controls government
    money (the budget) and holds the government to account through questions and debates.
  explanations:
    text: 'Parliament is where India''s laws are made. It has two houses: the Lok Sabha, whose members you elect directly every five years, and the Rajya Sabha, whose members are chosen by the states. A bill must pass both houses and be signed by the President to become law.'
    visual: 'Draw a building with two halls: a green one (Lok Sabha, 543 seats, Speaker) and a red one (Rajya Sabha, up to 250 seats, Chairman), with the President above both.'
    step_by_step: 'Step 1: A bill is introduced in either House. Step 2: It is debated and voted on. Step 3: It goes to the other House. Step 4: The President gives assent. Step 5: It becomes an Act (law).'
    real_world: The new Parliament House in New Delhi, opened in 2023, has a Lok Sabha chamber designed on the theme of the peacock, the national bird, and a Rajya Sabha chamber on the lotus, the national flower.
  picture:
    kind: compare
    columns:
    - title: Lok Sabha
      points:
      - House of the People
      - Up to 543 elected members
      - Elected directly for 5 years
      - Presided over by the Speaker
    - title: Rajya Sabha
      points:
      - Council of States
      - Up to 250 members
      - Chosen by state legislatures; 12 nominated
      - Chaired by the Vice-President
    alt: The Lok Sabha has up to 543 directly elected members led by the Speaker; the Rajya Sabha has up to 250 members chosen by states and chaired by the Vice-President.
    caption: Two Houses, one Parliament.
  items:
  - prompt: How many elected members does the Lok Sabha have at most?
    answer: '543'
    check: '543'
    difficulty: 1
    hints:
    - One for each constituency.
    - Five hundred and forty-three.
    solution: The Lok Sabha has up to 543 elected members.
    mistakes:
      '250': c8ss_which_house
  - prompt: Who presides over the Lok Sabha?
    options:
    - The Speaker
    - The President
    - The Prime Minister
    - The Chief Justice
    answer: The Speaker
    difficulty: 1
    hints:
    - Elected by its members.
    - Keeps order.
    solution: The Speaker presides over the Lok Sabha.
  - prompt: How many Rajya Sabha members can the President nominate?
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - For art, science, literature, social service.
    - A dozen.
    solution: The President nominates 12 members.
  - prompt: Who chairs the Rajya Sabha?
    options:
    - The Vice-President
    - The Speaker
    - The President
    - The Prime Minister
    answer: The Vice-President
    difficulty: 2
    hints:
    - An ex-officio role.
    - Second-highest office.
    solution: The Vice-President is the Chairman of the Rajya Sabha.
  - prompt: What must happen after both Houses pass a bill for it to become law?
    options:
    - The President gives assent
    - The Supreme Court approves it
    - The states vote on it
    - Nothing more
    answer: The President gives assent
    difficulty: 2
    hints:
    - The President is part of Parliament.
    - A signature.
    solution: A bill becomes an Act after the President's assent.
  - prompt: Why is the Rajya Sabha called a permanent House?
    options:
    - It is never dissolved; one-third of members retire every two years
    - Its members are appointed for life
    - It meets every day
    - It has the most members
    answer: It is never dissolved; one-third of members retire every two years
    difficulty: 3
    hints:
    - The Lok Sabha is dissolved after 5 years.
    - Staggered terms.
    solution: The Rajya Sabha is never dissolved; members serve 6 years with one-third retiring every 2 years.
- code: cbse8ss.parl.exec
  title: The executive and accountability
  after:
  - cbse8ss.parl.houses
  notes: |
    The President is the head of state; real executive power lies with the Council of Ministers headed by the
    Prime Minister. The party or coalition with a majority in the Lok Sabha forms the government, and the
    President appoints its leader as Prime Minister. Ministers head departments and are collectively
    responsible to the Lok Sabha: if it passes a no-confidence motion, the government must resign. Parliament
    checks the government through Question Hour, debates, committees and control of the budget. The
    opposition questions and criticises government policies.
  explanations:
    text: The government that runs the country is led by the Prime Minister and the ministers. They stay in power only as long as most Lok Sabha members support them, so they must answer questions in Parliament and explain their decisions. That is how voters, through their MPs, keep the government accountable.
    visual: Draw voters → elect MPs → majority party → Prime Minister and ministers, with a loop back from Parliament to the ministers labelled 'questions, debates, no-confidence vote'.
    step_by_step: 'Step 1: Voters elect MPs to the Lok Sabha. Step 2: The majority party''s leader becomes Prime Minister. Step 3: The PM chooses ministers. Step 4: Parliament questions and checks them. Step 5: If the Lok Sabha loses confidence, the government resigns.'
    real_world: During Question Hour, any MP can ask a minister about problems in their constituency, from a broken railway bridge to delayed school scholarships, and the minister must reply.
  picture:
    kind: flow
    steps:
    - Voters elect MPs
    - Majority party or coalition forms the government
    - President appoints the Prime Minister
    - PM and Council of Ministers run the country
    - Parliament questions and checks them
    alt: 'How the government is formed and held accountable: voters elect MPs, the majority forms the government led by the Prime Minister, and Parliament checks it.'
  items:
  - prompt: Who is the head of state in India?
    options:
    - The President
    - The Prime Minister
    - The Chief Justice
    - The Speaker
    answer: The President
    difficulty: 1
    hints:
    - A ceremonial head.
    - Lives in Rashtrapati Bhavan.
    solution: The President is the head of state.
  - prompt: Who usually becomes Prime Minister?
    options:
    - The leader of the majority party or coalition in the Lok Sabha
    - The oldest MP
    - The Chief Justice
    - The person with the most money
    answer: The leader of the majority party or coalition in the Lok Sabha
    difficulty: 1
    hints:
    - Who has the support of most MPs?
    - Majority.
    solution: The President appoints the leader with majority support in the Lok Sabha.
  - prompt: What happens if the Lok Sabha passes a no-confidence motion?
    options:
    - The government must resign
    - The President resigns
    - Elections are cancelled
    - Nothing happens
    answer: The government must resign
    difficulty: 2
    hints:
    - Ministers are responsible to the Lok Sabha.
    - No confidence means no support.
    solution: The Council of Ministers must resign if it loses the Lok Sabha's confidence.
  - prompt: What is Question Hour?
    options:
    - Time when MPs ask ministers questions
    - A school exam
    - Time for voting on the budget
    - A break for MPs
    answer: Time when MPs ask ministers questions
    difficulty: 1
    hints:
    - Usually the first hour.
    - Accountability.
    solution: During Question Hour MPs question ministers on their work.
  - prompt: What is the role of the opposition?
    options:
    - To question and criticise the government's policies
    - To run the government
    - To appoint judges
    - To conduct elections
    answer: To question and criticise the government's policies
    difficulty: 2
    hints:
    - They are not in power.
    - A watchdog.
    solution: The opposition keeps the government in check by questioning it.
  - prompt: Who heads the Council of Ministers?
    options:
    - The Prime Minister
    - The President
    - The Vice-President
    - The Speaker
    answer: The Prime Minister
    difficulty: 1
    hints:
    - The real executive.
    - Head of government.
    solution: The Prime Minister heads the Council of Ministers.
