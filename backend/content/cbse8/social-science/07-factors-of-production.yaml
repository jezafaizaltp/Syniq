# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 7. Format: content/README.md.
subject: cbse8-ss
chapter: 7
title: Factors of Production
tips:
  s8_agri_jobs: "Most Indians still work on farms."
  s8_capital: "Capital is a man-made tool used to produce more."
  s8_coop: "A cooperative pools members' resources. How does that help small farmers?"
  s8_entrepreneur: "The entrepreneur brings land, labour and capital together."
  s8_human_capital: "Human capital lives in people, not machines."
  s8_land: "In economics 'land' means everything nature gives."
  s8_primary: "Fishing takes something straight from nature."
  s8_profit: "The entrepreneur takes the risk. What is the reward for risk?"
  s8_secondary: "Secondary means turning raw materials into products in factories."
  s8_shg: "A self-help group is small and its members help each other."
  s8_tertiary: "Teachers make nothing you can hold. They give a service."
  s8_wages: "Rent is for land, interest for capital, profit for the entrepreneur. What does labour earn?"

concepts:
- code: cbse8ss.prod.factors
  title: Land, labour, capital and enterprise
  notes: |
    Producing goods and services needs four factors of production. Land: all natural resources (soil, water,
    minerals, forests). Labour: human effort, physical and mental. Capital: things made by people to help
    produce more (tools, machines, buildings: physical capital) plus money; human capital is the skills and
    education of workers. Entrepreneurship: the person who organises the other factors, takes risks and
    innovates. Each factor earns a reward: rent (land), wages (labour), interest (capital) and profit
    (entrepreneur).
  explanations:
    text: To make anything, from a cup of tea to a car, you need land and natural resources, people's work (labour), tools and money (capital), and someone who brings it all together and takes the risk (the entrepreneur).
    visual: 'Draw a small bakery: the land and building, the bakers at work, the oven and mixer, and the owner with a notebook planning, each labelled with its factor and reward (rent, wages, interest, profit).'
    step_by_step: 'Step 1: Land: what nature provides. Step 2: Labour: people''s work. Step 3: Capital: tools, machines, money and skills. Step 4: Entrepreneur: the organiser who takes the risk. Step 5: Match each with its reward.'
    real_world: Amul began in 1946 when dairy farmers in Anand, Gujarat organised a cooperative; their milk (from land and cattle), work, shared machines and organisers like Verghese Kurien together built a giant enterprise.
  picture:
    kind: compare
    columns:
    - title: Factor
      points:
      - Land
      - Labour
      - Capital
      - Entrepreneurship
    - title: Example in a bakery
      points:
      - The plot and water
      - Bakers and helpers
      - Ovens, mixers, money
      - The owner who plans
    - title: Reward
      points:
      - Rent
      - Wages
      - Interest
      - Profit
    alt: 'The four factors of production with bakery examples and their rewards: land earns rent, labour wages, capital interest and the entrepreneur profit.'
    caption: Four factors, four rewards.
  activity:
    type: sort
    prompt: Which factor's reward?
    bins:
    - Rent
    - Wages
    - Interest
    - Profit
    items:
    - label: Paid for using land
      bin: Rent
      clue: Land.
      why: Rent.
    - label: Paid for work
      bin: Wages
      clue: Labour.
      why: Wages.
    - label: Paid for borrowed money and machines
      bin: Interest
      clue: Capital.
      why: Interest.
    - label: Earned by the risk-taker
      bin: Profit
      clue: Entrepreneur.
      why: Profit.
  items:
  - prompt: Which is an example of capital?
    options:
    - A sewing machine in a tailor's shop
    - The tailor's skill only
    - Rain
    - The land under the shop
    answer: A sewing machine in a tailor's shop
    difficulty: 1
    hints:
    - Made by people to help produce.
    - A tool or machine.
    solution: Machines and tools are physical capital.
    mistakes: {"The tailor's skill only": "s8_capital", "The land under the shop": "s8_capital"}
  - prompt: What reward does labour earn?
    options:
    - Wages
    - Rent
    - Profit
    - Interest
    answer: Wages
    difficulty: 1
    hints:
    - Paid for work.
    - Salary.
    solution: Labour is paid wages.
    mistakes: {"Profit": "s8_wages", "Rent": "s8_wages"}
  - prompt: What is the role of an entrepreneur?
    options:
    - Organising the other factors and taking risks
    - Only lending money
    - Only owning land
    - Only doing physical work
    answer: Organising the other factors and taking risks
    difficulty: 1
    hints:
    - Starts a business.
    - Brings it all together.
    solution: An entrepreneur combines land, labour and capital and bears the risk.
    mistakes: {"Only lending money": "s8_entrepreneur"}
  - prompt: What does 'land' include as a factor of production?
    options:
    - All natural resources like soil, water and minerals
    - Only farms
    - Only buildings
    - Only money
    answer: All natural resources like soil, water and minerals
    difficulty: 2
    hints:
    - Gifts of nature.
    - Not just ground.
    solution: Land means all natural resources.
    mistakes: {"Only farms": "s8_land"}
  - prompt: What is human capital?
    options:
    - The skills and education of workers
    - Money in a bank
    - Machines in a factory
    - Land owned by people
    answer: The skills and education of workers
    difficulty: 2
    hints:
    - Invest in people.
    - Training.
    solution: Human capital is the knowledge and skills people bring to work.
    mistakes: {"Machines in a factory": "s8_human_capital"}
  - prompt: What reward does an entrepreneur get?
    options:
    - Profit
    - Wages
    - Rent
    - Interest
    answer: Profit
    difficulty: 1
    hints:
    - What's left after paying the rest.
    - It can also be a loss.
    solution: The entrepreneur earns profit (or bears a loss).
    mistakes: {"Wages": "s8_profit", "Interest": "s8_profit"}
- code: cbse8ss.prod.sectors
  title: Producing goods and services
  after:
  - cbse8ss.prod.factors
  notes: |
    Economic activities fall into sectors: primary (taking from nature: farming, fishing, mining), secondary
    (making goods: factories, construction) and tertiary or services (transport, banking, teaching, health,
    IT). Many people in India still work in agriculture, while services produce the largest share of
    income. Combining factors well, using technology and improving skills raises production. Cooperatives and
    self-help groups let small producers pool resources.
  explanations:
    text: Some people take things from nature, like farmers and fishers. Others turn raw materials into goods, like factory workers. Others provide services, like teachers, doctors and drivers. All three depend on each other.
    visual: Draw cotton growing in a field (primary) → a mill spinning it into cloth (secondary) → a truck carrying shirts to a shop and a shopkeeper selling them (tertiary).
    step_by_step: 'Step 1: Is it taken straight from nature? Primary. Step 2: Is something being made or built? Secondary. Step 3: Is it a service, not a thing? Tertiary.'
    real_world: Kudumbashree in Kerala brings lakhs of women together in self-help groups to run small businesses, from catering to tailoring, by pooling savings and skills.
  picture:
    kind: flow
    steps:
    - 'Primary: farmer grows cotton'
    - 'Secondary: mill makes cloth and shirts'
    - 'Tertiary: truck transports, shop sells'
    - You buy a shirt
    alt: 'From cotton field to shirt: farming is primary, making cloth is secondary, transport and selling are tertiary.'
  activity:
    type: sort
    prompt: Which sector?
    bins:
    - Primary
    - Secondary
    - Tertiary
    items:
    - label: Mining
      bin: Primary
      clue: From the earth.
      why: Primary.
    - label: Construction
      bin: Secondary
      clue: Building.
      why: Secondary.
    - label: IT services
      bin: Tertiary
      clue: Service.
      why: Tertiary.
    - label: Car factory
      bin: Secondary
      clue: Making goods.
      why: Secondary.
    - label: Teaching
      bin: Tertiary
      clue: Service.
      why: Tertiary.
  items:
  - prompt: A fisherman's work is in which sector?
    options:
    - Primary
    - Secondary
    - Tertiary
    - None
    answer: Primary
    difficulty: 1
    hints:
    - Taking from nature.
    - Like farming.
    solution: 'Fishing takes directly from nature: primary sector.'
    mistakes: {"Secondary": "s8_primary"}
  - prompt: A teacher's work belongs to which sector?
    options:
    - Tertiary (services)
    - Primary
    - Secondary
    - Mining
    answer: Tertiary (services)
    difficulty: 1
    hints:
    - No goods are made.
    - A service.
    solution: 'Teaching is a service: tertiary sector.'
    mistakes: {"Secondary": "s8_tertiary"}
  - prompt: Which is a secondary-sector activity?
    options:
    - Making steel in a factory
    - Growing rice
    - Banking
    - Catching fish
    answer: Making steel in a factory
    difficulty: 1
    hints:
    - Manufacturing.
    - Raw material into goods.
    solution: Manufacturing steel is secondary.
    mistakes: {"Growing rice": "s8_secondary", "Banking": "s8_secondary"}
  - prompt: What is a self-help group?
    options:
    - A small group that pools savings and helps members start work
    - A government office
    - A large company
    - A school club
    answer: A small group that pools savings and helps members start work
    difficulty: 2
    hints:
    - Often women in villages.
    - Kudumbashree.
    solution: Members save together and give small loans to one another for livelihoods.
    mistakes: {"A large company": "s8_shg"}
  - prompt: Which sector employs the largest number of people in India?
    options:
    - Agriculture (primary)
    - IT services
    - Banking
    - Car manufacturing
    answer: Agriculture (primary)
    difficulty: 2
    hints:
    - Villages.
    - Farming.
    solution: Agriculture still employs the most people in India.
    mistakes: {"IT services": "s8_agri_jobs"}
  - prompt: Why do cooperatives help small farmers?
    options:
    - They pool resources to buy machines and sell at better prices
    - They take land away
    - They stop farming
    - They only help big companies
    answer: They pool resources to buy machines and sell at better prices
    difficulty: 2
    hints:
    - Strength in numbers.
    - Amul.
    solution: Pooling lets small producers share costs and bargain for fairer prices.
    mistakes: {"They take land away": "s8_coop"}
