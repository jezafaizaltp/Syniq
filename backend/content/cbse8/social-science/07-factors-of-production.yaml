# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 7. Format: content/README.md.
subject: cbse8-ss
chapter: 7
title: Factors of Production
tips:
  s8_agri_jobs: "Most Indians still work on farms."
  s8_capital: "Capital is a man-made tool used to produce more."
  s8_coop: "A cooperative pools members' resources. How does that help small farmers?"
  s8_entrepreneur: "The entrepreneur brings land, labour and capital together."
  s8_human_capital: "Human capital lives in people, not machines."
  s8_land: "In economics 'land' means everything nature gives."
  s8_primary: "Fishing takes something straight from nature."
  s8_profit: "The entrepreneur takes the risk. What is the reward for risk?"
  s8_secondary: "Secondary means turning raw materials into products in factories."
  s8_shg: "A self-help group is small and its members help each other."
  s8_tertiary: "Teachers make nothing you can hold. They give a service."
  s8_wages: "Rent is for land, interest for capital, profit for the entrepreneur. What does labour earn?"
  s8f_rewards: "Each factor has its own reward. First name the factor in the question (land, labour, capital or enterprise), then recall what it is paid."
  s8f_made: "Did people build it to help produce more, or did nature give it?"
  s8f_risk: "Who put their own money in and took the risk of starting the business?"
  s8f_multiply: "Each of the 15 women saves the same amount, so multiply rather than add."
  s8f_income: "Most workers are on farms, but which sector earns the most money for the country?"
  s8f_sector_test: 'Ask: does the work take from nature, make a good, or give a service?'
  s8f_profit_calc: 'Profit is what is left after all costs are paid: money in minus money out.'
  s8f_pool: Small producers who join together can share costs. Which choice is about joining together?

concepts:
- code: cbse8ss.prod.factors
  title: Land, labour, capital and enterprise
  notes: |
    Producing goods and services needs four factors of production. Land: all natural resources (soil, water,
    minerals, forests). Labour: human effort, physical and mental. Capital: things made by people to help
    produce more (tools, machines, buildings: physical capital) plus money; human capital is the skills and
    education of workers. Entrepreneurship: the person who organises the other factors, takes risks and
    innovates. Each factor earns a reward: rent (land), wages (labour), interest (capital) and profit
    (entrepreneur).
  explanations:
    text: To make anything, from a cup of tea to a car, you need land and natural resources, people's work (labour), tools and money (capital), and someone who brings it all together and takes the risk (the entrepreneur).
    visual: 'Draw a small bakery: the land and building, the bakers at work, the oven and mixer, and the owner with a notebook planning, each labelled with its factor and reward (rent, wages, interest, profit).'
    step_by_step: 'Step 1: Land: what nature provides. Step 2: Labour: people''s work. Step 3: Capital: tools, machines, money and skills. Step 4: Entrepreneur: the organiser who takes the risk. Step 5: Match each with its reward.'
    real_world: Amul began in 1946 when dairy farmers in Anand, Gujarat organised a cooperative; their milk (from land and cattle), work, shared machines and organisers like Verghese Kurien together built a giant enterprise.
  picture:
    kind: compare
    columns:
    - title: Factor
      points:
      - Land
      - Labour
      - Capital
      - Entrepreneurship
    - title: Example in a bakery
      points:
      - The plot and water
      - Bakers and helpers
      - Ovens, mixers, money
      - The owner who plans
    - title: Reward
      points:
      - Rent
      - Wages
      - Interest
      - Profit
    alt: 'The four factors of production with bakery examples and their rewards: land earns rent, labour wages, capital interest and the entrepreneur profit.'
    caption: Four factors, four rewards.
  activity:
    type: sort
    prompt: Which factor's reward?
    bins:
    - Rent
    - Wages
    - Interest
    - Profit
    items:
    - label: Paid for using land
      bin: Rent
      clue: Land.
      why: Rent.
    - label: Paid for work
      bin: Wages
      clue: Labour.
      why: Wages.
    - label: Paid for borrowed money and machines
      bin: Interest
      clue: Capital.
      why: Interest.
    - label: Earned by the risk-taker
      bin: Profit
      clue: Entrepreneur.
      why: Profit.
  lesson:
    - teach: 'To produce any good or service we need four factors of production. Land means all natural resources: soil, water, minerals, forests. Labour is human effort, both physical and mental.'
      check:
        prompt: A fisherwoman uses the sea to catch fish. The sea is which factor?
        options:
        - Land
        - Labour
        - Capital
        answer: Land
        why: Land covers all natural resources, including water bodies.
    - teach: 'Capital is anything made by people to help produce more: tools, machines, buildings and money for business. Human capital is the skills and education of workers. The entrepreneur brings land, labour and capital together, takes the risk and tries new ideas.'
      picture:
        kind: flow
        steps:
        - Land
        - Labour
        - Capital
        - Entrepreneur organises
        - Goods and services
        alt: Land, labour and capital are brought together by the entrepreneur to make goods and services.
      check:
        prompt: 'A nurse trained for three years has more:'
        options:
        - Human capital
        - Land
        - Physical capital
        answer: Human capital
        why: Skills and education are human capital.
    - teach: 'Each factor earns a reward: land earns rent, labour earns wages, capital earns interest and the entrepreneur earns profit (or bears the loss).'
      picture:
        kind: compare
        columns:
        - title: Factor
          points:
          - Land
          - Labour
          - Capital
          - Entrepreneur
        - title: Reward
          points:
          - Rent
          - Wages
          - Interest
          - Profit
        alt: Land earns rent, labour wages, capital interest, entrepreneur profit.
      check:
        prompt: A farmer rents a field to another farmer. What does the owner receive?
        options:
        - Rent
        - Wages
        - Interest
        answer: Rent
        why: The reward for land is rent.
  items:
  - prompt: Which is an example of capital?
    options:
    - A sewing machine in a tailor's shop
    - The tailor's skill only
    - Rain
    - The land under the shop
    answer: A sewing machine in a tailor's shop
    difficulty: 1
    hints:
    - Made by people to help produce.
    - A tool or machine.
    solution: Machines and tools are physical capital.
    mistakes: {"The tailor's skill only": "s8_capital", "The land under the shop": "s8_capital"}
  - prompt: What reward does labour earn?
    options:
    - Wages
    - Rent
    - Profit
    - Interest
    answer: Wages
    difficulty: 1
    hints:
    - Paid for work.
    - Salary.
    solution: Labour is paid wages.
    mistakes: {"Profit": "s8_wages", "Rent": "s8_wages"}
  - prompt: What is the role of an entrepreneur?
    options:
    - Organising the other factors and taking risks
    - Only lending money
    - Only owning land
    - Only doing physical work
    answer: Organising the other factors and taking risks
    difficulty: 1
    hints:
    - Starts a business.
    - Brings it all together.
    solution: An entrepreneur combines land, labour and capital and bears the risk.
    mistakes: {"Only lending money": "s8_entrepreneur"}
  - prompt: What does 'land' include as a factor of production?
    options:
    - All natural resources like soil, water and minerals
    - Only farms
    - Only buildings
    - Only money
    answer: All natural resources like soil, water and minerals
    difficulty: 2
    hints:
    - Gifts of nature.
    - Not just ground.
    solution: Land means all natural resources.
    mistakes: {"Only farms": "s8_land"}
  - prompt: What is human capital?
    options:
    - The skills and education of workers
    - Money in a bank
    - Machines in a factory
    - Land owned by people
    answer: The skills and education of workers
    difficulty: 2
    hints:
    - Invest in people.
    - Training.
    solution: Human capital is the knowledge and skills people bring to work.
    mistakes: {"Machines in a factory": "s8_human_capital"}
  - prompt: What reward does an entrepreneur get?
    options:
    - Profit
    - Wages
    - Rent
    - Interest
    answer: Profit
    difficulty: 1
    hints:
    - What's left after paying the rest.
    - It can also be a loss.
    solution: The entrepreneur earns profit (or bears a loss).
    mistakes: {"Wages": "s8_profit", "Interest": "s8_profit"}
  - prompt: A bank loan used to set up a bakery is which factor?
    options:
    - Capital
    - Land
    - Labour
    answer: Capital
    difficulty: 2
    hints:
    - It is money for a business.
    - It helps buy ovens and space.
    solution: Money used for production is capital; its reward is interest.
    mistakes:
      Land: s8f_made
      Labour: s8f_made
  - prompt: What reward does a person who lends money (capital) earn?
    options:
    - Interest
    - Rent
    - Wages
    answer: Interest
    difficulty: 2
    hints:
    - Think of what a bank pays on savings.
    - Land earns rent; labour earns wages.
    solution: Capital earns interest.
    mistakes:
      Rent: s8f_rewards
      Wages: s8f_rewards
  - prompt: A coconut tree on a farm is which factor?
    options:
    - Land
    - Capital
    - Entrepreneur
    answer: Land
    difficulty: 1
    hints:
    - Did nature or a factory make it?
    - Land includes all natural resources.
    solution: Trees are natural resources, part of land.
    mistakes:
      Capital: s8f_made
      Entrepreneur: s8f_made
  - prompt: A tractor used on a farm is which factor?
    options:
    - Physical capital
    - Land
    - Human capital
    answer: Physical capital
    difficulty: 1
    hints:
    - It was made in a factory.
    - It is a tool that helps produce more.
    solution: Machines are physical capital.
    mistakes:
      Land: s8f_made
      Human capital: s8_human_capital
  - prompt: A juice shop owner earns ₹5000 in a week and spends ₹3500 on fruit, wages and rent. What is the profit?
    answer: '1500'
    check: 5000-3500
    difficulty: 2
    hints:
    - Profit is what is left after paying costs.
    - Take costs away from earnings.
    solution: 5000 − 3500 = ₹1500 profit.
    mistakes:
      '8500': s8f_profit_calc
  - prompt: Why does training workers raise production?
    options:
    - Skilled workers do more and better work
    - It adds more land
    - It lowers wages to zero
    answer: Skilled workers do more and better work
    difficulty: 2
    hints:
    - Training builds human capital.
    - What can a trained worker do?
    solution: Better skills mean more output from the same hours.
    mistakes:
      It adds more land: s8_human_capital
      It lowers wages to zero: s8_human_capital
  - prompt: Who bears the loss if a new business fails?
    options:
    - The entrepreneur
    - The workers' wages are returned
    - The land owner
    answer: The entrepreneur
    difficulty: 2
    hints:
    - Who took the risk?
    - Workers are paid wages either way.
    solution: The entrepreneur takes the risk, so earns profit or bears the loss.
    mistakes:
      The workers' wages are returned: s8f_risk
      The land owner: s8f_risk
  - prompt: A software engineer writing an app is mainly using which factor?
    options:
    - Labour with high human capital
    - Land
    - Rent
    answer: Labour with high human capital
    difficulty: 3
    hints:
    - Mental effort is also labour.
    - Her training is part of it.
    solution: Mental work is labour; her skills are human capital.
    mistakes:
      Land: s8_wages
      Rent: s8f_rewards
  - prompt: Which reward goes to the factor 'labour'?
    options:
    - Wages
    - Interest
    - Profit
    answer: Wages
    difficulty: 1
    hints:
    - Workers are paid this for their effort.
    - Interest goes to capital, profit to the entrepreneur.
    solution: Labour earns wages.
    mistakes:
      Interest: s8f_rewards
      Profit: s8f_rewards
- code: cbse8ss.prod.sectors
  title: Producing goods and services
  after:
  - cbse8ss.prod.factors
  notes: |
    Economic activities fall into sectors: primary (taking from nature: farming, fishing, mining), secondary
    (making goods: factories, construction) and tertiary or services (transport, banking, teaching, health,
    IT). Many people in India still work in agriculture, while services produce the largest share of
    income. Combining factors well, using technology and improving skills raises production. Cooperatives and
    self-help groups let small producers pool resources.
  explanations:
    text: Some people take things from nature, like farmers and fishers. Others turn raw materials into goods, like factory workers. Others provide services, like teachers, doctors and drivers. All three depend on each other.
    visual: Draw cotton growing in a field (primary) → a mill spinning it into cloth (secondary) → a truck carrying shirts to a shop and a shopkeeper selling them (tertiary).
    step_by_step: 'Step 1: Is it taken straight from nature? Primary. Step 2: Is something being made or built? Secondary. Step 3: Is it a service, not a thing? Tertiary.'
    real_world: Kudumbashree in Kerala brings lakhs of women together in self-help groups to run small businesses, from catering to tailoring, by pooling savings and skills.
  picture:
    kind: flow
    steps:
    - 'Primary: farmer grows cotton'
    - 'Secondary: mill makes cloth and shirts'
    - 'Tertiary: truck transports, shop sells'
    - You buy a shirt
    alt: 'From cotton field to shirt: farming is primary, making cloth is secondary, transport and selling are tertiary.'
  activity:
    type: sort
    prompt: Which sector?
    bins:
    - Primary
    - Secondary
    - Tertiary
    items:
    - label: Mining
      bin: Primary
      clue: From the earth.
      why: Primary.
    - label: Construction
      bin: Secondary
      clue: Building.
      why: Secondary.
    - label: IT services
      bin: Tertiary
      clue: Service.
      why: Tertiary.
    - label: Car factory
      bin: Secondary
      clue: Making goods.
      why: Secondary.
    - label: Teaching
      bin: Tertiary
      clue: Service.
      why: Tertiary.
  lesson:
    - teach: 'Economic activities fall into three sectors. The primary sector takes from nature: farming, fishing, mining. The secondary sector makes goods: factories and construction. The tertiary (service) sector gives services: transport, banking, teaching, health and IT.'
      picture:
        kind: flow
        steps:
        - 'Primary: grow cotton'
        - 'Secondary: weave cloth'
        - 'Tertiary: truck it to shops and sell'
        alt: Cotton is grown (primary), woven into cloth (secondary) and transported and sold (tertiary).
      check:
        prompt: A truck driver delivering rice is in which sector?
        options:
        - Tertiary
        - Primary
        - Secondary
        answer: Tertiary
        why: Transport is a service.
    - teach: In India, many people still work in agriculture, but services produce the largest share of the country's income. More technology and better skills help each sector produce more.
      picture:
        kind: bars
        bars:
        - label: Primary jobs
          value: 45
        - label: Secondary jobs
          value: 25
        - label: Tertiary jobs
          value: 30
        unit: '% of workers (approx.)'
        alt: Roughly 45% of workers are in the primary sector, 25% in secondary and 30% in tertiary.
      check:
        prompt: Which sector employs the most people in India?
        options:
        - Primary (agriculture)
        - Secondary
        - Tertiary
        answer: Primary (agriculture)
        why: Nearly half of workers are in farming and related work.
    - teach: Small producers can join cooperatives, like Amul for dairy farmers, or self-help groups of about 10–20 women who pool savings and give small loans to members. Together they buy machines, get credit and sell at better prices.
      check:
        prompt: Why do dairy farmers join a cooperative like Amul?
        options:
        - Together they get better prices and facilities
        - To stop selling milk
        - To work alone
        answer: Together they get better prices and facilities
        why: Pooling milk lets them build plants and bargain together.
  items:
  - prompt: A fisherman's work is in which sector?
    options:
    - Primary
    - Secondary
    - Tertiary
    - None
    answer: Primary
    difficulty: 1
    hints:
    - Taking from nature.
    - Like farming.
    solution: 'Fishing takes directly from nature: primary sector.'
    mistakes: {"Secondary": "s8_primary"}
  - prompt: A teacher's work belongs to which sector?
    options:
    - Tertiary (services)
    - Primary
    - Secondary
    - Mining
    answer: Tertiary (services)
    difficulty: 1
    hints:
    - No goods are made.
    - A service.
    solution: 'Teaching is a service: tertiary sector.'
    mistakes: {"Secondary": "s8_tertiary"}
  - prompt: Which is a secondary-sector activity?
    options:
    - Making steel in a factory
    - Growing rice
    - Banking
    - Catching fish
    answer: Making steel in a factory
    difficulty: 1
    hints:
    - Manufacturing.
    - Raw material into goods.
    solution: Manufacturing steel is secondary.
    mistakes: {"Growing rice": "s8_secondary", "Banking": "s8_secondary"}
  - prompt: What is a self-help group?
    options:
    - A small group that pools savings and helps members start work
    - A government office
    - A large company
    - A school club
    answer: A small group that pools savings and helps members start work
    difficulty: 2
    hints:
    - Often women in villages.
    - Kudumbashree.
    solution: Members save together and give small loans to one another for livelihoods.
    mistakes: {"A large company": "s8_shg"}
  - prompt: Which sector employs the largest number of people in India?
    options:
    - Agriculture (primary)
    - IT services
    - Banking
    - Car manufacturing
    answer: Agriculture (primary)
    difficulty: 2
    hints:
    - Villages.
    - Farming.
    solution: Agriculture still employs the most people in India.
    mistakes: {"IT services": "s8_agri_jobs"}
  - prompt: Why do cooperatives help small farmers?
    options:
    - They pool resources to buy machines and sell at better prices
    - They take land away
    - They stop farming
    - They only help big companies
    answer: They pool resources to buy machines and sell at better prices
    difficulty: 2
    hints:
    - Strength in numbers.
    - Amul.
    solution: Pooling lets small producers share costs and bargain for fairer prices.
    mistakes: {"They take land away": "s8_coop"}
  - prompt: A coal miner works in which sector?
    options:
    - Primary
    - Secondary
    - Tertiary
    answer: Primary
    difficulty: 1
    hints:
    - Coal is taken straight from nature.
    - Is anything made or served?
    solution: 'Mining takes resources directly from nature: primary sector.'
    mistakes:
      Secondary: s8f_sector_test
      Tertiary: s8f_sector_test
  - prompt: A worker building a bridge is in which sector?
    options:
    - Secondary
    - Primary
    - Tertiary
    answer: Secondary
    difficulty: 2
    hints:
    - Construction makes something new.
    - It is not taken straight from nature.
    solution: Construction belongs to the secondary sector.
    mistakes:
      Primary: s8f_sector_test
      Tertiary: s8f_sector_test
  - prompt: A doctor treating patients is in which sector?
    options:
    - Tertiary
    - Secondary
    - Primary
    answer: Tertiary
    difficulty: 1
    hints:
    - Is something grown, made or done for people?
    - Health care is a service.
    solution: 'Doctors provide a service: tertiary sector.'
    mistakes:
      Secondary: s8_tertiary
      Primary: s8_tertiary
  - prompt: Turning sugarcane into sugar in a mill is which sector?
    options:
    - Secondary
    - Primary
    - Tertiary
    answer: Secondary
    difficulty: 2
    hints:
    - Growing the cane is one sector; processing it is another.
    - A mill is a factory.
    solution: Processing a raw material into a good is secondary.
    mistakes:
      Primary: s8f_sector_test
      Tertiary: s8f_sector_test
  - prompt: Which sector produces the largest share of India's income?
    options:
    - Tertiary (services)
    - Primary
    - Secondary
    answer: Tertiary (services)
    difficulty: 2
    hints:
    - It is not the sector with the most workers.
    - Think of IT, banking and trade.
    solution: Services now produce over half of India's income.
    mistakes:
      Primary: s8f_income
      Secondary: s8f_income
  - prompt: Fifteen women each save ₹100 a month in a self-help group. How much does the group save in a month?
    answer: '1500'
    check: 15*100
    difficulty: 1
    hints:
    - Each woman adds the same amount.
    - Multiply the number of women by the saving.
    solution: 15 × ₹100 = ₹1500 a month, which can be lent to members.
    mistakes:
      '115': s8f_multiply
  - prompt: Why can a cooperative buy a costly milk-chilling plant that one farmer cannot?
    options:
    - Many members share the cost
    - The government gives every farmer one free
    - Milk needs no cooling
    answer: Many members share the cost
    difficulty: 2
    hints:
    - Think of pooling.
    - Divide a big cost among many.
    solution: When many farmers pool money, a big machine becomes affordable.
    mistakes:
      The government gives every farmer one free: s8f_pool
      Milk needs no cooling: s8f_pool
  - prompt: 'Growing cotton, spinning it into yarn and selling shirts in a shop: which step is primary?'
    options:
    - Growing cotton
    - Spinning yarn
    - Selling shirts
    answer: Growing cotton
    difficulty: 2
    hints:
    - Primary takes straight from nature.
    - Which step happens on a farm?
    solution: Growing cotton is primary; spinning is secondary; selling is tertiary.
    mistakes:
      Spinning yarn: s8_primary
      Selling shirts: s8_primary
  - prompt: A bank giving loans to farmers belongs to which sector?
    options:
    - Tertiary
    - Primary
    - Secondary
    answer: Tertiary
    difficulty: 2
    hints:
    - The bank does not grow or make anything.
    - It provides a service to the farmers.
    solution: Banking is a service, even when it helps farming.
    mistakes:
      Primary: s8_tertiary
      Secondary: s8_tertiary
