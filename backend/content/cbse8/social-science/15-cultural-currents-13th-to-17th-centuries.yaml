    difficulty: 2
    hints:
    - Both rejected barriers between people.
    - Both stressed devotion.
    solution: Both stressed devotion and the equality of all people.
    mistakes:
      Strict caste rules: s8k_message
      Long, costly rituals: s8k_message
  - prompt: Purandaradasa composed songs in which language?
    options:
    - Kannada
