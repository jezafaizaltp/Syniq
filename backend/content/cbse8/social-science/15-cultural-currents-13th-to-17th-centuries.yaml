- code: cbse8ss.culture.arts
  title: Arts, learning and science of the period
  after:
  - cbse8ss.culture.bhakti
  notes: |
    Music developed into Hindustani (north; dhrupad refined by Raja Man Singh Tomar; Tansen at Akbar's court)
    and Carnatic (south) traditions. Miniature paintings flourished in Mughal and Rajput styles. Mughals laid
    charbagh (four-part) gardens. Languages grew: Urdu developed from Hindavi with Persian and Arabic words,
    and Dakhini in the Deccan. In Kerala, Madhava of Sangamagrama founded a school of astronomy and
    mathematics that worked out infinite series; Nilakantha Somayaji refined planetary models. Crafts like
    Banarasi brocade and Kashmiri Pashmina were prized worldwide. Foods such as samosa and jalebi came from
    Persian and Arab cuisines and became Indian.
  explanations:
    text: Despite wars, this was a time of creativity. Musicians like Tansen, painters of tiny detailed miniatures, gardens laid out in four parts, new languages like Urdu, and brilliant mathematicians in Kerala all shaped Indian culture. Even foods like samosa and jalebi arrived and became our own.
    visual: Draw a four-part charbagh garden with water channels crossing in the middle. Around it place a miniature painting, a tanpura for music, a Banarasi sari, and a page of Kerala mathematics.
    step_by_step: 'Step 1: Music: Hindustani in the north, Carnatic in the south. Step 2: Painting: Mughal and Rajput miniatures. Step 3: Language: Urdu and Dakhini grow. Step 4: Science: the Kerala school of mathematics. Step 5: Crafts and food mix Persian and Indian traditions.'
    real_world: Madhava of Sangamagrama in 14th-century Kerala found ways to calculate π using infinite series, centuries before similar results appeared in Europe.
  picture:
    kind: flow
    steps:
    - 'Music: Hindustani and Carnatic traditions'
    - 'Painting: Mughal and Rajput miniatures'
    - 'Gardens: Mughal charbagh'
    - 'Language: Urdu and Dakhini'
    - 'Science: Kerala school of mathematics'
    alt: Cultural achievements of the 13th to 17th centuries in music, painting, gardens, language and science.
  items:
