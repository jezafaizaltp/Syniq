  - prompt: 'Assertion (A): Bhakti saints taught that people of high caste are closer to God.

      Reason (R): Bhakti saints valued love and devotion above rituals.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: they taught that caste makes no one higher or lower. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A poet of the 15th century sings two-line verses in the everyday language of the bazaar. The verses laugh at people, Hindu and Muslim alike, who perform rituals without love in their hearts. Who is the poet, and what are the verses called?'
    options:
    - Kabir; dohas
    - Mirabai; songs to Krishna
    - Amir Khusrau; qawwalis
    answer: Kabir; dohas
    hints:
    - Who mocked empty ritual in both Hinduism and Islam?
    - What is a two-line verse called?
    solution: Kabir's dohas, short two-line poems, mocked empty ritual in both Hinduism and Islam.
