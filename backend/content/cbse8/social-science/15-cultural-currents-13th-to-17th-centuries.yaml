- code: cbse8ss.culture.arts
  title: Arts, learning and science of the period
  after:
  - cbse8ss.culture.bhakti
  notes: |
    Music developed into Hindustani (north; dhrupad refined by Raja Man Singh Tomar; Tansen at Akbar's court)
    and Carnatic (south) traditions. Miniature paintings flourished in Mughal and Rajput styles. Mughals laid
    charbagh (four-part) gardens. Languages grew: Urdu developed from Hindavi with Persian and Arabic words,
    and Dakhini in the Deccan. In Kerala, Madhava of Sangamagrama founded a school of astronomy and
    mathematics that worked out infinite series; Nilakantha Somayaji refined planetary models. Crafts like
    Banarasi brocade and Kashmiri Pashmina were prized worldwide. Foods such as samosa and jalebi came from
    Persian and Arab cuisines and became Indian.
  explanations:
    text: Despite wars, this was a time of creativity. Musicians like Tansen, painters of tiny detailed miniatures, gardens laid out in four parts, new languages like Urdu, and brilliant mathematicians in Kerala all shaped Indian culture. Even foods like samosa and jalebi arrived and became our own.
    visual: Draw a four-part charbagh garden with water channels crossing in the middle. Around it place a miniature painting, a tanpura for music, a Banarasi sari, and a page of Kerala mathematics.
    step_by_step: 'Step 1: Music: Hindustani in the north, Carnatic in the south. Step 2: Painting: Mughal and Rajput miniatures. Step 3: Language: Urdu and Dakhini grow. Step 4: Science: the Kerala school of mathematics. Step 5: Crafts and food mix Persian and Indian traditions.'
    real_world: Madhava of Sangamagrama in 14th-century Kerala found ways to calculate π using infinite series, centuries before similar results appeared in Europe.
  picture:
    kind: flow
    steps:
    - 'Music: Hindustani and Carnatic traditions'
    - 'Painting: Mughal and Rajput miniatures'
    - 'Gardens: Mughal charbagh'
    - 'Language: Urdu and Dakhini'
    - 'Science: Kerala school of mathematics'
    alt: Cultural achievements of the 13th to 17th centuries in music, painting, gardens, language and science.
  activity:
    type: sort
    prompt: Who or what?
    bins:
    - Tansen
    - Madhava of Sangamagrama
    - Miniature painting
    - Urdu
    items:
    - label: Singer at Akbar's court
      bin: Tansen
      clue: Hindustani music.
      why: Tansen.
    - label: Infinite series in Kerala
      bin: Madhava of Sangamagrama
      clue: Kerala school.
      why: Madhava.
    - label: Mughal and Rajput small paintings
      bin: Miniature painting
      clue: Fine detail.
      why: Miniatures.
    - label: Hindavi with Persian and Arabic words
      bin: Urdu
      clue: A language.
      why: Urdu.
  lesson:
    - teach: Indian music grew into two great traditions. Hindustani music in the north grew at royal courts; Raja Man Singh Tomar of Gwalior refined dhrupad, and Tansen sang at Akbar's court. Carnatic music in the south grew from temple and devotional songs.
      picture:
        kind: compare
        columns:
        - title: Hindustani (north)
          points:
          - Royal courts
          - Dhrupad, Man Singh Tomar
          - Tansen at Akbar's court
        - title: Carnatic (south)
          points:
          - Temple and devotional songs
          - Purandaradasa
        alt: Hindustani music grew at northern courts with Tansen; Carnatic music grew from southern devotional songs with Purandaradasa.
      check:
        prompt: Which music tradition is from the south?
        options:
        - Carnatic
        - Hindustani
        - Qawwali
        answer: Carnatic
        why: Carnatic music belongs to South India.
    - teach: 'Mughal and Rajput painters made miniatures: small, detailed paintings in books and albums. Mughals laid out charbagh gardens in four parts, divided by water channels. Urdu grew from Hindavi with Persian and Arabic words; Dakhini grew in the Deccan.'
      check:
        prompt: Why is a charbagh garden called 'char'?
        options:
        - It is divided into four parts
        - It has char (burnt) trees
        - It has four gates only
        answer: It is divided into four parts
        why: '''Char'' means four.'
    - teach: In Kerala, Madhava of Sangamagrama (around 1340–1425) started a school of astronomy and mathematics that found infinite series for π and sine, about 250 years before Europe. Nilakantha Somayaji improved models of the planets. Banarasi brocade and Kashmiri Pashmina shawls were prized worldwide, and samosa and jalebi came from Persian and Arab kitchens and became Indian.
      check:
        prompt: What did the Kerala school of mathematics discover?
        options:
        - Infinite series for π and sine
        - The steam engine
        - Gunpowder
        answer: Infinite series for π and sine
        why: Madhava found these series long before European mathematicians.
