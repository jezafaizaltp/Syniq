    - teach: Kabir's dohas mocked empty ritual in both Hinduism and Islam. Guru Nanak founded Sikhism; his hymns are in the Guru Granth Sahib. Mirabai, a Rajput princess, sang to Krishna. Chaitanya spread kirtan in Bengal and Odisha; Tukaram, Namdev and Dnyaneshwar sang in Maharashtra; Purandaradasa in Karnataka is called the father of Carnatic music.
