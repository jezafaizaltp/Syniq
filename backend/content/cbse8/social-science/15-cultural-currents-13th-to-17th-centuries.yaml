    alt: Bhakti saints like Kabir, Ravidas, Guru Nanak, Mirabai, Tukaram and Purandaradasa, and Sufi saints and poets like Moinuddin Chishti, Nizamuddin Auliya and Amir Khusrau.
    caption: Devotion, equality and music in people's languages.
