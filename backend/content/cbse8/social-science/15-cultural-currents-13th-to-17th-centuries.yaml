    - Water channels.
    solution: A charbagh is a four-part Persian-style garden.
  - prompt: Which language grew from Hindavi with many Persian and Arabic words?
    options:
    - Urdu
    - Tamil
    - Sanskrit
    - Bengali
    answer: Urdu
    difficulty: 2
    hints:
    - Written in Perso-Arabic script.
    - U...
    solution: Urdu developed from Hindavi with Persian and Arabic vocabulary.
  - prompt: Who founded the Kerala school of astronomy and mathematics?
    options:
    - Madhava of Sangamagrama
    - Aryabhata
    - Brahmagupta
    - Bhaskara II
    answer: Madhava of Sangamagrama
    difficulty: 3
    hints:
    - 14th century.
    - Infinite series.
    solution: Madhava founded the Kerala school in the 14th century.
  - prompt: Mughal and Rajput painters were famous for which kind of painting?
    options:
