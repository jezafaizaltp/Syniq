concepts:
- code: cbse8ss.culture.bhakti
  title: Bhakti and Sufi traditions
  notes: |
    Between the 13th and 17th centuries, Bhakti saints taught personal devotion to God over rituals and
    rejected caste barriers, composing in people's own languages: Kabir (dohas criticising empty ritual in
    both Hinduism and Islam), Ravidas, Guru Nanak (founder of Sikhism; his hymns are in the Guru Granth Sahib),
    Mirabai (Rajasthan), Chaitanya Mahaprabhu (Bengal and Odisha), Tukaram, Namdev and Dnyaneshwar
    (Maharashtra), Purandaradasa (Karnataka, 'father of Carnatic music'). Sufis were Islamic mystics who
    stressed love of God and service: Khwaja Moinuddin Chishti (Ajmer), Nizamuddin Auliya (Delhi). Amir Khusrau
    shaped qawwali; Dara Shikoh translated the Upanishads into Persian.
  explanations:
    text: 'In this period many saints taught that loving God mattered more than rituals or caste. They sang in everyday languages so everyone could understand: Kabir, Guru Nanak, Mirabai, Tukaram and many more. Sufi saints spread a similar message of love from their dargahs, and music like qawwali grew from these meetings.'
    visual: 'Draw a map of India with saints placed in their regions: Kabir in Varanasi, Guru Nanak in Punjab, Mirabai in Rajasthan, Chaitanya in Bengal, Tukaram in Maharashtra, Purandaradasa in Karnataka, and Sufi dargahs at Ajmer and Delhi.'
    step_by_step: 'Step 1: Bhakti means devotion. Step 2: Saints rejected caste barriers and empty rituals. Step 3: They wrote in local languages. Step 4: Sufis, Islamic mystics, spread love and service. Step 5: Both shaped poetry, music and ideas of harmony.'
    real_world: 'Kabir''s dohas, two-line verses in simple Hindi, are still quoted in daily life, for example: ''Bura jo dekhan main chala, bura na milya koi'', about finding fault in oneself rather than others.'
  picture:
    kind: compare
    columns:
    - title: Bhakti saints
      points:
      - Kabir, Ravidas
      - Guru Nanak
      - Mirabai
      - Tukaram, Namdev
      - Purandaradasa
    - title: Sufi saints and poets
      points:
      - Moinuddin Chishti (Ajmer)
      - Nizamuddin Auliya (Delhi)
      - Amir Khusrau (qawwali)
    alt: Bhakti saints like Kabir, Ravidas, Guru Nanak, Mirabai, Tukaram and Purandaradasa, and Sufi saints and poets like Moinuddin Chishti, Nizamuddin Auliya and Amir Khusrau.
    caption: Devotion, equality and music in people's languages.
  activity:
    type: sort
    prompt: Bhakti saint or Sufi?
    bins:
    - Bhakti
    - Sufi
    items:
    - label: Kabir
      bin: Bhakti
      clue: Dohas against empty ritual.
      why: Bhakti.
    - label: Mirabai
      bin: Bhakti
      clue: Rajasthan.
      why: Bhakti.
    - label: Moinuddin Chishti
      bin: Sufi
      clue: Ajmer.
      why: Sufi.
    - label: Nizamuddin Auliya
      bin: Sufi
      clue: Delhi.
      why: Sufi.
    - label: Tukaram
      bin: Bhakti
      clue: Maharashtra.
      why: Bhakti.
  lesson:
    - teach: From the 13th to the 17th century, Bhakti saints taught that love and devotion to God matter more than rituals, and that caste does not make anyone higher or lower. They sang in people's own languages, so ordinary people could understand.
      check:
        prompt: Why did Bhakti saints compose in local languages?
        options:
        - So ordinary people could understand
        - So only priests could read
        - To hide their message
        answer: So ordinary people could understand
        why: Songs in Hindi, Marathi, Kannada or Punjabi reached everyone.
      ways:
      - style: visual
        teach: What the Bhakti saints set aside, and what they put in its place.
        picture:
          kind: compare
          columns:
          - title: Set aside
            points:
            - Ritual for its own sake
            - Caste as a mark of high or low
            - Languages only scholars knew
          - title: Put in its place
            points:
            - Love and devotion to God
            - No one higher or lower by birth
            - Songs in the people's own languages
          alt: Bhakti saints set aside empty ritual, caste ranking and scholars' languages, and put in their place devotion to God, equality and songs in the people's own languages.
      - style: real_world
        teach: Every year lakhs of pilgrims called Warkaris walk to Pandharpur in Maharashtra, singing abhangs composed by Tukaram and Dnyaneshwar hundreds of years ago. The Bhakti saints' songs are still on people's lips.
    - teach: Kabir's dohas mocked empty ritual in both Hinduism and Islam. Guru Nanak founded Sikhism; his hymns are in the Guru Granth Sahib. Mirabai, a Rajput princess, sang to Krishna. Chaitanya spread kirtan in Bengal and Odisha; Tukaram, Namdev and Dnyaneshwar sang in Maharashtra; Purandaradasa in Karnataka is called the father of Carnatic music.
      picture:
        kind: compare
        columns:
        - title: Saint
          points:
          - Kabir
          - Guru Nanak
          - Mirabai
          - Chaitanya
          - Tukaram
          - Purandaradasa
        - title: Region
          points:
          - Varanasi (north)
          - Punjab
          - Rajasthan
          - Bengal, Odisha
          - Maharashtra
          - Karnataka
        alt: 'Bhakti saints and their regions: Kabir in Varanasi, Guru Nanak in Punjab, Mirabai in Rajasthan, Chaitanya in Bengal and Odisha, Tukaram in Maharashtra, Purandaradasa in Karnataka.'
      check:
        prompt: Which saint is linked with Maharashtra?
        options:
        - Tukaram
        - Chaitanya
        - Mirabai
        answer: Tukaram
        why: Tukaram's abhangs are sung in Marathi.
      ways:
      - style: step_by_step
        teach: 'Step 1: North: Kabir with his dohas, and Guru Nanak, founder of Sikhism. Step 2: West: Mirabai in Rajasthan; Tukaram, Namdev and Dnyaneshwar in Maharashtra. Step 3: East: Chaitanya''s kirtans in Bengal and Odisha. Step 4: South: Purandaradasa in Karnataka, the father of Carnatic music.'
      - style: real_world
        teach: In the langar, the free kitchen of every gurdwara, anyone may eat, and all sit together in rows on the floor whatever their caste, faith or wealth. It is Guru Nanak's teaching of equality put into practice every day.
    - teach: Sufis were Muslim mystics who taught love of God and service to all. Khwaja Moinuddin Chishti's dargah is in Ajmer and Nizamuddin Auliya's in Delhi. Amir Khusrau, Nizamuddin's disciple, shaped qawwali. Later, Dara Shikoh translated the Upanishads into Persian.
      check:
        prompt: Whose disciple was Amir Khusrau?
        options:
        - Nizamuddin Auliya
        - Guru Nanak
        - Tukaram
        answer: Nizamuddin Auliya
        why: Khusrau was a devoted follower of the Delhi Sufi saint.
      ways:
      - style: visual
        teach: Three names from the Sufi tradition; later the prince Dara Shikoh translated the Upanishads into Persian.
        picture:
          kind: compare
          columns:
          - title: Moinuddin Chishti
            points:
            - Sufi saint
            - Dargah in Ajmer
          - title: Nizamuddin Auliya
            points:
            - Sufi saint
            - Dargah in Delhi
          - title: Amir Khusrau
            points:
            - Nizamuddin's disciple
            - Shaped qawwali
          alt: Moinuddin Chishti's dargah is in Ajmer, Nizamuddin Auliya's is in Delhi, and Amir Khusrau, Nizamuddin's disciple, shaped qawwali.
      - style: real_world
        teach: Qawwals still sing in the courtyard of Nizamuddin's dargah in Delhi, and people of every faith visit the dargah at Ajmer. The Sufi message of love and service still draws crowds after seven hundred years.
  items:
  - prompt: What did Bhakti saints stress?
    options:
    - Personal devotion to God over rituals and caste
    - Building big forts
    - Wars of conquest
    - Only Sanskrit prayers
    answer: Personal devotion to God over rituals and caste
    difficulty: 1
    hints:
    - Bhakti means devotion.
    - Equality.
    solution: Bhakti saints valued sincere devotion and rejected caste barriers.
    mistakes: {"Only Sanskrit prayers": "s8_bhakti"}
  - prompt: Whose hymns are compiled in the Guru Granth Sahib, along with others?
    options:
    - Guru Nanak
    - Tulsidas
    - Mirabai
    - Amir Khusrau
    answer: Guru Nanak
    difficulty: 1
    hints:
    - Founder of Sikhism.
    - Punjab.
    solution: Guru Nanak's hymns are in the Guru Granth Sahib.
    mistakes: {"Tulsidas": "s8_nanak"}
  - prompt: Who is called the father of Carnatic music?
    options:
    - Purandaradasa
    - Tansen
    - Amir Khusrau
    - Kabir
    answer: Purandaradasa
    difficulty: 2
    hints:
    - Karnataka.
    - 15th–16th century.
    solution: Purandaradasa is known as the father of Carnatic music.
    mistakes: {"Tansen": "s8_purandaradasa"}
  - prompt: Where is the dargah of Khwaja Moinuddin Chishti?
    options:
    - Ajmer
    - Delhi
    - Agra
    - Lahore
    answer: Ajmer
    difficulty: 2
    hints:
    - Rajasthan.
    - A famous Sufi shrine.
    solution: Moinuddin Chishti's dargah is at Ajmer.
    mistakes: {"Delhi": "s8_ajmer"}
  - prompt: Which poet is credited with developing qawwali?
    options:
    - Amir Khusrau
    - Kabir
    - Surdas
    - Tukaram
    answer: Amir Khusrau
    difficulty: 2
    hints:
    - A disciple of Nizamuddin Auliya.
    - 13th–14th century.
    solution: Amir Khusrau shaped qawwali music.
    mistakes: {"Kabir": "s8_khusrau"}
  - prompt: Which saint-poet was a princess from Rajasthan devoted to Krishna?
    options:
    - Mirabai
    - Razia Sultan
    - Ahilyabai
    - Akka Mahadevi
    answer: Mirabai
    difficulty: 1
    hints:
    - Mewar.
    - Bhajans to Krishna.
    solution: Mirabai, a Rajput princess, sang devotional songs to Krishna.
    mistakes: {"Akka Mahadevi": "s8_mirabai"}
  - prompt: Which saint spread devotional kirtan in Bengal and Odisha?
    options:
    - Chaitanya Mahaprabhu
    - Tukaram
    - Purandaradasa
    answer: Chaitanya Mahaprabhu
    difficulty: 2
