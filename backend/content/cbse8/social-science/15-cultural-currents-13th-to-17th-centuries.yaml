  s8_banaras: "Pashmina comes from Kashmir and blue pottery from Jaipur. Think of what Banaras weavers make on their looms."
  s8_bhakti: "Bhakti means devotion. What did saints put above ritual?"
  s8_charbagh: "'Char' means four and 'bagh' means garden."
  s8_khusrau: "Qawwali came from Sufi music in Delhi. Which poet was a disciple of Nizamuddin Auliya?"
  s8_madhava: "Aryabhata lived about a thousand years earlier. Who led the Kerala school?"
  s8_miniature: "Mughal and Rajput paintings were tiny and detailed."
  s8_mirabai: "Akka Mahadevi was a Kannada saint devoted to Shiva. Which Rajput princess sang for Krishna?"
  s8_nanak: "The Guru Granth Sahib is the Sikh holy book. Whose hymns does it start with?"
  s8_purandaradasa: "Tansen was a Hindustani musician. Who shaped Carnatic music in the south?"
