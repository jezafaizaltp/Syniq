    - He danced and sang in praise of Krishna in the east.
    - Tukaram was in Maharashtra.
    solution: Chaitanya led group singing of Krishna's name in Bengal and Puri.
    mistakes:
      Tukaram: s8k_region
      Purandaradasa: s8k_region
  - prompt: 'Kabir''s short two-line poems are called:'
    options:
    - Dohas
    - Ghazals
    - Abhangs
    answer: Dohas
    difficulty: 2
    hints:
    - '''Do'' means two.'
    - Abhangs are Marathi songs.
    solution: Kabir's dohas are two-line verses that question ritual.
    mistakes:
      Ghazals: s8k_message
      Abhangs: s8k_region
  - prompt: Where is Nizamuddin Auliya's dargah?
    options:
    - Delhi
    - Ajmer
    - Pune
    answer: Delhi
    difficulty: 1
    hints:
    - A neighbourhood of the capital is named after him.
    - Ajmer has Moinuddin Chishti's dargah.
    solution: Nizamuddin Auliya's dargah is in Delhi.
    mistakes:
      Ajmer: s8k_sufi_place
      Pune: s8k_sufi_place
  - prompt: What did Kabir criticise?
    options:
    - Empty rituals in both Hinduism and Islam
    - Singing songs
    - Loving God
    answer: Empty rituals in both Hinduism and Islam
    difficulty: 1
    hints:
    - He wanted inner devotion.
    - He spoke to Hindus and Muslims alike.
    solution: Kabir mocked ritual without true feeling, in both religions.
    mistakes:
      Singing songs: s8k_message
      Loving God: s8k_message
  - prompt: Which faith did Guru Nanak found?
    options:
