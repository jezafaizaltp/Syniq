concepts:
- code: cbse8ss.culture.bhakti
  title: Bhakti and Sufi traditions
  notes: |
    Between the 13th and 17th centuries, Bhakti saints taught personal devotion to God over rituals and
    rejected caste barriers, composing in people's own languages: Kabir (dohas criticising empty ritual in
    both Hinduism and Islam), Ravidas, Guru Nanak (founder of Sikhism; his hymns are in the Guru Granth Sahib),
    Mirabai (Rajasthan), Chaitanya Mahaprabhu (Bengal and Odisha), Tukaram, Namdev and Dnyaneshwar
    (Maharashtra), Purandaradasa (Karnataka, 'father of Carnatic music'). Sufis were Islamic mystics who
    stressed love of God and service: Khwaja Moinuddin Chishti (Ajmer), Nizamuddin Auliya (Delhi). Amir Khusrau
    shaped qawwali; Dara Shikoh translated the Upanishads into Persian.
  explanations:
    text: 'In this period many saints taught that loving God mattered more than rituals or caste. They sang in everyday languages so everyone could understand: Kabir, Guru Nanak, Mirabai, Tukaram and many more. Sufi saints spread a similar message of love from their dargahs, and music like qawwali grew from these meetings.'
    visual: 'Draw a map of India with saints placed in their regions: Kabir in Varanasi, Guru Nanak in Punjab, Mirabai in Rajasthan, Chaitanya in Bengal, Tukaram in Maharashtra, Purandaradasa in Karnataka, and Sufi dargahs at Ajmer and Delhi.'
    step_by_step: 'Step 1: Bhakti means devotion. Step 2: Saints rejected caste barriers and empty rituals. Step 3: They wrote in local languages. Step 4: Sufis, Islamic mystics, spread love and service. Step 5: Both shaped poetry, music and ideas of harmony.'
    real_world: 'Kabir''s dohas, two-line verses in simple Hindi, are still quoted in daily life, for example: ''Bura jo dekhan main chala, bura na milya koi'', about finding fault in oneself rather than others.'
