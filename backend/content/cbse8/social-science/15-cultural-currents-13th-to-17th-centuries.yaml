# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 15 (Part 2 chapter 8). Format: content/README.md.
subject: cbse8-ss
chapter: 15
title: 'Cultural Currents: 13th to 17th Centuries'
tips:
