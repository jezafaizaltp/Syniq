# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 1. Format: content/README.md.
subject: cbse8-ss
chapter: 1
title: Natural Resources and Their Use
concepts:
- code: cbse8ss.res.types
  title: Kinds of natural resources
  notes: |
    A resource is anything that meets our needs and has value. Natural resources come from nature: air,
    water, soil, forests, minerals, sunlight. Renewable resources are replenished naturally within a human
    lifetime (sunlight, wind, water, forests if used wisely); non-renewable ones take millions of years to
    form and can run out (coal, petroleum, natural gas, minerals). Resources are unevenly distributed across
    the world because of differences in climate, landforms and geology, which leads to trade.
  explanations:
    text: 'Natural resources are gifts of nature that we use: water, soil, forests, minerals, sunlight. Some, like sunlight and wind, renew themselves; others, like coal and oil, took millions of years to form and will run out if we keep using them up.'
    visual: Draw two baskets. In the 'renewable' basket put the Sun, wind, water and trees; in the 'non-renewable' basket put coal, oil, natural gas and iron ore, with a clock showing 'millions of years'.
    step_by_step: 'Step 1: Ask whether nature replaces it quickly. Step 2: If yes (sunlight, wind, water), it is renewable. Step 3: If it takes millions of years (coal, oil, minerals), it is non-renewable. Step 4: Remember even renewable resources can be harmed by overuse or pollution.'
    real_world: Jharkhand and Odisha are rich in coal and iron ore, while Rajasthan and Gujarat have strong sunshine and wind, so India's resources differ from region to region.
  picture:
    kind: compare
    columns:
    - title: Renewable
      points:
      - Sunlight
      - Wind
      - Water
      - Forests (if replanted)
    - title: Non-renewable
      points:
      - Coal
      - Petroleum
      - Natural gas
      - Minerals like iron ore
    alt: Renewable resources like sunlight, wind, water and forests renew themselves; non-renewable ones like coal, petroleum, gas and minerals can run out.
    caption: Can nature replace it within a lifetime?
  items:
  - prompt: Which is a renewable resource?
    options:
    - Solar energy
    - Coal
    - Petroleum
    - Natural gas
    answer: Solar energy
    difficulty: 1
    hints:
    - Which won't run out?
    - The Sun shines every day.
    solution: Sunlight is renewed constantly; the others are fossil fuels.
  - prompt: Why is coal called non-renewable?
    options:
    - It takes millions of years to form
    - It is black
    - It is found underground
    - It burns easily
    answer: It takes millions of years to form
    difficulty: 1
    hints:
    - Think about how long nature takes.
    - From ancient plants.
    solution: Coal formed over millions of years, far slower than we use it.
  - prompt: Why are resources unevenly spread across the world?
    options:
    - Differences in climate, landforms and rocks
    - People moved them
    - Only rich countries have them
    - Resources move every year
    answer: Differences in climate, landforms and rocks
    difficulty: 2
    hints:
    - Nature varies from place to place.
    - Deserts vs rainforests.
    solution: Physical differences in climate, relief and geology decide where resources occur.
  - prompt: 'Forests are renewable, but only if:'
    options:
    - Trees are replanted as fast as they are cut
    - They are cut quickly
    - They are left to burn
    - No animals live there
    answer: Trees are replanted as fast as they are cut
    difficulty: 2
    hints:
    - Renewable needs time to recover.
    - Balance cutting and growing.
    solution: Forests renew only if use doesn't exceed regrowth.
  - prompt: Which makes something a resource?
    options:
    - It is useful and has value to people
    - It is found underground
    - It is expensive
    - It is made in factories
    answer: It is useful and has value to people
    difficulty: 1
    hints:
    - Water was always there; it is a resource because we use it.
    - Usefulness.
    solution: Anything that meets our needs and has value is a resource.
  - prompt: Which is a natural resource?
    options:
    - Soil
    - A plastic bottle
    - A car
    - A computer
    answer: Soil
    difficulty: 1
    hints:
    - Not made by people.
    - From nature.
    solution: Soil comes from nature; the others are made by people.
- code: cbse8ss.res.conserve
  title: Using resources wisely
  after:
  - cbse8ss.res.types
  notes: |
    Conservation means using resources carefully so they last. Sustainable development meets today's needs
    without harming the ability of future generations to meet theirs. Ways to conserve: reduce, reuse,
    recycle; rainwater harvesting; switching to renewable energy; afforestation; protecting soil from erosion
    with terracing and shelter belts. Traditional Indian practices like sacred groves, johads and stepwells
    show long-standing care for resources.
  explanations:
    text: 'Conserving resources means using them so that there is enough for us and for people in the future. Simple habits help: switch off lights, fix leaking taps, reuse bags and recycle paper. Communities also harvest rainwater and plant trees.'
    visual: Draw three arrows in a circle labelled reduce, reuse, recycle around a water drop and a lump of coal, with a child in the future smiling because some is left.
    step_by_step: 'Step 1: Reduce: use less in the first place. Step 2: Reuse: use things again. Step 3: Recycle: turn waste into new things. Step 4: Choose renewable energy and save water.'
    real_world: In Rajasthan, the Tarun Bharat Sangh helped villages revive small earthen dams called johads to catch rainwater, and several dried-up rivers began to flow again.
  picture:
    kind: flow
    steps:
    - 'Reduce: use less'
    - 'Reuse: use again'
    - 'Recycle: make something new'
    - Save water and energy
    - Resources last for the future
    alt: 'Ways to conserve resources: reduce, reuse, recycle and save water and energy so resources last for future generations.'
  items:
  - prompt: What does sustainable development mean?
    options:
    - Meeting today's needs without harming future generations
    - Using resources as fast as possible
    - Never using any resources
    - Only building factories
    answer: Meeting today's needs without harming future generations
    difficulty: 1
    hints:
    - Think about the future.
    - Balance.
    solution: Sustainable development balances present needs with those of future generations.
  - prompt: Which is an example of reuse?
    options:
    - Using a glass jar to store spices
    - Burning plastic
    - Throwing paper away
    - Buying a new bag every day
    answer: Using a glass jar to store spices
    difficulty: 1
    hints:
    - Using the same thing again.
    - No new material.
    solution: Using the jar again for something else is reuse.
  - prompt: What is rainwater harvesting?
    options:
    - Collecting and storing rainwater for later use
    - Stopping rain from falling
    - Draining rainwater to the sea
    - Watering plants during rain
    answer: Collecting and storing rainwater for later use
    difficulty: 1
    hints:
    - Harvest means collect.
    - Tanks and pits.
    solution: Rainwater harvesting collects rain in tanks or recharges the ground.
  - prompt: Why are terraces cut on hill slopes?
    options:
    - To slow water and reduce soil erosion
    - To make roads
    - To increase landslides
    - To build houses
    answer: To slow water and reduce soil erosion
    difficulty: 2
    hints:
    - Steps on a slope.
    - Water runs more slowly.
    solution: Terraces slow running water so it doesn't wash soil away.
  - prompt: What are sacred groves?
    options:
    - Patches of forest protected by communities for religious reasons
    - Parks in cities
    - Fruit farms
    - Tree nurseries
    answer: Patches of forest protected by communities for religious reasons
    difficulty: 2
    hints:
    - Traditional conservation.
    - Kavu in Kerala.
    solution: Sacred groves are forests that communities protect, preserving biodiversity.
  - prompt: Which saves electricity at home?
    options:
    - Switching off fans and lights when leaving a room
    - Leaving the TV on
    - Opening the fridge often
    - Using old filament bulbs
    answer: Switching off fans and lights when leaving a room
    difficulty: 1
    hints:
    - Use only what you need.
    - Off when not needed.
    solution: Switching off unused appliances saves electricity.
