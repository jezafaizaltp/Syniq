# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 1. Format: content/README.md.
subject: cbse8-ss
chapter: 1
title: Natural Resources and Their Use
tips:
  s8_coal_slow: "Colour and where it is found don't matter. How long does coal take to form?"
  s8_forest_renew: "A forest only comes back if what is cut is replaced. How fast?"
  s8_natural: "Natural resources come from nature, not from factories."
  s8_renewable: "Coal, petroleum and gas run out. Which one comes back every day?"
  s8_resource_value: "Something becomes a resource when people can use it. Is being underground or expensive enough?"
  s8_reuse: "Reuse means using something again for another job, without breaking it down."
  s8_rwh: "Harvesting means collecting. What is done with the rain?"
  s8_sacred_grove: "'Sacred' is about belief. Who protects these forest patches and why?"
  s8_save_power: "Which choice turns something off?"
  s8_sustainable: "Sustainable means it can keep going. Who else needs resources after us?"
  s8_terraces: "Steps on a slope slow down running water. What does that protect?"
  s8_uneven: "Resources come from nature. What about nature differs from place to place?"
  s8r_human_made: Did nature make it, or did people make it from something nature gave?
  s8r_trade: If a country lacks something nature didn't give it, how can it still get it?
  s8r_three_r: Reduce = use less; reuse = use again as it is; recycle = break down and make new.
  s8r_fossil: "Which one is a fossil fuel, made from plants buried for millions of years?"
  s8r_future: Think about who will need the same resource fifty years from now.

concepts:
- code: cbse8ss.res.types
  title: Kinds of natural resources
  notes: |
    A resource is anything that meets our needs and has value. Natural resources come from nature: air,
    water, soil, forests, minerals, sunlight. Renewable resources are replenished naturally within a human
    lifetime (sunlight, wind, water, forests if used wisely); non-renewable ones take millions of years to
    form and can run out (coal, petroleum, natural gas, minerals). Resources are unevenly distributed across
    the world because of differences in climate, landforms and geology, which leads to trade.
  explanations:
    text: 'Natural resources are gifts of nature that we use: water, soil, forests, minerals, sunlight. Some, like sunlight and wind, renew themselves; others, like coal and oil, took millions of years to form and will run out if we keep using them up.'
    visual: Draw two baskets. In the 'renewable' basket put the Sun, wind, water and trees; in the 'non-renewable' basket put coal, oil, natural gas and iron ore, with a clock showing 'millions of years'.
    step_by_step: 'Step 1: Ask whether nature replaces it quickly. Step 2: If yes (sunlight, wind, water), it is renewable. Step 3: If it takes millions of years (coal, oil, minerals), it is non-renewable. Step 4: Remember even renewable resources can be harmed by overuse or pollution.'
    real_world: Jharkhand and Odisha are rich in coal and iron ore, while Rajasthan and Gujarat have strong sunshine and wind, so India's resources differ from region to region.
  picture:
    kind: compare
    columns:
    - title: Renewable
      points:
      - Sunlight
      - Wind
      - Water
      - Forests (if replanted)
    - title: Non-renewable
      points:
      - Coal
      - Petroleum
      - Natural gas
      - Minerals like iron ore
    alt: Renewable resources like sunlight, wind, water and forests renew themselves; non-renewable ones like coal, petroleum, gas and minerals can run out.
    caption: Can nature replace it within a lifetime?
  activity:
    type: sort
    prompt: Renewable or non-renewable?
    bins:
    - Renewable
    - Non-renewable
    items:
    - label: Sunlight
      bin: Renewable
      clue: Every day.
      why: Renewable.
    - label: Wind
      bin: Renewable
      clue: Keeps blowing.
      why: Renewable.
    - label: Coal
      bin: Non-renewable
      clue: Millions of years.
      why: Non-renewable.
    - label: Natural gas
      bin: Non-renewable
      clue: Fossil fuel.
      why: Non-renewable.
    - label: Forests used wisely
      bin: Renewable
      clue: Regrow.
      why: Renewable.
  lesson:
    - teach: 'A resource is anything that meets our needs and has value. Natural resources come straight from nature: air, water, soil, forests, minerals and sunlight. Things people make, like bricks or plastic, are human-made, even if they start from natural materials.'
      check:
        prompt: Which of these is a natural resource?
        options:
        - River water
        - A plastic bottle
        - A brick
        answer: River water
        why: River water comes straight from nature; bottles and bricks are made by people.
    - teach: 'Renewable resources are replaced by nature within a human lifetime: sunlight, wind, flowing water, and forests if we replant them. Non-renewable resources took millions of years to form and can run out: coal, petroleum, natural gas and minerals like iron ore.'
      picture:
        kind: compare
        columns:
        - title: Renewable
          points:
          - Sunlight
          - Wind
          - Flowing water
          - Forests (if replanted)
        - title: Non-renewable
          points:
          - Coal
          - Petroleum
          - Natural gas
          - Iron ore
        alt: Renewable resources like sunlight, wind, water and forests renew themselves; coal, petroleum, gas and iron ore can run out.
      check:
        prompt: Petroleum took millions of years to form. What kind of resource is it?
        options:
        - Non-renewable
        - Renewable
        - Human-made
        answer: Non-renewable
        why: Once used, it will not form again within any human lifetime.
    - teach: Resources are spread unevenly because climate, landforms and rocks differ from place to place. Jharkhand and Odisha have coal and iron ore; Rajasthan and Gujarat have strong sun and wind. Places trade to get what they lack.
      check:
        prompt: Why does a country without oil buy it from other countries?
        options:
        - Resources are unevenly spread, so places trade
        - Oil is renewable
        - Every country has the same resources
        answer: Resources are unevenly spread, so places trade
        why: Nature did not give every place the same resources, so trade fills the gap.
  items:
  - prompt: Which is a renewable resource?
    options:
    - Solar energy
    - Coal
    - Petroleum
    - Natural gas
    answer: Solar energy
    difficulty: 1
    hints:
    - Which won't run out?
    - The Sun shines every day.
    solution: Sunlight is renewed constantly; the others are fossil fuels.
    mistakes: {"Coal": "s8_renewable"}
  - prompt: Why is coal called non-renewable?
    options:
    - It takes millions of years to form
    - It is black
    - It is found underground
    - It burns easily
    answer: It takes millions of years to form
    difficulty: 1
    hints:
    - Think about how long nature takes.
    - From ancient plants.
    solution: Coal formed over millions of years, far slower than we use it.
    mistakes: {"It is found underground": "s8_coal_slow"}
  - prompt: Why are resources unevenly spread across the world?
    options:
    - Differences in climate, landforms and rocks
    - People moved them
    - Only rich countries have them
    - Resources move every year
    answer: Differences in climate, landforms and rocks
    difficulty: 2
    hints:
    - Nature varies from place to place.
    - Deserts vs rainforests.
    solution: Physical differences in climate, relief and geology decide where resources occur.
    mistakes: {"Only rich countries have them": "s8_uneven"}
  - prompt: 'Forests are renewable, but only if:'
    options:
    - Trees are replanted as fast as they are cut
    - They are cut quickly
    - They are left to burn
    - No animals live there
    answer: Trees are replanted as fast as they are cut
    difficulty: 2
    hints:
    - Renewable needs time to recover.
    - Balance cutting and growing.
    solution: Forests renew only if use doesn't exceed regrowth.
    mistakes: {"They are cut quickly": "s8_forest_renew"}
  - prompt: Which makes something a resource?
    options:
    - It is useful and has value to people
    - It is found underground
    - It is expensive
    - It is made in factories
    answer: It is useful and has value to people
    difficulty: 1
    hints:
    - Water was always there; it is a resource because we use it.
    - Usefulness.
    solution: Anything that meets our needs and has value is a resource.
    mistakes: {"It is expensive": "s8_resource_value"}
  - prompt: Which is a natural resource?
    options:
    - Soil
    - A plastic bottle
    - A car
    - A computer
    answer: Soil
    difficulty: 1
    hints:
    - Not made by people.
    - From nature.
    solution: Soil comes from nature; the others are made by people.
    mistakes: {"A plastic bottle": "s8_natural"}
  - prompt: Which of these is human-made, not a natural resource?
    options:
    - Cement
    - Sand
    - Sunlight
    answer: Cement
    difficulty: 1
    hints:
    - Which one comes out of a factory?
    - Sand and sunlight are found in nature as they are.
    solution: Cement is made in factories from limestone and clay; sand and sunlight are natural.
    mistakes:
      Sand: s8r_human_made
      Sunlight: s8r_human_made
  - prompt: 'Wind is called renewable because:'
    options:
    - It keeps blowing and does not run out
    - It is found underground
    - It is costly to use
    answer: It keeps blowing and does not run out
    difficulty: 1
    hints:
    - Think about whether using wind today leaves less for tomorrow.
    - Nature keeps making more of it.
    solution: Using wind does not use it up; nature keeps producing it, so it is renewable.
    mistakes:
      It is found underground: s8_renewable
      It is costly to use: s8_resource_value
  - prompt: Which pair are both non-renewable?
    options:
    - Coal and natural gas
    - Sunlight and wind
    - Water and coal
    answer: Coal and natural gas
    difficulty: 1
    hints:
    - Look for two that took millions of years to form.
    - Both are fossil fuels.
    solution: Coal and natural gas are fossil fuels that take millions of years to form.
    mistakes:
      Sunlight and wind: s8_coal_slow
      Water and coal: s8_coal_slow
  - prompt: 'A rock with metal deep underground that nobody can reach yet is:'
    options:
    - Not yet a resource we can use
    - A renewable resource
    - A human-made resource
    answer: Not yet a resource we can use
    difficulty: 2
    hints:
    - Something becomes a resource when people can use it.
    - Can anyone use it today?
    solution: Until people have the technology to reach and use it, it is only a possible resource.
    mistakes:
      A renewable resource: s8_resource_value
      A human-made resource: s8r_human_made
  - prompt: Rajasthan has strong sunshine but little coal. Which energy source suits it best?
    options:
    - Solar power
    - Coal power
    - Hydropower from big rivers
    answer: Solar power
    difficulty: 2
    hints:
    - Use what the place has plenty of.
    - Rajasthan is a sunny desert state.
    solution: With plenty of sunshine, solar power uses Rajasthan's own abundant resource.
    mistakes:
      Coal power: s8_uneven
      Hydropower from big rivers: s8_uneven
  - prompt: A forest is cut down faster than new trees can grow. What happens?
    options:
    - It behaves like a resource that runs out
    - It stays the same
    - It grows faster
    answer: It behaves like a resource that runs out
    difficulty: 2
    hints:
    - Renewable needs time to renew.
    - Compare cutting speed with growing speed.
    solution: Forests renew only if trees are replaced as fast as they are cut; otherwise they shrink and can vanish.
    mistakes:
      It stays the same: s8_forest_renew
      It grows faster: s8_forest_renew
  - prompt: Why does Japan, with few minerals, still make many steel goods?
    options:
    - It imports raw materials through trade
    - It makes iron ore in factories
    - Steel needs no raw materials
    answer: It imports raw materials through trade
    difficulty: 3
    hints:
    - Nature did not give Japan much iron ore.
    - How do countries get what they lack?
    solution: Japan buys iron ore and coal from other countries and turns them into steel.
    mistakes:
      It makes iron ore in factories: s8r_trade
      Steel needs no raw materials: s8r_trade
  - prompt: Which is a renewable resource that can still be damaged by people?
    options:
    - Water, if it is polluted
    - Coal, if it is burnt
    - Iron ore, if it is mined
    answer: Water, if it is polluted
    difficulty: 3
    hints:
    - First find the renewable one.
    - Renewal does not help if it becomes unusable.
    solution: Water is renewed by the water cycle, but pollution can make it unfit to use.
    mistakes:
      Coal, if it is burnt: s8_renewable
      Iron ore, if it is mined: s8_renewable
  - prompt: 'Sort the clue: ''formed from plants buried millions of years ago''. Which resource is it?'
    options:
    - Coal
    - Wind
    - Soil
    answer: Coal
    difficulty: 2
    hints:
    - It is a fossil fuel.
    - It is black and burnt in power stations.
    solution: Coal formed from ancient plants buried and pressed for millions of years.
    mistakes:
      Wind: s8r_fossil
      Soil: s8r_fossil
- code: cbse8ss.res.conserve
  title: Using resources wisely
  after:
  - cbse8ss.res.types
  notes: |
    Conservation means using resources carefully so they last. Sustainable development meets today's needs
    without harming the ability of future generations to meet theirs. Ways to conserve: reduce, reuse,
    recycle; rainwater harvesting; switching to renewable energy; afforestation; protecting soil from erosion
    with terracing and shelter belts. Traditional Indian practices like sacred groves, johads and stepwells
    show long-standing care for resources.
  explanations:
    text: 'Conserving resources means using them so that there is enough for us and for people in the future. Simple habits help: switch off lights, fix leaking taps, reuse bags and recycle paper. Communities also harvest rainwater and plant trees.'
    visual: Draw three arrows in a circle labelled reduce, reuse, recycle around a water drop and a lump of coal, with a child in the future smiling because some is left.
    step_by_step: 'Step 1: Reduce: use less in the first place. Step 2: Reuse: use things again. Step 3: Recycle: turn waste into new things. Step 4: Choose renewable energy and save water.'
    real_world: In Rajasthan, the Tarun Bharat Sangh helped villages revive small earthen dams called johads to catch rainwater, and several dried-up rivers began to flow again.
  picture:
    kind: flow
    steps:
    - 'Reduce: use less'
    - 'Reuse: use again'
    - 'Recycle: make something new'
    - Save water and energy
    - Resources last for the future
    alt: 'Ways to conserve resources: reduce, reuse, recycle and save water and energy so resources last for future generations.'
  activity:
    type: sort
    prompt: Reduce, reuse or recycle?
    bins:
    - Reduce
    - Reuse
    - Recycle
    items:
    - label: Turning off the tap while brushing
      bin: Reduce
      clue: Use less.
      why: Reduce.
    - label: Using a glass jar to store pens
      bin: Reuse
      clue: Same thing, new use.
      why: Reuse.
    - label: Old newspapers made into new paper
      bin: Recycle
      clue: Made into something new.
      why: Recycle.
    - label: Buying less packaged food
      bin: Reduce
      clue: Less waste.
      why: Reduce.
    - label: Melting plastic bottles for new products
      bin: Recycle
      clue: Processed again.
      why: Recycle.
  lesson:
    - teach: Conservation means using resources carefully so they last. Sustainable development means meeting our needs today without spoiling the chance for future generations to meet theirs.
      check:
        prompt: 'A village cuts only as many trees as it plants each year. This is:'
        options:
        - Sustainable use
        - Wasteful use
        - Non-renewable use
        answer: Sustainable use
        why: The forest can keep going for future generations.
    - teach: At home we can reduce (use less), reuse (use again as it is) and recycle (break down and make something new). Switching off lights, fixing leaking taps and carrying a cloth bag all save resources.
      picture:
        kind: flow
        steps:
        - 'Reduce: use less'
        - 'Reuse: use again'
        - 'Recycle: make new'
        alt: 'Three steps: reduce, reuse, recycle.'
      check:
        prompt: 'Melting old glass bottles to make new ones is:'
        options:
        - Recycling
        - Reusing
        - Reducing
        answer: Recycling
        why: The bottles are broken down and made into something new.
    - teach: 'India has long traditions of care: rainwater harvesting in johads and stepwells, terraces on hill slopes to stop soil being washed away, and sacred groves that communities protect. Today we add solar and wind energy and plant trees.'
      check:
        prompt: Why do farmers on hills cut steps (terraces)?
        options:
        - To slow running water and save soil
        - To make the hill taller
        - To dry the soil
        answer: To slow running water and save soil
        why: Steps stop rain from rushing down and carrying soil away.
  items:
  - prompt: What does sustainable development mean?
    options:
    - Meeting today's needs without harming future generations
    - Using resources as fast as possible
    - Never using any resources
    - Only building factories
    answer: Meeting today's needs without harming future generations
    difficulty: 1
    hints:
    - Think about the future.
    - Balance.
    solution: Sustainable development balances present needs with those of future generations.
    mistakes: {"Never using any resources": "s8_sustainable"}
  - prompt: Which is an example of reuse?
    options:
    - Using a glass jar to store spices
    - Burning plastic
    - Throwing paper away
    - Buying a new bag every day
    answer: Using a glass jar to store spices
    difficulty: 1
    hints:
    - Using the same thing again.
    - No new material.
    solution: Using the jar again for something else is reuse.
    mistakes: {"Burning plastic": "s8_reuse"}
  - prompt: What is rainwater harvesting?
    options:
    - Collecting and storing rainwater for later use
    - Stopping rain from falling
    - Draining rainwater to the sea
    - Watering plants during rain
    answer: Collecting and storing rainwater for later use
    difficulty: 1
    hints:
    - Harvest means collect.
    - Tanks and pits.
    solution: Rainwater harvesting collects rain in tanks or recharges the ground.
    mistakes: {"Draining rainwater to the sea": "s8_rwh"}
  - prompt: Why are terraces cut on hill slopes?
    options:
    - To slow water and reduce soil erosion
    - To make roads
    - To increase landslides
    - To build houses
    answer: To slow water and reduce soil erosion
    difficulty: 2
    hints:
    - Steps on a slope.
    - Water runs more slowly.
    solution: Terraces slow running water so it doesn't wash soil away.
    mistakes: {"To make roads": "s8_terraces"}
  - prompt: What are sacred groves?
    options:
    - Patches of forest protected by communities for religious reasons
    - Parks in cities
    - Fruit farms
    - Tree nurseries
    answer: Patches of forest protected by communities for religious reasons
    difficulty: 2
    hints:
    - Traditional conservation.
    - Kavu in Kerala.
    solution: Sacred groves are forests that communities protect, preserving biodiversity.
    mistakes: {"Parks in cities": "s8_sacred_grove"}
  - prompt: Which saves electricity at home?
    options:
    - Switching off fans and lights when leaving a room
    - Leaving the TV on
    - Opening the fridge often
    - Using old filament bulbs
    answer: Switching off fans and lights when leaving a room
    difficulty: 1
    hints:
    - Use only what you need.
    - Off when not needed.
    solution: Switching off unused appliances saves electricity.
    mistakes: {"Using old filament bulbs": "s8_save_power"}
  - prompt: Which is an example of reducing?
    options:
    - Taking a shorter shower to use less water
    - Using an old shirt as a cleaning cloth
    - Sending newspapers to a paper mill
    answer: Taking a shorter shower to use less water
    difficulty: 1
    hints:
    - Reducing means using less in the first place.
    - Which choice uses less of something?
    solution: A shorter shower simply uses less water; the others are reuse and recycling.
    mistakes:
      Using an old shirt as a cleaning cloth: s8r_three_r
      Sending newspapers to a paper mill: s8r_three_r
  - prompt: Which of these is a traditional Indian way of saving rainwater?
    options:
    - A stepwell
    - A coal mine
    - A cement road
    answer: A stepwell
    difficulty: 1
    hints:
    - Look for something that stores water.
    - It has steps going down to the water.
    solution: Stepwells (baolis/vavs) store rainwater and groundwater for dry months.
    mistakes:
      A coal mine: s8_rwh
      A cement road: s8_rwh
  - prompt: 'Rows of trees planted along fields to stop wind from blowing soil away are called:'
    options:
    - Shelter belts
    - Terraces
    - Johads
    answer: Shelter belts
    difficulty: 2
    hints:
    - The trees give the fields shelter.
    - Terraces are steps on slopes; johads hold water.
    solution: Shelter belts are lines of trees that break the wind and protect soil.
    mistakes:
      Terraces: s8_terraces
      Johads: s8_rwh
  - prompt: Why is switching to solar power a way of conserving resources?
    options:
    - It saves coal, which will run out
    - Solar panels make coal
    - It uses more petroleum
    answer: It saves coal, which will run out
    difficulty: 2
    hints:
    - Sunlight is renewable.
    - What would we burn instead?
    solution: Using renewable sunlight means less coal is burnt, so the coal lasts longer.
    mistakes:
      Solar panels make coal: s8_renewable
      It uses more petroleum: s8_renewable
  - prompt: A town pumps up groundwater much faster than rain refills it. What will happen over years?
    options:
    - Wells will go dry
    - Groundwater will rise
    - Nothing will change
    answer: Wells will go dry
    difficulty: 2
    hints:
    - Compare how fast water goes out with how fast it comes in.
    - Is this sustainable?
    solution: Taking more than is refilled lowers the water table until wells dry up.
    mistakes:
      Groundwater will rise: s8_sustainable
      Nothing will change: s8_sustainable
  - prompt: Which action helps future generations the most?
    options:
    - Planting and caring for trees
    - Burning old tyres
    - Leaving taps running
    answer: Planting and caring for trees
    difficulty: 1
    hints:
    - Which choice adds something good that lasts?
    - The others waste or pollute.
    solution: Trees give clean air, hold soil and water, and keep giving for decades.
    mistakes:
      Burning old tyres: s8r_future
      Leaving taps running: s8_save_power
  - prompt: Why do communities that protect sacred groves also help nature?
    options:
    - Plants and animals there are left undisturbed
    - They cut the trees for timber
    - They turn the land into farms
    answer: Plants and animals there are left undisturbed
    difficulty: 2
    hints:
    - Think about what is not allowed in a sacred grove.
    - No cutting, no hunting.
    solution: Because people leave them alone for religious reasons, sacred groves keep rare plants and animals safe.
    mistakes:
      They cut the trees for timber: s8_sacred_grove
      They turn the land into farms: s8_sacred_grove
  - prompt: 'Using both sides of every page in your notebook is an example of:'
    options:
    - Reducing paper use
    - Recycling paper
    - Making paper renewable
    answer: Reducing paper use
    difficulty: 2
    hints:
    - Nothing is broken down or remade.
    - You simply need fewer notebooks.
    solution: You use less paper overall, so it is reducing.
    mistakes:
      Recycling paper: s8r_three_r
      Making paper renewable: s8r_three_r
  - prompt: A family uses 200 litres of water a day. A rainwater tank gives them 50 litres a day. How many litres do they still take from the town supply each day?
    answer: '150'
    check: 200-50
    difficulty: 2
    hints:
    - The tank covers part of the need.
    - Take the tank's share away from the total.
    solution: 200 − 50 = 150 litres a day from the supply; the tank saves a quarter.
    mistakes:
      '250': s8_rwh
