subject: cbse8-ss
chapter: 2
title: Reshaping India's Political Map
tips:
  s8_aibak: "Alauddin Khalji and the Lodis came later. Who began the Sultanate in 1206?"
  s8_akbar: "The mansabdari system ranked officers by the number of horsemen. Which strong administrator brought it in?"
  s8_aurangzeb_death: "Aurangzeb died early in the 18th century, in the 1700s."
  s8_babur: "Akbar was the grandson of the empire's founder. Who won at Panipat in 1526?"
