    answer: Timur
    difficulty: 2
    hints:
    - It happened at the end of the 14th century.
    - Babur came in 1526 and Abdali in the 1700s.
    solution: Timur sacked Delhi in 1398, leaving the Sultanate weak.
    mistakes:
      Babur: s8m_timur
      Ahmad Shah Abdali: s8m_timur
  - prompt: Razia Sultan belonged to which dynasty?
    options:
    - Mamluk (Slave)
    - Lodi
