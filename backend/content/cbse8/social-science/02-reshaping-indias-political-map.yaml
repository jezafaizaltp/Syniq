# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 2. Format: content/README.md.
subject: cbse8-ss
chapter: 2
title: Reshaping India's Political Map
concepts:
- code: cbse8ss.map.sultanate
  title: The Delhi Sultanate
  notes: |
    After Muhammad Ghori defeated Prithviraj Chauhan at Tarain (1192), the Delhi Sultanate began with
    Qutb-ud-din Aibak in 1206. Five dynasties ruled: Mamluk (Slave), Khalji, Tughlaq, Sayyid and Lodi.
    Razia Sultan was its only woman ruler; Alauddin Khalji controlled markets and defended against Mongol
    attacks; Muhammad bin Tughlaq moved the capital to Daulatabad and issued token copper coins, both with
    costly results. Timur's raid (1398) weakened Delhi. The Sultanate ended when Babur defeated Ibrahim Lodi
    at the First Battle of Panipat (1526).
  explanations:
    text: For about 320 years, from 1206 to 1526, sultans ruled from Delhi, one dynasty after another. Some rulers expanded and reorganised the kingdom, others made experiments that failed, and many regions fought to stay independent.
    visual: Draw a timeline from 1192 to 1526 with five coloured blocks for the Mamluk, Khalji, Tughlaq, Sayyid and Lodi dynasties, a flag for Timur's raid in 1398 and a sword at 1526 for Panipat.
    step_by_step: 'Step 1: 1192, Tarain: Ghori defeats Prithviraj. Step 2: 1206, Aibak founds the Sultanate. Step 3: Five dynasties rule in turn. Step 4: 1398, Timur raids Delhi. Step 5: 1526, Babur defeats the last Lodi at Panipat.'
    real_world: The Qutb Minar in Delhi, begun by Qutb-ud-din Aibak, still stands as a reminder of the early Sultanate.
  picture:
    kind: flow
    steps:
    - '1192: Battle of Tarain'
    - '1206: Aibak becomes Sultan'
    - Khaljis and Tughlaqs expand
    - '1398: Timur raids Delhi'
    - '1526: Panipat ends the Sultanate'
    alt: A timeline of the Delhi Sultanate from Tarain in 1192 to the First Battle of Panipat in 1526.
  items:
  - prompt: Who became the first Sultan of Delhi in 1206?
    options:
    - Qutb-ud-din Aibak
    - Alauddin Khalji
    - Babur
    - Ibrahim Lodi
    answer: Qutb-ud-din Aibak
    difficulty: 1
    hints:
    - He began the Qutb Minar.
    - Mamluk dynasty.
    solution: Qutb-ud-din Aibak founded the Sultanate in 1206.
  - prompt: Who was the only woman ruler of the Delhi Sultanate?
    options:
    - Razia Sultan
    - Nur Jahan
    - Rani Durgavati
    - Ahilyabai Holkar
    answer: Razia Sultan
    difficulty: 1
    hints:
    - 13th century.
    - Daughter of Iltutmish.
    solution: Razia Sultan ruled in the 13th century.
  - prompt: Which ruler moved the capital to Daulatabad?
    options:
    - Muhammad bin Tughlaq
    - Alauddin Khalji
    - Sikandar Lodi
    - Iltutmish
    answer: Muhammad bin Tughlaq
    difficulty: 2
    hints:
    - He also issued token coins.
    - Tughlaq dynasty.
    solution: Muhammad bin Tughlaq shifted the capital to Daulatabad.
  - prompt: In which year did the First Battle of Panipat end the Delhi Sultanate?
    answer: '1526'
    check: '1526'
    difficulty: 1
    hints:
    - Babur vs Ibrahim Lodi.
    - Early 16th century.
    solution: Babur defeated Ibrahim Lodi at Panipat in 1526.
  - prompt: Which was the last dynasty of the Delhi Sultanate?
    options:
    - Lodi
    - Khalji
    - Tughlaq
    - Mamluk
    answer: Lodi
    difficulty: 2
    hints:
    - Ibrahim was its last sultan.
    - L...
    solution: The Lodis were the last Sultanate dynasty.
  - prompt: For about how many years did the Delhi Sultanate last, from 1206 to 1526?
    answer: '320'
    check: 1526 - 1206
    difficulty: 2
    hints:
    - Subtract.
    - 1526 − 1206.
    solution: 1526 − 1206 = 320 years.
- code: cbse8ss.map.mughals
  title: The Mughals and the kingdoms that resisted
  after:
  - cbse8ss.map.sultanate
  notes: |
    Babur founded the Mughal Empire in 1526. Humayun lost it to Sher Shah Suri and regained it. Akbar
    (1556–1605) expanded it, set up the mansabdari system and Todar Mal's land revenue system, and promoted
    sulh-i-kul (peace among all). Shah Jahan built the Taj Mahal; Aurangzeb (1658–1707) took the empire to its
    largest size but faced long wars and reimposed jizya. Many resisted: Vijayanagara (founded 1336 by Harihara
    and Bukka, defeated at Talikota 1565), Maharana Pratap at Haldighati (1576), Rani Durgavati, the Ahoms under
    Lachit Borphukan at Saraighat (1671) and the Sikhs (Guru Gobind Singh formed the Khalsa in 1699). After
    Aurangzeb's death in 1707, Mughal power declined.
  explanations:
    text: 'The Mughals built one of the largest empires in Indian history, from Babur to Aurangzeb. But India''s map was never just one empire: Vijayanagara in the south, the Rajputs, the Ahoms in Assam and the Sikhs in Punjab all fought to keep their freedom.'
    visual: 'Draw a map of India with a big Mughal area in the north and centre, and labelled flags for resisters: Vijayanagara (south), Mewar (Rajasthan), Ahom (Assam), Garha (central India) and Punjab (Sikhs).'
    step_by_step: 'Step 1: 1526, Babur founds the empire. Step 2: Akbar expands and organises it. Step 3: Shah Jahan builds; Aurangzeb expands further but faces revolts. Step 4: Regional powers resist throughout. Step 5: After 1707 the empire weakens.'
    real_world: Lachit Borphukan's victory over the Mughal fleet at Saraighat on the Brahmaputra in 1671 is remembered every year in Assam on Lachit Divas (24 November).
  picture:
    kind: compare
    columns:
    - title: Mughal rulers
      points:
      - 'Babur: founded 1526'
      - 'Akbar: mansabdari, sulh-i-kul'
      - 'Shah Jahan: Taj Mahal'
      - 'Aurangzeb: largest empire, long wars'
    - title: Those who resisted
      points:
      - Vijayanagara (Talikota 1565)
      - Maharana Pratap (Haldighati 1576)
      - Ahoms (Saraighat 1671)
      - Sikhs (Khalsa 1699)
    alt: Key Mughal rulers from Babur to Aurangzeb alongside the kingdoms and leaders who resisted them.
    caption: India's political map was shaped by both.
  items:
  - prompt: Who founded the Mughal Empire?
    options:
    - Babur
    - Akbar
    - Humayun
    - Sher Shah Suri
    answer: Babur
    difficulty: 1
    hints:
    - He won at Panipat in 1526.
    - The first Mughal.
    solution: Babur founded the Mughal Empire in 1526.
  - prompt: Which Mughal ruler introduced the mansabdari system?
    options:
    - Akbar
    - Babur
    - Aurangzeb
    - Jahangir
    answer: Akbar
    difficulty: 1
    hints:
    - He ruled 1556–1605.
    - Sulh-i-kul.
    solution: Akbar organised nobles into ranks under the mansabdari system.
  - prompt: Who founded the Vijayanagara Empire in 1336?
    options:
    - Harihara and Bukka
    - Krishnadevaraya
    - Shivaji
    - Rajaraja Chola
    answer: Harihara and Bukka
    difficulty: 2
    hints:
    - Two brothers.
    - Its capital was Hampi.
    solution: Harihara and Bukka founded Vijayanagara in 1336.
  - prompt: Who led the Ahoms to victory at Saraighat in 1671?
    options:
    - Lachit Borphukan
    - Maharana Pratap
    - Guru Gobind Singh
    - Rani Durgavati
    answer: Lachit Borphukan
    difficulty: 2
    hints:
    - Assam.
    - A naval battle on the Brahmaputra.
    solution: Lachit Borphukan defeated the Mughals at Saraighat.
  - prompt: In which battle did Maharana Pratap fight the Mughals in 1576?
    options:
    - Haldighati
    - Panipat
    - Talikota
    - Plassey
    answer: Haldighati
    difficulty: 2
    hints:
    - Mewar, Rajasthan.
    - Yellow-coloured pass.
    solution: Maharana Pratap fought Akbar's army at Haldighati in 1576.
  - prompt: In which year did Aurangzeb die, after which Mughal power declined?
    answer: '1707'
    check: '1707'
    difficulty: 2
    hints:
    - Early 18th century.
    - He ruled from 1658.
    solution: Aurangzeb died in 1707.
