- code: cbse8ss.map.mughals
  title: The Mughals and the kingdoms that resisted
  after:
  - cbse8ss.map.sultanate
  notes: |
    Babur founded the Mughal Empire in 1526. Humayun lost it to Sher Shah Suri and regained it. Akbar
    (1556–1605) expanded it, set up the mansabdari system and Todar Mal's land revenue system, and promoted
    sulh-i-kul (peace among all). Shah Jahan built the Taj Mahal; Aurangzeb (1658–1707) took the empire to its
    largest size but faced long wars and reimposed jizya. Many resisted: Vijayanagara (founded 1336 by Harihara
    and Bukka, defeated at Talikota 1565), Maharana Pratap at Haldighati (1576), Rani Durgavati, the Ahoms under
    Lachit Borphukan at Saraighat (1671) and the Sikhs (Guru Gobind Singh formed the Khalsa in 1699). After
    Aurangzeb's death in 1707, Mughal power declined.
  explanations:
    text: 'The Mughals built one of the largest empires in Indian history, from Babur to Aurangzeb. But India''s map was never just one empire: Vijayanagara in the south, the Rajputs, the Ahoms in Assam and the Sikhs in Punjab all fought to keep their freedom.'
    visual: 'Draw a map of India with a big Mughal area in the north and centre, and labelled flags for resisters: Vijayanagara (south), Mewar (Rajasthan), Ahom (Assam), Garha (central India) and Punjab (Sikhs).'
    step_by_step: 'Step 1: 1526, Babur founds the empire. Step 2: Akbar expands and organises it. Step 3: Shah Jahan builds; Aurangzeb expands further but faces revolts. Step 4: Regional powers resist throughout. Step 5: After 1707 the empire weakens.'
    real_world: Lachit Borphukan's victory over the Mughal fleet at Saraighat on the Brahmaputra in 1671 is remembered every year in Assam on Lachit Divas (24 November).
  picture:
    kind: compare
    columns:
    - title: Mughal rulers
      points:
      - 'Babur: founded 1526'
      - 'Akbar: mansabdari, sulh-i-kul'
      - 'Shah Jahan: Taj Mahal'
      - 'Aurangzeb: largest empire, long wars'
    - title: Those who resisted
      points:
      - Vijayanagara (Talikota 1565)
      - Maharana Pratap (Haldighati 1576)
      - Ahoms (Saraighat 1671)
      - Sikhs (Khalsa 1699)
    alt: Key Mughal rulers from Babur to Aurangzeb alongside the kingdoms and leaders who resisted them.
    caption: India's political map was shaped by both.
  activity:
    type: order
    prompt: Put the Mughal rulers in order.
    steps:
    - Babur (from 1526)
    - Humayun
    - Akbar (1556–1605)
    - Shah Jahan, builder of the Taj Mahal
    - Aurangzeb (1658–1707)
    reasons:
      Humayun: Babur's son; he lost and regained the empire.
      Akbar (1556–1605): Humayun's son; he expanded the empire.
      Shah Jahan, builder of the Taj Mahal: Jahangir came between; Shah Jahan was Akbar's grandson.
      Aurangzeb (1658–1707): Shah Jahan's son, the last great Mughal.
  lesson:
    - teach: Babur won the First Battle of Panipat in 1526 and founded the Mughal Empire. His son Humayun lost it to Sher Shah Suri and won it back in 1555.
      check:
        prompt: Who took the empire from Humayun for some years?
        options:
        - Sher Shah Suri
        - Akbar
        - Ibrahim Lodi
        answer: Sher Shah Suri
        why: Sher Shah defeated Humayun; Humayun regained power only in 1555.
    - teach: 'Akbar (1556–1605) widened the empire and organised it: officers called mansabdars held ranks, Todar Mal measured land to fix fair revenue, and Akbar''s idea of sulh-i-kul meant peace among all faiths. Shah Jahan built the Taj Mahal. Aurangzeb (1658–1707) ruled the largest area but fought long, costly wars.'
      picture:
        kind: flow
        steps:
        - Babur 1526
        - Humayun
        - Akbar 1556
        - Jahangir
        - Shah Jahan
        - Aurangzeb to 1707
        alt: The main Mughal rulers in order from Babur to Aurangzeb.
      check:
        prompt: Which Mughal promoted sulh-i-kul, peace among all?
        options:
        - Akbar
        - Aurangzeb
        - Babur
        answer: Akbar
        why: Akbar's policy of sulh-i-kul welcomed people of all faiths.
    - teach: 'Many rulers resisted Mughal power: Vijayanagara in the south (founded 1336), Maharana Pratap at Haldighati (1576), Rani Durgavati in Gondwana, the Ahoms under Lachit Borphukan at Saraighat (1671) and the Sikhs, whose Guru Gobind Singh formed the Khalsa in 1699. After Aurangzeb died in 1707, Mughal power declined.'
      check:
        prompt: Which people defeated a Mughal fleet on the Brahmaputra at Saraighat?
        options:
        - The Ahoms
        - The Marathas
        - The Rajputs of Mewar
        answer: The Ahoms
        why: Lachit Borphukan led the Ahoms of Assam to victory at Saraighat in 1671.
  items:
  - prompt: Who founded the Mughal Empire?
    options:
