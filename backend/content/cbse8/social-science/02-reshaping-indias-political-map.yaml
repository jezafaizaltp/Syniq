      Mamluk: s8m_order
  - prompt: Why did Muhammad bin Tughlaq's token copper coins fail?
    options:
    - People made fake coins easily
    - Copper was too rare to find
    - Nobody needed money
    answer: People made fake coins easily
    difficulty: 3
    hints:
    - A token coin is worth more than its metal.
    - What happens if anyone can make copper coins at home?
    solution: Copper coins were easy to forge, so fake coins flooded the market and the plan was withdrawn.
    mistakes:
      Copper was too rare to find: s8_tughlaq
      Nobody needed money: s8_tughlaq
  - prompt: Which invader's raid in 1398 badly weakened Delhi?
    options:
    - Timur
