concepts:
- code: cbse8ss.map.sultanate
  title: The Delhi Sultanate
  notes: |
    After Muhammad Ghori defeated Prithviraj Chauhan at Tarain (1192), the Delhi Sultanate began with
    Qutb-ud-din Aibak in 1206. Five dynasties ruled: Mamluk (Slave), Khalji, Tughlaq, Sayyid and Lodi.
    Razia Sultan was its only woman ruler; Alauddin Khalji controlled markets and defended against Mongol
    attacks; Muhammad bin Tughlaq moved the capital to Daulatabad and issued token copper coins, both with
    costly results. Timur's raid (1398) weakened Delhi. The Sultanate ended when Babur defeated Ibrahim Lodi
    at the First Battle of Panipat (1526).
  explanations:
    text: For about 320 years, from 1206 to 1526, sultans ruled from Delhi, one dynasty after another. Some rulers expanded and reorganised the kingdom, others made experiments that failed, and many regions fought to stay independent.
    visual: Draw a timeline from 1192 to 1526 with five coloured blocks for the Mamluk, Khalji, Tughlaq, Sayyid and Lodi dynasties, a flag for Timur's raid in 1398 and a sword at 1526 for Panipat.
    step_by_step: 'Step 1: 1192, Tarain: Ghori defeats Prithviraj. Step 2: 1206, Aibak founds the Sultanate. Step 3: Five dynasties rule in turn. Step 4: 1398, Timur raids Delhi. Step 5: 1526, Babur defeats the last Lodi at Panipat.'
    real_world: The Qutb Minar in Delhi, begun by Qutb-ud-din Aibak, still stands as a reminder of the early Sultanate.
  picture:
    kind: flow
    steps:
    - '1192: Battle of Tarain'
    - '1206: Aibak becomes Sultan'
    - Khaljis and Tughlaqs expand
    - '1398: Timur raids Delhi'
    - '1526: Panipat ends the Sultanate'
    alt: A timeline of the Delhi Sultanate from Tarain in 1192 to the First Battle of Panipat in 1526.
  activity:
    type: sort
    prompt: Which sultan?
    bins:
    - Qutb-ud-din Aibak
    - Razia Sultan
    - Alauddin Khalji
    - Muhammad bin Tughlaq
    items:
    - label: Began the Sultanate in 1206
      bin: Qutb-ud-din Aibak
      clue: The first.
      why: Aibak.
    - label: The only woman ruler
      bin: Razia Sultan
      clue: Iltutmish's daughter.
      why: Razia.
    - label: Market control, defence against Mongols
      bin: Alauddin Khalji
      clue: Khalji.
      why: Alauddin.
    - label: Capital to Daulatabad, token copper coins
      bin: Muhammad bin Tughlaq
      clue: Costly experiments.
      why: Muhammad bin Tughlaq.
  lesson:
    - teach: In 1192 Muhammad Ghori defeated Prithviraj Chauhan at the Second Battle of Tarain. His general Qutb-ud-din Aibak became the first Sultan of Delhi in 1206. This began the Delhi Sultanate.
      check:
        prompt: Which battle opened the way for the Delhi Sultanate?
        options:
        - Second Battle of Tarain, 1192
        - First Battle of Panipat, 1526
        - Battle of Haldighati, 1576
        answer: Second Battle of Tarain, 1192
        why: Ghori's win at Tarain let his general Aibak set up rule from Delhi.
    - teach: 'Five dynasties ruled one after another: Mamluk (Slave), Khalji, Tughlaq, Sayyid and Lodi. Razia Sultan was the only woman ruler. Alauddin Khalji controlled market prices and fought off the Mongols. Muhammad bin Tughlaq moved the capital to Daulatabad and issued copper token coins, and both plans failed.'
      picture:
        kind: flow
        steps:
        - Mamluk (1206)
        - Khalji
        - Tughlaq
        - Sayyid
        - Lodi (to 1526)
        alt: 'The five Sultanate dynasties in order: Mamluk, Khalji, Tughlaq, Sayyid, Lodi.'
      check:
        prompt: Which dynasty came right after the Khaljis?
        options:
        - Tughlaq
        - Lodi
        - Mamluk
        answer: Tughlaq
        why: The order is Mamluk, Khalji, Tughlaq, Sayyid, Lodi.
    - teach: Timur's raid in 1398 left Delhi weak. In 1526 Babur defeated Ibrahim Lodi at the First Battle of Panipat, and the Sultanate ended after about 320 years.
      check:
        prompt: Who did Babur defeat at Panipat in 1526?
        options:
        - Ibrahim Lodi
        - Alauddin Khalji
        - Razia Sultan
        answer: Ibrahim Lodi
        why: Ibrahim Lodi was the last Sultan; his defeat ended the Sultanate.
