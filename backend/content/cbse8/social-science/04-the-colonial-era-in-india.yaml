# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 4. Format: content/README.md.
subject: cbse8-ss
chapter: 4
title: The Colonial Era in India
concepts:
- code: cbse8ss.colonial.companies
  title: European traders become rulers
  notes: |
    Vasco da Gama reached Calicut by sea in 1498, opening a route for European traders. The Portuguese, Dutch,
    English and French set up trading posts. The English East India Company (chartered in 1600) used its
    army and alliances to gain power: Robert Clive won the Battle of Plassey (1757) against Siraj-ud-daulah,
    and the Battle of Buxar (1764) gave the Company the diwani (right to collect revenue) of Bengal, Bihar
    and Orissa (1765). Policies like the subsidiary alliance and the doctrine of lapse let it take over more
    kingdoms.
  explanations:
    text: 'European companies came to India to trade spices and cloth. The English East India Company slowly turned trade into rule: it won wars at Plassey (1757) and Buxar (1764), took the right to collect taxes in Bengal, and used treaties and rules to take over kingdom after kingdom.'
    visual: 'Draw a timeline: 1498 ship arrives at Calicut, 1600 Company formed, 1757 Plassey, 1764 Buxar, 1765 diwani, then a widening red area on a map of India.'
    step_by_step: 'Step 1: 1498, sea route to India. Step 2: Companies set up trading posts. Step 3: 1757 Plassey and 1764 Buxar: the Company wins power in Bengal. Step 4: Subsidiary alliances and the doctrine of lapse expand its control.'
    real_world: Fort St George in Chennai, built by the English Company in 1644, was one of its first strongholds; the city of Madras grew around it.
  picture:
    kind: flow
    steps:
    - '1498: Vasco da Gama reaches Calicut'
    - '1600: English East India Company formed'
    - '1757: Battle of Plassey'
    - '1764: Battle of Buxar'
    - '1765: Company gets diwani of Bengal'
    alt: 'How a trading company became a ruler: from Vasco da Gama in 1498 to the Company''s right to collect Bengal''s revenue in 1765.'
  activity:
    type: order
    prompt: How the Company became ruler. Put it in order.
    steps:
    - Vasco da Gama reaches Calicut (1498)
    - English East India Company chartered (1600)
    - Battle of Plassey (1757)
    - Battle of Buxar (1764)
    - Diwani of Bengal, Bihar and Orissa (1765)
    reasons:
      English East India Company chartered (1600): The English came a century after the sea route opened.
      Battle of Plassey (1757): The Company fought after building up trade and an army.
      Battle of Buxar (1764): Buxar came seven years after Plassey.
      Diwani of Bengal, Bihar and Orissa (1765): The right to collect revenue followed Buxar.
  items:
  - prompt: Where did Vasco da Gama land in 1498?
    options:
    - Calicut
    - Bombay
    - Calcutta
    - Goa
    answer: Calicut
    difficulty: 1
    hints:
    - On the Kerala coast.
    - Kozhikode.
    solution: Vasco da Gama reached Calicut (Kozhikode) in 1498.
  - prompt: In which year was the Battle of Plassey fought?
    answer: '1757'
    check: '1757'
    difficulty: 1
    hints:
    - Robert Clive vs Siraj-ud-daulah.
    - Mid-18th century.
    solution: The Battle of Plassey was fought in 1757.
  - prompt: Whom did Robert Clive defeat at Plassey?
    options:
    - Siraj-ud-daulah
    - Tipu Sultan
    - Shivaji
    - Bahadur Shah Zafar
    answer: Siraj-ud-daulah
    difficulty: 2
    hints:
    - The Nawab of Bengal.
    - S...
    solution: Clive defeated Siraj-ud-daulah, Nawab of Bengal.
  - prompt: What did the Company gain in 1765 after Buxar?
    options:
    - 'The diwani: the right to collect revenue'
    - Control of all India
    - Permission to trade only in spices
    - Nothing
    answer: 'The diwani: the right to collect revenue'
    difficulty: 2
    hints:
    - Bengal, Bihar and Orissa.
    - Revenue collection.
    solution: The Mughal emperor granted the Company the diwani of Bengal, Bihar and Orissa.
  - prompt: Under the doctrine of lapse, what happened when a ruler died without a natural heir?
    options:
    - The Company took over the kingdom
    - The kingdom became independent
    - The people chose a ruler
    - The Mughal emperor took it
    answer: The Company took over the kingdom
    difficulty: 2
    hints:
    - Lord Dalhousie's policy.
    - Jhansi, Satara.
    solution: The kingdom 'lapsed' to the Company if there was no natural heir.
  - prompt: The English East India Company was set up in 1600. How many years later was Plassey?
    answer: '157'
    check: 1757 - 1600
    difficulty: 2
    hints:
    - Subtract.
    - 1757 − 1600.
    solution: 1757 − 1600 = 157 years.
- code: cbse8ss.colonial.effects
  title: The impact of colonial rule
  after:
  - cbse8ss.colonial.companies
  notes: |
    Colonial rule drained wealth from India to Britain through high land revenue, the Company's profits and
    'home charges' (Dadabhai Naoroji's drain theory). Indian handicrafts and textiles declined as cheap
    machine-made British goods flooded in (deindustrialisation), while raw cotton and indigo were exported.
    Farmers were forced to grow cash crops like indigo, and famines killed millions. Railways and the
    telegraph were built mainly to move goods and troops. Resentment led to the Revolt of 1857, after which
    the British Crown took direct control of India (1858).
  explanations:
    text: British rule made India poorer. Taxes and profits flowed to Britain, Indian weavers lost their work to cheap factory cloth, and farmers were made to grow crops like indigo for export. Anger grew until the great revolt of 1857, after which the British government ruled India directly.
    visual: Draw a pipe from India to Britain labelled 'drain of wealth', carrying raw cotton, indigo and taxes, and another pipe back carrying machine-made cloth that pushes Indian weavers out.
    step_by_step: 'Step 1: High taxes and profits go to Britain. Step 2: Raw materials are exported cheaply. Step 3: Factory goods are sold back, ruining crafts. Step 4: Farmers suffer and famines strike. Step 5: Anger leads to the 1857 revolt and direct Crown rule in 1858.'
    real_world: Dhaka's fine muslin, once famous across the world, almost disappeared in the 19th century as weavers could not compete with cheap British mill cloth.
  picture:
    kind: compare
    columns:
    - title: Britain gained
      points:
      - Taxes and profits
      - Cheap raw cotton and indigo
      - A market for factory goods
    - title: India lost
      points:
      - Wealth drained away
      - Weavers and crafts ruined
      - Famines and forced cash crops
    alt: Under colonial rule Britain gained taxes, cheap raw materials and a market, while India lost wealth, crafts and suffered famines.
    caption: The 'drain of wealth'.
  activity:
    type: sort
    prompt: Effect on India?
    bins:
    - Wealth drained
    - Crafts declined
    - Farmers suffered
    - Built for British needs
    items:
    - label: Home charges sent to Britain
      bin: Wealth drained
      clue: Naoroji's theory.
      why: Drain.
    - label: Handloom weavers lose work to British cloth
      bin: Crafts declined
      clue: Deindustrialisation.
      why: Crafts.
    - label: Forced to grow indigo
      bin: Farmers suffered
      clue: Cash crops.
      why: Farmers.
    - label: Railways to move raw cotton to ports
      bin: Built for British needs
      clue: Goods and troops.
      why: British needs.
    - label: Famines killed millions
      bin: Farmers suffered
      clue: Food scarce.
      why: Farmers.
  items:
  - prompt: Who explained the 'drain of wealth' from India to Britain?
    options:
    - Dadabhai Naoroji
    - Mahatma Gandhi
    - Lord Curzon
    - Raja Ram Mohan Roy
    answer: Dadabhai Naoroji
    difficulty: 2
    hints:
    - The 'Grand Old Man of India'.
    - Poverty and Un-British Rule in India.
    solution: Dadabhai Naoroji showed how wealth was drained to Britain.
  - prompt: Why did Indian handloom weaving decline?
    options:
    - Cheap machine-made British cloth flooded the market
    - Indians stopped wearing clothes
    - Cotton stopped growing
    - Weavers moved to Britain
    answer: Cheap machine-made British cloth flooded the market
    difficulty: 1
    hints:
    - Factories vs handlooms.
    - Price.
    solution: Cheaper British mill cloth ruined many Indian weavers.
  - prompt: Which crop were many farmers in Bengal and Bihar forced to grow for the British?
    options:
    - Indigo
    - Rice
    - Wheat
    - Millet
    answer: Indigo
    difficulty: 2
    hints:
    - A blue dye.
    - Champaran later protested.
    solution: Planters forced farmers to grow indigo for export.
  - prompt: Why did the British mainly build railways in India?
    options:
    - To move raw materials, goods and troops
    - Only to help Indian travellers
    - To give jobs to farmers
    - For tourism
    answer: To move raw materials, goods and troops
    difficulty: 2
    hints:
    - Whose interests came first?
    - Ports to inland areas.
    solution: Railways moved raw materials to ports, British goods inland and soldiers quickly.
  - prompt: In which year did the great revolt against Company rule begin?
    answer: '1857'
    check: '1857'
    difficulty: 1
    hints:
    - Mid-19th century.
    - Meerut, May.
    solution: The revolt began in 1857.
  - prompt: What changed after the Revolt of 1857?
    options:
    - The British Crown took direct control of India
    - India became free
    - The Company gained more power
    - The Mughals took back India
    answer: The British Crown took direct control of India
    difficulty: 2
    hints:
    - '1858.'
    - Queen Victoria's proclamation.
    solution: In 1858 the Crown ended Company rule and governed India directly.
