# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 4. Format: content/README.md.
subject: cbse8-ss
chapter: 4
title: The Colonial Era in India
tips:
  s8_1857: "The revolt began in the late 1850s, a hundred years after Plassey."
  s8_calicut: "Goa was captured by the Portuguese later, in 1510. Where did Vasco da Gama first land in 1498?"
  s8_company_gap: "Subtract: 1757 − 1600."
  s8_crown_rule: "India was not free yet. Who took over from the Company?"
  s8_diwani: "'Diwani' was about revenue. What did the Company gain the right to do?"
  s8_handloom: "Machines made cloth faster and cheaper. What did that do to hand weavers?"
  s8_indigo: "This blue dye crop led to the Champaran satyagraha."
  s8_lapse: "'Lapse' means passing away. Who took the kingdom when there was no natural heir?"
  s8_naoroji: "The 'Grand Old Man of India' explained how wealth flowed out to Britain."
  s8_plassey: "Plassey was in the mid-1750s, the start of British power in Bengal."
  s8_railways: "Railways were built mainly to serve British trade and control."
  s8_siraj: "Tipu Sultan fought later in Mysore. Who was the Nawab of Bengal?"
  s8c_buxar: Which battle in 1764, after Plassey, defeated the Mughal emperor, the Nawab of Awadh and Mir Qasim together?
  s8c_subsidiary: Under this deal a ruler paid for British troops kept in his state and could not make his own allies.
  s8c_europeans: "Whose sailor, Vasco da Gama, reached Calicut in 1498, a century before the other companies?"
  s8c_famine: When farmers must grow crops to sell abroad and pay high taxes, what is left for them to eat in a bad year?
  s8c_raw: Britain wanted raw materials from India and sold machine-made goods back. Which way did each one travel?

concepts:
- code: cbse8ss.colonial.companies
  title: European traders become rulers
  notes: |
    Vasco da Gama reached Calicut by sea in 1498, opening a route for European traders. The Portuguese, Dutch,
    English and French set up trading posts. The English East India Company (chartered in 1600) used its
    army and alliances to gain power: Robert Clive won the Battle of Plassey (1757) against Siraj-ud-daulah,
    and the Battle of Buxar (1764) gave the Company the diwani (right to collect revenue) of Bengal, Bihar
    and Orissa (1765). Policies like the subsidiary alliance and the doctrine of lapse let it take over more
    kingdoms.
  explanations:
    text: 'European companies came to India to trade spices and cloth. The English East India Company slowly turned trade into rule: it won wars at Plassey (1757) and Buxar (1764), took the right to collect taxes in Bengal, and used treaties and rules to take over kingdom after kingdom.'
    visual: 'Draw a timeline: 1498 ship arrives at Calicut, 1600 Company formed, 1757 Plassey, 1764 Buxar, 1765 diwani, then a widening red area on a map of India.'
    step_by_step: 'Step 1: 1498, sea route to India. Step 2: Companies set up trading posts. Step 3: 1757 Plassey and 1764 Buxar: the Company wins power in Bengal. Step 4: Subsidiary alliances and the doctrine of lapse expand its control.'
    real_world: Fort St George in Chennai, built by the English Company in 1644, was one of its first strongholds; the city of Madras grew around it.
  picture:
    kind: flow
    steps:
    - '1498: Vasco da Gama reaches Calicut'
    - '1600: English East India Company formed'
    - '1757: Battle of Plassey'
    - '1764: Battle of Buxar'
    - '1765: Company gets diwani of Bengal'
    alt: 'How a trading company became a ruler: from Vasco da Gama in 1498 to the Company''s right to collect Bengal''s revenue in 1765.'
  activity:
    type: order
    prompt: How the Company became ruler. Put it in order.
    steps:
    - Vasco da Gama reaches Calicut (1498)
    - English East India Company chartered (1600)
    - Battle of Plassey (1757)
    - Battle of Buxar (1764)
    - Diwani of Bengal, Bihar and Orissa (1765)
    reasons:
      English East India Company chartered (1600): The English came a century after the sea route opened.
      Battle of Plassey (1757): The Company fought after building up trade and an army.
      Battle of Buxar (1764): Buxar came seven years after Plassey.
      Diwani of Bengal, Bihar and Orissa (1765): The right to collect revenue followed Buxar.
  lesson:
    - teach: In 1498 Vasco da Gama sailed around Africa and reached Calicut in Kerala, opening a sea route from Europe. Portuguese, Dutch, English and French traders followed and set up trading posts called factories along the coast.
      check:
        prompt: Why was Vasco da Gama's voyage to Calicut important?
        options:
        - It opened a sea route from Europe to India
        - It started the Mughal Empire
        - It ended the spice trade
        answer: It opened a sea route from Europe to India
        why: European traders could now reach India by sea, without going through West Asia.
    - teach: 'The English East India Company, set up in 1600, slowly built an army. In 1757 Robert Clive defeated Siraj-ud-daulah, Nawab of Bengal, at Plassey. In 1764 the Company won the Battle of Buxar, and in 1765 it got the diwani: the right to collect revenue in Bengal, Bihar and Orissa.'
      picture:
        kind: flow
        steps:
        - 1498 Calicut
        - 1600 Company formed
        - 1757 Plassey
        - 1764 Buxar
        - 1765 Diwani
        alt: 'From traders to rulers: Calicut 1498, the Company 1600, Plassey 1757, Buxar 1764, diwani 1765.'
      check:
        prompt: What did the diwani give the Company?
        options:
        - The right to collect revenue
        - The right to crown the emperor
        - Free land in Britain
        answer: The right to collect revenue
        why: With the diwani, Bengal's taxes flowed to the Company.
    - teach: The Company took over more kingdoms with clever policies. Under the subsidiary alliance, a ruler paid for British troops in his state and gave up control of his foreign affairs. Under the doctrine of lapse (Lord Dalhousie), a kingdom whose ruler died without a natural son was taken over.
      check:
        prompt: A ruler dies with only an adopted son. Under the doctrine of lapse, what happens?
        options:
        - The Company takes over the kingdom
        - The adopted son becomes king
        - The kingdom becomes free
        answer: The Company takes over the kingdom
        why: Adopted heirs were not accepted, so the kingdom 'lapsed' to the Company.
  items:
  - prompt: Where did Vasco da Gama land in 1498?
    options:
    - Calicut
    - Bombay
    - Calcutta
    - Goa
    answer: Calicut
    difficulty: 1
    hints:
    - On the Kerala coast.
    - Kozhikode.
    solution: Vasco da Gama reached Calicut (Kozhikode) in 1498.
    mistakes: {"Goa": "s8_calicut"}
  - prompt: In which year was the Battle of Plassey fought?
    answer: '1757'
    check: '1757'
    difficulty: 1
    hints:
    - Robert Clive vs Siraj-ud-daulah.
    - Mid-18th century.
    solution: The Battle of Plassey was fought in 1757.
    mistakes: {"1857": "s8_plassey", "1764": "s8_plassey"}
  - prompt: Whom did Robert Clive defeat at Plassey?
    options:
    - Siraj-ud-daulah
    - Tipu Sultan
    - Shivaji
    - Bahadur Shah Zafar
    answer: Siraj-ud-daulah
    difficulty: 2
    hints:
    - The Nawab of Bengal.
    - S...
    solution: Clive defeated Siraj-ud-daulah, Nawab of Bengal.
    mistakes: {"Tipu Sultan": "s8_siraj"}
  - prompt: What did the Company gain in 1765 after Buxar?
    options:
    - 'The diwani: the right to collect revenue'
    - Control of all India
    - Permission to trade only in spices
    - Nothing
    answer: 'The diwani: the right to collect revenue'
    difficulty: 2
    hints:
    - Bengal, Bihar and Orissa.
    - Revenue collection.
    solution: The Mughal emperor granted the Company the diwani of Bengal, Bihar and Orissa.
    mistakes: {"Control of all India": "s8_diwani"}
  - prompt: Under the doctrine of lapse, what happened when a ruler died without a natural heir?
    options:
    - The Company took over the kingdom
    - The kingdom became independent
    - The people chose a ruler
    - The Mughal emperor took it
    answer: The Company took over the kingdom
    difficulty: 2
    hints:
    - Lord Dalhousie's policy.
    - Jhansi, Satara.
    solution: The kingdom 'lapsed' to the Company if there was no natural heir.
    mistakes: {"The people chose a ruler": "s8_lapse"}
  - prompt: The English East India Company was set up in 1600. How many years later was Plassey?
    answer: '157'
    check: 1757 - 1600
    difficulty: 2
    hints:
    - Subtract.
    - 1757 − 1600.
    solution: 1757 − 1600 = 157 years.
    mistakes: {"257": "s8_company_gap", "143": "s8_company_gap"}
  - prompt: Which European traders reached India by sea first?
    options:
    - The Portuguese
    - The English
    - The French
    answer: The Portuguese
    difficulty: 1
    hints:
    - Vasco da Gama led them in 1498.
    - The English Company was set up a century later.
    solution: The Portuguese came first in 1498; the Dutch, English and French followed.
    mistakes:
      The English: s8c_europeans
      The French: s8c_europeans
  - prompt: Who led the Company's army at Plassey?
    options:
    - Robert Clive
    - Lord Dalhousie
    - Vasco da Gama
    answer: Robert Clive
    difficulty: 2
    hints:
    - Dalhousie came nearly a century later.
    - Vasco da Gama was a Portuguese sailor.
    solution: Robert Clive won Plassey in 1757 against Siraj-ud-daulah.
    mistakes:
      Lord Dalhousie: s8_plassey
      Vasco da Gama: s8_calicut
  - prompt: Which battle in 1764 made the Company the strongest power in eastern India?
    options:
    - Buxar
    - Panipat
    - Haldighati
    answer: Buxar
    difficulty: 2
    hints:
    - It came seven years after Plassey.
    - The Mughal emperor himself was on the losing side.
    solution: At Buxar the Company defeated the Mughal emperor, the Nawab of Awadh and Mir Qasim.
    mistakes:
      Panipat: s8c_buxar
      Haldighati: s8c_buxar
  - prompt: Under a subsidiary alliance, what did an Indian ruler have to do?
    options:
    - Pay for British troops kept in his state
    - Send his army to Britain
    - Build railways for the Company
    answer: Pay for British troops kept in his state
    difficulty: 2
    hints:
    - It was about soldiers.
    - The ruler paid, the Company controlled.
    solution: The ruler paid for British troops in his land and could not make alliances without the Company's permission.
    mistakes:
      Send his army to Britain: s8c_subsidiary
      Build railways for the Company: s8c_subsidiary
  - prompt: Which Governor-General used the doctrine of lapse?
    options:
    - Lord Dalhousie
    - Robert Clive
    - Lord Wellesley
    answer: Lord Dalhousie
    difficulty: 3
    hints:
    - He was in India in the 1840s and 1850s.
    - Wellesley is linked with the subsidiary alliance.
    solution: Dalhousie took over Satara, Jhansi, Nagpur and others by the doctrine of lapse.
    mistakes:
      Robert Clive: s8_lapse
      Lord Wellesley: s8c_subsidiary
  - prompt: Plassey was in 1757 and Buxar in 1764. How many years apart?
    answer: '7'
    check: 1764-1757
    difficulty: 1
    hints:
    - Find the gap between the two years.
    - Take 1757 from 1764.
    solution: 1764 − 1757 = 7 years.
    mistakes:
      '17': s8m_years
  - prompt: Why did European traders come to India in the first place?
    options:
    - To buy spices, cotton and silk
    - To learn Sanskrit
    - To find coal
    answer: To buy spices, cotton and silk
    difficulty: 1
    hints:
    - Think of what Kerala was famous for selling.
    - Pepper fetched high prices in Europe.
    solution: Indian spices, cotton cloth and silk sold for huge profits in Europe.
    mistakes:
      To learn Sanskrit: s8_calicut
      To find coal: s8_calicut
  - prompt: Which of these kingdoms was taken by the doctrine of lapse, leading Rani Lakshmibai to fight in 1857?
    options:
    - Jhansi
    - Mysore
    - Bengal
    answer: Jhansi
    difficulty: 2
    hints:
    - Rani Lakshmibai's adopted son was not accepted.
    - Bengal was taken after Plassey and Buxar.
    solution: Jhansi was annexed in 1853 under the doctrine of lapse.
    mistakes:
      Mysore: s8_lapse
      Bengal: s8_diwani
  - prompt: Why could a trading company win battles against Indian kings?
    options:
    - It built a trained army and made alliances with local rivals
    - Indian kings had no armies
    - Britain's king fought in person
    answer: It built a trained army and made alliances with local rivals
    difficulty: 3
    hints:
    - 'Think about Plassey: who changed sides?'
    - The Company recruited sepoys and trained them.
    solution: The Company trained sepoy armies and used rivalries, like Mir Jafar's betrayal at Plassey.
    mistakes:
      Indian kings had no armies: s8_siraj
      Britain's king fought in person: s8_siraj
- code: cbse8ss.colonial.effects
  title: The impact of colonial rule
  after:
  - cbse8ss.colonial.companies
  notes: |
    Colonial rule drained wealth from India to Britain through high land revenue, the Company's profits and
    'home charges' (Dadabhai Naoroji's drain theory). Indian handicrafts and textiles declined as cheap
    machine-made British goods flooded in (deindustrialisation), while raw cotton and indigo were exported.
    Farmers were forced to grow cash crops like indigo, and famines killed millions. Railways and the
    telegraph were built mainly to move goods and troops. Resentment led to the Revolt of 1857, after which
    the British Crown took direct control of India (1858).
  explanations:
    text: British rule made India poorer. Taxes and profits flowed to Britain, Indian weavers lost their work to cheap factory cloth, and farmers were made to grow crops like indigo for export. Anger grew until the great revolt of 1857, after which the British government ruled India directly.
    visual: Draw a pipe from India to Britain labelled 'drain of wealth', carrying raw cotton, indigo and taxes, and another pipe back carrying machine-made cloth that pushes Indian weavers out.
    step_by_step: 'Step 1: High taxes and profits go to Britain. Step 2: Raw materials are exported cheaply. Step 3: Factory goods are sold back, ruining crafts. Step 4: Farmers suffer and famines strike. Step 5: Anger leads to the 1857 revolt and direct Crown rule in 1858.'
    real_world: Dhaka's fine muslin, once famous across the world, almost disappeared in the 19th century as weavers could not compete with cheap British mill cloth.
  picture:
    kind: compare
    columns:
    - title: Britain gained
      points:
      - Taxes and profits
      - Cheap raw cotton and indigo
      - A market for factory goods
    - title: India lost
      points:
      - Wealth drained away
      - Weavers and crafts ruined
      - Famines and forced cash crops
    alt: Under colonial rule Britain gained taxes, cheap raw materials and a market, while India lost wealth, crafts and suffered famines.
    caption: The 'drain of wealth'.
  activity:
    type: sort
    prompt: Effect on India?
    bins:
    - Wealth drained
    - Crafts declined
    - Farmers suffered
    - Built for British needs
    items:
    - label: Home charges sent to Britain
      bin: Wealth drained
      clue: Naoroji's theory.
      why: Drain.
    - label: Handloom weavers lose work to British cloth
      bin: Crafts declined
      clue: Deindustrialisation.
      why: Crafts.
    - label: Forced to grow indigo
      bin: Farmers suffered
      clue: Cash crops.
      why: Farmers.
    - label: Railways to move raw cotton to ports
      bin: Built for British needs
      clue: Goods and troops.
      why: British needs.
    - label: Famines killed millions
      bin: Farmers suffered
      clue: Food scarce.
      why: Farmers.
  lesson:
    - teach: 'Colonial rule drained wealth from India to Britain: high land revenue, Company profits and ''home charges'' paid in Britain. Dadabhai Naoroji called this the drain of wealth.'
      check:
        prompt: What did the 'drain of wealth' mean?
        options:
        - Indian money flowing to Britain without return
        - Floods washing away crops
        - Gold found in Indian rivers
        answer: Indian money flowing to Britain without return
        why: Taxes and profits from India were sent to Britain.
    - teach: Britain bought raw cotton and indigo cheaply from India and sold back cheap machine-made cloth. Indian weavers lost their work; this is called deindustrialisation. Farmers were forced to grow cash crops like indigo instead of food, and famines killed millions.
      picture:
        kind: compare
        columns:
        - title: India to Britain
          points:
          - Raw cotton
          - Indigo
          - Taxes and profits
        - title: Britain to India
          points:
          - Machine-made cloth
          - Factory goods
        alt: Raw cotton, indigo and money went from India to Britain; machine-made cloth and goods came back.
      check:
        prompt: What happened to many Indian handloom weavers?
        options:
        - They lost work to cheap British cloth
        - They became richer
        - They moved to Britain
        answer: They lost work to cheap British cloth
        why: Machine-made cloth was cheaper, so handloom cloth stopped selling.
    - teach: Railways and the telegraph were built mainly to move raw materials, goods and troops. Anger grew among soldiers, peasants and rulers, leading to the Revolt of 1857. After it, in 1858, the British Crown took direct control of India.
      check:
        prompt: Who ruled India directly after 1858?
        options:
        - The British Crown
        - The East India Company
        - The Mughal emperor
        answer: The British Crown
        why: The Company's rule ended; the Crown took over.
  items:
  - prompt: Who explained the 'drain of wealth' from India to Britain?
    options:
    - Dadabhai Naoroji
    - Mahatma Gandhi
    - Lord Curzon
    - Raja Ram Mohan Roy
    answer: Dadabhai Naoroji
    difficulty: 2
    hints:
    - The 'Grand Old Man of India'.
    - Poverty and Un-British Rule in India.
    solution: Dadabhai Naoroji showed how wealth was drained to Britain.
    mistakes: {"Raja Ram Mohan Roy": "s8_naoroji"}
  - prompt: Why did Indian handloom weaving decline?
    options:
    - Cheap machine-made British cloth flooded the market
    - Indians stopped wearing clothes
    - Cotton stopped growing
    - Weavers moved to Britain
    answer: Cheap machine-made British cloth flooded the market
    difficulty: 1
    hints:
    - Factories vs handlooms.
    - Price.
    solution: Cheaper British mill cloth ruined many Indian weavers.
    mistakes: {"Cotton stopped growing": "s8_handloom"}
  - prompt: Which crop were many farmers in Bengal and Bihar forced to grow for the British?
    options:
    - Indigo
    - Rice
    - Wheat
    - Millet
    answer: Indigo
    difficulty: 2
    hints:
    - A blue dye.
    - Champaran later protested.
    solution: Planters forced farmers to grow indigo for export.
    mistakes: {"Rice": "s8_indigo"}
  - prompt: Why did the British mainly build railways in India?
    options:
    - To move raw materials, goods and troops
    - Only to help Indian travellers
    - To give jobs to farmers
    - For tourism
    answer: To move raw materials, goods and troops
    difficulty: 2
    hints:
    - Whose interests came first?
    - Ports to inland areas.
    solution: Railways moved raw materials to ports, British goods inland and soldiers quickly.
    mistakes: {"Only to help Indian travellers": "s8_railways"}
  - prompt: In which year did the great revolt against Company rule begin?
    answer: '1857'
    check: '1857'
    difficulty: 1
    hints:
    - Mid-19th century.
    - Meerut, May.
    solution: The revolt began in 1857.
    mistakes: {"1757": "s8_1857", "1947": "s8_1857"}
  - prompt: What changed after the Revolt of 1857?
    options:
    - The British Crown took direct control of India
    - India became free
    - The Company gained more power
    - The Mughals took back India
    answer: The British Crown took direct control of India
    difficulty: 2
    hints:
    - '1858.'
    - Queen Victoria's proclamation.
    solution: In 1858 the Crown ended Company rule and governed India directly.
    mistakes: {"India became free": "s8_crown_rule"}
  - prompt: What is deindustrialisation?
    options:
    - Decline of India's own crafts and industries
    - Building many new factories in India
    - Moving farms to cities
    answer: Decline of India's own crafts and industries
    difficulty: 2
    hints:
    - '''De-'' means undoing.'
    - Think of what happened to weavers.
    solution: Indian crafts like handloom weaving shrank because cheap British goods replaced them.
    mistakes:
      Building many new factories in India: s8_handloom
      Moving farms to cities: s8_handloom
  - prompt: Which way did raw cotton travel under colonial rule?
    options:
    - From India to Britain
    - From Britain to India
    - It stayed in India
    answer: From India to Britain
    difficulty: 1
    hints:
    - Britain had the cotton mills.
    - Raw material goes to the factory.
    solution: Raw cotton went to British mills and came back as cloth.
    mistakes:
      From Britain to India: s8c_raw
      It stayed in India: s8c_raw
  - prompt: Why did famines become so deadly under colonial rule?
    options:
    - Farmers grew cash crops and paid high taxes, leaving little food
    - There was no rain anywhere ever
    - People refused to eat rice
    answer: Farmers grew cash crops and paid high taxes, leaving little food
    difficulty: 3
    hints:
    - Think about what farmers were made to grow.
    - And how much tax they paid.
    solution: Cash crops and heavy revenue left farmers with no reserves, so a bad year became a famine.
    mistakes:
      There was no rain anywhere ever: s8c_famine
      People refused to eat rice: s8c_famine
  - prompt: What were 'home charges'?
    options:
    - Money India paid for British officials' pensions and costs in Britain
    - Rent paid by Indian farmers
    - Taxes on houses in India
    answer: Money India paid for British officials' pensions and costs in Britain
    difficulty: 3
    hints:
    - '''Home'' here means Britain.'
    - It was part of the drain of wealth.
    solution: Home charges were costs of running India, paid in Britain from Indian revenue.
    mistakes:
      Rent paid by Indian farmers: s8_naoroji
      Taxes on houses in India: s8_naoroji
  - prompt: In which year did the British Crown take direct control of India?
    answer: '1858'
    check: 1857+1
    difficulty: 2
    hints:
    - It was the year after the great revolt.
    - Add one to the year of the revolt.
    solution: The Revolt began in 1857; the Crown took over in 1858.
    mistakes:
      '1857': s8_crown_rule
  - prompt: Who mainly gained from the indigo grown by Bengal farmers?
    options:
