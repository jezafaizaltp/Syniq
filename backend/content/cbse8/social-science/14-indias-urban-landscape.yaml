# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 14 (Part 2 chapter 7). Format: content/README.md.
subject: cbse8-ss
chapter: 14
title: India's Urban Landscape
tips:
  s8_chandigarh: "Le Corbusier planned a new city after independence."
  s8_congestion: "Fast-growing cities have many more vehicles than roads."
  s8_indore: "This city in Madhya Pradesh has topped the list many times."
  s8_jai_singh: "Jaipur is named after its founder."
  s8_metro: "A metro carries many people at once. What does that do to roads?"
  s8_migration_city: "People move for opportunities. What do cities offer?"
  s8_segregation: "Segregate means separate."
  s8_smart_cities: "The Smart Cities Mission is recent, from the mid-2010s."
  s8_urban_flood: "Concrete doesn't let water soak in. Where does the rain go?"
  s8_urban_share: "In 2011 most Indians still lived in villages. Towns and cities held well under half. Recall the Census figure."
  s8_urbanisation: "'Urban' means town or city."
  s8_varanasi: "Chandigarh and Navi Mumbai are new. Which city is thousands of years old?"
  s8u_mission: "Its name describes the kind of city it wants: clever and connected, using technology."
  s8u_basic: "AMRUT is about the basic services every city home needs. Which choice is about homes and streets?"
  s8u_river: "What does a growing town need every day that a river can give?"
  s8u_rot: "Compost comes from things that rot. Which one rots?"
  s8u_divide: "To find how many cars, divide the people by the people in each car; don't multiply."
  s8u_share: Urbanisation is about the share of people in towns, not just the number of buildings.
  s8u_grow: 'Cities grow in three ways: more births than deaths, people moving in, and nearby villages joining the city.'
  s8u_planned: 'Planned cities were designed on paper before building: straight roads, sectors, open spaces.'
  s8u_fix: Which choice tackles the cause of the problem instead of making it worse?
  s8u_percent: To find a percentage of a number, multiply by the percentage and divide by 100.

concepts:
- code: cbse8ss.urban.cities
  title: How Indian cities grow
  notes: |
    Urbanisation is the growth in the share of people living in towns and cities. In India about 31% lived in
    urban areas in 2011, and the share keeps rising. Cities grow because of natural growth, migration from
    villages and villages being absorbed into cities. Mega-cities like Mumbai, Delhi and Kolkata have more
    than 1 crore people. Cities offer jobs, colleges, hospitals and services. Some Indian cities are very old
    (Varanasi, Madurai); others were planned (Chandigarh, designed by Le Corbusier; Jaipur, planned in 1727;
    Bhubaneswar).
  explanations:
    text: More and more Indians live in towns and cities, because cities offer jobs, colleges and hospitals. Some of our cities are thousands of years old, like Varanasi, while others were carefully planned, like Jaipur in 1727 and Chandigarh in the 1950s.
    visual: Draw a village and a city connected by a road with buses full of people heading to the city, and a graph line showing the share of urban people climbing year after year.
    step_by_step: 'Step 1: Urbanisation means a bigger share of people in cities. Step 2: Cities grow by births, migration and absorbing villages. Step 3: Some cities grew naturally over centuries; some were planned. Step 4: Planned cities have grids, sectors and open spaces.'
    real_world: Jaipur, planned by Maharaja Sawai Jai Singh II in 1727 using ideas from the Vastu Shastra, has wide straight streets laid out in a grid of blocks.
  picture:
    kind: bars
    bars:
    - label: '1951'
      value: 17
    - label: '1971'
      value: 20
    - label: '1991'
      value: 26
    - label: '2011'
      value: 31
    unit: '% of Indians in towns and cities'
    caption: The share of Indians living in towns and cities keeps rising (Census figures, rounded).
    alt: Bars showing the urban share of India's population rising from about 17 per cent in 1951 to 20, 26 and 31 per cent in 1971, 1991 and 2011.
  activity:
    type: sort
    prompt: Old city or planned city?
    bins:
    - Very old city
    - Planned city
    items:
    - label: Varanasi
      bin: Very old city
      clue: On the Ganga, thousands of years.
      why: Old.
    - label: Madurai
      bin: Very old city
      clue: Temple city.
      why: Old.
    - label: Chandigarh
      bin: Planned city
      clue: Designed by Le Corbusier.
      why: Planned.
    - label: Jaipur
      bin: Planned city
      clue: Planned in 1727.
      why: Planned.
    - label: Bhubaneswar (new capital)
      bin: Planned city
      clue: Designed for a capital.
      why: Planned.
  lesson:
    - teach: Urbanisation is the growth in the share of people living in towns and cities. In 2011 about 31% of Indians lived in urban areas, up from about 17% in 1951, and the share keeps rising.
      picture:
        kind: bars
        bars:
        - label: '1951'
          value: 17
        - label: '1981'
          value: 23
        - label: '2011'
          value: 31
        unit: '% urban'
        alt: India's urban share rose from about 17% in 1951 to 23% in 1981 and 31% in 2011.
      check:
        prompt: What does the rising bar show?
        options:
        - A larger share of Indians live in cities
        - Villages are growing faster
        - Cities are shrinking
        answer: A larger share of Indians live in cities
        why: The urban share went from 17% to 31%.
    - teach: Cities grow through natural growth (more births than deaths), migration from villages for jobs, schools and hospitals, and by swallowing nearby villages. Mega-cities like Mumbai, Delhi and Kolkata have more than 1 crore people.
      check:
        prompt: 'A village at the edge of Bengaluru becomes part of the city. This is growth by:'
        options:
        - Absorbing nearby villages
        - Natural growth
        - Seasonal migration
        answer: Absorbing nearby villages
        why: The city's boundary grows to include the village.
    - teach: 'Some cities are very old and grew slowly, like Varanasi and Madurai. Others were planned: Jaipur in 1727 by Sawai Jai Singh II in a grid, Chandigarh by Le Corbusier in sectors after 1947, and Bhubaneswar as Odisha''s new capital.'
      check:
        prompt: Which is a planned city?
        options:
        - Chandigarh
        - Varanasi
        - Madurai
        answer: Chandigarh
        why: Chandigarh was designed on paper before it was built.
  items:
  - prompt: What is urbanisation?
    options:
    - The growth in the share of people living in towns and cities
    - Building villages
    - Moving from cities to villages
    - Planting trees in cities
    answer: The growth in the share of people living in towns and cities
    difficulty: 1
    hints:
    - Urban = city.
    - A rising share.
    solution: Urbanisation is the increasing proportion of people in urban areas.
    mistakes: {"Moving from cities to villages": "s8_urbanisation"}
  - prompt: About what percentage of Indians lived in urban areas in Census 2011? Type the number only.
    answer: '31'
    check: '31'
    difficulty: 2
    hints:
    - Less than a third.
    - Thirty-one.
    solution: About 31% of Indians lived in urban areas in 2011.
    mistakes: {"69": "s8_urban_share", "50": "s8_urban_share"}
  - prompt: Which city was designed by the architect Le Corbusier?
    options:
    - Chandigarh
    - Varanasi
    - Madurai
    - Kolkata
    answer: Chandigarh
    difficulty: 2
    hints:
    - Capital of Punjab and Haryana.
    - Planned in the 1950s.
    solution: Le Corbusier designed Chandigarh.
    mistakes: {"Kolkata": "s8_chandigarh"}
  - prompt: Why do many people move from villages to cities?
    options:
    - For jobs, education and health care
    - Cities have cleaner air
    - Cities have more farmland
    - Cities are quieter
    answer: For jobs, education and health care
    difficulty: 1
    hints:
    - Pull factors.
    - Opportunities.
    solution: Jobs, schools and hospitals attract people to cities.
    mistakes: {"Cities have cleaner air": "s8_migration_city"}
  - prompt: Which is one of India's oldest continuously lived-in cities?
    options:
    - Varanasi
    - Chandigarh
    - Navi Mumbai
    - Gandhinagar
    answer: Varanasi
    difficulty: 1
    hints:
    - On the Ganga.
    - Kashi.
    solution: Varanasi is among the oldest living cities in the world.
    mistakes: {"Chandigarh": "s8_varanasi"}
  - prompt: Who planned the city of Jaipur in 1727?
    options:
    - Maharaja Sawai Jai Singh II
    - Akbar
    - Lord Curzon
    - Shivaji
    answer: Maharaja Sawai Jai Singh II
    difficulty: 2
    hints:
    - He also built Jantar Mantar.
    - Rajput ruler.
    solution: Sawai Jai Singh II planned Jaipur in 1727.
    mistakes: {"Akbar": "s8_jai_singh"}
  - prompt: Which city was planned as the new capital of Odisha after independence?
    options:
    - Bhubaneswar
    - Varanasi
    - Madurai
    answer: Bhubaneswar
    difficulty: 2
    hints:
    - Odisha's old capital was Cuttack.
    - The other two are ancient temple cities.
    solution: Bhubaneswar was planned as Odisha's capital in the late 1940s.
    mistakes:
      Varanasi: s8u_planned
      Madurai: s8u_planned
  - prompt: A town grows because a new IT park brings thousands of workers from villages. Which kind of growth is this?
    options:
    - Migration
    - Natural growth
    - Absorbing villages
    answer: Migration
    difficulty: 1
    hints:
    - The people came from somewhere else.
    - Moving to a new place is called…?
    solution: People moving in for jobs is growth by migration.
    mistakes:
      Natural growth: s8u_grow
      Absorbing villages: s8u_grow
  - prompt: A country has 100 crore people, and 35 crore live in towns. What percentage is urban?
    answer: '35'
    check: 35/100*100
    difficulty: 1
    hints:
    - Percentage means out of 100.
    - Here the total is exactly 100 crore.
    solution: 35 out of 100 is 35%.
    mistakes:
      '65': s8u_share
  - prompt: Which is a mega-city with more than 1 crore people?
    options:
    - Mumbai
    - Shimla
    - Puducherry
    answer: Mumbai
    difficulty: 1
    hints:
    - It is India's financial capital.
    - Shimla and Puducherry are small cities.
    solution: Mumbai has well over 1 crore people.
    mistakes:
      Shimla: s8_urbanisation
      Puducherry: s8_urbanisation
  - prompt: Jaipur is called the 'Pink City'. What is special about its old city plan?
    options:
    - Straight streets in a grid
    - No streets at all
    - Built underground
    answer: Straight streets in a grid
    difficulty: 2
    hints:
    - It was planned in 1727.
    - Planned cities have regular layouts.
    solution: Jai Singh II laid out Jaipur with broad straight streets in a grid of blocks.
    mistakes:
      No streets at all: s8u_planned
      Built underground: s8u_planned
  - prompt: Why are many old cities like Varanasi on river banks?
    options:
    - Rivers gave water, food, transport and sacred ghats
    - Rivers kept people away
    - Rivers were dry
    answer: Rivers gave water, food, transport and sacred ghats
    difficulty: 2
    hints:
    - What does a city need most?
    - Boats carried goods long before roads.
    solution: Rivers supplied water and transport and were holy places, so towns grew on their banks.
    mistakes:
      Rivers kept people away: s8u_river
      Rivers were dry: s8u_river
  - prompt: Urban share was 17% in 1951 and 31% in 2011. By how many percentage points did it rise?
    answer: '14'
    check: 31-17
    difficulty: 1
    hints:
    - Find the difference.
    - Take the older figure from the newer one.
    solution: 31 − 17 = 14 percentage points.
    mistakes:
      '48': s8j_gap
  - prompt: Which is a pull factor drawing people into cities?
    options:
    - Colleges and hospitals
    - Traffic jams
    - Polluted air
    answer: Colleges and hospitals
    difficulty: 1
    hints:
    - A pull factor attracts.
    - Two choices are problems, not attractions.
    solution: Good colleges and hospitals pull people to cities.
    mistakes:
      Traffic jams: s8_migration_city
      Polluted air: s8_migration_city
  - prompt: Chandigarh is divided into numbered areas, each with its own shops, school and park. What are they called?
    options:
    - Sectors
    - Wards of a fort
    - Ghats
    answer: Sectors
    difficulty: 2
    hints:
    - Le Corbusier planned them.
    - You may hear 'Sector 17' for the main market.
    solution: Chandigarh's sectors are self-contained neighbourhoods.
    mistakes:
      Wards of a fort: s8_chandigarh
      Ghats: s8_chandigarh
- code: cbse8ss.urban.challenges
  title: Challenges of city life
  after:
  - cbse8ss.urban.cities
  notes: |
    Fast-growing cities face problems: housing shortages and slums, traffic jams, air and water pollution,
    waste management, water scarcity, flooding when drains are blocked, and pressure on schools and hospitals.
    Solutions include affordable housing, metro rail and buses, cycling and walking paths, waste segregation
    and recycling, rainwater harvesting, green spaces and missions like the Smart Cities Mission (2015) and
    AMRUT. Indore has repeatedly been ranked India's cleanest city in the Swachh Survekshan surveys.
  explanations:
    text: 'Cities give opportunities, but crowding brings problems: not enough homes, traffic jams, polluted air, piles of garbage and water shortages. Good public transport, waste sorting, parks and better planning can make cities healthier.'
    visual: Draw a crowded city street with smoke, traffic and garbage, then the same street redrawn with a metro line, separate bins for wet and dry waste, trees and a cycle lane.
    step_by_step: 'Step 1: Name the problem (housing, traffic, pollution, waste, water). Step 2: Find its cause (crowding, too many vehicles, no sorting). Step 3: Pick a solution (public transport, recycling, rainwater harvesting). Step 4: Think how citizens can help too.'
    real_world: Indore became India's cleanest city by making households separate wet and dry waste, collecting it door to door and turning wet waste into compost and biogas.
  picture:
    kind: compare
    columns:
    - title: Problem
      points:
      - Traffic jams
      - Air pollution
      - Garbage
      - Water shortage
      - Slums
    - title: Solution
      points:
      - Metro and buses
      - Clean fuels, fewer cars
      - Segregate and recycle
      - Rainwater harvesting
      - Affordable housing
    alt: City problems like traffic, pollution, garbage, water shortage and slums, each matched with a solution such as metro rail, recycling, rainwater harvesting and affordable housing.
    caption: Every city problem has possible solutions.
  activity:
    type: sort
    prompt: Which problem does it solve?
    bins:
    - Traffic
    - Waste
    - Flooding
    - Housing
    items:
    - label: Metro rail and buses
      bin: Traffic
      clue: Fewer cars.
      why: Traffic.
    - label: Separating wet and dry waste
      bin: Waste
      clue: Easier recycling.
      why: Waste.
    - label: Clearing drains and rainwater harvesting
      bin: Flooding
      clue: Water has somewhere to go.
      why: Flooding.
    - label: Affordable housing schemes
      bin: Housing
      clue: Fewer slums.
      why: Housing.
  lesson:
    - teach: 'Fast-growing cities face problems: too few houses and growing slums, traffic jams, air and water pollution, piles of waste, water shortage, and pressure on schools and hospitals.'
      check:
        prompt: Why do slums grow in big cities?
        options:
        - Housing is too costly for many workers
        - There are too many houses
        - Land is free
        answer: Housing is too costly for many workers
        why: Migrants who earn little cannot afford proper homes.
    - teach: When roads and buildings cover the ground with concrete and drains are blocked by plastic, rainwater cannot soak in or flow away, so streets flood. Rainwater harvesting, open green spaces and clean drains reduce flooding.
      picture:
        kind: flow
        steps:
        - Heavy rain
        - Concrete stops soaking in
        - Plastic blocks drains
        - Streets flood
        alt: Heavy rain falls on concrete that stops it soaking in; plastic blocks drains; the streets flood.
      check:
        prompt: Which helps a city flood less?
        options:
        - Parks and clean drains
        - More concrete
        - Throwing plastic in drains
        answer: Parks and clean drains
        why: Soil in parks soaks water; clean drains carry it away.
    - teach: Solutions include affordable housing, metro rail and buses, cycling and walking paths, waste segregation (wet and dry), recycling, and missions like the Smart Cities Mission (2015) and AMRUT. Indore became India's cleanest city in Swachh Survekshan by sorting waste at every home.
      check:
        prompt: What did Indore do to become so clean?
        options:
        - Sorted waste at every home and collected it daily
        - Burned all its waste
        - Stopped collecting waste
        answer: Sorted waste at every home and collected it daily
        why: Segregation at source made recycling and composting possible.
  items:
  - prompt: Which is a major problem in fast-growing cities?
    options:
    - Traffic congestion
    - Too much farmland
    - Too few vehicles
    - No buildings
    answer: Traffic congestion
    difficulty: 1
    hints:
    - Too many vehicles.
    - Jams.
    solution: Rising numbers of vehicles cause traffic congestion.
    mistakes: {"Too few vehicles": "s8_congestion"}
  - prompt: How does a metro rail help a city?
    options:
    - It moves many people quickly and reduces traffic and pollution
    - It increases the number of cars
    - It uses more petrol
    - It creates garbage
    answer: It moves many people quickly and reduces traffic and pollution
    difficulty: 1
    hints:
    - Public transport.
    - Fewer cars on roads.
    solution: Metros carry many passengers, cutting traffic and pollution.
    mistakes: {"It increases the number of cars": "s8_metro"}
  - prompt: What is waste segregation?
    options:
    - Separating wet and dry waste at home
    - Burning all waste
    - Throwing waste in rivers
    - Mixing all waste together
    answer: Separating wet and dry waste at home
    difficulty: 1
    hints:
    - Two bins.
    - Makes recycling easier.
    solution: Segregation separates wet (biodegradable) and dry waste for proper treatment.
    mistakes: {"Mixing all waste together": "s8_segregation"}
  - prompt: Which city has repeatedly been ranked India's cleanest in Swachh Survekshan?
    options:
    - Indore
    - Delhi
    - Mumbai
    - Kolkata
    answer: Indore
    difficulty: 2
    hints:
    - Madhya Pradesh.
    - I...
    solution: Indore has topped the cleanliness surveys many times.
    mistakes: {"Delhi": "s8_indore"}
  - prompt: Why do city streets flood after heavy rain?
    options:
    - Blocked drains and too much concrete stop water soaking in
    - Cities are below sea level everywhere
    - Rain is heavier in cities
    - Trees cause flooding
    answer: Blocked drains and too much concrete stop water soaking in
    difficulty: 2
    hints:
    - Where does the water go?
    - Paved surfaces and garbage in drains.
    solution: Concrete surfaces and clogged drains leave rainwater nowhere to go.
    mistakes: {"Trees cause flooding": "s8_urban_flood"}
  - prompt: When was the Smart Cities Mission launched?
    options:
    - '2015'
    - '1991'
    - '2005'
    - '1947'
    answer: '2015'
    difficulty: 3
    hints:
    - Recent decade.
    - Along with AMRUT.
    solution: The Smart Cities Mission was launched in 2015.
    mistakes: {"1991": "s8_smart_cities", "2005": "s8_smart_cities"}
  - prompt: Which kind of waste can be turned into compost?
    options:
    - Vegetable peels (wet waste)
    - Plastic bottles
    - Broken glass
    answer: Vegetable peels (wet waste)
    difficulty: 1
    hints:
    - Compost comes from things that rot.
    - Plastic and glass do not rot.
    solution: Wet kitchen waste rots into compost for soil.
    mistakes:
      Plastic bottles: s8u_rot
      Broken glass: s8u_rot
  - prompt: One metro train carries 1500 people. If they had each used a car with 1.5 people, how many cars would that be?
    answer: '1000'
    check: 1500/1.5
    difficulty: 2
    hints:
    - Each car holds 1.5 people on average.
    - Divide the people by people per car.
    solution: 1500 ÷ 1.5 = 1000 cars kept off the road.
    mistakes:
      '2250': s8u_divide
  - prompt: Which action makes city air pollution worse?
    options:
    - Burning garbage in the open
    - Planting trees along roads
    - Using buses instead of cars
    answer: Burning garbage in the open
    difficulty: 1
    hints:
    - Which one sends smoke into the air?
    - The other two help.
    solution: Open burning releases smoke and harmful gases.
    mistakes:
      Planting trees along roads: s8u_fix
      Using buses instead of cars: s8u_fix
  - prompt: Why do cities face water shortages in summer?
    options:
    - More people use water than lakes and groundwater can refill
    - Cities have no taps
    - Rain falls every day
    answer: More people use water than lakes and groundwater can refill
    difficulty: 2
    hints:
    - Compare how much is used with how much is refilled.
    - Lakes are often built over.
    solution: Rising demand and shrinking lakes mean supply runs short.
    mistakes:
      Cities have no taps: s8u_fix
      Rain falls every day: s8u_fix
  - prompt: Which mission, launched in 2015, aims to improve city services using technology?
    options:
    - Smart Cities Mission
    - Green Revolution
    - Swadeshi movement
    answer: Smart Cities Mission
    difficulty: 2
    hints:
    - Its name describes clever cities.
    - The Green Revolution was about farming.
    solution: The Smart Cities Mission (2015) funds better transport, water and digital services.
    mistakes:
      Green Revolution: s8u_mission
      Swadeshi movement: s8u_mission
  - prompt: Which is the best way to reduce traffic jams?
    options:
    - Better buses, metro and safe cycle lanes
    - Everyone buying a car
    - Closing footpaths
    answer: Better buses, metro and safe cycle lanes
    difficulty: 1
    hints:
    - Fewer vehicles means less traffic.
    - Which choice carries many people at once?
    solution: Public transport and cycling move more people with fewer vehicles.
    mistakes:
      Everyone buying a car: s8_congestion
      Closing footpaths: s8_congestion
  - prompt: A city makes 2000 tonnes of waste a day; 60% is wet waste. How many tonnes of wet waste is that?
    answer: '1200'
    check: 2000*60/100
    difficulty: 2
    hints:
    - 60% means 60 out of every 100.
    - Multiply by 60, then divide by 100.
    solution: 2000 × 60 ÷ 100 = 1200 tonnes, which could become compost.
    mistakes:
      '800': s8u_percent
  - prompt: What does AMRUT mainly improve in cities?
    options:
    - Water supply, sewerage and green spaces
    - Military forts
    - Village farms
    answer: Water supply, sewerage and green spaces
    difficulty: 3
    hints:
    - It is a city mission like Smart Cities.
    - It deals with basic services.
    solution: AMRUT funds water taps, sewers, drains and parks in cities.
    mistakes:
      Military forts: s8u_basic
      Village farms: s8u_basic
  - prompt: Why does plastic make city floods worse?
    options:
    - It blocks drains so water can't flow away
    - It soaks up all the rain
    - It makes rain stop
    answer: It blocks drains so water can't flow away
    difficulty: 1
    hints:
    - Think about where plastic bags end up.
    - What happens when a pipe is blocked?
    solution: Plastic clogs drains, so rainwater backs up on streets.
    mistakes:
      It soaks up all the rain: s8_urban_flood
      It makes rain stop: s8_urban_flood
