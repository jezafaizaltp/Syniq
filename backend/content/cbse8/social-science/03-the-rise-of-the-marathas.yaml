  - prompt: Why did guerrilla warfare suit the Western Ghats?
    options:
    - Hills and forests made surprise attacks and quick escapes easy
    - The land was flat and open
    - There were no roads to march on at all
    answer: Hills and forests made surprise attacks and quick escapes easy
    difficulty: 2
    hints:
    - Guerrilla fighters strike and hide.
    - What does hilly forest land give them?
    solution: Small bands knew the hills and could strike large armies and vanish.
