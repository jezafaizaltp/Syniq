      Shivneri: s8_navy
      Raigad: s8_navy
  - prompt: From whose court did Shivaji escape in 1666?
    options:
    - Aurangzeb's court at Agra
    - The Bijapur Sultan's court
    - The British court at Bombay
    answer: Aurangzeb's court at Agra
    difficulty: 2
