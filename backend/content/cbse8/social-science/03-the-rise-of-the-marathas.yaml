    - Naval battles only
    answer: Guerrilla warfare
    difficulty: 2
    hints:
    - Small, fast surprise attacks.
    - Using the terrain.
    solution: Shivaji used guerrilla tactics suited to the hilly Sahyadris.
    mistakes: {"Trench warfare": "s8_guerrilla"}
  - prompt: Where was Shivaji born?
    options:
    - Shivneri
    - Raigad
    - Agra
    - Delhi
    answer: Shivneri
    difficulty: 2
