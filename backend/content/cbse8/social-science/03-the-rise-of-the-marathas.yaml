- code: cbse8ss.maratha.peshwas
  title: The Peshwas and Maratha expansion
  after:
  - cbse8ss.maratha.shivaji
  notes: |
    After Shivaji, the Marathas continued the struggle against Aurangzeb; Tarabai led resistance after
    Rajaram's death. In the 18th century the Peshwas (chief ministers), beginning with Balaji Vishwanath and
    especially Baji Rao I, became the real leaders, ruling from Pune. Maratha power spread to Gujarat, Malwa,
    Bundelkhand and as far as Delhi and Attock; families like the Holkars, Scindias, Gaekwads and Bhonsles
    ruled regions. Ahilyabai Holkar of Indore was a famous administrator. The Marathas lost heavily to Ahmad
    Shah Abdali at the Third Battle of Panipat (1761), and were later defeated by the British in the
    Anglo-Maratha wars (by 1818).
  explanations:
    text: After Shivaji, the Peshwas, the chief ministers in Pune, led the Marathas to become the strongest power in India in the 18th century, reaching from Maharashtra to the north. A heavy defeat at Panipat in 1761 and later wars with the British ended their dominance.
    visual: Draw a map with Pune at the centre and arrows spreading north to Gujarat, Malwa, Delhi and Attock, labelled with the Holkar, Scindia, Gaekwad and Bhonsle families. Put a red cross at Panipat 1761.
    step_by_step: 'Step 1: Marathas keep resisting Aurangzeb after Shivaji. Step 2: The Peshwas take charge from Pune. Step 3: Baji Rao I expands north. Step 4: 1761, defeat at Panipat. Step 5: By 1818, the British defeat the Marathas.'
    real_world: Ahilyabai Holkar, who ruled Indore in the 18th century, rebuilt temples and ghats from Kashi to Somnath and is remembered for fair, careful government.
  picture:
    kind: compare
    columns:
    - title: Rise
      points:
      - Peshwas rule from Pune
      - Baji Rao I expands north
      - Reach Delhi and Attock
      - Holkars, Scindias, Gaekwads
    - title: Decline
      points:
      - '1761: Third Battle of Panipat'
      - Rivalry among chiefs
      - Anglo-Maratha wars
      - British victory by 1818
    alt: The Maratha rise under the Peshwas to Delhi and Attock, and their decline after Panipat in 1761 and the Anglo-Maratha wars.
    caption: The strongest Indian power of the 18th century.
  activity:
    type: sort
    prompt: Who or what?
    bins:
    - Baji Rao I
    - Ahilyabai Holkar
    - Tarabai
    - Third Battle of Panipat
    items:
    - label: Peshwa who spread Maratha power north
      bin: Baji Rao I
      clue: Pune.
      why: Baji Rao I.
    - label: Famous administrator of Indore
      bin: Ahilyabai Holkar
      clue: Holkar queen.
      why: Ahilyabai.
    - label: Led resistance after Rajaram's death
      bin: Tarabai
      clue: Against Aurangzeb.
      why: Tarabai.
    - label: Heavy loss to Ahmad Shah Abdali (1761)
      bin: Third Battle of Panipat
      clue: A battle.
      why: Panipat III.
  lesson:
    - teach: After Shivaji died in 1680, Aurangzeb attacked the Marathas for over twenty years. After Rajaram's death, his widow Tarabai led the resistance, and the Marathas survived.
      check:
        prompt: Who led Maratha resistance after Rajaram died?
        options:
        - Tarabai
        - Ahilyabai Holkar
        - Rani Durgavati
        answer: Tarabai
        why: Tarabai, Rajaram's widow, kept fighting Aurangzeb.
      ways:
      - style: visual
        teach: How the Marathas survived Aurangzeb's long war after Shivaji's death.
        picture:
          kind: flow
          steps:
          - '1680: Shivaji dies'
          - Aurangzeb marches into the Deccan to crush the Marathas
          - Rajaram keeps the fight going
          - '1700: Rajaram dies; his widow Tarabai takes charge'
          - '1707: Aurangzeb dies; the Marathas have survived'
          alt: Shivaji dies in 1680, Aurangzeb attacks the Marathas, Rajaram and then Tarabai lead the resistance, and when Aurangzeb dies in 1707 the Marathas are still standing.
      - style: real_world
        teach: Aurangzeb spent the last twenty-five years of his life in the Deccan and never returned to Delhi. The long war emptied the Mughal treasury, while the Marathas, who knew the land, kept slipping away and coming back.
    - teach: In the 1700s the Peshwas, the chief ministers, became the real leaders, ruling from Pune. Balaji Vishwanath began this, and Baji Rao I spread Maratha power north. Families such as the Holkars (Indore), Scindias (Gwalior), Gaekwads (Baroda) and Bhonsles (Nagpur) ruled regions. Ahilyabai Holkar was a famous ruler of Indore.
      picture:
        kind: compare
        columns:
        - title: Family
          points:
          - Holkars
          - Scindias
          - Gaekwads
          - Bhonsles
        - title: Capital
          points:
          - Indore
          - Gwalior
          - Baroda
          - Nagpur
        alt: 'Maratha families and their capitals: Holkars at Indore, Scindias at Gwalior, Gaekwads at Baroda, Bhonsles at Nagpur.'
      check:
        prompt: Which family ruled from Gwalior?
        options:
        - Scindias
        - Holkars
        - Gaekwads
        answer: Scindias
        why: The Scindias' capital was Gwalior.
      ways:
      - style: step_by_step
        teach: 'Step 1: The Chhatrapati remains king in name. Step 2: The Peshwa, the chief minister in Pune, takes the real decisions. Step 3: Leading families hold regions: Holkar at Indore, Scindia at Gwalior, Gaekwad at Baroda, Bhonsle at Nagpur. Step 4: Together they act as a loose union under the Peshwa.'
      - style: real_world
        teach: Ahilyabai Holkar's work can still be seen. She rebuilt the Kashi Vishwanath temple in Varanasi, and Maheshwar on the Narmada, her capital, is still known for the Maheshwari saris whose weaving she encouraged.
    - teach: Maratha power reached as far as Delhi and Attock. But in 1761 they lost heavily to Ahmad Shah Abdali at the Third Battle of Panipat. Later they fought three wars with the British and were finally defeated by 1818.
      check:
        prompt: Who finally defeated the Marathas by 1818?
        options:
        - The British
        - Ahmad Shah Abdali
        - The Mughals
        answer: The British
        why: The Third Anglo-Maratha War ended Maratha power in 1818.
      ways:
      - style: visual
        teach: From the height of Maratha power to its end.
        picture:
          kind: flow
          steps:
          - 'Mid-1700s: Maratha power reaches Delhi and Attock'
          - '1761: heavy defeat by Abdali at Panipat'
          - Three wars with the British follow
          - '1818: the Marathas are finally defeated'
          alt: Maratha power reaches Delhi and Attock, suffers a heavy defeat at Panipat in 1761, fights three wars with the British and ends in 1818.
      - style: real_world
        teach: In Pune, visitors still walk through the great gate of Shaniwar Wada, the fortified palace that Baji Rao I built for the Peshwas. When the British took Pune in the last of the three wars, Peshwa rule from it came to an end.
  items:
  - prompt: What was the title of the Maratha chief minister who became the real ruler?
    options:
    - Peshwa
    - Sultan
    - Nawab
    - Diwan
    answer: Peshwa
    difficulty: 1
    hints:
    - Ruled from Pune.
    - Baji Rao I held it.
    solution: The Peshwa became the effective head of the Maratha state.
    mistakes: {"Nawab": "s8_peshwa", "Diwan": "s8_peshwa"}
  - prompt: Who fought the Marathas at the Third Battle of Panipat in 1761?
    options:
    - Ahmad Shah Abdali
    - Babur
    - Robert Clive
    - Nadir Shah
    answer: Ahmad Shah Abdali
    difficulty: 2
    hints:
    - An Afghan ruler.
    - Not Babur (1526).
    solution: The Marathas lost to Ahmad Shah Abdali at Panipat in 1761.
    mistakes: {"Babur": "s8_abdali", "Nadir Shah": "s8_abdali"}
  - prompt: Which Maratha queen of Indore is famous for building temples and ghats?
    options:
    - Ahilyabai Holkar
    - Tarabai
    - Rani Lakshmibai
    - Jijabai
    answer: Ahilyabai Holkar
    difficulty: 2
    hints:
    - Indore.
    - Holkar family.
    solution: Ahilyabai Holkar ruled Indore and built temples and ghats across India.
    mistakes: {"Rani Lakshmibai": "s8_ahilyabai"}
  - prompt: From which city did the Peshwas rule?
    options:
    - Pune
    - Delhi
    - Agra
    - Raigad
    answer: Pune
    difficulty: 1
    hints:
    - Shaniwar Wada.
    - Maharashtra.
    solution: The Peshwas ruled from Pune.
    mistakes: {"Raigad": "s8_pune"}
  - prompt: Which Peshwa is famous for expanding Maratha power into north India?
    options:
    - Baji Rao I
    - Balaji Vishwanath
    - Madhav Rao II
    - Nana Sahib
    answer: Baji Rao I
    difficulty: 2
    hints:
    - Never lost a battle, it is said.
    - Early 18th century.
    solution: Baji Rao I led campaigns into Malwa, Bundelkhand and up to Delhi.
    mistakes: {"Balaji Vishwanath": "s8_bajirao"}
  - prompt: The Third Battle of Panipat was in 1761 and the Marathas lost to the British by 1818. How many years apart is that?
    answer: '57'
    check: 1818 - 1761
    difficulty: 2
    hints:
    - Subtract.
    - 1818 − 1761.
    solution: 1818 − 1761 = 57 years.
    mistakes: {"67": "s8_year_gap", "47": "s8_year_gap"}
  - prompt: Which Peshwa began the line of powerful Peshwas?
    options:
    - Balaji Vishwanath
    - Baji Rao II
    - Nana Saheb of 1857
    answer: Balaji Vishwanath
    difficulty: 3
    hints:
    - He was the father of Baji Rao I.
    - He served Shahu in the early 1700s.
    solution: Balaji Vishwanath became Peshwa in 1713 and made the post powerful.
    mistakes:
      Baji Rao II: s8_peshwa
      Nana Saheb of 1857: s8_peshwa
  - prompt: Which Maratha family ruled from Baroda (Vadodara)?
    options:
    - Gaekwads
    - Bhonsles
    - Holkars
    answer: Gaekwads
    difficulty: 2
    hints:
    - Baroda is in Gujarat.
    - Holkars were at Indore; Bhonsles at Nagpur.
    solution: The Gaekwads ruled Baroda in Gujarat.
    mistakes:
      Bhonsles: s8mr_families
      Holkars: s8mr_families
  - prompt: Why is Ahilyabai Holkar remembered?
    options:
    - As a wise ruler who built temples, ghats and roads
    - As the founder of the Mughal Empire
    - As the leader who lost at Panipat
    answer: As a wise ruler who built temples, ghats and roads
    difficulty: 2
    hints:
    - She ruled Indore in the 1700s.
    - Her work can be seen at Varanasi and many pilgrim towns.
    solution: Ahilyabai ruled Indore well and built temples, ghats, wells and rest houses across India.
    mistakes:
      As the founder of the Mughal Empire: s8_ahilyabai
      As the leader who lost at Panipat: s8_ahilyabai
  - prompt: Who led the Maratha resistance after Rajaram's death?
    options:
    - Tarabai
    - Ahilyabai Holkar
    - Rani Lakshmibai
    answer: Tarabai
    difficulty: 2
    hints:
    - She was Rajaram's widow.
    - Lakshmibai belongs to 1857.
    solution: Tarabai kept fighting Aurangzeb's armies until his death in 1707.
    mistakes:
      Ahilyabai Holkar: s8mr_tarabai
      Rani Lakshmibai: s8mr_tarabai
  - prompt: Which power did the Marathas fight in three wars that ended in 1818?
    options:
    - The British East India Company
    - The Ahoms
    - The Portuguese
    answer: The British East India Company
    difficulty: 2
    hints:
    - They were called the Anglo-___ wars.
    - '''Anglo'' means English.'
    solution: The three Anglo-Maratha wars ended with British victory in 1818.
    mistakes:
      The Ahoms: s8mr_british
      The Portuguese: s8mr_british
  - prompt: Why did the Third Battle of Panipat matter so much?
    options:
    - Huge Maratha losses checked their rise in the north
    - It made the Marathas rulers of all India
    - It ended the Delhi Sultanate
    answer: Huge Maratha losses checked their rise in the north
    difficulty: 3
    hints:
    - Think of who won in 1761.
    - The Sultanate had ended in 1526.
    solution: Abdali's victory killed many Maratha leaders and soldiers and slowed their northern expansion.
    mistakes:
      It made the Marathas rulers of all India: s8_abdali
      It ended the Delhi Sultanate: s8_panipat1
  - prompt: Shivaji died in 1680 and Aurangzeb died in 1707. For how many years did the Marathas resist him after Shivaji?
    answer: '27'
    check: 1707-1680
    difficulty: 2
    hints:
    - Find the gap between two years.
    - Take 1680 from 1707.
    solution: 1707 − 1680 = 27 years.
    mistakes:
      '37': s8_year_gap
  - prompt: Which family ruled Nagpur?
    options:
    - Bhonsles
    - Scindias
    - Gaekwads
    answer: Bhonsles
    difficulty: 2
    hints:
    - Nagpur is in central India.
    - Scindias were at Gwalior; Gaekwads at Baroda.
    solution: The Bhonsles ruled Nagpur.
    mistakes:
      Scindias: s8mr_families
      Gaekwads: s8mr_families
  - prompt: How far north-west did Maratha power reach at its height?
    options:
    - Attock on the Indus
    - Kanyakumari
    - Chittagong
    answer: Attock on the Indus
    difficulty: 3
    hints:
    - It is a town on a great river in today's Pakistan.
    - Kanyakumari is the far south.
    solution: In 1758 Maratha armies reached Attock on the Indus.
    mistakes:
      Kanyakumari: s8_bajirao
      Chittagong: s8_bajirao
  - prompt: 'Assertion (A): In the 1700s the Peshwas became the real leaders of the Marathas.

      Reason (R): The Peshwas ruled from Pune.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, but R does not explain A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both are true, but ruling from Pune does not explain why the chief ministers became more powerful than the king.
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): The Marathas won the Third Battle of Panipat in 1761.

      Reason (R): The Third Battle of Panipat was fought against Ahmad Shah Abdali.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: the Marathas lost heavily at Panipat in 1761. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A traveller in the 1750s visits Indore, Gwalior, Baroda and Nagpur and finds a different Maratha family ruling in each. Which list gives the families in that order?'
    options:
    - Holkar, Scindia, Gaekwad, Bhonsle
    - Scindia, Holkar, Bhonsle, Gaekwad
    - Gaekwad, Bhonsle, Holkar, Scindia
    answer: Holkar, Scindia, Gaekwad, Bhonsle
    hints:
    - Ahilyabai ruled Indore. Which family was hers?
    - Baroda is in Gujarat; Nagpur is in central India.
    solution: Holkars ruled Indore, Scindias Gwalior, Gaekwads Baroda and Bhonsles Nagpur.
    mistakes:
      Scindia, Holkar, Bhonsle, Gaekwad: s8mr_families
      Gaekwad, Bhonsle, Holkar, Scindia: s8mr_families
    exam: case
    difficulty: 2
  - prompt: 'Situation: Arrange these in the order they happened: (P) the Third Battle of Panipat, (Q) Tarabai leads the resistance, (R) the final defeat by the British, (S) Baji Rao I spreads Maratha power north.'
    options:
    - Q, S, P, R
    - S, Q, P, R
    - Q, P, S, R
    answer: Q, S, P, R
    hints:
    - Tarabai fought Aurangzeb, who died in 1707.
    - Panipat was in 1761; the British won by 1818.
    solution: Tarabai led the resistance around 1700, Baji Rao I expanded north in the following decades, Panipat came in 1761 and the British won by 1818.
    mistakes:
      S, Q, P, R: pqc8ss3_order
      Q, P, S, R: pqc8ss3_order
    exam: competency
    difficulty: 2
