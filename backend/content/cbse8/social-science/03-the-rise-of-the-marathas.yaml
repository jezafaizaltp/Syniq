    reasons:
      Defeats Afzal Khan at Pratapgad (1659): He fought Bijapur's general as a young leader.
      Escapes from Aurangzeb's court at Agra (1666): Agra came seven years after Pratapgad.
      Crowned Chhatrapati at Raigad (1674): His coronation came after his escape.
