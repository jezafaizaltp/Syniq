  - prompt: 'Situation: A ruler wants to protect trading ports on the Konkan coast from powers that attack from the sea. Which of Shivaji''s steps answers this need?'
    options:
    - Building a navy and sea forts such as Sindhudurg
    - Collecting chauth from neighbouring areas
    - Using Marathi in government
    answer: Building a navy and sea forts such as Sindhudurg
    hints:
    - Where does the danger come from?
    - What can meet an enemy at sea?
    solution: Shivaji built a navy and sea forts such as Sindhudurg to guard the Konkan coast.
    mistakes:
