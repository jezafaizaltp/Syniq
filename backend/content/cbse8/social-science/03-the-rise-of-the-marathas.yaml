    - He fought the British at sea
    - He sailed to Europe
    answer: He built a navy and sea forts to guard the coast
    difficulty: 2
    hints:
    - Konkan coast.
    - Sindhudurg.
    solution: Shivaji built a navy and sea forts to protect the western coast.
    mistakes: {"He invented ships": "s8_navy"}
  - prompt: Whom did Shivaji defeat at Pratapgad in 1659?
    options:
    - Afzal Khan
    - Aurangzeb
    - Ibrahim Lodi
    - Robert Clive
    answer: Afzal Khan
    difficulty: 2
    hints:
    - A Bijapur general.
    - A famous meeting.
    solution: Shivaji defeated the Bijapur general Afzal Khan at Pratapgad.
    mistakes: {"Aurangzeb": "s8_afzal"}
  - prompt: Which sea fort did Shivaji build to guard the Konkan coast?
    options:
    - Sindhudurg
    - Shivneri
    - Raigad
    answer: Sindhudurg
    difficulty: 2
    hints:
    - '''Sindhu'' means sea.'
    - Shivneri and Raigad are hill forts.
    solution: Sindhudurg was built on an island off the Konkan coast.
