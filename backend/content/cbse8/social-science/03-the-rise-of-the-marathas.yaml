concepts:
- code: cbse8ss.maratha.shivaji
  title: Shivaji and the Maratha state
  notes: |
    Shivaji (born 1630 at Shivneri) built a Maratha kingdom in the western Deccan, challenging the Bijapur
    Sultanate and the Mughals. He used the hilly terrain and forts (Raigad, Pratapgad, Sinhagad), guerrilla
    tactics, and a navy with sea forts like Sindhudurg. He defeated Afzal Khan at Pratapgad (1659) and escaped
    from Aurangzeb's court at Agra (1666). He was crowned Chhatrapati at Raigad in 1674. He ran his state with
    a council of eight ministers (Ashtapradhan), collected chauth and sardeshmukhi, and promoted Marathi and
    Sanskrit in administration.
  explanations:
    text: Shivaji built a kingdom in the hills of Maharashtra using forts, fast-moving soldiers and even a navy. He was crowned Chhatrapati in 1674 and ran his state with a council of eight ministers, laying the foundation of Maratha power.
    visual: Draw the Sahyadri hills with forts on the peaks (Raigad, Pratapgad, Sinhagad) and sea forts like Sindhudurg along the coast, with arrows showing quick hill-paths between them.
    step_by_step: 'Step 1: 1630, Shivaji is born at Shivneri. Step 2: He captures forts and builds an army and navy. Step 3: 1659, he defeats Afzal Khan. Step 4: 1666, he escapes from Agra. Step 5: 1674, he is crowned at Raigad.'
    real_world: Sindhudurg sea fort, built by Shivaji off the Konkan coast, still stands; Shivaji is often called the father of the Indian Navy.
  picture:
    kind: flow
    steps:
    - '1630: born at Shivneri'
    - Forts and guerrilla army
    - '1659: defeats Afzal Khan'
    - '1666: escapes from Agra'
    - '1674: crowned Chhatrapati at Raigad'
    alt: Shivaji's life from his birth at Shivneri in 1630 to his coronation at Raigad in 1674.
