# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2025), chapter 3. Format: content/README.md.
subject: cbse8-ss
chapter: 3
title: The Rise of the Marathas
tips:
  s8_abdali: "Babur fought the First Battle of Panipat. Who came from Afghanistan to fight the Third?"
  s8_afzal: "Aurangzeb was the Mughal emperor. Which Bijapur general did Shivaji face at Pratapgad?"
  s8_ahilyabai: "Rani Lakshmibai was from Jhansi. Which queen ruled Indore?"
