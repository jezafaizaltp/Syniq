    - Naval warfare; ships cut off the supplies
    answer: Guerrilla warfare; the hills hide a fast-moving force
    hints:
    - Is the small force standing and fighting, or striking and leaving?
    - What does the land give the side that knows it?
    solution: Quick surprise attacks followed by vanishing into the hills are guerrilla tactics; hilly, forested land makes them work.
