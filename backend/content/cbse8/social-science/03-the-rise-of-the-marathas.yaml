    answer: A quarter of the land revenue paid to the Marathas
    difficulty: 2
    hints:
    - It was a tax.
    - '''Chauth'' comes from the word for four.'
    solution: Chauth was one-fourth of the revenue of an area, paid to avoid Maratha raids.
    mistakes:
      A Maratha warship: s8mr_taxes
      A kind of hill fort: s8mr_taxes
  - prompt: Why did guerrilla warfare suit the Western Ghats?
    options:
    - Hills and forests made surprise attacks and quick escapes easy
