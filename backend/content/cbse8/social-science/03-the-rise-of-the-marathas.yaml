concepts:
- code: cbse8ss.maratha.shivaji
  title: Shivaji and the Maratha state
  notes: |
    Shivaji (born 1630 at Shivneri) built a Maratha kingdom in the western Deccan, challenging the Bijapur
    Sultanate and the Mughals. He used the hilly terrain and forts (Raigad, Pratapgad, Sinhagad), guerrilla
    tactics, and a navy with sea forts like Sindhudurg. He defeated Afzal Khan at Pratapgad (1659) and escaped
    from Aurangzeb's court at Agra (1666). He was crowned Chhatrapati at Raigad in 1674. He ran his state with
    a council of eight ministers (Ashtapradhan), collected chauth and sardeshmukhi, and promoted Marathi and
    Sanskrit in administration.
  explanations:
    text: Shivaji built a kingdom in the hills of Maharashtra using forts, fast-moving soldiers and even a navy. He was crowned Chhatrapati in 1674 and ran his state with a council of eight ministers, laying the foundation of Maratha power.
    visual: Draw the Sahyadri hills with forts on the peaks (Raigad, Pratapgad, Sinhagad) and sea forts like Sindhudurg along the coast, with arrows showing quick hill-paths between them.
    step_by_step: 'Step 1: 1630, Shivaji is born at Shivneri. Step 2: He captures forts and builds an army and navy. Step 3: 1659, he defeats Afzal Khan. Step 4: 1666, he escapes from Agra. Step 5: 1674, he is crowned at Raigad.'
    real_world: Sindhudurg sea fort, built by Shivaji off the Konkan coast, still stands; Shivaji is often called the father of the Indian Navy.
  picture:
    kind: flow
    steps:
    - '1630: born at Shivneri'
    - Forts and guerrilla army
    - '1659: defeats Afzal Khan'
    - '1666: escapes from Agra'
    - '1674: crowned Chhatrapati at Raigad'
    alt: Shivaji's life from his birth at Shivneri in 1630 to his coronation at Raigad in 1674.
  activity:
    type: order
    prompt: Shivaji's life. Put it in order.
    steps:
    - Born at Shivneri (1630)
    - Defeats Afzal Khan at Pratapgad (1659)
    - Escapes from Aurangzeb's court at Agra (1666)
    - Crowned Chhatrapati at Raigad (1674)
    reasons:
      Defeats Afzal Khan at Pratapgad (1659): He fought Bijapur's general as a young leader.
      Escapes from Aurangzeb's court at Agra (1666): Agra came seven years after Pratapgad.
      Crowned Chhatrapati at Raigad (1674): His coronation came after his escape.
  lesson:
    - teach: Shivaji was born in 1630 at Shivneri fort. He built a Maratha kingdom in the hilly western Deccan, taking on the Bijapur Sultanate and the Mughals. Hill forts like Raigad, Pratapgad and Sinhagad were the backbone of his state.
      check:
        prompt: Why were hill forts so useful to Shivaji?
        options:
        - They were hard for big armies to attack
        - They were close to the sea for trade only
        - They were built by the Mughals for him
        answer: They were hard for big armies to attack
        why: High, steep forts could be defended by a few soldiers against large armies.
    - teach: 'His soldiers used guerrilla tactics: quick surprise attacks, then vanishing into the hills. He defeated Afzal Khan of Bijapur at Pratapgad (1659) and escaped from Aurangzeb''s court at Agra (1666). He built a navy and sea forts such as Sindhudurg to guard the Konkan coast.'
      picture:
        kind: flow
        steps:
        - 1630 born at Shivneri
        - 1659 Pratapgad win
        - 1666 escape from Agra
        - 1674 crowned at Raigad
        alt: 'Shivaji''s life in order: born 1630, Pratapgad 1659, escape from Agra 1666, coronation 1674.'
      check:
        prompt: Which came first?
        options:
        - Victory at Pratapgad
        - Escape from Agra
        - Coronation at Raigad
        answer: Victory at Pratapgad
        why: Pratapgad was 1659, Agra 1666 and the coronation 1674.
    - teach: In 1674 Shivaji was crowned Chhatrapati at Raigad. He ran his state with the Ashtapradhan, a council of eight ministers, and collected chauth (a quarter of revenue) and sardeshmukhi (an extra tenth) from neighbouring areas. He used Marathi and Sanskrit in government.
      check:
        prompt: How many ministers were in the Ashtapradhan?
        options:
        - '8'
        - '5'
        - '12'
        answer: '8'
        why: '''Ashta'' means eight.'
