    - A hill fort near Pune.
    - The name sounds like his.
    solution: Shivaji was born at Shivneri fort in 1630.
    mistakes: {"Raigad": "s8_shivneri"}
  - prompt: Why is Shivaji called the father of the Indian Navy?
    options:
    - He built a navy and sea forts to guard the coast
