- code: cbse8ss.maratha.peshwas
  title: The Peshwas and Maratha expansion
  after:
  - cbse8ss.maratha.shivaji
  notes: |
    After Shivaji, the Marathas continued the struggle against Aurangzeb; Tarabai led resistance after
    Rajaram's death. In the 18th century the Peshwas (chief ministers), beginning with Balaji Vishwanath and
    especially Baji Rao I, became the real leaders, ruling from Pune. Maratha power spread to Gujarat, Malwa,
    Bundelkhand and as far as Delhi and Attock; families like the Holkars, Scindias, Gaekwads and Bhonsles
    ruled regions. Ahilyabai Holkar of Indore was a famous administrator. The Marathas lost heavily to Ahmad
    Shah Abdali at the Third Battle of Panipat (1761), and were later defeated by the British in the
    Anglo-Maratha wars (by 1818).
  explanations:
    text: After Shivaji, the Peshwas, the chief ministers in Pune, led the Marathas to become the strongest power in India in the 18th century, reaching from Maharashtra to the north. A heavy defeat at Panipat in 1761 and later wars with the British ended their dominance.
    visual: Draw a map with Pune at the centre and arrows spreading north to Gujarat, Malwa, Delhi and Attock, labelled with the Holkar, Scindia, Gaekwad and Bhonsle families. Put a red cross at Panipat 1761.
    step_by_step: 'Step 1: Marathas keep resisting Aurangzeb after Shivaji. Step 2: The Peshwas take charge from Pune. Step 3: Baji Rao I expands north. Step 4: 1761, defeat at Panipat. Step 5: By 1818, the British defeat the Marathas.'
    real_world: Ahilyabai Holkar, who ruled Indore in the 18th century, rebuilt temples and ghats from Kashi to Somnath and is remembered for fair, careful government.
  picture:
    kind: compare
    columns:
    - title: Rise
      points:
      - Peshwas rule from Pune
      - Baji Rao I expands north
      - Reach Delhi and Attock
      - Holkars, Scindias, Gaekwads
    - title: Decline
      points:
      - '1761: Third Battle of Panipat'
      - Rivalry among chiefs
      - Anglo-Maratha wars
      - British victory by 1818
    alt: The Maratha rise under the Peshwas to Delhi and Attock, and their decline after Panipat in 1761 and the Anglo-Maratha wars.
    caption: The strongest Indian power of the 18th century.
  activity:
    type: sort
    prompt: Who or what?
    bins:
    - Baji Rao I
    - Ahilyabai Holkar
    - Tarabai
    - Third Battle of Panipat
    items:
    - label: Peshwa who spread Maratha power north
      bin: Baji Rao I
      clue: Pune.
      why: Baji Rao I.
    - label: Famous administrator of Indore
      bin: Ahilyabai Holkar
      clue: Holkar queen.
      why: Ahilyabai.
    - label: Led resistance after Rajaram's death
      bin: Tarabai
      clue: Against Aurangzeb.
      why: Tarabai.
    - label: Heavy loss to Ahmad Shah Abdali (1761)
      bin: Third Battle of Panipat
      clue: A battle.
      why: Panipat III.
  lesson:
    - teach: After Shivaji died in 1680, Aurangzeb attacked the Marathas for over twenty years. After Rajaram's death, his widow Tarabai led the resistance, and the Marathas survived.
      check:
        prompt: Who led Maratha resistance after Rajaram died?
        options:
        - Tarabai
        - Ahilyabai Holkar
        - Rani Durgavati
        answer: Tarabai
        why: Tarabai, Rajaram's widow, kept fighting Aurangzeb.
    - teach: In the 1700s the Peshwas, the chief ministers, became the real leaders, ruling from Pune. Balaji Vishwanath began this, and Baji Rao I spread Maratha power north. Families such as the Holkars (Indore), Scindias (Gwalior), Gaekwads (Baroda) and Bhonsles (Nagpur) ruled regions. Ahilyabai Holkar was a famous ruler of Indore.
      picture:
        kind: compare
        columns:
        - title: Family
          points:
          - Holkars
          - Scindias
          - Gaekwads
          - Bhonsles
        - title: Capital
          points:
          - Indore
          - Gwalior
          - Baroda
          - Nagpur
        alt: 'Maratha families and their capitals: Holkars at Indore, Scindias at Gwalior, Gaekwads at Baroda, Bhonsles at Nagpur.'
      check:
        prompt: Which family ruled from Gwalior?
        options:
        - Scindias
        - Holkars
        - Gaekwads
        answer: Scindias
        why: The Scindias' capital was Gwalior.
    - teach: Maratha power reached as far as Delhi and Attock. But in 1761 they lost heavily to Ahmad Shah Abdali at the Third Battle of Panipat. Later they fought three wars with the British and were finally defeated by 1818.
      check:
        prompt: Who finally defeated the Marathas by 1818?
        options:
        - The British
        - Ahmad Shah Abdali
        - The Mughals
        answer: The British
        why: The Third Anglo-Maratha War ended Maratha power in 1818.
