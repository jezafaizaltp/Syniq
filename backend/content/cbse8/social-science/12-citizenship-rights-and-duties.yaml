# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 12 (Part 2 chapter 5). Format: content/README.md.
subject: cbse8-ss
chapter: 12
title: 'Citizenship: Rights and Duties'
tips:
  s8_active_citizen: "An active citizen takes part. Which choice shows that?"
  s8_duties_1976: "Fundamental Duties were added by the 42nd Amendment during the Emergency."
  s8_eleven_duties: "The first list of duties came in 1976, and one more was added in 2002 with the Right to Education. Count the full list."
  s8_environment_duty: "Duties are for all citizens. Which choice is a duty to the country?"
  s8_equality: "Refusing someone because of caste treats them as unequal."
  s8_exploitation: "Child labour is a kind of exploitation."
  s8_limits: "Your freedom stops where it harms others."
  s8_parent_duty: "This duty was added in 2002 along with the Right to Education."
  s8_public_property: "A bus belongs to everyone. Which duty protects it?"
  s8_remedies: "'Remedy' means a cure. Which right lets you go to court?"
  s8_rte: "RTE covers the years of elementary school, from Class 1 to Class 8."
  s8_six_rights: "There were seven, but the Right to Property was removed in 1978."
  s8cz_count: "Count every class from the first to the last, including both ends."
  s8cz_amend: "Duties came in 1976, during the Emergency. The 61st Amendment was in 1988 and the 86th in 2002. Which number fits 1976?"
  s8cz_match: 'Read what is being protected: equal treatment, freedom, safety from forced work, faith, culture, or the right to go to court?'
  s8cz_freedom: Speaking, moving, gathering and choosing a job are all parts of one right. Which one?
  s8cz_right_or_duty: A right is what you can claim; a duty is what you owe. Which is this?
  s8cz_duty_pick: Which choice is something every citizen is asked to do for the country, not to gain for themselves?
  s8cz_active: Active citizens take part. Which choice shows someone acting for the community?

concepts:
- code: cbse8ss.citizen.rights
  title: Citizenship and Fundamental Rights
  notes: |
    A citizen is a full member of a country with rights and duties. The Constitution guarantees six
    Fundamental Rights: Right to Equality, Right to Freedom (speech, movement, profession and more), Right
    against Exploitation (no forced labour or child labour in hazardous work), Right to Freedom of Religion,
    Cultural and Educational Rights, and the Right to Constitutional Remedies. The Right to Education (Article
    21A, 2009 Act) gives free and compulsory education to children aged 6–14. Rights have reasonable limits so
    that one person's rights don't harm others.
  explanations:
    text: 'As a citizen of India you have Fundamental Rights that no government can take away: to be treated equally, to speak freely, to follow your religion, to be protected from exploitation, and to go to court if these rights are broken. Children aged 6 to 14 also have the right to free schooling.'
    visual: 'Draw a hand with six fingers, one for each Fundamental Right: Equality, Freedom, Against Exploitation, Religion, Culture and Education, Constitutional Remedies.'
    step_by_step: 'Step 1: Learn the six Fundamental Rights. Step 2: Match a situation to the right it protects. Step 3: Remember rights have reasonable limits. Step 4: If a right is violated, go to court (constitutional remedies).'
    real_world: Because of the Right against Exploitation, employing a child under 14 in a factory or a dangerous job is against the law in India.
  picture:
    kind: compare
    columns:
    - title: Fundamental Right
      points:
      - Equality
      - Freedom
      - Against exploitation
      - Freedom of religion
      - Cultural and educational
      - Constitutional remedies
    - title: What it protects
      points:
      - Equal treatment, no discrimination
      - Speech, movement, work
      - No forced or child labour
      - Follow any faith
      - Protect language and culture
      - Go to court if rights are broken
    alt: The six Fundamental Rights and what each protects, from equality and freedom to the right to go to court.
    caption: Six rights guaranteed to every citizen.
  activity:
    type: sort
    prompt: Which Fundamental Right?
    bins:
    - Right to Equality
    - Right to Freedom
    - Right against Exploitation
    - Right to Constitutional Remedies
    items:
    - label: No one is above the law
      bin: Right to Equality
      clue: Same for all.
      why: Equality.
    - label: Free speech and movement
      bin: Right to Freedom
      clue: Liberty.
      why: Freedom.
    - label: No child labour in hazardous work
      bin: Right against Exploitation
      clue: Protection.
      why: Exploitation.
    - label: Go to court if rights are violated
      bin: Right to Constitutional Remedies
      clue: Ambedkar called it the heart.
      why: Remedies.
    - label: No forced labour
      bin: Right against Exploitation
      clue: Protection.
      why: Exploitation.
  lesson:
    - teach: A citizen is a full member of a country, with rights and duties. The Constitution guarantees six Fundamental Rights to protect every citizen.
      picture:
        kind: compare
        columns:
        - title: Rights 1–3
          points:
          - Equality
          - Freedom (speech, movement, job…)
          - Against Exploitation
        - title: Rights 4–6
          points:
          - Freedom of Religion
          - Cultural and Educational
          - Constitutional Remedies
        alt: 'The six Fundamental Rights: Equality, Freedom, Against Exploitation, Freedom of Religion, Cultural and Educational, Constitutional Remedies.'
      check:
        prompt: How many Fundamental Rights are there?
        options:
        - '6'
        - '11'
        - '3'
        answer: '6'
        why: Six rights; eleven is the number of duties.
    - teach: 'Right to Equality: no discrimination by religion, caste, gender or place of birth, and untouchability is abolished. Right to Freedom: speech, peaceful gathering, movement, living anywhere in India and choosing any job. Right against Exploitation: no forced labour, no trafficking, no children under 14 in dangerous work.'
      check:
        prompt: A girl writes a letter to the newspaper criticising the town council. Which right protects her?
        options:
        - Right to Freedom
        - Right against Exploitation
        - Cultural and Educational Rights
        answer: Right to Freedom
        why: Freedom of speech and expression is part of the Right to Freedom.
    - teach: Freedom of Religion lets everyone follow, practise and spread their faith. Cultural and Educational Rights protect minorities' languages and let them run schools. Constitutional Remedies let you go to court if any right is violated. The Right to Education gives free, compulsory schooling to children aged 6–14. Rights have reasonable limits so that one person's freedom does not harm others.
      check:
        prompt: Can free speech be used to spread lies that start a riot?
        options:
        - No, rights have reasonable limits
        - Yes, speech has no limits
        - Only on weekends
        answer: No, rights have reasonable limits
        why: Freedom cannot be used to harm public order or others.
  items:
  - prompt: How many Fundamental Rights does the Constitution list today?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'Count: equality, freedom, exploitation, religion, culture-education, remedies.'
    - Six.
    solution: There are six Fundamental Rights.
    mistakes: {"7": "s8_six_rights"}
  - prompt: Which right protects children from working in dangerous factories?
    options:
    - Right against Exploitation
    - Right to Freedom of Religion
    - Right to Equality
    - Cultural and Educational Rights
    answer: Right against Exploitation
    difficulty: 1
    hints:
    - Forced or child labour.
    - Exploitation.
    solution: The Right against Exploitation forbids child labour in hazardous work.
    mistakes: {"Right to Equality": "s8_exploitation"}
  - prompt: The Right to Education guarantees free and compulsory education for children of which ages?
    options:
    - 6 to 14
    - 3 to 6
    - 14 to 18
    - All ages
    answer: 6 to 14
    difficulty: 2
    hints:
    - Classes 1 to 8.
    - Article 21A.
    solution: The RTE gives free, compulsory education to children aged 6–14.
    mistakes: {"14 to 18": "s8_rte", "3 to 6": "s8_rte"}
  - prompt: Which right allows you to go to court if your rights are violated?
    options:
    - Right to Constitutional Remedies
    - Right to Equality
    - Right to Freedom
    - Right to Property
    answer: Right to Constitutional Remedies
    difficulty: 2
    hints:
    - Ambedkar called it the heart of the Constitution.
    - Remedies.
    solution: The Right to Constitutional Remedies lets citizens approach courts to enforce rights.
    mistakes: {"Right to Equality": "s8_remedies"}
  - prompt: A shop refuses entry to a person because of their caste. Which right is violated?
    options:
    - Right to Equality
    - Right to Freedom of Religion
    - Cultural and Educational Rights
    - Right against Exploitation
    answer: Right to Equality
    difficulty: 1
    hints:
    - Discrimination.
    - Equal treatment.
    solution: Discrimination on the basis of caste violates the Right to Equality.
    mistakes: {"Right against Exploitation": "s8_equality"}
  - prompt: Why do Fundamental Rights have reasonable limits?
    options:
    - So one person's freedom doesn't harm others or public order
    - So the government can take them away anytime
    - Because they aren't important
    - To stop people voting
    answer: So one person's freedom doesn't harm others or public order
    difficulty: 3
    hints:
    - Free speech doesn't allow spreading hatred.
    - Balance.
    solution: Limits balance individual freedom with others' rights and public order.
    mistakes: {"So the government can take them away anytime": "s8_limits"}
  - prompt: A family from Kerala moves to Assam for work. Which right allows this?
    options:
    - Right to Freedom
    - Right to Equality
    - Freedom of Religion
    answer: Right to Freedom
    difficulty: 2
    hints:
    - It is about moving and living anywhere in India.
    - It also covers choosing a job.
    solution: Freedom to move and live anywhere in India is part of the Right to Freedom.
    mistakes:
      Right to Equality: s8cz_freedom
      Freedom of Religion: s8cz_freedom
  - prompt: A linguistic minority wants to run its own school. Which right protects this?
    options:
    - Cultural and Educational Rights
    - Right against Exploitation
    - Right to Freedom of Religion
    answer: Cultural and Educational Rights
    difficulty: 3
    hints:
    - It protects minorities' language and culture.
    - It lets them set up schools.
    solution: Cultural and Educational Rights let minorities keep their culture and run institutions.
    mistakes:
      Right against Exploitation: s8cz_match
      Right to Freedom of Religion: s8cz_match
  - prompt: Which practice was abolished by the Right to Equality?
    options:
    - Untouchability
    - Voting
    - Paying taxes
    answer: Untouchability
    difficulty: 2
    hints:
    - It treated some people as lower by birth.
    - Dr Ambedkar fought against it.
    solution: Article 17 abolished untouchability under the Right to Equality.
    mistakes:
      Voting: s8_equality
      Paying taxes: s8_equality
  - prompt: A 10-year-old is made to work in a firecracker unit. Which right is violated?
    options:
    - Right against Exploitation
    - Right to Freedom of Religion
    - Cultural and Educational Rights
    answer: Right against Exploitation
    difficulty: 1
    hints:
    - Children under 14 may not work in dangerous places.
    - Forced or harmful work is the issue.
    solution: Hazardous child labour violates the Right against Exploitation.
    mistakes:
      Right to Freedom of Religion: s8cz_match
      Cultural and Educational Rights: s8cz_match
  - prompt: Why did Dr Ambedkar call the Right to Constitutional Remedies the 'heart and soul' of the Constitution?
    options:
    - Without it, no other right could be enforced
    - It lets the government ignore courts
    - It is about religion
    answer: Without it, no other right could be enforced
    difficulty: 3
    hints:
    - A right is useless if you cannot claim it.
    - This right lets you go to court.
    solution: This right lets citizens go to court to enforce all their other rights.
    mistakes:
      It lets the government ignore courts: s8_remedies
      It is about religion: s8_remedies
  - prompt: The Right to Education covers Classes 1 to 8. How many classes is that?
    answer: '8'
    check: 8-1+1
    difficulty: 1
    hints:
    - Count Class 1, Class 2 and so on up to the last one.
    - When you count both the first and the last, add one to the difference.
    solution: 8 − 1 + 1 = 8 classes of elementary school, for children about 6 to 14 years old.
    mistakes:
      '7': s8cz_count
  - prompt: A temple, a mosque and a church stand on the same street, and people worship freely. Which right is at work?
    options:
    - Right to Freedom of Religion
    - Right against Exploitation
    - Right to Constitutional Remedies
    answer: Right to Freedom of Religion
    difficulty: 1
    hints:
    - It is about faith.
    - Everyone may follow their own belief.
    solution: Freedom of Religion lets everyone practise their faith.
    mistakes:
      Right against Exploitation: s8cz_match
      Right to Constitutional Remedies: s8cz_match
  - prompt: Is voting a Fundamental Right listed in Part III of the Constitution?
    options:
    - No, it is a constitutional right given by Article 326
    - Yes, it is the seventh Fundamental Right
    - No, only rich people can vote
    answer: No, it is a constitutional right given by Article 326
    difficulty: 3
    hints:
    - There are only six Fundamental Rights.
    - Universal adult franchise comes from another Article.
    solution: Voting comes from Article 326 (adult suffrage), not from the six Fundamental Rights.
    mistakes:
      Yes, it is the seventh Fundamental Right: s8_six_rights
      No, only rich people can vote: s8v_who_votes
  - prompt: Which is a citizen's right, not a duty?
    options:
    - Speaking freely
    - Protecting public property
    - Respecting the National Flag
    answer: Speaking freely
    difficulty: 2
    hints:
    - A right is something you can claim.
    - Two of these are things you owe the country.
    solution: Free speech is a right; protecting property and respecting the flag are duties.
    mistakes:
      Protecting public property: s8cz_right_or_duty
      Respecting the National Flag: s8cz_right_or_duty
- code: cbse8ss.citizen.duties
  title: Fundamental Duties and active citizenship
  after:
  - cbse8ss.citizen.rights
  notes: |
    Fundamental Duties were added to the Constitution in 1976 (Article 51A, 42nd Amendment); there are now 11.
    They include respecting the Constitution, the National Flag and the National Anthem; protecting the
    sovereignty and unity of India; promoting harmony; protecting the environment; developing a scientific
    temper; safeguarding public property; striving for excellence; and (for parents) providing education to
    children aged 6–14. Active citizens vote, pay taxes, follow laws, help their community and raise their
    voice peacefully against injustice.
  explanations:
    text: Rights come with duties. The Constitution lists 11 Fundamental Duties, like respecting the flag and anthem, protecting the environment and public property, and developing a scientific way of thinking. Good citizens also vote, follow rules and help their communities.
    visual: 'Draw a two-sided coin: one side ''Rights'' (equality, freedom, education), the other side ''Duties'' (respect the flag, protect nature, keep public property safe).'
    step_by_step: 'Step 1: Remember duties were added in 1976. Step 2: There are 11 of them in Article 51A. Step 3: Match an action to a duty (e.g. not damaging a bus seat: protecting public property). Step 4: Practise active citizenship every day.'
    real_world: In the Swachh Bharat campaign, students and neighbourhoods cleaned streets and stopped littering, a way of performing the duty to protect the environment and public spaces.
  picture:
    kind: compare
    columns:
    - title: Rights (what we get)
      points:
      - Equality
      - Freedom of speech
      - Education (6–14)
      - Freedom of religion
    - title: Duties (what we give)
      points:
      - Respect the Constitution, flag, anthem
      - Protect the environment
      - Safeguard public property
      - Develop scientific temper
    alt: 'Rights and duties as two sides of a coin: rights like equality and education, and duties like respecting the flag, protecting the environment and public property.'
    caption: Rights and duties go together.
  activity:
    type: sort
    prompt: Right or duty?
    bins:
    - Fundamental Right
    - Fundamental Duty
    items:
    - label: Freedom of speech
      bin: Fundamental Right
      clue: What you get.
      why: Right.
    - label: Respect the National Flag
      bin: Fundamental Duty
      clue: What you owe.
      why: Duty.
    - label: Protect the environment
      bin: Fundamental Duty
      clue: Article 51A.
      why: Duty.
    - label: Free education, ages 6–14
      bin: Fundamental Right
      clue: Article 21A.
      why: Right.
    - label: Safeguard public property
      bin: Fundamental Duty
      clue: Article 51A.
      why: Duty.
  lesson:
    - teach: Rights come with duties. Fundamental Duties were added in 1976 by the 42nd Amendment, in Article 51A. There are now 11.
      check:
        prompt: Which Article lists the Fundamental Duties?
        options:
        - Article 51A
        - Article 32
        - Article 21A
        answer: Article 51A
        why: 51A holds the duties; 32 is remedies; 21A is education.
    - teach: 'Duties include: respecting the Constitution, Flag and Anthem; protecting the unity of India; promoting harmony; protecting forests, rivers and wildlife; developing a scientific temper; safeguarding public property; striving for excellence; and, for parents, giving education to children aged 6–14.'
      picture:
        kind: compare
        columns:
        - title: Toward the nation
          points:
          - Respect Constitution, Flag, Anthem
          - Protect unity
          - Defend the country when called
        - title: Toward people and nature
          points:
          - Promote harmony
          - Protect environment
          - Safeguard public property
          - Educate children 6–14
        alt: Some duties are toward the nation (respect symbols, protect unity), others toward people and nature (harmony, environment, public property, education).
      check:
        prompt: Which is a Fundamental Duty?
        options:
        - Developing a scientific temper
        - Earning a high salary
        - Owning a car
        answer: Developing a scientific temper
        why: Thinking with evidence and reason is one of the duties.
    - teach: 'Active citizens go beyond the minimum: they vote, pay taxes, follow laws, help their community, report problems, and raise their voice peacefully against injustice.'
      check:
        prompt: Which is an example of active citizenship?
        options:
        - Organising a clean-up of the local pond
        - Throwing waste on the road
        - Skipping every election
        answer: Organising a clean-up of the local pond
        why: Taking action for the community is active citizenship.
  items:
  - prompt: How many Fundamental Duties are there now?
    answer: '11'
    check: '11'
    difficulty: 1
    hints:
    - Article 51A.
    - Eleven.
    solution: There are 11 Fundamental Duties.
    mistakes: {"10": "s8_eleven_duties"}
  - prompt: In which year were Fundamental Duties added to the Constitution?
    answer: '1976'
    check: '1976'
    difficulty: 2
    hints:
    - 42nd Amendment.
    - Mid-1970s.
    solution: They were added by the 42nd Amendment in 1976.
    mistakes: {"1950": "s8_duties_1976", "2002": "s8_duties_1976"}
  - prompt: Which is a Fundamental Duty?
    options:
    - Protecting the natural environment
    - Voting for a particular party
    - Paying a fixed amount to charity
    - Joining the army compulsorily
    answer: Protecting the natural environment
    difficulty: 1
    hints:
    - Forests, lakes, rivers, wildlife.
    - 51A(g).
    solution: Protecting and improving the environment is a Fundamental Duty.
    mistakes: {"Voting for a particular party": "s8_environment_duty"}
  - prompt: Damaging a public bus breaks which duty?
    options:
    - Safeguarding public property
    - Respecting the National Anthem
    - Developing scientific temper
    - Promoting harmony
    answer: Safeguarding public property
    difficulty: 1
    hints:
    - Public property belongs to all.
    - Buses, parks, trains.
    solution: Citizens have a duty to protect public property.
    mistakes: {"Promoting harmony": "s8_public_property"}
  - prompt: Which is an example of active citizenship?
    options:
    - Voting in elections and helping the community
    - Throwing litter on the road
    - Ignoring others' problems
    - Breaking traffic rules
    answer: Voting in elections and helping the community
    difficulty: 1
    hints:
    - Taking part.
    - Responsible action.
    solution: Active citizens take part in democracy and community life.
    mistakes: {"Ignoring others' problems": "s8_active_citizen"}
  - prompt: Which duty applies especially to parents?
    options:
    - Providing education to their children aged 6–14
    - Paying all their children's taxes
    - Choosing their children's religion
    - Voting on their behalf
    answer: Providing education to their children aged 6–14
    difficulty: 2
    hints:
    - Added in 2002.
    - Linked to the RTE.
    solution: Parents and guardians must give children aged 6–14 the opportunity of education.
    mistakes: {"Choosing their children's religion": "s8_parent_duty"}
  - prompt: Fundamental Duties were added by which amendment?
    options:
    - 42nd
    - 61st
    - 86th
    answer: 42nd
    difficulty: 2
    hints:
    - It was in 1976.
    - The 61st lowered the voting age.
    solution: The 42nd Amendment (1976) added Article 51A.
    mistakes:
      61st: s8cz_amend
      86th: s8cz_amend
  - prompt: Students paint over graffiti on a public wall. Which duty are they doing?
    options:
    - Safeguarding public property
    - Defending the country's borders
    - Protecting wildlife
    answer: Safeguarding public property
    difficulty: 1
    hints:
    - The wall belongs to everyone.
    - They are caring for shared things.
    solution: Caring for public walls, buses and parks is safeguarding public property.
    mistakes:
      Defending the country's borders: s8cz_duty_pick
      Protecting wildlife: s8cz_duty_pick
  - prompt: A boy checks a WhatsApp rumour against reliable news before sharing it. Which duty is this?
    options:
    - Developing a scientific temper
    - Respecting the National Anthem
    - Protecting public property
    answer: Developing a scientific temper
    difficulty: 2
    hints:
    - He asks for evidence before believing.
    - It is about how we think.
    solution: Checking facts and asking questions shows a scientific temper.
    mistakes:
      Respecting the National Anthem: s8cz_duty_pick
      Protecting public property: s8_public_property
  - prompt: Duties were added in 1976; the Constitution began in 1950. How many years later?
    answer: '26'
    check: 1976-1950
    difficulty: 1
    hints:
    - Find the gap between the two years.
    - Take 1950 from 1976.
    solution: 1976 − 1950 = 26 years.
    mistakes:
      '36': s8i_years
  - prompt: Why do duties matter alongside rights?
    options:
    - Rights work only if everyone respects others and the country
    - Duties cancel rights
    - Duties are only for the government
    answer: Rights work only if everyone respects others and the country
    difficulty: 2
    hints:
    - My right to clean air needs your duty not to pollute.
    - Rights and duties go together.
    solution: One person's right depends on others doing their duty.
    mistakes:
      Duties cancel rights: s8_eleven_duties
      Duties are only for the government: s8_eleven_duties
  - prompt: Neighbours of different religions celebrate Onam and Eid together. Which duty does this show?
    options:
    - Promoting harmony and brotherhood
    - Safeguarding public property
    - Defending the country
    answer: Promoting harmony and brotherhood
    difficulty: 1
    hints:
    - It is about living together in peace.
    - Different faiths, one community.
    solution: Celebrating together promotes harmony among all people.
    mistakes:
      Safeguarding public property: s8cz_duty_pick
      Defending the country: s8cz_duty_pick
  - prompt: Which is NOT a Fundamental Duty?
    options:
    - Voting for a particular party
    - Protecting the environment
    - Respecting the Constitution
    answer: Voting for a particular party
    difficulty: 2
    hints:
    - Two are real duties in Article 51A.
    - No one can be told whom to vote for.
    solution: The Constitution never asks citizens to support a party; the vote is free and secret.
    mistakes:
      Protecting the environment: s8_environment_duty
      Respecting the Constitution: s8_eleven_duties
  - prompt: Which action shows active citizenship?
    options:
    - Writing to the panchayat about a broken streetlight
    - Ignoring a broken streetlight
    - Breaking another streetlight
    answer: Writing to the panchayat about a broken streetlight
    difficulty: 1
    hints:
    - Active means taking part.
    - Which choice tries to fix a problem?
    solution: Reporting problems to local government helps the whole community.
    mistakes:
      Ignoring a broken streetlight: s8cz_active
      Breaking another streetlight: s8cz_active
  - prompt: A father keeps his 12-year-old daughter at home to do chores instead of school. Which duty is he failing?
    options:
    - Providing education to his child aged 6–14
    - Protecting wildlife
    - Respecting the National Flag
    answer: Providing education to his child aged 6–14
    difficulty: 2
    hints:
    - This duty is for parents.
    - It matches the Right to Education ages.
    solution: Parents must give their children aged 6–14 a chance to study.
    mistakes:
      Protecting wildlife: s8_parent_duty
      Respecting the National Flag: s8_parent_duty
