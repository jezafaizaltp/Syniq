# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 10 (Part 2 chapter 3). Format: content/README.md.
subject: cbse8-ss
chapter: 10
title: A Journey Through Indian Architecture
tips:
  s8_ajanta: "Elephanta has sculptures of Shiva. Which caves are famous for Buddhist paintings?"
  s8_dilwara: "Khajuraho's temples are in Madhya Pradesh and are not Jain marble temples. Where are the white-marble Jain temples?"
  s8_great_bath: "Hampi and Sanchi are much later. The Great Bath is Harappan."
  s8_harappan_drains: "Harappan cities were planned. Which feature shows that?"
  s8_indo_islamic: "Stupas and toranas are Buddhist. What came with Islamic builders?"
  s8_indo_saracenic: "Indo-Saracenic is colonial-era. Which building is from British times?"
  s8_kailasa: "The Kailasa temple was cut from the hillside downwards. Out of how many rocks?"
  s8_rajaraja: "Krishnadevaraya ruled Vijayanagara centuries later. The Thanjavur temple was built by a Chola king."
  s8_shah_jahan: "Akbar built Fatehpur Sikri. Who built the Taj for his wife?"
  s8_shikhara: "Vimana and gopuram belong to southern (Dravida) temples. The northern Nagara tower has a different name."
  s8_stupa: "A stupa is Buddhist. What shape is it and what does it hold?"
  s8_torana: "Gopurams are temple towers in the south. What are a stupa's gateways called?"
  s8a_water: "Think about what a bath must do with the water poured into it."
  s8a_bce: "BCE years count backwards from year 1. To go from a BCE year to a CE year, add the two numbers."
  s8a_period: 'Put the periods in order: Harappan cities, then stupas and caves, then temples, then Indo-Islamic, then colonial buildings.'
  s8a_faith: "Which faith is this building linked with: Buddhist, Jain, Hindu, Sikh or Islamic? Match the clue in the question."
  s8a_style: Northern temples rise in a curved tower; southern temples rise in stepped storeys like a pyramid.
  s8a_place: 'Picture the map: which state is this monument in?'
  s8a_feature: 'Look for the feature that the new style added: pointed shapes and round tops, not flat beams.'

concepts:
- code: cbse8ss.arch.early
  title: 'Early Indian architecture: cities, stupas and caves'
  notes: |
    The Harappan (Indus Valley) cities, about 2600–1900 BCE, such as Mohenjo-daro and Dholavira, had planned
    streets, baked-brick houses, covered drains and the Great Bath. Buddhist stupas are dome-shaped mounds
    holding relics, with railings and carved gateways (toranas), as at Sanchi (begun under Ashoka) and
    Bharhut. Rock-cut caves were carved into hillsides: Udayagiri–Khandagiri (Jain), the painted Buddhist caves
    of Ajanta, and Ellora with Buddhist, Hindu and Jain shrines, including the Kailasa temple carved from a
    single rock. Stepwells like Rani ki Vav in Gujarat stored water.
  explanations:
    text: India's buildings tell its history. Over 4,000 years ago Harappan cities had straight streets and covered drains. Later came round Buddhist stupas like Sanchi, and whole temples carved out of rock, like the Kailasa temple at Ellora, cut from one single hill.
    visual: 'Draw a timeline of buildings: a grid of Harappan streets, the dome of Sanchi with its gateway, the caves of Ajanta in a cliff, and the Kailasa temple being carved from the top of a rock downwards.'
    step_by_step: 'Step 1: Harappan cities: planning, bricks, drains. Step 2: Stupas: domes holding relics, with toranas. Step 3: Rock-cut caves: carved into hills for monks and worship. Step 4: Kailasa at Ellora: a whole temple from one rock.'
    real_world: Rani ki Vav, a stepwell in Patan, Gujarat, is so finely carved that it appears on the back of India's ₹100 note and is a UNESCO World Heritage Site.
  picture:
    kind: flow
    steps:
    - 'Harappan cities: planned streets and drains'
    - 'Stupas: Sanchi and Bharhut'
    - 'Rock-cut caves: Ajanta and Ellora'
    - 'Kailasa temple: carved from one rock'
    - 'Stepwells: Rani ki Vav'
    alt: Early Indian architecture from planned Harappan cities to stupas, rock-cut caves, the Kailasa temple and stepwells.
  activity:
    type: sort
    prompt: Which kind of structure?
    bins:
    - Stupa
    - Rock-cut cave
    - Stepwell
    - Harappan city
    items:
    - label: Sanchi, with carved gateways
      bin: Stupa
      clue: Dome holding relics.
      why: Stupa.
    - label: Ajanta paintings
      bin: Rock-cut cave
      clue: Carved into a hill.
      why: Cave.
    - label: Kailasa temple at Ellora
      bin: Rock-cut cave
      clue: Cut from one rock.
      why: Rock-cut.
    - label: Rani ki Vav
      bin: Stepwell
      clue: Stores water.
      why: Stepwell.
    - label: Dholavira
      bin: Harappan city
      clue: Planned streets.
      why: Harappan.
  lesson:
    - teach: About 4,500 years ago, Harappan cities like Mohenjo-daro and Dholavira had straight streets in a grid, houses of baked brick, covered drains and the Great Bath, a large waterproof tank.
      check:
        prompt: What do covered drains tell us about Harappan cities?
        options:
        - They were carefully planned
        - They had no water
        - They were built in a hurry
        answer: They were carefully planned
        why: Drains along every street need planning before building.
    - teach: Buddhist stupas are dome-shaped mounds holding relics of the Buddha or monks. A railing goes around, and carved gateways called toranas tell stories. The Great Stupa at Sanchi was begun under Ashoka.
      picture:
        kind: compare
        columns:
        - title: Stupa
          points:
          - Dome-shaped mound
          - Holds relics
          - Railing and toranas
          - Sanchi, Bharhut
        - title: Rock-cut cave
          points:
          - Carved into a hill
          - Halls and shrines
          - Wall paintings
          - Ajanta, Ellora
        alt: Stupas are dome mounds with relics and carved gateways; rock-cut caves are halls carved into hills, like Ajanta and Ellora.
      check:
        prompt: What is kept inside a stupa?
        options:
        - Relics
        - Grain
        - Weapons
        answer: Relics
        why: Stupas were built over relics, such as ashes or bones of holy people.
    - teach: Rock-cut caves were carved into hillsides. Ajanta has beautiful Buddhist wall paintings. Ellora has Buddhist, Hindu and Jain caves side by side, and its Kailasa temple was cut from one huge rock, from the top down. Stepwells like Rani ki Vav in Gujarat stored water and were richly carved.
      check:
        prompt: Ellora's caves belong to which faiths?
        options:
        - Buddhist, Hindu and Jain
        - Only Buddhist
        - Only Jain
        answer: Buddhist, Hindu and Jain
        why: All three are found together at Ellora, showing harmony.
  items:
  - prompt: Which Harappan city had the famous Great Bath?
    options:
    - Mohenjo-daro
