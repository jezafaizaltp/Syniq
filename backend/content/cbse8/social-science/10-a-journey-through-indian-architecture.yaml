    - He was a Mauryan emperor who spread Buddhism.
    - The others built temples and tombs much later.
    solution: Ashoka began the Sanchi stupa in the 3rd century BCE.
    mistakes:
      Shah Jahan: s8a_period
      Rajaraja Chola I: s8a_period
  - prompt: In which state are the Ajanta and Ellora caves?
    options:
    - Maharashtra
    - Kerala
    - Punjab
    answer: Maharashtra
    difficulty: 2
    hints:
    - They are near Aurangabad (Chhatrapati Sambhajinagar).
    - It is in the western Deccan.
    solution: Both cave sites are in Maharashtra.
    mistakes:
      Kerala: s8a_place
      Punjab: s8a_place
  - prompt: Why was the Great Bath built with tightly fitted bricks and a layer of bitumen?
    options:
    - To keep water from leaking
    - To make it look shiny
    - To keep animals out
    answer: To keep water from leaking
    difficulty: 2
    hints:
    - Bitumen is a sticky tar.
    - A bath must hold water.
    solution: Bitumen and fitted bricks made the tank waterproof.
    mistakes:
      To make it look shiny: s8a_water
      To keep animals out: s8a_water
  - prompt: Which is a rock-cut monument?
    options:
    - Kailasa temple, Ellora
    - Great Stupa, Sanchi
    - Taj Mahal
    answer: Kailasa temple, Ellora
    difficulty: 2
    hints:
    - It was carved out of a hill, not built up from blocks.
    - The others are built of stone or brick.
    solution: The Kailasa temple was cut from a single rock.
    mistakes:
      Great Stupa, Sanchi: s8_stupa
      Taj Mahal: s8a_period
  - prompt: What was a stepwell used for?
    options:
    - Storing water to use in dry months
    - Burying kings
    - Keeping weapons
    answer: Storing water to use in dry months
    difficulty: 1
    hints:
    - Steps lead down to the water.
    - Gujarat and Rajasthan are dry.
    solution: Stepwells like Rani ki Vav stored water for the dry season.
    mistakes:
      Burying kings: s8a_faith
      Keeping weapons: s8a_faith
  - prompt: Harappan cities flourished around 2600 BCE. How many years before 2000 CE is that?
    answer: '4600'
    check: 2600+2000
    difficulty: 3
    hints:
    - BCE years count back from year 1.
    - Add the years on both sides of year 1.
    solution: 2600 years before CE plus 2000 years after = about 4600 years.
    mistakes:
      '600': s8a_bce
  - prompt: Which is the oldest kind of building in this list?
    options:
    - Harappan drains
