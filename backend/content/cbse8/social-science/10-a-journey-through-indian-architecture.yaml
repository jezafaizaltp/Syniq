    mistakes:
      Mughal battles: s8a_faith
      British trade: s8a_period
- code: cbse8ss.arch.temples
  title: Temples, forts, tombs and colonial buildings
  after:
  - cbse8ss.arch.early
  notes: |
    From the Gupta period, temples had a garbhagriha (sanctum) and mandapas (halls), with a curved shikhara in
    the northern Nagara style (Kandariya Mahadeva, Khajuraho) or a stepped vimana in the southern Dravida style
    (Brihadisvara, Thanjavur, built by Rajaraja Chola I around 1010). Jain marble temples at Dilwara (Mount
    Abu). Indo-Islamic architecture brought arches, domes and minarets: Qutb Minar, Humayun's Tomb (1570s),
    the Taj Mahal and Delhi's Jama Masjid (Shah Jahan). Rajput forts like Mehrangarh. The Golden Temple in
    Amritsar. Colonial-era Indo-Saracenic buildings mixed styles: Victoria Memorial, Madras High Court, Mysuru
    Palace.
  explanations:
    text: 'Different eras left different buildings: temples with tall towers in the north and stepped towers in the south, forts on hills, domed tombs and mosques, and grand colonial buildings. Many mix styles, showing how cultures met and blended.'
    visual: 'Draw two temple towers side by side: a curved, beehive-like shikhara (Nagara, north) and a stepped pyramid vimana (Dravida, south). Below, draw an onion dome and minarets (Indo-Islamic).'
    step_by_step: 'Step 1: Curved tower over the sanctum: Nagara style (north). Step 2: Stepped pyramid tower: Dravida style (south). Step 3: Arches, domes and minarets: Indo-Islamic. Step 4: Mixed Indian, Islamic and Gothic features: Indo-Saracenic (colonial).'
    real_world: The Brihadisvara temple in Thanjavur, over 1000 years old, has a vimana about 66 m tall, topped by a capstone weighing many tonnes, raised without modern machines.
  picture:
    kind: compare
    columns:
    - title: Nagara (north)
      points:
      - Curved shikhara tower
      - Khajuraho temples
      - Often on a raised platform
    - title: Dravida (south)
      points:
      - Stepped vimana tower
      - Brihadisvara, Thanjavur
      - Big gateway towers (gopurams)
    - title: Indo-Islamic
      points:
      - Arches, domes, minarets
      - Taj Mahal, Qutb Minar
      - Gardens and calligraphy
    alt: 'Three architectural styles: Nagara temples with curved towers, Dravida temples with stepped vimanas, and Indo-Islamic buildings with arches, domes and minarets.'
    caption: The tower and the dome tell you the style.
  activity:
    type: sort
    prompt: Which style?
    bins:
    - Nagara (north)
    - Dravida (south)
    - Indo-Islamic
    - Indo-Saracenic (colonial)
    items:
    - label: Kandariya Mahadeva, curved shikhara
      bin: Nagara (north)
      clue: Khajuraho.
      why: Nagara.
    - label: Brihadisvara, stepped vimana
      bin: Dravida (south)
      clue: Thanjavur.
      why: Dravida.
    - label: 'Taj Mahal: domes and minarets'
      bin: Indo-Islamic
      clue: Mughal.
      why: Indo-Islamic.
    - label: Qutb Minar
      bin: Indo-Islamic
      clue: Delhi Sultanate.
      why: Indo-Islamic.
    - label: Victoria Memorial
      bin: Indo-Saracenic (colonial)
      clue: Mixed styles.
      why: Colonial.
  lesson:
    - teach: Hindu temples have a garbhagriha (sanctum) where the deity is kept, and mandapas (halls) for people. In the northern Nagara style a curved tower called a shikhara rises over the sanctum, as at Kandariya Mahadeva, Khajuraho. In the southern Dravida style a stepped tower called a vimana rises, as at the Brihadisvara temple, Thanjavur, built by Rajaraja Chola I around 1010.
      picture:
        kind: compare
        columns:
        - title: Nagara (north)
          points:
          - Curved shikhara
          - Kandariya Mahadeva, Khajuraho
        - title: Dravida (south)
          points:
          - Stepped vimana
          - Big gateway towers (gopurams)
          - Brihadisvara, Thanjavur
        alt: Northern Nagara temples have a curved shikhara; southern Dravida temples have a stepped vimana and gopurams.
      check:
        prompt: What is the garbhagriha?
        options:
        - The sanctum where the deity is kept
        - The outer wall
        - The kitchen
        answer: The sanctum where the deity is kept
        why: '''Garbha'' means womb: the innermost room.'
    - teach: 'Indo-Islamic architecture brought true arches, domes and minarets: the Qutb Minar, Humayun''s Tomb (1570s), the Taj Mahal and Delhi''s Jama Masjid (both by Shah Jahan). Jain Dilwara temples at Mount Abu are famed for marble carving; Rajput forts like Mehrangarh stand on hills; the Golden Temple glows in Amritsar.'
      check:
        prompt: Which is a feature of Indo-Islamic buildings?
        options:
        - Domes
        - Shikharas
        - Toranas
        answer: Domes
        why: Domes, arches and minarets came with Indo-Islamic style.
    - teach: 'In colonial times, Indo-Saracenic buildings mixed Indian, Islamic and European styles: the Victoria Memorial in Kolkata, the Madras High Court and Mysuru Palace.'
      check:
        prompt: 'Indo-Saracenic buildings mix styles from:'
        options:
        - India, Islamic lands and Europe
        - Only Britain
        - Only China
        answer: India, Islamic lands and Europe
        why: They blend domes and arches with European plans.
