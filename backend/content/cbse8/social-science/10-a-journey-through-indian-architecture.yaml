# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 10 (Part 2 chapter 3). Format: content/README.md.
subject: cbse8-ss
chapter: 10
title: A Journey Through Indian Architecture
tips:
  s8_ajanta: "Elephanta has sculptures of Shiva. Which caves are famous for Buddhist paintings?"
  s8_dilwara: "Khajuraho's temples are in Madhya Pradesh and are not Jain marble temples. Where are the white-marble Jain temples?"
  s8_great_bath: "Hampi and Sanchi are much later. The Great Bath is Harappan."
  s8_harappan_drains: "Harappan cities were planned. Which feature shows that?"
  s8_indo_islamic: "Stupas and toranas are Buddhist. What came with Islamic builders?"
  s8_indo_saracenic: "Indo-Saracenic is colonial-era. Which building is from British times?"
  s8_kailasa: "The Kailasa temple was cut from the hillside downwards. Out of how many rocks?"
  s8_rajaraja: "Krishnadevaraya ruled Vijayanagara centuries later. The Thanjavur temple was built by a Chola king."
  s8_shah_jahan: "Akbar built Fatehpur Sikri. Who built the Taj for his wife?"
  s8_shikhara: "Vimana and gopuram belong to southern (Dravida) temples. The northern Nagara tower has a different name."
  s8_stupa: "A stupa is Buddhist. What shape is it and what does it hold?"
  s8_torana: "Gopurams are temple towers in the south. What are a stupa's gateways called?"
  s8a_water: "Think about what a bath must do with the water poured into it."
  s8a_bce: "BCE years count backwards from year 1. To go from a BCE year to a CE year, add the two numbers."
  s8a_period: 'Put the periods in order: Harappan cities, then stupas and caves, then temples, then Indo-Islamic, then colonial buildings.'
  s8a_faith: "Which faith is this building linked with: Buddhist, Jain, Hindu, Sikh or Islamic? Match the clue in the question."
  s8a_style: Northern temples rise in a curved tower; southern temples rise in stepped storeys like a pyramid.
  s8a_place: 'Picture the map: which state is this monument in?'
  s8a_feature: 'Look for the feature that the new style added: pointed shapes and round tops, not flat beams.'
  pqc8ss10_grid: Grid streets, baked bricks and covered drains belong to India's earliest cities, about 4,500 years ago. Whose were they?
  pqc8ss10_mix: The building mixes Indian, Islamic and European features and dates from British times. Which style is a mixture?

concepts:
- code: cbse8ss.arch.early
  title: 'Early Indian architecture: cities, stupas and caves'
  notes: |
    The Harappan (Indus Valley) cities, about 2600–1900 BCE, such as Mohenjo-daro and Dholavira, had planned
    streets, baked-brick houses, covered drains and the Great Bath. Buddhist stupas are dome-shaped mounds
    holding relics, with railings and carved gateways (toranas), as at Sanchi (begun under Ashoka) and
    Bharhut. Rock-cut caves were carved into hillsides: Udayagiri–Khandagiri (Jain), the painted Buddhist caves
    of Ajanta, and Ellora with Buddhist, Hindu and Jain shrines, including the Kailasa temple carved from a
    single rock. Stepwells like Rani ki Vav in Gujarat stored water.
  explanations:
    text: India's buildings tell its history. Over 4,000 years ago Harappan cities had straight streets and covered drains. Later came round Buddhist stupas like Sanchi, and whole temples carved out of rock, like the Kailasa temple at Ellora, cut from one single hill.
    visual: 'Draw a timeline of buildings: a grid of Harappan streets, the dome of Sanchi with its gateway, the caves of Ajanta in a cliff, and the Kailasa temple being carved from the top of a rock downwards.'
    step_by_step: 'Step 1: Harappan cities: planning, bricks, drains. Step 2: Stupas: domes holding relics, with toranas. Step 3: Rock-cut caves: carved into hills for monks and worship. Step 4: Kailasa at Ellora: a whole temple from one rock.'
    real_world: Rani ki Vav, a stepwell in Patan, Gujarat, is so finely carved that it appears on the back of India's ₹100 note and is a UNESCO World Heritage Site.
  picture:
    kind: flow
    steps:
    - 'Harappan cities: planned streets and drains'
    - 'Stupas: Sanchi and Bharhut'
    - 'Rock-cut caves: Ajanta and Ellora'
    - 'Kailasa temple: carved from one rock'
    - 'Stepwells: Rani ki Vav'
    alt: Early Indian architecture from planned Harappan cities to stupas, rock-cut caves, the Kailasa temple and stepwells.
  activity:
    type: sort
    prompt: Which kind of structure?
    bins:
    - Stupa
    - Rock-cut cave
    - Stepwell
    - Harappan city
    items:
    - label: Sanchi, with carved gateways
      bin: Stupa
      clue: Dome holding relics.
      why: Stupa.
    - label: Ajanta paintings
      bin: Rock-cut cave
      clue: Carved into a hill.
      why: Cave.
    - label: Kailasa temple at Ellora
      bin: Rock-cut cave
      clue: Cut from one rock.
      why: Rock-cut.
    - label: Rani ki Vav
      bin: Stepwell
      clue: Stores water.
      why: Stepwell.
    - label: Dholavira
      bin: Harappan city
      clue: Planned streets.
      why: Harappan.
  lesson:
    - teach: About 4,500 years ago, Harappan cities like Mohenjo-daro and Dholavira had straight streets in a grid, houses of baked brick, covered drains and the Great Bath, a large waterproof tank.
      check:
        prompt: What do covered drains tell us about Harappan cities?
        options:
        - They were carefully planned
        - They had no water
        - They were built in a hurry
        answer: They were carefully planned
        why: Drains along every street need planning before building.
      ways:
      - style: visual
        teach: 'What a Harappan city looked like: its planning and its special structures.'
        picture:
          kind: compare
          columns:
          - title: Planning
            points:
            - Straight streets in a grid
            - Houses of baked brick
            - Covered drains along the streets
          - title: Special structures
            points:
            - The Great Bath at Mohenjo-daro
            - A large waterproof tank
            - Water reservoirs at Dholavira
          alt: Harappan cities had grid streets, baked-brick houses and covered drains, with special structures such as the Great Bath at Mohenjo-daro and reservoirs at Dholavira.
      - style: real_world
        teach: A planned city such as Chandigarh is laid out in a grid of straight roads, with drains built before the houses. Harappan builders were doing the same about 4,500 years ago.
    - teach: Buddhist stupas are dome-shaped mounds holding relics of the Buddha or monks. A railing goes around, and carved gateways called toranas tell stories. The Great Stupa at Sanchi was begun under Ashoka.
      picture:
        kind: compare
        columns:
        - title: Stupa
          points:
          - Dome-shaped mound
          - Holds relics
          - Railing and toranas
          - Sanchi, Bharhut
        - title: Rock-cut cave
          points:
          - Carved into a hill
          - Halls and shrines
          - Wall paintings
          - Ajanta, Ellora
        alt: Stupas are dome mounds with relics and carved gateways; rock-cut caves are halls carved into hills, like Ajanta and Ellora.
      check:
        prompt: What is kept inside a stupa?
        options:
        - Relics
        - Grain
        - Weapons
        answer: Relics
        why: Stupas were built over relics, such as ashes or bones of holy people.
      ways:
      - style: step_by_step
        teach: 'Step 1: A relic is placed at the centre. Step 2: A solid dome-shaped mound is built over it. Step 3: A railing is set around it, leaving a path for walking round the stupa. Step 4: Carved gateways, the toranas, are added to tell stories in stone.'
      - style: real_world
        teach: 'Look at the back of a ₹200 note: it shows the Great Stupa at Sanchi with one of its carved gateways. The lions on every note and coin also come from a pillar of Ashoka''s time.'
    - teach: Rock-cut caves were carved into hillsides. Ajanta has beautiful Buddhist wall paintings. Ellora has Buddhist, Hindu and Jain caves side by side, and its Kailasa temple was cut from one huge rock, from the top down. Stepwells like Rani ki Vav in Gujarat stored water and were richly carved.
      check:
        prompt: Ellora's caves belong to which faiths?
        options:
        - Buddhist, Hindu and Jain
        - Only Buddhist
        - Only Jain
        answer: Buddhist, Hindu and Jain
        why: All three are found together at Ellora, showing harmony.
      ways:
      - style: visual
        teach: Three kinds of monument cut into rock or earth, and what each is known for.
        picture:
          kind: compare
          columns:
          - title: Ajanta
            points:
            - Rock-cut Buddhist caves
            - Famous wall paintings
          - title: Ellora
            points:
            - Buddhist, Hindu and Jain caves
            - 'Kailasa temple: one rock, cut from the top down'
          - title: Rani ki Vav
            points:
            - A stepwell in Gujarat
            - Stored water
            - Richly carved
          alt: Ajanta has Buddhist caves with wall paintings; Ellora has Buddhist, Hindu and Jain caves and the Kailasa temple cut from one rock; Rani ki Vav is a richly carved stepwell in Gujarat.
      - style: real_world
        teach: 'A mason building a wall adds stone to stone and can correct a mistake. The carvers of the Kailasa temple worked like sculptors: they only removed rock, starting at the top of the hill, and a wrong cut could never be put back.'
  items:
  - prompt: Which Harappan city had the famous Great Bath?
    options:
    - Mohenjo-daro
    - Delhi
    - Hampi
    - Sanchi
    answer: Mohenjo-daro
    difficulty: 1
    hints:
    - An Indus Valley city.
    - Now in Pakistan.
    solution: The Great Bath was found at Mohenjo-daro.
    mistakes: {"Hampi": "s8_great_bath"}
  - prompt: What is a stupa?
    options:
    - A dome-shaped Buddhist monument holding relics
    - A Mughal garden
    - A step well
    - A fort
    answer: A dome-shaped Buddhist monument holding relics
    difficulty: 1
    hints:
    - Sanchi.
    - Round mound.
    solution: A stupa is a dome-shaped structure built over relics.
    mistakes: {"A step well": "s8_stupa"}
  - prompt: What is special about the Kailasa temple at Ellora?
    options:
    - It was carved out of a single rock
    - It is made of glass
    - It floats on water
    - It was built by the British
    answer: It was carved out of a single rock
    difficulty: 2
    hints:
    - Rock-cut.
    - Carved from the top down.
    solution: The Kailasa temple was carved from one massive rock.
    mistakes: {"It was built by the British": "s8_kailasa"}
  - prompt: Which caves are famous for their Buddhist wall paintings?
    options:
    - Ajanta
    - Elephanta
    - Udayagiri
    - Borra
    answer: Ajanta
    difficulty: 2
    hints:
    - In Maharashtra.
    - A...
    solution: The Ajanta caves are famous for their paintings.
    mistakes: {"Elephanta": "s8_ajanta"}
  - prompt: What were the carved gateways of stupas called?
    options:
    - Toranas
    - Gopurams
    - Minarets
    - Domes
    answer: Toranas
    difficulty: 2
    hints:
    - Sanchi has four.
    - T...
    solution: Stupa gateways are called toranas.
    mistakes: {"Gopurams": "s8_torana"}
  - prompt: Which feature shows the town planning of Harappan cities?
    options:
    - Covered drains along straight streets
    - Tall skyscrapers
    - Railway lines
    - Glass windows
    answer: Covered drains along straight streets
    difficulty: 1
    hints:
    - Water and waste.
    - Planned roads.
    solution: Harappan cities had grid streets with covered drains.
    mistakes: {"Tall skyscrapers": "s8_harappan_drains"}
  - prompt: Which Harappan city is in Gujarat and known for its water reservoirs?
    options:
    - Dholavira
    - Mohenjo-daro
    - Sanchi
    answer: Dholavira
    difficulty: 3
    hints:
    - It is in the Rann of Kutch.
    - Mohenjo-daro is in Sindh, Pakistan.
    solution: Dholavira in Kutch, Gujarat, had large reservoirs to store water.
    mistakes:
      Mohenjo-daro: s8a_place
      Sanchi: s8a_period
  - prompt: Under which ruler was the Great Stupa at Sanchi begun?
    options:
    - Ashoka
    - Shah Jahan
    - Rajaraja Chola I
    answer: Ashoka
    difficulty: 2
    hints:
    - He was a Mauryan emperor who spread Buddhism.
    - The others built temples and tombs much later.
    solution: Ashoka began the Sanchi stupa in the 3rd century BCE.
    mistakes:
      Shah Jahan: s8a_period
      Rajaraja Chola I: s8a_period
  - prompt: In which state are the Ajanta and Ellora caves?
    options:
    - Maharashtra
    - Kerala
    - Punjab
    answer: Maharashtra
    difficulty: 2
    hints:
    - They are near Aurangabad (Chhatrapati Sambhajinagar).
    - It is in the western Deccan.
    solution: Both cave sites are in Maharashtra.
    mistakes:
      Kerala: s8a_place
      Punjab: s8a_place
  - prompt: Why was the Great Bath built with tightly fitted bricks and a layer of bitumen?
    options:
    - To keep water from leaking
    - To make it look shiny
    - To keep animals out
    answer: To keep water from leaking
    difficulty: 2
    hints:
    - Bitumen is a sticky tar.
    - A bath must hold water.
    solution: Bitumen and fitted bricks made the tank waterproof.
    mistakes:
      To make it look shiny: s8a_water
      To keep animals out: s8a_water
  - prompt: Which is a rock-cut monument?
    options:
    - Kailasa temple, Ellora
    - Great Stupa, Sanchi
    - Taj Mahal
    answer: Kailasa temple, Ellora
    difficulty: 2
    hints:
    - It was carved out of a hill, not built up from blocks.
    - The others are built of stone or brick.
    solution: The Kailasa temple was cut from a single rock.
    mistakes:
      Great Stupa, Sanchi: s8_stupa
      Taj Mahal: s8a_period
  - prompt: What was a stepwell used for?
    options:
    - Storing water to use in dry months
    - Burying kings
    - Keeping weapons
    answer: Storing water to use in dry months
    difficulty: 1
    hints:
    - Steps lead down to the water.
    - Gujarat and Rajasthan are dry.
    solution: Stepwells like Rani ki Vav stored water for the dry season.
    mistakes:
      Burying kings: s8a_faith
      Keeping weapons: s8a_faith
  - prompt: Harappan cities flourished around 2600 BCE. How many years before 2000 CE is that?
    answer: '4600'
    check: 2600+2000
    difficulty: 3
    hints:
    - BCE years count back from year 1.
    - Add the years on both sides of year 1.
    solution: 2600 years before CE plus 2000 years after = about 4600 years.
    mistakes:
      '600': s8a_bce
  - prompt: Which is the oldest kind of building in this list?
    options:
    - Harappan drains
    - Sanchi stupa
    - Kailasa temple
    answer: Harappan drains
    difficulty: 2
    hints:
    - Think of which came about 2,000 years before Ashoka.
    - Kailasa is from the 8th century CE.
    solution: Harappan cities are from about 2600 BCE, much older than Sanchi or Kailasa.
    mistakes:
      Sanchi stupa: s8a_period
      Kailasa temple: s8a_period
  - prompt: 'The stories carved on Sanchi''s toranas mostly tell of:'
    options:
    - The life of the Buddha and Jataka tales
    - Mughal battles
    - British trade
    answer: The life of the Buddha and Jataka tales
    difficulty: 2
    hints:
    - Sanchi is a Buddhist site.
    - Jatakas are stories of the Buddha's earlier lives.
    solution: The gateways show scenes from the Buddha's life and Jataka tales.
    mistakes:
      Mughal battles: s8a_faith
      British trade: s8a_period
  - prompt: 'Assertion (A): The Great Bath was lined with tightly fitted bricks and a layer of bitumen.

      Reason (R): The tank had to hold water without leaking.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Close-fitting bricks and bitumen made the tank waterproof, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): The Kailasa temple at Ellora was built by piling up cut stone blocks.

      Reason (R): Ellora has Buddhist, Hindu and Jain caves side by side.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: the temple was carved out of one huge rock, from the top down. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Archaeologists dig up an ancient town. They find streets crossing at right angles, houses of baked brick, and covered drains beside every street. Which civilisation''s town is this most like, and what does the layout show?'
    options:
    - Harappan; the town was carefully planned
    - Mughal; the town grew around a fort
    - Colonial; a railway company laid it out
    answer: Harappan; the town was carefully planned
    hints:
    - Which early cities had covered drains?
    - Do grid streets happen by accident?
    solution: Grid streets, baked bricks and covered drains are marks of Harappan cities and show careful town planning.
    mistakes:
      Mughal; the town grew around a fort: pqc8ss10_grid
      Colonial; a railway company laid it out: pqc8ss10_grid
    exam: case
    difficulty: 2
  - prompt: 'Situation: A guide describes a monument: ''A solid dome holding relics, a railing around it, and carved gateways telling stories of the Buddha.'' What is it, and what are the gateways called?'
    options:
    - A stupa; toranas
    - A rock-cut cave; mandapas
    - A stepwell; shikharas
    answer: A stupa; toranas
    hints:
    - Which monument is a dome-shaped mound?
    - Sanchi's gateways have a special name.
    solution: A dome-shaped mound holding relics is a stupa, and its carved gateways are toranas.
    mistakes:
      A rock-cut cave; mandapas: s8a_faith
      A stepwell; shikharas: s8a_faith
    exam: competency
    difficulty: 2
- code: cbse8ss.arch.temples
  title: Temples, forts, tombs and colonial buildings
  after:
  - cbse8ss.arch.early
  notes: |
    From the Gupta period, temples had a garbhagriha (sanctum) and mandapas (halls), with a curved shikhara in
    the northern Nagara style (Kandariya Mahadeva, Khajuraho) or a stepped vimana in the southern Dravida style
    (Brihadisvara, Thanjavur, built by Rajaraja Chola I around 1010). Jain marble temples at Dilwara (Mount
    Abu). Indo-Islamic architecture brought arches, domes and minarets: Qutb Minar, Humayun's Tomb (1570s),
    the Taj Mahal and Delhi's Jama Masjid (Shah Jahan). Rajput forts like Mehrangarh. The Golden Temple in
    Amritsar. Colonial-era Indo-Saracenic buildings mixed styles: Victoria Memorial, Madras High Court, Mysuru
    Palace.
  explanations:
    text: 'Different eras left different buildings: temples with tall towers in the north and stepped towers in the south, forts on hills, domed tombs and mosques, and grand colonial buildings. Many mix styles, showing how cultures met and blended.'
    visual: 'Draw two temple towers side by side: a curved, beehive-like shikhara (Nagara, north) and a stepped pyramid vimana (Dravida, south). Below, draw an onion dome and minarets (Indo-Islamic).'
    step_by_step: 'Step 1: Curved tower over the sanctum: Nagara style (north). Step 2: Stepped pyramid tower: Dravida style (south). Step 3: Arches, domes and minarets: Indo-Islamic. Step 4: Mixed Indian, Islamic and Gothic features: Indo-Saracenic (colonial).'
    real_world: The Brihadisvara temple in Thanjavur, over 1000 years old, has a vimana about 66 m tall, topped by a capstone weighing many tonnes, raised without modern machines.
  picture:
    kind: compare
    columns:
    - title: Nagara (north)
      points:
      - Curved shikhara tower
      - Khajuraho temples
      - Often on a raised platform
    - title: Dravida (south)
      points:
      - Stepped vimana tower
      - Brihadisvara, Thanjavur
      - Big gateway towers (gopurams)
    - title: Indo-Islamic
      points:
      - Arches, domes, minarets
      - Taj Mahal, Qutb Minar
      - Gardens and calligraphy
    alt: 'Three architectural styles: Nagara temples with curved towers, Dravida temples with stepped vimanas, and Indo-Islamic buildings with arches, domes and minarets.'
    caption: The tower and the dome tell you the style.
  activity:
    type: sort
    prompt: Which style?
    bins:
    - Nagara (north)
    - Dravida (south)
    - Indo-Islamic
    - Indo-Saracenic (colonial)
    items:
    - label: Kandariya Mahadeva, curved shikhara
      bin: Nagara (north)
      clue: Khajuraho.
      why: Nagara.
    - label: Brihadisvara, stepped vimana
      bin: Dravida (south)
      clue: Thanjavur.
      why: Dravida.
    - label: 'Taj Mahal: domes and minarets'
      bin: Indo-Islamic
      clue: Mughal.
      why: Indo-Islamic.
    - label: Qutb Minar
      bin: Indo-Islamic
      clue: Delhi Sultanate.
      why: Indo-Islamic.
    - label: Victoria Memorial
      bin: Indo-Saracenic (colonial)
      clue: Mixed styles.
      why: Colonial.
  lesson:
    - teach: Hindu temples have a garbhagriha (sanctum) where the deity is kept, and mandapas (halls) for people. In the northern Nagara style a curved tower called a shikhara rises over the sanctum, as at Kandariya Mahadeva, Khajuraho. In the southern Dravida style a stepped tower called a vimana rises, as at the Brihadisvara temple, Thanjavur, built by Rajaraja Chola I around 1010.
      picture:
        kind: compare
        columns:
        - title: Nagara (north)
          points:
          - Curved shikhara
          - Kandariya Mahadeva, Khajuraho
        - title: Dravida (south)
          points:
          - Stepped vimana
          - Big gateway towers (gopurams)
          - Brihadisvara, Thanjavur
        alt: Northern Nagara temples have a curved shikhara; southern Dravida temples have a stepped vimana and gopurams.
      check:
        prompt: What is the garbhagriha?
        options:
        - The sanctum where the deity is kept
        - The outer wall
        - The kitchen
        answer: The sanctum where the deity is kept
        why: '''Garbha'' means womb: the innermost room.'
      ways:
      - style: step_by_step
        teach: 'Step 1: Find the garbhagriha, the small sanctum with the deity. Step 2: Find the mandapas, the halls where people gather. Step 3: Look at the tower over the sanctum. Step 4: Curved and rising to a point is a shikhara, the Nagara style of the north; stepped like a pyramid is a vimana, the Dravida style of the south.'
      - style: real_world
        teach: The vimana of the Brihadisvara temple rises about 66 metres, as tall as a twenty-storey building, and is made of granite blocks fitted together. It has stood for more than a thousand years.
    - teach: 'Indo-Islamic architecture brought true arches, domes and minarets: the Qutb Minar, Humayun''s Tomb (1570s), the Taj Mahal and Delhi''s Jama Masjid (both by Shah Jahan). Jain Dilwara temples at Mount Abu are famed for marble carving; Rajput forts like Mehrangarh stand on hills; the Golden Temple glows in Amritsar.'
      check:
        prompt: Which is a feature of Indo-Islamic buildings?
        options:
        - Domes
        - Shikharas
        - Toranas
        answer: Domes
        why: Domes, arches and minarets came with Indo-Islamic style.
      ways:
      - style: visual
        teach: Buildings of this step sorted by the tradition they belong to.
        picture:
          kind: compare
          columns:
          - title: Indo-Islamic
            points:
            - True arches, domes, minarets
            - Qutb Minar
            - Humayun's Tomb
            - Taj Mahal and Jama Masjid
          - title: Jain and Sikh
            points:
            - 'Dilwara temples, Mount Abu: marble carving'
            - Golden Temple, Amritsar
          - title: Rajput
            points:
            - Forts on hills
            - Mehrangarh
          alt: Indo-Islamic buildings with arches, domes and minarets (Qutb Minar, Humayun's Tomb, Taj Mahal, Jama Masjid); the Jain Dilwara temples and the Sikh Golden Temple; Rajput hill forts such as Mehrangarh.
      - style: real_world
        teach: A flat stone beam cracks if it is made too long. In a true arch, wedge-shaped stones lock together and pass the weight sideways down to the pillars, so a wide space can be covered. That is why big domes and halls became possible.
    - teach: 'In colonial times, Indo-Saracenic buildings mixed Indian, Islamic and European styles: the Victoria Memorial in Kolkata, the Madras High Court and Mysuru Palace.'
      check:
        prompt: 'Indo-Saracenic buildings mix styles from:'
        options:
        - India, Islamic lands and Europe
        - Only Britain
        - Only China
        answer: India, Islamic lands and Europe
        why: They blend domes and arches with European plans.
      ways:
