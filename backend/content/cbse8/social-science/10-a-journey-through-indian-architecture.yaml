    answer: It was carved out of a single rock
    difficulty: 2
    hints:
    - Rock-cut.
    - Carved from the top down.
    solution: The Kailasa temple was carved from one massive rock.
    mistakes: {"It was built by the British": "s8_kailasa"}
  - prompt: Which caves are famous for their Buddhist wall paintings?
    options:
    - Ajanta
    - Elephanta
    - Udayagiri
    - Borra
    answer: Ajanta
    difficulty: 2
    hints:
    - In Maharashtra.
    - A...
    solution: The Ajanta caves are famous for their paintings.
    mistakes: {"Elephanta": "s8_ajanta"}
  - prompt: What were the carved gateways of stupas called?
    options:
    - Toranas
    - Gopurams
    - Minarets
    - Domes
    answer: Toranas
    difficulty: 2
    hints:
    - Sanchi has four.
    - T...
    solution: Stupa gateways are called toranas.
    mistakes: {"Gopurams": "s8_torana"}
  - prompt: Which feature shows the town planning of Harappan cities?
    options:
    - Covered drains along straight streets
    - Tall skyscrapers
    - Railway lines
    - Glass windows
    answer: Covered drains along straight streets
    difficulty: 1
    hints:
    - Water and waste.
