# CBSE Class 8 Social Science (NCERT Exploring Society: India and Beyond, Part 2, 2025), chapter 10 (Part 2 chapter 3). Format: content/README.md.
subject: cbse8-ss
chapter: 10
title: A Journey Through Indian Architecture
concepts:
- code: cbse8ss.arch.early
  title: 'Early Indian architecture: cities, stupas and caves'
  notes: |
    The Harappan (Indus Valley) cities, about 2600–1900 BCE, such as Mohenjo-daro and Dholavira, had planned
    streets, baked-brick houses, covered drains and the Great Bath. Buddhist stupas are dome-shaped mounds
    holding relics, with railings and carved gateways (toranas), as at Sanchi (begun under Ashoka) and
    Bharhut. Rock-cut caves were carved into hillsides: Udayagiri–Khandagiri (Jain), the painted Buddhist caves
    of Ajanta, and Ellora with Buddhist, Hindu and Jain shrines, including the Kailasa temple carved from a
    single rock. Stepwells like Rani ki Vav in Gujarat stored water.
  explanations:
    text: India's buildings tell its history. Over 4,000 years ago Harappan cities had straight streets and covered drains. Later came round Buddhist stupas like Sanchi, and whole temples carved out of rock, like the Kailasa temple at Ellora, cut from one single hill.
    visual: 'Draw a timeline of buildings: a grid of Harappan streets, the dome of Sanchi with its gateway, the caves of Ajanta in a cliff, and the Kailasa temple being carved from the top of a rock downwards.'
    step_by_step: 'Step 1: Harappan cities: planning, bricks, drains. Step 2: Stupas: domes holding relics, with toranas. Step 3: Rock-cut caves: carved into hills for monks and worship. Step 4: Kailasa at Ellora: a whole temple from one rock.'
    real_world: Rani ki Vav, a stepwell in Patan, Gujarat, is so finely carved that it appears on the back of India's ₹100 note and is a UNESCO World Heritage Site.
  picture:
    kind: flow
    steps:
    - 'Harappan cities: planned streets and drains'
    - 'Stupas: Sanchi and Bharhut'
    - 'Rock-cut caves: Ajanta and Ellora'
    - 'Kailasa temple: carved from one rock'
    - 'Stepwells: Rani ki Vav'
    alt: Early Indian architecture from planned Harappan cities to stupas, rock-cut caves, the Kailasa temple and stepwells.
  activity:
    type: sort
    prompt: Which kind of structure?
    bins:
    - Stupa
    - Rock-cut cave
    - Stepwell
    - Harappan city
    items:
    - label: Sanchi, with carved gateways
      bin: Stupa
      clue: Dome holding relics.
      why: Stupa.
    - label: Ajanta paintings
      bin: Rock-cut cave
      clue: Carved into a hill.
      why: Cave.
    - label: Kailasa temple at Ellora
      bin: Rock-cut cave
      clue: Cut from one rock.
      why: Rock-cut.
    - label: Rani ki Vav
      bin: Stepwell
      clue: Stores water.
      why: Stepwell.
    - label: Dholavira
      bin: Harappan city
      clue: Planned streets.
      why: Harappan.
  items:
  - prompt: Which Harappan city had the famous Great Bath?
    options:
    - Mohenjo-daro
    - Delhi
    - Hampi
    - Sanchi
    answer: Mohenjo-daro
    difficulty: 1
    hints:
    - An Indus Valley city.
    - Now in Pakistan.
    solution: The Great Bath was found at Mohenjo-daro.
  - prompt: What is a stupa?
    options:
    - A dome-shaped Buddhist monument holding relics
    - A Mughal garden
    - A step well
    - A fort
    answer: A dome-shaped Buddhist monument holding relics
    difficulty: 1
    hints:
    - Sanchi.
    - Round mound.
    solution: A stupa is a dome-shaped structure built over relics.
  - prompt: What is special about the Kailasa temple at Ellora?
    options:
    - It was carved out of a single rock
    - It is made of glass
    - It floats on water
    - It was built by the British
    answer: It was carved out of a single rock
    difficulty: 2
    hints:
    - Rock-cut.
    - Carved from the top down.
    solution: The Kailasa temple was carved from one massive rock.
  - prompt: Which caves are famous for their Buddhist wall paintings?
    options:
    - Ajanta
    - Elephanta
    - Udayagiri
    - Borra
    answer: Ajanta
    difficulty: 2
    hints:
    - In Maharashtra.
    - A...
    solution: The Ajanta caves are famous for their paintings.
  - prompt: What were the carved gateways of stupas called?
    options:
    - Toranas
    - Gopurams
    - Minarets
    - Domes
    answer: Toranas
    difficulty: 2
    hints:
    - Sanchi has four.
    - T...
    solution: Stupa gateways are called toranas.
  - prompt: Which feature shows the town planning of Harappan cities?
    options:
    - Covered drains along straight streets
    - Tall skyscrapers
    - Railway lines
    - Glass windows
    answer: Covered drains along straight streets
    difficulty: 1
    hints:
    - Water and waste.
    - Planned roads.
    solution: Harappan cities had grid streets with covered drains.
- code: cbse8ss.arch.temples
  title: Temples, forts, tombs and colonial buildings
  after:
  - cbse8ss.arch.early
  notes: |
    From the Gupta period, temples had a garbhagriha (sanctum) and mandapas (halls), with a curved shikhara in
    the northern Nagara style (Kandariya Mahadeva, Khajuraho) or a stepped vimana in the southern Dravida style
    (Brihadisvara, Thanjavur, built by Rajaraja Chola I around 1010). Jain marble temples at Dilwara (Mount
    Abu). Indo-Islamic architecture brought arches, domes and minarets: Qutb Minar, Humayun's Tomb (1570s),
    the Taj Mahal and Delhi's Jama Masjid (Shah Jahan). Rajput forts like Mehrangarh. The Golden Temple in
    Amritsar. Colonial-era Indo-Saracenic buildings mixed styles: Victoria Memorial, Madras High Court, Mysuru
    Palace.
  explanations:
    text: 'Different eras left different buildings: temples with tall towers in the north and stepped towers in the south, forts on hills, domed tombs and mosques, and grand colonial buildings. Many mix styles, showing how cultures met and blended.'
    visual: 'Draw two temple towers side by side: a curved, beehive-like shikhara (Nagara, north) and a stepped pyramid vimana (Dravida, south). Below, draw an onion dome and minarets (Indo-Islamic).'
    step_by_step: 'Step 1: Curved tower over the sanctum: Nagara style (north). Step 2: Stepped pyramid tower: Dravida style (south). Step 3: Arches, domes and minarets: Indo-Islamic. Step 4: Mixed Indian, Islamic and Gothic features: Indo-Saracenic (colonial).'
    real_world: The Brihadisvara temple in Thanjavur, over 1000 years old, has a vimana about 66 m tall, topped by a capstone weighing many tonnes, raised without modern machines.
  picture:
    kind: compare
    columns:
    - title: Nagara (north)
      points:
      - Curved shikhara tower
      - Khajuraho temples
      - Often on a raised platform
    - title: Dravida (south)
      points:
      - Stepped vimana tower
      - Brihadisvara, Thanjavur
      - Big gateway towers (gopurams)
    - title: Indo-Islamic
      points:
      - Arches, domes, minarets
      - Taj Mahal, Qutb Minar
      - Gardens and calligraphy
    alt: 'Three architectural styles: Nagara temples with curved towers, Dravida temples with stepped vimanas, and Indo-Islamic buildings with arches, domes and minarets.'
    caption: The tower and the dome tell you the style.
  activity:
    type: sort
    prompt: Which style?
    bins:
    - Nagara (north)
    - Dravida (south)
    - Indo-Islamic
    - Indo-Saracenic (colonial)
    items:
    - label: Kandariya Mahadeva, curved shikhara
      bin: Nagara (north)
      clue: Khajuraho.
      why: Nagara.
    - label: Brihadisvara, stepped vimana
      bin: Dravida (south)
      clue: Thanjavur.
      why: Dravida.
    - label: 'Taj Mahal: domes and minarets'
      bin: Indo-Islamic
      clue: Mughal.
      why: Indo-Islamic.
    - label: Qutb Minar
      bin: Indo-Islamic
      clue: Delhi Sultanate.
      why: Indo-Islamic.
    - label: Victoria Memorial
      bin: Indo-Saracenic (colonial)
      clue: Mixed styles.
      why: Colonial.
  items:
  - prompt: Who built the Brihadisvara temple at Thanjavur?
    options:
    - Rajaraja Chola I
    - Shah Jahan
    - Ashoka
    - Krishnadevaraya
    answer: Rajaraja Chola I
    difficulty: 1
    hints:
    - A Chola king.
    - About 1010 CE.
    solution: Rajaraja Chola I built the Brihadisvara temple around 1010.
  - prompt: 'The curved tower of a northern (Nagara) temple is called:'
    options:
    - Shikhara
    - Vimana
    - Gopuram
    - Minaret
    answer: Shikhara
    difficulty: 2
    hints:
    - Means 'mountain peak'.
    - S...
    solution: A Nagara temple's tower is the shikhara.
  - prompt: Who built the Taj Mahal?
    options:
    - Shah Jahan
    - Akbar
    - Babur
    - Aurangzeb
    answer: Shah Jahan
    difficulty: 1
    hints:
    - In memory of Mumtaz Mahal.
    - Agra, 17th century.
    solution: Shah Jahan built the Taj Mahal.
  - prompt: Which features are typical of Indo-Islamic architecture?
    options:
    - Arches, domes and minarets
    - Stupas and toranas
    - Rock-cut caves
    - Thatched roofs
    answer: Arches, domes and minarets
    difficulty: 1
    hints:
    - Think of the Taj Mahal.
    - Round tops and towers.
    solution: Indo-Islamic buildings feature true arches, domes and minarets.
  - prompt: Where are the Dilwara Jain temples, famous for marble carving?
    options:
    - Mount Abu
    - Khajuraho
    - Hampi
    - Madurai
    answer: Mount Abu
    difficulty: 2
    hints:
    - Rajasthan.
    - A hill station.
    solution: The Dilwara temples are at Mount Abu.
  - prompt: Which is an example of colonial Indo-Saracenic architecture?
    options:
    - The Victoria Memorial, Kolkata
    - Sanchi Stupa
    - Ajanta caves
    - Konark temple
    answer: The Victoria Memorial, Kolkata
    difficulty: 2
    hints:
    - British era.
    - White marble, domes.
    solution: The Victoria Memorial is a colonial-era building mixing styles.
