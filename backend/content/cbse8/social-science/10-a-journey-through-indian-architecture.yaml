    solution: Dholavira in Kutch, Gujarat, had large reservoirs to store water.
    mistakes:
      Mohenjo-daro: s8a_place
      Sanchi: s8a_period
  - prompt: Under which ruler was the Great Stupa at Sanchi begun?
    options:
    - Ashoka
    - Shah Jahan
    - Rajaraja Chola I
    answer: Ashoka
    difficulty: 2
