- code: cbse8e.u1.concrete
  title: A Concrete Example (poem)
  after:
  - cbse8e.u1.wit
  notes: |
    A humorous poem about the speaker's next-door neighbour, Mrs Jones, whose garden is full of stones: a
    crazy path, a lily pond, a rockery and a sundial. Between the stones she grows tiny, delicate flowers,
    so small they seem planted with a pin. The speaker searches for a flower worth admiring and finds he
    has been standing on one. The refrain "My next-door neighbour, Mrs Jones" repeats. Rhyming couplets.
    The title is a pun: 'concrete' means cement or stone (the garden), and a concrete example is a clear,
    real example. Themes: people value different kinds of beauty; beauty can be tiny; respect others'
    passions. Devices: refrain, irony (he steps on the flower he is looking for), pun.
  explanations:
    text: 'The speaker visits Mrs Jones''s garden, which is mostly stones: a path, a pond, a rockery. She grows flowers so tiny he can''t find them, until he realises he''s standing on one. It is a funny poem about how different people see beauty.'
    visual: 'Picture a grey garden of stones with a small pond and a sundial. Look closely: between the stones are dots of colour, tiny flowers, and one is squashed under the visitor''s shoe.'
    step_by_step: 'Step 1: Describe the garden: stones, pond, rockery, sundial. Step 2: Notice the tiny flowers. Step 3: Find the joke: he stands on a flower. Step 4: Explain the title''s double meaning.'
    real_world: 'A friend may love a hobby that seems odd to you, like collecting stamps or tiny plants. A concrete example: what looks dull to one person is precious to another.'
  picture:
    kind: compare
    columns:
    - title: What the speaker expects
      points:
      - A big, showy flower
      - A garden of colour
      - Something easy to see
    - title: What Mrs Jones loves
      points:
      - Tiny flowers between stones
      - A rockery and a sundial
      - Beauty you must look for
    alt: 'What the speaker expects, big showy flowers, compared with what Mrs Jones loves: tiny flowers between stones that you have to look for.'
  activity:
    type: sort
    prompt: 'A Concrete Example: what is in Mrs Jones''s garden?'
    bins:
    - Stone
    - Flowers
    items:
    - label: A crazy path
      bin: Stone
      clue: A path of broken slabs.
      why: A crazy path is made of stone.
    - label: A rockery
      bin: Stone
      clue: Rocks.
      why: A rockery is a pile of stones.
    - label: Tiny flowers planted with a pin
      bin: Flowers
      clue: So small.
      why: The flowers are tiny.
    - label: A sundial
      bin: Stone
      clue: Shows time by shadow.
      why: The sundial is stone, like the path.
    - label: The one he was standing on
      bin: Flowers
      clue: The irony.
      why: He steps on the flower he was searching for.
  lesson:
    - teach: '''A Concrete Example'' is a funny poem about the speaker''s neighbour, Mrs Jones. Her garden is full of stones: a crazy path, a lily pond, a rockery and a sundial. The line ''My next-door neighbour, Mrs Jones'' keeps coming back: a refrain.'
      check:
        prompt: What is a refrain?
        options:
        - A line repeated in a poem
        - A rhyming word
        - The poem's title
        answer: A line repeated in a poem
        why: The line about Mrs Jones is repeated.
    - teach: 'Between the stones she grows tiny, delicate flowers, so small they seem planted with a pin. The speaker looks for a flower to admire and finds he has been standing on one. This is irony: the opposite of what we expect.'
      check:
        prompt: Why is the ending ironic?
        options:
        - He is standing on the very flower he searches for
        - He finds a huge flower
        - Mrs Jones moves away
        answer: He is standing on the very flower he searches for
        why: What he looks for is right under his feet.
    - teach: The title is a pun. 'Concrete' means cement or stone, like the garden, and a 'concrete example' means a clear, real example. The poem teaches that people value different kinds of beauty, and beauty can be tiny.
      picture:
        kind: compare
        columns:
        - title: Meaning 1
          points:
          - Concrete = cement, stone
          - The stony garden
        - title: Meaning 2
          points:
          - Concrete example = clear, real example
          - The poem shows one
        alt: 'The pun: concrete as stone (the garden) and a concrete example as a clear, real example.'
      check:
        prompt: 'A word used with two meanings at once for fun is a:'
        options:
        - Pun
        - Refrain
        - Simile
        answer: Pun
        why: '''Concrete'' carries two meanings in the title.'
  items:
  - prompt: What is Mrs Jones's garden mostly made of?
    options:
    - Stones
    - Grass
    - Fruit trees
