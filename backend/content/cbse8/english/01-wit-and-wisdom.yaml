concepts:
- code: cbse8e.u1.wit
  title: The Wit that Won Hearts
  notes: |
    Setting: the Vijayanagara Empire under King Krishnadeva Raya, a powerful king who loved art and
    literature. Tenali Ramakrishna (Tenali Rama) was one of the Ashtadiggajas, the eight great poets of his
    court, famous for his wit. Queen Thirumalambal yawned while the king was reading out his work; the proud
    king felt insulted and stopped speaking to her. The palace grew silent and the queen was distraught.
    Tenali Rama came to court with seeds and said they would give a wonderful yield, but only if sown by
    someone who had never yawned. The king laughed: nobody can live without yawning! Tenali replied that
    then the queen's yawn was natural too. The king saw his mistake, apologised, and peace returned.
    Message: wit is being clever and kind at once; humour can mend a quarrel where argument fails; pride
    harms relationships. Words: distraught (deeply upset), forlorn (lonely and sad), unfazed (not worried).
  explanations:
    text: The king was hurt when the queen yawned while he read out his writing, and stopped speaking to her. Tenali Rama brought seeds that, he said, would only grow if sown by someone who had never yawned. The king laughed that no one is like that, and suddenly saw that the queen's yawn was natural too.
    visual: 'Picture a silent palace: a sad queen in one room, a proud king in another. Then Tenali Rama walks in holding out a handful of seeds, and the king bursts out laughing.'
    step_by_step: 'Step 1: The problem: the king is offended by a yawn. Step 2: The result: silence and sadness in the palace. Step 3: Tenali''s trick: seeds that only a never-yawning person can sow. Step 4: The king laughs and realises everyone yawns. Step 5: He makes peace with the queen.'
    real_world: When two friends quarrel over something small, a kind joke that helps them see it differently often works better than taking sides.
  picture:
    kind: flow
    steps:
    - The queen yawns as the king reads
    - The proud king stops speaking to her
    - Tenali Rama brings 'special' seeds
    - Only someone who never yawns may sow them
    - The king laughs, sees his mistake and makes peace
    alt: 'The story in five steps: the queen''s yawn, the king''s silence, Tenali Rama''s seeds, the condition that the sower must never have yawned, and the king making peace.'
  items:
  - prompt: Which empire is the story set in?
    options:
    - Vijayanagara
    - Maurya
    - Mughal
    - Chola
    answer: Vijayanagara
    difficulty: 1
    hints:
    - Krishnadeva Raya's kingdom.
    - In South India.
    solution: The story is set in the Vijayanagara Empire under Krishnadeva Raya.
    mistakes:
      Mughal: eng8_read_again
  - prompt: Who used wit to end the quarrel?
    options:
    - Tenali Rama
    - The queen's father
    - The chief minister
    - A travelling monk
    answer: Tenali Rama
    difficulty: 1
    hints:
    - A poet of the court.
    - One of the Ashtadiggajas.
    solution: Tenali Ramakrishna, the witty court poet, solved the problem.
  - prompt: The Ashtadiggajas were the great poets of Krishnadeva Raya's court. How many were there? ('Ashta' means eight.)
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - '''Ashta'' is a number word.'
    - Ashta = eight.
    solution: There were eight Ashtadiggajas.
  - prompt: Why was the king angry with the queen?
    options:
    - She yawned while he was reading his work
    - She broke his crown
    - She laughed at Tenali Rama
    - She left the palace
    answer: She yawned while he was reading his work
    difficulty: 1
    hints:
    - Something very small.
    - He felt insulted.
    solution: He took her yawn as disrespect for his writing.
  - prompt: What condition did Tenali Rama put on sowing the seeds?
    options:
    - They must be sown by someone who has never yawned
    - They must be sown at midnight
    - They must be sown by the queen
    - They must be watered with milk
    answer: They must be sown by someone who has never yawned
    difficulty: 2
    hints:
    - It links to the quarrel.
    - Nobody can meet this condition.
    solution: Only someone who had never yawned could sow them, and no such person exists.
  - prompt: What is the main message of the story?
    options:
    - Kind, clever humour can mend a quarrel caused by pride
    - Kings should never read in public
    - Seeds should be sown carefully
    - Yawning is rude
    answer: Kind, clever humour can mend a quarrel caused by pride
    difficulty: 2
    hints:
    - How was the problem solved?
    - Not by arguing.
    solution: Tenali's gentle wit helped the proud king see his mistake.
    mistakes:
      Yawning is rude: eng8_whole_story
- code: cbse8e.u1.concrete
  title: A Concrete Example (poem)
  after:
  - cbse8e.u1.wit
  notes: |
    A humorous poem about the speaker's next-door neighbour, Mrs Jones, whose garden is full of stones: a
    crazy path, a lily pond, a rockery and a sundial. Between the stones she grows tiny, delicate flowers,
    so small they seem planted with a pin. The speaker searches for a flower worth admiring and finds he
    has been standing on one. The refrain "My next-door neighbour, Mrs Jones" repeats. Rhyming couplets.
    The title is a pun: 'concrete' means cement or stone (the garden), and a concrete example is a clear,
    real example. Themes: people value different kinds of beauty; beauty can be tiny; respect others'
    passions. Devices: refrain, irony (he steps on the flower he is looking for), pun.
  explanations:
    text: 'The speaker visits Mrs Jones''s garden, which is mostly stones: a path, a pond, a rockery. She grows flowers so tiny he can''t find them, until he realises he''s standing on one. It is a funny poem about how different people see beauty.'
    visual: 'Picture a grey garden of stones with a small pond and a sundial. Look closely: between the stones are dots of colour, tiny flowers, and one is squashed under the visitor''s shoe.'
    step_by_step: 'Step 1: Describe the garden: stones, pond, rockery, sundial. Step 2: Notice the tiny flowers. Step 3: Find the joke: he stands on a flower. Step 4: Explain the title''s double meaning.'
    real_world: 'A friend may love a hobby that seems odd to you, like collecting stamps or tiny plants. A concrete example: what looks dull to one person is precious to another.'
  picture:
    kind: compare
    columns:
    - title: What the speaker expects
      points:
      - A big, showy flower
      - A garden of colour
      - Something easy to see
    - title: What Mrs Jones loves
      points:
      - Tiny flowers between stones
      - A rockery and a sundial
      - Beauty you must look for
    alt: 'What the speaker expects, big showy flowers, compared with what Mrs Jones loves: tiny flowers between stones that you have to look for.'
  items:
  - prompt: What is Mrs Jones's garden mostly made of?
    options:
    - Stones
    - Grass
    - Fruit trees
    - Sand
    answer: Stones
    difficulty: 1
    hints:
    - Think of the title.
    - A crazy path and a rockery.
    solution: 'Her garden is full of stones: path, rockery, pond edge and sundial.'
  - prompt: Which line is repeated as a refrain in the poem?
    options:
    - My next-door neighbour, Mrs Jones
    - The flowers are tall
    - Concrete is grey
    - Come into the garden
    answer: My next-door neighbour, Mrs Jones
    difficulty: 1
    hints:
    - It names her.
    - It comes again and again.
    solution: The refrain is 'My next-door neighbour, Mrs Jones'.
  - prompt: What is funny about the end of the poem?
    options:
    - The speaker is standing on the tiny flower he is searching for
    - Mrs Jones falls into the pond
    - The sundial stops
    - The stones turn into flowers
    answer: The speaker is standing on the tiny flower he is searching for
    difficulty: 2
    hints:
    - It is ironic.
    - Look under his feet.
    solution: While hunting for a flower, he finds he has been standing on one.
  - prompt: Why is the title 'A Concrete Example' a pun?
    options:
    - '''Concrete'' means both stone/cement and a clear, real example'
    - Mrs Jones builds with concrete
    - It is about a building
    - Concrete is a kind of flower
    answer: '''Concrete'' means both stone/cement and a clear, real example'
    difficulty: 2
    hints:
    - A pun uses two meanings.
    - The garden is stony.
    solution: The word fits the stony garden and also means a clear example of the poem's idea.
    mistakes:
      Mrs Jones builds with concrete: eng8_poem_meaning
  - prompt: How small are Mrs Jones's flowers said to be?
    options:
    - So small they seem planted with a pin
    - As big as plates
    - As tall as the speaker
    - The size of the pond
    answer: So small they seem planted with a pin
    difficulty: 1
    hints:
    - Very tiny.
    - A sewing tool.
    solution: The flowers are so tiny they could have been planted with a pin.
  - prompt: Which theme best fits the poem?
    options:
    - Different people value different kinds of beauty
    - Gardens should have no stones
    - Neighbours always quarrel
    - Big flowers are best
    answer: Different people value different kinds of beauty
    difficulty: 2
    hints:
    - Mrs Jones loves what the speaker can't even see.
    - Respect others' passions.
    solution: The poem shows that beauty can be tiny and that people treasure different things.
- code: cbse8e.u1.wisdom
  title: Wisdom Paves the Way (play)
  after:
  - cbse8e.u1.concrete
  notes: |
    A play. Four young men, Ram Datt, Shiv Datt, Har Datt and Dev Datt, travel to Ujjain to find work. On
    the road they study the marks left by a camel and work out: it is lame, blind in its right eye, has a
    short tail, and has a stomach problem. A merchant who has lost his camel hears them describe it exactly
    and accuses them of stealing it. In the King of Ujjain's court each man explains his reasoning from
    what he observed (for example, the leaves were eaten only on one side of the path, so the camel could
    see only on one side). The king sees they are wise, not thieves, and makes them his advisers; the
    merchant is ashamed. Message: careful observation and reasoning; don't accuse without proof; listen
    before judging.
  explanations:
    text: Four young men on the road to Ujjain read a camel's tracks so well that they can describe it without seeing it. A merchant who has lost his camel thinks they must have stolen it. In court they explain each clue, and the king is so impressed by their reasoning that he makes them his advisers.
    visual: Picture a dusty road with uneven hoof marks, leaves nibbled only on one side, and four young men bending down to look closely, like detectives.
    step_by_step: 'Step 1: The journey to Ujjain. Step 2: The clues on the road. Step 3: The merchant''s accusation. Step 4: Each man explains his reasoning in court. Step 5: The king rewards wisdom; the merchant is ashamed.'
    real_world: 'Detectives, doctors and scientists all work like the four brothers: they look for small clues and reason carefully before deciding.'
  picture:
    kind: flow
    steps:
    - Four men travel to Ujjain for work
    - They read the camel's tracks on the road
    - A merchant accuses them of theft
    - In court each explains his clue
    - The king makes them his advisers
    alt: 'The play in five steps: the journey to Ujjain, reading the camel''s tracks, the merchant''s accusation, the explanations in court, and the king''s reward.'
  items:
  - prompt: Where were the four young men going?
    options:
    - Ujjain
    - Delhi
    - Hampi
    - Varanasi
    answer: Ujjain
    difficulty: 1
    hints:
    - An old city ruled by a wise king.
    - To find work.
    solution: They were travelling to Ujjain to look for work.
    mistakes:
      Hampi: eng8_read_again
  - prompt: How many young men travelled together?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Ram, Shiv, Har and Dev.
    - Count them.
    solution: 'Four: Ram Datt, Shiv Datt, Har Datt and Dev Datt.'
  - prompt: Why did the merchant accuse the young men?
    options:
    - They described his lost camel exactly
    - They were riding his camel
    - They had his money
    - They were seen near his house
    answer: They described his lost camel exactly
    difficulty: 1
    hints:
    - How could they know so much?
    - He jumped to a conclusion.
    solution: He thought only thieves could know so much about the camel.
  - prompt: How could one of the men tell the camel was blind in one eye?
    options:
    - It had eaten leaves on only one side of the path
    - He saw its eye
    - The merchant told him
    - Its footprints were small
    answer: It had eaten leaves on only one side of the path
    difficulty: 2
    hints:
    - What did the camel eat?
    - It could see only one side.
    solution: Leaves were eaten only on one side, so the camel saw only one side of the road.
  - prompt: What did the king do in the end?
    options:
    - Made the four men his advisers
    - Put them in prison
    - Gave the camel to them
    - Sent them away
    answer: Made the four men his advisers
    difficulty: 1
    hints:
    - He valued their minds.
    - A reward.
    solution: Impressed by their reasoning, the king made them his advisers.
  - prompt: What is the main lesson of the play?
    options:
    - Observe carefully and don't accuse without proof
    - Never travel in groups
    - Camels are hard to find
    - Merchants are always wrong
    answer: Observe carefully and don't accuse without proof
    difficulty: 2
    hints:
    - What did the men do well?
    - What did the merchant do wrong?
    solution: The men used observation and reasoning; the merchant judged without evidence.
    mistakes:
      Merchants are always wrong: eng8_whole_story
