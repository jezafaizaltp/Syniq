- code: cbse8e.u1.wisdom
  title: Wisdom Paves the Way (play)
  after:
  - cbse8e.u1.concrete
  notes: |
    A play. Four young men, Ram Datt, Shiv Datt, Har Datt and Dev Datt, travel to Ujjain to find work. On
    the road they study the marks left by a camel and work out: it is lame, blind in its right eye, has a
    short tail, and has a stomach problem. A merchant who has lost his camel hears them describe it exactly
    and accuses them of stealing it. In the King of Ujjain's court each man explains his reasoning from
    what he observed (for example, the leaves were eaten only on one side of the path, so the camel could
    see only on one side). The king sees they are wise, not thieves, and makes them his advisers; the
    merchant is ashamed. Message: careful observation and reasoning; don't accuse without proof; listen
    before judging.
  explanations:
    text: Four young men on the road to Ujjain read a camel's tracks so well that they can describe it without seeing it. A merchant who has lost his camel thinks they must have stolen it. In court they explain each clue, and the king is so impressed by their reasoning that he makes them his advisers.
    visual: Picture a dusty road with uneven hoof marks, leaves nibbled only on one side, and four young men bending down to look closely, like detectives.
    step_by_step: 'Step 1: The journey to Ujjain. Step 2: The clues on the road. Step 3: The merchant''s accusation. Step 4: Each man explains his reasoning in court. Step 5: The king rewards wisdom; the merchant is ashamed.'
    real_world: 'Detectives, doctors and scientists all work like the four brothers: they look for small clues and reason carefully before deciding.'
  picture:
    kind: flow
    steps:
    - Four men travel to Ujjain for work
    - They read the camel's tracks on the road
    - A merchant accuses them of theft
    - In court each explains his clue
    - The king makes them his advisers
    alt: 'The play in five steps: the journey to Ujjain, reading the camel''s tracks, the merchant''s accusation, the explanations in court, and the king''s reward.'
  activity:
    type: order
    prompt: 'Wisdom Paves the Way: put the play in order.'
    steps:
    - Four young men set out for Ujjain to find work
    - They study a camel's marks on the road
    - They describe the camel exactly to a merchant
    - The merchant accuses them of theft
    - Each explains his reasoning in the king's court
    - The king makes them his advisers
    reasons:
      They study a camel's marks on the road: On the way, they notice tracks and eaten leaves.
      They describe the camel exactly to a merchant: The merchant has lost his camel and listens.
      The merchant accuses them of theft: He thinks only thieves could know so much.
      Each explains his reasoning in the king's court: The king hears them before judging.
      The king makes them his advisers: He sees they are wise, not thieves.
  lesson:
    - teach: '''Wisdom Paves the Way'' is a play. Four young men, Ram Datt, Shiv Datt, Har Datt and Dev Datt, walk to Ujjain to find work. On the road they study the marks of a camel that passed by.'
      check:
        prompt: What kind of text is 'Wisdom Paves the Way'?
        options:
        - A play
        - A poem
        - A letter
        answer: A play
        why: It has characters speaking in scenes.
      ways:
      - style: visual
        teach: Who the travellers are and what they do on the road.
        picture:
          kind: compare
          columns:
          - title: The travellers
            points:
            - Ram Datt, Shiv Datt, Har Datt, Dev Datt
            - Four young men
            - Looking for work
          - title: The journey
            points:
            - On foot to Ujjain
            - They see the marks of a camel
            - They study the marks closely
          alt: Four young men, Ram Datt, Shiv Datt, Har Datt and Dev Datt, walk to Ujjain looking for work and study the marks a camel has left on the road.
      - style: real_world
        teach: A forest guard can look at tracks in the mud and say which animal passed, how big it was and how long ago, without ever seeing it. The four young men read the road in the same way.
    - teach: From the clues they work out that the camel was lame, blind in its right eye, had a short tail and a stomach problem. For example, leaves were eaten only on one side of the path, so it could see only on that side.
      picture:
        kind: compare
        columns:
        - title: Clue
          points:
          - Leaves eaten on one side only
          - Uneven footprints
          - Marks of a tail only nearby
        - title: What it shows
          points:
          - Blind in one eye
          - Lame
          - Short tail
        alt: 'Clues on the road and what they showed: eating on one side means blind in one eye; uneven prints mean lame; short tail marks mean a short tail.'
      check:
        prompt: 'Uneven footprints suggest the camel was:'
        options:
        - Lame
        - Blind
        - Hungry
        answer: Lame
        why: A lame animal steps unevenly.
      ways:
      - style: step_by_step
        teach: 'Step 1: Notice something on the road: leaves eaten on only one side. Step 2: Ask what could cause it. Step 3: Reason it out: the camel could see only on that side. Step 4: Do the same for every clue; together the clues describe the whole camel.'
      - style: real_world
        teach: A doctor cannot see a germ. The doctor looks at the fever, the rash and the cough and reasons the way to the illness. Careful observation and reasoning let you know things you never saw.
    - teach: 'A merchant hears them describe his lost camel exactly and accuses them of stealing it. In the king''s court each man explains his reasoning. The king sees they are wise, not thieves, and makes them his advisers. Lesson: observe carefully, and don''t accuse without proof.'
      check:
        prompt: Why was the merchant wrong to accuse them?
        options:
        - He had no proof they took the camel
        - They had the camel with them
        - They confessed
        answer: He had no proof they took the camel
        why: Describing something is not the same as stealing it.
      ways:
      - style: visual
        teach: How the young men go from being accused to being honoured.
        picture:
          kind: flow
          steps:
          - The men describe the lost camel exactly
          - The merchant accuses them of stealing it
          - In court each man explains his reasoning
          - The king sees they are wise, not thieves
          - He makes them his advisers
          alt: The men describe the camel, the merchant accuses them, each explains his reasoning in court, the king sees they are wise and makes them his advisers.
      - style: real_world
        teach: If a classmate can describe your lost pencil box exactly, it may be because they took it, or because they notice things. Before blaming, ask how they know. The merchant skipped that question; the king asked it.
