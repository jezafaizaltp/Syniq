  e8x_order: 'Retell the story in your head from the start: what had to happen before this?'
concepts:
- code: cbse8e.u1.wit
  title: The Wit that Won Hearts
  notes: |
    Setting: the Vijayanagara Empire under King Krishnadeva Raya, a powerful king who loved art and
    literature. Tenali Ramakrishna (Tenali Rama) was one of the Ashtadiggajas, the eight great poets of his
    court, famous for his wit. Queen Thirumalambal yawned while the king was reading out his work; the proud
    king felt insulted and stopped speaking to her. The palace grew silent and the queen was distraught.
    Tenali Rama came to court with seeds and said they would give a wonderful yield, but only if sown by
    someone who had never yawned. The king laughed: nobody can live without yawning! Tenali replied that
    then the queen's yawn was natural too. The king saw his mistake, apologised, and peace returned.
    Message: wit is being clever and kind at once; humour can mend a quarrel where argument fails; pride
    harms relationships. Words: distraught (deeply upset), forlorn (lonely and sad), unfazed (not worried).
  explanations:
    text: The king was hurt when the queen yawned while he read out his writing, and stopped speaking to her. Tenali Rama brought seeds that, he said, would only grow if sown by someone who had never yawned. The king laughed that no one is like that, and suddenly saw that the queen's yawn was natural too.
    visual: 'Picture a silent palace: a sad queen in one room, a proud king in another. Then Tenali Rama walks in holding out a handful of seeds, and the king bursts out laughing.'
    step_by_step: 'Step 1: The problem: the king is offended by a yawn. Step 2: The result: silence and sadness in the palace. Step 3: Tenali''s trick: seeds that only a never-yawning person can sow. Step 4: The king laughs and realises everyone yawns. Step 5: He makes peace with the queen.'
    real_world: When two friends quarrel over something small, a kind joke that helps them see it differently often works better than taking sides.
  picture:
    kind: flow
    steps:
    - The queen yawns as the king reads
    - The proud king stops speaking to her
    - Tenali Rama brings 'special' seeds
    - Only someone who never yawns may sow them
    - The king laughs, sees his mistake and makes peace
    alt: 'The story in five steps: the queen''s yawn, the king''s silence, Tenali Rama''s seeds, the condition that the sower must never have yawned, and the king making peace.'
  activity:
    type: order
    prompt: 'The Wit that Won Hearts: put the story in order.'
    steps:
    - The queen yawns as the king reads
    - The king feels insulted and stops speaking to her
    - Tenali brings seeds to court
    - Only someone who never yawned may sow them
    - 'The king laughs: everyone yawns'
    - The king apologises to the queen
    reasons:
      The king feels insulted and stops speaking to her: His pride is hurt.
      Tenali brings seeds to court: The palace is silent and the queen upset.
      Only someone who never yawned may sow them: Tenali sets up his trick.
      'The king laughs: everyone yawns': He sees the condition is impossible.
      The king apologises to the queen: He sees her yawn was natural too.
  lesson:
    - teach: The story is set in the Vijayanagara Empire. King Krishnadeva Raya loved poetry. Tenali Rama was one of the Ashtadiggajas, the eight great poets of his court, and was famous for his wit.
      check:
        prompt: Who was Tenali Rama?
        options:
        - A witty poet at Krishnadeva Raya's court
        - The queen's brother
        - A merchant from Ujjain
        answer: A witty poet at Krishnadeva Raya's court
        why: He was one of the Ashtadiggajas.
    - teach: Queen Thirumalambal yawned while the king read out his work. The proud king felt insulted and stopped speaking to her. The queen was distraught (deeply upset) and the palace fell silent.
      picture:
        kind: flow
        steps:
        - Queen yawns
        - King feels insulted
        - King stops speaking to her
        - Queen is distraught
        alt: The queen yawns, the king feels insulted and stops speaking to her, and she becomes very upset.
      check:
        prompt: What does 'distraught' mean?
        options:
        - Deeply upset
        - Very happy
        - Sleepy
        answer: Deeply upset
        why: The queen was so upset she could not be calm.
    - teach: 'Tenali brought seeds that would give a wonderful crop only if sown by someone who had never yawned. The king laughed: nobody can live without yawning! Tenali replied that the queen''s yawn was natural too. The king saw his mistake and made peace. Wit means being clever and kind at once.'
      check:
        prompt: How did Tenali make the king see his mistake?
        options:
        - He made the king say himself that everyone yawns
        - He ordered the king to apologise
        - He gave the queen a gift
        answer: He made the king say himself that everyone yawns
        why: The king's own laugh showed him the yawn was natural.
  items:
  - prompt: Which empire is the story set in?
    options:
    - Vijayanagara
    - Maurya
    - Mughal
    - Chola
    answer: Vijayanagara
    difficulty: 1
    hints:
    - Krishnadeva Raya's kingdom.
    - In South India.
    solution: The story is set in the Vijayanagara Empire under Krishnadeva Raya.
    mistakes:
      Mughal: eng8_read_again
  - prompt: Who used wit to end the quarrel?
    options:
    - Tenali Rama
    - The queen's father
    - The chief minister
    - A travelling monk
    answer: Tenali Rama
    difficulty: 1
    hints:
    - A poet of the court.
    - One of the Ashtadiggajas.
    solution: Tenali Ramakrishna, the witty court poet, solved the problem.
    mistakes: {"The chief minister": "e8_tenali"}
  - prompt: The Ashtadiggajas were the great poets of Krishnadeva Raya's court. How many were there? ('Ashta' means eight.)
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - '''Ashta'' is a number word.'
    - Ashta = eight.
    solution: There were eight Ashtadiggajas.
    mistakes: {"4": "e8_ashta", "6": "e8_ashta"}
  - prompt: Why was the king angry with the queen?
    options:
    - She yawned while he was reading his work
    - She broke his crown
    - She laughed at Tenali Rama
    - She left the palace
    answer: She yawned while he was reading his work
    difficulty: 1
    hints:
    - Something very small.
    - He felt insulted.
    solution: He took her yawn as disrespect for his writing.
    mistakes: {"She laughed at Tenali Rama": "e8_queen_yawn"}
  - prompt: What condition did Tenali Rama put on sowing the seeds?
    options:
    - They must be sown by someone who has never yawned
    - They must be sown at midnight
    - They must be sown by the queen
    - They must be watered with milk
    answer: They must be sown by someone who has never yawned
    difficulty: 2
    hints:
    - It links to the quarrel.
    - Nobody can meet this condition.
    solution: Only someone who had never yawned could sow them, and no such person exists.
    mistakes: {"They must be sown at midnight": "e8_never_yawned"}
  - prompt: What is the main message of the story?
    options:
    - Kind, clever humour can mend a quarrel caused by pride
    - Kings should never read in public
    - Seeds should be sown carefully
    - Yawning is rude
    answer: Kind, clever humour can mend a quarrel caused by pride
    difficulty: 2
    hints:
    - How was the problem solved?
    - Not by arguing.
    solution: Tenali's gentle wit helped the proud king see his mistake.
    mistakes:
      Yawning is rude: eng8_whole_story
  - prompt: Who was the king in the story?
    options:
    - Krishnadeva Raya
    - Akbar
    - The King of Ujjain
    answer: Krishnadeva Raya
    difficulty: 1
    hints:
    - He ruled Vijayanagara.
    - He loved art and literature.
    solution: King Krishnadeva Raya ruled the Vijayanagara Empire.
    mistakes:
      Akbar: e8x_king
      The King of Ujjain: e8x_king
  - prompt: Why did the king laugh at Tenali's condition?
    options:
    - Because no one can live without yawning
    - Because the seeds were fake
    - Because Tenali was late
    answer: Because no one can live without yawning
    difficulty: 2
    hints:
    - 'Think about the condition: someone who has never yawned.'
    - Does such a person exist?
    solution: Everyone yawns, so the condition was impossible, and that was Tenali's point.
    mistakes:
      Because the seeds were fake: e8_never_yawned
      Because Tenali was late: e8_never_yawned
  - prompt: '''The forlorn queen sat alone.'' What does ''forlorn'' mean?'
    options:
    - Lonely and sad
    - Proud and angry
    - Cheerful and busy
    answer: Lonely and sad
    difficulty: 2
    hints:
    - She sat alone after the king stopped speaking to her.
    - How would that make her feel?
    solution: Forlorn means lonely and sad.
    mistakes:
      Proud and angry: e8x_vocab
      Cheerful and busy: e8x_vocab
  - prompt: Which word best describes the king at the start of the quarrel?
    options:
    - Proud
    - Humble
    - Sleepy
    answer: Proud
    difficulty: 2
    hints:
    - He felt insulted by a yawn.
    - He thought his work deserved full attention.
    solution: His hurt pride made him stop speaking to the queen.
    mistakes:
      Humble: e8x_char
      Sleepy: e8x_char
  - prompt: '''Tenali was unfazed by the king''s laughter.'' What does ''unfazed'' mean?'
    options:
    - Not worried
    - Very frightened
    - Angry
    answer: Not worried
    difficulty: 2
    hints:
    - '''Un-'' means not.'
    - Tenali stayed calm and replied cleverly.
    solution: Unfazed means not worried or disturbed.
    mistakes:
      Very frightened: e8x_vocab
      Angry: e8x_vocab
  - prompt: Why did Tenali use a trick instead of telling the king he was wrong?
    options:
    - A proud king would listen to a joke more than to criticism
    - Tenali was afraid to speak
    - The queen asked him to lie
    answer: A proud king would listen to a joke more than to criticism
    difficulty: 3
    hints:
    - How do proud people react when told they are wrong?
    - Humour lets someone discover the mistake himself.
    solution: A clever joke let the king see his mistake without being shamed.
    mistakes:
      Tenali was afraid to speak: e8x_why
      The queen asked him to lie: e8x_why
  - prompt: What happened right after the queen yawned?
    options:
    - The king felt insulted
    - Tenali brought seeds
    - The king apologised
    answer: The king felt insulted
    difficulty: 1
    hints:
    - Retell the story from the yawn.
    - The seeds and apology came much later.
    solution: The yawn hurt the king's pride first; everything else followed.
    mistakes:
      Tenali brought seeds: e8x_order
      The king apologised: e8x_order
  - prompt: 'Change to reported speech: The king said, "Nobody can live without yawning."'
    options:
    - The king said that nobody could live without yawning.
    - The king said that nobody can lived without yawning.
    - The king says nobody could live without yawning.
    answer: The king said that nobody could live without yawning.
    difficulty: 3
    hints:
    - Use 'that' after 'said'.
    - '''Can'' moves back to ''could''.'
    solution: 'In reported speech ''can'' becomes ''could'': nobody could live without yawning.'
    mistakes:
      The king said that nobody can lived without yawning.: e8x_reported
      The king says nobody could live without yawning.: e8x_reported
  - prompt: Which saying fits the story best?
    options:
    - A kind joke can heal what anger breaks
    - Never trust a poet
    - Seeds always grow
    answer: A kind joke can heal what anger breaks
    difficulty: 2
    hints:
    - What ended the quarrel?
    - It was humour, not force.
    solution: Tenali's kind humour ended a quarrel caused by pride.
    mistakes:
