subject: cbse8-eng
chapter: 1
title: 'Wit and Wisdom: The Wit that Won Hearts · A Concrete Example · Wisdom Paves the Way'
tips:
  eng8_read_again: 'Go back to the chapter: the answer is in the text. Find the part about that person or event.'
  eng8_poem_meaning: Poems often mean more than they say. Ask what the picture in the poem stands for in life.
  eng8_whole_story: 'Think about the whole story, not just one line: what changes from the start to the end?'
  e8_accused: "They had never seen the camel. Why did the merchant think they had stolen it?"
  e8_advisers: "The king was impressed by how much they noticed. What job would suit such sharp minds?"
  e8_ashta: "The question gives you the meaning of 'Ashta'. Use it."
  e8_beauty: "Mrs Jones loves her stone garden; the speaker finds it odd. What does that show about taste?"
  e8_four_men: "Count the young men in the story. Each one noticed a different thing about the camel."
  e8_never_yawned: "Tenali's condition was impossible for anyone, even the king. It was about the same thing the queen had done."
  e8_one_side: "He never saw the camel. What clue on the path would show it could see only one way?"
  e8_queen_yawn: "The king felt insulted while sharing his own writing. What did the queen's mouth do?"
  e8_refrain_jones: "A refrain is a line repeated again and again. It names the neighbour."
  e8_standing_on: "The speaker can't find a flower anywhere. Where was it all along?"
  e8_stones: "The poem's title describes the garden. Concrete and ... ?"
  e8_tenali: "The court jester of Vijayanagara was famous for clever tricks that solved problems."
  e8_tiny: "The joke is that the flowers are hard to see. How tiny would they be?"
  e8x_reported: "In reported speech, add 'that', keep the past tense 'said', and move 'can' back to 'could'."
  e8x_why: "Think about how a proud person reacts when told plainly that they are wrong."
  e8x_king: "Which king ruled Vijayanagara and loved poetry?"
  e8x_court: "The case was heard in the court of the city the men were walking to."
  e8x_rhyme: "Rhyming words end with the same sound. Say each pair aloud."
  e8x_vocab: 'Read the sentence around the word: is the feeling happy, sad, worried or calm?'
  e8x_device: A pun plays on two meanings; a refrain repeats; irony is when the opposite of what you expect happens.
  e8x_clue: Each clue on the road told the men one thing about the camel. Match the clue to what it showed.
  e8x_char: Think about what the character did, then pick the word that describes it.
  e8x_order: 'Retell the story in your head from the start: what had to happen before this?'
  pqc8e1_opposite: In each case, what happens is the opposite of what you would expect. Which device is about that?
concepts:
- code: cbse8e.u1.wit
  title: The Wit that Won Hearts
  notes: |
    Setting: the Vijayanagara Empire under King Krishnadeva Raya, a powerful king who loved art and
    literature. Tenali Ramakrishna (Tenali Rama) was one of the Ashtadiggajas, the eight great poets of his
    court, famous for his wit. Queen Thirumalambal yawned while the king was reading out his work; the proud
    king felt insulted and stopped speaking to her. The palace grew silent and the queen was distraught.
    Tenali Rama came to court with seeds and said they would give a wonderful yield, but only if sown by
    someone who had never yawned. The king laughed: nobody can live without yawning! Tenali replied that
    then the queen's yawn was natural too. The king saw his mistake, apologised, and peace returned.
    Message: wit is being clever and kind at once; humour can mend a quarrel where argument fails; pride
    harms relationships. Words: distraught (deeply upset), forlorn (lonely and sad), unfazed (not worried).
  explanations:
    text: The king was hurt when the queen yawned while he read out his writing, and stopped speaking to her. Tenali Rama brought seeds that, he said, would only grow if sown by someone who had never yawned. The king laughed that no one is like that, and suddenly saw that the queen's yawn was natural too.
    visual: 'Picture a silent palace: a sad queen in one room, a proud king in another. Then Tenali Rama walks in holding out a handful of seeds, and the king bursts out laughing.'
    step_by_step: 'Step 1: The problem: the king is offended by a yawn. Step 2: The result: silence and sadness in the palace. Step 3: Tenali''s trick: seeds that only a never-yawning person can sow. Step 4: The king laughs and realises everyone yawns. Step 5: He makes peace with the queen.'
    real_world: When two friends quarrel over something small, a kind joke that helps them see it differently often works better than taking sides.
  picture:
    kind: flow
    steps:
    - The queen yawns as the king reads
    - The proud king stops speaking to her
    - Tenali Rama brings 'special' seeds
    - Only someone who never yawns may sow them
    - The king laughs, sees his mistake and makes peace
    alt: 'The story in five steps: the queen''s yawn, the king''s silence, Tenali Rama''s seeds, the condition that the sower must never have yawned, and the king making peace.'
  activity:
    type: order
    prompt: 'The Wit that Won Hearts: put the story in order.'
    steps:
    - The queen yawns as the king reads
    - The king feels insulted and stops speaking to her
    - Tenali brings seeds to court
    - Only someone who never yawned may sow them
    - 'The king laughs: everyone yawns'
    - The king apologises to the queen
    reasons:
      The king feels insulted and stops speaking to her: His pride is hurt.
      Tenali brings seeds to court: The palace is silent and the queen upset.
      Only someone who never yawned may sow them: Tenali sets up his trick.
      'The king laughs: everyone yawns': He sees the condition is impossible.
      The king apologises to the queen: He sees her yawn was natural too.
  lesson:
    - teach: The story is set in the Vijayanagara Empire. King Krishnadeva Raya loved poetry. Tenali Rama was one of the Ashtadiggajas, the eight great poets of his court, and was famous for his wit.
      check:
        prompt: Who was Tenali Rama?
        options:
        - A witty poet at Krishnadeva Raya's court
        - The queen's brother
        - A merchant from Ujjain
        answer: A witty poet at Krishnadeva Raya's court
        why: He was one of the Ashtadiggajas.
      ways:
      - style: visual
        teach: Where the story happens and who Tenali Rama is.
        picture:
          kind: compare
          columns:
          - title: The setting
            points:
            - The Vijayanagara Empire
            - The court of King Krishnadeva Raya
            - A king who loved poetry
          - title: Tenali Rama
            points:
            - One of the Ashtadiggajas
            - The eight great poets of the court
            - Famous for his wit
          alt: The story is set at the court of King Krishnadeva Raya of Vijayanagara, who loved poetry; Tenali Rama was one of its eight great poets and famous for his wit.
      - style: real_world
        teach: Every class has someone who can cool a quarrel with a well-timed joke that hurts nobody. That gift is what the story calls wit, and Tenali Rama had it at a king's court.
    - teach: Queen Thirumalambal yawned while the king read out his work. The proud king felt insulted and stopped speaking to her. The queen was distraught (deeply upset) and the palace fell silent.
      picture:
        kind: flow
        steps:
        - Queen yawns
        - King feels insulted
        - King stops speaking to her
        - Queen is distraught
        alt: The queen yawns, the king feels insulted and stops speaking to her, and she becomes very upset.
      check:
        prompt: What does 'distraught' mean?
        options:
        - Deeply upset
        - Very happy
        - Sleepy
        answer: Deeply upset
        why: The queen was so upset she could not be calm.
      ways:
      - style: step_by_step
        teach: 'Step 1: The king reads his work aloud. Step 2: The queen yawns. Step 3: The king''s pride is hurt, and he stops speaking to her. Step 4: The queen is distraught, and the palace falls silent.'
      - style: real_world
        teach: Think of reading your essay to a friend who yawns halfway through. It stings, even if the friend was only tired. The king felt that sting, and his pride turned a small thing into a long silence.
    - teach: 'Tenali brought seeds that would give a wonderful crop only if sown by someone who had never yawned. The king laughed: nobody can live without yawning! Tenali replied that the queen''s yawn was natural too. The king saw his mistake and made peace. Wit means being clever and kind at once.'
      check:
        prompt: How did Tenali make the king see his mistake?
        options:
        - He made the king say himself that everyone yawns
        - He ordered the king to apologise
        - He gave the queen a gift
        answer: He made the king say himself that everyone yawns
        why: The king's own laugh showed him the yawn was natural.
      ways:
      - style: visual
        teach: How Tenali's trick with the seeds leads the king to his own mistake.
        picture:
          kind: flow
          steps:
          - Tenali brings seeds that promise a wonderful crop
          - 'Condition: the sower must never have yawned'
          - 'The king laughs: nobody can live without yawning'
          - 'Tenali: then the queen''s yawn was natural too'
          - The king sees his mistake and makes peace
          alt: Tenali brings seeds that only someone who has never yawned may sow; the king laughs that nobody can live without yawning; Tenali points out the queen's yawn was natural; the king makes peace.
      - style: step_by_step
        teach: 'Step 1: Tenali does not tell the king, ''You are wrong.'' Step 2: He sets a condition that sounds silly. Step 3: The king himself says the truth aloud: everyone yawns. Step 4: Tenali only has to point to what the king has just said.'
  items:
  - prompt: Which empire is the story set in?
    options:
    - Vijayanagara
    - Maurya
    - Mughal
    - Chola
    answer: Vijayanagara
    difficulty: 1
