tips:
  eng8_read_again: 'Go back to the chapter: the answer is in the text. Find the part about that person or event.'
  eng8_poem_meaning: Poems often mean more than they say. Ask what the picture in the poem stands for in life.
  eng8_whole_story: 'Think about the whole story, not just one line: what changes from the start to the end?'
  e8_accused: "They had never seen the camel. Why did the merchant think they had stolen it?"
  e8_advisers: "The king was impressed by how much they noticed. What job would suit such sharp minds?"
  e8_ashta: "The question gives you the meaning of 'Ashta'. Use it."
  e8_beauty: "Mrs Jones loves her stone garden; the speaker finds it odd. What does that show about taste?"
  e8_four_men: "Count the young men in the story. Each one noticed a different thing about the camel."
  e8_never_yawned: "Tenali's condition was impossible for anyone, even the king. It was about the same thing the queen had done."
  e8_one_side: "He never saw the camel. What clue on the path would show it could see only one way?"
  e8_queen_yawn: "The king felt insulted while sharing his own writing. What did the queen's mouth do?"
  e8_refrain_jones: "A refrain is a line repeated again and again. It names the neighbour."
  e8_standing_on: "The speaker can't find a flower anywhere. Where was it all along?"
  e8_stones: "The poem's title describes the garden. Concrete and ... ?"
  e8_tenali: "The court jester of Vijayanagara was famous for clever tricks that solved problems."
  e8_tiny: "The joke is that the flowers are hard to see. How tiny would they be?"
  e8x_reported: "In reported speech, add 'that', keep the past tense 'said', and move 'can' back to 'could'."
  e8x_why: "Think about how a proud person reacts when told plainly that they are wrong."
  e8x_king: "Which king ruled Vijayanagara and loved poetry?"
  e8x_court: "The case was heard in the court of the city the men were walking to."
  e8x_rhyme: "Rhyming words end with the same sound. Say each pair aloud."
  e8x_vocab: 'Read the sentence around the word: is the feeling happy, sad, worried or calm?'
