# CBSE Class 8 English (NCERT Poorvi, 2025), unit 3: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse8-eng
chapter: 3
title: 'Mystery and Magic: The Case of the Fifth Word · The Magic Brush of Dreams · Spectacular Wonders'
tips:
  e8_biolum: "'Bio' means living. Tiny living things in the water make the light."
  e8_chandipur: "The sea goes away and comes back twice a day. What makes the sea rise and fall?"
  e8_fifth: "Monday, Tuesday, Wednesday, Thursday... which day comes next?"
  e8_fir: "The hidden word sounds like a kind of tree, one of the code words spelled differently."
  e8_gopi_helps: "The zamindar is the villain. Gopi uses the brush for people who need things."
  e8_gopi_quality: "Gopi is a poor girl with no army. She beats him with her mind and nerve."
  e8_greed: "The zamindar never helps anyone. What does a greedy man want?"
  e8_illusion: "There is no magnet. The land tricks our eyes about which way is uphill."
  e8_logic: "The case was solved by noticing the code, not by fighting."
  e8_lonar: "Lonar is a round crater. Something fell from space and hit the ground."
  e8_magic_brush: "The story is about magic. What happens to Gopi's pictures?"
  e8_sundarbans: "Mangroves grow where rivers meet the sea. The biggest is in the Ganga delta, home to tigers."
  e8_utes: "Unscramble 'Utes' into the first letters of a day: T-U-E-S."
  e8_weekdays: "Four words are given and one is missing. Count Monday to Friday on your fingers."
  e8_zamindar: "'Zamin' means land."
  e8m_habitat: "Which animal can live in hot, wet mangrove swamps? Snow leopards need cold mountains and camels dry deserts."
  e8m_villain: "Who in the story was greedy and wanted power for himself?"
  e8m_pattern: Look inside each code word for part of a day's name, in order.
  e8m_vocab: Read the sentence around the word and ask what it must mean there.
  e8m_char: Think about what the character did when it was hard. Which word fits that choice?
  e8m_place: 'Match each wonder to its state: think about where on India''s map it lies.'
  e8m_science: Each wonder has a scientific cause. Is it light from living things, a meteorite, a slope, or tides?

concepts:
- code: cbse8e.u3.fifth
  title: The Case of the Fifth Word
  notes: |
    A detective story (an Encyclopedia Brown mystery by Donald J. Sobol). Encyclopedia Brown (Leroy) is a
    clever boy in Idaville; his father, Chief Brown, is the chief of police, and he often helps solve cases at
    the dinner table. About five years earlier a jewellery store was robbed; Tim Nolan and Daniel Davenport
    were suspected but nothing could be proved and the jewels were never found. Davenport disappeared; Nolan
    ran a palm-tree nursery. Nolan dies and leaves Davenport a coded message: "Nom Utes Sweden Hurts."
    Encyclopedia sees that each word hides part of a weekday: Nom (Monday), Utes (Tuesday), Sweden (Wednesday),
    Hurts (Thursday). The missing fifth word is Friday, which sounds like 'fir tree': the jewels are hidden
    under a fir tree at the nursery. Message: careful reading, patterns and logic solve mysteries.
  explanations:
    text: 'A robber leaves a strange message, ''Nom Utes Sweden Hurts'', for his partner. Young Encyclopedia Brown spots a pattern: the words sound like Monday, Tuesday, Wednesday and Thursday. The missing fifth word, Friday, sounds like ''fir tree'', and that is where the stolen jewels are hidden.'
    visual: 'Write the four words in a row and the weekdays under them: Nom/Monday, Utes/Tuesday, Sweden/Wednesday, Hurts/Thursday, then an empty box for the fifth: Friday, and a picture of a fir tree.'
    step_by_step: 'Step 1: The old robbery and two suspects. Step 2: Nolan''s coded message. Step 3: Spot the pattern: each word matches a weekday. Step 4: Find the fifth: Friday. Step 5: ''Friday'' points to a fir tree, where the jewels are.'
    real_world: 'Codes and patterns are used in real life too: computers, banks and puzzles all depend on spotting a hidden rule.'
  picture:
    kind: flow
    steps:
    - A jewellery robbery five years ago
    - 'Nolan leaves a code: Nom Utes Sweden Hurts'
    - 'Pattern: Monday, Tuesday, Wednesday, Thursday'
    - The fifth word is Friday
    - '''Friday'' points to a fir tree: the jewels are there'
    alt: 'The mystery in five steps: the old robbery, the code Nom Utes Sweden Hurts, the weekday pattern, the fifth word Friday, and the fir tree where the jewels are hidden.'
  activity:
    type: sort
    prompt: 'The Case of the Fifth Word: which weekday hides in each word?'
    bins:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    items:
    - label: Nom
      bin: Monday
      clue: Rearrange its three letters.
      why: N-o-m has the same letters as 'Mon', the start of Monday.
    - label: Utes
      bin: Tuesday
      clue: Rearrange its four letters.
      why: U-t-e-s has the same letters as 'Tues'.
    - label: Sweden
      bin: Wednesday
      clue: Look for a short word hidden inside.
      why: S-wed-en hides 'Wed'.
    - label: Hurts
      bin: Thursday
      clue: Rearrange its five letters.
      why: H-u-r-t-s has the same letters as 'Thurs'.
    - label: The missing fifth word
      bin: Friday
      clue: What comes after the fourth day of the pattern?
      why: Mon, Tues, Wed, Thurs… the next is Fri, which sounds like 'fir' tree.
  lesson:
    - teach: '''The Case of the Fifth Word'' is an Encyclopedia Brown mystery by Donald J. Sobol. Leroy ''Encyclopedia'' Brown is a clever boy in Idaville; his father, Chief Brown, is the chief of police.'
      check:
        prompt: Why is Leroy called 'Encyclopedia'?
        options:
        - He knows so much and thinks clearly
        - He sells books
        - He is very tall
        answer: He knows so much and thinks clearly
        why: An encyclopedia holds a lot of knowledge.
    - teach: 'Five years earlier, jewels were stolen. Tim Nolan and Daniel Davenport were suspects but nothing was proved. Before dying, Nolan leaves Davenport a coded message: ''Nom Utes Sweden Hurts.'''
      check:
        prompt: Who left the coded message?
        options:
        - Tim Nolan
        - Chief Brown
        - Daniel Davenport
        answer: Tim Nolan
        why: Nolan wrote it for Davenport before he died.
    - teach: 'Encyclopedia sees a pattern: each word hides part of a weekday. Nom = Monday, Utes = Tuesday, Sweden = Wednesday, Hurts = Thursday. The fifth word is Friday, which sounds like ''fir tree''. The jewels are under a fir tree at Nolan''s nursery.'
      picture:
        kind: compare
        columns:
        - title: Code word
          points:
          - Nom
          - Utes
          - Sweden
          - Hurts
          - (missing)
        - title: Weekday hidden
          points:
          - MONday
          - tUESday
          - WEDNESday
          - THURSday
          - FRIday → fir tree
        alt: 'Each code word hides a weekday: Nom–Monday, Utes–Tuesday, Sweden–Wednesday, Hurts–Thursday, and the missing fifth is Friday, sounding like fir tree.'
      check:
        prompt: Which weekday does 'Hurts' hide?
        options:
        - Thursday
        - Tuesday
        - Friday
        answer: Thursday
        why: Hurts sounds like the 'Thurs' in Thursday.
  items:
  - prompt: Who solves the mystery?
    options:
    - Encyclopedia Brown
    - Chief Brown
    - Tim Nolan
    - Daniel Davenport
    answer: Encyclopedia Brown
    difficulty: 1
    hints:
    - A clever boy.
    - The chief's son.
    solution: Encyclopedia Brown, the police chief's son, solves the case.
    mistakes:
      Chief Brown: eng8_read_again
  - prompt: Which weekday does the word 'Utes' stand for?
    options:
    - Tuesday
    - Monday
    - Thursday
    - Saturday
    answer: Tuesday
    difficulty: 1
    hints:
    - 'Say it aloud: T-utes-day.'
    - The second word.
    solution: '''Utes'' sits inside ''Tuesday''.'
    mistakes: {"Thursday": "e8_utes"}
  - prompt: What is the fifth word in the pattern?
    options:
    - Friday
    - Saturday
    - Sunday
    - Monday
    answer: Friday
    difficulty: 1
    hints:
    - Monday to Thursday come first.
    - What comes after Thursday?
    solution: After Monday, Tuesday, Wednesday and Thursday comes Friday.
    mistakes: {"Saturday": "e8_fifth"}
  - prompt: Where were the jewels hidden?
    options:
    - Under a fir tree
    - In a bank
    - Inside a palm tree
    - In Davenport's car
    answer: Under a fir tree
    difficulty: 2
    hints:
    - '''Friday'' sounds like…'
    - Fri-day → fir.
    solution: '''Friday'' points to a fir tree at the nursery.'
    mistakes: {"Inside a palm tree": "e8_fir"}
  - prompt: Nolan's code has four words for Monday to Thursday. Counting the missing word, how many weekdays from Monday to Friday are there?
    answer: '5'
    check: 4 + 1
    difficulty: 2
    hints:
    - Add the missing word.
    - 4 + 1.
    solution: Four words plus the missing fifth, Friday, makes 5.
    mistakes: {"4": "e8_weekdays"}
  - prompt: What skill does the story mainly show?
    options:
    - Spotting patterns and thinking logically
    - Running fast
    - Fighting criminals
    - Growing palm trees
    answer: Spotting patterns and thinking logically
    difficulty: 2
    hints:
    - How was the code cracked?
    - A hidden rule.
    solution: Encyclopedia notices the weekday pattern and reasons to the answer.
    mistakes: {"Fighting criminals": "e8_logic"}
  - prompt: Who wrote the Encyclopedia Brown stories?
    options:
    - Donald J. Sobol
    - Mary Dow Brine
    - Verghese Kurien
    answer: Donald J. Sobol
    difficulty: 2
    hints:
    - He wrote many short detective stories.
    - Brine wrote a poem; Kurien a letter.
    solution: Donald J. Sobol wrote the Encyclopedia Brown series.
    mistakes:
      Mary Dow Brine: eng8_read_again
      Verghese Kurien: eng8_read_again
  - prompt: What is the name of Encyclopedia's town?
    options:
    - Idaville
    - Ujjain
    - Anand
    answer: Idaville
    difficulty: 2
    hints:
    - It is an American story.
    - Ujjain and Anand are in India.
    solution: Encyclopedia Brown lives in Idaville.
    mistakes:
      Ujjain: eng8_read_again
      Anand: eng8_read_again
  - prompt: Which weekday does 'Sweden' hide?
    options:
    - Wednesday
    - Monday
    - Sunday
    answer: Wednesday
    difficulty: 2
    hints:
    - It is the third word in the code.
    - Listen for 'wed-n'.
    solution: Sweden contains the sound of 'Wednes' in Wednesday.
    mistakes:
      Monday: e8m_pattern
      Sunday: e8m_pattern
  - prompt: What business did Tim Nolan run?
    options:
    - A palm-tree nursery
    - A jewellery shop
    - A bakery
    answer: A palm-tree nursery
    difficulty: 2
    hints:
    - It had many trees.
    - That helps explain where the jewels were hidden.
    solution: Nolan ran a nursery of palm trees, where one fir tree hid the jewels.
    mistakes:
      A jewellery shop: e8_fir
      A bakery: e8_fir
  - prompt: Why did Nolan write the message in code?
    options:
    - So only someone clever enough could find the jewels
    - Because he couldn't spell
    - To help the police
    answer: So only someone clever enough could find the jewels
    difficulty: 3
    hints:
    - He meant it for his partner, not for everyone.
    - A plain message would tell anyone.
    solution: A code hides the location from anyone who can't work it out.
    mistakes:
      Because he couldn't spell: e8_logic
      To help the police: e8_logic
  - prompt: Why is a fir tree a good fit for the fifth word?
    options:
    - '''Fir'' sounds like the start of ''Friday'''
    - Fir trees grow only on Fridays
    - Fir is a kind of jewel
    answer: '''Fir'' sounds like the start of ''Friday'''
    difficulty: 2
    hints:
    - Say 'Fri' and 'fir' aloud.
    - The code works by sounds.
    solution: 'Fri-day sounds like fir: the fifth word points to a fir tree.'
    mistakes:
      Fir trees grow only on Fridays: e8_fir
      Fir is a kind of jewel: e8_fir
  - prompt: '''Davenport was a suspect.'' What is a suspect?'
    options:
    - A person thought to have done a crime
    - A police officer
    - A judge
    answer: A person thought to have done a crime
    difficulty: 1
    hints:
    - Nothing was proved against him.
    - People suspected him.
    solution: A suspect is someone believed possibly guilty of a crime.
    mistakes:
      A police officer: e8m_vocab
      A judge: e8m_vocab
  - prompt: Which word best describes Encyclopedia?
    options:
    - Observant
    - Careless
    - Fearful
    answer: Observant
    difficulty: 1
    hints:
    - He noticed a hidden pattern.
    - Others missed it.
    solution: He notices small details that others miss.
    mistakes:
      Careless: e8m_char
      Fearful: e8m_char
  - prompt: The robbery was about five years before the story. If the story is set in 1975, in which year was the robbery?
    answer: '1970'
    check: 1975-5
    difficulty: 1
    hints:
    - Go back in time.
    - Take five years away.
    solution: 1975 − 5 = 1970.
    mistakes:
      '1980': e8v_gap
- code: cbse8e.u3.brush
  title: The Magic Brush of Dreams
  after:
  - cbse8e.u3.fifth
  notes: |
    Gopi, a kind and creative girl, has a magic paintbrush: whatever she paints becomes real. She uses it to
    help the poor villagers, painting things they need. A greedy zamindar (landlord) wants the brush's power
    for himself and orders Gopi to paint riches and grand things for him (such as a tall fortress). Gopi
    refuses to serve greed and cleverly uses her painting to escape and defeat his plans; the villagers are
    safe and celebrate. Themes: good against greed; use your talents to help others; courage and
    intelligence can defeat power; a gift is a responsibility.
  explanations:
    text: 'Gopi has a magic brush: whatever she paints comes to life. She paints what the poor villagers need. A greedy zamindar tries to force her to paint riches for him, but she uses her wits and her brush to escape and defeat his greed. Talents are for helping others.'
    visual: Picture a girl painting a water pot that turns real for a thirsty family, and a frowning landlord in fine clothes pointing at a wall, demanding gold.
    step_by_step: 'Step 1: The gift: a brush that makes pictures real. Step 2: Gopi helps the villagers. Step 3: The zamindar''s greed and demands. Step 4: Gopi''s clever escape. Step 5: The lesson: use talents for good.'
    real_world: Doctors, engineers and artists can use their skills to earn money for themselves alone or to help others too; the story asks which matters more.
  picture:
    kind: compare
    columns:
    - title: Gopi
      points:
      - Kind and creative
      - Paints what villagers need
      - Brave and clever
      - Uses her gift for good
    - title: The zamindar
      points:
      - Greedy and selfish
      - Wants riches for himself
      - Tries to force Gopi
      - His greed fails
    alt: Gopi, kind and brave, uses her magic brush for the villagers; the greedy zamindar wants riches for himself and fails.
  activity:
    type: sort
    prompt: 'The Magic Brush of Dreams: good or greedy use of the brush?'
    bins:
    - Helping others
    - Greed
    items:
    - label: Painting what the villagers need
      bin: Helping others
      clue: For the poor.
      why: Gopi uses the brush to help.
    - label: Painting riches for the zamindar
      bin: Greed
      clue: For one rich man.
      why: The zamindar wants riches.
    - label: A tall fortress for himself
      bin: Greed
      clue: Grand things.
      why: The fortress is for his power.
    - label: Escaping to keep the village safe
      bin: Helping others
      clue: Courage.
      why: Gopi protects the villagers.
  lesson:
    - teach: 'Gopi is a kind, creative girl with a magic paintbrush: whatever she paints becomes real. She uses it to paint things the poor villagers need.'
      check:
        prompt: How does Gopi first use her brush?
        options:
        - To help poor villagers
        - To get rich
        - To scare people
        answer: To help poor villagers
        why: She paints what the villagers need.
    - teach: A greedy zamindar (landlord) wants the brush's power. He orders Gopi to paint riches and grand things, like a tall fortress, for him alone.
      check:
        prompt: What does 'greedy' mean?
        options:
        - Wanting more than you need, for yourself
        - Sharing with others
        - Being sleepy
        answer: Wanting more than you need, for yourself
        why: The zamindar wanted riches only for himself.
    - teach: Gopi refuses to serve greed. She cleverly uses her painting to escape and defeat his plans, and the villagers celebrate. The story teaches that a gift is a responsibility, and courage and cleverness can beat power.
      picture:
        kind: compare
        columns:
        - title: Gopi
          points:
          - Kind
          - Brave
          - Clever
          - Helps others
        - title: Zamindar
          points:
          - Greedy
          - Bullying
          - Wants power
          - Helps only himself
        alt: Gopi is kind, brave and clever and helps others; the zamindar is greedy and bullying and helps only himself.
      check:
        prompt: What does the story say about special gifts?
        options:
        - They should be used to help others
        - They should be hidden
        - They should be sold
        answer: They should be used to help others
        why: Gopi used her gift for the village, not for greed.
  items:
  - prompt: What is special about Gopi's brush?
    options:
    - Whatever she paints becomes real
    - It never runs out of paint
    - It paints by itself
    - It is made of gold
    answer: Whatever she paints becomes real
    difficulty: 1
    hints:
    - It's magic.
    - Pictures come alive.
    solution: Anything Gopi paints with it becomes real.
    mistakes: {"It never runs out of paint": "e8_magic_brush"}
  - prompt: Whom does Gopi help with her brush?
    options:
    - The poor villagers
    - The zamindar
    - Only her family
    - Soldiers
    answer: The poor villagers
    difficulty: 1
    hints:
    - People in need.
    - Her neighbours.
    solution: She paints what the poor villagers need.
    mistakes: {"The zamindar": "e8_gopi_helps"}
  - prompt: What is a zamindar?
    options:
    - A landlord
    - A painter
    - A soldier
    - A teacher
    answer: A landlord
    difficulty: 1
    hints:
    - He owned land.
    - Powerful in the village.
    solution: A zamindar was a landowner with power over villagers.
    mistakes: {"A painter": "e8_zamindar"}
  - prompt: Why does the zamindar want the brush?
    options:
    - To get riches and power for himself
    - To help the villagers
    - To learn painting
    - To give it to the king
    answer: To get riches and power for himself
    difficulty: 2
    hints:
    - He is greedy.
    - '''Paint my fortress tall!'''
    solution: He wants to use the magic for his own wealth.
    mistakes: {"To help the villagers": "e8_greed"}
  - prompt: Which quality helps Gopi defeat the zamindar?
    options:
    - Courage and cleverness
    - Physical strength
    - Money
    - An army
    answer: Courage and cleverness
    difficulty: 2
    hints:
    - She is only a girl with a brush.
    - She outwits him.
    solution: Gopi uses courage and intelligence, not force.
    mistakes: {"An army": "e8_gopi_quality"}
  - prompt: What is the moral of the story?
    options:
    - Use your talents to help others, not for greed
    - Never paint pictures
    - Zamindars are always rich
    - Magic is dangerous
    answer: Use your talents to help others, not for greed
    difficulty: 2
    hints:
    - How did Gopi use her gift?
    - What happened to greed?
    solution: A gift is a responsibility to use for good.
    mistakes:
      Magic is dangerous: eng8_whole_story
  - prompt: Who wanted to use Gopi's brush for himself?
    options:
    - The zamindar
    - The villagers
    - Gopi's teacher
    answer: The zamindar
    difficulty: 1
    hints:
    - He was the greedy one.
    - He was a landlord.
    solution: The greedy landlord wanted the brush's power.
    mistakes:
      The villagers: e8m_villain
      Gopi's teacher: e8m_villain
  - prompt: Which pair are opposites in the story?
    options:
    - Kindness and greed
    - Kindness and courage
    - Clever and wise
    answer: Kindness and greed
    difficulty: 2
    hints:
    - Think of Gopi and the zamindar.
    - One gives, one grabs.
    solution: Gopi's kindness stands against the zamindar's greed.
    mistakes:
      Kindness and courage: e8m_char
      Clever and wise: e8m_char
  - prompt: Why did Gopi refuse the zamindar?
    options:
    - She would not use her gift to serve greed
    - She was too tired
    - Her brush was broken
    answer: She would not use her gift to serve greed
    difficulty: 2
    hints:
    - What did she believe her brush was for?
    - She helped the poor.
    solution: She saw her gift as something to help people, not to make the greedy richer.
    mistakes:
      She was too tired: e8_greed
      Her brush was broken: e8_greed
  - prompt: Which word best describes Gopi when she faces the zamindar?
    options:
    - Brave
    - Greedy
    - Lazy
    answer: Brave
    difficulty: 1
    hints:
    - He was powerful and she was a girl from the village.
    - She still said no.
    solution: Standing up to a powerful man shows bravery.
    mistakes:
      Greedy: e8m_char
      Lazy: e8m_char
  - prompt: What kind of story is 'The Magic Brush of Dreams'?
    options:
    - A fantasy folk tale with a moral
    - A true news report
    - A science article
    answer: A fantasy folk tale with a moral
    difficulty: 2
    hints:
    - Can a painting really become real?
    - It ends with a lesson.
    solution: It has magic and teaches a moral, like a folk tale.
    mistakes:
      A true news report: eng8_whole_story
      A science article: eng8_whole_story
  - prompt: 'Fill in the opposite: The zamindar was greedy, but Gopi was ___.'
    options:
    - generous
    - selfish
    - proud
    answer: generous
    difficulty: 2
    hints:
    - The opposite of greedy is someone who gives.
    - Selfish means the same as greedy.
    solution: Generous means happy to give; it is the opposite of greedy.
    mistakes:
      selfish: e8m_vocab
      proud: e8m_vocab
  - prompt: What did the villagers do at the end?
    options:
    - Celebrated
    - Ran away
    - Joined the zamindar
    answer: Celebrated
    difficulty: 1
    hints:
    - They were safe again.
    - How would you feel?
    solution: With the zamindar defeated, the villagers celebrated.
    mistakes:
      Ran away: eng8_read_again
      Joined the zamindar: eng8_read_again
  - prompt: '''A gift is a responsibility.'' What does this mean?'
    options:
    - Having a talent means you should use it well
    - Gifts are heavy
    - You must return gifts
    answer: Having a talent means you should use it well
    difficulty: 3
    hints:
    - Here 'gift' means talent.
    - Gopi used hers carefully.
    solution: A special talent brings the duty to use it rightly.
    mistakes:
      Gifts are heavy: e8m_vocab
      You must return gifts: e8m_vocab
  - prompt: If you had Gopi's brush, which use would match the story's message?
    options:
    - Painting a well for a village with no water
    - Painting gold for yourself only
    - Painting a monster to scare friends
    answer: Painting a well for a village with no water
    difficulty: 1
    hints:
    - Gopi helped people in need.
    - Which choice helps others?
    solution: Using the gift to meet others' needs matches Gopi's way.
    mistakes:
      Painting gold for yourself only: e8_greed
      Painting a monster to scare friends: e8_greed
- code: cbse8e.u3.wonders
  title: Spectacular Wonders
  after:
  - cbse8e.u3.brush
  notes: |
    Natural wonders of India: Valley of Flowers (Chamoli, Uttarakhand): hundreds of kinds of flowers, a UNESCO
    World Heritage Site. Living root bridges (Meghalaya): grown by the Khasi people by guiding the roots of
    rubber fig trees across streams; no cement; last for hundreds of years. Lonar Crater Lake (Maharashtra):
    formed when a meteorite hit, in basalt rock; the lake water is salty. Magnetic Hill (near Leh, Ladakh):
    vehicles seem to roll uphill, an optical illusion caused by the slope of the land. Glowing waters of
    Kerala (Kumbalangi backwaters): bioluminescence, light made by tiny plankton. The Sundarbans (West Bengal):
    India's largest mangrove forest, in the delta of the Ganga, Brahmaputra and Meghna, home of the Bengal
    tiger; mangroves protect coasts from erosion. Chandipur Beach (Odisha): the 'disappearing sea'; at low
    tide the water goes out several kilometres, then returns at high tide.
  explanations:
    text: 'India has amazing natural wonders: a valley full of flowers in Uttarakhand, bridges grown from living roots in Meghalaya, a lake in a meteorite crater in Maharashtra, a hill in Ladakh where cars seem to roll uphill, glowing water in Kerala, the mangrove forests of the Sundarbans, and a beach in Odisha where the sea disappears at low tide.'
    visual: 'Picture a map of India with seven pins: flowers in the north, a crater in the west, roots in the north-east, glowing water in Kerala, mangroves near the Bay of Bengal, a hill in Ladakh and an empty beach in Odisha.'
    step_by_step: 'Step 1: Name the wonder. Step 2: Find its state. Step 3: Say what is special about it. Step 4: Give the science behind it (meteorite, bioluminescence, tides, illusion).'
    real_world: 'The glowing waves in Kerala''s backwaters are made by the same kind of living light as fireflies: bioluminescence.'
  picture:
    kind: compare
    columns:
    - title: Made by nature
      points:
      - 'Lonar: meteorite crater, salty lake'
      - 'Kerala: plankton make light'
      - 'Chandipur: tides pull the sea out'
    - title: People working with nature
      points:
