        - With steel and cement
        - By cutting rocks
        answer: By guiding tree roots across streams
        why: The Khasi people train living roots over many years.
    - teach: 'Lonar Lake in Maharashtra formed when a meteorite hit; its water is salty. At Magnetic Hill near Leh, vehicles seem to roll uphill: an optical illusion made by the slope. In Kerala''s Kumbalangi backwaters, tiny plankton give off light: bioluminescence.'
