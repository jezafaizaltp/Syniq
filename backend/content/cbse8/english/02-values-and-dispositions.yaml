- code: cbse8e.u2.mother
  title: Somebody's Mother (poem)
  after:
  - cbse8e.u2.valour
  notes: |
    A poem (by Mary Dow Brine). On a busy winter street, wet and slippery with fresh snow, a poor, ragged,
    grey-haired old woman waits at the crossing, afraid of the carriages and horses. Crowds pass, and a
    group of schoolboys rush by 'like a flock of sheep' without noticing her. One boy stops and gently helps
    her across, then rejoins his friends, thinking that she is 'somebody's mother' and that he would want
    someone to help his own mother if she were old and poor one day. That night the old woman prays: "God, be
    kind to the noble boy, who is somebody's son, and pride and joy." Themes: kindness, empathy, respect for
    the old. Rhyming couplets. Simile: like a flock of sheep.
  explanations:
    text: On a snowy, busy street a poor old woman is afraid to cross. Everyone hurries past, until one schoolboy stops and helps her, thinking she is 'somebody's mother'. That night she prays for him. The poem shows how much a small kindness matters.
    visual: Picture a grey winter street, carriages splashing through slush, a bent old woman at the kerb, a crowd of boys running past, and one boy turning back to take her arm.
    step_by_step: 'Step 1: The setting: a slippery winter street. Step 2: The old woman''s fear. Step 3: Everyone passes by. Step 4: One boy helps her. Step 5: Her prayer for him.'
    real_world: Helping an older person carry a bag or cross a road takes a minute, but it can make their whole day feel safer.
  picture:
    kind: compare
    columns:
    - title: The crowd and most boys
      points:
      - Rush past
      - Don't notice her
      - Like a flock of sheep
    - title: The kind boy
      points:
      - Stops and takes her arm
      - Helps her cross safely
      - Thinks of his own mother
    alt: The crowd and most boys rush past like a flock of sheep; the kind boy stops, helps the old woman cross and thinks of his own mother.
  activity:
    type: sort
    prompt: 'Somebody''s Mother: the old woman, the crowd, or the boy?'
    bins:
    - The old woman
    - The crowd
    - The kind boy
    items:
    - label: Afraid of the carriages
      bin: The old woman
      clue: Waiting at the crossing.
      why: She is scared to cross the busy street.
    - label: Rush by like a flock of sheep
      bin: The crowd
      clue: A simile for the schoolboys.
      why: The rushing boys are compared to sheep.
    - label: Helps her across gently
      bin: The kind boy
      clue: One stops.
      why: The kind boy helps her.
    - label: Thinks of his own mother
      bin: The kind boy
      clue: '''Somebody''s mother''.'
      why: He imagines his own mother old and poor.
    - label: Prays for the noble boy
      bin: The old woman
      clue: That night.
      why: She prays for the boy who helped.
  lesson:
    - teach: '''Somebody''s Mother'' by Mary Dow Brine is set on a busy winter street, wet and slippery with snow. A poor, grey-haired old woman waits at the crossing, afraid of the carriages and horses.'
      check:
        prompt: Why was the street dangerous for her?
        options:
        - It was busy and slippery with snow
        - It was dark and empty
        - It was flooded
        answer: It was busy and slippery with snow
        why: Traffic and ice made crossing hard for an old woman.
    - teach: 'A group of schoolboys rush past ''like a flock of sheep'' without noticing her. This is a simile: a comparison using ''like'' or ''as''. One boy stops and gently helps her across.'
      check:
        prompt: Which is a simile?
        options:
        - Like a flock of sheep
        - The old woman
        - Somebody's son
        answer: Like a flock of sheep
        why: It compares the boys to sheep using 'like'.
    - teach: 'The boy thinks she is ''somebody''s mother'', and hopes someone would help his own mother one day. That night she prays for him. The poem teaches empathy: imagining how others feel and acting kindly.'
      picture:
        kind: flow
        steps:
        - Old woman waits
        - Boys rush past
        - One boy helps
        - She prays for him
        alt: The old woman waits, the boys rush past, one boy helps her across, and she prays for him that night.
      check:
        prompt: What is empathy?
        options:
        - Imagining how someone else feels
        - Running fast
        - Being proud
        answer: Imagining how someone else feels
        why: The boy imagined his own mother in her place.
  items:
  - prompt: What season is described in the poem?
    options:
    - Winter
    - Summer
    - Spring
    - Monsoon
    answer: Winter
    difficulty: 1
    hints:
    - Fresh snow.
    - The street is slippery.
    solution: It is a winter day with fresh snow on the street.
    mistakes: {"Summer": "e8_winter"}
  - prompt: Why was the old woman afraid to cross?
    options:
    - The street was busy and slippery
    - She had lost her way
    - A dog was chasing her
    - It was dark
    answer: The street was busy and slippery
    difficulty: 1
    hints:
    - Carriages and horses.
    - Wet snow.
    solution: She feared the busy traffic on the slippery, snowy street.
    mistakes: {"A dog was chasing her": "e8_slippery"}
  - prompt: 'The boys rushing past are compared to:'
    options:
    - A flock of sheep
    - A pack of wolves
    - Busy bees
    - Falling leaves
    answer: A flock of sheep
    difficulty: 1
    hints:
    - A simile.
    - They move together without thinking.
    solution: They rush by 'like a flock of sheep'.
    mistakes:
      Busy bees: eng8_read_again
  - prompt: Why did the boy help the old woman?
    options:
    - He thought she was somebody's mother, like his own
    - She paid him
    - His teacher told him to
    - She was his grandmother
    answer: He thought she was somebody's mother, like his own
    difficulty: 2
    hints:
    - Read the title.
    - He imagined his own mother old.
    solution: He hoped someone would help his own mother in the same way one day.
    mistakes: {"She paid him": "e8_somebodys_mother"}
  - prompt: What did the old woman do that night?
    options:
    - Prayed for the boy
    - Wrote him a letter
    - Gave him a gift
    - Told the police
    answer: Prayed for the boy
    difficulty: 1
    hints:
    - She thanked God.
    - '''Be kind to the noble boy''.'
    solution: She prayed that God would be kind to the boy, 'somebody's son'.
    mistakes: {"Gave him a gift": "e8_prayed"}
  - prompt: What is the main message of the poem?
    options:
    - Small acts of kindness matter and everyone deserves respect
    - Winter is dangerous
    - Schoolboys are rude
    - Old people should stay home
    answer: Small acts of kindness matter and everyone deserves respect
    difficulty: 2
    hints:
    - Why repeat 'somebody's mother'?
    - Every person is someone's loved one.
    solution: 'The poem shows empathy: every stranger is someone''s loved one.'
    mistakes:
      Schoolboys are rude: eng8_whole_story
  - prompt: Who wrote 'Somebody's Mother'?
    options:
    - Mary Dow Brine
    - Verghese Kurien
    - Donald J. Sobol
    answer: Mary Dow Brine
    difficulty: 2
    hints:
    - It is a poet, not the writer of a letter or a detective story.
    - Kurien wrote a letter; Sobol wrote mysteries.
    solution: The poem is by Mary Dow Brine.
    mistakes:
      Verghese Kurien: eng8_read_again
      Donald J. Sobol: eng8_read_again
  - prompt: How did the other boys behave?
    options:
    - They rushed past without noticing her
    - They all helped her
    - They laughed and pushed her
    answer: They rushed past without noticing her
    difficulty: 1
    hints:
    - They were compared to sheep.
    - Sheep move in a hurry, all together.
    solution: They hurried past like a flock of sheep.
    mistakes:
      They all helped her: e8v_simile
      They laughed and pushed her: e8v_simile
  - prompt: How did the boy help the old woman?
    options:
    - He gently guided her across the street
    - He gave her money
    - He called a carriage
    answer: He gently guided her across the street
    difficulty: 1
    hints:
    - She was afraid to cross.
    - He stopped and took her arm.
    solution: He led her safely across the busy street.
    mistakes:
      He gave her money: eng8_read_again
      He called a carriage: eng8_read_again
  - prompt: Which word best describes the boy who helped?
    options:
    - Kind
    - Rude
    - Lazy
    answer: Kind
    difficulty: 1
    hints:
    - What did he do that the others didn't?
    - He thought of her feelings.
    solution: He showed kindness and empathy.
    mistakes:
      Rude: e8v_char
      Lazy: e8v_char
  - prompt: In the old woman's prayer, the boy is called 'somebody's son, and pride and joy'. What does 'pride and joy' mean?
    options:
    - Someone a family is very proud of and loves
    - A proud and rude person
    - A toy
    answer: Someone a family is very proud of and loves
    difficulty: 2
    hints:
    - It is a phrase used for a dear child.
    - She is wishing him well.
    solution: '''Pride and joy'' means someone loved and admired, like a precious child.'
    mistakes:
      A proud and rude person: e8v_vocab
      A toy: e8v_vocab
  - prompt: Why does the poet call the woman 'somebody's mother'?
    options:
    - To remind us every old person is loved by someone
    - Because nobody knew her name
    - Because she was the boy's mother
    answer: To remind us every old person is loved by someone
    difficulty: 3
    hints:
    - Think of the boy's reason for helping.
    - She was not his own mother.
    solution: The title asks us to see every stranger as someone's dear one.
    mistakes:
      Because nobody knew her name: e8_somebodys_mother
      Because she was the boy's mother: e8_somebodys_mother
  - prompt: Which pair rhymes, as in the poem's couplets?
    options:
    - street / feet
    - street / snow
    - old / woman
    answer: street / feet
    difficulty: 1
