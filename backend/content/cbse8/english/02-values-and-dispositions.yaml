  - prompt: According to Kurien, what does failure really mean?
    options:
    - Not trying your best or not contributing
    - Not becoming rich
    - Losing a single exam
    - Not being famous
    answer: Not trying your best or not contributing
    difficulty: 2
    hints:
    - It's about effort.
    - Not about money.
    solution: He says failure is not doing your best, not simply failing to succeed.
  - prompt: Which value does Kurien put first?
    options:
    - 'Integrity: honesty with yourself and others'
    - Winning at any cost
    - Earning a lot of money
    - Becoming famous
    answer: 'Integrity: honesty with yourself and others'
    difficulty: 2
    hints:
    - He warns against dishonesty.
    - Be true to yourself.
    solution: He tells Siddharth integrity matters above all.
