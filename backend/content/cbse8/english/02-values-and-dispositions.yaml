- code: cbse8e.u2.kurien
  title: 'Verghese Kurien: I Too Had a Dream'
  after:
  - cbse8e.u2.mother
  notes: |
    A letter written in 2005 by Dr Verghese Kurien to his grandson Siddharth, looking back on his life.
    Kurien could have chosen a comfortable career abroad or elsewhere, but he chose to stay in Anand,
    Gujarat, and work with dairy farmers, guided by the farmers' leader Tribhuvandas Patel. Their farmers'
    cooperative (behind the Amul brand) helped make India one of the world's biggest milk producers: the
    White Revolution (Operation Flood). He tells Siddharth that life is a privilege not to be wasted; use your
    talents for the common good; integrity (honesty) matters most; failure means not doing your best, not
    just not succeeding; happiness comes from gratitude, not wealth. His wife supported him through hard
    years in Anand. He received the Padma Vibhushan (1999). Message: a life of service is the true reward.
  explanations:
    text: In a letter to his grandson Siddharth, Verghese Kurien explains why he turned down an easier life to work with dairy farmers in Anand, Gujarat. Their cooperative helped make India a leading milk producer. He tells Siddharth to be honest, to use his talents for others, and that real failure is not trying your best.
    visual: Picture an old man writing a letter at his desk, and behind him a village where farmers line up with milk cans at a cooperative collection centre.
    step_by_step: 'Step 1: What the text is: a letter to his grandson (2005). Step 2: His choice: stay in Anand and serve farmers. Step 3: The result: the cooperative and the White Revolution. Step 4: His values: integrity, service, gratitude, doing your best.'
    real_world: The milk packet in many Indian homes comes from farmers' cooperatives that grew from the work Kurien describes.
  picture:
    kind: flow
    steps:
    - Turns down easier careers
    - Chooses to work with farmers in Anand
    - Builds a farmers' cooperative with Tribhuvandas Patel
    - India becomes a leading milk producer
    - Writes to his grandson about honesty and service
    alt: 'Kurien''s choices in five steps: turning down easier careers, working with farmers in Anand, building the cooperative, India''s milk success, and his letter about honesty and service.'
