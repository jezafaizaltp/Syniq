concepts:
- code: cbse8e.u2.valour
  title: 'A Tale of Valour: Major Somnath Sharma and the Battle of Badgam'
  notes: |
    Major Somnath Sharma was born on 31 January 1923 in Kangra (now Himachal Pradesh); his father was an army
    officer, and stories from the Mahabharata told by his grandfather inspired him. He was commissioned in
    1942 into the 19th Hyderabad Regiment (later the Kumaon Regiment) and served in Burma in the Second World
    War. In October 1947 raiders backed by Pakistan invaded Kashmir (Operation Gulmarg) aiming to capture
    Srinagar and its airfield. Indian troops were flown to Srinagar. Major Sharma's D Company went though his
    left arm was in plaster. On 3 November 1947 at Badgam his company of about 90 men was attacked by around
    500 raiders. He moved between posts, helped load guns and kept his men fighting. His last message: "I
    shall not withdraw an inch but will fight to the last man and the last round." He was killed by a mortar
    shell, but his men held on until reinforcements came, saving the airfield. He was the first person to
    receive the Param Vir Chakra, India's highest award for bravery in war (given after his death).
  explanations:
    text: In November 1947 Major Somnath Sharma's small company, with his own arm in plaster, held off a much larger force at Badgam near Srinagar's airfield. He promised not to withdraw an inch, and died in the fight, but his men held on until help came. He was the first to receive the Param Vir Chakra.
    visual: Picture a small group of soldiers on a hillside near an airfield, outnumbered more than five to one, with their major, one arm in plaster, moving from trench to trench encouraging them.
    step_by_step: 'Step 1: Who he was: born 1923 in Kangra, army family. Step 2: The threat: raiders invading Kashmir in 1947. Step 3: The battle: about 90 men against about 500 at Badgam. Step 4: His courage and last message. Step 5: His legacy: the first Param Vir Chakra.'
    real_world: The National War Memorial in New Delhi honours soldiers like Major Sharma whose courage protected the country.
  picture:
    kind: flow
    steps:
    - Born 1923 in Kangra; inspired by Mahabharata stories
    - Commissioned in 1942; served in Burma
    - 'October 1947: raiders invade Kashmir'
    - '3 November 1947: about 90 men hold Badgam against about 500'
    - First Param Vir Chakra, given after his death
    alt: 'Major Somnath Sharma''s life in five steps: born in Kangra in 1923, commissioned in 1942, the 1947 invasion of Kashmir, the battle of Badgam, and the first Param Vir Chakra.'
  activity:
    type: order
    prompt: 'Major Somnath Sharma: put his story in order.'
    steps:
    - Born in Kangra, 1923
    - Commissioned into the Hyderabad Regiment
    - Serves in Burma in the Second World War
    - Flown to Srinagar with his arm in plaster
    - Holds Badgam against about 500 raiders
    - First Param Vir Chakra, after his death
    reasons:
      Commissioned into the Hyderabad Regiment: He joins the army in 1942.
      Serves in Burma in the Second World War: His first war.
      Flown to Srinagar with his arm in plaster: Raiders invade Kashmir in 1947.
      Holds Badgam against about 500 raiders: His company is attacked on 3 November.
      First Param Vir Chakra, after his death: His stand saved the airfield.
  lesson:
    - teach: Major Somnath Sharma was born in 1923 in Kangra. Inspired by his family and Mahabharata stories, he joined the army in 1942 and served in Burma in the Second World War.
      check:
        prompt: What inspired Somnath Sharma as a boy?
        options:
        - Stories from the Mahabharata told by his grandfather
        - Films about pilots
        - A visit to Delhi
        answer: Stories from the Mahabharata told by his grandfather
        why: His grandfather's stories of courage stayed with him.
    - teach: In October 1947 raiders backed by Pakistan invaded Kashmir to capture Srinagar and its airfield. Indian troops were flown in. Major Sharma went with his company even though his left arm was in plaster.
      picture:
        kind: flow
        steps:
        - Oct 1947 raiders invade
        - Troops flown to Srinagar
        - '3 Nov: Battle of Badgam'
        - Airfield saved
        alt: Raiders invade in October 1947, troops fly to Srinagar, the Battle of Badgam is fought on 3 November, and the airfield is saved.
      check:
        prompt: Why was the Srinagar airfield so important?
        options:
        - Indian troops and supplies could land there
        - It was a tourist spot
        - It had a big market
        answer: Indian troops and supplies could land there
        why: Losing it would cut off help to Kashmir.
    - teach: 'At Badgam about 90 men faced about 500 raiders. He moved between posts and kept his men fighting. His last message: ''I shall not withdraw an inch but will fight to the last man and the last round.'' He was killed, but his men held on until help came. He was the first to receive the Param Vir Chakra.'
      picture:
        kind: bars
        bars:
        - label: Indian soldiers
          value: 90
        - label: Raiders
          value: 500
        unit: people (about)
        alt: About 90 Indian soldiers faced about 500 raiders.
      check:
        prompt: What does 'withdraw' mean in his last message?
        options:
        - Move back
        - Attack
        - Rest
        answer: Move back
        why: He refused to move back even an inch.
  items:
  - prompt: Which award was Major Somnath Sharma the first to receive?
    options:
    - Param Vir Chakra
    - Ashoka Chakra
    - Bharat Ratna
    - Padma Shri
    answer: Param Vir Chakra
    difficulty: 1
    hints:
    - India's highest award for bravery in war.
    - Given after his death.
    solution: He was the first recipient of the Param Vir Chakra.
    mistakes:
      Bharat Ratna: eng8_read_again
  - prompt: In which year was the Battle of Badgam fought?
    answer: '1947'
    check: '1947'
    difficulty: 1
    hints:
    - Just after Independence.
    - October–November.
    solution: The battle was on 3 November 1947.
    mistakes: {"1948": "e8_badgam"}
  - prompt: Which city's airfield were the raiders trying to capture?
    options:
    - Srinagar
    - Jammu
    - Leh
    - Delhi
    answer: Srinagar
    difficulty: 1
    hints:
    - In the Kashmir valley.
    - Badgam is close to it.
    solution: The raiders wanted to capture Srinagar and its airfield.
    mistakes: {"Jammu": "e8_srinagar"}
  - prompt: About 90 Indian soldiers faced about 500 raiders. About how many more raiders were there than soldiers?
    answer: '410'
    check: 500 - 90
    difficulty: 2
    hints:
    - Subtract.
    - 500 − 90.
    solution: 500 − 90 = 410 more raiders.
    mistakes: {"590": "e8_more_raiders"}
  - prompt: What was unusual about Major Sharma going into battle?
    options:
    - His left arm was in plaster
    - He had no weapon
    - He was only 15
    - He could not walk
    answer: His left arm was in plaster
    difficulty: 2
    hints:
    - He was injured already.
    - He could have stayed behind.
    solution: Though his left arm was fractured and in plaster, he insisted on leading his men.
    mistakes: {"He was only 15": "e8_plaster"}
  - prompt: What did his last message show?
    options:
    - Determination to hold his ground whatever the cost
    - That he wanted to retreat
    - That he was asking for food
    - That the battle was won
    answer: Determination to hold his ground whatever the cost
    difficulty: 2
    hints:
    - '''Not withdraw an inch''.'
    - '''To the last man and the last round''.'
    solution: He promised not to give up any ground and to fight to the end.
    mistakes: {"That he wanted to retreat": "e8_last_message"}
  - prompt: Where was Major Somnath Sharma born?
    options:
    - Kangra
    - Srinagar
    - Badgam
    answer: Kangra
    difficulty: 2
    hints:
    - It is now in Himachal Pradesh.
    - Srinagar and Badgam are in Kashmir, where he fought.
    solution: He was born in Kangra, now in Himachal Pradesh, in 1923.
    mistakes:
      Srinagar: eng8_read_again
      Badgam: eng8_read_again
  - prompt: Why did his men keep fighting after he was killed?
    options:
    - His courage and last words inspired them
    - They were ordered to leave
    - The raiders had gone
    answer: His courage and last words inspired them
    difficulty: 2
    hints:
    - Think about what a leader's example does.
    - Remember his last message.
    solution: His example of not giving an inch inspired them to hold on.
    mistakes:
      They were ordered to leave: e8_last_message
      The raiders had gone: e8_last_message
  - prompt: Which word best describes Major Sharma?
    options:
    - Courageous
    - Careless
    - Selfish
    answer: Courageous
    difficulty: 1
    hints:
    - He fought with a broken arm.
    - He refused to retreat.
    solution: Fighting injured against huge odds shows courage.
    mistakes:
      Careless: e8v_char
      Selfish: e8v_char
  - prompt: In which year was Somnath Sharma commissioned into the army?
    answer: '1942'
    check: '1942'
    difficulty: 2
    hints:
    - It was during the Second World War.
    - He served in Burma soon after.
    solution: He was commissioned in 1942.
    mistakes:
      '1947': e8v_order
  - prompt: He was born in 1923 and died at Badgam in 1947. How old was he, about?
    answer: '24'
    check: 1947-1923
    difficulty: 1
    hints:
    - Find the gap between the two years.
    - Take 1923 from 1947.
    solution: 1947 − 1923 = 24 years old.
    mistakes:
      '34': e8v_gap
  - prompt: What does 'reinforcements' mean in 'his men held on until reinforcements came'?
    options:
    - Extra soldiers sent to help
    - Enemy soldiers
    - Food packets
    answer: Extra soldiers sent to help
    difficulty: 2
    hints:
    - '''Re-inforce'' means make strong again.'
    - They arrived to support the men.
    solution: Reinforcements are extra troops sent to strengthen a force.
    mistakes:
