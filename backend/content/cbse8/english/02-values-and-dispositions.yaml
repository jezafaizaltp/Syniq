concepts:
- code: cbse8e.u2.valour
  title: 'A Tale of Valour: Major Somnath Sharma and the Battle of Badgam'
  notes: |
    Major Somnath Sharma was born on 31 January 1923 in Kangra (now Himachal Pradesh); his father was an army
    officer, and stories from the Mahabharata told by his grandfather inspired him. He was commissioned in
    1942 into the 19th Hyderabad Regiment (later the Kumaon Regiment) and served in Burma in the Second World
    War. In October 1947 raiders backed by Pakistan invaded Kashmir (Operation Gulmarg) aiming to capture
    Srinagar and its airfield. Indian troops were flown to Srinagar. Major Sharma's D Company went though his
    left arm was in plaster. On 3 November 1947 at Badgam his company of about 90 men was attacked by around
    500 raiders. He moved between posts, helped load guns and kept his men fighting. His last message: "I
    shall not withdraw an inch but will fight to the last man and the last round." He was killed by a mortar
    shell, but his men held on until reinforcements came, saving the airfield. He was the first person to
    receive the Param Vir Chakra, India's highest award for bravery in war (given after his death).
  explanations:
    text: In November 1947 Major Somnath Sharma's small company, with his own arm in plaster, held off a much larger force at Badgam near Srinagar's airfield. He promised not to withdraw an inch, and died in the fight, but his men held on until help came. He was the first to receive the Param Vir Chakra.
    visual: Picture a small group of soldiers on a hillside near an airfield, outnumbered more than five to one, with their major, one arm in plaster, moving from trench to trench encouraging them.
    step_by_step: 'Step 1: Who he was: born 1923 in Kangra, army family. Step 2: The threat: raiders invading Kashmir in 1947. Step 3: The battle: about 90 men against about 500 at Badgam. Step 4: His courage and last message. Step 5: His legacy: the first Param Vir Chakra.'
    real_world: The National War Memorial in New Delhi honours soldiers like Major Sharma whose courage protected the country.
  picture:
    kind: flow
    steps:
    - Born 1923 in Kangra; inspired by Mahabharata stories
    - Commissioned in 1942; served in Burma
    - 'October 1947: raiders invade Kashmir'
    - '3 November 1947: about 90 men hold Badgam against about 500'
    - First Param Vir Chakra, given after his death
    alt: 'Major Somnath Sharma''s life in five steps: born in Kangra in 1923, commissioned in 1942, the 1947 invasion of Kashmir, the battle of Badgam, and the first Param Vir Chakra.'
  activity:
    type: order
    prompt: 'Major Somnath Sharma: put his story in order.'
    steps:
    - Born in Kangra, 1923
    - Commissioned into the Hyderabad Regiment
    - Serves in Burma in the Second World War
    - Flown to Srinagar with his arm in plaster
    - Holds Badgam against about 500 raiders
    - First Param Vir Chakra, after his death
    reasons:
      Commissioned into the Hyderabad Regiment: He joins the army in 1942.
      Serves in Burma in the Second World War: His first war.
      Flown to Srinagar with his arm in plaster: Raiders invade Kashmir in 1947.
      Holds Badgam against about 500 raiders: His company is attacked on 3 November.
      First Param Vir Chakra, after his death: His stand saved the airfield.
  items:
  - prompt: Which award was Major Somnath Sharma the first to receive?
    options:
    - Param Vir Chakra
    - Ashoka Chakra
    - Bharat Ratna
    - Padma Shri
    answer: Param Vir Chakra
    difficulty: 1
    hints:
    - India's highest award for bravery in war.
    - Given after his death.
    solution: He was the first recipient of the Param Vir Chakra.
    mistakes:
      Bharat Ratna: eng8_read_again
  - prompt: In which year was the Battle of Badgam fought?
    answer: '1947'
    check: '1947'
    difficulty: 1
    hints:
    - Just after Independence.
    - October–November.
    solution: The battle was on 3 November 1947.
  - prompt: Which city's airfield were the raiders trying to capture?
    options:
    - Srinagar
    - Jammu
    - Leh
    - Delhi
    answer: Srinagar
    difficulty: 1
    hints:
    - In the Kashmir valley.
    - Badgam is close to it.
    solution: The raiders wanted to capture Srinagar and its airfield.
  - prompt: About 90 Indian soldiers faced about 500 raiders. About how many more raiders were there than soldiers?
    answer: '410'
    check: 500 - 90
    difficulty: 2
    hints:
    - Subtract.
    - 500 − 90.
    solution: 500 − 90 = 410 more raiders.
  - prompt: What was unusual about Major Sharma going into battle?
    options:
    - His left arm was in plaster
    - He had no weapon
    - He was only 15
    - He could not walk
    answer: His left arm was in plaster
    difficulty: 2
    hints:
    - He was injured already.
    - He could have stayed behind.
    solution: Though his left arm was fractured and in plaster, he insisted on leading his men.
  - prompt: What did his last message show?
    options:
    - Determination to hold his ground whatever the cost
    - That he wanted to retreat
    - That he was asking for food
    - That the battle was won
    answer: Determination to hold his ground whatever the cost
    difficulty: 2
    hints:
    - '''Not withdraw an inch''.'
    - '''To the last man and the last round''.'
    solution: He promised not to give up any ground and to fight to the end.
- code: cbse8e.u2.mother
  title: Somebody's Mother (poem)
  after:
  - cbse8e.u2.valour
  notes: |
    A poem (by Mary Dow Brine). On a busy winter street, wet and slippery with fresh snow, a poor, ragged,
    grey-haired old woman waits at the crossing, afraid of the carriages and horses. Crowds pass, and a
    group of schoolboys rush by 'like a flock of sheep' without noticing her. One boy stops and gently helps
    her across, then rejoins his friends, thinking that she is 'somebody's mother' and that he would want
    someone to help his own mother if she were old and poor one day. That night the old woman prays: "God, be
    kind to the noble boy, who is somebody's son, and pride and joy." Themes: kindness, empathy, respect for
    the old. Rhyming couplets. Simile: like a flock of sheep.
  explanations:
    text: On a snowy, busy street a poor old woman is afraid to cross. Everyone hurries past, until one schoolboy stops and helps her, thinking she is 'somebody's mother'. That night she prays for him. The poem shows how much a small kindness matters.
    visual: Picture a grey winter street, carriages splashing through slush, a bent old woman at the kerb, a crowd of boys running past, and one boy turning back to take her arm.
    step_by_step: 'Step 1: The setting: a slippery winter street. Step 2: The old woman''s fear. Step 3: Everyone passes by. Step 4: One boy helps her. Step 5: Her prayer for him.'
    real_world: Helping an older person carry a bag or cross a road takes a minute, but it can make their whole day feel safer.
  picture:
    kind: compare
    columns:
    - title: The crowd and most boys
      points:
      - Rush past
      - Don't notice her
      - Like a flock of sheep
    - title: The kind boy
      points:
      - Stops and takes her arm
      - Helps her cross safely
      - Thinks of his own mother
    alt: The crowd and most boys rush past like a flock of sheep; the kind boy stops, helps the old woman cross and thinks of his own mother.
  activity:
    type: sort
    prompt: 'Somebody''s Mother: the old woman, the crowd, or the boy?'
    bins:
    - The old woman
    - The crowd
    - The kind boy
    items:
    - label: Afraid of the carriages
      bin: The old woman
      clue: Waiting at the crossing.
      why: She is scared to cross the busy street.
    - label: Rush by like a flock of sheep
      bin: The crowd
      clue: A simile for the schoolboys.
      why: The rushing boys are compared to sheep.
    - label: Helps her across gently
      bin: The kind boy
      clue: One stops.
      why: The kind boy helps her.
    - label: Thinks of his own mother
      bin: The kind boy
      clue: '''Somebody''s mother''.'
      why: He imagines his own mother old and poor.
    - label: Prays for the noble boy
      bin: The old woman
      clue: That night.
      why: She prays for the boy who helped.
  items:
  - prompt: What season is described in the poem?
    options:
    - Winter
    - Summer
    - Spring
    - Monsoon
    answer: Winter
    difficulty: 1
    hints:
    - Fresh snow.
    - The street is slippery.
    solution: It is a winter day with fresh snow on the street.
  - prompt: Why was the old woman afraid to cross?
    options:
    - The street was busy and slippery
    - She had lost her way
    - A dog was chasing her
    - It was dark
    answer: The street was busy and slippery
    difficulty: 1
    hints:
    - Carriages and horses.
    - Wet snow.
    solution: She feared the busy traffic on the slippery, snowy street.
  - prompt: 'The boys rushing past are compared to:'
    options:
    - A flock of sheep
    - A pack of wolves
    - Busy bees
    - Falling leaves
    answer: A flock of sheep
    difficulty: 1
    hints:
    - A simile.
    - They move together without thinking.
    solution: They rush by 'like a flock of sheep'.
    mistakes:
      Busy bees: eng8_read_again
  - prompt: Why did the boy help the old woman?
    options:
    - He thought she was somebody's mother, like his own
    - She paid him
    - His teacher told him to
    - She was his grandmother
    answer: He thought she was somebody's mother, like his own
    difficulty: 2
    hints:
    - Read the title.
    - He imagined his own mother old.
    solution: He hoped someone would help his own mother in the same way one day.
  - prompt: What did the old woman do that night?
    options:
    - Prayed for the boy
    - Wrote him a letter
    - Gave him a gift
    - Told the police
    answer: Prayed for the boy
    difficulty: 1
    hints:
    - She thanked God.
    - '''Be kind to the noble boy''.'
    solution: She prayed that God would be kind to the boy, 'somebody's son'.
  - prompt: What is the main message of the poem?
    options:
    - Small acts of kindness matter and everyone deserves respect
    - Winter is dangerous
    - Schoolboys are rude
    - Old people should stay home
    answer: Small acts of kindness matter and everyone deserves respect
    difficulty: 2
    hints:
    - Why repeat 'somebody's mother'?
    - Every person is someone's loved one.
    solution: 'The poem shows empathy: every stranger is someone''s loved one.'
    mistakes:
      Schoolboys are rude: eng8_whole_story
- code: cbse8e.u2.kurien
  title: 'Verghese Kurien: I Too Had a Dream'
  after:
  - cbse8e.u2.mother
  notes: |
    A letter written in 2005 by Dr Verghese Kurien to his grandson Siddharth, looking back on his life.
    Kurien could have chosen a comfortable career abroad or elsewhere, but he chose to stay in Anand,
    Gujarat, and work with dairy farmers, guided by the farmers' leader Tribhuvandas Patel. Their farmers'
    cooperative (behind the Amul brand) helped make India one of the world's biggest milk producers: the
    White Revolution (Operation Flood). He tells Siddharth that life is a privilege not to be wasted; use your
    talents for the common good; integrity (honesty) matters most; failure means not doing your best, not
    just not succeeding; happiness comes from gratitude, not wealth. His wife supported him through hard
    years in Anand. He received the Padma Vibhushan (1999). Message: a life of service is the true reward.
  explanations:
    text: In a letter to his grandson Siddharth, Verghese Kurien explains why he turned down an easier life to work with dairy farmers in Anand, Gujarat. Their cooperative helped make India a leading milk producer. He tells Siddharth to be honest, to use his talents for others, and that real failure is not trying your best.
    visual: Picture an old man writing a letter at his desk, and behind him a village where farmers line up with milk cans at a cooperative collection centre.
    step_by_step: 'Step 1: What the text is: a letter to his grandson (2005). Step 2: His choice: stay in Anand and serve farmers. Step 3: The result: the cooperative and the White Revolution. Step 4: His values: integrity, service, gratitude, doing your best.'
    real_world: The milk packet in many Indian homes comes from farmers' cooperatives that grew from the work Kurien describes.
  picture:
    kind: flow
    steps:
    - Turns down easier careers
    - Chooses to work with farmers in Anand
    - Builds a farmers' cooperative with Tribhuvandas Patel
    - India becomes a leading milk producer
    - Writes to his grandson about honesty and service
    alt: 'Kurien''s choices in five steps: turning down easier careers, working with farmers in Anand, building the cooperative, India''s milk success, and his letter about honesty and service.'
  activity:
    type: sort
    prompt: 'Verghese Kurien: what does he tell his grandson?'
    bins:
    - About his choice
    - Advice for life
    items:
    - label: He stayed in Anand with dairy farmers
      bin: About his choice
      clue: Where he worked.
      why: Staying in Anand was his life's choice.
    - label: Life is a privilege, not to be wasted
      bin: Advice for life
      clue: To Siddharth.
      why: This is advice to his grandson.
    - label: Worked with Tribhuvandas Patel
      bin: About his choice
      clue: The farmers' leader.
      why: That partnership was part of his choice.
    - label: Integrity matters most
      bin: Advice for life
      clue: Honesty.
      why: He advises honesty above all.
    - label: Failure is not doing your best
      bin: Advice for life
      clue: A new meaning.
      why: He redefines failure as advice.
  items:
  - prompt: To whom is the letter in this chapter written?
    options:
    - His grandson Siddharth
    - The Prime Minister
    - His teacher
    - The farmers of Anand
    answer: His grandson Siddharth
    difficulty: 1
    hints:
    - A family member.
    - A young reader.
    solution: Kurien writes to his grandson, Siddharth.
    mistakes:
      The farmers of Anand: eng8_read_again
  - prompt: Where did Kurien choose to work with dairy farmers?
    options:
    - Anand, Gujarat
    - Kochi, Kerala
    - Pune, Maharashtra
    - Shimla, Himachal Pradesh
    answer: Anand, Gujarat
    difficulty: 1
    hints:
    - A town in Gujarat.
    - Home of a famous cooperative.
    solution: He worked with dairy farmers in Anand, Gujarat.
  - prompt: 'The great rise in India''s milk production is known as the:'
    options:
    - White Revolution
    - Green Revolution
    - Blue Revolution
    - Yellow Revolution
    answer: White Revolution
    difficulty: 1
    hints:
    - Think of the colour of milk.
    - Operation Flood.
    solution: The White Revolution made India a leading milk producer.
    mistakes:
      Green Revolution: eng8_read_again
  - prompt: Kurien wrote the letter in 2005 and received the Padma Vibhushan in 1999. How many years apart were these?
    answer: '6'
