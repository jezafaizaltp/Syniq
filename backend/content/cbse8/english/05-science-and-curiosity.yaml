# CBSE Class 8 English (NCERT Poorvi, 2025), unit 5: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse8-eng
chapter: 5
title: 'Science and Curiosity: Feathered Friend · Magnifying Glass · Bibha Chowdhuri'
tips:
  e8_bibha_age: "Subtract 1913 from 1991. Check the borrowing in the tens place."
  e8_bibha_name: "The chapter's title explains her name."
  e8_canary: "Small birds feel bad air before people do. Why would miners want that warning?"
  e8_cosmic: "Bibha was a physicist who worked on particles that rain down from space."
  e8_drop: "Under a lens, a drop of water is busy with tiny living things moving about."
  e8_faint: "The humans felt fine but the bird fainted. Something in the air had changed."
  e8_glass_message: "The poem keeps finding wonder in small things. What is it asking us to do?"
  e8_moss: "Moss is green and has many tiny 'trees'. Under a lens it looks like a ..."
  e8_no_gravity: "In space there is no up or down. How does that change flying?"
  e8_pioneer: "'Lit the path' is a metaphor. She showed the way for others."
  e8_spinnerets: "'Spin' is in the word. What does a spider spin?"
  e8_star_year: "1913 is when she was born. The star was named long after her death, recently."
  e8_sven: "The bird was smuggled in by a big, kind crew member with a Scandinavian name."
  e8s_cosmic: '''Cosmic'' is about the whole universe beyond the Earth.'
  e8s_tool: Which choice makes small things look bigger?
  e8s_iau: Which group's job is naming stars and planets?
  e8s_rules: Why do people hide something they bring along? Think about a space station's strict rules.
  e8s_vocab: Read the sentence around the word and ask what it must mean there.
  e8s_order: 'Retell the events in order: what had to happen before this?'
  e8s_char: Think about what the person did, then pick the word that fits it.
  e8s_device: A simile uses 'like' or 'as'; personification gives human actions to things; a metaphor says one thing is another.
  e8s_gap: 'Find the difference: take the earlier year from the later one.'
  e8s_writer: 'Match each text to its writer: the space story, the poem about small things, the life of a scientist.'

concepts:
- code: cbse8e.u5.feathered
  title: Feathered Friend (Arthur C. Clarke)
  notes: |
    A science-fiction story by Arthur C. Clarke, told by a crew member on a space station. Sven Olsen, a
    skilled construction worker, secretly brings a canary called Claribel on board. She learns to fly in zero
    gravity and becomes everyone's pet. One morning Claribel is found unconscious. The crew give her oxygen and
    she recovers. The narrator then feels unwell and remembers that miners once took canaries underground to
    warn of bad air. Checking the system, they find the air purifier had failed during the night (it froze in
    the station's shadow) and the alarm had not worked. The tiny bird saved the whole crew. Themes: careful
    observation, the link between science and nature, small creatures can matter enormously.
  explanations:
    text: On a space station, Sven secretly keeps a canary called Claribel, who learns to fly without gravity. One morning she is found unconscious. The narrator remembers that miners used canaries to warn of bad air, and the crew find the air purifier has failed with no alarm. Claribel's collapse saves everyone.
    visual: Picture a yellow canary floating in a space station, then lying still at the bottom of her cage, and an engineer opening a panel to find a frozen air purifier.
    step_by_step: 'Step 1: Sven brings Claribel aboard. Step 2: She learns to fly in zero gravity. Step 3: She is found unconscious; oxygen revives her. Step 4: The narrator remembers miners'' canaries. Step 5: The failed air purifier is found: the crew is saved.'
    real_world: 'Coal miners really did carry canaries underground: a canary reacts to poisonous gas before people do, giving them time to escape.'
  picture:
    kind: flow
    steps:
    - Sven secretly brings a canary aboard
    - Claribel learns to fly in zero gravity
    - She is found unconscious; oxygen revives her
    - Miners used canaries to detect bad air
    - 'The air purifier had failed: the crew is saved'
    alt: 'Feathered Friend in five steps: the secret canary, flying in zero gravity, her collapse, the memory of miners'' canaries, and finding the failed air purifier.'
  activity:
    type: order
    prompt: 'Feathered Friend: put the events in order.'
    steps:
    - Sven brings Claribel aboard
    - She learns to fly in zero gravity
    - Claribel is found unconscious
    - The narrator feels unwell too
    - They find the air purifier failed
    reasons:
      She learns to fly in zero gravity: The crew make her their pet.
      Claribel is found unconscious: One morning something is wrong.
      The narrator feels unwell too: After she is given oxygen.
      They find the air purifier failed: He remembers miners' canaries warning of bad air.
  lesson:
    - teach: '''Feathered Friend'' is a science-fiction story by Arthur C. Clarke, told by a crew member on a space station. Sven Olsen, a construction worker, secretly brings a canary named Claribel on board. She learns to fly without gravity and becomes everyone''s pet.'
      check:
        prompt: What is science fiction?
        options:
        - Imagined stories built on science and technology
        - True news reports
        - Fairy tales with dragons
        answer: Imagined stories built on science and technology
        why: The story imagines life on a space station.
    - teach: 'One morning Claribel is found unconscious. The crew give her oxygen and she recovers. Then the narrator feels unwell and remembers that miners took canaries underground: a canary faints from bad air before people notice.'
      check:
        prompt: Why did miners take canaries underground?
        options:
        - They react to bad air before people do
        - To sing to the miners
        - To find gold
        answer: They react to bad air before people do
        why: A fainting canary warned miners of poisonous gas.
    - teach: 'Checking the system, the crew find the air purifier failed in the night: it froze in the station''s shadow and the alarm did not work. The tiny bird saved everyone. Careful observation and small creatures can matter enormously.'
      picture:
        kind: flow
        steps:
        - Air purifier freezes
        - Alarm fails
        - Claribel faints
        - Crew checks air
        - Everyone saved
        alt: The purifier froze, the alarm failed, Claribel fainted, the crew checked the air, and everyone was saved.
      check:
        prompt: Why didn't the crew know the air was bad?
        options:
        - The alarm did not work
        - They were asleep forever
        - There was no air system
        answer: The alarm did not work
        why: Without the alarm, only Claribel's fainting warned them.
  items:
  - prompt: What kind of bird is Claribel?
    options:
    - A canary
    - A parrot
    - A pigeon
    - A sparrow
    answer: A canary
    difficulty: 1
    hints:
    - Small and yellow.
    - Used by miners.
    solution: Claribel is a canary.
    mistakes:
      A parrot: eng8_read_again
  - prompt: Who brought Claribel to the space station?
    options:
    - Sven Olsen
    - The narrator
    - The station commander
    - A scientist from Earth
    answer: Sven Olsen
    difficulty: 1
    hints:
    - A construction worker.
    - He smuggled her in.
    solution: Sven Olsen secretly brought her aboard.
    mistakes: {"The narrator": "e8_sven"}
  - prompt: What is unusual about how Claribel flies on the station?
    options:
    - She flies without gravity
    - She flies backwards
    - She can't fly at all
    - She flies only at night
    answer: She flies without gravity
    difficulty: 1
    hints:
    - Space stations have zero gravity.
    - Everything floats.
    solution: She learns to fly in zero gravity, where there is no up or down.
    mistakes: {"She can't fly at all": "e8_no_gravity"}
  - prompt: Why did Claribel faint?
    options:
    - The air purifier had failed and the air was bad
    - She was hungry
    - She was cold
    - She was frightened by Sven
    answer: The air purifier had failed and the air was bad
    difficulty: 2
    hints:
    - Think of the miners.
    - Something wrong with the air.
    solution: The purifier had failed, and the canary felt the bad air first.
    mistakes: {"She was hungry": "e8_faint"}
  - prompt: Why did miners once take canaries into mines?
    options:
    - To warn them of poisonous gas
    - To keep them company
    - To find gold
    - To sing to them
    answer: To warn them of poisonous gas
    difficulty: 2
    hints:
    - Canaries are sensitive.
    - An early warning.
    solution: Canaries react to bad air before people do, warning miners.
    mistakes: {"To find gold": "e8_canary"}
  - prompt: What is the main idea of the story?
    options:
    - Even a small creature can save lives, and careful observation matters
    - Pets are banned in space
    - Space is boring
    - Machines never fail
    answer: Even a small creature can save lives, and careful observation matters
    difficulty: 2
    hints:
    - What did Claribel do?
    - The alarm failed.
    solution: A tiny bird and alert thinking saved the crew.
    mistakes:
      Machines never fail: eng8_whole_story
  - prompt: Who wrote 'Feathered Friend'?
    options:
    - Arthur C. Clarke
    - Walter de la Mare
    - Ruskin Bond
    answer: Arthur C. Clarke
    difficulty: 2
    hints:
    - He was a famous science-fiction writer.
    - De la Mare wrote the magnifying glass poem.
    solution: Arthur C. Clarke wrote this space story.
    mistakes:
      Walter de la Mare: e8s_writer
      Ruskin Bond: e8s_writer
  - prompt: What was the canary's name?
    options:
    - Claribel
    - Bibha
    - Sven
    answer: Claribel
    difficulty: 1
    hints:
    - Sven was the man who brought her.
    - Bibha is a scientist in another chapter.
    solution: The canary was named Claribel.
    mistakes:
      Bibha: eng8_read_again
      Sven: e8_sven
  - prompt: How did the crew revive Claribel?
    options:
    - They gave her oxygen
    - They gave her water
    - They played music
    answer: They gave her oxygen
    difficulty: 2
    hints:
    - Her problem was bad air.
    - What does a body need to breathe?
    solution: Oxygen brought her round.
    mistakes:
      They gave her water: e8_faint
      They played music: e8_faint
  - prompt: Why did the air purifier fail?
    options:
    - It froze in the station's shadow
    - Claribel broke it
    - Sven switched it off
    answer: It froze in the station's shadow
    difficulty: 3
    hints:
    - Space is very cold out of sunlight.
    - Part of the station was in shadow.
    solution: The purifier froze while that part of the station was in shadow.
    mistakes:
      Claribel broke it: e8s_order
      Sven switched it off: e8s_order
  - prompt: Which word best describes the narrator when he links Claribel's fainting to bad air?
    options:
    - Quick-thinking
    - Careless
    - Cruel
    answer: Quick-thinking
    difficulty: 2
    hints:
    - He remembered the miners' trick.
    - He acted before it was too late.
    solution: His quick thinking saved the crew.
    mistakes:
      Careless: e8s_char
      Cruel: e8s_char
  - prompt: What does 'unconscious' mean?
    options:
    - Not awake and not aware
    - Very happy
    - Flying fast
    answer: Not awake and not aware
    difficulty: 1
    hints:
    - '''Un-'' means not.'
    - Claribel lay still and did not respond.
    solution: Unconscious means not awake or aware.
    mistakes:
      Very happy: e8s_vocab
      Flying fast: e8s_vocab
  - prompt: Why did Sven bring Claribel secretly?
    options:
    - Pets were not allowed on the station
    - She was dangerous
    - He wanted to sell her
    answer: Pets were not allowed on the station
    difficulty: 2
    hints:
    - Why hide something?
    - Space stations have strict rules.
    solution: Pets were against the rules, so he smuggled her in.
    mistakes:
      She was dangerous: e8s_rules
      He wanted to sell her: e8s_rules
  - prompt: Which came last?
    options:
    - The crew found the purifier had failed
    - Sven brought Claribel aboard
    - Claribel learned to fly without gravity
    answer: The crew found the purifier had failed
    difficulty: 2
    hints:
    - The fault was discovered after the fainting.
    - Sven brought her at the start.
    solution: Arrival, learning to fly, fainting, then the discovery of the fault.
    mistakes:
      Sven brought Claribel aboard: e8s_order
      Claribel learned to fly without gravity: e8s_order
  - prompt: What is the story's message?
    options:
    - Even a small creature can save lives
    - Pets cause trouble
    - Space is boring
    answer: Even a small creature can save lives
    difficulty: 1
    hints:
    - Who warned the crew?
    - She was tiny.
    solution: A tiny canary saved the whole crew.
    mistakes:
      Pets cause trouble: eng8_whole_story
      Space is boring: eng8_whole_story
- code: cbse8e.u5.glass
  title: Magnifying Glass (poem)
  after:
  - cbse8e.u5.feathered
  notes: |
    A poem by Walter de la Mare. Through a magnifying glass ordinary tiny things become wonderful: a scrap of
    chalk shows shells; an inch of moss looks like a forest; a drop of water seems as busy as a hive of bees;
    the poet watches a spider spin silk from its spinnerets and flies caught in its web; he even imagines that
    such lenses could bring the moon near. Tone: wonder and curiosity. Devices: simile (a drop of water like a
    hive of bees), metaphor and personification. Themes: close observation reveals hidden worlds; science and
    imagination go together.
  explanations:
    text: 'In this poem, a magnifying glass turns small, ordinary things into wonders: chalk shows tiny shells, moss looks like a forest, a drop of water is busy like a beehive, and a spider spins silk. Looking closely opens up hidden worlds.'
    visual: Picture a large round lens held over a patch of moss, and inside the circle a whole forest of tiny trees appears.
    step_by_step: 'Step 1: Name what is looked at: chalk, moss, water, spider. Step 2: Say what it seems to become. Step 3: Find the comparison (simile or metaphor). Step 4: State the theme: close looking reveals wonders.'
    real_world: Scientists use microscopes, a stronger kind of magnifying glass, to see cells and germs, the hidden world this poem imagines.
  picture:
    kind: compare
    columns:
    - title: What it is
      points:
      - A scrap of chalk
      - An inch of moss
      - A drop of water
    - title: What it looks like through the glass
      points:
      - Full of tiny shells
      - A forest
      - A busy hive of bees
    alt: Through the magnifying glass a scrap of chalk shows tiny shells, an inch of moss looks like a forest, and a drop of water looks like a busy beehive.
  activity:
    type: sort
    prompt: 'Magnifying Glass: what does each tiny thing become?'
    bins:
    - A scrap of chalk
    - An inch of moss
    - A drop of water
    - A spider
    items:
    - label: Shells
      bin: A scrap of chalk
      clue: Chalk is made from…
      why: Chalk shows tiny shells under the glass.
    - label: A forest
      bin: An inch of moss
      clue: Green and leafy.
      why: Moss looks like a forest.
    - label: A busy hive of bees
      bin: A drop of water
      clue: Full of moving life.
      why: A water drop seems busy as a hive.
    - label: Silk spun from spinnerets
      bin: A spider
      clue: Who makes a web?
      why: Under the glass he watches the spider spin its silk.
  lesson:
    - teach: 'In ''Magnifying Glass'', Walter de la Mare shows ordinary tiny things turning wonderful under a lens: a scrap of chalk shows shells, and an inch of moss looks like a forest.'
      check:
        prompt: What does a magnifying glass do?
        options:
        - Makes small things look bigger
        - Makes things disappear
        - Heats water
        answer: Makes small things look bigger
        why: It enlarges what you look at.
    - teach: 'A drop of water seems ''like a hive of bees'': a simile, because it uses ''like''. The poet watches a spider spin silk from its spinnerets and imagines lenses bringing the moon near.'
      picture:
        kind: compare
        columns:
        - title: Ordinary thing
          points:
          - Scrap of chalk
          - Inch of moss
          - Drop of water
        - title: Under the glass
          points:
          - Tiny shells
          - A forest
          - Busy as a hive of bees
        alt: Under the glass, chalk shows shells, moss looks like a forest, and a drop of water seems as busy as a beehive.
      check:
        prompt: Why is a drop of water compared to a hive of bees?
        options:
        - It is full of tiny busy living things
        - It is yellow
        - It stings
        answer: It is full of tiny busy living things
        why: Under the lens, the water teems with tiny life.
    - teach: The tone is wonder and curiosity. The poem says looking closely reveals hidden worlds, and science and imagination go together.
      check:
        prompt: What is the tone of the poem?
        options:
        - Wonder and curiosity
        - Anger
        - Boredom
        answer: Wonder and curiosity
        why: The poet is amazed by what he sees.
  items:
  - prompt: Who wrote 'Magnifying Glass'?
    options:
    - Walter de la Mare
    - Sarojini Naidu
    - Ruskin Bond
    - Arthur C. Clarke
    answer: Walter de la Mare
    difficulty: 1
    hints:
    - An English poet.
    - He also wrote 'The Listeners'.
    solution: The poem is by Walter de la Mare.
    mistakes:
      Arthur C. Clarke: eng8_read_again
  - prompt: What does an inch of moss look like through the glass?
    options:
    - A forest
    - A desert
    - An ocean
    - A mountain
    answer: A forest
    difficulty: 1
    hints:
    - Many tiny green stems.
    - Like trees.
    solution: Magnified, the moss looks like a forest.
    mistakes: {"A desert": "e8_moss"}
  - prompt: 'A drop of water is compared to:'
    options:
    - A hive of bees
    - A mirror
    - A diamond
    - A bubble
    answer: A hive of bees
    difficulty: 1
    hints:
    - It is full of life.
    - Busy and buzzing.
    solution: Magnified, a drop of water seems as busy as a beehive.
    mistakes: {"A diamond": "e8_drop"}
  - prompt: '''A drop of water like a hive of bees'' is an example of:'
    options:
    - A simile
    - Alliteration
    - A pun
    - A rhyme
    answer: A simile
    difficulty: 2
    hints:
    - It uses 'like'.
    - Comparing two things.
    solution: A comparison using 'like' is a simile.
    mistakes:
      A pun: eng8_poem_meaning
  - prompt: What are spinnerets?
    options:
    - The parts a spider uses to make silk
    - A spider's legs
    - Tiny shells in chalk
    - Lenses
    answer: The parts a spider uses to make silk
    difficulty: 2
    hints:
    - The poet watches the spider spin.
    - Silk comes from them.
    solution: Spinnerets are a spider's silk-making organs.
    mistakes: {"A spider's legs": "e8_spinnerets"}
  - prompt: What is the main message of the poem?
    options:
    - Looking closely reveals hidden wonders in ordinary things
    - Spiders are scary
    - Chalk is useless
    - The moon is close
    answer: Looking closely reveals hidden wonders in ordinary things
    difficulty: 2
    hints:
    - Everything changes under the glass.
    - Curiosity.
    solution: Close observation shows that ordinary things are full of wonder.
    mistakes: {"Spiders are scary": "e8_glass_message"}
  - prompt: What does chalk show under the glass?
    options:
    - Tiny shells
    - Gold
    - Stars
    answer: Tiny shells
    difficulty: 2
    hints:
    - Chalk forms from tiny sea creatures.
    - Their remains can still be seen.
    solution: Chalk is made of tiny shells of sea creatures.
    mistakes:
      Gold: eng8_read_again
      Stars: eng8_read_again
  - prompt: Where does a spider's silk come from?
    options:
    - Its spinnerets
    - Its eyes
    - Its legs
    answer: Its spinnerets
    difficulty: 2
    hints:
    - The poet names the body part.
    - They are at the end of the spider's body.
    solution: Spiders spin silk from organs called spinnerets.
    mistakes:
      Its eyes: e8_spinnerets
      Its legs: e8_spinnerets
  - prompt: Why does moss look like a forest under the glass?
    options:
    - Its tiny stems look like trees when enlarged
    - It turns into trees
    - The glass is green
    answer: Its tiny stems look like trees when enlarged
    difficulty: 2
    hints:
    - Moss is made of tiny upright stems.
    - Enlarged, they stand like a crowd of trees.
    solution: Magnified, the tiny stems look like a forest of trees.
    mistakes:
      It turns into trees: e8_moss
      The glass is green: e8_moss
  - prompt: Which is an example of personification?
    options:
    - The busy water drop hums with work
    - A drop of water like a hive
    - Moss is green
    answer: The busy water drop hums with work
    difficulty: 3
    hints:
    - Personification gives human actions to things.
    - Can a water drop 'work'?
    solution: Saying a drop 'hums with work' gives it human qualities.
    mistakes:
      A drop of water like a hive: e8s_device
      Moss is green: e8s_device
  - prompt: What does 'curiosity' mean?
    options:
    - A strong wish to know or learn
    - Fear
    - Sleepiness
    answer: A strong wish to know or learn
    difficulty: 1
    hints:
    - The poet keeps looking closer.
    - Curious people ask questions.
    solution: Curiosity is the desire to find out.
    mistakes:
      Fear: e8s_vocab
      Sleepiness: e8s_vocab
  - prompt: What does the poet imagine lenses could do to the moon?
    options:
    - Bring it near
    - Turn it off
    - Paint it
    answer: Bring it near
    difficulty: 2
    hints:
    - Think of a telescope.
    - It uses lenses too.
    solution: He imagines lenses bringing the moon close, as telescopes do.
    mistakes:
      Turn it off: eng8_read_again
      Paint it: eng8_read_again
  - prompt: Which tool would let you see what the poet sees?
    options:
    - A hand lens
    - A hammer
    - A ruler
    answer: A hand lens
    difficulty: 1
    hints:
    - It is another name for the poem's tool.
    - It enlarges things.
    solution: A hand lens is a magnifying glass.
    mistakes:
      A hammer: e8s_tool
      A ruler: e8s_tool
  - prompt: In the spider part of the poem, what gets caught in the web?
    options:
    - Flies
    - Fish
    - Leaves of moss
    answer: Flies
    difficulty: 1
    hints:
    - Spiders catch small insects for food.
    - Which choice is an insect?
    solution: The poet watches flies caught in the spider's web.
    mistakes:
      Fish: eng8_read_again
      Leaves of moss: eng8_read_again
  - prompt: What does the poem suggest about science and imagination?
    options:
    - They work together
    - They are enemies
    - Only science matters
    answer: They work together
    difficulty: 2
    hints:
    - The poet uses a science tool.
    - Then he imagines forests and hives.
    solution: Observation with a tool sparks the poet's imagination.
    mistakes:
      They are enemies: e8_glass_message
      Only science matters: e8_glass_message
- code: cbse8e.u5.bibha
  title: 'Bibha Chowdhuri: The Beam of Light'
  after:
  - cbse8e.u5.glass
  notes: |
    Bibha Chowdhuri (1913–1991) was an Indian physicist born in Kolkata, at a time when few women studied
    science. She studied physics and worked at the Bose Institute, Kolkata, studying cosmic rays and tiny
    particles called mesons using photographic plates. In 1945 she went to the University of Manchester and
    worked with Patrick Blackett (later a Nobel laureate), earning her PhD on cosmic rays. In 1949 she became
    the first woman faculty member at the Tata Institute of Fundamental Research (TIFR), Mumbai, invited by
    Homi J. Bhabha; later she worked at the Physical Research Laboratory, Ahmedabad. She received little fame
    in her lifetime. In 2019 the International Astronomical Union named a star (HD 86081) 'Bibha', meaning 'beam of light'. Message: courage and persistence opened science to women.
  explanations:
    text: Bibha Chowdhuri was an Indian physicist who studied cosmic rays and tiny particles at a time when very few women did science. She worked with leading scientists in India and England and was the first woman faculty member at TIFR. In 2019 a star was named 'Bibha' after her.
    visual: Picture a woman scientist in a 1940s laboratory examining photographic plates for the tracks of cosmic-ray particles, and above, a star labelled 'Bibha'.
    step_by_step: 'Step 1: Who she was: physicist, born 1913 in Kolkata. Step 2: Her work: cosmic rays and mesons. Step 3: Her firsts: TIFR''s first woman faculty member. Step 4: Her late recognition: a star named Bibha in 2019.'
    real_world: Today Indian women scientists lead space missions at ISRO; pioneers like Bibha Chowdhuri opened that path.
  picture:
    kind: flow
    steps:
    - Born 1913 in Kolkata
    - Studies cosmic rays at the Bose Institute
    - '1945: PhD work in Manchester with Blackett'
    - '1949: first woman faculty member at TIFR'
    - '2019: a star is named ''Bibha'''
    alt: 'Bibha Chowdhuri''s life in five steps: born in Kolkata in 1913, cosmic-ray research, PhD work in Manchester, first woman faculty member at TIFR, and a star named after her in 2019.'
  activity:
    type: order
    prompt: 'Bibha Chowdhuri: put her life in order.'
    steps:
    - Born in Kolkata, 1913
    - Studies cosmic rays at the Bose Institute
    - PhD at Manchester with Blackett
    - First woman faculty at TIFR
    - A star named 'Bibha'
    reasons:
      Studies cosmic rays at the Bose Institute: She studies physics.
      PhD at Manchester with Blackett: She goes abroad in 1945.
      First woman faculty at TIFR: Invited by Bhabha in 1949.
      A star named 'Bibha': In 2019, long after her life.
  lesson:
    - teach: Bibha Chowdhuri (1913–1991) was a physicist born in Kolkata, at a time when few women studied science. At the Bose Institute she studied cosmic rays and tiny particles called mesons using photographic plates.
      check:
        prompt: What are mesons?
        options:
        - Tiny particles studied in physics
        - Kinds of stars
        - Plants
        answer: Tiny particles studied in physics
        why: She tracked them on photographic plates.
    - teach: In 1945 she went to the University of Manchester and worked with Patrick Blackett, later a Nobel laureate, earning her PhD on cosmic rays. In 1949 Homi J. Bhabha invited her to TIFR, Mumbai, where she became the first woman faculty member.
      picture:
        kind: flow
