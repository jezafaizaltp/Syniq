    solution: With care and time, the tree recovered every time it was hurt.
    mistakes: {"Goats are dangerous": "e8_nature_strong"}
  - prompt: Why is the tree special to Rakesh?
    options:
    - He planted and cared for it himself
    - It was very expensive
    - His grandfather bought it
    - It was the only tree in town
    answer: He planted and cared for it himself
    difficulty: 1
    hints:
    - Read the end.
    - His own effort.
    solution: He feels it is special because he grew it himself.
    mistakes: {"His grandfather bought it": "e8_own_tree"}
  - prompt: Who lives with Rakesh?
    options:
    - His grandfather
    - His uncle
    - His teacher
    answer: His grandfather
    difficulty: 1
    hints:
    - They lie under the tree together at the end.
    - He is an old man.
    solution: Rakesh lives with his grandfather near Mussoorie.
    mistakes:
      His uncle: eng8_read_again
      His teacher: eng8_read_again
  - prompt: What colour were the cherry blossoms?
    options:
    - Pink
    - Yellow
    - Blue
    answer: Pink
    difficulty: 1
    hints:
    - Think of cherry blossom pictures.
    - A soft, light colour.
    solution: The tree flowered with pink blossoms.
    mistakes:
      Yellow: eng8_read_again
      Blue: eng8_read_again
  - prompt: Which danger came first to the young tree?
    options:
    - A goat ate its leaves
    - It blossomed
    - Bees visited it
    answer: A goat ate its leaves
    difficulty: 2
    hints:
    - Dangers came before the blossoms.
    - An animal came first.
    solution: The goat ate its leaves before the scythe and storms.
    mistakes:
      It blossomed: e8n_order
      Bees visited it: e8n_order
  - prompt: Which word best describes Rakesh's care for the tree?
    options:
    - Patient
    - Careless
    - Angry
    answer: Patient
    difficulty: 1
    hints:
    - He waited years for it to grow.
    - He kept watering it.
    solution: 'He cared for it for years: patience.'
    mistakes:
      Careless: e8n_char
      Angry: e8n_char
  - prompt: Why did the bees and birds come to the tree?
    options:
    - To visit the blossoms
    - To eat the goat
    - To build a house
    answer: To visit the blossoms
    difficulty: 1
    hints:
    - Bees collect nectar.
    - The tree had just flowered.
    solution: The pink blossoms attracted bees and birds.
    mistakes:
      To eat the goat: eng8_read_again
      To build a house: eng8_read_again
  - prompt: Which word in the story means 'became green and started to grow'?
    options:
    - Sprouted
    - Withered
    - Wilted
    answer: Sprouted
    difficulty: 2
    hints:
    - The forgotten seed began to grow.
    - The other two mean drying up.
    solution: To sprout is to begin to grow.
    mistakes:
      Withered: e8n_vocab
      Wilted: e8n_vocab
  - prompt: Rakesh planted the seed at 6. If the tree blossomed when he was 9, how many years did that take?
    answer: '3'
    check: 9-6
