      A river: e8n_vocab
  - prompt: What does 'succour' mean?
    options:
    - Help in hard times
    - Sugar
    - Sleep
    answer: Help in hard times
    difficulty: 2
    hints:
    - It sounds like 'sucker' but means something kind.
    - Nature gives it to people in need.
    solution: Succour means help or comfort.
    mistakes:
      Sugar: e8n_vocab
      Sleep: e8n_vocab
  - prompt: Which festival time does the poem describe?
    options:
    - Harvest time
    - Winter holidays
    - School exams
    answer: Harvest time
    difficulty: 1
    hints:
    - Look at the title.
    - Crops are being gathered.
    solution: The poem is sung at harvest, thanking nature for crops.
    mistakes:
