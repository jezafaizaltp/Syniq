concepts:
- code: cbse8e.u4.cherry
  title: The Cherry Tree (Ruskin Bond)
  notes: |
    Six-year-old Rakesh lives with his grandfather near Mussoorie. Walking home from the bazaar, he eats
    cherries and plants a seed in a corner of the garden. He forgets it, but it sprouts. The little tree
    faces dangers: a goat eats its leaves; a woman cutting grass with a scythe cuts it in half; the monsoon
    and winter test it. Each time it grows again. Rakesh waters it and protects it with pebbles. Years later
    it blossoms with pink flowers, and bees and birds come. Rakesh lies under it with his grandfather and
    feels it is special because he planted it himself. Themes: patience, care, nature's resilience, the bond
    between people and nature, small efforts bringing big results.
  explanations:
    text: 'Little Rakesh plants a cherry seed near his grandfather''s house in Mussoorie. The tiny tree is eaten by a goat, cut by a grass-cutter''s scythe and battered by weather, but it keeps growing. Years later it blossoms, and Rakesh feels proud: he grew it himself.'
    visual: 'Picture a timeline: a boy with a cherry seed; a tiny shoot; a goat nibbling it; a stump; a young tree in rain; finally a tree covered in pink blossom with a boy and his grandfather lying underneath.'
    step_by_step: 'Step 1: Rakesh plants the seed. Step 2: It sprouts. Step 3: Dangers: goat, scythe, weather. Step 4: It recovers each time. Step 5: It blossoms, and Rakesh feels proud.'
    real_world: Planting and caring for one tree, even at school, teaches the patience that the cherry tree taught Rakesh.
  picture:
    kind: flow
    steps:
    - Rakesh plants a cherry seed
    - It sprouts in the garden
    - A goat eats it; a scythe cuts it
    - It grows again through rain and winter
    - It blossoms; Rakesh feels proud
    alt: 'The cherry tree''s life in five steps: planted, sprouting, damaged by a goat and a scythe, growing again through the seasons, and blossoming.'
  activity:
    type: order
    prompt: 'The Cherry Tree: put the tree''s life in order.'
    steps:
    - Rakesh plants a cherry seed
    - The seed sprouts
    - A goat eats its leaves
    - A scythe cuts it in half
    - It blossoms with pink flowers
    reasons:
      The seed sprouts: He forgets it, but it grows.
      A goat eats its leaves: The young plant faces danger.
      A scythe cuts it in half: Another danger.
      It blossoms with pink flowers: Each time it grows again, and years later it flowers.
  lesson:
    - teach: In Ruskin Bond's 'The Cherry Tree', six-year-old Rakesh lives with his grandfather near Mussoorie. Walking home, he eats cherries and plants a seed in the garden. He forgets about it, but it sprouts.
      check:
        prompt: How did the cherry tree begin?
        options:
        - Rakesh planted a seed from a cherry he ate
        - Grandfather bought a sapling
        - A bird dropped a seed
        answer: Rakesh planted a seed from a cherry he ate
        why: He planted the seed himself after eating cherries.
    - teach: 'The little tree faces dangers: a goat eats its leaves, a woman cutting grass with a scythe cuts it in half, and the monsoon and winter test it. Each time it grows again. Rakesh waters it and guards it.'
      picture:
        kind: flow
        steps:
        - Seed planted
        - Goat eats leaves
        - Scythe cuts it
        - Grows back
        - Pink blossoms
        alt: The seed is planted, a goat eats its leaves, a scythe cuts it, it grows back, and it blossoms pink.
      check:
        prompt: What is a scythe?
        options:
        - A tool with a long curved blade for cutting grass
        - A kind of goat
        - A watering can
        answer: A tool with a long curved blade for cutting grass
        why: The woman cut grass with it and cut the tree by mistake.
    - teach: Years later the tree blossoms with pink flowers, and bees and birds visit. Rakesh lies under it with his grandfather and feels it is special because he planted it. Nature recovers with care and patience.
      check:
        prompt: What does the story teach about nature?
        options:
        - With care, it can recover and grow strong
        - It always dies when hurt
        - It needs no care at all
        answer: With care, it can recover and grow strong
        why: The tree survived every danger with Rakesh's care.
  items:
  - prompt: Who wrote 'The Cherry Tree'?
    options:
    - Ruskin Bond
    - R. K. Narayan
    - Sudha Murty
    - Rabindranath Tagore
    answer: Ruskin Bond
    difficulty: 1
    hints:
    - He writes about the hills.
    - He lived in Mussoorie.
    solution: The story is by Ruskin Bond.
    mistakes:
      R. K. Narayan: eng8_read_again
  - prompt: How old was Rakesh when he planted the cherry seed?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - He was very young.
    - Six.
    solution: Rakesh was six years old.
    mistakes: {"8": "e8_rakesh_age"}
  - prompt: Where does Rakesh live with his grandfather?
    options:
    - Near Mussoorie
    - In Mumbai
    - In Chennai
    - In Jaipur
    answer: Near Mussoorie
    difficulty: 1
    hints:
    - In the hills.
    - Uttarakhand.
    solution: They live near Mussoorie in the hills.
    mistakes: {"In Mumbai": "e8_mussoorie"}
  - prompt: Which was NOT a danger the cherry tree faced?
    options:
    - A fire in the garden
    - A goat eating its leaves
    - A woman's scythe
    - Rain and winter
    answer: A fire in the garden
    difficulty: 2
    hints:
    - Three of these happened.
    - Think of the goat and the grass-cutter.
    solution: The goat, the scythe and the weather all hurt it; there was no fire.
    mistakes: {"A goat eating its leaves": "e8_not_danger"}
  - prompt: What does the cherry tree's survival show?
    options:
    - Nature is strong and recovers with care
