- code: cbse8e.u4.hymn
  title: Harvest Hymn (poem)
  after:
  - cbse8e.u4.cherry
  notes: |
    A poem by Sarojini Naidu in the form of a hymn (a song of praise). At harvest time voices thank the powers
    that make crops grow: men's voices praise the Sun, giver of warmth and light that ripens grain, and the
    Rain that nourishes the fields; women's voices praise Mother Earth; all voices together praise God, the
    creator. Old-style words: thee, thou, thy. Images: ripe harvests in the valleys; God as both the seed and
    the scythe (beginning and end of life). Themes: gratitude to nature, unity of the community, rural
    life and festivals. Word meanings: munificent (very generous), tribute (gift of thanks), succour (help).
  explanations:
    text: 'In this hymn, farmers celebrate the harvest by thanking everything that made it possible: the Sun, the Rain, Mother Earth, and finally God. It shows how much farming depends on nature, and how a whole community comes together to give thanks.'
    visual: 'Picture a golden field at harvest, with groups singing: one facing the sun, one looking at rain clouds, women touching the earth, and then everyone singing together.'
    step_by_step: 'Step 1: Know the form: a hymn is a song of praise. Step 2: Find who is praised: Sun, Rain, Earth, God. Step 3: Notice old words like thee and thou. Step 4: State the theme: gratitude to nature.'
    real_world: Harvest festivals like Onam, Pongal, Baisakhi and Bihu are the same kind of thanksgiving the poem describes.
  picture:
    kind: compare
    columns:
    - title: Who is praised
      points:
      - 'The Sun: warmth and light'
      - 'The Rain: water for the fields'
      - 'Mother Earth: the giver'
      - 'God: the creator'
    - title: What the poem teaches
      points:
      - Gratitude to nature
      - Farming depends on nature
      - A community united in thanks
    alt: The poem praises the Sun, the Rain, Mother Earth and God, and teaches gratitude to nature, our dependence on it, and unity.
  activity:
    type: sort
    prompt: 'Harvest Hymn: whose voices praise whom?'
    bins:
    - Men's voices
    - Women's voices
    - All voices
    items:
    - label: Praise the Sun and Rain
      bin: Men's voices
      clue: Warmth, light and water for crops.
      why: Men praise the Sun and Rain.
    - label: Praise Mother Earth
      bin: Women's voices
      clue: The land.
      why: Women praise Mother Earth.
    - label: Praise God the creator
      bin: All voices
      clue: Together.
      why: All voices join to praise God.
    - label: God as seed and scythe
      bin: All voices
      clue: Beginning and end.
      why: The final praise sees God in everything.
  items:
  - prompt: What is a hymn?
    options:
    - A song of praise
    - A funny story
    - A letter
    - A play
    answer: A song of praise
    difficulty: 1
    hints:
    - Often sung in worship.
    - It praises.
    solution: A hymn is a song of praise, often to God.
  - prompt: Who wrote 'Harvest Hymn'?
    options:
    - Sarojini Naidu
    - Ruskin Bond
    - Walter de la Mare
    - Robert Frost
    answer: Sarojini Naidu
    difficulty: 1
    hints:
    - The 'Nightingale of India'.
    - An Indian poet and freedom fighter.
    solution: The poem is by Sarojini Naidu.
    mistakes:
      Ruskin Bond: eng8_read_again
  - prompt: What does 'thee' mean in the poem?
    options:
    - You
    - Them
    - Me
    - Us
    answer: You
    difficulty: 1
    hints:
    - An old form.
    - Used when speaking to someone.
    solution: '''Thee'' is an old word for ''you''.'
  - prompt: Why do the farmers thank the Sun and the Rain?
    options:
    - They make the crops grow and ripen
    - They bring tourists
    - They stop the harvest
    - They build houses
    answer: They make the crops grow and ripen
    difficulty: 1
    hints:
    - What do crops need?
    - Light and water.
    solution: Crops need sunlight and rain to grow.
  - prompt: What does God as 'the seed and the scythe' suggest?
    options:
    - God is the beginning and the end of life
    - God is a farmer
    - Seeds are sharp
