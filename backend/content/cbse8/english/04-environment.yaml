- code: cbse8e.u4.rain
  title: Waiting for the Rain
  after:
  - cbse8e.u4.hymn
  notes: |
    A story by Kamakshi Balasubramanian. Velu is a hardworking farmer who loves his land. For six years his
    land gave good crops of jowar and dal; then the rain stopped and the soil became dry and cracked. Other
    farmers wanted to consult astrologers, but Velu believed in practical effort; he even went to the weather
    office, but the experts could not say when the rain would come. On the way back he met a calm old woman
    under a tree. She told him that land, like people, needs rest, and that nature sometimes lets the earth
    rest (lie fallow). Velu understood. Soon clouds gathered, lightning flashed and rain fell; he ran home
    full of hope. Themes: dependence on nature, patience, the wisdom of nature, harmony with the environment.
  explanations:
    text: Farmer Velu's land is dry because the rain hasn't come. He refuses to go to astrologers and asks at the weather office, but no one can say when it will rain. A wise old woman tells him the land needs rest, just as people do. Velu learns patience, and soon the rain returns.
    visual: Picture a cracked brown field and a worried farmer, then an old woman resting calmly under a tree, then dark clouds and the first drops of rain on the dry earth.
    step_by_step: 'Step 1: Six good years of crops. Step 2: The drought. Step 3: Velu''s practical search: the weather office. Step 4: The old woman: land needs rest. Step 5: The rain returns; Velu has hope.'
    real_world: Farmers sometimes leave a field unplanted for a season, called leaving it fallow, so the soil can recover, just as the old woman said.
  picture:
    kind: flow
    steps:
    - Six good years of jowar and dal
    - The rain stops; the land cracks
    - The weather office cannot say when it will rain
    - 'An old woman: the land needs rest'
    - Clouds gather and rain falls
    alt: 'Velu''s story in five steps: six good years, the drought, the weather office, the old woman''s advice that land needs rest, and the return of the rain.'
  activity:
    type: order
    prompt: 'Waiting for the Rain: put Velu''s story in order.'
    steps:
    - Six years of good crops
    - The rain stops; the soil cracks
    - Velu visits the weather office
    - An old woman says land needs rest
    - Rain falls and Velu runs home
    reasons:
      The rain stops; the soil cracks: Then the drought begins.
      Velu visits the weather office: He tries practical help, not astrologers.
      An old woman says land needs rest: On his way back.
      Rain falls and Velu runs home: Clouds gather; hope returns.
  lesson:
    - teach: In 'Waiting for the Rain' by Kamakshi Balasubramanian, Velu is a hardworking farmer who loves his land. For six years it gave good crops of jowar and dal. Then the rain stopped, and the soil cracked.
      check:
        prompt: What problem did Velu face?
        options:
        - 'A drought: no rain'
        - A flood
        - Too many crops
        answer: 'A drought: no rain'
        why: The rain stopped and the soil dried and cracked.
    - teach: Other farmers wanted to ask astrologers, but Velu believed in practical effort. He went to the weather office, but even the experts could not say when the rain would come.
      check:
        prompt: What does 'practical' mean here?
        options:
        - Based on real action and facts
        - Magical
        - Lazy
        answer: Based on real action and facts
        why: Velu sought real information, not fortune-telling.
