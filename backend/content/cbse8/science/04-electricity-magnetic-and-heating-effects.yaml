# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 4. Format: content/README.md.
subject: cbse8-sci
chapter: 4
title: 'Electricity: Magnetic and Heating Effects'
tips:
  t8_bell: "Which device switches a magnet on and off to pull a striker?"
  t8_compass_deflect: "Current in a wire makes a magnetic field. What does a compass do in a magnetic field?"
  t8_electromagnet_on: "Switch off the current: does the electromagnet still pick up pins?"
  t8_fuse: "A fuse protects the circuit. What happens to it when too much current flows?"
  t8_heating_effect: "Which appliance's main job is to get hot?"
  t8_led: "Touch a filament bulb after an hour: it is hot. What does that tell you about where its energy goes?"
  t8_mcb: "A fuse must be replaced after it melts. What can an MCB do instead?"
  t8_motor: "A motor turns electrical energy into movement. What pushes the coil?"
  t8_nichrome: "A heater wire must get very hot without melting. Copper is a good conductor, so it stays cool."
  t8_oersted: "In 1820 a compass needle moved near a wire carrying current. Faraday came later."
  t8_stronger_em: "More turns of wire add more magnetic effect. Plastic and less current do the opposite."
  c8s4_heat_use: Which appliance's whole job is to get hot? That one uses the heating effect.
  c8s4_safety: Too much current makes wires hot. Which device breaks the circuit before that becomes dangerous?
  c8s4_waste: Energy that comes out as heat when you only want light is wasted.
  c8s4_em_switch: An electromagnet needs current. What happens to its magnetism when the switch is off?
  c8s4_em_strength: More current or more turns make a stronger electromagnet. Which choice adds one of those?
  c8s4_em_use: Which device needs a magnet that can be switched on and off?

concepts:
- code: cbse8s.elec.heat
  title: The heating effect of current
  notes: |
    When current flows through a wire it heats up: the heating effect. Thin wires of high-resistance alloys
    such as nichrome get very hot and are used in heaters, irons, toasters and kettles; bulb filaments get
    so hot they glow. A fuse is a short wire of low melting point that melts and breaks the circuit when too
    much current flows, protecting wiring from fire; MCBs (miniature circuit breakers) do the same job and
    can be reset. LED bulbs waste less energy as heat than filament bulbs.
  explanations:
    text: 'Electric current makes wires warm. In a heater or an electric iron, a special wire (nichrome) gets very hot on purpose. A fuse uses the same effect for safety: if too much current flows, the fuse wire melts and switches the circuit off before the house wiring can catch fire.'
    visual: Draw a circuit with a battery, a switch and a thin coil glowing red. Add a fuse as a short wire in a little box, and show a break in it when too much current flows.
    step_by_step: 'Step 1: Current flows through a wire. Step 2: The wire''s resistance turns some electrical energy into heat. Step 3: Thin, high-resistance wires get hottest. Step 4: Heaters use this on purpose; fuses use it to cut the current when it is too large.'
    real_world: 'When too many appliances are plugged into one socket, the MCB trips and the lights go off: it has stopped a dangerously large current.'
  picture:
    kind: flow
    steps:
    - Too many appliances switched on
    - Current in the wiring becomes too large
    - Fuse wire heats up and melts
    - 'Circuit breaks: current stops'
    - Wiring is safe from fire
    alt: 'How a fuse protects a house: too much current melts the fuse wire, which breaks the circuit before the wiring overheats.'
  activity:
    type: formula
    prompt: Heat made each second in a wire = current × current × resistance.
    inputs:
    - name: i
      label: Current
      min: 1
      max: 10
      step: 1
      start: 1
      unit: A
    - name: r
      label: Resistance
      min: 1
      max: 100
      step: 1
      start: 1
      unit: Ω
    outputs:
    - name: heat
      label: Heat each second
      expr: i*i*r
      unit: J
    goals:
    - prompt: Make 400 J each second with a 25 Ω wire.
      want:
        r: 25
        heat: 400
      mistakes:
      - when:
          r: 25
          i:
          - 5
          - 10
        say: 'Too hot. Heat grows with the current squared: 5 × 5 × 25 is already 625.'
      - when:
          r: 25
          i:
          - 1
          - 3
        say: 'Not enough. Try a bigger current: it counts twice.'
    - prompt: Make 1000 J each second with a 10 A current.
      want:
        i: 10
        heat: 1000
      mistakes:
      - when:
          i: 10
          r: 100
        say: 100 × 10 = 1000 forgets the square. It's 10 × 10 × R.
    - prompt: Make 360 J each second with a 10 Ω wire.
      want:
        r: 10
        heat: 360
      mistakes:
      - when:
          r: 10
          i:
          - 7
          - 10
        say: 'Too much: 7 × 7 × 10 = 490 already.'
      - when:
          r: 10
          i:
          - 1
          - 5
        say: 'Not enough: 5 × 5 × 10 = 250.'
  lesson:
    - teach: When an electric current flows through a wire, the wire gets warm. This is the heating effect of current. Thin wires made of alloys such as nichrome get very hot, which is why they are used in heaters, irons, toasters and kettles.
      picture:
        kind: flow
        steps:
        - Switch on
        - Current flows through nichrome
        - Wire gets hot
        - Heater, iron, kettle
        alt: When current flows through a nichrome wire it gets hot, which is used in heaters, irons and kettles.
      check:
        prompt: Which appliance works mainly on the heating effect of current?
        options:
        - Electric kettle
        - Electric fan
        - Radio
        answer: Electric kettle
        why: A kettle's element is meant to get hot. A fan turns a motor; a radio makes sound.
    - teach: Filament bulbs glow because their thin wire gets so hot it gives out light, but most of the energy is wasted as heat. LED bulbs give the same light with much less heat, so they use far less electricity.
      check:
        prompt: Why does an old filament bulb feel hot?
        options:
        - Most of its energy turns into heat
        - It is made of glass
        - It is switched on
        answer: Most of its energy turns into heat
        why: A filament bulb wastes most of its energy as heat; only a little becomes light.
    - teach: 'Too much current can overheat house wiring and start a fire. A fuse is a short wire with a low melting point: it melts and breaks the circuit before the wiring gets dangerous. An MCB (miniature circuit breaker) does the same job but just switches off, and can be switched back on.'
      picture:
        kind: compare
        columns:
        - title: Fuse
          points:
          - Wire melts
          - Must be replaced
        - title: MCB
          points:
          - Switch trips off
          - Switch back on after fixing
        alt: A fuse wire melts and must be replaced; an MCB trips off and can be switched back on.
      check:
        prompt: Why must a fuse wire melt easily?
        options:
        - So it breaks the circuit before the wiring overheats
        - So it gives more light
        - So it lasts longer
        answer: So it breaks the circuit before the wiring overheats
        why: 'It is the weak point on purpose: it melts first and protects the rest.'
  items:
  - prompt: Which appliance works mainly on the heating effect of current?
    options:
    - Electric iron
    - Electric fan
    - Radio
    - Electric bell
    answer: Electric iron
    difficulty: 1
    hints:
    - Which one is meant to get hot?
    - It presses clothes.
    solution: An electric iron uses a heating element.
    mistakes: {"Electric fan": "t8_heating_effect", "Electric bell": "t8_heating_effect"}
  - prompt: What is the heating element of a heater usually made of?
    options:
    - Nichrome
    - Copper
    - Plastic
    - Glass
    answer: Nichrome
    difficulty: 2
    hints:
    - An alloy with high resistance.
    - It doesn't melt easily.
    solution: Nichrome has high resistance and a high melting point, so it gets hot without melting.
    mistakes: {"Copper": "t8_nichrome", "Plastic": "t8_nichrome"}
  - prompt: What does a fuse do?
    options:
    - Melts and breaks the circuit when the current is too large
    - Makes the current larger
    - Stores electricity
    - Turns current into light
    answer: Melts and breaks the circuit when the current is too large
    difficulty: 1
    hints:
    - It is a safety device.
    - Its wire melts.
    solution: A fuse melts when the current is too large, breaking the circuit and preventing fires.
    mistakes: {"Makes the current larger": "t8_fuse", "Stores electricity": "t8_fuse"}
  - prompt: Why should a fuse wire have a low melting point?
    options:
    - So it melts before the house wiring gets dangerously hot
    - So it never melts
    - So it glows brightly
    - So it costs less
    answer: So it melts before the house wiring gets dangerously hot
    difficulty: 2
    hints:
    - It must fail first.
    - It protects the rest.
    solution: A low melting point means the fuse breaks the circuit before other wires overheat.
    mistakes: {"So it never melts": "t8_fuse", "So it glows brightly": "t8_fuse"}
  - prompt: Why do LED bulbs save electricity compared with filament bulbs?
    options:
    - They waste much less energy as heat
    - They are bigger
    - They use no current
    - They are coloured
    answer: They waste much less energy as heat
    difficulty: 2
    hints:
    - 'Touch a filament bulb: it''s hot.'
    - That heat is wasted energy.
    solution: Filament bulbs turn most energy into heat; LEDs turn more into light.
    mistakes: {"They are bigger": "t8_led", "They use no current": "t8_led"}
  - prompt: What is the advantage of an MCB over a fuse?
    options:
    - It can be switched back on after it trips
    - It never trips
    - It makes current
    - It is a type of bulb
    answer: It can be switched back on after it trips
    difficulty: 2
    hints:
    - A melted fuse must be replaced.
    - An MCB is a switch.
    solution: An MCB trips like a fuse but can be reset instead of replaced.
    mistakes: {"It never trips": "t8_mcb", "It makes current": "t8_mcb"}
  - prompt: What happens to a wire when current flows through it?
    options:
    - It gets warm
    - It gets colder
    - Nothing at all
    answer: It gets warm
    difficulty: 1
    hints:
    - Feel a charger after use.
    - This is the heating effect.
    solution: Current flowing through a wire always produces some heat.
    mistakes:
      It gets colder: t8_heating_effect
      Nothing at all: t8_heating_effect
  - prompt: Which of these uses the heating effect of current?
    options:
    - Toaster
    - Electric bell
    - Electric motor
    answer: Toaster
    difficulty: 1
    hints:
    - Which one is meant to get hot?
    - The bell and the motor use magnetism.
    solution: A toaster's wires glow hot to toast bread. Bells and motors use the magnetic effect.
    mistakes:
      Electric bell: c8s4_heat_use
      Electric motor: c8s4_heat_use
  - prompt: Which wire is best for a heater's element?
    options:
    - Nichrome
    - Copper
    - Plastic-coated aluminium
    answer: Nichrome
    difficulty: 2
    hints:
    - It must get very hot without melting.
    - Copper carries current easily without much heat.
    solution: Nichrome resists current, gets very hot and doesn't melt or rust easily.
    mistakes:
      Copper: t8_nichrome
      Plastic-coated aluminium: t8_nichrome
  - prompt: What happens to a fuse when too much current flows?
    options:
    - Its wire melts and breaks the circuit
    - It glows like a bulb
    - It makes the current stronger
    answer: Its wire melts and breaks the circuit
    difficulty: 1
    hints:
    - It is a safety device.
    - It has a low melting point.
    solution: The fuse wire melts, the circuit breaks and the current stops.
    mistakes:
      It glows like a bulb: c8s4_safety
      It makes the current stronger: c8s4_safety
  - prompt: Why should we never replace a fuse with a thick copper wire?
    options:
    - It won't melt in time, so the wiring could catch fire
    - It is too expensive
    - It makes the lights dim
    answer: It won't melt in time, so the wiring could catch fire
    difficulty: 3
    hints:
    - What is the fuse's job?
    - A thick copper wire carries a lot of current without melting.
    solution: A fuse must melt before the wiring overheats. Thick copper won't, so the wiring could overheat and catch fire.
    mistakes:
      It is too expensive: t8_fuse
      It makes the lights dim: t8_fuse
  - prompt: Why do LED bulbs save electricity?
    options:
    - They turn more of their energy into light and less into heat
    - They are smaller
    - They work without electricity
    answer: They turn more of their energy into light and less into heat
    difficulty: 2
    hints:
    - A filament bulb gets very hot.
    - Heat is wasted energy here.
    solution: LEDs waste much less energy as heat, so they need less electricity for the same light.
    mistakes:
      They are smaller: c8s4_waste
      They work without electricity: c8s4_waste
  - prompt: Which safety device can be switched back on after it trips?
    options:
    - MCB
    - Fuse
    - Bulb
    answer: MCB
    difficulty: 1
    hints:
    - A fuse melts and must be replaced.
    - It has a switch.
    solution: A miniature circuit breaker (MCB) trips off and is switched back on once the fault is fixed.
    mistakes:
      Fuse: t8_mcb
      Bulb: t8_mcb
  - prompt: Why does a bulb's filament glow?
    options:
    - It gets so hot that it gives out light
    - It is painted with glowing paint
    - Sunlight is stored in it
    answer: It gets so hot that it gives out light
    difficulty: 2
    hints:
    - It is a very thin wire.
    - Think of a red-hot iron rod.
    solution: Current heats the thin filament until it is white-hot and glows.
    mistakes:
      It is painted with glowing paint: t8_heating_effect
      Sunlight is stored in it: t8_heating_effect
  - prompt: Plugging many heaters into one socket can be dangerous because…
    options:
    - Too much current flows and the wires overheat
    - The heaters get colder
    - The socket gives less current
    answer: Too much current flows and the wires overheat
    difficulty: 2
    hints:
    - Each heater draws a large current.
    - More current makes wires hotter.
    solution: Together they draw too much current, which overheats the wiring. The fuse or MCB should cut it off.
    mistakes:
      The heaters get colder: c8s4_safety
      The socket gives less current: c8s4_safety
- code: cbse8s.elec.magnet
  title: The magnetic effect of current
  after:
  - cbse8s.elec.heat
  notes: |
    A current-carrying wire produces a magnetic field and deflects a compass needle (Hans Christian Oersted,
    1820). A coil of wire wound round an iron core becomes an electromagnet when current flows; it is
    magnetic only while the current is on, and is stronger with more turns or more current. Electromagnets
    are used in electric bells, cranes that lift scrap iron, loudspeakers and MRI machines. In an electric
    motor, the push on a current-carrying coil in a magnetic field makes it turn.
  explanations:
    text: 'Electricity and magnetism are linked: a wire carrying current acts like a weak magnet, which is why a compass needle near it turns. Wind the wire into a coil round an iron nail and you get an electromagnet, a magnet you can switch on and off.'
    visual: Draw a nail wrapped in wire joined to a battery and a switch, with paper clips sticking to the nail. Open the switch and the clips fall off.
    step_by_step: 'Step 1: Pass current through a wire: it makes a magnetic field. Step 2: Wind the wire into a coil to concentrate the field. Step 3: Put soft iron inside to make it much stronger. Step 4: Switch off and the magnetism disappears.'
    real_world: Scrapyard cranes use huge electromagnets to lift old cars, then switch the current off to drop them exactly where they want.
  picture:
    kind: compare
    columns:
    - title: Electromagnet
      points:
      - Magnetic only when current flows
      - Strength can be changed
      - Can be switched off
      - Bells, cranes, motors
    - title: Permanent magnet
      points:
      - Always magnetic
      - Fixed strength
      - Can't be switched off
      - Fridge magnets, compasses
    alt: An electromagnet works only while current flows and can be made stronger or switched off; a permanent magnet is always on.
    caption: An electromagnet is a magnet with a switch.
  activity:
    type: formula
    prompt: 'An electromagnet: wire coiled round an iron nail. Strength grows with turns and current.'
    inputs:
    - name: n
      label: Turns of wire
      min: 10
      max: 100
      step: 10
      start: 10
    - name: i
      label: Current
      min: 1
      max: 5
      step: 1
      start: 1
      unit: A
    outputs:
    - name: pins
      label: Pins it can lift
      expr: n*i/10
    goals:
    - prompt: Lift 20 pins with a 2 A current.
      want:
        i: 2
        pins: 20
      mistakes:
      - when:
          i: 2
          n:
          - 10
          - 90
        say: Not enough turns. With 2 A, each 10 turns lifts 2 pins.
    - prompt: Lift 15 pins with 50 turns.
      want:
        n: 50
        pins: 15
      mistakes:
      - when:
          n: 50
          i:
          - 1
          - 2
        say: Too weak. With the turns fixed, more current makes it stronger.
    - prompt: Lift 20 pins again, but with only 50 turns.
      want:
        n: 50
        pins: 20
      mistakes:
      - when:
          n: 50
          i: 2
        say: Halving the turns halves the strength. Double the current to make up for it.
  lesson:
    - teach: 'In 1820 Hans Christian Oersted noticed that a compass needle moved when current flowed in a nearby wire. A current-carrying wire behaves like a magnet: this is the magnetic effect of current.'
      picture:
        kind: flow
        steps:
        - Compass near a wire
        - Switch on the current
        - Needle turns
        - The wire acts like a magnet
        alt: When current flows in a wire, a nearby compass needle turns, showing the wire acts as a magnet.
      check:
        prompt: What happens to a compass needle near a wire when the current is switched on?
        options:
        - It turns
        - It melts
        - Nothing
        answer: It turns
        why: The current makes a magnetic field around the wire, which pushes the needle.
    - teach: 'Wind a coil of wire around an iron nail and pass a current: the nail becomes an electromagnet. It is a magnet only while the current flows. More turns of wire or more current make it stronger.'
      picture:
        kind: compare
        columns:
        - title: Current on
          points:
          - Nail is a magnet
          - Picks up pins
        - title: Current off
          points:
          - Magnetism gone
          - Pins drop
        alt: With current on, the coiled nail is a magnet and picks up pins; with current off, the pins drop.
      check:
        prompt: How can you make an electromagnet stronger?
        options:
        - Add more turns of wire
        - Use a plastic core
        - Switch off the current
        answer: Add more turns of wire
        why: More turns (or more current) give a stronger magnetic field.
    - teach: 'Because they can be switched on and off, electromagnets are very useful: in electric bells, in cranes that lift scrap iron, in speakers and in motors. A motor turns because a current-carrying coil is pushed by a magnet.'
      check:
        prompt: Why do scrap-yard cranes use electromagnets instead of ordinary magnets?
        options:
        - They can drop the iron by switching off
        - They are lighter
        - They work without electricity
        answer: They can drop the iron by switching off
        why: Switching off the current turns the magnet off, so the scrap falls where it is wanted.
  items:
  - prompt: What happens to a compass needle placed near a wire carrying current?
    options:
    - It turns (deflects)
    - Nothing happens
    - It melts
    - It points down
    answer: It turns (deflects)
    difficulty: 1
    hints:
    - The wire has a magnetic field.
    - Oersted saw this.
    solution: The current's magnetic field deflects the compass needle.
    mistakes: {"Nothing happens": "t8_compass_deflect", "It points down": "t8_compass_deflect"}
  - prompt: When is an electromagnet magnetic?
    options:
    - Only while current flows through it
    - Always
    - Only when it is cold
    - Only in water
    answer: Only while current flows through it
    difficulty: 1
    hints:
    - It has a switch.
    - Off means no magnet.
    solution: An electromagnet loses its magnetism when the current stops.
    mistakes: {"Always": "t8_electromagnet_on", "Only when it is cold": "t8_electromagnet_on"}
  - prompt: Which change makes an electromagnet stronger?
    options:
    - More turns of wire in the coil
    - Fewer turns
    - A plastic core
    - Less current
    answer: More turns of wire in the coil
    difficulty: 2
    hints:
    - More coil, more field.
    - More current also helps.
    solution: More turns, more current and an iron core make it stronger.
    mistakes: {"A plastic core": "t8_stronger_em", "Less current": "t8_stronger_em"}
  - prompt: Which device uses an electromagnet?
    options:
    - Electric bell
    - Candle
    - Mirror
    - Thermometer
    answer: Electric bell
    difficulty: 1
    hints:
    - Which one has a striker pulled by a magnet?
    - Ring ring.
    solution: An electric bell's electromagnet pulls the striker to hit the gong.
    mistakes: {"Candle": "t8_bell", "Thermometer": "t8_bell"}
  - prompt: Who discovered that an electric current produces a magnetic effect?
    options:
    - Hans Christian Oersted
    - Michael Faraday
    - Thomas Edison
    - Isaac Newton
    answer: Hans Christian Oersted
    difficulty: 3
    hints:
    - In 1820.
    - A compass moved during his lecture.
    solution: Oersted noticed a compass needle move near a current-carrying wire in 1820.
    mistakes: {"Michael Faraday": "t8_oersted", "Thomas Edison": "t8_oersted"}
  - prompt: What makes an electric motor turn?
    options:
    - A current-carrying coil is pushed by a magnetic field
    - Heat from the wires
    - Light from a bulb
    - Air pressure
    answer: A current-carrying coil is pushed by a magnetic field
    difficulty: 2
    hints:
    - Magnetism and current together.
    - A force on the coil.
    solution: In a motor, the magnetic field pushes on the current-carrying coil, making it spin.
    mistakes: {"Heat from the wires": "t8_motor", "Air pressure": "t8_motor"}
  - prompt: Who discovered that electric current has a magnetic effect?
    options:
    - Hans Christian Oersted
    - Alexander Fleming
    - Edward Jenner
    answer: Hans Christian Oersted
    difficulty: 1
    hints:
    - He noticed a compass needle move.
    - This was in 1820.
    solution: Oersted saw a compass needle deflect near a current-carrying wire in 1820.
    mistakes:
      Alexander Fleming: t8_oersted
      Edward Jenner: t8_oersted
  - prompt: What happens to an electromagnet when the current is switched off?
    options:
    - It stops being a magnet
    - It becomes stronger
    - It stays a magnet forever
    answer: It stops being a magnet
    difficulty: 1
    hints:
    - Its magnetism comes from the current.
    - No current, no …
    solution: An electromagnet is magnetic only while current flows.
    mistakes:
      It becomes stronger: c8s4_em_switch
      It stays a magnet forever: c8s4_em_switch
  - prompt: Which core makes the best electromagnet?
    options:
    - Iron
    - Wood
    - Plastic
    answer: Iron
    difficulty: 2
    hints:
    - The core must be magnetic.
    - Wood and plastic are not.
    solution: Iron is easily magnetised and demagnetised, so it makes a strong electromagnet.
    mistakes:
      Wood: t8_stronger_em
      Plastic: t8_stronger_em
  - prompt: Which change makes an electromagnet weaker?
    options:
    - Fewer turns of wire
    - A bigger current
    - An iron core
    answer: Fewer turns of wire
    difficulty: 2
    hints:
    - More turns make it stronger.
    - So what makes it weaker?
    solution: Fewer turns give a weaker field. A bigger current and an iron core make it stronger.
    mistakes:
      A bigger current: c8s4_em_strength
      An iron core: c8s4_em_strength
  - prompt: Which of these needs a magnet that can be switched on and off?
    options:
    - Electric crane in a scrap yard
    - Electric iron
    - Torch bulb
    answer: Electric crane in a scrap yard
    difficulty: 1
    hints:
    - Which one needs a magnet that can be turned off?
    - The iron and bulb use heating.
    solution: The crane's electromagnet lifts scrap iron and drops it when switched off.
    mistakes:
      Electric iron: c8s4_em_use
      Torch bulb: c8s4_em_use
  - prompt: In an electric bell, what makes the hammer strike the gong?
    options:
    - An electromagnet pulls the iron strip
    - A spring pushes it all the time
    - Heat bends the hammer
    answer: An electromagnet pulls the iron strip
    difficulty: 3
    hints:
    - The bell has a coil of wire.
    - When current flows, the coil pulls on iron.
    solution: Current makes the coil an electromagnet, which pulls the iron strip and hammer to strike the gong; the circuit then breaks and the strip springs back, again and again.
    mistakes:
      A spring pushes it all the time: t8_bell
      Heat bends the hammer: t8_bell
  - prompt: What makes the coil in an electric motor turn?
    options:
    - A current-carrying coil is pushed by a magnet
    - Heat from the wire
    - Air blowing on it
    answer: A current-carrying coil is pushed by a magnet
    difficulty: 2
    hints:
    - A motor has magnets and a coil.
    - Current in a wire near a magnet feels a push.
    solution: The current in the coil and the magnet push on each other, which turns the coil.
    mistakes:
      Heat from the wire: t8_motor
      Air blowing on it: t8_motor
  - prompt: Which shows the magnetic effect of current?
    options:
    - A compass needle moves near a wire carrying current
    - A heater glows red
    - A fuse melts
    answer: A compass needle moves near a wire carrying current
    difficulty: 1
    hints:
    - Which one involves a magnet?
    - The heater and fuse show heating.
    solution: Only the compass needle shows the magnetic effect; the others show the heating effect.
    mistakes:
      A heater glows red: t8_compass_deflect
      A fuse melts: t8_compass_deflect
  - prompt: Why is the core of an electromagnet made of soft iron, not steel?
    options:
