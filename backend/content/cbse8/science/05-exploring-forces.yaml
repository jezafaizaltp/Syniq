# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 5. Format: content/README.md.
subject: cbse8-sci
chapter: 5
title: Exploring Forces
tips:
  c8s_mass_weight: 'That is the mass in kg. Weight is a force: multiply the mass by g (about 10 N per kg).'
  t8_ball_bearing: "Rolling is easier than sliding. Which kind of friction is smaller?"
  t8_force_effects: "A force can push, pull, speed up, slow down or squash. Can it add or remove matter?"
  t8_friction_direction: "Friction always works against the motion."
  t8_lubricant: "Oil makes surfaces slippery. Does that increase or reduce friction?"
  t8_moon_weight: "Weight on the Moon is one-sixth of weight on Earth. Divide by 6."
  t8_newton_unit: "Kilogram is mass and joule is energy. Force has its own unit named after a scientist."
  t8_non_contact: "A non-contact force acts without touching. Which one pulls an apple to the ground from a distance?"
  t8_ship_floats: "A ship is hollow. How much water does its shape push aside compared with a solid nail?"
  t8_static: "Rubbing the comb gives it a charge. Which force acts between charges?"
  t8_upthrust: "When you push a ball under water, what pushes it back up?"
  t8_useful_friction: "Which choice uses friction to help us, rather than wearing something away?"
  c8s5_touch: Do the two things have to touch for this force to act?
  c8s5_weight_calc: Weight in newtons = mass in kg × 10 (taking g = 10 N/kg).
  c8s5_effects: A force can start or stop motion, change speed or direction, or change shape. It can't change what the object is made of.
  c8s5_friction_more: Friction grows with rougher surfaces and with harder pressing. Which choice makes either happen?
  c8s5_reduce: Smooth, oiled or rolling surfaces have less friction. Which choice does one of those?
  c8s5_float: An object floats when the water's upward push can balance its weight. Spreading out pushes aside more water.
concepts:
- code: cbse8s.force.types
  title: Contact and non-contact forces
  notes: |
    A force is a push or a pull. It can start or stop motion, change speed or direction, or change shape.
    Force is measured in newtons (N). Contact forces act by touching: muscular force, friction, normal
    force. Non-contact forces act at a distance: gravity, magnetic force and electrostatic force. Gravity
    pulls everything towards the Earth: weight = mass × g, with g about 10 N per kg (9.8 N/kg). Mass stays
    the same everywhere; weight changes (on the Moon it is about 1/6).
  explanations:
    text: 'A force is a push or pull. Some forces need touch, like kicking a ball. Others work across a gap: a magnet pulls a pin, and gravity pulls you down without touching you. Your weight is the pull of gravity on your mass.'
    visual: 'Draw two columns: contact forces (a hand pushing a box, a shoe on the ground) and non-contact forces (the Earth pulling an apple, a magnet pulling a pin through the air, a combed balloon lifting bits of paper).'
    step_by_step: 'Step 1: Ask whether the objects touch. Step 2: If they do, it is a contact force (muscular, friction). Step 3: If not, it is non-contact (gravity, magnetic, electrostatic). Step 4: For weight, multiply mass in kg by about 10 to get newtons.'
    real_world: 'Astronauts on the Moon bounce easily because the Moon''s gravity is about one-sixth of the Earth''s: their mass is the same, but their weight is much less.'
  picture:
    kind: compare
    columns:
    - title: Contact forces
      points:
      - Muscular force
      - Friction
      - Normal (support) force
    - title: Non-contact forces
      points:
      - Gravity
      - Magnetic force
      - Electrostatic force
    alt: Contact forces like muscular force and friction need touch; non-contact forces like gravity and magnetism act at a distance.
    caption: Do the objects touch? That is the test.
  activity:
    type: sort
    prompt: Does the force need touching?
    bins:
    - Contact
    - Non-contact
    items:
    - label: Kicking a football
      bin: Contact
      clue: Does your foot touch the ball?
      why: Muscular force needs contact.
    - label: Brakes slowing a cycle
      bin: Contact
      clue: The brake pads rub the wheel.
      why: Friction acts where surfaces touch.
    - label: Pushing a door open
      bin: Contact
      clue: Your hand is on the door.
      why: Contact force.
    - label: Wind filling a sail
      bin: Contact
      clue: Moving air pushes on the cloth.
      why: The air touches the sail.
    - label: A magnet pulling a pin from a distance
      bin: Non-contact
      clue: Is there a gap between them?
      why: Magnetic force works across a gap.
    - label: A mango falling from a tree
      bin: Non-contact
      clue: Is anything touching it as it falls?
      why: Gravity acts across space.
    - label: A rubbed comb picking up paper bits
      bin: Non-contact
      clue: The bits jump before the comb touches them.
      why: Electrostatic force.
    - label: The Earth holding the Moon in orbit
      bin: Non-contact
      clue: There's empty space between them.
      why: Gravity.
  lesson:
    - teach: A force is a push or a pull. A force can start something moving, stop it, change its speed or direction, or change its shape. Force is measured in newtons (N).
      picture:
        kind: compare
        columns:
        - title: A force can
          points:
          - Start or stop motion
          - Change speed
          - Change direction
          - Change shape
        - title: Example
          points:
          - Kicking a ball
          - Pedalling harder
          - A bat hitting a ball
          - Squeezing clay
        alt: A force can start or stop motion, change speed, change direction or change shape.
      check:
        prompt: Squeezing a lump of dough changes its…
        options:
        - Shape
        - Mass
        - Colour
        answer: Shape
        why: A force can change the shape of an object, but not how much matter it has.
    - teach: 'Contact forces act only when things touch: muscular force, friction and the push of a surface. Non-contact forces act from a distance: gravity, magnetic force, and electrostatic force (a rubbed comb pulling bits of paper).'
      picture:
        kind: compare
        columns:
        - title: Contact
          points:
          - Muscular force
          - Friction
          - Push of a table
        - title: Non-contact
          points:
          - Gravity
          - Magnetic force
          - Electrostatic force
        alt: Contact forces include muscular force and friction; non-contact forces include gravity, magnetism and electrostatic force.
      check:
        prompt: A magnet pulls a pin from a little distance away. What kind of force is this?
        options:
        - Non-contact
        - Contact
        - Friction
        answer: Non-contact
        why: The magnet doesn't touch the pin, so it is a non-contact force.
    - teach: 'Gravity pulls every object towards the Earth. Mass is how much matter an object has, in kg, and stays the same everywhere. Weight is the pull of gravity on it, in newtons: on Earth, weight = mass × 10 (roughly). On the Moon gravity is about 1/6 as strong, so you weigh about 1/6 as much.'
      picture:
        kind: flow
        steps:
        - Mass 30 kg
        - 'On Earth: 30 × 10 = 300 N'
        - 'On the Moon: 300 ÷ 6 = 50 N'
        - Mass still 30 kg
        alt: A 30 kg mass weighs 300 N on Earth and about 50 N on the Moon, but its mass is still 30 kg.
      check:
        prompt: An astronaut goes to the Moon. What happens to her mass?
        options:
        - It stays the same
        - It becomes one-sixth
        - It becomes zero
        answer: It stays the same
        why: Mass is the amount of matter, which doesn't change. Her weight becomes about one-sixth.
  items:
  - prompt: Which is a non-contact force?
    options:
    - Gravity
    - Friction
    - Muscular force
    - A push from your hand
    answer: Gravity
    difficulty: 1
    hints:
    - Which acts without touching?
    - The Earth pulls an apple.
    solution: Gravity acts at a distance.
    mistakes: {"Friction": "t8_non_contact", "Muscular force": "t8_non_contact"}
  - prompt: A bag has a mass of 5 kg. Taking g = 10 N/kg, what is its weight in newtons?
    answer: '50'
    check: 5*10
    difficulty: 1
    hints:
    - Weight = mass × g.
    - 5 × 10.
    solution: 5 × 10 = 50 N.
    mistakes:
      '5': c8s_mass_weight
  - prompt: What is the unit of force?
    options:
    - Newton
    - Kilogram
    - Metre
    - Joule
    answer: Newton
    difficulty: 1
    hints:
    - Named after a scientist.
    - N.
    solution: Force is measured in newtons (N).
    mistakes: {"Kilogram": "t8_newton_unit", "Joule": "t8_newton_unit"}
  - prompt: A combed plastic comb picks up bits of paper. Which force is this?
    options:
    - Electrostatic force
    - Magnetic force
    - Friction
    - Muscular force
    answer: Electrostatic force
    difficulty: 2
    hints:
    - The comb has been charged by rubbing.
    - Static charge.
    solution: Rubbing charges the comb, and the electrostatic force attracts the paper.
    mistakes: {"Magnetic force": "t8_static", "Friction": "t8_static"}
  - prompt: A person's weight on Earth is 600 N. Roughly what would it be on the Moon, in newtons (one-sixth)?
    answer: '100'
    check: 600/6
    difficulty: 2
    hints:
    - Divide by 6.
    - 600 ÷ 6.
    solution: 600 ÷ 6 = 100 N. The mass stays the same.
    mistakes: {"3600": "t8_moon_weight", "594": "t8_moon_weight"}
  - prompt: Which of these can a force NOT do?
    options:
    - Change the mass of an object
    - Change its speed
    - Change its direction
    - Change its shape
    answer: Change the mass of an object
    difficulty: 2
    hints:
    - Pushing a ball doesn't add matter.
    - Mass stays the same.
    solution: Forces change motion and shape, but not the amount of matter (mass).
    mistakes: {"Change its speed": "t8_force_effects", "Change its shape": "t8_force_effects"}
  - prompt: Which is a contact force?
    options:
    - Friction
    - Gravity
    - Magnetic force
    answer: Friction
    difficulty: 1
    hints:
    - Which one needs two surfaces to touch?
    - Gravity acts across space.
    solution: Friction acts between surfaces that touch. Gravity and magnetism act at a distance.
    mistakes:
      Gravity: c8s5_touch
      Magnetic force: c8s5_touch
  - prompt: A box has a mass of 12 kg. Taking g = 10 N/kg, what is its weight, in newtons?
    answer: '120'
    check: 12*10
    difficulty: 1
    hints:
    - Weight = mass × g.
    - 12 × 10.
    solution: 12 × 10 = 120 N.
    mistakes:
      '12': c8s_mass_weight
      '1.2': c8s5_weight_calc
  - prompt: A rock weighs 240 N on Earth. About how much would it weigh on the Moon, in newtons?
    answer: '40'
    check: 240/6
    difficulty: 2
    hints:
    - The Moon's gravity is about one-sixth of Earth's.
    - 240 ÷ 6.
    solution: 240 ÷ 6 = 40 N.
    mistakes:
      '1440': t8_moon_weight
      '240': t8_moon_weight
  - prompt: A goalkeeper stops a moving ball. What has the force done?
    options:
    - Stopped its motion
    - Changed its mass
    - Changed its colour
    answer: Stopped its motion
    difficulty: 1
    hints:
    - The ball was moving, now it isn't.
    - A force can't change mass.
    solution: The goalkeeper's force stopped the ball's motion.
    mistakes:
      Changed its mass: c8s5_effects
      Changed its colour: c8s5_effects
  - prompt: A rubbed balloon sticks to a wall. Which force holds it?
    options:
    - Electrostatic force
    - Magnetic force
    - Friction only
    answer: Electrostatic force
    difficulty: 2
    hints:
    - Rubbing gives the balloon a charge.
    - The wall isn't a magnet.
    solution: Rubbing charges the balloon, and the electrostatic force pulls it to the wall.
    mistakes:
      Magnetic force: t8_static
      Friction only: t8_static
  - prompt: Which is measured in newtons?
    options:
    - Weight
    - Mass
    - Length
    answer: Weight
    difficulty: 2
    hints:
    - Newtons measure forces.
    - Weight is the pull of gravity.
    solution: Weight is a force, so it is in newtons. Mass is in kg and length in metres.
    mistakes:
      Mass: t8_newton_unit
      Length: t8_newton_unit
  - prompt: A cyclist turns the handle and the cycle goes round a bend. What did the force change?
    options:
    - The direction of motion
    - The mass of the cycle
    - The shape of the road
    answer: The direction of motion
    difficulty: 1
    hints:
    - The cycle still moves, but somewhere else.
    - Mass doesn't change.
    solution: Turning the handle changes the direction in which the cycle moves.
    mistakes:
      The mass of the cycle: c8s5_effects
      The shape of the road: c8s5_effects
  - prompt: Why does a ball thrown up come back down?
    options:
    - Gravity pulls it towards the Earth
    - Air pushes it down
    - It gets tired
    answer: Gravity pulls it towards the Earth
    difficulty: 1
    hints:
    - Which force acts on everything near the Earth?
    - It acts without touching.
    solution: Gravity pulls the ball down all the time; it slows the ball on the way up and brings it back.
    mistakes:
      Air pushes it down: t8_non_contact
      It gets tired: t8_non_contact
  - prompt: Two students push a cart from opposite sides with equal force. What happens?
    options:
    - The cart doesn't move
    - It moves towards the stronger-looking student
    - It moves upward
    answer: The cart doesn't move
    difficulty: 3
    hints:
    - Equal forces in opposite directions…
    - …cancel each other.
    solution: Equal and opposite forces balance, so there is no overall push and the cart stays still.
    mistakes:
      It moves towards the stronger-looking student: t8_force_effects
      It moves upward: t8_force_effects
- code: cbse8s.force.friction
  title: Friction and buoyancy
  after:
  - cbse8s.force.types
  notes: |
    Friction opposes motion between surfaces in contact; it is larger on rough surfaces and when surfaces are
    pressed together harder. Rolling friction is less than sliding friction (hence wheels and ball bearings);
    lubricants (oil, grease) reduce friction. Friction is useful (walking, brakes, writing) but also wastes
    energy as heat and wears things out. A liquid pushes up on an object in it: buoyant force (upthrust). An
    object floats if the upthrust can equal its weight before it is fully under; this depends on its density
    compared with the liquid.
  explanations:
    text: Friction is the force that tries to stop surfaces sliding over each other. It lets you walk without slipping and lets brakes stop a cycle, but it also wears out shoes and heats machine parts. Water also pushes up on things in it; if that upward push can match the weight, the object floats.
    visual: Draw a box being pushed to the right on a rough floor with a small friction arrow pointing left. Next to it, draw a boat in water with a weight arrow down and an equal upthrust arrow up.
    step_by_step: 'Step 1: Friction always acts against the direction of motion. Step 2: Rough surfaces and heavier loads give more friction. Step 3: Wheels and oil reduce it. Step 4: For floating, compare the object''s weight with the upward push of the water.'
    real_world: On a wet road, friction between tyres and road is lower, so vehicles take longer to stop; that is why drivers slow down in rain.
  picture:
    kind: geometry
    points:
      A:
      - 3
      - 4
      B:
      - 7
      - 4
      C:
      - 7
      - 6
      D:
      - 3
      - 6
      _p1:
      - 0.5
      - 5
      _p2:
      - 3
      - 5
      _f1:
      - 9.5
      - 4.5
      _f2:
      - 7
      - 4.5
    segments:
    - - A
      - B
    - - B
      - C
    - - C
      - D
    - - D
      - A
    - - _p1
      - _p2
      - push →
    - - _f1
      - _f2
      - ← friction
    caption: Friction acts against the push, along the surface.
    alt: A box pushed to the right from the left side, with friction acting to the left along the bottom.
  activity:
    type: sort
    prompt: Does this increase or reduce friction?
    bins:
    - Increase friction
    - Reduce friction
    items:
    - label: Deep treads on tyres
      bin: Increase friction
      clue: Treads grip the road. More grip or less?
      why: Treads raise friction so tyres don't skid.
    - label: Spikes on running shoes
      bin: Increase friction
      clue: Spikes dig into the track.
      why: More grip.
    - label: Sand on a slippery road
      bin: Increase friction
      clue: Sand makes the surface rougher.
      why: Rough surfaces grip more.
    - label: Chalk powder on a gymnast's hands
      bin: Increase friction
      clue: It soaks up sweat so hands don't slip.
      why: Better grip.
    - label: Oil in a sewing machine
      bin: Reduce friction
      clue: Parts slide more easily.
      why: A lubricant.
    - label: Ball bearings in a cycle hub
      bin: Reduce friction
      clue: Rolling instead of sliding.
      why: Rolling friction is smaller.
    - label: Powder on a carrom board
      bin: Reduce friction
      clue: The striker glides further.
      why: Smoother surface.
    - label: A boat with a pointed, smooth shape
      bin: Reduce friction
      clue: It cuts through water easily.
      why: A streamlined shape reduces drag.
  lesson:
    - teach: Friction is a force between surfaces in contact that opposes motion. It acts in the direction opposite to the way something moves or tries to move. Rough surfaces and surfaces pressed hard together have more friction.
      picture:
        kind: compare
        columns:
        - title: More friction
          points:
          - Rough surfaces
          - Pressed hard together
          - Sliding
        - title: Less friction
          points:
          - Smooth or oiled surfaces
          - Lightly pressed
          - Rolling on wheels
        alt: Rough, hard-pressed or sliding surfaces have more friction; smooth, oiled or rolling ones have less.
      check:
        prompt: A box is pushed to the right. Which way does friction act on it?
        options:
        - To the left
        - To the right
        - Upward
        answer: To the left
        why: Friction opposes motion, so it acts opposite to the push.
    - teach: 'Friction is useful: it lets us walk, hold things, write and stop with brakes. But it also wears things out and wastes energy as heat. We reduce it with lubricants such as oil and grease, with wheels and ball bearings (rolling friction is less than sliding), and with smooth, streamlined shapes.'
      check:
        prompt: Which is an example of useful friction?
        options:
        - Shoe soles gripping the floor
        - A machine part wearing out
        - An engine getting hot
        answer: Shoe soles gripping the floor
        why: Without that grip we would slip. The other two are friction's drawbacks.
    - teach: 'A liquid pushes up on anything placed in it: the buoyant force, or upthrust. An object floats if the upthrust can balance its weight. An iron ship floats although an iron nail sinks, because its hollow shape pushes aside a lot of water, giving a big upthrust.'
      picture:
        kind: compare
        columns:
        - title: Iron nail
          points:
          - Small, solid
          - Pushes aside little water
          - Sinks
        - title: Iron ship
          points:
          - Hollow, spread out
          - Pushes aside lots of water
          - Floats
        alt: A solid iron nail pushes aside little water and sinks; a hollow iron ship pushes aside lots and floats.
      check:
        prompt: What is the upward push of water on an object called?
        options:
        - Upthrust
        - Friction
        - Gravity
        answer: Upthrust
        why: Water pushes up on things in it; this is upthrust, or buoyant force.
  items:
  - prompt: In which direction does friction act on a moving object?
    options:
    - Opposite to its motion
    - In the direction of motion
    - Straight up
    - Towards the Sun
    answer: Opposite to its motion
    difficulty: 1
    hints:
    - It resists sliding.
    - Against the movement.
    solution: Friction always opposes motion.
    mistakes: {"In the direction of motion": "t8_friction_direction", "Straight up": "t8_friction_direction"}
  - prompt: Why do we put oil in a cycle chain?
    options:
    - To reduce friction
    - To increase friction
    - To make it heavier
    - To change its colour
    answer: To reduce friction
    difficulty: 1
    hints:
    - Oil is a lubricant.
    - Smoother movement.
    solution: Oil is a lubricant that reduces friction and wear.
    mistakes: {"To increase friction": "t8_lubricant", "To make it heavier": "t8_lubricant"}
  - prompt: Which is an example of useful friction?
    options:
    - Brakes stopping a bicycle
    - Wear on shoe soles
    - Heat in machine parts
    - Tyres wearing out
    answer: Brakes stopping a bicycle
    difficulty: 2
    hints:
    - Which do we want?
    - The others are problems.
    solution: Brakes rely on friction to stop; the others are unwanted effects.
    mistakes: {"Wear on shoe soles": "t8_useful_friction", "Tyres wearing out": "t8_useful_friction"}
  - prompt: Why are ball bearings used in machines?
    options:
    - Rolling friction is less than sliding friction
    - They make machines heavier
    - They increase friction
    - They store energy
    answer: Rolling friction is less than sliding friction
    difficulty: 2
    hints:
    - Wheels are easier than dragging.
    - Rolling vs sliding.
    solution: Balls roll instead of slide, so friction is much less.
    mistakes: {"They increase friction": "t8_ball_bearing", "They make machines heavier": "t8_ball_bearing"}
  - prompt: What is the upward push of a liquid on an object called?
    options:
    - Buoyant force (upthrust)
    - Friction
    - Gravity
    - Magnetic force
    answer: Buoyant force (upthrust)
    difficulty: 1
    hints:
    - It helps things float.
    - Up-thrust.
    solution: Liquids push up on objects with a buoyant force.
    mistakes: {"Friction": "t8_upthrust", "Gravity": "t8_upthrust"}
  - prompt: An iron nail sinks but an iron ship floats. Why?
    options:
    - The ship's shape pushes aside enough water for upthrust to match its weight
    - Ships are made of lighter iron
    - Sea water has no gravity
    - Ships have engines that push them up
    answer: The ship's shape pushes aside enough water for upthrust to match its weight
    difficulty: 3
    hints:
    - A hollow shape displaces a lot of water.
    - More water pushed aside, more upthrust.
    solution: The hollow ship displaces a large volume of water, so the upthrust can equal its weight.
    mistakes: {"Ships are made of lighter iron": "t8_ship_floats", "Sea water has no gravity": "t8_ship_floats"}
  - prompt: Why is it hard to walk on a wet, soapy floor?
    options:
    - There is less friction to grip with
    - There is more gravity
    - The floor pushes us up
    answer: There is less friction to grip with
    difficulty: 1
    hints:
    - Soap makes the surface slippery.
    - We need grip to walk.
    solution: Soapy water reduces friction between our feet and the floor, so we slip.
    mistakes:
      There is more gravity: t8_useful_friction
      The floor pushes us up: t8_useful_friction
  - prompt: Which change gives MORE friction?
    options:
    - Making the surface rougher
    - Adding oil
    - Putting the box on wheels
    answer: Making the surface rougher
    difficulty: 1
    hints:
    - Oil and wheels make things easier to move.
    - Rough surfaces catch on each other.
    solution: Rough surfaces interlock more, giving more friction. Oil and wheels reduce it.
    mistakes:
      Adding oil: c8s5_friction_more
      Putting the box on wheels: c8s5_friction_more
  - prompt: Why do suitcases have wheels?
    options:
    - Rolling friction is less than sliding friction
    - Wheels make the case heavier
    - Wheels add more grip
    answer: Rolling friction is less than sliding friction
    difficulty: 2
    hints:
    - Compare dragging and rolling.
    - Which is easier?
    solution: Rolling has much less friction than sliding, so a wheeled case is easier to pull.
    mistakes:
      Wheels make the case heavier: t8_ball_bearing
      Wheels add more grip: c8s5_reduce
  - prompt: Why do tyres have deep grooves (treads)?
    options:
    - To increase friction and grip the road
    - To make them lighter
    - To reduce friction
    answer: To increase friction and grip the road
    difficulty: 2
    hints:
    - Think of a wet road.
    - Bald tyres skid.
    solution: Treads give grip by increasing friction, and let water escape on wet roads.
    mistakes:
      To make them lighter: c8s5_friction_more
      To reduce friction: t8_useful_friction
  - prompt: Rubbing your hands together makes them warm. Why?
    options:
    - Friction turns motion into heat
    - Hands store sunlight
    - Gravity heats them
    answer: Friction turns motion into heat
    difficulty: 1
    hints:
    - Which force acts between rubbing surfaces?
    - It produces heat.
    solution: Friction between the hands turns some of the motion into heat.
    mistakes:
      Hands store sunlight: t8_friction_direction
      Gravity heats them: t8_friction_direction
  - prompt: Why are fast boats and aeroplanes shaped with pointed fronts?
    options:
    - To reduce drag (friction from water or air)
    - To look nice only
    - To increase friction
    answer: To reduce drag (friction from water or air)
    difficulty: 2
    hints:
    - Water and air also cause friction.
    - A pointed shape cuts through easily.
    solution: Streamlined shapes reduce drag, the friction caused by air or water.
    mistakes:
      To look nice only: c8s5_reduce
      To increase friction: c8s5_reduce
  - prompt: A mug feels lighter when you lift it under water. Why?
    options:
    - Water pushes it up
    - Its mass becomes smaller
    - Gravity stops under water
    answer: Water pushes it up
    difficulty: 2
    hints:
    - Water pushes on things in it.
    - Mass doesn't change.
    solution: The upthrust of water pushes the mug up, so less effort is needed to lift it.
    mistakes:
      Its mass becomes smaller: t8_upthrust
      Gravity stops under water: t8_upthrust
  - prompt: A ball of clay sinks, but the same clay shaped into a bowl floats. Why?
    options:
    - The bowl pushes aside more water, so the upthrust is bigger
    - The bowl has less mass
    - Clay floats when it is dry
    answer: The bowl pushes aside more water, so the upthrust is bigger
    difficulty: 3
    hints:
    - Its mass hasn't changed.
    - What changed is its shape.
