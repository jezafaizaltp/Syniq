# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 2. Format: content/README.md.
subject: cbse8-sci
chapter: 2
title: 'The Invisible Living World: Beyond Our Naked Eye'
concepts:
- code: cbse8s.micro.cells
  title: Cells and the microorganisms around us
  notes: |
    All living things are made of cells, seen with a microscope (first observed by Robert Hooke in cork).
    A cell has a cell membrane, cytoplasm and a nucleus; plant cells also have a cell wall and chloroplasts.
    Microorganisms (microbes) are too small to see with the naked eye: bacteria (single cells without a
    nucleus), fungi (yeast, moulds), protozoa (amoeba), algae and viruses (which reproduce only inside living
    cells). Microbes live in soil, water, air and inside our bodies.
  explanations:
    text: 'Every living thing is made of tiny units called cells. Some living things are just one cell, so small you need a microscope to see them: these are microorganisms, such as bacteria, yeast and amoeba. Viruses are even smaller and can only multiply inside other living cells.'
    visual: 'Draw two boxes: an animal cell (round, with membrane, cytoplasm and nucleus) and a plant cell (box-shaped, with an extra cell wall and green chloroplasts).'
    step_by_step: 'Step 1: Every living thing is made of cells. Step 2: Cells have a membrane, cytoplasm and a nucleus. Step 3: Plant cells add a cell wall and chloroplasts. Step 4: Microbes are tiny living things: bacteria, fungi, protozoa and algae. Step 5: Viruses need a living cell to multiply.'
    real_world: A drop of pond water under a microscope is full of moving protozoa and green algae, a whole world invisible to the naked eye.
  picture:
    kind: compare
    columns:
    - title: Plant cell
      points:
      - Cell wall
      - Chloroplasts
      - Large vacuole
      - Nucleus
    - title: Animal cell
      points:
      - No cell wall
      - No chloroplasts
      - Small vacuoles
      - Nucleus
    alt: 'Comparing plant and animal cells: plant cells have a cell wall, chloroplasts and a large vacuole; both have a nucleus.'
    caption: Both have a nucleus, membrane and cytoplasm; plant cells add a wall and chloroplasts.
  activity:
    type: sort
    prompt: Which group of microorganism is it?
    bins:
    - Bacteria
    - Fungi
    - Protozoa
    - Algae
    - Viruses
    items:
    - label: Lactobacillus, which sets curd
      bin: Bacteria
      clue: Single cells with no nucleus, turning milk sour.
      why: A bacterium.
    - label: Rhizobium in pea root nodules
      bin: Bacteria
      clue: It fixes nitrogen for the plant. Which group?
      why: A bacterium.
    - label: Yeast, which makes dough rise
      bin: Fungi
      clue: A single-celled organism that also makes bread and idli batter rise.
      why: Yeast is a fungus.
    - label: Bread mould
      bin: Fungi
      clue: Fuzzy threads with tiny dark spore heads.
      why: A fungus.
    - label: Amoeba
      bin: Protozoa
      clue: One cell that moves by changing its shape.
      why: A protozoan.
    - label: Paramecium
      bin: Protozoa
      clue: A slipper-shaped cell covered in tiny hairs.
      why: A protozoan.
    - label: Chlamydomonas
      bin: Algae
      clue: Green, single-celled, makes its own food.
      why: An alga.
    - label: Spirogyra, green threads in ponds
      bin: Algae
      clue: Green and makes food by photosynthesis.
      why: An alga.
    - label: The germ that causes the common cold
      bin: Viruses
      clue: It can only multiply inside another living cell.
      why: A virus.
    - label: The germ that causes polio
      bin: Viruses
      clue: Smaller than any cell; reproduces only in a host.
      why: A virus.
  items:
  - prompt: What are all living things made of?
    options:
    - Cells
    - Atoms only
    - Bacteria
    - Water
    answer: Cells
    difficulty: 1
    hints:
    - The basic unit of life.
    - Seen with a microscope.
    solution: Cells are the basic units of all living things.
  - prompt: Which part is found in plant cells but not animal cells?
    options:
    - Cell wall
    - Nucleus
    - Cytoplasm
    - Cell membrane
    answer: Cell wall
    difficulty: 1
    hints:
    - Plant cells are box-shaped.
    - Something stiff around the outside.
    solution: Plant cells have a rigid cell wall outside the membrane; animal cells don't.
  - prompt: Which microbe can multiply only inside a living cell?
    options:
    - Virus
    - Bacterium
    - Yeast
    - Amoeba
    answer: Virus
    difficulty: 2
    hints:
    - It isn't a full cell.
    - It needs a host.
    solution: Viruses reproduce only inside living host cells.
  - prompt: Who first saw cells, in a thin slice of cork?
    options:
    - Robert Hooke
    - Alexander Fleming
    - Isaac Newton
    - C. V. Raman
    answer: Robert Hooke
    difficulty: 2
    hints:
    - In 1665.
    - He named them cells.
    solution: Robert Hooke saw tiny compartments in cork in 1665 and called them cells.
  - prompt: Yeast and bread mould belong to which group of microbes?
    options:
    - Fungi
    - Bacteria
    - Protozoa
    - Viruses
    answer: Fungi
    difficulty: 1
    hints:
    - Mushrooms are in this group too.
    - F...
    solution: Yeast and moulds are fungi.
  - prompt: Which part of a cell controls its activities?
    options:
    - Nucleus
    - Cell wall
    - Vacuole
    - Cytoplasm
    answer: Nucleus
    difficulty: 1
    hints:
    - The control centre.
    - It holds the genetic material.
    solution: The nucleus controls the cell's activities and holds its genetic material.
- code: cbse8s.micro.uses
  title: Friendly and harmful microbes
  after:
  - cbse8s.micro.cells
  notes: |
    Useful microbes: Lactobacillus turns milk into curd; yeast ferments sugar, releasing carbon dioxide that
    makes dough rise (and producing alcohol); Rhizobium in legume root nodules fixes nitrogen; decomposers
    recycle nutrients; antibiotics such as penicillin (discovered by Alexander Fleming in 1928) come from
    microbes; vaccines are made from weakened or killed microbes. Harmful microbes cause diseases (cholera,
    typhoid, TB, malaria, COVID-19) and spoil food. Food is preserved by heating, cooling, drying, salting,
    sugaring and pasteurisation.
  explanations:
    text: 'Most microbes are harmless and many are helpful: bacteria turn milk into curd, yeast makes idli batter and bread rise, and soil bacteria feed plants. Some microbes cause diseases or spoil food, which is why we cook, refrigerate and preserve food.'
    visual: 'Draw a T-chart: on the ''friends'' side curd, bread, medicine (penicillin) and soil nitrogen; on the ''harmful'' side diseases and food spoilage, with arrows to ways of preventing them.'
    step_by_step: 'Step 1: Ask what the microbe does. Step 2: If it makes food, medicine or helps soil, it is useful. Step 3: If it causes disease or spoils food, it is harmful. Step 4: Harmful microbes are controlled by hygiene, vaccines and preservation.'
    real_world: Leftover rice turns sour in a hot kitchen overnight because microbes multiply fast in warmth; in a fridge they slow down and the rice stays fresh.
  picture:
    kind: compare
    columns:
    - title: Friendly microbes
      points:
      - Curd (Lactobacillus)
      - Bread and idli (yeast)
      - Nitrogen for crops (Rhizobium)
      - Penicillin and vaccines
    - title: Harmful microbes
      points:
      - Diseases like cholera and TB
      - Food spoilage
      - Plant diseases
      - Controlled by hygiene and preservation
    alt: Friendly microbes make curd, bread, nitrogen and medicines; harmful microbes cause diseases and spoil food.
    caption: Most microbes help us; a few harm us.
  activity:
    type: sort
    prompt: Is the microbe helping or harming here?
    bins:
    - Helpful
    - Harmful
    items:
    - label: Bacteria turning milk into curd
      bin: Helpful
      clue: Do we want this to happen?
      why: We use it to make curd.
    - label: Yeast making idli batter rise
      bin: Helpful
      clue: Is this something we rely on in the kitchen?
      why: Fermentation makes the batter soft.
    - label: Rhizobium in pea roots
      bin: Helpful
      clue: It adds nitrogen to the soil. Good or bad for crops?
      why: It feeds the plant.
    - label: Microbes turning kitchen waste into compost
      bin: Helpful
      clue: They break down waste into manure.
      why: Decomposers recycle nutrients.
    - label: Penicillin made from a mould
      bin: Helpful
      clue: It kills disease bacteria.
      why: An antibiotic.
    - label: Bacteria causing cholera from dirty water
      bin: Harmful
      clue: It makes people ill.
      why: A disease-causing microbe.
    - label: Fungus spoiling bread
      bin: Harmful
      clue: Would you eat it?
      why: Food spoilage.
    - label: The protozoan that causes malaria
      bin: Harmful
      clue: Spread by mosquitoes, it makes people very ill.
      why: A parasite.
    - label: A fungus causing rust on wheat
      bin: Harmful
      clue: It damages the crop.
      why: A plant disease.
  items:
  - prompt: Which microbe turns milk into curd?
    options:
    - Lactobacillus
    - Yeast
    - Rhizobium
    - Amoeba
    answer: Lactobacillus
    difficulty: 1
    hints:
    - A bacterium.
    - Lacto- means milk.
    solution: Lactobacillus bacteria ferment milk sugar into curd.
  - prompt: Why does bread dough rise when yeast is added?
    options:
    - Yeast releases carbon dioxide gas
    - Yeast adds water
    - Yeast heats the dough
    - Yeast removes air
    answer: Yeast releases carbon dioxide gas
    difficulty: 2
    hints:
    - Yeast ferments sugar.
    - A gas forms bubbles.
    solution: Yeast ferments sugar and gives off carbon dioxide, whose bubbles make the dough rise.
  - prompt: Who discovered penicillin?
    options:
    - Alexander Fleming
    - Louis Pasteur
    - Robert Hooke
    - Edward Jenner
    answer: Alexander Fleming
    difficulty: 1
    hints:
    - '1928.'
    - A mould killed bacteria on his dish.
    solution: Alexander Fleming discovered penicillin in 1928.
  - prompt: Which bacterium in legume root nodules adds nitrogen to soil?
    options:
    - Rhizobium
    - Lactobacillus
    - Yeast
    - Plasmodium
    answer: Rhizobium
    difficulty: 2
    hints:
    - Found in pea and bean roots.
    - R...
    solution: Rhizobium in root nodules fixes atmospheric nitrogen for the plant.
  - prompt: Why does food last longer in a refrigerator?
    options:
    - Cold slows the growth of microbes
    - Cold kills all microbes
    - The fridge adds salt
    - Light is kept out
    answer: Cold slows the growth of microbes
    difficulty: 2
    hints:
    - Microbes multiply fast when warm.
    - Cold doesn't kill most.
    solution: Low temperatures slow microbial growth, so food spoils more slowly.
  - prompt: Which disease is caused by a microbe?
    options:
    - Tuberculosis
    - Diabetes
    - Night blindness
    - A broken bone
    answer: Tuberculosis
    difficulty: 1
    hints:
    - Which one spreads from person to person?
    - It is caused by bacteria.
    solution: TB is caused by a bacterium; the others are not infections.
