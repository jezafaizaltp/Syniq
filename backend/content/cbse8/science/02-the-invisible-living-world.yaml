# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 2. Format: content/README.md.
subject: cbse8-sci
chapter: 2
title: 'The Invisible Living World: Beyond Our Naked Eye'
tips:
  t8_cells_basic: "Every living thing, from bacteria to whales, is built from tiny units. What are they?"
  t8_cold_slows: "Food in the fridge still goes bad after many days. Does cold kill microbes or just slow them?"
  t8_fleming: "Penicillin came from mould on a culture plate in 1928. Jenner worked on vaccines."
  t8_fungi: "Yeast and moulds have no chlorophyll and grow on food. Which group are they?"
  t8_hooke: "Hooke looked at cork through his microscope in 1665. Fleming discovered penicillin much later."
  t8_infectious: "Which illness is caught from a germ? The others come from diet, the body or injury."
  t8_lactobacillus: "Curd is made by bacteria. Yeast is a fungus; Rhizobium lives in root nodules."
  t8_nucleus_control: "Which part holds the instructions and controls the cell?"
  t8_plant_cell: "Plant cells are boxy and stiff. Which outer layer makes them so?"
  t8_rhizobium: "Which bacterium lives in bumps on the roots of beans and peas?"
  t8_virus_host: "Which microbe is not even a cell and can multiply only inside another cell?"
  t8_yeast_co2: "Look at the holes in bread. Which gas made those bubbles?"
  c8s2_groups: 'Recall what makes each group special: how it feeds, whether it moves, and what is inside its cell.'
  c8s2_parts: 'Think about what each part does: which one controls, which one lets things in and out, which one makes food?'
  c8s2_plant_only: Which parts help a plant stay stiff and make its own food? Animals don't need those.
  c8s2_microscope: Microbes are too small for the naked eye. What instrument makes tiny things look bigger?
  c8s2_useful: 'Think of the kitchen and the farm: which microbe helps make food or feed the soil?'
  c8s2_harmful: 'Some microbes help and some make living things ill. ''Patho-'' means suffering: which choice is about illness?'
  c8s2_preserve: Microbes need warmth, water and food to grow. Which method takes one of those away?

concepts:
- code: cbse8s.micro.cells
  title: Cells and the microorganisms around us
  notes: |
    All living things are made of cells, seen with a microscope (first observed by Robert Hooke in cork).
    A cell has a cell membrane, cytoplasm and a nucleus; plant cells also have a cell wall and chloroplasts.
    Microorganisms (microbes) are too small to see with the naked eye: bacteria (single cells without a
    nucleus), fungi (yeast, moulds), protozoa (amoeba), algae and viruses (which reproduce only inside living
    cells). Microbes live in soil, water, air and inside our bodies.
  explanations:
    text: 'Every living thing is made of tiny units called cells. Some living things are just one cell, so small you need a microscope to see them: these are microorganisms, such as bacteria, yeast and amoeba. Viruses are even smaller and can only multiply inside other living cells.'
    visual: 'Draw two boxes: an animal cell (round, with membrane, cytoplasm and nucleus) and a plant cell (box-shaped, with an extra cell wall and green chloroplasts).'
    step_by_step: 'Step 1: Every living thing is made of cells. Step 2: Cells have a membrane, cytoplasm and a nucleus. Step 3: Plant cells add a cell wall and chloroplasts. Step 4: Microbes are tiny living things: bacteria, fungi, protozoa and algae. Step 5: Viruses need a living cell to multiply.'
    real_world: A drop of pond water under a microscope is full of moving protozoa and green algae, a whole world invisible to the naked eye.
  picture:
    kind: compare
    columns:
    - title: Plant cell
      points:
      - Cell wall
      - Chloroplasts
      - Large vacuole
      - Nucleus
    - title: Animal cell
      points:
      - No cell wall
      - No chloroplasts
      - Small vacuoles
      - Nucleus
    alt: 'Comparing plant and animal cells: plant cells have a cell wall, chloroplasts and a large vacuole; both have a nucleus.'
    caption: Both have a nucleus, membrane and cytoplasm; plant cells add a wall and chloroplasts.
  activity:
    type: sort
    prompt: Which group of microorganism is it?
    bins:
    - Bacteria
    - Fungi
    - Protozoa
    - Algae
    - Viruses
    items:
    - label: Lactobacillus, which sets curd
      bin: Bacteria
      clue: Single cells with no nucleus, turning milk sour.
      why: A bacterium.
    - label: Rhizobium in pea root nodules
      bin: Bacteria
      clue: It fixes nitrogen for the plant. Which group?
      why: A bacterium.
    - label: Yeast, which makes dough rise
      bin: Fungi
      clue: A single-celled organism that also makes bread and idli batter rise.
      why: Yeast is a fungus.
    - label: Bread mould
      bin: Fungi
      clue: Fuzzy threads with tiny dark spore heads.
      why: A fungus.
    - label: Amoeba
      bin: Protozoa
      clue: One cell that moves by changing its shape.
      why: A protozoan.
    - label: Paramecium
      bin: Protozoa
      clue: A slipper-shaped cell covered in tiny hairs.
      why: A protozoan.
    - label: Chlamydomonas
      bin: Algae
      clue: Green, single-celled, makes its own food.
      why: An alga.
    - label: Spirogyra, green threads in ponds
      bin: Algae
      clue: Green and makes food by photosynthesis.
      why: An alga.
    - label: The germ that causes the common cold
      bin: Viruses
      clue: It can only multiply inside another living cell.
      why: A virus.
    - label: The germ that causes polio
      bin: Viruses
      clue: Smaller than any cell; reproduces only in a host.
      why: A virus.
  lesson:
    - teach: All living things are made of cells, the tiny units of life. Robert Hooke first saw cells in a thin slice of cork using a microscope. Some living things are a single cell; we are made of trillions.
      check:
        prompt: What are all living things made of?
        options:
        - Cells
        - Atoms of water only
        - Minerals
        answer: Cells
        why: The cell is the basic unit of every living thing, from bacteria to people.
    - teach: A cell has a cell membrane that controls what goes in and out, jelly-like cytoplasm where its work happens, and a nucleus that controls its activities. Plant cells also have a stiff cell wall and green chloroplasts that make food using sunlight.
      picture:
        kind: compare
        columns:
        - title: Animal cell
          points:
          - Cell membrane
          - Cytoplasm
          - Nucleus
        - title: Plant cell
          points:
          - Cell membrane + cell wall
          - Cytoplasm
          - Nucleus
          - Chloroplasts
        alt: Animal cells have a membrane, cytoplasm and nucleus; plant cells also have a cell wall and chloroplasts.
      check:
        prompt: Which part is found in plant cells but not in animal cells?
        options:
        - Chloroplast
        - Nucleus
        - Cell membrane
        answer: Chloroplast
        why: Chloroplasts make food from sunlight, which only plants do. Both kinds of cell have a nucleus and a membrane.
    - teach: Microorganisms (microbes) are too small to see without a microscope. The main groups are bacteria (single cells with no nucleus), fungi (yeast and moulds), protozoa (single cells such as amoeba), algae (make their own food) and viruses, which can multiply only inside another living cell.
      picture:
        kind: compare
        columns:
        - title: Group
          points:
          - Bacteria
          - Fungi
          - Protozoa
          - Virus
        - title: Example
          points:
          - Lactobacillus
          - Yeast, bread mould
          - Amoeba
          - Flu virus
        alt: 'Groups of microbes with examples: bacteria such as Lactobacillus, fungi such as yeast, protozoa such as amoeba, and viruses such as flu.'
      check:
        prompt: Which microbe can multiply only inside a living cell?
        options:
        - Virus
        - Yeast
        - Amoeba
        answer: Virus
        why: A virus has no cell of its own, so it uses a host cell to make copies of itself.
  items:
  - prompt: What are all living things made of?
    options:
    - Cells
    - Atoms only
    - Bacteria
    - Water
    answer: Cells
    difficulty: 1
    hints:
    - The basic unit of life.
    - Seen with a microscope.
    solution: Cells are the basic units of all living things.
    mistakes: {"Bacteria": "t8_cells_basic", "Water": "t8_cells_basic"}
  - prompt: Which part is found in plant cells but not animal cells?
    options:
    - Cell wall
    - Nucleus
    - Cytoplasm
    - Cell membrane
    answer: Cell wall
    difficulty: 1
    hints:
    - Plant cells are box-shaped.
    - Something stiff around the outside.
    solution: Plant cells have a rigid cell wall outside the membrane; animal cells don't.
    mistakes: {"Nucleus": "t8_plant_cell", "Cell membrane": "t8_plant_cell"}
  - prompt: Which microbe can multiply only inside a living cell?
    options:
    - Virus
    - Bacterium
    - Yeast
    - Amoeba
    answer: Virus
    difficulty: 2
    hints:
    - It isn't a full cell.
    - It needs a host.
    solution: Viruses reproduce only inside living host cells.
    mistakes: {"Bacterium": "t8_virus_host", "Yeast": "t8_virus_host"}
  - prompt: Who first saw cells, in a thin slice of cork?
    options:
    - Robert Hooke
    - Alexander Fleming
    - Isaac Newton
    - C. V. Raman
    answer: Robert Hooke
    difficulty: 2
    hints:
    - In 1665.
    - He named them cells.
    solution: Robert Hooke saw tiny compartments in cork in 1665 and called them cells.
    mistakes: {"Alexander Fleming": "t8_hooke", "C. V. Raman": "t8_hooke"}
  - prompt: Yeast and bread mould belong to which group of microbes?
    options:
    - Fungi
    - Bacteria
    - Protozoa
    - Viruses
    answer: Fungi
    difficulty: 1
    hints:
    - Mushrooms are in this group too.
    - F...
    solution: Yeast and moulds are fungi.
    mistakes: {"Bacteria": "t8_fungi", "Viruses": "t8_fungi"}
  - prompt: Which part of a cell controls its activities?
    options:
    - Nucleus
    - Cell wall
    - Vacuole
    - Cytoplasm
    answer: Nucleus
    difficulty: 1
    hints:
    - The control centre.
    - It holds the genetic material.
    solution: The nucleus controls the cell's activities and holds its genetic material.
    mistakes: {"Cell wall": "t8_nucleus_control", "Vacuole": "t8_nucleus_control"}
  - prompt: Which instrument do we need to see most microbes?
    options:
    - Microscope
    - Telescope
    - Periscope
    answer: Microscope
    difficulty: 1
    hints:
    - Microbes are tiny.
    - A telescope is for far-away things.
    solution: A microscope magnifies tiny things such as cells and microbes.
    mistakes:
      Telescope: c8s2_microscope
      Periscope: c8s2_microscope
  - prompt: What does the cell membrane do?
    options:
    - Controls what goes in and out of the cell
    - Makes food using sunlight
    - Gives the cell its green colour
    answer: Controls what goes in and out of the cell
    difficulty: 1
    hints:
    - It is the cell's outer boundary.
    - Think of a gate.
    solution: 'The membrane is like a gate: it lets some things in and out and keeps others out.'
    mistakes:
      Makes food using sunlight: c8s2_parts
      Gives the cell its green colour: c8s2_parts
  - prompt: Bacteria are different from most other cells because they have no…
    options:
    - Nucleus
    - Cytoplasm
    - Cell membrane
    answer: Nucleus
    difficulty: 2
    hints:
    - Their genetic material floats in the cytoplasm.
    - Which part holds it in other cells?
    solution: A bacterium has no nucleus; its genetic material lies in the cytoplasm.
    mistakes:
      Cytoplasm: c8s2_groups
      Cell membrane: c8s2_groups
  - prompt: Amoeba is an example of which group?
    options:
    - Protozoa
    - Fungi
    - Algae
    answer: Protozoa
    difficulty: 2
    hints:
    - It is a single cell that moves and feeds.
    - It doesn't make its own food.
    solution: Amoeba is a single-celled protozoan that moves using false feet.
    mistakes:
      Fungi: c8s2_groups
      Algae: c8s2_groups
  - prompt: Which group of microbes makes its own food using sunlight?
    options:
    - Algae
    - Viruses
    - Fungi
    answer: Algae
    difficulty: 2
    hints:
    - They are green.
    - They have chloroplasts, like plants.
    solution: Algae contain chlorophyll and make food by photosynthesis.
    mistakes:
      Viruses: c8s2_groups
      Fungi: c8s2_groups
  - prompt: What does the cell wall give a plant cell?
    options:
    - Strength and a fixed shape
    - The power to move
    - Its genetic material
    answer: Strength and a fixed shape
    difficulty: 2
    hints:
    - It is stiff.
    - Plants have no skeleton.
    solution: The stiff cell wall keeps a plant cell's shape and makes the plant strong.
    mistakes:
      The power to move: c8s2_plant_only
      Its genetic material: c8s2_parts
  - prompt: Where does most of a cell's work happen?
    options:
    - In the cytoplasm
    - In the cell wall
    - Outside the cell
    answer: In the cytoplasm
    difficulty: 2
    hints:
    - It is the jelly-like part inside.
    - The other parts sit in it.
    solution: The cytoplasm is the jelly in which the cell's activities take place.
    mistakes:
      In the cell wall: c8s2_parts
      Outside the cell: c8s2_parts
  - prompt: Why is a virus not counted as a fully living thing on its own?
    options:
    - It can't do anything outside a living cell
    - It is too big
    - It makes its own food
    answer: It can't do anything outside a living cell
    difficulty: 3
    hints:
    - Can a virus grow or multiply alone?
    - It needs a host.
    solution: Outside a cell a virus does nothing; it only multiplies inside a host cell.
    mistakes:
      It is too big: t8_virus_host
      It makes its own food: t8_virus_host
  - prompt: Bread left in a damp place grows fluffy patches. What are they?
    options:
    - Mould, a fungus
    - Algae
    - Protozoa
    answer: Mould, a fungus
    difficulty: 1
    hints:
    - They grow on food.
    - Yeast is in the same group.
    solution: Bread mould is a fungus. It grows on damp food.
    mistakes:
      Algae: c8s2_groups
      Protozoa: c8s2_groups
- code: cbse8s.micro.uses
  title: Friendly and harmful microbes
  after:
  - cbse8s.micro.cells
  notes: |
    Useful microbes: Lactobacillus turns milk into curd; yeast ferments sugar, releasing carbon dioxide that
    makes dough rise (and producing alcohol); Rhizobium in legume root nodules fixes nitrogen; decomposers
    recycle nutrients; antibiotics such as penicillin (discovered by Alexander Fleming in 1928) come from
    microbes; vaccines are made from weakened or killed microbes. Harmful microbes cause diseases (cholera,
    typhoid, TB, malaria, COVID-19) and spoil food. Food is preserved by heating, cooling, drying, salting,
    sugaring and pasteurisation.
  explanations:
    text: 'Most microbes are harmless and many are helpful: bacteria turn milk into curd, yeast makes idli batter and bread rise, and soil bacteria feed plants. Some microbes cause diseases or spoil food, which is why we cook, refrigerate and preserve food.'
    visual: 'Draw a T-chart: on the ''friends'' side curd, bread, medicine (penicillin) and soil nitrogen; on the ''harmful'' side diseases and food spoilage, with arrows to ways of preventing them.'
    step_by_step: 'Step 1: Ask what the microbe does. Step 2: If it makes food, medicine or helps soil, it is useful. Step 3: If it causes disease or spoils food, it is harmful. Step 4: Harmful microbes are controlled by hygiene, vaccines and preservation.'
    real_world: Leftover rice turns sour in a hot kitchen overnight because microbes multiply fast in warmth; in a fridge they slow down and the rice stays fresh.
  picture:
    kind: compare
    columns:
    - title: Friendly microbes
      points:
      - Curd (Lactobacillus)
      - Bread and idli (yeast)
      - Nitrogen for crops (Rhizobium)
      - Penicillin and vaccines
    - title: Harmful microbes
      points:
      - Diseases like cholera and TB
      - Food spoilage
      - Plant diseases
      - Controlled by hygiene and preservation
    alt: Friendly microbes make curd, bread, nitrogen and medicines; harmful microbes cause diseases and spoil food.
    caption: Most microbes help us; a few harm us.
  activity:
    type: sort
    prompt: Is the microbe helping or harming here?
    bins:
    - Helpful
    - Harmful
    items:
    - label: Bacteria turning milk into curd
      bin: Helpful
      clue: Do we want this to happen?
      why: We use it to make curd.
    - label: Yeast making idli batter rise
      bin: Helpful
      clue: Is this something we rely on in the kitchen?
      why: Fermentation makes the batter soft.
    - label: Rhizobium in pea roots
      bin: Helpful
      clue: It adds nitrogen to the soil. Good or bad for crops?
      why: It feeds the plant.
    - label: Microbes turning kitchen waste into compost
      bin: Helpful
      clue: They break down waste into manure.
      why: Decomposers recycle nutrients.
    - label: Penicillin made from a mould
      bin: Helpful
      clue: It kills disease bacteria.
      why: An antibiotic.
    - label: Bacteria causing cholera from dirty water
      bin: Harmful
      clue: It makes people ill.
      why: A disease-causing microbe.
    - label: Fungus spoiling bread
      bin: Harmful
      clue: Would you eat it?
      why: Food spoilage.
    - label: The protozoan that causes malaria
      bin: Harmful
      clue: Spread by mosquitoes, it makes people very ill.
      why: A parasite.
    - label: A fungus causing rust on wheat
      bin: Harmful
      clue: It damages the crop.
      why: A plant disease.
  lesson:
    - teach: Many microbes are friends. Lactobacillus bacteria turn milk into curd. Yeast eats sugar and gives out carbon dioxide, which makes dough rise and idli batter puff up. Rhizobium in the root nodules of peas and beans adds nitrogen to the soil.
      picture:
        kind: compare
        columns:
        - title: Microbe
          points:
          - Lactobacillus
          - Yeast
          - Rhizobium
        - title: Helps us by
          points:
          - Milk → curd
          - Dough rises (CO₂)
          - Adds nitrogen to soil
        alt: Lactobacillus turns milk into curd, yeast makes dough rise, and Rhizobium adds nitrogen to soil.
      check:
        prompt: Why does idli batter rise overnight?
        options:
        - Microbes give out carbon dioxide gas
        - Water evaporates
        - It gets colder
        answer: Microbes give out carbon dioxide gas
        why: Microbes ferment the batter and release CO₂ bubbles, which make it rise.
    - teach: 'Decomposer microbes break down dead plants and animals and return nutrients to the soil. Medicines also come from microbes: Alexander Fleming discovered penicillin, the first antibiotic, from a mould in 1928. Vaccines use weakened or dead germs to train the body.'
      check:
        prompt: What do decomposers do?
        options:
        - Break down dead things and return nutrients to the soil
        - Make food from sunlight
        - Cause all diseases
        answer: Break down dead things and return nutrients to the soil
        why: Without decomposers, dead matter would pile up and soil would lose its nutrients.
    - teach: 'Some microbes are harmful. Microbes that cause disease are pathogens: bacteria cause TB and typhoid, viruses cause flu and measles, protozoa cause malaria. Microbes also spoil food. Cooling, drying, salting, sugaring and boiling keep food safe by slowing or killing them.'
      picture:
        kind: compare
        columns:
        - title: Keep food by
          points:
          - Refrigerating
          - Drying
          - Salt or sugar
          - Boiling
        - title: Because
          points:
          - Cold slows microbes
          - Microbes need water
          - Draws water out
          - Heat kills microbes
        alt: Refrigerating slows microbes, drying and salting take away water, and boiling kills them.
      check:
        prompt: Why are pickles made with lots of salt or oil?
        options:
        - They stop microbes from growing
        - They make the pickle cold
        - They add vitamins
        answer: They stop microbes from growing
        why: Salt draws water out, and oil keeps air away, so microbes can't grow.
  items:
  - prompt: Which microbe turns milk into curd?
    options:
    - Lactobacillus
    - Yeast
    - Rhizobium
    - Amoeba
    answer: Lactobacillus
    difficulty: 1
    hints:
    - A bacterium.
    - Lacto- means milk.
    solution: Lactobacillus bacteria ferment milk sugar into curd.
    mistakes: {"Yeast": "t8_lactobacillus", "Rhizobium": "t8_lactobacillus"}
  - prompt: Why does bread dough rise when yeast is added?
    options:
    - Yeast releases carbon dioxide gas
    - Yeast adds water
    - Yeast heats the dough
    - Yeast removes air
    answer: Yeast releases carbon dioxide gas
    difficulty: 2
    hints:
    - Yeast ferments sugar.
    - A gas forms bubbles.
    solution: Yeast ferments sugar and gives off carbon dioxide, whose bubbles make the dough rise.
    mistakes: {"Yeast adds water": "t8_yeast_co2", "Yeast heats the dough": "t8_yeast_co2"}
  - prompt: Who discovered penicillin?
    options:
    - Alexander Fleming
    - Louis Pasteur
    - Robert Hooke
    - Edward Jenner
    answer: Alexander Fleming
    difficulty: 1
    hints:
    - '1928.'
    - A mould killed bacteria on his dish.
    solution: Alexander Fleming discovered penicillin in 1928.
    mistakes: {"Robert Hooke": "t8_fleming", "Edward Jenner": "t8_fleming"}
  - prompt: Which bacterium in legume root nodules adds nitrogen to soil?
    options:
    - Rhizobium
    - Lactobacillus
    - Yeast
    - Plasmodium
    answer: Rhizobium
    difficulty: 2
    hints:
    - Found in pea and bean roots.
    - R...
    solution: Rhizobium in root nodules fixes atmospheric nitrogen for the plant.
    mistakes: {"Lactobacillus": "t8_rhizobium", "Plasmodium": "t8_rhizobium"}
  - prompt: Why does food last longer in a refrigerator?
    options:
    - Cold slows the growth of microbes
    - Cold kills all microbes
    - The fridge adds salt
    - Light is kept out
    answer: Cold slows the growth of microbes
    difficulty: 2
    hints:
    - Microbes multiply fast when warm.
    - Cold doesn't kill most.
    solution: Low temperatures slow microbial growth, so food spoils more slowly.
    mistakes: {"Cold kills all microbes": "t8_cold_slows", "The fridge adds salt": "t8_cold_slows"}
  - prompt: Which disease is caused by a microbe?
    options:
    - Tuberculosis
    - Diabetes
    - Night blindness
    - A broken bone
    answer: Tuberculosis
    difficulty: 1
    hints:
    - Which one spreads from person to person?
    - It is caused by bacteria.
    solution: TB is caused by a bacterium; the others are not infections.
    mistakes: {"Diabetes": "t8_infectious", "Night blindness": "t8_infectious"}
  - prompt: Which microbe is used to make bread and cakes rise?
    options:
    - Yeast
    - Rhizobium
    - Lactobacillus
    answer: Yeast
    difficulty: 1
    hints:
    - It is a fungus.
    - It gives out carbon dioxide.
    solution: Yeast ferments sugar and gives out CO₂, which makes dough rise.
    mistakes:
      Rhizobium: t8_yeast_co2
      Lactobacillus: t8_yeast_co2
  - prompt: Which gas makes dough rise?
    options:
    - Carbon dioxide
    - Oxygen
    - Nitrogen
    answer: Carbon dioxide
    difficulty: 1
    hints:
    - Yeast gives it out when it feeds on sugar.
    - It is the gas we breathe out.
    solution: Yeast releases carbon dioxide bubbles, which make dough light and spongy.
    mistakes:
      Oxygen: t8_yeast_co2
      Nitrogen: t8_yeast_co2
  - prompt: Why do farmers grow peas or beans between other crops?
    options:
    - Bacteria in their roots add nitrogen to the soil
    - They keep insects away
    - They need no water
    answer: Bacteria in their roots add nitrogen to the soil
    difficulty: 2
    hints:
    - Look at their root nodules.
    - Rhizobium lives there.
    solution: Rhizobium in the root nodules of legumes fixes nitrogen, so the soil gets richer.
    mistakes:
      They keep insects away: t8_rhizobium
      They need no water: t8_rhizobium
  - prompt: What is an antibiotic?
    options:
    - A medicine that kills or stops bacteria
    - A vaccine against viruses
    - A food preservative
    answer: A medicine that kills or stops bacteria
    difficulty: 2
    hints:
    - Penicillin was the first.
    - It works against bacteria, not viruses.
    solution: Antibiotics such as penicillin kill bacteria or stop them growing. They don't work against viruses.
    mistakes:
      A vaccine against viruses: t8_fleming
      A food preservative: t8_fleming
  - prompt: Which disease is caused by a protozoan?
    options:
    - Malaria
    - Tuberculosis
    - Measles
    answer: Malaria
    difficulty: 2
    hints:
    - It is spread by mosquitoes.
    - TB is caused by bacteria, measles by a virus.
    solution: Malaria is caused by the protozoan Plasmodium, spread by mosquitoes.
    mistakes:
      Tuberculosis: c8s2_harmful
      Measles: c8s2_harmful
  - prompt: Why does food go bad faster in summer?
    options:
    - Microbes grow faster when it is warm
    - Food dries out
    - There is more sunlight
    answer: Microbes grow faster when it is warm
    difficulty: 1
    hints:
    - Microbes like warmth.
    - A fridge does the opposite.
    solution: Warmth helps microbes multiply, so food spoils faster. Cold slows them.
    mistakes:
      Food dries out: t8_cold_slows
      There is more sunlight: t8_cold_slows
  - prompt: Which way of keeping food works by killing microbes with heat?
    options:
    - Boiling milk
    - Drying fish
    - Keeping fruit in a fridge
    answer: Boiling milk
    difficulty: 2
    hints:
    - Which method uses high temperature?
    - The fridge only slows microbes.
    solution: Boiling kills most microbes. Drying takes away water; the fridge slows microbes.
    mistakes:
      Drying fish: c8s2_preserve
      Keeping fruit in a fridge: c8s2_preserve
  - prompt: What would happen if there were no decomposers?
    options:
    - Dead plants and animals would pile up and soil would lose nutrients
    - Plants would grow faster
    - There would be no diseases at all
    answer: Dead plants and animals would pile up and soil would lose nutrients
    difficulty: 3
    hints:
    - What do decomposers break down?
    - Where do the nutrients go?
    solution: Decomposers recycle dead matter into nutrients. Without them, waste would build up and soil would become poor.
    mistakes:
