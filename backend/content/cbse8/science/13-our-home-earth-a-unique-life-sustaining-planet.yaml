# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 13. Format: content/README.md.
subject: cbse8-sci
chapter: 13
title: 'Our Home: Earth, a Unique Life-Sustaining Planet'
tips:
  t8_biosphere: "Bio = life. Litho = rock, hydro = water, atmo = air."
  t8_co2_fuels: "Burning coal, petrol or wood gives off which gas?"
  t8_greenhouse_name: "A greenhouse is a glass house that stays warm inside. What do the gases do that the glass does?"
  t8_greenhouse_needed: "The greenhouse effect keeps some heat in. Without it, would Earth be warmer or colder?"
  t8_habitable: "Life as we know it needs liquid water. What does a 'habitable zone' allow?"
  t8_lithosphere: "Litho means stone. Which sphere is rocks and soil?"
  t8_magnetic_shield: "Charged particles are pushed aside by a magnetic field. Does Earth have one?"
  t8_mars_cold: "Mars is further out than Earth and its air is very thin. What do both do to its temperature?"
  t8_ozone_uv: "The ozone layer high up absorbs a harmful kind of sunlight that causes sunburn."
  t8_reduce_co2: "Which choice avoids burning fuel?"
  t8_trees_co2: "Trees use one gas from the air to make food. Which gas?"
  t8_warming_effects: "Warming melts ice. Where does melted ice water go, and what does that do to sea level?"
  c8s13_spheres: Litho = rock, hydro = water, atmo = air, bio = life. Match the word to what it is made of.
  c8s13_life_needs: Life as we know it needs liquid water, the right temperature, air and protection from harmful rays.
  c8s13_too_close: 'Think about distance from the Sun: too close is too hot, too far is too cold for liquid water.'
  c8s13_trap: Greenhouse gases let sunlight in but trap some of the heat going out. More of them means more heat kept.
  c8s13_sources: Which activity burns coal, petrol or wood, or clears forests?
  c8s13_actions: Which choice burns less fuel or keeps more trees?

concepts:
- code: cbse8s.earth.unique
  title: What makes Earth able to support life
  notes: |
    Earth is the only planet known to have life. It lies in the Sun's habitable zone, where it is neither too
    hot nor too cold for liquid water. It has liquid water, an atmosphere with oxygen and carbon dioxide, an
    ozone layer that blocks harmful ultraviolet rays, and a magnetic field that shields it from charged
    particles from the Sun. Its four spheres interact: lithosphere (rock and soil), hydrosphere (water),
    atmosphere (air) and biosphere (living things).
  explanations:
    text: Earth is special because it is at just the right distance from the Sun for water to stay liquid. It also has air to breathe, an ozone layer that blocks harmful sunlight and a magnetic field that acts like a shield. Land, water, air and life all work together.
    visual: 'Draw the Sun with three rings around it: an inner red ''too hot'' ring (Venus), a green ''just right'' ring (Earth) and an outer blue ''too cold'' ring (Mars).'
    step_by_step: 'Step 1: Liquid water needs the right temperature: the habitable zone. Step 2: An atmosphere provides oxygen and keeps the planet warm. Step 3: The ozone layer filters harmful UV. Step 4: Land, water, air and life interact as the four spheres.'
    real_world: Venus is closer to the Sun and wrapped in thick carbon dioxide, so its surface is hotter than an oven; Mars is colder and has almost no atmosphere. Only Earth is just right.
  picture:
    kind: compare
    columns:
    - title: Venus
      points:
      - Too hot (about 465 °C)
      - Thick CO₂ atmosphere
      - No liquid water
    - title: Earth
      points:
      - Just right (about 15 °C average)
      - Air with oxygen
      - Liquid water, life
    - title: Mars
      points:
      - Too cold (about −60 °C)
      - Very thin atmosphere
      - Ice, no liquid water at the surface
    alt: Venus is too hot with a thick carbon dioxide atmosphere, Mars too cold with thin air, and Earth just right with liquid water and life.
    caption: Earth sits in the habitable zone.
  activity:
    type: sort
    prompt: Which feature of the Earth does this describe?
    bins:
    - Distance from the Sun
    - Atmosphere
    - Ozone layer
    - Magnetic field
    items:
    - label: Water stays liquid, neither boiling nor frozen
      bin: Distance from the Sun
      clue: Venus is too hot, Mars too cold. Why is Earth right?
      why: Just the right distance.
    - label: Not too hot, not too cold for life
      bin: Distance from the Sun
      clue: What sets how much sunlight reaches us?
      why: Our place around the Sun.
    - label: Gives us oxygen to breathe
      bin: Atmosphere
      clue: The air around the Earth.
      why: The atmosphere.
    - label: Burns up most small meteors
      bin: Atmosphere
      clue: Rocks from space heat up rubbing through the air.
      why: The atmosphere.
    - label: Blocks most harmful ultraviolet rays
      bin: Ozone layer
      clue: A thin layer high up.
      why: Ozone absorbs UV.
    - label: Thinned by CFCs from old fridges
      bin: Ozone layer
      clue: A gas layer damaged by chemicals.
      why: Ozone.
    - label: Turns aside charged particles from the Sun
      bin: Magnetic field
      clue: An invisible shield from the Earth's core.
      why: The magnetic field.
    - label: Makes a compass needle point north
      bin: Magnetic field
      clue: What does a compass respond to?
      why: The magnetic field.
  lesson:
    - teach: Earth is the only planet known to have life. It lies in the Sun's habitable zone, not too hot and not too cold, so water stays liquid. Venus, closer to the Sun, is scorching; Mars, farther away, is freezing.
      picture:
        kind: compare
        columns:
        - title: Venus
          points:
          - Closer to the Sun
          - Far too hot
        - title: Earth
          points:
          - Just right
          - Liquid water
        - title: Mars
          points:
          - Farther away
          - Too cold, thin air
        alt: Venus is too hot, Earth is just right for liquid water, and Mars is too cold.
      check:
        prompt: What is special about Earth's distance from the Sun?
        options:
        - It lets water stay liquid
        - It is the closest planet
        - It is the farthest planet
        answer: It lets water stay liquid
        why: Earth is in the habitable zone, where temperatures allow liquid water.
    - teach: 'Earth has four connected spheres: the lithosphere (rocks and soil), the hydrosphere (all water), the atmosphere (air) and the biosphere (all living things). Life exists where the other three meet.'
      picture:
        kind: compare
        columns:
        - title: Sphere
          points:
          - Lithosphere
          - Hydrosphere
          - Atmosphere
          - Biosphere
        - title: Made of
          points:
          - Rocks and soil
          - Oceans, rivers, ice
          - Air
          - Living things
        alt: The lithosphere is rock and soil, the hydrosphere water, the atmosphere air, and the biosphere living things.
      check:
        prompt: Oceans, rivers and glaciers belong to which sphere?
        options:
        - Hydrosphere
        - Lithosphere
        - Atmosphere
        answer: Hydrosphere
        why: '''Hydro'' means water; the hydrosphere is all of Earth''s water.'
    - teach: Earth also has shields. The ozone layer high in the atmosphere blocks most harmful ultraviolet rays. Earth's magnetic field turns away charged particles streaming from the Sun. The atmosphere also burns up most small meteors.
      check:
        prompt: What would happen without the ozone layer?
        options:
        - More harmful ultraviolet rays would reach us
        - There would be no rain
        - The Earth would stop turning
        answer: More harmful ultraviolet rays would reach us
        why: Ozone absorbs most of the Sun's UV rays, which harm skin, eyes and living cells.
  items:
  - prompt: What is the habitable zone?
    options:
    - The distance from a star where liquid water can exist
    - The coldest part of space
    - The centre of the Sun
    - The Earth's core
    answer: The distance from a star where liquid water can exist
    difficulty: 1
    hints:
    - Not too hot, not too cold.
    - Water stays liquid.
    solution: The habitable zone is where temperatures allow liquid water.
    mistakes: {"The coldest part of space": "t8_habitable", "The centre of the Sun": "t8_habitable"}
  - prompt: What does the ozone layer do?
    options:
    - Blocks harmful ultraviolet rays
    - Makes rain
    - Produces oxygen for breathing
    - Causes earthquakes
    answer: Blocks harmful ultraviolet rays
    difficulty: 1
    hints:
    - High in the atmosphere.
    - UV protection.
    solution: The ozone layer absorbs most of the Sun's harmful UV radiation.
    mistakes: {"Makes rain": "t8_ozone_uv", "Produces oxygen for breathing": "t8_ozone_uv"}
  - prompt: Which sphere includes all living things?
    options:
    - Biosphere
    - Lithosphere
    - Hydrosphere
    - Atmosphere
    answer: Biosphere
    difficulty: 1
    hints:
    - Bio means life.
    - Plants, animals, microbes.
    solution: The biosphere is the part of Earth where life exists.
    mistakes: {"Lithosphere": "t8_biosphere", "Hydrosphere": "t8_biosphere"}
  - prompt: Which sphere is made of rocks and soil?
    options:
    - Lithosphere
    - Hydrosphere
    - Biosphere
    - Atmosphere
    answer: Lithosphere
    difficulty: 2
    hints:
    - Litho means stone.
    - The solid crust.
    solution: The lithosphere is Earth's rocky outer layer.
    mistakes: {"Hydrosphere": "t8_lithosphere", "Biosphere": "t8_lithosphere"}
  - prompt: Why is Mars too cold for liquid water at its surface?
    options:
    - It is farther from the Sun and has a very thin atmosphere
    - It is closer to the Sun
    - It is made of ice
    - It has too much water
    answer: It is farther from the Sun and has a very thin atmosphere
    difficulty: 2
    hints:
    - Distance and air both matter.
    - Thin air holds little heat.
    solution: Mars is farther from the Sun and its thin atmosphere traps little heat.
    mistakes: {"It is closer to the Sun": "t8_mars_cold", "It has too much water": "t8_mars_cold"}
  - prompt: What protects Earth from charged particles from the Sun?
    options:
    - Its magnetic field
    - The Moon
    - Clouds
    - Oceans
    answer: Its magnetic field
    difficulty: 3
    hints:
    - It also causes auroras.
    - Compasses use it.
    solution: Earth's magnetic field deflects charged particles from the Sun.
    mistakes: {"The Moon": "t8_magnetic_shield", "Clouds": "t8_magnetic_shield"}
  - prompt: Which sphere is the air around the Earth?
    options:
    - Atmosphere
    - Hydrosphere
    - Lithosphere
    answer: Atmosphere
    difficulty: 1
    hints:
    - '''Atmo'' means vapour or air.'
    - It is the layer of gases.
    solution: The atmosphere is the layer of air around the Earth.
    mistakes:
      Hydrosphere: c8s13_spheres
      Lithosphere: c8s13_spheres
  - prompt: Why is Venus too hot for life?
    options:
    - It is close to the Sun and has a thick blanket of carbon dioxide
    - It has too much water
    - It has a magnetic field
    answer: It is close to the Sun and has a thick blanket of carbon dioxide
    difficulty: 2
    hints:
    - Think about distance.
    - Its thick air traps heat.
    solution: Venus is closer to the Sun and its thick carbon dioxide atmosphere traps heat, making it scorching.
    mistakes:
      It has too much water: c8s13_too_close
      It has a magnetic field: c8s13_too_close
  - prompt: Which gas in the atmosphere do animals need for breathing?
    options:
    - Oxygen
    - Nitrogen
    - Ozone
    answer: Oxygen
    difficulty: 1
    hints:
    - We breathe it in.
    - Plants release it.
    solution: Animals breathe in oxygen, which plants release during photosynthesis.
    mistakes:
      Nitrogen: c8s13_life_needs
      Ozone: c8s13_life_needs
  - prompt: About what fraction of Earth's surface is covered by water?
    options:
    - About 71%
    - About 10%
    - About 50%
    answer: About 71%
    difficulty: 2
    hints:
    - Seen from space, Earth is mostly blue.
    - It is more than two-thirds.
    solution: About 71% of Earth's surface is water, mostly oceans.
    mistakes:
      About 10%: c8s13_spheres
      About 50%: c8s13_spheres
  - prompt: Why do we use sunscreen and sunglasses on very sunny days?
    options:
    - To protect against ultraviolet rays
    - To keep warm
    - To see in the dark
    answer: To protect against ultraviolet rays
    difficulty: 1
    hints:
    - Some UV still gets through the ozone.
    - It harms skin and eyes.
    solution: Some UV rays still reach us and can harm skin and eyes, so we protect them.
    mistakes:
      To keep warm: t8_ozone_uv
      To see in the dark: t8_ozone_uv
  - prompt: Where is the biosphere found?
    options:
    - Where land, water and air meet and support life
    - Only deep inside the Earth
    - Only in outer space
    answer: Where land, water and air meet and support life
    difficulty: 2
    hints:
    - Living things need soil, water and air.
    - It is a thin layer near the surface.
    solution: The biosphere is the zone where the lithosphere, hydrosphere and atmosphere meet.
    mistakes:
      Only deep inside the Earth: t8_biosphere
      Only in outer space: t8_biosphere
  - prompt: Which of these does NOT help Earth support life?
    options:
    - Craters on the Moon
    - Liquid water
    - The ozone layer
    answer: Craters on the Moon
    difficulty: 2
    hints:
    - Two of these are on Earth and keep life safe.
    - Which one has nothing to do with life here?
    solution: Liquid water and the ozone layer are vital; the Moon's craters don't help life on Earth.
    mistakes:
      Liquid water: c8s13_life_needs
      The ozone layer: c8s13_life_needs
  - prompt: What does Earth's magnetic field do for life?
    options:
    - Turns away charged particles from the Sun
    - Makes the rain fall
    - Holds the oceans in place
    answer: Turns away charged particles from the Sun
    difficulty: 2
    hints:
    - The Sun sends out a stream of charged particles.
    - Auroras near the poles are a sign of it.
    solution: The magnetic field shields Earth from the charged particles of the solar wind.
    mistakes:
      Makes the rain fall: t8_magnetic_shield
      Holds the oceans in place: t8_magnetic_shield
  - prompt: Why do most small meteors never hit the ground?
    options:
    - They burn up in the atmosphere
    - The ozone layer catches them
    - The Moon blocks them
    answer: They burn up in the atmosphere
    difficulty: 3
    hints:
    - They rush through the air very fast.
    - That is what we see as a shooting star.
    solution: 'Friction with the air heats them until they burn up: shooting stars.'
    mistakes:
      The ozone layer catches them: t8_habitable
      The Moon blocks them: t8_habitable
- code: cbse8s.earth.climate
  title: The greenhouse effect and climate change
  after:
  - cbse8s.earth.unique
  notes: |
    Gases such as carbon dioxide, methane and water vapour trap some of the heat the Earth gives off, keeping
    it about 33 °C warmer than it would otherwise be: the natural greenhouse effect. Burning fossil fuels and
    cutting forests add extra greenhouse gases, so the Earth is warming (global warming), causing climate
    change: melting glaciers, rising sea levels, more heatwaves and extreme rain. We can reduce it by saving
    energy, using renewable energy (solar, wind), planting trees and using public transport.
  explanations:
    text: 'Some gases in the air act like a blanket: sunlight passes through, but some of the heat given off by the Earth is trapped. Without this greenhouse effect Earth would be frozen. But burning coal, oil and petrol thickens the blanket, and the planet is heating up.'
    visual: Draw sunlight arrows coming through the atmosphere to the ground, then wavy heat arrows going back up, some escaping to space and some bounced back down by a layer of greenhouse gases. A thicker layer traps more.
    step_by_step: 'Step 1: Sunlight warms the Earth''s surface. Step 2: The warm surface gives off heat. Step 3: Greenhouse gases trap some of it, warming the air. Step 4: More greenhouse gases trap more heat, causing global warming.'
    real_world: Himalayan glaciers that feed the Ganga and other rivers are shrinking as temperatures rise, which threatens water supplies for millions of people.
  picture:
    kind: flow
    steps:
    - Burning coal, oil and petrol
    - More carbon dioxide in the air
    - More heat trapped
    - Earth gets warmer
    - Glaciers melt, seas rise, more heatwaves
    alt: 'How burning fossil fuels leads to climate change: more carbon dioxide traps more heat, the Earth warms, and glaciers melt and seas rise.'
  activity:
    type: sort
    prompt: Does it add greenhouse gases or cut them?
    bins:
    - Adds greenhouse gases
    - Cuts greenhouse gases
    items:
    - label: Burning coal in power stations
      bin: Adds greenhouse gases
      clue: Burning fuel gives off carbon dioxide.
      why: Adds CO₂.
    - label: Petrol cars stuck in traffic
      bin: Adds greenhouse gases
      clue: Engines burn fuel.
      why: Adds CO₂.
    - label: Burning crop stubble
      bin: Adds greenhouse gases
      clue: Smoke and carbon dioxide.
      why: Adds.
    - label: Cutting down forests
      bin: Adds greenhouse gases
      clue: Fewer trees take in CO₂.
      why: More CO₂ stays in the air.
    - label: Planting trees
      bin: Cuts greenhouse gases
      clue: Trees take in carbon dioxide.
      why: They absorb CO₂.
    - label: Cycling to school
      bin: Cuts greenhouse gases
      clue: No fuel burned.
      why: Less CO₂.
    - label: Solar panels on roofs
      bin: Cuts greenhouse gases
      clue: Electricity without burning coal.
      why: Cuts.
    - label: Switching off lights when leaving
      bin: Cuts greenhouse gases
      clue: Less electricity used.
      why: Less coal burned.
  lesson:
    - teach: Gases such as carbon dioxide, methane and water vapour let sunlight in but trap some of the heat the Earth gives off, like the glass of a greenhouse. This natural greenhouse effect keeps Earth about 33 °C warmer than it would be; without it Earth would be mostly frozen.
      picture:
        kind: flow
        steps:
        - Sunlight passes in
        - Earth warms and gives off heat
        - Greenhouse gases trap some heat
        - Earth stays warm
        alt: Sunlight passes in, Earth gives off heat, greenhouse gases trap some of it, and Earth stays warm.
      check:
        prompt: Without any greenhouse effect, Earth would be…
        options:
        - Much colder
        - Much hotter
        - Exactly the same
        answer: Much colder
        why: The trapped heat keeps Earth about 33 °C warmer than it would otherwise be.
    - teach: 'Burning coal, petrol and wood releases extra carbon dioxide, and cutting forests removes trees that take it in. More greenhouse gas traps more heat: global warming. This changes the climate: glaciers melt, sea levels rise, and heatwaves, droughts and very heavy rains become more common.'
      picture:
        kind: flow
        steps:
        - Burning fuels, cutting forests
        - More CO₂ in the air
        - More heat trapped
        - Melting ice, rising seas, extreme weather
        alt: Burning fuels and cutting forests add carbon dioxide, which traps more heat and leads to melting ice, rising seas and extreme weather.
      check:
        prompt: Which adds the most carbon dioxide to the air?
        options:
        - Burning coal in power stations
        - Growing trees
        - Using solar panels
        answer: Burning coal in power stations
        why: Burning fossil fuels releases the carbon stored in them as carbon dioxide.
    - teach: 'We can slow climate change: use solar and wind power, walk, cycle or take the bus, save electricity, plant and protect trees, and waste less food. Kerala''s floods of 2018 showed how extreme weather can hurt communities.'
      check:
        prompt: Which action reduces greenhouse gases?
        options:
        - Switching off lights not in use
        - Burning plastic waste
        - Cutting down trees
        answer: Switching off lights not in use
        why: Saving electricity means less fuel is burned in power stations.
  items:
  - prompt: Which gas is the main greenhouse gas added by burning fuels?
    options:
    - Carbon dioxide
    - Oxygen
    - Nitrogen
    - Helium
    answer: Carbon dioxide
    difficulty: 1
    hints:
    - Released when coal and petrol burn.
    - CO₂.
    solution: Burning fossil fuels releases carbon dioxide.
    mistakes: {"Oxygen": "t8_co2_fuels", "Nitrogen": "t8_co2_fuels"}
  - prompt: What would Earth be like without any greenhouse effect?
    options:
    - Much colder, mostly frozen
    - Much hotter
    - Exactly the same
    - Covered in forests
    answer: Much colder, mostly frozen
    difficulty: 2
    hints:
    - The greenhouse effect keeps us warm.
    - About 33 °C warmer.
    solution: Without it, Earth's average temperature would be far below freezing.
    mistakes: {"Much hotter": "t8_greenhouse_needed", "Exactly the same": "t8_greenhouse_needed"}
  - prompt: Which is an effect of global warming?
    options:
    - Melting glaciers and rising sea levels
    - Colder summers everywhere
    - More ice at the poles
    - Longer days
    answer: Melting glaciers and rising sea levels
    difficulty: 1
    hints:
    - Heat melts ice.
    - Water flows into the sea.
    solution: Warming melts glaciers and ice sheets, raising sea levels.
    mistakes: {"More ice at the poles": "t8_warming_effects", "Colder summers everywhere": "t8_warming_effects"}
  - prompt: Which action reduces climate change?
    options:
    - Using solar energy instead of coal
    - Burning more wood
    - Cutting down forests
    - Leaving lights on
    answer: Using solar energy instead of coal
    difficulty: 1
    hints:
    - Renewable energy releases no CO₂ when used.
    - The Sun.
    solution: Solar power avoids carbon dioxide from burning coal.
    mistakes: {"Burning more wood": "t8_reduce_co2", "Cutting down forests": "t8_reduce_co2"}
  - prompt: How do trees help slow climate change?
    options:
    - They take in carbon dioxide for photosynthesis
    - They give off carbon dioxide
    - They block sunlight from reaching Earth
    - They make the air hotter
    answer: They take in carbon dioxide for photosynthesis
    difficulty: 2
    hints:
    - What do plants use to make food?
    - CO₂ from the air.
    solution: Trees absorb carbon dioxide during photosynthesis.
    mistakes: {"They give off carbon dioxide": "t8_trees_co2", "They block sunlight from reaching Earth": "t8_trees_co2"}
  - prompt: Why is the greenhouse effect called that?
    options:
    - The gases trap heat like the glass of a greenhouse
    - Greenhouses make the gases
    - It only happens in gardens
    - It turns the Earth green
    answer: The gases trap heat like the glass of a greenhouse
    difficulty: 2
    hints:
    - A greenhouse keeps plants warm.
    - Light in, heat trapped.
    solution: Like greenhouse glass, the gases let sunlight in and trap some heat.
    mistakes: {"Greenhouses make the gases": "t8_greenhouse_name", "It turns the Earth green": "t8_greenhouse_name"}
  - prompt: Which of these is a greenhouse gas?
    options:
    - Methane
    - Oxygen
    - Nitrogen
    answer: Methane
    difficulty: 1
    hints:
    - It comes from paddy fields, cattle and rotting waste.
    - Oxygen and nitrogen don't trap much heat.
    solution: Methane traps heat strongly; oxygen and nitrogen hardly do.
    mistakes:
      Oxygen: t8_greenhouse_name
      Nitrogen: t8_greenhouse_name
  - prompt: How does cutting forests add to global warming?
    options:
    - Fewer trees take in carbon dioxide
    - Trees give out heat
    - Forests make the air cooler only at night
    answer: Fewer trees take in carbon dioxide
    difficulty: 2
    hints:
    - Trees use carbon dioxide for photosynthesis.
    - With fewer trees, more stays in the air.
    solution: Trees absorb carbon dioxide; cutting them leaves more of it in the air.
    mistakes:
      Trees give out heat: t8_trees_co2
      Forests make the air cooler only at night: t8_trees_co2
  - prompt: Why are sea levels rising?
    options:
    - Ice on land is melting and warm water expands
    - More rivers are being built
    - The Moon is closer
    answer: Ice on land is melting and warm water expands
    difficulty: 2
    hints:
    - Glaciers and ice sheets are shrinking.
    - Water takes up more space when it warms.
    solution: Melting glaciers add water to the sea, and warmer water expands.
    mistakes:
      More rivers are being built: t8_warming_effects
      The Moon is closer: t8_warming_effects
  - prompt: Which way of getting to school adds the least carbon dioxide?
    options:
    - Cycling
    - Being driven alone in a car
    - Riding a motorbike
    answer: Cycling
    difficulty: 1
    hints:
    - Which one burns no fuel?
    - Cars and motorbikes burn petrol.
    solution: Cycling burns no fuel at all.
    mistakes:
      Being driven alone in a car: c8s13_actions
      Riding a motorbike: c8s13_actions
  - prompt: Which is a source of extra greenhouse gases?
    options:
    - Vehicle exhaust
    - Planting trees
    - Solar power
    answer: Vehicle exhaust
    difficulty: 1
    hints:
    - Which one burns fuel?
    - The others reduce emissions.
    solution: Vehicle engines burn petrol or diesel and give out carbon dioxide.
    mistakes:
      Planting trees: c8s13_sources
      Solar power: c8s13_sources
  - prompt: Is the natural greenhouse effect bad for life?
    options:
    - No, it keeps Earth warm enough for life; the extra effect is the problem
    - Yes, all of it is harmful
    - It has no effect at all
    answer: No, it keeps Earth warm enough for life; the extra effect is the problem
    difficulty: 3
    hints:
    - What would Earth be like without it?
    - The worry is the extra gas we add.
    solution: Without the natural greenhouse effect Earth would be frozen; the problem is the extra warming from added gases.
    mistakes:
      Yes, all of it is harmful: t8_greenhouse_needed
      It has no effect at all: t8_greenhouse_needed
  - prompt: Which energy source does NOT give out carbon dioxide while making electricity?
    options:
    - Wind
    - Coal
    - Diesel
    answer: Wind
    difficulty: 1
    hints:
    - Which one doesn't burn anything?
    - Coal and diesel are fossil fuels.
    solution: Wind turbines make electricity without burning fuel.
    mistakes:
      Coal: t8_co2_fuels
      Diesel: t8_co2_fuels
  - prompt: In a warmer world, which of these would you expect to happen more often in Kerala summers?
    options:
    - More frequent heatwaves
    - Fewer storms everywhere
    - Thicker glaciers
    answer: More frequent heatwaves
    difficulty: 2
    hints:
    - The planet is getting warmer.
    - Glaciers are shrinking, not growing.
    solution: A warmer planet brings more heatwaves; glaciers are melting, and storms can become stronger.
    mistakes:
      Fewer storms everywhere: t8_warming_effects
      Thicker glaciers: t8_warming_effects
  - prompt: How does wasting food add to climate change?
    options:
    - Growing, moving and rotting food all release greenhouse gases
    - Food waste cools the air
    - It doesn't affect climate
    answer: Growing, moving and rotting food all release greenhouse gases
    difficulty: 3
    hints:
    - Farming and transport use fuel.
    - Rotting food in dumps gives off methane.
    solution: Wasted food wastes the fuel used to grow and move it, and rotting food releases methane.
