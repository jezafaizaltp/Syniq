# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 9. Format: content/README.md.
subject: cbse8-sci
chapter: 9
title: The Amazing World of Solutes, Solvents and Solutions
tips:
  c8s_density_divide: 'Density is mass divided by volume, not multiplied: 60 ÷ 20.'
  t8_density_material: "Density depends on the material, not the size. Both are iron."
  t8_density_sink: "Water's density is 1 g/cm³. Is the block denser or less dense than water, and what do denser things do?"
  t8_mass_conserved: "Nothing is lost when salt dissolves. Add the two masses."
  t8_mass_density: "Mass = density × volume."
  t8_oil_density: "Which is less dense: oil or water? The less dense one floats on top."
  t8_oxygen_warm: "Gases dissolve LESS in warm water. What gas do fish need from water?"
  t8_salt_denser: "Salt dissolved in sea water makes it heavier for the same volume. How does that help you float?"
  t8_saturated: "Saturated means 'full up'. Full of what?"
  t8_solubility_temp: "Sugar dissolves faster and more in hot tea than in cold. What does heat do to solubility?"
  t8_solute: "The solute is what gets dissolved; the solvent does the dissolving."
  t8_universal: "Water dissolves very many substances, but does it dissolve oil?"
  c8s9_roles: The solute is the thing that dissolves; the solvent is what it dissolves in, usually the larger amount.
  c8s9_add_masses: Nothing is lost when something dissolves. Add the mass of what dissolves to the mass of the liquid.
  c8s9_saturated: A saturated solution can't take any more at that temperature. What could let it take more?
  c8s9_gas_warm: 'Gases are the opposite of most solids: they dissolve less as the water gets warmer.'
  c8s9_density_calc: Density = mass ÷ volume. Divide the grams by the cubic centimetres.
  c8s9_compare_water: Compare the density with water's, 1 g/cm³. Less dense floats; more dense sinks.
concepts:
- code: cbse8s.sol.solutions
  title: Solutes, solvents and solubility
  notes: |
    A solution is a homogeneous mixture: a solute (sugar) dissolved in a solvent (water). Water dissolves so
    many substances that it is called the universal solvent. A saturated solution can dissolve no more solute
    at that temperature. Solubility of most solids increases with temperature; gases dissolve less in warm
    water, so warm water holds less dissolved oxygen, which harms fish. Concentration tells how much solute is
    in a given amount of solution. In a colloid (milk, fog) the particles are bigger and scatter light.
  explanations:
    text: 'When sugar dissolves in water, the sugar is the solute, the water is the solvent and the sweet water is a solution. Keep adding sugar and stirring, and eventually no more will dissolve: the solution is saturated. Warm it and more will dissolve.'
    visual: 'Draw three glasses: a few sugar crystals vanishing (unsaturated), crystals left at the bottom after stirring (saturated), and the same glass heated with the crystals dissolving again.'
    step_by_step: 'Step 1: Identify the solute (the smaller part, being dissolved). Step 2: Identify the solvent (the liquid doing the dissolving). Step 3: If no more will dissolve, the solution is saturated. Step 4: Heating usually lets more solid dissolve.'
    real_world: Fizzy drinks go flat faster when warm, because gases like carbon dioxide are less soluble in warm liquids.
  picture:
    kind: bars
    bars:
    - label: 20 °C
      value: 200
    - label: 40 °C
      value: 238
    - label: 60 °C
      value: 287
    - label: 80 °C
      value: 362
    unit: g of sugar per 100 mL water
    caption: More sugar dissolves in hotter water (approximate values).
    alt: Bars showing that about 200, 238, 287 and 362 grams of sugar dissolve in 100 millilitres of water at 20, 40, 60 and 80 degrees.
  activity:
    type: formula
    prompt: At room temperature, 36 g of salt dissolves in each 100 g of water. Extra salt stays at the bottom.
    inputs:
    - name: w
      label: Water
      min: 0
      max: 500
      step: 50
      start: 100
      unit: g
    - name: s
      label: Salt added
      min: 0
      max: 200
      step: 1
      start: 0
      unit: g
    outputs:
    - name: dis
      label: Salt dissolved
      expr: min(s,0.36*w)
      unit: g
    - name: left
      label: Salt left at the bottom
      expr: s-min(s,0.36*w)
      unit: g
    goals:
    - prompt: Make a saturated solution with 200 g of water, and no salt left over.
      want:
        w: 200
        dis: 72
        left: 0
      mistakes:
      - when:
          w: 200
          s: 36
        say: 36 g is for 100 g of water. Double the water dissolves double the salt.
      - when:
          w: 200
          s:
          - 73
          - 200
        say: 'Now some salt sits at the bottom: you''ve gone past saturated.'
    - prompt: Dissolve 90 g of salt using as little water as possible.
      want:
        s: 90
        w: 250
      mistakes:
      - when:
          s: 90
          w: 200
        say: 200 g of water holds only 72 g, so 18 g stays at the bottom.
      - when:
          s: 90
          w:
          - 300
          - 500
        say: That works, but uses more water than you need.
    - prompt: Leave 14 g of salt at the bottom of 100 g of water.
      want:
        w: 100
        left: 14
      mistakes:
      - when:
          w: 100
          s: 14
        say: 14 g all dissolves. The water takes 36 g first; only the extra stays.
  lesson:
    - teach: When sugar dissolves in water, the sugar is the solute, the water is the solvent, and the sugar water is a solution. A solution is a mixture that is the same throughout. Water dissolves so many things that it is called the universal solvent.
      picture:
        kind: flow
        steps:
        - Solute (sugar)
        - + Solvent (water)
        - = Solution (sugar water)
        alt: Sugar, the solute, dissolves in water, the solvent, to make sugar water, a solution.
      check:
        prompt: In lemon juice mixed into water, what is the solvent?
        options:
        - Water
        - Lemon juice
        - The glass
        answer: Water
        why: The solvent is the liquid the other substance dissolves in, here the water.
    - teach: There is a limit to how much solute a solvent can dissolve. A saturated solution can dissolve no more at that temperature. Heating usually lets more solid dissolve, so solubility of most solids increases with temperature.
      check:
        prompt: Extra sugar lies undissolved at the bottom of a glass of water. How can you dissolve more?
        options:
        - Warm the water
        - Cool the water
        - Add more sugar
        answer: Warm the water
        why: The solution is saturated; warming it lets it hold more sugar.
    - teach: 'Gases behave the other way: they dissolve less in warm water. Fish breathe oxygen dissolved in water, so very warm water from factories can leave them short of oxygen. When something dissolves, no mass is lost: 10 g of salt in 90 g of water makes 100 g of solution.'
      picture:
        kind: compare
        columns:
        - title: Warmer water
          points:
          - More sugar or salt dissolves
          - Less oxygen dissolves
        - title: Colder water
          points:
          - Less sugar or salt dissolves
          - More oxygen dissolves
        alt: Warmer water dissolves more sugar and salt but less oxygen; colder water the other way round.
      check:
        prompt: 25 g of sugar dissolves in 175 g of water. What is the mass of the solution?
        options:
        - 200 g
        - 175 g
        - 150 g
        answer: 200 g
        why: 'Mass is kept: 25 + 175 = 200 g.'
  items:
  - prompt: In salt water, which is the solute?
    options:
    - Salt
    - Water
    - Salt water
    - Air
    answer: Salt
    difficulty: 1
    hints:
    - The solute is dissolved.
    - The solvent does the dissolving.
    solution: Salt is dissolved, so it is the solute; water is the solvent.
    mistakes: {"Water": "t8_solute", "Salt water": "t8_solute"}
  - prompt: What is a saturated solution?
    options:
    - One that can dissolve no more solute at that temperature
    - One with no solute
    - Any coloured solution
    - One that is boiling
    answer: One that can dissolve no more solute at that temperature
    difficulty: 1
    hints:
    - Keep adding sugar...
    - It stops dissolving.
    solution: A saturated solution holds the most solute it can at that temperature.
    mistakes: {"One with no solute": "t8_saturated", "One that is boiling": "t8_saturated"}
  - prompt: What usually happens to the solubility of sugar as water gets hotter?
    options:
    - It increases
    - It decreases
    - It stays the same
    - It becomes zero
    answer: It increases
    difficulty: 1
    hints:
    - Tea with sugar.
    - Hot dissolves more.
    solution: Most solids dissolve more in hotter water.
    mistakes: {"It decreases": "t8_solubility_temp", "It stays the same": "t8_solubility_temp"}
  - prompt: Why can very warm river water harm fish?
    options:
    - Warm water holds less dissolved oxygen
    - Fish can't swim in warm water
    - Warm water has more salt
    - It has no minerals
    answer: Warm water holds less dissolved oxygen
    difficulty: 3
    hints:
    - Gases dissolve less when warm.
    - Fish breathe dissolved oxygen.
    solution: Oxygen is less soluble in warm water, so fish get less oxygen.
    mistakes: {"Fish can't swim in warm water": "t8_oxygen_warm", "Warm water has more salt": "t8_oxygen_warm"}
  - prompt: Why is water called the universal solvent?
    options:
    - It dissolves a very large number of substances
    - It dissolves everything
    - It is found everywhere
    - It has no taste
    answer: It dissolves a very large number of substances
    difficulty: 2
    hints:
    - Not literally everything.
    - Oil doesn't dissolve.
    solution: Water dissolves more substances than any other common liquid, though not all (oil doesn't).
    mistakes: {"It dissolves everything": "t8_universal", "It is found everywhere": "t8_universal"}
  - prompt: 40 g of salt is dissolved in 160 g of water. What is the mass of the solution, in g?
    answer: '200'
    check: 40 + 160
    difficulty: 2
    hints:
    - Solution = solute + solvent.
    - 40 + 160.
    solution: '40 + 160 = 200 g: mass is not lost when dissolving.'
    mistakes: {"160": "t8_mass_conserved", "120": "t8_mass_conserved"}
  - prompt: In salt water, which is the solvent?
    options:
    - Water
    - Salt
    - Both
    answer: Water
    difficulty: 1
    hints:
    - The solvent does the dissolving.
    - Salt is what gets dissolved.
    solution: The water dissolves the salt, so water is the solvent and salt is the solute.
    mistakes:
      Salt: c8s9_roles
      Both: c8s9_roles
  - prompt: 30 g of salt dissolves in 120 g of water. What is the mass of the solution, in grams?
    answer: '150'
    check: 30 + 120
    difficulty: 1
    hints:
    - Mass is not lost.
    - 30 + 120.
    solution: 30 + 120 = 150 g.
    mistakes:
      '120': c8s9_add_masses
      '90': c8s9_add_masses
  - prompt: A solution has a mass of 250 g and contains 50 g of sugar. How much water is in it, in grams?
    answer: '200'
    check: 250 - 50
    difficulty: 2
    hints:
    - Solution = solute + solvent.
    - 250 − 50.
    solution: 250 − 50 = 200 g of water.
    mistakes:
      '300': c8s9_add_masses
      '250': c8s9_add_masses
  - prompt: Why are fizzy drinks kept cold?
    options:
    - Gases stay dissolved better in cold liquid
    - Cold drinks have more sugar
    - Cold stops the bottle breaking
    answer: Gases stay dissolved better in cold liquid
    difficulty: 2
    hints:
    - The fizz is dissolved carbon dioxide.
    - How does temperature affect dissolved gas?
    solution: Carbon dioxide dissolves better in cold liquid, so cold drinks stay fizzy longer.
    mistakes:
      Cold drinks have more sugar: c8s9_gas_warm
      Cold stops the bottle breaking: c8s9_gas_warm
  - prompt: Which substance does NOT dissolve in water?
    options:
    - Sand
    - Salt
    - Sugar
    answer: Sand
    difficulty: 1
    hints:
    - Stir each into water.
    - Which one settles at the bottom?
    solution: Sand stays as grains and settles; salt and sugar dissolve.
    mistakes:
      Salt: t8_universal
      Sugar: t8_universal
  - prompt: How can you tell that a solution is saturated?
    options:
    - Extra solute stays undissolved however much you stir
    - It changes colour
    - It starts to boil
    answer: Extra solute stays undissolved however much you stir
    difficulty: 2
    hints:
    - It can't take any more.
    - What happens to extra solute?
    solution: In a saturated solution, added solute stays at the bottom at that temperature.
    mistakes:
      It changes colour: c8s9_saturated
      It starts to boil: c8s9_saturated
  - prompt: A hot saturated sugar solution is cooled. What happens?
    options:
    - Some sugar comes out as crystals
    - More sugar dissolves
    - The water disappears
    answer: Some sugar comes out as crystals
    difficulty: 3
    hints:
    - Cold water can hold less sugar.
    - Where does the extra go?
    solution: Cooling lowers how much sugar can stay dissolved, so the extra forms crystals.
    mistakes:
      More sugar dissolves: t8_solubility_temp
      The water disappears: t8_solubility_temp
  - prompt: Why does stirring help sugar dissolve faster?
    options:
    - It brings fresh water to the sugar
    - It makes the sugar heavier
    - It cools the water
    answer: It brings fresh water to the sugar
    difficulty: 2
    hints:
    - Water next to the sugar gets sweet.
    - Stirring moves it away.
    solution: Stirring moves sweet water away and brings fresh water to the sugar grains.
    mistakes:
      It makes the sugar heavier: c8s9_saturated
      It cools the water: c8s9_saturated
  - prompt: In a solution of iodine in alcohol (tincture of iodine), which is the solute?
    options:
    - Iodine
    - Alcohol
    - Water
    answer: Iodine
    difficulty: 2
    hints:
    - Which one is dissolved?
    - The alcohol is the liquid.
    solution: Iodine dissolves in alcohol, so iodine is the solute and alcohol the solvent.
    mistakes:
      Alcohol: t8_solute
      Water: t8_solute
- code: cbse8s.sol.density
  title: Density, floating and sinking
  after:
  - cbse8s.sol.solutions
  notes: |
    Density = mass ÷ volume, in g/cm³ (water is 1 g/cm³). An object floats on a liquid if it is less dense
    than the liquid and sinks if it is denser. Oil floats on water; ice (0.92 g/cm³) floats on water. Dissolving
    salt makes water denser, so eggs and people float more easily in salty water (the Dead Sea). Density does
    not depend on the size of the piece: a small and a large iron nail have the same density.
  explanations:
    text: Density tells how much mass is packed into each bit of volume. Wood floats because it is less dense than water; a stone sinks because it is denser. A big log and a small twig of the same wood have the same density, so both float.
    visual: 'Draw a tall jar with layers: honey at the bottom, then water, then oil on top, with a grape resting between water and oil.'
    step_by_step: 'Step 1: Find the mass (in g). Step 2: Find the volume (in cm³). Step 3: Density = mass ÷ volume. Step 4: Compare with the liquid: less dense floats, more dense sinks.'
    real_world: An egg sinks in tap water but floats when enough salt is dissolved, because the salty water becomes denser than the egg.
  picture:
    kind: bars
    bars:
    - label: Oil
      value: 0.9
    - label: Ice
      value: 0.92
    - label: Water
      value: 1
    - label: Sea water
      value: 1.03
    - label: Iron
      value: 7.9
    unit: g/cm³
    caption: Things less dense than water (1 g/cm³) float on it.
    alt: Bars showing densities of oil 0.9, ice 0.92, water 1, sea water 1.03 and iron 7.9 grams per cubic centimetre.
  activity:
    type: formula
    prompt: Density = mass ÷ volume. Water's density is 1 g/cm³.
    inputs:
    - name: m
      label: Mass
      min: 10
      max: 500
      step: 10
      start: 10
      unit: g
    - name: v
      label: Volume
      min: 10
      max: 500
      step: 10
      start: 10
      unit: cm³
    outputs:
    - name: d
      label: Density
      expr: m/v
      unit: g/cm³
      places: 2
    goals:
    - prompt: Make a block that floats, with density 0.5 g/cm³.
      want:
        d: 0.5
      mistakes:
      - when:
          d:
          - 1.01
          - 50
        say: 'Denser than water: it would sink. Floating needs less than 1 g/cm³.'
      - when:
          d:
          - 0.51
          - 0.99
        say: It would float, but density isn't 0.5 yet.
    - prompt: A 200 g stone with density 2.5 g/cm³. Find its volume.
      want:
        m: 200
        d: 2.5
      mistakes:
      - when:
          m: 200
          v: 500
        say: 200 × 2.5 = 500 multiplies. Volume = mass ÷ density.
      - when:
          m: 200
          v:
          - 10
          - 70
        say: Too small a volume makes it too dense.
    - prompt: A log of wood with density 0.6 g/cm³ has mass 300 g. Find its volume.
      want:
        m: 300
        d: 0.6
      mistakes:
      - when:
          m: 300
          v: 180
        say: '300 × 0.6 = 180 multiplies. Divide: 300 ÷ 0.6.'
  lesson:
    - teach: 'Density tells how much mass is packed into each unit of volume: density = mass ÷ volume, in g/cm³. Water''s density is 1 g/cm³. A block of 40 g and 10 cm³ has a density of 4 g/cm³.'
      picture:
        kind: flow
        steps:
        - Mass 40 g
        - Volume 10 cm³
        - 40 ÷ 10
        - Density 4 g/cm³
        alt: A block of 40 grams and 10 cubic centimetres has a density of 4 grams per cubic centimetre.
      check:
        prompt: A stone has mass 30 g and volume 10 cm³. What is its density?
        options:
        - 3 g/cm³
        - 300 g/cm³
        - 20 g/cm³
        answer: 3 g/cm³
        why: 30 ÷ 10 = 3 g/cm³.
    - teach: An object floats in a liquid if it is less dense than the liquid, and sinks if it is denser. Wood (about 0.6 g/cm³) floats on water; iron (about 7.9 g/cm³) sinks. Oil is less dense than water, so it floats on top.
      picture:
        kind: compare
        columns:
        - title: Floats on water
          points:
          - Wood 0.6
          - Ice 0.92
          - Oil 0.9
        - title: Sinks in water
          points:
          - Iron 7.9
          - Stone 2.5
          - Glass 2.5
        alt: Wood, ice and oil are less dense than water and float; iron, stone and glass are denser and sink.
      check:
        prompt: A block has density 0.8 g/cm³. What does it do in water?
        options:
        - Floats
        - Sinks
        - Dissolves
        answer: Floats
        why: 0.8 is less than water's 1 g/cm³, so it floats.
    - teach: 'Density belongs to the material, not the size of the piece: a big and a small iron nail have the same density. Dissolving salt makes water denser, so things float more easily in sea water, and an egg that sinks in tap water can float in strong salt water.'
      check:
        prompt: A big log and a small twig of the same wood are put in water. What happens?
        options:
        - Both float
        - The log sinks, the twig floats
        - Both sink
        answer: Both float
        why: They are the same material, so they have the same density and both float.
  items:
  - prompt: A block has a mass of 60 g and a volume of 20 cm³. Find its density, in g/cm³.
    answer: '3'
    check: 60/20
    difficulty: 1
    hints:
    - Density = mass ÷ volume.
    - 60 ÷ 20.
    solution: 60 ÷ 20 = 3 g/cm³.
    mistakes:
      '1200': c8s_density_divide
  - prompt: A block of density 3 g/cm³ is put in water (1 g/cm³). What happens?
    options:
    - It sinks
    - It floats
    - It dissolves
    - It floats halfway
    answer: It sinks
    difficulty: 1
    hints:
    - Compare with water.
    - Denser than water.
    solution: 3 g/cm³ is more than water's 1 g/cm³, so it sinks.
    mistakes: {"It floats": "t8_density_sink", "It floats halfway": "t8_density_sink"}
  - prompt: A piece of wood has a density of 0.6 g/cm³ and a volume of 50 cm³. Find its mass, in g.
    answer: '30'
    check: Rational(6, 10)*50
    difficulty: 2
    hints:
    - Mass = density × volume.
    - 0.6 × 50.
    solution: 0.6 × 50 = 30 g.
    mistakes: {"83.33": "t8_mass_density", "50.6": "t8_mass_density"}
  - prompt: Why does oil float on water?
    options:
    - Oil is less dense than water
    - Oil is heavier than water
    - Oil dissolves in water
    - Oil is a solid
    answer: Oil is less dense than water
    difficulty: 1
    hints:
    - Less dense goes on top.
    - Compare densities.
    solution: Oil's density (about 0.9 g/cm³) is less than water's.
    mistakes: {"Oil is heavier than water": "t8_oil_density", "Oil dissolves in water": "t8_oil_density"}
  - prompt: Why is it easier to float in sea water than in a river?
    options:
    - Salt makes sea water denser
    - Sea water is warmer
    - Waves push you up
    - Rivers have no water pressure
    answer: Salt makes sea water denser
    difficulty: 2
    hints:
    - Dissolved salt adds mass.
    - Denser liquid gives more upthrust.
    solution: Dissolved salt makes sea water denser, so it supports you more.
    mistakes: {"Sea water is warmer": "t8_salt_denser", "Waves push you up": "t8_salt_denser"}
  - prompt: A big iron nail and a small iron nail are compared. How do their densities compare?
    options:
    - They are the same
    - The big one is denser
    - The small one is denser
    - Iron has no density
    answer: They are the same
    difficulty: 2
    hints:
    - Density depends on the material.
    - Not on the size.
    solution: Same material, same density, whatever the size.
    mistakes: {"The big one is denser": "t8_density_material", "The small one is denser": "t8_density_material"}
  - prompt: A metal block has mass 270 g and volume 100 cm³. Find its density, in g/cm³.
    answer: '2.7'
    check: 270/100
    difficulty: 1
    hints:
    - Density = mass ÷ volume.
    - 270 ÷ 100.
    solution: 270 ÷ 100 = 2.7 g/cm³. (This is aluminium.)
    mistakes:
      '27000': c8s_density_divide
      '370': c8s9_density_calc
  - prompt: A liquid has density 0.8 g/cm³. What is the mass of 50 cm³ of it, in grams?
    answer: '40'
    check: 0.8*50
    difficulty: 2
    hints:
    - Mass = density × volume.
    - 0.8 × 50.
    solution: 0.8 × 50 = 40 g.
    mistakes:
      '62.5': t8_mass_density
      '50.8': t8_mass_density
  - prompt: A stone of density 2.5 g/cm³ has mass 100 g. What is its volume, in cm³?
    answer: '40'
    check: 100/2.5
    difficulty: 3
    hints:
    - Volume = mass ÷ density.
    - 100 ÷ 2.5.
    solution: 100 ÷ 2.5 = 40 cm³.
    mistakes:
      '250': c8s9_density_calc
      '97.5': c8s9_density_calc
  - prompt: Which will sink in water?
    options:
    - A block of density 1.4 g/cm³
    - A block of density 0.7 g/cm³
    - A block of density 0.95 g/cm³
    answer: A block of density 1.4 g/cm³
    difficulty: 1
    hints:
    - Water is 1 g/cm³.
    - Which one is denser than water?
    solution: Only 1.4 g/cm³ is denser than water, so that block sinks.
    mistakes:
      A block of density 0.7 g/cm³: c8s9_compare_water
      A block of density 0.95 g/cm³: c8s9_compare_water
  - prompt: Why does ice float on water?
    options:
    - Ice is less dense than liquid water
    - Ice is lighter than air
    - Ice has no mass
    answer: Ice is less dense than liquid water
    difficulty: 2
    hints:
    - Ice's density is about 0.92 g/cm³.
    - Compare with water.
    solution: Ice (about 0.92 g/cm³) is less dense than water (1 g/cm³), so it floats.
    mistakes:
      Ice is lighter than air: c8s9_compare_water
      Ice has no mass: c8s9_compare_water
  - prompt: An egg sinks in tap water. What can make it float?
    options:
    - Stirring a lot of salt into the water
    - Using a bigger glass
    - Adding ice
    answer: Stirring a lot of salt into the water
    difficulty: 2
    hints:
    - Salt water is denser.
    - The egg floats if the liquid is denser than it.
    solution: Salt makes the water denser than the egg, so the egg floats.
    mistakes:
      Using a bigger glass: t8_salt_denser
      Adding ice: t8_salt_denser
  - prompt: A small piece is cut off a block of density 3 g/cm³. What is the small piece's density?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Density depends on the material.
    - The material hasn't changed.
    solution: Cutting doesn't change the material, so the density is still 3 g/cm³.
    mistakes:
      '1': t8_density_material
      '1.5': t8_density_material
  - prompt: Oil, water and honey are poured into a glass. Which ends up at the bottom?
    options:
    - Honey
    - Oil
    - Water
    answer: Honey
    difficulty: 2
    hints:
    - The densest liquid sinks lowest.
    - Honey is thick and heavy for its size.
    solution: Honey is the densest, so it sinks to the bottom; water sits in the middle and oil on top.
