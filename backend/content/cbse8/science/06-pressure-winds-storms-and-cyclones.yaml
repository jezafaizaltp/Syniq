# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 6. Format: content/README.md.
subject: cbse8-sci
chapter: 6
title: Pressure, Winds, Storms and Cyclones
tips:
  c8s_pressure_divide: 'Pressure is force divided by area, not multiplied: P = F ÷ A.'
  t8_air_pressure_height: "As you go up, there is less air above you. What happens to its pressure?"
  t8_broad_feet: "Bigger area for the same weight means less pressure. Why would a camel need that on sand?"
  t8_cyclone_eye: "The calm centre of a cyclone has a name like a part of your face."
  t8_cyclone_safety: "Which choice keeps people away from strong winds and high waves?"
  t8_hot_air_rises: "Heated air expands and becomes lighter. Does it sink or rise?"
  t8_pressure_area: "Pressure = force ÷ area. A sharp edge has a tiny area. What happens to pressure?"
  t8_pressure_depth: "Where is the water pushing hardest on a dam: near the top or the bottom?"
  t8_sea_breeze: "In the daytime land heats faster than sea. Air rises over the land. Where does the cooler air come from?"
  t8_warm_ocean: "Cyclones need lots of heat and moisture. Where do they get both?"
  t8_wind_high_low: "Air moves like water flowing downhill: from where pressure is high to where it is low."
  c8s6_area: Pressure = force ÷ area. For the same force, a smaller area gives more pressure and a bigger area gives less.
  c8s6_depth: Liquid pressure grows the deeper you go. Where is the water deepest?
  c8s6_air_presses: Air presses on everything around us. What happens when the air on one side is taken away?
  c8s6_flow: Moving air always goes from where the pressure is higher to where it is lower.
  c8s6_heat_rise: Warm air expands, gets lighter and rises; cooler air flows in to take its place.
  c8s6_land_sea: Land heats up and cools down faster than the sea. Which is warmer at that time of day?
concepts:
- code: cbse8s.press.pressure
  title: Pressure in solids, liquids and air
  notes: |
    Pressure = force ÷ area, in newtons per square metre (pascal, Pa). The same force on a smaller area gives
    more pressure: knives are sharp, nails are pointed, but bags have wide straps and camels have broad feet.
    Liquids press in all directions, and pressure increases with depth (dams are thicker at the bottom).
    The air around us presses on everything: atmospheric pressure, about 1,00,000 Pa at sea level, decreases
    with height.
  explanations:
    text: Pressure is how concentrated a force is. Pushing a drawing pin with your thumb works because all the force goes onto the tiny point. Water pushes harder the deeper you go, and the air above us presses on everything too, though we don't notice because our bodies push back equally.
    visual: 'Draw a tall bottle of water with three holes one above the other: the jet from the bottom hole squirts farthest, because pressure is greatest at the bottom.'
    step_by_step: 'Step 1: Find the force in newtons. Step 2: Find the area it acts on in square metres. Step 3: Divide force by area. Step 4: Smaller area or bigger force means more pressure.'
    real_world: A school bag with wide straps spreads its weight over a bigger area of your shoulders, so it presses less and hurts less than one with thin straps.
  picture:
    kind: bars
    bars:
    - label: Top hole
      value: 2
    - label: Middle hole
      value: 5
    - label: Bottom hole
      value: 9
    unit: jet length (cm)
    caption: 'Water spurts farthest from the lowest hole: pressure grows with depth.'
    alt: Bars showing water jets of 2, 5 and 9 cm from the top, middle and bottom holes of a bottle.
  activity:
    type: formula
    prompt: Pressure = force ÷ area. Set the force and the area it presses on.
    inputs:
    - name: f
      label: Force
      min: 10
      max: 500
      step: 10
      start: 10
      unit: N
    - name: a
      label: Area
      min: 1
      max: 100
      step: 1
      start: 1
      unit: cm²
    outputs:
    - name: p
      label: Pressure
      expr: f/a
      unit: N/cm²
      places: 2
    goals:
    - prompt: Make 50 N/cm² with a 500 N force.
      want:
        f: 500
        p: 50
      mistakes:
      - when:
          f: 500
          a:
          - 11
          - 100
        say: 'Too spread out: a bigger area means less pressure. Pressure = force ÷ area.'
      - when:
          f: 500
          a:
          - 1
          - 9
        say: Too concentrated. A smaller area pushes pressure up.
    - prompt: Make only 2 N/cm² with a 200 N force.
      want:
        f: 200
        p: 2
      mistakes:
      - when:
          f: 200
          a: 1
        say: '200 N on 1 cm² is like a pin tip: very high pressure. Spread it out.'
      - when:
          f: 200
          a:
          - 1
          - 50
        say: Still too high. Spread the force wider.
    - prompt: A 100 N force on 20 cm² gives 5 N/cm². Make the pressure 4 times bigger.
      want:
        f: 100
        p: 20
      mistakes:
      - when:
          f: 100
          a: 80
        say: 80 cm² makes the pressure 4 times smaller. Shrink the area to raise the pressure.
  lesson:
    - teach: 'Pressure is how much force presses on each unit of area: pressure = force ÷ area, measured in pascals (Pa), newtons per square metre. The same force on a smaller area gives a bigger pressure.'
      picture:
        kind: compare
        columns:
        - title: Small area, big pressure
          points:
          - Sharp knife
          - Pointed nail
          - Needle
        - title: Big area, small pressure
          points:
          - Wide bag straps
          - Camel's broad feet
          - Tractor's wide tyres
        alt: Knives, nails and needles use a small area for big pressure; wide straps, broad feet and wide tyres spread force for small pressure.
      check:
        prompt: A force of 100 N acts on 2 m². What is the pressure?
        options:
        - 50 Pa
        - 200 Pa
        - 102 Pa
        answer: 50 Pa
        why: 100 ÷ 2 = 50 pascals.
    - teach: Liquids press in all directions, not just downwards, and the pressure grows with depth. Water spurts farther from a hole low down in a bottle than from one near the top. Dams are built thicker at the bottom for this reason.
      picture:
        kind: flow
        steps:
        - 'Hole near the top: weak spurt'
        - 'Hole in the middle: stronger'
        - 'Hole near the bottom: strongest'
        alt: Water spurts weakly from a hole near the top of a bottle and most strongly from a hole near the bottom.
      check:
        prompt: In a tall bottle of water, where is the water pressure greatest?
        options:
        - At the bottom
        - At the top
        - The same everywhere
        answer: At the bottom
        why: Pressure increases with depth, so it is greatest at the bottom.
    - teach: 'Air also presses on everything: atmospheric pressure. We don''t feel it because the air inside us presses back. When air is sucked out of a straw, the air outside pushes the drink up. Higher up a mountain there is less air above you, so the air pressure is lower.'
      check:
        prompt: Why does juice go up a straw when you suck?
        options:
        - Air pressure outside pushes it up
        - The juice wants to move
        - Gravity pulls it up
        answer: Air pressure outside pushes it up
        why: Sucking lowers the pressure inside the straw, and the air pressing on the juice pushes it up.
  items:
  - prompt: A force of 200 N acts on an area of 4 m². Find the pressure in pascals.
    answer: '50'
    check: 200/4
    difficulty: 1
    hints:
    - Pressure = force ÷ area.
    - 200 ÷ 4.
    solution: 200 ÷ 4 = 50 Pa.
    mistakes:
      '800': c8s_pressure_divide
  - prompt: A box weighing 600 N rests on a face of area 0.5 m². Find the pressure in pascals.
    answer: '1200'
    check: 600/Rational(1, 2)
    difficulty: 2
    hints:
    - 600 ÷ 0.5.
    - Dividing by a half doubles.
    solution: 600 ÷ 0.5 = 1200 Pa.
    mistakes:
      '300': c8s_pressure_divide
  - prompt: Why is a knife sharpened?
    options:
    - A smaller area gives more pressure for the same force
    - To make it heavier
    - To reduce pressure
    - To make it shine
    answer: A smaller area gives more pressure for the same force
    difficulty: 1
    hints:
    - Pressure = force ÷ area.
    - Sharp edge, tiny area.
    solution: A sharp edge has a tiny area, so the same push gives a large pressure.
    mistakes: {"To reduce pressure": "t8_pressure_area", "To make it heavier": "t8_pressure_area"}
  - prompt: Why is a dam built thicker at the bottom?
    options:
    - Water pressure increases with depth
    - To save concrete
    - Because the top has more water
    - To make it look strong
    answer: Water pressure increases with depth
    difficulty: 2
    hints:
    - Where is the push greatest?
    - Deepest water.
    solution: Pressure grows with depth, so the bottom must withstand the most.
    mistakes: {"Because the top has more water": "t8_pressure_depth", "To save concrete": "t8_pressure_depth"}
  - prompt: What happens to air pressure as you climb a high mountain?
    options:
    - It decreases
    - It increases
    - It stays the same
    - It becomes zero at once
    answer: It decreases
    difficulty: 2
    hints:
    - Less air above you.
    - Thinner air.
    solution: With less air above, atmospheric pressure falls with height.
    mistakes: {"It increases": "t8_air_pressure_height", "It stays the same": "t8_air_pressure_height"}
  - prompt: Why do camels have broad, flat feet?
    options:
    - To spread their weight and press less on sand
    - To run faster
    - To dig for water
    - To keep cool
    answer: To spread their weight and press less on sand
    difficulty: 1
    hints:
    - Bigger area, less pressure.
    - They don't sink.
    solution: Broad feet spread the weight, reducing pressure so they don't sink into sand.
    mistakes: {"To run faster": "t8_broad_feet", "To dig for water": "t8_broad_feet"}
  - prompt: A force of 500 N acts on an area of 2.5 m². Find the pressure, in pascals.
    answer: '200'
    check: 500/2.5
    difficulty: 1
    hints:
    - Pressure = force ÷ area.
    - 500 ÷ 2.5.
    solution: 500 ÷ 2.5 = 200 Pa.
    mistakes:
      '1250': c8s_pressure_divide
      '502.5': c8s6_area
  - prompt: A pressure of 400 Pa acts on 3 m². What is the total force, in newtons?
    answer: '1200'
    check: 400*3
    difficulty: 2
    hints:
    - Force = pressure × area.
    - 400 × 3.
    solution: Force = 400 × 3 = 1200 N.
    mistakes:
      '133.3': c8s6_area
      '403': c8s6_area
  - prompt: Why do school bags have wide straps?
    options:
    - To spread the weight over a bigger area and press less on the shoulders
    - To make the bag lighter
    - To make the bag look bigger
    answer: To spread the weight over a bigger area and press less on the shoulders
    difficulty: 1
    hints:
    - The weight of the bag is the same either way.
    - What changes with a wide strap?
    solution: A wider strap spreads the same force over more area, so the pressure on the shoulder is less.
    mistakes:
      To make the bag lighter: c8s6_area
      To make the bag look bigger: c8s6_area
  - prompt: 'Which presses harder on the ground: a woman standing in high heels or in flat shoes?'
    options:
    - High heels
    - Flat shoes
    - Both the same
    answer: High heels
    difficulty: 2
    hints:
    - Her weight is the same.
    - Which has the smaller area touching the ground?
    solution: A thin heel has a tiny area, so the same weight gives much more pressure.
    mistakes:
      Flat shoes: c8s6_area
      Both the same: c8s6_area
  - prompt: Why do deep-sea divers wear strong suits?
    options:
    - Water pressure is very high deep down
    - The water is very warm
    - There is no gravity under water
    answer: Water pressure is very high deep down
    difficulty: 2
    hints:
    - How does pressure change with depth?
    - Deep down there is a lot of water above.
    solution: Pressure increases with depth, so deep water presses very hard on the body.
    mistakes:
      The water is very warm: c8s6_depth
      There is no gravity under water: c8s6_depth
  - prompt: A rubber sucker sticks to a smooth wall. What holds it there?
    options:
    - Air pressure outside pushing it
    - Glue on the rubber
    - Magnetism
    answer: Air pressure outside pushing it
    difficulty: 3
    hints:
    - Pressing the sucker pushes the air out from under it.
    - What presses on the outside?
    solution: With the air pushed out, there is low pressure behind it, so the air outside presses it to the wall.
    mistakes:
      Glue on the rubber: c8s6_air_presses
      Magnetism: c8s6_air_presses
  - prompt: Water from a tap on the ground floor comes out faster than from a tap on the top floor. Why?
    options:
    - There is a greater depth of water above the lower tap
    - The lower tap is newer
    - Air pushes the water down faster
    answer: There is a greater depth of water above the lower tap
    difficulty: 2
    hints:
    - The tank is on the roof.
    - Pressure grows with depth.
    solution: The lower tap is farther below the tank, so the water pressure there is greater.
    mistakes:
      The lower tap is newer: c8s6_depth
      Air pushes the water down faster: c8s6_depth
  - prompt: Why do climbers' ears 'pop' as they go up a mountain?
    options:
    - Air pressure gets lower with height
    - The air gets warmer
    - Sound gets louder
    answer: Air pressure gets lower with height
    difficulty: 2
    hints:
    - There is less air above you up high.
    - The air inside the ear has to adjust.
    solution: Outside air pressure falls with height; the ears pop as the pressure inside evens out.
    mistakes:
      The air gets warmer: t8_air_pressure_height
      Sound gets louder: t8_air_pressure_height
  - prompt: A brick lies flat on its largest face, then stands on its smallest face. What happens to the pressure on the ground?
    options:
    - It increases
    - It decreases
    - It stays the same
    answer: It increases
    difficulty: 3
    hints:
    - Its weight is the same.
    - The area touching the ground is smaller.
    solution: Same force, smaller area, so the pressure is greater.
    mistakes:
      It decreases: c8s6_area
      It stays the same: c8s6_area
- code: cbse8s.press.wind
  title: Winds, storms and cyclones
  after:
  - cbse8s.press.pressure
  notes: |
    Air moves from a region of high pressure to a region of low pressure: wind. Uneven heating of the Earth
    causes pressure differences: warm air expands, becomes lighter and rises, leaving low pressure, and cooler
    air flows in. Sea and land breezes and the monsoon winds arise this way. Over warm seas, rising moist air
    releases heat as it condenses, the pressure at the centre drops further and a cyclone forms: a huge
    spinning storm with a calm eye. Warnings from the India Meteorological Department (IMD) and shelters save
    lives.
  explanations:
    text: Wind is air rushing from where the pressure is high to where it is low. The Sun heats land and sea unevenly; warm air rises and cooler air moves in to take its place. Over a very warm sea this can build into a cyclone, a giant spinning storm.
    visual: 'Draw the coast by day: hot land with air rising above it, cooler sea air flowing in across the beach (a sea breeze). At night draw the arrows the other way (a land breeze).'
    step_by_step: 'Step 1: Sunlight heats some places more than others. Step 2: Warm air expands and rises, leaving low pressure. Step 3: Cooler, high-pressure air moves in: that is wind. Step 4: Over warm oceans, strong rising air and low pressure can grow into a cyclone.'
    real_world: Before Cyclone Fani hit Odisha in 2019, IMD warnings helped move over a million people to shelters, saving many lives.
  picture:
    kind: flow
    steps:
    - Warm sea heats the air above it
    - 'Warm moist air rises: low pressure below'
    - Air rushes in and starts to spin
    - Moisture condenses, releasing more heat
    - The storm grows into a cyclone with a calm eye
    alt: 'How a cyclone forms: warm sea air rises, air rushes in and spins, condensation adds heat and the storm grows around a calm eye.'
  activity:
    type: order
    prompt: How does a cyclone form? Put the steps in order.
    steps:
    - The Sun heats the sea strongly
    - Warm, moist air rises from the sea
    - Low pressure forms where the air rose
    - Air from around rushes into the low-pressure area
    - Rising air cools; vapour forms clouds, giving out heat
    - The heat feeds a huge spinning storm with a calm eye
    reasons:
      Warm, moist air rises from the sea: Air only rises once the sea below has warmed it.
      Low pressure forms where the air rose: Air pressure drops after the air above has risen away.
      Air from around rushes into the low-pressure area: Wind blows from high to low pressure, so the low must exist first.
      Rising air cools; vapour forms clouds, giving out heat: Air must have risen and cooled before its water vapour condenses.
      The heat feeds a huge spinning storm with a calm eye: The released heat drives the storm, so this comes last.
  lesson:
    - teach: Wind is moving air. Air moves from places of high pressure to places of low pressure. The bigger the pressure difference, the stronger the wind.
      picture:
        kind: flow
        steps:
        - High pressure
        - air flows
        - Low pressure
        alt: Air flows from high pressure to low pressure; this is wind.
      check:
        prompt: Air always moves from…
        options:
        - High pressure to low pressure
        - Low pressure to high pressure
        - Cold places to the Sun
        answer: High pressure to low pressure
        why: Air is pushed from where the pressure is higher towards where it is lower.
    - teach: The Sun heats the Earth unevenly. Warm air expands, gets lighter and rises, leaving low pressure below. Cooler air flows in. By day the land heats faster than the sea, so a cool sea breeze blows onto the land. At night the land cools faster, so a land breeze blows out to sea. The monsoon works the same way on a huge scale.
      picture:
        kind: compare
        columns:
        - title: Day
          points:
          - Land warmer
          - Air over land rises
          - 'Sea breeze: sea → land'
        - title: Night
          points:
          - Sea warmer
          - Air over sea rises
          - 'Land breeze: land → sea'
        alt: By day the land is warmer, so a sea breeze blows onto land; at night the sea is warmer, so a land breeze blows out.
      check:
        prompt: At night on the coast, which way does the breeze blow?
        options:
        - From the land to the sea
        - From the sea to the land
        - Straight up
        answer: From the land to the sea
        why: At night the sea stays warmer, so air rises over it and air from the land flows out.
    - teach: 'Over warm oceans, moist air rises fast and releases heat as its water vapour condenses. This lowers the pressure further and draws in more air in a spiral: a cyclone. Its calm centre is the eye. Cyclones bring very strong winds, heavy rain and storm surges, so following IMD warnings and moving to shelters saves lives.'
      check:
        prompt: What feeds a cyclone with energy?
        options:
        - Warm, moist air rising over the ocean
        - Cold air over mountains
        - Sand in deserts
        answer: Warm, moist air rising over the ocean
        why: Heat released as the moist air condenses keeps the storm going, so cyclones form over warm seas.
  items:
  - prompt: 'Wind blows from:'
    options:
    - High pressure to low pressure
    - Low pressure to high pressure
    - Cold places to the Sun
    - Only north to south
    answer: High pressure to low pressure
    difficulty: 1
    hints:
    - Air moves to fill the gap.
    - From more to less.
    solution: Air moves from high-pressure regions to low-pressure ones.
    mistakes: {"Low pressure to high pressure": "t8_wind_high_low", "Cold places to the Sun": "t8_wind_high_low"}
  - prompt: What happens to air when it is heated?
    options:
    - It expands and rises
    - It sinks
    - It turns into water
    - It stops moving
    answer: It expands and rises
    difficulty: 1
    hints:
    - Hot-air balloons.
    - Lighter air goes up.
    solution: Heated air expands, becomes less dense and rises.
    mistakes: {"It sinks": "t8_hot_air_rises", "It turns into water": "t8_hot_air_rises"}
  - prompt: During the day at a beach, which way does the breeze blow?
    options:
    - From the sea to the land
    - From the land to the sea
    - Straight up
    - There is no breeze
    answer: From the sea to the land
    difficulty: 2
    hints:
    - Land heats faster than water.
    - Air rises over the land.
    solution: 'Land heats up faster, air rises over it, and cooler sea air flows in: a sea breeze.'
    mistakes: {"From the land to the sea": "t8_sea_breeze", "There is no breeze": "t8_sea_breeze"}
  - prompt: What is the calm centre of a cyclone called?
    options:
    - The eye
    - The core
    - The tail
    - The front
    answer: The eye
    difficulty: 1
    hints:
    - It sounds like part of a face.
    - Clear skies at the centre.
    solution: The calm centre of a cyclone is called the eye.
    mistakes: {"The core": "t8_cyclone_eye", "The tail": "t8_cyclone_eye"}
  - prompt: Where do cyclones usually form?
    options:
    - Over warm oceans
    - Over deserts
    - Over snowy mountains
    - Over cold lakes
    answer: Over warm oceans
    difficulty: 2
    hints:
    - They need warmth and moisture.
    - Sea surface heat.
    solution: Cyclones form over warm seas, which supply heat and moisture.
    mistakes: {"Over deserts": "t8_warm_ocean", "Over cold lakes": "t8_warm_ocean"}
  - prompt: Which helps people stay safe from a cyclone?
    options:
    - Following IMD warnings and moving to shelters
    - Going to the beach to watch
    - Staying in a boat
    - Ignoring the radio
    answer: Following IMD warnings and moving to shelters
    difficulty: 1
    hints:
    - Warnings give time.
    - Get to safety.
    solution: Early warnings and cyclone shelters save lives.
    mistakes: {"Going to the beach to watch": "t8_cyclone_safety", "Staying in a boat": "t8_cyclone_safety"}
  - prompt: Which of these causes winds?
    options:
    - Differences in air pressure
    - The Moon's light
    - Trees waving
    answer: Differences in air pressure
    difficulty: 1
    hints:
    - Air moves between high and low pressure.
    - Trees wave because of the wind, not the other way round.
    solution: Uneven heating makes pressure differences, and air flows from high to low pressure.
    mistakes:
      The Moon's light: c8s6_flow
      Trees waving: c8s6_flow
  - prompt: A candle flame heats the air above it. What does the warm air do?
    options:
    - Rises
    - Sinks
    - Stays still
    answer: Rises
    difficulty: 1
    hints:
    - Warm air expands.
    - Expanded air is lighter.
    solution: Warm air expands, becomes lighter and rises.
    mistakes:
      Sinks: t8_hot_air_rises
      Stays still: t8_hot_air_rises
  - prompt: Why does a cool breeze blow from the sea on a sunny afternoon?
    options:
    - The land is warmer, so air over it rises and sea air flows in
    - The sea is warmer than the land
    - The Sun pushes the air
    answer: The land is warmer, so air over it rises and sea air flows in
    difficulty: 2
    hints:
    - Which heats faster in the sun, land or water?
    - Air rises over the warmer place.
    solution: Land heats faster, air over it rises, and cooler air from the sea moves in.
    mistakes:
      The sea is warmer than the land: c8s6_land_sea
      The Sun pushes the air: c8s6_heat_rise
  - prompt: Why are exhaust fans fitted high up on kitchen walls?
    options:
    - Hot air rises, so it collects near the top
    - Fans work better upside down
    - To keep them away from children only
    answer: Hot air rises, so it collects near the top
    difficulty: 2
    hints:
    - Where does warm, smoky air go?
    - It is lighter.
    solution: Warm air rises, so a fan near the ceiling removes it best.
    mistakes:
      Fans work better upside down: c8s6_heat_rise
      To keep them away from children only: c8s6_heat_rise
  - prompt: Where do cyclones form?
    options:
    - Over warm seas
    - Over cold deserts
    - Over snowy mountains
    answer: Over warm seas
    difficulty: 1
    hints:
    - They need warm, moist air.
    - Where is there lots of water vapour?
    solution: Cyclones need warm sea water to supply moist, rising air.
    mistakes:
      Over cold deserts: t8_warm_ocean
      Over snowy mountains: t8_warm_ocean
  - prompt: Why do cyclones weaken after reaching land?
    options:
    - They lose their supply of warm, moist air
    - Land pushes them back
    - The eye closes
    answer: They lose their supply of warm, moist air
    difficulty: 3
    hints:
    - What feeds a cyclone?
    - Land has no warm sea underneath.
    solution: Over land there is no warm ocean to provide moist air and heat, so the storm runs out of energy.
    mistakes:
      Land pushes them back: t8_warm_ocean
      The eye closes: t8_cyclone_eye
  - prompt: Which agency in India gives cyclone warnings?
    options:
    - The India Meteorological Department (IMD)
    - The Railways
    - The Post Office
    answer: The India Meteorological Department (IMD)
    difficulty: 1
    hints:
    - It studies weather.
    - It issues forecasts on radio and TV.
    solution: The IMD tracks cyclones with satellites and radar and warns people early.
    mistakes:
      The Railways: t8_cyclone_safety
      The Post Office: t8_cyclone_safety
  - prompt: In a strong wind, why can a roof be lifted off a house?
    options:
    - Fast wind above lowers the pressure there, and air inside pushes up
    - The roof gets heavier
    - Rain pushes it up
    answer: Fast wind above lowers the pressure there, and air inside pushes up
    difficulty: 3
    hints:
    - Fast-moving air has lower pressure.
    - Which side then has higher pressure?
    solution: Fast wind over the roof means low pressure above; the higher pressure inside pushes the roof up.
    mistakes:
      The roof gets heavier: c8s6_flow
      Rain pushes it up: c8s6_flow
  - prompt: What is the safest action when a cyclone warning is given?
    options:
    - Move to a cyclone shelter or safe building
    - Go to the beach to watch
    - Go fishing before it arrives
    answer: Move to a cyclone shelter or safe building
    difficulty: 1
    hints:
    - Cyclones bring strong winds and floods.
    - Stay away from the sea.
    solution: Move to a strong shelter, store water and food, and follow official advice.
    mistakes:
      Go to the beach to watch: t8_cyclone_safety
      Go fishing before it arrives: t8_cyclone_safety
