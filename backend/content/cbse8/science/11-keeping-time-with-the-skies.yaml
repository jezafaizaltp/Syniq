    - "The Moon is much brighter than the Sun, so it can be seen from further away"
    - "Lunar eclipses last only a second, so everyone sees them at the same time"
    answer: The Earth's big shadow covers the whole Moon, seen from all of night-side Earth
    difficulty: 3
    hints:
    - Who can see the Moon at night?
    - The Moon's shadow on Earth is small.
    solution: Everyone on the night side sees the shadowed Moon; a total solar eclipse is seen only in the Moon's small shadow.
    mistakes:
      "The Moon is much brighter than the Sun, so it can be seen from further away": t8_lunar_eclipse
      "Lunar eclipses last only a second, so everyone sees them at the same time": t8_lunar_eclipse
  - prompt: Why are eclipses rare compared with new and full moons?
    options:
