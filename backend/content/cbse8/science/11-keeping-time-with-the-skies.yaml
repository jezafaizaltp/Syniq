    - "The Sun moves away from the Earth for most of the year"
    - "The Earth stops rotating for a while during most months"
    answer: The Moon's orbit is tilted, so exact line-ups are rare
    difficulty: 2
    hints:
    - The Moon usually passes above or below the Sun–Earth line.
    - Its path is slightly tilted.
    solution: Because of the tilt, the Sun, Earth and Moon line up exactly only a few times a year.
    mistakes:
