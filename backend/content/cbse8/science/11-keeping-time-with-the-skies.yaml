  - prompt: 'Case: During a partial solar eclipse, some students want to look at the Sun through ordinary sunglasses. Others make a pinhole in a card and watch the Sun''s image on the ground. Which is safe?'
    options:
    - "Only the pinhole image on the ground"
    - "Only the view through the sunglasses"
