# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 11. Format: content/README.md.
subject: cbse8-sci
chapter: 11
title: Keeping Time with the Skies
concepts:
- code: cbse8s.sky.moon
  title: Phases of the Moon and calendars
  notes: |
    The Moon does not make its own light; we see the half lit by the Sun. As it orbits the Earth, we see
    different amounts of the lit half: new moon (amavasya), waxing crescent, first quarter, waxing gibbous,
    full moon (purnima), then waning back. One cycle of phases takes about 29.5 days (a lunar month). A
    solar year is about 365¼ days, which is why leap years add a day every 4 years. Lunar calendars (like
    the Islamic Hijri calendar) follow the Moon; lunisolar calendars (many Indian calendars) add an extra
    month (adhik maas) now and then to keep in step with the seasons.
  explanations:
    text: 'The Moon is always half lit by the Sun. As it travels round the Earth, we see more or less of that lit half, so its shape seems to change from a thin crescent to a full disc and back in about 29.5 days. Calendars are built on these sky cycles: the Moon''s month and the Earth''s year round the Sun.'
    visual: 'Draw the Sun on the left, the Earth in the middle and eight Moons in a circle around it, each with the side facing the Sun lit. Then draw how each looks from Earth: dark, crescent, half, gibbous, full and back.'
    step_by_step: 'Step 1: The Sun lights half of the Moon. Step 2: The Moon goes round the Earth in about a month. Step 3: When it is between the Earth and the Sun we see the dark side (new moon). Step 4: When the Earth is between, we see the whole lit side (full moon).'
    real_world: Festivals like Diwali (on amavasya) and Guru Nanak Jayanti (on a purnima) follow the Moon, which is why their dates move on the solar calendar each year.
  picture:
    kind: flow
    steps:
    - New moon (amavasya)
    - Waxing crescent
    - First quarter
    - Waxing gibbous
    - Full moon (purnima)
    - Waning back to new moon
    alt: The Moon's phases from new moon through crescent, first quarter and gibbous to full moon, then waning back.
    caption: One full cycle takes about 29.5 days.
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: Day 0 is new moon. The cycle takes about 29.5 days. Mark the day of each phase.
    goals:
    - prompt: Full moon.
      target: 15
      mistakes:
      - when:
          v: 30
        say: 'Day 30 is back to new moon: dark. Full moon is halfway through.'
      - when:
          v: 7
        say: 'Around day 7 only half the disc is lit: the first quarter.'
    - prompt: First quarter (right half lit).
      target: 7
      mistakes:
      - when:
          v: 15
        say: That's the full moon. The first quarter comes halfway to it.
      - when:
          v: 22
        say: Day 22 is the last quarter, when the other half is lit.
    - prompt: Last quarter (left half lit).
      target: 22
      mistakes:
      - when:
          v: 7
        say: Day 7 is the first quarter, when the right half is lit. The last quarter comes after full moon.
      - when:
          v: 15
        say: That's the full moon. The last quarter is a week later.
  items:
  - prompt: Why does the Moon shine?
    options:
    - It reflects sunlight
    - It makes its own light
    - It is on fire
    - It reflects light from the Earth's cities
    answer: It reflects sunlight
    difficulty: 1
    hints:
    - It isn't a star.
    - Sunlight bounces off it.
    solution: The Moon reflects light from the Sun.
  - prompt: About how long does the Moon take to go through all its phases?
    options:
    - 29.5 days
    - 7 days
    - 365 days
    - 24 hours
    answer: 29.5 days
    difficulty: 1
    hints:
    - About a month.
    - A lunar month.
    solution: One cycle of phases takes about 29.5 days.
  - prompt: At new moon, where is the Moon?
    options:
    - Between the Earth and the Sun
    - Behind the Earth
    - Behind the Sun
    - Far from the Earth
    answer: Between the Earth and the Sun
    difficulty: 2
    hints:
    - We see its dark side.
    - The lit side faces away from us.
    solution: At new moon the Moon is between the Earth and the Sun, so its lit side faces away.
  - prompt: A solar year is about 365¼ days. After how many years do the quarter-days add up to one whole day?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - 4 quarters make a whole.
    - That is why leap years come every 4 years.
    solution: 4 × ¼ = 1 day, so a leap day is added every 4 years.
  - prompt: Why do many Indian calendars add an extra month (adhik maas) now and then?
    options:
    - To keep lunar months in step with the seasons
    - To have more holidays
    - Because the Moon slows down
    - To match the days of the week
    answer: To keep lunar months in step with the seasons
    difficulty: 3
    hints:
    - 12 lunar months are about 354 days.
    - The solar year is about 365.
    solution: 12 lunar months fall about 11 days short of a solar year; an extra month every few years catches up.
  - prompt: What is the phase called when we see the whole lit face of the Moon?
    options:
    - Full moon
    - New moon
    - Crescent
    - Quarter
    answer: Full moon
    difficulty: 1
    hints:
    - Purnima.
    - A round bright disc.
    solution: We see the whole lit face at full moon (purnima).
- code: cbse8s.sky.eclipse
  title: Eclipses and Indian astronomy
  after:
  - cbse8s.sky.moon
  notes: |
    A solar eclipse happens when the Moon passes between the Sun and the Earth and its shadow falls on the
    Earth; it can only happen at new moon. A lunar eclipse happens when the Earth comes between the Sun and
    the Moon and the Earth's shadow falls on the Moon; it can only happen at full moon. Eclipses don't happen
    every month because the Moon's orbit is tilted. Never look at the Sun directly, even during an eclipse.
    Indian astronomers like Aryabhata (5th century CE) explained eclipses as shadows and stated that the Earth
    spins on its axis; observatories such as the Jantar Mantar measured time and star positions.
  explanations:
    text: An eclipse is just a shadow. When the Moon blocks the Sun from part of the Earth, it is a solar eclipse. When the Earth's shadow falls on the Moon, it is a lunar eclipse. Aryabhata explained this more than 1500 years ago.
    visual: 'Draw the Sun, Earth and Moon in a straight line. Solar eclipse: Sun, Moon, Earth, with the Moon''s small shadow touching the Earth. Lunar eclipse: Sun, Earth, Moon, with the Earth''s shadow covering the Moon.'
    step_by_step: 'Step 1: Find which body is in the middle. Step 2: Moon in the middle: solar eclipse (at new moon). Step 3: Earth in the middle: lunar eclipse (at full moon). Step 4: Watch a solar eclipse only through proper eclipse glasses or a pinhole projector.'
    real_world: During a total lunar eclipse the Moon often turns a coppery red, because a little sunlight bends through the Earth's atmosphere onto it.
  picture:
    kind: compare
    columns:
    - title: Solar eclipse
      points:
      - Moon between Sun and Earth
      - Moon's shadow on Earth
      - Only at new moon
      - Never look directly
    - title: Lunar eclipse
      points:
      - Earth between Sun and Moon
      - Earth's shadow on Moon
      - Only at full moon
      - Safe to watch
    alt: A solar eclipse has the Moon between the Sun and Earth at new moon; a lunar eclipse has the Earth between the Sun and Moon at full moon.
    caption: Which body is in the middle decides the eclipse.
  activity:
    type: sort
    prompt: Solar eclipse or lunar eclipse?
    bins:
    - Solar eclipse
    - Lunar eclipse
    items:
    - label: The Moon comes between the Sun and the Earth
      bin: Solar eclipse
      clue: Whose light is blocked?
      why: The Moon hides the Sun.
    - label: Happens on a new-moon day
      bin: Solar eclipse
      clue: At new moon, where is the Moon?
      why: Between the Earth and the Sun.
    - label: The daytime sky goes dark
      bin: Solar eclipse
      clue: The Sun is hidden.
      why: A solar eclipse.
    - label: Never look at it without special filters
      bin: Solar eclipse
      clue: Looking at the Sun hurts your eyes.
      why: Solar.
    - label: The Earth comes between the Sun and the Moon
      bin: Lunar eclipse
      clue: Whose shadow falls where?
      why: Earth's shadow on the Moon.
    - label: Happens on a full-moon night
      bin: Lunar eclipse
      clue: At full moon the Earth is in the middle.
      why: Lunar.
    - label: The Moon turns a coppery red
      bin: Lunar eclipse
      clue: Earth's shadow, lit by sunlight bent through our air.
      why: Lunar.
    - label: Seen from the whole night side of the Earth
      bin: Lunar eclipse
      clue: Everyone who can see the Moon sees it.
      why: Lunar.
  items:
  - prompt: In a solar eclipse, which body is in the middle?
    options:
    - The Moon
    - The Earth
    - The Sun
    - Mars
    answer: The Moon
    difficulty: 1
    hints:
    - Something blocks the Sun.
    - It must be between us and the Sun.
    solution: The Moon passes between the Sun and the Earth.
  - prompt: 'A lunar eclipse can happen only at:'
    options:
    - Full moon
    - New moon
    - First quarter
    - Any phase
    answer: Full moon
    difficulty: 2
    hints:
    - The Earth is between the Sun and the Moon.
    - The Moon is fully lit then.
    solution: The Earth can be between the Sun and the Moon only at full moon.
  - prompt: Why don't eclipses happen every month?
    options:
    - The Moon's orbit is tilted compared with the Earth's
    - The Moon stops moving
    - The Sun moves away
    - Clouds block them
    answer: The Moon's orbit is tilted compared with the Earth's
    difficulty: 3
    hints:
    - The three must line up exactly.
    - Usually the Moon passes a little above or below.
    solution: The Moon's orbit is tilted, so Sun, Earth and Moon rarely line up exactly.
  - prompt: Which ancient Indian astronomer explained eclipses as shadows?
    options:
    - Aryabhata
    - Kalidasa
    - Chanakya
    - Tulsidas
    answer: Aryabhata
    difficulty: 1
    hints:
    - India's first satellite was named after him.
    - 5th century CE.
    solution: Aryabhata explained eclipses as shadows of the Earth and Moon.
  - prompt: What is the safe way to watch a solar eclipse?
    options:
    - Through eclipse glasses or a pinhole projector
    - Directly with bare eyes
    - Through ordinary sunglasses
    - Through a telescope without a filter
    answer: Through eclipse glasses or a pinhole projector
    difficulty: 1
    hints:
    - The Sun can damage eyes.
    - Special filters or indirect viewing.
    solution: Only certified eclipse glasses or indirect methods like a pinhole projector are safe.
  - prompt: Why does the Moon look reddish in a total lunar eclipse?
    options:
    - Some sunlight bends through the Earth's atmosphere onto it
    - The Moon is hot
    - The Moon makes red light
    - Mars reflects onto it
    answer: Some sunlight bends through the Earth's atmosphere onto it
    difficulty: 3
    hints:
    - The atmosphere bends red light.
    - Like sunset colours.
    solution: The Earth's atmosphere refracts reddish sunlight into its shadow, lighting the Moon dimly red.
