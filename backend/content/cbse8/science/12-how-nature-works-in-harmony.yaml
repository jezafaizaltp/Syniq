# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 12. Format: content/README.md.
subject: cbse8-sci
chapter: 12
title: How Nature Works in Harmony
tips:
  c8s_ten_percent: 'Energy goes down, not up, at each level: only about a tenth passes on, so divide by 10.'
  t8_biodiversity: "'Bio' means life and 'diversity' means variety."
  t8_bishnoi: "Amrita Devi of this Rajasthan community gave her life for trees in 1730."
  t8_chipko: "'Chipko' means 'to hug' or 'cling'. What did people cling to?"
  t8_corridor: "A corridor connects two rooms. A wildlife corridor connects two…?"
  t8_decomposer: "What happens to fallen leaves and dead animals over time? Who does that work?"
  t8_energy_levels: "Only about one tenth of the energy passes up each level. What is left after a few levels?"
  t8_habitat_loss: "Elephants walk long routes for food. What happens when forests are cut and their paths blocked?"
  t8_herbivore: "The deer eats grass. An animal that eats plants is called…?"
  t8_producer: "Which living things make their own food from sunlight?"
  t8_project_tiger: "Which project's name tells you the animal it protects?"
  t8_web_effect: "Frogs eat insects, and snakes eat frogs. Follow both arrows when frogs disappear."
  c8s12_roles: Producers make food from sunlight; herbivores eat plants; carnivores eat animals; omnivores eat both; decomposers break down the dead.
  c8s12_arrow: "Read grass → deer aloud: the deer eats the grass. What does the deer get from it?"
  c8s12_tenth: Only about a tenth of the energy passes up each level. Divide by 10 for every step.
  c8s12_web: 'Follow the arrows: who eats the missing animal, and who does it eat?'
  c8s12_threat: Which choice takes away an animal's home, food or safety?
  c8s12_protect: Which choice keeps habitats whole and living things safe?
concepts:
- code: cbse8s.eco.food
  title: Ecosystems, food chains and food webs
  notes: |
    An ecosystem is all the living things in an area together with their non-living surroundings (water, soil,
    air, sunlight). Producers (green plants) make food by photosynthesis; consumers eat plants (herbivores),
    animals (carnivores) or both (omnivores); decomposers (bacteria, fungi) break down dead matter and return
    nutrients to the soil. A food chain shows who eats whom (grass → deer → tiger); linked food chains form a
    food web. Only about 10% of the energy at one level passes to the next, so food chains are short.
  explanations:
    text: Living things depend on each other for food. Plants make food from sunlight, animals eat plants or other animals, and decomposers recycle everything that dies. Many food chains join up into a food web, so a change to one species affects many others.
    visual: Draw grass → grasshopper → frog → snake → eagle, then add arrows from grass to a rabbit and from the rabbit to the eagle, turning the chain into a web. Add mushrooms at the bottom breaking down dead leaves.
    step_by_step: 'Step 1: Start with a producer (a plant). Step 2: Add the animal that eats it (herbivore). Step 3: Add what eats that (carnivore). Step 4: Arrows point from the food to the eater. Step 5: Remember decomposers recycle all of them.'
    real_world: 'When vultures nearly disappeared from India in the 1990s and 2000s, dead animals rotted for longer, and stray dogs and diseases like rabies increased: one missing link affected a whole web.'
  picture:
    kind: bars
    bars:
    - label: Grass
      value: 10000
    - label: Deer
      value: 1000
    - label: Tiger
      value: 100
    unit: units of energy
    caption: Only about 10% of the energy passes up each level.
    alt: Bars showing energy falling from 10,000 units in grass to 1,000 in deer and 100 in tigers, about 10 per cent at each step.
  activity:
    type: order
    prompt: 'Build a food chain: who eats whom? Start from the producer.'
    steps:
    - Grass
    - Grasshopper
    - Frog
    - Snake
    - Eagle
    reasons:
      Grasshopper: A food chain starts with a plant that makes food from sunlight.
      Frog: The frog eats the grasshopper, so it comes after.
      Snake: The snake eats the frog.
      Eagle: 'The eagle eats the snake: the top of this chain.'
  lesson:
    - teach: 'An ecosystem is all the living things in a place together with their non-living surroundings: water, soil, air and sunlight. A pond, a forest and a paddy field are ecosystems.'
      check:
        prompt: Which is a non-living part of a pond ecosystem?
        options:
        - Water
        - Frogs
        - Water plants
        answer: Water
        why: Water is not alive; frogs and plants are living parts of the ecosystem.
    - teach: 'Green plants are producers: they make food by photosynthesis. Herbivores eat plants, carnivores eat animals, omnivores eat both. Decomposers (bacteria and fungi) break down dead matter and return nutrients to the soil. A food chain shows who eats whom: grass → grasshopper → frog → snake.'
      picture:
        kind: flow
        steps:
        - Grass (producer)
        - Grasshopper (herbivore)
        - Frog (carnivore)
        - Snake (carnivore)
        alt: 'A food chain: grass is eaten by a grasshopper, which is eaten by a frog, which is eaten by a snake.'
      check:
        prompt: In grass → goat → tiger, what is the goat?
        options:
        - Herbivore
        - Producer
        - Decomposer
        answer: Herbivore
        why: The goat eats plants, so it is a herbivore.
    - teach: Only about a tenth of the energy at one level passes to the next; the rest is used for living or lost as heat. That is why food chains are short. Many food chains link up into a food web, so a change to one animal affects many others.
      picture:
        kind: bars
        bars:
        - label: Grass
          value: 10000
        - label: Deer
          value: 1000
        - label: Tiger
          value: 100
        unit: energy units
        alt: 'Energy falls from 10,000 units in grass to 1000 in deer and 100 in tigers: a tenth each step.'
      check:
        prompt: Plants hold 5000 units of energy. About how much reaches the herbivores that eat them?
        options:
        - '500'
        - '5000'
        - '50'
        answer: '500'
        why: 'About a tenth passes on: 5000 ÷ 10 = 500.'
  items:
  - prompt: In the chain grass → deer → tiger, what is the deer?
    options:
    - Herbivore
    - Producer
    - Carnivore
    - Decomposer
    answer: Herbivore
    difficulty: 1
    hints:
    - It eats grass.
    - Plant-eater.
    solution: The deer eats plants, so it is a herbivore (a primary consumer).
    mistakes: {"Producer": "t8_herbivore", "Carnivore": "t8_herbivore"}
  - prompt: What do decomposers do?
    options:
    - Break down dead matter and return nutrients to the soil
    - Make food from sunlight
    - Hunt other animals
    - Pollinate flowers
    answer: Break down dead matter and return nutrients to the soil
    difficulty: 1
    hints:
    - Fungi and bacteria.
    - Recycling.
    solution: Decomposers break down dead plants and animals, recycling nutrients.
    mistakes: {"Make food from sunlight": "t8_decomposer", "Hunt other animals": "t8_decomposer"}
  - prompt: Grass has 10,000 units of energy. About how many units reach the deer that eat it (10%)?
    answer: '1000'
    check: 10000/10
    difficulty: 2
    hints:
    - 10% of 10,000.
    - Divide by 10.
    solution: 10% of 10,000 = 1000 units.
    mistakes:
      '100000': c8s_ten_percent
  - prompt: Which are the producers in an ecosystem?
    options:
    - Green plants
    - Lions
    - Mushrooms
    - Insects
    answer: Green plants
    difficulty: 1
    hints:
    - They make their own food.
    - Photosynthesis.
    solution: Green plants produce food using sunlight.
    mistakes: {"Mushrooms": "t8_producer", "Insects": "t8_producer"}
  - prompt: Why are food chains usually short (4–5 levels)?
    options:
    - Most energy is lost at each level
    - Animals don't like long chains
    - Plants run out
    - Decomposers stop them
    answer: Most energy is lost at each level
    difficulty: 3
    hints:
    - Only about 10% passes on.
    - Little is left at the top.
    solution: Only about a tenth of the energy passes up each level, so few levels can be supported.
    mistakes: {"Plants run out": "t8_energy_levels", "Decomposers stop them": "t8_energy_levels"}
  - prompt: What happens if frogs disappear from a field?
    options:
    - Insects may increase and snakes may decrease
    - Nothing changes
    - Plants disappear at once
    - Eagles become herbivores
    answer: Insects may increase and snakes may decrease
    difficulty: 2
    hints:
    - Frogs eat insects.
    - Snakes eat frogs.
    solution: Without frogs, insect numbers rise and frog-eaters like snakes lose food.
    mistakes: {"Nothing changes": "t8_web_effect", "Plants disappear at once": "t8_web_effect"}
  - prompt: What is the source of energy for almost every food chain?
    options:
    - The Sun
    - The soil
    - Water
    answer: The Sun
    difficulty: 1
    hints:
    - Producers make food using it.
    - Photosynthesis needs light.
    solution: Plants capture the Sun's energy by photosynthesis; it then passes along the chain.
    mistakes:
      The soil: t8_producer
      Water: t8_producer
  - prompt: Which animal is an omnivore?
    options:
    - Bear
    - Cow
    - Lion
    answer: Bear
    difficulty: 1
    hints:
    - An omnivore eats plants and animals.
    - Cows eat plants; lions eat meat.
    solution: 'Bears eat fruit, roots, fish and small animals: both plants and animals.'
    mistakes:
      Cow: c8s12_roles
      Lion: c8s12_roles
  - prompt: Plants store 20,000 units of energy. About how much reaches the carnivores that eat the herbivores?
    answer: '200'
    check: 20000/10/10
    difficulty: 2
    hints:
    - Herbivores get about 2000.
    - Divide by 10 again.
    solution: 20,000 → 2000 (herbivores) → 200 (carnivores).
    mistakes:
      '2000': c8s12_tenth
      '18000': c8s12_tenth
  - prompt: In a food chain, what does an arrow show?
    options:
    - Which way the food and energy go
    - Which animal is bigger
    - Which animal lives longer
    answer: Which way the food and energy go
    difficulty: 1
    hints:
    - grass → deer.
    - The deer gets the grass's energy.
    solution: 'The arrow points from the eaten to the eater: the direction food and energy move.'
    mistakes:
      Which animal is bigger: c8s12_arrow
      Which animal lives longer: c8s12_arrow
  - prompt: Which are decomposers?
    options:
    - Bacteria and fungi
    - Grass and trees
    - Lions and tigers
    answer: Bacteria and fungi
    difficulty: 1
    hints:
    - They break down dead matter.
    - Mushrooms on a log are one kind.
    solution: Bacteria and fungi break down dead plants and animals and return nutrients to the soil.
    mistakes:
      Grass and trees: t8_decomposer
      Lions and tigers: t8_decomposer
  - prompt: If snakes are removed from a field, what may happen to the number of rats?
    options:
    - It may go up
    - It may go down
    - Nothing at all
    answer: It may go up
    difficulty: 2
    hints:
    - Snakes eat rats.
    - Fewer hunters…
    solution: With fewer snakes eating them, rats may increase and damage crops.
    mistakes:
      It may go down: c8s12_web
      Nothing at all: t8_web_effect
  - prompt: Why are there fewer tigers than deer in a forest?
    options:
    - Less energy is available at higher levels of the chain
    - Tigers live longer
    - Deer are bigger
    answer: Less energy is available at higher levels of the chain
    difficulty: 2
    hints:
    - Each level gets about a tenth of the energy.
    - Tigers are at the top.
    solution: Only a small part of the energy reaches the top, so fewer top carnivores can be supported.
    mistakes:
      Tigers live longer: t8_energy_levels
      Deer are bigger: t8_energy_levels
  - prompt: In grass → rabbit → fox, which is the producer?
    options:
    - Grass
    - Rabbit
    - Fox
    answer: Grass
    difficulty: 1
    hints:
    - It makes its own food.
    - It is green.
    solution: Grass makes its own food by photosynthesis, so it is the producer.
    mistakes:
      Rabbit: c8s12_roles
      Fox: c8s12_roles
  - prompt: What is a food web?
    options:
    - Many food chains linked together
    - A spider's web made of food
    - A single food chain
    answer: Many food chains linked together
    difficulty: 2
    hints:
    - Most animals eat more than one kind of food.
    - So chains cross each other.
    solution: Animals eat and are eaten by several others, so food chains join into a web.
    mistakes:
      A spider's web made of food: c8s12_web
      A single food chain: c8s12_web
- code: cbse8s.eco.conserve
  title: 'Living in harmony: conservation'
  after:
  - cbse8s.eco.food
  notes: |
    Biodiversity is the variety of living things in an area. It is threatened by habitat loss
    (deforestation), pollution, poaching, invasive species and climate change. Conservation protects it:
    national parks, wildlife sanctuaries and biosphere reserves; Project Tiger (1973); community efforts like
    the Bishnois of Rajasthan and the Chipko movement. Human–wildlife conflict (elephants raiding crops,
    leopards entering towns) rises when forests shrink; corridors connecting forests help animals move safely.
  explanations:
    text: Every living thing has a role, and the variety of life, biodiversity, keeps nature in balance. Cutting forests, pollution and hunting push species towards extinction. Protected areas, laws and people who care, like the Chipko and Bishnoi communities, help nature and humans live side by side.
    visual: Draw a forest split by a road and farms, with an elephant trying to cross. Then draw a green corridor joining the two halves so animals can pass without entering villages.
    step_by_step: 'Step 1: Name the threat (habitat loss, pollution, poaching, climate change). Step 2: Think who is affected, wildlife and people. Step 3: Choose an action: protect habitats, connect forests, reduce pollution, involve local people.'
    real_world: In 1730, Amrita Devi Bishnoi and over 350 villagers in Khejarli, Rajasthan, gave their lives hugging trees to stop them being cut, a story that inspired later movements like Chipko.
  picture:
    kind: compare
    columns:
    - title: Threats
      points:
      - Cutting forests
      - Pollution
      - Poaching
      - Climate change
    - title: Solutions
      points:
      - National parks and sanctuaries
      - Wildlife corridors
      - Laws against hunting
      - Community protection (Chipko, Bishnoi)
    alt: Threats to biodiversity like deforestation, pollution, poaching and climate change, matched with solutions like protected areas, corridors, laws and community action.
    caption: Protecting habitats protects species.
  activity:
    type: sort
    prompt: Does it help or harm the variety of life?
    bins:
    - Helps conservation
    - Harms biodiversity
    items:
    - label: Chipko villagers hugging trees to stop felling
      bin: Helps conservation
      clue: They kept the forest standing.
      why: Protecting trees protects habitats.
    - label: Bishnoi communities protecting blackbuck
      bin: Helps conservation
      clue: They guard animals from hunters.
      why: Protection.
    - label: Setting up a national park
      bin: Helps conservation
      clue: A protected home for wildlife.
      why: In-situ conservation.
    - label: A seed bank storing rare seeds
      bin: Helps conservation
      clue: Saving plants for the future.
      why: Ex-situ conservation.
    - label: Poaching tigers for skins
      bin: Harms biodiversity
      clue: Animals killed illegally.
      why: Pushes species to extinction.
    - label: Clearing forest for farms
      bin: Harms biodiversity
      clue: Habitats destroyed.
      why: Habitat loss.
    - label: Dumping plastic in rivers
      bin: Harms biodiversity
      clue: Fish and birds swallow it.
      why: Pollution.
    - label: Releasing a fast-spreading foreign weed into a lake
      bin: Harms biodiversity
      clue: It crowds out local plants.
      why: An invasive species.
  lesson:
    - teach: Biodiversity is the variety of living things in a place. The Western Ghats in Kerala are one of the world's richest areas. Biodiversity is threatened by habitat loss (cutting forests), pollution, poaching, invasive species and climate change.
      check:
        prompt: Which is the biggest threat to most wild animals?
        options:
        - Loss of their habitat
        - Too many forests
        - Clean rivers
        answer: Loss of their habitat
        why: When forests and wetlands are cleared, animals lose their homes and food.
    - teach: Conservation protects living things and their homes. India has national parks, wildlife sanctuaries and biosphere reserves. Project Tiger began in 1973, and wildlife corridors join forests so animals such as elephants can move safely between them.
      picture:
        kind: compare
        columns:
        - title: Protected area
          points:
          - National park
          - Wildlife sanctuary
          - Biosphere reserve
        - title: Example
          points:
          - Silent Valley (Kerala)
          - Periyar (Kerala)
          - Nilgiri
        alt: Protected areas include national parks such as Silent Valley, sanctuaries such as Periyar, and biosphere reserves such as the Nilgiri.
      check:
        prompt: What is a wildlife corridor?
        options:
        - A strip of habitat joining two forests
        - A road through a forest
        - A zoo enclosure
        answer: A strip of habitat joining two forests
        why: Corridors let animals move between forests to find food and mates without crossing farms and roads.
    - teach: 'People have long protected nature. The Bishnoi community of Rajasthan protects trees and blackbuck. In the Chipko movement, villagers hugged trees to stop them being cut. Small actions matter too: planting native trees, not wasting water and paper, and not buying products from endangered animals.'
      check:
        prompt: What did the Chipko movement do?
        options:
        - People hugged trees to stop them being felled
        - It built new roads
        - It hunted tigers
        answer: People hugged trees to stop them being felled
        why: '''Chipko'' means to cling; villagers clung to trees to save them.'
  items:
  - prompt: What is biodiversity?
    options:
    - The variety of living things in an area
    - The number of trees only
    - The weather of a place
    - A type of soil
    answer: The variety of living things in an area
    difficulty: 1
    hints:
    - Bio = life, diversity = variety.
    - All kinds of life.
    solution: Biodiversity is the variety of plants, animals and microbes in an area.
    mistakes: {"The number of trees only": "t8_biodiversity", "The weather of a place": "t8_biodiversity"}
  - prompt: Which project was started in India in 1973 to protect tigers?
    options:
    - Project Tiger
    - Project Elephant
    - Chipko
    - Green India
    answer: Project Tiger
    difficulty: 1
    hints:
    - Named after the animal.
    - '1973.'
    solution: Project Tiger began in 1973 to save tigers and their habitats.
    mistakes: {"Project Elephant": "t8_project_tiger", "Chipko": "t8_project_tiger"}
  - prompt: What was the Chipko movement about?
    options:
    - Hugging trees to stop them being cut
    - Building dams
    - Hunting tigers
    - Planting rice
    answer: Hugging trees to stop them being cut
    difficulty: 1
    hints:
    - Chipko means 'to stick'.
    - Uttarakhand, 1970s.
    solution: Villagers hugged trees to stop logging in the Chipko movement.
    mistakes: {"Building dams": "t8_chipko", "Hunting tigers": "t8_chipko"}
  - prompt: Why do elephants sometimes raid crops near villages?
    options:
    - Their forests and paths have been cut up
    - They prefer farm food to everything
    - They are trained to
    - Because of the full moon
    answer: Their forests and paths have been cut up
    difficulty: 2
    hints:
    - Habitat loss.
    - They have less forest and food.
    solution: When forests shrink and corridors are blocked, elephants enter farms in search of food and routes.
    mistakes: {"They prefer farm food to everything": "t8_habitat_loss", "Because of the full moon": "t8_habitat_loss"}
  - prompt: What is a wildlife corridor?
    options:
    - A strip of habitat joining two forests so animals can move
    - A zoo
    - A road through a forest
    - A fence around a village
    answer: A strip of habitat joining two forests so animals can move
    difficulty: 2
    hints:
    - It connects.
    - Safe passage.
    solution: Corridors connect habitats so animals can travel without entering towns.
    mistakes: {"A zoo": "t8_corridor", "A road through a forest": "t8_corridor"}
  - prompt: Which community in Rajasthan is famous for protecting trees and blackbucks?
    options:
    - The Bishnois
    - The Todas
    - The Bhils
    - The Santhals
    answer: The Bishnois
    difficulty: 2
    hints:
    - Amrita Devi.
    - Khejarli, 1730.
    solution: The Bishnois are known for protecting trees and wildlife; Amrita Devi gave her life for trees in 1730.
    mistakes: {"The Todas": "t8_bishnoi", "The Santhals": "t8_bishnoi"}
  - prompt: Which action helps protect biodiversity?
    options:
    - Planting native trees
    - Clearing forests for buildings
    - Buying ivory
    answer: Planting native trees
    difficulty: 1
    hints:
    - Which one gives animals homes and food?
    - Ivory comes from killing elephants.
    solution: Native trees support local insects, birds and animals.
    mistakes:
      Clearing forests for buildings: c8s12_protect
      Buying ivory: c8s12_protect
  - prompt: Why do elephants sometimes enter farms near forests?
    options:
    - Their forests and paths have been broken up
    - They prefer farm food to forest food always
    - They are lost because of the moon
    answer: Their forests and paths have been broken up
    difficulty: 2
    hints:
    - Elephants walk long distances along old paths.
    - Farms and roads now cross them.
    solution: When forests and corridors are cut, elephants run short of food and end up in fields.
    mistakes:
      They prefer farm food to forest food always: t8_habitat_loss
      They are lost because of the moon: t8_habitat_loss
  - prompt: Which of these is a threat to biodiversity?
    options:
    - Poaching
    - Protecting wetlands
    - Planting mangroves
    answer: Poaching
    difficulty: 1
    hints:
    - Which one harms animals?
    - The others protect habitats.
    solution: Poaching, illegal hunting, kills animals such as tigers, elephants and rhinos.
    mistakes:
      Protecting wetlands: c8s12_threat
      Planting mangroves: c8s12_threat
  - prompt: Which national park in Kerala is famous for its untouched rainforest and lion-tailed macaques?
    options:
    - Silent Valley
    - Kaziranga
    - Gir
    answer: Silent Valley
    difficulty: 2
    hints:
    - It is in Palakkad district.
    - Kaziranga is in Assam; Gir is in Gujarat.
    solution: Silent Valley in Kerala protects rainforest and the endangered lion-tailed macaque.
    mistakes:
      Kaziranga: t8_biodiversity
      Gir: t8_biodiversity
  - prompt: What is an invasive species?
    options:
    - A plant or animal brought from elsewhere that spreads and harms local life
    - An animal that lives only in one place
    - A protected tree
    answer: A plant or animal brought from elsewhere that spreads and harms local life
    difficulty: 2
    hints:
    - It doesn't belong in that place.
    - It spreads fast and pushes out native species.
    solution: Invasive species, like water hyacinth in Kerala's backwaters, spread quickly and crowd out local life.
    mistakes:
      An animal that lives only in one place: c8s12_threat
      A protected tree: c8s12_threat
  - prompt: Why does protecting tigers also protect many other species?
    options:
    - Tigers need large, healthy forests, which shelter many other living things
    - Tigers eat all pests
    - Tigers plant trees
    answer: Tigers need large, healthy forests, which shelter many other living things
    difficulty: 3
    hints:
    - A tiger needs a big territory.
    - What lives in that forest?
    solution: Saving tigers means saving their large forest homes, which protects everything else living there.
    mistakes:
      Tigers eat all pests: t8_project_tiger
      Tigers plant trees: t8_project_tiger
  - prompt: Which community is known for giving their lives to protect khejri trees?
    options:
    - The Bishnois
    - The Chipko marchers of Kerala
    - City builders
    answer: The Bishnois
    difficulty: 2
    hints:
    - They live in Rajasthan.
    - They also protect blackbuck.
    solution: In 1730, Bishnois led by Amrita Devi gave their lives to save khejri trees.
    mistakes:
      The Chipko marchers of Kerala: t8_bishnoi
      City builders: t8_bishnoi
  - prompt: How do mangroves along the coast help?
    options:
    - They protect the coast from storms and shelter young fish
    - They make the sea saltier
    - They stop rain
    answer: They protect the coast from storms and shelter young fish
    difficulty: 2
    hints:
    - Their roots hold the mud.
    - Many fish breed among the roots.
    solution: Mangroves break waves, hold the coast together and are nurseries for fish and crabs.
    mistakes:
      They make the sea saltier: c8s12_protect
      They stop rain: c8s12_protect
  - prompt: Which simple action at home helps nature?
    options:
    - Using less paper and water
    - Leaving taps running
    - Burning dry leaves
    answer: Using less paper and water
    difficulty: 1
    hints:
    - Paper comes from trees.
    - Which choice wastes less?
    solution: Using less paper saves trees, and saving water helps rivers and wetlands.
    mistakes:
      Leaving taps running: c8s12_protect
      Burning dry leaves: c8s12_protect
