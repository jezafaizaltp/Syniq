# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 12. Format: content/README.md.
subject: cbse8-sci
chapter: 12
title: How Nature Works in Harmony
tips:
  c8s_ten_percent: 'Energy goes down, not up, at each level: only about a tenth passes on, so divide by 10.'
concepts:
- code: cbse8s.eco.food
  title: Ecosystems, food chains and food webs
  notes: |
    An ecosystem is all the living things in an area together with their non-living surroundings (water, soil,
    air, sunlight). Producers (green plants) make food by photosynthesis; consumers eat plants (herbivores),
    animals (carnivores) or both (omnivores); decomposers (bacteria, fungi) break down dead matter and return
    nutrients to the soil. A food chain shows who eats whom (grass → deer → tiger); linked food chains form a
    food web. Only about 10% of the energy at one level passes to the next, so food chains are short.
  explanations:
    text: Living things depend on each other for food. Plants make food from sunlight, animals eat plants or other animals, and decomposers recycle everything that dies. Many food chains join up into a food web, so a change to one species affects many others.
    visual: Draw grass → grasshopper → frog → snake → eagle, then add arrows from grass to a rabbit and from the rabbit to the eagle, turning the chain into a web. Add mushrooms at the bottom breaking down dead leaves.
    step_by_step: 'Step 1: Start with a producer (a plant). Step 2: Add the animal that eats it (herbivore). Step 3: Add what eats that (carnivore). Step 4: Arrows point from the food to the eater. Step 5: Remember decomposers recycle all of them.'
    real_world: 'When vultures nearly disappeared from India in the 1990s and 2000s, dead animals rotted for longer, and stray dogs and diseases like rabies increased: one missing link affected a whole web.'
  picture:
    kind: bars
    bars:
    - label: Grass
      value: 10000
    - label: Deer
      value: 1000
    - label: Tiger
      value: 100
    unit: units of energy
    caption: Only about 10% of the energy passes up each level.
    alt: Bars showing energy falling from 10,000 units in grass to 1,000 in deer and 100 in tigers, about 10 per cent at each step.
  items:
  - prompt: In the chain grass → deer → tiger, what is the deer?
    options:
    - Herbivore
    - Producer
    - Carnivore
    - Decomposer
    answer: Herbivore
    difficulty: 1
    hints:
    - It eats grass.
    - Plant-eater.
    solution: The deer eats plants, so it is a herbivore (a primary consumer).
  - prompt: What do decomposers do?
    options:
    - Break down dead matter and return nutrients to the soil
    - Make food from sunlight
    - Hunt other animals
    - Pollinate flowers
    answer: Break down dead matter and return nutrients to the soil
    difficulty: 1
    hints:
    - Fungi and bacteria.
    - Recycling.
    solution: Decomposers break down dead plants and animals, recycling nutrients.
  - prompt: Grass has 10,000 units of energy. About how many units reach the deer that eat it (10%)?
    answer: '1000'
    check: 10000/10
    difficulty: 2
    hints:
    - 10% of 10,000.
    - Divide by 10.
    solution: 10% of 10,000 = 1000 units.
    mistakes:
      '100000': c8s_ten_percent
  - prompt: Which are the producers in an ecosystem?
    options:
    - Green plants
    - Lions
    - Mushrooms
    - Insects
    answer: Green plants
    difficulty: 1
    hints:
    - They make their own food.
    - Photosynthesis.
    solution: Green plants produce food using sunlight.
  - prompt: Why are food chains usually short (4–5 levels)?
    options:
    - Most energy is lost at each level
    - Animals don't like long chains
    - Plants run out
    - Decomposers stop them
    answer: Most energy is lost at each level
    difficulty: 3
    hints:
    - Only about 10% passes on.
    - Little is left at the top.
    solution: Only about a tenth of the energy passes up each level, so few levels can be supported.
  - prompt: What happens if frogs disappear from a field?
    options:
    - Insects may increase and snakes may decrease
    - Nothing changes
    - Plants disappear at once
    - Eagles become herbivores
    answer: Insects may increase and snakes may decrease
    difficulty: 2
    hints:
    - Frogs eat insects.
    - Snakes eat frogs.
    solution: Without frogs, insect numbers rise and frog-eaters like snakes lose food.
- code: cbse8s.eco.conserve
  title: 'Living in harmony: conservation'
  after:
  - cbse8s.eco.food
  notes: |
    Biodiversity is the variety of living things in an area. It is threatened by habitat loss
    (deforestation), pollution, poaching, invasive species and climate change. Conservation protects it:
    national parks, wildlife sanctuaries and biosphere reserves; Project Tiger (1973); community efforts like
    the Bishnois of Rajasthan and the Chipko movement. Human–wildlife conflict (elephants raiding crops,
    leopards entering towns) rises when forests shrink; corridors connecting forests help animals move safely.
  explanations:
    text: Every living thing has a role, and the variety of life, biodiversity, keeps nature in balance. Cutting forests, pollution and hunting push species towards extinction. Protected areas, laws and people who care, like the Chipko and Bishnoi communities, help nature and humans live side by side.
    visual: Draw a forest split by a road and farms, with an elephant trying to cross. Then draw a green corridor joining the two halves so animals can pass without entering villages.
    step_by_step: 'Step 1: Name the threat (habitat loss, pollution, poaching, climate change). Step 2: Think who is affected, wildlife and people. Step 3: Choose an action: protect habitats, connect forests, reduce pollution, involve local people.'
    real_world: In 1730, Amrita Devi Bishnoi and over 350 villagers in Khejarli, Rajasthan, gave their lives hugging trees to stop them being cut, a story that inspired later movements like Chipko.
  picture:
    kind: compare
    columns:
    - title: Threats
      points:
      - Cutting forests
      - Pollution
      - Poaching
      - Climate change
    - title: Solutions
      points:
      - National parks and sanctuaries
      - Wildlife corridors
      - Laws against hunting
      - Community protection (Chipko, Bishnoi)
    alt: Threats to biodiversity like deforestation, pollution, poaching and climate change, matched with solutions like protected areas, corridors, laws and community action.
    caption: Protecting habitats protects species.
  items:
  - prompt: What is biodiversity?
    options:
    - The variety of living things in an area
    - The number of trees only
    - The weather of a place
    - A type of soil
    answer: The variety of living things in an area
    difficulty: 1
    hints:
    - Bio = life, diversity = variety.
    - All kinds of life.
    solution: Biodiversity is the variety of plants, animals and microbes in an area.
  - prompt: Which project was started in India in 1973 to protect tigers?
    options:
    - Project Tiger
    - Project Elephant
    - Chipko
    - Green India
    answer: Project Tiger
    difficulty: 1
    hints:
    - Named after the animal.
    - '1973.'
    solution: Project Tiger began in 1973 to save tigers and their habitats.
  - prompt: What was the Chipko movement about?
    options:
    - Hugging trees to stop them being cut
    - Building dams
    - Hunting tigers
    - Planting rice
    answer: Hugging trees to stop them being cut
    difficulty: 1
    hints:
    - Chipko means 'to stick'.
    - Uttarakhand, 1970s.
    solution: Villagers hugged trees to stop logging in the Chipko movement.
  - prompt: Why do elephants sometimes raid crops near villages?
    options:
    - Their forests and paths have been cut up
    - They prefer farm food to everything
    - They are trained to
    - Because of the full moon
    answer: Their forests and paths have been cut up
    difficulty: 2
    hints:
    - Habitat loss.
    - They have less forest and food.
    solution: When forests shrink and corridors are blocked, elephants enter farms in search of food and routes.
  - prompt: What is a wildlife corridor?
    options:
    - A strip of habitat joining two forests so animals can move
    - A zoo
    - A road through a forest
    - A fence around a village
    answer: A strip of habitat joining two forests so animals can move
    difficulty: 2
    hints:
    - It connects.
    - Safe passage.
    solution: Corridors connect habitats so animals can travel without entering towns.
  - prompt: Which community in Rajasthan is famous for protecting trees and blackbucks?
    options:
    - The Bishnois
    - The Todas
    - The Bhils
    - The Santhals
    answer: The Bishnois
    difficulty: 2
    hints:
    - Amrita Devi.
    - Khejarli, 1730.
    solution: The Bishnois are known for protecting trees and wildlife; Amrita Devi gave her life for trees in 1730.
