# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 7. Format: content/README.md.
subject: cbse8-sci
chapter: 7
title: Particulate Nature of Matter
tips:
  t8_boiling: "Liquid to gas at a fixed temperature (100 °C for water) is called…? Melting is solid to liquid."
  c8s7_boil_point: "0 °C is where ice melts. Water has to get much hotter than that before it boils."
  t8_compress_gas: "To squash something, there must be room between its particles."
  t8_condense: "The glass is cold. Water vapour in the air cools when it touches it. What does vapour turn into?"
  t8_diffusion: "Particles moving and mixing on their own, with no stirring, has a name."
  t8_evaporation_rate: "Heat and moving air both help water escape as vapour faster."
  t8_gas_spaces: "Which state fills any container and can be squashed? Its particles are far apart."
  t8_hot_faster: "Heat makes particles move faster. Faster particles mix…?"
  t8_latent: "Put a thermometer in melting ice. The heat goes into changing the state. What does the thermometer show?"
  t8_melting_point: "At what temperature does ice turn into water?"
  t8_solid_fixed: "In a solid, can the particles slide past each other?"
  t8_spaces_liquid: "If the level hardly rises, where did the sugar particles go?"
  t8_sublime: "Which substance in your home slowly disappears without melting first?"
  c8s7_states: 'Picture the particles: packed in place, close but sliding, or far apart and free?'
  c8s7_spaces: Particles have gaps between them. What can fit into those gaps?
  c8s7_motion: Particles are always moving, and heat makes them move faster.
  c8s7_change_name: 'Name the change by its start and end: solid to liquid, liquid to gas, gas to liquid, liquid to solid, or solid straight to gas.'
  c8s7_evap_factors: Evaporation speeds up with more heat, more wind, more surface and drier air.
  c8s7_cooling: Evaporating particles take heat energy with them. What happens to what is left behind?

concepts:
- code: cbse8s.matter.particles
  title: Matter is made of particles
  notes: |
    All matter is made of tiny particles with spaces between them. The particles are always moving, and move
    faster when heated. They attract each other. In solids, particles are packed closely in fixed positions
    (definite shape and volume); in liquids they are close but can slide past each other (definite volume,
    no fixed shape); in gases they are far apart and move freely (no fixed shape or volume, easily
    compressed). Diffusion, the spreading of one substance through another, shows that particles move; it
    is faster in gases and at higher temperatures.
  explanations:
    text: Everything around you is made of particles far too small to see. They are always moving and there are gaps between them. How close and how free they are decides whether something is a solid, a liquid or a gas.
    visual: 'Draw three boxes: tightly packed dots in rows (solid), close dots jumbled together (liquid) and a few dots far apart with arrows (gas).'
    step_by_step: 'Step 1: Matter is made of particles. Step 2: Particles have spaces between them. Step 3: They are always moving, faster when hot. Step 4: In solids they vibrate in place; in liquids they slide; in gases they move freely.'
    real_world: 'When someone cooks biryani in the kitchen, you can smell it in another room: the scent particles diffuse through the air.'
  picture:
    kind: compare
    columns:
    - title: Solid
      points:
      - Particles packed tightly
      - Vibrate in place
      - Fixed shape and volume
    - title: Liquid
      points:
      - Particles close but loose
      - Slide past each other
      - Fixed volume, takes container's shape
    - title: Gas
      points:
      - Particles far apart
      - Move freely and fast
      - Fills any container
    alt: Solids have tightly packed particles with a fixed shape, liquids have close particles that slide, and gases have particles far apart that fill any container.
    caption: Same particles, different spacing and freedom.
  activity:
    type: sort
    prompt: Solid, liquid or gas? Look at how the particles behave.
    bins:
    - Solid
    - Liquid
    - Gas
    items:
    - label: Particles packed tightly, only vibrating in place
      bin: Solid
      clue: Can the particles move around each other?
      why: 'Fixed in place: a solid.'
    - label: Keeps its own shape in any container
      bin: Solid
      clue: Does it spread to fill the container?
      why: A fixed shape.
    - label: Hardest to squash
      bin: Solid
      clue: Particles already touching, with tiny gaps.
      why: 'Almost no gaps: a solid.'
    - label: Particles slide past each other but stay close
      bin: Liquid
      clue: Close together, but free to move.
      why: A liquid flows.
    - label: Takes the shape of its container but keeps its volume
      bin: Liquid
      clue: It fills the bottom, not the whole jar.
      why: A liquid.
    - label: Flows, but can't be squashed much
      bin: Liquid
      clue: Particles are close, but not locked.
      why: A liquid.
    - label: Particles far apart, moving fast in all directions
      bin: Gas
      clue: Big gaps, fast movement.
      why: A gas.
    - label: Spreads to fill the whole container
      bin: Gas
      clue: Particles go everywhere they can.
      why: A gas.
    - label: Easy to squash into a smaller space
      bin: Gas
      clue: Lots of empty space between particles.
      why: A gas compresses.
  lesson:
    - teach: All matter is made of tiny particles, far too small to see, with spaces between them. The particles attract each other and are always moving. Heating makes them move faster.
      check:
        prompt: What happens to particles when matter is heated?
        options:
        - They move faster
        - They stop moving
        - They disappear
        answer: They move faster
        why: Heat gives particles more energy, so they move faster.
    - teach: In a solid, particles are packed close in fixed places and only vibrate, so a solid keeps its shape and volume. In a liquid, they are close but can slide past each other, so it flows and takes the shape of its container. In a gas, they are far apart and move freely, so a gas fills any container and can be squeezed.
      picture:
        kind: compare
        columns:
        - title: Solid
          points:
          - Packed in fixed places
          - Fixed shape
          - Fixed volume
        - title: Liquid
          points:
          - Close, sliding
          - Takes the container's shape
          - Fixed volume
        - title: Gas
          points:
          - Far apart, free
          - Fills the container
          - Easily squeezed
        alt: In a solid particles are fixed, in a liquid they slide past each other, and in a gas they are far apart and free.
      check:
        prompt: Which state takes the shape of its container but keeps its volume?
        options:
        - Liquid
        - Solid
        - Gas
        answer: Liquid
        why: A liquid flows to fit its container, but its volume stays the same.
    - teach: 'Because particles move and have spaces between them, substances mix on their own: diffusion. The smell of incense spreads through a room; a drop of ink colours still water. Diffusion is fastest in gases and faster when it is hot.'
      picture:
        kind: flow
        steps:
        - A drop of ink in water
        - Particles move about
        - Ink spreads into the gaps
        - The whole glass is coloured
        alt: Ink particles move into the gaps between water particles until the whole glass is coloured.
      check:
        prompt: The smell of food cooking reaches the next room. What is this called?
        options:
        - Diffusion
        - Melting
        - Freezing
        answer: Diffusion
        why: Smell particles move through the air on their own, spreading from where they are many to where they are few.
  items:
  - prompt: In which state are particles farthest apart?
    options:
    - Gas
    - Liquid
    - Solid
    - All the same
    answer: Gas
    difficulty: 1
    hints:
    - Which can be squashed easily?
    - Air.
    solution: Gas particles are far apart and move freely.
    mistakes: {"Solid": "t8_gas_spaces", "All the same": "t8_gas_spaces"}
  - prompt: Why can't a solid be poured?
    options:
    - Its particles are held in fixed positions
    - Its particles don't exist
    - It is too cold
    - It has no mass
    answer: Its particles are held in fixed positions
    difficulty: 1
    hints:
    - Liquids can flow.
    - Solid particles only vibrate.
    solution: In solids the particles are fixed in place, so a solid keeps its shape.
    mistakes: {"It is too cold": "t8_solid_fixed", "It has no mass": "t8_solid_fixed"}
  - prompt: A drop of ink spreads through a glass of water on its own. What is this called?
    options:
    - Diffusion
    - Melting
    - Evaporation
    - Condensation
    answer: Diffusion
    difficulty: 1
    hints:
    - Particles spreading out.
    - No stirring needed.
    solution: 'Moving particles mix on their own: diffusion.'
    mistakes: {"Melting": "t8_diffusion", "Evaporation": "t8_diffusion"}
  - prompt: Where does diffusion happen fastest?
    options:
    - In hot water
    - In cold water
    - In ice
    - It is the same everywhere
    answer: In hot water
    difficulty: 2
    hints:
    - Heat makes particles move faster.
    - Try tea in hot and cold water.
    solution: Particles move faster when hotter, so diffusion is quicker.
    mistakes: {"In cold water": "t8_hot_faster", "In ice": "t8_hot_faster"}
  - prompt: Why can a gas be compressed easily?
    options:
    - There are large spaces between its particles
    - Its particles are very large
    - It has no particles
    - Its particles don't move
    answer: There are large spaces between its particles
    difficulty: 2
    hints:
    - Think of a bicycle pump.
    - Room to squeeze.
    solution: Gas particles have big gaps, so they can be pushed closer together.
    mistakes: {"Its particles are very large": "t8_compress_gas", "Its particles don't move": "t8_compress_gas"}
  - prompt: Sugar dissolves in water and the level hardly rises. What does this show?
    options:
    - There are spaces between water particles
    - Sugar disappears completely
    - Water has no particles
    - Sugar is a gas
    answer: There are spaces between water particles
    difficulty: 3
    hints:
    - Where did the sugar go?
    - Into the gaps.
    solution: Sugar particles fit into the spaces between water particles.
    mistakes: {"Sugar disappears completely": "t8_spaces_liquid", "Water has no particles": "t8_spaces_liquid"}
  - prompt: In which state are particles packed closest in fixed positions?
    options:
    - Solid
    - Liquid
    - Gas
    answer: Solid
    difficulty: 1
    hints:
    - It keeps its own shape.
    - Its particles can only vibrate.
    solution: In a solid, particles are tightly packed in fixed places.
    mistakes:
      Liquid: c8s7_states
      Gas: c8s7_states
  - prompt: Why does a gas fill a whole room?
    options:
    - Its particles move freely in all directions
    - Its particles are fixed in place
    - It has no particles
    answer: Its particles move freely in all directions
    difficulty: 1
    hints:
    - Gas particles are far apart.
    - Nothing holds them in place.
    solution: Gas particles move freely and spread out until they fill the space.
    mistakes:
      Its particles are fixed in place: t8_gas_spaces
      It has no particles: c8s7_states
  - prompt: Why does a drop of ink spread faster in hot water than in cold water?
    options:
    - Particles move faster when hot
    - Hot water has no spaces
    - Ink is heavier in cold water
    answer: Particles move faster when hot
    difficulty: 2
    hints:
    - What does heat do to particles?
    - Faster particles mix sooner.
    solution: Heat makes particles move faster, so diffusion happens faster.
    mistakes:
      Hot water has no spaces: t8_hot_faster
      Ink is heavier in cold water: t8_hot_faster
  - prompt: Why can't you squeeze a block of wood into a smaller size?
    options:
    - Its particles are already tightly packed
    - It is too heavy
    - Wood is not made of particles
    answer: Its particles are already tightly packed
    difficulty: 2
    hints:
    - Wood is a solid.
    - There is very little space between its particles.
    solution: In a solid the particles are very close, with almost no space to squeeze into.
    mistakes:
      It is too heavy: t8_solid_fixed
      Wood is not made of particles: c8s7_states
  - prompt: Why can LPG be stored in a small cylinder?
    options:
    - Gas particles have big spaces, so the gas can be squeezed
    - LPG has no particles
    - The cylinder makes particles smaller
    answer: Gas particles have big spaces, so the gas can be squeezed
    difficulty: 2
    hints:
    - A lot of gas fits in a small space.
    - The particles can be pushed closer together.
    solution: Gas particles are far apart, so a lot of gas can be compressed into a small cylinder.
    mistakes:
      LPG has no particles: t8_compress_gas
      The cylinder makes particles smaller: t8_compress_gas
  - prompt: In which state of matter does diffusion happen fastest?
    options:
    - In a gas
    - In a liquid
    - In a solid
    answer: In a gas
    difficulty: 2
    hints:
    - Where do particles move most freely?
    - Where are the gaps biggest?
    solution: Gas particles move fastest and have the most space, so gases diffuse fastest.
    mistakes:
      In a liquid: c8s7_motion
      In a solid: c8s7_motion
  - prompt: When you stir sugar into a full cup of tea, why doesn't it overflow?
    options:
    - Sugar particles fit into the spaces between water particles
    - The sugar disappears
    - The cup gets bigger
    answer: Sugar particles fit into the spaces between water particles
    difficulty: 3
    hints:
    - Matter can't just disappear.
    - Particles have gaps between them.
    solution: The sugar particles spread into the gaps between the water particles, so the level hardly rises.
    mistakes:
      The sugar disappears: c8s7_spaces
      The cup gets bigger: c8s7_spaces
  - prompt: What keeps the particles of a solid together?
    options:
    - The attraction between particles
    - Air pressure
    - Gravity from the Sun
    answer: The attraction between particles
    difficulty: 2
    hints:
    - Particles pull on each other.
    - In solids this pull is strongest.
    solution: Particles attract each other; in solids the attraction is strong enough to hold them in place.
    mistakes:
      Air pressure: c8s7_states
      Gravity from the Sun: c8s7_states
  - prompt: Why does water flow but ice does not?
    options:
    - Water particles can slide past each other; ice particles are held in place
    - Ice has no particles
    - Water is heavier than ice
    answer: Water particles can slide past each other; ice particles are held in place
    difficulty: 1
    hints:
    - Water is a liquid; ice is a solid.
    - Compare how free their particles are.
    solution: In liquid water particles slide past each other, so it flows. In ice they are fixed.
    mistakes:
      Ice has no particles: t8_spaces_liquid
      Water is heavier than ice: t8_spaces_liquid
- code: cbse8s.matter.change
  title: Changes of state
  after:
  - cbse8s.matter.particles
  notes: |
    Heating gives particles more energy. Melting: solid → liquid at the melting point (ice at 0 °C). Boiling:
    liquid → gas at the boiling point (water at 100 °C at sea level); evaporation happens at any temperature
    from the surface, faster when it is hot, windy or dry, and it cools things. Condensation: gas → liquid;
    freezing: liquid → solid. Sublimation: solid → gas directly (camphor, naphthalene, dry ice). During melting
    and boiling the temperature stays constant until the change is complete.
  explanations:
    text: Heating or cooling changes the state of matter. Ice melts into water, water boils into steam, steam condenses back into water and water freezes into ice. Some solids, like camphor, turn straight into a gas.
    visual: 'Draw a cycle: ice → (melting) → water → (boiling or evaporation) → steam → (condensation) → water → (freezing) → ice. Add camphor going straight to gas.'
    step_by_step: 'Step 1: Find the starting state. Step 2: Decide whether it is being heated or cooled. Step 3: Heating: solid → liquid (melting) → gas (boiling). Step 4: Cooling: gas → liquid (condensation) → solid (freezing).'
    real_world: Water in an earthen pot (matka) stays cool because water seeping through the pot evaporates from its surface, taking heat away.
  picture:
    kind: flow
    steps:
    - Ice (solid)
    - Melting at 0 °C
    - Water (liquid)
    - Boiling at 100 °C
    - Steam (gas)
    - Condensation back to water
    alt: 'Water changing state: ice melts at 0 degrees, water boils at 100 degrees into steam, and steam condenses back into water.'
  activity:
    type: sort
    prompt: What change of state is happening?
    bins:
    - Melting
    - Freezing
    - Evaporation
    - Condensation
    - Sublimation
    items:
    - label: Ice cream dripping on a hot day
      bin: Melting
      clue: Solid to liquid.
      why: Melting.
    - label: Butter on hot toast
      bin: Melting
      clue: It turns runny.
      why: Solid to liquid.
    - label: Water in an ice tray in the freezer
      bin: Freezing
      clue: Liquid becomes solid.
      why: Freezing.
    - label: Candle wax setting after dripping
      bin: Freezing
      clue: Runny wax hardens as it cools.
      why: Liquid to solid.
    - label: Wet clothes drying on a line
      bin: Evaporation
      clue: Where does the water go?
      why: Liquid to gas, slowly.
    - label: A puddle disappearing in the sun
      bin: Evaporation
      clue: Liquid water becomes vapour.
      why: Evaporation.
    - label: Droplets on a glass of cold water
      bin: Condensation
      clue: Water vapour in the air meets the cold glass.
      why: Gas to liquid.
    - label: A bathroom mirror fogging up
      bin: Condensation
      clue: Steam meets a cool surface.
      why: Gas to liquid.
    - label: Camphor disappearing from a dish
      bin: Sublimation
      clue: No liquid ever forms.
      why: Solid straight to gas.
    - label: Naphthalene balls shrinking in a cupboard
      bin: Sublimation
      clue: They never get wet.
      why: Solid to gas directly.
  lesson:
    - teach: 'Heating or cooling can change a substance''s state. Melting: solid → liquid (ice melts at 0 °C). Boiling: liquid → gas, all through the liquid, at the boiling point (water boils at 100 °C at sea level). Cooling reverses these: condensation is gas → liquid, and freezing is liquid → solid.'
      picture:
        kind: flow
        steps:
        - Solid
        - melting →
        - Liquid
        - boiling →
        - Gas
        alt: Heating changes a solid into a liquid by melting, and a liquid into a gas by boiling.
      check:
        prompt: What is the change from gas to liquid called?
        options:
        - Condensation
        - Melting
        - Evaporation
        answer: Condensation
        why: 'Cooling a gas turns it back into a liquid: condensation.'
    - teach: 'Evaporation also turns liquid into gas, but only from the surface and at any temperature. It is faster when it is hot, windy, dry or the surface is spread out. Evaporation cools: sweat cools our skin, and water in a clay pot stays cool.'
      picture:
        kind: compare
        columns:
        - title: Faster evaporation
          points:
          - Hot
          - Windy
          - Dry air
          - Large surface
        - title: Slower evaporation
          points:
          - Cold
          - Still air
          - Humid air
          - Small surface
        alt: Evaporation is faster when it is hot, windy, dry and spread out, and slower when cold, still, humid and small.
      check:
        prompt: Why do clothes dry faster when spread out than when bunched up?
        options:
        - A larger surface evaporates faster
        - Bunched clothes are hotter
        - Spreading adds water
        answer: A larger surface evaporates faster
        why: Evaporation happens at the surface, so more surface means faster drying.
    - teach: 'While a substance changes state, its temperature stays the same: melting ice stays at 0 °C until it has all melted, because the heat goes into freeing the particles. A few solids, such as camphor and naphthalene, change straight into gas without melting: sublimation.'
      check:
        prompt: Naphthalene balls get smaller in a cupboard without leaving a liquid. Why?
        options:
        - They sublime straight into gas
        - They melt
        - Insects eat them
        answer: They sublime straight into gas
        why: 'Naphthalene changes directly from solid to gas: sublimation.'
  items:
  - prompt: What is the change from liquid to gas at 100 °C called for water?
    options:
    - Boiling
    - Melting
    - Freezing
    - Condensation
    answer: Boiling
    difficulty: 1
    hints:
    - Bubbles form throughout.
    - At the boiling point.
    solution: Water boils at 100 °C (at sea level).
    mistakes: {"Melting": "t8_boiling", "Condensation": "t8_boiling"}
  - prompt: Water drops form on the outside of a cold glass. Why?
    options:
    - Water vapour in the air condenses
    - Water leaks through the glass
    - The glass melts
    - Ice sublimes
    answer: Water vapour in the air condenses
    difficulty: 2
    hints:
    - Where did the water come from?
    - The air.
    solution: Water vapour in the air cools on the glass and condenses into drops.
    mistakes: {"Water leaks through the glass": "t8_condense", "Ice sublimes": "t8_condense"}
  - prompt: Which substance sublimes?
    options:
    - Camphor
    - Ice
    - Wax
    - Salt
    answer: Camphor
    difficulty: 2
    hints:
    - It disappears without melting.
    - Used in pujas.
    solution: Camphor changes straight from solid to gas.
    mistakes: {"Ice": "t8_sublime", "Wax": "t8_sublime"}
  - prompt: Why do wet clothes dry faster on a sunny, windy day?
    options:
    - Heat and wind speed up evaporation
    - Wind adds water
    - The sun freezes the water
    - Clothes absorb the wind
    answer: Heat and wind speed up evaporation
    difficulty: 1
    hints:
    - Evaporation depends on conditions.
    - Warm and windy helps.
    solution: Higher temperature and wind both increase the rate of evaporation.
    mistakes: {"Wind adds water": "t8_evaporation_rate", "The sun freezes the water": "t8_evaporation_rate"}
  - prompt: What is the melting point of ice, in °C?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - The temperature ice turns to water.
    - Same as the freezing point of water.
    solution: Ice melts at 0 °C.
    mistakes: {"100": "t8_melting_point", "32": "t8_melting_point"}
  - prompt: While ice is melting, what happens to its temperature?
    options:
    - It stays the same until all the ice has melted
    - It rises quickly
    - It falls
    - It jumps to 100 °C
    answer: It stays the same until all the ice has melted
    difficulty: 3
    hints:
    - The heat is used to break the particle arrangement.
    - Constant at 0 °C.
    solution: During melting, heat energy goes into changing state, so the temperature stays at 0 °C.
    mistakes: {"It rises quickly": "t8_latent", "It jumps to 100 °C": "t8_latent"}
  - prompt: What is the change from liquid to solid called?
    options:
    - Freezing
    - Melting
    - Condensation
    answer: Freezing
    difficulty: 1
    hints:
    - Water in the freezer turns to ice.
    - Melting is the reverse.
    solution: Liquid → solid is freezing.
    mistakes:
      Melting: c8s7_change_name
      Condensation: c8s7_change_name
  - prompt: At what temperature does pure water boil at sea level, in °C?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - It is a round number.
    - Ice melts at 0 °C.
    solution: Pure water boils at 100 °C at sea level.
    mistakes:
      '0': c8s7_boil_point
      '50': c8s7_boil_point
  - prompt: Why do we feel cool after sweating?
    options:
    - Evaporating sweat takes heat from the skin
    - Sweat is cold water
    - Sweat blocks the sun
    answer: Evaporating sweat takes heat from the skin
    difficulty: 2
    hints:
    - Sweat evaporates.
    - Evaporation needs heat.
    solution: Sweat takes heat from the skin as it evaporates, cooling us.
    mistakes:
      Sweat is cold water: c8s7_cooling
      Sweat blocks the sun: c8s7_cooling
  - prompt: Why does water stay cool in a clay pot (matka)?
    options:
    - Water seeps out and evaporates from the surface, taking heat
    - Clay is cold by nature
    - The pot keeps out air
    answer: Water seeps out and evaporates from the surface, taking heat
    difficulty: 3
    hints:
    - Clay has tiny pores.
    - What does evaporation do to temperature?
    solution: Water seeps through the pores and evaporates, taking heat away, so the water inside stays cool.
    mistakes:
      Clay is cold by nature: c8s7_cooling
      The pot keeps out air: c8s7_cooling
  - prompt: On which day will washing dry fastest?
    options:
    - Hot, dry and windy
    - Cold and still
    - Humid and cloudy
    answer: Hot, dry and windy
    difficulty: 1
    hints:
    - Evaporation likes heat and wind.
    - Dry air takes in more vapour.
    solution: Heat, wind and dry air all speed up evaporation.
    mistakes:
      Cold and still: c8s7_evap_factors
      Humid and cloudy: c8s7_evap_factors
  - prompt: Mist forms on a bathroom mirror after a hot shower. Which change is this?
    options:
    - Condensation
    - Evaporation
    - Sublimation
    answer: Condensation
    difficulty: 2
    hints:
    - Water vapour meets a cold surface.
    - Gas → liquid.
    solution: 'Hot water vapour cools on the mirror and turns into tiny drops: condensation.'
    mistakes:
      Evaporation: t8_condense
      Sublimation: t8_condense
  - prompt: Ice is heated and its temperature is measured. While it is melting, the thermometer shows…
    options:
    - 0 °C, without changing
    - a steady rise
    - 100 °C
    answer: 0 °C, without changing
    difficulty: 2
    hints:
    - The heat is used to free particles.
    - The temperature waits until all the ice has melted.
    solution: During melting the temperature stays at 0 °C; the heat goes into changing the state.
    mistakes:
      a steady rise: t8_latent
      100 °C: t8_melting_point
  - prompt: How is evaporation different from boiling?
    options:
    - Evaporation happens at any temperature from the surface
    - Evaporation happens only at 100 °C
    - Boiling happens only at the surface
    answer: Evaporation happens at any temperature from the surface
    difficulty: 2
    hints:
    - A puddle dries without boiling.
    - Boiling happens all through the liquid at one temperature.
    solution: Evaporation is slow, from the surface, at any temperature; boiling is fast, all through the liquid, at the boiling point.
    mistakes:
      Evaporation happens only at 100 °C: t8_evaporation_rate
      Boiling happens only at the surface: t8_boiling
  - prompt: Which is an example of sublimation?
    options:
    - Dry ice turning into gas
    - Butter melting
    - Water freezing
