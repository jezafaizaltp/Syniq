# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 3. Format: content/README.md.
subject: cbse8-sci
chapter: 3
title: 'Health: The Ultimate Treasure'
tips:
  t8_balanced: "A balanced meal has energy food, body-building food and protective food. Which choice has all three?"
  t8_cholera: "Cholera spreads where water and food are unclean."
  t8_fibre: "Fibre isn't digested. So what job can it do as it passes through?"
  t8_handwash: "Which habit removes germs before they reach your mouth?"
  t8_iodine: "Iodine is used by the thyroid gland. What condition makes the thyroid swell?"
  t8_iron: "Iron makes haemoglobin in red blood cells. What happens with too few red blood cells?"
  t8_jenner: "The first vaccine (1796) was against smallpox, using cowpox. Fleming found penicillin."
  t8_mosquito: "Which disease does a mosquito carry from person to person?"
  t8_non_communicable: "Can you catch it from someone? A non-communicable disease does not spread."
  t8_protein: "Which nutrient do bodybuilders and growing children need for building muscles and tissues?"
  t8_vaccine: "A vaccine is like a practice drill for your body. What does it prepare?"
  t8_vitamin_c: "Scurvy was common on long sea voyages until sailors ate citrus fruit. Which vitamin is in citrus?"

concepts:
- code: cbse8s.health.diet
  title: A balanced diet
  notes: |
    Good health is physical, mental and social well-being. A balanced diet has the right amounts of
    carbohydrates and fats (energy), proteins (growth and repair), vitamins and minerals (protection), fibre
    (digestion) and water. Lack of a nutrient causes deficiency diseases: vitamin C → scurvy, vitamin D →
    rickets, vitamin A → night blindness, iron → anaemia, iodine → goitre. Too much junk food can lead to
    obesity; regular exercise, sleep and clean habits also keep us healthy.
  explanations:
    text: 'A balanced diet gives your body everything it needs in the right amounts: energy foods like rice and roti, body-building foods like dal and eggs, and protective foods like fruits and vegetables, plus water and fibre. Missing a nutrient for a long time causes a deficiency disease.'
    visual: 'Draw a plate split into sections: half vegetables and fruit, a quarter grains, a quarter proteins, with a glass of water beside it.'
    step_by_step: 'Step 1: Check the meal has an energy food (carbohydrate or fat). Step 2: Check for a protein. Step 3: Check for fruits or vegetables (vitamins, minerals, fibre). Step 4: Drink enough water. Step 5: Limit very sugary, salty or fried food.'
    real_world: 'A meal of rice, dal, a green vegetable and curd covers energy, protein, vitamins and calcium: a balanced Indian thali.'
  picture:
    kind: bars
    bars:
    - label: Vegetables & fruit
      value: 50
    - label: Grains
      value: 25
    - label: Proteins
      value: 25
    unit: '% of the plate'
    caption: 'A healthy plate: half vegetables and fruit, a quarter grains, a quarter proteins.'
    alt: Bars showing a healthy plate with 50 per cent vegetables and fruit, 25 per cent grains and 25 per cent proteins.
  activity:
    type: sort
    prompt: What does each food mainly give your body?
    bins:
    - Energy-giving
    - Body-building
    - Protective
    items:
    - label: Rice
      bin: Energy-giving
      clue: Mostly starch, a carbohydrate.
      why: Carbohydrates give energy.
    - label: Roti
      bin: Energy-giving
      clue: Made from wheat flour, full of starch.
      why: 'Carbohydrate: energy.'
    - label: Ghee
      bin: Energy-giving
      clue: A fat. Fats give the most energy per gram.
      why: 'Fat: energy.'
    - label: Dal
      bin: Body-building
      clue: Rich in protein.
      why: Protein builds and repairs the body.
    - label: Eggs
      bin: Body-building
      clue: High in protein.
      why: Protein.
    - label: Paneer
      bin: Body-building
      clue: Made from milk protein.
      why: Protein.
    - label: Oranges
      bin: Protective
      clue: Full of vitamin C.
      why: Vitamins protect against disease.
    - label: Spinach
      bin: Protective
      clue: Iron and vitamins.
      why: Vitamins and minerals.
    - label: Carrots
      bin: Protective
      clue: Vitamin A for the eyes.
      why: Vitamins.
  items:
  - prompt: Which nutrient mainly helps the body grow and repair?
    options:
    - Proteins
    - Carbohydrates
    - Fats
    - Fibre
    answer: Proteins
    difficulty: 1
    hints:
    - Body-building food.
    - Dal, eggs, milk.
    solution: Proteins build and repair body tissues.
    mistakes: {"Carbohydrates": "t8_protein", "Fats": "t8_protein"}
  - prompt: Lack of which vitamin causes scurvy (bleeding gums)?
    options:
    - Vitamin C
    - Vitamin A
    - Vitamin D
    - Vitamin B
    answer: Vitamin C
    difficulty: 1
    hints:
    - Found in citrus fruits and amla.
    - C...
    solution: Vitamin C deficiency causes scurvy.
    mistakes: {"Vitamin A": "t8_vitamin_c", "Vitamin D": "t8_vitamin_c"}
  - prompt: 'Lack of iron in the diet causes:'
    options:
    - Anaemia
    - Goitre
    - Rickets
    - Scurvy
    answer: Anaemia
    difficulty: 2
    hints:
    - Iron is needed for blood.
    - Tiredness, pale skin.
    solution: Iron is needed to make haemoglobin; too little causes anaemia.
    mistakes: {"Goitre": "t8_iron", "Rickets": "t8_iron"}
  - prompt: Why do we need fibre (roughage)?
    options:
    - It helps food move through the gut
    - It gives the most energy
    - It builds muscles
    - It makes bones strong
    answer: It helps food move through the gut
    difficulty: 2
    hints:
    - Found in vegetables and whole grains.
    - Prevents constipation.
    solution: Fibre helps digestion and prevents constipation.
    mistakes: {"It gives the most energy": "t8_fibre", "It builds muscles": "t8_fibre"}
  - prompt: Which meal is the most balanced?
    options:
    - Rice, dal, a vegetable and curd
    - Chips and a cold drink
    - Only fruit
    - Only rice
    answer: Rice, dal, a vegetable and curd
    difficulty: 1
    hints:
    - Look for energy, protein and vitamins.
    - Which has all three?
    solution: Rice (energy), dal and curd (protein, calcium) and a vegetable (vitamins, fibre) make a balanced meal.
    mistakes: {"Only fruit": "t8_balanced", "Only rice": "t8_balanced"}
  - prompt: 'Lack of iodine causes:'
    options:
    - Goitre
    - Night blindness
    - Anaemia
    - Rickets
    answer: Goitre
    difficulty: 2
    hints:
    - A swelling in the neck.
    - Iodised salt prevents it.
    solution: Iodine deficiency causes goitre, a swollen thyroid gland.
    mistakes: {"Night blindness": "t8_iodine", "Anaemia": "t8_iodine"}
- code: cbse8s.health.disease
  title: Diseases, immunity and vaccines
  after:
  - cbse8s.health.diet
  notes: |
    Communicable (infectious) diseases are caused by microbes and spread through air (TB, flu), water and food
    (cholera, typhoid), insects (malaria and dengue by mosquitoes) or contact. Non-communicable diseases
    (diabetes, heart disease, cancer) do not spread from person to person and are linked to lifestyle and
    genes. The immune system fights germs; vaccines train it by exposing it to a weakened or killed germ, so
    the body remembers it. Edward Jenner made the first vaccine (smallpox, 1796). Hand-washing, clean water
    and stopping mosquito breeding prevent many diseases.
  explanations:
    text: Some diseases are caught from germs and can spread (communicable), like flu or malaria. Others, like diabetes, can't be caught. Your immune system fights germs, and a vaccine is a safe practice run that teaches it to recognise a germ before you ever meet the real thing.
    visual: Draw a germ entering the body, the immune system making defenders (antibodies), and a 'memory' note kept for next time. A vaccine shows the immune system a harmless copy so the memory is ready in advance.
    step_by_step: 'Step 1: Ask whether the disease spreads between people. Step 2: If it does, find how (air, water, insects, contact). Step 3: Block that route: masks, clean water, nets, hand-washing. Step 4: Get vaccinated where a vaccine exists.'
    real_world: India ended polio through repeated vaccination drives (pulse polio); the WHO declared India polio-free in 2014.
  picture:
    kind: compare
    columns:
    - title: Communicable
      points:
      - Caused by microbes
      - Spreads between people
      - TB, malaria, cholera
      - Vaccines, hygiene
    - title: Non-communicable
      points:
      - Not caused by germs
      - Does not spread
      - Diabetes, heart disease
      - Diet, exercise
    alt: Communicable diseases are caused by microbes and spread; non-communicable diseases like diabetes don't spread and are linked to lifestyle.
    caption: Can you catch it? That decides which kind it is.
  activity:
    type: sort
    prompt: Can you catch it from someone, or not?
    bins:
    - Spread by germs
    - Not caught from others
    items:
    - label: Flu
      bin: Spread by germs
      clue: Does it pass from person to person through coughs?
      why: A virus spreads it.
    - label: Tuberculosis
      bin: Spread by germs
      clue: Bacteria in the air when someone coughs.
      why: Communicable.
    - label: Malaria
      bin: Spread by germs
      clue: Carried by a mosquito from one person to another.
      why: A protozoan carried by mosquitoes.
    - label: Chickenpox
      bin: Spread by germs
      clue: Can one child pass it to a classmate?
      why: A virus.
    - label: Diabetes
      bin: Not caught from others
      clue: Is it caused by a germ?
      why: It's about how the body handles sugar.
    - label: High blood pressure
      bin: Not caught from others
      clue: Can sitting near someone give you this?
      why: Not caused by germs.
    - label: Scurvy
      bin: Not caught from others
      clue: Caused by too little vitamin C.
      why: A deficiency disease.
    - label: Night blindness
      bin: Not caught from others
      clue: Linked to too little vitamin A.
      why: A deficiency, not an infection.
  items:
  - prompt: Which disease is spread by mosquitoes?
    options:
    - Malaria
    - Cholera
    - Diabetes
    - Tuberculosis
    answer: Malaria
    difficulty: 1
    hints:
    - Think of bed nets.
    - Anopheles mosquito.
    solution: Malaria spreads through the bite of the female Anopheles mosquito.
    mistakes: {"Cholera": "t8_mosquito", "Tuberculosis": "t8_mosquito"}
  - prompt: Which is a non-communicable disease?
    options:
    - Diabetes
    - Flu
    - Typhoid
    - COVID-19
    answer: Diabetes
    difficulty: 1
    hints:
    - You can't catch it.
    - Linked to blood sugar.
    solution: Diabetes doesn't spread from person to person.
    mistakes: {"Flu": "t8_non_communicable", "Typhoid": "t8_non_communicable"}
  - prompt: How does a vaccine protect you?
    options:
    - It trains the immune system to recognise a germ
    - It kills all germs in the body forever
    - It replaces your blood
    - It is a type of food
    answer: It trains the immune system to recognise a germ
    difficulty: 2
    hints:
    - It uses a weakened or killed germ.
    - The body remembers.
    solution: A vaccine safely shows the immune system a germ so it can fight the real one quickly.
    mistakes: {"It kills all germs in the body forever": "t8_vaccine", "It is a type of food": "t8_vaccine"}
  - prompt: Who developed the first vaccine, against smallpox?
    options:
    - Edward Jenner
    - Alexander Fleming
    - Louis Pasteur
    - Robert Koch
    answer: Edward Jenner
    difficulty: 2
    hints:
    - In 1796.
    - He used cowpox.
    solution: Edward Jenner made the first vaccine, for smallpox, in 1796.
    mistakes: {"Alexander Fleming": "t8_jenner", "Louis Pasteur": "t8_jenner"}
  - prompt: How does cholera usually spread?
    options:
    - Through dirty water and food
    - Through mosquito bites
    - Through sunlight
    - It doesn't spread
    answer: Through dirty water and food
    difficulty: 2
    hints:
    - It affects the gut.
    - Clean water prevents it.
    solution: Cholera spreads through water and food contaminated with the bacterium.
    mistakes: {"Through mosquito bites": "t8_cholera", "It doesn't spread": "t8_cholera"}
  - prompt: Which habit best prevents many infections?
    options:
    - Washing hands with soap
    - Skipping breakfast
    - Staying indoors always
    - Eating more sugar
    answer: Washing hands with soap
    difficulty: 1
    hints:
    - Germs spread by touch.
    - Soap removes them.
    solution: Washing hands with soap removes germs and prevents many infections.
    mistakes: {"Staying indoors always": "t8_handwash", "Eating more sugar": "t8_handwash"}
