# CBSE Class 8 Science (NCERT Curiosity, 2025), chapter 3. Format: content/README.md.
subject: cbse8-sci
chapter: 3
title: 'Health: The Ultimate Treasure'
tips:
  t8_balanced: "A balanced meal has energy food, body-building food and protective food. Which choice has all three?"
  t8_cholera: "Cholera spreads where water and food are unclean."
  t8_fibre: "Fibre isn't digested. So what job can it do as it passes through?"
  t8_handwash: "Which habit removes germs before they reach your mouth?"
  t8_iodine: "Iodine is used by the thyroid gland. What condition makes the thyroid swell?"
  t8_iron: "Iron makes haemoglobin in red blood cells. What happens with too few red blood cells?"
  t8_jenner: "The first vaccine (1796) was against smallpox, using cowpox. Fleming found penicillin."
  t8_mosquito: "Which disease does a mosquito carry from person to person?"
  t8_non_communicable: "Can you catch it from someone? A non-communicable disease does not spread."
  t8_protein: "Which nutrient do bodybuilders and growing children need for building muscles and tissues?"
  t8_vaccine: "A vaccine is like a practice drill for your body. What does it prepare?"
  t8_vitamin_c: "Scurvy was common on long sea voyages until sailors ate lemons and oranges. Which vitamin are citrus fruits famous for?"
  c8s3_nutrient_job: 'Match each nutrient to its job: energy, growth and repair, protection, or digestion.'
  c8s3_deficiency: Each deficiency disease comes from missing one nutrient. Recall which vitamin or mineral goes with which disease.
  c8s3_plate: A balanced plate has an energy food, a body-building food, and a protective food such as fruit or vegetables.
  c8s3_spread: 'Think about how the germ travels: through air, water and food, insects, or touch.'
  c8s3_communicable: Can it pass from one person to another? Germs spread; lifestyle diseases don't.
  c8s3_immunity: A vaccine shows the body a harmless form of a germ, so it is ready next time.

concepts:
- code: cbse8s.health.diet
  title: A balanced diet
  notes: |
    Good health is physical, mental and social well-being. A balanced diet has the right amounts of
    carbohydrates and fats (energy), proteins (growth and repair), vitamins and minerals (protection), fibre
    (digestion) and water. Lack of a nutrient causes deficiency diseases: vitamin C → scurvy, vitamin D →
    rickets, vitamin A → night blindness, iron → anaemia, iodine → goitre. Too much junk food can lead to
    obesity; regular exercise, sleep and clean habits also keep us healthy.
  explanations:
    text: 'A balanced diet gives your body everything it needs in the right amounts: energy foods like rice and roti, body-building foods like dal and eggs, and protective foods like fruits and vegetables, plus water and fibre. Missing a nutrient for a long time causes a deficiency disease.'
    visual: 'Draw a plate split into sections: half vegetables and fruit, a quarter grains, a quarter proteins, with a glass of water beside it.'
    step_by_step: 'Step 1: Check the meal has an energy food (carbohydrate or fat). Step 2: Check for a protein. Step 3: Check for fruits or vegetables (vitamins, minerals, fibre). Step 4: Drink enough water. Step 5: Limit very sugary, salty or fried food.'
    real_world: 'A meal of rice, dal, a green vegetable and curd covers energy, protein, vitamins and calcium: a balanced Indian thali.'
  picture:
    kind: bars
    bars:
    - label: Vegetables & fruit
      value: 50
    - label: Grains
      value: 25
    - label: Proteins
      value: 25
    unit: '% of the plate'
    caption: 'A healthy plate: half vegetables and fruit, a quarter grains, a quarter proteins.'
    alt: Bars showing a healthy plate with 50 per cent vegetables and fruit, 25 per cent grains and 25 per cent proteins.
  activity:
    type: sort
    prompt: What does each food mainly give your body?
    bins:
    - Energy-giving
    - Body-building
    - Protective
    items:
    - label: Rice
      bin: Energy-giving
      clue: Mostly starch, a carbohydrate.
      why: Carbohydrates give energy.
    - label: Roti
      bin: Energy-giving
      clue: Made from wheat flour, full of starch.
      why: 'Carbohydrate: energy.'
    - label: Ghee
      bin: Energy-giving
      clue: A fat. Fats give the most energy per gram.
      why: 'Fat: energy.'
    - label: Dal
      bin: Body-building
      clue: Rich in protein.
      why: Protein builds and repairs the body.
    - label: Eggs
      bin: Body-building
      clue: High in protein.
      why: Protein.
    - label: Paneer
      bin: Body-building
      clue: Made from milk protein.
      why: Protein.
    - label: Oranges
      bin: Protective
      clue: Full of vitamin C.
      why: Vitamins protect against disease.
    - label: Spinach
      bin: Protective
      clue: Iron and vitamins.
      why: Vitamins and minerals.
    - label: Carrots
      bin: Protective
      clue: Vitamin A for the eyes.
      why: Vitamins.
  lesson:
    - teach: Good health means being well in body, mind and with other people. Food gives us nutrients. Carbohydrates and fats give energy. Proteins build and repair the body. Vitamins and minerals protect us. Fibre helps food move through the gut, and water carries everything around.
      picture:
        kind: compare
        columns:
        - title: Nutrient
          points:
          - Carbohydrates, fats
          - Proteins
          - Vitamins, minerals
          - Fibre
        - title: Job
          points:
          - Energy
          - Growth and repair
          - Protection
          - Digestion
        - title: Found in
          points:
          - Rice, roti, oil
          - Dal, egg, milk
          - Fruit, vegetables
          - Whole grains, vegetables
        alt: Carbohydrates and fats give energy, proteins build the body, vitamins and minerals protect it, and fibre helps digestion.
      check:
        prompt: Which food is rich in protein?
        options:
        - Dal
        - Sugar
        - Butter
        answer: Dal
        why: Pulses such as dal are a good source of protein. Sugar and butter mainly give energy.
    - teach: 'A balanced diet has all the nutrients in the right amounts. A plate of rice, dal, a vegetable and curd is balanced: energy, protein, protection and some fibre. Eating only one kind of food, even a healthy one, is not balanced.'
      check:
        prompt: Which meal is balanced?
        options:
        - Roti, dal, spinach and a banana
        - Only chips and a cola
        - Three bowls of rice
        answer: Roti, dal, spinach and a banana
        why: It has energy (roti), protein (dal), and vitamins, minerals and fibre (spinach and banana).
    - teach: 'Missing a nutrient for a long time causes a deficiency disease. Too little vitamin C: scurvy (bleeding gums). Vitamin D: rickets (soft, bent bones). Vitamin A: night blindness. Iron: anaemia (tiredness, pale skin). Iodine: goitre (swollen neck).'
      picture:
        kind: compare
        columns:
        - title: Missing
          points:
          - Vitamin C
          - Vitamin D
          - Vitamin A
          - Iron
          - Iodine
        - title: Disease
          points:
          - Scurvy
          - Rickets
          - Night blindness
          - Anaemia
          - Goitre
        alt: 'Deficiency diseases: no vitamin C causes scurvy, D rickets, A night blindness, iron anaemia, iodine goitre.'
      check:
        prompt: Lack of vitamin D causes…
        options:
        - Rickets
        - Scurvy
        - Goitre
        answer: Rickets
        why: Vitamin D helps bones take in calcium. Without it bones become soft and bend.
  items:
  - prompt: Which nutrient mainly helps the body grow and repair?
    options:
    - Proteins
    - Carbohydrates
    - Fats
    - Fibre
    answer: Proteins
    difficulty: 1
    hints:
    - Body-building food.
    - Dal, eggs, milk.
    solution: Proteins build and repair body tissues.
    mistakes: {"Carbohydrates": "t8_protein", "Fats": "t8_protein"}
  - prompt: Lack of which vitamin causes scurvy (bleeding gums)?
    options:
    - Vitamin C
    - Vitamin A
    - Vitamin D
    - Vitamin B
    answer: Vitamin C
    difficulty: 1
    hints:
    - Found in citrus fruits and amla.
    - C...
    solution: Vitamin C deficiency causes scurvy.
    mistakes: {"Vitamin A": "t8_vitamin_c", "Vitamin D": "t8_vitamin_c"}
  - prompt: 'Lack of iron in the diet causes:'
    options:
    - Anaemia
    - Goitre
    - Rickets
    - Scurvy
    answer: Anaemia
    difficulty: 2
    hints:
    - Iron is needed for blood.
    - Tiredness, pale skin.
    solution: Iron is needed to make haemoglobin; too little causes anaemia.
    mistakes: {"Goitre": "t8_iron", "Rickets": "t8_iron"}
  - prompt: Why do we need fibre (roughage)?
    options:
    - It helps food move through the gut
    - It gives the most energy
    - It builds muscles
    - It makes bones strong
    answer: It helps food move through the gut
    difficulty: 2
    hints:
    - Found in vegetables and whole grains.
    - Prevents constipation.
    solution: Fibre helps digestion and prevents constipation.
    mistakes: {"It gives the most energy": "t8_fibre", "It builds muscles": "t8_fibre"}
  - prompt: Which meal is the most balanced?
    options:
    - Rice, dal, a vegetable and curd
    - Chips and a cold drink
    - Only fruit
    - Only rice
    answer: Rice, dal, a vegetable and curd
    difficulty: 1
    hints:
    - Look for energy, protein and vitamins.
    - Which has all three?
    solution: Rice (energy), dal and curd (protein, calcium) and a vegetable (vitamins, fibre) make a balanced meal.
    mistakes: {"Only fruit": "t8_balanced", "Only rice": "t8_balanced"}
  - prompt: 'Lack of iodine causes:'
    options:
    - Goitre
    - Night blindness
    - Anaemia
    - Rickets
    answer: Goitre
    difficulty: 2
    hints:
    - A swelling in the neck.
    - Iodised salt prevents it.
    solution: Iodine deficiency causes goitre, a swollen thyroid gland.
    mistakes: {"Night blindness": "t8_iodine", "Anaemia": "t8_iodine"}
  - prompt: Which nutrient gives us the most energy?
    options:
    - Carbohydrates and fats
    - Vitamins
    - Fibre
    answer: Carbohydrates and fats
    difficulty: 1
    hints:
    - Rice, roti and oil are rich in them.
    - Vitamins protect; fibre helps digestion.
    solution: Carbohydrates and fats are the body's main fuel.
    mistakes:
      Vitamins: c8s3_nutrient_job
      Fibre: c8s3_nutrient_job
  - prompt: Lack of vitamin A causes…
    options:
    - Night blindness
    - Rickets
    - Anaemia
    answer: Night blindness
    difficulty: 1
    hints:
    - Vitamin A helps the eyes.
    - Carrots are rich in it.
    solution: Vitamin A is needed for seeing in dim light; too little causes night blindness.
    mistakes:
      Rickets: c8s3_deficiency
      Anaemia: c8s3_deficiency
  - prompt: Why is iodised salt sold in India?
    options:
    - To prevent goitre
    - To prevent scurvy
    - To make food sweeter
    answer: To prevent goitre
    difficulty: 2
    hints:
    - Iodine is a mineral.
    - Its lack makes the neck swell.
    solution: Iodine is needed by the thyroid gland. Too little causes goitre, so iodine is added to salt.
    mistakes:
      To prevent scurvy: t8_iodine
      To make food sweeter: t8_iodine
  - prompt: A child is often tired and pale. Which nutrient might be missing?
    options:
    - Iron
    - Fibre
    - Fat
    answer: Iron
    difficulty: 2
    hints:
    - Blood carries oxygen using it.
    - Its lack causes anaemia.
    solution: Iron is needed to make blood. Too little causes anaemia, with tiredness and pale skin.
    mistakes:
      Fibre: c8s3_deficiency
      Fat: c8s3_deficiency
  - prompt: Which food is a good source of vitamin C?
    options:
    - Amla (gooseberry)
    - Rice
    - Ghee
    answer: Amla (gooseberry)
    difficulty: 1
    hints:
    - Sour fruits are rich in it.
    - Citrus fruits too.
    solution: Amla, oranges and lemons are rich in vitamin C.
    mistakes:
      Rice: t8_vitamin_c
      Ghee: t8_vitamin_c
  - prompt: Which part of a meal mainly helps prevent constipation?
    options:
    - Fibre from vegetables and whole grains
    - Sugar
    - Oil
    answer: Fibre from vegetables and whole grains
    difficulty: 1
    hints:
    - It is also called roughage.
    - It isn't digested, but it helps food move.
    solution: Fibre (roughage) adds bulk and helps food move through the gut.
    mistakes:
      Sugar: t8_fibre
      Oil: t8_fibre
  - prompt: Why is a diet of only fruit not balanced, even though fruit is healthy?
    options:
    - It lacks enough protein and fats
    - Fruit has no water
    - Fruit has too much protein
    answer: It lacks enough protein and fats
    difficulty: 3
    hints:
    - Fruit gives vitamins, minerals and fibre.
    - What builds the body?
    solution: Fruit gives vitamins, minerals, fibre and some sugar, but too little protein and fat for growth and energy.
    mistakes:
      Fruit has no water: c8s3_plate
      Fruit has too much protein: c8s3_plate
  - prompt: Bleeding gums are a sign of a lack of…
    options:
    - Vitamin C
    - Vitamin D
    - Iodine
    answer: Vitamin C
    difficulty: 2
    hints:
    - The disease is called scurvy.
    - Sailors once got it on long voyages without fresh fruit.
    solution: Too little vitamin C causes scurvy, with bleeding gums.
    mistakes:
      Vitamin D: c8s3_deficiency
      Iodine: c8s3_deficiency
  - prompt: Which nutrient helps a wound heal and muscles grow?
    options:
    - Protein
    - Carbohydrate
    - Fibre
    answer: Protein
    difficulty: 1
    hints:
    - It is the body-building nutrient.
    - Dal, eggs and milk have it.
    solution: Proteins build and repair body tissue, such as skin and muscle.
    mistakes:
      Carbohydrate: t8_protein
      Fibre: t8_protein
- code: cbse8s.health.disease
  title: Diseases, immunity and vaccines
  after:
  - cbse8s.health.diet
  notes: |
    Communicable (infectious) diseases are caused by microbes and spread through air (TB, flu), water and food
    (cholera, typhoid), insects (malaria and dengue by mosquitoes) or contact. Non-communicable diseases
    (diabetes, heart disease, cancer) do not spread from person to person and are linked to lifestyle and
    genes. The immune system fights germs; vaccines train it by exposing it to a weakened or killed germ, so
    the body remembers it. Edward Jenner made the first vaccine (smallpox, 1796). Hand-washing, clean water
    and stopping mosquito breeding prevent many diseases.
  explanations:
    text: Some diseases are caught from germs and can spread (communicable), like flu or malaria. Others, like diabetes, can't be caught. Your immune system fights germs, and a vaccine is a safe practice run that teaches it to recognise a germ before you ever meet the real thing.
    visual: Draw a germ entering the body, the immune system making defenders (antibodies), and a 'memory' note kept for next time. A vaccine shows the immune system a harmless copy so the memory is ready in advance.
    step_by_step: 'Step 1: Ask whether the disease spreads between people. Step 2: If it does, find how (air, water, insects, contact). Step 3: Block that route: masks, clean water, nets, hand-washing. Step 4: Get vaccinated where a vaccine exists.'
    real_world: India ended polio through repeated vaccination drives (pulse polio); the WHO declared India polio-free in 2014.
  picture:
    kind: compare
    columns:
    - title: Communicable
      points:
      - Caused by microbes
      - Spreads between people
      - TB, malaria, cholera
      - Vaccines, hygiene
    - title: Non-communicable
      points:
      - Not caused by germs
      - Does not spread
      - Diabetes, heart disease
      - Diet, exercise
    alt: Communicable diseases are caused by microbes and spread; non-communicable diseases like diabetes don't spread and are linked to lifestyle.
    caption: Can you catch it? That decides which kind it is.
  activity:
    type: sort
    prompt: Can you catch it from someone, or not?
    bins:
    - Spread by germs
    - Not caught from others
    items:
    - label: Flu
      bin: Spread by germs
      clue: Does it pass from person to person through coughs?
      why: A virus spreads it.
    - label: Tuberculosis
      bin: Spread by germs
      clue: Bacteria in the air when someone coughs.
      why: Communicable.
    - label: Malaria
      bin: Spread by germs
      clue: Carried by a mosquito from one person to another.
      why: A protozoan carried by mosquitoes.
    - label: Chickenpox
      bin: Spread by germs
      clue: Can one child pass it to a classmate?
      why: A virus.
    - label: Diabetes
      bin: Not caught from others
      clue: Is it caused by a germ?
      why: It's about how the body handles sugar.
    - label: High blood pressure
      bin: Not caught from others
      clue: Can sitting near someone give you this?
      why: Not caused by germs.
    - label: Scurvy
      bin: Not caught from others
      clue: Caused by too little vitamin C.
      why: A deficiency disease.
    - label: Night blindness
      bin: Not caught from others
      clue: Linked to too little vitamin A.
      why: A deficiency, not an infection.
  lesson:
    - teach: 'Communicable diseases are caused by germs and spread from person to person: through the air (TB, flu, common cold), through dirty water and food (cholera, typhoid), through insects (malaria and dengue by mosquitoes) or by touch.'
      picture:
        kind: compare
        columns:
        - title: Spreads through
          points:
          - Air
          - Water and food
          - Mosquitoes
        - title: Examples
          points:
          - TB, flu, cold
          - Cholera, typhoid
          - Malaria, dengue
        alt: Diseases spread by air include TB and flu, by water and food cholera and typhoid, and by mosquitoes malaria and dengue.
      check:
        prompt: How does typhoid usually spread?
        options:
        - Through dirty water and food
        - Through mosquito bites
        - By shaking hands only
        answer: Through dirty water and food
        why: Typhoid germs pass through water and food made dirty by an infected person's waste.
    - teach: Non-communicable diseases such as diabetes, heart disease and some cancers do not spread from person to person. They are linked to lifestyle (food, exercise, smoking) and to genes. Healthy food, exercise and sleep lower the risk.
      check:
        prompt: Which is a non-communicable disease?
        options:
        - Heart disease
        - Chickenpox
        - Common cold
        answer: Heart disease
        why: Heart disease doesn't spread by germs. Chickenpox and colds do.
    - teach: The immune system fights germs. A vaccine contains a weakened, dead or harmless part of a germ, so the body learns to recognise it and fights faster if the real germ comes. Edward Jenner made the first vaccine, against smallpox. Clean water, handwashing and mosquito nets stop many germs before they reach us.
      picture:
        kind: flow
        steps:
        - 'Vaccine: harmless form of a germ'
        - Body makes antibodies
        - Body remembers
        - Real germ is fought off fast
        alt: A vaccine shows the body a harmless germ, the body makes antibodies and remembers, then fights the real germ quickly.
      check:
        prompt: How does a vaccine protect us?
        options:
        - It trains the body to recognise a germ
        - It kills every germ in the house
        - It works only after we are ill
        answer: It trains the body to recognise a germ
        why: A vaccine prepares the immune system so it can act quickly against the real germ.
  items:
  - prompt: Which disease is spread by mosquitoes?
    options:
    - Malaria
    - Cholera
    - Diabetes
    - Tuberculosis
    answer: Malaria
    difficulty: 1
    hints:
    - Think of bed nets.
    - Anopheles mosquito.
    solution: Malaria spreads through the bite of the female Anopheles mosquito.
    mistakes: {"Cholera": "t8_mosquito", "Tuberculosis": "t8_mosquito"}
  - prompt: Which is a non-communicable disease?
    options:
    - Diabetes
    - Flu
    - Typhoid
    - COVID-19
    answer: Diabetes
    difficulty: 1
    hints:
    - You can't catch it.
    - Linked to blood sugar.
    solution: Diabetes doesn't spread from person to person.
    mistakes: {"Flu": "t8_non_communicable", "Typhoid": "t8_non_communicable"}
  - prompt: How does a vaccine protect you?
    options:
    - It trains the immune system to recognise a germ
    - It kills all germs in the body forever
    - It replaces your blood
    - It is a type of food
    answer: It trains the immune system to recognise a germ
    difficulty: 2
    hints:
    - It uses a weakened or killed germ.
    - The body remembers.
    solution: A vaccine safely shows the immune system a germ so it can fight the real one quickly.
    mistakes: {"It kills all germs in the body forever": "t8_vaccine", "It is a type of food": "t8_vaccine"}
  - prompt: Who developed the first vaccine, against smallpox?
    options:
    - Edward Jenner
    - Alexander Fleming
    - Louis Pasteur
    - Robert Koch
    answer: Edward Jenner
    difficulty: 2
    hints:
    - In 1796.
    - He used cowpox.
    solution: Edward Jenner made the first vaccine, for smallpox, in 1796.
    mistakes: {"Alexander Fleming": "t8_jenner", "Louis Pasteur": "t8_jenner"}
  - prompt: How does cholera usually spread?
    options:
    - Through dirty water and food
    - Through mosquito bites
    - Through sunlight
    - It doesn't spread
    answer: Through dirty water and food
    difficulty: 2
    hints:
    - It affects the gut.
    - Clean water prevents it.
    solution: Cholera spreads through water and food contaminated with the bacterium.
    mistakes: {"Through mosquito bites": "t8_cholera", "It doesn't spread": "t8_cholera"}
  - prompt: Which habit best prevents many infections?
    options:
    - Washing hands with soap
    - Skipping breakfast
    - Staying indoors always
    - Eating more sugar
    answer: Washing hands with soap
    difficulty: 1
    hints:
    - Germs spread by touch.
    - Soap removes them.
    solution: Washing hands with soap removes germs and prevents many infections.
    mistakes: {"Staying indoors always": "t8_handwash", "Eating more sugar": "t8_handwash"}
  - prompt: Which disease spreads through the air when an infected person coughs?
    options:
    - Tuberculosis
    - Cholera
    - Malaria
    answer: Tuberculosis
    difficulty: 1
    hints:
    - It affects the lungs.
    - Cholera spreads through water; malaria through mosquitoes.
    solution: TB germs spread through droplets in the air from coughs and sneezes.
    mistakes:
      Cholera: c8s3_spread
      Malaria: c8s3_spread
  - prompt: Which disease is spread by the Aedes mosquito, which bites in the daytime?
    options:
    - Dengue
    - Typhoid
    - Diabetes
    answer: Dengue
    difficulty: 1
    hints:
    - Mosquitoes breed in still water.
    - Typhoid spreads through water and food.
    solution: Dengue is spread by the Aedes mosquito.
    mistakes:
      Typhoid: t8_mosquito
      Diabetes: c8s3_communicable
  - prompt: Why should we not let water collect in old tyres and pots?
    options:
    - Mosquitoes breed in still water
    - It makes the water dirty for plants
    - It wastes water
    answer: Mosquitoes breed in still water
    difficulty: 2
    hints:
    - Which insects lay eggs in water?
    - They spread malaria and dengue.
    solution: Mosquitoes lay eggs in still water. Removing it cuts down mosquitoes and the diseases they spread.
    mistakes:
      It makes the water dirty for plants: t8_mosquito
      It wastes water: t8_mosquito
  - prompt: Which of these is NOT spread by germs?
    options:
    - Diabetes
    - Measles
    - Flu
    answer: Diabetes
    difficulty: 2
    hints:
    - Measles and flu are caused by viruses.
    - Which one is linked to lifestyle?
    solution: Diabetes is non-communicable. Measles and flu are caused by viruses and spread.
    mistakes:
      Measles: c8s3_communicable
      Flu: c8s3_communicable
  - prompt: Who made the first vaccine?
    options:
    - Edward Jenner
    - Alexander Fleming
    - Robert Hooke
    answer: Edward Jenner
    difficulty: 1
    hints:
    - It was against smallpox.
    - Fleming discovered penicillin; Hooke saw cells.
    solution: Edward Jenner made the smallpox vaccine in 1796.
    mistakes:
      Alexander Fleming: t8_jenner
      Robert Hooke: t8_jenner
  - prompt: Why do we wash hands with soap before eating?
    options:
    - To remove germs that could make us ill
    - To make our hands softer
    - To cool our hands
    answer: To remove germs that could make us ill
    difficulty: 1
    hints:
    - Hands touch many things.
    - Germs can go from hands to food to mouth.
    solution: Soap and water remove germs from hands, so they don't get into our food and mouths.
    mistakes:
      To make our hands softer: t8_handwash
      To cool our hands: t8_handwash
  - prompt: A vaccine usually contains…
    options:
    - A weakened, dead or harmless part of a germ
    - A strong, live germ
    - An antibiotic
    answer: A weakened, dead or harmless part of a germ
    difficulty: 2
    hints:
    - It must not make us ill.
    - But the body must still recognise it.
    solution: A vaccine uses a harmless form of the germ, so the body learns to fight it without getting the disease.
    mistakes:
      A strong, live germ: c8s3_immunity
      An antibiotic: c8s3_immunity
  - prompt: Why do antibiotics not cure a cold?
    options:
    - Colds are caused by viruses, and antibiotics work on bacteria
    - Colds are not caused by germs
    - Antibiotics only work on the skin
    answer: Colds are caused by viruses, and antibiotics work on bacteria
    difficulty: 3
    hints:
    - What kind of germ causes a cold?
    - What do antibiotics kill?
    solution: Antibiotics act on bacteria. A cold is caused by a virus, so antibiotics don't help.
    mistakes:
      Colds are not caused by germs: t8_infectious
      Antibiotics only work on the skin: t8_infectious
  - prompt: Which habit lowers the risk of heart disease?
    options:
    - Regular exercise
    - Eating fried food daily
    - Sleeping very little
    answer: Regular exercise
    difficulty: 1
    hints:
    - Heart disease is linked to lifestyle.
    - Which choice keeps the body fit?
    solution: Exercise keeps the heart and blood vessels healthy. Fried food and little sleep raise the risk.
    mistakes:
      Eating fried food daily: t8_non_communicable
      Sleeping very little: t8_non_communicable
