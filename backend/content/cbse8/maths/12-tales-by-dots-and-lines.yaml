# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 12 (Part 2 chapter 5). Format: content/README.md.
subject: cbse8-math
chapter: 12
title: Tales by Dots and Lines
tips:
  c8_mean_divide: That is the total. Divide it by how many values there are to get the mean.
  c8_median_order: Put the values in order first; the median is the middle of the ordered list.
  t8_add_to_each: "If every value goes up by 10, the mean goes up by 10 too."
  t8_freq_mean: "Multiply each mark by its number of students, add, then divide by the total number of students."
  t8_mean_sum: "Mean = sum ÷ count, so sum = mean × count."
  t8_mean_unknown: "Total needed = mean × number of values. Take away the known values."
  t8_median_even: "Put the numbers in order first. With an even count, the median is halfway between the two middle ones."
  t8_median_fifth: "In order, the middle (3rd) of five values is the median. Where could the fifth number sit so the middle one comes out right?"
  t8_median_freq: "With 15 pupils, the median is the 8th pupil. Count through the sizes to find the 8th."
  t8_median_order: "Order the numbers first, then take the middle one."
  t8_outlier: "Look at 54 next to the other values. What does one very large value do to the average?"
  t8_outlier_mean: "Adding one huge value: which changes more, the average or the middle value?"
concepts:
- code: cbse8m.data.mean
  title: The mean as a balance point
  notes: |
    The mean (average) of a set of values is their sum divided by how many there are. It is the balance
    point: the values above it and below it balance out (the deviations from the mean add to zero). Adding
    the same number to every value adds it to the mean. With frequencies, mean = Σfx ÷ Σf. One very large or
    small value can pull the mean a long way.
  explanations:
    text: 'The mean shares everything out equally. If five friends have 2, 4, 5, 7 and 7 sweets, together they have 25; shared equally, each gets 5. That 5 is the mean. It is also the balance point: the amounts above it make up for the amounts below it.'
    visual: 'Put the values as dots on a line. Imagine the line is a see-saw: it balances exactly at the mean. For 2, 4, 5, 7, 7 the distances below 5 (3 and 1) balance those above (2 and 2).'
    step_by_step: 'Step 1: Add all the values. Step 2: Count the values. Step 3: Divide the sum by the count. Step 4: With a frequency table, multiply each value by its frequency, add, and divide by the total frequency.'
    real_world: A batter's average is the total runs divided by the number of times out. One big score of 150 can lift a low average a lot.
  picture:
    kind: number_line
    from: 0
    to: 10
    points:
    - at: 2
      label: '2'
    - at: 4
      label: '4'
    - at: 5
      label: mean 5
    - at: 7
      label: 7, 7
    caption: '2, 4, 5, 7, 7 balance at 5: 3 + 1 below, 2 + 2 above.'
    alt: A number line with dots at 2, 4, 5 and two at 7, balancing at the mean 5.
  activity:
    type: formula
    prompt: 'Five scores: 6, 8, 9, 5 and x. Set x.'
    inputs:
    - name: x
      label: Fifth score x
      min: 0
      max: 30
      step: 1
      start: 0
    outputs:
    - name: total
      label: Total
      expr: 28+x
    - name: mean
      label: Mean
      expr: (28+x)/5
      places: 2
    goals:
    - prompt: Make the mean 8.
      want:
        mean: 8
      mistakes:
      - when:
          x: 8
        say: 'A score of 8 only keeps the mean where it is if the others balance at 8. They don''t: 6 + 8 + 9 + 5 = 28, 4 short of 4 × 8.'
      - when:
          total: 32
        say: Total 32 is 4 × 8, but there are 5 scores. The total must be 5 × 8.
    - prompt: Make the mean 6.
      want:
        mean: 6
      mistakes:
      - when:
          x: 6
        say: 'The other four already average 7. x must pull the mean down: total 5 × 6 = 30.'
    - prompt: Make the mean 9.
      want:
        mean: 9
      mistakes:
      - when:
          x: 9
        say: The other four average only 7, so x must be well above 9 to balance them. Total 45.
      - when:
          total: 36
        say: 36 = 4 × 9. Five scores need 5 × 9 = 45.
  items:
  - prompt: Find the mean of 4, 8, 6, 10 and 12.
    answer: '8'
    check: (4 + 8 + 6 + 10 + 12)/5
    difficulty: 1
    hints:
    - Sum = 40.
    - 40 ÷ 5.
    solution: 40 ÷ 5 = 8.
    mistakes:
      '40': c8_mean_divide
  - prompt: The mean of 5 numbers is 12. What is their sum?
    answer: '60'
    check: 12*5
    difficulty: 1
    hints:
    - Mean = sum ÷ count.
    - Sum = 12 × 5.
    solution: Sum = 12 × 5 = 60.
    mistakes: {"2.4": "t8_mean_sum", "17": "t8_mean_sum"}
  - prompt: The mean of 3, 7, x and 10 is 6. Find x.
    answer: '4'
    check: 4*6 - 20
    difficulty: 2
    hints:
    - The sum must be 4 × 6 = 24.
    - 3 + 7 + 10 = 20.
    solution: 24 − 20 = 4.
    mistakes: {"6": "t8_mean_unknown", "24": "t8_mean_unknown"}
  - prompt: Each of the values 2, 5, 8 is increased by 10. What is the new mean?
    answer: '15'
    check: (12 + 15 + 18)/3
    difficulty: 2
    hints:
    - The old mean is 5.
    - Adding 10 to every value adds 10 to the mean.
    solution: Old mean 5, new mean 15.
    mistakes: {"5": "t8_add_to_each", "45": "t8_add_to_each"}
  - prompt: Marks 5 (3 students), 7 (5 students), 9 (2 students). Find the mean mark. Type a decimal.
    answer: '6.8'
    check: Rational(5*3 + 7*5 + 9*2, 10)
    difficulty: 3
    hints:
    - Σfx = 15 + 35 + 18 = 68.
    - Σf = 10.
    solution: 68 ÷ 10 = 6.8.
    mistakes: {"7": "t8_freq_mean", "21": "t8_freq_mean"}
  - prompt: Values 3, 4, 5, 4, 54. Why is the mean (14) not a good typical value?
    options:
    - The one large value 54 pulls it up
    - The mean is always wrong
    - There are too few values
    - 4 appears twice
    answer: The one large value 54 pulls it up
    difficulty: 2
    hints:
    - Four values are 3 to 5.
    - One is much bigger.
    solution: The outlier 54 drags the mean far above the other values; the median, 4, is more typical.
    mistakes: {"There are too few values": "t8_outlier", "4 appears twice": "t8_outlier"}
- code: cbse8m.data.median
  title: The median, and mean versus median
  after:
  - cbse8m.data.mean
  notes: |
    The median is the middle value when the data are arranged in order. With an odd count n it is the
    ((n + 1)/2)th value; with an even count it is the mean of the two middle values. The median is not
    affected much by extreme values, so it is better than the mean for data with outliers (like incomes).
    With frequencies, count along the cumulative totals to find the middle position.
  explanations:
    text: 'Put the values in order and pick the one in the middle: that is the median. If there are two middle values, take the number halfway between them. One huge value doesn''t move the median much, which makes it useful when the data has an outlier.'
    visual: Line up nine children by height. The fifth child, with four on each side, has the median height.
    step_by_step: 'Step 1: Arrange the values in order. Step 2: Count them. Step 3: If the count is odd, take the middle one. Step 4: If it is even, add the two middle values and halve.'
    real_world: In a street where most families earn about ₹30,000 a month but one earns ₹5,00,000, the median income describes a typical family far better than the mean.
  picture:
    kind: flow
    steps:
    - 'Data: 7, 2, 9, 4, 6'
    - 'In order: 2, 4, 6, 7, 9'
    - '5 values: the middle is the 3rd'
    - Median = 6
    alt: 'Finding the median of 7, 2, 9, 4, 6: in order 2, 4, 6, 7, 9, the third value 6 is in the middle.'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 0.5
    start: 0
    prompt: Mark the median of each set of numbers.
    goals:
    - prompt: 3, 9, 4, 7, 5
      target: 5
      mistakes:
      - when:
          v: 4
        say: '4 sits in the middle of the list as written. Put them in order first: 3, 4, 5, 7, 9.'
      - when:
          v:
          - 6
          - 20
        say: 'Too big. In order, 3, 4, 5, 7, 9: which one is in the middle?'
    - prompt: 10, 12, 13, 13, 15, 18
      target: 13
      mistakes:
      - when:
          v: 13.5
        say: 13.5 is the mean. The two middle values are 13 and 13.
      - when:
          v: 14
        say: 14 is halfway between the smallest and largest. The median is the middle of the ordered list.
    - prompt: 2, 4, 6, 50
      target: 5
      mistakes:
      - when:
          v: 15.5
        say: '15.5 is the mean: the 50 drags it up. The median is halfway between the two middle values, 4 and 6.'
      - when:
          v: 4
        say: With an even count there are two middle values, 4 and 6. Take the number halfway between.
  items:
  - prompt: Find the median of 7, 2, 9, 4, 6.
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Put them in order.
    - 2, 4, 6, 7, 9.
    solution: 'In order: 2, 4, 6, 7, 9. The middle is 6.'
    mistakes:
      '9': c8_median_order
  - prompt: Find the median of 3, 8, 5, 10. Type a decimal.
    answer: '6.5'
    check: Rational(5 + 8, 2)
    difficulty: 2
    hints:
    - 'In order: 3, 5, 8, 10.'
    - Halfway between 5 and 8.
    solution: (5 + 8) ÷ 2 = 6.5.
    mistakes: {"6.75": "t8_median_even", "5": "t8_median_even"}
  - prompt: Find the median of 12, 15, 11, 30, 14, 13, 100.
    answer: '14'
    check: '14'
    difficulty: 2
    hints:
    - 'Order: 11, 12, 13, 14, 15, 30, 100.'
    - '7 values: the 4th.'
    solution: The 4th value in order is 14.
    mistakes: {"30": "t8_median_order", "27.9": "t8_median_order"}
  - prompt: A value of 1000 is added to the data 4, 5, 6, 7. What changes most?
    options:
    - The mean
    - The median
    - Both the same amount
    - Neither
    answer: The mean
    difficulty: 2
    hints:
    - 'Mean before: 5.5. After: 204.4.'
    - 'Median before: 5.5. After: 6.'
    solution: The mean jumps from 5.5 to about 204, while the median only moves from 5.5 to 6.
    mistakes: {"The median": "t8_outlier_mean", "Both the same amount": "t8_outlier_mean"}
  - prompt: 'Shoe sizes: 5 (4 pupils), 6 (7 pupils), 7 (3 pupils), 8 (1 pupil). Find the median size.'
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - '15 pupils: the 8th in order.'
    - Sizes 5 fill places 1 to 4, sizes 6 places 5 to 11.
    solution: The 8th pupil falls in sizes 6 (places 5–11), so the median is 6.
    mistakes: {"7": "t8_median_freq", "6.5": "t8_median_freq"}
  - prompt: Five numbers have median 10. Four of them are 4, 8, 12 and 15. What is the fifth?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - With 5 numbers the median is the 3rd in order.
    - It must be 10 itself.
    solution: The middle value must be 10, and 10 sits between 8 and 12, so the fifth number is 10.
    mistakes: {"11": "t8_median_fifth", "12": "t8_median_fifth"}
