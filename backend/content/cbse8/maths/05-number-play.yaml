# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 5. Format: content/README.md.
subject: cbse8-math
chapter: 5
title: Number Play
concepts:
- code: cbse8m.np.divisibility
  title: Quick checks for divisibility
  notes: |
    A number is divisible by 2 if its last digit is even; by 5 if it ends in 0 or 5; by 10 if it ends in 0;
    by 4 if its last two digits form a multiple of 4; by 8 if its last three digits form a multiple of 8; by
    3 (or 9) if its digit sum is a multiple of 3 (or 9); by 11 if the difference between the sums of digits in
    odd and even places is a multiple of 11; by 6 if it passes both the 2 and the 3 tests.
  explanations:
    text: You can tell whether a big number divides exactly without doing the division. For 3 and 9, add the digits. For 4, look only at the last two digits. For 11, alternately add and subtract the digits.
    visual: 'Write 7,128 and circle its last two digits, 28: 28 is a multiple of 4, so 7,128 is too. Add all its digits, 7 + 1 + 2 + 8 = 18: a multiple of 9, so 7,128 is divisible by 9.'
    step_by_step: 'Step 1: Pick the test for the divisor. Step 2: Do the quick check (last digits, digit sum or alternating sum). Step 3: If the check passes, the number is divisible. Step 4: For 6, 12 or 15, use two tests together (6 = 2 × 3).'
    real_world: 'To share 2,346 sweets equally among 6 classes, check: it is even and its digit sum 15 is a multiple of 3, so it divides by 6 with nothing left over.'
  picture:
    kind: flow
    steps:
    - Is 9,372 divisible by 4?
    - 'Last two digits: 72'
    - 72 = 4 × 18
    - Yes, 9,372 is divisible by 4
    alt: 'Testing 9,372 for 4: only the last two digits, 72, matter, and 72 is a multiple of 4.'
  items:
  - prompt: Which number is divisible by 9?
    options:
    - 4,725
    - 4,726
    - 4,727
    - 4,728
    answer: 4,725
    difficulty: 1
    hints:
    - Add the digits.
    - 4 + 7 + 2 + 5 = 18.
    solution: 4 + 7 + 2 + 5 = 18, a multiple of 9, so 4,725 is divisible by 9.
  - prompt: Is 5,316 divisible by 4?
    options:
    - Yes, because 16 is a multiple of 4
    - No, because it is odd
    - Yes, because 5 + 3 + 1 + 6 = 15
    - No, because it doesn't end in 0
    answer: Yes, because 16 is a multiple of 4
    difficulty: 1
    hints:
    - For 4, look at the last two digits.
    - 16 = 4 × 4.
    solution: The last two digits, 16, make a multiple of 4, so 5,316 is divisible by 4.
  - prompt: What digit should replace ★ so that 3★5 is divisible by 9? (★ is a single digit.)
    answer: '1'
    check: 9 - 3 - 5
    difficulty: 2
    hints:
    - The digit sum must be a multiple of 9.
    - 3 + ★ + 5 = 9.
    solution: 3 + ★ + 5 = 8 + ★ must be 9 (★ is at most 9, so 18 is too big), so ★ = 1. 315 = 9 × 35.
  - prompt: Which number is divisible by 11?
    options:
    - 918,082
    - 918,083
    - 918,084
    - 918,085
    answer: 918,082
    difficulty: 3
    hints:
    - Alternately add and subtract the digits.
    - 9 − 1 + 8 − 0 + 8 − 2.
    solution: 9 − 1 + 8 − 0 + 8 − 2 = 22, a multiple of 11, so 918,082 is divisible by 11.
  - prompt: A number is divisible by both 2 and 3. Which must it also be divisible by?
    options:
    - '6'
    - '5'
    - '9'
    - '12'
    answer: '6'
    difficulty: 1
    hints:
    - 2 × 3.
    - 2 and 3 share no factor.
    solution: Divisible by 2 and by 3 means divisible by 2 × 3 = 6.
  - prompt: What is the remainder when 247,513 is divided by 9?
    answer: '4'
    check: 247513 - 9*27501
    difficulty: 3
    hints:
    - The remainder by 9 equals the remainder of the digit sum.
    - 2 + 4 + 7 + 5 + 1 + 3 = 22.
    solution: Digit sum 22, and 22 = 2 × 9 + 4, so the remainder is 4.
- code: cbse8m.np.patterns
  title: Sums of odd, even and consecutive numbers
  after:
  - cbse8m.np.divisibility
  notes: |
    even + even = even, odd + odd = even, odd + even = odd; a sum of an odd count of odd numbers is odd.
    The sum of the first n odd numbers is n². The sum of the first n counting numbers is n(n + 1)/2, and of
    the first n even numbers is n(n + 1). A sum of consecutive numbers with an odd count equals the middle
    number times the count (5 + 6 + 7 = 3 × 6). Powers of 2 (1, 2, 4, 8, ...) are the only numbers that
    cannot be written as a sum of two or more consecutive counting numbers.
  explanations:
    text: 'Patterns let you add long lists quickly. To add 1 to 100, pair the first and last: 1 + 100, 2 + 99 ... fifty pairs of 101 make 5050. Whether a sum is odd or even depends only on how many odd numbers are in it.'
    visual: Write 1 + 2 + 3 + 4 + 5 on one row and 5 + 4 + 3 + 2 + 1 under it. Each column adds to 6, five columns make 30, and that is twice the sum, so the sum is 15.
    step_by_step: 'Step 1: Count how many numbers there are. Step 2: Add the first and the last. Step 3: Multiply by the count and halve. Step 4: For odd and even questions, just count the odd numbers being added.'
    real_world: If a staircase of blocks has 1, 2, 3 ... 20 blocks in its columns, it needs 20 × 21 ÷ 2 = 210 blocks.
  picture:
    kind: number_line
    from: 0
    to: 10
    points:
    - at: 1
      label: '1'
    - at: 4
      label: '4'
    - at: 9
      label: '9'
    jumps:
    - from: 1
      to: 4
      label: '+3'
    - from: 4
      to: 9
      label: '+5'
    caption: 'Adding odd numbers in turn lands on squares: 1, 4, 9.'
    alt: A number line where jumps of 3 and then 5 from 1 land on 4 and 9, the square numbers.
  items:
  - prompt: Find 1 + 2 + 3 + ... + 50.
    answer: '1275'
    check: 50*51/2
    difficulty: 2
    hints:
    - n(n + 1)/2 with n = 50.
    - 50 × 51 ÷ 2.
    solution: 50 × 51 ÷ 2 = 1275.
  - prompt: Is the sum of 7 odd numbers odd or even?
    options:
    - Odd
    - Even
    - It depends on the numbers
    - Neither
    answer: Odd
    difficulty: 1
    hints:
    - Two odds make an even.
    - '7 odds: 3 pairs and one left over.'
    solution: 'Pair them: 3 pairs give even sums and one odd number is left, so the total is odd.'
  - prompt: Find 1 + 3 + 5 + ... + 39 (all odd numbers up to 39).
    answer: '400'
    check: 20**2
    difficulty: 2
    hints:
    - How many odd numbers from 1 to 39?
    - There are 20; sum = 20².
    solution: There are 20 odd numbers up to 39, so the sum is 20² = 400.
  - prompt: Three consecutive numbers add to 72. What is the middle one?
    answer: '24'
    check: 72/3
    difficulty: 1
    hints:
    - The sum is 3 times the middle number.
    - 72 ÷ 3.
    solution: 72 ÷ 3 = 24, so the numbers are 23, 24, 25.
  - prompt: Find 2 + 4 + 6 + ... + 40.
    answer: '420'
    check: 20*21
    difficulty: 2
    hints:
    - Twice 1 + 2 + ... + 20.
    - 20 × 21.
    solution: 2(1 + 2 + ... + 20) = 2 × 210 = 420.
  - prompt: Which number cannot be written as a sum of two or more consecutive counting numbers?
    options:
    - '16'
    - '15'
    - '9'
    - '10'
    answer: '16'
    difficulty: 3
    hints:
    - 15 = 7 + 8, 9 = 4 + 5, 10 = 1 + 2 + 3 + 4.
    - Powers of 2 can't.
    solution: 16 is a power of 2, and powers of 2 are the only numbers that cannot be written this way.
