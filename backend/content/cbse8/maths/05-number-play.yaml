# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 5. Format: content/README.md.
subject: cbse8-math
chapter: 5
title: Number Play
tips:
  t8_consecutive_middle: "Three consecutive numbers are (middle − 1), middle, (middle + 1). Their sum is 3 × the middle."
  t8_digit_missing: "Add the known digits, then find the single digit that brings the total to the next multiple of 9."
  t8_div11: "Alternately add and subtract the digits. Divisible by 11 if the result is 0 or a multiple of 11."
  t8_div4: "For 4, look only at the last two digits. Are they a multiple of 4?"
  t8_div9: "Add the digits. A number is divisible by 9 when that sum is a multiple of 9."
  t8_div_6: "2 and 3 share no factor, so divisible by both means divisible by 2 × 3."
  t8_even_sum: "2 + 4 + … + 40 = 2 × (1 + 2 + … + 20). Find the inner sum first."
  t8_gauss_sum: "1 + 2 + … + n = n(n + 1) ÷ 2. Pair the first and last numbers."
  t8_odd_count_parity: "Pair the odd numbers: each pair sums to even. With 7 numbers, is one left over?"
  t8_odd_sum_count: "How many odd numbers are there from 1 to 39? The sum of the first n odd numbers is n²."
  t8_power_of_two: "Try writing each as consecutive numbers: 15 = 7 + 8, 9 = 4 + 5, 10 = 1 + 2 + 3 + 4. Which one can't be done?"
  t8_remainder_9: "The remainder when dividing by 9 equals the remainder of the digit sum divided by 9."
  c8m5_div3: Add the digits. Is that sum a multiple of 3?
  c8m5_div8: For 8, look only at the last three digits. Do they make a multiple of 8?
  c8m5_last_digit: For 2, 5 and 10 only the last digit matters. What does each rule need?
  c8m5_remainder_3: The remainder on dividing by 3 is the same as the remainder of the digit sum.
  c8m5_parity: 'Pair up the odd numbers: each pair adds to an even number. Is one left over?'
  c8m5_odd_n: Count how many odd numbers there are first. The sum of the first n odd numbers is n × n.
  c8m5_gauss: 'Pair the first and last numbers: each pair has the same sum. How many pairs?'
  c8m5_consec_five: With five consecutive numbers, the middle one is the average. Divide the total by 5.
  c8m5_even_n: 2 + 4 + … is 2 × (1 + 2 + …). How many even numbers are there?

concepts:
- code: cbse8m.np.divisibility
  title: Quick checks for divisibility
  notes: |
    A number is divisible by 2 if its last digit is even; by 5 if it ends in 0 or 5; by 10 if it ends in 0;
    by 4 if its last two digits form a multiple of 4; by 8 if its last three digits form a multiple of 8; by
    3 (or 9) if its digit sum is a multiple of 3 (or 9); by 11 if the difference between the sums of digits in
    odd and even places is a multiple of 11; by 6 if it passes both the 2 and the 3 tests.
  explanations:
    text: You can tell whether a big number divides exactly without doing the division. For 3 and 9, add the digits. For 4, look only at the last two digits. For 11, alternately add and subtract the digits.
    visual: 'Write 7,128 and circle its last two digits, 28: 28 is a multiple of 4, so 7,128 is too. Add all its digits, 7 + 1 + 2 + 8 = 18: a multiple of 9, so 7,128 is divisible by 9.'
    step_by_step: 'Step 1: Pick the test for the divisor. Step 2: Do the quick check (last digits, digit sum or alternating sum). Step 3: If the check passes, the number is divisible. Step 4: For 6, 12 or 15, use two tests together (6 = 2 × 3).'
    real_world: 'To share 2,346 sweets equally among 6 classes, check: it is even and its digit sum 15 is a multiple of 3, so it divides by 6 with nothing left over.'
  picture:
    kind: flow
    steps:
    - Is 9,372 divisible by 4?
    - 'Last two digits: 72'
    - 72 = 4 × 18
    - Yes, 9,372 is divisible by 4
    alt: 'Testing 9,372 for 4: only the last two digits, 72, matter, and 72 is a multiple of 4.'
  activity:
    type: sort
    prompt: Use the quick checks. Which one does each number pass?
    bins:
    - Divisible by 3
    - Divisible by 4
    - Divisible by 11
    - None of these
    items:
    - label: 5,106
      bin: Divisible by 3
      clue: Add the digits.
      why: 5 + 1 + 0 + 6 = 12, a multiple of 3.
    - label: 8,013
      bin: Divisible by 3
      clue: Add the digits. Is the total in the 3 times table?
      why: 8 + 0 + 1 + 3 = 12, so it divides by 3.
    - label: 7,316
      bin: Divisible by 4
      clue: Look only at the last two digits.
      why: 16 is a multiple of 4, so 7316 is too.
    - label: 2,524
      bin: Divisible by 4
      clue: What are the last two digits?
      why: 24 ÷ 4 = 6, so it divides by 4.
    - label: 3,751
      bin: Divisible by 11
      clue: 'Alternately add and subtract the digits: 3 − 7 + 5 − 1.'
      why: 3 − 7 + 5 − 1 = 0, so it divides by 11.
    - label: 5,291
      bin: Divisible by 11
      clue: Try + − + − across the digits.
      why: 5 − 2 + 9 − 1 = 11, so it divides by 11.
    - label: 6,205
      bin: None of these
      clue: Check all three tests.
      why: Digits add to 13; last two 05; 6 − 2 + 0 − 5 = −1. None works.
    - label: 4,127
      bin: None of these
      clue: 'Digits, last two digits, alternating sum: check each.'
      why: Digit sum 14, last two 27, alternating 4 − 1 + 2 − 7 = −2. None.
  lesson:
    - teach: Some divisibility checks need only the last digits. For 2, the last digit is even. For 5, it ends in 0 or 5. For 10, it ends in 0. For 4, the last two digits make a multiple of 4. For 8, the last three digits make a multiple of 8. This works because 100 is a multiple of 4 and 1000 is a multiple of 8.
      picture:
        kind: compare
        columns:
        - title: Divisor
          points:
          - 2, 5, 10
          - '4'
          - '8'
        - title: Look at
          points:
          - last digit
          - last two digits
          - last three digits
        alt: For 2, 5 and 10 look at the last digit, for 4 the last two digits, for 8 the last three.
      check:
        prompt: Is 7,316 divisible by 4?
        options:
        - 'Yes'
        - 'No'
        answer: 'Yes'
        why: The last two digits are 16, and 16 = 4 × 4.
    - teach: 'For 3 and 9, add the digits. If the digit sum is a multiple of 3, so is the number; the same for 9. The digit sum even gives the remainder: 247 has digit sum 13, and 13 leaves 4 after dividing by 9, so 247 does too.'
      picture:
        kind: flow
        steps:
        - 4,725
        - 4 + 7 + 2 + 5 = 18
        - 18 is a multiple of 9
        - 4,725 is divisible by 9
        alt: The digits of 4725 add to 18, a multiple of 9, so 4725 is divisible by 9.
      check:
        prompt: Is 1,236 divisible by 3?
        options:
        - 'Yes'
        - 'No'
        answer: 'Yes'
        why: 1 + 2 + 3 + 6 = 12, and 12 is a multiple of 3.
    - teach: For 11, add and subtract the digits in turn from the right. If the result is 0 or a multiple of 11, the number is divisible by 11. For 6, a number must pass both the test for 2 and the test for 3, because 6 = 2 × 3 and they share no factor.
      check:
        prompt: Is 2,728 divisible by 11?
        options:
        - 'Yes'
        - 'No'
        answer: 'Yes'
        why: 'From the right: 8 − 2 + 7 − 2 = 11, a multiple of 11.'
  items:
  - prompt: Which number is divisible by 9?
    options:
    - 4,725
    - 4,726
    - 4,727
    - 4,728
    answer: 4,725
    difficulty: 1
    hints:
    - Add the digits.
    - 4 + 7 + 2 + 5 = 18.
    solution: 4 + 7 + 2 + 5 = 18, a multiple of 9, so 4,725 is divisible by 9.
    mistakes: {"4,726": "t8_div9", "4,728": "t8_div9"}
  - prompt: Is 5,316 divisible by 4?
    options:
    - Yes, because 16 is a multiple of 4
    - No, because it is odd
    - Yes, because 5 + 3 + 1 + 6 = 15
    - No, because it doesn't end in 0
    answer: Yes, because 16 is a multiple of 4
    difficulty: 1
    hints:
    - For 4, look at the last two digits.
    - 16 = 4 × 4.
    solution: The last two digits, 16, make a multiple of 4, so 5,316 is divisible by 4.
    mistakes: {"Yes, because 5 + 3 + 1 + 6 = 15": "t8_div4", "No, because it doesn't end in 0": "t8_div4"}
  - prompt: What digit should replace ★ so that 3★5 is divisible by 9? (★ is a single digit.)
    answer: '1'
    check: 9 - 3 - 5
    difficulty: 2
    hints:
    - The digit sum must be a multiple of 9.
    - 3 + ★ + 5 = 9.
    solution: 3 + ★ + 5 = 8 + ★ must be 9 (★ is at most 9, so 18 is too big), so ★ = 1. 315 = 9 × 35.
    mistakes: {"9": "t8_digit_missing", "0": "t8_digit_missing"}
  - prompt: Which number is divisible by 11?
    options:
    - 918,082
    - 918,083
    - 918,084
    - 918,085
    answer: 918,082
    difficulty: 3
    hints:
    - Alternately add and subtract the digits.
    - 9 − 1 + 8 − 0 + 8 − 2.
    solution: 9 − 1 + 8 − 0 + 8 − 2 = 22, a multiple of 11, so 918,082 is divisible by 11.
    mistakes: {"918,083": "t8_div11", "918,085": "t8_div11"}
  - prompt: A number is divisible by both 2 and 3. Which must it also be divisible by?
    options:
    - '6'
    - '5'
    - '9'
    - '12'
    answer: '6'
    difficulty: 1
    hints:
    - 2 × 3.
    - 2 and 3 share no factor.
    solution: Divisible by 2 and by 3 means divisible by 2 × 3 = 6.
    mistakes: {"9": "t8_div_6", "12": "t8_div_6"}
  - prompt: What is the remainder when 247,513 is divided by 9?
    answer: '4'
    check: 247513 - 9*27501
    difficulty: 3
    hints:
    - The remainder by 9 equals the remainder of the digit sum.
    - 2 + 4 + 7 + 5 + 1 + 3 = 22.
    solution: Digit sum 22, and 22 = 2 × 9 + 4, so the remainder is 4.
    mistakes: {"22": "t8_remainder_9", "3": "t8_remainder_9"}
  - prompt: Which number is divisible by 8?
    options:
    - 5,128
    - 5,132
    - 5,140
    answer: 5,128
    difficulty: 2
    hints:
    - Look only at the last three digits.
    - Divide each by 8.
    solution: 'Step 1: last three digits 128, 132, 140. Step 2: 128 = 8 × 16, but 132 and 140 are not multiples of 8. So 5,128.'
    mistakes:
      5,132: c8m5_div8
      5,140: c8m5_div8
  - prompt: What is the smallest digit that can replace ★ so that 52★ is divisible by 3?
    answer: '2'
    check: (3 - (5 + 2) % 3) % 3
    difficulty: 2
    hints:
    - 5 + 2 = 7.
    - Which smallest digit makes 7 + ★ a multiple of 3?
    solution: 'Step 1: 5 + 2 = 7. Step 2: 7 + 2 = 9 is a multiple of 3. Step 3: 0 and 1 give 7 and 8, which are not. So ★ = 2.'
    mistakes:
      '5': c8m5_div3
      '8': c8m5_div3
  - prompt: What is the remainder when 7,451 is divided by 3?
    answer: '2'
    check: 7451 % 3
    difficulty: 2
    hints:
    - Add the digits.
    - 7 + 4 + 5 + 1 = 17. What does 17 leave after dividing by 3?
    solution: 'Step 1: digit sum = 17. Step 2: 17 = 3 × 5 + 2. So the remainder is 2.'
    mistakes:
      '8': c8m5_remainder_3
      '1': c8m5_remainder_3
  - prompt: Which number is divisible by both 2 and 5?
    options:
    - 3,470
    - 3,475
    - 3,472
    answer: 3,470
    difficulty: 1
    hints:
    - For 2 it must end in an even digit.
    - For 5 it must end in 0 or 5.
    solution: Only a number ending in 0 is both even and a multiple of 5. So 3,470 (it is divisible by 10).
    mistakes:
      3,475: c8m5_last_digit
      3,472: c8m5_last_digit
  - prompt: Which number is divisible by 6?
    options:
    - 4,326
    - 4,327
    - 4,328
    answer: 4,326
    difficulty: 2
    hints:
    - It must be even and its digit sum a multiple of 3.
    - 'Check 4,326 and 4,328: which digit sum is a multiple of 3?'
    solution: 'Step 1: 4,327 is odd, so not. Step 2: 4 + 3 + 2 + 6 = 15, a multiple of 3; 4 + 3 + 2 + 8 = 17 is not. So 4,326.'
    mistakes:
      4,327: t8_div_6
      4,328: c8m5_div3
  - prompt: What is the remainder when 85,236 is divided by 9?
    answer: '6'
    check: 85236 % 9
    difficulty: 2
    hints:
    - Add the digits.
    - 8 + 5 + 2 + 3 + 6 = 24.
    solution: 'Step 1: digit sum = 24. Step 2: 24 = 9 × 2 + 6. The remainder is 6.'
    mistakes:
      '24': t8_remainder_9
      '3': t8_remainder_9
  - prompt: Is 9,152 divisible by 11?
    options:
    - 'Yes'
    - 'No'
    - Only if the last digit is 1
    answer: 'Yes'
    difficulty: 2
    hints:
    - Alternately add and subtract the digits from the right.
    - 2 − 5 + 1 − 9.
    solution: 'From the right: 2 − 5 + 1 − 9 = −11, a multiple of 11. So yes: 9,152 = 11 × 832.'
    mistakes:
      'No': t8_div11
      Only if the last digit is 1: t8_div11
  - prompt: A number is divisible by 4 and by 9. Which must it also be divisible by?
    options:
    - '36'
    - '13'
    - 18 only if it is odd
    answer: '36'
    difficulty: 3
    hints:
    - 4 and 9 share no common factor except 1.
    - When two numbers share no factor, divisible by both means divisible by their product.
    solution: 4 and 9 have no common factor, so a number divisible by both is divisible by 4 × 9 = 36.
    mistakes:
      '13': t8_div_6
      18 only if it is odd: t8_div_6
  - prompt: Find the missing digit ★ so that 6★84 is divisible by 9.
    answer: '0'
    check: (9 - (6 + 8 + 4) % 9) % 9
    difficulty: 3
    hints:
    - 6 + 8 + 4 = 18.
    - 18 is already a multiple of 9.
    solution: 'Step 1: 6 + 8 + 4 = 18. Step 2: 18 is a multiple of 9 already, so ★ must add 0 (or 9). The digit that works first is 0: 6,084 = 9 × 676.'
    mistakes:
      '1': t8_digit_missing
      '3': t8_digit_missing
- code: cbse8m.np.patterns
  title: Sums of odd, even and consecutive numbers
  after:
  - cbse8m.np.divisibility
  notes: |
    even + even = even, odd + odd = even, odd + even = odd; a sum of an odd count of odd numbers is odd.
    The sum of the first n odd numbers is n². The sum of the first n counting numbers is n(n + 1)/2, and of
    the first n even numbers is n(n + 1). A sum of consecutive numbers with an odd count equals the middle
    number times the count (5 + 6 + 7 = 3 × 6). Powers of 2 (1, 2, 4, 8, ...) are the only numbers that
    cannot be written as a sum of two or more consecutive counting numbers.
  explanations:
    text: 'Patterns let you add long lists quickly. To add 1 to 100, pair the first and last: 1 + 100, 2 + 99 ... fifty pairs of 101 make 5050. Whether a sum is odd or even depends only on how many odd numbers are in it.'
    visual: Write 1 + 2 + 3 + 4 + 5 on one row and 5 + 4 + 3 + 2 + 1 under it. Each column adds to 6, five columns make 30, and that is twice the sum, so the sum is 15.
    step_by_step: 'Step 1: Count how many numbers there are. Step 2: Add the first and the last. Step 3: Multiply by the count and halve. Step 4: For odd and even questions, just count the odd numbers being added.'
    real_world: If a staircase of blocks has 1, 2, 3 ... 20 blocks in its columns, it needs 20 × 21 ÷ 2 = 210 blocks.
  picture:
    kind: number_line
    from: 0
    to: 10
    points:
    - at: 1
      label: '1'
    - at: 4
      label: '4'
    - at: 9
      label: '9'
    jumps:
    - from: 1
      to: 4
      label: '+3'
    - from: 4
      to: 9
      label: '+5'
    caption: 'Adding odd numbers in turn lands on squares: 1, 4, 9.'
    alt: A number line where jumps of 3 and then 5 from 1 land on 4 and 9, the square numbers.
  activity:
    type: formula
    prompt: Add up a long list fast. n is how many numbers you add.
    inputs:
    - name: n
      label: How many numbers (n)
      min: 1
      max: 100
      step: 1
      start: 1
    outputs:
    - name: odd
      label: 1 + 3 + 5 + … (n odd numbers)
      expr: n*n
    - name: all
      label: 1 + 2 + 3 + … + n
      expr: n*(n+1)/2
    goals:
    - prompt: Find 1 + 3 + 5 + … + 19.
      want:
        odd: 100
      mistakes:
      - when:
          n: 19
        say: 19 is the last number, not how many there are. 1, 3, 5, …, 19 is 10 odd numbers.
      - when:
          n: 20
        say: 'That counts every number up to 20. Only the odd ones are in the list: half of them.'
    - prompt: Find n so that 1 + 2 + … + n = 5050.
      want:
        all: 5050
      mistakes:
      - when:
          n: 50
        say: 50 is the number of pairs. Each pair is 1 + n = 101, and 50 pairs make 5050. So n is …?
      - when:
          n:
          - 60
          - 99
        say: 'Not there yet. Pair the first and last numbers: 50 pairs of 101 make 5050.'
    - prompt: Make the odd-number sum equal 64.
      want:
        odd: 64
      mistakes:
      - when:
          n: 32
        say: 32 is half of 64. The sum of the first n odd numbers is n × n, a square.
      - when:
          n: 7
        say: 7 odd numbers make 49. One more step.
  lesson:
    - teach: 'Even + even = even, odd + odd = even, and odd + even = odd. Add odd numbers in pairs: each pair is even. So an even count of odd numbers adds to an even number, and an odd count leaves one odd number over, so the sum is odd.'
      picture:
        kind: compare
        columns:
        - title: Add
          points:
          - even + even
          - odd + odd
          - odd + even
        - title: Result
          points:
          - even
          - even
          - odd
        alt: Even plus even and odd plus odd are even; odd plus even is odd.
      check:
        prompt: Is the sum of 10 odd numbers odd or even?
        options:
        - Even
        - Odd
        answer: Even
        why: 10 odd numbers make 5 pairs, and each pair adds to an even number.
    - teach: 'Sums of patterns have shortcuts. 1 + 2 + … + n: pair the first and last (1 + n), the next pair also makes 1 + n, and there are n/2 pairs, so the sum is n(n + 1)/2. The first n odd numbers add to n²: 1 + 3 + 5 = 9 = 3².'
      picture:
        kind: flow
        steps:
        - 1 + 2 + … + 10
        - 'pairs: 1+10, 2+9, 3+8 … each 11'
        - 5 pairs
        - 5 × 11 = 55
        alt: 'Pair the numbers 1 to 10 as 1 plus 10, 2 plus 9 and so on: five pairs of 11 make 55.'
      check:
        prompt: What is 1 + 2 + 3 + … + 20?
        options:
        - '210'
        - '200'
        - '420'
        answer: '210'
        why: 20 × 21 ÷ 2 = 210.
    - teach: 'Consecutive numbers: in an odd count of them, the middle one is the average. Three consecutive numbers that add to 45 are 14, 15, 16, because 45 ÷ 3 = 15. Every counting number except the powers of 2 (1, 2, 4, 8, 16, …) can be written as a sum of two or more consecutive numbers.'
      check:
        prompt: Five consecutive numbers add to 50. What is the middle one?
        options:
        - '10'
        - '25'
        - '12'
        answer: '10'
        why: 'With an odd count, the middle one is the average: 50 ÷ 5 = 10. The numbers are 8, 9, 10, 11, 12.'
  items:
  - prompt: Find 1 + 2 + 3 + ... + 50.
    answer: '1275'
    check: 50*51/2
    difficulty: 2
    hints:
    - n(n + 1)/2 with n = 50.
    - 50 × 51 ÷ 2.
    solution: 50 × 51 ÷ 2 = 1275.
    mistakes: {"2550": "sum_formula_half", "1250": "t8_gauss_sum"}
  - prompt: Is the sum of 7 odd numbers odd or even?
    options:
    - Odd
    - Even
    - It depends on the numbers
    - Neither
    answer: Odd
    difficulty: 1
    hints:
    - Two odds make an even.
    - '7 odds: 3 pairs and one left over.'
    solution: 'Pair them: 3 pairs give even sums and one odd number is left, so the total is odd.'
    mistakes: {"Even": "t8_odd_count_parity", "It depends on the numbers": "t8_odd_count_parity"}
  - prompt: Find 1 + 3 + 5 + ... + 39 (all odd numbers up to 39).
    answer: '400'
    check: 20**2
    difficulty: 2
    hints:
    - How many odd numbers from 1 to 39?
    - There are 20; sum = 20².
    solution: There are 20 odd numbers up to 39, so the sum is 20² = 400.
    mistakes: {"1521": "t8_odd_sum_count", "780": "t8_odd_sum_count"}
  - prompt: Three consecutive numbers add to 72. What is the middle one?
    answer: '24'
    check: 72/3
    difficulty: 1
    hints:
    - The sum is 3 times the middle number.
    - 72 ÷ 3.
    solution: 72 ÷ 3 = 24, so the numbers are 23, 24, 25.
    mistakes: {"23": "t8_consecutive_middle", "36": "t8_consecutive_middle"}
  - prompt: Find 2 + 4 + 6 + ... + 40.
    answer: '420'
    check: 20*21
    difficulty: 2
    hints:
    - Twice 1 + 2 + ... + 20.
    - 20 × 21.
    solution: 2(1 + 2 + ... + 20) = 2 × 210 = 420.
    mistakes: {"210": "t8_even_sum", "820": "t8_even_sum"}
  - prompt: Which number cannot be written as a sum of two or more consecutive counting numbers?
    options:
    - '16'
    - '15'
    - '9'
    - '10'
    answer: '16'
    difficulty: 3
    hints:
    - 15 = 7 + 8, 9 = 4 + 5, 10 = 1 + 2 + 3 + 4.
    - Powers of 2 can't.
    solution: 16 is a power of 2, and powers of 2 are the only numbers that cannot be written this way.
    mistakes: {"15": "t8_power_of_two", "10": "t8_power_of_two"}
  - prompt: Find 1 + 2 + 3 + … + 100.
    answer: '5050'
    check: 100*101/2
    difficulty: 1
    hints:
    - Pair 1 with 100, 2 with 99, …
    - 50 pairs.
    solution: 'Step 1: each pair adds to 101. Step 2: there are 50 pairs. Step 3: 50 × 101 = 5050.'
    mistakes:
      '10100': c8m5_gauss
      '5000': c8m5_gauss
  - prompt: Find 1 + 3 + 5 + … + 19.
    answer: '100'
    check: ((19 + 1)/2)**2
    difficulty: 2
    hints:
    - How many odd numbers from 1 to 19?
    - There are 10. The sum of the first n odd numbers is n².
    solution: 'Step 1: 1, 3, …, 19 are the first 10 odd numbers. Step 2: their sum is 10² = 100.'
    mistakes:
      '361': c8m5_odd_n
      '81': c8m5_odd_n
  - prompt: Is the sum of 9 odd numbers odd or even?
    options:
    - Odd
    - Even
    - It could be either
    answer: Odd
    difficulty: 1
    hints:
    - Pair them up.
    - 9 odd numbers make 4 pairs and one left over.
    solution: 4 pairs give an even total, and the one odd number left over makes the sum odd.
    mistakes:
      Even: c8m5_parity
      It could be either: c8m5_parity
  - prompt: Five consecutive numbers add to 85. What is the largest of them?
    answer: '19'
    check: 85/5 + 2
    difficulty: 2
    hints:
    - The middle number is the average.
    - 85 ÷ 5 = 17 is the middle.
    solution: 'Step 1: middle = 85 ÷ 5 = 17. Step 2: the numbers are 15, 16, 17, 18, 19. The largest is 19.'
    mistakes:
      '17': c8m5_consec_five
      '21': c8m5_consec_five
  - prompt: Find 2 + 4 + 6 + … + 50.
    answer: '650'
    check: 25*26
    difficulty: 2
    hints:
    - 'Take out a 2: 2 × (1 + 2 + … + 25).'
    - 1 + 2 + … + 25 = 25 × 26 ÷ 2.
    solution: 'Step 1: 1 + 2 + … + 25 = 325. Step 2: 2 × 325 = 650.'
    mistakes:
      '325': c8m5_even_n
      '1300': c8m5_even_n
  - prompt: Which of these can be written as a sum of two or more consecutive counting numbers?
    options:
    - '12'
    - '8'
