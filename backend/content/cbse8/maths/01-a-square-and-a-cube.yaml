# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 1. Format: content/README.md.
subject: cbse8-math
chapter: 1
title: A Square and A Cube
tips:
  c8_square_not_double: 'Squaring means multiplying a number by itself, not by 2: 14² = 14 × 14.'
  c8_root_not_half: A square root is not half. √144 is the number that times itself gives 144.
  c8_cube_not_triple: 'Cubing means multiplying a number by itself three times, not multiplying by 3: 6³ = 6 × 6 × 6.'
  t8_between_squares: "List the numbers after 81 and before 100. Don't count 81 or 100 themselves."
  t8_complete_triples: "Group 72's prime factors in threes. Which prime is short of a full group of three, and by how many?"
  t8_cube_root: "A cube root is the number that, multiplied by itself THREE times, gives the cube. Test your answer: n × n × n."
  t8_cube_triples: "Group the prime factors in threes. Take one number from each group and multiply."
  t8_odd_sum_square: "Count how many odd numbers are being added. The sum of the first n odd numbers is n × n."
  t8_root_from_pairs: "Split into primes and pair them up. Take ONE number from each pair and multiply."
  t8_side_from_area: "Area = side × side. Which number times itself gives the area?"
  t8_square_and_cube: "Check both: is it n × n for a whole n? Is it m × m × m for a whole m? Only one choice passes both."
  t8_square_last_digit: "Look at the last digit. Squares can only end in 0, 1, 4, 5, 6 or 9. Which number ends in a digit no square can?"
  t8_subtract_cube: "Work out 9³, take it from 1729, then find the cube root of what is left."
  c8m1_pairs: Split the number into prime factors and group equal primes in pairs (for a square root) or in threes (for a cube root). Take one prime from each group.
  c8m1_units: Look only at the last digit of the number and ask which last digits a square or cube can end in.
  c8m1_missing: Factorise, then see which prime is short of a full pair (square) or a full triple (cube). Multiply by just enough to complete it.
concepts:
- code: cbse8m.sq.squares
  title: Square numbers and square roots
  notes: |
    A square number is a number times itself: n² = n × n (1, 4, 9, 16, 25, ...). The square root √m is the
    number whose square is m, so √49 = 7. Square numbers end in 0, 1, 4, 5, 6 or 9, never 2, 3, 7 or 8. The
    sum of the first n odd numbers is n² (1 + 3 + 5 = 9). The square root of a perfect square can be found by
    prime factorisation: pair up equal primes and take one from each pair.
  explanations:
    text: 'A square number is what you get when you multiply a number by itself, like 6 × 6 = 36. It is called square because that many dots can be arranged in a perfect square. The square root goes backwards: √36 = 6 because 6 × 6 = 36.'
    visual: 'Arrange dots in squares: 1 dot, then a 2 by 2 block of 4, then a 3 by 3 block of 9. Each new square adds an L-shaped border of 3, 5, 7 ... dots, which is why adding odd numbers gives square numbers.'
    step_by_step: 'Step 1: To square a number, multiply it by itself. Step 2: To find a square root, ask which number times itself gives this. Step 3: For a big number, factorise it into primes. Step 4: Group equal primes in pairs and multiply one prime from each pair.'
    real_world: A square garden with an area of 64 square metres has sides of √64 = 8 metres, so you need 4 × 8 = 32 metres of fencing.
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: '1'
    - size: 1
      label: '1'
    - size: 1
      label: '1'
    rows:
    - size: 1
      label: '1'
    - size: 1
      label: '1'
    - size: 1
      label: '1'
    cells:
    - - '1'
      - '3'
      - '5'
    - - '3'
      - '3'
      - '5'
    - - '5'
      - '5'
      - '5'
    caption: 'A 3 by 3 square is 1 + 3 + 5 = 9: each L-shaped border adds the next odd number.'
    alt: A 3 by 3 grid where the corner cell is marked 1, the next L-shaped border 3 and the outer border 5, showing 1 + 3 + 5 = 9.
  activity:
    type: formula
    prompt: Arrange n × n dots into a square. Set n, the side.
    inputs:
    - name: n
      label: Dots along one side (n)
      min: 1
      max: 80
      step: 1
      start: 1
    outputs:
    - name: sq
      label: Dots in the square (n × n)
      expr: n*n
    goals:
    - prompt: Make a square of 144 dots.
      want:
        sq: 144
      mistakes:
      - when:
          n: 72
        say: 72 is half of 144. The square root is the number that times itself makes 144. Try 12 × 12.
      - when:
          n:
          - 13
          - 71
        say: 'Too wide: that many rows of that many dots is more than 144. Try smaller sides.'
    - prompt: Make a square of 625 dots.
      want:
        sq: 625
      mistakes:
      - when:
          n:
          - 20
          - 24
        say: Close. 20 × 20 = 400, still short. A number ending in 5 squares to a number ending in 25.
    - prompt: Make a square of 2025 dots.
      want:
        sq: 2025
      mistakes:
      - when:
          n:
          - 40
          - 44
        say: 40 × 40 = 1600, not enough yet. 2025 ends in 25, so try a side ending in 5.
  lesson:
    - teach: 'A square number is a number times itself: 7 × 7 = 49, written 7². It is the area of a square with whole-number sides. The square numbers start 1, 4, 9, 16, 25, 36, 49, 64, 81, 100.'
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 1
          B:
          - 7
          - 1
          C:
          - 7
          - 7
          D:
          - 1
          - 7
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - D
        - - D
          - A
        alt: A square ABCD with equal sides; if each side is 7 units, its area is 7 × 7 = 49 square units, so 49 is a square number.
      check:
        prompt: What is 9²?
        options:
        - '81'
        - '18'
        - '99'
        answer: '81'
        why: 9 × 9 = 81; squaring is not doubling.
    - teach: 'Squares follow patterns. A square number never ends in 2, 3, 7 or 8. The sum of the first n odd numbers is n²: 1 + 3 + 5 = 9 = 3². Between n² and (n + 1)² there are 2n whole numbers that are not squares.'
      check:
        prompt: Which of these could be a square number?
        options:
        - 1,296
        - 2,437
        - 5,328
        answer: 1,296
        why: Squares never end in 7 or 8; 1,296 = 36².
    - teach: 'The square root undoes squaring: √49 = 7 because 7² = 49. To find a square root, split the number into prime factors, pair equal primes, and take one from each pair. 324 = 2 × 2 × 3 × 3 × 3 × 3, so √324 = 2 × 3 × 3 = 18.'
      check:
        prompt: 784 = 2 × 2 × 2 × 2 × 7 × 7. What is √784?
        options:
        - '28'
        - '14'
        - '392'
        answer: '28'
        why: 'One from each pair: 2 × 2 × 7 = 28.'
  items:
  - prompt: Find 14².
    answer: '196'
    check: 14**2
    difficulty: 1
    hints:
    - 14² = 14 × 14.
    - 14 × 14 = 140 + 56.
    solution: 14 × 14 = 196.
    mistakes:
      '28': c8_square_not_double
  - prompt: Find √144.
    answer: '12'
    check: sqrt(144)
    difficulty: 1
    hints:
    - Which number times itself is 144?
    - 12 × 12 = 144.
    solution: 12 × 12 = 144, so √144 = 12.
    mistakes:
      '72': c8_root_not_half
  - prompt: Which of these cannot be a square number?
    options:
    - 2,437
    - 1,024
    - 3,249
    - 4,096
    answer: 2,437
    difficulty: 2
    hints:
    - Look at the last digit.
    - Squares never end in 2, 3, 7 or 8.
    solution: 'Step 1: Square numbers end in 0, 1, 4, 5, 6 or 9. Step 2: 2,437 ends in 7, so it cannot be a square. (1,024 = 32², 3,249 = 57², 4,096 = 64².)'
    mistakes: {"1,024": "t8_square_last_digit", "3,249": "t8_square_last_digit"}
  - prompt: What is 1 + 3 + 5 + 7 + 9 + 11 + 13?
    answer: '49'
    check: 1+3+5+7+9+11+13
    difficulty: 2
    hints:
    - How many odd numbers are being added?
    - The sum of the first n odd numbers is n².
    solution: 'Step 1: These are the first 7 odd numbers. Step 2: Their sum is 7² = 49.'
    mistakes: {"64": "t8_odd_sum_square", "36": "t8_odd_sum_square"}
  - prompt: Use prime factors to find √1764.
    answer: '42'
    check: sqrt(1764)
    difficulty: 2
    hints:
    - 1764 = 2 × 2 × 3 × 3 × 7 × 7.
    - 'Take one from each pair: 2 × 3 × 7.'
    solution: 'Step 1: 1764 = 2² × 3² × 7². Step 2: √1764 = 2 × 3 × 7 = 42.'
    mistakes: {"882": "t8_root_from_pairs", "84": "t8_root_from_pairs"}
  - prompt: A square tile has an area of 225 cm². How long is one side, in cm?
    answer: '15'
    check: sqrt(225)
    difficulty: 1
    hints:
    - Side = √area.
    - 15 × 15 = 225.
    solution: Side = √225 = 15 cm.
    mistakes: {"56.25": "t8_side_from_area", "112.5": "t8_side_from_area"}
  - prompt: How many whole numbers lie between 9² and 10²?
    answer: '18'
    check: 99 - 82 + 1
    difficulty: 3
    hints:
    - 9² = 81 and 10² = 100.
    - Count 82 to 99.
    solution: 'Step 1: Between 81 and 100 are 82, 83, ..., 99. Step 2: That is 99 − 82 + 1 = 18 numbers (in general 2n between n² and (n+1)²).'
    mistakes: {"19": "t8_between_squares", "20": "t8_between_squares"}
  - prompt: Find 25².
    answer: '625'
    check: 25**2
    difficulty: 1
    hints:
    - Multiply 25 by itself.
    - 25 × 25 = 25 × 20 + 25 × 5.
    solution: 25² = 625.
    mistakes:
      '50': c8_square_not_double
  - prompt: Find √529.
    answer: '23'
    check: sqrt(529)
    difficulty: 2
    hints:
    - 20² = 400 and 25² = 625.
    - It ends in 9, so the root ends in 3 or 7.
    solution: 23² = 529, so √529 = 23.
    mistakes:
      '27': c8m1_pairs
  - prompt: What is the sum of the first 10 odd numbers?
    answer: '100'
    check: 10**2
    difficulty: 2
    hints:
    - 1 + 3 + 5 + … has a square pattern.
    - The sum of the first n odd numbers is n².
    solution: The first 10 odd numbers add up to 10² = 100.
    mistakes:
      '50': t8_odd_sum_square
  - prompt: Which of these is a perfect square?
    options:
    - 1,024
    - 1,022
    - 1,027
    - 1,028
    answer: 1,024
    difficulty: 2
    hints:
    - Squares never end in 2, 3, 7 or 8.
    - 32 × 32 = ?
    solution: 1,024 = 32²; the others end in 2, 7 or 8.
    mistakes:
      1,022: c8m1_units
      1,027: c8m1_units
      1,028: c8m1_units
  - prompt: What is the smallest number you must multiply 180 by to get a perfect square?
    answer: '5'
    check: 900/180
    difficulty: 3
    hints:
    - 180 = 2 × 2 × 3 × 3 × 5.
    - Which prime has no partner?
    solution: 180 = 2² × 3² × 5; multiplying by 5 gives 900 = 30².
    mistakes:
      '2': c8m1_missing
      '3': c8m1_missing
  - prompt: A square garden has an area of 1,296 m². What is the length of one side, in m?
    answer: '36'
    check: sqrt(1296)
    difficulty: 2
    hints:
    - Side = √area.
    - 1,296 = 2⁴ × 3⁴.
    solution: √1296 = 2² × 3² = 36 m.
    mistakes:
      '648': t8_side_from_area
  - prompt: How many whole numbers lie strictly between 15² and 16²?
    answer: '30'
    check: 2*15
    difficulty: 3
    hints:
    - Between n² and (n+1)² there are 2n numbers.
    - Here n = 15.
    solution: There are 2 × 15 = 30 numbers between 225 and 256.
    mistakes:
      '31': t8_between_squares
      '15': t8_between_squares
  - prompt: 'A Pythagorean-style triple: 6² + 8² = ?²  Find the missing number.'
    answer: '10'
    check: sqrt(36+64)
    difficulty: 2
    hints:
    - Work out 36 + 64.
    - Then take the square root.
    solution: 36 + 64 = 100 = 10².
    mistakes:
      '14': t8_complete_triples
  - prompt: What digit can the square of a number ending in 4 end in?
    options:
    - '6'
    - '4'
    - '8'
    - '2'
    answer: '6'
    difficulty: 2
    hints:
    - Only the last digit matters.
    - Work out 4 × 4.
    solution: 4 × 4 = 16, so the square ends in 6 (e.g. 14² = 196).
    mistakes:
      '4': t8_square_last_digit
      '8': c8m1_units
- code: cbse8m.sq.cubes
  title: Cube numbers and cube roots
  after:
  - cbse8m.sq.squares
  notes: |
    A cube number is n³ = n × n × n (1, 8, 27, 64, 125, ...): the number of unit cubes in an n by n by n block.
    The cube root ∛m is the number whose cube is m, so ∛125 = 5. For a perfect cube, prime factors come in
    groups of three; take one from each group to get the cube root. Some numbers are both squares and
    cubes, such as 64 = 8² = 4³. 1729 = 1³ + 12³ = 9³ + 10³ is the Hardy–Ramanujan number.
  explanations:
    text: 'A cube number is a number multiplied by itself three times, like 4 × 4 × 4 = 64. That many small cubes make one big cube 4 long, 4 wide and 4 tall. The cube root goes back: ∛64 = 4.'
    visual: 'Picture a Rubik''s cube: 3 cubes along each edge, 3 layers of 3 × 3 = 9, so 27 little cubes in all. That is 3³ = 27.'
    step_by_step: 'Step 1: To cube, multiply the number by itself, then by itself again. Step 2: For a cube root, factorise into primes. Step 3: Group equal primes in threes. Step 4: Multiply one prime from each group.'
    real_world: A water tank shaped like a cube holds 1000 litres = 1 cubic metre, so each edge is ∛1 = 1 metre long.
  picture:
    kind: bars
    bars:
    - label: 1³
      value: 1
    - label: 2³
      value: 8
    - label: 3³
      value: 27
    - label: 4³
      value: 64
    - label: 5³
      value: 125
    unit: unit cubes
    caption: 'Cubes grow fast: 1, 8, 27, 64, 125.'
    alt: A bar chart of the first five cube numbers 1, 8, 27, 64 and 125, each bar much taller than the last.
  activity:
    type: formula
    prompt: Build an n × n × n cube from small cubes. Set n.
    inputs:
    - name: n
      label: Cubes along one edge (n)
      min: 1
      max: 40
      step: 1
      start: 1
    outputs:
    - name: face
      label: Cubes on one face (n × n)
      expr: n*n
    - name: cube
      label: Cubes in all (n × n × n)
      expr: n*n*n
    goals:
    - prompt: Build a cube from 64 small cubes.
      want:
        cube: 64
      mistakes:
      - when:
          n: 8
        say: '8 × 8 = 64 is one flat face, a square. A cube has three equal edges: 4 × 4 × 4.'
      - when:
          n: 16
        say: '16 is 64 ÷ 4. You need one number used three times: n × n × n = 64.'
    - prompt: Build a cube from 1000 small cubes.
      want:
        cube: 1000
      mistakes:
      - when:
          n:
          - 11
          - 40
        say: Too big. 10 × 10 × 10 is already 1000.
      - when:
          face: 100
        say: 'Close: that''s 100, one face. Stack n of those faces, so n × 100 = 1000.'
    - prompt: Build a cube from 1728 small cubes.
      want:
        cube: 1728
      mistakes:
      - when:
          cube:
          - 1000
          - 1727
        say: Close, but short. 1728 ends in 8, and only a number ending in 2 gives a cube ending in 8.
      - when:
          n: 13
        say: '13 × 13 × 13 = 2197: a bit too many.'
  lesson:
    - teach: 'A cube number is a number used three times in a multiplication: 4 × 4 × 4 = 64, written 4³. It is the number of unit cubes in a solid cube with that edge. Cubes start 1, 8, 27, 64, 125, 216, 343, 512, 729, 1000.'
      check:
        prompt: What is 5³?
        options:
        - '125'
        - '15'
        - '25'
        answer: '125'
        why: 5 × 5 × 5 = 125; cubing is not tripling.
    - teach: 'The cube root undoes cubing: ∛125 = 5. Split the number into primes and group equal primes in threes; take one from each group. 3375 = 3 × 3 × 3 × 5 × 5 × 5, so ∛3375 = 3 × 5 = 15.'
      picture:
        kind: flow
        steps:
        - Factorise into primes
        - Group equal primes in threes
        - Take one from each group
        - Multiply them
        alt: 'Steps for a cube root: factorise into primes, group equal primes in threes, take one from each group, multiply.'
      check:
        prompt: 2744 = 2 × 2 × 2 × 7 × 7 × 7. What is ∛2744?
        options:
        - '14'
        - '28'
        - '49'
        answer: '14'
        why: 'One from each triple: 2 × 7 = 14.'
    - teach: 'If a prime is short of a full triple, the number is not a perfect cube. To make it one, multiply (or divide) by the missing primes. 1729 is the famous Hardy–Ramanujan number: the smallest number that is a sum of two cubes in two different ways, 1³ + 12³ and 9³ + 10³.'
      check:
        prompt: What must 32 = 2⁵ be multiplied by to become a perfect cube?
        options:
        - '2'
        - '4'
        - '8'
        answer: '2'
        why: 2⁵ × 2 = 2⁶ = 64 = 4³.
  items:
  - prompt: Find 6³.
    answer: '216'
    check: 6**3
    difficulty: 1
    hints:
    - 6³ = 6 × 6 × 6.
    - 36 × 6.
    solution: 6 × 6 = 36, and 36 × 6 = 216.
    mistakes:
      '18': c8_cube_not_triple
  - prompt: Find ∛343.
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Which number cubed is 343?
    - 7 × 7 × 7.
    solution: 7 × 7 = 49, 49 × 7 = 343, so ∛343 = 7.
    mistakes: {"49": "t8_cube_root", "114": "t8_cube_root"}
  - prompt: Use prime factors to find ∛1728.
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - 1728 = 2⁶ × 3³.
    - 'Group in threes: (2×2×2)(2×2×2)(3×3×3).'
    solution: 'Step 1: 1728 = 2 × 2 × 2 × 2 × 2 × 2 × 3 × 3 × 3. Step 2: One from each group of three: 2 × 2 × 3 = 12.'
    mistakes: {"144": "t8_cube_triples", "576": "t8_cube_triples"}
  - prompt: Which number is both a perfect square and a perfect cube?
    options:
    - '64'
    - '16'
    - '27'
    - '100'
    answer: '64'
    difficulty: 2
    hints:
    - 'Check each: is it n² and also m³?'
    - 64 = 8² and 4³.
    solution: 64 = 8 × 8 and 64 = 4 × 4 × 4. 16 is not a cube, 27 not a square, 100 not a cube.
    mistakes: {"16": "t8_square_and_cube", "27": "t8_square_and_cube"}
  - prompt: What is the smallest number you must multiply 72 by to get a perfect cube?
    answer: '3'
    check: 216/72
    difficulty: 3
    hints:
    - 72 = 2³ × 3².
    - The 3s need one more to make a group of three.
    solution: 'Step 1: 72 = 2 × 2 × 2 × 3 × 3. Step 2: The 3s form a group of only two, so multiply by one more 3. Step 3: 72 × 3 = 216 = 6³.'
    mistakes: {"2": "t8_complete_triples", "9": "t8_complete_triples"}
  - prompt: 1729 = 1³ + 12³. It is also 9³ + b³. Find b.
    answer: '10'
    check: '10'
    difficulty: 3
    hints:
    - 9³ = 729.
    - 1729 − 729 = 1000.
    solution: 'Step 1: 9³ = 729. Step 2: b³ = 1729 − 729 = 1000, so b = 10.'
    mistakes: {"1000": "t8_subtract_cube", "11": "t8_subtract_cube"}
  - prompt: Find 11³.
    answer: '1331'
    check: 11**3
    difficulty: 1
    hints:
    - 11 × 11 = 121.
    - Then multiply 121 by 11.
    solution: 11³ = 1331.
    mistakes:
      '33': c8_cube_not_triple
      '121': c8_cube_not_triple
  - prompt: Find ∛512.
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Which number used three times gives 512?
    - 8 × 8 = 64.
    solution: 8³ = 512, so ∛512 = 8.
    mistakes:
      '16': t8_cube_root
  - prompt: Use prime factors to find ∛9261.
    answer: '21'
    check: '21'
    difficulty: 3
    hints:
    - 9261 = 3 × 3 × 3 × 7 × 7 × 7.
    - Take one from each triple.
    solution: ∛9261 = 3 × 7 = 21.
    mistakes:
      '63': c8m1_pairs
  - prompt: What is the smallest number you must divide 3000 by to get a perfect cube?
    answer: '3'
    check: 3000/1000
    difficulty: 2
    hints:
    - 3000 = 2³ × 5³ × 3.
    - Which prime is not in a triple?
    solution: Dividing by 3 leaves 1000 = 10³.
    mistakes:
      '10': c8m1_missing
  - prompt: A cube-shaped box holds exactly 343 unit cubes. How long is its edge?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - Number of unit cubes = edge³.
    - Find the cube root of 343.
    solution: ∛343 = 7 units.
    mistakes:
      '49': t8_cube_root
  - prompt: Which of these is a perfect cube?
    options:
    - '216'
    - '200'
    - '256'
    - '300'
    answer: '216'
    difficulty: 2
    hints:
    - Check 5³, 6³, 7³.
    - 6 × 6 × 6 = ?
    solution: 216 = 6³; 256 is 2⁸, a square but not a cube.
    mistakes:
      '256': t8_square_and_cube
  - prompt: What is the smallest number you must multiply 500 by to get a perfect cube?
    answer: '2'
    check: 1000/500
    difficulty: 3
    hints:
    - 500 = 2 × 2 × 5 × 5 × 5.
    - Which prime needs one more to make a triple?
    solution: 500 = 2² × 5³; × 2 gives 2³ × 5³ = 1000 = 10³.
    mistakes:
      '4': c8m1_missing
      '5': c8m1_missing
  - prompt: Find 2³ + 3³ + 4³.
    answer: '99'
    check: 2**3+3**3+4**3
    difficulty: 2
    hints:
    - Work out each cube first.
    - 8, 27 and 64.
    solution: 8 + 27 + 64 = 99.
    mistakes:
      '27': c8_cube_not_triple
  - prompt: The edge of a cube is doubled. How many times larger is its volume?
    answer: '8'
    check: 2**3
    difficulty: 3
    hints:
    - Volume = edge³.
    - (2a)³ = ?
    solution: (2a)³ = 8a³, so the volume becomes 8 times.
    mistakes:
      '2': c8_cube_not_triple
      '4': c8_cube_not_triple
