# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 11 (Part 2 chapter 4). Format: content/README.md.
subject: cbse8-math
chapter: 11
title: Exploring Some Geometric Themes
tips:
  t8_cube_edges: "Count the edges: 4 on top, 4 on the bottom and 4 going up."
  t8_cube_nets: "There are more nets than faces. Try sketching: how many different arrangements of 6 squares fold up?"
  t8_euler: "Euler's rule: F + V − E = 2. Put in the numbers you know and solve."
  t8_fractal_steps: "Each step keeps 8 of 9 squares in every square. Two steps: 8 × 8, not 8 + 8."
  t8_fraction_steps: "Multiply by 3/4 once for each step."
  t8_front_view: "Look at a cone from the side at eye level. What outline do you see?"
  t8_koch_sides: "Each side becomes 4 smaller sides. Multiply the number of sides by 4."
  t8_natural_fractal: "Look for a shape where each small part looks like a mini copy of the whole."
  t8_self_similar: "Zoom into a fern or a coastline. What does the small part look like?"
  t8_top_view: "Imagine looking straight down at a tin can. What shape do you see?"
  c8m11_powers: 'The same step repeats, so the number multiplies each time: use a power, not addition.'
  c8m11_area_left: Each step keeps the same fraction of what was there. Multiply that fraction once per step.
  c8m11_euler_solve: Put the numbers you know into F + V − E = 2 and solve for the one you don't.
  c8m11_count_faces: Count the faces you can see, then the ones hidden at the back and bottom.
  c8m11_view: 'Imagine your eye exactly where the question says: straight above, or level in front.'
  c8m11_koch_length: Each side is replaced by 4 pieces, each a third as long. The total length is multiplied by 4/3.

concepts:
- code: cbse8m.geo.fractals
  title: 'Fractals: patterns that repeat inside themselves'
  notes: |
    A fractal is a shape built by repeating the same step at smaller and smaller sizes, so each part looks like
    the whole. Sierpinski gasket: from a triangle, remove the middle triangle (joining the midpoints) and
    repeat on the 3 corner triangles; after n steps there are 3ⁿ small triangles and the shaded area is
    (3/4)ⁿ of the original. Sierpinski carpet: split a square into 9, remove the middle, repeat: 8ⁿ squares.
    Koch snowflake: replace the middle third of each side with two sides of a small triangle; each step
    multiplies the number of sides by 4 and the perimeter by 4/3.
  explanations:
    text: A fractal is a pattern that repeats the same rule again and again at smaller sizes. In the Sierpinski triangle you keep cutting the middle out of every triangle. Zoom in on any corner and it looks like the whole picture.
    visual: Draw a big triangle, join the midpoints of its sides and shade the middle triangle out. Do the same in each of the 3 corner triangles, then in each of the 9 smaller ones. The number of triangles goes 1, 3, 9, 27.
    step_by_step: 'Step 1: Write down the rule for one step. Step 2: Count how many pieces one piece becomes (3 for the gasket, 8 for the carpet, 4 sides for each side of the Koch curve). Step 3: After n steps, raise that number to the power n. Step 4: For area or perimeter, multiply by the same fraction each step.'
    real_world: Fern leaves, cauliflower and coastlines are natural fractals, and the Kolam and Rangoli patterns of India often repeat a motif at different sizes.
  picture:
    kind: bars
    bars:
    - label: Step 0
      value: 1
    - label: Step 1
      value: 3
    - label: Step 2
      value: 9
    - label: Step 3
      value: 27
    unit: triangles
    caption: 'Sierpinski gasket: each step turns every triangle into 3.'
    alt: Bars showing 1, 3, 9 and 27 triangles at steps 0 to 3 of the Sierpinski gasket.
  activity:
    type: formula
    prompt: 'The Sierpinski triangle: at each stage, cut the middle out of every triangle.'
    inputs:
    - name: n
      label: Stage n
      min: 0
      max: 10
      step: 1
      start: 0
    outputs:
    - name: tri
      label: Shaded triangles
      expr: 3^n
    - name: left
      label: Fraction of area left
      expr: (3/4)^n
      places: 3
    goals:
    - prompt: Reach 27 shaded triangles.
      want:
        tri: 27
      mistakes:
      - when:
          n: 2
        say: 9 triangles. Each stage turns every triangle into 3, so 9 × 3 at the next stage.
      - when:
          n:
          - 4
          - 10
        say: 'Too many stages: each stage multiplies by 3, so it grows fast.'
    - prompt: Leave less than half the area shaded.
      want:
        left:
        - 0
        - 0.5
      mistakes:
      - when:
          n: 2
        say: 'Each stage keeps 3/4 of what was there: 3/4 × 3/4 = 9/16, still more than half.'
      - when:
          n: 1
        say: One cut leaves 3/4. Keep going.
    - prompt: Make the shaded area under 1/10 of the start.
      want:
        left:
        - 0
        - 0.1
      mistakes:
      - when:
          n:
          - 3
          - 8
        say: Still at least 0.1. The area shrinks, but by only a quarter each time.
  lesson:
    - teach: A fractal is a shape made by repeating the same step at smaller and smaller sizes, so a small part looks like the whole. Ferns, cauliflower, coastlines and river networks look like this in nature.
      check:
        prompt: What makes a shape a fractal?
        options:
        - Small parts look like the whole shape
        - It has many straight sides
        - It is perfectly round
        answer: Small parts look like the whole shape
        why: A fractal repeats the same pattern at smaller sizes, so each part is a mini copy of the whole.
    - teach: 'The Sierpinski gasket: start with a filled triangle. Join the midpoints of the sides and remove the middle triangle, leaving 3 smaller triangles. Repeat on each one. After n steps there are 3ⁿ small triangles, and each step keeps 3/4 of the shaded area.'
      picture:
        kind: flow
        steps:
        - 'Step 0: 1 triangle'
        - 'Step 1: 3 triangles'
        - 'Step 2: 9 triangles'
        - 'Step 3: 27 triangles'
        alt: 'The Sierpinski gasket has 1, 3, 9, then 27 triangles: three times as many at each step.'
      check:
        prompt: How many shaded triangles are in the Sierpinski gasket after 2 steps?
        options:
        - '9'
        - '6'
        - '4'
        answer: '9'
        why: 'Each step triples the number: 1 → 3 → 9.'
    - teach: 'The Koch snowflake: start with a triangle. Replace the middle third of each side with two sides of a small bump, so each side becomes 4 sides, each one third as long. The number of sides is multiplied by 4 each step, and the perimeter by 4/3.'
      picture:
        kind: compare
        columns:
        - title: Step
          points:
          - '0'
          - '1'
          - '2'
        - title: Sides
          points:
          - '3'
          - '12'
          - '48'
        alt: 'The Koch snowflake has 3 sides, then 12, then 48: four times as many each step.'
      check:
        prompt: A Koch snowflake has 12 sides. How many after one more step?
        options:
        - '48'
        - '16'
        - '24'
        answer: '48'
        why: 'Every side becomes 4 sides: 12 × 4 = 48.'
  items:
  - prompt: In the Sierpinski gasket, how many shaded triangles are there after 4 steps?
    answer: '81'
    check: 3**4
    difficulty: 2
    hints:
    - Each step multiplies the count by 3.
    - 3⁴.
    solution: 3⁴ = 81.
    mistakes:
      '12': c8_power_not_times
  - prompt: In the Sierpinski carpet, how many small squares remain after 2 steps?
    answer: '64'
    check: 8**2
    difficulty: 2
    hints:
    - Each square becomes 8.
    - 8².
    solution: 8² = 64.
    mistakes: {"16": "t8_fractal_steps", "8": "t8_fractal_steps"}
  - prompt: Each step of the Sierpinski gasket keeps 3/4 of the shaded area. What fraction is left after 2 steps? Type a fraction.
    answer: 9/16
    check: Rational(3, 4)**2
    difficulty: 3
    hints:
    - (3/4)².
    - 9/16.
    solution: (3/4) × (3/4) = 9/16.
    mistakes: {"3/8": "t8_fraction_steps", "6/4": "t8_fraction_steps"}
  - prompt: A Koch snowflake starts as a triangle with 3 sides. How many sides after 1 step?
    answer: '12'
    check: 3*4
    difficulty: 2
    hints:
    - Each side becomes 4 sides.
    - 3 × 4.
    solution: 3 × 4 = 12 sides.
    mistakes: {"6": "t8_koch_sides", "7": "t8_koch_sides"}
  - prompt: Which is true of a fractal?
    options:
    - Small parts look like the whole shape
    - It must be a triangle
    - It has no repeating rule
    - It can never be found in nature
    answer: Small parts look like the whole shape
    difficulty: 1
    hints:
    - Zoom into a corner.
    - The same pattern appears.
    solution: 'Fractals are self-similar: zoom in and the same pattern repeats.'
    mistakes: {"It must be a triangle": "t8_self_similar", "It has no repeating rule": "t8_self_similar"}
  - prompt: Which of these shows a natural fractal pattern?
    options:
    - A fern leaf
    - A cricket ball
    - A brick
    - A ruler
    answer: A fern leaf
    difficulty: 1
    hints:
    - Look for parts shaped like the whole.
    - Each small leaflet is like the whole leaf.
    solution: Each part of a fern leaf looks like a small copy of the whole leaf.
    mistakes: {"A cricket ball": "t8_natural_fractal", "A brick": "t8_natural_fractal"}
  - prompt: In the Sierpinski gasket, how many shaded triangles are there after 3 steps?
    answer: '27'
    check: 3**3
    difficulty: 1
    hints:
    - Each step triples the count.
    - 1 → 3 → 9 → ?
    solution: 3 × 3 × 3 = 27 triangles.
    mistakes:
      '9': c8m11_powers
      '12': c8m11_powers
  - prompt: A Koch snowflake starts with 3 sides. How many sides after 2 steps?
    answer: '48'
    check: 3*4**2
    difficulty: 2
    hints:
    - Each step multiplies the sides by 4.
    - 3 → 12 → ?
    solution: 3 × 4 = 12, then 12 × 4 = 48 sides.
    mistakes:
      '24': t8_koch_sides
      '11': c8m11_powers
  - prompt: In the Sierpinski carpet, a square is cut into 9 and the middle one removed; this is repeated. How many small squares remain after 3 steps?
    answer: '512'
    check: 8**3
    difficulty: 3
    hints:
    - Each step keeps 8 of every 9 squares.
    - 8 × 8 × 8.
    solution: 'After each step there are 8 times as many squares: 8, 64, 512.'
    mistakes:
      '24': t8_fractal_steps
      '729': t8_fractal_steps
  - prompt: Each step of the Sierpinski gasket keeps 3/4 of the shaded area. What fraction of the area is left after 3 steps?
    answer: 27/64
    check: Rational(3, 4)**3
    difficulty: 3
    hints:
    - Multiply by 3/4 three times.
    - (3 × 3 × 3)/(4 × 4 × 4).
    solution: (3/4)³ = 27/64.
    mistakes:
      9/12: c8m11_area_left
      1/4: c8m11_area_left
  - prompt: A Koch snowflake starts as a triangle with sides of 9 cm, so its perimeter is 27 cm. What is the perimeter after 1 step, in cm?
    answer: '36'
    check: 27*4/3
    difficulty: 3
    hints:
    - Each side becomes 4 pieces of 3 cm.
    - Each side is now 12 cm long.
    solution: 'Each 9 cm side becomes 4 pieces of 3 cm = 12 cm. Three sides: 3 × 12 = 36 cm.'
    mistakes:
      '27': c8m11_koch_length
      '108': c8m11_koch_length
  - prompt: Which is a fractal-like pattern in nature?
    options:
    - Branches of a tree
    - A smooth pebble
    - A brick
    answer: Branches of a tree
    difficulty: 1
    hints:
    - Look for a shape whose parts look like smaller copies of the whole.
    - A branch splits like the tree splits.
    solution: A tree splits into branches, which split into smaller branches that look like small trees.
    mistakes:
      A smooth pebble: t8_natural_fractal
      A brick: t8_natural_fractal
  - prompt: In the Sierpinski gasket, how many triangles are removed in step 2 alone?
    answer: '3'
    check: 3**1
    difficulty: 2
    hints:
    - After step 1 there are 3 shaded triangles.
    - One middle triangle is removed from each.
    solution: 'Step 2 removes one middle triangle from each of the 3 shaded triangles: 3 removed.'
    mistakes:
      '9': c8m11_powers
      '1': c8m11_powers
  - prompt: Why does a fractal never really end?
    options:
    - The same step can be repeated forever at smaller sizes
    - It is drawn on a computer
    - It has no corners
    answer: The same step can be repeated forever at smaller sizes
    difficulty: 2
    hints:
    - What happens after each step?
    - Can you always apply the step again?
    solution: After every step there are smaller pieces, and the same step can be done on them again, without end.
    mistakes:
      It is drawn on a computer: t8_self_similar
      It has no corners: t8_self_similar
  - prompt: In the Sierpinski gasket, how many triangles are there after 5 steps?
    answer: '243'
    check: 3**5
    difficulty: 2
    hints:
    - 3 multiplied by itself 5 times.
    - 81 × 3.
    solution: 3⁵ = 243 triangles.
    mistakes:
      '15': c8m11_powers
      '125': c8m11_powers
- code: cbse8m.geo.solids
  title: Solids, nets and views
  after:
  - cbse8m.geo.fractals
  notes: |
    Solids have faces, edges and vertices. For polyhedra (cube, cuboid, prism, pyramid) Euler's formula holds:
    F + V − E = 2. A net is a flat shape that folds into a solid; a cube has 11 different nets. A solid can be
    drawn from the front, side and top (its projections or views): a cylinder looks like a rectangle from the
    front and a circle from the top.
  explanations:
    text: Solid shapes have flat or curved faces, straight edges and corner points called vertices. If you unfold a box you get its net. Looking at a solid from the front, the side and the top gives three different flat pictures.
    visual: 'Unfold a cardboard box: six rectangles joined in a cross shape. That cross is a net of the box. Fold it back and the six rectangles become the six faces.'
    step_by_step: 'Step 1: Count the faces F. Step 2: Count the corners V. Step 3: Count the edges E. Step 4: Check F + V − E = 2. Step 5: For views, imagine looking straight at the solid from the front, the side and the top.'
    real_world: Architects draw a front view, side view and top view (plan) of a building so builders can make it exactly.
  picture:
    kind: compare
    columns:
    - title: Cube
      points:
      - 6 faces
      - 8 vertices
      - 12 edges
      - 6 + 8 − 12 = 2
    - title: Square pyramid
      points:
      - 5 faces
      - 5 vertices
      - 8 edges
      - 5 + 5 − 8 = 2
    caption: Euler's formula F + V − E = 2 works for both.
    alt: 'Two columns: a cube with 6 faces, 8 vertices and 12 edges, and a square pyramid with 5 faces, 5 vertices and 8 edges, both giving F plus V minus E equals 2.'
  activity:
    type: sort
    prompt: Which solid is it?
    bins:
    - Cube
    - Cuboid
    - Triangular prism
    - Square pyramid
    - Cylinder
    items:
    - label: A net of six equal squares
      bin: Cube
      clue: Six faces, all the same square.
      why: A cube.
    - label: 8 corners, 12 edges, every edge the same length
      bin: Cube
      clue: Equal edges in all three directions.
      why: A cube.
    - label: A brick
      bin: Cuboid
      clue: Six rectangular faces, not all the same.
      why: A cuboid.
    - label: Front view a long rectangle, top view a short rectangle
      bin: Cuboid
      clue: Flat faces, right-angled, different lengths.
      why: A cuboid.
    - label: '5 faces: 2 triangles and 3 rectangles'
      bin: Triangular prism
      clue: Same triangle at both ends, joined by rectangles.
      why: A triangular prism.
    - label: 6 corners and 9 edges
      bin: Triangular prism
      clue: Two triangles (3 corners each) joined edge to edge.
      why: A triangular prism.
    - label: Front view a triangle, top view a square with its diagonals
      bin: Square pyramid
      clue: Square base, sides rising to one point.
      why: A square pyramid.
    - label: 5 corners and 8 edges
      bin: Square pyramid
      clue: 4 corners round the base plus 1 at the top.
      why: A square pyramid.
    - label: Net of two circles and a rectangle
      bin: Cylinder
      clue: Roll the rectangle; cap it with the circles.
      why: A cylinder.
    - label: Front view a rectangle, top view a circle
      bin: Cylinder
      clue: Round from above, straight sides from the front.
      why: A cylinder.
  lesson:
    - teach: 'A solid shape has faces (flat surfaces), edges (where two faces meet) and vertices (corners). A cube has 6 faces, 12 edges and 8 vertices. For any polyhedron, a solid with flat faces, Euler''s formula holds: F + V − E = 2.'
      picture:
        kind: compare
        columns:
        - title: Solid
          points:
          - Cube
          - Triangular prism
          - Square pyramid
        - title: F, V, E
          points:
          - 6, 8, 12
          - 5, 6, 9
          - 5, 5, 8
        - title: F + V − E
          points:
          - '2'
          - '2'
          - '2'
        alt: A cube, triangular prism and square pyramid all give F plus V minus E equals 2.
      check:
        prompt: A square pyramid has 5 faces and 5 vertices. How many edges?
        options:
        - '8'
        - '10'
        - '12'
        answer: '8'
        why: 'F + V − E = 2: 5 + 5 − E = 2, so E = 8.'
    - teach: 'A net is a flat shape that folds up into a solid. A cube has 11 different nets made of 6 squares. Not every arrangement of 6 squares works: if two squares would fold onto the same side, it is not a net.'
      check:
        prompt: How many squares does every net of a cube have?
        options:
        - '6'
        - '8'
        - '4'
        answer: '6'
        why: A cube has 6 faces, and each face is one square of the net.
    - teach: A solid looks different from different sides. From the front, a cylinder looks like a rectangle, but from the top it looks like a circle. A cone from the front is a triangle, and from the top a circle with a dot in the middle.
      picture:
        kind: compare
        columns:
        - title: Solid
          points:
          - Cylinder
          - Cone
          - Cube
        - title: Front view
          points:
          - Rectangle
          - Triangle
          - Square
        - title: Top view
          points:
          - Circle
          - Circle with a dot
          - Square
        alt: 'Front and top views: a cylinder is a rectangle and a circle, a cone a triangle and a circle with a dot, a cube a square both ways.'
      check:
        prompt: What does a cylinder standing upright look like from the front?
        options:
        - A rectangle
        - A circle
        - A triangle
        answer: A rectangle
        why: From the front you see its height and width, which make a rectangle.
  items:
  - prompt: How many edges does a cube have?
    answer: '12'
    check: 4 + 4 + 4
    difficulty: 1
    hints:
    - 4 on top, 4 on the bottom, 4 upright.
    - 4 + 4 + 4.
    solution: A cube has 12 edges.
    mistakes: {"8": "t8_cube_edges", "6": "t8_cube_edges"}
  - prompt: A polyhedron has 6 faces and 8 vertices. How many edges does it have?
    answer: '12'
    check: 6 + 8 - 2
    difficulty: 2
    hints:
    - F + V − E = 2.
    - 6 + 8 − E = 2.
    solution: E = 6 + 8 − 2 = 12.
    mistakes: {"14": "t8_euler", "16": "t8_euler"}
  - prompt: A triangular prism has 6 vertices and 9 edges. How many faces?
    answer: '5'
    check: 2 - 6 + 9
    difficulty: 2
    hints:
    - F = 2 − V + E.
    - 2 − 6 + 9.
    solution: F = 2 − 6 + 9 = 5 (2 triangles and 3 rectangles).
    mistakes: {"3": "t8_euler", "17": "t8_euler"}
  - prompt: What does a cylinder look like from directly above?
    options:
    - A circle
    - A rectangle
    - A triangle
    - A square
    answer: A circle
    difficulty: 1
    hints:
    - Think of looking down at a tin.
    - You see its round top.
    solution: 'From the top you see the round end of the cylinder: a circle.'
    mistakes: {"A rectangle": "t8_top_view", "A square": "t8_top_view"}
  - prompt: What does a cone standing on its base look like from the front?
    options:
    - A triangle
    - A circle
    - A rectangle
    - A square
    answer: A triangle
    difficulty: 1
    hints:
    - Look at an ice-cream cone from the side.
    - It narrows to a point.
    solution: From the front a cone looks like a triangle; from the top like a circle with a dot.
    mistakes: {"A circle": "t8_front_view", "A rectangle": "t8_front_view"}
  - prompt: How many different nets does a cube have?
    options:
    - '11'
    - '6'
    - '8'
    - '1'
    answer: '11'
    difficulty: 3
    hints:
    - 'Try drawing them: more than 6.'
    - There are eleven.
    solution: There are exactly 11 different nets that fold into a cube.
    mistakes: {"6": "t8_cube_nets", "1": "t8_cube_nets"}
  - prompt: How many vertices does a cube have?
    answer: '8'
    check: 4 + 4
    difficulty: 1
    hints:
    - Count the corners on the top face.
    - And the same number on the bottom.
    solution: '4 corners on top and 4 on the bottom: 8 vertices.'
    mistakes:
      '6': c8m11_count_faces
      '12': t8_cube_edges
  - prompt: A polyhedron has 8 faces and 6 vertices. How many edges does it have?
    answer: '12'
    check: 8 + 6 - 2
    difficulty: 2
    hints:
    - F + V − E = 2.
    - 8 + 6 − E = 2.
    solution: 14 − E = 2, so E = 12. (This is an octahedron.)
    mistakes:
      '16': c8m11_euler_solve
      '2': c8m11_euler_solve
  - prompt: A pentagonal prism has 7 faces and 15 edges. How many vertices does it have?
    answer: '10'
    check: 2 - 7 + 15
    difficulty: 2
    hints:
    - F + V − E = 2.
    - 7 + V − 15 = 2.
    solution: V = 2 − 7 + 15 = 10. (5 on top and 5 on the bottom.)
    mistakes:
      '20': c8m11_euler_solve
      '24': c8m11_euler_solve
  - prompt: How many faces does a triangular pyramid (tetrahedron) have?
    answer: '4'
    check: 1 + 3
    difficulty: 1
    hints:
    - One triangle is the base.
    - How many triangles meet at the top?
    solution: '1 triangular base and 3 triangular sides: 4 faces.'
    mistakes:
      '3': c8m11_count_faces
      '5': c8m11_count_faces
  - prompt: What does a cone look like from directly above?
    options:
    - A circle with a dot in the middle
    - A triangle
    - A square
    answer: A circle with a dot in the middle
    difficulty: 1
    hints:
    - Look straight down on it.
    - You see the round base and the tip in the centre.
    solution: From above you see the round base as a circle, with the tip as a dot in the centre.
    mistakes:
      A triangle: c8m11_view
      A square: t8_top_view
  - prompt: What does a cuboid lying flat look like from the top?
    options:
    - A rectangle
    - A circle
    - A triangle
    answer: A rectangle
    difficulty: 1
    hints:
    - Its top face is flat.
    - What shape is each face of a cuboid?
    solution: Every face of a cuboid is a rectangle, so its top view is a rectangle.
    mistakes:
      A circle: c8m11_view
      A triangle: c8m11_view
  - prompt: A square pyramid has how many edges?
    answer: '8'
    check: 4 + 4
    difficulty: 2
    hints:
    - 4 edges round the square base.
    - And one from each base corner to the top.
    solution: 4 base edges + 4 slanting edges = 8 edges.
    mistakes:
      '4': c8m11_count_faces
      '5': c8m11_count_faces
  - prompt: Does Euler's formula hold for a cube? (F = 6, V = 8, E = 12)
    options:
    - Yes, 6 + 8 − 12 = 2
    - No, 6 + 8 + 12 = 26
    - No, it only works for pyramids
    answer: Yes, 6 + 8 − 12 = 2
    difficulty: 1
    hints:
    - Work out F + V − E.
    - 6 + 8 − 12.
    solution: 6 + 8 − 12 = 2, so Euler's formula holds.
    mistakes:
      No, 6 + 8 + 12 = 26: t8_euler
      No, it only works for pyramids: t8_euler
  - prompt: A solid has 10 faces and 16 vertices. How many edges must it have?
    answer: '24'
    check: 10 + 16 - 2
    difficulty: 3
    hints:
    - F + V − E = 2.
    - 26 − E = 2.
    solution: 10 + 16 − E = 2, so E = 24. (An octagonal prism.)
    mistakes:
      '28': c8m11_euler_solve
      '4': c8m11_euler_solve
