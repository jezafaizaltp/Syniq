# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 8 (Part 2 chapter 1). Format: content/README.md.
subject: cbse8-math
chapter: 8
title: Fractions in Disguise
tips:
  c8_pct_digits: A percentage isn't the two numbers side by side. Multiply the fraction by 100.
  c8_pct_decimal: 'Multiply a decimal by 100 to get a percentage: 0.07 × 100 = 7.'
  c8_pct_then_subtract: That is the discount. Take it away from the price to get what you pay.
  c8_pct_base_changes: The second change is a percentage of the new amount, not the starting one.
concepts:
- code: cbse8m.pct.convert
  title: Fractions as percentages
  notes: |
    Per cent means 'out of 100': 35% = 35/100 = 0.35. Fraction to percentage: multiply by 100 (3/4 = 75%).
    Percentage to fraction: write over 100 and simplify (40% = 2/5). Useful ones: 1/2 = 50%, 1/4 = 25%,
    1/5 = 20%, 1/10 = 10%, 1/3 ≈ 33.3%. Percentages make different-sized groups easy to compare.
  explanations:
    text: A percentage is a fraction in disguise, with 100 as the bottom number. 25% means 25 out of every 100, which is the same as 1/4. To turn a fraction into a percentage, multiply it by 100.
    visual: Shade a 10 by 10 grid of 100 squares. Shading 30 squares is 30%, which is 3/10 of the grid. Half the grid is 50 squares, 50%.
    step_by_step: 'Step 1: Fraction to percentage: multiply by 100 and add %. Step 2: Percentage to fraction: put it over 100. Step 3: Simplify the fraction. Step 4: Percentage to decimal: divide by 100.'
    real_world: 'Two classes: 18 of 24 pass in A and 21 of 30 in B. As percentages, 75% and 70%, so class A did better even though fewer passed.'
  picture:
    kind: area_grid
    cols:
    - size: 3
      label: 3/4
    - size: 1
      label: 1/4
    rows:
    - size: 1
      label: whole
    cells:
    - - 75%
      - 25%
    caption: 3/4 of a whole is 75%, and the rest, 1/4, is 25%.
    alt: A bar split into three quarters marked 75 per cent and one quarter marked 25 per cent.
  activity:
    type: number_line
    min: 0
    max: 100
    step: 5
    start: 0
    prompt: 'Mark each fraction as a percentage: how many out of 100?'
    goals:
    - prompt: 1/4
      target: 25
      mistakes:
      - when:
          v: 75
        say: 75% is 3/4. One quarter is 100 ÷ 4.
      - when:
          v: 40
        say: 'Not 4 out of 10. Make the bottom 100: 1/4 = ?/100.'
    - prompt: 3/5
      target: 60
      mistakes:
      - when:
          v: 35
        say: 'Writing 3 and 5 side by side isn''t a percentage. 5 goes into 100 twenty times: 3 × 20.'
      - when:
          v: 30
        say: 3 × 10 = 30. But 5 × 10 is only 50, not 100. Multiply by 20.
    - prompt: 7/20
      target: 35
      mistakes:
      - when:
          v: 70
        say: '7 × 10 = 70, but 20 × 10 = 200. 20 goes into 100 five times: 7 × 5.'
      - when:
          v: 20
        say: That's the bottom number. Turn 20 into 100 and do the same to the 7.
    - prompt: 9/10
      target: 90
      mistakes:
      - when:
          v: 10
        say: 10% is 1/10. Here you have 9 tenths.
      - when:
          v: 45
        say: Half of 90. Each tenth is 10%, so 9 tenths is …?
  items:
  - prompt: Write 3/5 as a percentage. Type the number only.
    answer: '60'
    check: Rational(3, 5)*100
    difficulty: 1
    hints:
    - Multiply by 100.
    - 3/5 × 100.
    solution: 3/5 × 100 = 60%.
    mistakes:
      '35': c8_pct_digits
  - prompt: Write 45% as a fraction in simplest form.
    options:
    - 9/20
    - 45/10
    - 4/5
    - 9/2
    answer: 9/20
    difficulty: 1
    hints:
    - 45/100.
    - Divide both by 5.
    solution: 45% = 45/100 = 9/20.
  - prompt: Write 0.07 as a percentage. Type the number only.
    answer: '7'
    check: Rational(7, 100)*100
    difficulty: 1
    hints:
    - Multiply by 100.
    - 0.07 × 100.
    solution: 0.07 × 100 = 7%.
    mistakes:
      '70': c8_pct_decimal
  - prompt: In a class of 40, 18 are girls. What percentage are girls? Type the number only.
    answer: '45'
    check: Rational(18, 40)*100
    difficulty: 2
    hints:
    - 18/40 × 100.
    - 18/40 = 0.45.
    solution: 18/40 × 100 = 45%.
  - prompt: Team A won 12 of 16 games; team B won 14 of 20. Which won the bigger percentage?
    options:
    - Team A (75% vs 70%)
    - Team B (70% vs 75%)
    - Both the same
    - Can't tell
    answer: Team A (75% vs 70%)
    difficulty: 2
    hints:
    - 12/16 = 3/4.
    - 14/20 = 7/10.
    solution: 12/16 = 75% and 14/20 = 70%, so team A.
  - prompt: Write 1/8 as a percentage. Type the number only, as a decimal.
    answer: '12.5'
    check: Rational(100, 8)
    difficulty: 3
    hints:
    - 1/8 × 100.
    - 100 ÷ 8.
    solution: 100 ÷ 8 = 12.5, so 1/8 = 12.5%.
- code: cbse8m.pct.of
  title: Percentage of a quantity
  after:
  - cbse8m.pct.convert
  notes: |
    To find p% of a quantity, multiply by p/100: 15% of 200 = 30. To find what percentage a is of b, work out
    a/b × 100. Increase by p%: new = old × (100 + p)/100; decrease by p%: new = old × (100 − p)/100.
    Profit or discount percentages are worked out on the original price.
  explanations:
    text: To find a percentage of something, change the percentage into a fraction and multiply. 10% is one-tenth, so 10% of ₹350 is ₹35; 20% is double that, ₹70. Percentage increases and decreases are always worked out on the starting amount.
    visual: 'Draw a bar for ₹400 split into 10 boxes of ₹40. Each box is 10%. 25% is two and a half boxes: ₹100.'
    step_by_step: 'Step 1: Write p% as p/100. Step 2: Multiply by the quantity. Step 3: For an increase, add the result to the original; for a decrease, subtract it. Step 4: Check the answer is sensible (10% should be a tenth).'
    real_world: 'A ₹1200 jacket has a 25% discount: 25% of 1200 = ₹300 off, so you pay ₹900.'
  picture:
    kind: flow
    steps:
    - 15% of 240
    - 10% of 240 = 24
    - 5% of 240 = 12
    - 15% = 24 + 12 = 36
    alt: Finding 15 per cent of 240 by adding 10 per cent, 24, and 5 per cent, 12, to get 36.
  activity:
    type: formula
    prompt: Prices and percentages. Set the starting price and the percentage.
    inputs:
    - name: a
      label: Starting price
      min: 0
      max: 2000
      step: 50
      start: 100
      unit: ₹
    - name: p
      label: Percentage
      min: 0
      max: 100
      step: 5
      start: 0
      unit: '%'
    outputs:
    - name: part
      label: p% of the price
      expr: a*p/100
      unit: ₹
    - name: up
      label: After a p% rise
      expr: a*(1+p/100)
      unit: ₹
    - name: down
      label: After a p% cut
      expr: a*(1-p/100)
      unit: ₹
    goals:
    - prompt: After a 25% discount a shirt costs ₹600. Find the original price.
      want:
        p: 25
        down: 600
      mistakes:
      - when:
          p: 25
          a: 750
        say: ₹750 is 600 + 25% of 600. The 25% was taken off the original price, not off ₹600.
      - when:
          p: 25
          a: 600
        say: ₹600 is the price after the discount. Find the price that 25% off turns into ₹600.
    - prompt: A price rose 10% to ₹550. Find the old price.
      want:
        p: 10
        up: 550
      mistakes:
      - when:
          p: 10
          a: 550
        say: ₹550 is the new price. Find the price that a 10% rise turns into ₹550.
      - when:
          p: 10
          a: 600
        say: A 10% rise goes up, so the old price must be less than ₹550.
    - prompt: What percent of ₹400 is ₹60?
      want:
        a: 400
        part: 60
      mistakes:
      - when:
          a: 400
          p: 60
        say: 60 is the amount, not the percentage. ₹60 out of ₹400 is how many out of 100?
  items:
  - prompt: Find 15% of 240.
    answer: '36'
    check: 240*Rational(15, 100)
    difficulty: 1
    hints:
    - 10% is 24, 5% is 12.
    - Or 240 × 15/100.
    solution: 240 × 15/100 = 36.
  - prompt: A ₹800 bag is sold at a 20% discount. What is the sale price, in rupees?
    answer: '640'
    check: 800*Rational(80, 100)
    difficulty: 2
    hints:
    - 20% of 800 = 160.
    - 800 − 160.
    solution: Discount = ₹160, so the price is ₹640.
    mistakes:
      '160': c8_pct_then_subtract
  - prompt: What percentage of 250 is 40? Type the number only.
    answer: '16'
    check: Rational(40, 250)*100
    difficulty: 2
    hints:
    - 40/250 × 100.
    - 40/250 = 0.16.
    solution: 40/250 × 100 = 16%.
  - prompt: A town of 20,000 people grows by 5%. What is the new population?
    answer: '21000'
    check: 20000*Rational(105, 100)
    difficulty: 2
    hints:
    - 5% of 20,000 = 1000.
    - Add it on.
    solution: 20,000 + 1000 = 21,000.
  - prompt: A price rises by 10% and then falls by 10%. If it started at ₹1000, what is it now, in rupees?
    answer: '990'
    check: 1000*Rational(110, 100)*Rational(90, 100)
    difficulty: 3
    hints:
    - 'After the rise: ₹1100.'
    - 10% of 1100 is 110.
    solution: '1000 → 1100 → 1100 − 110 = ₹990: the fall is worked out on the bigger price.'
    mistakes:
      '1000': c8_pct_base_changes
  - prompt: A shirt bought for ₹500 is sold for ₹600. What is the profit percentage? Type the number only.
    answer: '20'
    check: Rational(100, 500)*100
    difficulty: 2
    hints:
    - Profit = ₹100.
    - 100/500 × 100.
    solution: Profit ₹100 on ₹500 is 100/500 × 100 = 20%.
