# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 8 (Part 2 chapter 1). Format: content/README.md.
subject: cbse8-math
chapter: 8
title: Fractions in Disguise
tips:
  c8_pct_digits: A percentage isn't the two numbers side by side. Multiply the fraction by 100.
  c8_pct_decimal: "Percent means out of 100. Multiply the decimal by 100: the point moves two places to the right."
  c8_pct_then_subtract: That is the discount. Take it away from the price to get what you pay.
  c8_pct_base_changes: The second change is a percentage of the new amount, not the starting one.
  t8_compare_percent: "Turn each win record into a percentage before comparing."
  t8_fraction_to_percent: "Multiply the fraction by 100: 100 ÷ 8."
  t8_increase_add: "Find 5% of 20,000, then ADD it to the old population."
  t8_percent_fraction: "Per cent means out of 100. Write it over 100 and simplify."
  t8_percent_of: "Multiply the number by the percentage over 100."
  t8_percent_of_class: "Percentage = part ÷ whole × 100. The whole is the whole class."
  t8_profit_on_cost: "Profit percentage is worked out on the cost price: profit ÷ cost × 100."
  t8_what_percent: "What percentage of 250 is 40? Divide 40 by 250, then multiply by 100."
  c8m8_over_100: Per cent means out of 100. Write the number over 100, then simplify by a common factor.
  c8m8_times_100: To turn a fraction into a percentage, multiply it by 100.
  c8m8_whole: Percentage = part ÷ whole × 100. Which number is the whole here?
  c8m8_new_amount: The question asks for the new amount, not the change. Add or subtract the change.
  c8m8_original: Profit and discount percentages are always worked out on the original price.
  c8m8_ten_percent: Find 10% first by dividing by 10, then build the percentage you need from it.
concepts:
- code: cbse8m.pct.convert
  title: Fractions as percentages
  notes: |
    Per cent means 'out of 100': 35% = 35/100 = 0.35. Fraction to percentage: multiply by 100 (3/4 = 75%).
    Percentage to fraction: write over 100 and simplify (40% = 2/5). Useful ones: 1/2 = 50%, 1/4 = 25%,
    1/5 = 20%, 1/10 = 10%, 1/3 ≈ 33.3%. Percentages make different-sized groups easy to compare.
  explanations:
    text: A percentage is a fraction in disguise, with 100 as the bottom number. 25% means 25 out of every 100, which is the same as 1/4. To turn a fraction into a percentage, multiply it by 100.
    visual: Shade a 10 by 10 grid of 100 squares. Shading 30 squares is 30%, which is 3/10 of the grid. Half the grid is 50 squares, 50%.
    step_by_step: 'Step 1: Fraction to percentage: multiply by 100 and add %. Step 2: Percentage to fraction: put it over 100. Step 3: Simplify the fraction. Step 4: Percentage to decimal: divide by 100.'
    real_world: 'Two classes: 18 of 24 pass in A and 21 of 30 in B. As percentages, 75% and 70%, so class A did better even though fewer passed.'
  picture:
    kind: area_grid
    cols:
    - size: 3
      label: 3/4
    - size: 1
      label: 1/4
    rows:
    - size: 1
      label: whole
    cells:
    - - 75%
      - 25%
    caption: 3/4 of a whole is 75%, and the rest, 1/4, is 25%.
    alt: A bar split into three quarters marked 75 per cent and one quarter marked 25 per cent.
  activity:
    type: number_line
    min: 0
    max: 100
    step: 5
    start: 0
    prompt: 'Mark each fraction as a percentage: how many out of 100?'
    goals:
    - prompt: 1/4
      target: 25
      mistakes:
      - when:
          v: 75
        say: 75% is 3/4. One quarter is 100 ÷ 4.
      - when:
          v: 40
        say: 'Not 4 out of 10. Make the bottom 100: 1/4 = ?/100.'
    - prompt: 3/5
      target: 60
      mistakes:
      - when:
          v: 35
        say: 'Writing 3 and 5 side by side isn''t a percentage. 5 goes into 100 twenty times: 3 × 20.'
      - when:
          v: 30
        say: 3 × 10 = 30. But 5 × 10 is only 50, not 100. Multiply by 20.
    - prompt: 7/20
      target: 35
      mistakes:
      - when:
          v: 70
        say: '7 × 10 = 70, but 20 × 10 = 200. 20 goes into 100 five times: 7 × 5.'
      - when:
          v: 20
        say: That's the bottom number. Turn 20 into 100 and do the same to the 7.
    - prompt: 9/10
      target: 90
      mistakes:
      - when:
          v: 10
        say: 10% is 1/10. Here you have 9 tenths.
      - when:
          v: 45
        say: Half of 90. Each tenth is 10%, so 9 tenths is …?
  lesson:
    - teach: Per cent means 'out of 100'. 35% is 35 out of 100, so 35% = 35/100 = 0.35. A percentage is a fraction in disguise, with 100 as its bottom number. 100% is the whole thing.
      picture:
        kind: compare
        columns:
        - title: Percentage
          points:
          - 50%
          - 25%
          - 10%
        - title: Fraction
          points:
          - 1/2
          - 1/4
          - 1/10
        - title: Decimal
          points:
          - '0.5'
          - '0.25'
          - '0.1'
        alt: 50 per cent is a half or 0.5, 25 per cent a quarter or 0.25, 10 per cent a tenth or 0.1.
      check:
        prompt: What is 40% as a decimal?
        options:
        - '0.4'
        - '4.0'
        - '0.04'
        answer: '0.4'
        why: 40% = 40/100 = 0.4.
    - teach: 'Fraction to percentage: multiply by 100. 3/4 × 100 = 75, so 3/4 = 75%. Percentage to fraction: write it over 100 and simplify. 60% = 60/100 = 3/5.'
      picture:
        kind: flow
        steps:
        - 3/4
        - × 100
        - = 300/4
        - = 75%
        alt: Three quarters times 100 is 300 over 4, which is 75 per cent.
      check:
        prompt: Write 7/20 as a percentage.
        options:
        - 35%
        - 7%
        - 20%
        answer: 35%
        why: 7/20 × 100 = 700/20 = 35.
    - teach: Percentages help compare groups of different sizes. 18 out of 24 and 21 out of 30 are hard to compare, but 75% and 70% are easy. Turn each into a percentage (part ÷ whole × 100), then compare.
      check:
        prompt: 'Which is bigger: 9 out of 12, or 16 out of 20?'
        options:
        - 16 out of 20
        - 9 out of 12
        - They are equal
        answer: 16 out of 20
        why: 9/12 = 75% and 16/20 = 80%, so 16 out of 20 is bigger.
  items:
  - prompt: Write 3/5 as a percentage. Type the number only.
    answer: '60'
    check: Rational(3, 5)*100
    difficulty: 1
    hints:
    - Multiply by 100.
    - 3/5 × 100.
    solution: 3/5 × 100 = 60%.
    mistakes:
      '35': c8_pct_digits
  - prompt: Write 45% as a fraction in simplest form.
    options:
    - 9/20
    - 45/10
    - 4/5
    - 9/2
    answer: 9/20
    difficulty: 1
    hints:
    - 45/100.
    - Divide both by 5.
    solution: 45% = 45/100 = 9/20.
    mistakes: {"45/10": "t8_percent_fraction", "9/2": "t8_percent_fraction"}
  - prompt: Write 0.07 as a percentage. Type the number only.
    answer: '7'
    check: Rational(7, 100)*100
    difficulty: 1
    hints:
    - Multiply by 100.
    - 0.07 × 100.
    solution: 0.07 × 100 = 7%.
    mistakes:
      '70': c8_pct_decimal
  - prompt: In a class of 40, 18 are girls. What percentage are girls? Type the number only.
    answer: '45'
    check: Rational(18, 40)*100
    difficulty: 2
    hints:
    - 18/40 × 100.
    - 18/40 = 0.45.
    solution: 18/40 × 100 = 45%.
    mistakes: {"18": "t8_percent_of_class", "82": "t8_percent_of_class"}
  - prompt: Team A won 12 of 16 games; team B won 14 of 20. Which won the bigger percentage?
    options:
    - Team A (75% vs 70%)
    - Team B (70% vs 75%)
    - Both the same
    - Can't tell
    answer: Team A (75% vs 70%)
    difficulty: 2
    hints:
    - 12/16 = 3/4.
    - 14/20 = 7/10.
    solution: 12/16 = 75% and 14/20 = 70%, so team A.
    mistakes: {"Team B (70% vs 75%)": "t8_compare_percent", "Both the same": "t8_compare_percent"}
  - prompt: Write 1/8 as a percentage. Type the number only, as a decimal.
    answer: '12.5'
    check: Rational(100, 8)
    difficulty: 3
    hints:
    - 1/8 × 100.
    - 100 ÷ 8.
    solution: 100 ÷ 8 = 12.5, so 1/8 = 12.5%.
    mistakes: {"8": "t8_fraction_to_percent", "0.125": "t8_fraction_to_percent"}
  - prompt: Write 9/25 as a percentage. Type the number only.
    answer: '36'
    check: 9/25*100
    difficulty: 1
    hints:
    - Multiply by 100.
    - 100 ÷ 25 = 4, so 9 × 4.
    solution: 9/25 × 100 = 9 × 4 = 36%.
    mistakes:
      '925': c8_pct_digits
      '0.36': c8m8_times_100
  - prompt: Write 35% as a fraction in simplest form.
    answer: 7/20
    check: Rational(35, 100)
    difficulty: 1
    hints:
    - 35% = 35/100.
    - Divide top and bottom by 5.
    solution: 35/100 = 7/20.
    mistakes:
      35/10: c8m8_over_100
      7/10: c8m8_over_100
  - prompt: Write 0.6 as a percentage. Type the number only.
    answer: '60'
    check: 0.6*100
    difficulty: 1
    hints:
    - Multiply by 100.
    - The decimal point moves two places right.
    solution: 0.6 × 100 = 60%.
    mistakes:
      '6': c8_pct_decimal
      '0.6': c8_pct_decimal
  - prompt: Write 1/3 as a percentage, to one decimal place. Type the number only.
    answer: '33.3'
    check: round(100/3, 1)
    difficulty: 2
    hints:
    - Multiply by 100.
    - 100 ÷ 3.
    solution: 1/3 × 100 = 33.33…, which is 33.3% to one decimal place.
    mistakes:
      '3': c8m8_times_100
      '0.3': c8m8_times_100
  - prompt: In a school of 800 students, 120 walk to school. What percentage walk? Type the number only.
    answer: '15'
    check: 120/800*100
    difficulty: 2
    hints:
    - Part ÷ whole × 100.
    - 120 ÷ 800 × 100.
    solution: 120/800 = 0.15, and 0.15 × 100 = 15%.
    mistakes:
      '0.15': c8m8_times_100
      '680': c8m8_whole
  - prompt: Write 125% as a decimal.
    answer: '1.25'
    check: 125/100
    difficulty: 2
    hints:
    - Divide by 100.
    - More than 100% is more than one whole.
    solution: 125% = 125/100 = 1.25.
    mistakes:
      '12.5': c8_pct_decimal
      '0.125': c8_pct_decimal
  - prompt: Riya scored 42 out of 60, and Arjun 54 out of 75. Who did better?
    options:
    - Arjun (72%)
    - Riya (70%)
    - They did the same
    answer: Arjun (72%)
    difficulty: 2
    hints:
    - Turn each score into a percentage.
    - 42/60 × 100 and 54/75 × 100.
    solution: 'Riya: 42/60 = 70%. Arjun: 54/75 = 72%. Arjun did better.'
    mistakes:
      Riya (70%): t8_compare_percent
      They did the same: t8_compare_percent
  - prompt: Which is the same as 2/5?
    options:
    - 40%
    - 25%
    - 20%
    - 52%
    answer: 40%
    difficulty: 1
    hints:
    - Multiply by 100.
    - 2/5 × 100.
    solution: 2/5 × 100 = 40, so 40%.
    mistakes:
      25%: c8m8_times_100
      20%: c8m8_times_100
      52%: c8_pct_digits
  - prompt: A tank is 3/8 full. What percentage is full? Type a decimal.
    answer: '37.5'
    check: 3/8*100
    difficulty: 3
    hints:
    - 1/8 = 12.5%.
    - Three of those.
    solution: 3/8 × 100 = 300/8 = 37.5%.
    mistakes:
      '38': c8_pct_digits
      '0.375': c8m8_times_100
  - prompt: In a bag, 12 of 30 marbles are blue. What percentage are NOT blue? Type the number only.
    answer: '60'
    check: (30 - 12)/30*100
    difficulty: 2
    hints:
    - How many are not blue?
    - 18 out of 30.
    solution: 'Step 1: 30 − 12 = 18 are not blue. Step 2: 18/30 × 100 = 60%.'
    mistakes:
      '40': c8m8_whole
      '18': c8m8_times_100
- code: cbse8m.pct.of
  title: Percentage of a quantity
  after:
  - cbse8m.pct.convert
  notes: |
    To find p% of a quantity, multiply by p/100: 15% of 200 = 30. To find what percentage a is of b, work out
    a/b × 100. Increase by p%: new = old × (100 + p)/100; decrease by p%: new = old × (100 − p)/100.
    Profit or discount percentages are worked out on the original price.
  explanations:
    text: To find a percentage of something, change the percentage into a fraction and multiply. 10% is one-tenth, so 10% of ₹350 is ₹35; 20% is double that, ₹70. Percentage increases and decreases are always worked out on the starting amount.
    visual: 'Draw a bar for ₹400 split into 10 boxes of ₹40. Each box is 10%. 25% is two and a half boxes: ₹100.'
    step_by_step: 'Step 1: Write p% as p/100. Step 2: Multiply by the quantity. Step 3: For an increase, add the result to the original; for a decrease, subtract it. Step 4: Check the answer is sensible (10% should be a tenth).'
    real_world: 'A ₹1200 jacket has a 25% discount: 25% of 1200 = ₹300 off, so you pay ₹900.'
  picture:
    kind: flow
    steps:
    - 15% of 240
    - 10% of 240 = 24
    - 5% of 240 = 12
    - 15% = 24 + 12 = 36
    alt: Finding 15 per cent of 240 by adding 10 per cent, 24, and 5 per cent, 12, to get 36.
  activity:
    type: formula
    prompt: Prices and percentages. Set the starting price and the percentage.
    inputs:
    - name: a
      label: Starting price
      min: 0
      max: 2000
      step: 50
      start: 100
      unit: ₹
    - name: p
      label: Percentage
      min: 0
      max: 100
      step: 5
      start: 0
      unit: '%'
    outputs:
    - name: part
      label: p% of the price
      expr: a*p/100
      unit: ₹
    - name: up
      label: After a p% rise
      expr: a*(1+p/100)
      unit: ₹
    - name: down
      label: After a p% cut
      expr: a*(1-p/100)
      unit: ₹
    goals:
    - prompt: After a 25% discount a shirt costs ₹600. Find the original price.
      want:
        p: 25
        down: 600
      mistakes:
      - when:
          p: 25
          a: 750
        say: ₹750 is 600 + 25% of 600. The 25% was taken off the original price, not off ₹600.
      - when:
          p: 25
          a: 600
        say: ₹600 is the price after the discount. Find the price that 25% off turns into ₹600.
    - prompt: A price rose 10% to ₹550. Find the old price.
      want:
        p: 10
        up: 550
      mistakes:
      - when:
          p: 10
          a: 550
        say: ₹550 is the new price. Find the price that a 10% rise turns into ₹550.
      - when:
          p: 10
          a: 600
        say: A 10% rise goes up, so the old price must be less than ₹550.
    - prompt: What percent of ₹400 is ₹60?
      want:
        a: 400
        part: 60
      mistakes:
      - when:
          a: 400
          p: 60
        say: 60 is the amount, not the percentage. ₹60 out of ₹400 is how many out of 100?
  lesson:
    - teach: 'To find a percentage of an amount, multiply the amount by the percentage over 100. 20% of 350 = 20/100 × 350 = 70. A quick way: 10% is the amount ÷ 10, so 20% is double that.'
      picture:
        kind: flow
        steps:
        - 20% of 350
        - 10% = 35
        - 20% = 2 × 35
        - = 70
        alt: To find 20 per cent of 350, take 10 per cent as 35 and double it to 70.
      check:
        prompt: What is 30% of 200?
        options:
        - '60'
        - '30'
        - '170'
        answer: '60'
        why: 10% of 200 is 20, so 30% is 3 × 20 = 60.
    - teach: 'An increase or decrease by a percentage: find the change, then add it or take it away. A ₹400 jacket with a 15% discount: 15% of 400 = 60, so it costs 400 − 60 = ₹340. For a 15% increase it would be 400 + 60 = ₹460.'
      picture:
        kind: compare
        columns:
        - title: 15% off ₹400
          points:
          - change = ₹60
          - 400 − 60
          - = ₹340
        - title: 15% more than ₹400
          points:
          - change = ₹60
          - 400 + 60
          - = ₹460
        alt: 15 per cent of 400 is 60; taken off it gives 340, added on it gives 460.
      check:
        prompt: A ₹500 phone cover is 10% off. What is the sale price?
        options:
        - ₹450
        - ₹50
        - ₹490
        answer: ₹450
        why: 10% of 500 is 50, and 500 − 50 = 450.
    - teach: 'Profit, loss and discount percentages are always worked out on the original amount. Bought for ₹200 and sold for ₹250: profit ₹50, and 50 ÷ 200 × 100 = 25% profit. Two changes in a row work on the new amount each time, so +10% then −10% does not get you back to the start.'
      check:
        prompt: A book bought for ₹80 is sold for ₹100. What is the profit percentage?
        options:
        - 25%
        - 20%
        - 80%
        answer: 25%
        why: Profit is ₹20, and 20 ÷ 80 × 100 = 25%. The original price is the cost, ₹80.
  items:
  - prompt: Find 15% of 240.
    answer: '36'
    check: 240*Rational(15, 100)
    difficulty: 1
    hints:
    - 10% is 24, 5% is 12.
    - Or 240 × 15/100.
    solution: 240 × 15/100 = 36.
    mistakes: {"16": "t8_percent_of", "360": "t8_percent_of"}
  - prompt: A ₹800 bag is sold at a 20% discount. What is the sale price, in rupees?
    answer: '640'
    check: 800*Rational(80, 100)
    difficulty: 2
    hints:
    - 20% of 800 = 160.
    - 800 − 160.
    solution: Discount = ₹160, so the price is ₹640.
    mistakes:
      '160': c8_pct_then_subtract
  - prompt: What percentage of 250 is 40? Type the number only.
    answer: '16'
    check: Rational(40, 250)*100
    difficulty: 2
    hints:
    - 40/250 × 100.
    - 40/250 = 0.16.
    solution: 40/250 × 100 = 16%.
    mistakes: {"40": "t8_what_percent", "6.25": "t8_what_percent"}
  - prompt: A town of 20,000 people grows by 5%. What is the new population?
    answer: '21000'
    check: 20000*Rational(105, 100)
    difficulty: 2
    hints:
    - 5% of 20,000 = 1000.
    - Add it on.
    solution: 20,000 + 1000 = 21,000.
    mistakes: {"1000": "t8_increase_add", "20005": "t8_increase_add"}
  - prompt: A price rises by 10% and then falls by 10%. If it started at ₹1000, what is it now, in rupees?
    answer: '990'
    check: 1000*Rational(110, 100)*Rational(90, 100)
    difficulty: 3
    hints:
    - 'After the rise: ₹1100.'
    - 10% of 1100 is 110.
    solution: '1000 → 1100 → 1100 − 110 = ₹990: the fall is worked out on the bigger price.'
    mistakes:
      '1000': c8_pct_base_changes
  - prompt: A shirt bought for ₹500 is sold for ₹600. What is the profit percentage? Type the number only.
    answer: '20'
    check: Rational(100, 500)*100
    difficulty: 2
    hints:
    - Profit = ₹100.
    - 100/500 × 100.
    solution: Profit ₹100 on ₹500 is 100/500 × 100 = 20%.
    mistakes: {"100": "t8_profit_on_cost", "16.67": "t8_profit_on_cost"}
  - prompt: Find 25% of 640.
    answer: '160'
    check: 640/4
    difficulty: 1
    hints:
    - 25% is a quarter.
    - 640 ÷ 4.
    solution: 25% = 1/4, and 640 ÷ 4 = 160.
    mistakes:
      '615': t8_percent_of
      '16': t8_percent_of
  - prompt: Find 12% of 450.
    answer: '54'
    check: 12/100*450
    difficulty: 2
    hints:
    - 10% of 450 is 45.
    - 1% is 4.5, so 2% is 9.
    solution: 'Step 1: 10% = 45. Step 2: 2% = 9. Step 3: 12% = 45 + 9 = 54.'
    mistakes:
      '5400': t8_percent_of
      '438': c8m8_ten_percent
  - prompt: A ₹1500 cycle is sold at a 12% discount. What is the sale price, in rupees?
    answer: '1320'
    check: 1500*(100 - 12)/100
    difficulty: 2
    hints:
    - 12% of 1500 is the discount.
    - Take the discount from 1500.
    solution: 'Step 1: 12% of 1500 = 180. Step 2: 1500 − 180 = ₹1320.'
    mistakes:
      '180': c8_pct_then_subtract
      '1680': c8m8_new_amount
  - prompt: A salary of ₹20,000 rises by 8%. What is the new salary, in rupees?
    answer: '21600'
    check: 20000*108/100
    difficulty: 2
    hints:
    - 8% of 20,000 is the rise.
    - Add it on.
    solution: 'Step 1: 8% of 20,000 = 1600. Step 2: 20,000 + 1600 = ₹21,600.'
    mistakes:
      '1600': c8m8_new_amount
      '18400': c8m8_new_amount
  - prompt: What percentage of 80 is 20? Type the number only.
    answer: '25'
    check: 20/80*100
    difficulty: 1
    hints:
    - Part ÷ whole × 100.
    - 20 ÷ 80 = 1/4.
    solution: 20/80 = 1/4 = 25%.
    mistakes:
      '400': c8m8_whole
      '0.25': c8m8_times_100
  - prompt: A phone bought for ₹8000 is sold for ₹7200. What is the loss percentage? Type the number only.
    answer: '10'
    check: (8000 - 7200)/8000*100
    difficulty: 2
    hints:
    - Loss = 8000 − 7200.
    - Loss ÷ cost × 100.
    solution: 'Step 1: loss = ₹800. Step 2: 800 ÷ 8000 × 100 = 10%.'
    mistakes:
      '11.1': c8m8_original
      '800': c8m8_times_100
  - prompt: A price of ₹2000 goes up by 20% and then down by 20%. What is the final price, in rupees?
    answer: '1920'
    check: 2000*1.2*0.8
    difficulty: 3
    hints:
    - After the rise it is ₹2400.
    - Now take 20% of 2400 away.
    solution: 'Step 1: 2000 + 400 = 2400. Step 2: 20% of 2400 = 480. Step 3: 2400 − 480 = ₹1920.'
    mistakes:
      '2000': c8_pct_base_changes
      '1600': c8_pct_base_changes
  - prompt: In an exam, 65% of 240 students passed. How many failed?
    answer: '84'
    check: 240*35/100
    difficulty: 2
    hints:
    - What percentage failed?
    - 100% − 65% = 35%.
    solution: 'Step 1: 35% failed. Step 2: 35% of 240 = 84 students.'
    mistakes:
      '156': c8m8_new_amount
      '175': c8m8_whole
  - prompt: After a 25% discount a shirt costs ₹600. What was the original price, in rupees?
    answer: '800'
    check: 600/0.75
    difficulty: 3
    hints:
    - ₹600 is 75% of the original.
    - So 1% is 600 ÷ 75.
    solution: 'Step 1: 600 is 75% of the original. Step 2: 1% = ₹8. Step 3: 100% = ₹800.'
    mistakes:
      '750': c8m8_original
      '450': c8m8_original
