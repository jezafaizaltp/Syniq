# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 4. Format: content/README.md.
subject: cbse8-math
chapter: 4
title: Quadrilaterals
tips:
  c8_angle_sum_360: The angles of a quadrilateral add to 360°, not 180°. Subtract from 360.
  c8_adjacent_vs_opposite: Opposite angles of a parallelogram are equal; angles next to each other add to 180°.
  t8_diagonal_triangles: "Draw one diagonal. How many triangles do you get, and what does each triangle's angle sum give?"
  t8_equal_angles: "Four equal angles share 360°. Divide."
  t8_fourth_angle: "Add the three angles you know and take them from 360°."
  t8_half_diagonal: "O is the middle of the diagonal, so AO is only half of AC."
  t8_kite_diagonals: "Fold a kite along its long diagonal. At what angle does the short diagonal cross it?"
  t8_one_pair_parallel: "Parallelograms have TWO pairs of parallel sides. Which shape has only one?"
  t8_parallelogram_diagonals: "Draw a long, slanted parallelogram. Are the diagonals equal? Do they cut each other in half?"
  t8_polygon_triangles: "From one corner, draw diagonals. A pentagon splits into how many triangles? Multiply by 180°."
  t8_quad_angle_sum: "Add the parts: x + 2x + 3x + 4x. The angles of a quadrilateral add to 360°."
  t8_rhombus_sides: "A rhombus has four equal sides. The perimeter is all four added."
  t8_square_both: "A rectangle needs four right angles; a rhombus needs four equal sides. Which shape has both?"
concepts:
- code: cbse8m.quad.angles
  title: Angles in a quadrilateral
  notes: |
    A quadrilateral has 4 sides, 4 vertices and 4 angles. A diagonal splits it into 2 triangles, so its
    angles add up to 2 × 180° = 360°. In a rectangle all angles are 90°. Exterior angles of any convex
    polygon add up to 360°.
  explanations:
    text: Draw a diagonal across any four-sided shape and it becomes two triangles. Each triangle's angles add to 180°, so the four angles of the quadrilateral add to 360°.
    visual: 'Cut out a paper quadrilateral, tear off its four corners and put the points together: they fit exactly around a point, making a full turn of 360°.'
    step_by_step: 'Step 1: Add the angles you know. Step 2: Subtract the total from 360°. Step 3: That is the missing angle. Step 4: Check that all four add to 360°.'
    real_world: 'A carpenter making a four-sided frame checks the corners: if three are 90°, the fourth must also be 90°, so the frame is a rectangle.'
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 8
      - 1
      C:
      - 9
      - 7
      D:
      - 3
      - 8
    segments:
    - - A
      - B
    - - B
      - C
    - - C
      - D
    - - D
      - A
    - - A
      - C
      - diagonal
    caption: 'The diagonal AC splits ABCD into two triangles: 180° + 180° = 360°.'
    alt: A quadrilateral ABCD with diagonal AC splitting it into two triangles.
  activity:
    type: angle
    prompt: Turn the arm to make the missing angle of each quadrilateral.
    goals:
    - prompt: Three angles are 70°, 80° and 90°. Make the fourth.
      degrees: 120
      mistakes:
      - when:
          degrees: 240
        say: 240° is the three angles added up. The fourth is what's left of 360°.
      - when:
          degrees:
          - 10
          - 100
        say: Too small. Add 70 + 80 + 90 = 240, then see how much is left of 360°.
    - prompt: A parallelogram has one angle of 65°. Make the angle next to it.
      degrees: 115
      mistakes:
      - when:
          degrees: 65
        say: 65° is the opposite angle. Angles next to each other in a parallelogram add to 180°.
      - when:
          degrees: 295
        say: '295° makes a full turn with 65°. Neighbouring angles make a straight angle: 180°.'
    - prompt: Three angles of a quadrilateral are each 90°. Make the fourth.
      degrees: 90
      mistakes:
      - when:
          degrees: 270
        say: 270° is the three angles together. 360 − 270 leaves the fourth.
      - when:
          degrees: 180
        say: That's the triangle total. A quadrilateral is two triangles, so its angles make 360°.
  items:
  - prompt: Three angles of a quadrilateral are 80°, 95° and 110°. Find the fourth, in degrees.
    answer: '75'
    check: 360 - 80 - 95 - 110
    difficulty: 1
    hints:
    - The four angles add to 360°.
    - 360 − 285.
    solution: 80 + 95 + 110 = 285, so the fourth is 360 − 285 = 75°.
    mistakes:
      '-105': c8_angle_sum_360
  - prompt: The angles of a quadrilateral are x, 2x, 3x and 4x. Find x, in degrees.
    answer: '36'
    check: 360/10
    difficulty: 2
    hints:
    - x + 2x + 3x + 4x = 360.
    - 10x = 360.
    solution: 10x = 360°, so x = 36°. The angles are 36°, 72°, 108° and 144°.
    mistakes: {"18": "quad_sum_360", "90": "t8_quad_angle_sum"}
  - prompt: Why do the angles of a quadrilateral add to 360°?
    options:
    - A diagonal splits it into two triangles of 180° each
    - It has four right angles
    - Each side is 90°
    - It is half a circle
    answer: A diagonal splits it into two triangles of 180° each
    difficulty: 1
    hints:
    - Draw a diagonal.
    - How many triangles?
    solution: Any quadrilateral splits into 2 triangles, and 2 × 180° = 360°.
    mistakes: {"It has four right angles": "t8_diagonal_triangles", "Each side is 90°": "t8_diagonal_triangles"}
  - prompt: All four angles of a quadrilateral are equal. How big is each, in degrees?
    answer: '90'
    check: 360/4
    difficulty: 1
    hints:
    - 360 ÷ 4.
    - Equal angles share the total.
    solution: '360° ÷ 4 = 90°: such a quadrilateral is a rectangle.'
    mistakes: {"45": "quad_sum_360", "360": "t8_equal_angles"}
  - prompt: A quadrilateral has angles 120°, 60° and 120°. Find the fourth angle, in degrees.
    answer: '60'
    check: 360 - 300
    difficulty: 2
    hints:
    - 360 − (120 + 60 + 120).
    - 360 − 300.
    solution: 360 − 300 = 60°.
    mistakes: {"0": "t8_fourth_angle", "120": "t8_fourth_angle"}
  - prompt: 'What do the angles of a pentagon add up to, in degrees? (Hint: split it into triangles from one corner.)'
    answer: '540'
    check: 3*180
    difficulty: 3
    hints:
    - From one corner, a pentagon splits into 3 triangles.
    - 3 × 180.
    solution: 'Diagonals from one vertex split a pentagon into 3 triangles: 3 × 180° = 540°.'
    mistakes: {"360": "t8_polygon_triangles", "900": "t8_polygon_triangles"}
- code: cbse8m.quad.types
  title: Parallelograms, rhombuses, kites and trapeziums
  after:
  - cbse8m.quad.angles
  notes: |
    Trapezium: at least one pair of parallel sides. Parallelogram: both pairs of opposite sides parallel; then
    opposite sides are equal, opposite angles are equal, adjacent angles add to 180° and the diagonals bisect
    each other. Rhombus: all sides equal (a parallelogram whose diagonals cross at right angles). Rectangle:
    a parallelogram with right angles and equal diagonals. Square: both a rectangle and a rhombus. Kite: two
    pairs of equal adjacent sides; its diagonals are perpendicular.
  explanations:
    text: Quadrilaterals form a family. A parallelogram has opposite sides parallel. Make all its sides equal and you get a rhombus; make its angles right angles and you get a rectangle; do both and you get a square. A kite has two pairs of equal sides next to each other.
    visual: 'Draw a family tree: quadrilateral at the top, then trapezium and kite, then parallelogram under trapezium, then rectangle and rhombus under parallelogram, and square at the bottom joining rectangle and rhombus.'
    step_by_step: 'Step 1: Check for parallel sides. Step 2: Check which sides are equal. Step 3: Check the angles for right angles. Step 4: Choose the most exact name that fits all the facts.'
    real_world: 'A folding gate is made of rhombuses: the sides stay equal while the angles change, so the gate stretches and shrinks.'
  picture:
    kind: geometry
    points:
      P:
      - 1
      - 2
      Q:
      - 6
      - 2
      R:
      - 9
      - 7
      S:
      - 4
      - 7
    segments:
    - - P
      - Q
    - - Q
      - R
    - - R
      - S
    - - S
      - P
    - - P
      - R
    - - Q
      - S
    caption: In parallelogram PQRS opposite sides are parallel and equal, and the diagonals bisect each other.
    alt: A parallelogram PQRS with both diagonals drawn, crossing at their middle points.
  activity:
    type: sort
    prompt: Which quadrilateral is it? Choose the most exact name.
    bins:
    - Parallelogram
    - Rhombus
    - Rectangle
    - Kite
    - Trapezium
    items:
    - label: Exactly one pair of parallel sides
      bin: Trapezium
      clue: How many pairs of sides are parallel?
      why: 'One pair only: a trapezium.'
    - label: A triangle with its tip cut off straight
      bin: Trapezium
      clue: Top and bottom are parallel; the slanted sides are not. How many parallel pairs?
      why: 'One pair: a trapezium.'
    - label: Two pairs of equal sides that are next to each other
      bin: Kite
      clue: Are the equal sides opposite each other, or side by side?
      why: 'Side by side: a kite.'
    - label: Diagonals cross at 90°; only one diagonal is cut in half
      bin: Kite
      clue: A rhombus has both diagonals halved. Here only one is.
      why: A kite.
    - label: All sides equal, but no right angles
      bin: Rhombus
      clue: Equal sides, slanted corners. Which one?
      why: 'A rhombus: a pushed-over square.'
    - label: Diagonals cut each other in half at 90°; corners not 90°
      bin: Rhombus
      clue: Both diagonals halved at right angles, but corners are slanted.
      why: A rhombus.
    - label: All angles 90°, but sides not all equal
      bin: Rectangle
      clue: Right-angled corners, long and short sides.
      why: A rectangle.
    - label: Diagonals are equal and cut each other in half
      bin: Rectangle
      clue: Which family member has equal diagonals that bisect each other?
      why: A rectangle (a square too, but its sides are all equal).
    - label: Opposite sides parallel; slanted corners; sides unequal
      bin: Parallelogram
      clue: Two parallel pairs, no right angles, not all sides equal.
      why: A parallelogram.
    - label: Opposite angles equal, no right angles, sides unequal
      bin: Parallelogram
      clue: Two pairs of parallel sides give these angles.
      why: A parallelogram.
  items:
  - prompt: In a parallelogram one angle is 70°. Find the angle next to it, in degrees.
    answer: '110'
    check: 180 - 70
    difficulty: 1
    hints:
    - Adjacent angles add to 180°.
    - 180 − 70.
    solution: 'Adjacent angles of a parallelogram are supplementary: 180 − 70 = 110°.'
    mistakes:
      '70': c8_adjacent_vs_opposite
  - prompt: Which shape is both a rectangle and a rhombus?
    options:
    - Square
    - Kite
    - Trapezium
    - Parallelogram
    answer: Square
    difficulty: 1
    hints:
    - A rectangle has right angles; a rhombus has equal sides.
    - Both at once?
    solution: A square has four right angles and four equal sides, so it is both.
    mistakes: {"Kite": "t8_square_both", "Parallelogram": "t8_square_both"}
  - prompt: Which statement is true for every parallelogram?
    options:
    - Its diagonals bisect each other
    - Its diagonals are equal
    - All its sides are equal
    - All its angles are 90°
    answer: Its diagonals bisect each other
    difficulty: 2
    hints:
    - Equal diagonals need right angles.
    - Think of a slanted parallelogram.
    solution: In any parallelogram the diagonals cut each other in half; they are equal only in a rectangle.
    mistakes: {"Its diagonals are equal": "t8_parallelogram_diagonals", "All its angles are 90°": "t8_parallelogram_diagonals"}
  - prompt: The diagonals of a parallelogram cross at O. If AO = 6 cm, how long is the whole diagonal AC, in cm?
    answer: '12'
    check: 2*6
    difficulty: 1
    hints:
    - The diagonals bisect each other.
    - AC = 2 × AO.
    solution: O is the middle of AC, so AC = 2 × 6 = 12 cm.
    mistakes: {"6": "t8_half_diagonal", "3": "t8_half_diagonal"}
  - prompt: A quadrilateral has exactly one pair of parallel sides. What is it?
    options:
    - Trapezium
    - Parallelogram
    - Rhombus
    - Rectangle
    answer: Trapezium
    difficulty: 1
    hints:
    - Parallelograms have two pairs.
    - One pair only.
    solution: A quadrilateral with one pair of parallel sides is a trapezium.
    mistakes: {"Parallelogram": "t8_one_pair_parallel", "Rhombus": "t8_one_pair_parallel"}
  - prompt: What is special about the diagonals of a kite?
    options:
    - They cross at right angles
    - They are always equal
    - They are parallel
    - They never meet
    answer: They cross at right angles
    difficulty: 2
    hints:
    - Fold a kite along its long diagonal.
    - The other diagonal meets it square on.
    solution: A kite's diagonals are perpendicular, and the long one bisects the short one.
    mistakes: {"They are always equal": "t8_kite_diagonals", "They are parallel": "t8_kite_diagonals"}
  - prompt: A rhombus has a perimeter of 36 cm. How long is each side, in cm?
    answer: '9'
    check: 36/4
    difficulty: 2
    hints:
    - All four sides are equal.
    - 36 ÷ 4.
    solution: Each side = 36 ÷ 4 = 9 cm.
    mistakes: {"18": "t8_rhombus_sides", "144": "t8_rhombus_sides"}
