# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 4. Format: content/README.md.
subject: cbse8-math
chapter: 4
title: Quadrilaterals
tips:
  c8_angle_sum_360: The angles of a quadrilateral add to 360°, not 180°. Subtract from 360.
  c8_adjacent_vs_opposite: Opposite angles of a parallelogram are equal; angles next to each other add to 180°.
  t8_diagonal_triangles: "Draw one diagonal. How many triangles do you get, and what does each triangle's angle sum give?"
  t8_equal_angles: "Four equal angles share 360°. Divide."
  t8_fourth_angle: "Add the three angles you know and take them from 360°."
  t8_half_diagonal: "O is the middle of the diagonal, so AO is only half of AC."
  t8_kite_diagonals: "Fold a kite along its long diagonal. At what angle does the short diagonal cross it?"
  t8_one_pair_parallel: "Parallelograms have TWO pairs of parallel sides. Which shape has only one?"
  t8_parallelogram_diagonals: "Draw a long, slanted parallelogram. Are the diagonals equal? Do they cut each other in half?"
  t8_polygon_triangles: "From one corner, draw diagonals. A pentagon splits into how many triangles? Multiply by 180°."
  t8_quad_angle_sum: "Add the parts: x + 2x + 3x + 4x. The angles of a quadrilateral add to 360°."
  t8_rhombus_sides: "A rhombus has four equal sides. The perimeter is all four added."
  t8_square_both: "A rectangle needs four right angles; a rhombus needs four equal sides. Which shape has both?"
  c8m4_triangle_sum: That uses 180°, the sum for a triangle. A quadrilateral is two triangles.
  c8m4_ratio_parts: Add the ratio numbers to get the total parts. One part is 360° divided by that.
  c8m4_polygon_sum: From one corner, an n-sided shape splits into n − 2 triangles. Multiply that by 180°.
  c8m4_exterior: 'Walk all the way round any convex shape: you turn through one full turn in total.'
  c8m4_opposite_equal: Opposite angles of a parallelogram are equal. Which angle is opposite this one?
  c8m4_rhombus_half: The diagonals of a rhombus cut each other in half at right angles. Each half makes a right triangle with a side.
  c8m4_rectangle_diagonals: A rectangle's diagonals are equal in length and cut each other in half.
  c8m4_family: 'Check the definition: does the shape need right angles, equal sides, or both?'
  c8m4_kite_def: A kite has two pairs of equal sides that sit next to each other, not opposite.
concepts:
- code: cbse8m.quad.angles
  title: Angles in a quadrilateral
  notes: |
    A quadrilateral has 4 sides, 4 vertices and 4 angles. A diagonal splits it into 2 triangles, so its
    angles add up to 2 × 180° = 360°. In a rectangle all angles are 90°. Exterior angles of any convex
    polygon add up to 360°.
  explanations:
    text: Draw a diagonal across any four-sided shape and it becomes two triangles. Each triangle's angles add to 180°, so the four angles of the quadrilateral add to 360°.
    visual: 'Cut out a paper quadrilateral, tear off its four corners and put the points together: they fit exactly around a point, making a full turn of 360°.'
    step_by_step: 'Step 1: Add the angles you know. Step 2: Subtract the total from 360°. Step 3: That is the missing angle. Step 4: Check that all four add to 360°.'
    real_world: 'A carpenter making a four-sided frame checks the corners: if three are 90°, the fourth must also be 90°, so the frame is a rectangle.'
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 8
      - 1
      C:
      - 9
      - 7
      D:
      - 3
      - 8
    segments:
    - - A
      - B
    - - B
      - C
    - - C
      - D
    - - D
      - A
    - - A
      - C
      - diagonal
    caption: 'The diagonal AC splits ABCD into two triangles: 180° + 180° = 360°.'
    alt: A quadrilateral ABCD with diagonal AC splitting it into two triangles.
  activity:
    type: angle
    prompt: Turn the arm to make the missing angle of each quadrilateral.
    goals:
    - prompt: Three angles are 70°, 80° and 90°. Make the fourth.
      degrees: 120
      mistakes:
      - when:
          degrees: 240
        say: 240° is the three angles added up. The fourth is what's left of 360°.
      - when:
          degrees:
          - 10
          - 100
        say: Too small. Add 70 + 80 + 90 = 240, then see how much is left of 360°.
    - prompt: A parallelogram has one angle of 65°. Make the angle next to it.
      degrees: 115
      mistakes:
      - when:
          degrees: 65
        say: 65° is the opposite angle. Angles next to each other in a parallelogram add to 180°.
      - when:
          degrees: 295
        say: '295° makes a full turn with 65°. Neighbouring angles make a straight angle: 180°.'
    - prompt: Three angles of a quadrilateral are each 90°. Make the fourth.
      degrees: 90
      mistakes:
      - when:
          degrees: 270
        say: 270° is the three angles together. 360 − 270 leaves the fourth.
      - when:
          degrees: 180
        say: That's the triangle total. A quadrilateral is two triangles, so its angles make 360°.
  lesson:
    - teach: A quadrilateral has 4 sides, 4 corners and 4 angles. Draw one diagonal and it splits into 2 triangles. Each triangle's angles add to 180°, so the 4 angles of any quadrilateral add to 2 × 180° = 360°.
      picture:
        kind: flow
        steps:
        - Quadrilateral ABCD
        - Draw diagonal AC
        - 'Two triangles: 180° + 180°'
        - Angle sum = 360°
        alt: One diagonal splits a quadrilateral into two triangles, so its angles add to 360 degrees.
      check:
        prompt: What do the 4 angles of any quadrilateral add up to?
        options:
        - 360°
        - 180°
        - 400°
        answer: 360°
        why: A diagonal makes two triangles of 180° each, and 2 × 180° = 360°.
    - teach: To find a missing angle, add the angles you know and take the total from 360°. If the angles are given as x, 2x, …, add them up, set the sum equal to 360° and solve for x.
      check:
        prompt: Three angles of a quadrilateral are 90°, 90° and 100°. What is the fourth?
        options:
        - 80°
        - 0°
        - 100°
        answer: 80°
        why: 90 + 90 + 100 = 280, and 360 − 280 = 80.
    - teach: 'The same idea works for any polygon. From one corner, a shape with n sides splits into n − 2 triangles, so its angles add to (n − 2) × 180°. A pentagon: 3 × 180° = 540°. Walking round any convex shape you turn once, so its exterior angles always add to 360°.'
      picture:
        kind: compare
        columns:
        - title: Sides
          points:
          - '4'
          - '5'
          - '6'
        - title: Triangles
          points:
          - '2'
          - '3'
          - '4'
        - title: Angle sum
          points:
          - 360°
          - 540°
          - 720°
        alt: Four sides give two triangles and 360 degrees, five give three and 540, six give four and 720.
      check:
        prompt: What do the angles of a hexagon (6 sides) add up to?
        options:
        - 720°
        - 540°
        - 1080°
        answer: 720°
        why: 6 − 2 = 4 triangles, and 4 × 180° = 720°.
  items:
  - prompt: Three angles of a quadrilateral are 80°, 95° and 110°. Find the fourth, in degrees.
    answer: '75'
    check: 360 - 80 - 95 - 110
    difficulty: 1
    hints:
    - The four angles add to 360°.
    - 360 − 285.
    solution: 80 + 95 + 110 = 285, so the fourth is 360 − 285 = 75°.
    mistakes:
      '-105': c8_angle_sum_360
  - prompt: The angles of a quadrilateral are x, 2x, 3x and 4x. Find x, in degrees.
    answer: '36'
    check: 360/10
    difficulty: 2
    hints:
    - x + 2x + 3x + 4x = 360.
    - 10x = 360.
    solution: 10x = 360°, so x = 36°. The angles are 36°, 72°, 108° and 144°.
    mistakes: {"18": "quad_sum_360", "90": "t8_quad_angle_sum"}
  - prompt: Why do the angles of a quadrilateral add to 360°?
    options:
    - A diagonal splits it into two triangles of 180° each
    - It has four right angles
    - Each side is 90°
    - It is half a circle
    answer: A diagonal splits it into two triangles of 180° each
    difficulty: 1
    hints:
    - Draw a diagonal.
    - How many triangles?
    solution: Any quadrilateral splits into 2 triangles, and 2 × 180° = 360°.
    mistakes: {"It has four right angles": "t8_diagonal_triangles", "Each side is 90°": "t8_diagonal_triangles"}
  - prompt: All four angles of a quadrilateral are equal. How big is each, in degrees?
    answer: '90'
    check: 360/4
    difficulty: 1
    hints:
    - 360 ÷ 4.
    - Equal angles share the total.
    solution: '360° ÷ 4 = 90°: such a quadrilateral is a rectangle.'
    mistakes: {"45": "quad_sum_360", "360": "t8_equal_angles"}
  - prompt: A quadrilateral has angles 120°, 60° and 120°. Find the fourth angle, in degrees.
    answer: '60'
    check: 360 - 300
    difficulty: 2
    hints:
    - 360 − (120 + 60 + 120).
    - 360 − 300.
    solution: 360 − 300 = 60°.
    mistakes: {"0": "t8_fourth_angle", "120": "t8_fourth_angle"}
  - prompt: 'What do the angles of a pentagon add up to, in degrees? (Hint: split it into triangles from one corner.)'
    answer: '540'
    check: 3*180
    difficulty: 3
    hints:
    - From one corner, a pentagon splits into 3 triangles.
    - 3 × 180.
    solution: 'Diagonals from one vertex split a pentagon into 3 triangles: 3 × 180° = 540°.'
    mistakes: {"360": "t8_polygon_triangles", "900": "t8_polygon_triangles"}
  - prompt: Three angles of a quadrilateral are 100°, 85° and 70°. Find the fourth, in degrees.
    answer: '105'
    check: 360 - (100 + 85 + 70)
    difficulty: 1
    hints:
    - Add the three angles.
    - Take the total from 360°.
    solution: 'Step 1: 100 + 85 + 70 = 255. Step 2: 360 − 255 = 105°.'
    mistakes:
      '75': c8m4_triangle_sum
  - prompt: Two angles of a quadrilateral are right angles and the third is 65°. Find the fourth, in degrees.
    answer: '115'
    check: 360 - 90 - 90 - 65
    difficulty: 1
    hints:
    - A right angle is 90°.
    - 360 − (90 + 90 + 65).
    solution: 'Step 1: 90 + 90 + 65 = 245. Step 2: 360 − 245 = 115°.'
    mistakes:
      '25': t8_fourth_angle
  - prompt: 'The angles of a quadrilateral are in the ratio 1 : 2 : 3 : 3. Find the smallest angle, in degrees.'
    answer: '40'
    check: 360/(1 + 2 + 3 + 3)
    difficulty: 2
    hints:
    - How many parts are there altogether?
    - 360° ÷ 9 parts.
    solution: 'Step 1: 1 + 2 + 3 + 3 = 9 parts. Step 2: one part = 360° ÷ 9 = 40°. The smallest angle is 1 part = 40°.'
    mistakes:
      '20': c8m4_ratio_parts
      '120': c8m4_ratio_parts
  - prompt: The angles of a quadrilateral are x, x + 10, x + 20 and x + 30 degrees. Find x.
    answer: '75'
    check: (360 - 60)/4
    difficulty: 3
    hints:
    - 'Add them: 4x + 60.'
    - 4x + 60 = 360.
    solution: 'Step 1: x + (x + 10) + (x + 20) + (x + 30) = 4x + 60. Step 2: 4x + 60 = 360, so 4x = 300. Step 3: x = 75.'
    mistakes:
      '90': t8_quad_angle_sum
      '30': c8m4_triangle_sum
  - prompt: What do the angles of an octagon (8 sides) add up to, in degrees?
    answer: '1080'
    check: (8 - 2)*180
    difficulty: 2
    hints:
    - How many triangles from one corner?
    - (8 − 2) × 180°.
    solution: 'Step 1: an octagon splits into 8 − 2 = 6 triangles. Step 2: 6 × 180° = 1080°.'
    mistakes:
      '1440': c8m4_polygon_sum
      '360': c8m4_polygon_sum
  - prompt: A regular hexagon has 6 equal angles. How big is each, in degrees?
    answer: '120'
    check: (6 - 2)*180/6
    difficulty: 2
    hints:
    - First find the angle sum of a hexagon.
    - Then share it among 6 equal angles.
    solution: 'Step 1: angle sum = 4 × 180° = 720°. Step 2: 720° ÷ 6 = 120°.'
    mistakes:
      '60': c8m4_polygon_sum
      '720': c8m4_polygon_sum
  - prompt: What do the exterior angles of a pentagon add up to, in degrees?
    answer: '360'
    check: '360'
    difficulty: 2
    hints:
    - Imagine walking round the pentagon.
    - At each corner you turn by the exterior angle.
    solution: Walking once round any convex shape you turn through one full turn, so the exterior angles always add to 360°.
    mistakes:
      '540': c8m4_exterior
      '180': c8m4_exterior
  - prompt: A quadrilateral has one angle of 90° and the other three angles are equal. How big is each of those, in degrees?
    answer: '90'
    check: (360 - 90)/3
    difficulty: 2
    hints:
    - The three equal angles share what is left of 360°.
    - 360 − 90 = 270.
    solution: 'Step 1: 360 − 90 = 270. Step 2: 270 ÷ 3 = 90°. So it is a rectangle.'
    mistakes:
      '30': c8m4_triangle_sum
      '270': t8_equal_angles
  - prompt: Can a quadrilateral have angles 100°, 100°, 100° and 100°?
    options:
    - No, they add to 400°, not 360°
    - Yes, it is a square
    - Yes, any four equal angles work
    answer: No, they add to 400°, not 360°
    difficulty: 1
    hints:
    - Add the four angles.
    - What must they add up to?
    solution: 4 × 100° = 400°, but the angles of a quadrilateral always add to 360°. So no such shape exists.
    mistakes:
      Yes, it is a square: c8_angle_sum_360
      Yes, any four equal angles work: c8_angle_sum_360
  - prompt: How many triangles does a diagonal from one corner make in a 10-sided polygon?
    answer: '8'
    check: 10 - 2
    difficulty: 2
    hints:
    - Try a square (2) and a pentagon (3) first.
    - The pattern is sides − 2.
    solution: 'A square gives 2, a pentagon 3, so n sides give n − 2. For 10 sides: 10 − 2 = 8 triangles.'
    mistakes:
      '10': c8m4_polygon_sum
      '7': c8m4_polygon_sum
- code: cbse8m.quad.types
  title: Parallelograms, rhombuses, kites and trapeziums
  after:
  - cbse8m.quad.angles
  notes: |
    Trapezium: at least one pair of parallel sides. Parallelogram: both pairs of opposite sides parallel; then
    opposite sides are equal, opposite angles are equal, adjacent angles add to 180° and the diagonals bisect
    each other. Rhombus: all sides equal (a parallelogram whose diagonals cross at right angles). Rectangle:
    a parallelogram with right angles and equal diagonals. Square: both a rectangle and a rhombus. Kite: two
    pairs of equal adjacent sides; its diagonals are perpendicular.
  explanations:
    text: Quadrilaterals form a family. A parallelogram has opposite sides parallel. Make all its sides equal and you get a rhombus; make its angles right angles and you get a rectangle; do both and you get a square. A kite has two pairs of equal sides next to each other.
    visual: 'Draw a family tree: quadrilateral at the top, then trapezium and kite, then parallelogram under trapezium, then rectangle and rhombus under parallelogram, and square at the bottom joining rectangle and rhombus.'
    step_by_step: 'Step 1: Check for parallel sides. Step 2: Check which sides are equal. Step 3: Check the angles for right angles. Step 4: Choose the most exact name that fits all the facts.'
    real_world: 'A folding gate is made of rhombuses: the sides stay equal while the angles change, so the gate stretches and shrinks.'
  picture:
    kind: geometry
    points:
      P:
      - 1
      - 2
      Q:
      - 6
      - 2
      R:
      - 9
      - 7
      S:
      - 4
      - 7
    segments:
    - - P
      - Q
    - - Q
      - R
    - - R
      - S
    - - S
      - P
    - - P
      - R
    - - Q
      - S
    caption: In parallelogram PQRS opposite sides are parallel and equal, and the diagonals bisect each other.
    alt: A parallelogram PQRS with both diagonals drawn, crossing at their middle points.
  activity:
    type: sort
    prompt: Which quadrilateral is it? Choose the most exact name.
    bins:
    - Parallelogram
    - Rhombus
    - Rectangle
    - Kite
    - Trapezium
    items:
    - label: Exactly one pair of parallel sides
      bin: Trapezium
      clue: How many pairs of sides are parallel?
      why: 'One pair only: a trapezium.'
    - label: A triangle with its tip cut off straight
      bin: Trapezium
      clue: Top and bottom are parallel; the slanted sides are not. How many parallel pairs?
      why: 'One pair: a trapezium.'
    - label: Two pairs of equal sides that are next to each other
      bin: Kite
      clue: Are the equal sides opposite each other, or side by side?
      why: 'Side by side: a kite.'
    - label: Diagonals cross at 90°; only one diagonal is cut in half
      bin: Kite
      clue: A rhombus has both diagonals halved. Here only one is.
      why: A kite.
    - label: All sides equal, but no right angles
      bin: Rhombus
      clue: Equal sides, slanted corners. Which one?
      why: 'A rhombus: a pushed-over square.'
    - label: Diagonals cut each other in half at 90°; corners not 90°
      bin: Rhombus
      clue: Both diagonals halved at right angles, but corners are slanted.
      why: A rhombus.
    - label: All angles 90°, but sides not all equal
      bin: Rectangle
      clue: Right-angled corners, long and short sides.
      why: A rectangle.
    - label: Diagonals are equal and cut each other in half
      bin: Rectangle
      clue: Which family member has equal diagonals that bisect each other?
      why: A rectangle (a square too, but its sides are all equal).
    - label: Opposite sides parallel; slanted corners; sides unequal
      bin: Parallelogram
      clue: Two parallel pairs, no right angles, not all sides equal.
      why: A parallelogram.
    - label: Opposite angles equal, no right angles, sides unequal
      bin: Parallelogram
      clue: Two pairs of parallel sides give these angles.
      why: A parallelogram.
  lesson:
    - teach: A trapezium has at least one pair of parallel sides. A parallelogram has both pairs of opposite sides parallel. In a parallelogram, opposite sides are equal, opposite angles are equal, angles next to each other add to 180°, and the diagonals cut each other in half.
      picture:
        kind: compare
        columns:
        - title: Trapezium
          points:
          - One pair of parallel sides
          - Angles add to 360°
        - title: Parallelogram
          points:
          - Two pairs of parallel sides
          - Opposite sides and angles equal
          - Diagonals bisect each other
        alt: A trapezium has one pair of parallel sides; a parallelogram has two, with equal opposite sides and angles.
      check:
        prompt: In a parallelogram, one angle is 65°. What is the angle opposite it?
        options:
        - 65°
        - 115°
        - 25°
        answer: 65°
        why: Opposite angles of a parallelogram are equal.
    - teach: 'Special parallelograms: a rectangle has four right angles and equal diagonals. A rhombus has four equal sides and its diagonals cross at right angles. A square is both a rectangle and a rhombus.'
      picture:
        kind: flow
        steps:
        - Parallelogram
        - add right angles → rectangle
        - add equal sides → rhombus
        - both → square
        alt: A parallelogram with right angles is a rectangle, with equal sides a rhombus, and with both a square.
      check:
        prompt: Which shape must have diagonals that cross at right angles?
        options:
        - Rhombus
        - Rectangle
        - Any parallelogram
        answer: Rhombus
        why: In a rhombus all sides are equal, which makes the diagonals cross at 90°. A rectangle's diagonals are equal but usually not at right angles.
    - teach: A kite has two pairs of equal sides that sit next to each other. Its diagonals cross at right angles, and the long one cuts the short one in half. Unlike a parallelogram, its opposite sides are not usually equal.
      check:
        prompt: Which describes a kite?
        options:
        - Two pairs of equal sides next to each other
        - Two pairs of parallel sides
        - All four sides equal
        answer: Two pairs of equal sides next to each other
        why: That is the definition of a kite. Two pairs of parallel sides make a parallelogram.
  items:
  - prompt: In a parallelogram one angle is 70°. Find the angle next to it, in degrees.
    answer: '110'
    check: 180 - 70
    difficulty: 1
    hints:
    - Adjacent angles add to 180°.
    - 180 − 70.
    solution: 'Adjacent angles of a parallelogram are supplementary: 180 − 70 = 110°.'
    mistakes:
      '70': c8_adjacent_vs_opposite
  - prompt: Which shape is both a rectangle and a rhombus?
    options:
    - Square
    - Kite
    - Trapezium
    - Parallelogram
    answer: Square
    difficulty: 1
    hints:
    - A rectangle has right angles; a rhombus has equal sides.
    - Both at once?
    solution: A square has four right angles and four equal sides, so it is both.
    mistakes: {"Kite": "t8_square_both", "Parallelogram": "t8_square_both"}
  - prompt: Which statement is true for every parallelogram?
    options:
    - Its diagonals bisect each other
    - Its diagonals are equal
    - All its sides are equal
    - All its angles are 90°
    answer: Its diagonals bisect each other
    difficulty: 2
    hints:
    - Equal diagonals need right angles.
    - Think of a slanted parallelogram.
    solution: In any parallelogram the diagonals cut each other in half; they are equal only in a rectangle.
    mistakes: {"Its diagonals are equal": "t8_parallelogram_diagonals", "All its angles are 90°": "t8_parallelogram_diagonals"}
  - prompt: The diagonals of a parallelogram cross at O. If AO = 6 cm, how long is the whole diagonal AC, in cm?
    answer: '12'
    check: 2*6
    difficulty: 1
    hints:
    - The diagonals bisect each other.
    - AC = 2 × AO.
    solution: O is the middle of AC, so AC = 2 × 6 = 12 cm.
    mistakes: {"6": "t8_half_diagonal", "3": "t8_half_diagonal"}
  - prompt: A quadrilateral has exactly one pair of parallel sides. What is it?
    options:
    - Trapezium
    - Parallelogram
    - Rhombus
    - Rectangle
    answer: Trapezium
    difficulty: 1
    hints:
    - Parallelograms have two pairs.
    - One pair only.
    solution: A quadrilateral with one pair of parallel sides is a trapezium.
    mistakes: {"Parallelogram": "t8_one_pair_parallel", "Rhombus": "t8_one_pair_parallel"}
  - prompt: What is special about the diagonals of a kite?
    options:
    - They cross at right angles
    - They are always equal
    - They are parallel
    - They never meet
    answer: They cross at right angles
    difficulty: 2
    hints:
    - Fold a kite along its long diagonal.
    - The other diagonal meets it square on.
    solution: A kite's diagonals are perpendicular, and the long one bisects the short one.
    mistakes: {"They are always equal": "t8_kite_diagonals", "They are parallel": "t8_kite_diagonals"}
  - prompt: A rhombus has a perimeter of 36 cm. How long is each side, in cm?
    answer: '9'
    check: 36/4
    difficulty: 2
    hints:
    - All four sides are equal.
    - 36 ÷ 4.
    solution: Each side = 36 ÷ 4 = 9 cm.
    mistakes: {"18": "t8_rhombus_sides", "144": "t8_rhombus_sides"}
  - prompt: In parallelogram ABCD, angle A = 75°. Find angle C, in degrees.
    answer: '75'
    check: '75'
    difficulty: 1
    hints:
    - A and C are opposite corners.
    - Opposite angles of a parallelogram are …
    solution: 'A and C are opposite angles of a parallelogram, so they are equal: angle C = 75°.'
    mistakes:
      '105': c8m4_opposite_equal
  - prompt: In parallelogram PQRS, angle P = 3x and angle Q = 2x. Find x, in degrees.
    answer: '36'
    check: 180/5
    difficulty: 2
    hints:
    - P and Q are next to each other.
    - Angles next to each other add to 180°.
    solution: 'Step 1: 3x + 2x = 180°. Step 2: 5x = 180°, so x = 36°.'
    mistakes:
      '72': c8m4_ratio_parts
      '18': c8_adjacent_vs_opposite
  - prompt: The diagonals of a rectangle cross at O. If OA = 5 cm, how long is diagonal BD, in cm?
    answer: '10'
    check: 2*5
    difficulty: 2
    hints:
    - OA is half of diagonal AC.
    - In a rectangle the diagonals are equal.
    solution: 'Step 1: AC = 2 × 5 = 10 cm. Step 2: a rectangle''s diagonals are equal, so BD = 10 cm.'
    mistakes:
      '5': c8m4_rectangle_diagonals
  - prompt: The diagonals of a rhombus are 6 cm and 8 cm. How long is each side, in cm?
    answer: '5'
    check: sqrt(3**2 + 4**2)
    difficulty: 3
    hints:
    - The diagonals cut each other in half at right angles.
    - Half-diagonals are 3 cm and 4 cm.
    solution: 'Step 1: the halves are 3 cm and 4 cm. Step 2: they meet at a right angle, so side² = 3² + 4² = 25. Step 3: side = 5 cm.'
    mistakes:
      '7': c8m4_rhombus_half
      '14': c8m4_rhombus_half
