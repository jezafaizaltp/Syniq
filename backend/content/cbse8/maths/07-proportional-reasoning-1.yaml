# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 7. Format: content/README.md.
subject: cbse8-math
chapter: 7
title: Proportional Reasoning-1
tips:
  c8_ratio_not_difference: 'Ratios multiply, they don''t add on: if one quantity is 3 times bigger, so is the other.'
  c8_parts_total: 'Find one part first: divide the total by the sum of the ratio numbers.'
  t8_compare_per_cup: "Find sugar per cup for each mix (spoons ÷ cups), then pick the bigger one."
  t8_equivalent_ratio: "Multiply both parts by the same number. Adding the same number doesn't keep a ratio."
  t8_hours_to_minutes: "1 hour = 60 minutes. Change the hours, then add the extra minutes."
  t8_km_to_m: "1 km = 1000 m. Multiply."
  t8_same_units: "Change both quantities to the same unit first (cm), then simplify. Keep the order."
  t8_share_ratio: "Simplify the investments to a ratio, find one part of the profit, then multiply by Sita's parts."
  t8_simplify_ratio: "Divide both parts by their highest common factor. Keep the order of the ratio."
  t8_unit_multiply: "Multiply the inches by 2.54. Watch where the decimal point goes."
  c8m7_scale_factor: How many times bigger did the first quantity get? The other one grows by the same factor.
  c8m7_per_one: Find the amount for one first (divide), then multiply up.
  c8m7_order: 'Keep the order the question asks for: the first quantity named goes first.'
  c8m7_whole_vs_part: The question asks for a share, not one part. Multiply one part by the number of parts in that share.
  c8m7_rate_compare: Work out how much for one unit in each case, then compare.
  c8m7_unit_to_small: Going to a smaller unit gives a bigger number. Multiply by the conversion factor.
  c8m7_unit_to_big: Going to a bigger unit gives a smaller number. Divide by the conversion factor.
concepts:
- code: cbse8m.prop1.ratio
  title: Ratios in simplest form
  notes: |
    A ratio a : b compares two quantities of the same kind. Equivalent ratios come from multiplying or dividing
    both terms by the same number; simplest form has no common factor (24 : 36 = 2 : 3). Quantities must be
    in the same unit before comparing (50 cm : 2 m = 50 : 200 = 1 : 4). Two quantities change proportionally
    when their ratio stays the same.
  explanations:
    text: 'A ratio says how many of one thing there are for each of another. 2 : 3 means 2 parts to 3 parts. Like fractions, you can simplify by dividing both numbers by the same thing, but first make sure both are in the same units.'
    visual: 'Draw 6 red and 9 blue counters, then group them in threes: 2 groups of red, 3 groups of blue. The ratio 6 : 9 is the same as 2 : 3.'
    step_by_step: 'Step 1: Write both quantities in the same unit. Step 2: Write them as a : b. Step 3: Find the HCF of a and b. Step 4: Divide both by it.'
    real_world: 'A recipe uses 2 cups of rice for every 3 cups of water. For 6 cups of rice you need 9 cups of water: the ratio stays 2 : 3.'
  picture:
    kind: bars
    bars:
    - label: Red
      value: 6
    - label: Blue
      value: 9
    unit: counters
    caption: '6 : 9 simplifies to 2 : 3 by dividing both by 3.'
    alt: Two bars showing 6 red and 9 blue counters, a ratio of 6 to 9 that simplifies to 2 to 3.
  activity:
    type: formula
    prompt: 'Write each ratio a : b in its simplest form.'
    inputs:
    - name: a
      label: a
      min: 1
      max: 60
      step: 1
      start: 1
    - name: b
      label: b
      min: 1
      max: 60
      step: 1
      start: 1
    outputs:
    - name: q
      label: a ÷ b
      expr: a/b
      places: 3
    goals:
    - prompt: 'Simplify 12 : 18.'
      want:
        a: 2
        b: 3
      mistakes:
      - when:
          a: 12
          b: 18
        say: Same ratio, but not simplest. Both divide by 6.
      - when:
          a: 4
          b: 6
        say: Both are still even. Divide again.
      - when:
          a: 3
          b: 2
        say: Flipped. 12 comes first, so the smaller number goes first.
    - prompt: A 50 cm ribbon and a 2 m ribbon. Simplest ratio?
      want:
        a: 1
        b: 4
      mistakes:
      - when:
          a: 25
          b: 1
        say: '50 : 2 mixes cm and m. 2 m is 200 cm, so it''s 50 : 200.'
      - when:
          a: 4
          b: 1
        say: 'That''s 200 : 50, flipped. The 50 cm ribbon comes first.'
    - prompt: 18 girls and 24 boys. Ratio of girls to all students?
      want:
        a: 3
        b: 7
      mistakes:
      - when:
          a: 3
          b: 4
        say: '3 : 4 is girls to boys. All students are 18 + 24 = 42.'
      - when:
          a: 18
          b: 42
        say: 'Right comparison. Now simplify: both divide by 6.'
  lesson:
    - teach: 'A ratio a : b compares two amounts of the same kind by division, not by subtraction. 6 boys and 9 girls is 6 : 9. Divide both terms by the same number to simplify: 6 : 9 = 2 : 3. Multiplying both by the same number gives an equivalent ratio: 2 : 3 = 4 : 6 = 10 : 15.'
      picture:
        kind: compare
        columns:
        - title: Ratio
          points:
          - '6 : 9'
          - ÷ 3 both
          - '2 : 3'
        - title: Equivalent
          points:
          - '2 : 3'
          - × 5 both
          - '10 : 15'
        alt: 6 to 9 divided by 3 gives 2 to 3; 2 to 3 multiplied by 5 gives 10 to 15.
      check:
        prompt: 'Which is 18 : 24 in simplest form?'
        options:
        - '3 : 4'
        - '9 : 12'
        - '6 : 8'
        answer: '3 : 4'
        why: 'The highest common factor is 6: 18 ÷ 6 = 3 and 24 ÷ 6 = 4.'
    - teach: 'Before comparing, put both amounts in the same unit. 30 minutes : 2 hours is 30 : 120 = 1 : 4, not 30 : 2. Then simplify.'
      check:
        prompt: 'Write 50 paise : ₹2 in simplest form.'
        options:
        - '1 : 4'
        - '25 : 1'
        - '50 : 2'
        answer: '1 : 4'
        why: '₹2 = 200 paise, so 50 : 200 = 1 : 4.'
    - teach: 'Two quantities are proportional when their ratio stays the same. If 3 pens cost ₹24, then 6 pens cost ₹48: double one, double the other. Find the factor (or the amount for one) and use it on the other quantity.'
      picture:
        kind: flow
        steps:
        - 3 pens → ₹24
        - 1 pen → ₹8
        - 5 pens → ₹40
        alt: 3 pens cost 24 rupees, so 1 pen costs 8 and 5 pens cost 40.
      check:
        prompt: 4 notebooks cost ₹100. What do 6 cost, in the same proportion?
        options:
        - ₹150
        - ₹102
        - ₹120
        answer: ₹150
        why: One notebook costs ₹25, so 6 cost 6 × 25 = ₹150.
  items:
  - prompt: 'Write 24 : 36 in simplest form.'
    options:
    - '2 : 3'
    - '4 : 6'
    - '3 : 2'
    - '12 : 18'
    answer: '2 : 3'
    difficulty: 1
    hints:
    - The HCF of 24 and 36 is 12.
    - 24 ÷ 12 and 36 ÷ 12.
    solution: 'Divide both by 12: 2 : 3.'
    mistakes: {"3 : 2": "t8_simplify_ratio", "4 : 6": "t8_simplify_ratio"}
  - prompt: 'Write 40 cm : 2 m in simplest form.'
    options:
    - '1 : 5'
    - '20 : 1'
    - '40 : 2'
    - '1 : 20'
    answer: '1 : 5'
    difficulty: 2
    hints:
    - Change 2 m to cm first.
    - '40 : 200.'
    solution: '2 m = 200 cm, so 40 : 200 = 1 : 5.'
    mistakes: {"20 : 1": "t8_same_units", "40 : 2": "t8_same_units"}
  - prompt: 'The ratio of boys to girls is 3 : 4 and there are 12 boys. How many girls are there?'
    answer: '16'
    check: 12/3*4
    difficulty: 1
    hints:
    - 12 boys is 3 parts, so one part is 4.
    - Girls = 4 parts.
    solution: One part = 12 ÷ 3 = 4, so girls = 4 × 4 = 16.
    mistakes:
      '13': c8_ratio_not_difference
  - prompt: 'Which ratio is equivalent to 5 : 8?'
    options:
    - '15 : 24'
    - '10 : 13'
    - '8 : 5'
    - '5 : 16'
    answer: '15 : 24'
    difficulty: 1
    hints:
    - Multiply both terms by the same number.
    - × 3.
    solution: '5 × 3 : 8 × 3 = 15 : 24.'
    mistakes: {"10 : 13": "t8_equivalent_ratio", "8 : 5": "t8_equivalent_ratio"}
  - prompt: A photo 10 cm wide and 15 cm tall is enlarged to 30 cm wide in proportion. How tall is it now, in cm?
    answer: '45'
    check: 15*3
    difficulty: 2
    hints:
    - Width grew 3 times.
    - Height also grows 3 times.
    solution: 30 ÷ 10 = 3, so height = 15 × 3 = 45 cm.
    mistakes:
      '35': c8_ratio_not_difference
  - prompt: Mix A has 2 spoons of sugar in 5 cups of milk; mix B has 3 spoons in 8 cups. Write the sugar per cup of the sweeter mix as a fraction.
    answer: 2/5
    check: Rational(2, 5)
    difficulty: 3
    hints:
    - Compare 2/5 and 3/8.
    - 2/5 = 16/40 and 3/8 = 15/40.
    solution: 2/5 = 0.4 and 3/8 = 0.375, so mix A is sweeter, with 2/5 spoon per cup.
    mistakes: {"3/8": "t8_compare_per_cup", "5/2": "t8_compare_per_cup"}
  - prompt: 'Which is 45 : 60 in simplest form?'
    options:
    - '3 : 4'
    - '9 : 12'
    - '4 : 3'
    - '15 : 20'
    answer: '3 : 4'
    difficulty: 1
    hints:
    - Find the highest common factor of 45 and 60.
    - It is 15.
    solution: '45 ÷ 15 = 3 and 60 ÷ 15 = 4, so 3 : 4.'
    mistakes:
      '9 : 12': t8_simplify_ratio
      '4 : 3': c8m7_order
      '15 : 20': t8_simplify_ratio
  - prompt: 'Write 45 minutes : 1 hour in simplest form.'
    options:
    - '3 : 4'
    - '45 : 1'
    - '4 : 3'
    - '45 : 100'
    answer: '3 : 4'
    difficulty: 2
    hints:
    - Change 1 hour into minutes first.
    - '45 : 60.'
    solution: 'Step 1: 1 hour = 60 minutes. Step 2: 45 : 60 = 3 : 4.'
    mistakes:
      '45 : 1': t8_same_units
      '4 : 3': c8m7_order
      '45 : 100': t8_same_units
  - prompt: 'The ratio of red to blue beads is 5 : 2. There are 35 red beads. How many blue beads are there?'
    answer: '14'
    check: 35/5*2
    difficulty: 1
    hints:
    - 35 is 7 times 5.
    - So blue is 7 times 2.
    solution: 'Step 1: 35 ÷ 5 = 7. Step 2: 7 × 2 = 14 blue beads.'
    mistakes:
      '32': c8_ratio_not_difference
      '87.5': c8m7_order
  - prompt: 5 kg of rice costs ₹300. How much do 8 kg cost, in rupees?
    answer: '480'
    check: 300/5*8
    difficulty: 1
    hints:
    - Find the cost of 1 kg first.
    - ₹300 ÷ 5 = ₹60.
    solution: 'Step 1: 1 kg costs 300 ÷ 5 = ₹60. Step 2: 8 kg cost 8 × 60 = ₹480.'
    mistakes:
      '303': c8_ratio_not_difference
      '187.5': c8m7_per_one
  - prompt: 'Which ratio is NOT equivalent to 2 : 5?'
    options:
    - '4 : 7'
    - '4 : 10'
    - '6 : 15'
    - '10 : 25'
    answer: '4 : 7'
    difficulty: 2
    hints:
    - Equivalent ratios come from multiplying both terms by the same number.
    - 'Is 4 : 7 the same as 2 : 5 multiplied by something?'
    solution: '4 : 10, 6 : 15 and 10 : 25 are 2 : 5 times 2, 3 and 5. 4 : 7 adds 2 to both terms, which does not keep the ratio.'
    mistakes:
      '4 : 10': t8_equivalent_ratio
      '6 : 15': t8_equivalent_ratio
      '10 : 25': t8_equivalent_ratio
  - prompt: A recipe uses 3 cups of flour for 12 cookies. How many cups are needed for 20 cookies?
    answer: '5'
    check: 3*20/12
    difficulty: 2
    hints:
    - How much flour for 4 cookies?
    - 12 cookies = 3 cups, so 4 cookies = 1 cup.
    solution: 'Step 1: 1 cup makes 12 ÷ 3 = 4 cookies. Step 2: 20 ÷ 4 = 5 cups.'
    mistakes:
      '11': c8_ratio_not_difference
      '80': c8m7_per_one
  - prompt: 'A model car is made in the ratio 1 : 40. The real car is 4 m long. How long is the model, in cm?'
    answer: '10'
    check: 400/40
    difficulty: 3
    hints:
    - Change 4 m into cm.
    - 400 cm ÷ 40.
    solution: 'Step 1: 4 m = 400 cm. Step 2: 400 ÷ 40 = 10 cm.'
    mistakes:
      '160': c8m7_order
      '0.1': t8_same_units
  - prompt: Shop A sells 4 pens for ₹50. Shop B sells 6 pens for ₹72. Which is cheaper per pen?
    options:
    - Shop B
    - Shop A
    - They cost the same
    answer: Shop B
    difficulty: 2
    hints:
    - Work out the price of one pen at each shop.
    - 50 ÷ 4 and 72 ÷ 6.
    solution: 'Shop A: 50 ÷ 4 = ₹12.50 a pen. Shop B: 72 ÷ 6 = ₹12 a pen. Shop B is cheaper.'
    mistakes:
      Shop A: c8m7_rate_compare
      They cost the same: c8m7_rate_compare
  - prompt: 'The ratio of a rectangle''s length to breadth is 5 : 3. Its breadth is 12 cm. What is its length, in cm?'
    answer: '20'
    check: 12/3*5
    difficulty: 2
    hints:
    - 12 is how many times 3?
    - Multiply 5 by the same number.
    solution: 'Step 1: 12 ÷ 3 = 4. Step 2: 5 × 4 = 20 cm.'
    mistakes:
      '14': c8_ratio_not_difference
      '7.2': c8m7_order
  - prompt: 'If 2 : 7 = x : 42, find x.'
    answer: '12'
    check: 2*42/7
    difficulty: 2
    hints:
    - What was 7 multiplied by to get 42?
    - Multiply 2 by the same number.
    solution: 'Step 1: 42 ÷ 7 = 6. Step 2: x = 2 × 6 = 12.'
    mistakes:
      '37': c8_ratio_not_difference
      '147': c8m7_order
- code: cbse8m.prop1.share
  title: Sharing in a ratio and unit conversions
  after:
  - cbse8m.prop1.ratio
  notes: |
    To share a total in the ratio a : b, add the parts (a + b), find one part (total ÷ (a + b)), then multiply:
    ₹600 in 2 : 3 gives ₹240 and ₹360. Unit conversion is proportional reasoning with a fixed ratio: 1 km =
    1000 m, 1 hour = 60 minutes, 1 inch ≈ 2.54 cm. Multiply by the conversion factor to change units.
  explanations:
    text: 'To share in a ratio, think in parts. In 2 : 3 there are 5 parts in all. Find what one part is worth, then give 2 parts to one person and 3 to the other. Changing units works the same way: every km is 1000 m.'
    visual: Draw a bar split into 5 equal boxes. Colour 2 for Asha and 3 for Ravi. If the bar is ₹600, each box is ₹120.
    step_by_step: 'Step 1: Add the ratio parts. Step 2: Divide the total by that sum to find one part. Step 3: Multiply one part by each share. Step 4: Check that the shares add to the total.'
    real_world: 'Two friends start a stall, putting in ₹400 and ₹600. They share a profit of ₹1500 in the ratio 2 : 3: ₹600 and ₹900.'
  picture:
    kind: flow
    steps:
    - 'Share ₹600 in the ratio 2 : 3'
    - 'Total parts: 2 + 3 = 5'
    - 'One part: 600 ÷ 5 = ₹120'
    - 'Shares: 2 × 120 = ₹240 and 3 × 120 = ₹360'
    - 'Check: 240 + 360 = 600 ✓'
    alt: 'Sharing ₹600 in the ratio 2 to 3: five parts of ₹120 give ₹240 and ₹360.'
  activity:
    type: formula
    prompt: 'Share money in the ratio 2 : 3. Set what one part is worth.'
    inputs:
    - name: u
      label: One part (₹)
      min: 0
      max: 300
      step: 5
      start: 0
    outputs:
    - name: first
      label: First person (2 parts)
      expr: 2*u
      unit: ₹
    - name: second
      label: Second person (3 parts)
      expr: 3*u
      unit: ₹
    - name: total
      label: Total
      expr: 5*u
      unit: ₹
    goals:
    - prompt: Share ₹600.
      want:
        total: 600
      mistakes:
      - when:
          u: 200
        say: '₹600 ÷ 3 = ₹200, but 2 : 3 has 2 + 3 = 5 parts. The total comes to ₹1000.'
      - when:
          u: 300
        say: '₹600 ÷ 2: count all the parts, 2 + 3 = 5.'
    - prompt: The second person gets ₹450. Find the share.
      want:
        second: 450
      mistakes:
      - when:
          u: 225
        say: 450 ÷ 2? The second person has 3 parts, so divide by 3.
      - when:
          u: 90
        say: 450 ÷ 5 shares out the second person's money over everyone. Their ₹450 is just 3 parts.
    - prompt: The second person gets ₹100 more than the first.
      want:
        u: 100
      mistakes:
      - when:
          u: 20
        say: 100 ÷ 5? The difference is 3 parts − 2 parts = 1 part. So one part is ₹100.
      - when:
          u: 50
        say: 100 ÷ 2? The difference between 3 parts and 2 parts is 1 part.
  lesson:
    - teach: 'To share an amount in the ratio a : b, add the parts to get the total number of parts, find the size of one part, then multiply. ₹500 in the ratio 3 : 2: there are 5 parts, one part is ₹100, so the shares are ₹300 and ₹200.'
      picture:
        kind: flow
        steps:
        - '₹500 in 3 : 2'
        - 3 + 2 = 5 parts
        - 1 part = ₹100
        - ₹300 and ₹200
        alt: 'Sharing 500 rupees in the ratio 3 to 2: 5 parts of 100 rupees give 300 and 200.'
      check:
        prompt: 'Share 40 sweets in the ratio 1 : 3. How many are in the bigger share?'
        options:
        - '30'
        - '10'
        - '13'
        answer: '30'
        why: 1 + 3 = 4 parts, one part is 10, and the bigger share is 3 parts = 30.
    - teach: 'Check your shares: they must add back to the total, and their ratio must match. If you get ₹300 and ₹200 from ₹500 in 3 : 2, then 300 + 200 = 500 and 300 : 200 = 3 : 2.'
      check:
        prompt: 'Someone shared ₹90 in 2 : 1 and got ₹60 and ₹45. What went wrong?'
        options:
        - The shares don't add up to ₹90
        - Nothing, it is right
        - 'The ratio should be 1 : 2'
        answer: The shares don't add up to ₹90
        why: 60 + 45 = 105, not 90. The right shares are ₹60 and ₹30.
    - teach: Changing units is proportional reasoning with a fixed ratio. 1 km = 1000 m, 1 kg = 1000 g, 1 hour = 60 minutes, 1 inch ≈ 2.54 cm. To go to a smaller unit, multiply; to go to a bigger unit, divide.
      picture:
        kind: compare
        columns:
        - title: Bigger unit → smaller
          points:
          - 2.5 km → 2500 m
          - 3 h → 180 min
          - × the factor
        - title: Smaller unit → bigger
          points:
          - 4500 g → 4.5 kg
          - 150 min → 2.5 h
          - ÷ the factor
        alt: To change to a smaller unit multiply by the factor; to a bigger unit divide.
      check:
        prompt: How many grams are in 2.4 kg?
        options:
        - '2400'
        - '240'
        - '0.0024'
        answer: '2400'
        why: 1 kg = 1000 g, so 2.4 × 1000 = 2400 g.
  items:
  - prompt: 'Share ₹600 in the ratio 2 : 3. What is the larger share, in rupees?'
    answer: '360'
    check: 600/5*3
    difficulty: 1
    hints:
    - 5 parts in all.
    - One part is ₹120.
    solution: 600 ÷ 5 = 120, larger share = 3 × 120 = ₹360.
    mistakes:
      '400': c8_parts_total
  - prompt: 'Share 84 marbles in the ratio 3 : 4. How many in the smaller share?'
    answer: '36'
    check: 84/7*3
    difficulty: 1
    hints:
    - 7 parts in all.
    - One part is 12.
    solution: 84 ÷ 7 = 12, smaller share = 3 × 12 = 36.
    mistakes:
      '28': c8_parts_total
  - prompt: How many metres are in 3.5 km?
    answer: '3500'
    check: Rational(35, 10)*1000
    difficulty: 1
    hints:
    - 1 km = 1000 m.
    - 3.5 × 1000.
    solution: 3.5 × 1000 = 3500 m.
    mistakes: {"350": "t8_km_to_m", "35000": "t8_km_to_m"}
  - prompt: Change 2 hours 15 minutes into minutes.
    answer: '135'
    check: 2*60 + 15
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - 120 + 15.
    solution: 2 × 60 + 15 = 135 minutes.
    mistakes: {"215": "t8_hours_to_minutes", "75": "t8_hours_to_minutes"}
  - prompt: Ravi and Sita invest ₹4000 and ₹6000 and share a profit of ₹2500 in the same ratio. How much does Sita get, in rupees?
    answer: '1500'
    check: 2500/5*3
    difficulty: 2
    hints:
    - 'Ratio 4000 : 6000 = 2 : 3.'
    - One part = 2500 ÷ 5.
    solution: 'Ratio 2 : 3, one part = ₹500, Sita gets 3 × 500 = ₹1500.'
    mistakes: {"1000": "t8_share_ratio", "1250": "t8_share_ratio"}
  - prompt: 1 inch is about 2.54 cm. About how many cm is 10 inches?
    answer: '25.4'
    check: 10*Rational(254, 100)
    difficulty: 2
    hints:
    - Multiply by 2.54.
    - 10 × 2.54.
    solution: 10 × 2.54 = 25.4 cm.
    mistakes: {"254": "t8_unit_multiply", "2.54": "t8_unit_multiply"}
  - prompt: 'Share ₹1200 in the ratio 5 : 3. What is the smaller share, in rupees?'
    answer: '450'
    check: 1200/(5 + 3)*3
    difficulty: 1
    hints:
    - 5 + 3 = 8 parts.
    - One part is 1200 ÷ 8.
    solution: 'Step 1: 8 parts. Step 2: one part = ₹150. Step 3: 3 parts = ₹450.'
    mistakes:
      '150': c8m7_whole_vs_part
      '750': c8_parts_total
  - prompt: 'Share 90 marbles in the ratio 4 : 5. How many are in the larger share?'
    answer: '50'
    check: 90/9*5
    difficulty: 1
    hints:
    - 4 + 5 = 9 parts.
    - One part is 10.
    solution: 'Step 1: 9 parts. Step 2: one part = 10. Step 3: 5 parts = 50.'
    mistakes:
      '10': c8m7_whole_vs_part
      '18': c8_parts_total
  - prompt: 'Share ₹1800 in the ratio 1 : 2 : 3. What is the largest share, in rupees?'
    answer: '900'
    check: 1800/6*3
    difficulty: 2
    hints:
    - 1 + 2 + 3 = 6 parts.
    - One part is ₹300.
    solution: 'Step 1: 6 parts. Step 2: one part = ₹300. Step 3: 3 parts = ₹900.'
    mistakes:
      '600': c8_parts_total
      '300': c8m7_whole_vs_part
  - prompt: How many minutes are in 3.5 hours?
    answer: '210'
    check: 3.5*60
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - 3.5 × 60.
    solution: 3.5 × 60 = 210 minutes.
    mistakes:
      '350': t8_hours_to_minutes
      '35': c8m7_unit_to_small
  - prompt: Change 4250 g into kilograms.
    answer: '4.25'
    check: 4250/1000
    difficulty: 1
    hints:
    - 1 kg = 1000 g.
    - Going to a bigger unit, divide.
    solution: 4250 ÷ 1000 = 4.25 kg.
    mistakes:
      '4250000': c8m7_unit_to_big
      '42.5': c8m7_unit_to_big
  - prompt: Two friends put ₹300 and ₹500 into a small stall and share a profit of ₹2400 in the same ratio. How much does the first friend get, in rupees?
    answer: '900'
    check: 2400*300/800
    difficulty: 2
    hints:
    - '300 : 500 = 3 : 5.'
    - 8 parts; one part is ₹300.
    solution: 'Step 1: 300 : 500 = 3 : 5. Step 2: 2400 ÷ 8 = 300 per part. Step 3: 3 × 300 = ₹900.'
    mistakes:
      '1200': c8_parts_total
      '1500': c8m7_order
  - prompt: A road is 12 km long. How many metres is that?
    answer: '12000'
    check: 12*1000
    difficulty: 1
    hints:
    - 1 km = 1000 m.
    - Multiply.
    solution: 12 × 1000 = 12,000 m.
