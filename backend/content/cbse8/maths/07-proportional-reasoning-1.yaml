# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 7. Format: content/README.md.
subject: cbse8-math
chapter: 7
title: Proportional Reasoning-1
tips:
  c8_ratio_not_difference: 'Ratios multiply, they don''t add on: if one quantity is 3 times bigger, so is the other.'
  c8_parts_total: 'Find one part first: divide the total by the sum of the ratio numbers.'
  t8_compare_per_cup: "Find sugar per cup for each mix (spoons ÷ cups), then pick the bigger one."
  t8_equivalent_ratio: "Multiply both parts by the same number. Adding the same number doesn't keep a ratio."
  t8_hours_to_minutes: "1 hour = 60 minutes. Change the hours, then add the extra minutes."
  t8_km_to_m: "1 km = 1000 m. Multiply."
  t8_same_units: "Change both quantities to the same unit first (cm), then simplify. Keep the order."
  t8_share_ratio: "Simplify the investments to a ratio, find one part of the profit, then multiply by Sita's parts."
  t8_simplify_ratio: "Divide both parts by their highest common factor. Keep the order of the ratio."
  t8_unit_multiply: "Multiply the inches by 2.54. Watch where the decimal point goes."
concepts:
- code: cbse8m.prop1.ratio
  title: Ratios in simplest form
  notes: |
    A ratio a : b compares two quantities of the same kind. Equivalent ratios come from multiplying or dividing
    both terms by the same number; simplest form has no common factor (24 : 36 = 2 : 3). Quantities must be
    in the same unit before comparing (50 cm : 2 m = 50 : 200 = 1 : 4). Two quantities change proportionally
    when their ratio stays the same.
  explanations:
    text: 'A ratio says how many of one thing there are for each of another. 2 : 3 means 2 parts to 3 parts. Like fractions, you can simplify by dividing both numbers by the same thing, but first make sure both are in the same units.'
    visual: 'Draw 6 red and 9 blue counters, then group them in threes: 2 groups of red, 3 groups of blue. The ratio 6 : 9 is the same as 2 : 3.'
    step_by_step: 'Step 1: Write both quantities in the same unit. Step 2: Write them as a : b. Step 3: Find the HCF of a and b. Step 4: Divide both by it.'
    real_world: 'A recipe uses 2 cups of rice for every 3 cups of water. For 6 cups of rice you need 9 cups of water: the ratio stays 2 : 3.'
  picture:
    kind: bars
    bars:
    - label: Red
      value: 6
    - label: Blue
      value: 9
    unit: counters
    caption: '6 : 9 simplifies to 2 : 3 by dividing both by 3.'
    alt: Two bars showing 6 red and 9 blue counters, a ratio of 6 to 9 that simplifies to 2 to 3.
  activity:
    type: formula
    prompt: 'Write each ratio a : b in its simplest form.'
    inputs:
    - name: a
      label: a
      min: 1
      max: 60
      step: 1
      start: 1
    - name: b
      label: b
      min: 1
      max: 60
      step: 1
      start: 1
    outputs:
    - name: q
      label: a ÷ b
      expr: a/b
      places: 3
    goals:
    - prompt: 'Simplify 12 : 18.'
      want:
        a: 2
        b: 3
      mistakes:
      - when:
          a: 12
          b: 18
        say: Same ratio, but not simplest. Both divide by 6.
      - when:
          a: 4
          b: 6
        say: Both are still even. Divide again.
      - when:
          a: 3
          b: 2
        say: Flipped. 12 comes first, so the smaller number goes first.
    - prompt: A 50 cm ribbon and a 2 m ribbon. Simplest ratio?
      want:
        a: 1
        b: 4
      mistakes:
      - when:
          a: 25
          b: 1
        say: '50 : 2 mixes cm and m. 2 m is 200 cm, so it''s 50 : 200.'
      - when:
          a: 4
          b: 1
        say: 'That''s 200 : 50, flipped. The 50 cm ribbon comes first.'
    - prompt: 18 girls and 24 boys. Ratio of girls to all students?
      want:
        a: 3
        b: 7
      mistakes:
      - when:
          a: 3
          b: 4
        say: '3 : 4 is girls to boys. All students are 18 + 24 = 42.'
      - when:
          a: 18
          b: 42
        say: 'Right comparison. Now simplify: both divide by 6.'
  items:
  - prompt: 'Write 24 : 36 in simplest form.'
    options:
    - '2 : 3'
    - '4 : 6'
    - '3 : 2'
    - '12 : 18'
    answer: '2 : 3'
    difficulty: 1
    hints:
    - The HCF of 24 and 36 is 12.
    - 24 ÷ 12 and 36 ÷ 12.
    solution: 'Divide both by 12: 2 : 3.'
    mistakes: {"3 : 2": "t8_simplify_ratio", "4 : 6": "t8_simplify_ratio"}
  - prompt: 'Write 40 cm : 2 m in simplest form.'
    options:
    - '1 : 5'
    - '20 : 1'
    - '40 : 2'
    - '1 : 20'
    answer: '1 : 5'
    difficulty: 2
    hints:
    - Change 2 m to cm first.
    - '40 : 200.'
    solution: '2 m = 200 cm, so 40 : 200 = 1 : 5.'
    mistakes: {"20 : 1": "t8_same_units", "40 : 2": "t8_same_units"}
  - prompt: 'The ratio of boys to girls is 3 : 4 and there are 12 boys. How many girls are there?'
    answer: '16'
    check: 12/3*4
    difficulty: 1
    hints:
    - 12 boys is 3 parts, so one part is 4.
    - Girls = 4 parts.
    solution: One part = 12 ÷ 3 = 4, so girls = 4 × 4 = 16.
    mistakes:
      '13': c8_ratio_not_difference
  - prompt: 'Which ratio is equivalent to 5 : 8?'
    options:
    - '15 : 24'
    - '10 : 13'
    - '8 : 5'
    - '5 : 16'
    answer: '15 : 24'
    difficulty: 1
    hints:
    - Multiply both terms by the same number.
    - × 3.
    solution: '5 × 3 : 8 × 3 = 15 : 24.'
    mistakes: {"10 : 13": "t8_equivalent_ratio", "8 : 5": "t8_equivalent_ratio"}
  - prompt: A photo 10 cm wide and 15 cm tall is enlarged to 30 cm wide in proportion. How tall is it now, in cm?
    answer: '45'
    check: 15*3
    difficulty: 2
    hints:
    - Width grew 3 times.
    - Height also grows 3 times.
    solution: 30 ÷ 10 = 3, so height = 15 × 3 = 45 cm.
    mistakes:
      '35': c8_ratio_not_difference
  - prompt: Mix A has 2 spoons of sugar in 5 cups of milk; mix B has 3 spoons in 8 cups. Write the sugar per cup of the sweeter mix as a fraction.
    answer: 2/5
    check: Rational(2, 5)
    difficulty: 3
    hints:
    - Compare 2/5 and 3/8.
    - 2/5 = 16/40 and 3/8 = 15/40.
    solution: 2/5 = 0.4 and 3/8 = 0.375, so mix A is sweeter, with 2/5 spoon per cup.
    mistakes: {"3/8": "t8_compare_per_cup", "5/2": "t8_compare_per_cup"}
- code: cbse8m.prop1.share
  title: Sharing in a ratio and unit conversions
  after:
  - cbse8m.prop1.ratio
  notes: |
    To share a total in the ratio a : b, add the parts (a + b), find one part (total ÷ (a + b)), then multiply:
    ₹600 in 2 : 3 gives ₹240 and ₹360. Unit conversion is proportional reasoning with a fixed ratio: 1 km =
    1000 m, 1 hour = 60 minutes, 1 inch ≈ 2.54 cm. Multiply by the conversion factor to change units.
  explanations:
    text: 'To share in a ratio, think in parts. In 2 : 3 there are 5 parts in all. Find what one part is worth, then give 2 parts to one person and 3 to the other. Changing units works the same way: every km is 1000 m.'
    visual: Draw a bar split into 5 equal boxes. Colour 2 for Asha and 3 for Ravi. If the bar is ₹600, each box is ₹120.
    step_by_step: 'Step 1: Add the ratio parts. Step 2: Divide the total by that sum to find one part. Step 3: Multiply one part by each share. Step 4: Check that the shares add to the total.'
    real_world: 'Two friends start a stall, putting in ₹400 and ₹600. They share a profit of ₹1500 in the ratio 2 : 3: ₹600 and ₹900.'
  picture:
    kind: flow
    steps:
    - 'Share ₹600 in the ratio 2 : 3'
    - 'Total parts: 2 + 3 = 5'
    - 'One part: 600 ÷ 5 = ₹120'
    - 'Shares: 2 × 120 = ₹240 and 3 × 120 = ₹360'
    - 'Check: 240 + 360 = 600 ✓'
    alt: 'Sharing ₹600 in the ratio 2 to 3: five parts of ₹120 give ₹240 and ₹360.'
  activity:
    type: formula
    prompt: 'Share money in the ratio 2 : 3. Set what one part is worth.'
    inputs:
    - name: u
      label: One part (₹)
      min: 0
      max: 300
      step: 5
      start: 0
    outputs:
    - name: first
      label: First person (2 parts)
      expr: 2*u
      unit: ₹
    - name: second
      label: Second person (3 parts)
      expr: 3*u
      unit: ₹
    - name: total
      label: Total
      expr: 5*u
      unit: ₹
    goals:
    - prompt: Share ₹600.
      want:
        total: 600
      mistakes:
      - when:
          u: 200
        say: '₹600 ÷ 3 = ₹200, but 2 : 3 has 2 + 3 = 5 parts. The total comes to ₹1000.'
      - when:
          u: 300
        say: '₹600 ÷ 2: count all the parts, 2 + 3 = 5.'
    - prompt: The second person gets ₹450. Find the share.
      want:
        second: 450
      mistakes:
      - when:
          u: 225
        say: 450 ÷ 2? The second person has 3 parts, so divide by 3.
      - when:
          u: 90
        say: 450 ÷ 5 shares out the second person's money over everyone. Their ₹450 is just 3 parts.
    - prompt: The second person gets ₹100 more than the first.
      want:
        u: 100
      mistakes:
      - when:
          u: 20
        say: 100 ÷ 5? The difference is 3 parts − 2 parts = 1 part. So one part is ₹100.
      - when:
          u: 50
        say: 100 ÷ 2? The difference between 3 parts and 2 parts is 1 part.
  items:
  - prompt: 'Share ₹600 in the ratio 2 : 3. What is the larger share, in rupees?'
    answer: '360'
    check: 600/5*3
    difficulty: 1
    hints:
    - 5 parts in all.
    - One part is ₹120.
    solution: 600 ÷ 5 = 120, larger share = 3 × 120 = ₹360.
    mistakes:
      '400': c8_parts_total
  - prompt: 'Share 84 marbles in the ratio 3 : 4. How many in the smaller share?'
    answer: '36'
    check: 84/7*3
    difficulty: 1
    hints:
    - 7 parts in all.
    - One part is 12.
    solution: 84 ÷ 7 = 12, smaller share = 3 × 12 = 36.
    mistakes:
      '28': c8_parts_total
  - prompt: How many metres are in 3.5 km?
    answer: '3500'
    check: Rational(35, 10)*1000
    difficulty: 1
    hints:
    - 1 km = 1000 m.
    - 3.5 × 1000.
    solution: 3.5 × 1000 = 3500 m.
    mistakes: {"350": "t8_km_to_m", "35000": "t8_km_to_m"}
  - prompt: Change 2 hours 15 minutes into minutes.
    answer: '135'
    check: 2*60 + 15
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - 120 + 15.
    solution: 2 × 60 + 15 = 135 minutes.
    mistakes: {"215": "t8_hours_to_minutes", "75": "t8_hours_to_minutes"}
  - prompt: Ravi and Sita invest ₹4000 and ₹6000 and share a profit of ₹2500 in the same ratio. How much does Sita get, in rupees?
    answer: '1500'
    check: 2500/5*3
    difficulty: 2
    hints:
    - 'Ratio 4000 : 6000 = 2 : 3.'
    - One part = 2500 ÷ 5.
    solution: 'Ratio 2 : 3, one part = ₹500, Sita gets 3 × 500 = ₹1500.'
    mistakes: {"1000": "t8_share_ratio", "1250": "t8_share_ratio"}
  - prompt: 1 inch is about 2.54 cm. About how many cm is 10 inches?
    answer: '25.4'
    check: 10*Rational(254, 100)
    difficulty: 2
    hints:
    - Multiply by 2.54.
    - 10 × 2.54.
    solution: 10 × 2.54 = 25.4 cm.
    mistakes: {"254": "t8_unit_multiply", "2.54": "t8_unit_multiply"}
