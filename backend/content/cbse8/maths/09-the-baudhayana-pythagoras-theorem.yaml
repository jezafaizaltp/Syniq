# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 9 (Part 2 chapter 2). Format: content/README.md.
subject: cbse8-math
chapter: 9
title: The Baudhayana-Pythagoras Theorem
tips:
  c8_pyth_add_sides: 'Square the sides first: the rule is a² + b² = c², not a + b = c.'
concepts:
- code: cbse8m.pyth.theorem
  title: The Baudhayana–Pythagoras theorem
  notes: |
    In a right-angled triangle, the square on the hypotenuse (the side opposite the right angle) equals the
    sum of the squares on the other two sides: c² = a² + b². Baudhayana stated it in the Sulba Sutras
    (around 800 BCE) for the diagonal of a rectangle. The square on the diagonal of a square has double the
    area, so the diagonal of a unit square is √2. Squares on two sides can be combined into one square.
  explanations:
    text: In a right-angled triangle, draw a square on each side. The two smaller squares together have exactly the same area as the big square on the longest side. So if the short sides are 3 and 4, the longest side c has c² = 9 + 16 = 25, and c = 5.
    visual: 'Draw a right triangle with sides 3, 4 and 5 on squared paper and draw a square on each side: 9 small squares, 16 small squares and 25 small squares. 9 + 16 = 25.'
    step_by_step: 'Step 1: Find the right angle; the side opposite it is the hypotenuse c. Step 2: For c, add the squares of the other two sides and take the square root. Step 3: For a shorter side, subtract: a² = c² − b². Step 4: Check the hypotenuse is the longest side.'
    real_world: A 13 m ladder leans against a wall with its foot 5 m from the wall. It reaches √(169 − 25) = √144 = 12 m up the wall.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 9
      - 2
      C:
      - 1
      - 8
    segments:
    - - A
      - B
      - '4'
    - - A
      - C
      - '3'
    - - B
      - C
      - '5'
    angles:
    - at: A
      from: B
      to: C
      label: 90°
    caption: '3² + 4² = 9 + 16 = 25 = 5²: the hypotenuse is 5.'
    alt: A right-angled triangle with the right angle at A, legs 3 and 4 and hypotenuse 5.
  items:
  - prompt: A right triangle has legs 6 cm and 8 cm. Find the hypotenuse, in cm.
    answer: '10'
    check: sqrt(6**2 + 8**2)
    difficulty: 1
    hints:
    - c² = 6² + 8².
    - 36 + 64 = 100.
    solution: c² = 100, so c = 10 cm.
    mistakes:
      '14': c8_pyth_add_sides
  - prompt: A right triangle has hypotenuse 13 and one leg 5. Find the other leg.
    answer: '12'
    check: sqrt(13**2 - 5**2)
    difficulty: 2
    hints:
    - a² = 13² − 5².
    - 169 − 25 = 144.
    solution: a² = 144, so a = 12.
    mistakes:
      '8': c8_pyth_add_sides
  - prompt: A ladder 10 m long reaches 8 m up a wall. How far is its foot from the wall, in m?
    answer: '6'
    check: sqrt(100 - 64)
    difficulty: 2
    hints:
    - The ladder is the hypotenuse.
    - 100 − 64 = 36.
    solution: Foot distance = √(10² − 8²) = √36 = 6 m.
  - prompt: Do sides 7, 24 and 25 make a right triangle?
    options:
    - Yes, because 7² + 24² = 25²
    - No, because 7 + 24 ≠ 25
    - Yes, because 25 is the biggest
    - No, because 7 is odd
    answer: Yes, because 7² + 24² = 25²
    difficulty: 2
    hints:
    - Check a² + b² = c².
    - 49 + 576 = 625.
    solution: 49 + 576 = 625 = 25², so it is a right triangle.
  - prompt: A square has sides of 1 m. Its diagonal is √d m. What is d?
    answer: '2'
    check: 1**2 + 1**2
    difficulty: 2
    hints:
    - Diagonal² = 1² + 1².
    - = 2.
    solution: Diagonal² = 1 + 1 = 2, so the diagonal is √2 m.
  - prompt: A rectangle is 9 cm by 12 cm. How long is its diagonal, in cm?
    answer: '15'
    check: sqrt(81 + 144)
    difficulty: 2
    hints:
    - The diagonal is the hypotenuse.
    - 81 + 144 = 225.
    solution: √(81 + 144) = √225 = 15 cm.
- code: cbse8m.pyth.triples
  title: Integer right triangles and doubling a square
  after:
  - cbse8m.pyth.theorem
  notes: |
    Whole numbers a, b, c with a² + b² = c² form a Baudhayana (Pythagorean) triple: (3, 4, 5), (5, 12, 13),
    (8, 15, 17), (7, 24, 25). Multiplying a triple by any whole number gives another: (6, 8, 10). For any
    m > n, (m² − n², 2mn, m² + n²) is a triple. The square drawn on the diagonal of a square has twice its
    area, which is how Baudhayana doubled a square.
  explanations:
    text: Some right triangles have all three sides as whole numbers, like 3, 4, 5. These are triples. Double, triple or scale up a triple and you get another one. And drawing a square on the diagonal of a square doubles the area.
    visual: 'Draw a square of side 2 (area 4). Draw its diagonal and a new square on it: the new square holds 8 small squares, twice the first.'
    step_by_step: 'Step 1: To test a triple, square the two smaller numbers and add. Step 2: Compare with the square of the largest. Step 3: To make new triples, multiply a known triple by 2, 3, 4 ... Step 4: Or choose m > n and work out m² − n², 2mn and m² + n².'
    real_world: 'Builders mark a right angle with a rope knotted into 12 equal parts: pulled into a 3, 4, 5 triangle, it makes a perfect corner.'
  picture:
    kind: compare
    columns:
    - title: Basic triples
      points:
      - 3, 4, 5
      - 5, 12, 13
      - 8, 15, 17
      - 7, 24, 25
    - title: Scaled up
      points:
      - 6, 8, 10 (× 2)
      - 9, 12, 15 (× 3)
      - 10, 24, 26 (× 2)
      - 16, 30, 34 (× 2)
    caption: Multiply every side of a triple by the same number to get another triple.
    alt: 'Two columns: basic triples 3-4-5, 5-12-13, 8-15-17, 7-24-25 and scaled-up triples 6-8-10, 9-12-15, 10-24-26, 16-30-34.'
  items:
  - prompt: Which set is a Baudhayana–Pythagoras triple?
    options:
    - 8, 15, 17
    - 6, 9, 12
    - 4, 5, 6
    - 2, 3, 4
    answer: 8, 15, 17
    difficulty: 1
    hints:
    - Test a² + b² = c².
    - 64 + 225 = 289.
    solution: 64 + 225 = 289 = 17².
  - prompt: Complete the triple (9, 40, c). Find c.
    answer: '41'
    check: sqrt(81 + 1600)
    difficulty: 2
    hints:
    - c² = 81 + 1600.
    - = 1681.
    solution: c² = 1681, so c = 41.
  - prompt: Using m = 3, n = 2 in (m² − n², 2mn, m² + n²), what is the largest number?
    answer: '13'
    check: 3**2 + 2**2
    difficulty: 2
    hints:
    - m² + n² = 9 + 4.
    - '13.'
    solution: The triple is (5, 12, 13); the largest is 13.
  - prompt: A square has area 18 cm². What is the area of the square drawn on its diagonal, in cm²?
    answer: '36'
    check: 2*18
    difficulty: 2
    hints:
    - The square on the diagonal has double the area.
    - 2 × 18.
    solution: 'Doubling: 2 × 18 = 36 cm².'
  - prompt: Multiply the triple (5, 12, 13) by 3. What is the new hypotenuse?
    answer: '39'
    check: 13*3
    difficulty: 1
    hints:
    - Multiply each side by 3.
    - 13 × 3.
    solution: '(15, 36, 39): hypotenuse 39.'
  - prompt: Why does a rope knotted into 3, 4 and 5 equal parts make a right angle?
    options:
    - Because 3² + 4² = 5²
    - Because 3 + 4 + 5 = 12
    - Because 5 is odd
    - Because ropes bend at 90°
    answer: Because 3² + 4² = 5²
    difficulty: 1
    hints:
    - Which rule links the three sides?
    - 9 + 16 = 25.
    solution: Sides 3, 4, 5 satisfy a² + b² = c², so the angle between the 3 and 4 sides is 90°.
