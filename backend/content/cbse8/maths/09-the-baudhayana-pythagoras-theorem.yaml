# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 9 (Part 2 chapter 2). Format: content/README.md.
subject: cbse8-math
chapter: 9
title: The Baudhayana-Pythagoras Theorem
tips:
  c8_pyth_add_sides: 'Square the sides first: the rule is a² + b² = c², not a + b = c.'
  t8_diag_square: "Diagonal² = side² + side². With sides of 1, what is diagonal²?"
  t8_diagonal_square_area: "The square on the diagonal equals the sum of the squares on two sides."
  t8_find_hyp: "c² = 9² + 40². Add the squares and find the square root."
  t8_pyth_hyp: "Square both sides, add, then take the square root."
  t8_pyth_leg: "The ladder is the longest side. To find a shorter side, subtract the squares and take the root."
  t8_pyth_test: "Square the two shorter sides and add. Is that equal to the square of the longest?"
  t8_rope_345: "Check: 3² + 4² against 5². What does that tell you about the angle?"
  t8_scale_triple: "Multiply every number in the triple by 3, including the hypotenuse."
  t8_triple_check: "Check a² + b² = c² for each set."
  t8_triple_formula: "Work out m² − n², 2mn and m² + n² with m = 3, n = 2. Which is largest?"
  c8m9_hyp_longest: The hypotenuse is the longest side, opposite the right angle. To find a shorter side, subtract the squares.
  c8m9_root: You have found the square of the side. Take the square root to get the side itself.
  c8m9_longest_last: 'Test with the longest side as c: is a² + b² equal to c²?'
  c8m9_multiply_all: Multiplying a triple by a number multiplies all three sides by it.
  c8m9_area_double: The square on the diagonal of a square has twice the area of the square.
  c8m9_formula: Put the values of m and n into m² − n², 2mn and m² + n² one at a time.
concepts:
- code: cbse8m.pyth.theorem
  title: The Baudhayana–Pythagoras theorem
  notes: |
    In a right-angled triangle, the square on the hypotenuse (the side opposite the right angle) equals the
    sum of the squares on the other two sides: c² = a² + b². Baudhayana stated it in the Sulba Sutras
    (around 800 BCE) for the diagonal of a rectangle. The square on the diagonal of a square has double the
    area, so the diagonal of a unit square is √2. Squares on two sides can be combined into one square.
  explanations:
    text: In a right-angled triangle, draw a square on each side. The two smaller squares together have exactly the same area as the big square on the longest side. So if the short sides are 3 and 4, the longest side c has c² = 9 + 16 = 25, and c = 5.
    visual: 'Draw a right triangle with sides 3, 4 and 5 on squared paper and draw a square on each side: 9 small squares, 16 small squares and 25 small squares. 9 + 16 = 25.'
    step_by_step: 'Step 1: Find the right angle; the side opposite it is the hypotenuse c. Step 2: For c, add the squares of the other two sides and take the square root. Step 3: For a shorter side, subtract: a² = c² − b². Step 4: Check the hypotenuse is the longest side.'
    real_world: A 13 m ladder leans against a wall with its foot 5 m from the wall. It reaches √(169 − 25) = √144 = 12 m up the wall.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 9
      - 2
      C:
      - 1
      - 8
    segments:
    - - A
      - B
      - '4'
    - - A
      - C
      - '3'
    - - B
      - C
      - '5'
    angles:
    - at: A
      from: B
      to: C
      label: 90°
    caption: '3² + 4² = 9 + 16 = 25 = 5²: the hypotenuse is 5.'
    alt: A right-angled triangle with the right angle at A, legs 3 and 4 and hypotenuse 5.
  activity:
    type: formula
    prompt: A right triangle with short sides a and b. c is the longest side.
    inputs:
    - name: a
      label: Side a
      min: 1
      max: 30
      step: 1
      start: 1
    - name: b
      label: Side b
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: a2b2
      label: a² + b²
      expr: a^2+b^2
    - name: c
      label: Longest side c
      expr: sqrt(a^2+b^2)
      places: 2
    goals:
    - prompt: Make c = 13 with a = 5.
      want:
        a: 5
        c: 13
      mistakes:
      - when:
          a: 5
          b: 8
        say: '5 + 8 = 13, but sides don''t add like that. Square them: 25 + 64 = 89, so c ≈ 9.4.'
    - prompt: A 10 m ladder, its foot 6 m from the wall. How high does it reach?
      want:
        a: 6
        c: 10
      mistakes:
      - when:
          a: 6
          b: 4
        say: '10 − 6 = 4 subtracts lengths. Subtract the squares: 100 − 36 = 64.'
      - when:
          a: 6
          b: 10
        say: 10 m is the ladder, the longest side, c. The height is a shorter side.
    - prompt: Make c = 25 with a = 7.
      want:
        a: 7
        c: 25
      mistakes:
      - when:
          a: 7
          b: 18
        say: '7 + 18 = 25 again. Add the squares instead: 625 − 49 = ?'
  lesson:
    - teach: 'In a right-angled triangle, the side opposite the right angle is the hypotenuse, and it is the longest side. Draw a square on each side. The square on the hypotenuse has the same area as the other two squares put together: c² = a² + b².'
      picture:
        kind: compare
        columns:
        - title: Sides 3, 4, 5
          points:
          - 3² = 9
          - 4² = 16
          - 5² = 25
        - title: Check
          points:
          - 9 + 16 = 25
          - so 3² + 4² = 5²
        alt: In a right triangle with sides 3, 4 and 5, the squares 9 and 16 add to 25, the square on the hypotenuse.
      check:
        prompt: In a right triangle, which side is the hypotenuse?
        options:
        - The side opposite the right angle
        - The shortest side
        - Either side next to the right angle
        answer: The side opposite the right angle
        why: The hypotenuse is opposite the right angle, and it is always the longest side.
    - teach: 'To find the hypotenuse, square the two shorter sides, add, and take the square root. Legs 5 and 12: 25 + 144 = 169, so the hypotenuse is √169 = 13. To find a shorter side, subtract: hypotenuse² − other side².'
      picture:
        kind: flow
        steps:
        - legs 5 and 12
        - 25 + 144 = 169
        - √169
        - hypotenuse 13
        alt: Legs 5 and 12 give 25 plus 144, which is 169; its square root, 13, is the hypotenuse.
      check:
        prompt: A right triangle has hypotenuse 10 and one leg 6. How long is the other leg?
        options:
        - '8'
        - '4'
        - '16'
        answer: '8'
        why: 10² − 6² = 100 − 36 = 64, and √64 = 8.
    - teach: 'Baudhayana wrote this rule in the Sulba Sutras, around 800 BCE, for the diagonal of a rectangle: the diagonal makes a right triangle with two sides. It also works backwards: if a² + b² = c², the triangle has a right angle. Builders used a rope with 3, 4 and 5 equal parts to make a right angle.'
      check:
        prompt: Do sides 6, 8 and 11 make a right triangle?
        options:
        - No, 6² + 8² is 100, not 121
        - Yes, because 6 + 8 > 11
        - Yes, every triangle does
        answer: No, 6² + 8² is 100, not 121
        why: 36 + 64 = 100, but 11² = 121, so there is no right angle.
  items:
  - prompt: A right triangle has legs 6 cm and 8 cm. Find the hypotenuse, in cm.
    answer: '10'
    check: sqrt(6**2 + 8**2)
    difficulty: 1
    hints:
    - c² = 6² + 8².
    - 36 + 64 = 100.
    solution: c² = 100, so c = 10 cm.
    mistakes:
      '14': c8_pyth_add_sides
  - prompt: A right triangle has hypotenuse 13 and one leg 5. Find the other leg.
    answer: '12'
    check: sqrt(13**2 - 5**2)
    difficulty: 2
    hints:
    - a² = 13² − 5².
    - 169 − 25 = 144.
    solution: a² = 144, so a = 12.
    mistakes:
      '8': c8_pyth_add_sides
  - prompt: A ladder 10 m long reaches 8 m up a wall. How far is its foot from the wall, in m?
    answer: '6'
    check: sqrt(100 - 64)
    difficulty: 2
    hints:
    - The ladder is the hypotenuse.
    - 100 − 64 = 36.
    solution: Foot distance = √(10² − 8²) = √36 = 6 m.
    mistakes: {"2": "t8_pyth_leg", "12.8": "t8_pyth_leg"}
  - prompt: Do sides 7, 24 and 25 make a right triangle?
    options:
    - Yes, because 7² + 24² = 25²
    - No, because 7 + 24 ≠ 25
    - Yes, because 25 is the biggest
    - No, because 7 is odd
    answer: Yes, because 7² + 24² = 25²
    difficulty: 2
    hints:
    - Check a² + b² = c².
    - 49 + 576 = 625.
    solution: 49 + 576 = 625 = 25², so it is a right triangle.
    mistakes: {"No, because 7 + 24 ≠ 25": "t8_pyth_test", "Yes, because 25 is the biggest": "t8_pyth_test"}
  - prompt: A square has sides of 1 m. Its diagonal is √d m. What is d?
    answer: '2'
    check: 1**2 + 1**2
    difficulty: 2
    hints:
    - Diagonal² = 1² + 1².
    - = 2.
    solution: Diagonal² = 1 + 1 = 2, so the diagonal is √2 m.
    mistakes: {"1": "t8_diag_square", "4": "t8_diag_square"}
  - prompt: A rectangle is 9 cm by 12 cm. How long is its diagonal, in cm?
    answer: '15'
    check: sqrt(81 + 144)
    difficulty: 2
    hints:
    - The diagonal is the hypotenuse.
    - 81 + 144 = 225.
    solution: √(81 + 144) = √225 = 15 cm.
    mistakes: {"21": "added_sides", "225": "t8_pyth_hyp"}
  - prompt: A right triangle has legs 9 cm and 12 cm. Find the hypotenuse, in cm.
    answer: '15'
    check: sqrt(9**2 + 12**2)
    difficulty: 1
    hints:
    - 9² + 12² = 81 + 144.
    - √225.
    solution: 'Step 1: 81 + 144 = 225. Step 2: √225 = 15 cm.'
    mistakes:
      '21': c8_pyth_add_sides
      '225': c8m9_root
  - prompt: A right triangle has hypotenuse 17 and one leg 8. Find the other leg.
    answer: '15'
    check: sqrt(17**2 - 8**2)
    difficulty: 2
    hints:
    - The hypotenuse is the longest side.
    - 17² − 8² = 289 − 64.
    solution: 'Step 1: 289 − 64 = 225. Step 2: √225 = 15.'
    mistakes:
      '9': c8_pyth_add_sides
      '353': c8m9_hyp_longest
  - prompt: A 13 m ladder leans against a wall with its foot 5 m from the wall. How high up the wall does it reach, in m?
    answer: '12'
    check: sqrt(13**2 - 5**2)
    difficulty: 2
    hints:
    - The ladder is the hypotenuse.
    - 13² − 5².
    solution: 'Step 1: 169 − 25 = 144. Step 2: √144 = 12 m.'
    mistakes:
      '8': c8_pyth_add_sides
      '144': c8m9_root
  - prompt: A rectangular field is 24 m by 7 m. How long is its diagonal, in m?
    answer: '25'
    check: sqrt(24**2 + 7**2)
    difficulty: 1
    hints:
    - The diagonal is the hypotenuse of a right triangle.
    - 24² + 7² = 576 + 49.
    solution: 'Step 1: 576 + 49 = 625. Step 2: √625 = 25 m.'
    mistakes:
      '31': c8_pyth_add_sides
      '625': c8m9_root
  - prompt: Which set of sides makes a right triangle?
    options:
    - 10, 24, 26
    - 4, 5, 6
    - 5, 6, 7
    - 2, 3, 4
    answer: 10, 24, 26
    difficulty: 2
    hints:
    - Square the two shorter sides and add.
    - Compare with the square of the longest.
    solution: '100 + 576 = 676 = 26². For 4, 5, 6: 16 + 25 = 41, not 36. The others fail too.'
    mistakes:
      4, 5, 6: t8_pyth_test
      5, 6, 7: t8_pyth_test
      2, 3, 4: t8_pyth_test
  - prompt: A square has a diagonal of √50 cm. How long is each side, in cm?
    answer: '5'
    check: sqrt(50/2)
    difficulty: 3
    hints:
    - side² + side² = diagonal².
    - 2 × side² = 50.
    solution: 'Step 1: 2 × side² = 50. Step 2: side² = 25. Step 3: side = 5 cm.'
    mistakes:
      '25': c8m9_root
      '50': t8_diag_square
  - prompt: A boy walks 8 km east and then 6 km north. How far is he from his starting point, in km?
    answer: '10'
    check: sqrt(8**2 + 6**2)
    difficulty: 2
    hints:
    - East and north are at right angles.
    - 8² + 6².
    solution: 'Step 1: 64 + 36 = 100. Step 2: √100 = 10 km.'
    mistakes:
      '14': c8_pyth_add_sides
      '100': c8m9_root
  - prompt: A TV screen is 32 inches wide and 24 inches high. How long is its diagonal, in inches?
    answer: '40'
    check: sqrt(32**2 + 24**2)
    difficulty: 2
    hints:
    - 32² + 24² = 1024 + 576.
    - √1600.
    solution: 'Step 1: 1024 + 576 = 1600. Step 2: √1600 = 40 inches.'
    mistakes:
      '56': c8_pyth_add_sides
      '1600': c8m9_root
  - prompt: Sides 20, 21 and 29. Is this a right triangle?
    options:
    - Yes, because 20² + 21² = 29²
    - No, because 20 + 21 ≠ 29
    - No, because 29 is too long
    answer: Yes, because 20² + 21² = 29²
    difficulty: 2
    hints:
    - Square the two shorter sides.
    - 400 + 441 = ?
    solution: 400 + 441 = 841 = 29², so the angle between the sides 20 and 21 is a right angle.
    mistakes:
      No, because 20 + 21 ≠ 29: c8_pyth_add_sides
      No, because 29 is too long: c8m9_longest_last
- code: cbse8m.pyth.triples
  title: Integer right triangles and doubling a square
  after:
  - cbse8m.pyth.theorem
  notes: |
    Whole numbers a, b, c with a² + b² = c² form a Baudhayana (Pythagorean) triple: (3, 4, 5), (5, 12, 13),
    (8, 15, 17), (7, 24, 25). Multiplying a triple by any whole number gives another: (6, 8, 10). For any
    m > n, (m² − n², 2mn, m² + n²) is a triple. The square drawn on the diagonal of a square has twice its
    area, which is how Baudhayana doubled a square.
  explanations:
    text: Some right triangles have all three sides as whole numbers, like 3, 4, 5. These are triples. Double, triple or scale up a triple and you get another one. And drawing a square on the diagonal of a square doubles the area.
    visual: 'Draw a square of side 2 (area 4). Draw its diagonal and a new square on it: the new square holds 8 small squares, twice the first.'
    step_by_step: 'Step 1: To test a triple, square the two smaller numbers and add. Step 2: Compare with the square of the largest. Step 3: To make new triples, multiply a known triple by 2, 3, 4 ... Step 4: Or choose m > n and work out m² − n², 2mn and m² + n².'
    real_world: 'Builders mark a right angle with a rope knotted into 12 equal parts: pulled into a 3, 4, 5 triangle, it makes a perfect corner.'
  picture:
    kind: compare
    columns:
    - title: Basic triples
      points:
      - 3, 4, 5
      - 5, 12, 13
      - 8, 15, 17
      - 7, 24, 25
    - title: Scaled up
      points:
      - 6, 8, 10 (× 2)
      - 9, 12, 15 (× 3)
      - 10, 24, 26 (× 2)
      - 16, 30, 34 (× 2)
    caption: Multiply every side of a triple by the same number to get another triple.
    alt: 'Two columns: basic triples 3-4-5, 5-12-13, 8-15-17, 7-24-25 and scaled-up triples 6-8-10, 9-12-15, 10-24-26, 16-30-34.'
  activity:
    type: sort
    prompt: Can these three sides make a right triangle?
    bins:
    - Right triangle
    - Not a right triangle
    items:
    - label: 3, 4, 5
      bin: Right triangle
      clue: Is 3² + 4² equal to 5²?
      why: 9 + 16 = 25. Yes.
    - label: 6, 8, 10
      bin: Right triangle
      clue: It's 3, 4, 5 doubled. Does doubling keep the angle?
      why: 36 + 64 = 100. Yes.
    - label: 5, 12, 13
      bin: Right triangle
      clue: Check 25 + 144 against 169.
      why: 25 + 144 = 169. Yes.
    - label: 8, 15, 17
      bin: Right triangle
      clue: Check 64 + 225 against 289.
      why: 64 + 225 = 289. Yes.
    - label: 9, 12, 15
      bin: Right triangle
      clue: It's 3, 4, 5 times 3.
      why: 81 + 144 = 225. Yes.
    - label: 4, 5, 6
      bin: Not a right triangle
      clue: Is 16 + 25 equal to 36?
      why: 41 is not 36. No.
    - label: 2, 3, 4
      bin: Not a right triangle
      clue: Square and add the two short sides.
      why: 4 + 9 = 13, not 16. No.
    - label: 5, 6, 11
      bin: Not a right triangle
      clue: 5 + 6 = 11, but does that matter? Square them.
      why: 25 + 36 = 61, not 121. In fact 5 + 6 = 11 can't make a triangle at all.
    - label: 7, 8, 10
      bin: Not a right triangle
      clue: 49 + 64 against 100?
      why: 113 is not 100. No.
  lesson:
    - teach: Whole numbers a, b, c with a² + b² = c² make a Baudhayana (Pythagorean) triple. The best known are (3, 4, 5), (5, 12, 13), (8, 15, 17) and (7, 24, 25).
      picture:
        kind: compare
        columns:
        - title: Triple
          points:
          - 3, 4, 5
          - 5, 12, 13
          - 8, 15, 17
        - title: Check
          points:
          - 9 + 16 = 25
          - 25 + 144 = 169
          - 64 + 225 = 289
        alt: 'Three triples and their checks: 9 plus 16 is 25, 25 plus 144 is 169, 64 plus 225 is 289.'
      check:
        prompt: Is (6, 8, 10) a triple?
        options:
        - 'Yes'
        - 'No'
        - Only for squares
        answer: 'Yes'
        why: 36 + 64 = 100 = 10². It is (3, 4, 5) doubled.
    - teach: 'Multiply a triple by any whole number and you get another: (3, 4, 5) × 3 = (9, 12, 15). To make new triples, pick whole numbers m > n and work out m² − n², 2mn and m² + n². With m = 2, n = 1 you get (3, 4, 5).'
      picture:
        kind: flow
        steps:
        - m = 4, n = 1
        - m² − n² = 15
        - 2mn = 8
        - m² + n² = 17
        alt: With m equal to 4 and n equal to 1 the formula gives 15, 8 and 17.
      check:
        prompt: Multiply (5, 12, 13) by 2. What is the new triple?
        options:
        - 10, 24, 26
        - 7, 14, 15
        - 10, 24, 13
        answer: 10, 24, 26
        why: All three numbers are doubled.
    - teach: 'The square drawn on the diagonal of a square has twice its area. That is how Baudhayana doubled a square: to get a square of area 2, draw the square on the diagonal of a square of area 1. Its side is √2, which is not a whole number.'
      check:
        prompt: A square has area 9 cm². What is the area of the square on its diagonal?
        options:
        - 18 cm²
        - 81 cm²
        - 12 cm²
        answer: 18 cm²
        why: diagonal² = 3² + 3² = 18, so the square on the diagonal has area 18 cm².
  items:
  - prompt: Which set is a Baudhayana–Pythagoras triple?
    options:
    - 8, 15, 17
    - 6, 9, 12
    - 4, 5, 6
    - 2, 3, 4
    answer: 8, 15, 17
    difficulty: 1
    hints:
    - Test a² + b² = c².
    - 64 + 225 = 289.
    solution: 64 + 225 = 289 = 17².
    mistakes: {"6, 9, 12": "t8_triple_check", "4, 5, 6": "t8_triple_check"}
  - prompt: Complete the triple (9, 40, c). Find c.
    answer: '41'
    check: sqrt(81 + 1600)
    difficulty: 2
    hints:
    - c² = 81 + 1600.
    - = 1681.
    solution: c² = 1681, so c = 41.
    mistakes: {"49": "t8_find_hyp", "1681": "t8_find_hyp"}
  - prompt: Using m = 3, n = 2 in (m² − n², 2mn, m² + n²), what is the largest number?
    answer: '13'
    check: 3**2 + 2**2
    difficulty: 2
    hints:
    - m² + n² = 9 + 4.
    - '13.'
    solution: The triple is (5, 12, 13); the largest is 13.
    mistakes: {"12": "t8_triple_formula", "5": "t8_triple_formula"}
  - prompt: A square has area 18 cm². What is the area of the square drawn on its diagonal, in cm²?
    answer: '36'
    check: 2*18
    difficulty: 2
    hints:
    - The square on the diagonal has double the area.
    - 2 × 18.
    solution: 'Doubling: 2 × 18 = 36 cm².'
    mistakes: {"18": "t8_diagonal_square_area", "324": "t8_diagonal_square_area"}
  - prompt: Multiply the triple (5, 12, 13) by 3. What is the new hypotenuse?
    answer: '39'
    check: 13*3
    difficulty: 1
    hints:
    - Multiply each side by 3.
    - 13 × 3.
    solution: '(15, 36, 39): hypotenuse 39.'
    mistakes: {"13": "t8_scale_triple", "16": "t8_scale_triple"}
  - prompt: Why does a rope knotted into 3, 4 and 5 equal parts make a right angle?
    options:
    - Because 3² + 4² = 5²
    - Because 3 + 4 + 5 = 12
    - Because 5 is odd
    - Because ropes bend at 90°
    answer: Because 3² + 4² = 5²
    difficulty: 1
    hints:
    - Which rule links the three sides?
    - 9 + 16 = 25.
    solution: Sides 3, 4, 5 satisfy a² + b² = c², so the angle between the 3 and 4 sides is 90°.
    mistakes: {"Because 3 + 4 + 5 = 12": "t8_rope_345", "Because ropes bend at 90°": "t8_rope_345"}
  - prompt: Complete the triple (8, 15, c). Find c.
    answer: '17'
    check: sqrt(8**2 + 15**2)
    difficulty: 1
    hints:
    - 64 + 225.
    - √289.
    solution: 64 + 225 = 289 = 17², so c = 17.
    mistakes:
      '23': c8_pyth_add_sides
      '289': c8m9_root
  - prompt: Complete the triple (12, b, 13). Find b.
    answer: '5'
    check: sqrt(13**2 - 12**2)
    difficulty: 2
    hints:
    - 13 is the hypotenuse.
    - 169 − 144.
    solution: 169 − 144 = 25 = 5², so b = 5.
    mistakes:
      '1': c8_pyth_add_sides
      '25': c8m9_root
  - prompt: Multiply the triple (8, 15, 17) by 2. What is the new hypotenuse?
    answer: '34'
    check: 17*2
    difficulty: 1
    hints:
    - The hypotenuse is the largest number.
    - Double it.
    solution: (16, 30, 34). The hypotenuse is 34.
    mistakes:
      '19': c8m9_multiply_all
      '17': c8m9_multiply_all
  - prompt: Using m = 4 and n = 3 in (m² − n², 2mn, m² + n²), what is the largest number?
    answer: '25'
    check: 4**2 + 3**2
    difficulty: 2
    hints:
    - The largest is m² + n².
    - 16 + 9.
    solution: m² − n² = 7, 2mn = 24, m² + n² = 25. The triple is (7, 24, 25).
    mistakes:
      '24': c8m9_formula
      '7': c8m9_formula
  - prompt: Using m = 5 and n = 2, what is 2mn?
    answer: '20'
    check: 2*5*2
    difficulty: 1
    hints:
    - 2 × m × n.
    - 2 × 5 × 2.
    solution: 2 × 5 × 2 = 20. The triple is (21, 20, 29).
    mistakes:
      '9': c8m9_formula
      '10': c8m9_formula
  - prompt: Which is NOT a Baudhayana–Pythagoras triple?
    options:
    - 6, 7, 9
    - 9, 12, 15
    - 20, 21, 29
    - 12, 16, 20
    answer: 6, 7, 9
    difficulty: 2
    hints:
    - Check a² + b² = c² for each.
    - 36 + 49 = 85. Is 85 = 9²?
