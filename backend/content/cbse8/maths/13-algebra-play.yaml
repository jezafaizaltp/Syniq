# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 13 (Part 2 chapter 6). Format: content/README.md.
subject: cbse8-math
chapter: 13
title: Algebra Play
tips:
  t8_calendar_below: "One row down on a calendar is one week later."
  t8_calendar_block: "In a 3 × 3 block the total is 9 times the middle date."
  t8_calendar_diagonal: "The 2 × 2 square has dates 10, 11, 17, 18. Add each diagonal pair."
  t8_pyramid: "Each block is the sum of the two below it. Build up row by row."
  t8_pyramid_algebra: "Middle row: a + b and b + c. Add them for the top. b is used twice."
  t8_pyramid_solve: "Top = 4 + 2x + 6. Set it equal to 30 and solve."
  t8_reverse_11: "Write the number as 10a + b and its reverse as 10b + a. Add and factor."
  t8_reverse_9: "Subtract first, then divide by 9."
  t8_three_dates: "Dates one under another are n, n + 7, n + 14. Add them and solve."
  t8_trick_algebra: "Call your number x and follow every step with x, simplifying as you go. The x disappears at the end; what number is left?"
  t8_undo_steps: "Follow the steps with x: they always bring you back to x. So the answer equals the number you started with."
  c8m13_follow_x: Write x for the starting number and do each step to the expression. Simplify after every step.
  c8m13_undo: 'Undo the steps in reverse order: the last step first, each one turned round.'
  c8m13_pyramid_up: Each block is the sum of the two blocks directly below it. Fill in one row at a time.
  c8m13_calendar_steps: On a calendar, one step right is +1 and one step down is +7.
  c8m13_two_digit: Write the two-digit number as 10a + b. Its reverse is 10b + a.

concepts:
- code: cbse8m.alg.tricks
  title: The algebra behind number tricks
  notes: |
    'Think of a number' tricks work because the steps cancel out. Call the number x and follow the steps:
    x → 2x → 2x + 10 → x + 5 → 5, so the answer is always 5. Algebra explains why any starting number works.
    In a number pyramid each block is the sum of the two below it; with bottom blocks a, b, c the top is
    a + 2b + c.
  explanations:
    text: In a 'think of a number' trick, call the secret number x and write each step in algebra. You will see the x cancel out or be easy to undo, which is how the magician 'knows' the answer.
    visual: 'Draw a pyramid: bottom row a, b, c; middle row a + b and b + c; top (a + b) + (b + c) = a + 2b + c. The middle bottom number counts twice.'
    step_by_step: 'Step 1: Let the starting number be x. Step 2: Write each instruction as an expression. Step 3: Simplify after each step. Step 4: See what is left: if x has gone, the answer is the same for everyone.'
    real_world: 'Ask a friend: ''Think of a number, double it, add 8, halve it, take away your number.'' Everyone ends with 4, because (2x + 8) ÷ 2 − x = 4.'
  picture:
    kind: flow
    steps:
    - 'Think of a number: x'
    - 'Double it: 2x'
    - 'Add 10: 2x + 10'
    - 'Halve it: x + 5'
    - 'Take away the number: 5'
    alt: 'A number trick in algebra: x, 2x, 2x + 10, x + 5, and finally 5 whatever x was.'
  activity:
    type: formula
    prompt: Think of x. Double it, add k, halve the result, then take away x.
    inputs:
    - name: x
      label: Secret number x
      min: 0
      max: 50
      step: 1
      start: 1
    - name: k
      label: Number added k
      min: 0
      max: 30
      step: 1
      start: 0
    outputs:
    - name: d
      label: Doubled
      expr: 2*x
    - name: ad
      label: Plus k
      expr: 2*x+k
    - name: h
      label: Halved
      expr: (2*x+k)/2
    - name: end
      label: Minus x
      expr: (2*x+k)/2-x
    goals:
    - prompt: Make the trick always end at 8.
      want:
        end: 8
      mistakes:
      - when:
          k: 8
        say: You add k before halving, so the end is k ÷ 2. What k halves to 8?
    - prompt: Secret number 37, and the trick ends at 5.
      want:
        x: 37
        end: 5
      mistakes:
      - when:
          x: 37
          k: 5
        say: 'Adding 5 and then halving leaves 2.5. Add double what you want: 10.'
    - prompt: Make the trick end at 12.
      want:
        end: 12
      mistakes:
      - when:
          k: 12
        say: Halving cuts it to 6. The end is always k ÷ 2, whatever x is.
  lesson:
    - teach: 'In a ''think of a number'' trick, everyone ends with the same answer. Call the number x and follow the steps: double it (2x), add 6 (2x + 6), halve it (x + 3), take away your number (3). The x cancels, so the answer is always 3.'
      picture:
        kind: flow
        steps:
        - x
        - 'double: 2x'
        - 'add 6: 2x + 6'
        - 'halve: x + 3'
        - 'minus x: 3'
        alt: 'Starting from x: 2x, then 2x plus 6, then x plus 3, then 3. The x cancels out.'
      check:
        prompt: Think of a number, add 5, then take away your number. What do you always get?
        options:
        - '5'
        - Your number
        - '0'
        answer: '5'
        why: x + 5 − x = 5, whatever x is.
    - teach: 'If a trick tells you the result, you can find the starting number by undoing the steps in reverse: the last step first. Multiplying is undone by dividing, adding by subtracting. If ''times 3, then add 4'' gives 19, then 19 − 4 = 15 and 15 ÷ 3 = 5.'
      check:
        prompt: Double a number, then add 3. The result is 17. What was the number?
        options:
        - '7'
        - '10'
        - '40'
        answer: '7'
        why: 'Undo in reverse: 17 − 3 = 14, then 14 ÷ 2 = 7.'
    - teach: In a number pyramid, each block is the sum of the two blocks below it. With bottom row a, b, c, the middle row is a + b and b + c, and the top is a + 2b + c. The middle number counts twice.
      picture:
        kind: flow
        steps:
        - 'bottom: a, b, c'
        - 'middle: a + b, b + c'
        - 'top: a + 2b + c'
        alt: A pyramid with bottom a, b, c has middle row a plus b and b plus c, and top a plus 2b plus c.
      check:
        prompt: A pyramid's bottom row is 1, 4, 2. What is the top?
        options:
        - '11'
        - '7'
        - '8'
        answer: '11'
        why: 1 + 2 × 4 + 2 = 11 (middle row 5 and 6).
  items:
  - prompt: Think of a number, double it, add 8, halve it, then subtract the number you thought of. What do you always get?
    answer: '4'
    check: (2*7 + 8)/2 - 7
    difficulty: 1
    hints:
    - x → 2x → 2x + 8.
    - 'Halve: x + 4.'
    solution: (2x + 8) ÷ 2 − x = x + 4 − x = 4.
    mistakes: {"8": "t8_trick_algebra", "0": "t8_trick_algebra"}
  - prompt: Think of a number, add 3, multiply by 4, subtract 12, then divide by your number. What do you always get?
    answer: '4'
    check: (4*(5 + 3) - 12)/5
    difficulty: 2
    hints:
    - 4(x + 3) − 12 = 4x.
    - 4x ÷ x.
    solution: 4(x + 3) − 12 = 4x, and 4x ÷ x = 4.
    mistakes: {"3": "t8_trick_algebra", "12": "t8_trick_algebra"}
  - prompt: A number pyramid has bottom row 3, 5, 2. What is the top block?
    answer: '15'
    check: 3 + 2*5 + 2
    difficulty: 1
    hints:
    - 'Middle row: 8 and 7.'
    - 'Top: 8 + 7.'
    solution: 3 + 5 = 8, 5 + 2 = 7, top = 15 (= 3 + 2 × 5 + 2).
    mistakes: {"10": "t8_pyramid", "8": "t8_pyramid"}
  - prompt: In a 3-row number pyramid with bottom a, b, c, what is the top?
    options:
    - a + 2b + c
    - a + b + c
    - 2a + b + 2c
    - abc
    answer: a + 2b + c
    difficulty: 2
    hints:
    - 'Middle row: a + b and b + c.'
    - Add them.
    solution: (a + b) + (b + c) = a + 2b + c.
    mistakes: {"a + b + c": "t8_pyramid_algebra", "2a + b + 2c": "t8_pyramid_algebra"}
  - prompt: A pyramid has bottom row 4, x, 6 and top 30. Find x.
    answer: '10'
    check: (30 - 10)/2
    difficulty: 3
    hints:
    - Top = 4 + 2x + 6.
    - 2x + 10 = 30.
    solution: 2x + 10 = 30, so x = 10.
    mistakes: {"20": "t8_pyramid_solve", "5": "t8_pyramid_solve"}
  - prompt: Think of a number, multiply by 5, add 15, divide by 5, subtract 3. If you got 9, what number did you think of?
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - 5x + 15 ÷ 5 = x + 3.
    - x + 3 − 3 = x.
    solution: The steps give back x, so the number was 9.
    mistakes: {"45": "t8_undo_steps", "3": "t8_undo_steps"}
  - prompt: Think of a number, multiply by 3, add 12, divide by 3, then subtract your number. What do you always get?
    answer: '4'
    check: 12/3
    difficulty: 1
    hints:
    - 'Start with x: 3x, then 3x + 12.'
    - 'Divide by 3: x + 4.'
    solution: x → 3x → 3x + 12 → x + 4 → 4. You always get 4.
    mistakes:
      '12': c8m13_follow_x
      '0': c8m13_follow_x
  - prompt: Think of a number, add 7, double it, subtract 14, then halve it. If you started with 23, what do you get?
    answer: '23'
    check: ((23 + 7)*2 - 14)/2
    difficulty: 2
    hints:
    - 'Use x: x + 7, then 2x + 14.'
    - 'Subtract 14: 2x. Halve: x.'
    solution: x → x + 7 → 2x + 14 → 2x → x. You get back your number, 23.
    mistakes:
      '7': t8_undo_steps
      '30': c8m13_follow_x
  - prompt: Multiply a number by 4, then subtract 5. The result is 27. What was the number?
    answer: '8'
    check: (27 + 5)/4
    difficulty: 1
    hints:
    - 'Undo the last step first: add 5.'
    - Then divide by 4.
    solution: 27 + 5 = 32, and 32 ÷ 4 = 8.
    mistakes:
      '5.5': c8m13_undo
      '103': c8m13_undo
  - prompt: A pyramid's bottom row is 5, 3, 8. What is the top block?
    answer: '19'
    check: 5 + 2*3 + 8
    difficulty: 1
    hints:
    - 'Middle row: 5 + 3 and 3 + 8.'
    - Add 8 and 11.
    solution: 'Middle row: 8 and 11. Top: 8 + 11 = 19.'
    mistakes:
      '16': t8_pyramid_algebra
      '11': c8m13_pyramid_up
  - prompt: A pyramid has bottom row 2, x, 5 and top 21. Find x.
    answer: '7'
    check: (21 - 2 - 5)/2
    difficulty: 2
    hints:
    - Top = 2 + 2x + 5.
    - 2x + 7 = 21.
    solution: 2 + 2x + 5 = 21, so 2x = 14 and x = 7.
    mistakes:
      '14': t8_pyramid_solve
      '21': t8_pyramid_solve
  - prompt: Think of a number, multiply by 2, add 10, halve it, subtract 5. What is the result in terms of x?
    options:
    - x
    - x + 5
    - 2x
    - '5'
    answer: x
    difficulty: 2
    hints:
    - 2x, then 2x + 10.
    - 'Halve: x + 5. Then subtract 5.'
    solution: x → 2x → 2x + 10 → x + 5 → x. The trick gives back your number.
    mistakes:
      x + 5: c8m13_follow_x
      2x: c8m13_follow_x
      '5': c8m13_follow_x
  - prompt: A 4-row pyramid has bottom row 1, 2, 3, 4. What is the top block?
    answer: '20'
    check: 1 + 3*2 + 3*3 + 4
    difficulty: 3
    hints:
    - 'Row 2: 3, 5, 7.'
    - 'Row 3: 8, 12.'
    solution: 'Row 2: 3, 5, 7. Row 3: 8, 12. Top: 20.'
    mistakes:
      '10': c8m13_pyramid_up
      '12': c8m13_pyramid_up
  - prompt: Think of a number, add 4, multiply by 5, subtract 20. The answer is always…
    options:
    - 5 times your number
    - '20'
    - your number
    answer: 5 times your number
    difficulty: 2
    hints:
    - x + 4, then 5(x + 4) = 5x + 20.
    - Subtract 20.
    solution: x → x + 4 → 5x + 20 → 5x. So the answer is always 5 times your number.
    mistakes:
      '20': c8m13_follow_x
      your number: c8m13_follow_x
  - prompt: Add 9 to a number, then divide by 2. The result is 11. What was the number?
    answer: '13'
    check: 11*2 - 9
    difficulty: 2
    hints:
    - 'Undo the division first: × 2.'
    - Then undo + 9.
    solution: 11 × 2 = 22, and 22 − 9 = 13.
    mistakes:
      '1': c8m13_undo
      '10': c8m13_undo
- code: cbse8m.alg.grids
  title: Calendar magic and divisibility tricks
  after:
  - cbse8m.alg.tricks
  notes: |
    On a calendar, if a date is n, the date to its right is n + 1 and the date below is n + 7. In any 2 × 2
    square the diagonal sums are equal (n + (n + 8) = (n + 1) + (n + 7)). The sum of a 3 × 3 block is 9 times
    the middle date. Algebra also explains divisibility tricks: a two-digit number 10a + b plus its reverse
    10b + a is 11(a + b), always a multiple of 11; their difference 9(a − b) is a multiple of 9.
  explanations:
    text: 'Grids like a calendar follow simple rules: one step right adds 1, one step down adds 7. Writing a date as n turns calendar tricks into simple algebra, and it explains why some number tricks always work.'
    visual: Draw a 3 by 3 box on a calendar around the 15th. The numbers are 7, 8, 9, 14, 15, 16, 21, 22, 23; they add to 135 = 9 × 15.
    step_by_step: 'Step 1: Call one cell n. Step 2: Write the others as n plus or minus a number (right +1, down +7). Step 3: Add or compare the expressions. Step 4: Read off the rule.'
    real_world: A magician asks you to box any 3 × 3 square on a calendar and tell them the total. They divide by 9 to name the middle date at once.
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: n
    - size: 1
      label: n + 1
    rows:
    - size: 1
      label: week 1
    - size: 1
      label: week 2
    cells:
    - - n
      - n + 1
    - - n + 7
      - n + 8
    caption: In any 2 × 2 calendar square, n + (n + 8) = (n + 1) + (n + 7).
    alt: A 2 by 2 calendar square with dates n, n plus 1, n plus 7 and n plus 8; both diagonals add to 2n plus 8.
  activity:
    type: formula
    prompt: On a calendar, call a date n. One step right adds 1; one step down adds 7.
    inputs:
    - name: n
      label: Date n
      min: 1
      max: 31
      step: 1
      start: 1
    outputs:
    - name: box
      label: '2 × 2 box: n + (n+1) + (n+7) + (n+8)'
      expr: 4*n+16
    - name: col
      label: '3 in a column: n + (n+7) + (n+14)'
      expr: 3*n+21
    goals:
    - prompt: A 2 × 2 box of dates adds to 64. Find its top-left date.
      want:
        box: 64
      mistakes:
      - when:
          n: 16
        say: '64 ÷ 4 = 16 is the average of the four dates. The top-left one is the smallest: 4n + 16 = 64.'
      - when:
          n: 8
        say: 'Check: 8 + 9 + 15 + 16 = 48. Too small.'
    - prompt: A 2 × 2 box adds to 100.
      want:
        box: 100
      mistakes:
      - when:
          n: 25
        say: '100 ÷ 4 = 25 is the average. Take away 16 first: 4n = 84.'
    - prompt: Three dates in a column add to 45. Find the top one.
      want:
        col: 45
      mistakes:
      - when:
          n: 15
        say: 15 is the middle date (45 ÷ 3). The top one is 7 less.
      - when:
          n: 22
        say: That's the bottom date. The top one is 14 less.
  lesson:
    - teach: On a calendar, if a date is n, the date to its right is n + 1 and the date just below is n + 7, a week later. With this, algebra explains calendar tricks.
      picture:
        kind: compare
        columns:
        - title: Position
          points:
          - a date
          - one to the right
          - one below
        - title: Date
          points:
          - n
          - n + 1
          - n + 7
        alt: On a calendar a date n has n plus 1 to its right and n plus 7 below it.
      check:
        prompt: What date is directly below the 9th?
        options:
        - 16th
        - 10th
        - 18th
        answer: 16th
        why: 'One row down is one week later: 9 + 7 = 16.'
    - teach: 'In a 2 × 2 square of dates, n, n + 1, n + 7, n + 8, the two diagonals always have the same sum: n + (n + 8) = (n + 1) + (n + 7) = 2n + 8. In a 3 × 3 block the nine dates add to 9 times the middle date, because the others pair up around it.'
      check:
        prompt: A 3 × 3 calendar block has 14 in the middle. What is the total of all 9 dates?
        options:
        - '126'
        - '112'
        - '140'
        answer: '126'
        why: 9 × 14 = 126.
    - teach: Algebra explains number tricks too. A two-digit number with digits a and b is 10a + b. Its reverse is 10b + a. Their sum is 11a + 11b = 11(a + b), always a multiple of 11. Their difference is 9(a − b), always a multiple of 9.
      picture:
        kind: flow
        steps:
        - 53 = 10×5 + 3
        - 35 = 10×3 + 5
        - 53 + 35 = 11 × 8 = 88
        - 53 − 35 = 9 × 2 = 18
        alt: 53 plus 35 is 11 times 8, and 53 minus 35 is 9 times 2.
      check:
        prompt: What is 74 + 47 divided by 11?
        options:
        - '11'
        - '7'
        - '121'
        answer: '11'
        why: 74 + 47 = 11 × (7 + 4) = 121, and 121 ÷ 11 = 11.
  items:
  - prompt: On a calendar, what is the date directly below the 12th?
    answer: '19'
    check: 12 + 7
    difficulty: 1
    hints:
    - Down one row adds 7.
    - 12 + 7.
    solution: 12 + 7 = 19.
    mistakes: {"13": "t8_calendar_below", "18": "t8_calendar_below"}
  - prompt: A 3 × 3 calendar block has a total of 108. What is the middle date?
    answer: '12'
    check: 108/9
    difficulty: 2
    hints:
    - The total is 9 times the middle date.
    - 108 ÷ 9.
    solution: 108 ÷ 9 = 12.
    mistakes: {"36": "t8_calendar_block", "9": "t8_calendar_block"}
  - prompt: A 2 × 2 calendar square has top-left date 10. What is the sum of either diagonal?
    answer: '28'
    check: 10 + 18
    difficulty: 1
    hints:
    - The diagonal is 10 and 18.
    - Or 11 and 17.
    solution: 10 + 18 = 28 = 11 + 17.
    mistakes: {"21": "t8_calendar_diagonal", "56": "t8_calendar_diagonal"}
  - prompt: Why is a two-digit number plus its reverse always a multiple of 11?
    options:
    - (10a + b) + (10b + a) = 11(a + b)
    - Because 11 is prime
    - Because both have two digits
    - It is only true for even numbers
    answer: (10a + b) + (10b + a) = 11(a + b)
    difficulty: 2
    hints:
    - Write the number as 10a + b.
    - Its reverse is 10b + a.
    solution: Adding gives 11a + 11b = 11(a + b), a multiple of 11.
    mistakes: {"Because 11 is prime": "t8_reverse_11", "Because both have two digits": "t8_reverse_11"}
  - prompt: 72 − 27 is a multiple of 9. What is (72 − 27) ÷ 9?
    answer: '5'
    check: (72 - 27)/9
    difficulty: 2
    hints:
    - The difference is 9(a − b).
    - a − b = 7 − 2.
    solution: 72 − 27 = 45 = 9 × 5.
    mistakes: {"45": "t8_reverse_9", "11": "t8_reverse_9"}
  - prompt: Three dates one under another on a calendar add to 45. What is the top date?
    answer: '8'
    check: (45 - 21)/3
    difficulty: 3
    hints:
    - The dates are n, n + 7, n + 14.
    - 3n + 21 = 45.
    solution: 3n + 21 = 45, so n = 8 (dates 8, 15, 22).
    mistakes: {"15": "t8_three_dates", "22": "t8_three_dates"}
  - prompt: On a calendar, what date is two rows below the 5th?
    answer: '19'
    check: 5 + 2*7
    difficulty: 1
    hints:
    - One row down is +7.
    - Two rows down is +14.
    solution: 5 + 7 + 7 = 19.
    mistakes:
      '7': c8m13_calendar_steps
      '12': c8m13_calendar_steps
  - prompt: A 3 × 3 calendar block adds to 162. What is the middle date?
    answer: '18'
    check: 162/9
    difficulty: 2
    hints:
    - The total is 9 times the middle date.
    - 162 ÷ 9.
    solution: 162 ÷ 9 = 18.
    mistakes:
      '54': t8_calendar_block
      '20.25': t8_calendar_block
  - prompt: A 2 × 2 calendar square has top-left date 15. What is the sum of either diagonal?
    answer: '38'
    check: 2*15 + 8
    difficulty: 2
    hints:
    - The dates are 15, 16, 22, 23.
    - 15 + 23.
    solution: 15 + 23 = 38, and 16 + 22 = 38. Both diagonals give 2n + 8.
    mistakes:
      '31': t8_calendar_diagonal
      '76': t8_calendar_diagonal
  - prompt: Three dates in a row across a calendar add to 51. What is the first date?
    answer: '16'
    check: (51 - 3)/3
    difficulty: 2
    hints:
    - The dates are n, n + 1, n + 2.
    - 3n + 3 = 51.
    solution: 3n + 3 = 51, so 3n = 48 and n = 16. The dates are 16, 17, 18.
    mistakes:
      '17': c8m13_calendar_steps
      '10': t8_three_dates
  - prompt: Find 85 − 58, then divide by 9.
    answer: '3'
    check: (85 - 58)/9
    difficulty: 1
    hints:
    - 85 − 58 = 27.
    - 27 ÷ 9.
    solution: 85 − 58 = 27 = 9 × 3. (Also 8 − 5 = 3.)
    mistakes:
      '27': t8_reverse_9
      '13': c8m13_two_digit
  - prompt: A two-digit number plus its reverse is 132. What is the sum of its digits?
    answer: '12'
    check: 132/11
    difficulty: 3
    hints:
    - Number + reverse = 11(a + b).
    - 132 ÷ 11.
    solution: 11(a + b) = 132, so a + b = 12.
    mistakes:
      '66': t8_reverse_11
      '6': c8m13_two_digit
  - prompt: Why is a two-digit number minus its reverse always a multiple of 9?
    options:
    - (10a + b) − (10b + a) = 9a − 9b = 9(a − b)
    - Because 9 is the largest digit
    - Because the digits are the same
    answer: (10a + b) − (10b + a) = 9a − 9b = 9(a − b)
    difficulty: 2
    hints:
    - Write the number as 10a + b.
    - Subtract 10b + a and collect terms.
    solution: (10a + b) − (10b + a) = 9a − 9b = 9(a − b), which is 9 times a whole number.
    mistakes:
      Because 9 is the largest digit: c8m13_two_digit
      Because the digits are the same: c8m13_two_digit
  - prompt: Four dates in a column on a calendar add to 58. What is the top date?
    answer: '4'
    check: (58 - 42)/4
    difficulty: 3
    hints:
    - They are n, n + 7, n + 14, n + 21.
    - 4n + 42 = 58.
    solution: 4n + 42 = 58, so 4n = 16 and n = 4. The dates are 4, 11, 18, 25.
    mistakes:
      '14.5': t8_three_dates
      '11': t8_calendar_below
  - prompt: In a 2 × 2 calendar square, the top-left date is n. What is the bottom-right date?
    options:
    - n + 8
    - n + 7
    - n + 2
    - n + 14
    answer: n + 8
    difficulty: 1
    hints:
    - Bottom-right is one step down and one step right.
    - +7 and +1.
    solution: One row down is +7 and one step right is +1, so n + 8.
    mistakes:
