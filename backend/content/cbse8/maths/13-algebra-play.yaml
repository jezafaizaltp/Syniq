# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 13 (Part 2 chapter 6). Format: content/README.md.
subject: cbse8-math
chapter: 13
title: Algebra Play
concepts:
- code: cbse8m.alg.tricks
  title: The algebra behind number tricks
  notes: |
    'Think of a number' tricks work because the steps cancel out. Call the number x and follow the steps:
    x → 2x → 2x + 10 → x + 5 → 5, so the answer is always 5. Algebra explains why any starting number works.
    In a number pyramid each block is the sum of the two below it; with bottom blocks a, b, c the top is
    a + 2b + c.
  explanations:
    text: In a 'think of a number' trick, call the secret number x and write each step in algebra. You will see the x cancel out or be easy to undo, which is how the magician 'knows' the answer.
    visual: 'Draw a pyramid: bottom row a, b, c; middle row a + b and b + c; top (a + b) + (b + c) = a + 2b + c. The middle bottom number counts twice.'
    step_by_step: 'Step 1: Let the starting number be x. Step 2: Write each instruction as an expression. Step 3: Simplify after each step. Step 4: See what is left: if x has gone, the answer is the same for everyone.'
    real_world: 'Ask a friend: ''Think of a number, double it, add 8, halve it, take away your number.'' Everyone ends with 4, because (2x + 8) ÷ 2 − x = 4.'
  picture:
    kind: flow
    steps:
    - 'Think of a number: x'
    - 'Double it: 2x'
    - 'Add 10: 2x + 10'
    - 'Halve it: x + 5'
    - 'Take away the number: 5'
    alt: 'A number trick in algebra: x, 2x, 2x + 10, x + 5, and finally 5 whatever x was.'
  items:
  - prompt: Think of a number, double it, add 8, halve it, then subtract the number you thought of. What do you always get?
    answer: '4'
    check: (2*7 + 8)/2 - 7
    difficulty: 1
    hints:
    - x → 2x → 2x + 8.
    - 'Halve: x + 4.'
    solution: (2x + 8) ÷ 2 − x = x + 4 − x = 4.
  - prompt: Think of a number, add 3, multiply by 4, subtract 12, then divide by your number. What do you always get?
    answer: '4'
    check: (4*(5 + 3) - 12)/5
    difficulty: 2
    hints:
    - 4(x + 3) − 12 = 4x.
    - 4x ÷ x.
    solution: 4(x + 3) − 12 = 4x, and 4x ÷ x = 4.
  - prompt: A number pyramid has bottom row 3, 5, 2. What is the top block?
    answer: '15'
    check: 3 + 2*5 + 2
    difficulty: 1
    hints:
    - 'Middle row: 8 and 7.'
    - 'Top: 8 + 7.'
    solution: 3 + 5 = 8, 5 + 2 = 7, top = 15 (= 3 + 2 × 5 + 2).
  - prompt: In a 3-row number pyramid with bottom a, b, c, what is the top?
    options:
    - a + 2b + c
    - a + b + c
    - 2a + b + 2c
    - abc
    answer: a + 2b + c
    difficulty: 2
    hints:
    - 'Middle row: a + b and b + c.'
    - Add them.
    solution: (a + b) + (b + c) = a + 2b + c.
  - prompt: A pyramid has bottom row 4, x, 6 and top 30. Find x.
    answer: '10'
    check: (30 - 10)/2
    difficulty: 3
    hints:
    - Top = 4 + 2x + 6.
    - 2x + 10 = 30.
    solution: 2x + 10 = 30, so x = 10.
  - prompt: Think of a number, multiply by 5, add 15, divide by 5, subtract 3. If you got 9, what number did you think of?
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - 5x + 15 ÷ 5 = x + 3.
    - x + 3 − 3 = x.
    solution: The steps give back x, so the number was 9.
- code: cbse8m.alg.grids
  title: Calendar magic and divisibility tricks
  after:
  - cbse8m.alg.tricks
  notes: |
    On a calendar, if a date is n, the date to its right is n + 1 and the date below is n + 7. In any 2 × 2
    square the diagonal sums are equal (n + (n + 8) = (n + 1) + (n + 7)). The sum of a 3 × 3 block is 9 times
    the middle date. Algebra also explains divisibility tricks: a two-digit number 10a + b plus its reverse
    10b + a is 11(a + b), always a multiple of 11; their difference 9(a − b) is a multiple of 9.
  explanations:
    text: 'Grids like a calendar follow simple rules: one step right adds 1, one step down adds 7. Writing a date as n turns calendar tricks into simple algebra, and it explains why some number tricks always work.'
    visual: Draw a 3 by 3 box on a calendar around the 15th. The numbers are 7, 8, 9, 14, 15, 16, 21, 22, 23; they add to 135 = 9 × 15.
    step_by_step: 'Step 1: Call one cell n. Step 2: Write the others as n plus or minus a number (right +1, down +7). Step 3: Add or compare the expressions. Step 4: Read off the rule.'
    real_world: A magician asks you to box any 3 × 3 square on a calendar and tell them the total. They divide by 9 to name the middle date at once.
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: n
    - size: 1
      label: n + 1
    rows:
    - size: 1
      label: week 1
    - size: 1
      label: week 2
    cells:
    - - n
      - n + 1
    - - n + 7
      - n + 8
    caption: In any 2 × 2 calendar square, n + (n + 8) = (n + 1) + (n + 7).
    alt: A 2 by 2 calendar square with dates n, n plus 1, n plus 7 and n plus 8; both diagonals add to 2n plus 8.
  items:
  - prompt: On a calendar, what is the date directly below the 12th?
    answer: '19'
    check: 12 + 7
    difficulty: 1
    hints:
    - Down one row adds 7.
    - 12 + 7.
    solution: 12 + 7 = 19.
  - prompt: A 3 × 3 calendar block has a total of 108. What is the middle date?
    answer: '12'
    check: 108/9
    difficulty: 2
    hints:
    - The total is 9 times the middle date.
    - 108 ÷ 9.
    solution: 108 ÷ 9 = 12.
  - prompt: A 2 × 2 calendar square has top-left date 10. What is the sum of either diagonal?
    answer: '28'
    check: 10 + 18
    difficulty: 1
    hints:
    - The diagonal is 10 and 18.
    - Or 11 and 17.
    solution: 10 + 18 = 28 = 11 + 17.
  - prompt: Why is a two-digit number plus its reverse always a multiple of 11?
    options:
    - (10a + b) + (10b + a) = 11(a + b)
    - Because 11 is prime
    - Because both have two digits
    - It is only true for even numbers
    answer: (10a + b) + (10b + a) = 11(a + b)
    difficulty: 2
    hints:
    - Write the number as 10a + b.
    - Its reverse is 10b + a.
    solution: Adding gives 11a + 11b = 11(a + b), a multiple of 11.
  - prompt: 72 − 27 is a multiple of 9. What is (72 − 27) ÷ 9?
    answer: '5'
    check: (72 - 27)/9
    difficulty: 2
    hints:
    - The difference is 9(a − b).
    - a − b = 7 − 2.
    solution: 72 − 27 = 45 = 9 × 5.
  - prompt: Three dates one under another on a calendar add to 45. What is the top date?
    answer: '8'
    check: (45 - 21)/3
    difficulty: 3
    hints:
    - The dates are n, n + 7, n + 14.
    - 3n + 21 = 45.
    solution: 3n + 21 = 45, so n = 8 (dates 8, 15, 22).
