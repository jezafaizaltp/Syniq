# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 2. Format: content/README.md.
subject: cbse8-math
chapter: 2
title: Power Play
tips:
  c8_power_not_times: 'The exponent counts how many times you multiply, not what you multiply by: 3⁴ = 3 × 3 × 3 × 3.'
  c8_add_exponents: When multiplying powers of the same base, add the exponents; don't multiply them.
  c8_negative_base: 'Count the minus signs: an odd number of negative factors gives a negative answer.'
concepts:
- code: cbse8m.pow.laws
  title: Powers and the laws of exponents
  notes: |
    aⁿ means a multiplied by itself n times; a is the base and n the exponent. Laws: aᵐ × aⁿ = aᵐ⁺ⁿ;
    aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; (ab)ⁿ = aⁿbⁿ; a⁰ = 1 (a ≠ 0); a⁻ⁿ = 1/aⁿ. Repeatedly doubling (folding
    paper, cells dividing) shows exponential growth: much faster than adding the same amount each time.
  explanations:
    text: 'A power is a short way to write repeated multiplication: 2⁵ = 2 × 2 × 2 × 2 × 2 = 32. When you multiply powers of the same base, you add the exponents, because you are just counting how many times the base appears.'
    visual: 'Fold a sheet of paper in half again and again. Layers: 1, 2, 4, 8, 16 ... After n folds there are 2ⁿ layers. After 10 folds, 1024 layers.'
    step_by_step: 'Step 1: Check the bases are the same. Step 2: Multiplying: add the exponents. Step 3: Dividing: subtract them. Step 4: Power of a power: multiply them. Step 5: Anything (except 0) to the power 0 is 1, and a negative exponent means 1 over the power.'
    real_world: A rumour told to 2 people, who each tell 2 more, reaches 2¹⁰ = 1024 new people in the tenth round. That is exponential growth.
  picture:
    kind: flow
    steps:
    - 2³ × 2⁴
    - = (2 × 2 × 2) × (2 × 2 × 2 × 2)
    - = seven 2s multiplied
    - = 2⁷ = 128
    alt: 'Why we add exponents: 2³ × 2⁴ is three 2s times four 2s, seven 2s in all, so 2⁷.'
  items:
  - prompt: Find 3⁴.
    answer: '81'
    check: 3**4
    difficulty: 1
    hints:
    - 3 × 3 × 3 × 3.
    - 9 × 9.
    solution: 3⁴ = 3 × 3 × 3 × 3 = 81.
    mistakes:
      '12': c8_power_not_times
  - prompt: Write 5³ × 5⁴ as 5 to one power. What is the exponent?
    answer: '7'
    check: 3 + 4
    difficulty: 1
    hints:
    - 'Same base: add the exponents.'
    - 3 + 4.
    solution: 5³ × 5⁴ = 5³⁺⁴ = 5⁷.
    mistakes:
      '12': c8_add_exponents
  - prompt: Simplify 2¹⁰ ÷ 2⁶.
    answer: '16'
    check: 2**10/2**6
    difficulty: 2
    hints:
    - Subtract the exponents.
    - 2⁴.
    solution: 2¹⁰ ÷ 2⁶ = 2⁴ = 16.
  - prompt: Find (−2)⁵.
    answer: '-32'
    check: (-2)**5
    difficulty: 2
    hints:
    - An odd number of negative factors gives a negative answer.
    - 2⁵ = 32.
    solution: (−2)⁵ = −2 × −2 × −2 × −2 × −2 = −32.
    mistakes:
      '32': c8_negative_base
  - prompt: Find 7⁰ + 2⁻¹. Type a fraction or decimal.
    answer: 3/2
    check: 7**0 + Rational(1, 2)
    difficulty: 2
    hints:
    - 7⁰ = 1.
    - 2⁻¹ = 1/2.
    solution: 7⁰ = 1 and 2⁻¹ = 1/2, so the sum is 3/2.
  - prompt: Simplify (3²)³.
    answer: '729'
    check: 3**6
    difficulty: 2
    hints:
    - 'Power of a power: multiply the exponents.'
    - 3⁶.
    solution: (3²)³ = 3⁶ = 729.
  - prompt: A bacterium splits into 2 every hour. Starting with 1, how many are there after 8 hours?
    answer: '256'
    check: 2**8
    difficulty: 2
    hints:
    - After n hours there are 2ⁿ.
    - 2⁸.
    solution: 'After 8 hours: 2⁸ = 256.'
    mistakes:
      '16': c8_power_not_times
- code: cbse8m.pow.ten
  title: Powers of 10 and large numbers
  after:
  - cbse8m.pow.laws
  notes: |
    10ⁿ is 1 followed by n zeros. Large numbers can be written in standard form (scientific notation) as
    a × 10ⁿ with 1 ≤ a < 10: 3,80,000 = 3.8 × 10⁵. Small numbers use negative powers: 0.0004 = 4 × 10⁻⁴.
    Indian names: 1 lakh = 10⁵, 1 crore = 10⁷. Comparing numbers in standard form: compare the powers of 10
    first.
  explanations:
    text: 'Each power of 10 adds one zero: 10³ = 1000, 10⁶ = 1,000,000. Very big numbers are easier to read as a number between 1 and 10 times a power of 10, like 3.8 × 10⁵ for 3,80,000.'
    visual: 'Draw a place-value strip: ones, tens, hundreds, thousands ... Every step left is ×10. The exponent of 10 tells you how many steps the first digit has moved.'
    step_by_step: 'Step 1: Put the decimal point after the first non-zero digit. Step 2: Count how many places it moved. Step 3: Moved left (big number): positive power. Moved right (small number): negative power.'
    real_world: The Sun is about 1.5 × 10⁸ km from the Earth. Light covers about 3 × 10⁵ km each second, so sunlight takes about 500 seconds, a little over 8 minutes, to reach us.
  picture:
    kind: number_line
    from: 0
    to: 7
    points:
    - at: 3
      label: 10³ thousand
    - at: 5
      label: 10⁵ lakh
    - at: 7
      label: 10⁷ crore
    caption: 'The exponent counts the zeros: a thousand has 3, a lakh 5, a crore 7.'
    alt: A number line of exponents 0 to 7 marking 3 as a thousand, 5 as a lakh and 7 as a crore.
  items:
  - prompt: How many zeros does 10⁹ have when written out?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - 10ⁿ is 1 followed by n zeros.
    - n = 9.
    solution: '10⁹ = 1,000,000,000: 9 zeros.'
  - prompt: Which is 4,50,000 in standard form?
    options:
    - 4.5 × 10⁵
    - 45 × 10⁴
    - 4.5 × 10⁴
    - 0.45 × 10⁶
    answer: 4.5 × 10⁵
    difficulty: 2
    hints:
    - The number in front must be between 1 and 10.
    - The point moves 5 places.
    solution: 4,50,000 = 4.5 × 100000 = 4.5 × 10⁵. 45 × 10⁴ is equal but not standard form.
  - prompt: Which is 0.00072 in standard form?
    options:
    - 7.2 × 10⁻⁴
    - 7.2 × 10⁻³
    - 72 × 10⁻⁵
    - 7.2 × 10⁴
    answer: 7.2 × 10⁻⁴
    difficulty: 2
    hints:
    - Move the point right until it is after the 7.
    - '4 places to the right: power −4.'
    solution: '0.00072: the point moves 4 places right to give 7.2, so 7.2 × 10⁻⁴.'
  - prompt: How many lakhs make one crore?
    answer: '100'
    check: 10**7/10**5
    difficulty: 1
    hints:
    - 1 crore = 10⁷ and 1 lakh = 10⁵.
    - 10⁷ ÷ 10⁵.
    solution: 10⁷ ÷ 10⁵ = 10² = 100.
  - prompt: Write 2.5 × 10⁴ as an ordinary number.
    answer: '25000'
    check: Rational(25, 10)*10**4
    difficulty: 1
    hints:
    - 10⁴ = 10000.
    - 2.5 × 10000.
    solution: 2.5 × 10⁴ = 25,000.
  - prompt: Light travels about 3 × 10⁵ km in a second. About how many km is that in 100 seconds? Give the ordinary number.
    answer: '30000000'
    check: 3*10**7
    difficulty: 3
    hints:
    - 100 = 10².
    - 3 × 10⁵ × 10² = 3 × 10⁷.
    solution: 3 × 10⁵ × 10² = 3 × 10⁷ = 3,00,00,000 km.
