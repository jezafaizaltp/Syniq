# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 2. Format: content/README.md.
subject: cbse8-math
chapter: 2
title: Power Play
tips:
  c8_power_not_times: 'The exponent counts how many times you multiply, not what you multiply by: 3⁴ = 3 × 3 × 3 × 3.'
  c8_add_exponents: When multiplying powers of the same base, add the exponents; don't multiply them.
  c8_negative_base: 'Count the minus signs: an odd number of negative factors gives a negative answer.'
  t8_divide_powers: "Dividing powers of the same base: subtract the indices, then work out the power."
  t8_expand_power: "Multiply 2.5 by 10 four times: move the point 4 places to the right, filling with zeros."
  t8_lakh_crore: "1 lakh = 10⁵ and 1 crore = 10⁷. Divide the crore by the lakh."
  t8_multiply_powers_ten: "100 seconds = 10² times as long. Multiply, adding the powers of 10, then write it out."
  t8_power_of_power: "(aᵐ)ⁿ = aᵐˣⁿ: multiply the indices, don't add them. Then work out 3 to that power."
  t8_small_standard: "For small numbers the power is negative. Count how many places the point moves to reach 7.2."
  t8_standard_form: "Standard form is a number from 1 up to (not including) 10, times a power of 10. Count how far the point moves."
  t8_zero_negative_power: "Any number to the power 0 is 1. A power of −1 means 'one over'."
  t8_zeros_count: "10ⁿ is 1 followed by n zeros. Count them."
  c8m2_law: 'Same base: when multiplying, add the exponents; when dividing, subtract; a power of a power, multiply them. Check which of the three the question is.'
  c8m2_shift: Standard form is a number from 1 up to (but not including) 10, times a power of 10. Count how many places the decimal point moves, and in which direction.
concepts:
- code: cbse8m.pow.laws
  title: Powers and the laws of exponents
  notes: |
    aⁿ means a multiplied by itself n times; a is the base and n the exponent. Laws: aᵐ × aⁿ = aᵐ⁺ⁿ;
    aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; (ab)ⁿ = aⁿbⁿ; a⁰ = 1 (a ≠ 0); a⁻ⁿ = 1/aⁿ. Repeatedly doubling (folding
    paper, cells dividing) shows exponential growth: much faster than adding the same amount each time.
  explanations:
    text: 'A power is a short way to write repeated multiplication: 2⁵ = 2 × 2 × 2 × 2 × 2 = 32. When you multiply powers of the same base, you add the exponents, because you are just counting how many times the base appears.'
    visual: 'Fold a sheet of paper in half again and again. Layers: 1, 2, 4, 8, 16 ... After n folds there are 2ⁿ layers. After 10 folds, 1024 layers.'
    step_by_step: 'Step 1: Check the bases are the same. Step 2: Multiplying: add the exponents. Step 3: Dividing: subtract them. Step 4: Power of a power: multiply them. Step 5: Anything (except 0) to the power 0 is 1, and a negative exponent means 1 over the power.'
    real_world: A rumour told to 2 people, who each tell 2 more, reaches 2¹⁰ = 1024 new people in the tenth round. That is exponential growth.
  picture:
    kind: flow
    steps:
    - 2³ × 2⁴
    - = (2 × 2 × 2) × (2 × 2 × 2 × 2)
    - = seven 2s multiplied
    - = 2⁷ = 128
    alt: 'Why we add exponents: 2³ × 2⁴ is three 2s times four 2s, seven 2s in all, so 2⁷.'
  activity:
    type: formula
    prompt: 'Two powers of 2: 2ᵃ and 2ᵇ. Set the exponents a and b.'
    inputs:
    - name: a
      label: Exponent a
      min: 0
      max: 10
      step: 1
      start: 3
    - name: b
      label: Exponent b
      min: 0
      max: 10
      step: 1
      start: 1
    outputs:
    - name: prod
      label: 2ᵃ × 2ᵇ
      expr: 2^a*2^b
    - name: quot
      label: 2ᵃ ÷ 2ᵇ
      expr: 2^a/2^b
      places: 4
    goals:
    - prompt: Make 2² × 2ᵇ = 2⁶ = 64.
      want:
        a: 2
        prod: 64
      mistakes:
      - when:
          a: 2
          b: 3
        say: '2 × 3 = 6, so you multiplied the exponents. 2² × 2³ is five 2s multiplied: 32. Count the 2s: add the exponents.'
      - when:
          a:
          - 3
          - 10
        say: 'a must be 2 here: the first power is 2².'
    - prompt: Make 2⁵ ÷ 2ᵇ = 8.
      want:
        a: 5
        quot: 8
      mistakes:
      - when:
          a: 5
          b: 8
        say: '8 is the answer, not b. Dividing cancels 2s: 2⁵ ÷ 2ᵇ = 2 to the power (5 − b), and 8 = 2³.'
      - when:
          a: 5
          b:
          - 6
          - 10
        say: 'When b is bigger than a, more 2s cancel than you have: the answer drops below 1.'
    - prompt: Make 2ᵃ ÷ 2ᵇ equal exactly 1.
      want:
        quot: 1
      mistakes:
      - when:
          quot:
          - 1.01
          - 1024
        say: 'Still more 2s on top than below. Equal exponents cancel completely: 2⁰ = 1.'
      - when:
          quot:
          - 0.0009
          - 0.99
        say: More 2s below than on top now. Make a and b the same.
  lesson:
    - teach: 'A power is repeated multiplication: 2⁵ = 2 × 2 × 2 × 2 × 2 = 32. The 2 is the base and the 5 is the exponent. 2⁵ is not 2 × 5. Powers grow very fast: folding paper doubles its thickness each time.'
      check:
        prompt: What is 3⁴?
        options:
        - '81'
        - '12'
        - '64'
        answer: '81'
        why: 3 × 3 × 3 × 3 = 81.
    - teach: 'With the same base: multiply → add exponents (aᵐ × aⁿ = aᵐ⁺ⁿ); divide → subtract (aᵐ ÷ aⁿ = aᵐ⁻ⁿ); power of a power → multiply ((aᵐ)ⁿ = aᵐⁿ). Also (ab)ⁿ = aⁿbⁿ.'
      picture:
        kind: compare
        columns:
        - title: Rule
          points:
          - aᵐ × aⁿ
          - aᵐ ÷ aⁿ
          - (aᵐ)ⁿ
        - title: Becomes
          points:
          - aᵐ⁺ⁿ (add)
          - aᵐ⁻ⁿ (subtract)
          - aᵐⁿ (multiply)
        alt: 'Laws of exponents: multiplying powers adds exponents, dividing subtracts them, and a power of a power multiplies them.'
      check:
        prompt: Write 7⁶ ÷ 7² as one power of 7. What is the exponent?
        options:
        - '4'
        - '3'
        - '8'
        answer: '4'
        why: 'Dividing: 6 − 2 = 4.'
    - teach: 'Any non-zero number to the power 0 is 1: a⁰ = 1, because aⁿ ÷ aⁿ = 1. A negative exponent means a reciprocal: a⁻ⁿ = 1/aⁿ, so 2⁻³ = 1/8. A negative base with an odd exponent stays negative: (−3)³ = −27.'
      check:
        prompt: What is 5⁻²?
        options:
        - 1/25
        - −25
        - −10
        answer: 1/25
        why: 5⁻² = 1/5² = 1/25.
  items:
  - prompt: Find 3⁴.
    answer: '81'
    check: 3**4
    difficulty: 1
    hints:
    - 3 × 3 × 3 × 3.
    - 9 × 9.
    solution: 3⁴ = 3 × 3 × 3 × 3 = 81.
    mistakes:
      '12': c8_power_not_times
  - prompt: Write 5³ × 5⁴ as 5 to one power. What is the exponent?
    answer: '7'
    check: 3 + 4
    difficulty: 1
    hints:
    - 'Same base: add the exponents.'
    - 3 + 4.
    solution: 5³ × 5⁴ = 5³⁺⁴ = 5⁷.
    mistakes:
      '12': c8_add_exponents
  - prompt: Simplify 2¹⁰ ÷ 2⁶.
    answer: '16'
    check: 2**10/2**6
    difficulty: 2
    hints:
    - Subtract the exponents.
    - 2⁴.
    solution: 2¹⁰ ÷ 2⁶ = 2⁴ = 16.
    mistakes: {"4": "t8_divide_powers", "64": "t8_divide_powers"}
  - prompt: Find (−2)⁵.
    answer: '-32'
    check: (-2)**5
    difficulty: 2
    hints:
    - An odd number of negative factors gives a negative answer.
    - 2⁵ = 32.
    solution: (−2)⁵ = −2 × −2 × −2 × −2 × −2 = −32.
    mistakes:
      '32': c8_negative_base
  - prompt: Find 7⁰ + 2⁻¹. Type a fraction or decimal.
    answer: 3/2
    check: 7**0 + Rational(1, 2)
    difficulty: 2
    hints:
    - 7⁰ = 1.
    - 2⁻¹ = 1/2.
    solution: 7⁰ = 1 and 2⁻¹ = 1/2, so the sum is 3/2.
    mistakes: {"-2": "t8_zero_negative_power", "1/2": "t8_zero_negative_power"}
  - prompt: Simplify (3²)³.
    answer: '729'
    check: 3**6
    difficulty: 2
    hints:
    - 'Power of a power: multiply the exponents.'
    - 3⁶.
    solution: (3²)³ = 3⁶ = 729.
    mistakes: {"243": "t8_power_of_power", "36": "t8_power_of_power"}
  - prompt: A bacterium splits into 2 every hour. Starting with 1, how many are there after 8 hours?
    answer: '256'
    check: 2**8
    difficulty: 2
    hints:
    - After n hours there are 2ⁿ.
    - 2⁸.
    solution: 'After 8 hours: 2⁸ = 256.'
    mistakes:
      '16': c8_power_not_times
  - prompt: Find 2⁷.
    answer: '128'
    check: 2**7
    difficulty: 1
    hints:
    - Keep doubling from 2.
    - 2, 4, 8, 16, 32, 64, …
    solution: 2⁷ = 128.
    mistakes:
      '14': c8_power_not_times
  - prompt: Write 3² × 3⁵ as one power of 3. What is the exponent?
    answer: '7'
    check: 2+5
    difficulty: 1
    hints:
    - Same base, multiplying.
    - Add the exponents.
    solution: 3² × 3⁵ = 3⁷.
    mistakes:
      '10': c8m2_law
  - prompt: Simplify (2³)⁴. Give the exponent of 2.
    answer: '12'
    check: 3*4
    difficulty: 2
    hints:
    - A power of a power.
    - Multiply the exponents.
    solution: (2³)⁴ = 2¹².
    mistakes:
      '7': c8m2_law
  - prompt: Find (−1)¹⁰¹.
    answer: '-1'
    check: (-1)**101
    difficulty: 2
    hints:
    - −1 times itself flips sign each time.
    - Is 101 odd or even?
    solution: An odd power of −1 is −1.
    mistakes:
      '1': c8_negative_base
  - prompt: Find 2⁻⁴. Type a fraction.
    answer: 1/16
    check: Rational(1,16)
    difficulty: 2
    hints:
    - A negative exponent means 1 over the power.
    - 2⁴ = 16.
    solution: 2⁻⁴ = 1/2⁴ = 1/16.
    mistakes:
      '-8': t8_zero_negative_power
      '-16': t8_zero_negative_power
  - prompt: Simplify (5³ × 5⁴) ÷ 5⁵.
    answer: '25'
    check: 5**2
    difficulty: 2
    hints:
    - Add 3 + 4 first.
    - Then subtract 5.
    solution: 5⁷ ÷ 5⁵ = 5² = 25.
    mistakes:
      '5': c8m2_law
  - prompt: Find 2⁰ + 3⁰ + 4⁰.
    answer: '3'
    check: 2**0+3**0+4**0
    difficulty: 2
    hints:
    - Any non-zero number to the power 0 is 1.
    - Add three ones.
    solution: 1 + 1 + 1 = 3.
    mistakes:
      '0': t8_zero_negative_power
      '9': t8_zero_negative_power
  - prompt: A sheet of paper is folded in half 6 times. How many layers thick is it?
    answer: '64'
    check: 2**6
    difficulty: 2
    hints:
    - Each fold doubles the layers.
    - Start from 1 layer.
    solution: 2⁶ = 64 layers.
    mistakes:
      '12': c8_power_not_times
  - prompt: Simplify 2⁵ × 5⁵.
    answer: '100000'
    check: 10**5
    difficulty: 3
    hints:
    - (ab)ⁿ = aⁿbⁿ, so read it backwards.
    - 2 × 5 = 10.
    solution: 2⁵ × 5⁵ = (2 × 5)⁵ = 10⁵ = 100000.
    mistakes:
      '1000': t8_zeros_count
- code: cbse8m.pow.ten
  title: Powers of 10 and large numbers
  after:
  - cbse8m.pow.laws
  notes: |
    10ⁿ is 1 followed by n zeros. Large numbers can be written in standard form (scientific notation) as
    a × 10ⁿ with 1 ≤ a < 10: 3,80,000 = 3.8 × 10⁵. Small numbers use negative powers: 0.0004 = 4 × 10⁻⁴.
    Indian names: 1 lakh = 10⁵, 1 crore = 10⁷. Comparing numbers in standard form: compare the powers of 10
    first.
  explanations:
    text: 'Each power of 10 adds one zero: 10³ = 1000, 10⁶ = 1,000,000. Very big numbers are easier to read as a number between 1 and 10 times a power of 10, like 3.8 × 10⁵ for 3,80,000.'
    visual: 'Draw a place-value strip: ones, tens, hundreds, thousands ... Every step left is ×10. The exponent of 10 tells you how many steps the first digit has moved.'
    step_by_step: 'Step 1: Put the decimal point after the first non-zero digit. Step 2: Count how many places it moved. Step 3: Moved left (big number): positive power. Moved right (small number): negative power.'
    real_world: The Sun is about 1.5 × 10⁸ km from the Earth. Light covers about 3 × 10⁵ km each second, so sunlight takes about 500 seconds, a little over 8 minutes, to reach us.
  picture:
    kind: number_line
    from: 0
    to: 7
    points:
    - at: 3
      label: 10³ thousand
    - at: 5
      label: 10⁵ lakh
    - at: 7
      label: 10⁷ crore
    caption: 'The exponent counts the zeros: a thousand has 3, a lakh 5, a crore 7.'
    alt: A number line of exponents 0 to 7 marking 3 as a thousand, 5 as a lakh and 7 as a crore.
  activity:
    type: formula
    prompt: Write big numbers as m × 10ᵏ, with m between 1 and 10.
    inputs:
    - name: m
      label: m (1 to 9.9)
      min: 1
      max: 9.9
      step: 0.1
      start: 1
    - name: k
      label: Power k
      min: 0
      max: 12
      step: 1
      start: 0
    outputs:
    - name: val
      label: m × 10ᵏ
      expr: m*10^k
    goals:
    - prompt: Write 3,80,000 (the Moon is about this many km away).
      want:
        m: 3.8
        k: 5
      mistakes:
      - when:
          m: 3.8
          k: 4
        say: '3.8 × 10⁴ = 38,000. Count how many places the point moves: 3,80,000 is 3.8 moved 5 places.'
      - when:
          m: 3.8
          k: 6
        say: 3.8 × 10⁶ = 38,00,000, ten times too big.
    - prompt: Write 15,00,00,000 (km to the Sun).
      want:
        m: 1.5
        k: 8
      mistakes:
      - when:
          m: 1.5
          k: 7
        say: '1.5 × 10⁷ = 1,50,00,000, ten times too small. Count the digits after the first one: 8.'
      - when:
          m: 1.5
          k: 9
        say: 'That''s 1,50,00,00,000: ten times too far.'
    - prompt: Write 70,00,000.
      want:
        m: 7
        k: 6
      mistakes:
      - when:
          m: 7
          k: 7
        say: 10⁷ has seven zeros, but 70,00,000 has only six after the 7.
      - when:
          m: 7
          k: 5
        say: '7,00,000: one zero short.'
  lesson:
    - teach: 'Powers of 10 make big numbers easy: 10³ = 1000, 10⁶ = 1 million, 10⁷ = 1 crore. The exponent tells how many zeros follow the 1. In the Indian system, 1 lakh = 10⁵ and 1 crore = 10⁷.'
      check:
        prompt: How many zeros are in 1 crore written out?
        options:
        - '7'
        - '5'
        - '6'
        answer: '7'
        why: 1 crore = 10⁷ = 1,00,00,000.
    - teach: 'Standard form (scientific notation) writes a number as a × 10ⁿ, where 1 ≤ a < 10. For a big number, move the decimal point left and count the moves: 3,40,000 = 3.4 × 10⁵. For a small number, move it right and the exponent is negative: 0.0056 = 5.6 × 10⁻³.'
      picture:
        kind: flow
        steps:
        - Place point after first non-zero digit
        - Count how far it moved
        - Left = positive power
        - Right = negative power
        alt: 'Steps for standard form: place the decimal point after the first non-zero digit, count the moves, moving left gives a positive power of ten, moving right a negative one.'
      check:
        prompt: Which is 72,000 in standard form?
        options:
        - 7.2 × 10⁴
        - 72 × 10³
        - 7.2 × 10³
        answer: 7.2 × 10⁴
        why: The point moves 4 places, and 7.2 is between 1 and 10.
    - teach: 'Standard form helps compare and estimate. The Sun is about 1.5 × 10⁸ km from Earth; a human hair is about 1 × 10⁻⁴ m thick. To multiply, multiply the front numbers and add the powers: (2 × 10³) × (4 × 10²) = 8 × 10⁵.'
      check:
        prompt: Find (3 × 10²) × (2 × 10⁴).
        options:
        - 6 × 10⁶
        - 5 × 10⁶
        - 6 × 10⁸
        answer: 6 × 10⁶
        why: 3 × 2 = 6, and 2 + 4 = 6.
  items:
  - prompt: How many zeros does 10⁹ have when written out?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - 10ⁿ is 1 followed by n zeros.
    - n = 9.
    solution: '10⁹ = 1,000,000,000: 9 zeros.'
    mistakes: {"10": "t8_zeros_count", "8": "t8_zeros_count"}
  - prompt: Which is 4,50,000 in standard form?
    options:
    - 4.5 × 10⁵
    - 45 × 10⁴
    - 4.5 × 10⁴
    - 0.45 × 10⁶
    answer: 4.5 × 10⁵
    difficulty: 2
    hints:
    - The number in front must be between 1 and 10.
    - The point moves 5 places.
    solution: 4,50,000 = 4.5 × 100000 = 4.5 × 10⁵. 45 × 10⁴ is equal but not standard form.
    mistakes: {"45 × 10⁴": "t8_standard_form", "4.5 × 10⁴": "t8_standard_form"}
  - prompt: Which is 0.00072 in standard form?
    options:
    - 7.2 × 10⁻⁴
    - 7.2 × 10⁻³
    - 72 × 10⁻⁵
    - 7.2 × 10⁴
    answer: 7.2 × 10⁻⁴
    difficulty: 2
    hints:
    - Move the point right until it is after the 7.
    - '4 places to the right: power −4.'
    solution: '0.00072: the point moves 4 places right to give 7.2, so 7.2 × 10⁻⁴.'
    mistakes: {"7.2 × 10⁻³": "t8_small_standard", "7.2 × 10⁴": "t8_small_standard"}
  - prompt: How many lakhs make one crore?
    answer: '100'
    check: 10**7/10**5
    difficulty: 1
    hints:
    - 1 crore = 10⁷ and 1 lakh = 10⁵.
    - 10⁷ ÷ 10⁵.
    solution: 10⁷ ÷ 10⁵ = 10² = 100.
    mistakes: {"10": "t8_lakh_crore", "1000": "t8_lakh_crore"}
  - prompt: Write 2.5 × 10⁴ as an ordinary number.
    answer: '25000'
    check: Rational(25, 10)*10**4
    difficulty: 1
    hints:
    - 10⁴ = 10000.
    - 2.5 × 10000.
    solution: 2.5 × 10⁴ = 25,000.
    mistakes: {"2500": "t8_expand_power", "250000": "t8_expand_power"}
  - prompt: Light travels about 3 × 10⁵ km in a second. About how many km is that in 100 seconds? Give the ordinary number.
    answer: '30000000'
    check: 3*10**7
    difficulty: 3
    hints:
    - 100 = 10².
    - 3 × 10⁵ × 10² = 3 × 10⁷.
    solution: 3 × 10⁵ × 10² = 3 × 10⁷ = 3,00,00,000 km.
    mistakes: {"300000": "t8_multiply_powers_ten", "3000000": "t8_multiply_powers_ten"}
  - prompt: Write 10⁴ as an ordinary number.
    answer: '10000'
    check: 10**4
    difficulty: 1
    hints:
    - The exponent counts the zeros.
    - 1 followed by 4 zeros.
    solution: 10⁴ = 10000.
    mistakes:
      '40': c8_power_not_times
  - prompt: Which is 6,30,00,000 in standard form?
    options:
    - 6.3 × 10⁷
    - 6.3 × 10⁶
    - 63 × 10⁶
    - 6.3 × 10⁸
    answer: 6.3 × 10⁷
    difficulty: 2
    hints:
    - Count the digits after the 6.
    - There are 7 of them.
    solution: 6,30,00,000 = 6.3 × 10⁷.
    mistakes:
      6.3 × 10⁶: c8m2_shift
      63 × 10⁶: t8_standard_form
  - prompt: Which is 0.0045 in standard form?
    options:
    - 4.5 × 10⁻³
    - 4.5 × 10³
    - 45 × 10⁻⁴
    - 4.5 × 10⁻²
    answer: 4.5 × 10⁻³
    difficulty: 2
    hints:
    - Move the point right until one non-zero digit is in front.
    - Small numbers have negative powers.
    solution: 0.0045 = 4.5 × 10⁻³ (point moved 3 places right).
    mistakes:
      4.5 × 10³: t8_small_standard
      4.5 × 10⁻²: c8m2_shift
  - prompt: Write 3.07 × 10⁵ as an ordinary number.
    answer: '307000'
    check: Rational(307,100)*10**5
    difficulty: 2
    hints:
    - Move the point 5 places right.
    - Fill empty places with zeros.
    solution: 3.07 × 10⁵ = 307000.
    mistakes:
      '30700': c8m2_shift
  - prompt: How many thousands make one million?
    answer: '1000'
    check: 10**6/10**3
    difficulty: 2
    hints:
    - 1 million = 10⁶.
    - 1 thousand = 10³.
    solution: 10⁶ ÷ 10³ = 10³ = 1000.
    mistakes:
      '100': t8_lakh_crore
  - prompt: Find (2 × 10⁵) × (3 × 10³). Give the answer as an ordinary number.
    answer: '600000000'
    check: 6*10**8
    difficulty: 3
    hints:
    - Multiply 2 × 3.
    - 'Add the powers: 5 + 3.'
    solution: 6 × 10⁸ = 600000000.
    mistakes:
      '6000000': t8_multiply_powers_ten
  - prompt: How many crores make 10⁹?
    answer: '100'
    check: 10**9/10**7
    difficulty: 3
    hints:
    - 1 crore = 10⁷.
    - Divide the powers.
    solution: 10⁹ ÷ 10⁷ = 10² = 100 crore.
    mistakes:
      '2': t8_lakh_crore
  - prompt: 'Which number is larger: 4 × 10⁶ or 9 × 10⁵?'
    options:
    - 4 × 10⁶
    - 9 × 10⁵
    - They are equal
    - Cannot tell
    answer: 4 × 10⁶
    difficulty: 2
    hints:
    - Compare the powers of 10 first.
    - 10⁶ is ten times 10⁵.
    solution: 4 × 10⁶ = 40 lakh; 9 × 10⁵ = 9 lakh.
    mistakes:
      9 × 10⁵: c8m2_shift
  - prompt: A hair is about 0.00008 m thick. Write this in standard form; what is the exponent of 10?
    answer: '-5'
    check: '-5'
    difficulty: 3
    hints:
    - Move the point right to get 8.
    - Count the moves; the power is negative.
    solution: 0.00008 = 8 × 10⁻⁵.
    mistakes:
      '5': t8_small_standard
      '-4': c8m2_shift
