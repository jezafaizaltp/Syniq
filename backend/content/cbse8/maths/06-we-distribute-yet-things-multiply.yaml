# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 6. Format: content/README.md.
subject: cbse8-math
chapter: 6
title: We Distribute, Yet Things Multiply
tips:
  c8_minus_part: '99 is 100 − 1, so take away 46, don''t add it: 100 × 46 − 46.'
  c8_distribute_all: Multiply the number outside by every term inside the bracket, the number term too.
  c8_middle_term: That is the number term. The x terms are 5x and 3x; add them for the coefficient of x.
  c8_forgot_2ab: 'Don''t forget the middle term: (a + b)² = a² + 2ab + b², and (a − b)² = a² − 2ab + b².'
  t8_diff_squares: "(a − b)(a + b) = a² − b². Square each number, then subtract."
  t8_distribute: "35 × 102 = 35 × 100 + 35 × 2. Multiply each part, then add."
  t8_distribute_minus: "8 × (50 − 1) means 8 × 50 minus 8 × 1. The 8 multiplies BOTH parts."
  t8_wrong_identity: "Test each with a = 1, b = 1. Which one gives the wrong value?"
  c8m6_split: Split the awkward number into a round number plus or minus a small one, multiply each part, then combine.
  c8m6_four_parts: 'Two brackets give four products: each term in the first times each term in the second.'
  c8m6_sign: A minus times a plus gives a minus; a minus times a minus gives a plus. Check the sign of each product.
  c8m6_near_square: Write both numbers as one middle number plus and minus the same amount.
  c8m6_square_split: Split the number into a round number and a small part, then use the square of a sum or a difference.
concepts:
- code: cbse8m.dist.property
  title: The distributive property for quick multiplying
  notes: |
    a(b + c) = ab + ac and a(b − c) = ab − ac. It lets you break numbers apart to multiply mentally:
    23 × 101 = 23 × 100 + 23 × 1 = 2323; 49 × 6 = 50 × 6 − 1 × 6 = 294. For two brackets,
    (a + b)(c + d) = ac + ad + bc + bd: every term multiplies every term, as the four parts of a rectangle.
  explanations:
    text: 'Multiplying a sum is the same as multiplying each part and adding: 7 × 12 = 7 × 10 + 7 × 2 = 84. Split awkward numbers into friendly ones like 100 or 50, then put the pieces back together.'
    visual: Draw a rectangle 7 wide and 12 long, and cut it into a 7 by 10 piece and a 7 by 2 piece. The areas 70 and 14 add to the whole, 84.
    step_by_step: 'Step 1: Split one number into easy parts (a round number plus or minus a little). Step 2: Multiply each part by the other number. Step 3: Add (or subtract) the results.'
    real_world: A shopkeeper selling 98 notebooks at ₹25 thinks 100 × 25 − 2 × 25 = 2500 − 50 = ₹2450.
  picture:
    kind: area_grid
    cols:
    - size: 10
      label: '10'
    - size: 2
      label: '2'
    rows:
    - size: 7
      label: '7'
    cells:
    - - 7 × 10 = 70
      - 7 × 2 = 14
    caption: 7 × 12 = 7 × 10 + 7 × 2 = 70 + 14 = 84.
    alt: A rectangle 7 by 12 split into a 7 by 10 part of area 70 and a 7 by 2 part of area 14, together 84.
  activity:
    type: formula
    prompt: 'Multiply a sum: a × (b + c). Set a, b and c.'
    inputs:
    - name: a
      label: a
      min: 0
      max: 20
      step: 1
      start: 1
    - name: b
      label: b
      min: 0
      max: 100
      step: 1
      start: 1
    - name: c
      label: c
      min: -10
      max: 10
      step: 1
      start: 0
    outputs:
    - name: lhs
      label: a × (b + c)
      expr: a*(b+c)
    - name: split
      label: a × b + a × c
      expr: a*b+a*c
    - name: wrong
      label: a × b + c
      expr: a*b+c
    goals:
    - prompt: Make a × (10 + c) = 84.
      want:
        b: 10
        lhs: 84
      mistakes:
      - when:
          b: 10
          wrong: 84
        say: a × 10 + c = 84 multiplies only the 10. The a multiplies every part, so look at a × (b + c).
    - prompt: Work out 9 × 98 as 9 × (100 − 2).
      want:
        a: 9
        b: 100
        c: -2
      mistakes:
      - when:
          a: 9
          b: 100
          c: 2
        say: That's 9 × 102. 98 is 2 less than 100, so c is −2.
      - when:
          a: 9
          b: 98
        say: That's right but slow. Use the friendly 100 and take a little off.
    - prompt: Work out 7 × 105 as 7 × (100 + 5).
      want:
        a: 7
        b: 100
        c: 5
      mistakes:
      - when:
          a: 7
          b: 100
          c: -5
        say: That's 7 × 95. 105 is 5 more than 100.
  lesson:
    - teach: 'The distributive property says a(b + c) = ab + ac and a(b − c) = ab − ac. Picture a rectangle a wide and (b + c) long: it splits into two smaller rectangles, ab and ac. The number outside multiplies every term inside.'
      picture:
        kind: area_grid
        cols:
        - size: 3
          label: b
        - size: 2
          label: c
        rows:
        - size: 2
          label: a
        cells:
        - - a × b
          - a × c
        alt: A rectangle of width a and length b plus c splits into two parts, a times b and a times c.
      check:
        prompt: Expand 4(x + 3).
        options:
        - 4x + 12
        - 4x + 3
        - x + 12
        answer: 4x + 12
        why: 'The 4 multiplies both terms: 4 × x and 4 × 3 = 12.'
    - teach: It makes mental sums easy. Split one number into a round number and a small part. 47 × 101 = 47 × 100 + 47 × 1 = 4747. 25 × 98 = 25 × 100 − 25 × 2 = 2450.
      picture:
        kind: flow
        steps:
        - 25 × 98
        - = 25 × (100 − 2)
        - = 2500 − 50
        - = 2450
        alt: 25 times 98 becomes 25 times 100 minus 25 times 2, which is 2500 minus 50, or 2450.
      check:
        prompt: Work out 12 × 99 as 12 × 100 − 12.
        options:
        - '1188'
        - '1212'
        - '1200'
        answer: '1188'
        why: 1200 − 12 = 1188.
    - teach: 'Two brackets: (a + b)(c + d) = ac + ad + bc + bd. Every term in the first bracket multiplies every term in the second, like the four parts of a rectangle split both ways. Then collect like terms: (x + 2)(x + 3) = x² + 3x + 2x + 6 = x² + 5x + 6.'
      picture:
        kind: area_grid
        cols:
        - size: 4
          label: x
        - size: 3
          label: '3'
        rows:
        - size: 4
          label: x
        - size: 2
          label: '2'
        cells:
        - - x²
          - 3x
        - - 2x
          - '6'
        alt: 'A rectangle x plus 2 by x plus 3 splits into four parts: x squared, 3x, 2x and 6.'
      check:
        prompt: In (x + 4)(x + 1), what is the number term?
        options:
        - '4'
        - '5'
        - '1'
        answer: '4'
        why: The number term is 4 × 1 = 4.
  items:
  - prompt: 'Use the distributive property: 35 × 102.'
    answer: '3570'
    check: 35*102
    difficulty: 1
    hints:
    - 35 × 100 + 35 × 2.
    - 3500 + 70.
    solution: 35 × 102 = 3500 + 70 = 3570.
    mistakes: {"3502": "t8_distribute", "3570.2": "t8_distribute"}
  - prompt: Work out 99 × 46 as 100 × 46 − 46.
    answer: '4554'
    check: 99*46
    difficulty: 2
    hints:
    - 100 × 46 = 4600.
    - 4600 − 46.
    solution: 4600 − 46 = 4554.
    mistakes:
      '4646': c8_minus_part
  - prompt: Expand 6(x + 4). What is the number term?
    answer: '24'
    check: 6*4
    difficulty: 1
    hints:
    - Multiply 6 by each term.
    - 6 × 4.
    solution: 6(x + 4) = 6x + 24, so the number term is 24.
    mistakes:
      '4': c8_distribute_all
  - prompt: Find 13 × 17 using (15 − 2)(15 + 2).
    answer: '221'
    check: 13*17
    difficulty: 3
    hints:
    - (a − b)(a + b) = a² − b².
    - 225 − 4.
    solution: 15² − 2² = 225 − 4 = 221.
    mistakes: {"229": "t8_diff_squares", "225": "t8_diff_squares"}
  - prompt: Which is equal to 8 × 49?
    options:
    - 8 × 50 − 8
    - 8 × 50 − 1
    - 8 × 40 + 9
    - 8 × 50 + 8
    answer: 8 × 50 − 8
    difficulty: 2
    hints:
    - 49 = 50 − 1.
    - 8 × (50 − 1).
    solution: 8 × 49 = 8 × (50 − 1) = 8 × 50 − 8 × 1 = 392.
    mistakes: {"8 × 50 − 1": "t8_distribute_minus", "8 × 50 + 8": "t8_distribute_minus"}
  - prompt: Expand (x + 3)(x + 5). What is the coefficient of x?
    answer: '8'
    check: 3 + 5
    difficulty: 2
    hints:
    - Multiply every term by every term.
    - 5x + 3x.
    solution: (x + 3)(x + 5) = x² + 5x + 3x + 15 = x² + 8x + 15.
    mistakes:
      '15': c8_middle_term
  - prompt: 'Use the distributive property: 56 × 101.'
    answer: '5656'
    check: 56*100 + 56
    difficulty: 1
    hints:
    - 101 = 100 + 1.
    - 56 × 100 + 56 × 1.
    solution: 'Step 1: 56 × 100 = 5600. Step 2: 56 × 1 = 56. Step 3: 5600 + 56 = 5656.'
    mistakes:
      '5600': c8m6_split
      '5601': c8_distribute_all
  - prompt: Work out 98 × 15 using 100 × 15 − 2 × 15.
    answer: '1470'
    check: 98*15
    difficulty: 1
    hints:
    - 100 × 15 = 1500.
    - Take away 2 × 15 = 30.
    solution: 'Step 1: 1500. Step 2: 2 × 15 = 30. Step 3: 1500 − 30 = 1470.'
    mistakes:
      '1530': c8_minus_part
      '1498': c8m6_split
  - prompt: Expand 7(2x − 5). What is the number term? Type it with its sign.
    answer: '-35'
    check: -7*5
    difficulty: 2
    hints:
    - 7 multiplies both 2x and −5.
    - 7 × (−5).
    solution: 7(2x − 5) = 14x − 35. The number term is −35.
    mistakes:
      '-5': c8_distribute_all
      '35': c8m6_sign
  - prompt: Expand (x + 7)(x + 2). What is the coefficient of x?
    answer: '9'
    check: 7 + 2
    difficulty: 1
    hints:
    - The x terms are 2x and 7x.
    - Add them.
    solution: (x + 7)(x + 2) = x² + 2x + 7x + 14 = x² + 9x + 14. The coefficient of x is 9.
    mistakes:
      '14': c8_middle_term
  - prompt: Expand (x + 5)(x − 3). What is the number term? Type it with its sign.
    answer: '-15'
    check: 5*(-3)
    difficulty: 2
    hints:
    - The number term is 5 × (−3).
    - A plus times a minus is a minus.
    solution: (x + 5)(x − 3) = x² − 3x + 5x − 15 = x² + 2x − 15. The number term is −15.
    mistakes:
      '15': c8m6_sign
      '2': c8_middle_term
  - prompt: Expand (2x + 1)(x + 4).
    options:
    - 2x² + 9x + 4
    - 2x² + 5x + 4
    - 2x² + 8x + 4
    - 3x + 5
    answer: 2x² + 9x + 4
    check: expand((2*x + 1)*(x + 4))
    difficulty: 3
    hints:
    - 'Four products: 2x × x, 2x × 4, 1 × x, 1 × 4.'
    - 8x + x = 9x.
    solution: 'Step 1: 2x × x = 2x². Step 2: 2x × 4 = 8x. Step 3: 1 × x = x. Step 4: 1 × 4 = 4. Step 5: 2x² + 9x + 4.'
    mistakes:
      2x² + 5x + 4: c8m6_four_parts
      2x² + 8x + 4: c8m6_four_parts
      3x + 5: c8m6_four_parts
  - prompt: Find 21 × 19 using (20 + 1)(20 − 1).
    answer: '399'
    check: 20**2 - 1
    difficulty: 2
    hints:
    - (a + b)(a − b) = a² − b².
    - 20² − 1².
    solution: 'Step 1: 20² = 400. Step 2: 1² = 1. Step 3: 400 − 1 = 399.'
    mistakes:
      '401': t8_diff_squares
      '400': t8_diff_squares
  - prompt: Which is equal to 6 × 203?
    options:
    - 6 × 200 + 6 × 3
    - 6 × 200 + 3
    - 6 × 2 + 6 × 3
    - 600 + 18
    answer: 6 × 200 + 6 × 3
    difficulty: 1
    hints:
    - 203 = 200 + 3.
    - The 6 multiplies both parts.
    solution: 6 × (200 + 3) = 6 × 200 + 6 × 3 = 1200 + 18 = 1218.
    mistakes:
      6 × 200 + 3: c8_distribute_all
      6 × 2 + 6 × 3: c8m6_split
      600 + 18: c8m6_split
  - prompt: Simplify 3(x + 4) + 2(x − 1). What is the number term?
    answer: '10'
    check: 3*4 + 2*(-1)
    difficulty: 2
    hints:
    - Expand each bracket first.
    - 3x + 12 + 2x − 2.
    solution: 'Step 1: 3(x + 4) = 3x + 12. Step 2: 2(x − 1) = 2x − 2. Step 3: 5x + 10. The number term is 10.'
    mistakes:
      '14': c8m6_sign
      '3': c8_distribute_all
- code: cbse8m.dist.identities
  title: Squares of sums and differences
  after:
  - cbse8m.dist.property
  notes: |
    Special cases of the distributive property: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²;
    (a + b)(a − b) = a² − b². They speed up arithmetic: 103² = 100² + 2 × 100 × 3 + 3² = 10609;
    52 × 48 = 50² − 2² = 2496. A common mistake is (a + b)² = a² + b², which leaves out 2ab.
  explanations:
    text: '(a + b)² is not just a² + b². Draw a square of side a + b: it holds an a by a square, a b by b square and two a by b rectangles. That gives a² + 2ab + b².'
    visual: Draw a big square with side split into a and b on both edges. Shade the a² square in one corner and the b² square in the opposite corner; the two leftover rectangles are each ab.
    step_by_step: 'Step 1: Spot the pattern: a sum squared, a difference squared, or a sum times a difference. Step 2: Name a and b. Step 3: Use the matching identity. Step 4: Simplify.'
    real_world: To find 21², think (20 + 1)² = 400 + 40 + 1 = 441. Mental-maths champions use these identities all the time.
  picture:
    kind: area_grid
    cols:
    - size: 3
      label: a
    - size: 1
      label: b
    rows:
    - size: 3
      label: a
    - size: 1
      label: b
    cells:
    - - a²
      - ab
    - - ab
      - b²
    caption: '(a + b)² = a² + 2ab + b²: the square has two ab rectangles, not none.'
    alt: A square of side a plus b split into an a-squared square, a b-squared square and two ab rectangles.
  activity:
    type: formula
    prompt: A square of side a + b. Compare its area with a² + b².
    inputs:
    - name: a
      label: a
      min: 0
      max: 20
      step: 1
      start: 1
    - name: b
      label: b
      min: 0
      max: 20
      step: 1
      start: 1
    outputs:
    - name: sum2
      label: (a + b)²
      expr: (a+b)^2
    - name: sq
      label: a² + b²
      expr: a^2+b^2
    - name: gap
      label: Difference (the two a × b pieces)
      expr: (a+b)^2-a^2-b^2
    - name: diff2
      label: (a − b)²
      expr: (a-b)^2
    goals:
    - prompt: Make (a + b)² exactly 100 more than a² + b².
      want:
        gap: 100
      mistakes:
      - when:
          gap: 0
        say: 'No gap: with a or b at 0, the two a × b rectangles vanish. The gap is always 2ab.'
      - when:
          gap:
          - 102
          - 800
        say: 'Too much: the gap is 2 × a × b. Make a × b = 50.'
    - prompt: Make (7 + b)² = 144.
      want:
        a: 7
        sum2: 144
      mistakes:
      - when:
          a: 7
          b:
          - 6
          - 20
        say: Too big. 144 = 12 × 12, so 7 + b must be 12.
      - when:
          a: 7
          sq:
          - 140
          - 150
        say: 'a² + b² isn''t (a + b)²: it misses the two a × b pieces.'
    - prompt: Make (10 − b)² = 49.
      want:
        a: 10
        diff2: 49
      mistakes:
      - when:
          a: 10
          b: 7
        say: 10 − 7 = 3, and 3² = 9. You need 10 − b = 7.
  lesson:
    - teach: (a + b)² means (a + b)(a + b). Multiplying out gives a² + ab + ba + b² = a² + 2ab + b². In a square of side a + b, there is an a² square, a b² square and two ab rectangles. Leaving out 2ab is the most common slip.
      picture:
        kind: area_grid
        cols:
        - size: 4
          label: a
        - size: 2
          label: b
        rows:
        - size: 4
          label: a
        - size: 2
          label: b
        cells:
        - - a²
          - ab
        - - ab
          - b²
        alt: A square of side a plus b splits into a squared, two rectangles a times b, and b squared.
      check:
        prompt: Expand (x + 3)².
        options:
        - x² + 6x + 9
        - x² + 9
        - x² + 3x + 9
        answer: x² + 6x + 9
        why: 'a² + 2ab + b² with a = x, b = 3: x² + 2 × 3 × x + 9 = x² + 6x + 9.'
    - teach: '(a − b)² = a² − 2ab + b², and (a + b)(a − b) = a² − b² (the middle terms cancel). These speed up arithmetic: 99² = (100 − 1)² = 10000 − 200 + 1 = 9801, and 102 × 98 = 100² − 2² = 9996.'
      picture:
        kind: compare
        columns:
        - title: Identity
          points:
          - (a + b)²
          - (a − b)²
          - (a + b)(a − b)
        - title: Becomes
          points:
          - a² + 2ab + b²
          - a² − 2ab + b²
          - a² − b²
        alt: 'Three identities: a plus b squared, a minus b squared, and a plus b times a minus b.'
      check:
        prompt: Use (a + b)(a − b) = a² − b² to find 31 × 29.
        options:
        - '899'
        - '900'
        - '901'
        answer: '899'
        why: 31 × 29 = (30 + 1)(30 − 1) = 900 − 1 = 899.
    - teach: 'To pick the right identity, look at the numbers. Close above a round number: use (a + b)². Close below: use (a − b)². Two numbers the same distance either side of a round number: use a² − b².'
      check:
        prompt: Which identity is quickest for 48 × 52?
        options:
        - (a + b)(a − b) = a² − b²
        - (a + b)² = a² + 2ab + b²
        - (a − b)² = a² − 2ab + b²
        answer: (a + b)(a − b) = a² − b²
        why: 48 and 52 are 2 either side of 50, so 48 × 52 = 50² − 2².
  items:
  - prompt: Use (a + b)² to find 101².
    answer: '10201'
    check: 101**2
    difficulty: 1
    hints:
    - (100 + 1)².
    - 10000 + 200 + 1.
    solution: 100² + 2 × 100 × 1 + 1² = 10201.
    mistakes:
      '10001': c8_forgot_2ab
  - prompt: Use (a − b)² to find 98².
    answer: '9604'
    check: 98**2
    difficulty: 2
    hints:
    - (100 − 2)².
    - 10000 − 400 + 4.
    solution: 100² − 2 × 100 × 2 + 2² = 10000 − 400 + 4 = 9604.
    mistakes:
      '9996': c8_forgot_2ab
  - prompt: Use a² − b² to find 53 × 47.
    answer: '2491'
    check: 53*47
    difficulty: 2
    hints:
    - (50 + 3)(50 − 3).
    - 2500 − 9.
    solution: 50² − 3² = 2500 − 9 = 2491.
    mistakes: {"2509": "t8_diff_squares", "2500": "t8_diff_squares"}
  - prompt: Expand (x + 6)². What is the coefficient of x?
    answer: '12'
    check: 2*6
    difficulty: 2
    hints:
    - 2ab with a = x, b = 6.
    - 2 × 6.
    solution: (x + 6)² = x² + 12x + 36.
    mistakes:
      '6': c8_forgot_2ab
  - prompt: Which is a common mistake?
    options:
    - (a + b)² = a² + b²
    - (a + b)² = a² + 2ab + b²
    - (a + b)(a − b) = a² − b²
    - (a − b)² = a² − 2ab + b²
    answer: (a + b)² = a² + b²
    difficulty: 1
    hints:
    - Try a = 1, b = 1.
    - (1 + 1)² = 4, but 1² + 1² = 2.
    solution: '(a + b)² = a² + b² leaves out 2ab: with a = b = 1 it gives 2 instead of 4.'
    mistakes: {"(a + b)² = a² + 2ab + b²": "t8_wrong_identity", "(a + b)(a − b) = a² − b²": "t8_wrong_identity"}
  - prompt: Find 199² − 1.
    answer: '39600'
    check: 199**2 - 1
    difficulty: 3
    hints:
    - a² − b² with a = 199, b = 1.
    - (199 − 1)(199 + 1) = 198 × 200.
    solution: 199² − 1² = 198 × 200 = 39600.
    mistakes: {"39601": "t8_diff_squares", "39800": "t8_diff_squares"}
  - prompt: Use (a + b)² to find 102².
    answer: '10404'
    check: 102**2
    difficulty: 1
    hints:
    - 102 = 100 + 2.
    - 100² + 2 × 100 × 2 + 2².
    solution: 'Step 1: 100² = 10000. Step 2: 2 × 100 × 2 = 400. Step 3: 2² = 4. Step 4: 10000 + 400 + 4 = 10404.'
    mistakes:
      '10004': c8_forgot_2ab
      '10204': c8_forgot_2ab
  - prompt: Use (a − b)² to find 99².
    answer: '9801'
    check: 99**2
    difficulty: 1
    hints:
    - 99 = 100 − 1.
    - 100² − 2 × 100 × 1 + 1².
    solution: 'Step 1: 10000. Step 2: minus 200. Step 3: plus 1. Step 4: 9801.'
    mistakes:
      '9999': c8_forgot_2ab
      '10001': c8_forgot_2ab
      '9799': c8m6_sign
  - prompt: Use a² − b² to find 63 × 57.
    answer: '3591'
    check: 63*57
    difficulty: 2
    hints:
    - 63 and 57 are 3 either side of 60.
    - 60² − 3².
    solution: 'Step 1: 63 × 57 = (60 + 3)(60 − 3). Step 2: 3600 − 9 = 3591.'
    mistakes:
      '3609': t8_diff_squares
      '3600': c8m6_near_square
  - prompt: Expand (x − 4)². What is the coefficient of x? Type it with its sign.
    answer: '-8'
    check: -2*4
    difficulty: 2
    hints:
    - (a − b)² = a² − 2ab + b².
    - −2 × x × 4.
    solution: (x − 4)² = x² − 8x + 16. The coefficient of x is −8.
    mistakes:
      '-4': c8_forgot_2ab
      '8': c8m6_sign
  - prompt: Expand (2x + 5)².
    options:
    - 4x² + 20x + 25
    - 4x² + 25
    - 2x² + 10x + 25
    - 4x² + 10x + 25
    answer: 4x² + 20x + 25
    check: expand((2*x + 5)**2)
    difficulty: 3
    hints:
    - a = 2x and b = 5.
    - a² = 4x², 2ab = 2 × 2x × 5.
    solution: 'Step 1: (2x)² = 4x². Step 2: 2 × 2x × 5 = 20x. Step 3: 5² = 25. So 4x² + 20x + 25.'
