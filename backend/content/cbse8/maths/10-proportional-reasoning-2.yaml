# CBSE Class 8 Mathematics (NCERT Ganita Prakash Part 2, 2025), chapter 10 (Part 2 chapter 3). Format: content/README.md.
subject: cbse8-math
chapter: 10
title: Proportional Reasoning-2
tips:
  c8_inverse_not_direct: More workers or more speed means less time here, so divide the fixed product instead of scaling up.
  t8_angle_fraction: "Fraction = angle ÷ 360°. Simplify."
  t8_inverse: "In inverse proportion, when one goes up the other goes down so the product stays the same."
  t8_inverse_calc: "More children, so fewer days. Find the total 'child-days' first, then divide."
  t8_inverse_triple: "x × y must stay fixed. If x is 3 times bigger, what must happen to y?"
  t8_km_to_cm: "Convert 50 km to cm: 1 km = 1000 m and 1 m = 100 cm."
  t8_map_scale: "1 : 1,00,000 means 1 cm stands for 1,00,000 cm. How many km is that?"
  t8_mix_parts: "Total parts = 1 + 2 + 4. Find one part, then sand is 2 parts."
  t8_pie_angle: "Angle = fraction of the total × 360°."
  t8_taps_inverse: "Fewer hours needs more taps. Find total tap-hours, then divide by the new hours."
  t8_three_part_share: "Add the parts (2 + 3 + 4), find one part, then take the largest number of parts."
  c8m10_scale_units: 'Multiply the map distance by the scale''s second number, then change cm into km: 1 km = 1,00,000 cm.'
  c8m10_scale_back: Change the real distance into cm first, then divide by the scale's second number.
  c8m10_pie_total: A full circle is 360°. Each slice's angle = its part ÷ the whole × 360°.
  c8m10_product_fixed: In inverse proportion the product stays the same. Find the product first, then divide.
  c8m10_direct_or_inverse: 'Ask: when one goes up, does the other go up too (direct) or down (inverse)?'
  c8m10_parts_three: Add all three ratio numbers to get the total parts, find one part, then multiply.
concepts:
- code: cbse8m.prop2.maps
  title: Map scales and ratios with three terms
  notes: |
    A map scale such as 1 : 50,000 means 1 cm on the map is 50,000 cm (0.5 km) on the ground. Ratios can
    have more than two terms, like cement : sand : gravel = 1 : 2 : 4. To divide a total in a : b : c, find one
    part as total ÷ (a + b + c). A pie chart shows parts of a whole: each part's angle = (part ÷ whole) × 360°.
  explanations:
    text: 'A map scale is a ratio: 1 : 100,000 means every 1 cm on the map is 100,000 cm, or 1 km, in real life. Ratios can compare three things too, like 1 : 2 : 4. To share in such a ratio, add all the parts to find how many shares there are.'
    visual: 'Draw a 7-box bar for concrete: 1 box cement, 2 boxes sand, 4 boxes gravel. For 140 kg of mix, each box is 20 kg.'
    step_by_step: 'Step 1: Map: multiply the map length by the scale number, then convert to km. Step 2: Three-term ratio: add the parts. Step 3: One part = total ÷ sum. Step 4: Multiply one part by each term. Step 5: Pie chart angle = part ÷ total × 360°.'
    real_world: 'On a map with scale 1 : 2,00,000, two towns 6 cm apart are 12,00,000 cm = 12 km apart.'
  picture:
    kind: bars
    bars:
    - label: Cement
      value: 20
    - label: Sand
      value: 40
    - label: Gravel
      value: 80
    unit: kg
    caption: '140 kg of concrete mixed 1 : 2 : 4 is 20 kg, 40 kg and 80 kg.'
    alt: Bars for cement 20 kg, sand 40 kg and gravel 80 kg, the ratio 1 to 2 to 4 for 140 kg.
  activity:
    type: formula
    prompt: 'Share sweets in the ratio 1 : 2 : 4. Set what one part is worth.'
    inputs:
    - name: u
      label: One part (sweets)
      min: 0
      max: 40
      step: 1
      start: 0
    outputs:
    - name: s1
      label: Smallest share (1 part)
      expr: u
    - name: s2
      label: Middle share (2 parts)
      expr: 2*u
    - name: s3
      label: Biggest share (4 parts)
      expr: 4*u
    - name: total
      label: Total
      expr: 7*u
    goals:
    - prompt: Share 70 sweets.
      want:
        total: 70
      mistakes:
      - when:
          u: 23
        say: 70 ÷ 3? There are three people but 1 + 2 + 4 = 7 parts.
      - when:
          u: 35
        say: '70 ÷ 2: count the parts, 1 + 2 + 4 = 7.'
    - prompt: The biggest share is 48 sweets.
      want:
        s3: 48
      mistakes:
      - when:
          u: 16
        say: 48 ÷ 3? The biggest share is 4 parts, so divide by 4.
      - when:
          u: 7
        say: 48 ÷ 7 shares everything. Only the biggest share is 48, and it's 4 parts.
    - prompt: The middle share is 10 more than the smallest.
      want:
        u: 10
      mistakes:
      - when:
          u: 5
        say: 10 ÷ 2? The middle (2 parts) minus the smallest (1 part) is just 1 part.
  lesson:
    - teach: 'A map scale such as 1 : 50,000 means 1 cm on the map stands for 50,000 cm on the ground, which is 500 m. Multiply the map distance by the scale number, then change units: 1 m = 100 cm and 1 km = 1,00,000 cm.'
      picture:
        kind: flow
        steps:
        - '4 cm on a 1 : 50,000 map'
        - 4 × 50,000 = 2,00,000 cm
        - = 2000 m
        - = 2 km
        alt: 4 cm on a 1 to 50,000 map is 200,000 cm, which is 2000 m or 2 km.
      check:
        prompt: 'On a 1 : 1,00,000 map, how far is 1 cm on the ground?'
        options:
        - 1 km
        - 100 m
        - 10 km
        answer: 1 km
        why: 1,00,000 cm = 1000 m = 1 km.
    - teach: 'A ratio can have three terms. In concrete, cement : sand : gravel = 1 : 2 : 3 means 6 parts in all. To share a total, add all the terms, find one part, then multiply by each term. 60 kg of mix has 10 kg cement, 20 kg sand and 30 kg gravel.'
      picture:
        kind: compare
        columns:
        - title: Cement
          points:
          - 1 part
          - 10 kg
        - title: Sand
          points:
          - 2 parts
          - 20 kg
        - title: Gravel
          points:
          - 3 parts
          - 30 kg
        alt: 60 kg of concrete in the ratio 1 to 2 to 3 is 10 kg cement, 20 kg sand and 30 kg gravel.
      check:
        prompt: 'Share 24 sweets in the ratio 1 : 2 : 3. How many in the smallest share?'
        options:
        - '4'
        - '8'
        - '6'
        answer: '4'
        why: 1 + 2 + 3 = 6 parts, so one part is 24 ÷ 6 = 4.
    - teach: A pie chart shows parts of a whole as slices of a circle. The whole circle is 360°, so a slice's angle is its fraction of the whole times 360°. A quarter of the class is a 90° slice; a slice of 120° is one third.
      check:
        prompt: In a pie chart, a slice is half the whole. What is its angle?
        options:
        - 180°
        - 50°
        - 90°
        answer: 180°
        why: ½ × 360° = 180°.
  items:
  - prompt: 'A map''s scale is 1 : 1,00,000. Two places are 5 cm apart on it. How far apart are they really, in km?'
    answer: '5'
    check: 5*100000/100000
    difficulty: 1
    hints:
    - 1 cm stands for 1,00,000 cm = 1 km.
    - 5 × 1 km.
    solution: 1 cm = 1 km, so 5 cm = 5 km.
    mistakes: {"500000": "t8_map_scale", "50": "t8_map_scale"}
  - prompt: 'Share ₹900 in the ratio 2 : 3 : 4. What is the largest share, in rupees?'
    answer: '400'
    check: 900/9*4
    difficulty: 2
    hints:
    - 9 parts in all.
    - One part = ₹100.
    solution: 900 ÷ 9 = 100, largest = 4 × 100 = ₹400.
    mistakes: {"200": "t8_three_part_share", "300": "t8_three_part_share"}
  - prompt: 'Concrete is mixed cement : sand : gravel = 1 : 2 : 4. How much sand is in 140 kg of mix, in kg?'
    answer: '40'
    check: 140/7*2
    difficulty: 2
    hints:
    - 7 parts in all.
    - One part = 20 kg.
    solution: 140 ÷ 7 = 20, sand = 2 × 20 = 40 kg.
    mistakes: {"20": "t8_mix_parts", "80": "t8_mix_parts"}
  - prompt: In a pie chart of 60 students, 15 like cricket. What angle is the cricket slice, in degrees?
    answer: '90'
    check: Rational(15, 60)*360
    difficulty: 2
    hints:
    - 15/60 of 360°.
    - 1/4 of 360.
    solution: 15/60 × 360° = 90°.
    mistakes: {"15": "t8_pie_angle", "25": "t8_pie_angle"}
  - prompt: A pie-chart slice has an angle of 72°. What fraction of the whole is it? Type a fraction.
    answer: 1/5
    check: Rational(72, 360)
    difficulty: 2
    hints:
    - 72/360.
    - Simplify.
    solution: 72/360 = 1/5.
    mistakes: {"72/100": "t8_angle_fraction", "1/4": "t8_angle_fraction"}
  - prompt: On a map 1 cm stands for 50 km. Which scale is that?
    options:
    - '1 : 50,00,000'
    - '1 : 50'
    - '1 : 5,000'
    - '1 : 50,000'
    answer: '1 : 50,00,000'
    difficulty: 3
    hints:
    - 50 km = 50 × 1000 × 100 cm.
    - = 50,00,000 cm.
    solution: '50 km = 50,00,000 cm, so the scale is 1 : 50,00,000.'
    mistakes: {"1 : 50": "t8_km_to_cm", "1 : 50,000": "t8_km_to_cm"}
  - prompt: 'A map''s scale is 1 : 50,000. Two towns are 8 cm apart on it. How far apart are they really, in km?'
    answer: '4'
    check: 8*50000/100000
    difficulty: 2
    hints:
    - 8 × 50,000 cm.
    - Divide by 1,00,000 for km.
    solution: 'Step 1: 8 × 50,000 = 4,00,000 cm. Step 2: 4,00,000 ÷ 1,00,000 = 4 km.'
    mistakes:
      '400000': c8m10_scale_units
      '40': c8m10_scale_units
  - prompt: 'On a 1 : 25,000 map, a lake is 6 cm long. How long is it really, in m?'
    answer: '1500'
    check: 6*25000/100
    difficulty: 2
    hints:
    - 6 × 25,000 cm.
    - Divide by 100 for metres.
    solution: 'Step 1: 6 × 25,000 = 1,50,000 cm. Step 2: ÷ 100 = 1500 m.'
    mistakes:
      '150000': c8m10_scale_units
      '150': c8m10_scale_units
  - prompt: 'Two cities are 30 km apart. On a 1 : 10,00,000 map, how far apart are they, in cm?'
    answer: '3'
    check: 30*100000/1000000
    difficulty: 3
    hints:
    - Change 30 km into cm.
    - 30 km = 30,00,000 cm. Divide by 10,00,000.
    solution: 'Step 1: 30 km = 30,00,000 cm. Step 2: 30,00,000 ÷ 10,00,000 = 3 cm.'
    mistakes:
      '30': c8m10_scale_back
      '0.3': c8m10_scale_back
  - prompt: 'Share ₹1500 among three friends in the ratio 3 : 5 : 7. What does the middle friend get, in rupees?'
    answer: '500'
    check: 1500/15*5
    difficulty: 2
    hints:
    - 3 + 5 + 7 = 15 parts.
    - One part is ₹100.
    solution: 'Step 1: 15 parts. Step 2: one part = ₹100. Step 3: 5 parts = ₹500.'
    mistakes:
      '100': c8m10_parts_three
      '300': c8m10_parts_three
  - prompt: 'A drink is made of juice : water : syrup = 2 : 5 : 1. How much water is in 4 litres of drink, in litres?'
    answer: '2.5'
    check: 4/8*5
    difficulty: 2
    hints:
    - 2 + 5 + 1 = 8 parts.
    - One part is 0.5 litres.
    solution: 'Step 1: 8 parts. Step 2: one part = 4 ÷ 8 = 0.5 L. Step 3: water = 5 × 0.5 = 2.5 L.'
    mistakes:
      '20': c8m10_parts_three
      '0.5': c8m10_parts_three
  - prompt: In a pie chart of 72 students, 24 chose football. What is the angle of the football slice, in degrees?
    answer: '120'
    check: 24/72*360
    difficulty: 1
    hints:
    - 24 out of 72 is one third.
    - One third of 360°.
    solution: 24/72 = 1/3, and 1/3 × 360° = 120°.
    mistakes:
      '24': c8m10_pie_total
      '33': t8_pie_angle
  - prompt: A pie-chart slice has an angle of 45°. What percentage of the whole is it? Type a decimal.
    answer: '12.5'
    check: 45/360*100
    difficulty: 2
    hints:
    - 45 ÷ 360 = 1/8.
    - 1/8 as a percentage.
    solution: 45/360 = 1/8 = 12.5%.
    mistakes:
      '45': t8_angle_fraction
      '8': t8_angle_fraction
  - prompt: A family spends ₹3000 on food out of a monthly budget of ₹12,000. What angle does food get in a pie chart, in degrees?
    answer: '90'
    check: 3000/12000*360
    difficulty: 2
    hints:
    - 3000 is what fraction of 12,000?
    - One quarter of 360°.
    solution: 3000/12,000 = 1/4, and 1/4 × 360° = 90°.
    mistakes:
      '25': c8m10_pie_total
      '3000': c8m10_pie_total
  - prompt: Which scale means 1 cm on the map is 2 km on the ground?
    options:
    - '1 : 2,00,000'
    - '1 : 2000'
    - '1 : 20,000'
    - '1 : 2'
    answer: '1 : 2,00,000'
    difficulty: 3
    hints:
    - Change 2 km into cm.
    - 2 km = 2000 m = 2,00,000 cm.
    solution: '2 km = 2,00,000 cm, so the scale is 1 : 2,00,000.'
    mistakes:
      '1 : 2000': t8_map_scale
      '1 : 20,000': t8_map_scale
      '1 : 2': t8_map_scale
- code: cbse8m.prop2.inverse
  title: Inverse proportion
  after:
  - cbse8m.prop2.maps
  notes: |
    Two quantities are in inverse proportion when one increases as the other decreases so that their product
    stays the same: x × y = k. More workers finish a job in fewer days; a faster speed takes less time for
    the same distance. If 6 workers take 10 days, 1 worker takes 60 days and 12 workers take 5 days.
  explanations:
    text: In inverse proportion, doubling one quantity halves the other, because their product never changes. Twice as many painters finish a wall in half the time. Find the fixed product first, then divide.
    visual: 'Draw a rectangle of area 24: 1 by 24, 2 by 12, 3 by 8, 4 by 6. As the width grows, the length shrinks, and width × length stays 24.'
    step_by_step: 'Step 1: Check that more of one means less of the other. Step 2: Multiply the known pair to get the constant product. Step 3: Divide the product by the new value. Step 4: Check that the answer moved the opposite way.'
    real_world: Food for 40 children at a camp lasts 15 days. If 60 children come, it lasts 40 × 15 ÷ 60 = 10 days.
  picture:
    kind: bars
    bars:
    - label: 3 workers
      value: 20
    - label: 6 workers
      value: 10
    - label: 12 workers
      value: 5
    unit: days
    caption: 'Doubling the workers halves the days: workers × days stays 60.'
    alt: Bars showing 3 workers take 20 days, 6 take 10 and 12 take 5, so workers times days stays 60.
  activity:
    type: formula
    prompt: 12 painters paint a wall in 6 days. Set how many painters work.
    inputs:
    - name: w
      label: Painters
      min: 1
      max: 36
      step: 1
      start: 12
    outputs:
    - name: wd
      label: Painter-days needed
      expr: '72'
    - name: days
      label: Days to finish
      expr: 72/w
      places: 2
    goals:
    - prompt: Finish in 4 days.
      want:
        days: 4
      mistakes:
      - when:
          w: 8
        say: 8 painters take 9 days. Fewer days need more painters, not fewer.
      - when:
          w: 3
        say: 12 ÷ 4 = 3 divides the wrong way. The work, 72 painter-days, stays the same.
    - prompt: Finish in 2 days.
      want:
        days: 2
      mistakes:
      - when:
          days:
          - 6.01
          - 72
        say: More days, not fewer! Fewer painters take longer.
      - when:
          w: 24
        say: Twice the painters halves the time to 3 days. For 2 days you need 72 ÷ 2.
    - prompt: Only a few painters, taking 24 days.
      want:
        days: 24
      mistakes:
      - when:
          w: 36
        say: 'More painters finish sooner. To take 24 days, use fewer: 72 ÷ 24.'
      - when:
          w:
          - 4
          - 11
        say: 'Still too many: they''d finish before 24 days.'
  lesson:
    - teach: Two quantities are in inverse proportion when one goes up as the other goes down, so that their product stays the same. More workers take fewer days; a faster car takes less time for the same trip. If x × y is always the same number, x and y are inversely proportional.
      picture:
        kind: compare
        columns:
        - title: Workers
          points:
          - '2'
          - '4'
          - '8'
        - title: Days
          points:
          - '12'
          - '6'
          - '3'
        - title: Product
          points:
          - '24'
          - '24'
          - '24'
        alt: '2 workers take 12 days, 4 take 6 and 8 take 3: the product is always 24.'
      check:
        prompt: Which pair is in inverse proportion?
        options:
        - Number of taps and time to fill a tank
        - Number of pens and their cost
        - Distance and time at a fixed speed
        answer: Number of taps and time to fill a tank
        why: More taps fill the tank faster, so the time goes down and taps × time stays the same.
    - teach: To solve an inverse-proportion problem, find the fixed product first, then divide by the new value. 5 workers take 12 days, so the job is 60 worker-days. 10 workers take 60 ÷ 10 = 6 days.
      picture:
        kind: flow
        steps:
        - 5 workers × 12 days
        - = 60 worker-days
        - 10 workers
        - 60 ÷ 10 = 6 days
        alt: 5 workers taking 12 days is 60 worker-days, so 10 workers take 6 days.
      check:
        prompt: A car at 40 km/h takes 3 hours. How long at 60 km/h?
        options:
        - 2 hours
        - 4.5 hours
        - 1 hour
        answer: 2 hours
        why: The distance is 40 × 3 = 120 km, and 120 ÷ 60 = 2 hours.
    - teach: 'Before you start, decide whether the problem is direct or inverse. Ask: if one quantity doubles, does the other double (direct) or halve (inverse)? Scaling the wrong way is the most common slip.'
      check:
        prompt: Food lasts 20 people for 6 days. With more people, the food lasts…
        options:
        - fewer days
        - more days
        - the same number of days
        answer: fewer days
        why: 'More people eat it faster: this is inverse proportion.'
  items:
  - prompt: 6 workers build a wall in 10 days. How many days do 12 workers take?
    answer: '5'
    check: 6*10/12
    difficulty: 1
    hints:
    - 'Product: 6 × 10 = 60.'
    - 60 ÷ 12.
    solution: 60 ÷ 12 = 5 days.
    mistakes:
      '20': c8_inverse_not_direct
  - prompt: A car at 60 km/h takes 4 hours for a trip. How long at 80 km/h, in hours?
    answer: '3'
    check: 60*4/80
    difficulty: 2
    hints:
    - Distance = 240 km.
    - 240 ÷ 80.
    solution: 60 × 4 = 240 km, and 240 ÷ 80 = 3 hours.
    mistakes:
      16/3: c8_inverse_not_direct
  - prompt: Which pair is in inverse proportion?
    options:
    - Speed and time for a fixed distance
    - Number of pens and their cost
    - Hours worked and pay earned
    - Length of cloth and its price
    answer: Speed and time for a fixed distance
    difficulty: 1
    hints:
    - More of one should mean less of the other.
    - Faster means less time.
    solution: For a fixed distance, a higher speed means less time, and speed × time stays the same.
    mistakes: {"Number of pens and their cost": "t8_inverse", "Hours worked and pay earned": "t8_inverse"}
  - prompt: Food lasts 40 children for 15 days. How many days would it last 60 children?
    answer: '10'
    check: 40*15/60
    difficulty: 2
    hints:
    - 40 × 15 = 600 child-days.
    - 600 ÷ 60.
    solution: 600 ÷ 60 = 10 days.
    mistakes: {"22.5": "t8_inverse_calc", "35": "t8_inverse_calc"}
  - prompt: A tank is filled by 4 taps in 9 hours. How many taps fill it in 6 hours?
    answer: '6'
    check: 4*9/6
    difficulty: 2
    hints:
    - 4 × 9 = 36 tap-hours.
    - 36 ÷ 6.
    solution: 36 ÷ 6 = 6 taps.
    mistakes: {"2.67": "t8_taps_inverse", "1": "t8_taps_inverse"}
  - prompt: If x and y are in inverse proportion and x is tripled, what happens to y?
    options:
    - It becomes one-third
    - It triples
    - It stays the same
    - It goes up by 3
    answer: It becomes one-third
    difficulty: 1
    hints:
    - x × y stays the same.
    - 3x × ? = xy.
    solution: To keep x × y fixed, y must be divided by 3.
    mistakes: {"It triples": "t8_inverse_triple", "It stays the same": "t8_inverse_triple"}
  - prompt: 8 workers finish a job in 15 days. How many days do 12 workers take?
    answer: '10'
    check: 8*15/12
    difficulty: 1
    hints:
    - Find the worker-days first.
    - 8 × 15 = 120.
    solution: 'Step 1: 8 × 15 = 120 worker-days. Step 2: 120 ÷ 12 = 10 days.'
    mistakes:
      '22.5': c8_inverse_not_direct
      '11': c8m10_product_fixed
  - prompt: A trip takes 6 hours at 50 km/h. How long does it take at 75 km/h, in hours?
    answer: '4'
    check: 6*50/75
    difficulty: 1
    hints:
    - Distance = 50 × 6 = 300 km.
    - 300 ÷ 75.
    solution: 'Step 1: distance = 300 km. Step 2: 300 ÷ 75 = 4 hours.'
    mistakes:
      '9': c8_inverse_not_direct
      '300': c8m10_product_fixed
  - prompt: Food lasts 50 hostel students for 30 days. How long would it last 75 students?
    answer: '20'
    check: 50*30/75
    difficulty: 2
    hints:
    - 'Student-days: 50 × 30.'
    - Divide by 75.
    solution: 'Step 1: 1500 student-days. Step 2: 1500 ÷ 75 = 20 days.'
    mistakes:
      '45': t8_inverse_calc
      '55': c8m10_product_fixed
  - prompt: 6 pipes fill a tank in 80 minutes. How long would 8 pipes take, in minutes?
    answer: '60'
    check: 6*80/8
    difficulty: 2
    hints:
    - 'Pipe-minutes: 6 × 80.'
    - Divide by 8.
    solution: 'Step 1: 480 pipe-minutes. Step 2: 480 ÷ 8 = 60 minutes.'
    mistakes:
      '106.67': c8_inverse_not_direct
      '78': c8m10_product_fixed
  - prompt: Which pair is NOT in inverse proportion?
    options:
    - Cost of apples and number of apples
    - Speed and time for a fixed trip
    - Workers and days for a fixed job
    answer: Cost of apples and number of apples
    difficulty: 2
    hints:
    - Double the number of apples. What happens to the cost?
    - Inverse means one goes up while the other goes down.
    solution: 'More apples cost more: that is direct proportion. The other two pairs are inverse.'
    mistakes:
      Speed and time for a fixed trip: c8m10_direct_or_inverse
      Workers and days for a fixed job: c8m10_direct_or_inverse
  - prompt: x and y are in inverse proportion. When x = 4, y = 15. Find y when x = 10.
    answer: '6'
    check: 4*15/10
    difficulty: 2
    hints:
    - x × y = 4 × 15 = 60.
    - 60 ÷ 10.
    solution: 'Step 1: x × y = 60. Step 2: y = 60 ÷ 10 = 6.'
    mistakes:
      '37.5': c8_inverse_not_direct
      '21': c8m10_product_fixed
  - prompt: A book has 300 pages with 24 lines each. If each page had 30 lines, how many pages would it have?
    answer: '240'
    check: 300*24/30
    difficulty: 3
    hints:
    - Total lines = 300 × 24.
    - Divide by 30 lines a page.
    solution: 'Step 1: 7200 lines in all. Step 2: 7200 ÷ 30 = 240 pages.'
    mistakes:
      '375': c8_inverse_not_direct
      '294': c8m10_product_fixed
  - prompt: If x and y are in inverse proportion and y is halved, what happens to x?
    options:
    - It doubles
    - It halves
    - It stays the same
    answer: It doubles
    difficulty: 1
    hints:
    - x × y must stay the same.
    - If y is halved, x must make up for it.
    solution: x × y is fixed, so if y becomes half, x must become twice as big.
    mistakes:
      It halves: t8_inverse_triple
      It stays the same: t8_inverse_triple
  - prompt: 15 cows graze a field in 8 days. How many cows would graze it in 5 days?
    answer: '24'
    check: 15*8/5
    difficulty: 3
    hints:
    - Fewer days needs more cows.
