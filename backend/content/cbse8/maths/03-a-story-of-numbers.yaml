# CBSE Class 8 Mathematics (NCERT Ganita Prakash, 2025), chapter 3. Format: content/README.md.
subject: cbse8-math
chapter: 3
title: A Story of Numbers
tips:
  c8_roman_subtract: 'A smaller symbol before a bigger one is taken away: XL is 50 − 10 = 40, not 60.'
  c8_face_value: That is the digit itself. Its place value is the digit times the value of its place.
  t8_base5_places: "Base-5 places from the right are 1, 5, 25. Multiply each digit by its place value and add."
  t8_base60: "Which choice uses the number 60?"
  t8_base_digits: "In base b the digits run from 0 up to b − 1."
  t8_binary_places: "Binary places from the right are 1, 2, 4, 8. Add the place values where there is a 1."
  t8_egyptian: "Multiply each symbol's value by how many times it appears, then add."
  t8_place_value: "Think about adding 2,345 + 678 in columns. What do Roman numerals lack that columns need?"
  t8_roman_build: "Build it from thousands, tens and units: 2000, 20, 6. Write each part and join them."
  t8_roman_subtract: "In Roman numerals a smaller symbol before a bigger one is subtracted: CM = 900, XC = 90. Split the numeral into chunks."
  t8_to_binary: "Split 10 into powers of 2 (8, 4, 2, 1). Write 1 where a power is used and 0 where it isn't."
  t8_zero_placeholder: "Remove the zero from 305. What number do you get? So what is the zero doing?"
  c8m3_base60_value: The left part counts sixties. Multiply it by 60, then add the ones.
  c8m3_additive: In an additive system a symbol is worth the same wherever it stands. In which system does position not change the value?
  c8m3_order: 'Compare where the X sits in each: before the L, or after it?'
  c8m3_base_places: In base b the places from the right are worth 1, b, b², … Multiply each digit by its place value and add.
  c8m3_count_places: 'Count the places from the right: ones, tens, hundreds, thousands, ten thousands, …'
  c8m3_to_base: Find the biggest power of the base that fits, note how many times it fits, then repeat with what is left.
  c8m3_binary_long: Write the number 100 in base 10 and in base 2. Which needs more digits?
  c8m3_egypt_count: One symbol stands for each 100, each 10 and each 1. How many of each does 999 need?
concepts:
- code: cbse8m.story.systems
  title: Early ways of writing numbers
  notes: |
    People first counted with tallies, knots and body parts. The Egyptians used separate symbols for 1, 10,
    100, 1000 ... and repeated them (an additive system). Roman numerals use I, V, X, L, C, D, M; a smaller
    symbol before a larger one is subtracted (IX = 9). Such systems need ever more symbols and make
    arithmetic hard. The Mesopotamians used base 60, which survives in 60 minutes and 360 degrees.
  explanations:
    text: 'Long ago, numbers were written by repeating symbols, a bit like tally marks with special marks for 10 or 100. Roman numerals still work this way: XXIII is 10 + 10 + 1 + 1 + 1 = 23. These systems get long and are hard to calculate with.'
    visual: 'Write 1, 5, 10, 50, 100, 500 and 1000 as I, V, X, L, C, D and M in a row. To read MCMXC, split it: M (1000) + CM (900) + XC (90) = 1990.'
    step_by_step: 'Step 1: Learn the value of each symbol. Step 2: Read from left to right. Step 3: Add symbols that are equal to or smaller than the one before. Step 4: If a smaller symbol comes before a bigger one, subtract it.'
    real_world: Clock faces often show IV or IIII for 4 and XII for 12, and our 60 minutes in an hour come from the base-60 numbers of ancient Mesopotamia.
  picture:
    kind: compare
    columns:
    - title: Additive (Roman)
      points:
      - Repeat symbols and add
      - XXVII = 27
      - No zero
      - Hard to multiply
    - title: Place value (Indian)
      points:
      - Ten digits, position gives value
      - 27 = 2 tens + 7 ones
      - Has a zero
      - Easy to calculate
    caption: Additive systems repeat symbols; place value lets ten digits write any number.
    alt: Two columns comparing Roman additive numerals, which repeat symbols and have no zero, with the Indian place-value system using ten digits and zero.
  activity:
    type: order
    prompt: Put these Roman numerals in order, smallest first.
    steps:
    - IX
    - XIV
    - XL
    - LX
    - XC
    - CX
    reasons:
      XIV: IX is 10 − 1 = 9; XIV is 10 + 4 = 14. A small letter before a bigger one subtracts.
      XL: XL is 50 − 10 = 40, bigger than 14.
      LX: LX is 50 + 10 = 60. The X after L adds; before L (XL) it subtracts.
      XC: XC is 100 − 10 = 90, bigger than 60.
      CX: CX is 100 + 10 = 110, the biggest.
  lesson:
    - teach: 'The first numbers were tallies: one mark, knot or pebble for each thing. The Egyptians grouped them, with a symbol for 1, another for 10, for 100, for 1000 and so on. To read a number you add up all the symbols: three 100-symbols and two 1-symbols make 302. This is an additive system.'
      picture:
        kind: flow
        steps:
        - 'Tally marks: one mark per thing'
        - Egyptian symbols for 1, 10, 100, 1000
        - Add up every symbol you see
        alt: Counting grew from one tally mark per thing to Egyptian symbols for 1, 10, 100 and 1000 that are added up.
      check:
        prompt: An Egyptian number has 1 symbol for 1000, 2 for 10 and 5 for 1. What number is it?
        options:
        - '1025'
        - '1205'
        - '8'
        answer: '1025'
        why: 1000 + 10 + 10 + 5 = 1025. Each symbol is simply added.
    - teach: 'Roman numerals use I = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000. Usually you add from left to right: LX = 50 + 10 = 60. But a smaller symbol written just before a bigger one is taken away: XL = 50 − 10 = 40, and CM = 900.'
      picture:
        kind: compare
        columns:
        - title: 'Smaller after: add'
          points:
          - LX = 50 + 10 = 60
          - VI = 5 + 1 = 6
          - MC = 1000 + 100 = 1100
        - title: 'Smaller before: take away'
          points:
          - XL = 50 − 10 = 40
          - IV = 5 − 1 = 4
          - CM = 1000 − 100 = 900
        alt: In Roman numerals a smaller symbol after a bigger one is added, and before it is taken away.
      check:
        prompt: What number is XC?
        options:
        - '90'
        - '110'
        - '100'
        answer: '90'
        why: 'X (10) comes before C (100), so it is taken away: 100 − 10 = 90.'
    - teach: Systems like these need more and more symbols for bigger numbers, and they have no zero, so numbers cannot be lined up in columns to add or multiply. The Babylonians counted in sixties, which is why an hour still has 60 minutes and a minute 60 seconds.
      check:
        prompt: Why are Roman numerals hard to add in columns?
        options:
        - They have no place value or zero
        - They use letters instead of pictures
        - They only go up to 1000
        answer: They have no place value or zero
        why: Column sums need each place (ones, tens, …) to line up, and a zero to fill an empty place. Roman numerals have neither.
  items:
  - prompt: What number is XLVII?
    answer: '47'
    check: 40 + 7
    difficulty: 1
    hints:
    - XL = 40.
    - VII = 7.
    solution: XL = 50 − 10 = 40, VII = 7, so 47.
    mistakes:
      '67': c8_roman_subtract
  - prompt: What number is MCMXC?
    answer: '1990'
    check: 1000 + 900 + 90
    difficulty: 2
    hints:
    - M = 1000, CM = 900.
    - XC = 90.
    solution: M + CM + XC = 1000 + 900 + 90 = 1990.
    mistakes: {"2190": "t8_roman_subtract", "2110": "t8_roman_subtract"}
  - prompt: Which is 2026 in Roman numerals?
    options:
    - MMXXVI
    - MMXXIV
    - MMXVI
    - MMCCVI
    answer: MMXXVI
    difficulty: 2
    hints:
    - MM = 2000.
    - XXVI = 26.
    solution: '2000 = MM, 20 = XX, 6 = VI: MMXXVI.'
    mistakes: {"MMXXIV": "t8_roman_build", "MMCCVI": "t8_roman_build"}
  - prompt: Why is the Roman system hard for big calculations?
    options:
    - It has no place value or zero, so numbers can't be lined up in columns
    - It uses too few symbols
    - It only works for even numbers
    - It was written right to left
    answer: It has no place value or zero, so numbers can't be lined up in columns
    difficulty: 1
    hints:
    - How do we add big numbers today?
    - Columns of ones, tens, hundreds.
    solution: Without place value and zero, there are no ones, tens and hundreds columns, so written methods for adding and multiplying don't work.
    mistakes: {"It uses too few symbols": "t8_place_value", "It was written right to left": "t8_place_value"}
  - prompt: Which everyday measure comes from base-60 counting?
    options:
    - 60 minutes in an hour
    - 100 paise in a rupee
    - 1000 grams in a kilogram
    - 12 months in a year
    answer: 60 minutes in an hour
    difficulty: 1
    hints:
    - Look for the number 60.
    - Time and angles.
    solution: Minutes, seconds and degrees (360 = 6 × 60) come from Mesopotamian base-60 counting.
    mistakes: {"100 paise in a rupee": "t8_base60", "12 months in a year": "t8_base60"}
  - prompt: An Egyptian number shows 3 symbols for 100, 4 for 10 and 2 for 1. What number is it?
    answer: '342'
    check: 3*100 + 4*10 + 2
    difficulty: 1
    hints:
    - Add the values of all the symbols.
    - 300 + 40 + 2.
    solution: 3 × 100 + 4 × 10 + 2 × 1 = 342.
    mistakes: {"9": "t8_egyptian", "243": "t8_egyptian"}
  - prompt: What number is XCIV?
    answer: '94'
    check: 100 - 10 + 5 - 1
    difficulty: 1
    hints:
    - Split it into XC and IV.
    - XC = 90. What is IV?
    solution: 'Step 1: XC = 100 − 10 = 90. Step 2: IV = 5 − 1 = 4. Step 3: 90 + 4 = 94.'
    mistakes:
      '116': c8_roman_subtract
  - prompt: What number is CDXLIV?
    answer: '444'
    check: (500 - 100) + (50 - 10) + (5 - 1)
    difficulty: 2
    hints:
    - Split it into CD, XL and IV.
    - Each pair has a smaller symbol before a bigger one.
    solution: 'Step 1: CD = 400. Step 2: XL = 40. Step 3: IV = 4. Step 4: 400 + 40 + 4 = 444.'
    mistakes:
      '666': c8_roman_subtract
  - prompt: What number is MDCLXVI?
    answer: '1666'
    check: 1000 + 500 + 100 + 50 + 10 + 5 + 1
    difficulty: 1
    hints:
    - Each symbol here is smaller than the one before it.
    - So you just add them all.
    solution: 'Every symbol is followed by a smaller one, so add: 1000 + 500 + 100 + 50 + 10 + 5 + 1 = 1666.'
    mistakes:
      '1444': c8m3_order
  - prompt: Which is 49 in Roman numerals?
    options:
    - XLIX
    - IL
    - XXXXIX
    - LIX
    answer: XLIX
    difficulty: 2
    hints:
    - Write 40 and 9 separately.
    - 40 is XL. What is 9?
    solution: 'Step 1: 40 = XL. Step 2: 9 = IX. Step 3: 49 = XLIX. Romans only put I before V or X, so IL is not used.'
    mistakes:
      IL: t8_roman_subtract
      LIX: c8_roman_subtract
      XXXXIX: t8_roman_build
  - prompt: An Egyptian number shows 2 symbols for 1000, 5 for 100 and 7 for 1. What number is it?
    answer: '2507'
    check: 2*1000 + 5*100 + 7
    difficulty: 1
    hints:
    - There are no symbols for 10 here.
    - Add 2 × 1000, 5 × 100 and 7 × 1.
    solution: 'Step 1: 2 × 1000 = 2000. Step 2: 5 × 100 = 500. Step 3: 7 ones. Step 4: 2000 + 500 + 7 = 2507. In our system a zero holds the empty tens place.'
    mistakes:
      '257': t8_zero_placeholder
      '14': t8_egyptian
  - prompt: How many Egyptian symbols are needed to write 999?
    answer: '27'
    check: 9 + 9 + 9
    difficulty: 2
    hints:
    - 999 is 9 hundreds, 9 tens and 9 ones.
    - Each hundred, ten and one needs its own symbol.
    solution: 'Step 1: 9 hundreds need 9 symbols. Step 2: 9 tens need 9 more. Step 3: 9 ones need 9 more. Step 4: 9 + 9 + 9 = 27 symbols.'
    mistakes:
      '3': c8m3_egypt_count
      '999': c8m3_egypt_count
  - prompt: 'In base 60, a number is written as 2 | 15: 2 sixties and 15 ones. What is it in base 10?'
    answer: '135'
    check: 2*60 + 15
    difficulty: 2
    hints:
    - The 2 counts sixties.
    - 2 × 60, then add 15.
    solution: 'Step 1: 2 sixties = 120. Step 2: 120 + 15 = 135.'
    mistakes:
      '215': c8m3_base60_value
      '17': c8m3_base60_value
  - prompt: A film runs for 1 hour 25 minutes. How many minutes is that?
    answer: '85'
    check: 60 + 25
    difficulty: 1
    hints:
    - An hour has 60 minutes.
    - Add the extra 25.
    solution: 1 hour = 60 minutes, and 60 + 25 = 85 minutes. Counting time is still counting in sixties.
    mistakes:
      '125': c8m3_base60_value
  - prompt: Which is an additive number system, where symbols are simply added up?
    options:
    - Egyptian numerals
    - Our base-10 numerals
    - Binary numbers
    answer: Egyptian numerals
    difficulty: 1
    hints:
    - In our numerals, the 5 in 50 and in 500 are worth different amounts.
    - Which system gives a symbol the same value wherever it is?
    solution: Egyptian symbols are always worth the same and are added up. In base 10 and binary, a digit's value depends on its place.
    mistakes:
      Our base-10 numerals: c8m3_additive
      Binary numbers: c8m3_additive
  - prompt: Why does XL mean 40 but LX mean 60?
    options:
    - A smaller symbol before a bigger one is taken away; after it, it is added
    - Romans read from right to left
    - L is worth different amounts in different numbers
    answer: A smaller symbol before a bigger one is taken away; after it, it is added
    difficulty: 2
    hints:
    - L is always 50 and X is always 10.
    - What changes between XL and LX?
    solution: In XL the X (10) comes before the L (50), so 50 − 10 = 40. In LX it comes after, so 50 + 10 = 60.
    mistakes:
      L is worth different amounts in different numbers: c8m3_order
      Romans read from right to left: c8m3_order
- code: cbse8m.story.base
  title: Place value and number bases
  after:
  - cbse8m.story.systems
  notes: |
    In a place-value system the value of a digit depends on its position. Our Hindu numeral system (passed
    to the world through Arabic scholars) uses base 10 with digits 0–9 and a zero as a place holder. In base
    b, places are worth 1, b, b², b³ ... Base 2 (binary) uses only 0 and 1 and is used by computers: 1011₂ =
    8 + 0 + 2 + 1 = 11. Base 5 places are 1, 5, 25, 125.
  explanations:
    text: 'In 345, the 3 means 3 hundreds because of where it sits. That is place value. Our system groups in tens, but you can group in any number: in base 2 the places are 1, 2, 4, 8 ..., and each place holds only 0 or 1.'
    visual: 'Draw place-value boxes labelled 8, 4, 2, 1 for base 2. Write 1 0 1 1 in them: 8 + 2 + 1 = 11.'
    step_by_step: 'Step 1: Write the place values for the base: 1, b, b², b³ from the right. Step 2: Multiply each digit by its place value. Step 3: Add them up to get the number in base 10.'
    real_world: Computers store everything in base 2, as switches that are off (0) or on (1). The letter A is stored as 1000001₂ = 65.
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: '8'
    - size: 1
      label: '4'
    - size: 1
      label: '2'
    - size: 1
      label: '1'
    rows:
    - size: 1
      label: 1011₂
    cells:
    - - '1'
      - '0'
      - '1'
      - '1'
    caption: 1011 in base 2 = 8 + 0 + 2 + 1 = 11.
    alt: Four boxes with place values 8, 4, 2 and 1 holding the digits 1, 0, 1, 1, which make 11.
  activity:
    type: formula
    prompt: 'Base 2: each place holds 0 or 1. The places are worth 8, 4, 2 and 1.'
    inputs:
    - name: e
      label: Eights place
      min: 0
      max: 1
      step: 1
      start: 0
    - name: f
      label: Fours place
      min: 0
      max: 1
      step: 1
      start: 0
    - name: t
      label: Twos place
      min: 0
      max: 1
      step: 1
      start: 0
    - name: o
      label: Ones place
      min: 0
      max: 1
      step: 1
      start: 0
    outputs:
    - name: val
      label: Value
      expr: 8*e+4*f+2*t+o
    goals:
    - prompt: Make 5 in base 2.
      want:
        val: 5
      mistakes:
      - when:
          e: 1
          f: 0
          t: 1
          o: 0
        say: 'That''s 1010 = 8 + 2 = 10. You wrote 0101 backwards: the ones place is on the right.'
      - when:
          val:
          - 6
          - 15
        say: 'Too big. 5 = 4 + 1: which two places make that?'
    - prompt: Make 13 in base 2.
      want:
        val: 13
      mistakes:
      - when:
          e: 1
          f: 1
          t: 1
          o: 1
        say: '1111 = 8 + 4 + 2 + 1 = 15. Take out 2: 13 = 8 + 4 + 1.'
      - when:
          val:
          - 0
          - 7
        say: Without the eights place you can make at most 7. 13 needs an 8.
    - prompt: Make 8 in base 2.
      want:
        val: 8
      mistakes:
      - when:
          e: 0
          f: 0
          t: 0
          o: 1
        say: 'A 1 in the ones place is just 1. 8 has its own place on the left: 1000.'
      - when:
          val:
          - 9
          - 15
        say: 'Too big. 8 needs only the eights place: 1000.'
  lesson:
    - teach: 'In our numerals the value of a digit depends on its place. In 555 the three 5s are worth 500, 50 and 5. Each place is worth 10 times the place to its right, so this is base 10. A zero keeps a place empty: in 305 the 0 says there are no tens.'
      picture:
        kind: compare
        columns:
        - title: Digit
          points:
          - 5 (left)
          - 5 (middle)
          - 5 (right)
        - title: Worth
          points:
          - 5 hundreds = 500
          - 5 tens = 50
          - 5 ones = 5
        alt: In 555 the same digit 5 is worth 500, 50 and 5 because of its place.
      check:
        prompt: What is the 3 worth in 4,328?
        options:
        - '300'
        - '3'
        - '3000'
        answer: '300'
        why: The 3 is in the hundreds place, so it is worth 3 × 100 = 300.
    - teach: 'Any number can be the base. In base b the places from the right are worth 1, b, b², b³, … and the digits go from 0 up to b − 1. Binary is base 2: places 1, 2, 4, 8, 16, and only the digits 0 and 1. So 1011₂ = 8 + 0 + 2 + 1 = 11.'
      picture:
        kind: flow
        steps:
        - 1011₂
        - places 8, 4, 2, 1
        - 1×8 + 0×4 + 1×2 + 1×1
        - = 11
        alt: To read 1011 in base 2, give the places the values 8, 4, 2 and 1, multiply by the digits and add to get 11.
      check:
        prompt: What is 101₂ in base 10?
        options:
        - '5'
        - '101'
        - '3'
        answer: '5'
        why: 'Places 4, 2, 1: 1×4 + 0×2 + 1×1 = 5.'
    - teach: 'To write a number in another base, take the biggest place value that fits, see how many times it fits, then repeat with what is left. For 13 in binary: 8 fits (5 left), 4 fits (1 left), 2 does not, 1 fits. So 13 = 1101₂.'
      check:
        prompt: Which is 6 in binary?
        options:
        - '110'
        - '011'
        - '6'
        answer: '110'
        why: '6 = 4 + 2, so the 4 and 2 places get a 1 and the 1 place gets a 0: 110₂.'
  items:
  - prompt: What is the place value of 7 in 47,302?
    answer: '7000'
    check: 7*1000
    difficulty: 1
    hints:
    - 'Count places from the right: ones, tens, hundreds, thousands.'
    - 7 is in the thousands place.
    solution: 'The 7 is in the thousands place: 7 × 1000 = 7000.'
    mistakes:
      '7': c8_face_value
  - prompt: Write the binary number 1101₂ in base 10.
    answer: '13'
    check: 8 + 4 + 1
    difficulty: 2
    hints:
    - 'Places: 8, 4, 2, 1.'
    - 8 + 4 + 0 + 1.
    solution: 1101₂ = 8 + 4 + 0 + 1 = 13.
    mistakes: {"1101": "t8_binary_places", "11": "t8_binary_places"}
  - prompt: Write 10 in base 2 (binary).
    answer: '1010'
    check: '1010'
    difficulty: 2
    hints:
    - Use places 8, 4, 2, 1.
    - 10 = 8 + 2.
    solution: 10 = 8 + 2 = 1×8 + 0×4 + 1×2 + 0×1, so 1010₂.
    mistakes: {"101": "t8_to_binary", "10": "t8_to_binary"}
  - prompt: Write the base-5 number 243₅ in base 10.
    answer: '73'
    check: 2*25 + 4*5 + 3
    difficulty: 3
    hints:
    - 'Places: 25, 5, 1.'
    - 2×25 + 4×5 + 3.
    solution: 2 × 25 + 4 × 5 + 3 × 1 = 50 + 20 + 3 = 73.
    mistakes: {"243": "t8_base5_places", "9": "t8_base5_places"}
  - prompt: What does the zero do in 305?
    options:
    - It holds the tens place empty, so the 3 means 3 hundreds
    - Nothing, it can be left out
    - It makes the number smaller
    - It shows the number is even
    answer: It holds the tens place empty, so the 3 means 3 hundreds
    difficulty: 1
    hints:
    - Compare 305 with 35.
    - Without the zero the 3 moves.
    solution: 'Zero is a place holder: without it, 305 would read as 35.'
    mistakes: {"Nothing, it can be left out": "t8_zero_placeholder", "It shows the number is even": "t8_zero_placeholder"}
  - prompt: Which digits does base 2 use?
    options:
    - Only 0 and 1
    - 0 to 9
    - 1 and 2
    - 0, 1 and 2
    answer: Only 0 and 1
    difficulty: 1
    hints:
    - Each place can hold less than the base.
    - 'Base 2: digits below 2.'
    solution: In base b the digits go from 0 to b − 1, so base 2 uses 0 and 1.
    mistakes: {"1 and 2": "t8_base_digits", "0, 1 and 2": "t8_base_digits"}
  - prompt: Write the binary number 10110₂ in base 10.
    answer: '22'
    check: 16 + 4 + 2
    difficulty: 2
    hints:
    - The places from the right are 1, 2, 4, 8, 16.
    - Add the places that have a 1.
    solution: 'Step 1: places 16, 8, 4, 2, 1. Step 2: the 1s are in the 16, 4 and 2 places. Step 3: 16 + 4 + 2 = 22.'
    mistakes:
      '10110': c8m3_base_places
      '3': t8_binary_places
  - prompt: Write 25 in binary. Type the digits.
    answer: '11001'
    check: '11001'
    difficulty: 3
    hints:
    - 'Powers of 2: 16, 8, 4, 2, 1.'
    - 25 = 16 + 8 + 1.
    solution: 'Step 1: 16 fits, 9 left. Step 2: 8 fits, 1 left. Step 3: 4 and 2 do not fit. Step 4: 1 fits. So 25 = 11001₂.'
    mistakes:
      '10011': c8m3_to_base
      '25': c8m3_to_base
  - prompt: Write the base-4 number 123₄ in base 10.
    answer: '27'
    check: 1*16 + 2*4 + 3
    difficulty: 2
    hints:
    - In base 4 the places are 1, 4, 16.
    - 1 × 16 + 2 × 4 + 3 × 1.
    solution: 'Step 1: places 16, 4, 1. Step 2: 16 + 8 + 3 = 27.'
    mistakes:
      '123': c8m3_base_places
      '6': c8m3_base_places
  - prompt: What is the place value of 4 in 3,48,215?
    answer: '40000'
    check: 4*10**4
    difficulty: 1
    hints:
    - Count the places from the right.
    - The 4 is fifth from the right.
    solution: 'From the right: 5 ones, 1 ten, 2 hundreds, 8 thousands, 4 ten thousands. So the 4 is worth 40,000.'
    mistakes:
      '4': c8_face_value
      '4000': c8m3_count_places
  - prompt: Write 7 in base 2.
    answer: '111'
    check: '111'
    difficulty: 1
    hints:
    - 'Powers of 2: 4, 2, 1.'
    - 7 = 4 + 2 + 1.
    solution: '7 = 4 + 2 + 1, so every place gets a 1: 111₂.'
    mistakes:
      '7': c8m3_to_base
      '1110': c8m3_to_base
  - prompt: What is the largest 3-digit base-5 number, written in base 10?
    answer: '124'
    check: 5**3 - 1
    difficulty: 3
    hints:
    - The biggest digit in base 5 is 4.
    - Work out 444₅ with places 25, 5, 1.
