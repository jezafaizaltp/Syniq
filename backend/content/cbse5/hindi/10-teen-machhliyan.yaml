subject: cbse5-hin
chapter: 10
title: तीन मछलियाँ
concepts:
- code: cbse5h.v10.machhliyan
  title: तीन मछलियाँ
  notes: |
    पंचतंत्र की कहानी। एक तालाब में तीन मछलियाँ रहती थीं। एक दिन मछुआरों ने कहा कि कल यहाँ जाल डालेंगे। पहली मछली
    (दूरदर्शी, पहले से सोचने वाली) उसी रात दूसरे तालाब में चली गई। दूसरी (समय पर सूझ वाली) रुकी, पर जाल में फँसने पर
    मरी होने का नाटक करके बच निकली। तीसरी ने कहा 'जो होगा देखा जाएगा' और कुछ नहीं किया, वह जाल में फँस गई।
    सीख: मुसीबत आने से पहले सोचें और समय पर सही कदम उठाएँ; भाग्य के भरोसे बैठे न रहें।
  explanations:
    text: एक तालाब में तीन मछलियाँ थीं। मछुआरों के आने की बात सुनकर पहली मछली पहले ही दूसरे तालाब में चली गई। दूसरी जाल में फँसी, पर मरी होने का नाटक करके बच गई। तीसरी ने कुछ नहीं किया और पकड़ी गई।
    visual: 'चित्र बनाइए: तीन मछलियाँ: पहली नहर से दूसरे तालाब की ओर तैर रही है, दूसरी जाल में उलटी पड़ी नाटक कर रही है, तीसरी जाल में फँसी है।'
    step_by_step: '1. पात्र: तीन मछलियाँ और मछुआरे। 2. ख़तरा: कल जाल डाला जाएगा। 3. हर मछली ने क्या किया? 4. किसका क्या हुआ? 5. सीख।'
    real_world: परीक्षा की तैयारी पहले से करना पहली मछली जैसा है; आख़िरी दिन तक कुछ न करना तीसरी मछली जैसा।
  picture:
    kind: compare
    columns:
    - title: मछली
      points:
      - पहली
      - दूसरी
      - तीसरी
    - title: क्या किया और क्या हुआ
      points:
      - पहले ही चली गई, बच गई
      - मरने का नाटक किया, बच गई
      - कुछ नहीं किया, पकड़ी गई
    alt: पहली मछली पहले ही चली गई और बच गई, दूसरी ने मरने का नाटक किया और बच गई, तीसरी ने कुछ नहीं किया और पकड़ी गई।
  items:
  - prompt: '''तीन मछलियाँ'' कहानी किस पुस्तक से है?'
    options:
    - पंचतंत्र
    - रामायण
    - महाभारत
    - गीतांजलि
    answer: पंचतंत्र
    difficulty: 1
    hints:
    - जानवरों की शिक्षाप्रद कहानियाँ।
    - पाँच तंत्र।
    solution: यह पंचतंत्र की कहानी है।
    mistakes:
      रामायण: hin5_read_again
  - prompt: मछुआरों की बात सुनकर पहली मछली ने क्या किया?
    options:
    - उसी रात दूसरे तालाब में चली गई
    - सो गई
    - मछुआरों से लड़ी
    - जाल में कूद गई
    answer: उसी रात दूसरे तालाब में चली गई
    difficulty: 1
    hints:
    - वह पहले से सोचती थी।
    - ख़तरे से दूर।
    solution: पहली मछली पहले ही चली गई।
  - prompt: दूसरी मछली जाल से कैसे बची?
    options:
    - मरी होने का नाटक करके
    - जाल काटकर
    - उड़कर
    - मछुआरे से बात करके
    answer: मरी होने का नाटक करके
    difficulty: 2
    hints:
    - मछुआरे ने उसे फेंक दिया।
    - नाटक।
    solution: वह मरी होने का नाटक करके बच गई।
  - prompt: तीसरी मछली का क्या हुआ?
    options:
    - वह जाल में पकड़ी गई
    - वह बच गई
    - वह उड़ गई
    - वह राजा बन गई
    answer: वह जाल में पकड़ी गई
    difficulty: 1
    hints:
    - उसने कुछ नहीं किया।
    - '''जो होगा देखा जाएगा''।'
    solution: कुछ न करने से वह पकड़ी गई।
  - prompt: इस कहानी की सीख क्या है?
    options:
    - मुसीबत आने से पहले सोचकर कदम उठाओ
    - भाग्य के भरोसे बैठे रहो
    - हमेशा सोते रहो
    - दोस्तों की बात मत सुनो
    answer: मुसीबत आने से पहले सोचकर कदम उठाओ
    difficulty: 2
    hints:
    - कौन-सी मछली सबसे आराम से बची?
    - पहली।
    solution: पहले से सोचकर सही कदम उठाने वाला बचता है।
    mistakes:
      भाग्य के भरोसे बैठे रहो: hin5_lesson
  - prompt: '''मछुआरा'' किसे कहते हैं?'
    options:
    - मछली पकड़ने वाले को
    - मछली बेचने वाले बाज़ार को
    - तालाब को
    - नाव को
    answer: मछली पकड़ने वाले को
    difficulty: 1
    hints:
    - जाल डालता है।
    - मछली + आरा।
    solution: मछली पकड़ने वाला मछुआरा है।
    mistakes:
      तालाब को: hin5_word
