    - ख़तरे से दूर।
    solution: पहली मछली पहले ही चली गई।
    mistakes: {"चुपचाप तालाब के तले में सो गई": "h5_machhli1", "बाहर आकर मछुआरों से लड़ने लगी": "h5_machhli1", "ख़ुद ही उछलकर जाल में कूद गई": "h5_machhli1"}
  - prompt: दूसरी मछली जाल से कैसे बची?
