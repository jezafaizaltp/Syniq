subject: cbse5-hin
chapter: 10
title: तीन मछलियाँ
tips:
  h5_machhli1: "पहली मछली सबसे दूरदर्शी थी: ख़तरा आने से पहले ही उसने क्या किया?"
  h5_machhli2: "दूसरी मछली ने मुसीबत में दिमाग़ लगाया। मछुआरा कौन-सी मछली जाल से बाहर फेंक देता है?"
  h5_machhli3: "तीसरी मछली ने कहा, 'जो होगा देखा जाएगा' और कुछ नहीं किया। जाल आया तो क्या हुआ होगा?"
  c5h10_soch: 'तीनों मछलियों की तुलना करो: किसने पहले सोचा, किसने समय पर सोचा, किसने सोचा ही नहीं?'
  c5h10_kahani: 'कहानी का क्रम याद करो: मछुआरों ने क्या कहा, और उसके बाद हर मछली ने क्या किया?'
  c5h10_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse5h.v10.machhliyan
  title: तीन मछलियाँ
  notes: |
    पंचतंत्र की कहानी। एक तालाब में तीन मछलियाँ रहती थीं। एक दिन मछुआरों ने कहा कि कल यहाँ जाल डालेंगे। पहली मछली
    (दूरदर्शी, पहले से सोचने वाली) उसी रात दूसरे तालाब में चली गई। दूसरी (समय पर सूझ वाली) रुकी, पर जाल में फँसने पर
    मरी होने का नाटक करके बच निकली। तीसरी ने कहा 'जो होगा देखा जाएगा' और कुछ नहीं किया, वह जाल में फँस गई।
    सीख: मुसीबत आने से पहले सोचें और समय पर सही कदम उठाएँ; भाग्य के भरोसे बैठे न रहें।
  explanations:
    text: एक तालाब में तीन मछलियाँ थीं। मछुआरों के आने की बात सुनकर पहली मछली पहले ही दूसरे तालाब में चली गई। दूसरी जाल में फँसी, पर मरी होने का नाटक करके बच गई। तीसरी ने कुछ नहीं किया और पकड़ी गई।
    visual: 'चित्र बनाइए: तीन मछलियाँ: पहली नहर से दूसरे तालाब की ओर तैर रही है, दूसरी जाल में उलटी पड़ी नाटक कर रही है, तीसरी जाल में फँसी है।'
    step_by_step: '1. पात्र: तीन मछलियाँ और मछुआरे। 2. ख़तरा: कल जाल डाला जाएगा। 3. हर मछली ने क्या किया? 4. किसका क्या हुआ? 5. सीख।'
    real_world: परीक्षा की तैयारी पहले से करना पहली मछली जैसा है; आख़िरी दिन तक कुछ न करना तीसरी मछली जैसा।
  picture:
    kind: compare
    columns:
    - title: मछली
      points:
      - पहली
      - दूसरी
      - तीसरी
    - title: क्या किया और क्या हुआ
      points:
      - पहले ही चली गई, बच गई
      - मरने का नाटक किया, बच गई
      - कुछ नहीं किया, पकड़ी गई
    alt: पहली मछली पहले ही चली गई और बच गई, दूसरी ने मरने का नाटक किया और बच गई, तीसरी ने कुछ नहीं किया और पकड़ी गई।
  activity:
    type: sort
    prompt: तीनों मछलियों ने क्या किया?
    bins:
    - पहली (पहले से सोचने वाली)
    - दूसरी (समय पर सूझ)
    - तीसरी (जो होगा देखा जाएगा)
    items:
    - label: उसी रात दूसरे तालाब में चली गई
      bin: पहली (पहले से सोचने वाली)
      clue: जाल डलने से पहले ही कौन निकल गई?
      why: मुसीबत से पहले कदम उठाया।
    - label: मरी होने का नाटक करके बची
      bin: दूसरी (समय पर सूझ)
      clue: जाल में फँसकर भी कौन बच निकली?
      why: समय पर सूझ से बची।
    - label: कुछ नहीं किया, जाल में फँस गई
      bin: तीसरी (जो होगा देखा जाएगा)
      clue: किसने भाग्य के भरोसे सब छोड़ा?
      why: कुछ न करने का नतीजा।
    - label: मछुआरों की बात सुनकर भी रुकी रही
      bin: तीसरी (जो होगा देखा जाएगा)
      clue: किसने चेतावनी को अनसुना किया?
      why: '''जो होगा देखा जाएगा'' कहकर रुकी रही।'
  lesson:
    - teach: '''तीन मछलियाँ'' पंचतंत्र की कहानी है। एक तालाब में तीन मछलियाँ रहती थीं। एक दिन मछुआरों ने कहा: कल यहाँ आकर जाल डालेंगे। तीनों ने यह बात सुनी।'
      check:
        prompt: मछुआरों ने क्या कहा?
        options:
        - कल यहाँ जाल डालेंगे
        - यह तालाब सूख जाएगा
        - यहाँ नई मछलियाँ छोड़ेंगे
        answer: कल यहाँ जाल डालेंगे
        why: यही खबर तीनों मछलियों के लिए खतरा थी।
      ways:
      - style: visual
        teach: 'कहानी की शुरुआत: कौन, कहाँ, और कौन-सी ख़बर सुनी गई।'
        picture:
          kind: flow
          steps:
          - एक तालाब में तीन मछलियाँ रहती थीं
          - किनारे पर मछुआरे आए
          - 'उन्होंने कहा: कल यहाँ जाल डालेंगे'
          - तीनों मछलियों ने यह बात सुन ली
          alt: एक तालाब में तीन मछलियाँ रहती थीं। किनारे पर मछुआरे आए और बोले कि कल यहाँ जाल डालेंगे। तीनों मछलियों ने यह बात सुन ली।
      - style: real_world
        teach: मौसम विभाग जब बताता है कि कल भारी बारिश और तूफ़ान आएगा, तो समझदार लोग पहले से तैयारी करते हैं। मछुआरे भी ऐसी चेतावनी सुनकर समुद्र में नाव नहीं ले जाते।
    - teach: तीनों ने अलग-अलग किया। पहली ने पहले से सोचा और उसी रात दूसरे तालाब में चली गई। दूसरी रुकी, पर जाल में फँसने पर मरी होने का नाटक करके बच गई। तीसरी ने कहा 'जो होगा देखा जाएगा', और फँस गई।
      picture:
        kind: compare
        columns:
        - title: पहली मछली
          points:
          - पहले से सोचा
          - रात में दूसरे तालाब गई
          - सुरक्षित
        - title: दूसरी मछली
          points:
          - रुक गई
          - समय पर उपाय सोचा
          - बच निकली
        - title: तीसरी मछली
          points:
          - '''जो होगा देखा जाएगा'''
          - कुछ नहीं किया
          - जाल में फँसी
        alt: तीन मछलियों के काम और नतीजे की तुलना।
      check:
        prompt: कौन-सी मछली खतरा आने से पहले ही बच गई?
        options:
        - पहली
        - दूसरी
        - तीसरी
        answer: पहली
        why: वह खतरे से पहले ही दूसरे तालाब में चली गई।
      ways:
      - style: step_by_step
        teach: 'तीनों मछलियों की तुलना करो। पहला: ख़तरे की बात सबने एक साथ सुनी। दूसरा: पहली ने उसी समय सोचकर जगह बदल ली। तीसरी ने ध्यान नहीं दिया। चौथा: अब सोचो, किसकी आदत अपनानी चाहिए?'
      - style: real_world
        teach: बस छूटने के डर से कुछ बच्चे रात को ही बस्ता तैयार कर लेते हैं, कुछ सुबह जल्दी-जल्दी करते हैं, और कुछ सोते रहते हैं। तीनों मछलियों जैसे लोग हमारे आस-पास भी होते हैं।
    - teach: 'सीख: मुसीबत आने से पहले सोचो और समय पर सही कदम उठाओ। ''जो होगा देखा जाएगा'' कहकर भाग्य के भरोसे बैठे रहना ठीक नहीं। पहले से सोचने वाले को दूरदर्शी कहते हैं।'
      check:
        prompt: पहले से सोचकर काम करने वाले को क्या कहते हैं?
        options:
        - दूरदर्शी
        - आलसी
        - डरपोक
        answer: दूरदर्शी
        why: दूर (आगे) की बात देखने-सोचने वाला दूरदर्शी।
      ways:
      - style: visual
        teach: दूरदर्शी और भाग्य के भरोसे बैठने वाले में अंतर देखो।
        picture:
          kind: compare
          columns:
          - title: दूरदर्शी
            points:
            - ख़तरा आने से पहले सोचता है
            - समय पर क़दम उठाता है
            - सुरक्षित रहता है
          - title: भाग्य के भरोसे
            points:
            - '''जो होगा देखा जाएगा'' कहता है'
            - कुछ नहीं करता
            - मुसीबत में फँस जाता है
          alt: दूरदर्शी ख़तरा आने से पहले सोचता है, समय पर क़दम उठाता है और सुरक्षित रहता है। भाग्य के भरोसे बैठने वाला 'जो होगा देखा जाएगा' कहता है, कुछ नहीं करता और मुसीबत में फँस जाता है।
      - style: real_world
        teach: चींटियाँ गर्मियों में ही अनाज के दाने इकट्ठे करके अपने बिल में रख लेती हैं, ताकि बारिश के दिनों में भूखा न रहना पड़े। यह भी दूर की सोच है।
  items:
  - prompt: '''तीन मछलियाँ'' कहानी किस पुस्तक से है?'
    options:
