subject: cbse5-hin
chapter: 3
title: चाँद का कुर्ता
tips:
  h5_amavas: "पूर्णिमा को पूरा गोल चाँद दिखता है। दोपहर और सुबह रातें नहीं हैं। चाँद न दिखने वाली रात का नाम?"
  h5_chaand_kurta: "कविता का नाम ही पढ़ो: 'चाँद का ___'।"
  h5_chaand_thand: "चाँद रात भर खुले आसमान में घूमता है। सर्दी की रात में बिना कपड़ों के कैसा लगेगा?"

concepts:
- code: cbse5h.v3.chaand
  title: चाँद का कुर्ता
  notes: |
    रामधारी सिंह 'दिनकर' की कविता (इसी नाम की प्रसिद्ध बाल कविता)। चाँद अपनी माँ से कहता है कि ठंड लगती है, मेरे लिए
    ऊन का मोटा कुर्ता सिलवा दो। माँ कहती है कि बेटा, तू तो कभी पूरा गोल हो जाता है, कभी आधा, कभी पतली लकीर, और
    एक दिन दिखता ही नहीं: तेरा नाप रोज़ बदलता है, तो कौन-से नाप का कुर्ता सिलूँ? कविता चाँद की कलाओं को मज़ेदार ढंग से
    बताती है।
  explanations:
    text: 'इस कविता में चाँद अपनी माँ से ठंड से बचने के लिए कुर्ता माँगता है। माँ हँसकर कहती है कि तेरा नाप तो रोज़ बदलता है: कभी तू पूरा गोल, कभी आधा, कभी पतला, और कभी दिखता ही नहीं। तो किस नाप का कुर्ता बनाऊँ?'
    visual: 'चित्र बनाइए: आसमान में चाँद के कई रूप एक पंक्ति में: पतली लकीर, आधा चाँद, पूरा गोल चाँद। बगल में दर्ज़ी का फ़ीता लिए माँ उलझन में।'
    step_by_step: 1. कौन किससे बात करता है? चाँद अपनी माँ से। 2. चाँद क्या माँगता है? कुर्ता। 3. क्यों? ठंड लगती है। 4. माँ क्यों नहीं सिल पाती? नाप रोज़ बदलता है।
    real_world: 'रात को हर दिन चाँद देखिए: पूर्णिमा को गोल, अमावस्या को गायब। यही चाँद की कलाएँ हैं।'
  picture:
    kind: flow
    steps:
    - 'अमावस्या: चाँद नहीं दिखता'
    - पतली लकीर
    - आधा चाँद
    - 'पूर्णिमा: पूरा गोल'
    alt: 'चाँद का रूप बदलता है: अमावस्या पर दिखता नहीं, फिर पतली लकीर, फिर आधा, और पूर्णिमा पर पूरा गोल।'
  items:
  - prompt: '''चाँद का कुर्ता'' कविता के कवि कौन हैं?'
    options:
    - रामधारी सिंह 'दिनकर'
    - सूरदास
    - प्रेमचंद
    - तुलसीदास
    answer: रामधारी सिंह 'दिनकर'
    difficulty: 2
    hints:
    - राष्ट्रकवि।
    - दिनकर = सूरज।
    solution: यह कविता दिनकर जी की है।
    mistakes:
      प्रेमचंद: hin5_read_again
  - prompt: चाँद अपनी माँ से क्या माँगता है?
    options:
    - कुर्ता
    - खिलौना
    - मिठाई
    - किताब
    answer: कुर्ता
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - पहनने की चीज़।
    solution: चाँद कुर्ता माँगता है।
    mistakes: {"खिलौना": "h5_chaand_kurta", "मिठाई": "h5_chaand_kurta", "किताब": "h5_chaand_kurta"}
  - prompt: चाँद कुर्ता क्यों चाहता है?
    options:
    - उसे ठंड लगती है
    - उसे शादी में जाना है
    - उसका कुर्ता फट गया
    - उसे गर्मी लगती है
    answer: उसे ठंड लगती है
    difficulty: 1
    hints:
    - रात में आसमान में ...
    - ऊन का कुर्ता।
    solution: रात की ठंड से बचने के लिए।
    mistakes: {"उसे शादी में जाना है": "h5_chaand_thand", "उसका कुर्ता फट गया": "h5_chaand_thand", "उसे गर्मी लगती है": "h5_chaand_thand"}
  - prompt: माँ कुर्ता क्यों नहीं सिल पाती?
    options:
    - चाँद का नाप रोज़ बदलता है
    - माँ के पास कपड़ा नहीं
    - दर्ज़ी बीमार है
    - चाँद बहुत बड़ा है
    answer: चाँद का नाप रोज़ बदलता है
    difficulty: 1
    hints:
    - कभी गोल, कभी आधा।
    - नाप।
    solution: चाँद का आकार रोज़ बदलता है।
    mistakes:
      चाँद बहुत बड़ा है: hin5_read_again
  - prompt: जिस रात चाँद बिल्कुल नहीं दिखता, उसे क्या कहते हैं?
    options:
    - अमावस्या
    - पूर्णिमा
    - दोपहर
    - सुबह
    answer: अमावस्या
    difficulty: 2
    hints:
    - दीवाली इसी रात होती है।
    - पूर्णिमा का उलटा।
    solution: चाँद न दिखने वाली रात अमावस्या है।
    mistakes: {"पूर्णिमा": "h5_amavas", "दोपहर": "h5_amavas", "सुबह": "h5_amavas"}
  - prompt: '''नाप'' शब्द का अर्थ है:'
    options:
    - माप, आकार
    - नाम
    - नींद
    - नदी
    answer: माप, आकार
    difficulty: 2
    hints:
    - दर्ज़ी लेता है।
    - फ़ीते से।
    solution: नाप यानी माप या आकार।
    mistakes:
      नाम: hin5_word
