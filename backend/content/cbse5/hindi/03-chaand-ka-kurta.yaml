subject: cbse5-hin
chapter: 3
title: चाँद का कुर्ता
tips:
  h5_amavas: "पूर्णिमा को पूरा गोल चाँद दिखता है। दोपहर और सुबह रातें नहीं हैं। चाँद न दिखने वाली रात का नाम?"
  h5_chaand_kurta: "कविता का नाम ही पढ़ो: 'चाँद का ___'।"
  h5_chaand_thand: "चाँद रात भर खुले आसमान में घूमता है। सर्दी की रात में बिना कपड़ों के कैसा लगेगा?"
  c5h3_kala: 'आसमान में चाँद को कुछ रातों तक देखो: क्या वह हर रात एक जैसा दिखता है?'
  c5h3_kavita: कविता में दो पात्र बात कर रहे हैं। कौन माँग रहा है और कौन जवाब दे रहा है?
  c5h3_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse5h.v3.chaand
  title: चाँद का कुर्ता
  notes: |
    रामधारी सिंह 'दिनकर' की कविता (इसी नाम की प्रसिद्ध बाल कविता)। चाँद अपनी माँ से कहता है कि ठंड लगती है, मेरे लिए
    ऊन का मोटा कुर्ता सिलवा दो। माँ कहती है कि बेटा, तू तो कभी पूरा गोल हो जाता है, कभी आधा, कभी पतली लकीर, और
    एक दिन दिखता ही नहीं: तेरा नाप रोज़ बदलता है, तो कौन-से नाप का कुर्ता सिलूँ? कविता चाँद की कलाओं को मज़ेदार ढंग से
    बताती है।
  explanations:
    text: 'इस कविता में चाँद अपनी माँ से ठंड से बचने के लिए कुर्ता माँगता है। माँ हँसकर कहती है कि तेरा नाप तो रोज़ बदलता है: कभी तू पूरा गोल, कभी आधा, कभी पतला, और कभी दिखता ही नहीं। तो किस नाप का कुर्ता बनाऊँ?'
    visual: 'चित्र बनाइए: आसमान में चाँद के कई रूप एक पंक्ति में: पतली लकीर, आधा चाँद, पूरा गोल चाँद। बगल में दर्ज़ी का फ़ीता लिए माँ उलझन में।'
    step_by_step: 1. कौन किससे बात करता है? चाँद अपनी माँ से। 2. चाँद क्या माँगता है? कुर्ता। 3. क्यों? ठंड लगती है। 4. माँ क्यों नहीं सिल पाती? नाप रोज़ बदलता है।
    real_world: 'रात को हर दिन चाँद देखिए: पूर्णिमा को गोल, अमावस्या को गायब। यही चाँद की कलाएँ हैं।'
  picture:
    kind: flow
    steps:
    - 'अमावस्या: चाँद नहीं दिखता'
    - पतली लकीर
    - आधा चाँद
    - 'पूर्णिमा: पूरा गोल'
    alt: 'चाँद का रूप बदलता है: अमावस्या पर दिखता नहीं, फिर पतली लकीर, फिर आधा, और पूर्णिमा पर पूरा गोल।'
  activity:
    type: order
    prompt: माँ कहती हैं, चाँद का नाप रोज़ बदलता है। पूरे चाँद से शुरू करके क्रम से लगाओ।
    steps:
    - पूरा गोल चाँद
    - आधा चाँद
    - पतली लकीर-सा चाँद
    - चाँद दिखता ही नहीं
    reasons:
      आधा चाँद: पूरे गोल से घटते-घटते पहले आधा होता है।
      पतली लकीर-सा चाँद: आधे से और घटकर पतली लकीर।
      चाँद दिखता ही नहीं: 'लकीर भी घटकर गायब हो जाती है: अमावस।'
  lesson:
    - teach: '''चाँद का कुर्ता'' रामधारी सिंह ''दिनकर'' की बाल कविता है। इसमें चाँद एक बच्चे की तरह अपनी माँ से बात करता है: ''माँ, रात को ठंड लगती है, मेरे लिए ऊन का मोटा कुर्ता सिलवा दो।'''
      check:
        prompt: कविता में चाँद किससे बात करता है?
        options:
        - अपनी माँ से
        - सूरज से
        - तारों से
        answer: अपनी माँ से
        why: चाँद बच्चे की तरह माँ से कुर्ता माँगता है।
      ways:
      - style: visual
        teach: कविता में कौन बोल रहा है और कौन जवाब दे रहा है, दो हिस्सों में देखो।
        picture:
          kind: compare
          columns:
          - title: चाँद (बच्चे की तरह)
            points:
            - माँ से बात करता है
            - ठंड की शिकायत करता है
            - कुर्ता माँगता है
          - title: माँ
            points:
            - बेटे की बात सुनती है
            - नाप के बारे में सोचती है
            - मुश्किल में पड़ जाती है
          alt: कविता में चाँद एक बच्चे की तरह माँ से बात करता है, ठंड की शिकायत करता है और कुर्ता माँगता है। माँ बेटे की बात सुनती है, नाप के बारे में सोचती है और मुश्किल में पड़ जाती है।
      - style: real_world
        teach: सर्दियों की रात में छत पर खड़े हो तो हवा ठंडी लगती है। कवि ने सोचा कि रात भर आसमान में घूमने वाले चाँद को भी ठंड लगती होगी, और इसी कल्पना से कविता बनी।
    - teach: माँ मुश्किल में है। चाँद कभी पूरा गोल होता है, कभी आधा, कभी पतली लकीर, और एक रात बिल्कुल नहीं दिखता। इन बदलते रूपों को चाँद की कलाएँ कहते हैं।
      picture:
        kind: flow
        steps:
        - पूरा गोल (पूर्णिमा)
        - आधा चाँद
        - पतली लकीर
        - बिल्कुल नहीं दिखता (अमावस्या)
        alt: चाँद का रूप पूरे गोल से पतली लकीर और फिर न दिखने तक बदलता है।
      check:
        prompt: चाँद के बदलते रूपों को क्या कहते हैं?
        options:
        - चाँद की कलाएँ
        - चाँद के कपड़े
        - चाँद के तारे
        answer: चाँद की कलाएँ
        why: हर रात दिखने वाला अलग रूप एक कला है।
      ways:
      - style: step_by_step
        teach: 'चाँद के बदलते रूप एक कागज़ पर बनाओ। पहला: एक पूरा गोल चाँद। दूसरा: उसके आगे आधा चाँद। तीसरा: फिर पतली लकीर जैसा चाँद। चौथा: आख़िर में एक ख़ाली गोला, जब चाँद दिखता ही नहीं।'
      - style: real_world
        teach: कई त्योहार चाँद देखकर तय होते हैं। ईद पर लोग पतला नया चाँद देखने का इंतज़ार करते हैं, और करवा चौथ पर भी चाँद निकलने की राह देखी जाती है।
    - teach: 'इसलिए माँ कहती है: तेरा नाप रोज़ बदलता है, तो किस नाप का कुर्ता सिलूँ? कविता मज़ेदार ढंग से एक विज्ञान की बात भी सिखा देती है।'
      check:
        prompt: माँ चाँद का कुर्ता क्यों नहीं बना पाती?
        options:
        - चाँद का नाप रोज़ बदलता है
        - माँ के पास ऊन नहीं है
        - चाँद को कुर्ता पसंद नहीं
        answer: चाँद का नाप रोज़ बदलता है
        why: 'कभी गोल, कभी आधा: एक नाप तय ही नहीं होता।'
      ways:
      - style: visual
        teach: 'माँ कुर्ता क्यों नहीं सिल पाती: एक के बाद एक बात जुड़ती जाती है।'
        picture:
          kind: flow
          steps:
          - चाँद कुर्ता माँगता है
          - माँ नाप लेने की सोचती है
          - पर चाँद का आकार रोज़ बदलता है
          - कल का नाप आज ठीक नहीं बैठता
          - इसलिए कुर्ता सिलना मुश्किल है
          alt: चाँद कुर्ता माँगता है और माँ नाप लेने की सोचती है। पर चाँद का आकार रोज़ बदलता है, कल का नाप आज ठीक नहीं बैठता, इसलिए कुर्ता सिलना मुश्किल है।
      - style: real_world
        teach: 'बढ़ते बच्चों के कपड़े भी जल्दी छोटे हो जाते हैं, इसलिए कई माता-पिता थोड़े बड़े नाप के कपड़े लेते हैं। चाँद की मुश्किल तो और बड़ी है: उसका नाप हर रात बदल जाता है।'
  items:
  - prompt: '''चाँद का कुर्ता'' कविता के कवि कौन हैं?'
    options:
    - रामधारी सिंह 'दिनकर'
    - सूरदास
    - प्रेमचंद
    - तुलसीदास
    answer: रामधारी सिंह 'दिनकर'
    difficulty: 2
    hints:
    - राष्ट्रकवि।
    - दिनकर = सूरज।
    solution: यह कविता दिनकर जी की है।
    mistakes:
      प्रेमचंद: hin5_read_again
  - prompt: चाँद अपनी माँ से क्या माँगता है?
    options:
    - कुर्ता
    - खिलौना
    - मिठाई
    - किताब
    answer: कुर्ता
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - पहनने की चीज़।
    solution: चाँद कुर्ता माँगता है।
    mistakes: {"खिलौना": "h5_chaand_kurta", "मिठाई": "h5_chaand_kurta", "किताब": "h5_chaand_kurta"}
  - prompt: चाँद कुर्ता क्यों चाहता है?
    options:
    - उसे ठंड लगती है
    - उसे शादी में जाना है
    - उसका कुर्ता फट गया
    - उसे गर्मी लगती है
    answer: उसे ठंड लगती है
    difficulty: 1
    hints:
    - रात में आसमान में ...
    - ऊन का कुर्ता।
    solution: रात की ठंड से बचने के लिए।
    mistakes: {"उसे शादी में जाना है": "h5_chaand_thand", "उसका कुर्ता फट गया": "h5_chaand_thand", "उसे गर्मी लगती है": "h5_chaand_thand"}
  - prompt: माँ कुर्ता क्यों नहीं सिल पाती?
    options:
    - चाँद का नाप रोज़ बदलता है
    - माँ के पास कपड़ा नहीं
    - दर्ज़ी बीमार है
    - चाँद बहुत बड़ा है
    answer: चाँद का नाप रोज़ बदलता है
    difficulty: 1
    hints:
    - कभी गोल, कभी आधा।
    - नाप।
    solution: चाँद का आकार रोज़ बदलता है।
    mistakes:
      चाँद बहुत बड़ा है: hin5_read_again
  - prompt: जिस रात चाँद बिल्कुल नहीं दिखता, उसे क्या कहते हैं?
    options:
    - अमावस्या
    - पूर्णिमा
    - दोपहर
    - सुबह
    answer: अमावस्या
    difficulty: 2
    hints:
    - दीवाली इसी रात होती है।
    - पूर्णिमा का उलटा।
    solution: चाँद न दिखने वाली रात अमावस्या है।
    mistakes: {"पूर्णिमा": "h5_amavas", "दोपहर": "h5_amavas", "सुबह": "h5_amavas"}
  - prompt: '''नाप'' शब्द का अर्थ है:'
    options:
    - माप, आकार
    - नाम
    - नींद
    - नदी
    answer: माप, आकार
    difficulty: 2
    hints:
    - दर्ज़ी लेता है।
    - फ़ीते से।
    solution: नाप यानी माप या आकार।
    mistakes:
      नाम: hin5_word
  - prompt: चाँद किस चीज़ का कुर्ता सिलवाना चाहता है?
    options:
    - ऊन का
    - कागज़ का
    - पत्तों का
    answer: ऊन का
    difficulty: 1
    hints:
    - चाँद को ठंड लगती है।
    - सर्दी में स्वेटर किससे बनता है?
    solution: 'चरण 1: ठंड से बचने के लिए गर्म कपड़ा चाहिए। चरण 2: चाँद ऊन का मोटा कुर्ता माँगता है।'
    mistakes:
      कागज़ का: c5h3_kavita
      पत्तों का: c5h3_kavita
  - prompt: जिस रात चाँद पूरा गोल दिखता है, उसे क्या कहते हैं?
    options:
    - पूर्णिमा
    - अमावस्या
    - दोपहर
    answer: पूर्णिमा
    difficulty: 2
    hints:
    - शब्द में 'पूर्ण' छिपा है।
    - पूर्ण का अर्थ है पूरा।
    solution: 'चरण 1: पूर्ण = पूरा। चरण 2: पूरे गोल चाँद की रात पूर्णिमा है।'
    mistakes:
      अमावस्या: c5h3_kala
      दोपहर: c5h3_kala
  - prompt: कविता में चाँद किसकी तरह बात करता है?
    options:
    - एक बच्चे की तरह
    - एक राजा की तरह
    - एक शिक्षक की तरह
    answer: एक बच्चे की तरह
    difficulty: 1
    hints:
    - वह अपनी माँ से ज़िद करता है।
    - माँ से चीज़ माँगने वाला कौन होता है?
    solution: 'चरण 1: चाँद माँ से कुर्ता माँगता है। चरण 2: वह बच्चे की तरह बात करता है।'
    mistakes:
      एक राजा की तरह: c5h3_kavita
      एक शिक्षक की तरह: c5h3_kavita
  - prompt: '''सिलना'' शब्द से जुड़ा काम कौन करता है?'
    options:
    - दर्ज़ी
    - किसान
    - माली
    answer: दर्ज़ी
    difficulty: 1
    hints:
    - कपड़े सिलने वाला व्यक्ति।
    - सुई-धागा किसके पास होता है?
    solution: 'चरण 1: सिलना = सुई-धागे से कपड़ा जोड़ना। चरण 2: यह काम दर्ज़ी करता है।'
    mistakes:
      किसान: c5h3_shabd
      माली: c5h3_shabd
  - prompt: पूरे गोल चाँद के बाद चाँद धीरे-धीरे कैसा होता जाता है?
    options:
    - छोटा होता जाता है
    - और बड़ा होता जाता है
    - हरा हो जाता है
    answer: छोटा होता जाता है
    difficulty: 2
    hints:
    - गोल से आधा, आधे से लकीर।
    - अंत में चाँद दिखता ही नहीं।
    solution: 'चरण 1: गोल के बाद आधा, फिर पतली लकीर। चरण 2: यानी चाँद छोटा होता जाता है।'
    mistakes:
      और बड़ा होता जाता है: c5h3_kala
      हरा हो जाता है: c5h3_kala
  - prompt: '''ठंड'' शब्द का विलोम है:'
    options:
    - गर्मी
    - सर्दी
    - बर्फ़
    answer: गर्मी
    difficulty: 1
    hints:
    - विलोम = उलटा अर्थ।
    - मई-जून के महीने कैसे होते हैं?
