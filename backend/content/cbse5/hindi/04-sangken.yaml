subject: cbse5-hin
chapter: 4
title: साङकेन
tips:
  h5_buddh: "साङकेन अरुणाचल के खाम्ती लोग मनाते हैं, जो बौद्ध धर्म मानते हैं। उनके मंदिरों (विहारों) में किसकी मूर्ति होती है?"
  h5_naya_saal: "साङकेन अप्रैल में आता है, जैसे विषु, बैसाखी और बिहू। ये सब किस चीज़ की शुरुआत मनाते हैं?"
  h5_sangken: "रंग होली में डालते हैं। साङकेन गर्मी में आता है; ठंडक के लिए लोग एक-दूसरे पर क्या छिड़कते हैं?"
  h5_vishu: "बिहू असम का, बैसाखी पंजाब का, पोंगल तमिलनाडु का। केरल में नए साल की सुबह 'कणी' देखते हैं।"

concepts:
- code: cbse5h.v4.sangken
  title: साङकेन
  notes: |
    साङकेन (सांगकेन) अरुणाचल प्रदेश का त्योहार है, जिसे खाम्ती समुदाय के लोग नए साल के रूप में मनाते हैं, आमतौर पर
    अप्रैल में। इसमें भगवान बुद्ध की मूर्तियों को जल से स्नान कराया जाता है और लोग एक-दूसरे पर पानी डालकर खुशी मनाते
    हैं; पानी को पवित्रता और शुभता का प्रतीक माना जाता है। घर साफ़ किए जाते हैं, पकवान बनते हैं। (पाठ की ठीक बातें
    छपी पुस्तक से मिलानी हैं।)
  explanations:
    text: साङकेन अरुणाचल प्रदेश का पानी का त्योहार है। खाम्ती लोग इसे नए साल के रूप में अप्रैल में मनाते हैं। बुद्ध की मूर्तियों को जल से नहलाया जाता है और लोग एक-दूसरे पर पानी डालकर खुशियाँ मनाते हैं।
    visual: 'चित्र बनाइए: रंग-बिरंगे कपड़ों में बच्चे एक-दूसरे पर पानी डाल रहे हैं, पीछे पहाड़ और एक बौद्ध मंदिर।'
    step_by_step: '1. त्योहार का नाम: साङकेन। 2. कहाँ? अरुणाचल प्रदेश। 3. कब? नए साल पर, अप्रैल में। 4. कैसे? बुद्ध मूर्तियों को स्नान, एक-दूसरे पर पानी।'
    real_world: 'भारत के अलग-अलग राज्यों में नया साल अलग नामों से मनाते हैं: केरल में विषु, पंजाब में बैसाखी, असम में बिहू।'
  picture:
    kind: compare
    columns:
