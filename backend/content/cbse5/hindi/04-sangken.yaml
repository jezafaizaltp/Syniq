      - style: step_by_step
        teach: 'नक्शे पर अरुणाचल खोजो। पहला: भारत के नक्शे में सबसे ऊपर दाईं ओर देखो। दूसरा: वहाँ असम ढूँढो। तीसरा: असम के ऊपर वाला बड़ा पहाड़ी राज्य अरुणाचल प्रदेश है। चौथा: उस पर एक छोटा पानी का निशान बना दो।'
    - teach: इस त्योहार में पानी सबसे ख़ास है। भगवान बुद्ध की मूर्तियों को जल से स्नान कराया जाता है और लोग एक-दूसरे पर पानी डालकर खुशी मनाते हैं। पानी को पवित्रता और शुभता का प्रतीक माना जाता है।
