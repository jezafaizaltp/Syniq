      - style: real_world
        teach: अप्रैल में गर्मी शुरू हो जाती है। ऐसे में ठंडा पानी डालना खेल भी है और राहत भी। साङकेन में बच्चे और बड़े सब हँसते-खेलते भीग जाते हैं।
