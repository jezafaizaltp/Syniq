subject: cbse5-hin
chapter: 4
title: साङकेन
tips:
  h5_buddh: "साङकेन अरुणाचल के खाम्ती लोग मनाते हैं, जो बौद्ध धर्म मानते हैं। उनके मंदिरों (विहारों) में किसकी मूर्ति होती है?"
  h5_naya_saal: "साङकेन अप्रैल में आता है, जैसे विषु, बैसाखी और बिहू। ये सब किस चीज़ की शुरुआत मनाते हैं?"
  h5_sangken: "रंग होली में डालते हैं। साङकेन गर्मी में आता है; ठंडक के लिए लोग एक-दूसरे पर क्या छिड़कते हैं?"
  h5_vishu: "बिहू असम का, बैसाखी पंजाब का, पोंगल तमिलनाडु का। केरल में नए साल की सुबह 'कणी' देखते हैं।"
  c5h4_tyohar: 'पाठ में त्योहार के काम याद करो: लोग पानी से क्या करते हैं और घरों में क्या होता है?'
  c5h4_naksha: "नक्शे में अरुणाचल प्रदेश को असम के पास खोजो। वह भारत के किस कोने में है?"
  c5h4_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse5h.v4.sangken
  title: साङकेन
  notes: |
    साङकेन (सांगकेन) अरुणाचल प्रदेश का त्योहार है, जिसे खाम्ती समुदाय के लोग नए साल के रूप में मनाते हैं, आमतौर पर
    अप्रैल में। इसमें भगवान बुद्ध की मूर्तियों को जल से स्नान कराया जाता है और लोग एक-दूसरे पर पानी डालकर खुशी मनाते
    हैं; पानी को पवित्रता और शुभता का प्रतीक माना जाता है। घर साफ़ किए जाते हैं, पकवान बनते हैं। (पाठ की ठीक बातें
    छपी पुस्तक से मिलानी हैं।)
  explanations:
    text: साङकेन अरुणाचल प्रदेश का पानी का त्योहार है। खाम्ती लोग इसे नए साल के रूप में अप्रैल में मनाते हैं। बुद्ध की मूर्तियों को जल से नहलाया जाता है और लोग एक-दूसरे पर पानी डालकर खुशियाँ मनाते हैं।
    visual: 'चित्र बनाइए: रंग-बिरंगे कपड़ों में बच्चे एक-दूसरे पर पानी डाल रहे हैं, पीछे पहाड़ और एक बौद्ध मंदिर।'
    step_by_step: '1. त्योहार का नाम: साङकेन। 2. कहाँ? अरुणाचल प्रदेश। 3. कब? नए साल पर, अप्रैल में। 4. कैसे? बुद्ध मूर्तियों को स्नान, एक-दूसरे पर पानी।'
    real_world: 'भारत के अलग-अलग राज्यों में नया साल अलग नामों से मनाते हैं: केरल में विषु, पंजाब में बैसाखी, असम में बिहू।'
  picture:
    kind: compare
    columns:
    - title: त्योहार
      points:
      - साङकेन
      - विषु
      - बिहू
    - title: राज्य
      points:
      - अरुणाचल प्रदेश
      - केरल
      - असम
    alt: साङकेन अरुणाचल प्रदेश का, विषु केरल का और बिहू असम का नए साल का त्योहार है।
  activity:
    type: sort
    prompt: साङकेन त्योहार में क्या होता है? सही को 'त्योहार में' रखो।
    bins:
    - साङकेन में होता है
    - साङकेन से जुड़ा नहीं
    items:
    - label: बुद्ध की मूर्तियों को जल से स्नान
      bin: साङकेन में होता है
      clue: इस त्योहार में पानी का क्या महत्त्व है?
      why: पानी को पवित्र मानकर मूर्तियों को नहलाया जाता है।
    - label: एक-दूसरे पर पानी डालना
      bin: साङकेन में होता है
      clue: लोग खुशी कैसे मनाते हैं?
      why: पानी शुभता का प्रतीक है।
    - label: घरों की सफ़ाई और पकवान
      bin: साङकेन में होता है
      clue: नए साल की तैयारी कैसे होती है?
      why: नए साल पर घर साफ़, पकवान बनते हैं।
    - label: दीये जलाना और पटाखे
      bin: साङकेन से जुड़ा नहीं
      clue: साङकेन पानी का त्योहार है या रोशनी का?
      why: यह दीवाली की बात है।
    - label: फूलों की रंगोली पूक्कलम
      bin: साङकेन से जुड़ा नहीं
      clue: पूक्कलम किस राज्य के त्योहार में बनता है?
      why: यह केरल के ओणम की बात है।
  lesson:
    - teach: साङकेन अरुणाचल प्रदेश का त्योहार है। अरुणाचल भारत के उत्तर-पूर्व में है। खाम्ती समुदाय के लोग इसे नए साल के रूप में, आमतौर पर अप्रैल में मनाते हैं।
      check:
