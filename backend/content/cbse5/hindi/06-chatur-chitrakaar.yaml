subject: cbse5-hin
chapter: 6
title: चतुर चित्रकार
tips:
  h5_chatur: "कहानी के चित्रकार ने शेर से बचने के लिए दिमाग़ लगाया। ऐसे व्यक्ति को कैसा कहेंगे?"
  h5_chitra_saman: "कला की कक्षा में तुम्हारे बस्ते में क्या होता है? हथौड़ा बढ़ई का औज़ार है।"
  c5h6_buddhi: 'सोचो: बड़े और ताकतवर से बचने के लिए छोटे के पास कौन-सी ताकत होती है?'
  c5h6_kavita: "कविता के पात्र याद करो: चित्र कौन बना रहा था, कौन आया, और शेर कहाँ रहता है?"
  c5h6_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse5h.v6.chitrakaar
  title: चतुर चित्रकार
  notes: |
    'चतुर चित्रकार' में एक चित्रकार की चतुराई की बात है: मुसीबत में भी घबराए बिना वह अपनी बुद्धि से बच निकलता है।
    (रामनरेश त्रिपाठी की इसी नाम की प्रसिद्ध बाल कविता में जंगल में एक शेर चित्रकार से अपना चित्र बनवाना चाहता है और
    चित्रकार चतुराई से बचता है।) ठीक पंक्तियाँ यहाँ नहीं दी गई हैं; अभ्यास चतुराई, घबराहट से बचने की सीख और शब्द-अर्थ पर हैं।
  explanations:
    text: 'इस पाठ में एक चित्रकार मुसीबत में फँसता है, पर घबराता नहीं। वह अपनी बुद्धि और चतुराई से बच जाता है। सीख: मुसीबत में शांत रहकर सोचें।'
    visual: 'चित्र बनाइए: जंगल में एक चित्रकार अपना कैनवास लिए खड़ा है, सामने एक बड़ा शेर बैठा है, चित्रकार मुस्कुराकर कुछ सोच रहा है।'
    step_by_step: 1. मुख्य पात्र कौन है? चित्रकार। 2. मुसीबत क्या है? 3. वह क्या सोचता है? 4. कैसे बचता है? चतुराई से।
    real_world: जब किसी मुश्किल में घबराने के बजाय हम ठंडे दिमाग़ से सोचते हैं, तो रास्ता मिल जाता है।
  picture:
    kind: flow
    steps:
    - चित्रकार जंगल में
    - मुसीबत सामने आती है
    - वह शांत रहकर सोचता है
    - चतुराई से बच निकलता है
    alt: चित्रकार जंगल में होता है, मुसीबत आती है, वह शांत रहकर सोचता है और चतुराई से बच निकलता है।
  activity:
    type: sort
    prompt: मुसीबत में चतुर व्यक्ति क्या करता है, और क्या नहीं?
    bins:
    - चतुर करता है
    - चतुर नहीं करता
    items:
    - label: शांत रहकर सोचता है
      bin: चतुर करता है
      clue: घबराने से बचने का रास्ता मिलता है?
      why: शांत रहकर ही उपाय सूझता है।
    - label: बुद्धि से बचने का रास्ता ढूँढ़ता है
      bin: चतुर करता है
      clue: चित्रकार कैसे बचता है?
      why: चतुराई = बुद्धि का उपयोग।
    - label: घबराकर रोने लगता है
      bin: चतुर नहीं करता
      clue: क्या इससे मुसीबत टलती है?
      why: घबराहट से सोचना रुक जाता है।
    - label: बिना सोचे भाग जाता है
      bin: चतुर नहीं करता
      clue: बिना सोचे कदम ठीक है?
      why: चतुर पहले सोचता है।
  lesson:
    - teach: '''चतुर चित्रकार'' रामनरेश त्रिपाठी की प्रसिद्ध बाल कविता है। एक चित्रकार जंगल में चित्र बना रहा था। तभी एक शेर आया और बोला: मेरा चित्र बनाओ!'
      check:
        prompt: कविता में चित्रकार के पास कौन आता है?
        options:
        - शेर
        - हाथी
        - बंदर
        answer: शेर
        why: जंगल का राजा अपना चित्र बनवाना चाहता है।
      ways:
      - style: visual
        teach: 'कविता की शुरुआत: कौन था, कहाँ था और कौन आया, दो हिस्सों में।'
        picture:
          kind: compare
          columns:
          - title: चित्रकार
            points:
            - जंगल में था
            - चित्र बना रहा था
          - title: शेर
            points:
            - अचानक वहाँ आ गया
            - बहुत ताक़तवर था
          alt: चित्रकार जंगल में चित्र बना रहा था। तभी एक बहुत ताक़तवर शेर अचानक वहाँ आ गया।
      - style: real_world
        teach: कई चित्रकार पहाड़, नदी या जंगल को सामने देखकर बनाने के लिए बाहर जाते हैं। वे घंटों एक जगह बैठकर रंग भरते हैं, इसलिए उन्हें आस-पास की चीज़ों पर ध्यान रखना पड़ता है।
    - teach: शेर से डरकर भागना या चिल्लाना खतरनाक होता। चित्रकार घबराया नहीं। उसने शांत रहकर सोचा और एक चतुर उपाय निकाला, जिससे वह सुरक्षित बच गया।
      picture:
        kind: flow
        steps:
        - खतरा आता है
        - घबराओ नहीं, रुको
        - 'सोचो: क्या उपाय है?'
        - उपाय से बच निकलो
        alt: 'मुसीबत में चतुराई: खतरा, रुकना, सोचना, बचना।'
      check:
        prompt: चित्रकार ने खतरे के समय सबसे पहले क्या किया?
        options:
        - शांत रहकर सोचा
        - ज़ोर से रोया
        - शेर से लड़ा
        answer: शांत रहकर सोचा
        why: घबराहट में सोच बंद हो जाती है; शांत मन उपाय ढूँढता है।
      ways:
      - style: step_by_step
        teach: 'मुसीबत में चित्रकार की तरह सोचो। पहला: रुको, भागो या चिल्लाओ मत। दूसरा: गहरी साँस लो और शांत रहो। तीसरा: सोचो, सामने वाला क्या चाहता है? चौथा: ऐसा उपाय चुनो जिससे तुम सुरक्षित रहो।'
      - style: real_world
        teach: जंगल के पास रहने वाले लोग सिखाते हैं कि किसी जंगली जानवर को देखकर पीठ फेरकर भागना ठीक नहीं होता। शांत रहकर धीरे-धीरे दूर होना अक्सर ज़्यादा सुरक्षित होता है।
    - teach: 'कविता की सीख: ताकत से ज़्यादा काम बुद्धि आती है। ''चतुर'' का अर्थ है होशियार। ऐसी कहानियों में छोटा या कमज़ोर पात्र अक्सर बुद्धि से बड़े खतरे को हरा देता है।'
      check:
        prompt: कविता के अनुसार, मुसीबत में सबसे काम की चीज़ क्या है?
        options:
        - बुद्धि
        - ज़ोर से चिल्लाना
        - छिपकर रोना
        answer: बुद्धि
        why: चित्रकार ताकत से नहीं, बुद्धि से बचा।
      ways:
      - style: visual
        teach: 'ताक़त और बुद्धि: इस कविता में किसने किससे काम लिया।'
        picture:
          kind: compare
          columns:
          - title: शेर के पास
            points:
            - बहुत ताक़त
            - बड़े दाँत और पंजे
          - title: चित्रकार के पास
            points:
            - शांत मन
            - चतुर उपाय
            - बुद्धि
          alt: शेर के पास बहुत ताक़त और बड़े दाँत-पंजे थे। चित्रकार के पास शांत मन, चतुर उपाय और बुद्धि थी।
      - style: real_world
        teach: पंचतंत्र की एक कहानी में छोटा-सा खरगोश ताक़तवर शेर को कुएँ के पास ले जाकर उसकी ही परछाईं दिखाता है। वहाँ भी छोटा पात्र ताक़त से नहीं, अपनी बुद्धि से जीतता है।
  items:
  - prompt: '''चित्रकार'' किसे कहते हैं?'
    options:
    - चित्र बनाने वाले को
    - गाना गाने वाले को
    - खाना बनाने वाले को
    - कपड़े सिलने वाले को
    answer: चित्र बनाने वाले को
    difficulty: 1
    hints:
    - चित्र + कार।
    - रंग और ब्रश।
    solution: चित्र बनाने वाला चित्रकार है।
    mistakes:
      गाना गाने वाले को: hin5_word
  - prompt: '''चतुर'' का अर्थ है:'
    options:
    - होशियार, बुद्धिमान
    - डरपोक
    - आलसी
    - मोटा
    answer: होशियार, बुद्धिमान
    difficulty: 1
    hints:
    - दिमाग़ से काम लेने वाला।
    - चालाक।
    solution: चतुर यानी होशियार।
    mistakes: {"डरपोक": "h5_chatur", "आलसी": "h5_chatur", "मोटा": "h5_chatur"}
  - prompt: चतुर चित्रकार मुसीबत से कैसे बचता है?
    options:
    - अपनी बुद्धि से
    - भागकर रोते हुए
    - लड़ाई करके
    - सोकर
    answer: अपनी बुद्धि से
    difficulty: 1
    hints:
    - शीर्षक में 'चतुर' है।
    - दिमाग़।
    solution: वह अपनी चतुराई से बचता है।
    mistakes:
      लड़ाई करके: hin5_read_again
  - prompt: इस पाठ की सीख क्या है?
    options:
    - "मुसीबत में शांत रहकर सोचना चाहिए"
    - "ख़तरा देखकर हमेशा डर जाना चाहिए"
    - "कभी भी कोई चित्र नहीं बनाना चाहिए"
    - "अकेले घने जंगल में खेलना चाहिए"
    answer: मुसीबत में शांत रहकर सोचना चाहिए
    difficulty: 2
    hints:
    - चित्रकार ने क्या किया?
    - घबराया नहीं।
    solution: शांत रहकर सोचने से मुसीबत हल होती है।
    mistakes:
      "ख़तरा देखकर हमेशा डर जाना चाहिए": hin5_lesson
  - prompt: '''चतुर'' का विलोम शब्द है:'
    options:
    - मूर्ख
    - होशियार
    - तेज़
    - समझदार
    answer: मूर्ख
    difficulty: 2
    hints:
    - उलटा अर्थ।
    - जिसे समझ न हो।
    solution: चतुर का विलोम मूर्ख है।
    mistakes: {"होशियार": "h4_paryay_vilom", "तेज़": "h4_paryay_vilom", "समझदार": "h4_paryay_vilom"}
  - prompt: चित्र बनाने के लिए किसकी ज़रूरत होती है?
    options:
    - रंग और ब्रश
    - हथौड़ा
    - बाल्टी
    - चम्मच
    answer: रंग और ब्रश
    difficulty: 1
    hints:
    - चित्रकार के पास क्या होता है?
    - कागज़ भी।
    solution: चित्र रंग और ब्रश से बनते हैं।
    mistakes: {"हथौड़ा": "h5_chitra_saman", "बाल्टी": "h5_chitra_saman", "चम्मच": "h5_chitra_saman"}
  - prompt: '''चतुर चित्रकार'' कविता के कवि कौन हैं?'
    options:
    - रामनरेश त्रिपाठी
    - रामधारी सिंह 'दिनकर'
    - सोहनलाल द्विवेदी
    answer: रामनरेश त्रिपाठी
    difficulty: 2
    hints:
    - '''चाँद का कुर्ता'' के कवि अलग हैं।'
    - इस कवि के नाम में 'राम' और 'त्रिपाठी' है।
    solution: 'चरण 1: ''चाँद का कुर्ता'' दिनकर की है। चरण 2: ''चतुर चित्रकार'' रामनरेश त्रिपाठी की है।'
    mistakes:
      रामधारी सिंह 'दिनकर': c5h6_kavita
      सोहनलाल द्विवेदी: c5h6_kavita
  - prompt: चित्रकार कहाँ चित्र बना रहा था?
    options:
    - जंगल में
    - स्कूल में
    - बाज़ार में
    answer: जंगल में
    difficulty: 1
    hints:
    - वहाँ शेर आया।
    - शेर कहाँ रहता है?
    solution: 'चरण 1: शेर जंगल में रहता है। चरण 2: चित्रकार जंगल में चित्र बना रहा था।'
    mistakes:
      स्कूल में: c5h6_kavita
      बाज़ार में: c5h6_kavita
  - prompt: शेर चित्रकार से क्या चाहता था?
    options:
    - अपना चित्र बनवाना
    - खाना माँगना
    - रास्ता पूछना
    answer: अपना चित्र बनवाना
    difficulty: 1
    hints:
    - चित्रकार का काम क्या है?
    - शेर ने उसके काम से जुड़ी माँग की।
    solution: 'चरण 1: चित्रकार चित्र बनाता है। चरण 2: शेर अपना चित्र बनवाना चाहता था।'
    mistakes:
      खाना माँगना: c5h6_kavita
      रास्ता पूछना: c5h6_kavita
  - prompt: '''घबराना'' शब्द का अर्थ है:'
    options:
    - डरकर बेचैन होना
    - खुश होना
    - सो जाना
    answer: डरकर बेचैन होना
    difficulty: 2
    hints:
    - परीक्षा से पहले कुछ बच्चे ऐसा महसूस करते हैं।
    - दिल तेज़ धड़कता है, मन शांत नहीं रहता।
    solution: 'चरण 1: घबराहट डर से आती है। चरण 2: घबराना = डरकर बेचैन होना।'
    mistakes:
      खुश होना: c5h6_shabd
      सो जाना: c5h6_shabd
  - prompt: '''चित्र'' शब्द से ''चित्रकार'' बना है। इसी तरह ''कलाकार'' किस शब्द से बना है?'
    options:
    - कला
    - काल
    - कील
    answer: कला
    difficulty: 2
    hints:
    - '''कार'' हटाओ, क्या बचता है?'
    - चित्र + कार = चित्रकार।
    solution: 'चरण 1: कलाकार से ''कार'' हटाओ। चरण 2: बचता है ''कला''।'
    mistakes:
      काल: c5h6_shabd
      कील: c5h6_shabd
  - prompt: गली में एक गुस्सैल कुत्ता भौंक रहा है। चित्रकार जैसी चतुराई से क्या करना ठीक है?
    options:
    - "शांत रहकर धीरे-धीरे दूर हट जाना"
    - "उसकी ओर ज़ोर से पत्थर फेंक देना"
    - "चिल्लाते हुए तेज़ी से भाग जाना"
    answer: शांत रहकर धीरे-धीरे दूर हट जाना
    difficulty: 2
    hints:
    - चित्रकार ने खतरे को भड़काया नहीं।
    - शांत रहने से खतरा कैसे घटता है?
