subject: cbse5-hin
chapter: 6
title: चतुर चित्रकार
tips:
  h5_chatur: "कहानी के चित्रकार ने शेर से बचने के लिए दिमाग़ लगाया। ऐसे व्यक्ति को कैसा कहेंगे?"
  h5_chitra_saman: "कला की कक्षा में तुम्हारे बस्ते में क्या होता है? हथौड़ा बढ़ई का औज़ार है।"

concepts:
- code: cbse5h.v6.chitrakaar
  title: चतुर चित्रकार
  notes: |
    'चतुर चित्रकार' में एक चित्रकार की चतुराई की बात है: मुसीबत में भी घबराए बिना वह अपनी बुद्धि से बच निकलता है।
    (रामनरेश त्रिपाठी की इसी नाम की प्रसिद्ध बाल कविता में जंगल में एक शेर चित्रकार से अपना चित्र बनवाना चाहता है और
    चित्रकार चतुराई से बचता है।) ठीक पंक्तियाँ यहाँ नहीं दी गई हैं; अभ्यास चतुराई, घबराहट से बचने की सीख और शब्द-अर्थ पर हैं।
  explanations:
    text: 'इस पाठ में एक चित्रकार मुसीबत में फँसता है, पर घबराता नहीं। वह अपनी बुद्धि और चतुराई से बच जाता है। सीख: मुसीबत में शांत रहकर सोचें।'
    visual: 'चित्र बनाइए: जंगल में एक चित्रकार अपना कैनवास लिए खड़ा है, सामने एक बड़ा शेर बैठा है, चित्रकार मुस्कुराकर कुछ सोच रहा है।'
    step_by_step: 1. मुख्य पात्र कौन है? चित्रकार। 2. मुसीबत क्या है? 3. वह क्या सोचता है? 4. कैसे बचता है? चतुराई से।
    real_world: जब किसी मुश्किल में घबराने के बजाय हम ठंडे दिमाग़ से सोचते हैं, तो रास्ता मिल जाता है।
  picture:
    kind: flow
    steps:
    - चित्रकार जंगल में
    - मुसीबत सामने आती है
    - वह शांत रहकर सोचता है
    - चतुराई से बच निकलता है
    alt: चित्रकार जंगल में होता है, मुसीबत आती है, वह शांत रहकर सोचता है और चतुराई से बच निकलता है।
  activity:
    type: sort
    prompt: मुसीबत में चतुर व्यक्ति क्या करता है, और क्या नहीं?
    bins:
    - चतुर करता है
    - चतुर नहीं करता
    items:
    - label: शांत रहकर सोचता है
      bin: चतुर करता है
      clue: घबराने से बचने का रास्ता मिलता है?
      why: शांत रहकर ही उपाय सूझता है।
    - label: बुद्धि से बचने का रास्ता ढूँढ़ता है
      bin: चतुर करता है
      clue: चित्रकार कैसे बचता है?
      why: चतुराई = बुद्धि का उपयोग।
    - label: घबराकर रोने लगता है
      bin: चतुर नहीं करता
      clue: क्या इससे मुसीबत टलती है?
      why: घबराहट से सोचना रुक जाता है।
    - label: बिना सोचे भाग जाता है
      bin: चतुर नहीं करता
      clue: बिना सोचे कदम ठीक है?
      why: चतुर पहले सोचता है।
  items:
  - prompt: '''चित्रकार'' किसे कहते हैं?'
    options:
    - चित्र बनाने वाले को
    - गाना गाने वाले को
    - खाना बनाने वाले को
    - कपड़े सिलने वाले को
    answer: चित्र बनाने वाले को
    difficulty: 1
    hints:
    - चित्र + कार।
    - रंग और ब्रश।
    solution: चित्र बनाने वाला चित्रकार है।
    mistakes:
      गाना गाने वाले को: hin5_word
  - prompt: '''चतुर'' का अर्थ है:'
    options:
    - होशियार, बुद्धिमान
    - डरपोक
    - आलसी
    - मोटा
    answer: होशियार, बुद्धिमान
    difficulty: 1
    hints:
    - दिमाग़ से काम लेने वाला।
    - चालाक।
    solution: चतुर यानी होशियार।
    mistakes: {"डरपोक": "h5_chatur", "आलसी": "h5_chatur", "मोटा": "h5_chatur"}
  - prompt: चतुर चित्रकार मुसीबत से कैसे बचता है?
    options:
    - अपनी बुद्धि से
    - भागकर रोते हुए
    - लड़ाई करके
    - सोकर
    answer: अपनी बुद्धि से
    difficulty: 1
    hints:
    - शीर्षक में 'चतुर' है।
    - दिमाग़।
    solution: वह अपनी चतुराई से बचता है।
    mistakes:
      लड़ाई करके: hin5_read_again
  - prompt: इस पाठ की सीख क्या है?
    options:
    - मुसीबत में शांत रहकर सोचना चाहिए
    - हमेशा डर जाना चाहिए
    - चित्र नहीं बनाने चाहिए
    - जंगल में खेलना चाहिए
    answer: मुसीबत में शांत रहकर सोचना चाहिए
    difficulty: 2
    hints:
    - चित्रकार ने क्या किया?
    - घबराया नहीं।
    solution: शांत रहकर सोचने से मुसीबत हल होती है।
    mistakes:
      हमेशा डर जाना चाहिए: hin5_lesson
  - prompt: '''चतुर'' का विलोम शब्द है:'
    options:
    - मूर्ख
    - होशियार
    - तेज़
    - समझदार
    answer: मूर्ख
    difficulty: 2
    hints:
    - उलटा अर्थ।
    - जिसे समझ न हो।
    solution: चतुर का विलोम मूर्ख है।
    mistakes: {"होशियार": "h4_paryay_vilom", "तेज़": "h4_paryay_vilom", "समझदार": "h4_paryay_vilom"}
  - prompt: चित्र बनाने के लिए किसकी ज़रूरत होती है?
    options:
    - रंग और ब्रश
    - हथौड़ा
    - बाल्टी
    - चम्मच
    answer: रंग और ब्रश
    difficulty: 1
    hints:
    - चित्रकार के पास क्या होता है?
    - कागज़ भी।
    solution: चित्र रंग और ब्रश से बनते हैं।
    mistakes: {"हथौड़ा": "h5_chitra_saman", "बाल्टी": "h5_chitra_saman", "चम्मच": "h5_chitra_saman"}
