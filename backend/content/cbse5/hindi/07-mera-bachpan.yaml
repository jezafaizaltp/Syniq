subject: cbse5-hin
chapter: 7
title: मेरा बचपन
tips:
  h5_aatmakatha: "शीर्षक में 'मेरा' शब्द देखो। 'मेरा' कहने वाला कौन है?"
  h5_kaal: "'खेलता था' देखो। 'था' बीते समय का, 'है' अभी का, 'गा' आने वाले समय का संकेत है।"
  h5_main: "अपनी बात खुद बताते समय तुम अपने लिए कौन-सा शब्द बोलते हो?"

concepts:
- code: cbse5h.v7.bachpan
  title: मेरा बचपन
  notes: |
    आत्मकथात्मक (संस्मरण) पाठ, जिसमें लेखक अपने बचपन की यादें 'मैं' शैली में बताता है: परिवार, खेल, स्कूल, दोस्त, और वे
    घटनाएँ जिन्होंने उसे बनाया। ठीक लेखक और घटनाएँ यहाँ नहीं दी गई हैं। अभ्यास संस्मरण पहचानने, 'मैं' शैली, भूतकाल
    की क्रियाओं और अपने बचपन के बारे में लिखने पर हैं।
  explanations:
    text: '''मेरा बचपन'' जैसे पाठ में लेखक अपने बचपन की यादें खुद बताता है, इसलिए वह ''मैं'' शब्द का प्रयोग करता है। ऐसे लेखन को संस्मरण या आत्मकथा कहते हैं। इसमें बीती बातें होती हैं, इसलिए क्रियाएँ भूतकाल में होती हैं: खेलता था, जाता था।'
    visual: 'एक यादों का पेड़ बनाइए: तने पर ''मेरा बचपन'', डालियों पर ''परिवार'', ''खेल'', ''स्कूल'', ''दोस्त'' और हर डाली पर एक याद।'
    step_by_step: '1. पहचानें कि कौन बोल रहा है: ''मैं''। 2. बचपन की कौन-सी बातें बताई गई हैं? 3. भूतकाल की क्रियाएँ खोजें। 4. अपनी एक याद लिखें।'
    real_world: दादा-दादी जब अपने बचपन के किस्से सुनाते हैं, तो वह भी एक तरह का संस्मरण है।
  picture:
    kind: compare
    columns:
    - title: संस्मरण की पहचान
      points:
      - '''मैं'' शैली'
      - सच्ची यादें
    - title: क्रियाएँ (भूतकाल)
      points:
      - खेलता था
      - जाती थी
      - पढ़ते थे
    alt: संस्मरण 'मैं' शैली में सच्ची यादें बताता है, और उसमें भूतकाल की क्रियाएँ होती हैं, जैसे खेलता था, जाती थी, पढ़ते थे।
  activity:
    type: sort
    prompt: संस्मरण 'मैं' शैली में, बीते समय में लिखा जाता है। कौन-सा वाक्य संस्मरण जैसा है?
    bins:
    - संस्मरण जैसा
    - संस्मरण जैसा नहीं
    items:
    - label: बचपन में मैं रोज़ नदी किनारे खेलता था।
      bin: संस्मरण जैसा
      clue: इसमें 'मैं' और बीता समय है?
      why: अपनी याद, 'मैं' शैली, भूतकाल।
    - label: मुझे याद है, दादी कहानियाँ सुनाती थीं।
      bin: संस्मरण जैसा
      clue: '''याद है'' क्या बताता है?'
      why: अपनी याद का वर्णन।
    - label: कल मैं मेला देखने जाऊँगा।
      bin: संस्मरण जैसा नहीं
      clue: '''जाऊँगा'' बीता समय है या आने वाला?'
      why: भविष्य की बात है, याद नहीं।
    - label: शेर जंगल का राजा होता है।
      bin: संस्मरण जैसा नहीं
      clue: क्या इसमें लेखक की अपनी याद है?
      why: यह सामान्य जानकारी है।
  items:
  - prompt: '''मेरा बचपन'' में कौन अपनी बात बता रहा है?'
    options:
    - लेखक खुद
    - एक शेर
    - एक पेड़
    - एक राजा की कहानी
    answer: लेखक खुद
    difficulty: 1
    hints:
    - शीर्षक में 'मेरा' है।
    - '''मैं'' शैली।'
    solution: लेखक अपनी यादें खुद बता रहा है।
    mistakes: {"एक शेर": "h5_aatmakatha", "एक पेड़": "h5_aatmakatha", "एक राजा की कहानी": "h5_aatmakatha"}
  - prompt: अपने जीवन की सच्ची यादों के लेखन को क्या कहते हैं?
    options:
    - संस्मरण
    - कविता
    - पहेली
    - नाटक
    answer: संस्मरण
    difficulty: 2
    hints:
    - स्मरण = याद।
    - सच्ची बातें।
    solution: यादों के लेखन को संस्मरण कहते हैं।
    mistakes:
      कविता: hin5_word
  - prompt: '''मैं रोज़ नदी किनारे खेलता था।'' यह वाक्य किस काल में है?'
    options:
    - भूतकाल
    - वर्तमान काल
    - भविष्य काल
    - कोई काल नहीं
    answer: भूतकाल
    difficulty: 2
    hints:
    - '''था'' बीते समय को बताता है।'
    - पहले की बात।
    solution: '''खेलता था'' बीते समय की बात है: भूतकाल।'
    mistakes: {"वर्तमान काल": "h5_kaal", "भविष्य काल": "h5_kaal", "कोई काल नहीं": "h5_kaal"}
  - prompt: '''बचपन'' का विलोम शब्द है:'
    options:
    - बुढ़ापा
    - बच्चा
    - खेल
    - स्कूल
    answer: बुढ़ापा
    difficulty: 2
    hints:
    - जीवन का अंतिम भाग।
    - बूढ़े होने का समय।
    solution: बचपन का विलोम बुढ़ापा है।
    mistakes: {"बच्चा": "h1_ulta", "खेल": "h1_ulta", "स्कूल": "h1_ulta"}
  - prompt: बचपन की यादें लिखते समय कौन-सा शब्द सबसे ज़्यादा आएगा?
    options:
    - मैं
    - वह
    - तुम
    - वे
    answer: मैं
    difficulty: 1
    hints:
    - अपनी बात।
    - पहला पुरुष।
    solution: अपनी यादों में 'मैं' का प्रयोग होता है।
    mistakes: {"वह": "h5_main", "तुम": "h5_main", "वे": "h5_main"}
  - prompt: इनमें से कौन-सी क्रिया भूतकाल की है?
    options:
    - गया था
    - जाऊँगा
    - जाता हूँ
    - जाओ
    answer: गया था
    difficulty: 1
    hints:
    - '''था'' खोजें।'
    - बीती बात।
    solution: '''गया था'' भूतकाल की क्रिया है।'
    mistakes: {"जाऊँगा": "h5_kaal", "जाता हूँ": "h5_kaal", "जाओ": "h5_kaal"}
