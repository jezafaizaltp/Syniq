subject: cbse5-hin
chapter: 7
title: मेरा बचपन
tips:
  h5_aatmakatha: "शीर्षक में 'मेरा' शब्द देखो। 'मेरा' कहने वाला कौन है?"
  h5_kaal: "'खेलता था' देखो। 'था' बीते समय का, 'है' अभी का, 'गा' आने वाले समय का संकेत है।"
  h5_main: "अपनी बात खुद बताते समय तुम अपने लिए कौन-सा शब्द बोलते हो?"
  c5h7_kaal: 'क्रिया को देखो: काम अभी हो रहा है, हो चुका है, या आगे होगा?'
  c5h7_sansmaran: 'सोचो: यह लेख किसी की अपनी सच्ची यादें हैं या बनाई हुई कहानी?'
  c5h7_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा ठीक बैठता है?

concepts:
- code: cbse5h.v7.bachpan
  title: मेरा बचपन
  notes: |
    आत्मकथात्मक (संस्मरण) पाठ, जिसमें लेखक अपने बचपन की यादें 'मैं' शैली में बताता है: परिवार, खेल, स्कूल, दोस्त, और वे
    घटनाएँ जिन्होंने उसे बनाया। ठीक लेखक और घटनाएँ यहाँ नहीं दी गई हैं। अभ्यास संस्मरण पहचानने, 'मैं' शैली, भूतकाल
    की क्रियाओं और अपने बचपन के बारे में लिखने पर हैं।
  explanations:
    text: '''मेरा बचपन'' जैसे पाठ में लेखक अपने बचपन की यादें खुद बताता है, इसलिए वह ''मैं'' शब्द का प्रयोग करता है। ऐसे लेखन को संस्मरण या आत्मकथा कहते हैं। इसमें बीती बातें होती हैं, इसलिए क्रियाएँ भूतकाल में होती हैं: खेलता था, जाता था।'
    visual: 'एक यादों का पेड़ बनाइए: तने पर ''मेरा बचपन'', डालियों पर ''परिवार'', ''खेल'', ''स्कूल'', ''दोस्त'' और हर डाली पर एक याद।'
    step_by_step: '1. पहचानें कि कौन बोल रहा है: ''मैं''। 2. बचपन की कौन-सी बातें बताई गई हैं? 3. भूतकाल की क्रियाएँ खोजें। 4. अपनी एक याद लिखें।'
    real_world: दादा-दादी जब अपने बचपन के किस्से सुनाते हैं, तो वह भी एक तरह का संस्मरण है।
  picture:
    kind: compare
    columns:
    - title: संस्मरण की पहचान
      points:
      - '''मैं'' शैली'
      - सच्ची यादें
    - title: क्रियाएँ (भूतकाल)
      points:
      - खेलता था
      - जाती थी
      - पढ़ते थे
    alt: संस्मरण 'मैं' शैली में सच्ची यादें बताता है, और उसमें भूतकाल की क्रियाएँ होती हैं, जैसे खेलता था, जाती थी, पढ़ते थे।
  activity:
    type: sort
    prompt: संस्मरण 'मैं' शैली में, बीते समय में लिखा जाता है। कौन-सा वाक्य संस्मरण जैसा है?
    bins:
    - संस्मरण जैसा
    - संस्मरण जैसा नहीं
    items:
    - label: बचपन में मैं रोज़ नदी किनारे खेलता था।
      bin: संस्मरण जैसा
      clue: इसमें 'मैं' और बीता समय है?
      why: अपनी याद, 'मैं' शैली, भूतकाल।
    - label: मुझे याद है, दादी कहानियाँ सुनाती थीं।
      bin: संस्मरण जैसा
      clue: '''याद है'' क्या बताता है?'
      why: अपनी याद का वर्णन।
    - label: कल मैं मेला देखने जाऊँगा।
      bin: संस्मरण जैसा नहीं
      clue: '''जाऊँगा'' बीता समय है या आने वाला?'
      why: भविष्य की बात है, याद नहीं।
    - label: शेर जंगल का राजा होता है।
      bin: संस्मरण जैसा नहीं
      clue: क्या इसमें लेखक की अपनी याद है?
      why: यह सामान्य जानकारी है।
  lesson:
    - teach: '''मेरा बचपन'' एक संस्मरण है। संस्मरण में लेखक अपने जीवन की सच्ची यादें खुद बताता है। इसलिए इसमें ''मैं'', ''मेरा'', ''मुझे'' जैसे शब्द बार-बार आते हैं।'
      check:
        prompt: संस्मरण में बातें कैसी होती हैं?
        options:
        - लेखक की सच्ची यादें
        - परियों की कहानियाँ
        - विज्ञान के नियम
        answer: लेखक की सच्ची यादें
        why: संस्मरण = स्मरण (याद) से बना, अपनी सच्ची यादें।
    - teach: 'यादें बीते समय की होती हैं, इसलिए संस्मरण में ज़्यादातर भूतकाल की क्रियाएँ आती हैं: खेलता था, गया था, पढ़ती थी। भूतकाल = जो काम पहले हो चुका।'
      picture:
        kind: compare
        columns:
        - title: भूतकाल (हो चुका)
          points:
          - खेलता था
          - गया था
          - पढ़ा
        - title: वर्तमान (हो रहा)
          points:
          - खेलता है
          - जा रहा है
          - पढ़ता है
        - title: भविष्य (होगा)
          points:
          - खेलेगा
          - जाएगा
          - पढ़ेगा
        alt: 'तीन काल के उदाहरण: भूतकाल, वर्तमान और भविष्य की क्रियाएँ।'
      check:
        prompt: '''मैं नानी के घर गया था।'' किस काल में है?'
        options:
        - भूतकाल
        - वर्तमान काल
        - भविष्य काल
        answer: भूतकाल
        why: '''गया था'' बताता है कि काम पहले हो चुका।'
    - teach: बचपन की यादों में परिवार, खेल, स्कूल और दोस्त आते हैं। कुछ घटनाएँ हमें बदल देती हैं और कुछ सिखा जाती हैं। तुम भी अपने बचपन की एक याद 'मैं' शैली में लिख सकते हो।
      check:
        prompt: अपनी याद लिखते समय वाक्य किस तरह शुरू करना ठीक है?
        options:
        - जब मैं छोटा/छोटी था/थी...
        - एक बार एक राजा था...
        - कल मैं जाऊँगा...
        answer: जब मैं छोटा/छोटी था/थी...
        why: यह 'मैं' शैली और भूतकाल दोनों में है।
  items:
  - prompt: '''मेरा बचपन'' में कौन अपनी बात बता रहा है?'
    options:
    - लेखक खुद
    - एक शेर
    - एक पेड़
    - एक राजा की कहानी
    answer: लेखक खुद
    difficulty: 1
    hints:
    - शीर्षक में 'मेरा' है।
    - '''मैं'' शैली।'
    solution: लेखक अपनी यादें खुद बता रहा है।
    mistakes: {"एक शेर": "h5_aatmakatha", "एक पेड़": "h5_aatmakatha", "एक राजा की कहानी": "h5_aatmakatha"}
  - prompt: अपने जीवन की सच्ची यादों के लेखन को क्या कहते हैं?
    options:
    - संस्मरण
    - कविता
    - पहेली
    - नाटक
    answer: संस्मरण
    difficulty: 2
    hints:
    - स्मरण = याद।
    - सच्ची बातें।
    solution: यादों के लेखन को संस्मरण कहते हैं।
    mistakes:
      कविता: hin5_word
  - prompt: '''मैं रोज़ नदी किनारे खेलता था।'' यह वाक्य किस काल में है?'
    options:
    - भूतकाल
    - वर्तमान काल
    - भविष्य काल
    - कोई काल नहीं
    answer: भूतकाल
    difficulty: 2
    hints:
    - '''था'' बीते समय को बताता है।'
    - पहले की बात।
    solution: '''खेलता था'' बीते समय की बात है: भूतकाल।'
    mistakes: {"वर्तमान काल": "h5_kaal", "भविष्य काल": "h5_kaal", "कोई काल नहीं": "h5_kaal"}
  - prompt: '''बचपन'' का विलोम शब्द है:'
    options:
    - बुढ़ापा
    - बच्चा
    - खेल
    - स्कूल
    answer: बुढ़ापा
    difficulty: 2
    hints:
    - जीवन का अंतिम भाग।
    - बूढ़े होने का समय।
    solution: बचपन का विलोम बुढ़ापा है।
    mistakes: {"बच्चा": "h1_ulta", "खेल": "h1_ulta", "स्कूल": "h1_ulta"}
  - prompt: बचपन की यादें लिखते समय कौन-सा शब्द सबसे ज़्यादा आएगा?
    options:
    - मैं
    - वह
    - तुम
    - वे
    answer: मैं
    difficulty: 1
    hints:
    - अपनी बात।
    - पहला पुरुष।
    solution: अपनी यादों में 'मैं' का प्रयोग होता है।
    mistakes: {"वह": "h5_main", "तुम": "h5_main", "वे": "h5_main"}
  - prompt: इनमें से कौन-सी क्रिया भूतकाल की है?
    options:
    - गया था
    - जाऊँगा
    - जाता हूँ
    - जाओ
    answer: गया था
    difficulty: 1
    hints:
    - '''था'' खोजें।'
    - बीती बात।
    solution: '''गया था'' भूतकाल की क्रिया है।'
    mistakes: {"जाऊँगा": "h5_kaal", "जाता हूँ": "h5_kaal", "जाओ": "h5_kaal"}
  - prompt: '''संस्मरण'' शब्द किस शब्द से जुड़ा है?'
    options:
    - स्मरण (याद)
    - मरण
    - रमण
    answer: स्मरण (याद)
    difficulty: 2
    hints:
    - संस्मरण में लेखक क्या लिखता है?
    - '''सम्'' हटाकर शब्द देखो।'
    solution: 'चरण 1: संस्मरण = सम् + स्मरण। चरण 2: स्मरण का अर्थ है याद।'
    mistakes:
      मरण: c5h7_sansmaran
      रमण: c5h7_sansmaran
  - prompt: '''मैं कल मेला देखने जाऊँगी।'' यह वाक्य किस काल में है?'
    options:
    - भविष्य काल
    - भूतकाल
    - वर्तमान काल
    answer: भविष्य काल
    difficulty: 2
    hints:
    - '''कल'' यहाँ आने वाला दिन है।'
    - '''जाऊँगी'' में काम हुआ है या होगा?'
    solution: 'चरण 1: ''जाऊँगी'' = आगे होने वाला काम। चरण 2: यह भविष्य काल है।'
    mistakes:
      भूतकाल: c5h7_kaal
      वर्तमान काल: c5h7_kaal
  - prompt: '''खेलता है'' को भूतकाल में बदलो।'
    options:
    - खेलता था
    - खेलेगा
    - खेल रहा है
    answer: खेलता था
    difficulty: 1
    hints:
    - भूतकाल = बीता हुआ समय।
    - '''है'' की जगह कौन-सा शब्द आएगा?'
    solution: 'चरण 1: ''है'' वर्तमान बताता है। चरण 2: ''था'' लगाने से भूतकाल: खेलता था।'
    mistakes:
      खेलेगा: c5h7_kaal
      खेल रहा है: c5h7_kaal
  - prompt: इनमें से कौन-सा वाक्य संस्मरण का हो सकता है?
    options:
    - मुझे याद है, मैं पहली बार साइकिल से गिरा था।
    - सूरज पूर्व से उगता है।
    - एक जादुई पेड़ बोलता था।
    answer: मुझे याद है, मैं पहली बार साइकिल से गिरा था।
    difficulty: 2
    hints:
    - संस्मरण में लेखक अपनी याद बताता है।
    - किस वाक्य में 'मैं' और बीती बात है?
    solution: 'चरण 1: संस्मरण = अपनी सच्ची याद। चरण 2: साइकिल से गिरने वाला वाक्य ''मैं'' और भूतकाल में है।'
    mistakes:
      सूरज पूर्व से उगता है।: c5h7_sansmaran
      एक जादुई पेड़ बोलता था।: c5h7_sansmaran
  - prompt: '''बचपन'' शब्द में ''पन'' जोड़ने से भाव बना है। इसी तरह ''लड़का'' से क्या बनेगा?'
    options:
    - लड़कपन
    - लड़कपना
    - लड़काई
    answer: लड़कपन
    difficulty: 3
    hints:
    - बच्चा से बचपन बना।
    - '''आ'' हटाकर ''पन'' जोड़ो।'
    solution: 'चरण 1: बच्चा → बच + पन = बचपन। चरण 2: लड़का → लड़क + पन = लड़कपन।'
    mistakes:
      लड़कपना: c5h7_shabd
      लड़काई: c5h7_shabd
  - prompt: '''यादें'' शब्द किसका बहुवचन है?'
    options:
    - याद
    - यादा
    - यादी
    answer: याद
    difficulty: 1
    hints:
    - बहुवचन = एक से ज़्यादा।
    - '''ें'' हटाकर देखो।'
    solution: 'चरण 1: एक याद, कई यादें। चरण 2: यादें का एकवचन याद है।'
    mistakes:
      यादा: c5h7_shabd
      यादी: c5h7_shabd
  - prompt: संस्मरण और कहानी में मुख्य अंतर क्या है?
    options:
    - संस्मरण सच्ची याद है, कहानी गढ़ी भी हो सकती है
    - संस्मरण हमेशा कविता होता है
    - कहानी में पात्र नहीं होते
    answer: संस्मरण सच्ची याद है, कहानी गढ़ी भी हो सकती है
    difficulty: 3
    hints:
    - परी-कथा सच्ची है या कल्पना?
    - संस्मरण में लेखक किसकी बात बताता है?
    solution: 'चरण 1: संस्मरण में लेखक के जीवन की सच्ची घटना होती है। चरण 2: कहानी कल्पना से भी बन सकती है।'
    mistakes:
      संस्मरण हमेशा कविता होता है: c5h7_sansmaran
      कहानी में पात्र नहीं होते: c5h7_sansmaran
  - prompt: '''मैं स्कूल जा रहा हूँ।'' किस काल में है?'
    options:
    - वर्तमान काल
    - भूतकाल
    - भविष्य काल
    answer: वर्तमान काल
    difficulty: 1
    hints:
    - काम कब हो रहा है?
    - '''रहा हूँ'' = अभी।'
    solution: 'चरण 1: ''जा रहा हूँ'' = अभी हो रहा काम। चरण 2: यह वर्तमान काल है।'
    mistakes:
      भूतकाल: c5h7_kaal
      भविष्य काल: c5h7_kaal
  - prompt: बचपन की याद लिखते समय कौन-सी बात सबसे ज़रूरी है?
    options:
    - जो सच में हुआ, वही लिखना
    - हर बात बढ़ा-चढ़ाकर लिखना
    - दूसरों की यादें अपनी बताकर लिखना
    answer: जो सच में हुआ, वही लिखना
    difficulty: 2
    hints:
    - संस्मरण किस तरह की यादें हैं?
    - सच्चाई और कल्पना में से कौन?
