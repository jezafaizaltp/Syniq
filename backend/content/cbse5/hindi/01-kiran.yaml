subject: cbse5-hin
chapter: 1
title: किरन
tips:
  hin5_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है: उस पात्र या घटना वाला हिस्सा खोजें।'
  hin5_word: शब्द को अपने वाक्य में बोलकर देखें। क्या अर्थ ठीक बैठता है?
  hin5_lesson: 'सोचें: इस कहानी से हमें क्या सीख मिलती है? पात्र ने क्या अच्छा या गलत किया?'
  h5_kiran_andhera: "किरन रोशनी लाती है। रोशनी आने पर कमरे से कौन चुपचाप चला जाता है?"
  h5_paudha_dhoop: "पत्ते धूप, हवा और पानी से कुछ बनाते हैं जिससे पौधा बढ़ता है। पौधे को बढ़ने के लिए क्या चाहिए?"
  c5h1_roshni: 'सोचो: सुबह खिड़की खोलने पर कमरे में क्या आता है और क्या चला जाता है?'
  c5h1_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ ठीक बैठे, वही चुनो।
  c5h1_kram: 'सुबह की बातें सोचो: पहले क्या होता है, फिर क्या?'
concepts:
- code: cbse5h.v1.kiran
  title: किरन
  notes: |
    सूरज की किरन के बारे में पाठ। सुबह सूरज की किरन धरती पर आती है तो अँधेरा भागता है, फूल खिलते हैं, पक्षी जागते हैं
    और लोग काम पर निकलते हैं। किरन रोशनी और गर्मी देती है, पौधों को भोजन बनाने में मदद करती है। पाठ का भाव:
    प्रकाश नई शुरुआत और उम्मीद का प्रतीक है। (पाठ की ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।)
  explanations:
    text: सुबह जब सूरज की पहली किरन आती है, अँधेरा चला जाता है। फूल खिल उठते हैं, चिड़ियाँ चहचहाती हैं और सब जाग जाते हैं। किरन हमें रोशनी और गर्मी देती है।
    visual: 'एक चित्र बनाइए: पहाड़ के पीछे से उगता सूरज, उसकी किरनें खेतों पर पड़ रही हैं, फूल खिल रहे हैं और चिड़ियाँ उड़ रही हैं।'
    step_by_step: 1. किरन कहाँ से आती है? सूरज से। 2. किरन आने पर क्या होता है? अँधेरा भागता है, सब जागते हैं। 3. किरन क्या देती है? रोशनी और गर्मी।
    real_world: 'सर्दी की सुबह धूप में बैठना कितना अच्छा लगता है: यही सूरज की किरनों की गर्मी है।'
  picture:
    kind: flow
    steps:
    - सूरज उगता है
    - किरन धरती पर आती है
    - अँधेरा भागता है
    - फूल खिलते हैं, पक्षी जागते हैं
    alt: सूरज उगता है, किरन धरती पर आती है, अँधेरा भागता है, और फूल खिलते हैं तथा पक्षी जागते हैं।
  activity:
    type: order
    prompt: सुबह सूरज की किरन आने पर क्या-क्या होता है? क्रम से लगाओ।
    steps:
    - रात का अँधेरा
    - सूरज की किरन धरती पर आती है
    - अँधेरा भागता है, फूल खिलते हैं
    - लोग काम पर निकलते हैं
    reasons:
      सूरज की किरन धरती पर आती है: किरन रात के अँधेरे के बाद सुबह आती है।
      अँधेरा भागता है, फूल खिलते हैं: किरन आने से ही अँधेरा हटता है।
      लोग काम पर निकलते हैं: उजाला होने पर ही दिन का काम शुरू होता है।
  lesson:
    - teach: '''किरन'' का अर्थ है रोशनी की एक पतली रेखा। सुबह सूरज उगता है तो उसकी किरनें धरती पर आती हैं।'
      check:
        prompt: किरन किसकी होती है?
        options:
        - सूरज की
        - पानी की
        - मिट्टी की
        answer: सूरज की
        why: रोशनी की रेखा सूरज से आती है।
    - teach: किरन आते ही अँधेरा भाग जाता है। फूल खिलते हैं, पक्षी जागते हैं और लोग अपने काम पर निकलते हैं। एक किरन पूरे दिन की शुरुआत कर देती है।
      picture:
        kind: flow
        steps:
        - सूरज उगता है
        - किरन धरती पर आती है
        - अँधेरा भागता है
        - सब जाग जाते हैं
        alt: सूरज उगता है, किरन आती है, अँधेरा भागता है और सब जाग जाते हैं।
      check:
        prompt: किरन आने के बाद पक्षी क्या करते हैं?
        options:
        - जाग जाते हैं
        - सो जाते हैं
        - छिप जाते हैं
        answer: जाग जाते हैं
        why: सुबह की रोशनी से सब जागते हैं।
    - teach: किरन रोशनी और गर्मी देती है। पौधे धूप से अपना भोजन बनाते हैं। इसलिए पाठ किरन को नई शुरुआत और उम्मीद का निशान मानता है।
      check:
        prompt: पौधों को किरन से क्या मदद मिलती है?
        options:
        - भोजन बनाने में
        - सोने में
        - उड़ने में
        answer: भोजन बनाने में
        why: पत्ते धूप की मदद से भोजन बनाते हैं।
  items:
  - prompt: किरन कहाँ से आती है?
    options:
    - सूरज से
    - चाँद से
    - दीपक से
    - बादल से
    answer: सूरज से
    difficulty: 1
    hints:
    - सुबह की रोशनी।
    - आसमान में चमकता गोला।
    solution: किरन सूरज से आती है।
    mistakes:
      चाँद से: hin5_read_again
  - prompt: सुबह किरन आने पर क्या भागता है?
    options:
    - अँधेरा
    - पानी
    - पेड़
    - हवा
    answer: अँधेरा
    difficulty: 1
    hints:
    - रात में क्या होता है?
    - रोशनी का उलटा।
    solution: रोशनी आते ही अँधेरा भागता है।
    mistakes: {"पानी": "h5_kiran_andhera", "पेड़": "h5_kiran_andhera", "हवा": "h5_kiran_andhera"}
  - prompt: सूरज की किरन हमें क्या देती है?
    options:
    - रोशनी और गर्मी
    - बारिश
    - बर्फ़
    - अँधेरा
    answer: रोशनी और गर्मी
    difficulty: 1
    hints:
    - धूप।
    - सर्दी में अच्छी लगती है।
    solution: किरन रोशनी और गर्मी देती है।
    mistakes: {"बारिश": "h2_din_roshni", "बर्फ़": "h2_din_roshni", "अँधेरा": "h2_din_roshni"}
  - prompt: '''किरन'' का सही अर्थ क्या है?'
    options:
    - रोशनी की रेखा
    - एक फल
    - एक नदी
    - एक जानवर
    answer: रोशनी की रेखा
    difficulty: 1
    hints:
    - सूरज की ...
    - प्रकाश।
    solution: किरन प्रकाश की रेखा है।
    mistakes:
      एक फल: hin5_word
  - prompt: '''अँधेरा'' का उलटा (विलोम) शब्द है:'
    options:
    - उजाला
    - रात
    - काला
    - छाया
    answer: उजाला
    difficulty: 2
    hints:
    - रोशनी।
    - दिन में होता है।
    solution: अँधेरा का विलोम उजाला है।
    mistakes: {"रात": "h1_ulta", "काला": "h1_ulta", "छाया": "h1_ulta"}
  - prompt: पौधों के लिए सूरज की किरन क्यों ज़रूरी है?
    options:
    - भोजन बनाने के लिए
    - सोने के लिए
    - ठंडा रहने के लिए
    - जड़ें काटने के लिए
    answer: भोजन बनाने के लिए
    difficulty: 2
    hints:
    - हरी पत्तियाँ।
    - धूप में भोजन बनता है।
    solution: पौधे धूप की मदद से भोजन बनाते हैं।
    mistakes: {"सोने के लिए": "h5_paudha_dhoop", "ठंडा रहने के लिए": "h5_paudha_dhoop", "जड़ें काटने के लिए": "h5_paudha_dhoop"}
  - prompt: '''किरन'' शब्द का दूसरा रूप कौन-सा है?'
    options:
    - किरण
    - करण
    - कारण
    answer: किरण
    difficulty: 2
    hints:
    - एक ही शब्द दो तरह से लिखा जाता है।
    - आखिर में 'न' की जगह कौन-सा अक्षर आ सकता है?
    solution: 'चरण 1: किरन और किरण एक ही शब्द हैं। चरण 2: सही उत्तर किरण है।'
    mistakes:
      करण: c5h1_shabd
      कारण: c5h1_shabd
  - prompt: सुबह किरन आने पर फूलों का क्या होता है?
    options:
    - वे खिल उठते हैं
    - वे मुरझा जाते हैं
    - वे गिर जाते हैं
    answer: वे खिल उठते हैं
    difficulty: 1
    hints:
    - सुबह बगीचा कैसा दिखता है?
    - रोशनी पाकर कलियाँ क्या करती हैं?
    solution: 'चरण 1: रोशनी से कलियाँ खुलती हैं। चरण 2: फूल खिल उठते हैं।'
    mistakes:
      वे मुरझा जाते हैं: c5h1_roshni
      वे गिर जाते हैं: c5h1_roshni
  - prompt: '''उजाला'' शब्द का विलोम क्या है?'
    options:
    - अँधेरा
    - सवेरा
    - रोशनी
    answer: अँधेरा
    difficulty: 1
    hints:
    - विलोम का अर्थ है उलटा।
    - रात में चारों ओर क्या होता है?
    solution: 'चरण 1: उजाला = रोशनी। चरण 2: उसका उलटा अँधेरा है।'
    mistakes:
      सवेरा: c5h1_shabd
      रोशनी: c5h1_shabd
  - prompt: किरन आने के बाद पहले क्या होता है?
    options:
    - अँधेरा भागता है
    - रात होती है
    - तारे निकलते हैं
    answer: अँधेरा भागता है
    difficulty: 1
    hints:
    - रोशनी आते ही कमरे में क्या बदलता है?
    - रात वाली कौन-सी चीज़ चली जाती है?
    solution: 'चरण 1: किरन रोशनी लाती है। चरण 2: रोशनी आते ही अँधेरा भागता है।'
    mistakes:
      रात होती है: c5h1_kram
      तारे निकलते हैं: c5h1_kram
  - prompt: '''सवेरा'' शब्द का अर्थ है:'
    options:
    - सुबह
    - दोपहर
    - आधी रात
    answer: सुबह
    difficulty: 1
    hints:
    - दिन का सबसे पहला समय।
    - सूरज उगने का समय।
    solution: 'चरण 1: सवेरा तब होता है जब सूरज उगता है। चरण 2: इसका अर्थ सुबह है।'
    mistakes:
      दोपहर: c5h1_shabd
      आधी रात: c5h1_shabd
  - prompt: सर्दी में लोग धूप में क्यों बैठते हैं?
    options:
    - किरनों से गर्मी मिलती है
    - धूप में बारिश होती है
    - धूप में हवा ठंडी होती है
    answer: किरनों से गर्मी मिलती है
    difficulty: 2
    hints:
    - सर्दी में हमें किस चीज़ की ज़रूरत होती है?
    - सूरज की किरन रोशनी के साथ और क्या देती है?
    solution: 'चरण 1: सर्दी में शरीर ठंडा होता है। चरण 2: किरनें गर्मी देती हैं, इसलिए लोग धूप में बैठते हैं।'
    mistakes:
      धूप में बारिश होती है: c5h1_roshni
      धूप में हवा ठंडी होती है: c5h1_roshni
  - prompt: पाठ में किरन किस बात का निशान है?
    options:
    - नई शुरुआत और उम्मीद
    - डर और दुख
    - थकान और नींद
    answer: नई शुरुआत और उम्मीद
    difficulty: 3
    hints:
    - किरन दिन के किस हिस्से में आती है?
    - सुबह होने पर मन में कैसा भाव आता है?
    solution: 'चरण 1: किरन से नया दिन शुरू होता है। चरण 2: इसलिए वह नई शुरुआत और उम्मीद का निशान है।'
    mistakes:
      डर और दुख: c5h1_roshni
      थकान और नींद: c5h1_roshni
  - prompt: इनमें से कौन-सा काम किरन आने के बाद होता है?
    options:
    - लोग काम पर निकलते हैं
    - लोग सोने जाते हैं
    - दीये जलाए जाते हैं
    answer: लोग काम पर निकलते हैं
    difficulty: 2
    hints:
    - दिन शुरू होने पर लोग क्या करते हैं?
    - रात के काम और दिन के काम अलग करो।
    solution: 'चरण 1: किरन से दिन शुरू होता है। चरण 2: दिन में लोग काम पर निकलते हैं।'
    mistakes:
      लोग सोने जाते हैं: c5h1_kram
      दीये जलाए जाते हैं: c5h1_kram
  - prompt: '''पक्षी'' शब्द का बहुवचन वाक्य कौन-सा है?'
    options:
    - पक्षी चहचहा रहे हैं।
    - पक्षी चहचहा रहा है।
    - पक्षी चहचहाती है।
    answer: पक्षी चहचहा रहे हैं।
    difficulty: 3
    hints:
    - बहुवचन का अर्थ है एक से ज़्यादा।
    - '''रहे हैं'' और ''रहा है'' में से कौन ज़्यादा के लिए है?'
    solution: 'चरण 1: बहुत से पक्षियों के लिए क्रिया ''रहे हैं'' लगती है। चरण 2: सही वाक्य ''पक्षी चहचहा रहे हैं।'''
    mistakes:
      पक्षी चहचहा रहा है।: c5h1_shabd
      पक्षी चहचहाती है।: c5h1_shabd
