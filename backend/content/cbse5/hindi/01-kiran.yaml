subject: cbse5-hin
chapter: 1
title: किरन
tips:
  hin5_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है: उस पात्र या घटना वाला हिस्सा खोजें।'
  hin5_word: शब्द को अपने वाक्य में बोलकर देखें। क्या अर्थ ठीक बैठता है?
  hin5_lesson: 'सोचें: इस कहानी से हमें क्या सीख मिलती है? पात्र ने क्या अच्छा या गलत किया?'
  h5_kiran_andhera: "किरन रोशनी लाती है। रोशनी आने पर कमरे से कौन चुपचाप चला जाता है?"
  h5_paudha_dhoop: "पत्ते धूप, हवा और पानी से कुछ बनाते हैं जिससे पौधा बढ़ता है। पौधे को बढ़ने के लिए क्या चाहिए?"
concepts:
- code: cbse5h.v1.kiran
  title: किरन
  notes: |
    सूरज की किरन के बारे में पाठ। सुबह सूरज की किरन धरती पर आती है तो अँधेरा भागता है, फूल खिलते हैं, पक्षी जागते हैं
    और लोग काम पर निकलते हैं। किरन रोशनी और गर्मी देती है, पौधों को भोजन बनाने में मदद करती है। पाठ का भाव:
    प्रकाश नई शुरुआत और उम्मीद का प्रतीक है। (पाठ की ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।)
  explanations:
    text: सुबह जब सूरज की पहली किरन आती है, अँधेरा चला जाता है। फूल खिल उठते हैं, चिड़ियाँ चहचहाती हैं और सब जाग जाते हैं। किरन हमें रोशनी और गर्मी देती है।
    visual: 'एक चित्र बनाइए: पहाड़ के पीछे से उगता सूरज, उसकी किरनें खेतों पर पड़ रही हैं, फूल खिल रहे हैं और चिड़ियाँ उड़ रही हैं।'
    step_by_step: 1. किरन कहाँ से आती है? सूरज से। 2. किरन आने पर क्या होता है? अँधेरा भागता है, सब जागते हैं। 3. किरन क्या देती है? रोशनी और गर्मी।
    real_world: 'सर्दी की सुबह धूप में बैठना कितना अच्छा लगता है: यही सूरज की किरनों की गर्मी है।'
  picture:
    kind: flow
    steps:
    - सूरज उगता है
    - किरन धरती पर आती है
    - अँधेरा भागता है
    - फूल खिलते हैं, पक्षी जागते हैं
    alt: सूरज उगता है, किरन धरती पर आती है, अँधेरा भागता है, और फूल खिलते हैं तथा पक्षी जागते हैं।
  activity:
    type: order
    prompt: सुबह सूरज की किरन आने पर क्या-क्या होता है? क्रम से लगाओ।
    steps:
    - रात का अँधेरा
    - सूरज की किरन धरती पर आती है
    - अँधेरा भागता है, फूल खिलते हैं
    - लोग काम पर निकलते हैं
    reasons:
      सूरज की किरन धरती पर आती है: किरन रात के अँधेरे के बाद सुबह आती है।
      अँधेरा भागता है, फूल खिलते हैं: किरन आने से ही अँधेरा हटता है।
      लोग काम पर निकलते हैं: उजाला होने पर ही दिन का काम शुरू होता है।
  items:
  - prompt: किरन कहाँ से आती है?
    options:
    - सूरज से
    - चाँद से
    - दीपक से
    - बादल से
    answer: सूरज से
    difficulty: 1
    hints:
    - सुबह की रोशनी।
    - आसमान में चमकता गोला।
    solution: किरन सूरज से आती है।
    mistakes:
      चाँद से: hin5_read_again
  - prompt: सुबह किरन आने पर क्या भागता है?
    options:
    - अँधेरा
    - पानी
    - पेड़
    - हवा
    answer: अँधेरा
    difficulty: 1
    hints:
    - रात में क्या होता है?
    - रोशनी का उलटा।
    solution: रोशनी आते ही अँधेरा भागता है।
    mistakes: {"पानी": "h5_kiran_andhera", "पेड़": "h5_kiran_andhera", "हवा": "h5_kiran_andhera"}
  - prompt: सूरज की किरन हमें क्या देती है?
    options:
    - रोशनी और गर्मी
    - बारिश
    - बर्फ़
    - अँधेरा
    answer: रोशनी और गर्मी
    difficulty: 1
    hints:
    - धूप।
    - सर्दी में अच्छी लगती है।
    solution: किरन रोशनी और गर्मी देती है।
    mistakes: {"बारिश": "h2_din_roshni", "बर्फ़": "h2_din_roshni", "अँधेरा": "h2_din_roshni"}
  - prompt: '''किरन'' का सही अर्थ क्या है?'
    options:
    - रोशनी की रेखा
    - एक फल
    - एक नदी
    - एक जानवर
    answer: रोशनी की रेखा
    difficulty: 1
    hints:
    - सूरज की ...
    - प्रकाश।
    solution: किरन प्रकाश की रेखा है।
    mistakes:
      एक फल: hin5_word
  - prompt: '''अँधेरा'' का उलटा (विलोम) शब्द है:'
    options:
    - उजाला
    - रात
    - काला
    - छाया
    answer: उजाला
    difficulty: 2
    hints:
    - रोशनी।
    - दिन में होता है।
    solution: अँधेरा का विलोम उजाला है।
    mistakes: {"रात": "h1_ulta", "काला": "h1_ulta", "छाया": "h1_ulta"}
  - prompt: पौधों के लिए सूरज की किरन क्यों ज़रूरी है?
    options:
    - भोजन बनाने के लिए
    - सोने के लिए
    - ठंडा रहने के लिए
    - जड़ें काटने के लिए
    answer: भोजन बनाने के लिए
    difficulty: 2
    hints:
    - हरी पत्तियाँ।
    - धूप में भोजन बनता है।
    solution: पौधे धूप की मदद से भोजन बनाते हैं।
    mistakes: {"सोने के लिए": "h5_paudha_dhoop", "ठंडा रहने के लिए": "h5_paudha_dhoop", "जड़ें काटने के लिए": "h5_paudha_dhoop"}
