subject: cbse5-hin
chapter: 2
title: न्याय की कुर्सी
concepts:
- code: cbse5h.v2.kursi
  title: न्याय की कुर्सी
  notes: |
    राजा भोज और राजा विक्रमादित्य से जुड़ी कहानी, जो न्याय और निष्पक्षता सिखाती है। लोककथा के अनुसार एक साधारण चरवाहा
    लड़का एक टीले पर बैठकर बहुत सही फ़ैसले सुनाता था। राजा भोज ने टीला खुदवाया तो नीचे राजा विक्रमादित्य का न्याय
    सिंहासन मिला। जो उस पर बैठता, वह न्याय करता। संदेश: न्याय का आसन सच्चाई और निष्पक्षता माँगता है।
    (पाठ की ठीक घटनाएँ छपी पुस्तक से मिलानी हैं।)
  explanations:
    text: यह कहानी न्याय के बारे में है। कहते हैं कि एक चरवाहा लड़का एक टीले पर बैठकर बहुत सही फ़ैसले करता था। राजा भोज ने खुदवाया तो नीचे राजा विक्रमादित्य का न्याय का सिंहासन मिला। न्याय की कुर्सी पर बैठने वाले को सच्चा और निष्पक्ष होना चाहिए।
    visual: 'चित्र बनाइए: एक टीले पर बैठा चरवाहा लड़का फ़ैसला सुना रहा है, सामने दो गाँव वाले खड़े हैं, पास में राजा भोज देख रहे हैं।'
    step_by_step: '1. पात्र पहचानें: चरवाहा लड़का, राजा भोज, विक्रमादित्य। 2. लड़का क्या करता था? सही फ़ैसले। 3. टीले के नीचे क्या मिला? सिंहासन। 4. सीख: न्याय निष्पक्ष हो।'
    real_world: आज अदालतों में न्यायाधीश भी बिना भेदभाव के फ़ैसले करते हैं।
  picture:
    kind: compare
    columns:
    - title: पात्र
      points:
      - चरवाहा लड़का
      - राजा भोज
      - विक्रमादित्य
    - title: भूमिका
      points:
      - सही फ़ैसले करता है
      - टीला खुदवाते हैं
      - न्यायप्रिय राजा, सिंहासन उनका
    alt: चरवाहा लड़का सही फ़ैसले करता है, राजा भोज टीला खुदवाते हैं, और सिंहासन न्यायप्रिय राजा विक्रमादित्य का है।
  items:
  - prompt: '''न्याय'' का अर्थ है:'
    options:
    - सही और निष्पक्ष फ़ैसला
    - झगड़ा
    - खेल
    - भोजन
    answer: सही और निष्पक्ष फ़ैसला
    difficulty: 1
    hints:
    - कुर्सी पर बैठकर क्या करते हैं?
    - फ़ैसला।
    solution: न्याय यानी सही और निष्पक्ष फ़ैसला।
    mistakes:
      झगड़ा: hin5_word
  - prompt: कहानी में किन राजाओं का नाम आता है?
    options:
    - राजा भोज और विक्रमादित्य
    - अकबर और बीरबल
    - राम और लक्ष्मण
    - अशोक और चंद्रगुप्त
    answer: राजा भोज और विक्रमादित्य
    difficulty: 1
    hints:
    - सिंहासन किसका था?
    - टीला किसने खुदवाया?
    solution: कहानी राजा भोज और विक्रमादित्य से जुड़ी है।
    mistakes:
      अकबर और बीरबल: hin5_read_again
  - prompt: न्याय करने वाले व्यक्ति को कैसा होना चाहिए?
    options:
    - निष्पक्ष
    - गुस्सैल
    - आलसी
    - डरपोक
    answer: निष्पक्ष
    difficulty: 1
    hints:
    - सबके साथ एक जैसा।
    - भेदभाव नहीं।
    solution: न्यायाधीश को निष्पक्ष होना चाहिए।
  - prompt: '''सिंहासन'' किसे कहते हैं?'
    options:
    - राजा के बैठने का आसन
    - एक शेर
    - एक पेड़
    - एक नदी
    answer: राजा के बैठने का आसन
    difficulty: 2
    hints:
    - सिंह + आसन।
    - राजा का।
    solution: सिंहासन राजा का आसन है।
    mistakes:
      एक शेर: hin5_word
  - prompt: इस कहानी की मुख्य सीख क्या है?
    options:
    - सच्चाई और निष्पक्षता से फ़ैसला करना चाहिए
    - हमेशा दोस्त का पक्ष लेना चाहिए
    - राजा हमेशा सही होता है
    - फ़ैसला जल्दी में करना चाहिए
    answer: सच्चाई और निष्पक्षता से फ़ैसला करना चाहिए
    difficulty: 2
    hints:
    - न्याय की कुर्सी क्या माँगती है?
    - निष्पक्षता।
    solution: न्याय सच्चाई और निष्पक्षता से होना चाहिए।
    mistakes:
      हमेशा दोस्त का पक्ष लेना चाहिए: hin5_lesson
  - prompt: '''निष्पक्ष'' का अर्थ है:'
    options:
    - किसी का पक्ष न लेने वाला
    - बहुत अमीर
    - बहुत बूढ़ा
    - बहुत तेज़
    answer: किसी का पक्ष न लेने वाला
    difficulty: 2
    hints:
    - निः + पक्ष।
    - बिना पक्ष के।
    solution: निष्पक्ष यानी जो किसी का पक्ष न ले।
