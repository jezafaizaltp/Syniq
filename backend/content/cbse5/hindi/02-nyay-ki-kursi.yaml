subject: cbse5-hin
chapter: 2
title: न्याय की कुर्सी
tips:
  h5_nis_upsarg: "'निस्' का अर्थ है 'बिना'। निष्पक्ष = बिना + पक्ष। अब अर्थ जोड़ो।"
  h5_nishpaksh: "न्याय करने वाला दोनों पक्षों की बात सुनता है। उसे किसी एक की तरफ़ झुकना चाहिए?"
  c5h2_kahani: 'कहानी की घटनाएँ याद करो: लड़का कहाँ बैठता था और राजा ने वहाँ क्या करवाया?'
  c5h2_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?
  c5h2_seekh: 'सोचो: अच्छा फ़ैसला करने वाला किसकी बात सुनता है और किसका पक्ष लेता है?'

concepts:
- code: cbse5h.v2.kursi
  title: न्याय की कुर्सी
  notes: |
    राजा भोज और राजा विक्रमादित्य से जुड़ी कहानी, जो न्याय और निष्पक्षता सिखाती है। लोककथा के अनुसार एक साधारण चरवाहा
    लड़का एक टीले पर बैठकर बहुत सही फ़ैसले सुनाता था। राजा भोज ने टीला खुदवाया तो नीचे राजा विक्रमादित्य का न्याय
    सिंहासन मिला। जो उस पर बैठता, वह न्याय करता। संदेश: न्याय का आसन सच्चाई और निष्पक्षता माँगता है।
    (पाठ की ठीक घटनाएँ छपी पुस्तक से मिलानी हैं।)
  explanations:
    text: यह कहानी न्याय के बारे में है। कहते हैं कि एक चरवाहा लड़का एक टीले पर बैठकर बहुत सही फ़ैसले करता था। राजा भोज ने खुदवाया तो नीचे राजा विक्रमादित्य का न्याय का सिंहासन मिला। न्याय की कुर्सी पर बैठने वाले को सच्चा और निष्पक्ष होना चाहिए।
    visual: 'चित्र बनाइए: एक टीले पर बैठा चरवाहा लड़का फ़ैसला सुना रहा है, सामने दो गाँव वाले खड़े हैं, पास में राजा भोज देख रहे हैं।'
    step_by_step: '1. पात्र पहचानें: चरवाहा लड़का, राजा भोज, विक्रमादित्य। 2. लड़का क्या करता था? सही फ़ैसले। 3. टीले के नीचे क्या मिला? सिंहासन। 4. सीख: न्याय निष्पक्ष हो।'
    real_world: आज अदालतों में न्यायाधीश भी बिना भेदभाव के फ़ैसले करते हैं।
  picture:
    kind: compare
    columns:
    - title: पात्र
      points:
      - चरवाहा लड़का
      - राजा भोज
      - विक्रमादित्य
    - title: भूमिका
      points:
      - सही फ़ैसले करता है
      - टीला खुदवाते हैं
      - न्यायप्रिय राजा, सिंहासन उनका
    alt: चरवाहा लड़का सही फ़ैसले करता है, राजा भोज टीला खुदवाते हैं, और सिंहासन न्यायप्रिय राजा विक्रमादित्य का है।
  activity:
    type: order
    prompt: न्याय की कुर्सी की कहानी क्रम से लगाओ।
    steps:
    - चरवाहा लड़का टीले पर बैठकर सही फ़ैसले सुनाता है
    - राजा भोज टीला खुदवाते हैं
    - नीचे विक्रमादित्य का न्याय सिंहासन मिलता है
    reasons:
      राजा भोज टीला खुदवाते हैं: लड़के के सही फ़ैसलों की बात सुनकर ही राजा को टीले में कुछ होने का शक हुआ।
      नीचे विक्रमादित्य का न्याय सिंहासन मिलता है: खुदाई के बाद ही सिंहासन मिला।
  lesson:
    - teach: यह एक लोककथा है। एक साधारण चरवाहा लड़का एक टीले पर बैठकर लोगों के झगड़ों के बहुत सही फ़ैसले सुनाता था। लोग हैरान थे कि एक बच्चा इतना सही न्याय कैसे करता है।
      check:
        prompt: चरवाहा लड़का फ़ैसले कहाँ बैठकर सुनाता था?
        options:
        - एक टीले पर
        - महल में
        - नदी में
        answer: एक टीले पर
        why: कहानी का रहस्य उसी टीले में छिपा था।
      ways:
      - style: visual
        teach: 'कहानी की शुरुआत: चरवाहा लड़का कहाँ बैठता था और क्या करता था।'
        picture:
          kind: compare
          columns:
          - title: कौन और कहाँ
            points:
            - एक साधारण चरवाहा लड़का
            - एक टीले पर बैठता था
          - title: क्या करता था
            points:
            - लोगों के झगड़े सुनता था
            - बहुत सही फ़ैसले सुनाता था
          alt: एक साधारण चरवाहा लड़का एक टीले पर बैठता था। वह लोगों के झगड़े सुनता और बहुत सही फ़ैसले सुनाता था।
      - style: real_world
        teach: गाँवों में आज भी कई बार लोग किसी समझदार बुज़ुर्ग के पास जाते हैं, जो दोनों की बात शांति से सुनकर सही रास्ता बताते हैं। लोग उनकी बात इसलिए मानते हैं क्योंकि वे किसी का पक्ष नहीं लेते।
    - teach: राजा भोज ने यह सुना और टीला खुदवाया। नीचे राजा विक्रमादित्य का न्याय-सिंहासन मिला। माना गया कि जो उस आसन पर बैठता है, वह न्याय करता है।
      picture:
        kind: flow
        steps:
        - लड़का टीले पर बैठकर फ़ैसले सुनाता है
        - राजा भोज को खबर मिलती है
        - टीला खुदवाया जाता है
        - विक्रमादित्य का सिंहासन मिलता है
        alt: 'कहानी चार चरणों में: टीला, खबर, खुदाई, सिंहासन।'
      check:
        prompt: टीले के नीचे क्या मिला?
        options:
        - न्याय का सिंहासन
        - सोने का घड़ा
        - पुरानी तलवार
        answer: न्याय का सिंहासन
        why: उसी सिंहासन के कारण लड़का सही न्याय करता था।
      ways:
      - style: step_by_step
        teach: 'कहानी की घटनाएँ क्रम से लगाओ। पहला: लड़का टीले पर बैठकर फ़ैसले सुनाता है। दूसरा: राजा भोज यह बात सुनते हैं। तीसरा: टीला खुदवाया जाता है। चौथा: नीचे विक्रमादित्य का सिंहासन मिलता है।'
      - style: real_world
        teach: पुराने किलों और मंदिरों की खुदाई में कई बार ज़मीन के नीचे से पुरानी मूर्तियाँ, सिक्के और बर्तन मिलते हैं। इनसे हमें पता चलता है कि बहुत पहले लोग कैसे रहते थे।
    - teach: कहानी सिखाती है कि न्याय की कुर्सी सच्चाई और निष्पक्षता माँगती है। निष्पक्ष का अर्थ है किसी का पक्ष न लेना। अच्छा न्यायी दोनों पक्षों की बात सुनता है।
      check:
        prompt: अच्छा न्यायी क्या करता है?
        options:
        - दोनों पक्षों की बात सुनता है
        - केवल दोस्त की बात सुनता है
        - बिना सुने फ़ैसला करता है
        answer: दोनों पक्षों की बात सुनता है
        why: दोनों को सुनकर ही निष्पक्ष फ़ैसला होता है।
      ways:
      - style: visual
        teach: निष्पक्ष फ़ैसला और पक्षपात वाला फ़ैसला, दोनों में अंतर देखो।
        picture:
          kind: compare
          columns:
          - title: निष्पक्ष
            points:
            - दोनों की बात सुनता है
            - सच देखकर फ़ैसला करता है
            - दोस्त हो या अनजान, सबके लिए एक नियम
          - title: पक्षपात
            points:
            - एक की ही सुनता है
            - दोस्त का साथ देता है
            - दूसरे के साथ अन्याय होता है
          alt: निष्पक्ष व्यक्ति दोनों की बात सुनता है, सच देखकर फ़ैसला करता है और सबके लिए एक नियम रखता है। पक्षपात करने वाला एक की ही सुनता है, दोस्त का साथ देता है और दूसरे के साथ अन्याय होता है।
      - style: real_world
        teach: खेल में अंपायर या रेफ़री का काम भी न्याय की कुर्सी जैसा है। उसे अपनी पसंद की टीम नहीं, बल्कि नियम देखकर फ़ैसला देना होता है।
  items:
  - prompt: '''न्याय'' का अर्थ है:'
    options:
    - सही और निष्पक्ष फ़ैसला
    - झगड़ा
    - खेल
    - भोजन
    answer: सही और निष्पक्ष फ़ैसला
    difficulty: 1
    hints:
    - कुर्सी पर बैठकर क्या करते हैं?
    - फ़ैसला।
    solution: न्याय यानी सही और निष्पक्ष फ़ैसला।
    mistakes:
      झगड़ा: hin5_word
  - prompt: कहानी में किन राजाओं का नाम आता है?
    options:
    - राजा भोज और विक्रमादित्य
    - अकबर और बीरबल
    - राम और लक्ष्मण
    - अशोक और चंद्रगुप्त
    answer: राजा भोज और विक्रमादित्य
    difficulty: 1
    hints:
    - सिंहासन किसका था?
    - टीला किसने खुदवाया?
    solution: कहानी राजा भोज और विक्रमादित्य से जुड़ी है।
    mistakes:
      अकबर और बीरबल: hin5_read_again
  - prompt: न्याय करने वाले व्यक्ति को कैसा होना चाहिए?
    options:
    - निष्पक्ष
    - गुस्सैल
    - आलसी
    - डरपोक
    answer: निष्पक्ष
    difficulty: 1
    hints:
    - सबके साथ एक जैसा।
    - भेदभाव नहीं।
    solution: न्यायाधीश को निष्पक्ष होना चाहिए।
    mistakes: {"गुस्सैल": "h5_nishpaksh", "आलसी": "h5_nishpaksh", "डरपोक": "h5_nishpaksh"}
  - prompt: '''सिंहासन'' किसे कहते हैं?'
    options:
    - राजा के बैठने का आसन
    - एक शेर
    - एक पेड़
    - एक नदी
    answer: राजा के बैठने का आसन
    difficulty: 2
    hints:
    - सिंह + आसन।
    - राजा का।
    solution: सिंहासन राजा का आसन है।
    mistakes:
      एक शेर: hin5_word
  - prompt: इस कहानी की मुख्य सीख क्या है?
    options:
    - "सच्चाई और निष्पक्षता से फ़ैसला करना चाहिए"
    - "हर बार अपने दोस्त का ही पक्ष लेना चाहिए"
    - "राजा की हर बात हमेशा सही ही होती है"
    - "कोई भी फ़ैसला बहुत जल्दी में करना चाहिए"
    answer: सच्चाई और निष्पक्षता से फ़ैसला करना चाहिए
    difficulty: 2
    hints:
    - न्याय की कुर्सी क्या माँगती है?
    - निष्पक्षता।
    solution: न्याय सच्चाई और निष्पक्षता से होना चाहिए।
    mistakes:
      "हर बार अपने दोस्त का ही पक्ष लेना चाहिए": hin5_lesson
  - prompt: '''निष्पक्ष'' का अर्थ है:'
    options:
    - किसी का पक्ष न लेने वाला
    - बहुत अमीर
    - बहुत बूढ़ा
    - बहुत तेज़
    answer: किसी का पक्ष न लेने वाला
    difficulty: 2
    hints:
    - निः + पक्ष।
    - बिना पक्ष के।
    solution: निष्पक्ष यानी जो किसी का पक्ष न ले।
    mistakes: {"बहुत अमीर": "h5_nis_upsarg", "बहुत बूढ़ा": "h5_nis_upsarg", "बहुत तेज़": "h5_nis_upsarg"}
  - prompt: चरवाहा लड़का किस काम के लिए प्रसिद्ध हो गया?
    options:
    - सही फ़ैसले सुनाने के लिए
    - गाना गाने के लिए
    - तेज़ दौड़ने के लिए
    answer: सही फ़ैसले सुनाने के लिए
    difficulty: 1
    hints:
    - लोग उसके पास अपने झगड़े लेकर आते थे।
    - वह झगड़ों का क्या करता था?
    solution: 'चरण 1: लोग झगड़े लेकर आते थे। चरण 2: वह सही फ़ैसले सुनाता था।'
    mistakes:
      गाना गाने के लिए: c5h2_kahani
      तेज़ दौड़ने के लिए: c5h2_kahani
  - prompt: टीला किसने खुदवाया?
    options:
    - राजा भोज ने
    - चरवाहे ने
    - एक व्यापारी ने
    answer: राजा भोज ने
    difficulty: 1
    hints:
    - कहानी में दो राजाओं के नाम हैं।
    - जो राजा कहानी के समय राज कर रहे थे।
    solution: 'चरण 1: लड़के की खबर राजा तक पहुँची। चरण 2: राजा भोज ने टीला खुदवाया।'
    mistakes:
      चरवाहे ने: c5h2_kahani
      एक व्यापारी ने: c5h2_kahani
  - prompt: सिंहासन किस पुराने राजा का था?
    options:
    - विक्रमादित्य
    - अशोक
    - अकबर
    answer: विक्रमादित्य
    difficulty: 2
    hints:
    - यह राजा अपने न्याय के लिए प्रसिद्ध थे।
    - कहानी में आए दूसरे राजा का नाम सोचो।
    solution: 'चरण 1: कहानी में दो राजा हैं: भोज और एक पुराने राजा। चरण 2: सिंहासन विक्रमादित्य का था।'
    mistakes:
      अशोक: c5h2_kahani
      अकबर: c5h2_kahani
  - prompt: '''चरवाहा'' किसे कहते हैं?'
    options:
    - जो पशु चराता है
    - जो कपड़े सिलता है
    - जो खेत में हल चलाता है
    answer: जो पशु चराता है
    difficulty: 1
    hints:
    - शब्द में 'चर' छिपा है।
    - गाय-बकरियों को घास के मैदान में कौन ले जाता है?
    solution: 'चरण 1: चराना = पशुओं को घास खिलाने ले जाना। चरण 2: चरवाहा वह जो पशु चराता है।'
    mistakes:
      जो कपड़े सिलता है: c5h2_shabd
      जो खेत में हल चलाता है: c5h2_shabd
  - prompt: '''न्याय'' का विलोम शब्द क्या है?'
    options:
