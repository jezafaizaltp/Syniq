    alt: काजीरंगा एक सींग वाले गैंडे के लिए, पेरियार हाथियों के लिए और गिर एशियाई शेरों के लिए प्रसिद्ध है।
  activity:
    type: sort
    prompt: काजीरंगा के बारे में कौन-सी बात सही है?
    bins:
    - काजीरंगा
