subject: cbse5-hin
chapter: 8
title: काजीरंगा राष्ट्रीय उद्यान की यात्रा
tips:
  h5_brahmaputra: "काजीरंगा असम में है। असम के बीच से बहने वाली विशाल नदी का नाम 'ब्रह्मा के पुत्र' जैसा है।"
  h5_gainda: "ऊँट रेगिस्तान में, पेंगुइन बर्फ़ में, जिराफ़ अफ़्रीका में। असम के घास के मैदानों में मोटी खाल और नाक पर सींग वाला जानवर?"
  h5_safari: "जंगल में समुद्र या रेल नहीं होती। ऊँची घास के बीच जानवरों के पास कैसे जाएँ? दो सवारियाँ सोचो।"

concepts:
- code: cbse5h.v8.kaziranga
  title: काजीरंगा राष्ट्रीय उद्यान की यात्रा
  notes: |
    यात्रा-वृत्तांत: काजीरंगा राष्ट्रीय उद्यान असम में, ब्रह्मपुत्र नदी के किनारे है। यह एक सींग वाले गैंडे के लिए प्रसिद्ध
    है (दुनिया के ज़्यादातर एक सींग वाले गैंडे यहीं हैं)। यहाँ हाथी, बाघ, जंगली भैंस, हिरण और कई पक्षी हैं। पर्यटक जीप या
    हाथी की सवारी से जंगल देखते हैं। यह यूनेस्को विश्व धरोहर स्थल है। संदेश: वन्य जीवों की रक्षा करें।
  explanations:
    text: यह पाठ असम के काजीरंगा राष्ट्रीय उद्यान की यात्रा के बारे में है। यह ब्रह्मपुत्र नदी के पास है और एक सींग वाले गैंडे के लिए मशहूर है। यहाँ हाथी, बाघ, जंगली भैंस और बहुत से पक्षी भी रहते हैं।
    visual: 'चित्र बनाइए: ऊँची घास में एक सींग वाला गैंडा, पीछे पानी में जंगली भैंसें, ऊपर उड़ते पक्षी और एक जीप में बैठे पर्यटक।'
    step_by_step: '1. जगह: काजीरंगा, असम। 2. पास की नदी: ब्रह्मपुत्र। 3. प्रसिद्ध जीव: एक सींग वाला गैंडा। 4. कैसे घूमे? जीप या हाथी की सवारी।'
    real_world: 'भारत में कई राष्ट्रीय उद्यान हैं: केरल का पेरियार हाथियों और बाघों के लिए, गुजरात का गिर शेरों के लिए।'
  picture:
    kind: compare
