      clue: काजीरंगा किस जानवर के लिए प्रसिद्ध है?
      why: दुनिया के ज़्यादातर एक सींग वाले गैंडे यहीं।
    - label: जीप या हाथी की सवारी
      bin: काजीरंगा
      clue: पर्यटक जंगल कैसे देखते हैं?
      why: पाठ में बताई सवारी।
    - label: रेगिस्तान और ऊँट
      bin: काजीरंगा नहीं
      clue: नदी किनारे के जंगल में रेगिस्तान?
      why: यह राजस्थान जैसी जगह की बात है।
    - label: बर्फ़ से ढके पहाड़
