      clue: काजीरंगा घास के मैदान और जंगल है या बर्फ़?
      why: काजीरंगा मैदानी उद्यान है।
  lesson:
    - teach: 'यह पाठ एक यात्रा-वृत्तांत है: किसी यात्रा में जो देखा, वह लिखा गया है। काजीरंगा राष्ट्रीय उद्यान असम में ब्रह्मपुत्र नदी के किनारे है।'
      check:
