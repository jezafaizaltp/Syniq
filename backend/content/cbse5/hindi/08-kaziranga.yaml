          - हिरण
          - बहुत से पक्षी
        alt: काजीरंगा के जानवर दो समूहों में।
      check:
        prompt: एक सींग वाले गैंडे सबसे ज़्यादा कहाँ हैं?
        options:
        - काजीरंगा में
        - रेगिस्तान में
        - समुद्र में
        answer: काजीरंगा में
        why: दुनिया के ज़्यादातर एक सींग वाले गैंडे यहीं रहते हैं।
      ways:
      - style: step_by_step
        teach: 'नक्शे पर काजीरंगा खोजो। पहला: भारत के नक्शे में उत्तर-पूर्व की ओर जाओ। दूसरा: असम राज्य ढूँढो। तीसरा: असम के बीच से बहती बड़ी नदी ब्रह्मपुत्र को देखो। चौथा: उसी नदी के किनारे काजीरंगा का निशान लगाओ।'
      - style: real_world
        teach: काजीरंगा में सुबह-सुबह ऊँची घास के बीच से गैंडे पानी के गड्ढों के पास आते दिखते हैं। गैंडे को कीचड़ में लोटना पसंद है, इससे उसकी मोटी खाल ठंडी रहती है और कीड़े दूर रहते हैं।
    - teach: 'पर्यटक जीप या हाथी की सवारी से जंगल देखते हैं। काजीरंगा यूनेस्को विश्व धरोहर स्थल है। राष्ट्रीय उद्यान इसलिए बनते हैं कि जानवर और पेड़-पौधे सुरक्षित रहें। संदेश: वन्य जीवों की रक्षा करो।'
      check:
        prompt: राष्ट्रीय उद्यान में हमें क्या करना चाहिए?
