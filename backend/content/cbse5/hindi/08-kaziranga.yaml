      - style: real_world
        teach: पहले गैंडों का शिकार उनके सींग के लिए बहुत होता था। उद्यान बनने और वन-रक्षकों की कड़ी पहरेदारी के बाद काजीरंगा में गैंडों की संख्या फिर से बढ़ी है।
