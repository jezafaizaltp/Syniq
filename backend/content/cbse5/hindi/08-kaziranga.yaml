        picture:
          kind: flow
          steps:
          - कहाँ जा रहे हैं और कैसे पहुँचे
          - रास्ते में क्या देखा
          - वहाँ पहुँचकर क्या-क्या देखा
          - मन में कैसा लगा
          - लौटते समय क्या याद रहा
          alt: यात्रा-वृत्तांत में लिखा जाता है कि कहाँ जा रहे हैं और कैसे पहुँचे, रास्ते में क्या देखा, वहाँ पहुँचकर क्या-क्या देखा, मन में कैसा लगा, और लौटते समय क्या याद रहा।
      - style: real_world
        teach: 'छुट्टियों में किसी नई जगह घूमकर आने पर हम दोस्तों को बताते हैं: पहले ट्रेन से गए, फिर पहाड़ देखे, वहाँ का खाना खाया। अगर यही बातें क्रम से लिख दो, तो वह यात्रा-वृत्तांत बन जाता है।'
    - teach: काजीरंगा एक सींग वाले गैंडे के लिए प्रसिद्ध है। दुनिया के ज़्यादातर एक सींग वाले गैंडे यहीं रहते हैं। यहाँ हाथी, बाघ, जंगली भैंस, हिरण और बहुत से पक्षी भी हैं।
      picture:
        kind: compare
        columns:
        - title: बड़े जानवर
          points:
          - एक सींग वाला गैंडा
          - हाथी
