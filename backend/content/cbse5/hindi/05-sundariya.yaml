subject: cbse5-hin
chapter: 5
title: सुंदरिया
tips:
  h5_kram: "कोई कहानी सुनाते समय तुम 'एक बार की बात है...' से शुरू करते हो या 'फिर वे खुशी से रहने लगे' से?"
  h5_patra: "कहानी में कौन बोलता, चलता और काम करता है? वही पात्र हैं।"
  h5_visheshan: "विशेषण किसी चीज़ की खूबी बताता है। पूछो: फूल कैसा है?"

concepts:
- code: cbse5h.v5.sundariya
  title: सुंदरिया
  notes: |
    पुस्तक का पाँचवाँ पाठ 'सुंदरिया'। इस पाठ के ठीक पात्र और घटनाएँ यहाँ नहीं दी गई हैं (स्रोत उपलब्ध नहीं)। अभ्यास
    पाठ पढ़ने के कौशल पर हैं: पात्र, घटना-क्रम, भाव पहचानना; 'सुंदर' से बने शब्द (सुंदरता, सुंदरी); विशेषण (सुंदर,
    ऊँचा, हरा); विलोम शब्द।
  explanations:
    text: किसी भी कहानी को समझने के लिए पहले पात्र पहचानें, फिर देखें कि शुरुआत, बीच और अंत में क्या हुआ। 'सुंदर' जैसे शब्द किसी चीज़ की विशेषता बताते हैं; इन्हें विशेषण कहते हैं।
    visual: 'एक कहानी-पट्टी बनाइए: तीन खाने: शुरुआत, बीच, अंत। हर खाने में एक छोटा चित्र और एक वाक्य लिखिए।'
    step_by_step: 1. पाठ ध्यान से पढ़ें। 2. पात्रों के नाम लिखें। 3. घटनाएँ क्रम से लिखें। 4. विशेषण शब्द रेखांकित करें।
    real_world: जब हम दोस्त को कोई फ़िल्म की कहानी सुनाते हैं, तो शुरुआत से अंत तक क्रम में बताते हैं।
  picture:
    kind: flow
    steps:
    - पात्र पहचानें
    - शुरुआत में क्या हुआ
    - बीच में क्या बदला
    - अंत और सीख
    alt: 'कहानी समझने के चरण: पात्र पहचानें, शुरुआत देखें, बीच में क्या बदला, और अंत तथा सीख।'
  activity:
    type: sort
    prompt: '''सुंदर'' से बने शब्द और विशेषण: कौन-सा शब्द किस तरह का है?'
    bins:
    - विशेषण (कैसा?)
    - संज्ञा (क्या?)
    items:
    - label: सुंदर
      bin: विशेषण (कैसा?)
      clue: '''सुंदर फूल'': फूल कैसा है?'
      why: 'सुंदर गुण बताता है: विशेषण।'
    - label: ऊँचा
      bin: विशेषण (कैसा?)
      clue: '''ऊँचा पेड़'': पेड़ कैसा?'
      why: विशेषण।
    - label: हरा
      bin: विशेषण (कैसा?)
      clue: '''हरा पत्ता'': पत्ता कैसा?'
      why: 'रंग बताता है: विशेषण।'
    - label: सुंदरता
      bin: संज्ञा (क्या?)
      clue: '''फूल की सुंदरता'': यह गुण का नाम है?'
      why: 'गुण का नाम: भाववाचक संज्ञा।'
    - label: ऊँचाई
      bin: संज्ञा (क्या?)
      clue: '''पेड़ की ऊँचाई'' में ''ऊँचाई'' क्या है?'
      why: 'गुण का नाम: संज्ञा।'
  items:
  - prompt: '''सुंदर'' शब्द से बना संज्ञा शब्द कौन-सा है?'
    options:
    - सुंदरता
    - सुंदरतम
    - असुंदर
    - सुंदरतापूर्ण
    answer: सुंदरता
    difficulty: 2
    hints:
    - गुण का नाम।
    - -ता जोड़ें।
    solution: सुंदर + ता = सुंदरता।
    mistakes:
      असुंदर: hin5_word
  - prompt: '''सुंदर फूल'' में विशेषण कौन-सा शब्द है?'
    options:
    - सुंदर
    - फूल
    - दोनों
    - कोई नहीं
    answer: सुंदर
    difficulty: 1
    hints:
    - कौन-सा शब्द फूल के बारे में बताता है?
    - कैसा फूल?
    solution: '''सुंदर'' फूल की विशेषता बताता है।'
    mistakes: {"फूल": "h5_visheshan", "दोनों": "h5_visheshan", "कोई नहीं": "h5_visheshan"}
  - prompt: '''सुंदर'' का विलोम शब्द है:'
    options:
    - कुरूप
    - अच्छा
    - प्यारा
    - बड़ा
    answer: कुरूप
    difficulty: 2
    hints:
    - जो सुंदर न हो।
    - उलटा अर्थ।
    solution: सुंदर का विलोम कुरूप है।
    mistakes: {"अच्छा": "h1_ulta", "प्यारा": "h1_ulta", "बड़ा": "h1_ulta"}
  - prompt: कहानी में 'पात्र' किसे कहते हैं?
    options:
    - कहानी के लोग या जीव
    - कहानी का शीर्षक
    - पुस्तक का पन्ना
    - लेखक का घर
    answer: कहानी के लोग या जीव
    difficulty: 1
    hints:
    - कहानी में कौन-कौन हैं?
    - चरित्र।
    solution: कहानी में आने वाले लोग या जीव पात्र हैं।
    mistakes: {"कहानी का शीर्षक": "h5_patra", "पुस्तक का पन्ना": "h5_patra", "लेखक का घर": "h5_patra"}
  - prompt: कहानी की घटनाओं को किस क्रम में लिखना चाहिए?
    options:
    - शुरुआत, बीच, अंत
    - अंत, शुरुआत, बीच
    - बीच, अंत, शुरुआत
    - किसी भी क्रम में
    answer: शुरुआत, बीच, अंत
    difficulty: 1
    hints:
    - जैसे हुआ वैसे।
    - पहले क्या हुआ?
    solution: घटनाएँ शुरुआत, बीच और अंत के क्रम में लिखें।
    mistakes: {"अंत, शुरुआत, बीच": "h5_kram", "बीच, अंत, शुरुआत": "h5_kram", "किसी भी क्रम में": "h5_kram"}
  - prompt: इनमें से विशेषण कौन-सा है?
    options:
    - हरा
    - दौड़ना
    - मोहन
    - और
    answer: हरा
    difficulty: 2
    hints:
    - रंग बताने वाला शब्द।
    - कैसा?
    solution: '''हरा'' रंग बताता है, इसलिए विशेषण है।'
    mistakes:
      दौड़ना: hin5_word
