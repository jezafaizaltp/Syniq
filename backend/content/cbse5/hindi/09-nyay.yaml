subject: cbse5-hin
chapter: 9
title: न्याय
tips:
  h5_sach_jeet: "वाक्य में 'सच्चाई' और 'जीत' दोनों हैं। जिसकी जीत हो रही है, वही उत्तर में होना चाहिए।"
  h5_satyamev: "शब्द तोड़ो: सत्यम् (सच) + एव (ही) + जयते (जीतता है)।"
  h5_taraaju: "न्याय में दोनों पक्षों को बराबर तौला जाता है। तौलने का यंत्र कौन-सा है?"
  c5h9_paksh: 'सोचो: जिस बात में दो लोग अलग-अलग कह रहे हैं, सच कैसे पता चलेगा?'
  c5h9_saboot: "फ़ैसले से पहले देखो: किसने क्या देखा, और कौन-सी चीज़ें सच की ओर इशारा करती हैं?"
  c5h9_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse5h.v9.nyay
  title: न्याय
  notes: |
    'न्याय' विषय पर एक और पाठ (संभवतः नाटक या कहानी), जिसमें किसी विवाद का सही और निष्पक्ष हल निकाला जाता है। ठीक
    पात्र और घटनाएँ यहाँ नहीं दी गई हैं। अभ्यास न्याय, सच-झूठ परखना, दोनों पक्षों को सुनना, और शब्द-अर्थ पर हैं।
  explanations:
    text: न्याय करने के लिए दोनों पक्षों की बात ध्यान से सुननी चाहिए, सबूत देखने चाहिए और फिर बिना भेदभाव के फ़ैसला करना चाहिए। सच्चाई की हमेशा जीत होती है।
    visual: 'चित्र बनाइए: एक तराज़ू जिसके दोनों पलड़े बराबर हैं: एक पर ''पहला पक्ष'', दूसरे पर ''दूसरा पक्ष''। बीच में ''न्याय''।'
    step_by_step: 1. विवाद क्या है? 2. पहले पक्ष की बात सुनें। 3. दूसरे पक्ष की बात सुनें। 4. सच्चाई परखें। 5. निष्पक्ष फ़ैसला करें।
    real_world: स्कूल में दो दोस्तों का झगड़ा सुलझाते समय शिक्षक दोनों की बात सुनते हैं, फिर फ़ैसला करते हैं।
  picture:
    kind: flow
    steps:
    - विवाद सामने आता है
    - पहले पक्ष की बात
    - दूसरे पक्ष की बात
    - सच्चाई परखकर फ़ैसला
    alt: 'न्याय के चरण: विवाद, पहले पक्ष की बात, दूसरे पक्ष की बात, और सच्चाई परखकर फ़ैसला।'
  activity:
    type: sort
    prompt: सही न्याय करने वाला क्या करता है?
    bins:
    - न्याय में ठीक
    - न्याय में गलत
    items:
    - label: दोनों पक्षों की बात सुनना
      bin: न्याय में ठीक
      clue: एक ही की बात सुनकर फ़ैसला ठीक होगा?
      why: निष्पक्षता के लिए दोनों को सुनना ज़रूरी।
    - label: सबूत देखकर सच परखना
      bin: न्याय में ठीक
      clue: सच-झूठ कैसे पता चले?
      why: सबूत से सच परखा जाता है।
    - label: दोस्त का पक्ष लेना
      bin: न्याय में गलत
      clue: क्या यह निष्पक्ष है?
      why: पक्षपात न्याय नहीं।
    - label: बिना सुने सज़ा देना
      bin: न्याय में गलत
      clue: बिना सुने सच पता चलेगा?
      why: बिना सुने फ़ैसला अन्याय है।
  lesson:
    - teach: न्याय का अर्थ है सही और निष्पक्ष फ़ैसला। जब दो लोगों में विवाद (झगड़ा) हो, तो न्याय करने वाला किसी एक का पक्ष पहले से नहीं लेता।
      check:
        prompt: निष्पक्ष न्यायी कैसा होता है?
        options:
        - किसी का पक्ष पहले से नहीं लेता
        - दोस्त का पक्ष लेता है
        - अमीर का पक्ष लेता है
        answer: किसी का पक्ष पहले से नहीं लेता
        why: पक्ष लेने से फ़ैसला सही नहीं रहता।
      ways:
      - style: visual
        teach: विवाद होने पर न्याय करने वाला क्या करता है और क्या नहीं करता।
        picture:
          kind: compare
          columns:
          - title: न्याय करने वाला करता है
            points:
            - शांत रहता है
            - दोनों को बराबर समझता है
          - title: नहीं करता
            points:
            - पहले से किसी का पक्ष
            - दोस्त या रिश्तेदार की तरफ़दारी
          alt: न्याय करने वाला शांत रहता है और दोनों पक्षों को बराबर समझता है। वह पहले से किसी का पक्ष नहीं लेता और दोस्त या रिश्तेदार की तरफ़दारी नहीं करता।
      - style: real_world
        teach: घर में दो भाई-बहन एक ही रिमोट के लिए झगड़ें, तो समझदार माता-पिता पहले किसी को डाँटते नहीं। वे दोनों से पूछते हैं कि बात क्या है, और फिर बारी तय करते हैं।
    - teach: 'सही फ़ैसले के तीन कदम हैं: दोनों पक्षों की बात सुनो, सबूत और गवाह देखो, फिर सच के आधार पर फ़ैसला करो।'
      picture:
        kind: flow
        steps:
        - पहले पक्ष की बात सुनो
        - दूसरे पक्ष की बात सुनो
        - सबूत और गवाह देखो
        - सच के आधार पर फ़ैसला
        alt: 'न्याय के कदम: दोनों पक्ष सुनना, सबूत देखना, फिर फ़ैसला।'
      check:
        prompt: दोनों पक्षों को सुनने के बाद अगला कदम क्या है?
        options:
        - सबूत और गवाह देखना
        - सिक्का उछालना
        - बिना देखे फ़ैसला सुनाना
        answer: सबूत और गवाह देखना
        why: सबूत से पता चलता है कि किसकी बात सच है।
      ways:
      - style: visual
        teach: सही फ़ैसले तक पहुँचने के तीन कदम, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - दोनों पक्षों की बात सुनो
          - सबूत और गवाह देखो
          - सच के आधार पर फ़ैसला करो
          alt: 'सही फ़ैसले के तीन कदम: पहले दोनों पक्षों की बात सुनो, फिर सबूत और गवाह देखो, और अंत में सच के आधार पर फ़ैसला करो।'
      - style: real_world
        teach: क्रिकेट में जब अंपायर को पक्का पता न हो, तो वह टीवी पर वीडियो देखकर फ़ैसला करवाता है। वीडियो एक सबूत है, जिससे सही फ़ैसला होता है।
    - teach: 'न्याय का प्रतीक तराज़ू है: दोनों पलड़े बराबर, यानी दोनों पक्षों को बराबर मौका। भारत का आदर्श वाक्य ''सत्यमेव जयते'' कहता है कि सत्य की ही जीत होती है।'
      check:
        prompt: तराज़ू के दो बराबर पलड़े किस बात का निशान हैं?
        options:
        - दोनों पक्षों को बराबर मौका
        - ज़्यादा पैसे वाले की जीत
        - जल्दी फ़ैसला
        answer: दोनों पक्षों को बराबर मौका
        why: बराबर पलड़े निष्पक्षता दिखाते हैं।
      ways:
      - style: visual
        teach: 'तराज़ू न्याय का प्रतीक क्यों है: बराबर और ऊपर-नीचे पलड़े।'
        picture:
          kind: compare
          columns:
          - title: पलड़े बराबर
            points:
            - दोनों को बराबर मौका
            - न्याय
          - title: एक पलड़ा झुका
            points:
            - एक की तरफ़दारी
            - अन्याय
          alt: जब तराज़ू के दोनों पलड़े बराबर हों, तो दोनों को बराबर मौका मिलता है, यह न्याय है। जब एक पलड़ा झुका हो, तो एक की तरफ़दारी होती है, यह अन्याय है।
      - style: real_world
        teach: सब्ज़ी वाला तराज़ू से आलू तौलता है। अगर एक पलड़े में चुपके से भारी पत्थर रख दिया जाए, तो ग्राहक के साथ धोखा होगा। ईमानदार तराज़ू की तरह न्याय भी बराबर होना चाहिए।
  items:
  - prompt: सही न्याय के लिए सबसे पहले क्या ज़रूरी है?
    options:
    - दोनों पक्षों की बात सुनना
    - एक पक्ष की बात सुनना
    - जल्दी फ़ैसला करना
    - गुस्सा करना
    answer: दोनों पक्षों की बात सुनना
    difficulty: 1
    hints:
    - तराज़ू के दो पलड़े।
    - दोनों तरफ़।
    solution: दोनों पक्षों को सुनना ज़रूरी है।
    mistakes:
      एक पक्ष की बात सुनना: hin5_lesson
  - prompt: न्याय का प्रतीक क्या माना जाता है?
    options:
    - तराज़ू
    - तलवार
    - कलम
    - घड़ी
    answer: तराज़ू
    difficulty: 2
    hints:
    - दोनों तरफ़ बराबर।
    - तौलने का साधन।
    solution: तराज़ू न्याय का प्रतीक है।
    mistakes: {"तलवार": "h5_taraaju", "कलम": "h5_taraaju", "घड़ी": "h5_taraaju"}
  - prompt: '''सच'' का विलोम शब्द है:'
    options:
    - झूठ
    - सही
    - अच्छा
    - पक्का
    answer: झूठ
    difficulty: 1
    hints:
    - उलटा अर्थ।
    - जो सच न हो।
    solution: सच का विलोम झूठ है।
    mistakes: {"सही": "h1_ulta", "अच्छा": "h1_ulta", "पक्का": "h1_ulta"}
  - prompt: '''विवाद'' का अर्थ है:'
    options:
    - झगड़ा, मतभेद
    - विवाह
    - खेल
    - गीत
    answer: झगड़ा, मतभेद
    difficulty: 2
    hints:
    - दो लोगों में असहमति।
    - बहस।
    solution: विवाद यानी झगड़ा या मतभेद।
    mistakes:
      विवाह: hin5_word
  - prompt: '''सच्चाई की हमेशा जीत होती है'' इसका अर्थ है:'
    options:
    - अंत में सच ही जीतता है
    - झूठ हमेशा जीतता है
    - कोई नहीं जीतता
    - जो ताक़तवर है वही जीतता है
    answer: अंत में सच ही जीतता है
    difficulty: 1
    hints:
    - सत्यमेव जयते।
    - सच।
    solution: इसका अर्थ है कि अंत में सच जीतता है।
    mistakes: {"झूठ हमेशा जीतता है": "h5_sach_jeet", "कोई नहीं जीतता": "h5_sach_jeet", "जो ताक़तवर है वही जीतता है": "h5_sach_jeet"}
  - prompt: 'भारत का राष्ट्रीय आदर्श वाक्य ''सत्यमेव जयते'' का अर्थ है:'
    options:
    - सत्य की ही जीत होती है
    - मेहनत ही पूजा है
    - सबका साथ
    - जय जवान
    answer: सत्य की ही जीत होती है
    difficulty: 2
    hints:
    - सत्य = सच।
    - जयते = जीतता है।
    solution: सत्यमेव जयते यानी सत्य की ही जीत होती है।
    mistakes: {"मेहनत ही पूजा है": "h5_satyamev", "सबका साथ": "h5_satyamev", "जय जवान": "h5_satyamev"}
  - prompt: '''गवाह'' किसे कहते हैं?'
    options:
    - जिसने घटना अपनी आँखों से देखी हो
    - जो झगड़ा शुरू करे
    - जो सज़ा दे
    answer: जिसने घटना अपनी आँखों से देखी हो
    difficulty: 2
    hints:
    - न्याय के समय यह व्यक्ति बताता है कि क्या हुआ।
    - वह घटना के समय वहाँ मौजूद था।
    solution: 'चरण 1: गवाह घटना के समय मौजूद होता है। चरण 2: वह बताता है कि उसने क्या देखा।'
    mistakes:
      जो झगड़ा शुरू करे: c5h9_shabd
      जो सज़ा दे: c5h9_shabd
  - prompt: दो बच्चे कहते हैं कि पेंसिल उनकी है। पेंसिल पर एक का नाम लिखा है। यह क्या है?
    options:
    - सबूत
    - अफ़वाह
    - कहानी
    answer: सबूत
    difficulty: 2
    hints:
    - यह चीज़ सच बताने में मदद करती है।
    - नाम लिखा होना किस बात को दिखाता है?
    solution: 'चरण 1: नाम बताता है कि पेंसिल किसकी है। चरण 2: सच दिखाने वाली ऐसी चीज़ सबूत है।'
    mistakes:
      अफ़वाह: c5h9_saboot
      कहानी: c5h9_saboot
  - prompt: '''निर्णय'' शब्द का अर्थ है:'
    options:
    - फ़ैसला
    - झगड़ा
    - सवाल
    answer: फ़ैसला
    difficulty: 1
    hints:
    - न्यायी सब सुनकर अंत में क्या सुनाता है?
    - यह शब्द 'तय करना' से जुड़ा है।
    solution: 'चरण 1: अंत में बात तय की जाती है। चरण 2: निर्णय = फ़ैसला।'
    mistakes:
      झगड़ा: c5h9_shabd
      सवाल: c5h9_shabd
  - prompt: केवल एक पक्ष की बात सुनकर फ़ैसला करने से क्या हो सकता है?
    options:
    - निर्दोष को सज़ा मिल सकती है
    - हमेशा सही फ़ैसला होगा
    - झगड़ा अपने-आप सुलझ जाएगा
    answer: निर्दोष को सज़ा मिल सकती है
    difficulty: 3
    hints:
    - दूसरे पक्ष के पास भी सच हो सकता है।
    - उसकी बात न सुनी जाए तो उसके साथ क्या होगा?
    solution: 'चरण 1: अधूरी बात से सच छिप सकता है। चरण 2: तब जिसकी गलती नहीं, उसे सज़ा मिल सकती है।'
    mistakes:
      हमेशा सही फ़ैसला होगा: c5h9_paksh
      झगड़ा अपने-आप सुलझ जाएगा: c5h9_paksh
  - prompt: '''दोषी'' का विलोम शब्द है:'
    options:
    - निर्दोष
    - दोस्त
    - दुखी
    answer: निर्दोष
    difficulty: 2
    hints:
    - विलोम = उलटा अर्थ।
    - आगे 'निर्' लगाकर देखो।
    solution: 'चरण 1: दोषी = जिसकी गलती है। चरण 2: उलटा = जिसकी गलती नहीं, यानी निर्दोष।'
    mistakes:
      दोस्त: c5h9_shabd
      दुखी: c5h9_shabd
  - prompt: '''सत्यमेव जयते'' कहाँ लिखा मिलता है?'
    options:
