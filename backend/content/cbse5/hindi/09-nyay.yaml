subject: cbse5-hin
chapter: 9
title: न्याय
tips:
  h5_sach_jeet: "वाक्य में 'सच्चाई' और 'जीत' दोनों हैं। जिसकी जीत हो रही है, वही उत्तर में होना चाहिए।"
  h5_satyamev: "शब्द तोड़ो: सत्यम् (सच) + एव (ही) + जयते (जीतता है)।"
  h5_taraaju: "न्याय में दोनों पक्षों को बराबर तौला जाता है। तौलने का यंत्र कौन-सा है?"

concepts:
- code: cbse5h.v9.nyay
  title: न्याय
  notes: |
    'न्याय' विषय पर एक और पाठ (संभवतः नाटक या कहानी), जिसमें किसी विवाद का सही और निष्पक्ष हल निकाला जाता है। ठीक
    पात्र और घटनाएँ यहाँ नहीं दी गई हैं। अभ्यास न्याय, सच-झूठ परखना, दोनों पक्षों को सुनना, और शब्द-अर्थ पर हैं।
  explanations:
    text: न्याय करने के लिए दोनों पक्षों की बात ध्यान से सुननी चाहिए, सबूत देखने चाहिए और फिर बिना भेदभाव के फ़ैसला करना चाहिए। सच्चाई की हमेशा जीत होती है।
    visual: 'चित्र बनाइए: एक तराज़ू जिसके दोनों पलड़े बराबर हैं: एक पर ''पहला पक्ष'', दूसरे पर ''दूसरा पक्ष''। बीच में ''न्याय''।'
    step_by_step: 1. विवाद क्या है? 2. पहले पक्ष की बात सुनें। 3. दूसरे पक्ष की बात सुनें। 4. सच्चाई परखें। 5. निष्पक्ष फ़ैसला करें।
    real_world: स्कूल में दो दोस्तों का झगड़ा सुलझाते समय शिक्षक दोनों की बात सुनते हैं, फिर फ़ैसला करते हैं।
  picture:
    kind: flow
    steps:
    - विवाद सामने आता है
    - पहले पक्ष की बात
    - दूसरे पक्ष की बात
    - सच्चाई परखकर फ़ैसला
    alt: 'न्याय के चरण: विवाद, पहले पक्ष की बात, दूसरे पक्ष की बात, और सच्चाई परखकर फ़ैसला।'
  activity:
    type: sort
    prompt: सही न्याय करने वाला क्या करता है?
    bins:
    - न्याय में ठीक
    - न्याय में गलत
    items:
    - label: दोनों पक्षों की बात सुनना
      bin: न्याय में ठीक
      clue: एक ही की बात सुनकर फ़ैसला ठीक होगा?
      why: निष्पक्षता के लिए दोनों को सुनना ज़रूरी।
    - label: सबूत देखकर सच परखना
      bin: न्याय में ठीक
      clue: सच-झूठ कैसे पता चले?
      why: सबूत से सच परखा जाता है।
    - label: दोस्त का पक्ष लेना
      bin: न्याय में गलत
      clue: क्या यह निष्पक्ष है?
      why: पक्षपात न्याय नहीं।
    - label: बिना सुने सज़ा देना
      bin: न्याय में गलत
      clue: बिना सुने सच पता चलेगा?
      why: बिना सुने फ़ैसला अन्याय है।
  items:
  - prompt: सही न्याय के लिए सबसे पहले क्या ज़रूरी है?
    options:
    - दोनों पक्षों की बात सुनना
    - एक पक्ष की बात सुनना
    - जल्दी फ़ैसला करना
    - गुस्सा करना
    answer: दोनों पक्षों की बात सुनना
    difficulty: 1
    hints:
    - तराज़ू के दो पलड़े।
    - दोनों तरफ़।
    solution: दोनों पक्षों को सुनना ज़रूरी है।
    mistakes:
      एक पक्ष की बात सुनना: hin5_lesson
  - prompt: न्याय का प्रतीक क्या माना जाता है?
    options:
    - तराज़ू
    - तलवार
    - कलम
    - घड़ी
    answer: तराज़ू
    difficulty: 2
    hints:
    - दोनों तरफ़ बराबर।
    - तौलने का साधन।
    solution: तराज़ू न्याय का प्रतीक है।
    mistakes: {"तलवार": "h5_taraaju", "कलम": "h5_taraaju", "घड़ी": "h5_taraaju"}
  - prompt: '''सच'' का विलोम शब्द है:'
    options:
    - झूठ
    - सही
    - अच्छा
    - पक्का
    answer: झूठ
    difficulty: 1
    hints:
    - उलटा अर्थ।
    - जो सच न हो।
    solution: सच का विलोम झूठ है।
    mistakes: {"सही": "h1_ulta", "अच्छा": "h1_ulta", "पक्का": "h1_ulta"}
  - prompt: '''विवाद'' का अर्थ है:'
    options:
    - झगड़ा, मतभेद
    - विवाह
    - खेल
    - गीत
    answer: झगड़ा, मतभेद
    difficulty: 2
    hints:
    - दो लोगों में असहमति।
    - बहस।
    solution: विवाद यानी झगड़ा या मतभेद।
    mistakes:
      विवाह: hin5_word
  - prompt: '''सच्चाई की हमेशा जीत होती है'' इसका अर्थ है:'
    options:
    - अंत में सच ही जीतता है
    - झूठ हमेशा जीतता है
    - कोई नहीं जीतता
    - जो ताक़तवर है वही जीतता है
    answer: अंत में सच ही जीतता है
    difficulty: 1
    hints:
    - सत्यमेव जयते।
    - सच।
    solution: इसका अर्थ है कि अंत में सच जीतता है।
    mistakes: {"झूठ हमेशा जीतता है": "h5_sach_jeet", "कोई नहीं जीतता": "h5_sach_jeet", "जो ताक़तवर है वही जीतता है": "h5_sach_jeet"}
  - prompt: 'भारत का राष्ट्रीय आदर्श वाक्य ''सत्यमेव जयते'' का अर्थ है:'
    options:
    - सत्य की ही जीत होती है
    - मेहनत ही पूजा है
    - सबका साथ
    - जय जवान
    answer: सत्य की ही जीत होती है
    difficulty: 2
    hints:
    - सत्य = सच।
    - जयते = जीतता है।
    solution: सत्यमेव जयते यानी सत्य की ही जीत होती है।
    mistakes: {"मेहनत ही पूजा है": "h5_satyamev", "सबका साथ": "h5_satyamev", "जय जवान": "h5_satyamev"}
