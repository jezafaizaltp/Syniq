subject: cbse5-hin
chapter: 12
title: गंगा की कहानी
concepts:
- code: cbse5h.v12.ganga
  title: गंगा की कहानी
  notes: |
    गंगा नदी अपनी कहानी बताती है: वह हिमालय में गोमुख (गंगोत्री हिमनद) से निकलती है, हरिद्वार में मैदान में उतरती है,
    प्रयागराज में यमुना (और मान्यता के अनुसार सरस्वती) से मिलती है जहाँ कुंभ मेला लगता है, वाराणसी के घाटों से होकर
    पटना और फिर कोलकाता की ओर बढ़ती है और अंत में गंगासागर में बंगाल की खाड़ी में मिल जाती है। कानपुर और पटना जैसे शहर
    इसके किनारे हैं। गंगा खेतों को पानी देती है; उसे साफ़ रखना हमारा कर्तव्य है।
  explanations:
    text: इस पाठ में गंगा अपनी यात्रा सुनाती है। वह हिमालय के गोमुख से निकलती है, हरिद्वार में मैदान में आती है, प्रयागराज में यमुना से मिलती है, वाराणसी के घाटों से गुज़रती है और गंगासागर में बंगाल की खाड़ी में मिल जाती है।
    visual: 'भारत का नक्शा बनाइए: ऊपर गोमुख से एक नीली रेखा हरिद्वार, प्रयागराज, वाराणसी, पटना होते हुए कोलकाता के पास गंगासागर तक जाती है।'
    step_by_step: 1. गंगा कहाँ से निकलती है? गोमुख। 2. मैदान में कहाँ आती है? हरिद्वार। 3. यमुना से कहाँ मिलती है? प्रयागराज। 4. कहाँ समाप्त होती है? गंगासागर, बंगाल की खाड़ी।
    real_world: प्रयागराज के कुंभ मेले में करोड़ों लोग गंगा-यमुना के संगम पर स्नान करने आते हैं।
  picture:
    kind: flow
    steps:
    - गोमुख (हिमालय)
    - हरिद्वार
    - प्रयागराज (संगम)
    - वाराणसी
    - पटना
    - गंगासागर (बंगाल की खाड़ी)
    alt: 'गंगा की यात्रा: हिमालय में गोमुख से हरिद्वार, प्रयागराज का संगम, वाराणसी, पटना और अंत में बंगाल की खाड़ी में गंगासागर।'
  items:
  - prompt: गंगा नदी कहाँ से निकलती है?
    options:
    - गोमुख (गंगोत्री हिमनद)
    - अरब सागर
    - थार मरुस्थल
    - पश्चिमी घाट
    answer: गोमुख (गंगोत्री हिमनद)
    difficulty: 1
    hints:
    - हिमालय में।
    - गाय के मुख जैसा आकार।
    solution: गंगा गोमुख से निकलती है।
    mistakes:
      अरब सागर: hin5_read_again
  - prompt: गंगा अंत में किसमें मिलती है?
    options:
    - बंगाल की खाड़ी
    - अरब सागर
    - हिंद महासागर का दक्षिणी छोर
    - एक झील
    answer: बंगाल की खाड़ी
    difficulty: 1
    hints:
    - गंगासागर।
    - पूर्व दिशा।
    solution: गंगा गंगासागर में बंगाल की खाड़ी में मिलती है।
  - prompt: प्रयागराज में गंगा किस नदी से मिलती है?
    options:
    - यमुना
    - कावेरी
    - नर्मदा
    - पेरियार
    answer: यमुना
    difficulty: 2
    hints:
    - संगम।
    - आगरा से होकर आती है।
    solution: प्रयागराज में गंगा-यमुना का संगम है।
  - prompt: कुंभ मेला किस शहर में गंगा-यमुना के संगम पर लगता है?
    options:
    - प्रयागराज
    - कोच्चि
    - शिमला
    - जयपुर
    answer: प्रयागराज
    difficulty: 2
    hints:
    - संगम पर।
    - उत्तर प्रदेश।
    solution: प्रयागराज में गंगा-यमुना के संगम पर कुंभ मेला लगता है।
  - prompt: वाराणसी किसके लिए प्रसिद्ध है?
    options:
    - गंगा के घाटों के लिए
    - रेगिस्तान के लिए
    - बर्फ़ के पहाड़ों के लिए
    - समुद्र तट के लिए
    answer: गंगा के घाटों के लिए
    difficulty: 1
    hints:
    - सीढ़ियाँ जो नदी तक जाती हैं।
    - आरती।
    solution: वाराणसी गंगा के घाटों के लिए प्रसिद्ध है।
  - prompt: गंगा को साफ़ रखने के लिए हमें क्या करना चाहिए?
    options:
    - उसमें कचरा नहीं डालना चाहिए
    - प्लास्टिक फेंकना चाहिए
    - कारखानों का गंदा पानी डालना चाहिए
    - कुछ नहीं
    answer: उसमें कचरा नहीं डालना चाहिए
    difficulty: 1
    hints:
    - गंदगी से नदी बीमार होती है।
    - साफ़ नदी।
    solution: नदी में कचरा न डालें।
    mistakes:
      प्लास्टिक फेंकना चाहिए: hin5_lesson
