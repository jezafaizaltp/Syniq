subject: cbse5-hin
chapter: 12
title: गंगा की कहानी
tips:
  h5_ganga_ant: "गंगा पूरब की ओर बहती है और पश्चिम बंगाल से होकर समुद्र में मिलती है। अरब सागर तो पश्चिम में है।"
  h5_kumbh: "पिछले प्रश्न का संगम याद करो। उस शहर का पुराना नाम इलाहाबाद था।"
  h5_sangam: "कावेरी, नर्मदा, पेरियार दक्षिण या मध्य भारत की नदियाँ हैं। दिल्ली और आगरा से बहकर आने वाली नदी कौन-सी?"
  h5_varanasi: "वाराणसी गंगा के किनारे बसा है। लोग वहाँ नदी तक सीढ़ियों से उतरकर स्नान और आरती करते हैं।"
  c5h12_raasta: 'गंगा की यात्रा ऊपर पहाड़ से नीचे समुद्र तक सोचो: पहले कौन-सा शहर आता है, फिर कौन-सा?'
  c5h12_saaf: 'सोचो: नदी का पानी कौन-कौन पीता और इस्तेमाल करता है? गंदा होने पर किसे नुकसान होगा?'
  c5h12_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse5h.v12.ganga
  title: गंगा की कहानी
  notes: |
    गंगा नदी अपनी कहानी बताती है: वह हिमालय में गोमुख (गंगोत्री हिमनद) से निकलती है, हरिद्वार में मैदान में उतरती है,
    प्रयागराज में यमुना (और मान्यता के अनुसार सरस्वती) से मिलती है जहाँ कुंभ मेला लगता है, वाराणसी के घाटों से होकर
    पटना और फिर कोलकाता की ओर बढ़ती है और अंत में गंगासागर में बंगाल की खाड़ी में मिल जाती है। कानपुर और पटना जैसे शहर
    इसके किनारे हैं। गंगा खेतों को पानी देती है; उसे साफ़ रखना हमारा कर्तव्य है।
  explanations:
    text: इस पाठ में गंगा अपनी यात्रा सुनाती है। वह हिमालय के गोमुख से निकलती है, हरिद्वार में मैदान में आती है, प्रयागराज में यमुना से मिलती है, वाराणसी के घाटों से गुज़रती है और गंगासागर में बंगाल की खाड़ी में मिल जाती है।
    visual: 'भारत का नक्शा बनाइए: ऊपर गोमुख से एक नीली रेखा हरिद्वार, प्रयागराज, वाराणसी, पटना होते हुए कोलकाता के पास गंगासागर तक जाती है।'
    step_by_step: 1. गंगा कहाँ से निकलती है? गोमुख। 2. मैदान में कहाँ आती है? हरिद्वार। 3. यमुना से कहाँ मिलती है? प्रयागराज। 4. कहाँ समाप्त होती है? गंगासागर, बंगाल की खाड़ी।
    real_world: प्रयागराज के कुंभ मेले में करोड़ों लोग गंगा-यमुना के संगम पर स्नान करने आते हैं।
  picture:
    kind: flow
    steps:
    - गोमुख (हिमालय)
    - हरिद्वार
    - प्रयागराज (संगम)
    - वाराणसी
    - पटना
    - गंगासागर (बंगाल की खाड़ी)
    alt: 'गंगा की यात्रा: हिमालय में गोमुख से हरिद्वार, प्रयागराज का संगम, वाराणसी, पटना और अंत में बंगाल की खाड़ी में गंगासागर।'
  activity:
    type: order
    prompt: गंगा की यात्रा क्रम से लगाओ।
    steps:
    - गोमुख (गंगोत्री हिमनद)
    - हरिद्वार
    - प्रयागराज
    - वाराणसी
    - पटना
    - गंगासागर
    reasons:
      हरिद्वार: गंगा हिमालय से निकलकर हरिद्वार में मैदान में उतरती है।
      प्रयागराज: हरिद्वार से आगे बहकर यमुना से प्रयागराज में मिलती है।
      वाराणसी: प्रयागराज के बाद वाराणसी के घाट आते हैं।
      पटना: वाराणसी से आगे पूर्व की ओर पटना।
      गंगासागर: अंत में बंगाल की खाड़ी में मिलती है।
  lesson:
    - teach: इस पाठ में गंगा नदी खुद अपनी कहानी सुनाती है। वह हिमालय में गोमुख से निकलती है, जो गंगोत्री हिमनद (बर्फ़ की नदी) का सिरा है। फिर हरिद्वार में पहाड़ छोड़कर मैदान में उतरती है।
      check:
        prompt: गंगा मैदान में किस शहर में उतरती है?
        options:
        - हरिद्वार
        - कोलकाता
        - पटना
        answer: हरिद्वार
        why: हरिद्वार पहाड़ों के ठीक नीचे है।
      ways:
      - style: visual
        teach: 'गंगा कहाँ से शुरू होती है: बर्फ़ से पहाड़ तक का पहला हिस्सा।'
        picture:
          kind: flow
          steps:
          - हिमालय में गंगोत्री हिमनद
          - 'उसका सिरा: गोमुख'
          - बर्फ़ पिघलकर पानी बनती है
          - पहाड़ों में तेज़ धारा बहती है
          - फिर मैदान में उतरती है
          alt: गंगा हिमालय में गंगोत्री हिमनद के सिरे गोमुख से निकलती है। बर्फ़ पिघलकर पानी बनती है, पहाड़ों में तेज़ धारा बहती है, और फिर नदी मैदान में उतरती है।
      - style: step_by_step
        teach: 'पाठ को ''मैं'' शैली में पढ़ो। पहला: देखो, कहानी कौन सुना रहा है? गंगा खुद। दूसरा: ''मैं निकलती हूँ'', ''मैं बहती हूँ'' जैसे वाक्य ढूँढो। तीसरा: अब कल्पना करो कि तुम नदी हो। चौथा: अपनी एक दिन की यात्रा ''मैं'' से बोलो।'
    - teach: प्रयागराज में गंगा यमुना से मिलती है। दो नदियों के मिलने की जगह को संगम कहते हैं, और यहाँ कुंभ मेला लगता है। फिर गंगा वाराणसी, पटना से होकर बंगाल की ओर बढ़ती है और गंगासागर में बंगाल की खाड़ी में मिल जाती है।
      picture:
        kind: flow
        steps:
        - गोमुख (हिमालय)
        - हरिद्वार
        - प्रयागराज (संगम)
        - वाराणसी
        - पटना
        - गंगासागर (बंगाल की खाड़ी)
        alt: गंगा का रास्ता गोमुख से गंगासागर तक।
      check:
        prompt: दो नदियों के मिलने की जगह को क्या कहते हैं?
        options:
        - संगम
        - घाट
        - हिमनद
        answer: संगम
        why: प्रयागराज में गंगा-यमुना का संगम है।
      ways:
      - style: visual
        teach: 'संगम का अर्थ: दो नदियाँ एक जगह आकर मिल जाती हैं।'
        picture:
          kind: flow
          steps:
          - गंगा एक ओर से आती है
          - यमुना दूसरी ओर से आती है
          - प्रयागराज में दोनों मिलती हैं
          - इस मिलने की जगह को संगम कहते हैं
          - आगे दोनों का पानी एक साथ बहता है
          alt: गंगा एक ओर से और यमुना दूसरी ओर से आती है। प्रयागराज में दोनों मिलती हैं। इस मिलने की जगह को संगम कहते हैं, और आगे दोनों का पानी एक साथ बहता है।
      - style: real_world
        teach: कुंभ मेले में करोड़ों लोग संगम पर स्नान करने आते हैं। इतनी भीड़ के लिए वहाँ अस्थायी पुल, टेंट, अस्पताल और सड़कें बनाई जाती हैं, जैसे कुछ दिनों के लिए एक पूरा शहर।
    - teach: 'गंगा खेतों को पानी देती है और करोड़ों लोग इसके किनारे रहते हैं। कारख़ानों का गंदा पानी और कचरा इसे गंदा करते हैं। गंगा कहती है: मुझे साफ़ रखना तुम्हारा कर्तव्य है।'
      check:
        prompt: गंगा को गंदा कौन-सी चीज़ करती है?
        options:
        - कचरा और कारख़ानों का गंदा पानी
        - बारिश का साफ़ पानी
        - मछलियाँ
        answer: कचरा और कारख़ानों का गंदा पानी
        why: यही चीज़ें नदी में ज़हर घोलती हैं।
      ways:
      - style: visual
        teach: गंगा हमें क्या देती है, और कौन-सी चीज़ें उसे गंदा करती हैं।
        picture:
          kind: compare
          columns:
          - title: गंगा देती है
            points:
            - खेतों के लिए पानी
            - पीने और नहाने का पानी
            - मछलियाँ और जीव-जंतु
          - title: गंगा को गंदा करते हैं
            points:
            - कारख़ानों का गंदा पानी
            - प्लास्टिक और कचरा
            - नालों का पानी
          alt: गंगा खेतों के लिए पानी, पीने और नहाने का पानी, और मछलियाँ व जीव-जंतु देती है। कारख़ानों का गंदा पानी, प्लास्टिक, कचरा और नालों का पानी उसे गंदा करते हैं।
      - style: real_world
        teach: गंगा में एक ख़ास डॉल्फ़िन रहती है, जो लगभग देख नहीं पाती और आवाज़ से रास्ता ढूँढती है। नदी जितनी साफ़ होगी, यह डॉल्फ़िन उतनी ज़्यादा बचेगी।
  items:
