subject: cbse5-hin
chapter: 11
title: हमारे ये कलामंदिर
tips:
  h5_ajanta: "पाठ का नाम 'कलामंदिर' है। अजंता की गुफाओं की दीवारों पर सदियों पुरानी कौन-सी कला है?"
  h5_ellora: "एलोरा में 34 गुफाएँ हैं, अलग-अलग समय में बनीं। 'केवल' वाले उत्तर ध्यान से जाँचो: वहाँ कैलाश मंदिर भी है।"
  h5_kailash: "कैलाश मंदिर को जोड़ा नहीं गया; कारीगर ऊपर से नीचे तक पहाड़ खोदते गए।"

concepts:
- code: cbse5h.v11.kalamandir
  title: हमारे ये कलामंदिर
  notes: |
    भारत की प्राचीन कला-धरोहर पर पाठ, जिसमें अजंता और एलोरा की गुफाओं (महाराष्ट्र, औरंगाबाद/छत्रपति संभाजीनगर के पास)
    जैसी जगहों का वर्णन है। अजंता में बौद्ध धर्म से जुड़ी सुंदर दीवार-चित्रकारी (भित्ति-चित्र) है; एलोरा में चट्टान काटकर
    बने मंदिर हैं, जिनमें कैलाश मंदिर एक ही चट्टान से बना है, और बौद्ध, हिंदू व जैन गुफाएँ साथ-साथ हैं। ये यूनेस्को विश्व
    धरोहर हैं। संदेश: अपनी धरोहर की रक्षा करें, दीवारों पर न लिखें।
  explanations:
    text: '''कलामंदिर'' यानी कला के मंदिर। महाराष्ट्र की अजंता गुफाओं में हज़ारों साल पुराने सुंदर चित्र हैं। एलोरा में पूरी चट्टान काटकर मंदिर बनाए गए हैं, जैसे कैलाश मंदिर। ये हमारी धरोहर हैं, इनकी रक्षा करना हमारा कर्तव्य है।'
    visual: 'चित्र बनाइए: पहाड़ी चट्टान में कटी गुफाओं की पंक्ति, एक गुफा के अंदर दीवार पर रंगीन चित्र, और एक बड़ा नक्काशीदार मंदिर।'
    step_by_step: '1. जगह: अजंता और एलोरा, महाराष्ट्र। 2. अजंता की विशेषता: दीवार-चित्र। 3. एलोरा की विशेषता: चट्टान काटकर बने मंदिर। 4. हमारा कर्तव्य: धरोहर बचाना।'
    real_world: विद्यालय की यात्राओं में बच्चे ऐसी धरोहर देखकर इतिहास को अपनी आँखों से समझते हैं।
  picture:
    kind: compare
    columns:
    - title: अजंता
      points:
      - दीवार-चित्र (भित्ति-चित्र)
      - बौद्ध कथाएँ
    - title: एलोरा
      points:
      - चट्टान काटकर बने मंदिर
      - कैलाश मंदिर
      - बौद्ध, हिंदू, जैन गुफाएँ
    alt: अजंता दीवार-चित्रों और बौद्ध कथाओं के लिए, और एलोरा चट्टान काटकर बने मंदिरों, कैलाश मंदिर और बौद्ध, हिंदू व जैन गुफाओं के लिए प्रसिद्ध है।
  items:
  - prompt: अजंता और एलोरा की गुफाएँ किस राज्य में हैं?
    options:
    - महाराष्ट्र
    - केरल
    - असम
    - बिहार
    answer: महाराष्ट्र
    difficulty: 1
    hints:
    - मुंबई इसी राज्य में है।
    - पश्चिम भारत।
    solution: ये गुफाएँ महाराष्ट्र में हैं।
    mistakes:
      केरल: hin5_read_again
  - prompt: अजंता की गुफाएँ किसके लिए प्रसिद्ध हैं?
    options:
    - सुंदर दीवार-चित्रों के लिए
    - झरनों के लिए
    - बर्फ़ के लिए
    - समुद्र तट के लिए
    answer: सुंदर दीवार-चित्रों के लिए
    difficulty: 1
    hints:
    - दीवारों पर रंग।
    - चित्रकारी।
    solution: अजंता अपने भित्ति-चित्रों के लिए प्रसिद्ध है।
    mistakes: {"झरनों के लिए": "h5_ajanta", "बर्फ़ के लिए": "h5_ajanta", "समुद्र तट के लिए": "h5_ajanta"}
  - prompt: एलोरा का कैलाश मंदिर किस तरह बना है?
    options:
    - एक ही चट्टान को काटकर
    - ईंटों से
    - लकड़ी से
    - कांच से
    answer: एक ही चट्टान को काटकर
    difficulty: 2
    hints:
    - पहाड़ को ऊपर से काटा गया।
    - पत्थर।
    solution: कैलाश मंदिर एक ही चट्टान काटकर बना है।
    mistakes: {"ईंटों से": "h5_kailash", "लकड़ी से": "h5_kailash", "कांच से": "h5_kailash"}
  - prompt: '''कलामंदिर'' का अर्थ है:'
    options:
    - कला का मंदिर
    - खेल का मैदान
    - बाज़ार
    - स्कूल की कक्षा
    answer: कला का मंदिर
    difficulty: 1
    hints:
    - कला + मंदिर।
    - सुंदर कलाकृति वाली जगह।
    solution: कलामंदिर यानी कला का मंदिर।
    mistakes:
      बाज़ार: hin5_word
  - prompt: धरोहर की जगह पर हमें क्या नहीं करना चाहिए?
    options:
    - दीवारों पर नाम लिखना
    - तस्वीरें लेना
    - गाइड की बात सुनना
    - जानकारी पढ़ना
    answer: दीवारों पर नाम लिखना
    difficulty: 1
    hints:
    - इससे नुक़सान होता है।
    - खरोंचना।
    solution: दीवारों पर लिखना धरोहर को नुक़सान पहुँचाता है।
    mistakes:
      गाइड की बात सुनना: hin5_lesson
  - prompt: एलोरा की गुफाएँ किन धर्मों से जुड़ी हैं?
    options:
    - बौद्ध, हिंदू और जैन
    - केवल बौद्ध
    - केवल जैन
    - किसी धर्म से नहीं
    answer: बौद्ध, हिंदू और जैन
    difficulty: 2
    hints:
    - तीन धर्म साथ-साथ।
    - सद्भाव।
    solution: एलोरा में बौद्ध, हिंदू और जैन गुफाएँ हैं।
    mistakes: {"केवल बौद्ध": "h5_ellora", "केवल जैन": "h5_ellora", "किसी धर्म से नहीं": "h5_ellora"}
