subject: cbse5-hin
chapter: 11
title: हमारे ये कलामंदिर
tips:
  h5_ajanta: "पाठ का नाम 'कलामंदिर' है। अजंता की गुफाओं की दीवारों पर सदियों पुरानी कौन-सी कला है?"
  h5_ellora: "एलोरा में 34 गुफाएँ हैं, अलग-अलग समय में बनीं। 'केवल' वाले उत्तर ध्यान से जाँचो: वहाँ कैलाश मंदिर भी है।"
  h5_kailash: "कैलाश मंदिर को जोड़ा नहीं गया; कारीगर ऊपर से नीचे तक पहाड़ खोदते गए।"
  c5h11_gufa: 'दोनों जगहों को अलग करो: एक दीवार-चित्रों के लिए, दूसरी चट्टान काटकर बने मंदिरों के लिए।'
  c5h11_dharohar: 'सोचो: पुरानी कला हज़ारों साल बची रही। अब उसे बचाए रखना किसकी ज़िम्मेदारी है?'
  c5h11_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse5h.v11.kalamandir
  title: हमारे ये कलामंदिर
  notes: |
    भारत की प्राचीन कला-धरोहर पर पाठ, जिसमें अजंता और एलोरा की गुफाओं (महाराष्ट्र, औरंगाबाद/छत्रपति संभाजीनगर के पास)
    जैसी जगहों का वर्णन है। अजंता में बौद्ध धर्म से जुड़ी सुंदर दीवार-चित्रकारी (भित्ति-चित्र) है; एलोरा में चट्टान काटकर
    बने मंदिर हैं, जिनमें कैलाश मंदिर एक ही चट्टान से बना है, और बौद्ध, हिंदू व जैन गुफाएँ साथ-साथ हैं। ये यूनेस्को विश्व
    धरोहर हैं। संदेश: अपनी धरोहर की रक्षा करें, दीवारों पर न लिखें।
  explanations:
    text: '''कलामंदिर'' यानी कला के मंदिर। महाराष्ट्र की अजंता गुफाओं में हज़ारों साल पुराने सुंदर चित्र हैं। एलोरा में पूरी चट्टान काटकर मंदिर बनाए गए हैं, जैसे कैलाश मंदिर। ये हमारी धरोहर हैं, इनकी रक्षा करना हमारा कर्तव्य है।'
    visual: 'चित्र बनाइए: पहाड़ी चट्टान में कटी गुफाओं की पंक्ति, एक गुफा के अंदर दीवार पर रंगीन चित्र, और एक बड़ा नक्काशीदार मंदिर।'
    step_by_step: '1. जगह: अजंता और एलोरा, महाराष्ट्र। 2. अजंता की विशेषता: दीवार-चित्र। 3. एलोरा की विशेषता: चट्टान काटकर बने मंदिर। 4. हमारा कर्तव्य: धरोहर बचाना।'
    real_world: विद्यालय की यात्राओं में बच्चे ऐसी धरोहर देखकर इतिहास को अपनी आँखों से समझते हैं।
  picture:
    kind: compare
    columns:
    - title: अजंता
      points:
      - दीवार-चित्र (भित्ति-चित्र)
      - बौद्ध कथाएँ
    - title: एलोरा
      points:
      - चट्टान काटकर बने मंदिर
      - कैलाश मंदिर
      - बौद्ध, हिंदू, जैन गुफाएँ
    alt: अजंता दीवार-चित्रों और बौद्ध कथाओं के लिए, और एलोरा चट्टान काटकर बने मंदिरों, कैलाश मंदिर और बौद्ध, हिंदू व जैन गुफाओं के लिए प्रसिद्ध है।
  activity:
    type: sort
    prompt: यह बात अजंता की है या एलोरा की?
    bins:
    - अजंता
    - एलोरा
    items:
    - label: बौद्ध दीवार-चित्रकारी
      bin: अजंता
      clue: भित्ति-चित्रों के लिए कौन-सी गुफाएँ प्रसिद्ध हैं?
      why: अजंता के भित्ति-चित्र।
    - label: एक ही चट्टान से बना कैलाश मंदिर
      bin: एलोरा
      clue: चट्टान काटकर बने मंदिर कहाँ?
      why: कैलाश मंदिर एलोरा में।
    - label: बौद्ध, हिंदू और जैन गुफाएँ साथ-साथ
      bin: एलोरा
      clue: तीनों धर्मों की गुफाएँ एक जगह कहाँ?
      why: एलोरा में तीनों।
    - label: चित्रों से भरी दीवारें
      bin: अजंता
      clue: चित्रकारी या मूर्ति-कला?
      why: अजंता चित्रों के लिए प्रसिद्ध।
  lesson:
    - teach: यह पाठ भारत की पुरानी कला-धरोहर के बारे में है। धरोहर का अर्थ है वह कीमती चीज़ जो पुरखों से हमें मिली। अजंता और एलोरा की गुफाएँ महाराष्ट्र में हैं।
      check:
        prompt: '''धरोहर'' किसे कहते हैं?'
        options:
        - पुरखों से मिली कीमती चीज़
        - नई ख़रीदी चीज़
        - कचरा
        answer: पुरखों से मिली कीमती चीज़
        why: धरोहर पीढ़ी-दर-पीढ़ी हमें मिलती है।
    - teach: अजंता की गुफाएँ बौद्ध धर्म से जुड़े सुंदर दीवार-चित्रों (भित्ति-चित्रों) के लिए प्रसिद्ध हैं। एलोरा में चट्टान काटकर मंदिर बनाए गए। वहाँ का कैलाश मंदिर एक ही चट्टान से बना है।
      picture:
        kind: compare
        columns:
        - title: अजंता
          points:
          - गुफाओं की दीवारों पर चित्र
          - बौद्ध धर्म से जुड़ी
        - title: एलोरा
          points:
          - चट्टान काटकर बने मंदिर
          - एक चट्टान से कैलाश मंदिर
          - बौद्ध, हिंदू, जैन गुफाएँ
        alt: अजंता और एलोरा की तुलना।
      check:
        prompt: अजंता किस कला के लिए सबसे प्रसिद्ध है?
        options:
        - दीवार-चित्र
        - लोहे की मूर्तियाँ
        - काँच के महल
        answer: दीवार-चित्र
        why: अजंता की गुफाओं की दीवारों पर सुंदर चित्र बने हैं।
    - teach: 'एलोरा में बौद्ध, हिंदू और जैन गुफाएँ साथ-साथ हैं: अलग-अलग धर्मों की कला एक जगह। दोनों जगहें यूनेस्को विश्व धरोहर हैं। हमें वहाँ दीवारों पर नाम नहीं लिखने चाहिए और कुछ नहीं तोड़ना चाहिए।'
      check:
        prompt: एलोरा में अलग-अलग धर्मों की गुफाएँ साथ-साथ होना क्या दिखाता है?
        options:
        - मेल-जोल और साथ रहना
        - लड़ाई
        - अकेलापन
        answer: मेल-जोल और साथ रहना
        why: तीन धर्मों की कला एक जगह शांति से बनी।
  items:
  - prompt: अजंता और एलोरा की गुफाएँ किस राज्य में हैं?
    options:
    - महाराष्ट्र
    - केरल
    - असम
    - बिहार
    answer: महाराष्ट्र
    difficulty: 1
    hints:
    - मुंबई इसी राज्य में है।
    - पश्चिम भारत।
    solution: ये गुफाएँ महाराष्ट्र में हैं।
    mistakes:
      केरल: hin5_read_again
  - prompt: अजंता की गुफाएँ किसके लिए प्रसिद्ध हैं?
    options:
    - सुंदर दीवार-चित्रों के लिए
    - झरनों के लिए
    - बर्फ़ के लिए
    - समुद्र तट के लिए
    answer: सुंदर दीवार-चित्रों के लिए
    difficulty: 1
    hints:
    - दीवारों पर रंग।
    - चित्रकारी।
    solution: अजंता अपने भित्ति-चित्रों के लिए प्रसिद्ध है।
    mistakes: {"झरनों के लिए": "h5_ajanta", "बर्फ़ के लिए": "h5_ajanta", "समुद्र तट के लिए": "h5_ajanta"}
  - prompt: एलोरा का कैलाश मंदिर किस तरह बना है?
    options:
    - एक ही चट्टान को काटकर
    - ईंटों से
    - लकड़ी से
    - कांच से
    answer: एक ही चट्टान को काटकर
    difficulty: 2
    hints:
    - पहाड़ को ऊपर से काटा गया।
    - पत्थर।
    solution: कैलाश मंदिर एक ही चट्टान काटकर बना है।
    mistakes: {"ईंटों से": "h5_kailash", "लकड़ी से": "h5_kailash", "कांच से": "h5_kailash"}
  - prompt: '''कलामंदिर'' का अर्थ है:'
    options:
    - कला का मंदिर
    - खेल का मैदान
    - बाज़ार
    - स्कूल की कक्षा
    answer: कला का मंदिर
    difficulty: 1
    hints:
    - कला + मंदिर।
    - सुंदर कलाकृति वाली जगह।
    solution: कलामंदिर यानी कला का मंदिर।
    mistakes:
      बाज़ार: hin5_word
  - prompt: धरोहर की जगह पर हमें क्या नहीं करना चाहिए?
    options:
    - दीवारों पर नाम लिखना
    - तस्वीरें लेना
    - गाइड की बात सुनना
    - जानकारी पढ़ना
    answer: दीवारों पर नाम लिखना
    difficulty: 1
    hints:
    - इससे नुक़सान होता है।
    - खरोंचना।
    solution: दीवारों पर लिखना धरोहर को नुक़सान पहुँचाता है।
    mistakes:
