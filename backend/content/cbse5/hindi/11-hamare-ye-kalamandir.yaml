  - prompt: एलोरा की गुफाएँ किन धर्मों से जुड़ी हैं?
    options:
    - बौद्ध, हिंदू और जैन
    - केवल बौद्ध
    - केवल जैन
    - किसी धर्म से नहीं
    answer: बौद्ध, हिंदू और जैन
    difficulty: 2
    hints:
    - तीन धर्म साथ-साथ।
    - सद्भाव।
    solution: एलोरा में बौद्ध, हिंदू और जैन गुफाएँ हैं।
    mistakes: {"केवल बौद्ध": "h5_ellora", "केवल जैन": "h5_ellora", "किसी धर्म से नहीं": "h5_ellora"}
  - prompt: '''भित्ति-चित्र'' का अर्थ है:'
    options:
    - दीवार पर बना चित्र
    - कागज़ पर बना नक्शा
    - कपड़े पर कढ़ाई
    answer: दीवार पर बना चित्र
    difficulty: 2
    hints:
    - '''भित्ति'' का अर्थ है दीवार।'
    - अजंता की गुफाओं में चित्र कहाँ बने हैं?
    solution: 'चरण 1: भित्ति = दीवार। चरण 2: भित्ति-चित्र = दीवार पर बना चित्र।'
    mistakes:
      कागज़ पर बना नक्शा: c5h11_shabd
      कपड़े पर कढ़ाई: c5h11_shabd
  - prompt: कैलाश मंदिर किस जगह है?
    options:
    - एलोरा
    - अजंता
    - काजीरंगा
    answer: एलोरा
    difficulty: 1
    hints:
    - यह मंदिर चट्टान काटकर बना है।
    - चट्टान काटकर बने मंदिर किस जगह के लिए प्रसिद्ध हैं?
    solution: 'चरण 1: चट्टान काटकर बने मंदिर एलोरा में हैं। चरण 2: कैलाश मंदिर एलोरा में है।'
    mistakes:
      अजंता: c5h11_gufa
      काजीरंगा: c5h11_gufa
  - prompt: चट्टान काटकर मंदिर बनाना क्यों अद्भुत है?
    options:
    - गलती होने पर पत्थर वापस नहीं जुड़ता
    - चट्टान बहुत नरम होती है
    - यह एक दिन में बन जाता है
    answer: गलती होने पर पत्थर वापस नहीं जुड़ता
    difficulty: 3
    hints:
    - ईंट से बनाते समय गलत ईंट हटा सकते हैं।
    - काटा हुआ पत्थर फिर से लग सकता है क्या?
    solution: 'चरण 1: चट्टान में ऊपर से नीचे काटते जाते हैं। चरण 2: एक गलती ठीक नहीं हो सकती, इसलिए यह बहुत कठिन और अद्भुत है।'
    mistakes:
      चट्टान बहुत नरम होती है: c5h11_gufa
      यह एक दिन में बन जाता है: c5h11_gufa
  - prompt: '''गुफा'' किसे कहते हैं?'
    options:
    - पहाड़ या चट्टान के अंदर की खोखली जगह
    - नदी का किनारा
    - ऊँचा पेड़
    answer: पहाड़ या चट्टान के अंदर की खोखली जगह
    difficulty: 1
    hints:
    - अजंता-एलोरा पहाड़ियों में हैं।
    - अंदर जाकर देखने वाली जगह।
    solution: 'चरण 1: गुफा पहाड़ के अंदर होती है। चरण 2: यह चट्टान के अंदर की खोखली जगह है।'
    mistakes:
      नदी का किनारा: c5h11_shabd
      ऊँचा पेड़: c5h11_shabd
  - prompt: धरोहर की जगह पर घूमते समय सही काम कौन-सा है?
    options:
    - गाइड की बात सुनना और चीज़ें न छूना
    - मूर्ति पर चढ़कर फ़ोटो खींचना
    - दीवार पर तारीख़ लिखना
    answer: गाइड की बात सुनना और चीज़ें न छूना
    difficulty: 2
    hints:
    - पुरानी चीज़ें छूने से धीरे-धीरे घिसती हैं।
    - धरोहर आने वाले बच्चों के लिए भी बचानी है।
    solution: 'चरण 1: छूने-चढ़ने से धरोहर ख़राब होती है। चरण 2: गाइड की बात सुनना और चीज़ें न छूना सही है।'
    mistakes:
      मूर्ति पर चढ़कर फ़ोटो खींचना: c5h11_dharohar
      दीवार पर तारीख़ लिखना: c5h11_dharohar
  - prompt: '''प्राचीन'' शब्द का विलोम है:'
    options:
    - नवीन
    - पुराना
    - प्रसिद्ध
    answer: नवीन
    difficulty: 2
    hints:
    - प्राचीन = बहुत पुराना।
    - नया का दूसरा शब्द सोचो।
    solution: 'चरण 1: प्राचीन = पुराना। चरण 2: उसका उलटा नवीन (नया)।'
    mistakes:
      पुराना: c5h11_shabd
      प्रसिद्ध: c5h11_shabd
  - prompt: अजंता की गुफाएँ किस धर्म से सबसे ज़्यादा जुड़ी हैं?
    options:
    - बौद्ध
    - सिख
    - ईसाई
    answer: बौद्ध
    difficulty: 2
