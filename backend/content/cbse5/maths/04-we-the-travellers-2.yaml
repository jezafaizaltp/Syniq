# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 4
title: We the Travellers-II
tips:
  c5_times_table: Multiply each digit by the number, starting from the ones, and carry when you pass 9.
  c5_share: 'Dividing is sharing equally: ask how many in each group, or how many groups.'
  m5_divide_check: "Check your division by multiplying back: answer × divisor should give the number you started with."
  m5_remainder: "Find the biggest multiple of the divisor that fits, then take it away from the number. What is left is the remainder."
  m5_times_100: "Multiplying by 100 adds two zeros at the end."
  m5_times_carry: "Multiply each place, then add the carries. Check the size: is your answer about right?"
  c5m4_split: Split the bigger number into tens and ones, multiply each part, then add the parts.
  c5m4_zeros: Multiplying by 10 puts one zero at the end; by 100 puts two zeros.
  c5m4_which: 'Decide first: is the story about equal groups put together (multiply) or a total shared out (divide)?'
  c5m4_long: 'Divide one place at a time from the left: divide, multiply, subtract, bring down the next digit.'
  c5m4_left: The remainder is what is left after the equal groups. It must be smaller than the number you divide by.
  c5m4_roundup: 'If some are left over in a story, ask: do those leftovers still need a place of their own?'
concepts:
- code: cbse5m.trav2.mult
  title: Multiplying for trips
  notes: |
    Multiply bigger numbers: 3-digit by 1-digit (245 × 4 = 980) and 2-digit by 2-digit (36 × 24 = 864: 36 × 20 = 720,
    36 × 4 = 144, add). Multiplying by 10 adds a zero; by 100 adds two zeros. Use it for repeated amounts: a bus ticket
    costs ₹45 for each of 12 people = 45 × 12 = ₹540.
  explanations:
    text: 'Multiplication is quick adding of equal groups. If 12 people each pay ₹45, add 45 twelve times, or multiply 45 × 12. Split the 12 into 10 and 2: 45 × 10 = 450 and 45 × 2 = 90, so 540.'
    visual: 'Draw a box split into two parts: 45 × 10 and 45 × 2. Write 450 and 90 inside. Add them: 540.'
    step_by_step: 'Step 1: Split one number into tens and ones. Step 2: Multiply each part. Step 3: Add the answers.'
    real_world: Working out the total fare for a family, or how far a car goes in several hours at the same speed.
  picture:
    kind: flow
    steps:
    - 45 × 12
    - = 45 × 10 + 45 × 2
    - = 450 + 90
    - = 540
    alt: 45 times 12 is split into 45 times 10 plus 45 times 2, which is 450 plus 90, so 540.
  activity:
    type: formula
    prompt: Tickets for a trip. Set the price of one ticket and how many people go.
    inputs:
    - name: a
      label: Price of one ticket
      min: 1
      max: 100
      step: 1
      start: 1
      unit: ₹
    - name: n
      label: People
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: cost
      label: Total cost
      expr: a*n
      unit: ₹
    goals:
    - prompt: Tickets cost ₹45. The total is ₹540. How many people?
      want:
        a: 45
        cost: 540
      mistakes:
      - when:
          a: 45
          n: 10
        say: '10 tickets cost 450. You need 90 more: that''s 2 more tickets.'
      - when:
          a: 45
          n:
          - 13
          - 30
        say: 'Too many: that costs more than 540.'
    - prompt: 15 children paid ₹600 in all. What did one ticket cost?
      want:
        n: 15
        cost: 600
      mistakes:
      - when:
          n: 15
          a: 45
        say: '15 × 45 = 675: too much. Try a smaller price.'
      - when:
          n: 15
          a:
          - 41
          - 100
        say: 'Too much: 15 × 41 is already more than 600.'
    - prompt: Tickets cost ₹25. The total is ₹750.
      want:
        a: 25
        cost: 750
      mistakes:
      - when:
          a: 25
          n:
          - 20
          - 29
        say: Not enough people yet. 25 × 30 = 750.
  lesson:
    - teach: Multiplying is adding equal groups quickly. 12 tickets at ₹45 each is 45 + 45 + ... twelve times, which is 45 × 12.
      check:
        prompt: 6 buses each carry 40 people. Which sum gives the total?
        options:
        - 40 × 6
        - 40 + 6
        - 40 − 6
        answer: 40 × 6
        why: 6 equal groups of 40.
      ways:
      - style: visual
        teach: Equal groups added again and again, and the same thing as one multiplication.
        picture:
          kind: compare
          columns:
          - title: Adding equal groups
            points:
            - ₹30 + ₹30 + ₹30 + ₹30 + ₹30
            - Five groups of ₹30
          - title: Multiplying
            points:
            - ₹30 × 5
            - = ₹150
          alt: Adding ₹30 five times is the same as five groups of ₹30, which is ₹30 times 5, equal to ₹150.
      - style: real_world
        teach: A school buys 9 football tickets at ₹75 each. Writing 75 nine times and adding is slow. 75 × 9 gives the same answer, ₹675, in one step.
    - teach: To multiply by a 2-digit number, split it into tens and ones. 36 × 24 = 36 × 20 + 36 × 4 = 720 + 144 = 864.
      picture:
        kind: area_grid
        cols:
        - size: 3
          label: '20'
        - size: 1
          label: '4'
        rows:
        - size: 3
          label: '30'
        - size: 1
          label: '6'
        cells:
        - - '600'
          - '120'
        - - '120'
          - '24'
        alt: 36 × 24 split into 30 × 20, 30 × 4, 6 × 20 and 6 × 4, which add to 864.
      check:
        prompt: What is 23 × 10?
        options:
        - '230'
        - 2,300
        - '33'
        answer: '230'
        why: Multiplying by 10 puts one zero at the end.
      ways:
      - style: step_by_step
        teach: 'Work out 47 × 23. Step 1: Split 23 into 20 and 3. Step 2: 47 × 20 = 940. Step 3: 47 × 3 = 141. Step 4: Add the parts: 940 + 141 = 1,081.'
      - style: real_world
        teach: 'A garden has 23 rows of 47 plants. Count the first 20 rows (47 × 20 = 940 plants), then the last 3 rows (47 × 3 = 141 plants), then add: 1,081 plants.'
    - teach: 'Multiplying by 10 puts a zero at the end (58 × 10 = 580). Multiplying by 100 puts two zeros (58 × 100 = 5,800). Use this to multiply by 20, 30 or 200 quickly: 15 × 30 = 15 × 3 × 10 = 450.'
      check:
        prompt: What is 7 × 200?
        options:
        - 1,400
        - '140'
        - 14,000
        answer: 1,400
        why: 7 × 2 = 14, then two zeros for the 100.
      ways:
      - style: visual
        teach: What multiplying by 10 and by 100 does to the digits.
        picture:
          kind: flow
          steps:
          - '37'
          - '37 × 10 = 370: each digit moves one place left'
          - '37 × 100 = 3,700: each digit moves two places left'
          alt: 37 times 10 is 370, each digit moving one place to the left. 37 times 100 is 3,700, each digit moving two places to the left.
      - style: step_by_step
        teach: 'Work out 24 × 30 quickly. Step 1: 30 is 3 × 10. Step 2: 24 × 3 = 72. Step 3: Multiply by 10 by putting a zero at the end: 720.'
  items:
  - prompt: A bus ticket costs ₹45. How much do 12 tickets cost in rupees?
    answer: '540'
    check: 45*12
    difficulty: 1
    hints:
    - 45 × 12.
    - 45 × 10 + 45 × 2.
    solution: 45 × 12 = 540, so ₹540.
    mistakes:
      '450': c5_times_table
  - prompt: What is 245 × 4?
    answer: '980'
    check: 245*4
    difficulty: 1
    hints:
    - 5 × 4 = 20, carry 2.
    - Then 4 × 4 + 2, then 2 × 4 + 1.
    solution: 245 × 4 = 980.
    mistakes: {"960": "m5_times_carry", "820": "m5_times_carry"}
  - prompt: What is 36 × 24?
    answer: '864'
    check: 36*24
    difficulty: 2
    hints:
    - 36 × 20 + 36 × 4.
    - 720 + 144.
    solution: 36 × 24 = 720 + 144 = 864.
    mistakes:
      '792': c5_times_table
  - prompt: What is 58 × 100?
    answer: '5800'
    check: 58*100
    difficulty: 1
    hints:
    - Multiplying by 100 adds two zeros.
    - 58 then 00.
    solution: 58 × 100 = 5,800.
    mistakes: {"580": "m5_times_100", "58100": "m5_times_100"}
  - prompt: A car goes 65 km each hour. How far does it go in 8 hours, in km?
    answer: '520'
    check: 65*8
    difficulty: 1
    hints:
    - 65 × 8.
    - 60 × 8 + 5 × 8.
    solution: 65 × 8 = 480 + 40 = 520 km.
    mistakes: {"480": "m5_times_carry", "73": "m5_times_carry"}
  - prompt: A train has 18 coaches with 72 seats each. How many seats are there?
    answer: '1296'
    check: 72*18
    difficulty: 2
    hints:
    - 72 × 18.
    - 72 × 10 + 72 × 8.
    solution: 72 × 18 = 720 + 576 = 1,296 seats.
    mistakes: {"1206": "m5_times_carry", "90": "m5_times_carry"}
  - prompt: What is 125 × 6?
    answer: '750'
    check: 125*6
    difficulty: 1
    hints:
    - Multiply 100, 20 and 5 by 6 separately.
    - 600 + 120 + 30.
    solution: 'Step 1: 100×6=600, 20×6=120, 5×6=30. Step 2: 600+120+30 = 750.'
    mistakes:
      '720': c5m4_split
      '630': c5m4_split
  - prompt: What is 43 × 100?
    answer: '4300'
    check: 43*100
    difficulty: 1
    hints:
    - Multiplying by 100 adds zeros.
    - How many zeros does 100 have?
    solution: 'Step 1: 100 has two zeros. Step 2: 43 → 4,300.'
    mistakes:
      '430': c5m4_zeros
      '43000': c5m4_zeros
  - prompt: What is 27 × 15?
    answer: '405'
    check: 27*15
    difficulty: 2
    hints:
    - Split 15 into 10 and 5.
    - 27 × 10 = 270; now find 27 × 5.
    solution: 'Step 1: 27 × 10 = 270, 27 × 5 = 135. Step 2: 270 + 135 = 405.'
    mistakes:
      '270': c5m4_split
      '135': c5m4_split
      '42': c5m4_which
  - prompt: A van travels 48 km every hour. How far does it go in 12 hours, in km?
    answer: '576'
    check: 48*12
    difficulty: 2
    hints:
    - 12 equal groups of 48.
    - 48 × 10 + 48 × 2.
    solution: 'Step 1: 48 × 10 = 480, 48 × 2 = 96. Step 2: 480 + 96 = 576 km.'
    mistakes:
      '60': c5m4_which
      '480': c5m4_split
      '4': c5m4_which
  - prompt: A hotel room costs ₹850 a night. What do 3 nights cost, in rupees?
    answer: '2550'
    check: 850*3
    difficulty: 1
    hints:
    - 3 equal amounts of 850.
    - 800 × 3 and 50 × 3.
    solution: 'Step 1: 800×3 = 2,400, 50×3 = 150. Step 2: 2,550.'
    mistakes:
      '853': c5m4_which
      '2450': c5m4_split
  - prompt: What is 30 × 40?
    answer: '1200'
    check: 30*40
    difficulty: 2
    hints:
    - Multiply 3 × 4 first.
    - Then count the zeros in both numbers.
    solution: 'Step 1: 3 × 4 = 12. Step 2: two zeros: 1,200.'
    mistakes:
      '120': c5m4_zeros
      '12000': c5m4_zeros
      '70': c5m4_which
  - prompt: A plane has 32 rows with 6 seats in each row. How many seats?
    answer: '192'
    check: 32*6
    difficulty: 2
    hints:
    - 32 groups of 6.
    - 30 × 6 and 2 × 6.
    solution: 'Step 1: 30×6 = 180, 2×6 = 12. Step 2: 192 seats.'
    mistakes:
      '38': c5m4_which
      '182': c5m4_split
  - prompt: Which is the same as 25 × 16?
    options:
    - 25 × 10 + 25 × 6
    - 25 × 10 + 6
    - 25 + 16
    answer: 25 × 10 + 25 × 6
    difficulty: 3
    hints:
    - 16 = 10 + 6.
    - Each part of 16 must be multiplied by 25.
    solution: 'Step 1: split 16 into 10 + 6. Step 2: 25 × 10 + 25 × 6 = 250 + 150 = 400.'
    mistakes:
      25 × 10 + 6: c5m4_split
      25 + 16: c5m4_which
  - prompt: A school trip has 4 buses with 45 children each and 2 teachers per bus. How many people in all?
    answer: '188'
    check: 4*45+4*2
    difficulty: 3
    hints:
    - Find the people on one bus first.
    - 45 children + 2 teachers per bus.
    solution: 'Step 1: one bus has 45 + 2 = 47. Step 2: 4 × 47 = 188.'
    mistakes:
      '180': c5m4_which
      '182': c5m4_which
  - prompt: 'Case: A tour company runs 3 buses. Each bus has 42 seats. Every seat is filled and each traveller pays ₹150. How much does the company collect?'
    options:
    - ₹18,900
    - ₹6,300
    - ₹195
    answer: ₹18,900
    hints:
    - First find how many travellers there are.
    - Then multiply by the price of one ticket.
    solution: 'Travellers: 3 × 42 = 126. Money: 126 × 150 = 126 × 100 + 126 × 50 = 12,600 + 6,300 = ₹18,900.'
    mistakes:
      ₹6,300: c5m4_split
      ₹195: c5m4_which
    exam: case
    difficulty: 2
  - prompt: 'Situation: A shop sells pencils in packs of 10. A teacher buys 46 packs. How many pencils is that?'
    options:
    - '460'
    - 4,600
    - '56'
    answer: '460'
    hints:
    - 'Multiplying by 10: what happens at the end of the number?'
    - One zero or two?
    solution: '46 × 10 = 460 pencils: multiplying by 10 puts one zero at the end.'
    mistakes:
      4,600: c5m4_zeros
      '56': c5m4_which
    exam: competency
    difficulty: 2
- code: cbse5m.trav2.div
  title: Sharing and dividing
  after:
  - cbse5m.trav2.mult
  notes: |
    Division shares equally or makes equal groups. 96 ÷ 4 = 24. Long division: divide, multiply, subtract, bring down.
    Remainder: what is left over (50 ÷ 8 = 6 remainder 2). Check: quotient × divisor + remainder = dividend. Story
    problems decide whether to round up: 50 people in cars of 8 need 7 cars, not 6.
  explanations:
    text: 'Dividing means sharing fairly. If 96 sweets are shared among 4 children, each gets 24. Sometimes some are left over: that is the remainder. Multiply back to check your answer.'
    visual: 'Draw 4 circles for the children. Deal out tens first: 2 tens each (80 used). 16 left: 4 each. Each circle has 2 tens and 4 ones: 24.'
    step_by_step: 'Step 1: Divide the biggest place first. Step 2: Multiply and subtract. Step 3: Bring down the next digit and repeat. Step 4: Check by multiplying back.'
    real_world: Sharing the cost of a trip between friends, or finding how many buses are needed for a school outing.
  picture:
    kind: number_line
    from: 0
    to: 100
    step: 24
    points:
    - at: 0
      label: '0'
    - at: 24
      label: '24'
    - at: 48
      label: '48'
    - at: 72
      label: '72'
    - at: 96
      label: '96'
    alt: Four jumps of 24 on a number line reach 96, so 96 divided by 4 is 24.
    jumps:
    - from: 0
      to: 24
      label: '24'
    - from: 24
      to: 48
      label: '24'
    - from: 48
      to: 72
      label: '24'
    - from: 72
      to: 96
      label: '24'
  activity:
    type: formula
    prompt: 96 sweets are shared fairly. Set how many children, and how many each one gets.
    inputs:
    - name: k
      label: Children
      min: 1
      max: 12
      step: 1
      start: 1
    - name: e
      label: Sweets each
      min: 0
      max: 50
      step: 1
      start: 0
    outputs:
    - name: used
      label: Sweets given out
      expr: k*e
    - name: left
      label: Sweets left
      expr: 96-k*e
    goals:
    - prompt: Share among 4 children with none left.
      want:
        k: 4
        left: 0
      mistakes:
      - when:
          k: 4
          e: 20
        say: '4 × 20 = 80. There are still 16 left: share those too.'
      - when:
          k: 4
          e:
          - 25
          - 50
        say: That's more than 96 sweets! Give each child fewer.
    - prompt: Share among 7 children. Give each as many as you can.
      want:
        k: 7
        e: 13
      mistakes:
      - when:
          k: 7
          e: 14
        say: '7 × 14 = 98: more than 96. Give one less each; 5 are left over.'
      - when:
          k: 7
          e:
          - 1
          - 12
        say: There are enough to give each one more.
    - prompt: Share among 8 children with none left.
      want:
        k: 8
        left: 0
      mistakes:
      - when:
          k: 8
          e:
          - 13
          - 50
        say: More than you have. 8 × 12 = 96.
  lesson:
    - teach: 'Dividing shares a total into equal groups, or finds how many groups fit. 96 sweets shared among 4 children: 96 ÷ 4 = 24 each. Check by multiplying back: 24 × 4 = 96.'
      check:
        prompt: Which multiplication checks 56 ÷ 7 = 8?
        options:
        - 8 × 7 = 56
        - 8 + 7 = 15
        - 56 × 7
        answer: 8 × 7 = 56
        why: Answer × divisor gives back the total.
      ways:
      - style: visual
        teach: Sharing 60 bangles equally into 5 boxes.
        picture:
          kind: compare
          columns:
          - title: Box 1 and 2
            points:
            - 12 bangles
            - 12 bangles
          - title: Box 3 and 4
            points:
            - 12 bangles
            - 12 bangles
          - title: Box 5
            points:
            - 12 bangles
          alt: '60 bangles shared equally into 5 boxes gives 12 bangles in each box. Check: 12 times 5 is 60.'
      - style: real_world
        teach: 'Dividing answers two kinds of question. ''Share 60 bangles into 5 boxes: how many in each?'' and ''Pack 60 bangles, 12 to a box: how many boxes?'' Both use 60 ÷ ..., and you can check each by multiplying back.'
    - teach: 'Long division works one place at a time from the left: divide, multiply, subtract, bring down. For 735 ÷ 5: 7 ÷ 5 = 1 r 2; bring down 3 to make 23; 23 ÷ 5 = 4 r 3; bring down 5 to make 35; 35 ÷ 5 = 7. Answer 147.'
      picture:
        kind: flow
        steps:
        - Divide
        - Multiply
        - Subtract
        - Bring down
        - Repeat
        alt: The four steps of long division, repeated for each digit.
      check:
        prompt: What is the first step of long division?
        options:
        - Divide the first digit(s)
        - Add all digits
        - Bring down the last digit
        answer: Divide the first digit(s)
        why: You start dividing from the left.
      ways:
      - style: step_by_step
        teach: 'Work out 856 ÷ 4. Step 1: 8 ÷ 4 = 2, nothing left. Step 2: Bring down 5: 5 ÷ 4 = 1, remainder 1. Step 3: Bring down 6 to make 16: 16 ÷ 4 = 4. Step 4: Answer 214. Check: 214 × 4 = 856.'
      - style: real_world
        teach: 'A bank teller counting notes works the same way: first the big bundles of hundreds, then the tens, then the single notes. Long division also starts with the biggest place and moves right.'
    - teach: 'Sometimes some are left over: 50 ÷ 8 = 6 remainder 2. The remainder is always smaller than the divisor. In a story, think about the leftovers: 50 children in cars of 8 need 7 cars, because the last 2 children still need a car.'
      check:
        prompt: 26 eggs go in trays of 6. How many full trays?
        options:
        - '4'
        - '5'
        - '6'
        answer: '4'
        why: 4 × 6 = 24; 2 eggs are left over, not a full tray.
      ways:
      - style: visual
        teach: '29 eggs packed 6 to a box: full boxes and the leftover.'
        picture:
          kind: number_line
          from: 0
          to: 30
          step: 6
          jumps:
          - from: 0
            to: 6
            label: box 1
          - from: 6
            to: 12
            label: box 2
          - from: 12
            to: 18
            label: box 3
          - from: 18
            to: 24
            label: box 4
          points:
          - at: 29
            label: 29 eggs
          alt: 'Jumps of 6 on a number line: four full boxes reach 24. From 24 to 29 there are 5 eggs left over, so 29 divided by 6 is 4 remainder 5.'
      - style: real_world
        teach: 29 eggs in boxes of 6 make 4 full boxes with 5 eggs left. If you are selling full boxes, you can sell 4. If every egg must go in a box, you need a 5th box. The question decides what to do with the remainder.
  items:
  - prompt: 96 sweets are shared equally among 4 children. How many does each get?
    answer: '24'
    check: 96/4
    difficulty: 1
    hints:
    - 96 ÷ 4.
    - 80 ÷ 4 = 20, 16 ÷ 4 = 4.
    solution: 96 ÷ 4 = 24.
    mistakes:
      '20': c5_share
  - prompt: What is 735 ÷ 5?
    answer: '147'
    check: 735/5
    difficulty: 2
    hints:
    - 7 ÷ 5 = 1 remainder 2.
    - 'Bring down: 23 ÷ 5 = 4 remainder 3, then 35 ÷ 5 = 7.'
    solution: 735 ÷ 5 = 147.
    mistakes: {"127": "m5_divide_check", "740": "m5_divide_check"}
  - prompt: 50 ÷ 8 gives 6 and what remainder?
    answer: '2'
    check: 50 - 8*6
    difficulty: 1
    hints:
    - 8 × 6 = 48.
    - 50 − 48.
    solution: 8 × 6 = 48, so the remainder is 2.
    mistakes: {"6": "m5_remainder", "4": "m5_remainder"}
  - prompt: 50 children go on a trip. Each car holds 8 children. How many cars are needed?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - 50 ÷ 8 = 6 remainder 2.
    - The 2 children left still need a car.
    solution: 6 cars carry 48; 2 more need a 7th car.
    mistakes:
      '6': c5_share
  - prompt: ₹840 is shared equally among 7 friends. How much does each get in rupees?
    answer: '120'
    check: 840/7
    difficulty: 1
    hints:
    - 840 ÷ 7.
    - 7 × 120 = 840.
    solution: 840 ÷ 7 = ₹120.
    mistakes: {"12": "m5_divide_check", "833": "m5_divide_check"}
  - prompt: A rope of 144 m is cut into pieces of 12 m. How many pieces?
    answer: '12'
    check: 144/12
    difficulty: 1
    hints:
    - "Divide the whole length of rope by the length of one piece."
    - 12 × 12 = 144.
    solution: 144 ÷ 12 = 12 pieces.
    mistakes: {"10": "m5_divide_check", "132": "m5_divide_check"}
  - prompt: What is 84 ÷ 4?
    answer: '21'
    check: 84//4
    difficulty: 1
    hints:
    - 'Divide the tens first: 8 ÷ 4.'
    - 'Then the ones: 4 ÷ 4.'
    solution: 'Step 1: 8 tens ÷ 4 = 2 tens. Step 2: 4 ÷ 4 = 1. Answer 21.'
    mistakes:
      '336': c5m4_which
      '12': c5m4_long
  - prompt: What is 648 ÷ 6?
    answer: '108'
    check: 648//6
    difficulty: 2
    hints:
    - '6 ÷ 6 = 1. Then 4 ÷ 6 does not go: write 0.'
    - Bring down to make 48.
    solution: 'Step 1: 6÷6=1; 4÷6=0 r 4. Step 2: 48÷6=8. Answer 108.'
    mistakes:
      '18': c5m4_long
      '180': c5m4_long
  - prompt: 43 ÷ 5 gives 8 and what remainder?
    answer: '3'
    check: 43%5
    difficulty: 1
    hints:
    - 8 × 5 = 40.
    - How much more is 43 than 40?
    solution: 'Step 1: 8 × 5 = 40. Step 2: 43 − 40 = 3.'
    mistakes:
      '8': c5m4_left
      '5': c5m4_left
      '0': c5m4_left
  - prompt: 38 people need boats. Each boat holds 6. How many boats are needed?
    answer: '7'
    check: -(-38//6)
    difficulty: 2
    hints:
    - 38 ÷ 6 = 6 remainder 2.
    - Do the 2 leftover people need a boat?
    solution: 'Step 1: 6 boats carry 36. Step 2: 2 people are left, so one more boat: 7.'
    mistakes:
      '6': c5m4_roundup
      '2': c5m4_left
  - prompt: ₹960 is shared equally among 8 friends. How much does each get, in rupees?
    answer: '120'
    check: 960//8
    difficulty: 2
    hints:
    - Shared equally means divide.
    - 96 ÷ 8 = 12, then think about the zero.
    solution: 'Step 1: 96 tens ÷ 8 = 12 tens. Step 2: = ₹120.'
    mistakes:
      '7680': c5m4_which
      '12': c5m4_zeros
  - prompt: A rope is 90 m long. It is cut into pieces of 15 m. How many pieces?
    answer: '6'
    check: 90//15
    difficulty: 2
    hints:
    - How many 15s fit in 90?
    - 'Count in 15s: 15, 30, 45...'
    solution: 'Step 1: 90 ÷ 15. Step 2: = 6 pieces.'
    mistakes:
      '75': c5m4_which
      '5': c5m4_long
  - prompt: A train goes 360 km in 4 hours at the same speed. How far does it go in 1 hour, in km?
    answer: '90'
    check: 360//4
    difficulty: 2
    hints:
    - Share 360 into 4 equal parts.
    - 36 ÷ 4 = 9.
    solution: 'Step 1: 360 ÷ 4. Step 2: = 90 km each hour.'
    mistakes:
      '1440': c5m4_which
      '9': c5m4_zeros
  - prompt: Which division has remainder 0?
    options:
    - 72 ÷ 9
    - 73 ÷ 9
    - 70 ÷ 9
    answer: 72 ÷ 9
    difficulty: 3
    hints:
    - Remainder 0 means it divides exactly.
    - Which number is in the 9 times table?
    solution: 'Step 1: 9 × 8 = 72. Step 2: so 72 ÷ 9 has no remainder.'
    mistakes:
      73 ÷ 9: c5m4_left
      70 ÷ 9: c5m4_left
  - prompt: A box holds 12 pencils. How many full boxes can be packed from 100 pencils?
    answer: '8'
    check: 100//12
    difficulty: 3
    hints:
    - 12 × 8 = 96.
    - Are the 4 leftover pencils a full box?
    solution: 'Step 1: 100 ÷ 12 = 8 remainder 4. Step 2: only 8 boxes are full.'
    mistakes:
      '9': c5m4_roundup
      '4': c5m4_left
  - prompt: 'Case: 75 children are going to a museum. Each van takes 9 children. The teacher books 8 vans. Is that enough?'
    options:
    - No, 9 vans are needed
    - Yes, 8 vans are enough
    - No, 10 vans are needed
    answer: No, 9 vans are needed
    hints:
    - Work out 75 ÷ 9. What is the remainder?
    - Do the leftover children still need a van?
    solution: 75 ÷ 9 = 8 remainder 3. 8 vans carry 72 children, and the other 3 children still need a van, so 9 vans are needed.
    mistakes:
      Yes, 8 vans are enough: c5m4_roundup
      No, 10 vans are needed: c5m4_left
    exam: case
    difficulty: 2
  - prompt: 'Situation: ₹525 is shared equally among 5 friends who earned it selling lemonade. How much does each friend get?'
    options:
    - ₹105
    - ₹15
    - ₹1,050
    answer: ₹105
    hints:
    - Divide one place at a time from the left.
    - What do you write when a place cannot be divided?
    solution: '5 ÷ 5 = 1; 2 ÷ 5 = 0 remainder 2, so write 0; 25 ÷ 5 = 5. Each friend gets ₹105. Check: 105 × 5 = 525.'
    mistakes:
      ₹15: c5m4_long
      ₹1,050: c5m4_long
    exam: competency
    difficulty: 2
