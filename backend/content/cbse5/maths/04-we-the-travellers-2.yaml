# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 4
title: We the Travellers-II
tips:
  c5_times_table: Multiply each digit by the number, starting from the ones, and carry when you pass 9.
  c5_share: 'Dividing is sharing equally: ask how many in each group, or how many groups.'
concepts:
- code: cbse5m.trav2.mult
  title: Multiplying for trips
  notes: |
    Multiply bigger numbers: 3-digit by 1-digit (245 × 4 = 980) and 2-digit by 2-digit (36 × 24 = 864: 36 × 20 = 720,
    36 × 4 = 144, add). Multiplying by 10 adds a zero; by 100 adds two zeros. Use it for repeated amounts: a bus ticket
    costs ₹45 for each of 12 people = 45 × 12 = ₹540.
  explanations:
    text: 'Multiplication is quick adding of equal groups. If 12 people each pay ₹45, add 45 twelve times, or multiply 45 × 12. Split the 12 into 10 and 2: 45 × 10 = 450 and 45 × 2 = 90, so 540.'
    visual: 'Draw a box split into two parts: 45 × 10 and 45 × 2. Write 450 and 90 inside. Add them: 540.'
    step_by_step: 'Step 1: Split one number into tens and ones. Step 2: Multiply each part. Step 3: Add the answers.'
    real_world: Working out the total fare for a family, or how far a car goes in several hours at the same speed.
  picture:
    kind: flow
    steps:
    - 45 × 12
    - = 45 × 10 + 45 × 2
    - = 450 + 90
    - = 540
    alt: 45 times 12 is split into 45 times 10 plus 45 times 2, which is 450 plus 90, so 540.
  activity:
    type: formula
    prompt: Tickets for a trip. Set the price of one ticket and how many people go.
    inputs:
    - name: a
      label: Price of one ticket
      min: 1
      max: 100
      step: 1
      start: 1
      unit: ₹
    - name: n
      label: People
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: cost
      label: Total cost
      expr: a*n
      unit: ₹
    goals:
    - prompt: Tickets cost ₹45. The total is ₹540. How many people?
      want:
        a: 45
        cost: 540
      mistakes:
      - when:
          a: 45
          n: 10
        say: '10 tickets cost 450. You need 90 more: that''s 2 more tickets.'
      - when:
          a: 45
          n:
          - 13
          - 30
        say: 'Too many: that costs more than 540.'
    - prompt: 15 children paid ₹600 in all. What did one ticket cost?
      want:
        n: 15
        cost: 600
      mistakes:
      - when:
          n: 15
          a: 45
        say: '15 × 45 = 675: too much. Try a smaller price.'
      - when:
          n: 15
          a:
          - 41
          - 100
        say: 'Too much: 15 × 41 is already more than 600.'
    - prompt: Tickets cost ₹25. The total is ₹750.
      want:
        a: 25
        cost: 750
      mistakes:
      - when:
          a: 25
          n:
          - 20
          - 29
        say: Not enough people yet. 25 × 30 = 750.
  items:
  - prompt: A bus ticket costs ₹45. How much do 12 tickets cost in rupees?
    answer: '540'
    check: 45*12
    difficulty: 1
    hints:
    - 45 × 12.
    - 45 × 10 + 45 × 2.
    solution: 45 × 12 = 540, so ₹540.
    mistakes:
      '450': c5_times_table
  - prompt: What is 245 × 4?
    answer: '980'
    check: 245*4
    difficulty: 1
    hints:
    - 5 × 4 = 20, carry 2.
    - Then 4 × 4 + 2, then 2 × 4 + 1.
    solution: 245 × 4 = 980.
  - prompt: What is 36 × 24?
    answer: '864'
    check: 36*24
    difficulty: 2
    hints:
    - 36 × 20 + 36 × 4.
    - 720 + 144.
    solution: 36 × 24 = 720 + 144 = 864.
    mistakes:
      '792': c5_times_table
  - prompt: What is 58 × 100?
    answer: '5800'
    check: 58*100
    difficulty: 1
    hints:
    - Multiplying by 100 adds two zeros.
    - 58 then 00.
    solution: 58 × 100 = 5,800.
  - prompt: A car goes 65 km each hour. How far does it go in 8 hours, in km?
    answer: '520'
    check: 65*8
    difficulty: 1
    hints:
    - 65 × 8.
    - 60 × 8 + 5 × 8.
    solution: 65 × 8 = 480 + 40 = 520 km.
  - prompt: A train has 18 coaches with 72 seats each. How many seats are there?
    answer: '1296'
    check: 72*18
    difficulty: 2
    hints:
    - 72 × 18.
    - 72 × 10 + 72 × 8.
    solution: 72 × 18 = 720 + 576 = 1,296 seats.
- code: cbse5m.trav2.div
  title: Sharing and dividing
  after:
  - cbse5m.trav2.mult
  notes: |
    Division shares equally or makes equal groups. 96 ÷ 4 = 24. Long division: divide, multiply, subtract, bring down.
    Remainder: what is left over (50 ÷ 8 = 6 remainder 2). Check: quotient × divisor + remainder = dividend. Story
    problems decide whether to round up: 50 people in cars of 8 need 7 cars, not 6.
  explanations:
    text: 'Dividing means sharing fairly. If 96 sweets are shared among 4 children, each gets 24. Sometimes some are left over: that is the remainder. Multiply back to check your answer.'
    visual: 'Draw 4 circles for the children. Deal out tens first: 2 tens each (80 used). 16 left: 4 each. Each circle has 2 tens and 4 ones: 24.'
    step_by_step: 'Step 1: Divide the biggest place first. Step 2: Multiply and subtract. Step 3: Bring down the next digit and repeat. Step 4: Check by multiplying back.'
    real_world: Sharing the cost of a trip between friends, or finding how many buses are needed for a school outing.
  picture:
    kind: number_line
    from: 0
    to: 100
    step: 24
    points:
    - at: 0
      label: '0'
    - at: 24
      label: '24'
    - at: 48
      label: '48'
    - at: 72
      label: '72'
    - at: 96
      label: '96'
    alt: Four jumps of 24 on a number line reach 96, so 96 divided by 4 is 24.
    jumps:
    - from: 0
      to: 24
      label: '24'
    - from: 24
      to: 48
      label: '24'
    - from: 48
      to: 72
      label: '24'
    - from: 72
      to: 96
      label: '24'
  activity:
    type: formula
    prompt: 96 sweets are shared fairly. Set how many children, and how many each one gets.
    inputs:
    - name: k
      label: Children
      min: 1
      max: 12
      step: 1
      start: 1
    - name: e
      label: Sweets each
      min: 0
      max: 50
      step: 1
      start: 0
    outputs:
    - name: used
      label: Sweets given out
      expr: k*e
    - name: left
      label: Sweets left
      expr: 96-k*e
    goals:
    - prompt: Share among 4 children with none left.
      want:
        k: 4
        left: 0
      mistakes:
      - when:
          k: 4
          e: 20
        say: '4 × 20 = 80. There are still 16 left: share those too.'
      - when:
          k: 4
          e:
          - 25
          - 50
        say: That's more than 96 sweets! Give each child fewer.
    - prompt: Share among 7 children. Give each as many as you can.
      want:
        k: 7
        e: 13
      mistakes:
      - when:
          k: 7
          e: 14
        say: '7 × 14 = 98: more than 96. Give one less each; 5 are left over.'
      - when:
          k: 7
          e:
          - 1
          - 12
        say: There are enough to give each one more.
    - prompt: Share among 8 children with none left.
      want:
        k: 8
        left: 0
      mistakes:
      - when:
          k: 8
          e:
          - 13
          - 50
        say: More than you have. 8 × 12 = 96.
  items:
  - prompt: 96 sweets are shared equally among 4 children. How many does each get?
    answer: '24'
    check: 96/4
    difficulty: 1
    hints:
    - 96 ÷ 4.
    - 80 ÷ 4 = 20, 16 ÷ 4 = 4.
    solution: 96 ÷ 4 = 24.
    mistakes:
      '20': c5_share
  - prompt: What is 735 ÷ 5?
    answer: '147'
    check: 735/5
    difficulty: 2
    hints:
    - 7 ÷ 5 = 1 remainder 2.
    - 'Bring down: 23 ÷ 5 = 4 remainder 3, then 35 ÷ 5 = 7.'
    solution: 735 ÷ 5 = 147.
  - prompt: 50 ÷ 8 gives 6 and what remainder?
    answer: '2'
    check: 50 - 8*6
    difficulty: 1
    hints:
    - 8 × 6 = 48.
    - 50 − 48.
    solution: 8 × 6 = 48, so the remainder is 2.
  - prompt: 50 children go on a trip. Each car holds 8 children. How many cars are needed?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - 50 ÷ 8 = 6 remainder 2.
    - The 2 children left still need a car.
    solution: 6 cars carry 48; 2 more need a 7th car.
    mistakes:
      '6': c5_share
  - prompt: ₹840 is shared equally among 7 friends. How much does each get in rupees?
    answer: '120'
    check: 840/7
    difficulty: 1
    hints:
    - 840 ÷ 7.
    - 7 × 120 = 840.
    solution: 840 ÷ 7 = ₹120.
  - prompt: A rope of 144 m is cut into pieces of 12 m. How many pieces?
    answer: '12'
    check: 144/12
    difficulty: 1
    hints:
    - 144 ÷ 12.
    - 12 × 12 = 144.
    solution: 144 ÷ 12 = 12 pieces.
