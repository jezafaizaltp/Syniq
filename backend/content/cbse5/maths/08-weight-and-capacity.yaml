# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 8
title: Weight and Capacity
tips:
  c5_grams: 1 kg = 1000 g. Half a kilogram is 500 g. Change everything to grams before adding or comparing.
  m5_bucket: "10 mL is about two spoonfuls. A bucket is carried with both hands."
  m5_grams: "Grams are for light things. Which one could you hold on one finger?"
  m5_least: "Least means smallest. Which holds just a mouthful?"
  m5_packets: "250 + 250 + ... how many to reach 1000?"
  m5_quarter_kg: "1 kg = 1000 g. A quarter is 1000 split into 4 equal parts."
  c5m8_g: 1 kg is 1,000 g. Half and quarter of a kilogram are half and quarter of 1,000.
  c5m8_unit: Think how heavy or how big it is. Light, small things use the small unit; heavy, big things use the big one.
  c5m8_same: Change everything to grams (or millilitres) first, then add, subtract or compare.
  c5m8_fit: To find how many small ones fill a big one, divide the big amount by the small amount.
concepts:
- code: cbse5m.wt.weight
  title: Kilograms and grams
  notes: |
    Weight in kilograms (kg) and grams (g): 1 kg = 1000 g; 1/2 kg = 500 g; 1/4 kg = 250 g. Light things in g (an
    eraser), heavy in kg (a bag of rice). Add and subtract in grams. A balance compares weights.
  explanations:
    text: Heavy things are weighed in kilograms and light things in grams. 1 kilogram is 1000 grams. A packet of salt is 1 kg; a pencil weighs only a few grams.
    visual: Draw a balance with a 1 kg rice bag on one side and two 500 g sugar packets on the other. The balance is level.
    step_by_step: 'Step 1: Change all weights to grams. Step 2: Add or subtract. Step 3: Change back to kg and g if needed.'
    real_world: Buying vegetables by the kg at the market, or weighing a baby at the clinic.
  picture:
    kind: bars
    bars:
    - label: 1/4 kg
      value: 250
    - label: 1/2 kg
      value: 500
    - label: 3/4 kg
      value: 750
    - label: 1 kg
      value: 1000
    alt: A quarter kilogram is 250 grams, half 500, three quarters 750, and one kilogram 1000.
    unit: g
  activity:
    type: formula
    prompt: Weigh it in grams. 1 kg = 1000 g.
    inputs:
    - name: g
      label: Weight
      min: 0
      max: 3000
      step: 25
      start: 0
      unit: g
    outputs:
    - name: kg
      label: In kilograms
      expr: g/1000
      unit: kg
      places: 3
    goals:
    - prompt: 1 kg 250 g
      want:
        g: 1250
      mistakes:
      - when:
          g: 1025
        say: That's 1 kg 25 g. Here it's 250 g.
      - when:
          g: 250
        say: 'Don''t forget the 1 kg: that''s 1000 g more.'
    - prompt: Half a kilogram
      want:
        g: 500
      mistakes:
      - when:
          g: 50
        say: Half of 1000 g is 500 g.
      - when:
          g: 1500
        say: That's one and a half kilograms.
    - prompt: 2 kg 75 g
      want:
        g: 2075
      mistakes:
      - when:
          g: 2750
        say: That's 2 kg 750 g. Here it's only 75 g.
      - when:
          g: 275
        say: 2 kg is 2000 g, not 200 g.
  lesson:
    - teach: Weight tells how heavy something is. We use kilograms (kg) for heavy things like a bag of rice and grams (g) for light things like an eraser. 1 kg = 1,000 g.
      check:
        prompt: Which should be weighed in kilograms?
        options:
        - A sack of potatoes
        - A pencil
        - A leaf
        answer: A sack of potatoes
        why: It is heavy; the others are only a few grams.
      ways:
      - style: visual
        teach: Things we weigh in grams and things we weigh in kilograms.
        picture:
          kind: compare
          columns:
          - title: Grams (light)
            points:
            - A pencil
            - A coin
            - A small packet of salt
          - title: Kilograms (heavy)
            points:
            - A sack of wheat
            - A watermelon
            - A school bag full of books
          alt: Light things such as a pencil, a coin or a small packet of salt are weighed in grams. Heavy things such as a sack of wheat, a watermelon or a full school bag are weighed in kilograms.
      - style: real_world
        teach: At a ration shop, rice and sugar are sold by the kilogram. At a spice shop, saffron or cardamom may be sold by the gram, because a little is enough and it costs a lot.
    - teach: 'Parts of a kilogram: 1/2 kg = 500 g, 1/4 kg = 250 g, 3/4 kg = 750 g. To change kg to g, multiply by 1,000: 3 kg = 3,000 g.'
      picture:
        kind: bars
        unit: g
        bars:
        - label: 1 kg
          value: 1000
        - label: 3/4 kg
          value: 750
        - label: 1/2 kg
          value: 500
        - label: 1/4 kg
          value: 250
        alt: 1 kg is 1000 g; three quarters, half and a quarter kilogram are 750, 500 and 250 g.
      check:
        prompt: How many grams are in 1/2 kg?
        options:
        - '500'
        - '50'
        - '200'
        answer: '500'
        why: Half of 1,000 is 500.
      ways:
      - style: step_by_step
        teach: 'Change 5 1/2 kg to grams. Step 1: 5 kg = 5 × 1,000 = 5,000 g. Step 2: 1/2 kg = 500 g. Step 3: Add: 5,000 + 500 = 5,500 g.'
      - style: real_world
        teach: Vegetable sellers often use weights of 1 kg, 500 g, 250 g and 100 g. To weigh 750 g of beans, they put the 500 g and 250 g weights together on one pan.
    - teach: 'To add or subtract weights, change to grams first: 1 kg 200 g + 900 g = 1,200 g + 900 g = 2,100 g = 2 kg 100 g. A balance shows which side is heavier: the heavier pan goes down.'
      check:
        prompt: On a balance, which pan goes down?
        options:
        - The heavier one
        - The lighter one
        - Both stay level always
        answer: The heavier one
        why: More weight pulls that side down.
      ways:
      - style: visual
        teach: 'Reading a balance: the heavier pan goes down.'
        picture:
          kind: compare
          columns:
          - title: Left pan
            points:
            - 1 kg 300 g = 1,300 g
            - Goes down
          - title: Right pan
            points:
            - 950 g
            - Goes up
          alt: On a balance, the left pan holds 1 kg 300 g, which is 1,300 g, and goes down. The right pan holds 950 g and goes up, because it is lighter.
      - style: step_by_step
        teach: 'Subtract 2 kg − 650 g. Step 1: Change to grams: 2 kg = 2,000 g. Step 2: 2,000 − 650 = 1,350 g. Step 3: Change back: 1,350 g = 1 kg 350 g.'
  items:
  - prompt: How many grams are in 2 kg?
    answer: '2000'
    check: 2*1000
    difficulty: 1
    hints:
    - 1 kg = 1000 g.
    - 2 × 1000.
    solution: 2 kg = 2,000 g.
    mistakes:
      '200': c5_grams
  - prompt: How many grams are in 1/4 kg?
    answer: '250'
    check: 1000/4
    difficulty: 1
    hints:
    - 1000 ÷ 4.
    - A quarter of 1000.
    solution: 1000 ÷ 4 = 250 g.
    mistakes: {"25": "m5_quarter_kg", "400": "m5_quarter_kg"}
  - prompt: Which should be weighed in grams?
    options:
    - an eraser
    - a bag of rice
    - a child
    - a sack of potatoes
    answer: an eraser
    difficulty: 1
    hints:
    - Grams are for light things.
    - Which is lightest?
    solution: An eraser is light, so grams.
    mistakes: {"a bag of rice": "m5_grams"}
  - prompt: Amma buys 1 kg 500 g of onions and 750 g of tomatoes. How many grams in all?
    answer: '2250'
    check: 1500+750
    difficulty: 2
    hints:
    - 1 kg 500 g = 1500 g.
    - 1500 + 750.
    solution: 1,500 + 750 = 2,250 g = 2 kg 250 g.
    mistakes:
      '1250': c5_grams
  - prompt: A bag holds 5 kg of rice. 1 kg 200 g is used. How many grams are left?
    answer: '3800'
    check: 5000-1200
    difficulty: 2
    hints:
    - 5 kg = 5000 g.
    - 5000 − 1200.
    solution: 5,000 − 1,200 = 3,800 g.
    mistakes: {"4800": "m5_unit_convert", "3200": "m5_unit_convert"}
  - prompt: How many 250 g packets make 1 kg?
    answer: '4'
    check: 1000/250
    difficulty: 1
    hints:
    - 1000 ÷ 250.
    - 250 + 250 + 250 + 250.
    solution: 1000 ÷ 250 = 4 packets.
    mistakes: {"5": "m5_packets", "2": "m5_packets"}
  - prompt: How many grams are in 4 kg?
    answer: '4000'
    check: 4*1000
    difficulty: 1
    hints:
    - 1 kg = 1,000 g.
    - 4 × 1,000.
    solution: 'Step 1: 4 × 1,000. Step 2: = 4,000 g.'
    mistakes:
      '400': c5m8_g
      '40': c5m8_g
  - prompt: How many grams are in 3/4 kg?
    answer: '750'
    check: 3*250
    difficulty: 2
    hints:
    - 1/4 kg = 250 g.
    - Three quarters is 3 × 250.
    solution: 'Step 1: 1/4 kg = 250 g. Step 2: 3 × 250 = 750 g.'
    mistakes:
      '340': c5m8_g
      '75': c5m8_g
      '250': c5m8_g
  - prompt: Which of these is best weighed in grams?
    options:
    - A spoon
    - A bicycle
    - A bag of cement
    answer: A spoon
    difficulty: 1
    hints:
    - Grams are for light things.
    - Which can you lift with two fingers?
    solution: 'Step 1: a spoon is very light. Step 2: grams fit best.'
    mistakes:
      A bicycle: c5m8_unit
      A bag of cement: c5m8_unit
  - prompt: 2 kg 350 g is how many grams?
    answer: '2350'
    check: 2000+350
    difficulty: 1
    hints:
    - 2 kg = 2,000 g.
    - Add 350.
    solution: 'Step 1: 2,000 + 350. Step 2: = 2,350 g.'
    mistakes:
      '2035': c5m8_g
      '235': c5m8_g
  - prompt: Dal 1 kg 250 g and sugar 2 kg 900 g. How many grams in all?
    answer: '4150'
    check: 1250+2900
    difficulty: 2
    hints:
    - Change both to grams.
    - 1,250 + 2,900.
    solution: 'Step 1: 1,250 + 2,900. Step 2: = 4,150 g.'
    mistakes:
      '3150': c5m8_same
      '4015': c5m8_same
  - prompt: A bag has 3 kg of flour. 1 kg 750 g is used. How many grams are left?
    answer: '1250'
    check: 3000-1750
    difficulty: 2
    hints:
    - 3 kg = 3,000 g.
    - Take away 1,750 g.
    solution: 'Step 1: 3,000 − 1,750. Step 2: = 1,250 g.'
    mistakes:
      '2250': c5m8_same
      '1350': c5m8_same
  - prompt: How many 500 g packets make 3 kg?
    answer: '6'
    check: 3000//500
    difficulty: 2
    hints:
    - Each kg is two 500 g packets.
    - 3 × 2.
    solution: 'Step 1: 3 kg = 3,000 g. Step 2: 3,000 ÷ 500 = 6.'
    mistakes:
      '3': c5m8_fit
      '15': c5m8_fit
  - prompt: 'Which is heavier: 1 kg 90 g or 1,100 g?'
    options:
    - 1,100 g
    - 1 kg 90 g
    - They are equal
    answer: 1,100 g
    difficulty: 3
    hints:
    - Change 1 kg 90 g to grams.
    - 1,000 + 90.
    solution: 'Step 1: 1 kg 90 g = 1,090 g. Step 2: 1,100 g is heavier.'
    mistakes:
      1 kg 90 g: c5m8_same
      They are equal: c5m8_same
  - prompt: A mango weighs 250 g. How many grams do 6 mangoes weigh?
    answer: '1500'
    check: 250*6
    difficulty: 3
    hints:
    - Same weight each.
    - 250 × 6.
    solution: 'Step 1: 250 × 6. Step 2: = 1,500 g (1 kg 500 g).'
    mistakes:
      '256': c5m8_fit
      '1200': c5m8_fit
  - prompt: 'Case: A shopkeeper puts a 1 kg weight and a 250 g weight on one pan of a balance. Potatoes are added to the other pan until the pans are level. How heavy are the potatoes?'
    options:
    - 1,250 g
    - 1,025 g
    - 251 g
    answer: 1,250 g
    hints:
    - When the pans are level, both sides weigh the same.
    - Change 1 kg to grams and add.
    solution: The weights are 1,000 g + 250 g = 1,250 g. Level pans mean the potatoes also weigh 1,250 g, which is 1 kg 250 g.
    mistakes:
      1,025 g: c5m8_g
      251 g: c5m8_g
    exam: case
    difficulty: 2
  - prompt: 'Situation: A recipe needs 3/4 kg of flour. The packet in the cupboard has 600 g. How many more grams are needed?'
    options:
    - 150 g
    - 350 g
    - 75 g
    answer: 150 g
    hints:
    - How many grams is 3/4 kg?
    - Then subtract what you already have.
    solution: 3/4 kg = 750 g. 750 − 600 = 150 g more is needed.
    mistakes:
      350 g: c5m8_g
      75 g: c5m8_g
    exam: competency
    difficulty: 2
- code: cbse5m.wt.capacity
  title: How much a container holds
  after:
  - cbse5m.wt.weight
  notes: |
    Capacity is how much a container holds, in litres and millilitres. A bucket ≈ 10 L, a glass ≈ 200 mL, a spoon ≈
    5 mL. How many glasses fill a jug: 1 L ÷ 200 mL = 5. Estimate and compare containers.
  explanations:
    text: Capacity tells how much liquid fits inside. A bucket holds about 10 litres; a glass about 200 millilitres. To find how many glasses a jug fills, divide the jug's amount by one glass.
    visual: Draw a 1 litre jug and five glasses of 200 mL in a row. 200 + 200 + 200 + 200 + 200 = 1000 mL.
    step_by_step: 'Step 1: Put both amounts in mL. Step 2: Divide the big amount by the small one. Step 3: That is how many times it fills.'
    real_world: Filling water bottles before school, or knowing how much water a family uses in a day.
  picture:
    kind: flow
    steps:
    - 1 L jug = 1000 mL
    - 1 glass = 200 mL
    - 1000 ÷ 200 = 5
    - 5 glasses
    alt: A 1 litre jug of 1000 millilitres fills 5 glasses of 200 millilitres.
  activity:
    type: formula
    prompt: A jug of water fills glasses of 200 mL each.
    inputs:
    - name: j
      label: Water in the jug
      min: 0
      max: 3000
      step: 100
      start: 0
      unit: mL
    outputs:
    - name: glasses
      label: Glasses filled
      expr: j/200
    goals:
    - prompt: Fill 5 glasses.
      want:
        glasses: 5
      mistakes:
      - when:
          j: 500
        say: 500 mL fills only 2 and a half glasses. Each glass needs 200 mL.
    - prompt: The jug holds 1 L 400 mL. Set it.
      want:
        j: 1400
      mistakes:
      - when:
          j: 400
        say: 'Don''t forget the 1 litre: that''s 1000 mL more.'
      - when:
          j: 1000
        say: Now add the 400 mL.
    - prompt: Fill 8 glasses.
      want:
        glasses: 8
      mistakes:
      - when:
          j: 800
        say: 800 mL fills 4 glasses. Each glass is 200 mL, not 100.
  lesson:
    - teach: Capacity is how much a container can hold. Big containers in litres (L), small ones in millilitres (mL). A bucket holds about 10 L, a glass about 200 mL, a spoon about 5 mL.
      check:
        prompt: About how much does a glass hold?
        options:
        - 200 mL
        - 10 L
        - 5 mL
        answer: 200 mL
        why: A glass is small but bigger than a spoon.
      ways:
      - style: visual
        teach: Containers from small to big, with about how much each holds.
        picture:
          kind: flow
          steps:
          - 'Spoon: about 5 mL'
          - 'Cup: about 150 mL'
          - 'Glass: about 200 mL'
          - 'Water bottle: about 1 L'
          - 'Bucket: about 10 L'
          alt: 'From small to big: a spoon holds about 5 mL, a cup about 150 mL, a glass about 200 mL, a water bottle about 1 L and a bucket about 10 L.'
      - style: real_world
        teach: Medicine for children is often measured with a 5 mL spoon. A family might fill a 20 L can of drinking water. Small amounts use mL; big amounts use L.
    - teach: To find how many small containers fill a big one, divide. A 1 L jug fills 1,000 ÷ 200 = 5 glasses of 200 mL.
      picture:
        kind: flow
        steps:
        - Jug 1 L = 1,000 mL
        - Glass = 200 mL
        - 1,000 ÷ 200
        - 5 glasses
        alt: Dividing the jug's capacity by the glass's capacity gives the number of glasses.
      check:
        prompt: How many 250 mL cups fill a 1 L jug?
        options:
        - '4'
        - '2'
        - '250'
        answer: '4'
        why: 1,000 ÷ 250 = 4.
      ways:
      - style: step_by_step
        teach: 'How many 300 mL cups fill a 1 L 500 mL jug? Step 1: Change the jug to mL: 1,500 mL. Step 2: Divide by the cup: 1,500 ÷ 300 = 5. Step 3: The jug fills 5 cups.'
      - style: real_world
        teach: A party host has a 3 L bottle of juice and glasses of 150 mL. 3 L = 3,000 mL, and 3,000 ÷ 150 = 20. There is enough for 20 glasses.
    - teach: To compare containers, use the same unit. 1 L 50 mL = 1,050 mL, which is less than 1,500 mL. To add, change to mL first.
      check:
        prompt: 'Which holds more: 2 L or 1,800 mL?'
        options:
        - 2 L
        - 1,800 mL
        - They are equal
        answer: 2 L
        why: 2 L = 2,000 mL, more than 1,800 mL.
      ways:
      - style: visual
        teach: Comparing 2 L 80 mL and 2,500 mL after changing to millilitres.
        picture:
          kind: bars
          unit: ' mL'
          bars:
          - label: 2 L 80 mL
            value: 2080
          - label: 2,500 mL
            value: 2500
          alt: 2 L 80 mL is 2,080 mL, shown as a shorter bar than 2,500 mL, so 2,500 mL holds more.
      - style: real_world
        teach: 'Bottle labels can trick you: ''1 L 20 mL'' looks bigger than ''1,200 mL'' because of the L. Change both to mL, 1,020 and 1,200, and you see the second holds more.'
  items:
  - prompt: A jug holds 1 L. How many 200 mL glasses can it fill?
    answer: '5'
    check: 1000/200
    difficulty: 1
    hints:
    - 1 L = 1000 mL.
    - 1000 ÷ 200.
    solution: 1000 ÷ 200 = 5 glasses.
    mistakes: {"4": "m5_unit_convert", "50": "m5_unit_convert"}
  - prompt: About how much does a bucket hold?
    options:
    - 10 L
    - 10 mL
    - 100 L
    - 1 mL
    answer: 10 L
    difficulty: 1
    hints:
    - It is much more than a bottle.
    - But less than a tank.
    solution: A bucket holds about 10 litres.
    mistakes: {"10 mL": "m5_bucket"}
  - prompt: A water bottle holds 750 mL. How many mL do 4 bottles hold?
    answer: '3000'
    check: 750*4
    difficulty: 1
    hints:
    - 750 × 4.
    - That is 3 litres.
    solution: 750 × 4 = 3,000 mL.
    mistakes: {"2800": "m5_times_carry", "754": "m5_times_carry"}
  - prompt: A tank has 50 L. A family uses 18 L. How many litres are left?
    answer: '32'
    check: 50-18
    difficulty: 1
    hints:
    - 50 − 18.
    - Take away.
    solution: 50 − 18 = 32 L.
    mistakes: {"42": "m5_subtract_borrow", "68": "m5_subtract_borrow"}
  - prompt: Which holds the least?
    options:
    - a spoon
    - a cup
    - a bottle
    - a bucket
    answer: a spoon
    difficulty: 1
    hints:
    - Which is smallest?
    - About 5 mL.
    solution: A spoon holds about 5 mL, the least.
    mistakes: {"a cup": "m5_least"}
  - prompt: A 2 L bottle fills glasses of 250 mL. How many glasses?
    answer: '8'
    check: 2000/250
    difficulty: 2
    hints:
    - 2 L = 2000 mL.
    - 2000 ÷ 250.
    solution: 2,000 ÷ 250 = 8 glasses.
    mistakes: {"4": "m5_unit_convert", "6": "m5_unit_convert"}
  - prompt: About how much does a teaspoon hold?
    options:
    - 5 mL
    - 500 mL
    - 5 L
    answer: 5 mL
    difficulty: 1
    hints:
    - A spoon holds very little.
    - Pick the smallest amount.
    solution: 'Step 1: a spoon is tiny. Step 2: about 5 mL.'
    mistakes:
      500 mL: c5m8_unit
      5 L: c5m8_unit
  - prompt: How many 100 mL cups fill a 1 L bottle?
    answer: '10'
    check: 1000//100
    difficulty: 1
    hints:
    - 1 L = 1,000 mL.
    - 1,000 ÷ 100.
    solution: 'Step 1: 1,000 ÷ 100. Step 2: = 10 cups.'
    mistakes:
      '100': c5m8_fit
      '1': c5m8_fit
  - prompt: A tank holds 500 L. It has 275 L. How many more litres will fill it?
    answer: '225'
    check: 500-275
    difficulty: 2
    hints:
    - Find what is missing.
    - 500 − 275.
    solution: 'Step 1: 500 − 275. Step 2: = 225 L.'
    mistakes:
      '775': c5m8_same
      '335': c5m8_same
  - prompt: A bottle holds 600 mL. How many mL do 5 bottles hold?
    answer: '3000'
    check: 600*5
    difficulty: 2
    hints:
    - Same amount in each.
    - 6 × 5 = 30, then two zeros.
    solution: 'Step 1: 600 × 5. Step 2: = 3,000 mL (3 L).'
    mistakes:
      '605': c5m8_fit
      '300': c5m8_fit
  - prompt: How many 500 mL bottles can be filled from 4 L?
    answer: '8'
    check: 4000//500
    difficulty: 2
    hints:
    - Each litre fills 2 bottles of 500 mL.
    - 4 × 2.
    solution: 'Step 1: 4 L = 4,000 mL. Step 2: 4,000 ÷ 500 = 8.'
    mistakes:
      '2': c5m8_fit
      '4': c5m8_fit
  - prompt: Which holds the most?
    options:
    - A bathtub
    - A bucket
    - A jug
    answer: A bathtub
    difficulty: 1
    hints:
    - Think which is the biggest container.
    - You can sit inside it.
    solution: 'Step 1: compare sizes. Step 2: a bathtub is biggest.'
    mistakes:
      A bucket: c5m8_unit
      A jug: c5m8_unit
  - prompt: Add 1 L 400 mL and 750 mL. How many mL in all?
    answer: '2150'
    check: 1400+750
    difficulty: 2
    hints:
    - Change 1 L 400 mL to mL.
    - 1,400 + 750.
    solution: 'Step 1: 1,400 + 750. Step 2: = 2,150 mL.'
    mistakes:
      '1150': c5m8_same
      '2050': c5m8_same
  - prompt: A family uses 15 L of water for cooking each day. How much in 4 days, in litres?
    answer: '60'
    check: 15*4
    difficulty: 2
    hints:
    - Same each day.
    - 15 × 4.
    solution: 'Step 1: 15 × 4. Step 2: = 60 L.'
    mistakes:
      '19': c5m8_fit
      '45': c5m8_fit
  - prompt: A 1 L jug fills 4 glasses exactly. How many mL does each glass hold?
    answer: '250'
    check: 1000//4
    difficulty: 3
    hints:
    - 1 L = 1,000 mL.
    - Share 1,000 into 4 equal parts.
    solution: 'Step 1: 1,000 ÷ 4. Step 2: = 250 mL.'
    mistakes:
      '400': c5m8_fit
      '4000': c5m8_fit
  - prompt: 'Case: A school has a 40 L water cooler. Each child fills a 500 mL bottle once. How many children can fill a bottle from a full cooler?'
    options:
    - '80'
    - '20'
    - '8'
    answer: '80'
    hints:
    - Change 40 L to mL.
    - Divide by the size of one bottle.
    solution: 40 L = 40,000 mL. 40,000 ÷ 500 = 80 bottles, so 80 children.
    mistakes:
      '20': c5m8_fit
      '8': c5m8_fit
    exam: case
    difficulty: 2
  - prompt: 'Situation: To measure out 2 mL of medicine, which is the best thing to use?'
    options:
    - A medicine dropper or small spoon marked in mL
    - A bucket
    - A 1 L bottle
    answer: A medicine dropper or small spoon marked in mL
    hints:
    - Is 2 mL a big amount or a tiny one?
    - Which container is marked for tiny amounts?
    solution: 2 mL is a tiny amount, less than half a teaspoon. Only a dropper or a small spoon marked in mL can measure it.
    mistakes:
      A bucket: c5m8_unit
      A 1 L bottle: c5m8_unit
    exam: competency
    difficulty: 2
