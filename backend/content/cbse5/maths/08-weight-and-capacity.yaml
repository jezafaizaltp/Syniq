# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 8
title: Weight and Capacity
tips:
  c5_grams: 1 kg = 1000 g. Half a kilogram is 500 g. Change everything to grams before adding or comparing.
concepts:
- code: cbse5m.wt.weight
  title: Kilograms and grams
  notes: |
    Weight in kilograms (kg) and grams (g): 1 kg = 1000 g; 1/2 kg = 500 g; 1/4 kg = 250 g. Light things in g (an
    eraser), heavy in kg (a bag of rice). Add and subtract in grams. A balance compares weights.
  explanations:
    text: Heavy things are weighed in kilograms and light things in grams. 1 kilogram is 1000 grams. A packet of salt is 1 kg; a pencil weighs only a few grams.
    visual: Draw a balance with a 1 kg rice bag on one side and two 500 g sugar packets on the other. The balance is level.
    step_by_step: 'Step 1: Change all weights to grams. Step 2: Add or subtract. Step 3: Change back to kg and g if needed.'
    real_world: Buying vegetables by the kg at the market, or weighing a baby at the clinic.
  picture:
    kind: bars
    bars:
    - label: 1/4 kg
      value: 250
    - label: 1/2 kg
      value: 500
    - label: 3/4 kg
      value: 750
    - label: 1 kg
      value: 1000
    alt: A quarter kilogram is 250 grams, half 500, three quarters 750, and one kilogram 1000.
    unit: g
  items:
  - prompt: How many grams are in 2 kg?
    answer: '2000'
    check: 2*1000
    difficulty: 1
    hints:
    - 1 kg = 1000 g.
    - 2 × 1000.
    solution: 2 kg = 2,000 g.
    mistakes:
      '200': c5_grams
  - prompt: How many grams are in 1/4 kg?
    answer: '250'
    check: 1000/4
    difficulty: 1
    hints:
    - 1000 ÷ 4.
    - A quarter of 1000.
    solution: 1000 ÷ 4 = 250 g.
  - prompt: Which should be weighed in grams?
    options:
    - an eraser
    - a bag of rice
    - a child
    - a sack of potatoes
    answer: an eraser
    difficulty: 1
    hints:
    - Grams are for light things.
    - Which is lightest?
    solution: An eraser is light, so grams.
  - prompt: Amma buys 1 kg 500 g of onions and 750 g of tomatoes. How many grams in all?
    answer: '2250'
    check: 1500+750
    difficulty: 2
    hints:
    - 1 kg 500 g = 1500 g.
    - 1500 + 750.
    solution: 1,500 + 750 = 2,250 g = 2 kg 250 g.
    mistakes:
      '1250': c5_grams
  - prompt: A bag holds 5 kg of rice. 1 kg 200 g is used. How many grams are left?
    answer: '3800'
    check: 5000-1200
    difficulty: 2
    hints:
    - 5 kg = 5000 g.
    - 5000 − 1200.
    solution: 5,000 − 1,200 = 3,800 g.
  - prompt: How many 250 g packets make 1 kg?
    answer: '4'
    check: 1000/250
    difficulty: 1
    hints:
    - 1000 ÷ 250.
    - 250 + 250 + 250 + 250.
    solution: 1000 ÷ 250 = 4 packets.
- code: cbse5m.wt.capacity
  title: How much a container holds
  after:
  - cbse5m.wt.weight
  notes: |
    Capacity is how much a container holds, in litres and millilitres. A bucket ≈ 10 L, a glass ≈ 200 mL, a spoon ≈
    5 mL. How many glasses fill a jug: 1 L ÷ 200 mL = 5. Estimate and compare containers.
  explanations:
    text: Capacity tells how much liquid fits inside. A bucket holds about 10 litres; a glass about 200 millilitres. To find how many glasses a jug fills, divide the jug's amount by one glass.
    visual: Draw a 1 litre jug and five glasses of 200 mL in a row. 200 + 200 + 200 + 200 + 200 = 1000 mL.
    step_by_step: 'Step 1: Put both amounts in mL. Step 2: Divide the big amount by the small one. Step 3: That is how many times it fills.'
    real_world: Filling water bottles before school, or knowing how much water a family uses in a day.
  picture:
    kind: flow
    steps:
    - 1 L jug = 1000 mL
    - 1 glass = 200 mL
    - 1000 ÷ 200 = 5
    - 5 glasses
    alt: A 1 litre jug of 1000 millilitres fills 5 glasses of 200 millilitres.
  items:
  - prompt: A jug holds 1 L. How many 200 mL glasses can it fill?
    answer: '5'
    check: 1000/200
    difficulty: 1
    hints:
    - 1 L = 1000 mL.
    - 1000 ÷ 200.
    solution: 1000 ÷ 200 = 5 glasses.
  - prompt: About how much does a bucket hold?
    options:
    - 10 L
    - 10 mL
    - 100 L
    - 1 mL
    answer: 10 L
    difficulty: 1
    hints:
    - It is much more than a bottle.
    - But less than a tank.
    solution: A bucket holds about 10 litres.
  - prompt: A water bottle holds 750 mL. How many mL do 4 bottles hold?
    answer: '3000'
    check: 750*4
    difficulty: 1
    hints:
    - 750 × 4.
    - That is 3 litres.
    solution: 750 × 4 = 3,000 mL.
  - prompt: A tank has 50 L. A family uses 18 L. How many litres are left?
    answer: '32'
    check: 50-18
    difficulty: 1
    hints:
    - 50 − 18.
    - Take away.
    solution: 50 − 18 = 32 L.
  - prompt: Which holds the least?
    options:
    - a spoon
    - a cup
    - a bottle
    - a bucket
    answer: a spoon
    difficulty: 1
    hints:
    - Which is smallest?
    - About 5 mL.
    solution: A spoon holds about 5 mL, the least.
  - prompt: A 2 L bottle fills glasses of 250 mL. How many glasses?
    answer: '8'
    check: 2000/250
    difficulty: 2
    hints:
    - 2 L = 2000 mL.
    - 2000 ÷ 250.
    solution: 2,000 ÷ 250 = 8 glasses.
