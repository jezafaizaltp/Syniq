# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 15. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 15
title: Data Through Pictures
tips:
  c5_key: 'Check the key first: one picture may stand for more than one thing. Multiply the pictures by the key.'
concepts:
- code: cbse5m.data.pictograph
  title: Pictographs and tally marks
  notes: |
    Data are facts collected by counting. Tally marks: groups of five (four lines and one across). A pictograph uses a
    symbol with a key (1 🍎 = 5 apples); 4 symbols = 20. Half a symbol = half the key. Read the most, the least and
    differences.
  explanations:
    text: 'A pictograph shows numbers with pictures. Always look at the key first: if one picture stands for 5 children, then 4 pictures stand for 20 children.'
    visual: 'Draw a pictograph of favourite fruits with key 1 circle = 5 children: Mango 4 circles (20), Banana 2 circles (10), Apple 3 circles (15).'
    step_by_step: 'Step 1: Read the key. Step 2: Count the pictures in the row. Step 3: Multiply by the key. Step 4: Compare rows.'
    real_world: Class surveys of favourite games or how children come to school are shown with pictures and tallies.
  picture:
    kind: bars
    bars:
    - label: Mango
      value: 20
    - label: Banana
      value: 10
    - label: Apple
      value: 15
    - label: Guava
      value: 5
    alt: 'Favourite fruits of a class: mango 20 children, banana 10, apple 15, guava 5. Mango is the most popular.'
    unit: children
  activity:
    type: formula
    prompt: A pictograph. Each picture stands for k children.
    inputs:
    - name: k
      label: Children per picture (key)
      min: 1
      max: 10
      step: 1
      start: 1
    - name: p
      label: Pictures
      min: 0
      max: 40
      step: 1
      start: 0
    outputs:
    - name: tot
      label: Children shown
      expr: k*p
    goals:
    - prompt: 'Key: 1 picture = 5 children. Show 35 children.'
      want:
        k: 5
        tot: 35
      mistakes:
      - when:
          k: 5
          p: 35
        say: 35 pictures would show 175 children. Each picture is 5 children.
    - prompt: 8 pictures show 80 children. What is the key?
      want:
        p: 8
        tot: 80
      mistakes:
      - when:
          p: 8
          k: 1
        say: With 1 child per picture, 8 pictures show only 8 children.
      - when:
          p: 8
          k: 8
        say: 8 × 8 = 64. Each picture must stand for more.
    - prompt: 'Key: 1 picture = 2 children. Show 18 children.'
      want:
        k: 2
        tot: 18
      mistakes:
      - when:
          k: 2
          p: 18
        say: 18 pictures show 36 children. Each picture is 2.
  items:
  - prompt: In a pictograph 1 picture = 5 children. Mango has 4 pictures. How many children chose mango?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - 4 × 5.
    - Use the key.
    solution: 4 × 5 = 20 children.
    mistakes:
      '4': c5_key
  - prompt: 'How many does this tally show: four lines crossed by one, and then three lines?'
    answer: '8'
    check: 5+3
    difficulty: 1
    hints:
    - A crossed group is 5.
    - 5 + 3.
    solution: 5 + 3 = 8.
  - prompt: 1 picture = 10 books. A row has 3 and a half pictures. How many books?
    answer: '35'
    check: 3*10+5
    difficulty: 2
    hints:
    - Half a picture = 5.
    - 30 + 5.
    solution: 3 × 10 + 5 = 35 books.
    mistakes:
      '3': c5_key
  - prompt: Mango 20, Banana 10, Apple 15, Guava 5. Which fruit is the least popular?
    options:
    - Guava
    - Banana
    - Apple
    - Mango
    answer: Guava
    difficulty: 1
    hints:
    - Least = smallest number.
    - '5.'
    solution: Guava has only 5.
  - prompt: Mango 20 and Banana 10. How many more children chose mango?
    answer: '10'
    check: 20-10
    difficulty: 1
    hints:
    - Difference.
    - 20 − 10.
    solution: 20 − 10 = 10 more.
  - prompt: Mango 20, Banana 10, Apple 15, Guava 5. How many children were asked in all?
    answer: '50'
    check: 20+10+15+5
    difficulty: 2
    hints:
    - Add all four.
    - 20 + 10 + 15 + 5.
    solution: 20 + 10 + 15 + 5 = 50.
- code: cbse5m.data.bars
  title: Bar graphs
  after:
  - cbse5m.data.pictograph
  notes: |
    A bar graph shows each group as a bar; the height (read on the scale) is the amount. Scale steps can be 2, 5 or 10.
    The tallest bar is the most. Read the value at the top of each bar against the scale. Ask questions: how many more,
    how many in all.
  explanations:
    text: A bar graph uses bars instead of pictures. The taller the bar, the more there is. Read across from the top of the bar to the numbers on the side to find its value.
    visual: Draw two axes. Along the bottom write Mon, Tue, Wed. Up the side number 0, 5, 10, 15, 20. Draw bars to 10, 15 and 20.
    step_by_step: 'Step 1: Read the scale steps. Step 2: Find the top of each bar. Step 3: Read across to the scale. Step 4: Compare bars.'
    real_world: Weather reports show rainfall in bar graphs; schools show attendance in them.
  picture:
    kind: bars
    bars:
    - label: Mon
      value: 10
    - label: Tue
      value: 15
    - label: Wed
      value: 20
    - label: Thu
      value: 5
    alt: 'Books read in a class library: Monday 10, Tuesday 15, Wednesday 20, Thursday 5.'
    unit: books
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: 'A bar graph of children at the library: Monday 12, Tuesday 20, Wednesday 8. Mark each answer.'
    goals:
    - prompt: How many children in all three days?
      target: 40
      mistakes:
      - when:
          v: 32
        say: That's Monday and Tuesday only. Add Wednesday too.
      - when:
          v: 20
        say: That's just the tallest bar.
    - prompt: How many more on Tuesday than Wednesday?
      target: 12
      mistakes:
      - when:
          v: 28
        say: 'That adds them. ''How many more'' means take away: 20 − 8.'
      - when:
          v: 8
        say: That's Wednesday's bar.
    - prompt: How many more on Monday than Wednesday?
      target: 4
      mistakes:
      - when:
          v: 20
        say: 'That adds. Take away: 12 − 8.'
      - when:
          v: 12
        say: That's Monday's bar.
  items:
  - prompt: 'Books read: Mon 10, Tue 15, Wed 20, Thu 5. On which day were the most books read?'
    options:
    - Wednesday
    - Monday
    - Tuesday
    - Thursday
    answer: Wednesday
    difficulty: 1
    hints:
    - Tallest bar.
    - Biggest number.
    solution: Wednesday has 20, the most.
  - prompt: 'Books read: Mon 10, Tue 15, Wed 20, Thu 5. How many books in all?'
    answer: '50'
    check: 10+15+20+5
    difficulty: 1
    hints:
    - Add all the bars.
    - 10 + 15 + 20 + 5.
    solution: 10 + 15 + 20 + 5 = 50.
  - prompt: Wed 20 and Thu 5. How many more books on Wednesday?
    answer: '15'
    check: 20-5
    difficulty: 1
    hints:
    - 20 − 5.
    - Difference.
    solution: 20 − 5 = 15 more.
  - prompt: A bar reaches halfway between 10 and 20 on the scale. What is its value?
    options:
    - '15'
    - '10'
    - '20'
    - '12'
    answer: '15'
    difficulty: 2
    hints:
    - Halfway between 10 and 20.
    - 10 + 5.
    solution: Halfway between 10 and 20 is 15.
  - prompt: Which is better for showing rainfall in each month?
    options:
    - a bar graph
    - a single number
    - a tally of one day
    - a map
    answer: a bar graph
    difficulty: 1
    hints:
    - You want to compare months.
    - One bar each.
    solution: A bar graph compares amounts for each month.
  - prompt: Bars show 8, 12 and 10 children. What is the total?
    answer: '30'
    check: 8+12+10
    difficulty: 1
    hints:
    - Add them.
    - 8 + 12 + 10.
    solution: 8 + 12 + 10 = 30.
