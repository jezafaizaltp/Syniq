# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 15. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 15
title: Data Through Pictures
tips:
  c5_key: 'Check the key first: one picture may stand for more than one thing. Multiply the pictures by the key.'
  m5_add_all: "Add every number in the list one at a time, and tick each one so you don't skip any."
  m5_bar_graph: "Rainfall changes month by month. Which choice shows many values side by side?"
  m5_halfway: "Halfway between 10 and 20 is the number in the exact middle."
  m5_least_popular: "Least popular means the smallest number of votes."
  m5_most: "Most means the biggest number. Compare all four days."
  m5_subtract_not_add: "The question asks for the difference. Take the smaller number from the bigger one."
  m5_tally: "A crossed bundle is 5, not 4. Then add the single lines."
  c5m15_key: 'Check the key first: each picture stands for more than one. Multiply the pictures by the key.'
  c5m15_half: Half a picture is half of what the key says.
  c5m15_tally: Each crossed bundle of tally marks is 5. Count the bundles in fives, then add the loose marks.
  c5m15_most: Most means the biggest number (tallest bar); least means the smallest.
  c5m15_diff: '''How many more'' asks for the difference: take the smaller from the bigger.'
  c5m15_total: '''In all'' means add every group together.'
  c5m15_scale: Read across from the top of the bar to the scale. If it is between two marks, find the middle.
concepts:
- code: cbse5m.data.pictograph
  title: Pictographs and tally marks
  notes: |
    Data are facts collected by counting. Tally marks: groups of five (four lines and one across). A pictograph uses a
    symbol with a key (1 🍎 = 5 apples); 4 symbols = 20. Half a symbol = half the key. Read the most, the least and
    differences.
  explanations:
    text: 'A pictograph shows numbers with pictures. Always look at the key first: if one picture stands for 5 children, then 4 pictures stand for 20 children.'
    visual: 'Draw a pictograph of favourite fruits with key 1 circle = 5 children: Mango 4 circles (20), Banana 2 circles (10), Apple 3 circles (15).'
    step_by_step: 'Step 1: Read the key. Step 2: Count the pictures in the row. Step 3: Multiply by the key. Step 4: Compare rows.'
    real_world: Class surveys of favourite games or how children come to school are shown with pictures and tallies.
  picture:
    kind: bars
    bars:
    - label: Mango
      value: 20
    - label: Banana
      value: 10
    - label: Apple
      value: 15
    - label: Guava
      value: 5
    alt: 'Favourite fruits of a class: mango 20 children, banana 10, apple 15, guava 5. Mango is the most popular.'
    unit: children
  activity:
    type: formula
    prompt: A pictograph. Each picture stands for k children.
    inputs:
    - name: k
      label: Children per picture (key)
      min: 1
      max: 10
      step: 1
      start: 1
    - name: p
      label: Pictures
      min: 0
      max: 40
      step: 1
      start: 0
    outputs:
    - name: tot
      label: Children shown
      expr: k*p
    goals:
    - prompt: 'Key: 1 picture = 5 children. Show 35 children.'
      want:
        k: 5
        tot: 35
      mistakes:
      - when:
          k: 5
          p: 35
        say: 35 pictures would show 175 children. Each picture is 5 children.
    - prompt: 8 pictures show 80 children. What is the key?
      want:
        p: 8
        tot: 80
      mistakes:
      - when:
          p: 8
          k: 1
        say: With 1 child per picture, 8 pictures show only 8 children.
      - when:
          p: 8
          k: 8
        say: 8 × 8 = 64. Each picture must stand for more.
    - prompt: 'Key: 1 picture = 2 children. Show 18 children.'
      want:
        k: 2
        tot: 18
      mistakes:
      - when:
          k: 2
          p: 18
        say: 18 pictures show 36 children. Each picture is 2.
  lesson:
    - teach: 'Data are facts we collect by counting, like how many children like each fruit. Tally marks help us count: four lines and one across make a bundle of 5.'
      check:
        prompt: 'Two crossed bundles and 2 loose marks show:'
        options:
        - '12'
        - '7'
        - '22'
        answer: '12'
        why: 5 + 5 + 2 = 12.
      ways:
      - style: visual
        teach: Tally marks for favourite games, counted in bundles of five.
        picture:
          kind: compare
          columns:
          - title: Kho-kho
            points:
            - 2 bundles + 1
            - = 11
          - title: Kabaddi
            points:
            - 1 bundle + 3
            - = 8
          - title: Cricket
            points:
            - 3 bundles
            - = 15
          alt: Kho-kho has 2 bundles of five and 1 more, 11. Kabaddi has 1 bundle and 3 more, 8. Cricket has 3 bundles, 15.
      - style: step_by_step
        teach: 'Collect data. Step 1: Ask each classmate one question, like ''Which pet do you like?''. Step 2: Make a tally mark for each answer. Step 3: Cross every fourth mark with the fifth to make a bundle. Step 4: Count the bundles in fives and add the loose marks.'
    - teach: A pictograph uses pictures. The key tells what one picture stands for. If 1 🍎 = 5 apples, then 4 pictures = 4 × 5 = 20. Half a picture stands for half the key, so half an apple picture means 5 ÷ 2 = 2 and a half apples.
      picture:
        kind: bars
        unit: children
        bars:
        - label: Mango
          value: 20
        - label: Apple
          value: 15
        - label: Banana
          value: 10
        - label: Guava
          value: 5
        alt: 'Favourite fruits: mango 20, apple 15, banana 10, guava 5.'
      check:
        prompt: 'Key: 1 picture = 10 children. A row has 3 pictures. How many children?'
        options:
        - '30'
        - '13'
        - '3'
        answer: '30'
        why: 3 × 10 = 30.
      ways:
      - style: step_by_step
        teach: 'Read a pictograph with key 1 ☆ = 6 children. Step 1: Count the pictures in a row: 3 and a half. Step 2: 3 whole pictures = 3 × 6 = 18. Step 3: Half a picture = 6 ÷ 2 = 3. Step 4: Total 18 + 3 = 21 children.'
      - style: real_world
        teach: A school notice board might show how many trees each class planted, with one tree picture for every 10 trees. A class with 5 pictures planted 50, without the board needing 50 drawings.
    - teach: 'Read a pictograph to answer questions: which is most or least, how many more, how many in all. Mango 20 and Banana 10: mango has 10 more. All four fruits: 20 + 15 + 10 + 5 = 50 children.'
      check:
        prompt: Apple 15, Guava 5. How many more chose apple?
        options:
        - '10'
        - '20'
        - '3'
        answer: '10'
        why: 15 − 5 = 10.
      ways:
      - style: visual
        teach: Votes for a school trip, ready to compare and total.
        picture:
          kind: bars
          bars:
          - label: Zoo
            value: 24
          - label: Museum
            value: 16
          - label: Beach
            value: 30
          - label: Park
            value: 10
          alt: 'Votes for a school trip: zoo 24, museum 16, beach 30 and park 10. Beach got the most votes and park the least.'
      - style: step_by_step
        teach: 'Use the trip votes. Step 1: Most: beach, 30. Least: park, 10. Step 2: How many more chose the zoo than the museum? 24 − 16 = 8. Step 3: How many voted in all? 24 + 16 + 30 + 10 = 80.'
  items:
  - prompt: In a pictograph 1 picture = 5 children. Mango has 4 pictures. How many children chose mango?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - 4 × 5.
    - Use the key.
    solution: 4 × 5 = 20 children.
    mistakes:
      '4': c5_key
  - prompt: 'How many does this tally show: four lines crossed by one, and then three lines?'
    answer: '8'
    check: 5+3
    difficulty: 1
    hints:
    - A crossed group is 5.
    - 5 + 3.
    solution: 5 + 3 = 8.
    mistakes: {"7": "m5_tally", "9": "m5_tally"}
  - prompt: 1 picture = 10 books. A row has 3 and a half pictures. How many books?
    answer: '35'
    check: 3*10+5
    difficulty: 2
    hints:
    - Half a picture = 5.
    - 30 + 5.
    solution: 3 × 10 + 5 = 35 books.
    mistakes:
      '3': c5_key
  - prompt: Mango 20, Banana 10, Apple 15, Guava 5. Which fruit is the least popular?
    options:
    - Guava
    - Banana
    - Apple
    - Mango
    answer: Guava
    difficulty: 1
    hints:
    - Least = smallest number.
    - '5.'
    solution: Guava has only 5.
    mistakes: {"Banana": "m5_least_popular"}
  - prompt: Mango 20 and Banana 10. How many more children chose mango?
    answer: '10'
    check: 20-10
    difficulty: 1
    hints:
    - Difference.
    - 20 − 10.
    solution: 20 − 10 = 10 more.
    mistakes: {"30": "m5_subtract_not_add", "2": "m5_subtract_not_add"}
  - prompt: Mango 20, Banana 10, Apple 15, Guava 5. How many children were asked in all?
    answer: '50'
    check: 20+10+15+5
    difficulty: 2
    hints:
    - Add all four.
    - 20 + 10 + 15 + 5.
    solution: 20 + 10 + 15 + 5 = 50.
    mistakes: {"40": "m5_add_all", "45": "m5_add_all"}
  - prompt: 'Key: 1 picture = 4 children. Cricket has 6 pictures. How many children chose cricket?'
    answer: '24'
    check: 6*4
    difficulty: 1
    hints:
    - Pictures × key.
    - 6 × 4.
    solution: 'Step 1: 6 × 4. Step 2: = 24 children.'
    mistakes:
      '6': c5m15_key
      '10': c5m15_key
  - prompt: 'How many does this tally show: three crossed bundles and 4 loose marks?'
    answer: '19'
    check: 3*5+4
    difficulty: 1
    hints:
    - Each bundle is 5.
    - 15 + 4.
    solution: 'Step 1: 3 × 5 = 15. Step 2: 15 + 4 = 19.'
    mistakes:
      '7': c5m15_tally
      '16': c5m15_tally
  - prompt: 'Key: 1 picture = 10 mangoes. A row has 4 and a half pictures. How many mangoes?'
    answer: '45'
    check: 4*10+5
    difficulty: 2
    hints:
    - 4 pictures = 40.
    - Half a picture is half of 10.
    solution: 'Step 1: 4 × 10 = 40. Step 2: + 5 = 45.'
    mistakes:
      '40': c5m15_half
      '50': c5m15_half
  - prompt: Red 12, Blue 18, Green 9, Yellow 15. Which colour is most popular?
    options:
    - Blue
    - Yellow
    - Red
    answer: Blue
    difficulty: 1
    hints:
    - Most popular has the biggest number.
    - Compare 12, 18, 9, 15.
    solution: 'Step 1: biggest is 18. Step 2: that is Blue.'
    mistakes:
      Yellow: c5m15_most
      Red: c5m15_most
  - prompt: Red 12, Blue 18, Green 9, Yellow 15. How many children in all?
    answer: '54'
    check: 12+18+9+15
    difficulty: 2
    hints:
    - Add all four.
    - 12 + 18 = 30 first.
    solution: 'Step 1: 12 + 18 = 30, 9 + 15 = 24. Step 2: 30 + 24 = 54.'
    mistakes:
      '44': c5m15_total
      '18': c5m15_most
  - prompt: Blue 18 and Green 9. How many more chose blue?
    answer: '9'
    check: 18-9
    difficulty: 1
    hints:
    - Find the difference.
    - 18 − 9.
    solution: 'Step 1: 18 − 9. Step 2: = 9.'
    mistakes:
      '27': c5m15_diff
      '18': c5m15_diff
  - prompt: 'Key: 1 picture = 5 books. Riya read 35 books. How many pictures show her books?'
    answer: '7'
    check: 35//5
    difficulty: 2
    hints:
    - Each picture is 5 books.
    - 35 ÷ 5.
    solution: 'Step 1: 35 ÷ 5. Step 2: = 7 pictures.'
    mistakes:
      '35': c5m15_key
      '175': c5m15_key
  - prompt: 'Key: 1 picture = 2 cars. Monday has 7 pictures, Tuesday 4. How many more cars on Monday?'
    answer: '6'
    check: (7-4)*2
    difficulty: 3
    hints:
    - Find the difference in pictures.
    - Then multiply by the key.
    solution: 'Step 1: 7 − 4 = 3 pictures. Step 2: 3 × 2 = 6 cars.'
    mistakes:
      '3': c5m15_key
      '22': c5m15_diff
  - prompt: Why do we use a key like 1 picture = 10 in a pictograph?
    options:
    - So big numbers need fewer pictures
    - To make it colourful
    - Because pictures cost money
    answer: So big numbers need fewer pictures
    difficulty: 3
    hints:
    - Imagine drawing 100 apples one by one.
    - The key saves drawing.
    solution: 'Step 1: drawing each item takes too long. Step 2: one picture for 10 saves space.'
    mistakes:
      To make it colourful: c5m15_key
      Because pictures cost money: c5m15_key
  - prompt: 'Case: A pictograph shows bicycles sold in a shop. Key: 1 picture = 4 bicycles. Monday has 5 pictures and Tuesday has 3 and a half pictures. How many bicycles were sold on the two days together?'
    options:
    - '34'
    - '8'
    - '32'
    answer: '34'
    hints:
    - Work out each day using the key.
    - Half a picture is half of the key.
    solution: 'Monday: 5 × 4 = 20. Tuesday: 3 × 4 = 12, plus half of 4 = 2, so 14. Together 20 + 14 = 34.'
    mistakes:
      '8': c5m15_key
      '32': c5m15_half
    exam: case
    difficulty: 2
  - prompt: 'Situation: A class is making a pictograph of 40 books read. If each picture stands for 5 books, how many pictures are needed?'
    options:
    - '8'
    - '40'
    - '200'
    answer: '8'
    hints:
    - Each picture stands for 5 books.
    - How many 5s make 40?
    solution: 40 ÷ 5 = 8 pictures.
    mistakes:
      '40': c5m15_key
      '200': c5m15_key
    exam: competency
    difficulty: 2
- code: cbse5m.data.bars
  title: Bar graphs
  after:
  - cbse5m.data.pictograph
  notes: |
    A bar graph shows each group as a bar; the height (read on the scale) is the amount. Scale steps can be 2, 5 or 10.
    The tallest bar is the most. Read the value at the top of each bar against the scale. Ask questions: how many more,
    how many in all.
  explanations:
    text: A bar graph uses bars instead of pictures. The taller the bar, the more there is. Read across from the top of the bar to the numbers on the side to find its value.
    visual: Draw two axes. Along the bottom write Mon, Tue, Wed. Up the side number 0, 5, 10, 15, 20. Draw bars to 10, 15 and 20.
    step_by_step: 'Step 1: Read the scale steps. Step 2: Find the top of each bar. Step 3: Read across to the scale. Step 4: Compare bars.'
    real_world: Weather reports show rainfall in bar graphs; schools show attendance in them.
  picture:
    kind: bars
    bars:
    - label: Mon
      value: 10
    - label: Tue
      value: 15
    - label: Wed
      value: 20
    - label: Thu
      value: 5
    alt: 'Books read in a class library: Monday 10, Tuesday 15, Wednesday 20, Thursday 5.'
    unit: books
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: 'A bar graph of children at the library: Monday 12, Tuesday 20, Wednesday 8. Mark each answer.'
    goals:
    - prompt: How many children in all three days?
      target: 40
      mistakes:
      - when:
          v: 32
        say: That's Monday and Tuesday only. Add Wednesday too.
      - when:
          v: 20
        say: That's just the tallest bar.
    - prompt: How many more on Tuesday than Wednesday?
      target: 12
      mistakes:
      - when:
          v: 28
        say: 'That adds them. ''How many more'' means take away: 20 − 8.'
      - when:
          v: 8
        say: That's Wednesday's bar.
    - prompt: How many more on Monday than Wednesday?
      target: 4
      mistakes:
      - when:
          v: 20
        say: 'That adds. Take away: 12 − 8.'
      - when:
          v: 12
        say: That's Monday's bar.
  lesson:
    - teach: A bar graph shows each group as a bar. The taller the bar, the more there are. Read the number by looking across from the top of the bar to the scale on the side.
      check:
        prompt: 'In a bar graph, the most popular group has:'
        options:
        - The tallest bar
        - The shortest bar
        - The widest gap
        answer: The tallest bar
        why: Height shows the amount.
      ways:
      - style: step_by_step
        teach: 'Read a bar. Step 1: Find the top of the bar. Step 2: Put a ruler flat across from the top to the scale. Step 3: Read the number on the scale. Step 4: If it is between two marks, work out the middle value.'
      - style: visual
        teach: Rainy days in three months, read from the tops of the bars.
        picture:
          kind: bars
          bars:
          - label: June
            value: 18
          - label: July
            value: 24
          - label: August
            value: 20
          alt: 'A bar graph of rainy days: June 18, July 24 and August 20. July has the tallest bar, so it had the most rainy days.'
    - teach: The scale may go up in 2s, 5s or 10s. If a bar ends halfway between 10 and 20, its value is 15. Always check what each mark on the scale means.
      picture:
        kind: number_line
        from: 0
        to: 20
        step: 5
        points:
        - at: 15
          label: bar top
        alt: A scale going up in fives with a bar ending at 15.
      check:
        prompt: 'A scale goes up in 2s. A bar ends halfway between 6 and 8. Its value is:'
        options:
        - '7'
        - '6'
        - '8'
        answer: '7'
        why: Halfway between 6 and 8 is 7.
      ways:
      - style: visual
        teach: Bars on a scale that goes up in 2s, read carefully.
        picture:
          kind: bars
          bars:
          - label: Class A
            value: 6
          - label: Class B
            value: 9
          - label: Class C
            value: 12
          alt: On a scale going up in 2s, Class A's bar reaches 6, Class B's bar stops halfway between 8 and 10 at 9, and Class C's bar reaches 12.
      - style: step_by_step
        teach: 'Check the scale first. Step 1: Read two marks next to each other, like 0 and 2. Step 2: The gap between marks is 2. Step 3: A bar at the 4th mark is 4 × 2 = 8. Step 4: A bar halfway between the 4th and 5th marks is halfway between 8 and 10, which is 9.'
    - teach: 'Use a bar graph to compare and calculate: how many more, how many in all. Bar graphs are good for things counted over days or months, like rainfall or books read.'
      check:
        prompt: Bars show 12 and 20. How many more is the taller bar?
        options:
        - '8'
        - '32'
        - '12'
        answer: '8'
        why: 20 − 12 = 8.
      ways:
      - style: visual
        teach: Kilograms of waste a school recycled in four months.
        picture:
          kind: bars
          unit: ' kg'
          bars:
          - label: Jan
            value: 35
          - label: Feb
            value: 20
          - label: Mar
            value: 40
          - label: Apr
            value: 25
          alt: 'Waste recycled: January 35 kg, February 20 kg, March 40 kg, April 25 kg. March was the most and February the least.'
      - style: step_by_step
        teach: 'Use the recycling bars. Step 1: Most: March, 40 kg. Step 2: How much more in March than February? 40 − 20 = 20 kg. Step 3: Total for four months: 35 + 20 + 40 + 25 = 120 kg.'
  items:
  - prompt: 'Books read: Mon 10, Tue 15, Wed 20, Thu 5. On which day were the most books read?'
    options:
    - Wednesday
    - Monday
    - Tuesday
    - Thursday
    answer: Wednesday
    difficulty: 1
    hints:
    - Tallest bar.
    - Biggest number.
    solution: Wednesday has 20, the most.
    mistakes: {"Tuesday": "m5_most"}
  - prompt: 'Books read: Mon 10, Tue 15, Wed 20, Thu 5. How many books in all?'
    answer: '50'
    check: 10+15+20+5
    difficulty: 1
    hints:
    - Add all the bars.
    - 10 + 15 + 20 + 5.
    solution: 10 + 15 + 20 + 5 = 50.
    mistakes: {"45": "m5_add_all", "40": "m5_add_all"}
  - prompt: Wed 20 and Thu 5. How many more books on Wednesday?
    answer: '15'
    check: 20-5
    difficulty: 1
    hints:
    - 20 − 5.
    - Difference.
    solution: 20 − 5 = 15 more.
    mistakes: {"25": "m5_subtract_not_add", "4": "m5_subtract_not_add"}
  - prompt: A bar reaches halfway between 10 and 20 on the scale. What is its value?
    options:
    - '15'
    - '10'
    - '20'
    - '12'
    answer: '15'
    difficulty: 2
    hints:
    - Halfway between 10 and 20.
    - 10 + 5.
    solution: Halfway between 10 and 20 is 15.
    mistakes: {"12": "m5_halfway"}
  - prompt: Which is better for showing rainfall in each month?
    options:
    - a bar graph
    - a single number
    - a tally of one day
    - a map
    answer: a bar graph
    difficulty: 1
    hints:
    - You want to compare months.
    - One bar each.
    solution: A bar graph compares amounts for each month.
    mistakes: {"a single number": "m5_bar_graph"}
  - prompt: Bars show 8, 12 and 10 children. What is the total?
    answer: '30'
    check: 8+12+10
    difficulty: 1
    hints:
    - Add them.
    - 8 + 12 + 10.
    solution: 8 + 12 + 10 = 30.
    mistakes: {"20": "m5_add_all", "28": "m5_add_all"}
  - prompt: 'Rainfall: June 30 cm, July 45 cm, Aug 25 cm. Which month had the most rain?'
    options:
    - July
    - June
    - August
    answer: July
    difficulty: 1
    hints:
    - Find the biggest number.
    - Compare 30, 45, 25.
    solution: 'Step 1: 45 is biggest. Step 2: July.'
    mistakes:
      June: c5m15_most
      August: c5m15_most
  - prompt: 'Rainfall: June 30 cm, July 45 cm, Aug 25 cm. How many cm in all three months?'
    answer: '100'
    check: 30+45+25
    difficulty: 2
    hints:
    - Add all three.
    - 45 + 25 = 70 first.
    solution: 'Step 1: 45 + 25 = 70. Step 2: 70 + 30 = 100 cm.'
    mistakes:
      '75': c5m15_total
      '90': c5m15_total
  - prompt: July 45 cm and August 25 cm. How much more rain in July, in cm?
    answer: '20'
    check: 45-25
    difficulty: 1
    hints:
    - How many more means subtract.
    - 45 − 25.
    solution: 'Step 1: 45 − 25. Step 2: = 20 cm.'
    mistakes:
      '70': c5m15_diff
      '25': c5m15_diff
  - prompt: A scale goes up in 10s. A bar ends halfway between 40 and 50. What is its value?
    answer: '45'
    check: '45'
    difficulty: 2
    hints:
    - Halfway between two marks.
    - Between 40 and 50.
    solution: 'Step 1: the middle of 40 and 50. Step 2: = 45.'
    mistakes:
      '40': c5m15_scale
      '50': c5m15_scale
  - prompt: Bars show 14, 9 and 17 children. Which bar is shortest?
    options:
    - '9'
    - '14'
    - '17'
    answer: '9'
    difficulty: 1
    hints:
    - Shortest is the smallest number.
    - Compare 14, 9, 17.
    solution: 'Step 1: smallest is 9. Step 2: that bar is shortest.'
    mistakes:
      '14': c5m15_most
      '17': c5m15_most
  - prompt: Bars show 14, 9 and 17 children. What is the total?
    answer: '40'
    check: 14+9+17
    difficulty: 2
    hints:
    - Add all three bars.
    - 14 + 9 = 23.
    solution: 'Step 1: 14 + 9 = 23. Step 2: 23 + 17 = 40.'
    mistakes:
      '31': c5m15_total
      '30': c5m15_total
  - prompt: Which is best shown on a bar graph?
    options:
    - "Number of books read each day of the week"
    - "The name of one person in the class"
    - "A picture of one tree in the garden"
    answer: Number of books read each day of the week
    difficulty: 2
    hints:
    - Bar graphs show amounts for groups.
    - Which has a number for each group?
    solution: 'Step 1: each day has a count. Step 2: a bar graph shows these counts.'
    mistakes:
      "The name of one person in the class": c5m15_scale
      "A picture of one tree in the garden": c5m15_scale
  - prompt: 'Books read: Mon 8, Tue 12, Wed 6, Thu 10, Fri 14. On how many days were more than 9 books read?'
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - Check each day against 9.
    - Count the days above 9.
    solution: 'Step 1: Tue 12, Thu 10, Fri 14 are more than 9. Step 2: 3 days.'
    mistakes:
      '2': c5m15_most
      '4': c5m15_most
  - prompt: A scale goes up in 5s. A bar reaches the 6th mark above 0. What is its value?
