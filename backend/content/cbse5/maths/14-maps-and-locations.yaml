# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 14. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 14
title: Maps and Locations
tips:
  c5_directions: 'Never Eat Soggy Wheat: going clockwise from the top, North, East, South, West.'
  c5_scale: Multiply the map distance by what 1 cm stands for to get the real distance.
  m5_back_start: "Going 4 one way and 4 the opposite way brings you back. Where are you?"
  m5_grid_name: "Grid boxes are named letter first, then number."
  m5_north_top: "Map makers put one direction at the top almost always, often with an arrow marked N."
  m5_route: "Add Route A first: 3 + 4. Then compare with 6."
  m5_scale: "Each cm on the map stands for 1 km on the ground. Multiply the map distance by 1 km."
  m5_scale_divide: "Each cm stands for 10 km. How many 10s make 80?"
  m5_sunrise: "The Sun sets in the west. Morning sunlight comes from the opposite side."
concepts:
- code: cbse5m.map.direction
  title: Directions and grid positions
  notes: |
    Four main directions: North (up on most maps), East (right), South (down), West (left). Grids locate places: a box is
    named by its column and row (B3). Giving directions: '3 blocks North, then 2 East'. Opposite of North is South;
    of East is West.
  explanations:
    text: 'Maps usually show North at the top. Then East is to the right, South at the bottom and West to the left. A grid with letters and numbers lets you name any box, like B3: column B, row 3.'
    visual: 'Draw a 4 × 4 grid with letters A to D across the top and 1 to 4 down the side. Draw a school in column C, row 2: the school is at C2.'
    step_by_step: 'Step 1: Find North on the map. Step 2: Read the column letter. Step 3: Read the row number. Step 4: For a route, follow each step in order.'
    real_world: Reading a map of your town, or telling a friend how to reach your house.
  picture:
    kind: flow
    steps:
    - Start at the gate
    - 3 blocks North
    - 'Turn: 2 blocks East'
    - Reach the library
    alt: 'A route: from the gate go 3 blocks North, then 2 blocks East, to reach the library.'
  activity:
    type: sort
    prompt: Which direction is it? North is at the top of the map.
    bins:
    - North
    - South
    - East
    - West
    items:
    - label: The top of the map
      bin: North
      clue: Maps put this direction at the top.
      why: North.
    - label: The way the Pole Star shows
      bin: North
      clue: Travellers used this star at night.
      why: North.
    - label: The bottom of the map
      bin: South
      clue: Opposite the top.
      why: South.
    - label: Behind you when you face the Pole Star
      bin: South
      clue: Turn half way round.
      why: South.
    - label: Where the Sun rises
      bin: East
      clue: Morning sunshine comes from here.
      why: East.
    - label: The right side of the map
      bin: East
      clue: With the top pointing up.
      why: East.
    - label: Where the Sun sets
      bin: West
      clue: Evening sunshine comes from here.
      why: West.
    - label: The left side of the map
      bin: West
      clue: With the top pointing up.
      why: West.
  items:
  - prompt: On most maps, which direction is at the top?
    options:
    - North
    - South
    - East
    - West
    answer: North
    difficulty: 1
    hints:
    - It points to the top.
    - The compass N.
    solution: Maps usually put North at the top.
    mistakes: {"South": "m5_north_top"}
  - prompt: What is the opposite of East?
    options:
    - West
    - North
    - South
    - East
    answer: West
    difficulty: 1
    hints:
    - They point in opposite ways.
    - Sun rises in the East and sets in the ...
    solution: West is opposite East.
    mistakes:
      North: c5_directions
  - prompt: Facing North, which way is East?
    options:
    - to your right
    - to your left
    - behind you
    - in front of you
    answer: to your right
    difficulty: 1
    hints:
    - N, E, S, W go clockwise.
    - Clockwise from North.
    solution: 'East is a quarter turn clockwise: to your right.'
    mistakes:
      to your left: c5_directions
  - prompt: On a grid, which box is in column C and row 4?
    options:
    - C4
    - 4C
    - D3
    - C3
    answer: C4
    difficulty: 1
    hints:
    - Letter first, then number.
    - Column C, row 4.
    solution: The box is named C4.
    mistakes: {"4C": "m5_grid_name"}
  - prompt: You walk 4 blocks North then 4 blocks South. How many blocks are you from the start?
    answer: '0'
    check: 4-4
    difficulty: 2
    hints:
    - South undoes North.
    - 4 − 4.
    solution: 'You come back to where you started: 0 blocks.'
    mistakes: {"8": "m5_back_start", "4": "m5_back_start"}
  - prompt: 'The Sun rises in the:'
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - Morning sun.
    - Opposite of where it sets.
    solution: The Sun rises in the East.
    mistakes: {"West": "m5_sunrise"}
- code: cbse5m.map.scale
  title: Map scale and distances
  after:
  - cbse5m.map.direction
  notes: |
    A map scale shows real distance: 1 cm on the map = 1 km. A map distance of 6 cm = 6 km. With 1 cm = 50 m, 4 cm =
    200 m. Measure the map with a ruler, then multiply by the scale. Shortest route: compare totals.
  explanations:
    text: 'Maps shrink real places to fit on paper. The scale tells how much: if 1 cm stands for 1 km, a road 6 cm long on the map is really 6 km.'
    visual: 'Draw a scale bar 1 cm long labelled 1 km. Next to it draw a road of 6 cm. Count the 1 cm pieces: 6, so 6 km.'
    step_by_step: 'Step 1: Read the scale (1 cm = ?). Step 2: Measure the map distance in cm. Step 3: Multiply.'
    real_world: Road atlases and Google Maps both use scales so you can tell how far places are.
  picture:
    kind: bars
    bars:
    - label: Map (cm)
      value: 6
    - label: Real (km)
      value: 6
    alt: With a scale of 1 centimetre to 1 kilometre, 6 centimetres on the map is 6 kilometres in real life.
  activity:
    type: formula
    prompt: On a map, each cm stands for k km in real life.
    inputs:
    - name: cm
      label: Length on the map
      min: 0
      max: 20
      step: 0.5
      start: 0
      unit: cm
    - name: k
      label: km for each cm (k)
      min: 1
      max: 10
      step: 1
      start: 1
    outputs:
    - name: real
      label: Real distance
      expr: cm*k
      unit: km
    goals:
    - prompt: 1 cm stands for 2 km. The real road is 14 km. How long on the map?
      want:
        k: 2
        real: 14
      mistakes:
      - when:
          k: 2
          cm: 14
        say: '14 cm would be 28 km: each cm is 2 km. Halve it.'
    - prompt: 1 cm stands for 5 km. The real road is 25 km.
      want:
        k: 5
        real: 25
      mistakes:
      - when:
          k: 5
          cm: 20
        say: 20 cm would be 100 km. How many 5s make 25?
    - prompt: 4 cm on the map is 20 km. What does 1 cm stand for?
      want:
        cm: 4
        real: 20
      mistakes:
      - when:
          cm: 4
          k:
          - 1
          - 4
        say: 'Too small: 4 cm must reach 20 km. 20 ÷ 4.'
      - when:
          cm: 4
          k:
          - 6
          - 10
        say: 'Too big: 4 cm would go past 20 km.'
  items:
  - prompt: On a map, 1 cm = 1 km. Two towns are 6 cm apart on the map. How many km apart are they really?
    answer: '6'
    check: 6*1
    difficulty: 1
    hints:
    - Each cm is 1 km.
    - 6 × 1.
    solution: 6 cm × 1 km = 6 km.
    mistakes: {"1": "m5_scale", "60": "m5_scale"}
  - prompt: On a map, 1 cm = 50 m. A path is 4 cm long. How many metres is the real path?
    answer: '200'
    check: 4*50
    difficulty: 1
    hints:
    - 4 × 50.
    - Each cm stands for 50 m.
    solution: 4 × 50 = 200 m.
    mistakes:
      '4': c5_scale
  - prompt: On a map, 1 cm = 5 km. A road is 7 cm. How many km is it?
    answer: '35'
    check: 7*5
    difficulty: 1
    hints:
    - 7 × 5.
    - Multiply by the scale.
    solution: 7 × 5 = 35 km.
    mistakes:
      '12': c5_scale
  - prompt: On a map, 1 cm = 10 km. Two cities are 80 km apart. How many cm apart are they on the map?
    answer: '8'
    check: 80/10
    difficulty: 2
    hints:
    - Divide by the scale.
    - 80 ÷ 10.
    solution: 80 ÷ 10 = 8 cm.
    mistakes: {"80": "m5_scale_divide", "800": "m5_scale_divide"}
  - prompt: Route A is 3 km + 4 km. Route B is 6 km. Which is shorter?
    options:
    - Route B
    - Route A
    - they are equal
    - cannot tell
    answer: Route B
    difficulty: 1
    hints:
    - Route A = 7 km.
    - Compare 7 and 6.
    solution: Route A is 7 km, so Route B (6 km) is shorter.
    mistakes: {"Route A": "m5_route"}
  - prompt: On a map, 2 cm = 1 km. A road is 10 cm. How many km is it?
    answer: '5'
    check: 10/2
    difficulty: 2
    hints:
    - Every 2 cm is 1 km.
    - 10 ÷ 2.
    solution: 10 ÷ 2 = 5 km.
    mistakes:
      '20': c5_scale
