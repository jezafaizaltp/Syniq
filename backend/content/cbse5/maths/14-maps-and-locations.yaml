# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 14. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 14
title: Maps and Locations
tips:
  c5_directions: 'Never Eat Soggy Wheat: going clockwise from the top, North, East, South, West.'
  c5_scale: Multiply the map distance by what 1 cm stands for to get the real distance.
  m5_back_start: "Going 4 one way and 4 the opposite way brings you back. Where are you?"
  m5_grid_name: "Grid boxes are named letter first, then number."
  m5_north_top: "Map makers put one direction at the top almost always, often with an arrow marked N."
  m5_route: "Add Route A first: 3 + 4. Then compare with 6."
  m5_scale: "Each cm on the map stands for 1 km on the ground. Multiply the map distance by 1 km."
  m5_scale_divide: "Each cm stands for 10 km. How many 10s make 80?"
  m5_sunrise: "The Sun sets in the west. Morning sunlight comes from the opposite side."
  c5m14_dir: 'Draw a cross and mark the four directions round it, starting with the top of the map. Opposites sit at the two ends of the same line.'
  c5m14_turn: Stand facing the direction given, then turn your body the way the question says.
  c5m14_grid: Read the column letter along the bottom first, then the row number up the side.
  c5m14_net: Steps in opposite directions cancel out. Work out how far North or South and how far East or West you end up.
  c5m14_scale: Map distance × what 1 cm stands for = real distance.
  c5m14_back: To go from real distance to map distance, divide by what 1 cm stands for.
concepts:
- code: cbse5m.map.direction
  title: Directions and grid positions
  notes: |
    Four main directions: North (up on most maps), East (right), South (down), West (left). Grids locate places: a box is
    named by its column and row (B3). Giving directions: '3 blocks North, then 2 East'. Opposite of North is South;
    of East is West.
  explanations:
    text: 'Maps usually show North at the top. Then East is to the right, South at the bottom and West to the left. A grid with letters and numbers lets you name any box, like B3: column B, row 3.'
    visual: 'Draw a 4 × 4 grid with letters A to D across the top and 1 to 4 down the side. Draw a school in column C, row 2: the school is at C2.'
    step_by_step: 'Step 1: Find North on the map. Step 2: Read the column letter. Step 3: Read the row number. Step 4: For a route, follow each step in order.'
    real_world: Reading a map of your town, or telling a friend how to reach your house.
  picture:
    kind: flow
    steps:
    - Start at the gate
    - 3 blocks North
    - 'Turn: 2 blocks East'
    - Reach the library
    alt: 'A route: from the gate go 3 blocks North, then 2 blocks East, to reach the library.'
  activity:
    type: sort
    prompt: Which direction is it? North is at the top of the map.
    bins:
    - North
    - South
    - East
    - West
    items:
    - label: The top of the map
      bin: North
      clue: Maps put this direction at the top.
      why: North.
    - label: The way the Pole Star shows
      bin: North
      clue: Travellers used this star at night.
      why: North.
    - label: The bottom of the map
      bin: South
      clue: Opposite the top.
      why: South.
    - label: Behind you when you face the Pole Star
      bin: South
      clue: Turn half way round.
      why: South.
    - label: Where the Sun rises
      bin: East
      clue: Morning sunshine comes from here.
      why: East.
    - label: The right side of the map
      bin: East
      clue: With the top pointing up.
      why: East.
    - label: Where the Sun sets
      bin: West
      clue: Evening sunshine comes from here.
      why: West.
    - label: The left side of the map
      bin: West
      clue: With the top pointing up.
      why: West.
  lesson:
    - teach: The four main directions are North, East, South and West. On most maps North is at the top, South at the bottom, East on the right and West on the left.
      picture:
        kind: compare
        columns:
        - title: Up and down
          points:
          - 'North: top'
          - 'South: bottom'
        - title: Right and left
          points:
          - 'East: right'
          - 'West: left'
        alt: On a map North is up, South down, East right and West left.
      check:
        prompt: On a map, which direction is on the right?
        options:
        - East
        - West
        - North
        answer: East
        why: North up, so East is to the right.
    - teach: The Sun rises in the East and sets in the West. Facing North, East is on your right and West on your left; South is behind you.
      check:
        prompt: Facing North, what is behind you?
        options:
        - South
        - East
        - West
        answer: South
        why: South is opposite North.
    - teach: 'A grid map names each box by its column letter and row number, like B3. Directions on a grid: ''2 blocks North, then 3 blocks East''. Walking 4 North then 4 South brings you back to the start.'
      check:
        prompt: You walk 3 blocks East then 3 blocks West. Where are you?
        options:
        - Back at the start
        - 6 blocks East
        - 3 blocks North
        answer: Back at the start
        why: East and West are opposite, so they cancel.
  items:
  - prompt: On most maps, which direction is at the top?
    options:
    - North
    - South
    - East
    - West
    answer: North
    difficulty: 1
    hints:
    - It points to the top.
    - The compass N.
    solution: Maps usually put North at the top.
    mistakes: {"South": "m5_north_top"}
  - prompt: What is the opposite of East?
    options:
    - West
    - North
    - South
    - East
    answer: West
    difficulty: 1
    hints:
    - They point in opposite ways.
    - Sun rises in the East and sets in the ...
    solution: West is opposite East.
    mistakes:
      North: c5_directions
  - prompt: Facing North, which way is East?
    options:
    - to your right
    - to your left
    - behind you
    - in front of you
    answer: to your right
    difficulty: 1
    hints:
    - N, E, S, W go clockwise.
    - Clockwise from North.
    solution: 'East is a quarter turn clockwise: to your right.'
    mistakes:
      to your left: c5_directions
  - prompt: On a grid, which box is in column C and row 4?
    options:
    - C4
    - 4C
    - D3
    - C3
    answer: C4
    difficulty: 1
    hints:
    - Letter first, then number.
    - Column C, row 4.
    solution: The box is named C4.
    mistakes: {"4C": "m5_grid_name"}
  - prompt: You walk 4 blocks North then 4 blocks South. How many blocks are you from the start?
    answer: '0'
    check: 4-4
    difficulty: 2
    hints:
    - South undoes North.
    - 4 − 4.
    solution: 'You come back to where you started: 0 blocks.'
    mistakes: {"8": "m5_back_start", "4": "m5_back_start"}
  - prompt: 'The Sun rises in the:'
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - Morning sun.
    - Opposite of where it sets.
    solution: The Sun rises in the East.
    mistakes: {"West": "m5_sunrise"}
  - prompt: What is the opposite of North?
    options:
    - South
    - East
    - West
    answer: South
    difficulty: 1
    hints:
    - Opposite means facing the other way.
    - Top and bottom of a map.
    solution: 'Step 1: North is top. Step 2: bottom is South.'
    mistakes:
      East: c5m14_dir
      West: c5m14_dir
  - prompt: Where does the Sun set?
    options:
    - West
    - East
    - North
    answer: West
    difficulty: 1
    hints:
    - It rises on one side and sets on the opposite.
    - It rises in the East.
    solution: 'Step 1: rises in the East. Step 2: sets in the opposite: West.'
    mistakes:
      East: c5m14_dir
      North: c5m14_dir
  - prompt: Facing East, which way is on your left?
    options:
    - North
    - South
    - West
    answer: North
    difficulty: 3
    hints:
    - Face East (right side of the map).
    - Your left hand points up the map.
    solution: 'Step 1: facing East, up the map is on your left. Step 2: up is North.'
    mistakes:
      South: c5m14_turn
      West: c5m14_turn
  - prompt: On a grid, which box is in column A and row 2?
    options:
    - A2
    - 2A
    - B1
    answer: A2
    difficulty: 1
    hints:
    - Letter first, then number.
    - Column A, row 2.
    solution: 'Step 1: column letter A. Step 2: row 2: A2.'
    mistakes:
      2A: c5m14_grid
      B1: c5m14_grid
  - prompt: You walk 5 blocks North then 2 blocks South. How many blocks North of the start are you?
    answer: '3'
    check: 5-2
    difficulty: 2
    hints:
    - South takes you back toward the start.
    - 5 − 2.
    solution: 'Step 1: 5 North, 2 back South. Step 2: 3 blocks North.'
    mistakes:
      '7': c5m14_net
      '2': c5m14_net
  - prompt: 'Kerala is on which coast of India: the coast facing the Arabian Sea in the West, or the Bay of Bengal in the East?'
    options:
    - West
    - East
    - North
    answer: West
    difficulty: 2
    hints:
    - The Arabian Sea is on the left of India's map.
    - Left is which direction?
    solution: 'Step 1: Kerala faces the Arabian Sea. Step 2: that is the West coast.'
    mistakes:
      East: c5m14_dir
      North: c5m14_dir
  - prompt: From box C3 you move 1 box right. Which box are you in?
    options:
    - D3
    - C4
    - B3
    answer: D3
    difficulty: 2
    hints:
    - Moving right changes the column letter.
    - The next letter after C.
    solution: 'Step 1: right changes column C → D. Step 2: row stays 3: D3.'
    mistakes:
      C4: c5m14_grid
      B3: c5m14_grid
  - prompt: Facing West, you make a half turn. Which way do you face?
    options:
    - East
    - North
    - South
    answer: East
    difficulty: 2
    hints:
    - A half turn faces the opposite way.
    - Opposite of West.
    solution: 'Step 1: half turn = opposite. Step 2: opposite of West is East.'
    mistakes:
      North: c5m14_turn
      South: c5m14_turn
  - prompt: Ali walks 4 blocks East, 2 North, then 4 West. How far from the start is he, in blocks?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - East and West cancel each other.
    - Only the North blocks are left.
    solution: 'Step 1: 4 East and 4 West cancel. Step 2: he is 2 blocks North.'
    mistakes:
      '10': c5m14_net
      '6': c5m14_net
      '0': c5m14_net
- code: cbse5m.map.scale
  title: Map scale and distances
  after:
  - cbse5m.map.direction
  notes: |
    A map scale shows real distance: 1 cm on the map = 1 km. A map distance of 6 cm = 6 km. With 1 cm = 50 m, 4 cm =
    200 m. Measure the map with a ruler, then multiply by the scale. Shortest route: compare totals.
  explanations:
    text: 'Maps shrink real places to fit on paper. The scale tells how much: if 1 cm stands for 1 km, a road 6 cm long on the map is really 6 km.'
    visual: 'Draw a scale bar 1 cm long labelled 1 km. Next to it draw a road of 6 cm. Count the 1 cm pieces: 6, so 6 km.'
    step_by_step: 'Step 1: Read the scale (1 cm = ?). Step 2: Measure the map distance in cm. Step 3: Multiply.'
    real_world: Road atlases and Google Maps both use scales so you can tell how far places are.
  picture:
    kind: bars
    bars:
    - label: Map (cm)
      value: 6
    - label: Real (km)
      value: 6
    alt: With a scale of 1 centimetre to 1 kilometre, 6 centimetres on the map is 6 kilometres in real life.
  activity:
    type: formula
    prompt: On a map, each cm stands for k km in real life.
    inputs:
    - name: cm
      label: Length on the map
      min: 0
      max: 20
      step: 0.5
      start: 0
      unit: cm
    - name: k
      label: km for each cm (k)
      min: 1
      max: 10
      step: 1
      start: 1
    outputs:
    - name: real
      label: Real distance
      expr: cm*k
      unit: km
    goals:
    - prompt: 1 cm stands for 2 km. The real road is 14 km. How long on the map?
      want:
        k: 2
        real: 14
      mistakes:
      - when:
          k: 2
          cm: 14
        say: '14 cm would be 28 km: each cm is 2 km. Halve it.'
    - prompt: 1 cm stands for 5 km. The real road is 25 km.
      want:
        k: 5
        real: 25
      mistakes:
      - when:
          k: 5
          cm: 20
        say: 20 cm would be 100 km. How many 5s make 25?
    - prompt: 4 cm on the map is 20 km. What does 1 cm stand for?
      want:
        cm: 4
        real: 20
      mistakes:
      - when:
          cm: 4
          k:
          - 1
          - 4
        say: 'Too small: 4 cm must reach 20 km. 20 ÷ 4.'
      - when:
          cm: 4
          k:
          - 6
          - 10
        say: 'Too big: 4 cm would go past 20 km.'
  lesson:
    - teach: A map is a small drawing of a big place. The scale tells what 1 cm on the map stands for. If 1 cm = 1 km, then 6 cm on the map is 6 km in real life.
      check:
        prompt: 1 cm = 2 km. A road is 3 cm on the map. How long is it really?
        options:
        - 6 km
        - 5 km
        - 3 km
        answer: 6 km
        why: 3 × 2 = 6.
    - teach: 'To find a real distance: measure the map with a ruler, then multiply by the scale. With 1 cm = 50 m, a 4 cm path is 4 × 50 = 200 m.'
      picture:
        kind: flow
        steps:
        - 'Measure on map: 4 cm'
        - 'Scale: 1 cm = 50 m'
        - 4 × 50
        - 'Real: 200 m'
        alt: Multiply map centimetres by the scale to get the real distance.
      check:
        prompt: 1 cm = 100 m. A lane is 5 cm on the map. How long is it?
        options:
        - 500 m
        - 105 m
        - 50 m
        answer: 500 m
        why: 5 × 100 = 500.
    - teach: 'To draw a real distance on a map, divide by the scale: 80 km with 1 cm = 10 km is 8 cm. To find the shortest route, add each route''s parts and compare.'
      check:
        prompt: 1 cm = 5 km. Two towns are 20 km apart. How far apart on the map?
        options:
        - 4 cm
        - 100 cm
        - 15 cm
        answer: 4 cm
        why: 20 ÷ 5 = 4.
  items:
  - prompt: On a map, 1 cm = 1 km. Two towns are 6 cm apart on the map. How many km apart are they really?
    answer: '6'
    check: 6*1
    difficulty: 1
    hints:
    - Each cm is 1 km.
    - 6 × 1.
    solution: 6 cm × 1 km = 6 km.
    mistakes: {"1": "m5_scale", "60": "m5_scale"}
  - prompt: On a map, 1 cm = 50 m. A path is 4 cm long. How many metres is the real path?
    answer: '200'
    check: 4*50
    difficulty: 1
    hints:
    - 4 × 50.
    - Each cm stands for 50 m.
    solution: 4 × 50 = 200 m.
    mistakes:
      '4': c5_scale
  - prompt: On a map, 1 cm = 5 km. A road is 7 cm. How many km is it?
    answer: '35'
    check: 7*5
    difficulty: 1
    hints:
    - 7 × 5.
    - Multiply by the scale.
    solution: 7 × 5 = 35 km.
    mistakes:
      '12': c5_scale
  - prompt: On a map, 1 cm = 10 km. Two cities are 80 km apart. How many cm apart are they on the map?
    answer: '8'
    check: 80/10
    difficulty: 2
    hints:
    - Divide by the scale.
    - 80 ÷ 10.
    solution: 80 ÷ 10 = 8 cm.
    mistakes: {"80": "m5_scale_divide", "800": "m5_scale_divide"}
  - prompt: Route A is 3 km + 4 km. Route B is 6 km. Which is shorter?
    options:
    - Route B
    - Route A
    - they are equal
    - cannot tell
    answer: Route B
    difficulty: 1
    hints:
    - Route A = 7 km.
    - Compare 7 and 6.
    solution: Route A is 7 km, so Route B (6 km) is shorter.
    mistakes: {"Route A": "m5_route"}
  - prompt: On a map, 2 cm = 1 km. A road is 10 cm. How many km is it?
    answer: '5'
    check: 10/2
    difficulty: 2
    hints:
    - Every 2 cm is 1 km.
    - 10 ÷ 2.
    solution: 10 ÷ 2 = 5 km.
    mistakes:
      '20': c5_scale
  - prompt: On a map 1 cm = 3 km. Two villages are 5 cm apart. How many km apart are they really?
    answer: '15'
    check: 5*3
    difficulty: 1
    hints:
    - Map cm × scale.
    - 5 × 3.
    solution: 'Step 1: 5 × 3. Step 2: = 15 km.'
    mistakes:
      '8': c5m14_scale
      '2': c5m14_scale
  - prompt: On a map 1 cm = 20 m. A path is 6 cm. How many metres is the real path?
    answer: '120'
    check: 6*20
    difficulty: 1
    hints:
    - Multiply by the scale.
    - 6 × 20.
    solution: 'Step 1: 6 × 20. Step 2: = 120 m.'
    mistakes:
      '26': c5m14_scale
      '14': c5m14_scale
  - prompt: On a map 1 cm = 4 km. Two places are 32 km apart. How many cm apart on the map?
    answer: '8'
    check: 32//4
    difficulty: 2
    hints:
    - Real distance ÷ scale.
    - 32 ÷ 4.
    solution: 'Step 1: 32 ÷ 4. Step 2: = 8 cm.'
    mistakes:
      '128': c5m14_back
      '28': c5m14_back
  - prompt: 'Route A: 2 km + 5 km. Route B: 3 km + 3 km. Which is shorter?'
    options:
    - Route B
    - Route A
    - They are equal
    answer: Route B
    difficulty: 1
    hints:
    - Add each route.
    - A = 7 km, B = ?
    solution: 'Step 1: A = 7 km, B = 6 km. Step 2: B is shorter.'
    mistakes:
      Route A: c5m14_scale
      They are equal: c5m14_scale
  - prompt: On a map 2 cm = 1 km. A road is 14 cm. How many km is it?
    answer: '7'
    check: 14//2
    difficulty: 2
    hints:
    - Every 2 cm is 1 km.
    - 14 ÷ 2.
    solution: 'Step 1: 14 ÷ 2. Step 2: = 7 km.'
    mistakes:
      '28': c5m14_scale
      '12': c5m14_scale
  - prompt: On a map 1 cm = 25 km. A river is 8 cm long on the map. How long is it really, in km?
    answer: '200'
    check: 8*25
    difficulty: 2
    hints:
    - 8 × 25.
    - 4 × 25 = 100.
    solution: 'Step 1: 8 × 25. Step 2: = 200 km.'
    mistakes:
      '33': c5m14_scale
      '100': c5m14_scale
  - prompt: Which scale makes the biggest drawing of the same town?
    options:
    - 1 cm = 100 m
    - 1 cm = 1 km
    - 1 cm = 10 km
    answer: 1 cm = 100 m
    difficulty: 3
    hints:
    - Each cm stands for less ground in a bigger drawing.
    - Which scale gives the most cm for the same town?
    solution: 'Step 1: 1 cm for only 100 m needs many cm for a town. Step 2: so the drawing is biggest.'
    mistakes:
      1 cm = 1 km: c5m14_back
      1 cm = 10 km: c5m14_back
  - prompt: On a map 1 cm = 50 m. The school is 3 cm from home and the park is 5 cm. How many metres farther is the park?
    answer: '100'
    check: (5-3)*50
    difficulty: 3
    hints:
    - Find the difference on the map first.
    - Then multiply by the scale.
    solution: 'Step 1: 5 − 3 = 2 cm. Step 2: 2 × 50 = 100 m.'
    mistakes:
      '400': c5m14_scale
      '2': c5m14_scale
  - prompt: On a map 1 cm = 10 km. Route X is 3 cm + 4 cm. How many km is Route X?
    answer: '70'
    check: (3+4)*10
    difficulty: 2
    hints:
    - Add the map lengths first.
    - Then multiply by 10.
    solution: 'Step 1: 3 + 4 = 7 cm. Step 2: 7 × 10 = 70 km.'
    mistakes:
      '7': c5m14_scale
      '17': c5m14_scale
