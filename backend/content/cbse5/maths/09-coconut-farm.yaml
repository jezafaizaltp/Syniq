# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 9
title: Coconut Farm
tips:
  c5_factor_pairs: 'Find pairs that multiply to the number: start with 1 × n, then try 2, 3, 4 ... until the pairs repeat.'
  c5_multiples: 'Multiples are the times table of a number: n, 2n, 3n, ... They never end.'
  m5_both_multiple: "A multiple of 2 is even. A multiple of 3 has digits adding to 3, 6 or 9. Check both."
  m5_count_multiples: "Skip-count by 5 from 5 up to 50, putting up one finger for each number you say. How many fingers?"
  m5_lcm: "Write each animal's or tree's numbers in a row and find the first number that is in both rows."
  m5_multiple: "Count in 7s and stop at the 5th: 7, 14, 21, ..."
  m5_share: "Share 24 into 4 equal rows. 4 × ? = 24."
  c5m9_array: Equal rows make an array. Rows × number in each row gives the total.
  c5m9_pair: A factor pair is two numbers that multiply to give the number exactly.
  c5m9_share: A total put into equal rows or sacks means divide.
  c5m9_mult: 'Multiples are the numbers in the times table: count on by the same number from it.'
  c5m9_common: Write a few multiples of each number side by side and look for the first one in both lists.
concepts:
- code: cbse5m.coco.groups
  title: Rows, groups and multiplication
  notes: |
    Trees planted in equal rows make an array: 6 rows of 8 trees = 48 trees. The same number can be arranged in
    different arrays: 24 = 1 × 24 = 2 × 12 = 3 × 8 = 4 × 6; these are factor pairs. Each tree gives about the same
    number of coconuts, so total = trees × coconuts per tree.
  explanations:
    text: When trees stand in equal rows, multiply rows by trees in a row to count them all. 24 trees can stand as 4 rows of 6, or 3 rows of 8, or 2 rows of 12. The numbers that multiply to 24 are its factors.
    visual: 'Draw dots for trees: 4 rows of 6 dots. Then redraw the same 24 dots as 3 rows of 8. Both make 24.'
    step_by_step: 'Step 1: Count the rows. Step 2: Count the trees in one row. Step 3: Multiply. Step 4: For factors, try every number from 1 upward.'
    real_world: Coconut, mango and rubber plantations in Kerala plant trees in neat rows to make counting and caring easy.
  picture:
    kind: compare
    columns:
    - title: Rows × trees
      points:
      - 1 × 24
      - 2 × 12
      - 3 × 8
    - title: Also
      points:
      - 4 × 6
      - 6 × 4
      - same 24 trees
    alt: '24 trees can be planted as 1 by 24, 2 by 12, 3 by 8 or 4 by 6: these are the factor pairs of 24.'
  activity:
    type: formula
    prompt: Coconut trees in equal rows.
    inputs:
    - name: r
      label: Rows
      min: 1
      max: 24
      step: 1
      start: 1
    - name: c
      label: Trees in each row
      min: 1
      max: 24
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Trees in all
      expr: r*c
    goals:
    - prompt: Plant 24 trees in 4 equal rows.
      want:
        r: 4
        tot: 24
      mistakes:
      - when:
          r: 4
          c: 20
        say: 4 + 20 = 24 adds. 4 rows of c trees is 4 × c.
    - prompt: 'Plant 36 trees in a square: rows the same as trees in a row.'
      want:
        r: 6
        c: 6
      mistakes:
      - when:
          r: 9
          c: 4
        say: That's 36 trees, but 9 rows of 4 is not a square.
      - when:
          r: 4
          c: 9
        say: 36 trees, but 4 rows of 9 is a long rectangle.
    - prompt: Plant 30 trees in 5 equal rows.
      want:
        r: 5
        tot: 30
      mistakes:
      - when:
          r: 5
          c:
          - 7
          - 24
        say: 'Too many in each row: 5 × 7 is already 35.'
  lesson:
    - teach: 'Trees planted in equal rows make an array. 6 rows with 8 trees in each row: 6 × 8 = 48 trees. Turning the array round (8 rows of 6) gives the same total.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: 8 trees
        rows:
        - size: 1
          label: 6 rows
        cells:
        - - '48'
        alt: An array of 6 rows with 8 trees in each has 48 trees.
      check:
        prompt: 5 rows of 7 trees. How many trees?
        options:
        - '35'
        - '12'
        - '57'
        answer: '35'
        why: 5 × 7 = 35.
      ways:
      - style: step_by_step
        teach: 'Count an orchard of 5 rows with 7 trees in each. Step 1: Count one row: 7. Step 2: There are 5 rows, so 7 × 5. Step 3: 7 × 5 = 35 trees. Step 4: Walking along the other way you see 7 rows of 5: still 35.'
      - style: real_world
        teach: Egg trays, chairs in a hall and windows on a tall building are all arrays. A tray of 5 rows with 6 eggs in each holds 5 × 6 = 30 eggs, without counting each egg.
    - teach: The same number can be arranged in different arrays. 24 = 1 × 24 = 2 × 12 = 3 × 8 = 4 × 6. Each pair is a factor pair, and the numbers 1, 2, 3, 4, 6, 8, 12, 24 are the factors of 24.
      check:
        prompt: Which is a factor pair of 18?
        options:
        - 3 × 6
        - 4 × 5
        - 2 × 8
        answer: 3 × 6
        why: 3 × 6 = 18 exactly.
      ways:
      - style: visual
        teach: 'All the ways to arrange 18 plants in equal rows: the factor pairs of 18.'
        picture:
          kind: compare
          columns:
          - title: Factor pairs
            points:
            - 1 × 18
            - 2 × 9
            - 3 × 6
          - title: Factors of 18
            points:
            - 1, 2, 3, 6, 9, 18
          alt: 18 plants can be set out as 1 row of 18, 2 rows of 9 or 3 rows of 6. So the factors of 18 are 1, 2, 3, 6, 9 and 18.
      - style: step_by_step
        teach: 'Find the factors of 15. Step 1: Try 1: 1 × 15. Step 2: Try 2: 15 is odd, so no. Step 3: Try 3: 3 × 5. Step 4: Try 4: no. Next would be 5, already found, so stop. Factors: 1, 3, 5, 15.'
    - teach: 'If the total is known, divide to find a row or a sack: 24 trees in 4 equal rows is 24 ÷ 4 = 6 in each row. 180 coconuts in sacks of 12 is 180 ÷ 12 = 15 sacks.'
      check:
        prompt: 30 trees in 5 equal rows. How many in each row?
        options:
        - '6'
        - '25'
        - '35'
        answer: '6'
        why: 30 ÷ 5 = 6.
      ways:
      - style: visual
        teach: Sharing 96 coconuts equally into sacks of 8.
        picture:
          kind: flow
          steps:
          - 'Total: 96 coconuts'
          - Each sack holds 8
          - 96 ÷ 8 = 12
          - 12 sacks are filled
          - 'Check: 12 × 8 = 96'
          alt: '96 coconuts in sacks of 8: 96 divided by 8 is 12, so 12 sacks are filled. Check: 12 times 8 is 96.'
      - style: real_world
        teach: 'A teacher has 42 children for a drill. To stand them in 6 equal lines, divide: 42 ÷ 6 = 7 children in each line.'
  items:
  - prompt: A farm has 6 rows of 8 coconut trees. How many trees?
    answer: '48'
    check: 6*8
    difficulty: 1
    hints:
    - Rows × trees in a row.
    - 6 × 8.
    solution: 6 × 8 = 48 trees.
    mistakes: {"14": "m5_times_table", "42": "m5_times_table"}
  - prompt: Each tree gives 25 coconuts. How many coconuts do 12 trees give?
    answer: '300'
    check: 25*12
    difficulty: 2
    hints:
    - 25 × 12.
    - 25 × 4 = 100.
    solution: 25 × 12 = 300 coconuts.
    mistakes: {"37": "m5_times_carry", "250": "m5_times_carry"}
  - prompt: 24 trees are planted in 4 equal rows. How many trees in each row?
    answer: '6'
    check: 24/4
    difficulty: 1
    hints:
    - 24 ÷ 4.
    - 4 × ? = 24.
    solution: 24 ÷ 4 = 6.
    mistakes: {"4": "m5_share", "20": "m5_share"}
  - prompt: Which is NOT a factor pair of 24?
    options:
    - 5 × 5
    - 3 × 8
    - 4 × 6
    - 2 × 12
    answer: 5 × 5
    difficulty: 1
    hints:
    - Multiply each pair.
    - 5 × 5 = 25.
    solution: 5 × 5 = 25, not 24.
    mistakes:
      3 × 8: c5_factor_pairs
  - prompt: How many factors does 12 have? (1, 2, ... 12)
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - 1×12, 2×6, 3×4.
    - 'List them: 1, 2, 3, 4, 6, 12.'
    solution: 'The factors are 1, 2, 3, 4, 6, 12: six factors.'
    mistakes:
      '3': c5_factor_pairs
  - prompt: Coconuts are packed 12 in a sack. How many sacks for 180 coconuts?
    answer: '15'
    check: 180/12
    difficulty: 2
    hints:
    - 180 ÷ 12.
    - 12 × 15 = 180.
    solution: 180 ÷ 12 = 15 sacks.
    mistakes: {"12": "m5_divide_check", "16": "m5_divide_check"}
  - prompt: A farm has 9 rows of 7 trees. How many trees?
    answer: '63'
    check: 9*7
    difficulty: 1
    hints:
    - Rows × trees in each row.
    - 9 × 7.
    solution: 'Step 1: 9 × 7. Step 2: = 63 trees.'
    mistakes:
      '16': c5m9_array
      '56': c5m9_array
  - prompt: 36 trees are planted in 9 equal rows. How many trees in each row?
    answer: '4'
    check: 36//9
    difficulty: 1
    hints:
    - Share 36 into 9 rows.
    - 9 × ? = 36.
    solution: 'Step 1: 36 ÷ 9. Step 2: = 4.'
    mistakes:
      '27': c5m9_share
      '45': c5m9_share
  - prompt: Which is NOT a factor of 20?
    options:
    - '6'
    - '4'
    - '5'
    answer: '6'
    difficulty: 2
    hints:
    - A factor divides 20 exactly.
    - Try 20 ÷ each number.
    solution: 'Step 1: 20 ÷ 4 = 5 and 20 ÷ 5 = 4. Step 2: 20 ÷ 6 leaves a remainder, so 6 is not a factor.'
    mistakes:
      '4': c5m9_pair
      '5': c5m9_pair
  - prompt: How many factors does 16 have? (1, 2, ... 16)
    answer: '5'
    check: '5'
    difficulty: 3
    hints:
    - 'List factor pairs: 1 × 16, 2 × 8, 4 × 4.'
    - Count each different number once.
    solution: 'Step 1: factors are 1, 2, 4, 8, 16. Step 2: that is 5 factors.'
    mistakes:
      '6': c5m9_pair
      '4': c5m9_pair
  - prompt: Each tree gives 30 coconuts. How many coconuts do 15 trees give?
    answer: '450'
    check: 30*15
    difficulty: 2
    hints:
    - Trees × coconuts per tree.
    - 3 × 15 = 45, then the zero.
    solution: 'Step 1: 30 × 15. Step 2: = 450.'
    mistakes:
      '45': c5m9_array
      '2': c5m9_share
  - prompt: Which array has 32 trees?
    options:
    - 4 rows of 8
    - 5 rows of 6
    - 3 rows of 11
    answer: 4 rows of 8
    difficulty: 2
    hints:
    - Multiply rows × trees for each.
    - Which gives exactly 32?
    solution: 'Step 1: 4×8 = 32, 5×6 = 30, 3×11 = 33. Step 2: 4 rows of 8.'
    mistakes:
      5 rows of 6: c5m9_array
      3 rows of 11: c5m9_array
  - prompt: 240 coconuts are packed 20 to a sack. How many sacks?
    answer: '12'
    check: 240//20
    difficulty: 2
    hints:
    - Divide the total by 20.
    - 24 ÷ 2 = 12.
    solution: 'Step 1: 240 ÷ 20. Step 2: = 12 sacks.'
    mistakes:
      '4800': c5m9_share
      '120': c5m9_share
  - prompt: A farmer has 12 plants. In how many different ways can the farmer plant them in equal rows (including 1 row)?
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - Count the factors of 12.
    - 1, 2, 3, ... 12 rows.
    solution: 'Step 1: factors of 12: 1, 2, 3, 4, 6, 12. Step 2: 6 ways.'
    mistakes:
      '3': c5m9_pair
      '12': c5m9_pair
  - prompt: 'Fill in: 7 × ? = 56'
    answer: '8'
    check: 56//7
    difficulty: 1
    hints:
    - Use the 7 times table.
    - 56 ÷ 7.
    solution: 'Step 1: 56 ÷ 7. Step 2: = 8.'
    mistakes:
      '49': c5m9_pair
      '9': c5m9_pair
  - prompt: 'Case: A farmer wants to plant 30 saplings in equal rows, with more than 1 row and more than 1 sapling in each row. Which plan is NOT possible?'
    options:
    - 4 rows
    - 5 rows
    - 6 rows
    answer: 4 rows
    hints:
    - 'For each plan, check: does 30 share exactly into that many rows?'
    - Is 4 a factor of 30?
    solution: 30 ÷ 5 = 6 and 30 ÷ 6 = 5 work exactly. 30 ÷ 4 = 7 remainder 2, so 4 equal rows is not possible.
    mistakes:
      5 rows: c5m9_pair
      6 rows: c5m9_pair
    exam: case
    difficulty: 2
  - prompt: 'Situation: A farm has 8 rows of 12 coconut trees. Each tree gives 20 coconuts in a season. How many coconuts does the farm get?'
    options:
    - 1,920
    - '96'
    - '240'
    answer: 1,920
    hints:
    - First find how many trees there are.
    - Then multiply by the coconuts from one tree.
    solution: 'Trees: 8 × 12 = 96. Coconuts: 96 × 20 = 1,920.'
    mistakes:
      '96': c5m9_array
      '240': c5m9_array
    exam: competency
    difficulty: 2
- code: cbse5m.coco.multiples
  title: Multiples and common multiples
  after:
  - cbse5m.coco.groups
  notes: |
    Multiples of a number are its times table: multiples of 4: 4, 8, 12, 16, 20, 24, ... Common multiples belong to two
    tables: 12 and 24 are multiples of both 4 and 6; the smallest is 12. Use it for things that repeat: one tree is
    watered every 4 days, another every 6 days; both on the same day every 12 days.
  explanations:
    text: 'Multiples are what you get when you skip count. Skip count by 4: 4, 8, 12, 16. Skip count by 6: 6, 12, 18. Both lists have 12, so 12 is a common multiple of 4 and 6.'
    visual: Draw a number line to 24. Circle jumps of 4 in red and jumps of 6 in blue. Red and blue meet at 12 and 24.
    step_by_step: 'Step 1: Write the first few multiples of each number. Step 2: Find the numbers in both lists. Step 3: The smallest one is the first time they meet.'
    real_world: Buses that leave every 15 and every 20 minutes both leave together every 60 minutes.
  picture:
    kind: number_line
    from: 0
    to: 24
    step: 2
    points:
    - at: 4
      label: '4'
    - at: 8
      label: '8'
    - at: 12
      label: 12 both
    - at: 16
      label: '16'
    - at: 18
      label: '18'
    - at: 24
      label: 24 both
    alt: Multiples of 4 and of 6 on a number line meet at 12 and at 24.
    jumps:
    - from: 0
      to: 6
      label: '+6'
    - from: 6
      to: 12
      label: '+6'
    - from: 12
      to: 18
      label: '+6'
    - from: 18
      to: 24
      label: '+6'
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Mark the first number in both skip-counting lists.
    goals:
    - prompt: Skip count by 4 and by 6.
      target: 12
      mistakes:
      - when:
          v: 24
        say: '24 is in both lists, but 12 comes first: 4, 8, 12 and 6, 12.'
      - when:
          v: 10
        say: 4 + 6 adds them. Is 10 in the 4 list?
    - prompt: Skip count by 3 and by 5.
      target: 15
      mistakes:
      - when:
          v: 8
        say: 3 + 5 = 8, but 8 isn't in the 3 list.
      - when:
          v: 30
        say: 30 is in both, but there's an earlier one.
    - prompt: Skip count by 2 and by 7.
      target: 14
      mistakes:
      - when:
          v: 9
        say: 2 + 7 = 9. Is 9 in the 2 list?
      - when:
          v: 7
        say: '7 is in the 7 list, but 7 is odd: not in the 2 list.'
  lesson:
    - teach: 'Multiples of a number are what you get by counting on in that number: multiples of 4 are 4, 8, 12, 16, 20 ... The 5th multiple of 4 is 4 × 5 = 20.'
      check:
        prompt: What is the 3rd multiple of 9?
        options:
        - '27'
        - '12'
        - '18'
        answer: '27'
        why: 9 × 3 = 27.
      ways:
      - style: visual
        teach: Multiples of 3 on a number line, by counting on in threes.
        picture:
          kind: number_line
          from: 0
          to: 18
          step: 3
          jumps:
          - from: 0
            to: 3
            label: 1st
          - from: 3
            to: 6
            label: 2nd
          - from: 6
            to: 9
            label: 3rd
          - from: 9
            to: 12
            label: 4th
          alt: 'Jumps of 3 on a number line: the 1st multiple of 3 is 3, the 2nd is 6, the 3rd is 9 and the 4th is 12.'
      - style: real_world
        teach: 'A bus comes every 10 minutes: at 10, 20, 30, 40 minutes past the hour. Those times are the multiples of 10.'
    - teach: 'A common multiple is in both times tables. Multiples of 4: 4, 8, 12, 16, 20, 24. Multiples of 6: 6, 12, 18, 24. 12 and 24 are common; the smallest common multiple is 12.'
      picture:
        kind: compare
        columns:
        - title: Multiples of 4
          points:
          - 4, 8, 12
          - 16, 20, 24
        - title: Multiples of 6
          points:
          - 6, 12, 18
          - 24, 30, 36
        alt: 12 and 24 appear in both lists, so they are common multiples of 4 and 6.
      check:
        prompt: What is the smallest common multiple of 2 and 5?
        options:
        - '10'
        - '7'
        - '5'
        answer: '10'
        why: 10 is the first number in both the 2 and 5 tables.
      ways:
      - style: step_by_step
        teach: 'Find the smallest common multiple of 6 and 9. Step 1: Multiples of 6: 6, 12, 18, 24. Step 2: Multiples of 9: 9, 18, 27. Step 3: The first number in both lists is 18. Step 4: So 18 is the smallest common multiple.'
      - style: real_world
        teach: 'Hot dogs come in packs of 10 and buns in packs of 8. To have the same number of each, buy until both totals match: 40 is the first number in both lists, so 4 packs of hot dogs and 5 packs of buns.'
    - teach: Common multiples help with things that repeat. One tree is watered every 4 days and another every 6 days. Both are watered on the same day every 12 days.
      check:
        prompt: A bell rings every 2 minutes and a light flashes every 3 minutes. Both start now. When do they happen together next?
        options:
        - In 6 minutes
        - In 5 minutes
        - In 3 minutes
        answer: In 6 minutes
        why: 6 is the smallest common multiple of 2 and 3.
      ways:
      - style: visual
        teach: Two jobs that repeat, and the day they happen together.
        picture:
          kind: compare
          columns:
          - title: 'Every 2 days: sweep the yard'
            points:
            - Day 2, 4, 6, 8, 10
          - title: 'Every 5 days: clean the tank'
            points:
            - Day 5, 10
          - title: Both on the same day
            points:
            - Day 10
          alt: Sweeping every 2 days happens on days 2, 4, 6, 8, 10. Cleaning the tank every 5 days happens on days 5 and 10. Both happen together first on day 10.
      - style: real_world
        teach: 'Two friends go to the library: one every 4 days, the other every 10 days. They meet there first on day 20, the smallest common multiple of 4 and 10.'
  items:
  - prompt: What is the 5th multiple of 7?
    answer: '35'
    check: 7*5
    difficulty: 1
    hints:
    - 7, 14, 21, 28, ...
    - 7 × 5.
    solution: 7 × 5 = 35.
    mistakes: {"12": "m5_multiple", "28": "m5_multiple"}
  - prompt: Which is a multiple of 6?
    options:
    - '42'
    - '32'
    - '26'
    - '16'
    answer: '42'
    difficulty: 1
    hints:
    - Is it in the 6 times table?
    - 6 × 7 = 42.
    solution: 6 × 7 = 42.
    mistakes:
      '16': c5_multiples
  - prompt: What is the smallest common multiple of 4 and 6?
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - "List the multiples of 4 and of 6, and find the first number in both lists."
    - 'Multiples of 6: 6, 12.'
    solution: 12 is the first number in both lists.
    mistakes:
      '24': c5_multiples
  - prompt: One tree is watered every 3 days and another every 5 days. Both were watered today. In how many days will both be watered again on the same day?
    answer: '15'
    check: '15'
    difficulty: 2
    hints:
    - Find the smallest common multiple of 3 and 5.
    - 3, 6, 9, 12, 15.
    solution: 15 is the first common multiple of 3 and 5.
    mistakes: {"8": "m5_lcm", "10": "m5_lcm"}
  - prompt: How many multiples of 5 are there from 1 to 50?
    answer: '10'
    check: 50/5
    difficulty: 2
    hints:
    - "Count in fives from 5 up to 50 and keep a tally of how many you say."
    - 50 ÷ 5.
    solution: 50 ÷ 5 = 10 multiples.
    mistakes: {"5": "m5_count_multiples", "9": "m5_count_multiples"}
  - prompt: Which number is a multiple of both 2 and 3?
    options:
    - '18'
    - '14'
    - '15'
    - '20'
    answer: '18'
    difficulty: 1
    hints:
    - It must be even and in the 3 table.
    - 18 = 2 × 9 = 3 × 6.
    solution: 18 is a multiple of both 2 and 3.
    mistakes: {"14": "m5_both_multiple"}
  - prompt: What is the 6th multiple of 8?
    answer: '48'
    check: 8*6
    difficulty: 1
    hints:
    - Count on in 8s six times.
    - 8 × 6.
    solution: 'Step 1: 8 × 6. Step 2: = 48.'
    mistakes:
      '14': c5m9_mult
      '40': c5m9_mult
  - prompt: Which is a multiple of 9?
    options:
    - '54'
    - '50'
    - '39'
    answer: '54'
    difficulty: 1
    hints:
    - Is it in the 9 times table?
    - 9 × 6 = ?
    solution: 'Step 1: 9 × 6 = 54. Step 2: so 54 is a multiple of 9.'
    mistakes:
      '50': c5m9_mult
      '39': c5m9_mult
  - prompt: What is the smallest common multiple of 3 and 4?
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - 'Write the 4 times table and the 3 times table side by side.'
    - Find the first number in both lists.
    solution: 'Step 1: 4, 8, 12 and 3, 6, 9, 12. Step 2: 12 is first in both.'
    mistakes:
      '7': c5m9_common
      '24': c5m9_common
  - prompt: How many multiples of 6 are there from 1 to 60?
    answer: '10'
    check: 60//6
    difficulty: 2
    hints:
    - 6, 12, 18 ... 60.
    - 60 ÷ 6.
    solution: 'Step 1: the last one is 60 = 6 × 10. Step 2: 10 multiples.'
    mistakes:
      '6': c5m9_mult
      '9': c5m9_mult
  - prompt: Which number is a multiple of both 3 and 5?
    options:
    - '30'
    - '25'
    - '21'
    answer: '30'
    difficulty: 2
    hints:
    - It must be in both tables.
    - Check each in the 3 and 5 tables.
    solution: 'Step 1: 30 = 3 × 10 and 30 = 5 × 6. Step 2: so 30 is in both.'
    mistakes:
      '25': c5m9_common
      '21': c5m9_common
  - prompt: Bus A comes every 6 minutes and Bus B every 8 minutes. Both just came. In how many minutes will they come together again?
    answer: '24'
    check: '24'
    difficulty: 3
    hints:
    - Find the smallest common multiple of 6 and 8.
    - 'Multiples of 8: 8, 16, 24 ...'
    solution: 'Step 1: 6, 12, 18, 24 and 8, 16, 24. Step 2: 24 minutes.'
    mistakes:
      '48': c5m9_common
      '14': c5m9_common
      '2': c5m9_common
  - prompt: Which list shows the first four multiples of 7?
    options:
    - 7, 14, 21, 28
    - 1, 7, 14, 21
    - 7, 17, 27, 37
    answer: 7, 14, 21, 28
