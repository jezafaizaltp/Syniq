# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 9
title: Coconut Farm
tips:
  c5_factor_pairs: 'Find pairs that multiply to the number: start with 1 × n, then try 2, 3, 4 ... until the pairs repeat.'
  c5_multiples: 'Multiples are the times table of a number: n, 2n, 3n, ... They never end.'
  m5_both_multiple: "A multiple of 2 is even. A multiple of 3 has digits adding to 3, 6 or 9. Check both."
  m5_count_multiples: "Skip-count by 5 from 5 up to 50, putting up one finger for each number you say. How many fingers?"
  m5_lcm: "Write each animal's or tree's numbers in a row and find the first number that is in both rows."
  m5_multiple: "Count in 7s and stop at the 5th: 7, 14, 21, ..."
  m5_share: "Share 24 into 4 equal rows. 4 × ? = 24."
concepts:
- code: cbse5m.coco.groups
  title: Rows, groups and multiplication
  notes: |
    Trees planted in equal rows make an array: 6 rows of 8 trees = 48 trees. The same number can be arranged in
    different arrays: 24 = 1 × 24 = 2 × 12 = 3 × 8 = 4 × 6; these are factor pairs. Each tree gives about the same
    number of coconuts, so total = trees × coconuts per tree.
  explanations:
    text: When trees stand in equal rows, multiply rows by trees in a row to count them all. 24 trees can stand as 4 rows of 6, or 3 rows of 8, or 2 rows of 12. The numbers that multiply to 24 are its factors.
    visual: 'Draw dots for trees: 4 rows of 6 dots. Then redraw the same 24 dots as 3 rows of 8. Both make 24.'
    step_by_step: 'Step 1: Count the rows. Step 2: Count the trees in one row. Step 3: Multiply. Step 4: For factors, try every number from 1 upward.'
    real_world: Coconut, mango and rubber plantations in Kerala plant trees in neat rows to make counting and caring easy.
  picture:
    kind: compare
    columns:
    - title: Rows × trees
      points:
      - 1 × 24
      - 2 × 12
      - 3 × 8
    - title: Also
      points:
      - 4 × 6
      - 6 × 4
      - same 24 trees
    alt: '24 trees can be planted as 1 by 24, 2 by 12, 3 by 8 or 4 by 6: these are the factor pairs of 24.'
  activity:
    type: formula
    prompt: Coconut trees in equal rows.
    inputs:
    - name: r
      label: Rows
      min: 1
      max: 24
      step: 1
      start: 1
    - name: c
      label: Trees in each row
      min: 1
      max: 24
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Trees in all
      expr: r*c
    goals:
    - prompt: Plant 24 trees in 4 equal rows.
      want:
        r: 4
        tot: 24
      mistakes:
      - when:
          r: 4
          c: 20
        say: 4 + 20 = 24 adds. 4 rows of c trees is 4 × c.
    - prompt: 'Plant 36 trees in a square: rows the same as trees in a row.'
      want:
        r: 6
        c: 6
      mistakes:
      - when:
          r: 9
          c: 4
        say: That's 36 trees, but 9 rows of 4 is not a square.
      - when:
          r: 4
          c: 9
        say: 36 trees, but 4 rows of 9 is a long rectangle.
    - prompt: Plant 30 trees in 5 equal rows.
      want:
        r: 5
        tot: 30
      mistakes:
      - when:
          r: 5
          c:
          - 7
          - 24
        say: 'Too many in each row: 5 × 7 is already 35.'
  items:
  - prompt: A farm has 6 rows of 8 coconut trees. How many trees?
    answer: '48'
    check: 6*8
    difficulty: 1
    hints:
    - Rows × trees in a row.
    - 6 × 8.
    solution: 6 × 8 = 48 trees.
    mistakes: {"14": "m5_times_table", "42": "m5_times_table"}
  - prompt: Each tree gives 25 coconuts. How many coconuts do 12 trees give?
    answer: '300'
    check: 25*12
    difficulty: 2
    hints:
    - 25 × 12.
    - 25 × 4 = 100.
    solution: 25 × 12 = 300 coconuts.
    mistakes: {"37": "m5_times_carry", "250": "m5_times_carry"}
  - prompt: 24 trees are planted in 4 equal rows. How many trees in each row?
    answer: '6'
    check: 24/4
    difficulty: 1
    hints:
    - 24 ÷ 4.
    - 4 × ? = 24.
    solution: 24 ÷ 4 = 6.
    mistakes: {"4": "m5_share", "20": "m5_share"}
  - prompt: Which is NOT a factor pair of 24?
    options:
    - 5 × 5
    - 3 × 8
    - 4 × 6
    - 2 × 12
    answer: 5 × 5
    difficulty: 1
    hints:
    - Multiply each pair.
    - 5 × 5 = 25.
    solution: 5 × 5 = 25, not 24.
    mistakes:
      3 × 8: c5_factor_pairs
  - prompt: How many factors does 12 have? (1, 2, ... 12)
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - 1×12, 2×6, 3×4.
    - 'List them: 1, 2, 3, 4, 6, 12.'
    solution: 'The factors are 1, 2, 3, 4, 6, 12: six factors.'
    mistakes:
      '3': c5_factor_pairs
  - prompt: Coconuts are packed 12 in a sack. How many sacks for 180 coconuts?
    answer: '15'
    check: 180/12
    difficulty: 2
    hints:
    - 180 ÷ 12.
    - 12 × 15 = 180.
    solution: 180 ÷ 12 = 15 sacks.
    mistakes: {"12": "m5_divide_check", "16": "m5_divide_check"}
- code: cbse5m.coco.multiples
  title: Multiples and common multiples
  after:
  - cbse5m.coco.groups
  notes: |
    Multiples of a number are its times table: multiples of 4: 4, 8, 12, 16, 20, 24, ... Common multiples belong to two
    tables: 12 and 24 are multiples of both 4 and 6; the smallest is 12. Use it for things that repeat: one tree is
    watered every 4 days, another every 6 days; both on the same day every 12 days.
  explanations:
    text: 'Multiples are what you get when you skip count. Skip count by 4: 4, 8, 12, 16. Skip count by 6: 6, 12, 18. Both lists have 12, so 12 is a common multiple of 4 and 6.'
    visual: Draw a number line to 24. Circle jumps of 4 in red and jumps of 6 in blue. Red and blue meet at 12 and 24.
    step_by_step: 'Step 1: Write the first few multiples of each number. Step 2: Find the numbers in both lists. Step 3: The smallest one is the first time they meet.'
    real_world: Buses that leave every 15 and every 20 minutes both leave together every 60 minutes.
  picture:
    kind: number_line
    from: 0
    to: 24
    step: 2
    points:
    - at: 4
      label: '4'
    - at: 8
      label: '8'
    - at: 12
      label: 12 both
    - at: 16
      label: '16'
    - at: 18
      label: '18'
    - at: 24
      label: 24 both
    alt: Multiples of 4 and of 6 on a number line meet at 12 and at 24.
    jumps:
    - from: 0
      to: 6
      label: '+6'
    - from: 6
      to: 12
      label: '+6'
    - from: 12
      to: 18
      label: '+6'
    - from: 18
      to: 24
      label: '+6'
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Mark the first number in both skip-counting lists.
    goals:
    - prompt: Skip count by 4 and by 6.
      target: 12
      mistakes:
      - when:
          v: 24
        say: '24 is in both lists, but 12 comes first: 4, 8, 12 and 6, 12.'
      - when:
          v: 10
        say: 4 + 6 adds them. Is 10 in the 4 list?
    - prompt: Skip count by 3 and by 5.
      target: 15
      mistakes:
      - when:
          v: 8
        say: 3 + 5 = 8, but 8 isn't in the 3 list.
      - when:
          v: 30
        say: 30 is in both, but there's an earlier one.
    - prompt: Skip count by 2 and by 7.
      target: 14
      mistakes:
      - when:
          v: 9
        say: 2 + 7 = 9. Is 9 in the 2 list?
      - when:
          v: 7
        say: '7 is in the 7 list, but 7 is odd: not in the 2 list.'
  items:
  - prompt: What is the 5th multiple of 7?
    answer: '35'
    check: 7*5
    difficulty: 1
    hints:
    - 7, 14, 21, 28, ...
    - 7 × 5.
    solution: 7 × 5 = 35.
    mistakes: {"12": "m5_multiple", "28": "m5_multiple"}
  - prompt: Which is a multiple of 6?
    options:
    - '42'
    - '32'
    - '26'
    - '16'
    answer: '42'
    difficulty: 1
    hints:
    - Is it in the 6 times table?
    - 6 × 7 = 42.
    solution: 6 × 7 = 42.
    mistakes:
      '16': c5_multiples
  - prompt: What is the smallest common multiple of 4 and 6?
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - "List the multiples of 4 and of 6, and find the first number in both lists."
    - 'Multiples of 6: 6, 12.'
    solution: 12 is the first number in both lists.
    mistakes:
      '24': c5_multiples
  - prompt: One tree is watered every 3 days and another every 5 days. Both were watered today. In how many days will both be watered again on the same day?
    answer: '15'
    check: '15'
    difficulty: 2
    hints:
    - Find the smallest common multiple of 3 and 5.
    - 3, 6, 9, 12, 15.
    solution: 15 is the first common multiple of 3 and 5.
    mistakes: {"8": "m5_lcm", "10": "m5_lcm"}
  - prompt: How many multiples of 5 are there from 1 to 50?
    answer: '10'
    check: 50/5
    difficulty: 2
    hints:
    - "Count in fives from 5 up to 50 and keep a tally of how many you say."
    - 50 ÷ 5.
    solution: 50 ÷ 5 = 10 multiples.
    mistakes: {"5": "m5_count_multiples", "9": "m5_count_multiples"}
  - prompt: Which number is a multiple of both 2 and 3?
    options:
    - '18'
    - '14'
    - '15'
    - '20'
    answer: '18'
    difficulty: 1
    hints:
    - It must be even and in the 3 table.
    - 18 = 2 × 9 = 3 × 6.
    solution: 18 is a multiple of both 2 and 3.
    mistakes: {"14": "m5_both_multiple"}
