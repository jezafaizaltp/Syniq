# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 7
title: Shapes and Patterns
tips:
  c5_shape_count: Count edges or corners one at a time, marking each as you go so you don't count it twice.
  m5_alternate: "The pattern takes turns between two things. Look at the last one and say what comes after it."
  m5_cube_face: "Every face of a dice is flat with 4 equal sides."
  m5_cube_faces: "Think of a dice: top, bottom, front, back, left, right."
  m5_doubling: "Each number is double the one before: 2, 4, 8, 16. It is not adding 2."
  m5_hexagon: "Hexa- means six, like a honeycomb cell. Penta- is five, octa- is eight."
  m5_no_corners: "Trace each shape with your finger. Which one never turns a corner?"
  m5_nth_term: "The numbers are the 3 times table: 1st is 3 × 1, 2nd is 3 × 2. What is the 10th?"
  m5_pattern_rule: "Find the rule: what happens each time from one number to the next? Apply that same rule once more."
  m5_pentagon: "Penta- means five. A pentagon has as many corners as sides."
  c5m7_sides: Run your finger round the shape and count each straight side. Corners are where two sides meet.
  c5m7_solid: Imagine holding the solid. Count the flat faces, then the edges where faces meet, then the pointy corners.
  c5m7_face: Look at one flat face on its own. What flat shape is it?
  c5m7_rule: Find what changes from one term to the next. Is it the same jump each time, or does it double?
  c5m7_repeat: Find the smallest block that repeats, then count along in blocks.
  c5m7_sticks: The first square needs 4 sticks. Each new square shares one side with the one before.
concepts:
- code: cbse5m.shape.flat
  title: Flat shapes and their parts
  notes: |
    2D shapes: triangle (3 sides, 3 corners), square (4 equal sides, 4 right angles), rectangle (opposite sides equal,
    4 right angles), pentagon (5), hexagon (6), circle (no corners). 3D shapes: cube (6 faces, 12 edges, 8 corners),
    cuboid (6 faces), cylinder, cone, sphere. Faces of 3D shapes are 2D shapes.
  explanations:
    text: 'Flat shapes have sides and corners. Count them to name the shape: 3 sides is a triangle, 5 a pentagon, 6 a hexagon. Solid shapes like a cube have faces, edges and corners.'
    visual: 'Draw a triangle, square, pentagon and hexagon in a row. Under each write its number of sides: 3, 4, 5, 6.'
    step_by_step: 'Step 1: Count the sides. Step 2: Name the shape from the count. Step 3: For solids, count faces, then edges, then corners.'
    real_world: Floor tiles, honeycombs (hexagons), dice (cubes), and ice-cream cones are shapes around us.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Triangle
      - Pentagon
      - Hexagon
    - title: Sides and corners
      points:
      - 3 and 3
      - 5 and 5
      - 6 and 6
    alt: A triangle has 3 sides and 3 corners, a pentagon 5 and 5, a hexagon 6 and 6.
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Triangle
    - Square
    - Pentagon
    - Hexagon
    - Circle
    items:
    - label: 3 corners
      bin: Triangle
      clue: Count the corners.
      why: 3 corners, 3 sides.
    - label: A samosa from the side
      bin: Triangle
      clue: How many sides?
      why: 3 sides.
    - label: 4 equal sides and 4 square corners
      bin: Square
      clue: All sides the same.
      why: A square.
    - label: A carrom board
      bin: Square
      clue: Four equal sides, corners like a book's.
      why: A square.
    - label: 5 sides
      bin: Pentagon
      clue: One more than 4.
      why: A pentagon.
    - label: A cell of a honeycomb
      bin: Hexagon
      clue: 'Count the sides: 6.'
      why: A hexagon.
    - label: 6 corners
      bin: Hexagon
      clue: Count them.
      why: A hexagon.
    - label: No corners at all
      bin: Circle
      clue: Perfectly round.
      why: A circle.
    - label: A bangle
      bin: Circle
      clue: Round all the way.
      why: A circle.
  lesson:
    - teach: Flat (2D) shapes are named by their sides. Triangle 3 sides, square 4 equal sides, rectangle 4 sides with opposite sides equal, pentagon 5, hexagon 6. A circle has no straight sides and no corners.
      picture:
        kind: compare
        columns:
        - title: Few sides
          points:
          - 'Triangle: 3'
          - 'Square: 4'
          - 'Rectangle: 4'
        - title: More sides
          points:
          - 'Pentagon: 5'
          - 'Hexagon: 6'
          - 'Circle: none'
        alt: Flat shapes grouped by number of sides.
      check:
        prompt: How many sides does a pentagon have?
        options:
        - '5'
        - '6'
        - '4'
        answer: '5'
        why: '''Penta'' means five.'
      ways:
      - style: step_by_step
        teach: 'Name a flat shape. Step 1: Run your finger round it and count the straight sides. Step 2: 3 sides: triangle. 4 sides: check if all are equal (square) or only opposite ones (rectangle). 5: pentagon. 6: hexagon. Step 3: No straight sides at all: circle.'
      - style: real_world
        teach: 'Look around: a road sign for ''stop'' in many countries has 8 sides, a honeycomb cell has 6, a slice of sandwich cut corner to corner is a triangle, and a coin is a circle.'
    - teach: Solid (3D) shapes take up space. A cube has 6 square faces, 12 edges and 8 corners. A cuboid (like a brick) also has 6 faces, 12 edges and 8 corners, but its faces are rectangles.
      check:
        prompt: How many corners does a cube have?
        options:
        - '8'
        - '6'
        - '12'
        answer: '8'
        why: 4 on top and 4 on the bottom.
      ways:
      - style: visual
        teach: 'A cube and a cuboid compared: same counts, different faces.'
        picture:
          kind: compare
          columns:
          - title: Cube (like a dice)
            points:
            - 6 faces, all squares
            - 12 edges
            - 8 corners
          - title: Cuboid (like a brick)
            points:
            - 6 faces, rectangles
            - 12 edges
            - 8 corners
          alt: A cube, like a dice, has 6 square faces, 12 edges and 8 corners. A cuboid, like a brick, has 6 rectangle faces, 12 edges and 8 corners.
      - style: real_world
        teach: 'Pick up a matchbox. Count its flat faces: top, bottom, front, back and two ends make 6. The lines where two faces meet are its 12 edges, and the pointy places are its 8 corners.'
    - teach: 'Other solids: a cylinder (like a tin) has 2 flat circle faces and a curved side; a cone (like an ice-cream cone) has 1 circle face and a point; a sphere (like a ball) is curved all over.'
      check:
        prompt: Which solid has no flat faces?
        options:
        - Sphere
        - Cylinder
        - Cube
        answer: Sphere
        why: A ball is curved everywhere.
      ways:
      - style: visual
        teach: Three curved solids and what makes each one different.
        picture:
          kind: compare
          columns:
          - title: Cylinder
            points:
            - 2 flat circle faces
            - 1 curved side
            - Like a tin
          - title: Cone
            points:
            - 1 flat circle face
            - 1 point
            - Like a birthday hat
          - title: Sphere
            points:
            - No flat faces
            - Curved all over
            - Like a ball
          alt: A cylinder, like a tin, has 2 flat circle faces and a curved side. A cone, like a birthday hat, has 1 flat circle face and a point. A sphere, like a ball, has no flat faces and is curved all over.
      - style: real_world
        teach: Try rolling and stacking. A sphere rolls any way and cannot be stacked. A cylinder rolls on its side but stands still on a flat face, so tins stack neatly. A cone rolls round in a circle.
  items:
  - prompt: How many sides does a hexagon have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Hex means six.
    - Think of a honeycomb cell.
    solution: A hexagon has 6 sides.
    mistakes: {"5": "m5_hexagon", "8": "m5_hexagon"}
  - prompt: How many faces does a cube have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Think of a dice.
    - Numbers 1 to 6.
    solution: A cube has 6 faces.
    mistakes: {"4": "m5_cube_faces", "8": "m5_cube_faces"}
  - prompt: How many edges does a cube have?
    answer: '12'
    check: 4+4+4
    difficulty: 2
    hints:
    - 4 on top, 4 on the bottom.
    - Plus 4 standing up.
    solution: 4 + 4 + 4 = 12 edges.
    mistakes:
      '8': c5_shape_count
  - prompt: Which shape has no corners?
    options:
    - circle
    - triangle
    - square
    - pentagon
    answer: circle
    difficulty: 1
    hints:
    - It is perfectly round.
    - Like a coin.
    solution: A circle has no corners.
    mistakes: {"pentagon": "m5_no_corners"}
  - prompt: What shape is each face of a cube?
    options:
    - square
    - triangle
    - circle
    - hexagon
    answer: square
    difficulty: 1
    hints:
    - Look at a dice.
    - All sides equal.
    solution: Each face of a cube is a square.
    mistakes: {"circle": "m5_cube_face"}
  - prompt: How many corners does a pentagon have?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Same as its sides.
    - Penta means five.
    solution: A pentagon has 5 corners.
    mistakes: {"6": "m5_pentagon", "4": "m5_pentagon"}
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - '''Tri'' means three.'
    - Count the straight sides.
    solution: 'Step 1: a triangle has three straight sides. Step 2: 3.'
    mistakes:
      '4': c5m7_sides
      '2': c5m7_sides
  - prompt: How many corners does a hexagon have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - A hexagon has 6 sides.
    - Each side meets the next at a corner.
    solution: 'Step 1: 6 sides. Step 2: 6 corners.'
    mistakes:
      '5': c5m7_sides
      '8': c5m7_sides
  - prompt: Which shape has 4 equal sides and 4 right angles?
    options:
    - Square
    - Rectangle
    - Pentagon
    answer: Square
    difficulty: 1
    hints:
    - All four sides are the same length.
    - A rectangle has only opposite sides equal.
    solution: 'Step 1: 4 equal sides and right angles. Step 2: that is a square.'
    mistakes:
      Rectangle: c5m7_sides
      Pentagon: c5m7_sides
  - prompt: 'A brick is shaped like a:'
    options:
    - Cuboid
    - Cube
    - Cylinder
    answer: Cuboid
    difficulty: 1
    hints:
    - Its faces are rectangles, not all squares.
    - It has 6 flat faces.
    solution: 'Step 1: a brick has 6 rectangle faces. Step 2: it is a cuboid.'
    mistakes:
      Cube: c5m7_face
      Cylinder: c5m7_solid
  - prompt: What shape is each flat face of a cylinder?
    options:
    - Circle
    - Square
    - Triangle
    answer: Circle
    difficulty: 2
    hints:
    - Think of the top of a tin.
    - Is it round or pointed?
    solution: 'Step 1: the top and bottom of a tin are flat. Step 2: they are circles.'
    mistakes:
      Square: c5m7_face
      Triangle: c5m7_face
  - prompt: How many faces does a cuboid have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Top, bottom, front, back...
    - '...left and right.'
    solution: 'Step 1: top, bottom, front, back, left, right. Step 2: 6 faces.'
    mistakes:
      '4': c5m7_solid
      '8': c5m7_solid
      '12': c5m7_solid
  - prompt: How many sides do 2 triangles and 1 square have altogether?
    answer: '10'
    check: 2*3+4
    difficulty: 2
    hints:
    - Each triangle has 3 sides.
    - Add the square's 4.
    solution: 'Step 1: 3 + 3 = 6. Step 2: 6 + 4 = 10.'
    mistakes:
      '7': c5m7_sides
      '9': c5m7_sides
  - prompt: Which solid has exactly one flat face and one point?
    options:
    - Cone
    - Cylinder
    - Sphere
    answer: Cone
    difficulty: 2
    hints:
    - Think of a birthday cap.
    - It stands on a circle and has a tip.
    solution: 'Step 1: one circle face and a tip. Step 2: that is a cone.'
    mistakes:
      Cylinder: c5m7_solid
      Sphere: c5m7_solid
  - prompt: A cube has 6 faces. How many faces do 3 separate cubes have in all?
    answer: '18'
    check: 6*3
    difficulty: 3
    hints:
    - Each cube has 6 faces.
    - Multiply by the number of cubes.
    solution: 'Step 1: 6 × 3. Step 2: = 18 faces.'
    mistakes:
      '9': c5m7_solid
      '36': c5m7_solid
  - prompt: 'Case: A child builds a model with 2 cubes and 1 cylinder, not stuck together. How many flat faces are there in all?'
    options:
    - '14'
    - '12'
    - '9'
    answer: '14'
    hints:
    - How many flat faces does one cube have?
    - How many flat faces does a cylinder have? Its curved side is not flat.
    solution: 'Each cube has 6 faces: 2 × 6 = 12. A cylinder has 2 flat circle faces. In all 12 + 2 = 14.'
    mistakes:
      '12': c5m7_solid
      '9': c5m7_solid
    exam: case
    difficulty: 2
  - prompt: 'Situation: A tile has 6 straight sides of equal length. Which shape is it?'
    options:
    - Hexagon
    - Pentagon
    - Rectangle
    answer: Hexagon
    hints:
    - Count the sides.
    - Which shape name goes with that number of sides?
    solution: A flat shape with 6 straight sides is a hexagon.
    mistakes:
      Pentagon: c5m7_sides
      Rectangle: c5m7_sides
    exam: competency
    difficulty: 2
- code: cbse5m.shape.pattern
  title: Growing and repeating patterns
  after:
  - cbse5m.shape.flat
  notes: |
    Repeating patterns repeat a unit: ▲●▲●... Growing patterns change by a rule: 1, 4, 7, 10 (add 3). Matchstick
    patterns: one square needs 4 sticks, each extra square in a row needs 3 more (n squares: 3n + 1). Find the rule,
    then predict the next or the 10th term.
  explanations:
    text: A pattern follows a rule. In a repeating pattern, a group repeats again and again. In a growing pattern, each step adds or changes by the same rule. Once you find the rule, you can predict what comes next.
    visual: 'Draw squares in a row with matchsticks: 1 square 4 sticks, 2 squares 7 sticks, 3 squares 10 sticks. Each new square adds 3 sticks.'
    step_by_step: 'Step 1: Look at the first few terms. Step 2: Find what changes each time. Step 3: Use that rule to find the next term.'
    real_world: Rangoli designs, bead necklaces and border patterns on saris follow patterns.
  picture:
    kind: number_line
    from: 0
    to: 14
    step: 1
    points:
    - at: 4
      label: 1 sq
    - at: 7
      label: 2 sq
    - at: 10
      label: 3 sq
    - at: 13
      label: 4 sq
    alt: 'Matchsticks for a row of squares: 4, 7, 10, 13, adding 3 for each new square.'
    jumps:
    - from: 4
      to: 7
      label: '+3'
    - from: 7
      to: 10
      label: '+3'
    - from: 10
      to: 13
      label: '+3'
  activity:
    type: formula
    prompt: Squares in a row made of matchsticks. The first square uses 4 sticks.
    inputs:
    - name: n
      label: Squares in the row
      min: 1
      max: 20
      step: 1
      start: 1
    outputs:
    - name: m
      label: Matchsticks
      expr: 3*n+1
    goals:
    - prompt: Use exactly 13 matchsticks.
      want:
        m: 13
      mistakes:
      - when:
          n: 3
        say: 3 squares use 10 sticks. Each new square adds 3.
      - when:
          n:
          - 5
          - 20
        say: Too many sticks. Each square shares a side with the one before.
    - prompt: Use exactly 31 matchsticks.
      want:
        m: 31
      mistakes:
      - when:
          n: 7
        say: 31 ÷ 4 counts 4 sticks for every square. Neighbours share a stick, so each new one needs only 3.
    - prompt: Use exactly 61 matchsticks.
      want:
        m: 61
      mistakes:
      - when:
          n: 15
        say: 15 squares use 46 sticks. Shared sides mean you can make more.
      - when:
          n: 19
        say: 19 squares use 58. One more square.
  lesson:
    - teach: 'A repeating pattern repeats the same block again and again: ▲●▲●▲●. The block here is ▲●. To find what comes later, count along in blocks.'
      check:
        prompt: In ★★○★★○★★..., what comes next?
        options:
        - ○
        - ★
        - ▲
        answer: ○
        why: The block ★★○ repeats; after two stars comes a circle.
      ways:
      - style: step_by_step
        teach: 'Find the 11th shape in ■■●■■●. Step 1: Find the block: ■■● has 3 shapes. Step 2: 3 full blocks reach the 9th shape. Step 3: The 10th and 11th are the first two of the next block: ■ and ■. So the 11th shape is ■.'
      - style: visual
        teach: The pattern ■ ■ ● counted along in blocks of three shapes.
        picture:
          kind: flow
          steps:
          - The block is ■ ■ ●
          - 'Places 1 to 3: ■ ■ ●'
          - 'Places 4 to 6: ■ ■ ●'
          - 'Places 7 to 9: ■ ■ ●'
          - 'Places 10 and 11: ■ ■'
          alt: The block is square, square, circle. Places 1 to 3, 4 to 6 and 7 to 9 each repeat the block. Places 10 and 11 are square and square.
    - teach: 'A growing pattern changes by a rule. 1, 4, 7, 10: add 3 each time. 2, 4, 8, 16: double each time. 50, 45, 40: take away 5. Find the rule, then use it.'
      picture:
        kind: flow
        steps:
        - '1'
        - +3 → 4
        - +3 → 7
        - +3 → 10
        - +3 → 13
        alt: A growing pattern where 3 is added each time.
      check:
        prompt: What is the rule in 5, 10, 20, 40?
        options:
        - Double each time
        - Add 5 each time
        - Add 10 each time
        answer: Double each time
        why: 5 × 2 = 10, 10 × 2 = 20, 20 × 2 = 40.
      ways:
      - style: visual
        teach: Three growing patterns and the rule for each.
        picture:
          kind: compare
          columns:
          - title: Add the same each time
            points:
            - '5, 9, 13, 17: add 4'
          - title: Double each time
            points:
            - '3, 6, 12, 24: double'
          - title: Take away each time
            points:
            - '60, 54, 48: take away 6'
          alt: 5, 9, 13, 17 adds 4 each time. 3, 6, 12, 24 doubles each time. 60, 54, 48 takes away 6 each time.
      - style: step_by_step
        teach: 'Find the rule for 7, 12, 17, 22. Step 1: Find the jump between neighbours: 12 − 7 = 5, 17 − 12 = 5. Step 2: The jump is the same, so the rule is ''add 5''. Step 3: Use it: the next number is 27.'
    - teach: 'Matchstick squares in a row: 1 square needs 4 sticks. Each new square shares a side, so it needs only 3 more. 2 squares: 7 sticks; 3 squares: 10 sticks.'
      check:
        prompt: How many sticks for 4 squares in a row?
        options:
        - '13'
        - '16'
        - '12'
        answer: '13'
        why: 4 + 3 + 3 + 3 = 13.
      ways:
      - style: visual
        teach: 'Matchsticks for squares in a row: 4 for the first, then 3 more each.'
        picture:
          kind: bars
          bars:
          - label: 1 square
            value: 4
          - label: 2 squares
            value: 7
          - label: 3 squares
            value: 10
          alt: 1 square needs 4 matchsticks, 2 squares need 7, and 3 squares need 10. Each new square adds 3.
      - style: real_world
        teach: Fencing a row of square garden plots works the same way. The first plot needs 4 fence sides. Each new plot next to it shares one side, so it needs only 3 new sides.
  items:
  - prompt: 'What comes next: 1, 4, 7, 10, ...?'
    answer: '13'
    check: 10+3
    difficulty: 1
    hints:
    - The numbers go up by 3.
    - 10 + 3.
    solution: 'Add 3 each time: 13.'
    mistakes: {"11": "m5_pattern_rule", "14": "m5_pattern_rule"}
  - prompt: 'What comes next: ▲ ● ▲ ● ▲ ...?'
    options:
    - ●
    - ▲
    - ■
    - ★
    answer: ●
    difficulty: 1
    hints:
    - The pattern repeats two shapes.
    - After ▲ comes ●.
    solution: The unit ▲● repeats, so ● is next.
    mistakes: {"▲": "m5_alternate"}
  - prompt: One square needs 4 matchsticks; each extra square in a row needs 3 more. How many sticks for 5 squares?
    answer: '16'
    check: 3*5+1
    difficulty: 2
    hints:
    - 4 + 3 + 3 + 3 + 3.
    - Or 3 × 5 + 1.
    solution: 3 × 5 + 1 = 16 sticks.
    mistakes:
      '20': c5_shape_count
  - prompt: 'What comes next: 2, 4, 8, 16, ...?'
    answer: '32'
    check: 16*2
    difficulty: 1
    hints:
    - Each number doubles.
    - 16 × 2.
    solution: 16 × 2 = 32.
    mistakes: {"18": "m5_doubling", "24": "m5_doubling"}
  - prompt: 'What comes next: 50, 45, 40, 35, ...?'
    answer: '30'
    check: 35-5
    difficulty: 1
    hints:
    - Each number is 5 less.
    - 35 − 5.
    solution: 35 − 5 = 30.
    mistakes: {"25": "m5_pattern_rule", "40": "m5_pattern_rule"}
  - prompt: In the pattern 3, 6, 9, 12, ..., what is the 10th number?
    answer: '30'
    check: 3*10
    difficulty: 2
    hints:
    - These are the 3 times table.
    - 3 × 10.
    solution: The 10th term is 3 × 10 = 30.
    mistakes: {"13": "m5_nth_term", "33": "m5_nth_term"}
  - prompt: 'What comes next: 3, 8, 13, 18, ...?'
    answer: '23'
    check: 18+5
    difficulty: 1
    hints:
    - Find the jump between numbers.
    - Add that jump to 18.
    solution: 'Step 1: the jump is 5. Step 2: 18 + 5 = 23.'
    mistakes:
      '21': c5m7_rule
      '36': c5m7_rule
  - prompt: 'What comes next: 1, 3, 9, 27, ...?'
    answer: '81'
    check: 27*3
    difficulty: 2
    hints:
    - The jumps grow fast.
    - Each number is 3 times the one before.
    solution: 'Step 1: rule is × 3. Step 2: 27 × 3 = 81.'
    mistakes:
      '36': c5m7_rule
      '54': c5m7_rule
  - prompt: 'What comes next: 100, 90, 80, 70, ...?'
    answer: '60'
    check: 70-10
    difficulty: 1
    hints:
    - The numbers are getting smaller.
    - By how much each time?
    solution: 'Step 1: take away 10. Step 2: 70 − 10 = 60.'
    mistakes:
      '80': c5m7_rule
      '65': c5m7_rule
  - prompt: In ●■■●■■●■■..., what is the 10th shape?
    options:
    - ●
    - ■
    - ▲
    answer: ●
    difficulty: 3
    hints:
    - The block ●■■ has 3 shapes.
    - Shapes 1, 4, 7, 10 start each block.
    solution: 'Step 1: blocks start at 1, 4, 7, 10. Step 2: each block starts with ●.'
    mistakes:
      ■: c5m7_repeat
      ▲: c5m7_repeat
  - prompt: How many matchsticks for 6 squares in a row?
    answer: '19'
    check: 3*6+1
    difficulty: 2
    hints:
    - 'First square: 4 sticks.'
    - Each of the other 5 squares adds 3.
    solution: 'Step 1: 4 + 5 × 3. Step 2: = 4 + 15 = 19.'
    mistakes:
      '24': c5m7_sticks
      '18': c5m7_sticks
  - prompt: In the pattern 4, 8, 12, 16, ..., what is the 10th number?
    answer: '40'
    check: 4*10
    difficulty: 2
    hints:
    - These are the 4 times table.
    - The 10th one is 4 × 10.
    solution: 'Step 1: nth number = 4 × n. Step 2: 4 × 10 = 40.'
    mistakes:
      '20': c5m7_rule
      '36': c5m7_rule
  - prompt: 'What is missing: 2, 5, ?, 11, 14?'
    answer: '8'
    check: 5+3
    difficulty: 2
    hints:
    - Look at 11 to 14.
    - The same jump each time.
    solution: 'Step 1: the jump is 3. Step 2: 5 + 3 = 8.'
