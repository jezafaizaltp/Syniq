# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 7
title: Shapes and Patterns
tips:
  c5_shape_count: Count edges or corners one at a time, marking each as you go so you don't count it twice.
  m5_alternate: "The pattern takes turns between two things. Look at the last one and say what comes after it."
  m5_cube_face: "Every face of a dice is flat with 4 equal sides."
  m5_cube_faces: "Think of a dice: top, bottom, front, back, left, right."
  m5_doubling: "Each number is double the one before: 2, 4, 8, 16. It is not adding 2."
  m5_hexagon: "Hexa- means six, like a honeycomb cell. Penta- is five, octa- is eight."
  m5_no_corners: "Trace each shape with your finger. Which one never turns a corner?"
  m5_nth_term: "The numbers are the 3 times table: 1st is 3 × 1, 2nd is 3 × 2. What is the 10th?"
  m5_pattern_rule: "Find the rule: what happens each time from one number to the next? Apply that same rule once more."
  m5_pentagon: "Penta- means five. A pentagon has as many corners as sides."
concepts:
- code: cbse5m.shape.flat
  title: Flat shapes and their parts
  notes: |
    2D shapes: triangle (3 sides, 3 corners), square (4 equal sides, 4 right angles), rectangle (opposite sides equal,
    4 right angles), pentagon (5), hexagon (6), circle (no corners). 3D shapes: cube (6 faces, 12 edges, 8 corners),
    cuboid (6 faces), cylinder, cone, sphere. Faces of 3D shapes are 2D shapes.
  explanations:
    text: 'Flat shapes have sides and corners. Count them to name the shape: 3 sides is a triangle, 5 a pentagon, 6 a hexagon. Solid shapes like a cube have faces, edges and corners.'
    visual: 'Draw a triangle, square, pentagon and hexagon in a row. Under each write its number of sides: 3, 4, 5, 6.'
    step_by_step: 'Step 1: Count the sides. Step 2: Name the shape from the count. Step 3: For solids, count faces, then edges, then corners.'
    real_world: Floor tiles, honeycombs (hexagons), dice (cubes), and ice-cream cones are shapes around us.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Triangle
      - Pentagon
      - Hexagon
    - title: Sides and corners
      points:
      - 3 and 3
      - 5 and 5
      - 6 and 6
    alt: A triangle has 3 sides and 3 corners, a pentagon 5 and 5, a hexagon 6 and 6.
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Triangle
    - Square
    - Pentagon
    - Hexagon
    - Circle
    items:
    - label: 3 corners
      bin: Triangle
      clue: Count the corners.
      why: 3 corners, 3 sides.
    - label: A samosa from the side
      bin: Triangle
      clue: How many sides?
      why: 3 sides.
    - label: 4 equal sides and 4 square corners
      bin: Square
      clue: All sides the same.
      why: A square.
    - label: A carrom board
      bin: Square
      clue: Four equal sides, corners like a book's.
      why: A square.
    - label: 5 sides
      bin: Pentagon
      clue: One more than 4.
      why: A pentagon.
    - label: A cell of a honeycomb
      bin: Hexagon
      clue: 'Count the sides: 6.'
      why: A hexagon.
    - label: 6 corners
      bin: Hexagon
      clue: Count them.
      why: A hexagon.
    - label: No corners at all
      bin: Circle
      clue: Perfectly round.
      why: A circle.
    - label: A bangle
      bin: Circle
      clue: Round all the way.
      why: A circle.
  items:
  - prompt: How many sides does a hexagon have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Hex means six.
    - Think of a honeycomb cell.
    solution: A hexagon has 6 sides.
    mistakes: {"5": "m5_hexagon", "8": "m5_hexagon"}
  - prompt: How many faces does a cube have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Think of a dice.
    - Numbers 1 to 6.
    solution: A cube has 6 faces.
    mistakes: {"4": "m5_cube_faces", "8": "m5_cube_faces"}
  - prompt: How many edges does a cube have?
    answer: '12'
    check: 4+4+4
    difficulty: 2
    hints:
    - 4 on top, 4 on the bottom.
    - Plus 4 standing up.
    solution: 4 + 4 + 4 = 12 edges.
    mistakes:
      '8': c5_shape_count
  - prompt: Which shape has no corners?
    options:
    - circle
    - triangle
    - square
    - pentagon
    answer: circle
    difficulty: 1
    hints:
    - It is perfectly round.
    - Like a coin.
    solution: A circle has no corners.
    mistakes: {"pentagon": "m5_no_corners"}
  - prompt: What shape is each face of a cube?
    options:
    - square
    - triangle
    - circle
    - hexagon
    answer: square
    difficulty: 1
    hints:
    - Look at a dice.
    - All sides equal.
    solution: Each face of a cube is a square.
    mistakes: {"circle": "m5_cube_face"}
  - prompt: How many corners does a pentagon have?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Same as its sides.
    - Penta means five.
    solution: A pentagon has 5 corners.
    mistakes: {"6": "m5_pentagon", "4": "m5_pentagon"}
- code: cbse5m.shape.pattern
  title: Growing and repeating patterns
  after:
  - cbse5m.shape.flat
  notes: |
    Repeating patterns repeat a unit: ▲●▲●... Growing patterns change by a rule: 1, 4, 7, 10 (add 3). Matchstick
    patterns: one square needs 4 sticks, each extra square in a row needs 3 more (n squares: 3n + 1). Find the rule,
    then predict the next or the 10th term.
  explanations:
    text: A pattern follows a rule. In a repeating pattern, a group repeats again and again. In a growing pattern, each step adds or changes by the same rule. Once you find the rule, you can predict what comes next.
    visual: 'Draw squares in a row with matchsticks: 1 square 4 sticks, 2 squares 7 sticks, 3 squares 10 sticks. Each new square adds 3 sticks.'
    step_by_step: 'Step 1: Look at the first few terms. Step 2: Find what changes each time. Step 3: Use that rule to find the next term.'
    real_world: Rangoli designs, bead necklaces and border patterns on saris follow patterns.
  picture:
    kind: number_line
    from: 0
    to: 14
    step: 1
    points:
    - at: 4
      label: 1 sq
    - at: 7
      label: 2 sq
    - at: 10
      label: 3 sq
    - at: 13
      label: 4 sq
    alt: 'Matchsticks for a row of squares: 4, 7, 10, 13, adding 3 for each new square.'
    jumps:
    - from: 4
      to: 7
      label: '+3'
    - from: 7
      to: 10
      label: '+3'
    - from: 10
      to: 13
      label: '+3'
  activity:
    type: formula
    prompt: Squares in a row made of matchsticks. The first square uses 4 sticks.
    inputs:
    - name: n
      label: Squares in the row
      min: 1
      max: 20
      step: 1
      start: 1
    outputs:
    - name: m
      label: Matchsticks
      expr: 3*n+1
    goals:
    - prompt: Use exactly 13 matchsticks.
      want:
        m: 13
      mistakes:
      - when:
          n: 3
        say: 3 squares use 10 sticks. Each new square adds 3.
      - when:
          n:
          - 5
          - 20
        say: Too many sticks. Each square shares a side with the one before.
    - prompt: Use exactly 31 matchsticks.
      want:
        m: 31
      mistakes:
      - when:
          n: 7
        say: 31 ÷ 4 counts 4 sticks for every square. Neighbours share a stick, so each new one needs only 3.
    - prompt: Use exactly 61 matchsticks.
      want:
        m: 61
      mistakes:
      - when:
          n: 15
        say: 15 squares use 46 sticks. Shared sides mean you can make more.
      - when:
          n: 19
        say: 19 squares use 58. One more square.
  items:
  - prompt: 'What comes next: 1, 4, 7, 10, ...?'
    answer: '13'
    check: 10+3
    difficulty: 1
    hints:
    - The numbers go up by 3.
    - 10 + 3.
    solution: 'Add 3 each time: 13.'
    mistakes: {"11": "m5_pattern_rule", "14": "m5_pattern_rule"}
  - prompt: 'What comes next: ▲ ● ▲ ● ▲ ...?'
    options:
    - ●
    - ▲
    - ■
    - ★
    answer: ●
    difficulty: 1
    hints:
    - The pattern repeats two shapes.
    - After ▲ comes ●.
    solution: The unit ▲● repeats, so ● is next.
    mistakes: {"▲": "m5_alternate"}
  - prompt: One square needs 4 matchsticks; each extra square in a row needs 3 more. How many sticks for 5 squares?
    answer: '16'
    check: 3*5+1
    difficulty: 2
    hints:
    - 4 + 3 + 3 + 3 + 3.
    - Or 3 × 5 + 1.
    solution: 3 × 5 + 1 = 16 sticks.
    mistakes:
      '20': c5_shape_count
  - prompt: 'What comes next: 2, 4, 8, 16, ...?'
    answer: '32'
    check: 16*2
    difficulty: 1
    hints:
    - Each number doubles.
    - 16 × 2.
    solution: 16 × 2 = 32.
    mistakes: {"18": "m5_doubling", "24": "m5_doubling"}
  - prompt: 'What comes next: 50, 45, 40, 35, ...?'
    answer: '30'
    check: 35-5
    difficulty: 1
    hints:
    - Each number is 5 less.
    - 35 − 5.
    solution: 35 − 5 = 30.
    mistakes: {"25": "m5_pattern_rule", "40": "m5_pattern_rule"}
  - prompt: In the pattern 3, 6, 9, 12, ..., what is the 10th number?
    answer: '30'
    check: 3*10
    difficulty: 2
    hints:
    - These are the 3 times table.
    - 3 × 10.
    solution: The 10th term is 3 × 10 = 30.
    mistakes: {"13": "m5_nth_term", "33": "m5_nth_term"}
