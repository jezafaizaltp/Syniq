# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 2
title: Fractions
tips:
  c5_frac_parts: The bottom number says how many equal parts the whole is cut into; the top number says how many of those parts you take.
  c5_frac_add: You can only add the tops when the bottoms are the same. Keep the bottom number, add the tops.
concepts:
- code: cbse5m.frac.meaning
  title: Parts of a whole and equal fractions
  notes: |
    A fraction names equal parts of a whole: 3/4 means the whole is cut into 4 equal parts and 3 are taken. The top is the
    numerator, the bottom the denominator. Equivalent fractions name the same amount: 1/2 = 2/4 = 3/6 (multiply top and
    bottom by the same number). Fraction of a group: 1/4 of 20 = 20 ÷ 4 = 5. Comparing fractions with the same top: the
    bigger bottom gives smaller pieces, so 1/5 < 1/3.
  explanations:
    text: 'A fraction tells you how much of something you have. If a roti is cut into 4 equal pieces and you eat 3, you ate 3/4 of it. If you cut the same roti into 8 pieces and eat 6, you ate the same amount: 6/8 = 3/4.'
    visual: 'Draw a rectangle and split it into 4 equal parts. Colour 3 parts: that is 3/4. Now split each part in half: 8 parts with 6 coloured. Same colour, new name: 6/8.'
    step_by_step: 'Step 1: Count the equal parts in the whole (bottom). Step 2: Count the parts taken (top). Step 3: For equal fractions, multiply top and bottom by the same number. Step 4: For a fraction of a group, divide by the bottom, then multiply by the top.'
    real_world: 'Sharing a pizza, half a litre of milk, or a quarter of an hour: fractions are everywhere in the kitchen and the clock.'
  picture:
    kind: number_line
    from: 0
    to: 1
    step: 0.25
    points:
    - at: 0
      label: '0'
    - at: 0.25
      label: 1/4
    - at: 0.5
      label: 1/2 = 2/4
    - at: 0.75
      label: 3/4
    - at: 1
      label: '1'
    alt: A number line from 0 to 1 cut into quarters shows 1/4, 1/2 which equals 2/4, and 3/4.
  activity:
    type: formula
    prompt: A roti is cut into d equal pieces. You take n pieces.
    inputs:
    - name: n
      label: Pieces taken n
      min: 0
      max: 12
      step: 1
      start: 1
    - name: d
      label: Pieces in all d
      min: 1
      max: 12
      step: 1
      start: 2
    outputs:
    - name: val
      label: Part of the roti (n ÷ d)
      expr: n/d
      places: 2
    goals:
    - prompt: Cut it into 8 pieces. Take half.
      want:
        d: 8
        val: 0.5
      mistakes:
      - when:
          d: 8
          n: 2
        say: 2 out of 8 is a quarter. Half of 8 pieces is 4 pieces.
    - prompt: Cut it into 6 pieces. Take the same amount as 2/3.
      want:
        d: 6
        val: 0.6666666666666666
      mistakes:
      - when:
          d: 6
          n: 2
        say: 2 of 6 pieces is only a third. Each third is 2 pieces, so two thirds is 4.
    - prompt: Cut it into 5 pieces. Take the whole roti.
      want:
        d: 5
        val: 1
      mistakes:
      - when:
          d: 5
          n: 1
        say: 1 piece is one fifth. The whole roti is all 5 pieces.
  items:
  - prompt: A roti is cut into 4 equal pieces and Meena eats 3. What fraction did she eat?
    options:
    - 3/4
    - 1/4
    - 4/3
    - 3/7
    answer: 3/4
    difficulty: 1
    hints:
    - Bottom = all the pieces.
    - Top = pieces eaten.
    solution: 3 of 4 equal pieces is 3/4.
    mistakes:
      4/3: c5_frac_parts
  - prompt: What is 1/4 of 20?
    answer: '5'
    check: Rational(20,4)
    difficulty: 1
    hints:
    - Split 20 into 4 equal groups.
    - 20 ÷ 4.
    solution: 20 ÷ 4 = 5.
  - prompt: What is 3/4 of 20?
    answer: '15'
    check: Rational(3,4)*20
    difficulty: 2
    hints:
    - First find 1/4 of 20.
    - 5 × 3.
    solution: 1/4 of 20 is 5, so 3/4 is 15.
    mistakes:
      '5': c5_frac_parts
  - prompt: 'Fill in: 1/2 = ?/8'
    answer: '4'
    check: Rational(1,2)*8
    difficulty: 1
    hints:
    - 2 × 4 = 8.
    - Multiply the top by 4 too.
    solution: 1/2 = 4/8, multiplying top and bottom by 4.
  - prompt: Which is bigger?
    options:
    - 1/3
    - 1/5
    - 1/8
    - 1/10
    answer: 1/3
    difficulty: 1
    hints:
    - Fewer pieces means bigger pieces.
    - 3 is the smallest bottom.
    solution: Cutting into 3 gives the biggest pieces, so 1/3 is biggest.
    mistakes:
      1/10: c5_frac_parts
  - prompt: Which fraction equals 2/3?
    options:
    - 4/6
    - 2/6
    - 3/2
    - 4/3
    answer: 4/6
    difficulty: 2
    hints:
    - Multiply top and bottom by 2.
    - 2×2 / 3×2.
    solution: 2/3 = 4/6.
    mistakes:
      2/6: c5_frac_parts
- code: cbse5m.frac.add
  title: Adding and subtracting like fractions
  after:
  - cbse5m.frac.meaning
  notes: |
    Like fractions have the same denominator. To add or subtract, keep the denominator and add or subtract the numerators:
    2/7 + 3/7 = 5/7; 5/8 − 2/8 = 3/8. A whole is n/n, so 1 − 3/5 = 2/5. Mixed numbers: 7/4 = 1 3/4.
  explanations:
    text: When fractions have the same bottom, the pieces are the same size, so you just count the pieces. 2 sevenths and 3 sevenths make 5 sevenths. The bottom does not change because the size of the pieces does not change.
    visual: 'Draw a bar cut into 7 equal parts. Colour 2 red and 3 blue. Count the coloured parts: 5 of 7, so 5/7.'
    step_by_step: 'Step 1: Check the bottoms are the same. Step 2: Add (or subtract) the tops. Step 3: Keep the same bottom. Step 4: If the top is bigger than the bottom, change it to a mixed number.'
    real_world: If you drink 1/4 litre of milk in the morning and 2/4 litre at night, you drank 3/4 litre in all.
  picture:
    kind: bars
    bars:
    - label: 2/7
      value: 2
    - label: 3/7
      value: 3
    - label: 2/7 + 3/7
      value: 5
    alt: Bars of 2 sevenths and 3 sevenths together make 5 sevenths.
    unit: sevenths
  activity:
    type: formula
    prompt: Write the answer as a fraction n/d.
    inputs:
    - name: n
      label: Top n
      min: 0
      max: 20
      step: 1
      start: 0
    - name: d
      label: Bottom d
      min: 1
      max: 20
      step: 1
      start: 1
    outputs:
    - name: val
      label: n ÷ d
      expr: n/d
      places: 2
    goals:
    - prompt: 2/7 + 3/7
      want:
        n: 5
        d: 7
      mistakes:
      - when:
          n: 5
          d: 14
        say: 'The pieces are still sevenths. Count the pieces: 2 + 3. Don''t add the bottoms.'
    - prompt: 5/8 − 2/8
      want:
        n: 3
        d: 8
      mistakes:
      - when:
          n: 7
          d: 8
        say: 'That adds. Take away: 5 eighths − 2 eighths.'
    - prompt: 4/9 + 5/9
      want:
        val: 1
      mistakes:
      - when:
          n: 9
          d: 18
        say: Ninths stay ninths. 9 ninths make one whole.
      - when:
          n: 1
          d: 9
        say: 'Count again: 4 + 5 pieces.'
  items:
  - prompt: 2/7 + 3/7 = ?
    options:
    - 5/7
    - 5/14
    - 6/7
    - 1/7
    answer: 5/7
    difficulty: 1
    hints:
    - Keep the bottom.
    - Add the tops.
    solution: '2 + 3 = 5 sevenths: 5/7.'
    mistakes:
      5/14: c5_frac_add
  - prompt: 5/8 − 2/8 = ?/8
    answer: '3'
    check: 5-2
    difficulty: 1
    hints:
    - Keep the bottom 8.
    - 5 − 2.
    solution: 5/8 − 2/8 = 3/8.
  - prompt: 1 − 3/5 = ?
    options:
    - 2/5
    - 3/5
    - 2/0
    - 1/5
    answer: 2/5
    difficulty: 1
    hints:
    - 1 whole = 5/5.
    - 5/5 − 3/5.
    solution: 5/5 − 3/5 = 2/5.
  - prompt: Ravi ate 1/4 of a cake and Asha ate 2/4. How much did they eat together?
    options:
    - 3/4
    - 3/8
    - 1/2
    - 2/4
    answer: 3/4
    difficulty: 1
    hints:
    - Same bottom.
    - 1 + 2 = 3.
    solution: 1/4 + 2/4 = 3/4.
    mistakes:
      3/8: c5_frac_add
  - prompt: Write 7/4 as a mixed number.
    options:
    - 1 3/4
    - 1 4/7
    - 7 1/4
    - 3 1/4
    answer: 1 3/4
    difficulty: 2
    hints:
    - 4/4 makes 1 whole.
    - 7 − 4 = 3 left over.
    solution: 7/4 = 4/4 + 3/4 = 1 3/4.
  - prompt: 3/10 + 4/10 + 2/10 = ?
    options:
    - 9/10
    - 9/30
    - '1'
    - 7/10
    answer: 9/10
    difficulty: 2
    hints:
    - Add all the tops.
    - 3 + 4 + 2.
    solution: '3 + 4 + 2 = 9 tenths: 9/10.'
    mistakes:
      9/30: c5_frac_add
