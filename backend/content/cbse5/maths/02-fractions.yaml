# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 2
title: Fractions
tips:
  c5_frac_parts: The bottom number says how many equal parts the whole is cut into; the top number says how many of those parts you take.
  c5_frac_add: You can only add the tops when the bottoms are the same. Keep the bottom number, add the tops.
  m5_equiv_frac: "The bottom changed from 2 to 8. Whatever you multiplied the bottom by, multiply the top 1 by the same."
  m5_frac_subtract: "Same bottoms, so just subtract the tops: 5 take away 2."
  m5_fraction_of: "1/4 of 20 means split 20 into 4 equal parts. How many in one part?"
  m5_mixed: "How many whole 4/4 are in 7/4? What is left over, still in quarters?"
  m5_one_minus: "1 whole = 5/5. Take away 3 fifths. How many fifths are left?"
  c5m2_parts: The bottom number counts all the equal parts. The top number counts the parts you take.
  c5m2_group: To find a fraction of a group, first split the group into as many equal shares as the bottom number says.
  c5m2_equal: Equal fractions come from multiplying the top and the bottom by the same number.
  c5m2_size: With the same top number, more pieces means each piece is smaller.
  c5m2_like: When the bottoms are the same, the pieces are the same size. Only the top numbers change.
  c5m2_whole: A whole cut into n pieces is n/n. Take away from that.
  c5m2_mixed: Count how many full wholes fit, then see what part is left over.
concepts:
- code: cbse5m.frac.meaning
  title: Parts of a whole and equal fractions
  notes: |
    A fraction names equal parts of a whole: 3/4 means the whole is cut into 4 equal parts and 3 are taken. The top is the
    numerator, the bottom the denominator. Equivalent fractions name the same amount: 1/2 = 2/4 = 3/6 (multiply top and
    bottom by the same number). Fraction of a group: 1/4 of 20 = 20 ÷ 4 = 5. Comparing fractions with the same top: the
    bigger bottom gives smaller pieces, so 1/5 < 1/3.
  explanations:
    text: 'A fraction tells you how much of something you have. If a roti is cut into 4 equal pieces and you eat 3, you ate 3/4 of it. If you cut the same roti into 8 pieces and eat 6, you ate the same amount: 6/8 = 3/4.'
    visual: 'Draw a rectangle and split it into 4 equal parts. Colour 3 parts: that is 3/4. Now split each part in half: 8 parts with 6 coloured. Same colour, new name: 6/8.'
    step_by_step: 'Step 1: Count the equal parts in the whole (bottom). Step 2: Count the parts taken (top). Step 3: For equal fractions, multiply top and bottom by the same number. Step 4: For a fraction of a group, divide by the bottom, then multiply by the top.'
    real_world: 'Sharing a pizza, half a litre of milk, or a quarter of an hour: fractions are everywhere in the kitchen and the clock.'
  picture:
    kind: number_line
    from: 0
    to: 1
    step: 0.25
    points:
    - at: 0
      label: '0'
    - at: 0.25
      label: 1/4
    - at: 0.5
      label: 1/2 = 2/4
    - at: 0.75
      label: 3/4
    - at: 1
      label: '1'
    alt: A number line from 0 to 1 cut into quarters shows 1/4, 1/2 which equals 2/4, and 3/4.
  activity:
    type: formula
    prompt: A roti is cut into d equal pieces. You take n pieces.
    inputs:
    - name: n
      label: Pieces taken n
      min: 0
      max: 12
      step: 1
      start: 1
    - name: d
      label: Pieces in all d
      min: 1
      max: 12
      step: 1
      start: 2
    outputs:
    - name: val
      label: Part of the roti (n ÷ d)
      expr: n/d
      places: 2
    goals:
    - prompt: Cut it into 8 pieces. Take half.
      want:
        d: 8
        val: 0.5
      mistakes:
      - when:
          d: 8
          n: 2
        say: 2 out of 8 is a quarter. Half of 8 pieces is 4 pieces.
    - prompt: Cut it into 6 pieces. Take the same amount as 2/3.
      want:
        d: 6
        val: 0.6666666666666666
      mistakes:
      - when:
          d: 6
          n: 2
        say: 2 of 6 pieces is only a third. Each third is 2 pieces, so two thirds is 4.
    - prompt: Cut it into 5 pieces. Take the whole roti.
      want:
        d: 5
        val: 1
      mistakes:
      - when:
          d: 5
          n: 1
        say: 1 piece is one fifth. The whole roti is all 5 pieces.
  lesson:
    - teach: A fraction names equal parts of one whole. In 3/4, the 4 (denominator) says the whole is cut into 4 equal parts, and the 3 (numerator) says we take 3 of them.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: 1/4
        - size: 1
          label: 1/4
        - size: 1
          label: 1/4
        - size: 1
          label: 1/4
        rows:
        - size: 1
          label: roti
        cells:
        - - taken
          - taken
          - taken
          - left
        alt: A roti cut into 4 equal parts with 3 parts taken shows 3/4.
      check:
        prompt: A pizza has 8 equal slices. You eat 3. What fraction did you eat?
        options:
        - 3/8
        - 8/3
        - 5/8
        answer: 3/8
        why: 8 equal parts in all, 3 taken.
      ways:
      - style: step_by_step
        teach: 'Read 2/5. Step 1: Look at the bottom number, 5: the whole is cut into 5 equal parts. Step 2: Look at the top number, 2: we take 2 of those parts. Step 3: Say it: two fifths. Step 4: Check the parts are equal, or it is not a fraction.'
      - style: real_world
        teach: A chocolate bar has 8 equal squares. Eat 5 squares and you have eaten 5/8 of the bar. If the squares were of different sizes, 5 of them would not tell you how much you ate.
    - teach: 'Fraction of a group: to find 1/4 of 20, share 20 into 4 equal groups: 20 ÷ 4 = 5. Then 3/4 of 20 is 3 of those groups: 3 × 5 = 15.'
      check:
        prompt: What is 1/5 of 30?
        options:
        - '6'
        - '5'
        - '25'
        answer: '6'
        why: 30 shared into 5 equal groups gives 6 in each.
      ways:
      - style: visual
        teach: Finding 2/3 of 12 by sharing into equal groups.
        picture:
          kind: compare
          columns:
          - title: Group 1
            points:
            - 4 marbles
          - title: Group 2
            points:
            - 4 marbles
          - title: Group 3
            points:
            - 4 marbles
          alt: 12 marbles shared into 3 equal groups of 4. One third is one group, 4 marbles. Two thirds is two groups, 8 marbles.
      - style: real_world
        teach: 'A class has 30 children and 2/5 of them walk to school. Share 30 into 5 equal groups: 6 in each. Two of those groups walk: 12 children.'
    - teach: 'Different fractions can name the same amount: 1/2 = 2/4 = 4/8. Multiply top and bottom by the same number to get an equal fraction. With the same top, a bigger bottom means smaller pieces: 1/6 is less than 1/3.'
      check:
        prompt: 'Which is bigger: 1/4 or 1/8?'
        options:
        - 1/4
        - 1/8
        - They are equal
        answer: 1/4
        why: Cutting into 4 gives bigger pieces than cutting into 8.
      ways:
      - style: visual
        teach: Two equal fractions shown on one number line.
        picture:
          kind: number_line
          from: 0
          to: 6
          step: 1
          points:
          - at: 0
            label: '0'
          - at: 2
            label: 1/3 = 2/6
          - at: 6
            label: 1 whole
          alt: A strip from 0 to 1 whole, marked in six equal sixths. The mark two sixths along is also one third of the way, so 1/3 equals 2/6.
      - style: real_world
        teach: Cut one pizza into 3 slices and an identical pizza into 6 slices. One slice of the first is the same as two slices of the second. That is why 1/3 = 2/6, and why one sixth is the smaller piece.
  items:
  - prompt: A roti is cut into 4 equal pieces and Meena eats 3. What fraction did she eat?
    options:
    - 3/4
    - 1/4
    - 4/3
    - 3/7
    answer: 3/4
    difficulty: 1
    hints:
    - Bottom = all the pieces.
    - Top = pieces eaten.
    solution: 3 of 4 equal pieces is 3/4.
    mistakes:
      4/3: c5_frac_parts
  - prompt: What is 1/4 of 20?
    answer: '5'
    check: Rational(20,4)
    difficulty: 1
    hints:
    - Split 20 into 4 equal groups.
    - 20 ÷ 4.
    solution: 20 ÷ 4 = 5.
    mistakes: {"4": "m5_fraction_of", "80": "m5_fraction_of"}
  - prompt: What is 3/4 of 20?
    answer: '15'
    check: Rational(3,4)*20
    difficulty: 2
    hints:
    - First find 1/4 of 20.
    - 5 × 3.
    solution: 1/4 of 20 is 5, so 3/4 is 15.
    mistakes:
      '5': c5_frac_parts
  - prompt: 'Fill in: 1/2 = ?/8'
    answer: '4'
    check: Rational(1,2)*8
    difficulty: 1
    hints:
    - 2 × 4 = 8.
    - Multiply the top by 4 too.
    solution: 1/2 = 4/8, multiplying top and bottom by 4.
    mistakes: {"2": "m5_equiv_frac", "7": "m5_equiv_frac"}
  - prompt: Which is bigger?
    options:
    - 1/3
    - 1/5
    - 1/8
    - 1/10
    answer: 1/3
    difficulty: 1
    hints:
    - Fewer pieces means bigger pieces.
    - 3 is the smallest bottom.
    solution: Cutting into 3 gives the biggest pieces, so 1/3 is biggest.
    mistakes:
      1/10: c5_frac_parts
  - prompt: Which fraction equals 2/3?
    options:
    - 4/6
    - 2/6
    - 3/2
    - 4/3
    answer: 4/6
    difficulty: 2
    hints:
    - Multiply top and bottom by 2.
    - 2×2 / 3×2.
    solution: 2/3 = 4/6.
    mistakes:
      2/6: c5_frac_parts
  - prompt: A cake is cut into 6 equal pieces. 5 are eaten. What fraction is left?
    answer: 1/6
    check: 1/6
    difficulty: 1
    hints:
    - How many pieces are not eaten?
    - The bottom number stays 6.
    solution: 'Step 1: 6 − 5 = 1 piece left. Step 2: that is 1/6.'
    mistakes:
      5/6: c5m2_parts
      6/1: c5m2_parts
  - prompt: What is 1/3 of 18?
    answer: '6'
    check: 18//3
    difficulty: 1
    hints:
    - Share 18 into 3 equal groups.
    - How many in each group?
    solution: 'Step 1: 18 ÷ 3. Step 2: = 6.'
    mistakes:
      '3': c5m2_group
      '54': c5m2_group
      '15': c5m2_group
  - prompt: What is 2/5 of 25?
    answer: '10'
    check: 25//5*2
    difficulty: 2
    hints:
    - First find 1/5 of 25.
    - Then take 2 of those.
    solution: 'Step 1: 1/5 of 25 = 5. Step 2: 2 × 5 = 10.'
    mistakes:
      '5': c5m2_group
      '50': c5m2_group
  - prompt: 'Fill in: 3/4 = ?/12'
    answer: '9'
    check: 3*3
    difficulty: 2
    hints:
    - 4 became 12. What was it multiplied by?
    - Multiply the top by the same number.
    solution: 'Step 1: 4 × 3 = 12. Step 2: 3 × 3 = 9, so 3/4 = 9/12.'
    mistakes:
      '3': c5m2_equal
      '11': c5m2_equal
      '6': c5m2_equal
  - prompt: Which fraction is equal to 1/3?
    options:
    - 3/9
    - 3/6
    - 1/6
    answer: 3/9
    difficulty: 2
    hints:
    - Multiply top and bottom of 1/3 by the same number.
    - Try multiplying both by 3.
    solution: 'Step 1: 1 × 3 = 3, 3 × 3 = 9. Step 2: 1/3 = 3/9.'
    mistakes:
      3/6: c5m2_equal
      1/6: c5m2_equal
  - prompt: Which is the smallest?
    options:
    - 1/10
    - 1/5
    - 1/2
    answer: 1/10
    difficulty: 2
    hints:
    - All have top number 1.
    - Which cuts the whole into the most pieces?
    solution: 'Step 1: same top number. Step 2: 10 pieces are the smallest, so 1/10.'
    mistakes:
      1/2: c5m2_size
      1/5: c5m2_size
  - prompt: In a class of 32 children, 1/4 come by bus. How many come by bus?
    answer: '8'
    check: 32//4
    difficulty: 2
    hints:
    - Share 32 into 4 equal groups.
    - One group comes by bus.
    solution: 'Step 1: 32 ÷ 4 = 8. Step 2: 8 children come by bus.'
    mistakes:
      '4': c5m2_group
      '28': c5m2_group
      '128': c5m2_group
  - prompt: A ribbon is 1 m long. Meera cuts off 3/10 of it. Which fraction is left?
    options:
    - 7/10
    - 3/10
    - 1/10
    answer: 7/10
    difficulty: 3
    hints:
    - The whole ribbon is 10/10.
    - Take away 3 tenths.
    solution: 'Step 1: whole = 10/10. Step 2: 10/10 − 3/10 = 7/10.'
    mistakes:
      3/10: c5m2_whole
      1/10: c5m2_whole
  - prompt: Which shows 3/4 of 16?
    answer: '12'
    check: 16//4*3
    difficulty: 3
    hints:
    - First find 1/4 of 16.
    - Then take 3 of those.
    solution: 'Step 1: 16 ÷ 4 = 4. Step 2: 3 × 4 = 12.'
    mistakes:
      '4': c5m2_group
      '13': c5m2_group
      '48': c5m2_group
  - prompt: 'Case: Two friends each have a same-size paratha. One cuts it into 4 equal pieces and eats 2. The other cuts it into 8 equal pieces and eats 4. Who ate more?'
    options:
    - They ate the same amount
    - The one who ate 4 pieces
    - The one who ate 2 pieces
    answer: They ate the same amount
    hints:
    - Write each amount as a fraction.
    - Multiply the top and bottom of the first fraction by 2. What do you get?
    solution: One ate 2/4 and the other ate 4/8. Multiplying 2/4 by 2 on top and bottom gives 4/8, so both ate half a paratha.
    mistakes:
      The one who ate 4 pieces: c5m2_equal
      The one who ate 2 pieces: c5m2_size
    exam: case
    difficulty: 2
  - prompt: 'Situation: There are 24 mangoes in a basket. 3/8 of them are ripe. How many mangoes are ripe?'
    options:
    - '9'
    - '3'
    - '8'
    answer: '9'
    hints:
    - Split 24 into 8 equal groups first.
    - Then take 3 of those groups.
    solution: '24 ÷ 8 = 3 in each group. 3 groups are ripe: 3 × 3 = 9 mangoes.'
    mistakes:
      '3': c5m2_group
      '8': c5m2_group
    exam: competency
    difficulty: 2
- code: cbse5m.frac.add
  title: Adding and subtracting like fractions
  after:
  - cbse5m.frac.meaning
  notes: |
    Like fractions have the same denominator. To add or subtract, keep the denominator and add or subtract the numerators:
    2/7 + 3/7 = 5/7; 5/8 − 2/8 = 3/8. A whole is n/n, so 1 − 3/5 = 2/5. Mixed numbers: 7/4 = 1 3/4.
  explanations:
    text: When fractions have the same bottom, the pieces are the same size, so you just count the pieces. 2 sevenths and 3 sevenths make 5 sevenths. The bottom does not change because the size of the pieces does not change.
    visual: 'Draw a bar cut into 7 equal parts. Colour 2 red and 3 blue. Count the coloured parts: 5 of 7, so 5/7.'
    step_by_step: 'Step 1: Check the bottoms are the same. Step 2: Add (or subtract) the tops. Step 3: Keep the same bottom. Step 4: If the top is bigger than the bottom, change it to a mixed number.'
    real_world: If you drink 1/4 litre of milk in the morning and 2/4 litre at night, you drank 3/4 litre in all.
  picture:
    kind: bars
    bars:
    - label: 2/7
      value: 2
    - label: 3/7
      value: 3
    - label: 2/7 + 3/7
      value: 5
    alt: Bars of 2 sevenths and 3 sevenths together make 5 sevenths.
    unit: sevenths
  activity:
    type: formula
    prompt: Write the answer as a fraction n/d.
    inputs:
    - name: n
      label: Top n
      min: 0
      max: 20
      step: 1
      start: 0
    - name: d
      label: Bottom d
      min: 1
      max: 20
      step: 1
      start: 1
    outputs:
    - name: val
      label: n ÷ d
      expr: n/d
      places: 2
    goals:
    - prompt: 2/7 + 3/7
      want:
        n: 5
        d: 7
      mistakes:
      - when:
          n: 5
          d: 14
        say: 'The pieces are still sevenths. Count the pieces: 2 + 3. Don''t add the bottoms.'
    - prompt: 5/8 − 2/8
      want:
        n: 3
        d: 8
      mistakes:
      - when:
          n: 7
          d: 8
        say: 'That adds. Take away: 5 eighths − 2 eighths.'
    - prompt: 4/9 + 5/9
      want:
        val: 1
      mistakes:
      - when:
          n: 9
          d: 18
        say: Ninths stay ninths. 9 ninths make one whole.
      - when:
          n: 1
          d: 9
        say: 'Count again: 4 + 5 pieces.'
  lesson:
    - teach: 'Like fractions have the same bottom number, so their pieces are the same size. To add them, keep the bottom and add the tops: 2/7 + 3/7 = 5/7.'
      picture:
        kind: flow
        steps:
        - 2/7 + 3/7
        - 'Same bottom: 7'
        - 'Add tops: 2 + 3 = 5'
        - Answer 5/7
        alt: Adding like fractions keeps the bottom and adds the tops.
      check:
        prompt: What is 1/5 + 2/5?
        options:
        - 3/5
        - 3/10
        - 2/5
        answer: 3/5
        why: 'Same bottom, so add the tops: 1 + 2 = 3.'
      ways:
      - style: step_by_step
        teach: 'Add 1/6 + 4/6. Step 1: Check the bottoms are the same: both are sixths. Step 2: Keep the bottom: sixths. Step 3: Add the tops: 1 + 4 = 5. Step 4: The answer is 5/6. Never add the bottoms: the pieces do not change size.'
      - style: real_world
        teach: 'A bar of soap is cut into 8 equal pieces. Use 2 pieces on Monday and 3 on Tuesday, and you have used 5 pieces: 5/8 of the bar. The pieces are still eighths.'
    - teach: 'Subtracting works the same way: keep the bottom, subtract the tops. 5/8 − 2/8 = 3/8. A whole is n/n, so 1 − 3/5 = 5/5 − 3/5 = 2/5.'
      check:
        prompt: What is 1 − 1/4?
        options:
        - 3/4
        - 1/4
        - 0/4
        answer: 3/4
        why: 1 = 4/4, and 4/4 − 1/4 = 3/4.
      ways:
      - style: visual
        teach: Taking 3/5 away from one whole, shown as five equal parts.
        picture:
          kind: compare
          columns:
          - title: One whole
            points:
            - '5/5: five fifths'
          - title: Take away
            points:
            - '3/5: three fifths'
          - title: Left
            points:
            - '2/5: two fifths'
          alt: One whole is five fifths. Take away three fifths and two fifths are left.
      - style: real_world
        teach: A water bottle is full. Drink 4/10 of it on the way to school. The whole bottle was 10/10, so 10/10 − 4/10 = 6/10 is still left for later.
    - teach: When the top is bigger than the bottom, the fraction is more than one whole. 7/4 = 4/4 + 3/4 = 1 3/4, a mixed number.
      check:
        prompt: Write 5/3 as a mixed number.
        options:
        - 1 2/3
        - 2 1/3
        - 1 5/3
        answer: 1 2/3
        why: 3/3 makes 1 whole and 2/3 is left over.
      ways:
      - style: visual
        teach: Turning 11/4 into a mixed number by counting whole ones.
        picture:
          kind: number_line
          from: 0
          to: 3
          step: 0.25
          points:
          - at: 1
            label: 4/4 = 1
          - at: 2
            label: 8/4 = 2
          - at: 2.75
            label: 11/4 = 2 3/4
          alt: A number line from 0 to 3 in quarters. 4/4 is 1 and 8/4 is 2. 11/4 is three quarters past 2, so it is 2 3/4.
      - style: real_world
        teach: 'You have 7 half-rotis. Two halves make one full roti, so 7 halves make 3 full rotis and one half left: 7/2 = 3 1/2.'
  items:
  - prompt: 2/7 + 3/7 = ?
    options:
    - 5/7
    - 5/14
    - 6/7
    - 1/7
    answer: 5/7
    difficulty: 1
    hints:
    - Keep the bottom.
    - Add the tops.
    solution: '2 + 3 = 5 sevenths: 5/7.'
    mistakes:
      5/14: c5_frac_add
  - prompt: 5/8 − 2/8 = ?/8
    answer: '3'
    check: 5-2
    difficulty: 1
    hints:
    - Keep the bottom 8.
    - 5 − 2.
    solution: 5/8 − 2/8 = 3/8.
    mistakes: {"7": "m5_frac_subtract", "10": "m5_frac_subtract"}
  - prompt: 1 − 3/5 = ?
    options:
    - 2/5
    - 3/5
    - 2/0
    - 1/5
    answer: 2/5
    difficulty: 1
    hints:
    - 1 whole = 5/5.
    - 5/5 − 3/5.
    solution: 5/5 − 3/5 = 2/5.
    mistakes: {"3/5": "m5_one_minus"}
  - prompt: Ravi ate 1/4 of a cake and Asha ate 2/4. How much did they eat together?
    options:
    - 3/4
    - 3/8
    - 1/2
    - 2/4
    answer: 3/4
    difficulty: 1
    hints:
    - Same bottom.
    - 1 + 2 = 3.
    solution: 1/4 + 2/4 = 3/4.
    mistakes:
      3/8: c5_frac_add
  - prompt: Write 7/4 as a mixed number.
    options:
    - 1 3/4
    - 1 4/7
    - 7 1/4
    - 3 1/4
    answer: 1 3/4
    difficulty: 2
    hints:
    - 4/4 makes 1 whole.
    - 7 − 4 = 3 left over.
    solution: 7/4 = 4/4 + 3/4 = 1 3/4.
    mistakes: {"1 4/7": "m5_mixed"}
  - prompt: 3/10 + 4/10 + 2/10 = ?
    options:
    - 9/10
    - 9/30
    - '1'
    - 7/10
    answer: 9/10
    difficulty: 2
    hints:
    - Add all the tops.
    - 3 + 4 + 2.
    solution: '3 + 4 + 2 = 9 tenths: 9/10.'
    mistakes:
      9/30: c5_frac_add
  - prompt: 4/9 + 3/9 = ?
    answer: 7/9
    check: 7/9
    difficulty: 1
    hints:
    - The bottoms are the same.
    - Add only the tops.
    solution: 'Step 1: keep the bottom 9. Step 2: 4 + 3 = 7, so 7/9.'
    mistakes:
      7/18: c5m2_like
      1/9: c5m2_like
  - prompt: 7/10 − 4/10 = ?
    answer: 3/10
    check: 3/10
    difficulty: 1
    hints:
    - Keep the bottom 10.
    - Subtract the tops.
    solution: 'Step 1: keep 10. Step 2: 7 − 4 = 3, so 3/10.'
    mistakes:
      3/20: c5m2_like
      11/10: c5m2_like
  - prompt: 1 − 2/7 = ?
    answer: 5/7
    check: 5/7
    difficulty: 2
    hints:
    - Write 1 as sevenths.
    - 1 = 7/7.
    solution: 'Step 1: 1 = 7/7. Step 2: 7/7 − 2/7 = 5/7.'
    mistakes:
      2/7: c5m2_whole
      1/7: c5m2_whole
  - prompt: Write 9/4 as a mixed number.
    options:
    - 2 1/4
    - 1 5/4
    - 4 1/2
    answer: 2 1/4
    difficulty: 2
    hints:
    - How many 4s fit in 9?
    - What is left over?
    solution: 'Step 1: 4 fits into 9 two times (8). Step 2: 1 left, so 2 1/4.'
    mistakes:
      1 5/4: c5m2_mixed
      4 1/2: c5m2_mixed
  - prompt: Anu drank 2/6 of a jug of juice and Ben drank 3/6. How much did they drink together?
    answer: 5/6
    check: 5/6
    difficulty: 2
    hints:
    - '''Together'' means add.'
    - The bottoms are both 6.
