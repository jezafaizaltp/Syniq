# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 6
title: The Dairy Farm
tips:
  c5_litres: 1 litre = 1000 millilitres. Half a litre is 500 mL and a quarter litre is 250 mL.
concepts:
- code: cbse5m.dairy.milk
  title: Milk in litres and millilitres
  notes: |
    Capacity in litres (L) and millilitres (mL): 1 L = 1000 mL; 1/2 L = 500 mL; 1/4 L = 250 mL. A cow gives some litres
    of milk each day; multiply for many cows or days (8 L × 6 cows = 48 L). Packets: 48 L packed in 1/2 L packets gives
    96 packets. Add and subtract mL with carrying at 1000.
  explanations:
    text: Milk is measured in litres and millilitres. One litre is 1000 millilitres, so a half-litre packet holds 500 mL. If one cow gives 8 litres a day, 6 cows give 6 times as much.
    visual: Draw a 1-litre bottle split into 4 equal bands, each 250 mL. Two bands are 500 mL, half a litre.
    step_by_step: 'Step 1: Write all amounts in the same unit. Step 2: Multiply for many cows or days. Step 3: Divide to find how many packets.'
    real_world: Milk packets at home are 500 mL or 1 L; a dairy collects many litres from farmers each morning.
  picture:
    kind: bars
    bars:
    - label: 1/4 L
      value: 250
    - label: 1/2 L
      value: 500
    - label: 3/4 L
      value: 750
    - label: 1 L
      value: 1000
    alt: A quarter litre is 250 millilitres, half a litre 500, three quarters 750, and one litre 1000.
    unit: mL
  items:
  - prompt: How many millilitres are in 1/2 litre?
    answer: '500'
    check: 1000/2
    difficulty: 1
    hints:
    - 1 L = 1000 mL.
    - Half of 1000.
    solution: Half of 1000 mL is 500 mL.
    mistakes:
      '50': c5_litres
  - prompt: A cow gives 8 litres of milk a day. How many litres do 6 cows give?
    answer: '48'
    check: 8*6
    difficulty: 1
    hints:
    - 8 × 6.
    - Each cow gives 8.
    solution: 8 × 6 = 48 litres.
  - prompt: How many 1/2 L packets can be filled from 24 L of milk?
    answer: '48'
    check: 24*2
    difficulty: 2
    hints:
    - Each litre fills 2 packets.
    - 24 × 2.
    solution: 24 × 2 = 48 packets.
    mistakes:
      '12': c5_litres
  - prompt: How many mL are in 3 L 250 mL?
    answer: '3250'
    check: 3000+250
    difficulty: 1
    hints:
    - 3 L = 3000 mL.
    - 3000 + 250.
    solution: 3,000 + 250 = 3,250 mL.
  - prompt: A jug has 1 L of milk. 350 mL is poured out. How many mL are left?
    answer: '650'
    check: 1000-350
    difficulty: 1
    hints:
    - 1 L = 1000 mL.
    - 1000 − 350.
    solution: 1,000 − 350 = 650 mL.
  - prompt: A dairy collects 125 L each morning and 98 L each evening. How many litres in one day?
    answer: '223'
    check: 125+98
    difficulty: 1
    hints:
    - Add the two.
    - 125 + 98.
    solution: 125 + 98 = 223 litres.
- code: cbse5m.dairy.money
  title: Money at the dairy
  after:
  - cbse5m.dairy.milk
  notes: |
    Money: ₹1 = 100 paise. Cost = rate × quantity: milk at ₹56 a litre, 5 L costs ₹280. Change = money given − cost.
    A farmer earns per litre; for a week multiply by 7. Bills add several items.
  explanations:
    text: To find the cost, multiply the price of one by how many you buy. If milk is ₹56 a litre, 5 litres cost 56 × 5 = ₹280. If you pay with ₹500, your change is 500 − 280 = ₹220.
    visual: 'Write a bill: Milk 5 L × ₹56 = ₹280; Curd 2 × ₹30 = ₹60; Total ₹340. Paid ₹500, change ₹160.'
    step_by_step: 'Step 1: Cost of each item = price × quantity. Step 2: Add for the total. Step 3: Change = money paid − total.'
    real_world: Buying milk, curd and ghee at the dairy shop and checking your change.
  picture:
    kind: flow
    steps:
    - 'Milk: 5 × ₹56 = ₹280'
    - 'Curd: 2 × ₹30 = ₹60'
    - 'Total: ₹340'
    - Paid ₹500 → change ₹160
    alt: 'A dairy bill: 5 litres of milk at 56 rupees is 280, 2 curds at 30 is 60, total 340; paying 500 gives 160 change.'
  items:
  - prompt: Milk costs ₹56 a litre. What do 5 litres cost in rupees?
    answer: '280'
    check: 56*5
    difficulty: 1
    hints:
    - 56 × 5.
    - 50 × 5 + 6 × 5.
    solution: 56 × 5 = ₹280.
  - prompt: You pay ₹500 for milk costing ₹280. How much change do you get in rupees?
    answer: '220'
    check: 500-280
    difficulty: 1
    hints:
    - 500 − 280.
    - Count up from 280.
    solution: 500 − 280 = ₹220.
  - prompt: How many paise are in ₹3?
    answer: '300'
    check: 3*100
    difficulty: 1
    hints:
    - ₹1 = 100 paise.
    - 3 × 100.
    solution: ₹3 = 300 paise.
  - prompt: A farmer sells 20 L of milk a day at ₹45 a litre. How much does he earn in a day in rupees?
    answer: '900'
    check: 45*20
    difficulty: 2
    hints:
    - 45 × 20.
    - 45 × 2 × 10.
    solution: 45 × 20 = ₹900.
  - prompt: A family buys 2 L of milk every day. How many litres in a week?
    answer: '14'
    check: 2*7
    difficulty: 1
    hints:
    - A week has 7 days.
    - 2 × 7.
    solution: 2 × 7 = 14 litres.
  - prompt: A bill has milk ₹280, curd ₹60 and butter ₹55. What is the total in rupees?
    answer: '395'
    check: 280+60+55
    difficulty: 2
    hints:
    - Add all three.
    - 280 + 60 + 55.
    solution: 280 + 60 + 55 = ₹395.
