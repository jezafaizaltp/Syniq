# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 6
title: The Dairy Farm
tips:
  c5_litres: "1 litre is 1000 millilitres. Halve it for half a litre; for packets, every litre fills 2 half-litre packets."
  m5_add_carry: "Add the ones first. If they make 10 or more, carry 1 to the tens."
  m5_paise: "Each rupee is worth a hundred paise. Multiply the rupees by that."
  m5_times_table: "Equal groups means multiply, not add: number of groups × how many in each. Check it with your times table."
  m5_week: "A week has 7 days, and the family buys 2 L each day."
  c5m6_ml: 1 litre is 1,000 millilitres. Half a litre is half of that, a quarter is a quarter of that.
  c5m6_groups: The same amount again and again means multiply; a total cut into equal packets means divide.
  c5m6_borrow: Change litres to millilitres first, then subtract like ordinary numbers.
  c5m6_cost: Cost of many = cost of one × how many.
  c5m6_change: 'Change is what comes back: money given minus the cost.'
  c5m6_paise: ₹1 is 100 paise. Multiply the rupees by 100.
concepts:
- code: cbse5m.dairy.milk
  title: Milk in litres and millilitres
  notes: |
    Capacity in litres (L) and millilitres (mL): 1 L = 1000 mL; 1/2 L = 500 mL; 1/4 L = 250 mL. A cow gives some litres
    of milk each day; multiply for many cows or days (8 L × 6 cows = 48 L). Packets: 48 L packed in 1/2 L packets gives
    96 packets. Add and subtract mL with carrying at 1000.
  explanations:
    text: Milk is measured in litres and millilitres. One litre is 1000 millilitres, so a half-litre packet holds 500 mL. If one cow gives 8 litres a day, 6 cows give 6 times as much.
    visual: Draw a 1-litre bottle split into 4 equal bands, each 250 mL. Two bands are 500 mL, half a litre.
    step_by_step: 'Step 1: Write all amounts in the same unit. Step 2: Multiply for many cows or days. Step 3: Divide to find how many packets.'
    real_world: Milk packets at home are 500 mL or 1 L; a dairy collects many litres from farmers each morning.
  picture:
    kind: bars
    bars:
    - label: 1/4 L
      value: 250
    - label: 1/2 L
      value: 500
    - label: 3/4 L
      value: 750
    - label: 1 L
      value: 1000
    alt: A quarter litre is 250 millilitres, half a litre 500, three quarters 750, and one litre 1000.
    unit: mL
  activity:
    type: formula
    prompt: Milk comes in half-litre packets (500 mL). Set how many packets.
    inputs:
    - name: p
      label: Packets
      min: 0
      max: 40
      step: 1
      start: 0
    outputs:
    - name: ml
      label: Milk
      expr: 500*p
      unit: mL
    - name: l
      label: In litres
      expr: p/2
      unit: L
    goals:
    - prompt: Get 3 litres.
      want:
        l: 3
      mistakes:
      - when:
          p: 3
        say: 3 packets of half a litre make only 1.5 L. Each litre needs 2 packets.
    - prompt: Get 8 litres.
      want:
        l: 8
      mistakes:
      - when:
          p: 8
        say: 8 packets is 4 litres. Double it.
    - prompt: Get 6.5 litres.
      want:
        l: 6.5
      mistakes:
      - when:
          p:
          - 6
          - 7
        say: Each packet is half a litre. 6 litres needs 12 packets, plus one more.
  lesson:
    - teach: Milk and water are measured in litres (L) and millilitres (mL). 1 L = 1,000 mL. Half a litre is 500 mL and a quarter litre is 250 mL.
      picture:
        kind: bars
        unit: mL
        bars:
        - label: 1 L
          value: 1000
        - label: 1/2 L
          value: 500
        - label: 1/4 L
          value: 250
        alt: 1 litre is 1000 mL, half a litre 500 mL, a quarter litre 250 mL.
      check:
        prompt: How many mL are in 1/4 L?
        options:
        - '250'
        - '400'
        - '25'
        answer: '250'
        why: 1,000 ÷ 4 = 250.
      ways:
      - style: step_by_step
        teach: 'Step 1: 1 L is 1,000 mL. Step 2: Half of 1,000 is 500, so 1/2 L = 500 mL. Step 3: Half of 500 is 250, so 1/4 L = 250 mL. Step 4: Three of those quarters is 750 mL.'
      - style: real_world
        teach: 'Look at the packets in a shop: milk often comes in 500 mL packets, and a small curd cup may be 200 mL. A big water bottle is 1 L, the same as 1,000 mL.'
    - teach: 'If each cow gives the same amount, multiply: 7 L a day from 5 cows is 7 × 5 = 35 L. To pack milk in packets, divide: 10 L in 1/2 L packets makes 20 packets, because each litre fills 2.'
      check:
        prompt: How many 1/2 L packets can be filled from 6 L?
        options:
        - '12'
        - '3'
        - '6'
        answer: '12'
        why: 'Each litre fills 2 half-litre packets: 6 × 2 = 12.'
      ways:
      - style: visual
        teach: Multiply for many cows, divide for many packets.
        picture:
          kind: compare
          columns:
          - title: Same amount from each cow
            points:
            - Multiply
            - 6 L from each of 4 cows = 24 L
          - title: A total into packets
            points:
            - Divide
            - 12 L into 1 L bottles = 12 bottles
            - 12 L into 1/2 L packets = 24 packets
          alt: 'When each cow gives the same amount, multiply: 6 L from each of 4 cows is 24 L. When a total is packed, divide: 12 L fills 12 one-litre bottles or 24 half-litre packets.'
      - style: real_world
        teach: A milk van has 15 L to deliver in 1/2 L packets. Each litre fills 2 packets, so 15 L fills 15 × 2 = 30 packets.
    - teach: To add or subtract L and mL, change to mL first. 2 L 300 mL = 2,300 mL. 1 L − 450 mL = 1,000 − 450 = 550 mL.
      check:
        prompt: Write 1 L 75 mL in mL.
        options:
        - 1,075
        - 1,750
        - '175'
        answer: 1,075
        why: 1,000 mL + 75 mL.
      ways:
      - style: visual
        teach: Subtracting 850 mL from 2 L by changing to millilitres first.
        picture:
          kind: flow
          steps:
          - 2 L = 2,000 mL
          - 2,000 − 850 = 1,150 mL
          - 1,150 mL = 1 L 150 mL
          alt: Change 2 L to 2,000 mL. 2,000 minus 850 is 1,150 mL, which is 1 L 150 mL.
      - style: real_world
        teach: 'A recipe needs 1 L 200 mL of milk for kheer and 300 mL for tea. Change to mL: 1,200 + 300 = 1,500 mL, which is 1 L 500 mL of milk in all.'
  items:
  - prompt: How many millilitres are in 1/2 litre?
    answer: '500'
    check: 1000/2
    difficulty: 1
    hints:
    - 1 L = 1000 mL.
    - Half of 1000.
    solution: Half of 1000 mL is 500 mL.
    mistakes:
      '50': c5_litres
  - prompt: A cow gives 8 litres of milk a day. How many litres do 6 cows give?
    answer: '48'
    check: 8*6
    difficulty: 1
    hints:
    - 8 × 6.
    - Each cow gives 8.
    solution: 8 × 6 = 48 litres.
    mistakes: {"14": "m5_times_table", "42": "m5_times_table"}
  - prompt: How many 1/2 L packets can be filled from 24 L of milk?
    answer: '48'
    check: 24*2
    difficulty: 2
    hints:
    - Each litre fills 2 packets.
    - 24 × 2.
    solution: 24 × 2 = 48 packets.
    mistakes:
      '12': c5_litres
  - prompt: How many mL are in 3 L 250 mL?
    answer: '3250'
    check: 3000+250
    difficulty: 1
    hints:
    - 3 L = 3000 mL.
    - 3000 + 250.
    solution: 3,000 + 250 = 3,250 mL.
    mistakes: {"3025": "m5_unit_convert", "325": "m5_unit_convert"}
  - prompt: A jug has 1 L of milk. 350 mL is poured out. How many mL are left?
    answer: '650'
    check: 1000-350
    difficulty: 1
    hints:
    - 1 L = 1000 mL.
    - 1000 − 350.
    solution: 1,000 − 350 = 650 mL.
    mistakes: {"750": "m5_subtract_borrow", "1350": "m5_subtract_borrow"}
  - prompt: A dairy collects 125 L each morning and 98 L each evening. How many litres in one day?
    answer: '223'
    check: 125+98
    difficulty: 1
    hints:
    - Add the two.
    - 125 + 98.
    solution: 125 + 98 = 223 litres.
    mistakes: {"213": "m5_add_carry", "27": "m5_add_carry"}
  - prompt: How many mL are in 2 L?
    answer: '2000'
    check: 2*1000
    difficulty: 1
    hints:
    - 1 L = 1,000 mL.
    - Two of those.
    solution: 'Step 1: 2 × 1,000. Step 2: = 2,000 mL.'
    mistakes:
      '200': c5m6_ml
      '20': c5m6_ml
  - prompt: How many mL are in 3/4 L?
    answer: '750'
    check: 3*250
    difficulty: 2
    hints:
    - 1/4 L = 250 mL.
    - Three of those.
    solution: 'Step 1: 1/4 L = 250 mL. Step 2: 3 × 250 = 750 mL.'
    mistakes:
      '250': c5m6_ml
      '340': c5m6_ml
      '75': c5m6_ml
  - prompt: A cow gives 9 L of milk a day. How much in a week (7 days), in litres?
    answer: '63'
    check: 9*7
    difficulty: 1
    hints:
    - Same amount each day.
    - 9 × 7.
    solution: 'Step 1: 9 × 7. Step 2: = 63 L.'
    mistakes:
      '16': c5m6_groups
      '56': c5m6_groups
  - prompt: How many 1/4 L cups can be filled from 3 L of milk?
    answer: '12'
    check: 3*4
    difficulty: 2
    hints:
    - How many quarter litres in one litre?
    - Then for 3 litres.
    solution: 'Step 1: 1 L fills 4 cups. Step 2: 3 × 4 = 12 cups.'
    mistakes:
      '6': c5m6_groups
      '3': c5m6_groups
  - prompt: A can has 5 L of milk. 1 L 400 mL is sold. How many mL are left?
    answer: '3600'
    check: 5000-1400
    difficulty: 2
    hints:
    - Change both to mL.
    - 5,000 − 1,400.
    solution: 'Step 1: 5,000 mL − 1,400 mL. Step 2: = 3,600 mL.'
    mistakes:
      '4600': c5m6_borrow
      '3400': c5m6_borrow
  - prompt: Add 1 L 650 mL and 2 L 500 mL. How many mL in all?
    answer: '4150'
    check: 1650+2500
    difficulty: 2
    hints:
    - Change both to mL.
    - 1,650 + 2,500.
    solution: 'Step 1: 1,650 + 2,500. Step 2: = 4,150 mL.'
    mistakes:
      '3150': c5m6_borrow
      '4115': c5m6_borrow
  - prompt: A dairy has 40 cows. Each gives 8 L a day. How many litres a day?
    answer: '320'
    check: 40*8
    difficulty: 2
    hints:
    - 40 groups of 8.
    - 4 × 8 = 32, then the zero.
    solution: 'Step 1: 40 × 8. Step 2: = 320 L.'
    mistakes:
      '48': c5m6_groups
      '32': c5m6_groups
  - prompt: A family uses 750 mL of milk a day. How many mL in 4 days?
    answer: '3000'
    check: 750*4
    difficulty: 3
    hints:
    - Same amount each day.
    - 750 × 4.
    solution: 'Step 1: 750 × 4. Step 2: = 3,000 mL (3 L).'
    mistakes:
      '2800': c5m6_groups
      '754': c5m6_groups
  - prompt: 'Which is more: 1 L 50 mL or 1,500 mL?'
    options:
    - 1,500 mL
    - 1 L 50 mL
    - They are equal
    answer: 1,500 mL
    difficulty: 3
    hints:
    - Change 1 L 50 mL to mL.
    - 1,000 + 50.
    solution: 'Step 1: 1 L 50 mL = 1,050 mL. Step 2: 1,500 is more.'
    mistakes:
      1 L 50 mL: c5m6_ml
      They are equal: c5m6_ml
  - prompt: 'Case: A farmer has 5 cows. Each gives 11 L of milk a day. The farmer sells all of it in 1/2 L packets. How many packets are filled each day?'
    options:
    - '110'
    - '55'
    - '27'
    answer: '110'
    hints:
    - First find the total milk from all the cows.
    - How many 1/2 L packets does each litre fill?
    solution: 'Milk: 11 × 5 = 55 L. Each litre fills 2 half-litre packets, so 55 × 2 = 110 packets.'
    mistakes:
      '55': c5m6_groups
      '27': c5m6_groups
    exam: case
    difficulty: 2
  - prompt: 'Situation: A bucket holds 4 L of water. A child pours 1 L 300 mL into a plant pot. How much water is still in the bucket?'
    options:
    - 2 L 700 mL
    - 3 L 300 mL
    - 2 L 300 mL
    answer: 2 L 700 mL
    hints:
    - Change both amounts to mL first.
    - 4 L is how many mL?
    solution: 4 L = 4,000 mL and 1 L 300 mL = 1,300 mL. 4,000 − 1,300 = 2,700 mL = 2 L 700 mL.
    mistakes:
      3 L 300 mL: c5m6_borrow
      2 L 300 mL: c5m6_borrow
    exam: competency
    difficulty: 2
- code: cbse5m.dairy.money
  title: Money at the dairy
  after:
  - cbse5m.dairy.milk
  notes: |
    Money: ₹1 = 100 paise. Cost = rate × quantity: milk at ₹56 a litre, 5 L costs ₹280. Change = money given − cost.
    A farmer earns per litre; for a week multiply by 7. Bills add several items.
  explanations:
    text: To find the cost, multiply the price of one by how many you buy. If milk is ₹56 a litre, 5 litres cost 56 × 5 = ₹280. If you pay with ₹500, your change is 500 − 280 = ₹220.
    visual: 'Write a bill: Milk 5 L × ₹56 = ₹280; Curd 2 × ₹30 = ₹60; Total ₹340. Paid ₹500, change ₹160.'
    step_by_step: 'Step 1: Cost of each item = price × quantity. Step 2: Add for the total. Step 3: Change = money paid − total.'
    real_world: Buying milk, curd and ghee at the dairy shop and checking your change.
  picture:
    kind: flow
    steps:
    - 'Milk: 5 × ₹56 = ₹280'
    - 'Curd: 2 × ₹30 = ₹60'
    - 'Total: ₹340'
    - Paid ₹500 → change ₹160
    alt: 'A dairy bill: 5 litres of milk at 56 rupees is 280, 2 curds at 30 is 60, total 340; paying 500 gives 160 change.'
  activity:
    type: formula
    prompt: Milk costs ₹56 a litre. You pay with a ₹500 note.
    inputs:
    - name: n
      label: Litres
      min: 0
      max: 10
      step: 1
      start: 0
    outputs:
    - name: cost
      label: Cost
      expr: 56*n
      unit: ₹
    - name: change
      label: Change
      expr: 500-56*n
      unit: ₹
    goals:
    - prompt: Buy as many litres as you can.
      want:
        n: 8
      mistakes:
      - when:
          n: 9
        say: '9 litres cost ₹504: ₹4 more than you have.'
      - when:
          n:
          - 1
          - 7
        say: You still have enough for another litre.
    - prompt: Get exactly ₹220 change.
      want:
        change: 220
      mistakes:
      - when:
          n: 4
        say: That leaves ₹276. You spent 500 − 220 = 280 in all.
      - when:
          n: 6
        say: That leaves ₹164. Spend a little less.
    - prompt: Spend exactly ₹336.
      want:
        cost: 336
      mistakes:
      - when:
          n: 7
        say: 7 litres cost ₹392. One litre less.
  lesson:
    - teach: ₹1 = 100 paise. So ₹5 = 500 paise and 50 paise is half a rupee.
      check:
        prompt: How many paise are in ₹2?
        options:
        - '200'
        - '20'
        - 2,000
        answer: '200'
        why: Each rupee is 100 paise.
      ways:
      - style: visual
        teach: 'Rupees and paise: how they fit together.'
        picture:
          kind: flow
          steps:
          - ₹1 = 100 paise
          - 50 paise = half a rupee
          - ₹2 and 50 paise = 250 paise
          - ₹6 = 600 paise
          alt: One rupee is 100 paise and 50 paise is half a rupee. ₹2 and 50 paise is 250 paise, and ₹6 is 600 paise.
      - style: real_world
        teach: Old price tags sometimes show amounts like ₹12.50. That means 12 rupees and 50 paise. Since ₹1 is 100 paise, the whole amount is 1,250 paise.
    - teach: 'Cost of many = cost of one × how many. Milk at ₹56 a litre: 5 L cost 56 × 5 = ₹280. A bill adds the cost of each item.'
      picture:
        kind: flow
        steps:
        - Price of 1
        - × how many
        - = cost
        - Add costs for the bill
        alt: To find a bill, multiply price by quantity for each item and add.
      check:
        prompt: Curd costs ₹30 a cup. What do 3 cups cost?
        options:
        - ₹90
        - ₹33
        - ₹60
        answer: ₹90
        why: 30 × 3 = 90.
      ways:
      - style: step_by_step
        teach: 'Make a bill. Step 1: Write each item with its cost: curd ₹40, 2 L milk at ₹52 a litre. Step 2: Work out the milk: 52 × 2 = ₹104. Step 3: Add the lines: 40 + 104 = ₹144. Step 4: That is the total.'
      - style: real_world
        teach: 'Look at a shop receipt: each line shows an item, how many, and the cost. The bottom line adds them all up. Checking a bill means doing the same sums yourself.'
    - teach: 'Change is the money given back: money given − cost. Pay ₹500 for a bill of ₹280: change = 500 − 280 = ₹220.'
      check:
        prompt: You pay ₹100 for milk costing ₹65. What change do you get?
        options:
        - ₹35
        - ₹45
        - ₹165
        answer: ₹35
        why: 100 − 65 = 35.
      ways:
      - style: visual
        teach: Finding change by counting up from the bill to the money given.
        picture:
          kind: number_line
          from: 170
          to: 200
          step: 5
          jumps:
          - from: 175
            to: 180
            label: '+5'
          - from: 180
            to: 200
            label: '+20'
          points:
          - at: 175
            label: bill ₹175
          - at: 200
            label: paid ₹200
          alt: 'Counting up from a bill of ₹175 to ₹200 paid: plus 5 reaches 180, plus 20 reaches 200. The change is ₹25.'
      - style: real_world
        teach: Shopkeepers often count change upwards. For a ₹175 bill paid with ₹200, they hand back ₹5 saying 'one eighty', then ₹20 saying 'two hundred'. The change is ₹25, the same as 200 − 175.
  items:
  - prompt: Milk costs ₹56 a litre. What do 5 litres cost in rupees?
    answer: '280'
    check: 56*5
    difficulty: 1
    hints:
    - 56 × 5.
    - 50 × 5 + 6 × 5.
    solution: 56 × 5 = ₹280.
    mistakes: {"250": "m5_times_carry", "61": "m5_times_carry"}
  - prompt: You pay ₹500 for milk costing ₹280. How much change do you get in rupees?
    answer: '220'
    check: 500-280
    difficulty: 1
    hints:
    - 500 − 280.
    - Count up from 280.
    solution: 500 − 280 = ₹220.
    mistakes: {"780": "m5_subtract_borrow", "320": "m5_subtract_borrow"}
  - prompt: How many paise are in ₹3?
    answer: '300'
    check: 3*100
    difficulty: 1
    hints:
    - ₹1 = 100 paise.
    - 3 × 100.
    solution: ₹3 = 300 paise.
    mistakes: {"30": "m5_paise", "3000": "m5_paise"}
  - prompt: A farmer sells 20 L of milk a day at ₹45 a litre. How much does the farmer earn in a day in rupees?
    answer: '900'
    check: 45*20
    difficulty: 2
    hints:
    - 45 × 20.
    - 45 × 2 × 10.
    solution: 45 × 20 = ₹900.
    mistakes: {"90": "m5_times_carry", "65": "m5_times_carry"}
  - prompt: A family buys 2 L of milk every day. How many litres in a week?
    answer: '14'
    check: 2*7
    difficulty: 1
    hints:
    - A week has 7 days.
    - 2 × 7.
    solution: 2 × 7 = 14 litres.
    mistakes: {"9": "m5_week", "7": "m5_week"}
  - prompt: A bill has milk ₹280, curd ₹60 and butter ₹55. What is the total in rupees?
    answer: '395'
    check: 280+60+55
    difficulty: 2
    hints:
    - Add all three.
    - 280 + 60 + 55.
    solution: 280 + 60 + 55 = ₹395.
    mistakes: {"385": "m5_add_carry", "340": "m5_add_carry"}
  - prompt: How many paise are in ₹7?
    answer: '700'
    check: 7*100
    difficulty: 1
    hints:
    - ₹1 = 100 paise.
    - 7 × 100.
    solution: 'Step 1: 7 × 100. Step 2: = 700 paise.'
    mistakes:
      '70': c5m6_paise
      '7000': c5m6_paise
  - prompt: Ghee costs ₹120 a jar. What do 4 jars cost, in rupees?
    answer: '480'
    check: 120*4
    difficulty: 1
    hints:
    - Cost of one × how many.
    - 120 × 4.
    solution: 'Step 1: 120 × 4. Step 2: = ₹480.'
    mistakes:
      '124': c5m6_cost
      '30': c5m6_cost
  - prompt: You give ₹200 for a bill of ₹136. How much change, in rupees?
    answer: '64'
    check: 200-136
    difficulty: 2
    hints:
    - Change = money given − cost.
    - 200 − 136.
    solution: 'Step 1: 200 − 136. Step 2: = ₹64.'
    mistakes:
      '336': c5m6_change
      '74': c5m6_change
  - prompt: Milk costs ₹54 a litre. What do 3 litres cost, in rupees?
    answer: '162'
    check: 54*3
    difficulty: 2
    hints:
    - 50 × 3 and 4 × 3.
    - Add the two parts.
    solution: 'Step 1: 50×3 = 150, 4×3 = 12. Step 2: ₹162.'
    mistakes:
      '57': c5m6_cost
      '152': c5m6_cost
  - prompt: 'A bill: milk ₹108, paneer ₹90, curd ₹45. What is the total, in rupees?'
    answer: '243'
    check: 108+90+45
    difficulty: 2
    hints:
    - Add the three amounts.
    - 108 + 90 = 198 first.
    solution: 'Step 1: 108 + 90 = 198. Step 2: 198 + 45 = ₹243.'
    mistakes:
      '233': c5m6_cost
      '143': c5m6_cost
  - prompt: A farmer earns ₹600 a day from milk. How much in a week, in rupees?
    answer: '4200'
    check: 600*7
    difficulty: 2
    hints:
    - A week has 7 days.
    - 6 × 7 = 42, then two zeros.
    solution: 'Step 1: 600 × 7. Step 2: = ₹4,200.'
    mistakes:
      '607': c5m6_cost
      '420': c5m6_cost
  - prompt: Which is the same as ₹4 and 50 paise?
    options:
    - 450 paise
    - 405 paise
    - 45 paise
    answer: 450 paise
    difficulty: 2
    hints:
    - ₹4 = 400 paise.
    - Add the 50 paise.
    solution: 'Step 1: 400 paise + 50 paise. Step 2: = 450 paise.'
    mistakes:
      405 paise: c5m6_paise
      45 paise: c5m6_paise
  - prompt: Butter costs ₹55. Meena pays with a ₹100 note and buys 1 butter. Then she buys curd for ₹30 with her change. How much is left, in rupees?
    answer: '15'
    check: 100-55-30
    difficulty: 3
    hints:
    - First find the change from ₹100.
    - Then take away ₹30 more.
    solution: 'Step 1: 100 − 55 = 45. Step 2: 45 − 30 = ₹15.'
    mistakes:
      '45': c5m6_change
      '85': c5m6_change
  - prompt: A dairy sells 25 L at ₹50 a litre and 10 L at ₹60 a litre. How much does it earn in all, in rupees?
    answer: '1850'
    check: 25*50+10*60
    difficulty: 3
    hints:
