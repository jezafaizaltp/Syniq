# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 10
title: Symmetrical Designs
tips:
  c5_mirror: 'Fold along the line: if both halves match exactly, the line is a line of symmetry.'
concepts:
- code: cbse5m.sym.lines
  title: Lines of symmetry
  notes: |
    A shape is symmetrical if a line (mirror line) splits it into two matching halves. Square: 4 lines; rectangle: 2;
    equilateral triangle: 3; circle: endless. Letters: A, M, T have a vertical line; B, C, E a horizontal line; H, O, X
    both; F, G, J none. Test by folding paper or using a mirror.
  explanations:
    text: 'A shape is symmetrical when one half is the mirror image of the other. Fold it along the line: if the two halves fit exactly on each other, that fold is a line of symmetry.'
    visual: 'Fold a paper in half, cut a half-heart along the fold, and open it: a whole heart with the fold as its line of symmetry.'
    step_by_step: 'Step 1: Imagine a fold line. Step 2: Check if the two halves match exactly. Step 3: Try other lines: up-down, side-to-side, corner-to-corner.'
    real_world: Butterflies, leaves, rangoli and the Taj Mahal's front are symmetrical.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Square
      - Rectangle
      - Equilateral triangle
    - title: Lines of symmetry
      points:
      - '4'
      - '2'
      - '3'
    alt: A square has 4 lines of symmetry, a rectangle 2, and an equilateral triangle 3.
  activity:
    type: sort
    prompt: How many lines of symmetry? Fold it in your mind.
    bins:
    - No lines
    - 1 line
    - 2 lines
    - More than 2
    items:
    - label: Letter F
      bin: No lines
      clue: Any fold make the halves match?
      why: No fold works.
    - label: Letter S
      bin: No lines
      clue: Try folding across and down.
      why: No fold works (it looks the same after a half turn, though).
    - label: Letter A
      bin: 1 line
      clue: Fold it down the middle.
      why: One line, top to bottom.
    - label: A heart shape
      bin: 1 line
      clue: Fold down the middle.
      why: One line.
    - label: Letter E
      bin: 1 line
      clue: Fold it across the middle.
      why: One line, side to side.
    - label: Letter H
      bin: 2 lines
      clue: Try down the middle and across.
      why: Both folds work.
    - label: A rectangle
      bin: 2 lines
      clue: Try the diagonals too.
      why: Only the two middle folds; diagonals don't match.
    - label: A square
      bin: More than 2
      clue: Middles and diagonals.
      why: 4 lines.
    - label: A circle
      bin: More than 2
      clue: Any fold through the centre?
      why: Endless lines.
  items:
  - prompt: How many lines of symmetry does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Up-down, side-side ...
    - and the two diagonals.
    solution: 2 middle lines + 2 diagonals = 4.
    mistakes:
      '2': c5_mirror
  - prompt: How many lines of symmetry does a rectangle (not a square) have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 'Try the diagonals: do they match?'
    - Only the two middle lines work.
    solution: A rectangle has 2 lines of symmetry.
    mistakes:
      '4': c5_mirror
  - prompt: Which letter has a vertical line of symmetry?
    options:
    - A
    - F
    - G
    - J
    answer: A
    difficulty: 1
    hints:
    - Draw a line down the middle.
    - Do both sides match?
    solution: A matches on both sides of a vertical line.
  - prompt: Which letter has NO line of symmetry?
    options:
    - F
    - H
    - O
    - X
    answer: F
    difficulty: 1
    hints:
    - Try folding each.
    - F has arms only on one side.
    solution: F has no line of symmetry.
    mistakes:
      H: c5_mirror
  - prompt: Which shape has endless lines of symmetry?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - Any line through the centre works.
    - Round shape.
    solution: Every line through the centre of a circle is a line of symmetry.
  - prompt: How many lines of symmetry does an equilateral triangle have?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - One from each corner.
    - To the middle of the opposite side.
    solution: An equilateral triangle has 3 lines of symmetry.
- code: cbse5m.sym.designs
  title: Completing designs and turns
  after:
  - cbse5m.sym.lines
  notes: |
    To complete a symmetrical design, copy each part the same distance on the other side of the mirror line (count grid
    squares). Some designs look the same after a turn (rotational symmetry): a square looks the same after a quarter
    turn, so 4 times in a full turn. Tiles and borders repeat by sliding, flipping or turning.
  explanations:
    text: To complete a mirror design, every dot on one side needs a partner the same distance away on the other side. Some designs also look the same when you turn them, like a pinwheel.
    visual: On squared paper draw a dot 3 squares left of the line. Its mirror dot is 3 squares right of the line, on the same row.
    step_by_step: 'Step 1: Pick a point. Step 2: Count squares to the mirror line. Step 3: Count the same number on the other side. Step 4: Join the points.'
    real_world: Kolam and rangoli artists build designs that look the same after turning; tile layers repeat patterns across floors.
  picture:
    kind: flow
    steps:
    - Point 3 squares left of line
    - Count 3 squares right
    - Same row
    - Mark the mirror point
    alt: To reflect a point, count its distance to the mirror line and mark the same distance on the other side, on the same row.
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: The mirror line is at 5. Mark where each dot's partner goes.
    goals:
    - prompt: A dot at 3.
      target: 7
      mistakes:
      - when:
          v: 3
        say: That's the dot itself. Its partner is on the other side of 5.
      - when:
          v: 8
        say: 3 is 2 steps from the line. The partner is 2 steps on the other side.
    - prompt: A dot at 1.
      target: 9
      mistakes:
      - when:
          v: 6
        say: 1 is 4 steps from the line, so go 4 steps past 5.
      - when:
          v: 10
        say: One step too far. Count from 5.
    - prompt: A dot at 6.
      target: 4
      mistakes:
      - when:
          v: 6
        say: That's the dot itself.
      - when:
          v: 3
        say: 6 is just 1 step from the line.
  items:
  - prompt: A point is 4 squares to the left of a mirror line. How many squares to the right is its mirror image?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Mirror images are the same distance away.
    - Same number.
    solution: 4 squares to the right.
  - prompt: How many times does a square look the same in one full turn?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Turn it a quarter at a time.
    - After each quarter it looks the same.
    solution: 'It matches after each quarter turn: 4 times.'
  - prompt: A design looks the same after a half turn. How many times does it match in a full turn?
    options:
    - '2'
    - '1'
    - '4'
    - '3'
    answer: '2'
    difficulty: 2
    hints:
    - A full turn is 2 half turns.
    - Count.
    solution: 'It matches at the half turn and at the full turn: 2 times.'
  - prompt: 'In a mirror, your right hand looks like:'
    options:
    - a left hand
    - a right hand
    - a foot
    - nothing changes
    answer: a left hand
    difficulty: 1
    hints:
    - Raise your right hand at a mirror.
    - Which side moves?
    solution: A mirror swaps left and right.
  - prompt: Which is a symmetrical object?
    options:
    - a butterfly
    - a scribble
    - a torn paper
    - a random splash
    answer: a butterfly
    difficulty: 1
    hints:
    - Both halves match.
    - Wings.
    solution: A butterfly's wings match on both sides.
  - prompt: A pinwheel with 6 equal blades matches how many times in a full turn?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Each blade moves into the next blade's place.
    - Count the blades.
    solution: It matches 6 times, once for each blade.
