# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 10
title: Symmetrical Designs
tips:
  c5_mirror: 'Fold along the line: if both halves match exactly, the line is a line of symmetry.'
  m5_blades: "Each turn moves one blade into the next blade's place. How many blades are there?"
  m5_circle_sym: "A square folds 4 ways. Which shape can be folded through its centre in any direction?"
  m5_eq_triangle: "Fold from each corner to the middle of the opposite side. How many corners are there?"
  m5_half_turn_match: "It matches after a half turn, and again after a full turn. Count the matches."
  m5_letter_sym: "Fold each letter down the middle from top to bottom. Which halves match?"
  m5_mirror_dist: "A mirror image is the same distance from the line on the other side."
  m5_mirror_hand: "Raise your right hand in front of a mirror. Which side is it on in the mirror?"
  m5_square_turn: "Turn a square a quarter at a time. It looks the same after each quarter."
  m5_sym_object: "Fold a picture of each in half. Which one has matching sides?"
  c5m10_fold: Imagine folding along the line. Do the two halves land exactly on each other?
  c5m10_count: 'Try every way to fold: up-down, side to side, and corner to corner.'
  c5m10_mirror: A mirror image is the same distance from the line, on the other side, and flipped.
  c5m10_turn: Turn the shape slowly through a full turn and count how many times it looks exactly the same.
concepts:
- code: cbse5m.sym.lines
  title: Lines of symmetry
  notes: |
    A shape is symmetrical if a line (mirror line) splits it into two matching halves. Square: 4 lines; rectangle: 2;
    equilateral triangle: 3; circle: endless. Letters: A, M, T have a vertical line; B, C, E a horizontal line; H, O, X
    both; F, G, J none. Test by folding paper or using a mirror.
  explanations:
    text: 'A shape is symmetrical when one half is the mirror image of the other. Fold it along the line: if the two halves fit exactly on each other, that fold is a line of symmetry.'
    visual: 'Fold a paper in half, cut a half-heart along the fold, and open it: a whole heart with the fold as its line of symmetry.'
    step_by_step: 'Step 1: Imagine a fold line. Step 2: Check if the two halves match exactly. Step 3: Try other lines: up-down, side-to-side, corner-to-corner.'
    real_world: Butterflies, leaves, rangoli and the Taj Mahal's front are symmetrical.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Square
      - Rectangle
      - Equilateral triangle
    - title: Lines of symmetry
      points:
      - '4'
      - '2'
      - '3'
    alt: A square has 4 lines of symmetry, a rectangle 2, and an equilateral triangle 3.
  activity:
    type: sort
    prompt: How many lines of symmetry? Fold it in your mind.
    bins:
    - No lines
    - 1 line
    - 2 lines
    - More than 2
    items:
    - label: Letter F
      bin: No lines
      clue: Any fold make the halves match?
      why: No fold works.
    - label: Letter S
      bin: No lines
      clue: Try folding across and down.
      why: No fold works (it looks the same after a half turn, though).
    - label: Letter A
      bin: 1 line
      clue: Fold it down the middle.
      why: One line, top to bottom.
    - label: A heart shape
      bin: 1 line
      clue: Fold down the middle.
      why: One line.
    - label: Letter E
      bin: 1 line
      clue: Fold it across the middle.
      why: One line, side to side.
    - label: Letter H
      bin: 2 lines
      clue: Try down the middle and across.
      why: Both folds work.
    - label: A rectangle
      bin: 2 lines
      clue: Try the diagonals too.
      why: Only the two middle folds; diagonals don't match.
    - label: A square
      bin: More than 2
      clue: Middles and diagonals.
      why: 4 lines.
    - label: A circle
      bin: More than 2
      clue: Any fold through the centre?
      why: Endless lines.
  lesson:
    - teach: A shape is symmetrical if a line splits it into two halves that match exactly when folded. That line is the line of symmetry, or mirror line. A butterfly and a leaf are symmetrical.
      check:
        prompt: What happens when you fold a symmetrical shape on its line of symmetry?
        options:
        - The two halves match exactly
        - One half is bigger
        - The shape disappears
        answer: The two halves match exactly
        why: That is what symmetry means.
    - teach: Some shapes have more than one line. A square has 4 (up, across, and the two corner-to-corner lines). A rectangle that is not a square has 2. An equilateral triangle has 3. A circle has endless lines through its centre.
      picture:
        kind: compare
        columns:
        - title: Shape
          points:
          - Square
          - Rectangle
          - Equilateral triangle
          - Circle
        - title: Lines of symmetry
          points:
          - '4'
          - '2'
          - '3'
          - endless
        alt: 'Lines of symmetry: square 4, rectangle 2, equilateral triangle 3, circle endless.'
      check:
        prompt: Why does a rectangle not fold onto itself corner to corner?
        options:
        - Its sides are not all equal
        - It has no corners
        - It is round
        answer: Its sides are not all equal
        why: A long side would land on a short side.
    - teach: Letters can be symmetrical too. A, M, T, U have an up-down (vertical) line. B, C, D, E have an across (horizontal) line. H, I, O, X have both. F, G, J, R have none.
      check:
        prompt: Which letter has both a vertical and a horizontal line of symmetry?
        options:
        - H
        - A
        - F
        answer: H
        why: H matches when folded either way.
  items:
  - prompt: How many lines of symmetry does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Up-down, side-side ...
    - and the two diagonals.
    solution: 2 middle lines + 2 diagonals = 4.
    mistakes:
      '2': c5_mirror
  - prompt: How many lines of symmetry does a rectangle (not a square) have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 'Try the diagonals: do they match?'
    - Only the two middle lines work.
    solution: A rectangle has 2 lines of symmetry.
    mistakes:
      '4': c5_mirror
  - prompt: Which letter has a vertical line of symmetry?
    options:
    - A
    - F
    - G
    - J
    answer: A
    difficulty: 1
    hints:
    - Draw a line down the middle.
    - Do both sides match?
    solution: A matches on both sides of a vertical line.
    mistakes: {"F": "m5_letter_sym"}
  - prompt: Which letter has NO line of symmetry?
    options:
    - F
    - H
    - O
    - X
    answer: F
    difficulty: 1
    hints:
    - Try folding each.
    - F has arms only on one side.
    solution: F has no line of symmetry.
    mistakes:
      H: c5_mirror
  - prompt: Which shape has endless lines of symmetry?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - Any line through the centre works.
    - Round shape.
    solution: Every line through the centre of a circle is a line of symmetry.
    mistakes: {"square": "m5_circle_sym"}
  - prompt: How many lines of symmetry does an equilateral triangle have?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - One from each corner.
    - To the middle of the opposite side.
    solution: An equilateral triangle has 3 lines of symmetry.
    mistakes: {"1": "m5_eq_triangle", "6": "m5_eq_triangle"}
  - prompt: Which letter has a horizontal line of symmetry?
    options:
    - E
    - A
    - R
    answer: E
    difficulty: 1
    hints:
    - Fold the letter top to bottom.
    - Does the top half match the bottom half?
    solution: 'Step 1: fold E across the middle. Step 2: the top and bottom match.'
    mistakes:
      A: c5m10_fold
      R: c5m10_fold
  - prompt: How many lines of symmetry does the letter X have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Try folding up-down.
    - Then try folding side to side.
    solution: 'Step 1: X folds both up-down and side to side. Step 2: 2 lines.'
    mistakes:
      '1': c5m10_count
      '4': c5m10_count
      '0': c5m10_count
  - prompt: Which shape has no line of symmetry?
    options:
    - The letter G
    - A square
    - A circle
    answer: The letter G
    difficulty: 2
    hints:
    - Try folding each one.
    - Which never matches?
    solution: 'Step 1: square and circle both fold to match. Step 2: G never does.'
    mistakes:
      A square: c5m10_count
      A circle: c5m10_count
  - prompt: How many lines of symmetry does a regular hexagon have?
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - A regular hexagon has 6 equal sides.
    - Lines go corner to corner and side to side.
    solution: 'Step 1: 3 lines corner to corner, 3 lines middle of side to middle of side. Step 2: 6 lines.'
    mistakes:
      '3': c5m10_count
      '2': c5m10_count
  - prompt: Which object is symmetrical?
    options:
    - A leaf
    - A crumpled paper
    - A splash of paint
    answer: A leaf
    difficulty: 1
    hints:
    - Look down the middle vein.
    - Which has two matching halves?
    solution: 'Step 1: a leaf has a centre line. Step 2: the halves match.'
    mistakes:
      A crumpled paper: c5m10_fold
      A splash of paint: c5m10_fold
  - prompt: Which of these letters folds left to right into matching halves?
    options:
    - U
    - J
    - L
    answer: U
    difficulty: 1
    hints:
    - Fold left to right.
    - Do both halves match?
    solution: 'Step 1: fold U down the middle. Step 2: both sides match.'
    mistakes:
      J: c5m10_fold
      L: c5m10_fold
  - prompt: How many lines of symmetry does the letter O (a perfect circle) have?
    options:
    - Endless
    - '2'
    - '1'
    answer: Endless
    difficulty: 2
    hints:
    - A circle looks the same from every side.
    - Any line through the centre works.
    solution: 'Step 1: every line through the centre splits a circle evenly. Step 2: endless lines.'
    mistakes:
      '2': c5m10_count
      '1': c5m10_count
  - prompt: A square and a rectangle are placed side by side. How many lines of symmetry do they have in total (counting each shape alone)?
    answer: '6'
    check: 4+2
    difficulty: 3
    hints:
    - 'Square: count its lines.'
    - 'Rectangle: count its lines, then add.'
    solution: 'Step 1: square 4, rectangle 2. Step 2: 4 + 2 = 6.'
    mistakes:
      '8': c5m10_count
      '4': c5m10_count
  - prompt: Which word has a vertical line of symmetry down its middle?
    options:
    - MOM
    - DOG
    - CAT
    answer: MOM
    difficulty: 3
    hints:
    - Each letter must be symmetrical up-down.
    - The word must read the same from both ends.
    solution: 'Step 1: M and O are symmetrical up-down. Step 2: MOM is the same both ways.'
    mistakes:
      DOG: c5m10_fold
      CAT: c5m10_fold
- code: cbse5m.sym.designs
  title: Completing designs and turns
  after:
  - cbse5m.sym.lines
  notes: |
    To complete a symmetrical design, copy each part the same distance on the other side of the mirror line (count grid
    squares). Some designs look the same after a turn (rotational symmetry): a square looks the same after a quarter
    turn, so 4 times in a full turn. Tiles and borders repeat by sliding, flipping or turning.
  explanations:
    text: To complete a mirror design, every dot on one side needs a partner the same distance away on the other side. Some designs also look the same when you turn them, like a pinwheel.
    visual: On squared paper draw a dot 3 squares left of the line. Its mirror dot is 3 squares right of the line, on the same row.
    step_by_step: 'Step 1: Pick a point. Step 2: Count squares to the mirror line. Step 3: Count the same number on the other side. Step 4: Join the points.'
    real_world: Kolam and rangoli artists build designs that look the same after turning; tile layers repeat patterns across floors.
  picture:
    kind: flow
    steps:
    - Point 3 squares left of line
    - Count 3 squares right
    - Same row
    - Mark the mirror point
    alt: To reflect a point, count its distance to the mirror line and mark the same distance on the other side, on the same row.
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: The mirror line is at 5. Mark where each dot's partner goes.
    goals:
    - prompt: A dot at 3.
      target: 7
      mistakes:
      - when:
          v: 3
        say: That's the dot itself. Its partner is on the other side of 5.
      - when:
          v: 8
        say: 3 is 2 steps from the line. The partner is 2 steps on the other side.
    - prompt: A dot at 1.
      target: 9
      mistakes:
      - when:
          v: 6
        say: 1 is 4 steps from the line, so go 4 steps past 5.
      - when:
          v: 10
        say: One step too far. Count from 5.
    - prompt: A dot at 6.
      target: 4
      mistakes:
      - when:
          v: 6
        say: That's the dot itself.
      - when:
          v: 3
        say: 6 is just 1 step from the line.
  lesson:
    - teach: To complete a symmetrical design, copy each part to the other side of the mirror line, the same distance away. If a dot is 3 squares left of the line, its image is 3 squares right.
      picture:
        kind: number_line
        from: -4
        to: 4
        step: 1
        points:
        - at: -3
          label: dot
        - at: 0
          label: mirror
        - at: 3
          label: image
        alt: A point 3 squares left of the mirror line at 0 has its image 3 squares to the right.
      check:
        prompt: A dot is 2 squares right of the mirror line. Where is its image?
        options:
        - 2 squares left
        - 4 squares left
        - On the line
        answer: 2 squares left
        why: Same distance, other side.
    - teach: A mirror flips things. Your right hand looks like a left hand in a mirror. Writing looks back to front.
      check:
        prompt: 'In a mirror, the word ''BAT'' appears:'
        options:
        - Back to front
        - Upside down
        - Exactly the same
        answer: Back to front
        why: A mirror flips left and right.
    - teach: Some designs look the same after a turn. A square looks the same after every quarter turn, so 4 times in a full turn. A design that matches after a half turn matches 2 times in a full turn. A pinwheel with 5 blades matches 5 times.
      check:
        prompt: An equilateral triangle matches how many times in a full turn?
        options:
        - '3'
        - '1'
        - '6'
        answer: '3'
        why: It has 3 equal corners, each taking the place of the next.
  items:
  - prompt: A point is 4 squares to the left of a mirror line. How many squares to the right is its mirror image?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Mirror images are the same distance away.
    - Same number.
    solution: 4 squares to the right.
    mistakes: {"8": "m5_mirror_dist", "0": "m5_mirror_dist"}
  - prompt: How many times does a square look the same in one full turn?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Turn it a quarter at a time.
    - After each quarter it looks the same.
    solution: 'It matches after each quarter turn: 4 times.'
    mistakes: {"2": "m5_square_turn", "1": "m5_square_turn"}
  - prompt: A design looks the same after a half turn. How many times does it match in a full turn?
    options:
    - '2'
    - '1'
    - '4'
    - '3'
    answer: '2'
    difficulty: 2
    hints:
    - A full turn is 2 half turns.
    - Count.
    solution: 'It matches at the half turn and at the full turn: 2 times.'
    mistakes: {"4": "m5_half_turn_match"}
  - prompt: 'In a mirror, your right hand looks like:'
    options:
    - a left hand
    - a right hand
    - a foot
    - nothing changes
    answer: a left hand
    difficulty: 1
    hints:
    - Raise your right hand at a mirror.
    - Which side moves?
    solution: A mirror swaps left and right.
    mistakes: {"a right hand": "m5_mirror_hand"}
  - prompt: Which is a symmetrical object?
    options:
    - a butterfly
    - a scribble
    - a torn paper
    - a random splash
    answer: a butterfly
    difficulty: 1
    hints:
    - Both halves match.
    - Wings.
    solution: A butterfly's wings match on both sides.
    mistakes: {"a scribble": "m5_sym_object"}
  - prompt: A pinwheel with 6 equal blades matches how many times in a full turn?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Each blade moves into the next blade's place.
    - Count the blades.
    solution: It matches 6 times, once for each blade.
    mistakes: {"3": "m5_blades", "12": "m5_blades"}
  - prompt: A point is 6 squares to the left of a mirror line. How far is its image from the point itself, in squares?
    answer: '12'
    check: 6*2
    difficulty: 3
    hints:
    - The image is 6 squares on the other side.
    - Add both distances.
    solution: 'Step 1: point to line = 6, line to image = 6. Step 2: 6 + 6 = 12.'
    mistakes:
      '6': c5m10_mirror
      '0': c5m10_mirror
  - prompt: A dot is 5 squares above a horizontal mirror line. Where is its image?
    options:
    - 5 squares below
    - 5 squares above
    - 10 squares below
    answer: 5 squares below
    difficulty: 2
    hints:
    - Same distance from the line.
    - On the other side.
    solution: 'Step 1: other side of the line. Step 2: same distance: 5 squares below.'
    mistakes:
      5 squares above: c5m10_mirror
      10 squares below: c5m10_mirror
  - prompt: A rectangle (not a square) matches how many times in a full turn?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Does it match after a quarter turn?
    - Try a half turn.
    solution: 'Step 1: after a quarter turn it is sideways, not matching. Step 2: it matches after half and full turns: 2.'
    mistakes:
      '4': c5m10_turn
      '1': c5m10_turn
  - prompt: A flower with 8 equal petals matches how many times in a full turn?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Each petal can move to the next petal's place.
    - Count the petals.
    solution: 'Step 1: 8 equal petals. Step 2: it matches 8 times.'
    mistakes:
      '4': c5m10_turn
      '2': c5m10_turn
  - prompt: 'You raise your left hand in front of a mirror. Your image raises its:'
    options:
    - Hand on the same side as yours (it looks like a right hand)
    - Hand on the opposite side
    - Both hands
    answer: Hand on the same side as yours (it looks like a right hand)
    difficulty: 3
    hints:
    - Stand in front of a mirror and try it.
    - The image is flipped.
    solution: 'Step 1: the mirror flips left and right. Step 2: your left hand''s image looks like a right hand.'
    mistakes:
      Hand on the opposite side: c5m10_mirror
      Both hands: c5m10_mirror
  - prompt: How many times does the letter S look the same in a full turn?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Turn S upside down.
    - Does it still look like S?
    solution: 'Step 1: S matches after a half turn. Step 2: and after a full turn: 2 times.'
    mistakes:
      '1': c5m10_turn
      '4': c5m10_turn
  - prompt: 'A border repeats a flower by sliding it along. This is called:'
    options:
    - Sliding (moving along)
    - Turning
    - Shrinking
    answer: Sliding (moving along)
    difficulty: 1
    hints:
    - The flower moves without turning.
    - It moves straight along the border.
    solution: 'Step 1: the flower is not turned or flipped. Step 2: it slides along.'
    mistakes:
      Turning: c5m10_turn
      Shrinking: c5m10_turn
  - prompt: Which design looks the same after a quarter turn?
    options:
    - A plus sign +
    - The letter T
    - An arrow →
    answer: A plus sign +
    difficulty: 2
    hints:
    - Turn each one a quarter turn.
    - Which arms swap places evenly?
    solution: 'Step 1: + has 4 equal arms. Step 2: a quarter turn looks the same.'
    mistakes:
      The letter T: c5m10_turn
      An arrow →: c5m10_turn
  - prompt: How many times does a square tile match in two full turns?
    answer: '8'
    check: 4*2
    difficulty: 3
    hints:
    - A square matches 4 times in one full turn.
    - Two full turns.
    solution: 'Step 1: 4 times per full turn. Step 2: 4 × 2 = 8.'
    mistakes:
      '4': c5m10_turn
      '2': c5m10_turn
