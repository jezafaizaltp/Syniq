# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 11
title: Grandmother's Quilt
tips:
  c5_area_perim: Area counts the squares inside (multiply length × breadth). Perimeter goes around the edge (add all sides).
  m5_border: "A border goes along the edge. Area covers the inside."
  m5_half_squares: "2 half squares make 1 full square. 4 halves make how many full ones?"
  m5_perimeter: "Perimeter is the distance all the way round: add all the sides."
  m5_same_area: "Area of a rectangle = rows × columns. 6 × 2 = 12. Which other one gives 12?"
  m5_square_number: "9 rows of 9 means 9 × 9."
  m5_square_side: "A square has 4 equal sides. Share 28 into 4 equal parts."
concepts:
- code: cbse5m.quilt.area
  title: Area by counting squares
  notes: |
    Area is the space a flat shape covers, counted in squares (square cm, cm²; square m, m²). A rectangle's area =
    length × breadth: a quilt 6 squares long and 4 wide has 24 squares. Half squares: two halves make one square.
    Different shapes can have the same area.
  explanations:
    text: 'Area is how much surface a shape covers. A quilt made of squares is easy: count the squares, or multiply squares along the length by squares along the breadth.'
    visual: 'Draw a quilt 6 squares across and 4 squares down. Count row by row: 6, 12, 18, 24. Area = 24 squares.'
    step_by_step: 'Step 1: Count the squares along one side. Step 2: Count along the other side. Step 3: Multiply.'
    real_world: Grandmothers sew quilts from square patches; floors are tiled square by square.
  picture:
    kind: bars
    bars:
    - label: Row 1
      value: 6
    - label: Row 2
      value: 6
    - label: Row 3
      value: 6
    - label: Row 4
      value: 6
    alt: A quilt with 4 rows of 6 squares each has 24 squares in all.
    unit: squares
  activity:
    type: formula
    prompt: A quilt made of squares. Set the rows and columns.
    inputs:
    - name: r
      label: Rows
      min: 1
      max: 24
      step: 1
      start: 1
    - name: c
      label: Squares in a row
      min: 1
      max: 24
      step: 1
      start: 1
    outputs:
    - name: area
      label: Squares in all (area)
      expr: r*c
    - name: per
      label: Squares along the border edge
      expr: 2*(r+c)
    goals:
    - prompt: 24 squares, 6 in each row.
      want:
        c: 6
        area: 24
      mistakes:
      - when:
          c: 6
          r: 18
        say: 6 + 18 = 24 adds. 6 squares in each of r rows is 6 × r.
    - prompt: 36 squares, with the shortest border.
      want:
        r: 6
        c: 6
      mistakes:
      - when:
          r: 4
          c: 9
        say: 36 squares, but the border is 26 long. A square shape has a shorter border.
      - when:
          r: 9
          c: 4
        say: 36 squares, but a long shape has a longer border.
    - prompt: 20 squares with a border 18 long.
      want:
        area: 20
        per: 18
      mistakes:
      - when:
          r: 2
          c: 10
        say: 20 squares, but the border is 24. Try a less long shape.
      - when:
          r: 10
          c: 2
        say: 20 squares, but the border is 24.
  items:
  - prompt: A quilt is 6 squares long and 4 squares wide. How many squares?
    answer: '24'
    check: 6*4
    difficulty: 1
    hints:
    - 6 × 4.
    - Rows × squares in a row.
    solution: 6 × 4 = 24 squares.
    mistakes:
      '20': c5_area_perim
  - prompt: What is the area of a rectangle 8 cm long and 5 cm wide, in square cm?
    answer: '40'
    check: 8*5
    difficulty: 1
    hints:
    - Length × breadth.
    - 8 × 5.
    solution: 8 × 5 = 40 cm².
    mistakes:
      '26': c5_area_perim
  - prompt: A square has sides of 7 cm. What is its area in square cm?
    answer: '49'
    check: 7*7
    difficulty: 1
    hints:
    - 7 × 7.
    - All sides equal.
    solution: 7 × 7 = 49 cm².
    mistakes:
      '28': c5_area_perim
  - prompt: A shape has 10 full squares and 4 half squares. What is its area in squares?
    answer: '12'
    check: 10 + 4/2
    difficulty: 2
    hints:
    - Two halves make one.
    - 4 halves = 2 squares.
    solution: 10 + 2 = 12 squares.
    mistakes: {"14": "m5_half_squares", "10": "m5_half_squares"}
  - prompt: Which has the same area as a 6 × 2 rectangle?
    options:
    - 3 × 4 rectangle
    - 6 × 3 rectangle
    - 2 × 2 square
    - 5 × 2 rectangle
    answer: 3 × 4 rectangle
    difficulty: 2
    hints:
    - 6 × 2 = 12.
    - Which also makes 12?
    solution: 3 × 4 = 12, same as 6 × 2.
    mistakes: {"5 × 2 rectangle": "m5_same_area"}
  - prompt: A quilt needs 9 rows of 9 patches. How many patches?
    answer: '81'
    check: 9*9
    difficulty: 2
    hints:
    - 9 × 9.
    - A square number.
    solution: 9 × 9 = 81 patches.
    mistakes: {"18": "m5_square_number", "72": "m5_square_number"}
- code: cbse5m.quilt.perim
  title: 'Perimeter: the border'
  after:
  - cbse5m.quilt.area
  notes: |
    Perimeter is the distance around a shape: add all the sides. Rectangle perimeter = 2 × (length + breadth): 6 m by
    4 m = 20 m. Square = 4 × side. A lace border for a quilt needs the perimeter. Shapes with the same area can have
    different perimeters.
  explanations:
    text: Perimeter is the length of the edge all the way around. To put lace on the border of a quilt, walk around it and add up every side.
    visual: 'Draw a 6 by 4 rectangle. Label each side: 6, 4, 6, 4. Add: 20.'
    step_by_step: 'Step 1: Write the length of every side. Step 2: Add them all. Step 3: For a rectangle, use 2 × (length + breadth).'
    real_world: Fencing a garden, framing a picture, and putting a border on a quilt all need the perimeter.
  picture:
    kind: flow
    steps:
    - 'Sides: 6, 4, 6, 4'
    - 6 + 4 = 10
    - 10 × 2 = 20
    - Perimeter 20 m
    alt: 'The perimeter of a 6 by 4 rectangle: sides 6, 4, 6, 4; 6 plus 4 is 10; doubled is 20.'
  activity:
    type: formula
    prompt: Lace goes all the way round a quilt.
    inputs:
    - name: l
      label: Length
      min: 1
      max: 30
      step: 1
      start: 1
      unit: m
    - name: w
      label: Width
      min: 1
      max: 30
      step: 1
      start: 1
      unit: m
    outputs:
    - name: per
      label: Lace needed
      expr: 2*(l+w)
      unit: m
    goals:
    - prompt: 16 m of lace. The quilt is 5 m long. Set the width.
      want:
        l: 5
        per: 16
      mistakes:
      - when:
          l: 5
          w: 11
        say: 5 + 11 = 16 counts only two sides. The lace goes round all four.
    - prompt: 20 m of lace. The quilt is 5 m long.
      want:
        l: 5
        per: 20
      mistakes:
      - when:
          l: 5
          w: 15
        say: Only two sides counted. Long + wide + long + wide = 20.
    - prompt: 30 m of lace. The quilt is 6 m wide.
      want:
        w: 6
        per: 30
      mistakes:
      - when:
          w: 6
          l: 24
        say: Only two sides counted. 30 ÷ 2 = 15 for one long and one wide side.
  items:
  - prompt: A quilt is 6 m long and 4 m wide. How much lace goes around it, in m?
    answer: '20'
    check: 2*(6+4)
    difficulty: 1
    hints:
    - Add all four sides.
    - 6 + 4 + 6 + 4.
    solution: 6 + 4 + 6 + 4 = 20 m.
    mistakes:
      '24': c5_area_perim
      '10': c5_area_perim
  - prompt: What is the perimeter of a square with side 9 cm, in cm?
    answer: '36'
    check: 4*9
    difficulty: 1
    hints:
    - 4 equal sides.
    - 4 × 9.
    solution: 4 × 9 = 36 cm.
    mistakes:
      '81': c5_area_perim
  - prompt: A triangle has sides 5 cm, 6 cm and 7 cm. What is its perimeter in cm?
    answer: '18'
    check: 5+6+7
    difficulty: 1
    hints:
    - Add all three sides.
    - 5 + 6 + 7.
    solution: 5 + 6 + 7 = 18 cm.
    mistakes: {"17": "m5_perimeter", "210": "m5_perimeter"}
  - prompt: A garden is 12 m by 8 m. How many metres of fence go round it?
    answer: '40'
    check: 2*(12+8)
    difficulty: 2
    hints:
    - 2 × (12 + 8).
    - 12 + 8 = 20.
    solution: 2 × 20 = 40 m.
    mistakes:
      '96': c5_area_perim
  - prompt: 'Area or perimeter: which do you need to buy a border for a table cloth?'
    options:
    - perimeter
    - area
    - both equally
    - neither
    answer: perimeter
    difficulty: 1
    hints:
    - The border goes around the edge.
    - Edge = perimeter.
    solution: A border goes around the edge, so you need the perimeter.
    mistakes: {"area": "m5_border"}
  - prompt: A square has a perimeter of 28 cm. How long is one side, in cm?
    answer: '7'
    check: 28/4
    difficulty: 2
    hints:
    - 4 equal sides.
    - 28 ÷ 4.
    solution: 28 ÷ 4 = 7 cm.
    mistakes: {"14": "m5_square_side", "4": "m5_square_side"}
