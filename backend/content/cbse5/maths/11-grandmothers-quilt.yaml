# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 11
title: Grandmother's Quilt
tips:
  c5_area_perim: Area counts the squares inside (multiply length × breadth). Perimeter goes around the edge (add all sides).
  m5_border: "A border goes along the edge. Area covers the inside."
  m5_half_squares: "2 half squares make 1 full square. 4 halves make how many full ones?"
  m5_perimeter: "Perimeter is the distance all the way round: add all the sides."
  m5_same_area: "Area of a rectangle = rows × columns. 6 × 2 = 12. Which other one gives 12?"
  m5_square_number: "9 rows of 9 means 9 × 9."
  m5_square_side: "A square has 4 equal sides. Share 28 into 4 equal parts."
  c5m11_area: Area counts the squares inside. For a rectangle, rows × squares in each row.
  c5m11_half: Two half squares together make one whole square.
  c5m11_perim: Perimeter is the walk all the way round the edge. Add every side, not just two.
  c5m11_which: 'Ask: is the job to cover the whole inside, or only to go round the edge? Each needs a different measure.'
  c5m11_side: A square has 4 equal sides. Share the perimeter equally among them.
concepts:
- code: cbse5m.quilt.area
  title: Area by counting squares
  notes: |
    Area is the space a flat shape covers, counted in squares (square cm, cm²; square m, m²). A rectangle's area =
    length × breadth: a quilt 6 squares long and 4 wide has 24 squares. Half squares: two halves make one square.
    Different shapes can have the same area.
  explanations:
    text: 'Area is how much surface a shape covers. A quilt made of squares is easy: count the squares, or multiply squares along the length by squares along the breadth.'
    visual: 'Draw a quilt 6 squares across and 4 squares down. Count row by row: 6, 12, 18, 24. Area = 24 squares.'
    step_by_step: 'Step 1: Count the squares along one side. Step 2: Count along the other side. Step 3: Multiply.'
    real_world: Grandmothers sew quilts from square patches; floors are tiled square by square.
  picture:
    kind: bars
    bars:
    - label: Row 1
      value: 6
    - label: Row 2
      value: 6
    - label: Row 3
      value: 6
    - label: Row 4
      value: 6
    alt: A quilt with 4 rows of 6 squares each has 24 squares in all.
    unit: squares
  activity:
    type: formula
    prompt: A quilt made of squares. Set the rows and columns.
    inputs:
    - name: r
      label: Rows
      min: 1
      max: 24
      step: 1
      start: 1
    - name: c
      label: Squares in a row
      min: 1
      max: 24
      step: 1
      start: 1
    outputs:
    - name: area
      label: Squares in all (area)
      expr: r*c
    - name: per
      label: Squares along the border edge
      expr: 2*(r+c)
    goals:
    - prompt: 24 squares, 6 in each row.
      want:
        c: 6
        area: 24
      mistakes:
      - when:
          c: 6
          r: 18
        say: 6 + 18 = 24 adds. 6 squares in each of r rows is 6 × r.
    - prompt: 36 squares, with the shortest border.
      want:
        r: 6
        c: 6
      mistakes:
      - when:
          r: 4
          c: 9
        say: 36 squares, but the border is 26 long. A square shape has a shorter border.
      - when:
          r: 9
          c: 4
        say: 36 squares, but a long shape has a longer border.
    - prompt: 20 squares with a border 18 long.
      want:
        area: 20
        per: 18
      mistakes:
      - when:
          r: 2
          c: 10
        say: 20 squares, but the border is 24. Try a less long shape.
      - when:
          r: 10
          c: 2
        say: 20 squares, but the border is 24.
  lesson:
    - teach: Area is the space a flat shape covers. We measure it by counting squares. A quilt with 6 squares in each row and 4 rows has 6 × 4 = 24 squares.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: 6 long
        rows:
        - size: 1
          label: 4 wide
        cells:
        - - 24 squares
        alt: A quilt 6 squares long and 4 squares wide has 24 squares.
      check:
        prompt: A patch is 5 squares long and 3 squares wide. How many squares?
        options:
        - '15'
        - '8'
        - '16'
        answer: '15'
        why: 5 × 3 = 15.
      ways:
      - style: step_by_step
        teach: 'Find the area of a mat 7 squares long and 3 squares wide. Step 1: Count one row: 7 squares. Step 2: Count the rows: 3. Step 3: Multiply: 7 × 3 = 21 squares. No need to count each square.'
      - style: real_world
        teach: 'A chessboard has 8 rows of 8 squares. Instead of counting all of them, multiply: 8 × 8 = 64 squares.'
    - teach: For a rectangle, area = length × breadth. A table 8 cm by 5 cm has area 40 square cm (cm²). A square with side 7 cm has area 7 × 7 = 49 cm².
      check:
        prompt: What is the area of a square with side 4 cm?
        options:
        - 16 cm²
        - 8 cm²
        - 16 cm
        answer: 16 cm²
        why: 4 × 4 = 16, measured in square cm.
      ways:
      - style: visual
        teach: Area of a rectangle and a square, as length × breadth.
        picture:
          kind: compare
          columns:
          - title: Rectangle 9 cm by 4 cm
            points:
            - Area = 9 × 4
            - = 36 cm²
          - title: Square, side 6 cm
            points:
            - Area = 6 × 6
            - = 36 cm²
          alt: A rectangle 9 cm by 4 cm has area 9 times 4, 36 square cm. A square of side 6 cm has area 6 times 6, also 36 square cm.
      - style: real_world
        teach: A carpenter making a table top of 2 m by 1 m needs 2 × 1 = 2 square metres of wood. Area tells how much material covers a surface.
    - teach: 'When counting on squared paper, two half squares make one whole square. Different shapes can have the same area: a 6 × 2 rectangle and a 3 × 4 rectangle both have 12 squares.'
      check:
        prompt: A shape has 6 full squares and 2 half squares. What is its area?
        options:
        - 7 squares
        - 8 squares
        - 6 squares
        answer: 7 squares
        why: 2 halves = 1 whole, so 6 + 1 = 7.
      ways:
      - style: visual
        teach: Counting a shape that has whole squares and half squares.
        picture:
          kind: flow
          steps:
          - 'Count the whole squares: 7'
          - 'Count the half squares: 4'
          - 4 halves make 2 wholes
          - Area = 7 + 2 = 9 squares
          alt: Count 7 whole squares and 4 half squares. 4 halves make 2 wholes, so the area is 7 plus 2, 9 squares.
      - style: real_world
        teach: 'Two garden beds look different: one long and thin, 10 m by 2 m, and one 5 m by 4 m. Both cover 20 square metres, so both need the same amount of soil.'
  items:
  - prompt: A quilt is 6 squares long and 4 squares wide. How many squares?
    answer: '24'
    check: 6*4
    difficulty: 1
    hints:
    - 6 × 4.
    - Rows × squares in a row.
    solution: 6 × 4 = 24 squares.
    mistakes:
      '20': c5_area_perim
  - prompt: What is the area of a rectangle 8 cm long and 5 cm wide, in square cm?
    answer: '40'
    check: 8*5
    difficulty: 1
    hints:
    - Length × breadth.
    - 8 × 5.
    solution: 8 × 5 = 40 cm².
    mistakes:
      '26': c5_area_perim
  - prompt: A square has sides of 7 cm. What is its area in square cm?
    answer: '49'
    check: 7*7
    difficulty: 1
    hints:
    - 7 × 7.
    - All sides equal.
    solution: 7 × 7 = 49 cm².
    mistakes:
      '28': c5_area_perim
  - prompt: A shape has 10 full squares and 4 half squares. What is its area in squares?
    answer: '12'
    check: 10 + 4/2
    difficulty: 2
    hints:
    - Two halves make one.
    - 4 halves = 2 squares.
    solution: 10 + 2 = 12 squares.
    mistakes: {"14": "m5_half_squares", "10": "m5_half_squares"}
  - prompt: Which has the same area as a 6 × 2 rectangle?
    options:
    - 3 × 4 rectangle
    - 6 × 3 rectangle
    - 2 × 2 square
    - 5 × 2 rectangle
    answer: 3 × 4 rectangle
    difficulty: 2
    hints:
    - 6 × 2 = 12.
    - Which also makes 12?
    solution: 3 × 4 = 12, same as 6 × 2.
    mistakes: {"5 × 2 rectangle": "m5_same_area"}
  - prompt: A quilt needs 9 rows of 9 patches. How many patches?
    answer: '81'
    check: 9*9
    difficulty: 2
    hints:
    - 9 × 9.
    - A square number.
    solution: 9 × 9 = 81 patches.
    mistakes: {"18": "m5_square_number", "72": "m5_square_number"}
  - prompt: A rug is 9 squares long and 5 squares wide. How many squares?
    answer: '45'
    check: 9*5
    difficulty: 1
    hints:
    - Length × width.
    - 9 × 5.
    solution: 'Step 1: 9 × 5. Step 2: = 45 squares.'
    mistakes:
      '14': c5m11_area
      '28': c5m11_perim
  - prompt: What is the area of a rectangle 12 cm long and 3 cm wide, in square cm?
    answer: '36'
    check: 12*3
    difficulty: 1
    hints:
    - Area = length × breadth.
    - 12 × 3.
    solution: 'Step 1: 12 × 3. Step 2: = 36 cm².'
    mistakes:
      '15': c5m11_area
      '30': c5m11_perim
  - prompt: A square tile has side 10 cm. What is its area in square cm?
    answer: '100'
    check: 10*10
    difficulty: 2
    hints:
    - Both sides are 10 cm.
    - 10 × 10.
    solution: 'Step 1: 10 × 10. Step 2: = 100 cm².'
    mistakes:
      '40': c5m11_perim
      '20': c5m11_area
  - prompt: A shape has 8 full squares and 6 half squares. What is its area in squares?
    answer: '11'
    check: 8+6//2
    difficulty: 2
    hints:
    - Pair up the half squares.
    - 6 halves make 3 wholes.
    solution: 'Step 1: 6 halves = 3 wholes. Step 2: 8 + 3 = 11 squares.'
    mistakes:
      '14': c5m11_half
      '17': c5m11_half
  - prompt: Which rectangle has the same area as a 4 × 6 rectangle?
    options:
    - 3 × 8
    - 5 × 5
    - 2 × 10
    answer: 3 × 8
    difficulty: 2
    hints:
    - Find the area of 4 × 6 first.
    - Which other one also makes that number?
    solution: 'Step 1: 4 × 6 = 24. Step 2: 3 × 8 = 24 too.'
    mistakes:
      5 × 5: c5m11_area
      2 × 10: c5m11_area
  - prompt: A wall is 3 m high and 5 m long. How many square metres of paint does it need?
    answer: '15'
    check: 3*5
    difficulty: 2
    hints:
    - Paint covers the inside of the wall.
    - 3 × 5.
    solution: 'Step 1: area = 3 × 5. Step 2: = 15 m².'
    mistakes:
      '16': c5m11_which
      '8': c5m11_area
  - prompt: Grandmother's quilt has 8 rows of 8 patches. 10 patches are red. How many are not red?
    answer: '54'
    check: 8*8-10
    difficulty: 3
    hints:
    - Find all the patches first.
    - Then take away the red ones.
    solution: 'Step 1: 8 × 8 = 64. Step 2: 64 − 10 = 54.'
    mistakes:
      '64': c5m11_area
      '6': c5m11_area
  - prompt: Which unit is used for area?
    options:
    - Square centimetres
    - Centimetres
    - Kilograms
    answer: Square centimetres
    difficulty: 1
    hints:
    - Area counts squares.
    - The unit must say 'square'.
    solution: 'Step 1: area counts squares. Step 2: unit is square cm (cm²).'
    mistakes:
      Centimetres: c5m11_which
      Kilograms: c5m11_which
  - prompt: A floor is 6 m by 4 m. Each tile covers 1 square metre. How many tiles are needed?
    answer: '24'
    check: 6*4
    difficulty: 3
    hints:
    - Tiles cover the floor's area.
    - 6 × 4.
    solution: 'Step 1: area = 6 × 4 = 24 m². Step 2: 24 tiles.'
    mistakes:
      '20': c5m11_which
      '10': c5m11_area
  - prompt: 'Case: A classroom floor is 8 m long and 6 m wide. Each floor tile covers 1 square metre. A builder brought 42 tiles. Are there enough?'
    options:
    - No, 48 tiles are needed
    - Yes, 42 is enough
    - No, 28 tiles are needed
    answer: No, 48 tiles are needed
    hints:
    - Find the area of the floor.
    - Is that more or less than 42?
    solution: Area = 8 × 6 = 48 square metres, so 48 tiles are needed. 42 is 6 short.
    mistakes:
      Yes, 42 is enough: c5m11_area
      No, 28 tiles are needed: c5m11_perim
    exam: case
    difficulty: 2
  - prompt: 'Situation: Grandmother has 36 square patches. She wants a rectangular quilt that is 4 patches wide. How many patches long will it be?'
    options:
    - '9'
    - '32'
    - '8'
    answer: '9'
    hints:
    - Area = length × breadth.
    - What times 4 gives 36?
    solution: Length × 4 = 36, so the length is 36 ÷ 4 = 9 patches.
    mistakes:
      '32': c5m11_area
      '8': c5m11_area
    exam: competency
    difficulty: 2
- code: cbse5m.quilt.perim
  title: 'Perimeter: the border'
  after:
  - cbse5m.quilt.area
  notes: |
    Perimeter is the distance around a shape: add all the sides. Rectangle perimeter = 2 × (length + breadth): 6 m by
    4 m = 20 m. Square = 4 × side. A lace border for a quilt needs the perimeter. Shapes with the same area can have
    different perimeters.
  explanations:
    text: Perimeter is the length of the edge all the way around. To put lace on the border of a quilt, walk around it and add up every side.
    visual: 'Draw a 6 by 4 rectangle. Label each side: 6, 4, 6, 4. Add: 20.'
    step_by_step: 'Step 1: Write the length of every side. Step 2: Add them all. Step 3: For a rectangle, use 2 × (length + breadth).'
    real_world: Fencing a garden, framing a picture, and putting a border on a quilt all need the perimeter.
  picture:
    kind: flow
    steps:
    - 'Sides: 6, 4, 6, 4'
    - 6 + 4 = 10
    - 10 × 2 = 20
    - Perimeter 20 m
    alt: 'The perimeter of a 6 by 4 rectangle: sides 6, 4, 6, 4; 6 plus 4 is 10; doubled is 20.'
  activity:
    type: formula
    prompt: Lace goes all the way round a quilt.
    inputs:
    - name: l
      label: Length
      min: 1
      max: 30
      step: 1
      start: 1
      unit: m
    - name: w
      label: Width
      min: 1
      max: 30
      step: 1
      start: 1
      unit: m
    outputs:
    - name: per
      label: Lace needed
      expr: 2*(l+w)
      unit: m
    goals:
    - prompt: 16 m of lace. The quilt is 5 m long. Set the width.
      want:
        l: 5
        per: 16
      mistakes:
      - when:
          l: 5
          w: 11
        say: 5 + 11 = 16 counts only two sides. The lace goes round all four.
    - prompt: 20 m of lace. The quilt is 5 m long.
      want:
        l: 5
        per: 20
      mistakes:
      - when:
          l: 5
          w: 15
        say: Only two sides counted. Long + wide + long + wide = 20.
    - prompt: 30 m of lace. The quilt is 6 m wide.
      want:
        w: 6
        per: 30
      mistakes:
      - when:
          w: 6
          l: 24
        say: Only two sides counted. 30 ÷ 2 = 15 for one long and one wide side.
  lesson:
    - teach: Perimeter is the distance all the way round a shape. Add the lengths of all the sides. A triangle with sides 3 cm, 4 cm and 5 cm has perimeter 12 cm.
      check:
        prompt: A triangle has sides 2 cm, 3 cm and 4 cm. What is its perimeter?
        options:
        - 9 cm
        - 24 cm
        - 7 cm
        answer: 9 cm
        why: 2 + 3 + 4 = 9.
      ways:
      - style: step_by_step
        teach: 'Walk round a shape. Step 1: Start at one corner. Step 2: Walk along each side and add its length. Step 3: Stop when you are back at the start. For sides 4 cm, 4 cm and 6 cm: 4 + 4 + 6 = 14 cm.'
      - style: visual
        teach: Walking round a triangle and adding each side to find the perimeter.
        picture:
          kind: flow
          steps:
          - 'Side 1: 4 cm'
          - 'Side 2: 4 cm'
          - 'Side 3: 6 cm'
          - 'Perimeter: 4 + 4 + 6 = 14 cm'
          alt: A triangle with sides 4 cm, 4 cm and 6 cm. Adding all three sides gives a perimeter of 14 cm.
    - teach: 'A rectangle has two lengths and two breadths, so perimeter = length + breadth + length + breadth = 2 × (length + breadth). A 6 m by 4 m quilt: 2 × 10 = 20 m. A square: 4 × side.'
      picture:
        kind: flow
        steps:
        - 6 m + 4 m
        - = 10 m (half way round)
        - × 2
        - = 20 m all round
        alt: Perimeter of a 6 m by 4 m rectangle is twice 10 m, so 20 m.
      check:
        prompt: What is the perimeter of a square with side 5 cm?
        options:
        - 20 cm
        - 25 cm
        - 10 cm
        answer: 20 cm
        why: 4 sides × 5 cm = 20 cm.
      ways:
      - style: step_by_step
        teach: 'Perimeter of a rectangle 9 cm by 5 cm. Step 1: Add one length and one breadth: 9 + 5 = 14 cm. Step 2: There are two of each, so 2 × 14 = 28 cm. For a square of side 5 cm, it is 4 × 5 = 20 cm.'
      - style: real_world
        teach: A photo frame shop measures round the edge of a picture to cut the wooden strips. A picture 30 cm by 20 cm needs 2 × (30 + 20) = 100 cm of frame strip.
    - teach: Use area to cover a surface (paint, tiles, cloth). Use perimeter to go round the edge (lace, fence, border). Shapes with the same area can have different perimeters.
      check:
        prompt: You want to put a fence round a garden. Do you need area or perimeter?
        options:
        - Perimeter
        - Area
        - Weight
        answer: Perimeter
        why: A fence goes round the edge.
      ways:
      - style: visual
        teach: 'Area or perimeter: which one each job needs.'
        picture:
          kind: compare
          columns:
          - title: Area (covering)
            points:
            - Painting a wall
            - Tiling a floor
            - Carpet for a room
          - title: Perimeter (going round)
            points:
            - Fence round a garden
            - Lace on a cloth
            - Frame round a photo
          alt: 'Area is for covering: painting a wall, tiling a floor, carpet for a room. Perimeter is for going round: a fence round a garden, lace on a cloth, a frame round a photo.'
      - style: real_world
        teach: Shapes with the same area can have different edges. 9 square tiles laid in a 3 × 3 square have a perimeter of 12 sides; laid in a line of 9 they have a perimeter of 20 sides.
  items:
  - prompt: A quilt is 6 m long and 4 m wide. How much lace goes around it, in m?
    answer: '20'
    check: 2*(6+4)
    difficulty: 1
    hints:
    - Add all four sides.
    - 6 + 4 + 6 + 4.
    solution: 6 + 4 + 6 + 4 = 20 m.
    mistakes:
      '24': c5_area_perim
      '10': c5_area_perim
  - prompt: What is the perimeter of a square with side 9 cm, in cm?
    answer: '36'
    check: 4*9
    difficulty: 1
    hints:
    - 4 equal sides.
    - 4 × 9.
    solution: 4 × 9 = 36 cm.
    mistakes:
      '81': c5_area_perim
  - prompt: A triangle has sides 5 cm, 6 cm and 7 cm. What is its perimeter in cm?
    answer: '18'
    check: 5+6+7
    difficulty: 1
    hints:
    - Add all three sides.
    - 5 + 6 + 7.
    solution: 5 + 6 + 7 = 18 cm.
    mistakes: {"17": "m5_perimeter", "210": "m5_perimeter"}
  - prompt: A garden is 12 m by 8 m. How many metres of fence go round it?
    answer: '40'
    check: 2*(12+8)
    difficulty: 2
    hints:
    - 2 × (12 + 8).
    - 12 + 8 = 20.
    solution: 2 × 20 = 40 m.
    mistakes:
      '96': c5_area_perim
  - prompt: 'Area or perimeter: which do you need to buy a border for a table cloth?'
    options:
    - perimeter
    - area
    - both equally
    - neither
    answer: perimeter
    difficulty: 1
    hints:
    - The border goes around the edge.
    - Edge = perimeter.
    solution: A border goes around the edge, so you need the perimeter.
    mistakes: {"area": "m5_border"}
  - prompt: A square has a perimeter of 28 cm. How long is one side, in cm?
    answer: '7'
    check: 28/4
    difficulty: 2
    hints:
    - 4 equal sides.
    - 28 ÷ 4.
    solution: 28 ÷ 4 = 7 cm.
    mistakes: {"14": "m5_square_side", "4": "m5_square_side"}
  - prompt: A rectangle is 10 cm long and 3 cm wide. What is its perimeter in cm?
    answer: '26'
    check: 2*(10+3)
    difficulty: 1
    hints:
    - Add all four sides.
    - 10 + 3 + 10 + 3.
    solution: 'Step 1: 10 + 3 = 13. Step 2: 2 × 13 = 26 cm.'
    mistakes:
      '13': c5m11_perim
      '30': c5m11_which
  - prompt: What is the perimeter of a square with side 12 cm, in cm?
    answer: '48'
    check: 4*12
    difficulty: 1
    hints:
    - A square has 4 equal sides.
    - 4 × 12.
    solution: 'Step 1: 4 × 12. Step 2: = 48 cm.'
    mistakes:
      '24': c5m11_perim
      '144': c5m11_which
  - prompt: A field is 20 m by 15 m. How many metres of rope go round it once?
    answer: '70'
    check: 2*(20+15)
    difficulty: 2
    hints:
    - Rope goes round the edge.
    - 2 × (20 + 15).
    solution: 'Step 1: 20 + 15 = 35. Step 2: 2 × 35 = 70 m.'
    mistakes:
      '35': c5m11_perim
      '300': c5m11_which
  - prompt: A square park has perimeter 40 m. How long is each side, in m?
    answer: '10'
    check: 40//4
    difficulty: 2
    hints:
    - A square has 4 equal sides.
    - 40 ÷ 4.
    solution: 'Step 1: 40 ÷ 4. Step 2: = 10 m.'
    mistakes:
      '20': c5m11_side
      '160': c5m11_side
  - prompt: Which do you need to buy a frame for a photo?
    options:
    - Perimeter
    - Area
    - Capacity
    answer: Perimeter
    difficulty: 2
    hints:
    - A frame goes round the photo.
    - It does not cover the picture.
    solution: 'Step 1: the frame goes round the edge. Step 2: so perimeter.'
    mistakes:
      Area: c5m11_which
      Capacity: c5m11_which
  - prompt: A shape has sides 4 cm, 6 cm, 4 cm, 6 cm and 5 cm. What is its perimeter in cm?
    answer: '25'
    check: 4+6+4+6+5
    difficulty: 2
    hints:
    - Add all five sides.
    - 4 + 6 + 4 + 6 = 20 first.
    solution: 'Step 1: 4 + 6 + 4 + 6 = 20. Step 2: 20 + 5 = 25 cm.'
    mistakes:
      '20': c5m11_perim
      '15': c5m11_perim
  - prompt: A 4 × 4 square and a 2 × 8 rectangle both have area 16. Which has the longer perimeter?
    options:
    - The 2 × 8 rectangle
    - The 4 × 4 square
    - They are equal
    answer: The 2 × 8 rectangle
    difficulty: 3
    hints:
    - 'Square: 4 × 4 = 16 round the edge.'
    - 'Rectangle: 2 × (2 + 8).'
    solution: 'Step 1: square perimeter 16, rectangle 2 × 10 = 20. Step 2: the rectangle is longer.'
    mistakes:
      The 4 × 4 square: c5m11_perim
      They are equal: c5m11_which
  - prompt: Lace costs ₹5 a metre. How much for lace round a 3 m by 2 m tablecloth, in rupees?
    answer: '50'
    check: 2*(3+2)*5
    difficulty: 3
    hints:
    - Find the perimeter first.
    - Then multiply by the cost per metre.
    solution: 'Step 1: 2 × (3 + 2) = 10 m. Step 2: 10 × 5 = ₹50.'
    mistakes:
      '30': c5m11_which
      '25': c5m11_perim
  - prompt: A rectangle has perimeter 30 cm and length 10 cm. What is its breadth in cm?
    answer: '5'
    check: 30//2-10
    difficulty: 3
    hints:
    - Half the perimeter is length + breadth.
    - 30 ÷ 2 = 15.
    solution: 'Step 1: 15 = 10 + breadth. Step 2: breadth = 5 cm.'
    mistakes:
      '20': c5m11_perim
      '10': c5m11_perim
  - prompt: 'Case: A garden is 15 m long and 10 m wide. The owner buys 40 m of fence. A child says it is enough because 15 + 10 + 15 = 40. What is wrong?'
    options:
    - One side was left out; 50 m is needed
    - Nothing, 40 m is enough
    - 'The area should be used: 150 m'
    answer: One side was left out; 50 m is needed
    hints:
    - How many sides does a rectangle have?
