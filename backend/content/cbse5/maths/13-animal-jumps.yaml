  - prompt: 'Case: Two children play a hopping game from 0. One hops 4 squares at a time, the other 6. They want to know where both will first land on the same square. A child says 24, because 4 × 6 = 24. Is that the first meeting square?'
    options:
    - No, they first meet at 12
    - Yes, 24 is first
    - No, they first meet at 10
    answer: No, they first meet at 12
    hints:
    - List where each child lands.
    - Look for the first number in both lists, not just any common one.
    solution: '4: 4, 8, 12. 6: 6, 12. They first meet at 12. 24 is a common multiple, but not the smallest.'
    mistakes:
      Yes, 24 is first: c5m13_meet
      No, they first meet at 10: c5m13_meet
    exam: case
    difficulty: 2
  - prompt: 'Situation: A horse jumps 9 m each time and a goat 4 m. Both start together. How far ahead is the horse after 6 jumps each?'
    options:
    - 30 m
    - 54 m
    - 13 m
    answer: 30 m
    hints:
    - How much does the horse gain in one jump?
    - Multiply that by the number of jumps.
    solution: 'Each jump the horse gains 9 − 4 = 5 m. After 6 jumps: 5 × 6 = 30 m ahead.'
    mistakes:
      54 m: c5m13_ahead
      13 m: c5m13_ahead
    exam: competency
