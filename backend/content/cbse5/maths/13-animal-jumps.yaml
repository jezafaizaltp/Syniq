# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 13. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 13
title: Animal Jumps
tips:
  c5_skip: Count the jumps, not the numbers you land on. Each jump moves the same distance.
  m5_ahead: "Find each animal's distance after 4 jumps first, then subtract."
  m5_both_land: "The 4-jumper lands only on the 4 times table. Which choice is in that table?"
  m5_not_land: "The frog lands on the 4 times table. Which number is NOT in it?"
  m5_skip5: "Jumps of 5 always land on numbers ending in 0 or 5."
concepts:
- code: cbse5m.jumps.skip
  title: Skip counting with jumps
  notes: |
    An animal that jumps the same distance each time lands on multiples: a frog jumping 3 steps from 0 lands on 3, 6,
    9, 12 ... After n jumps it is at 3 × n. To reach 30 it needs 30 ÷ 3 = 10 jumps. A number it lands on is divisible by
    its jump size. Starting somewhere else: from 2 with jumps of 5: 2, 7, 12, 17.
  explanations:
    text: 'If a frog always jumps 3 steps, it lands on 3, 6, 9, 12: the 3 times table. To know where it is after 7 jumps, multiply 3 × 7. To know how many jumps to reach a number, divide.'
    visual: Draw a number line from 0 to 15. Draw curved arrows from 0 to 3, 3 to 6, 6 to 9 ... The frog lands only on multiples of 3.
    step_by_step: 'Step 1: Find the jump size. Step 2: Position after n jumps = jump size × n (plus the start). Step 3: Jumps needed = distance ÷ jump size.'
    real_world: Kangaroos, frogs and grasshoppers jump in leaps; counting by 2s, 5s and 10s makes counting money faster.
  picture:
    kind: number_line
    from: 0
    to: 15
    step: 1
    points:
    - at: 3
      label: '3'
    - at: 6
      label: '6'
    - at: 9
      label: '9'
    - at: 12
      label: '12'
    - at: 15
      label: '15'
    alt: A frog jumping 3 steps from 0 lands on 3, 6, 9, 12 and 15.
    jumps:
    - from: 0
      to: 3
      label: '+3'
    - from: 3
      to: 6
      label: '+3'
    - from: 6
      to: 9
      label: '+3'
    - from: 9
      to: 12
      label: '+3'
    - from: 12
      to: 15
      label: '+3'
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Animals jump the same number of steps each time. Mark the answer.
    goals:
    - prompt: A frog jumps 3 each time. Where is it after 7 jumps?
      target: 21
      mistakes:
      - when:
          v: 10
        say: 7 + 3 adds. 7 jumps of 3 is 3 × 7.
      - when:
          v: 24
        say: That's 8 jumps. Count again.
    - prompt: A rabbit jumps 4 each time. Where after 9 jumps?
      target: 36
      mistakes:
      - when:
          v: 13
        say: 9 + 4 adds. 9 jumps of 4 is 4 × 9.
      - when:
          v: 32
        say: That's 8 jumps. One more.
    - prompt: A kangaroo jumps 5 each time and lands on 35. How many jumps?
      target: 7
      mistakes:
      - when:
          v: 35
        say: '35 is where it landed. Count the jumps: 35 ÷ 5.'
      - when:
          v: 30
        say: 30 is 35 − 5. How many 5s make 35?
  items:
  - prompt: A frog jumps 3 steps each time, starting at 0. Where is it after 7 jumps?
    answer: '21'
    check: 3*7
    difficulty: 1
    hints:
    - 3 × 7.
    - 3, 6, 9, ...
    solution: 3 × 7 = 21.
    mistakes:
      '7': c5_skip
  - prompt: A rabbit jumps 4 steps each time from 0. How many jumps to reach 36?
    answer: '9'
    check: 36/4
    difficulty: 1
    hints:
    - 36 ÷ 4.
    - 4 × ? = 36.
    solution: 36 ÷ 4 = 9 jumps.
    mistakes:
      '36': c5_skip
  - prompt: A frog jumps 5 steps each time from 0. Which number will it land on?
    options:
    - '35'
    - '32'
    - '24'
    - '18'
    answer: '35'
    difficulty: 1
    hints:
    - It lands on multiples of 5.
    - Ends in 0 or 5.
    solution: 35 = 5 × 7, a multiple of 5.
    mistakes: {"32": "m5_skip5"}
  - prompt: A grasshopper starts at 2 and jumps 5 each time. Where is it after 3 jumps?
    answer: '17'
    check: 2+3*5
    difficulty: 2
    hints:
    - 2 + 5 + 5 + 5.
    - 2 + 15.
    solution: 2 + 3 × 5 = 17.
    mistakes:
      '15': c5_skip
  - prompt: A kangaroo jumps 6 m each time. How far does it go in 8 jumps, in m?
    answer: '48'
    check: 6*8
    difficulty: 1
    hints:
    - 6 × 8.
    - Same jump each time.
    solution: 6 × 8 = 48 m.
    mistakes: {"14": "m5_times_table", "42": "m5_times_table"}
  - prompt: Which number would a frog jumping 4 steps from 0 NOT land on?
    options:
    - '30'
    - '28'
    - '32'
    - '40'
    answer: '30'
    difficulty: 2
    hints:
    - It lands on multiples of 4.
    - Is 30 in the 4 table?
    solution: 30 ÷ 4 leaves 2, so the frog skips 30.
    mistakes: {"28": "m5_not_land"}
- code: cbse5m.jumps.meet
  title: When two jumpers meet
  after:
  - cbse5m.jumps.skip
  notes: |
    Two animals start at 0 with different jumps (2 and 3). They land on the same number at common multiples: 6, 12, 18.
    The first meeting point is the smallest common multiple. A long jumper and a short jumper: the difference in distance
    after n jumps = (difference in jump) × n.
  explanations:
    text: If a frog jumps 2 and a rabbit jumps 3, they both land on 6 first. That is because 6 is in both the 2 and 3 times tables. They will meet again at 12, 18, and so on.
    visual: Draw a number line to 12. Mark the frog's jumps of 2 above the line and the rabbit's jumps of 3 below. They share 6 and 12.
    step_by_step: 'Step 1: List landing spots for each animal. Step 2: Find the first number in both lists. Step 3: That is where they first meet.'
    real_world: Two friends taking steps of different lengths line up again after a certain distance.
  picture:
    kind: compare
    columns:
    - title: Frog jumps 2
      points:
      - 2, 4, 6
      - 8, 10, 12
    - title: Rabbit jumps 3
      points:
      - 3, 6
      - 9, 12
    - title: Both land on
      points:
      - '6'
      - '12'
    alt: A frog jumping 2 and a rabbit jumping 3 both land on 6 and 12.
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Two animals start at 0. Mark the first number where both land.
    goals:
    - prompt: Jumps of 2 and 3.
      target: 6
      mistakes:
      - when:
          v: 5
        say: 2 + 3 = 5, but 5 isn't in the 2 times table.
      - when:
          v: 12
        say: Both land on 12, but they met earlier.
    - prompt: Jumps of 4 and 6.
      target: 12
      mistakes:
      - when:
          v: 24
        say: 4 × 6 = 24. They both land there, but 12 comes first.
      - when:
          v: 10
        say: 4 + 6 = 10. Does a 4-jumper land on 10?
    - prompt: Jumps of 5 and 8.
      target: 40
      mistakes:
      - when:
          v: 13
        say: 5 + 8 = 13. Does a 5-jumper land on 13?
      - when:
          v: 20
        say: 20 is in the 5 list, but not the 8 list.
  items:
  - prompt: A frog jumps 2 and a rabbit jumps 3, both from 0. What is the first number they both land on?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - List 2, 4, 6 and 3, 6.
    - Which appears in both?
    solution: 6 is the first common landing spot.
    mistakes: {"5": "m5_lcm", "12": "m5_lcm"}
  - prompt: Animals jump 4 and 6 from 0. Where do they first meet?
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - 4, 8, 12 and 6, 12.
    - Smallest common multiple.
    solution: They first meet at 12.
    mistakes:
      '24': c5_skip
  - prompt: A deer jumps 5 m and a frog 2 m. After 4 jumps each, how many metres ahead is the deer?
    answer: '12'
    check: 5*4-2*4
    difficulty: 2
    hints:
    - 'Deer: 5 × 4. Frog: 2 × 4.'
    - 20 − 8.
    solution: 20 − 8 = 12 m.
    mistakes: {"28": "m5_ahead", "3": "m5_ahead"}
  - prompt: Animals jump 3 and 5 from 0. Where do they first meet?
    answer: '15'
    check: '15'
    difficulty: 2
    hints:
    - 3, 6, 9, 12, 15.
    - 5, 10, 15.
    solution: 15 is the first common multiple.
    mistakes: {"8": "m5_lcm", "30": "m5_lcm"}
  - prompt: 'Animals jumping 2 and 4 from 0 both land on:'
    options:
    - '8'
    - '6'
    - '10'
    - '2'
    answer: '8'
    difficulty: 1
    hints:
    - The jumper of 4 lands on 4, 8, 12.
    - Is 8 also a multiple of 2?
    solution: 8 is a multiple of both 2 and 4.
    mistakes: {"6": "m5_both_land"}
  - prompt: Two animals jump 6 and 9 from 0. Where do they first meet?
    answer: '18'
    check: '18'
    difficulty: 2
    hints:
    - 6, 12, 18.
    - 9, 18.
    solution: They first meet at 18.
    mistakes: {"36": "m5_lcm", "54": "m5_lcm"}
