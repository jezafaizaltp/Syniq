# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 5
title: Far and Near
tips:
  c5_units: 1 km = 1000 m, 1 m = 100 cm. To go to a smaller unit, multiply; to a bigger unit, divide.
concepts:
- code: cbse5m.far.units
  title: Kilometres, metres and centimetres
  notes: |
    Length units: 1 km = 1000 m; 1 m = 100 cm; 1 cm = 10 mm. Change to a smaller unit by multiplying (3 km = 3000 m),
    to a bigger unit by dividing (2500 m = 2 km 500 m). Choose the right unit: a pencil in cm, a room in m, a journey
    in km. Add lengths unit by unit: 2 km 600 m + 1 km 700 m = 4 km 300 m.
  explanations:
    text: Small things are measured in centimetres, rooms and ropes in metres, and journeys in kilometres. A kilometre is 1000 metres, about 10 to 15 minutes of walking. To change km to m, multiply by 1000.
    visual: 'Draw a ladder: km at the top, m in the middle, cm at the bottom. Going down multiply (× 1000 then × 100). Going up divide.'
    step_by_step: 'Step 1: Find the units you have and the units you want. Step 2: Going smaller, multiply; going bigger, divide. Step 3: Write the answer with the new unit.'
    real_world: Road signs show distances in km; a tailor measures cloth in m and cm.
  picture:
    kind: compare
    columns:
    - title: Unit
      points:
      - 1 km
      - 1 m
      - 1 cm
    - title: Equals
      points:
      - 1000 m
      - 100 cm
      - 10 mm
    - title: Used for
      points:
      - journeys
      - rooms, ropes
      - pencils, books
    alt: 1 kilometre is 1000 metres and is used for journeys; 1 metre is 100 centimetres, for rooms; 1 centimetre is 10 millimetres, for small things.
  activity:
    type: sort
    prompt: Which unit would you use to measure it?
    bins:
    - Centimetres
    - Metres
    - Kilometres
    items:
    - label: A pencil
      bin: Centimetres
      clue: Small enough to hold.
      why: About 15 cm.
    - label: Your finger
      bin: Centimetres
      clue: Very short.
      why: A few cm.
    - label: A notebook
      bin: Centimetres
      clue: Fits on your desk.
      why: About 25 cm.
    - label: A classroom
      bin: Metres
      clue: You can walk across it in a few steps.
      why: About 8 m.
    - label: A skipping rope
      bin: Metres
      clue: Longer than you.
      why: About 2 m.
    - label: A swimming pool
      bin: Metres
      clue: Takes a while to swim across.
      why: 25 or 50 m.
    - label: Delhi to Agra
      bin: Kilometres
      clue: You need a bus or train.
      why: About 230 km.
    - label: Your village to the next town
      bin: Kilometres
      clue: Too far to walk quickly.
      why: Some km.
  items:
  - prompt: How many metres are in 3 km?
    answer: '3000'
    check: 3*1000
    difficulty: 1
    hints:
    - 1 km = 1000 m.
    - 3 × 1000.
    solution: 3 km = 3 × 1000 = 3,000 m.
    mistakes:
      '300': c5_units
  - prompt: How many centimetres are in 4 m?
    answer: '400'
    check: 4*100
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - 4 × 100.
    solution: 4 m = 400 cm.
    mistakes:
      '4000': c5_units
  - prompt: Which unit is best for the distance between two cities?
    options:
    - kilometres
    - centimetres
    - millimetres
    - metres
    answer: kilometres
    difficulty: 1
    hints:
    - Cities are far apart.
    - The biggest unit.
    solution: Long distances are measured in kilometres.
  - prompt: 2500 m is 2 km and how many metres?
    answer: '500'
    check: 2500-2000
    difficulty: 1
    hints:
    - 2 km = 2000 m.
    - 2500 − 2000.
    solution: 2,500 m = 2 km 500 m.
  - prompt: Add 2 km 600 m and 1 km 700 m. How many metres is that in all?
    answer: '4300'
    check: 2600+1700
    difficulty: 2
    hints:
    - Change both to metres.
    - 2600 + 1700.
    solution: 2,600 + 1,700 = 4,300 m = 4 km 300 m.
    mistakes:
      '3300': c5_units
  - prompt: A school is 1 km 250 m from home. Priya walks there and back. How many metres does she walk?
    answer: '2500'
    check: 1250*2
    difficulty: 2
    hints:
    - 1 km 250 m = 1250 m.
    - There and back is twice.
    solution: 1,250 × 2 = 2,500 m.
- code: cbse5m.far.compare
  title: Comparing near and far
  after:
  - cbse5m.far.units
  notes: |
    Compare distances in the same unit. Estimate distances: a step is about half a metre; 1 km is about 2000 steps.
    Speed idea: walking about 4–5 km in an hour. Find which place is nearer by changing to the same unit (900 m is
    nearer than 1 km 50 m).
  explanations:
    text: 'To compare two distances, put them in the same unit first. 900 m and 1 km 50 m: change 1 km 50 m to 1050 m, and now you can see 900 m is nearer.'
    visual: Draw a straight road with Home at one end. Mark the shop at 900 m and the park at 1050 m. The shop is closer to Home.
    step_by_step: 'Step 1: Change all distances to the same unit. Step 2: Compare the numbers. Step 3: The smaller number is nearer.'
    real_world: Choosing the nearest bus stop or the shortest route to school.
  picture:
    kind: bars
    bars:
    - label: Shop
      value: 900
    - label: Park
      value: 1050
    - label: Temple
      value: 1500
    alt: 'Distances from home: shop 900 metres, park 1050 metres, temple 1500 metres. The shop is nearest.'
    unit: m
  activity:
    type: number_line
    min: 0
    max: 2000
    step: 50
    start: 0
    prompt: The line is in metres. 1 km = 1000 m. Mark each distance.
    goals:
    - prompt: 1 km 50 m
      target: 1050
      mistakes:
      - when:
          v: 150
        say: 1 km is 1000 m, not 100 m.
      - when:
          v: 1500
        say: That's 1 km 500 m. Here it's only 50 m more.
    - prompt: Half a kilometre
      target: 500
      mistakes:
      - when:
          v: 50
        say: Half of 1000 m is 500 m.
      - when:
          v: 1000
        say: That's a whole kilometre.
    - prompt: 1 km 500 m
      target: 1500
      mistakes:
      - when:
          v: 1050
        say: That's 1 km 50 m. Here it's 500 m more.
      - when:
          v: 600
        say: '1 km is 1000 m: start there and add 500.'
  items:
  - prompt: Which is nearer?
    options:
    - 900 m
    - 1 km 50 m
    - 1 km 500 m
    - 2 km
    answer: 900 m
    difficulty: 1
    hints:
    - Change all to metres.
    - 1 km 50 m = 1050 m.
    solution: 900 m is the smallest, so it is nearest.
    mistakes:
      1 km 50 m: c5_units
  - prompt: About how many steps of half a metre make 1 km?
    answer: '2000'
    check: 1000*2
    difficulty: 2
    hints:
    - 1 km = 1000 m.
    - Each metre is 2 steps.
    solution: 1000 × 2 = 2,000 steps.
  - prompt: A shop is 750 m away and a park 1 km 200 m away. How many metres farther is the park?
    answer: '450'
    check: 1200-750
    difficulty: 2
    hints:
    - 1 km 200 m = 1200 m.
    - 1200 − 750.
    solution: 1,200 − 750 = 450 m.
  - prompt: If you walk 4 km in one hour, how many km do you walk in 3 hours?
    answer: '12'
    check: 4*3
    difficulty: 1
    hints:
    - 4 km each hour.
    - 4 × 3.
    solution: 4 × 3 = 12 km.
  - prompt: Which is the longest?
    options:
    - 3 km
    - 2900 m
    - 2 km 950 m
    - 300 m
    answer: 3 km
    difficulty: 1
    hints:
    - Change all to metres.
    - 3 km = 3000 m.
    solution: 3000 m is longest.
  - prompt: A race is 400 m around the track. How many laps make 2 km?
    answer: '5'
    check: 2000/400
    difficulty: 2
    hints:
    - 2 km = 2000 m.
    - 2000 ÷ 400.
    solution: 2,000 ÷ 400 = 5 laps.
