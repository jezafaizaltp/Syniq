# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 5
title: Far and Near
tips:
  c5_units: 1 km = 1000 m, 1 m = 100 cm. To go to a smaller unit, multiply; to a bigger unit, divide.
  m5_half_steps: "Each step is half a metre, so 2 steps make 1 m. How many steps for 1000 m?"
  m5_km_m: "2 km = 2000 m. How much more is 2500 m?"
  m5_km_unit: "Cities are very far apart. Choose the biggest unit."
  m5_laps: "2 km = 2000 m. How many 400s make 2000?"
  m5_longest: "Change everything to metres first (1 km = 1000 m), then compare the numbers."
  m5_rate: "4 km each hour, for 3 hours: 4 + 4 + 4."
  m5_there_and_back: "1 km 250 m = 1250 m. 'There and back' means the trip happens twice."
  m5_unit_convert: "1 km = 1000 m, 1 L = 1000 mL, 1 kg = 1000 g. Change everything to the smaller unit first."
  c5m5_conv: Going to a smaller unit means more of them, so multiply. Going to a bigger unit means fewer, so divide.
  c5m5_unit: 'Think about how big the thing is: something on your desk, a room, or a trip between towns?'
  c5m5_same: Change both distances to the same unit before you compare or add.
  c5m5_back: There and back is the same path twice.
  c5m5_rate: If you cover the same distance each hour, multiply by the number of hours.
concepts:
- code: cbse5m.far.units
  title: Kilometres, metres and centimetres
  notes: |
    Length units: 1 km = 1000 m; 1 m = 100 cm; 1 cm = 10 mm. Change to a smaller unit by multiplying (3 km = 3000 m),
    to a bigger unit by dividing (2500 m = 2 km 500 m). Choose the right unit: a pencil in cm, a room in m, a journey
    in km. Add lengths unit by unit: 2 km 600 m + 1 km 700 m = 4 km 300 m.
  explanations:
    text: Small things are measured in centimetres, rooms and ropes in metres, and journeys in kilometres. A kilometre is 1000 metres, about 10 to 15 minutes of walking. To change km to m, multiply by 1000.
    visual: 'Draw a ladder: km at the top, m in the middle, cm at the bottom. Going down multiply (× 1000 then × 100). Going up divide.'
    step_by_step: 'Step 1: Find the units you have and the units you want. Step 2: Going smaller, multiply; going bigger, divide. Step 3: Write the answer with the new unit.'
    real_world: Road signs show distances in km; a tailor measures cloth in m and cm.
  picture:
    kind: compare
    columns:
    - title: Unit
      points:
      - 1 km
      - 1 m
      - 1 cm
    - title: Equals
      points:
      - 1000 m
      - 100 cm
      - 10 mm
    - title: Used for
      points:
      - journeys
      - rooms, ropes
      - pencils, books
    alt: 1 kilometre is 1000 metres and is used for journeys; 1 metre is 100 centimetres, for rooms; 1 centimetre is 10 millimetres, for small things.
  activity:
    type: sort
    prompt: Which unit would you use to measure it?
    bins:
    - Centimetres
    - Metres
    - Kilometres
    items:
    - label: A pencil
      bin: Centimetres
      clue: Small enough to hold.
      why: About 15 cm.
    - label: Your finger
      bin: Centimetres
      clue: Very short.
      why: A few cm.
    - label: A notebook
      bin: Centimetres
      clue: Fits on your desk.
      why: About 25 cm.
    - label: A classroom
      bin: Metres
      clue: You can walk across it in a few steps.
      why: About 8 m.
    - label: A skipping rope
      bin: Metres
      clue: Longer than you.
      why: About 2 m.
    - label: A swimming pool
      bin: Metres
      clue: Takes a while to swim across.
      why: 25 or 50 m.
    - label: Delhi to Agra
      bin: Kilometres
      clue: You need a bus or train.
      why: About 230 km.
    - label: Your village to the next town
      bin: Kilometres
      clue: Too far to walk quickly.
      why: Some km.
  lesson:
    - teach: We measure length in kilometres (km), metres (m), centimetres (cm) and millimetres (mm). 1 km = 1,000 m. 1 m = 100 cm. 1 cm = 10 mm.
      picture:
        kind: flow
        steps:
        - 1 km
        - = 1,000 m
        - 1 m = 100 cm
        - 1 cm = 10 mm
        alt: Length units from kilometres down to millimetres.
      check:
        prompt: How many centimetres make 1 metre?
        options:
        - '100'
        - '10'
        - 1,000
        answer: '100'
        why: '''Centi'' means one hundredth: 100 cm in a metre.'
      ways:
      - style: step_by_step
        teach: 'Step 1: Start with 1 km. Step 2: It is 1,000 m. Step 3: Each metre is 100 cm, so 1 km is 1,00,000 cm. Step 4: Each centimetre is 10 mm. Each step down to a smaller unit makes the number bigger.'
      - style: real_world
        teach: 'Look at a school ruler: it is 30 cm long, and each centimetre has 10 tiny millimetre marks. A cricket pitch is about 20 m long. A town a short bus ride away may be 10 km off.'
    - teach: 'To change to a smaller unit, multiply: 5 km = 5 × 1,000 = 5,000 m. To change to a bigger unit, divide: 3,400 m = 3 km 400 m.'
      check:
        prompt: How many metres are in 2 km?
        options:
        - 2,000
        - '200'
        - '20'
        answer: 2,000
        why: Each km is 1,000 m, and 2 × 1,000 = 2,000.
      ways:
      - style: visual
        teach: 'Which way to go when changing units: multiply or divide.'
        picture:
          kind: compare
          columns:
          - title: Bigger unit to smaller
            points:
            - Multiply
            - 6 km = 6 × 1,000 = 6,000 m
          - title: Smaller unit to bigger
            points:
            - Divide
            - 2,700 m = 2 km 700 m
          alt: 'To change from a bigger unit to a smaller one, multiply: 6 km is 6,000 m. To change from a smaller unit to a bigger one, divide: 2,700 m is 2 km 700 m.'
      - style: real_world
        teach: A sign says the next town is 8 km away. In metres that is 8 × 1,000 = 8,000 m. A runner's watch shows 3,250 m; that is 3 km 250 m.
    - teach: 'Choose the unit that fits: a pencil in cm, a classroom in m, a journey between towns in km. To add, add each unit and carry 1,000 m as 1 km: 2 km 600 m + 1 km 700 m = 3 km 1,300 m = 4 km 300 m.'
      check:
        prompt: Which unit is best for the length of your thumb?
        options:
        - Centimetres
        - Kilometres
        - Metres
        answer: Centimetres
        why: A thumb is only a few centimetres long.
      ways:
      - style: visual
        teach: Adding 1 km 800 m and 2 km 500 m, carrying 1,000 m as 1 km.
        picture:
          kind: flow
          steps:
          - 'Add the metres: 800 + 500 = 1,300 m'
          - 1,300 m = 1 km 300 m
          - 'Add the km: 1 + 2 + 1 carried = 4 km'
          - 'Answer: 4 km 300 m'
          alt: 'Add the metres: 800 plus 500 is 1,300 m, which is 1 km 300 m. Add the kilometres: 1 plus 2 plus the 1 carried is 4 km. The answer is 4 km 300 m.'
      - style: step_by_step
        teach: 'Pick the unit. Step 1: Can it sit on your desk? Use cm, like an eraser. Step 2: Is it the size of a room or a tree? Use m. Step 3: Do you need a bus or train to go that far? Use km.'
  items:
  - prompt: How many metres are in 3 km?
    answer: '3000'
    check: 3*1000
    difficulty: 1
    hints:
    - 1 km = 1000 m.
    - 3 × 1000.
    solution: 3 km = 3 × 1000 = 3,000 m.
    mistakes:
      '300': c5_units
  - prompt: How many centimetres are in 4 m?
    answer: '400'
    check: 4*100
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - 4 × 100.
    solution: 4 m = 400 cm.
    mistakes:
      '4000': c5_units
  - prompt: Which unit is best for the distance between two cities?
    options:
    - kilometres
    - centimetres
    - millimetres
    - metres
    answer: kilometres
    difficulty: 1
    hints:
    - Cities are far apart.
    - The biggest unit.
    solution: Long distances are measured in kilometres.
    mistakes: {"metres": "m5_km_unit"}
  - prompt: 2500 m is 2 km and how many metres?
    answer: '500'
    check: 2500-2000
    difficulty: 1
    hints:
    - 2 km = 2000 m.
    - 2500 − 2000.
    solution: 2,500 m = 2 km 500 m.
    mistakes: {"2500": "m5_km_m", "50": "m5_km_m"}
  - prompt: Add 2 km 600 m and 1 km 700 m. How many metres is that in all?
    answer: '4300'
    check: 2600+1700
    difficulty: 2
    hints:
    - Change both to metres.
    - 2600 + 1700.
    solution: 2,600 + 1,700 = 4,300 m = 4 km 300 m.
    mistakes:
      '3300': c5_units
  - prompt: A school is 1 km 250 m from home. Priya walks there and back. How many metres does she walk?
    answer: '2500'
    check: 1250*2
    difficulty: 2
    hints:
    - 1 km 250 m = 1250 m.
    - There and back is twice.
    solution: 1,250 × 2 = 2,500 m.
    mistakes: {"1250": "m5_there_and_back", "1500": "m5_there_and_back"}
  - prompt: How many metres are in 7 km?
    answer: '7000'
    check: 7*1000
    difficulty: 1
    hints:
    - 1 km = 1,000 m.
    - Multiply 7 by 1,000.
    solution: 'Step 1: 7 × 1,000. Step 2: = 7,000 m.'
    mistakes:
      '700': c5m5_conv
      '70': c5m5_conv
  - prompt: How many centimetres are in 6 m 25 cm?
    answer: '625'
    check: 6*100+25
    difficulty: 2
    hints:
    - 6 m = 600 cm.
    - Add the extra 25 cm.
    solution: 'Step 1: 6 m = 600 cm. Step 2: 600 + 25 = 625 cm.'
    mistakes:
      '6025': c5m5_conv
      '31': c5m5_conv
  - prompt: How many millimetres are in 9 cm?
    answer: '90'
    check: 9*10
    difficulty: 1
    hints:
    - 1 cm = 10 mm.
    - Multiply 9 by 10.
    solution: 'Step 1: 9 × 10. Step 2: = 90 mm.'
    mistakes:
      '900': c5m5_conv
      '9': c5m5_conv
  - prompt: 4,050 m is 4 km and how many metres?
    answer: '50'
    check: 4050-4000
    difficulty: 2
    hints:
    - 4 km = 4,000 m.
    - What is left after 4,000?
    solution: 'Step 1: 4,050 − 4,000. Step 2: = 50 m.'
    mistakes:
      '500': c5m5_conv
      '5': c5m5_conv
  - prompt: Which unit is best for the height of a door?
    options:
    - Metres
    - Kilometres
    - Millimetres
    answer: Metres
    difficulty: 1
    hints:
    - A door is taller than you but not as long as a road.
    - About 2 of this unit.
    solution: 'Step 1: a door is about 2 m tall. Step 2: metres fit best.'
    mistakes:
      Kilometres: c5m5_unit
      Millimetres: c5m5_unit
  - prompt: Add 3 km 450 m and 2 km 800 m. How many metres in all?
    answer: '6250'
    check: 3450+2800
    difficulty: 2
    hints:
    - Change both to metres first.
    - 3,450 + 2,800.
    solution: 'Step 1: 3,450 m + 2,800 m. Step 2: = 6,250 m.'
    mistakes:
      '5250': c5m5_same
      '51250': c5m5_conv
  - prompt: A ribbon is 2 m long. 75 cm is cut off. How many cm are left?
    answer: '125'
    check: 200-75
    difficulty: 2
    hints:
    - 2 m = 200 cm.
    - Take 75 from 200.
    solution: 'Step 1: 2 m = 200 cm. Step 2: 200 − 75 = 125 cm.'
    mistakes:
      '73': c5m5_same
      '1925': c5m5_same
  - prompt: Which is the same as 1 km 5 m?
    options:
    - 1,005 m
    - 1,500 m
    - 1,050 m
    answer: 1,005 m
    difficulty: 3
    hints:
    - 1 km = 1,000 m.
    - Add only 5 more metres.
    solution: 'Step 1: 1,000 + 5. Step 2: = 1,005 m.'
    mistakes:
      1,500 m: c5m5_conv
      1,050 m: c5m5_conv
  - prompt: A bus stop is 650 m from home. Ravi goes there and back each day. How many metres does he walk in a day?
    answer: '1300'
    check: 650*2
    difficulty: 2
    hints:
    - There and back is the same path twice.
    - 650 + 650.
    solution: 'Step 1: 650 × 2. Step 2: = 1,300 m.'
    mistakes:
      '650': c5m5_back
      '1200': c5m5_back
  - prompt: 'Case: A ribbon is 3 m 40 cm long. A tailor cuts off 1 m 75 cm. How long is the ribbon now?'
    options:
    - 1 m 65 cm
    - 2 m 35 cm
    - 1 m 35 cm
    answer: 1 m 65 cm
    hints:
    - Change both lengths to cm first.
    - 1 m = 100 cm.
    solution: 3 m 40 cm = 340 cm and 1 m 75 cm = 175 cm. 340 − 175 = 165 cm = 1 m 65 cm.
    mistakes:
      2 m 35 cm: c5m5_conv
      1 m 35 cm: c5m5_conv
    exam: case
    difficulty: 2
  - prompt: 'Situation: You want to measure the length of your thumb. Which unit is the best choice?'
    options:
    - Centimetres
    - Kilometres
    - Metres
    answer: Centimetres
    hints:
    - Is a thumb as long as a room or a road?
    - Which unit is used for small things on a desk?
    solution: A thumb is small, a few centimetres long, so centimetres are the best unit.
    mistakes:
      Kilometres: c5m5_unit
      Metres: c5m5_unit
    exam: competency
    difficulty: 2
- code: cbse5m.far.compare
  title: Comparing near and far
  after:
  - cbse5m.far.units
  notes: |
    Compare distances in the same unit. Estimate distances: a step is about half a metre; 1 km is about 2000 steps.
    Speed idea: walking about 4–5 km in an hour. Find which place is nearer by changing to the same unit (900 m is
    nearer than 1 km 50 m).
  explanations:
    text: 'To compare two distances, put them in the same unit first. 900 m and 1 km 50 m: change 1 km 50 m to 1050 m, and now you can see 900 m is nearer.'
    visual: Draw a straight road with Home at one end. Mark the shop at 900 m and the park at 1050 m. The shop is closer to Home.
    step_by_step: 'Step 1: Change all distances to the same unit. Step 2: Compare the numbers. Step 3: The smaller number is nearer.'
    real_world: Choosing the nearest bus stop or the shortest route to school.
  picture:
    kind: bars
    bars:
    - label: Shop
      value: 900
    - label: Park
      value: 1050
    - label: Temple
      value: 1500
    alt: 'Distances from home: shop 900 metres, park 1050 metres, temple 1500 metres. The shop is nearest.'
    unit: m
  activity:
    type: number_line
    min: 0
    max: 2000
    step: 50
    start: 0
    prompt: The line is in metres. 1 km = 1000 m. Mark each distance.
    goals:
    - prompt: 1 km 50 m
      target: 1050
      mistakes:
      - when:
          v: 150
        say: 1 km is 1000 m, not 100 m.
      - when:
          v: 1500
        say: That's 1 km 500 m. Here it's only 50 m more.
    - prompt: Half a kilometre
      target: 500
      mistakes:
      - when:
          v: 50
        say: Half of 1000 m is 500 m.
      - when:
          v: 1000
        say: That's a whole kilometre.
    - prompt: 1 km 500 m
      target: 1500
      mistakes:
      - when:
          v: 1050
        say: That's 1 km 50 m. Here it's 500 m more.
      - when:
          v: 600
        say: '1 km is 1000 m: start there and add 500.'
  lesson:
    - teach: 'To compare distances, write them in the same unit first. 900 m and 1 km 50 m: 1 km 50 m = 1,050 m, so 900 m is nearer.'
      check:
        prompt: 'Which is farther: 1,200 m or 1 km?'
        options:
        - 1,200 m
        - 1 km
        - They are equal
        answer: 1,200 m
        why: 1 km = 1,000 m, which is less than 1,200 m.
      ways:
      - style: visual
        teach: Comparing 1 km 80 m and 1,200 m after writing both in metres.
        picture:
          kind: bars
          unit: ' m'
          bars:
          - label: 1 km 80 m
            value: 1080
          - label: 1,200 m
            value: 1200
          alt: 'Two bars: 1 km 80 m is 1,080 m and 1,200 m is longer, so 1 km 80 m is the nearer place.'
      - style: step_by_step
        teach: 'Compare 2 km 30 m and 2,300 m. Step 1: Write the first in metres: 2,000 + 30 = 2,030 m. Step 2: Now compare 2,030 m and 2,300 m. Step 3: 2,030 is less, so 2 km 30 m is nearer.'
    - teach: We can estimate distances with our body. One step is about half a metre, so 2 steps make about 1 m and 1 km is about 2,000 steps.
      picture:
        kind: flow
        steps:
        - 1 step ≈ 1/2 m
        - 2 steps ≈ 1 m
        - 2,000 steps ≈ 1 km
        alt: Steps are a way to estimate distance.
      check:
        prompt: About how many steps make 10 m?
        options:
        - '20'
        - '5'
        - '100'
        answer: '20'
        why: 2 steps per metre, and 10 × 2 = 20.
      ways:
      - style: step_by_step
        teach: 'Estimate a corridor. Step 1: Walk its length and count steps: say 60 steps. Step 2: Each step is about half a metre. Step 3: 60 half metres is about 30 m.'
      - style: real_world
        teach: 'Long ago people measured with their bodies: a hand-span, a cubit from elbow to fingertip, a pace. They are not exact, because bodies differ, but they give a quick guess when there is no tape.'
    - teach: 'People walk about 4 to 5 km in an hour. If you walk the same distance each hour, multiply: 4 km each hour for 3 hours = 12 km.'
      check:
        prompt: Walking 5 km each hour, how far do you go in 2 hours?
        options:
        - 10 km
        - 7 km
        - 5 km
        answer: 10 km
        why: 5 + 5 = 10 km.
      ways:
      - style: visual
        teach: 'Walking 5 km every hour: the distance after each hour.'
        picture:
          kind: number_line
          from: 0
          to: 20
          step: 5
          jumps:
          - from: 0
            to: 5
            label: 1 h
          - from: 5
            to: 10
            label: 2 h
          - from: 10
            to: 15
            label: 3 h
          alt: 'On a line in kilometres, jumps of 5: after 1 hour 5 km, after 2 hours 10 km, after 3 hours 15 km.'
      - style: real_world
        teach: Many pilgrims walk long routes on foot. At about 5 km an hour, walking for 6 hours covers about 30 km in a day. Multiply the distance in one hour by the number of hours.
  items:
  - prompt: Which is nearer?
    options:
    - 900 m
    - 1 km 50 m
    - 1 km 500 m
    - 2 km
    answer: 900 m
    difficulty: 1
    hints:
    - Change all to metres.
    - 1 km 50 m = 1050 m.
    solution: 900 m is the smallest, so it is nearest.
    mistakes:
      1 km 50 m: c5_units
  - prompt: About how many steps of half a metre make 1 km?
    answer: '2000'
    check: 1000*2
    difficulty: 2
    hints:
    - 1 km = 1000 m.
    - Each metre is 2 steps.
    solution: 1000 × 2 = 2,000 steps.
    mistakes: {"500": "m5_half_steps", "1000": "m5_half_steps"}
  - prompt: A shop is 750 m away and a park 1 km 200 m away. How many metres farther is the park?
    answer: '450'
    check: 1200-750
    difficulty: 2
    hints:
    - 1 km 200 m = 1200 m.
    - 1200 − 750.
    solution: 1,200 − 750 = 450 m.
    mistakes: {"1950": "m5_unit_convert", "1": "m5_unit_convert"}
  - prompt: If you walk 4 km in one hour, how many km do you walk in 3 hours?
    answer: '12'
    check: 4*3
    difficulty: 1
    hints:
    - 4 km each hour.
    - 4 × 3.
    solution: 4 × 3 = 12 km.
    mistakes: {"7": "m5_rate", "43": "m5_rate"}
  - prompt: Which is the longest?
    options:
    - 3 km
    - 2900 m
    - 2 km 950 m
    - 300 m
    answer: 3 km
    difficulty: 1
    hints:
    - Change all to metres.
    - 3 km = 3000 m.
    solution: 3000 m is longest.
    mistakes: {"2 km 950 m": "m5_longest"}
  - prompt: A race is 400 m around the track. How many laps make 2 km?
    answer: '5'
    check: 2000/400
    difficulty: 2
    hints:
    - 2 km = 2000 m.
    - 2000 ÷ 400.
    solution: 2,000 ÷ 400 = 5 laps.
    mistakes: {"4": "m5_laps", "8": "m5_laps"}
  - prompt: Which is the nearest?
    options:
    - 850 m
    - 1 km
    - 1 km 20 m
    answer: 850 m
    difficulty: 1
    hints:
    - Change all to metres.
    - 1 km = 1,000 m.
    solution: 'Step 1: 850 m, 1,000 m, 1,020 m. Step 2: 850 m is smallest, so nearest.'
    mistakes:
      1 km: c5m5_same
      1 km 20 m: c5m5_same
  - prompt: A temple is 1 km 300 m away and a river 900 m away. How many metres farther is the temple?
    answer: '400'
    check: 1300-900
    difficulty: 2
    hints:
    - Change 1 km 300 m to metres.
    - Then subtract 900.
    solution: 'Step 1: 1 km 300 m = 1,300 m. Step 2: 1,300 − 900 = 400 m.'
    mistakes:
      '600': c5m5_same
      '2200': c5m5_same
  - prompt: About how many steps of half a metre make 500 m?
    answer: '1000'
    check: 500*2
    difficulty: 2
    hints:
    - 2 steps make 1 m.
    - Multiply the metres by 2.
    solution: 'Step 1: 2 steps per metre. Step 2: 500 × 2 = 1,000 steps.'
    mistakes:
      '250': c5m5_conv
      '500': c5m5_conv
  - prompt: A cyclist rides 12 km in each hour. How far does she ride in 4 hours, in km?
    answer: '48'
    check: 12*4
    difficulty: 1
    hints:
    - Same distance each hour.
    - 12 × 4.
    solution: 'Step 1: 12 × 4. Step 2: = 48 km.'
    mistakes:
      '16': c5m5_rate
      '3': c5m5_rate
  - prompt: A running track is 200 m around. How many rounds make 1 km?
    answer: '5'
    check: 1000//200
    difficulty: 2
    hints:
    - 1 km = 1,000 m.
    - How many 200s in 1,000?
    solution: 'Step 1: 1,000 ÷ 200. Step 2: = 5 rounds.'
    mistakes:
      '50': c5m5_conv
      '200': c5m5_conv
  - prompt: 'Put in order from nearest: 2 km, 1,500 m, 2 km 100 m. Which is in the middle?'
    options:
    - 2 km
    - 1,500 m
    - 2 km 100 m
    answer: 2 km
    difficulty: 3
    hints:
    - Change all to metres.
    - 2,000; 1,500; 2,100.
    solution: 'Step 1: 1,500 < 2,000 < 2,100. Step 2: 2 km is in the middle.'
    mistakes:
      1,500 m: c5m5_same
      2 km 100 m: c5m5_same
  - prompt: Asha walks 4 km in 1 hour. How long will she take to walk 2 km?
    options:
    - Half an hour
    - 2 hours
    - 1 hour
    answer: Half an hour
    difficulty: 3
    hints:
    - 2 km is half of 4 km.
    - Half the distance takes half the time.
    solution: 'Step 1: 2 km is half of 4 km. Step 2: so half of 1 hour: 30 minutes.'
    mistakes:
      2 hours: c5m5_rate
      1 hour: c5m5_rate
  - prompt: School is 1 km 200 m away. Ali has walked 700 m. How many more metres must he walk?
    answer: '500'
    check: 1200-700
    difficulty: 2
    hints:
    - Change 1 km 200 m to metres.
    - Subtract what he has walked.
    solution: 'Step 1: 1,200 m. Step 2: 1,200 − 700 = 500 m.'
    mistakes:
      '1900': c5m5_same
      '300': c5m5_same
  - prompt: A village is 15 km away. A car goes 30 km in one hour. How long does it take to reach the village?
    options:
    - Half an hour
    - 2 hours
    - 15 hours
    answer: Half an hour
    difficulty: 3
    hints:
    - 15 km is half of 30 km.
    - Half the distance takes half the time.
    solution: 'Step 1: 15 is half of 30. Step 2: so half an hour.'
    mistakes:
      2 hours: c5m5_rate
      15 hours: c5m5_rate
  - prompt: 'Case: A post office is 1 km 40 m from home. A library is 1,400 m from home. A child says the post office is farther because 1 km sounds far. Which place is farther?'
    options:
    - The library
