# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 1
title: We the Travellers-I
tips:
  c5_place_value: 'Read the number from the left: ten thousands, thousands, hundreds, tens, ones. Each place is 10 times the place to its right.'
  c5_carry: When a column adds up to 10 or more, write the ones digit and carry the ten to the next column on the left.
  m5_compare_digits: "Both start 54,2... Compare the next digits: tens, then ones."
  m5_estimate: "Round each number to the nearest thousand first, then add."
  m5_lakh: "1 lakh = 1,00,000 and 1 thousand = 1,000. How many 1,000s fit in 1,00,000?"
  m5_subtract_borrow: "Subtract column by column from the ones. When the top digit is smaller, borrow 1 from the next column."
  c5m1_place: Write the number in a place-value chart. Each step to the left is worth 10 times more.
  c5m1_compare: Count the digits first. If they match, compare place by place from the left.
  c5m1_round: Look only at the digit just to the right of the place you round to. 5 or more goes up.
  c5m1_carry: Line up the ones under the ones. When a column adds to 10 or more, carry 1 to the next column.
  c5m1_borrow: When the top digit is smaller, borrow 1 from the next place on the left; it becomes 10 here.
  c5m1_which: 'Decide first: is the story putting amounts together, or finding how much is left or how much more?'
concepts:
- code: cbse5m.trav1.place
  title: Big numbers and place value
  notes: |
    Numbers up to 1,00,000 (one lakh). Places: ones, tens, hundreds, thousands, ten thousands, lakh. In India we put
    commas after the thousands and then every two digits: 1,00,000. 45,307 = 4 ten thousands + 5 thousands + 3 hundreds
    + 0 tens + 7 ones. Comparing: the number with more digits is bigger; with the same digits, compare from the left.
    Rounding: to the nearest hundred, look at the tens digit (5 or more rounds up).
  explanations:
    text: Every digit has a place, and the place gives it its value. In 45,307 the 4 is worth 40,000 because it sits in the ten thousands place. To compare two numbers with the same number of digits, start from the left and find the first digit that is different.
    visual: 'Draw a place value chart with five boxes: TTh, Th, H, T, O. Put one digit of 45,307 in each box: 4, 5, 3, 0, 7. The empty tens box is shown with a 0.'
    step_by_step: 'Step 1: Write the number in a place value chart. Step 2: Read the digit you need. Step 3: Multiply it by its place (10, 100, 1000 ...). Step 4: For comparing, check the digits from the left.'
    real_world: Distances on long train journeys, the number of people in a town, or the seats in a big stadium are big numbers like these.
  picture:
    kind: compare
    columns:
    - title: Number
      points:
      - 45,307
      - Place of 4
      - Place of 3
    - title: Value
      points:
      - forty-five thousand three hundred seven
      - 'ten thousands: 40,000'
      - 'hundreds: 300'
    alt: In 45,307 the 4 is in the ten thousands place, worth 40,000, and the 3 is in the hundreds place, worth 300.
  activity:
    type: formula
    prompt: Build a number from thousands, hundreds, tens and ones.
    inputs:
    - name: th
      label: Thousands
      min: 0
      max: 9
      step: 1
      start: 0
    - name: h
      label: Hundreds
      min: 0
      max: 9
      step: 1
      start: 0
    - name: te
      label: Tens
      min: 0
      max: 9
      step: 1
      start: 0
    - name: o
      label: Ones
      min: 0
      max: 9
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: 1000*th+100*h+10*te+o
    goals:
    - prompt: Make 4,307.
      want:
        val: 4307
      mistakes:
      - when:
          th: 4
          h: 3
          te: 7
          o: 0
        say: That's 4,370. There are 0 tens in 4,307, so the 7 is ones.
    - prompt: Make 6,050.
      want:
        val: 6050
      mistakes:
      - when:
          th: 6
          h: 5
          te: 0
          o: 0
        say: That's 6,500. In 6,050 the 5 sits in the tens place.
    - prompt: Make the biggest number from the digits 2, 9, 0 and 5.
      want:
        val: 9520
      mistakes:
      - when:
          val: 9502
        say: Close! Put the bigger of 2 and 0 in the tens.
      - when:
          val: 9250
        say: 'Put 5 before 2: the bigger digit goes in the bigger place.'
  lesson:
    - teach: 'Each place in a number is worth 10 times the place on its right: ones, tens, hundreds, thousands, ten thousands, lakh. In 45,307 the 4 is in the ten thousands place, so it is worth 40,000.'
      picture:
        kind: compare
        columns:
        - title: Ten thousands, thousands
          points:
          - 4 → 40,000
          - 5 → 5,000
        - title: Hundreds, tens, ones
          points:
          - 3 → 300
          - 0 → 0
          - 7 → 7
        alt: 45,307 split into 40,000 + 5,000 + 300 + 0 + 7.
      check:
        prompt: What is the 5 worth in 45,307?
        options:
        - 5,000
        - '500'
        - 50,000
        answer: 5,000
        why: The 5 is in the thousands place.
      ways:
      - style: step_by_step
        teach: 'Take 52,816. Step 1: Read the digits from the right: 6 ones, 1 ten, 8 hundreds, 2 thousands, 5 ten thousands. Step 2: Turn each into its value: 6, 10, 800, 2,000, 50,000. Step 3: Add them back: 50,000 + 2,000 + 800 + 10 + 6 = 52,816.'
      - style: real_world
        teach: 'A cricket stadium can hold tens of thousands of people. If 52,816 fans come, the 5 at the front does not mean 5 people: it means 5 groups of ten thousand. A digit''s place tells you how big a group it counts.'
    - teach: 'In India we put a comma after the thousands and then after every two digits: 1,00,000 is one lakh. One lakh is 100 thousands.'
      check:
        prompt: How is one lakh written with commas?
        options:
        - 1,00,000
        - 100,000,0
        - 10,0000
        answer: 1,00,000
        why: Comma after three digits from the right, then after two more.
      ways:
      - style: visual
        teach: Where the Indian commas go, from one thousand up to one lakh.
        picture:
          kind: flow
          steps:
          - 1,000 = one thousand
          - 10,000 = ten thousand
          - 1,00,000 = one lakh
          - Comma after the thousands, then after every two digits
          alt: One thousand is written 1,000, ten thousand 10,000 and one lakh 1,00,000. In India the first comma comes after the thousands and then after every two digits.
      - style: real_world
        teach: 'Read a newspaper headline about money and you may see ''₹2,50,000''. Read it with the commas: 2 lakh, 50 thousand. Indian commas group the number into lakhs and thousands so it is easy to say aloud.'
    - teach: 'To compare, count the digits: more digits means bigger. If the digit count is the same, compare from the left. To round to the nearest hundred, look at the tens digit: 5 or more rounds up, less than 5 rounds down.'
      check:
        prompt: Round 3,640 to the nearest hundred.
        options:
        - 3,600
        - 3,700
        - 4,000
        answer: 3,600
        why: The tens digit is 4, which is less than 5, so round down.
      ways:
      - style: visual
        teach: Rounding 3,640 to the nearest hundred on a number line.
        picture:
          kind: number_line
          from: 3600
          to: 3700
          step: 10
          points:
          - at: 3600
            label: 3,600
          - at: 3640
            label: 3,640
          - at: 3650
            label: halfway
          - at: 3700
            label: 3,700
          alt: A number line from 3,600 to 3,700 in tens. 3,640 is before the halfway mark at 3,650, so it is closer to 3,600.
      - style: step_by_step
        teach: 'Compare 9,870 and 10,020. Step 1: Count digits: 9,870 has 4 digits, 10,020 has 5. Step 2: More digits means bigger, so 10,020 is bigger. You do not even need to look at the other digits.'
  items:
  - prompt: What is the value of 6 in 36,452?
    answer: '6000'
    check: 6*1000
    difficulty: 1
    hints:
    - Which place is the 6 in?
    - It is in the thousands place.
    solution: 'The 6 is in the thousands place: 6 × 1000 = 6000.'
    mistakes:
      '6': c5_place_value
      '600': c5_place_value
  - prompt: 'Write the number: 3 ten thousands + 2 thousands + 0 hundreds + 5 tens + 1 one.'
    answer: '32051'
    check: 30000+2000+50+1
    difficulty: 1
    hints:
    - Put each digit in its place.
    - 3, 2, 0, 5, 1.
    solution: 30000 + 2000 + 0 + 50 + 1 = 32,051.
    mistakes:
      '3251': c5_place_value
  - prompt: Which number is bigger?
    options:
    - 54,210
    - 45,999
    - 54,201
    - 9,999
    answer: 54,210
    difficulty: 1
    hints:
    - Compare from the left.
    - 54,210 and 54,201 differ in the tens place.
    solution: '54,210 is biggest: same first three digits as 54,201, but 1 ten beats 0 tens.'
    mistakes: {"54,201": "m5_compare_digits"}
  - prompt: How many thousands make one lakh?
    answer: '100'
    check: 100000/1000
    difficulty: 1
    hints:
    - 1,00,000 ÷ 1000.
    - Count the zeros.
    solution: 1,00,000 ÷ 1000 = 100 thousands.
    mistakes: {"10": "m5_lakh", "1000": "m5_lakh"}
  - prompt: Round 7,468 to the nearest hundred.
    answer: '7500'
    check: '7500'
    difficulty: 2
    hints:
    - Look at the tens digit.
    - 6 is 5 or more, so round up.
    solution: The tens digit is 6, so 7,468 rounds up to 7,500.
    mistakes:
      '7400': c5_place_value
  - prompt: What is the smallest 5-digit number you can make with the digits 7, 0, 3, 9, 1 (each used once)?
    answer: '10379'
    check: '10379'
    difficulty: 2
    hints:
    - A number cannot start with 0.
    - Start with the smallest non-zero digit, then 0.
    solution: 'Start with 1, then 0, then 3, 7, 9: 10,379.'
    mistakes:
      '1379': c5_place_value
  - prompt: What is the value of 8 in 28,315?
    answer: '8000'
    check: 8*1000
    difficulty: 1
    hints:
    - Find which place the 8 is in.
    - 'Count places from the right: ones, tens, hundreds, thousands.'
    solution: 'Step 1: 8 is in the thousands place. Step 2: 8 × 1,000 = 8,000.'
    mistakes:
      '800': c5m1_place
      '80000': c5m1_place
      '8': c5m1_place
  - prompt: Write 6 ten thousands + 4 thousands + 9 tens + 2 ones as a number (no commas).
    answer: '64092'
    check: 60000+4000+90+2
    difficulty: 2
    hints:
    - There are no hundreds, so that place gets a 0.
    - Fill each place in order from ten thousands to ones.
    solution: 'Step 1: 60,000 + 4,000 + 0 + 90 + 2. Step 2: the number is 64,092.'
    mistakes:
      '6492': c5m1_place
      '64920': c5m1_place
  - prompt: Which is the biggest number?
    options:
    - 70,215
    - 7,999
    - 69,980
    answer: 70,215
    difficulty: 1
    hints:
    - Count the digits first.
    - Two have five digits; compare their first digits.
    solution: 'Step 1: 7,999 has only 4 digits. Step 2: of the 5-digit ones, 7 ten thousands beats 6.'
    mistakes:
      7,999: c5m1_compare
      69,980: c5m1_compare
  - prompt: Round 12,350 to the nearest thousand.
    answer: '12000'
    check: '12000'
    difficulty: 2
    hints:
    - Look at the hundreds digit.
    - Is the hundreds digit 5 or more?
    solution: 'Step 1: the hundreds digit is 3. Step 2: 3 is less than 5, so round down to 12,000.'
    mistakes:
      '13000': c5m1_round
      '12400': c5m1_round
  - prompt: What is the largest 5-digit number you can make with 4, 8, 0, 2, 6 (each used once)?
    answer: '86420'
    check: '86420'
    difficulty: 2
    hints:
    - Put the biggest digit in the biggest place.
    - Then the next biggest, and so on.
    solution: 'Step 1: order the digits from big to small: 8, 6, 4, 2, 0. Step 2: the number is 86,420.'
    mistakes:
      02468: c5m1_place
      '86402': c5m1_compare
  - prompt: How many hundreds make one lakh?
    answer: '1000'
    check: 100000//100
    difficulty: 3
    hints:
    - One lakh is 1,00,000.
    - Divide one lakh by 100.
    solution: 'Step 1: 1,00,000 ÷ 100. Step 2: that is 1,000 hundreds.'
    mistakes:
      '100': c5m1_place
      '10000': c5m1_place
  - prompt: What number is 1,000 more than 49,500?
    answer: '50500'
    check: 49500+1000
    difficulty: 2
    hints:
    - Add 1 to the thousands digit.
    - 9 thousands + 1 thousand makes 10 thousands, which carries.
    solution: 'Step 1: 49,500 + 1,000. Step 2: = 50,500.'
    mistakes:
      '49600': c5m1_place
      '59500': c5m1_place
  - prompt: Which number is 40,000 + 300 + 5?
    options:
    - 40,305
    - 43,005
    - 4,305
    answer: 40,305
    difficulty: 2
    hints:
    - There are no thousands and no tens.
    - Write 0 in those places.
    solution: 'Step 1: ten thousands 4, thousands 0, hundreds 3, tens 0, ones 5. Step 2: 40,305.'
    mistakes:
      43,005: c5m1_place
      4,305: c5m1_place
  - prompt: 'Arrange from smallest: 35,210; 35,120; 35,201. Which comes first?'
    options:
    - 35,120
    - 35,201
    - 35,210
    answer: 35,120
    difficulty: 3
    hints:
    - The first two digits are the same in all.
    - Compare the hundreds digits next.
    solution: 'Step 1: all start 35. Step 2: hundreds digits are 2, 1, 2, so 35,120 is smallest.'
    mistakes:
      35,201: c5m1_compare
      35,210: c5m1_compare
  - prompt: 'Case: A town has 48,256 people. The nearby city has 1,02,430 people. A child says the town is bigger because 48 is more than 10. Which is true?'
    options:
    - 'The city is bigger: it has more digits'
    - 'The town is bigger: 48 is more than 10'
    - They are the same size
    answer: 'The city is bigger: it has more digits'
    hints:
    - How many digits does each number have?
    - What does having more digits tell you?
    solution: 48,256 has 5 digits and 1,02,430 has 6 digits. A 6-digit number is bigger than any 5-digit number, so the city is bigger.
    mistakes:
      'The town is bigger: 48 is more than 10': c5m1_compare
      They are the same size: c5m1_compare
    exam: case
    difficulty: 2
  - prompt: 'Situation: A school collected 2,743 old books for a library. The poster should show the number rounded to the nearest hundred. Which number goes on the poster?'
    options:
    - 2,700
    - 2,800
    - 2,000
    answer: 2,700
    hints:
    - Which digit do you look at to round to the nearest hundred?
    - Is that digit 5 or more?
    solution: The tens digit is 4, which is less than 5, so 2,743 rounds down to 2,700.
    mistakes:
      2,800: c5m1_round
      2,000: c5m1_round
    exam: competency
    difficulty: 2
- code: cbse5m.trav1.add
  title: Adding and subtracting travel distances
  after:
  - cbse5m.trav1.place
  notes: |
    Add big numbers column by column from the ones, carrying when a column passes 9. Subtract column by column,
    borrowing (regrouping) when the top digit is smaller. Estimate first by rounding, to check the answer is sensible.
    Example: a family travels 1,245 km by train and 368 km by bus: 1,245 + 368 = 1,613 km.
  explanations:
    text: 'Line the numbers up by place: ones under ones, tens under tens. Add from the right. If a column makes 10 or more, write the ones digit and carry 1 to the next column. Subtracting works the same way, but you borrow when the top digit is too small.'
    visual: 'Write 1,245 above 368 with the ones lined up. Ones: 5 + 8 = 13, write 3 carry 1. Tens: 4 + 6 + 1 = 11, write 1 carry 1. Hundreds: 2 + 3 + 1 = 6. Thousands: 1. Answer 1,613.'
    step_by_step: 'Step 1: Line up the places. Step 2: Start with the ones. Step 3: Carry or borrow when needed. Step 4: Check by rounding: 1,200 + 400 is about 1,600.'
    real_world: 'Planning a trip: adding the distance of each part of the journey tells you the total, and subtracting tells you how far is left.'
  picture:
    kind: flow
    steps:
    - 'Ones: 5 + 8 = 13, write 3, carry 1'
    - 'Tens: 4 + 6 + 1 = 11, write 1, carry 1'
    - 'Hundreds: 2 + 3 + 1 = 6'
    - 'Thousands: 1 → 1,613'
    alt: Adding 1,245 and 368 column by column with carrying gives 1,613.
  activity:
    type: formula
    prompt: 'A trip: 233 km on the first day and x km on the second.'
    inputs:
    - name: x
      label: Second day
      min: 0
      max: 500
      step: 1
      start: 0
      unit: km
    outputs:
    - name: total
      label: Whole trip
      expr: 233+x
      unit: km
    goals:
    - prompt: The whole trip is 470 km. How far on day 2?
      want:
        total: 470
      mistakes:
      - when:
          x: 243
        say: 'In the ones, 0 − 3 can''t be done. Take a ten: 10 − 3 = 7. Then 6 − 3 in the tens.'
      - when:
          x:
          - 300
          - 500
        say: 'Too much: 233 + 300 is already more than 470. Take 233 away from 470.'
    - prompt: The whole trip is 512 km.
      want:
        total: 512
      mistakes:
      - when:
          x: 321
        say: Each column was taken small-from-big. 2 − 3 needs a ten taken from the tens first.
      - when:
          x: 289
        say: 'Check the tens: after taking a ten, 0 − 3 needs a hundred too.'
    - prompt: The whole trip is 400 km.
      want:
        total: 400
      mistakes:
      - when:
          x: 233
        say: That's the first day again. 400 − 233 = ?
      - when:
          x: 277
        say: 'Check with adding: 233 + 277 = 510. Too much.'
  lesson:
    - teach: To add big numbers, write them one under the other with ones under ones. Add from the ones column. If a column makes 10 or more, write the ones digit and carry 1 to the next column.
      picture:
        kind: flow
        steps:
        - Line up the places
        - Add the ones
        - Carry if 10 or more
        - Add the next column
        - Read the total
        alt: Steps for column addition with carrying.
      check:
        prompt: In 368 + 245, what do the ones add to?
        options:
        - '13'
        - '3'
        - '11'
        answer: '13'
        why: 8 + 5 = 13; write 3, carry 1.
      ways:
      - style: visual
        teach: Adding 2,647 and 1,385 column by column, from the ones.
        picture:
          kind: flow
          steps:
          - 'Ones: 7 + 5 = 12, write 2, carry 1'
          - 'Tens: 4 + 8 + 1 = 13, write 3, carry 1'
          - 'Hundreds: 6 + 3 + 1 = 10, write 0, carry 1'
          - 'Thousands: 2 + 1 + 1 = 4'
          - 'Answer: 4,032'
          alt: 'Adding 2,647 and 1,385: ones 7 plus 5 is 12, write 2 carry 1; tens 4 plus 8 plus 1 is 13, write 3 carry 1; hundreds 6 plus 3 plus 1 is 10, write 0 carry 1; thousands 2 plus 1 plus 1 is 4. The answer is 4,032.'
      - style: real_world
        teach: 'A shopkeeper counting coins puts every ten 1-rupee coins into a stack worth ₹10. Carrying is the same idea: ten ones become one ten and move to the tens column.'
    - teach: To subtract, start from the ones too. If the top digit is smaller than the bottom digit, borrow 1 from the next place on the left; it becomes 10 more in this column.
      check:
        prompt: In 52 − 17, the ones are 2 − 7. What do you do?
        options:
        - Borrow 1 ten to make 12 − 7
        - Write 7 − 2
        - Write 0
        answer: Borrow 1 ten to make 12 − 7
        why: You cannot take 7 from 2, so you regroup a ten.
      ways:
      - style: visual
        teach: Subtracting 5,000 − 1,236 by borrowing across zeros.
        picture:
          kind: flow
          steps:
          - 5,000 has no ones, tens or hundreds to give
          - 'Borrow 1 thousand: it becomes 10 hundreds'
          - 'Take 1 hundred: it becomes 10 tens'
          - 'Take 1 ten: it becomes 10 ones'
          - 'Now 4 thousands, 9 hundreds, 9 tens, 10 ones: subtract: 3,764'
          alt: To subtract 1,236 from 5,000, borrow 1 thousand as 10 hundreds, then 1 hundred as 10 tens, then 1 ten as 10 ones, giving 4 thousands, 9 hundreds, 9 tens and 10 ones. Subtracting gives 3,764.
      - style: real_world
        teach: If you have a ₹100 note and need to pay ₹35, the shopkeeper breaks the note into smaller money first. Borrowing in subtraction is breaking a bigger place into ten of the smaller one.
    - teach: Before working it out, estimate by rounding. 3,912 + 2,104 is about 4,000 + 2,000 = 6,000. If your answer is far from the estimate, check again. In a story, 'altogether' means add; 'how many left' or 'how much more' means subtract.
      check:
        prompt: Which word tells you to subtract?
        options:
        - How many are left
        - Altogether
        - In all
        answer: How many are left
        why: Finding what remains is taking away.
      ways:
      - style: step_by_step
        teach: 'Check 5,872 − 2,941 by estimating. Step 1: Round: 5,872 is about 6,000 and 2,941 is about 3,000. Step 2: Estimate: 6,000 − 3,000 = 3,000. Step 3: Work it out: 2,931. Step 4: 2,931 is close to 3,000, so the answer is sensible.'
      - style: visual
        teach: Story words that tell you whether to add or to subtract.
        picture:
          kind: compare
          columns:
          - title: Add
            points:
            - altogether
            - in all
            - total
            - both together
          - title: Subtract
            points:
            - how many left
            - how much more
            - how many fewer
            - difference
          alt: Words like altogether, in all, total and both together mean add. Words like how many left, how much more, how many fewer and difference mean subtract.
  items:
  - prompt: A train goes 1,245 km and then a bus goes 368 km. How far is the whole trip in km?
    answer: '1613'
    check: 1245+368
    difficulty: 1
    hints:
    - Add the two distances.
    - 1245 + 368.
    solution: 1,245 + 368 = 1,613 km.
    mistakes:
      '1503': c5_carry
  - prompt: What is 4,506 + 2,795?
    answer: '7301'
    check: 4506+2795
    difficulty: 1
    hints:
    - Add from the ones.
    - 6 + 5 = 11, carry 1.
    solution: 4,506 + 2,795 = 7,301.
    mistakes:
      '6201': c5_carry
  - prompt: What is 8,000 − 2,375?
    answer: '5625'
    check: 8000-2375
    difficulty: 2
    hints:
    - Borrow across the zeros.
    - 8000 − 2000 = 6000, then − 375.
    solution: 8,000 − 2,375 = 5,625.
    mistakes:
      '6375': c5_carry
  - prompt: A journey is 2,150 km. A family has already gone 1,480 km. How many km are left?
    answer: '670'
    check: 2150-1480
    difficulty: 1
    hints:
    - Take away what is done.
    - 2150 − 1480.
    solution: 2,150 − 1,480 = 670 km.
    mistakes: {"3630": "m5_subtract_borrow", "770": "m5_subtract_borrow"}
  - prompt: Which is the best estimate for 3,912 + 2,104?
    options:
    - about 6,000
    - about 5,000
    - about 7,000
    - about 60,000
    answer: about 6,000
    difficulty: 1
    hints:
    - Round each to the nearest thousand.
    - 4,000 + 2,000.
    solution: 3,912 is about 4,000 and 2,104 about 2,000, so about 6,000.
    mistakes: {"about 5,000": "m5_estimate"}
  - prompt: Delhi to Chennai is about 2,180 km by rail and Delhi to Mumbai about 1,385 km. How much longer is the Chennai trip in km?
    answer: '795'
    check: 2180-1385
    difficulty: 2
    hints:
    - Find the difference.
    - 2180 − 1385.
    solution: 2,180 − 1,385 = 795 km.
    mistakes: {"3565": "m5_subtract_borrow", "895": "m5_subtract_borrow"}
  - prompt: What is 3,658 + 1,476?
    answer: '5134'
    check: 3658+1476
    difficulty: 1
    hints:
    - Start with 8 + 6 in the ones.
    - Carry each time a column reaches 10.
    solution: 'Step 1: ones 14 (carry 1), tens 13 (carry 1), hundreds 11 (carry 1), thousands 5. Step 2: 5,134.'
    mistakes:
      '4024': c5m1_carry
      '5024': c5m1_carry
      '4134': c5m1_carry
  - prompt: What is 7,003 − 2,458?
    answer: '4545'
