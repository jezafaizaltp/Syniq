# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 1
title: We the Travellers-I
tips:
  c5_place_value: 'Read the number from the left: ten thousands, thousands, hundreds, tens, ones. Each place is 10 times the place to its right.'
  c5_carry: When a column adds up to 10 or more, write the ones digit and carry the ten to the next column on the left.
concepts:
- code: cbse5m.trav1.place
  title: Big numbers and place value
  notes: |
    Numbers up to 1,00,000 (one lakh). Places: ones, tens, hundreds, thousands, ten thousands, lakh. In India we put
    commas after the thousands and then every two digits: 1,00,000. 45,307 = 4 ten thousands + 5 thousands + 3 hundreds
    + 0 tens + 7 ones. Comparing: the number with more digits is bigger; with the same digits, compare from the left.
    Rounding: to the nearest hundred, look at the tens digit (5 or more rounds up).
  explanations:
    text: Every digit has a place, and the place gives it its value. In 45,307 the 4 is worth 40,000 because it sits in the ten thousands place. To compare two numbers with the same number of digits, start from the left and find the first digit that is different.
    visual: 'Draw a place value chart with five boxes: TTh, Th, H, T, O. Put one digit of 45,307 in each box: 4, 5, 3, 0, 7. The empty tens box is shown with a 0.'
    step_by_step: 'Step 1: Write the number in a place value chart. Step 2: Read the digit you need. Step 3: Multiply it by its place (10, 100, 1000 ...). Step 4: For comparing, check the digits from the left.'
    real_world: Distances on long train journeys, the number of people in a town, or the seats in a big stadium are big numbers like these.
  picture:
    kind: compare
    columns:
    - title: Number
      points:
      - 45,307
      - Place of 4
      - Place of 3
    - title: Value
      points:
      - forty-five thousand three hundred seven
      - 'ten thousands: 40,000'
      - 'hundreds: 300'
    alt: In 45,307 the 4 is in the ten thousands place, worth 40,000, and the 3 is in the hundreds place, worth 300.
  items:
  - prompt: What is the value of 6 in 36,452?
    answer: '6000'
    check: 6*1000
    difficulty: 1
    hints:
    - Which place is the 6 in?
    - It is in the thousands place.
    solution: 'The 6 is in the thousands place: 6 × 1000 = 6000.'
    mistakes:
      '6': c5_place_value
      '600': c5_place_value
  - prompt: 'Write the number: 3 ten thousands + 2 thousands + 0 hundreds + 5 tens + 1 one.'
    answer: '32051'
    check: 30000+2000+50+1
    difficulty: 1
    hints:
    - Put each digit in its place.
    - 3, 2, 0, 5, 1.
    solution: 30000 + 2000 + 0 + 50 + 1 = 32,051.
    mistakes:
      '3251': c5_place_value
  - prompt: Which number is bigger?
    options:
    - 54,210
    - 45,999
    - 54,201
    - 9,999
    answer: 54,210
    difficulty: 1
    hints:
    - Compare from the left.
    - 54,210 and 54,201 differ in the tens place.
    solution: '54,210 is biggest: same first three digits as 54,201, but 1 ten beats 0 tens.'
  - prompt: How many thousands make one lakh?
    answer: '100'
    check: 100000/1000
    difficulty: 1
    hints:
    - 1,00,000 ÷ 1000.
    - Count the zeros.
    solution: 1,00,000 ÷ 1000 = 100 thousands.
  - prompt: Round 7,468 to the nearest hundred.
    answer: '7500'
    check: '7500'
    difficulty: 2
    hints:
    - Look at the tens digit.
    - 6 is 5 or more, so round up.
    solution: The tens digit is 6, so 7,468 rounds up to 7,500.
    mistakes:
      '7400': c5_place_value
  - prompt: What is the smallest 5-digit number you can make with the digits 7, 0, 3, 9, 1 (each used once)?
    answer: '10379'
    check: '10379'
    difficulty: 2
    hints:
    - A number cannot start with 0.
    - Start with the smallest non-zero digit, then 0.
    solution: 'Start with 1, then 0, then 3, 7, 9: 10,379.'
    mistakes:
      '1379': c5_place_value
- code: cbse5m.trav1.add
  title: Adding and subtracting travel distances
  after:
  - cbse5m.trav1.place
  notes: |
    Add big numbers column by column from the ones, carrying when a column passes 9. Subtract column by column,
    borrowing (regrouping) when the top digit is smaller. Estimate first by rounding, to check the answer is sensible.
    Example: a family travels 1,245 km by train and 368 km by bus: 1,245 + 368 = 1,613 km.
  explanations:
    text: 'Line the numbers up by place: ones under ones, tens under tens. Add from the right. If a column makes 10 or more, write the ones digit and carry 1 to the next column. Subtracting works the same way, but you borrow when the top digit is too small.'
    visual: 'Write 1,245 above 368 with the ones lined up. Ones: 5 + 8 = 13, write 3 carry 1. Tens: 4 + 6 + 1 = 11, write 1 carry 1. Hundreds: 2 + 3 + 1 = 6. Thousands: 1. Answer 1,613.'
    step_by_step: 'Step 1: Line up the places. Step 2: Start with the ones. Step 3: Carry or borrow when needed. Step 4: Check by rounding: 1,200 + 400 is about 1,600.'
    real_world: 'Planning a trip: adding the distance of each part of the journey tells you the total, and subtracting tells you how far is left.'
  picture:
    kind: flow
    steps:
    - 'Ones: 5 + 8 = 13, write 3, carry 1'
    - 'Tens: 4 + 6 + 1 = 11, write 1, carry 1'
    - 'Hundreds: 2 + 3 + 1 = 6'
    - 'Thousands: 1 → 1,613'
    alt: Adding 1,245 and 368 column by column with carrying gives 1,613.
  items:
  - prompt: A train goes 1,245 km and then a bus goes 368 km. How far is the whole trip in km?
    answer: '1613'
    check: 1245+368
    difficulty: 1
    hints:
    - Add the two distances.
    - 1245 + 368.
    solution: 1,245 + 368 = 1,613 km.
    mistakes:
      '1503': c5_carry
  - prompt: What is 4,506 + 2,795?
    answer: '7301'
    check: 4506+2795
    difficulty: 1
    hints:
    - Add from the ones.
    - 6 + 5 = 11, carry 1.
    solution: 4,506 + 2,795 = 7,301.
    mistakes:
      '6201': c5_carry
  - prompt: What is 8,000 − 2,375?
    answer: '5625'
    check: 8000-2375
    difficulty: 2
    hints:
    - Borrow across the zeros.
    - 8000 − 2000 = 6000, then − 375.
    solution: 8,000 − 2,375 = 5,625.
    mistakes:
      '6375': c5_carry
  - prompt: A journey is 2,150 km. A family has already gone 1,480 km. How many km are left?
    answer: '670'
    check: 2150-1480
    difficulty: 1
    hints:
    - Take away what is done.
    - 2150 − 1480.
    solution: 2,150 − 1,480 = 670 km.
  - prompt: Which is the best estimate for 3,912 + 2,104?
    options:
    - about 6,000
    - about 5,000
    - about 7,000
    - about 60,000
    answer: about 6,000
    difficulty: 1
    hints:
    - Round each to the nearest thousand.
    - 4,000 + 2,000.
    solution: 3,912 is about 4,000 and 2,104 about 2,000, so about 6,000.
  - prompt: Delhi to Chennai is about 2,180 km by rail and Delhi to Mumbai about 1,385 km. How much longer is the Chennai trip in km?
    answer: '795'
    check: 2180-1385
    difficulty: 2
    hints:
    - Find the difference.
    - 2180 − 1385.
    solution: 2,180 − 1,385 = 795 km.
