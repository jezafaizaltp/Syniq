# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 12
title: Racing Seconds
tips:
  c5_time_units: 1 minute = 60 seconds and 1 hour = 60 minutes, not 100. Count on in 60s.
  m5_24h: "After 12:00, take away 12 to get the p.m. time."
  m5_hours_days: "One day has 24 hours. Two days have 24 + 24."
  m5_seconds: "Seconds are very short. Which event is over in less than a minute?"
  m5_time_minutes: "Count on: first to the next whole hour, then the rest of the hours, then the minutes. 1 hour = 60 minutes."
  c5m12_conv: '60 seconds make a minute and 60 minutes make an hour; 24 hours make a day. Bigger to smaller: multiply.'
  c5m12_race: In a race, the fastest runner takes the least time.
  c5m12_unit: 'Think about how long it lasts: a blink, a lesson, or a whole day?'
  c5m12_count: 'Count up from the start time: first to the next full hour, then the extra minutes.'
  c5m12_carry: When minutes reach 60, swap 60 minutes for 1 hour.
  c5m12_24: After 12 noon, take away 12 to get the p.m. time.
concepts:
- code: cbse5m.time.units
  title: Seconds, minutes and hours
  notes: |
    1 minute = 60 seconds; 1 hour = 60 minutes; 1 day = 24 hours. Short events in seconds (a race), longer in minutes
    (a class), longer still in hours. Convert: 3 minutes = 180 seconds; 150 seconds = 2 minutes 30 seconds. Races are
    won by the smallest time.
  explanations:
    text: 'Seconds are very short: about the time it takes to say ''one thousand one''. There are 60 seconds in a minute and 60 minutes in an hour. In a race, the runner with the fewest seconds wins.'
    visual: Draw a clock face. Mark how the seconds hand goes all the way round in 60 seconds while the minute hand moves one small step.
    step_by_step: 'Step 1: Know 60 s = 1 min and 60 min = 1 h. Step 2: To go to a smaller unit multiply by 60. Step 3: To go bigger, divide by 60 and keep the remainder.'
    real_world: Sports days time races in seconds; cooking times are in minutes; journeys in hours.
  picture:
    kind: bars
    bars:
    - label: Anu
      value: 14
    - label: Ravi
      value: 12
    - label: Sara
      value: 15
    - label: Joseph
      value: 13
    alt: 'Times for a 100 metre race: Anu 14 seconds, Ravi 12, Sara 15, Joseph 13. Ravi is fastest with the smallest time.'
    unit: s
  activity:
    type: sort
    prompt: How long is each one? An hour is 60 minutes.
    bins:
    - 15 minutes
    - 90 minutes
    - 135 minutes
    items:
    - label: A quarter of an hour
      bin: 15 minutes
      clue: Split 60 into 4 equal parts.
      why: 60 ÷ 4 = 15.
    - label: 900 seconds
      bin: 15 minutes
      clue: 60 seconds make a minute.
      why: 900 ÷ 60 = 15.
    - label: Half of half an hour
      bin: 15 minutes
      clue: Half an hour is 30 minutes.
      why: Half of 30 is 15.
    - label: One and a half hours
      bin: 90 minutes
      clue: One hour, plus half of 60.
      why: 60 + 30 = 90. Not 150!
    - label: 1 hour 30 minutes
      bin: 90 minutes
      clue: Turn the hour into minutes first.
      why: 60 + 30.
    - label: Three half-hours
      bin: 90 minutes
      clue: 30, three times.
      why: '90.'
    - label: 2 hours 15 minutes
      bin: 135 minutes
      clue: 2 hours is 120 minutes, not 200.
      why: 120 + 15.
    - label: Two and a quarter hours
      bin: 135 minutes
      clue: Two hours, then a quarter of 60.
      why: 120 + 15.
  lesson:
    - teach: Time is measured in seconds, minutes, hours and days. 1 minute = 60 seconds. 1 hour = 60 minutes. 1 day = 24 hours.
      picture:
        kind: flow
        steps:
        - 60 seconds
        - = 1 minute
        - 60 minutes = 1 hour
        - 24 hours = 1 day
        alt: Units of time from seconds up to days.
      check:
        prompt: How many seconds make 1 minute?
        options:
        - '60'
        - '100'
        - '24'
        answer: '60'
        why: The second hand goes round once in 60 seconds.
      ways:
      - style: step_by_step
        teach: 'Step 1: 60 seconds make 1 minute. Step 2: 60 minutes make 1 hour, so 1 hour is 60 × 60 = 3,600 seconds. Step 3: 24 hours make 1 day. Each step up, the unit gets bigger and you need fewer of them.'
      - style: real_world
        teach: 'Watch the second hand of a clock go once round: that is 60 seconds, and the minute hand moves on by one mark. When the minute hand goes once round, an hour has passed.'
    - teach: 'To change to a smaller unit, multiply: 4 minutes = 4 × 60 = 240 seconds. To change to a bigger unit, divide and find what is left: 150 seconds = 2 minutes 30 seconds.'
      check:
        prompt: How many minutes are in 3 hours?
        options:
        - '180'
        - '36'
        - '300'
        answer: '180'
        why: 3 × 60 = 180.
      ways:
      - style: visual
        teach: Changing 260 seconds into minutes and seconds.
        picture:
          kind: number_line
          from: 0
          to: 300
          step: 60
          jumps:
          - from: 0
            to: 60
            label: 1 min
          - from: 60
            to: 120
            label: 2 min
          - from: 120
            to: 180
            label: 3 min
          - from: 180
            to: 240
            label: 4 min
          points:
          - at: 260
            label: 260 s
          alt: 'Jumps of 60 seconds: 4 full minutes reach 240 seconds, and 20 seconds are left to reach 260. So 260 seconds is 4 minutes 20 seconds.'
      - style: real_world
        teach: A song lasts 3 minutes 15 seconds. In seconds that is 3 × 60 + 15 = 180 + 15 = 195 seconds.
    - teach: Short events are timed in seconds (a 100 m race), longer ones in minutes (a lesson), longer still in hours (a train journey). In a race, the winner has the smallest time.
      check:
        prompt: 'Race times: 15 s, 13 s, 14 s. Which time won?'
        options:
        - 13 s
        - 15 s
        - 14 s
        answer: 13 s
        why: Least time means fastest.
      ways:
      - style: visual
        teach: Choosing the right unit for how long things take.
        picture:
          kind: compare
          columns:
          - title: Seconds
            points:
            - A sneeze
            - Tying a shoelace
          - title: Minutes
            points:
            - Brushing teeth
            - A school period
          - title: Hours
            points:
            - A night's sleep
            - A bus ride to another city
          alt: A sneeze or tying a shoelace takes seconds. Brushing teeth or a school period takes minutes. A night's sleep or a bus ride to another city takes hours.
      - style: step_by_step
        teach: 'Rank race times. Step 1: Write all times in the same unit, seconds. Step 2: The smallest time is the fastest. Step 3: Put them in order from smallest to biggest: that is 1st, 2nd, 3rd place.'
  items:
  - prompt: How many seconds are in 3 minutes?
    answer: '180'
    check: 3*60
    difficulty: 1
    hints:
    - 1 minute = 60 seconds.
    - 3 × 60.
    solution: 3 × 60 = 180 seconds.
    mistakes:
      '300': c5_time_units
  - prompt: 'Race times: Anu 14 s, Ravi 12 s, Sara 15 s. Who won?'
    options:
    - Ravi
    - Anu
    - Sara
    - it was a tie
    answer: Ravi
    difficulty: 1
    hints:
    - Fastest = least time.
    - Smallest number.
    solution: 'Ravi took the least time: 12 seconds.'
    mistakes:
      Sara: c5_time_units
  - prompt: 150 seconds is 2 minutes and how many seconds?
    answer: '30'
    check: 150-120
    difficulty: 2
    hints:
    - 2 minutes = 120 seconds.
    - 150 − 120.
    solution: 150 − 120 = 30 seconds.
    mistakes:
      '50': c5_time_units
  - prompt: How many minutes are in 2 hours?
    answer: '120'
    check: 2*60
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - 2 × 60.
    solution: 2 × 60 = 120 minutes.
    mistakes:
      '200': c5_time_units
  - prompt: Which is best measured in seconds?
    options:
    - a 50 m race
    - a school day
    - a train journey to Delhi
    - a summer holiday
    answer: a 50 m race
    difficulty: 1
    hints:
    - Which is very short?
    - A sprint.
    solution: A short race takes seconds.
    mistakes: {"a school day": "m5_seconds"}
  - prompt: How many hours are in 2 days?
    answer: '48'
    check: 24*2
    difficulty: 1
    hints:
    - 1 day = 24 hours.
    - 24 × 2.
    solution: 24 × 2 = 48 hours.
    mistakes: {"24": "m5_hours_days", "36": "m5_hours_days"}
  - prompt: How many seconds are in 5 minutes?
    answer: '300'
    check: 5*60
    difficulty: 1
    hints:
    - 1 minute = 60 seconds.
    - 5 × 60.
    solution: 'Step 1: 5 × 60. Step 2: = 300 seconds.'
    mistakes:
      '500': c5m12_conv
      '65': c5m12_conv
  - prompt: How many hours are in 3 days?
    answer: '72'
    check: 3*24
    difficulty: 1
    hints:
    - 1 day = 24 hours.
    - 3 × 24.
    solution: 'Step 1: 3 × 24. Step 2: = 72 hours.'
    mistakes:
      '180': c5m12_conv
      '36': c5m12_conv
  - prompt: 200 seconds is 3 minutes and how many seconds?
    answer: '20'
    check: 200-180
    difficulty: 2
    hints:
    - 3 minutes = 180 seconds.
    - What is left from 200?
    solution: 'Step 1: 3 × 60 = 180. Step 2: 200 − 180 = 20 seconds.'
    mistakes:
      '0': c5m12_conv
      '2': c5m12_conv
  - prompt: 'Race times: Meena 18 s, Arun 16 s, Lata 17 s. Who came last?'
    options:
    - Meena
    - Arun
    - Lata
    answer: Meena
    difficulty: 2
    hints:
    - Last means slowest.
    - Slowest takes the most time.
    solution: 'Step 1: biggest time = slowest. Step 2: 18 s is Meena.'
    mistakes:
      Arun: c5m12_race
      Lata: c5m12_race
  - prompt: Which is best measured in hours?
    options:
    - A train journey from Kochi to Chennai
    - Tying a shoelace
    - A sneeze
    answer: A train journey from Kochi to Chennai
    difficulty: 1
    hints:
    - Hours are for long things.
    - Which takes the longest?
    solution: 'Step 1: a train journey takes many hours. Step 2: so hours fit.'
    mistakes:
      Tying a shoelace: c5m12_unit
      A sneeze: c5m12_unit
  - prompt: How many minutes are in 1 hour 45 minutes?
    answer: '105'
    check: 60+45
    difficulty: 2
    hints:
    - 1 hour = 60 minutes.
    - Add 45.
    solution: 'Step 1: 60 + 45. Step 2: = 105 minutes.'
    mistakes:
      '145': c5m12_conv
      '75': c5m12_conv
  - prompt: Ravi ran a lap in 1 minute 10 seconds. How many seconds is that?
    answer: '70'
    check: 60+10
    difficulty: 2
    hints:
    - 1 minute = 60 seconds.
    - Add 10.
    solution: 'Step 1: 60 + 10. Step 2: = 70 seconds.'
    mistakes:
      '110': c5m12_conv
      '11': c5m12_conv
  - prompt: 'Which is longer: 2 minutes or 100 seconds?'
    options:
    - 2 minutes
    - 100 seconds
    - They are equal
    answer: 2 minutes
    difficulty: 2
    hints:
    - Change 2 minutes to seconds.
    - 2 × 60 = 120.
    solution: 'Step 1: 2 minutes = 120 s. Step 2: 120 > 100, so 2 minutes.'
    mistakes:
      100 seconds: c5m12_conv
      They are equal: c5m12_conv
  - prompt: Sara beat Tom by 3 seconds. Tom's time was 21 seconds. What was Sara's time, in seconds?
    answer: '18'
    check: 21-3
    difficulty: 3
    hints:
    - Beating someone means a smaller time.
    - 21 − 3.
    solution: 'Step 1: Sara was faster, so less time. Step 2: 21 − 3 = 18 s.'
    mistakes:
      '24': c5m12_race
      '21': c5m12_race
  - prompt: 'Case: In a swimming race, Kiran finished in 1 minute 5 seconds and Dev in 58 seconds. Kiran says, ''I won, because 1 minute 5 is a bigger number.'' Who actually won?'
    options:
    - Dev
    - Kiran
    - It was a tie
    answer: Dev
    hints:
    - Write both times in seconds.
    - In a race, does the winner take more time or less?
    solution: 1 minute 5 seconds = 65 seconds. Dev took 58 seconds, which is less, so Dev won.
    mistakes:
      Kiran: c5m12_race
      It was a tie: c5m12_conv
    exam: case
    difficulty: 2
  - prompt: 'Situation: A school sports day lasts from morning to afternoon. Which unit is best for saying how long it lasts?'
    options:
    - Hours
    - Seconds
    - Days
    answer: Hours
    hints:
    - Is it as short as a sneeze, or as long as a week?
    - Morning to afternoon is part of one day.
    solution: Morning to afternoon is a few hours, so hours is the best unit.
    mistakes:
      Seconds: c5m12_unit
      Days: c5m12_unit
    exam: competency
    difficulty: 2
- code: cbse5m.time.duration
  title: How long something takes
  after:
  - cbse5m.time.units
  notes: |
    Duration = end time − start time. 9:15 to 10:40 is 1 h 25 min (count up: 9:15 → 10:15 is 1 h, then 25 min). 24-hour
    clock: 14:00 = 2 p.m. Add times carrying 60 minutes into an hour: 45 min + 30 min = 1 h 15 min.
  explanations:
    text: 'To find how long something lasted, count up from the start time to the end time: first whole hours, then the minutes left over.'
    visual: Draw a time line from 9:15 to 10:40. Jump 1 hour to 10:15, then 25 minutes to 10:40. Total 1 hour 25 minutes.
    step_by_step: 'Step 1: Count whole hours from the start. Step 2: Count the extra minutes. Step 3: Add them.'
    real_world: Working out how long a film runs, or how long your school bus ride takes.
  picture:
    kind: number_line
    from: 0
    to: 90
    step: 15
    points:
    - at: 0
      label: '9:15'
    - at: 60
      label: '10:15'
    - at: 85
      label: '10:40'
    alt: 'From 9:15, one jump of 60 minutes reaches 10:15, then 25 more minutes reaches 10:40: 85 minutes in all.'
    jumps:
    - from: 0
      to: 60
      label: 1 h
    - from: 60
      to: 85
      label: 25 min
  activity:
    type: number_line
    min: 0
    max: 180
    step: 5
    start: 0
    prompt: Count up from the start time to the end time. Mark how many minutes it took.
    goals:
    - prompt: A bus leaves at 9:15 and arrives at 11:45.
      target: 150
      mistakes:
      - when:
          v: 120
        say: That's just the 2 whole hours. There are 30 more minutes.
      - when:
          v: 130
        say: 'Count up: 9:15 to 11:15 is 2 hours (120 minutes), then 30 more.'
    - prompt: A film starts at 10:40 and ends at 12:10.
      target: 90
      mistakes:
      - when:
          v: 130
        say: 12:10 − 10:40 like ordinary numbers gives 1:70, but an hour has only 60 minutes. Count up instead.
    - prompt: A class starts at 3:50 and ends at 4:25.
      target: 35
      mistakes:
      - when:
          v: 75
        say: 425 − 350 = 75 treats an hour as 100 minutes. 3:50 to 4:00 is 10, then 25 more.
  lesson:
    - teach: 'Duration is how long something lasts: end time − start time. Count up from the start. 9:15 to 10:40: 9:15 → 10:15 is 1 hour, then 10:15 → 10:40 is 25 minutes. So 1 hour 25 minutes.'
      picture:
        kind: flow
        steps:
        - Start 9:15
        - +1 hour → 10:15
        - +25 min → 10:40
        - Total 1 h 25 min
        alt: Counting up from 9:15 to 10:40 in an hour and then 25 minutes.
      check:
        prompt: How long from 2:00 to 2:45?
        options:
        - 45 minutes
        - 2 hours 45 minutes
        - 15 minutes
        answer: 45 minutes
        why: Same hour, so 45 − 0 = 45 minutes.
      ways:
      - style: visual
        teach: Counting up from 11:35 to 1:10 to find how long it took.
        picture:
          kind: flow
          steps:
          - 11:35 to 12:00 is 25 minutes
          - 12:00 to 1:00 is 1 hour
          - 1:00 to 1:10 is 10 minutes
          - 'Total: 1 hour 35 minutes'
          alt: From 11:35 to 12:00 is 25 minutes, 12:00 to 1:00 is 1 hour, and 1:00 to 1:10 is 10 minutes. The total is 1 hour 35 minutes.
      - style: real_world
        teach: 'A cake goes into the oven at 4:20 and comes out at 5:05. Count up: 4:20 to 5:00 is 40 minutes, and 5:00 to 5:05 is 5 more. It baked for 45 minutes.'
    - teach: 'When adding times, if the minutes reach 60 or more, change 60 minutes into 1 hour: 40 min + 35 min = 75 min = 1 hour 15 minutes.'
      check:
        prompt: '50 minutes + 20 minutes is:'
        options:
        - 1 hour 10 minutes
        - 70 hours
        - 1 hour 20 minutes
        answer: 1 hour 10 minutes
        why: 70 minutes = 60 + 10.
      ways:
      - style: step_by_step
        teach: 'Add 2 h 50 min and 1 h 25 min. Step 1: Add the hours: 2 + 1 = 3 h. Step 2: Add the minutes: 50 + 25 = 75 min. Step 3: 75 min = 1 h 15 min. Step 4: Total: 3 h + 1 h 15 min = 4 h 15 min.'
      - style: visual
        teach: Adding 55 minutes and 30 minutes, then swapping 60 minutes for an hour.
        picture:
          kind: flow
          steps:
          - 55 min + 30 min = 85 min
          - 85 min = 60 min + 25 min
          - 60 min = 1 hour
          - 'Answer: 1 hour 25 minutes'
          alt: 55 minutes plus 30 minutes is 85 minutes, which is 60 minutes and 25 minutes. 60 minutes is 1 hour, so the answer is 1 hour 25 minutes.
    - teach: 'The 24-hour clock counts hours from 0 to 23. Times after noon are more than 12: 14:00 is 2 p.m. (14 − 12). 09:00 is 9 a.m. Trains and buses often use it.'
      check:
        prompt: What is 18:00 in the 12-hour clock?
        options:
        - 6 p.m.
        - 8 p.m.
        - 6 a.m.
        answer: 6 p.m.
        why: 18 − 12 = 6, and it is after noon.
      ways:
      - style: visual
        teach: Some times on the 24-hour clock and the 12-hour clock.
        picture:
          kind: compare
          columns:
          - title: 24-hour clock
            points:
            - 06:30
            - '12:00'
            - '13:45'
            - '21:10'
          - title: 12-hour clock
            points:
            - 6:30 a.m.
            - 12 noon
            - 1:45 p.m.
            - 9:10 p.m.
          alt: On the 24-hour clock 06:30 is 6:30 a.m., 12:00 is 12 noon, 13:45 is 1:45 p.m. and 21:10 is 9:10 p.m.
      - style: real_world
        teach: 'A railway ticket says ''Departs 17:20''. Since 17 is more than 12, take away 12: the train leaves at 5:20 in the evening.'
  items:
  - prompt: A class starts at 9:15 and ends at 10:00. How many minutes is it?
    answer: '45'
    check: 60-15
    difficulty: 1
    hints:
    - Count up from 9:15 to 10:00.
    - 60 − 15.
    solution: From 9:15 to 10:00 is 45 minutes.
    mistakes:
      '85': c5_time_units
  - prompt: A film starts at 3:30 p.m. and ends at 5:45 p.m. How many minutes does it last?
    answer: '135'
    check: 2*60+15
    difficulty: 2
    hints:
    - 3:30 to 5:30 is 2 hours.
    - Plus 15 minutes.
    solution: 2 hours 15 minutes = 120 + 15 = 135 minutes.
    mistakes: {"215": "m5_time_minutes", "95": "m5_time_minutes"}
  - prompt: What is 15:00 on the 24-hour clock?
    options:
    - 3 p.m.
    - 3 a.m.
    - 5 p.m.
    - 1 p.m.
    answer: 3 p.m.
    difficulty: 1
    hints:
    - Subtract 12 for p.m.
    - 15 − 12 = 3.
    solution: 15:00 is 3 p.m.
    mistakes: {"5 p.m.": "m5_24h"}
  - prompt: 45 minutes + 30 minutes is 1 hour and how many minutes?
    answer: '15'
    check: 45+30-60
    difficulty: 2
    hints:
    - 45 + 30 = 75.
    - 75 − 60.
    solution: 75 minutes = 1 hour 15 minutes.
    mistakes:
      '75': c5_time_units
  - prompt: A bus leaves at 7:50 a.m. and reaches school at 8:25 a.m. How many minutes?
    answer: '35'
    check: 10+25
    difficulty: 2
    hints:
    - 7:50 to 8:00 is 10 minutes.
    - 8:00 to 8:25 is 25.
    solution: 10 + 25 = 35 minutes.
    mistakes:
      '75': c5_time_units
  - prompt: A runner does 3 laps taking 50 seconds each. How many seconds in all?
    answer: '150'
    check: 50*3
    difficulty: 1
    hints:
    - 50 × 3.
    - Add three 50s.
    solution: 50 × 3 = 150 seconds.
    mistakes: {"53": "m5_times_carry", "100": "m5_times_carry"}
  - prompt: A test starts at 10:20 and ends at 11:05. How many minutes is it?
    answer: '45'
    check: 40+5
    difficulty: 2
    hints:
    - Count up to 11:00 first.
    - Then add the extra minutes.
    solution: 'Step 1: 10:20 → 11:00 is 40 min. Step 2: + 5 = 45 minutes.'
    mistakes:
      '85': c5m12_count
      '55': c5m12_count
  - prompt: A movie runs from 6:15 p.m. to 8:30 p.m. How many minutes is that?
    answer: '135'
    check: 2*60+15
    difficulty: 2
    hints:
    - 6:15 to 8:15 is 2 hours.
    - Then 15 more minutes.
    solution: 'Step 1: 2 hours = 120 min. Step 2: 120 + 15 = 135 minutes.'
    mistakes:
      '215': c5m12_count
      '225': c5m12_count
      '75': c5m12_count
  - prompt: What is 20:00 in the 12-hour clock?
    options:
    - 8 p.m.
    - 10 p.m.
    - 8 a.m.
    answer: 8 p.m.
    difficulty: 1
    hints:
    - It is after 12.
    - 20 − 12.
    solution: 'Step 1: 20 − 12 = 8. Step 2: after noon, so 8 p.m.'
    mistakes:
      10 p.m.: c5m12_24
      8 a.m.: c5m12_24
  - prompt: 35 minutes + 40 minutes is 1 hour and how many minutes?
    answer: '15'
    check: 35+40-60
    difficulty: 2
    hints:
    - 35 + 40 = 75.
    - Take out 60 minutes for the hour.
    solution: 'Step 1: 75 minutes. Step 2: 75 − 60 = 15, so 1 hour 15 minutes.'
    mistakes:
      '75': c5m12_carry
      '5': c5m12_carry
  - prompt: School starts at 8:40 a.m. Asha leaves home 25 minutes before. When does she leave?
    options:
    - 8:15 a.m.
    - 9:05 a.m.
    - 8:25 a.m.
    answer: 8:15 a.m.
    difficulty: 2
    hints:
    - '''Before'' means take away.'
    - 8:40 − 25 minutes.
    solution: 'Step 1: 40 − 25 = 15. Step 2: 8:15 a.m.'
    mistakes:
      9:05 a.m.: c5m12_count
      8:25 a.m.: c5m12_count
  - prompt: A swimmer does 4 lengths, each taking 45 seconds. How many seconds in all?
    answer: '180'
    check: 4*45
    difficulty: 2
    hints:
    - Same time for each length.
    - 4 × 45.
    solution: 'Step 1: 4 × 45. Step 2: = 180 seconds (3 minutes).'
    mistakes:
      '49': c5m12_conv
      '160': c5m12_conv
  - prompt: A train leaves at 22:30 and arrives at 23:50. How long is the trip?
    options:
    - 1 hour 20 minutes
    - 1 hour 50 minutes
    - 20 minutes
    answer: 1 hour 20 minutes
    difficulty: 3
    hints:
    - 22:30 to 23:30 is 1 hour.
    - Then 23:30 to 23:50.
    solution: 'Step 1: 1 hour to 23:30. Step 2: + 20 minutes = 1 hour 20 minutes.'
    mistakes:
      1 hour 50 minutes: c5m12_count
      20 minutes: c5m12_count
  - prompt: Homework took 1 hour 20 minutes and reading 50 minutes. How long in all?
    options:
    - 2 hours 10 minutes
    - 1 hour 70 minutes
    - 2 hours 30 minutes
    answer: 2 hours 10 minutes
    difficulty: 3
    hints:
    - 20 + 50 = 70 minutes.
    - 70 minutes = 1 hour 10 minutes.
    solution: 'Step 1: 1 h 70 min. Step 2: = 2 hours 10 minutes.'
    mistakes:
      1 hour 70 minutes: c5m12_carry
      2 hours 30 minutes: c5m12_carry
  - prompt: A bus leaves at 9:45 a.m. The trip takes 40 minutes. When does it arrive?
    options:
    - 10:25 a.m.
    - 9:85 a.m.
    - 10:45 a.m.
