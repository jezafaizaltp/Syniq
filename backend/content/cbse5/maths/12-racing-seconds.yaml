# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 12
title: Racing Seconds
tips:
  c5_time_units: 1 minute = 60 seconds and 1 hour = 60 minutes, not 100. Count on in 60s.
  m5_24h: "After 12:00, take away 12 to get the p.m. time."
  m5_hours_days: "One day has 24 hours. Two days have 24 + 24."
  m5_seconds: "Seconds are very short. Which event is over in less than a minute?"
  m5_time_minutes: "Count on: first to the next whole hour, then the rest of the hours, then the minutes. 1 hour = 60 minutes."
concepts:
- code: cbse5m.time.units
  title: Seconds, minutes and hours
  notes: |
    1 minute = 60 seconds; 1 hour = 60 minutes; 1 day = 24 hours. Short events in seconds (a race), longer in minutes
    (a class), longer still in hours. Convert: 3 minutes = 180 seconds; 150 seconds = 2 minutes 30 seconds. Races are
    won by the smallest time.
  explanations:
    text: 'Seconds are very short: about the time it takes to say ''one thousand one''. There are 60 seconds in a minute and 60 minutes in an hour. In a race, the runner with the fewest seconds wins.'
    visual: Draw a clock face. Mark how the seconds hand goes all the way round in 60 seconds while the minute hand moves one small step.
    step_by_step: 'Step 1: Know 60 s = 1 min and 60 min = 1 h. Step 2: To go to a smaller unit multiply by 60. Step 3: To go bigger, divide by 60 and keep the remainder.'
    real_world: Sports days time races in seconds; cooking times are in minutes; journeys in hours.
  picture:
    kind: bars
    bars:
    - label: Anu
      value: 14
    - label: Ravi
      value: 12
    - label: Sara
      value: 15
    - label: Joseph
      value: 13
    alt: 'Times for a 100 metre race: Anu 14 seconds, Ravi 12, Sara 15, Joseph 13. Ravi is fastest with the smallest time.'
    unit: s
  activity:
    type: sort
    prompt: How long is each one? An hour is 60 minutes.
    bins:
    - 15 minutes
    - 90 minutes
    - 135 minutes
    items:
    - label: A quarter of an hour
      bin: 15 minutes
      clue: Split 60 into 4 equal parts.
      why: 60 ÷ 4 = 15.
    - label: 900 seconds
      bin: 15 minutes
      clue: 60 seconds make a minute.
      why: 900 ÷ 60 = 15.
    - label: Half of half an hour
      bin: 15 minutes
      clue: Half an hour is 30 minutes.
      why: Half of 30 is 15.
    - label: One and a half hours
      bin: 90 minutes
      clue: One hour, plus half of 60.
      why: 60 + 30 = 90. Not 150!
    - label: 1 hour 30 minutes
      bin: 90 minutes
      clue: Turn the hour into minutes first.
      why: 60 + 30.
    - label: Three half-hours
      bin: 90 minutes
      clue: 30, three times.
      why: '90.'
    - label: 2 hours 15 minutes
      bin: 135 minutes
      clue: 2 hours is 120 minutes, not 200.
      why: 120 + 15.
    - label: Two and a quarter hours
      bin: 135 minutes
      clue: Two hours, then a quarter of 60.
      why: 120 + 15.
  items:
  - prompt: How many seconds are in 3 minutes?
    answer: '180'
    check: 3*60
    difficulty: 1
    hints:
    - 1 minute = 60 seconds.
    - 3 × 60.
    solution: 3 × 60 = 180 seconds.
    mistakes:
      '300': c5_time_units
  - prompt: 'Race times: Anu 14 s, Ravi 12 s, Sara 15 s. Who won?'
    options:
    - Ravi
    - Anu
    - Sara
    - it was a tie
    answer: Ravi
    difficulty: 1
    hints:
    - Fastest = least time.
    - Smallest number.
    solution: 'Ravi took the least time: 12 seconds.'
    mistakes:
      Sara: c5_time_units
  - prompt: 150 seconds is 2 minutes and how many seconds?
    answer: '30'
    check: 150-120
    difficulty: 2
    hints:
    - 2 minutes = 120 seconds.
    - 150 − 120.
    solution: 150 − 120 = 30 seconds.
    mistakes:
      '50': c5_time_units
  - prompt: How many minutes are in 2 hours?
    answer: '120'
    check: 2*60
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - 2 × 60.
    solution: 2 × 60 = 120 minutes.
    mistakes:
      '200': c5_time_units
  - prompt: Which is best measured in seconds?
    options:
    - a 50 m race
    - a school day
    - a train journey to Delhi
    - a summer holiday
    answer: a 50 m race
    difficulty: 1
    hints:
    - Which is very short?
    - A sprint.
    solution: A short race takes seconds.
    mistakes: {"a school day": "m5_seconds"}
  - prompt: How many hours are in 2 days?
    answer: '48'
    check: 24*2
    difficulty: 1
    hints:
    - 1 day = 24 hours.
    - 24 × 2.
    solution: 24 × 2 = 48 hours.
    mistakes: {"24": "m5_hours_days", "36": "m5_hours_days"}
- code: cbse5m.time.duration
  title: How long something takes
  after:
  - cbse5m.time.units
  notes: |
    Duration = end time − start time. 9:15 to 10:40 is 1 h 25 min (count up: 9:15 → 10:15 is 1 h, then 25 min). 24-hour
    clock: 14:00 = 2 p.m. Add times carrying 60 minutes into an hour: 45 min + 30 min = 1 h 15 min.
  explanations:
    text: 'To find how long something lasted, count up from the start time to the end time: first whole hours, then the minutes left over.'
    visual: Draw a time line from 9:15 to 10:40. Jump 1 hour to 10:15, then 25 minutes to 10:40. Total 1 hour 25 minutes.
    step_by_step: 'Step 1: Count whole hours from the start. Step 2: Count the extra minutes. Step 3: Add them.'
    real_world: Working out how long a film runs, or how long your school bus ride takes.
  picture:
    kind: number_line
    from: 0
    to: 90
    step: 15
    points:
    - at: 0
      label: '9:15'
    - at: 60
      label: '10:15'
    - at: 85
      label: '10:40'
    alt: 'From 9:15, one jump of 60 minutes reaches 10:15, then 25 more minutes reaches 10:40: 85 minutes in all.'
    jumps:
    - from: 0
      to: 60
      label: 1 h
    - from: 60
      to: 85
      label: 25 min
  activity:
    type: number_line
    min: 0
    max: 180
    step: 5
    start: 0
    prompt: Count up from the start time to the end time. Mark how many minutes it took.
    goals:
    - prompt: A bus leaves at 9:15 and arrives at 11:45.
      target: 150
      mistakes:
      - when:
          v: 120
        say: That's just the 2 whole hours. There are 30 more minutes.
      - when:
          v: 130
        say: 'Count up: 9:15 to 11:15 is 2 hours (120 minutes), then 30 more.'
    - prompt: A film starts at 10:40 and ends at 12:10.
      target: 90
      mistakes:
      - when:
          v: 130
        say: 12:10 − 10:40 like ordinary numbers gives 1:70, but an hour has only 60 minutes. Count up instead.
    - prompt: A class starts at 3:50 and ends at 4:25.
      target: 35
      mistakes:
      - when:
          v: 75
        say: 425 − 350 = 75 treats an hour as 100 minutes. 3:50 to 4:00 is 10, then 25 more.
  items:
  - prompt: A class starts at 9:15 and ends at 10:00. How many minutes is it?
    answer: '45'
    check: 60-15
    difficulty: 1
    hints:
    - Count up from 9:15 to 10:00.
    - 60 − 15.
    solution: From 9:15 to 10:00 is 45 minutes.
    mistakes:
      '85': c5_time_units
  - prompt: A film starts at 3:30 p.m. and ends at 5:45 p.m. How many minutes does it last?
    answer: '135'
    check: 2*60+15
    difficulty: 2
    hints:
    - 3:30 to 5:30 is 2 hours.
    - Plus 15 minutes.
    solution: 2 hours 15 minutes = 120 + 15 = 135 minutes.
    mistakes: {"215": "m5_time_minutes", "95": "m5_time_minutes"}
  - prompt: What is 15:00 on the 24-hour clock?
    options:
    - 3 p.m.
    - 3 a.m.
    - 5 p.m.
    - 1 p.m.
    answer: 3 p.m.
    difficulty: 1
    hints:
    - Subtract 12 for p.m.
    - 15 − 12 = 3.
    solution: 15:00 is 3 p.m.
    mistakes: {"5 p.m.": "m5_24h"}
  - prompt: 45 minutes + 30 minutes is 1 hour and how many minutes?
    answer: '15'
    check: 45+30-60
    difficulty: 2
    hints:
    - 45 + 30 = 75.
    - 75 − 60.
    solution: 75 minutes = 1 hour 15 minutes.
    mistakes:
      '75': c5_time_units
  - prompt: A bus leaves at 7:50 a.m. and reaches school at 8:25 a.m. How many minutes?
    answer: '35'
    check: 10+25
    difficulty: 2
    hints:
    - 7:50 to 8:00 is 10 minutes.
    - 8:00 to 8:25 is 25.
    solution: 10 + 25 = 35 minutes.
    mistakes:
      '75': c5_time_units
  - prompt: A runner does 3 laps taking 50 seconds each. How many seconds in all?
    answer: '150'
    check: 50*3
    difficulty: 1
    hints:
    - 50 × 3.
    - Add three 50s.
    solution: 50 × 3 = 150 seconds.
    mistakes: {"53": "m5_times_carry", "100": "m5_times_carry"}
