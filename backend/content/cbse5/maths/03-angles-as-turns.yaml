# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 3
title: Angles as Turns
tips:
  c5_turns: A full turn is 360°, a half turn 180°, a quarter turn 90°. Count how many quarter turns you made.
  m5_acute: "A right angle is 90°. Is 40° smaller or bigger than that?"
  m5_acute_clock: "An acute angle is smaller than the 3 o'clock corner. Which time has hands closest together?"
  m5_clockwise: "Clockwise goes the way clock hands move: from North (12) to the right."
  m5_half_turn: "12 to 3 is a quarter. 12 to 6 is how many quarters?"
  m5_obtuse: "Is 120° more or less than a right angle (90°)?"
  m5_quarters: "Turn round once using quarter turns: North, East, South, West, back to North. Count the turns."
  m5_right_3: "At 3 o'clock the hands make the corner of a square."
  m5_straight: "At 6 o'clock the two hands point opposite ways and make one straight line."
  m5_two_right: "90° + 90° = ? A straight angle is 180°."
concepts:
- code: cbse5m.ang.turns
  title: Turns and right angles
  notes: |
    An angle shows how much something turns. A full turn (back to the start) = 360°; a half turn = 180°; a quarter turn
    = 90°, a right angle (like the corner of a book). Clock hands: from 12 to 3 is a quarter turn. Turning clockwise
    goes the same way as clock hands; anticlockwise the other way. Facing North, a quarter turn clockwise faces East.
  explanations:
    text: 'When you turn around, you make an angle. Turn all the way back to where you started: that is a full turn. Turn to face behind you: half a turn. Turn to face your right side: a quarter turn, which is a right angle.'
    visual: 'Stand facing the board. Turn to face the right wall: quarter turn. Turn again to face the back wall: half turn. Again: three quarters. Again: you are back, a full turn.'
    step_by_step: 'Step 1: Find where you start and where you stop. Step 2: Count the quarter turns between them. Step 3: Each quarter turn is 90°.'
    real_world: A door opening wide, the hands of a clock, and turning left or right at a road corner are all turns.
  picture:
    kind: flow
    steps:
    - Facing North
    - ¼ turn clockwise → East (90°)
    - ½ turn → South (180°)
    - ¾ turn → West (270°)
    - Full turn → North (360°)
    alt: 'Turning clockwise from North in quarter turns: East at 90°, South at 180°, West at 270°, back to North at 360°.'
  activity:
    type: angle
    prompt: Turn the arm to show each turn.
    goals:
    - prompt: A quarter turn.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: 'That''s half a turn: you''d be facing behind you.'
      - when:
          degrees: 45
        say: Only half of a quarter. A quarter turn makes a square corner.
    - prompt: A half turn.
      degrees: 180
      mistakes:
      - when:
          degrees: 90
        say: That's a quarter. Half a turn faces behind you.
      - when:
          degrees: 360
        say: That's all the way round, back to the start.
    - prompt: Three quarters of a turn.
      degrees: 270
      mistakes:
      - when:
          degrees: 180
        say: That's two quarters. One more quarter.
      - when:
          degrees: 90
        say: That's one quarter. You need three.
  items:
  - prompt: How much is a quarter turn?
    options:
    - 90°
    - 180°
    - 360°
    - 45°
    answer: 90°
    difficulty: 1
    hints:
    - A full turn is 360°.
    - 360 ÷ 4.
    solution: A quarter turn is 360° ÷ 4 = 90°.
    mistakes:
      360°: c5_turns
  - prompt: How many degrees is a half turn?
    answer: '180'
    check: 360/2
    difficulty: 1
    hints:
    - Half of 360.
    - 360 ÷ 2.
    solution: Half of 360° is 180°.
    mistakes:
      '90': c5_turns
  - prompt: You face North and make a quarter turn clockwise. Which way do you face now?
    options:
    - East
    - West
    - South
    - North
    answer: East
    difficulty: 1
    hints:
    - Clockwise goes like clock hands.
    - North → East.
    solution: A quarter turn clockwise from North faces East.
    mistakes: {"West": "m5_clockwise"}
  - prompt: The minute hand moves from 12 to 6. What turn is that?
    options:
    - Half turn
    - Quarter turn
    - Full turn
    - Three-quarter turn
    answer: Half turn
    difficulty: 1
    hints:
    - 6 is opposite 12.
    - Halfway round.
    solution: '12 to 6 is half way round: a half turn.'
    mistakes: {"Quarter turn": "m5_half_turn"}
  - prompt: How many quarter turns make a full turn?
    answer: '4'
    check: 360/90
    difficulty: 1
    hints:
    - 360 ÷ 90.
    - North, East, South, West, North.
    solution: 4 quarter turns make a full turn.
    mistakes: {"2": "m5_quarters", "3": "m5_quarters"}
  - prompt: How many degrees are three quarter turns?
    answer: '270'
    check: 3*90
    difficulty: 2
    hints:
    - One quarter turn is 90°.
    - 3 × 90.
    solution: 3 × 90° = 270°.
    mistakes:
      '90': c5_turns
- code: cbse5m.ang.types
  title: Kinds of angles
  after:
  - cbse5m.ang.turns
  notes: |
    Compare an angle with a right angle (90°): smaller is acute, exactly 90° is right, bigger than 90° but less than 180°
    is obtuse, 180° is straight. Check with the corner of a paper. At 3 o'clock the clock hands make a right angle; at
    1 o'clock an acute angle; at 5 o'clock an obtuse angle; at 6 o'clock a straight angle.
  explanations:
    text: Use the corner of a page as your tester. If the angle fits inside the corner, it is acute (sharp). If it fits exactly, it is a right angle. If it is wider than the corner but not flat, it is obtuse. A flat line is a straight angle.
    visual: 'Draw a right angle like an L. Draw a narrow V inside it: acute. Draw a wide open angle outside it: obtuse. Draw a flat line: straight.'
    step_by_step: 'Step 1: Place the paper corner on the angle. Step 2: Smaller → acute, same → right, bigger → obtuse. Step 3: Flat line → straight (180°).'
    real_world: Scissors open a little make an acute angle; a laptop opened wide makes an obtuse angle; the corner of a door frame is a right angle.
  picture:
    kind: compare
    columns:
    - title: Acute
      points:
      - less than 90°
      - 1 o'clock hands
    - title: Right
      points:
      - exactly 90°
      - 3 o'clock hands
    - title: Obtuse
      points:
      - between 90° and 180°
      - 5 o'clock hands
    alt: Acute angles are less than 90°, right angles are exactly 90°, and obtuse angles are between 90° and 180°.
  activity:
    type: sort
    prompt: Is the angle sharp, a square corner, or wide?
    bins:
    - Acute
    - Right angle
    - Obtuse
    items:
    - label: Scissors opened a little
      bin: Acute
      clue: Smaller than the corner of a page?
      why: 'Sharp: acute.'
    - label: The tip of a pizza slice
      bin: Acute
      clue: Very pointy.
      why: Acute.
    - label: Clock hands at 2 o'clock
      bin: Acute
      clue: The hands are close.
      why: '60°: acute.'
    - label: The corner of a book
      bin: Right angle
      clue: Does a page corner fit exactly?
      why: 90°.
    - label: Clock hands at 3 o'clock
      bin: Right angle
      clue: A quarter of the way round.
      why: 90°.
    - label: Clock hands at 4 o'clock
      bin: Obtuse
      clue: Wider than a page corner, less than a straight line.
      why: '120°: obtuse.'
    - label: A door opened wide
      bin: Obtuse
      clue: Wider than a square corner.
      why: Obtuse.
    - label: A reclining chair's back
      bin: Obtuse
      clue: Leans back past upright.
      why: Obtuse.
  items:
  - prompt: 'An angle of 40° is:'
    options:
    - acute
    - right
    - obtuse
    - straight
    answer: acute
    difficulty: 1
    hints:
    - Is it less than 90°?
    - Yes.
    solution: 40° is less than 90°, so it is acute.
    mistakes: {"obtuse": "m5_acute"}
  - prompt: What angle do the clock hands make at 3 o'clock?
    options:
    - right angle
    - acute angle
    - obtuse angle
    - straight angle
    answer: right angle
    difficulty: 1
    hints:
    - 12 to 3 is a quarter turn.
    - Quarter turn = 90°.
    solution: 'At 3 o''clock the hands make a quarter turn: a right angle.'
    mistakes: {"acute angle": "m5_right_3"}
  - prompt: 'An angle of 120° is:'
    options:
    - obtuse
    - acute
    - right
    - straight
    answer: obtuse
    difficulty: 1
    hints:
    - More than 90° but less than 180°?
    - Yes.
    solution: '120° is between 90° and 180°: obtuse.'
    mistakes: {"acute": "m5_obtuse"}
  - prompt: What angle do the clock hands make at 6 o'clock?
    options:
    - straight angle
    - right angle
    - acute angle
    - obtuse angle
    answer: straight angle
    difficulty: 1
    hints:
    - The hands point in opposite directions.
    - They make a line.
    solution: 'At 6 o''clock the hands make a straight line: 180°.'
    mistakes: {"right angle": "m5_straight"}
  - prompt: Which of these is an acute angle?
    options:
    - the hands at 1 o'clock
    - the hands at 3 o'clock
    - the hands at 5 o'clock
    - the hands at 6 o'clock
    answer: the hands at 1 o'clock
    difficulty: 2
    hints:
    - Acute is smaller than a right angle.
    - 1 o'clock hands are close together.
    solution: 'At 1 o''clock the hands are close together: acute.'
    mistakes: {"the hands at 5 o'clock": "m5_acute_clock"}
  - prompt: How many right angles make a straight angle?
    answer: '2'
    check: 180/90
    difficulty: 2
    hints:
    - Straight is 180°.
    - 180 ÷ 90.
    solution: 180° ÷ 90° = 2 right angles.
    mistakes: {"4": "m5_two_right", "1": "m5_two_right"}
