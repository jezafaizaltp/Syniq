# CBSE Class 5 Mathematics (NCERT Maths Mela, 2025-26), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse5-math
chapter: 3
title: Angles as Turns
tips:
  c5_turns: "A full turn is four quarter turns, and it is 360°. Work out one quarter turn first, then count how many quarter turns you need."
  m5_acute: "A right angle is 90°. Is 40° smaller or bigger than that?"
  m5_acute_clock: "An acute angle is smaller than the 3 o'clock corner. Which time has hands closest together?"
  m5_clockwise: "Clockwise goes the way clock hands move: from North (12) to the right."
  m5_half_turn: "12 to 3 is a quarter. 12 to 6 is how many quarters?"
  m5_obtuse: "Is 120° more or less than a right angle (90°)?"
  m5_quarters: "Turn round once using quarter turns: North, East, South, West, back to North. Count the turns."
  m5_right_3: "At 3 o'clock the hands make the corner of a square."
  m5_straight: "At 6 o'clock the two hands point opposite ways and make one straight line."
  m5_two_right: "90° + 90° = ? A straight angle is 180°."
  c5m3_turn: 'Remember the three key turns: a full turn, a half turn and a quarter turn. Each is half of the one before.'
  c5m3_dir: 'Stand up and try it: face the starting direction and turn the way the clock hands move.'
  c5m3_type: Compare with the corner of a page. Smaller than the corner, exactly the corner, or wider?
  c5m3_clock: Picture the two hands. How many 'hour gaps' apart are they? Each gap is 30°.
concepts:
- code: cbse5m.ang.turns
  title: Turns and right angles
  notes: |
    An angle shows how much something turns. A full turn (back to the start) = 360°; a half turn = 180°; a quarter turn
    = 90°, a right angle (like the corner of a book). Clock hands: from 12 to 3 is a quarter turn. Turning clockwise
    goes the same way as clock hands; anticlockwise the other way. Facing North, a quarter turn clockwise faces East.
  explanations:
    text: 'When you turn around, you make an angle. Turn all the way back to where you started: that is a full turn. Turn to face behind you: half a turn. Turn to face your right side: a quarter turn, which is a right angle.'
    visual: 'Stand facing the board. Turn to face the right wall: quarter turn. Turn again to face the back wall: half turn. Again: three quarters. Again: you are back, a full turn.'
    step_by_step: 'Step 1: Find where you start and where you stop. Step 2: Count the quarter turns between them. Step 3: Each quarter turn is 90°.'
    real_world: A door opening wide, the hands of a clock, and turning left or right at a road corner are all turns.
  picture:
    kind: flow
    steps:
    - Facing North
    - ¼ turn clockwise → East (90°)
    - ½ turn → South (180°)
    - ¾ turn → West (270°)
    - Full turn → North (360°)
    alt: 'Turning clockwise from North in quarter turns: East at 90°, South at 180°, West at 270°, back to North at 360°.'
  activity:
    type: angle
    prompt: Turn the arm to show each turn.
    goals:
    - prompt: A quarter turn.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: 'That''s half a turn: you''d be facing behind you.'
      - when:
          degrees: 45
        say: Only half of a quarter. A quarter turn makes a square corner.
    - prompt: A half turn.
      degrees: 180
      mistakes:
      - when:
          degrees: 90
        say: That's a quarter. Half a turn faces behind you.
      - when:
          degrees: 360
        say: That's all the way round, back to the start.
    - prompt: Three quarters of a turn.
      degrees: 270
      mistakes:
      - when:
          degrees: 180
        say: That's two quarters. One more quarter.
      - when:
          degrees: 90
        say: That's one quarter. You need three.
  lesson:
    - teach: An angle tells how much something turns. Turning all the way round back to the start is a full turn, 360°. Half of that is a half turn, 180°, so you face the opposite way.
      check:
        prompt: You face the door and make a half turn. Where do you face?
        options:
        - Away from the door
        - The door again
        - To your right
        answer: Away from the door
        why: A half turn makes you face the opposite way.
      ways:
      - style: visual
        teach: Full, half and quarter turns, and how many degrees each one is.
        picture:
          kind: flow
          steps:
          - 'Full turn: back to the start, 360°'
          - 'Half turn: face the opposite way, 180°'
          - 'Quarter turn: a right angle, 90°'
          alt: A full turn takes you back to the start and is 360 degrees. A half turn makes you face the opposite way and is 180 degrees. A quarter turn is a right angle, 90 degrees.
      - style: real_world
        teach: 'A skater spins once all the way round and ends up facing the crowd again: that is a full turn. A child playing statue who turns to face the person behind is making a half turn.'
    - teach: 'A quarter turn is a quarter of a full turn: 360 ÷ 4 = 90°. This is a right angle, like the corner of a book. On a clock, the minute hand moving from 12 to 3 makes a quarter turn.'
      picture:
        kind: flow
        steps:
        - Full turn 360°
        - Half turn 180°
        - Quarter turn 90°
        alt: 'Each turn is half of the one before: 360°, 180°, 90°.'
      check:
        prompt: How many degrees is a quarter turn?
        options:
        - '90'
        - '45'
        - '180'
        answer: '90'
        why: 360 ÷ 4 = 90.
      ways:
      - style: step_by_step
        teach: 'Step 1: Stand facing the board. Step 2: Turn until you face the wall on your right. Step 3: You have made a quarter turn, 90°. Step 4: Turn the same way again: now you face the back of the room, a half turn from where you started.'
      - style: real_world
        teach: A door that opens from shut to wide against the wall usually swings through about a quarter turn. Its corner with the wall is a right angle.
    - teach: Clockwise means turning the same way as clock hands. Anticlockwise is the other way. Facing North, a quarter turn clockwise takes you to East; a quarter turn anticlockwise takes you to West.
      check:
        prompt: Facing North, you turn a quarter turn anticlockwise. Which way do you face?
        options:
        - West
        - East
        - South
        answer: West
        why: Anticlockwise from North goes to West first.
      ways:
      - style: visual
        teach: Clockwise and anticlockwise quarter turns from North.
        picture:
          kind: compare
          columns:
          - title: Clockwise from North
            points:
            - '1 quarter turn: East'
            - '2 quarter turns: South'
          - title: Anticlockwise from North
            points:
            - '1 quarter turn: West'
            - '2 quarter turns: South'
          alt: Facing North, one quarter turn clockwise gives East and two give South. One quarter turn anticlockwise gives West and two give South.
      - style: real_world
        teach: When you tighten a bottle cap you usually turn it clockwise, and to open it you turn it anticlockwise. Try it with a bottle at home.
  items:
  - prompt: How much is a quarter turn?
    options:
    - 90°
    - 180°
    - 360°
    - 45°
    answer: 90°
    difficulty: 1
    hints:
    - A full turn is 360°.
    - 360 ÷ 4.
    solution: A quarter turn is 360° ÷ 4 = 90°.
    mistakes:
      360°: c5_turns
  - prompt: How many degrees is a half turn?
    answer: '180'
    check: 360/2
    difficulty: 1
    hints:
    - Half of 360.
    - 360 ÷ 2.
    solution: Half of 360° is 180°.
    mistakes:
      '90': c5_turns
  - prompt: You face North and make a quarter turn clockwise. Which way do you face now?
    options:
    - East
    - West
    - South
    - North
    answer: East
    difficulty: 1
    hints:
    - Clockwise goes like clock hands.
    - North → East.
    solution: A quarter turn clockwise from North faces East.
    mistakes: {"West": "m5_clockwise"}
  - prompt: The minute hand moves from 12 to 6. What turn is that?
    options:
    - Half turn
    - Quarter turn
    - Full turn
    - Three-quarter turn
    answer: Half turn
    difficulty: 1
    hints:
    - 6 is opposite 12.
    - Halfway round.
    solution: '12 to 6 is half way round: a half turn.'
    mistakes: {"Quarter turn": "m5_half_turn"}
  - prompt: How many quarter turns make a full turn?
    answer: '4'
    check: 360/90
    difficulty: 1
    hints:
    - 360 ÷ 90.
    - North, East, South, West, North.
    solution: 4 quarter turns make a full turn.
    mistakes: {"2": "m5_quarters", "3": "m5_quarters"}
  - prompt: How many degrees are three quarter turns?
    answer: '270'
    check: 3*90
    difficulty: 2
    hints:
    - One quarter turn is 90°.
    - 3 × 90.
    solution: 3 × 90° = 270°.
    mistakes:
      '90': c5_turns
  - prompt: How many degrees is a full turn?
    answer: '360'
    check: '360'
    difficulty: 1
    hints:
    - A full turn is four quarter turns.
    - Each quarter turn is 90°.
    solution: 'Step 1: 4 quarter turns. Step 2: 4 × 90 = 360°.'
    mistakes:
      '180': c5m3_turn
      '100': c5m3_turn
      '90': c5m3_turn
  - prompt: How many half turns make a full turn?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - A half turn is 180°.
    - How many 180s make 360?
    solution: 'Step 1: 360 ÷ 180. Step 2: = 2.'
    mistakes:
      '4': c5m3_turn
      '3': c5m3_turn
  - prompt: Facing East, you make a half turn. Which way do you face?
    options:
    - West
    - North
    - South
    answer: West
    difficulty: 2
    hints:
    - A half turn faces the opposite way.
    - What is opposite East?
    solution: 'Step 1: a half turn = opposite direction. Step 2: opposite of East is West.'
    mistakes:
      North: c5m3_dir
      South: c5m3_dir
  - prompt: Facing South, you make a quarter turn clockwise. Which way do you face?
    options:
    - West
    - East
    - North
    answer: West
    difficulty: 3
    hints:
    - Clockwise goes N → E → S → W.
    - What comes after South?
    solution: 'Step 1: clockwise order is N, E, S, W. Step 2: after South comes West.'
    mistakes:
      East: c5m3_dir
      North: c5m3_dir
  - prompt: The minute hand moves from 12 to 9. How many degrees has it turned?
    answer: '270'
    check: 90*3
    difficulty: 2
    hints:
    - 12 to 3 is one quarter turn.
    - Count the quarter turns from 12 to 9.
    solution: 'Step 1: 12→3→6→9 is 3 quarter turns. Step 2: 3 × 90 = 270°.'
    mistakes:
      '90': c5m3_dir
      '180': c5m3_turn
      '9': c5m3_clock
  - prompt: How many degrees is two quarter turns?
    answer: '180'
    check: 2*90
    difficulty: 1
    hints:
    - Each quarter turn is 90°.
    - Add two of them.
    solution: 'Step 1: 90 + 90. Step 2: = 180°, a half turn.'
    mistakes:
      '90': c5m3_turn
      '360': c5m3_turn
  - prompt: Which way do clock hands turn?
    options:
    - Clockwise
    - Anticlockwise
    - Both ways
    answer: Clockwise
    difficulty: 1
    hints:
    - The name of the direction comes from the clock.
    - Hands go 12, 1, 2, 3...
    solution: 'Step 1: clock hands go 12, 1, 2, 3. Step 2: that direction is called clockwise.'
    mistakes:
      Anticlockwise: c5m3_dir
      Both ways: c5m3_dir
  - prompt: The minute hand goes from 3 to 6. What kind of turn is that?
    options:
    - Quarter turn
    - Half turn
    - Full turn
    answer: Quarter turn
    difficulty: 2
    hints:
    - Count the hours between 3 and 6.
    - 12 to 3 is also 3 hours apart.
    solution: 'Step 1: 3 to 6 is 3 hour-gaps, like 12 to 3. Step 2: that is a quarter turn.'
    mistakes:
      Half turn: c5m3_clock
      Full turn: c5m3_clock
  - prompt: How many degrees does the minute hand turn in 15 minutes?
    answer: '90'
    check: 360//4
    difficulty: 3
    hints:
    - In 60 minutes it makes a full turn.
    - 15 minutes is a quarter of an hour.
    solution: 'Step 1: 15 minutes = 1/4 hour. Step 2: 1/4 of 360° = 90°.'
    mistakes:
      '15': c5m3_clock
      '180': c5m3_turn
      '45': c5m3_turn
  - prompt: 'Case: A robot faces West. It makes one quarter turn clockwise, then one more quarter turn clockwise. Which way does it face now?'
    options:
    - East
    - North
    - South
    answer: East
    hints:
    - Two quarter turns make what kind of turn?
    - What is opposite to West?
    solution: Two quarter turns make a half turn. A half turn makes you face the opposite way, so the robot faces East.
    mistakes:
      North: c5m3_dir
      South: c5m3_dir
    exam: case
    difficulty: 2
  - prompt: 'Situation: The minute hand of a clock moves from 12 to 3 and then from 3 to 9. How many degrees has it turned in all?'
    options:
    - 270°
    - 180°
    - 90°
    answer: 270°
    hints:
    - 12 to 3 is what kind of turn?
    - 3 to 9 is what kind of turn?
    solution: 12 to 3 is a quarter turn, 90°. 3 to 9 is a half turn, 180°. In all 90° + 180° = 270°.
    mistakes:
      180°: c5m3_turn
      90°: c5m3_turn
    exam: competency
    difficulty: 2
- code: cbse5m.ang.types
  title: Kinds of angles
  after:
  - cbse5m.ang.turns
  notes: |
    Compare an angle with a right angle (90°): smaller is acute, exactly 90° is right, bigger than 90° but less than 180°
    is obtuse, 180° is straight. Check with the corner of a paper. At 3 o'clock the clock hands make a right angle; at
    1 o'clock an acute angle; at 5 o'clock an obtuse angle; at 6 o'clock a straight angle.
  explanations:
    text: Use the corner of a page as your tester. If the angle fits inside the corner, it is acute (sharp). If it fits exactly, it is a right angle. If it is wider than the corner but not flat, it is obtuse. A flat line is a straight angle.
    visual: 'Draw a right angle like an L. Draw a narrow V inside it: acute. Draw a wide open angle outside it: obtuse. Draw a flat line: straight.'
    step_by_step: 'Step 1: Place the paper corner on the angle. Step 2: Smaller → acute, same → right, bigger → obtuse. Step 3: Flat line → straight (180°).'
    real_world: Scissors open a little make an acute angle; a laptop opened wide makes an obtuse angle; the corner of a door frame is a right angle.
  picture:
    kind: compare
    columns:
    - title: Acute
      points:
      - less than 90°
      - 1 o'clock hands
    - title: Right
      points:
      - exactly 90°
      - 3 o'clock hands
    - title: Obtuse
      points:
      - between 90° and 180°
      - 5 o'clock hands
    alt: Acute angles are less than 90°, right angles are exactly 90°, and obtuse angles are between 90° and 180°.
  activity:
    type: sort
    prompt: Is the angle sharp, a square corner, or wide?
    bins:
    - Acute
    - Right angle
    - Obtuse
    items:
    - label: Scissors opened a little
      bin: Acute
      clue: Smaller than the corner of a page?
      why: 'Sharp: acute.'
    - label: The tip of a pizza slice
      bin: Acute
      clue: Very pointy.
      why: Acute.
    - label: Clock hands at 2 o'clock
      bin: Acute
      clue: The hands are close.
      why: '60°: acute.'
    - label: The corner of a book
      bin: Right angle
      clue: Does a page corner fit exactly?
      why: 90°.
    - label: Clock hands at 3 o'clock
      bin: Right angle
      clue: A quarter of the way round.
      why: 90°.
    - label: Clock hands at 4 o'clock
      bin: Obtuse
      clue: Wider than a page corner, less than a straight line.
      why: '120°: obtuse.'
    - label: A door opened wide
      bin: Obtuse
      clue: Wider than a square corner.
      why: Obtuse.
    - label: A reclining chair's back
      bin: Obtuse
      clue: Leans back past upright.
      why: Obtuse.
  lesson:
    - teach: We name angles by comparing them with a right angle (90°), the corner of a page. An angle smaller than a right angle is acute. An angle of exactly 90° is a right angle.
      check:
        prompt: 'An angle of 30° is:'
        options:
        - Acute
        - Right
        - Obtuse
        answer: Acute
        why: 30° is smaller than 90°.
      ways:
      - style: visual
        teach: Sorting angles by comparing them with a right angle.
        picture:
          kind: compare
          columns:
          - title: Smaller than 90°
            points:
            - Acute
            - A slice of pizza tip
          - title: Exactly 90°
            points:
            - Right angle
            - The corner of a page
          alt: An angle smaller than 90 degrees is acute, like the tip of a pizza slice. An angle of exactly 90 degrees is a right angle, like the corner of a page.
      - style: step_by_step
        teach: 'Step 1: Fold a sheet of paper in half and then in half again to make a right-angle tester. Step 2: Put its corner into the angle you want to check. Step 3: If the angle hides inside the corner, it is acute. Step 4: If it fits the corner exactly, it is a right angle.'
    - teach: An angle bigger than a right angle but smaller than a straight line is obtuse (between 90° and 180°). A straight angle is exactly 180°, a straight line.
      picture:
        kind: compare
        columns:
        - title: Smaller or equal to 90°
          points:
          - 'Acute: less than 90°'
          - 'Right: exactly 90°'
        - title: Bigger than 90°
          points:
          - 'Obtuse: 90° to 180°'
          - 'Straight: exactly 180°'
        alt: Acute and right angles are up to 90°; obtuse and straight angles are bigger.
      check:
        prompt: 'An angle of 150° is:'
        options:
        - Obtuse
        - Acute
        - Straight
        answer: Obtuse
        why: 150° is more than 90° but less than 180°.
      ways:
      - style: step_by_step
        teach: 'Step 1: Is the angle wider than the corner of a page? Step 2: If yes, is it less than a straight line? Then it is obtuse. Step 3: If it is a flat straight line, it is a straight angle, 180°.'
      - style: real_world
        teach: A laptop opened a little way back past upright makes an obtuse angle with the keyboard. A book lying open flat on a table makes a straight angle.
    - teach: 'Clock hands make angles too. Each hour gap is 30° (360 ÷ 12). At 2 o''clock the hands are 2 gaps apart: 60°, acute. At 4 o''clock they are 4 gaps apart: 120°, obtuse.'
      check:
        prompt: What angle do the hands make at 2 o'clock?
        options:
        - 60°
        - 20°
        - 120°
        answer: 60°
        why: 2 gaps × 30° = 60°.
      ways:
      - style: visual
        teach: Clock hands every hour, measured in 30° gaps.
        picture:
          kind: bars
          unit: °
          bars:
          - label: 1 o'clock
            value: 30
          - label: 2 o'clock
            value: 60
          - label: 4 o'clock
            value: 120
          alt: The angle between the clock hands at 1 o'clock is 30 degrees, at 2 o'clock 60 and at 4 o'clock 120.
      - style: real_world
        teach: A clock face is a full turn of 360° shared into 12 equal hour gaps. So each gap is 360 ÷ 12 = 30°. Count the gaps between the hands and multiply by 30.
  items:
  - prompt: 'An angle of 40° is:'
    options:
    - acute
    - right
    - obtuse
    - straight
    answer: acute
    difficulty: 1
    hints:
    - Is it less than 90°?
    - Yes.
    solution: 40° is less than 90°, so it is acute.
    mistakes: {"obtuse": "m5_acute"}
  - prompt: What angle do the clock hands make at 3 o'clock?
    options:
    - right angle
    - acute angle
    - obtuse angle
    - straight angle
    answer: right angle
    difficulty: 1
    hints:
    - 12 to 3 is a quarter turn.
    - Quarter turn = 90°.
    solution: 'At 3 o''clock the hands make a quarter turn: a right angle.'
    mistakes: {"acute angle": "m5_right_3"}
  - prompt: 'An angle of 120° is:'
    options:
    - obtuse
    - acute
    - right
    - straight
    answer: obtuse
    difficulty: 1
    hints:
    - More than 90° but less than 180°?
    - Yes.
    solution: '120° is between 90° and 180°: obtuse.'
    mistakes: {"acute": "m5_obtuse"}
  - prompt: What angle do the clock hands make at 6 o'clock?
    options:
    - straight angle
    - right angle
    - acute angle
    - obtuse angle
    answer: straight angle
    difficulty: 1
    hints:
    - The hands point in opposite directions.
    - They make a line.
    solution: 'At 6 o''clock the hands make a straight line: 180°.'
    mistakes: {"right angle": "m5_straight"}
  - prompt: Which of these is an acute angle?
    options:
    - the hands at 1 o'clock
    - the hands at 3 o'clock
    - the hands at 5 o'clock
    - the hands at 6 o'clock
    answer: the hands at 1 o'clock
    difficulty: 2
    hints:
    - Acute is smaller than a right angle.
    - 1 o'clock hands are close together.
    solution: 'At 1 o''clock the hands are close together: acute.'
    mistakes: {"the hands at 5 o'clock": "m5_acute_clock"}
  - prompt: How many right angles make a straight angle?
    answer: '2'
    check: 180/90
    difficulty: 2
    hints:
    - Straight is 180°.
    - 180 ÷ 90.
    solution: 180° ÷ 90° = 2 right angles.
    mistakes: {"4": "m5_two_right", "1": "m5_two_right"}
  - prompt: 'An angle of 90° is called:'
    options:
    - A right angle
    - An acute angle
    - A straight angle
    answer: A right angle
    difficulty: 1
    hints:
    - It is the corner of a book.
    - It is a quarter turn.
    solution: 'Step 1: 90° is a quarter turn. Step 2: it is called a right angle.'
    mistakes:
      An acute angle: c5m3_type
      A straight angle: c5m3_type
  - prompt: 'An angle of 179° is:'
    options:
    - Obtuse
    - Straight
    - Acute
    answer: Obtuse
    difficulty: 2
    hints:
    - Is it exactly 180°?
    - It is more than 90° but not quite 180°.
    solution: 'Step 1: 179 is between 90 and 180. Step 2: so it is obtuse.'
    mistakes:
      Straight: c5m3_type
      Acute: c5m3_type
  - prompt: How many degrees apart are the clock hands at 4 o'clock?
    answer: '120'
    check: 4*30
    difficulty: 2
    hints:
    - Each hour gap is 30°.
    - Count the gaps from 12 to 4.
    solution: 'Step 1: 4 gaps. Step 2: 4 × 30 = 120°.'
    mistakes:
      '40': c5m3_clock
      '90': c5m3_clock
      '4': c5m3_clock
  - prompt: What kind of angle do the hands make at 5 o'clock?
    options:
    - Obtuse
    - Acute
    - Right
    answer: Obtuse
    difficulty: 2
    hints:
    - 5 gaps × 30° = ?
    - Compare that with 90°.
    solution: 'Step 1: 5 × 30 = 150°. Step 2: 150° is obtuse.'
    mistakes:
      Acute: c5m3_clock
      Right: c5m3_clock
  - prompt: At which time do the clock hands make a right angle?
    options:
    - 9 o'clock
    - 6 o'clock
    - 1 o'clock
    answer: 9 o'clock
    difficulty: 2
    hints:
    - A right angle is 3 hour gaps.
    - Count 3 gaps from 12 the other way.
    solution: 'Step 1: 90° = 3 gaps. Step 2: from 12 back to 9 is 3 gaps.'
    mistakes:
      6 o'clock: c5m3_clock
      1 o'clock: c5m3_clock
  - prompt: The corner of a door is which kind of angle?
    options:
    - Right angle
    - Obtuse angle
    - Straight angle
    answer: Right angle
    difficulty: 1
    hints:
    - Doors are square at the corners.
    - It looks like the corner of a page.
    solution: 'Step 1: the door corner matches a page corner. Step 2: that is a right angle.'
    mistakes:
      Obtuse angle: c5m3_type
      Straight angle: c5m3_type
  - prompt: How many acute angles of 45° make a right angle?
    answer: '2'
    check: 90//45
    difficulty: 3
    hints:
    - A right angle is 90°.
    - How many 45s make 90?
    solution: 'Step 1: 90 ÷ 45. Step 2: = 2.'
    mistakes:
      '4': c5m3_turn
      '3': c5m3_turn
  - prompt: Which of these angles is the widest?
    options:
    - A straight angle
    - A right angle
    - An acute angle
    answer: A straight angle
    difficulty: 2
    hints:
    - Put them in order of size.
    - 180° is bigger than 90°.
    solution: 'Step 1: acute < 90°, right = 90°, straight = 180°. Step 2: the straight angle is widest.'
    mistakes:
      A right angle: c5m3_type
      An acute angle: c5m3_type
  - prompt: 'An open book makes an angle a bit wider than the corner of a page. That angle is:'
    options:
    - Obtuse
    - Acute
