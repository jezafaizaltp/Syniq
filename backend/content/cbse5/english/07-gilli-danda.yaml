# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 7. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 7
title: 'Gilli Danda (Unit 4: Ups and Downs)'
tips:
  e5_play_joy: "Children playing outdoors with friends. How do they feel?"
  e5_re: "The prefix 're-' means again."
  e5_tipcat: "You tip the small 'cat' (gilli) into the air with a stick."
  c5e7_game: 'Picture the game: one long piece of wood and one short piece. What happens when you strike?'
  c5e7_prefix: Cover the first part of the word and look at the rest. What does the front part add?
  c5e7_own: Ask who owns the thing. Then pick the word that shows that owner.
  c5e7_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?

concepts:
- code: cbse5e.u4.gillidanda
  title: 'Gilli Danda (Unit 4: Ups and Downs)'
  notes: |
    A poem about children gathering in the playground to play gilli danda, played with a long stick (danda) and a small
    peg (gilli). They hit the gilli so it flies high into the blue sky, and they feel free and joyful under the sun. In
    English the game is called tip-cat. Language work: prefixes un- (not: unhappy) and re- (again: replay); possessive
    pronouns (mine, yours, his, hers, ours, theirs); synonyms and antonyms. Words: gather, gilli, quit, underneath.
  explanations:
    text: The poem is about children playing gilli danda outdoors. They strike the small gilli with the long danda and watch it fly into the blue sky. Playing together under the sun makes them feel free and happy.
    visual: Draw a child swinging a long stick at a small pointed peg that is flying up into a blue sky, with friends cheering.
    step_by_step: '1. What game is it? Gilli danda. 2. What do you need? A stick and a small peg. 3. How do the children feel? Free and joyful. 4. Learn: un- means not, re- means again.'
    real_world: Gilli danda is an old Indian street game, played long before cricket became popular.
  picture:
    kind: compare
    columns:
    - title: Prefix un- (not)
      points:
      - unhappy
      - unkind
      - unsafe
    - title: Prefix re- (again)
      points:
      - replay
      - rewrite
      - retell
    alt: The prefix un- means not, as in unhappy, unkind and unsafe; the prefix re- means again, as in replay, rewrite and retell.
  activity:
    type: sort
    prompt: 'Gilli Danda: un- or re-?'
    bins:
    - un- (not)
    - re- (again)
    items:
    - label: happy → ___happy
      bin: un- (not)
      clue: Not happy.
      why: 'un + happy = unhappy: not happy.'
    - label: play → ___play
      bin: re- (again)
      clue: Play again.
      why: 're + play = replay: play again.'
    - label: tie → ___tie
      bin: un- (not)
      clue: Undo a knot.
      why: 'untie: the opposite of tie.'
    - label: write → ___write
      bin: re- (again)
      clue: Write it again.
      why: 'rewrite: write again.'
    - label: kind → ___kind
      bin: un- (not)
      clue: Not kind.
      why: 'unkind: not kind.'
  lesson:
    - teach: The poem 'Gilli Danda' is about children playing in the playground. The game uses a long stick (danda) and a small wooden peg (gilli). They strike the gilli so it flies high into the blue sky. In English the game is called tip-cat.
      picture:
        kind: flow
        steps:
        - Children gather
        - Tap the gilli up
        - Strike it with the danda
        - It flies into the sky
        alt: How gilli danda is played, from gathering to the gilli flying.
      check:
        prompt: Which is the small piece in gilli danda?
        options:
        - Gilli
        - Danda
        - Ball
        answer: Gilli
        why: The danda is the long stick; the gilli is the small peg.
      ways:
      - style: step_by_step
        teach: 'How a turn in gilli danda goes. Step 1: Lay the short gilli on the ground. Step 2: Tap one pointed end with the danda so the gilli jumps up. Step 3: While it is in the air, hit it hard to send it far. Step 4: The other side tries to catch it.'
      - style: real_world
        teach: 'Gilli danda needs no shop-bought toys: just two pieces of wood and an open space. That is why children in villages across India have played it for hundreds of years.'
    - teach: 'A prefix is a small part added to the front of a word to change its meaning. ''Un-'' means not: unhappy = not happy. ''Re-'' means again: replay = play again.'
      check:
        prompt: What does 'retell' mean?
        options:
        - Tell again
        - Not tell
        - Tell loudly
        answer: Tell again
        why: '''Re-'' means again.'
      ways:
      - style: visual
        teach: Two prefixes and how they change the meaning of a word.
        picture:
          kind: compare
          columns:
          - title: un- means not
            points:
            - unsafe = not safe
            - untidy = not tidy
            - unwell = not well
          - title: re- means again
            points:
            - rewrite = write again
            - refill = fill again
            - retell = tell again
          alt: 'The prefix un- means not: unsafe is not safe, untidy is not tidy, unwell is not well. The prefix re- means again: rewrite is write again, refill is fill again, retell is tell again.'
      - style: step_by_step
        teach: 'Split a word to find its meaning. Step 1: Take the word ''reopen''. Step 2: Cover ''re-'' and read what is left: ''open''. Step 3: Remember that ''re-'' means again. Step 4: Put them together: reopen means open again.'
    - teach: 'Possessive pronouns show who owns something without repeating the name: mine, yours, his, hers, ours, theirs. ''This bat belongs to me'' = ''This bat is mine.'''
      check:
        prompt: '''The ball belongs to them.'' The ball is ____.'
        options:
        - theirs
        - ours
        - mine
        answer: theirs
        why: '''Them'' becomes ''theirs''.'
      ways:
      - style: visual
        teach: Who owns it, and the possessive word we use instead of repeating the name.
        picture:
          kind: compare
          columns:
          - title: Owner
            points:
            - I
            - you
            - he
            - she
            - we
            - they
          - title: Possessive word
            points:
            - mine
            - yours
            - his
            - hers
            - ours
            - theirs
          alt: I goes with mine, you with yours, he with his, she with hers, we with ours and they with theirs.
      - style: real_world
        teach: 'At the end of a picnic, everyone sorts out the tiffin boxes: ''The blue one is yours, the steel one is theirs.'' Possessive words save us from saying everyone''s name again and again.'
  items:
  - prompt: 'Gilli danda is played with:'
    options:
    - a long stick and a small peg
    - a bat and a tennis ball
    - a racket and shuttle
    - a net and ball
    answer: a long stick and a small peg
    difficulty: 1
    hints:
    - Danda = stick.
    - Gilli = small peg.
    solution: A danda (stick) hits a gilli (peg).
    mistakes:
      a bat and a tennis ball: eng5_read_again
  - prompt: What is gilli danda called in English?
    options:
    - tip-cat
    - cricket
    - hide and seek
    - hopscotch
    answer: tip-cat
    difficulty: 2
    hints:
    - From the 'Did you know?' box.
    - Tip + an animal.
    solution: In English it is called tip-cat.
    mistakes: {"cricket": "e5_tipcat"}
  - prompt: How do the children feel while playing?
    options:
    - free and joyful
    - sad and bored
    - angry
    - sleepy
    answer: free and joyful
    difficulty: 1
    hints:
    - Playing under the sun.
    - Happy.
    solution: They feel free and happy.
    mistakes: {"sad and bored": "e5_play_joy"}
  - prompt: What does 'unhappy' mean?
    options:
    - not happy
    - happy again
    - very happy
    - happy before
    answer: not happy
    difficulty: 1
    hints:
    - un- means not.
    - un + happy.
    solution: Unhappy means not happy.
    mistakes:
      happy again: eng5_grammar
  - prompt: Which word means 'play again'?
    options:
    - replay
    - unplay
    - player
    - playful
    answer: replay
    difficulty: 1
    hints:
    - re- means again.
    - re + play.
    solution: Replay means play again.
    mistakes: {"player": "e5_re"}
  - prompt: 'Choose the right word: ''This bat is ____. I bought it yesterday.'''
    options:
    - mine
    - my
    - me
    - I
    answer: mine
    difficulty: 2
    hints:
    - It belongs to me.
    - Possessive pronoun that stands alone.
    solution: 'Mine is the possessive pronoun used alone: ''This bat is mine.'''
    mistakes:
      my: eng5_grammar
  - prompt: What is the long stick in gilli danda called?
    options:
    - Danda
    - Gilli
    - Bat
    answer: Danda
    difficulty: 1
    hints:
    - The game's name has two parts.
    - The second part is the stick.
    solution: 'Step 1: gilli = small peg. Step 2: danda = long stick.'
    mistakes:
      Gilli: c5e7_game
      Bat: c5e7_game
  - prompt: What does 'unkind' mean?
    options:
    - Not kind
    - Very kind
    - Kind again
    answer: Not kind
    difficulty: 1
    hints:
    - '''Un-'' changes the meaning.'
    - It means not.
    solution: 'Step 1: un- = not. Step 2: unkind = not kind.'
    mistakes:
      Very kind: c5e7_prefix
      Kind again: c5e7_prefix
  - prompt: Which word means 'build again'?
    options:
    - Rebuild
    - Unbuild
    - Builder
    answer: Rebuild
    difficulty: 1
    hints:
    - Which prefix means again?
    - '''Re-'' or ''un-''?'
    solution: 'Step 1: re- = again. Step 2: rebuild.'
    mistakes:
      Unbuild: c5e7_prefix
      Builder: c5e7_prefix
  - prompt: 'Choose the right word: ''That red cap belongs to my sister Asha. It is ____.'''
    options:
    - hers
    - his
    - theirs
    answer: hers
    difficulty: 2
    hints:
    - Asha is your sister.
    - A sister is one person; which word fits her?
    solution: 'Step 1: your sister Asha owns it. Step 2: for a sister, use ''hers''.'
    mistakes:
      his: c5e7_own
      theirs: c5e7_own
  - prompt: 'Choose the right word: ''This classroom belongs to all of us. It is ____.'''
    options:
    - ours
    - mine
    - yours
    answer: ours
    difficulty: 2
    hints:
    - '''All of us'' means we.'
    - We → ?
    solution: 'Step 1: belongs to us. Step 2: use ''ours''.'
    mistakes:
      mine: c5e7_own
      yours: c5e7_own
  - prompt: Where do the children play gilli danda in the poem?
    options:
    - In the playground under the sun
    - Inside a library
    - Underwater
    answer: In the playground under the sun
    difficulty: 1
    hints:
    - The gilli flies into the sky.
    - It needs open space.
    solution: 'Step 1: it needs space to fly. Step 2: they play in the playground.'
    mistakes:
      Inside a library: c5e7_game
      Underwater: c5e7_game
  - prompt: Which word is the opposite of 'gather'?
    options:
    - Scatter
    - Collect
    - Meet
    answer: Scatter
    difficulty: 3
    hints:
    - Gather means come together.
    - The opposite is going in all directions.
    solution: 'Step 1: gather = come together. Step 2: scatter = spread apart.'
    mistakes:
      Collect: c5e7_word
      Meet: c5e7_word
  - prompt: Add 'un-' to 'lock'. What does the new word mean?
    options:
    - Open the lock
    - Lock again
    - Lock tightly
    answer: Open the lock
    difficulty: 3
    hints:
    - '''Un-'' can undo an action.'
    - Like untie undoes a knot.
    solution: 'Step 1: unlock undoes locking. Step 2: it means open the lock.'
    mistakes:
      Lock again: c5e7_prefix
      Lock tightly: c5e7_prefix
  - prompt: What does 'quit' mean in 'We never quit the game early'?
    options:
    - Stop or leave
    - Start
    - Win
    answer: Stop or leave
    difficulty: 2
    hints:
    - They never do it early.
    - They keep playing till the end.
    solution: 'Step 1: they keep playing. Step 2: quit means stop or leave.'
    mistakes:
      Start: c5e7_word
      Win: c5e7_word
  - prompt: 'Case: The teacher says, ''Your answer has mistakes. Please do it again neatly.'' Which word means ''write it again''?'
    options:
    - Rewrite
    - Unwrite
    - Miswrite
    answer: Rewrite
    hints:
    - Which prefix means again?
    - Add that prefix to 'write'.
    solution: The prefix 're-' means again, so 'rewrite' means write again.
    mistakes:
      Unwrite: c5e7_prefix
      Miswrite: c5e7_prefix
    exam: case
    difficulty: 2
  - prompt: 'Situation: Two brothers share a cricket kit that their uncle gave them. Someone asks whose kit it is. What is the correct reply?'
    options:
    - It is theirs.
    - It is hers.
    - It is mine.
    answer: It is theirs.
    hints:
    - 'Who owns the kit: one person or two?'
    - Which word shows that more than one other person owns something?
    solution: The kit belongs to the two brothers, so it is 'theirs'.
    mistakes:
      It is hers.: c5e7_own
      It is mine.: c5e7_own
    exam: competency
    difficulty: 2
