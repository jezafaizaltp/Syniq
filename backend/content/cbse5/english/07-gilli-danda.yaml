# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 7. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 7
title: 'Gilli Danda (Unit 4: Ups and Downs)'
tips:
  e5_play_joy: "Children playing outdoors with friends. How do they feel?"
  e5_re: "The prefix 're-' means again."
  e5_tipcat: "You tip the small 'cat' (gilli) into the air with a stick."

concepts:
- code: cbse5e.u4.gillidanda
  title: 'Gilli Danda (Unit 4: Ups and Downs)'
  notes: |
    A poem about children gathering in the playground to play gilli danda, played with a long stick (danda) and a small
    peg (gilli). They hit the gilli so it flies high into the blue sky, and they feel free and joyful under the sun. In
    English the game is called tip-cat. Language work: prefixes un- (not: unhappy) and re- (again: replay); possessive
    pronouns (mine, yours, his, hers, ours, theirs); synonyms and antonyms. Words: gather, gilli, quit, underneath.
  explanations:
    text: The poem is about children playing gilli danda outdoors. They strike the small gilli with the long danda and watch it fly into the blue sky. Playing together under the sun makes them feel free and happy.
    visual: Draw a child swinging a long stick at a small pointed peg that is flying up into a blue sky, with friends cheering.
    step_by_step: '1. What game is it? Gilli danda. 2. What do you need? A stick and a small peg. 3. How do the children feel? Free and joyful. 4. Learn: un- means not, re- means again.'
    real_world: Gilli danda is an old Indian street game, played long before cricket became popular.
  picture:
    kind: compare
    columns:
    - title: Prefix un- (not)
      points:
      - unhappy
      - unkind
      - unsafe
    - title: Prefix re- (again)
      points:
      - replay
      - rewrite
      - retell
    alt: The prefix un- means not, as in unhappy, unkind and unsafe; the prefix re- means again, as in replay, rewrite and retell.
  activity:
    type: sort
    prompt: 'Gilli Danda: un- or re-?'
    bins:
    - un- (not)
    - re- (again)
    items:
    - label: happy → ___happy
      bin: un- (not)
      clue: Not happy.
      why: 'un + happy = unhappy: not happy.'
    - label: play → ___play
      bin: re- (again)
      clue: Play again.
      why: 're + play = replay: play again.'
    - label: tie → ___tie
      bin: un- (not)
      clue: Undo a knot.
      why: 'untie: the opposite of tie.'
    - label: write → ___write
      bin: re- (again)
      clue: Write it again.
      why: 'rewrite: write again.'
    - label: kind → ___kind
      bin: un- (not)
      clue: Not kind.
      why: 'unkind: not kind.'
  items:
  - prompt: 'Gilli danda is played with:'
    options:
    - a long stick and a small peg
    - a bat and a tennis ball
    - a racket and shuttle
    - a net and ball
    answer: a long stick and a small peg
    difficulty: 1
    hints:
    - Danda = stick.
    - Gilli = small peg.
    solution: A danda (stick) hits a gilli (peg).
    mistakes:
      a bat and a tennis ball: eng5_read_again
  - prompt: What is gilli danda called in English?
    options:
    - tip-cat
    - cricket
    - hide and seek
    - hopscotch
    answer: tip-cat
    difficulty: 2
    hints:
    - From the 'Did you know?' box.
    - Tip + an animal.
    solution: In English it is called tip-cat.
    mistakes: {"cricket": "e5_tipcat"}
  - prompt: How do the children feel while playing?
    options:
    - free and joyful
    - sad and bored
    - angry
    - sleepy
    answer: free and joyful
    difficulty: 1
    hints:
    - Playing under the sun.
    - Happy.
    solution: They feel free and happy.
    mistakes: {"sad and bored": "e5_play_joy"}
  - prompt: What does 'unhappy' mean?
    options:
    - not happy
    - happy again
    - very happy
    - happy before
    answer: not happy
    difficulty: 1
    hints:
    - un- means not.
    - un + happy.
    solution: Unhappy means not happy.
    mistakes:
      happy again: eng5_grammar
  - prompt: Which word means 'play again'?
    options:
    - replay
    - unplay
    - player
    - playful
    answer: replay
    difficulty: 1
    hints:
    - re- means again.
    - re + play.
    solution: Replay means play again.
    mistakes: {"player": "e5_re"}
  - prompt: 'Choose the right word: ''This bat is ____. I bought it yesterday.'''
    options:
    - mine
    - my
    - me
    - I
    answer: mine
    difficulty: 2
    hints:
    - It belongs to me.
    - Possessive pronoun that stands alone.
    solution: 'Mine is the possessive pronoun used alone: ''This bat is mine.'''
    mistakes:
      my: eng5_grammar
