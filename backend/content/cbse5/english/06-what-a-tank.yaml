    difficulty: 1
    hints:
    - They don't dry up in summer.
    - Our state!
    solution: Panam Keni wells are in Kerala.
    mistakes:
      Rajasthan: eng5_read_again
  - prompt: 'Tankas in Rajasthan are:'
    options:
    - underground tanks that store rainwater
    - rooftop toys
    - fishing boats
    - rivers
    answer: underground tanks that store rainwater
    difficulty: 1
    hints:
    - The Thar desert is dry.
    - Store water for months.
    solution: Tankas are underground water tanks.
  - prompt: What is special about rooftop tanks in rural Punjab?
    options:
    - they are made in fun shapes like aeroplanes
    - they are made of glass
    - they float
    - they are underground
    answer: they are made in fun shapes like aeroplanes
    difficulty: 1
    hints:
    - Footballs, roosters, tractors.
    - Shapes.
    solution: They are shaped to show the family's interests.
  - prompt: In the story, why couldn't Suma brush her teeth?
    options:
    - there was no water
    - she lost her brush
    - she was late
    - it was night
    answer: there was no water
    difficulty: 1
    hints:
    - The tank was empty.
    - Title of the story.
    solution: No water came from the tap.
  - prompt: What does 'conservation' mean?
    options:
    - saving and protecting
    - wasting
    - selling
    - painting
    answer: saving and protecting
    difficulty: 2
    hints:
    - Water conservation week.
    - Save every drop.
    solution: Conservation means saving and protecting something.
    mistakes:
      wasting: eng5_word
  - prompt: What did Suma ask her parents to install?
    options:
    - a rainwater harvesting system
    - a bigger TV
    - a swimming pool
    - a new tap only
    answer: a rainwater harvesting system
    difficulty: 2
    hints:
    - To collect rain.
    - From the roof.
    solution: She asked for rainwater harvesting.
