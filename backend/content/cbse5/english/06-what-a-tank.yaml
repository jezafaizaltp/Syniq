# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 6. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 6
title: 'What a Tank! (Unit 3: Water)'
tips:
  e5_no_water: "The story is about water. What was missing from the tap?"
  e5_punjab_tanks: "In Punjab people like to show off their tanks in fun shapes."
  e5_tanka: "Rajasthan is dry. Tankas save rain for later, under the ground."
  c5e6_place: Match each old way of storing water with the state it comes from.
  c5e6_story: 'Go back over Suma''s day in order: what stopped working, who came, and what she decided.'
  c5e6_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?
  c5e6_save: Ask whether the action keeps water for later or lets it run away.

concepts:
- code: cbse5e.u3.tank
  title: 'What a Tank! (Unit 3: Water)'
  notes: |
    An information text on saving water. People have stored water for centuries: Ooranis in Tamil Nadu (rainwater ponds
    for drinking and farming), Panam Keni wells in Kerala (they don't dry up in the hottest months), Tankas in Rajasthan's
    Thar (underground tanks storing water for 6–7 months). Today most homes have overhead tanks. In rural Punjab rooftop
    tanks are shaped like footballs, roosters, aeroplanes or tractors to show the family's interests; they are made of
    cement over a steel frame. Story 'A Day without Water': Suma's tap runs dry; she cannot brush, bathe or cook; school
    toilets close; a tanker comes; when water returns she promises never to waste it, joins Water Conservation Week, and
    her parents agree to rainwater harvesting. Words: conservation, overhead, heritage, unique, concrete, precious.
  explanations:
    text: This chapter is about storing and saving water. Long ago people built Ooranis in Tamil Nadu, Panam Keni wells in Kerala and Tankas in Rajasthan. In Punjab, rooftop tanks are made in fun shapes like footballs and aeroplanes! In the story, Suma has a day with no water and learns how precious it is.
    visual: Draw a Punjabi house with an aeroplane-shaped water tank on the roof. Next to it, draw Suma holding a 'Save Every Drop' poster.
    step_by_step: 1. Find the old ways of storing water and their states. 2. Find what is special about Punjab's tanks. 3. In the story, list what Suma could not do. 4. What did she promise?
    real_world: Kerala's Panam Keni wells are dug by the Kurichiya and other communities in Wayanad and stay full even in summer.
  picture:
    kind: compare
    columns:
    - title: Old way
      points:
      - Oorani
      - Panam Keni
      - Tanka
    - title: State
      points:
      - Tamil Nadu
      - Kerala
      - Rajasthan
    alt: Ooranis are from Tamil Nadu, Panam Keni wells from Kerala, and Tankas from Rajasthan.
  activity:
    type: order
    prompt: 'A Day without Water: put Suma''s day in order.'
    steps:
    - Suma's tap runs dry
    - She cannot brush, bathe or cook
    - A tanker comes
    - She promises never to waste water
    - Her parents agree to rainwater harvesting
    reasons:
      She cannot brush, bathe or cook: No water at home.
      A tanker comes: People need water urgently.
      She promises never to waste water: When water returns, she knows its value.
      Her parents agree to rainwater harvesting: She joins Water Conservation Week.
  lesson:
    - teach: '''What a Tank!'' tells how people have stored water for centuries. Ooranis in Tamil Nadu are rainwater ponds. Panam Keni wells in Kerala do not dry up even in the hottest months. Tankas in Rajasthan are underground tanks that store water for 6–7 months.'
      picture:
        kind: compare
        columns:
        - title: Old way
          points:
          - Oorani
          - Panam Keni
          - Tanka
        - title: State
          points:
          - Tamil Nadu
          - Kerala
          - Rajasthan
        alt: Traditional water stores and the states they come from.
      check:
        prompt: 'Tankas in Rajasthan are built:'
        options:
        - Underground
        - On tall poles
        - Inside trains
        answer: Underground
        why: Underground tanks keep water cool and safe in the desert.
      ways:
      - style: step_by_step
        teach: 'How a tanka in the desert fills up. Step 1: The ground around it is cleaned and sloped. Step 2: Rain falls and runs down the slope. Step 3: It flows through a small opening into the underground tank. Step 4: The tank is covered, so the water stays clean and cool for months.'
      - style: real_world
        teach: In many Kerala homes, the old open well in the courtyard is still used. Families clean it before the monsoon so that the rain can refill it with fresh water for the year.
    - teach: Today most homes have overhead tanks. In rural Punjab, rooftop tanks are made in fun shapes like footballs, roosters, aeroplanes and tractors, made of cement over a steel frame.
      check:
        prompt: What is special about many rooftop tanks in rural Punjab?
        options:
        - They are shaped like aeroplanes or footballs
        - They are made of glass
        - They float
        answer: They are shaped like aeroplanes or footballs
        why: Families show their interests through the tank shape.
      ways:
      - style: visual
        teach: Old ways and new ways of storing water at home.
        picture:
          kind: compare
          columns:
          - title: Old ways
            points:
            - Village ponds
            - Open wells
            - Underground tanks
          - title: New ways
            points:
            - Overhead tanks on roofs
            - Plastic storage tanks
            - Pipes and taps
          alt: Old ways of storing water include village ponds, open wells and underground tanks. New ways include overhead tanks on roofs, plastic storage tanks, and pipes and taps.
      - style: real_world
        teach: 'Water in an overhead tank flows down to the taps because it is up high. That is why tanks are kept on the roof: the water does not need a pump to reach the kitchen and bathroom.'
    - teach: In 'A Day without Water', Suma's tap runs dry. She cannot brush, bathe or cook, and school toilets close. A tanker brings water. Afterwards she promises never to waste water, joins Water Conservation Week, and her parents agree to rainwater harvesting.
      check:
        prompt: What did Suma learn?
        options:
        - Water is precious and must not be wasted
        - Tankers are fun
        - Taps never run dry
        answer: Water is precious and must not be wasted
        why: A day without water showed her how much she needs it.
      ways:
      - style: visual
        teach: What went wrong on Suma's day without water, and what changed afterwards.
        picture:
          kind: flow
          steps:
          - The tap runs dry
          - No brushing, bathing or cooking
          - School toilets close
          - A tanker brings water
          - Suma decides to save water
          alt: Suma's tap runs dry. She cannot brush, bathe or cook, and the school toilets close. A tanker brings water, and afterwards Suma decides to save water.
      - style: real_world
        teach: In summer, some cities send water tankers to areas where the pipes run dry. People line up with buckets and pots, and every drop is carried home carefully.
  items:
  - prompt: 'Panam Keni wells are found in:'
    options:
    - Kerala
    - Punjab
    - Rajasthan
    - Tamil Nadu
    answer: Kerala
    difficulty: 1
    hints:
    - They don't dry up in summer.
    - Our state!
    solution: Panam Keni wells are in Kerala.
    mistakes:
      Rajasthan: eng5_read_again
  - prompt: 'Tankas in Rajasthan are:'
    options:
    - "underground tanks that store rainwater"
    - "toys that children keep on rooftops"
    - "boats that are used for fishing"
    - "rivers that flow through the desert"
    answer: underground tanks that store rainwater
    difficulty: 1
    hints:
    - The Thar desert is dry.
    - Store water for months.
    solution: Tankas are underground water tanks.
    mistakes: {"toys that children keep on rooftops": "e5_tanka"}
  - prompt: What is special about rooftop tanks in rural Punjab?
    options:
    - "they are made in fun shapes like aeroplanes"
    - "they are made of clear glass you can see through"
    - "they float on the water in village ponds"
    - "they are kept deep under the ground"
    answer: they are made in fun shapes like aeroplanes
    difficulty: 1
    hints:
    - Footballs, roosters, tractors.
    - Shapes.
    solution: They are shaped to show the family's interests.
    mistakes: {"they are made of clear glass you can see through": "e5_punjab_tanks"}
  - prompt: In the story, why couldn't Suma brush her teeth?
    options:
    - there was no water
    - she lost her brush
    - she was late
    - it was night
    answer: there was no water
    difficulty: 1
    hints:
    - The tank was empty.
    - Title of the story.
    solution: No water came from the tap.
    mistakes: {"she lost her brush": "e5_no_water"}
  - prompt: What does 'conservation' mean?
    options:
    - saving and protecting
    - wasting
    - selling
    - painting
    answer: saving and protecting
    difficulty: 2
    hints:
    - Water conservation week.
    - Save every drop.
    solution: Conservation means saving and protecting something.
    mistakes:
      wasting: eng5_word
  - prompt: What did Suma ask her parents to install?
    options:
    - "a rainwater harvesting system"
    - "a bigger TV for the living room"
    - "a swimming pool in the garden"
    - "a new tap in the kitchen only"
    answer: a rainwater harvesting system
    difficulty: 2
    hints:
    - To collect rain.
    - From the roof.
    solution: She asked for rainwater harvesting.
    mistakes: {"a bigger TV for the living room": "v5_harvest"}
  - prompt: 'Ooranis are found in:'
    options:
    - Tamil Nadu
    - Punjab
    - Rajasthan
    answer: Tamil Nadu
    difficulty: 1
    hints:
    - They are rainwater ponds in the south.
    - Near Kerala, on the east side.
    solution: 'Step 1: ooranis are southern ponds. Step 2: they are in Tamil Nadu.'
    mistakes:
      Punjab: c5e6_place
      Rajasthan: c5e6_place
  - prompt: What does 'precious' mean?
    options:
    - Very valuable
    - Very cheap
    - Very dirty
    answer: Very valuable
    difficulty: 1
    hints:
    - Gold and diamonds are precious.
    - Water is precious too.
    solution: 'Step 1: precious things are worth a lot. Step 2: it means very valuable.'
    mistakes:
      Very cheap: c5e6_word
      Very dirty: c5e6_word
  - prompt: Who brought water to Suma's area?
    options:
    - A tanker
    - A boat
    - An aeroplane
    answer: A tanker
    difficulty: 1
    hints:
    - It is a truck with a big tank.
    - It drives through the streets.
    solution: 'Step 1: the taps were dry. Step 2: a water tanker came.'
    mistakes:
      A boat: c5e6_story
      An aeroplane: c5e6_story
  - prompt: Why did the school toilets close?
    options:
    - There was no water
    - It was a holiday
    - They were being painted
    answer: There was no water
    difficulty: 2
    hints:
    - Toilets need water to flush.
    - What was missing that day?
    solution: 'Step 1: toilets need water. Step 2: with none, they had to close.'
    mistakes:
      It was a holiday: c5e6_story
      They were being painted: c5e6_story
  - prompt: 'Rooftop tanks in Punjab are made of:'
    options:
    - "Cement over a steel frame"
    - "Thick sheets of paper"
    - "Blocks of hard ice"
    answer: Cement over a steel frame
    difficulty: 2
    hints:
    - They must be strong to hold water.
    - A metal skeleton covered in cement.
    solution: 'Step 1: the tanks hold heavy water. Step 2: they are cement over steel.'
    mistakes:
      "Thick sheets of paper": c5e6_place
      "Blocks of hard ice": c5e6_place
  - prompt: 'Choose the right word: ''An ____ tank sits on the roof.'''
    options:
    - overhead
    - underground
    - underwater
    answer: overhead
    difficulty: 2
    hints:
    - It is above us.
    - On the roof means high up.
    solution: 'Step 1: on the roof = above. Step 2: ''overhead''.'
    mistakes:
      underground: c5e6_word
      underwater: c5e6_word
  - prompt: Which action from the story saves water for later?
    options:
    - Harvesting rainwater
    - Leaving the tap on
    - Washing the car with a hose
    answer: Harvesting rainwater
    difficulty: 2
    hints:
    - Suma's parents agreed to this.
    - Rain is collected and stored.
    solution: 'Step 1: rain is caught and stored. Step 2: that saves water for later.'
    mistakes:
      Leaving the tap on: c5e6_save
      Washing the car with a hose: c5e6_save
  - prompt: Why do Panam Keni wells matter in Kerala's hot months?
    options:
    - They do not dry up
    - They are full of salt
    - They make ice
    answer: They do not dry up
    difficulty: 3
    hints:
    - Summer is hot and dry.
    - These wells keep water even then.
    solution: 'Step 1: other wells may dry in summer. Step 2: Panam Keni wells keep water.'
    mistakes:
      They are full of salt: c5e6_place
      They make ice: c5e6_place
  - prompt: What is the main message of 'What a Tank!'?
    options:
    - Store and save water wisely
    - Tanks should be painted
    - Water is unlimited
    answer: Store and save water wisely
    difficulty: 3
    hints:
    - Old and new tanks both store water.
    - Suma's day showed why.
    solution: 'Step 1: people store water carefully. Step 2: the message: store and save water wisely.'
    mistakes:
      Tanks should be painted: c5e6_save
      Water is unlimited: c5e6_save
  - prompt: 'Case: In a village, the summer is long and there is no river nearby, but it rains heavily for two months. What would help the families most?'
    options:
    - "Store the rainwater in covered tanks to use in summer"
    - "Let the rainwater run away into the drains"
    - "Wait for a water tanker to come each day"
    answer: Store the rainwater in covered tanks to use in summer
    hints:
    - When does the village have plenty of water?
    - How can that water be kept for the dry months?
    solution: Storing the heavy rain in covered tanks, as people do with tankas, keeps water ready for the long summer.
    mistakes:
      "Let the rainwater run away into the drains": c5e6_save
      "Wait for a water tanker to come each day": c5e6_save
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your friend writes, ''Water is very preshus.'' How should the word be written?'
    options:
    - precious
    - presious
    - preshous
    answer: precious
    hints:
    - The word means very valuable.
    - Look carefully at the letters 'ci' in the middle.
    solution: The correct spelling is 'precious', which means very valuable.
    mistakes:
      presious: c5e6_word
      preshous: c5e6_word
    exam: competency
    difficulty: 2
