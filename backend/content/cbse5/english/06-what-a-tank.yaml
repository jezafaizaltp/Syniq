# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 6
title: 'What a Tank! (Unit 3: Water)'
concepts:
- code: cbse5e.u3.tank
  title: 'What a Tank! (Unit 3: Water)'
  notes: |
    An information text on saving water. People have stored water for centuries: Ooranis in Tamil Nadu (rainwater ponds
    for drinking and farming), Panam Keni wells in Kerala (they don't dry up in the hottest months), Tankas in Rajasthan's
    Thar (underground tanks storing water for 6–7 months). Today most homes have overhead tanks. In rural Punjab rooftop
    tanks are shaped like footballs, roosters, aeroplanes or tractors to show the family's interests; they are made of
    cement over a steel frame. Story 'A Day without Water': Suma's tap runs dry; she cannot brush, bathe or cook; school
    toilets close; a tanker comes; when water returns she promises never to waste it, joins Water Conservation Week, and
    her parents agree to rainwater harvesting. Words: conservation, overhead, heritage, unique, concrete, precious.
  explanations:
    text: This chapter is about storing and saving water. Long ago people built Ooranis in Tamil Nadu, Panam Keni wells in Kerala and Tankas in Rajasthan. In Punjab, rooftop tanks are made in fun shapes like footballs and aeroplanes! In the story, Suma has a day with no water and learns how precious it is.
    visual: Draw a Punjabi house with an aeroplane-shaped water tank on the roof. Next to it, draw Suma holding a 'Save Every Drop' poster.
    step_by_step: 1. Find the old ways of storing water and their states. 2. Find what is special about Punjab's tanks. 3. In the story, list what Suma could not do. 4. What did she promise?
    real_world: Kerala's Panam Keni wells are dug by the Kurichiya and other communities in Wayanad and stay full even in summer.
  picture:
    kind: compare
    columns:
    - title: Old way
      points:
      - Oorani
      - Panam Keni
      - Tanka
    - title: State
      points:
      - Tamil Nadu
      - Kerala
      - Rajasthan
    alt: Ooranis are from Tamil Nadu, Panam Keni wells from Kerala, and Tankas from Rajasthan.
  items:
  - prompt: 'Panam Keni wells are found in:'
    options:
    - Kerala
    - Punjab
    - Rajasthan
    - Tamil Nadu
