# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 4. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 4
title: 'The Wise Parrot (Unit 2: My Colourful World)'
concepts:
- code: cbse5e.u2.parrot
  title: 'The Wise Parrot (Unit 2: My Colourful World)'
  notes: |
    A folk tale in the unit 'My Colourful World' about a clever parrot whose good sense helps it (and others) out of
    trouble. Like many Indian folk tales (Panchatantra, Jataka), the message is that thinking calmly and wisely is better
    than strength or panic. Exact story details are not reproduced here: questions focus on reading folk tales, words
    for birds and colours, and the moral.
  explanations:
    text: This is a folk tale about a wise parrot. In folk tales, animals often think and talk like people. The clever animal usually wins by using its brain, not its strength, and the story ends with a lesson.
    visual: Draw a green parrot with a red beak on a branch, looking thoughtful, with a speech bubble.
    step_by_step: 1. Who is the main character? 2. What problem does it face? 3. How does it use its brain? 4. What is the lesson?
    real_world: Grandparents across India tell animal stories at bedtime, like the Panchatantra tales, to teach good sense.
  picture:
    kind: flow
    steps:
    - A problem arrives
    - The parrot stays calm
    - It thinks of a clever plan
    - 'Lesson: wisdom wins'
    alt: In a folk tale a problem arrives, the wise parrot stays calm, thinks of a clever plan, and the lesson is that wisdom wins.
  activity:
    type: sort
    prompt: Bird words or colour words?
    bins:
    - Bird words
    - Colour words
    items:
    - label: beak
      bin: Bird words
      clue: Part of a bird's face.
      why: A beak is part of a bird.
    - label: crimson
      bin: Colour words
      clue: A shade of red.
      why: Crimson is a colour.
    - label: feathers
      bin: Bird words
      clue: What covers a bird.
      why: Feathers belong to birds.
    - label: emerald
      bin: Colour words
      clue: A shade of green.
      why: Emerald green is a colour, like a parrot's wings.
    - label: perch
      bin: Bird words
      clue: Where a bird sits.
      why: A perch is a bird's resting place.
  items:
  - prompt: 'In folk tales like this, animals often:'
    options:
    - talk and think like people
    - never speak
    - are always machines
    - live on the Moon
    answer: talk and think like people
    difficulty: 1
    hints:
    - Remember the Panchatantra.
    - Talking animals.
    solution: Folk-tale animals talk and think like people.
  - prompt: 'A ''wise'' parrot is one that is:'
    options:
    - clever and sensible
    - very noisy
    - very lazy
    - very big
    answer: clever and sensible
    difficulty: 1
    hints:
    - Wise = good sense.
    - Thinks well.
    solution: Wise means having good sense.
    mistakes:
      very noisy: eng5_word
  - prompt: Most parrots are what colour?
    options:
    - green
    - black
    - white
    - blue
    answer: green
    difficulty: 1
    hints:
    - Like leaves.
    - With a red beak.
    solution: Parrots are mostly green.
  - prompt: What is the usual lesson of a 'wise animal' story?
    options:
    - thinking calmly is better than panic or strength
    - the biggest animal always wins
    - never help anyone
    - running away is always best
    answer: thinking calmly is better than panic or strength
    difficulty: 2
    hints:
    - How does the hero win?
    - With its brain.
    solution: Wisdom wins over strength.
  - prompt: Which is a famous collection of Indian animal stories?
    options:
    - Panchatantra
    - Harry Potter
    - Cinderella
    - Robinson Crusoe
    answer: Panchatantra
    difficulty: 2
    hints:
    - Written for princes long ago.
    - Five books.
    solution: The Panchatantra is an old Indian collection of animal tales.
  - prompt: 'Pick the word that describes a parrot''s beak:'
    options:
    - curved
    - flat
    - square
    - furry
    answer: curved
    difficulty: 2
    hints:
    - It bends downward.
    - Good for cracking nuts.
    solution: A parrot's beak is curved.
