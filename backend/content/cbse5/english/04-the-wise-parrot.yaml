# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 4. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 4
title: 'The Wise Parrot (Unit 2: My Colourful World)'
tips:
  e5_parrot_colour: "Most parrots blend in with the leaves of the trees they live in."
  e5_panchatantra: "These Indian stories were told by Vishnu Sharma to teach princes."
  e5_wise: "The wise animal wins with its head, not its size."
  c5e4_tale: 'Remember how folk tales work: animals talk, think and teach a lesson.'
  c5e4_wise: A wise character uses their head, not their muscles or a loud voice.
  c5e4_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?
  c5e4_bird: 'Picture a parrot closely: its colour, beak and what it can do.'

concepts:
- code: cbse5e.u2.parrot
  title: 'The Wise Parrot (Unit 2: My Colourful World)'
  notes: |
    A folk tale in the unit 'My Colourful World' about a clever parrot whose good sense helps it (and others) out of
    trouble. Like many Indian folk tales (Panchatantra, Jataka), the message is that thinking calmly and wisely is better
    than strength or panic. Exact story details are not reproduced here: questions focus on reading folk tales, words
    for birds and colours, and the moral.
  explanations:
    text: This is a folk tale about a wise parrot. In folk tales, animals often think and talk like people. The clever animal usually wins by using its brain, not its strength, and the story ends with a lesson.
    visual: Draw a green parrot with a red beak on a branch, looking thoughtful, with a speech bubble.
    step_by_step: 1. Who is the main character? 2. What problem does it face? 3. How does it use its brain? 4. What is the lesson?
    real_world: Grandparents across India tell animal stories at bedtime, like the Panchatantra tales, to teach good sense.
  picture:
    kind: flow
    steps:
    - A problem arrives
    - The parrot stays calm
    - It thinks of a clever plan
    - 'Lesson: wisdom wins'
    alt: In a folk tale a problem arrives, the wise parrot stays calm, thinks of a clever plan, and the lesson is that wisdom wins.
  activity:
    type: sort
    prompt: Bird words or colour words?
    bins:
    - Bird words
    - Colour words
    items:
    - label: beak
      bin: Bird words
      clue: Part of a bird's face.
      why: A beak is part of a bird.
    - label: crimson
      bin: Colour words
      clue: A shade of red.
      why: Crimson is a colour.
    - label: feathers
      bin: Bird words
      clue: What covers a bird.
      why: Feathers belong to birds.
    - label: emerald
      bin: Colour words
      clue: A shade of green.
      why: Emerald green is a colour, like a parrot's wings.
    - label: perch
      bin: Bird words
      clue: Where a bird sits.
      why: A perch is a bird's resting place.
  lesson:
    - teach: '''The Wise Parrot'' is a folk tale. Folk tales are old stories passed down by people telling them aloud. In many of them animals talk and think like people, and the story ends with a lesson.'
      check:
        prompt: How were folk tales first passed on?
        options:
        - People told them aloud
        - On television
        - By email
        answer: People told them aloud
        why: Grandparents told them to children for hundreds of years.
      ways:
      - style: visual
        teach: What usually happens in a traditional folk tale.
        picture:
          kind: flow
          steps:
          - The story is told aloud and passed down
          - Animals talk and think like people
          - A problem comes up
          - A character solves it
          - The story ends with a lesson
          alt: A folk tale is told aloud and passed down. Animals talk and think like people. A problem comes up, a character solves it, and the story ends with a lesson.
      - style: real_world
        teach: Many families have a story that a grandparent tells at bedtime, the same way each time. Children grow up and tell it to their own children. That is how folk tales travel through time.
    - teach: 'India has famous collections of animal stories: the Panchatantra and the Jataka tales. A ''wise'' animal in such stories is clever and sensible. It solves problems by thinking, not by fighting.'
      picture:
        kind: compare
        columns:
        - title: Wise character
          points:
          - Thinks calmly
          - Makes a plan
          - Helps others
        - title: Foolish character
          points:
          - Panics
          - Shows off
          - Acts without thinking
        alt: How a wise character behaves compared with a foolish one.
      check:
        prompt: 'A wise parrot gets out of trouble by:'
        options:
        - Thinking of a clever plan
        - Biting everyone
        - Crying loudly
        answer: Thinking of a clever plan
        why: Wisdom means using your mind.
      ways:
      - style: visual
        teach: A wise character compared with a foolish one.
        picture:
          kind: compare
          columns:
          - title: Wise
            points:
            - Stays calm
            - Thinks before acting
            - Finds a clever way out
          - title: Foolish
            points:
            - Panics
            - Acts without thinking
            - Falls into the trap
          alt: A wise character stays calm, thinks before acting and finds a clever way out. A foolish character panics, acts without thinking and falls into the trap.
      - style: real_world
        teach: In one Panchatantra story, a small rabbit tricks a strong lion by leading it to a well, where it sees its own reflection. The rabbit wins with a clever idea, not with strength.
    - teach: 'Parrots are usually green with a curved red beak. Some parrots can copy human words. Describing words (adjectives) tell us more about a noun: a green parrot, a curved beak, a clever bird.'
      check:
        prompt: In 'a clever bird', which word is the describing word?
        options:
        - Clever
        - Bird
        - A
        answer: Clever
        why: It tells us what kind of bird.
      ways:
      - style: step_by_step
        teach: 'Add describing words. Step 1: Start with a noun: bird. Step 2: Ask ''what colour?'': a blue bird. Step 3: Ask ''what size?'': a small blue bird. Step 4: Ask ''what is it like?'': a small, cheerful blue bird. Each describing word tells us more.'
      - style: visual
        teach: Naming words and the describing words that tell us more about them.
        picture:
          kind: compare
          columns:
          - title: Naming word (noun)
            points:
            - mango
            - road
            - elephant
          - title: With describing words
            points:
            - a sweet, ripe mango
            - a long, dusty road
            - a huge grey elephant
          alt: Mango becomes a sweet, ripe mango. Road becomes a long, dusty road. Elephant becomes a huge grey elephant. The describing words tell us more about each noun.
  items:
  - prompt: 'In folk tales like this, animals often:'
    options:
    - "talk and think like people"
    - "never speak or make a sound"
    - "are always machines, not animals"
    - "live far away on the Moon"
    answer: talk and think like people
    difficulty: 1
    hints:
    - Remember the Panchatantra.
    - Talking animals.
    solution: Folk-tale animals talk and think like people.
    mistakes: {"never speak or make a sound": "e6_fable"}
  - prompt: 'A ''wise'' parrot is one that is:'
    options:
    - clever and sensible
    - very noisy
    - very lazy
    - very big
    answer: clever and sensible
    difficulty: 1
    hints:
    - Wise = good sense.
    - Thinks well.
    solution: Wise means having good sense.
    mistakes:
      very noisy: eng5_word
  - prompt: Most parrots are what colour?
    options:
    - green
    - black
    - white
    - blue
    answer: green
    difficulty: 1
    hints:
    - Like leaves.
    - With a red beak.
    solution: Parrots are mostly green.
    mistakes: {"black": "e5_parrot_colour"}
  - prompt: What is the usual lesson of a 'wise animal' story?
    options:
    - "thinking calmly is better than panic or strength"
    - "the biggest animal in the forest always wins"
    - "never help anyone, even when they need it"
    - "running away is always the best thing to do"
    answer: thinking calmly is better than panic or strength
    difficulty: 2
    hints:
    - How does the hero win?
    - With its brain.
    solution: Wisdom wins over strength.
    mistakes: {"the biggest animal in the forest always wins": "e5_wise"}
  - prompt: Which is a famous collection of Indian animal stories?
    options:
    - Panchatantra
    - Harry Potter
    - Cinderella
    - Robinson Crusoe
    answer: Panchatantra
    difficulty: 2
    hints:
    - Written for princes long ago.
    - Five books.
    solution: The Panchatantra is an old Indian collection of animal tales.
    mistakes: {"Cinderella": "e5_panchatantra"}
  - prompt: 'Pick the word that describes a parrot''s beak:'
    options:
    - curved
    - flat
    - square
    - furry
    answer: curved
    difficulty: 2
    hints:
    - It bends downward.
    - Good for cracking nuts.
    solution: A parrot's beak is curved.
    mistakes: {"flat": "v4_parrot_beak"}
  - prompt: Which word means the opposite of 'wise'?
    options:
    - Foolish
    - Clever
    - Smart
    answer: Foolish
    difficulty: 1
    hints:
    - Two of these mean almost the same as wise.
    - Which one is the opposite?
    solution: 'Step 1: clever and smart are like wise. Step 2: the opposite is foolish.'
    mistakes:
      Clever: c5e4_word
      Smart: c5e4_word
  - prompt: 'The Jataka tales are stories about:'
    options:
    - The Buddha's past lives
    - Space travel
    - Modern cars
    answer: The Buddha's past lives
    difficulty: 3
    hints:
    - They are very old Indian tales.
    - Often the Buddha was an animal in them.
    solution: 'Step 1: Jataka tales are ancient. Step 2: they tell of the Buddha''s earlier lives.'
    mistakes:
      Space travel: c5e4_tale
      Modern cars: c5e4_tale
  - prompt: Which is something a parrot can do?
    options:
    - Copy words it hears
    - Swim under the sea
    - Breathe fire
    answer: Copy words it hears
    difficulty: 1
    hints:
    - Some pet parrots say 'hello'.
    - They are good at copying sounds.
    solution: 'Step 1: parrots copy sounds. Step 2: some copy words.'
    mistakes:
      Swim under the sea: c5e4_bird
      Breathe fire: c5e4_bird
  - prompt: 'Pick the describing word in: ''The noisy parrot flew away.'''
    options:
    - Noisy
    - Parrot
    - Flew
    answer: Noisy
    difficulty: 2
    hints:
    - It tells what kind of parrot.
    - Not the action, not the name.
    solution: 'Step 1: ''parrot'' is the noun, ''flew'' the action. Step 2: ''noisy'' describes the parrot.'
    mistakes:
      Parrot: c5e4_word
      Flew: c5e4_word
  - prompt: 'In a folk tale, a hunter traps many birds. A wise bird would most likely:'
    options:
    - "Tell all the birds to fly up together with the net"
    - "Fight the hunter all alone with its sharp beak"
    - "Fall asleep in the net and wait for the morning"
    answer: Tell all the birds to fly up together with the net
    difficulty: 3
    hints:
    - Wise characters make plans.
    - Working together is stronger.
    solution: 'Step 1: one bird cannot lift the net. Step 2: all flying together can.'
    mistakes:
      "Fight the hunter all alone with its sharp beak": c5e4_wise
      "Fall asleep in the net and wait for the morning": c5e4_wise
  - prompt: What is a 'moral' in a story?
    options:
    - The lesson it teaches
    - The first sentence
    - The name of the writer
    answer: The lesson it teaches
    difficulty: 2
    hints:
    - Folk tales end with one.
    - '''So we learn that...'''
    solution: 'Step 1: stories often end with a lesson. Step 2: that lesson is the moral.'
    mistakes:
      The first sentence: c5e4_tale
      The name of the writer: c5e4_tale
  - prompt: 'Choose the right word: ''The parrot was very ____ and solved the riddle.'''
    options:
    - clever
    - sleepy
    - lazy
    answer: clever
    difficulty: 1
    hints:
    - Solving a riddle needs thinking.
    - Which word fits someone who thinks well?
    solution: 'Step 1: solving riddles needs brains. Step 2: ''clever'' fits.'
    mistakes:
      sleepy: c5e4_word
      lazy: c5e4_word
  - prompt: Which is a fact, not a folk-tale idea?
    options:
    - Parrots are birds with feathers
    - Parrots can talk to kings about secrets
    - Parrots rule the forest
    answer: Parrots are birds with feathers
    difficulty: 3
    hints:
    - A fact is true in real life.
    - Which one could you check in a science book?
    solution: 'Step 1: talking to kings happens only in stories. Step 2: having feathers is a fact.'
    mistakes:
      Parrots can talk to kings about secrets: c5e4_tale
      Parrots rule the forest: c5e4_tale
  - prompt: Why do grandparents tell children folk tales?
    options:
    - "To share lessons and fun from the past"
    - "To scare the children every single night"
    - "To stop the children from reading books"
    answer: To share lessons and fun from the past
    difficulty: 2
    hints:
    - Tales carry old wisdom.
    - They are also enjoyable.
    solution: 'Step 1: folk tales hold lessons. Step 2: telling them shares wisdom and fun.'
    mistakes:
      "To scare the children every single night": c5e4_tale
      "To stop the children from reading books": c5e4_tale
  - prompt: 'Case: In a story, a crow is thirsty and finds a pot with only a little water at the bottom. It drops pebbles in until the water rises, then drinks. Which word best describes the crow?'
    options:
    - Clever
    - Lazy
    - Rude
    answer: Clever
    hints:
    - Did the crow use strength or an idea?
    - What do we call a character who solves a problem by thinking?
    solution: The crow thought of a smart way to make the water rise. That makes it clever, like a wise animal in a folk tale.
    mistakes:
      Lazy: c5e4_wise
      Rude: c5e4_wise
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are describing your pet for a class talk. Which sentence uses describing words best?'
    options:
    - "My fluffy white kitten has bright green eyes."
    - "My kitten is there, next to me, on the mat."
    - "Kitten eyes kitten, kitten eyes kitten eyes."
    answer: My fluffy white kitten has bright green eyes.
    hints:
    - Describing words tell us more about a noun.
    - Which sentence helps the listener picture the pet?
    solution: '''Fluffy'', ''white'', ''bright'' and ''green'' are describing words. They help the listener picture the kitten.'
    mistakes:
      "My kitten is there, next to me, on the mat.": c5e4_word
      "Kitten eyes kitten, kitten eyes kitten eyes.": c5e4_word
    exam: competency
    difficulty: 2
