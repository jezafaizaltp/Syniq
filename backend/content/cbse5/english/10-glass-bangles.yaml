concepts:
- code: cbse5e.u5.bangles
  title: 'Glass Bangles (Unit 5: Work is Worship)'
  notes: |
    A text in the unit 'Work is Worship' about glass bangles and the people who make them. Firozabad in Uttar Pradesh is
    India's best-known glass bangle town; bangles are made by melting glass in hot furnaces, drawing it into coils, cutting
    and joining rings, and decorating them. It is skilled, hard work, done by families for generations. Message: every
    job has dignity and deserves respect. Exact details of the NCERT text are not reproduced here.
  explanations:
    text: Glass bangles are made by skilled workers. Glass is melted in very hot furnaces, shaped into rings, joined and decorated with colours and designs. Firozabad in Uttar Pradesh is famous for them. This chapter reminds us that every kind of work deserves respect.
    visual: Draw a hot furnace with a glowing orange coil of glass, a worker shaping rings, and a stack of colourful bangles.
    step_by_step: '1. What is being made? Glass bangles. 2. How? Melt, shape, join, decorate. 3. Where? Firozabad is famous. 4. What is the message? Work is worship: respect all work.'
    real_world: At weddings and festivals across India, women wear colourful glass bangles that tinkle when they move.
  picture:
    kind: flow
    steps:
    - Melt glass in a furnace
    - Draw it into a coil
    - Cut and join into rings
    - Decorate and sell
    alt: 'Making glass bangles: melt glass in a furnace, draw it into a coil, cut and join it into rings, then decorate and sell.'
  activity:
    type: order
    prompt: 'Glass Bangles: put the steps in order.'
    steps:
    - Melt the glass in a hot furnace
    - Draw it into coils
    - Cut and join the rings
    - Decorate them
    reasons:
      Draw it into coils: Soft hot glass can be pulled.
      Cut and join the rings: The coils become circles.
      Decorate them: The finished rings are made pretty.
  items:
  - prompt: Which town in India is famous for glass bangles?
    options:
    - Firozabad
    - Kochi
    - Shimla
    - Panaji
    answer: Firozabad
    difficulty: 2
    hints:
    - In Uttar Pradesh.
    - City of bangles.
    solution: Firozabad is famous for glass bangles.
    mistakes: {"Shimla": "e5_firozabad"}
  - prompt: 'To shape glass, it must first be:'
    options:
    - melted in great heat
    - frozen
    - soaked in water
    - painted
    answer: melted in great heat
    difficulty: 1
    hints:
    - Glass is hard when cold.
    - Furnace.
    solution: Glass is melted in a hot furnace.
    mistakes: {"frozen": "e5_melt_glass"}
  - prompt: '''Work is worship'' means:'
    options:
    - all honest work deserves respect
    - work only on holidays
    - never work
    - only prayers count
    answer: all honest work deserves respect
    difficulty: 1
    hints:
    - The unit's title.
    - Dignity of labour.
    solution: It means every honest job deserves respect.
    mistakes:
      never work: eng5_read_again
  - prompt: 'Bangles are worn on the:'
    options:
    - wrists
    - ankles
    - ears
    - neck
    answer: wrists
    difficulty: 1
    hints:
    - They slide over the hand.
    - Arms.
    solution: Bangles are worn on the wrists.
    mistakes: {"ears": "e5_wrists"}
  - prompt: Why is bangle-making hard work?
    options:
    - workers sit near very hot furnaces for long hours
    - bangles are heavy as rocks
    - it is done underwater
    - it needs no skill
    answer: workers sit near very hot furnaces for long hours
    difficulty: 2
    hints:
    - Think of the heat.
    - Long hours.
    solution: Furnaces are very hot and the work is long.
    mistakes: {"it needs no skill": "e5_furnace"}
  - prompt: Which word describes glass?
    options:
    - fragile
    - soft as cotton
    - furry
    - runny like water
    answer: fragile
    difficulty: 2
    hints:
    - It breaks easily.
    - Handle with care.
    solution: 'Glass is fragile: it breaks easily.'
    mistakes:
      soft as cotton: eng5_word
