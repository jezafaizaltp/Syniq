# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 10. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 10
title: 'Glass Bangles (Unit 5: Work is Worship)'
tips:
  e5_firozabad: "The bangle town is near Agra in Uttar Pradesh."
  e5_furnace: "Glass is melted in a furnace. What is it like to sit near one all day?"
  e5_melt_glass: "Glass can be shaped only when it is soft. What makes glass soft?"
  e5_wrists: "Bangles go round your hand, just above it."
  c5e10_make: Follow the steps of making a bangle in order, starting from raw glass.
  c5e10_place: Think of the town in Uttar Pradesh best known for this craft.
  c5e10_work: Think about the heat, the time and the skill needed, and how we should treat such workers.
  c5e10_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?

concepts:
- code: cbse5e.u5.bangles
  title: 'Glass Bangles (Unit 5: Work is Worship)'
  notes: |
    A text in the unit 'Work is Worship' about glass bangles and the people who make them. Firozabad in Uttar Pradesh is
    India's best-known glass bangle town; bangles are made by melting glass in hot furnaces, drawing it into coils, cutting
    and joining rings, and decorating them. It is skilled, hard work, done by families for generations. Message: every
    job has dignity and deserves respect. Exact details of the NCERT text are not reproduced here.
  explanations:
    text: Glass bangles are made by skilled workers. Glass is melted in very hot furnaces, shaped into rings, joined and decorated with colours and designs. Firozabad in Uttar Pradesh is famous for them. This chapter reminds us that every kind of work deserves respect.
    visual: Draw a hot furnace with a glowing orange coil of glass, a worker shaping rings, and a stack of colourful bangles.
    step_by_step: '1. What is being made? Glass bangles. 2. How? Melt, shape, join, decorate. 3. Where? Firozabad is famous. 4. What is the message? Work is worship: respect all work.'
    real_world: At weddings and festivals across India, women wear colourful glass bangles that tinkle when they move.
  picture:
    kind: flow
    steps:
    - Melt glass in a furnace
    - Draw it into a coil
    - Cut and join into rings
    - Decorate and sell
    alt: 'Making glass bangles: melt glass in a furnace, draw it into a coil, cut and join it into rings, then decorate and sell.'
  activity:
    type: order
    prompt: 'Glass Bangles: put the steps in order.'
    steps:
    - Melt the glass in a hot furnace
    - Draw it into coils
    - Cut and join the rings
    - Decorate them
    reasons:
      Draw it into coils: Soft hot glass can be pulled.
      Cut and join the rings: The coils become circles.
      Decorate them: The finished rings are made pretty.
  lesson:
    - teach: Glass bangles are made in many places, but Firozabad in Uttar Pradesh is India's best-known glass bangle town. Many families there have done this work for generations.
      check:
        prompt: Firozabad is in which state?
        options:
        - Uttar Pradesh
        - Kerala
        - Assam
        answer: Uttar Pradesh
        why: Firozabad is near Agra, in Uttar Pradesh.
      ways:
      - style: visual
        teach: Where glass bangles are made and who makes them.
        picture:
          kind: compare
          columns:
          - title: Place
            points:
            - Firozabad, Uttar Pradesh
            - India's best-known bangle town
          - title: Makers
            points:
            - Many families
            - The same work for generations
          alt: Glass bangles are made in Firozabad in Uttar Pradesh, India's best-known bangle town, by many families who have done the same work for generations.
      - style: real_world
        teach: At weddings and festivals in many parts of India, people buy sets of colourful glass bangles. The gentle clinking sound of bangles is part of many celebrations.
    - teach: To make bangles, glass is melted in very hot furnaces, drawn out into long coils, cut into rings, joined, and then decorated with colours and designs.
      picture:
        kind: flow
        steps:
        - Melt glass in furnace
        - Draw into coils
        - Cut into rings
        - Join the ends
        - Decorate
        alt: Steps in making glass bangles from melting to decorating.
      check:
        prompt: What is the first step in making a glass bangle?
        options:
        - Melting the glass
        - Decorating it
        - Selling it
        answer: Melting the glass
        why: Glass must be soft before it can be shaped.
      ways:
      - style: step_by_step
        teach: 'Think it through like a craftsperson. Step 1: Why heat the glass? So it becomes soft. Step 2: Why pull it into coils? To get long, even threads of glass. Step 3: Why cut it? To make rings of the right size. Step 4: Why decorate? To make each bangle beautiful.'
      - style: real_world
        teach: When you warm a stick of wax or chocolate in your hand, it bends instead of snapping. Glass behaves the same way, only it needs a furnace far hotter than any kitchen.
    - teach: 'Bangle-making is skilled, hard work. Workers sit near hot furnaces for long hours. The unit message is that all work has dignity, and workers deserve respect and safe conditions. Glass is fragile: it breaks easily.'
      check:
        prompt: What does 'fragile' mean?
        options:
        - Easily broken
        - Very heavy
        - Very cheap
        answer: Easily broken
        why: Glass bangles can crack if dropped.
      ways:
      - style: visual
        teach: What makes bangle work hard, and what workers deserve.
        picture:
          kind: compare
          columns:
          - title: Hard parts of the work
            points:
            - Great heat from furnaces
            - Long hours
            - Sharp, fragile glass
          - title: What workers deserve
            points:
            - Respect
            - Fair pay
            - Safe conditions and safety gear
          alt: Bangle work is hard because of great heat from furnaces, long hours, and sharp, fragile glass. Workers deserve respect, fair pay, and safe conditions with safety gear.
      - style: real_world
        teach: A bangle seller wraps glass bangles in paper or keeps them in a padded box. One drop on a hard floor and a bangle can shatter, because glass is fragile.
  items:
  - prompt: Which town in India is famous for glass bangles?
    options:
    - Firozabad
    - Kochi
    - Shimla
    - Panaji
    answer: Firozabad
    difficulty: 2
    hints:
    - In Uttar Pradesh.
    - City of bangles.
    solution: Firozabad is famous for glass bangles.
    mistakes: {"Shimla": "e5_firozabad"}
  - prompt: 'To shape glass, it must first be:'
    options:
    - melted in great heat
    - frozen
    - soaked in water
    - painted
    answer: melted in great heat
    difficulty: 1
    hints:
    - Glass is hard when cold.
    - Furnace.
    solution: Glass is melted in a hot furnace.
    mistakes: {"frozen": "e5_melt_glass"}
  - prompt: '''Work is worship'' means:'
    options:
    - all honest work deserves respect
    - work only on holidays
    - never work
    - only prayers count
    answer: all honest work deserves respect
    difficulty: 1
    hints:
    - The unit's title.
    - Dignity of labour.
    solution: It means every honest job deserves respect.
    mistakes:
      never work: eng5_read_again
  - prompt: 'Bangles are worn on the:'
    options:
    - wrists
    - ankles
    - ears
    - neck
    answer: wrists
    difficulty: 1
    hints:
    - They slide over the hand.
    - Arms.
    solution: Bangles are worn on the wrists.
    mistakes: {"ears": "e5_wrists"}
  - prompt: Why is bangle-making hard work?
    options:
    - workers sit near very hot furnaces for long hours
    - bangles are heavy as rocks
    - it is done underwater
    - it needs no skill
    answer: workers sit near very hot furnaces for long hours
    difficulty: 2
    hints:
    - Think of the heat.
    - Long hours.
    solution: Furnaces are very hot and the work is long.
    mistakes: {"it needs no skill": "e5_furnace"}
  - prompt: Which word describes glass?
    options:
    - fragile
    - soft as cotton
    - furry
    - runny like water
    answer: fragile
    difficulty: 2
    hints:
    - It breaks easily.
    - Handle with care.
    solution: 'Glass is fragile: it breaks easily.'
    mistakes:
      soft as cotton: eng5_word
  - prompt: Why must glass be melted before making bangles?
    options:
    - So it can be bent into shape
    - To make it colder
    - To make it heavier
    answer: So it can be bent into shape
    difficulty: 1
    hints:
    - Solid glass cannot bend.
    - Heat makes it soft.
    solution: 'Step 1: hard glass breaks if bent. Step 2: melting makes it soft to shape.'
    mistakes:
      To make it colder: c5e10_make
      To make it heavier: c5e10_make
  - prompt: 'A furnace is:'
    options:
    - A very hot oven
    - A cold fridge
    - A water tank
    answer: A very hot oven
    difficulty: 1
    hints:
    - It melts glass.
    - It gets extremely hot.
    solution: 'Step 1: glass melts at great heat. Step 2: a furnace is a very hot oven.'
    mistakes:
      A cold fridge: c5e10_word
      A water tank: c5e10_word
  - prompt: Which comes right after drawing glass into coils?
    options:
    - Cutting the coils into rings
    - Melting the glass
    - Wearing the bangles
    answer: Cutting the coils into rings
    difficulty: 2
    hints:
    - Coils are long spirals.
    - Bangles are single rings.
    solution: 'Step 1: coils are long. Step 2: they are cut into rings next.'
    mistakes:
      Melting the glass: c5e10_make
      Wearing the bangles: c5e10_make
  - prompt: Which town is often called the 'City of Bangles'?
    options:
    - Firozabad
    - Kochi
    - Shimla
    answer: Firozabad
    difficulty: 1
    hints:
    - It is in Uttar Pradesh.
    - It is near Agra.
    solution: 'Step 1: the bangle town is near Agra. Step 2: Firozabad.'
    mistakes:
      Kochi: c5e10_place
      Shimla: c5e10_place
  - prompt: Why is bangle-making hard on workers?
    options:
    - They work near great heat for long hours
    - They work in snow
    - They do not need any skill
    answer: They work near great heat for long hours
    difficulty: 2
    hints:
    - Think of the furnaces.
    - The work goes on all day.
    solution: 'Step 1: furnaces are very hot. Step 2: workers sit near them for long hours.'
    mistakes:
      They work in snow: c5e10_work
      They do not need any skill: c5e10_work
  - prompt: How should we treat people who make the things we use?
    options:
    - With respect and fair pay
    - Ignore them
    - Laugh at their work
    answer: With respect and fair pay
    difficulty: 2
    hints:
    - Work is worship.
    - Their skill makes our lives better.
    solution: 'Step 1: all honest work has dignity. Step 2: workers deserve respect and fair pay.'
    mistakes:
      Ignore them: c5e10_work
      Laugh at their work: c5e10_work
  - prompt: 'Choose the right word: ''Handle the bangles gently; they are very ____.'''
    options:
    - fragile
    - strong
    - heavy
    answer: fragile
    difficulty: 2
    hints:
    - Why handle them gently?
    - They might break.
    solution: 'Step 1: gentle handling is needed. Step 2: because they are fragile.'
    mistakes:
      strong: c5e10_word
      heavy: c5e10_word
  - prompt: What does 'for generations' mean?
    options:
    - For many years, from grandparents to children
    - For one day
    - For a few minutes
    answer: For many years, from grandparents to children
    difficulty: 3
    hints:
    - A generation is one age group in a family.
    - Grandparents, parents, children.
    solution: 'Step 1: a generation is a family age group. Step 2: for generations = passed down over many years.'
    mistakes:
      For one day: c5e10_word
      For a few minutes: c5e10_word
  - prompt: Why do workers in hot furnaces need safety gear?
    options:
    - To protect them from burns and heat
    - To look fashionable
    - To keep the glass cold
    answer: To protect them from burns and heat
    difficulty: 3
    hints:
    - Melted glass is extremely hot.
    - What could happen to skin?
    solution: 'Step 1: melted glass can burn. Step 2: safety gear protects workers.'
    mistakes:
      To look fashionable: c5e10_work
      To keep the glass cold: c5e10_work
  - prompt: 'Case: A box of glass bangles is being sent by post to a relative. What should be written on the box?'
    options:
    - 'Fragile: handle with care'
    - 'Heavy: throw gently'
    - 'Soft: may bend'
    answer: 'Fragile: handle with care'
    hints:
    - What happens to glass if it is dropped?
    - Which word warns that something breaks easily?
    solution: 'Glass breaks easily, so the box should say ''Fragile: handle with care''.'
    mistakes:
      'Heavy: throw gently': c5e10_word
      'Soft: may bend': c5e10_word
    exam: case
    difficulty: 2
  - prompt: 'Situation: A worker has just cut long glass coils into rings. What is the next step in making the bangles?'
    options:
    - Join the ends of each ring and decorate it
    - Melt the rings back into a lump
    - Draw them out into coils again
    answer: Join the ends of each ring and decorate it
    hints:
    - 'List the steps: melt, draw into coils, cut, then what?'
    - What finishes a bangle?
    solution: After melting, drawing into coils and cutting into rings, each ring is joined and then decorated.
    mistakes:
      Melt the rings back into a lump: c5e10_make
      Draw them out into coils again: c5e10_make
    exam: competency
    difficulty: 2
