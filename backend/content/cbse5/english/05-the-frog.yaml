# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 5. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 5
title: 'The Frog (Unit 3: Water)'
concepts:
- code: cbse5e.u3.frog
  title: 'The Frog (Unit 3: Water)'
  notes: |
    A poem in which the frog speaks ('I'). It sits in ponds and in the rain and hops in muddy drains. As a tadpole it swam
    like a small fish and flicked its tongue to catch food. Now it lives on land and in water, in damp places with dew.
    Its colours match plants, so it hides in grass and leaves. It must beware of snakes. It croaks loudly, is proud of its
    pond, hops and jumps high and swims with webbed feet. Words: hop, muddy, flick, damp, dew, beware, croak, webbed.
  explanations:
    text: In this poem a frog tells us about its life. It hops in ponds and puddles, started life as a tadpole swimming like a fish, and now lives both on land and in water. Its colours help it hide, but it must watch out for snakes. It croaks proudly and swims with webbed feet.
    visual: Draw a pond with a tadpole swimming, a frog on a lily pad with webbed feet, and a snake hiding in the grass.
    step_by_step: 1. Who is speaking? The frog. 2. Where does it live? Ponds, land and water. 3. How does it stay safe? Hides by its colour, watches for snakes. 4. How does it move? Hops, jumps, swims.
    real_world: In the monsoon you can hear frogs croaking loudly near ponds and paddy fields.
  picture:
    kind: flow
    steps:
    - Egg
    - 'Tadpole: swims like a fish'
    - Grows legs
    - 'Frog: lives on land and in water'
    alt: 'A frog''s life: egg, tadpole swimming like a fish, growing legs, then a frog living on land and in water.'
  activity:
    type: order
    prompt: 'The Frog: put the frog''s life in order.'
    steps:
    - An egg in the pond
    - A tadpole swimming like a small fish
    - A frog with legs
    - Hopping on land and swimming in water
    reasons:
      A tadpole swimming like a small fish: The egg hatches.
      A frog with legs: The tadpole grows legs.
      Hopping on land and swimming in water: Now it lives in both places.
  items:
  - prompt: Who is speaking in the poem?
    options:
    - the frog
    - a snake
    - a fish
    - a child
    answer: the frog
    difficulty: 1
    hints:
    - Look for 'I'.
    - Title.
    solution: The frog speaks in the poem.
  - prompt: 'Before it was a frog, it was a:'
    options:
    - tadpole
    - caterpillar
    - chick
    - kitten
    answer: tadpole
    difficulty: 1
    hints:
    - It swam like a small fish.
    - Baby frog.
    solution: A baby frog is a tadpole.
    mistakes:
      caterpillar: eng5_read_again
  - prompt: Which animal must the frog beware of?
    options:
    - snakes
    - cows
    - butterflies
    - rabbits
    answer: snakes
    difficulty: 1
    hints:
    - A danger in the grass.
    - It eats frogs.
    solution: Snakes hunt frogs.
  - prompt: What sound does a frog make?
    options:
    - croak
    - moo
    - bark
    - roar
    answer: croak
    difficulty: 1
    hints:
    - Monsoon nights.
    - Ribbit.
    solution: Frogs croak.
  - prompt: How do webbed feet help the frog?
    options:
    - to swim with ease
    - to climb trees only
    - to dig holes
    - to fly
    answer: to swim with ease
    difficulty: 2
    hints:
    - Like flippers.
    - Water.
    solution: Webbed feet push water to swim.
  - prompt: What does 'damp' mean?
    options:
    - slightly wet
    - very hot
    - very dry
    - shiny
    answer: slightly wet
    difficulty: 2
    hints:
    - Frogs like it.
    - Like a cloth after drying a little.
    solution: Damp means slightly wet.
    mistakes:
      very dry: eng5_word
