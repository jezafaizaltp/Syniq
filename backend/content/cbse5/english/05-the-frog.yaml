# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 5. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 5
title: 'The Frog (Unit 3: Water)'
tips:
  e5_croak: "Frogs call loudly in the rain with a deep sound."
  e5_frog_enemy: "Which animal slithers in the grass and eats frogs?"
  e5_frog_speaker: "The poem's title tells you who says 'I'."
  e5_webbed: "Ducks have webbed feet too. What do ducks do in a pond?"
  c5e5_poem: Read the poem again as if you are the frog. What does it say about itself?
  c5e5_life: Think about how a frog changes as it grows, from egg to adult.
  c5e5_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?
  c5e5_body: Think how each part of the frog's body helps it live on land and in water.

concepts:
- code: cbse5e.u3.frog
  title: 'The Frog (Unit 3: Water)'
  notes: |
    A poem in which the frog speaks ('I'). It sits in ponds and in the rain and hops in muddy drains. As a tadpole it swam
    like a small fish and flicked its tongue to catch food. Now it lives on land and in water, in damp places with dew.
    Its colours match plants, so it hides in grass and leaves. It must beware of snakes. It croaks loudly, is proud of its
    pond, hops and jumps high and swims with webbed feet. Words: hop, muddy, flick, damp, dew, beware, croak, webbed.
  explanations:
    text: In this poem a frog tells us about its life. It hops in ponds and puddles, started life as a tadpole swimming like a fish, and now lives both on land and in water. Its colours help it hide, but it must watch out for snakes. It croaks proudly and swims with webbed feet.
    visual: Draw a pond with a tadpole swimming, a frog on a lily pad with webbed feet, and a snake hiding in the grass.
    step_by_step: 1. Who is speaking? The frog. 2. Where does it live? Ponds, land and water. 3. How does it stay safe? Hides by its colour, watches for snakes. 4. How does it move? Hops, jumps, swims.
    real_world: In the monsoon you can hear frogs croaking loudly near ponds and paddy fields.
  picture:
    kind: flow
    steps:
    - Egg
    - 'Tadpole: swims like a fish'
    - Grows legs
    - 'Frog: lives on land and in water'
    alt: 'A frog''s life: egg, tadpole swimming like a fish, growing legs, then a frog living on land and in water.'
  activity:
    type: order
    prompt: 'The Frog: put the frog''s life in order.'
    steps:
    - An egg in the pond
    - A tadpole swimming like a small fish
    - A frog with legs
    - Hopping on land and swimming in water
    reasons:
      A tadpole swimming like a small fish: The egg hatches.
      A frog with legs: The tadpole grows legs.
      Hopping on land and swimming in water: Now it lives in both places.
  lesson:
    - teach: In the poem 'The Frog', the frog itself speaks, using 'I'. It sits in ponds and in the rain and hops in muddy drains. It lives both on land and in water.
      check:
        prompt: Who says 'I' in the poem?
        options:
        - The frog
        - A snake
        - A child
        answer: The frog
        why: The frog tells its own story.
    - teach: 'The frog remembers being a tadpole: it swam like a small fish and flicked its tongue to catch food. Now it lives in damp places, and its colours match the plants so it can hide in grass and leaves.'
      picture:
        kind: flow
        steps:
        - Egg in water
        - Tadpole swims
        - Grows legs
        - Frog on land and water
        alt: A frog's life from egg to tadpole to adult frog.
      check:
        prompt: Why do the frog's colours match the plants?
        options:
        - So it can hide
        - So it can fly
        - So it stays dry
        answer: So it can hide
        why: Matching colours help it stay unseen.
    - teach: 'The frog must beware of snakes. It croaks loudly, hops and jumps high, and swims with webbed feet. New words: hop, muddy, flick, damp (slightly wet), dew, beware, croak, webbed.'
      check:
        prompt: What does 'beware' mean?
        options:
        - Be careful of danger
        - Be happy
        - Be asleep
        answer: Be careful of danger
        why: The frog must watch out for snakes.
  items:
  - prompt: Who is speaking in the poem?
    options:
    - the frog
    - a snake
    - a fish
    - a child
    answer: the frog
    difficulty: 1
    hints:
    - Look for 'I'.
    - Title.
    solution: The frog speaks in the poem.
    mistakes: {"a child": "e5_frog_speaker"}
  - prompt: 'Before it was a frog, it was a:'
    options:
    - tadpole
    - caterpillar
    - chick
    - kitten
    answer: tadpole
    difficulty: 1
    hints:
    - It swam like a small fish.
    - Baby frog.
    solution: A baby frog is a tadpole.
    mistakes:
      caterpillar: eng5_read_again
  - prompt: Which animal must the frog beware of?
    options:
    - snakes
    - cows
    - butterflies
    - rabbits
    answer: snakes
    difficulty: 1
    hints:
    - A danger in the grass.
    - It eats frogs.
    solution: Snakes hunt frogs.
    mistakes: {"butterflies": "e5_frog_enemy"}
  - prompt: What sound does a frog make?
    options:
    - croak
    - moo
    - bark
    - roar
    answer: croak
    difficulty: 1
    hints:
    - Monsoon nights.
    - Ribbit.
    solution: Frogs croak.
    mistakes: {"bark": "e5_croak"}
  - prompt: How do webbed feet help the frog?
    options:
    - to swim with ease
    - to climb trees only
    - to dig holes
    - to fly
    answer: to swim with ease
    difficulty: 2
    hints:
    - Like flippers.
    - Water.
    solution: Webbed feet push water to swim.
    mistakes: {"to fly": "e5_webbed"}
  - prompt: What does 'damp' mean?
    options:
    - slightly wet
    - very hot
    - very dry
    - shiny
    answer: slightly wet
    difficulty: 2
    hints:
    - Frogs like it.
    - Like a cloth after drying a little.
    solution: Damp means slightly wet.
    mistakes:
      very dry: eng5_word
  - prompt: Where does the frog like to sit?
    options:
    - In ponds and in the rain
    - In a hot oven
    - On a dry desert rock all day
    answer: In ponds and in the rain
    difficulty: 1
    hints:
    - Frogs like wet places.
    - The poem talks about water.
    solution: 'Step 1: frogs need damp places. Step 2: the poem says ponds and rain.'
    mistakes:
      In a hot oven: c5e5_poem
      On a dry desert rock all day: c5e5_poem
  - prompt: How does a tadpole move?
    options:
    - It swims like a small fish
    - It flies
    - It hops on land
    answer: It swims like a small fish
    difficulty: 1
    hints:
    - Tadpoles have tails, not legs.
    - They live only in water.
    solution: 'Step 1: tadpoles live in water. Step 2: they swim with their tails.'
    mistakes:
      It flies: c5e5_life
      It hops on land: c5e5_life
  - prompt: What does 'dew' mean?
    options:
    - Tiny water drops on grass in the morning
    - A kind of insect
    - A loud noise
    answer: Tiny water drops on grass in the morning
    difficulty: 2
    hints:
    - You see it on leaves early in the day.
    - It is wet and shiny.
    solution: 'Step 1: in the morning grass is wet. Step 2: those drops are dew.'
    mistakes:
      A kind of insect: c5e5_word
      A loud noise: c5e5_word
  - prompt: How does a frog catch insects?
    options:
    - By flicking out its long tongue
    - With its tail
    - By using a net
    answer: By flicking out its long tongue
    difficulty: 2
    hints:
    - The poem uses the word 'flick'.
    - Something shoots out of its mouth.
    solution: 'Step 1: frogs have long sticky tongues. Step 2: they flick them out to catch insects.'
    mistakes:
      With its tail: c5e5_body
      By using a net: c5e5_body
  - prompt: Which word describes a frog's feet?
    options:
    - Webbed
    - Hairy
    - Hooved
    answer: Webbed
    difficulty: 1
    hints:
    - Skin joins the toes.
    - Like a duck's feet.
    solution: 'Step 1: frog toes are joined by skin. Step 2: they are webbed.'
    mistakes:
      Hairy: c5e5_body
      Hooved: c5e5_body
  - prompt: 'Choose the right word: ''The frog ____ from leaf to leaf.'''
    options:
    - hops
    - flies
    - crawls slowly like a snail
    answer: hops
    difficulty: 1
    hints:
    - Frogs use strong back legs.
    - Short jumps.
    solution: 'Step 1: frogs jump with back legs. Step 2: ''hops'' fits.'
    mistakes:
      flies: c5e5_word
      crawls slowly like a snail: c5e5_word
  - prompt: Why does a frog live in damp places?
    options:
    - Its skin must stay moist
    - It hates water
    - It likes hot sand
    answer: Its skin must stay moist
    difficulty: 3
    hints:
    - Frog skin is thin and wet.
    - What happens if it dries out?
    solution: 'Step 1: frogs have thin, moist skin. Step 2: they need damp places so it does not dry.'
    mistakes:
      It hates water: c5e5_body
      It likes hot sand: c5e5_body
  - prompt: What is the frog proud of in the poem?
    options:
    - Its pond
    - Its feathers
    - Its long ears
    answer: Its pond
    difficulty: 2
    hints:
    - It is the frog's home.
    - Frogs do not have feathers.
    solution: 'Step 1: the frog loves its home. Step 2: it is proud of its pond.'
    mistakes:
      Its feathers: c5e5_poem
      Its long ears: c5e5_poem
  - prompt: 'A frog lives both on land and in water. Such an animal is called:'
    options:
    - An amphibian
    - A mammal
    - A bird
    answer: An amphibian
    difficulty: 3
    hints:
    - '''Amphi'' means both.'
    - Toads and salamanders are in this group too.
    solution: 'Step 1: frogs live in two places. Step 2: animals like that are amphibians.'
    mistakes:
      A mammal: c5e5_life
      A bird: c5e5_life
