# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 8. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 8
title: 'The Decision of the Panchayat (Unit 4: Ups and Downs)'
tips:
  e5_justice: "A fair judge decides by what is right, not by friendship."
  e5_panch: "'Panch' is a number word. Think of Punjab, the land of that many rivers."
  e5_panchayat: "A panchayat is a group of village elders who decide disputes."
  e5_premchand: "Premchand was from near Varanasi and wrote in the languages of north India."
  c5e8_panch: Think about who sits in a village council and what their job is.
  c5e8_fair: A fair judge looks only at what is right, not at who is a friend.
  c5e8_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?
  c5e8_feel: Think how each person would feel, from what happens to them in the story.

concepts:
- code: cbse5e.u4.panchayat
  title: 'The Decision of the Panchayat (Unit 4: Ups and Downs)'
  notes: |
    A story about a village panchayat (council of five elders) settling a quarrel. The well-known tale on this theme is
    Premchand's 'Panch Parmeshwar': two close friends, Jumman and Algu, fall out when one must judge the other's case,
    and each, sitting as the panch, gives a fair decision even against his friend, because the panch's seat demands
    justice. Message: a judge must be fair to everyone, even friends. Exact details of the NCERT version are not
    reproduced here.
  explanations:
    text: This story is about a village panchayat, a group of respected people who settle quarrels. When someone sits in the judge's seat, they must be fair to everyone, even to a close friend. Doing what is right is more important than pleasing a friend.
    visual: Draw five elders sitting under a big banyan tree, with two villagers standing before them waiting for the decision.
    step_by_step: 1. What is the quarrel about? 2. Who is the judge? 3. Is the judge tempted to favour a friend? 4. What fair decision is made? 5. What is the lesson?
    real_world: Gram panchayats still run Indian villages today, deciding on roads, water and local disputes.
  picture:
    kind: flow
    steps:
    - A quarrel in the village
    - The panchayat meets
    - Each side speaks
    - A fair decision, even against a friend
    alt: A quarrel in the village goes to the panchayat; both sides speak; the panch gives a fair decision, even against a friend.
  activity:
    type: sort
    prompt: 'The Decision of the Panchayat: fair or unfair?'
    bins:
    - Fair judge
    - Unfair
    items:
    - label: Listens to both sides
      bin: Fair judge
      clue: Before deciding.
      why: A fair judge hears everyone.
    - label: Favours a friend
      bin: Unfair
      clue: Even against a friend.
      why: Taking a friend's side is unfair.
    - label: Decides by what is right
      bin: Fair judge
      clue: The panch's seat.
      why: That's what the seat demands.
    - label: Decides before hearing
      bin: Unfair
      clue: Too quick.
      why: Deciding without listening is unfair.
  lesson:
    - teach: A panchayat is a village council that settles quarrels and looks after village matters. 'Panch' means five, because traditionally five respected elders sat on it. Their decision was respected by everyone.
      check:
        prompt: Why was it called a panchayat?
        options:
        - It had five members
        - It met on Fridays
        - It had a big tree
        answer: It had five members
        why: '''Panch'' means five.'
    - teach: In the well-known story by Premchand on this theme, two close friends fall out. Each, when sitting as the panch, must judge a case in which the other is involved, and each gives a fair decision, even if it upsets his friend.
      picture:
        kind: flow
        steps:
        - Two friends quarrel
        - A case comes to the panchayat
        - A friend must judge
        - He decides fairly
        - Friendship is restored by trust
        alt: The story moves from a quarrel to a fair decision that restores trust.
      check:
        prompt: What did the friend do when he had to judge?
        options:
        - Decided fairly
        - Helped his friend win anyway
        - Ran away
        answer: Decided fairly
        why: The judge's seat demands fairness.
    - teach: 'The message: a judge must be fair to everyone, even friends. When people see fair decisions, they trust each other again. New word: ''decision'' means a choice made after thinking.'
      check:
        prompt: What builds trust in a village?
        options:
        - Fair decisions
        - Taking sides with friends
        - Shouting
        answer: Fair decisions
        why: People trust a judge who is fair to all.
  items:
  - prompt: 'A panchayat is:'
    options:
    - a village council that settles matters
    - a kind of food
    - a school subject
    - a festival
    answer: a village council that settles matters
    difficulty: 1
    hints:
    - Panch = five.
    - Elders.
    solution: A panchayat is a village council.
    mistakes: {"a festival": "e5_panchayat"}
  - prompt: '''Panch'' means:'
    options:
    - five
    - ten
    - one
    - hundred
    answer: five
    difficulty: 1
    hints:
    - "Think of a panchayat: how many elders traditionally sat in one?"
    - Count.
    solution: Panch means five.
    mistakes: {"ten": "e5_panch"}
  - prompt: What should a judge always be?
    options:
    - fair to everyone
    - kind only to friends
    - angry
    - in a hurry
    answer: fair to everyone
    difficulty: 1
    hints:
    - Justice.
    - Same for all.
    solution: A judge must be fair to all.
    mistakes:
      kind only to friends: eng5_read_again
  - prompt: 'Premchand, who wrote ''Panch Parmeshwar'', wrote mainly in:'
    options:
    - Hindi and Urdu
    - Malayalam
    - French
    - Tamil
    answer: Hindi and Urdu
    difficulty: 2
    hints:
    - A famous North Indian writer.
    - Godaan.
    solution: Premchand wrote in Hindi and Urdu.
    mistakes: {"Malayalam": "e5_premchand"}
  - prompt: What is the main lesson of a story like this?
    options:
    - do what is right even if a friend is unhappy
    - always take your friend's side
    - never go to the panchayat
    - quarrels are fun
    answer: do what is right even if a friend is unhappy
    difficulty: 2
    hints:
    - Fairness over friendship.
    - Justice.
    solution: Justice must come before friendship.
    mistakes: {"always take your friend's side": "e5_justice"}
  - prompt: What does 'decision' mean?
    options:
    - a choice made after thinking
    - a loud noise
    - a game
    - a gift
    answer: a choice made after thinking
    difficulty: 2
    hints:
    - The panchayat makes one.
    - Decide.
    solution: A decision is a choice made after thinking.
    mistakes:
      a game: eng5_word
  - prompt: Who sits on a panchayat?
    options:
    - Respected people chosen by the village
    - Only children
    - Visitors from another country
    answer: Respected people chosen by the village
    difficulty: 1
    hints:
    - They help settle village quarrels.
    - People look up to them.
    solution: 'Step 1: the panchayat makes decisions. Step 2: respected villagers sit on it.'
    mistakes:
      Only children: c5e8_panch
      Visitors from another country: c5e8_panch
  - prompt: 'A judge''s friend is in a case. A fair judge will:'
    options:
    - Decide only by what is right
    - Always support the friend
    - Refuse to listen
    answer: Decide only by what is right
    difficulty: 1
    hints:
    - Fair means the same for everyone.
    - Friendship should not change the result.
    solution: 'Step 1: fairness ignores friendship. Step 2: decide only by what is right.'
    mistakes:
      Always support the friend: c5e8_fair
      Refuse to listen: c5e8_fair
  - prompt: Which word means the opposite of 'fair'?
    options:
    - Unfair
    - Just
    - Honest
    answer: Unfair
    difficulty: 1
    hints:
    - Add a prefix that means not.
    - Just and honest are like fair.
    solution: 'Step 1: un- means not. Step 2: unfair is the opposite.'
    mistakes:
      Just: c5e8_word
      Honest: c5e8_word
  - prompt: How might the friend feel when the decision goes against him?
    options:
    - Upset at first
    - Very proud of losing
    - Sleepy
    answer: Upset at first
    difficulty: 2
    hints:
    - He hoped his friend would help him.
    - Losing a case hurts.
    solution: 'Step 1: he expected help. Step 2: he would feel upset at first.'
    mistakes:
      Very proud of losing: c5e8_feel
      Sleepy: c5e8_feel
  - prompt: Later, why might the two friends trust each other more?
    options:
    - Each saw the other was honest and fair
    - They forgot everything
    - They moved away
    answer: Each saw the other was honest and fair
    difficulty: 3
    hints:
    - Both acted fairly as judges.
    - Honesty builds trust.
    solution: 'Step 1: both judged fairly. Step 2: seeing that honesty rebuilt their trust.'
    mistakes:
      They forgot everything: c5e8_feel
      They moved away: c5e8_feel
  - prompt: 'Choose the right word: ''After a long talk, the panch gave his ____.'''
    options:
    - decision
    - dinner
    - drawing
    answer: decision
    difficulty: 1
    hints:
    - A judge makes a choice.
    - What does a panch give after thinking?
    solution: 'Step 1: judges make choices. Step 2: ''decision''.'
    mistakes:
      dinner: c5e8_word
      drawing: c5e8_word
  - prompt: 'Premchand is famous as a writer of:'
    options:
    - Stories about village life
    - Science fiction about robots
    - Cookery books
    answer: Stories about village life
    difficulty: 2
    hints:
    - He wrote 'Panch Parmeshwar'.
    - His stories show ordinary villagers.
    solution: 'Step 1: Premchand wrote about villagers. Step 2: stories of village life.'
    mistakes:
      Science fiction about robots: c5e8_panch
      Cookery books: c5e8_panch
  - prompt: Which is the best example of being fair in class?
    options:
    - Giving everyone a turn to speak
    - Letting only friends answer
    - Ignoring quiet children
    answer: Giving everyone a turn to speak
    difficulty: 2
    hints:
    - Fair means the same chance for all.
    - Who should get a turn?
    solution: 'Step 1: fairness = equal chances. Step 2: everyone gets a turn.'
    mistakes:
      Letting only friends answer: c5e8_fair
      Ignoring quiet children: c5e8_fair
  - prompt: What does 'settle a quarrel' mean?
    options:
    - End a fight by agreeing on what is fair
    - Start a new fight
    - Run from a fight
    answer: End a fight by agreeing on what is fair
    difficulty: 3
    hints:
    - '''Settle'' means bring to rest.'
    - The panchayat does this.
    solution: 'Step 1: a quarrel is a fight. Step 2: settling it means ending it fairly.'
    mistakes:
      Start a new fight: c5e8_word
      Run from a fight: c5e8_word
