# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 8. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 8
title: 'The Decision of the Panchayat (Unit 4: Ups and Downs)'
tips:
  e5_justice: "A fair judge decides by what is right, not by friendship."
  e5_panch: "'Panch' is a number word. Think of Punjab, the land of that many rivers."
  e5_panchayat: "A panchayat is a group of village elders who decide disputes."
  e5_premchand: "Premchand was from near Varanasi and wrote in the languages of north India."

concepts:
- code: cbse5e.u4.panchayat
  title: 'The Decision of the Panchayat (Unit 4: Ups and Downs)'
  notes: |
    A story about a village panchayat (council of five elders) settling a quarrel. The well-known tale on this theme is
    Premchand's 'Panch Parmeshwar': two close friends, Jumman and Algu, fall out when one must judge the other's case,
    and each, sitting as the panch, gives a fair decision even against his friend, because the panch's seat demands
    justice. Message: a judge must be fair to everyone, even friends. Exact details of the NCERT version are not
    reproduced here.
  explanations:
    text: This story is about a village panchayat, a group of respected people who settle quarrels. When someone sits in the judge's seat, they must be fair to everyone, even to a close friend. Doing what is right is more important than pleasing a friend.
    visual: Draw five elders sitting under a big banyan tree, with two villagers standing before them waiting for the decision.
    step_by_step: 1. What is the quarrel about? 2. Who is the judge? 3. Is the judge tempted to favour a friend? 4. What fair decision is made? 5. What is the lesson?
    real_world: Gram panchayats still run Indian villages today, deciding on roads, water and local disputes.
  picture:
    kind: flow
    steps:
    - A quarrel in the village
    - The panchayat meets
    - Each side speaks
    - A fair decision, even against a friend
    alt: A quarrel in the village goes to the panchayat; both sides speak; the panch gives a fair decision, even against a friend.
  activity:
    type: sort
    prompt: 'The Decision of the Panchayat: fair or unfair?'
    bins:
    - Fair judge
    - Unfair
    items:
    - label: Listens to both sides
      bin: Fair judge
      clue: Before deciding.
      why: A fair judge hears everyone.
    - label: Favours a friend
      bin: Unfair
      clue: Even against a friend.
      why: Taking a friend's side is unfair.
    - label: Decides by what is right
      bin: Fair judge
      clue: The panch's seat.
      why: That's what the seat demands.
    - label: Decides before hearing
      bin: Unfair
      clue: Too quick.
      why: Deciding without listening is unfair.
  items:
  - prompt: 'A panchayat is:'
    options:
    - a village council that settles matters
    - a kind of food
    - a school subject
    - a festival
    answer: a village council that settles matters
    difficulty: 1
    hints:
    - Panch = five.
    - Elders.
    solution: A panchayat is a village council.
    mistakes: {"a festival": "e5_panchayat"}
  - prompt: '''Panch'' means:'
    options:
    - five
    - ten
    - one
    - hundred
    answer: five
    difficulty: 1
    hints:
    - "Think of a panchayat: how many elders traditionally sat in one?"
    - Count.
    solution: Panch means five.
    mistakes: {"ten": "e5_panch"}
  - prompt: What should a judge always be?
    options:
    - fair to everyone
    - kind only to friends
    - angry
    - in a hurry
    answer: fair to everyone
    difficulty: 1
    hints:
    - Justice.
    - Same for all.
    solution: A judge must be fair to all.
    mistakes:
      kind only to friends: eng5_read_again
  - prompt: 'Premchand, who wrote ''Panch Parmeshwar'', wrote mainly in:'
    options:
    - Hindi and Urdu
    - Malayalam
    - French
    - Tamil
    answer: Hindi and Urdu
    difficulty: 2
    hints:
    - A famous North Indian writer.
    - Godaan.
    solution: Premchand wrote in Hindi and Urdu.
    mistakes: {"Malayalam": "e5_premchand"}
  - prompt: What is the main lesson of a story like this?
    options:
    - do what is right even if a friend is unhappy
    - always take your friend's side
    - never go to the panchayat
    - quarrels are fun
    answer: do what is right even if a friend is unhappy
    difficulty: 2
    hints:
    - Fairness over friendship.
    - Justice.
    solution: Justice must come before friendship.
    mistakes: {"always take your friend's side": "e5_justice"}
  - prompt: What does 'decision' mean?
    options:
    - a choice made after thinking
    - a loud noise
    - a game
    - a gift
    answer: a choice made after thinking
    difficulty: 2
    hints:
    - The panchayat makes one.
    - Decide.
    solution: A decision is a choice made after thinking.
    mistakes:
      a game: eng5_word
