# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 2. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 2
title: 'Gone with the Scooter (Unit 1: Let''s Have Fun)'
tips:
  e5_biography: "'Bio' means life and 'graphy' means writing. About a real or made-up person?"
  e5_outdoor: "Chess and carrom are played at a table. Which one needs a big field?"
  e5_stairs: "You climb these to go up, not sit on them."
  e5_wizard: "Sachin played cricket. The hockey wizard's birthday is National Sports Day."
  c5e2_sound: Say each word slowly and listen for the letters in the middle.
  c5e2_game: Think about where the game is played and what you need for it.
  c5e2_bio: A life story is about a real person. Think who writes it and what it tells.
  c5e2_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?

concepts:
- code: cbse5e.u1.scooter
  title: 'Gone with the Scooter (Unit 1: Let''s Have Fun)'
  notes: |
    A light-hearted story in the unit 'Let's Have Fun'. The chapter's activities are about words with 'ai' in the middle
    (train, stairs, chair, rain, paint), games (the board game Tigers and Goats: 3 tigers try to capture 5 goats; 13 goats
    try to trap the tigers), indoor and outdoor games (Kabaddi), and writing a short biography of a sportsperson such as
    a famous hockey player (Major Dhyan Chand). Story details are not reproduced here.
  explanations:
    text: This chapter is about having fun. Its activities practise words with 'ai' in them, like train, chair and rain. It also teaches a board game called Tigers and Goats, and asks you to sort games into indoor and outdoor games and write about a sports star.
    visual: Draw a board with lines crossing. Put 3 big pebbles for tigers and 13 small pebbles for goats.
    step_by_step: 1. Read the story and enjoy it. 2. Find the 'ai' words. 3. Learn the game rules. 4. Sort games as indoor or outdoor.
    real_world: Board games like Tigers and Goats (Bagh-Chal) have been played in India and Nepal for hundreds of years.
  picture:
    kind: compare
    columns:
    - title: Indoor games
      points:
      - chess
      - carrom
      - Tigers and Goats
    - title: Outdoor games
      points:
      - kabaddi
      - hockey
      - kho-kho
    alt: Indoor games include chess, carrom and Tigers and Goats; outdoor games include kabaddi, hockey and kho-kho.
  activity:
    type: sort
    prompt: Which words have 'ai' in the middle?
    bins:
    - Has 'ai'
    - No 'ai'
    items:
    - label: train
      bin: Has 'ai'
      clue: t-r-?-?-n
      why: 't-r-ai-n: the ''ai'' makes the long ''ay'' sound.'
    - label: chair
      bin: Has 'ai'
      clue: Look between ch and r.
      why: ch-ai-r has 'ai' in the middle.
    - label: game
      bin: No 'ai'
      clue: Same sound, but which letters?
      why: '''game'' sounds like ''ai'' but is spelt with a-e.'
    - label: rain
      bin: Has 'ai'
      clue: r-?-?-n
      why: r-ai-n.
    - label: cake
      bin: No 'ai'
      clue: Look at the spelling, not the sound.
      why: '''cake'' uses a-e, not ''ai''.'
    - label: paint
      bin: Has 'ai'
      clue: p-?-?-n-t
      why: p-ai-n-t.
  lesson:
    - teach: 'This unit, ''Let''s Have Fun'', is about play and laughter. Many words have ''ai'' in the middle and make a long ''ay'' sound: train, rain, chair, stairs, paint.'
      check:
        prompt: Which word has the 'ai' sound?
        options:
        - Rain
        - Run
        - Ring
        answer: Rain
        why: R-ai-n has 'ai' in the middle.
      ways:
      - style: visual
        teach: Some words with 'ai' in the middle that make the long 'ay' sound.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - rain
            - paint
            - mail
          - title: Sounds like
            points:
            - r-ay-n
            - p-ay-nt
            - m-ay-l
          alt: Rain sounds like r-ay-n, paint like p-ay-nt and mail like m-ay-l. The letters ai make the long ay sound.
      - style: step_by_step
        teach: 'Make new ''ai'' words. Step 1: Write ''ai'' in the middle of a card. Step 2: Put ''r'' in front and ''n'' after: rain. Step 3: Change ''r'' to ''p'': pain. Step 4: Change ''n'' to ''l'': pail. Read each new word aloud.'
    - teach: 'Games can be indoor (played inside: carrom, chess, Tigers and Goats) or outdoor (played outside: kabaddi, kho-kho, cricket). In Tigers and Goats, 3 tigers try to capture goats, and the goats try to trap the tigers.'
      picture:
        kind: compare
        columns:
        - title: Indoor games
          points:
          - Carrom
          - Chess
          - Tigers and Goats
        - title: Outdoor games
          points:
          - Kabaddi
          - Kho-kho
          - Cricket
        alt: Indoor and outdoor games.
      check:
        prompt: Which is an indoor game?
        options:
        - Carrom
        - Kho-kho
        - Football
        answer: Carrom
        why: Carrom is played on a board at a table.
      ways:
      - style: visual
        teach: Indoor games and outdoor games, sorted into two groups.
        picture:
          kind: compare
          columns:
          - title: Indoor
            points:
            - Carrom
            - Ludo
            - Tigers and Goats
          - title: Outdoor
            points:
            - Kho-kho
            - Football
            - Hopscotch
          alt: Carrom, ludo and Tigers and Goats are indoor games. Kho-kho, football and hopscotch are outdoor games.
      - style: real_world
        teach: On a rainy day when the ground is muddy, children often bring out a carrom board or a board game. On a dry, sunny evening, the same children run outside to play in the open.
    - teach: 'A biography is the true story of a real person''s life, written by someone else. We can write a short biography of a sportsperson: when and where they were born, their game, and what they achieved.'
      check:
        prompt: 'A biography is about:'
        options:
        - A real person's life
        - A made-up dragon
        - How to cook rice
        answer: A real person's life
        why: Biographies tell true life stories.
      ways:
      - style: visual
        teach: What goes into a short biography of a sportsperson.
        picture:
          kind: flow
          steps:
          - Name of the person
          - When and where they were born
          - Which game they play
          - What they achieved
          - Why people admire them
          alt: A short biography gives the person's name, when and where they were born, which game they play, what they achieved and why people admire them.
      - style: real_world
        teach: 'Sports pages in newspapers often have a small box about a player: born in a town, started playing at age ten, won a big match. That box is a tiny biography.'
  items:
  - prompt: Which word has 'ai' in the middle?
    options:
    - train
    - tree
    - tiger
    - top
    answer: train
    difficulty: 1
    hints:
    - Look for the letters a and i together.
    - It runs on tracks.
    solution: 'Train: t-r-ai-n.'
    mistakes:
      tiger: eng5_word
  - prompt: Which 'ai' word means steps going up to the next floor?
    options:
    - stairs
    - chairs
    - pairs
    - hairs
    answer: stairs
    difficulty: 1
    hints:
    - You climb them.
    - In a building.
    solution: Stairs take you between floors.
    mistakes: {"chairs": "e5_stairs"}
  - prompt: In the game Tigers and Goats, how many tigers are there?
    options:
    - '3'
    - '13'
    - '5'
    - '1'
    answer: '3'
    difficulty: 1
    hints:
    - Fewer tigers than goats.
    - Three big pebbles.
    solution: There are 3 tigers.
    mistakes:
      '13': eng5_read_again
  - prompt: Which is an outdoor game?
    options:
    - kabaddi
    - chess
    - carrom
    - ludo
    answer: kabaddi
    difficulty: 1
    hints:
    - Played in a field.
    - Lots of running.
    solution: Kabaddi is played outdoors.
    mistakes: {"chess": "e5_outdoor"}
  - prompt: 'A biography is:'
    options:
    - "the story of a real person's life"
    - "a made-up fairy tale with magic"
    - "a list of games to play outside"
    - "a poem about the rain and clouds"
    answer: the story of a real person's life
    difficulty: 2
    hints:
    - Bio = life.
    - About a real person.
    solution: A biography tells a real person's life story.
    mistakes: {"a made-up fairy tale with magic": "e5_biography"}
  - prompt: Which famous Indian player is known as the wizard of hockey?
    options:
    - Major Dhyan Chand
    - Sachin Tendulkar
    - P. T. Usha
    - Viswanathan Anand
    answer: Major Dhyan Chand
    difficulty: 2
    hints:
    - Hockey.
    - National Sports Day is his birthday.
    solution: Major Dhyan Chand is called the wizard of hockey.
    mistakes: {"Sachin Tendulkar": "e5_wizard"}
  - prompt: Which of these words has the letters 'ai' together?
    options:
    - Paint
    - Pant
    - Point
    answer: Paint
    difficulty: 1
    hints:
    - Look at the two middle letters.
    - Which has a, then i?
    solution: 'Step 1: p-ai-nt. Step 2: paint has ''ai''.'
    mistakes:
      Pant: c5e2_sound
      Point: c5e2_sound
  - prompt: Which 'ai' word is something you sit on?
    options:
    - Chair
    - Train
    - Snail
    answer: Chair
    difficulty: 1
    hints:
    - It has four legs.
    - It is in your classroom.
    solution: 'Step 1: you sit on it. Step 2: chair.'
    mistakes:
      Train: c5e2_sound
      Snail: c5e2_sound
  - prompt: Which 'ai' word is a slow animal with a shell?
    options:
    - Snail
    - Tail
    - Mail
    answer: Snail
    difficulty: 2
    hints:
    - It carries its home on its back.
    - It moves very slowly.
    solution: 'Step 1: a shelled slow animal. Step 2: snail.'
    mistakes:
      Tail: c5e2_sound
      Mail: c5e2_sound
  - prompt: 'Kabaddi is played:'
    options:
    - Outdoors on a field
    - On a small board
    - In water
    answer: Outdoors on a field
    difficulty: 1
    hints:
    - Players run and tag each other.
    - It needs a lot of space.
    solution: 'Step 1: kabaddi needs running space. Step 2: it is played outdoors.'
    mistakes:
      On a small board: c5e2_game
      In water: c5e2_game
  - prompt: Which of these would be in a biography of a sportsperson?
    options:
    - The year they won a medal
    - A made-up magic spell
    - A recipe for cake
    answer: The year they won a medal
    difficulty: 2
    hints:
    - A biography gives true facts.
    - Which is about their real life?
    solution: 'Step 1: biographies tell real events. Step 2: winning a medal is a real event.'
    mistakes:
      A made-up magic spell: c5e2_bio
      A recipe for cake: c5e2_bio
  - prompt: 'A story you write about your OWN life is called:'
    options:
    - An autobiography
    - A biography
    - A poem
    answer: An autobiography
    difficulty: 3
    hints:
    - '''Auto'' means self.'
    - A biography is written by someone else.
    solution: 'Step 1: auto = self. Step 2: your own life story is an autobiography.'
    mistakes:
      A biography: c5e2_bio
      A poem: c5e2_bio
  - prompt: Which is NOT an outdoor game?
    options:
    - Chess
    - Kho-kho
    - Cricket
    answer: Chess
    difficulty: 1
    hints:
    - Two of these need a big field.
    - One is played on a board.
    solution: 'Step 1: kho-kho and cricket need a field. Step 2: chess is played indoors.'
    mistakes:
      Kho-kho: c5e2_game
      Cricket: c5e2_game
  - prompt: 'Choose the right word: ''We waited for the ____ at the station.'''
    options:
    - train
    - trail
    - tray
    answer: train
    difficulty: 2
    hints:
    - What comes to a station?
    - It runs on rails.
    solution: 'Step 1: stations are for trains. Step 2: ''train''.'
    mistakes:
      trail: c5e2_word
      tray: c5e2_word
  - prompt: Why do games help children?
    options:
    - "They build fitness, teamwork and fun"
    - "They make children lazy and tired"
    - "They stop children from learning"
    answer: They build fitness, teamwork and fun
    difficulty: 2
    hints:
    - Think of how you feel after playing.
    - Many games are played in teams.
    solution: 'Step 1: games move the body and need teams. Step 2: they build fitness, teamwork and joy.'
    mistakes:
      "They make children lazy and tired": c5e2_game
      "They stop children from learning": c5e2_game
  - prompt: 'Case: Arjun writes, ''I was born in Kochi. I started swimming when I was six.'' His friend writes, ''Mary Kom was born in Manipur. She became a world boxing champion.'' Which one is a biography?'
    options:
    - The friend's writing about Mary Kom
    - Arjun's writing about himself
    - Neither of them
    answer: The friend's writing about Mary Kom
    hints:
    - Who is each piece of writing about?
    - Is a biography written about yourself or about another real person?
    solution: A biography is the life story of a real person written by someone else. The friend wrote about Mary Kom, so that is a biography.
    mistakes:
      Arjun's writing about himself: c5e2_bio
      Neither of them: c5e2_bio
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class has a free period, but it is raining heavily outside. Which game is the best choice?'
    options:
    - Carrom
    - Kabaddi
    - Cricket
    answer: Carrom
    hints:
    - Can you play outside in heavy rain?
    - Which game is played indoors?
    solution: In heavy rain you have to stay inside, so an indoor game like carrom is the best choice.
    mistakes:
      Kabaddi: c5e2_game
      Cricket: c5e2_game
    exam: competency
    difficulty: 2
