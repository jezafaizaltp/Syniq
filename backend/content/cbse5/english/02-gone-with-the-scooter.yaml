# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 2. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 2
title: 'Gone with the Scooter (Unit 1: Let''s Have Fun)'
tips:
  e5_biography: "'Bio' means life and 'graphy' means writing. About a real or made-up person?"
  e5_outdoor: "Chess and carrom are played at a table. Which one needs a big field?"
  e5_stairs: "You climb these to go up, not sit on them."
  e5_wizard: "Sachin played cricket. The hockey wizard's birthday is National Sports Day."

concepts:
- code: cbse5e.u1.scooter
  title: 'Gone with the Scooter (Unit 1: Let''s Have Fun)'
  notes: |
    A light-hearted story in the unit 'Let's Have Fun'. The chapter's activities are about words with 'ai' in the middle
    (train, stairs, chair, rain, paint), games (the board game Tigers and Goats: 3 tigers try to capture 5 goats; 13 goats
    try to trap the tigers), indoor and outdoor games (Kabaddi), and writing a short biography of a sportsperson such as
    a famous hockey player (Major Dhyan Chand). Story details are not reproduced here.
  explanations:
    text: This chapter is about having fun. Its activities practise words with 'ai' in them, like train, chair and rain. It also teaches a board game called Tigers and Goats, and asks you to sort games into indoor and outdoor games and write about a sports star.
    visual: Draw a board with lines crossing. Put 3 big pebbles for tigers and 13 small pebbles for goats.
    step_by_step: 1. Read the story and enjoy it. 2. Find the 'ai' words. 3. Learn the game rules. 4. Sort games as indoor or outdoor.
    real_world: Board games like Tigers and Goats (Bagh-Chal) have been played in India and Nepal for hundreds of years.
  picture:
    kind: compare
    columns:
    - title: Indoor games
      points:
      - chess
      - carrom
      - Tigers and Goats
    - title: Outdoor games
      points:
      - kabaddi
      - hockey
      - kho-kho
    alt: Indoor games include chess, carrom and Tigers and Goats; outdoor games include kabaddi, hockey and kho-kho.
  activity:
    type: sort
    prompt: Which words have 'ai' in the middle?
    bins:
    - Has 'ai'
    - No 'ai'
    items:
    - label: train
      bin: Has 'ai'
      clue: t-r-?-?-n
      why: 't-r-ai-n: the ''ai'' makes the long ''ay'' sound.'
    - label: chair
      bin: Has 'ai'
      clue: Look between ch and r.
      why: ch-ai-r has 'ai' in the middle.
    - label: game
      bin: No 'ai'
      clue: Same sound, but which letters?
      why: '''game'' sounds like ''ai'' but is spelt with a-e.'
    - label: rain
      bin: Has 'ai'
      clue: r-?-?-n
      why: r-ai-n.
    - label: cake
      bin: No 'ai'
      clue: Look at the spelling, not the sound.
      why: '''cake'' uses a-e, not ''ai''.'
    - label: paint
      bin: Has 'ai'
      clue: p-?-?-n-t
      why: p-ai-n-t.
  items:
  - prompt: Which word has 'ai' in the middle?
    options:
    - train
    - tree
    - tiger
    - top
    answer: train
    difficulty: 1
    hints:
    - Look for the letters a and i together.
    - It runs on tracks.
    solution: 'Train: t-r-ai-n.'
    mistakes:
      tiger: eng5_word
  - prompt: Which 'ai' word means steps going up to the next floor?
    options:
    - stairs
    - chairs
    - pairs
    - hairs
    answer: stairs
    difficulty: 1
    hints:
    - You climb them.
    - In a building.
    solution: Stairs take you between floors.
    mistakes: {"chairs": "e5_stairs"}
  - prompt: In the game Tigers and Goats, how many tigers are there?
    options:
    - '3'
    - '13'
    - '5'
    - '1'
    answer: '3'
    difficulty: 1
    hints:
    - Fewer tigers than goats.
    - Three big pebbles.
    solution: There are 3 tigers.
    mistakes:
      '13': eng5_read_again
  - prompt: Which is an outdoor game?
    options:
    - kabaddi
    - chess
    - carrom
    - ludo
    answer: kabaddi
    difficulty: 1
    hints:
    - Played in a field.
    - Lots of running.
    solution: Kabaddi is played outdoors.
    mistakes: {"chess": "e5_outdoor"}
  - prompt: 'A biography is:'
    options:
    - the story of a real person's life
    - a made-up fairy tale
    - a list of games
    - a poem about rain
    answer: the story of a real person's life
    difficulty: 2
    hints:
    - Bio = life.
    - About a real person.
    solution: A biography tells a real person's life story.
    mistakes: {"a made-up fairy tale": "e5_biography"}
  - prompt: Which famous Indian player is known as the wizard of hockey?
    options:
    - Major Dhyan Chand
    - Sachin Tendulkar
    - P. T. Usha
    - Viswanathan Anand
    answer: Major Dhyan Chand
    difficulty: 2
    hints:
    - Hockey.
    - National Sports Day is his birthday.
    solution: Major Dhyan Chand is called the wizard of hockey.
    mistakes: {"Sachin Tendulkar": "e5_wizard"}
