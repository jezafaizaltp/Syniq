# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 1. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 1
title: 'Papa''s Spectacles (Unit 1: Let''s Have Fun)'
tips:
  eng5_read_again: Go back to the story or poem and find the part about this person or event. The answer is there.
  eng5_word: Say the word in a sentence of your own. Does the meaning fit?
  eng5_grammar: Read the sentence aloud with each choice. Which one sounds right and fits the rule?
  e5_funny: "The funny part is where the lost thing was all along."
  e5_papa_specs: "The title gives the clue: what was Papa missing?"
  e5_spectacles: "Spectacles help people see. Where do you wear them?"
  c5e1_story: 'Go back over the story in order: what was lost, where Papa looked, and how it ended.'
  c5e1_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?
  c5e1_feel: Think how a person would feel in that moment, from what they do and say.
  c5e1_gram: Look at who is doing the action and when. That tells you which form fits.
concepts:
- code: cbse5e.u1.spectacles
  title: 'Papa''s Spectacles (Unit 1: Let''s Have Fun)'
  notes: |
    Papa has lost his only pair of spectacles. Without them he cannot read the newspaper, watch TV or cut vegetables.
    He searches his pockets, under his chair, near the window, everywhere. At last his child walks up and points out
    that the spectacles are on Papa's own head. A funny story about looking everywhere except the obvious place.
    Words: spectacles (glasses), pair, glanced (looked quickly), searching (looking carefully).
  explanations:
    text: Papa cannot find his spectacles, so he cannot read, watch TV or cut vegetables. He looks in his pockets, under his chair and by the window. In the end his child shows him the spectacles were on his head the whole time!
    visual: Draw Papa bending under a chair, looking very worried, with his spectacles sitting on top of his head. A child is pointing and laughing.
    step_by_step: 1. Who lost something? Papa. 2. What did he lose? His spectacles. 3. Where did he look? Pockets, chair, window. 4. Where were they? On his head.
    real_world: Have you ever looked everywhere for something that was in your hand or pocket? Many grown-ups lose their glasses this way.
  picture:
    kind: flow
    steps:
    - Papa loses his spectacles
    - Can't read, watch TV or cut vegetables
    - Searches pockets, chair, window
    - 'Child: ''They''re on your head!'''
    alt: Papa loses his spectacles, cannot read or watch TV, searches everywhere, and his child shows him they are on his head.
  activity:
    type: sort
    prompt: 'Papa''s Spectacles: where did Papa look?'
    bins:
    - Papa searched here
    - The spectacles really were
    items:
    - label: In his pockets
      bin: Papa searched here
      clue: He felt inside them first.
      why: Papa looked in his pockets, but they weren't there.
    - label: Under his chair
      bin: Papa searched here
      clue: He bent down to look.
      why: He looked under the chair and found nothing.
    - label: Near the window
      bin: Papa searched here
      clue: Another place he tried.
      why: The window was one more wrong place.
    - label: On his own head
      bin: The spectacles really were
      clue: The child points it out.
      why: 'They were on his head all the time: the funny ending.'
  lesson:
    - teach: In 'Papa's Spectacles', Papa has lost his only pair of spectacles (glasses). Without them he cannot read the newspaper, watch TV or cut vegetables.
      check:
        prompt: Why does Papa need his spectacles?
        options:
        - To see clearly
        - To hear better
        - To walk faster
        answer: To see clearly
        why: Spectacles help the eyes see.
      ways:
      - style: visual
        teach: What Papa could not do because his spectacles were missing.
        picture:
          kind: compare
          columns:
          - title: Problem
            points:
            - Spectacles are lost
          - title: So Papa cannot
            points:
            - Read the newspaper
            - Watch TV
            - Cut vegetables
          alt: Papa's spectacles are lost, so he cannot read the newspaper, watch TV or cut vegetables.
      - style: real_world
        teach: Many grandparents hold a phone far away and squint to read a message when their glasses are not on. Spectacles help people who cannot see clearly up close or far away.
    - teach: 'Papa searches everywhere: his pockets, under his chair, near the window. At last his child points out that the spectacles were on Papa''s own head all along.'
      picture:
        kind: flow
        steps:
        - Papa loses his spectacles
        - Cannot read or watch TV
        - Searches everywhere
        - Child points to his head
        alt: The story moves from losing the spectacles to finding them on Papa's head.
      check:
        prompt: Who finds the spectacles?
        options:
        - Papa's child
        - The neighbour
        - The postman
        answer: Papa's child
        why: The child notices them on Papa's head.
      ways:
      - style: step_by_step
        teach: 'Retell the story in four steps. Step 1: The problem: Papa loses his spectacles. Step 2: The search: he looks in many places. Step 3: The surprise: his child spots them. Step 4: The ending: they were close to him all the time.'
      - style: real_world
        teach: Have you ever hunted for a pencil and then found it tucked behind your ear? That kind of 'it was here all along' moment is what makes a story like this one funny.
    - teach: 'The story is funny because Papa looks everywhere except the most obvious place. New words: ''glanced'' means looked quickly; ''searching'' means looking carefully; a ''pair'' means two that go together.'
      check:
        prompt: What does 'searching' mean?
        options:
        - Looking carefully for something
        - Sleeping
        - Running away
        answer: Looking carefully for something
        why: Papa was searching for his glasses.
      ways:
      - style: visual
        teach: New words from the story and what each one means.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - glanced
            - searching
            - pair
          - title: Meaning
            points:
            - looked quickly
            - looking carefully
            - two that go together
          alt: Glanced means looked quickly. Searching means looking carefully. A pair means two that go together.
      - style: real_world
        teach: 'A pair can be many things: a pair of shoes, a pair of socks, a pair of earrings. Each time, it means two things that are used together.'
  items:
  - prompt: What did Papa lose?
    options:
    - his spectacles
    - his newspaper
    - his chair
    - his scooter
    answer: his spectacles
    difficulty: 1
    hints:
    - Look at the title.
    - He needs them to read.
    solution: Papa lost his spectacles.
    mistakes:
      his newspaper: eng5_read_again
  - prompt: Why couldn't Papa read the newspaper?
    options:
    - "he could not find his spectacles"
    - "the newspaper had got wet in the rain"
    - "it was night and the lights were off"
    - "he was fast asleep in his chair"
    answer: he could not find his spectacles
    difficulty: 1
    hints:
    - What helps him see?
    - Spectacles.
    solution: Without spectacles he could not read.
    mistakes: {"the newspaper had got wet in the rain": "e5_papa_specs"}
  - prompt: Where were the spectacles in the end?
    options:
    - on Papa's head
    - under the chair
    - near the window
    - in the kitchen
    answer: on Papa's head
    difficulty: 1
    hints:
    - The child pointed.
    - The funny ending.
    solution: They were on his own head all along.
    mistakes:
      under the chair: eng5_read_again
  - prompt: What does 'spectacles' mean?
    options:
    - glasses for the eyes
    - a kind of hat
    - a newspaper
    - shoes
    answer: glasses for the eyes
    difficulty: 1
    hints:
    - You wear them to see better.
    - On your nose.
    solution: Spectacles are glasses.
    mistakes: {"a kind of hat": "e5_spectacles"}
  - prompt: '''Papa glanced at the clock.'' What does ''glanced'' mean?'
    options:
    - looked quickly
    - stared for an hour
    - broke
    - climbed
    answer: looked quickly
    difficulty: 2
    hints:
    - A quick look.
    - Not for long.
    solution: To glance is to look quickly.
    mistakes:
      stared for an hour: eng5_word
  - prompt: Why is the story funny?
    options:
    - "Papa searched everywhere but the spectacles were on his head"
    - "Papa slipped and fell into a pond in the garden"
    - "the child lost one shoe on the way to school"
    - "the TV broke in the middle of a cartoon"
    answer: Papa searched everywhere but the spectacles were on his head
    difficulty: 2
    hints:
    - Think of the ending.
    - They were never lost.
    solution: It is funny because the spectacles were with him all the time.
    mistakes: {"Papa slipped and fell into a pond in the garden": "e5_funny"}
  - prompt: Which of these could Papa NOT do without his spectacles?
    options:
    - Read the newspaper
    - Hear the radio
    - Smell the food
    answer: Read the newspaper
    difficulty: 1
    hints:
    - Spectacles help with seeing.
    - Which needs good eyesight?
    solution: 'Step 1: spectacles help eyes. Step 2: reading needs clear sight.'
    mistakes:
      Hear the radio: c5e1_story
      Smell the food: c5e1_story
  - prompt: How do you think Papa felt while searching?
    options:
    - Worried and annoyed
    - Very sleepy
    - Proud
    answer: Worried and annoyed
    difficulty: 2
    hints:
    - He could not do his work.
    - How do you feel when you lose something?
    solution: 'Step 1: he could not read or cut vegetables. Step 2: he felt worried and annoyed.'
    mistakes:
      Very sleepy: c5e1_feel
      Proud: c5e1_feel
  - prompt: How did Papa probably feel when the spectacles were found on his head?
    options:
    - "Surprised and a little silly"
    - "Angry with the child for hiding them"
    - "Scared that he was losing his sight"
    answer: Surprised and a little silly
    difficulty: 2
    hints:
    - They were with him all the time.
    - Would you laugh at yourself?
    solution: 'Step 1: he had looked everywhere. Step 2: finding them on his head would feel surprising and silly.'
    mistakes:
      "Angry with the child for hiding them": c5e1_feel
      "Scared that he was losing his sight": c5e1_feel
  - prompt: A 'pair of spectacles' has how many lenses?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - One for each eye.
    - A pair means two.
    solution: 'Step 1: we have two eyes. Step 2: a pair has 2 lenses.'
    mistakes:
      '1': c5e1_word
      '4': c5e1_word
  - prompt: 'Choose the correct word: ''Papa ____ under the chair yesterday.'''
    options:
    - looked
    - looks
    - looking
    answer: looked
    difficulty: 2
    hints:
    - The word 'yesterday' tells us when.
    - It already happened.
    solution: 'Step 1: yesterday = past. Step 2: past tense is ''looked''.'
    mistakes:
      looks: c5e1_gram
      looking: c5e1_gram
  - prompt: Which word means the opposite of 'lost'?
    options:
    - Found
    - Missed
    - Dropped
    answer: Found
    difficulty: 1
    hints:
    - At the end of the story, the spectacles were ___.
    - Opposite of losing something.
    solution: 'Step 1: lost means cannot find. Step 2: the opposite is found.'
    mistakes:
      Missed: c5e1_word
      Dropped: c5e1_word
  - prompt: What lesson does this funny story teach?
    options:
    - "Stay calm and check the obvious places first"
    - "Never wear spectacles if you can help it"
    - "Do not read newspapers in the morning"
    answer: Stay calm and check the obvious places first
    difficulty: 3
    hints:
    - Where were the spectacles all along?
    - Papa missed the easiest place.
    solution: 'Step 1: they were on his head. Step 2: lesson: check obvious places calmly.'
    mistakes:
      "Never wear spectacles if you can help it": c5e1_story
      "Do not read newspapers in the morning": c5e1_story
  - prompt: Which sentence uses 'glanced' correctly?
    options:
    - "She glanced at her watch and hurried out."
    - "She glanced the ball very far over the wall."
    - "She glanced her lunch quickly at school."
    answer: She glanced at her watch and hurried out.
    difficulty: 3
    hints:
    - Glanced means looked quickly.
    - Which sentence is about looking?
    solution: 'Step 1: glanced = looked quickly. Step 2: only the watch sentence is about looking.'
    mistakes:
      "She glanced the ball very far over the wall.": c5e1_word
      "She glanced her lunch quickly at school.": c5e1_word
  - prompt: Where did Papa NOT search in the story?
    options:
    - On his own head
    - In his pockets
    - Under his chair
    answer: On his own head
    difficulty: 2
    hints:
    - That is why the story is funny.
    - Where were the spectacles?
    solution: 'Step 1: he searched pockets and under the chair. Step 2: he never checked his head.'
    mistakes:
      In his pockets: c5e1_story
      Under his chair: c5e1_story
  - prompt: 'Case: Riya cannot find the school bag. Riya looks under the bed, in the kitchen and in the car. Then Riya''s brother laughs and points: the bag is on Riya''s back. How is this like ''Papa''s Spectacles''?'
    options:
    - "The lost thing was on the person all the time"
    - "The lost thing had been stolen by a thief"
    - "Nobody ever found the lost thing at all"
    answer: The lost thing was on the person all the time
    hints:
    - Where was Riya's bag in the end?
    - Where were Papa's spectacles in the end?
    solution: In both stories, the person searches everywhere, but the lost thing was on them all along.
    mistakes:
      "The lost thing had been stolen by a thief": c5e1_story
      "Nobody ever found the lost thing at all": c5e1_story
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing about what you did yesterday. Which sentence is correct?'
    options:
    - I searched for my pen yesterday.
    - I search for my pen yesterday.
    - I am searching for my pen yesterday.
    answer: I searched for my pen yesterday.
    hints:
    - Does 'yesterday' tell you about the past, now, or later?
    - Which verb form fits a past action?
    solution: '''Yesterday'' shows the action is in the past, so we use the past form ''searched''.'
    mistakes:
      I search for my pen yesterday.: c5e1_gram
      I am searching for my pen yesterday.: c5e1_gram
    exam: competency
    difficulty: 2
