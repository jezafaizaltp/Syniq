concepts:
- code: cbse5e.u1.spectacles
  title: 'Papa''s Spectacles (Unit 1: Let''s Have Fun)'
  notes: |
    Papa has lost his only pair of spectacles. Without them he cannot read the newspaper, watch TV or cut vegetables.
    He searches his pockets, under his chair, near the window, everywhere. At last his child walks up and points out
    that the spectacles are on Papa's own head. A funny story about looking everywhere except the obvious place.
    Words: spectacles (glasses), pair, glanced (looked quickly), searching (looking carefully).
  explanations:
    text: Papa cannot find his spectacles, so he cannot read, watch TV or cut vegetables. He looks in his pockets, under his chair and by the window. In the end his child shows him the spectacles were on his head the whole time!
    visual: Draw Papa bending under a chair, looking very worried, with his spectacles sitting on top of his head. A child is pointing and laughing.
    step_by_step: 1. Who lost something? Papa. 2. What did he lose? His spectacles. 3. Where did he look? Pockets, chair, window. 4. Where were they? On his head.
    real_world: Have you ever looked everywhere for something that was in your hand or pocket? Many grown-ups lose their glasses this way.
  picture:
    kind: flow
    steps:
    - Papa loses his spectacles
    - Can't read, watch TV or cut vegetables
    - Searches pockets, chair, window
    - 'Child: ''They''re on your head!'''
    alt: Papa loses his spectacles, cannot read or watch TV, searches everywhere, and his child shows him they are on his head.
  items:
  - prompt: What did Papa lose?
    options:
    - his spectacles
    - his newspaper
    - his chair
    - his scooter
    answer: his spectacles
    difficulty: 1
    hints:
    - Look at the title.
    - He needs them to read.
    solution: Papa lost his spectacles.
    mistakes:
      his newspaper: eng5_read_again
  - prompt: Why couldn't Papa read the newspaper?
    options:
    - he could not find his spectacles
    - the newspaper was wet
    - it was night
    - he was asleep
    answer: he could not find his spectacles
    difficulty: 1
    hints:
    - What helps him see?
    - Spectacles.
    solution: Without spectacles he could not read.
  - prompt: Where were the spectacles in the end?
    options:
    - on Papa's head
    - under the chair
    - near the window
    - in the kitchen
    answer: on Papa's head
    difficulty: 1
    hints:
    - The child pointed.
    - The funny ending.
    solution: They were on his own head all along.
    mistakes:
      under the chair: eng5_read_again
  - prompt: What does 'spectacles' mean?
    options:
    - glasses for the eyes
    - a kind of hat
    - a newspaper
    - shoes
    answer: glasses for the eyes
    difficulty: 1
    hints:
    - You wear them to see better.
    - On your nose.
    solution: Spectacles are glasses.
  - prompt: '''Papa glanced at the clock.'' What does ''glanced'' mean?'
    options:
    - looked quickly
    - stared for an hour
    - broke
    - climbed
    answer: looked quickly
    difficulty: 2
    hints:
    - A quick look.
    - Not for long.
    solution: To glance is to look quickly.
    mistakes:
      stared for an hour: eng5_word
  - prompt: Why is the story funny?
    options:
    - Papa searched everywhere but the spectacles were on his head
    - Papa fell into a pond
    - the child lost a shoe
    - the TV broke
    answer: Papa searched everywhere but the spectacles were on his head
    difficulty: 2
    hints:
    - Think of the ending.
    - They were never lost.
    solution: It is funny because the spectacles were with him all the time.
