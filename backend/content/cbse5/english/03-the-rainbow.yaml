# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 3. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 3
title: 'The Rainbow (Unit 2: My Colourful World)'
concepts:
- code: cbse5e.u2.rainbow
  title: 'The Rainbow (Unit 2: My Colourful World)'
  notes: |
    A poem comparing beautiful things people make with things nature makes: boats sail on rivers and ships on the sea,
    but clouds sailing across the sky are prettier; there are bridges people build, but the rainbow, a bow bending from
    the heavens, is the most beautiful bridge of all (a well-known poem by Christina Rossetti on this theme). Activities:
    mixing colours (red + blue = purple, yellow + blue = green, red + yellow = orange, red + white = pink), human-made vs
    natural things. Fact: Newton's spinning disc with seven colours looks white, so white light is made of many colours.
  explanations:
    text: 'The poem says people make lovely things, like boats, ships and bridges. But nature makes even lovelier ones: clouds sailing in the sky and a rainbow that bends like a bridge from heaven to earth.'
    visual: Draw a river with a boat, then a sky with clouds and a big rainbow arching above a small bridge.
    step_by_step: 1. Find the things people make (boats, ships, bridges). 2. Find the things nature makes (clouds, rainbow). 3. Which does the poet think is prettier? Nature's.
    real_world: 'After rain, when the Sun comes out behind you, you may see a rainbow with seven colours: violet, indigo, blue, green, yellow, orange, red.'
  picture:
    kind: compare
    columns:
    - title: Made by people
      points:
      - boats
      - ships
      - bridges
    - title: Made by nature
      points:
      - clouds
      - rainbow
    alt: People make boats, ships and bridges; nature makes clouds and the rainbow.
  activity:
    type: sort
    prompt: 'The Rainbow: made by people or by nature?'
    bins:
    - Made by people
    - Made by nature
    items:
    - label: Ships on the sea
      bin: Made by people
      clue: Who builds a ship?
      why: People build ships.
    - label: Clouds sailing in the sky
      bin: Made by nature
      clue: Nobody builds clouds.
      why: 'Clouds form by themselves: nature.'
    - label: Bridges over rivers
      bin: Made by people
      clue: Engineers and workers.
      why: People build bridges.
    - label: The rainbow
      bin: Made by nature
      clue: Sun and rain together.
      why: 'Sunlight in raindrops makes it: nature''s bridge.'
    - label: Boats on rivers
      bin: Made by people
      clue: Somebody makes them.
      why: Boats are human-made.
  items:
  - prompt: Which of these is made by nature?
    options:
    - a rainbow
    - a bridge
    - a ship
    - a boat
    answer: a rainbow
    difficulty: 1
    hints:
    - People cannot build it.
    - It appears after rain.
    solution: A rainbow is natural.
    mistakes:
      a bridge: eng5_read_again
  - prompt: In the poem, what does the rainbow look like?
    options:
    - a bridge across the sky
    - a river
    - a boat
    - a tree
    answer: a bridge across the sky
    difficulty: 1
    hints:
    - It bends from one side to another.
    - Like an arch.
    solution: The rainbow is like a bridge in the sky.
  - prompt: 'Red and blue paint mixed together make:'
    options:
    - purple
    - green
    - orange
    - pink
    answer: purple
    difficulty: 1
    hints:
    - p _ _ _ _ e.
    - Like brinjal colour.
    solution: Red + blue = purple.
  - prompt: 'Yellow and blue mixed together make:'
    options:
    - green
    - purple
    - orange
    - brown
    answer: green
    difficulty: 1
    hints:
    - The colour of leaves.
    - g _ _ _ n.
    solution: Yellow + blue = green.
  - prompt: How many colours are in a rainbow?
    options:
    - seven
    - three
    - five
    - ten
    answer: seven
    difficulty: 1
    hints:
    - VIBGYOR.
    - Count the letters.
    solution: A rainbow has seven colours.
  - prompt: What did Newton's spinning colour disc show?
    options:
    - white light is made of many colours
    - colours disappear forever
    - rainbows are made by people
    - the Sun is cold
    answer: white light is made of many colours
    difficulty: 2
    hints:
    - When it spins, it looks white.
    - All colours mix.
    solution: The seven colours mix to look white.
