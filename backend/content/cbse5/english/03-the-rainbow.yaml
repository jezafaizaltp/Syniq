# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 3. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 3
title: 'The Rainbow (Unit 2: My Colourful World)'
tips:
  e5_newton_disc: "Spin a disc painted with all colours. It looks almost white."
  e5_rainbow_bridge: "A rainbow arches from one side of the sky to the other."
  e5_red_blue: "Think of a brinjal's colour. It mixes red and blue."
  e5_yellow_blue: "Think of the colour of leaves."
  c5e3_poem: The poet compares things people make with things nature makes. Which side does each belong to?
  c5e3_mix: Picture the two paints swirling together on a plate. What new colour appears?
  c5e3_light: Remember that sunlight looks white but hides many colours inside.
  c5e3_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?

concepts:
- code: cbse5e.u2.rainbow
  title: 'The Rainbow (Unit 2: My Colourful World)'
  notes: |
    A poem comparing beautiful things people make with things nature makes: boats sail on rivers and ships on the sea,
    but clouds sailing across the sky are prettier; there are bridges people build, but the rainbow, a bow bending from
    the heavens, is the most beautiful bridge of all (a well-known poem by Christina Rossetti on this theme). Activities:
    mixing colours (red + blue = purple, yellow + blue = green, red + yellow = orange, red + white = pink), human-made vs
    natural things. Fact: Newton's spinning disc with seven colours looks white, so white light is made of many colours.
  explanations:
    text: 'The poem says people make lovely things, like boats, ships and bridges. But nature makes even lovelier ones: clouds sailing in the sky and a rainbow that bends like a bridge from heaven to earth.'
    visual: Draw a river with a boat, then a sky with clouds and a big rainbow arching above a small bridge.
    step_by_step: 1. Find the things people make (boats, ships, bridges). 2. Find the things nature makes (clouds, rainbow). 3. Which does the poet think is prettier? Nature's.
    real_world: 'After rain, when the Sun comes out behind you, you may see a rainbow with seven colours: violet, indigo, blue, green, yellow, orange, red.'
  picture:
    kind: compare
    columns:
    - title: Made by people
      points:
      - boats
      - ships
      - bridges
    - title: Made by nature
      points:
      - clouds
      - rainbow
    alt: People make boats, ships and bridges; nature makes clouds and the rainbow.
  activity:
    type: sort
    prompt: 'The Rainbow: made by people or by nature?'
    bins:
    - Made by people
    - Made by nature
    items:
    - label: Ships on the sea
      bin: Made by people
      clue: Who builds a ship?
      why: People build ships.
    - label: Clouds sailing in the sky
      bin: Made by nature
      clue: Nobody builds clouds.
      why: 'Clouds form by themselves: nature.'
    - label: Bridges over rivers
      bin: Made by people
      clue: Engineers and workers.
      why: People build bridges.
    - label: The rainbow
      bin: Made by nature
      clue: Sun and rain together.
      why: 'Sunlight in raindrops makes it: nature''s bridge.'
    - label: Boats on rivers
      bin: Made by people
      clue: Somebody makes them.
      why: Boats are human-made.
  lesson:
    - teach: The poem 'The Rainbow' compares things people make with things nature makes. Boats sail on rivers and ships on the sea, but clouds sailing across the sky are prettier.
      check:
        prompt: In the poem, what is prettier than ships on the sea?
        options:
        - Clouds sailing across the sky
        - Cars on a road
        - Kites in a shop
        answer: Clouds sailing across the sky
        why: The poet prefers nature's beauty.
      ways:
      - style: visual
        teach: Things people make and things nature makes, as the poem compares them.
        picture:
          kind: compare
          columns:
          - title: Made by people
            points:
            - Boats on rivers
            - Ships on the sea
            - Bridges
          - title: Made by nature
            points:
            - Clouds in the sky
            - The rainbow
          alt: People make boats on rivers, ships on the sea and bridges. Nature makes the clouds in the sky and the rainbow.
      - style: real_world
        teach: Lie on the grass on a windy day and watch the clouds. They drift slowly across the sky, changing shape as they go, a bit like boats sailing on water.
    - teach: People build bridges, but the rainbow, a bow bending from the heavens, is the most beautiful bridge of all. A rainbow appears when sunlight shines through raindrops.
      picture:
        kind: compare
        columns:
        - title: Made by people
          points:
          - Boats
          - Ships
          - Bridges
        - title: Made by nature
          points:
          - Clouds
          - Rainbow
        alt: Things people make compared with things nature makes.
      check:
        prompt: What does the poet compare the rainbow to?
        options:
        - A bridge
        - A boat
        - A road
        answer: A bridge
        why: It arches across the sky like a bridge.
      ways:
      - style: step_by_step
        teach: 'Make your own rainbow. Step 1: Stand with your back to the Sun on a sunny morning. Step 2: Spray a fine mist of water from a hose or a spray bottle. Step 3: Look into the mist: a small rainbow appears where sunlight shines through the drops.'
      - style: real_world
        teach: Near big waterfalls, like Jog Falls in Karnataka, visitors often see a rainbow in the spray on sunny days. The tiny drops in the air split the sunlight into colours.
    - teach: 'Colours can be mixed: red + blue = purple, yellow + blue = green, red + yellow = orange. Newton spun a disc painted with the seven rainbow colours and it looked white, showing white light is made of many colours.'
      check:
        prompt: 'Red and yellow mixed make:'
        options:
        - Orange
        - Green
        - Purple
        answer: Orange
        why: Red and yellow together give orange.
      ways:
      - style: visual
        teach: Mixing two paint colours to make a new one.
        picture:
          kind: compare
          columns:
          - title: Mix
            points:
            - Red + blue
            - Yellow + blue
            - Red + yellow
          - title: You get
            points:
            - Purple
            - Green
            - Orange
          alt: Red and blue make purple, yellow and blue make green, and red and yellow make orange.
      - style: step_by_step
        teach: 'Try Newton''s disc. Step 1: Cut a circle of card and divide it into seven parts. Step 2: Colour each part one rainbow colour. Step 3: Push a pencil through the centre. Step 4: Spin it fast. The colours blur together and the disc looks almost white.'
  items:
  - prompt: Which of these is made by nature?
    options:
    - a rainbow
    - a bridge
    - a ship
    - a boat
    answer: a rainbow
    difficulty: 1
    hints:
    - People cannot build it.
    - It appears after rain.
    solution: A rainbow is natural.
    mistakes:
      a bridge: eng5_read_again
  - prompt: In the poem, what does the rainbow look like?
    options:
    - a bridge across the sky
    - a river
    - a boat
    - a tree
    answer: a bridge across the sky
    difficulty: 1
    hints:
    - It bends from one side to another.
    - Like an arch.
    solution: The rainbow is like a bridge in the sky.
    mistakes: {"a river": "e5_rainbow_bridge"}
  - prompt: 'Red and blue paint mixed together make:'
    options:
    - purple
    - green
    - orange
    - pink
    answer: purple
    difficulty: 1
    hints:
    - p _ _ _ _ e.
    - Like brinjal colour.
    solution: Red + blue = purple.
    mistakes: {"green": "e5_red_blue"}
  - prompt: 'Yellow and blue mixed together make:'
    options:
    - green
    - purple
    - orange
    - brown
    answer: green
    difficulty: 1
    hints:
    - The colour of leaves.
    - g _ _ _ n.
    solution: Yellow + blue = green.
    mistakes: {"purple": "e5_yellow_blue"}
  - prompt: How many colours are in a rainbow?
    options:
    - seven
    - three
    - five
    - ten
    answer: seven
    difficulty: 1
    hints:
    - VIBGYOR.
    - Count the letters.
    solution: A rainbow has seven colours.
    mistakes: {"three": "e1_seven_colours"}
  - prompt: What did Newton's spinning colour disc show?
    options:
    - white light is made of many colours
    - colours disappear forever
    - rainbows are made by people
    - the Sun is cold
    answer: white light is made of many colours
    difficulty: 2
    hints:
    - When it spins, it looks white.
    - All colours mix.
    solution: The seven colours mix to look white.
    mistakes: {"colours disappear forever": "e5_newton_disc"}
  - prompt: Which of these is made by people?
    options:
    - A bridge
    - A rainbow
    - A cloud
    answer: A bridge
    difficulty: 1
    hints:
    - Which one did workers build?
    - Two appear in the sky by themselves.
    solution: 'Step 1: rainbows and clouds are natural. Step 2: a bridge is built by people.'
    mistakes:
      A rainbow: c5e3_poem
      A cloud: c5e3_poem
  - prompt: 'Red and white mixed make:'
    options:
    - Pink
    - Black
    - Blue
    answer: Pink
    difficulty: 1
    hints:
    - White makes colours lighter.
    - Light red has its own name.
    solution: 'Step 1: white lightens red. Step 2: light red is pink.'
    mistakes:
      Black: c5e3_mix
      Blue: c5e3_mix
  - prompt: When do we usually see a rainbow?
    options:
    - When the Sun shines during or after rain
    - At midnight
    - On a dry, cloudy day with no sun
    answer: When the Sun shines during or after rain
    difficulty: 2
    hints:
    - It needs sunlight.
    - It also needs water drops in the air.
    solution: 'Step 1: sunlight passes through raindrops. Step 2: so sun and rain together make rainbows.'
    mistakes:
      At midnight: c5e3_light
      On a dry, cloudy day with no sun: c5e3_light
  - prompt: Which colour is NOT in a rainbow?
    options:
    - Brown
    - Red
    - Violet
    answer: Brown
    difficulty: 2
    hints:
    - 'Rainbow colours: VIBGYOR.'
    - Violet, indigo, blue, green, yellow, orange, red.
    solution: 'Step 1: VIBGYOR lists the colours. Step 2: brown is not one of them.'
    mistakes:
      Red: c5e3_light
      Violet: c5e3_light
  - prompt: 'In the poem, the clouds are said to ''sail''. This makes the clouds seem like:'
    options:
    - Boats
    - Birds
    - Trains
    answer: Boats
    difficulty: 2
    hints:
    - What usually sails?
    - "What sails on water?"
    solution: 'Step 1: sailing is what boats do. Step 2: the clouds are like boats in the sky.'
    mistakes:
      Birds: c5e3_poem
      Trains: c5e3_poem
  - prompt: 'Blue and yellow paint are mixed. Then a little white is added. The colour becomes:'
    options:
    - Light green
    - Dark red
    - Black
    answer: Light green
    difficulty: 3
    hints:
    - First find blue + yellow.
    - White makes a colour lighter.
    solution: 'Step 1: blue + yellow = green. Step 2: white makes it light green.'
    mistakes:
      Dark red: c5e3_mix
      Black: c5e3_mix
  - prompt: What does 'heavens' mean in the poem?
    options:
    - The sky
    - The ground
    - The sea
    answer: The sky
    difficulty: 2
    hints:
    - The rainbow bends from the heavens.
    - Where does a rainbow appear?
    solution: 'Step 1: rainbows are in the sky. Step 2: heavens here means the sky.'
    mistakes:
      The ground: c5e3_word
      The sea: c5e3_word
  - prompt: What is the poet's main feeling about nature?
    options:
    - "Nature's beauty is greater than what people make"
    - "Things that people make are always much better"
    - "Nature is boring and not worth looking at"
    answer: Nature's beauty is greater than what people make
    difficulty: 3
    hints:
    - Compare clouds with ships, the rainbow with bridges.
    - Which does the poet call prettier?
    solution: 'Step 1: each time, nature''s thing is called prettier. Step 2: so nature''s beauty is greater.'
    mistakes:
      "Things that people make are always much better": c5e3_poem
      "Nature is boring and not worth looking at": c5e3_poem
  - prompt: How many colours does a rainbow have?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Count the letters in VIBGYOR.
    - Each letter is a colour.
    solution: 'Step 1: V-I-B-G-Y-O-R. Step 2: 7 colours.'
    mistakes:
      '6': c5e3_light
      '5': c5e3_light
  - prompt: 'Case: Meera is painting a picture of a forest but has run out of green paint. Only red, yellow and blue are left. What should she do?'
    options:
    - Mix yellow and blue
    - Mix red and blue
    - Mix red and yellow
    answer: Mix yellow and blue
    hints:
    - Picture each pair of colours swirled together.
    - Which pair makes the colour of leaves?
    solution: Yellow and blue mixed together make green, so Meera can make the green that is needed.
    mistakes:
      Mix red and blue: c5e3_mix
      Mix red and yellow: c5e3_mix
    exam: case
    difficulty: 2
  - prompt: 'Situation: It has just rained and the Sun is coming out. Your little cousin asks why a rainbow appeared. What is the best answer?'
    options:
    - "Sunlight shining through raindrops splits into colours"
    - "Someone climbed up and painted the sky in colours"
    - "Rainbows only ever come out at night, after dark"
    answer: Sunlight shining through raindrops splits into colours
    hints:
    - What two things are needed for a rainbow?
    - What is hidden inside white sunlight?
    solution: A rainbow forms when sunlight shines through raindrops. The drops split the white light into its many colours.
    mistakes:
      "Someone climbed up and painted the sky in colours": c5e3_light
      "Rainbows only ever come out at night, after dark": c5e3_light
    exam: competency
    difficulty: 2
