# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 9. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 9
title: 'Vocation (Unit 5: Work is Worship)'
concepts:
- code: cbse5e.u5.vocation
  title: 'Vocation (Unit 5: Work is Worship)'
  notes: |
    Poem by Rabindranath Tagore. A schoolboy on his way to school envies the people he sees: the hawker crying 'Bangles,
    crystal bangles!' who has no school, no hurry; the gardener digging in the garden, getting his clothes dusty and
    never scolded; the watchman walking the dark lane at night with his lantern, who never has to go to bed. Each verse
    ends with the boy wishing to be like them. The poem shows a child's wish for freedom; the unit theme says all work
    has dignity.
  explanations:
    text: In this poem by Rabindranath Tagore, a boy going to school wishes he could be a bangle-seller who has no school, a gardener who can play in the dirt without being scolded, or a watchman who stays up all night. He thinks their lives are free and fun.
    visual: 'Draw three panels: a hawker with bangles in the street, a gardener digging in mud, a watchman with a lantern at night. A schoolboy looks at them with longing.'
    step_by_step: 1. Who speaks? A schoolboy. 2. Whom does he see? Hawker, gardener, watchman. 3. Why does he envy each? No school, no scolding, no bedtime. 4. What does he wish? To be like them.
    real_world: Children often think grown-ups have more fun because no one tells them when to sleep or study.
  picture:
    kind: compare
    columns:
    - title: Person
      points:
      - hawker
      - gardener
      - watchman
    - title: Why the boy envies him
      points:
      - no school, no hurry
      - can get dusty, never scolded
      - stays up all night
    alt: The boy envies the hawker for having no school, the gardener for getting dusty without being scolded, and the watchman for staying up all night.
  items:
  - prompt: Who wrote the poem 'Vocation'?
    options:
    - Rabindranath Tagore
    - Premchand
    - Ruskin Bond
    - Sarojini Naidu
    answer: Rabindranath Tagore
    difficulty: 1
    hints:
    - He wrote our national anthem.
    - Nobel Prize poet.
    solution: Tagore wrote 'Vocation'.
    mistakes:
      Ruskin Bond: eng5_read_again
  - prompt: What does the hawker sell?
    options:
    - bangles
    - flowers
    - vegetables
    - books
    answer: bangles
    difficulty: 1
    hints:
    - '''Crystal ...!'''
    - Worn on wrists.
    solution: The hawker sells crystal bangles.
  - prompt: Why does the boy envy the gardener?
    options:
    - he can get dusty and nobody scolds him
    - he is very rich
    - he goes to a big school
    - he flies kites
    answer: he can get dusty and nobody scolds him
    difficulty: 2
    hints:
    - Digging in mud.
    - No scolding.
    solution: The gardener gets dirty and is never scolded.
  - prompt: Why does the boy envy the watchman?
    options:
    - he never has to go to bed
    - he sells sweets
    - he drives a car
    - he has holidays
    answer: he never has to go to bed
    difficulty: 2
    hints:
    - He walks at night.
    - Lantern.
    solution: The watchman stays awake all night.
  - prompt: What does 'vocation' mean?
    options:
    - a person's work or job
    - a holiday
    - a vegetable
    - a song
    answer: a person's work or job
    difficulty: 2
    hints:
    - Not 'vacation'.
    - The poem is about jobs.
    solution: A vocation is a job or calling.
    mistakes:
      a holiday: eng5_word
  - prompt: 'The poem shows that the boy wishes for:'
    options:
    - freedom
    - more homework
    - a longer school day
    - an early bedtime
    answer: freedom
    difficulty: 2
    hints:
    - No school, no rules.
    - What do all three have?
    solution: He wishes for the freedom he sees in their lives.
