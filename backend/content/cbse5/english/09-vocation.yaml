# CBSE Class 5 English (NCERT Santoor, 2025-26), chapter 9. Format: content/README.md.
# Some chapters checked against NCERT's own chapter files; others written from the unit theme only (see README).
subject: cbse5-eng
chapter: 9
title: 'Vocation (Unit 5: Work is Worship)'
tips:
  e5_freedom: "The boy has to go to school and to bed on time. What does he long for?"
  e5_gardener: "The gardener digs in the dirt all day. What can he do that the boy can't?"
  e5_hawker: "The hawker calls out to sell something worn on the wrist."
  e5_watchman: "The watchman walks the street at night. What does the boy wish he could do too?"
  c5e9_who: Match each person the boy sees with what they do and why he envies them.
  c5e9_feel: Think about what the boy has to do every day, and what he wishes he could do instead.
  c5e9_word: Put each choice into the sentence and read it aloud. Which one keeps the meaning?
  c5e9_poet: Think about the great Bengali poet who wrote India's national anthem.

concepts:
- code: cbse5e.u5.vocation
  title: 'Vocation (Unit 5: Work is Worship)'
  notes: |
    Poem by Rabindranath Tagore. A schoolboy on his way to school envies the people he sees: the hawker crying 'Bangles,
    crystal bangles!' who has no school, no hurry; the gardener digging in the garden, getting his clothes dusty and
    never scolded; the watchman walking the dark lane at night with his lantern, who never has to go to bed. Each verse
    ends with the boy wishing to be like them. The poem shows a child's wish for freedom; the unit theme says all work
    has dignity.
  explanations:
    text: In this poem by Rabindranath Tagore, a boy going to school wishes he could be a bangle-seller who has no school, a gardener who can play in the dirt without being scolded, or a watchman who stays up all night. He thinks their lives are free and fun.
    visual: 'Draw three panels: a hawker with bangles in the street, a gardener digging in mud, a watchman with a lantern at night. A schoolboy looks at them with longing.'
    step_by_step: 1. Who speaks? A schoolboy. 2. Whom does he see? Hawker, gardener, watchman. 3. Why does he envy each? No school, no scolding, no bedtime. 4. What does he wish? To be like them.
    real_world: Children often think grown-ups have more fun because no one tells them when to sleep or study.
  picture:
    kind: compare
    columns:
    - title: Person
      points:
      - hawker
      - gardener
      - watchman
    - title: Why the boy envies him
      points:
      - no school, no hurry
      - can get dusty, never scolded
      - stays up all night
    alt: The boy envies the hawker for having no school, the gardener for getting dusty without being scolded, and the watchman for staying up all night.
  activity:
    type: sort
    prompt: 'Vocation: who does the boy envy, and why?'
    bins:
    - The hawker
    - The gardener
    - The watchman
    items:
    - label: '''Bangles, crystal bangles!'''
      bin: The hawker
      clue: Someone calling out to sell.
      why: The hawker cries out his wares.
    - label: Never has to go to school
      bin: The hawker
      clue: Walks the street freely.
      why: The hawker has no school and no hurry.
    - label: Clothes dusty, never scolded
      bin: The gardener
      clue: Digging in the soil.
      why: The gardener gets dirty without being scolded.
    - label: A lantern in the dark lane
      bin: The watchman
      clue: At night.
      why: The watchman walks at night.
    - label: Never has to go to bed
      bin: The watchman
      clue: Awake all night.
      why: The watchman stays up all night.
  lesson:
    - teach: '''Vocation'' is a poem by Rabindranath Tagore. A schoolboy, on his way to school, sees a hawker crying ''Bangles, crystal bangles!'' The hawker has no school and no hurry, and the boy wishes he could be like him.'
      check:
        prompt: Why does the boy envy the hawker?
        options:
        - He has no school and no hurry
        - He is very rich
        - He is a king
        answer: He has no school and no hurry
        why: The boy wants that freedom.
    - teach: Next he sees a gardener digging, getting his clothes dusty, and nobody scolds him. At night he sees a watchman walking the dark lane with a lantern, who never has to go to bed.
      picture:
        kind: compare
        columns:
        - title: Person
          points:
          - Hawker
          - Gardener
          - Watchman
        - title: Why the boy envies him
          points:
          - No school, no hurry
          - Gets dusty, never scolded
          - Never has to go to bed
        alt: The three people the boy sees and why he envies each.
      check:
        prompt: What does the watchman carry?
        options:
        - A lantern
        - A spade
        - Bangles
        answer: A lantern
        why: He walks the dark lane at night.
    - teach: The poem shows a child's wish for freedom. The unit 'Work is Worship' adds that every kind of work has dignity. 'Vocation' means a person's work or calling.
      check:
        prompt: Which is the best meaning of 'vocation'?
        options:
        - A person's work
        - A holiday
        - A vegetable
        answer: A person's work
        why: It is the work a person does in life.
  items:
  - prompt: Who wrote the poem 'Vocation'?
    options:
    - Rabindranath Tagore
    - Premchand
    - Ruskin Bond
    - Sarojini Naidu
    answer: Rabindranath Tagore
    difficulty: 1
    hints:
    - He wrote our national anthem.
    - Nobel Prize poet.
    solution: Tagore wrote 'Vocation'.
    mistakes:
      Ruskin Bond: eng5_read_again
  - prompt: What does the hawker sell?
    options:
    - bangles
    - flowers
    - vegetables
    - books
    answer: bangles
    difficulty: 1
    hints:
    - '''Crystal ...!'''
    - Worn on wrists.
    solution: The hawker sells crystal bangles.
    mistakes: {"flowers": "e5_hawker"}
  - prompt: Why does the boy envy the gardener?
    options:
    - he can get dusty and nobody scolds him
    - he is very rich
    - he goes to a big school
    - he flies kites
    answer: he can get dusty and nobody scolds him
    difficulty: 2
    hints:
    - Digging in mud.
    - No scolding.
    solution: The gardener gets dirty and is never scolded.
    mistakes: {"he is very rich": "e5_gardener"}
  - prompt: Why does the boy envy the watchman?
    options:
    - he never has to go to bed
    - he sells sweets
    - he drives a car
    - he has holidays
    answer: he never has to go to bed
    difficulty: 2
    hints:
    - He walks at night.
    - Lantern.
    solution: The watchman stays awake all night.
    mistakes: {"he sells sweets": "e5_watchman"}
  - prompt: What does 'vocation' mean?
    options:
    - a person's work or job
    - a holiday
    - a vegetable
    - a song
    answer: a person's work or job
    difficulty: 2
    hints:
    - Not 'vacation'.
    - The poem is about jobs.
    solution: A vocation is a job or calling.
    mistakes:
      a holiday: eng5_word
  - prompt: 'The poem shows that the boy wishes for:'
    options:
    - freedom
    - more homework
    - a longer school day
    - an early bedtime
    answer: freedom
    difficulty: 2
    hints:
    - No school, no rules.
    - What do all three have?
    solution: He wishes for the freedom he sees in their lives.
    mistakes: {"more homework": "e5_freedom"}
  - prompt: What is the boy on his way to?
    options:
    - School
    - A wedding
    - The beach
    answer: School
    difficulty: 1
    hints:
    - He is a schoolboy.
    - It is morning.
    solution: 'Step 1: he is a schoolboy. Step 2: he is going to school.'
    mistakes:
      A wedding: c5e9_feel
      The beach: c5e9_feel
  - prompt: What does a hawker do?
    options:
    - Sells things by calling out in the streets
    - Grows vegetables
    - Guards houses at night
    answer: Sells things by calling out in the streets
    difficulty: 1
    hints:
    - He cries 'Bangles!'
    - He walks through the lanes.
    solution: 'Step 1: he calls out his goods. Step 2: a hawker sells in the streets.'
    mistakes:
      Grows vegetables: c5e9_who
      Guards houses at night: c5e9_who
  - prompt: When does the boy see the watchman?
    options:
    - At night
    - At noon
    - In the early morning on the way to school
    answer: At night
    difficulty: 2
    hints:
    - The lane is dark.
    - He carries a lantern.
    solution: 'Step 1: a dark lane and a lantern. Step 2: it is night.'
    mistakes:
      At noon: c5e9_who
      In the early morning on the way to school: c5e9_who
  - prompt: Who wrote India's national anthem as well as this poem?
    options:
    - Rabindranath Tagore
    - Premchand
    - Sarojini Naidu
    answer: Rabindranath Tagore
    difficulty: 2
    hints:
    - He was from Bengal.
    - He won the Nobel Prize.
    solution: 'Step 1: the anthem''s poet won the Nobel Prize. Step 2: Rabindranath Tagore.'
    mistakes:
      Premchand: c5e9_poet
      Sarojini Naidu: c5e9_poet
  - prompt: What does 'envy' mean?
    options:
    - Wishing you had what someone else has
    - Being very sleepy
    - Being angry at the weather
    answer: Wishing you had what someone else has
    difficulty: 2
    hints:
    - The boy wants the hawker's freedom.
    - It is a feeling about others.
    solution: 'Step 1: the boy wants what others have. Step 2: that feeling is envy.'
    mistakes:
      Being very sleepy: c5e9_word
      Being angry at the weather: c5e9_word
  - prompt: Why might the boy NOT really want the watchman's life?
    options:
    - Staying awake all night is hard work
    - Watchmen are always on holiday
    - Lanterns are heavy toys
    answer: Staying awake all night is hard work
    difficulty: 3
    hints:
    - The boy sees only the fun side.
    - What is it like to work all night?
    solution: 'Step 1: the boy thinks no bedtime is fun. Step 2: really, staying awake all night is tiring work.'
    mistakes:
      Watchmen are always on holiday: c5e9_feel
      Lanterns are heavy toys: c5e9_feel
  - prompt: '''Crystal bangles'' are bangles made of:'
    options:
    - Glass
    - Wood
    - Paper
    answer: Glass
    difficulty: 2
    hints:
    - Crystal is clear and shiny.
    - It can break if dropped.
    solution: 'Step 1: crystal is shiny and clear. Step 2: crystal bangles are glass.'
    mistakes:
      Wood: c5e9_word
      Paper: c5e9_word
  - prompt: What does the boy wish for in each verse?
    options:
    - To be like the person he sees
    - To go to school faster
    - To become a teacher
    answer: To be like the person he sees
    difficulty: 2
    hints:
    - Each verse ends the same way.
    - He imagines a different life.
    solution: 'Step 1: each verse ends with a wish. Step 2: he wishes to be like that person.'
    mistakes:
      To go to school faster: c5e9_feel
      To become a teacher: c5e9_feel
  - prompt: What does 'Work is Worship' mean?
    options:
    - All honest work deserves respect
    - Only big jobs matter
    - Work is boring
    answer: All honest work deserves respect
    difficulty: 3
    hints:
    - Hawkers, gardeners and watchmen all work.
    - Worship means deep respect.
    solution: 'Step 1: every job helps others. Step 2: so all honest work deserves respect.'
    mistakes:
      Only big jobs matter: c5e9_who
      Work is boring: c5e9_who
