# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 3
title: The Mystery of Food
tips:
  v5_animal_food: "Wheat grows in fields. Which choice comes from a cow?"
  v5_balanced: "A balanced meal has some of each food group. Count the groups on each plate."
  v5_body_building: "Body-building foods have protein, like pulses, milk and eggs."
  v5_energy_food: "Energy foods are full of starch, like grains."
  v5_fridge: "Germs grow fast when warm. What does cold do to them?"
  v5_junk: "Junk food tastes good but has too much of some things. Which ones?"
  v5_pickle: "Mango pickle lasts for months. What do salt and oil do to germs?"
  v5_protective: "Fruits and vegetables have vitamins that keep us from falling ill."
  v5_spoiled: "Warm food can be fresh. What does your nose tell you when food is bad?"
  v5_waste: "Food is wasted when it's left on the plate. How can we stop that?"

concepts:
- code: cbse5v.food.groups
  title: What food gives us
  notes: |
    Food gives energy to work and play, helps us grow and keeps us healthy. Energy-giving foods: rice, wheat, millets,
    potatoes. Body-building foods: dal, milk, eggs, fish, nuts. Protective foods: fruits and vegetables. A balanced meal
    has all of these plus water. Traditional Indian meals like rice with dal, vegetables and curd are balanced.
  explanations:
    text: Different foods do different jobs. Rice and roti give energy. Dal, milk and eggs help us grow strong. Fruits and vegetables protect us from illness. A balanced meal has some of each.
    visual: 'Draw a plate split into three: half vegetables and fruit, a quarter rice or roti, a quarter dal or egg. Add a glass of water.'
    step_by_step: 'Step 1: Look at your plate. Step 2: Find an energy food, a body-building food and a protective food. Step 3: If one is missing, add it.'
    real_world: School midday meals in India are planned to include rice or roti, dal and vegetables.
  picture:
    kind: compare
    columns:
    - title: Energy
      points:
      - rice
      - roti
      - millets
    - title: Growth
      points:
      - dal
      - milk
      - eggs
    - title: Protection
      points:
      - fruits
      - vegetables
      - greens
    alt: Energy foods are rice, roti and millets; body-building foods are dal, milk and eggs; protective foods are fruits, vegetables and greens.
  activity:
    type: sort
    prompt: What job does each food do?
    bins:
    - Gives energy
    - Helps us grow
    - Keeps us healthy
    items:
    - label: Rice
      bin: Gives energy
      clue: Fuel to run and play.
      why: Energy food.
    - label: Roti
      bin: Gives energy
      clue: Made from wheat.
      why: Energy food.
    - label: Potatoes
      bin: Gives energy
      clue: Full of starch.
      why: Energy food.
    - label: Dal
      bin: Helps us grow
      clue: Builds strong muscles.
      why: Body-building food.
    - label: Milk
      bin: Helps us grow
      clue: For strong bones and body.
      why: Body-building food.
    - label: Eggs
      bin: Helps us grow
      clue: Lots of protein.
      why: Body-building food.
    - label: Oranges
      bin: Keeps us healthy
      clue: Fruit with vitamin C.
      why: Protective food.
    - label: Spinach
      bin: Keeps us healthy
      clue: Green leaves.
      why: Protective food.
    - label: Carrots
      bin: Keeps us healthy
      clue: Good for the eyes.
      why: Protective food.
  items:
  - prompt: Which food mainly gives energy?
    options:
    - rice
    - spinach
    - orange
    - water
    answer: rice
    difficulty: 1
    hints:
    - Grains.
    - Fills you up for running.
    solution: Rice is an energy-giving food.
    mistakes: {"spinach": "v5_energy_food"}
  - prompt: Which food helps the body grow?
    options:
    - dal
    - sugar
    - oil
    - salt
    answer: dal
    difficulty: 1
    hints:
    - Pulses.
    - Body-building.
    solution: Dal is rich in protein for growth.
    mistakes: {"sugar": "v5_body_building"}
  - prompt: 'Fruits and vegetables are mainly:'
    options:
    - protective foods
    - energy-only foods
    - harmful foods
    - drinks
    answer: protective foods
    difficulty: 1
    hints:
    - They keep us from falling ill.
    - Vitamins.
    solution: Fruits and vegetables protect our health.
    mistakes: {"energy-only foods": "v5_protective"}
  - prompt: 'A balanced meal has:'
    options:
    - energy, body-building and protective foods
    - only sweets
    - only rice
    - only fried snacks
    answer: energy, body-building and protective foods
    difficulty: 1
    hints:
    - Balanced = a bit of each.
    - Three groups.
    solution: A balanced meal includes all the food groups.
    mistakes:
      only rice: c5v_think
  - prompt: Which meal is most balanced?
    options:
    - rice, dal, vegetables and curd
    - chips and cola
    - only sweets
    - only bread
    answer: rice, dal, vegetables and curd
    difficulty: 1
    hints:
    - Look for all the groups.
    - Grain + dal + vegetables.
    solution: Rice, dal, vegetables and curd cover all the groups.
    mistakes: {"chips and cola": "v5_balanced"}
  - prompt: Why should we not eat too much junk food?
    options:
    - it has too much oil, salt or sugar
    - it is too healthy
    - it has too many vegetables
    - it makes us taller
    answer: it has too much oil, salt or sugar
    difficulty: 2
    hints:
    - Think of chips and cola.
    - What is in them?
    solution: Junk food has lots of oil, salt or sugar and little goodness.
    mistakes: {"it makes us taller": "v5_junk"}
- code: cbse5v.food.journey
  title: Where food comes from and how it keeps
  after:
  - cbse5v.food.groups
  notes: |
    Food comes from plants (grains, fruits, vegetables, spices) and animals (milk, eggs, fish). Farm to plate: grow →
    harvest → market → kitchen. Food spoils because of germs, warmth and moisture; signs are bad smell, mould, change in
    colour. Keep food fresh: refrigerate, dry (papad, dried fish), salt or pickle, keep covered. Don't waste food.
  explanations:
    text: Our food comes from plants and animals. It travels from farms to markets to our kitchens. Food goes bad when germs grow on it, especially in warm, wet places. Drying, salting, pickling and keeping food cold help it last longer.
    visual: 'Draw arrows: a field of rice → a sack → a shop → a cooking pot → a plate.'
    step_by_step: 'Step 1: Name the food. Step 2: Is it from a plant or an animal? Step 3: How did it reach your home? Step 4: How can you keep it fresh?'
    real_world: Kerala homes make mango and lime pickles and dry fish in the sun so food lasts for months.
  picture:
    kind: flow
    steps:
    - 'Farm: grown'
    - Harvested
    - Market or shop
    - 'Kitchen: cooked'
    - Plate
    alt: Food travels from the farm where it is grown, to harvest, to the market, to the kitchen, to our plate.
  activity:
    type: sort
    prompt: Does it keep food fresh, or make it go bad?
    bins:
    - Keeps food fresh
    - Makes food go bad
    items:
    - label: Keeping milk in the fridge
      bin: Keeps food fresh
      clue: Cold slows down germs.
      why: Fresh.
    - label: Covering cooked food
      bin: Keeps food fresh
      clue: Keeps flies and dust off.
      why: Fresh.
    - label: Drying fish or papads in the sun
      bin: Keeps food fresh
      clue: Germs need water to grow.
      why: Dry food keeps.
    - label: Making pickles with salt and oil
      bin: Keeps food fresh
      clue: Salt stops germs.
      why: Pickles keep for months.
    - label: Leaving cooked rice in a warm kitchen overnight
      bin: Makes food go bad
      clue: Germs love warm, damp food.
      why: It can spoil.
    - label: Keeping wet bread in a closed box
      bin: Makes food go bad
      clue: Damp and dark.
      why: Mould grows.
    - label: Flies sitting on open food
      bin: Makes food go bad
      clue: They carry germs.
      why: Spoils food.
    - label: Leaving unboiled milk out on a hot day
      bin: Makes food go bad
      clue: Warm and not boiled.
      why: It turns sour.
  items:
  - prompt: Which food comes from an animal?
    options:
    - milk
    - rice
    - banana
    - wheat
    answer: milk
    difficulty: 1
    hints:
    - Cows and buffaloes.
    - Dairy.
    solution: Milk comes from cows, buffaloes and goats.
    mistakes: {"wheat": "v5_animal_food"}
  - prompt: What is a sign that food has spoiled?
    options:
    - a bad smell
    - it is warm
    - it is on a plate
    - it is cooked
    answer: a bad smell
    difficulty: 1
    hints:
    - Use your nose.
    - Mould too.
    solution: A bad smell or mould shows food has gone bad.
    mistakes: {"it is warm": "v5_spoiled"}
  - prompt: 'Pickling with salt and oil helps food to:'
    options:
    - last longer
    - spoil faster
    - grow bigger
    - change into water
    answer: last longer
    difficulty: 1
    hints:
    - Germs can't grow well.
    - Mango pickle lasts months.
    solution: Salt and oil keep germs away, so pickles last.
    mistakes: {"spoil faster": "v5_pickle"}
  - prompt: 'Food spoils fastest when it is:'
    options:
    - warm and moist
    - cold and dry
    - frozen
    - sealed and dry
    answer: warm and moist
    difficulty: 2
    hints:
    - Germs like warmth.
    - And wetness.
    solution: Germs grow quickly in warm, moist food.
    mistakes:
      cold and dry: c5v_think
  - prompt: Why do we keep milk in a fridge?
    options:
    - cold slows down germs
    - it makes milk sweeter
    - it makes milk thicker
    - it turns milk into curd
    answer: cold slows down germs
    difficulty: 2
    hints:
    - Germs grow slowly in cold.
    - Fridge = cold.
    solution: Cold slows germ growth, keeping milk fresh.
    mistakes: {"it turns milk into curd": "v5_fridge"}
  - prompt: Which is a good way to avoid wasting food?
    options:
    - take only as much as you can eat
    - throw away leftovers
    - cook far too much
    - leave food uncovered
    answer: take only as much as you can eat
    difficulty: 1
    hints:
    - Serve small portions.
    - Ask for more later.
    solution: Taking only what you need stops waste.
    mistakes: {"cook far too much": "v5_waste"}
