# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 3
title: The Mystery of Food
tips:
  v5_animal_food: "Wheat grows in fields. Which choice comes from a cow?"
  v5_balanced: "A balanced meal has some of each food group. Count the groups on each plate."
  v5_body_building: "Body-building foods have protein, like pulses, milk and eggs."
  v5_energy_food: "Energy foods are full of starch, like grains."
  v5_fridge: "Germs grow fast when warm. What does cold do to them?"
  v5_junk: "Junk food tastes good but has too much of some things. Which ones?"
  v5_pickle: "Mango pickle lasts for months. What do salt and oil do to germs?"
  v5_protective: "Fruits and vegetables have vitamins that keep us from falling ill."
  v5_spoiled: "Warm food can be fresh. What does your nose tell you when food is bad?"
  v5_waste: "Food is wasted when it's left on the plate. How can we stop that?"
  c5v3_group: 'Sort foods by their job: some give energy, some help the body grow, some protect us from illness.'
  c5v3_balance: A good plate has something from every food group, not lots of just one.
  c5v3_source: Ask whether the food grew on a plant or came from an animal.
  c5v3_spoil: Germs grow fast where it is warm and damp. Think what slows them down.
  c5v3_waste: Think about how to take, store and share food so none is thrown away.

concepts:
- code: cbse5v.food.groups
  title: What food gives us
  notes: |
    Food gives energy to work and play, helps us grow and keeps us healthy. Energy-giving foods: rice, wheat, millets,
    potatoes. Body-building foods: dal, milk, eggs, fish, nuts. Protective foods: fruits and vegetables. A balanced meal
    has all of these plus water. Traditional Indian meals like rice with dal, vegetables and curd are balanced.
  explanations:
    text: Different foods do different jobs. Rice and roti give energy. Dal, milk and eggs help us grow strong. Fruits and vegetables protect us from illness. A balanced meal has some of each.
    visual: 'Draw a plate split into three: half vegetables and fruit, a quarter rice or roti, a quarter dal or egg. Add a glass of water.'
    step_by_step: 'Step 1: Look at your plate. Step 2: Find an energy food, a body-building food and a protective food. Step 3: If one is missing, add it.'
    real_world: School midday meals in India are planned to include rice or roti, dal and vegetables.
  picture:
    kind: compare
    columns:
    - title: Energy
      points:
      - rice
      - roti
      - millets
    - title: Growth
      points:
      - dal
      - milk
      - eggs
    - title: Protection
      points:
      - fruits
      - vegetables
      - greens
    alt: Energy foods are rice, roti and millets; body-building foods are dal, milk and eggs; protective foods are fruits, vegetables and greens.
  activity:
    type: sort
    prompt: What job does each food do?
    bins:
    - Gives energy
    - Helps us grow
    - Keeps us healthy
    items:
    - label: Rice
      bin: Gives energy
      clue: Fuel to run and play.
      why: Energy food.
    - label: Roti
      bin: Gives energy
      clue: Made from wheat.
      why: Energy food.
    - label: Potatoes
      bin: Gives energy
      clue: Full of starch.
      why: Energy food.
    - label: Dal
      bin: Helps us grow
      clue: Builds strong muscles.
      why: Body-building food.
    - label: Milk
      bin: Helps us grow
      clue: For strong bones and body.
      why: Body-building food.
    - label: Eggs
      bin: Helps us grow
      clue: Lots of protein.
      why: Body-building food.
    - label: Oranges
      bin: Keeps us healthy
      clue: Fruit with vitamin C.
      why: Protective food.
    - label: Spinach
      bin: Keeps us healthy
      clue: Green leaves.
      why: Protective food.
    - label: Carrots
      bin: Keeps us healthy
      clue: Good for the eyes.
      why: Protective food.
  lesson:
    - teach: Food gives us energy to work and play, helps us grow, and keeps us healthy. Energy-giving foods include rice, wheat, millets like ragi, and potatoes.
      check:
        prompt: Which of these foods is mainly an energy food?
        options:
        - Ragi
        - Spinach
        - Lemon
        answer: Ragi
        why: Millets like ragi are grains full of energy.
      ways:
      - style: visual
        teach: Three different jobs that food does for our body.
        picture:
          kind: compare
          columns:
          - title: Gives energy
            points:
            - Rice
            - Wheat roti
            - Ragi
            - Potato
          - title: Builds the body
            points:
            - Dal
            - Milk
            - Egg
            - Fish
          - title: Protects from illness
            points:
            - Fruits
            - Green vegetables
          alt: Rice, wheat roti, ragi and potato give energy. Dal, milk, egg and fish build the body. Fruits and green vegetables protect us from illness.
      - style: real_world
        teach: Think of the body as a scooter. Energy foods are like petrol that makes it go. Body-building foods are like spare parts that repair it. Protective foods are like regular servicing that keeps it from breaking down.
    - teach: 'Body-building foods help us grow and repair the body: dal, milk, eggs, fish, nuts. Protective foods keep us from falling ill: fruits and vegetables.'
      picture:
        kind: compare
        columns:
        - title: Energy
          points:
          - Rice
          - Wheat
          - Millets
        - title: Body-building
          points:
          - Dal
          - Eggs
          - Fish
        - title: Protective
          points:
          - Fruits
          - Green vegetables
        alt: Foods sorted into energy-giving, body-building and protective groups.
      check:
        prompt: 'Eggs and fish are mainly:'
        options:
        - Body-building foods
        - Protective foods
        - Not food
        answer: Body-building foods
        why: They help muscles grow and heal.
      ways:
      - style: step_by_step
        teach: 'Sort your lunch box. Step 1: Find the energy food, such as chapati. Step 2: Find the body-building food, such as dal or paneer. Step 3: Find the protective food, such as a cucumber or an orange. Step 4: If one group is missing, add something from it tomorrow.'
      - style: real_world
        teach: Sportspeople eat plenty of dal, eggs, milk and nuts because their muscles work hard and need repair. They also eat fruit and vegetables so they do not fall ill before a match.
    - teach: A balanced meal has energy, body-building and protective foods, plus water. Rice with dal, vegetables and curd is balanced. Too much junk food has too much oil, salt or sugar.
      check:
        prompt: Which plate is balanced?
        options:
        - Chapati, dal, vegetables and curd
        - Only chips
        - Only sweets
        answer: Chapati, dal, vegetables and curd
        why: It has all three food groups.
      ways:
      - style: visual
        teach: A balanced plate compared with an unbalanced one.
        picture:
          kind: compare
          columns:
          - title: Balanced plate
            points:
            - Rice or roti
            - Dal
            - Vegetables
            - Curd
            - Water
          - title: Unbalanced plate
            points:
            - Chips
            - Sweets
            - A fizzy drink
          alt: A balanced plate has rice or roti, dal, vegetables, curd and water. An unbalanced plate has only chips, sweets and a fizzy drink.
      - style: real_world
        teach: A packet of chips tastes good, but it is mostly oil and salt. Eaten now and then it is fine; eaten every day instead of meals, it leaves the body short of what it needs to grow and stay well.
  items:
  - prompt: Which food mainly gives energy?
    options:
    - rice
    - spinach
    - orange
    - water
    answer: rice
    difficulty: 1
    hints:
    - Grains.
    - Fills you up for running.
    solution: Rice is an energy-giving food.
    mistakes: {"spinach": "v5_energy_food"}
  - prompt: Which food helps the body grow?
    options:
    - dal
    - sugar
    - oil
    - salt
    answer: dal
    difficulty: 1
    hints:
    - Pulses.
    - Body-building.
    solution: Dal is rich in protein for growth.
    mistakes: {"sugar": "v5_body_building"}
  - prompt: 'Fruits and vegetables are mainly:'
    options:
    - protective foods
    - energy-only foods
    - harmful foods
    - drinks
    answer: protective foods
    difficulty: 1
    hints:
    - They keep us from falling ill.
    - Vitamins.
    solution: Fruits and vegetables protect our health.
    mistakes: {"energy-only foods": "v5_protective"}
  - prompt: 'A balanced meal has:'
    options:
    - "energy, body-building and protective foods"
    - "only sweets and nothing else at all"
    - "only rice, with nothing to go with it"
    - "only fried snacks and cold drinks"
    answer: energy, body-building and protective foods
    difficulty: 1
    hints:
    - Balanced = a bit of each.
    - Three groups.
    solution: A balanced meal includes all the food groups.
    mistakes:
      "only rice, with nothing to go with it": c5v_think
  - prompt: Which meal is most balanced?
    options:
    - "rice, dal, vegetables and curd"
    - "chips, a burger and a cola"
    - "a plate of sweets and cake"
    - "bread with butter and jam"
    answer: rice, dal, vegetables and curd
    difficulty: 1
    hints:
    - Look for all the groups.
    - Grain + dal + vegetables.
    solution: Rice, dal, vegetables and curd cover all the groups.
    mistakes: {"chips, a burger and a cola": "v5_balanced"}
  - prompt: Why should we not eat too much junk food?
    options:
    - "it has too much oil, salt or sugar"
    - "it is far too healthy for the body"
    - "it has too many green vegetables"
    - "it makes us grow much too tall"
    answer: it has too much oil, salt or sugar
    difficulty: 2
    hints:
    - Think of chips and cola.
    - What is in them?
    solution: Junk food has lots of oil, salt or sugar and little goodness.
    mistakes: {"it makes us grow much too tall": "v5_junk"}
  - prompt: Which is a protective food?
    options:
    - Carrot
    - Rice
    - Butter
    answer: Carrot
    difficulty: 1
    hints:
    - Protective foods are fruits and vegetables.
    - Which one is a vegetable?
    solution: 'Step 1: protective foods = fruits and vegetables. Step 2: carrot is a vegetable.'
    mistakes:
      Rice: c5v3_group
      Butter: c5v3_group
  - prompt: Which food helps a cut on your knee heal and your muscles grow?
    options:
    - Dal
    - Sugar
    - Pickle
    answer: Dal
    difficulty: 2
    hints:
    - Healing and growing need body-building food.
    - Which is from the pulses family?
    solution: 'Step 1: growth and repair need body-building food. Step 2: dal is one.'
    mistakes:
      Sugar: c5v3_group
      Pickle: c5v3_group
  - prompt: Which drink is best when you are thirsty?
    options:
    - Clean water
    - Fizzy soda
    - Very sweet juice
    answer: Clean water
    difficulty: 1
    hints:
    - It has no sugar.
    - Our body needs it most.
    solution: 'Step 1: soda and sweet juice have lots of sugar. Step 2: water is best.'
    mistakes:
      Fizzy soda: c5v3_balance
      Very sweet juice: c5v3_balance
  - prompt: A runner needs quick energy before a race. Which food helps most?
    options:
    - A banana
    - A glass of water only
    - A pinch of salt
    answer: A banana
    difficulty: 2
    hints:
    - Energy comes from foods with natural sugar or starch.
    - Which one is a fruit with energy?
    solution: 'Step 1: bananas are full of natural sugar and starch. Step 2: they give quick energy.'
    mistakes:
      A glass of water only: c5v3_group
      A pinch of salt: c5v3_group
  - prompt: Why should we eat many colours of vegetables?
    options:
    - "Each gives different things the body needs"
    - "They only make the plate look pretty"
    - "They have no use for the body at all"
    answer: Each gives different things the body needs
    difficulty: 2
    hints:
    - Different vegetables protect us in different ways.
    - Variety keeps us healthy.
    solution: 'Step 1: each vegetable has its own goodness. Step 2: eating many colours covers more needs.'
    mistakes:
      "They only make the plate look pretty": c5v3_balance
      "They have no use for the body at all": c5v3_balance
  - prompt: Which is junk food?
    options:
    - Deep-fried chips
    - Sprouts
    - Idli
    answer: Deep-fried chips
    difficulty: 1
    hints:
    - Junk food has too much oil or salt.
    - Which one is fried?
    solution: 'Step 1: chips are fried and salty. Step 2: they are junk food.'
    mistakes:
      Sprouts: c5v3_balance
      Idli: c5v3_balance
  - prompt: Ravi eats only rice and sugar every day. What is his meal missing?
    options:
    - "Body-building and protective foods"
    - "Energy foods that give us strength"
    - "Nothing, it is already a full meal"
    answer: Body-building and protective foods
    difficulty: 3
    hints:
    - Rice and sugar give energy.
    - What other groups are needed?
    solution: 'Step 1: rice and sugar = energy only. Step 2: he needs body-building and protective foods too.'
    mistakes:
      "Energy foods that give us strength": c5v3_balance
      "Nothing, it is already a full meal": c5v3_balance
  - prompt: Which group are nuts in?
    options:
    - Body-building
    - Protective
    - Junk
    answer: Body-building
    difficulty: 2
    hints:
    - Nuts are like dal in what they give.
    - They help us grow.
    solution: 'Step 1: nuts have lots of protein. Step 2: they are body-building food.'
    mistakes:
      Protective: c5v3_group
      Junk: c5v3_group
  - prompt: Which breakfast is most balanced?
    options:
    - "Dosa with sambar and a fruit"
    - "Two sweet biscuits and a candy"
    - "A cup of tea with nothing else"
    answer: Dosa with sambar and a fruit
    difficulty: 3
    hints:
    - Look for all three groups.
    - Dosa = energy, sambar = dal, fruit = protective.
    solution: 'Step 1: dosa, sambar and fruit cover all three groups. Step 2: so it is balanced.'
    mistakes:
      "Two sweet biscuits and a candy": c5v3_balance
      "A cup of tea with nothing else": c5v3_balance
  - prompt: 'Case: A child''s tiffin every day has only white bread and jam. The child often feels tired and falls ill easily. Which change would help most?'
    options:
    - "Add dal or egg, and a fruit or vegetable"
    - "Add more jam and a little extra sugar"
    - "Swap the bread for sweet cream biscuits"
    answer: Add dal or egg, and a fruit or vegetable
    hints:
    - Which food groups are in bread and jam?
    - Which groups are missing?
    solution: Bread and jam give mostly energy. The tiffin is missing body-building food, like dal or egg, and protective food, like fruit or vegetables.
    mistakes:
      "Add more jam and a little extra sugar": c5v3_balance
      "Swap the bread for sweet cream biscuits": c5v3_balance
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are planning a balanced dinner for your family. Which plan is best?'
    options:
    - "Chapati, paneer curry, a salad and water"
    - "Only a big plate of rice and some pickle"
    - "Instant noodles with a large cold drink"
    answer: Chapati, paneer curry, a salad and water
    hints:
    - A balanced meal has foods from three groups.
    - Which plan has energy, body-building and protective food?
    solution: Chapati gives energy, paneer builds the body and salad protects. With water, that is a balanced meal.
    mistakes:
      "Only a big plate of rice and some pickle": c5v3_balance
      "Instant noodles with a large cold drink": c5v3_balance
    exam: competency
    difficulty: 2
- code: cbse5v.food.journey
  title: Where food comes from and how it keeps
  after:
  - cbse5v.food.groups
  notes: |
    Food comes from plants (grains, fruits, vegetables, spices) and animals (milk, eggs, fish). Farm to plate: grow →
    harvest → market → kitchen. Food spoils because of germs, warmth and moisture; signs are bad smell, mould, change in
    colour. Keep food fresh: refrigerate, dry (papad, dried fish), salt or pickle, keep covered. Don't waste food.
  explanations:
    text: Our food comes from plants and animals. It travels from farms to markets to our kitchens. Food goes bad when germs grow on it, especially in warm, wet places. Drying, salting, pickling and keeping food cold help it last longer.
    visual: 'Draw arrows: a field of rice → a sack → a shop → a cooking pot → a plate.'
    step_by_step: 'Step 1: Name the food. Step 2: Is it from a plant or an animal? Step 3: How did it reach your home? Step 4: How can you keep it fresh?'
    real_world: Kerala homes make mango and lime pickles and dry fish in the sun so food lasts for months.
  picture:
    kind: flow
    steps:
    - 'Farm: grown'
    - Harvested
    - Market or shop
    - 'Kitchen: cooked'
    - Plate
    alt: Food travels from the farm where it is grown, to harvest, to the market, to the kitchen, to our plate.
  activity:
    type: sort
    prompt: Does it keep food fresh, or make it go bad?
    bins:
    - Keeps food fresh
    - Makes food go bad
    items:
    - label: Keeping milk in the fridge
      bin: Keeps food fresh
      clue: Cold slows down germs.
      why: Fresh.
    - label: Covering cooked food
      bin: Keeps food fresh
      clue: Keeps flies and dust off.
      why: Fresh.
    - label: Drying fish or papads in the sun
      bin: Keeps food fresh
      clue: Germs need water to grow.
      why: Dry food keeps.
    - label: Making pickles with salt and oil
      bin: Keeps food fresh
      clue: Salt stops germs.
      why: Pickles keep for months.
    - label: Leaving cooked rice in a warm kitchen overnight
      bin: Makes food go bad
      clue: Germs love warm, damp food.
      why: It can spoil.
    - label: Keeping wet bread in a closed box
      bin: Makes food go bad
      clue: Damp and dark.
      why: Mould grows.
    - label: Flies sitting on open food
      bin: Makes food go bad
      clue: They carry germs.
      why: Spoils food.
    - label: Leaving unboiled milk out on a hot day
      bin: Makes food go bad
      clue: Warm and not boiled.
      why: It turns sour.
  lesson:
    - teach: 'Food comes from plants (grains, fruits, vegetables, spices) and from animals (milk, eggs, fish, meat). It travels from farm to plate: grown, harvested, sent to market, then cooked in the kitchen.'
      picture:
        kind: flow
        steps:
        - Grown on a farm
        - Harvested
        - Sent to market
        - Cooked at home
        - On your plate
        alt: Food travels from the farm through the market to our plate.
      check:
        prompt: 'Pepper comes from:'
        options:
        - A plant
        - An animal
        - A factory only
        answer: A plant
        why: Pepper is the dried berry of a climbing plant.
      ways:
      - style: step_by_step
        teach: 'Follow a mango from tree to plate. Step 1: It grows on a tree in an orchard. Step 2: The farmer picks it when it is ready (harvest). Step 3: A truck takes it to the market. Step 4: Your family buys it. Step 5: It is washed, cut and eaten at home.'
      - style: real_world
        teach: Open the fridge at home and sort what you see. Milk, curd, paneer and eggs came from animals. Tomatoes, coriander, lemons and ginger came from plants.
    - teach: 'Food spoils when germs grow on it. Germs grow fastest when it is warm and moist. Signs of spoiled food: bad smell, mould (fuzzy spots), sour taste, or a change in colour.'
      check:
        prompt: Which is a sign that bread has spoiled?
        options:
        - Green fuzzy spots
        - It is soft
        - It is brown on top
        answer: Green fuzzy spots
        why: That is mould, a kind of germ growth.
      ways:
      - style: visual
        teach: What helps germs spoil food, and what slows them down.
        picture:
          kind: compare
          columns:
          - title: Germs grow fast
            points:
            - Warm places
            - Damp places
            - Food left open
          - title: Germs grow slowly
            points:
            - Cold places like a fridge
            - Dry food
            - Food kept covered
          alt: Germs grow fast in warm, damp places and on food left open. They grow slowly in cold places like a fridge, on dry food and on food that is kept covered.
      - style: step_by_step
        teach: 'Check if food is safe. Step 1: Look: are there fuzzy spots of mould or a strange colour? Step 2: Smell: is it sour or bad? Step 3: If either is true, do not eat it. When in doubt, ask an adult.'
    - teach: We keep food fresh by keeping it cold (fridge), drying it (papad, dried fish), adding salt or oil (pickles), and keeping it covered. Take only what you can eat so food is not wasted.
      check:
        prompt: Why do we dry fish in the sun?
        options:
        - Germs cannot grow without moisture
        - To make it wet
        - To change its colour
        answer: Germs cannot grow without moisture
        why: Drying removes the water germs need.
      ways:
      - style: visual
        teach: Old ways and new ways of keeping food from spoiling.
        picture:
          kind: compare
          columns:
          - title: Drying
            points:
            - Papad
            - Dried fish
            - Dried chillies
          - title: Salt or oil
            points:
            - Lime pickle
            - Salted mango
          - title: Cold
            points:
            - Milk and curd in the fridge
          alt: Food is kept from spoiling by drying, like papad, dried fish and dried chillies; by adding salt or oil, like lime pickle and salted mango; and by cold, like milk and curd in the fridge.
      - style: real_world
        teach: Before fridges, families in coastal villages dried fish in the sun on mats so it would last through the rainy months, when boats could not go out to sea. Drying takes away the water that germs need.
  items:
  - prompt: Which food comes from an animal?
    options:
    - milk
    - rice
    - banana
    - wheat
    answer: milk
    difficulty: 1
    hints:
    - Cows and buffaloes.
    - Dairy.
    solution: Milk comes from cows, buffaloes and goats.
    mistakes: {"wheat": "v5_animal_food"}
  - prompt: What is a sign that food has spoiled?
    options:
    - a bad smell
    - it is warm
    - it is on a plate
    - it is cooked
    answer: a bad smell
    difficulty: 1
    hints:
    - Use your nose.
    - Mould too.
    solution: A bad smell or mould shows food has gone bad.
    mistakes: {"it is warm": "v5_spoiled"}
  - prompt: 'Pickling with salt and oil helps food to:'
    options:
    - last longer
    - spoil faster
    - grow bigger
    - change into water
    answer: last longer
    difficulty: 1
    hints:
    - Germs can't grow well.
    - Mango pickle lasts months.
    solution: Salt and oil keep germs away, so pickles last.
    mistakes: {"spoil faster": "v5_pickle"}
  - prompt: 'Food spoils fastest when it is:'
    options:
    - warm and moist
    - cold and dry
    - frozen
    - sealed and dry
    answer: warm and moist
    difficulty: 2
    hints:
    - Germs like warmth.
    - And wetness.
    solution: Germs grow quickly in warm, moist food.
    mistakes:
      cold and dry: c5v_think
  - prompt: Why do we keep milk in a fridge?
    options:
    - cold slows down germs
    - it makes milk sweeter
    - it makes milk thicker
    - it turns milk into curd
    answer: cold slows down germs
    difficulty: 2
    hints:
    - Germs grow slowly in cold.
    - Fridge = cold.
    solution: Cold slows germ growth, keeping milk fresh.
    mistakes: {"it turns milk into curd": "v5_fridge"}
  - prompt: Which is a good way to avoid wasting food?
    options:
    - "take only as much as you can eat"
    - "throw away all the leftovers"
    - "cook far more than you need"
    - "leave cooked food uncovered"
    answer: take only as much as you can eat
    difficulty: 1
    hints:
    - Serve small portions.
    - Ask for more later.
    solution: Taking only what you need stops waste.
    mistakes: {"cook far more than you need": "v5_waste"}
  - prompt: Which food comes from a plant?
    options:
    - Coconut
    - Egg
    - Curd
    answer: Coconut
    difficulty: 1
    hints:
    - It grows on a tree.
    - Kerala has many of these trees.
    solution: 'Step 1: eggs and curd come from animals. Step 2: coconut grows on a palm.'
    mistakes:
      Egg: c5v3_source
      Curd: c5v3_source
  - prompt: 'Curd is made from:'
    options:
    - Milk
    - Rice
    - Coconut water
    answer: Milk
    difficulty: 1
    hints:
    - It is white and comes from an animal food.
    - It is set overnight with a spoon of old curd.
    solution: 'Step 1: curd forms when milk is set. Step 2: so it comes from milk.'
    mistakes:
      Rice: c5v3_source
      Coconut water: c5v3_source
  - prompt: Where does food spoil fastest?
    options:
    - "Left out on a hot, humid day"
    - "Kept covered inside a fridge"
    - "Packed in a dry, closed tin"
    answer: Left out on a hot, humid day
    difficulty: 2
    hints:
    - Germs like warmth and damp.
    - Which place is both?
    solution: 'Step 1: germs grow fast in warm, moist air. Step 2: a hot humid day is worst.'
    mistakes:
      "Kept covered inside a fridge": c5v3_spoil
      "Packed in a dry, closed tin": c5v3_spoil
  - prompt: 'Mango pickle lasts a long time because of:'
    options:
    - Salt and oil
    - Water
    - Sugar only
    answer: Salt and oil
    difficulty: 2
    hints:
    - These two stop germs.
    - Pickles are oily and salty.
