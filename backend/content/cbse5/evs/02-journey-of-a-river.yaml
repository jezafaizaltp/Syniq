# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 2
title: Journey of a River
concepts:
- code: cbse5v.river.path
  title: From mountain to sea
  notes: |
    Many rivers begin high in the mountains from melting glaciers or springs (the Ganga starts at the Gangotri glacier).
    In the mountains the river is narrow and fast; on the plains it becomes wide and slow, and carries soft soil (silt)
    that makes land fertile. Smaller rivers (tributaries) join it. It ends at the sea, often spreading into a delta.
  explanations:
    text: A river is born high in the mountains, often from melting ice. It rushes down narrow valleys, then slows down and widens on flat land, carrying rich soil for farms. At last it flows into the sea.
    visual: Draw a mountain with snow at the top. Draw a thin wavy line down the slope, becoming wider across flat land, and ending in a fan shape at the sea.
    step_by_step: 'Step 1: Start at the source (glacier or spring). Step 2: Follow it down the mountain (fast). Step 3: Across the plains (slow, wide). Step 4: Into the sea (mouth or delta).'
    real_world: The Ganga flows from the Himalayas across North India to the Bay of Bengal; Kerala's rivers run from the Western Ghats to the Arabian Sea.
  picture:
    kind: flow
    steps:
    - Glacier or spring (source)
    - Fast, narrow in the mountains
    - Wide, slow on the plains
    - Meets the sea (mouth)
    alt: 'A river''s journey: from its source at a glacier or spring, fast and narrow in the mountains, wide and slow on the plains, to its mouth at the sea.'
  activity:
    type: order
    prompt: Follow a river from where it starts to where it ends.
    steps:
    - Ice melts high in the mountains
    - A fast, narrow stream rushes down a valley
    - The river slows down and gets wider on flat land
    - It leaves rich soil for farms
    - The river reaches the sea
    reasons:
      A fast, narrow stream rushes down a valley: The water starts high up as ice and runs downhill.
      The river slows down and gets wider on flat land: It slows only after coming down off the steep slopes.
      It leaves rich soil for farms: Slow water drops the soil it was carrying.
      The river reaches the sea: The sea is the end of the journey.
  items:
  - prompt: Where does the Ganga begin?
    options:
    - Gangotri glacier
    - the Arabian Sea
    - a desert
    - a city tank
    answer: Gangotri glacier
    difficulty: 1
    hints:
    - High in the Himalayas.
    - Melting ice.
    solution: The Ganga starts at the Gangotri glacier.
  - prompt: 'In the mountains a river is usually:'
    options:
    - narrow and fast
    - wide and slow
    - dry
    - salty
    answer: narrow and fast
    difficulty: 1
    hints:
    - Water runs fast downhill.
    - Steep slopes.
    solution: On steep slopes the river runs narrow and fast.
  - prompt: Where does a river usually end?
    options:
    - in the sea
    - on a mountain top
    - in a forest
    - under a glacier
    answer: in the sea
    difficulty: 1
    hints:
    - Rivers flow downhill.
    - To the lowest place.
    solution: Rivers flow into the sea.
  - prompt: What is a smaller river that joins a bigger one called?
    options:
    - a tributary
    - a glacier
    - a delta
    - a source
    answer: a tributary
    difficulty: 2
    hints:
    - It adds water to the main river.
    - Tribute = gift.
    solution: A tributary joins and feeds a bigger river.
  - prompt: Why is land near rivers on the plains good for farming?
    options:
    - the river leaves rich soil (silt)
    - it never rains there
    - it is very rocky
    - it is always frozen
    answer: the river leaves rich soil (silt)
    difficulty: 2
    hints:
    - What does the river carry?
    - Soft soil.
    solution: Rivers spread fertile silt on the plains.
    mistakes:
      it never rains there: c5v_think
  - prompt: 'Kerala''s rivers mostly start in the:'
    options:
    - Western Ghats
    - Thar Desert
    - Himalayas
    - Bay of Bengal
    answer: Western Ghats
    difficulty: 2
    hints:
    - Hills on Kerala's east side.
    - Not far away.
    solution: Kerala's rivers rise in the Western Ghats and flow to the Arabian Sea.
- code: cbse5v.river.care
  title: Life along a river
  after:
  - cbse5v.river.path
  notes: |
    Rivers give drinking water, water for fields, fish, transport and places to live; many towns and cities grew on
    riverbanks. Rivers are also home to fish, turtles, dolphins (the Ganga river dolphin) and birds. Pollution from
    sewage, factory waste and plastic harms them. Keep rivers clean: no waste dumping, plant trees on banks.
  explanations:
    text: Rivers give us water, food and a way to travel, which is why so many towns grew along them. Animals like fish, turtles and river dolphins live in them. When people throw waste in rivers, the water becomes dirty and animals die.
    visual: Draw a river with a village, fields, a fishing boat and a dolphin on one side; on the other draw a pipe pouring dirty water and a sad fish.
    step_by_step: 'Step 1: List what a river gives people. Step 2: List who lives in a river. Step 3: Think what harms the river. Step 4: Choose a way to protect it.'
    real_world: Clean-up drives along rivers like the Ganga and the Periyar remove plastic and teach people to keep rivers clean.
  picture:
    kind: compare
    columns:
    - title: Rivers give us
      points:
      - water
      - fish
      - transport
    - title: Harms rivers
      points:
      - sewage
      - factory waste
      - plastic
    alt: Rivers give us water, fish and transport; sewage, factory waste and plastic harm them.
  activity:
    type: sort
    prompt: Does it keep the river healthy, or harm it?
    bins:
    - Keeps it healthy
    - Harms it
    items:
    - label: Planting trees along the banks
      bin: Keeps it healthy
      clue: Roots hold the soil.
      why: Healthy banks.
    - label: A river clean-up day
      bin: Keeps it healthy
      clue: Picking up rubbish.
      why: Helps.
    - label: Protecting river dolphins
      bin: Keeps it healthy
      clue: Animals that live there.
      why: Helps.
    - label: Putting flowers from prayers in a compost pit, not the river
      bin: Keeps it healthy
      clue: Where does the waste go?
      why: Keeps rubbish out.
    - label: Throwing plastic bags in
      bin: Harms it
      clue: Plastic doesn't rot.
      why: Harms fish and turtles.
    - label: Factory waste flowing in
      bin: Harms it
      clue: Dirty chemicals in the water.
      why: Pollution.
    - label: Washing clothes with soap in the river
      bin: Harms it
      clue: Soap goes into the water.
      why: Pollutes.
    - label: Dumping garbage on the banks
      bin: Harms it
      clue: Rain washes it in.
      why: Harms.
  items:
  - prompt: Why did many cities grow on riverbanks?
    options:
    - rivers give water and transport
    - rivers are noisy
    - rivers have no fish
    - rivers are always dry
    answer: rivers give water and transport
    difficulty: 1
    hints:
    - What do people need daily?
    - Water.
    solution: Rivers provide water, food and transport.
  - prompt: Which animal lives in the Ganga?
    options:
    - river dolphin
    - camel
    - polar bear
    - penguin
    answer: river dolphin
    difficulty: 1
    hints:
    - It swims.
    - India's national aquatic animal.
    solution: The Ganga river dolphin lives in the river.
  - prompt: Which harms a river?
    options:
    - dumping plastic
    - planting trees on banks
    - cleaning the bank
    - saving water
    answer: dumping plastic
    difficulty: 1
    hints:
    - What makes water dirty?
    - Waste.
    solution: Plastic pollutes rivers and hurts animals.
    mistakes:
      planting trees on banks: c5v_reread
  - prompt: How do trees on riverbanks help?
    options:
    - their roots hold the soil
    - they make the water salty
    - they block all rain
    - they eat the fish
    answer: their roots hold the soil
    difficulty: 2
    hints:
    - What stops banks washing away?
    - Roots.
    solution: Roots hold soil and stop banks crumbling.
  - prompt: Which is a use of a river?
    options:
    - watering fields
    - making clouds of dust
    - building snowmen
    - growing in a desert
    answer: watering fields
    difficulty: 1
    hints:
    - Farmers.
    - Canals.
    solution: River water irrigates fields.
  - prompt: What can you do to keep rivers clean?
    options:
    - never throw waste into them
    - wash plastic bags in them
    - pour paint into them
    - throw food packets in
    answer: never throw waste into them
    difficulty: 1
    hints:
    - Keep it out.
    - Bins.
    solution: Keeping waste out of rivers keeps them clean.
