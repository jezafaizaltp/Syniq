# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 2
title: Journey of a River
tips:
  v5_city_river: "People need water to live, and boats carry goods. Where would towns grow?"
  v5_clean_river: "Anything thrown in a river stays in the water fish and people use."
  v5_dolphin: "Penguins live in icy seas. The Ganga has a mammal that swims and is almost blind."
  v5_gangotri: "Rivers flow downhill, so they start high up, often from melting ice."
  v5_ghats: "The Himalayas are far north. Kerala's rivers start in the hills along its eastern edge."
  v5_mountain_river: "On steep slopes water rushes down quickly through narrow valleys."
  v5_river_end: "Water flows downhill. Where is the lowest place it can reach?"
  v5_river_use: "Farmers dig channels from rivers. What do they water?"
  v5_roots: "Roots spread under the ground. What do they hold in place?"
  v5_tributary: "A delta is where a river splits near the sea. A small river that feeds into a big one has another name."
  c5v2_path: 'Follow the river in order: high mountains first, then flat land, then where it meets salty water.'
  c5v2_speed: Steep land makes water rush; flat land lets it spread out and slow down.
  c5v2_soil: Think about what the river carries along with the water and drops when it slows.
  c5v2_use: 'Think of everything people and animals get from a river: drink, food, fields, travel.'
  c5v2_harm: 'Ask: does this put waste into the river, or protect it?'

concepts:
- code: cbse5v.river.path
  title: From mountain to sea
  notes: |
    Many rivers begin high in the mountains from melting glaciers or springs (the Ganga starts at the Gangotri glacier).
    In the mountains the river is narrow and fast; on the plains it becomes wide and slow, and carries soft soil (silt)
    that makes land fertile. Smaller rivers (tributaries) join it. It ends at the sea, often spreading into a delta.
  explanations:
    text: A river is born high in the mountains, often from melting ice. It rushes down narrow valleys, then slows down and widens on flat land, carrying rich soil for farms. At last it flows into the sea.
    visual: Draw a mountain with snow at the top. Draw a thin wavy line down the slope, becoming wider across flat land, and ending in a fan shape at the sea.
    step_by_step: 'Step 1: Start at the source (glacier or spring). Step 2: Follow it down the mountain (fast). Step 3: Across the plains (slow, wide). Step 4: Into the sea (mouth or delta).'
    real_world: The Ganga flows from the Himalayas across North India to the Bay of Bengal; Kerala's rivers run from the Western Ghats to the Arabian Sea.
  picture:
    kind: flow
    steps:
    - Glacier or spring (source)
    - Fast, narrow in the mountains
    - Wide, slow on the plains
    - Meets the sea (mouth)
    alt: 'A river''s journey: from its source at a glacier or spring, fast and narrow in the mountains, wide and slow on the plains, to its mouth at the sea.'
  activity:
    type: order
    prompt: Follow a river from where it starts to where it ends.
    steps:
    - Ice melts high in the mountains
    - A fast, narrow stream rushes down a valley
    - The river slows down and gets wider on flat land
    - It leaves rich soil for farms
    - The river reaches the sea
    reasons:
      A fast, narrow stream rushes down a valley: The water starts high up as ice and runs downhill.
      The river slows down and gets wider on flat land: It slows only after coming down off the steep slopes.
      It leaves rich soil for farms: Slow water drops the soil it was carrying.
      The river reaches the sea: The sea is the end of the journey.
  lesson:
    - teach: Many rivers begin high in the mountains, from melting ice (glaciers) or springs. The Ganga starts at the Gangotri glacier in the Himalayas. Kerala's rivers start in the Western Ghats.
      check:
        prompt: What is a glacier?
        options:
        - A huge, slow river of ice
        - A small pond
        - A kind of fish
        answer: A huge, slow river of ice
        why: Melting glacier ice feeds rivers.
    - teach: In the mountains the land is steep, so the river is narrow and fast. On the plains the land is flat, so the river becomes wide and slow. Smaller rivers called tributaries join it on the way.
      picture:
        kind: flow
        steps:
        - Glacier or spring
        - 'Mountains: narrow, fast'
        - 'Plains: wide, slow'
        - Delta at the sea
        alt: A river runs from its source in the mountains across the plains to the sea.
      check:
        prompt: Why is a river fast in the mountains?
        options:
        - The land is steep
        - The water is warm
        - It is very wide
        answer: The land is steep
        why: Water rushes down slopes.
    - teach: As the river slows on the plains it drops soft, rich soil called silt, which makes farmland fertile. At the end it meets the sea, often spreading into many branches called a delta.
      check:
        prompt: Why are river plains good for farming?
        options:
        - The river leaves rich soil
        - They have no water
        - They are very rocky
        answer: The river leaves rich soil
        why: Silt is full of what plants need.
  items:
  - prompt: Where does the Ganga begin?
    options:
    - Gangotri glacier
    - the Arabian Sea
    - a desert
    - a city tank
    answer: Gangotri glacier
    difficulty: 1
    hints:
    - High in the Himalayas.
    - Melting ice.
    solution: The Ganga starts at the Gangotri glacier.
    mistakes: {"the Arabian Sea": "v5_gangotri"}
  - prompt: 'In the mountains a river is usually:'
    options:
    - narrow and fast
    - wide and slow
    - dry
    - salty
    answer: narrow and fast
    difficulty: 1
    hints:
    - Water runs fast downhill.
    - Steep slopes.
    solution: On steep slopes the river runs narrow and fast.
    mistakes: {"wide and slow": "v5_mountain_river"}
  - prompt: Where does a river usually end?
    options:
    - in the sea
    - on a mountain top
    - in a forest
    - under a glacier
    answer: in the sea
    difficulty: 1
    hints:
    - Rivers flow downhill.
    - To the lowest place.
    solution: Rivers flow into the sea.
    mistakes: {"on a mountain top": "v5_river_end"}
  - prompt: What is a smaller river that joins a bigger one called?
    options:
    - a tributary
    - a glacier
    - a delta
    - a source
    answer: a tributary
    difficulty: 2
    hints:
    - It adds water to the main river.
    - Tribute = gift.
    solution: A tributary joins and feeds a bigger river.
    mistakes: {"a delta": "v5_tributary"}
  - prompt: Why is land near rivers on the plains good for farming?
    options:
    - the river leaves rich soil (silt)
    - it never rains there
    - it is very rocky
    - it is always frozen
    answer: the river leaves rich soil (silt)
    difficulty: 2
    hints:
    - What does the river carry?
    - Soft soil.
    solution: Rivers spread fertile silt on the plains.
    mistakes:
      it never rains there: c5v_think
  - prompt: 'Kerala''s rivers mostly start in the:'
    options:
    - Western Ghats
    - Thar Desert
    - Himalayas
    - Bay of Bengal
    answer: Western Ghats
    difficulty: 2
    hints:
    - Hills on Kerala's east side.
    - Not far away.
    solution: Kerala's rivers rise in the Western Ghats and flow to the Arabian Sea.
    mistakes: {"Himalayas": "v5_ghats"}
  - prompt: Where does a river usually begin?
    options:
    - In the mountains
    - In the sea
    - In a city
    answer: In the mountains
    difficulty: 1
    hints:
    - Rivers flow downhill.
    - So they start high up.
    solution: 'Step 1: water flows from high to low. Step 2: rivers start in the mountains.'
    mistakes:
      In the sea: c5v2_path
      In a city: c5v2_path
  - prompt: 'On the plains a river is usually:'
    options:
    - Wide and slow
    - Narrow and fast
    - Frozen
    answer: Wide and slow
    difficulty: 1
    hints:
    - The plains are flat.
    - Flat land slows water down.
    solution: 'Step 1: flat land. Step 2: the river spreads wide and flows slowly.'
    mistakes:
      Narrow and fast: c5v2_speed
      Frozen: c5v2_speed
  - prompt: What is the soft, rich soil a river leaves on its banks called?
    options:
    - Silt
    - Sand dune
    - Rock
    answer: Silt
    difficulty: 2
    hints:
    - It is very fine and soft.
    - It makes fields fertile.
    solution: 'Step 1: the river drops fine soil when it slows. Step 2: this soil is called silt.'
    mistakes:
      Sand dune: c5v2_soil
      Rock: c5v2_soil
  - prompt: 'Many branches of a river spreading out near the sea form a:'
    options:
    - Delta
    - Glacier
    - Waterfall
    answer: Delta
    difficulty: 2
    hints:
    - It happens at the river's end.
    - The river splits into many channels.
    solution: 'Step 1: near the sea the river spreads. Step 2: the fan of branches is a delta.'
    mistakes:
      Glacier: c5v2_path
      Waterfall: c5v2_path
  - prompt: The Yamuna joins the Ganga. The Yamuna is a ______ of the Ganga.
    options:
    - Tributary
    - Delta
    - Source
    answer: Tributary
    difficulty: 2
    hints:
    - It is a smaller river.
    - It flows into the bigger one.
    solution: 'Step 1: a smaller river joining a bigger one. Step 2: that is a tributary.'
    mistakes:
      Delta: c5v2_path
      Source: c5v2_path
  - prompt: Which is the longest river in Kerala?
    options:
    - Periyar
    - Ganga
    - Yamuna
    answer: Periyar
    difficulty: 2
    hints:
    - Two of these flow in north India.
    - Kerala's rivers start in the Western Ghats.
    solution: 'Step 1: the Ganga and Yamuna are in the north. Step 2: Kerala''s longest river is the Periyar.'
    mistakes:
      Ganga: c5v2_path
      Yamuna: c5v2_path
  - prompt: Why does a river become muddy after heavy rain?
    options:
    - It carries soil washed from the land
    - Fish stir it up
    - The sun colours it
    answer: It carries soil washed from the land
    difficulty: 2
    hints:
    - Rain runs over the land into the river.
    - What does it bring with it?
    solution: 'Step 1: rainwater washes soil into the river. Step 2: the soil makes it muddy.'
    mistakes:
      Fish stir it up: c5v2_soil
      The sun colours it: c5v2_soil
  - prompt: 'Put in order: plains, mountains, sea. Which comes second on a river''s journey?'
    options:
    - Plains
    - Mountains
    - Sea
    answer: Plains
    difficulty: 3
    hints:
    - The river starts high up.
    - It ends at the sea.
    solution: 'Step 1: mountains, then plains, then sea. Step 2: second is the plains.'
    mistakes:
      Mountains: c5v2_path
      Sea: c5v2_path
  - prompt: Waterfalls are most common in which part of a river?
    options:
    - The mountain part
    - The delta
    - The plains
    answer: The mountain part
    difficulty: 3
    hints:
    - A waterfall needs a steep drop.
    - Where is the land steepest?
    solution: 'Step 1: waterfalls need steep land. Step 2: that is in the mountains.'
    mistakes:
      The delta: c5v2_speed
      The plains: c5v2_speed
- code: cbse5v.river.care
  title: Life along a river
  after:
  - cbse5v.river.path
  notes: |
    Rivers give drinking water, water for fields, fish, transport and places to live; many towns and cities grew on
    riverbanks. Rivers are also home to fish, turtles, dolphins (the Ganga river dolphin) and birds. Pollution from
    sewage, factory waste and plastic harms them. Keep rivers clean: no waste dumping, plant trees on banks.
  explanations:
    text: Rivers give us water, food and a way to travel, which is why so many towns grew along them. Animals like fish, turtles and river dolphins live in them. When people throw waste in rivers, the water becomes dirty and animals die.
    visual: Draw a river with a village, fields, a fishing boat and a dolphin on one side; on the other draw a pipe pouring dirty water and a sad fish.
    step_by_step: 'Step 1: List what a river gives people. Step 2: List who lives in a river. Step 3: Think what harms the river. Step 4: Choose a way to protect it.'
    real_world: Clean-up drives along rivers like the Ganga and the Periyar remove plastic and teach people to keep rivers clean.
  picture:
    kind: compare
    columns:
    - title: Rivers give us
      points:
      - water
      - fish
      - transport
    - title: Harms rivers
      points:
      - sewage
      - factory waste
      - plastic
    alt: Rivers give us water, fish and transport; sewage, factory waste and plastic harm them.
  activity:
    type: sort
    prompt: Does it keep the river healthy, or harm it?
    bins:
    - Keeps it healthy
    - Harms it
    items:
    - label: Planting trees along the banks
      bin: Keeps it healthy
      clue: Roots hold the soil.
      why: Healthy banks.
    - label: A river clean-up day
      bin: Keeps it healthy
      clue: Picking up rubbish.
      why: Helps.
    - label: Protecting river dolphins
      bin: Keeps it healthy
      clue: Animals that live there.
      why: Helps.
    - label: Putting flowers from prayers in a compost pit, not the river
      bin: Keeps it healthy
      clue: Where does the waste go?
      why: Keeps rubbish out.
    - label: Throwing plastic bags in
      bin: Harms it
      clue: Plastic doesn't rot.
      why: Harms fish and turtles.
    - label: Factory waste flowing in
      bin: Harms it
      clue: Dirty chemicals in the water.
      why: Pollution.
    - label: Washing clothes with soap in the river
      bin: Harms it
      clue: Soap goes into the water.
      why: Pollutes.
    - label: Dumping garbage on the banks
      bin: Harms it
      clue: Rain washes it in.
      why: Harms.
  lesson:
    - teach: Rivers give us drinking water, water for fields, fish to eat and a way to travel by boat. That is why many towns and cities grew on riverbanks.
      check:
        prompt: Why did early people settle near rivers?
        options:
        - Water for drinking and farming
        - Rivers were noisy
        - To avoid fish
        answer: Water for drinking and farming
        why: People need water every day.
    - teach: 'Rivers are home to many living things: fish, turtles, crabs, birds and the Ganga river dolphin, India''s national aquatic animal. Trees on the banks hold the soil with their roots.'
      picture:
        kind: compare
        columns:
        - title: In the water
          points:
          - Fish
          - Turtles
          - River dolphins
        - title: On the banks
          points:
          - Birds
          - Trees
          - Farms and towns
        alt: Rivers support life in the water and along the banks.
      check:
        prompt: Which is India's national aquatic animal?
        options:
        - Ganga river dolphin
        - Shark
        - Octopus
        answer: Ganga river dolphin
        why: It lives in the Ganga and Brahmaputra rivers.
    - teach: 'Sewage, factory waste and plastic make rivers dirty and kill fish. We can help: never throw waste in rivers, use cloth bags, plant trees on banks, and join river clean-ups.'
      check:
        prompt: Which action helps a river?
        options:
        - Planting trees on its banks
        - Washing a tractor in it
        - Throwing plastic in it
        answer: Planting trees on its banks
        why: Roots stop soil washing in and give shade.
  items:
  - prompt: Why did many cities grow on riverbanks?
    options:
    - rivers give water and transport
    - rivers are noisy
    - rivers have no fish
    - rivers are always dry
    answer: rivers give water and transport
    difficulty: 1
    hints:
    - What do people need daily?
    - Water.
    solution: Rivers provide water, food and transport.
    mistakes: {"rivers are noisy": "v5_city_river"}
  - prompt: Which animal lives in the Ganga?
    options:
    - river dolphin
    - camel
    - polar bear
    - penguin
    answer: river dolphin
    difficulty: 1
    hints:
    - It swims.
    - India's national aquatic animal.
    solution: The Ganga river dolphin lives in the river.
    mistakes: {"penguin": "v5_dolphin"}
  - prompt: Which harms a river?
    options:
    - dumping plastic
    - planting trees on banks
    - cleaning the bank
    - saving water
    answer: dumping plastic
    difficulty: 1
    hints:
    - What makes water dirty?
    - Waste.
    solution: Plastic pollutes rivers and hurts animals.
    mistakes:
      planting trees on banks: c5v_reread
  - prompt: How do trees on riverbanks help?
    options:
    - their roots hold the soil
    - they make the water salty
    - they block all rain
    - they eat the fish
    answer: their roots hold the soil
    difficulty: 2
    hints:
    - What stops banks washing away?
    - Roots.
    solution: Roots hold soil and stop banks crumbling.
    mistakes: {"they make the water salty": "v5_roots"}
  - prompt: Which is a use of a river?
    options:
    - watering fields
    - making clouds of dust
    - building snowmen
    - growing in a desert
    answer: watering fields
    difficulty: 1
    hints:
    - Farmers.
    - Canals.
    solution: River water irrigates fields.
    mistakes: {"building snowmen": "v5_river_use"}
  - prompt: What can you do to keep rivers clean?
    options:
    - never throw waste into them
    - wash plastic bags in them
    - pour paint into them
    - throw food packets in
    answer: never throw waste into them
    difficulty: 1
    hints:
    - Keep it out.
    - Bins.
    solution: Keeping waste out of rivers keeps them clean.
    mistakes: {"wash plastic bags in them": "v5_clean_river"}
  - prompt: Which is NOT something rivers give us?
    options:
    - Electricity from sand
    - Fish
    - Water for fields
    answer: Electricity from sand
    difficulty: 2
    hints:
    - Two are real uses of a river.
    - Which one makes no sense?
    solution: 'Step 1: rivers give fish and water for fields. Step 2: sand does not make electricity.'
    mistakes:
      Fish: c5v2_use
      Water for fields: c5v2_use
  - prompt: What harms fish in a river most?
    options:
    - Factory waste poured into it
    - Rain falling on it
    - Boats with oars
    answer: Factory waste poured into it
    difficulty: 1
    hints:
    - Which one adds poison?
    - Rain is natural.
    solution: 'Step 1: factory waste has harmful chemicals. Step 2: they poison fish.'
    mistakes:
      Rain falling on it: c5v2_harm
      Boats with oars: c5v2_harm
  - prompt: Which city stands on the banks of the Ganga?
    options:
    - Varanasi
    - Jaipur
    - Bengaluru
    answer: Varanasi
    difficulty: 2
    hints:
    - It is a very old holy city.
    - Its ghats are on the Ganga.
    solution: 'Step 1: Jaipur and Bengaluru are not on the Ganga. Step 2: Varanasi is.'
    mistakes:
      Jaipur: c5v2_use
      Bengaluru: c5v2_use
  - prompt: Why should we use cloth bags instead of plastic bags?
    options:
    - Plastic ends up in rivers and harms animals
    - Cloth bags are heavier
    - Plastic is too colourful
    answer: Plastic ends up in rivers and harms animals
    difficulty: 2
    hints:
    - Where does thrown plastic often go?
    - Animals may swallow it.
    solution: 'Step 1: plastic washes into rivers. Step 2: it harms fish, turtles and birds.'
    mistakes:
      Cloth bags are heavier: c5v2_harm
      Plastic is too colourful: c5v2_harm
  - prompt: 'A river dolphin finds its way in muddy water mainly by:'
    options:
    - Using sound echoes
    - Seeing very well
    - Smelling flowers
    answer: Using sound echoes
    difficulty: 3
    hints:
    - Muddy water is hard to see through.
    - It sends sounds and listens to them bounce back.
    solution: 'Step 1: it cannot see well in mud. Step 2: it uses echoes of sound.'
    mistakes:
      Seeing very well: c5v2_use
      Smelling flowers: c5v2_use
  - prompt: 'In Kerala, people travel on backwaters and rivers using:'
    options:
    - Boats
    - Camels
    - Snow sleds
    answer: Boats
    difficulty: 1
    hints:
    - They move on water.
    - Think of a houseboat.
    solution: 'Step 1: travel on water needs a vessel. Step 2: boats are used.'
    mistakes:
      Camels: c5v2_use
      Snow sleds: c5v2_use
  - prompt: What happens to a riverbank when trees are cut down?
    options:
    - The soil washes away
    - It becomes stronger
    - It grows taller
    answer: The soil washes away
    difficulty: 2
    hints:
    - Roots hold soil together.
    - What if there are no roots?
    solution: 'Step 1: roots hold the soil. Step 2: without them the river washes the soil away.'
    mistakes:
      It becomes stronger: c5v2_harm
      It grows taller: c5v2_harm
  - prompt: 'Sewage is:'
    options:
    - Dirty waste water from homes and toilets
    - Clean rainwater
    - River sand
    answer: Dirty waste water from homes and toilets
    difficulty: 2
    hints:
    - It flows out of drains.
    - It should be cleaned before reaching a river.
    solution: 'Step 1: drains carry used water from homes. Step 2: that dirty water is sewage.'
    mistakes:
      Clean rainwater: c5v2_harm
      River sand: c5v2_harm
  - prompt: Your class plans to help a local river. What is the best first step?
    options:
    - Pick up litter on the bank with an adult
    - Throw flowers in it
    - Wash bikes in it
    answer: Pick up litter on the bank with an adult
    difficulty: 3
    hints:
    - Which removes waste?
    - Stay safe near water.
    solution: 'Step 1: litter harms rivers. Step 2: collecting it safely helps.'
    mistakes:
      Throw flowers in it: c5v2_harm
      Wash bikes in it: c5v2_harm
