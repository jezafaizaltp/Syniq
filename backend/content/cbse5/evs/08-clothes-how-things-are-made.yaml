    - So drivers can see them easily
    - To keep warm
    - For fashion
    answer: So drivers can see them easily
    difficulty: 2
    hints:
    - They stand on busy roads.
    - Shiny strips catch headlights at night.
    solution: 'Step 1: roads are dangerous. Step 2: bright jackets help drivers see them.'
