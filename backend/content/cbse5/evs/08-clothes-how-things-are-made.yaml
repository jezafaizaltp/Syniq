      For fashion: c5v8_work
  - prompt: 'Two thin sweaters keep you warmer than one thick one because:'
    options:
    - Air is trapped between the layers
    - Thin sweaters are hotter
    - Sweaters make heat
    answer: Air is trapped between the layers
    difficulty: 3
    hints:
    - Trapped air stops heat escaping.
    - There is a layer of air between them.
    solution: 'Step 1: layers trap air between them. Step 2: more trapped air keeps more heat in.'
    mistakes:
      Thin sweaters are hotter: c5v8_weather
      Sweaters make heat: c5v8_weather
  - prompt: 'Case: A family from Chennai is going to Shimla in December, where it may snow. They pack only cotton T-shirts and shorts. What should they add?'
    options:
    - Woollen sweaters, caps and socks
    - More cotton T-shirts
    - Thin silk scarves only
    answer: Woollen sweaters, caps and socks
    hints:
    - What will the weather be like in Shimla in December?
    - Which fibre keeps the body's heat in?
    solution: Shimla is very cold in December. Wool traps warm air close to the body, so woollen sweaters, caps and socks will keep them warm.
    mistakes:
      More cotton T-shirts: c5v8_weather
      Thin silk scarves only: c5v8_weather
    exam: case
    difficulty: 2
  - prompt: 'Situation: A beekeeper is going to collect honey from a busy hive. What should the beekeeper wear?'
    options:
    - A full suit with gloves and a net over the face
    - A short-sleeved shirt
    - Nothing special
    answer: A full suit with gloves and a net over the face
    hints:
    - What could harm the beekeeper at the hive?
    - Which clothing covers the skin completely?
    solution: Bees may sting. A full suit, gloves and a face net cover the skin so the stings cannot reach it.
