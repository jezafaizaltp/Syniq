# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 8
title: Clothes—How Things are Made
concepts:
- code: cbse5v.clothes.fibres
  title: From fibre to fabric
  notes: |
    Clothes are made of fibres. Natural fibres: cotton (from cotton plant bolls), jute (stem of jute plant, for sacks),
    wool (sheep, goat hair), silk (silkworm cocoons). Man-made fibres: nylon, polyester. Fibre → spun into yarn (thread) →
    woven or knitted into fabric → cut and stitched into clothes. India's handloom traditions: Kanchipuram silk, Kerala
    kasavu, Assam muga silk.
  explanations:
    text: Clothes start as tiny fibres. Cotton comes from a plant, wool from sheep and silk from silkworms. Fibres are twisted into thread (spinning), and threads are woven into cloth (weaving). Then the tailor stitches it into clothes.
    visual: Draw a cotton plant with fluffy bolls → a spinning wheel making thread → a loom weaving cloth → a shirt.
    step_by_step: 'Step 1: Name the cloth. Step 2: Find its fibre. Step 3: Is the fibre from a plant, an animal or a factory? Step 4: Follow fibre → yarn → fabric → clothes.'
    real_world: Kerala's kasavu saris are woven from cotton with a gold border; Gandhiji's charkha made spinning a symbol of freedom.
  picture:
    kind: flow
    steps:
    - Fibre (cotton, wool, silk)
    - Spinning → yarn
    - Weaving → fabric
    - Stitching → clothes
    alt: 'From fibre to clothes: fibres are spun into yarn, yarn is woven into fabric, and fabric is stitched into clothes.'
  activity:
    type: sort
    prompt: Where does the fibre come from?
    bins:
    - From plants
    - From animals
    items:
    - label: Cotton
      bin: From plants
      clue: Fluffy balls on a bush.
      why: A plant fibre.
    - label: Jute
      bin: From plants
      clue: Used for sacks.
      why: From a plant's stem.
    - label: Coir
      bin: From plants
      clue: Ropes and mats.
      why: From coconut husks.
    - label: Linen
      bin: From plants
      clue: From the flax plant.
      why: A plant fibre.
    - label: Wool
      bin: From animals
      clue: Sheep's fleece.
      why: An animal fibre.
    - label: Silk
      bin: From animals
      clue: Spun by silkworms.
      why: An animal fibre.
    - label: Pashmina
      bin: From animals
      clue: From goats in the cold mountains.
      why: An animal fibre.
  items:
  - prompt: 'Cotton comes from:'
    options:
    - a plant
    - a sheep
    - a silkworm
    - a factory only
    answer: a plant
    difficulty: 1
    hints:
    - Fluffy white bolls.
    - Grows in fields.
    solution: Cotton comes from the cotton plant.
  - prompt: 'Wool comes from:'
    options:
    - sheep
    - cotton plants
    - silkworms
    - jute
    answer: sheep
    difficulty: 1
    hints:
    - A woolly animal.
    - Baa.
    solution: Wool comes from sheep's hair.
  - prompt: 'Silk is made by:'
    options:
    - silkworms
    - sheep
    - cows
    - spiders in houses
    answer: silkworms
    difficulty: 1
    hints:
    - They make cocoons.
    - Worm.
    solution: Silkworms spin silk cocoons.
  - prompt: 'Twisting fibres into thread is called:'
    options:
    - spinning
    - weaving
    - stitching
    - washing
    answer: spinning
    difficulty: 2
    hints:
    - The charkha does it.
    - Spin = twist.
    solution: Spinning turns fibres into yarn.
  - prompt: Which fibre is used to make sacks?
    options:
    - jute
    - silk
    - wool
    - nylon
    answer: jute
    difficulty: 2
    hints:
    - Golden fibre.
    - Strong and rough.
    solution: Jute makes strong sacks.
  - prompt: Which is a man-made fibre?
    options:
    - polyester
    - cotton
    - wool
    - silk
    answer: polyester
    difficulty: 2
    hints:
    - Made in factories.
    - Not from plants or animals.
    solution: Polyester is made from chemicals in factories.
- code: cbse5v.clothes.weather
  title: Clothes for weather and work
  after:
  - cbse5v.clothes.fibres
  notes: |
    We wear cotton in hot weather (it soaks up sweat and lets air through), wool in cold weather (traps warm air),
    raincoats and umbrellas in rain (waterproof). Some work needs special clothes: doctors' coats, firefighters'
    fireproof suits, helmets. Reuse and recycle clothes: hand-me-downs, patchwork, donating.
  explanations:
    text: We choose clothes to suit the weather. Cotton keeps us cool in summer. Woollen sweaters keep us warm in winter. Raincoats keep us dry. Some jobs need special clothes for safety, like a firefighter's suit.
    visual: 'Draw three children: one in a cotton T-shirt with the sun, one in a sweater with snow, one in a raincoat with rain.'
    step_by_step: 'Step 1: What is the weather? Step 2: Do you need to stay cool, warm or dry? Step 3: Pick the cloth that does that.'
    real_world: In Kerala people wear light cotton most of the year; in Kashmir people wear the woollen pheran in winter.
  picture:
    kind: compare
    columns:
    - title: Hot weather
      points:
      - cotton
      - light colours
    - title: Cold weather
      points:
      - wool
      - layers
    - title: Rain
      points:
      - raincoat
      - umbrella
    alt: In hot weather wear cotton in light colours; in cold weather wool and layers; in rain a raincoat and umbrella.
  activity:
    type: sort
    prompt: What weather is it for?
    bins:
    - Hot summer
    - Cold winter
    - Rainy day
    items:
    - label: A loose cotton kurta
      bin: Hot summer
      clue: Light and airy.
      why: For heat.
    - label: A cap to shade your face
      bin: Hot summer
      clue: Keeps the Sun off.
      why: Summer.
    - label: Light-coloured clothes
      bin: Hot summer
      clue: They don't soak up much heat.
      why: Summer.
    - label: A woollen sweater
      bin: Cold winter
      clue: Keeps warmth in.
      why: Winter.
    - label: A muffler and gloves
      bin: Cold winter
      clue: Warm neck and hands.
      why: Winter.
    - label: A raincoat
      bin: Rainy day
      clue: Keeps you dry.
      why: Rain.
    - label: Gumboots
      bin: Rainy day
      clue: For puddles.
      why: Rain.
    - label: An umbrella
      bin: Rainy day
      clue: Overhead.
      why: Rain.
  items:
  - prompt: Which clothes are best in hot weather?
    options:
    - cotton
    - wool
    - leather
    - fur
    answer: cotton
    difficulty: 1
    hints:
    - It soaks sweat.
    - Light and airy.
    solution: Cotton keeps us cool.
    mistakes:
      wool: c5v_think
  - prompt: 'Woollen clothes keep us warm because they:'
    options:
    - trap warm air
    - make heat from electricity
    - are always wet
    - are very thin
    answer: trap warm air
    difficulty: 2
    hints:
    - Tiny air pockets.
    - Air holds warmth.
    solution: Wool traps air, which keeps body heat in.
  - prompt: What keeps you dry in the rain?
    options:
    - a raincoat
    - a cotton shirt
    - a woollen cap
    - sandals
    answer: a raincoat
    difficulty: 1
    hints:
    - Waterproof.
    - Rain slides off.
    solution: Raincoats are waterproof.
  - prompt: Why do firefighters wear special suits?
    options:
    - to protect them from fire and heat
    - to look smart only
    - to stay cool in summer
    - to swim
    answer: to protect them from fire and heat
    difficulty: 1
    hints:
    - Their job is dangerous.
    - Fireproof.
    solution: Fireproof suits protect them from flames.
  - prompt: Which is a good way to reuse old clothes?
    options:
    - give them to someone who needs them
    - burn them
    - throw them in a river
    - bury them in the garden
    answer: give them to someone who needs them
    difficulty: 1
    hints:
    - Someone else can wear them.
    - Donate.
    solution: Donating clothes reuses them.
  - prompt: 'A builder on a building site should wear a:'
    options:
    - helmet
    - party hat
    - woollen cap
    - crown
    answer: helmet
    difficulty: 1
    hints:
    - Things may fall.
    - Head protection.
    solution: A helmet protects the head on building sites.
