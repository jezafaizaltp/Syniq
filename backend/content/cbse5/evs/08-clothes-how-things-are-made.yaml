    - Silk
    - Thin cotton muslin
    answer: Jute
    hints:
    - Which fibre is strong and rough?
    - What are sacks usually made of?
    solution: Jute is a strong, rough plant fibre, which is why it is used for sacks and heavy bags.
    mistakes:
      Silk: c5v8_from
      Thin cotton muslin: c5v8_from
    exam: competency
    difficulty: 2
- code: cbse5v.clothes.weather
  title: Clothes for weather and work
  after:
  - cbse5v.clothes.fibres
  notes: |
    We wear cotton in hot weather (it soaks up sweat and lets air through), wool in cold weather (traps warm air),
    raincoats and umbrellas in rain (waterproof). Some work needs special clothes: doctors' coats, firefighters'
    fireproof suits, helmets. Reuse and recycle clothes: hand-me-downs, patchwork, donating.
  explanations:
    text: We choose clothes to suit the weather. Cotton keeps us cool in summer. Woollen sweaters keep us warm in winter. Raincoats keep us dry. Some jobs need special clothes for safety, like a firefighter's suit.
    visual: 'Draw three children: one in a cotton T-shirt with the sun, one in a sweater with snow, one in a raincoat with rain.'
    step_by_step: 'Step 1: What is the weather? Step 2: Do you need to stay cool, warm or dry? Step 3: Pick the cloth that does that.'
    real_world: In Kerala people wear light cotton most of the year; in Kashmir people wear the woollen pheran in winter.
  picture:
    kind: compare
    columns:
    - title: Hot weather
      points:
      - cotton
      - light colours
    - title: Cold weather
      points:
      - wool
      - layers
    - title: Rain
      points:
      - raincoat
      - umbrella
    alt: In hot weather wear cotton in light colours; in cold weather wool and layers; in rain a raincoat and umbrella.
  activity:
    type: sort
    prompt: What weather is it for?
    bins:
    - Hot summer
    - Cold winter
    - Rainy day
    items:
    - label: A loose cotton kurta
      bin: Hot summer
      clue: Light and airy.
      why: For heat.
    - label: A cap to shade your face
      bin: Hot summer
      clue: Keeps the Sun off.
      why: Summer.
    - label: Light-coloured clothes
      bin: Hot summer
      clue: They don't soak up much heat.
      why: Summer.
    - label: A woollen sweater
      bin: Cold winter
      clue: Keeps warmth in.
      why: Winter.
    - label: A muffler and gloves
      bin: Cold winter
      clue: Warm neck and hands.
      why: Winter.
    - label: A raincoat
      bin: Rainy day
      clue: Keeps you dry.
      why: Rain.
    - label: Gumboots
      bin: Rainy day
      clue: For puddles.
      why: Rain.
    - label: An umbrella
      bin: Rainy day
      clue: Overhead.
      why: Rain.
  lesson:
    - teach: In hot weather we wear light cotton clothes. Cotton soaks up sweat and lets air pass through, which keeps us cool.
      check:
        prompt: Why is cotton good in summer?
        options:
        - It soaks up sweat and lets air through
        - It is very heavy
        - It keeps heat in
        answer: It soaks up sweat and lets air through
        why: That helps the body stay cool.
      ways:
      - style: visual
        teach: Which clothes suit each different kind of weather.
        picture:
          kind: compare
          columns:
          - title: Hot
            points:
            - Light cotton
            - Loose and pale
          - title: Cold
            points:
            - Wool sweater and cap
            - Layers
          - title: Rainy
            points:
            - Raincoat
            - Umbrella
          alt: In hot weather, wear light, loose, pale cotton. In cold weather, wear a wool sweater, a cap and layers. In rainy weather, use a raincoat and an umbrella.
      - style: real_world
        teach: 'After a game of football, a cotton T-shirt is damp with sweat. That is the cotton doing its job: it soaks up sweat so it can dry in the air, which cools your skin.'
    - teach: In cold weather we wear wool. Wool fibres trap air, and trapped air keeps body heat in. In rain we wear raincoats and use umbrellas, which are waterproof.
      picture:
        kind: compare
        columns:
        - title: Weather
          points:
          - Hot
          - Cold
          - Rainy
        - title: Clothes
          points:
          - Cotton
          - Wool
          - Raincoat
        alt: Cotton for hot days, wool for cold days, raincoats for rain.
      check:
        prompt: 'Wool keeps us warm because it:'
        options:
        - Traps warm air
        - Is wet
        - Is very thin
        answer: Traps warm air
        why: Trapped air stops heat escaping.
      ways:
      - style: step_by_step
        teach: 'Test which cloth is waterproof. Step 1: Stretch a piece of cotton over a cup and pour a spoon of water on it. Step 2: Do the same with a piece of plastic raincoat. Step 3: Look inside each cup. The water soaks through cotton, but stays on top of the raincoat.'
      - style: real_world
        teach: People in Ladakh and Kashmir wear long woollen robes and caps in winter. In Rajasthan, people wear loose turbans and light cotton to stay cool in the hot sun.
    - teach: 'Some jobs need special clothes: doctors wear coats and gloves, firefighters wear fireproof suits, builders wear helmets. Old clothes can be reused: handed down, made into bags or cloths, or donated.'
      check:
        prompt: Why do doctors wear gloves during operations?
        options:
        - To stop germs spreading
        - To look smart
        - To keep warm
        answer: To stop germs spreading
        why: Gloves keep wounds clean.
      ways:
      - style: visual
        teach: Some jobs and the special clothes they need.
        picture:
          kind: compare
          columns:
          - title: Job
            points:
            - Doctor
            - Firefighter
            - Builder
          - title: Special clothing
            points:
            - Coat and gloves
            - Fireproof suit
            - Hard helmet
          alt: A doctor wears a coat and gloves, a firefighter wears a fireproof suit, and a builder wears a hard helmet.
      - style: real_world
        teach: In many homes, a shirt that a big sister has grown out of goes to a younger cousin. When it is too worn to wear, it is cut up into dusters, and the buttons are saved in a tin.
