# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 8
title: Clothes—How Things are Made
tips:
  v5_cotton: "Cotton grows as fluffy white balls in a field. Is that from an animal, an insect or something growing?"
  v5_firefighter: "Firefighters go close to flames. What must their clothes do?"
  v5_helmet: "On a building site things can fall from above. What protects the head?"
  v5_jute: "Sacks are rough and strong. The fibre is called 'golden fibre' in Bengal."
  v5_polyester: "Cotton, wool and silk come from plants or animals. Which is made in factories from chemicals?"
  v5_raincoat: "Cotton soaks up water. What is made to let water slide off?"
  v5_reuse_clothes: "Burning makes smoke. Clothes you've outgrown can still fit someone else."
  v5_silk: "Silk comes from the cocoon of an insect larva fed on mulberry leaves."
  v5_spinning: "Weaving makes cloth from thread. The step before that makes the thread."
  v5_trap_air: "Wool has tiny spaces between its fibres. What stays in them?"
  v5_wool: "Wool is the thick hair cut from an animal that says 'baa'."
  c5v8_from: Ask whether the fibre grew on a plant, came from an animal, or was made in a factory.
  c5v8_steps: 'Follow the order from the raw material on the plant or animal, through thread and cloth, to the finished garment.'
  c5v8_weather: Think about what the weather does to your body, and which cloth helps with that.
  c5v8_work: Think about the danger in that job and what the clothing must protect against.
  c5v8_reuse: Ask how the old item can be used again, by you or someone else, instead of thrown away.

concepts:
- code: cbse5v.clothes.fibres
  title: From fibre to fabric
  notes: |
    Clothes are made of fibres. Natural fibres: cotton (from cotton plant bolls), jute (stem of jute plant, for sacks),
    wool (sheep, goat hair), silk (silkworm cocoons). Man-made fibres: nylon, polyester. Fibre → spun into yarn (thread) →
    woven or knitted into fabric → cut and stitched into clothes. India's handloom traditions: Kanchipuram silk, Kerala
    kasavu, Assam muga silk.
  explanations:
    text: Clothes start as tiny fibres. Cotton comes from a plant, wool from sheep and silk from silkworms. Fibres are twisted into thread (spinning), and threads are woven into cloth (weaving). Then the tailor stitches it into clothes.
    visual: Draw a cotton plant with fluffy bolls → a spinning wheel making thread → a loom weaving cloth → a shirt.
    step_by_step: 'Step 1: Name the cloth. Step 2: Find its fibre. Step 3: Is the fibre from a plant, an animal or a factory? Step 4: Follow fibre → yarn → fabric → clothes.'
    real_world: Kerala's kasavu saris are woven from cotton with a gold border; Gandhiji's charkha made spinning a symbol of freedom.
  picture:
    kind: flow
    steps:
    - Fibre (cotton, wool, silk)
    - Spinning → yarn
    - Weaving → fabric
    - Stitching → clothes
    alt: 'From fibre to clothes: fibres are spun into yarn, yarn is woven into fabric, and fabric is stitched into clothes.'
  activity:
    type: sort
    prompt: Where does the fibre come from?
    bins:
    - From plants
    - From animals
    items:
    - label: Cotton
      bin: From plants
      clue: Fluffy balls on a bush.
      why: A plant fibre.
    - label: Jute
      bin: From plants
      clue: Used for sacks.
      why: From a plant's stem.
    - label: Coir
      bin: From plants
      clue: Ropes and mats.
      why: From coconut husks.
    - label: Linen
      bin: From plants
      clue: From the flax plant.
      why: A plant fibre.
    - label: Wool
      bin: From animals
      clue: Sheep's fleece.
      why: An animal fibre.
    - label: Silk
      bin: From animals
      clue: Spun by silkworms.
      why: An animal fibre.
    - label: Pashmina
      bin: From animals
      clue: From goats in the cold mountains.
      why: An animal fibre.
  lesson:
    - teach: 'Clothes are made of thin strands called fibres. Natural fibres come from plants or animals: cotton (from the fluffy bolls of the cotton plant), jute (from the stem of the jute plant), wool (from sheep''s hair) and silk (from silkworm cocoons).'
      picture:
        kind: compare
        columns:
        - title: From plants
          points:
          - Cotton
          - Jute
        - title: From animals
          points:
          - Wool
          - Silk
        - title: Made in factories
          points:
          - Nylon
          - Polyester
        alt: Fibres come from plants, from animals, or are made in factories.
      check:
        prompt: 'Jute comes from a plant''s:'
        options:
        - Stem
        - Flower
        - Root
        answer: Stem
        why: Long fibres are peeled from the jute stem.
      ways:
      - style: step_by_step
        teach: 'Look closely at a fibre. Step 1: Pull a thread from the edge of an old cotton cloth. Step 2: Untwist one end with your fingers. Step 3: See it split into many thin, fluffy strands: these are fibres. Step 4: Twisted together, they made the thread strong.'
      - style: real_world
        teach: Jute is strong and rough, so it is used for sacks of rice and potatoes, and for ropes and mats. Silk is smooth and shiny, so it is used for festival sarees and kurtas.
    - teach: Man-made fibres like nylon and polyester are made in factories from chemicals. They are strong and dry fast, but do not let air through as well as cotton.
      check:
        prompt: 'Nylon is a:'
        options:
        - Man-made fibre
        - Plant fibre
        - Animal fibre
        answer: Man-made fibre
        why: It is made in factories.
      ways:
      - style: visual
        teach: Natural fibres and man-made fibres side by side.
        picture:
          kind: compare
          columns:
          - title: Natural
            points:
            - 'Cotton and jute: from plants'
            - 'Wool and silk: from animals'
            - Lets air through well
          - title: Man-made
            points:
            - Nylon and polyester
            - Made in factories
            - Strong and dries fast
          alt: Natural fibres such as cotton and jute come from plants, and wool and silk from animals; they let air through well. Man-made fibres such as nylon and polyester are made in factories; they are strong and dry fast.
      - style: real_world
        teach: A polyester raincoat or a nylon schoolbag dries quickly after rain. But a polyester shirt on a hot day can feel sticky, because it does not soak up sweat or let air pass the way cotton does.
    - teach: 'Fibre to clothes: fibres are twisted into thread (spinning), threads are woven or knitted into cloth, and cloth is cut and stitched into clothes. India has famous handlooms: Kanchipuram silk, Kerala kasavu sarees, Assam muga silk.'
      check:
        prompt: What comes right after spinning?
        options:
        - Weaving thread into cloth
        - Growing cotton
        - Wearing the shirt
        answer: Weaving thread into cloth
        why: Thread is made first, then woven.
      ways:
      - style: visual
        teach: How thin fibres become a shirt you can wear.
        picture:
          kind: flow
          steps:
          - Fibres are collected and cleaned
          - They are twisted into thread (spinning)
          - Threads are woven or knitted into cloth
          - Cloth is cut to shape
          - Pieces are stitched into a shirt
          alt: Fibres are collected and cleaned, twisted into thread by spinning, and woven or knitted into cloth. The cloth is cut to shape and the pieces are stitched into a shirt.
      - style: real_world
        teach: In weaving towns, you can hear the clack of handlooms from many houses. A weaver may take several days to finish one silk saree, passing the thread across by hand again and again.
  items:
  - prompt: 'Cotton comes from:'
    options:
    - a plant
    - a sheep
    - a silkworm
    - a factory only
    answer: a plant
    difficulty: 1
    hints:
    - Fluffy white bolls.
    - Grows in fields.
    solution: Cotton comes from the cotton plant.
    mistakes: {"a sheep": "v5_cotton"}
  - prompt: 'Wool comes from:'
    options:
    - sheep
    - cotton plants
    - silkworms
    - jute
    answer: sheep
    difficulty: 1
    hints:
    - A woolly animal.
    - Baa.
    solution: Wool comes from sheep's hair.
    mistakes: {"silkworms": "v5_wool"}
  - prompt: 'Silk is made by:'
    options:
    - silkworms
    - sheep
    - cows
    - spiders in houses
    answer: silkworms
    difficulty: 1
    hints:
    - They make cocoons.
    - Worm.
    solution: Silkworms spin silk cocoons.
    mistakes: {"spiders in houses": "v5_silk"}
  - prompt: 'Twisting fibres into thread is called:'
    options:
    - spinning
    - weaving
    - stitching
    - washing
    answer: spinning
    difficulty: 2
    hints:
    - The charkha does it.
    - Spin = twist.
    solution: Spinning turns fibres into yarn.
    mistakes: {"weaving": "v5_spinning"}
  - prompt: Which fibre is used to make sacks?
    options:
    - jute
    - silk
    - wool
    - nylon
    answer: jute
    difficulty: 2
    hints:
    - Golden fibre.
    - Strong and rough.
    solution: Jute makes strong sacks.
    mistakes: {"silk": "v5_jute"}
  - prompt: Which is a man-made fibre?
    options:
    - polyester
    - cotton
    - wool
    - silk
    answer: polyester
    difficulty: 2
    hints:
    - Made in factories.
    - Not from plants or animals.
    solution: Polyester is made from chemicals in factories.
    mistakes: {"cotton": "v5_polyester"}
  - prompt: Which fibre comes from an animal?
    options:
    - Wool
    - Cotton
    - Jute
    answer: Wool
    difficulty: 1
    hints:
    - Two of these grow on plants.
    - Which one comes from sheep?
    solution: 'Step 1: cotton and jute are plant fibres. Step 2: wool is from sheep.'
    mistakes:
      Cotton: c5v8_from
      Jute: c5v8_from
  - prompt: 'Silkworms make silk when they spin their:'
    options:
    - Cocoons
    - Nests
    - Webs on walls
    answer: Cocoons
    difficulty: 2
    hints:
    - The silkworm wraps itself before changing into a moth.
    - That covering is made of silk thread.
    solution: 'Step 1: silkworms spin a covering. Step 2: the cocoon''s thread is silk.'
    mistakes:
      Nests: c5v8_from
      Webs on walls: c5v8_from
  - prompt: 'Making cloth by crossing threads over and under on a loom is called:'
    options:
    - Weaving
    - Spinning
    - Cutting
    answer: Weaving
    difficulty: 1
    hints:
    - A loom is used.
    - Spinning makes thread, this makes cloth.
    solution: 'Step 1: threads are crossed on a loom. Step 2: that is weaving.'
    mistakes:
      Spinning: c5v8_steps
      Cutting: c5v8_steps
  - prompt: 'Kerala''s kasavu saree is white with a border of:'
    options:
    - Gold
    - Black
    - Green
    answer: Gold
    difficulty: 2
    hints:
    - It is worn at Onam.
    - The border shines.
    solution: 'Step 1: kasavu sarees are cream-white. Step 2: their border is golden.'
    mistakes:
      Black: c5v8_from
      Green: c5v8_from
  - prompt: 'Put in order: cloth, fibre, thread. Which comes first?'
    options:
    - Fibre
    - Thread
    - Cloth
    answer: Fibre
    difficulty: 2
    hints:
    - Thread is made from something.
    - Cloth is made from thread.
    solution: 'Step 1: fibre → thread → cloth. Step 2: fibre comes first.'
    mistakes:
      Thread: c5v8_steps
      Cloth: c5v8_steps
  - prompt: Which fibre is made in a factory?
    options:
    - Nylon
    - Silk
    - Wool
    answer: Nylon
    difficulty: 1
    hints:
    - Silk and wool come from animals.
    - This one is made from chemicals.
    solution: 'Step 1: silk and wool are natural. Step 2: nylon is man-made.'
    mistakes:
      Silk: c5v8_from
      Wool: c5v8_from
  - prompt: Which part of the cotton plant gives fibre?
    options:
    - The fluffy boll
