# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 7
title: Energy—How Things Work
tips:
  v5_body_energy: "We feel weak when we haven't eaten. What gives us energy?"
  v5_cycle: "A bicycle has pedals, not an engine."
  v5_fan: "A fan has a switch and a wire."
  v5_fuel: "A fuel burns to give heat. Which choice is the gas in a kitchen cylinder?"
  v5_plant_energy: "Plants make food in their leaves during the day."
  v5_renewable: "Coal and petrol come from the ground and will run out. Which one rises every day?"
  v5_smoke: "Think of a bus exhaust or a coal chimney. What comes out?"
  v5_solar: "Solar panels on roofs run lights and fans."
  v5_sun: "The Moon only reflects light. Where does that light come from?"
  v5_sun_dry: "The sun dries clothes for free. Does a dryer need a plug?"
  v5_windmill: "Look at the first part of the machine's name. What turns its big blades?"
  c5v7_source: Ask where the energy for this thing comes from at the very start.
  c5v7_kind: 'Sort it: is it a fuel that is burnt, power from a socket or cell, moving air or water, or sunlight?'
  c5v7_renew: 'Ask: will it still be there tomorrow and next year, or will we use it up?'
  c5v7_save: 'Ask: does this action use less fuel or electricity, or more?'
  c5v7_air: Think about what comes out when something is burnt.

concepts:
- code: cbse5v.energy.forms
  title: Energy all around
  notes: |
    Energy makes things work and move. The Sun is our main source: it gives light and heat and helps plants make food.
    Food gives us energy. Fuels (wood, coal, petrol, LPG) give heat and run vehicles. Electricity runs lights, fans and
    phones. Wind turns windmills; flowing water turns turbines.
  explanations:
    text: 'Energy is what makes things happen: a fan spinning, a bus moving, you running. The Sun gives light and heat. Food gives us energy. Electricity powers lights and fans. Fuels like petrol and gas give heat and run vehicles.'
    visual: 'Draw the Sun shining on a plant, the plant eaten by a cow, milk drunk by a child who then runs: energy passed along.'
    step_by_step: 'Step 1: Name the machine or living thing. Step 2: Ask what makes it move or work. Step 3: Trace where that energy came from.'
    real_world: 'LPG cylinders for cooking, petrol for scooters, and electricity for fans: our homes use many kinds of energy daily.'
  picture:
    kind: flow
    steps:
    - Sun
    - Plant makes food
    - Cow eats grass
    - Child drinks milk
    - Child runs
    alt: Energy is passed from the Sun to a plant, to a cow that eats grass, to a child who drinks milk and runs.
  activity:
    type: sort
    prompt: What kind of energy does it give?
    bins:
    - Light
    - Heat
    - Movement
    - Sound
    items:
    - label: A torch
      bin: Light
      clue: Helps you see in the dark.
      why: Light.
    - label: A firefly
      bin: Light
      clue: It glows at night.
      why: Light.
    - label: A gas stove
      bin: Heat
      clue: Cooks the food.
      why: Heat.
    - label: An electric iron
      bin: Heat
      clue: Smooths clothes.
      why: Heat.
    - label: A ceiling fan
      bin: Movement
      clue: Its blades spin.
      why: Movement.
    - label: A moving bus
      bin: Movement
      clue: It goes from place to place.
      why: Movement.
    - label: A school bell
      bin: Sound
      clue: Tells you it's break time.
      why: Sound.
    - label: A drum
      bin: Sound
      clue: Beat it.
      why: Sound.
  lesson:
    - teach: Energy makes things work and move. The Sun is our main source of energy. It gives light and heat, and plants use sunlight to make their food. When we eat plants, or animals that ate plants, we get that energy.
      picture:
        kind: flow
        steps:
        - Sun
        - Plants make food
        - We eat food
        - We run and play
        alt: Energy flows from the Sun to plants to us.
      check:
        prompt: Where does the energy in rice first come from?
        options:
        - The Sun
        - The cooker
        - The shop
        answer: The Sun
        why: The rice plant used sunlight to make its food.
      ways:
      - style: step_by_step
        teach: 'Trace energy back to the Sun. Step 1: You run in the playground. Step 2: The energy came from your lunch of rice. Step 3: The rice plant made its food using sunlight. Step 4: So the energy for your running began in the Sun.'
      - style: real_world
        teach: A plant kept in a dark cupboard for a week turns pale and weak. Put back by the window, it slowly turns green again, because it needs sunlight to make its food.
    - teach: 'Fuels give heat when burnt: wood, coal, kerosene, LPG for cooking, petrol and diesel for vehicles. Electricity runs lights, fans, TVs and phones.'
      check:
        prompt: Which runs a bus?
        options:
        - Diesel
        - Sunlight on its roof
        - Water in its tank
        answer: Diesel
        why: Most buses burn diesel fuel.
      ways:
      - style: visual
        teach: Fuels and electricity, and what each one runs.
        picture:
          kind: compare
          columns:
          - title: Fuel that is burnt
            points:
            - 'Wood and coal: heat'
            - 'LPG: cooking'
            - 'Petrol and diesel: vehicles'
          - title: Electricity
            points:
            - Lights
            - Fans
            - TVs and phone chargers
          alt: 'Fuels are burnt for energy: wood and coal give heat, LPG is used for cooking, and petrol and diesel run vehicles. Electricity runs lights, fans, TVs and phone chargers.'
      - style: real_world
        teach: During a power cut, the fan and TV stop at once, but the gas stove still works. That is because the stove burns LPG fuel, while the fan and TV need electricity.
    - teach: Moving air and water carry energy too. Wind turns windmills, and flowing water turns turbines in dams to make electricity.
      check:
        prompt: What makes a windmill's blades turn?
        options:
        - Wind
        - Sunlight
        - Sound
        answer: Wind
        why: Moving air pushes the blades.
      ways:
      - style: visual
        teach: How flowing water in a dam makes electricity.
        picture:
          kind: flow
          steps:
          - A dam stores river water high up
          - Water rushes down through a pipe
          - It spins a big wheel called a turbine
          - The turbine makes electricity
          - Wires carry it to homes
          alt: A dam stores river water high up. The water rushes down a pipe and spins a turbine, which makes electricity. Wires carry the electricity to homes.
      - style: real_world
        teach: Hold a paper pinwheel still and it does nothing. Blow on it or run with it and it spins. The moving air pushes it round, just as strong wind turns the big blades of a windmill.
  items:
  - prompt: What is our main source of energy?
    options:
    - the Sun
    - the Moon
    - a candle
    - a stone
    answer: the Sun
    difficulty: 1
    hints:
    - It gives light and heat.
    - Plants need it.
    solution: The Sun is Earth's main energy source.
    mistakes: {"the Moon": "v5_sun"}
  - prompt: What gives our body energy?
    options:
    - food
    - air only
    - soap
    - paper
    answer: food
    difficulty: 1
    hints:
    - We get hungry when tired.
    - Eat to play.
    solution: Food gives us energy.
    mistakes: {"air only": "v5_body_energy"}
  - prompt: 'A ceiling fan runs on:'
    options:
    - electricity
    - petrol
    - wood
    - food
    answer: electricity
    difficulty: 1
    hints:
    - You switch it on.
    - Wires.
    solution: Fans use electricity.
    mistakes: {"petrol": "v5_fan"}
  - prompt: Which is a fuel?
    options:
    - LPG
    - water
    - sand
    - salt
    answer: LPG
    difficulty: 1
    hints:
    - Cooking gas.
    - It burns.
    solution: LPG is a cooking fuel.
    mistakes: {"water": "v5_fuel"}
  - prompt: What does a windmill use to work?
    options:
    - wind
    - petrol
    - coal
    - sugar
    answer: wind
    difficulty: 1
    hints:
    - The name says it.
    - Moving air.
    solution: Windmills are turned by wind.
    mistakes: {"petrol": "v5_windmill"}
  - prompt: How do plants get energy to make food?
    options:
    - from sunlight
    - from the dark
    - from salt
    - from plastic
    answer: from sunlight
    difficulty: 2
    hints:
    - Green leaves.
    - Light.
    solution: Plants use sunlight to make food.
    mistakes: {"from the dark": "v5_plant_energy"}
  - prompt: Which gives both light and heat to Earth?
    options:
    - The Sun
    - The Moon
    - Clouds
    answer: The Sun
    difficulty: 1
    hints:
    - The Moon only reflects light.
    - Which one is a star?
    solution: 'Step 1: the Sun is a star. Step 2: it gives light and heat.'
    mistakes:
      The Moon: c5v7_source
      Clouds: c5v7_source
  - prompt: Which of these needs electricity to work?
    options:
    - A television
    - A bicycle
    - A kite
    answer: A television
    difficulty: 1
    hints:
    - Which one plugs into a socket?
    - A bicycle uses leg power.
    solution: 'Step 1: bicycles and kites need no plug. Step 2: a TV runs on electricity.'
    mistakes:
      A bicycle: c5v7_kind
      A kite: c5v7_kind
  - prompt: Where does a cyclist get energy to pedal?
    options:
    - From food
    - From petrol
    - From a battery
    answer: From food
    difficulty: 1
    hints:
    - A bicycle has no engine.
    - The rider's body does the work.
    solution: 'Step 1: the rider pedals. Step 2: the body gets energy from food.'
    mistakes:
      From petrol: c5v7_source
      From a battery: c5v7_source
  - prompt: Which is used as cooking fuel in many homes?
    options:
    - LPG
    - Sand
    - Water
    answer: LPG
    difficulty: 1
    hints:
    - It comes in a cylinder.
    - It burns with a blue flame.
    solution: 'Step 1: kitchen gas cylinders hold LPG. Step 2: it is burnt for cooking.'
    mistakes:
      Sand: c5v7_kind
      Water: c5v7_kind
  - prompt: 'Water flowing from a dam turns a turbine to make:'
    options:
    - Electricity
    - Salt
    - Petrol
    answer: Electricity
    difficulty: 2
    hints:
    - Turbines spin like big fans.
    - The spinning powers a generator.
    solution: 'Step 1: falling water spins a turbine. Step 2: this makes electricity.'
    mistakes:
      Salt: c5v7_kind
      Petrol: c5v7_kind
  - prompt: 'A torch runs on energy from:'
    options:
    - Batteries
    - Wind
    - Food
    answer: Batteries
    difficulty: 1
    hints:
    - Open a torch and look inside.
    - Small cells store energy.
    solution: 'Step 1: torches hold cells. Step 2: batteries give electricity to the bulb.'
    mistakes:
      Wind: c5v7_kind
      Food: c5v7_kind
  - prompt: Why do clothes dry faster on a sunny, windy day?
    options:
    - Sun's heat and moving air take water away
    - Clouds dry them
    - Night air is hotter
    answer: Sun's heat and moving air take water away
    difficulty: 2
    hints:
    - Heat turns water into vapour.
    - Wind carries the vapour away.
    solution: 'Step 1: heat evaporates water. Step 2: wind carries it away, so clothes dry fast.'
    mistakes:
      Clouds dry them: c5v7_source
      Night air is hotter: c5v7_source
  - prompt: 'A sailing boat moves using energy from:'
    options:
    - Wind
    - Coal
    - Electricity from a socket
    answer: Wind
    difficulty: 2
    hints:
    - It has a big cloth sail.
    - What pushes the sail?
    solution: 'Step 1: the sail catches moving air. Step 2: wind pushes the boat.'
    mistakes:
      Coal: c5v7_kind
      Electricity from a socket: c5v7_kind
  - prompt: 'Coal was formed from plants buried long ago. So the energy in coal first came from:'
    options:
    - The Sun
    - The Moon
    - Rocks
    answer: The Sun
    difficulty: 3
    hints:
    - Ancient plants made food using sunlight.
    - That energy stayed stored when they were buried.
    solution: 'Step 1: plants stored sunlight energy. Step 2: they became coal, so its energy came from the Sun.'
    mistakes:
      The Moon: c5v7_source
      Rocks: c5v7_source
  - prompt: 'Case: In a village, the electricity goes off one evening. The family still cooks dinner, and the children study by a battery lamp. Which two things did not need electricity from the wires?'
    options:
    - The LPG stove and the battery lamp
    - The ceiling fan and the TV
    - The fridge and the mixer
    answer: The LPG stove and the battery lamp
    hints:
    - Which things kept working when the power went off?
    - Where did each of them get its energy?
    solution: The stove burns LPG fuel and the lamp uses its own battery, so both work without electricity from the wires.
    mistakes:
      The ceiling fan and the TV: c5v7_kind
      The fridge and the mixer: c5v7_kind
    exam: case
    difficulty: 2
  - prompt: 'Situation: You want to make a small toy boat move across a pond without a motor or a battery. What could you use?'
    options:
    - A paper sail so the wind pushes it
    - A light bulb on top
    - A piece of coal inside it
    answer: A paper sail so the wind pushes it
    hints:
    - What moving thing outdoors can push a boat?
    - How do you catch that energy?
    solution: Moving air carries energy. A sail catches the wind, and the wind pushes the boat along.
    mistakes:
      A light bulb on top: c5v7_source
      A piece of coal inside it: c5v7_source
    exam: competency
    difficulty: 2
- code: cbse5v.energy.save
  title: Saving energy and clean energy
  after:
  - cbse5v.energy.forms
  notes: |
    Coal, petrol and diesel will run out and make the air dirty (smoke). Solar panels, wind and water power are
    renewable and cleaner. Save energy: switch off lights and fans when leaving, walk or cycle short distances, use
    public transport, dry clothes in the sun, use LED bulbs.
  explanations:
    text: Some fuels like coal and petrol will run out one day and make smoke. Sunlight and wind will never run out, so solar panels and windmills give clean energy. We can all save energy by switching things off when we don't need them.
    visual: Draw a house with solar panels on the roof, a child switching off a light when leaving a room, and a bicycle outside.
    step_by_step: 'Step 1: Notice energy being used. Step 2: Ask: is it needed now? Step 3: If not, switch it off or choose a cleaner way.'
    real_world: Many Indian schools and homes now have rooftop solar panels.
  picture:
    kind: compare
    columns:
    - title: Will run out
      points:
      - coal
      - petrol
      - diesel
    - title: Will not run out
      points:
      - sunlight
      - wind
      - flowing water
    alt: Coal, petrol and diesel will run out; sunlight, wind and flowing water will not.
  activity:
    type: sort
    prompt: Will it run out one day?
    bins:
    - Will run out
    - Will never run out
    items:
    - label: Coal
      bin: Will run out
      clue: Dug from the ground; took millions of years to form.
      why: Runs out.
    - label: Petrol
      bin: Will run out
      clue: Made from oil underground.
      why: Runs out.
    - label: Diesel
      bin: Will run out
      clue: Also made from oil.
      why: Runs out.
    - label: Cooking gas (LPG)
      bin: Will run out
      clue: Comes from under the ground.
      why: Runs out.
    - label: Sunlight
      bin: Will never run out
      clue: Every day the Sun shines.
      why: Solar panels use it.
    - label: Wind
      bin: Will never run out
      clue: Windmills turn.
      why: Keeps blowing.
    - label: Flowing river water
      bin: Will never run out
      clue: Rain fills rivers again.
      why: Water power.
  lesson:
    - teach: Coal, petrol and diesel took millions of years to form and will run out one day. Burning them makes smoke that dirties the air and makes people cough.
      check:
        prompt: What is a problem with burning petrol?
        options:
        - It makes smoke and will run out
        - It makes rain
        - It grows trees
        answer: It makes smoke and will run out
        why: Petrol is limited and pollutes the air.
      ways:
      - style: visual
        teach: Energy that will run out, and energy that will not.
        picture:
          kind: compare
          columns:
          - title: Will run out
            points:
            - Coal
            - Petrol
            - Diesel
          - title: Will not run out
            points:
            - Sunlight
            - Wind
            - Flowing water
          alt: Coal, petrol and diesel will run out one day. Sunlight, wind and flowing water will not run out.
      - style: real_world
        teach: On a busy road at rush hour, the air often smells of smoke from cars, buses and trucks. People walking there may cough, and white shirts get a grey layer of dust by evening.
    - teach: Sunlight, wind and flowing water will not run out; they are renewable and cleaner. Solar panels turn sunlight into electricity. Solar cookers use sunlight to cook.
      picture:
        kind: compare
        columns:
        - title: Will run out
          points:
          - Coal
          - Petrol
          - Diesel
        - title: Will not run out
          points:
          - Sunlight
          - Wind
          - Flowing water
        alt: Fuels that will run out compared with renewable energy sources.
      check:
        prompt: Which is renewable?
        options:
        - Wind
        - Coal
        - Diesel
        answer: Wind
        why: Wind keeps blowing; it is not used up.
      ways:
      - style: step_by_step
        teach: 'How a solar cooker works. Step 1: Put it in bright sunshine. Step 2: Shiny sides bounce the sunlight into the box. Step 3: The black pot inside soaks up the heat. Step 4: A glass lid keeps the heat in. After some hours, the food is cooked.'
      - style: real_world
        teach: Many homes in sunny states have solar panels on the roof. On a bright day they make electricity for the lights and fans without any smoke, and the family pays a smaller electricity bill.
    - teach: 'We can save energy: switch off lights and fans when leaving a room, use LED bulbs, walk or cycle for short trips, use buses and trains, and dry clothes in the sun.'
      check:
        prompt: Which bulb uses the least electricity for the same light?
        options:
        - LED bulb
        - Old yellow bulb
        - Both the same
        answer: LED bulb
        why: LEDs turn more electricity into light, less into heat.
      ways:
      - style: visual
        teach: 'Everyday choices: ones that use more energy, and ones that save it.'
        picture:
          kind: compare
          columns:
          - title: Uses more
            points:
            - Fan left on in an empty room
            - Car for a short trip
            - Old, hot bulbs
          - title: Saves energy
            points:
            - Switch off when you leave
            - Walk or cycle
            - LED bulbs
          alt: Leaving a fan on in an empty room, taking a car for a short trip and using old, hot bulbs use more energy. Switching off when you leave, walking or cycling and using LED bulbs save energy.
      - style: real_world
        teach: Some schools choose an energy monitor for each class. Before break, the monitor checks that lights and fans are off. Over a whole year, these small switch-offs save a lot of electricity.
  items:
  - prompt: Which energy source will not run out?
    options:
    - sunlight
    - coal
    - petrol
    - diesel
    answer: sunlight
    difficulty: 1
    hints:
    - The Sun shines every day.
    - Renewable.
    solution: Sunlight is renewable.
    mistakes: {"coal": "v5_renewable"}
  - prompt: Which saves electricity?
    options:
    - switching off fans when leaving the room
    - keeping lights on all day
    - leaving the TV on
    - opening the fridge again and again
    answer: switching off fans when leaving the room
    difficulty: 1
    hints:
    - No one is using it.
    - Switch off.
    solution: Switching off unused fans saves electricity.
    mistakes:
      keeping lights on all day: c5v_think
  - prompt: 'Solar panels turn sunlight into:'
    options:
    - electricity
    - water
    - petrol
    - smoke
    answer: electricity
    difficulty: 1
    hints:
    - On rooftops.
    - Powers lights.
    solution: Solar panels make electricity from sunlight.
    mistakes: {"water": "v5_solar"}
  - prompt: Why is cycling to a nearby shop good?
    options:
    - it uses no fuel and makes no smoke
    - it uses more petrol
    - it makes the air dirty
    - it is slower than flying
    answer: it uses no fuel and makes no smoke
    difficulty: 1
    hints:
    - No engine.
    - Clean.
    solution: Cycling uses your energy, not fuel.
    mistakes: {"it uses more petrol": "v5_cycle"}
  - prompt: 'Burning coal and petrol makes:'
    options:
    - smoke that dirties the air
    - clean water
    - fresh fruit
    - more coal
    answer: smoke that dirties the air
    difficulty: 2
    hints:
    - Look at vehicle exhaust.
    - Grey.
    solution: Burning these fuels pollutes the air.
    mistakes: {"clean water": "v5_smoke"}
  - prompt: 'Drying clothes in the sun instead of a dryer:'
    options:
    - saves electricity
    - wastes electricity
    - needs petrol
    - makes clothes wet
    answer: saves electricity
    difficulty: 1
    hints:
    - The Sun is free.
    - No machine.
    solution: Sun-drying uses free solar energy.
    mistakes: {"wastes electricity": "v5_sun_dry"}
  - prompt: Which saves petrol?
    options:
    - Walking to a nearby shop
    - Driving to the next house
    - Leaving the engine running
    answer: Walking to a nearby shop
    difficulty: 1
    hints:
    - Which one uses no fuel?
    - Your legs need only food.
    solution: 'Step 1: walking uses no petrol. Step 2: so it saves petrol.'
    mistakes:
      Driving to the next house: c5v7_save
      Leaving the engine running: c5v7_save
  - prompt: 'A solar water heater uses energy from:'
    options:
    - The Sun
    - Coal
    - Gas
    answer: The Sun
    difficulty: 1
    hints:
    - The word solar is a clue to where it comes from.
    - Panels on the roof catch sunlight.
    solution: 'Step 1: solar = Sun. Step 2: it heats water with sunlight.'
    mistakes:
      Coal: c5v7_renew
      Gas: c5v7_renew
  - prompt: Which will run out one day?
    options:
    - Coal
    - Sunlight
    - Wind
    answer: Coal
    difficulty: 1
    hints:
    - It is dug from the ground.
    - It took millions of years to form.
    solution: 'Step 1: coal forms very slowly. Step 2: we use it faster, so it will run out.'
    mistakes:
      Sunlight: c5v7_renew
      Wind: c5v7_renew
  - prompt: Why is a bus better for the air than many cars?
    options:
    - One bus carries many people using less fuel each
    - Buses have no engines
    - Cars run on water
    answer: One bus carries many people using less fuel each
    difficulty: 2
    hints:
    - Think of 40 people in 40 cars.
    - Compare with 40 people in one bus.
    solution: 'Step 1: one bus replaces many cars. Step 2: less fuel and smoke per person.'
    mistakes:
      Buses have no engines: c5v7_save
      Cars run on water: c5v7_save
  - prompt: 'Smoke from burning wood indoors can cause:'
    options:
    - Coughing and breathing problems
    - Better sleep
    - Stronger bones
    answer: Coughing and breathing problems
    difficulty: 2
    hints:
    - Smoke goes into our lungs.
    - It makes eyes water too.
    solution: 'Step 1: smoke enters the lungs. Step 2: it causes coughing and breathing trouble.'
    mistakes:
      Better sleep: c5v7_air
      Stronger bones: c5v7_air
  - prompt: You leave your classroom for lunch. What should you do with the fans?
    options:
    - Switch them off
    - Turn them to full speed
    - Leave them on
    answer: Switch them off
    difficulty: 1
    hints:
    - Nobody is there to use them.
    - Why waste electricity?
    solution: 'Step 1: the room is empty. Step 2: switch fans off to save electricity.'
    mistakes:
      Turn them to full speed: c5v7_save
      Leave them on: c5v7_save
  - prompt: Which is a clean way to make electricity?
    options:
    - Wind turbines
    - Burning coal
    - Burning plastic
    answer: Wind turbines
    difficulty: 2
    hints:
    - Which one makes no smoke?
    - Tall white towers with blades.
    solution: 'Step 1: burning makes smoke. Step 2: wind turbines make none.'
    mistakes:
      Burning coal: c5v7_air
      Burning plastic: c5v7_air
  - prompt: A family switches 4 bulbs off for 5 extra hours each day. How many bulb-hours do they save daily?
    answer: '20'
    check: 4*5
    difficulty: 3
    hints:
    - Each bulb saves 5 hours.
    - 4 bulbs.
    solution: 'Step 1: 4 × 5. Step 2: = 20 bulb-hours.'
    mistakes:
      '9': c5v7_save
      '45': c5v7_save
  - prompt: Why are solar panels useful in sunny places like Rajasthan?
    options:
    - There is lots of sunlight to turn into electricity
    - It never gets dark
    - Sand makes electricity
    answer: There is lots of sunlight to turn into electricity
    difficulty: 3
    hints:
    - Solar panels need sunlight.
    - Deserts get many sunny days.
    solution: 'Step 1: Rajasthan is very sunny. Step 2: panels can make lots of electricity there.'
    mistakes:
      It never gets dark: c5v7_renew
      Sand makes electricity: c5v7_renew
  - prompt: 'Case: A family lives 500 metres from the school. Every day they drive the child there by car. What change would save fuel and keep the air cleaner?'
    options:
    - Walk or cycle to school
    - Drive a bigger car
    - Leave the engine running while waiting
    answer: Walk or cycle to school
    hints:
    - Is the school near or far?
    - Which choice uses no fuel at all?
    solution: The school is close. Walking or cycling uses no fuel and makes no smoke.
