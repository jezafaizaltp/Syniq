# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 7
title: Energy—How Things Work
concepts:
- code: cbse5v.energy.forms
  title: Energy all around
  notes: |
    Energy makes things work and move. The Sun is our main source: it gives light and heat and helps plants make food.
    Food gives us energy. Fuels (wood, coal, petrol, LPG) give heat and run vehicles. Electricity runs lights, fans and
    phones. Wind turns windmills; flowing water turns turbines.
  explanations:
    text: 'Energy is what makes things happen: a fan spinning, a bus moving, you running. The Sun gives light and heat. Food gives us energy. Electricity powers lights and fans. Fuels like petrol and gas give heat and run vehicles.'
    visual: 'Draw the Sun shining on a plant, the plant eaten by a cow, milk drunk by a child who then runs: energy passed along.'
    step_by_step: 'Step 1: Name the machine or living thing. Step 2: Ask what makes it move or work. Step 3: Trace where that energy came from.'
    real_world: 'LPG cylinders for cooking, petrol for scooters, and electricity for fans: our homes use many kinds of energy daily.'
  picture:
    kind: flow
    steps:
    - Sun
    - Plant makes food
    - Cow eats grass
    - Child drinks milk
    - Child runs
    alt: Energy is passed from the Sun to a plant, to a cow that eats grass, to a child who drinks milk and runs.
  items:
  - prompt: What is our main source of energy?
    options:
    - the Sun
    - the Moon
    - a candle
    - a stone
    answer: the Sun
    difficulty: 1
    hints:
    - It gives light and heat.
    - Plants need it.
    solution: The Sun is Earth's main energy source.
  - prompt: What gives our body energy?
    options:
    - food
    - air only
    - soap
    - paper
    answer: food
    difficulty: 1
    hints:
    - We get hungry when tired.
    - Eat to play.
    solution: Food gives us energy.
  - prompt: 'A ceiling fan runs on:'
    options:
    - electricity
    - petrol
    - wood
    - food
    answer: electricity
    difficulty: 1
    hints:
    - You switch it on.
    - Wires.
    solution: Fans use electricity.
  - prompt: Which is a fuel?
    options:
    - LPG
    - water
    - sand
    - salt
    answer: LPG
    difficulty: 1
    hints:
    - Cooking gas.
    - It burns.
    solution: LPG is a cooking fuel.
  - prompt: What does a windmill use to work?
    options:
    - wind
    - petrol
    - coal
    - sugar
    answer: wind
    difficulty: 1
    hints:
    - The name says it.
    - Moving air.
    solution: Windmills are turned by wind.
  - prompt: How do plants get energy to make food?
    options:
    - from sunlight
    - from the dark
    - from salt
    - from plastic
    answer: from sunlight
    difficulty: 2
    hints:
    - Green leaves.
    - Light.
    solution: Plants use sunlight to make food.
- code: cbse5v.energy.save
  title: Saving energy and clean energy
  after:
  - cbse5v.energy.forms
  notes: |
    Coal, petrol and diesel will run out and make the air dirty (smoke). Solar panels, wind and water power are
    renewable and cleaner. Save energy: switch off lights and fans when leaving, walk or cycle short distances, use
    public transport, dry clothes in the sun, use LED bulbs.
  explanations:
    text: Some fuels like coal and petrol will run out one day and make smoke. Sunlight and wind will never run out, so solar panels and windmills give clean energy. We can all save energy by switching things off when we don't need them.
    visual: Draw a house with solar panels on the roof, a child switching off a light when leaving a room, and a bicycle outside.
    step_by_step: 'Step 1: Notice energy being used. Step 2: Ask: is it needed now? Step 3: If not, switch it off or choose a cleaner way.'
    real_world: Many Indian schools and homes now have rooftop solar panels.
  picture:
    kind: compare
    columns:
    - title: Will run out
      points:
      - coal
      - petrol
      - diesel
    - title: Will not run out
      points:
      - sunlight
      - wind
      - flowing water
    alt: Coal, petrol and diesel will run out; sunlight, wind and flowing water will not.
  items:
  - prompt: Which energy source will not run out?
    options:
    - sunlight
    - coal
    - petrol
    - diesel
    answer: sunlight
    difficulty: 1
    hints:
    - The Sun shines every day.
    - Renewable.
    solution: Sunlight is renewable.
  - prompt: Which saves electricity?
    options:
    - switching off fans when leaving the room
    - keeping lights on all day
    - leaving the TV on
    - opening the fridge again and again
    answer: switching off fans when leaving the room
    difficulty: 1
    hints:
    - No one is using it.
    - Switch off.
    solution: Switching off unused fans saves electricity.
    mistakes:
      keeping lights on all day: c5v_think
  - prompt: 'Solar panels turn sunlight into:'
    options:
    - electricity
    - water
    - petrol
    - smoke
    answer: electricity
    difficulty: 1
    hints:
    - On rooftops.
    - Powers lights.
    solution: Solar panels make electricity from sunlight.
  - prompt: Why is cycling to a nearby shop good?
    options:
    - it uses no fuel and makes no smoke
    - it uses more petrol
    - it makes the air dirty
    - it is slower than flying
    answer: it uses no fuel and makes no smoke
    difficulty: 1
    hints:
    - No engine.
    - Clean.
    solution: Cycling uses your energy, not fuel.
  - prompt: 'Burning coal and petrol makes:'
    options:
    - smoke that dirties the air
    - clean water
    - fresh fruit
    - more coal
    answer: smoke that dirties the air
    difficulty: 2
    hints:
    - Look at vehicle exhaust.
    - Grey.
    solution: Burning these fuels pollutes the air.
  - prompt: 'Drying clothes in the sun instead of a dryer:'
    options:
    - saves electricity
    - wastes electricity
    - needs petrol
    - makes clothes wet
    answer: saves electricity
    difficulty: 1
    hints:
    - The Sun is free.
    - No machine.
    solution: Sun-drying uses free solar energy.
