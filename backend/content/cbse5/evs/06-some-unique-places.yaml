# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 6
title: Some Unique Places
concepts:
- code: cbse5v.places.nature
  title: Special natural places
  notes: |
    Some places are unique in nature: the Sundarbans mangrove forests (Bengal tigers, in West Bengal), Kaziranga
    (one-horned rhinoceros, Assam), the Rann of Kutch (white salt desert, Gujarat), Ladakh (cold desert), Cherrapunji
    and Mawsynram (among the wettest places, Meghalaya), Kerala's backwaters. Living things adapt to each place.
  explanations:
    text: India has amazing natural places. The Sundarbans are forests in salty water where tigers swim. Kaziranga is home to the one-horned rhino. The Rann of Kutch is a white desert of salt. Mawsynram is one of the rainiest places on Earth.
    visual: 'Draw four boxes: a mangrove tree with roots in water (Sundarbans), a rhino (Kaziranga), white flat ground (Rann of Kutch), clouds and rain (Mawsynram).'
    step_by_step: 'Step 1: Name the place. Step 2: What makes it special? Step 3: Which animals or plants live there and how do they suit it?'
    real_world: Tourists visit Kaziranga to see rhinos and the Rann of Kutch for the white desert under the full moon.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Sundarbans
      - Kaziranga
      - Rann of Kutch
    - title: Special for
      points:
      - mangroves and tigers
      - one-horned rhinos
      - white salt desert
    alt: The Sundarbans are known for mangroves and tigers, Kaziranga for one-horned rhinos, and the Rann of Kutch for its white salt desert.
  activity:
    type: sort
    prompt: Which special place is it?
    bins:
    - Sundarbans
    - Kaziranga
    - Gir forest
    - Western Ghats
    items:
    - label: Tigers that swim in salty water
      bin: Sundarbans
      clue: A forest growing in the sea's edge.
      why: The Sundarbans.
    - label: Mangrove trees with roots in the water
      bin: Sundarbans
      clue: West Bengal, where rivers meet the sea.
      why: The Sundarbans.
    - label: The one-horned rhino
      bin: Kaziranga
      clue: Grasslands in Assam.
      why: Kaziranga.
    - label: Grasslands by the Brahmaputra river
      bin: Kaziranga
      clue: In Assam.
      why: Kaziranga.
    - label: The only wild Asiatic lions
      bin: Gir forest
      clue: In Gujarat.
      why: Gir.
    - label: Dry forest in Gujarat
      bin: Gir forest
      clue: Home of the lions.
      why: Gir.
    - label: Rainy hills along India's west coast
      bin: Western Ghats
      clue: Kerala, Karnataka, Maharashtra.
      why: The Western Ghats.
    - label: Lion-tailed macaques in green forests
      bin: Western Ghats
      clue: A rare monkey of the south-west hills.
      why: The Western Ghats.
  items:
  - prompt: 'Kaziranga is famous for the:'
    options:
    - one-horned rhinoceros
    - camel
    - snow leopard
    - penguin
    answer: one-horned rhinoceros
    difficulty: 1
    hints:
    - In Assam.
    - One horn.
    solution: Kaziranga protects the one-horned rhino.
  - prompt: 'The Sundarbans are forests of:'
    options:
    - mangroves
    - pine trees
    - cactus
    - apple trees
    answer: mangroves
    difficulty: 1
    hints:
    - They grow in salty water.
    - Roots stick up.
    solution: The Sundarbans are mangrove forests.
  - prompt: 'The Rann of Kutch is known for its:'
    options:
    - white salt desert
    - snowy peaks
    - thick rainforest
    - coral islands
    answer: white salt desert
    difficulty: 1
    hints:
    - Gujarat.
    - White and flat.
    solution: It is a vast white salt desert.
  - prompt: 'Mawsynram in Meghalaya is one of the:'
    options:
    - wettest places on Earth
    - driest places on Earth
    - coldest places on Earth
    - hottest deserts
    answer: wettest places on Earth
    difficulty: 2
    hints:
    - Lots of rain.
    - Near Cherrapunji.
    solution: Mawsynram gets some of the highest rainfall in the world.
  - prompt: 'Ladakh is a:'
    options:
    - cold desert
    - hot desert
    - rainforest
    - island
    answer: cold desert
    difficulty: 2
    hints:
    - High and dry.
    - Very cold.
    solution: Ladakh is a high, cold desert.
  - prompt: Which animal is famous in the Sundarbans?
    options:
    - Bengal tiger
    - one-horned rhino
    - camel
    - yak
    answer: Bengal tiger
    difficulty: 1
    hints:
    - It can swim.
    - Royal ...
    solution: Bengal tigers live in the Sundarbans.
- code: cbse5v.places.heritage
  title: Special places made by people
  after:
  - cbse5v.places.nature
  notes: |
    People built amazing places: the Taj Mahal (Agra, white marble), Qutub Minar (Delhi), Konark Sun Temple (Odisha,
    shaped like a chariot), Hampi (Karnataka, ruins of the Vijayanagara empire), Ajanta and Ellora caves (Maharashtra,
    paintings and rock-cut temples). These are heritage sites; we must not scratch or litter them.
  explanations:
    text: Long ago, people built beautiful monuments that still stand today. The Taj Mahal is made of white marble. The Konark temple is shaped like a giant chariot. These heritage places belong to all of us, so we must protect them.
    visual: Draw the Konark temple as a chariot with big stone wheels pulled by horses.
    step_by_step: 'Step 1: Name the monument. Step 2: Where is it? Step 3: What is special about it? Step 4: How can visitors protect it?'
    real_world: Schools take trips to monuments so children learn history by seeing it.
  picture:
    kind: flow
    steps:
    - Visit a monument
    - Learn its story
    - Don't scratch or litter
    - Leave it for the next visitor
    alt: 'At a heritage site: visit, learn its story, never scratch or litter, and leave it for the next visitor.'
  activity:
    type: sort
    prompt: Which monument is it?
    bins:
    - Taj Mahal
    - Konark Sun Temple
    - Qutub Minar
    - Red Fort
    items:
    - label: A white marble tomb by the Yamuna
      bin: Taj Mahal
      clue: In Agra.
      why: The Taj Mahal.
    - label: Built by Shah Jahan in memory of Mumtaz
      bin: Taj Mahal
      clue: A tomb for his wife.
      why: The Taj Mahal.
    - label: Shaped like a giant chariot with stone wheels
      bin: Konark Sun Temple
      clue: In Odisha.
      why: Konark.
    - label: 24 carved wheels that work as sundials
      bin: Konark Sun Temple
      clue: Near the sea in Odisha.
      why: Konark.
    - label: A very tall tower in Delhi
      bin: Qutub Minar
      clue: About 73 m high.
      why: The Qutub Minar.
    - label: Next to an iron pillar that hasn't rusted in 1600 years
      bin: Qutub Minar
      clue: In Mehrauli, Delhi.
      why: The Qutub Minar.
    - label: The Prime Minister speaks here on 15 August
      bin: Red Fort
      clue: Independence Day.
      why: The Red Fort.
    - label: Huge red walls in Old Delhi
      bin: Red Fort
      clue: A fort, not a tower.
      why: The Red Fort.
  items:
  - prompt: 'The Taj Mahal is in:'
    options:
    - Agra
    - Kochi
    - Chennai
    - Kolkata
    answer: Agra
    difficulty: 1
    hints:
    - Uttar Pradesh.
    - On the Yamuna.
    solution: The Taj Mahal is in Agra.
  - prompt: 'The Taj Mahal is made of:'
    options:
    - white marble
    - red mud
    - wood
    - glass
    answer: white marble
    difficulty: 1
    hints:
    - It shines white.
    - A smooth stone.
    solution: It is built of white marble.
  - prompt: 'The Konark Sun Temple is shaped like a:'
    options:
    - chariot
    - boat
    - fish
    - tree
    answer: chariot
    difficulty: 2
    hints:
    - Big stone wheels.
    - For the Sun god.
    solution: Konark is shaped like the Sun's chariot.
  - prompt: 'Ajanta caves are famous for their:'
    options:
    - paintings
    - waterfalls
    - snow
    - tigers
    answer: paintings
    difficulty: 2
    hints:
    - Old art on walls.
    - Buddhist stories.
    solution: Ajanta has ancient wall paintings.
  - prompt: What should visitors NOT do at a monument?
    options:
    - scratch names on walls
    - take photos
    - read the signs
    - listen to the guide
    answer: scratch names on walls
    difficulty: 1
    hints:
    - Which damages it?
    - Writing on walls.
    solution: Scratching names damages heritage.
  - prompt: 'Hampi has ruins of the:'
    options:
    - Vijayanagara empire
    - Mughal empire
    - British offices
    - modern malls
    answer: Vijayanagara empire
    difficulty: 2
    hints:
    - Karnataka.
    - A great southern kingdom.
    solution: Hampi was the capital of the Vijayanagara empire.
