# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 6
title: Some Unique Places
tips:
  v5_agra: "The Taj Mahal stands on the Yamuna in Uttar Pradesh."
  v5_ajanta: "The caves have old pictures of the Buddha on their walls."
  v5_bengal_tiger: "The rhino lives in Kaziranga. The mangrove forest is famous for a big swimming cat."
  v5_chariot: "The Sun god rides across the sky. The temple has giant stone wheels."
  v5_hampi: "Hampi is in Karnataka. It was the capital of the empire of Krishnadeva Raya."
  v5_kaziranga: "Kaziranga is in Assam's grasslands. Its famous animal has a horn on its nose."
  v5_ladakh: "Ladakh is high in the mountains with very little rain. Is it hot up there?"
  v5_mangroves: "The Sundarbans grow in salty, muddy water where rivers meet the sea."
  v5_marble: "The Taj shines white in moonlight. What smooth stone is it made of?"
  v5_mawsynram: "Meghalaya means 'abode of clouds'."
  v5_monument: "Which choice damages the monument for everyone after you?"
  v5_rann: "The Rann is flat and white, but it is not snow. Sea water dries and leaves something behind."
  c5v6_place: 'Match the place with what makes it special: its animal, its land, or its weather.'
  c5v6_adapt: Ask how the plant or animal is suited to living in that place.
  c5v6_built: Recall the building's state, what it is made of, and what it looks like.
  c5v6_care: Ask whether the action keeps the old place safe for people who come after us.

concepts:
- code: cbse5v.places.nature
  title: Special natural places
  notes: |
    Some places are unique in nature: the Sundarbans mangrove forests (Bengal tigers, in West Bengal), Kaziranga
    (one-horned rhinoceros, Assam), the Rann of Kutch (white salt desert, Gujarat), Ladakh (cold desert), Cherrapunji
    and Mawsynram (among the wettest places, Meghalaya), Kerala's backwaters. Living things adapt to each place.
  explanations:
    text: India has amazing natural places. The Sundarbans are forests in salty water where tigers swim. Kaziranga is home to the one-horned rhino. The Rann of Kutch is a white desert of salt. Mawsynram is one of the rainiest places on Earth.
    visual: 'Draw four boxes: a mangrove tree with roots in water (Sundarbans), a rhino (Kaziranga), white flat ground (Rann of Kutch), clouds and rain (Mawsynram).'
    step_by_step: 'Step 1: Name the place. Step 2: What makes it special? Step 3: Which animals or plants live there and how do they suit it?'
    real_world: Tourists visit Kaziranga to see rhinos and the Rann of Kutch for the white desert under the full moon.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Sundarbans
      - Kaziranga
      - Rann of Kutch
    - title: Special for
      points:
      - mangroves and tigers
      - one-horned rhinos
      - white salt desert
    alt: The Sundarbans are known for mangroves and tigers, Kaziranga for one-horned rhinos, and the Rann of Kutch for its white salt desert.
  activity:
    type: sort
    prompt: Which special place is it?
    bins:
    - Sundarbans
    - Kaziranga
    - Gir forest
    - Western Ghats
    items:
    - label: Tigers that swim in salty water
      bin: Sundarbans
      clue: A forest growing in the sea's edge.
      why: The Sundarbans.
    - label: Mangrove trees with roots in the water
      bin: Sundarbans
      clue: West Bengal, where rivers meet the sea.
      why: The Sundarbans.
    - label: The one-horned rhino
      bin: Kaziranga
      clue: Grasslands in Assam.
      why: Kaziranga.
    - label: Grasslands by the Brahmaputra river
      bin: Kaziranga
      clue: In Assam.
      why: Kaziranga.
    - label: The only wild Asiatic lions
      bin: Gir forest
      clue: In Gujarat.
      why: Gir.
    - label: Dry forest in Gujarat
      bin: Gir forest
      clue: Home of the lions.
      why: Gir.
    - label: Rainy hills along India's west coast
      bin: Western Ghats
      clue: Kerala, Karnataka, Maharashtra.
      why: The Western Ghats.
    - label: Lion-tailed macaques in green forests
      bin: Western Ghats
      clue: A rare monkey of the south-west hills.
      why: The Western Ghats.
  lesson:
    - teach: Some places in India are special because of nature. The Sundarbans in West Bengal are mangrove forests where the Bengal tiger lives. Mangrove trees grow in salty water and have roots that stick up out of the mud to breathe.
      check:
        prompt: 'Mangrove trees grow in:'
        options:
        - Salty water near the coast
        - Snowy mountains
        - Dry sand dunes
        answer: Salty water near the coast
        why: Their roots are suited to salty, muddy water.
      ways:
      - style: visual
        teach: Special natural places of India and what makes each one special.
        picture:
          kind: compare
          columns:
          - title: Place
            points:
            - Sundarbans, West Bengal
            - Kaziranga, Assam
            - Rann of Kutch, Gujarat
          - title: Special because
            points:
            - Mangrove forests and tigers
            - One-horned rhinos
            - White salt desert
          alt: The Sundarbans in West Bengal have mangrove forests and tigers. Kaziranga in Assam has one-horned rhinos. The Rann of Kutch in Gujarat is a white salt desert.
      - style: real_world
        teach: In the Sundarbans, people go out in small boats through narrow muddy creeks. At high tide the sea water rises and covers the mangrove roots; at low tide the roots poke up out of the mud again.
    - teach: Kaziranga in Assam is home to the one-horned rhinoceros. The Rann of Kutch in Gujarat is a white salt desert. Ladakh is a cold desert, high and dry.
      picture:
        kind: compare
        columns:
        - title: Place
          points:
          - Sundarbans
          - Kaziranga
          - Rann of Kutch
          - Ladakh
        - title: Special for
          points:
          - Mangroves, tigers
          - One-horned rhino
          - White salt desert
          - Cold desert
        alt: Four unique natural places in India and what each is known for.
      check:
        prompt: Why is Ladakh called a cold desert?
        options:
        - It is very dry and very cold
        - It has hot sand
        - It rains every day
        answer: It is very dry and very cold
        why: A desert is a dry place; Ladakh is dry and cold.
      ways:
      - style: step_by_step
        teach: 'Find these places on a map. Step 1: Go to the far east of India, to Assam: that is Kaziranga. Step 2: Go to the far west, to Gujarat by the sea: that is the Rann of Kutch. Step 3: Go to the very top, high in the mountains: that is Ladakh.'
      - style: real_world
        teach: Ladakh is high in the mountains, cold and dry. Few trees grow there, so people build houses with thick mud-brick walls and flat roofs, and keep yaks for milk, wool and carrying loads.
    - teach: Mawsynram and Cherrapunji in Meghalaya are among the wettest places on Earth. Kerala's backwaters are calm lagoons and canals by the sea. Plants and animals adapt to each place.
      check:
        prompt: Which state has some of the wettest places on Earth?
        options:
        - Meghalaya
        - Rajasthan
        - Gujarat
        answer: Meghalaya
        why: Mawsynram and Cherrapunji get huge rainfall.
      ways:
      - style: visual
        teach: How plants and animals suit the place where they live.
        picture:
          kind: compare
          columns:
          - title: Place
            points:
            - Salty, muddy coast
            - Cold mountains
            - Very rainy hills
          - title: How life suits it
            points:
            - Mangrove roots poke up to breathe
            - Yaks have thick, long hair
            - Steep roofs let rain run off
          alt: On a salty, muddy coast, mangrove roots poke up to breathe. In cold mountains, yaks have thick, long hair. In very rainy hills, steep roofs let rain run off.
      - style: real_world
        teach: In the wettest parts of Meghalaya, people make tall bridges by slowly guiding the roots of rubber trees across a stream. Over many years the roots grow strong enough to walk on, even in heavy rain.
  items:
  - prompt: 'Kaziranga is famous for the:'
    options:
    - one-horned rhinoceros
    - camel
    - snow leopard
    - penguin
    answer: one-horned rhinoceros
    difficulty: 1
    hints:
    - In Assam.
    - One horn.
    solution: Kaziranga protects the one-horned rhino.
    mistakes: {"snow leopard": "v5_kaziranga"}
  - prompt: 'The Sundarbans are forests of:'
    options:
    - mangroves
    - pine trees
    - cactus
    - apple trees
    answer: mangroves
    difficulty: 1
    hints:
    - They grow in salty water.
    - Roots stick up.
    solution: The Sundarbans are mangrove forests.
    mistakes: {"pine trees": "v5_mangroves"}
  - prompt: 'The Rann of Kutch is known for its:'
    options:
    - white salt desert
    - snowy peaks
    - thick rainforest
    - coral islands
    answer: white salt desert
    difficulty: 1
    hints:
    - Gujarat.
    - White and flat.
    solution: It is a vast white salt desert.
    mistakes: {"snowy peaks": "v5_rann"}
  - prompt: 'Mawsynram in Meghalaya is one of the:'
    options:
    - wettest places on Earth
    - driest places on Earth
    - coldest places on Earth
    - hottest deserts
    answer: wettest places on Earth
    difficulty: 2
    hints:
    - Lots of rain.
    - Near Cherrapunji.
    solution: Mawsynram gets some of the highest rainfall in the world.
    mistakes: {"driest places on Earth": "v5_mawsynram"}
  - prompt: 'Ladakh is a:'
    options:
    - cold desert
    - hot desert
    - rainforest
    - island
    answer: cold desert
    difficulty: 2
    hints:
    - High and dry.
    - Very cold.
    solution: Ladakh is a high, cold desert.
    mistakes: {"hot desert": "v5_ladakh"}
  - prompt: Which animal is famous in the Sundarbans?
    options:
    - Bengal tiger
    - one-horned rhino
    - camel
    - yak
    answer: Bengal tiger
    difficulty: 1
    hints:
    - It can swim.
    - Royal ...
    solution: Bengal tigers live in the Sundarbans.
    mistakes: {"one-horned rhino": "v5_bengal_tiger"}
  - prompt: Which animal is Kaziranga famous for?
    options:
    - One-horned rhinoceros
    - Camel
    - Snow leopard
    answer: One-horned rhinoceros
    difficulty: 1
    hints:
    - It is a big grey animal with one horn.
    - It lives in grassy wetlands of Assam.
    solution: 'Step 1: Kaziranga is in Assam. Step 2: it protects the one-horned rhinoceros.'
    mistakes:
      Camel: c5v6_place
      Snow leopard: c5v6_place
  - prompt: The Rann of Kutch is in which state?
    options:
    - Gujarat
    - Kerala
    - Assam
    answer: Gujarat
    difficulty: 2
    hints:
    - It is in the west of India.
    - Near the Arabian Sea, north of Mumbai.
    solution: 'Step 1: the salt desert is in the west. Step 2: it is in Gujarat.'
    mistakes:
      Kerala: c5v6_place
      Assam: c5v6_place
  - prompt: Why do mangrove roots stick up out of the mud?
    options:
    - To get air
    - To catch fish
    - To scare tigers
    answer: To get air
    difficulty: 2
    hints:
    - Wet mud has very little air.
    - Roots need air too.
    solution: 'Step 1: the mud is waterlogged. Step 2: roots grow upward to take in air.'
    mistakes:
      To catch fish: c5v6_adapt
      To scare tigers: c5v6_adapt
  - prompt: 'Animals in Ladakh, like the yak, have:'
    options:
    - Thick, long hair
    - No hair at all
    - Fins
    answer: Thick, long hair
    difficulty: 2
    hints:
    - Ladakh is very cold.
    - How do animals stay warm?
    solution: 'Step 1: Ladakh is freezing. Step 2: thick hair keeps yaks warm.'
    mistakes:
      No hair at all: c5v6_adapt
      Fins: c5v6_adapt
  - prompt: 'Kerala''s backwaters are:'
    options:
    - "Calm lagoons and canals near the sea"
    - "Dry, sandy deserts with few plants"
    - "Snowy mountain peaks far from the sea"
    answer: Calm lagoons and canals near the sea
    difficulty: 1
    hints:
    - Houseboats float on them.
    - They are full of water.
    solution: 'Step 1: houseboats sail on them. Step 2: they are calm water channels near the sea.'
    mistakes:
      "Dry, sandy deserts with few plants": c5v6_place
      "Snowy mountain peaks far from the sea": c5v6_place
  - prompt: 'The white colour of the Rann of Kutch comes from:'
    options:
    - Salt
    - Snow
    - Chalk paint
    answer: Salt
    difficulty: 2
    hints:
    - Sea water dries up there.
    - What is left when sea water dries?
    solution: 'Step 1: sea water floods it and dries. Step 2: the white layer is salt.'
    mistakes:
      Snow: c5v6_place
      Chalk paint: c5v6_place
  - prompt: Why do people in Meghalaya carry umbrellas most of the year?
    options:
    - It rains very often
    - It is very sunny and dry
    - It snows daily
    answer: It rains very often
    difficulty: 1
    hints:
    - Mawsynram is there.
    - It is one of the wettest places.
    solution: 'Step 1: Meghalaya gets huge rain. Step 2: umbrellas are always needed.'
    mistakes:
      It is very sunny and dry: c5v6_place
      It snows daily: c5v6_place
  - prompt: 'Tigers in the Sundarbans are good at:'
    options:
    - Swimming
    - Climbing ice
    - Flying
    answer: Swimming
    difficulty: 3
    hints:
    - The Sundarbans are full of rivers and creeks.
    - To move around they must cross water.
    solution: 'Step 1: the forest is criss-crossed by water. Step 2: these tigers swim well.'
    mistakes:
      Climbing ice: c5v6_adapt
      Flying: c5v6_adapt
  - prompt: Why are places like Kaziranga protected?
    options:
    - "So rare animals can live safely"
    - "So big factories can be built there"
    - "So people can cut down the trees"
    answer: So rare animals can live safely
    difficulty: 3
    hints:
    - The one-horned rhino is rare.
    - Hunters once killed many.
    solution: 'Step 1: rare animals need safe homes. Step 2: protected parks keep them safe.'
    mistakes:
      "So big factories can be built there": c5v6_care
      "So people can cut down the trees": c5v6_care
  - prompt: 'Case: A tour guide says, ''This place is high in the mountains. It hardly rains, winters are freezing and animals have thick fur.'' Which place is the guide describing?'
    options:
    - Ladakh
    - Kerala's backwaters
    - The Sundarbans
    answer: Ladakh
    hints:
    - Is the place hot or cold? Wet or dry?
    - Which place is a high, cold desert?
    solution: Ladakh is high in the mountains, cold and dry, so it is called a cold desert. Its animals, like yaks, have thick fur.
    mistakes:
      Kerala's backwaters: c5v6_place
      The Sundarbans: c5v6_place
    exam: case
    difficulty: 2
  - prompt: 'Situation: Visitors in Kaziranga want to get very close to a rhino to take a selfie. What should the forest guard tell them?'
    options:
    - "Stay a safe distance away and keep quiet so the animals are not disturbed"
    - "Go closer and make loud noises so that the rhino turns round for the photo"
    - "Walk up to the rhino and feed it some biscuits so that it stays still"
    answer: Stay a safe distance away and keep quiet so the animals are not disturbed
    hints:
    - Why are places like Kaziranga protected?
    - What keeps both the animals and the visitors safe?
    solution: Kaziranga protects rare animals. Keeping a distance and staying quiet keeps the rhinos calm and the visitors safe.
    mistakes:
      "Go closer and make loud noises so that the rhino turns round for the photo": c5v6_care
      "Walk up to the rhino and feed it some biscuits so that it stays still": c5v6_care
    exam: competency
    difficulty: 2
- code: cbse5v.places.heritage
  title: Special places made by people
  after:
  - cbse5v.places.nature
  notes: |
    People built amazing places: the Taj Mahal (Agra, white marble), Qutub Minar (Delhi), Konark Sun Temple (Odisha,
    shaped like a chariot), Hampi (Karnataka, ruins of the Vijayanagara empire), Ajanta and Ellora caves (Maharashtra,
    paintings and rock-cut temples). These are heritage sites; we must not scratch or litter them.
  explanations:
    text: Long ago, people built beautiful monuments that still stand today. The Taj Mahal is made of white marble. The Konark temple is shaped like a giant chariot. These heritage places belong to all of us, so we must protect them.
    visual: Draw the Konark temple as a chariot with big stone wheels pulled by horses.
    step_by_step: 'Step 1: Name the monument. Step 2: Where is it? Step 3: What is special about it? Step 4: How can visitors protect it?'
    real_world: Schools take trips to monuments so children learn history by seeing it.
  picture:
    kind: flow
    steps:
    - Visit a monument
    - Learn its story
    - Don't scratch or litter
    - Leave it for the next visitor
    alt: 'At a heritage site: visit, learn its story, never scratch or litter, and leave it for the next visitor.'
  activity:
    type: sort
    prompt: Which monument is it?
    bins:
    - Taj Mahal
    - Konark Sun Temple
    - Qutub Minar
    - Red Fort
    items:
    - label: A white marble tomb by the Yamuna
      bin: Taj Mahal
      clue: In Agra.
      why: The Taj Mahal.
    - label: Built by Shah Jahan in memory of Mumtaz
      bin: Taj Mahal
      clue: A tomb for his wife.
      why: The Taj Mahal.
    - label: Shaped like a giant chariot with stone wheels
      bin: Konark Sun Temple
      clue: In Odisha.
      why: Konark.
    - label: 24 carved wheels that work as sundials
      bin: Konark Sun Temple
      clue: Near the sea in Odisha.
      why: Konark.
    - label: A very tall tower in Delhi
      bin: Qutub Minar
      clue: About 73 m high.
      why: The Qutub Minar.
    - label: Next to an iron pillar that hasn't rusted in 1600 years
      bin: Qutub Minar
      clue: In Mehrauli, Delhi.
      why: The Qutub Minar.
    - label: The Prime Minister speaks here on 15 August
      bin: Red Fort
      clue: Independence Day.
      why: The Red Fort.
    - label: Huge red walls in Old Delhi
      bin: Red Fort
      clue: A fort, not a tower.
      why: The Red Fort.
  lesson:
    - teach: People long ago built amazing places. The Taj Mahal in Agra is made of white marble. The Qutub Minar in Delhi is a tall tower of red sandstone.
      check:
        prompt: Where is the Qutub Minar?
        options:
        - Delhi
        - Kerala
        - Assam
        answer: Delhi
        why: It stands in south Delhi.
      ways:
      - style: visual
        teach: Famous old monuments and what they are made of.
        picture:
          kind: compare
          columns:
          - title: Monument
            points:
            - Taj Mahal, Agra
            - Qutub Minar, Delhi
          - title: Made of
            points:
            - White marble
            - Red sandstone
          alt: The Taj Mahal in Agra is made of white marble. The Qutub Minar in Delhi is made of red sandstone.
      - style: real_world
        teach: Smoke and dust from traffic and factories can turn white marble yellow. That is why there are rules about vehicles near the Taj Mahal, to keep its marble white.
    - teach: The Konark Sun Temple in Odisha is shaped like a huge stone chariot with carved wheels. Hampi in Karnataka has ruins of the Vijayanagara empire. The Ajanta and Ellora caves in Maharashtra have old paintings and temples cut from rock.
      picture:
        kind: compare
        columns:
        - title: Monument
          points:
          - Taj Mahal
          - Konark Temple
          - Hampi
          - Ajanta caves
        - title: State
          points:
          - Uttar Pradesh
          - Odisha
          - Karnataka
          - Maharashtra
        alt: Heritage sites and the states they are in.
      check:
        prompt: 'The Ellora caves have temples:'
        options:
        - Cut out of solid rock
        - Made of glass
        - Made of wood
        answer: Cut out of solid rock
        why: Workers carved them from the hillside.
      ways:
      - style: step_by_step
        teach: 'Make a heritage card. Step 1: Write the name of the place, such as Hampi. Step 2: Write its state, Karnataka. Step 3: Write what you can see there: ruins of an old empire, temples and a stone chariot. Step 4: Draw one thing from it.'
      - style: real_world
        teach: At Ellora, a whole temple was carved from a single hill of rock, from the top downwards. The workers could not stick a piece back on if they made a mistake, so they had to plan every cut.
    - teach: 'These are heritage sites: treasures from the past that belong to everyone. We must not scratch names, litter, or touch old paintings, so they last for people in the future.'
      check:
        prompt: Why should we not touch old cave paintings?
        options:
        - Hands can damage them
        - They are wet
        - They are hot
        answer: Hands can damage them
        why: Oil and dirt from hands wear paintings away.
      ways:
      - style: visual
        teach: What we should and should not do when we visit a heritage site.
        picture:
          kind: compare
          columns:
          - title: Do
            points:
            - Look and learn
            - Put waste in a dustbin
            - Follow the guard's rules
          - title: Do not
            points:
            - Scratch names on walls
            - Touch old paintings
            - Climb on carvings
          alt: At a heritage site, look and learn, put waste in a dustbin and follow the guard's rules. Do not scratch names on walls, touch old paintings or climb on carvings.
      - style: real_world
        teach: Touching an old cave painting leaves a tiny bit of oil and dirt from your fingers. One touch seems harmless, but thousands of visitors touching it every year would slowly wipe the painting away.
  items:
  - prompt: 'The Taj Mahal is in:'
    options:
    - Agra
    - Kochi
    - Chennai
    - Kolkata
    answer: Agra
    difficulty: 1
    hints:
    - Uttar Pradesh.
    - On the Yamuna.
    solution: The Taj Mahal is in Agra.
    mistakes: {"Kolkata": "v5_agra"}
  - prompt: 'The Taj Mahal is made of:'
    options:
    - white marble
    - red mud
    - wood
    - glass
    answer: white marble
    difficulty: 1
    hints:
    - It shines white.
    - A smooth stone.
    solution: It is built of white marble.
    mistakes: {"red mud": "v5_marble"}
  - prompt: 'The Konark Sun Temple is shaped like a:'
    options:
    - chariot
    - boat
    - fish
    - tree
    answer: chariot
    difficulty: 2
    hints:
    - Big stone wheels.
    - For the Sun god.
    solution: Konark is shaped like the Sun's chariot.
    mistakes: {"boat": "v5_chariot"}
  - prompt: 'Ajanta caves are famous for their:'
    options:
    - paintings
    - waterfalls
    - snow
    - tigers
    answer: paintings
    difficulty: 2
    hints:
    - Old art on walls.
    - Buddhist stories.
    solution: Ajanta has ancient wall paintings.
    mistakes: {"waterfalls": "v5_ajanta"}
  - prompt: What should visitors NOT do at a monument?
    options:
    - scratch names on walls
    - take photos
    - read the signs
    - listen to the guide
    answer: scratch names on walls
    difficulty: 1
    hints:
    - Which damages it?
    - Writing on walls.
    solution: Scratching names damages heritage.
    mistakes: {"read the signs": "v5_monument"}
  - prompt: 'Hampi has ruins of the:'
    options:
    - Vijayanagara empire
    - Mughal empire
    - British offices
    - modern malls
    answer: Vijayanagara empire
    difficulty: 2
    hints:
    - Karnataka.
    - A great southern kingdom.
    solution: Hampi was the capital of the Vijayanagara empire.
    mistakes: {"Mughal empire": "v5_hampi"}
  - prompt: The Taj Mahal is in which city?
    options:
    - Agra
    - Delhi
    - Jaipur
    answer: Agra
    difficulty: 1
    hints:
    - It is on the banks of the Yamuna.
    - It is in Uttar Pradesh.
    solution: 'Step 1: the Taj Mahal is in Uttar Pradesh. Step 2: in Agra.'
    mistakes:
      Delhi: c5v6_built
      Jaipur: c5v6_built
  - prompt: 'The Konark Sun Temple is in:'
    options:
    - Odisha
    - Kerala
    - Punjab
    answer: Odisha
    difficulty: 2
    hints:
    - It is on the east coast.
    - Near Puri.
    solution: 'Step 1: Konark is on the east coast. Step 2: it is in Odisha.'
    mistakes:
      Kerala: c5v6_built
      Punjab: c5v6_built
  - prompt: What are the Qutub Minar's walls made of?
    options:
    - Red sandstone
    - White marble
    - Glass
    answer: Red sandstone
    difficulty: 2
    hints:
    - It is reddish-brown.
    - The Taj Mahal is the white one.
    solution: 'Step 1: the Qutub Minar is reddish. Step 2: it is red sandstone.'
    mistakes:
      White marble: c5v6_built
      Glass: c5v6_built
  - prompt: Hampi is in which state?
    options:
    - Karnataka
    - Gujarat
    - Bihar
    answer: Karnataka
    difficulty: 2
    hints:
