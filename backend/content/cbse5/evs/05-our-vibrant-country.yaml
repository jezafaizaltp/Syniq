# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 5
title: Our Vibrant Country
tips:
  v5_arabian: "The Bay of Bengal is on the east. Kerala faces the sea on the other side."
  v5_bhangra: "Bhangra is danced at harvest with the dhol, in the land of five rivers."
  v5_flag: "The flag's top band is the colour of courage. Picture it on Independence Day."
  v5_himalayas: "The Western Ghats run along the west coast. The northern range has the highest peaks."
  v5_lakshadweep: "Lakshadweep is in the Arabian Sea, off Kerala. 'Dweep' means island."
  v5_monsoon: "Those are winter months. Schools reopen in Kerala as the rains begin."
  v5_onam: "Onam has boat races and flower carpets called pookalam, in a southern state."
  v5_peninsula: "India has land on the north. Count the sides with sea: west, east and south."
  v5_spokes: "The Chakra has as many spokes as there are hours in a full day."
  v5_thar: "The Thar is in Rajasthan, near the border with Pakistan."
  v5_tiger: "The lion is on the national emblem. The national animal is a striped big cat."

concepts:
- code: cbse5v.india.diverse
  title: Many states, one India
  notes: |
    India has 28 states and 8 union territories, many languages (22 in the Constitution's list), foods, dresses,
    festivals and dances. Examples: Kerala (Malayalam, Onam, Kathakali), Punjab (Punjabi, Baisakhi, Bhangra), Assam
    (Assamese, Bihu), Tamil Nadu (Tamil, Pongal, Bharatanatyam). National symbols: flag (saffron, white, green, Ashoka
    Chakra with 24 spokes), anthem Jana Gana Mana, national animal tiger, bird peacock.
  explanations:
    text: India is like a big garden with many kinds of flowers. Each state has its own languages, food, clothes, festivals and dances, but we are all Indians. Our flag and anthem bring us together.
    visual: Draw an outline of India. Mark Kerala in the south with 'Onam', Punjab in the north with 'Baisakhi', Assam in the east with 'Bihu'.
    step_by_step: 'Step 1: Pick a state. Step 2: Find its language, festival and dance. Step 3: Compare with your own state.'
    real_world: Republic Day parades show floats from every state, each with its own culture.
  picture:
    kind: compare
    columns:
    - title: State
      points:
      - Kerala
      - Punjab
      - Assam
    - title: Festival and dance
      points:
      - Onam, Kathakali
      - Baisakhi, Bhangra
      - Bihu
    alt: Kerala celebrates Onam and has Kathakali, Punjab celebrates Baisakhi with Bhangra, and Assam celebrates Bihu.
  activity:
    type: sort
    prompt: Which state is it from?
    bins:
    - Kerala
    - Punjab
    - Gujarat
    - Assam
    - Tamil Nadu
    items:
    - label: Kathakali dance
      bin: Kerala
      clue: Painted faces, big skirts, stories without words.
      why: From Kerala.
    - label: Onam and its boat races
      bin: Kerala
      clue: A harvest festival with flower carpets.
      why: Kerala.
    - label: Bhangra dance
      bin: Punjab
      clue: Drums and jumps at harvest time.
      why: Punjab.
    - label: Makki di roti and sarson da saag
      bin: Punjab
      clue: Maize bread and mustard greens.
      why: Punjab.
    - label: Garba dance
      bin: Gujarat
      clue: Circles of dancers during Navratri.
      why: Gujarat.
    - label: Dhokla
      bin: Gujarat
      clue: A soft, steamed snack.
      why: Gujarat.
    - label: Bihu dance
      bin: Assam
      clue: A spring festival dance from the north-east.
      why: Assam.
    - label: Bharatanatyam
      bin: Tamil Nadu
      clue: A classical dance from the south.
      why: Tamil Nadu.
    - label: Pongal
      bin: Tamil Nadu
      clue: A harvest festival where rice boils over.
      why: Tamil Nadu.
  items:
  - prompt: 'Onam is a festival of:'
    options:
    - Kerala
    - Punjab
    - Assam
    - Gujarat
    answer: Kerala
    difficulty: 1
    hints:
    - Pookalam and sadya.
    - South India.
    solution: Onam is Kerala's harvest festival.
    mistakes: {"Punjab": "v5_onam"}
  - prompt: How many spokes does the Ashoka Chakra on our flag have?
    options:
    - '24'
    - '12'
    - '10'
    - '30'
    answer: '24'
    difficulty: 2
    hints:
    - It is in the white band.
    - Two dozen.
    solution: The Ashoka Chakra has 24 spokes.
    mistakes: {"12": "v5_spokes"}
  - prompt: What is India's national animal?
    options:
    - tiger
    - lion
    - elephant
    - peacock
    answer: tiger
    difficulty: 1
    hints:
    - Royal Bengal ...
    - Striped big cat.
    solution: The tiger is India's national animal.
    mistakes: {"lion": "v5_tiger"}
  - prompt: 'Bhangra is a dance from:'
    options:
    - Punjab
    - Kerala
    - Tamil Nadu
    - Assam
    answer: Punjab
    difficulty: 1
    hints:
    - Dhol drums.
    - North India.
    solution: Bhangra is Punjab's folk dance.
    mistakes: {"Kerala": "v5_bhangra"}
  - prompt: What is our national anthem?
    options:
    - Jana Gana Mana
    - Vande Mataram
    - Saare Jahan Se Achha
    - Happy Birthday
    answer: Jana Gana Mana
    difficulty: 1
    hints:
    - Written by Rabindranath Tagore.
    - Sung on Independence Day.
    solution: Jana Gana Mana is the national anthem.
    mistakes:
      Vande Mataram: c5v_reread
  - prompt: What colours are on the Indian flag (top to bottom)?
    options:
    - saffron, white, green
    - green, white, saffron
    - red, white, blue
    - saffron, green, white
    answer: saffron, white, green
    difficulty: 1
    hints:
    - Saffron is on top.
    - White in the middle.
    solution: Saffron on top, white middle, green at the bottom.
    mistakes: {"green, white, saffron": "v5_flag"}
- code: cbse5v.india.land
  title: Landforms and climate
  after:
  - cbse5v.india.diverse
  notes: |
    India has the Himalayan mountains in the north, the plains of the Ganga in the north, the Thar desert in the west,
    the Deccan plateau in the middle, coasts on three sides (Arabian Sea, Indian Ocean, Bay of Bengal) and islands
    (Andaman and Nicobar, Lakshadweep). Climate varies: snowy mountains, hot desert, rainy coasts. Monsoon brings most
    rain from June to September.
  explanations:
    text: 'India''s land is very different from place to place: snowy mountains in the north, a hot sandy desert in the west, wide plains, high plateaus, long coasts and islands. The monsoon brings rain to most of the country in summer.'
    visual: Draw India with the Himalayas (white) at the top, the Thar desert (yellow) on the left, the sea (blue) on three sides, and small dots for islands.
    step_by_step: 'Step 1: Find a place on the map. Step 2: Is it mountain, plain, desert, plateau or coast? Step 3: Think what the weather and life are like there.'
    real_world: Ladakh is cold desert, Rajasthan is hot desert, and Kerala's coast gets heavy monsoon rain.
  picture:
    kind: flow
    steps:
    - 'North: Himalayas'
    - Plains of the Ganga
    - 'Centre: Deccan plateau'
    - 'South: coasts and seas'
    alt: 'India from north to south: the Himalayas, the plains of the Ganga, the Deccan plateau, and the coasts and seas.'
  activity:
    type: sort
    prompt: What kind of land is it?
    bins:
    - Mountains
    - Desert
    - Plains
    - Coast
    items:
    - label: Snowy peaks of the Himalayas
      bin: Mountains
      clue: High and cold.
      why: Mountains.
    - label: Steep slopes with tea gardens and winding roads
      bin: Mountains
      clue: Up and down.
      why: Hills and mountains.
    - label: Sand dunes and camels in Rajasthan
      bin: Desert
      clue: Hot and dry.
      why: The Thar Desert.
    - label: Very little rain all year
      bin: Desert
      clue: Dry land.
      why: A desert.
    - label: Wide, flat farmland along the Ganga
      bin: Plains
      clue: Flat and fertile.
      why: Plains.
    - label: Wheat fields stretching far in Punjab
      bin: Plains
      clue: Flat land, good soil.
      why: Plains.
    - label: Fishing boats and beaches in Kerala
      bin: Coast
      clue: Where land meets sea.
      why: The coast.
    - label: A lighthouse by the sea
      bin: Coast
      clue: Guides ships.
      why: The coast.
  items:
  - prompt: Which mountains are in the north of India?
    options:
    - the Himalayas
    - the Alps
    - the Western Ghats
    - the Andes
    answer: the Himalayas
    difficulty: 1
    hints:
    - Highest mountains in the world.
    - Snowy.
    solution: The Himalayas lie in the north.
    mistakes: {"the Western Ghats": "v5_himalayas"}
  - prompt: The Thar desert is in which part of India?
    options:
    - west
    - south
    - east
    - north-east
    answer: west
    difficulty: 1
    hints:
    - Rajasthan.
    - Sand dunes.
    solution: The Thar desert is in western India.
    mistakes: {"east": "v5_thar"}
  - prompt: Which sea is on Kerala's west coast?
    options:
    - Arabian Sea
    - Bay of Bengal
    - Red Sea
    - Black Sea
    answer: Arabian Sea
    difficulty: 1
    hints:
    - West of India.
    - Kochi port.
    solution: The Arabian Sea is to Kerala's west.
    mistakes: {"Bay of Bengal": "v5_arabian"}
  - prompt: When does the monsoon bring most rain to India?
    options:
    - June to September
    - December to February
    - only in March
    - never
    answer: June to September
    difficulty: 1
    hints:
    - Rainy season.
    - School reopens.
    solution: The south-west monsoon brings rain June to September.
    mistakes: {"December to February": "v5_monsoon"}
  - prompt: 'Lakshadweep is a group of:'
    options:
    - islands
    - mountains
    - deserts
    - rivers
    answer: islands
    difficulty: 1
    hints:
    - In the Arabian Sea.
    - Surrounded by water.
    solution: Lakshadweep is a group of islands.
    mistakes: {"mountains": "v5_lakshadweep"}
  - prompt: India has sea on how many sides?
    options:
    - three
    - one
    - two
    - four
    answer: three
    difficulty: 2
    hints:
    - West, south and east.
    - A peninsula.
    solution: India is a peninsula with sea on three sides.
    mistakes: {"four": "v5_peninsula"}
