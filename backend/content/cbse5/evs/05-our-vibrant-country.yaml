# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 5
title: Our Vibrant Country
tips:
  v5_arabian: "The Bay of Bengal is on the east. Kerala faces the sea on the other side."
  v5_bhangra: "Bhangra is danced at harvest with the dhol, in the land of five rivers."
  v5_flag: "The flag's top band is the colour of courage. Picture it on Independence Day."
  v5_himalayas: "The Western Ghats run along the west coast. The northern range has the highest peaks."
  v5_lakshadweep: "Lakshadweep is in the Arabian Sea, off Kerala. 'Dweep' means island."
  v5_monsoon: "Those are winter months. Schools reopen in Kerala as the rains begin."
  v5_onam: "Onam has boat races and flower carpets called pookalam, in a southern state."
  v5_peninsula: "India has land on the north. Count the sides with sea: west, east and south."
  v5_spokes: "The Chakra has as many spokes as there are hours in a full day."
  v5_thar: "The Thar is in Rajasthan, near the border with Pakistan."
  v5_tiger: "The lion is on the national emblem. The national animal is a striped big cat."
  c5v5_state: Match each festival, dance or language with the part of India it comes from.
  c5v5_symbol: 'Think of the things chosen to stand for the whole country: the flag, anthem, animal and bird.'
  c5v5_land: 'Picture India''s map: high mountains at the top, sand in the west, a raised middle, seas round the south.'
  c5v5_climate: Think which months are hottest, which are rainy, and which are cool.

concepts:
- code: cbse5v.india.diverse
  title: Many states, one India
  notes: |
    India has 28 states and 8 union territories, many languages (22 in the Constitution's list), foods, dresses,
    festivals and dances. Examples: Kerala (Malayalam, Onam, Kathakali), Punjab (Punjabi, Baisakhi, Bhangra), Assam
    (Assamese, Bihu), Tamil Nadu (Tamil, Pongal, Bharatanatyam). National symbols: flag (saffron, white, green, Ashoka
    Chakra with 24 spokes), anthem Jana Gana Mana, national animal tiger, bird peacock.
  explanations:
    text: India is like a big garden with many kinds of flowers. Each state has its own languages, food, clothes, festivals and dances, but we are all Indians. Our flag and anthem bring us together.
    visual: Draw an outline of India. Mark Kerala in the south with 'Onam', Punjab in the north with 'Baisakhi', Assam in the east with 'Bihu'.
    step_by_step: 'Step 1: Pick a state. Step 2: Find its language, festival and dance. Step 3: Compare with your own state.'
    real_world: Republic Day parades show floats from every state, each with its own culture.
  picture:
    kind: compare
    columns:
    - title: State
      points:
      - Kerala
      - Punjab
      - Assam
    - title: Festival and dance
      points:
      - Onam, Kathakali
      - Baisakhi, Bhangra
      - Bihu
    alt: Kerala celebrates Onam and has Kathakali, Punjab celebrates Baisakhi with Bhangra, and Assam celebrates Bihu.
  activity:
    type: sort
    prompt: Which state is it from?
    bins:
    - Kerala
    - Punjab
    - Gujarat
    - Assam
    - Tamil Nadu
    items:
    - label: Kathakali dance
      bin: Kerala
      clue: Painted faces, big skirts, stories without words.
      why: From Kerala.
    - label: Onam and its boat races
      bin: Kerala
      clue: A harvest festival with flower carpets.
      why: Kerala.
    - label: Bhangra dance
      bin: Punjab
      clue: Drums and jumps at harvest time.
      why: Punjab.
    - label: Makki di roti and sarson da saag
      bin: Punjab
      clue: Maize bread and mustard greens.
      why: Punjab.
    - label: Garba dance
      bin: Gujarat
      clue: Circles of dancers during Navratri.
      why: Gujarat.
    - label: Dhokla
      bin: Gujarat
      clue: A soft, steamed snack.
      why: Gujarat.
    - label: Bihu dance
      bin: Assam
      clue: A spring festival dance from the north-east.
      why: Assam.
    - label: Bharatanatyam
      bin: Tamil Nadu
      clue: A classical dance from the south.
      why: Tamil Nadu.
    - label: Pongal
      bin: Tamil Nadu
      clue: A harvest festival where rice boils over.
      why: Tamil Nadu.
  lesson:
    - teach: 'India has 28 states and 8 union territories. People speak many languages, eat different foods, wear different clothes and celebrate many festivals. This is unity in diversity: many ways of life, one country.'
      check:
        prompt: What does 'unity in diversity' mean?
        options:
        - Many different ways of life living together as one
        - Everyone is exactly the same
        - States do not talk to each other
        answer: Many different ways of life living together as one
        why: India is different in many ways but united.
    - teach: 'Each state has its own colours. Kerala: Malayalam, Onam, Kathakali. Punjab: Punjabi, Baisakhi, Bhangra. Assam: Assamese, Bihu. Tamil Nadu: Tamil, Pongal, Bharatanatyam.'
      picture:
        kind: compare
        columns:
        - title: Kerala
          points:
          - Malayalam
          - Onam
          - Kathakali
        - title: Punjab
          points:
          - Punjabi
          - Baisakhi
          - Bhangra
        - title: Tamil Nadu
          points:
          - Tamil
          - Pongal
          - Bharatanatyam
        alt: Each state has its own language, festival and dance.
      check:
        prompt: 'Pongal is a harvest festival of:'
        options:
        - Tamil Nadu
        - Punjab
        - Assam
        answer: Tamil Nadu
        why: It is celebrated in Tamil Nadu in January.
    - teach: 'National symbols stand for all of India: the flag (saffron, white, green, with the 24-spoke Ashoka Chakra), the national anthem Jana Gana Mana, the tiger (national animal), the peacock (national bird) and the lotus (national flower).'
      check:
        prompt: What is India's national bird?
        options:
        - Peacock
        - Parrot
        - Crow
        answer: Peacock
        why: The peacock was chosen as the national bird.
  items:
  - prompt: 'Onam is a festival of:'
    options:
    - Kerala
    - Punjab
    - Assam
    - Gujarat
    answer: Kerala
    difficulty: 1
    hints:
    - Pookalam and sadya.
    - South India.
    solution: Onam is Kerala's harvest festival.
    mistakes: {"Punjab": "v5_onam"}
  - prompt: How many spokes does the Ashoka Chakra on our flag have?
    options:
    - '24'
    - '12'
    - '10'
    - '30'
    answer: '24'
    difficulty: 2
    hints:
    - It is in the white band.
    - Two dozen.
    solution: The Ashoka Chakra has 24 spokes.
    mistakes: {"12": "v5_spokes"}
  - prompt: What is India's national animal?
    options:
    - tiger
    - lion
    - elephant
    - peacock
    answer: tiger
    difficulty: 1
    hints:
    - Royal Bengal ...
    - Striped big cat.
    solution: The tiger is India's national animal.
    mistakes: {"lion": "v5_tiger"}
  - prompt: 'Bhangra is a dance from:'
    options:
    - Punjab
    - Kerala
    - Tamil Nadu
    - Assam
    answer: Punjab
    difficulty: 1
    hints:
    - Dhol drums.
    - North India.
    solution: Bhangra is Punjab's folk dance.
    mistakes: {"Kerala": "v5_bhangra"}
  - prompt: What is our national anthem?
    options:
    - Jana Gana Mana
    - Vande Mataram
    - Saare Jahan Se Achha
    - Happy Birthday
    answer: Jana Gana Mana
    difficulty: 1
    hints:
    - Written by Rabindranath Tagore.
    - Sung on Independence Day.
    solution: Jana Gana Mana is the national anthem.
    mistakes:
      Vande Mataram: c5v_reread
  - prompt: What colours are on the Indian flag (top to bottom)?
    options:
    - saffron, white, green
    - green, white, saffron
    - red, white, blue
    - saffron, green, white
    answer: saffron, white, green
    difficulty: 1
    hints:
    - Saffron is on top.
    - White in the middle.
    solution: Saffron on top, white middle, green at the bottom.
    mistakes: {"green, white, saffron": "v5_flag"}
  - prompt: 'Kathakali is a dance from:'
    options:
    - Kerala
    - Punjab
    - Gujarat
    answer: Kerala
    difficulty: 1
    hints:
    - Dancers wear big painted faces and costumes.
    - It comes from the state with Onam.
    solution: 'Step 1: Kathakali uses green face paint and big costumes. Step 2: it is from Kerala.'
    mistakes:
      Punjab: c5v5_state
      Gujarat: c5v5_state
  - prompt: What is India's national flower?
    options:
    - Lotus
    - Rose
    - Sunflower
    answer: Lotus
    difficulty: 1
    hints:
    - It grows in ponds.
    - Many temples carve it.
    solution: 'Step 1: the national flower grows in water. Step 2: it is the lotus.'
    mistakes:
      Rose: c5v5_symbol
      Sunflower: c5v5_symbol
  - prompt: 'Bihu is a festival and dance of:'
    options:
    - Assam
    - Kerala
    - Rajasthan
    answer: Assam
    difficulty: 2
    hints:
    - It is in the north-east.
    - Tea gardens grow there.
    solution: 'Step 1: Bihu is from the north-east. Step 2: it belongs to Assam.'
    mistakes:
      Kerala: c5v5_state
      Rajasthan: c5v5_state
  - prompt: What colour is the Ashoka Chakra on the flag?
    options:
    - Navy blue
    - Red
    - Yellow
    answer: Navy blue
    difficulty: 2
    hints:
    - It sits on the white band.
    - It is a dark colour.
    solution: 'Step 1: the wheel is in the white middle band. Step 2: it is navy blue.'
    mistakes:
      Red: c5v5_symbol
      Yellow: c5v5_symbol
  - prompt: How many states does India have?
    answer: '28'
    check: '28'
    difficulty: 2
    hints:
    - It is between 25 and 30.
    - There are also 8 union territories.
    solution: 'Step 1: India has states and union territories. Step 2: there are 28 states.'
    mistakes:
      '36': c5v5_state
      '8': c5v5_state
      '29': c5v5_state
  - prompt: Which language is spoken mainly in Kerala?
    options:
    - Malayalam
    - Bengali
    - Marathi
    answer: Malayalam
    difficulty: 1
    hints:
    - It is the language of Onam songs.
    - You may speak it at home.
    solution: 'Step 1: each state has a main language. Step 2: Kerala''s is Malayalam.'
    mistakes:
      Bengali: c5v5_state
      Marathi: c5v5_state
  - prompt: Who wrote our national anthem, Jana Gana Mana?
    options:
    - Rabindranath Tagore
    - Mahatma Gandhi
    - Jawaharlal Nehru
    answer: Rabindranath Tagore
    difficulty: 3
    hints:
    - He was a great poet from Bengal.
    - He won the Nobel Prize for poetry.
    solution: 'Step 1: the anthem was written by a poet. Step 2: Rabindranath Tagore.'
    mistakes:
      Mahatma Gandhi: c5v5_symbol
      Jawaharlal Nehru: c5v5_symbol
  - prompt: Why is a festival like Diwali or Eid celebrated by many friends of different faiths?
    options:
    - Sharing festivals brings people together
    - It is a rule
    - Only to get sweets
    answer: Sharing festivals brings people together
    difficulty: 3
    hints:
    - Think of unity in diversity.
    - Friends join each other's joy.
    solution: 'Step 1: India has many faiths. Step 2: sharing festivals builds friendship and unity.'
    mistakes:
      It is a rule: c5v5_symbol
      Only to get sweets: c5v5_symbol
  - prompt: 'Bharatanatyam is a classical dance from:'
    options:
    - Tamil Nadu
    - Punjab
    - Assam
    answer: Tamil Nadu
    difficulty: 2
    hints:
    - It is a South Indian dance.
    - The state that celebrates Pongal.
    solution: 'Step 1: Bharatanatyam is from the south. Step 2: it began in Tamil Nadu.'
    mistakes:
      Punjab: c5v5_state
      Assam: c5v5_state
- code: cbse5v.india.land
  title: Landforms and climate
  after:
  - cbse5v.india.diverse
  notes: |
    India has the Himalayan mountains in the north, the plains of the Ganga in the north, the Thar desert in the west,
    the Deccan plateau in the middle, coasts on three sides (Arabian Sea, Indian Ocean, Bay of Bengal) and islands
    (Andaman and Nicobar, Lakshadweep). Climate varies: snowy mountains, hot desert, rainy coasts. Monsoon brings most
    rain from June to September.
  explanations:
    text: 'India''s land is very different from place to place: snowy mountains in the north, a hot sandy desert in the west, wide plains, high plateaus, long coasts and islands. The monsoon brings rain to most of the country in summer.'
    visual: Draw India with the Himalayas (white) at the top, the Thar desert (yellow) on the left, the sea (blue) on three sides, and small dots for islands.
    step_by_step: 'Step 1: Find a place on the map. Step 2: Is it mountain, plain, desert, plateau or coast? Step 3: Think what the weather and life are like there.'
    real_world: Ladakh is cold desert, Rajasthan is hot desert, and Kerala's coast gets heavy monsoon rain.
  picture:
    kind: flow
    steps:
    - 'North: Himalayas'
    - Plains of the Ganga
    - 'Centre: Deccan plateau'
    - 'South: coasts and seas'
    alt: 'India from north to south: the Himalayas, the plains of the Ganga, the Deccan plateau, and the coasts and seas.'
  activity:
    type: sort
    prompt: What kind of land is it?
    bins:
    - Mountains
    - Desert
    - Plains
    - Coast
    items:
    - label: Snowy peaks of the Himalayas
      bin: Mountains
      clue: High and cold.
      why: Mountains.
    - label: Steep slopes with tea gardens and winding roads
      bin: Mountains
      clue: Up and down.
      why: Hills and mountains.
    - label: Sand dunes and camels in Rajasthan
      bin: Desert
      clue: Hot and dry.
      why: The Thar Desert.
    - label: Very little rain all year
      bin: Desert
      clue: Dry land.
      why: A desert.
    - label: Wide, flat farmland along the Ganga
      bin: Plains
      clue: Flat and fertile.
      why: Plains.
    - label: Wheat fields stretching far in Punjab
      bin: Plains
      clue: Flat land, good soil.
      why: Plains.
    - label: Fishing boats and beaches in Kerala
      bin: Coast
      clue: Where land meets sea.
      why: The coast.
    - label: A lighthouse by the sea
      bin: Coast
      clue: Guides ships.
      why: The coast.
  lesson:
    - teach: India has many kinds of land. The Himalayas, the highest mountains in the world, are in the north. Below them are the wide, flat plains of the Ganga, great for farming.
      check:
        prompt: Which flat land is very good for farming?
        options:
        - The Ganga plains
        - The Himalayan peaks
        - The Thar desert
        answer: The Ganga plains
        why: Rivers leave rich soil there.
    - teach: 'The Thar desert is in the west, in Rajasthan. The Deccan plateau, a high flat land, is in the middle and south. India has sea on three sides: the Arabian Sea in the west, the Bay of Bengal in the east, and the Indian Ocean in the south.'
      picture:
        kind: compare
        columns:
        - title: North and west
          points:
          - Himalayas (north)
          - Ganga plains
          - Thar desert (west)
        - title: South and coasts
          points:
          - Deccan plateau
          - Arabian Sea (west)
          - Bay of Bengal (east)
        alt: India's main landforms from the Himalayas to the coasts.
      check:
        prompt: 'The Bay of Bengal is on India''s:'
        options:
        - East
        - West
        - North
        answer: East
        why: It lies on the eastern side.
    - teach: 'Islands are land with water all round. The Andaman and Nicobar Islands are in the Bay of Bengal; Lakshadweep is in the Arabian Sea near Kerala. India''s climate varies: snowy mountains, hot desert, rainy coasts. The monsoon brings most rain from June to September.'
      check:
        prompt: Lakshadweep is near which state?
        options:
        - Kerala
        - Punjab
        - Assam
        answer: Kerala
        why: It lies in the Arabian Sea off Kerala's coast.
  items:
  - prompt: Which mountains are in the north of India?
    options:
    - the Himalayas
    - the Alps
    - the Western Ghats
    - the Andes
    answer: the Himalayas
    difficulty: 1
    hints:
    - Highest mountains in the world.
    - Snowy.
    solution: The Himalayas lie in the north.
    mistakes: {"the Western Ghats": "v5_himalayas"}
  - prompt: The Thar desert is in which part of India?
    options:
    - west
    - south
    - east
    - north-east
    answer: west
    difficulty: 1
    hints:
    - Rajasthan.
    - Sand dunes.
    solution: The Thar desert is in western India.
    mistakes: {"east": "v5_thar"}
  - prompt: Which sea is on Kerala's west coast?
    options:
    - Arabian Sea
    - Bay of Bengal
    - Red Sea
    - Black Sea
    answer: Arabian Sea
    difficulty: 1
    hints:
    - West of India.
    - Kochi port.
    solution: The Arabian Sea is to Kerala's west.
    mistakes: {"Bay of Bengal": "v5_arabian"}
  - prompt: When does the monsoon bring most rain to India?
    options:
    - June to September
    - December to February
    - only in March
    - never
    answer: June to September
    difficulty: 1
    hints:
    - Rainy season.
    - School reopens.
    solution: The south-west monsoon brings rain June to September.
    mistakes: {"December to February": "v5_monsoon"}
  - prompt: 'Lakshadweep is a group of:'
    options:
    - islands
    - mountains
    - deserts
    - rivers
    answer: islands
    difficulty: 1
    hints:
    - In the Arabian Sea.
    - Surrounded by water.
    solution: Lakshadweep is a group of islands.
    mistakes: {"mountains": "v5_lakshadweep"}
  - prompt: India has sea on how many sides?
    options:
    - three
    - one
    - two
    - four
    answer: three
    difficulty: 2
    hints:
    - West, south and east.
    - A peninsula.
    solution: India is a peninsula with sea on three sides.
    mistakes: {"four": "v5_peninsula"}
  - prompt: In which state is most of the Thar desert?
    options:
    - Rajasthan
    - Kerala
    - Assam
    answer: Rajasthan
    difficulty: 1
    hints:
    - It is in the west of India.
    - Camels are common there.
    solution: 'Step 1: the Thar desert is in the west. Step 2: most of it is in Rajasthan.'
    mistakes:
      Kerala: c5v5_land
      Assam: c5v5_land
  - prompt: 'A plateau is:'
    options:
    - A high, flat land
    - A deep valley
    - A small island
    answer: A high, flat land
    difficulty: 2
    hints:
    - It is raised, but its top is flat.
    - Like a table.
    solution: 'Step 1: raised land with a flat top. Step 2: that is a plateau.'
    mistakes:
      A deep valley: c5v5_land
      A small island: c5v5_land
  - prompt: Which is the coldest place in winter?
    options:
    - Ladakh in the Himalayas
    - Chennai on the coast
    - Kochi in Kerala
    answer: Ladakh in the Himalayas
    difficulty: 2
    hints:
    - High mountains are cold.
    - Snow falls there.
    solution: 'Step 1: high places are colder. Step 2: Ladakh in the Himalayas is coldest.'
    mistakes:
      Chennai on the coast: c5v5_climate
      Kochi in Kerala: c5v5_climate
  - prompt: Andaman and Nicobar are in which sea?
    options:
    - Bay of Bengal
    - Arabian Sea
    - Red Sea
    answer: Bay of Bengal
    difficulty: 2
    hints:
    - They are on the east side of India.
    - Lakshadweep is on the west.
    solution: 'Step 1: Andaman and Nicobar are to the east. Step 2: they are in the Bay of Bengal.'
    mistakes:
      Arabian Sea: c5v5_land
      Red Sea: c5v5_land
  - prompt: Why do people in the Thar desert wear loose, light-coloured clothes?
    options:
    - To stay cool in the heat
    - To keep warm in snow
    - To swim
    answer: To stay cool in the heat
    difficulty: 2
    hints:
    - Deserts are very hot in the day.
    - Light colours reflect sunlight.
    solution: 'Step 1: deserts are hot. Step 2: loose light clothes keep the body cool.'
    mistakes:
      To keep warm in snow: c5v5_climate
      To swim: c5v5_climate
  - prompt: 'Kerala gets heavy rain mainly from:'
    options:
    - The monsoon
    - Snow melting
    - Desert winds
    answer: The monsoon
    difficulty: 1
    hints:
    - The rain comes in June.
    - Winds from the sea bring it.
    solution: 'Step 1: rainy winds come from the sea in June. Step 2: this is the monsoon.'
    mistakes:
      Snow melting: c5v5_climate
      Desert winds: c5v5_climate
  - prompt: 'India is called a peninsula because it has water on:'
    options:
    - Three sides
    - One side
    - All four sides
    answer: Three sides
    difficulty: 3
    hints:
    - Look at the seas round southern India.
    - The north is joined to land.
    solution: 'Step 1: sea on the west, east and south. Step 2: land in the north, so three sides.'
    mistakes:
      One side: c5v5_land
      All four sides: c5v5_land
  - prompt: Which is the highest mountain range in the world?
    options:
    - The Himalayas
    - The Western Ghats
    - The Aravallis
    answer: The Himalayas
    difficulty: 1
    hints:
    - It has Mount Everest.
    - It is in the north of India.
    solution: 'Step 1: Everest is the highest peak. Step 2: it is in the Himalayas.'
    mistakes:
      The Western Ghats: c5v5_land
      The Aravallis: c5v5_land
  - prompt: 'Houses in hilly places with heavy rain often have:'
    options:
    - Sloping roofs
    - Flat mud roofs
    - No roofs
    answer: Sloping roofs
    difficulty: 3
    hints:
    - Rain must run off quickly.
    - A slope helps water slide down.
    solution: 'Step 1: heavy rain must not collect on the roof. Step 2: sloping roofs let it run off.'
    mistakes:
      Flat mud roofs: c5v5_climate
      No roofs: c5v5_climate
