# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 1
title: Water—The Essence of Life
tips:
  c5v_think: Think about what you see at home, in school or outside. The answer is often something you have noticed in daily life.
  c5v_reread: 'Read the question again slowly. Look for the key word: what, why, where or how?'
concepts:
- code: cbse5v.water.uses
  title: Why we need water
  notes: |
    All living things need water: people, animals and plants. We use water for drinking, cooking, washing, bathing,
    farming and in factories. Our body is mostly water; we should drink clean water often. Sources: rain, rivers, lakes,
    ponds, wells, tube wells and taps. Only a small part of Earth's water is fresh water we can use.
  explanations:
    text: Every living thing needs water to stay alive. We drink it, cook with it, wash with it, and farmers use it to grow food. Even though Earth looks blue, only a little of its water is fresh water that people can use, so every drop matters.
    visual: Draw a big glass of water. Divide it into one small part labelled 'fresh water we can use' and a huge part labelled 'salty sea water and ice'.
    step_by_step: 'Step 1: List where water comes from near you. Step 2: List what you use it for in one day. Step 3: Think which uses you could reduce.'
    real_world: In summer many towns in India face water shortages; wells dry up and tankers bring water.
  picture:
    kind: compare
    columns:
    - title: Sources
      points:
      - rain
      - rivers, lakes
      - wells, taps
    - title: Uses
      points:
      - drinking, cooking
      - washing, bathing
      - farming, factories
    alt: Water comes from rain, rivers, lakes, wells and taps, and we use it for drinking, cooking, washing, bathing, farming and factories.
  activity:
    type: sort
    prompt: Who is using the water?
    bins:
    - We use it at home
    - Farmers use it
    - Animals and plants use it
    items:
    - label: Brushing your teeth
      bin: We use it at home
      clue: Where do you do this every morning?
      why: At home.
    - label: Cooking rice
      bin: We use it at home
      clue: In the kitchen.
      why: At home.
    - label: Washing clothes
      bin: We use it at home
      clue: A daily job in the house.
      why: At home.
    - label: Flooding paddy fields
      bin: Farmers use it
      clue: Rice plants grow standing in water.
      why: On farms.
    - label: Watering vegetable rows
      bin: Farmers use it
      clue: To grow crops.
      why: On farms.
    - label: A fish living in a pond
      bin: Animals and plants use it
      clue: Its home is water.
      why: A living thing.
    - label: A tree taking up water through its roots
      bin: Animals and plants use it
      clue: No one waters a forest.
      why: A living thing.
    - label: An elephant spraying itself
      bin: Animals and plants use it
      clue: Cooling off on a hot day.
      why: An animal.
  items:
  - prompt: Which living things need water?
    options:
    - people, animals and plants
    - only people
    - only plants
    - only animals
    answer: people, animals and plants
    difficulty: 1
    hints:
    - Think of a plant without water.
    - And thirsty animals.
    solution: All living things need water.
    mistakes:
      only people: c5v_think
  - prompt: Which of these is a source of water?
    options:
    - a well
    - a stone
    - a chair
    - a cloud of dust
    answer: a well
    difficulty: 1
    hints:
    - Where do people draw water?
    - A deep hole in the ground.
    solution: Wells hold groundwater.
  - prompt: 'Most water on Earth is:'
    options:
    - salty sea water
    - fresh drinking water
    - in bottles
    - in our taps
    answer: salty sea water
    difficulty: 2
    hints:
    - Think of the oceans.
    - They are huge and salty.
    solution: Most of Earth's water is in salty seas and oceans.
  - prompt: 'Farmers use water mainly to:'
    options:
    - grow crops
    - paint houses
    - make roads
    - fly kites
    answer: grow crops
    difficulty: 1
    hints:
    - Plants need water.
    - Fields.
    solution: Farmers water their fields to grow crops.
  - prompt: Why should drinking water be clean?
    options:
    - dirty water can make us ill
    - clean water tastes sour
    - dirty water is heavier
    - it does not matter
    answer: dirty water can make us ill
    difficulty: 1
    hints:
    - Germs live in dirty water.
    - Stomach upsets.
    solution: Germs in dirty water cause illnesses like diarrhoea.
  - prompt: Which is the main way water reaches rivers and wells?
    options:
    - rain
    - wind
    - sunlight
    - sand
    answer: rain
    difficulty: 1
    hints:
    - Monsoon.
    - Falls from clouds.
    solution: Rain fills rivers, lakes and the ground water in wells.
- code: cbse5v.water.save
  title: Saving and cleaning water
  after:
  - cbse5v.water.uses
  notes: |
    Save water: close taps, fix leaks, use a bucket instead of a hose, reuse water from washing vegetables for plants,
    harvest rainwater from roofs. Make water safe: boil, filter, or use a water purifier; store covered. Do not dump
    waste into rivers and ponds.
  explanations:
    text: Water is precious, so we should not waste it. Turn off the tap while brushing, fix dripping taps and collect rainwater. To make water safe to drink, boil it or filter it and keep it covered.
    visual: 'Draw a roof with a pipe leading rainwater into a big tank. Label it: rainwater harvesting.'
    step_by_step: 'Step 1: Find where water is wasted at home or school. Step 2: Pick one way to save it. Step 3: Make drinking water safe: filter, boil, cover.'
    real_world: Many Indian homes and schools now collect rainwater from rooftops to refill the ground water.
  picture:
    kind: flow
    steps:
    - Rain falls on roof
    - Pipe carries it down
    - Stored in tank or pit
    - Used or soaks into ground
    alt: 'Rainwater harvesting: rain on the roof flows down a pipe into a tank or pit, to be used or to soak into the ground.'
  activity:
    type: sort
    prompt: Does it save water or waste it?
    bins:
    - Saves water
    - Wastes water
    items:
    - label: Turning off the tap while brushing
      bin: Saves water
      clue: Does water run when you don't need it?
      why: Saves water.
    - label: Fixing a dripping tap
      bin: Saves water
      clue: A drip every second adds up.
      why: Saves litres a day.
    - label: Collecting rainwater from the roof
      bin: Saves water
      clue: Water from the sky, kept for later.
      why: Saves.
    - label: Using a bucket for a bath
      bin: Saves water
      clue: A bucket holds a fixed amount.
      why: Uses less than a shower.
    - label: Watering plants with water used to wash vegetables
      bin: Saves water
      clue: Using water twice.
      why: Saves.
    - label: Leaving the tap running
      bin: Wastes water
      clue: Water goes down the drain.
      why: Wastes.
    - label: Washing a car with a running hose
      bin: Wastes water
      clue: Much more than a bucket.
      why: Wastes.
    - label: Letting the water tank overflow
      bin: Wastes water
      clue: Spills onto the ground.
      why: Wastes.
  items:
  - prompt: Which saves water?
    options:
    - turning off the tap while brushing
    - leaving the tap running
    - washing a car with a hose for an hour
    - throwing away clean water
    answer: turning off the tap while brushing
    difficulty: 1
    hints:
    - Which one stops water flowing for nothing?
    - Tap off.
    solution: Turning off the tap saves many litres each day.
    mistakes:
      leaving the tap running: c5v_think
  - prompt: What is rainwater harvesting?
    options:
    - collecting and storing rainwater
    - cutting crops in the rain
    - drying clothes in the rain
    - making rain
    answer: collecting and storing rainwater
    difficulty: 1
    hints:
    - Harvest means collect.
    - Rain + collect.
    solution: It means collecting rainwater to use or to refill the ground.
  - prompt: How can you make water safe to drink at home?
    options:
    - boil it
    - add salt
    - leave it open
    - add sugar
    answer: boil it
    difficulty: 1
    hints:
    - Heat kills germs.
    - Bubbles.
    solution: Boiling kills germs in water.
  - prompt: 'Water used to wash vegetables can be reused to:'
    options:
    - water plants
    - drink
    - cook rice
    - brush teeth
    answer: water plants
    difficulty: 2
    hints:
    - It is not clean enough to drink.
    - Plants don't mind.
    solution: It is safe for plants, so reuse it there.
  - prompt: 'A dripping tap should be:'
    options:
    - fixed quickly
    - left alone
    - opened fully
    - painted
    answer: fixed quickly
    difficulty: 1
    hints:
    - Drops add up.
    - Many litres a day.
    solution: A leaking tap wastes a lot of water, so fix it.
  - prompt: Why should stored drinking water be covered?
    options:
    - to keep dust and insects out
    - to make it colder
    - to make it heavier
    - to change its colour
    answer: to keep dust and insects out
    difficulty: 1
    hints:
    - What could fall in?
    - Mosquitoes, dust.
    solution: Covering keeps dirt and insects out.
