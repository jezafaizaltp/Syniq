# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 1
title: Water—The Essence of Life
tips:
  c5v_think: Think about what you see at home, in school or outside. The answer is often something you have noticed in daily life.
  c5v_reread: 'Read the question again slowly. Look for the key word: what, why, where or how?'
  v5_boil: "Germs die at high heat. What does mother do to milk and water on the stove?"
  v5_clean_water: "Dirty water can carry tiny germs we can't see. What do germs do to us?"
  v5_cover: "A lid does not cool water. What does it stop from falling in?"
  v5_drip: "Drop by drop, a tap can waste buckets of water in a day."
  v5_farm_water: "Think of a field in summer. What do farmers pour water on?"
  v5_harvest: "'Harvesting' means gathering. What do we gather from rooftops in the monsoon?"
  v5_rain: "Wells and rivers fill up in a particular season. What falls from the sky then?"
  v5_reuse: "That water has a little dirt from the vegetables. It is fine for something that grows in soil."
  v5_salty: "Look at a globe: most of it is blue sea. Can we drink sea water?"
  v5_source: "A source is a place we can get water from. Which choice holds water you can draw up?"
  c5v1_need: Think about every living thing around you, not just people. Does any of them live without it?
  c5v1_where: Think about where the water in your home or village comes from before it reaches the tap.
  c5v1_fresh: Most of Earth's water cannot be drunk. Ask whether the choice is safe to drink as it is.
  c5v1_save: 'Ask: does this action use less, or does it let water run away for nothing?'
  c5v1_safe: Germs and dirt can hide in water that looks clear. Which step removes or kills them?
concepts:
- code: cbse5v.water.uses
  title: Why we need water
  notes: |
    All living things need water: people, animals and plants. We use water for drinking, cooking, washing, bathing,
    farming and in factories. Our body is mostly water; we should drink clean water often. Sources: rain, rivers, lakes,
    ponds, wells, tube wells and taps. Only a small part of Earth's water is fresh water we can use.
  explanations:
    text: Every living thing needs water to stay alive. We drink it, cook with it, wash with it, and farmers use it to grow food. Even though Earth looks blue, only a little of its water is fresh water that people can use, so every drop matters.
    visual: Draw a big glass of water. Divide it into one small part labelled 'fresh water we can use' and a huge part labelled 'salty sea water and ice'.
    step_by_step: 'Step 1: List where water comes from near you. Step 2: List what you use it for in one day. Step 3: Think which uses you could reduce.'
    real_world: In summer many towns in India face water shortages; wells dry up and tankers bring water.
  picture:
    kind: compare
    columns:
    - title: Sources
      points:
      - rain
      - rivers, lakes
      - wells, taps
    - title: Uses
      points:
      - drinking, cooking
      - washing, bathing
      - farming, factories
    alt: Water comes from rain, rivers, lakes, wells and taps, and we use it for drinking, cooking, washing, bathing, farming and factories.
  activity:
    type: sort
    prompt: Who is using the water?
    bins:
    - We use it at home
    - Farmers use it
    - Animals and plants use it
    items:
    - label: Brushing your teeth
      bin: We use it at home
      clue: Where do you do this every morning?
      why: At home.
    - label: Cooking rice
      bin: We use it at home
      clue: In the kitchen.
      why: At home.
    - label: Washing clothes
      bin: We use it at home
      clue: A daily job in the house.
      why: At home.
    - label: Flooding paddy fields
      bin: Farmers use it
      clue: Rice plants grow standing in water.
      why: On farms.
    - label: Watering vegetable rows
      bin: Farmers use it
      clue: To grow crops.
      why: On farms.
    - label: A fish living in a pond
      bin: Animals and plants use it
      clue: Its home is water.
      why: A living thing.
    - label: A tree taking up water through its roots
      bin: Animals and plants use it
      clue: No one waters a forest.
      why: A living thing.
    - label: An elephant spraying itself
      bin: Animals and plants use it
      clue: Cooling off on a hot day.
      why: An animal.
  lesson:
    - teach: 'Every living thing needs water: people, animals and plants. Our body is mostly water, and we lose some when we sweat and breathe, so we must drink clean water often.'
      check:
        prompt: Why do we need to drink water every day?
        options:
        - Our body keeps losing water
        - Water makes us taller at once
        - Only to wash food down
        answer: Our body keeps losing water
        why: We lose water through sweat, breath and urine.
      ways:
      - style: visual
        teach: How our body loses water, and how we put it back.
        picture:
          kind: compare
          columns:
          - title: Water goes out
            points:
            - Sweating
            - Breathing out
            - Going to the toilet
          - title: Water comes in
            points:
            - Drinking water
            - Juicy fruits like watermelon
            - Soups and dal
          alt: Our body loses water through sweating, breathing out and going to the toilet. We put it back by drinking water and eating juicy fruits like watermelon, soups and dal.
      - style: real_world
        teach: On a hot day, if you forget to drink water, you may get a headache and feel tired. A potted plant left without water droops in the same way. Every living thing needs water to keep going.
    - teach: We use water for drinking, cooking, bathing, washing, farming and in factories. Farming uses the most water of all.
      picture:
        kind: compare
        columns:
        - title: At home
          points:
          - Drinking
          - Cooking
          - Bathing and washing
        - title: Outside
          points:
          - Farming
          - Factories
          - Animals
        alt: Water is used at home and outside in farms and factories.
      check:
        prompt: Which uses the most water in India?
        options:
        - Farming
        - Brushing teeth
        - Cooking
        answer: Farming
        why: Crops need huge amounts of water.
      ways:
      - style: step_by_step
        teach: 'Follow one day of water at home. Step 1: Morning: water to brush and bathe. Step 2: Breakfast: water to cook and drink. Step 3: Afternoon: water to wash clothes and dishes. Step 4: Evening: water for the plants. Outside the home, even more water goes to farms to grow our food.'
      - style: real_world
        teach: Growing the rice for one family's meals needs a field flooded with water for weeks. That is why farming uses more water than homes or factories.
    - teach: Water comes from rain, rivers, lakes, ponds, wells and tube wells. Most of Earth's water is salty sea water; only a small part is fresh water we can use.
      check:
        prompt: Which water can we not drink as it is?
        options:
        - Sea water
        - Boiled well water
        - Filtered tap water
        answer: Sea water
        why: It is too salty.
      ways:
      - style: visual
        teach: 'Earth''s water: a lot of salty sea water and only a little fresh water.'
        picture:
          kind: bars
          bars:
          - label: Salty sea water
            value: 97
          - label: Fresh water
            value: 3
          alt: If all of Earth's water were 100 buckets, about 97 would be salty sea water and only about 3 would be fresh water.
      - style: real_world
        teach: Rain falls on hills and fields. Some runs into streams and rivers, some fills lakes and ponds, and some soaks into the ground, where wells and tube wells reach it. Almost all the water we use begins as rain.
  items:
  - prompt: Which living things need water?
    options:
    - "people, animals and plants"
    - "people, but not plants or animals"
    - "plants, but not people or animals"
    - "animals, but not people or plants"
    answer: people, animals and plants
    difficulty: 1
    hints:
    - Think of a plant without water.
    - And thirsty animals.
    solution: All living things need water.
    mistakes:
      "people, but not plants or animals": c5v_think
  - prompt: Which of these is a source of water?
    options:
    - a well
    - a stone
    - a chair
    - a cloud of dust
    answer: a well
    difficulty: 1
    hints:
    - Where do people draw water?
    - A deep hole in the ground.
    solution: Wells hold groundwater.
    mistakes: {"a cloud of dust": "v5_source"}
  - prompt: 'Most water on Earth is:'
    options:
    - salty sea water
    - fresh drinking water
    - in bottles
    - in our taps
    answer: salty sea water
    difficulty: 2
    hints:
    - Think of the oceans.
    - They are huge and salty.
    solution: Most of Earth's water is in salty seas and oceans.
    mistakes: {"fresh drinking water": "v5_salty"}
  - prompt: 'Farmers use water mainly to:'
    options:
    - grow crops
    - paint houses
    - make roads
    - fly kites
    answer: grow crops
    difficulty: 1
    hints:
    - Plants need water.
    - Fields.
    solution: Farmers water their fields to grow crops.
    mistakes: {"make roads": "v5_farm_water"}
  - prompt: Why should drinking water be clean?
    options:
    - dirty water can make us ill
    - clean water tastes sour
    - dirty water is heavier
    - it does not matter
    answer: dirty water can make us ill
    difficulty: 1
    hints:
    - Germs live in dirty water.
    - Stomach upsets.
    solution: Germs in dirty water cause illnesses like diarrhoea.
    mistakes: {"it does not matter": "v5_clean_water"}
  - prompt: Which is the main way water reaches rivers and wells?
    options:
    - rain
    - wind
    - sunlight
    - sand
    answer: rain
    difficulty: 1
    hints:
    - Monsoon.
    - Falls from clouds.
    solution: Rain fills rivers, lakes and the ground water in wells.
    mistakes: {"wind": "v5_rain"}
  - prompt: Which of these does NOT need water to live?
    options:
    - A stone
    - A plant
    - A cow
    answer: A stone
    difficulty: 1
    hints:
    - Living things need water.
    - Which one is not alive?
    solution: 'Step 1: plants and cows are alive. Step 2: a stone is not alive, so it does not need water.'
    mistakes:
      A plant: c5v1_need
      A cow: c5v1_need
  - prompt: Which is an underground source of water?
    options:
    - A tube well
    - A lake
    - A river
    answer: A tube well
    difficulty: 2
    hints:
    - Underground means below the soil.
    - Which one is dug deep into the ground?
    solution: 'Step 1: lakes and rivers are on the surface. Step 2: a tube well draws water from under the ground.'
    mistakes:
      A lake: c5v1_where
      A river: c5v1_where
  - prompt: Where does most of Earth's water lie?
    options:
    - In the oceans
    - In wells
    - In clouds
    answer: In the oceans
    difficulty: 1
    hints:
    - Look at a globe.
    - Most of it is coloured blue.
    solution: 'Step 1: most of Earth''s surface is ocean. Step 2: so most water is in the oceans, and it is salty.'
    mistakes:
      In wells: c5v1_fresh
      In clouds: c5v1_fresh
  - prompt: Which of these is NOT a use of water at home?
    options:
    - "Running a car engine on it"
    - "Cooking rice and dal for lunch"
    - "Bathing and washing our hands"
    answer: Running a car engine on it
    difficulty: 2
    hints:
    - Think of what happens at home every day.
    - Which one is not true?
    solution: 'Step 1: we cook and bathe with water. Step 2: cars do not run on water.'
    mistakes:
      "Cooking rice and dal for lunch": c5v1_need
      "Bathing and washing our hands": c5v1_need
  - prompt: What happens to plants without water?
    options:
    - They wilt and dry up
    - They grow faster
    - They turn blue
    answer: They wilt and dry up
    difficulty: 1
    hints:
    - Think of a pot plant left without water.
    - What do the leaves look like?
    solution: 'Step 1: plants need water to stay firm. Step 2: without it they droop and dry.'
    mistakes:
      They grow faster: c5v1_need
      They turn blue: c5v1_need
  - prompt: 'Rain fills rivers, lakes and wells. So the main starting source of our water is:'
    options:
    - Rain
    - Taps
    - Bottles
    answer: Rain
    difficulty: 2
    hints:
    - Taps and bottles get water from somewhere else.
    - What falls from the sky?
    solution: 'Step 1: taps and bottles are filled from rivers and wells. Step 2: those are filled by rain.'
    mistakes:
      Taps: c5v1_where
      Bottles: c5v1_where
  - prompt: Why do we feel thirsty after playing in the sun?
    options:
    - We lose water by sweating
    - The sun fills us with water
    - We ate too much
    answer: We lose water by sweating
    difficulty: 2
    hints:
    - What comes out of your skin when you are hot?
    - That is water leaving your body.
    solution: 'Step 1: we sweat when hot. Step 2: we lose water, so we feel thirsty.'
    mistakes:
      The sun fills us with water: c5v1_need
      We ate too much: c5v1_need
  - prompt: Only a small part of Earth's water is fresh. Why should we use it carefully?
    options:
    - There is not much of it
    - It is very salty
    - It never runs out
    answer: There is not much of it
    difficulty: 3
    hints:
    - Most water is in the salty seas.
    - What happens when something is scarce?
    solution: 'Step 1: fresh water is only a small part. Step 2: so it must not be wasted.'
    mistakes:
      It is very salty: c5v1_fresh
      It never runs out: c5v1_fresh
  - prompt: Which animal can live without drinking for many days because it stores water?
    options:
    - Camel
    - Fish
    - Frog
    answer: Camel
    difficulty: 3
    hints:
    - It lives in the desert.
    - Deserts have very little water.
    solution: 'Step 1: desert animals must survive with little water. Step 2: the camel can go many days without drinking.'
    mistakes:
      Fish: c5v1_need
      Frog: c5v1_need
  - prompt: 'Case: A family has a well, a pond and the sea near their home. They need water for drinking. Which source should they NOT drink from, even after filtering at home?'
    options:
    - The sea
    - The well, after boiling
    - The pond, after boiling and filtering
    answer: The sea
    hints:
    - Which of the three has salty water?
    - Can home filtering take away salt?
    solution: Sea water is salty and cannot be made fit to drink by boiling or a home filter. Well or pond water can be made safe by boiling and filtering.
    mistakes:
      The well, after boiling: c5v1_fresh
      The pond, after boiling and filtering: c5v1_fresh
    exam: case
    difficulty: 2
  - prompt: 'Situation: A child played football for an hour in the sun and now feels tired and dizzy. What should the child do first?'
    options:
    - "Rest in the shade and drink clean water"
    - "Keep playing in the sun to warm up more"
    - "Eat a big packet of salty chips at once"
    answer: Rest in the shade and drink clean water
    hints:
    - What did the body lose while playing in the sun?
    - How do we put it back?
    solution: The child lost water by sweating. Resting in the shade and drinking clean water helps the body recover.
    mistakes:
      "Keep playing in the sun to warm up more": c5v1_need
      "Eat a big packet of salty chips at once": c5v1_need
    exam: competency
    difficulty: 2
- code: cbse5v.water.save
  title: Saving and cleaning water
  after:
  - cbse5v.water.uses
  notes: |
    Save water: close taps, fix leaks, use a bucket instead of a hose, reuse water from washing vegetables for plants,
    harvest rainwater from roofs. Make water safe: boil, filter, or use a water purifier; store covered. Do not dump
    waste into rivers and ponds.
  explanations:
    text: Water is precious, so we should not waste it. Turn off the tap while brushing, fix dripping taps and collect rainwater. To make water safe to drink, boil it or filter it and keep it covered.
    visual: 'Draw a roof with a pipe leading rainwater into a big tank. Label it: rainwater harvesting.'
    step_by_step: 'Step 1: Find where water is wasted at home or school. Step 2: Pick one way to save it. Step 3: Make drinking water safe: filter, boil, cover.'
    real_world: Many Indian homes and schools now collect rainwater from rooftops to refill the ground water.
  picture:
    kind: flow
    steps:
    - Rain falls on roof
    - Pipe carries it down
    - Stored in tank or pit
    - Used or soaks into ground
    alt: 'Rainwater harvesting: rain on the roof flows down a pipe into a tank or pit, to be used or to soak into the ground.'
  activity:
    type: sort
    prompt: Does it save water or waste it?
    bins:
    - Saves water
    - Wastes water
    items:
    - label: Turning off the tap while brushing
      bin: Saves water
      clue: Does water run when you don't need it?
      why: Saves water.
    - label: Fixing a dripping tap
      bin: Saves water
      clue: A drip every second adds up.
      why: Saves litres a day.
    - label: Collecting rainwater from the roof
      bin: Saves water
      clue: Water from the sky, kept for later.
      why: Saves.
    - label: Using a bucket for a bath
      bin: Saves water
      clue: A bucket holds a fixed amount.
      why: Uses less than a shower.
    - label: Watering plants with water used to wash vegetables
      bin: Saves water
      clue: Using water twice.
      why: Saves.
    - label: Leaving the tap running
      bin: Wastes water
      clue: Water goes down the drain.
      why: Wastes.
    - label: Washing a car with a running hose
      bin: Wastes water
      clue: Much more than a bucket.
      why: Wastes.
    - label: Letting the water tank overflow
      bin: Wastes water
      clue: Spills onto the ground.
      why: Wastes.
  lesson:
    - teach: 'Fresh water is precious, so we save it: close taps while brushing, fix dripping taps, use a bucket instead of a running hose, and reuse water from washing vegetables to water plants.'
      check:
        prompt: Which saves more water when washing a car?
        options:
        - A bucket and cloth
        - A hose left running
        - Washing it twice
        answer: A bucket and cloth
        why: A running hose wastes a lot of water.
      ways:
      - style: visual
        teach: Habits that waste water, and habits that save it.
        picture:
          kind: compare
          columns:
          - title: Wastes water
            points:
            - Tap left running while brushing
            - A long shower
            - Washing a car with a hose
          - title: Saves water
            points:
            - Tap closed while brushing
            - A bucket bath
            - Washing a car with a bucket and cloth
          alt: A tap left running while brushing, a long shower and washing a car with a hose waste water. Closing the tap while brushing, a bucket bath and washing a car with a bucket and cloth save it.
      - style: real_world
        teach: A tap left running while you brush can waste several litres in two minutes. Closing it while you brush, and opening it only to rinse, saves that water every single day.
    - teach: Rainwater harvesting collects rain from roofs and stores it in tanks or lets it soak into the ground to fill wells. Kerala has many such tanks.
      picture:
        kind: flow
        steps:
        - Rain falls on roof
        - Pipes carry it down
        - Filter removes dirt
        - Tank or well stores it
        alt: Rainwater flows from the roof through pipes and a filter into a tank.
      check:
        prompt: Where is rainwater usually collected from in a house?
        options:
        - The roof
        - The kitchen sink
        - The fridge
        answer: The roof
        why: Rain lands on the roof and flows through pipes.
      ways:
      - style: step_by_step
        teach: 'How rainwater harvesting works. Step 1: Rain falls on the roof. Step 2: Gutters and pipes carry it down. Step 3: A filter removes leaves and dirt. Step 4: The water is stored in a tank, or sent into a pit so it soaks into the ground and fills the well.'
      - style: real_world
        teach: Many houses in Kerala have pipes that lead rain from the roof into a tank or a recharge pit near the well. In summer, when the well would normally run low, it still has water.
    - teach: Water that looks clear can still have germs. Make it safe by boiling, filtering or using a purifier, and keep it covered. Never throw waste into rivers and ponds.
      check:
        prompt: Why do we boil drinking water?
        options:
        - To kill germs
        - To make it salty
        - To change its colour
        answer: To kill germs
        why: Heat kills most germs.
      ways:
      - style: visual
        teach: Three ways to make water safe to drink at home.
        picture:
          kind: compare
          columns:
          - title: Boiling
            points:
            - Heat kills germs
          - title: Filtering
            points:
            - Removes dirt and some germs
          - title: Purifier
            points:
            - A machine that cleans water
          alt: Boiling kills germs with heat, filtering removes dirt and some germs, and a purifier is a machine that cleans water.
      - style: real_world
        teach: A glass of water can look perfectly clear and still carry germs that cause illness, such as diarrhoea. That is why many families boil drinking water and keep it in a covered pot.
  items:
  - prompt: Which saves water?
    options:
    - turning off the tap while brushing
    - leaving the tap running
    - washing a car with a hose for an hour
    - throwing away clean water
    answer: turning off the tap while brushing
    difficulty: 1
    hints:
    - Which one stops water flowing for nothing?
    - Tap off.
    solution: Turning off the tap saves many litres each day.
    mistakes:
      leaving the tap running: c5v_think
  - prompt: What is rainwater harvesting?
    options:
    - collecting and storing rainwater
    - cutting crops in the rain
    - drying clothes in the rain
    - making rain
    answer: collecting and storing rainwater
    difficulty: 1
    hints:
    - Harvest means collect.
    - Rain + collect.
    solution: It means collecting rainwater to use or to refill the ground.
    mistakes: {"making rain": "v5_harvest"}
  - prompt: How can you make water safe to drink at home?
    options:
    - boil it
    - add salt
    - leave it open
    - add sugar
    answer: boil it
    difficulty: 1
    hints:
    - Heat kills germs.
    - Bubbles.
    solution: Boiling kills germs in water.
    mistakes: {"add salt": "v5_boil"}
  - prompt: 'Water used to wash vegetables can be reused to:'
    options:
    - water plants
    - drink
    - cook rice
    - brush teeth
    answer: water plants
    difficulty: 2
    hints:
    - It is not clean enough to drink.
    - Plants don't mind.
    solution: It is safe for plants, so reuse it there.
    mistakes: {"drink": "v5_reuse"}
  - prompt: 'A dripping tap should be:'
    options:
    - fixed quickly
    - left alone
    - opened fully
    - painted
    answer: fixed quickly
    difficulty: 1
    hints:
    - Drops add up.
    - Many litres a day.
    solution: A leaking tap wastes a lot of water, so fix it.
    mistakes: {"left alone": "v5_drip"}
  - prompt: Why should stored drinking water be covered?
    options:
    - "to keep dust and insects out"
    - "to make the water much colder"
    - "to make the water heavier"
    - "to change the water's colour"
    answer: to keep dust and insects out
    difficulty: 1
    hints:
    - What could fall in?
    - Mosquitoes, dust.
    solution: Covering keeps dirt and insects out.
    mistakes: {"to make the water much colder": "v5_cover"}
  - prompt: Which habit wastes water?
    options:
    - "Leaving the tap running while soaping hands"
    - "Using a bucket and mug for bathing"
    - "Fixing leaking taps and pipes quickly"
    answer: Leaving the tap running while soaping hands
    difficulty: 1
    hints:
    - Which one lets water run for nothing?
    - While soaping, you do not need water.
    solution: 'Step 1: water runs away while you soap. Step 2: that is waste.'
    mistakes:
      "Using a bucket and mug for bathing": c5v1_save
      "Fixing leaking taps and pipes quickly": c5v1_save
  - prompt: 'Water used to wash rice can be used to:'
    options:
    - Water the garden
    - Drink
    - Make tea
    answer: Water the garden
    difficulty: 1
    hints:
    - It is not clean enough to drink.
    - Plants are not fussy.
    solution: 'Step 1: rice water is not for drinking. Step 2: it is good for plants.'
    mistakes:
      Drink: c5v1_safe
      Make tea: c5v1_safe
  - prompt: 'Rainwater soaking into the ground helps by:'
    options:
    - Filling up wells
    - Making the soil salty
    - Drying the land
    answer: Filling up wells
    difficulty: 2
    hints:
    - Wells take water from under the ground.
    - Where does that underground water come from?
    solution: 'Step 1: rain soaks down. Step 2: it refills the water under the ground that wells use.'
    mistakes:
      Making the soil salty: c5v1_save
      Drying the land: c5v1_save
  - prompt: Which of these makes water safe to drink?
    options:
    - A water filter
    - Adding sugar
    - Keeping it in sunlight in an open pot
    answer: A water filter
    difficulty: 1
    hints:
    - Which removes dirt and germs?
    - Open pots let dust in.
    solution: 'Step 1: a filter removes dirt and many germs. Step 2: so it makes water safer.'
    mistakes:
      Adding sugar: c5v1_safe
      Keeping it in sunlight in an open pot: c5v1_safe
  - prompt: A tap drips 1 cup of water every hour. How many cups are wasted in a day?
    answer: '24'
    check: '24'
    difficulty: 2
    hints:
    - How many hours are in one day?
    - 1 cup each hour.
    solution: 'Step 1: 24 hours. Step 2: 24 cups wasted.'
    mistakes:
      '12': c5v1_save
      '60': c5v1_save
  - prompt: Why should we not wash clothes in a pond used for drinking?
    options:
    - "Soap and dirt make the water unsafe"
    - "The pond will grow bigger and bigger"
    - "Fish living there enjoy eating soap"
    answer: Soap and dirt make the water unsafe
