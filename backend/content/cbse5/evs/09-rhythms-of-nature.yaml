# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 9
title: Rhythms of Nature
tips:
  v5_24h: "A year is one trip around the Sun. One spin is one day and one night."
  v5_east: "The Sun sets in the west. Where does it come up in the morning?"
  v5_hottest: "The monsoon brings cool rain. It comes after the hottest months."
  v5_mango: "Mangoes ripen in the hottest months, during the long school holidays."
  v5_migrate: "Their homes far north freeze in winter. India is warmer."
  v5_moon_month: "The word 'month' comes from 'moon'."
  v5_new_moon: "On a full moon the whole Moon shines. The dark night when the cycle starts again has a different name."
  v5_noon: "Shadows are longest when the Sun is low. When is the Sun highest?"
  v5_pongal: "Pongal is in Tamil Nadu in January, when new rice is cooked."
  v5_rice: "Some grains grow standing in flooded fields. When are fields full of water?"
  v5_spin: "The Earth turns like a top. The side facing the Sun has day."
  v5_wheat: "Wheat likes cool weather. It is harvested in spring."
  c5v9_spin: Remember the Earth turns like a top. Half faces the Sun at any time.
  c5v9_sky: Think about where the Sun is in the sky in the morning, at midday and in the evening.
  c5v9_shadow: A shadow is longest when the light is low, and shortest when the light is high overhead.
  c5v9_moon: The Moon's lit part grows and shrinks over about four weeks.
  c5v9_season: 'Match the event with the time of year: hot months, rainy months, or cool months.'
  c5v9_crop: One crop needs lots of rain to grow, the other grows in the cool, dry months.

concepts:
- code: cbse5v.rhythm.daynight
  title: Day, night and the Moon
  notes: |
    The Earth spins (rotates) once in about 24 hours, giving day and night: the side facing the Sun has day. The Sun
    seems to rise in the East and set in the West. Shadows are long in the morning and evening, short at noon. The Moon
    seems to change shape (phases) over about a month: new moon to full moon and back.
  explanations:
    text: The Earth spins like a top. When your side faces the Sun, it is day; when it turns away, it is night. One spin takes about 24 hours. The Moon looks different through the month because we see different amounts of its lit side.
    visual: 'Shine a torch (Sun) on a ball (Earth). Mark your town with a sticker. Turn the ball slowly: the sticker goes from light (day) to dark (night).'
    step_by_step: 'Step 1: Find where the Sun is. Step 2: The side facing it has day. Step 3: Turn: the side moves into night.'
    real_world: 'Festivals follow the Moon: Diwali comes on a new-moon night, and many festivals fall on full-moon days.'
  picture:
    kind: flow
    steps:
    - 'Morning: Sun in the East, long shadow'
    - 'Noon: Sun high, short shadow'
    - 'Evening: Sun in the West, long shadow'
    - 'Night: our side faces away'
    alt: Through the day the Sun rises in the East with long shadows, is high at noon with short shadows, sets in the West, and then it is night.
  activity:
    type: sort
    prompt: Why does it happen?
    bins:
    - The Earth spins
    - The Moon goes round the Earth
    items:
    - label: Day and night
      bin: The Earth spins
      clue: Your side faces the Sun, then turns away.
      why: One spin, about 24 hours.
    - label: The Sun seems to rise in the east
      bin: The Earth spins
      clue: We turn towards the Sun.
      why: Because of the spin.
    - label: Your shadow moves during the day
      bin: The Earth spins
      clue: The Sun seems to cross the sky.
      why: Because of the spin.
    - label: The Moon looks like a different shape each night
      bin: The Moon goes round the Earth
      clue: We see more or less of its lit side.
      why: Its journey round us.
    - label: A full moon about once a month
      bin: The Moon goes round the Earth
      clue: One trip takes about a month.
      why: Its journey round us.
    - label: A dark night with no moon
      bin: The Moon goes round the Earth
      clue: Its lit side faces away.
      why: New moon.
  lesson:
    - teach: The Earth spins like a top, once in about 24 hours. The side facing the Sun has day; the side away from the Sun has night. As the Earth turns, places move from day into night and back.
      picture:
        kind: compare
        columns:
        - title: Facing the Sun
          points:
          - Day
          - Light and warm
        - title: Away from the Sun
          points:
          - Night
          - Dark and cooler
        alt: The half of the Earth facing the Sun has day; the other half has night.
      check:
        prompt: 'When it is day in India, the other side of the Earth has:'
        options:
        - Night
        - Day too
        - Noon everywhere
        answer: Night
        why: That side faces away from the Sun.
    - teach: Because the Earth spins, the Sun seems to rise in the East, climb high at midday, and set in the West. Shadows are long in the morning and evening, and shortest at noon when the Sun is high.
      check:
        prompt: When is a tree's shadow longest?
        options:
        - Early morning
        - At noon
        - It is always the same
        answer: Early morning
        why: The Sun is low, so the shadow stretches far.
    - teach: The Moon seems to change shape over about a month. From new moon (dark) it grows to full moon (round and bright), then shrinks back. These shapes are called phases.
      check:
        prompt: 'A full moon looks:'
        options:
        - Completely round and bright
        - Dark
        - Like a thin line
        answer: Completely round and bright
        why: We see the whole lit face.
  items:
  - prompt: 'Day and night happen because the Earth:'
    options:
    - spins
    - stops moving
    - is flat
    - moves closer to the Moon
    answer: spins
    difficulty: 1
    hints:
    - Like a top.
    - Once a day.
    solution: The spinning Earth gives day and night.
    mistakes: {"stops moving": "v5_spin"}
  - prompt: How long does the Earth take to spin once?
    options:
    - about 24 hours
    - about 1 hour
    - a year
    - a week
    answer: about 24 hours
    difficulty: 1
    hints:
    - One day and one night.
    - A full day.
    solution: One spin takes about 24 hours.
    mistakes: {"a year": "v5_24h"}
  - prompt: Where does the Sun seem to rise?
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - Morning.
    - Opposite of sunset.
    solution: The Sun seems to rise in the East.
    mistakes: {"West": "v5_east"}
  - prompt: When is your shadow shortest?
    options:
    - at noon
    - in the early morning
    - in the evening
    - at sunset
    answer: at noon
    difficulty: 2
    hints:
    - When is the Sun highest?
    - Overhead.
    solution: The Sun is highest at noon, so shadows are shortest.
    mistakes: {"in the early morning": "v5_noon"}
  - prompt: About how long does the Moon take to go from one full moon to the next?
    options:
    - about a month
    - a day
    - a year
    - an hour
    answer: about a month
    difficulty: 2
    hints:
    - The word 'month' comes from Moon.
    - About 30 days.
    solution: Moon phases repeat about every month.
    mistakes: {"a day": "v5_moon_month"}
  - prompt: 'The night with no Moon visible is called:'
    options:
    - new moon
    - full moon
    - half moon
    - blue moon
    answer: new moon
    difficulty: 2
    hints:
    - The Moon is hidden.
    - Diwali night.
    solution: On a new moon night we cannot see the Moon.
    mistakes: {"full moon": "v5_new_moon"}
  - prompt: About how many hours does the Earth take to spin once?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - One spin makes one day and one night.
    - How many hours are on a 24-hour clock?
    solution: 'Step 1: one spin = one day and night. Step 2: about 24 hours.'
    mistakes:
      '12': c5v9_spin
      '365': c5v9_spin
      '30': c5v9_spin
  - prompt: Where does the Sun seem to set?
    options:
    - West
    - East
    - North
    answer: West
    difficulty: 1
    hints:
    - It rises on one side.
    - It sets on the opposite side.
    solution: 'Step 1: it rises in the East. Step 2: it sets in the West.'
    mistakes:
      East: c5v9_sky
      North: c5v9_sky
  - prompt: Why does the Sun seem to move across the sky?
    options:
    - The Earth is spinning
    - The Sun walks
    - Clouds push it
    answer: The Earth is spinning
    difficulty: 2
    hints:
    - We are moving, not the Sun.
    - Like trees seem to move past a train window.
    solution: 'Step 1: the Earth turns. Step 2: so the Sun seems to move.'
    mistakes:
      The Sun walks: c5v9_spin
      Clouds push it: c5v9_spin
  - prompt: Your shadow is short and right under your feet. What time is it likely to be?
    options:
    - About noon
    - Early morning
    - Sunset
    answer: About noon
    difficulty: 2
    hints:
    - Short shadows mean the Sun is high.
    - When is the Sun highest?
    solution: 'Step 1: the Sun is overhead. Step 2: that is around noon.'
    mistakes:
      Early morning: c5v9_shadow
      Sunset: c5v9_shadow
  - prompt: 'In the evening, your shadow points towards the:'
    options:
    - East
    - West
    - Sun
    answer: East
    difficulty: 3
    hints:
    - In the evening the Sun is in the West.
    - Shadows fall away from the light.
    solution: 'Step 1: the Sun is in the West. Step 2: the shadow points the other way, East.'
    mistakes:
      West: c5v9_shadow
      Sun: c5v9_shadow
  - prompt: Which phase comes about two weeks after a new moon?
    options:
    - Full moon
    - New moon again
    - No moon for a year
    answer: Full moon
    difficulty: 2
    hints:
    - The Moon grows for about two weeks.
    - Then it is fully lit.
    solution: 'Step 1: about 2 weeks of growing. Step 2: it reaches full moon.'
    mistakes:
      New moon again: c5v9_moon
      No moon for a year: c5v9_moon
  - prompt: 'The Moon shines because it:'
    options:
    - Reflects the Sun's light
    - Makes its own light
    - Is on fire
    answer: Reflects the Sun's light
    difficulty: 2
    hints:
    - The Moon is a rocky ball.
    - It works like a mirror.
    solution: 'Step 1: the Moon has no light of its own. Step 2: it reflects sunlight.'
    mistakes:
      Makes its own light: c5v9_moon
      Is on fire: c5v9_moon
  - prompt: Many festivals like Diwali are on a new moon night. Why are lamps lit then?
    options:
    - The night is very dark without the Moon
    - The Moon is too bright
    - It is daytime
    answer: The night is very dark without the Moon
    difficulty: 3
    hints:
    - New moon means the Moon is not seen.
    - What does the sky look like then?
    solution: 'Step 1: no moonlight on a new moon. Step 2: lamps light up the dark night.'
    mistakes:
      The Moon is too bright: c5v9_moon
      It is daytime: c5v9_moon
  - prompt: If the Earth stopped spinning, what would happen to day and night?
    options:
    - One side would always have day, the other always night
    - Nothing would change
    - Days would be shorter
    answer: One side would always have day, the other always night
    difficulty: 3
    hints:
    - Day and night come from spinning.
    - Without spinning, the same side faces the Sun.
    solution: 'Step 1: spinning brings day and night. Step 2: without it, one side stays lit.'
    mistakes:
      Nothing would change: c5v9_spin
      Days would be shorter: c5v9_spin
- code: cbse5v.rhythm.seasons
  title: Seasons and nature's calendar
  after:
  - cbse5v.rhythm.daynight
  notes: |
    The year has seasons: summer (hot), monsoon (rainy), winter (cool), and in some places spring and autumn. Plants and
    animals follow them: trees shed leaves, flowers bloom, birds migrate (Siberian cranes come to India in winter),
    farmers sow kharif crops (rice) in the monsoon and rabi crops (wheat) in winter. Harvest festivals: Onam, Pongal,
    Baisakhi, Bihu.
  explanations:
    text: 'Nature has a yearly rhythm. Summer is hot, the monsoon brings rain, and winter is cool. Trees, birds and farmers follow these seasons: birds fly in from far lands, trees flower, and farmers sow and harvest at the right time.'
    visual: 'Draw a circle split into three: summer (sun), monsoon (rain clouds and rice fields), winter (fog and wheat fields with birds flying in).'
    step_by_step: 'Step 1: Name the season. Step 2: What is the weather like? Step 3: What do plants, animals and farmers do then?'
    real_world: Harvest festivals like Onam, Pongal, Baisakhi and Bihu celebrate the end of a crop season.
  picture:
    kind: compare
    columns:
    - title: Monsoon
      points:
      - rain
      - rice sown (kharif)
    - title: Winter
      points:
      - cool
      - wheat sown (rabi)
      - birds arrive
    - title: Summer
      points:
      - hot
      - mangoes ripen
    alt: In the monsoon it rains and rice is sown; in winter it is cool, wheat is sown and birds arrive; in summer it is hot and mangoes ripen.
  activity:
    type: sort
    prompt: Which season is it?
    bins:
    - Summer
    - Monsoon
    - Winter
    items:
    - label: Mangoes ripen
      bin: Summer
      clue: Hot days in April and May.
      why: Summer fruit.
    - label: A hot, dry wind called loo
      bin: Summer
      clue: North India, very hot.
      why: Summer.
    - label: Farmers sow paddy
      bin: Monsoon
      clue: The fields fill with rainwater.
      why: The monsoon.
    - label: Frogs croaking in puddles
      bin: Monsoon
      clue: Lots of rain.
      why: The monsoon.
    - label: Foggy mornings
      bin: Winter
      clue: Cold air near the ground.
      why: Winter.
    - label: Birds arriving from far colder lands
      bin: Winter
      clue: They escape the snow up north.
      why: Winter.
    - label: Wearing sweaters to school
      bin: Winter
      clue: It's cold.
      why: Winter.
  lesson:
    - teach: 'The year has seasons. In most of India: summer (hot, March to May), monsoon (rainy, June to September) and winter (cool, December to February). Some places also have spring and autumn.'
      picture:
        kind: flow
        steps:
        - 'Summer: Mar–May'
        - 'Monsoon: Jun–Sep'
        - 'Autumn: Oct–Nov'
        - 'Winter: Dec–Feb'
        alt: The seasons of the year in India in order.
      check:
        prompt: Which months bring the monsoon rain?
        options:
        - June to September
        - December to February
        - March to May
        answer: June to September
        why: The rainy winds arrive in June.
    - teach: Plants and animals follow the seasons. Mangoes ripen in summer, many trees shed leaves before spring, and some birds, like Siberian cranes, fly to India in winter to escape the cold back home. This is migration.
      check:
        prompt: 'Birds flying to a warmer place for winter is called:'
        options:
        - Migration
        - Hibernation
        - Pollination
        answer: Migration
        why: Migration is moving with the seasons.
    - teach: 'Farmers follow the seasons too. Kharif crops like rice are sown in the monsoon because they need lots of water. Rabi crops like wheat are sown in winter. Harvest festivals: Onam (Kerala), Pongal (Tamil Nadu), Baisakhi (Punjab), Bihu (Assam).'
      check:
        prompt: Why is rice sown in the monsoon?
        options:
        - It needs a lot of water
        - It likes snow
        - It grows in the dark
        answer: It needs a lot of water
        why: Rice fields are often flooded.
  items:
  - prompt: Which crop is sown in the monsoon?
    options:
    - rice
    - wheat
    - mustard
    - peas
    answer: rice
    difficulty: 2
    hints:
    - Needs lots of water.
    - Kharif crop.
    solution: Rice is a kharif crop sown in the rains.
    mistakes: {"wheat": "v5_rice"}
  - prompt: Why do some birds come to India in winter?
    options:
    - to escape the cold in their homes
    - to see the Taj Mahal
    - because they are lost
    - for the monsoon
    answer: to escape the cold in their homes
    difficulty: 2
    hints:
    - Their lands freeze.
    - Migration.
    solution: Migratory birds escape freezing winters far away.
    mistakes: {"to see the Taj Mahal": "v5_migrate"}
  - prompt: 'Mangoes ripen in:'
    options:
    - summer
    - winter
    - monsoon
    - every week
    answer: summer
    difficulty: 1
    hints:
    - Hot months.
    - April-May.
    solution: Mangoes ripen in summer.
    mistakes: {"winter": "v5_mango"}
  - prompt: 'Pongal is a festival of:'
    options:
    - harvest
    - rain dances only
    - snow
    - the new moon
    answer: harvest
    difficulty: 1
    hints:
    - Tamil Nadu.
    - New rice.
    solution: Pongal celebrates the harvest.
    mistakes: {"snow": "v5_pongal"}
  - prompt: Which season is hottest in most of India?
    options:
    - summer
    - winter
    - monsoon
    - all are the same
    answer: summer
    difficulty: 1
    hints:
    - April to June.
    - Hot sun.
    solution: Summer is the hottest season.
    mistakes: {"monsoon": "v5_hottest"}
  - prompt: 'Wheat is mainly sown in:'
    options:
    - winter
    - summer
    - monsoon
    - never
    answer: winter
    difficulty: 2
    hints:
    - Rabi crop.
    - Cool months.
    solution: Wheat is a rabi crop sown in winter.
    mistakes: {"monsoon": "v5_wheat"}
  - prompt: Which season is coolest in most of India?
    options:
    - Winter
    - Summer
    - Monsoon
    answer: Winter
    difficulty: 1
    hints:
    - It comes in December and January.
    - People wear sweaters in the north.
    solution: 'Step 1: December–February is cool. Step 2: that is winter.'
    mistakes:
      Summer: c5v9_season
      Monsoon: c5v9_season
  - prompt: 'Baisakhi is a harvest festival of:'
    options:
    - Punjab
    - Kerala
    - Assam
    answer: Punjab
    difficulty: 2
    hints:
    - Farmers celebrate the wheat harvest.
    - People dance Bhangra.
    solution: 'Step 1: Baisakhi celebrates wheat harvest. Step 2: it is from Punjab.'
    mistakes:
      Kerala: c5v9_season
      Assam: c5v9_season
  - prompt: Onam is celebrated in Kerala around which time of year?
    options:
    - August–September, after the main rains
    - December snow
    - Peak of summer in April
    answer: August–September, after the main rains
    difficulty: 2
    hints:
    - It is a harvest festival.
    - It comes near the end of the monsoon.
    solution: 'Step 1: Onam is in the Malayalam month of Chingam. Step 2: that is August–September.'
    mistakes:
      December snow: c5v9_season
      Peak of summer in April: c5v9_season
  - prompt: Which crop is sown in winter?
    options:
    - Wheat
    - Rice
    - Jute
    answer: Wheat
    difficulty: 2
    hints:
    - It does not need flooded fields.
    - It is a rabi crop.
    solution: 'Step 1: rabi crops are sown in winter. Step 2: wheat is a rabi crop.'
    mistakes:
      Rice: c5v9_crop
      Jute: c5v9_crop
  - prompt: 'Siberian cranes come to India in:'
    options:
    - Winter
    - Summer
    - Monsoon
    answer: Winter
    difficulty: 2
    hints:
    - Siberia becomes freezing.
    - They escape the cold.
    solution: 'Step 1: Siberia is very cold in winter. Step 2: the cranes fly to India then.'
    mistakes:
      Summer: c5v9_season
      Monsoon: c5v9_season
  - prompt: Why do many trees shed leaves before the hot season?
    options:
    - To save water
    - To grow taller
    - Because birds pull them off
    answer: To save water
    difficulty: 3
    hints:
    - Leaves lose water into the air.
    - Fewer leaves means less water lost.
    solution: 'Step 1: leaves give off water. Step 2: shedding them saves water in dry times.'
    mistakes:
      To grow taller: c5v9_season
      Because birds pull them off: c5v9_season
  - prompt: In which season would you most need an umbrella in Kerala?
    options:
    - Monsoon
    - Winter
    - Summer
    answer: Monsoon
    difficulty: 1
    hints:
    - Umbrellas keep off rain.
    - When does it rain most?
    solution: 'Step 1: the most rain falls June–September. Step 2: monsoon.'
    mistakes:
      Winter: c5v9_season
      Summer: c5v9_season
  - prompt: A farmer in Punjab sows wheat in November. When will he harvest it?
    options:
    - Around April
    - The next day
    - In 5 years
    answer: Around April
    difficulty: 3
    hints:
    - Wheat grows through winter.
    - Baisakhi in April celebrates the harvest.
    solution: 'Step 1: wheat grows for about 5 months. Step 2: harvest comes around April.'
    mistakes:
      The next day: c5v9_crop
      In 5 years: c5v9_crop
  - prompt: Why do harvest festivals happen at different times in different states?
    options:
    - Crops ripen at different times in different places
    - Each state has a different calendar for the Sun
    - They are random
    answer: Crops ripen at different times in different places
    difficulty: 3
    hints:
    - Festivals celebrate the harvest.
    - Weather and crops differ across India.
    solution: 'Step 1: each place grows different crops. Step 2: they ripen at different times.'
    mistakes:
      Each state has a different calendar for the Sun: c5v9_crop
      They are random: c5v9_crop
