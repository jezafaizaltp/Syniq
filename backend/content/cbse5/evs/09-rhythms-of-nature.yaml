# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 9
title: Rhythms of Nature
tips:
  v5_24h: "A year is one trip around the Sun. One spin is one day and one night."
  v5_east: "The Sun sets in the west. Where does it come up in the morning?"
  v5_hottest: "The monsoon brings cool rain. It comes after the hottest months."
  v5_mango: "Mangoes ripen in the hottest months, during the long school holidays."
  v5_migrate: "Their homes far north freeze in winter. India is warmer."
  v5_moon_month: "The word 'month' comes from 'moon'."
  v5_new_moon: "On a full moon the whole Moon shines. The dark night when the cycle starts again has a different name."
  v5_noon: "Shadows are longest when the Sun is low. When is the Sun highest?"
  v5_pongal: "Pongal is in Tamil Nadu in January, when new rice is cooked."
  v5_rice: "Some grains grow standing in flooded fields. When are fields full of water?"
  v5_spin: "The Earth turns like a top. The side facing the Sun has day."
  v5_wheat: "Wheat likes cool weather. It is harvested in spring."

concepts:
- code: cbse5v.rhythm.daynight
  title: Day, night and the Moon
  notes: |
    The Earth spins (rotates) once in about 24 hours, giving day and night: the side facing the Sun has day. The Sun
    seems to rise in the East and set in the West. Shadows are long in the morning and evening, short at noon. The Moon
    seems to change shape (phases) over about a month: new moon to full moon and back.
  explanations:
    text: The Earth spins like a top. When your side faces the Sun, it is day; when it turns away, it is night. One spin takes about 24 hours. The Moon looks different through the month because we see different amounts of its lit side.
    visual: 'Shine a torch (Sun) on a ball (Earth). Mark your town with a sticker. Turn the ball slowly: the sticker goes from light (day) to dark (night).'
    step_by_step: 'Step 1: Find where the Sun is. Step 2: The side facing it has day. Step 3: Turn: the side moves into night.'
    real_world: 'Festivals follow the Moon: Diwali comes on a new-moon night, and many festivals fall on full-moon days.'
  picture:
    kind: flow
    steps:
    - 'Morning: Sun in the East, long shadow'
    - 'Noon: Sun high, short shadow'
    - 'Evening: Sun in the West, long shadow'
    - 'Night: our side faces away'
    alt: Through the day the Sun rises in the East with long shadows, is high at noon with short shadows, sets in the West, and then it is night.
  activity:
    type: sort
    prompt: Why does it happen?
    bins:
    - The Earth spins
    - The Moon goes round the Earth
    items:
    - label: Day and night
      bin: The Earth spins
      clue: Your side faces the Sun, then turns away.
      why: One spin, about 24 hours.
    - label: The Sun seems to rise in the east
      bin: The Earth spins
      clue: We turn towards the Sun.
      why: Because of the spin.
    - label: Your shadow moves during the day
      bin: The Earth spins
      clue: The Sun seems to cross the sky.
      why: Because of the spin.
    - label: The Moon looks like a different shape each night
      bin: The Moon goes round the Earth
      clue: We see more or less of its lit side.
      why: Its journey round us.
    - label: A full moon about once a month
      bin: The Moon goes round the Earth
      clue: One trip takes about a month.
      why: Its journey round us.
    - label: A dark night with no moon
      bin: The Moon goes round the Earth
      clue: Its lit side faces away.
      why: New moon.
  items:
  - prompt: 'Day and night happen because the Earth:'
    options:
    - spins
    - stops moving
    - is flat
    - moves closer to the Moon
    answer: spins
    difficulty: 1
    hints:
    - Like a top.
    - Once a day.
    solution: The spinning Earth gives day and night.
    mistakes: {"stops moving": "v5_spin"}
  - prompt: How long does the Earth take to spin once?
    options:
    - about 24 hours
    - about 1 hour
    - a year
    - a week
    answer: about 24 hours
    difficulty: 1
    hints:
    - One day and one night.
    - A full day.
    solution: One spin takes about 24 hours.
    mistakes: {"a year": "v5_24h"}
  - prompt: Where does the Sun seem to rise?
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - Morning.
    - Opposite of sunset.
    solution: The Sun seems to rise in the East.
    mistakes: {"West": "v5_east"}
  - prompt: When is your shadow shortest?
    options:
    - at noon
    - in the early morning
    - in the evening
    - at sunset
    answer: at noon
    difficulty: 2
    hints:
    - When is the Sun highest?
    - Overhead.
    solution: The Sun is highest at noon, so shadows are shortest.
    mistakes: {"in the early morning": "v5_noon"}
  - prompt: About how long does the Moon take to go from one full moon to the next?
    options:
    - about a month
    - a day
    - a year
    - an hour
    answer: about a month
    difficulty: 2
    hints:
    - The word 'month' comes from Moon.
    - About 30 days.
    solution: Moon phases repeat about every month.
    mistakes: {"a day": "v5_moon_month"}
  - prompt: 'The night with no Moon visible is called:'
    options:
    - new moon
    - full moon
    - half moon
    - blue moon
    answer: new moon
    difficulty: 2
    hints:
    - The Moon is hidden.
    - Diwali night.
    solution: On a new moon night we cannot see the Moon.
    mistakes: {"full moon": "v5_new_moon"}
- code: cbse5v.rhythm.seasons
  title: Seasons and nature's calendar
  after:
  - cbse5v.rhythm.daynight
  notes: |
    The year has seasons: summer (hot), monsoon (rainy), winter (cool), and in some places spring and autumn. Plants and
    animals follow them: trees shed leaves, flowers bloom, birds migrate (Siberian cranes come to India in winter),
    farmers sow kharif crops (rice) in the monsoon and rabi crops (wheat) in winter. Harvest festivals: Onam, Pongal,
    Baisakhi, Bihu.
  explanations:
    text: 'Nature has a yearly rhythm. Summer is hot, the monsoon brings rain, and winter is cool. Trees, birds and farmers follow these seasons: birds fly in from far lands, trees flower, and farmers sow and harvest at the right time.'
    visual: 'Draw a circle split into three: summer (sun), monsoon (rain clouds and rice fields), winter (fog and wheat fields with birds flying in).'
    step_by_step: 'Step 1: Name the season. Step 2: What is the weather like? Step 3: What do plants, animals and farmers do then?'
    real_world: Harvest festivals like Onam, Pongal, Baisakhi and Bihu celebrate the end of a crop season.
  picture:
    kind: compare
    columns:
    - title: Monsoon
      points:
      - rain
      - rice sown (kharif)
    - title: Winter
      points:
      - cool
      - wheat sown (rabi)
      - birds arrive
    - title: Summer
      points:
      - hot
      - mangoes ripen
    alt: In the monsoon it rains and rice is sown; in winter it is cool, wheat is sown and birds arrive; in summer it is hot and mangoes ripen.
  activity:
    type: sort
    prompt: Which season is it?
    bins:
    - Summer
    - Monsoon
    - Winter
    items:
    - label: Mangoes ripen
      bin: Summer
      clue: Hot days in April and May.
      why: Summer fruit.
    - label: A hot, dry wind called loo
      bin: Summer
      clue: North India, very hot.
      why: Summer.
    - label: Farmers sow paddy
      bin: Monsoon
      clue: The fields fill with rainwater.
      why: The monsoon.
    - label: Frogs croaking in puddles
      bin: Monsoon
      clue: Lots of rain.
      why: The monsoon.
    - label: Foggy mornings
      bin: Winter
      clue: Cold air near the ground.
      why: Winter.
    - label: Birds arriving from far colder lands
      bin: Winter
      clue: They escape the snow up north.
      why: Winter.
    - label: Wearing sweaters to school
      bin: Winter
      clue: It's cold.
      why: Winter.
  items:
  - prompt: Which crop is sown in the monsoon?
    options:
    - rice
    - wheat
    - mustard
    - peas
    answer: rice
    difficulty: 2
    hints:
    - Needs lots of water.
    - Kharif crop.
    solution: Rice is a kharif crop sown in the rains.
    mistakes: {"wheat": "v5_rice"}
  - prompt: Why do some birds come to India in winter?
    options:
    - to escape the cold in their homes
    - to see the Taj Mahal
    - because they are lost
    - for the monsoon
    answer: to escape the cold in their homes
    difficulty: 2
    hints:
    - Their lands freeze.
    - Migration.
    solution: Migratory birds escape freezing winters far away.
    mistakes: {"to see the Taj Mahal": "v5_migrate"}
  - prompt: 'Mangoes ripen in:'
    options:
    - summer
    - winter
    - monsoon
    - every week
    answer: summer
    difficulty: 1
    hints:
    - Hot months.
    - April-May.
    solution: Mangoes ripen in summer.
    mistakes: {"winter": "v5_mango"}
  - prompt: 'Pongal is a festival of:'
    options:
    - harvest
    - rain dances only
    - snow
    - the new moon
    answer: harvest
    difficulty: 1
    hints:
    - Tamil Nadu.
    - New rice.
    solution: Pongal celebrates the harvest.
    mistakes: {"snow": "v5_pongal"}
  - prompt: Which season is hottest in most of India?
    options:
    - summer
    - winter
    - monsoon
    - all are the same
    answer: summer
    difficulty: 1
    hints:
    - April to June.
    - Hot sun.
    solution: Summer is the hottest season.
    mistakes: {"monsoon": "v5_hottest"}
  - prompt: 'Wheat is mainly sown in:'
    options:
    - winter
    - summer
    - monsoon
    - never
    answer: winter
    difficulty: 2
    hints:
    - Rabi crop.
    - Cool months.
    solution: Wheat is a rabi crop sown in winter.
    mistakes: {"monsoon": "v5_wheat"}
