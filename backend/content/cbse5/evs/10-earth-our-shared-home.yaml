# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 10
title: Earth—Our Shared Home
tips:
  v5_bees: "Bees go from flower to flower. What dusty stuff sticks to them?"
  v5_food_chain: "The arrow points from what is eaten to who eats it. Look at the arrow pointing into the deer."
  v5_forests: "Tree roots and leaves help the land in two ways: soil and water."
  v5_harm: "Which choice is bad for the Earth? The others help it."
  v5_national_park: "National parks keep wild places safe. Would factories be allowed?"
  v5_plants_give: "Plants take in carbon dioxide and give out a gas we breathe."
  v5_recycle: "Reuse means using the same thing again. Here the paper is broken down and made into new paper."
  v5_reduce: "A cloth bag means using fewer plastic bags. Which R is 'use less'?"
  v5_seed_dispersal: "Seeds dropped far away can grow into ...?"
  v5_small_action: "Which choice saves something? The others waste or pollute."
  c5v10_chain: 'Follow the arrows: each living thing is eaten by the next one in the chain.'
  c5v10_link: Ask what each living thing gives to others, and what would be missing if it vanished.
  c5v10_rrr: Using less, using again, and making something new from old are three different ideas. Which one fits?
  c5v10_harm: Ask whether the action leaves the air, water, soil or animals better or worse off.

concepts:
- code: cbse5v.earth.share
  title: Living things depend on each other
  notes: |
    Earth is home to plants, animals and people, all linked. Food chain: grass → deer → tiger. Plants give oxygen, food,
    shade and homes; animals spread seeds and pollinate flowers (bees). Forests hold soil and bring rain. If one link
    is removed, others suffer.
  explanations:
    text: Everything on Earth is connected. Plants give food and oxygen. Bees carry pollen so fruits grow. Deer eat grass and tigers eat deer. If we take away one part, the others are affected too.
    visual: 'Draw arrows: grass → deer → tiger. Then a bee flying from flower to flower and a mango tree with fruit.'
    step_by_step: 'Step 1: Pick a living thing. Step 2: What does it need? Step 3: Who needs it? Step 4: What happens if it disappears?'
    real_world: When bees decrease, fruit and vegetable harvests fall, because bees pollinate the flowers.
  picture:
    kind: flow
    steps:
    - Sun
    - Grass
    - Deer
    - Tiger
    alt: 'A food chain: the Sun helps grass grow, deer eat the grass, and tigers eat the deer.'
  activity:
    type: order
    prompt: 'Make a food chain: who eats whom? Start with the plant.'
    steps:
    - Grass
    - Grasshopper
    - Frog
    - Snake
    - Eagle
    reasons:
      Grasshopper: A food chain starts with a plant, which makes food from sunlight.
      Frog: The frog eats the grasshopper.
      Snake: The snake eats the frog.
      Eagle: The eagle eats the snake.
  lesson:
    - teach: 'Earth is shared by plants, animals and people, and all are linked. A food chain shows who eats whom: grass → deer → tiger. The grass makes food from sunlight, the deer eats grass, the tiger eats the deer.'
      picture:
        kind: flow
        steps:
        - Sun
        - Grass
        - Deer
        - Tiger
        alt: 'A food chain: the Sun feeds grass, grass feeds deer, deer feed tigers.'
      check:
        prompt: In grass → deer → tiger, what does the tiger eat?
        options:
        - Deer
        - Grass
        - Sunlight
        answer: Deer
        why: The arrow from deer points to tiger.
      ways:
      - style: step_by_step
        teach: 'Build a food chain. Step 1: Start with a green plant, which makes food from sunlight, such as a paddy plant. Step 2: Add what eats it: a grasshopper. Step 3: Add what eats the grasshopper: a frog. Step 4: Add what eats the frog: a snake. Draw arrows from each one to its eater.'
      - style: real_world
        teach: In a pond, tiny green plants float in the water. Small fish eat them, bigger fish eat the small fish, and a kingfisher dives to catch the bigger fish. Everything in the pond is linked.
    - teach: 'Plants give oxygen, food, shade and homes. Animals help plants too: bees carry pollen between flowers so fruits form, and birds drop seeds far away so new trees grow.'
      check:
        prompt: How do birds help forests grow?
        options:
        - They drop seeds in new places
        - They cut trees
        - They eat all the leaves
        answer: They drop seeds in new places
        why: Seeds in their droppings sprout into new plants.
      ways:
      - style: visual
        teach: What plants give animals, and what animals give plants.
        picture:
          kind: compare
          columns:
          - title: Plants give
            points:
            - Oxygen
            - Food
            - Shade
            - Homes, like nests
          - title: Animals give
            points:
            - Bees carry pollen
            - Birds spread seeds
            - Droppings feed the soil
          alt: 'Plants give oxygen, food, shade and homes such as nests. Animals help plants too: bees carry pollen, birds spread seeds and animal droppings feed the soil.'
      - style: real_world
        teach: A banyan tree is like a busy apartment block. Birds nest in its branches, squirrels and monkeys eat its figs, insects live in its bark, and people rest in its shade.
    - teach: 'Forests hold soil with their roots and help bring rain. If one link is removed, others suffer: without deer, tigers go hungry; without bees, many fruits would not form.'
      check:
        prompt: If all the bees disappeared, what would happen?
        options:
        - Many plants would make fewer fruits
        - More honey
        - Nothing at all
        answer: Many plants would make fewer fruits
        why: Bees carry pollen that fruits need.
      ways:
      - style: visual
        teach: What happens when one link in nature is removed.
        picture:
          kind: flow
          steps:
          - Trees on a hill are cut down
          - No roots hold the soil
          - Heavy rain washes the soil away
          - Fewer plants can grow
          - Animals lose their food and homes
          alt: When trees on a hill are cut down, no roots hold the soil, and heavy rain washes it away. Fewer plants can grow, and animals lose their food and homes.
      - style: real_world
        teach: Some farmers keep beehives near their fruit trees. With more bees visiting the flowers, more flowers turn into fruit, so the farmer gets both honey and a bigger harvest.
  items:
  - prompt: In the food chain grass → deer → tiger, what does the deer eat?
    options:
    - grass
    - tiger
    - meat
    - stones
    answer: grass
    difficulty: 1
    hints:
    - Follow the arrow into the deer.
    - Herbivore.
    solution: The deer eats grass.
    mistakes: {"tiger": "v5_food_chain"}
  - prompt: 'Plants give us:'
    options:
    - oxygen and food
    - plastic
    - petrol
    - smoke
    answer: oxygen and food
    difficulty: 1
    hints:
    - We breathe it.
    - Fruits and grains.
    solution: Plants give oxygen and food.
    mistakes: {"smoke": "v5_plants_give"}
  - prompt: 'Bees help plants by:'
    options:
    - "carrying pollen between flowers"
    - "eating the roots of the plants"
    - "cutting the leaves into pieces"
    - "making shade for the small plants"
    answer: carrying pollen between flowers
    difficulty: 2
    hints:
    - They visit many flowers.
    - Pollination.
    solution: Bees pollinate flowers so fruits form.
    mistakes: {"eating the roots of the plants": "v5_bees"}
  - prompt: 'If all the deer in a forest disappeared, the tigers would:'
    options:
    - have less food
    - have more food
    - turn into deer
    - not be affected
    answer: have less food
    difficulty: 2
    hints:
    - Tigers eat deer.
    - Food chain.
    solution: Tigers would lose a main food.
    mistakes:
      not be affected: c5v_think
  - prompt: How do forests help us?
    options:
    - they hold soil and help bring rain
    - they make floods worse always
    - they block all sunlight on Earth
    - they make air dirty
    answer: they hold soil and help bring rain
    difficulty: 2
    hints:
    - Roots.
    - Clouds.
    solution: Forests protect soil and help rainfall.
    mistakes: {"they make air dirty": "v5_forests"}
  - prompt: 'A bird eating fruit and dropping seeds far away helps to:'
    options:
    - plant new trees
    - kill trees
    - make rain
    - dry rivers
    answer: plant new trees
    difficulty: 2
    hints:
    - Seeds grow.
    - Spread.
    solution: Birds spread seeds, helping new plants grow.
    mistakes: {"dry rivers": "v5_seed_dispersal"}
  - prompt: In the chain leaf → caterpillar → bird, what eats the caterpillar?
    options:
    - Bird
    - Leaf
    - Sun
    answer: Bird
    difficulty: 1
    hints:
    - Follow the arrow from caterpillar.
    - What comes next?
    solution: 'Step 1: caterpillar → bird. Step 2: the bird eats it.'
    mistakes:
      Leaf: c5v10_chain
      Sun: c5v10_chain
  - prompt: 'Every food chain starts with:'
    options:
    - A green plant
    - A tiger
    - A human
    answer: A green plant
    difficulty: 2
    hints:
    - Something must make food from sunlight.
    - Animals cannot do that.
    solution: 'Step 1: only plants make food from sunlight. Step 2: chains start with plants.'
    mistakes:
      A tiger: c5v10_chain
      A human: c5v10_chain
  - prompt: Which gas do plants give out that we breathe in?
    options:
    - Oxygen
    - Smoke
    - Steam
    answer: Oxygen
    difficulty: 1
    hints:
    - We need it to live.
    - Plants make it in sunlight.
    solution: 'Step 1: plants make food in sunlight. Step 2: they give out oxygen.'
    mistakes:
      Smoke: c5v10_link
      Steam: c5v10_link
  - prompt: 'A snake eats frogs, and frogs eat insects. If all the frogs died, the snakes would:'
    options:
    - Have less food
    - Have more food
    - Turn into frogs
    answer: Have less food
    difficulty: 2
    hints:
    - Frogs are the snakes' food.
    - What happens if food disappears?
    solution: 'Step 1: snakes eat frogs. Step 2: no frogs means less food for snakes.'
    mistakes:
      Have more food: c5v10_chain
      Turn into frogs: c5v10_chain
  - prompt: 'In that same chain, if all the frogs died, the insects would:'
    options:
    - Increase in number
    - Disappear too
    - Turn into snakes
    answer: Increase in number
    difficulty: 3
    hints:
    - Frogs eat insects.
    - Who would eat the insects now?
    solution: 'Step 1: frogs kept insect numbers down. Step 2: without frogs, insects increase.'
    mistakes:
      Disappear too: c5v10_chain
      Turn into snakes: c5v10_chain
  - prompt: Why are trees called the lungs of the Earth?
    options:
    - They give out oxygen
    - They breathe smoke
    - They have lungs
    answer: They give out oxygen
    difficulty: 2
    hints:
    - Lungs help us breathe.
    - Trees make the gas we breathe.
    solution: 'Step 1: our lungs take in oxygen. Step 2: trees make oxygen for us.'
    mistakes:
      They breathe smoke: c5v10_link
      They have lungs: c5v10_link
  - prompt: How do earthworms help plants?
    options:
    - "They loosen and enrich the soil"
    - "They eat up all the plant roots"
    - "They bring rain clouds to the field"
    answer: They loosen and enrich the soil
    difficulty: 2
    hints:
    - They dig tunnels.
    - Their waste is good for soil.
    solution: 'Step 1: tunnels let air and water in. Step 2: their waste makes soil rich.'
    mistakes:
      "They eat up all the plant roots": c5v10_link
      "They bring rain clouds to the field": c5v10_link
  - prompt: Which animal helps flowers turn into fruits?
    options:
    - Butterfly
    - Fish
    - Crab
    answer: Butterfly
    difficulty: 1
    hints:
    - It visits flowers.
    - It carries pollen on its body.
    solution: 'Step 1: butterflies visit flowers. Step 2: they carry pollen, so fruits form.'
    mistakes:
      Fish: c5v10_link
      Crab: c5v10_link
  - prompt: Why do hills without trees have more landslides?
    options:
    - No roots hold the soil
    - Trees push soil down
    - Rain stops
    answer: No roots hold the soil
    difficulty: 3
    hints:
    - Roots grip the soil.
    - What happens to loose soil in heavy rain?
    solution: 'Step 1: roots hold soil in place. Step 2: without them, rain washes slopes down.'
    mistakes:
      Trees push soil down: c5v10_link
      Rain stops: c5v10_link
  - prompt: 'Case: In a village, farmers spray strong poison on their fields, and most of the bees die. The next year, the mango and guava trees nearby have very few fruits. Why?'
    options:
    - "Without bees, pollen was not carried between flowers"
    - "The fruit trees in the village had become too old"
    - "Tigers came out of the forest and ate all the fruit"
    answer: Without bees, pollen was not carried between flowers
    hints:
    - What job do bees do for flowers?
    - What must happen before a flower can turn into fruit?
    solution: Bees carry pollen from flower to flower, which helps fruits form. With the bees gone, far fewer flowers turned into fruit.
    mistakes:
      "The fruit trees in the village had become too old": c5v10_link
      "Tigers came out of the forest and ate all the fruit": c5v10_chain
    exam: case
    difficulty: 2
  - prompt: 'Situation: In the food chain grass, rabbit, fox, a disease kills most of the rabbits. What is most likely to happen to the foxes?'
    options:
    - They will have less food
    - They will start eating grass
    - Nothing will change for them
    answer: They will have less food
    hints:
    - What do the foxes eat in this chain?
    - What happens when that food becomes scarce?
    solution: The foxes eat rabbits. With most rabbits gone, the foxes have less food and may go hungry.
    mistakes:
      They will start eating grass: c5v10_chain
      Nothing will change for them: c5v10_chain
    exam: competency
    difficulty: 2
- code: cbse5v.earth.protect
  title: Protecting our planet
  after:
  - cbse5v.earth.share
  notes: |
    People harm Earth by cutting forests, polluting air, water and soil, and making lots of plastic waste. We can help:
    reduce (use less), reuse (use again), recycle (make new things from old); plant trees; save water and energy; protect
    animals in national parks. Small actions by many people make a big difference.
  explanations:
    text: Earth is our only home, and we share it with plants and animals. We can protect it by using less, reusing what we can, recycling waste, planting trees and not wasting water and energy.
    visual: Draw three arrows in a circle labelled Reduce, Reuse, Recycle, around a small Earth.
    step_by_step: 'Step 1: Before using something, ask: do I need it? (Reduce). Step 2: Can I use it again? (Reuse). Step 3: Can it be made into something new? (Recycle).'
    real_world: Carrying a cloth bag to the market instead of taking plastic bags is a simple way to help.
  picture:
    kind: compare
    columns:
    - title: Reduce
      points:
      - use less
      - carry a cloth bag
    - title: Reuse
      points:
      - use again
      - glass jars for storage
    - title: Recycle
      points:
      - make new from old
      - paper into new paper
    alt: Reduce means use less, like carrying a cloth bag; reuse means use again, like glass jars; recycle means make new things from old, like paper into new paper.
  activity:
    type: sort
    prompt: How does it help the Earth?
    bins:
    - Use less
    - Use again
    - Recycle
    items:
    - label: Turning off the fan when you leave
      bin: Use less
      clue: Less electricity.
      why: Using less.
    - label: Taking only as much food as you'll eat
      bin: Use less
      clue: Nothing thrown away.
      why: Using less.
    - label: A glass jar becomes a pencil holder
      bin: Use again
      clue: Same jar, new job.
      why: Reusing.
    - label: Old clothes given to a younger cousin
      bin: Use again
      clue: Worn again.
      why: Reusing.
    - label: An old tyre becomes a swing
      bin: Use again
      clue: A new job for it.
      why: Reusing.
    - label: Old newspapers sent to make new paper
      bin: Recycle
      clue: Pulped and made again.
      why: Recycling.
    - label: Plastic bottles melted into new things
      bin: Recycle
      clue: Made into something new.
      why: Recycling.
    - label: Cans melted into new metal
      bin: Recycle
      clue: Melted down.
      why: Recycling.
  lesson:
    - teach: People harm the Earth by cutting forests, dirtying air, water and soil, and making lots of plastic waste that stays for hundreds of years.
      check:
        prompt: Why is plastic waste a big problem?
        options:
        - It stays for hundreds of years
        - It melts in rain
        - Animals need it
        answer: It stays for hundreds of years
        why: Plastic does not rot away.
      ways:
      - style: visual
        teach: Ways people harm the Earth, and what each one damages.
        picture:
          kind: compare
          columns:
          - title: What people do
            points:
            - Cut down forests
            - Burn waste and fuel
            - Throw plastic away
          - title: What it harms
            points:
            - Animal homes and the soil
            - Clean air
            - Rivers, seas and animals for hundreds of years
          alt: Cutting down forests harms animal homes and the soil. Burning waste and fuel harms clean air. Throwing plastic away harms rivers, seas and animals for hundreds of years.
      - style: real_world
        teach: Cows that eat from roadside rubbish heaps sometimes swallow plastic bags. The plastic stays in their stomach and makes them very ill. Keeping plastic out of the open protects animals too.
    - teach: 'We can help with the three Rs. Reduce: use less (carry a cloth bag). Reuse: use again (a jam jar for pencils). Recycle: make new things from old (newspaper into new paper).'
      picture:
        kind: compare
        columns:
        - title: Reduce
          points:
          - Use less
          - Cloth bag
        - title: Reuse
          points:
          - Use again
          - Jar for pencils
        - title: Recycle
          points:
          - Make new from old
          - Old paper → new paper
        alt: The three Rs with an example of each.
      check:
        prompt: 'Writing on both sides of paper is:'
        options:
        - Reduce
        - Recycle
        - Pollute
        answer: Reduce
        why: You use less paper.
      ways:
      - style: step_by_step
        teach: 'Use the three Rs with an old notebook. Step 1: Reduce: write on both sides of each page. Step 2: Reuse: use the blank pages left at the end for rough work. Step 3: Recycle: when it is full, give it to the paper collector so it can be made into new paper.'
      - style: real_world
        teach: The kabadiwala who comes round to buy old newspapers, bottles and tins is part of recycling. The things collected go to factories that turn them into new paper, glass and metal.
    - teach: We can also plant trees, save water and energy, and protect wild animals in national parks and sanctuaries. Small actions by many people make a big difference.
      check:
        prompt: Why do small actions matter?
        options:
        - Many people doing them adds up to a big change
        - They do not matter
        - Only big companies matter
        answer: Many people doing them adds up to a big change
        why: Millions of small actions together are huge.
      ways:
      - style: visual
        teach: How small actions by many people add up to a big difference.
        picture:
          kind: flow
          steps:
          - One child carries a cloth bag
          - The whole class does the same
          - The whole school joins in
          - Thousands of plastic bags are not used each year
          alt: One child carries a cloth bag. Then the whole class does the same, and then the whole school joins in. Together they stop thousands of plastic bags being used each year.
      - style: real_world
        teach: Some schools have an eco-club that plants saplings each monsoon and waters them through the dry months. Years later, the students who planted them can come back and sit in their shade.
  items:
  - prompt: 'Carrying a cloth bag to the market is an example of:'
    options:
    - reduce
    - pollute
    - waste
    - burn
    answer: reduce
    difficulty: 1
    hints:
    - You use fewer plastic bags.
    - Use less.
    solution: It reduces plastic use.
    mistakes: {"waste": "v5_reduce"}
  - prompt: 'Using an old jam jar to keep pencils is:'
    options:
    - reuse
    - recycle
    - pollute
    - waste
    answer: reuse
    difficulty: 1
    hints:
    - Using again as it is.
    - Not remade.
    solution: Using the jar again is reuse.
    mistakes:
      recycle: c5v_reread
  - prompt: 'Making new paper from old newspapers is:'
    options:
    - recycle
    - reuse
    - reduce
    - waste
    answer: recycle
    difficulty: 2
    hints:
    - It is turned into something new.
    - Factory.
    solution: Turning old paper into new paper is recycling.
    mistakes: {"reuse": "v5_recycle"}
  - prompt: Which harms the Earth?
    options:
    - "throwing plastic everywhere"
    - "planting trees in our street"
    - "saving water at home and school"
    - "switching off lights we don't use"
    answer: throwing plastic everywhere
    difficulty: 1
    hints:
    - Plastic does not rot.
    - Litter.
    solution: Plastic waste harms land, water and animals.
    mistakes: {"planting trees in our street": "v5_harm"}
  - prompt: Why are national parks important?
    options:
    - they protect wild animals and plants
    - they are for building factories
    - they are for cutting trees
    - they are car parks
    answer: they protect wild animals and plants
    difficulty: 1
    hints:
    - Kaziranga, Periyar.
    - Safe homes for animals.
    solution: National parks protect wildlife.
    mistakes: {"they are for building factories": "v5_national_park"}
  - prompt: Which small action helps the planet?
    options:
    - turning off the tap while soaping hands
    - leaving the fan on in an empty room
    - throwing waste in a river
    - burning plastic
    answer: turning off the tap while soaping hands
    difficulty: 1
    hints:
    - Saves water.
    - Easy habit.
    solution: Turning off the tap saves water.
    mistakes: {"leaving the fan on in an empty room": "v5_small_action"}
  - prompt: 'Using an old tyre as a swing is:'
    options:
    - Reuse
    - Reduce
    - Recycle
    answer: Reuse
    difficulty: 1
    hints:
    - The tyre is used again for something else.
    - It is not melted down.
    solution: 'Step 1: the tyre gets a new use as it is. Step 2: that is reuse.'
    mistakes:
      Reduce: c5v10_rrr
      Recycle: c5v10_rrr
  - prompt: 'Melting old glass bottles to make new ones is:'
    options:
    - Recycle
    - Reuse
    - Reduce
    answer: Recycle
    difficulty: 2
    hints:
    - The old bottles are broken down.
    - Something new is made.
    solution: 'Step 1: old glass is melted. Step 2: new things are made: recycle.'
    mistakes:
      Reuse: c5v10_rrr
      Reduce: c5v10_rrr
  - prompt: 'Turning off lights you are not using is mainly:'
    options:
    - Reduce
    - Recycle
    - Reuse
    answer: Reduce
    difficulty: 2
    hints:
    - You use less electricity.
    - Which R means using less?
    solution: 'Step 1: less electricity is used. Step 2: that is reduce.'
    mistakes:
      Recycle: c5v10_rrr
      Reuse: c5v10_rrr
  - prompt: Which helps the Earth?
    options:
    - Planting a tree
    - Burning plastic
    - Cutting a forest for no reason
    answer: Planting a tree
    difficulty: 1
    hints:
    - Which adds something good?
    - Trees give oxygen and shade.
    solution: 'Step 1: trees clean air and hold soil. Step 2: planting one helps.'
    mistakes:
      Burning plastic: c5v10_harm
      Cutting a forest for no reason: c5v10_harm
  - prompt: 'Periyar in Kerala is a protected place for:'
    options:
    - Elephants and tigers
    - Penguins
    - Camels
    answer: Elephants and tigers
    difficulty: 2
    hints:
    - It is a forest in the Western Ghats.
    - Large forest animals live there.
    solution: 'Step 1: Periyar is a tiger reserve. Step 2: elephants and tigers live there.'
    mistakes:
      Penguins: c5v10_harm
      Camels: c5v10_harm
  - prompt: Why should we not burn plastic?
    options:
    - "It gives off harmful smoke"
    - "It makes the rain fall heavily"
    - "It makes new trees grow quickly"
    answer: It gives off harmful smoke
    difficulty: 2
    hints:
    - What comes out when plastic burns?
    - It smells bad and is poisonous.
    solution: 'Step 1: burning plastic releases smoke. Step 2: the smoke is harmful.'
    mistakes:
      "It makes the rain fall heavily": c5v10_harm
      "It makes new trees grow quickly": c5v10_harm
  - prompt: Which saves the most plastic when shopping?
    options:
    - Carrying your own cloth bag
    - Taking a new plastic bag each time
    - Using two plastic bags
    answer: Carrying your own cloth bag
    difficulty: 1
    hints:
    - A cloth bag can be used many times.
    - Fewer plastic bags are needed.
    solution: 'Step 1: a cloth bag lasts long. Step 2: no new plastic bags are needed.'
    mistakes:
      Taking a new plastic bag each time: c5v10_harm
      Using two plastic bags: c5v10_harm
  - prompt: A class of 30 children each plants 2 saplings. How many saplings in all?
    answer: '60'
    check: 30*2
    difficulty: 2
    hints:
    - Each child plants 2.
    - 30 × 2.
    solution: 'Step 1: 30 × 2. Step 2: = 60 saplings.'
    mistakes:
      '32': c5v10_rrr
      '15': c5v10_rrr
  - prompt: Which is the best order to try first, for less waste?
    options:
    - Reduce, then reuse, then recycle
    - Recycle first, then buy more
    - Throw away first
    answer: Reduce, then reuse, then recycle
    difficulty: 3
    hints:
    - The best waste is the waste never made.
    - Recycling still uses energy.
