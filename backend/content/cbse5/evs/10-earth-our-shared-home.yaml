# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 10
title: Earth—Our Shared Home
tips:
  v5_bees: "Bees go from flower to flower. What dusty stuff sticks to them?"
  v5_food_chain: "The arrow points from what is eaten to who eats it. Look at the arrow pointing into the deer."
  v5_forests: "Tree roots and leaves help the land in two ways: soil and water."
  v5_harm: "Which choice is bad for the Earth? The others help it."
  v5_national_park: "National parks keep wild places safe. Would factories be allowed?"
  v5_plants_give: "Plants take in carbon dioxide and give out a gas we breathe."
  v5_recycle: "Reuse means using the same thing again. Here the paper is broken down and made into new paper."
  v5_reduce: "A cloth bag means using fewer plastic bags. Which R is 'use less'?"
  v5_seed_dispersal: "Seeds dropped far away can grow into ...?"
  v5_small_action: "Which choice saves something? The others waste or pollute."

concepts:
- code: cbse5v.earth.share
  title: Living things depend on each other
  notes: |
    Earth is home to plants, animals and people, all linked. Food chain: grass → deer → tiger. Plants give oxygen, food,
    shade and homes; animals spread seeds and pollinate flowers (bees). Forests hold soil and bring rain. If one link
    is removed, others suffer.
  explanations:
    text: Everything on Earth is connected. Plants give food and oxygen. Bees carry pollen so fruits grow. Deer eat grass and tigers eat deer. If we take away one part, the others are affected too.
    visual: 'Draw arrows: grass → deer → tiger. Then a bee flying from flower to flower and a mango tree with fruit.'
    step_by_step: 'Step 1: Pick a living thing. Step 2: What does it need? Step 3: Who needs it? Step 4: What happens if it disappears?'
    real_world: When bees decrease, fruit and vegetable harvests fall, because bees pollinate the flowers.
  picture:
    kind: flow
    steps:
    - Sun
    - Grass
    - Deer
    - Tiger
    alt: 'A food chain: the Sun helps grass grow, deer eat the grass, and tigers eat the deer.'
  activity:
    type: order
    prompt: 'Make a food chain: who eats whom? Start with the plant.'
    steps:
    - Grass
    - Grasshopper
    - Frog
    - Snake
    - Eagle
    reasons:
      Grasshopper: A food chain starts with a plant, which makes food from sunlight.
      Frog: The frog eats the grasshopper.
      Snake: The snake eats the frog.
      Eagle: The eagle eats the snake.
  items:
  - prompt: In the food chain grass → deer → tiger, what does the deer eat?
    options:
    - grass
    - tiger
    - meat
    - stones
    answer: grass
    difficulty: 1
    hints:
    - Follow the arrow into the deer.
    - Herbivore.
    solution: The deer eats grass.
    mistakes: {"tiger": "v5_food_chain"}
  - prompt: 'Plants give us:'
    options:
    - oxygen and food
    - plastic
    - petrol
    - smoke
    answer: oxygen and food
    difficulty: 1
    hints:
    - We breathe it.
    - Fruits and grains.
    solution: Plants give oxygen and food.
    mistakes: {"smoke": "v5_plants_give"}
  - prompt: 'Bees help plants by:'
    options:
    - carrying pollen between flowers
    - eating the roots
    - cutting the leaves
    - making shade
    answer: carrying pollen between flowers
    difficulty: 2
    hints:
    - They visit many flowers.
    - Pollination.
    solution: Bees pollinate flowers so fruits form.
    mistakes: {"eating the roots": "v5_bees"}
  - prompt: 'If all the deer in a forest disappeared, the tigers would:'
    options:
    - have less food
    - have more food
    - turn into deer
    - not be affected
    answer: have less food
    difficulty: 2
    hints:
    - Tigers eat deer.
    - Food chain.
    solution: Tigers would lose a main food.
    mistakes:
      not be affected: c5v_think
  - prompt: How do forests help us?
    options:
    - they hold soil and help bring rain
    - they make floods worse always
    - they block all sunlight on Earth
    - they make air dirty
    answer: they hold soil and help bring rain
    difficulty: 2
    hints:
    - Roots.
    - Clouds.
    solution: Forests protect soil and help rainfall.
    mistakes: {"they make air dirty": "v5_forests"}
  - prompt: 'A bird eating fruit and dropping seeds far away helps to:'
    options:
    - plant new trees
    - kill trees
    - make rain
    - dry rivers
    answer: plant new trees
    difficulty: 2
    hints:
    - Seeds grow.
    - Spread.
    solution: Birds spread seeds, helping new plants grow.
    mistakes: {"dry rivers": "v5_seed_dispersal"}
- code: cbse5v.earth.protect
  title: Protecting our planet
  after:
  - cbse5v.earth.share
  notes: |
    People harm Earth by cutting forests, polluting air, water and soil, and making lots of plastic waste. We can help:
    reduce (use less), reuse (use again), recycle (make new things from old); plant trees; save water and energy; protect
    animals in national parks. Small actions by many people make a big difference.
  explanations:
    text: Earth is our only home, and we share it with plants and animals. We can protect it by using less, reusing what we can, recycling waste, planting trees and not wasting water and energy.
    visual: Draw three arrows in a circle labelled Reduce, Reuse, Recycle, around a small Earth.
    step_by_step: 'Step 1: Before using something, ask: do I need it? (Reduce). Step 2: Can I use it again? (Reuse). Step 3: Can it be made into something new? (Recycle).'
    real_world: Carrying a cloth bag to the market instead of taking plastic bags is a simple way to help.
  picture:
    kind: compare
    columns:
    - title: Reduce
      points:
      - use less
      - carry a cloth bag
    - title: Reuse
      points:
      - use again
      - glass jars for storage
    - title: Recycle
      points:
      - make new from old
      - paper into new paper
    alt: Reduce means use less, like carrying a cloth bag; reuse means use again, like glass jars; recycle means make new things from old, like paper into new paper.
  activity:
    type: sort
    prompt: How does it help the Earth?
    bins:
    - Use less
    - Use again
    - Recycle
    items:
    - label: Turning off the fan when you leave
      bin: Use less
      clue: Less electricity.
      why: Using less.
    - label: Taking only as much food as you'll eat
      bin: Use less
      clue: Nothing thrown away.
      why: Using less.
    - label: A glass jar becomes a pencil holder
      bin: Use again
      clue: Same jar, new job.
      why: Reusing.
    - label: Old clothes given to a younger cousin
      bin: Use again
      clue: Worn again.
      why: Reusing.
    - label: An old tyre becomes a swing
      bin: Use again
      clue: A new job for it.
      why: Reusing.
    - label: Old newspapers sent to make new paper
      bin: Recycle
      clue: Pulped and made again.
      why: Recycling.
    - label: Plastic bottles melted into new things
      bin: Recycle
      clue: Made into something new.
      why: Recycling.
    - label: Cans melted into new metal
      bin: Recycle
      clue: Melted down.
      why: Recycling.
  items:
  - prompt: 'Carrying a cloth bag to the market is an example of:'
    options:
    - reduce
    - pollute
    - waste
    - burn
    answer: reduce
    difficulty: 1
    hints:
    - You use fewer plastic bags.
    - Use less.
    solution: It reduces plastic use.
    mistakes: {"waste": "v5_reduce"}
  - prompt: 'Using an old jam jar to keep pencils is:'
    options:
    - reuse
    - recycle
    - pollute
    - waste
    answer: reuse
    difficulty: 1
    hints:
    - Using again as it is.
    - Not remade.
    solution: Using the jar again is reuse.
    mistakes:
      recycle: c5v_reread
  - prompt: 'Making new paper from old newspapers is:'
    options:
    - recycle
    - reuse
    - reduce
    - waste
    answer: recycle
    difficulty: 2
    hints:
    - It is turned into something new.
    - Factory.
    solution: Turning old paper into new paper is recycling.
    mistakes: {"reuse": "v5_recycle"}
  - prompt: Which harms the Earth?
    options:
    - throwing plastic everywhere
    - planting trees
    - saving water
    - switching off lights
    answer: throwing plastic everywhere
    difficulty: 1
    hints:
    - Plastic does not rot.
    - Litter.
    solution: Plastic waste harms land, water and animals.
    mistakes: {"planting trees": "v5_harm"}
  - prompt: Why are national parks important?
    options:
    - they protect wild animals and plants
    - they are for building factories
    - they are for cutting trees
    - they are car parks
    answer: they protect wild animals and plants
    difficulty: 1
    hints:
    - Kaziranga, Periyar.
    - Safe homes for animals.
    solution: National parks protect wildlife.
    mistakes: {"they are for building factories": "v5_national_park"}
  - prompt: Which small action helps the planet?
    options:
    - turning off the tap while soaping hands
    - leaving the fan on in an empty room
    - throwing waste in a river
    - burning plastic
    answer: turning off the tap while soaping hands
    difficulty: 1
    hints:
    - Saves water.
    - Easy habit.
    solution: Turning off the tap saves water.
    mistakes: {"leaving the fan on in an empty room": "v5_small_action"}
