# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 4
title: Our School—A Happy Place
tips:
  v5_broken_glass: "Broken glass can cut someone. Who can fix it safely?"
  v5_corridor: "Corridors are crowded and corners hide people. What could happen if you run?"
  v5_dry_waste: "Paper and plastic don't rot quickly and are not wet."
  v5_fire_drill: "In a fire, things can be replaced but people can't. What matters most?"
  v5_handwash: "Germs get on our hands every day. When do they reach our mouth?"
  v5_help_friend: "How would you want a friend to treat you if a sum was hard?"
  v5_inclusion: "A wheelchair can't climb steps. What helps, and how should friends include them?"
  v5_library: "The librarian looks after the books, but who are the books for?"
  v5_own_pace: "Some learn by pictures, some by doing, some fast, some slower."
  v5_queue: "In a line, each person waits their turn. Why is that fair?"
  v5_wet_waste: "Peels and food scraps are soft and rot quickly."
  c5v4_kind: Imagine you were the other child. What would make you feel welcome and safe?
  c5v4_fair: Think about what is fair for everyone, not just for you.
  c5v4_ways: Every child is different. Think about what helps each one take part.
  c5v4_bin: 'Ask: will it rot like a leaf, or stay the same for a long time?'
  c5v4_clean: Germs travel on hands. When do hands most need a wash?
  c5v4_safe: 'Ask: which choice keeps everyone from getting hurt, and who should know about danger?'

concepts:
- code: cbse5v.school.together
  title: Living and learning together
  notes: |
    School is a shared place: classrooms, playground, library, toilets and garden belong to everyone. Good habits:
    kindness, taking turns, listening, helping a classmate who finds something hard, including everyone in games. Each
    child learns in their own way and pace. Rules (queues, cleanliness) keep everyone safe and happy.
  explanations:
    text: A school is happy when everyone feels welcome. We take turns, listen to each other, help friends and include everyone in our games. Everyone learns differently, and that's okay.
    visual: Draw a playground circle game with children of different heights, one in a wheelchair, all holding hands.
    step_by_step: 'Step 1: Think how you would like to be treated. Step 2: Treat others the same way. Step 3: Notice who is left out and invite them.'
    real_world: Buddy systems, class helpers and ramps for wheelchairs make schools welcoming for all children.
  picture:
    kind: compare
    columns:
    - title: Helps everyone
      points:
      - taking turns
      - listening
      - including all
    - title: Hurts others
      points:
      - teasing
      - pushing in line
      - leaving someone out
    alt: Taking turns, listening and including everyone help a school; teasing, pushing in line and leaving someone out hurt others.
  activity:
    type: sort
    prompt: Is it kind and fair?
    bins:
    - Kind and fair
    - Not kind
    items:
    - label: Taking turns on the swing
      bin: Kind and fair
      clue: Does everyone get a go?
      why: Fair.
    - label: Helping a friend who can't see the board
      bin: Kind and fair
      clue: Moving so they can see, or reading it aloud.
      why: Kind.
    - label: Asking a new child to join your game
      bin: Kind and fair
      clue: How does the new child feel?
      why: Kind.
    - label: Listening when someone speaks
      bin: Kind and fair
      clue: Do they feel heard?
      why: Kind.
    - label: Laughing at someone's mistake
      bin: Not kind
      clue: How would you feel?
      why: Hurts feelings. Everyone makes mistakes.
    - label: Pushing ahead in the line
      bin: Not kind
      clue: Is it fair to the others waiting?
      why: Not fair.
    - label: Leaving a child out of a game
      bin: Not kind
      clue: How do they feel?
      why: Not kind.
    - label: Grabbing the ball from someone
      bin: Not kind
      clue: Did you ask?
      why: Not fair.
  lesson:
    - teach: School is a shared place. The classroom, playground, library, toilets and garden belong to everyone, so everyone takes care of them.
      check:
        prompt: Who should take care of the school garden?
        options:
        - Everyone in the school
        - Only the gardener
        - Nobody
        answer: Everyone in the school
        why: It is shared by all, so all look after it.
      ways:
      - style: visual
        teach: Places at school that we all share, and how we look after them.
        picture:
          kind: compare
          columns:
          - title: Shared place
            points:
            - Classroom
            - Library
            - Playground
            - Toilets
          - title: How we care for it
            points:
            - Keep desks and floor tidy
            - Handle books gently
            - Put equipment back
            - Keep them clean
          alt: We share the classroom, library, playground and toilets. We care for them by keeping desks and floor tidy, handling books gently, putting equipment back and keeping them clean.
      - style: real_world
        teach: If one child scribbles in a library book, the next ten readers get a spoiled book. Taking care of shared things is a way of being kind to people you may never meet.
    - teach: 'Good habits make school happy: being kind, taking turns, listening when others speak, including everyone in games, and helping a friend who finds something hard.'
      picture:
        kind: compare
        columns:
        - title: Kind habits
          points:
          - Taking turns
          - Listening
          - Including everyone
        - title: Unkind habits
          points:
          - Pushing in line
          - Laughing at mistakes
          - Leaving someone out
        alt: Kind habits like taking turns compared with unkind habits like pushing.
      check:
        prompt: A friend gets an answer wrong. What is kind?
        options:
        - Help them understand
        - Laugh at them
        - Tell everyone
        answer: Help them understand
        why: Mistakes are how we learn.
      ways:
      - style: step_by_step
        teach: 'Being a good teammate. Step 1: Wait for your turn. Step 2: Listen when someone else is talking. Step 3: Look round: is anyone left out? Invite them in. Step 4: If a friend is stuck, offer help without making fun.'
      - style: real_world
        teach: In a game of kho-kho, every player gets a chance to chase and to run. If the same few children always played and the rest only watched, the game would not be fun for most of the class.
    - teach: Every child learns in their own way and at their own pace. Some read with their eyes, some with their fingers (Braille), some use sign language or a wheelchair. A good school has ramps, wide doors and ways for everyone to join in.
      check:
        prompt: 'Braille helps children who:'
        options:
        - Cannot see
        - Cannot hear
        - Are very tall
        answer: Cannot see
        why: Braille is read by touching raised dots.
      ways:
      - style: visual
        teach: Different ways children read, talk and move, and what a school can provide.
        picture:
          kind: compare
          columns:
          - title: A child may
            points:
            - Read Braille with fingers
            - Talk in sign language
            - Use a wheelchair
          - title: School can provide
            points:
            - Braille books
            - Teachers who sign
            - Ramps and wide doors
          alt: A child may read Braille with fingers, talk in sign language or use a wheelchair. A school can provide Braille books, teachers who sign, and ramps and wide doors.
      - style: real_world
        teach: 'Some children finish a sum in a minute, others need five. Some learn best by hearing, some by drawing, some by doing. Being slower or different is not being worse: everyone is learning.'
  items:
  - prompt: A new child sits alone at lunch. What is the kind thing to do?
    options:
    - invite them to sit with you
    - ignore them
    - laugh at them
    - tell others not to talk to them
    answer: invite them to sit with you
    difficulty: 1
    hints:
    - How would you feel alone?
    - Be a friend.
    solution: Inviting them makes them feel welcome.
    mistakes:
      ignore them: c5v_think
  - prompt: Why do we stand in a queue?
    options:
    - so everyone gets a fair turn
    - to waste time
    - to make noise
    - to push
    answer: so everyone gets a fair turn
    difficulty: 1
    hints:
    - Fair.
    - First come, first served.
    solution: Queues give everyone a fair turn safely.
    mistakes: {"to push": "v5_queue"}
  - prompt: 'A classmate finds a sum hard. You can:'
    options:
    - explain it kindly
    - make fun of them
    - do nothing ever
    - tear their book
    answer: explain it kindly
    difficulty: 1
    hints:
    - Help.
    - Be patient.
    solution: Helping kindly is what good friends do.
    mistakes: {"make fun of them": "v5_help_friend"}
  - prompt: Who does the school library belong to?
    options:
    - everyone in the school
    - only the librarian
    - only Class 5
    - nobody
    answer: everyone in the school
    difficulty: 1
    hints:
    - It is shared.
    - All can use it.
    solution: Shared spaces belong to everyone.
    mistakes: {"only the librarian": "v5_library"}
  - prompt: 'Everyone learns:'
    options:
    - in their own way and at their own pace
    - exactly the same way
    - only by copying
    - only from books
    answer: in their own way and at their own pace
    difficulty: 2
    hints:
    - Some like pictures, some like doing.
    - Different.
    solution: Children learn in different ways and at different speeds.
    mistakes: {"exactly the same way": "v5_own_pace"}
  - prompt: How can a school welcome a child who uses a wheelchair?
    options:
    - build ramps and include them in activities
    - keep them in one room
    - stop them from playing
    - ask them to stay home
    answer: build ramps and include them in activities
    difficulty: 2
    hints:
    - Make places reachable.
    - Include in games.
    solution: Ramps and inclusion help every child take part.
    mistakes: {"keep them in one room": "v5_inclusion"}
  - prompt: Two children want the same swing. What is fair?
    options:
    - Take turns
    - The stronger one keeps it
    - Both fight for it
    answer: Take turns
    difficulty: 1
    hints:
    - Fair means everyone gets a chance.
    - One after the other.
    solution: 'Step 1: both want it. Step 2: taking turns is fair.'
    mistakes:
      The stronger one keeps it: c5v4_fair
      Both fight for it: c5v4_fair
  - prompt: 'A child who cannot hear may talk using:'
    options:
    - Sign language
    - Shouting louder
    - Whistling
    answer: Sign language
    difficulty: 2
    hints:
    - It uses hands and faces.
    - It does not need sound.
    solution: 'Step 1: talking without sound. Step 2: sign language uses hand shapes.'
    mistakes:
      Shouting louder: c5v4_ways
      Whistling: c5v4_ways
  - prompt: Why should a school have ramps?
    options:
    - So children using wheelchairs can move around
    - For skating
    - To slow down running
    answer: So children using wheelchairs can move around
    difficulty: 1
    hints:
    - Steps are hard for some children.
    - Think of wheels.
    solution: 'Step 1: wheelchairs cannot climb steps. Step 2: ramps let them move freely.'
    mistakes:
      For skating: c5v4_ways
      To slow down running: c5v4_ways
  - prompt: Someone is speaking in class. What should you do?
    options:
    - Listen quietly
    - Talk over them
    - Walk around
    answer: Listen quietly
    difficulty: 1
    hints:
    - How do you feel when others listen to you?
    - Wait for your turn.
    solution: 'Step 1: everyone deserves to be heard. Step 2: listen quietly.'
    mistakes:
      Talk over them: c5v4_kind
      Walk around: c5v4_kind
  - prompt: A new child speaks only Tamil and is shy. How can you help?
    options:
    - Smile, show them around and learn a few Tamil words
    - Ignore them
    - Make fun of their language
    answer: Smile, show them around and learn a few Tamil words
    difficulty: 2
    hints:
    - Being new is hard.
    - What would make you feel at home?
    solution: 'Step 1: new children feel shy. Step 2: friendliness helps them settle.'
    mistakes:
      Ignore them: c5v4_kind
      Make fun of their language: c5v4_kind
  - prompt: 'A library book should be:'
    options:
    - Returned on time and kept clean
    - Kept forever
    - Written in
    answer: Returned on time and kept clean
    difficulty: 1
    hints:
    - Others want to read it too.
    - It belongs to the school.
    solution: 'Step 1: library books are shared. Step 2: return them on time and in good shape.'
    mistakes:
      Kept forever: c5v4_fair
      Written in: c5v4_fair
  - prompt: Meena reads slowly but understands well. What is true?
    options:
    - Children learn at different speeds, and that is fine
    - She cannot learn
    - Only fast readers are clever
    answer: Children learn at different speeds, and that is fine
    difficulty: 2
    hints:
    - Is speed the same as understanding?
    - Everyone has their own pace.
    solution: 'Step 1: understanding matters most. Step 2: each child has their own pace.'
    mistakes:
      She cannot learn: c5v4_ways
      Only fast readers are clever: c5v4_ways
  - prompt: Why does a school make class rules together with the children?
    options:
    - So everyone understands and agrees to follow them
    - So rules can be broken
    - To waste time
    answer: So everyone understands and agrees to follow them
    difficulty: 3
    hints:
    - People follow rules they helped make.
    - Everyone's ideas count.
    solution: 'Step 1: making rules together helps everyone understand them. Step 2: so they are followed.'
    mistakes:
      So rules can be broken: c5v4_fair
      To waste time: c5v4_fair
  - prompt: In a game, one child always gets left out. What should the team do?
    options:
    - Invite them and give them a role
    - Keep playing without them
    - Tell them to go home
    answer: Invite them and give them a role
    difficulty: 2
    hints:
    - How does being left out feel?
    - Every child should get to play.
    solution: 'Step 1: leaving someone out hurts. Step 2: invite them in.'
    mistakes:
      Keep playing without them: c5v4_kind
      Tell them to go home: c5v4_kind
  - prompt: 'Case: A new classmate uses a wheelchair. The class is on the first floor, and the school has only stairs. What should the school do?'
    options:
    - Build a ramp or move the class to the ground floor
    - Ask the child to stay at home
    - Ask the child to climb the stairs
    answer: Build a ramp or move the class to the ground floor
    hints:
    - What stops the child from reaching the classroom?
    - How can the school remove that problem?
    solution: The stairs are the problem, not the child. A ramp, or a ground-floor class, lets the child join in like everyone else.
    mistakes:
      Ask the child to stay at home: c5v4_ways
      Ask the child to climb the stairs: c5v4_ways
    exam: case
    difficulty: 2
  - prompt: 'Situation: During group work, one child keeps talking and does not let anyone else share ideas. What is the fair thing to suggest?'
    options:
    - Take turns so each person shares one idea
    - Let that child decide everything
    - Stop the group work
    answer: Take turns so each person shares one idea
    hints:
    - Is everyone getting a chance to speak?
    - What makes it fair for all?
    solution: Taking turns gives every child a chance to speak and be heard, which is fair to everyone.
    mistakes:
      Let that child decide everything: c5v4_fair
      Stop the group work: c5v4_fair
    exam: competency
    difficulty: 2
- code: cbse5v.school.care
  title: A clean, safe school
  after:
  - cbse5v.school.together
  notes: |
    Keep school clean: use dustbins (wet and dry waste separately), keep toilets clean, wash hands with soap before eating
    and after the toilet. Safety: walk in corridors, know the fire drill and exits, tell a teacher about anything
    unsafe. A school garden teaches care for plants.
  explanations:
    text: A clean school keeps us healthy. Put waste in bins, wash hands with soap and keep toilets clean. To stay safe, walk, don't run in corridors, and know what to do in a fire drill.
    visual: 'Draw two dustbins: green for wet waste (peels, food) and blue for dry waste (paper, plastic).'
    step_by_step: 'Step 1: Before eating, wash hands with soap for 20 seconds. Step 2: Put waste in the right bin. Step 3: Report anything broken or unsafe.'
    real_world: Swachh Bharat drives in schools teach children to keep classrooms and toilets clean.
  picture:
    kind: flow
    steps:
    - Wet hands
    - Soap all over
    - Rub 20 seconds
    - Rinse
    - Dry
    alt: 'Washing hands: wet them, soap all over, rub for 20 seconds, rinse and dry.'
  activity:
    type: sort
    prompt: Does it keep the school clean and safe?
    bins:
    - Clean and safe
    - Not clean or safe
    items:
    - label: Putting wrappers in the bin
      bin: Clean and safe
      clue: Where does waste belong?
      why: Clean.
    - label: Washing hands with soap before eating
      bin: Clean and safe
      clue: Gets rid of germs.
      why: Healthy.
    - label: Walking in the corridors
      bin: Clean and safe
      clue: Less chance of falling.
      why: Safe.
    - label: Lining up calmly in a fire drill
      bin: Clean and safe
      clue: Everyone gets out in order.
      why: Safe.
    - label: Running down the stairs
      bin: Not clean or safe
      clue: Could you trip?
      why: Unsafe.
    - label: Throwing wrappers on the floor
      bin: Not clean or safe
      clue: Who has to pick it up?
      why: Dirty.
    - label: Playing with electric switches
      bin: Not clean or safe
      clue: Electricity can hurt.
      why: Unsafe.
    - label: Leaving the toilet tap running
      bin: Not clean or safe
      clue: Water spills and wastes.
      why: Wasteful and slippery.
  lesson:
    - teach: 'A clean school keeps us healthy. Use dustbins: wet waste (food, peels, leaves) in one bin and dry waste (paper, plastic, wrappers) in another. Wet waste can become compost for the garden.'
      picture:
        kind: compare
        columns:
        - title: Wet waste
          points:
          - Fruit peels
          - Leftover food
          - Leaves
        - title: Dry waste
          points:
          - Paper
          - Plastic
          - Wrappers
        alt: Wet waste like peels and dry waste like paper go in separate bins.
      check:
        prompt: 'A biscuit wrapper goes in:'
        options:
        - The dry waste bin
        - The wet waste bin
        - The garden
        answer: The dry waste bin
        why: Wrappers do not rot.
      ways:
      - style: step_by_step
        teach: 'Sort the lunch waste. Step 1: Pick up one item. Step 2: Ask: will it rot like a leaf? Step 3: If yes (peels, leftover food), it goes in the wet bin. Step 4: If no (wrappers, foil, paper cups), it goes in the dry bin.'
      - style: real_world
        teach: Some schools put the wet waste from lunch into a compost pit in the garden. After some weeks it turns into dark, crumbly compost that helps the school's plants grow.
    - teach: Wash hands with soap before eating and after using the toilet. Germs on hands can make us ill. Keep toilets clean and flush after use.
      check:
        prompt: When must you wash your hands with soap?
        options:
        - After using the toilet
        - Only once a week
        - Never at school
        answer: After using the toilet
        why: Germs from the toilet can spread to food.
      ways:
      - style: visual
        teach: Washing your hands properly, step by step.
        picture:
          kind: flow
          steps:
          - Wet your hands
          - 'Rub with soap: palms, backs, between fingers, nails'
          - Keep rubbing for about 20 seconds
          - Rinse with clean water
          - Dry on a clean cloth
          alt: Wet your hands, rub with soap on palms, backs, between fingers and nails for about 20 seconds, rinse with clean water and dry on a clean cloth.
      - style: real_world
        teach: Germs are too small to see. A child who sneezes into a hand and then touches a door handle leaves germs there for the next person. Washing hands before eating stops those germs reaching your mouth.
    - teach: 'Safety at school: walk in corridors, never push on stairs, know the fire drill and the nearest exit, and tell a teacher about anything unsafe, like broken glass or loose wires.'
      check:
        prompt: 'You see a loose electric wire in class. You should:'
        options:
        - Tell a teacher at once
        - Touch it
        - Ignore it
        answer: Tell a teacher at once
        why: Adults can make it safe; touching it is dangerous.
      ways:
      - style: visual
        teach: Safe and unsafe actions around the school.
        picture:
          kind: compare
          columns:
          - title: Unsafe
            points:
            - Running in corridors
            - Pushing on stairs
            - Touching loose wires
          - title: Safe
            points:
            - Walking in corridors
            - Holding the rail on stairs
            - Telling a teacher about danger
          alt: Running in corridors, pushing on stairs and touching loose wires are unsafe. Walking in corridors, holding the rail on stairs and telling a teacher about danger are safe.
      - style: step_by_step
        teach: 'In a fire drill. Step 1: Stop what you are doing when the alarm rings. Step 2: Leave your bag. Step 3: Walk in a line, quickly and quietly, to the nearest exit. Step 4: Go to the meeting place and stay with your class so the teacher can count everyone.'
  items:
  - prompt: 'Banana peels go in the bin for:'
    options:
    - wet waste
    - dry waste
    - glass
    - metal
    answer: wet waste
    difficulty: 1
    hints:
    - It is food waste.
    - It rots.
    solution: Peels are wet (biodegradable) waste.
    mistakes: {"dry waste": "v5_wet_waste"}
  - prompt: When should you wash your hands with soap?
    options:
    - before eating and after the toilet
    - only once a week
    - never
    - only after playing cricket
    answer: before eating and after the toilet
    difficulty: 1
    hints:
    - Germs on hands.
    - Two key times.
    solution: Wash before eating and after using the toilet.
    mistakes: {"only once a week": "v5_handwash"}
  - prompt: 'Paper and plastic go in the bin for:'
    options:
    - dry waste
    - wet waste
    - food
    - garden
    answer: dry waste
    difficulty: 1
    hints:
    - They don't rot quickly.
    - Can be recycled.
    solution: Paper and plastic are dry waste.
    mistakes: {"wet waste": "v5_dry_waste"}
  - prompt: 'During a fire drill you should:'
    options:
    - walk quickly and quietly to the exit
    - hide under the desk
    - run back for your bag
    - use the lift
    answer: walk quickly and quietly to the exit
    difficulty: 2
    hints:
    - Stay calm.
    - Follow the teacher.
    solution: Walk calmly to the exit following the teacher.
    mistakes: {"run back for your bag": "v5_fire_drill"}
  - prompt: Why walk, not run, in corridors?
    options:
    - to avoid falls and bumping into others
    - running is too slow
    - walking is noisy
    - to be late
    answer: to avoid falls and bumping into others
    difficulty: 1
    hints:
    - Corridors are busy.
    - Safety.
    solution: Running in busy corridors causes accidents.
    mistakes: {"running is too slow": "v5_corridor"}
  - prompt: 'You see a broken window in class. You should:'
    options:
    - tell a teacher
    - play with the glass
    - ignore it
    - throw a ball at it
    answer: tell a teacher
    difficulty: 1
    hints:
    - Glass can cut.
    - Adults can fix it.
    solution: Tell a teacher so it can be fixed safely.
    mistakes: {"ignore it": "v5_broken_glass"}
  - prompt: 'Leftover rice from lunch goes in the bin for:'
    options:
    - Wet waste
    - Dry waste
    - Glass
    answer: Wet waste
    difficulty: 1
    hints:
    - Food rots.
    - Which bin is for things that rot?
    solution: 'Step 1: rice is food and rots. Step 2: wet waste bin.'
    mistakes:
      Dry waste: c5v4_bin
      Glass: c5v4_bin
  - prompt: 'An empty plastic bottle goes in the bin for:'
    options:
    - Dry waste
    - Wet waste
    - The garden compost
    answer: Dry waste
    difficulty: 1
    hints:
    - Plastic does not rot.
    - It can be recycled.
    solution: 'Step 1: plastic stays the same for years. Step 2: dry waste bin.'
    mistakes:
      Wet waste: c5v4_bin
      The garden compost: c5v4_bin
  - prompt: 'Wet waste from school can be turned into:'
    options:
    - Compost for plants
    - New plastic
    - Glass bottles
    answer: Compost for plants
    difficulty: 2
    hints:
    - Wet waste rots in a pit.
    - It becomes rich soil.
    solution: 'Step 1: wet waste rots. Step 2: it becomes compost that feeds plants.'
    mistakes:
      New plastic: c5v4_bin
      Glass bottles: c5v4_bin
  - prompt: How long should you rub your hands with soap?
    options:
    - About 20 seconds
    - 1 second
    - 1 hour
    answer: About 20 seconds
    difficulty: 2
    hints:
    - Long enough to clean between fingers and nails.
    - About as long as singing a short song.
    solution: 'Step 1: a quick splash does not remove germs. Step 2: rub for about 20 seconds.'
    mistakes:
      1 second: c5v4_clean
      1 hour: c5v4_clean
  - prompt: 'When the fire alarm rings, you should:'
    options:
    - Leave calmly by the nearest exit
    - Hide under the desk
    - Go back for your bag
    answer: Leave calmly by the nearest exit
    difficulty: 2
    hints:
    - In a fire, getting out is most important.
    - Bags can be replaced.
    solution: 'Step 1: get out safely. Step 2: walk calmly to the nearest exit.'
    mistakes:
      Hide under the desk: c5v4_safe
      Go back for your bag: c5v4_safe
  - prompt: Why should you never push on the stairs?
    options:
    - Someone could fall and get hurt
    - Stairs will break
    - It makes the stairs dirty
    answer: Someone could fall and get hurt
    difficulty: 1
    hints:
    - Stairs are steep.
    - What happens if you lose balance?
    solution: 'Step 1: pushing on stairs can make someone trip. Step 2: they could be hurt.'
    mistakes:
      Stairs will break: c5v4_safe
      It makes the stairs dirty: c5v4_safe
  - prompt: Why should we flush the toilet after using it?
    options:
    - To keep it clean and stop germs spreading
