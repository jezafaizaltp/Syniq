# CBSE Class 5 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse5-evs
chapter: 4
title: Our School—A Happy Place
concepts:
- code: cbse5v.school.together
  title: Living and learning together
  notes: |
    School is a shared place: classrooms, playground, library, toilets and garden belong to everyone. Good habits:
    kindness, taking turns, listening, helping a classmate who finds something hard, including everyone in games. Each
    child learns in their own way and pace. Rules (queues, cleanliness) keep everyone safe and happy.
  explanations:
    text: A school is happy when everyone feels welcome. We take turns, listen to each other, help friends and include everyone in our games. Everyone learns differently, and that's okay.
    visual: Draw a playground circle game with children of different heights, one in a wheelchair, all holding hands.
    step_by_step: 'Step 1: Think how you would like to be treated. Step 2: Treat others the same way. Step 3: Notice who is left out and invite them.'
    real_world: Buddy systems, class helpers and ramps for wheelchairs make schools welcoming for all children.
  picture:
    kind: compare
    columns:
    - title: Helps everyone
      points:
      - taking turns
      - listening
      - including all
    - title: Hurts others
      points:
      - teasing
      - pushing in line
      - leaving someone out
    alt: Taking turns, listening and including everyone help a school; teasing, pushing in line and leaving someone out hurt others.
  activity:
    type: sort
    prompt: Is it kind and fair?
    bins:
    - Kind and fair
    - Not kind
    items:
    - label: Taking turns on the swing
      bin: Kind and fair
      clue: Does everyone get a go?
      why: Fair.
    - label: Helping a friend who can't see the board
      bin: Kind and fair
      clue: Moving so they can see, or reading it aloud.
      why: Kind.
    - label: Asking a new child to join your game
      bin: Kind and fair
      clue: How does the new child feel?
      why: Kind.
    - label: Listening when someone speaks
      bin: Kind and fair
      clue: Do they feel heard?
      why: Kind.
    - label: Laughing at someone's mistake
      bin: Not kind
      clue: How would you feel?
      why: Hurts feelings. Everyone makes mistakes.
    - label: Pushing ahead in the line
      bin: Not kind
      clue: Is it fair to the others waiting?
      why: Not fair.
    - label: Leaving a child out of a game
      bin: Not kind
      clue: How do they feel?
      why: Not kind.
    - label: Grabbing the ball from someone
      bin: Not kind
      clue: Did you ask?
      why: Not fair.
  items:
  - prompt: A new child sits alone at lunch. What is the kind thing to do?
    options:
    - invite them to sit with you
    - ignore them
    - laugh at them
    - tell others not to talk to them
    answer: invite them to sit with you
    difficulty: 1
    hints:
    - How would you feel alone?
    - Be a friend.
    solution: Inviting them makes them feel welcome.
    mistakes:
      ignore them: c5v_think
  - prompt: Why do we stand in a queue?
    options:
    - so everyone gets a fair turn
    - to waste time
    - to make noise
    - to push
    answer: so everyone gets a fair turn
    difficulty: 1
    hints:
    - Fair.
    - First come, first served.
    solution: Queues give everyone a fair turn safely.
  - prompt: 'A classmate finds a sum hard. You can:'
    options:
    - explain it kindly
    - make fun of them
    - do nothing ever
    - tear their book
    answer: explain it kindly
    difficulty: 1
    hints:
    - Help.
    - Be patient.
    solution: Helping kindly is what good friends do.
  - prompt: Who does the school library belong to?
    options:
    - everyone in the school
    - only the librarian
    - only Class 5
    - nobody
    answer: everyone in the school
    difficulty: 1
    hints:
    - It is shared.
    - All can use it.
    solution: Shared spaces belong to everyone.
  - prompt: 'Everyone learns:'
    options:
    - in their own way and at their own pace
    - exactly the same way
    - only by copying
    - only from books
    answer: in their own way and at their own pace
    difficulty: 2
    hints:
    - Some like pictures, some like doing.
    - Different.
    solution: Children learn in different ways and at different speeds.
  - prompt: How can a school welcome a child who uses a wheelchair?
    options:
    - build ramps and include them in activities
    - keep them in one room
    - stop them from playing
    - ask them to stay home
    answer: build ramps and include them in activities
    difficulty: 2
    hints:
    - Make places reachable.
    - Include in games.
    solution: Ramps and inclusion help every child take part.
- code: cbse5v.school.care
  title: A clean, safe school
  after:
  - cbse5v.school.together
  notes: |
    Keep school clean: use dustbins (wet and dry waste separately), keep toilets clean, wash hands with soap before eating
    and after the toilet. Safety: walk in corridors, know the fire drill and exits, tell a teacher about anything
    unsafe. A school garden teaches care for plants.
  explanations:
    text: A clean school keeps us healthy. Put waste in bins, wash hands with soap and keep toilets clean. To stay safe, walk, don't run in corridors, and know what to do in a fire drill.
    visual: 'Draw two dustbins: green for wet waste (peels, food) and blue for dry waste (paper, plastic).'
    step_by_step: 'Step 1: Before eating, wash hands with soap for 20 seconds. Step 2: Put waste in the right bin. Step 3: Report anything broken or unsafe.'
    real_world: Swachh Bharat drives in schools teach children to keep classrooms and toilets clean.
  picture:
    kind: flow
    steps:
    - Wet hands
    - Soap all over
    - Rub 20 seconds
    - Rinse
    - Dry
    alt: 'Washing hands: wet them, soap all over, rub for 20 seconds, rinse and dry.'
  activity:
    type: sort
    prompt: Does it keep the school clean and safe?
    bins:
    - Clean and safe
    - Not clean or safe
    items:
    - label: Putting wrappers in the bin
      bin: Clean and safe
      clue: Where does waste belong?
      why: Clean.
    - label: Washing hands with soap before eating
      bin: Clean and safe
      clue: Gets rid of germs.
      why: Healthy.
    - label: Walking in the corridors
      bin: Clean and safe
      clue: Less chance of falling.
      why: Safe.
    - label: Lining up calmly in a fire drill
      bin: Clean and safe
      clue: Everyone gets out in order.
      why: Safe.
    - label: Running down the stairs
      bin: Not clean or safe
      clue: Could you trip?
      why: Unsafe.
    - label: Throwing wrappers on the floor
      bin: Not clean or safe
      clue: Who has to pick it up?
      why: Dirty.
    - label: Playing with electric switches
      bin: Not clean or safe
      clue: Electricity can hurt.
      why: Unsafe.
    - label: Leaving the toilet tap running
      bin: Not clean or safe
      clue: Water spills and wastes.
      why: Wasteful and slippery.
  items:
  - prompt: 'Banana peels go in the bin for:'
    options:
    - wet waste
    - dry waste
    - glass
    - metal
    answer: wet waste
    difficulty: 1
    hints:
    - It is food waste.
    - It rots.
    solution: Peels are wet (biodegradable) waste.
  - prompt: When should you wash your hands with soap?
    options:
    - before eating and after the toilet
    - only once a week
    - never
    - only after playing cricket
    answer: before eating and after the toilet
    difficulty: 1
    hints:
    - Germs on hands.
    - Two key times.
    solution: Wash before eating and after using the toilet.
  - prompt: 'Paper and plastic go in the bin for:'
    options:
    - dry waste
    - wet waste
    - food
    - garden
    answer: dry waste
    difficulty: 1
    hints:
    - They don't rot quickly.
    - Can be recycled.
    solution: Paper and plastic are dry waste.
  - prompt: 'During a fire drill you should:'
    options:
    - walk quickly and quietly to the exit
    - hide under the desk
    - run back for your bag
    - use the lift
    answer: walk quickly and quietly to the exit
    difficulty: 2
    hints:
    - Stay calm.
    - Follow the teacher.
    solution: Walk calmly to the exit following the teacher.
  - prompt: Why walk, not run, in corridors?
    options:
    - to avoid falls and bumping into others
    - running is too slow
    - walking is noisy
    - to be late
    answer: to avoid falls and bumping into others
    difficulty: 1
    hints:
    - Corridors are busy.
    - Safety.
    solution: Running in busy corridors causes accidents.
  - prompt: 'You see a broken window in class. You should:'
    options:
    - tell a teacher
    - play with the glass
    - ignore it
    - throw a ball at it
    answer: tell a teacher
    difficulty: 1
    hints:
    - Glass can cut.
    - Adults can fix it.
    solution: Tell a teacher so it can be fixed safely.
