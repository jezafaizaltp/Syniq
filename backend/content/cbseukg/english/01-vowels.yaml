# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 1
title: 'Vowels: a, e, i, o, u'
tips:
  ukge_sound: Say the word slowly, sound by sound. Listen carefully.
  ukge_read: Point to each word and read it aloud slowly.
concepts:
- code: ukge.vowels
  title: 'Vowels: a, e, i, o, u'
  notes: |
    The five vowels a, e, i, o, u and their short sounds in words: apple, egg, ink, ox, umbrella.
  explanations:
    text: 'Five special letters are vowels: a, e, i, o, u. Every word needs a vowel. a for apple, e for egg, i for ink, o for ox, u for umbrella.'
    visual: 'Draw five boxes: apple, egg, ink pot, ox and umbrella, with the vowel on each.'
    step_by_step: 'Step 1: Say the word. Step 2: Listen to the first sound. Step 3: Is it a, e, i, o or u?'
    real_world: Look for vowels in your own name.
  picture:
    kind: compare
    columns:
    - title: Vowel
      points:
      - a
      - e
      - i
    - title: Word
      points:
      - 🍎 apple
      - 🥚 egg
      - 🖋️ ink
    alt: a for apple, e for egg, i for ink.
  activity:
    type: sort
    prompt: Which vowel does it start with?
    bins:
    - a
    - e
    - i
    - o
    - u
    items:
    - label: 🍎 apple
      bin: a
      clue: Say the word slowly. What is the very first sound?
      why: apple starts with the vowel a.
    - label: 🥚 egg
      bin: e
      clue: Say the word slowly. What is the very first sound?
      why: egg starts with e.
    - label: 🖋️ ink
      bin: i
      clue: Say the word slowly. What is the very first sound?
      why: ink starts with i.
    - label: 🐂 ox
      bin: o
      clue: Say the word slowly. What is the very first sound?
      why: ox starts with o.
    - label: ☂️ umbrella
      bin: u
      clue: Say the word slowly. What is the very first sound?
      why: umbrella starts with u.
  items:
  - prompt: Which is a vowel?
    options:
    - e
    - b
    - t
    answer: e
    difficulty: 1
    hints:
    - a, e, i, o, u.
    - Egg.
    solution: e is a vowel.
    mistakes:
      b: ukge_sound
  - prompt: Which word begins with the vowel u?
    options:
    - ☂️ umbrella
    - 🐱 cat
    - 🐕 dog
    answer: ☂️ umbrella
    difficulty: 1
    hints:
    - Say /u/.
    - Rain cover.
    solution: Umbrella begins with u.
  - prompt: Which word begins with the vowel o?
    options:
    - 🐂 ox
    - 🐝 bee
    - ⭐ star
    answer: 🐂 ox
    difficulty: 1
    hints:
    - Say /o/.
    - A farm animal.
    solution: Ox begins with o.
  - prompt: How many vowels are there?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - a, e, i, o, u.
    - Count them.
    solution: There are 5 vowels.
    mistakes:
      '26': ukge_sound
      '4': ukge_sound
  - prompt: Which is NOT a vowel?
    options:
    - m
    - a
    - i
    answer: m
    difficulty: 2
    hints:
    - 'Vowels: a, e, i, o, u.'
    - Which is missing from the list?
    solution: m is not a vowel.
  - prompt: Which vowel is in the middle of 'cat'?
    options:
    - a
    - o
    - u
    answer: a
    difficulty: 2
    hints:
    - c-a-t.
    - Say it slowly.
    solution: Cat has the vowel a.
