# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 1
title: 'Vowels: a, e, i, o, u'
tips:
  ukge_sound: Say the word slowly, sound by sound. Listen carefully.
  ukge_read: Point to each word and read it aloud slowly.
  kg_middle_sound: "Say c-a-t very slowly. Listen to the sound in the middle."
  kg_vowels: "Sing the vowel song: a, e, i, o, u. Which letter is not in the song?"
  uk1e_song: 'Sing the vowel song slowly: a, e, i, o, u. Is this letter in the song?'
  uk1e_first: Say the word slowly and listen only to the very first sound.
  uk1e_mid: Stretch the word like elastic. Listen for the sound in the middle.
concepts:
- code: ukge.vowels
  title: 'Vowels: a, e, i, o, u'
  notes: |
    The five vowels a, e, i, o, u and their short sounds in words: apple, egg, ink, ox, umbrella.
  explanations:
    text: 'Five special letters are vowels: a, e, i, o, u. Every word needs a vowel. a for apple, e for egg, i for ink, o for ox, u for umbrella.'
    visual: 'Draw five boxes: apple, egg, ink pot, ox and umbrella, with the vowel on each.'
    step_by_step: 'Step 1: Say the word. Step 2: Listen to the first sound. Step 3: Is it a, e, i, o or u?'
    real_world: Look for vowels in your own name.
  picture:
    kind: compare
    columns:
    - title: Vowel
      points:
      - a
      - e
      - i
    - title: Word
      points:
      - 🍎 apple
      - 🥚 egg
      - 🖋️ ink
    alt: a for apple, e for egg, i for ink.
  activity:
    type: sort
    prompt: Which vowel does it start with?
    bins:
    - a
    - e
    - i
    - o
    - u
    items:
    - label: 🍎 apple
      bin: a
      clue: Say the word slowly. What is the very first sound?
      why: apple starts with the vowel a.
    - label: 🥚 egg
      bin: e
      clue: Say the word slowly. What is the very first sound?
      why: egg starts with e.
    - label: 🖋️ ink
      bin: i
      clue: Say the word slowly. What is the very first sound?
      why: ink starts with i.
    - label: 🐂 ox
      bin: o
      clue: Say the word slowly. What is the very first sound?
      why: ox starts with o.
    - label: ☂️ umbrella
      bin: u
      clue: Say the word slowly. What is the very first sound?
      why: umbrella starts with u.
  lesson:
    - teach: 'Five special letters are called vowels: a, e, i, o, u. Every word needs at least one of them. Sing them like a song: a, e, i, o, u!'
      picture:
        kind: flow
        steps:
        - a
        - e
        - i
        - o
        - u
        alt: The five vowels in order.
      check:
        prompt: 'Which letter is a vowel: b, i or t?'
        options:
        - i
        - b
        - t
        answer: i
        why: i is one of the five vowels a, e, i, o, u.
    - teach: 'Each vowel has a short sound: a as in apple 🍎, e as in egg 🥚, i as in ink, o as in octopus 🐙, u as in umbrella ☂️.'
      picture:
        kind: compare
        columns:
        - title: Vowel
          points:
          - a
          - e
          - i
          - o
          - u
        - title: Word
          points:
          - apple
          - egg
          - ink
          - octopus
          - umbrella
        alt: Each vowel with a word that starts with its sound.
      check:
        prompt: Which word starts with the vowel e?
        options:
        - 🥚 egg
        - 🐟 fish
        - 🐄 cow
        answer: 🥚 egg
        why: 'e-gg: the first sound is e.'
    - teach: 'Vowels often sit in the middle of small words: c-a-t, h-e-n, p-i-g, d-o-g, s-u-n. Stretch the word to hear the middle sound.'
      check:
        prompt: Which vowel is in the middle of 'dog'?
        options:
        - o
        - a
        - u
        answer: o
        why: 'd-o-g: the middle sound is o.'
  items:
  - prompt: Which is a vowel?
    options:
    - e
    - b
    - t
    answer: e
    difficulty: 1
    hints:
    - a, e, i, o, u.
    - Egg.
    solution: e is a vowel.
    mistakes:
      b: ukge_sound
  - prompt: Which word begins with the vowel u?
    options:
    - ☂️ umbrella
    - 🐱 cat
    - 🐕 dog
    answer: ☂️ umbrella
    difficulty: 1
    hints:
    - Say /u/.
    - Rain cover.
    solution: Umbrella begins with u.
    mistakes: {"🐱 cat": "ukge_sound", "🐕 dog": "ukge_sound"}
  - prompt: Which word begins with the vowel o?
    options:
    - 🐂 ox
    - 🐝 bee
    - ⭐ star
    answer: 🐂 ox
    difficulty: 1
    hints:
    - Say /o/.
    - A farm animal.
    solution: Ox begins with o.
    mistakes: {"🐝 bee": "ukge_sound", "⭐ star": "ukge_sound"}
  - prompt: How many vowels are there?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - a, e, i, o, u.
    - Count them.
    solution: There are 5 vowels.
    mistakes:
      '26': ukge_sound
      '4': ukge_sound
  - prompt: Which is NOT a vowel?
    options:
    - m
    - a
    - i
    answer: m
    difficulty: 2
    hints:
    - 'Vowels: a, e, i, o, u.'
    - Which is missing from the list?
    solution: m is not a vowel.
    mistakes: {"a": "kg_vowels", "i": "kg_vowels"}
  - prompt: Which vowel is in the middle of 'cat'?
    options:
    - a
    - o
    - u
    answer: a
    difficulty: 2
    hints:
    - c-a-t.
    - Say it slowly.
    solution: Cat has the vowel a.
    mistakes: {"o": "kg_middle_sound", "u": "kg_middle_sound"}
  - prompt: Which word starts with the vowel a?
    options:
    - 🐜 ant
    - 🐝 bee
    - 🦁 lion
    answer: 🐜 ant
    difficulty: 1
    hints:
    - Say each word slowly.
    - Which begins like 'apple'?
    solution: 'Step 1: a-nt starts with a. Step 2: ant.'
    mistakes:
      🐝 bee: uk1e_first
      🦁 lion: uk1e_first
  - prompt: Which word starts with the vowel i?
    options:
    - 🦎 iguana
    - 🐊 crocodile
    - 🐍 snake
    answer: 🦎 iguana
    difficulty: 2
    hints:
    - Listen for the sound in 'ink'.
    - Say each first sound.
    solution: 'Step 1: i-guana starts with i. Step 2: iguana.'
    mistakes:
      🐊 crocodile: uk1e_first
      🐍 snake: uk1e_first
  - prompt: Which vowel is in the middle of 'sun'?
    options:
    - u
    - a
    - i
    answer: u
    difficulty: 2
    hints:
    - 'Stretch it: sss-...-nnn.'
    - Listen to the middle.
    solution: 'Step 1: s-u-n. Step 2: the middle vowel is u.'
    mistakes:
      a: uk1e_mid
      i: uk1e_mid
  - prompt: Which of these is NOT a vowel?
    options:
    - k
    - a
    - o
    answer: k
    difficulty: 1
    hints:
    - Sing the vowel song.
    - Which letter is not in it?
    solution: 'Step 1: vowels are a, e, i, o, u. Step 2: k is not one.'
    mistakes:
      a: uk1e_song
      o: uk1e_song
  - prompt: Which vowel is in the middle of 'pig'?
    options:
    - i
    - e
    - o
    answer: i
    difficulty: 2
    hints:
    - 'Stretch the word: p...g.'
    - Listen to the middle.
    solution: 'Step 1: p-i-g. Step 2: i.'
    mistakes:
      e: uk1e_mid
      o: uk1e_mid
  - prompt: Which word starts with the vowel o?
    options:
    - 🐙 octopus
    - 🐘 elephant
    - 🐢 turtle
    answer: 🐙 octopus
    difficulty: 1
    hints:
    - Say each first sound.
    - o as in 'ox'.
    solution: 'Step 1: o-ctopus starts with o. Step 2: octopus.'
    mistakes:
      🐘 elephant: uk1e_first
      🐢 turtle: uk1e_first
  - prompt: Which vowel comes just after e in the vowel song?
    options:
    - i
    - a
    - o
    answer: i
    difficulty: 3
    hints:
    - 'Sing it slowly: a, e, ...'
    - Listen for what comes after e.
    solution: 'Step 1: a, e, i, o, u. Step 2: after e comes i.'
    mistakes:
      a: uk1e_song
      o: uk1e_song
  - prompt: Which vowel is in the middle of 'hen'?
    options:
    - e
    - a
    - u
    answer: e
    difficulty: 2
    hints:
    - 'Stretch it: h...n.'
    - Middle sound as in 'egg'.
    solution: 'Step 1: h-e-n. Step 2: e.'
    mistakes:
      a: uk1e_mid
      u: uk1e_mid
  - prompt: How many vowels are in 'bus'?
    options:
    - '1'
    - '2'
    - '3'
    answer: '1'
    difficulty: 3
    hints:
    - Look at each letter. Is it in the vowel song?
    - 'b, u, s: check each one.'
    solution: 'Step 1: b and s are not vowels. Step 2: only u, so 1.'
    mistakes:
      '2': uk1e_song
      '3': uk1e_song
