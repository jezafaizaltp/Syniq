# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 8
title: Action Words
tips:
  kg_action: "An action word is something you can do. Try to do it now! Can you 'ball'?"
  kg_can_do: "Think of what this animal's body has: wings, fins or long legs? What can it do with them?"

concepts:
- code: ukge.action
  title: Action Words
  notes: |
    Action words (verbs): run, jump, eat, sleep, sing, swim; matching actions to pictures and animals.
  explanations:
    text: 'Action words tell what someone does: run, jump, eat, sleep, sing, swim. A fish can swim. A bird can fly.'
    visual: Draw a child jumping, a fish swimming and a bird flying.
    step_by_step: 'Step 1: Look at the picture. Step 2: What is it doing? Step 3: Say the action word.'
    real_world: 'Play ''Simon says'': jump, clap, sit!'
  picture:
    kind: compare
    columns:
    - title: Who
      points:
      - 🐟 fish
      - 🐦 bird
      - 🐇 rabbit
    - title: Action
      points:
      - swim
      - fly
      - hop
    alt: A fish can swim, a bird can fly and a rabbit can hop.
  activity:
    type: sort
    prompt: What does it do?
    bins:
    - swim
    - fly
    - jump
    items:
    - label: 🐟 fish
      bin: swim
      clue: In water.
      why: Fish swim.
    - label: 🐦 bird
      bin: fly
      clue: In the sky.
      why: Birds fly.
    - label: 🐸 frog
      bin: jump
      clue: Hop hop.
      why: Frogs jump.
    - label: 🦋 butterfly
      bin: fly
      clue: Flutters.
      why: Butterflies fly.
  items:
  - prompt: 'A fish can:'
    options:
    - swim
    - fly
    - climb
    answer: swim
    difficulty: 1
    hints:
    - In water.
    - Fins.
    solution: A fish can swim.
    mistakes:
      fly: ukge_read
  - prompt: 'A bird can:'
    options:
    - fly
    - swim
    - dig
    answer: fly
    difficulty: 1
    hints:
    - Wings.
    - In the sky.
    solution: A bird can fly.
    mistakes: {"swim": "kg_can_do", "dig": "kg_can_do"}
  - prompt: Which is an action word?
    options:
    - jump
    - ball
    - red
    answer: jump
    difficulty: 1
    hints:
    - Something you do.
    - Up and down.
    solution: Jump is an action word.
    mistakes: {"ball": "kg_action", "red": "kg_action"}
  - prompt: We ___ at night.
    options:
    - sleep
    - swim
    - fly
    answer: sleep
    difficulty: 2
    hints:
    - Bed time.
    - Close your eyes.
    solution: We sleep at night.
    mistakes: {"swim": "kg_sleep_time", "fly": "kg_sleep_time"}
  - prompt: 'A rabbit can:'
    options:
    - hop
    - fly
    - swim fast
    answer: hop
    difficulty: 2
    hints:
    - Long ears.
    - Jumps.
    solution: A rabbit can hop.
    mistakes: {"fly": "kg_can_do", "swim fast": "kg_can_do"}
  - prompt: Which is NOT an action word?
    options:
    - chair
    - run
    - sing
    answer: chair
    difficulty: 2
    hints:
    - Can you do it?
    - You sit on it.
    solution: Chair is a thing, not an action.
    mistakes: {"run": "kg_action", "sing": "kg_action"}
