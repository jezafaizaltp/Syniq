# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 8
title: Action Words
tips:
  kg_action: "An action word is something you can do. Try to do it now! Can you 'ball'?"
  kg_can_do: "Think of what this animal's body has: wings, fins or long legs? What can it do with them?"
  uk8e_do: Can you DO it with your body? Try acting it out.
  uk8e_animal: Picture the animal. How does it move or what sound does it make?
  uk8e_when: Think about your day. When do you do this?

concepts:
- code: ukge.action
  title: Action Words
  notes: |
    Action words (verbs): run, jump, eat, sleep, sing, swim; matching actions to pictures and animals.
  explanations:
    text: 'Action words tell what someone does: run, jump, eat, sleep, sing, swim. A fish can swim. A bird can fly.'
    visual: Draw a child jumping, a fish swimming and a bird flying.
    step_by_step: 'Step 1: Look at the picture. Step 2: What is it doing? Step 3: Say the action word.'
    real_world: 'Play ''Simon says'': jump, clap, sit!'
  picture:
    kind: compare
    columns:
    - title: Who
      points:
      - 🐟 fish
      - 🐦 bird
      - 🐇 rabbit
    - title: Action
      points:
      - swim
      - fly
      - hop
    alt: A fish can swim, a bird can fly and a rabbit can hop.
  activity:
    type: sort
    prompt: What does it do?
    bins:
    - swim
    - fly
    - jump
    items:
    - label: 🐟 fish
      bin: swim
      clue: In water.
      why: Fish swim.
    - label: 🐦 bird
      bin: fly
      clue: In the sky.
      why: Birds fly.
    - label: 🐸 frog
      bin: jump
      clue: Hop hop.
      why: Frogs jump.
    - label: 🦋 butterfly
      bin: fly
      clue: Flutters.
      why: Butterflies fly.
  lesson:
    - teach: 'Action words tell what we do: run, jump, eat, sleep, sing, clap. If you can act it out, it is an action word!'
      check:
        prompt: Which word can you act out?
        options:
        - clap
        - table
        - red
        answer: clap
        why: You can clap your hands; you cannot 'table'.
    - teach: 'Animals do actions too: a fish swims, a bird flies, a frog jumps, a dog barks, a cow moos.'
      picture:
        kind: compare
        columns:
        - title: Animal
          points:
          - fish
          - bird
          - frog
        - title: Action
          points:
          - swims
          - flies
          - jumps
        alt: Animals and what they do.
      check:
        prompt: What can a frog do?
        options:
        - jump
        - fly
        - read
        answer: jump
        why: Frogs jump with their strong back legs.
    - teach: 'We do actions at different times: we eat breakfast in the morning, we play in the evening, we sleep at night.'
      check:
        prompt: What do we do with food?
        options:
        - eat
        - sleep
        - swim
        answer: eat
        why: Food is for eating.
  items:
  - prompt: 'A fish can:'
    options:
    - swim
    - fly
    - climb
    answer: swim
    difficulty: 1
    hints:
    - In water.
    - Fins.
    solution: A fish can swim.
    mistakes:
      fly: ukge_read
  - prompt: 'A bird can:'
    options:
    - fly
    - swim
    - dig
    answer: fly
    difficulty: 1
    hints:
    - Wings.
    - In the sky.
    solution: A bird can fly.
    mistakes: {"swim": "kg_can_do", "dig": "kg_can_do"}
  - prompt: Which is an action word?
    options:
    - jump
    - ball
    - red
    answer: jump
    difficulty: 1
    hints:
    - Something you do.
    - Up and down.
    solution: Jump is an action word.
    mistakes: {"ball": "kg_action", "red": "kg_action"}
  - prompt: We ___ at night.
    options:
    - sleep
    - swim
    - fly
    answer: sleep
    difficulty: 2
    hints:
    - Bed time.
    - Close your eyes.
    solution: We sleep at night.
    mistakes: {"swim": "kg_sleep_time", "fly": "kg_sleep_time"}
  - prompt: 'A rabbit can:'
    options:
    - hop
    - fly
    - swim fast
    answer: hop
    difficulty: 2
    hints:
    - Long ears.
    - Jumps.
    solution: A rabbit can hop.
    mistakes: {"fly": "kg_can_do", "swim fast": "kg_can_do"}
  - prompt: Which is NOT an action word?
    options:
    - chair
    - run
    - sing
    answer: chair
    difficulty: 2
    hints:
    - Can you do it?
    - You sit on it.
    solution: Chair is a thing, not an action.
    mistakes: {"run": "kg_action", "sing": "kg_action"}
  - prompt: 'A dog can:'
    options:
    - bark
    - fly
    - swim like a fish all day
    answer: bark
    difficulty: 1
    hints:
    - What sound does a dog make?
    - Woof!
    solution: 'Step 1: a dog says woof. Step 2: it barks.'
    mistakes:
      fly: uk8e_animal
      swim like a fish all day: uk8e_animal
  - prompt: Pick the action word.
    options:
    - sing
    - book
    - blue
    answer: sing
    difficulty: 1
    hints:
    - Try to do each one.
    - Which can you do with your voice?
    solution: 'Step 1: book is a thing, blue is a colour. Step 2: sing is an action.'
    mistakes:
      book: uk8e_do
      blue: uk8e_do
  - prompt: We ___ our teeth in the morning.
    options:
    - brush
    - sleep
    - fly
    answer: brush
    difficulty: 2
    hints:
    - What do you do with a toothbrush?
    - Up and down, side to side.
    solution: 'Step 1: toothbrush. Step 2: we brush our teeth.'
    mistakes:
      sleep: uk8e_when
      fly: uk8e_do
  - prompt: 'A duck can:'
    options:
    - swim
    - read
    - write
    answer: swim
    difficulty: 1
    hints:
    - Where do ducks spend time?
    - They paddle in the pond.
    solution: 'Step 1: ducks live near water. Step 2: they swim.'
    mistakes:
      read: uk8e_animal
      write: uk8e_animal
  - prompt: Which word is a thing, not an action?
    options:
    - spoon
    - kick
    - dance
    answer: spoon
    difficulty: 2
    hints:
    - Try to act out each one.
    - Which is a thing you hold?
    solution: 'Step 1: kick and dance are actions. Step 2: spoon is a thing.'
    mistakes:
      kick: uk8e_do
      dance: uk8e_do
  - prompt: We ___ a book.
    options:
    - read
    - drink
    - sleep
    answer: read
    difficulty: 2
    hints:
    - What do your eyes do with words?
    - Look and say the words.
    solution: 'Step 1: books have words. Step 2: we read them.'
    mistakes:
      drink: uk8e_do
      sleep: uk8e_when
  - prompt: 'A snake can:'
    options:
    - crawl
    - jump high
    - fly
    answer: crawl
    difficulty: 2
    hints:
    - A snake has no legs.
    - It moves along the ground.
    solution: 'Step 1: no legs. Step 2: it crawls.'
    mistakes:
      jump high: uk8e_animal
      fly: uk8e_animal
  - prompt: Which two words are both action words?
    options:
    - run and eat
    - run and chair
    - cup and eat
    answer: run and eat
    difficulty: 3
    hints:
    - Both words must be things you can do.
    - Check each word.
    solution: 'Step 1: chair and cup are things. Step 2: run and eat are both actions.'
    mistakes:
      run and chair: uk8e_do
      cup and eat: uk8e_do
  - prompt: 'When the music plays, we:'
    options:
    - dance
    - sleep
    - cry
    answer: dance
    difficulty: 3
    hints:
    - Move your body to the beat.
    - Fun with music.
    solution: 'Step 1: music makes us move. Step 2: dance.'
    mistakes:
      sleep: uk8e_when
      cry: uk8e_when
