# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 3
title: 'Words with e: hen, pen, ten'
concepts:
- code: ukge.cvce
  title: 'Words with e: hen, pen, ten'
  notes: |
    Three-letter words with the short vowel e: hen, pen, ten, den. Sounding out and blending.
  explanations:
    text: 'Let''s read words with e in the middle. Sound out each letter and blend: h-e-n = hen, p-e-n = pen, t-e-n = ten.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - h
    - e
    - n
    - hen
    alt: 'Blending: h then e then n makes hen.'
  activity:
    type: sort
    prompt: Which -en word is it?
    bins:
    - hen
    - pen
    - ten
    items:
    - label: 🐔
      bin: hen
      clue: h-e-n.
      why: 'h-e-n: hen.'
    - label: 🖊️
      bin: pen
      clue: p-e-n.
      why: 'p-e-n: pen.'
    - label: 🔟
      bin: ten
      clue: t-e-n.
      why: 't-e-n: ten.'
    - label: 🐓 a mother bird on a farm
      bin: hen
      clue: Lays eggs.
      why: A hen lays eggs.
  items:
  - prompt: 'Read it: hen'
    options:
    - 🐔
    - 🖊️
    - 🔟
    answer: 🐔
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: hen is 🐔.
    mistakes:
      🖊️: ukge_read
  - prompt: 'Read it: pen'
    options:
    - 🖊️
    - 🐔
    - 🔟
    answer: 🖊️
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: pen is 🖊️.
    mistakes:
      🐔: ukge_read
  - prompt: Which word has the e sound in the middle?
    options:
    - ten
    - cup
    - fig
    answer: ten
    difficulty: 1
    hints:
    - Listen for /e/.
    - Say each word slowly.
    solution: ten has e in the middle.
    mistakes:
      cup: ukge_sound
  - prompt: Which word rhymes with hen?
    options:
    - den
    - cup
    - fig
    answer: den
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: hen and den rhyme.
    mistakes:
      fig: ukge_sound
  - prompt: Which letter is missing? p_n (🖊️)
    options:
    - e
    - x
    - z
    answer: e
    difficulty: 2
    hints:
    - It is a vowel.
    - Say pen slowly.
    solution: pen needs e.
    mistakes: {"x": "kg_middle_sound2", "z": "kg_middle_sound2"}
  - prompt: How many letters are in 'ten'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: ten has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
