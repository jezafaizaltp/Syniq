# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 3
title: 'Words with e: hen, pen, ten'
tips:
  uk3e_blend: Say each sound slowly, then push them together faster and faster.
  uk3e_rhyme: Words that rhyme end the same. Say the end part of each word.
  uk3e_mid: Stretch the word. Is the middle sound like the one in 'egg'?
concepts:
- code: ukge.cvce
  title: 'Words with e: hen, pen, ten'
  notes: |
    Three-letter words with the short vowel e: hen, pen, ten, den. Sounding out and blending.
  explanations:
    text: 'Let''s read words with e in the middle. Sound out each letter and blend: h-e-n = hen, p-e-n = pen, t-e-n = ten.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - h
    - e
    - n
    - hen
    alt: 'Blending: h then e then n makes hen.'
  activity:
    type: sort
    prompt: Which -en word is it?
    bins:
    - hen
    - pen
    - ten
    items:
    - label: 🐔
      bin: hen
      clue: h-e-n.
      why: 'h-e-n: hen.'
    - label: 🖊️
      bin: pen
      clue: p-e-n.
      why: 'p-e-n: pen.'
    - label: 🔟
      bin: ten
      clue: t-e-n.
      why: 't-e-n: ten.'
    - label: 🐓 a mother bird on a farm
      bin: hen
      clue: Lays eggs.
      why: A hen lays eggs.
  lesson:
    - teach: 'Many small words have the e sound in the middle: h-e-n, p-e-n, t-e-n, n-e-t. Say each sound, then blend: h-e-n, hen!'
      picture:
        kind: flow
        steps:
        - h
        - e
        - n
        - hen
        alt: Blending h, e, n into hen.
      check:
        prompt: 'Blend the sounds: b-e-d. What word?'
        options:
        - bed
        - bad
        - bud
        answer: bed
        why: 'b, then e, then d: bed.'
    - teach: 'Words that end in -en rhyme: hen, pen, ten, men, den. Words that end in -et rhyme too: net, wet, jet, pet.'
      check:
        prompt: Which word rhymes with 'net'?
        options:
        - wet
        - nut
        - nest
        answer: wet
        why: n-et and w-et both end in -et.
    - teach: 'More e words: leg 🦵, red 🔴, web 🕸️, jet ✈️. Listen: the middle sound is always e as in egg.'
      check:
        prompt: 'Listen: which word has e in the middle?'
        options:
        - leg
        - log
        - lag
        answer: leg
        why: 'l-e-g: the middle sound is e.'
  items:
  - prompt: 'Read it: hen'
    options:
    - 🐔
    - 🖊️
    - 🔟
    answer: 🐔
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: hen is 🐔.
    mistakes:
      🖊️: ukge_read
  - prompt: 'Read it: pen'
    options:
    - 🖊️
    - 🐔
    - 🔟
    answer: 🖊️
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: pen is 🖊️.
    mistakes:
      🐔: ukge_read
  - prompt: Which word has the e sound in the middle?
    options:
    - ten
    - cup
    - fig
    answer: ten
    difficulty: 1
    hints:
    - Listen for /e/.
    - Say each word slowly.
    solution: ten has e in the middle.
    mistakes:
      cup: ukge_sound
  - prompt: Which word rhymes with hen?
    options:
    - den
    - cup
    - fig
    answer: den
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: hen and den rhyme.
    mistakes:
      fig: ukge_sound
  - prompt: Which letter is missing? p_n (🖊️)
    options:
    - e
    - x
    - z
    answer: e
    difficulty: 2
    hints:
    - It is a vowel.
    - Say pen slowly.
    solution: pen needs e.
    mistakes: {"x": "kg_middle_sound2", "z": "kg_middle_sound2"}
  - prompt: How many letters are in 'ten'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: ten has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
  - prompt: 'Read it: bed'
    options:
    - 🛏️
    - 🐝
    - 🦇
    answer: 🛏️
    difficulty: 1
    hints:
    - 'Sound it out: b-e-d.'
    - You sleep on it.
    solution: 'Step 1: b-e-d. Step 2: a bed.'
    mistakes:
      🐝: uk3e_blend
      🦇: uk3e_mid
  - prompt: Which letter is missing? h_n (🐔)
    options:
    - e
    - a
    - i
    answer: e
    difficulty: 1
    hints:
    - Say 'hen' slowly.
    - Listen to the middle.
    solution: 'Step 1: h-e-n. Step 2: e.'
    mistakes:
      a: uk3e_mid
      i: uk3e_mid
  - prompt: 'Read it: web'
    options:
    - 🕸️
    - 🌊
    - 🐋
    answer: 🕸️
    difficulty: 2
    hints:
    - 'Sound it out: w-e-b.'
    - A spider makes it.
    solution: 'Step 1: w-e-b. Step 2: a web.'
    mistakes:
      🌊: uk3e_blend
      🐋: uk3e_blend
  - prompt: Which word rhymes with 'pen'?
    options:
    - men
    - pin
    - pet
    answer: men
    difficulty: 2
    hints:
    - 'Say the end part: -en.'
    - Which ends the same?
    solution: 'Step 1: p-en. Step 2: m-en rhymes.'
    mistakes:
      pin: uk3e_rhyme
      pet: uk3e_rhyme
  - prompt: 'Blend the sounds: j-e-t. What word?'
    options:
    - jet
    - jot
    - jam
    answer: jet
    difficulty: 1
    hints:
    - Say each sound.
    - Push them together.
    solution: 'Step 1: j, e, t. Step 2: jet.'
    mistakes:
      jot: uk3e_mid
      jam: uk3e_blend
  - prompt: What colour is 🔴? Pick the e word.
    options:
    - red
    - rod
    - rid
    answer: red
    difficulty: 2
    hints:
    - Say the colour name slowly.
    - The middle sound is like 'egg'.
    solution: 'Step 1: r-e-d. Step 2: red.'
    mistakes:
      rod: uk3e_mid
      rid: uk3e_mid
  - prompt: Change t in 'ten' to h. What word?
    options:
    - hen
    - hat
    - tan
    answer: hen
    difficulty: 2
    hints:
    - Keep -en the same.
    - Put the new sound in front.
    solution: 'Step 1: h + en. Step 2: hen.'
    mistakes:
      hat: uk3e_blend
      tan: uk3e_mid
  - prompt: Which word does NOT rhyme with 'wet'?
    options:
    - web
    - pet
    - jet
    answer: web
    difficulty: 3
    hints:
    - Rhyming words end in -et.
    - Say each one's ending.
    solution: 'Step 1: pet and jet end in -et. Step 2: web ends in -eb.'
    mistakes:
      pet: uk3e_rhyme
      jet: uk3e_rhyme
  - prompt: Which word fits? 'I write with a ___.' (🖊️)
    options:
    - pen
    - pan
    - pin
    answer: pen
    difficulty: 3
    hints:
    - Look at the picture.
    - The middle sound is like 'egg'.
    solution: 'Step 1: the picture is a pen. Step 2: p-e-n.'
    mistakes:
      pan: uk3e_mid
      pin: uk3e_mid
