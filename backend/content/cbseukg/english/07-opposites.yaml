# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 7
title: Opposites
tips:
  uk7e_opp: An opposite is the other end. Act out the first word, then do the very other thing.
  uk7e_same: Is this word the other end, or does it mean nearly the same?
  uk7e_pic: Picture both words. Which picture is the very other way?
concepts:
- code: ukge.opp
  title: Opposites
  notes: |
    Simple opposites: big-small, hot-cold, up-down, happy-sad, open-close, day-night.
  explanations:
    text: 'Opposites are words that mean very different things: big and small, hot and cold, up and down.'
    visual: Draw a hot cup of tea and a cold ice-cream side by side.
    step_by_step: 'Step 1: Read the word. Step 2: Think of the very different word. Step 3: Say them as a pair.'
    real_world: Open the door to go out; close it when you come in.
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - big
      - hot
      - up
    - title: Opposite
      points:
      - small
      - cold
      - down
    alt: Big and small, hot and cold, up and down are opposites.
  activity:
    type: sort
    prompt: Find the opposite.
    bins:
    - small
    - cold
    - down
    - sad
    items:
    - label: big
      bin: small
      clue: Size.
      why: Big and small are opposites.
    - label: hot
      bin: cold
      clue: Temperature.
      why: Hot and cold are opposites.
    - label: up
      bin: down
      clue: Direction.
      why: Up and down are opposites.
    - label: happy
      bin: sad
      clue: Feelings.
      why: Happy and sad are opposites.
  lesson:
    - teach: 'Opposites are pairs of words that mean the very other thing: big and small, hot and cold, up and down.'
      picture:
        kind: compare
        columns:
        - title: Word
          points:
          - big
          - hot
          - up
        - title: Opposite
          points:
          - small
          - cold
          - down
        alt: Three pairs of opposites.
      check:
        prompt: What is the opposite of up?
        options:
        - down
        - 'on'
        - big
        answer: down
        why: Up points to the sky; down points to the ground.
      ways:
      - style: step_by_step
        teach: 'Act out high and low. First: stretch your arms high above your head. Second: say high. Third: crouch down and touch the floor. Fourth: say low, the opposite of high.'
      - style: real_world
        teach: On a swing you go high, then low, then high again, again and again.
    - teach: We can act out opposites! Open your hands, then close them. Stand tall, then sit short. Run fast, then walk slow.
      check:
        prompt: Open your eyes. Now do the opposite. What did you do?
        options:
        - close them
        - open them wider
        - blink once
        answer: close them
        why: The opposite of open is close.
      ways:
      - style: visual
        teach: More pairs of opposites that you can act out with your body.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - loud
            - near
            - give
            - front
          - title: Opposite
            points:
            - soft
            - far
            - take
            - back
          alt: Loud and soft, near and far, give and take, front and back are opposites.
      - style: step_by_step
        teach: 'Play a loud and soft game. First: clap your hands loudly. Second: say loud. Third: clap very gently. Fourth: say soft, the opposite of loud.'
    - teach: 'Feelings and times have opposites too: happy and sad, day and night, full and empty, wet and dry.'
      check:
        prompt: What is the opposite of full?
        options:
        - empty
        - big
        - heavy
        answer: empty
        why: A full glass has lots; an empty glass has none.
      ways:
      - style: visual
        teach: Opposites for how we feel and for the times of the day.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - awake
            - early
            - light
          - title: Opposite
            points:
            - asleep
            - late
            - dark
          alt: Awake and asleep, early and late, light and dark are opposites.
      - style: real_world
        teach: In the morning you are awake, and at bedtime you fall asleep.
  items:
  - prompt: 'The opposite of hot is:'
    options:
    - cold
    - big
    - wet
    answer: cold
    difficulty: 1
    hints:
    - Ice.
    - Not hot.
    solution: Cold is the opposite of hot.
    mistakes:
      big: ukge_read
  - prompt: 'The opposite of big is:'
    options:
    - small
    - tall
    - fat
    answer: small
    difficulty: 1
    hints:
    - Tiny.
    - Not big.
    solution: Small is the opposite of big.
    mistakes: {"tall": "kg_opposite", "fat": "kg_opposite"}
  - prompt: 'The opposite of open is:'
    options:
    - close
    - push
    - door
    answer: close
    difficulty: 1
    hints:
    - Shut it.
    - Not open.
    solution: Close is the opposite of open.
    mistakes: {"push": "kg_opposite", "door": "kg_opposite"}
  - prompt: 'The opposite of happy is:'
    options:
    - sad
    - glad
    - funny
    answer: sad
    difficulty: 2
    hints:
    - Crying.
    - Not happy.
    solution: Sad is the opposite of happy.
    mistakes: {"glad": "kg_opposite", "funny": "kg_opposite"}
  - prompt: 'The opposite of day is:'
    options:
    - night
    - sun
    - morning
    answer: night
    difficulty: 2
    hints:
    - Moon time.
    - Dark.
    solution: Night is the opposite of day.
    mistakes: {"sun": "kg_opposite", "morning": "kg_opposite"}
  - prompt: 'The opposite of fast is:'
    options:
    - slow
    - quick
    - run
    answer: slow
    difficulty: 2
    hints:
    - Like a tortoise.
    - Not fast.
    solution: Slow is the opposite of fast.
    mistakes: {"quick": "kg_opposite", "run": "kg_opposite"}
  - prompt: What is the opposite of wet?
    options:
    - dry
    - cold
    - clean
    answer: dry
    difficulty: 1
    hints:
    - Think of a towel after a bath, then later in the sun.
    - No water at all.
    solution: 'Step 1: wet has water. Step 2: dry has none.'
    mistakes:
      cold: uk7e_same
      clean: uk7e_pic
  - prompt: What is the opposite of tall?
    options:
    - short
    - thin
    - long
    answer: short
    difficulty: 1
    hints:
    - Stand on your toes, then crouch down.
    - A giraffe and a mouse.
    solution: 'Step 1: tall goes high. Step 2: short stays low.'
    mistakes:
      thin: uk7e_pic
      long: uk7e_same
  - prompt: What is the opposite of in?
    options:
    - out
    - 'on'
    - up
    answer: out
    difficulty: 2
    hints:
    - Go into the room, then leave it.
    - The other side of the door.
    solution: 'Step 1: in is inside. Step 2: out is outside.'
    mistakes:
      'on': uk7e_opp
      up: uk7e_opp
  - prompt: 'The glass is full. Drink it all. Now it is:'
    options:
    - empty
    - full
    - heavy
    answer: empty
    difficulty: 2
    hints:
    - Is anything left inside?
    - The other end from full.
    solution: 'Step 1: all gone. Step 2: empty.'
    mistakes:
      full: uk7e_opp
      heavy: uk7e_pic
  - prompt: What is the opposite of clean?
    options:
    - dirty
    - wet
    - new
    answer: dirty
    difficulty: 2
    hints:
    - Think of hands after playing in mud.
    - The very other way from clean.
    solution: 'Step 1: clean has no mud. Step 2: dirty.'
    mistakes:
      wet: uk7e_pic
      new: uk7e_pic
  - prompt: Which pair are opposites?
    options:
    - hot and cold
    - big and huge
    - small and tiny
    answer: hot and cold
    difficulty: 3
    hints:
    - Opposites are the other end, not the same.
    - Do the two words mean the same thing?
    solution: 'Step 1: big-huge and small-tiny mean nearly the same. Step 2: hot and cold are opposites.'
    mistakes:
      big and huge: uk7e_same
      small and tiny: uk7e_same
  - prompt: What is the opposite of push?
    options:
    - pull
    - hit
    - kick
    answer: pull
    difficulty: 3
    hints:
    - Act it out with a door.
    - Bring it towards you.
    solution: 'Step 1: push moves it away. Step 2: pull brings it near.'
    mistakes:
      hit: uk7e_opp
      kick: uk7e_opp
  - prompt: What is the opposite of old?
    options:
    - new
    - big
    - sad
    answer: new
    difficulty: 2
    hints:
    - Think of a shoe you just bought.
    - Not used before.
    solution: 'Step 1: old has been used a long time. Step 2: new.'
    mistakes:
      big: uk7e_pic
      sad: uk7e_pic
  - prompt: What is the opposite of come?
    options:
    - go
    - run
    - sit
    answer: go
    difficulty: 1
    hints:
    - Wave hello, then wave bye-bye.
    - Move away.
    solution: 'Step 1: come is towards. Step 2: go is away.'
    mistakes:
      run: uk7e_opp
      sit: uk7e_opp
  - prompt: 'Case: Asha''s storybook is very thick. A friend''s book has only a few pages. What is the friend''s book?'
    options:
    - thin
    - thick
    - tall
    answer: thin
    hints:
    - The friend's book is the other way from Asha's.
    - What is the very other end of thick?
    solution: The opposite of thick is thin, so the friend's book is thin.
    mistakes:
      thick: uk7e_opp
      tall: uk7e_opp
    exam: case
    difficulty: 2
  - prompt: 'Situation: At lunch, Ravi tastes a sweet laddoo and then a sour lemon. Which pair are opposites?'
    options:
    - sweet and sour
    - sweet and sugary
    - sour and lemony
    answer: sweet and sour
    hints:
    - Do the words mean nearly the same, or the other end?
    - Which pair is as different as possible?
    solution: Sweet and sour are opposite tastes. The other pairs mean nearly the same.
    mistakes:
      sweet and sugary: uk7e_same
      sour and lemony: uk7e_same
    exam: competency
    difficulty: 2
