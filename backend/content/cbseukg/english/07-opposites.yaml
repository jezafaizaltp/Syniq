# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 7
title: Opposites
concepts:
- code: ukge.opp
  title: Opposites
  notes: |
    Simple opposites: big-small, hot-cold, up-down, happy-sad, open-close, day-night.
  explanations:
    text: 'Opposites are words that mean very different things: big and small, hot and cold, up and down.'
    visual: Draw a hot cup of tea and a cold ice-cream side by side.
    step_by_step: 'Step 1: Read the word. Step 2: Think of the very different word. Step 3: Say them as a pair.'
    real_world: Open the door to go out; close it when you come in.
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - big
      - hot
      - up
    - title: Opposite
      points:
      - small
      - cold
      - down
    alt: Big and small, hot and cold, up and down are opposites.
  items:
  - prompt: 'The opposite of hot is:'
    options:
    - cold
    - big
    - wet
    answer: cold
    difficulty: 1
    hints:
    - Ice.
    - Not hot.
    solution: Cold is the opposite of hot.
    mistakes:
      big: ukge_read
  - prompt: 'The opposite of big is:'
    options:
    - small
    - tall
    - fat
    answer: small
    difficulty: 1
    hints:
    - Tiny.
    - Not big.
    solution: Small is the opposite of big.
  - prompt: 'The opposite of open is:'
    options:
    - close
    - push
    - door
    answer: close
    difficulty: 1
    hints:
    - Shut it.
    - Not open.
    solution: Close is the opposite of open.
  - prompt: 'The opposite of happy is:'
    options:
    - sad
    - glad
    - funny
    answer: sad
    difficulty: 2
    hints:
    - Crying.
    - Not happy.
    solution: Sad is the opposite of happy.
  - prompt: 'The opposite of day is:'
    options:
    - night
    - sun
    - morning
    answer: night
    difficulty: 2
    hints:
    - Moon time.
    - Dark.
    solution: Night is the opposite of day.
  - prompt: 'The opposite of fast is:'
    options:
    - slow
    - quick
    - run
    answer: slow
    difficulty: 2
    hints:
    - Like a tortoise.
    - Not fast.
    solution: Slow is the opposite of fast.
