# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 4
title: 'Words with i: pig, wig, fig'
concepts:
- code: ukge.cvci
  title: 'Words with i: pig, wig, fig'
  notes: |
    Three-letter words with the short vowel i: pig, pin, fig, wig. Sounding out and blending.
  explanations:
    text: 'Let''s read words with i in the middle. Sound out each letter and blend: p-i-g = pig, p-i-n = pin, f-i-g = fig.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - p
    - i
    - g
    - pig
    alt: 'Blending: p then i then g makes pig.'
  items:
  - prompt: 'Read it: pig'
    options:
    - 🐷
    - 📌
    - 🍈
    answer: 🐷
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: pig is 🐷.
    mistakes:
      📌: ukge_read
  - prompt: 'Read it: pin'
    options:
    - 📌
    - 🐷
    - 🍈
    answer: 📌
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: pin is 📌.
    mistakes:
      🐷: ukge_read
  - prompt: Which word has the i sound in the middle?
    options:
    - fig
    - hat
    - sun
    answer: fig
    difficulty: 1
    hints:
    - Listen for /i/.
    - Say each word slowly.
    solution: fig has i in the middle.
    mistakes:
      hat: ukge_sound
  - prompt: Which word rhymes with pig?
    options:
    - wig
    - hat
    - sun
    answer: wig
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: pig and wig rhyme.
    mistakes:
      sun: ukge_sound
  - prompt: Which letter is missing? p_n (📌)
    options:
    - i
    - x
    - z
    answer: i
    difficulty: 2
    hints:
    - It is a vowel.
    - Say pin slowly.
    solution: pin needs i.
  - prompt: How many letters are in 'fig'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: fig has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
