# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 4
title: 'Words with i: pig, pin, six'
tips:
  uk4e_blend: Say each sound slowly, then push them together faster and faster.
  uk4e_rhyme: Words that rhyme end the same. Say the end part of each word.
  uk4e_mid: Stretch the word. Is the middle sound like the one in 'ink'?
concepts:
- code: ukge.cvci
  title: 'Words with i: pig, pin, six'
  notes: |
    Three-letter words with the short vowel i: pig, pin, six, wig. Sounding out and blending.
  explanations:
    text: 'Let''s read words with i in the middle. Sound out each letter and blend: p-i-g = pig, p-i-n = pin, s-i-x = six.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - p
    - i
    - g
    - pig
    alt: 'Blending: p then i then g makes pig.'
  activity:
    type: sort
    prompt: Which i word is it?
    bins:
    - pig
    - pin
    - six
    - wig
    items:
    - label: 🐷
      bin: pig
      clue: p-i-g.
      why: 'p-i-g: pig.'
    - label: 📌
      bin: pin
      clue: p-i-n.
      why: 'p-i-n: pin.'
    - label: 6️⃣
      bin: six
      clue: s-i-x.
      why: 's-i-x: six.'
    - label: hair you wear on your head
      bin: wig
      clue: w-i-g.
      why: 'w-i-g: wig.'
  lesson:
    - teach: 'Many small words have the i sound in the middle: p-i-g, p-i-n, s-i-x, w-i-g. Say each sound, then blend: p-i-g, pig!'
      picture:
        kind: flow
        steps:
        - p
        - i
        - g
        - pig
        alt: Blending p, i, g into pig.
      check:
        prompt: 'Blend the sounds: l-i-d. What word?'
        options:
        - lid
        - lad
        - led
        answer: lid
        why: 'l, then i, then d: lid.'
    - teach: 'Words that end in -ig rhyme: pig, wig, big, dig. Words that end in -in rhyme too: pin, tin, bin, fin.'
      check:
        prompt: Which word rhymes with 'big'?
        options:
        - dig
        - bag
        - bit
        answer: dig
        why: b-ig and d-ig both end in -ig.
    - teach: 'More i words: fish 🐟 has i too, and so do lip 👄, kit, mix and zip. The middle sound is i as in ink.'
      check:
        prompt: Which word has the i sound in the middle?
        options:
        - zip
        - zap
        - zoo
        answer: zip
        why: 'z-i-p: the middle sound is i.'
  items:
  - prompt: 'Read it: pig'
    options:
    - 🐷
    - 📌
    - 6️⃣
    answer: 🐷
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: pig is 🐷.
    mistakes:
      📌: ukge_read
  - prompt: 'Read it: pin'
    options:
    - 📌
    - 🐷
    - 6️⃣
    answer: 📌
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: pin is 📌.
    mistakes:
      🐷: ukge_read
  - prompt: Which word has the i sound in the middle?
    options:
    - six
    - hat
    - sun
    answer: six
    difficulty: 1
    hints:
    - Listen for /i/.
    - Say each word slowly.
    solution: six has i in the middle.
    mistakes:
      hat: ukge_sound
  - prompt: Which word rhymes with pig?
    options:
    - wig
    - hat
    - sun
    answer: wig
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: pig and wig rhyme.
    mistakes:
      sun: ukge_sound
  - prompt: Which letter is missing? p_n (📌)
    options:
    - i
    - x
    - z
    answer: i
    difficulty: 2
    hints:
    - It is a vowel.
    - Say pin slowly.
    solution: pin needs i.
    mistakes: {"x": "kg_middle_sound2", "z": "kg_middle_sound2"}
  - prompt: How many letters are in 'six'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: six has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
  - prompt: 'Read it: six'
    options:
    - '6'
    - 🐷
    - 🐝
    answer: '6'
    difficulty: 1
    hints:
    - 'Sound it out: s-i-x.'
    - It is a number.
    solution: 'Step 1: s-i-x. Step 2: six is 6.'
    mistakes:
      🐷: uk4e_blend
      🐝: uk4e_blend
  - prompt: Which letter is missing? s_x (6)
    options:
    - i
    - a
    - o
    answer: i
    difficulty: 1
    hints:
    - Say 'six' slowly.
    - Listen to the middle.
    solution: 'Step 1: s-i-x. Step 2: i.'
    mistakes:
      a: uk4e_mid
      o: uk4e_mid
  - prompt: Which word rhymes with 'tin'?
    options:
    - bin
    - ten
    - tip
    answer: bin
    difficulty: 2
    hints:
    - 'Say the end part: -in.'
    - Which ends the same?
    solution: 'Step 1: t-in. Step 2: b-in rhymes.'
    mistakes:
      ten: uk4e_rhyme
      tip: uk4e_rhyme
  - prompt: 'Blend the sounds: f-i-n. What word?'
    options:
    - fin
    - fan
    - fun
    answer: fin
    difficulty: 1
    hints:
    - Say each sound.
    - Push them together.
    solution: 'Step 1: f, i, n. Step 2: fin (a fish has fins).'
    mistakes:
      fan: uk4e_mid
      fun: uk4e_mid
  - prompt: 'Read it: lip'
    options:
    - 👄
    - 🦁
    - 🍋
    answer: 👄
    difficulty: 2
    hints:
    - 'Sound it out: l-i-p.'
    - Part of your mouth.
    solution: 'Step 1: l-i-p. Step 2: lip.'
    mistakes:
      🦁: uk4e_blend
      🍋: uk4e_blend
  - prompt: Change p in 'pig' to d. What word?
    options:
    - dig
    - dog
    - pit
    answer: dig
    difficulty: 2
    hints:
    - Keep -ig the same.
    - Put the new sound in front.
    solution: 'Step 1: d + ig. Step 2: dig.'
    mistakes:
      dog: uk4e_mid
      pit: uk4e_blend
  - prompt: Which word does NOT rhyme with 'pin'?
    options:
    - pig
    - fin
    - win
    answer: pig
    difficulty: 3
    hints:
    - Rhyming words end in -in.
    - Say each ending.
    solution: 'Step 1: fin and win end in -in. Step 2: pig ends in -ig.'
    mistakes:
      fin: uk4e_rhyme
      win: uk4e_rhyme
  - prompt: Which word fits? 'Throw it in the ___.' (🗑️)
    options:
    - bin
    - bun
    - ban
    answer: bin
    difficulty: 3
    hints:
    - Look at the picture.
    - The middle sound is like 'ink'.
    solution: 'Step 1: the picture is a bin. Step 2: b-i-n.'
    mistakes:
      bun: uk4e_mid
      ban: uk4e_mid
  - prompt: How many sounds in 'mix'?
    options:
    - '3'
    - '2'
    - '4'
    answer: '3'
    difficulty: 2
    hints:
    - Say it slowly and tap once for each sound.
    - m ... i ... x.
    solution: 'Step 1: m, i, x. Step 2: 3 sounds.'
    mistakes:
      '2': uk4e_blend
      '4': uk4e_blend
