# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 2
title: 'Words with a: cat, bat, hat'
concepts:
- code: ukge.cvca
  title: 'Words with a: cat, bat, hat'
  notes: |
    Three-letter words with the short vowel a: cat, bat, hat, mat. Sounding out and blending.
  explanations:
    text: 'Let''s read words with a in the middle. Sound out each letter and blend: c-a-t = cat, b-a-t = bat, h-a-t = hat.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - c
    - a
    - t
    - cat
    alt: 'Blending: c then a then t makes cat.'
  activity:
    type: sort
    prompt: Which -at word is it?
    bins:
    - cat
    - bat
    - hat
    - mat
    items:
    - label: 🐱
      bin: cat
      clue: c-a-t.
      why: 'c-a-t: cat.'
    - label: 🦇
      bin: bat
      clue: b-a-t.
      why: 'b-a-t: bat.'
    - label: 🎩
      bin: hat
      clue: h-a-t.
      why: 'h-a-t: hat.'
    - label: 🧘 something to sit on
      bin: mat
      clue: m-a-t.
      why: 'm-a-t: mat.'
  items:
  - prompt: 'Read it: cat'
    options:
    - 🐱
    - 🦇
    - 🎩
    answer: 🐱
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: cat is 🐱.
    mistakes:
      🦇: ukge_read
  - prompt: 'Read it: bat'
    options:
    - 🦇
    - 🐱
    - 🎩
    answer: 🦇
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: bat is 🦇.
    mistakes:
      🐱: ukge_read
  - prompt: Which word has the a sound in the middle?
    options:
    - hat
    - pen
    - dog
    answer: hat
    difficulty: 1
    hints:
    - Listen for /a/.
    - Say each word slowly.
    solution: hat has a in the middle.
    mistakes:
      pen: ukge_sound
  - prompt: Which word rhymes with cat?
    options:
    - mat
    - pen
    - dog
    answer: mat
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: cat and mat rhyme.
    mistakes:
      dog: ukge_sound
  - prompt: Which letter is missing? b_t (🦇)
    options:
    - a
    - x
    - z
    answer: a
    difficulty: 2
    hints:
    - It is a vowel.
    - Say bat slowly.
    solution: bat needs a.
  - prompt: How many letters are in 'hat'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: hat has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
