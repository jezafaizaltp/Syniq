# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 2
title: 'Words with a: cat, bat, hat'
tips:
  kg_middle_sound2: "Say the picture's name slowly. The missing letter is the sound in the middle. Is it a vowel?"
  uk2e_blend: Say each sound slowly, then push them together faster and faster.
  uk2e_rhyme: Words that rhyme end the same. Say the end part of each word.
  uk2e_mid: Stretch the word. Is the middle sound like the one in 'apple'?

concepts:
- code: ukge.cvca
  title: 'Words with a: cat, bat, hat'
  notes: |
    Three-letter words with the short vowel a: cat, bat, hat, mat. Sounding out and blending.
  explanations:
    text: 'Let''s read words with a in the middle. Sound out each letter and blend: c-a-t = cat, b-a-t = bat, h-a-t = hat.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - c
    - a
    - t
    - cat
    alt: 'Blending: c then a then t makes cat.'
  activity:
    type: sort
    prompt: Which -at word is it?
    bins:
    - cat
    - bat
    - hat
    - mat
    items:
    - label: 🐱
      bin: cat
      clue: c-a-t.
      why: 'c-a-t: cat.'
    - label: 🦇
      bin: bat
      clue: b-a-t.
      why: 'b-a-t: bat.'
    - label: 🎩
      bin: hat
      clue: h-a-t.
      why: 'h-a-t: hat.'
    - label: 🧘 something to sit on
      bin: mat
      clue: m-a-t.
      why: 'm-a-t: mat.'
  lesson:
    - teach: 'Many small words have the a sound in the middle: c-a-t, b-a-t, h-a-t, m-a-t. Say each sound, then blend them: c-a-t, cat!'
      picture:
        kind: flow
        steps:
        - c
        - a
        - t
        - cat
        alt: Blending the sounds c, a, t into cat.
      check:
        prompt: 'Blend the sounds: m-a-p. What word?'
        options:
        - map
        - mop
        - cap
        answer: map
        why: 'm, then a, then p: map.'
    - teach: 'Change the first sound and you get a new word: cat, bat, hat, mat, rat, sat. These words rhyme because they end in -at.'
      check:
        prompt: Change c in 'cap' to t. What word?
        options:
        - tap
        - cat
        - top
        answer: tap
        why: 't-a-p: only the first sound changed.'
    - teach: 'More a words: van 🚐, fan, jam, bag 👜, man. In each one, the a sound is in the middle.'
      check:
        prompt: 'Listen: which word has a in the middle?'
        options:
        - bag
        - bed
        - bug
        answer: bag
        why: 'b-a-g: the middle sound is a.'
  items:
  - prompt: 'Read it: cat'
    options:
    - 🐱
    - 🦇
    - 🎩
    answer: 🐱
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: cat is 🐱.
    mistakes:
      🦇: ukge_read
  - prompt: 'Read it: bat'
    options:
    - 🦇
    - 🐱
    - 🎩
    answer: 🦇
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: bat is 🦇.
    mistakes:
      🐱: ukge_read
  - prompt: Which word has the a sound in the middle?
    options:
    - hat
    - pen
    - dog
    answer: hat
    difficulty: 1
    hints:
    - Listen for /a/.
    - Say each word slowly.
    solution: hat has a in the middle.
    mistakes:
      pen: ukge_sound
  - prompt: Which word rhymes with cat?
    options:
    - mat
    - pen
    - dog
    answer: mat
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: cat and mat rhyme.
    mistakes:
      dog: ukge_sound
  - prompt: Which letter is missing? b_t (🦇)
    options:
    - a
    - x
    - z
    answer: a
    difficulty: 2
    hints:
    - It is a vowel.
    - Say bat slowly.
    solution: bat needs a.
    mistakes: {"x": "kg_middle_sound2", "z": "kg_middle_sound2"}
  - prompt: How many letters are in 'hat'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: hat has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
  - prompt: 'Read it: van'
    options:
    - 🚐
    - 🐔
    - ☀️
    answer: 🚐
    difficulty: 1
    hints:
    - 'Sound it out: v-a-n.'
    - Something that carries people.
    solution: 'Step 1: v-a-n. Step 2: a van.'
    mistakes:
      🐔: uk2e_blend
      ☀️: uk2e_blend
  - prompt: Which word rhymes with 'fan'?
    options:
    - can
    - fat
    - fin
    answer: can
    difficulty: 2
    hints:
    - 'Say the end part: -an.'
    - Which ends the same way?
    solution: 'Step 1: f-an. Step 2: c-an rhymes.'
    mistakes:
      fat: uk2e_rhyme
      fin: uk2e_rhyme
  - prompt: Which letter is missing? j_m (jam)
    options:
    - a
    - e
    - o
    answer: a
    difficulty: 2
    hints:
    - Say 'jam' slowly.
    - Listen to the middle sound.
    solution: 'Step 1: j-a-m. Step 2: a.'
    mistakes:
      e: uk2e_mid
      o: uk2e_mid
  - prompt: 'Blend the sounds: r-a-t. What word?'
    options:
    - rat
    - rot
    - ran
    answer: rat
    difficulty: 1
    hints:
    - Say each sound.
    - Push them together.
    solution: 'Step 1: r, a, t. Step 2: rat.'
    mistakes:
      rot: uk2e_mid
      ran: uk2e_blend
  - prompt: Which word does NOT rhyme with 'hat'?
    options:
    - hen
    - mat
    - sat
    answer: hen
    difficulty: 3
    hints:
    - Rhyming words end in -at.
    - Say each one's end part.
    solution: 'Step 1: mat and sat end in -at. Step 2: hen does not.'
    mistakes:
      mat: uk2e_rhyme
      sat: uk2e_rhyme
  - prompt: 'Read it: bag'
    options:
    - 👜
    - 🐛
    - 🛏️
    answer: 👜
    difficulty: 1
    hints:
    - 'Sound it out: b-a-g.'
    - You carry things in it.
    solution: 'Step 1: b-a-g. Step 2: a bag.'
    mistakes:
      🐛: uk2e_mid
      🛏️: uk2e_mid
  - prompt: Change m in 'man' to p. What word?
    options:
    - pan
    - map
    - pin
    answer: pan
    difficulty: 2
    hints:
    - Keep -an the same.
    - Put the new sound in front.
    solution: 'Step 1: p + an. Step 2: pan.'
    mistakes:
      map: uk2e_blend
      pin: uk2e_mid
  - prompt: Which letter does 'cat' start with?
    options:
    - c
    - a
    - t
    answer: c
    difficulty: 1
    hints:
    - Say it slowly.
    - Listen to the very first sound.
    solution: 'Step 1: c-a-t. Step 2: the first letter is c.'
    mistakes:
      a: uk2e_blend
      t: uk2e_blend
  - prompt: Which word fits? 'The ___ is on the mat.' (🐱)
    options:
    - cat
    - cup
    - cot
    answer: cat
    difficulty: 3
    hints:
    - Look at the picture.
    - It says miaow.
    solution: 'Step 1: the picture is a cat. Step 2: c-a-t.'
    mistakes:
      cup: uk2e_mid
      cot: uk2e_mid
