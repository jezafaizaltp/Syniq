# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 5
title: 'Words with u: sun, cup, bus'
concepts:
- code: ukge.cvcou
  title: 'Words with u: sun, cup, bus'
  notes: |
    Three-letter words with the short vowel u: sun, cup, bus, bun. Sounding out and blending.
  explanations:
    text: 'Let''s read words with u in the middle. Sound out each letter and blend: s-u-n = sun, c-u-p = cup, b-u-s = bus.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - s
    - u
    - n
    - sun
    alt: 'Blending: s then u then n makes sun.'
  activity:
    type: sort
    prompt: Which u word is it?
    bins:
    - sun
    - cup
    - bus
    - bun
    items:
    - label: ☀️
      bin: sun
      clue: s-u-n.
      why: 's-u-n: sun.'
    - label: ☕
      bin: cup
      clue: c-u-p.
      why: 'c-u-p: cup.'
    - label: 🚌
      bin: bus
      clue: b-u-s.
      why: 'b-u-s: bus.'
    - label: 🍞 a soft round bread
      bin: bun
      clue: b-u-n.
      why: 'b-u-n: bun.'
  items:
  - prompt: 'Read it: sun'
    options:
    - ☀️
    - ☕
    - 🚌
    answer: ☀️
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: sun is ☀️.
    mistakes:
      ☕: ukge_read
  - prompt: 'Read it: cup'
    options:
    - ☕
    - ☀️
    - 🚌
    answer: ☕
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: cup is ☕.
    mistakes:
      ☀️: ukge_read
  - prompt: Which word has the u sound in the middle?
    options:
    - bus
    - pig
    - hen
    answer: bus
    difficulty: 1
    hints:
    - Listen for /u/.
    - Say each word slowly.
    solution: bus has u in the middle.
    mistakes:
      pig: ukge_sound
  - prompt: Which word rhymes with sun?
    options:
    - bun
    - pig
    - hen
    answer: bun
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: sun and bun rhyme.
    mistakes:
      hen: ukge_sound
  - prompt: Which letter is missing? c_p (☕)
    options:
    - u
    - x
    - z
    answer: u
    difficulty: 2
    hints:
    - It is a vowel.
    - Say cup slowly.
    solution: cup needs u.
  - prompt: How many letters are in 'bus'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: bus has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
