# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 5
title: 'Words with u: sun, cup, bus'
tips:
  uk5e_blend: Say each sound slowly, then push them together faster and faster.
  uk5e_rhyme: Words that rhyme end the same. Say the end part of each word.
  uk5e_mid: Stretch the word. Is the middle sound like the one in 'umbrella'?
concepts:
- code: ukge.cvcou
  title: 'Words with u: sun, cup, bus'
  notes: |
    Three-letter words with the short vowel u: sun, cup, bus, bun. Sounding out and blending.
  explanations:
    text: 'Let''s read words with u in the middle. Sound out each letter and blend: s-u-n = sun, c-u-p = cup, b-u-s = bus.'
    visual: Draw each word's picture and write the word under it, with the middle vowel in a different colour.
    step_by_step: 'Step 1: Say each letter''s sound. Step 2: Say them faster. Step 3: Hear the word!'
    real_world: Read short words on packets and signboards with a grown-up.
  picture:
    kind: flow
    steps:
    - s
    - u
    - n
    - sun
    alt: 'Blending: s then u then n makes sun.'
  activity:
    type: sort
    prompt: Which u word is it?
    bins:
    - sun
    - cup
    - bus
    - bun
    items:
    - label: ☀️
      bin: sun
      clue: s-u-n.
      why: 's-u-n: sun.'
    - label: ☕
      bin: cup
      clue: c-u-p.
      why: 'c-u-p: cup.'
    - label: 🚌
      bin: bus
      clue: b-u-s.
      why: 'b-u-s: bus.'
    - label: 🍞 a soft round bread
      bin: bun
      clue: b-u-n.
      why: 'b-u-n: bun.'
  lesson:
    - teach: 'Many small words have the u sound in the middle: s-u-n, c-u-p, b-u-s, b-u-n. Say each sound, then blend: s-u-n, sun!'
      picture:
        kind: flow
        steps:
        - s
        - u
        - n
        - sun
        alt: Blending s, u, n into sun.
      check:
        prompt: 'Blend the sounds: m-u-g. What word?'
        options:
        - mug
        - mag
        - mig
        answer: mug
        why: 'm, then u, then g: mug.'
      ways:
      - style: step_by_step
        teach: 'Blend a word. First: say j. Second: say u. Third: say g. Fourth: push them together faster and faster, j-u-g, jug!'
      - style: real_world
        teach: When you pour water from a jug, you can say j-u-g, with the u sound in the middle.
    - teach: 'Words that end in -un rhyme: sun, bun, run, fun. Words that end in -ug rhyme too: bug, mug, rug, hug.'
      check:
        prompt: Which word rhymes with 'rug'?
        options:
        - hug
        - rag
        - run
        answer: hug
        why: r-ug and h-ug both end in -ug.
      ways:
      - style: visual
        teach: Change the first sound and make new words in the -um family.
        picture:
          kind: flow
          steps:
          - hum
          - change h to y
          - yum
          - change y to s
          - sum
          alt: Start with hum. Change h to y to get yum. Change y to s to get sum. They all end in -um, so they rhyme.
      - style: step_by_step
        teach: 'Check if two words rhyme. First: say hum. Second: say only its end, um. Third: say yum and its end, um. Fourth: the ends match, so hum and yum rhyme.'
    - teach: 'More u words: nut 🥜, duck 🦆, tub 🛁, gum. Listen: the middle sound is u as in umbrella.'
      check:
        prompt: 'Listen: which word has u in the middle?'
        options:
        - tub
        - tab
        - tip
        answer: tub
        why: 't-u-b: the middle sound is u.'
      ways:
      - style: visual
        teach: More words with the u sound in the middle.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - dug
            - tug
            - bud
          - title: Sounds
            points:
            - d-u-g
            - t-u-g
            - b-u-d
          alt: Dug is d-u-g, tug is t-u-g and bud is b-u-d. Each has u in the middle.
      - style: real_world
        teach: In a tug of war, two teams pull a rope. Tug has the u sound in the middle.
  items:
  - prompt: 'Read it: sun'
    options:
    - ☀️
    - ☕
    - 🚌
    answer: ☀️
    difficulty: 1
    hints:
    - Sound out each letter.
    - Blend them.
    solution: sun is ☀️.
    mistakes:
      ☕: ukge_read
  - prompt: 'Read it: cup'
    options:
    - ☕
    - ☀️
    - 🚌
    answer: ☕
    difficulty: 1
    hints:
    - Sound it out.
    - Blend the sounds.
    solution: cup is ☕.
    mistakes:
      ☀️: ukge_read
  - prompt: Which word has the u sound in the middle?
    options:
    - bus
    - pig
    - hen
    answer: bus
    difficulty: 1
    hints:
    - Listen for /u/.
    - Say each word slowly.
    solution: bus has u in the middle.
    mistakes:
      pig: ukge_sound
  - prompt: Which word rhymes with sun?
    options:
    - bun
    - pig
    - hen
    answer: bun
    difficulty: 2
    hints:
    - Same ending.
    - Say them aloud.
    solution: sun and bun rhyme.
    mistakes:
      hen: ukge_sound
  - prompt: Which letter is missing? c_p (☕)
    options:
    - u
    - x
    - z
    answer: u
    difficulty: 2
    hints:
    - It is a vowel.
    - Say cup slowly.
    solution: cup needs u.
    mistakes: {"x": "kg_middle_sound2", "z": "kg_middle_sound2"}
  - prompt: How many letters are in 'bus'?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each letter.
    - Point and count.
    solution: bus has 3 letters.
    mistakes:
      '2': ukge_read
      '4': ukge_read
  - prompt: 'Read it: bug'
    options:
    - 🐛
    - 🛏️
    - 👜
    answer: 🐛
    difficulty: 1
    hints:
    - 'Sound it out: b-u-g.'
    - A tiny creeping thing.
    solution: 'Step 1: b-u-g. Step 2: a bug.'
    mistakes:
      🛏️: uk5e_mid
      👜: uk5e_mid
  - prompt: Which letter is missing? n_t (🥜)
    options:
    - u
    - e
    - o
    answer: u
    difficulty: 1
    hints:
    - Say 'nut' slowly.
    - Listen to the middle.
    solution: 'Step 1: n-u-t. Step 2: u.'
    mistakes:
      e: uk5e_mid
      o: uk5e_mid
  - prompt: Which word rhymes with 'fun'?
    options:
    - run
    - fan
    - fur
    answer: run
    difficulty: 2
    hints:
    - 'Say the end part: -un.'
    - Which ends the same?
    solution: 'Step 1: f-un. Step 2: r-un rhymes.'
    mistakes:
      fan: uk5e_rhyme
      fur: uk5e_rhyme
  - prompt: 'Blend the sounds: h-u-t. What word?'
    options:
    - hut
    - hat
    - hot
    answer: hut
    difficulty: 1
    hints:
    - Say each sound.
    - Push them together.
    solution: 'Step 1: h, u, t. Step 2: hut (a small house).'
    mistakes:
      hat: uk5e_mid
      hot: uk5e_mid
  - prompt: 'Read it: tub'
    options:
    - 🛁
    - 🐯
    - 📺
    answer: 🛁
    difficulty: 2
    hints:
    - 'Sound it out: t-u-b.'
    - You can take a bath in it.
    solution: 'Step 1: t-u-b. Step 2: a tub.'
    mistakes:
      🐯: uk5e_blend
      📺: uk5e_blend
  - prompt: Change c in 'cup' to p. What word?
    options:
    - pup
    - pop
    - cap
    answer: pup
    difficulty: 2
    hints:
    - Keep -up the same.
    - Put the new sound in front.
    solution: 'Step 1: p + up. Step 2: pup (a baby dog).'
    mistakes:
      pop: uk5e_mid
      cap: uk5e_mid
  - prompt: Which word does NOT rhyme with 'mug'?
    options:
    - mud
    - jug
    - bug
    answer: mud
    difficulty: 3
    hints:
    - Rhyming words end in -ug.
    - Say each ending.
    solution: 'Step 1: jug and bug end in -ug. Step 2: mud ends in -ud.'
    mistakes:
      jug: uk5e_rhyme
      bug: uk5e_rhyme
  - prompt: Which word fits? 'We go to school by ___.' (🚌)
    options:
    - bus
    - bat
    - box
    answer: bus
    difficulty: 3
    hints:
    - Look at the picture.
    - The middle sound is like 'umbrella'.
    solution: 'Step 1: the picture is a bus. Step 2: b-u-s.'
    mistakes:
      bat: uk5e_mid
      box: uk5e_mid
  - prompt: How many sounds in 'sun'?
    options:
    - '3'
    - '2'
    - '1'
    answer: '3'
    difficulty: 2
    hints:
    - Tap once for each sound.
    - s ... u ... n.
    solution: 'Step 1: s, u, n. Step 2: 3 sounds.'
    mistakes:
      '2': uk5e_blend
      '1': uk5e_blend
  - prompt: 'Case: At the zoo, Kabir sees a baby lion. The keeper says it is a c-u-b. Blend the sounds. What word is it?'
    options:
    - cub
    - cab
    - cob
    answer: cub
    hints:
    - 'Say each sound slowly: c, u, b.'
    - Is the middle sound like umbrella?
    solution: c-u-b blends to cub, a baby lion.
    mistakes:
      cab: uk5e_blend
      cob: uk5e_blend
    exam: case
    difficulty: 2
  - prompt: 'Situation: Meena is making a rhyme about a nut. Which word rhymes with ''nut''?'
    options:
    - cut
    - cat
    - cot
    answer: cut
    hints:
    - Say the end part of nut.
    - Which word ends with the same -ut?
    solution: Nut and cut both end in -ut, so they rhyme.
    mistakes:
      cat: uk5e_rhyme
      cot: uk5e_rhyme
    exam: competency
    difficulty: 2
