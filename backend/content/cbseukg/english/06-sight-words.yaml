# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 6
title: 'Little Words: I, a, the, is'
concepts:
- code: ukge.sight
  title: 'Little Words: I, a, the, is'
  notes: |
    Common sight words (I, a, the, is, my, this) and reading short sentences: I am Riya. This is a cat.
  explanations:
    text: 'Some little words we see again and again: I, a, the, is, my, this. Let''s read: ''This is a cat.'' ''I am happy.'''
    visual: 'Draw a cat and write under it: This is a cat.'
    step_by_step: 'Step 1: Point to each word. Step 2: Read it. Step 3: Read the whole sentence.'
    real_world: Find 'the' and 'is' in a story book.
  picture:
    kind: flow
    steps:
    - This
    - is
    - a
    - cat.
    alt: 'Reading a sentence one word at a time: This is a cat.'
  activity:
    type: order
    prompt: 'Make the sentence: I am Riya.'
    steps:
    - I
    - am
    - Riya.
    reasons:
      am: After 'I' comes 'am'.
      Riya.: The name comes last, with a full stop.
  items:
  - prompt: 'Read: ''This is a cat.'' What is it?'
    options:
    - 🐱 a cat
    - 🐶 a dog
    - 🐟 a fish
    answer: 🐱 a cat
    difficulty: 1
    hints:
    - Read the last word.
    - c-a-t.
    solution: It is a cat.
    mistakes:
      🐶 a dog: ukge_read
  - prompt: 'Read: ''I am happy.'' How do I feel?'
    options:
    - 😊 happy
    - 😢 sad
    - 😠 angry
    answer: 😊 happy
    difficulty: 1
    hints:
    - Read the last word.
    - h-a-pp-y.
    solution: I am happy.
  - prompt: 'Choose the word to finish: ''This ___ a ball.'''
    options:
    - is
    - am
    - the
    answer: is
    difficulty: 2
    hints:
    - Read it aloud.
    - This is ...
    solution: This is a ball.
  - prompt: 'Choose the word to finish: ''___ am Riya.'''
    options:
    - I
    - Is
    - The
    answer: I
    difficulty: 2
    hints:
    - Talking about yourself.
    - Always a big letter.
    solution: I am Riya.
  - prompt: Which is a word we use for ourselves?
    options:
    - I
    - dog
    - red
    answer: I
    difficulty: 1
    hints:
    - Me.
    - Always a capital letter.
    solution: We say I for ourselves.
  - prompt: 'Read: ''The sun is hot.'' What is hot?'
    options:
    - ☀️ the sun
    - 🌙 the moon
    - 🧊 the ice
    answer: ☀️ the sun
    difficulty: 2
    hints:
    - Read the second word.
    - s-u-n.
    solution: The sun is hot.
