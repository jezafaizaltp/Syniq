# CBSE UKG English (sounds and first reading) (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-eng
chapter: 6
title: 'Little Words: I, a, the, is'
tips:
  kg_is_am: "We say 'I am' and 'it is'. Read the sentence aloud with each word. Which sounds right?"
  kg_myself: "Point to yourself and talk about you. Which word do you say?"
  uk6e_read: Read the whole sentence aloud with each word. Which one sounds right?
  uk6e_look: Point to each word as you read. Which word tells the answer?
  uk6e_word: These little words are read by looking, not sounding out. Look at the shape of the word.

concepts:
- code: ukge.sight
  title: 'Little Words: I, a, the, is'
  notes: |
    Common sight words (I, a, the, is, my, this) and reading short sentences: I am Riya. This is a cat.
  explanations:
    text: 'Some little words we see again and again: I, a, the, is, my, this. Let''s read: ''This is a cat.'' ''I am happy.'''
    visual: 'Draw a cat and write under it: This is a cat.'
    step_by_step: 'Step 1: Point to each word. Step 2: Read it. Step 3: Read the whole sentence.'
    real_world: Find 'the' and 'is' in a story book.
  picture:
    kind: flow
    steps:
    - This
    - is
    - a
    - cat.
    alt: 'Reading a sentence one word at a time: This is a cat.'
  activity:
    type: order
    prompt: 'Make the sentence: I am Riya.'
    steps:
    - I
    - am
    - Riya.
    reasons:
      am: After 'I' comes 'am'.
      Riya.: The name comes last, with a full stop.
  lesson:
    - teach: 'Some little words are everywhere: I, a, the, is, my, this. We learn them by sight, like a friend''s face. Read: ''This is my bag.'''
      check:
        prompt: Which word do we use for ourselves?
        options:
        - I
        - the
        - is
        answer: I
        why: We say 'I am ...' about ourselves.
    - teach: '''I am'' tells about me: I am happy. ''It is'' tells about a thing: It is red. ''This is'' points to something: This is a cup.'
      picture:
        kind: compare
        columns:
        - title: About me
          points:
          - I am tall.
          - I am happy.
        - title: About a thing
          points:
          - It is red.
          - This is a cup.
        alt: Sentences with 'I am' and with 'It is' or 'This is'.
      check:
        prompt: 'Pick the word: ''It ___ big.'''
        options:
        - is
        - am
        - I
        answer: is
        why: We say 'It is', not 'It am'.
    - teach: '''a'' goes before one thing: a cat, a pen. ''the'' points to a thing we know: the sun, the moon. ''my'' says it belongs to me: my book.'
      check:
        prompt: 'Pick the word: ''This is ___ book.'' (it belongs to me)'
        options:
        - my
        - is
        - am
        answer: my
        why: '''My'' says the book belongs to me.'
  items:
  - prompt: 'Read: ''This is a cat.'' What is it?'
    options:
    - 🐱 a cat
    - 🐶 a dog
    - 🐟 a fish
    answer: 🐱 a cat
    difficulty: 1
    hints:
    - Read the last word.
    - c-a-t.
    solution: It is a cat.
    mistakes:
      🐶 a dog: ukge_read
  - prompt: 'Read: ''I am happy.'' How do I feel?'
    options:
    - 😊 happy
    - 😢 sad
    - 😠 angry
    answer: 😊 happy
    difficulty: 1
    hints:
    - Read the last word.
    - h-a-pp-y.
    solution: I am happy.
    mistakes: {"😢 sad": "ukge_read", "😠 angry": "ukge_read"}
  - prompt: 'Choose the word to finish: ''This ___ a ball.'''
    options:
    - is
    - am
    - the
    answer: is
    difficulty: 2
    hints:
    - Read it aloud.
    - This is ...
    solution: This is a ball.
    mistakes: {"am": "kg_is_am", "the": "kg_is_am"}
  - prompt: 'Choose the word to finish: ''___ am Riya.'''
    options:
    - I
    - Is
    - The
    answer: I
    difficulty: 2
    hints:
    - Talking about yourself.
    - Always a big letter.
    solution: I am Riya.
    mistakes: {"Is": "kg_is_am", "The": "kg_is_am"}
  - prompt: Which is a word we use for ourselves?
    options:
    - I
    - dog
    - red
    answer: I
    difficulty: 1
    hints:
    - Me.
    - Always a capital letter.
    solution: We say I for ourselves.
    mistakes: {"dog": "kg_myself", "red": "kg_myself"}
  - prompt: 'Read: ''The sun is hot.'' What is hot?'
    options:
    - ☀️ the sun
    - 🌙 the moon
    - 🧊 the ice
    answer: ☀️ the sun
    difficulty: 2
    hints:
    - Read the second word.
    - s-u-n.
    solution: The sun is hot.
    mistakes: {"🌙 the moon": "ukge_read", "🧊 the ice": "ukge_read"}
  - prompt: 'Read: ''The ball is red.'' What is red?'
    options:
    - ⚽ the ball
    - 🍎 an apple
    - 🚗 a car
    answer: ⚽ the ball
    difficulty: 1
    hints:
    - Point to the first two words.
    - What does the sentence talk about?
    solution: 'Step 1: ''The ball is red.'' Step 2: the ball is red.'
    mistakes:
      🍎 an apple: uk6e_look
      🚗 a car: uk6e_look
  - prompt: 'Choose the word to finish: ''I ___ six.'''
    options:
    - am
    - is
    - the
    answer: am
    difficulty: 2
    hints:
    - It tells about me.
    - Read it aloud each way.
    solution: 'Step 1: with ''I'' we use am. Step 2: I am six.'
    mistakes:
      is: uk6e_read
      the: uk6e_read
  - prompt: 'Read: ''This is my cat.'' Whose cat is it?'
    options:
    - mine
    - the teacher's
    - nobody's
    answer: mine
    difficulty: 2
    hints:
    - Find the word 'my'.
    - Who says it?
    solution: 'Step 1: ''my cat''. Step 2: it is mine.'
    mistakes:
      the teacher's: uk6e_look
      nobody's: uk6e_look
  - prompt: 'Choose the word to finish: ''___ is a dog.'''
    options:
    - This
    - Am
    - My
    answer: This
    difficulty: 2
    hints:
    - We are pointing to the dog.
    - Read each one aloud.
    solution: 'Step 1: pointing word. Step 2: This is a dog.'
    mistakes:
      Am: uk6e_read
      My: uk6e_read
  - prompt: Which word is spelled t-h-e?
    options:
    - the
    - this
    - he
    answer: the
    difficulty: 1
    hints:
    - Look at each letter.
    - Three letters, starting with t.
    solution: 'Step 1: t, h, e. Step 2: the.'
    mistakes:
      this: uk6e_word
      he: uk6e_word
  - prompt: 'Read: ''I am sad.'' How do I feel?'
    options:
    - 😢 sad
    - 😊 happy
    - 😠 cross
    answer: 😢 sad
    difficulty: 1
    hints:
    - Read the last word.
    - Point to it.
    solution: 'Step 1: ''I am sad.'' Step 2: sad.'
    mistakes:
      😊 happy: uk6e_look
      😠 cross: uk6e_look
  - prompt: 'Choose the word to finish: ''I see ___ moon.'''
    options:
    - the
    - am
    - is
    answer: the
    difficulty: 3
    hints:
    - There is only one moon we all know.
    - Read it each way.
    solution: 'Step 1: one known moon. Step 2: I see the moon.'
    mistakes:
      am: uk6e_read
      is: uk6e_read
  - prompt: How many words in 'This is a hat.'?
    options:
    - '4'
    - '3'
    - '5'
    answer: '4'
    difficulty: 3
    hints:
    - Point to each word and count.
    - Spaces split the words.
    solution: 'Step 1: This, is, a, hat. Step 2: 4 words.'
    mistakes:
      '3': uk6e_look
      '5': uk6e_look
  - prompt: 'Choose the word to finish: ''It ___ hot.'''
    options:
    - is
    - am
    - my
    answer: is
    difficulty: 1
    hints:
    - It tells about a thing.
    - 'Read aloud: which sounds right?'
    solution: 'Step 1: with ''It'' we use is. Step 2: It is hot.'
    mistakes:
      am: uk6e_read
      my: uk6e_read
