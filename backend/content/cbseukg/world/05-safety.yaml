# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 5
title: Staying Safe
concepts:
- code: ukgw.safe
  title: Staying Safe
  notes: |
    Safety at home and outside: don't touch fire, sharp things or plugs; don't go with strangers; know a grown-up's phone number; tell a trusted adult.
  explanations:
    text: 'Stay safe: don''t touch fire, knives or plugs. Don''t go anywhere with a stranger. If something feels wrong, tell a grown-up you trust.'
    visual: Draw a red cross over a hot stove and a plug, and a child holding a parent's hand.
    step_by_step: 'Step 1: Is it hot, sharp or electric? Stay away. Step 2: Is it a stranger? Say no and go to a grown-up.'
    real_world: Learn your mother's or father's phone number.
  picture:
    kind: compare
    columns:
    - title: Safe
      points:
      - holding hands
      - telling a grown-up
    - title: Not safe
      points:
      - touching fire
      - going with a stranger
    alt: 'Safe: holding hands, telling a grown-up. Not safe: touching fire, going with a stranger.'
  items:
  - prompt: 'A stranger offers you sweets to go with them. You:'
    options:
    - say no and tell a grown-up
    - go with them
    - keep it secret
    answer: say no and tell a grown-up
    difficulty: 1
    hints:
    - You don't know them.
    - Stay with your family.
    solution: Say no and tell a grown-up.
    mistakes:
      go with them: ukgw_think
  - prompt: Should you touch a hot stove?
    options:
    - 'no'
    - 'yes'
    - only a little
    answer: 'no'
    difficulty: 1
    hints:
    - It burns.
    - Hot!
    solution: No, it burns.
  - prompt: 'Electric plugs are:'
    options:
    - not for playing
    - toys
    - food
    answer: not for playing
    difficulty: 1
    hints:
    - Shock.
    - Danger.
    solution: Plugs are not for playing.
  - prompt: 'If you get lost in a shop, you should:'
    options:
    - ask a shopkeeper for help
    - run outside
    - go with anyone
    answer: ask a shopkeeper for help
    difficulty: 2
    hints:
    - Stay inside.
    - Someone working there.
    solution: Ask a shopkeeper for help.
  - prompt: 'Knives are:'
    options:
    - sharp, only for grown-ups
    - toys
    - soft
    answer: sharp, only for grown-ups
    difficulty: 2
    hints:
    - They cut.
    - Careful.
    solution: Knives are sharp and only for grown-ups.
  - prompt: 'If someone makes you feel scared, tell:'
    options:
    - a grown-up you trust
    - nobody
    - only your toys
    answer: a grown-up you trust
    difficulty: 2
    hints:
    - Mother, father, teacher.
    - Don't keep it secret.
    solution: Tell a grown-up you trust.
