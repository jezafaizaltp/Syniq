# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 5
title: Staying Safe
tips:
  kg_hot: "A hot stove can burn skin, even a little touch."
  kg_knife: "A knife can cut vegetables. What could it do to fingers?"
  kg_lost: "Stay inside the shop. Who works there and can help you find your family?"
  kg_plug: "Electricity inside the wall can hurt badly, even through a plug. Fingers stay away."
  uk5w_hurt: 'Ask yourself: could this burn, cut, or shock me? Then keep away.'
  uk5w_tell: Think who you trust. Who can you tell when something feels wrong?
  uk5w_rule: Think of the safety rule. What keeps your body safe?

concepts:
- code: ukgw.safe
  title: Staying Safe
  notes: |
    Safety at home and outside: don't touch fire, sharp things or plugs; don't go with strangers; know a grown-up's phone number; tell a trusted adult.
  explanations:
    text: 'Stay safe: don''t touch fire, knives or plugs. Don''t go anywhere with a stranger. If something feels wrong, tell a grown-up you trust.'
    visual: Draw a red cross over a hot stove and a plug, and a child holding a parent's hand.
    step_by_step: 'Step 1: Is it hot, sharp or electric? Stay away. Step 2: Is it a stranger? Say no and go to a grown-up.'
    real_world: Learn your mother's or father's phone number.
  picture:
    kind: compare
    columns:
    - title: Safe
      points:
      - holding hands
      - telling a grown-up
    - title: Not safe
      points:
      - touching fire
      - going with a stranger
    alt: 'Safe: holding hands, telling a grown-up. Not safe: touching fire, going with a stranger.'
  activity:
    type: sort
    prompt: Safe or not safe?
    bins:
    - ✅ Safe
    - ⚠️ Not safe
    items:
    - label: Touching a hot stove
      bin: ⚠️ Not safe
      clue: What happens to your hand?
      why: A hot stove burns. Keep away.
    - label: Holding a grown-up's hand on the road
      bin: ✅ Safe
      clue: Who helps you cross?
      why: A grown-up keeps you safe on the road.
    - label: Going with a stranger who offers sweets
      bin: ⚠️ Not safe
      clue: Do you know this person?
      why: Never go with a stranger. Tell a grown-up you trust.
    - label: Telling mother when something feels wrong
      bin: ✅ Safe
      clue: Who can help you?
      why: Always tell a grown-up you trust.
    - label: Putting fingers in a plug
      bin: ⚠️ Not safe
      clue: Electricity can hurt.
      why: Plugs can give a shock. Never touch.
    - label: Wearing a helmet on a cycle
      bin: ✅ Safe
      clue: It covers your head.
      why: A helmet protects your head.
  lesson:
    - teach: 'Some things at home can hurt us: fire, a hot iron, knives, scissors with sharp points, electric plugs and medicines. These are for grown-ups to use.'
      picture:
        kind: compare
        columns:
        - title: Grown-ups only
          points:
          - stove
          - knife
          - plug
          - medicine
        - title: Safe for me
          points:
          - crayons
          - ball
          - picture book
        alt: Things only grown-ups use, and safe things for children.
      check:
        prompt: You find tablets on a table. What should you do?
        options:
        - not eat them and tell a grown-up
        - eat them like sweets
        - share them with a friend
        answer: not eat them and tell a grown-up
        why: Medicines are only taken when a grown-up gives them.
      ways:
      - style: step_by_step
        teach: 'Do the stop-and-think check. First: before you touch something, stop. Second: ask, ''Could it burn, cut or give a shock?'' Third: if yes, keep your hands away. Fourth: call a grown-up to help.'
      - style: real_world
        teach: Many homes keep medicines and sharp knives on a high shelf so small children cannot reach them.
    - teach: Your body belongs to you. If anyone touches you in a way you don't like, say 'No!', move away, and tell a grown-up you trust. It is never your fault.
      check:
        prompt: 'Someone makes you feel scared or uncomfortable. You should:'
        options:
        - say no and tell a trusted grown-up
        - keep it a secret
        - feel it is your fault
        answer: say no and tell a trusted grown-up
        why: Telling a trusted grown-up gets you help.
      ways:
      - style: visual
        teach: What to do if someone makes you feel unsafe, one step after another.
        picture:
          kind: flow
          steps:
          - say 'No!' loudly
          - move away quickly
          - tell a grown-up you trust
          - keep telling until someone helps
          alt: If someone makes you feel unsafe, say 'No!' loudly, move away quickly, tell a grown-up you trust, and keep telling until someone helps.
      - style: step_by_step
        teach: 'Make your trusted-grown-ups hand. First: trace your hand on paper. Second: on each finger, write or draw one grown-up you trust. Third: show it to a parent. Fourth: remember you can go to any of them.'
    - teach: Know your name, your parent's name and a phone number. If you are lost, stay where you are and ask a police officer, a shopkeeper or a mother with children for help.
      check:
        prompt: What is good to learn by heart for safety?
        options:
        - a parent's phone number
        - a cartoon song
        - the colour of a car
        answer: a parent's phone number
        why: Then a helper can call your family.
      ways:
      - style: visual
        teach: Things to learn by heart, and helpers to ask if you get lost.
        picture:
          kind: compare
          columns:
          - title: Learn by heart
            points:
            - your full name
            - a parent's name
            - a phone number
          - title: Ask for help
            points:
            - a police officer
            - a shopkeeper
            - a mother with children
          alt: Learn your full name, a parent's name and a phone number by heart. If lost, ask a police officer, a shopkeeper or a mother with children.
      - style: real_world
        teach: Some parents write their phone number on a card in their child's bag when they go to a busy fair.
  items:
  - prompt: 'A stranger offers you sweets to go with them. You:'
    options:
    - say no and tell a grown-up
    - go with them
    - keep it secret
    answer: say no and tell a grown-up
    difficulty: 1
    hints:
    - You don't know them.
    - Stay with your family.
    solution: Say no and tell a grown-up.
    mistakes:
      go with them: ukgw_think
  - prompt: Should you touch a hot stove?
    options:
    - 'no'
    - 'yes'
    - only a little
    answer: 'no'
    difficulty: 1
    hints:
    - It burns.
    - Hot!
    solution: No, it burns.
    mistakes: {"yes": "kg_hot", "only a little": "kg_hot"}
  - prompt: 'Electric plugs are:'
    options:
    - not for playing
    - toys
    - food
    answer: not for playing
    difficulty: 1
    hints:
    - Shock.
    - Danger.
    solution: Plugs are not for playing.
    mistakes: {"toys": "kg_plug", "food": "kg_plug"}
  - prompt: 'If you get lost in a shop, you should:'
    options:
    - ask a shopkeeper for help
    - run outside
    - go with anyone
    answer: ask a shopkeeper for help
    difficulty: 2
    hints:
    - Stay inside.
    - Someone working there.
    solution: Ask a shopkeeper for help.
    mistakes: {"run outside": "kg_lost", "go with anyone": "kg_lost"}
  - prompt: 'Knives are:'
    options:
    - sharp, only for grown-ups
    - toys
    - soft
    answer: sharp, only for grown-ups
    difficulty: 2
    hints:
    - They cut.
    - Careful.
    solution: Knives are sharp and only for grown-ups.
    mistakes: {"toys": "kg_knife", "soft": "kg_knife"}
  - prompt: 'If someone makes you feel scared, tell:'
    options:
    - a grown-up you trust
    - nobody
    - only your toys
    answer: a grown-up you trust
    difficulty: 2
    hints:
    - Mother, father, teacher.
    - Don't keep it secret.
    solution: Tell a grown-up you trust.
    mistakes: {"nobody": "kg_tell", "only your toys": "kg_tell"}
  - prompt: A ball rolls onto a busy road. What do you do?
    options:
    - ask a grown-up to get it
    - run onto the road
    - jump over cars
    answer: ask a grown-up to get it
    difficulty: 2
    hints:
    - Fast cars cannot stop quickly.
    - Who can help safely?
    solution: 'Step 1: the road is dangerous. Step 2: ask a grown-up.'
    mistakes:
      run onto the road: uk5w_rule
      jump over cars: uk5w_rule
  - prompt: Should you play with matchboxes?
    options:
    - 'no'
    - 'yes'
    - only at night
    answer: 'no'
    difficulty: 1
    hints:
    - Matches make fire.
    - Fire can burn.
    solution: 'Step 1: matches start fires. Step 2: no playing.'
    mistakes:
      'yes': uk5w_hurt
      only at night: uk5w_hurt
  - prompt: 'The iron is plugged in and hot. You should:'
    options:
    - stay away from it
    - touch it
    - pull the wire
    answer: stay away from it
    difficulty: 1
    hints:
    - Hot things burn skin.
    - Wires can pull it down on you.
    solution: 'Step 1: a hot iron burns. Step 2: stay away.'
    mistakes:
      touch it: uk5w_hurt
      pull the wire: uk5w_hurt
  - prompt: 'Someone you don''t know says, ''Your mother sent me. Come with me.'' You:'
    options:
    - say no and go to a trusted grown-up
    - go with them
    - get in their car
    answer: say no and go to a trusted grown-up
    difficulty: 3
    hints:
    - Strangers can say things that are not true.
    - Who do you really know?
    solution: 'Step 1: never go with a stranger. Step 2: tell a trusted grown-up.'
    mistakes:
      go with them: uk5w_tell
      get in their car: uk5w_tell
  - prompt: Where is it safe to swim?
    options:
    - in a pool with a grown-up watching
    - alone in a river
    - in a deep well
    answer: in a pool with a grown-up watching
    difficulty: 2
    hints:
    - Water can be deep.
    - Who should be watching?
    solution: 'Step 1: water is risky. Step 2: swim only with a grown-up watching.'
    mistakes:
      alone in a river: uk5w_rule
      in a deep well: uk5w_rule
  - prompt: What do you say if someone tries to touch you in a way you don't like?
    options:
    - No!
    - Okay
    - Nothing
    answer: No!
    difficulty: 2
    hints:
    - Your body belongs to you.
    - Say it loud and clear.
    solution: 'Step 1: you can refuse. Step 2: say no, then tell a trusted grown-up.'
    mistakes:
      Okay: uk5w_tell
      Nothing: uk5w_tell
  - prompt: Which of these is safe to play with?
    options:
    - 🧸 a soft toy
    - 🔪 a knife
    - 🔌 a plug
    answer: 🧸 a soft toy
    difficulty: 1
    hints:
    - Which one cannot cut or shock?
    - Soft and cuddly.
    solution: 'Step 1: knives cut, plugs shock. Step 2: the soft toy is safe.'
    mistakes:
      🔪 a knife: uk5w_hurt
      🔌 a plug: uk5w_hurt
  - prompt: You smell smoke at home. What do you do first?
    options:
    - tell a grown-up and go outside
    - hide under the bed
    - open the cupboard to look
    answer: tell a grown-up and go outside
    difficulty: 3
    hints:
    - Smoke can mean fire.
    - Get out and get help.
    solution: 'Step 1: smoke is a warning. Step 2: tell a grown-up, go outside.'
    mistakes:
      hide under the bed: uk5w_rule
      open the cupboard to look: uk5w_rule
  - prompt: When you cut paper, which scissors should you use?
    options:
    - child scissors with round tips
    - big sharp kitchen scissors
    - no scissors, use teeth
    answer: child scissors with round tips
    difficulty: 2
    hints:
    - Sharp points can poke you.
    - Made for small hands.
    solution: 'Step 1: sharp tips hurt. Step 2: round-tipped child scissors.'
    mistakes:
      big sharp kitchen scissors: uk5w_hurt
      no scissors, use teeth: uk5w_hurt
  - prompt: 'Case: Kabir is helping in the kitchen. Kabir sees a sharp knife on the counter and wants to cut an apple. What should Kabir do?'
    options:
    - ask a grown-up to cut it
    - use the knife alone
    - play with the knife
    answer: ask a grown-up to cut it
    hints:
    - Could the knife cut Kabir?
    - Who should use sharp knives?
    solution: Sharp knives can cut, so they are for grown-ups. Kabir should ask a grown-up.
    mistakes:
      use the knife alone: uk5w_hurt
      play with the knife: uk5w_hurt
    exam: case
    difficulty: 2
  - prompt: 'Situation: At a busy market, Riya cannot see Amma anywhere. What should Riya do first?'
    options:
    - stay in one place and ask a shopkeeper for help
    - walk away to look alone
    - go with a stranger who offers sweets
    answer: stay in one place and ask a shopkeeper for help
    hints:
    - Moving around makes it harder to find you.
    - Who is a safe helper to ask?
    solution: Staying in one place and asking a shopkeeper for help is the safe thing to do.
    mistakes:
      walk away to look alone: uk5w_rule
      go with a stranger who offers sweets: uk5w_rule
    exam: competency
    difficulty: 2
