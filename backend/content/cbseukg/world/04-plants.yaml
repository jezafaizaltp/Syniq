# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 4
title: Plants Around Us
tips:
  kg_flower: "Which part do bees visit and we put in our hair?"
  kg_leaf: "Look at a tree outside. What colour is the grass and most leaves?"
  kg_plant_care: "Plants are alive. What would make a plant happy and growing?"
  kg_plant_need: "Plants grow best by a window. What comes in through the window in the day?"
  kg_seed: "A farmer puts something tiny in the soil and waits. A plant comes up from it."
  uk4w_part: "Picture a whole plant from the bottom to the top and name each part. Where is this one?"
  uk4w_need: 'Think what a plant needs to stay alive: water, sunlight, air and soil.'
  uk4w_food: Think which part of the plant we are eating.

concepts:
- code: ukgw.plants
  title: Plants Around Us
  notes: |
    Parts of a plant (root, stem, leaf, flower, fruit); plants need water, sunlight and air; taking care of plants.
  explanations:
    text: A plant has roots under the soil, a stem, green leaves, flowers and sometimes fruits. Plants need water, sunlight and air.
    visual: 'Draw a plant and label: root, stem, leaf, flower.'
    step_by_step: 'Step 1: Start at the bottom: roots. Step 2: Go up: stem, leaves. Step 3: At the top: flower.'
    real_world: Water a plant at home every day and watch it grow.
  picture:
    kind: flow
    steps:
    - seed
    - small plant
    - big plant
    - flower
    alt: A seed grows into a small plant, then a big plant, then it flowers.
  activity:
    type: sort
    prompt: Which part of the plant?
    bins:
    - Roots
    - Leaves
    - Flower
    items:
    - label: Under the soil, drinks water
      bin: Roots
      clue: Which part hides in the ground?
      why: Roots are under the soil and take in water.
    - label: Green, makes food with sunlight
      bin: Leaves
      clue: Which part is green and flat?
      why: Leaves make food using sunlight.
    - label: Colourful, bees visit it
      bin: Flower
      clue: Which part smells nice?
      why: Bees visit the flower.
    - label: Holds the plant in the ground
      bin: Roots
      clue: What stops it falling over?
      why: Roots hold the plant tight in the soil.
    - label: Pretty petals 🌸
      bin: Flower
      clue: Which part has petals?
      why: Petals are part of the flower.
    - label: Spinach we eat 🥬
      bin: Leaves
      clue: Which part of spinach do we cook?
      why: We eat spinach leaves.
  lesson:
    - teach: A plant has parts. Roots hold it in the soil and drink water. The stem holds it up. Leaves make food. Flowers become fruits, and fruits hold seeds.
      picture:
        kind: flow
        steps:
        - roots
        - stem
        - leaves
        - flower
        - fruit with seeds
        alt: Parts of a plant from bottom to top.
      check:
        prompt: Which part holds the plant up straight?
        options:
        - stem
        - root
        - seed
        answer: stem
        why: The stem is like the plant's backbone.
      ways:
      - style: visual
        teach: Parts of a plant from the bottom to the top, one after another.
        picture:
          kind: flow
          steps:
          - roots in the soil
          - stem standing up
          - green leaves
          - flower
          - fruit with seeds
          alt: 'From bottom to top: roots in the soil, the stem standing up, green leaves, a flower, and a fruit with seeds.'
      - style: real_world
        teach: When a gardener pulls out a weed, you can see its roots, still holding bits of soil.
    - teach: Plants need water, sunlight, air and soil to grow. A plant kept in a dark cupboard turns weak and yellow.
      check:
        prompt: 'A plant was kept in a dark cupboard for a week. It will look:'
        options:
        - weak and yellow
        - big and green
        - full of flowers
        answer: weak and yellow
        why: Without sunlight a plant cannot make its food.
      ways:
      - style: visual
        teach: 'Two plants: one with everything it needs, and one kept in the dark.'
        picture:
          kind: compare
          columns:
          - title: By the window
            points:
            - gets sunlight
            - watered
            - green and strong
          - title: In a dark cupboard
            points:
            - no sunlight
            - weak stem
            - yellow leaves
          alt: The plant by the window gets sunlight and water and stays green and strong. The plant in a dark cupboard gets no sunlight, so its stem is weak and its leaves turn yellow.
      - style: step_by_step
        teach: 'Grow a bean. First: put cotton wool in a cup and wet it. Second: place two beans on the cotton. Third: keep the cup near a sunny window. Fourth: add a little water each day and watch a shoot come up.'
    - teach: 'We eat many plant parts: carrot is a root, spinach is a leaf, cauliflower is a flower, mango is a fruit, peas are seeds.'
      picture:
        kind: compare
        columns:
        - title: We eat
          points:
          - carrot
          - spinach
          - peas
        - title: Plant part
          points:
          - root
          - leaf
          - seed
        alt: Foods and the plant part they come from.
      check:
        prompt: Spinach (palak) is which part of a plant?
        options:
        - leaf
        - root
        - fruit
        answer: leaf
        why: We eat the green leaves of spinach.
      ways:
      - style: step_by_step
        teach: 'Find the plant part in your food. First: pick up a vegetable from the kitchen. Second: ask, ''Did it grow under the soil?'' Then it may be a root. Third: ask, ''Is it flat and green?'' Then it may be a leaf. Fourth: ask a grown-up to check your guess.'
      - style: real_world
        teach: When you eat a guava, the tiny hard bits inside are its seeds.
  items:
  - prompt: Which part of a plant is under the soil?
    options:
    - roots
    - flower
    - leaf
    answer: roots
    difficulty: 1
    hints:
    - Hidden.
    - Drinks water.
    solution: Roots are under the soil.
    mistakes:
      flower: ukgw_look
  - prompt: 'Leaves are usually:'
    options:
    - green
    - blue
    - black
    answer: green
    difficulty: 1
    hints:
    - Look at a tree.
    - Like grass.
    solution: Leaves are green.
    mistakes: {"blue": "kg_leaf", "black": "kg_leaf"}
  - prompt: 'Plants need water and:'
    options:
    - sunlight
    - toys
    - chocolate
    answer: sunlight
    difficulty: 1
    hints:
    - From the sky.
    - Warm and bright.
    solution: Plants need sunlight.
    mistakes: {"toys": "kg_plant_need", "chocolate": "kg_plant_need"}
  - prompt: 'A plant grows from a:'
    options:
    - seed
    - stone
    - shoe
    answer: seed
    difficulty: 2
    hints:
    - Put it in soil.
    - Tiny start.
    solution: A plant grows from a seed.
    mistakes: {"stone": "kg_seed", "shoe": "kg_seed"}
  - prompt: Which part of a plant is pretty and smells nice?
    options:
    - flower
    - root
    - stem
    answer: flower
    difficulty: 2
    hints:
    - Bees love it.
    - Colourful.
    solution: The flower.
    mistakes: {"root": "kg_flower", "stem": "kg_flower"}
  - prompt: We should ___ plants.
    options:
    - water and care for
    - pull out
    - step on
    answer: water and care for
    difficulty: 2
    hints:
    - They are living.
    - Be gentle.
    solution: Water and care for plants.
    mistakes: {"pull out": "kg_plant_care", "step on": "kg_plant_care"}
  - prompt: Which part of a plant drinks water from the soil?
    options:
    - roots
    - flowers
    - fruits
    answer: roots
    difficulty: 1
    hints:
    - It is hidden under the ground.
    - Like straws in the soil.
    solution: 'Step 1: water is in the soil. Step 2: roots drink it.'
    mistakes:
      flowers: uk4w_part
      fruits: uk4w_part
  - prompt: A carrot is which part of the plant?
    options:
    - root
    - leaf
    - flower
    answer: root
    difficulty: 2
    hints:
    - We pull it out of the soil.
    - It grows under the ground.
    solution: 'Step 1: carrots grow in the soil. Step 2: it is a root.'
    mistakes:
      leaf: uk4w_food
      flower: uk4w_food
  - prompt: What does a seed need to start growing?
    options:
    - water and soil
    - a toy
    - a plastic bag
    answer: water and soil
    difficulty: 1
    hints:
    - Think of planting a seed in a pot.
    - What do you pour on it?
    solution: 'Step 1: seeds sprout in wet soil. Step 2: water and soil.'
    mistakes:
      a toy: uk4w_need
      a plastic bag: uk4w_need
  - prompt: Peas are which part of the plant?
    options:
    - seeds
    - roots
    - stems
    answer: seeds
    difficulty: 3
    hints:
    - They are inside a green pod.
    - If you plant one, a new plant grows.
    solution: 'Step 1: peas sit in a pod. Step 2: they are seeds.'
    mistakes:
      roots: uk4w_food
      stems: uk4w_food
  - prompt: Where should we keep a pot plant?
    options:
    - where sunlight comes
    - in a dark box
    - under the bed
    answer: where sunlight comes
    difficulty: 2
    hints:
    - Plants need light to make food.
    - Near a window is good.
    solution: 'Step 1: plants need sunlight. Step 2: keep it in the light.'
    mistakes:
      in a dark box: uk4w_need
      under the bed: uk4w_need
  - prompt: Which part of a plant becomes a fruit?
    options:
    - flower
    - root
    - stem
    answer: flower
    difficulty: 3
    hints:
    - Bees visit this part.
    - It is pretty and colourful first.
    solution: 'Step 1: flowers bloom. Step 2: they turn into fruits.'
    mistakes:
      root: uk4w_part
      stem: uk4w_part
  - prompt: Which is a big plant with a hard, woody trunk?
    options:
    - 🌳 tree
    - 🌱 small plant
    - 🌿 grass
    answer: 🌳 tree
    difficulty: 1
    hints:
    - You can climb it.
    - Very tall and strong.
    solution: 'Step 1: woody trunk. Step 2: a tree.'
    mistakes:
      🌱 small plant: uk4w_part
      🌿 grass: uk4w_part
  - prompt: Cauliflower (gobhi) is which part of a plant?
    options:
    - flower
    - root
    - seed
    answer: flower
    difficulty: 3
    hints:
    - The white part is many tiny buds packed together.
    - Read the end of its English name.
    solution: 'Step 1: the white head is buds. Step 2: it is a flower.'
    mistakes:
      root: uk4w_food
      seed: uk4w_food
  - prompt: 'Leaves are green and they:'
    options:
    - make food for the plant
    - hold the plant in soil
    - become seeds
    answer: make food for the plant
    difficulty: 2
    hints:
    - They use sunlight.
    - Like a small kitchen.
    solution: 'Step 1: leaves catch sunlight. Step 2: they make food.'
    mistakes:
      hold the plant in soil: uk4w_part
      become seeds: uk4w_part
  - prompt: 'Case: Sana''s pot plant is drooping. Its soil is dry and cracked, but it gets plenty of sun. What does the plant need?'
    options:
    - water
    - a dark cupboard
    - a plastic cover
    answer: water
    hints:
    - Look at the soil.
    - What does a plant drink through its roots?
    solution: The soil is dry, so the plant needs water. It already gets sunlight.
    mistakes:
      a dark cupboard: kg_plant_care
      a plastic cover: kg_plant_care
    exam: case
    difficulty: 2
  - prompt: 'Situation: For dinner, Amma makes palak paneer. Which part of the spinach plant are they eating?'
    options:
    - leaves
    - roots
    - seeds
    answer: leaves
    hints:
    - Palak is spinach.
    - Is spinach flat and green?
    solution: Spinach (palak) is a leaf we eat, so they are eating leaves.
    mistakes:
      roots: uk4w_food
      seeds: uk4w_food
    exam: competency
    difficulty: 2
