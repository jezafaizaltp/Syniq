# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 4
title: Plants Around Us
concepts:
- code: ukgw.plants
  title: Plants Around Us
  notes: |
    Parts of a plant (root, stem, leaf, flower, fruit); plants need water, sunlight and air; taking care of plants.
  explanations:
    text: A plant has roots under the soil, a stem, green leaves, flowers and sometimes fruits. Plants need water, sunlight and air.
    visual: 'Draw a plant and label: root, stem, leaf, flower.'
    step_by_step: 'Step 1: Start at the bottom: roots. Step 2: Go up: stem, leaves. Step 3: At the top: flower.'
    real_world: Water a plant at home every day and watch it grow.
  picture:
    kind: flow
    steps:
    - seed
    - small plant
    - big plant
    - flower
    alt: A seed grows into a small plant, then a big plant, then it flowers.
  activity:
    type: sort
    prompt: Which part of the plant?
    bins:
    - Roots
    - Leaves
    - Flower
    items:
    - label: Under the soil, drinks water
      bin: Roots
      clue: Which part hides in the ground?
      why: Roots are under the soil and take in water.
    - label: Green, makes food with sunlight
      bin: Leaves
      clue: Which part is green and flat?
      why: Leaves make food using sunlight.
    - label: Colourful, bees visit it
      bin: Flower
      clue: Which part smells nice?
      why: Bees visit the flower.
    - label: Holds the plant in the ground
      bin: Roots
      clue: What stops it falling over?
      why: Roots hold the plant tight in the soil.
    - label: Pretty petals 🌸
      bin: Flower
      clue: Which part has petals?
      why: Petals are part of the flower.
    - label: Spinach we eat 🥬
      bin: Leaves
      clue: Which part of spinach do we cook?
      why: We eat spinach leaves.
  items:
  - prompt: Which part of a plant is under the soil?
    options:
    - roots
    - flower
    - leaf
    answer: roots
    difficulty: 1
    hints:
    - Hidden.
    - Drinks water.
    solution: Roots are under the soil.
    mistakes:
      flower: ukgw_look
  - prompt: 'Leaves are usually:'
    options:
    - green
    - blue
    - black
    answer: green
    difficulty: 1
    hints:
    - Look at a tree.
    - Like grass.
    solution: Leaves are green.
  - prompt: 'Plants need water and:'
    options:
    - sunlight
    - toys
    - chocolate
    answer: sunlight
    difficulty: 1
    hints:
    - From the sky.
    - Warm and bright.
    solution: Plants need sunlight.
  - prompt: 'A plant grows from a:'
    options:
    - seed
    - stone
    - shoe
    answer: seed
    difficulty: 2
    hints:
    - Put it in soil.
    - Tiny start.
    solution: A plant grows from a seed.
  - prompt: Which part of a plant is pretty and smells nice?
    options:
    - flower
    - root
    - stem
    answer: flower
    difficulty: 2
    hints:
    - Bees love it.
    - Colourful.
    solution: The flower.
  - prompt: We should ___ plants.
    options:
    - water and care for
    - pull out
    - step on
    answer: water and care for
    difficulty: 2
    hints:
    - They are living.
    - Be gentle.
    solution: Water and care for plants.
