# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 2
title: Ways to Travel
tips:
  uk2w_fuel: "Think what makes it move: an engine, or your own legs?"
  kg_road: "Roads have fast cars. Who keeps you safe when you cross?"
  kg_seat: "What strap goes across you in a car to keep you safe if it stops fast?"
  kg_tracks: "Look at a railway line. What long metal lines does the train ride on?"
  kg_water_go: "Cars need roads, trains need tracks. Which one floats?"
  uk2w_where: 'Think where it moves: on land, on water, or in the air?'
  uk2w_safe: Think what keeps you safe and stops you getting hurt.
  uk2w_wheels: Picture it and count its wheels one by one.

concepts:
- code: ukgw.transport
  title: Ways to Travel
  notes: |
    Land, water and air transport: bus, train, boat, ship, aeroplane; road safety: seat belt, holding hands.
  explanations:
    text: We travel by land (bus, car, train), by water (boat, ship) and by air (aeroplane, helicopter).
    visual: Draw a road with a bus, water with a boat and the sky with an aeroplane.
    step_by_step: 'Step 1: Look at the vehicle. Step 2: Does it go on land, water or in the air?'
    real_world: Hold a grown-up's hand when crossing the road.
  picture:
    kind: compare
    columns:
    - title: Land
      points:
      - 🚌 bus
      - 🚆 train
    - title: Water
      points:
      - ⛵ boat
      - 🚢 ship
    - title: Air
      points:
      - ✈️ aeroplane
      - 🚁 helicopter
    alt: 'Land: bus, train. Water: boat, ship. Air: aeroplane, helicopter.'
  activity:
    type: sort
    prompt: Where does it go?
    bins:
    - 🛣️ Land
    - 🌊 Water
    - ☁️ Air
    items:
    - label: 🚌 Bus
      bin: 🛣️ Land
      clue: Does it have wheels on a road?
      why: A bus goes on roads.
    - label: 🚂 Train
      bin: 🛣️ Land
      clue: It runs on rails.
      why: A train goes on land.
    - label: ⛵ Boat
      bin: 🌊 Water
      clue: Does it float?
      why: A boat goes on water.
    - label: 🚢 Ship
      bin: 🌊 Water
      clue: It crosses the sea.
      why: A ship goes on water.
    - label: ✈️ Aeroplane
      bin: ☁️ Air
      clue: Does it fly?
      why: An aeroplane flies in the air.
    - label: 🚁 Helicopter
      bin: ☁️ Air
      clue: Its blades spin on top.
      why: A helicopter flies in the air.
  lesson:
    - teach: 'We travel in many ways. On land: bus, car, auto, cycle, train. On water: boat, ship. In the air: aeroplane, helicopter.'
      picture:
        kind: compare
        columns:
        - title: Land
          points:
          - bus
          - train
          - cycle
        - title: Water
          points:
          - boat
          - ship
        - title: Air
          points:
          - aeroplane
          - helicopter
        alt: Land, water and air transport.
      check:
        prompt: Which one goes on water?
        options:
        - 🚢 ship
        - 🚗 car
        - 🚁 helicopter
        answer: 🚢 ship
        why: Ships float and move on the sea.
      ways:
      - style: step_by_step
        teach: 'Sort vehicles by where they go. First: name the vehicle. Second: ask, ''Does it need a road or tracks?'' That is land. Third: ask, ''Does it float?'' That is water. Fourth: ask, ''Does it fly?'' That is air.'
      - style: real_world
        teach: To visit a far city, a family might take an auto to the station, a train to the city, and a bus to the house.
    - teach: 'Vehicles have different numbers of wheels: a cycle has 2, an auto rickshaw has 3, a car has 4, a bus and a truck have more.'
      picture:
        kind: bars
        unit: wheels
        bars:
        - label: cycle
          value: 2
        - label: auto
          value: 3
        - label: car
          value: 4
        - label: bus
          value: 6
        alt: Wheels on a cycle, auto, car and bus.
      check:
        prompt: How many wheels does an auto rickshaw have?
        options:
        - '3'
        - '2'
        - '4'
        answer: '3'
        why: One wheel in front and two at the back.
      ways:
      - style: step_by_step
        teach: 'Count wheels on a toy. First: turn the toy truck upside down. Second: touch one wheel and say one. Third: touch each next wheel and say the next number. Fourth: the last number tells how many wheels it has.'
      - style: real_world
        teach: A big truck carrying goods has many wheels so it can hold a heavy load.
    - teach: 'Stay safe: wear a seat belt in a car, a helmet on a scooter, hold a grown-up''s hand on the road, and cross only when the signal is green for walkers.'
      check:
        prompt: What do we wear on our head on a scooter?
        options:
        - a helmet
        - a cap
        - nothing
        answer: a helmet
        why: A helmet protects your head if you fall.
      ways:
      - style: visual
        teach: Safe ways to travel and unsafe ways, side by side.
        picture:
          kind: compare
          columns:
          - title: Safe
            points:
            - wear a helmet on a scooter
            - wait for the green walking signal
            - keep hands inside the bus
          - title: Unsafe
            points:
            - ride without a helmet
            - run across the road
            - lean out of the window
          alt: 'Safe: wear a helmet on a scooter, wait for the green walking signal and keep hands inside the bus. Unsafe: ride without a helmet, run across the road and lean out of the window.'
      - style: real_world
        teach: Near schools, traffic police often stop cars so that children can cross the road safely.
  items:
  - prompt: Which goes in the air?
    options:
    - ✈️ aeroplane
    - 🚌 bus
    - ⛵ boat
    answer: ✈️ aeroplane
    difficulty: 1
    hints:
    - It has wings.
    - Flies.
    solution: An aeroplane flies in the air.
    mistakes:
      ⛵ boat: ukgw_look
  - prompt: Which goes on water?
    options:
    - ⛵ boat
    - 🚗 car
    - 🚆 train
    answer: ⛵ boat
    difficulty: 1
    hints:
    - It floats.
    - River or sea.
    solution: A boat goes on water.
    mistakes: {"🚗 car": "kg_water_go", "🚆 train": "kg_water_go"}
  - prompt: 'A train runs on:'
    options:
    - tracks
    - water
    - clouds
    answer: tracks
    difficulty: 1
    hints:
    - Long metal lines.
    - Railway.
    solution: A train runs on tracks.
    mistakes: {"water": "kg_tracks", "clouds": "kg_tracks"}
  - prompt: 'In a car we should wear a:'
    options:
    - seat belt
    - crown
    - raincoat
    answer: seat belt
    difficulty: 2
    hints:
    - Keeps us safe.
    - Click!
    solution: Wear a seat belt.
    mistakes: {"crown": "kg_seat", "raincoat": "kg_seat"}
  - prompt: 'To cross the road we:'
    options:
    - hold a grown-up's hand
    - run fast alone
    - close our eyes
    answer: hold a grown-up's hand
    difficulty: 2
    hints:
    - Stay safe.
    - Look both ways.
    solution: Hold a grown-up's hand.
    mistakes: {"run fast alone": "kg_road", "close our eyes": "kg_road"}
  - prompt: How many wheels does a bicycle have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Front and back.
    - Bi means two.
    solution: A bicycle has 2 wheels.
    mistakes:
      '4': ukgw_look
      '3': ukgw_look
  - prompt: Which one flies in the air?
    options:
    - 🚁 helicopter
    - 🚌 bus
    - ⛵ boat
    answer: 🚁 helicopter
    difficulty: 1
    hints:
    - Look for spinning blades on top.
    - It goes up like a bird.
    solution: 'Step 1: bus on land, boat on water. Step 2: helicopter flies.'
    mistakes:
      🚌 bus: uk2w_where
      ⛵ boat: uk2w_where
  - prompt: How many wheels does a car have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Two in front, and some at the back.
    - Count them.
    solution: 'Step 1: 2 in front, 2 at the back. Step 2: 4 wheels.'
    mistakes:
      '2': uk2w_wheels
      '3': uk2w_wheels
  - prompt: 'The traffic light is red. Cars must:'
    options:
    - stop
    - go fast
    - honk and go
    answer: stop
    difficulty: 2
    hints:
    - Red means danger.
    - Wait for green.
    solution: 'Step 1: red light. Step 2: stop.'
    mistakes:
      go fast: uk2w_safe
      honk and go: uk2w_safe
  - prompt: Which one runs on a track?
    options:
    - 🚆 train
    - 🚲 cycle
    - ✈️ aeroplane
    answer: 🚆 train
    difficulty: 1
    hints:
    - Long metal lines on the ground.
    - It has many coaches.
    solution: 'Step 1: tracks are rails. Step 2: the train runs on them.'
    mistakes:
      🚲 cycle: uk2w_where
      ✈️ aeroplane: uk2w_where
  - prompt: Where do we cross the road?
    options:
    - at the zebra crossing
    - anywhere we like
    - between parked cars
    answer: at the zebra crossing
    difficulty: 2
    hints:
    - Look for black and white stripes.
    - Drivers expect walkers there.
    solution: 'Step 1: a safe place for walkers. Step 2: zebra crossing.'
    mistakes:
      anywhere we like: uk2w_safe
      between parked cars: uk2w_safe
  - prompt: A cycle and a car. How many wheels in all?
    answer: '6'
    check: 2+4
    difficulty: 3
    hints:
    - Count the cycle's wheels first.
    - Then add the car's.
    solution: 'Step 1: 2 + 4. Step 2: 6 wheels.'
    mistakes:
      '5': uk2w_wheels
      '4': uk2w_wheels
  - prompt: 'Fishermen go out to sea in a:'
    options:
    - boat
    - bus
    - train
    answer: boat
    difficulty: 2
    hints:
    - It must float.
    - Fish live in the water.
    solution: 'Step 1: sea is water. Step 2: boat.'
    mistakes:
      bus: uk2w_where
      train: uk2w_where
  - prompt: 'In a moving bus, we should:'
    options:
    - sit and hold on
    - stand on the seat
    - put our hand out of the window
    answer: sit and hold on
    difficulty: 2
    hints:
    - The bus can stop suddenly.
    - Keep hands and head inside.
    solution: 'Step 1: buses jerk and stop. Step 2: sit and hold on.'
    mistakes:
      stand on the seat: uk2w_safe
      put our hand out of the window: uk2w_safe
  - prompt: Which one needs no petrol and no engine?
    options:
    - 🚲 cycle
    - 🚗 car
    - 🛵 scooter
    answer: 🚲 cycle
    difficulty: 3
    hints:
    - What makes it move?
    - Your legs do the work.
    solution: 'Step 1: car and scooter need fuel. Step 2: the cycle uses pedals.'
    mistakes:
      🚗 car: uk2w_fuel
      🛵 scooter: uk2w_fuel
  - prompt: 'Case: Riya''s family is going to an island in the sea. The island has no bridge or road. How can they get there?'
    options:
    - by boat
    - by car
    - by train
    answer: by boat
    hints:
    - Is there land, water or air between them and the island?
    - Which vehicle moves on water?
    solution: Water lies between them and the island, so they go by boat.
    mistakes:
      by car: uk2w_where
      by train: uk2w_where
    exam: case
    difficulty: 2
  - prompt: 'Situation: Papa is taking Arjun to school on the family scooter. What must they both wear?'
    options:
    - helmets
    - sunglasses
    - raincoats
    answer: helmets
    hints:
    - Think what keeps the head safe on a scooter.
    - Which one stops you getting hurt if you fall?
    solution: On a scooter, a helmet keeps the head safe, so both must wear helmets.
    mistakes:
      sunglasses: uk2w_safe
      raincoats: uk2w_safe
    exam: competency
    difficulty: 2
