# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 2
title: Ways to Travel
tips:
  kg_road: "Roads have fast cars. Who keeps you safe when you cross?"
  kg_seat: "What strap goes across you in a car to keep you safe if it stops fast?"
  kg_tracks: "Look at a railway line. What long metal lines does the train ride on?"
  kg_water_go: "Cars need roads, trains need tracks. Which one floats?"

concepts:
- code: ukgw.transport
  title: Ways to Travel
  notes: |
    Land, water and air transport: bus, train, boat, ship, aeroplane; road safety: seat belt, holding hands.
  explanations:
    text: We travel by land (bus, car, train), by water (boat, ship) and by air (aeroplane, helicopter).
    visual: Draw a road with a bus, water with a boat and the sky with an aeroplane.
    step_by_step: 'Step 1: Look at the vehicle. Step 2: Does it go on land, water or in the air?'
    real_world: Hold a grown-up's hand when crossing the road.
  picture:
    kind: compare
    columns:
    - title: Land
      points:
      - 🚌 bus
      - 🚆 train
    - title: Water
      points:
      - ⛵ boat
      - 🚢 ship
    - title: Air
      points:
      - ✈️ aeroplane
      - 🚁 helicopter
    alt: 'Land: bus, train. Water: boat, ship. Air: aeroplane, helicopter.'
  activity:
    type: sort
    prompt: Where does it go?
    bins:
    - 🛣️ Land
    - 🌊 Water
    - ☁️ Air
    items:
    - label: 🚌 Bus
      bin: 🛣️ Land
      clue: Does it have wheels on a road?
      why: A bus goes on roads.
    - label: 🚂 Train
      bin: 🛣️ Land
      clue: It runs on rails.
      why: A train goes on land.
    - label: ⛵ Boat
      bin: 🌊 Water
      clue: Does it float?
      why: A boat goes on water.
    - label: 🚢 Ship
      bin: 🌊 Water
      clue: It crosses the sea.
      why: A ship goes on water.
    - label: ✈️ Aeroplane
      bin: ☁️ Air
      clue: Does it fly?
      why: An aeroplane flies in the air.
    - label: 🚁 Helicopter
      bin: ☁️ Air
      clue: Its blades spin on top.
      why: A helicopter flies in the air.
  items:
  - prompt: Which goes in the air?
    options:
    - ✈️ aeroplane
    - 🚌 bus
    - ⛵ boat
    answer: ✈️ aeroplane
    difficulty: 1
    hints:
    - It has wings.
    - Flies.
    solution: An aeroplane flies in the air.
    mistakes:
      ⛵ boat: ukgw_look
  - prompt: Which goes on water?
    options:
    - ⛵ boat
    - 🚗 car
    - 🚆 train
    answer: ⛵ boat
    difficulty: 1
    hints:
    - It floats.
    - River or sea.
    solution: A boat goes on water.
    mistakes: {"🚗 car": "kg_water_go", "🚆 train": "kg_water_go"}
  - prompt: 'A train runs on:'
    options:
    - tracks
    - water
    - clouds
    answer: tracks
    difficulty: 1
    hints:
    - Long metal lines.
    - Railway.
    solution: A train runs on tracks.
    mistakes: {"water": "kg_tracks", "clouds": "kg_tracks"}
  - prompt: 'In a car we should wear a:'
    options:
    - seat belt
    - crown
    - raincoat
    answer: seat belt
    difficulty: 2
    hints:
    - Keeps us safe.
    - Click!
    solution: Wear a seat belt.
    mistakes: {"crown": "kg_seat", "raincoat": "kg_seat"}
  - prompt: 'To cross the road we:'
    options:
    - hold a grown-up's hand
    - run fast alone
    - close our eyes
    answer: hold a grown-up's hand
    difficulty: 2
    hints:
    - Stay safe.
    - Look both ways.
    solution: Hold a grown-up's hand.
    mistakes: {"run fast alone": "kg_road", "close our eyes": "kg_road"}
  - prompt: How many wheels does a bicycle have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Front and back.
    - Bi means two.
    solution: A bicycle has 2 wheels.
    mistakes:
      '4': ukgw_look
      '3': ukgw_look
