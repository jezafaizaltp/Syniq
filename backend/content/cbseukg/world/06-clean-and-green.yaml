# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 6
title: Clean and Green
tips:
  kg_brush: "We eat every day. Food sticks to teeth after breakfast and dinner."
  kg_tap: "Water is precious. If the tap keeps running, where does the water go?"
  kg_tree_give: "Stand under a tree on a sunny day. How does it feel? Trees also clean the air."
  kg_waste: "Was it once part of a plant or food? Is it soft and damp?"
  uk6w_bin: 'Ask: did it come from a plant or animal and will it rot? That goes in the wet bin.'
  uk6w_save: 'Think: does this waste water, paper or power, or does it save it?'
  uk6w_clean: Think what keeps germs away from your body and your home.

concepts:
- code: ukgw.clean
  title: Clean and Green
  notes: |
    Keeping ourselves and our surroundings clean: bins, not wasting water, saving paper, plants and trees; dry and wet waste.
  explanations:
    text: 'Keep our home, school and streets clean: put waste in the bin, close the tap, and plant trees.'
    visual: Draw a green bin and a blue bin, and a child putting a peel in one.
    step_by_step: 'Step 1: Is it rubbish? Step 2: Put it in the bin. Step 3: Close taps and save water.'
    real_world: 'Swachh Bharat: everyone helps keep India clean.'
  picture:
    kind: flow
    steps:
    - Pick up
    - Put in bin
    - Wash hands
    alt: Pick up the rubbish, put it in the bin, and wash your hands.
  activity:
    type: sort
    prompt: Good habit or bad habit?
    bins:
    - 👍 Good habit
    - 👎 Bad habit
    items:
    - label: Putting waste in the bin
      bin: 👍 Good habit
      clue: Where should rubbish go?
      why: The bin keeps our place clean.
    - label: Leaving the tap running
      bin: 👎 Bad habit
      clue: Where does the water go?
      why: Water gets wasted. Close the tap.
    - label: Throwing wrappers on the road
      bin: 👎 Bad habit
      clue: Who has to pick it up?
      why: Litter makes streets dirty.
    - label: Planting a tree
      bin: 👍 Good habit
      clue: Trees give shade and clean air.
      why: Planting trees helps our earth.
    - label: Washing hands before eating
      bin: 👍 Good habit
      clue: Germs go away with soap.
      why: Clean hands keep us well.
    - label: Plucking flowers in the park
      bin: 👎 Bad habit
      clue: Can others enjoy them after?
      why: Leave flowers for everyone to enjoy.
  lesson:
    - teach: 'We keep ourselves clean: wash hands with soap before eating and after the toilet, bathe every day, brush teeth morning and night, cut nails.'
      picture:
        kind: flow
        steps:
        - wet hands
        - soap
        - rub 20 seconds
        - rinse
        - dry
        alt: Steps to wash hands.
      check:
        prompt: When should we wash our hands with soap?
        options:
        - before eating
        - only on Sundays
        - never
        answer: before eating
        why: Soap washes germs off before they reach our food.
      ways:
      - style: step_by_step
        teach: 'Wash your hands well. First: wet your hands. Second: rub soap on the palms, backs and between the fingers. Third: scrub while you sing a short song. Fourth: rinse and dry with a clean towel.'
      - style: real_world
        teach: Doctors and cooks wash their hands many times a day so germs do not spread.
    - teach: 'Waste goes in two bins. Wet waste rots: fruit peels, leftover food, leaves (green bin). Dry waste does not rot: paper, plastic, tins (blue bin).'
      picture:
        kind: compare
        columns:
        - title: Wet waste (green bin)
          points:
          - banana peel
          - leftover rice
          - dry leaves
        - title: Dry waste (blue bin)
          points:
          - paper
          - plastic bottle
          - tin can
        alt: Wet waste and dry waste.
      check:
        prompt: 'A leftover chapati goes in the:'
        options:
        - wet waste bin
        - dry waste bin
        - drain
        answer: wet waste bin
        why: Food rots, so it is wet waste.
      ways:
      - style: step_by_step
        teach: 'Sort the rubbish. First: pick up one piece. Second: ask, ''Will it rot, like peels and food?'' Third: if yes, put it in the green bin. Fourth: if no, like paper or plastic, put it in the blue bin.'
      - style: real_world
        teach: In many cities, the garbage van has two parts, one for wet waste and one for dry waste.
    - teach: 'We keep the Earth green: plant trees, close taps, switch off lights and fans when leaving a room, use both sides of paper, carry a cloth bag.'
      check:
        prompt: You leave the room. What should you do with the fan?
        options:
        - switch it off
        - leave it on
        - turn it faster
        answer: switch it off
        why: Switching off saves electricity.
      ways:
      - style: visual
        teach: Things that waste and things that save, side by side.
        picture:
          kind: compare
          columns:
          - title: Wastes
            points:
            - fan on in an empty room
            - plastic bag for every shop
            - tap running while brushing
          - title: Saves
            points:
            - switch off when leaving
            - carry a cloth bag
            - close the tap while brushing
          alt: A fan on in an empty room, a plastic bag for every shop and a running tap while brushing waste. Switching off when leaving, carrying a cloth bag and closing the tap while brushing save.
      - style: real_world
        teach: On Earth Hour, many families switch off their lights for one hour to save power.
  items:
  - prompt: Where does rubbish go?
    options:
    - in the bin
    - on the road
    - in the river
    answer: in the bin
    difficulty: 1
    hints:
    - A special box.
    - Keep places clean.
    solution: Rubbish goes in the bin.
    mistakes:
      on the road: ukgw_think
  - prompt: 'After washing your hands, you should:'
    options:
    - close the tap
    - leave it running
    - break it
    answer: close the tap
    difficulty: 1
    hints:
    - Save water.
    - Turn it off.
    solution: Close the tap.
    mistakes: {"leave it running": "kg_tap", "break it": "kg_tap"}
  - prompt: 'Trees give us:'
    options:
    - fresh air and shade
    - smoke
    - noise
    answer: fresh air and shade
    difficulty: 1
    hints:
    - Breathe.
    - Cool under them.
    solution: Trees give fresh air and shade.
    mistakes: {"smoke": "kg_tree_give", "noise": "kg_tree_give"}
  - prompt: 'A banana peel is:'
    options:
    - wet waste
    - dry waste
    - a toy
    answer: wet waste
    difficulty: 2
    hints:
    - From food.
    - It rots.
    solution: A banana peel is wet waste.
    mistakes: {"dry waste": "kg_waste", "a toy": "kg_waste"}
  - prompt: 'A paper wrapper is:'
    options:
    - dry waste
    - wet waste
    - food
    answer: dry waste
    difficulty: 2
    hints:
    - Not from food scraps.
    - Dry.
    solution: A paper wrapper is dry waste.
    mistakes: {"wet waste": "kg_waste", "food": "kg_waste"}
  - prompt: 'We brush our teeth:'
    options:
    - every morning and night
    - once a month
    - never
    answer: every morning and night
    difficulty: 2
    hints:
    - Twice a day.
    - Clean teeth.
    solution: Brush every morning and night.
    mistakes: {"once a month": "kg_brush", "never": "kg_brush"}
  - prompt: An apple core goes in which bin?
    options:
    - wet waste
    - dry waste
    - no bin, throw on the road
    answer: wet waste
    difficulty: 1
    hints:
    - Will it rot after some days?
    - It came from a plant.
    solution: 'Step 1: fruit rots. Step 2: wet waste.'
    mistakes:
      dry waste: uk6w_bin
      no bin, throw on the road: uk6w_bin
  - prompt: A plastic bottle goes in which bin?
    options:
    - dry waste
    - wet waste
    - the river
    answer: dry waste
    difficulty: 2
    hints:
    - Plastic does not rot.
    - It can be recycled.
    solution: 'Step 1: plastic does not rot. Step 2: dry waste.'
    mistakes:
      wet waste: uk6w_bin
      the river: uk6w_bin
  - prompt: Which saves paper?
    options:
    - drawing on both sides
    - tearing pages for fun
    - throwing a page after one line
    answer: drawing on both sides
    difficulty: 2
    hints:
    - Paper comes from trees.
    - Use every bit.
    solution: 'Step 1: paper is made from trees. Step 2: use both sides.'
    mistakes:
      tearing pages for fun: uk6w_save
      throwing a page after one line: uk6w_save
  - prompt: For shopping, which bag is best for the Earth?
    options:
    - a cloth bag
    - a new plastic bag each time
    - no bag, drop things
    answer: a cloth bag
    difficulty: 2
    hints:
    - Which bag can be used again and again?
    - Plastic stays for many years.
    solution: 'Step 1: plastic harms the Earth. Step 2: reuse a cloth bag.'
    mistakes:
      a new plastic bag each time: uk6w_save
      no bag, drop things: uk6w_save
  - prompt: How often should we bathe?
    options:
    - every day
    - once a month
    - only on birthdays
    answer: every day
    difficulty: 1
    hints:
    - Sweat and dust collect on us daily.
    - Fresh every morning.
    solution: 'Step 1: we get dirty each day. Step 2: bathe every day.'
    mistakes:
      once a month: uk6w_clean
      only on birthdays: uk6w_clean
  - prompt: 'Dry leaves in the garden can become:'
    options:
    - compost for plants
    - plastic
    - glass
    answer: compost for plants
    difficulty: 3
    hints:
    - Leaves rot slowly in a pit.
    - It turns into rich soil.
    solution: 'Step 1: leaves are wet waste. Step 2: they become compost.'
    mistakes:
      plastic: uk6w_bin
      glass: uk6w_bin
  - prompt: Why do we cut our nails?
    options:
    - "dirt and germs hide under long nails"
    - "so that we look a little taller"
    - "so that we can run much faster"
    answer: dirt and germs hide under long nails
    difficulty: 3
    hints:
    - Look under your nails after play.
    - What could go into your food?
    solution: 'Step 1: long nails hold dirt. Step 2: cutting them keeps germs away.'
    mistakes:
      "so that we look a little taller": uk6w_clean
      "so that we can run much faster": uk6w_clean
  - prompt: A tap is dripping. What can you do?
    options:
    - "close it tight or tell a grown-up"
    - "let it keep dripping all day"
    - "open it more so it runs faster"
    answer: close it tight or tell a grown-up
    difficulty: 1
    hints:
    - Every drop counts.
    - Stop the water.
    solution: 'Step 1: dripping wastes water. Step 2: close it or get help.'
    mistakes:
      "let it keep dripping all day": uk6w_save
      "open it more so it runs faster": uk6w_save
  - prompt: A tin can goes in which bin?
    options:
    - dry waste
    - wet waste
    - the drain
    answer: dry waste
    difficulty: 2
    hints:
    - Metal does not rot.
    - Clean and dry things go together.
    solution: 'Step 1: metal does not rot. Step 2: dry waste.'
    mistakes:
      wet waste: uk6w_bin
      the drain: uk6w_bin
  - prompt: 'Case: After lunch at school, Asha has an orange peel and a juice-box wrapper. Where should the orange peel go?'
    options:
    - the wet waste bin
    - the dry waste bin
    - on the ground
    answer: the wet waste bin
    hints:
    - Did the peel come from a plant?
    - Will it rot away?
    solution: An orange peel comes from a plant and rots, so it goes in the wet waste bin.
    mistakes:
      the dry waste bin: uk6w_bin
      on the ground: uk6w_bin
    exam: case
    difficulty: 2
  - prompt: 'Situation: Ravi is leaving the bedroom to go and play. The light and fan are still on. What should Ravi do?'
    options:
    - switch them off
    - leave them on
    - turn the fan faster
    answer: switch them off
    hints:
    - Is anyone left in the room?
    - Does leaving them on save power or waste it?
    solution: No one is in the room, so switching off the light and fan saves power.
    mistakes:
      leave them on: uk6w_save
      turn the fan faster: uk6w_save
    exam: competency
    difficulty: 2
