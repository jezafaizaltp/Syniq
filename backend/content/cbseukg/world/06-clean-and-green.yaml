# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 6
title: Clean and Green
concepts:
- code: ukgw.clean
  title: Clean and Green
  notes: |
    Keeping ourselves and our surroundings clean: bins, not wasting water, saving paper, plants and trees; dry and wet waste.
  explanations:
    text: 'Keep our home, school and streets clean: put waste in the bin, close the tap, and plant trees.'
    visual: Draw a green bin and a blue bin, and a child putting a peel in one.
    step_by_step: 'Step 1: Is it rubbish? Step 2: Put it in the bin. Step 3: Close taps and save water.'
    real_world: 'Swachh Bharat: everyone helps keep India clean.'
  picture:
    kind: flow
    steps:
    - Pick up
    - Put in bin
    - Wash hands
    alt: Pick up the rubbish, put it in the bin, and wash your hands.
  items:
  - prompt: Where does rubbish go?
    options:
    - in the bin
    - on the road
    - in the river
    answer: in the bin
    difficulty: 1
    hints:
    - A special box.
    - Keep places clean.
    solution: Rubbish goes in the bin.
    mistakes:
      on the road: ukgw_think
  - prompt: 'After washing your hands, you should:'
    options:
    - close the tap
    - leave it running
    - break it
    answer: close the tap
    difficulty: 1
    hints:
    - Save water.
    - Turn it off.
    solution: Close the tap.
  - prompt: 'Trees give us:'
    options:
    - fresh air and shade
    - smoke
    - noise
    answer: fresh air and shade
    difficulty: 1
    hints:
    - Breathe.
    - Cool under them.
    solution: Trees give fresh air and shade.
  - prompt: 'A banana peel is:'
    options:
    - wet waste
    - dry waste
    - a toy
    answer: wet waste
    difficulty: 2
    hints:
    - From food.
    - It rots.
    solution: A banana peel is wet waste.
  - prompt: 'A paper wrapper is:'
    options:
    - dry waste
    - wet waste
    - food
    answer: dry waste
    difficulty: 2
    hints:
    - Not from food scraps.
    - Dry.
    solution: A paper wrapper is dry waste.
  - prompt: 'We brush our teeth:'
    options:
    - every morning and night
    - once a month
    - never
    answer: every morning and night
    difficulty: 2
    hints:
    - Twice a day.
    - Clean teeth.
    solution: Brush every morning and night.
