# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 1
title: Weather and Seasons
tips:
  ukgw_look: Look at the picture again. Say what you see.
  ukgw_think: Think about your street and your day. What do you see there?
  kg_cold: "On a cold day you shiver. What covers your arms and keeps you warm?"
  kg_drink: "On a hot day we sweat a lot. What does the body need back?"
  kg_kite: "A kite needs moving air to lift it up."
  kg_rainbow: "Stars and the moon come at night. What colourful arch shines when sun meets rain?"
  kg_summer: "In which season do we want ice cream, a fan, and mangoes?"
  uk1w_sky: "Look at the sky in your mind. What is it doing, and what do you feel on your skin?"
  uk1w_wear: Think how your body feels in that weather. What would keep you comfortable?
  uk1w_season: 'Think of the whole season: hot months, rainy months or cold months?'
concepts:
- code: ukgw.weather
  title: Weather and Seasons
  notes: |
    Sunny, rainy, windy and cold days; summer, rainy season and winter; what we wear and carry.
  explanations:
    text: Some days are sunny, some are rainy, some are windy and some are cold. We wear cotton in summer, carry an umbrella in the rain and wear a sweater in winter.
    visual: 'Draw three children: one with a cap in the sun, one with an umbrella in the rain, one in a sweater.'
    step_by_step: 'Step 1: Look outside. Step 2: Say the weather. Step 3: Choose what to wear.'
    real_world: In Kerala the rains start in June; in Delhi January is very cold.
  picture:
    kind: compare
    columns:
    - title: Weather
      points:
      - ☀️ sunny
      - 🌧️ rainy
      - ❄️ cold
    - title: We use
      points:
      - cap
      - umbrella
      - sweater
    alt: 'Sunny: a cap. Rainy: an umbrella. Cold: a sweater.'
  activity:
    type: sort
    prompt: What do we need?
    bins:
    - ☂️ Umbrella
    - 🧥 Sweater
    - 👕 Cotton clothes
    items:
    - label: 🌧️ It is raining
      bin: ☂️ Umbrella
      clue: What keeps you dry?
      why: An umbrella keeps the rain off.
    - label: ❄️ It is very cold
      bin: 🧥 Sweater
      clue: What keeps you warm?
      why: A sweater keeps us warm.
    - label: ☀️ It is very hot
      bin: 👕 Cotton clothes
      clue: What keeps you cool?
      why: Thin cotton clothes keep us cool.
    - label: ⛈️ Big rain and thunder
      bin: ☂️ Umbrella
      clue: Water is falling.
      why: Take an umbrella, and stay indoors in thunder.
    - label: 🌬️ Chilly winter morning
      bin: 🧥 Sweater
      clue: You are shivering.
      why: A sweater keeps us warm.
    - label: 🏖️ Sunny summer day
      bin: 👕 Cotton clothes
      clue: You are sweating.
      why: Cotton lets sweat dry and keeps us cool.
  lesson:
    - teach: 'Weather is what the sky and air are like today: sunny ☀️, rainy 🌧️, cloudy ☁️, windy 🌬️ or cold ❄️. It can change from day to day.'
      check:
        prompt: Dark clouds and drops falling from the sky. What weather is it?
        options:
        - rainy
        - sunny
        - windy
        answer: rainy
        why: Drops falling from clouds is rain.
      ways:
      - style: visual
        teach: A week of weather, as a chart. Each bar shows how many days had that weather.
        picture:
          kind: bars
          bars:
          - label: ☀️ sunny
            value: 3
          - label: ☁️ cloudy
            value: 2
          - label: 🌧️ rainy
            value: 2
          alt: In one week there were 3 sunny days, 2 cloudy days and 2 rainy days.
      - style: step_by_step
        teach: 'Make a weather chart. First: look out of the window every morning. Second: draw a sun, a cloud or raindrops for what you see. Third: stick the drawing on the chart. Fourth: at the end of the week, count each kind of day.'
    - teach: 'In India we have three big seasons: summer (hot), the rainy season (monsoon) and winter (cold). Each lasts for some months.'
      picture:
        kind: flow
        steps:
        - 'summer: hot'
        - 'rainy season: wet'
        - 'winter: cold'
        - summer again
        alt: The seasons come in a circle.
      check:
        prompt: In which season do we need a fan the most?
        options:
        - summer
        - winter
        - the rainy season
        answer: summer
        why: Summer is the hot season.
      ways:
      - style: step_by_step
        teach: 'Find the season. First: feel the air: is it hot, wet or cold? Second: look at what people wear. Third: look at the sky and the ground. Fourth: put the clues together to name the season.'
      - style: real_world
        teach: In winter, many families in North India sit in the sun on the roof to keep warm, eating peanuts.
    - teach: 'We dress for the weather: cotton clothes and a cap in summer, a raincoat and umbrella in the rains, a sweater and socks in winter.'
      picture:
        kind: compare
        columns:
        - title: Summer
          points:
          - cotton clothes
          - cap
          - water bottle
        - title: Rainy
          points:
          - raincoat
          - umbrella
          - gumboots
        - title: Winter
          points:
          - sweater
          - socks
          - blanket
        alt: What we wear in each season.
      check:
        prompt: What keeps your head safe from the hot sun?
        options:
        - a cap
        - a raincoat
        - a blanket
        answer: a cap
        why: A cap shades your head.
      ways:
      - style: visual
        teach: What to take with you for each kind of weather.
        picture:
          kind: compare
          columns:
          - title: Hot and sunny
            points:
            - water bottle
            - sunglasses
          - title: Rainy
            points:
            - raincoat
            - plastic cover for the bag
          - title: Cold
            points:
            - woollen cap
            - gloves
          alt: On a hot sunny day take a water bottle and sunglasses. On a rainy day take a raincoat and a plastic cover for your bag. On a cold day take a woollen cap and gloves.
      - style: real_world
        teach: Before going out, many people look at the sky or the weather on a phone to decide what to wear.
  items:
  - prompt: 'On a rainy day we carry:'
    options:
    - ☂️ an umbrella
    - 🕶️ sunglasses
    - 🪁 a kite
    answer: ☂️ an umbrella
    difficulty: 1
    hints:
    - Keeps us dry.
    - Opens up.
    solution: We carry an umbrella.
    mistakes:
      🕶️ sunglasses: ukgw_look
  - prompt: 'On a cold day we wear:'
    options:
    - 🧥 a sweater
    - 🩳 shorts
    - 👙 swimsuit
    answer: 🧥 a sweater
    difficulty: 1
    hints:
    - Warm clothes.
    - Winter.
    solution: We wear a sweater.
    mistakes: {"🩳 shorts": "kg_cold", "👙 swimsuit": "kg_cold"}
  - prompt: Kites fly best on a ___ day.
    options:
    - windy
    - still
    - dark
    answer: windy
    difficulty: 2
    hints:
    - Moving air.
    - Leaves shake.
    solution: Kites fly on windy days.
    mistakes: {"still": "kg_kite", "dark": "kg_kite"}
  - prompt: Which season is hot?
    options:
    - summer
    - winter
    - rainy
    answer: summer
    difficulty: 1
    hints:
    - Ice-cream time.
    - Strong sun.
    solution: Summer is hot.
    mistakes: {"winter": "kg_summer", "rainy": "kg_summer"}
  - prompt: 'After rain and sun together we may see a:'
    options:
    - 🌈 rainbow
    - ⭐ star
    - 🌙 moon
    answer: 🌈 rainbow
    difficulty: 2
    hints:
    - Seven colours.
    - An arch in the sky.
    solution: A rainbow.
    mistakes: {"⭐ star": "kg_rainbow", "🌙 moon": "kg_rainbow"}
  - prompt: 'On a hot day we should drink:'
    options:
    - lots of water
    - nothing
    - only sweets
    answer: lots of water
    difficulty: 2
    hints:
    - Stay cool.
    - Our body needs it.
    solution: Drink lots of water.
    mistakes: {"nothing": "kg_drink", "only sweets": "kg_drink"}
  - prompt: Leaves and kites are flying about. What weather is it?
    options:
    - windy
    - rainy
    - snowy
    answer: windy
    difficulty: 1
    hints:
    - Something is pushing things around.
    - You cannot see it, but you feel it.
    solution: 'Step 1: things fly in moving air. Step 2: windy.'
    mistakes:
      rainy: uk1w_sky
      snowy: uk1w_sky
  - prompt: What do we wear on our feet in winter to stay warm?
    options:
    - socks
    - sandals only
    - nothing
    answer: socks
    difficulty: 1
    hints:
    - Cold toes!
    - Something soft and woolly.
    solution: 'Step 1: feet get cold. Step 2: socks keep them warm.'
    mistakes:
      sandals only: uk1w_wear
      nothing: uk1w_wear
  - prompt: Which season comes with lots of rain?
    options:
    - monsoon
    - summer
    - winter
    answer: monsoon
    difficulty: 2
    hints:
    - Puddles, frogs, umbrellas.
    - It is also called the rainy season.
    solution: 'Step 1: rain for many weeks. Step 2: monsoon.'
    mistakes:
      summer: uk1w_season
      winter: uk1w_season
  - prompt: Which shoes are best for splashing in rain puddles?
    options:
    - gumboots
    - socks
    - slippers made of cloth
    answer: gumboots
    difficulty: 2
    hints:
    - They must keep water out.
    - Tall rubber shoes.
    solution: 'Step 1: water must stay out. Step 2: gumboots.'
    mistakes:
      socks: uk1w_wear
      slippers made of cloth: uk1w_wear
  - prompt: The sun is shining and there are no clouds. What weather is it?
    options:
    - sunny
    - cloudy
    - rainy
    answer: sunny
    difficulty: 1
    hints:
    - What is bright in the sky?
    - No clouds, no rain.
    solution: 'Step 1: bright sun, no clouds. Step 2: sunny.'
    mistakes:
      cloudy: uk1w_sky
      rainy: uk1w_sky
  - prompt: Which fruit do we eat a lot in summer?
    options:
    - 🥭 mango
    - 🎄 a Christmas tree
    - 🧣 a scarf
    answer: 🥭 mango
    difficulty: 2
    hints:
    - Only one of these is a fruit.
    - Yellow, sweet and juicy.
    solution: 'Step 1: only one is a fruit. Step 2: mango is the summer fruit.'
    mistakes:
      🎄 a Christmas tree: uk1w_season
      🧣 a scarf: uk1w_season
  - prompt: What should you do when there is thunder and lightning?
    options:
    - stay inside
    - stand under a tall tree
    - fly a kite
    answer: stay inside
    difficulty: 3
    hints:
    - Lightning can strike tall things.
    - Where is the safest place?
    solution: 'Step 1: lightning is dangerous outside. Step 2: stay inside.'
    mistakes:
      stand under a tall tree: uk1w_sky
      fly a kite: uk1w_sky
  - prompt: In which season do we see our breath like smoke in the morning?
    options:
    - winter
    - summer
    - monsoon
    answer: winter
    difficulty: 3
    hints:
    - It happens when the air is very cold.
    - Sweaters and blankets time.
    solution: 'Step 1: cold air shows our warm breath. Step 2: winter.'
    mistakes:
      summer: uk1w_season
      monsoon: uk1w_season
  - prompt: 'After the rain, the ground is:'
    options:
    - wet
    - dry
    - hot
    answer: wet
    difficulty: 1
    hints:
    - Water fell on it.
    - Puddles everywhere.
    solution: 'Step 1: rain is water. Step 2: the ground is wet.'
    mistakes:
      dry: uk1w_sky
      hot: uk1w_sky
  - prompt: 'Case: It is December morning in Delhi. Kabir''s breath looks like smoke and Kabir''s hands feel icy. What should Kabir wear to school?'
    options:
    - a sweater, cap and socks
    - a cotton vest and shorts
    - a raincoat only
    answer: a sweater, cap and socks
    hints:
    - Is the weather hot, rainy or cold?
    - What keeps your body warm?
    solution: It is cold, so a sweater, cap and socks keep Kabir warm.
    mistakes:
      a cotton vest and shorts: uk1w_wear
      a raincoat only: uk1w_wear
    exam: case
    difficulty: 2
  - prompt: 'Situation: For many weeks it rains almost every day, the rivers fill up and farmers plant rice. Which season is it?'
    options:
    - the rainy season (monsoon)
    - winter
    - summer
    answer: the rainy season (monsoon)
    hints:
    - Think of the whole season, not one day.
    - Which season brings rain for many weeks?
    solution: Weeks of rain, full rivers and rice planting happen in the rainy season, the monsoon.
    mistakes:
      winter: uk1w_season
      summer: uk1w_season
    exam: competency
    difficulty: 2
