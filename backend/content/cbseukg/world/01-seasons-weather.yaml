# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 1
title: Weather and Seasons
tips:
  ukgw_look: Look at the picture again. Say what you see.
  ukgw_think: Think about your street and your day. What do you see there?
concepts:
- code: ukgw.weather
  title: Weather and Seasons
  notes: |
    Sunny, rainy, windy and cold days; summer, rainy season and winter; what we wear and carry.
  explanations:
    text: Some days are sunny, some are rainy, some are windy and some are cold. We wear cotton in summer, carry an umbrella in the rain and wear a sweater in winter.
    visual: 'Draw three children: one with a cap in the sun, one with an umbrella in the rain, one in a sweater.'
    step_by_step: 'Step 1: Look outside. Step 2: Say the weather. Step 3: Choose what to wear.'
    real_world: In Kerala the rains start in June; in Delhi January is very cold.
  picture:
    kind: compare
    columns:
    - title: Weather
      points:
      - ☀️ sunny
      - 🌧️ rainy
      - ❄️ cold
    - title: We use
      points:
      - cap
      - umbrella
      - sweater
    alt: 'Sunny: a cap. Rainy: an umbrella. Cold: a sweater.'
  activity:
    type: sort
    prompt: What do we need?
    bins:
    - ☂️ Umbrella
    - 🧥 Sweater
    - 👕 Cotton clothes
    items:
    - label: 🌧️ It is raining
      bin: ☂️ Umbrella
      clue: What keeps you dry?
      why: An umbrella keeps the rain off.
    - label: ❄️ It is very cold
      bin: 🧥 Sweater
      clue: What keeps you warm?
      why: A sweater keeps us warm.
    - label: ☀️ It is very hot
      bin: 👕 Cotton clothes
      clue: What keeps you cool?
      why: Thin cotton clothes keep us cool.
    - label: ⛈️ Big rain and thunder
      bin: ☂️ Umbrella
      clue: Water is falling.
      why: Take an umbrella, and stay indoors in thunder.
    - label: 🌬️ Chilly winter morning
      bin: 🧥 Sweater
      clue: You are shivering.
      why: A sweater keeps us warm.
    - label: 🏖️ Sunny summer day
      bin: 👕 Cotton clothes
      clue: You are sweating.
      why: Cotton lets sweat dry and keeps us cool.
  items:
  - prompt: 'On a rainy day we carry:'
    options:
    - ☂️ an umbrella
    - 🕶️ sunglasses
    - 🪁 a kite
    answer: ☂️ an umbrella
    difficulty: 1
    hints:
    - Keeps us dry.
    - Opens up.
    solution: We carry an umbrella.
    mistakes:
      🕶️ sunglasses: ukgw_look
  - prompt: 'On a cold day we wear:'
    options:
    - 🧥 a sweater
    - 🩳 shorts
    - 👙 swimsuit
    answer: 🧥 a sweater
    difficulty: 1
    hints:
    - Warm clothes.
    - Winter.
    solution: We wear a sweater.
  - prompt: Kites fly best on a ___ day.
    options:
    - windy
    - still
    - dark
    answer: windy
    difficulty: 2
    hints:
    - Moving air.
    - Leaves shake.
    solution: Kites fly on windy days.
  - prompt: Which season is hot?
    options:
    - summer
    - winter
    - rainy
    answer: summer
    difficulty: 1
    hints:
    - Ice-cream time.
    - Strong sun.
    solution: Summer is hot.
  - prompt: 'After rain and sun together we may see a:'
    options:
    - 🌈 rainbow
    - ⭐ star
    - 🌙 moon
    answer: 🌈 rainbow
    difficulty: 2
    hints:
    - Seven colours.
    - An arch in the sky.
    solution: A rainbow.
  - prompt: 'On a hot day we should drink:'
    options:
    - lots of water
    - nothing
    - only sweets
    answer: lots of water
    difficulty: 2
    hints:
    - Stay cool.
    - Our body needs it.
    solution: Drink lots of water.
