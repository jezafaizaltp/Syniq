# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 3
title: People Who Help Us
tips:
  uk3w_call: "Emergency numbers are short so that everyone can remember them."
  kg_helper: "Think where each helper works: a field, a school, a police station. Who works in a field?"
  kg_helper2: "Who comes in a red truck with a big water hose?"
  kg_helper3: "Who carries a bag full of envelopes to every house?"
  kg_helper4: "Who stands at the board in your classroom?"
  uk3w_job: Think about the tools each helper uses. Which tool fits this job?
  uk3w_place: 'Picture where each helper works: a hospital, a school, a farm, a police station?'
  uk3w_kind: Think how the helper would feel. What would a kind child do?

concepts:
- code: ukgw.helpers
  title: People Who Help Us
  notes: |
    Community helpers: doctor, teacher, farmer, police officer, postman, firefighter; what they do.
  explanations:
    text: 'Many people help us: the doctor makes us well, the teacher helps us learn, the farmer grows food, the police keep us safe.'
    visual: Draw a doctor with a stethoscope, a farmer with a plough and a teacher with a book.
    step_by_step: 'Step 1: Look at what they wear or hold. Step 2: Say who they are. Step 3: Say how they help.'
    real_world: Say thank you to the people who help us.
  picture:
    kind: compare
    columns:
    - title: Helper
      points:
      - 👩‍⚕️ doctor
      - 👨‍🌾 farmer
      - 👩‍🏫 teacher
    - title: Helps by
      points:
      - making us well
      - growing food
      - teaching us
    alt: A doctor makes us well, a farmer grows food and a teacher teaches us.
  activity:
    type: sort
    prompt: Who helps?
    bins:
    - 🩺 Doctor
    - 👩‍🏫 Teacher
    - 🧑‍🌾 Farmer
    items:
    - label: I have a fever
      bin: 🩺 Doctor
      clue: Who makes you well?
      why: A doctor helps us get well.
    - label: I want to learn to read
      bin: 👩‍🏫 Teacher
      clue: Who helps you at school?
      why: A teacher helps us learn.
    - label: We need rice to eat
      bin: 🧑‍🌾 Farmer
      clue: Who grows food?
      why: A farmer grows rice.
    - label: I hurt my leg
      bin: 🩺 Doctor
      clue: Who checks and treats it?
      why: A doctor treats us.
    - label: I can't add numbers yet
      bin: 👩‍🏫 Teacher
      clue: Who explains at school?
      why: A teacher helps us learn.
    - label: We need vegetables
      bin: 🧑‍🌾 Farmer
      clue: Who grows them in a field?
      why: A farmer grows vegetables.
  lesson:
    - teach: Many people help us every day. A doctor and a nurse help us get well. A teacher helps us learn. A farmer grows our food.
      picture:
        kind: compare
        columns:
        - title: Helper
          points:
          - doctor
          - teacher
          - farmer
        - title: Works at
          points:
          - hospital
          - school
          - field
        alt: Helpers and where they work.
      check:
        prompt: Where does a farmer work?
        options:
        - in the field
        - in a hospital
        - in a bank
        answer: in the field
        why: Farmers grow crops in fields.
      ways:
      - style: step_by_step
        teach: 'Play a who-am-I game. First: a friend acts out a helper''s job, like giving an injection. Second: watch carefully. Third: think where that helper works. Fourth: guess the helper and say how they help us.'
      - style: real_world
        teach: 'On the way to school you may see many helpers: the bus driver, the traffic police, the shopkeeper and the sweeper.'
    - teach: 'More helpers: a police officer keeps us safe, a firefighter puts out fires, a postman brings letters, a cobbler mends shoes, a tailor stitches clothes.'
      check:
        prompt: Who mends torn shoes?
        options:
        - a cobbler
        - a pilot
        - a baker
        answer: a cobbler
        why: A cobbler repairs shoes and slippers.
      ways:
      - style: visual
        teach: More helpers and where they work, side by side.
        picture:
          kind: compare
          columns:
          - title: Helper
            points:
            - police officer
            - firefighter
            - postman
            - tailor
          - title: Works at
            points:
            - police station
            - fire station
            - post office
            - tailor's shop
          alt: A police officer works at a police station, a firefighter at a fire station, a postman at the post office and a tailor at a tailor's shop.
      - style: real_world
        teach: When there is a fire, the fire engine rushes with its siren on, and other cars move aside to let it pass.
    - teach: 'Helpers use tools: a doctor uses a stethoscope 🩺, a farmer uses a plough, a tailor uses a needle and thread 🧵, a firefighter uses a hose. We always say thank you to helpers.'
      check:
        prompt: Who uses a needle and thread to stitch clothes?
        options:
        - a tailor
        - a driver
        - a farmer
        answer: a tailor
        why: A tailor sews clothes with needle and thread.
      ways:
      - style: visual
        teach: Some more helpers, and the tools each one uses in their work.
        picture:
          kind: compare
          columns:
          - title: Helper
            points:
            - barber
            - painter
            - carpenter
          - title: Tool
            points:
            - scissors and comb
            - brush and paint
            - hammer and saw
          alt: A barber uses scissors and a comb, a painter uses a brush and paint, and a carpenter uses a hammer and saw.
      - style: step_by_step
        teach: 'Thank a helper. First: notice who helped you, like the bus driver. Second: look at them and smile. Third: say, ''Thank you!'' Fourth: wave goodbye as you leave.'
  items:
  - prompt: Who makes us well when we are sick?
    options:
    - 👩‍⚕️ doctor
    - 👨‍🌾 farmer
    - 🧑‍🍳 cook
    answer: 👩‍⚕️ doctor
    difficulty: 1
    hints:
    - Hospital.
    - Stethoscope.
    solution: A doctor.
    mistakes:
      👨‍🌾 farmer: ukgw_think
  - prompt: Who grows rice and vegetables?
    options:
    - 👨‍🌾 farmer
    - 👮 police officer
    - 👩‍🏫 teacher
    answer: 👨‍🌾 farmer
    difficulty: 1
    hints:
    - In fields.
    - Works with soil.
    solution: A farmer.
    mistakes: {"👮 police officer": "kg_helper", "👩‍🏫 teacher": "kg_helper"}
  - prompt: Who puts out fires?
    options:
    - 🧑‍🚒 firefighter
    - 📮 postman
    - 👩‍⚕️ doctor
    answer: 🧑‍🚒 firefighter
    difficulty: 1
    hints:
    - Red truck.
    - Water hose.
    solution: A firefighter.
    mistakes: {"📮 postman": "kg_helper2", "👩‍⚕️ doctor": "kg_helper2"}
  - prompt: Who brings letters?
    options:
    - 📮 postman
    - 🧑‍🍳 cook
    - 👨‍🌾 farmer
    answer: 📮 postman
    difficulty: 2
    hints:
    - Letters and parcels.
    - Post office.
    solution: A postman.
    mistakes: {"🧑‍🍳 cook": "kg_helper3", "👨‍🌾 farmer": "kg_helper3"}
  - prompt: Who helps us learn at school?
    options:
    - 👩‍🏫 teacher
    - 🧑‍🚒 firefighter
    - 👨‍🔧 mechanic
    answer: 👩‍🏫 teacher
    difficulty: 1
    hints:
    - Classroom.
    - Books.
    solution: A teacher.
    mistakes: {"🧑‍🚒 firefighter": "kg_helper4", "👨‍🔧 mechanic": "kg_helper4"}
  - prompt: What do we say to helpers?
    options:
    - thank you
    - go away
    - nothing
    answer: thank you
    difficulty: 2
    hints:
    - Be kind.
    - Polite words.
    solution: We say thank you.
    mistakes: {"go away": "e1_thank_you", "nothing": "e1_thank_you"}
  - prompt: Who bakes bread and cakes?
    options:
    - 🧑‍🍳 a baker
    - 🧑‍🚒 a firefighter
    - 👮 a police officer
    answer: 🧑‍🍳 a baker
    difficulty: 1
    hints:
    - Think of an oven.
    - Smell of fresh bread!
    solution: 'Step 1: bread is baked in an oven. Step 2: a baker does it.'
    mistakes:
      🧑‍🚒 a firefighter: uk3w_job
      👮 a police officer: uk3w_job
  - prompt: 'A doctor listens to your heart with a:'
    options:
    - 🩺 stethoscope
    - 🔨 hammer
    - 🧵 needle
    answer: 🩺 stethoscope
    difficulty: 2
    hints:
    - It goes in the doctor's ears.
    - It hangs around the neck.
    solution: 'Step 1: doctors listen to the heart. Step 2: with a stethoscope.'
    mistakes:
      🔨 hammer: uk3w_job
      🧵 needle: uk3w_job
  - prompt: Who flies an aeroplane?
    options:
    - a pilot
    - a farmer
    - a cobbler
    answer: a pilot
    difficulty: 1
    hints:
    - This helper sits in the front of the plane.
    - Up in the sky.
    solution: 'Step 1: someone must steer the plane. Step 2: a pilot.'
    mistakes:
      a farmer: uk3w_job
      a cobbler: uk3w_job
  - prompt: Where does a nurse work?
    options:
    - in a hospital
    - on a farm
    - in a shoe shop
    answer: in a hospital
    difficulty: 1
    hints:
    - Nurses look after sick people.
    - Doctors work there too.
    solution: 'Step 1: nurses care for patients. Step 2: hospital.'
    mistakes:
      on a farm: uk3w_place
      in a shoe shop: uk3w_place
  - prompt: The sweeper cleans our road. What should we do?
    options:
    - throw rubbish in the bin
    - throw wrappers on the road
    - laugh at the sweeper
    answer: throw rubbish in the bin
    difficulty: 2
    hints:
    - How can we make the job easier?
    - Help keep the road clean.
    solution: 'Step 1: a clean road needs our help. Step 2: use the bin.'
    mistakes:
      throw wrappers on the road: uk3w_kind
      laugh at the sweeper: uk3w_kind
  - prompt: Which number do we call for the police in India?
    options:
    - '112'
    - '5'
    - '1000'
    answer: '112'
    difficulty: 3
    hints:
    - It is the emergency number.
    - It starts with 1 and has three digits.
    solution: 'Step 1: emergency help. Step 2: dial 112.'
    mistakes:
      '5': uk3w_call
      '1000': uk3w_call
  - prompt: Who drives the school bus?
    options:
    - the driver
    - the tailor
    - the baker
    answer: the driver
    difficulty: 1
    hints:
    - Who holds the steering wheel?
    - This helper takes children safely to school.
    solution: 'Step 1: someone steers the bus. Step 2: the driver.'
    mistakes:
      the tailor: uk3w_job
      the baker: uk3w_job
  - prompt: Who sells fruits and vegetables from a cart?
    options:
    - a vendor
    - a pilot
    - a nurse
    answer: a vendor
    difficulty: 3
    hints:
    - This helper calls out in the street.
    - Buy tomatoes and bananas here.
    solution: 'Step 1: a cart full of fruits. Step 2: a vendor sells them.'
    mistakes:
      a pilot: uk3w_place
      a nurse: uk3w_place
  - prompt: A helper fixed your tap. What do you say?
    options:
    - thank you
    - go away
    - nothing
    answer: thank you
    difficulty: 2
    hints:
    - Someone did work for you.
    - Kind words.
    solution: 'Step 1: they helped us. Step 2: say thank you.'
    mistakes:
      go away: uk3w_kind
      nothing: uk3w_kind
  - prompt: 'Case: Meena''s shoe strap broke on the way to school. Which helper can mend it?'
    options:
    - a cobbler
    - a postman
    - a pilot
    answer: a cobbler
    hints:
    - Which helper works with shoes?
    - 'Think of the helper''s tools: needle, thread and leather.'
    solution: A cobbler mends shoes, so Meena should go to a cobbler.
    mistakes:
      a postman: uk3w_job
      a pilot: uk3w_job
    exam: case
    difficulty: 2
  - prompt: 'Situation: Grandpa feels sick and needs to see a nurse. Where should the family go?'
    options:
    - to a hospital
    - to a fire station
    - to a post office
    answer: to a hospital
    hints:
    - Picture where a nurse works.
    - Where do sick people go to get well?
    solution: Nurses work in a hospital, where sick people get care.
    mistakes:
      to a fire station: uk3w_place
      to a post office: uk3w_place
    exam: competency
    difficulty: 2
