# CBSE UKG My World (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-world
chapter: 3
title: People Who Help Us
concepts:
- code: ukgw.helpers
  title: People Who Help Us
  notes: |
    Community helpers: doctor, teacher, farmer, police officer, postman, firefighter; what they do.
  explanations:
    text: 'Many people help us: the doctor makes us well, the teacher helps us learn, the farmer grows food, the police keep us safe.'
    visual: Draw a doctor with a stethoscope, a farmer with a plough and a teacher with a book.
    step_by_step: 'Step 1: Look at what they wear or hold. Step 2: Say who they are. Step 3: Say how they help.'
    real_world: Say thank you to the people who help us.
  picture:
    kind: compare
    columns:
    - title: Helper
      points:
      - 👩‍⚕️ doctor
      - 👨‍🌾 farmer
      - 👩‍🏫 teacher
    - title: Helps by
      points:
      - making us well
      - growing food
      - teaching us
    alt: A doctor makes us well, a farmer grows food and a teacher teaches us.
  activity:
    type: sort
    prompt: Who helps?
    bins:
    - 🩺 Doctor
    - 👩‍🏫 Teacher
    - 🧑‍🌾 Farmer
    items:
    - label: I have a fever
      bin: 🩺 Doctor
      clue: Who makes you well?
      why: A doctor helps us get well.
    - label: I want to learn to read
      bin: 👩‍🏫 Teacher
      clue: Who helps you at school?
      why: A teacher helps us learn.
    - label: We need rice to eat
      bin: 🧑‍🌾 Farmer
      clue: Who grows food?
      why: A farmer grows rice.
    - label: I hurt my leg
      bin: 🩺 Doctor
      clue: Who checks and treats it?
      why: A doctor treats us.
    - label: I can't add numbers yet
      bin: 👩‍🏫 Teacher
      clue: Who explains at school?
      why: A teacher helps us learn.
    - label: We need vegetables
      bin: 🧑‍🌾 Farmer
      clue: Who grows them in a field?
      why: A farmer grows vegetables.
  items:
  - prompt: Who makes us well when we are sick?
    options:
    - 👩‍⚕️ doctor
    - 👨‍🌾 farmer
    - 🧑‍🍳 cook
    answer: 👩‍⚕️ doctor
    difficulty: 1
    hints:
    - Hospital.
    - Stethoscope.
    solution: A doctor.
    mistakes:
      👨‍🌾 farmer: ukgw_think
  - prompt: Who grows rice and vegetables?
    options:
    - 👨‍🌾 farmer
    - 👮 police officer
    - 👩‍🏫 teacher
    answer: 👨‍🌾 farmer
    difficulty: 1
    hints:
    - In fields.
    - Works with soil.
    solution: A farmer.
  - prompt: Who puts out fires?
    options:
    - 🧑‍🚒 firefighter
    - 📮 postman
    - 👩‍⚕️ doctor
    answer: 🧑‍🚒 firefighter
    difficulty: 1
    hints:
    - Red truck.
    - Water hose.
    solution: A firefighter.
  - prompt: Who brings letters?
    options:
    - 📮 postman
    - 🧑‍🍳 cook
    - 👨‍🌾 farmer
    answer: 📮 postman
    difficulty: 2
    hints:
    - Letters and parcels.
    - Post office.
    solution: A postman.
  - prompt: Who helps us learn at school?
    options:
    - 👩‍🏫 teacher
    - 🧑‍🚒 firefighter
    - 👨‍🔧 mechanic
    answer: 👩‍🏫 teacher
    difficulty: 1
    hints:
    - Classroom.
    - Books.
    solution: A teacher.
  - prompt: What do we say to helpers?
    options:
    - thank you
    - go away
    - nothing
    answer: thank you
    difficulty: 2
    hints:
    - Be kind.
    - Polite words.
    solution: We say thank you.
