# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 8
title: Time of Day and Days of the Week
tips:
  kg_week_next: "Say the days in order, starting from Sunday. Which day do you say next?"
  kg_day_order: "Say the parts of the day in order: morning, then lunch time... then evening, then night."
  kg_holiday: "On which day do many families stay home together and there is no school?"
  kg_wake: "When you open your eyes after sleep, is the sun just coming up?"
  uk8_day: Think through your own day from waking up to sleeping. When does this happen?
  uk8_week: "Say all seven days of the week in order, slowly, and listen for the one you need."
  uk8_count: Count on your fingers, one for each day.

concepts:
- code: ukgm.time
  title: Time of Day and Days of the Week
  notes: |
    Morning, afternoon, evening, night; seven days of the week; what we do at each time.
  explanations:
    text: A day has morning, afternoon, evening and night. A week has 7 days, from Sunday to Saturday.
    visual: 'Draw four boxes: sunrise, high sun, sunset and moon.'
    step_by_step: 'Step 1: Look at where the sun is. Step 2: Name the time. Step 3: Say what we do then.'
    real_world: We brush in the morning and sleep at night.
  picture:
    kind: flow
    steps:
    - morning
    - afternoon
    - evening
    - night
    alt: 'The parts of a day in order: morning, afternoon, evening, night.'
  activity:
    type: order
    prompt: Put the days of the week in order. Start with Sunday.
    steps:
    - Sunday
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    - Saturday
    reasons:
      Monday: Monday comes after Sunday. It is the first school day.
      Tuesday: Tuesday comes after Monday.
      Wednesday: Wednesday is in the middle of the week, after Tuesday.
      Thursday: Thursday comes after Wednesday.
      Friday: Friday comes after Thursday.
      Saturday: Saturday is the last day. Then Sunday comes again.
  lesson:
    - teach: 'A day has parts: morning (the sun comes up, we wake), afternoon (lunch time), evening (the sun goes down, we play), and night (dark, we sleep).'
      picture:
        kind: flow
        steps:
        - morning
        - afternoon
        - evening
        - night
        alt: The four parts of a day in order.
      check:
        prompt: When is it dark and the stars come out?
        options:
        - night
        - morning
        - afternoon
        answer: night
        why: At night the sun has gone and the sky is dark.
      ways:
      - style: step_by_step
        teach: 'Tell the part of the day. First: look outside. Second: if the sun is just coming up, it is morning. Third: if it is high and hot, it is afternoon. Fourth: if it is going down, it is evening, and when it is dark, it is night.'
      - style: real_world
        teach: Many families drink tea in the morning, eat lunch in the afternoon and go for a walk in the evening.
    - teach: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. Then Sunday comes again.'
      check:
        prompt: Which day comes after Tuesday?
        options:
        - Wednesday
        - Monday
        - Friday
        answer: Wednesday
        why: Sunday, Monday, Tuesday, then Wednesday.
      ways:
      - style: visual
        teach: The seven days of the week go round and round, one after another.
        picture:
          kind: flow
          steps:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          alt: 'The days of the week in order: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. Then Sunday comes again.'
      - style: step_by_step
        teach: 'Sing the days. First: clap once and say Sunday. Second: clap again and say Monday. Third: keep clapping and saying each day. Fourth: after seven claps, start again with Sunday.'
    - teach: Yesterday was the day before today. Tomorrow is the day after today. If today is Monday, tomorrow is Tuesday and yesterday was Sunday.
      check:
        prompt: Today is Thursday. What day is tomorrow?
        options:
        - Friday
        - Wednesday
        - Sunday
        answer: Friday
        why: 'Tomorrow is the next day: after Thursday comes Friday.'
      ways:
      - style: visual
        teach: Yesterday, today and tomorrow, side by side, if today is Thursday.
        picture:
          kind: compare
          columns:
          - title: Yesterday
            points:
            - Wednesday
          - title: Today
            points:
            - Thursday
          - title: Tomorrow
            points:
            - Friday
          alt: If today is Thursday, yesterday was Wednesday and tomorrow will be Friday.
      - style: real_world
        teach: When a holiday is coming, children ask, 'Is it tomorrow?' and count the days on the calendar.
  items:
  - prompt: 'We wake up in the:'
    options:
    - morning
    - night
    - evening
    answer: morning
    difficulty: 1
    hints:
    - The sun rises.
    - Start of the day.
    solution: We wake up in the morning.
    mistakes: {"night": "kg_wake", "evening": "kg_wake"}
  - prompt: 'We sleep at:'
    options:
    - night
    - morning
    - afternoon
    answer: night
    difficulty: 1
    hints:
    - Moon time.
    - Dark.
    solution: We sleep at night.
    mistakes: {"morning": "kg_sleep_time", "afternoon": "kg_sleep_time"}
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: 7 days.
    mistakes:
      '5': ukg_touch
      '6': ukg_touch
  - prompt: Which day comes after Sunday?
    options:
    - Monday
    - Saturday
    - Friday
    answer: Monday
    difficulty: 2
    hints:
    - School starts.
    - Sunday, ...
    solution: Monday comes after Sunday.
    mistakes: {"Saturday": "kg_week_next", "Friday": "kg_week_next"}
  - prompt: Which comes after morning?
    options:
    - afternoon
    - night
    - evening
    answer: afternoon
    difficulty: 2
    hints:
    - Lunch time.
    - Sun high up.
    solution: Afternoon comes after morning.
    mistakes: {"night": "kg_day_order", "evening": "kg_day_order"}
  - prompt: Which day is a holiday for many schools?
    options:
    - Sunday
    - Monday
    - Wednesday
    answer: Sunday
    difficulty: 1
    hints:
    - Family day.
    - S...
    solution: Sunday is a holiday for many schools.
    mistakes: {"Monday": "kg_holiday", "Wednesday": "kg_holiday"}
  - prompt: When do we eat lunch?
    options:
    - afternoon
    - night
    - early morning before waking
    answer: afternoon
    difficulty: 1
    hints:
    - It is the middle of the day.
    - After morning school.
    solution: 'Step 1: lunch is the middle meal. Step 2: afternoon.'
    mistakes:
      night: uk8_day
      early morning before waking: uk8_day
  - prompt: Which day comes after Friday?
    options:
    - Saturday
    - Thursday
    - Monday
    answer: Saturday
    difficulty: 1
    hints:
    - Say the days in order.
    - Friday, then the next.
    solution: 'Step 1: Thursday, Friday, next. Step 2: Saturday.'
    mistakes:
      Thursday: uk8_week
      Monday: uk8_week
  - prompt: Today is Monday. What day was yesterday?
    options:
    - Sunday
    - Tuesday
    - Saturday
    answer: Sunday
    difficulty: 2
    hints:
    - Yesterday is the day before.
    - Which day comes just before Monday?
    solution: 'Step 1: yesterday is one day back. Step 2: Sunday.'
    mistakes:
      Tuesday: uk8_week
      Saturday: uk8_week
  - prompt: Which comes just before evening?
    options:
    - afternoon
    - night
    - morning
    answer: afternoon
    difficulty: 2
    hints:
    - Say the parts of the day in order.
    - Morning, then ..., then evening.
    solution: 'Step 1: morning, afternoon, evening. Step 2: afternoon.'
    mistakes:
      night: uk8_day
      morning: uk8_day
  - prompt: When does the sun come up?
    options:
    - morning
    - evening
    - night
    answer: morning
    difficulty: 1
    hints:
    - It is when you wake up.
    - The start of the day.
    solution: 'Step 1: the day begins. Step 2: morning.'
    mistakes:
      evening: uk8_day
      night: uk8_day
  - prompt: School is Monday to Friday. How many school days is that?
    answer: '5'
    check: '5'
    difficulty: 3
    hints:
    - Say Monday, Tuesday ... up to Friday.
    - Put up one finger for each day.
    solution: 'Step 1: Mon, Tue, Wed, Thu, Fri. Step 2: 5 days.'
    mistakes:
      '4': uk8_count
      '7': uk8_count
  - prompt: Which day comes just before Sunday?
    options:
    - Saturday
    - Monday
    - Friday
    answer: Saturday
    difficulty: 2
    hints:
    - Sunday comes again after the last day.
    - Say the days to the end of the week.
    solution: 'Step 1: ... Friday, Saturday, Sunday. Step 2: Saturday.'
    mistakes:
      Monday: uk8_week
      Friday: uk8_week
  - prompt: 'Today is Wednesday. In 2 days it will be:'
    options:
    - Friday
    - Thursday
    - Monday
    answer: Friday
    difficulty: 3
    hints:
    - Count on 2 days from Wednesday.
    - One day, then one more.
    solution: 'Step 1: Thursday is 1 day. Step 2: Friday is 2 days.'
    mistakes:
      Thursday: uk8_count
      Monday: uk8_week
  - prompt: When do we see the moon?
    options:
    - night
    - afternoon
    - morning
    answer: night
    difficulty: 1
    hints:
    - It shines when the sky is dark.
    - Bed time.
    solution: 'Step 1: dark sky. Step 2: night.'
    mistakes:
      afternoon: uk8_day
      morning: uk8_day
  - prompt: 'Case: Riya''s dance class is every Tuesday. Today is Monday. When is the dance class?'
    options:
    - tomorrow
    - yesterday
    - today
    answer: tomorrow
    hints:
    - Which day comes after Monday?
    - Is that day before or after today?
    solution: Tuesday comes right after Monday, so the dance class is tomorrow.
    mistakes:
      yesterday: uk8_week
      today: uk8_week
    exam: case
    difficulty: 2
  - prompt: 'Situation: The sun is going down and the sky is orange. Children are coming back from the park. What part of the day is it?'
    options:
    - evening
    - morning
    - afternoon
    answer: evening
    hints:
    - When does the sun go down?
    - Think about your own day after playing outside.
    solution: When the sun goes down and the sky turns orange, it is evening.
    mistakes:
      morning: uk8_day
      afternoon: uk8_day
    exam: competency
    difficulty: 2
