# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 8
title: Time of Day and Days of the Week
concepts:
- code: ukgm.time
  title: Time of Day and Days of the Week
  notes: |
    Morning, afternoon, evening, night; seven days of the week; what we do at each time.
  explanations:
    text: A day has morning, afternoon, evening and night. A week has 7 days, from Sunday to Saturday.
    visual: 'Draw four boxes: sunrise, high sun, sunset and moon.'
    step_by_step: 'Step 1: Look at where the sun is. Step 2: Name the time. Step 3: Say what we do then.'
    real_world: We brush in the morning and sleep at night.
  picture:
    kind: flow
    steps:
    - morning
    - afternoon
    - evening
    - night
    alt: 'The parts of a day in order: morning, afternoon, evening, night.'
  items:
  - prompt: 'We wake up in the:'
    options:
    - morning
    - night
    - evening
    answer: morning
    difficulty: 1
    hints:
    - The sun rises.
    - Start of the day.
    solution: We wake up in the morning.
  - prompt: 'We sleep at:'
    options:
    - night
    - morning
    - afternoon
    answer: night
    difficulty: 1
    hints:
    - Moon time.
    - Dark.
    solution: We sleep at night.
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: 7 days.
    mistakes:
      '5': ukg_touch
      '6': ukg_touch
  - prompt: Which day comes after Sunday?
    options:
    - Monday
    - Saturday
    - Friday
    answer: Monday
    difficulty: 2
    hints:
    - School starts.
    - Sunday, ...
    solution: Monday comes after Sunday.
  - prompt: Which comes after morning?
    options:
    - afternoon
    - night
    - evening
    answer: afternoon
    difficulty: 2
    hints:
    - Lunch time.
    - Sun high up.
    solution: Afternoon comes after morning.
  - prompt: Which day is a holiday for many schools?
    options:
    - Sunday
    - Monday
    - Wednesday
    answer: Sunday
    difficulty: 1
    hints:
    - Family day.
    - S...
    solution: Sunday is a holiday for many schools.
