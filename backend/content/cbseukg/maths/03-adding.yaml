# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 3
title: 'Adding: Putting Together'
concepts:
- code: ukgm.add
  title: 'Adding: Putting Together'
  notes: |
    Adding small groups with pictures: 2 apples and 1 apple make 3; sums up to 10.
  explanations:
    text: Adding means putting together. 2 ducks and 1 more duck make 3 ducks.
    visual: Draw 2 ducks in a pond and 1 duck walking in, then all 3 together.
    step_by_step: 'Step 1: Count the first group. Step 2: Count on the second group. Step 3: Say how many in all.'
    real_world: 2 biscuits and 2 more biscuits make 4 biscuits.
  picture:
    kind: number_line
    from: 0
    to: 5
    step: 1
    points:
    - at: 2
      label: '2'
    - at: 3
      label: '3'
    alt: '2 + 1 on a number line: start at 2, hop 1 to 3.'
    jumps:
    - from: 2
      to: 3
      label: '+1'
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Put them together. Count on from the first number.
    goals:
    - prompt: 🦆🦆 and 🦆 more
      target: 3
      mistakes:
      - when:
          v: 2
        say: Don't forget the duck that came. 2, then 3.
      - when:
          v: 1
        say: That's only the duck that came. Add the 2 already there.
    - prompt: 🍎🍎🍎 and 🍎🍎 more
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'Count on 2 from 3: 4, 5. Two jumps, not one.'
      - when:
          v: 6
        say: 'Start counting on after 3, not from 3: 4, 5.'
    - prompt: 🐠🐠🐠🐠 and 🐠🐠🐠🐠 more
      target: 8
      mistakes:
      - when:
          v: 4
        say: 'That''s one group. Put both groups together: 4 and 4.'
      - when:
          v: 7
        say: 'Count on 4 from 4: 5, 6, 7, 8.'
  items:
  - prompt: 🦆🦆 + 🦆 = ?
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - Count all the ducks.
    - 2, then 3.
    solution: 2 + 1 = 3.
    mistakes:
      '2': ukg_count_on
      '4': ukg_touch
  - prompt: 🍪🍪 + 🍪🍪 = ?
    answer: '4'
    check: 2 + 2
    difficulty: 1
    hints:
    - Count all.
    - 2 and 2.
    solution: 2 + 2 = 4.
    mistakes:
      '3': ukg_touch
      '22': ukg_count_on
  - prompt: 3 + 2 = ?
    answer: '5'
    check: 3 + 2
    difficulty: 1
    hints:
    - Start at 3.
    - 4, 5.
    solution: 3 + 2 = 5.
    mistakes:
      '4': ukg_count_on
      '6': ukg_touch
  - prompt: 4 + 1 = ?
    answer: '5'
    check: 4 + 1
    difficulty: 1
    hints:
    - One more than 4.
    - Count on.
    solution: 4 + 1 = 5.
    mistakes:
      '41': ukg_count_on
  - prompt: 5 + 3 = ?
    answer: '8'
    check: 5 + 3
    difficulty: 2
    hints:
    - Start at 5.
    - 6, 7, 8.
    solution: 5 + 3 = 8.
    mistakes:
      '7': ukg_count_on
      '9': ukg_touch
  - prompt: 6 + 4 = ?
    answer: '10'
    check: 6 + 4
    difficulty: 2
    hints:
    - Start at 6.
    - 7, 8, 9, 10.
    solution: 6 + 4 = 10.
    mistakes:
      '9': ukg_count_on
      '11': ukg_touch
