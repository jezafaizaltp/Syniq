# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 3
title: 'Adding: Putting Together'
tips:
  uk3_all: Put both groups together and count every one, from the first to the last.
  uk3_on: Keep the first number in your head, then count on one finger for each one added.
  uk3_more: Adding makes the group bigger. Should the answer be more or less than the first number?
concepts:
- code: ukgm.add
  title: 'Adding: Putting Together'
  notes: |
    Adding small groups with pictures: 2 apples and 1 apple make 3; sums up to 10.
  explanations:
    text: Adding means putting together. 2 ducks and 1 more duck make 3 ducks.
    visual: Draw 2 ducks in a pond and 1 duck walking in, then all 3 together.
    step_by_step: 'Step 1: Count the first group. Step 2: Count on the second group. Step 3: Say how many in all.'
    real_world: 2 biscuits and 2 more biscuits make 4 biscuits.
  picture:
    kind: number_line
    from: 0
    to: 5
    step: 1
    points:
    - at: 2
      label: '2'
    - at: 3
      label: '3'
    alt: '2 + 1 on a number line: start at 2, hop 1 to 3.'
    jumps:
    - from: 2
      to: 3
      label: '+1'
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Put them together. Count on from the first number.
    goals:
    - prompt: 🦆🦆 and 🦆 more
      target: 3
      mistakes:
      - when:
          v: 2
        say: Don't forget the duck that came. 2, then 3.
      - when:
          v: 1
        say: That's only the duck that came. Add the 2 already there.
    - prompt: 🍎🍎🍎 and 🍎🍎 more
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'Count on 2 from 3: 4, 5. Two jumps, not one.'
      - when:
          v: 6
        say: 'Start counting on after 3, not from 3: 4, 5.'
    - prompt: 🐠🐠🐠🐠 and 🐠🐠🐠🐠 more
      target: 8
      mistakes:
      - when:
          v: 4
        say: 'That''s one group. Put both groups together: 4 and 4.'
      - when:
          v: 7
        say: 'Count on 4 from 4: 5, 6, 7, 8.'
  lesson:
    - teach: Adding means putting groups together. 2 balls and 1 ball together make 3 balls. The sign + means 'and more'.
      check:
        prompt: ⚽⚽ and ⚽ together. How many balls?
        options:
        - '3'
        - '2'
        - '1'
        answer: '3'
        why: 'Count them all: 1, 2, 3.'
      ways:
      - style: visual
        teach: Two groups put together make one bigger group.
        picture:
          kind: compare
          columns:
          - title: First group
            points:
            - 🐞
            - 🐞
            - 🐞
          - title: Second group
            points:
            - 🐞
            - 🐞
            - 🐞
            - 🐞
          - title: Together
            points:
            - 7 ladybirds
          alt: 3 ladybirds and 4 ladybirds put together make 7 ladybirds.
      - style: step_by_step
        teach: 'Add with blocks. First: make a tower of 1 block. Second: make another tower of 2 blocks. Third: put the two towers together into one. Fourth: count all the blocks in the big tower: there are 3.'
    - teach: 'A quick way: keep the first number in your head and count on. For 4 + 2, say ''four'', then 5, 6. The answer is 6.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 4
          label: '4'
        - at: 6
          label: '6'
        jumps:
        - from: 4
          to: 5
          label: '+1'
        - from: 5
          to: 6
          label: '+1'
        alt: '4 + 2: start at 4, hop 1 to 5, hop 1 to 6.'
      check:
        prompt: Start at 5 and count on 2. Where do you land?
        options:
        - '7'
        - '6'
        - '52'
        answer: '7'
        why: Five, then 6, 7.
      ways:
      - style: step_by_step
        teach: 'Count on to add 6 + 3. First: say six and keep it in your head. Second: hold up three fingers. Third: count on, touching each finger: seven, eight, nine. Fourth: the last number, nine, is the answer.'
      - style: real_world
        teach: At a birthday party, when more friends arrive, you count on from the children already there.
    - teach: 'Adding 0 changes nothing: 3 + 0 = 3. And order does not matter: 2 + 3 and 3 + 2 both make 5.'
      check:
        prompt: 6 + 0 = ?
        options:
        - '6'
        - '0'
        - '7'
        answer: '6'
        why: Adding nothing keeps the same number.
      ways:
      - style: visual
        teach: 'Turn it around: the order of adding does not change the answer.'
        picture:
          kind: compare
          columns:
          - title: 1 + 6
            points:
            - '7'
          - title: 6 + 1
            points:
            - '7'
          alt: 1 + 6 makes 7 and 6 + 1 also makes 7. The order does not matter.
      - style: step_by_step
        teach: 'Add zero. First: put 6 shells in a bowl. Second: add 0 more, nothing at all. Third: count the shells again. Fourth: there are still 6, because adding zero changes nothing.'
  items:
  - prompt: 🦆🦆 + 🦆 = ?
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - Count all the ducks.
    - 2, then 3.
    solution: 2 + 1 = 3.
    mistakes:
      '2': ukg_count_on
      '4': ukg_touch
  - prompt: 🍪🍪 + 🍪🍪 = ?
    answer: '4'
    check: 2 + 2
    difficulty: 1
    hints:
    - Count all.
    - 2 and 2.
    solution: 2 + 2 = 4.
    mistakes:
      '3': ukg_touch
      '22': ukg_count_on
  - prompt: 3 + 2 = ?
    answer: '5'
    check: 3 + 2
    difficulty: 1
    hints:
    - Start at 3.
    - 4, 5.
    solution: 3 + 2 = 5.
    mistakes:
      '4': ukg_count_on
      '6': ukg_touch
  - prompt: 4 + 1 = ?
    answer: '5'
    check: 4 + 1
    difficulty: 1
    hints:
    - One more than 4.
    - Count on.
    solution: 4 + 1 = 5.
    mistakes:
      '41': ukg_count_on
  - prompt: 5 + 3 = ?
    answer: '8'
    check: 5 + 3
    difficulty: 2
    hints:
    - Start at 5.
    - 6, 7, 8.
    solution: 5 + 3 = 8.
    mistakes:
      '7': ukg_count_on
      '9': ukg_touch
  - prompt: 6 + 4 = ?
    answer: '10'
    check: 6 + 4
    difficulty: 2
    hints:
    - Start at 6.
    - 7, 8, 9, 10.
    solution: 6 + 4 = 10.
    mistakes:
      '9': ukg_count_on
      '11': ukg_touch
  - prompt: 🐟🐟🐟 + 🐟🐟 = ?
    answer: '5'
    check: 3+2
    difficulty: 1
    hints:
    - Count all the fish.
    - 3, then 4, 5.
    solution: 'Step 1: 3 fish. Step 2: count on 2: 4, 5.'
    mistakes:
      '4': uk3_all
      '6': uk3_all
  - prompt: 2 + 2 = ?
    answer: '4'
    check: 2+2
    difficulty: 1
    hints:
    - Show 2 fingers on each hand.
    - Count all the fingers you show.
    solution: 'Step 1: 2 and 2. Step 2: 1, 2, 3, 4.'
    mistakes:
      '22': uk3_on
      '3': uk3_all
  - prompt: 7 + 1 = ?
    answer: '8'
    check: 7+1
    difficulty: 1
    hints:
    - Adding 1 is just the next number.
    - Say 7, then one more.
    solution: 'Step 1: start at 7. Step 2: one more is 8.'
    mistakes:
      '6': uk3_more
      '71': uk3_on
  - prompt: 4 + 0 = ?
    answer: '4'
    check: 4+0
    difficulty: 2
    hints:
    - Adding zero means adding nothing.
    - Does the group change?
    solution: 'Step 1: 4 and nothing more. Step 2: still 4.'
    mistakes:
      '0': uk3_more
      '40': uk3_on
  - prompt: Meena has 3 🎈. Papa gives 3 more. How many balloons now?
    answer: '6'
    check: 3+3
    difficulty: 2
    hints:
    - Start with Meena's 3.
    - Count on 3 more.
    solution: 'Step 1: 3. Step 2: 4, 5, 6.'
    mistakes:
      '5': uk3_on
      '3': uk3_more
  - prompt: 5 + 4 = ?
    answer: '9'
    check: 5+4
    difficulty: 2
    hints:
    - Keep 5 in your head.
    - Count on four fingers.
    solution: 'Step 1: 5. Step 2: 6, 7, 8, 9.'
    mistakes:
      '8': uk3_on
      '1': uk3_more
  - prompt: 2 + 7 = ?
    answer: '9'
    check: 2+7
    difficulty: 3
    hints:
    - Start from the bigger number.
    - Seven, then count on 2.
    solution: 'Step 1: 7 + 2 is the same. Step 2: 8, 9.'
    mistakes:
      '8': uk3_on
      '5': uk3_more
  - prompt: There are 6 🐣 in a nest. 2 more hatch. How many chicks?
    answer: '8'
    check: 6+2
    difficulty: 2
    hints:
    - Hatch means new ones come.
    - Count on from 6.
    solution: 'Step 1: 6. Step 2: 7, 8.'
    mistakes:
      '4': uk3_more
      '7': uk3_on
  - prompt: Which pair makes 10?
    options:
    - 5 + 5
    - 4 + 4
    - 6 + 2
    answer: 5 + 5
    difficulty: 3
    hints:
    - Show both hands. How many fingers on each?
    - Work out each pair.
    solution: 'Step 1: 4 + 4 = 8, 6 + 2 = 8. Step 2: 5 + 5 = 10.'
    mistakes:
      4 + 4: uk3_all
      6 + 2: uk3_all
  - prompt: 'Case: Kabir has 3 toy cars. On Kabir''s birthday, 4 more arrive as gifts. How many toy cars does Kabir have now?'
    options:
    - '7'
    - '6'
    - '1'
    answer: '7'
    hints:
    - Start at 3 and count on.
    - 'Count on four more: 4, 5, 6, ...'
    solution: '3 and 4 more: count on 4, 5, 6, 7. Kabir has 7 cars.'
    mistakes:
      '6': uk3_on
      '1': uk3_more
    exam: case
    difficulty: 2
  - prompt: 'Situation: On a bus, 5 children sit at the front and 2 sit at the back. How many children are on the bus?'
    options:
    - '7'
    - '3'
    - '52'
    answer: '7'
    hints:
    - Put both groups together.
    - Start at 5 and count on 2.
    solution: '5 and 2 more: six, seven. There are 7 children.'
    mistakes:
      '3': uk3_more
      '52': uk3_all
    exam: competency
    difficulty: 2
