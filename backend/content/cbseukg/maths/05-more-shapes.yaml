# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 5
title: Shapes Around Us
concepts:
- code: ukgm.shapes
  title: Shapes Around Us
  notes: |
    Circle, square, triangle, rectangle, oval and star in everyday things; counting sides and corners.
  explanations:
    text: 'A rectangle is like a door: 4 sides, two long and two short. An oval is like an egg. A star has 5 points.'
    visual: Draw a door (rectangle), an egg (oval) and a star.
    step_by_step: 'Step 1: Count the sides and corners. Step 2: Are the sides the same or different? Step 3: Name the shape.'
    real_world: A book is a rectangle; a mirror can be an oval.
  picture:
    kind: bars
    bars:
    - label: triangle
      value: 3
    - label: square
      value: 4
    - label: rectangle
      value: 4
    - label: star
      value: 5
    alt: 'Points or corners: triangle 3, square 4, rectangle 4, star 5.'
    unit: corners
  activity:
    type: sort
    prompt: Which shape is it like?
    bins:
    - Rectangle
    - Oval
    - Star
    items:
    - label: 🚪 Door
      bin: Rectangle
      clue: '4 sides: two long and two short.'
      why: A door is a rectangle.
    - label: 🥚 Egg
      bin: Oval
      clue: Round but longer one way.
      why: An egg is an oval.
    - label: ⭐ Shape on a Christmas tree
      bin: Star
      clue: 'Count the points: 5.'
      why: '5 points: a star.'
    - label: 📱 Phone
      bin: Rectangle
      clue: Two long sides and two short sides.
      why: A phone is a rectangle.
    - label: 🏉 Rugby ball, seen from the side
      bin: Oval
      clue: Stretched round, no corners.
      why: An oval.
    - label: 🌟 Shining shape in the sky picture
      bin: Star
      clue: Pointy all around.
      why: A star has points.
  items:
  - prompt: 'A door is a:'
    options:
    - rectangle
    - circle
    - triangle
    answer: rectangle
    difficulty: 1
    hints:
    - Two long sides, two short.
    - 4 corners.
    solution: A door is a rectangle.
  - prompt: 'An egg is shaped like an:'
    options:
    - oval
    - square
    - triangle
    answer: oval
    difficulty: 1
    hints:
    - Round but longer.
    - Like a stretched circle.
    solution: An egg is an oval.
  - prompt: How many points does a star ⭐ have?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count the tips.
    - Like a hand.
    solution: A star has 5 points.
    mistakes:
      '4': ukg_touch
      '6': ukg_touch
  - prompt: How many sides does a rectangle have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Two long, two short.
    - Count them.
    solution: A rectangle has 4 sides.
    mistakes:
      '2': ukg_touch
  - prompt: Which shape has 3 sides?
    options:
    - triangle
    - square
    - oval
    answer: triangle
    difficulty: 2
    hints:
    - Tri means three.
    - Samosa.
    solution: A triangle has 3 sides.
  - prompt: 'A clock is often a:'
    options:
    - circle
    - triangle
    - star
    answer: circle
    difficulty: 1
    hints:
    - Round face.
    - Hands go round.
    solution: A clock is often a circle.
