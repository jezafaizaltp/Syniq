# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 5
title: Shapes Around Us
tips:
  kg_shape_look: "Trace the object in the air with your finger. Is it round, pointy, or a long box?"
  kg_sides: "Draw each shape in the air and count the straight sides."
  uk5_trace: Trace the shape in the air with your finger. Is it curved all round, or does it have straight sides?
  uk5_sides: Run your finger along each straight side and count as you go.
  uk5_corner: Touch each pointy corner once and count.

concepts:
- code: ukgm.shapes
  title: Shapes Around Us
  notes: |
    Circle, square, triangle, rectangle, oval and star in everyday things; counting sides and corners.
  explanations:
    text: 'A rectangle is like a door: 4 sides, two long and two short. An oval is like an egg. A star has 5 points.'
    visual: Draw a door (rectangle), an egg (oval) and a star.
    step_by_step: 'Step 1: Count the sides and corners. Step 2: Are the sides the same or different? Step 3: Name the shape.'
    real_world: A book is a rectangle; a mirror can be an oval.
  picture:
    kind: bars
    bars:
    - label: triangle
      value: 3
    - label: square
      value: 4
    - label: rectangle
      value: 4
    - label: star
      value: 5
    alt: 'Points or corners: triangle 3, square 4, rectangle 4, star 5.'
    unit: corners
  activity:
    type: sort
    prompt: Which shape is it like?
    bins:
    - Rectangle
    - Oval
    - Star
    items:
    - label: 🚪 Door
      bin: Rectangle
      clue: '4 sides: two long and two short.'
      why: A door is a rectangle.
    - label: 🥚 Egg
      bin: Oval
      clue: Round but longer one way.
      why: An egg is an oval.
    - label: ⭐ Shape on a Christmas tree
      bin: Star
      clue: 'Count the points: 5.'
      why: '5 points: a star.'
    - label: 📱 Phone
      bin: Rectangle
      clue: Two long sides and two short sides.
      why: A phone is a rectangle.
    - label: 🏉 Rugby ball, seen from the side
      bin: Oval
      clue: Stretched round, no corners.
      why: An oval.
    - label: 🌟 Shining shape in the sky picture
      bin: Star
      clue: Pointy all around.
      why: A star has points.
  lesson:
    - teach: Some shapes are curved all round. A circle is round like a bangle. An oval is a stretched circle, like an egg.
      picture:
        kind: compare
        columns:
        - title: Circle
          points:
          - bangle
          - coin
          - wheel
        - title: Oval
          points:
          - egg
          - face
          - a leaf shape
        alt: Round circle things and egg-shaped oval things.
      check:
        prompt: A 🍪 biscuit is usually which shape?
        options:
        - circle
        - triangle
        - rectangle
        answer: circle
        why: It is round all the way, with no corners.
    - teach: Some shapes have straight sides. A triangle has 3 sides and 3 corners. A square has 4 equal sides. A rectangle has 4 sides, 2 long and 2 short.
      picture:
        kind: compare
        columns:
        - title: 3 sides
          points:
          - triangle
          - a samosa
        - title: 4 sides
          points:
          - square
          - rectangle
          - a book
        alt: Shapes with 3 sides and with 4 sides.
      check:
        prompt: How many corners does a triangle have?
        options:
        - '3'
        - '4'
        - '0'
        answer: '3'
        why: 'Tri means three: 3 sides and 3 corners.'
    - teach: 'A star ⭐ has 5 points. A heart ❤️ has curves and one point at the bottom. We see shapes everywhere: a door, a clock, a roti.'
      check:
        prompt: A roti is which shape?
        options:
        - circle
        - square
        - star
        answer: circle
        why: A roti is rolled round.
  items:
  - prompt: 'A door is a:'
    options:
    - rectangle
    - circle
    - triangle
    answer: rectangle
    difficulty: 1
    hints:
    - Two long sides, two short.
    - 4 corners.
    solution: A door is a rectangle.
    mistakes: {"circle": "kg_shape_look", "triangle": "kg_shape_look"}
  - prompt: 'An egg is shaped like an:'
    options:
    - oval
    - square
    - triangle
    answer: oval
    difficulty: 1
    hints:
    - Round but longer.
    - Like a stretched circle.
    solution: An egg is an oval.
    mistakes: {"square": "kg_shape_look", "triangle": "kg_shape_look"}
  - prompt: How many points does a star ⭐ have?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count the tips.
    - Like a hand.
    solution: A star has 5 points.
    mistakes:
      '4': ukg_touch
      '6': ukg_touch
  - prompt: How many sides does a rectangle have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Two long, two short.
    - Count them.
    solution: A rectangle has 4 sides.
    mistakes:
      '2': ukg_touch
  - prompt: Which shape has 3 sides?
    options:
    - triangle
    - square
    - oval
    answer: triangle
    difficulty: 2
    hints:
    - Tri means three.
    - Samosa.
    solution: A triangle has 3 sides.
    mistakes: {"square": "kg_sides", "oval": "kg_sides"}
  - prompt: 'A clock is often a:'
    options:
    - circle
    - triangle
    - star
    answer: circle
    difficulty: 1
    hints:
    - Round face.
    - Hands go round.
    solution: A clock is often a circle.
    mistakes: {"triangle": "kg_shape_look", "star": "kg_shape_look"}
  - prompt: A slice of 🍕 pizza looks most like which shape?
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 2
    hints:
    - Count its pointy corners.
    - It is pointy at one end and wide at the other.
    solution: 'Step 1: 3 sides, 3 corners. Step 2: triangle.'
    mistakes:
      circle: uk5_trace
      square: uk5_sides
  - prompt: How many corners does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Touch each corner of a square tile.
    - One for each side.
    solution: 'Step 1: a square has 4 sides. Step 2: 4 corners.'
    mistakes:
      '3': uk5_corner
      '5': uk5_corner
  - prompt: Which shape has no corners at all?
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - Which one is curved all the way round?
    - 'Run a finger around it: does it bump at a point?'
    solution: 'Step 1: square and triangle have corners. Step 2: circle has none.'
    mistakes:
      square: uk5_trace
      triangle: uk5_trace
  - prompt: A 📏 ruler is which shape?
    options:
    - rectangle
    - circle
    - oval
    answer: rectangle
    difficulty: 2
    hints:
    - Is it curved or straight?
    - Two long sides and two short sides.
    solution: 'Step 1: straight sides, 4 of them. Step 2: long and short, so rectangle.'
    mistakes:
      circle: uk5_trace
      oval: uk5_trace
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Draw it in the air and count each straight line.
    - Same as its corners.
    solution: 'Step 1: one, two, three sides. Step 2: 3.'
    mistakes:
      '4': uk5_sides
      '2': uk5_sides
  - prompt: Two ⭐ stars. How many points in all?
    answer: '10'
    check: 5+5
    difficulty: 3
    hints:
    - Count the points on one star first.
    - Add the second star's points.
    solution: 'Step 1: 5 points each. Step 2: 5 + 5 = 10.'
    mistakes:
      '5': uk5_corner
      '8': uk5_corner
  - prompt: A face looks most like which shape?
    options:
    - oval
    - square
    - triangle
    answer: oval
    difficulty: 2
    hints:
    - Is it pointy or curved?
    - A circle stretched a little longer.
    solution: 'Step 1: curved all round. Step 2: longer than wide, so oval.'
    mistakes:
      square: uk5_trace
      triangle: uk5_trace
  - prompt: A square and a triangle. How many corners in all?
    answer: '7'
    check: 4+3
    difficulty: 3
    hints:
    - Count the square's corners first.
    - Then count on the triangle's.
    solution: 'Step 1: 4 + 3. Step 2: 7 corners.'
    mistakes:
      '6': uk5_corner
      '8': uk5_corner
  - prompt: Which thing is shaped like a square?
    options:
    - a carrom board
    - a ball
    - an egg
    answer: a carrom board
    difficulty: 2
    hints:
    - Look for 4 equal straight sides.
    - A ball and an egg are curved.
    solution: 'Step 1: ball and egg are round. Step 2: a carrom board has 4 equal sides.'
    mistakes:
      a ball: uk5_trace
      an egg: uk5_trace
