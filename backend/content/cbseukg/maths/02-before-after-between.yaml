# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 2
title: Before, After, Between
concepts:
- code: ukgm.order
  title: Before, After, Between
  notes: |
    Number order up to 20: the number before, after and between; counting backwards from 10.
  explanations:
    text: Numbers stand in a line. The number before is one less; the number after is one more; between sits in the middle.
    visual: Draw 3 houses numbered 6, 7, 8. 7 is between 6 and 8.
    step_by_step: 'Step 1: Say the numbers in order. Step 2: One back is before, one forward is after.'
    real_world: House numbers on a street go in order.
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 6
      label: before
    - at: 7
      label: '7'
    - at: 8
      label: after
    alt: 'Around 7: 6 comes before and 8 comes after.'
  items:
  - prompt: What is between 6 and 8?
    answer: '7'
    check: 6 + 1
    difficulty: 1
    hints:
    - 6, ?, 8.
    - One more than 6.
    solution: 7 is between 6 and 8.
    mistakes:
      '9': ukg_touch
  - prompt: What comes before 5?
    answer: '4'
    check: 5 - 1
    difficulty: 1
    hints:
    - Count back one.
    - '..., 5.'
    solution: 4 comes before 5.
    mistakes:
      '6': ukg_touch
  - prompt: 'Count back: 10, 9, 8, ?'
    answer: '7'
    check: 8 - 1
    difficulty: 1
    hints:
    - One less each time.
    - 8 − 1.
    solution: '7.'
    mistakes:
      '9': ukg_touch
  - prompt: What is between 13 and 15?
    answer: '14'
    check: 13 + 1
    difficulty: 2
    hints:
    - 13, ?, 15.
    - One more than 13.
    solution: '14.'
    mistakes:
      '16': ukg_touch
  - prompt: What comes after 18?
    answer: '19'
    check: 18 + 1
    difficulty: 2
    hints:
    - Count on one.
    - 17, 18, ...
    solution: '19.'
    mistakes:
      '17': ukg_touch
  - prompt: 'Count back: 5, 4, 3, 2, ?'
    answer: '1'
    check: 2 - 1
    difficulty: 2
    hints:
    - One less.
    - Last before zero.
    solution: '1.'
    mistakes:
      '3': ukg_touch
