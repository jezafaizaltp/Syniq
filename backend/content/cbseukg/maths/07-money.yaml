# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 7
title: Coins and Notes
tips:
  kg_coin_most: "Read the number on each coin. The biggest number buys the most."
  kg_money_use: "At a shop we give money to the shopkeeper. What do we get back?"
  uk7_add: Read the number on each coin, then count on to add them.
  uk7_each: Count one coin for each thing you buy.
  uk7_read: Look at the big number printed on each coin or note.

concepts:
- code: ukgm.money
  title: Coins and Notes
  notes: |
    Recognising 1, 2, 5 and 10 rupee coins; adding two small coins; buying a toffee.
  explanations:
    text: We buy things with rupees. There are 1, 2, 5 and 10 rupee coins. Two 1-rupee coins make 2 rupees.
    visual: Draw a 1-rupee coin, a 2-rupee coin and a 5-rupee coin, and a toffee.
    step_by_step: 'Step 1: Read the number on each coin. Step 2: Add them. Step 3: Say the total.'
    real_world: A toffee may cost 1 rupee at a small shop.
  picture:
    kind: bars
    bars:
    - label: ₹1
      value: 1
    - label: ₹2
      value: 2
    - label: ₹5
      value: 5
    - label: ₹10
      value: 10
    alt: Coins of 1, 2, 5 and 10 rupees.
    unit: rupees
  activity:
    type: sort
    prompt: How much money?
    bins:
    - 2 rupees
    - 5 rupees
    - 10 rupees
    items:
    - label: Two ₹1 coins
      bin: 2 rupees
      clue: 'Count each coin: 1, 2.'
      why: 1 + 1 = 2 rupees.
    - label: One ₹2 coin
      bin: 2 rupees
      clue: Look at the number on the coin, not how many coins.
      why: One ₹2 coin is 2 rupees.
    - label: One ₹5 coin
      bin: 5 rupees
      clue: Read the number on the coin.
      why: One coin, but it says 5.
    - label: Two ₹5 coins
      bin: 10 rupees
      clue: 5 and 5 more.
      why: 5 + 5 = 10 rupees.
    - label: One ₹2 coin and three ₹1 coins
      bin: 5 rupees
      clue: Start at 2, then count 3 more.
      why: 2, 3, 4, 5. That is 5 rupees.
    - label: One ₹10 coin
      bin: 10 rupees
      clue: One coin, but read its number.
      why: One ₹10 coin is 10 rupees.
  lesson:
    - teach: 'We use coins and notes to buy things. Each coin has a number on it: 1, 2, 5 or 10 rupees. The number tells how much it is worth, not its size.'
      picture:
        kind: bars
        unit: rupees
        bars:
        - label: 1-rupee coin
          value: 1
        - label: 2-rupee coin
          value: 2
        - label: 5-rupee coin
          value: 5
        - label: 10-rupee coin
          value: 10
        alt: Coins from 1 to 10 rupees, the bar grows with the worth.
      check:
        prompt: 'Which coin is worth more: a 2-rupee coin or a 5-rupee coin?'
        options:
        - 5-rupee coin
        - 2-rupee coin
        - both the same
        answer: 5-rupee coin
        why: 5 is more than 2.
    - teach: 'To add coins, read each number and count on. A 5-rupee coin and a 2-rupee coin: five, then 6, 7. That is 7 rupees.'
      check:
        prompt: A 5-rupee coin and a 1-rupee coin make how many rupees?
        options:
        - '6'
        - '5'
        - '51'
        answer: '6'
        why: Five, then one more is 6.
    - teach: At a shop we give money and get things. If a pencil costs 2 rupees and you buy 2 pencils, you pay 2 and 2, which is 4 rupees.
      check:
        prompt: An eraser costs 3 rupees. You buy 1. How much do you pay?
        options:
        - 3 rupees
        - 1 rupee
        - 4 rupees
        answer: 3 rupees
        why: One eraser costs 3 rupees.
  items:
  - prompt: Two 1-rupee coins make how many rupees?
    answer: '2'
    check: 1 + 1
    difficulty: 1
    hints:
    - 1 + 1.
    - Count the coins.
    solution: 2 rupees.
    mistakes:
      '11': ukg_count_on
  - prompt: 'A 2-rupee coin and a 1-rupee coin make:'
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - 2 + 1.
    - Count on.
    solution: 3 rupees.
    mistakes:
      '21': ukg_count_on
  - prompt: Which coin is worth the most?
    options:
    - 10 rupees
    - 5 rupees
    - 1 rupee
    answer: 10 rupees
    difficulty: 1
    hints:
    - Biggest number.
    - '10.'
    solution: 10 rupees is the most.
    mistakes: {"5 rupees": "kg_coin_most", "1 rupee": "kg_coin_most"}
  - prompt: 'Two 5-rupee coins make:'
    answer: '10'
    check: 5 + 5
    difficulty: 2
    hints:
    - 5 + 5.
    - Two hands of fingers.
    solution: 10 rupees.
    mistakes:
      '55': ukg_count_on
      '5': ukg_touch
  - prompt: 'A toffee costs 1 rupee. 3 toffees cost:'
    answer: '3'
    check: 3*1
    difficulty: 2
    hints:
    - 1 + 1 + 1.
    - 1 rupee each.
    solution: 3 rupees.
    mistakes:
      '1': ukg_touch
  - prompt: 'We use money to:'
    options:
    - buy things
    - eat it
    - plant it
    answer: buy things
    difficulty: 1
    hints:
    - At the shop.
    - Pay.
    solution: We use money to buy things.
    mistakes: {"eat it": "kg_money_use", "plant it": "kg_money_use"}
  - prompt: A 2-rupee coin and a 2-rupee coin make how many rupees?
    answer: '4'
    check: 2+2
    difficulty: 1
    hints:
    - Read the number on each coin.
    - Two and two more.
    solution: 'Step 1: 2 + 2. Step 2: 4 rupees.'
    mistakes:
      '22': uk7_add
      '2': uk7_add
  - prompt: Which is worth the least?
    options:
    - 1-rupee coin
    - 5-rupee coin
    - 10-rupee note
    answer: 1-rupee coin
    difficulty: 1
    hints:
    - Read the numbers.
    - Which number is the smallest?
    solution: 'Step 1: 1, 5, 10. Step 2: 1 is the least.'
    mistakes:
      5-rupee coin: uk7_read
      10-rupee note: uk7_read
  - prompt: A balloon costs 2 rupees. You buy 3. How many rupees?
    answer: '6'
    check: 2+2+2
    difficulty: 3
    hints:
    - Each balloon needs 2 rupees.
    - Count in twos three times.
    solution: 'Step 1: 2, 4, 6. Step 2: 6 rupees.'
    mistakes:
      '5': uk7_each
      '3': uk7_each
  - prompt: A 10-rupee note and a 5-rupee coin make how many rupees?
    answer: '15'
    check: 10+5
    difficulty: 3
    hints:
    - Start at ten.
    - Count on five.
    solution: 'Step 1: 10. Step 2: 11, 12, 13, 14, 15.'
    mistakes:
      '105': uk7_add
      '5': uk7_add
  - prompt: You have a 5-rupee coin. A toffee costs 1 rupee. How many toffees can you buy?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Each toffee needs 1 rupee.
    - How many ones are in 5?
    solution: 'Step 1: 1 rupee each. Step 2: 5 rupees buy 5 toffees.'
    mistakes:
      '1': uk7_each
      '4': uk7_each
  - prompt: Three 1-rupee coins make how many rupees?
    answer: '3'
    check: 1+1+1
    difficulty: 1
    hints:
    - Count the coins.
    - One, two, ...
    solution: 'Step 1: 1 + 1 + 1. Step 2: 3 rupees.'
    mistakes:
      '1': uk7_add
      '111': uk7_add
  - prompt: Where do we keep money safe at home?
    options:
    - in a piggy bank or purse
    - in the dustbin
    - on the road
    answer: in a piggy bank or purse
    difficulty: 1
    hints:
    - Where would it not get lost?
    - A special box or bag for money.
    solution: 'Step 1: money should not get lost. Step 2: piggy bank or purse.'
    mistakes:
      in the dustbin: uk7_read
      on the road: uk7_read
  - prompt: A pencil costs 5 rupees. You give a 10-rupee note. How much comes back?
    answer: '5'
    check: 10-5
    difficulty: 3
    hints:
    - You gave more than the price.
    - Count up from 5 to 10.
    solution: 'Step 1: 10 − 5. Step 2: 5 rupees back.'
    mistakes:
      '10': uk7_add
      '15': uk7_add
  - prompt: Which two coins make 7 rupees?
    options:
    - 5 and 2
    - 5 and 1
    - 2 and 1
    answer: 5 and 2
    difficulty: 2
    hints:
    - Add each pair.
    - Start with the bigger coin and count on.
    solution: 'Step 1: 5 + 1 = 6, 2 + 1 = 3. Step 2: 5 + 2 = 7.'
    mistakes:
      5 and 1: uk7_add
      2 and 1: uk7_add
