# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 7
title: Coins and Notes
concepts:
- code: ukgm.money
  title: Coins and Notes
  notes: |
    Recognising 1, 2, 5 and 10 rupee coins; adding two small coins; buying a toffee.
  explanations:
    text: We buy things with rupees. There are 1, 2, 5 and 10 rupee coins. Two 1-rupee coins make 2 rupees.
    visual: Draw a 1-rupee coin, a 2-rupee coin and a 5-rupee coin, and a toffee.
    step_by_step: 'Step 1: Read the number on each coin. Step 2: Add them. Step 3: Say the total.'
    real_world: A toffee may cost 1 rupee at a small shop.
  picture:
    kind: bars
    bars:
    - label: ₹1
      value: 1
    - label: ₹2
      value: 2
    - label: ₹5
      value: 5
    - label: ₹10
      value: 10
    alt: Coins of 1, 2, 5 and 10 rupees.
    unit: rupees
  activity:
    type: sort
    prompt: How much money?
    bins:
    - 2 rupees
    - 5 rupees
    - 10 rupees
    items:
    - label: Two ₹1 coins
      bin: 2 rupees
      clue: 'Count each coin: 1, 2.'
      why: 1 + 1 = 2 rupees.
    - label: One ₹2 coin
      bin: 2 rupees
      clue: Look at the number on the coin, not how many coins.
      why: One ₹2 coin is 2 rupees.
    - label: One ₹5 coin
      bin: 5 rupees
      clue: Read the number on the coin.
      why: One coin, but it says 5.
    - label: Two ₹5 coins
      bin: 10 rupees
      clue: 5 and 5 more.
      why: 5 + 5 = 10 rupees.
    - label: One ₹2 coin and three ₹1 coins
      bin: 5 rupees
      clue: Start at 2, then count 3 more.
      why: 2, 3, 4, 5. That is 5 rupees.
    - label: One ₹10 coin
      bin: 10 rupees
      clue: One coin, but read its number.
      why: One ₹10 coin is 10 rupees.
  items:
  - prompt: Two 1-rupee coins make how many rupees?
    answer: '2'
    check: 1 + 1
    difficulty: 1
    hints:
    - 1 + 1.
    - Count the coins.
    solution: 2 rupees.
    mistakes:
      '11': ukg_count_on
  - prompt: 'A 2-rupee coin and a 1-rupee coin make:'
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - 2 + 1.
    - Count on.
    solution: 3 rupees.
    mistakes:
      '21': ukg_count_on
  - prompt: Which coin is worth the most?
    options:
    - 10 rupees
    - 5 rupees
    - 1 rupee
    answer: 10 rupees
    difficulty: 1
    hints:
    - Biggest number.
    - '10.'
    solution: 10 rupees is the most.
  - prompt: 'Two 5-rupee coins make:'
    answer: '10'
    check: 5 + 5
    difficulty: 2
    hints:
    - 5 + 5.
    - Two hands of fingers.
    solution: 10 rupees.
    mistakes:
      '55': ukg_count_on
      '5': ukg_touch
  - prompt: 'A toffee costs 1 rupee. 3 toffees cost:'
    answer: '3'
    check: 3*1
    difficulty: 2
    hints:
    - 1 + 1 + 1.
    - 1 rupee each.
    solution: 3 rupees.
    mistakes:
      '1': ukg_touch
  - prompt: 'We use money to:'
    options:
    - buy things
    - eat it
    - plant it
    answer: buy things
    difficulty: 1
    hints:
    - At the shop.
    - Pay.
    solution: We use money to buy things.
