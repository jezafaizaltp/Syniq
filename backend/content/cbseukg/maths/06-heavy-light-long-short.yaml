# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 6
title: Heavy and Light, Long and Short
tips:
  kg_heavy: "Pretend to lift each one. Which would need two hands?"
  kg_light: "Which one floats up in the air?"
  kg_seesaw: "When a big child sits on one end of a see-saw, that end is pushed towards the ground."

concepts:
- code: ukgm.measure
  title: Heavy and Light, Long and Short
  notes: |
    Comparing weight (heavy/light) and length (long/short, tall/short); using a see-saw or lifting.
  explanations:
    text: A watermelon is heavy; a feather is light. A train is long; a car is short. Lift or line things up to compare.
    visual: Draw a see-saw with a heavy elephant down low and a light mouse up high.
    step_by_step: 'Step 1: Hold both or look. Step 2: The one harder to lift is heavier. Step 3: Line up ends to compare length.'
    real_world: School bags get heavy when we pack too many books.
  picture:
    kind: compare
    columns:
    - title: Heavy
      points:
      - 🍉 watermelon
      - 🐘 elephant
    - title: Light
      points:
      - 🪶 feather
      - 🎈 balloon
    alt: 'Heavy: a watermelon, an elephant. Light: a feather, a balloon.'
  activity:
    type: sort
    prompt: Heavy or light?
    bins:
    - Heavy
    - Light
    items:
    - label: 🍉 Watermelon
      bin: Heavy
      clue: Can you lift it with one finger?
      why: A watermelon needs two hands. It is heavy.
    - label: 🪶 Feather
      bin: Light
      clue: Does the wind blow it away?
      why: A feather floats. It is light.
    - label: 🧱 Brick
      bin: Heavy
      clue: Is it hard to carry?
      why: A brick is heavy.
    - label: 🎈 Balloon
      bin: Light
      clue: Does it float up?
      why: A balloon is light.
    - label: 🪨 Big rock
      bin: Heavy
      clue: Can you pick it up easily?
      why: A big rock is heavy.
    - label: 🍃 Leaf
      bin: Light
      clue: Does it fall slowly?
      why: A leaf is light.
  items:
  - prompt: Which is heavy?
    options:
    - 🍉 watermelon
    - 🪶 feather
    - 🍃 leaf
    answer: 🍉 watermelon
    difficulty: 1
    hints:
    - Hard to lift.
    - Big fruit.
    solution: A watermelon is heavy.
    mistakes: {"🪶 feather": "kg_heavy", "🍃 leaf": "kg_heavy"}
  - prompt: Which is light?
    options:
    - 🎈 balloon
    - 🪨 rock
    - 🧱 brick
    answer: 🎈 balloon
    difficulty: 1
    hints:
    - It floats.
    - Easy to lift.
    solution: A balloon is light.
    mistakes: {"🪨 rock": "kg_light", "🧱 brick": "kg_light"}
  - prompt: Which is longer?
    options:
    - 🚆 train
    - 🚗 car
    - 🛵 scooter
    answer: 🚆 train
    difficulty: 1
    hints:
    - Many coaches.
    - Very long.
    solution: A train is longer.
    mistakes: {"🚗 car": "kg_long", "🛵 scooter": "kg_long"}
  - prompt: 'On a see-saw, the heavier side goes:'
    options:
    - down
    - up
    - sideways
    answer: down
    difficulty: 2
    hints:
    - "Picture a big child on one side: does that side go up or the other way?"
    - Think of papa and you.
    solution: The heavier side goes down.
    mistakes: {"up": "kg_seesaw", "sideways": "kg_seesaw"}
  - prompt: Which is taller?
    options:
    - 🦒 giraffe
    - 🐕 dog
    - 🐈 cat
    answer: 🦒 giraffe
    difficulty: 2
    hints:
    - Long neck.
    - Very high.
    solution: A giraffe is taller.
    mistakes: {"🐕 dog": "kg_tall", "🐈 cat": "kg_tall"}
  - prompt: Which is the opposite of heavy?
    options:
    - light
    - long
    - short
    answer: light
    difficulty: 2
    hints:
    - Not heavy.
    - Like a feather.
    solution: Light is the opposite of heavy.
    mistakes: {"long": "kg_opposite", "short": "kg_opposite"}
