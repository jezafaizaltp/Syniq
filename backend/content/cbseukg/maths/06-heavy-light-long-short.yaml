# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 6
title: Heavy and Light, Long and Short
tips:
  kg_heavy: "Pretend to lift each one. Which would need two hands?"
  kg_light: "Which one floats up in the air?"
  kg_seesaw: "When a big child sits on one end of a see-saw, that end is pushed towards the ground."
  uk6_lift: Pretend to lift each one. Which needs more strength?
  uk6_line: Stand them side by side from the same start. Which one goes further?
  uk6_tall: Stand them up next to each other. Whose top is higher?

concepts:
- code: ukgm.measure
  title: Heavy and Light, Long and Short
  notes: |
    Comparing weight (heavy/light) and length (long/short, tall/short); using a see-saw or lifting.
  explanations:
    text: A watermelon is heavy; a feather is light. A train is long; a car is short. Lift or line things up to compare.
    visual: Draw a see-saw with a heavy elephant down low and a light mouse up high.
    step_by_step: 'Step 1: Hold both or look. Step 2: The one harder to lift is heavier. Step 3: Line up ends to compare length.'
    real_world: School bags get heavy when we pack too many books.
  picture:
    kind: compare
    columns:
    - title: Heavy
      points:
      - 🍉 watermelon
      - 🐘 elephant
    - title: Light
      points:
      - 🪶 feather
      - 🎈 balloon
    alt: 'Heavy: a watermelon, an elephant. Light: a feather, a balloon.'
  activity:
    type: sort
    prompt: Heavy or light?
    bins:
    - Heavy
    - Light
    items:
    - label: 🍉 Watermelon
      bin: Heavy
      clue: Can you lift it with one finger?
      why: A watermelon needs two hands. It is heavy.
    - label: 🪶 Feather
      bin: Light
      clue: Does the wind blow it away?
      why: A feather floats. It is light.
    - label: 🧱 Brick
      bin: Heavy
      clue: Is it hard to carry?
      why: A brick is heavy.
    - label: 🎈 Balloon
      bin: Light
      clue: Does it float up?
      why: A balloon is light.
    - label: 🪨 Big rock
      bin: Heavy
      clue: Can you pick it up easily?
      why: A big rock is heavy.
    - label: 🍃 Leaf
      bin: Light
      clue: Does it fall slowly?
      why: A leaf is light.
  lesson:
    - teach: 'Heavy things are hard to lift, like a bag of rice. Light things are easy to lift, like a feather. Big is not always heavy: a big balloon is light!'
      picture:
        kind: compare
        columns:
        - title: Heavy
          points:
          - bag of rice
          - watermelon
          - stone
        - title: Light
          points:
          - feather
          - balloon
          - leaf
        alt: Heavy and light things.
      check:
        prompt: Which of these is the lightest?
        options:
        - a 🍃 leaf
        - a 🪨 rock
        - a 🧱 brick
        answer: a 🍃 leaf
        why: A leaf floats down from the tree; a rock and a brick are hard to lift.
    - teach: On a see-saw or a pan balance, the heavier side goes down and the lighter side goes up.
      check:
        prompt: A dog sits on one side of a see-saw, a cat on the other. The dog's side goes down. Which is heavier?
        options:
        - the dog
        - the cat
        - both the same
        answer: the dog
        why: The heavier side goes down.
    - teach: 'Long and short tell length: a train is long, a car is short. Tall and short tell height: a tree is tall, a plant is short. Always start from the same line to compare.'
      check:
        prompt: Which of these grows the tallest?
        options:
        - a 🌴 palm tree
        - a 🌷 flower
        - a 🍄 mushroom
        answer: a 🌴 palm tree
        why: 'Stand them side by side: the palm tree''s top is highest.'
  items:
  - prompt: Which is heavy?
    options:
    - 🍉 watermelon
    - 🪶 feather
    - 🍃 leaf
    answer: 🍉 watermelon
    difficulty: 1
    hints:
    - Hard to lift.
    - Big fruit.
    solution: A watermelon is heavy.
    mistakes: {"🪶 feather": "kg_heavy", "🍃 leaf": "kg_heavy"}
  - prompt: Which is light?
    options:
    - 🎈 balloon
    - 🪨 rock
    - 🧱 brick
    answer: 🎈 balloon
    difficulty: 1
    hints:
    - It floats.
    - Easy to lift.
    solution: A balloon is light.
    mistakes: {"🪨 rock": "kg_light", "🧱 brick": "kg_light"}
  - prompt: Which is longer?
    options:
    - 🚆 train
    - 🚗 car
    - 🛵 scooter
    answer: 🚆 train
    difficulty: 1
    hints:
    - Many coaches.
    - Very long.
    solution: A train is longer.
    mistakes: {"🚗 car": "kg_long", "🛵 scooter": "kg_long"}
  - prompt: 'On a see-saw, the heavier side goes:'
    options:
    - down
    - up
    - sideways
    answer: down
    difficulty: 2
    hints:
    - "Picture a big child on one side: does that side go up or the other way?"
    - Think of papa and you.
    solution: The heavier side goes down.
    mistakes: {"up": "kg_seesaw", "sideways": "kg_seesaw"}
  - prompt: Which is taller?
    options:
    - 🦒 giraffe
    - 🐕 dog
    - 🐈 cat
    answer: 🦒 giraffe
    difficulty: 2
    hints:
    - Long neck.
    - Very high.
    solution: A giraffe is taller.
    mistakes: {"🐕 dog": "kg_tall", "🐈 cat": "kg_tall"}
  - prompt: Which is the opposite of heavy?
    options:
    - light
    - long
    - short
    answer: light
    difficulty: 2
    hints:
    - Not heavy.
    - Like a feather.
    solution: Light is the opposite of heavy.
    mistakes: {"long": "kg_opposite", "short": "kg_opposite"}
  - prompt: 'Which is heavier: a school bag full of books or a pencil?'
    options:
    - the school bag
    - the pencil
    - both the same
    answer: the school bag
    difficulty: 1
    hints:
    - Which one makes your shoulders tired?
    - Lift each in your mind.
    solution: 'Step 1: a pencil is easy to lift. Step 2: the full bag is heavier.'
    mistakes:
      the pencil: uk6_lift
      both the same: uk6_lift
  - prompt: Which animal is the longest?
    options:
    - a 🐍 snake
    - a 🐜 ant
    - a 🐞 ladybird
    answer: a 🐍 snake
    difficulty: 1
    hints:
    - Lay them in a line from the same start.
    - Which stretches the furthest?
    solution: 'Step 1: an ant and a ladybird are tiny. Step 2: the snake is longer.'
    mistakes:
      a 🐜 ant: uk6_line
      a 🐞 ladybird: uk6_line
  - prompt: 'On a pan balance, one pan goes up. That pan is:'
    options:
    - lighter
    - heavier
    - longer
    answer: lighter
    difficulty: 2
    hints:
    - The heavier side is pulled down.
    - So what about the side going up?
    solution: 'Step 1: heavy goes down. Step 2: the side going up is lighter.'
    mistakes:
      heavier: uk6_lift
      longer: uk6_line
  - prompt: Which of these is the shortest?
    options:
    - a 🖍️ crayon
    - a 🚌 bus
    - a 🚂 train
    answer: a 🖍️ crayon
    difficulty: 1
    hints:
    - Which fits in your hand?
    - Compare from the same starting line.
    solution: 'Step 1: bus and train are very long. Step 2: the crayon is shorter.'
    mistakes:
      a 🚌 bus: uk6_line
      a 🚂 train: uk6_line
  - prompt: Which is the opposite of tall?
    options:
    - short
    - heavy
    - long
    answer: short
    difficulty: 2
    hints:
    - Tall tells how high. Its opposite tells how low.
    - A tall tree and a ___ plant.
    solution: 'Step 1: tall is about height. Step 2: its opposite is short.'
    mistakes:
      heavy: uk6_tall
      long: uk6_line
  - prompt: A big balloon and a small stone. Which is heavier?
    options:
    - the small stone
    - the big balloon
    - they weigh the same
    answer: the small stone
    difficulty: 3
    hints:
    - Big does not always mean heavy.
    - Which one floats in the air?
    solution: 'Step 1: a balloon is full of air and floats. Step 2: the stone is heavier.'
    mistakes:
      the big balloon: uk6_lift
      they weigh the same: uk6_lift
  - prompt: Which is the heaviest animal?
    options:
    - 🐘 elephant
    - 🐕 dog
    - 🐓 hen
    answer: 🐘 elephant
    difficulty: 2
    hints:
    - Which could you never lift?
    - Think of their sizes.
    solution: 'Step 1: a hen and a dog can be lifted. Step 2: the elephant is heaviest.'
    mistakes:
      🐕 dog: uk6_lift
      🐓 hen: uk6_lift
  - prompt: 'Two ribbons start at the same line. The red one ends further. The red ribbon is:'
    options:
    - longer
    - shorter
    - heavier
    answer: longer
    difficulty: 3
    hints:
    - Same start, so look at the ends.
    - Ending further means it stretches more.
    solution: 'Step 1: same start. Step 2: ends further, so longer.'
    mistakes:
      shorter: uk6_line
      heavier: uk6_lift
  - prompt: 'Which is taller: a 🦒 giraffe or a 🐇 rabbit?'
    options:
    - the giraffe
    - the rabbit
    - both the same
    answer: the giraffe
    difficulty: 1
    hints:
    - Which can eat leaves from high trees?
    - Stand them side by side.
    solution: 'Step 1: a rabbit is small. Step 2: the giraffe is taller.'
    mistakes:
      the rabbit: uk6_tall
      both the same: uk6_tall
