# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 9. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 9
title: Patterns
tips:
  uk9_repeat: Say the pattern out loud and clap on each part. Which part starts again?
  uk9_core: Find the part that repeats. Cover it with your hand, then see what comes after it.
  uk9_jump: Look at how much each number grows. Do the same jump again.
concepts:
- code: ukgm.pattern
  title: Patterns
  notes: |
    Patterns with two and three parts (ABC); number patterns 1, 2, 1, 2 and counting in twos to 10.
  explanations:
    text: 'Some patterns repeat three things: red, yellow, green, red, yellow, green. Find the part that repeats.'
    visual: 'Draw a traffic-light bead string: red, yellow, green, red, yellow, ?'
    step_by_step: 'Step 1: Say the pattern. Step 2: Find the part that repeats. Step 3: Continue it.'
    real_world: Traffic lights go red, yellow, green again and again.
  picture:
    kind: flow
    steps:
    - 🔴
    - 🟡
    - 🟢
    - 🔴
    - 🟡
    - '?'
    alt: 'A pattern: red, yellow, green, red, yellow, and next comes green.'
  activity:
    type: sort
    prompt: What comes next?
    bins:
    - 🔴
    - 🟡
    - 🟢
    items:
    - label: 🔴🟡🟢🔴🟡 ...
      bin: 🟢
      clue: The part that repeats has three colours.
      why: Red, yellow, green. After yellow comes green.
    - label: 🟢🟢🔴🟢🟢 ...
      bin: 🔴
      clue: Two greens, then?
      why: Green, green, red. After two greens comes red.
    - label: 🟡🔴🟢🟡🔴🟢🟡 ...
      bin: 🔴
      clue: Find where it starts again.
      why: Yellow, red, green. After yellow comes red.
    - label: 🔴🔴🟡🟡🔴🔴🟡 ...
      bin: 🟡
      clue: Each colour comes two times.
      why: Red, red, yellow, yellow. Yellow comes again.
    - label: 🟢🟡🟡🟢🟡🟡🟢 ...
      bin: 🟡
      clue: One of one colour, then two of another.
      why: Green, yellow, yellow. After green comes yellow.
  lesson:
    - teach: 'A pattern repeats again and again. 🔴🔵🔴🔵: red, blue, red, blue. Next comes red. Say it out loud like a song!'
      check:
        prompt: 🍎 🍌 🍎 🍌 🍎 ? What comes next?
        options:
        - 🍌
        - 🍎
        - 🍇
        answer: 🍌
        why: Apple, banana repeats. After apple comes banana.
    - teach: 'Some patterns have 3 parts: 🐶🐱🐭 🐶🐱🐭. Find the part that repeats, then keep going.'
      picture:
        kind: flow
        steps:
        - dog
        - cat
        - mouse
        - dog
        - cat
        - mouse
        alt: 'A three-part pattern: dog, cat, mouse, repeating.'
      check:
        prompt: 🌸 🌼 🌻 🌸 🌼 ? What comes next?
        options:
        - 🌻
        - 🌸
        - 🌼
        answer: 🌻
        why: The repeating part is three flowers; the third one comes next.
    - teach: 'Numbers make patterns too. 1, 2, 1, 2 repeats. 2, 4, 6, 8 grows by 2 each time: we count in twos.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 2
          label: '2'
        - at: 4
          label: '4'
        - at: 6
          label: '6'
        jumps:
        - from: 2
          to: 4
          label: '+2'
        - from: 4
          to: 6
          label: '+2'
        alt: 'Counting in twos: 2, 4, 6.'
      check:
        prompt: 'Count in twos: 4, 6, 8, ?'
        options:
        - '10'
        - '9'
        - '12'
        answer: '10'
        why: 'Each jump is 2: 8 and 2 more is 10.'
  items:
  - prompt: 🔴 🟡 🟢 🔴 🟡 ?
    options:
    - 🟢
    - 🔴
    - 🟡
    answer: 🟢
    difficulty: 1
    hints:
    - Three colours repeat.
    - After yellow comes ...
    solution: Green comes next.
    mistakes: {"🔴": "kg_pattern", "🟡": "kg_pattern"}
  - prompt: 🐱 🐶 🐱 🐶 ?
    options:
    - 🐱
    - 🐶
    - 🐭
    answer: 🐱
    difficulty: 1
    hints:
    - Two animals repeat.
    - After dog comes ...
    solution: Cat comes next.
    mistakes: {"🐶": "kg_pattern", "🐭": "kg_pattern"}
  - prompt: 2, 4, 6, 8, ?
    answer: '10'
    check: 8 + 2
    difficulty: 2
    hints:
    - Jump by 2.
    - 8 + 2.
    solution: '10.'
    mistakes:
      '9': ukg_touch
  - prompt: ⬛ ⬛ 🔺 ⬛ ⬛ 🔺 ?
    options:
    - ⬛
    - 🔺
    - ⚪
    answer: ⬛
    difficulty: 2
    hints:
    - The part that repeats has 3 shapes.
    - Square, square, triangle.
    solution: A square comes next.
    mistakes: {"🔺": "kg_pattern", "⚪": "kg_pattern"}
  - prompt: 1, 2, 3, 1, 2, 3, 1, ?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 1, 2, 3 repeats.
    - After 1 comes ...
    solution: '2.'
    mistakes:
      '3': ukg_touch
  - prompt: 🌞 🌙 🌞 🌙 ?
    options:
    - 🌞
    - 🌙
    - ⭐
    answer: 🌞
    difficulty: 1
    hints:
    - Sun, moon ...
    - Repeat.
    solution: Sun comes next.
    mistakes: {"🌙": "kg_pattern", "⭐": "kg_pattern"}
  - prompt: 🔺 🟦 🔺 🟦 ? What comes next?
    options:
    - 🔺
    - 🟦
    - ⭐
    answer: 🔺
    difficulty: 1
    hints:
    - 'Say it: triangle, square, triangle, square ...'
    - What starts again?
    solution: 'Step 1: triangle, square repeats. Step 2: next is triangle.'
    mistakes:
      🟦: uk9_repeat
      ⭐: uk9_core
  - prompt: clap, stamp, clap, stamp, clap, ? What comes next?
    options:
    - stamp
    - clap
    - jump
    answer: stamp
    difficulty: 1
    hints:
    - Do it with your body!
    - After every clap comes ...
    solution: 'Step 1: clap, stamp repeats. Step 2: after clap comes stamp.'
    mistakes:
      clap: uk9_repeat
      jump: uk9_core
  - prompt: 1, 1, 2, 1, 1, 2, 1, 1, ? What comes next?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - 'Find the part that repeats: it has three numbers.'
    - Cover 1, 1, 2 and look again.
    solution: 'Step 1: 1, 1, 2 repeats. Step 2: after 1, 1 comes 2.'
    mistakes:
      '1': uk9_core
      '3': uk9_core
  - prompt: 'Count in twos: 2, 4, ?'
    answer: '6'
    check: 4+2
    difficulty: 2
    hints:
    - How much did it grow from 2 to 4?
    - Do the same jump.
    solution: 'Step 1: +2 each time. Step 2: 4 + 2 = 6.'
    mistakes:
      '5': uk9_jump
      '8': uk9_jump
  - prompt: 🌞 🌞 🌙 🌞 🌞 🌙 🌞 ? What comes next?
    options:
    - 🌞
    - 🌙
    - ⭐
    answer: 🌞
    difficulty: 2
    hints:
    - The repeating part has three pictures.
    - Sun, sun, moon ... where are you now?
    solution: 'Step 1: sun, sun, moon repeats. Step 2: after one sun comes another sun.'
    mistakes:
      🌙: uk9_core
      ⭐: uk9_core
  - prompt: 'Count back in ones: 9, 8, 7, ? What comes next?'
    answer: '6'
    check: 7-1
    difficulty: 2
    hints:
    - Each number is one less.
    - Go down by one.
    solution: 'Step 1: −1 each time. Step 2: 7 − 1 = 6.'
    mistakes:
      '8': uk9_jump
      '5': uk9_jump
  - prompt: 🟢 🟢 🔴 🟢 🟢 🔴. How many 🟢 come before each 🔴?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Look at one repeating part.
    - Count the green dots before the red.
    solution: 'Step 1: green, green, red. Step 2: 2 greens.'
    mistakes:
      '1': uk9_core
      '4': uk9_core
  - prompt: Which one is a pattern?
    options:
    - 🐟 🐠 🐟 🐠 🐟 🐠
    - 🐟 🐟 🐠 🐟 🐠 🐠
    - 🐠 🐟 🐟 🐟 🐠 🐠
    answer: 🐟 🐠 🐟 🐠 🐟 🐠
    difficulty: 3
    hints:
    - A pattern repeats the same part every time.
    - Say each row out loud.
    solution: 'Step 1: in only one row the same two fish take turns every time. Step 2: that row is the pattern.'
    mistakes:
      🐟 🐟 🐠 🐟 🐠 🐠: uk9_repeat
      🐠 🐟 🐟 🐟 🐠 🐠: uk9_repeat
  - prompt: 'Count in tens: 10, 20, 30, ?'
    answer: '40'
    check: 30+10
    difficulty: 3
    hints:
    - Each jump is the same size.
    - How much from 10 to 20?
    solution: 'Step 1: +10 each time. Step 2: 30 + 10 = 40.'
    mistakes:
      '31': uk9_jump
      '35': uk9_jump
