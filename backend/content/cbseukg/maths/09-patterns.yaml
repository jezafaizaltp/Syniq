# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 9. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 9
title: Patterns
concepts:
- code: ukgm.pattern
  title: Patterns
  notes: |
    Patterns with two and three parts (ABC); number patterns 1, 2, 1, 2 and counting in twos to 10.
  explanations:
    text: 'Some patterns repeat three things: red, yellow, green, red, yellow, green. Find the part that repeats.'
    visual: 'Draw a traffic-light bead string: red, yellow, green, red, yellow, ?'
    step_by_step: 'Step 1: Say the pattern. Step 2: Find the part that repeats. Step 3: Continue it.'
    real_world: Traffic lights go red, yellow, green again and again.
  picture:
    kind: flow
    steps:
    - 🔴
    - 🟡
    - 🟢
    - 🔴
    - 🟡
    - '?'
    alt: 'A pattern: red, yellow, green, red, yellow, and next comes green.'
  activity:
    type: sort
    prompt: What comes next?
    bins:
    - 🔴
    - 🟡
    - 🟢
    items:
    - label: 🔴🟡🟢🔴🟡 ...
      bin: 🟢
      clue: The part that repeats has three colours.
      why: Red, yellow, green. After yellow comes green.
    - label: 🟢🟢🔴🟢🟢 ...
      bin: 🔴
      clue: Two greens, then?
      why: Green, green, red. After two greens comes red.
    - label: 🟡🔴🟢🟡🔴🟢🟡 ...
      bin: 🔴
      clue: Find where it starts again.
      why: Yellow, red, green. After yellow comes red.
    - label: 🔴🔴🟡🟡🔴🔴🟡 ...
      bin: 🟡
      clue: Each colour comes two times.
      why: Red, red, yellow, yellow. Yellow comes again.
    - label: 🟢🟡🟡🟢🟡🟡🟢 ...
      bin: 🟡
      clue: One of one colour, then two of another.
      why: Green, yellow, yellow. After green comes yellow.
  items:
  - prompt: 🔴 🟡 🟢 🔴 🟡 ?
    options:
    - 🟢
    - 🔴
    - 🟡
    answer: 🟢
    difficulty: 1
    hints:
    - Three colours repeat.
    - After yellow comes ...
    solution: Green comes next.
    mistakes: {"🔴": "kg_pattern", "🟡": "kg_pattern"}
  - prompt: 🐱 🐶 🐱 🐶 ?
    options:
    - 🐱
    - 🐶
    - 🐭
    answer: 🐱
    difficulty: 1
    hints:
    - Two animals repeat.
    - After dog comes ...
    solution: Cat comes next.
    mistakes: {"🐶": "kg_pattern", "🐭": "kg_pattern"}
  - prompt: 2, 4, 6, 8, ?
    answer: '10'
    check: 8 + 2
    difficulty: 2
    hints:
    - Jump by 2.
    - 8 + 2.
    solution: '10.'
    mistakes:
      '9': ukg_touch
  - prompt: ⬛ ⬛ 🔺 ⬛ ⬛ 🔺 ?
    options:
    - ⬛
    - 🔺
    - ⚪
    answer: ⬛
    difficulty: 2
    hints:
    - The part that repeats has 3 shapes.
    - Square, square, triangle.
    solution: A square comes next.
    mistakes: {"🔺": "kg_pattern", "⚪": "kg_pattern"}
  - prompt: 1, 2, 3, 1, 2, 3, 1, ?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 1, 2, 3 repeats.
    - After 1 comes ...
    solution: '2.'
    mistakes:
      '3': ukg_touch
  - prompt: 🌞 🌙 🌞 🌙 ?
    options:
    - 🌞
    - 🌙
    - ⭐
    answer: 🌞
    difficulty: 1
    hints:
    - Sun, moon ...
    - Repeat.
    solution: Sun comes next.
    mistakes: {"🌙": "kg_pattern", "⭐": "kg_pattern"}
