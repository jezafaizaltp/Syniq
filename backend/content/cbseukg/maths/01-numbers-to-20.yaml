# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 1
title: Numbers 11 to 20
tips:
  ukg_touch: Touch each one as you count. One touch, one number.
  ukg_count_on: Start from the bigger number and count on with your fingers.
  kg_biggest: "All start with 1. Look at the second digit. Which is the biggest?"
concepts:
- code: ukgm.to20
  title: Numbers 11 to 20
  notes: |
    Counting and reading numbers 11 to 20 as ten and some more; before and after.
  explanations:
    text: After 10 come 11, 12, 13 ... 20. 12 is ten and 2 more. 20 is two tens.
    visual: Draw a full row of 10 dots and 2 more dots below, and write 12.
    step_by_step: 'Step 1: Count 10. Step 2: Count the extra ones. Step 3: Say the number.'
    real_world: Count the children in your class line.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 2
    points:
    - at: 10
      label: '10'
    - at: 12
      label: '12'
    - at: 20
      label: '20'
    alt: 12 on a number line is 10 and 2 more; 20 is two tens.
    jumps:
    - from: 0
      to: 10
      label: '10'
    - from: 10
      to: 12
      label: '+2'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: A full ten-frame is 10. Move to the number.
    goals:
    - prompt: 🔟 + ⚫⚫ (ten and 2 more)
      target: 12
      mistakes:
      - when:
          v: 2
        say: Don't forget the full ten-frame. 10 and 2 more is 12.
      - when:
          v: 11
        say: 'Ten and 1 more is 11. Here there are 2 more: 12.'
    - prompt: 🔟 + 🔟 (two full ten-frames)
      target: 20
      mistakes:
      - when:
          v: 10
        say: 'That''s one ten-frame. There are two: 10, then 20.'
      - when:
          v: 2
        say: Each frame is 10, not 1.
    - prompt: 🔟 + ⚫⚫⚫⚫⚫ (ten and 5 more)
      target: 15
      mistakes:
      - when:
          v: 5
        say: 'Count the full frame too: 10, then 11, 12, 13, 14, 15.'
      - when:
          v: 16
        say: Count the 5 dots one by one after 10.
  items:
  - prompt: '10 and 2 more make:'
    answer: '12'
    check: 10 + 2
    difficulty: 1
    hints:
    - Count on from 10.
    - 11, 12.
    solution: 10 + 2 = 12.
    mistakes:
      '102': ukg_count_on
      '11': ukg_touch
  - prompt: What comes after 15?
    answer: '16'
    check: 15 + 1
    difficulty: 1
    hints:
    - Count on one.
    - 14, 15, ...
    solution: After 15 comes 16.
    mistakes:
      '14': ukg_touch
  - prompt: What comes before 11?
    answer: '10'
    check: 11 - 1
    difficulty: 1
    hints:
    - Count back one.
    - '..., 11.'
    solution: Before 11 comes 10.
    mistakes:
      '12': ukg_touch
  - prompt: '10 and 5 more make:'
    answer: '15'
    check: 10 + 5
    difficulty: 2
    hints:
    - Count on from 10.
    - 11, 12, 13, 14, 15.
    solution: 10 + 5 = 15.
    mistakes:
      '105': ukg_count_on
      '14': ukg_touch
  - prompt: What comes after 19?
    answer: '20'
    check: 19 + 1
    difficulty: 2
    hints:
    - Count on one.
    - 18, 19, ...
    solution: After 19 comes 20.
    mistakes:
      '110': ukg_count_on
  - prompt: Which number is the biggest?
    options:
    - '17'
    - '13'
    - '11'
    answer: '17'
    difficulty: 2
    hints:
    - Count up from 10.
    - Which comes last?
    solution: 17 is the biggest.
    mistakes: {"13": "kg_biggest", "11": "kg_biggest"}
