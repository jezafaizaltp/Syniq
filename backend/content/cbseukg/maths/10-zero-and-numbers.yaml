# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 10. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 10
title: Zero and Writing Numbers
concepts:
- code: ukgm.zero
  title: Zero and Writing Numbers
  notes: |
    Zero means none; matching numerals 0 to 10 to groups; number names one to ten.
  explanations:
    text: 'Zero means nothing at all. An empty plate has 0 laddoos. We also learn number names: one, two, three ... ten.'
    visual: Draw an empty basket with 0 under it, and a basket with 3 balls and 3 under it.
    step_by_step: 'Step 1: Count the things. Step 2: If there are none, it is 0. Step 3: Match the number name.'
    real_world: When all the biscuits are eaten, there are 0 biscuits left.
  picture:
    kind: bars
    bars:
    - label: basket A
      value: 3
    - label: basket B
      value: 0
    alt: Basket A has 3 balls and basket B has 0.
    unit: balls
  items:
  - prompt: An empty plate has how many laddoos?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Nothing on it.
    - Zero.
    solution: '0.'
    mistakes:
      '1': ukg_touch
  - prompt: Which number name is 3?
    options:
    - three
    - two
    - five
    answer: three
    difficulty: 1
    hints:
    - 'Count: one, two, ...'
    - th-
    solution: 3 is three.
  - prompt: Which number name is 5?
    options:
    - five
    - four
    - six
    answer: five
    difficulty: 1
    hints:
    - One hand.
    - f-
    solution: 5 is five.
  - prompt: You have 2 balloons. Both fly away. How many now?
    answer: '0'
    check: 2 - 2
    difficulty: 2
    hints:
    - None left.
    - 2 − 2.
    solution: '0.'
    mistakes:
      '2': ukg_touch
  - prompt: Which number name is 10?
    options:
    - ten
    - one
    - nine
    answer: ten
    difficulty: 2
    hints:
    - Two hands.
    - t-
    solution: 10 is ten.
  - prompt: Which is the smallest number?
    options:
    - '0'
    - '1'
    - '5'
    answer: '0'
    difficulty: 2
    hints:
    - Nothing at all.
    - Zero.
    solution: 0 is the smallest.
