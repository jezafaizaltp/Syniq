# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 10. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 10
title: Zero and Writing Numbers
tips:
  kg_number_name: "Show the number on your fingers, then say its name while counting up."
  kg_zero: "Zero means nothing at all, an empty plate. Is anything smaller than nothing?"
  uk10_zero: Zero means nothing is there at all. Is anything left?
  uk10_name: Show the number on your fingers, then say its name.
  uk10_count: Touch each one once and say the numbers in order.

concepts:
- code: ukgm.zero
  title: Zero and Writing Numbers
  notes: |
    Zero means none; matching numerals 0 to 10 to groups; number names one to ten.
  explanations:
    text: 'Zero means nothing at all. An empty plate has 0 laddoos. We also learn number names: one, two, three ... ten.'
    visual: Draw an empty basket with 0 under it, and a basket with 3 balls and 3 under it.
    step_by_step: 'Step 1: Count the things. Step 2: If there are none, it is 0. Step 3: Match the number name.'
    real_world: When all the biscuits are eaten, there are 0 biscuits left.
  picture:
    kind: bars
    bars:
    - label: basket A
      value: 3
    - label: basket B
      value: 0
    alt: Basket A has 3 balls and basket B has 0.
    unit: balls
  activity:
    type: number_line
    min: 0
    max: 5
    step: 1
    start: 5
    prompt: How many are left on the plate? Zero means none.
    goals:
    - prompt: 🍩🍩 on a plate. Both are eaten.
      target: 0
      mistakes:
      - when:
          v: 2
        say: Both were eaten. Is anything left? Nothing left is zero.
      - when:
          v: 1
        say: Both were eaten, not one.
    - prompt: An empty plate gets 🍩🍩🍩
      target: 3
      mistakes:
      - when:
          v: 0
        say: The plate was empty, but now 3 were put on it.
    - prompt: 🍩🍩🍩🍩 on a plate. 4 are eaten.
      target: 0
      mistakes:
      - when:
          v: 4
        say: 4 were eaten. How many are still there? None, which is 0.
  lesson:
    - teach: Zero (0) means none. An empty box has 0 toys. If all the birds fly away, 0 birds are left. Zero is the smallest counting number.
      check:
        prompt: An empty glass has how many drops of milk?
        options:
        - '0'
        - '1'
        - '10'
        answer: '0'
        why: Empty means nothing, and nothing is 0.
    - teach: 'Every number has a name: 0 zero, 1 one, 2 two, 3 three, 4 four, 5 five, 6 six, 7 seven, 8 eight, 9 nine, 10 ten.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 0
          label: zero
        - at: 5
          label: five
        - at: 10
          label: ten
        alt: Numbers 0 to 10 with some names.
      check:
        prompt: Which number name is 7?
        options:
        - seven
        - six
        - eight
        answer: seven
        why: 'Count: five, six, seven. 7 is seven.'
    - teach: We write numbers by tracing their shape. 1 is a straight line. 0 is a round shape. 8 is like two circles, one on top of the other.
      check:
        prompt: Which number looks like two circles, one on top of the other?
        options:
        - '8'
        - '1'
        - '7'
        answer: '8'
        why: 8 has a loop at the top and a loop at the bottom.
  items:
  - prompt: An empty plate has how many laddoos?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Nothing on it.
    - Zero.
    solution: '0.'
    mistakes:
      '1': ukg_touch
  - prompt: Which number name is 3?
    options:
    - three
    - two
    - five
    answer: three
    difficulty: 1
    hints:
    - 'Count: one, two, ...'
    - th-
    solution: 3 is three.
    mistakes: {"two": "kg_number_name", "five": "kg_number_name"}
  - prompt: Which number name is 5?
    options:
    - five
    - four
    - six
    answer: five
    difficulty: 1
    hints:
    - One hand.
    - f-
    solution: 5 is five.
    mistakes: {"four": "kg_number_name", "six": "kg_number_name"}
  - prompt: You have 2 balloons. Both fly away. How many now?
    answer: '0'
    check: 2 - 2
    difficulty: 2
    hints:
    - None left.
    - 2 − 2.
    solution: '0.'
    mistakes:
      '2': ukg_touch
  - prompt: Which number name is 10?
    options:
    - ten
    - one
    - nine
    answer: ten
    difficulty: 2
    hints:
    - Two hands.
    - t-
    solution: 10 is ten.
    mistakes: {"one": "kg_number_name", "nine": "kg_number_name"}
  - prompt: Which is the smallest number?
    options:
    - '0'
    - '1'
    - '5'
    answer: '0'
    difficulty: 2
    hints:
    - Nothing at all.
    - Zero.
    solution: 0 is the smallest.
    mistakes: {"1": "kg_zero", "5": "kg_zero"}
  - prompt: Which number name is 4?
    options:
    - four
    - five
    - fourteen
    answer: four
    difficulty: 1
    hints:
    - Show the number on your fingers.
    - Count one, two, three, ...
    solution: 'Step 1: one, two, three, four. Step 2: 4 is four.'
    mistakes:
      five: uk10_name
      fourteen: uk10_name
  - prompt: Which number name is 9?
    options:
    - nine
    - six
    - ten
    answer: nine
    difficulty: 1
    hints:
    - It comes just before ten.
    - Count up to it.
    solution: 'Step 1: seven, eight, nine. Step 2: 9 is nine.'
    mistakes:
      six: uk10_name
      ten: uk10_name
  - prompt: 'Count: 🐞🐞🐞🐞🐞🐞🐞. How many ladybirds?'
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Touch each ladybird once.
    - The last number you say is the answer.
    solution: 'Step 1: 1, 2, 3, 4, 5, 6, 7. Step 2: 7.'
    mistakes:
      '6': uk10_count
      '8': uk10_count
  - prompt: You had 4 🍬. You ate all of them. How many now?
    answer: '0'
    check: 4-4
    difficulty: 2
    hints:
    - All of them means every one.
    - Is any sweet left?
    solution: 'Step 1: 4 eaten. Step 2: 0 left.'
    mistakes:
      '4': uk10_zero
      '1': uk10_zero
  - prompt: Which number name is 6?
    options:
    - six
    - seven
    - sixteen
    answer: six
    difficulty: 2
    hints:
    - One hand and one more finger.
    - Count on from five.
    solution: 'Step 1: five, then one more. Step 2: six.'
    mistakes:
      seven: uk10_name
      sixteen: uk10_name
  - prompt: What is 5 + 0?
    answer: '5'
    check: 5+0
    difficulty: 2
    hints:
    - Adding zero adds nothing.
    - Does the group change?
    solution: 'Step 1: nothing is added. Step 2: still 5.'
    mistakes:
      '0': uk10_zero
      '50': uk10_zero
  - prompt: Which number is written with just one straight line?
    options:
    - '1'
    - '0'
    - '8'
    answer: '1'
    difficulty: 2
    hints:
    - Draw each one in the air.
    - Which has no curve at all?
    solution: 'Step 1: 0 and 8 are curved. Step 2: 1 is one straight line.'
    mistakes:
      '0': uk10_name
      '8': uk10_name
  - prompt: 'Put in order from smallest: 3, 0, 1. Which comes first?'
    options:
    - '0'
    - '1'
    - '3'
    answer: '0'
    difficulty: 3
    hints:
    - Which one means nothing at all?
    - Count from the very start.
    solution: 'Step 1: 0, 1, 3. Step 2: 0 comes first.'
    mistakes:
      '1': uk10_zero
      '3': uk10_zero
  - prompt: Write the number for 'eight'.
    answer: '8'
    check: '8'
    difficulty: 3
    hints:
    - 'Count up: six, seven, ...'
    - It comes just after seven.
    solution: 'Step 1: six, seven, eight. Step 2: 8.'
    mistakes:
      '7': uk10_name
      '9': uk10_name
