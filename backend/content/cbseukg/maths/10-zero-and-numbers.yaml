# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 10. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 10
title: Zero and Writing Numbers
tips:
  kg_number_name: "Show the number on your fingers, then say its name while counting up."
  kg_zero: "Zero means nothing at all, an empty plate. Is anything smaller than nothing?"

concepts:
- code: ukgm.zero
  title: Zero and Writing Numbers
  notes: |
    Zero means none; matching numerals 0 to 10 to groups; number names one to ten.
  explanations:
    text: 'Zero means nothing at all. An empty plate has 0 laddoos. We also learn number names: one, two, three ... ten.'
    visual: Draw an empty basket with 0 under it, and a basket with 3 balls and 3 under it.
    step_by_step: 'Step 1: Count the things. Step 2: If there are none, it is 0. Step 3: Match the number name.'
    real_world: When all the biscuits are eaten, there are 0 biscuits left.
  picture:
    kind: bars
    bars:
    - label: basket A
      value: 3
    - label: basket B
      value: 0
    alt: Basket A has 3 balls and basket B has 0.
    unit: balls
  activity:
    type: number_line
    min: 0
    max: 5
    step: 1
    start: 5
    prompt: How many are left on the plate? Zero means none.
    goals:
    - prompt: 🍩🍩 on a plate. Both are eaten.
      target: 0
      mistakes:
      - when:
          v: 2
        say: Both were eaten. Is anything left? Nothing left is zero.
      - when:
          v: 1
        say: Both were eaten, not one.
    - prompt: An empty plate gets 🍩🍩🍩
      target: 3
      mistakes:
      - when:
          v: 0
        say: The plate was empty, but now 3 were put on it.
    - prompt: 🍩🍩🍩🍩 on a plate. 4 are eaten.
      target: 0
      mistakes:
      - when:
          v: 4
        say: 4 were eaten. How many are still there? None, which is 0.
  items:
  - prompt: An empty plate has how many laddoos?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Nothing on it.
    - Zero.
    solution: '0.'
    mistakes:
      '1': ukg_touch
  - prompt: Which number name is 3?
    options:
    - three
    - two
    - five
    answer: three
    difficulty: 1
    hints:
    - 'Count: one, two, ...'
    - th-
    solution: 3 is three.
    mistakes: {"two": "kg_number_name", "five": "kg_number_name"}
  - prompt: Which number name is 5?
    options:
    - five
    - four
    - six
    answer: five
    difficulty: 1
    hints:
    - One hand.
    - f-
    solution: 5 is five.
    mistakes: {"four": "kg_number_name", "six": "kg_number_name"}
  - prompt: You have 2 balloons. Both fly away. How many now?
    answer: '0'
    check: 2 - 2
    difficulty: 2
    hints:
    - None left.
    - 2 − 2.
    solution: '0.'
    mistakes:
      '2': ukg_touch
  - prompt: Which number name is 10?
    options:
    - ten
    - one
    - nine
    answer: ten
    difficulty: 2
    hints:
    - Two hands.
    - t-
    solution: 10 is ten.
    mistakes: {"one": "kg_number_name", "nine": "kg_number_name"}
  - prompt: Which is the smallest number?
    options:
    - '0'
    - '1'
    - '5'
    answer: '0'
    difficulty: 2
    hints:
    - Nothing at all.
    - Zero.
    solution: 0 is the smallest.
    mistakes: {"1": "kg_zero", "5": "kg_zero"}
