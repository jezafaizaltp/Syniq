# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 4
title: Taking Away
concepts:
- code: ukgm.sub
  title: Taking Away
  notes: |
    Taking away with pictures: 4 birds, 1 flies away, 3 are left; differences within 10.
  explanations:
    text: Taking away means some go away. 4 birds sit on a wire; 1 flies away; 3 are left.
    visual: Draw 4 birds and cross out 1 flying away.
    step_by_step: 'Step 1: Count them all. Step 2: Take some away. Step 3: Count what is left.'
    real_world: '5 laddoos, you eat 2: 3 are left.'
  picture:
    kind: number_line
    from: 0
    to: 5
    step: 1
    points:
    - at: 4
      label: '4'
    - at: 3
      label: '3'
    alt: '4 − 1 on a number line: start at 4, hop back 1 to 3.'
    jumps:
    - from: 4
      to: 3
      label: −1
  items:
  - prompt: 🐦🐦🐦🐦, 1 flies away. How many are left?
    answer: '3'
    check: 4 - 1
    difficulty: 1
    hints:
    - Take 1 away.
    - 4, then 3.
    solution: 4 − 1 = 3.
    mistakes:
      '5': ukg_touch
  - prompt: 5 laddoos, you eat 2. How many are left?
    answer: '3'
    check: 5 - 2
    difficulty: 1
    hints:
    - Count back 2.
    - 4, 3.
    solution: 5 − 2 = 3.
    mistakes:
      '7': ukg_touch
      '2': ukg_touch
  - prompt: 3 − 1 = ?
    answer: '2'
    check: 3 - 1
    difficulty: 1
    hints:
    - One less than 3.
    - Count back.
    solution: 3 − 1 = 2.
    mistakes:
      '4': ukg_touch
  - prompt: 6 − 3 = ?
    answer: '3'
    check: 6 - 3
    difficulty: 2
    hints:
    - Count back 3 from 6.
    - 5, 4, 3.
    solution: 6 − 3 = 3.
    mistakes:
      '9': ukg_touch
  - prompt: 8 − 2 = ?
    answer: '6'
    check: 8 - 2
    difficulty: 2
    hints:
    - Count back 2.
    - 7, 6.
    solution: 8 − 2 = 6.
    mistakes:
      '10': ukg_touch
      '7': ukg_touch
  - prompt: 4 − 4 = ?
    answer: '0'
    check: 4 - 4
    difficulty: 2
    hints:
    - Take all away.
    - Nothing left.
    solution: 4 − 4 = 0.
    mistakes:
      '4': ukg_touch
      '8': ukg_touch
