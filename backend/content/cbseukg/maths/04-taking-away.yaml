# CBSE UKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-math
chapter: 4
title: Taking Away
tips:
  uk4_left: Cross out the ones that go away. Count only the ones still there.
  uk4_back: Start at the first number and count back one finger for each one taken.
  uk4_less: Taking away makes the group smaller. Should the answer be more or less than the start?
concepts:
- code: ukgm.sub
  title: Taking Away
  notes: |
    Taking away with pictures: 4 birds, 1 flies away, 3 are left; differences within 10.
  explanations:
    text: Taking away means some go away. 4 birds sit on a wire; 1 flies away; 3 are left.
    visual: Draw 4 birds and cross out 1 flying away.
    step_by_step: 'Step 1: Count them all. Step 2: Take some away. Step 3: Count what is left.'
    real_world: '5 laddoos, you eat 2: 3 are left.'
  picture:
    kind: number_line
    from: 0
    to: 5
    step: 1
    points:
    - at: 4
      label: '4'
    - at: 3
      label: '3'
    alt: '4 − 1 on a number line: start at 4, hop back 1 to 3.'
    jumps:
    - from: 4
      to: 3
      label: −1
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 10
    prompt: Some go away. How many are left?
    goals:
    - prompt: 🐦🐦🐦🐦 sit. 1 flies away.
      target: 3
      mistakes:
      - when:
          v: 5
        say: Flying away means fewer, not more. Count back 1 from 4.
      - when:
          v: 1
        say: 1 flew away. How many are still sitting?
    - prompt: 🎈🎈🎈🎈🎈🎈 balloons. 2 pop.
      target: 4
      mistakes:
      - when:
          v: 2
        say: 2 popped. Count the ones still there.
      - when:
          v: 5
        say: 'Count back 2 from 6: 5, 4. Two steps.'
    - prompt: 🍪🍪🍪 cookies. All 3 are eaten.
      target: 0
      mistakes:
      - when:
          v: 3
        say: All 3 were eaten. Is any cookie left on the plate?
  lesson:
    - teach: Taking away means some go away. 5 birds, 2 fly off, 3 are left. The sign − means 'take away'.
      check:
        prompt: 🍎🍎🍎🍎, you eat 1. How many apples are left?
        options:
        - '3'
        - '4'
        - '5'
        answer: '3'
        why: 'Cross out 1 apple, count the rest: 1, 2, 3.'
      ways:
      - style: visual
        teach: Some go away and some are left. Cross out the ones that leave.
        picture:
          kind: compare
          columns:
          - title: At first
            points:
            - 🐸
            - 🐸
            - 🐸
            - 🐸
            - 🐸
            - 🐸
          - title: Hop away
            points:
            - 🐸
            - 🐸
          - title: Left
            points:
            - 4 frogs
          alt: 6 frogs at first. 2 hop away. 4 frogs are left.
      - style: step_by_step
        teach: 'Take away with blocks. First: build a tower of 9 blocks. Second: take off 4 blocks. Third: put them to the side. Fourth: count the blocks still in the tower: 5 are left.'
    - teach: 'A quick way: start at the big number and count back. For 7 − 2, say ''seven'', then 6, 5. The answer is 5.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 7
          label: start 7
        - at: 5
          label: '5'
        alt: '7 − 2: start at 7 and count back two steps to 5.'
      check:
        prompt: Start at 6 and count back 2. Where do you land?
        options:
        - '4'
        - '8'
        - '5'
        answer: '4'
        why: Six, then 5, 4.
      ways:
      - style: visual
        teach: Count back on the number line for 9 − 3. Start at 9 and hop back three times.
        picture:
          kind: number_line
          from: 0
          to: 10
          step: 1
          jumps:
          - from: 9
            to: 8
            label: '-1'
          - from: 8
            to: 7
            label: '-1'
          - from: 7
            to: 6
            label: '-1'
          alt: A number line from 0 to 10. Starting at 9, three hops back land on 8, 7 and then 6.
      - style: real_world
        teach: When a few biscuits are eaten from a plate, you can count back to find how many are left.
    - teach: 'Take away 0 and nothing changes: 5 − 0 = 5. Take away all and nothing is left: 5 − 5 = 0.'
      check:
        prompt: 3 − 3 = ?
        options:
        - '0'
        - '3'
        - '6'
        answer: '0'
        why: All 3 are taken, so none are left.
      ways:
      - style: visual
        teach: Taking away zero and taking away all, side by side.
        picture:
          kind: compare
          columns:
          - title: Take away 0
            points:
            - 6 − 0 = 6
            - nothing changes
          - title: Take away all
            points:
            - 6 − 6 = 0
            - nothing is left
          alt: 6 take away 0 is 6, nothing changes. 6 take away 6 is 0, nothing is left.
      - style: real_world
        teach: If no one takes a sweet from the jar, the jar still has the same number of sweets.
  items:
  - prompt: 🐦🐦🐦🐦, 1 flies away. How many are left?
    answer: '3'
    check: 4 - 1
    difficulty: 1
    hints:
    - Take 1 away.
    - 4, then 3.
    solution: 4 − 1 = 3.
    mistakes:
      '5': ukg_touch
  - prompt: 5 laddoos, you eat 2. How many are left?
    answer: '3'
    check: 5 - 2
    difficulty: 1
    hints:
    - Count back 2.
    - 4, 3.
    solution: 5 − 2 = 3.
    mistakes:
      '7': ukg_touch
      '2': ukg_touch
  - prompt: 3 − 1 = ?
    answer: '2'
    check: 3 - 1
    difficulty: 1
    hints:
    - One less than 3.
    - Count back.
    solution: 3 − 1 = 2.
    mistakes:
      '4': ukg_touch
  - prompt: 6 − 3 = ?
    answer: '3'
    check: 6 - 3
    difficulty: 2
    hints:
    - Count back 3 from 6.
    - 5, 4, 3.
    solution: 6 − 3 = 3.
    mistakes:
      '9': ukg_touch
  - prompt: 8 − 2 = ?
    answer: '6'
    check: 8 - 2
    difficulty: 2
    hints:
    - Count back 2.
    - 7, 6.
    solution: 8 − 2 = 6.
    mistakes:
      '10': ukg_touch
      '7': ukg_touch
  - prompt: 4 − 4 = ?
    answer: '0'
    check: 4 - 4
    difficulty: 2
    hints:
    - Take all away.
    - Nothing left.
    solution: 4 − 4 = 0.
    mistakes:
      '4': ukg_touch
      '8': ukg_touch
  - prompt: 🐟🐟🐟🐟🐟, 2 swim away. How many are left?
    answer: '3'
    check: 5-2
    difficulty: 1
    hints:
    - Cover the ones that swim away.
    - Count the fish still there.
    solution: 'Step 1: 5 fish, 2 go. Step 2: 3 left.'
    mistakes:
      '7': uk4_less
      '2': uk4_left
  - prompt: 5 − 1 = ?
    answer: '4'
    check: 5-1
    difficulty: 1
    hints:
    - Taking 1 away is the number just before.
    - Five, then count back one.
    solution: 'Step 1: 5. Step 2: back one is 4.'
    mistakes:
      '6': uk4_less
      '1': uk4_left
  - prompt: 7 − 0 = ?
    answer: '7'
    check: 7-0
    difficulty: 2
    hints:
    - Taking zero means taking nothing.
    - Does anything go away?
    solution: 'Step 1: nothing is taken. Step 2: still 7.'
    mistakes:
      '0': uk4_left
      '6': uk4_back
  - prompt: 9 − 3 = ?
    answer: '6'
    check: 9-3
    difficulty: 2
    hints:
    - Start at 9.
    - Count back three steps.
    solution: 'Step 1: 9. Step 2: 8, 7, 6.'
    mistakes:
      '7': uk4_back
      '12': uk4_less
  - prompt: Arjun has 6 🍪. Arjun gives 4 to friends. How many are left?
    answer: '2'
    check: 6-4
    difficulty: 2
    hints:
    - Giving away means they go.
    - Count back 4 from 6.
    solution: 'Step 1: 6. Step 2: 5, 4, 3, 2.'
    mistakes:
      '10': uk4_less
      '4': uk4_left
  - prompt: 10 − 5 = ?
    answer: '5'
    check: 10-5
    difficulty: 3
    hints:
    - Show ten fingers.
    - Fold down one whole hand.
    solution: 'Step 1: 10 fingers. Step 2: fold 5, 5 are left.'
    mistakes:
      '15': uk4_less
      '4': uk4_back
  - prompt: 8 🎈. 8 pop. How many balloons now?
    answer: '0'
    check: 8-8
    difficulty: 2
    hints:
    - How many popped?
    - Is any balloon still there?
    solution: 'Step 1: all 8 popped. Step 2: 0 left.'
    mistakes:
      '8': uk4_left
      '16': uk4_less
  - prompt: There were 7 🐦 on a wire. Now there are 4. How many flew away?
    answer: '3'
    check: 7-4
    difficulty: 3
    hints:
    - Count up from 4 to 7.
    - '5, 6, 7: how many steps?'
    solution: 'Step 1: from 4 count up to 7. Step 2: 3 steps, so 3 flew away.'
    mistakes:
      '4': uk4_left
      '11': uk4_less
  - prompt: Which one makes 2?
    options:
    - 5 − 3
    - 5 − 2
    - 5 − 1
    answer: 5 − 3
    difficulty: 3
    hints:
    - Work out each one with your fingers.
    - How many must go so that 2 stay?
    solution: 'Step 1: 5 − 2 = 3, 5 − 1 = 4. Step 2: 5 − 3 = 2.'
    mistakes:
      5 − 2: uk4_back
      5 − 1: uk4_back
  - prompt: 'Case: There are 8 mangoes in a basket. Amma uses 3 to make juice. How many mangoes are left in the basket?'
    options:
    - '5'
    - '11'
    - '3'
    answer: '5'
    hints:
    - Start at 8 and count back.
    - 'Count back three: 7, 6, ...'
    solution: '8 take away 3: seven, six, five. 5 mangoes are left.'
    mistakes:
      '11': uk4_less
      '3': uk4_left
    exam: case
    difficulty: 2
  - prompt: 'Situation: There are 6 children on the swings. All 6 go home for lunch. How many children are on the swings now?'
    options:
    - '0'
    - '6'
    - '1'
    answer: '0'
    hints:
    - All of them went home.
    - Is anyone still on the swings?
    solution: When all 6 go, 6 − 6 = 0. No one is left on the swings.
    mistakes:
      '6': uk4_left
      '1': uk4_left
    exam: competency
    difficulty: 2
