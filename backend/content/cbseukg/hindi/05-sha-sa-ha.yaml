    - पहली आवाज़ 'स' होनी चाहिए।
    solution: सूरज 'स' से शुरू होता है।
    mistakes:
      🦁 शेर: ukgh_sound
  - prompt: '''ह'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🦌 हिरन
