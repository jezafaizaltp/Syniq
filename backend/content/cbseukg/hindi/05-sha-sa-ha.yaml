# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 5
title: श, ष, स, ह
concepts:
- code: ukgh.sha
  title: श, ष, स, ह
  notes: |
    हिंदी व्यंजन श, स, ह, ष: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: श, ष, स, ह। श से शेर 🦁, स से सेब 🍎, ह से हाथी 🐘, ष से षट्कोण ⬡, स से सूरज ☀️, ह से हिरन 🦌।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - श
      - स
      - ह
    - title: शब्द
      points:
      - शेर 🦁
      - सेब 🍎
      - हाथी 🐘
    alt: श से शेर 🦁, स से सेब 🍎, ह से हाथी 🐘।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - श
    - ष
    - स
    - ह
    items:
    - label: 🦁 शेर
      bin: श
      clue: 'शे-र: श्श्श जैसी आवाज़?'
      why: शेर श से।
    - label: 🔶 षट्कोण
      bin: ष
      clue: 'षट्-कोण: छह कोने वाला।'
      why: षट्कोण ष से।
    - label: 🍎 सेब
      bin: स
      clue: 'से-ब: स्स्स जैसी आवाज़?'
      why: सेब स से।
    - label: 🐘 हाथी
      bin: ह
      clue: 'हा-थी: पहली आवाज़?'
      why: हाथी ह से।
    - label: 🐍 साँप
      bin: स
      clue: 'साँ-प: पहली आवाज़?'
      why: साँप स से।
  items:
  - prompt: '''श'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🦁 शेर
    - 🍎 सेब
    - 🐘 हाथी
    answer: 🦁 शेर
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'श' होनी चाहिए।
    solution: शेर 'श' से शुरू होता है।
    mistakes:
      🍎 सेब: ukgh_sound
  - prompt: '''स'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🍎 सेब
    - 🦁 शेर
    - 🐘 हाथी
    answer: 🍎 सेब
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'स' होनी चाहिए।
    solution: सेब 'स' से शुरू होता है।
    mistakes:
      🦁 शेर: ukgh_sound
  - prompt: '''ह'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🐘 हाथी
    - 🍎 सेब
    - 🦁 शेर
    answer: 🐘 हाथी
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ह' होनी चाहिए।
    solution: हाथी 'ह' से शुरू होता है।
    mistakes:
      🍎 सेब: ukgh_sound
  - prompt: '''ष'' से कौन-सा शब्द शुरू होता है?'
    options:
    - ⬡ षट्कोण
    - 🐘 हाथी
    - 🍎 सेब
    answer: ⬡ षट्कोण
    difficulty: 2
