# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 5
title: श, ष, स, ह
tips:
  ukh5_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  ukh5_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: ukgh.sha
  title: श, ष, स, ह
  notes: |
    हिंदी व्यंजन श, स, ह, ष: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: श, ष, स, ह। श से शेर 🦁, स से सेब 🍎, ह से हाथी 🐘, ष से षट्कोण ⬡, स से सूरज ☀️, ह से हिरन 🦌।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - श
      - स
      - ह
    - title: शब्द
      points:
      - शेर 🦁
      - सेब 🍎
      - हाथी 🐘
    alt: श से शेर 🦁, स से सेब 🍎, ह से हाथी 🐘।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - श
    - ष
    - स
    - ह
    items:
    - label: 🦁 शेर
      bin: श
      clue: 'शे-र: श्श्श जैसी आवाज़?'
      why: शेर श से।
    - label: 🔶 षट्कोण
      bin: ष
      clue: 'षट्-कोण: छह कोने वाला।'
      why: षट्कोण ष से।
    - label: 🍎 सेब
      bin: स
      clue: 'से-ब: स्स्स जैसी आवाज़?'
      why: सेब स से।
    - label: 🐘 हाथी
      bin: ह
      clue: 'हा-थी: पहली आवाज़?'
      why: हाथी ह से।
    - label: 🐍 साँप
      bin: स
      clue: 'साँ-प: पहली आवाज़?'
      why: साँप स से।
  lesson:
    - teach: 'आज के अक्षर: श, स। हर अक्षर की अपनी आवाज़ है: श से 🐚 शंख; स से 🐍 साँप।'
      check:
        prompt: '''श'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🐚 शंख
        - 🦢 हंस
        - 🐍 साँप
        answer: 🐚 शंख
        why: 'शंख बोलो: सबसे पहले ''श'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: श और स से शुरू होने वाले कुछ और शब्द। हर शब्द बोलो और पहली आवाज़ सुनो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - श
            - स
          - title: शब्द
            points:
            - शरबत
            - 🛣️ सड़क
          - title: एक और शब्द
            points:
            - शलजम
            - 🪡 सुई
          alt: श से शरबत और शलजम। स से सड़क और सुई।
      - style: step_by_step
        teach: 'पहली आवाज़ सुनो। पहला: ''शरबत'' शब्द धीरे-धीरे बोलो। दूसरा: सबसे पहली आवाज़ पर रुक जाओ। तीसरा: उस आवाज़ को अकेले बोलो। चौथा: यह आवाज़ ''श'' अक्षर की है।'
    - teach: 'और अक्षर: ह। ह से 🦢 हंस।'
      check:
        prompt: '''ह'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🦢 हंस
        - 🌆 शहर
        - 🪜 सीढ़ी
        answer: 🦢 हंस
        why: 'हंस बोलो: सबसे पहले ''ह'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: ह से शुरू होने वाले कुछ और शब्द। हर चित्र देखो और उसकी पहली आवाज़ बोलो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - ह
          - title: शब्द
            points:
            - 🔨 हथौड़ा
          - title: एक और शब्द
            points:
            - हल
          alt: ह से हथौड़ा और हल।
      - style: real_world
        teach: घर या स्कूल में ऐसी चीज़ें ढूँढो जिनके नाम ह से शुरू होते हैं, और हर नाम ज़ोर से बोलकर किसी बड़े को सुनाओ।
    - teach: 'श, ष, स तीनों में ''स्स'' जैसी आवाज़ है। श में जीभ थोड़ी ऊपर, स में दाँतों के पास। ष बहुत कम शब्दों में आता है, जैसे षट्कोण (छह कोनों वाला आकार)। ह की आवाज़ गले से हवा जैसी: ह-ह-ह!'
      check:
        prompt: किस अक्षर की आवाज़ गले से हवा जैसी निकलती है?
        options:
        - ह
        - स
        - श
        answer: ह
        why: 'ह बोलो: गले से हल्की हवा निकलती है।'
      ways:
      - style: visual
        teach: '''श'' और ''स'' बोलते समय जीभ कहाँ रहती है, एक के बाद एक।'
        picture:
          kind: flow
          steps:
          - '''स'' में जीभ दाँतों के पास'
          - '''श'' में जीभ थोड़ी ऊपर और पीछे'
          - होंठ थोड़े आगे
          alt: '''स'' बोलते समय जीभ दाँतों के पास रहती है। ''श'' बोलते समय जीभ थोड़ी ऊपर और पीछे जाती है, और होंठ थोड़े आगे आते हैं।'
      - style: step_by_step
        teach: 'साँप और चुप का खेल। पहला: साँप की तरह ''स्स्स'' बोलो। दूसरा: अब उँगली होंठों पर रखकर ''श्श्श'' बोलो, जैसे किसी को चुप कराते हैं। तीसरा: दोनों बारी-बारी बोलो। चौथा: सुनो, दोनों आवाज़ें थोड़ी अलग हैं।'
  items:
  - prompt: '''श'' से कौन-सा शब्द शुरू होता है?'
