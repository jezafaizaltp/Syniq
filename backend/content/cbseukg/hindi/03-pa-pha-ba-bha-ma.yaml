    - 🐻 भालू
    answer: ⚽ फ़ुटबॉल
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: फ़ुटबॉल बोलो। चरण 2: पहली आवाज़ ''फ'' है।'
    mistakes:
      🐟 मछली: ukh3_first
      🐻 भालू: ukh3_first
  - prompt: किस शब्द की पहली आवाज़ 'ब' है?
    options:
    - 🦆 बत्तख
