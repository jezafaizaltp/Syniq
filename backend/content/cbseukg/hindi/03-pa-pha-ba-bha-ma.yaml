# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 3
title: प, फ, ब, भ, म
concepts:
- code: ukgh.pa
  title: प, फ, ब, भ, म
  notes: |
    हिंदी व्यंजन प, फ, ब, भ, म: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: प, फ, ब, भ, म। प से पतंग 🪁, फ से फूल 🌸, ब से बत्तख 🦆, भ से भालू 🐻, म से मछली 🐟, प से पेड़ 🌳।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - प
      - फ
      - ब
    - title: शब्द
      points:
      - पतंग 🪁
      - फूल 🌸
      - बत्तख 🦆
    alt: प से पतंग 🪁, फ से फूल 🌸, ब से बत्तख 🦆।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - प
    - फ
    - ब
    - भ
    - म
    items:
    - label: 🪁 पतंग
      bin: प
      clue: 'प-तंग: पहली आवाज़?'
      why: पतंग प से।
    - label: 🌸 फूल
      bin: फ
      clue: 'फू-ल: हवा वाली आवाज़?'
      why: फूल फ से।
    - label: 🦆 बतख
      bin: ब
      clue: 'ब-तख: पहली आवाज़?'
      why: बतख ब से।
    - label: 🐻 भालू
      bin: भ
      clue: 'भा-लू: भारी आवाज़?'
      why: भालू भ से।
    - label: 🐟 मछली
      bin: म
      clue: 'म-छली: होंठ बंद करके?'
      why: मछली म से।
  items:
  - prompt: '''प'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🪁 पतंग
    - 🌸 फूल
    - 🐑 भेड़
    answer: 🪁 पतंग
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'प' होनी चाहिए।
    solution: पतंग 'प' से शुरू होता है।
    mistakes:
      🌸 फूल: ukgh_sound
  - prompt: '''फ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🌸 फूल
    - 🪁 पतंग
    - 🦆 बत्तख
    answer: 🌸 फूल
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'फ' होनी चाहिए।
    solution: फूल 'फ' से शुरू होता है।
    mistakes:
      🪁 पतंग: ukgh_sound
  - prompt: '''ब'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🦆 बत्तख
    - 🐑 भेड़
    - 🌸 फूल
    answer: 🦆 बत्तख
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ब' होनी चाहिए।
    solution: बत्तख 'ब' से शुरू होता है।
    mistakes:
      🐑 भेड़: ukgh_sound
  - prompt: '''भ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🐻 भालू
    - 🦆 बत्तख
    - 🪁 पतंग
    answer: 🐻 भालू
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'भ' होनी चाहिए।
    solution: भालू 'भ' से शुरू होता है।
    mistakes:
      🦆 बत्तख: ukgh_sound
  - prompt: '''म'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🐟 मछली
    - 🐻 भालू
    - 🌸 फूल
    answer: 🐟 मछली
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'म' होनी चाहिए।
    solution: मछली 'म' से शुरू होता है।
    mistakes:
      🐻 भालू: ukgh_sound
  - prompt: '''प'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🌳 पेड़
    - 🐟 मछली
    - 🦆 बत्तख
    answer: 🌳 पेड़
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'प' होनी चाहिए।
    solution: पेड़ 'प' से शुरू होता है।
    mistakes:
      🐟 मछली: ukgh_sound
