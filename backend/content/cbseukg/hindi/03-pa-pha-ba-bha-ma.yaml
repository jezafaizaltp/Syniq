    difficulty: 2
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: बत्तख बोलो। चरण 2: पहली आवाज़ ''ब'' है।'
    mistakes:
      🌳 पेड़: ukh3_first
      🦚 मोर: ukh3_first
  - prompt: किस शब्द की पहली आवाज़ 'भ' है?
    options:
    - 🍚 भात
