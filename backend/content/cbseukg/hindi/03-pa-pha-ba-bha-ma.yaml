    - 🦚 मोर
    answer: 🍚 भात
    difficulty: 2
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: भात बोलो। चरण 2: पहली आवाज़ ''भ'' है।'
    mistakes:
      🦆 बत्तख: ukh3_first
      🦚 मोर: ukh3_first
  - prompt: किस शब्द की पहली आवाज़ 'म' है?
    options:
    - 🐟 मछली
    - 🌳 पेड़
    - 🐐 बकरी
    answer: 🐟 मछली
    difficulty: 2
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: मछली बोलो। चरण 2: पहली आवाज़ ''म'' है।'
    mistakes:
      🌳 पेड़: ukh3_first
      🐐 बकरी: ukh3_first
  - prompt: '''💧 पानी'' किस अक्षर से शुरू होता है?'
    options:
    - प
    - भ
    - ब
    answer: प
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: पानी की पहली आवाज़। चरण 2: ''प''।'
    mistakes:
      भ: ukh3_look
      ब: ukh3_look
  - prompt: '''🍎 फल'' किस अक्षर से शुरू होता है?'
    options:
