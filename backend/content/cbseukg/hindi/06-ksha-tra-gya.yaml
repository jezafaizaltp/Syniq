# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 6
title: क्ष, त्र, ज्ञ
concepts:
- code: ukgh.ksha
  title: क्ष, त्र, ज्ञ
  notes: |
    संयुक्त व्यंजन क्ष (क्+ष), त्र (त्+र), ज्ञ (ज्+ञ): क्षत्रिय, त्रिशूल, ज्ञानी।
  explanations:
    text: 'कुछ अक्षर दो आवाज़ों से मिलकर बनते हैं: क्ष (क्+ष), त्र (त्+र), ज्ञ (ज्+ञ)। त्र से त्रिशूल, ज्ञ से ज्ञान।'
    visual: क्ष, त्र, ज्ञ बड़े लिखो और त्र के पास त्रिशूल बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसके दो हिस्से बोलो। 3. पूरा अक्षर बोलो।
    real_world: हिंदी वर्णमाला क्ष, त्र, ज्ञ पर खत्म होती है।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - क्ष
      - त्र
      - ज्ञ
    - title: बना है
      points:
      - क् + ष
      - त् + र
      - ज् + ञ
    alt: क्ष क् और ष से, त्र त् और र से, ज्ञ ज् और ञ से बना है।
  items:
  - prompt: त्र किससे बना है?
    options:
    - त् + र
    - क् + ष
    - ज् + ञ
    answer: त् + र
    difficulty: 2
    hints:
    - पहली आवाज़ 'त'।
    - फिर 'र'।
    solution: त्र = त् + र।
    mistakes:
      क् + ष: ukgh_read
  - prompt: '''त्रिशूल'' किस अक्षर से शुरू होता है?'
    options:
    - त्र
    - क्ष
    - ज्ञ
    answer: त्र
    difficulty: 1
    hints:
    - पहली आवाज़ सुनो।
    - त्रि...
    solution: त्रिशूल 'त्र' से शुरू होता है।
  - prompt: '''ज्ञान'' किस अक्षर से शुरू होता है?'
    options:
    - ज्ञ
    - त्र
    - क्ष
    answer: ज्ञ
    difficulty: 1
    hints:
    - पहली आवाज़ सुनो।
    - ज्ञा...
    solution: ज्ञान 'ज्ञ' से शुरू होता है।
  - prompt: हिंदी वर्णमाला का आखिरी अक्षर कौन-सा है?
    options:
    - ज्ञ
    - क
    - अ
    answer: ज्ञ
    difficulty: 2
    hints:
    - क्ष, त्र, ...
    - सबसे अंत में।
    solution: आखिरी अक्षर ज्ञ है।
  - prompt: क्ष किससे बना है?
    options:
    - क् + ष
    - त् + र
    - स् + ह
    answer: क् + ष
    difficulty: 2
    hints:
    - पहली आवाज़ 'क'।
    - फिर 'ष'।
    solution: क्ष = क् + ष।
  - prompt: हिंदी वर्णमाला किस अक्षर से शुरू होती है?
    options:
    - अ
    - क
    - ज्ञ
    answer: अ
    difficulty: 1
    hints:
    - पहला स्वर।
    - अनार।
    solution: वर्णमाला 'अ' से शुरू होती है।
