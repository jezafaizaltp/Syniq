# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 8
title: आ की मात्रा (ा)
tips:
  kgh_aa: "आ की मात्रा एक खड़ी लकीर (ा) है। हर शब्द में वह लकीर ढूँढो।"
  kgh_aa_count: "'नाना' में हर खड़ी लकीर (ा) पर उँगली रखकर गिनो।"
  kgh_bina_matra: "बिना मात्रा वाले शब्द में अक्षरों पर कोई लकीर या निशान नहीं लगता। हर शब्द को ध्यान से देखो।"
  ukh8_matra: अक्षर के ठीक बाद खड़ी पाई ( ा ) को ढूँढो। जहाँ पाई है, वहाँ आवाज़ लंबी 'आ' होती है।
  ukh8_gin: शब्द पर उँगली रखकर हर खड़ी पाई गिनो।
  ukh8_padho: हर अक्षर को उसकी मात्रा के साथ पढ़ो, फिर जोड़ो।

concepts:
- code: ukgh.aamatra
  title: आ की मात्रा (ा)
  notes: |
    आ की मात्रा (ा) लगाकर शब्द पढ़ना: राजा, नाना, माला, आम, ताला।
  explanations:
    text: 'अक्षर के बाद यह छोटी खड़ी लकीर (ा) लगे तो ''आ'' की आवाज़ आती है: म + ा = मा, र + ा = रा। राजा, माला, ताला।'
    visual: 'चित्र बनाओ: एक माला और एक ताला, और नीचे शब्द लिखो, मात्रा को रंग से दिखाओ।'
    step_by_step: 1. अक्षर बोलो। 2. मात्रा देखो। 3. 'आ' जोड़कर बोलो।
    real_world: 'अपने परिवार में ''आ'' की मात्रा वाले नाम खोजो: नाना, मामा।'
  picture:
    kind: flow
    steps:
    - म
    - ा
    - मा
    - माला
    alt: म में आ की मात्रा लगाकर मा बनता है, फिर माला।
  activity:
    type: sort
    prompt: किस शब्द में आ की मात्रा (ा) है?
    bins:
    - आ की मात्रा है
    - मात्रा नहीं
    items:
    - label: 👑 राजा
      bin: आ की मात्रा है
      clue: 'रा-जा: लंबी आ?'
      why: राजा में ा है।
    - label: 📿 माला
      bin: आ की मात्रा है
      clue: 'मा-ला: लंबी आ?'
      why: माला में ा है।
    - label: 🔒 ताला
      bin: आ की मात्रा है
      clue: 'ता-ला: लंबी आ?'
      why: ताला में ा है।
    - label: 🏠 घर
      bin: मात्रा नहीं
      clue: 'घ-र: लंबी आवाज़ है?'
      why: घर में कोई मात्रा नहीं।
    - label: 🪷 कमल
      bin: मात्रा नहीं
      clue: 'क-म-ल: आ सुनाई देता है?'
      why: कमल में मात्रा नहीं।
  lesson:
    - teach: '''आ'' की मात्रा एक खड़ी पाई है: ा। यह अक्षर के बाद लगती है और आवाज़ लंबी कर देती है। क + ा = का, म + ा = मा, न + ा = ना।'
      picture:
        kind: compare
        columns:
        - title: बिना मात्रा
          points:
          - क
          - म
          - न
        - title: आ की मात्रा
          points:
          - का
          - मा
          - ना
        alt: अक्षर और आ की मात्रा लगाकर बने अक्षर।
      check:
        prompt: ब + ा = ?
        options:
        - बा
        - ब
        - बी
        answer: बा
        why: खड़ी पाई लगने से ब की आवाज़ लंबी होकर बा।
    - teach: 'मात्रा वाले अक्षर जोड़कर शब्द बनते हैं: का + ला = काला, ता + ला = ताला, रा + जा = राजा। धीरे-धीरे पढ़ो।'
      check:
        prompt: पा + पा = ?
        options:
        - पापा
        - पप
        - पाप
        answer: पापा
        why: 'दोनों अक्षरों में आ की मात्रा: पा-पा।'
    - teach: 'मात्रा लगाने से शब्द बदल जाता है: कम से काम, जल से जाल, बल से बाल। ध्यान से देखो कि पाई कहाँ है।'
      check:
        prompt: '''जल'' में आ की मात्रा जोड़ दो (ज के बाद)। नया शब्द?'
        options:
        - जाल
        - जल
        - जली
        answer: जाल
        why: 'ज + ा = जा, फिर ल: जाल।'
  items:
  - prompt: म + ा = ?
    options:
    - मा
    - मि
    - मु
    answer: मा
    difficulty: 1
    hints:
    - आ की आवाज़।
    - माँ जैसा।
    solution: म + ा = मा।
    mistakes:
      मि: ukgh_read
  - prompt: किस शब्द में आ की मात्रा है?
    options:
    - माला
    - घर
    - जल
    answer: माला
    difficulty: 1
    hints:
    - खड़ी लकीर (ा) देखो।
    - मा-ला।
    solution: माला में आ की मात्रा है।
    mistakes: {"घर": "kgh_aa", "जल": "kgh_aa"}
  - prompt: 'पढ़ो: ताला'
    options:
    - 🔒
    - 📿
    - 👑
    answer: 🔒
    difficulty: 1
    hints:
    - ता + ला।
    - दरवाज़े पर लगता है।
    solution: ताला यानी 🔒।
    mistakes: {"📿": "ukgh_read", "👑": "ukgh_read"}
  - prompt: 'पढ़ो: राजा'
    options:
    - 👑
    - 🔒
    - 🍎
    answer: 👑
    difficulty: 2
    hints:
    - रा + जा।
    - मुकुट पहनता है।
    solution: राजा यानी 👑।
    mistakes: {"🔒": "ukgh_read", "🍎": "ukgh_read"}
  - prompt: '''नाना'' में कितनी बार आ की मात्रा लगी है?'
    options:
    - दो
    - एक
    - तीन
    answer: दो
    difficulty: 2
    hints:
    - ना + ना।
    - गिनो।
    solution: दो बार।
    mistakes: {"एक": "kgh_aa_count", "तीन": "kgh_aa_count"}
  - prompt: बिना मात्रा वाला शब्द कौन-सा है?
    options:
    - कमल
    - आम
    - माला
    answer: कमल
    difficulty: 2
    hints:
    - कोई खड़ी लकीर नहीं।
    - क-म-ल।
    solution: कमल में कोई मात्रा नहीं।
    mistakes: {"आम": "kgh_bina_matra", "माला": "kgh_bina_matra"}
  - prompt: स + ा = ?
    options:
    - सा
    - स
    - सी
    answer: सा
    difficulty: 1
    hints:
    - खड़ी पाई आवाज़ लंबी करती है।
    - स को लंबा बोलो।
    solution: 'चरण 1: स + ा। चरण 2: सा।'
    mistakes:
      स: ukh8_matra
      सी: ukh8_matra
  - prompt: 'पढ़ो: नाक'
    options:
    - 👃
    - 🦆
    - 🏠
    answer: 👃
    difficulty: 1
    hints:
    - ना ... क।
    - इससे हम सूँघते हैं।
    solution: 'चरण 1: ना-क। चरण 2: नाक।'
    mistakes:
      🦆: ukh8_padho
      🏠: ukh8_padho
  - prompt: किस शब्द में आ की मात्रा नहीं है?
    options:
    - घर
    - आम
    - दादा
    answer: घर
    difficulty: 2
    hints:
    - हर शब्द में खड़ी पाई ढूँढो।
    - किसमें एक भी पाई नहीं?
    solution: 'चरण 1: आम और दादा में आ है। चरण 2: घर में नहीं।'
    mistakes:
      आम: ukh8_matra
      दादा: ukh8_matra
  - prompt: '''बाल'' से आ की मात्रा हटाओ। क्या बचेगा?'
    options:
    - बल
    - बाल
    - बोल
    answer: बल
    difficulty: 3
    hints:
    - खड़ी पाई हटा दो।
    - बाकी अक्षर पढ़ो।
    solution: 'चरण 1: बा से पाई हटाई तो ब। चरण 2: बल।'
    mistakes:
      बाल: ukh8_matra
      बोल: ukh8_matra
  - prompt: '''काला'' में कितनी बार आ की मात्रा लगी है?'
    options:
    - दो
    - एक
    - तीन
    answer: दो
    difficulty: 2
    hints:
    - हर खड़ी पाई गिनो।
    - का ... ला।
    solution: 'चरण 1: का में एक, ला में एक। चरण 2: दो।'
    mistakes:
      एक: ukh8_gin
      तीन: ukh8_gin
  - prompt: 'पढ़ो: दादा'
    options:
    - 👴
    - 🐟
    - 🌳
    answer: 👴
    difficulty: 1
    hints:
    - दा ... दा।
    - पापा के पापा।
    solution: 'चरण 1: दा-दा। चरण 2: दादा।'
    mistakes:
      🐟: ukh8_padho
      🌳: ukh8_padho
  - prompt: म + ा + ल + ा = ?
    options:
    - माला
    - माल
    - मला
    answer: माला
    difficulty: 3
    hints:
    - दोनों अक्षरों के बाद पाई है।
    - मा, फिर ला।
    solution: 'चरण 1: मा + ला। चरण 2: माला।'
    mistakes:
      माल: ukh8_matra
      मला: ukh8_matra
  - prompt: '''कम'' में आ की मात्रा जोड़ो (क के बाद)। नया शब्द?'
    options:
    - काम
    - कम
    - कमा
    answer: काम
    difficulty: 3
    hints:
    - क के बाद पाई लगाओ।
    - आवाज़ लंबी हो जाएगी।
    solution: 'चरण 1: क + ा = का। चरण 2: का + म = काम।'
    mistakes:
      कम: ukh8_matra
      कमा: ukh8_matra
  - prompt: किस शब्द में आ की मात्रा दो बार है?
    options:
    - राजा
    - राम
    - कमल
    answer: राजा
    difficulty: 2
    hints:
    - हर शब्द में पाई गिनो।
    - किसमें दो पाई हैं?
    solution: 'चरण 1: राम में एक, कमल में शून्य। चरण 2: राजा में दो।'
    mistakes:
      राम: ukh8_gin
      कमल: ukh8_gin
