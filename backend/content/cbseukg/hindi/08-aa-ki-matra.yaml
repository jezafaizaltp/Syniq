# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 8
title: आ की मात्रा (ा)
tips:
  kgh_aa: "आ की मात्रा एक खड़ी लकीर (ा) है। हर शब्द में वह लकीर ढूँढो।"
  kgh_aa_count: "'नाना' में हर खड़ी लकीर (ा) पर उँगली रखकर गिनो।"
  kgh_bina_matra: "बिना मात्रा वाले शब्द में अक्षरों पर कोई लकीर या निशान नहीं लगता। हर शब्द को ध्यान से देखो।"

concepts:
- code: ukgh.aamatra
  title: आ की मात्रा (ा)
  notes: |
    आ की मात्रा (ा) लगाकर शब्द पढ़ना: राजा, नाना, माला, आम, ताला।
  explanations:
    text: 'अक्षर के बाद यह छोटी खड़ी लकीर (ा) लगे तो ''आ'' की आवाज़ आती है: म + ा = मा, र + ा = रा। राजा, माला, ताला।'
    visual: 'चित्र बनाओ: एक माला और एक ताला, और नीचे शब्द लिखो, मात्रा को रंग से दिखाओ।'
    step_by_step: 1. अक्षर बोलो। 2. मात्रा देखो। 3. 'आ' जोड़कर बोलो।
    real_world: 'अपने परिवार में ''आ'' की मात्रा वाले नाम खोजो: नाना, मामा।'
  picture:
    kind: flow
    steps:
    - म
    - ा
    - मा
    - माला
    alt: म में आ की मात्रा लगाकर मा बनता है, फिर माला।
  items:
  - prompt: म + ा = ?
    options:
    - मा
    - मि
    - मु
    answer: मा
    difficulty: 1
    hints:
    - आ की आवाज़।
    - माँ जैसा।
    solution: म + ा = मा।
    mistakes:
      मि: ukgh_read
  - prompt: किस शब्द में आ की मात्रा है?
    options:
    - माला
    - घर
    - जल
    answer: माला
    difficulty: 1
    hints:
    - खड़ी लकीर (ा) देखो।
    - मा-ला।
    solution: माला में आ की मात्रा है।
    mistakes: {"घर": "kgh_aa", "जल": "kgh_aa"}
  - prompt: 'पढ़ो: ताला'
    options:
    - 🔒
    - 📿
    - 👑
    answer: 🔒
    difficulty: 1
    hints:
    - ता + ला।
    - दरवाज़े पर लगता है।
    solution: ताला यानी 🔒।
    mistakes: {"📿": "ukgh_read", "👑": "ukgh_read"}
  - prompt: 'पढ़ो: राजा'
    options:
    - 👑
    - 🔒
    - 🍎
    answer: 👑
    difficulty: 2
    hints:
    - रा + जा।
    - मुकुट पहनता है।
    solution: राजा यानी 👑।
    mistakes: {"🔒": "ukgh_read", "🍎": "ukgh_read"}
  - prompt: '''नाना'' में कितनी बार आ की मात्रा लगी है?'
    options:
    - दो
    - एक
    - तीन
    answer: दो
    difficulty: 2
    hints:
    - ना + ना।
    - गिनो।
    solution: दो बार।
    mistakes: {"एक": "kgh_aa_count", "तीन": "kgh_aa_count"}
  - prompt: बिना मात्रा वाला शब्द कौन-सा है?
    options:
    - कमल
    - आम
    - माला
    answer: कमल
    difficulty: 2
    hints:
    - कोई खड़ी लकीर नहीं।
    - क-म-ल।
    solution: कमल में कोई मात्रा नहीं।
    mistakes: {"आम": "kgh_bina_matra", "माला": "kgh_bina_matra"}
