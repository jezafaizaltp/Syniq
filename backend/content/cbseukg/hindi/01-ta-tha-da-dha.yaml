# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 1
title: ट, ठ, ड, ढ
tips:
  ukgh_sound: शब्द धीरे से बोलो। पहली आवाज़ सुनो।
  ukgh_read: हर अक्षर पर उँगली रखकर धीरे-धीरे पढ़ो।
concepts:
- code: ukgh.ta
  title: ट, ठ, ड, ढ
  notes: |
    हिंदी व्यंजन ट, ठ, ड, ढ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: ट, ठ, ड, ढ। ट से टमाटर 🍅, ठ से ठेला 🛒, ड से डमरू 🪘, ढ से ढोल 🥁, ट से टोपी 🧢, ड से डिब्बा 📦।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - ट
      - ठ
      - ड
    - title: शब्द
      points:
      - टमाटर 🍅
      - ठेला 🛒
      - डमरू 🪘
    alt: ट से टमाटर 🍅, ठ से ठेला 🛒, ड से डमरू 🪘।
  items:
  - prompt: '''ट'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🍅 टमाटर
    - 🥁 ढोल
    - 🦆 बत्तख
    answer: 🍅 टमाटर
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ट' होनी चाहिए।
    solution: टमाटर 'ट' से शुरू होता है।
    mistakes:
      🥁 ढोल: ukgh_sound
  - prompt: '''ठ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🛒 ठेला
    - 🍅 टमाटर
    - 🥁 ढोल
    answer: 🛒 ठेला
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ठ' होनी चाहिए।
    solution: ठेला 'ठ' से शुरू होता है।
    mistakes:
      🍅 टमाटर: ukgh_sound
  - prompt: '''ड'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🪘 डमरू
    - 🛒 ठेला
    - 🍅 टमाटर
    answer: 🪘 डमरू
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ड' होनी चाहिए।
    solution: डमरू 'ड' से शुरू होता है।
    mistakes:
      🛒 ठेला: ukgh_sound
  - prompt: '''ढ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🥁 ढोल
    - 🪘 डमरू
    - 🛒 ठेला
    answer: 🥁 ढोल
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ढ' होनी चाहिए।
    solution: ढोल 'ढ' से शुरू होता है।
    mistakes:
      🪘 डमरू: ukgh_sound
  - prompt: '''ट'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🧢 टोपी
    - 🥁 ढोल
    - 🪘 डमरू
    answer: 🧢 टोपी
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ट' होनी चाहिए।
    solution: टोपी 'ट' से शुरू होता है।
    mistakes:
      🥁 ढोल: ukgh_sound
  - prompt: '''ड'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 📦 डिब्बा
    - 🧢 टोपी
    - 🛒 ठेला
    answer: 📦 डिब्बा
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ड' होनी चाहिए।
    solution: डिब्बा 'ड' से शुरू होता है।
    mistakes:
      🧢 टोपी: ukgh_sound
