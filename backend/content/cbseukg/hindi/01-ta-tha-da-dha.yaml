# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 1
title: ट, ठ, ड, ढ
tips:
  ukgh_sound: शब्द धीरे से बोलो। पहली आवाज़ सुनो।
  ukgh_read: हर अक्षर पर उँगली रखकर धीरे-धीरे पढ़ो।
  ukh1_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  ukh1_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: ukgh.ta
  title: ट, ठ, ड, ढ
  notes: |
    हिंदी व्यंजन ट, ठ, ड, ढ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: ट, ठ, ड, ढ। ट से टमाटर 🍅, ठ से ठेला 🛒, ड से डमरू 🪘, ढ से ढोल 🥁, ट से टोपी 🧢, ड से डिब्बा 📦।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - ट
      - ठ
      - ड
    - title: शब्द
      points:
      - टमाटर 🍅
      - ठेला 🛒
      - डमरू 🪘
    alt: ट से टमाटर 🍅, ठ से ठेला 🛒, ड से डमरू 🪘।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - ट
    - ठ
    - ड
    - ढ
    items:
    - label: 🍅 टमाटर
      bin: ट
      clue: 'ट-माटर: पहली आवाज़?'
      why: टमाटर ट से।
    - label: 🧊 ठंडा
      bin: ठ
      clue: 'ठं-डा: पहली आवाज़?'
      why: ठंडा ठ से।
    - label: 🥁 डमरू
      bin: ड
      clue: 'ड-मरू: पहली आवाज़?'
      why: डमरू ड से।
    - label: 🪘 ढोल
      bin: ढ
      clue: 'ढो-ल: भारी आवाज़?'
      why: ढोल ढ से।
    - label: 🧺 टोकरी
      bin: ट
      clue: 'टो-करी: पहली आवाज़?'
      why: टोकरी ट से।
  lesson:
    - teach: 'आज के अक्षर: ट, ठ। हर अक्षर की अपनी आवाज़ है: ट से 📺 टीवी; ठ से 🥶 ठंड।'
      check:
        prompt: '''ट'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 📺 टीवी
        - 🩺 डॉक्टर
        - 🥶 ठंड
        answer: 📺 टीवी
        why: 'टीवी बोलो: सबसे पहले ''ट'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: ट और ठ से शुरू होने वाले कुछ और शब्द। हर शब्द बोलो और पहली आवाज़ सुनो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - ट
            - ठ
          - title: शब्द
            points:
            - 🧺 टोकरी
            - ठोड़ी
          - title: एक और शब्द
            points:
            - 🍬 टॉफ़ी
            - ठप्पा
          alt: ट से टोकरी और टॉफ़ी। ठ से ठोड़ी और ठप्पा।
      - style: step_by_step
        teach: 'पहली आवाज़ सुनो। पहला: ''टोकरी'' शब्द धीरे-धीरे बोलो। दूसरा: सबसे पहली आवाज़ पर रुक जाओ। तीसरा: उस आवाज़ को अकेले बोलो। चौथा: यह आवाज़ ''ट'' अक्षर की है।'
    - teach: 'और अक्षर: ड, ढ। ड से 🩺 डॉक्टर; ढ से 🫙 ढक्कन।'
      check:
        prompt: '''ढ'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🫙 ढक्कन
        - 🛞 टायर
        - 🌿 डाल
        answer: 🫙 ढक्कन
        why: 'ढक्कन बोलो: सबसे पहले ''ढ'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: ड और ढ से शुरू होने वाले कुछ और शब्द। हर चित्र देखो और उसकी पहली आवाज़ बोलो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - ड
            - ढ
          - title: शब्द
            points:
            - 📮 डाकिया
            - ढेर
          - title: एक और शब्द
            points:
            - डंडा
            - ढलान
          alt: ड से डाकिया और डंडा। ढ से ढेर और ढलान।
      - style: real_world
        teach: घर या स्कूल में ऐसी चीज़ें ढूँढो जिनके नाम ड और ढ से शुरू होते हैं, और हर नाम ज़ोर से बोलकर किसी बड़े को सुनाओ।
    - teach: ट और ठ, ड और ढ जोड़ी में मिलते-जुलते दिखते हैं। ठ का नीचे का हिस्सा बंद गोले जैसा है, ट का घुमाव खुला है। ढ के नीचे एक और छोटा घुमाव जुड़ा है, ड में नहीं।
      check:
        prompt: किस अक्षर का नीचे का हिस्सा बंद गोले जैसा है?
        options:
        - ठ
        - ट
        - ड
        answer: ठ
        why: ठ बंद गोले जैसा है, ट का घुमाव खुला है।
      ways:
      - style: visual
        teach: जोड़ी वाला अक्षर 'ठ' कैसे लिखते हैं, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - ऊपर सीधी रेखा
          - नीचे गोल मोड़
          - मोड़ को पूरा बंद करो
          alt: '''ठ'' लिखने के लिए ऊपर सीधी रेखा खींचो, नीचे गोल मोड़ बनाओ और मोड़ को पूरा बंद कर दो।'
      - style: step_by_step
        teach: 'जोड़ी वाले अक्षर पहचानो। पहला: स्लेट पर ''ट'' लिखो। दूसरा: उसके पास ''ठ'' लिखो। तीसरा: दोनों के नीचे वाले हिस्से पर उँगली फेरो। चौथा: देखो, किसका मोड़ खुला है और किसका बंद।'
