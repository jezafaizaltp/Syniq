    - पहली आवाज़ 'न' होनी चाहिए।
    solution: नल 'न' से शुरू होता है।
    mistakes:
      🏹 धनुष: ukgh_sound
  - prompt: '''त'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🦜 तोता
    - 🚰 नल
