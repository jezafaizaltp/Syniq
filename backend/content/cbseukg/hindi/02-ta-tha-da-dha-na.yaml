    - 🌾 धान
    - 🍽️ थाली
    answer: 🪔 दीया
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'द' होनी चाहिए।
    solution: दीया 'द' से शुरू होता है।
    mistakes:
