    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'त' होनी चाहिए।
    solution: तोता 'त' से शुरू होता है।
    mistakes:
      🚰 नल: ukgh_sound
  - prompt: किस शब्द की पहली आवाज़ 'त' है?
    options:
    - 🦜 तोता
