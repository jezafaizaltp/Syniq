# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 2
title: त, थ, द, ध, न
concepts:
- code: ukgh.ta2
  title: त, थ, द, ध, न
  notes: |
    हिंदी व्यंजन त, थ, द, ध, न: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: त, थ, द, ध, न। त से तितली 🦋, थ से थाली 🍽️, द से दीया 🪔, ध से धनुष 🏹, न से नल 🚰, त से तोता 🦜।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - त
      - थ
      - द
    - title: शब्द
      points:
      - तितली 🦋
      - थाली 🍽️
      - दीया 🪔
    alt: त से तितली 🦋, थ से थाली 🍽️, द से दीया 🪔।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - त
    - थ
    - द
    - ध
    - न
    items:
    - label: 🦋 तितली
      bin: त
      clue: 'ति-तली: पहली आवाज़?'
      why: तितली त से।
    - label: 🍽️ थाली
      bin: थ
      clue: 'था-ली: हवा वाली आवाज़?'
      why: थाली थ से।
    - label: 🪔 दीया
      bin: द
      clue: 'दी-या: पहली आवाज़?'
      why: दीया द से।
    - label: 🏹 धनुष
      bin: ध
      clue: 'ध-नुष: भारी आवाज़?'
      why: धनुष ध से।
    - label: 🚰 नल
      bin: न
      clue: 'न-ल: नाक से आवाज़?'
      why: नल न से।
  items:
  - prompt: '''त'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🦋 तितली
    - 🍽️ थाली
    - 🌾 धान
    answer: 🦋 तितली
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'त' होनी चाहिए।
    solution: तितली 'त' से शुरू होता है।
    mistakes:
      🍽️ थाली: ukgh_sound
  - prompt: '''थ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🍽️ थाली
    - 🦋 तितली
    - 🪔 दीया
    answer: 🍽️ थाली
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'थ' होनी चाहिए।
    solution: थाली 'थ' से शुरू होता है।
    mistakes:
      🦋 तितली: ukgh_sound
  - prompt: '''द'' से कौन-सा शब्द शुरू होता है?'
    options:
