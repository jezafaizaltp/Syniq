# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 7
title: दो अक्षर वाले शब्द
tips:
  ukh7_jod: हर अक्षर अलग-अलग बोलो, फिर उन्हें जल्दी-जल्दी जोड़कर बोलो।
  ukh7_gin: शब्द पर उँगली रखो और हर अक्षर पर एक बार ताली बजाओ।
  ukh7_padho: शब्द को अक्षर-अक्षर पढ़ो, फिर सोचो कि वह क्या चीज़ है।
concepts:
- code: ukgh.shabd2
  title: दो अक्षर वाले शब्द
  notes: |
    बिना मात्रा के दो और तीन अक्षर वाले शब्द पढ़ना: घर, जल, फल, नल, कमल, बतख।
  explanations:
    text: 'अब अक्षर जोड़कर शब्द पढ़ते हैं: घ + र = घर, ज + ल = जल, फ + ल = फल, न + ल = नल।'
    visual: 'चित्र बनाओ: एक घर, पानी (जल), एक फल और एक नल, और नीचे शब्द लिखो।'
    step_by_step: 1. पहला अक्षर बोलो। 2. दूसरा अक्षर बोलो। 3. दोनों मिलाकर शब्द पढ़ो।
    real_world: घर में 'नल' और 'जल' शब्द ढूँढो।
  picture:
    kind: flow
    steps:
    - घ
    - र
    - घर
    alt: घ और र मिलकर घर बनता है।
  activity:
    type: sort
    prompt: शब्द में कितने अक्षर हैं?
    bins:
    - दो अक्षर
    - तीन अक्षर
    items:
    - label: 🏠 घर
      bin: दो अक्षर
      clue: 'घ-र: कितने?'
      why: 'घ, र: दो।'
    - label: 💧 जल
      bin: दो अक्षर
      clue: 'ज-ल: कितने?'
      why: दो अक्षर।
    - label: 🍎 फल
      bin: दो अक्षर
      clue: 'फ-ल: कितने?'
      why: दो अक्षर।
    - label: 🪷 कमल
      bin: तीन अक्षर
      clue: 'क-म-ल: कितने?'
      why: 'क, म, ल: तीन।'
    - label: 🦆 बतख
      bin: तीन अक्षर
      clue: 'ब-त-ख: कितने?'
      why: तीन अक्षर।
  lesson:
    - teach: दो अक्षर जोड़ो तो शब्द बनता है। ब + स = बस, घ + र = घर, न + ल = नल। पहले हर अक्षर बोलो, फिर जोड़ो।
      picture:
        kind: flow
        steps:
        - ब
        - स
        - बस
        alt: ब और स जोड़कर बस।
      check:
        prompt: क + प = ?
        options:
        - कप
        - पक
        - कम
        answer: कप
        why: 'पहले क, फिर प: कप।'
    - teach: 'तीन अक्षर भी जुड़ते हैं: क + म + ल = कमल, ब + त + ख = बतख, म + ट + र = मटर। धीरे से जोड़ो।'
      check:
        prompt: म + ट + र = ?
        options:
        - मटर
        - मगर
        - टमर
        answer: मटर
        why: म, ट, र जोड़कर मटर।
    - teach: शब्द में अक्षर गिनने के लिए हर अक्षर पर एक ताली बजाओ। 'घर' में दो ताली, 'कमल' में तीन ताली।
      check:
        prompt: '''बतख'' में कितने अक्षर हैं?'
        options:
        - '3'
        - '2'
        - '4'
        answer: '3'
        why: 'ब-त-ख: तीन ताली।'
  items:
  - prompt: घ + र = ?
    options:
    - 🏠 घर
    - 🍎 फल
    - 🚰 नल
    answer: 🏠 घर
    difficulty: 1
    hints:
    - दोनों अक्षर मिलाओ।
    - हम इसमें रहते हैं।
    solution: घ + र = घर।
    mistakes:
      🚰 नल: ukgh_read
  - prompt: ज + ल = ?
    options:
    - 💧 जल
    - 🏠 घर
    - 🍎 फल
    answer: 💧 जल
    difficulty: 1
    hints:
    - दोनों अक्षर मिलाओ।
    - पानी।
    solution: ज + ल = जल।
    mistakes: {"🏠 घर": "ukgh_read", "🍎 फल": "ukgh_read"}
  - prompt: 'पढ़ो: नल'
    options:
    - 🚰
    - 🏠
    - 🍎
    answer: 🚰
    difficulty: 1
    hints:
    - न + ल।
    - पानी इससे आता है।
    solution: नल से पानी आता है।
    mistakes: {"🏠": "ukgh_read", "🍎": "ukgh_read"}
  - prompt: 'पढ़ो: फल'
    options:
    - 🍎
    - 🚰
    - 🏠
    answer: 🍎
    difficulty: 2
    hints:
    - फ + ल।
    - खाने की चीज़।
    solution: फल यानी 🍎।
    mistakes: {"🚰": "ukgh_read", "🏠": "ukgh_read"}
  - prompt: क + म + ल = ?
    options:
    - 🪷 कमल
    - 🦆 बतख
    - 🏠 घर
    answer: 🪷 कमल
    difficulty: 2
    hints:
    - तीनों मिलाओ।
    - तालाब का फूल।
    solution: क + म + ल = कमल।
    mistakes: {"🦆 बतख": "ukgh_read", "🏠 घर": "ukgh_read"}
  - prompt: '''घर'' में कितने अक्षर हैं?'
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - घ, र।
    - गिनो।
    solution: घर में 2 अक्षर हैं।
    mistakes:
      '3': ukgh_read
  - prompt: ब + स = ?
    options:
    - 🚌 बस
    - 🏠 घर
    - 🍎 फल
    answer: 🚌 बस
    difficulty: 1
    hints:
    - पहला अक्षर बोलो, फिर दूसरा।
    - जल्दी-जल्दी जोड़ो।
    solution: 'चरण 1: ब, स। चरण 2: बस।'
    mistakes:
      🏠 घर: ukh7_jod
      🍎 फल: ukh7_jod
  - prompt: 'पढ़ो: कप'
    options:
    - ☕
    - 🪷
    - 🚰
    answer: ☕
    difficulty: 1
    hints:
    - क ... प।
    - इसमें चाय पीते हैं।
    solution: 'चरण 1: क-प। चरण 2: कप।'
    mistakes:
      🪷: ukh7_padho
      🚰: ukh7_padho
  - prompt: 'पढ़ो: मटर'
    options:
    - 🫛
    - 🦆
    - 🏠
    answer: 🫛
    difficulty: 2
    hints:
    - म ... ट ... र।
    - हरी फली के अंदर गोल दाने।
    solution: 'चरण 1: म-ट-र। चरण 2: मटर।'
    mistakes:
      🦆: ukh7_padho
      🏠: ukh7_padho
  - prompt: '''नल'' में कितने अक्षर हैं?'
    options:
    - '2'
    - '3'
    - '1'
    answer: '2'
    difficulty: 1
    hints:
    - हर अक्षर पर ताली बजाओ।
    - न ... ल।
    solution: 'चरण 1: न, ल। चरण 2: दो अक्षर।'
    mistakes:
      '3': ukh7_gin
      '1': ukh7_gin
  - prompt: ब + त + ख = ?
    options:
    - 🦆 बतख
    - 🫛 मटर
    - 🪷 कमल
    answer: 🦆 बतख
    difficulty: 2
    hints:
    - तीनों अक्षर बारी-बारी बोलो।
    - अब जोड़ो।
    solution: 'चरण 1: ब, त, ख। चरण 2: बतख।'
    mistakes:
      🫛 मटर: ukh7_jod
      🪷 कमल: ukh7_jod
  - prompt: '''जल'' का क्रम उलट दो: ल + ज = ?'
    options:
    - लज
    - जल
    - लल
    answer: लज
    difficulty: 3
    hints:
    - अब पहले कौन-सा अक्षर आएगा?
    - जैसा लिखा है, वैसा जोड़ो।
    solution: 'चरण 1: पहले ल, फिर ज। चरण 2: लज।'
    mistakes:
      जल: ukh7_jod
      लल: ukh7_jod
  - prompt: किस शब्द में तीन अक्षर हैं?
    options:
    - कमल
    - घर
    - जल
    answer: कमल
    difficulty: 2
    hints:
    - हर शब्द पर ताली बजाकर गिनो।
    - किसमें सबसे ज़्यादा ताली?
    solution: 'चरण 1: घर 2, जल 2। चरण 2: क-म-ल 3।'
    mistakes:
      घर: ukh7_gin
      जल: ukh7_gin
  - prompt: '''कमल'' का आखिरी अक्षर हटा दो। क्या बचेगा?'
    options:
    - कम
    - कल
    - मक
    answer: कम
    difficulty: 3
    hints:
    - 'कमल के अक्षर: एक, दो, तीन।'
    - आखिरी हटाओ, बाकी पढ़ो।
    solution: 'चरण 1: क-म-ल से ल हटाया। चरण 2: कम।'
    mistakes:
      कल: ukh7_gin
      मक: ukh7_gin
  - prompt: 'पढ़ो: घर। यह क्या है?'
    options:
    - जहाँ हम रहते हैं
    - जो हम खाते हैं
    - जिसमें पानी बहता है
    answer: जहाँ हम रहते हैं
    difficulty: 2
    hints:
    - घ ... र।
    - हमारा परिवार कहाँ रहता है?
    solution: 'चरण 1: घ-र। चरण 2: घर में हम रहते हैं।'
    mistakes:
      जो हम खाते हैं: ukh7_padho
      जिसमें पानी बहता है: ukh7_padho
