# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 7
title: दो अक्षर वाले शब्द
concepts:
- code: ukgh.shabd2
  title: दो अक्षर वाले शब्द
  notes: |
    बिना मात्रा के दो और तीन अक्षर वाले शब्द पढ़ना: घर, जल, फल, नल, कमल, बतख।
  explanations:
    text: 'अब अक्षर जोड़कर शब्द पढ़ते हैं: घ + र = घर, ज + ल = जल, फ + ल = फल, न + ल = नल।'
    visual: 'चित्र बनाओ: एक घर, पानी (जल), एक फल और एक नल, और नीचे शब्द लिखो।'
    step_by_step: 1. पहला अक्षर बोलो। 2. दूसरा अक्षर बोलो। 3. दोनों मिलाकर शब्द पढ़ो।
    real_world: घर में 'नल' और 'जल' शब्द ढूँढो।
  picture:
    kind: flow
    steps:
    - घ
    - र
    - घर
    alt: घ और र मिलकर घर बनता है।
  activity:
    type: sort
    prompt: शब्द में कितने अक्षर हैं?
    bins:
    - दो अक्षर
    - तीन अक्षर
    items:
    - label: 🏠 घर
      bin: दो अक्षर
      clue: 'घ-र: कितने?'
      why: 'घ, र: दो।'
    - label: 💧 जल
      bin: दो अक्षर
      clue: 'ज-ल: कितने?'
      why: दो अक्षर।
    - label: 🍎 फल
      bin: दो अक्षर
      clue: 'फ-ल: कितने?'
      why: दो अक्षर।
    - label: 🪷 कमल
      bin: तीन अक्षर
      clue: 'क-म-ल: कितने?'
      why: 'क, म, ल: तीन।'
    - label: 🦆 बतख
      bin: तीन अक्षर
      clue: 'ब-त-ख: कितने?'
      why: तीन अक्षर।
  items:
  - prompt: घ + र = ?
    options:
    - 🏠 घर
    - 🍎 फल
    - 🚰 नल
    answer: 🏠 घर
    difficulty: 1
    hints:
    - दोनों अक्षर मिलाओ।
    - हम इसमें रहते हैं।
    solution: घ + र = घर।
    mistakes:
      🚰 नल: ukgh_read
  - prompt: ज + ल = ?
    options:
    - 💧 जल
    - 🏠 घर
    - 🍎 फल
    answer: 💧 जल
    difficulty: 1
    hints:
    - दोनों अक्षर मिलाओ।
    - पानी।
    solution: ज + ल = जल।
    mistakes: {"🏠 घर": "ukgh_read", "🍎 फल": "ukgh_read"}
  - prompt: 'पढ़ो: नल'
    options:
    - 🚰
    - 🏠
    - 🍎
    answer: 🚰
    difficulty: 1
    hints:
    - न + ल।
    - पानी इससे आता है।
    solution: नल से पानी आता है।
    mistakes: {"🏠": "ukgh_read", "🍎": "ukgh_read"}
  - prompt: 'पढ़ो: फल'
    options:
    - 🍎
    - 🚰
    - 🏠
    answer: 🍎
    difficulty: 2
    hints:
    - फ + ल।
    - खाने की चीज़।
    solution: फल यानी 🍎।
    mistakes: {"🚰": "ukgh_read", "🏠": "ukgh_read"}
  - prompt: क + म + ल = ?
    options:
    - 🪷 कमल
    - 🦆 बतख
    - 🏠 घर
    answer: 🪷 कमल
    difficulty: 2
    hints:
    - तीनों मिलाओ।
    - तालाब का फूल।
    solution: क + म + ल = कमल।
    mistakes: {"🦆 बतख": "ukgh_read", "🏠 घर": "ukgh_read"}
  - prompt: '''घर'' में कितने अक्षर हैं?'
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - घ, र।
    - गिनो।
    solution: घर में 2 अक्षर हैं।
    mistakes:
      '3': ukgh_read
