# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 4
title: य, र, ल, व
concepts:
- code: ukgh.ya
  title: य, र, ल, व
  notes: |
    हिंदी व्यंजन य, र, ल, व: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: य, र, ल, व। य से यान 🚀, र से रथ 🛺, ल से लड्डू 🟠, व से वन 🌲, र से रस्सी 🪢, ल से लालटेन 🏮।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - य
      - र
      - ल
    - title: शब्द
      points:
      - यान 🚀
      - रथ 🛺
      - लड्डू 🟠
    alt: य से यान 🚀, र से रथ 🛺, ल से लड्डू 🟠।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - य
    - र
    - ल
    - व
    items:
    - label: 🧘 योग
      bin: य
      clue: 'यो-ग: पहली आवाज़?'
      why: योग य से।
    - label: 🚂 रेल
      bin: र
      clue: 'रे-ल: पहली आवाज़?'
      why: रेल र से।
    - label: 🟠 लड्डू
      bin: ल
      clue: 'ल-ड्डू: पहली आवाज़?'
      why: लड्डू ल से।
    - label: 🌳 वन
      bin: व
      clue: 'व-न: पहली आवाज़?'
      why: वन व से।
    - label: 🌈 रंग
      bin: र
      clue: 'रं-ग: पहली आवाज़?'
      why: रंग र से।
  items:
  - prompt: '''य'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🚀 यान
    - 🪢 रस्सी
    - 🏮 लालटेन
    answer: 🚀 यान
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'य' होनी चाहिए।
    solution: यान 'य' से शुरू होता है।
    mistakes:
      🪢 रस्सी: ukgh_sound
  - prompt: '''र'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🛺 रथ
    - 🚀 यान
    - 🏮 लालटेन
    answer: 🛺 रथ
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'र' होनी चाहिए।
    solution: रथ 'र' से शुरू होता है।
    mistakes:
      🚀 यान: ukgh_sound
  - prompt: '''ल'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🟠 लड्डू
    - 🛺 रथ
    - 🚀 यान
    answer: 🟠 लड्डू
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ल' होनी चाहिए।
    solution: लड्डू 'ल' से शुरू होता है।
    mistakes:
      🛺 रथ: ukgh_sound
  - prompt: '''व'' से कौन-सा शब्द शुरू होता है?'
    options:
