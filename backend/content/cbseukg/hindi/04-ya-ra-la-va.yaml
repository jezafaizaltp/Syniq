    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: वन बोलो। चरण 2: पहली आवाज़ ''व'' है।'
    mistakes:
      🔴 लाल: ukh4_first
      🧘 योग: ukh4_first
  - prompt: '''🧘 योग'' किस अक्षर से शुरू होता है?'
    options:
    - य
    - ल
    - व
    answer: य
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: योग की पहली आवाज़। चरण 2: ''य''।'
    mistakes:
      ल: ukh4_look
      व: ukh4_look
  - prompt: '''🌈 रंग'' किस अक्षर से शुरू होता है?'
    options:
