# CBSE UKG Hindi (letters and first words) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbseukg-hin
chapter: 4
title: य, र, ल, व
tips:
  ukh4_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  ukh4_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: ukgh.ya
  title: य, र, ल, व
  notes: |
    हिंदी व्यंजन य, र, ल, व: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: य, र, ल, व। य से यान 🚀, र से रथ 🛺, ल से लड्डू 🟠, व से वन 🌲, र से रस्सी 🪢, ल से लालटेन 🏮।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - य
      - र
      - ल
    - title: शब्द
      points:
      - यान 🚀
      - रथ 🛺
      - लड्डू 🟠
    alt: य से यान 🚀, र से रथ 🛺, ल से लड्डू 🟠।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - य
    - र
    - ल
    - व
    items:
    - label: 🧘 योग
      bin: य
      clue: 'यो-ग: पहली आवाज़?'
      why: योग य से।
    - label: 🚂 रेल
      bin: र
      clue: 'रे-ल: पहली आवाज़?'
      why: रेल र से।
    - label: 🟠 लड्डू
      bin: ल
      clue: 'ल-ड्डू: पहली आवाज़?'
      why: लड्डू ल से।
    - label: 🌳 वन
      bin: व
      clue: 'व-न: पहली आवाज़?'
      why: वन व से।
    - label: 🌈 रंग
      bin: र
      clue: 'रं-ग: पहली आवाज़?'
      why: रंग र से।
  lesson:
    - teach: 'आज के अक्षर: य, र। हर अक्षर की अपनी आवाज़ है: य से 🧘 योग; र से 🌈 रंग।'
      check:
        prompt: '''य'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🧘 योग
        - 🪵 लकड़ी
        - 🌈 रंग
        answer: 🧘 योग
        why: 'योग बोलो: सबसे पहले ''य'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: य और र से शुरू होने वाले कुछ और शब्द। हर शब्द बोलो और पहली आवाज़ सुनो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - य
            - र
          - title: शब्द
            points:
            - यात्रा
            - 🚂 रेल
          - title: एक और शब्द
            points:
            - याद
            - रस्सी
          alt: य से यात्रा और याद। र से रेल और रस्सी।
      - style: step_by_step
        teach: 'पहली आवाज़ सुनो। पहला: ''यात्रा'' शब्द धीरे-धीरे बोलो। दूसरा: सबसे पहली आवाज़ पर रुक जाओ। तीसरा: उस आवाज़ को अकेले बोलो। चौथा: यह आवाज़ ''य'' अक्षर की है।'
    - teach: 'और अक्षर: ल, व। ल से 🪵 लकड़ी; व से 🌧️ वर्षा।'
      check:
        prompt: '''व'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🌧️ वर्षा
        - 🚀 यान
        - 🔴 लाल
        answer: 🌧️ वर्षा
        why: 'वर्षा बोलो: सबसे पहले ''व'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: ल और व से शुरू होने वाले कुछ और शब्द। हर चित्र देखो और उसकी पहली आवाज़ बोलो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - ल
            - व
          - title: शब्द
            points:
            - लट्टू
            - ✈️ विमान
          - title: एक और शब्द
            points:
            - 🌊 लहर
            - वाहन
          alt: ल से लट्टू और लहर। व से विमान और वाहन।
      - style: real_world
        teach: घर या स्कूल में ऐसी चीज़ें ढूँढो जिनके नाम ल और व से शुरू होते हैं, और हर नाम ज़ोर से बोलकर किसी बड़े को सुनाओ।
    - teach: य, र, ल, व छोटे-छोटे अक्षर हैं। र की आवाज़ में जीभ हल्का काँपती है, ल में जीभ ऊपर के दाँतों के पीछे लगती है।
      check:
        prompt: किस आवाज़ में जीभ ऊपर के दाँतों के पीछे लगती है?
        options:
        - ल
        - य
        - व
        answer: ल
        why: 'ल बोलो: जीभ ऊपर लगती है।'
      ways:
      - style: visual
        teach: '''र'' बोलते समय जीभ क्या करती है, एक के बाद एक।'
        picture:
          kind: flow
          steps:
          - मुँह थोड़ा खोलो
          - जीभ की नोक ऊपर उठाओ
          - जीभ को हल्का काँपने दो
          alt: मुँह थोड़ा खोलो, जीभ की नोक ऊपर उठाओ, और 'र' बोलते समय जीभ को हल्का काँपने दो।
      - style: step_by_step
        teach: 'जीभ महसूस करो। पहला: ''र'' धीरे-धीरे बोलो। दूसरा: जीभ की नोक पर ध्यान दो। तीसरा: अब ''ल'' बोलो। चौथा: देखो, ''ल'' में जीभ ऊपर टिकी रहती है और बगल से हवा निकलती है।'
  items:
  - prompt: '''य'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🚀 यान
    - 🪢 रस्सी
    - 🏮 लालटेन
    answer: 🚀 यान
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'य' होनी चाहिए।
    solution: यान 'य' से शुरू होता है।
    mistakes:
      🪢 रस्सी: ukgh_sound
  - prompt: '''र'' से कौन-सा शब्द शुरू होता है?'
