    answer: 🏮 लालटेन
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ल' होनी चाहिए।
    solution: लालटेन 'ल' से शुरू होता है।
    mistakes:
      🪢 रस्सी: ukgh_sound
  - prompt: किस शब्द की पहली आवाज़ 'य' है?
    options:
    - 🚀 यान
    - 🔴 लाल
    - 🌧️ वर्षा
    answer: 🚀 यान
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: यान बोलो। चरण 2: पहली आवाज़ ''य'' है।'
    mistakes:
      🔴 लाल: ukh4_first
      🌧️ वर्षा: ukh4_first
