    - 🟠 लड्डू
    - 🛺 रथ
    answer: 🌲 वन
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'व' होनी चाहिए।
    solution: वन 'व' से शुरू होता है।
    mistakes:
      🟠 लड्डू: ukgh_sound
  - prompt: '''र'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🪢 रस्सी
    - 🌲 वन
    - 🚀 यान
    answer: 🪢 रस्सी
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'र' होनी चाहिए।
    solution: रस्सी 'र' से शुरू होता है।
    mistakes:
      🌲 वन: ukgh_sound
  - prompt: '''ल'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🏮 लालटेन
    - 🪢 रस्सी
    - 🌲 वन
    answer: 🏮 लालटेन
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ल' होनी चाहिए।
    solution: लालटेन 'ल' से शुरू होता है।
    mistakes:
      🪢 रस्सी: ukgh_sound
