# CBSE Class 10 Social Science (NCERT), Economics: Understanding Economic Development, chapter 4.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 21
title: Globalisation and the Indian Economy
tips:
  c10ss_liberalisation: Liberalisation removes barriers like import taxes; it doesn't add them.
  s10_1991: "India's big reforms came after a foreign-exchange crisis in the early 1990s."
  s10_cargill: "Cargill took over Parakh. Was that a joint venture or a purchase?"
  s10_fair_globalisation: "Fair means everyone gets a share of the gains."
  s10_flexible: "'Flexible' here is flexible for the employer."
  s10_govt_fair: "Removing labour laws hurts workers. What would protect them?"
  s10_indian_mnc: "Which of these operates in many countries?"
  s10_mnc: "'Multi-national' means many nations."
  s10_sez: "SEZs offer facilities and tax breaks. Who are they trying to attract?"
  s10_small_producers: "Cheap imports compete with local makers. Who suffers most?"
  s10_well_off: "Better and cheaper branded goods reach those who can afford them."
  s10_wto: "WHO is about health. Which organisation deals with trade?"
  c10ss21_mnc_ways: "MNCs spread in several ways: on their own, with a partner, by buying a firm, or by placing orders. Did this MNC work alongside an Indian company or take it over?"
  c10ss21_trade_link: 'Foreign trade connects markets: buyers get more choice and producers compete with sellers from other countries.'
  c10ss21_tech: "Think about what lets a company in one country manage design and work done in another country instantly."
  c10ss21_barrier: A trade barrier is a restriction like a tax on imports or a limit on how much can come in.
  c10ss21_winners: "Globalisation helped some groups and hurt others. Did this group find new opportunities, or face cheaper competition and insecure jobs?"
concepts:
- code: cbse10ss.global.mnc
  title: MNCs, trade and globalisation
  notes: |
    A multinational corporation (MNC) owns or controls production in more than one country; it sets up
    factories where labour and resources are cheap, markets are close and government policies are favourable.
    MNCs invest (foreign investment) by setting up partnerships (joint production with local companies),
    buying local companies (Cargill bought Parakh Foods), or placing orders with small producers (garments,
    footwear, sports goods). Foreign trade connects markets: buyers get more choice and producers reach new
    markets. Globalisation is the rapid integration of countries through trade, investment, technology and
    movement of people. Enablers: technology (transport, IT, internet); liberalisation (removing barriers such
    as import taxes; India began in 1991). The World Trade Organisation (WTO) promotes free trade, though rich
    countries have kept barriers like farm subsidies. Special Economic Zones (SEZs) attract investment.
  explanations:
    text: 'Multinational companies produce in many countries to cut costs and reach markets. Together with foreign trade, cheap transport, the internet and the removal of trade barriers, they have tied the world''s economies together: globalisation. India opened up its economy in 1991.'
    visual: 'Draw a phone''s journey: designed in the USA, chips from Taiwan, assembled in India, sold worldwide. That''s an MNC spreading production across countries.'
    step_by_step: 'Step 1: Identify the MNC and where it produces. Step 2: Why there: cheap labour, resources, market, policy. Step 3: How: joint venture, buying a firm, or placing orders. Step 4: What enabled it: technology and liberalisation.'
    real_world: Many smartphones sold around the world are now assembled in factories near Chennai and Noida for global companies.
  picture:
    kind: flow
    steps:
    - 'Technology: cheap transport, internet'
    - '1991: India liberalises trade and investment'
    - MNCs invest and set up production
    - Trade grows; more choice for buyers
    - 'Countries become more connected: globalisation'
    alt: 'How globalisation happened: technology, liberalisation in 1991, MNC investment, growing trade and closer integration of countries.'
  activity:
    type: sort
    prompt: How did the MNC spread production?
    bins:
    - Joint production
    - Buying a local company
    - Placing orders with small producers
    items:
    - label: Cargill buys Parakh Foods
      bin: Buying a local company
      clue: Owner changes.
      why: Buying a local company.
    - label: A foreign firm and an Indian firm make cars together
      bin: Joint production
      clue: Partners share.
      why: Joint production.
    - label: A sports brand orders footballs from Jalandhar units
      bin: Placing orders with small producers
      clue: Small units make them.
      why: Placing orders.
    - label: Garment orders to small factories in Tiruppur
      bin: Placing orders with small producers
      clue: MNC sells under its brand.
      why: Placing orders.
  lesson:
    - teach: 'A multinational corporation (MNC) owns or controls production in more than one country. MNCs set up factories where they find cheap skilled labour, raw materials, markets and helpful government policies. They spread production by: building their own units, joint ventures with local firms, buying local firms (Cargill bought Parakh Foods), or placing orders with small producers (like Nike, Indian garment makers).'
      picture:
        kind: compare
        columns:
        - title: Ways MNCs spread
          points:
          - Own factory
          - Joint venture with local firm
          - Buy a local firm
          - Order from small producers
        - title: What attracts them
          points:
          - Cheap skilled labour
          - Raw materials
          - Big markets
          - Helpful policies
        alt: MNCs spread production by their own factories, joint ventures, buying local firms or ordering from small producers; they are attracted by cheap skilled labour, raw materials, big markets and helpful policies.
      check:
        prompt: Cargill buying Parakh Foods is…
        options:
        - Buying up a local company
        - A joint venture
        - Placing orders
        answer: Buying up a local company
        why: It took over Parakh.
    - teach: 'Foreign trade links markets in different countries: buyers get more choice, and producers face competition. Globalisation is the rapid integration of countries through trade, investment (foreign investment by MNCs), and the movement of people and technology. Better transport and IT (containers, internet) made it faster and cheaper.'
      check:
        prompt: What made globalisation faster?
        options:
        - Cheap transport and information technology
        - More wars
        - Higher import taxes
        answer: Cheap transport and information technology
        why: Goods and information move quickly.
    - teach: 'Trade barriers (taxes on imports) once protected Indian producers. In 1991 India began liberalisation: removing barriers to trade and investment. The WTO (World Trade Organisation) promotes free trade, though rich countries often keep their own barriers. SEZs (Special Economic Zones) offer good facilities and tax breaks to attract foreign companies.'
      check:
        prompt: Liberalisation means…
        options:
        - Removing barriers set by the government
        - Adding more taxes
        - Closing borders
        answer: Removing barriers set by the government
        why: It frees trade and investment.
  items:
  - prompt: What is a multinational corporation?
    options:
    - A company that owns or controls production in more than one country
    - A company with many workers in one city
    - A government department
    - A bank that lends abroad only
    answer: A company that owns or controls production in more than one country
    difficulty: 1
    hints:
    - Multi = many, national = countries.
    - Ford, Samsung.
    solution: An MNC controls production in more than one nation.
    mistakes: {"A company with many workers in one city": "s10_mnc"}
  - prompt: In which year did India begin major economic liberalisation?
    answer: '1991'
    check: '1991'
    difficulty: 1
    hints:
    - Early 1990s.
    - New Economic Policy.
    solution: India liberalised its economy in 1991.
    mistakes: {"1947": "s10_1991", "2001": "s10_1991"}
  - prompt: 'Cargill Foods buying Parakh Foods is an example of an MNC:'
    options:
    - Buying a local company
    - Placing orders with small producers
    - Setting up a joint venture
    - Leaving India
    answer: Buying a local company
    difficulty: 2
    hints:
    - Takeover.
    - Parakh was an Indian company.
    solution: Cargill acquired Parakh Foods, becoming a large producer of edible oil in India.
    mistakes: {"Setting up a joint venture": "s10_cargill"}
  - prompt: What is liberalisation?
    options:
    - Removing barriers or restrictions set by the government on trade and investment
    - Increasing import taxes
    - Banning foreign companies
    - Nationalising all industries
    answer: Removing barriers or restrictions set by the government on trade and investment
    difficulty: 2
    hints:
    - Liberal = free.
    - Fewer controls.
    solution: Liberalisation is removing government barriers on trade and investment.
    mistakes:
      Increasing import taxes: c10ss_liberalisation
  - prompt: Which organisation aims to liberalise international trade?
    options:
    - World Trade Organisation
    - UNICEF
    - World Health Organisation
    - UNESCO
    answer: World Trade Organisation
    difficulty: 1
    hints:
    - WTO.
    - Trade rules.
    solution: The WTO aims to liberalise international trade.
    mistakes: {"World Health Organisation": "s10_wto"}
  - prompt: What is the main purpose of Special Economic Zones (SEZs)?
    options:
    - To attract foreign companies by offering good facilities and tax breaks
    - To protect forests
    - To build villages
    - To stop exports
    answer: To attract foreign companies by offering good facilities and tax breaks
    difficulty: 2
    hints:
    - World-class facilities.
    - Investment.
    solution: SEZs offer infrastructure and tax benefits to attract investment.
    mistakes: {"To protect forests": "s10_sez"}
  - prompt: What is foreign investment?
    options:
    - Money spent by MNCs on land, buildings and machines in another country
    - Money kept at home
    - A tax on imports
    - Money given to the poor
    answer: Money spent by MNCs on land, buildings and machines in another country
    difficulty: 2
    hints:
    - Investment means spending on assets.
    - By a company from abroad.
    solution: Foreign investment is MNCs buying assets abroad hoping to earn profit.
    mistakes:
      A tax on imports: c10ss21_barrier
  - prompt: Ford Motors setting up a plant in Chennai with Mahindra and Mahindra was an example of…
    options:
    - A joint venture
    - A takeover
    - Small producer orders
    - A trade barrier
    answer: A joint venture
    difficulty: 2
    hints:
    - Two companies working together.
    - An Indian partner was involved.
    solution: 'Ford entered India by collaborating with Mahindra: a joint venture.'
    mistakes:
      A takeover: c10ss21_mnc_ways
  - prompt: What is a trade barrier?
    options:
    - A restriction such as a tax on imports
    - A wall at the border
    - A bridge for trucks
    - A bank loan
    answer: A restriction such as a tax on imports
    difficulty: 1
    hints:
    - It slows trade.
    - Set by the government.
    solution: Taxes on imports or quotas are trade barriers.
    mistakes:
      A wall at the border: c10ss_liberalisation
  - prompt: How does foreign trade help buyers?
    options:
    - They get more choice beyond goods made at home
    - They must buy only local goods
    - Prices always go up
    - It stops all imports
    answer: They get more choice beyond goods made at home
    difficulty: 1
    hints:
    - Goods come from other countries.
    - More options.
    solution: Imports widen buyers' choices.
    mistakes:
      It stops all imports: c10ss21_trade_link
  - prompt: Which technology helped MNCs coordinate production across countries?
    options:
    - Information and communication technology
    - Steam engines
    - Bullock carts
    - Telegraph only
    answer: Information and communication technology
    difficulty: 2
    hints:
    - Email, internet, video calls.
    - Instant information.
    solution: IT and telecom let companies manage work and design across the world.
    mistakes:
      Steam engines: c10ss21_tech
  - prompt: Why did MNCs choose China for production?
    options:
    - Low costs and a big market
    - No workers there
    - High taxes
    - No electricity
    answer: Low costs and a big market
    difficulty: 2
    hints:
    - What do MNCs look for?
    - Cheap production and buyers.
    solution: China offered low production costs and a huge market.
    mistakes:
      High taxes: c10ss21_mnc_ways
  - prompt: Why did rich countries push for the WTO's free trade rules?
    options:
    - To get access to markets in developing countries
    - To stop all trade
    - To help only poor farmers
    - To raise their own trade barriers
    answer: To get access to markets in developing countries
    difficulty: 3
    hints:
    - Developed countries wanted to sell more abroad.
    - But they kept some barriers themselves.
    solution: Rich countries wanted developing countries to open markets, while still protecting some of their own sectors.
    mistakes:
      To help only poor farmers: s10_wto
  - prompt: Which of these is a way an MNC can spread production without owning factories?
    options:
    - Placing orders with small local producers
    - Buying the local company
    - Building its own plant
    - Investing in land
    answer: Placing orders with small local producers
    difficulty: 2
    hints:
    - Garment and shoe brands do this.
    - They don't own the workshops.
    solution: MNCs order goods from small producers and sell under their brand.
    mistakes:
      Buying the local company: s10_cargill
  - prompt: In which year did India begin large-scale economic liberalisation?
    answer: '1991'
    check: '1991'
    difficulty: 1
    hints:
    - Early 1990s.
    - After a crisis.
    solution: India's major reforms began in 1991.
    mistakes:
      '1947': s10_1991
      '2005': s10_1991
- code: cbse10ss.global.impact
  title: Effects of globalisation and fair globalisation
  after:
  - cbse10ss.global.mnc
  notes: |
    Benefits: more choice and lower prices for well-off consumers; MNCs increased investment and jobs; top
    Indian companies like Tata Motors, Infosys, Ranbaxy and Asian Paints became MNCs themselves; services like
    IT and call centres grew. Costs: small producers (batteries, plastic toys, dairy, vegetable oil) faced stiff
    competition and many shut down; workers' jobs became insecure (flexible employment, long hours, no
    benefits). Fair globalisation means benefits for all: government should protect workers' rights, help
    small producers compete, use trade barriers when needed, and negotiate fairer WTO rules; people's
    movements also press for fairness.
  explanations:
    text: Globalisation brought better and cheaper products for many consumers and helped some Indian companies grow worldwide. But many small producers were wiped out by competition and workers lost job security. Fair globalisation means making sure its gains reach everyone, not just the well-off.
    visual: 'Draw a balance: on one side cheaper phones, new jobs in IT, Indian MNCs; on the other, closed small factories and temporary workers with no benefits.'
    step_by_step: 'Step 1: Who gained (consumers, big companies, skilled workers)? Step 2: Who lost (small producers, insecure workers)? Step 3: What can make it fair: labour laws, support for small producers, fair trade rules.'
    real_world: 'When cheap imported toys flooded the market, many small toy makers in India closed: a cost of globalisation for small producers.'
  picture:
    kind: compare
    columns:
    - title: Gains
      points:
      - More choice, lower prices
      - New jobs in services
      - Indian firms became MNCs
      - More investment
    - title: Costs
      points:
      - Small producers shut down
      - Insecure, temporary jobs
      - Long hours, few benefits
      - Gains unequally shared
    alt: Globalisation's gains (choice, jobs in services, Indian MNCs, investment) and costs (small producers closing, insecure jobs, unequal gains).
  activity:
    type: sort
    prompt: Who gained, and who lost?
    bins:
    - Gained
    - Lost
    items:
    - label: Well-off consumers with more choice
      bin: Gained
      clue: Cheaper, better goods.
      why: Gained.
    - label: Small battery makers facing imports
      bin: Lost
      clue: Competition from MNCs.
      why: Many shut down.
    - label: Infosys and Tata Motors
      bin: Gained
      clue: Became MNCs themselves.
      why: Gained.
    - label: Workers on flexible, insecure contracts
      bin: Lost
      clue: Long hours, no benefits.
      why: Lost security.
    - label: IT and call-centre workers
      bin: Gained
      clue: New jobs in services.
      why: Gained.
  lesson:
    - teach: Globalisation's effects are uneven. Well-off consumers gained better quality and lower prices. Some Indian companies (Tata Motors, Infosys, Ranbaxy) became MNCs themselves, and IT services created jobs. But small producers (batteries, toys, dairy) suffered from cheap imports, and many units shut.
      picture:
        kind: compare
        columns:
        - title: Gained
          points:
          - Well-off consumers
          - Big Indian companies
          - IT and service jobs
        - title: Lost out
          points:
          - Small producers
          - Workers with insecure jobs
          - Some local industries
        alt: Globalisation's gainers include well-off consumers, big Indian companies and IT jobs; those who lost out include small producers, workers with insecure jobs and some local industries.
      check:
        prompt: Who has gained most from globalisation?
        options:
        - Well-off consumers
        - Small toy makers
        - Casual workers
        answer: Well-off consumers
        why: Better choice and prices.
    - teach: 'Competition has made jobs less secure: employers hire workers ''flexibly'', on temporary contracts, with long hours and no benefits, so they can cut costs. The garment industry example shows workers without job security even as exports grow.'
      check:
        prompt: Flexible employment means workers…
        options:
        - Are hired and fired as the employer needs
        - Choose their own hours freely
        - Get permanent jobs
        answer: Are hired and fired as the employer needs
        why: Flexible for the employer.
    - teach: Fair globalisation means everyone shares the benefits. Governments can protect workers by enforcing labour laws, help small producers compete, use trade barriers when needed, and bargain for fairer WTO rules. People's campaigns and organisations also push for fairness.
      check:
        prompt: Which would make globalisation fairer?
        options:
        - Enforcing labour laws
        - Removing all workers' rights
        - Banning small producers
        answer: Enforcing labour laws
        why: Protects workers' rights.
  items:
  - prompt: Which Indian company has become a multinational?
    options:
    - Infosys
    - A village grocery shop
    - A local tailor
    - A street food stall
    answer: Infosys
    difficulty: 1
    hints:
    - IT company.
    - Operates worldwide.
    solution: Infosys (like Tata Motors and Asian Paints) operates across countries.
    mistakes: {"A local tailor": "s10_indian_mnc"}
  - prompt: Which group has been hit hardest by competition after globalisation?
    options:
    - Small producers
    - Large MNCs
    - Well-off consumers
    - Software engineers
    answer: Small producers
    difficulty: 1
    hints:
    - Batteries, toys, oil.
    - Couldn't match prices.
    solution: Small producers faced stiff competition and many shut down.
    mistakes: {"Software engineers": "s10_small_producers", "Well-off consumers": "s10_small_producers"}
  - prompt: What is 'flexible' employment for workers?
    options:
    - Jobs without long-term security; workers hired and fired as needed
    - Choosing working hours freely with full pay
    - Government jobs
    - Jobs with pension
    answer: Jobs without long-term security; workers hired and fired as needed
    difficulty: 2
    hints:
    - Employers want flexibility.
    - Workers lose security.
    solution: Flexibility means employers hire workers temporarily, with no security or benefits.
    mistakes: {"Choosing working hours freely with full pay": "s10_flexible"}
  - prompt: What is fair globalisation?
    options:
    - Globalisation whose benefits are shared by all, not just a few
    - Stopping all foreign trade
    - Letting MNCs do anything
    - Only rich countries trading
    answer: Globalisation whose benefits are shared by all, not just a few
    difficulty: 1
    hints:
    - Fairness.
    - Protect the weak.
    solution: Fair globalisation creates opportunities for all and shares the benefits.
    mistakes: {"Letting MNCs do anything": "s10_fair_globalisation"}
  - prompt: How can the government make globalisation fairer?
    options:
    - Enforce labour laws and support small producers
    - Remove all labour laws
    - Ban all imports forever
    - Let only MNCs operate
    answer: Enforce labour laws and support small producers
    difficulty: 2
    hints:
    - Protect workers.
    - Help small producers compete.
    solution: Government can protect workers' rights, help small producers, and negotiate fairer trade rules.
    mistakes: {"Remove all labour laws": "s10_govt_fair"}
  - prompt: Which consumers have benefited most from globalisation?
    options:
    - Well-off consumers in cities
    - Poor farmers
    - Small toy makers
    - Daily-wage workers
    answer: Well-off consumers in cities
    difficulty: 2
    hints:
    - More choice and quality.
    - Can afford new products.
    solution: Well-off urban consumers gained more choice, quality and lower prices.
    mistakes: {"Poor farmers": "s10_well_off"}
  - prompt: Which of these Indian firms now works in many countries, like an MNC?
    options:
    - Infosys
    - A village dairy
    - A local tailor
    - A city bus stop
    answer: Infosys
    difficulty: 1
    hints:
    - It works in many countries.
    - An IT company.
    solution: Infosys operates worldwide, so it is an Indian MNC.
    mistakes:
      A village dairy: s10_indian_mnc
  - prompt: Why did many small Indian battery and toy makers close after 1991?
    options:
    - Cheap imports took their markets
    - There was no demand for batteries
    - The government banned them
    - They became MNCs
    answer: Cheap imports took their markets
    difficulty: 2
    hints:
    - Competition rose.
    - Imported goods were cheaper.
    solution: Removal of trade barriers let cheap imports in, which hurt small producers.
    mistakes:
      They became MNCs: s10_small_producers
  - prompt: Which group's jobs have become less secure due to globalisation?
    options:
    - Many workers hired on temporary contracts
    - Ministers
    - Judges
    - Big company owners
    answer: Many workers hired on temporary contracts
    difficulty: 2
    hints:
    - Employers want to cut costs.
    - Flexible hiring.
    solution: Employers increasingly hire on short contracts without benefits.
    mistakes:
      Big company owners: c10ss21_winners
  - prompt: Which services have created new jobs in India because of globalisation?
    options:
    - IT and call-centre services
    - Bullock cart making
    - Handloom only
    - Coal mining by hand
    answer: IT and call-centre services
    difficulty: 1
    hints:
    - Work done in India for foreign clients.
    - Using computers and phones.
    solution: IT-enabled services like data entry, call centres and software have grown.
    mistakes:
      Handloom only: c10ss21_winners
  - prompt: What would 'fair globalisation' ensure?
    options:
    - Benefits shared by all, not just a few
    - Only MNCs gain
    - No trade at all
    - Lower wages for workers
    answer: Benefits shared by all, not just a few
    difficulty: 1
    hints:
    - Fair means everyone gets a share.
    - Not only the powerful.
    solution: Fair globalisation creates opportunities for all and protects the weak.
    mistakes:
      Only MNCs gain: s10_fair_globalisation
  - prompt: How can the government support small producers facing global competition?
    options:
    - Help them improve and, where needed, use trade barriers
    - Ban all imports forever
    - Close all small units
    - Raise their taxes
    answer: Help them improve and, where needed, use trade barriers
    difficulty: 2
    hints:
    - Make them stronger.
    - Protect them when needed.
    solution: Government can help small producers become competitive and protect them when needed.
    mistakes:
      Close all small units: s10_govt_fair
  - prompt: Why do garment exporters hire workers on short contracts?
    options:
    - To cut costs and meet buyers' low prices
    - Because workers ask for it
    - To pay higher wages
    - To follow WTO rules
    answer: To cut costs and meet buyers' low prices
    difficulty: 2
    hints:
    - MNC buyers demand cheap, fast supply.
    - Labour cost is cut.
    solution: Pressure from big buyers makes exporters cut labour costs with flexible hiring.
    mistakes:
      To pay higher wages: s10_flexible
  - prompt: Branded phones and cars at lower prices mostly reached which buyers?
    options:
    - Well-off consumers in cities
    - Poor rural labourers
    - Small toy makers
    - Casual workers
    answer: Well-off consumers in cities
    difficulty: 1
    hints:
    - Better choices and lower prices.
    - Who can afford them?
    solution: Well-off consumers gain from greater choice, quality and lower prices.
    mistakes:
      Small toy makers: s10_well_off
  - prompt: Tata Motors buying companies abroad shows that…
    options:
    - Some Indian companies have gained from globalisation
    - Indian companies can't grow
    - MNCs are always foreign
    - Trade is banned
    answer: Some Indian companies have gained from globalisation
    difficulty: 2
    hints:
    - Indian firms going global.
    - They have the money and technology.
    solution: Big Indian companies have become MNCs themselves.
    mistakes:
      MNCs are always foreign: s10_indian_mnc
