# CBSE Class 10 Social Science (NCERT), History: India and the Contemporary World II, chapter 4.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 4
title: The Age of Industrialisation
tips:
  c10ss_inventors: 'Hargreaves: Spinning Jenny (1764). Arkwright: cotton mill. Watt: improved steam engine (1781).'
  c10ss4_jenny_year: "Watt's engine patent came later, in the 1780s. The Jenny came almost twenty years before it."
  c10ss_jobber: "Gomasthas were Company agents who supervised weavers. Factory owners used a different middleman, usually an old trusted worker, to bring in workers from villages."
  c10ss4_company_men: "Jobbers recruited mill workers much later. This question is about the Company's own paid supervisors in weaving villages."
  s10_cotton: "Steel and cars came much later. Which industry led the first factories?"
  s10_gomastha: "Gomasthas were not independent. Who paid them and what did they watch over?"
  s10_hand_labour: "Machines were expensive. What was cheap and easy to find?"
  s10_jenny: "One Jenny did the work of many hand spinners. What did the women fear?"
  s10_labels: "A god's picture on a label made buyers feel something about the product. What?"
  s10_proto: "'Proto' means first or early. This came before factories."
  s10_tisco: "The Tata steel plant started just before the First World War."
  s10_war_industry: "During the war British mills were busy with war goods. What happened to imports into India?"
  s10_watt: "Watt improved Newcomen's engine and patented it in the early 1780s."
  s10_weavers: "Manchester mills made cloth by machine. What did that do to Indian weavers' markets?"
  c10ss4_merchants: Merchants from towns went to villages because urban guilds controlled production in towns and blocked newcomers.
  c10ss4_slow: 'Change was slow: new machines were costly, broke down often and were hard to repair, and even in 1850s Britain most workers were still in traditional trades.'
  c10ss4_seasonal: Many jobs in Victorian Britain were seasonal, like gas works and breweries in winter, so labour was hired only when needed.
  c10ss4_company: The East India Company wanted a monopoly over cloth exports, so it removed old traders and controlled weavers directly through paid agents.
  c10ss4_indian_industry: "Early Indian factory owners like Dwarkanath Tagore, Dinshaw Petit and Jamsetjee Tata built their first fortunes in trade before they built mills. Which trade?"
  c10ss4_ads: Advertisements and labels made products look desirable, trustworthy or patriotic. What feeling is this one aiming for?
concepts:
- code: cbse10ss.industry.britain
  title: Industrialisation in Britain
  notes: |
    Before factories there was proto-industrialisation: merchants supplied money to rural spinners and weavers
    who worked at home, controlled by city merchants. The first factories came up in England in the 1730s;
    cotton was the leading sector. Richard Arkwright's cotton mill brought all processes under one roof.
    Watt improved Newcomen's steam engine (1781 patent). Change was slow: in the mid-19th century most workers
    were still in traditional industries, and hand labour was cheap and plentiful, so many industrialists
    preferred it, especially for seasonal and hand-made goods. Workers faced uncertain jobs; the Spinning
    Jenny (James Hargreaves, 1764) speeded spinning and was opposed by women who feared losing work.
  explanations:
    text: Industry did not begin with big factories. First, merchants paid village families to spin and weave at home. Then mills gathered all the work under one roof, and machines like the steam engine and Spinning Jenny sped it up. Even so, change was slow and hand labour stayed common for a long time.
    visual: 'Draw three pictures in a row: a cottage with a spinning wheel (proto-industry), a mill with a water wheel (Arkwright), and a factory with a chimney and steam engine.'
    step_by_step: 'Step 1: Before factories: merchants and home workers. Step 2: First factories: cotton mills. Step 3: New machines: Jenny, steam engine. Step 4: Why slow: cheap labour, costly machines, seasonal demand.'
    real_world: Even today, handmade goods like Kashmiri shawls or Banarasi saris are valued because machines can't easily copy their fine work, much as Victorian buyers prized hand-made items.
  picture:
    kind: flow
    steps:
    - 'Proto-industry: merchants pay rural home workers'
    - '1730s: first factories in England'
    - 'Arkwright''s mill: all processes under one roof'
    - '1764: Spinning Jenny; 1781: Watt''s steam engine'
    - 'Mid-1800s: factories grow, hand labour still common'
    alt: Stages of industrialisation in Britain from home-based proto-industry to factories, new machines and slow change.
  activity:
    type: sort
    prompt: Why did some industrialists prefer hand labour?
    bins:
    - Reason to prefer hand labour
    - Reason to use machines
    items:
    - label: Labour was cheap and plentiful
      bin: Reason to prefer hand labour
      clue: Poor peasants came to cities.
      why: Workers cost little.
    - label: Demand was seasonal (gas works, ships)
      bin: Reason to prefer hand labour
      clue: Work only for some months.
      why: Hiring hands only in season was cheaper.
    - label: Upper classes wanted hand-made goods
      bin: Reason to prefer hand labour
      clue: Fine finish, refined taste.
      why: Hand-made meant class.
    - label: Machines needed huge capital and broke down
      bin: Reason to prefer hand labour
      clue: Costly to buy and repair.
      why: Machines were expensive.
    - label: Arkwright's mill brings all steps under one roof
      bin: Reason to use machines
      clue: Supervision and quality.
      why: The factory made production faster and controlled.
    - label: Spinning Jenny speeds up spinning
      bin: Reason to use machines
      clue: One worker turns many spindles.
      why: Machines raise output (women feared losing work).
  lesson:
    - teach: 'Before factories, there was proto-industrialisation: merchants from towns gave money to peasants in villages, who spun and wove at home for an international market. Merchants went to the countryside because town guilds controlled trade and blocked new producers.'
      check:
        prompt: Why did merchants go to villages?
        options:
        - Town guilds controlled production
        - Villages had factories
        - Towns had no people
        answer: Town guilds controlled production
        why: Guilds limited competition in towns.
    - teach: The first factories came up in England in the 1730s and spread in the late 1700s. Cotton was the leading industry; Richard Arkwright built the cotton mill. James Watt improved the steam engine (patented 1781), and Matthew Boulton manufactured it. Cotton and iron and steel led the way.
      picture:
        kind: flow
        steps:
        - Proto-industry at home
        - Spinning Jenny 1764
        - Arkwright's cotton mill
        - Watt's steam engine 1781
        - Factories in cities
        alt: 'Path to factories in Britain: home production, the Spinning Jenny in 1764, Arkwright''s cotton mill, Watt''s improved steam engine in 1781, then factories in cities.'
      check:
        prompt: Which was the leading industry in early British industrialisation?
        options:
        - Cotton
        - Cars
        - Electronics
        answer: Cotton
        why: Cotton mills came first.
    - teach: 'Change was slow. Even in the mid-1800s most workers were in traditional crafts. Labour was cheap and plentiful, many jobs were seasonal, and machines were costly, so many factory owners preferred hand labour. Upper classes also liked hand-made goods. Workers feared machines: women attacked the Spinning Jenny because it took their jobs.'
      check:
        prompt: Why did many Victorian industrialists prefer hand labour?
        options:
        - Labour was cheap and plentiful
        - Machines were free
        - It was the law
        answer: Labour was cheap and plentiful
        why: Machines needed big investment.
  items:
  - prompt: What was proto-industrialisation?
    options:
    - Large-scale production for international markets in homes, before factories
    - Factory production with steam engines
    - Farming with machines
    - Production by the government
    answer: Large-scale production for international markets in homes, before factories
    difficulty: 1
    hints:
    - '''Proto'' means first or early.'
    - Merchants and rural workers.
    solution: Before factories, merchants organised home-based production in the countryside for distant markets.
    mistakes: {"Factory production with steam engines": "s10_proto"}
  - prompt: Who invented the Spinning Jenny?
    options:
    - James Hargreaves
    - James Watt
    - Richard Arkwright
    - Henry Ford
    answer: James Hargreaves
    difficulty: 1
    hints:
    - '1764.'
    - Watt improved the steam engine.
    solution: James Hargreaves built the Spinning Jenny in 1764.
    mistakes:
      James Watt: c10ss_inventors
  - prompt: Why did many industrialists in Victorian Britain prefer hand labour to machines?
    options:
    - Labour was cheap and plentiful, and machines were costly
    - Machines were illegal
    - Workers refused to go to factories
    - Machines were too fast to sell goods
    answer: Labour was cheap and plentiful, and machines were costly
    difficulty: 2
    hints:
    - Poor peasants came to cities looking for work.
    - Seasonal industries.
    solution: With plenty of cheap labour and expensive, unreliable machines, many preferred hand labour, especially for seasonal and fine goods.
    mistakes: {"Machines were illegal": "s10_hand_labour"}
  - prompt: Why did women in Britain attack the Spinning Jenny?
    options:
    - They feared losing their jobs in hand spinning
    - It was dangerous to use
    - It made bad cloth
    - It belonged to India
    answer: They feared losing their jobs in hand spinning
    difficulty: 2
    hints:
    - One worker could turn many spindles.
    - Fewer workers needed.
    solution: The Jenny reduced the need for labour, so women who survived on hand spinning attacked it.
    mistakes: {"It made bad cloth": "s10_jenny"}
  - prompt: Which industry led the early industrialisation of Britain?
    options:
    - Cotton
    - Steel
    - Cars
    - Chemicals
    answer: Cotton
    difficulty: 1
    hints:
    - Textile mills.
    - Arkwright.
    solution: Cotton was the leading sector in the first phase of industrialisation.
    mistakes: {"Steel": "s10_cotton"}
  - prompt: In which year did James Watt patent his improved steam engine?
    answer: '1781'
    check: '1781'
    difficulty: 2
    hints:
    - Late eighteenth century.
    - He improved Newcomen's engine.
    solution: Watt patented the improved engine in 1781.
    mistakes: {"1712": "s10_watt", "1850": "s10_watt"}
  - prompt: Why did merchants find it hard to expand production within the towns of Europe?
    options:
    - Powerful guilds controlled crafts and trade
    - Towns had no money
    - Kings banned cloth
    - There was no demand
    answer: Powerful guilds controlled crafts and trade
    difficulty: 2
    hints:
    - Guilds were associations of producers.
    - They restricted new people.
    solution: Urban guilds controlled production and blocked new entrants, so merchants turned to villages.
    mistakes:
      There was no demand: c10ss4_merchants
  - prompt: Who created the cotton mill?
    options:
    - Richard Arkwright
    - James Hargreaves
    - James Watt
    - Matthew Boulton
    answer: Richard Arkwright
    difficulty: 2
    hints:
    - Hargreaves made the Jenny.
    - Watt worked on engines.
    solution: Richard Arkwright built the cotton mill, bringing all processes under one roof.
    mistakes:
      James Hargreaves: c10ss_inventors
      James Watt: c10ss_inventors
  - prompt: Who manufactured James Watt's new steam engine?
    options:
    - Matthew Boulton
    - Henry Ford
    - Richard Arkwright
    - Thomas Newcomen
    answer: Matthew Boulton
    difficulty: 3
    hints:
    - An industrialist partner of Watt.
    - Ford came a century later.
    solution: Matthew Boulton manufactured Watt's improved steam engine.
    mistakes:
      Thomas Newcomen: s10_watt
  - prompt: Why did the demand for labour in Victorian Britain go up in winter in some trades?
    options:
    - Gas works and breweries were busy then
    - Schools closed
    - Factories closed in winter
    - Farms needed more workers
    answer: Gas works and breweries were busy then
    difficulty: 3
    hints:
    - Many jobs were seasonal.
    - Which trades get busy in the cold months?
    solution: Gas works, breweries and book binders needed extra workers in the winter season.
    mistakes:
      Factories closed in winter: c10ss4_seasonal
  - prompt: In mid-1800s Britain, where were most workers employed?
    options:
    - In traditional crafts and trades
    - In cotton factories
    - In car factories
    - In offices
    answer: In traditional crafts and trades
    difficulty: 2
    hints:
    - Factory industry grew slowly.
    - Technology spread unevenly.
    solution: Most workers were still in traditional industries, not the new factories.
    mistakes:
      In cotton factories: c10ss4_slow
  - prompt: Why did the upper classes in Britain prefer hand-made goods?
    options:
    - They stood for refinement and class
    - They were cheaper
    - They were made by machines
    - They were imported
    answer: They stood for refinement and class
    difficulty: 2
    hints:
    - Machine goods were for mass export.
    - Hand-made meant special.
    solution: Hand-made, carefully finished goods were symbols of refinement for the aristocracy.
    mistakes:
      They were cheaper: s10_hand_labour
  - prompt: In which year did James Hargreaves make the Spinning Jenny?
    answer: '1764'
    check: '1764'
    difficulty: 3
    hints:
    - Before Watt's engine patent.
    - In the 1760s.
    solution: The Spinning Jenny was devised in 1764.
    mistakes:
      '1781': c10ss4_jenny_year
  - prompt: Why did many workers in British towns face unemployment despite new jobs?
    options:
    - More people came looking for work than there were jobs
    - All factories shut down
    - Wages were too high
    - Machines did no work
    answer: More people came looking for work than there were jobs
    difficulty: 2
    hints:
    - People flocked from villages to cities.
    - Jobs were limited.
    solution: The supply of workers was greater than jobs, so many stayed jobless.
    mistakes:
      Wages were too high: s10_hand_labour
  - prompt: What was the 'Spinning Jenny' used for?
    options:
    - Spinning several threads at once
    - Weaving carpets
    - Pumping water
    - Printing cloth
    answer: Spinning several threads at once
    difficulty: 1
    hints:
    - One worker turned one wheel.
    - It set many spindles going.
    solution: One wheel turned many spindles, spinning several threads together.
    mistakes:
      Weaving carpets: s10_jenny
- code: cbse10ss.industry.india
  title: Industry in colonial India
  after:
  - cbse10ss.industry.britain
  notes: |
    Before machine industries, Indian silk and cotton goods dominated world markets. Ports: Surat, Hooghly and
    Masulipatam declined; Bombay and Calcutta grew under the British. The East India Company appointed gomasthas
    to supervise weavers and stop them selling to others, which led to clashes. From the 1800s Manchester's cheap
    machine-made cloth flooded India and weavers lost markets and raw cotton. Early Indian industrialists:
    Dwarkanath Tagore (Bengal), Dinshaw Petit and Jamsetjee Jeejeebhoy (Bombay), Seth Hukumchand (Calcutta jute
    mill, 1917), G.D. Birla; the first cotton mill in Bombay came up in 1854; Jamsetji Tata set up the iron and
    steel works at Jamshedpur (1912). Jobbers recruited mill workers. During the First World War imports fell
    and Indian mills grew. Handloom production also survived with fly shuttles. Advertisements and labels
    (images of gods, nationalist messages) created markets for goods.
  explanations:
    text: India was once the world's great cloth exporter. Under Company rule weavers lost control to gomasthas, and then cheap British factory cloth took their markets. Indian businessmen set up their own mills from the 1850s, and the First World War gave Indian industry a big push.
    visual: 'Draw two scales: in 1750 the Indian side heavy with cloth exports; by 1850 the British side heavy with Manchester cloth flowing into India.'
    step_by_step: 'Step 1: Before 1750: Indian textiles dominate. Step 2: Company control: gomasthas, weavers squeezed. Step 3: Manchester imports: weavers decline. Step 4: Indian mills from 1854; Tata steel 1912; war boost 1914–18.'
    real_world: The Tata Steel plant at Jamshedpur, started in 1912, still makes steel today and is one of India's oldest big industries.
  picture:
    kind: compare
    columns:
    - title: Weavers' troubles
      points:
      - Gomasthas controlled them
      - Manchester imports cheaper
      - Raw cotton exported, costly
      - Many lost their livelihood
    - title: Indian industry grows
      points:
      - '1854: first Bombay cotton mill'
      - '1912: Tata steel at Jamshedpur'
      - '1917: first Indian jute mill, Calcutta'
      - War 1914–18 cuts British imports
    alt: Indian weavers lost out to Company control and Manchester imports, while Indian industrialists built mills and steel works, helped by the First World War.
  activity:
    type: order
    prompt: What happened to Indian weavers? Put the steps in order.
    steps:
    - Indian cotton and silk dominate world markets
    - The East India Company appoints gomasthas over weavers
    - Weavers can't sell to others; clashes break out
    - Manchester's cheap machine cloth floods India
    - Indian mills grow during the First World War
    reasons:
      The East India Company appoints gomasthas over weavers: The Company took control once it had political power.
      Weavers can't sell to others; clashes break out: The gomasthas' control caused the clashes.
      Manchester's cheap machine cloth floods India: From the 1800s British mills overtook Indian weaving.
      Indian mills grow during the First World War: With imports cut by the war, Indian mills expanded.
  lesson:
    - teach: Before machines, Indian silk and cotton goods dominated world trade, sent from ports like Surat, Hooghly and Masulipatam. When the East India Company gained power, it pushed out old traders, appointed paid supervisors called gomasthas over weavers, and gave weavers loans that tied them to the Company. Weavers often clashed with gomasthas.
      check:
        prompt: Who were gomasthas?
        options:
        - Paid Company agents who supervised weavers
        - Independent traders
        - Factory owners
        answer: Paid Company agents who supervised weavers
        why: They collected and checked cloth.
    - teach: 'By the 1800s, cheap Manchester machine-made cloth flooded India. Indian weavers lost export markets, then the home market, and couldn''t get good raw cotton. Factories began in India too: the first cotton mill in Bombay in 1854, the first jute mill in Bengal in 1855. Early industrialists like Dwarkanath Tagore and Jamsetjee Tata had made money in the China trade; Jobbers recruited workers.'
      picture:
        kind: compare
        columns:
        - title: Before 1750s
          points:
          - Indian cloth exported worldwide
          - Many independent traders
        - title: 1800s
          points:
          - Manchester imports flood India
          - Weavers lose markets
          - First Indian mills from 1854
        alt: Before the 1750s Indian cloth was exported worldwide by many traders; in the 1800s Manchester imports flooded India, weavers lost markets, and the first Indian mills appeared from 1854.
      check:
        prompt: Where did the first Indian cotton mill come up?
        options:
        - Bombay
        - Calcutta
        - Madras
        answer: Bombay
        why: In 1854.
    - teach: 'The First World War helped Indian industry: Manchester imports fell, and Indian mills supplied army needs. Handloom production also survived and grew with the fly shuttle. To sell goods, makers used labels and calendars, and nationalist ads urged buying swadeshi; images of gods on labels made goods seem trustworthy.'
      check:
        prompt: Why did Indian industry grow during the First World War?
        options:
        - British imports fell and the army needed supplies
        - The British left India
        - Gandhiji built mills
        answer: British imports fell and the army needed supplies
        why: Manchester was busy with war needs.
  items:
  - prompt: Who were gomasthas?
    options:
    - Paid servants of the East India Company who supervised weavers
    - Independent Indian merchants
    - Factory workers
    - British judges
    answer: Paid servants of the East India Company who supervised weavers
    difficulty: 1
    hints:
    - They collected supplies.
    - Weavers often clashed with them.
    solution: Gomasthas were agents appointed by the Company to supervise weavers and examine cloth.
    mistakes: {"Independent Indian merchants": "s10_gomastha"}
  - prompt: Why did Indian weavers suffer in the nineteenth century?
    options:
    - Cheap Manchester cloth took their markets and raw cotton became costly
    - There was too much demand for their cloth
    - The British gave them free machines
    - They stopped using handlooms
    answer: Cheap Manchester cloth took their markets and raw cotton became costly
    difficulty: 2
    hints:
    - Two problems at once.
    - Raw cotton was exported to Britain.
    solution: Weavers lost markets to machine-made imports and faced shortages of good raw cotton.
    mistakes: {"There was too much demand for their cloth": "s10_weavers"}
  - prompt: In which year did Jamsetji Tata's iron and steel plant start production at Jamshedpur?
    answer: '1912'
    check: '1912'
    difficulty: 2
    hints:
    - Just before the First World War.
    - Early twentieth century.
    solution: The Tata Iron and Steel Company began production at Jamshedpur in 1912.
    mistakes: {"1947": "s10_tisco", "1854": "s10_tisco"}
  - prompt: How did the First World War help Indian industries?
    options:
    - British mills made war goods, so imports fell and Indian mills supplied the home market
    - Britain sent more cloth to India
    - Indian industries were closed
    - Prices fell sharply
    answer: British mills made war goods, so imports fell and Indian mills supplied the home market
    difficulty: 2
    hints:
    - Manchester was busy with war needs.
    - Indian mills also made army supplies.
    solution: With British imports reduced, Indian mills filled the gap and also supplied war needs.
    mistakes: {"Britain sent more cloth to India": "s10_war_industry"}
  - prompt: Who recruited workers for Indian factories, often from his own village?
    options:
    - The jobber
    - The gomastha
    - The collector
    - The zamindar
    answer: The jobber
    difficulty: 1
    hints:
    - A trusted old worker.
    - He demanded money and gifts.
    solution: Jobbers recruited mill workers, helped them settle, and gained power over them.
    mistakes:
      The gomastha: c10ss_jobber
  - prompt: Why did manufacturers put images of Indian gods on cloth labels?
    options:
    - To make the product seem trustworthy and familiar to buyers
    - Because the law required it
    - To show the price
    - To hide the company name
    answer: To make the product seem trustworthy and familiar to buyers
    difficulty: 2
    hints:
    - Advertising.
    - Divine approval.
    solution: Images of gods and goddesses gave goods a familiar, approved feel and helped sell them.
    mistakes: {"Because the law required it": "s10_labels"}
  - prompt: Who supervised weavers, collected supplies and checked cloth quality for the East India Company?
    options:
    - Gomasthas
    - Jobbers
    - Guilds
    - Zamindars
    answer: Gomasthas
    difficulty: 1
    hints:
    - Paid servants of the Company.
    - Jobbers worked in factories later.
    solution: Gomasthas were paid agents who supervised the weavers.
    mistakes:
      Jobbers: c10ss4_company_men
  - prompt: In which year did the first cotton mill in Bombay start?
    answer: '1854'
    check: '1854'
    difficulty: 2
    hints:
    - Mid-1800s.
    - A year before the first jute mill.
    solution: The first cotton mill in Bombay came up in 1854.
    mistakes:
      '1855': c10ss4_indian_industry
      '1912': s10_tisco
  - prompt: How did many early Indian industrialists first make their money?
    options:
    - In trade with China
    - From factories in England
    - As farmers
    - From the army
    answer: In trade with China
    difficulty: 2
    hints:
    - They shipped goods to the east.
    - Including opium.
    solution: Dwarkanath Tagore, Dinshaw Petit, Jamsetjee Tata and others made fortunes in the China trade.
    mistakes:
      As farmers: c10ss4_indian_industry
  - prompt: Why did the Company want to control weavers directly?
    options:
    - To get a monopoly over cloth trade
    - To teach them English
    - To make cloth cheaper for Indians
    - To build factories
    answer: To get a monopoly over cloth trade
    difficulty: 2
    hints:
    - It wanted to remove competition.
    - From French, Dutch and Portuguese traders too.
    solution: The Company wanted a monopoly, so it removed other traders and bound weavers to itself.
    mistakes:
      To make cloth cheaper for Indians: c10ss4_company
  - prompt: What was the fly shuttle?
    options:
    - A device that let weavers work faster with wider cloth
    - A steam engine
    - A ship
    - A spinning wheel for silk only
    answer: A device that let weavers work faster with wider cloth
    difficulty: 2
    hints:
    - It helped handloom weavers.
    - Moved by ropes and pulleys.
    solution: The fly shuttle let weavers make wider cloth faster, helping handlooms survive.
    mistakes:
      A steam engine: s10_weavers
  - prompt: Which ports were important for Indian trade before the 1750s?
    options:
    - Surat, Hooghly and Masulipatam
    - Bombay and Calcutta only
    - London and Manchester
    - Goa and Lisbon
    answer: Surat, Hooghly and Masulipatam
    difficulty: 3
    hints:
    - Bombay and Calcutta grew later under the British.
    - They were older pre-colonial ports.
    solution: Surat on the west coast, Hooghly in Bengal and Masulipatam on the Coromandel coast were key ports.
    mistakes:
      Bombay and Calcutta only: c10ss4_company
  - prompt: Many nationalist advertisements asked people to…
    options:
    - Buy swadeshi goods made in India
    - Buy only British goods
    - Stop buying cloth
    - Leave India
    answer: Buy swadeshi goods made in India
    difficulty: 1
    hints:
    - They linked buying to love for the nation.
    - Swadeshi means own country.
    solution: Nationalist ads said that buying Indian goods was a patriotic duty.
    mistakes:
      Buy only British goods: c10ss4_ads
  - prompt: Why did Indian weavers face a shortage of raw cotton in the 1800s?
    options:
    - Raw cotton was exported to Britain
    - Cotton stopped growing
    - Weavers burnt it
    - It was banned
    answer: Raw cotton was exported to Britain
    difficulty: 2
    hints:
    - Manchester mills needed cotton.
    - Where did India's cotton go?
    solution: As exports of raw cotton grew, local prices rose and weavers couldn't get enough.
    mistakes:
      Cotton stopped growing: s10_weavers
  - prompt: Where was the first jute mill in India set up, in 1855?
    options:
    - Bengal
    - Bombay
    - Madras
    - Punjab
    answer: Bengal
    difficulty: 2
    hints:
    - Jute grows in the east.
    - Near Calcutta.
    solution: The first jute mill came up in Bengal in 1855.
    mistakes:
      Bombay: c10ss4_indian_industry
