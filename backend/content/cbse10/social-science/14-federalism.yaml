# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 2.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 14
title: Federalism
tips:
  c10ss_lists: "National subjects like the army go in the Union List and local ones like police in the State List. Subjects that both the centre and the states may make laws on go in a third list. Which kind is the subject in the question?"
  c10ss14_local_order: "Law and order differs from place to place, and each state has its own force. Is that a national subject, a shared one, or a state matter?"
  c10ss14_one_currency: "The Concurrent List is for subjects both levels share, like education. Can each state have its own currency? Then which list must it be on?"
  c10ss_coming_holding: "Some federations form when independent states join; others when a big country divides power among its parts. Which happened in India?"
  c10ss_local_heads: "A sarpanch heads a village panchayat. Cities have a municipal corporation with a different head."
  c10ss14_village_head: "A mayor runs a big city. A village panchayat has its own elected head with a different title. What is the village head called?"
  c10ss_sec: Local elections are run by each State Election Commission, not the Election Commission of India.
  s10_1992: "The 73rd and 74th Amendments came in the early 1990s."
  c10ss14_amend: "The 42nd and 44th Amendments were made in the 1970s, on other matters. The local-government pair came in 1992, one for villages and the next for towns."
  s10_courts: "The Governor is appointed by the centre. Who acts as an independent umpire?"
  s10_decentralise: "'De-centralise' means moving power away from the centre. Where does it go?"
  s10_eighth_schedule: "The Eighth Schedule began with 14 languages in 1950, and more were added in 1967, 1992 and 2003. Recall today's total."
  s10_gram_sabha: "The zila parishad is a district body. The panchayat answers to the meeting of all the adult voters of its own village."
  s10_one_third: "One-third as a decimal to two places: 1 ÷ 3."
  s10_residuary: "Residuary subjects are not in any list. Who gets the power over them?"
  c10ss14_unitary: In a unitary system the central government holds the power and can order local governments; in a federation each level has its own powers that the other can't take away.
  c10ss14_features: 'Key federal features: two or more levels, each with its own powers written in the constitution, changes need both levels to agree, and courts act as umpire.'
  c10ss14_language: India avoided imposing one language. Hindi is the official language of the Union, but there is no single 'national language', and states use their own languages.
  c10ss14_states: "In 1956 many state borders were redrawn so that people who shared something important lived in one state. Andhra Pradesh was an early example. What did they share?"
  c10ss14_local: "Rural local government has three tiers: village, block and district, with the village meeting of all voters watching over the panchayat. Which tier is this question about?"
concepts:
- code: cbse10ss.fed.features
  title: What makes India a federation
  notes: |
    Federalism divides power between a central authority and constituent units. Features: two or more levels of
    government; each has its own jurisdiction in legislation, taxation and administration; jurisdictions are
    specified in the constitution; fundamental provisions can't be changed by one level alone; courts
    interpret disputes; sources of revenue are specified. Coming together federations (USA, Switzerland,
    Australia) and holding together federations (India, Spain, Belgium). India's Constitution has three lists:
    Union List (defence, foreign affairs, banking, currency), State List (police, trade, agriculture,
    irrigation), Concurrent List (education, forests, trade unions, marriage, adoption, succession); residuary
    subjects go to the Union. Union territories (like Chandigarh, Lakshadweep, Delhi) are run by the centre.
    Practice: linguistic states (from 1956), language policy (Hindi plus 21 other Scheduled Languages, 22 in
    all; English continued), centre–state relations improved with coalition governments after 1990.
  explanations:
    text: In a federation, power is split between the central government and state governments, each with its own list of subjects written in the constitution. India's Constitution has a Union List, a State List and a Concurrent List, and courts settle disputes between the levels.
    visual: 'Draw three columns: Union List (defence, currency, foreign affairs), State List (police, agriculture), Concurrent List (education, forests, marriage). Residuary subjects like computer software go to the Union.'
    step_by_step: 'Step 1: Identify the subject. Step 2: National importance (defence, currency) → Union. Step 3: Local importance (police, agriculture) → State. Step 4: Shared interest (education, forests) → Concurrent. Step 5: New subjects not listed → Union (residuary).'
    real_world: When states were reorganised by language from 1956, Malayalam-speaking areas formed Kerala, which made governing easier and people felt more at home.
  picture:
    kind: compare
    columns:
    - title: Union List
      points:
      - Defence
      - Foreign affairs
      - Banking, currency
      - Communications
    - title: State List
      points:
      - Police
      - Trade within the state
      - Agriculture
      - Irrigation
    - title: Concurrent List
      points:
      - Education
      - Forests
      - Trade unions
      - Marriage, adoption
    alt: 'India''s three lists: Union (defence, foreign affairs, currency), State (police, agriculture, irrigation) and Concurrent (education, forests, marriage).'
  activity:
    type: sort
    prompt: Which list of the Constitution?
    bins:
    - Union List
    - State List
    - Concurrent List
    items:
    - label: Defence
      bin: Union List
      clue: One army for India.
      why: Union.
    - label: Banking and currency
      bin: Union List
      clue: One rupee.
      why: Union.
    - label: Police
      bin: State List
      clue: Each state.
      why: State.
    - label: Irrigation
      bin: State List
      clue: Local water.
      why: State.
    - label: Education
      bin: Concurrent List
      clue: Both can make laws.
      why: Concurrent.
    - label: Adoption and succession
      bin: Concurrent List
      clue: Both.
      why: Concurrent.
    - label: Computer software (not in any list)
      bin: Union List
      clue: Residuary subjects.
      why: Residuary powers go to the Union.
  lesson:
    - teach: Federalism is a system where power is divided between a central authority and its constituent units. Each level has its own area of power, written into the constitution, and governs the same citizens. Changes to the basic arrangement need both levels to agree, and courts settle disputes. In a unitary system, by contrast, the centre is supreme.
      check:
        prompt: In a federation, who decides disputes between centre and states?
        options:
        - The courts
        - The army
        - The police
        answer: The courts
        why: They act as umpire.
    - teach: 'Federations form in two ways: ''coming together'' (independent states join, like the USA, Switzerland, Australia) or ''holding together'' (a large country shares power with its parts, like India, Spain, Belgium). India''s constitution has three lists: Union (defence, foreign affairs, banking), State (police, trade within the state, agriculture) and Concurrent (education, forests, marriage). Residuary subjects (like software) go to the Union.'
      picture:
        kind: compare
        columns:
        - title: Union List
          points:
          - Defence
          - Foreign affairs
          - Banking, currency
        - title: State List
          points:
          - Police
          - Agriculture
          - Trade within state
        - title: Concurrent List
          points:
          - Education
          - Forests
          - Marriage, adoption
        alt: The Union List has defence, foreign affairs, banking and currency; the State List has police, agriculture and trade within the state; the Concurrent List has education, forests, marriage and adoption.
      check:
        prompt: Defence is on which list?
        options:
        - Union List
        - State List
        - Concurrent List
        answer: Union List
        why: A national subject.
    - teach: 'Federalism works in practice through: linguistic states (many formed in 1956), a flexible language policy (22 scheduled languages; no single national language), and centre-state relations that changed after 1990 with coalition governments, giving states more say. Some units, like Jammu and Kashmir earlier, had special status; union territories are run more directly by the centre.'
      check:
        prompt: How many languages are in the Eighth Schedule?
        options:
        - '22'
        - '14'
        - '100'
        answer: '22'
        why: Started with 14, now 22.
  items:
  - prompt: Which subject is in the Union List?
    options:
    - Defence
    - Police
    - Agriculture
    - Education
    answer: Defence
    difficulty: 1
    hints:
    - National importance.
    - Police is State.
    solution: Defence is a Union subject.
    mistakes:
      Police: c10ss_lists
  - prompt: Education is in which list?
    options:
    - Concurrent List
    - Union List
    - State List
    - Residuary subjects
    answer: Concurrent List
    difficulty: 1
    hints:
    - Both centre and state make laws.
    - Like forests.
    solution: Education is on the Concurrent List.
    mistakes:
      State List: c10ss_lists
  - prompt: Who makes laws on residuary subjects like computer software?
    options:
    - The Union government
    - State governments
    - Local governments
    - The Supreme Court
    answer: The Union government
    difficulty: 2
    hints:
    - Subjects not in any list.
    - Article 248.
    solution: The Union Parliament has the power to legislate on residuary subjects.
    mistakes: {"State governments": "s10_residuary"}
  - prompt: India is an example of which kind of federation?
    options:
    - Holding together
    - Coming together
    - Unitary
    - Confederation
    answer: Holding together
    difficulty: 2
    hints:
    - A large country divided its power among states.
    - USA came together.
    solution: India is a holding-together federation, where power was shared among states to keep the country united.
    mistakes:
      Coming together: c10ss_coming_holding
  - prompt: How many languages are in the Eighth Schedule of the Indian Constitution?
    answer: '22'
    check: 1 + 21
    difficulty: 2
    hints:
    - Hindi plus 21 others.
    - Count them.
    solution: 'Besides Hindi there are 21 other languages: 22 Scheduled Languages.'
    mistakes: {"18": "s10_eighth_schedule", "14": "s10_eighth_schedule"}
  - prompt: Who settles disputes between the centre and states over powers?
    options:
    - The courts (judiciary)
    - The Prime Minister
    - The Governor
    - The Election Commission
    answer: The courts (judiciary)
    difficulty: 1
    hints:
    - Interpret the constitution.
    - Umpire.
    solution: Courts interpret the constitution and settle disputes about powers.
    mistakes: {"The Governor": "s10_courts", "The Prime Minister": "s10_courts"}
  - prompt: Which is an example of a 'coming together' federation?
    options:
    - USA
    - India
    - Spain
    - Belgium
    answer: USA
    difficulty: 2
    hints:
    - Independent states joined to form one country.
    - India is the other type.
    solution: The USA formed when independent states came together.
    mistakes:
      India: c10ss_coming_holding
  - prompt: Police is a subject on which list?
    options:
    - State List
    - Union List
    - Concurrent List
    - Residuary
    answer: State List
    difficulty: 1
    hints:
    - Local law and order.
    - Each state has its own police.
    solution: Police is a state subject.
    mistakes:
      Union List: c10ss14_local_order
  - prompt: If a central law and a state law on a Concurrent List subject conflict, which prevails?
    options:
    - The central law
    - The state law
    - Neither
    - The older law
    answer: The central law
    difficulty: 3
    hints:
    - Both can make laws on these subjects.
    - One has the final word.
    solution: On Concurrent subjects, the Union law prevails if there's a conflict.
    mistakes:
      The state law: c10ss_lists
  - prompt: What is a unitary government?
    options:
    - One where the central government is supreme and can command local governments
    - One with two independent levels
    - One run by courts
    - One with no central government
    answer: One where the central government is supreme and can command local governments
    difficulty: 2
    hints:
    - The opposite of federal.
    - '''Unit'' means one.'
    solution: In a unitary system only one level is supreme; sub-units answer to it.
    mistakes:
      One with two independent levels: c10ss14_unitary
  - prompt: Why did India not give Hindi the status of national language?
    options:
    - To respect the many languages spoken across India
    - Because nobody spoke Hindi
    - Because English was banned
    - Because the courts forbade it
    answer: To respect the many languages spoken across India
    difficulty: 2
    hints:
    - Only about 40% speak Hindi as mother tongue.
    - Imposing one language could cause conflict.
    solution: A careful language policy protected India's diversity and avoided conflict.
    mistakes:
      Because nobody spoke Hindi: c10ss14_language
  - prompt: On what basis were many Indian states reorganised in 1956?
    options:
    - Language
    - Religion
    - Caste
    - Income
    answer: Language
    difficulty: 1
    hints:
    - People speaking the same tongue in one state.
    - Andhra was an early example.
    solution: Many states were created on a linguistic basis.
    mistakes:
      Religion: c10ss14_states
  - prompt: Which is NOT a feature of federalism?
    options:
    - The centre can change the powers of states on its own
    - Two or more levels of government
    - Powers written in the constitution
    - Courts as umpire
    answer: The centre can change the powers of states on its own
    difficulty: 2
    hints:
    - Changes need both levels' agreement.
    - Three options are real features.
    solution: In a federation the centre cannot alter the basic arrangement alone.
    mistakes:
      Courts as umpire: c10ss14_features
  - prompt: Chandigarh and Lakshadweep are examples of…
    options:
    - Union territories
    - States
    - Districts
    - Panchayats
    answer: Union territories
    difficulty: 2
    hints:
    - Too small to be states.
    - Run more directly by the centre.
    solution: They are union territories, governed mostly by the Union.
    mistakes:
      States: c10ss14_features
  - prompt: Banking and currency are on which list?
    options:
    - Union List
    - State List
    - Concurrent List
    - None
    answer: Union List
    difficulty: 1
    hints:
    - One currency for the whole country.
    - A national subject.
    solution: Banking and currency are Union subjects.
    mistakes:
      Concurrent List: c10ss14_one_currency
- code: cbse10ss.fed.local
  title: Decentralisation and local government
  after:
  - cbse10ss.fed.features
  notes: |
    Decentralisation means taking power away from central and state governments and giving it to local
    government. Local bodies understand local problems and let people participate directly. The 1992
    constitutional amendment (73rd and 74th) made local government a third tier: regular elections are
    mandatory; seats reserved for SC, ST and OBC; at least one-third of positions reserved for women; State
    Election Commissions conduct elections; state governments must share some powers and revenue. Rural
    local government: gram panchayat (headed by sarpanch, accountable to the gram sabha of all voters),
    panchayat samiti (block or mandal), zila parishad (district). Urban: municipalities and municipal
    corporations, headed by chairperson or mayor. About 36 lakh elected representatives make India's the
    largest experiment in democracy. Problems: gram sabhas don't meet regularly; states haven't transferred
    enough powers and money.
  explanations:
    text: Decentralisation means passing power down to villages and towns, where people know their own problems best. Since 1992 India's Constitution guarantees regular elections for panchayats and municipalities, with a third of seats for women and reserved seats for weaker sections.
    visual: 'Draw a three-step pyramid for rural government: gram panchayat at the base, panchayat samiti in the middle, zila parishad at the top; the gram sabha (all village voters) watches over the panchayat.'
    step_by_step: 'Step 1: Village level: gram panchayat, sarpanch, gram sabha. Step 2: Block level: panchayat samiti. Step 3: District level: zila parishad. Step 4: Cities: municipality or corporation, mayor. Step 5: Rules from 1992: elections, reservations, one-third women.'
    real_world: Kerala's People's Plan Campaign in 1996 handed large funds to panchayats, which then decided their own roads, wells and schools.
  picture:
    kind: flow
    steps:
    - 'Gram sabha: all adult voters of the village'
    - 'Gram panchayat: led by the sarpanch'
    - 'Panchayat samiti: block or mandal level'
    - 'Zila parishad: district level'
    alt: Rural local government in India from the gram sabha and gram panchayat up to the panchayat samiti and zila parishad.
  activity:
    type: sort
    prompt: Rural or urban local government?
    bins:
    - Rural
    - Urban
    items:
    - label: Gram panchayat headed by a sarpanch
      bin: Rural
      clue: A village.
      why: Rural.
    - label: Panchayat samiti
      bin: Rural
      clue: Block level.
      why: Rural.
    - label: Zila parishad
      bin: Rural
      clue: District level for villages.
      why: Rural.
    - label: Municipal corporation headed by a mayor
      bin: Urban
      clue: A big city.
      why: Urban.
    - label: Municipality headed by a chairperson
      bin: Urban
      clue: A town.
      why: Urban.
    - label: Gram sabha of all village voters
      bin: Rural
      clue: Checks the panchayat.
      why: Rural.
  lesson:
    - teach: Decentralisation means taking power from the centre and state governments and giving it to local government. It helps because local people know local problems best and can take part directly in decisions. In 1992 the Constitution was amended (73rd and 74th) to make local government a strong third tier.
      check:
        prompt: Decentralisation moves power to…
        options:
        - Local government
        - The centre
        - Other countries
        answer: Local government
        why: Closer to the people.
    - teach: The 1992 amendment made regular elections compulsory, reserved seats for SCs, STs and OBCs, reserved at least one-third of seats for women, created State Election Commissions to hold local elections, and required states to share some powers and revenue.
      picture:
        kind: flow
        steps:
        - Gram sabha (all voters)
        - Gram panchayat (sarpanch)
        - Panchayat samiti (block)
        - Zila parishad (district)
        alt: 'Rural local government: the gram sabha of all voters oversees the gram panchayat led by a sarpanch, then the block-level panchayat samiti, then the district-level zila parishad.'
      check:
        prompt: At least what share of local seats is reserved for women?
        options:
        - One-third
        - One-half
        - One-tenth
        answer: One-third
        why: A key step for women's participation.
    - teach: 'Rural local government: each village has a gram panchayat headed by a sarpanch, supervised by the gram sabha (all the village''s voters). Panchayats of a block form the panchayat samiti; all samitis in a district form the zila parishad. Urban: municipalities in towns (chairperson) and municipal corporations in big cities (mayor). Problems remain: gram sabhas don''t meet often, and states give little power and money.'
      check:
        prompt: Who heads a municipal corporation?
        options:
        - Mayor
        - Sarpanch
        - Collector
        answer: Mayor
        why: The political head of a big city.
  items:
  - prompt: What is decentralisation?
    options:
    - Taking power from central and state governments and giving it to local government
    - Giving all power to the centre
    - Abolishing states
    - Giving power to the courts
    answer: Taking power from central and state governments and giving it to local government
    difficulty: 1
    hints:
    - '''De-centre''.'
    - Local bodies.
    solution: Decentralisation passes power down to local governments.
    mistakes: {"Giving all power to the centre": "s10_decentralise"}
  - prompt: At least what fraction of positions in local bodies is reserved for women? Give it as a decimal to two places.
    answer: '0.33'
    check: round(1/3, 2)
    difficulty: 2
    hints:
    - One-third.
    - 1 ÷ 3 ≈ 0.33.
    solution: At least one-third (about 0.33) of positions are reserved for women.
    mistakes: {"0.3": "s10_one_third", "0.5": "s10_one_third"}
  - prompt: 'The gram panchayat works under the supervision of the:'
    options:
    - Gram sabha
    - Zila parishad
    - Supreme Court
    - Parliament
    answer: Gram sabha
    difficulty: 2
    hints:
    - All voters in the village.
    - It reviews the budget.
    solution: The gram sabha, made of all voters, supervises the panchayat.
    mistakes: {"Zila parishad": "s10_gram_sabha"}
  - prompt: 'The head of a municipal corporation is the:'
    options:
    - Mayor
    - Sarpanch
    - Governor
    - Collector
    answer: Mayor
    difficulty: 1
    hints:
    - Big cities.
    - Sarpanch is village.
    solution: A municipal corporation is headed by the mayor.
    mistakes:
      Sarpanch: c10ss_local_heads
  - prompt: In which year was the constitutional amendment made to strengthen local government?
    answer: '1992'
    check: '1992'
    difficulty: 1
    hints:
    - 73rd and 74th amendments.
    - Early 1990s.
    solution: The 1992 amendments made local government a third tier.
    mistakes: {"1947": "s10_1992", "1950": "s10_1992"}
  - prompt: Who conducts panchayat and municipal elections?
    options:
    - The State Election Commission
    - The Election Commission of India
    - The Prime Minister
    - The gram sabha
    answer: The State Election Commission
    difficulty: 2
    hints:
    - Each state has one.
    - Not the national commission.
    solution: State Election Commissions conduct local body elections.
    mistakes:
      The Election Commission of India: c10ss_sec
  - prompt: Who heads a gram panchayat?
    options:
    - Sarpanch
    - Mayor
    - Collector
    - Governor
    answer: Sarpanch
    difficulty: 1
    hints:
    - The village head.
    - Elected by the villagers.
    solution: The gram panchayat is headed by the sarpanch (panch president).
    mistakes:
      Mayor: c10ss14_village_head
  - prompt: The block-level body of rural local government is the…
    options:
    - Panchayat samiti
    - Zila parishad
    - Gram sabha
    - Municipal corporation
    answer: Panchayat samiti
    difficulty: 2
    hints:
    - It sits between village and district.
    - Also called the mandal.
    solution: A group of gram panchayats forms a panchayat samiti at block level.
    mistakes:
      Zila parishad: c10ss14_local
  - prompt: All panchayat samitis in a district together form the…
    options:
    - Zila parishad
    - Gram sabha
    - Municipality
    - Legislative assembly
    answer: Zila parishad
    difficulty: 2
    hints:
    - The highest rural tier.
    - District level.
    solution: The zila parishad is the district-level body.
    mistakes:
      Gram sabha: c10ss14_local
  - prompt: Why is decentralisation useful?
    options:
    - Local people know local problems and can take part directly
    - It makes the centre stronger
    - It stops elections
    - It removes states
    answer: Local people know local problems and can take part directly
    difficulty: 1
    hints:
    - Who knows a village's needs best?
    - Direct participation.
    solution: Local decision-making uses local knowledge and deepens democracy.
    mistakes:
      It makes the centre stronger: s10_decentralise
  - prompt: Which amendment numbers made local government a third tier in 1992?
    options:
    - 73rd and 74th
    - 42nd and 44th
    - 1st and 2nd
    - 101st and 102nd
    answer: 73rd and 74th
    difficulty: 3
    hints:
    - One for rural, one for urban bodies.
    - Two numbers in the seventies.
    solution: The 73rd (panchayats) and 74th (municipalities) Amendments of 1992.
    mistakes:
      42nd and 44th: c10ss14_amend
  - prompt: Which seats are reserved in local bodies under the 1992 amendment?
    options:
    - For SCs, STs, OBCs, and at least one-third for women
    - Only for men
    - Only for the rich
    - None
    answer: For SCs, STs, OBCs, and at least one-third for women
    difficulty: 2
    hints:
    - Reservation helps weaker sections.
    - Women got a big share.
    solution: Seats are reserved for SCs, STs, OBCs, and at least a third for women.
    mistakes:
      None: s10_one_third
  - prompt: What is a big weakness of local government in India today?
    options:
    - Gram sabhas meet rarely and states share little power and money
    - There are no elections
    - Women cannot vote
    - It has too much money
    answer: Gram sabhas meet rarely and states share little power and money
    difficulty: 2
    hints:
    - Elections happen regularly now.
    - But are local bodies strong?
    solution: Irregular gram sabha meetings and too few resources limit local self-government.
    mistakes:
      It has too much money: c10ss14_local
  - prompt: Who heads a municipality in a small town?
    options:
    - Municipal chairperson
    - Mayor
    - Sarpanch
    - Chief Minister
    answer: Municipal chairperson
    difficulty: 2
    hints:
    - Big cities have a mayor.
    - Smaller towns have a different title.
    solution: A municipality is headed by the municipal chairperson.
    mistakes:
      Mayor: c10ss_local_heads
  - prompt: How many local government representatives are there in India, roughly?
    options:
    - About 36 lakh
    - About 500
    - About 10 000
    - About 1 crore 50 lakh
    answer: About 36 lakh
    difficulty: 3
    hints:
    - It is the largest experiment in democracy.
    - Millions, not thousands.
    solution: About 36 lakh elected representatives work in panchayats and municipalities.
    mistakes:
      About 500: c10ss14_local
