# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 2.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 14
title: Federalism
tips:
  c10ss_lists: 'Union: defence, currency, foreign affairs. State: police, agriculture. Concurrent: education, forests.'
  c10ss_coming_holding: 'Coming together: independent states join (USA). Holding together: a big country shares power with its parts (India).'
  c10ss_local_heads: Sarpanch heads the village panchayat; the mayor heads a municipal corporation.
  c10ss_sec: Local elections are run by each State Election Commission, not the Election Commission of India.
  s10_1992: "The 73rd and 74th Amendments came in the early 1990s."
  s10_courts: "The Governor is appointed by the centre. Who acts as an independent umpire?"
  s10_decentralise: "'De-centralise' means moving power away from the centre. Where does it go?"
  s10_eighth_schedule: "The Eighth Schedule began with 14 languages in 1950, and more were added in 1967, 1992 and 2003. Recall today's total."
  s10_gram_sabha: "The gram sabha is all voters of the village. Who supervises the panchayat?"
  s10_one_third: "One-third as a decimal to two places: 1 ÷ 3."
  s10_residuary: "Residuary subjects are not in any list. Who gets the power over them?"
concepts:
- code: cbse10ss.fed.features
  title: What makes India a federation
  notes: |
    Federalism divides power between a central authority and constituent units. Features: two or more levels of
    government; each has its own jurisdiction in legislation, taxation and administration; jurisdictions are
    specified in the constitution; fundamental provisions can't be changed by one level alone; courts
    interpret disputes; sources of revenue are specified. Coming together federations (USA, Switzerland,
    Australia) and holding together federations (India, Spain, Belgium). India's Constitution has three lists:
    Union List (defence, foreign affairs, banking, currency), State List (police, trade, agriculture,
    irrigation), Concurrent List (education, forests, trade unions, marriage, adoption, succession); residuary
    subjects go to the Union. Union territories (like Chandigarh, Lakshadweep, Delhi) are run by the centre.
    Practice: linguistic states (from 1956), language policy (Hindi plus 21 other Scheduled Languages, 22 in
    all; English continued), centre–state relations improved with coalition governments after 1990.
  explanations:
    text: In a federation, power is split between the central government and state governments, each with its own list of subjects written in the constitution. India's Constitution has a Union List, a State List and a Concurrent List, and courts settle disputes between the levels.
    visual: 'Draw three columns: Union List (defence, currency, foreign affairs), State List (police, agriculture), Concurrent List (education, forests, marriage). Residuary subjects like computer software go to the Union.'
    step_by_step: 'Step 1: Identify the subject. Step 2: National importance (defence, currency) → Union. Step 3: Local importance (police, agriculture) → State. Step 4: Shared interest (education, forests) → Concurrent. Step 5: New subjects not listed → Union (residuary).'
    real_world: When states were reorganised by language from 1956, Malayalam-speaking areas formed Kerala, which made governing easier and people felt more at home.
  picture:
    kind: compare
    columns:
    - title: Union List
      points:
      - Defence
      - Foreign affairs
      - Banking, currency
      - Communications
    - title: State List
      points:
      - Police
      - Trade within the state
      - Agriculture
      - Irrigation
    - title: Concurrent List
      points:
      - Education
      - Forests
      - Trade unions
      - Marriage, adoption
    alt: 'India''s three lists: Union (defence, foreign affairs, currency), State (police, agriculture, irrigation) and Concurrent (education, forests, marriage).'
  activity:
    type: sort
    prompt: Which list of the Constitution?
    bins:
    - Union List
    - State List
    - Concurrent List
    items:
    - label: Defence
      bin: Union List
      clue: One army for India.
      why: Union.
    - label: Banking and currency
      bin: Union List
      clue: One rupee.
      why: Union.
    - label: Police
      bin: State List
      clue: Each state.
      why: State.
    - label: Irrigation
      bin: State List
      clue: Local water.
      why: State.
    - label: Education
      bin: Concurrent List
      clue: Both can make laws.
      why: Concurrent.
    - label: Adoption and succession
      bin: Concurrent List
      clue: Both.
      why: Concurrent.
    - label: Computer software (not in any list)
      bin: Union List
      clue: Residuary subjects.
      why: Residuary powers go to the Union.
  items:
  - prompt: Which subject is in the Union List?
    options:
    - Defence
    - Police
    - Agriculture
    - Education
    answer: Defence
    difficulty: 1
    hints:
    - National importance.
    - Police is State.
    solution: Defence is a Union subject.
    mistakes:
      Police: c10ss_lists
  - prompt: Education is in which list?
    options:
    - Concurrent List
    - Union List
    - State List
    - Residuary subjects
    answer: Concurrent List
    difficulty: 1
    hints:
    - Both centre and state make laws.
    - Like forests.
    solution: Education is on the Concurrent List.
    mistakes:
      State List: c10ss_lists
  - prompt: Who makes laws on residuary subjects like computer software?
    options:
    - The Union government
    - State governments
    - Local governments
    - The Supreme Court
    answer: The Union government
    difficulty: 2
    hints:
    - Subjects not in any list.
    - Article 248.
    solution: The Union Parliament has the power to legislate on residuary subjects.
    mistakes: {"State governments": "s10_residuary"}
  - prompt: India is an example of which kind of federation?
    options:
    - Holding together
    - Coming together
    - Unitary
    - Confederation
    answer: Holding together
    difficulty: 2
    hints:
    - A large country divided its power among states.
    - USA came together.
    solution: India is a holding-together federation, where power was shared among states to keep the country united.
    mistakes:
      Coming together: c10ss_coming_holding
  - prompt: How many languages are in the Eighth Schedule of the Indian Constitution?
    answer: '22'
    check: 1 + 21
    difficulty: 2
    hints:
    - Hindi plus 21 others.
    - Count them.
    solution: 'Besides Hindi there are 21 other languages: 22 Scheduled Languages.'
    mistakes: {"18": "s10_eighth_schedule", "14": "s10_eighth_schedule"}
  - prompt: Who settles disputes between the centre and states over powers?
    options:
    - The courts (judiciary)
    - The Prime Minister
    - The Governor
    - The Election Commission
    answer: The courts (judiciary)
    difficulty: 1
    hints:
    - Interpret the constitution.
    - Umpire.
    solution: Courts interpret the constitution and settle disputes about powers.
    mistakes: {"The Governor": "s10_courts", "The Prime Minister": "s10_courts"}
- code: cbse10ss.fed.local
  title: Decentralisation and local government
  after:
  - cbse10ss.fed.features
  notes: |
    Decentralisation means taking power away from central and state governments and giving it to local
    government. Local bodies understand local problems and let people participate directly. The 1992
    constitutional amendment (73rd and 74th) made local government a third tier: regular elections are
    mandatory; seats reserved for SC, ST and OBC; at least one-third of positions reserved for women; State
    Election Commissions conduct elections; state governments must share some powers and revenue. Rural
    local government: gram panchayat (headed by sarpanch, accountable to the gram sabha of all voters),
    panchayat samiti (block or mandal), zila parishad (district). Urban: municipalities and municipal
    corporations, headed by chairperson or mayor. About 36 lakh elected representatives make India's the
    largest experiment in democracy. Problems: gram sabhas don't meet regularly; states haven't transferred
    enough powers and money.
  explanations:
    text: Decentralisation means passing power down to villages and towns, where people know their own problems best. Since 1992 India's Constitution guarantees regular elections for panchayats and municipalities, with a third of seats for women and reserved seats for weaker sections.
    visual: 'Draw a three-step pyramid for rural government: gram panchayat at the base, panchayat samiti in the middle, zila parishad at the top; the gram sabha (all village voters) watches over the panchayat.'
    step_by_step: 'Step 1: Village level: gram panchayat, sarpanch, gram sabha. Step 2: Block level: panchayat samiti. Step 3: District level: zila parishad. Step 4: Cities: municipality or corporation, mayor. Step 5: Rules from 1992: elections, reservations, one-third women.'
    real_world: Kerala's People's Plan Campaign in 1996 handed large funds to panchayats, which then decided their own roads, wells and schools.
  picture:
    kind: flow
    steps:
    - 'Gram sabha: all adult voters of the village'
    - 'Gram panchayat: led by the sarpanch'
    - 'Panchayat samiti: block or mandal level'
    - 'Zila parishad: district level'
    alt: Rural local government in India from the gram sabha and gram panchayat up to the panchayat samiti and zila parishad.
  activity:
    type: sort
    prompt: Rural or urban local government?
    bins:
    - Rural
    - Urban
    items:
    - label: Gram panchayat headed by a sarpanch
      bin: Rural
      clue: A village.
      why: Rural.
    - label: Panchayat samiti
      bin: Rural
      clue: Block level.
      why: Rural.
    - label: Zila parishad
      bin: Rural
      clue: District level for villages.
      why: Rural.
    - label: Municipal corporation headed by a mayor
      bin: Urban
      clue: A big city.
      why: Urban.
    - label: Municipality headed by a chairperson
      bin: Urban
      clue: A town.
      why: Urban.
    - label: Gram sabha of all village voters
      bin: Rural
      clue: Checks the panchayat.
      why: Rural.
  items:
  - prompt: What is decentralisation?
    options:
    - Taking power from central and state governments and giving it to local government
    - Giving all power to the centre
    - Abolishing states
    - Giving power to the courts
    answer: Taking power from central and state governments and giving it to local government
    difficulty: 1
    hints:
    - '''De-centre''.'
    - Local bodies.
    solution: Decentralisation passes power down to local governments.
    mistakes: {"Giving all power to the centre": "s10_decentralise"}
  - prompt: At least what fraction of positions in local bodies is reserved for women? Give it as a decimal to two places.
    answer: '0.33'
    check: round(1/3, 2)
    difficulty: 2
    hints:
    - One-third.
    - 1 ÷ 3 ≈ 0.33.
    solution: At least one-third (about 0.33) of positions are reserved for women.
    mistakes: {"0.3": "s10_one_third", "0.5": "s10_one_third"}
  - prompt: 'The gram panchayat works under the supervision of the:'
    options:
    - Gram sabha
    - Zila parishad
    - Supreme Court
    - Parliament
    answer: Gram sabha
    difficulty: 2
    hints:
    - All voters in the village.
    - It reviews the budget.
    solution: The gram sabha, made of all voters, supervises the panchayat.
    mistakes: {"Zila parishad": "s10_gram_sabha"}
  - prompt: 'The head of a municipal corporation is the:'
    options:
    - Mayor
    - Sarpanch
    - Governor
    - Collector
    answer: Mayor
    difficulty: 1
    hints:
    - Big cities.
    - Sarpanch is village.
    solution: A municipal corporation is headed by the mayor.
    mistakes:
      Sarpanch: c10ss_local_heads
  - prompt: In which year was the constitutional amendment made to strengthen local government?
    answer: '1992'
    check: '1992'
    difficulty: 1
    hints:
    - 73rd and 74th amendments.
    - Early 1990s.
    solution: The 1992 amendments made local government a third tier.
    mistakes: {"1947": "s10_1992", "1950": "s10_1992"}
  - prompt: Who conducts panchayat and municipal elections?
    options:
    - The State Election Commission
    - The Election Commission of India
    - The Prime Minister
    - The gram sabha
    answer: The State Election Commission
    difficulty: 2
    hints:
    - Each state has one.
    - Not the national commission.
    solution: State Election Commissions conduct local body elections.
    mistakes:
      The Election Commission of India: c10ss_sec
