# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 1.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 13
title: Power Sharing
tips:
  c10ss_belgium_shares: "In Belgium the Dutch speakers are the majority, French speakers a large minority, German speakers about 1%. Read the figure in the chapter's opening table."
  c10ss13_brussels: "Across Belgium one group is the majority, but the capital city is different. Which group lives in larger numbers in Brussels itself?"
  c10ss_horizontal_vertical: 'Horizontal: among organs at one level. Vertical: among levels (centre, state, local).'
  c10ss_prudential_moral: Prudential reasons are about good results (less conflict); the moral reason is that it is the spirit of democracy.
  s10_community_govt: "Belgium has a central government, regional governments and one more kind, by language community."
  s10_majoritarianism: "The word comes from 'majority'. What does it ignore?"
  s10_sinhala_act: "The Sinhala-only Act came in the mid-1950s, after independence in 1948."
  c10ss13_indep: "The Sinhala-only Act came several years after independence. Independence came just after India's."
  c10ss13_forms: Power can be shared among organs of government (legislature, executive, judiciary), among levels (central, state, local), among social groups, and among parties and pressure groups.
  c10ss13_srilanka: "After independence Sri Lanka's leaders favoured the majority community in language, jobs and religion. How did the minority respond?"
  c10ss13_belgium: 'Belgium chose to accommodate all groups: equal ministers in the centre, powers to states, a special government in Brussels and community governments.'
  c10ss13_checks: Checks and balances mean each organ keeps a watch on the others, so no one has unlimited power.
concepts:
- code: cbse10ss.power.sharing
  title: Why and how power is shared
  notes: |
    Belgium: Dutch-speaking 59% (Flemish region), French-speaking 40% (Wallonia), German-speaking 1%; Brussels
    is 80% French-speaking, 20% Dutch. Belgium amended its constitution four times between 1970 and 1993:
    equal numbers of Dutch and French ministers in the central government; powers given to state governments;
    Brussels has a separate government with equal representation; a 'community government' elected by people of
    one language community handles culture, education and language. Sri Lanka: Sinhala 74%, Tamil 18% (Sri
    Lankan Tamils 13%, Indian Tamils 5%). The 1956 Act made Sinhala the only official language; policies
    favoured Sinhala applicants for jobs and university places and protected Buddhism. Distrust led to a civil
    war (ended 2009) — majoritarianism. Reasons for power sharing: prudential (reduces conflict, ensures
    stability) and moral (the spirit of democracy). Forms: horizontal (legislature, executive, judiciary with
    checks and balances); vertical (central, state, local governments: federal); among social groups (community
    government, reserved seats); among parties, pressure groups and movements (coalitions).
  explanations:
    text: Belgium and Sri Lanka faced the same problem, communities divided by language, but chose opposite paths. Belgium shared power among its communities and stayed united; Sri Lanka favoured the majority and fell into civil war. Sharing power reduces conflict and is also the right thing in a democracy.
    visual: 'Draw two roads from ''a divided society'': one marked ''accommodation'' leading to a stable Belgium, one marked ''majoritarianism'' leading to conflict in Sri Lanka.'
    step_by_step: 'Step 1: Identify the groups and their shares. Step 2: See whether the majority grabbed power or shared it. Step 3: Name the result: stability or conflict. Step 4: Name the form of power sharing: horizontal, vertical, among groups, or among parties.'
    real_world: India's coalition governments, where several parties share ministries, are an example of power sharing among political parties.
  picture:
    kind: compare
    columns:
    - title: Belgium
      points:
      - Dutch 59%, French 40%, German 1%
      - Equal Dutch and French ministers
      - Community government for culture
      - Stayed united
    - title: Sri Lanka
      points:
      - Sinhala 74%, Tamil 18%
      - '1956: Sinhala only official language'
      - Majority favoured in jobs, colleges
      - Distrust, civil war
    alt: Belgium shared power among language communities and stayed united; Sri Lanka followed majoritarianism and suffered civil war.
  activity:
    type: sort
    prompt: Belgium or Sri Lanka?
    bins:
    - Belgium (accommodation)
    - Sri Lanka (majoritarianism)
    items:
    - label: Equal numbers of Dutch and French ministers
      bin: Belgium (accommodation)
      clue: Both language groups share power.
      why: Belgium.
    - label: A community government for each language group
      bin: Belgium (accommodation)
      clue: Culture and education by community.
      why: Belgium.
    - label: 1956 Act makes one language the only official one
      bin: Sri Lanka (majoritarianism)
      clue: Only Sinhala.
      why: Sri Lanka.
    - label: Jobs and university places favour the majority
      bin: Sri Lanka (majoritarianism)
      clue: Tamils felt left out.
      why: Sri Lanka.
    - label: Brussels has its own government with equal representation
      bin: Belgium (accommodation)
      clue: The capital.
      why: Belgium.
    - label: Distrust leads to civil war
      bin: Sri Lanka (majoritarianism)
      clue: Ended in 2009.
      why: Sri Lanka.
  lesson:
    - teach: 'Belgium has Dutch speakers (59%), French speakers (40%) and German speakers (1%). In Brussels, French speakers are the majority. Belgium''s leaders changed the constitution four times to share power: equal Dutch and French ministers in the central government, more power to states, equal representation in Brussels, and a community government for each language group.'
      picture:
        kind: bars
        unit: '% of Belgium''s people'
        bars:
        - label: Dutch
          value: 59
        - label: French
          value: 40
        - label: German
          value: 1
        alt: 'Belgium''s language groups: Dutch speakers 59%, French speakers 40%, German speakers 1%.'
      check:
        prompt: Which language group is the majority in Belgium overall?
        options:
        - Dutch
        - French
        - German
        answer: Dutch
        why: 59% of people.
    - teach: 'Sri Lanka took a different path. After independence (1948), the Sinhala majority government made Sinhala the only official language (1956), favoured Sinhala applicants and protected Buddhism. Sri Lankan Tamils felt alienated, and the conflict became a civil war. This is majoritarianism: the majority rules as it wishes, ignoring minorities.'
      check:
        prompt: What did the 1956 Act in Sri Lanka do?
        options:
        - Made Sinhala the only official language
        - Made Tamil official
        - Gave Tamils autonomy
        answer: Made Sinhala the only official language
        why: It disregarded Tamil.
    - teach: 'Power sharing is good for prudential reasons (it reduces conflict and keeps the system stable) and moral reasons (it is the spirit of democracy: people affected have a say). Forms: horizontal (among legislature, executive, judiciary: checks and balances), vertical (among central, state and local governments: federal), among social groups (community government, reserved seats), and among parties, pressure groups and movements (coalitions).'
      check:
        prompt: Sharing power among central, state and local governments is…
        options:
        - Vertical
        - Horizontal
        - Coalition
        answer: Vertical
        why: Different levels.
  items:
  - prompt: What percentage of Belgium's people speak Dutch?
    answer: '59'
    check: 100 - 40 - 1
    difficulty: 1
    hints:
    - Majority in the country.
    - French is 40%.
    solution: Dutch speakers are 59% of Belgium's population.
    mistakes:
      '40': c10ss_belgium_shares
  - prompt: In which year did Sri Lanka pass an Act recognising Sinhala as the only official language?
    options:
    - '1956'
    - '1948'
    - '1970'
    - '1993'
    answer: '1956'
    difficulty: 1
    hints:
    - Eight years after independence.
    - 1948 was independence.
    solution: The 1956 Act made Sinhala the only official language.
    mistakes: {"1948": "s10_sinhala_act"}
  - prompt: What is majoritarianism?
    options:
    - The belief that the majority community should rule as it wishes, ignoring minorities
    - Sharing power equally among all groups
    - Rule by the judiciary
    - A coalition of parties
    answer: The belief that the majority community should rule as it wishes, ignoring minorities
    difficulty: 2
    hints:
    - Sri Lanka's policies.
    - Disregarding wishes of the minority.
    solution: Majoritarianism lets the majority rule in any way it wants, disregarding minorities.
    mistakes: {"Sharing power equally among all groups": "s10_majoritarianism"}
  - prompt: 'Power shared among the legislature, executive and judiciary is called:'
    options:
    - Horizontal distribution of power
    - Vertical distribution of power
    - Community government
    - Coalition government
    answer: Horizontal distribution of power
    difficulty: 2
    hints:
    - Organs at the same level.
    - Checks and balances.
    solution: Sharing among organs at the same level is horizontal distribution.
    mistakes:
      Vertical distribution of power: c10ss_horizontal_vertical
  - prompt: What is the 'community government' in Belgium?
    options:
    - A government elected by people of one language community, dealing with culture, education and language
    - The central government in Brussels
    - A government of the German-speaking people only
    - A local village council
    answer: A government elected by people of one language community, dealing with culture, education and language
    difficulty: 2
    hints:
    - Not tied to a territory.
    - Each language group.
    solution: It is elected by people belonging to one language community and handles cultural, educational and language matters.
    mistakes: {"The central government in Brussels": "s10_community_govt"}
  - prompt: Which is a moral reason for power sharing?
    options:
    - It is the very spirit of democracy
    - It reduces conflict
    - It brings political stability
    - It saves money
    answer: It is the very spirit of democracy
    difficulty: 2
    hints:
    - Prudential reasons are about results.
    - Moral reasons are about values.
    solution: The moral reason is that sharing power is the essence of democracy; reducing conflict is a prudential reason.
    mistakes:
      It reduces conflict: c10ss_prudential_moral
  - prompt: In Brussels, which language group is the majority?
    options:
    - French speakers
    - Dutch speakers
    - German speakers
    - English speakers
    answer: French speakers
    difficulty: 2
    hints:
    - It is different from the country as a whole.
    - About 80% of Brussels.
    solution: French speakers are the majority in Brussels, though Dutch speakers are the national majority.
    mistakes:
      Dutch speakers: c10ss13_brussels
  - prompt: In which year did Sri Lanka become independent?
    answer: '1948'
    check: '1948'
    difficulty: 2
    hints:
    - Just after India.
    - Late 1940s.
    solution: Sri Lanka became independent in 1948.
    mistakes:
      '1956': c10ss13_indep
      '1947': c10ss13_indep
  - prompt: Which of these is an example of 'checks and balances'?
    options:
    - Judges can check laws made by the legislature
    - One person holds all powers
    - The army runs the courts
    - States have no powers
    answer: Judges can check laws made by the legislature
    difficulty: 2
    hints:
    - Each organ watches another.
    - No organ has unlimited power.
    solution: Courts can review laws, so the legislature's power is checked.
    mistakes:
      One person holds all powers: c10ss13_checks
  - prompt: Power shared among different levels of government is…
    options:
    - Vertical division of power
    - Horizontal division of power
    - Coalition
    - Majoritarianism
    answer: Vertical division of power
    difficulty: 1
    hints:
    - Levels are higher and lower.
    - Up and down.
    solution: Sharing among centre, state and local levels is vertical.
    mistakes:
      Horizontal division of power: c10ss_horizontal_vertical
  - prompt: When two or more parties join to form a government, it is called…
    options:
    - A coalition government
    - A community government
    - A federal government
    - A dictatorship
    answer: A coalition government
    difficulty: 1
    hints:
    - Parties share power.
    - No one party has a majority.
    solution: An alliance of parties forming a government is a coalition.
    mistakes:
      A community government: c10ss13_forms
  - prompt: What was the result of Sri Lanka's majoritarian policies?
    options:
    - Tamils felt alienated and civil war broke out
    - Peace between all groups
    - Tamil became the only language
    - Belgium invaded
    answer: Tamils felt alienated and civil war broke out
    difficulty: 2
    hints:
    - The minority felt left out.
    - Tension turned violent.
    solution: Distrust grew into a long civil war.
    mistakes:
      Peace between all groups: c10ss13_srilanka
  - prompt: In Belgium's central government, how are Dutch and French-speaking ministers shared?
    options:
    - In equal numbers
    - Only Dutch
    - Only French
    - By lottery
    answer: In equal numbers
    difficulty: 2
    hints:
    - No single group can decide alone.
    - Fair to both big groups.
    solution: The constitution requires equal numbers of Dutch and French-speaking ministers.
    mistakes:
      Only Dutch: c10ss13_belgium
  - prompt: Which is a prudential reason for power sharing?
    options:
    - It reduces conflict between social groups
    - It is the very spirit of democracy
    - It is in religious texts
    - It makes the majority stronger
    answer: It reduces conflict between social groups
    difficulty: 2
    hints:
    - Prudential means careful about results.
    - What good outcome does it bring?
    solution: Reducing conflict and keeping stability are prudential reasons.
    mistakes:
      It is the very spirit of democracy: c10ss_prudential_moral
  - prompt: Interest groups like traders, farmers and workers influencing decisions shows power sharing among…
    options:
    - Pressure groups and movements
    - Levels of government
    - Organs of government
    - Language groups only
    answer: Pressure groups and movements
    difficulty: 2
    hints:
    - They don't run governments.
    - They push for their interests.
    solution: Pressure groups and movements share in power by influencing decisions.
    mistakes:
      Organs of government: c10ss13_forms
