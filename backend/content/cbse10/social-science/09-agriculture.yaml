    - Only vegetables are grown
    answer: A single crop is grown on a large area for sale
    difficulty: 2
    hints:
    - Tea, coffee, rubber.
    - Needs capital and labour.
    solution: Plantations grow one crop, like tea or rubber, on a large scale for the market.
    mistakes: {"Many crops are grown for the family": "s10_plantation"}
  - prompt: Assam, West Bengal and Odisha grow how many crops of paddy in a year?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Aus, aman and boro.
    - Count them.
    solution: 'They grow three paddy crops: aus, aman and boro.'
    mistakes: {"1": "s10_three_paddy", "2": "s10_three_paddy"}
  - prompt: Which is a kharif crop?
    options:
    - Cotton
    - Wheat
    - Gram
    - Mustard
    answer: Cotton
    difficulty: 1
    hints:
    - Kharif crops are sown with the monsoon.
    - Wheat and gram are winter crops.
    solution: 'Cotton is sown at the start of the monsoon: kharif.'
    mistakes:
      Wheat: c10ss_rabi_kharif
  - prompt: When are rabi crops harvested?
    options:
    - April to June
    - September to October
    - December to January
    - Only in the monsoon
    answer: April to June
    difficulty: 2
    hints:
    - They are sown in winter.
    - Harvest comes in spring and early summer.
    solution: Rabi crops are sown October–December and harvested April–June.
    mistakes:
      September to October: c10ss9_season_calendar
  - prompt: In which type of farming is land cleared, farmed for a few years and then left so that it recovers?
    options:
    - Slash and burn (primitive subsistence)
    - Commercial farming
    - Plantation farming
    - Intensive subsistence farming
    answer: Slash and burn (primitive subsistence)
    difficulty: 1
    hints:
    - Forest is burnt to clear it.
    - Farmers then move on.
    solution: Slash and burn farming moves to new patches when the soil loses fertility.
    mistakes:
      Commercial farming: c10ss9_farm_types
  - prompt: What is intensive subsistence farming?
    options:
    - Using lots of labour and inputs on a small plot to feed the family
    - Growing one crop on a huge estate
