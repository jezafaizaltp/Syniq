# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 4.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 9
title: Agriculture
tips:
  c10ss_rabi_kharif: "Kharif crops are sown at the start of the monsoon and need lots of water; rabi crops are sown in winter and harvested in spring. When is the crop sown?"
  c10ss_revolutions: 'Green Revolution: grains. White Revolution (Operation Flood): milk.'
  s10_china_rice: "India is second. Which neighbour grows the most rice?"
  s10_golden_fibre: "Cotton is 'white gold'. Jute's nickname comes from its shiny yellow-brown colour."
  c10ss9_deccan: "Jute grows in the wet Bengal delta, not on the dry Deccan. Which fibre crop gives black soil its other name?"
  s10_jhum: "Jhumming means clearing a patch, farming it, then moving on."
  s10_plantation: "Tea and rubber estates are plantations. How many crops, and for whom?"
  s10_pulses: "Pulses are legumes. What do their roots do for the soil?"
  s10_ragi: "Maize is mostly a starch and fodder crop. Which small, reddish millet from Karnataka is known as a nutrition powerhouse?"
  s10_rice_rain: "Rice grows in standing water. It needs heavy rain."
  s10_three_paddy: "In these wet eastern states paddy grows in the summer, the monsoon and the winter. Name the seasons and count."
  s10_zaid: "Zaid crops grow in the short summer season between rabi and kharif. Wheat is rabi."
  c10ss9_farm_types: Primitive subsistence farming uses simple tools on small plots for the family; intensive subsistence farming uses heavy inputs on small plots; commercial farming grows crops to sell.
  c10ss9_season_calendar: Rabi crops are sown in winter and harvested in spring; kharif crops are sown with the monsoon; zaid crops fill the short summer gap.
  c10ss9_crop_needs: 'Match the crop to its climate: some need heavy rain and heat, some cool winters, some warm days and well-drained hill slopes.'
  c10ss9_reforms: After independence the government tried land reforms, the Green and White Revolutions, crop insurance, Kisan Credit Cards and minimum support prices.
  c10ss9_fibres: "Silk comes from silkworms fed on mulberry leaves. Horticulture is about fruit and flowers; the word you want starts with a root that means silk."
  c10ss9_summer_gap: Zaid crops fill the short summer gap. This crop grows right through the winter months. Which season is that?
  c10ss9_who_eats: Ask who the crops are for and what happens to the patch after a few years. Is anything sold, and does the family stay?
concepts:
- code: cbse10ss.agri.types
  title: Types of farming and cropping seasons
  notes: |
    Farming types: primitive subsistence (slash and burn, shifting cultivation: jhumming in the north-east,
    bewar in MP, podu in Andhra/Odisha), intensive subsistence (high inputs on small plots in densely populated
    areas), commercial (high-yield seeds, fertilisers, for sale; plantations of tea, coffee, rubber, sugarcane,
    banana). Cropping seasons: rabi (sown October–December, harvested April–June: wheat, barley, peas, gram,
    mustard; western disturbances help), kharif (sown with the monsoon, harvested September–October: paddy,
    maize, jowar, bajra, cotton, jute, groundnut, soyabean), zaid (short summer season: watermelon, muskmelon,
    cucumber, fodder). In Assam, West Bengal and Odisha, three paddy crops (aus, aman, boro) are grown.
  explanations:
    text: Indian farmers grow different crops in different seasons. Kharif crops like rice are sown with the monsoon rains; rabi crops like wheat are sown in winter; zaid crops like watermelon fill the short summer in between. Farming can be simple subsistence for the family or commercial for sale.
    visual: Draw a year as a circle. Mark June–October green for kharif (rice, cotton), November–April gold for rabi (wheat, mustard), and the short summer gap red for zaid (watermelon).
    step_by_step: 'Step 1: Note when the crop is sown. Step 2: With the monsoon (June–July) → kharif. Step 3: In winter (Oct–Dec) → rabi. Step 4: Between rabi and kharif in summer → zaid.'
    real_world: 'Punjab''s farmers grow wheat in winter and rice in the monsoon on the same land: one rabi and one kharif crop each year.'
  picture:
    kind: compare
    columns:
    - title: Kharif
      points:
      - 'Sown: June–July'
      - 'Harvest: Sept–Oct'
      - Rice, maize, cotton, jute
    - title: Rabi
      points:
      - 'Sown: Oct–Dec'
      - 'Harvest: April–June'
      - Wheat, barley, gram, mustard
    - title: Zaid
      points:
      - Short summer season
      - Between rabi and kharif
      - Watermelon, cucumber, fodder
    alt: 'India''s three cropping seasons: kharif sown with the monsoon (rice, cotton), rabi sown in winter (wheat, mustard), and zaid in summer (watermelon).'
  activity:
    type: sort
    prompt: Rabi, kharif or zaid?
    bins:
    - Rabi
    - Kharif
    - Zaid
    items:
    - label: Wheat
      bin: Rabi
      clue: Sown October–December.
      why: Rabi.
    - label: Mustard
      bin: Rabi
      clue: A winter crop.
      why: Rabi.
    - label: Paddy
      bin: Kharif
      clue: Sown with the monsoon.
      why: Kharif.
    - label: Cotton
      bin: Kharif
      clue: Harvested September–October.
      why: Kharif.
    - label: Watermelon
      bin: Zaid
      clue: Short summer season.
      why: Zaid.
    - label: Cucumber
      bin: Zaid
      clue: Summer.
      why: Zaid.
  lesson:
    - teach: 'Agriculture is India''s oldest economic activity; about two-thirds of people depend on it. Types: primitive subsistence farming (slash and burn, called jhumming in the north-east; small plots, simple tools, family needs), intensive subsistence farming (high inputs on small land, where population is dense) and commercial farming (high yields for sale, like wheat in Punjab). Plantation farming grows one crop on a large estate, like tea or rubber.'
      picture:
        kind: compare
        columns:
        - title: Primitive subsistence
          points:
          - Slash and burn
          - Simple tools
          - For the family
        - title: Intensive subsistence
          points:
          - Small land
          - Many inputs and labour
        - title: Commercial
          points:
          - High-yield seeds, fertilisers
          - Grown for sale
        alt: Primitive subsistence farming uses slash and burn and simple tools for the family; intensive subsistence farming uses many inputs on small land; commercial farming uses high-yield seeds and fertilisers to grow for sale.
      check:
        prompt: Slash and burn farming is…
        options:
        - Primitive subsistence
        - Commercial
        - Plantation
        answer: Primitive subsistence
        why: Land is cleared, farmed, then left.
      ways:
      - style: step_by_step
        teach: 'Spot the type of farming. Step 1: Is the food mainly for the family? Then it is subsistence. Step 2: Simple tools on a patch that is later left? Primitive. Step 3: Small plot, lots of labour and inputs? Intensive. Step 4: Grown mainly to sell, with machines and fertilisers? Commercial.'
      - style: real_world
        teach: A tea estate in Munnar grows only tea on a huge area, with hired workers and its own factory, and sells the tea far away. That is plantation farming.
    - teach: 'India has three cropping seasons. Rabi: sown October–December, harvested April–June (wheat, barley, peas, gram, mustard). Kharif: sown with the monsoon, harvested September–October (paddy, maize, jowar, bajra, tur, cotton, jute, groundnut). Zaid: a short summer season (watermelon, muskmelon, cucumber, fodder).'
      check:
        prompt: Mustard is a … crop.
        options:
        - Rabi
        - Kharif
        - Zaid
        answer: Rabi
        why: Sown in winter.
      ways:
      - style: visual
        teach: India's three cropping seasons, from sowing to harvest.
        picture:
          kind: compare
          columns:
          - title: Rabi
            points:
            - sown Oct–Dec
            - harvested Apr–Jun
            - wheat, gram, mustard
          - title: Kharif
            points:
            - sown with the monsoon
            - harvested Sep–Oct
            - rice, maize, cotton
          - title: Zaid
            points:
            - short summer gap
            - between rabi and kharif
            - melons, vegetables
          alt: 'Rabi crops are sown October to December and harvested April to June: wheat, gram, mustard. Kharif crops are sown with the monsoon and harvested September to October: rice, maize, cotton. Zaid crops grow in the short summer between them: melons and vegetables.'
      - style: real_world
        teach: In March and April, vegetable markets fill with watermelons and cucumbers. These quick summer crops grow between the winter and monsoon harvests.
    - teach: 'Western disturbances (winter rain from the west) help rabi crops in the north. Green Revolution technology spread rabi crops in Punjab, Haryana and western UP. In Assam, West Bengal and Odisha three crops of paddy are grown a year: aus, aman and boro.'
      check:
        prompt: Winter rain from western disturbances helps…
        options:
        - Rabi crops
        - Kharif crops
        - Zaid crops
        answer: Rabi crops
        why: They grow in winter.
      ways:
      - style: visual
        teach: Why the north-west became a big wheat-growing region, step by step.
        picture:
          kind: flow
          steps:
          - Cool winters
          - Winter rain from the west
          - Good canals and tubewells
          - New high-yield seeds
          - Big rabi harvests
          alt: Cool winters, winter rain from the west, good canals and tubewells, and new high-yield seeds together give big rabi harvests in the north-west.
      - style: step_by_step
        teach: 'How three paddy crops fit into one year in eastern India. Step 1: One crop grows in early summer. Step 2: A second grows with the monsoon. Step 3: A third grows in winter. Step 4: Heavy rain and warm weather make this possible.'
  items:
  - prompt: Wheat is a crop of which season?
    options:
    - Rabi
    - Kharif
    - Zaid
    - All seasons
    answer: Rabi
    difficulty: 1
    hints:
    - Sown in winter.
    - Harvested in spring.
    solution: 'Wheat is sown in winter and harvested in April–June: a rabi crop.'
    mistakes:
      Kharif: c10ss_rabi_kharif
  - prompt: Rice (paddy) is mainly a crop of which season?
    options:
    - Kharif
    - Rabi
    - Zaid
    - Winter only
    answer: Kharif
    difficulty: 1
    hints:
    - It needs lots of water.
    - Sown with the monsoon.
    solution: 'Paddy is sown with the monsoon: a kharif crop.'
    mistakes:
      Rabi: c10ss_rabi_kharif
  - prompt: '''Jhumming'' in the north-eastern states is a kind of:'
    options:
    - Slash and burn (shifting) agriculture
    - Plantation farming
    - Intensive subsistence farming
    - Commercial dairy farming
    answer: Slash and burn (shifting) agriculture
    difficulty: 2
    hints:
    - Clear a patch, farm it, move on.
    - Primitive subsistence.
    solution: 'Jhumming is shifting cultivation: forest is cleared and burnt, farmed, then left to recover.'
    mistakes: {"Plantation farming": "s10_jhum"}
  - prompt: Which is a zaid crop?
    options:
    - Watermelon
    - Wheat
    - Rice
    - Mustard
    answer: Watermelon
    difficulty: 1
    hints:
    - Grown in the short summer season.
    - Melons and cucumbers.
    solution: Watermelon is grown in the zaid season.
    mistakes: {"Wheat": "s10_zaid", "Mustard": "s10_zaid"}
  - prompt: 'Plantation agriculture is a type of commercial farming in which:'
    options:
    - "A single crop is grown on a large area for sale"
    - "Many crops are grown just to feed the family"
    - "Farmers move from place to place each year"
    - "Only vegetables are grown on small plots"
    answer: A single crop is grown on a large area for sale
    difficulty: 2
    hints:
    - Tea, coffee, rubber.
    - Needs capital and labour.
    solution: Plantations grow one crop, like tea or rubber, on a large scale for the market.
    mistakes: {"Many crops are grown just to feed the family": "s10_plantation"}
  - prompt: Assam, West Bengal and Odisha grow how many crops of paddy in a year?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Aus, aman and boro.
    - Count them.
    solution: 'They grow three paddy crops: aus, aman and boro.'
    mistakes: {"1": "s10_three_paddy", "2": "s10_three_paddy"}
  - prompt: Which is a kharif crop?
    options:
    - Cotton
    - Wheat
    - Gram
    - Mustard
    answer: Cotton
    difficulty: 1
    hints:
    - Kharif crops are sown with the monsoon.
    - Wheat and gram are winter crops.
    solution: 'Cotton is sown at the start of the monsoon: kharif.'
    mistakes:
      Wheat: c10ss_rabi_kharif
  - prompt: When are rabi crops harvested?
    options:
    - April to June
    - September to October
    - December to January
    - Only in the monsoon
    answer: April to June
    difficulty: 2
    hints:
    - They are sown in winter.
    - Harvest comes in spring and early summer.
    solution: Rabi crops are sown October–December and harvested April–June.
    mistakes:
      September to October: c10ss9_season_calendar
  - prompt: In which type of farming is land cleared, farmed for a few years and then left so that it recovers?
    options:
    - "Slash and burn (primitive subsistence)"
    - "Commercial farming with machines and fertilisers"
    - "Plantation farming of one crop for sale"
    - "Intensive subsistence farming on small plots"
    answer: Slash and burn (primitive subsistence)
    difficulty: 1
    hints:
    - Forest is burnt to clear it.
    - Farmers then move on.
    solution: Slash and burn farming moves to new patches when the soil loses fertility.
    mistakes:
      "Commercial farming with machines and fertilisers": c10ss9_farm_types
  - prompt: What is intensive subsistence farming?
    options:
    - "Using lots of labour and inputs on a small plot to feed the family"
    - "Growing one crop on a huge estate with hired workers for sale"
    - "Burning a patch of forest, farming it and then moving on"
    - "Farming only for export, using big machines and few workers"
    answer: Using lots of labour and inputs on a small plot to feed the family
    difficulty: 2
    hints:
    - Found where many people share little land.
    - '''Intensive'' means using a lot.'
    solution: Farmers use high inputs and labour on small land to get the most from it.
    mistakes:
      "Growing one crop on a huge estate with hired workers for sale": c10ss9_farm_types
  - prompt: Which of these is a zaid crop?
    options:
    - Cucumber
    - Wheat
    - Rice
    - Barley
    answer: Cucumber
    difficulty: 1
    hints:
    - Zaid is the short summer season.
    - Melons and vegetables grow then.
    solution: Cucumber (with watermelon and muskmelon) is a zaid crop.
    mistakes:
      Wheat: s10_zaid
  - prompt: What are the three paddy crops of Assam, West Bengal and Odisha called?
    options:
    - Aus, aman and boro
    - Rabi, kharif and zaid
    - Jowar, bajra and ragi
    - Khadar, bangar and regur
    answer: Aus, aman and boro
    difficulty: 3
    hints:
    - Local names for three paddy crops.
    - Not the names of seasons.
    solution: The three paddy crops are aus, aman and boro.
    mistakes:
      Rabi, kharif and zaid: s10_three_paddy
  - prompt: In which states is commercial farming of rice most common?
    options:
    - Punjab and Haryana
    - Mizoram and Nagaland
    - Rajasthan and Gujarat
    - Sikkim and Arunachal
    answer: Punjab and Haryana
    difficulty: 2
    hints:
    - In some states rice is grown to sell, not eat.
    - Green Revolution states.
    solution: In Punjab and Haryana rice is mostly a commercial crop.
    mistakes:
      Mizoram and Nagaland: s10_jhum
  - prompt: About what fraction of India's people depend on agriculture for their living?
    options:
    - About two-thirds
    - About one-tenth
    - Almost none
    - All of them
    answer: About two-thirds
    difficulty: 2
    hints:
    - India is an agricultural country.
    - More than half.
    solution: About two-thirds of the population is engaged in agriculture.
    mistakes:
      About one-tenth: c10ss9_farm_types
  - prompt: Which rain helps rabi crops in north-western India?
    options:
    - "Western temperate cyclones (western disturbances) in winter"
    - "The south-west monsoon arriving in June and July"
    - "Summer thunderstorms in April and May over the plains"
    - "Cyclones from the Bay of Bengal in October"
    answer: Western temperate cyclones (western disturbances) in winter
    difficulty: 3
    hints:
    - Rabi crops grow in winter.
    - This rain comes from the west.
    solution: Winter rain from western disturbances helps wheat and other rabi crops.
    mistakes:
      "The south-west monsoon arriving in June and July": c10ss9_season_calendar
  - prompt: 'Assertion (A): Rabi crops are grown in winter in north and north-western India.

      Reason (R): Winter rain from western temperate cyclones helps these crops grow.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The winter rains from western disturbances help rabi crops like wheat. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A farmer in Punjab sows a crop in November and harvests it in April. The crop needs cool weather while growing and sun at ripening. Which crop is it most likely to be?'
    options:
    - Wheat
    - Rice
    - Watermelon
    answer: Wheat
    hints:
    - Sown in winter, harvested in spring.
    - Which season is that?
    solution: Sown in winter and harvested in spring makes it a rabi crop; wheat fits the cool-then-sunny needs.
    mistakes:
      Rice: c10ss_rabi_kharif
      Watermelon: c10ss9_summer_gap
    exam: case
    difficulty: 2
  - prompt: 'Situation: In a hilly area of Mizoram, a family clears a patch of forest, burns it, grows crops for three years and then moves to a new patch. What type of farming is this?'
    options:
    - "Primitive subsistence (slash and burn)"
    - "Commercial farming with machines"
    - "Plantation farming of one crop"
    answer: Primitive subsistence (slash and burn)
    hints:
    - Who eats the crops?
    - What happens to the patch afterwards?
    solution: Clearing, farming and moving on is slash and burn, a kind of primitive subsistence farming (jhumming in the north-east).
    mistakes:
      "Commercial farming with machines": c10ss9_who_eats
      "Plantation farming of one crop": s10_plantation
    exam: competency
    difficulty: 2
- code: cbse10ss.agri.crops
  title: Major crops and reforms
  after:
  - cbse10ss.agri.types
  notes: |
    Rice: kharif; high temperature (above 25°C), high humidity, rainfall above 100 cm; West Bengal, UP, Punjab.
    India is the second-largest producer of rice in the world after China. Wheat: rabi; cool growing season,
    50–75 cm rain; Ganga–Satluj plains and black soil of the Deccan. Millets (jowar, bajra, ragi) are very
    nutritious; ragi is rich in iron, calcium and roughage. Maize grows in kharif (and rabi in Bihar). Pulses
    fix nitrogen in the soil. Sugarcane: tropical and subtropical, 21–27°C, 75–100 cm. Tea: tropical and
    subtropical, warm and moist frost-free climate, deep fertile soil (Assam, Darjeeling, Nilgiris). Coffee:
    Arabica variety, Nilgiris in Karnataka, Kerala, Tamil Nadu. Rubber: Kerala, Karnataka, Tamil Nadu, Andaman.
    Cotton: black soil of the Deccan, 210 frost-free days. Jute ('golden fibre'): West Bengal. Reforms:
    abolition of zamindari, land consolidation, the Green Revolution (HYV seeds) and White Revolution
    (Operation Flood for milk), Kisan Credit Card, crop insurance, minimum support price.
  explanations:
    text: Each crop needs its own climate and soil. Rice needs heat and heavy rain; wheat needs a cool season and moderate rain; tea needs warm, wet hill slopes; cotton needs black soil and a long frost-free season. After independence, reforms like the Green Revolution raised food production.
    visual: 'Draw a chart of four crops with thermometer and rain-gauge icons: rice (hot, very wet), wheat (cool, moderate), cotton (warm, black soil), tea (warm, wet, slopes).'
    step_by_step: 'Step 1: Note the crop. Step 2: Recall its temperature and rainfall needs. Step 3: Recall its soil and main states. Step 4: Link to a reform or programme if asked.'
    real_world: Darjeeling tea grows on cool, misty slopes where water drains away quickly, exactly the warm, moist, frost-free, well-drained conditions tea needs.
  picture:
    kind: bars
    bars:
    - label: Rice
      value: 100
    - label: Sugarcane
      value: 87
    - label: Cotton
      value: 60
    - label: Wheat
      value: 62
    unit: cm rainfall
    alt: 'Bar chart of rough rainfall needs for crops in centimetres: rice about 100 or more, sugarcane 75 to 100, wheat 50 to 75, cotton about 60.'
  activity:
    type: scale
    min: 0
    max: 200
    step: 5
    start: 0
    unit: cm
    prompt: Slide the yearly rainfall. Which crop suits it?
    zones:
    - from: 50
      to: 75
      label: Wheat
      says: Wheat needs 50–75 cm and a cool growing season.
    - from: 75
      to: 100
      label: Sugarcane
      says: Sugarcane needs 75–100 cm, 21–27 °C.
    - from: 100
      to: 200
      label: Rice
      says: Rice needs over 100 cm, high heat and humidity.
    goals:
    - prompt: Find the rainfall for rice.
      zone: Rice
      mistakes:
      - when:
          v:
          - 50
          - 70
        say: 'That suits wheat. Rice needs much more water: over 100 cm.'
      - when:
          v:
          - 0
          - 45
        say: Far too dry for rice.
    - prompt: Find the rainfall for wheat.
      zone: Wheat
      mistakes:
      - when:
          v:
          - 105
          - 200
        say: That suits rice. Wheat needs only 50–75 cm.
      - when:
          v:
          - 0
          - 45
        say: Too dry, even for wheat.
    - prompt: Find the rainfall for sugarcane.
      zone: Sugarcane
      mistakes:
      - when:
          v:
          - 105
          - 200
        say: 'Too wet: sugarcane needs 75–100 cm.'
  lesson:
    - teach: Rice is a kharif crop that needs high temperature (above 25°C), high humidity and rainfall above 100 cm. Wheat is a rabi crop needing a cool growing season and bright sunshine at ripening, with 50–75 cm of evenly spread rain. Millets (jowar, bajra, ragi) grow in drier areas and are very nutritious; ragi is rich in iron and calcium.
      picture:
        kind: bars
        unit: rainfall needed (cm)
        bars:
        - label: rice
          value: 100
        - label: wheat
          value: 75
        - label: sugarcane
          value: 100
        - label: bajra
          value: 50
        alt: 'Rough rainfall needs: rice and sugarcane about 100 cm or more, wheat 50 to 75 cm, bajra under 50 cm.'
      check:
        prompt: Which crop needs bright sunshine at harvest and cool growing?
        options:
        - Wheat
        - Rice
        - Jute
        answer: Wheat
        why: A rabi crop.
      ways:
      - style: visual
        teach: What rice and wheat each need to grow well, side by side.
        picture:
          kind: compare
          columns:
          - title: Rice
            points:
            - hot
            - humid
            - heavy rain or irrigation
          - title: Wheat
            points:
            - cool while growing
            - bright sun at ripening
            - moderate rain
          alt: Rice needs hot, humid weather and heavy rain or irrigation. Wheat needs a cool growing season, bright sun at ripening and moderate rain.
      - style: real_world
        teach: In Kerala the big paddy fields of Kuttanad stand in water much of the year, while in Punjab wheat fields are dry and golden in April. Each crop matches its climate.
    - teach: 'Other crops: pulses (tur, urad, moong, gram) fix nitrogen and are grown in rotation; sugarcane needs hot, humid climate and 75–100 cm rain; oil seeds (groundnut, mustard, sesame); tea needs warm, moist, frost-free climate and well-drained hill slopes; coffee (Arabica) grows in the Nilgiris; rubber in hot, humid equatorial areas. Fibres: cotton (black soil), jute (the golden fibre, Bengal delta), silk.'
      check:
        prompt: Which crop is called the golden fibre?
        options:
        - Jute
        - Cotton
        - Silk
        answer: Jute
        why: Its shiny colour.
      ways:
      - style: visual
        teach: 'Which crops need what: rain and soil needs of other major crops.'
        picture:
          kind: compare
          columns:
          - title: Pulses
            points:
            - little water
            - fix nitrogen in soil
          - title: Sugarcane
            points:
            - hot and humid
            - 75–100 cm rain
          - title: Cotton
            points:
            - black soil
            - high temperature, bright sun
          alt: Pulses need little water and fix nitrogen in soil. Sugarcane needs a hot, humid climate and 75 to 100 cm of rain. Cotton grows in black soil with high temperature and bright sun.
      - style: step_by_step
        teach: 'Plan a crop rotation. Step 1: Grow a cereal like maize, which uses up nitrogen. Step 2: Next season grow a pulse, whose roots add nitrogen back. Step 3: Then grow the cereal again. Step 4: The soil stays fertile with less fertiliser.'
    - teach: 'After independence, reforms aimed to help farmers: land reform (abolishing zamindari), the Green Revolution (high-yield seeds for wheat and rice), the White Revolution (milk), crop insurance, Kisan Credit Cards, and minimum support prices. Yet farmers face falling share of GDP, small land holdings, debt and global competition.'
      check:
        prompt: The White Revolution increased production of…
        options:
        - Milk
        - Cotton
        - Rice
        answer: Milk
        why: Operation Flood.
      ways:
      - style: visual
        teach: Farm reforms after independence and what each one aimed to do.
        picture:
          kind: compare
          columns:
          - title: Land reform
            points:
            - end zamindari
            - land to tillers
          - title: Green Revolution
            points:
            - high-yield seeds
            - more grain
          - title: Support for farmers
            points:
            - minimum support price
            - crop insurance and loans
          alt: Land reform ended zamindari and gave land to tillers. The Green Revolution brought high-yield seeds and more grain. Support for farmers included minimum support prices, crop insurance and loans.
      - style: real_world
        teach: When dairy cooperatives like Amul began collecting milk from small farmers, India became the world's top milk producer. That was the White Revolution.
  items:
  - prompt: 'Rice needs rainfall of more than:'
    options:
    - 100 cm
    - 25 cm
    - 50 cm
    - 10 cm
    answer: 100 cm
    difficulty: 1
    hints:
    - It needs standing water.
    - Irrigation helps where rain is less.
    solution: Rice needs above 100 cm of rain (or irrigation).
    mistakes: {"50 cm": "s10_rice_rain", "25 cm": "s10_rice_rain"}
  - prompt: Which country is the largest producer of rice, ahead of India?
    options:
    - China
    - USA
    - Brazil
    - Japan
    answer: China
    difficulty: 2
    hints:
    - India is second.
    - An East Asian country.
    solution: India is the second-largest rice producer, after China.
    mistakes: {"Japan": "s10_china_rice"}
  - prompt: Which millet is very rich in iron, calcium and roughage?
    options:
    - Ragi
    - Jowar
    - Bajra
    - Maize
    answer: Ragi
    difficulty: 2
    hints:
    - Grown in Karnataka.
    - Finger millet.
    solution: Ragi is rich in iron, calcium, other micronutrients and roughage.
    mistakes: {"Maize": "s10_ragi", "Bajra": "s10_ragi"}
  - prompt: Why are pulses grown in rotation with other crops?
    options:
    - "They fix nitrogen and restore soil fertility"
    - "They need a lot of water, which helps the soil"
    - "They kill insects that harm the next crop"
    - "They can only be grown in the winter season"
    answer: They fix nitrogen and restore soil fertility
    difficulty: 2
    hints:
    - Leguminous crops.
    - Except arhar.
    solution: Leguminous pulses fix nitrogen from the air, restoring soil fertility.
    mistakes: {"They need a lot of water, which helps the soil": "s10_pulses"}
  - prompt: 'Jute is known as the:'
    options:
    - Golden fibre
    - White gold
    - Black gold
    - Green fibre
    answer: Golden fibre
    difficulty: 1
    hints:
    - Its colour.
    - West Bengal.
    solution: Jute is called the golden fibre.
    mistakes: {"White gold": "s10_golden_fibre"}
  - prompt: 'The Green Revolution mainly increased production of:'
    options:
    - "Food grains using high-yielding seeds"
    - "Milk using better breeds of cattle"
    - "Fish using new ponds and nets"
    - "Cotton cloth using power looms"
    answer: Food grains using high-yielding seeds
    difficulty: 1
    hints:
    - HYV seeds, fertilisers, irrigation.
    - Operation Flood was milk.
    solution: The Green Revolution used high-yielding varieties to raise grain output, mainly wheat.
    mistakes:
      "Milk using better breeds of cattle": c10ss_revolutions
  - prompt: Which state is the largest producer of tea in India?
    options:
    - Assam
    - Punjab
    - Rajasthan
    - Gujarat
    answer: Assam
    difficulty: 2
    hints:
    - Tea needs heavy rain and hill slopes.
    - A north-eastern state.
    solution: Assam leads India in tea production.
    mistakes:
      Punjab: c10ss9_crop_needs
  - prompt: Which variety of coffee is grown in India?
    options:
    - Arabica
    - Robusta only
    - Liberica
    - Colombian
    answer: Arabica
    difficulty: 3
    hints:
    - Brought from Yemen.
    - Grown in the Nilgiris and Baba Budan Hills.
    solution: Indian coffee is mainly the Arabica variety, first grown in the Baba Budan Hills.
    mistakes:
      Robusta only: c10ss9_crop_needs
  - prompt: Rearing silkworms for silk is called…
    options:
    - Sericulture
    - Horticulture
    - Pisciculture
    - Viticulture
    answer: Sericulture
    difficulty: 2
    hints:
    - Silkworms eat mulberry leaves.
    - '''Seri'' relates to silk.'
    solution: Sericulture is the rearing of silkworms to produce silk.
    mistakes:
      Horticulture: c10ss9_fibres
  - prompt: Which crop grows best in black soil of the Deccan plateau?
    options:
    - Cotton
    - Tea
    - Jute
    - Rubber
    answer: Cotton
    difficulty: 1
    hints:
    - Black soil is also named after this crop.
    - A kharif fibre crop.
    solution: Cotton grows well in the black soil of the Deccan.
    mistakes:
      Jute: c10ss9_deccan
  - prompt: What temperature does rice need, in °C, at least?
    answer: '25'
    check: '25'
    difficulty: 2
    hints:
    - It needs high temperature and humidity.
    - Mid-twenties or more.
    solution: Rice needs temperatures above 25 °C.
    mistakes:
      '10': s10_rice_rain
      '100': s10_rice_rain
  - prompt: What is the minimum support price (MSP)?
    options:
    - "A price the government sets so farmers are not paid too little"
    - "The highest price that shops are allowed to charge buyers"
    - "A tax that farmers pay on every crop they sell"
    - "The price that farmers pay for seeds each season"
    answer: A price the government sets so farmers are not paid too little
    difficulty: 2
    hints:
    - It is a safety net for farmers.
    - Announced before sowing.
    solution: MSP is a guaranteed price at which the government buys some crops.
    mistakes:
      "A tax that farmers pay on every crop they sell": c10ss9_reforms
  - prompt: Which crop grows in hot, humid equatorial climate with over 200 cm rain, mainly in Kerala?
    options:
    - Rubber
    - Wheat
    - Bajra
    - Mustard
    answer: Rubber
    difficulty: 2
    hints:
    - It is a plantation crop.
    - It gives latex.
    solution: Rubber needs a hot, humid climate and grows mainly in Kerala.
    mistakes:
      Wheat: c10ss9_crop_needs
  - prompt: Which is India's main food crop in the north and north-west?
    options:
    - Wheat
    - Rice
    - Ragi
    - Jute
    answer: Wheat
    difficulty: 1
    hints:
    - Punjab, Haryana and UP grow lots of it.
    - A rabi grain.
    solution: Wheat is the main food crop of the north and north-west.
    mistakes:
      Rice: c10ss_rabi_kharif
  - prompt: Which scheme gives farmers easy loans to buy seeds and fertiliser?
    options:
    - Kisan Credit Card
    - Project Tiger
    - Joint Forest Management
    - Operation Flood
    answer: Kisan Credit Card
    difficulty: 2
    hints:
    - '''Kisan'' means farmer.'
    - It is about credit.
    solution: The Kisan Credit Card gives farmers easier, cheaper loans.
    mistakes:
      Operation Flood: c10ss_revolutions
  - prompt: 'Assertion (A): Pulses are grown in rotation with other crops.

      Reason (R): Pulses are leguminous crops that fix nitrogen from the air in the soil.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Fixing nitrogen restores soil fertility, so rotating pulses helps the next crop. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A farmer in Gujarat has deep black soil, a hot climate and bright sunshine. Which fibre crop would suit the land best?'
    options:
    - Cotton
    - Jute
    - Silk
    answer: Cotton
    hints:
    - Which fibre grows well in black soil?
    - Jute needs a wet delta.
    solution: Cotton grows well in the black soil of the Deccan and Gujarat, with high temperatures and bright sun.
    mistakes:
      Jute: c10ss9_deccan
      Silk: c10ss9_fibres
    exam: case
    difficulty: 2
  - prompt: 'Situation: The government announces a price at which it will buy wheat, even if market prices fall. What is this called?'
    options:
    - "Minimum support price"
    - "Kisan Credit Card"
    - "Maximum retail price"
    answer: Minimum support price
    hints:
    - It is about a price.
    - It protects farmers from low market prices.
    solution: The minimum support price is a price fixed by the government so farmers are not paid too little.
    mistakes:
      "Kisan Credit Card": c10ss9_reforms
      "Maximum retail price": c10ss9_reforms
    exam: competency
    difficulty: 2
