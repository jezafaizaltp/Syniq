    - Farming only for export
    answer: Using lots of labour and inputs on a small plot to feed the family
    difficulty: 2
    hints:
    - Found where many people share little land.
    - '''Intensive'' means using a lot.'
    solution: Farmers use high inputs and labour on small land to get the most from it.
    mistakes:
      Growing one crop on a huge estate: c10ss9_farm_types
  - prompt: Which of these is a zaid crop?
    options:
    - Cucumber
