# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 4.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 9
title: Agriculture
tips:
  c10ss_rabi_kharif: Kharif crops are sown with the monsoon (rice, cotton); rabi crops in winter (wheat, mustard).
  c10ss_revolutions: 'Green Revolution: grains. White Revolution (Operation Flood): milk.'
concepts:
- code: cbse10ss.agri.types
  title: Types of farming and cropping seasons
  notes: |
    Farming types: primitive subsistence (slash and burn, shifting cultivation: jhumming in the north-east,
    bewar in MP, podu in Andhra/Odisha), intensive subsistence (high inputs on small plots in densely populated
    areas), commercial (high-yield seeds, fertilisers, for sale; plantations of tea, coffee, rubber, sugarcane,
    banana). Cropping seasons: rabi (sown October–December, harvested April–June: wheat, barley, peas, gram,
    mustard; western disturbances help), kharif (sown with the monsoon, harvested September–October: paddy,
    maize, jowar, bajra, cotton, jute, groundnut, soyabean), zaid (short summer season: watermelon, muskmelon,
    cucumber, fodder). In Assam, West Bengal and Odisha, three paddy crops (aus, aman, boro) are grown.
  explanations:
    text: Indian farmers grow different crops in different seasons. Kharif crops like rice are sown with the monsoon rains; rabi crops like wheat are sown in winter; zaid crops like watermelon fill the short summer in between. Farming can be simple subsistence for the family or commercial for sale.
    visual: Draw a year as a circle. Mark June–October green for kharif (rice, cotton), November–April gold for rabi (wheat, mustard), and the short summer gap red for zaid (watermelon).
    step_by_step: 'Step 1: Note when the crop is sown. Step 2: With the monsoon (June–July) → kharif. Step 3: In winter (Oct–Dec) → rabi. Step 4: Between rabi and kharif in summer → zaid.'
    real_world: 'Punjab''s farmers grow wheat in winter and rice in the monsoon on the same land: one rabi and one kharif crop each year.'
  picture:
    kind: compare
    columns:
    - title: Kharif
      points:
      - 'Sown: June–July'
      - 'Harvest: Sept–Oct'
      - Rice, maize, cotton, jute
    - title: Rabi
      points:
      - 'Sown: Oct–Dec'
      - 'Harvest: April–June'
      - Wheat, barley, gram, mustard
    - title: Zaid
      points:
      - Short summer season
      - Between rabi and kharif
      - Watermelon, cucumber, fodder
    alt: 'India''s three cropping seasons: kharif sown with the monsoon (rice, cotton), rabi sown in winter (wheat, mustard), and zaid in summer (watermelon).'
  activity:
    type: sort
    prompt: Rabi, kharif or zaid?
    bins:
    - Rabi
    - Kharif
    - Zaid
    items:
    - label: Wheat
      bin: Rabi
      clue: Sown October–December.
      why: Rabi.
    - label: Mustard
      bin: Rabi
      clue: A winter crop.
      why: Rabi.
    - label: Paddy
      bin: Kharif
      clue: Sown with the monsoon.
      why: Kharif.
    - label: Cotton
      bin: Kharif
      clue: Harvested September–October.
      why: Kharif.
    - label: Watermelon
      bin: Zaid
      clue: Short summer season.
      why: Zaid.
    - label: Cucumber
      bin: Zaid
      clue: Summer.
      why: Zaid.
  items:
  - prompt: Wheat is a crop of which season?
    options:
    - Rabi
    - Kharif
    - Zaid
    - All seasons
    answer: Rabi
    difficulty: 1
    hints:
    - Sown in winter.
    - Harvested in spring.
    solution: 'Wheat is sown in winter and harvested in April–June: a rabi crop.'
    mistakes:
      Kharif: c10ss_rabi_kharif
  - prompt: Rice (paddy) is mainly a crop of which season?
    options:
    - Kharif
    - Rabi
    - Zaid
    - Winter only
    answer: Kharif
    difficulty: 1
    hints:
    - It needs lots of water.
    - Sown with the monsoon.
    solution: 'Paddy is sown with the monsoon: a kharif crop.'
    mistakes:
      Rabi: c10ss_rabi_kharif
  - prompt: '''Jhumming'' in the north-eastern states is a kind of:'
    options:
    - Slash and burn (shifting) agriculture
    - Plantation farming
    - Intensive subsistence farming
    - Commercial dairy farming
    answer: Slash and burn (shifting) agriculture
    difficulty: 2
    hints:
    - Clear a patch, farm it, move on.
    - Primitive subsistence.
    solution: 'Jhumming is shifting cultivation: forest is cleared and burnt, farmed, then left to recover.'
  - prompt: Which is a zaid crop?
    options:
    - Watermelon
    - Wheat
    - Rice
    - Mustard
    answer: Watermelon
    difficulty: 1
    hints:
    - Grown in the short summer season.
    - Melons and cucumbers.
    solution: Watermelon is grown in the zaid season.
  - prompt: 'Plantation agriculture is a type of commercial farming in which:'
    options:
    - A single crop is grown on a large area for sale
    - Many crops are grown for the family
    - Farmers move from place to place
    - Only vegetables are grown
    answer: A single crop is grown on a large area for sale
    difficulty: 2
    hints:
    - Tea, coffee, rubber.
    - Needs capital and labour.
    solution: Plantations grow one crop, like tea or rubber, on a large scale for the market.
  - prompt: Assam, West Bengal and Odisha grow how many crops of paddy in a year?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Aus, aman and boro.
    - Count them.
    solution: 'They grow three paddy crops: aus, aman and boro.'
- code: cbse10ss.agri.crops
  title: Major crops and reforms
  after:
  - cbse10ss.agri.types
  notes: |
    Rice: kharif; high temperature (above 25°C), high humidity, rainfall above 100 cm; West Bengal, UP, Punjab.
    India is the second-largest producer of rice in the world after China. Wheat: rabi; cool growing season,
    50–75 cm rain; Ganga–Satluj plains and black soil of the Deccan. Millets (jowar, bajra, ragi) are very
    nutritious; ragi is rich in iron, calcium and roughage. Maize grows in kharif (and rabi in Bihar). Pulses
    fix nitrogen in the soil. Sugarcane: tropical and subtropical, 21–27°C, 75–100 cm. Tea: tropical and
    subtropical, warm and moist frost-free climate, deep fertile soil (Assam, Darjeeling, Nilgiris). Coffee:
    Arabica variety, Nilgiris in Karnataka, Kerala, Tamil Nadu. Rubber: Kerala, Karnataka, Tamil Nadu, Andaman.
    Cotton: black soil of the Deccan, 210 frost-free days. Jute ('golden fibre'): West Bengal. Reforms:
    abolition of zamindari, land consolidation, the Green Revolution (HYV seeds) and White Revolution
    (Operation Flood for milk), Kisan Credit Card, crop insurance, minimum support price.
  explanations:
    text: Each crop needs its own climate and soil. Rice needs heat and heavy rain; wheat needs a cool season and moderate rain; tea needs warm, wet hill slopes; cotton needs black soil and a long frost-free season. After independence, reforms like the Green Revolution raised food production.
    visual: 'Draw a chart of four crops with thermometer and rain-gauge icons: rice (hot, very wet), wheat (cool, moderate), cotton (warm, black soil), tea (warm, wet, slopes).'
    step_by_step: 'Step 1: Note the crop. Step 2: Recall its temperature and rainfall needs. Step 3: Recall its soil and main states. Step 4: Link to a reform or programme if asked.'
    real_world: Darjeeling tea grows on cool, misty slopes where water drains away quickly, exactly the warm, moist, frost-free, well-drained conditions tea needs.
  picture:
    kind: bars
    bars:
    - label: Rice
      value: 100
    - label: Sugarcane
      value: 87
    - label: Cotton
      value: 60
    - label: Wheat
      value: 62
    unit: cm rainfall
    alt: 'Bar chart of rough rainfall needs for crops in centimetres: rice about 100 or more, sugarcane 75 to 100, wheat 50 to 75, cotton about 60.'
  activity:
    type: scale
    min: 0
    max: 200
    step: 5
    start: 0
    unit: cm
    prompt: Slide the yearly rainfall. Which crop suits it?
    zones:
    - from: 50
      to: 75
      label: Wheat
      says: Wheat needs 50–75 cm and a cool growing season.
    - from: 75
      to: 100
      label: Sugarcane
      says: Sugarcane needs 75–100 cm, 21–27 °C.
    - from: 100
      to: 200
      label: Rice
      says: Rice needs over 100 cm, high heat and humidity.
    goals:
    - prompt: Find the rainfall for rice.
      zone: Rice
      mistakes:
      - when:
          v:
          - 50
          - 70
        say: 'That suits wheat. Rice needs much more water: over 100 cm.'
      - when:
          v:
          - 0
          - 45
        say: Far too dry for rice.
    - prompt: Find the rainfall for wheat.
      zone: Wheat
      mistakes:
      - when:
          v:
          - 105
          - 200
        say: That suits rice. Wheat needs only 50–75 cm.
      - when:
          v:
          - 0
          - 45
        say: Too dry, even for wheat.
    - prompt: Find the rainfall for sugarcane.
      zone: Sugarcane
      mistakes:
      - when:
          v:
          - 105
          - 200
        say: 'Too wet: sugarcane needs 75–100 cm.'
  items:
  - prompt: 'Rice needs rainfall of more than:'
    options:
    - 100 cm
    - 25 cm
    - 50 cm
    - 10 cm
    answer: 100 cm
    difficulty: 1
    hints:
    - It needs standing water.
    - Irrigation helps where rain is less.
    solution: Rice needs above 100 cm of rain (or irrigation).
  - prompt: Which country is the largest producer of rice, ahead of India?
    options:
    - China
    - USA
    - Brazil
    - Japan
    answer: China
    difficulty: 2
    hints:
    - India is second.
    - An East Asian country.
    solution: India is the second-largest rice producer, after China.
  - prompt: Which millet is very rich in iron, calcium and roughage?
    options:
    - Ragi
    - Jowar
    - Bajra
    - Maize
    answer: Ragi
    difficulty: 2
    hints:
    - Grown in Karnataka.
    - Finger millet.
    solution: Ragi is rich in iron, calcium, other micronutrients and roughage.
  - prompt: Why are pulses grown in rotation with other crops?
    options:
    - They fix nitrogen and restore soil fertility
    - They need a lot of water
    - They kill insects
    - They are only grown in winter
    answer: They fix nitrogen and restore soil fertility
    difficulty: 2
    hints:
    - Leguminous crops.
    - Except arhar.
    solution: Leguminous pulses fix nitrogen from the air, restoring soil fertility.
  - prompt: 'Jute is known as the:'
    options:
    - Golden fibre
    - White gold
    - Black gold
    - Green fibre
    answer: Golden fibre
    difficulty: 1
    hints:
    - Its colour.
    - West Bengal.
    solution: Jute is called the golden fibre.
  - prompt: 'The Green Revolution mainly increased production of:'
    options:
    - Food grains using high-yielding seeds
    - Milk
    - Fish
    - Cotton cloth
    answer: Food grains using high-yielding seeds
    difficulty: 1
    hints:
    - HYV seeds, fertilisers, irrigation.
    - Operation Flood was milk.
    solution: The Green Revolution used high-yielding varieties to raise grain output, mainly wheat.
    mistakes:
      Milk: c10ss_revolutions
