# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 9
title: Agriculture
tips:
  c10ss_rabi_kharif: "Kharif crops are sown at the start of the monsoon and need lots of water; rabi crops are sown in winter and harvested in spring. When is the crop sown?"
  c10ss_revolutions: 'Green Revolution: grains. White Revolution (Operation Flood): milk.'
  s10_china_rice: "India is second. Which neighbour grows the most rice?"
  s10_golden_fibre: "Cotton is 'white gold'. Jute's nickname comes from its shiny yellow-brown colour."
  c10ss9_deccan: "Jute grows in the wet Bengal delta, not on the dry Deccan. Which fibre crop gives black soil its other name?"
  s10_jhum: "Jhumming means clearing a patch, farming it, then moving on."
  s10_plantation: "Tea and rubber estates are plantations. How many crops, and for whom?"
  s10_pulses: "Pulses are legumes. What do their roots do for the soil?"
  s10_ragi: "Maize is mostly a starch and fodder crop. Which small, reddish millet from Karnataka is known as a nutrition powerhouse?"
  s10_rice_rain: "Rice grows in standing water. It needs heavy rain."
  s10_three_paddy: "In these wet eastern states paddy grows in the summer, the monsoon and the winter. Name the seasons and count."
  s10_zaid: "Zaid crops grow in the short summer season between rabi and kharif. Wheat is rabi."
  c10ss9_farm_types: Primitive subsistence farming uses simple tools on small plots for the family; intensive subsistence farming uses heavy inputs on small plots; commercial farming grows crops to sell.
  c10ss9_season_calendar: Rabi crops are sown in winter and harvested in spring; kharif crops are sown with the monsoon; zaid crops fill the short summer gap.
  c10ss9_crop_needs: 'Match the crop to its climate: some need heavy rain and heat, some cool winters, some warm days and well-drained hill slopes.'
  c10ss9_reforms: After independence the government tried land reforms, the Green and White Revolutions, crop insurance, Kisan Credit Cards and minimum support prices.
  c10ss9_fibres: "Silk comes from silkworms fed on mulberry leaves. Horticulture is about fruit and flowers; the word you want starts with a root that means silk."
concepts:
- code: cbse10ss.agri.types
  title: Types of farming and cropping seasons
  notes: |
    Farming types: primitive subsistence (slash and burn, shifting cultivation: jhumming in the north-east,
    bewar in MP, podu in Andhra/Odisha), intensive subsistence (high inputs on small plots in densely populated
    areas), commercial (high-yield seeds, fertilisers, for sale; plantations of tea, coffee, rubber, sugarcane,
    banana). Cropping seasons: rabi (sown October–December, harvested April–June: wheat, barley, peas, gram,
    mustard; western disturbances help), kharif (sown with the monsoon, harvested September–October: paddy,
    maize, jowar, bajra, cotton, jute, groundnut, soyabean), zaid (short summer season: watermelon, muskmelon,
    cucumber, fodder). In Assam, West Bengal and Odisha, three paddy crops (aus, aman, boro) are grown.
  explanations:
    text: Indian farmers grow different crops in different seasons. Kharif crops like rice are sown with the monsoon rains; rabi crops like wheat are sown in winter; zaid crops like watermelon fill the short summer in between. Farming can be simple subsistence for the family or commercial for sale.
    visual: Draw a year as a circle. Mark June–October green for kharif (rice, cotton), November–April gold for rabi (wheat, mustard), and the short summer gap red for zaid (watermelon).
    step_by_step: 'Step 1: Note when the crop is sown. Step 2: With the monsoon (June–July) → kharif. Step 3: In winter (Oct–Dec) → rabi. Step 4: Between rabi and kharif in summer → zaid.'
    real_world: 'Punjab''s farmers grow wheat in winter and rice in the monsoon on the same land: one rabi and one kharif crop each year.'
  picture:
    kind: compare
    columns:
    - title: Kharif
      points:
      - 'Sown: June–July'
      - 'Harvest: Sept–Oct'
      - Rice, maize, cotton, jute
    - title: Rabi
      points:
      - 'Sown: Oct–Dec'
      - 'Harvest: April–June'
      - Wheat, barley, gram, mustard
    - title: Zaid
      points:
      - Short summer season
      - Between rabi and kharif
      - Watermelon, cucumber, fodder
    alt: 'India''s three cropping seasons: kharif sown with the monsoon (rice, cotton), rabi sown in winter (wheat, mustard), and zaid in summer (watermelon).'
  activity:
    type: sort
    prompt: Rabi, kharif or zaid?
    bins:
    - Rabi
    - Kharif
    - Zaid
    items:
    - label: Wheat
      bin: Rabi
      clue: Sown October–December.
      why: Rabi.
    - label: Mustard
      bin: Rabi
      clue: A winter crop.
      why: Rabi.
    - label: Paddy
      bin: Kharif
      clue: Sown with the monsoon.
      why: Kharif.
    - label: Cotton
      bin: Kharif
      clue: Harvested September–October.
      why: Kharif.
    - label: Watermelon
      bin: Zaid
      clue: Short summer season.
      why: Zaid.
    - label: Cucumber
      bin: Zaid
      clue: Summer.
      why: Zaid.
  lesson:
    - teach: 'Agriculture is India''s oldest economic activity; about two-thirds of people depend on it. Types: primitive subsistence farming (slash and burn, called jhumming in the north-east; small plots, simple tools, family needs), intensive subsistence farming (high inputs on small land, where population is dense) and commercial farming (high yields for sale, like wheat in Punjab). Plantation farming grows one crop on a large estate, like tea or rubber.'
      picture:
        kind: compare
        columns:
        - title: Primitive subsistence
          points:
          - Slash and burn
          - Simple tools
          - For the family
        - title: Intensive subsistence
          points:
          - Small land
          - Many inputs and labour
        - title: Commercial
          points:
          - High-yield seeds, fertilisers
          - Grown for sale
        alt: Primitive subsistence farming uses slash and burn and simple tools for the family; intensive subsistence farming uses many inputs on small land; commercial farming uses high-yield seeds and fertilisers to grow for sale.
      check:
        prompt: Slash and burn farming is…
        options:
        - Primitive subsistence
        - Commercial
        - Plantation
        answer: Primitive subsistence
        why: Land is cleared, farmed, then left.
    - teach: 'India has three cropping seasons. Rabi: sown October–December, harvested April–June (wheat, barley, peas, gram, mustard). Kharif: sown with the monsoon, harvested September–October (paddy, maize, jowar, bajra, tur, cotton, jute, groundnut). Zaid: a short summer season (watermelon, muskmelon, cucumber, fodder).'
      check:
        prompt: Mustard is a … crop.
        options:
        - Rabi
        - Kharif
        - Zaid
        answer: Rabi
        why: Sown in winter.
    - teach: 'Western disturbances (winter rain from the west) help rabi crops in the north. Green Revolution technology spread rabi crops in Punjab, Haryana and western UP. In Assam, West Bengal and Odisha three crops of paddy are grown a year: aus, aman and boro.'
      check:
        prompt: Winter rain from western disturbances helps…
        options:
        - Rabi crops
        - Kharif crops
        - Zaid crops
        answer: Rabi crops
        why: They grow in winter.
  items:
  - prompt: Wheat is a crop of which season?
    options:
    - Rabi
    - Kharif
    - Zaid
    - All seasons
    answer: Rabi
    difficulty: 1
    hints:
    - Sown in winter.
    - Harvested in spring.
    solution: 'Wheat is sown in winter and harvested in April–June: a rabi crop.'
    mistakes:
      Kharif: c10ss_rabi_kharif
  - prompt: Rice (paddy) is mainly a crop of which season?
    options:
    - Kharif
    - Rabi
    - Zaid
    - Winter only
    answer: Kharif
    difficulty: 1
    hints:
    - It needs lots of water.
    - Sown with the monsoon.
    solution: 'Paddy is sown with the monsoon: a kharif crop.'
    mistakes:
      Rabi: c10ss_rabi_kharif
  - prompt: '''Jhumming'' in the north-eastern states is a kind of:'
    options:
    - Slash and burn (shifting) agriculture
    - Plantation farming
    - Intensive subsistence farming
    - Commercial dairy farming
    answer: Slash and burn (shifting) agriculture
    difficulty: 2
    hints:
    - Clear a patch, farm it, move on.
    - Primitive subsistence.
    solution: 'Jhumming is shifting cultivation: forest is cleared and burnt, farmed, then left to recover.'
    mistakes: {"Plantation farming": "s10_jhum"}
  - prompt: Which is a zaid crop?
    options:
    - Watermelon
