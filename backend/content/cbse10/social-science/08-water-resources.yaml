# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 3.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 8
title: Water Resources
tips:
  c10ss_dam_rivers: "Match each dam to its state: Sardar Sarovar is in Gujarat on a west-flowing river; Hirakud is in Odisha on an east-flowing river."
  s10_kuls: "Guls and kuls carry water from glaciers and streams in mountains."
  s10_nehru_dams: "Gandhiji favoured village self-reliance. Which Prime Minister pushed big dams?"
  s10_scarcity: "Rain can be plenty, but the water can still be unusable. Why?"
  s10_tankas: "Tankas are found in dry Rajasthan. They catch water from where?"
  c10ss8_scarcity: Water scarcity can come from too many people, overuse for irrigation and industry, or pollution, not just low rainfall.
  c10ss8_multi: 'Multi-purpose projects serve many aims at once: irrigation, electricity, flood control, water supply, fish breeding and inland navigation.'
  c10ss8_oppose: People opposed big dams because they displaced villagers, flooded land, harmed river life and caused silting.
  c10ss8_harvest: 'Each region harvests rain its own way: guls in the hills, tankas on rooftops in the desert, khadins on fields, bamboo pipes in Meghalaya.'
concepts:
- code: cbse10ss.water.dams
  title: Water scarcity, dams and rainwater harvesting
  notes: |
    About three-fourths of the Earth is water, but only a small share is fresh water fit to use. Water scarcity
    comes from large and growing population, over-use for irrigation and industry, unequal access and pollution.
    Multi-purpose river projects (dams) serve irrigation, electricity, flood control, water supply, fish breeding
    and navigation; Nehru called dams 'temples of modern India'. Examples: Bhakra Nangal (Sutlej), Hirakud
    (Mahanadi), Sardar Sarovar (Narmada). Problems: displacement of people, loss of forests, sedimentation,
    disputes between states, floods from excess release. Movements: Narmada Bachao Andolan, Tehri Dam Andolan.
    Rainwater harvesting: guls or kuls in the western Himalayas, rooftop harvesting and tankas in Rajasthan,
    inundation channels in Bengal, khadins and johads in arid areas. Shillong collects rooftop water; Tamil Nadu
    made rooftop harvesting compulsory; Gendathur village in Karnataka harvests rooftop water.
  explanations:
    text: Even with plenty of water on Earth, many places don't have enough clean water because of large populations, heavy use and pollution. Big dams store water for many purposes but displace people and harm rivers, so traditional rainwater harvesting is being revived as a simpler solution.
    visual: 'Draw a Rajasthani house: rain falls on the flat roof, flows down a pipe into an underground tanka, and the family draws from it in the dry months.'
    step_by_step: 'Step 1: Why scarcity? People, use, pollution, unequal access. Step 2: Big solution: multi-purpose dams; list benefits and problems. Step 3: Local solution: rainwater harvesting; name a regional example.'
    real_world: Tamil Nadu made rooftop rainwater harvesting compulsory for all houses, which helped recharge groundwater in Chennai.
  picture:
    kind: compare
    columns:
    - title: 'Dams: benefits'
      points:
      - Irrigation and electricity
      - Flood control
      - Water supply, fishing
      - Inland navigation
    - title: 'Dams: problems'
      points:
      - People displaced
      - Forests and land submerged
      - Sediment builds up
      - Disputes between states
    alt: Benefits of multi-purpose dams (irrigation, electricity, flood control, water supply) and problems (displacement, submerged land, sediment, disputes).
  activity:
    type: sort
    prompt: Which rainwater harvesting method?
    bins:
    - Guls or kuls
    - Tankas
    - Khadins and johads
    - Rooftop harvesting
    items:
    - label: Channels in the western Himalayas
      bin: Guls or kuls
      clue: Mountain streams diverted.
      why: Guls or kuls.
    - label: Underground tanks inside Rajasthan houses
      bin: Tankas
      clue: Store water for drinking.
      why: Tankas.
    - label: Rain-fed storage on farm land in arid areas
      bin: Khadins and johads
      clue: Water seeps into the soil.
      why: Khadins and johads.
    - label: Compulsory on houses in Tamil Nadu
      bin: Rooftop harvesting
      clue: From the roof.
      why: Rooftop harvesting.
    - label: Shillong collects water from roofs
      bin: Rooftop harvesting
      clue: Even in a wet area.
      why: Rooftop.
  lesson:
    - teach: Three-fourths of Earth's surface is water, but only a small part is fresh water we can use. Water scarcity can come from a growing population, heavy use for farming and industry, and pollution, even in places with enough rain. Over-pumping of groundwater is lowering water tables.
      check:
        prompt: Water scarcity in a rainy area can be caused by…
        options:
        - Pollution and overuse
        - Too much rain
        - The sea
        answer: Pollution and overuse
        why: Water can be present but unusable.
    - teach: 'Dams store water for irrigation, power, drinking water, flood control, fishing and navigation: multi-purpose river projects. Nehru called them ''temples of modern India''. Examples: Bhakra Nangal (Sutlej), Hirakud (Mahanadi), Sardar Sarovar (Narmada). But dams displace people, flood forests, change river ecosystems and can cause floods; the Narmada Bachao Andolan opposed them.'
      picture:
        kind: compare
        columns:
        - title: Benefits of dams
          points:
          - Irrigation
          - Electricity
          - Flood control
          - Water supply
        - title: Problems
          points:
          - People displaced
          - Forests flooded
          - River life harmed
          - Silting
        alt: Dams give irrigation, electricity, flood control and water supply, but displace people, flood forests, harm river life and cause silting.
      check:
        prompt: Which river is the Bhakra Nangal dam on?
        options:
        - Sutlej
        - Narmada
        - Mahanadi
        answer: Sutlej
        why: In Himachal Pradesh and Punjab.
    - teach: Rainwater harvesting is an old and cheap way to save water. Guls or kuls are channels in the Western Himalayas; rooftop harvesting and tankas (underground tanks) in Rajasthan; khadins and johads on fields; bamboo drip irrigation in Meghalaya; Gendathur in Karnataka collects rooftop water in almost every house. Tamil Nadu made rooftop harvesting compulsory for buildings.
      check:
        prompt: Bamboo drip irrigation is practised in…
        options:
        - Meghalaya
        - Rajasthan
        - Gujarat
        answer: Meghalaya
        why: Water flows through bamboo pipes.
  items:
  - prompt: Who called dams 'the temples of modern India'?
    options:
    - Jawaharlal Nehru
    - Mahatma Gandhi
    - B.R. Ambedkar
    - Medha Patkar
    answer: Jawaharlal Nehru
    difficulty: 1
    hints:
    - India's first Prime Minister.
    - He backed big projects.
    solution: Nehru described dams as the temples of modern India.
    mistakes: {"Mahatma Gandhi": "s10_nehru_dams"}
  - prompt: The Sardar Sarovar Dam is built on which river?
    options:
    - Narmada
    - Sutlej
    - Mahanadi
    - Krishna
    answer: Narmada
    difficulty: 1
    hints:
    - "The dam is in Gujarat, on a big river that flows west into the Arabian Sea."
    - Gujarat.
    solution: Sardar Sarovar is on the Narmada.
    mistakes:
      Mahanadi: c10ss_dam_rivers
  - prompt: The Hirakud Dam is on which river?
    options:
    - Mahanadi
    - Narmada
    - Sutlej
    - Godavari
    answer: Mahanadi
    difficulty: 2
    hints:
    - In Odisha.
    - Bhakra Nangal is on the Sutlej.
    solution: Hirakud is on the Mahanadi in Odisha.
    mistakes:
      Narmada: c10ss_dam_rivers
  - prompt: 'Tankas in Rajasthan are:'
    options:
    - Underground tanks that store rooftop rainwater
    - Big dams
    - Canals from rivers
    - Wells for oil
    answer: Underground tanks that store rooftop rainwater
    difficulty: 1
    hints:
    - Bikaner, Phalodi, Barmer.
    - Drinking water for dry months.
    solution: Tankas are underground tanks fed by rooftop rainwater.
    mistakes: {"Canals from rivers": "s10_tankas"}
  - prompt: Which is a reason for water scarcity even in areas with enough rain?
    options:
    - Pollution and over-use make the water unfit or insufficient
    - Too many trees
    - The ocean is close
    - There is too much rainfall
    answer: Pollution and over-use make the water unfit or insufficient
    difficulty: 2
    hints:
    - Scarcity is not only about rainfall.
    - Quality matters too.
    solution: Water can be plentiful but polluted or overused, causing scarcity.
    mistakes: {"There is too much rainfall": "s10_scarcity"}
  - prompt: '''Guls'' or ''kuls'' are channels used in which region?'
    options:
    - Western Himalayas
    - Rajasthan desert
    - Bengal delta
    - Kerala coast
    answer: Western Himalayas
    difficulty: 2
    hints:
    - Diverting mountain streams.
    - For farming.
    solution: Guls or kuls are diversion channels for irrigation in the western Himalayas.
    mistakes: {"Rajasthan desert": "s10_kuls"}
  - prompt: Which dam is on the Sutlej river?
    options:
    - Bhakra Nangal
    - Hirakud
    - Sardar Sarovar
    - Nagarjuna Sagar
    answer: Bhakra Nangal
    difficulty: 2
    hints:
    - It is in the Himalayan foothills.
    - One of India's first big dams.
    solution: Bhakra Nangal is on the Sutlej.
    mistakes:
      Hirakud: c10ss_dam_rivers
  - prompt: Which state made rooftop rainwater harvesting compulsory for all houses?
    options:
    - Tamil Nadu
    - Rajasthan
    - Punjab
    - Assam
    answer: Tamil Nadu
    difficulty: 2
    hints:
    - A southern state.
    - Its capital is Chennai.
    solution: Tamil Nadu made rooftop rainwater harvesting compulsory across the state.
    mistakes:
      Rajasthan: c10ss8_harvest
  - prompt: Which movement opposed the Sardar Sarovar Dam?
    options:
    - Narmada Bachao Andolan
    - Chipko movement
    - Swadeshi movement
    - Green Revolution
    answer: Narmada Bachao Andolan
    difficulty: 1
    hints:
    - The dam is on the Narmada.
    - '''Bachao'' means save.'
    solution: The Narmada Bachao Andolan campaigned for the people displaced by the dam.
    mistakes:
      Chipko movement: c10ss8_oppose
  - prompt: Which of these is NOT a purpose of multi-purpose river projects?
    options:
    - Mining coal
    - Irrigation
    - Generating electricity
    - Flood control
    answer: Mining coal
    difficulty: 1
    hints:
    - Think of what a dam can do with water.
    - One option has nothing to do with water.
    solution: Dams serve irrigation, power, flood control and more; mining coal is not one of these.
    mistakes:
      Flood control: c10ss8_multi
  - prompt: In which Karnataka village do nearly all houses collect rooftop rainwater?
    options:
    - Gendathur
    - Kudremukh
    - Hampi
    - Mysuru
    answer: Gendathur
    difficulty: 3
    hints:
    - A remote village in Mysuru district.
    - Its name is in the textbook's example.
    solution: Gendathur village collects rooftop rainwater in about 200 households.
    mistakes:
      Kudremukh: c10ss8_harvest
  - prompt: Why are groundwater levels falling in many Indian cities?
    options:
    - Too much water is pumped out
    - Too much rain
    - Rivers are too wide
    - Glaciers grow
    answer: Too much water is pumped out
    difficulty: 1
    hints:
    - Tube wells and borewells.
    - More taken out than goes back in.
    solution: Over-pumping for homes, farms and industry is lowering groundwater levels.
    mistakes:
      Too much rain: c10ss8_scarcity
  - prompt: Why did some people say dams cause floods instead of stopping them?
    options:
    - Sediment fills reservoirs, and water released in heavy rain floods areas downstream
    - Dams make it rain
    - Dams have no gates
    - Rivers flow backwards
    answer: Sediment fills reservoirs, and water released in heavy rain floods areas downstream
    difficulty: 3
    hints:
    - Silt settles behind the dam.
    - Excess water must be let out in heavy rain.
    solution: Silted reservoirs and emergency releases during heavy rain have caused floods.
    mistakes:
      Dams make it rain: c10ss8_oppose
  - prompt: In the semi-arid regions of Rajasthan, rain-fed storage on agricultural fields is called…
    options:
    - Khadins and johads
    - Guls
    - Tankas on rooftops
    - Bamboo pipes
    answer: Khadins and johads
    difficulty: 3
    hints:
    - They are on the fields themselves.
    - Water soaks in and moistens the soil.
    solution: Khadins in Jaisalmer and johads elsewhere store rain on fields.
    mistakes:
      Guls: s10_kuls
  - prompt: Why are tankas valued in Rajasthan even where piped water is available?
    options:
    - Many people like the taste and use them in summer to keep rooms cool
    - They are required by law
    - They make money
    - They grow crops
    answer: Many people like the taste and use them in summer to keep rooms cool
    difficulty: 3
    hints:
    - Rainwater is called 'palar pani' there.
    - Underground tanks are built next to rooms.
    solution: Rainwater is seen as the purest form, and tanks beside rooms keep them cool.
    mistakes:
      They grow crops: s10_tankas
