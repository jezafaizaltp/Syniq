# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 3.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 8
title: Water Resources
tips:
  c10ss_dam_rivers: 'Sardar Sarovar: Narmada. Hirakud: Mahanadi. Bhakra Nangal: Sutlej.'
concepts:
- code: cbse10ss.water.dams
  title: Water scarcity, dams and rainwater harvesting
  notes: |
    About three-fourths of the Earth is water, but only a small share is fresh water fit to use. Water scarcity
    comes from large and growing population, over-use for irrigation and industry, unequal access and pollution.
    Multi-purpose river projects (dams) serve irrigation, electricity, flood control, water supply, fish breeding
    and navigation; Nehru called dams 'temples of modern India'. Examples: Bhakra Nangal (Sutlej), Hirakud
    (Mahanadi), Sardar Sarovar (Narmada). Problems: displacement of people, loss of forests, sedimentation,
    disputes between states, floods from excess release. Movements: Narmada Bachao Andolan, Tehri Dam Andolan.
    Rainwater harvesting: guls or kuls in the western Himalayas, rooftop harvesting and tankas in Rajasthan,
    inundation channels in Bengal, khadins and johads in arid areas. Shillong collects rooftop water; Tamil Nadu
    made rooftop harvesting compulsory; Gendathur village in Karnataka harvests rooftop water.
  explanations:
    text: Even with plenty of water on Earth, many places don't have enough clean water because of large populations, heavy use and pollution. Big dams store water for many purposes but displace people and harm rivers, so traditional rainwater harvesting is being revived as a simpler solution.
    visual: 'Draw a Rajasthani house: rain falls on the flat roof, flows down a pipe into an underground tanka, and the family draws from it in the dry months.'
    step_by_step: 'Step 1: Why scarcity? People, use, pollution, unequal access. Step 2: Big solution: multi-purpose dams; list benefits and problems. Step 3: Local solution: rainwater harvesting; name a regional example.'
    real_world: Tamil Nadu made rooftop rainwater harvesting compulsory for all houses, which helped recharge groundwater in Chennai.
  picture:
    kind: compare
    columns:
    - title: 'Dams: benefits'
      points:
      - Irrigation and electricity
      - Flood control
      - Water supply, fishing
      - Inland navigation
    - title: 'Dams: problems'
      points:
      - People displaced
      - Forests and land submerged
      - Sediment builds up
      - Disputes between states
    alt: Benefits of multi-purpose dams (irrigation, electricity, flood control, water supply) and problems (displacement, submerged land, sediment, disputes).
  items:
  - prompt: Who called dams 'the temples of modern India'?
    options:
    - Jawaharlal Nehru
    - Mahatma Gandhi
    - B.R. Ambedkar
    - Medha Patkar
    answer: Jawaharlal Nehru
    difficulty: 1
    hints:
    - India's first Prime Minister.
    - He backed big projects.
    solution: Nehru described dams as the temples of modern India.
  - prompt: The Sardar Sarovar Dam is built on which river?
    options:
    - Narmada
    - Sutlej
    - Mahanadi
    - Krishna
    answer: Narmada
    difficulty: 1
    hints:
    - Narmada Bachao Andolan.
    - Gujarat.
    solution: Sardar Sarovar is on the Narmada.
    mistakes:
      Mahanadi: c10ss_dam_rivers
  - prompt: The Hirakud Dam is on which river?
    options:
    - Mahanadi
    - Narmada
    - Sutlej
    - Godavari
    answer: Mahanadi
    difficulty: 2
    hints:
    - In Odisha.
    - Bhakra Nangal is on the Sutlej.
    solution: Hirakud is on the Mahanadi in Odisha.
    mistakes:
      Narmada: c10ss_dam_rivers
  - prompt: 'Tankas in Rajasthan are:'
    options:
    - Underground tanks that store rooftop rainwater
    - Big dams
    - Canals from rivers
    - Wells for oil
    answer: Underground tanks that store rooftop rainwater
    difficulty: 1
    hints:
    - Bikaner, Phalodi, Barmer.
    - Drinking water for dry months.
    solution: Tankas are underground tanks fed by rooftop rainwater.
  - prompt: Which is a reason for water scarcity even in areas with enough rain?
    options:
    - Pollution and over-use make the water unfit or insufficient
    - Too many trees
    - The ocean is close
    - There is too much rainfall
    answer: Pollution and over-use make the water unfit or insufficient
    difficulty: 2
    hints:
    - Scarcity is not only about rainfall.
    - Quality matters too.
    solution: Water can be plentiful but polluted or overused, causing scarcity.
  - prompt: '''Guls'' or ''kuls'' are channels used in which region?'
    options:
    - Western Himalayas
    - Rajasthan desert
    - Bengal delta
    - Kerala coast
    answer: Western Himalayas
    difficulty: 2
    hints:
    - Diverting mountain streams.
    - For farming.
    solution: Guls or kuls are diversion channels for irrigation in the western Himalayas.
