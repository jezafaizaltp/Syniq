concepts:
- code: cbse10ss.minerals.types
  title: Minerals and where they are found
  notes: |
    A mineral is a homogeneous, naturally occurring substance with a definite internal structure. Minerals occur
    in veins and lodes (cracks in igneous and metamorphic rocks: zinc, copper, lead, tin), in beds or layers of
    sedimentary rocks (coal, gypsum, potash), from decomposed surface rocks (bauxite), as alluvial deposits in
    river sands (placer deposits of gold, tin, platinum) and in ocean waters (salt, magnesium). Ferrous minerals
    (with iron): iron ore (magnetite the best, with about 70% iron; haematite the most used in industry), manganese.
    Belts: Odisha–Jharkhand, Durg–Bastar–Chandrapur (Bailadila hills, Chhattisgarh), Ballari–Chitradurga–
    Chikkamagaluru–Tumakuru (Kudremukh, Karnataka), Maharashtra–Goa. Non-ferrous: copper (Balaghat MP, Khetri
    Rajasthan), bauxite for aluminium (Amarkantak, Odisha's Panchpatmali in Koraput). Non-metallic: mica (Koderma
    in Jharkhand), limestone (cement). Mining is hazardous to health and the environment.
  explanations:
    text: 'Minerals form in different ways: in cracks in hard rocks, in layers of sedimentary rock, or washed into river sands. Iron ore, India''s key ferrous mineral, is mined in belts across Odisha, Jharkhand, Chhattisgarh, Karnataka and Goa. Non-ferrous minerals like copper and bauxite and non-metals like mica are also vital.'
    visual: 'Draw a map with dots: iron ore in Odisha–Jharkhand, Bailadila in Chhattisgarh, Kudremukh in Karnataka; copper at Khetri and Balaghat; bauxite at Panchpatmali; mica at Koderma.'
    step_by_step: 'Step 1: Ferrous or non-ferrous? (Does it contain iron?) Step 2: Name the ore and its quality. Step 3: Name the belt or mine. Step 4: Name its main use.'
    real_world: Most aluminium foil and window frames come from bauxite mined in places like Odisha's Koraput district.
  picture:
    kind: compare
    columns:
    - title: Ferrous
      points:
      - 'Iron ore: magnetite, haematite'
      - Manganese
      - 'Belts: Odisha, Chhattisgarh, Karnataka'
    - title: Non-ferrous
      points:
      - 'Copper: Khetri, Balaghat'
      - 'Bauxite: Panchpatmali, Amarkantak'
      - Lead, zinc, gold
    - title: Non-metallic
      points:
      - 'Mica: Koderma'
      - 'Limestone: cement'
      - Gypsum, salt
    alt: 'Types of minerals: ferrous like iron ore and manganese; non-ferrous like copper and bauxite; non-metallic like mica and limestone, with places where they are found.'
  activity:
    type: sort
    prompt: Where is it found?
    bins:
    - Iron ore
    - Bauxite
    - Copper
    - Mica
    items:
    - label: Bailadila hills, Chhattisgarh
      bin: Iron ore
      clue: A ferrous belt.
      why: Iron ore.
    - label: Kudremukh, Karnataka
      bin: Iron ore
      clue: Ballari–Chitradurga belt.
      why: Iron ore.
    - label: Panchpatmali in Koraput, Odisha
      bin: Bauxite
      clue: Used for aluminium.
      why: Bauxite.
    - label: Amarkantak plateau
      bin: Bauxite
      clue: For aluminium.
      why: Bauxite.
    - label: Khetri, Rajasthan
      bin: Copper
      clue: Non-ferrous metal.
      why: Copper.
    - label: Koderma, Jharkhand
      bin: Mica
      clue: Non-metallic.
      why: Mica.
  lesson:
    - teach: 'A mineral is a natural substance with a definite structure. Minerals are metallic (ferrous, with iron: iron ore, manganese; non-ferrous: copper, bauxite, lead), non-metallic (mica, salt, limestone) or energy minerals (coal, petroleum, natural gas). They occur in veins and lodes, in beds, as residues, or as placer deposits in river sands.'
      picture:
        kind: compare
        columns:
        - title: Ferrous
          points:
          - Contain iron
          - Iron ore, manganese
        - title: Non-ferrous
          points:
          - No iron
          - Copper, bauxite, lead
        - title: Non-metallic
          points:
          - Not metals
          - Mica, limestone, salt
        alt: Ferrous minerals contain iron (iron ore, manganese); non-ferrous metals don't (copper, bauxite, lead); non-metallic minerals are not metals (mica, limestone, salt).
      check:
        prompt: Manganese is a … mineral.
        options:
        - Ferrous
        - Non-ferrous
        - Non-metallic
        answer: Ferrous
        why: Ferrous group includes iron and manganese.
    - teach: 'Iron ore is the backbone of industry. Magnetite has the most iron (up to 70%) and is magnetic; haematite is the most used. Main belts: Odisha–Jharkhand, Durg–Bastar–Chandrapur, Ballari–Chitradurga–Chikkamagaluru–Tumakuru (including Kudremukh, Karnataka) and Maharashtra–Goa. Manganese makes steel and bleaching powder.'
      check:
        prompt: Which iron ore is magnetic?
        options:
        - Magnetite
        - Haematite
        - Bauxite
        answer: Magnetite
        why: Its name says so.
    - teach: 'Non-ferrous: copper (Balaghat in MP, Khetri in Rajasthan, Singhbhum in Jharkhand) is used in wires; bauxite gives aluminium (Odisha leads, Panchpatmali). Non-metallic: mica (Koderma–Gaya–Hazaribagh belt) is used in electrical and electronic goods; limestone is for cement and iron smelting. Mining can harm miners'' health and pollute water and land.'
      check:
        prompt: Mica is used mainly in…
        options:
        - Electrical and electronic goods
        - Cement
        - Food
        answer: Electrical and electronic goods
        why: It insulates well.
  items:
