- code: cbse10ss.minerals.energy
  title: Energy resources
  after:
  - cbse10ss.minerals.types
  notes: |
    Conventional sources: firewood, cattle dung, coal, petroleum, natural gas, electricity. Coal types by quality:
    peat (lowest), lignite (brown coal, Neyveli in Tamil Nadu), bituminous (most used commercially; metallurgical
    coal for iron and steel), anthracite (highest quality). Gondwana coal (about 200 million years old) in the
    Damodar valley (Jharia, Raniganj, Bokaro); tertiary coal in the north-east. Petroleum: Mumbai High (about 63%
    of output), Gujarat (Ankleshwar), Assam (Digboi, the oldest). Natural gas: Krishna–Godavari basin; HVJ
    pipeline. Electricity: hydel (renewable) and thermal (coal, petroleum, gas). Nuclear: uranium and thorium;
    Kalpakkam, Tarapur. Non-conventional: solar (Madhapur near Bhuj), wind (Tamil Nadu from Nagercoil to
    Madurai is the largest wind farm cluster), biogas (gobar gas), tidal (Gulf of Khambhat, Kachchh), geothermal
    (Parvati valley near Manikarn, Puga valley in Ladakh). Conservation: use public transport, switch off lights,
    use efficient appliances.
  explanations:
    text: India still runs mostly on coal, oil and gas, which will run out and pollute the air. Clean sources like solar, wind, biogas, tidal and geothermal energy are renewable and are growing fast. Saving energy at home is as important as producing more.
    visual: 'Draw two baskets: a grey one with coal, oil, gas and uranium (conventional), and a green one with sun, wind, biogas, tides and hot springs (non-conventional).'
    step_by_step: 'Step 1: Is the source renewable? Step 2: Conventional or non-conventional? Step 3: Name a place in India where it is produced. Step 4: Name a way to save energy.'
    real_world: 'Many villages use gobar gas plants: cattle dung produces biogas for cooking and leaves good manure behind.'
  picture:
    kind: bars
    bars:
    - label: Peat
      value: 1
    - label: Lignite
      value: 2
    - label: Bituminous
      value: 3
    - label: Anthracite
      value: 4
    unit: quality rank
    alt: 'Bar chart ranking coal types by quality: peat lowest, then lignite, bituminous, and anthracite highest.'
  activity:
    type: order
    prompt: Put the types of coal from lowest to highest quality.
    steps:
    - Peat
    - Lignite (brown coal)
    - Bituminous
    - Anthracite
    reasons:
      Lignite (brown coal): Lignite has more carbon than peat; Neyveli has it.
      Bituminous: Bituminous is better than lignite; most used commercially.
      Anthracite: Anthracite is the highest quality, with the most carbon.
  lesson:
    - teach: Energy comes from conventional sources (firewood, cattle dung, coal, petroleum, natural gas, electricity) and non-conventional ones (solar, wind, tide, geothermal, biogas, atomic). Coal is India's most abundant fossil fuel; grades are peat, lignite (low, like Neyveli), bituminous (most used) and anthracite (highest). Gondwana coal is about 200 million years old (Damodar valley).
      check:
        prompt: Which is the most commonly used coal?
        options:
        - Bituminous
        - Peat
        - Anthracite
        answer: Bituminous
        why: It is used in industry and power.
    - teach: 'Petroleum is the next major source: Mumbai High produces about 63%, Gujarat 18% and Assam 16%; Digboi in Assam is the oldest field. Natural gas is clean; the Hazira–Vijaipur–Jagdishpur pipeline carries it. Electricity is made from thermal (coal, oil, gas) and hydel (falling water) plants.'
      picture:
        kind: bars
        unit: '% of India''s petroleum'
        bars:
        - label: Mumbai High
          value: 63
        - label: Gujarat
          value: 18
        - label: Assam
          value: 16
        alt: 'Shares of India''s petroleum: Mumbai High about 63%, Gujarat about 18%, Assam about 16%.'
      check:
        prompt: Which is India's oldest oil field?
        options:
        - Digboi
        - Mumbai High
        - Ankleshwar
        answer: Digboi
        why: In Assam.
    - teach: 'Non-conventional energy is growing: nuclear (Tarapur, Rawatbhata, Kalpakkam), solar (photovoltaic plants, like near Bhuj), wind (Nagarcoil to Madurai in Tamil Nadu is the biggest belt), biogas (from cow dung and waste), tidal (Gulf of Khambhat, Kachchh) and geothermal (Parvati valley in Manikaran, Puga valley in Ladakh). Saving energy is everyone''s job.'
      check:
        prompt: The largest wind farm cluster is in…
        options:
        - Tamil Nadu
        - Punjab
        - Bihar
        answer: Tamil Nadu
        why: From Nagarcoil to Madurai.
