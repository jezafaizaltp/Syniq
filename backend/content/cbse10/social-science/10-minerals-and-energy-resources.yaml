# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 5.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 10
title: Minerals and Energy Resources
tips:
  c10ss_iron_ores: Magnetite has the most iron (up to 70%); haematite (50–60%) is the most widely used.
  c10ss_coal_grades: 'From lowest to highest: peat, lignite, bituminous, anthracite.'
concepts:
- code: cbse10ss.minerals.types
  title: Minerals and where they are found
  notes: |
    A mineral is a homogeneous, naturally occurring substance with a definite internal structure. Minerals occur
    in veins and lodes (cracks in igneous and metamorphic rocks: zinc, copper, lead, tin), in beds or layers of
    sedimentary rocks (coal, gypsum, potash), from decomposed surface rocks (bauxite), as alluvial deposits in
    river sands (placer deposits of gold, tin, platinum) and in ocean waters (salt, magnesium). Ferrous minerals
    (with iron): iron ore (magnetite the best, with about 70% iron; haematite the most used, 50–60%), manganese.
    Belts: Odisha–Jharkhand, Durg–Bastar–Chandrapur (Bailadila hills, Chhattisgarh), Ballari–Chitradurga–
    Chikkamagaluru–Tumakuru (Kudremukh, Karnataka), Maharashtra–Goa. Non-ferrous: copper (Balaghat MP, Khetri
    Rajasthan), bauxite for aluminium (Amarkantak, Odisha's Panchpatmali in Koraput). Non-metallic: mica (Koderma
    in Jharkhand), limestone (cement). Mining is hazardous to health and the environment.
  explanations:
    text: 'Minerals form in different ways: in cracks in hard rocks, in layers of sedimentary rock, or washed into river sands. Iron ore, India''s key ferrous mineral, is mined in belts across Odisha, Jharkhand, Chhattisgarh, Karnataka and Goa. Non-ferrous minerals like copper and bauxite and non-metals like mica are also vital.'
    visual: 'Draw a map with dots: iron ore in Odisha–Jharkhand, Bailadila in Chhattisgarh, Kudremukh in Karnataka; copper at Khetri and Balaghat; bauxite at Panchpatmali; mica at Koderma.'
    step_by_step: 'Step 1: Ferrous or non-ferrous? (Does it contain iron?) Step 2: Name the ore and its quality. Step 3: Name the belt or mine. Step 4: Name its main use.'
    real_world: Most aluminium foil and window frames come from bauxite mined in places like Odisha's Koraput district.
  picture:
    kind: compare
    columns:
    - title: Ferrous
      points:
      - 'Iron ore: magnetite, haematite'
      - Manganese
      - 'Belts: Odisha, Chhattisgarh, Karnataka'
    - title: Non-ferrous
      points:
      - 'Copper: Khetri, Balaghat'
      - 'Bauxite: Panchpatmali, Amarkantak'
      - Lead, zinc, gold
    - title: Non-metallic
      points:
      - 'Mica: Koderma'
      - 'Limestone: cement'
      - Gypsum, salt
    alt: 'Types of minerals: ferrous like iron ore and manganese; non-ferrous like copper and bauxite; non-metallic like mica and limestone, with places where they are found.'
  items:
  - prompt: Which iron ore has the highest iron content (up to about 70%)?
    options:
    - Magnetite
    - Haematite
    - Bauxite
    - Limonite
    answer: Magnetite
    difficulty: 1
    hints:
    - It has magnetic qualities.
    - Haematite is used most.
    solution: Magnetite is the finest iron ore with up to 70% iron.
    mistakes:
      Haematite: c10ss_iron_ores
  - prompt: Bauxite is the ore of which metal?
    options:
    - Aluminium
    - Iron
    - Copper
    - Zinc
    answer: Aluminium
    difficulty: 1
    hints:
    - Light, strong metal.
    - Formed from decomposed rocks.
    solution: Aluminium is extracted from bauxite.
  - prompt: Kudremukh iron ore mine is in which state?
    options:
    - Karnataka
    - Odisha
    - Goa
    - Jharkhand
    answer: Karnataka
    difficulty: 2
    hints:
    - Western Ghats.
    - The Ballari–Chitradurga–Chikkamagaluru–Tumakuru belt.
    solution: Kudremukh is in the Western Ghats of Karnataka.
  - prompt: 'Koderma in Jharkhand is famous for:'
    options:
    - Mica
    - Coal
    - Copper
    - Petroleum
    answer: Mica
    difficulty: 2
    hints:
    - Used in electrical industry.
    - Non-metallic.
    solution: The Koderma–Gaya–Hazaribagh belt is a leading mica producer.
  - prompt: Coal is found in which kind of rock formation?
    options:
    - Beds or layers in sedimentary rocks
    - Veins in igneous rocks
    - Ocean water
    - Placer deposits in rivers
    answer: Beds or layers in sedimentary rocks
    difficulty: 2
    hints:
    - Formed from buried plants.
    - Under heat and pressure.
    solution: Coal occurs in beds of sedimentary rocks.
  - prompt: Haematite iron ore contains roughly 50–60% iron. What is the midpoint of that range, in percent?
    answer: '55'
    check: (50 + 60)/2
    difficulty: 1
    hints:
    - Add and halve.
    - (50 + 60) ÷ 2.
    solution: (50 + 60) ÷ 2 = 55%.
- code: cbse10ss.minerals.energy
  title: Energy resources
  after:
  - cbse10ss.minerals.types
  notes: |
    Conventional sources: firewood, cattle dung, coal, petroleum, natural gas, electricity. Coal types by quality:
    peat (lowest), lignite (brown coal, Neyveli in Tamil Nadu), bituminous (most used commercially; metallurgical
    coal for iron and steel), anthracite (highest quality). Gondwana coal (about 200 million years old) in the
    Damodar valley (Jharia, Raniganj, Bokaro); tertiary coal in the north-east. Petroleum: Mumbai High (about 63%
    of output), Gujarat (Ankleshwar), Assam (Digboi, the oldest). Natural gas: Krishna–Godavari basin; HVJ
    pipeline. Electricity: hydel (renewable) and thermal (coal, petroleum, gas). Nuclear: uranium and thorium;
    Kalpakkam, Tarapur. Non-conventional: solar (Madhapur near Bhuj), wind (Tamil Nadu from Nagercoil to
    Madurai is the largest wind farm cluster), biogas (gobar gas), tidal (Gulf of Khambhat, Kachchh), geothermal
    (Parvati valley near Manikarn, Puga valley in Ladakh). Conservation: use public transport, switch off lights,
    use efficient appliances.
  explanations:
    text: India still runs mostly on coal, oil and gas, which will run out and pollute the air. Clean sources like solar, wind, biogas, tidal and geothermal energy are renewable and are growing fast. Saving energy at home is as important as producing more.
    visual: 'Draw two baskets: a grey one with coal, oil, gas and uranium (conventional), and a green one with sun, wind, biogas, tides and hot springs (non-conventional).'
    step_by_step: 'Step 1: Is the source renewable? Step 2: Conventional or non-conventional? Step 3: Name a place in India where it is produced. Step 4: Name a way to save energy.'
    real_world: 'Many villages use gobar gas plants: cattle dung produces biogas for cooking and leaves good manure behind.'
  picture:
    kind: bars
    bars:
    - label: Peat
      value: 1
    - label: Lignite
      value: 2
    - label: Bituminous
      value: 3
    - label: Anthracite
      value: 4
    unit: quality rank
    alt: 'Bar chart ranking coal types by quality: peat lowest, then lignite, bituminous, and anthracite highest.'
  items:
  - prompt: Which is the highest quality hard coal?
    options:
    - Anthracite
    - Peat
    - Lignite
    - Bituminous
    answer: Anthracite
    difficulty: 1
    hints:
    - Most carbon.
    - Peat is lowest.
    solution: Anthracite is the highest quality coal.
    mistakes:
      Bituminous: c10ss_coal_grades
  - prompt: 'Neyveli in Tamil Nadu is known for:'
    options:
    - Lignite (brown coal)
    - Anthracite
    - Petroleum
    - Uranium
    answer: Lignite (brown coal)
    difficulty: 2
    hints:
    - Low-grade coal.
    - Used for electricity.
    solution: Neyveli has India's major lignite reserves.
  - prompt: Which is India's largest petroleum-producing area?
    options:
    - Mumbai High
    - Digboi
    - Ankleshwar
    - Kalol
    answer: Mumbai High
    difficulty: 1
    hints:
    - Offshore.
    - About 63%.
    solution: Mumbai High produces about 63% of India's petroleum.
  - prompt: Which is a non-conventional source of energy?
    options:
    - Wind energy
    - Coal
    - Petroleum
    - Natural gas
    answer: Wind energy
    difficulty: 1
    hints:
    - Renewable.
    - Wind farms in Tamil Nadu.
    solution: Wind is a non-conventional, renewable source.
  - prompt: 'Geothermal energy is produced in India at:'
    options:
    - Parvati valley near Manikarn and Puga valley in Ladakh
    - Mumbai High
    - Jharia
    - Kalpakkam
    answer: Parvati valley near Manikarn and Puga valley in Ladakh
    difficulty: 2
    hints:
    - Uses heat from inside the Earth.
    - Hot springs.
    solution: India's experimental geothermal projects are at Manikarn (Himachal) and Puga (Ladakh).
  - prompt: Mumbai High produces about 63% of India's petroleum. About what percentage comes from everywhere else?
    answer: '37'
    check: 100 - 63
    difficulty: 1
    hints:
    - The total is 100%.
    - 100 − 63.
    solution: 100 − 63 = 37%.
