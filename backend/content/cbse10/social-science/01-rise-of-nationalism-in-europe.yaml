    answer: A customs union that removed tariff barriers among German states
    difficulty: 2
    hints:
    - Formed in 1834.
    - Economic liberalism.
    solution: The Zollverein (1834) abolished tariff barriers between most German states, helping a unified economy.
    mistakes: {"A secret society in Italy": "s10_zollverein"}
  - prompt: Why did many people under Napoleon's rule turn against him?
