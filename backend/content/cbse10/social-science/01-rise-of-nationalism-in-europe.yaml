# CBSE Class 10 Social Science (NCERT), History: India and the Contemporary World II, chapter 1.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 1
title: The Rise of Nationalism in Europe
tips:
  c10ss_vienna: The Congress of Vienna met after Napoleon's defeat, to undo his changes. It was hosted by Austria's Metternich.
  c10ss_unifiers: 'Germany: Bismarck. Italy: Cavour (minister), Victor Emmanuel II (king) and Garibaldi (Red Shirts).'
  s10_balkans: "The Balkans had many Slav groups and was squeezed by big empires. Why would that cause trouble?"
  s10_civil_code: "The Code swept away privileges people got by birth. What did it give everyone instead?"
  s10_frankfurt: "The Frankfurt Parliament was liberal and middle class. How did the Prussian king and the nobles treat its offer?"
  s10_german_empire: "Germany was unified after Prussia defeated France, in the early 1870s."
  s10_marianne: "Germany's allegory was Germania. Marianne has a French name."
  s10_napoleon_burden: "People first welcomed his reforms. What later burdens did his rule put on them?"
  s10_patrie: "'Patrie' is about the nation as a shared home of its citizens, not a building or an institution."
  s10_young_italy: "Mazzini was Italian. Which society matches his own country?"
  s10_zollverein: "'Zoll' means customs duty. Think of trade between the German states, not secret societies or armies."
concepts:
- code: cbse10ss.europe.idea
  title: The idea of the nation after the French Revolution
  notes: |
    In 1848 Frédéric Sorrieu imagined a world of democratic and social republics. The French Revolution (1789)
    first expressed nationalism: ideas of la patrie (fatherland) and le citoyen (citizen), a new tricolour flag,
    one law, uniform weights and measures, French as the common language. Napoleon's Civil Code of 1804 ended
    privileges based on birth, gave equality before the law and secured property rights, but his rule also
    brought censorship, higher taxes and forced service in the army. Liberalism (from Latin liber, free) stood
    for individual freedom, equality before law, government by consent, and, in economics, free markets: the
    German customs union Zollverein (1834) removed tariff barriers. After Napoleon's defeat the Congress of
    Vienna (1815), hosted by Austria's Metternich, restored monarchies (conservatism). Secret societies such as
    Giuseppe Mazzini's Young Italy spread revolutionary ideas.
  explanations:
    text: Nationalism is the feeling that people who share a history, language or culture should belong to one nation and govern themselves. The French Revolution made ordinary people citizens of a nation, not just subjects of a king. Napoleon spread some of these ideas, but after his fall the old kings came back and tried to stop them.
    visual: 'Draw a timeline: 1789 French Revolution, 1804 Napoleonic Code, 1815 Congress of Vienna, 1834 Zollverein, 1848 revolutions. Colour liberal steps green and conservative steps grey.'
    step_by_step: 'Step 1: Ask what new idea appeared: citizen, nation, equality. Step 2: Ask who spread it: revolutionaries, Napoleon, secret societies. Step 3: Ask who resisted it: monarchs at the Congress of Vienna. Step 4: Ask what happened next: revolutions in 1830 and 1848.'
    real_world: When India adopted its own flag, anthem and Constitution in 1947–50, it used the same symbols of nationhood that France first used after 1789.
  picture:
    kind: flow
    steps:
    - '1789: French Revolution, ideas of citizen and nation'
    - '1804: Napoleonic Code, equality before law'
    - '1815: Congress of Vienna restores monarchies'
    - '1834: Zollverein, a German customs union'
    - '1848: revolutions across Europe'
    alt: 'Timeline of European nationalism: the French Revolution in 1789, the Napoleonic Code in 1804, the Congress of Vienna in 1815, the Zollverein in 1834 and the 1848 revolutions.'
  activity:
    type: sort
    prompt: Liberal idea, or conservative?
    bins:
    - Liberal (change, freedom)
    - Conservative (restore the old order)
    items:
    - label: Equality before the law for all citizens
      bin: Liberal (change, freedom)
      clue: Ends privileges of birth.
      why: A liberal idea, as in Napoleon's Civil Code.
    - label: Zollverein removes tariff barriers
      bin: Liberal (change, freedom)
      clue: Free markets in economics.
      why: Economic liberalism.
    - label: Government by consent of the people
      bin: Liberal (change, freedom)
      clue: Who chooses the rulers?
      why: Liberal.
    - label: Congress of Vienna brings back the kings
      bin: Conservative (restore the old order)
      clue: Hosted by Metternich in 1815.
      why: 'Conservatism: restore monarchies.'
    - label: Censorship of newspapers that question kings
      bin: Conservative (restore the old order)
      clue: Stops new ideas.
      why: Conservatives feared liberal ideas.
    - label: Mazzini's Young Italy
      bin: Liberal (change, freedom)
      clue: A secret society for a free, united nation.
      why: Revolutionary and liberal-national.
  items:
  - prompt: What did the French revolutionaries mean by 'la patrie'?
    options:
    - The fatherland
    - The king's palace
    - The church
    - The army
    answer: The fatherland
    difficulty: 1
    hints:
    - It is a French word.
    - It stresses a shared homeland.
    solution: 'La patrie means the fatherland: an idea that the nation belonged to its people.'
    mistakes: {"The king's palace": "s10_patrie"}
  - prompt: Which of these was part of the Napoleonic Code of 1804?
    options:
    - Equality before the law and right to property
    - Restoring privileges by birth
    - Abolishing all private property
    - Making the church the government
    answer: Equality before the law and right to property
    difficulty: 1
    hints:
    - It ended privileges based on birth.
    - It protected property.
    solution: The Civil Code abolished privileges of birth, gave equality before the law and secured property rights.
    mistakes: {"Restoring privileges by birth": "s10_civil_code"}
  - prompt: Who hosted the Congress of Vienna in 1815?
    options:
    - Duke Metternich of Austria
    - Napoleon
    - Giuseppe Mazzini
    - Otto von Bismarck
    answer: Duke Metternich of Austria
    difficulty: 1
    hints:
    - It met after Napoleon's defeat.
    - The Austrian chancellor.
    solution: The Austrian chancellor Duke Metternich hosted the Congress of Vienna.
    mistakes:
      Napoleon: c10ss_vienna
  - prompt: What was the Zollverein?
    options:
    - A customs union that removed tariff barriers among German states
    - A secret society in Italy
    - A French army
    - A treaty that ended the Greek war
    answer: A customs union that removed tariff barriers among German states
    difficulty: 2
    hints:
    - Formed in 1834.
    - Economic liberalism.
    solution: The Zollverein (1834) abolished tariff barriers between most German states, helping a unified economy.
    mistakes: {"A secret society in Italy": "s10_zollverein"}
  - prompt: Why did many people under Napoleon's rule turn against him?
    options:
    - Higher taxes, censorship and forced service in the French army
    - He gave them too much freedom
    - He abolished the Civil Code
    - He refused to build roads
    answer: Higher taxes, censorship and forced service in the French army
    difficulty: 2
    hints:
    - Early enthusiasm faded.
    - Think about what he demanded from people.
    solution: Initial welcome turned to hostility as the new rule brought censorship, taxes and conscription.
    mistakes: {"He gave them too much freedom": "s10_napoleon_burden"}
  - prompt: Giuseppe Mazzini founded which secret society?
    options:
    - Young Italy
    - Young Germany only
    - The Jacobin Club
    - The Frankfurt Parliament
    answer: Young Italy
    difficulty: 1
    hints:
    - He was from Genoa.
    - He later founded Young Europe too.
    solution: Mazzini founded Young Italy in Marseilles (and later Young Europe in Berne).
    mistakes: {"The Jacobin Club": "s10_young_italy"}
- code: cbse10ss.europe.unification
  title: Revolutions and the making of Germany and Italy
  after:
  - cbse10ss.europe.idea
  notes: |
    1830: the July Revolution in France; Greece won independence from the Ottoman Empire (Treaty of
    Constantinople, 1832). Romanticism (poets and folk culture: Grimm brothers, Herder's das volk) built
    national feeling. 1848: liberal revolutions; the Frankfurt Parliament drafted a constitution for Germany,
    but the Prussian king refused the crown and the assembly was dissolved. Germany was unified by Prussia
    under chief minister Otto von Bismarck through three wars (with Austria, Denmark and France); Kaiser
    William I was proclaimed emperor in Versailles in January 1871. Italy: Victor Emmanuel II of
    Sardinia-Piedmont and his minister Cavour, with help from France; Giuseppe Garibaldi's Red Shirts took the
    South (1860); Victor Emmanuel became king of united Italy in 1861. Britain formed by the Act of Union (1707)
    with Scotland. Nations were shown as female allegories: Marianne (France), Germania (Germany). The Balkans
    became an area of tension that led to the First World War.
  explanations:
    text: Germany and Italy were each a patchwork of small states. In Germany, Prussia's Bismarck united them by war and diplomacy. In Italy, the kingdom of Sardinia-Piedmont, its minister Cavour and the volunteer leader Garibaldi brought the pieces together. Artists then drew nations as women such as Marianne and Germania.
    visual: 'Draw Italy as a boot cut into pieces: Sardinia-Piedmont in the north-west, Austria-held lands in the north-east, the Papal States in the middle, the Kingdom of the Two Sicilies in the south. Arrows show Cavour moving from the north and Garibaldi from the south.'
    step_by_step: 'Step 1: Which country? Step 2: Who led it: Bismarck (Germany) or Cavour, Victor Emmanuel and Garibaldi (Italy)? Step 3: How: wars and alliances. Step 4: When: Italy 1861, Germany 1871.'
    real_world: The image of Bharat Mata in India, a woman standing for the nation, is like Marianne for France and Germania for Germany.
  picture:
    kind: compare
    columns:
    - title: Germany
      points:
      - Led by Prussia
      - Otto von Bismarck
      - Wars with Denmark, Austria, France
      - Empire proclaimed 1871 at Versailles
    - title: Italy
      points:
      - Led by Sardinia-Piedmont
      - Cavour and Victor Emmanuel II
      - Garibaldi's Red Shirts took the South
      - Kingdom proclaimed 1861
    alt: 'How Germany and Italy were unified: Germany by Prussia under Bismarck by 1871, Italy by Sardinia-Piedmont with Cavour and Garibaldi by 1861.'
  activity:
    type: order
    prompt: Put the events in order.
    steps:
    - Congress of Vienna restores monarchies (1815)
    - Greece wins independence (1832)
    - Frankfurt Parliament fails (1848)
    - Victor Emmanuel II becomes king of Italy (1861)
    - William I proclaimed German emperor at Versailles (1871)
    reasons:
      Greece wins independence (1832): Greece's freedom came after the 1815 restoration, in the 1830s.
      Frankfurt Parliament fails (1848): The 1848 revolutions came after Greek independence.
      Victor Emmanuel II becomes king of Italy (1861): Italy united after the failed 1848 revolutions.
      William I proclaimed German emperor at Versailles (1871): Germany united ten years after Italy.
  items:
  - prompt: Who was the chief architect of German unification?
    options:
    - Otto von Bismarck
    - Cavour
    - Garibaldi
    - Metternich
    answer: Otto von Bismarck
    difficulty: 1
    hints:
    - Prussia's chief minister.
    - '''Blood and iron''.'
    solution: Bismarck, Prussia's chief minister, unified Germany through wars and diplomacy.
    mistakes:
      Cavour: c10ss_unifiers
  - prompt: In which year was the German Empire proclaimed at Versailles?
    answer: '1871'
    check: '1871'
    difficulty: 1
    hints:
    - After the war with France.
    - January.
    solution: Kaiser William I was proclaimed German Emperor at Versailles in January 1871.
    mistakes: {"1848": "s10_german_empire", "1861": "s10_german_empire"}
  - prompt: Who led the Red Shirts in southern Italy?
    options:
    - Giuseppe Garibaldi
    - Victor Emmanuel II
    - Mazzini
    - Bismarck
    answer: Giuseppe Garibaldi
    difficulty: 1
    hints:
    - A volunteer army.
    - They took the Kingdom of the Two Sicilies in 1860.
    solution: Garibaldi led the Red Shirts into southern Italy in 1860.
    mistakes:
      Victor Emmanuel II: c10ss_unifiers
  - prompt: What happened to the Frankfurt Parliament of 1848?
    options:
    - The Prussian king refused its offer of the crown and it was dissolved
    - It unified Germany at once
    - It made Austria the leader of Germany
    - It became a permanent government
    answer: The Prussian king refused its offer of the crown and it was dissolved
    difficulty: 2
    hints:
    - It was a middle-class assembly.
    - The monarchy and army opposed it.
    solution: Friedrich Wilhelm IV of Prussia rejected the crown; the parliament lost support and was dissolved in 1849.
    mistakes: {"It unified Germany at once": "s10_frankfurt"}
  - prompt: Marianne was the female allegory of which nation?
    options:
    - France
    - Germany
    - Italy
    - Britain
    answer: France
    difficulty: 1
    hints:
    - Germania was Germany.
    - She wore a red cap.
    solution: Marianne, with the red cap and tricolour, stood for France.
    mistakes: {"Germany": "s10_marianne"}
  - prompt: Why was the Balkans region a source of tension before the First World War?
    options:
    - Different Slavic nationalities wanted independence and big powers competed there
    - It was the richest industrial region
    - It was ruled by Britain
    - It had no people
    answer: Different Slavic nationalities wanted independence and big powers competed there
    difficulty: 2
    hints:
    - The Ottoman Empire was breaking up.
    - Russia, Germany, England and Austria-Hungary had interests.
    solution: As the Ottoman Empire weakened, Balkan nationalities clashed and rival European powers interfered, leading towards war in 1914.
    mistakes: {"It was the richest industrial region": "s10_balkans"}
