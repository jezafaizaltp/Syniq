- code: cbse10ss.europe.unification
  title: Revolutions and the making of Germany and Italy
  after:
  - cbse10ss.europe.idea
  notes: |
    1830: the July Revolution in France; Greece won independence from the Ottoman Empire (Treaty of
    Constantinople, 1832). Romanticism (poets and folk culture: Grimm brothers, Herder's das volk) built
    national feeling. 1848: liberal revolutions; the Frankfurt Parliament drafted a constitution for Germany,
    but the Prussian king refused the crown and the assembly was dissolved. Germany was unified by Prussia
    under chief minister Otto von Bismarck through three wars (with Austria, Denmark and France); Kaiser
    William I was proclaimed emperor in Versailles in January 1871. Italy: Victor Emmanuel II of
    Sardinia-Piedmont and his minister Cavour, with help from France; Giuseppe Garibaldi's Red Shirts took the
    South (1860); Victor Emmanuel became king of united Italy in 1861. Britain formed by the Act of Union (1707)
    with Scotland. Nations were shown as female allegories: Marianne (France), Germania (Germany). The Balkans
    became an area of tension that led to the First World War.
  explanations:
    text: Germany and Italy were each a patchwork of small states. In Germany, Prussia's Bismarck united them by war and diplomacy. In Italy, the kingdom of Sardinia-Piedmont, its minister Cavour and the volunteer leader Garibaldi brought the pieces together. Artists then drew nations as women such as Marianne and Germania.
    visual: 'Draw Italy as a boot cut into pieces: Sardinia-Piedmont in the north-west, Austria-held lands in the north-east, the Papal States in the middle, the Kingdom of the Two Sicilies in the south. Arrows show Cavour moving from the north and Garibaldi from the south.'
    step_by_step: 'Step 1: Which country? Step 2: Who led it: Bismarck (Germany) or Cavour, Victor Emmanuel and Garibaldi (Italy)? Step 3: How: wars and alliances. Step 4: When: Italy 1861, Germany 1871.'
    real_world: The image of Bharat Mata in India, a woman standing for the nation, is like Marianne for France and Germania for Germany.
  picture:
    kind: compare
    columns:
    - title: Germany
      points:
      - Led by Prussia
      - Otto von Bismarck
      - Wars with Denmark, Austria, France
      - Empire proclaimed 1871 at Versailles
    - title: Italy
      points:
      - Led by Sardinia-Piedmont
      - Cavour and Victor Emmanuel II
      - Garibaldi's Red Shirts took the South
      - Kingdom proclaimed 1861
    alt: 'How Germany and Italy were unified: Germany by Prussia under Bismarck by 1871, Italy by Sardinia-Piedmont with Cavour and Garibaldi by 1861.'
  activity:
    type: order
    prompt: Put the events in order.
    steps:
    - Congress of Vienna restores monarchies (1815)
    - Greece wins independence (1832)
    - Frankfurt Parliament fails (1848)
    - Victor Emmanuel II becomes king of Italy (1861)
    - William I proclaimed German emperor at Versailles (1871)
    reasons:
      Greece wins independence (1832): Greece's freedom came after the 1815 restoration, in the 1830s.
      Frankfurt Parliament fails (1848): The 1848 revolutions came after Greek independence.
      Victor Emmanuel II becomes king of Italy (1861): Italy united after the failed 1848 revolutions.
      William I proclaimed German emperor at Versailles (1871): Germany united ten years after Italy.
  lesson:
    - teach: 1830 and 1848 brought revolutions across Europe. In 1848 middle-class liberals met at the Frankfurt Parliament to create a united German nation under a constitution. The Prussian king refused their crown, and the aristocracy and army opposed them, so the Parliament failed. Women were not allowed to vote and could only watch from the gallery.
      check:
        prompt: Why did the Frankfurt Parliament fail?
        options:
        - The Prussian king and army opposed it
        - Women ran it
        - It won too many votes
        answer: The Prussian king and army opposed it
        why: It lacked the support of the powerful.
    - teach: 'Germany: Prussia''s chief minister Otto von Bismarck unified Germany through three wars over seven years, ending with victory over France. In January 1871 Kaiser William I was proclaimed German Emperor at Versailles. Italy: Cavour (minister of Sardinia-Piedmont) used diplomacy, Garibaldi''s Red Shirts freed the south, and in 1861 Victor Emmanuel II became king of united Italy.'
      picture:
        kind: compare
        columns:
        - title: Germany
          points:
          - Bismarck, Prussia
          - Wars with Austria, Denmark, France
          - Empire proclaimed 1871
        - title: Italy
          points:
          - Cavour and Victor Emmanuel II
          - Garibaldi's Red Shirts
          - King of Italy 1861
        alt: Germany was unified by Bismarck of Prussia through three wars, with the empire proclaimed in 1871; Italy was unified by Cavour, Victor Emmanuel II and Garibaldi's Red Shirts, with a king of Italy in 1861.
      check:
        prompt: Who led the Red Shirts?
        options:
        - Garibaldi
        - Cavour
        - Bismarck
        answer: Garibaldi
        why: Giuseppe Garibaldi led volunteers.
    - teach: 'Nationalism later turned narrow and aggressive. The Balkans, with many Slav peoples under the Ottoman Empire, became a powder keg: groups fought for land, and big powers (Russia, Germany, England, Austria-Hungary) competed there. This rivalry helped lead to the First World War in 1914.'
      check:
        prompt: The Balkans region was called a powder keg because…
        options:
        - Rivalries could explode into war
        - It made gunpowder
        - It was very rich
        answer: Rivalries could explode into war
        why: Tensions led towards war.
