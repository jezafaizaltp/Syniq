# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 1
title: The Rise of Nationalism in Europe
tips:
  c10ss_vienna: The Congress of Vienna met after Napoleon's defeat, to undo his changes. It was hosted by Austria's Metternich.
  c10ss_unifiers: 'Germany: Bismarck. Italy: Cavour (minister), Victor Emmanuel II (king) and Garibaldi (Red Shirts).'
  s10_balkans: "The Balkans had many Slav groups and was squeezed by big empires. Why would that cause trouble?"
  s10_civil_code: "The Code swept away privileges people got by birth. What did it give everyone instead?"
  s10_frankfurt: "The Frankfurt Parliament was liberal and middle class. How did the Prussian king and the nobles treat its offer?"
  s10_german_empire: "Germany was unified after Prussia defeated France, in the early 1870s."
  s10_marianne: "Germany's allegory was Germania. Marianne has a French name."
  s10_napoleon_burden: "People first welcomed his reforms. What later burdens did his rule put on them?"
  s10_patrie: "'Patrie' is about the nation as a shared home of its citizens, not a building or an institution."
  s10_young_italy: "Mazzini was Italian. Which society matches his own country?"
  s10_zollverein: "'Zoll' means customs duty. Think of trade between the German states, not secret societies or armies."
  c10ss1_liberal: For the middle classes of the early 1800s, liberalism meant freedom for the individual, equality before the law, and government by consent. Which option fits those ideas?
  c10ss1_romantic: Romantic writers and artists stirred national feeling through folk songs, folk tales, language and a shared past, not through armies or treaties.
  c10ss1_symbol: Artists showed nations as women (allegories). Each symbol stood for an idea, such as broken chains for freedom.
  c10ss1_greece: The Greek war of independence was against the Ottoman Empire, and it was settled by a treaty in the early 1830s.
  c10ss1_britain: Britain's nation-state grew slowly through the power of the English and an Act of Union, not through one revolution.
  c10ss1_frenchrev: The French revolutionaries made people feel part of one nation with ideas like la patrie, le citoyen, a new flag and one language.
concepts:
- code: cbse10ss.europe.idea
  title: The idea of the nation after the French Revolution
  notes: |
    In 1848 Frédéric Sorrieu imagined a world of democratic and social republics. The French Revolution (1789)
    first expressed nationalism: ideas of la patrie (fatherland) and le citoyen (citizen), a new tricolour flag,
    one law, uniform weights and measures, French as the common language. Napoleon's Civil Code of 1804 ended
    privileges based on birth, gave equality before the law and secured property rights, but his rule also
    brought censorship, higher taxes and forced service in the army. Liberalism (from Latin liber, free) stood
    for individual freedom, equality before law, government by consent, and, in economics, free markets: the
    German customs union Zollverein (1834) removed tariff barriers. After Napoleon's defeat the Congress of
    Vienna (1815), hosted by Austria's Metternich, restored monarchies (conservatism). Secret societies such as
    Giuseppe Mazzini's Young Italy spread revolutionary ideas.
  explanations:
    text: Nationalism is the feeling that people who share a history, language or culture should belong to one nation and govern themselves. The French Revolution made ordinary people citizens of a nation, not just subjects of a king. Napoleon spread some of these ideas, but after his fall the old kings came back and tried to stop them.
    visual: 'Draw a timeline: 1789 French Revolution, 1804 Napoleonic Code, 1815 Congress of Vienna, 1834 Zollverein, 1848 revolutions. Colour liberal steps green and conservative steps grey.'
    step_by_step: 'Step 1: Ask what new idea appeared: citizen, nation, equality. Step 2: Ask who spread it: revolutionaries, Napoleon, secret societies. Step 3: Ask who resisted it: monarchs at the Congress of Vienna. Step 4: Ask what happened next: revolutions in 1830 and 1848.'
    real_world: When India adopted its own flag, anthem and Constitution in 1947–50, it used the same symbols of nationhood that France first used after 1789.
  picture:
    kind: flow
    steps:
    - '1789: French Revolution, ideas of citizen and nation'
    - '1804: Napoleonic Code, equality before law'
    - '1815: Congress of Vienna restores monarchies'
    - '1834: Zollverein, a German customs union'
    - '1848: revolutions across Europe'
    alt: 'Timeline of European nationalism: the French Revolution in 1789, the Napoleonic Code in 1804, the Congress of Vienna in 1815, the Zollverein in 1834 and the 1848 revolutions.'
  activity:
    type: sort
    prompt: Liberal idea, or conservative?
    bins:
    - Liberal (change, freedom)
    - Conservative (restore the old order)
    items:
    - label: Equality before the law for all citizens
      bin: Liberal (change, freedom)
      clue: Ends privileges of birth.
      why: A liberal idea, as in Napoleon's Civil Code.
    - label: Zollverein removes tariff barriers
      bin: Liberal (change, freedom)
      clue: Free markets in economics.
      why: Economic liberalism.
    - label: Government by consent of the people
      bin: Liberal (change, freedom)
      clue: Who chooses the rulers?
      why: Liberal.
    - label: Congress of Vienna brings back the kings
      bin: Conservative (restore the old order)
      clue: Hosted by Metternich in 1815.
      why: 'Conservatism: restore monarchies.'
    - label: Censorship of newspapers that question kings
      bin: Conservative (restore the old order)
      clue: Stops new ideas.
      why: Conservatives feared liberal ideas.
    - label: Mazzini's Young Italy
      bin: Liberal (change, freedom)
      clue: A secret society for a free, united nation.
      why: Revolutionary and liberal-national.
  lesson:
    - teach: 'Before the 1800s, most Europeans lived in large empires ruled by monarchs, with many languages and peoples. The French Revolution of 1789 changed this: power passed from the king to the people. Ideas like la patrie (the fatherland) and le citoyen (the citizen), a new tricolour flag, one national language and a shared law made people feel part of one nation.'
      picture:
        kind: flow
        steps:
        - Empires and kings
        - French Revolution 1789
        - Citizens, flag, one language
        - Napoleon's Code spreads ideas
        - Nations demand their own states
        alt: From empires ruled by kings, through the French Revolution of 1789 and its citizen ideas, to Napoleon spreading them, and then nations demanding their own states.
      check:
        prompt: Which idea did the French revolutionaries promote?
        options:
        - Le citoyen, the citizen
        - Rule by birth
        - Many local currencies
        answer: Le citoyen, the citizen
        why: They stressed equal rights of citizens.
    - teach: Napoleon's Civil Code of 1804 ended privileges by birth, gave equality before the law and secured property. He simplified administration, freed peasants from feudal dues and removed guild restrictions. But he also raised taxes, censored the press and forced men into his armies, so many people turned against French rule.
      check:
        prompt: Which was a burden of Napoleon's rule?
        options:
        - Forced service in his armies
        - Equality before the law
        - Uniform weights and measures
        answer: Forced service in his armies
        why: Conscription was hated.
    - teach: 'After Napoleon''s defeat, the Congress of Vienna (1815), led by Metternich of Austria, brought back the old monarchies. Liberals and nationalists answered with secret societies, such as Mazzini''s Young Italy. The new middle classes wanted liberalism: individual freedom, equality before the law and free trade (the Zollverein customs union in German lands).'
      check:
        prompt: What did the Congress of Vienna try to do?
        options:
        - Undo Napoleon's changes
        - Unify Germany
        - Spread democracy
        answer: Undo Napoleon's changes
        why: It restored conservative monarchies.
  items:
  - prompt: What did the French revolutionaries mean by 'la patrie'?
    options:
