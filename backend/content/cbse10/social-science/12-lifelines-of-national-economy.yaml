# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 7.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 12
title: Lifelines of National Economy
tips:
  c10ss_corridors: 'Golden Quadrilateral: the four metros. North–South: Srinagar–Kanyakumari. East–West: Silchar–Porbandar.'
  c10ss_balance_trade: "Balance of trade = exports − imports. If exports are bigger, the balance is good for the country; if imports are bigger, the result is negative."
  s10_kandla: "Mumbai and Kolkata are old colonial ports. Which port was built after Partition?"
  s10_nw1: "NW1 follows the Ganga across several states, from Uttar Pradesh to the sea in West Bengal. Recall its length from the waterways table."
concepts:
- code: cbse10ss.lifelines.transport
  title: Transport, communication and trade
  notes: |
    Transport, communication and trade are the lifelines of an economy. Roads: the Golden Quadrilateral (super
    highway linking Delhi, Kolkata, Chennai and Mumbai, by NHAI); North–South corridor (Srinagar to
    Kanyakumari) and East–West corridor (Silchar to Porbandar); national highways (built by CPWD), state
    highways, district roads, rural roads (Pradhan Mantri Grama Sadak Yojana), border roads (BRO). Railways
    are the principal mode for freight and passengers; the network is dense in the Northern Plains, sparse in
    hilly and desert areas. Pipelines carry crude oil, gas and even solids as slurry (e.g., from Assam to Kanpur,
    Salaya to Jalandhar, HVJ gas pipeline). Waterways: NW-1 on the Ganga (Allahabad–Haldia, 1620 km). India has
    12 major ports; Kandla (Deendayal Port) was the first developed after independence; Mumbai is the biggest
    natural harbour; Mormugao (Goa) handles iron ore exports. Airways: fastest, reach remote areas; Pawan Hans
    helicopters serve hilly areas. Communication: India Post, telecom, mass media. Trade: exports minus imports
    is the balance of trade; a surplus is favourable, a deficit unfavourable. Tourism earns foreign exchange.
  explanations:
    text: Roads, railways, pipelines, waterways and airways carry goods and people across India, and communication networks carry information. Together with trade they keep the economy alive, like veins in a body. When a country exports more than it imports, its balance of trade is favourable.
    visual: Draw India with the Golden Quadrilateral as a square joining Delhi, Kolkata, Chennai and Mumbai, and a big cross for the North–South and East–West corridors.
    step_by_step: 'Step 1: Name the mode of transport. Step 2: Give its advantage (cost, speed, reach). Step 3: Give an example route or port. Step 4: For trade, compare exports and imports.'
    real_world: 'Flowers grown in Bengaluru reach Delhi markets the next morning by air: speed matters for goods that spoil quickly.'
  picture:
    kind: flow
    steps:
    - Delhi
    - Kolkata
    - Chennai
    - Mumbai
    - 'Back to Delhi: the Golden Quadrilateral'
    alt: The Golden Quadrilateral super highway links Delhi, Kolkata, Chennai and Mumbai in a loop.
  activity:
    type: sort
    prompt: Which transport link?
    bins:
    - Golden Quadrilateral
    - North–South corridor
    - East–West corridor
    - NW-1
    items:
    - label: Links Delhi, Kolkata, Chennai and Mumbai
      bin: Golden Quadrilateral
      clue: Four metro cities.
      why: Golden Quadrilateral.
    - label: Srinagar to Kanyakumari
      bin: North–South corridor
      clue: Top to bottom.
      why: North–South corridor.
    - label: Silchar to Porbandar
      bin: East–West corridor
      clue: Assam to Gujarat.
      why: East–West corridor.
    - label: On the Ganga, Allahabad to Haldia
      bin: NW-1
      clue: A waterway.
      why: National Waterway 1.
    - label: Built by NHAI as a super highway
      bin: Golden Quadrilateral
      clue: Four sides.
      why: Golden Quadrilateral.
  items:
  - prompt: The Golden Quadrilateral links which four cities?
    options:
    - Delhi, Kolkata, Chennai, Mumbai
    - Delhi, Jaipur, Agra, Lucknow
    - Srinagar, Kanyakumari, Silchar, Porbandar
    - Kolkata, Patna, Varanasi, Allahabad
    answer: Delhi, Kolkata, Chennai, Mumbai
    difficulty: 1
    hints:
    - The four metros.
    - The corridors use the other cities.
    solution: The Golden Quadrilateral connects Delhi, Kolkata, Chennai and Mumbai.
    mistakes:
      Srinagar, Kanyakumari, Silchar, Porbandar: c10ss_corridors
  - prompt: 'The East–West corridor connects:'
    options:
    - Silchar and Porbandar
    - Srinagar and Kanyakumari
    - Delhi and Mumbai
    - Kolkata and Chennai
    answer: Silchar and Porbandar
    difficulty: 2
    hints:
    - Assam to Gujarat.
    - North–South is Srinagar–Kanyakumari.
    solution: The East–West corridor links Silchar (Assam) with Porbandar (Gujarat).
    mistakes:
      Srinagar and Kanyakumari: c10ss_corridors
  - prompt: Which was the first port developed after independence?
    options:
    - Kandla
    - Mumbai
    - Kolkata
    - Chennai
    answer: Kandla
    difficulty: 2
    hints:
    - In Kachchh, Gujarat.
    - To ease the loss of Karachi.
    solution: Kandla (now Deendayal Port) was developed after Partition to replace Karachi.
    mistakes: {"Mumbai": "s10_kandla", "Kolkata": "s10_kandla"}
  - prompt: National Waterway 1 on the Ganga from Allahabad to Haldia is how many km long?
    answer: '1620'
    check: '1620'
    difficulty: 2
    hints:
    - Over 1600 km.
    - India's longest waterway.
    solution: NW-1 between Allahabad and Haldia is 1620 km long.
    mistakes: {"891": "s10_nw1", "2620": "s10_nw1"}
  - prompt: 'When the value of exports is more than imports, the balance of trade is:'
    options:
    - Favourable
    - Unfavourable
    - Zero
    - Negative
    answer: Favourable
    difficulty: 1
    hints:
    - Exports bring money in.
    - A surplus.
    solution: Exports greater than imports give a favourable balance of trade.
    mistakes:
      Unfavourable: c10ss_balance_trade
  - prompt: A country exports goods worth ₹500 crore and imports goods worth ₹650 crore. What is its trade balance, in crore? (Use a minus sign for a deficit.)
    answer: '-150'
    check: 500 - 650
    difficulty: 2
    hints:
    - Balance = exports − imports.
    - 500 − 650.
    solution: 'Step 1: 500 − 650 = −150. Step 2: A deficit of ₹150 crore: unfavourable.'
    mistakes:
      '150': c10ss_balance_trade
