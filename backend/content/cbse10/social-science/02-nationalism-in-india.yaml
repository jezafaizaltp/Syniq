- code: cbse10ss.india.civildis
  title: Civil Disobedience and the sense of belonging
  after:
  - cbse10ss.india.noncoop
  notes: |
    The Simon Commission (1928) had no Indian member and was greeted with 'Go back, Simon'. At the Lahore session
    (December 1929) under Jawaharlal Nehru, Congress declared Purna Swaraj (complete independence); 26 January
    1930 was celebrated as Independence Day. Gandhiji's Salt March from Sabarmati to Dandi (12 March – 6 April
    1930, about 240 miles) began Civil Disobedience: breaking colonial laws, not just non-cooperating. Gandhi–Irwin
    Pact (March 1931); Second Round Table Conference in London failed. Dr B.R. Ambedkar organised the Depressed
    Classes Association (1930) and wanted separate electorates for dalits; the Poona Pact (1932) gave reserved
    seats instead. Industrialists, rich peasants and women joined; many Muslims stayed away. Collective belonging
    was built through Bharat Mata (Abanindranath Tagore's painting), Vande Mataram (Bankim Chandra), folklore,
    the swaraj flag with the spinning wheel, and reinterpretation of history.
  explanations:
    text: In 1930 the movement moved from refusing to cooperate to actively breaking British laws. Gandhiji walked to Dandi and made salt from seawater, defying the salt tax that hurt everyone. Different groups joined for different reasons, and songs, flags and images like Bharat Mata gave people a shared sense of being one nation.
    visual: Draw a map line from Sabarmati Ashram to Dandi on the Gujarat coast, 240 miles, 24 days, with Gandhiji picking up salt at the end.
    step_by_step: 'Step 1: Why 1930? Simon Commission and the Purna Swaraj demand. Step 2: Why salt? A tax that touched rich and poor. Step 3: What was new? Breaking laws, not just boycotting. Step 4: Who joined, who didn''t, and why.'
    real_world: Every 26 January India celebrates Republic Day; the date was chosen because Indians first celebrated it as Purna Swaraj (Independence) Day in 1930.
  picture:
    kind: flow
    steps:
    - '1928: Simon Commission boycotted'
    - 'Dec 1929: Lahore Congress demands Purna Swaraj'
    - '26 Jan 1930: Independence Day observed'
    - 'Mar–Apr 1930: Salt March to Dandi'
    - '1931: Gandhi–Irwin Pact; 1932: Poona Pact'
    alt: From the Simon Commission in 1928 to Purna Swaraj in 1929, the Salt March in 1930 and the pacts of 1931 and 1932.
  activity:
    type: sort
    prompt: Which group, and how did it take part?
    bins:
    - Joined Civil Disobedience
    - Stayed away or had doubts
    items:
    - label: Rich peasants hit by falling prices
      bin: Joined Civil Disobedience
      clue: The Depression cut their income.
      why: They joined, wanting lower revenue.
    - label: Industrialists like G.D. Birla
      bin: Joined Civil Disobedience
      clue: They wanted protection from foreign goods.
      why: They supported it at first.
    - label: Women at protest marches and picketing
      bin: Joined Civil Disobedience
      clue: Salt and foreign cloth.
      why: Many women joined.
    - label: Many Muslims after the 1920s
      bin: Stayed away or had doubts
      clue: Ties had weakened after Khilafat ended.
      why: Many Muslim groups stayed away.
    - label: Dr Ambedkar's Depressed Classes Association
      bin: Stayed away or had doubts
      clue: He wanted separate electorates.
      why: He clashed with Gandhiji; the Poona Pact (1932) followed.
  lesson:
    - teach: In 1928 the all-British Simon Commission arrived and was met with 'Go back, Simon'. In December 1929 the Lahore Congress, under Jawaharlal Nehru, demanded Purna Swaraj (complete independence), and 26 January 1930 was celebrated as Independence Day.
      check:
        prompt: Why was the Simon Commission opposed?
        options:
        - It had no Indian member
        - It was too large
        - It came by ship
        answer: It had no Indian member
        why: Indians were left out.
    - teach: 'On 12 March 1930 Gandhiji set out from Sabarmati on the Salt March, walking 240 miles to Dandi with 78 volunteers, and broke the salt law on 6 April. This began Civil Disobedience: not just refusing to cooperate, but breaking colonial laws. In 1931 the Gandhi-Irwin Pact led him to the Second Round Table Conference in London, which failed.'
      picture:
        kind: compare
        columns:
        - title: Non-Cooperation
          points:
          - 1920–22
          - Refuse to cooperate
          - Boycott schools, courts, cloth
        - title: Civil Disobedience
          points:
          - 1930–34
          - Break colonial laws
          - Salt law, forest laws
        alt: Non-Cooperation (1920 to 1922) refused cooperation through boycotts; Civil Disobedience (1930 to 1934) went further and broke colonial laws like the salt law.
      check:
        prompt: Why salt?
        options:
        - Everyone, rich and poor, used it
        - It was expensive cloth
        - It was exported
        answer: Everyone, rich and poor, used it
        why: A tax on salt touched everyone.
    - teach: 'Groups joined for their own aims: rich peasants against revenue, poor peasants against rents, business people against colonial trade rules, women marching in large numbers. Some held back: Dr B.R. Ambedkar wanted separate electorates for Dalits (the Poona Pact of 1932 gave reserved seats instead), and many Muslim leaders felt left out. A sense of belonging grew through songs like Vande Mataram, the image of Bharat Mata, folklore and the tricolour flag.'
      check:
        prompt: Who painted Bharat Mata?
        options:
        - Abanindranath Tagore
        - Bankim Chandra
        - Raja Ravi Varma
        answer: Abanindranath Tagore
        why: His image shows a calm, spiritual mother.
  items:
  - prompt: Why was the Simon Commission opposed in India?
    options:
    - It did not have a single Indian member
    - It wanted to grant full independence
    - It was led by Gandhiji
    - It banned salt
    answer: It did not have a single Indian member
    difficulty: 1
    hints:
    - '''Go back, Simon''.'
    - Arrived in 1928.
    solution: The commission meant to review India's constitution had only British members.
    mistakes: {"It wanted to grant full independence": "s10_simon"}
  - prompt: Which demand was made at the Lahore Congress in December 1929?
    options:
    - Purna Swaraj, complete independence
    - Dominion status only
    - Separate electorates
    - Partition of India
    answer: Purna Swaraj, complete independence
    difficulty: 1
    hints:
    - Nehru presided.
    - 26 January 1930 followed.
    solution: Under Nehru, the Lahore session formalised the demand for Purna Swaraj.
    mistakes:
      Dominion status only: c10ss_purna_swaraj
  - prompt: About how many miles did Gandhiji walk on the Salt March from Sabarmati to Dandi?
    answer: '240'
    check: 24*10
    difficulty: 2
    hints:
    - It took 24 days.
    - About 10 miles a day.
    solution: The march covered about 240 miles in 24 days, from 12 March to 6 April 1930.
    mistakes: {"24": "s10_dandi", "400": "s10_dandi"}
  - prompt: How was Civil Disobedience different from Non-Cooperation?
    options:
    - People were asked to break colonial laws, not only refuse cooperation
    - It used violence
    - It was only in cities
    - It supported the Khilafat
    answer: People were asked to break colonial laws, not only refuse cooperation
    difficulty: 2
    hints:
    - Making salt broke the salt law.
    - Forest laws were also broken.
    solution: Civil Disobedience asked people to actively break colonial laws, like the salt law.
    mistakes: {"It used violence": "s10_break_laws"}
  - prompt: What did the Poona Pact of 1932 give the Depressed Classes?
    options:
    - Reserved seats in provincial and central councils, elected by general electorates
    - Separate electorates
    - A separate state
    - Nothing at all
    answer: Reserved seats in provincial and central councils, elected by general electorates
    difficulty: 2
    hints:
    - Gandhiji fasted against separate electorates.
    - Ambedkar accepted a compromise.
    solution: The Poona Pact gave dalits reserved seats, but voters were the general electorate.
    mistakes: {"Separate electorates": "s10_poona"}
  - prompt: Who painted the famous image of Bharat Mata?
    options:
    - Abanindranath Tagore
    - Bankim Chandra Chattopadhyay
    - Raja Ravi Varma
    - Rabindranath Tagore
    answer: Abanindranath Tagore
    difficulty: 2
    hints:
    - Bankim wrote Vande Mataram.
    - A Bengal School artist.
    solution: Abanindranath Tagore painted Bharat Mata as calm, composed and spiritual.
    mistakes:
      Bankim Chandra Chattopadhyay: c10ss_bharat_mata
  - prompt: On which date did Gandhiji break the salt law at Dandi?
    options:
    - 6 April 1930
    - 26 January 1930
    - 13 April 1919
    - 15 August 1947
    answer: 6 April 1930
    difficulty: 2
    hints:
    - The march started on 12 March.
    - It took about 24 days.
    solution: He reached Dandi and broke the salt law on 6 April 1930.
    mistakes:
      26 January 1930: c10ss2_dates
  - prompt: Which day was celebrated as Independence Day after the Lahore Congress?
    options:
    - 26 January 1930
    - 15 August 1930
    - 6 April 1930
    - 2 October 1929
    answer: 26 January 1930
    difficulty: 2
    hints:
    - Lahore was in December 1929.
    - Today it is Republic Day.
    solution: 26 January 1930 was celebrated as Independence Day.
    mistakes:
      6 April 1930: c10ss2_dates
  - prompt: Who presided over the Lahore Congress of 1929?
    options:
    - Jawaharlal Nehru
    - Mahatma Gandhi
    - Motilal Nehru
    - Sardar Patel
    answer: Jawaharlal Nehru
    difficulty: 2
    hints:
    - A young leader of the radical group.
    - He became India's first Prime Minister.
    solution: Jawaharlal Nehru presided, and Purna Swaraj was declared.
    mistakes:
      Motilal Nehru: c10ss_purna_swaraj
  - prompt: Which agreement let Gandhiji attend the Second Round Table Conference in 1931?
    options:
    - Gandhi-Irwin Pact
    - Poona Pact
    - Lucknow Pact
    - Treaty of Versailles
    answer: Gandhi-Irwin Pact
    difficulty: 2
    hints:
    - Irwin was the Viceroy.
    - Signed in March 1931.
    solution: The Gandhi-Irwin Pact (5 March 1931) led to his attending the conference in London.
    mistakes:
      Poona Pact: c10ss2_round_table
  - prompt: Why did Dr B.R. Ambedkar clash with Gandhiji at the Round Table Conference?
    options:
    - He wanted separate electorates for Dalits
    - He wanted the British to stay forever
    - He opposed salt tax
    - He wanted Purna Swaraj delayed
    answer: He wanted separate electorates for Dalits
    difficulty: 2
