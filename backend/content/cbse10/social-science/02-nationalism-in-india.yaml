    - He was a sanyasi who had worked in Fiji.
    - Raju led tribals in Andhra.
    solution: Baba Ramchandra led the Awadh peasant movement.
    mistakes:
      Alluri Sitaram Raju: c10ss2_groups
  - prompt: For Assam plantation workers, what did freedom mean?
    options:
    - Being able to move freely and go back to their villages
    - Owning the plantations
    - Joining the army
    - Paying lower taxes
    answer: Being able to move freely and go back to their villages
    difficulty: 2
    hints:
    - The Inland Emigration Act of 1859 stopped them leaving.
    - Many walked off towards home.
    solution: Workers wanted freedom to leave the plantations and return home.
    mistakes:
      Owning the plantations: c10ss2_groups
  - prompt: Which event made Gandhiji withdraw Non-Cooperation in 1922?
    options:
    - Violence at Chauri Chaura
