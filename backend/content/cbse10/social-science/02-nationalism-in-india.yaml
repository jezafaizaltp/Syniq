    solution: Khadi was more expensive than mill cloth, and there weren't enough Indian institutions, so many went back.
    mistakes:
      The British left: c10ss2_groups
  - prompt: In which year did Gandhiji lead the Champaran satyagraha?
    answer: '1917'
