# CBSE Class 10 Social Science (NCERT), History: India and the Contemporary World II, chapter 2.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 2
title: Nationalism in India
tips:
  c10ss_satyagrahas: Champaran (1917) was for indigo farmers; Kheda (1917) for peasants who couldn't pay revenue; Ahmedabad (1918) for mill workers.
  c10ss_sessions: 'Nagpur 1920: Non-Cooperation adopted. Lahore 1929: Purna Swaraj.'
  c10ss_purna_swaraj: In 1929 Congress went beyond dominion status and demanded complete independence.
  c10ss_bharat_mata: Bankim Chandra wrote Vande Mataram; Abanindranath Tagore painted Bharat Mata.
concepts:
- code: cbse10ss.india.noncoop
  title: The First World War, Khilafat and Non-Cooperation
  notes: |
    The First World War brought higher defence spending, taxes, prices, forced recruitment and crop failures.
    Gandhiji returned from South Africa in 1915 with satyagraha (truth and non-violence). Early satyagrahas:
    Champaran (1917, indigo farmers), Kheda (1917, peasants unable to pay revenue), Ahmedabad (1918, mill
    workers). The Rowlatt Act (1919) allowed detention without trial; on 13 April 1919 General Dyer fired on a
    peaceful crowd at Jallianwala Bagh, Amritsar. The Khilafat movement (Muhammad Ali and Shaukat Ali) supported
    the Ottoman Khalifa. The Non-Cooperation Movement was adopted at the Nagpur session (December 1920):
    surrender of titles, boycott of civil services, courts, councils, schools and foreign goods. Peasants in Awadh
    (Baba Ramchandra), tribals in Gudem Hills (Alluri Sitaram Raju), and plantation workers in Assam joined in
    their own ways. Gandhiji called it off in February 1922 after the violence at Chauri Chaura.
  explanations:
    text: 'After the First World War, Indians faced hardship and harsh laws. Gandhiji''s non-violent satyagraha united many groups. The Non-Cooperation Movement asked Indians to stop cooperating with British rule: give up titles, leave government schools and courts, and boycott foreign cloth. When a crowd turned violent at Chauri Chaura, he stopped the movement.'
    visual: 'Draw a chain: War hardships → Rowlatt Act → Jallianwala Bagh → Khilafat → Non-Cooperation (1920) → Chauri Chaura (1922) → movement withdrawn.'
    step_by_step: 'Step 1: Find the grievance (war, Rowlatt Act, Khilafat). Step 2: Find the response (satyagraha, boycott). Step 3: Find who joined and why: each group had its own hopes. Step 4: Find how it ended.'
    real_world: Burning foreign cloth in public bonfires during Non-Cooperation hurt British textile sales and made khadi a symbol of the movement.
  picture:
    kind: flow
    steps:
    - '1917–18: Champaran, Kheda, Ahmedabad satyagrahas'
    - '1919: Rowlatt Act; Jallianwala Bagh massacre'
    - '1920: Non-Cooperation adopted at Nagpur'
    - '1921: boycotts of courts, schools, foreign cloth'
    - 'Feb 1922: Chauri Chaura violence; movement withdrawn'
    alt: From the early satyagrahas of 1917 to the Rowlatt Act and Jallianwala Bagh in 1919, the Non-Cooperation Movement of 1920, and its withdrawal after Chauri Chaura in 1922.
  activity:
    type: order
    prompt: Put the events in order.
    steps:
    - Gandhiji returns from South Africa (1915)
    - Champaran satyagraha for indigo farmers (1917)
    - Jallianwala Bagh massacre (13 April 1919)
    - Non-Cooperation adopted at Nagpur (December 1920)
    - Called off after Chauri Chaura (February 1922)
    reasons:
      Champaran satyagraha for indigo farmers (1917): He led satyagrahas in India only after returning.
      Jallianwala Bagh massacre (13 April 1919): The Rowlatt Act protests of 1919 came after Champaran.
      Non-Cooperation adopted at Nagpur (December 1920): Anger at Jallianwala and the Khilafat issue led to it.
      Called off after Chauri Chaura (February 1922): Gandhiji stopped it when it turned violent.
  items:
  - prompt: Where did Gandhiji lead a satyagraha for indigo farmers in 1917?
    options:
    - Champaran
    - Kheda
    - Ahmedabad
    - Dandi
    answer: Champaran
    difficulty: 1
    hints:
    - In Bihar.
    - Against the oppressive plantation system.
    solution: In Champaran, Bihar, Gandhiji supported peasants forced to grow indigo.
    mistakes:
      Kheda: c10ss_satyagrahas
  - prompt: Why was the Rowlatt Act opposed?
    options:
    - It allowed political prisoners to be detained without trial for two years
    - It raised the price of salt
    - It banned khadi
    - It divided Bengal
    answer: It allowed political prisoners to be detained without trial for two years
    difficulty: 1
    hints:
    - Passed in 1919.
    - It took away civil liberties.
    solution: The Rowlatt Act gave the government power to repress political activity and detain people without trial.
  - prompt: In which year did the Jallianwala Bagh massacre take place?
    answer: '1919'
    check: '1919'
    difficulty: 1
    hints:
    - 13 April, Baisakhi day.
    - Same year as the Rowlatt Act.
    solution: General Dyer's troops fired on the crowd at Jallianwala Bagh on 13 April 1919.
  - prompt: At which session did the Congress adopt the Non-Cooperation programme in December 1920?
    options:
    - Nagpur
    - Lahore
    - Calcutta
    - Karachi
    answer: Nagpur
    difficulty: 2
    hints:
    - It was confirmed after an earlier Calcutta session.
    - Lahore was 1929 (Purna Swaraj).
    solution: The programme was adopted at the Nagpur session in December 1920.
    mistakes:
      Lahore: c10ss_sessions
  - prompt: Why did Gandhiji withdraw the Non-Cooperation Movement in 1922?
    options:
    - The violence at Chauri Chaura, where a police station was set on fire
    - The British granted independence
    - The Khilafat issue was solved
    - The Congress voted against him
    answer: The violence at Chauri Chaura, where a police station was set on fire
    difficulty: 2
    hints:
    - He insisted on non-violence.
    - It happened in Gorakhpur.
    solution: After a clash at Chauri Chaura turned violent, Gandhiji felt people needed more training for non-violent struggle.
  - prompt: How did Alluri Sitaram Raju's rebels in the Gudem Hills differ from Gandhiji's methods?
    options:
    - They used guerrilla warfare, though they were inspired by Gandhiji
    - They followed strict non-violence
    - They boycotted only schools
    - They supported the British
    answer: They used guerrilla warfare, though they were inspired by Gandhiji
    difficulty: 2
    hints:
    - Different groups read the movement in their own way.
    - Forest laws had closed their access.
    solution: Raju claimed inspiration from Gandhiji but believed force was needed; his followers attacked police stations.
- code: cbse10ss.india.civildis
  title: Civil Disobedience and the sense of belonging
  after:
  - cbse10ss.india.noncoop
  notes: |
    The Simon Commission (1928) had no Indian member and was greeted with 'Go back, Simon'. At the Lahore session
    (December 1929) under Jawaharlal Nehru, Congress declared Purna Swaraj (complete independence); 26 January
    1930 was celebrated as Independence Day. Gandhiji's Salt March from Sabarmati to Dandi (12 March – 6 April
    1930, about 240 miles) began Civil Disobedience: breaking colonial laws, not just non-cooperating. Gandhi–Irwin
    Pact (March 1931); Second Round Table Conference in London failed. Dr B.R. Ambedkar organised the Depressed
    Classes Association (1930) and wanted separate electorates for dalits; the Poona Pact (1932) gave reserved
    seats instead. Industrialists, rich peasants and women joined; many Muslims stayed away. Collective belonging
    was built through Bharat Mata (Abanindranath Tagore's painting), Vande Mataram (Bankim Chandra), folklore,
    the swaraj flag with the spinning wheel, and reinterpretation of history.
  explanations:
    text: In 1930 the movement moved from refusing to cooperate to actively breaking British laws. Gandhiji walked to Dandi and made salt from seawater, defying the salt tax that hurt everyone. Different groups joined for different reasons, and songs, flags and images like Bharat Mata gave people a shared sense of being one nation.
    visual: Draw a map line from Sabarmati Ashram to Dandi on the Gujarat coast, 240 miles, 24 days, with Gandhiji picking up salt at the end.
    step_by_step: 'Step 1: Why 1930? Simon Commission and the Purna Swaraj demand. Step 2: Why salt? A tax that touched rich and poor. Step 3: What was new? Breaking laws, not just boycotting. Step 4: Who joined, who didn''t, and why.'
    real_world: Every 26 January India celebrates Republic Day; the date was chosen because Indians first celebrated it as Purna Swaraj (Independence) Day in 1930.
  picture:
    kind: flow
    steps:
    - '1928: Simon Commission boycotted'
    - 'Dec 1929: Lahore Congress demands Purna Swaraj'
    - '26 Jan 1930: Independence Day observed'
    - 'Mar–Apr 1930: Salt March to Dandi'
    - '1931: Gandhi–Irwin Pact; 1932: Poona Pact'
    alt: From the Simon Commission in 1928 to Purna Swaraj in 1929, the Salt March in 1930 and the pacts of 1931 and 1932.
  activity:
    type: sort
    prompt: Which group, and how did it take part?
    bins:
    - Joined Civil Disobedience
    - Stayed away or had doubts
    items:
    - label: Rich peasants hit by falling prices
      bin: Joined Civil Disobedience
      clue: The Depression cut their income.
      why: They joined, wanting lower revenue.
    - label: Industrialists like G.D. Birla
      bin: Joined Civil Disobedience
      clue: They wanted protection from foreign goods.
      why: They supported it at first.
    - label: Women at protest marches and picketing
      bin: Joined Civil Disobedience
      clue: Salt and foreign cloth.
      why: Many women joined.
    - label: Many Muslims after the 1920s
      bin: Stayed away or had doubts
      clue: Ties had weakened after Khilafat ended.
      why: Many Muslim groups stayed away.
    - label: Dr Ambedkar's Depressed Classes Association
      bin: Stayed away or had doubts
      clue: He wanted separate electorates.
      why: He clashed with Gandhiji; the Poona Pact (1932) followed.
  items:
  - prompt: Why was the Simon Commission opposed in India?
    options:
    - It did not have a single Indian member
    - It wanted to grant full independence
    - It was led by Gandhiji
    - It banned salt
    answer: It did not have a single Indian member
    difficulty: 1
    hints:
    - '''Go back, Simon''.'
    - Arrived in 1928.
    solution: The commission meant to review India's constitution had only British members.
  - prompt: Which demand was made at the Lahore Congress in December 1929?
    options:
    - Purna Swaraj, complete independence
    - Dominion status only
    - Separate electorates
    - Partition of India
    answer: Purna Swaraj, complete independence
    difficulty: 1
    hints:
    - Nehru presided.
    - 26 January 1930 followed.
    solution: Under Nehru, the Lahore session formalised the demand for Purna Swaraj.
    mistakes:
      Dominion status only: c10ss_purna_swaraj
  - prompt: About how many miles did Gandhiji walk on the Salt March from Sabarmati to Dandi?
    answer: '240'
    check: 24*10
    difficulty: 2
    hints:
    - It took 24 days.
    - About 10 miles a day.
    solution: The march covered about 240 miles in 24 days, from 12 March to 6 April 1930.
  - prompt: How was Civil Disobedience different from Non-Cooperation?
    options:
    - People were asked to break colonial laws, not only refuse cooperation
    - It used violence
    - It was only in cities
    - It supported the Khilafat
    answer: People were asked to break colonial laws, not only refuse cooperation
    difficulty: 2
    hints:
    - Making salt broke the salt law.
    - Forest laws were also broken.
    solution: Civil Disobedience asked people to actively break colonial laws, like the salt law.
  - prompt: What did the Poona Pact of 1932 give the Depressed Classes?
    options:
    - Reserved seats in provincial and central councils, elected by general electorates
    - Separate electorates
    - A separate state
    - Nothing at all
    answer: Reserved seats in provincial and central councils, elected by general electorates
    difficulty: 2
    hints:
    - Gandhiji fasted against separate electorates.
    - Ambedkar accepted a compromise.
    solution: The Poona Pact gave dalits reserved seats, but voters were the general electorate.
  - prompt: Who painted the famous image of Bharat Mata?
    options:
    - Abanindranath Tagore
    - Bankim Chandra Chattopadhyay
    - Raja Ravi Varma
    - Rabindranath Tagore
    answer: Abanindranath Tagore
    difficulty: 2
    hints:
    - Bankim wrote Vande Mataram.
    - A Bengal School artist.
    solution: Abanindranath Tagore painted Bharat Mata as calm, composed and spiritual.
    mistakes:
      Bankim Chandra Chattopadhyay: c10ss_bharat_mata
