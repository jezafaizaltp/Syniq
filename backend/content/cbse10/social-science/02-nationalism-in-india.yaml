    - Gandhiji fasted against it.
    - It ended in the Poona Pact.
    solution: Ambedkar demanded separate electorates; Gandhiji feared it would divide society.
    mistakes:
      He opposed salt tax: s10_poona
  - prompt: How many miles did the Salt March cover?
    answer: '240'
    check: '240'
    difficulty: 2
    hints:
    - From Sabarmati to Dandi in about 24 days.
    - About 10 miles a day.
    solution: The march covered about 240 miles.
