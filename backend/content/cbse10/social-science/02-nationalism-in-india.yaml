# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 2
title: Nationalism in India
tips:
  c10ss_satyagrahas: "Gandhiji's first satyagraha in India was in Bihar in 1917, for farmers forced to grow indigo. Kheda (Gujarat) was about revenue."
  c10ss_sessions: "Lahore 1929 declared Purna Swaraj. The Non-Cooperation programme was adopted a year after it was proposed, at a session held in central India in December 1920."
  c10ss_purna_swaraj: In 1929 Congress went beyond dominion status and demanded complete independence.
  c10ss_bharat_mata: "Bankim Chandra wrote the song Vande Mataram. The painting of Bharat Mata was made by an artist of the Tagore family, a nephew of Rabindranath."
  s10_break_laws: "Non-Cooperation meant refusing to cooperate. Civil Disobedience went one step further."
  s10_chauri_chaura: "Gandhiji stopped the movement because it broke one of his core principles. Which event did that?"
  s10_dandi: "The march took about 24 days. Recall the distance from the chapter, in miles."
  s10_jallianwala: "The massacre happened in April, right after the Rowlatt protests, just after the First World War ended."
  s10_poona: "Ambedkar wanted separate electorates, but the Poona Pact settled on something else. Who elects the reserved seats?"
  s10_raju: "Raju admired Gandhiji but believed in a different method. Was it non-violent?"
  s10_rowlatt: "The Rowlatt Act was about the power to jail people. What did it let the government do without a trial?"
  s10_simon: "Indians felt shut out of deciding their own future. Who was missing from the Commission?"
  c10ss2_satyagraha: 'Satyagraha means the power of truth: fighting injustice without violence and without wanting revenge, by appealing to the conscience of the oppressor.'
  c10ss2_khilafat: The Khilafat movement was about the Ottoman Sultan, the spiritual head of the Muslim world. Its leaders were the Ali brothers.
  c10ss2_groups: 'Different groups joined for their own reasons: peasants against high rents, tribals for forest rights, plantation workers to go home. Whose reason fits?'
  c10ss2_dates: "Put the events in order: Champaran, then Rowlatt and Jallianwala, then Non-Cooperation, the Simon Commission, Lahore and Dandi. Where does this one sit, and was the war still on?"
  c10ss2_round_table: "Gandhiji called off Civil Disobedience in early 1931 after an agreement with the Viceroy of that time. Which agreement carries the Viceroy's name?"
  c10ss2_limits: 'Not everyone joined in the same way: some Dalit leaders sought separate electorates, many Muslim leaders were wary, and industrial workers joined only in some places.'
concepts:
- code: cbse10ss.india.noncoop
  title: The First World War, Khilafat and Non-Cooperation
  notes: |
    The First World War brought higher defence spending, taxes, prices, forced recruitment and crop failures.
    Gandhiji returned from South Africa in 1915 with satyagraha (truth and non-violence). Early satyagrahas:
    Champaran (1917, indigo farmers), Kheda (1917, peasants unable to pay revenue), Ahmedabad (1918, mill
    workers). The Rowlatt Act (1919) allowed detention without trial; on 13 April 1919 General Dyer fired on a
    peaceful crowd at Jallianwala Bagh, Amritsar. The Khilafat movement (Muhammad Ali and Shaukat Ali) supported
    the Ottoman Khalifa. The Non-Cooperation Movement was adopted at the Nagpur session (December 1920):
    surrender of titles, boycott of civil services, courts, councils, schools and foreign goods. Peasants in Awadh
    (Baba Ramchandra), tribals in Gudem Hills (Alluri Sitaram Raju), and plantation workers in Assam joined in
    their own ways. Gandhiji called it off in February 1922 after the violence at Chauri Chaura.
  explanations:
    text: 'After the First World War, Indians faced hardship and harsh laws. Gandhiji''s non-violent satyagraha united many groups. The Non-Cooperation Movement asked Indians to stop cooperating with British rule: give up titles, leave government schools and courts, and boycott foreign cloth. When a crowd turned violent at Chauri Chaura, he stopped the movement.'
    visual: 'Draw a chain: War hardships → Rowlatt Act → Jallianwala Bagh → Khilafat → Non-Cooperation (1920) → Chauri Chaura (1922) → movement withdrawn.'
    step_by_step: 'Step 1: Find the grievance (war, Rowlatt Act, Khilafat). Step 2: Find the response (satyagraha, boycott). Step 3: Find who joined and why: each group had its own hopes. Step 4: Find how it ended.'
    real_world: Burning foreign cloth in public bonfires during Non-Cooperation hurt British textile sales and made khadi a symbol of the movement.
  picture:
    kind: flow
    steps:
    - '1917–18: Champaran, Kheda, Ahmedabad satyagrahas'
    - '1919: Rowlatt Act; Jallianwala Bagh massacre'
    - '1920: Non-Cooperation adopted at Nagpur'
    - '1921: boycotts of courts, schools, foreign cloth'
    - 'Feb 1922: Chauri Chaura violence; movement withdrawn'
    alt: From the early satyagrahas of 1917 to the Rowlatt Act and Jallianwala Bagh in 1919, the Non-Cooperation Movement of 1920, and its withdrawal after Chauri Chaura in 1922.
  activity:
    type: order
    prompt: Put the events in order.
    steps:
    - Gandhiji returns from South Africa (1915)
    - Champaran satyagraha for indigo farmers (1917)
    - Jallianwala Bagh massacre (13 April 1919)
    - Non-Cooperation adopted at Nagpur (December 1920)
    - Called off after Chauri Chaura (February 1922)
    reasons:
      Champaran satyagraha for indigo farmers (1917): He led satyagrahas in India only after returning.
      Jallianwala Bagh massacre (13 April 1919): The Rowlatt Act protests of 1919 came after Champaran.
      Non-Cooperation adopted at Nagpur (December 1920): Anger at Jallianwala and the Khilafat issue led to it.
      Called off after Chauri Chaura (February 1922): Gandhiji stopped it when it turned violent.
  lesson:
    - teach: The First World War (1914–18) brought India higher taxes, rising prices, forced recruitment of soldiers, crop failures and an influenza epidemic. Anger grew. Gandhiji returned from South Africa in 1915 with satyagraha, a non-violent way of fighting injustice. He led satyagrahas at Champaran (indigo farmers, 1917), Kheda (peasants, 1917) and Ahmedabad (mill workers, 1918).
      picture:
        kind: flow
        steps:
        - Champaran 1917
        - Kheda 1917
        - Ahmedabad 1918
        - Rowlatt protests 1919
        - Non-Cooperation 1920–22
        alt: 'Timeline: Champaran and Kheda satyagrahas in 1917, Ahmedabad mill strike in 1918, Rowlatt protests in 1919, Non-Cooperation Movement 1920 to 1922.'
      check:
        prompt: Satyagraha relies on…
        options:
        - The power of truth and non-violence
        - Armed revolt
        - Foreign help
        answer: The power of truth and non-violence
        why: It appeals to the oppressor's conscience.
    - teach: In 1919 the Rowlatt Act let the government jail people without trial. On 13 April 1919, General Dyer fired on a peaceful crowd at Jallianwala Bagh in Amritsar, killing hundreds. Gandhiji then joined with the Khilafat movement of the Ali brothers, and in December 1920 the Nagpur Congress adopted Non-Cooperation.
      check:
        prompt: Who ordered firing at Jallianwala Bagh?
        options:
        - General Dyer
        - Lord Irwin
        - Simon
        answer: General Dyer
        why: He blocked exits and fired on the crowd.
    - teach: 'Non-Cooperation meant giving up titles, boycotting foreign cloth, government schools, courts and councils. Different groups joined in their own ways: in Awadh peasants led by Baba Ramchandra fought high rents; in Andhra''s Gudem Hills Alluri Sitaram Raju led an armed tribal revolt; Assam plantation workers left to go home. After the violence at Chauri Chaura in February 1922, Gandhiji called the movement off.'
      check:
        prompt: Why did imported cloth sales fall in 1921–22?
        options:
        - People boycotted foreign cloth
        - Ships stopped sailing
        - Cloth became free
        answer: People boycotted foreign cloth
        why: Boycott was part of Non-Cooperation.
  items:
  - prompt: Where did Gandhiji lead a satyagraha for indigo farmers in 1917?
    options:
    - Champaran
    - Kheda
    - Ahmedabad
    - Dandi
    answer: Champaran
    difficulty: 1
    hints:
    - In Bihar.
    - Against the oppressive plantation system.
    solution: In Champaran, Bihar, Gandhiji supported peasants forced to grow indigo.
    mistakes:
      Kheda: c10ss_satyagrahas
  - prompt: Why was the Rowlatt Act opposed?
    options:
    - It allowed political prisoners to be detained without trial for two years
    - It raised the price of salt
    - It banned khadi
    - It divided Bengal
    answer: It allowed political prisoners to be detained without trial for two years
    difficulty: 1
    hints:
    - Passed in 1919.
    - It took away civil liberties.
    solution: The Rowlatt Act gave the government power to repress political activity and detain people without trial.
    mistakes: {"It raised the price of salt": "s10_rowlatt"}
  - prompt: In which year did the Jallianwala Bagh massacre take place?
    answer: '1919'
    check: '1919'
    difficulty: 1
    hints:
    - 13 April, Baisakhi day.
    - Same year as the Rowlatt Act.
    solution: General Dyer's troops fired on the crowd at Jallianwala Bagh on 13 April 1919.
    mistakes: {"1920": "s10_jallianwala", "1930": "s10_jallianwala"}
  - prompt: At which session did the Congress adopt the Non-Cooperation programme in December 1920?
    options:
    - Nagpur
    - Lahore
    - Calcutta
    - Karachi
    answer: Nagpur
    difficulty: 2
    hints:
    - It was confirmed after an earlier Calcutta session.
    - Lahore was 1929 (Purna Swaraj).
    solution: The programme was adopted at the Nagpur session in December 1920.
    mistakes:
      Lahore: c10ss_sessions
  - prompt: Why did Gandhiji withdraw the Non-Cooperation Movement in 1922?
    options:
    - The violence at Chauri Chaura, where a police station was set on fire
    - The British granted independence
    - The Khilafat issue was solved
    - The Congress voted against him
    answer: The violence at Chauri Chaura, where a police station was set on fire
    difficulty: 2
    hints:
    - He insisted on non-violence.
    - It happened in Gorakhpur.
    solution: After a clash at Chauri Chaura turned violent, Gandhiji felt people needed more training for non-violent struggle.
    mistakes: {"The British granted independence": "s10_chauri_chaura"}
  - prompt: How did Alluri Sitaram Raju's rebels in the Gudem Hills differ from Gandhiji's methods?
    options:
    - They used guerrilla warfare, though they were inspired by Gandhiji
    - They followed strict non-violence
    - They boycotted only schools
    - They supported the British
    answer: They used guerrilla warfare, though they were inspired by Gandhiji
    difficulty: 2
    hints:
    - Different groups read the movement in their own way.
    - Forest laws had closed their access.
    solution: Raju claimed inspiration from Gandhiji but believed force was needed; his followers attacked police stations.
    mistakes: {"They followed strict non-violence": "s10_raju"}
  - prompt: Who led the Khilafat Committee with Gandhiji's support?
    options:
    - Muhammad Ali and Shaukat Ali
    - Motilal Nehru and C.R. Das
    - Bhagat Singh
    - B.R. Ambedkar
    answer: Muhammad Ali and Shaukat Ali
    difficulty: 2
    hints:
    - They were brothers.
    - They led the Khilafat movement in Bombay.
    solution: The Ali brothers, Muhammad Ali and Shaukat Ali, led the Khilafat movement.
    mistakes:
      Motilal Nehru and C.R. Das: c10ss2_khilafat
  - prompt: In Kheda (1917), why did Gandhiji support the peasants?
    options:
    - They could not pay revenue after crop failure and plague
    - They wanted to grow indigo
    - They wanted factory jobs
    - They wanted to join the army
    answer: They could not pay revenue after crop failure and plague
    difficulty: 2
    hints:
    - Champaran was about indigo.
    - Kheda farmers asked for relaxed revenue.
    solution: Kheda peasants hit by crop failure and plague wanted revenue collection relaxed.
    mistakes:
      They wanted to grow indigo: c10ss_satyagrahas
  - prompt: In Awadh, which leader organised peasants against talukdars and landlords?
    options:
    - Baba Ramchandra
    - Alluri Sitaram Raju
    - Bhagat Singh
    - Subhas Chandra Bose
    answer: Baba Ramchandra
    difficulty: 2
