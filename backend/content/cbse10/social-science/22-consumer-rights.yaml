# CBSE Class 10 Social Science (NCERT), Economics: Understanding Economic Development, chapter 5.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 22
title: Consumer Rights
tips:
  c10ss_commission_limits: 'Up to ₹50 lakh: district; ₹50 lakh–₹2 crore: state; above ₹2 crore: national (2019 Act, 2021 rules).'
  c10ss22_limits: "Check the limits: is ₹3 crore inside the range that the state commission can hear?"
  s10_agmark: "ISI is for industrial goods and Hallmark for gold. Which mark is for farm products?"
  s10_choose: "Being forced to buy tea with toothpaste takes away which freedom?"
  s10_copra: "COPRA was passed in the mid-1980s and replaced by a new Act in 2019."
  s10_count_days: "Count from 15 March: days left in March, then whole months to 30 November, then 24 days of December."
  s10_informed: "An expiry date gives information."
  c10ss22_rights: Consumers have rights to safety, to be informed, to choose, to be heard, to seek redressal, and to consumer education. Which one does this situation touch?
  c10ss22_exploit: Consumers are exploited by underweighing, adulteration, false information, poor after-sales service, and unsafe goods.
  c10ss22_marks: "Each standard mark covers a different kind of product: factory goods, farm produce, or precious metal. Which kind is this?"
