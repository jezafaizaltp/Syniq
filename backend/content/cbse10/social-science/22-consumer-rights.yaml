concepts:
- code: cbse10ss.consumer.rights
  title: Consumer rights and redressal
  notes: |
    Consumers are exploited through underweight and undermeasurement, poor quality, high prices, duplicate
    articles, adulteration, lack of safety, and false information. The consumer movement in India grew from the
    1960s; the Consumer Protection Act (COPRA) was passed in 1986 (updated in 2019). Rights: right to safety,
    right to be informed (MRP, ingredients, date of manufacture and expiry, which led to the RTI Act 2005), right
    to choose, right to be heard, right to seek redressal, and right to consumer education. Redressal is a
    three-tier system: district commission (claims up to ₹50 lakh), state commission (₹50 lakh to ₹2 crore),
    national commission (above ₹2 crore) under the 2019 Act and its 2021 rules. Standardisation marks: ISI and Agmark (from BIS
    and the government), Hallmark for jewellery. 24 December is National Consumers' Day; 15 March is World
    Consumer Rights Day. Consumers' duties: ask for bills, check marks, report complaints.
  explanations:
    text: 'Shopkeepers and companies sometimes cheat buyers with underweight goods, fake products or false claims. Indian law gives consumers rights: safety, information, choice, being heard, redressal and education. Complaints go to district, state or national consumer commissions depending on the amount, and marks like ISI and Agmark signal quality.'
    visual: 'Draw a packet with its label circled: MRP, date of manufacture, expiry date, ingredients, ISI or Agmark logo, and customer care number. Each one is the right to be informed in action.'
    step_by_step: 'Step 1: Identify how the consumer was cheated. Step 2: Name the right that was violated. Step 3: Choose the right commission by the claim amount. Step 4: Keep the bill as proof.'
    real_world: A family whose new pressure cooker burst could complain to the district consumer commission and claim compensation, using the bill and the ISI mark as evidence.
  picture:
    kind: compare
    columns:
    - title: Rights
      points:
      - Safety
      - Information
      - Choice
      - Being heard
      - Redressal
      - Consumer education
    - title: Where to complain (2019 Act)
      points:
      - 'District commission: up to ₹50 lakh'
      - 'State commission: ₹50 lakh–₹2 crore'
      - 'National commission: above ₹2 crore'
    alt: Six consumer rights (safety, information, choice, being heard, redressal and education) and the three-tier commissions by claim amount.
  activity:
    type: scale
    min: 0
    max: 400
    step: 5
    start: 400
    unit: ₹ lakh
    prompt: Which consumer commission hears the claim? Slide to the claim (₹ lakh).
    zones:
    - from: 0
      to: 50
      label: District commission
      says: Claims up to ₹50 lakh.
    - from: 50
      to: 200
      label: State commission
      says: ₹50 lakh to ₹2 crore.
    - from: 200
      to: 400
      label: National commission
      says: Above ₹2 crore.
    goals:
    - prompt: A claim the district commission hears
      zone: District commission
      mistakes:
      - when:
          v:
          - 60
          - 190
        say: Over ₹50 lakh goes to the state commission.
    - prompt: A claim of ₹1.5 crore
      value: 150
      mistakes:
      - when:
          v: 15
        say: 1 crore is 100 lakh. So how many lakh is 1.5 crore?
    - prompt: A claim the national commission hears
      zone: National commission
      mistakes:
      - when:
          v:
          - 60
          - 190
        say: That's still the state commission. National is above ₹2 crore (200 lakh).
  lesson:
    - teach: 'Consumers are often exploited: underweighing, adulterated food, false claims, high prices, poor-quality goods and bad after-sales service. Big companies have more power and money. So a consumer movement grew, and in 1986 India passed the Consumer Protection Act (COPRA), replaced by a new Act in 2019.'
      check:
        prompt: Adding cheap stuff to food to sell more is…
        options:
        - Adulteration
        - Redressal
        - Hallmarking
        answer: Adulteration
        why: It cheats and can harm health.
    - teach: 'Consumer rights: the right to safety (goods mustn''t be harmful), to be informed (details like price, ingredients, expiry date, MRP), to choose (no forced buying), to be heard and to seek redressal (compensation for harm), and to consumer education. The Right to Information Act (2005) helps citizens get information from government departments.'
      picture:
        kind: flow
        steps:
        - Safety
        - Information
        - Choice
        - Be heard
        - Redressal
        - Consumer education
        alt: 'The consumer''s rights: safety, information, choice, to be heard, redressal and consumer education.'
      check:
        prompt: An MRP printed on a packet relates to the right…
        options:
        - To be informed
        - To safety
        - To choose
        answer: To be informed
        why: It gives price information.
    - teach: 'Under the 2019 Act, consumer commissions settle complaints: district (claims up to ₹50 lakh), state (₹50 lakh to ₹2 crore) and national (above ₹2 crore). Consumers can file complaints themselves, without lawyers. Standard marks help: ISI, Agmark and Hallmark. National Consumers'' Day is 24 December.'
      check:
        prompt: A ₹1 crore claim goes to the…
        options:
        - State commission
        - District commission
        - National commission
        answer: State commission
        why: Between ₹50 lakh and ₹2 crore.
  items:
  - prompt: In which year was the Consumer Protection Act (COPRA) first passed in India?
    answer: '1986'
    check: '1986'
    difficulty: 1
    hints:
    - Mid-1980s.
    - Updated in 2019.
    solution: COPRA was enacted in 1986.
    mistakes: {"2019": "s10_copra", "1976": "s10_copra"}
  - prompt: Printing the expiry date on medicines is related to which right?
    options:
    - Right to be informed
    - Right to choose
    - Right to be heard
    - Right to redressal
    answer: Right to be informed
    difficulty: 1
    hints:
    - Information on the packet.
    - MRP and ingredients too.
    solution: Details on labels support the right to be informed.
    mistakes: {"Right to choose": "s10_informed"}
  - prompt: A claim of ₹10 lakh should be filed in which consumer commission (2019 Act)?
    options:
    - District commission
    - State commission
    - National commission
    - Supreme Court only
    answer: District commission
    difficulty: 2
    hints:
    - Up to ₹50 lakh goes to the district.
    - 10 lakh is less than 50 lakh.
    solution: Claims up to ₹50 lakh go to the district commission.
    mistakes:
      State commission: c10ss_commission_limits
  - prompt: Which mark certifies the quality of agricultural products?
    options:
    - Agmark
    - ISI
    - Hallmark
    - ISO
    answer: Agmark
    difficulty: 1
    hints:
    - '''Ag'' for agriculture.'
    - Honey, spices, ghee.
    solution: Agmark certifies agricultural products; ISI is for industrial goods; Hallmark for gold.
    mistakes: {"ISI": "s10_agmark", "Hallmark": "s10_agmark"}
  - prompt: National Consumers' Day is celebrated on 24 December. World Consumer Rights Day is on 15 March. How many days apart are these dates within the year, counting from 15 March to 24 December? (Non-leap year.)
    answer: '284'
    check: 16 + 30 + 31 + 30 + 31 + 31 + 30 + 31 + 30 + 24
    difficulty: 3
    hints:
    - Count remaining days of March, then full months.
    - 16 (Mar) + 30 + 31 + 30 + 31 + 31 + 30 + 31 + 30 + 24.
    solution: 'Step 1: March 16–31 = 16 days. Step 2: April–November = 30+31+30+31+31+30+31+30 = 244. Step 3: December 1–24 = 24. Step 4: 16 + 244 + 24 = 284 days.'
    mistakes: {"283": "s10_count_days", "285": "s10_count_days"}
  - prompt: A shopkeeper insists you buy a packet of tea with a toothpaste. Which right is violated?
    options:
    - Right to choose
    - Right to safety
    - Right to be informed
    - Right to education
    answer: Right to choose
    difficulty: 2
    hints:
    - You are forced to buy something extra.
    - Freedom of choice.
    solution: Forcing an extra purchase violates the right to choose.
    mistakes: {"Right to be informed": "s10_choose"}
  - prompt: A shopkeeper gives less sugar than the weight paid for. This is…
    options:
    - Underweighing
    - Redressal
    - Hallmarking
    - Consumer education
    answer: Underweighing
    difficulty: 1
    hints:
    - The scale cheats you.
    - You get less than you pay for.
    solution: Giving less than the paid weight is underweighing, a form of exploitation.
    mistakes:
      Redressal: c10ss22_exploit
  - prompt: A pressure cooker bursts because of a faulty safety valve. Which right was violated?
    options:
    - Right to safety
    - Right to choose
    - Right to be informed
    - Right to education
    answer: Right to safety
    difficulty: 1
    hints:
    - The product was dangerous.
    - It hurt the user.
    solution: 'Goods must not harm people: the right to safety.'
    mistakes:
      Right to choose: c10ss22_rights
  - prompt: A consumer gets compensation after complaining about a faulty product. This is the right to…
    options:
    - Seek redressal
    - Choose
    - Safety
    - Be informed
    answer: Seek redressal
    difficulty: 2
    hints:
    - It is about getting justice after being wronged.
    - Compensation or replacement.
    solution: Getting compensation for unfair trade is the right to seek redressal.
    mistakes:
      Choose: c10ss22_rights
  - prompt: Which mark is used for gold jewellery?
    options:
    - Hallmark
    - ISI
    - Agmark
    - ISO
    answer: Hallmark
    difficulty: 1
    hints:
    - Agmark is for farm produce.
    - ISI is for factory goods.
    solution: Hallmark certifies the purity of gold.
    mistakes:
      Agmark: c10ss22_marks
  - prompt: A claim of ₹3 crore should be filed with which commission?
    options:
    - National commission
    - District commission
    - State commission
    - Supreme Court only
    answer: National commission
    difficulty: 2
    hints:
    - District handles up to ₹50 lakh.
    - State handles up to ₹2 crore.
    solution: Claims above ₹2 crore go to the national commission.
    mistakes:
      State commission: c10ss22_limits
  - prompt: In which year was the Right to Information Act passed?
    answer: '2005'
    check: '2005'
    difficulty: 2
    hints:
    - Mid-2000s.
    - The same year as MGNREGA.
    solution: The RTI Act was passed in October 2005.
    mistakes:
      '1986': c10ss22_rti
      '2019': c10ss22_rti
  - prompt: Why do consumers need to be careful about advertisements?
    options:
    - Ads may give partial or false information
    - Ads are always correct
    - Ads are made by the government
    - Ads lower prices
    answer: Ads may give partial or false information
    difficulty: 1
    hints:
    - Sellers want you to buy.
    - They may hide some facts.
    solution: Advertisements can mislead, so consumers must check facts.
    mistakes:
      Ads are always correct: c10ss22_exploit
  - prompt: Do consumers need a lawyer to file a complaint in a consumer commission?
    options:
    - No, they can file it themselves
    - Yes, always
    - Only the government can file
    - Only companies can file
    answer: No, they can file it themselves
    difficulty: 2
    hints:
    - The system is meant to be simple.
    - Ordinary people should be able to use it.
    solution: Consumers can represent themselves; lawyers aren't required.
    mistakes:
      Yes, always: c10ss22_rights
  - prompt: Consumer groups that guide people and help them file complaints are called…
    options:
    - Consumer forums or consumer protection councils
    - Trade barriers
    - Self-help groups
    - Multinationals
    answer: Consumer forums or consumer protection councils
    difficulty: 2
    hints:
    - Voluntary organisations.
    - They work for buyers.
    solution: Consumer forums and protection councils guide consumers and spread awareness.
    mistakes:
      Self-help groups: s10_informed
