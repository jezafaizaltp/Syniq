# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 2.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 7
title: Forest and Wildlife Resources
tips:
  c10ss_endemic: "Endangered means close to dying out. Species found naturally only in one area have a different name."
  s10_cheetah: "The tiger, elephant and rhino still live in India. Which big cat disappeared?"
  s10_chipko: "'Chipko' means to hug or cling."
  s10_jfm: "'Joint' means two partners. Who are they?"
  s10_project_tiger: "Project Tiger began in the early 1970s."
  s10_reserved_forest: "Forests are classed by how strictly they are protected. Protected forests are guarded from damage, but one class gets even stronger protection."
  c10ss7_iucn: 'IUCN groups species by risk: normal, endangered, vulnerable, rare, endemic, extinct. Which group fits this description?'
  c10ss7_causes: The biggest threats to forests were railways, farming expansion, mining, big dams and commercial forestry, along with grazing and fuel-wood collection.
  c10ss7_community: "Local people have protected forests and animals themselves: one desert community's faith forbids harming blackbuck and trees, and hill villagers hugged trees. Which community lives in Rajasthan's Thar?"
  c10ss7_forest_class: "Forests are ranked by how strictly they are guarded: the strictest class, a middle class, and the rest. Which rank fits this description?"
  c10ss7_sacred: Many communities keep sacred groves where trees are never cut, and worship trees such as the peepal and banyan.
concepts:
- code: cbse10ss.forest.wildlife
  title: Forests, wildlife and conservation
  notes: |
    India is one of the world's richest countries in biological diversity. Many species are threatened. IUCN
    categories: normal, endangered (blackbuck, crocodile, Indian wild ass, lion-tailed macaque), vulnerable (blue
    sheep, Asiatic elephant, Gangetic dolphin), rare, endemic (found only in one area: Andaman teal, Nicobar
    pigeon, mithun in Arunachal), extinct (Asiatic cheetah, pink-head duck). Causes of loss: expansion of
    agriculture, big projects, mining, shifting cultivation, grazing, poaching. The Indian Wildlife (Protection)
    Act was passed in 1972. Project Tiger began in 1973. Forests are classed as reserved (over half of forest
    land, most valuable for conservation), protected (about one third) and unclassed. Community conservation:
    Sariska villagers resisting mining, Bhairodev Dakav Sonchuri in Alwar, the Chipko movement in the Himalayas,
    Beej Bachao Andolan, Joint Forest Management (Odisha, 1988), sacred groves.
  explanations:
    text: India's forests hold an enormous variety of plants and animals, but farming, mining, dams and hunting have pushed many towards extinction. Laws like the Wildlife Protection Act and Project Tiger help, and so do communities who protect their own forests, like the Chipko women who hugged trees to stop them being cut.
    visual: 'Draw a ladder of danger: normal at the bottom, then rare, vulnerable, endangered, and extinct at the top, with an animal on each rung.'
    step_by_step: 'Step 1: Identify the threat (habitat loss, poaching). Step 2: Identify the category (endangered, vulnerable, endemic, extinct). Step 3: Name the response: law (1972 Act), project (Tiger, 1973), or community action (Chipko, JFM).'
    real_world: Villages around sacred groves in Kerala and Rajasthan have kept patches of forest untouched for generations because of religious beliefs.
  picture:
    kind: compare
    columns:
    - title: Government
      points:
      - Wildlife (Protection) Act, 1972
      - Project Tiger, 1973
      - Reserved and protected forests
      - National parks and sanctuaries
    - title: Communities
      points:
      - Chipko movement in the Himalayas
      - Sariska villagers fight mining
      - Joint Forest Management, 1988
      - Sacred groves
    alt: Conservation by government (laws, Project Tiger, reserved forests) and by communities (Chipko, Sariska villagers, Joint Forest Management, sacred groves).
  activity:
    type: sort
    prompt: Which IUCN category?
    bins:
    - Endangered
    - Vulnerable
    - Endemic
    - Extinct
    items:
    - label: Blackbuck
      bin: Endangered
      clue: In danger of dying out.
      why: Endangered.
    - label: Lion-tailed macaque
      bin: Endangered
      clue: In danger.
      why: Endangered.
    - label: Asiatic elephant
      bin: Vulnerable
      clue: Could become endangered.
      why: Vulnerable.
    - label: Gangetic dolphin
      bin: Vulnerable
      clue: Could become endangered.
      why: Vulnerable.
    - label: Andaman teal
      bin: Endemic
      clue: Found only in one area.
      why: Endemic.
    - label: Mithun in Arunachal Pradesh
      bin: Endemic
      clue: Found only in one area.
      why: Endemic.
    - label: Asiatic cheetah
      bin: Extinct
      clue: No longer found in India.
      why: Extinct.
  lesson:
    - teach: 'India is one of the world''s richest countries in biological diversity, with about 8% of the world''s species. Forests give timber, food, medicines, clean air and homes for wildlife. Species are grouped by risk (IUCN): normal, endangered (like the blackbuck, crocodile, Indian wild ass), vulnerable (like the blue sheep, Asiatic elephant), rare, endemic (found only in one area, like the Andaman teal) and extinct (like the Asiatic cheetah).'
      picture:
        kind: compare
        columns:
        - title: Endangered
          points:
          - In danger of extinction
          - Blackbuck, crocodile
        - title: Endemic
          points:
          - Found only in one area
          - Andaman teal, Nicobar pigeon
        - title: Extinct
          points:
          - Not found any more
          - Asiatic cheetah, pink-head duck
        alt: Endangered species are in danger of dying out (blackbuck, crocodile); endemic species live only in one area (Andaman teal, Nicobar pigeon); extinct species are no longer found (Asiatic cheetah, pink-head duck).
      check:
        prompt: Species found only in one region are…
        options:
        - Endemic
        - Extinct
        - Normal
        answer: Endemic
        why: They live nowhere else.
    - teach: Forests were lost to railways, farming, mining, big dams, commercial plantations, grazing and fuel-wood collection. Loss of forests harms tribal communities and women who collect food, fuel and fodder. The Wildlife Protection Act (1972) and Project Tiger (1973) protect wildlife through sanctuaries and national parks.
      check:
        prompt: Project Tiger began in…
        options:
        - '1973'
        - '1947'
        - '1988'
        answer: '1973'
        why: To save falling tiger numbers.
    - teach: 'Forests are classed as reserved (over half, most valuable for conservation), protected (about a third) and unclassed. Communities help too: the Chipko movement hugged trees to stop felling; Bishnois of Rajasthan protect blackbuck and chinkara; villagers of Sariska fought mining. Joint Forest Management (Odisha, 1988) brings villagers and the forest department together.'
      check:
        prompt: Which state started Joint Forest Management?
        options:
        - Odisha
        - Kerala
        - Punjab
        answer: Odisha
        why: In 1988.
  items:
  - prompt: 'Species found only in a particular area are called:'
    options:
    - Endemic
    - Endangered
    - Extinct
    - Vulnerable
    answer: Endemic
    difficulty: 1
    hints:
    - Like the Andaman teal.
    - Not found anywhere else.
    solution: Endemic species are found only in one region.
    mistakes:
      Endangered: c10ss_endemic
  - prompt: In which year was Project Tiger launched?
    answer: '1973'
    check: '1973'
    difficulty: 1
    hints:
    - One year after the Wildlife Act.
    - Early 1970s.
    solution: Project Tiger began in 1973.
    mistakes: {"1947": "s10_project_tiger", "1993": "s10_project_tiger"}
  - prompt: Which animal is listed as extinct in India?
    options:
    - Asiatic cheetah
    - Bengal tiger
    - Asiatic elephant
    - One-horned rhinoceros
    answer: Asiatic cheetah
    difficulty: 1
    hints:
    - Declared extinct in India in 1952.
    - Cheetahs from Africa were reintroduced recently.
    solution: The Asiatic cheetah was declared extinct in India in 1952.
    mistakes: {"One-horned rhinoceros": "s10_cheetah"}
  - prompt: 'The Chipko movement is known for:'
    options:
    - Villagers hugging trees to stop them being felled
    - Building big dams
    - Starting tiger reserves
    - Hunting wild animals
    answer: Villagers hugging trees to stop them being felled
    difficulty: 1
    hints:
    - In the Himalayas.
    - '''Chipko'' means to stick.'
    solution: Chipko villagers clung to trees to resist deforestation.
    mistakes: {"Starting tiger reserves": "s10_chipko"}
  - prompt: Which forests are regarded as the most valuable for conserving forest and wildlife?
    options:
    - Reserved forests
    - Unclassed forests
    - Protected forests
    - Private plantations
    answer: Reserved forests
    difficulty: 2
    hints:
    - More than half of forest land.
    - Strictest protection.
    solution: Reserved forests are considered most valuable for conservation.
    mistakes: {"Protected forests": "s10_reserved_forest"}
  - prompt: 'Joint Forest Management, started in Odisha in 1988, involves:'
    options:
    - Local communities and the forest department managing degraded forests together
    - Selling forests to companies
    - Banning people from forests
    - Planting only teak
    answer: Local communities and the forest department managing degraded forests together
    difficulty: 2
    hints:
    - Villagers share the benefits.
    - Cooperation.
    solution: JFM lets village institutions protect degraded forests and share in forest produce.
    mistakes: {"Banning people from forests": "s10_jfm"}
  - prompt: Which of these is an endangered species in India?
    options:
    - Blackbuck
    - Cattle
    - Pigeon
    - Sal tree
    answer: Blackbuck
    difficulty: 2
    hints:
    - Endangered means in danger of dying out.
    - Bishnois protect this deer.
    solution: The blackbuck is listed as endangered.
    mistakes:
      Cattle: c10ss7_iucn
  - prompt: Which of these is an extinct species?
    options:
    - Asiatic cheetah
    - Bengal tiger
    - Asiatic elephant
    - Blackbuck
    answer: Asiatic cheetah
    difficulty: 1
    hints:
    - It was the world's fastest land animal in India.
    - Declared extinct in India in 1952.
    solution: The Asiatic cheetah became extinct in India.
    mistakes:
      Bengal tiger: s10_cheetah
  - prompt: In which year was the Indian Wildlife (Protection) Act passed?
    answer: '1972'
    check: '1972'
    difficulty: 2
    hints:
    - A year before Project Tiger.
    - Early 1970s.
    solution: The Wildlife (Protection) Act was passed in 1972.
    mistakes:
      '1973': s10_project_tiger
      '1988': s10_jfm
  - prompt: Which is a major cause of forest loss in India?
    options:
    - Expansion of farming and big dams
    - Planting trees
    - Sacred groves
    - Joint Forest Management
    answer: Expansion of farming and big dams
    difficulty: 1
    hints:
    - Forests are cleared to make room.
    - Which options destroy rather than protect?
    solution: Farming expansion, dams, mining and railways cleared vast forests.
    mistakes:
      Sacred groves: c10ss7_causes
  - prompt: In Rajasthan, which community is known for protecting blackbuck, chinkara and nilgai?
    options:
    - Bishnois
    - Gonds
    - Santhals
    - Mundas
    answer: Bishnois
    difficulty: 2
    hints:
    - Their faith forbids harming animals and trees.
    - They live in the Thar region.
    solution: The Bishnoi community of Rajasthan protects these animals.
    mistakes:
      Gonds: c10ss7_community
  - prompt: Which forests have some protection but less than reserved forests?
    options:
    - Protected forests
    - Unclassed forests
    - Sacred groves only
    - Plantations
    answer: Protected forests
    difficulty: 2
    hints:
    - 'Three classes: reserved, protected, unclassed.'
    - The middle one.
    solution: Protected forests are guarded from further depletion but are less strictly protected than reserved ones.
    mistakes:
      Unclassed forests: c10ss7_forest_class
  - prompt: What are sacred groves?
    options:
    - Patches of forest left untouched for religious reasons
    - Tea gardens
    - National parks
    - Timber farms
    answer: Patches of forest left untouched for religious reasons
    difficulty: 2
    hints:
    - Many communities worship nature.
    - No tree is cut there.
    solution: Sacred groves are forests of gods and spirits, kept untouched.
    mistakes:
      Timber farms: c10ss7_sacred
  - prompt: Why does the loss of forests hurt women especially in rural areas?
    options:
    - They walk further for fuel, fodder and water
    - They lose city jobs
    - They stop going to school only
    - It doesn't affect them
    answer: They walk further for fuel, fodder and water
    difficulty: 2
    hints:
    - Who usually collects firewood?
    - Distances grow as forests shrink.
    solution: Women carry the burden of collecting essentials, so longer walks mean more hardship.
    mistakes:
      It doesn't affect them: c10ss7_causes
  - prompt: About what percentage of the world's species are found in India?
    answer: '8'
    check: '8'
    difficulty: 3
    hints:
    - India is one of the megadiversity countries.
    - A single-digit number.
    solution: India has about 8% of the world's recorded species.
    mistakes:
      '50': c10ss7_iucn
