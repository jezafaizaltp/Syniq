# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 3.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 15
title: Gender, Religion and Caste
tips:
  s10_caste_mix: "Every constituency has voters from many castes. Can one caste alone win?"
  s10_communalism: "Communalism sets one religion above others in politics."
  s10_division_labour: "The question is about how work is split between men and women at home."
  s10_equal_pay: "Which Act's name is about pay?"
  s10_feminism: "Feminism is about equality, not rule by one group."
  s10_franchise: "Universal adult franchise gave everyone a vote. What did that give communities left out before?"
  s10_lok_sabha_women: "Women's share in the Lok Sabha is still low: well below a third, but above a tenth."
  s10_one_third_pct: "One-third is about what percent?"
  s10_phule: "Curzon divided Bengal and Bismarck unified Germany. Who was an Indian reformer?"
  s10_religion_politics: "Raising needs as citizens is fair. Claiming superiority is not."
  s10_secular: "A secular state has no official religion. How does it treat all religions?"
  s10_sex_ratio: "A preference for sons lowers the number of girls born. Which way does the ratio move?"
  c10ss15_public_private: Women in India still do most housework without pay, and take a smaller share of paid public work and of political posts.
  c10ss15_literacy: Gaps between men and women show in literacy, pay, sex ratio and seats in legislatures. Which gap is the question about?
  c10ss15_forms_communal: Communalism shows in everyday beliefs, in political dominance by one community, in mobilising voters on religion, and, worst, in violence and riots.
  c10ss15_caste_change: Caste has weakened with urbanisation, education and jobs, but it has not disappeared; it still affects marriage, politics and wealth.
  c10ss15_secular_features: India's constitution gives no religion official status, gives freedom to follow any religion, bans discrimination by religion, and lets the state step in for equality.

concepts:
- code: cbse10ss.social.gender
  title: Gender and politics
  notes: |
    The sexual division of labour assigns housework and child care to women; their work is often unpaid and
    unrecognised. Feminist movements demanded voting rights and equal opportunities. In India, women's literacy
    is lower than men's (about 65% vs 82%); women are paid less (Equal Remuneration Act, 1976 says equal pay for
    equal work); the child sex ratio has fallen in many states. Women's representation in the Lok Sabha crossed
    14% for the first time in 2019 (and stayed below 15%); in state assemblies it is below 5%. One-third of
    seats in panchayats and municipalities are reserved for women (more than 10 lakh elected women). A Women's
    Reservation Act (2023) provides one-third of seats in the Lok Sabha and state assemblies.
  explanations:
    text: 'Gender divisions are social, not natural: housework is pushed onto women and their work is undervalued. Women in India still lag in literacy, pay and political representation. Reserved seats in local bodies brought lakhs of women into politics, and a law now reserves seats in parliament and assemblies too.'
    visual: 'Draw two columns of a day: a woman''s hours of paid and unpaid work, a man''s hours of paid work and leisure. The woman''s day is longer but less of it is paid.'
    step_by_step: 'Step 1: Spot the division of labour. Step 2: Find the gap (literacy, pay, sex ratio, representation). Step 3: Name the remedy: laws, reservations, movements.'
    real_world: Panchayat reservations mean that one in three village sarpanches in many states are women, many of them the first women leaders in their villages.
  picture:
    kind: bars
    bars:
    - label: Male literacy
      value: 82
    - label: Female literacy
      value: 65
    - label: Women in Lok Sabha (2019)
      value: 14
    - label: Women in local bodies
      value: 33
    unit: '%'
    alt: 'Bar chart: male literacy about 82 percent, female literacy about 65 percent, women about 14 percent of the Lok Sabha in 2019, and at least 33 percent of local body seats reserved for women.'
  activity:
    type: scale
    min: 0
    max: 50
    step: 1
    start: 50
    unit: '%'
    prompt: Women's share of seats. Slide to the right value.
    zones:
    - from: 0
      to: 5
      label: State assemblies
      says: Women hold below 5% of seats in state assemblies.
    - from: 14
      to: 15
      label: Lok Sabha 2019
      says: Lok Sabha crossed 14% for the first time in 2019.
    - from: 33
      to: 34
      label: Reserved share
      says: At least one-third of seats are reserved for women.
    goals:
    - prompt: Women in the Lok Sabha after 2019
      zone: Lok Sabha 2019
      mistakes:
      - when:
          v:
          - 33
          - 34
        say: That's the reserved share in panchayats. Lok Sabha had only about 14%.
      - when:
          v:
          - 40
          - 50
        say: 'Far too high: women held only about 14% of Lok Sabha seats.'
    - prompt: Seats reserved for women in panchayats
      zone: Reserved share
      mistakes:
      - when:
          v:
          - 14
          - 15
        say: That's the Lok Sabha share in 2019. Panchayats reserve one-third.
    - prompt: Women in state assemblies
      zone: State assemblies
      mistakes:
      - when:
          v:
          - 14
          - 15
        say: 'That''s the Lok Sabha. State assemblies are even lower: below 5%.'
  lesson:
    - teach: Gender divisions are often seen as natural, but they come from social expectations. The sexual division of labour means women are expected to do housework and childcare, and men work outside. Women's work at home is unpaid and often not valued. Political mobilisation by women's movements (feminist movements) has asked for equal rights.
      check:
        prompt: The sexual division of labour means…
        options:
        - Housework is left to women and outside work to men
        - Equal sharing of all work
        - Only men do housework
        answer: Housework is left to women and outside work to men
        why: It is a social expectation, not biology.
    - teach: 'In India women still face gaps: lower literacy (about 65% for women vs 82% for men in 2011), lower pay for the same work despite the Equal Remuneration Act (1976), a low child sex ratio in some states due to sex-selective abortion, and violence at home and outside. Women''s share in the Lok Sabha crossed 14% only in 2019.'
      picture:
        kind: bars
        unit: '% literate (Census 2011)'
        bars:
        - label: women
          value: 65
        - label: men
          value: 82
        alt: 'Literacy in India in 2011: about 65% of women and 82% of men.'
      check:
        prompt: Which law promises equal pay for equal work?
        options:
        - Equal Remuneration Act
        - Right to Information Act
        - Panchayati Raj Act
        answer: Equal Remuneration Act
        why: Passed in 1976.
    - teach: One-third of seats in panchayats and municipalities are reserved for women, so over 10 lakh women are elected to local bodies. The Women's Reservation Act (2023) will reserve one-third of seats in the Lok Sabha and state assemblies once it comes into force.
      check:
        prompt: What share of local body seats are reserved for women?
        options:
        - One-third
        - One-quarter
        - Half
        answer: One-third
        why: Set by the 1992 amendment.
  items:
  - prompt: What is the 'sexual division of labour'?
    options:
    - A system where housework and child care are seen as women's work
    - Equal sharing of all work
    - A law about factory work
    - Men and women having the same jobs
    answer: A system where housework and child care are seen as women's work
    difficulty: 1
    hints:
    - It is a social idea, not biology.
    - Women do unpaid work at home.
    solution: It is the system in which work inside the home is done by women and outside work by men.
    mistakes: {"Equal sharing of all work": "s10_division_labour"}
  - prompt: Which Act provides that equal wages should be paid for equal work?
    options:
    - Equal Remuneration Act, 1976
    - Right to Information Act
    - Consumer Protection Act
    - Dowry Prohibition Act
    answer: Equal Remuneration Act, 1976
    difficulty: 2
    hints:
    - Remuneration means pay.
    - Passed in the 1970s.
    solution: The Equal Remuneration Act, 1976 says equal wages for equal work.
    mistakes: {"Dowry Prohibition Act": "s10_equal_pay"}
  - prompt: At least what percentage of seats in panchayats and municipalities is reserved for women? Round to the nearest whole number.
    answer: '33'
    check: round(100/3)
    difficulty: 1
    hints:
    - One-third.
    - 100 ÷ 3.
    solution: One-third is about 33%.
    mistakes: {"50": "s10_one_third_pct", "3": "s10_one_third_pct"}
  - prompt: Women's share of seats in the Lok Sabha first crossed which level in 2019?
    options:
    - 14%
    - 50%
    - 33%
    - 2%
    answer: 14%
    difficulty: 2
    hints:
    - It is still low.
    - Below 15%.
    solution: In 2019 women's share crossed 14% for the first time.
    mistakes: {"33%": "s10_lok_sabha_women", "50%": "s10_lok_sabha_women"}
  - prompt: Why is the child sex ratio in some parts of India a worry?
    options:
    - It is falling because of a preference for sons
    - It is rising too fast
    - It shows more girls than boys
    - It has no effect
    answer: It is falling because of a preference for sons
    difficulty: 2
    hints:
    - Girls per 1000 boys.
    - Sex-selective abortion.
    solution: A falling child sex ratio reflects son preference and sex-selective practices.
    mistakes: {"It shows more girls than boys": "s10_sex_ratio"}
  - prompt: What does a feminist movement aim for?
    options:
    - Equality of rights and opportunities for women and men
    - Rule by women only
    - Separate schools by law
    - Lower wages for men
    answer: Equality of rights and opportunities for women and men
    difficulty: 1
    hints:
    - Equality.
    - Voting rights, education, work.
    solution: Feminist movements seek equal rights and opportunities for women.
    mistakes: {"Rule by women only": "s10_feminism"}
  - prompt: Women's literacy rate in India in 2011 was about…
    answer: '65'
    check: '65'
    difficulty: 3
    hints:
    - Men's was about 82%.
    - About two-thirds.
    solution: About 65% of women were literate, against 82% of men.
    mistakes:
      '82': c10ss15_literacy
  - prompt: In which year was the Equal Remuneration Act passed?
    answer: '1976'
    check: '1976'
    difficulty: 3
    hints:
    - In the mid-1970s.
    - During the International Women's Decade.
    solution: The Equal Remuneration Act was passed in 1976.
    mistakes:
      '1992': s10_one_third_pct
  - prompt: What does a 'patriarchal' society mean?
    options:
    - A society where men are given more power and value than women
    - A society ruled by children
    - A society with no families
    - A society where women rule
    answer: A society where men are given more power and value than women
    difficulty: 2
    hints:
    - '''Pater'' means father.'
    - Who holds power?
    solution: Patriarchy is a system that values men more and gives them power over women.
    mistakes:
      A society where women rule: s10_feminism
  - prompt: Why is women's work at home not seen as equal to men's work?
    options:
    - It is unpaid and often not valued
    - It takes very little time
    - It is done by machines
    - It is not real work
    answer: It is unpaid and often not valued
    difficulty: 2
    hints:
    - Women work more hours on average.
    - But do they get paid at home?
    solution: Housework is unpaid, so it is undervalued even though it takes much time.
    mistakes:
      It takes very little time: c10ss15_public_private
  - prompt: In some states, why is the child sex ratio low?
    options:
    - Preference for sons leads to sex-selective abortion
    - More girls are born everywhere
    - Boys are healthier
    - Census errors only
    answer: Preference for sons leads to sex-selective abortion
    difficulty: 2
    hints:
    - Fewer girls per 1000 boys.
    - It is a social cause.
    solution: Son preference leads to girl foetuses being aborted, lowering the ratio.
    mistakes:
      More girls are born everywhere: s10_sex_ratio
  - prompt: What is the main aim of the Women's Reservation Act of 2023?
    options:
    - To reserve one-third of Lok Sabha and assembly seats for women
    - To give women the vote
    - To ban women from panchayats
    - To raise the voting age
    answer: To reserve one-third of Lok Sabha and assembly seats for women
    difficulty: 2
    hints:
    - Local bodies already have reservation.
    - This is for higher legislatures.
    solution: It reserves a third of seats in the Lok Sabha and state assemblies for women.
    mistakes:
      To give women the vote: c10ss15_literacy
  - prompt: Roughly how many women are elected to rural and urban local bodies in India?
    options:
    - Over 10 lakh
    - About 100
    - About 5000
    - None
    answer: Over 10 lakh
    difficulty: 3
    hints:
    - One-third of seats are reserved.
    - There are lakhs of local seats.
    solution: Over 10 lakh women are elected representatives in local bodies.
    mistakes:
      About 100: s10_one_third_pct
  - prompt: Which is an example of a feminist demand?
    options:
    - Equal pay and equal rights for women
    - Rule by women only
    - No education for girls
    - Men doing all work
    answer: Equal pay and equal rights for women
    difficulty: 1
    hints:
    - Feminism is about equality.
    - Not one group over another.
    solution: Feminist movements seek equal rights and opportunities.
    mistakes:
      Rule by women only: s10_feminism
  - prompt: Why are women's issues more visible in politics today?
    options:
    - Women's movements organised and raised these issues
    - Women stopped voting
    - There are no women leaders
    - Laws were removed
    answer: Women's movements organised and raised these issues
    difficulty: 2
    hints:
    - Political mobilisation.
    - Agitation for rights.
    solution: Organised women's movements brought issues like voting rights and safety into politics.
    mistakes:
      Women stopped voting: c10ss15_public_private
- code: cbse10ss.social.religion
  title: Religion, communalism and caste in politics
  after:
  - cbse10ss.social.gender
  notes: |
    Religion in politics is not wrong in itself (Gandhiji said politics must be guided by ethics from
    religion), but communalism is: treating one religion as superior, demanding that the state favour it, or
    mobilising voters on religious lines; its extreme form is communal violence. India is a secular state:
    no official religion; freedom to practise any religion; equal treatment; the state can intervene against
    discrimination (e.g., untouchability). Caste: hereditary occupational groups; Jotiba Phule, Gandhiji, Dr
    Ambedkar and Periyar fought caste discrimination; urbanisation, literacy and mobility have weakened it, but
    it persists in marriage and economic status. In politics: parties consider caste when choosing candidates;
    universal adult franchise gave new voice to backward castes. No parliamentary constituency has a single
    caste majority, and voters often vote on other grounds. Politics also changes caste identity (new caste
    coalitions such as 'backward' and 'forward').
  explanations:
    text: Religion and caste are part of social life, and democracy lets people raise their concerns as members of groups. The danger is communalism, when one religion is made superior or the state is asked to favour it, and casteism, when caste alone decides political choices. India's Constitution keeps the state secular and bans untouchability.
    visual: 'Draw three rings: personal faith (fine), religious groups raising their concerns (fine), and communal politics making one religion superior and others enemies (dangerous). Do the same for caste.'
    step_by_step: 'Step 1: Is religion or caste being used to express a group''s needs? That''s legitimate. Step 2: Is it used to claim superiority or hatred? That''s communalism or casteism. Step 3: Link to constitutional protections: secularism, ban on untouchability.'
    real_world: During elections parties often field candidates from a constituency's larger communities, but voters also judge them on work and character, which is why caste arithmetic alone doesn't decide results.
  picture:
    kind: compare
    columns:
    - title: Secular state (India)
      points:
      - No official religion
      - Freedom to practise any religion
      - No discrimination by religion
      - Can act against untouchability
    - title: Communalism
      points:
      - One religion seen as superior
      - State asked to favour one religion
      - Votes sought on religious lines
      - Can lead to violence
    alt: India as a secular state, with no official religion and equal freedom, compared with communalism, which treats one religion as superior and can lead to violence.
  activity:
    type: sort
    prompt: Secular or communal?
    bins:
    - Secular
    - Communal
    items:
    - label: No official religion for the state
      bin: Secular
      clue: Does the state favour any faith?
      why: Secular.
    - label: Asking votes only by appealing to one religion
      bin: Communal
      clue: Mobilising on religious lines.
      why: Communal.
    - label: Freedom to practise any religion
      bin: Secular
      clue: Rights for all.
      why: Secular.
    - label: Saying one religion is superior
      bin: Communal
      clue: Ranking faiths.
      why: Communal.
    - label: State bans untouchability
      bin: Secular
      clue: Acts against discrimination.
      why: The secular state can intervene.
    - label: Demanding the state favour one religion
      bin: Communal
      clue: Unequal treatment.
      why: Communal.
  lesson:
    - teach: 'Religion can play a fair role in politics: people can express needs as members of a religious community, and government can act to protect minorities. But communalism treats one religion as superior, sees followers of one religion as one community with the same interests, and uses this for political dominance, sometimes with violence.'
      check:
        prompt: Communalism means…
        options:
        - Making religion the basis of politics, with one religion above others
        - Freedom of worship
        - Respect for all faiths
        answer: Making religion the basis of politics, with one religion above others
        why: It divides people by faith.
    - teach: 'India''s constitution makes it a secular state: no official religion, freedom to profess any religion, no discrimination on grounds of religion, and the state may step in to ensure equality (for example, to ban untouchability). Secularism is a foundation of the Indian constitution.'
      picture:
        kind: compare
        columns:
        - title: Secular state
          points:
          - No official religion
          - Freedom of religion
          - No discrimination
        - title: Communalism
          points:
          - One religion above others
          - Votes by religion
          - Can lead to riots
        alt: A secular state has no official religion, gives freedom of religion and bans discrimination; communalism puts one religion above others, seeks votes by religion and can lead to riots.
      check:
        prompt: Does India have an official religion?
        options:
        - 'No'
        - Yes, Hinduism
        - Yes, Buddhism
        answer: 'No'
        why: India is secular.
    - teach: 'Caste divisions are special to India. Reformers like Jotiba Phule, Gandhiji, B.R. Ambedkar and Periyar fought caste inequality. Urbanisation, education and jobs have weakened it, and the constitution bans caste discrimination, but caste still affects politics: parties choose candidates by caste, and voters may be mobilised on caste. Yet no constituency has a single-caste majority, so parties must appeal widely.'
      check:
        prompt: Who among these fought against caste discrimination?
        options:
        - B.R. Ambedkar
        - Lord Curzon
        - Otto von Bismarck
        answer: B.R. Ambedkar
        why: He led the struggle for Dalits.
  items:
  - prompt: What makes India a secular state?
    options:
    - There is no official religion and the state treats all religions equally
    - Everyone must follow one religion
    - Religion is banned
    - Only the majority religion is protected
    answer: There is no official religion and the state treats all religions equally
    difficulty: 1
    hints:
    - Unlike Sri Lanka's Buddhism.
    - Freedom of religion.
    solution: The Indian Constitution gives no special status to any religion and guarantees freedom of religion.
    mistakes: {"Religion is banned": "s10_secular"}
  - prompt: 'Communalism is when:'
    options:
    - Beliefs of one religion are presented as superior and the state is pushed to favour it
    - People pray at home
    - Religious groups ask for equal rights
    - People celebrate festivals together
    answer: Beliefs of one religion are presented as superior and the state is pushed to favour it
    difficulty: 2
    hints:
    - Exclusive, hostile view.
    - Using religion against others.
    solution: Communalism sees religion as the main basis of community and treats other communities as rivals.
    mistakes: {"Religious groups ask for equal rights": "s10_communalism"}
  - prompt: Who among these fought against caste discrimination?
    options:
    - Jotiba Phule
    - Lord Curzon
    - Otto von Bismarck
    - Henry Ford
    answer: Jotiba Phule
    difficulty: 1
    hints:
    - Wrote Gulamgiri.
    - Maharashtra.
    solution: Jotiba Phule worked to end caste discrimination, as did Gandhiji, Ambedkar and Periyar.
    mistakes: {"Lord Curzon": "s10_phule"}
  - prompt: Why can't one caste alone usually decide an Indian election?
    options:
    - No parliamentary constituency has a clear majority of one caste
    - Caste is not allowed in elections
    - Only one caste votes
    - The Election Commission chooses winners
    answer: No parliamentary constituency has a clear majority of one caste
    difficulty: 2
    hints:
    - Constituencies are mixed.
    - Voters also judge performance.
    solution: Constituencies have many castes, so candidates need support from several groups.
    mistakes: {"Caste is not allowed in elections": "s10_caste_mix"}
  - prompt: How has universal adult franchise affected caste in politics?
    options:
    - It gave a new voice to communities that were earlier excluded
    - It strengthened untouchability
    - It allowed only upper castes to vote
    - It had no effect
    answer: It gave a new voice to communities that were earlier excluded
    difficulty: 2
    hints:
    - One person, one vote.
    - Backward castes became powerful voters.
    solution: Every adult's vote gave earlier excluded groups political power and a voice.
    mistakes: {"It had no effect": "s10_franchise"}
  - prompt: Which is a legitimate way for religion to be part of politics?
    options:
    - Religious groups raising concerns about their needs as citizens
    - Saying one religion is superior
    - Attacking other religious groups
    - Making one religion the state religion
    answer: Religious groups raising concerns about their needs as citizens
    difficulty: 2
    hints:
    - Expressing needs is democratic.
    - Domination is not.
    solution: People can raise their concerns as members of religious communities; communalism begins when one religion seeks domination.
    mistakes: {"Making one religion the state religion": "s10_religion_politics"}
  - prompt: Which is an example of communal politics?
    options:
    - Asking for votes only from one religion by saying others are enemies
    - Asking for better schools for all
    - Protecting minorities' rights
    - Celebrating many festivals together
    answer: Asking for votes only from one religion by saying others are enemies
    difficulty: 2
    hints:
    - It sets one religion against another.
    - It uses religion to win power.
    solution: Mobilising voters on religious lines against others is communal politics.
    mistakes:
      Protecting minorities' rights: s10_communalism
  - prompt: Which is the most extreme form of communalism?
    options:
    - Communal violence, riots and massacres
    - Religious festivals
    - Prayer in temples
    - Visiting a mosque
    answer: Communal violence, riots and massacres
    difficulty: 2
    hints:
    - Communalism can take many forms.
    - The ugliest is bloodshed.
    solution: Communal violence, riots and massacres are the worst form.
    mistakes:
      Religious festivals: c10ss15_forms_communal
  - prompt: Which is NOT a feature of India's secular constitution?
    options:
    - Hinduism is the official religion
    - Freedom to profess any religion
    - No discrimination on grounds of religion
    - The state can intervene to ensure equality
    answer: Hinduism is the official religion
    difficulty: 2
    hints:
    - Three options are real features.
    - Does India have an official religion?
    solution: India has no official religion, so that option is not a feature.
    mistakes:
      Freedom to profess any religion: c10ss15_secular_features
  - prompt: What has weakened caste divisions in modern India?
    options:
    - Urbanisation, education and new jobs
    - More caste rules
    - Fewer schools
    - Moving to villages
    answer: Urbanisation, education and new jobs
    difficulty: 2
    hints:
    - People from different castes meet in cities.
    - Jobs depend on skills, not birth.
    solution: City life, literacy and occupational mobility have weakened caste.
    mistakes:
      More caste rules: c10ss15_caste_change
  - prompt: Why do parties consider caste when choosing candidates?
    options:
    - To win the support of voters in a constituency
    - Because the law says so
    - Because caste has no effect
    - To stop people voting
    answer: To win the support of voters in a constituency
    difficulty: 2
    hints:
    - They study the social mix of the area.
    - They want votes.
    solution: Parties pick candidates to gather support from major groups.
    mistakes:
      Because the law says so: s10_caste_mix
  - prompt: Is caste the only thing that decides elections in India?
    options:
    - No, voters also judge performance, issues and party loyalty
    - Yes, always
    - Only in cities
    - Only in Kerala
    answer: No, voters also judge performance, issues and party loyalty
    difficulty: 2
    hints:
    - No constituency has one caste in a majority.
    - Governments are often voted out.
    solution: Voters weigh many factors, and parties need cross-caste support.
    mistakes:
      Yes, always: s10_caste_mix
  - prompt: Who wrote powerfully against caste and founded the self-respect movement in Tamil Nadu?
    options:
    - E.V. Ramaswami Naicker (Periyar)
    - Jawaharlal Nehru
    - Lord Curzon
    - Rabindranath Tagore
    answer: E.V. Ramaswami Naicker (Periyar)
    difficulty: 3
    hints:
    - A Tamil social reformer.
    - Known as Periyar.
    solution: Periyar led the self-respect movement against caste.
    mistakes:
      Lord Curzon: s10_phule
  - prompt: Why does the state sometimes interfere in religious matters in India?
    options:
    - To ensure equality, for example by banning untouchability
    - To make one religion official
    - To close all temples
    - To stop festivals
    answer: To ensure equality, for example by banning untouchability
    difficulty: 3
    hints:
    - Secular does not mean the state ignores everything.
    - Rights must be protected.
    solution: The constitution allows state intervention to ensure equality within religious communities.
    mistakes:
      To make one religion official: s10_secular
  - prompt: What did universal adult franchise do to caste-based politics?
    options:
    - It gave every caste equal votes, so parties had to seek their support
    - It removed caste completely
    - It gave votes only to upper castes
    - It stopped elections
    answer: It gave every caste equal votes, so parties had to seek their support
    difficulty: 2
    hints:
    - One person, one vote.
    - Earlier excluded groups now count.
    solution: Equal votes made parties compete for support from all communities, including ones once excluded.
    mistakes:
      It removed caste completely: s10_franchise
