# CBSE Class 10 Social Science (NCERT), Economics: Understanding Economic Development, chapter 2.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 19
title: Sectors of the Indian Economy
tips:
  c10ss_sectors: "Growing sugarcane is primary. Turning the cane into sugar in a mill is manufacturing: which sector is that?"
  c10ss_double_count: Wheat and flour are already inside the biscuits. Counting them again is double counting.
  c10ss_org_unorg: Job security, leave and provident fund belong to the organised sector.
  c10ss19_formal: "An appointment letter, paid leave and provident fund are signs of formal, registered work. Which sector gives those?"
  s10_disguised: "Disguised unemployment looks like work. What is hidden?"
  s10_mgnrega: "MGNREGA guarantees a set number of days, a round number."
  s10_primary: "Fishing makes nothing in a factory. It takes something straight from nature."
  s10_private: "Tata and Reliance are owned by private people and shareholders."
  s10_public_aim: "The public sector provides services even when they don't make a profit."
  c10ss19_cheap_power: "Foreign companies aim for profit. Who would supply power cheaply just to help small industries grow?"
  s10_railways_public: "Who owns Indian Railways?"
  s10_tertiary: "None of these make or grow goods. They give services."
  s10_unorg_protect: "Unorganised workers have no job security. Why do they need help?"
  s10_unorganised: "Street vendors have no fixed pay or written contract."
  c10ss19_final: Count only final goods and services in GDP. Intermediate goods are already included in the value of the final goods.
  c10ss19_shift: "Keep two things apart: which sector makes the most value, and which sector employs the most people. In India they are different sectors."
  c10ss19_jobs: More jobs can come from irrigation, cheap credit, storage, better roads to markets, small industries, tourism, and more schools and health centres.
  c10ss19_sector_type: 'Ask what the activity does: take from nature, make or manufacture something, or give a service?'
  c10ss19_public_private: 'Who owns the main assets and runs it: the government, or private individuals and companies?'
concepts:
- code: cbse10ss.sectors.three
  title: Primary, secondary and tertiary sectors
  notes: |
    Primary sector: activities that directly use natural resources (agriculture, dairy, fishing, forestry,
    mining). Secondary sector: manufacturing turns natural products into other forms (also called industrial
    sector). Tertiary sector: activities that support the other two and provide services (transport, storage,
    banking, trade, communication, and services like teachers, doctors, IT). GDP (Gross Domestic Product) is the
    value of all final goods and services produced in a country in a year; only final goods are counted to
    avoid double counting. In India, the tertiary sector has become the largest producer (over half of GDP), but
    the primary sector still employs the largest share of workers (around 44% in 2017–18 by NCERT figures) —
    underemployment or disguised unemployment: more people than needed working on a farm. MGNREGA (2005)
    guarantees 100 days of work a year in rural areas.
  explanations:
    text: 'Economic activities fall into three groups: primary uses nature directly (farming, fishing, mining), secondary changes those products in factories, and tertiary provides services. In India the service sector now produces the most, but farming still employs the most people, many of them not fully employed.'
    visual: 'Draw a cotton shirt''s journey: a farmer grows cotton (primary), a mill spins and weaves it (secondary), a truck carries it and a shop sells it (tertiary).'
    step_by_step: 'Step 1: Does the activity use a natural resource directly? Primary. Step 2: Does it make something new from raw materials? Secondary. Step 3: Does it provide a service? Tertiary. Step 4: For GDP, count only final goods.'
    real_world: 'A family of five working on a small farm that only needs three people looks employed, but two are disguised unemployed: removing them wouldn''t lower the harvest.'
  picture:
    kind: bars
    bars:
    - label: Primary
      value: 44
    - label: Secondary
      value: 25
    - label: Tertiary
      value: 31
    unit: '% of workers'
    alt: 'Bar chart of India''s workers by sector, roughly: primary 44 percent, secondary 25 percent, tertiary 31 percent.'
  activity:
    type: sort
    prompt: Which sector?
    bins:
    - Primary
    - Secondary
    - Tertiary
    items:
    - label: Dairy farming
      bin: Primary
      clue: Directly from nature.
      why: Primary.
    - label: Mining
      bin: Primary
      clue: From the earth.
      why: Primary.
    - label: Making sugar from cane
      bin: Secondary
      clue: Manufacturing.
      why: Secondary.
    - label: Building houses
      bin: Secondary
      clue: Construction.
      why: Secondary.
    - label: A doctor's work
      bin: Tertiary
      clue: A service.
      why: Tertiary.
    - label: Storage in a cold store
      bin: Tertiary
      clue: Supports the others.
      why: Tertiary.
    - label: Software services
      bin: Tertiary
      clue: IT is a service.
      why: Tertiary.
  lesson:
    - teach: 'Economic activities fall into three sectors. Primary: using natural resources directly (farming, fishing, mining, forestry). Secondary: making goods from raw materials (factories, construction). Tertiary (services): activities that support the other two (transport, banking, trade, teaching, IT).'
      picture:
        kind: compare
        columns:
        - title: Primary
          points:
          - Farming, fishing
          - Mining, forestry
        - title: Secondary
          points:
          - Factories
          - Construction
          - Electricity
        - title: Tertiary
          points:
          - Banks, transport
          - Teachers, doctors
          - IT services
        alt: 'Primary sector: farming, fishing, mining, forestry. Secondary sector: factories, construction, electricity. Tertiary sector: banks, transport, teachers, doctors, IT services.'
      check:
        prompt: A carpenter making furniture works in the…
        options:
        - Secondary sector
        - Primary sector
        - Tertiary sector
        answer: Secondary sector
        why: Wood is turned into a product.
    - teach: GDP (gross domestic product) is the value of all final goods and services produced in a country in a year. Only final goods are counted, to avoid double counting. In India the tertiary sector now produces the largest share of GDP, but more than half of workers are still in the primary sector.
      check:
        prompt: Why count only final goods in GDP?
        options:
        - To avoid double counting
        - Final goods are cheaper
        - Intermediate goods don't exist
        answer: To avoid double counting
        why: Intermediate values are already inside.
    - teach: 'Agriculture has disguised (hidden) unemployment: more people work than are needed. Seasonal unemployment is common too. To create jobs: irrigation, credit, storage, roads, small industries, and services. MGNREGA (2005) guarantees 100 days of paid work a year to rural households, or an allowance.'
      check:
        prompt: Five family members work on a farm that needs only three. This is…
        options:
        - Disguised unemployment
        - Full employment
        - Seasonal employment
        answer: Disguised unemployment
        why: Two add nothing to output.
  items:
  - prompt: Fishing belongs to which sector?
    options:
    - Primary
    - Secondary
    - Tertiary
    - Quaternary
    answer: Primary
    difficulty: 1
    hints:
    - It uses a natural resource directly.
    - Like farming.
    solution: 'Fishing directly uses natural resources: primary sector.'
    mistakes: {"Secondary": "s10_primary"}
  - prompt: A sugar mill making sugar from sugarcane is in which sector?
    options:
    - Secondary
    - Primary
    - Tertiary
    - None
    answer: Secondary
    difficulty: 1
    hints:
    - Manufacturing.
    - Raw material changed into a product.
    solution: 'Making sugar from cane is manufacturing: secondary.'
    mistakes:
      Primary: c10ss_sectors
  - prompt: A bank, a courier service and a teacher are all in which sector?
    options:
    - Tertiary
    - Primary
    - Secondary
    - Informal only
    answer: Tertiary
    difficulty: 1
    hints:
    - Services.
    - They don't make goods.
    solution: 'They provide services: tertiary sector.'
    mistakes: {"Secondary": "s10_tertiary"}
  - prompt: A farmer sells wheat for ₹10 000 to a flour mill, which sells flour for ₹15 000 to a baker, who sells biscuits for ₹25 000. What value should be counted in GDP, in rupees?
    answer: '25000'
    check: '25000'
    difficulty: 3
    hints:
    - Count only final goods.
    - Wheat and flour are inside the biscuits.
    solution: Only the final good, biscuits worth ₹25 000, is counted; adding all three (₹50 000) would double count.
    mistakes:
      '50000': c10ss_double_count
  - prompt: What is disguised unemployment?
    options:
    - More people work on a job than needed, so some add nothing to output
    - People with no job at all
    - Working two jobs
    - Unemployment in cities only
    answer: More people work on a job than needed, so some add nothing to output
    difficulty: 2
    hints:
    - Looks employed.
    - Common on small farms.
    solution: In disguised unemployment, people appear to work but their removal wouldn't reduce output.
    mistakes: {"People with no job at all": "s10_disguised"}
  - prompt: MGNREGA guarantees how many days of work a year to rural households?
    answer: '100'
    check: '100'
    difficulty: 2
    hints:
    - Passed in 2005.
    - Right to work.
    solution: MGNREGA guarantees 100 days of employment a year.
    mistakes: {"365": "s10_mgnrega", "200": "s10_mgnrega"}
  - prompt: Mining coal is in which sector?
    options:
    - Primary
    - Secondary
    - Tertiary
    - Quaternary
    answer: Primary
    difficulty: 1
    hints:
    - Taken straight from nature.
    - Like farming and fishing.
    solution: Extracting natural resources is primary.
    mistakes:
      Secondary: c10ss19_sector_type
  - prompt: A transporter carrying goods from a factory to shops works in which sector?
    options:
    - Tertiary
    - Primary
    - Secondary
    - None
    answer: Tertiary
    difficulty: 1
    hints:
    - Nothing is grown or made.
    - It is a service.
    solution: 'Transport is a service: tertiary.'
    mistakes:
      Secondary: c10ss19_sector_type
  - prompt: A baker buys flour for ₹50 and sells bread for ₹80. If only the bread is counted, what value goes into GDP, in rupees?
    answer: '80'
    check: '80'
    difficulty: 2
    hints:
    - Flour is an intermediate good.
    - Its value is already in the bread.
    solution: Only the final good (bread, ₹80) is counted.
    mistakes:
      '130': c10ss19_final
      '30': c10ss19_final
  - prompt: Which sector produces the largest share of India's GDP today?
    options:
    - Tertiary
    - Primary
    - Secondary
    - All equal
    answer: Tertiary
    difficulty: 2
    hints:
    - It has grown fastest since the 1970s.
    - Services.
    solution: The service (tertiary) sector is now the largest producer.
    mistakes:
      Primary: c10ss19_shift
  - prompt: Which sector still employs the most workers in India?
    options:
    - Primary
    - Tertiary
    - Secondary
    - None
    answer: Primary
    difficulty: 2
    hints:
    - Many people still farm.
    - Even though it produces less.
    solution: More than half of India's workers are in the primary sector.
    mistakes:
      Tertiary: c10ss19_shift
  - prompt: Farm labourers find no work for a few months after harvest. This is…
    options:
    - Seasonal unemployment
    - Disguised unemployment
    - Full employment
    - Organised work
    answer: Seasonal unemployment
    difficulty: 2
    hints:
    - It happens at certain times of the year.
    - Linked to the farming calendar.
    solution: Lack of work in some seasons is seasonal unemployment.
    mistakes:
      Disguised unemployment: s10_disguised
  - prompt: Which would create jobs in rural areas?
    options:
    - Building a dam and canals for irrigation
    - Closing local markets
    - Cutting bank loans
    - Banning small industries
    answer: Building a dam and canals for irrigation
    difficulty: 2
    hints:
    - More irrigated land, more crops.
    - More work on farms.
    solution: Irrigation lets farmers grow more crops, creating more work.
    mistakes:
      Cutting bank loans: c10ss19_jobs
  - prompt: In which year was MGNREGA passed?
    answer: '2005'
    check: '2005'
    difficulty: 3
    hints:
    - Early in this century.
    - Mid-2000s.
    solution: The Mahatma Gandhi National Rural Employment Guarantee Act was passed in 2005.
    mistakes:
      '100': s10_mgnrega
  - prompt: Which of these is a tertiary activity?
    options:
    - Teaching in a school
    - Growing rice
    - Making cement
    - Catching fish
    answer: Teaching in a school
    difficulty: 1
    hints:
    - Which one provides a service?
    - Nothing grown or made.
    solution: Teaching is a service, so tertiary.
    mistakes:
      Making cement: c10ss19_sector_type
- code: cbse10ss.sectors.organised
  title: Organised and unorganised; public and private
  after:
  - cbse10ss.sectors.three
  notes: |
    Organised sector: enterprises registered with the government that follow rules (Factories Act, Minimum
    Wages Act, Payment of Gratuity Act); regular jobs, fixed hours, paid leave, provident fund, medical
    benefits. Unorganised sector: small, scattered units largely outside government control; low-paid,
    irregular jobs; no paid leave or security (landless labourers, street vendors, small-scale industry
    workers, construction workers, head-load workers). Workers there need protection: cheap loans, fair prices
    and support. Public sector: the government owns most assets and provides services (railways, post
    offices); aims at welfare, not only profit (e.g., cheap electricity, health, education, food). Private
    sector: individuals or companies own assets, motivated by profit (Tata Steel, Reliance).
  explanations:
    text: 'Jobs in the organised sector are registered and protected by laws: fixed hours, leave, provident fund. Most Indian workers, though, are in the unorganised sector, with low, irregular pay and no security. Separately, enterprises are public if the government owns them and private if individuals or companies do.'
    visual: 'Draw two workers: one with an ID card, payslip and holiday calendar (organised), one with a handcart and no contract (unorganised).'
    step_by_step: 'Step 1: Is the enterprise registered and following labour laws? Organised; if not, unorganised. Step 2: Who owns it: government (public) or individuals/companies (private)? Step 3: What is its purpose: welfare or profit?'
    real_world: A daily-wage construction worker who gets no pay on a rainy day and no compensation after an injury is in the unorganised sector.
  picture:
    kind: compare
    columns:
    - title: Organised
      points:
      - Registered with the government
      - Regular jobs, fixed hours
      - Paid leave, provident fund
      - Follows labour laws
    - title: Unorganised
      points:
      - Small, scattered, unregistered
      - Irregular, low pay
      - No paid leave or security
      - Rules often not followed
    alt: Organised sector jobs are registered and protected with leave and provident fund; unorganised sector jobs are irregular and lack security.
  activity:
    type: sort
    prompt: Organised or unorganised?
    bins:
    - Organised
    - Unorganised
    items:
    - label: Bank officer with provident fund
      bin: Organised
      clue: Regular, with benefits.
      why: Organised.
    - label: Head-load worker in a market
      bin: Unorganised
      clue: Daily, no security.
      why: Unorganised.
    - label: Factory worker with paid leave
      bin: Organised
      clue: Follows the Factories Act.
      why: Organised.
    - label: Street vendor
      bin: Unorganised
      clue: Small and scattered.
      why: Unorganised.
    - label: Landless farm labourer
      bin: Unorganised
      clue: No fixed job.
      why: Unorganised.
    - label: Government school teacher
      bin: Organised
      clue: Regular job.
      why: Organised.
  lesson:
    - teach: The organised sector has registered enterprises with regular jobs, fixed hours, paid leave, provident fund and job security, following government rules. The unorganised sector has small, scattered units, often unregistered, with low pay, no security and no paid leave. Most Indian workers are in the unorganised sector.
      picture:
        kind: compare
        columns:
        - title: Organised
          points:
          - Registered
          - Regular salary
          - Paid leave, PF
          - Job security
        - title: Unorganised
          points:
          - Often not registered
          - Low, irregular pay
          - No leave
          - Can be removed any time
        alt: 'Organised sector: registered, regular salary, paid leave and provident fund, job security. Unorganised sector: often unregistered, low irregular pay, no leave, workers can be removed any time.'
      check:
        prompt: A government school teacher with a pension works in the…
        options:
        - Organised sector
        - Unorganised sector
        - Primary sector
        answer: Organised sector
        why: Regular job with benefits.
    - teach: 'Unorganised workers need protection: landless labourers, small farmers, street vendors, construction workers, and many from SC, ST and minority communities. The government can help with minimum wages, cheap loans, health and social security.'
      check:
        prompt: Which worker is usually in the unorganised sector?
        options:
        - A street vendor
        - A bank officer
        - A railway engineer
        answer: A street vendor
        why: No fixed pay or contract.
    - teach: 'By ownership: public sector (government owns most assets and provides services, e.g. Indian Railways, post offices) and private sector (owned by individuals or companies for profit, e.g. Tata Steel, Reliance). The public sector also provides things the private sector won''t, like cheap electricity for small industries or health and schools for all.'
      check:
        prompt: Indian Railways is in the…
        options:
        - Public sector
        - Private sector
        - Unorganised sector
        answer: Public sector
        why: The government owns it.
  items:
  - prompt: Which of these is a feature of the organised sector?
    options:
    - Paid leave and provident fund
    - No fixed working hours
    - No job security
    - Not registered with the government
    answer: Paid leave and provident fund
    difficulty: 1
    hints:
    - Registered enterprises.
    - Labour laws apply.
    solution: Organised sector workers get benefits like paid leave and provident fund.
    mistakes:
      No job security: c10ss_org_unorg
  - prompt: A street vendor works in which sector?
    options:
    - Unorganised
    - Organised
    - Public
    - Quaternary
    answer: Unorganised
    difficulty: 1
    hints:
    - No registration.
    - Irregular income.
    solution: Street vendors are part of the unorganised sector.
    mistakes: {"Organised": "s10_unorganised"}
  - prompt: 'Indian Railways is an example of:'
    options:
    - The public sector
    - The private sector
    - The unorganised sector
    - A cooperative
    answer: The public sector
    difficulty: 1
    hints:
    - Owned by the government.
    - Not mainly for profit.
    solution: 'Indian Railways is owned and run by the government: public sector.'
    mistakes: {"The private sector": "s10_railways_public"}
  - prompt: What is the main aim of the public sector?
    options:
    - Public welfare, not just profit
    - Only earning profit
    - Helping foreign companies
    - Avoiding taxes
    answer: Public welfare, not just profit
    difficulty: 2
    hints:
    - Cheap services for all.
    - Health, education, electricity.
    solution: The public sector aims at welfare, providing services even when they aren't profitable.
    mistakes: {"Only earning profit": "s10_public_aim"}
  - prompt: Why do unorganised sector workers need protection?
    options:
    - They have low, irregular pay and no job security
    - They earn too much
    - They work too few hours
    - They are all government employees
    answer: They have low, irregular pay and no job security
    difficulty: 2
    hints:
    - No paid leave.
    - Can be dismissed anytime.
    solution: 'They face exploitation: irregular low pay and no security or benefits.'
    mistakes: {"They earn too much": "s10_unorg_protect"}
  - prompt: 'Tata Steel and Reliance Industries belong to the:'
    options:
    - Private sector
    - Public sector
    - Unorganised sector
    - Primary sector
    answer: Private sector
    difficulty: 1
    hints:
    - Owned by companies.
    - Profit motive.
    solution: 'They are owned by private companies: private sector.'
    mistakes: {"Public sector": "s10_private"}
  - prompt: Which is a feature of the unorganised sector?
    options:
    - No job security or paid leave
    - Fixed working hours
    - Provident fund
    - Medical benefits
    answer: No job security or paid leave
    difficulty: 1
    hints:
    - Three options are organised-sector benefits.
    - Which one is missing?
    solution: Unorganised workers lack job security and paid leave.
    mistakes:
      Provident fund: c10ss_org_unorg
  - prompt: A person working in a big factory with appointment letter, leave and PF is in the…
    options:
    - Organised sector
    - Unorganised sector
    - Primary sector
    - Informal sector
    answer: Organised sector
    difficulty: 1
    hints:
    - Formal terms of work.
    - Registered with the government.
    solution: Formal jobs with benefits belong to the organised sector.
    mistakes:
      Unorganised sector: c10ss19_formal
  - prompt: Why does the government provide some services even at a loss?
    options:
    - They are needed by everyone, and the private sector won't provide them cheaply
    - To make big profits
    - To compete with farmers
    - Because private firms are banned
    answer: They are needed by everyone, and the private sector won't provide them cheaply
    difficulty: 2
    hints:
    - Think of roads, water, schools.
    - Profit isn't the aim.
    solution: The public sector's aim is welfare, not profit.
    mistakes:
      To make big profits: s10_public_aim
  - prompt: Which company is in the private sector?
    options:
    - Reliance Industries
    - Indian Railways
    - India Post
    - Government hospitals
    answer: Reliance Industries
    difficulty: 1
    hints:
    - Owned by individuals or shareholders.
    - Run for profit.
    solution: Reliance is privately owned.
    mistakes:
      Indian Railways: c10ss19_public_private
  - prompt: Who mostly makes up the unorganised sector in rural areas?
    options:
    - Landless labourers, small farmers and artisans
    - Bank officers
    - IAS officers
    - Airline pilots
    answer: Landless labourers, small farmers and artisans
    difficulty: 2
    hints:
    - Small, informal work.
    - No fixed salary.
    solution: Rural unorganised workers include landless labourers, sharecroppers, small farmers and artisans.
    mistakes:
      Bank officers: s10_unorganised
  - prompt: How can the government help unorganised workers?
    options:
    - Set minimum wages and give cheap loans and social security
    - Remove all labour laws
    - Ban small businesses
    - Stop rural jobs
    answer: Set minimum wages and give cheap loans and social security
    difficulty: 2
    hints:
    - They need protection.
    - Money and safety.
    solution: Minimum wages, credit and social security protect unorganised workers.
    mistakes:
      Remove all labour laws: s10_unorg_protect
  - prompt: Electricity sold cheaply to small industries by a state board shows the role of…
    options:
    - The public sector
    - The unorganised sector
    - Foreign companies
    - Moneylenders
    answer: The public sector
    difficulty: 2
    hints:
    - Cheap supply helps industry grow.
    - Who would do it at low profit?
    solution: The public sector supplies such services to support growth.
    mistakes:
      Foreign companies: c10ss19_cheap_power
  - prompt: Why do many workers in the organised sector feel more secure?
    options:
    - They have regular pay, leave and protection under labour laws
    - They earn nothing
    - They can be fired any day
    - They work only in villages
    answer: They have regular pay, leave and protection under labour laws
    difficulty: 1
    hints:
    - Formal terms.
    - Government rules apply.
    solution: Laws such as the Factories Act protect organised-sector workers.
    mistakes:
      They can be fired any day: c10ss_org_unorg
  - prompt: A government hospital is an example of which sector, by ownership?
    options:
    - Public sector
    - Private sector
    - Unorganised sector
    - Primary sector
    answer: Public sector
    difficulty: 1
    hints:
    - Who owns it?
    - Not run for profit.
    solution: Government-owned services are in the public sector.
    mistakes:
      Private sector: c10ss19_public_private
