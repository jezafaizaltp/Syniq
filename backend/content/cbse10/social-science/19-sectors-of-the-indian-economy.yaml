# CBSE Class 10 Social Science (NCERT), Economics: Understanding Economic Development, chapter 2.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 19
title: Sectors of the Indian Economy
tips:
  c10ss_sectors: Growing sugarcane is primary; making sugar from it in a mill is secondary.
  c10ss_double_count: Wheat and flour are already inside the biscuits. Counting them again is double counting.
  c10ss_org_unorg: Job security, leave and provident fund belong to the organised sector.
concepts:
- code: cbse10ss.sectors.three
  title: Primary, secondary and tertiary sectors
  notes: |
    Primary sector: activities that directly use natural resources (agriculture, dairy, fishing, forestry,
    mining). Secondary sector: manufacturing turns natural products into other forms (also called industrial
    sector). Tertiary sector: activities that support the other two and provide services (transport, storage,
    banking, trade, communication, and services like teachers, doctors, IT). GDP (Gross Domestic Product) is the
    value of all final goods and services produced in a country in a year; only final goods are counted to
    avoid double counting. In India, the tertiary sector has become the largest producer (over half of GDP), but
    the primary sector still employs the largest share of workers (around 44% in 2017–18 by NCERT figures) —
    underemployment or disguised unemployment: more people than needed working on a farm. MGNREGA (2005)
    guarantees 100 days of work a year in rural areas.
  explanations:
    text: 'Economic activities fall into three groups: primary uses nature directly (farming, fishing, mining), secondary changes those products in factories, and tertiary provides services. In India the service sector now produces the most, but farming still employs the most people, many of them not fully employed.'
    visual: 'Draw a cotton shirt''s journey: a farmer grows cotton (primary), a mill spins and weaves it (secondary), a truck carries it and a shop sells it (tertiary).'
    step_by_step: 'Step 1: Does the activity use a natural resource directly? Primary. Step 2: Does it make something new from raw materials? Secondary. Step 3: Does it provide a service? Tertiary. Step 4: For GDP, count only final goods.'
    real_world: 'A family of five working on a small farm that only needs three people looks employed, but two are disguised unemployed: removing them wouldn''t lower the harvest.'
  picture:
    kind: bars
    bars:
    - label: Primary
      value: 44
    - label: Secondary
      value: 25
    - label: Tertiary
      value: 31
    unit: '% of workers'
    alt: 'Bar chart of India''s workers by sector, roughly: primary 44 percent, secondary 25 percent, tertiary 31 percent.'
  items:
  - prompt: Fishing belongs to which sector?
    options:
    - Primary
    - Secondary
    - Tertiary
    - Quaternary
    answer: Primary
    difficulty: 1
    hints:
    - It uses a natural resource directly.
    - Like farming.
    solution: 'Fishing directly uses natural resources: primary sector.'
  - prompt: A sugar mill making sugar from sugarcane is in which sector?
    options:
    - Secondary
    - Primary
    - Tertiary
    - None
    answer: Secondary
    difficulty: 1
    hints:
    - Manufacturing.
    - Raw material changed into a product.
    solution: 'Making sugar from cane is manufacturing: secondary.'
    mistakes:
      Primary: c10ss_sectors
  - prompt: A bank, a courier service and a teacher are all in which sector?
    options:
    - Tertiary
    - Primary
    - Secondary
    - Informal only
    answer: Tertiary
    difficulty: 1
    hints:
    - Services.
    - They don't make goods.
    solution: 'They provide services: tertiary sector.'
  - prompt: A farmer sells wheat for ₹10 000 to a flour mill, which sells flour for ₹15 000 to a baker, who sells biscuits for ₹25 000. What value should be counted in GDP, in rupees?
    answer: '25000'
    check: '25000'
    difficulty: 3
    hints:
    - Count only final goods.
    - Wheat and flour are inside the biscuits.
    solution: Only the final good, biscuits worth ₹25 000, is counted; adding all three (₹50 000) would double count.
    mistakes:
      '50000': c10ss_double_count
  - prompt: What is disguised unemployment?
    options:
    - More people work on a job than needed, so some add nothing to output
    - People with no job at all
    - Working two jobs
    - Unemployment in cities only
    answer: More people work on a job than needed, so some add nothing to output
    difficulty: 2
    hints:
    - Looks employed.
    - Common on small farms.
    solution: In disguised unemployment, people appear to work but their removal wouldn't reduce output.
  - prompt: MGNREGA guarantees how many days of work a year to rural households?
    answer: '100'
    check: '100'
    difficulty: 2
    hints:
    - Passed in 2005.
    - Right to work.
    solution: MGNREGA guarantees 100 days of employment a year.
- code: cbse10ss.sectors.organised
  title: Organised and unorganised; public and private
  after:
  - cbse10ss.sectors.three
  notes: |
    Organised sector: enterprises registered with the government that follow rules (Factories Act, Minimum
    Wages Act, Payment of Gratuity Act); regular jobs, fixed hours, paid leave, provident fund, medical
    benefits. Unorganised sector: small, scattered units largely outside government control; low-paid,
    irregular jobs; no paid leave or security (landless labourers, street vendors, small-scale industry
    workers, construction workers, head-load workers). Workers there need protection: cheap loans, fair prices
    and support. Public sector: the government owns most assets and provides services (railways, post
    offices); aims at welfare, not only profit (e.g., cheap electricity, health, education, food). Private
    sector: individuals or companies own assets, motivated by profit (Tata Steel, Reliance).
  explanations:
    text: 'Jobs in the organised sector are registered and protected by laws: fixed hours, leave, provident fund. Most Indian workers, though, are in the unorganised sector, with low, irregular pay and no security. Separately, enterprises are public if the government owns them and private if individuals or companies do.'
    visual: 'Draw two workers: one with an ID card, payslip and holiday calendar (organised), one with a handcart and no contract (unorganised).'
    step_by_step: 'Step 1: Is the enterprise registered and following labour laws? Organised; if not, unorganised. Step 2: Who owns it: government (public) or individuals/companies (private)? Step 3: What is its purpose: welfare or profit?'
    real_world: A daily-wage construction worker who gets no pay on a rainy day and no compensation after an injury is in the unorganised sector.
  picture:
    kind: compare
    columns:
    - title: Organised
      points:
      - Registered with the government
      - Regular jobs, fixed hours
      - Paid leave, provident fund
      - Follows labour laws
    - title: Unorganised
      points:
      - Small, scattered, unregistered
      - Irregular, low pay
      - No paid leave or security
      - Rules often not followed
    alt: Organised sector jobs are registered and protected with leave and provident fund; unorganised sector jobs are irregular and lack security.
  items:
  - prompt: Which of these is a feature of the organised sector?
    options:
    - Paid leave and provident fund
    - No fixed working hours
    - No job security
    - Not registered with the government
    answer: Paid leave and provident fund
    difficulty: 1
    hints:
    - Registered enterprises.
    - Labour laws apply.
    solution: Organised sector workers get benefits like paid leave and provident fund.
    mistakes:
      No job security: c10ss_org_unorg
  - prompt: A street vendor works in which sector?
    options:
    - Unorganised
    - Organised
    - Public
    - Quaternary
    answer: Unorganised
    difficulty: 1
    hints:
    - No registration.
    - Irregular income.
    solution: Street vendors are part of the unorganised sector.
  - prompt: 'Indian Railways is an example of:'
    options:
    - The public sector
    - The private sector
    - The unorganised sector
    - A cooperative
    answer: The public sector
    difficulty: 1
    hints:
    - Owned by the government.
    - Not mainly for profit.
    solution: 'Indian Railways is owned and run by the government: public sector.'
  - prompt: What is the main aim of the public sector?
    options:
    - Public welfare, not just profit
    - Only earning profit
    - Helping foreign companies
    - Avoiding taxes
    answer: Public welfare, not just profit
    difficulty: 2
    hints:
    - Cheap services for all.
    - Health, education, electricity.
    solution: The public sector aims at welfare, providing services even when they aren't profitable.
  - prompt: Why do unorganised sector workers need protection?
    options:
    - They have low, irregular pay and no job security
    - They earn too much
    - They work too few hours
    - They are all government employees
    answer: They have low, irregular pay and no job security
    difficulty: 2
    hints:
    - No paid leave.
    - Can be dismissed anytime.
    solution: 'They face exploitation: irregular low pay and no security or benefits.'
  - prompt: 'Tata Steel and Reliance Industries belong to the:'
    options:
    - Private sector
    - Public sector
    - Unorganised sector
    - Primary sector
    answer: Private sector
    difficulty: 1
    hints:
    - Owned by companies.
    - Profit motive.
    solution: 'They are owned by private companies: private sector.'
