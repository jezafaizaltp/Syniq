# CBSE Class 10 Social Science (NCERT), Economics: Understanding Economic Development, chapter 3.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 20
title: Money and Credit
tips:
  c10ss_rbi: "Commercial banks like SBI lend and take deposits but don't issue notes. In India one central bank issues currency."
  c10ss_reserve_loan: 'That''s the cash kept. The bank lends the rest: 85% of the deposits.'
  c10ss_monthly_yearly: That's one month. Multiply by 12 for the year.
  c10ss_formal_informal: 'Moneylenders are informal: no government supervision. Banks and cooperatives are formal.'
  s10_collateral: "Collateral is something the borrower owns and could lose if they don't repay."
  s10_demand_deposit: "Demand deposits can be withdrawn whenever you ask."
  s10_double_coincidence: "Barter only works when both sides want what the other has."
  s10_legal_tender: "The rupee is not made of gold. Who authorises it?"
  s10_monthly_interest: "5% of 10,000 for one month: 10,000 × 5 ÷ 100."
  s10_reserve: "15% of 2,000: 2,000 × 15 ÷ 100."
  s10_shg: "Self-help groups help members who have nothing to pledge. How?"
  s10_yunus: "Amartya Sen studied famines. Who founded the Grameen Bank?"
  c10ss20_medium: 'Money is a medium of exchange: it stands in the middle of exchanges, so you don''t need someone who wants exactly what you have.'
  c10ss20_bank_role: 'Banks act as middlemen: they take deposits from people with spare money and lend to people who need loans, earning from the difference in interest.'
  c10ss20_terms: "Terms of credit are the conditions attached to a loan: how much extra is paid, what security is given, which papers are needed and how it is paid back."
  c10ss20_pledge: "Interest is the extra money paid for borrowing. What do we call the asset a borrower hands over as security?"
  c10ss20_debt_trap: 'When a borrower can''t repay because a crop failed or a business lost money, they may sell assets to repay: this is a debt trap.'
  c10ss20_interest: Simple interest = principal × rate × time ÷ 100. Watch whether the rate is per month or per year.
concepts:
- code: cbse10ss.money.exchange
  title: Money as a medium of exchange
  notes: |
    Barter (goods for goods) needs a double coincidence of wants: each person must want what the other has.
    Money removes this problem by acting as a medium of exchange. Forms: grains and cattle, then metal coins
    (gold, silver, copper), then paper notes and coins issued by the Reserve Bank of India on behalf of the
    government (currency is legally accepted: legal tender). Modern forms include bank deposits (demand
    deposits) withdrawn by cheque, and digital payments. Banks keep only about 15% of deposits as cash for daily
    withdrawals and use the rest to give loans, earning the difference between the interest on loans and that
    paid on deposits.
  explanations:
    text: Without money, people would have to swap goods directly and find someone who both has what they want and wants what they have. Money solves that. Today money includes notes and coins issued by the RBI and deposits in banks, which we can pay with by cheque or digitally.
    visual: 'Draw a shoemaker who wants wheat, and a farmer who wants cloth, not shoes: no deal. Add a ₹500 note in the middle: now everyone can trade.'
    step_by_step: 'Step 1: Ask whether both sides want what the other has (double coincidence). Step 2: If not, money is needed. Step 3: Identify the form: currency, deposit, cheque, digital. Step 4: Remember the RBI issues currency.'
    real_world: 'When you pay a shop by UPI, money moves from your bank deposit to the shop''s deposit without any notes changing hands: deposits are money too.'
  picture:
    kind: flow
    steps:
    - You deposit ₹1000 in a bank
    - The bank keeps about ₹150 as cash
    - It lends about ₹850 to borrowers
    - Borrowers pay interest on loans
    - The bank pays you a lower interest; it keeps the difference
    alt: 'How banks work: of a 1000 rupee deposit, about 150 is kept as cash and 850 is lent out; the bank earns the gap between loan interest and deposit interest.'
  activity:
    type: sort
    prompt: Why does barter fail here?
    bins:
    - Double coincidence missing
    - Works fine
    items:
    - label: A shoemaker wants wheat; the wheat farmer wants cloth
      bin: Double coincidence missing
      clue: Does each want what the other has?
      why: The farmer doesn't want shoes.
    - label: A potter wants rice; the rice farmer wants pots
      bin: Works fine
      clue: Each wants the other's goods.
      why: 'Double coincidence: barter works.'
    - label: A weaver wants milk; the milkman wants a bicycle
      bin: Double coincidence missing
      clue: Does the milkman want cloth?
      why: No. Money solves this.
    - label: A fisher wants fruit; the fruit seller wants fish
      bin: Works fine
      clue: Both match.
      why: Barter works.
  lesson:
    - teach: 'Before money, people used barter: goods for goods. Barter needs a double coincidence of wants: both sides must want what the other has. Money solves this. As a medium of exchange, it is accepted by everyone, so you can sell to one person and buy from another.'
      check:
        prompt: Barter needs…
        options:
        - A double coincidence of wants
        - A bank
        - Paper money
        answer: A double coincidence of wants
        why: Both must want what the other has.
    - teach: 'Early money took many forms: grains, cattle, then gold, silver and copper coins. Modern money is currency (paper notes and coins) issued by the Reserve Bank of India on behalf of the government. It is accepted because the government authorises it (legal tender); no one in India may refuse rupees.'
      picture:
        kind: flow
        steps:
        - 'Barter: goods for goods'
        - Grain and cattle
        - Metal coins
        - Paper notes (RBI)
        - Bank deposits and digital payments
        alt: 'Forms of money over time: barter, then grain and cattle, metal coins, paper notes issued by the RBI, and today bank deposits and digital payments.'
      check:
        prompt: Who issues currency notes in India?
        options:
        - Reserve Bank of India
        - State Bank of India
        - Each state government
        answer: Reserve Bank of India
        why: On behalf of the central government.
    - teach: People also hold money as deposits in banks. Demand deposits can be withdrawn whenever needed and paid by cheque, so they are also money. Banks keep about 15% of deposits as cash and lend the rest, earning interest. They pay depositors a lower rate than they charge borrowers.
      check:
        prompt: A cheque is an order to a bank to…
        options:
        - Pay a sum from your account to someone
        - Print money
        - Close the bank
        answer: Pay a sum from your account to someone
        why: It uses a demand deposit.
  items:
  - prompt: What does 'double coincidence of wants' mean?
    options:
    - Both parties must want what the other has to sell
    - Two people want the same thing
    - A person wants two things
    - Money is needed twice
    answer: Both parties must want what the other has to sell
    difficulty: 1
    hints:
    - Barter system.
    - Each wants the other's goods.
    solution: In barter, both people must want each other's goods at the same time.
    mistakes: {"Two people want the same thing": "s10_double_coincidence"}
  - prompt: Who issues currency notes in India?
    options:
    - The Reserve Bank of India
    - The State Bank of India
    - The Finance Ministry directly
    - Any commercial bank
    answer: The Reserve Bank of India
    difficulty: 1
    hints:
    - The central bank.
    - On behalf of the government.
    solution: The RBI issues currency notes on behalf of the central government.
    mistakes:
      The State Bank of India: c10ss_rbi
  - prompt: Banks keep about 15% of deposits as cash. If people deposit ₹2000, about how much is kept as cash, in rupees?
    answer: '300'
    check: 2000*Rational(15, 100)
    difficulty: 1
    hints:
    - 15% of 2000.
    - 0.15 × 2000.
    solution: 15% of 2000 = ₹300.
    mistakes: {"1700": "s10_reserve", "150": "s10_reserve"}
  - prompt: With deposits of ₹2000 and 15% kept as cash, how much can the bank lend, in rupees?
    answer: '1700'
    check: 2000*Rational(85, 100)
    difficulty: 2
    hints:
    - Lend the rest.
    - 2000 − 300.
    solution: 'Step 1: Cash = 300. Step 2: Loans = 2000 − 300 = ₹1700.'
    mistakes:
      '300': c10ss_reserve_loan
  - prompt: Why are demand deposits considered money?
    options:
    - They can be withdrawn on demand and used for payments by cheque
    - They are printed by the RBI
    - They earn no interest
    - They can't be used
    answer: They can be withdrawn on demand and used for payments by cheque
    difficulty: 2
    hints:
    - Cheques and digital payments.
    - Accepted widely.
    solution: Demand deposits can be withdrawn any time and used to settle payments, so they work like money.
    mistakes: {"They are printed by the RBI": "s10_demand_deposit"}
  - prompt: Why is the rupee accepted as a medium of exchange?
    options:
    - It is authorised by the government as legal tender
    - It is made of gold
    - Banks like it
    - It is heavy
    answer: It is authorised by the government as legal tender
    difficulty: 2
    hints:
    - Nobody can refuse it in India.
    - Government authorisation.
    solution: 'The rupee is legal tender: the government authorises it and it can''t be refused.'
    mistakes: {"It is made of gold": "s10_legal_tender"}
  - prompt: Why is money called a medium of exchange?
    options:
    - It acts as a go-between in buying and selling
    - It is made of paper
    - It is kept in banks
    - It earns interest
    answer: It acts as a go-between in buying and selling
    difficulty: 1
    hints:
    - '''Medium'' means in the middle.'
    - It removes the need for barter.
    solution: Money sits between exchanges, so goods are sold for money and money buys goods.
    mistakes:
      It is made of paper: c10ss20_medium
  - prompt: A shoemaker wants wheat, and a farmer wants shoes. With barter, what is needed?
    options:
    - Each must want what the other has
    - A bank loan
    - An RBI order
    - A cheque
    answer: Each must want what the other has
    difficulty: 1
    hints:
    - Both sides must agree to swap.
    - Think of 'double coincidence'.
    solution: Barter only works when both want each other's goods.
    mistakes:
      A bank loan: s10_double_coincidence
  - prompt: Banks keep 15% of ₹10 000 deposits as cash. How much can they lend, in rupees?
    answer: '8500'
    check: 10000 * 0.85
    difficulty: 2
    hints:
    - Find the cash kept first.
    - Lend the rest.
    solution: 'Cash kept: 1500. Lent: 10 000 − 1500 = ₹8500.'
    mistakes:
      '1500': c10ss_reserve_loan
  - prompt: Where do banks get most of their profit?
    options:
    - The difference between interest charged on loans and interest paid on deposits
    - Selling notes
    - Printing cheques
    - Government gifts
    answer: The difference between interest charged on loans and interest paid on deposits
    difficulty: 2
    hints:
    - They pay depositors a little.
    - They charge borrowers more.
    solution: The gap between lending and deposit rates is banks' main income.
    mistakes:
      Printing cheques: c10ss20_bank_role
  - prompt: What does 'legal tender' mean for the rupee?
    options:
    - No one in India can legally refuse it as payment
    - It is made of gold
    - Only banks can use it
    - It can be printed by anyone
    answer: No one in India can legally refuse it as payment
    difficulty: 2
    hints:
    - The government authorises it.
    - It must be accepted.
    solution: As legal tender, the rupee must be accepted for settling payments in India.
    mistakes:
      It is made of gold: s10_legal_tender
  - prompt: Which of these was used as money before coins?
    options:
    - Grains and cattle
    - Credit cards
    - Cheques
    - Paper notes
    answer: Grains and cattle
    difficulty: 1
    hints:
    - Very early times.
    - Things everyone valued.
    solution: Grains and cattle were early forms of money.
    mistakes:
      Paper notes: c10ss20_medium
  - prompt: Why are demand deposits accepted as money?
    options:
    - They can be withdrawn on demand and used to pay by cheque
    - They are locked for years
    - They earn no interest
    - They are printed by the RBI
    answer: They can be withdrawn on demand and used to pay by cheque
    difficulty: 2
    hints:
    - '''Demand'' says when you can take it out.'
    - Cheques transfer them.
    solution: Demand deposits share the key features of money and pay for things by cheque.
    mistakes:
      They are locked for years: s10_demand_deposit
  - prompt: About what percentage of deposits do Indian banks keep as cash?
    answer: '15'
    check: '15'
    difficulty: 2
    hints:
    - A small part, to meet withdrawals.
    - Between 10 and 20.
    solution: Banks keep about 15% as cash and lend the rest.
    mistakes:
      '85': c10ss_reserve_loan
      '50': c10ss20_bank_role
  - prompt: Who supervises how banks work in India?
    options:
    - Reserve Bank of India
    - Election Commission
    - Supreme Court
    - Panchayats
    answer: Reserve Bank of India
    difficulty: 1
    hints:
    - It also issues notes.
    - India's central bank.
    solution: The RBI supervises formal lenders such as banks.
    mistakes:
      Election Commission: c10ss_rbi
- code: cbse10ss.money.credit
  title: 'Credit: formal and informal'
  after:
  - cbse10ss.money.exchange
  notes: |
    Credit (a loan) is an agreement in which a lender supplies money or goods to a borrower in return for a
    promise of future payment. Credit can help (a trader repays from sales) or trap the borrower in debt (a
    farmer whose crop fails). Terms of credit: interest rate, collateral (an asset like land, a house or
    vehicle, kept as security), documents and mode of repayment. Formal sources: banks and cooperatives,
    supervised by the RBI, lower interest. Informal sources: moneylenders, traders, employers, relatives; no
    supervision, often very high interest (moneylenders may charge 3–5% a month), which can lead to a debt
    trap. Rich households get more formal credit; poor ones depend on informal credit. Self-help groups (SHGs)
    of 15–20 members, mostly women, pool savings, give small loans and help members get bank loans without
    collateral. The Grameen Bank of Bangladesh (Muhammad Yunus, Nobel Peace Prize 2006) is a famous example.
  explanations:
    text: Credit lets people borrow now and repay later. Banks and cooperatives give loans at fair, regulated interest but often want collateral, so poor families turn to moneylenders who charge very high interest and can trap them in debt. Self-help groups help the poor save together and borrow safely.
    visual: 'Draw two paths from a poor farmer needing ₹10 000: one to a moneylender at 5% a month (₹500 a month interest), one to a self-help group or bank at about 1% a month (₹100). The first path ends in a debt trap.'
    step_by_step: 'Step 1: Formal (bank, cooperative) or informal (moneylender, trader)? Step 2: Compare interest rates. Step 3: Check collateral. Step 4: Ask whether the borrower can repay, or risks a debt trap.'
    real_world: Kudumbashree in Kerala is a network of women's self-help groups that save together and take bank loans to start small businesses.
  picture:
    kind: compare
    columns:
    - title: Formal credit
      points:
      - Banks, cooperatives
      - Supervised by the RBI
      - Lower interest
      - Often needs collateral
    - title: Informal credit
      points:
      - Moneylenders, traders, relatives
      - No supervision
      - Very high interest
      - Risk of debt trap
    alt: Formal credit from banks and cooperatives is supervised and cheaper; informal credit from moneylenders has no supervision and very high interest.
  activity:
    type: sort
    prompt: Formal or informal credit?
    bins:
    - Formal
    - Informal
    items:
    - label: A loan from a bank
      bin: Formal
      clue: Supervised by the RBI.
      why: Formal.
    - label: A cooperative society loan
      bin: Formal
      clue: Registered, supervised.
      why: Formal.
    - label: A moneylender at 5% a month
      bin: Informal
      clue: No supervision.
      why: Informal.
    - label: A loan from your employer
      bin: Informal
      clue: No rules.
      why: Informal.
    - label: A self-help group loan linked to a bank
      bin: Formal
      clue: Bank-linked, no collateral needed.
      why: Formal (via the bank).
    - label: Credit from a trader against your crop
      bin: Informal
      clue: Trader sets the terms.
      why: Informal.
  lesson:
    - teach: 'Credit (a loan) is an agreement where a lender gives money, goods or services to a borrower, who promises to repay later. Credit can help: a shoemaker buys leather on credit, makes shoes and repays. Or it can hurt: if crops fail, a farmer may fall into a debt trap and sell land to repay.'
      check:
        prompt: A farmer whose crop failed sells land to repay a loan. This is…
        options:
        - A debt trap
        - A good use of credit
        - Collateral
        answer: A debt trap
        why: Credit made them worse off.
    - teach: 'Terms of credit: interest rate, collateral (an asset like land, a house or a vehicle pledged as security), papers needed and how to repay. Formal sources (banks, cooperatives) are supervised by the RBI and usually charge less. Informal sources (moneylenders, traders, relatives) have no supervision and often charge very high interest.'
      picture:
        kind: compare
        columns:
        - title: Formal credit
          points:
          - Banks, cooperatives
          - RBI supervises
          - Lower interest
          - Needs collateral and papers
        - title: Informal credit
          points:
          - Moneylenders, traders
          - No supervision
          - High interest
          - Can trap borrowers
        alt: Formal credit from banks and cooperatives is supervised by the RBI, costs less but needs collateral and papers; informal credit from moneylenders and traders has no supervision, high interest and can trap borrowers.
      check:
        prompt: Which is a formal source of credit?
        options:
        - A cooperative society
        - A moneylender
        - A landlord
        answer: A cooperative society
        why: Registered and supervised.
    - teach: The poor depend more on informal credit because they lack collateral. Self-help groups (SHGs) of 15–20 women save regularly and lend to members at low interest; banks then lend to the group without collateral. The Grameen Bank of Bangladesh, founded by Professor Muhammad Yunus, made loans to poor women and won the Nobel Peace Prize in 2006.
      check:
        prompt: SHGs usually have how many members?
        options:
        - 15–20
        - 2–3
        - '500'
        answer: 15–20
        why: Mostly women from one area.
  items:
  - prompt: What is collateral?
    options:
    - An asset the borrower owns, used as a guarantee to the lender
    - The interest on a loan
    - A bank's building
    - A type of currency
    answer: An asset the borrower owns, used as a guarantee to the lender
    difficulty: 1
    hints:
    - Land, house, vehicle.
    - Lender can sell it if not repaid.
    solution: Collateral is an asset pledged as security until the loan is repaid.
    mistakes: {"The interest on a loan": "s10_collateral"}
  - prompt: A moneylender charges 5% interest per month on ₹10 000. How much interest is due each month, in rupees?
    answer: '500'
    check: 10000*Rational(5, 100)
    difficulty: 1
    hints:
    - 5% of 10 000.
    - 0.05 × 10 000.
    solution: 5% of ₹10 000 = ₹500 a month.
    mistakes: {"50": "s10_monthly_interest", "5000": "s10_monthly_interest"}
  - prompt: At 5% per month on ₹10 000, how much interest is paid in one year, in rupees (simple interest)?
    answer: '6000'
    check: 10000*Rational(5, 100)*12
    difficulty: 2
    hints:
    - ₹500 a month.
    - 12 months.
    solution: 'Step 1: ₹500 a month. Step 2: 500 × 12 = ₹6000 a year — 60% of the loan.'
    mistakes:
      '500': c10ss_monthly_yearly
  - prompt: Which is a formal source of credit?
    options:
    - Commercial bank
    - Moneylender
    - Trader
    - Relative
    answer: Commercial bank
    difficulty: 1
    hints:
    - Supervised by the RBI.
    - Registered.
    solution: Banks and cooperatives are formal sources.
    mistakes:
      Moneylender: c10ss_formal_informal
  - prompt: How do self-help groups help poor women?
    options:
    - They pool savings and give loans without collateral
    - They give free money
    - They charge very high interest
    - They work only in cities
    answer: They pool savings and give loans without collateral
    difficulty: 2
    hints:
    - 15–20 members.
    - Mostly women.
    solution: SHGs let members save regularly, borrow small amounts and later get bank loans without collateral.
    mistakes: {"They give free money": "s10_shg"}
  - prompt: Who founded the Grameen Bank of Bangladesh?
    options:
    - Muhammad Yunus
    - Amartya Sen
    - Raghuram Rajan
    - C. Rangarajan
    answer: Muhammad Yunus
    difficulty: 2
    hints:
    - Nobel Peace Prize, 2006.
    - Loans to poor women.
    solution: Muhammad Yunus founded the Grameen Bank and won the 2006 Nobel Peace Prize.
    mistakes: {"Amartya Sen": "s10_yunus"}
  - prompt: A farmer pledges her land to get a bank loan. What is the land called in this deal?
    options:
    - Collateral
    - Interest
    - A demand deposit
    - Legal tender
    answer: Collateral
    difficulty: 1
    hints:
    - The land works as a guarantee for the lender.
    - The lender can sell it if the loan is not repaid.
    solution: Collateral is an asset used as security for a loan.
    mistakes:
      Interest: c10ss20_pledge
  - prompt: A loan of ₹20 000 at 2% per month simple interest. How much interest is paid in one year, in rupees?
    answer: '4800'
    check: 20000 * 2 / 100 * 12
    difficulty: 2
    hints:
    - Monthly interest = 2% of 20 000.
    - Then for 12 months.
    solution: 'Monthly: ₹400. Yearly: 400 × 12 = ₹4800.'
    mistakes:
      '400': c10ss_monthly_yearly
      '480': c10ss20_interest
  - prompt: A bank charges 12% per year on a ₹5000 loan. What is the interest for one year, in rupees?
    answer: '600'
    check: 5000 * 12 / 100
    difficulty: 1
    hints:
    - Interest = principal × rate ÷ 100.
    - For one year.
    solution: 5000 × 12 ÷ 100 = ₹600.
    mistakes:
      '7200': c10ss20_interest
      '60': c10ss20_interest
  - prompt: Why do poor households depend on informal lenders?
    options:
    - They lack collateral and papers for bank loans
    - Moneylenders charge less
    - Banks don't exist in India
    - They prefer high interest
    answer: They lack collateral and papers for bank loans
    difficulty: 2
    hints:
    - What do banks ask for?
    - The poor often can't give it.
    solution: Without collateral and documents, the poor can't easily borrow from banks.
    mistakes:
      Moneylenders charge less: c10ss_formal_informal
  - prompt: Which is an informal source of credit?
    options:
    - A moneylender
    - A commercial bank
    - A cooperative society
    - A regional rural bank
    answer: A moneylender
    difficulty: 1
    hints:
    - No supervision by the RBI.
    - Often charges very high interest.
    solution: Moneylenders are informal lenders.
    mistakes:
      A cooperative society: c10ss_formal_informal
  - prompt: In which year did Muhammad Yunus and the Grameen Bank win the Nobel Peace Prize?
    answer: '2006'
    check: '2006'
    difficulty: 3
    hints:
    - Early in this century.
    - Mid-2000s.
    solution: They won the Nobel Peace Prize in 2006.
    mistakes:
      '1976': s10_yunus
  - prompt: Why should formal credit be spread more widely?
    options:
    - Cheap credit helps people earn more, and informal lenders charge too much
    - Banks have too much cash
    - Moneylenders are always fair
    - It is the law in all countries
    answer: Cheap credit helps people earn more, and informal lenders charge too much
    difficulty: 2
    hints:
    - High interest eats up income.
    - Cheaper loans help growth.
    solution: Affordable formal credit raises incomes and protects borrowers from exploitation.
    mistakes:
      Moneylenders are always fair: c10ss20_debt_trap
  - prompt: Which feature makes SHGs work for poor women?
    options:
    - Members save regularly and the group guarantees loans, so no collateral is needed
    - They charge very high interest
    - They need land papers
    - Only men can join
    answer: Members save regularly and the group guarantees loans, so no collateral is needed
    difficulty: 2
    hints:
    - The group itself is the security.
    - Small savings add up.
    solution: SHGs pool savings and stand guarantee, so banks lend without collateral.
    mistakes:
      They need land papers: s10_shg
  - prompt: Which of these is NOT a term of credit?
    options:
    - The colour of the bank
    - Interest rate
    - Collateral
    - Mode of repayment
    answer: The colour of the bank
    difficulty: 1
    hints:
    - Terms are the conditions of a loan.
    - Three options are real terms.
    solution: Interest, collateral, documents and repayment mode are terms of credit.
    mistakes:
      Collateral: c10ss20_terms
