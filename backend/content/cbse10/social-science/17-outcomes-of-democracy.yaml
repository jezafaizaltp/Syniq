# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 5.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 17
title: Outcomes of Democracy
tips:
  s10_complaints: "People complain when they expect more. What does that show about how they see democracy?"
  s10_dignity_freedom: "Democracies are not always the fastest growers. What do they do best?"
  s10_diversity: "Accommodating diversity means minorities are not shut out."
  s10_inequality: "Democracy gives equal votes, not equal incomes. Has inequality gone away?"
  s10_legitimate: "Legitimate means rightful. Where does a democracy's right to rule come from?"
  s10_slow_decisions: "More people are consulted. What does that take?"

concepts:
- code: cbse10ss.outcomes
  title: How democracy performs
  notes: |
    Democracy is better than other forms because it promotes equality, enhances dignity, improves decision
    making, resolves conflicts and allows correcting mistakes. Outcomes: an accountable, responsive and
    legitimate government (it may be slower, but decisions are more acceptable and transparent; people can
    check how decisions are made); economic growth and development (democracies and dictatorships show small
    differences in growth; development depends on many factors); reducing inequality and poverty (democracies
    have not always reduced economic inequality much); accommodation of social diversity (majority rule must
    work with the minority; rule by the majority community is not democracy); dignity and freedom of citizens
    (women's and dalits' struggles for equal status gained legitimacy). Expectations from democracy keep
    rising, and complaints themselves show that people value it.
  explanations:
    text: Democracy may be slower and messier than dictatorship, but its decisions are more transparent and legitimate, and it lets people correct mistakes. It doesn't automatically make a country richer or more equal, but it does protect dignity and give every group a voice.
    visual: 'Draw a report card for democracy: A for accountability and legitimacy, A for dignity and freedom, B for accommodating diversity, C for economic growth and reducing inequality.'
    step_by_step: 'Step 1: Pick an outcome: accountability, growth, inequality, diversity, dignity. Step 2: Say how democracy performs on it. Step 3: Compare with dictatorship. Step 4: Note what people still expect.'
    real_world: 'The Right to Information Act lets any Indian ask the government how decisions were made: transparency is one of democracy''s outcomes.'
  picture:
    kind: compare
    columns:
    - title: Democracy does well
      points:
      - Accountable, legitimate government
      - Transparent decisions
      - Dignity and freedom of citizens
      - Peaceful handling of differences
    - title: Mixed record
      points:
      - 'Economic growth: similar to others'
      - Inequality not much reduced
      - Some decisions are slow
    alt: 'Democracy''s report card: strong on accountability, transparency, dignity and handling differences; mixed on growth, inequality and speed.'
  activity:
    type: sort
    prompt: Has democracy done well on this, or not so well?
    bins:
    - Done well
    - Not so well
    items:
    - label: Accountable, legitimate government
      bin: Done well
      clue: People can check decisions.
      why: Democracy is better here.
    - label: Dignity of women and dalits
      bin: Done well
      clue: Their struggles gained legitimacy.
      why: Democracy helps.
    - label: Reducing economic inequality
      bin: Not so well
      clue: Do the poor gain much?
      why: Democracies have not reduced inequality much.
    - label: Speed of decisions
      bin: Not so well
      clue: Discussion takes time.
      why: It may be slower.
    - label: Accommodating social diversity
      bin: Done well
      clue: Majority working with minority.
      why: Done well, when it isn't majority-community rule.
  items:
  - prompt: Why is a democratic government called a legitimate government?
    options:
    - It is the people's own government, chosen by them
    - It never makes mistakes
    - It is always the richest
    - It is run by the army
    answer: It is the people's own government, chosen by them
    difficulty: 1
    hints:
    - Elected.
    - People accept it.
    solution: A democratic government is legitimate because people choose it and accept its authority.
    mistakes: {"It never makes mistakes": "s10_legitimate"}
  - prompt: Which outcome do democracies achieve best?
    options:
    - Dignity and freedom of the individual
    - The fastest economic growth always
    - Removing all poverty
    - Ending all disputes
    answer: Dignity and freedom of the individual
    difficulty: 2
    hints:
    - Growth is similar to dictatorships.
    - Women and dalits gained respect.
    solution: Democracy is clearly better at promoting dignity and freedom than other forms.
    mistakes: {"The fastest economic growth always": "s10_dignity_freedom"}
  - prompt: Why can decision making be slower in a democracy?
    options:
    - It involves discussion and negotiation
    - Leaders are lazy
    - There are no rules
    - Judges make all decisions
    answer: It involves discussion and negotiation
    difficulty: 1
    hints:
    - Deliberation takes time.
    - But decisions are more acceptable.
    solution: Democracies follow procedures, deliberation and negotiation, which take time but make decisions acceptable.
    mistakes: {"Leaders are lazy": "s10_slow_decisions"}
  - prompt: What does accommodating social diversity require in a democracy?
    options:
    - Majority working with minorities, and not ruling by one community alone
    - Rule by the largest religious group
    - Banning minority languages
    - Ignoring differences
    answer: Majority working with minorities, and not ruling by one community alone
    difficulty: 2
    hints:
    - Remember Belgium and Sri Lanka.
    - Every citizen should have a chance to be in the majority on some issue.
    solution: Democracy is not rule by the majority community; the majority must work with minorities.
    mistakes: {"Rule by the largest religious group": "s10_diversity"}
  - prompt: Has democracy always reduced economic inequality?
    options:
    - No, inequalities have often remained large
    - Yes, it has removed all inequality
    - Inequality has always increased in dictatorships only
    - Democracy has nothing to do with the economy
    answer: No, inequalities have often remained large
    difficulty: 2
    hints:
    - The rich share remains high in many democracies.
    - Poor voters remain poor.
    solution: Economic inequality has not reduced much in many democracies.
    mistakes: {"Yes, it has removed all inequality": "s10_inequality"}
  - prompt: What does a growing list of complaints about democracy show?
    options:
    - People expect more from democracy and value it
    - Democracy has failed completely
    - People want dictatorship
    - Complaints are illegal
    answer: People expect more from democracy and value it
    difficulty: 2
    hints:
    - Citizens feel they can complain.
    - Rising expectations.
    solution: 'Complaints show that people have become more aware and expect more: a sign of democracy''s success.'
    mistakes: {"Democracy has failed completely": "s10_complaints"}
