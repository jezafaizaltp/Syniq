# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 5.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 17
title: Outcomes of Democracy
tips:
  s10_complaints: "People complain when they expect more. What does that show about how they see democracy?"
  s10_dignity_freedom: "Democracies are not always the fastest growers. What do they do best?"
  s10_diversity: "Accommodating diversity means minorities are not shut out."
  s10_inequality: "Democracy gives equal votes, not equal incomes. Has inequality gone away?"
  s10_legitimate: "Legitimate means rightful. Where does a democracy's right to rule come from?"
  s10_slow_decisions: "More people are consulted. What does that take?"
  c10ss17_accountable: 'Democracy is about government that is accountable, responsive and legitimate: it answers to the people and is chosen by them.'
  c10ss17_economic: On economic growth, democracies and dictatorships show only small differences. Democracy's strength lies elsewhere.
  c10ss17_dignity: 'Democracy gives dignity and freedom: equal treatment of women and of disadvantaged castes is accepted in principle and fought for in practice.'
  c10ss17_transparency: 'In a democracy citizens can check how decisions are made: this is transparency, backed by tools like the Right to Information.'

concepts:
- code: cbse10ss.outcomes
  title: How democracy performs
  notes: |
    Democracy is better than other forms because it promotes equality, enhances dignity, improves decision
    making, resolves conflicts and allows correcting mistakes. Outcomes: an accountable, responsive and
    legitimate government (it may be slower, but decisions are more acceptable and transparent; people can
    check how decisions are made); economic growth and development (democracies and dictatorships show small
    differences in growth; development depends on many factors); reducing inequality and poverty (democracies
    have not always reduced economic inequality much); accommodation of social diversity (majority rule must
    work with the minority; rule by the majority community is not democracy); dignity and freedom of citizens
    (women's and dalits' struggles for equal status gained legitimacy). Expectations from democracy keep
    rising, and complaints themselves show that people value it.
  explanations:
    text: Democracy may be slower and messier than dictatorship, but its decisions are more transparent and legitimate, and it lets people correct mistakes. It doesn't automatically make a country richer or more equal, but it does protect dignity and give every group a voice.
    visual: 'Draw a report card for democracy: A for accountability and legitimacy, A for dignity and freedom, B for accommodating diversity, C for economic growth and reducing inequality.'
    step_by_step: 'Step 1: Pick an outcome: accountability, growth, inequality, diversity, dignity. Step 2: Say how democracy performs on it. Step 3: Compare with dictatorship. Step 4: Note what people still expect.'
    real_world: 'The Right to Information Act lets any Indian ask the government how decisions were made: transparency is one of democracy''s outcomes.'
  picture:
    kind: compare
    columns:
    - title: Democracy does well
      points:
      - Accountable, legitimate government
      - Transparent decisions
      - Dignity and freedom of citizens
      - Peaceful handling of differences
    - title: Mixed record
      points:
      - 'Economic growth: similar to others'
      - Inequality not much reduced
      - Some decisions are slow
    alt: 'Democracy''s report card: strong on accountability, transparency, dignity and handling differences; mixed on growth, inequality and speed.'
  activity:
    type: sort
    prompt: Has democracy done well on this, or not so well?
    bins:
    - Done well
    - Not so well
    items:
    - label: Accountable, legitimate government
      bin: Done well
      clue: People can check decisions.
      why: Democracy is better here.
    - label: Dignity of women and dalits
      bin: Done well
      clue: Their struggles gained legitimacy.
      why: Democracy helps.
    - label: Reducing economic inequality
      bin: Not so well
      clue: Do the poor gain much?
      why: Democracies have not reduced inequality much.
    - label: Speed of decisions
      bin: Not so well
      clue: Discussion takes time.
      why: It may be slower.
    - label: Accommodating social diversity
      bin: Done well
      clue: Majority working with minority.
      why: Done well, when it isn't majority-community rule.
  lesson:
    - teach: Democracy produces a government that is accountable (answers to the people), responsive (cares about their needs) and legitimate (chosen by them). It may be slower because it consults people, but its decisions are more acceptable. Transparency lets citizens check whether decisions followed proper procedures.
      check:
        prompt: Why may democratic decisions take longer?
        options:
        - Many people are consulted
        - Leaders are lazy
        - There are no rules
        answer: Many people are consulted
        why: Deliberation takes time.
    - teach: 'On economic growth, dictatorships have a slightly higher rate on average, but the difference is small, and growth depends on many factors. Democracy hasn''t removed poverty and inequality: the richest earn far more than the poorest. Yet democracy is the best at accommodating social diversity and giving dignity and freedom.'
      picture:
        kind: compare
        columns:
        - title: Democracy does well
          points:
          - Accountable, legitimate government
          - Dignity and freedom
          - Accommodating diversity
        - title: Mixed record
          points:
          - Economic growth
          - Reducing inequality
          - Ending poverty
        alt: Democracy does well at accountable, legitimate government, dignity and freedom, and accommodating diversity; its record is mixed on economic growth, reducing inequality and ending poverty.
      check:
        prompt: Which does democracy do best?
        options:
        - Give dignity and freedom
        - Guarantee fast growth
        - End all poverty
        answer: Give dignity and freedom
        why: That is its strongest outcome.
    - teach: 'Democracy accommodates diversity when the majority works with minorities and when rule by majority doesn''t become rule by one religious or language group. Women''s and disadvantaged castes'' demands for equal treatment have gained strength. The fact that people complain more about democracy is itself a sign of its success: people expect more.'
      check:
        prompt: People complaining about democracy shows…
        options:
        - They have become aware and expect more
        - Democracy has failed
        - Dictatorship is better
        answer: They have become aware and expect more
        why: Rising expectations.
  items:
  - prompt: Why is a democratic government called a legitimate government?
    options:
    - It is the people's own government, chosen by them
    - It never makes mistakes
    - It is always the richest
    - It is run by the army
    answer: It is the people's own government, chosen by them
    difficulty: 1
    hints:
    - Elected.
    - People accept it.
    solution: A democratic government is legitimate because people choose it and accept its authority.
    mistakes: {"It never makes mistakes": "s10_legitimate"}
  - prompt: Which outcome do democracies achieve best?
    options:
    - Dignity and freedom of the individual
    - The fastest economic growth always
    - Removing all poverty
    - Ending all disputes
    answer: Dignity and freedom of the individual
    difficulty: 2
    hints:
    - Growth is similar to dictatorships.
    - Women and dalits gained respect.
    solution: Democracy is clearly better at promoting dignity and freedom than other forms.
    mistakes: {"The fastest economic growth always": "s10_dignity_freedom"}
  - prompt: Why can decision making be slower in a democracy?
    options:
    - It involves discussion and negotiation
    - Leaders are lazy
    - There are no rules
    - Judges make all decisions
    answer: It involves discussion and negotiation
    difficulty: 1
    hints:
    - Deliberation takes time.
    - But decisions are more acceptable.
    solution: Democracies follow procedures, deliberation and negotiation, which take time but make decisions acceptable.
    mistakes: {"Leaders are lazy": "s10_slow_decisions"}
  - prompt: What does accommodating social diversity require in a democracy?
    options:
    - Majority working with minorities, and not ruling by one community alone
    - Rule by the largest religious group
    - Banning minority languages
    - Ignoring differences
    answer: Majority working with minorities, and not ruling by one community alone
    difficulty: 2
    hints:
    - Remember Belgium and Sri Lanka.
    - Every citizen should have a chance to be in the majority on some issue.
    solution: Democracy is not rule by the majority community; the majority must work with minorities.
    mistakes: {"Rule by the largest religious group": "s10_diversity"}
  - prompt: Has democracy always reduced economic inequality?
    options:
    - No, inequalities have often remained large
    - Yes, it has removed all inequality
    - Inequality has always increased in dictatorships only
    - Democracy has nothing to do with the economy
    answer: No, inequalities have often remained large
    difficulty: 2
    hints:
    - The rich share remains high in many democracies.
    - Poor voters remain poor.
    solution: Economic inequality has not reduced much in many democracies.
    mistakes: {"Yes, it has removed all inequality": "s10_inequality"}
  - prompt: What does a growing list of complaints about democracy show?
    options:
    - People expect more from democracy and value it
    - Democracy has failed completely
    - People want dictatorship
    - Complaints are illegal
    answer: People expect more from democracy and value it
    difficulty: 2
    hints:
    - Citizens feel they can complain.
    - Rising expectations.
    solution: 'Complaints show that people have become more aware and expect more: a sign of democracy''s success.'
    mistakes: {"Democracy has failed completely": "s10_complaints"}
  - prompt: What does it mean that a democratic government is 'accountable'?
    options:
    - It must answer to the people
    - It never changes
    - It decides alone
    - It is run by judges
    answer: It must answer to the people
    difficulty: 1
    hints:
    - Citizens can question it.
    - And vote it out.
    solution: An accountable government answers to citizens for its decisions.
    mistakes:
      It decides alone: c10ss17_accountable
  - prompt: What is 'transparency' in a democracy?
    options:
    - Citizens can find out how decisions were made
    - Government meetings are secret
    - Only ministers know the rules
    - Elections are held in secret buildings
    answer: Citizens can find out how decisions were made
    difficulty: 2
    hints:
    - Openness.
    - Like the Right to Information.
    solution: Transparency means citizens can examine the process of decision-making.
    mistakes:
      Government meetings are secret: c10ss17_transparency
  - prompt: Compared with dictatorships, how do democracies do on economic growth?
    options:
    - Only slightly lower on average; the difference is small
    - Always much higher
    - Always much lower
    - There is no growth in democracies
    answer: Only slightly lower on average; the difference is small
    difficulty: 3
    hints:
    - Growth depends on many things.
    - Studies show a small gap.
    solution: Dictatorships have a slightly higher average growth, but the difference is negligible.
    mistakes:
      Always much higher: c10ss17_economic
  - prompt: Has democracy ended poverty in countries like India and Bangladesh?
    options:
    - No, many people still live in poverty
    - Yes, completely
    - Poverty has grown everywhere
    - Democracy causes poverty
    answer: No, many people still live in poverty
    difficulty: 2
    hints:
    - Inequality persists.
    - Voters' needs are not always met.
    solution: Democracies have not ended poverty, though they can respond to people's demands.
    mistakes:
      Yes, completely: s10_inequality
  - prompt: Why is democracy better at handling social differences?
    options:
    - It lets groups negotiate peacefully and protects minorities
    - It bans minority groups
    - It always follows the largest group
    - It removes all differences
    answer: It lets groups negotiate peacefully and protects minorities
    difficulty: 2
    hints:
    - Majority rule must not mean one group always wins.
    - Different groups get a voice.
    solution: Democracy develops ways to handle conflict and include minorities.
    mistakes:
      It always follows the largest group: s10_diversity
  - prompt: How has democracy helped women in India?
    options:
    - Their claim to equal respect and treatment is accepted and gets legal and moral support
    - Women can no longer vote
    - Women's issues are ignored
    - It gave women all the seats
    answer: Their claim to equal respect and treatment is accepted and gets legal and moral support
    difficulty: 2
    hints:
    - Unequal treatment is now seen as wrong.
    - Laws back them.
    solution: Democracy makes equal dignity a recognised claim with legal backing.
    mistakes:
      Women's issues are ignored: c10ss17_dignity
  - prompt: Why is a democratic government called 'responsive'?
    options:
    - It tries to meet people's needs and expectations
    - It responds only to the army
    - It never listens
    - It decides by lottery
    answer: It tries to meet people's needs and expectations
    difficulty: 1
    hints:
    - It must listen.
    - Or it may lose the next election.
    solution: A responsive government cares about and acts on people's needs.
    mistakes:
      It never listens: c10ss17_accountable
  - prompt: Which of these is an example of democracy's slow but acceptable decision-making?
    options:
    - A law debated in Parliament and committees before passing
    - A ruler's sudden order
    - A secret decree
    - An army takeover
    answer: A law debated in Parliament and committees before passing
    difficulty: 2
    hints:
    - Many people are consulted.
    - Takes time but gains acceptance.
    solution: Debate and consultation make decisions slower but more acceptable.
    mistakes:
      A ruler's sudden order: s10_slow_decisions
  - prompt: In which way are dalits and disadvantaged castes better placed in a democracy?
    options:
    - They can demand equal status and use their votes
    - They have no voting rights
    - They are kept out of politics
    - They must obey upper castes
    answer: They can demand equal status and use their votes
    difficulty: 2
    hints:
    - Equal vote for all.
    - Their claims gain legitimacy.
    solution: Democracy strengthens their claims to equal status and gives them political power through votes.
    mistakes:
      They have no voting rights: c10ss17_dignity
