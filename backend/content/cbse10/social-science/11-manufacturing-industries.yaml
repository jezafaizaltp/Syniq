# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 6.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 11
title: Manufacturing Industries
tips:
  c10ss_agro_mineral: Agro-based industries use farm produce like cotton; mineral-based ones use ores like iron.
  s10_basic_industry: "Machines, cars and buildings all need steel. What does 'basic' mean here?"
  s10_bengaluru: "Mumbai is the financial capital. Which southern city is home to most of India's big software and electronics firms?"
  s10_coop: "A cooperative is owned by its members. Who supplies sugarcane to the mill?"
  s10_hugli: "Jute grows in West Bengal. Which river do the mills line?"
  s10_location: "Industries need raw material, power and markets. Which choice does not matter?"
  s10_mfg_gdp: "Manufacturing's share has stayed below a fifth of GDP for years."
  s10_precipitator: "A silencer cuts noise. Which device catches dust from smoke?"
  s10_sail: "SAIL is run by the government. Which sector is that?"
  s10_sugar_south: "Sugarcane in the south and west yields more sugar and is harvested longer."
  s10_textile: "Most industries depend on others for some stage. Which one handles every step, from fibre to yarn to cloth to clothes, inside India?"
  s10_thermal: "Hot water heats rivers. Which pollution is about heat?"
  c10ss11_sector: "Look at who owns it: only the government, only private people, the producers of the raw material, or two kinds of owners together?"
  c10ss11_scale: Large-scale or small-scale depends on the money invested, not on the number of products.
  c10ss11_weight: "Heavy industries use bulky raw materials and make bulky goods. Which option uses light materials and makes small, light products?"
  c10ss11_pollution: 'There are four kinds of industrial pollution: air, water, thermal and noise. Which is this example?'
  c10ss11_control: 'Ways to cut pollution: treat waste water, use electrostatic precipitators and scrubbers for smoke, rainwater harvesting, and machines fitted with silencers.'
  c10ss11_steel_place: "Steel is mostly iron. Which raw material must be needed in the largest amount, and where does it go in the ratio?"
concepts:
- code: cbse10ss.industry.types
  title: Why manufacturing matters and how industries are classified
  notes: |
    Manufacturing turns raw materials into more valuable products. It modernises agriculture, reduces
    dependence on farming, brings jobs, earns foreign exchange and helps reduce regional inequality. Its share
    in India's GDP has stayed around 17% for a decade (the National Manufacturing Competitiveness Council set
    up in 2004 aims to raise growth). Location depends on raw material, labour, capital, power, market,
    transport and government policy; cities that offer these attract industries (agglomeration economies).
    Classification: by source of raw material (agro-based: cotton, jute, sugar; mineral-based: iron and steel,
    cement), by role (basic or key industries like iron and steel; consumer industries like sugar, toothpaste),
    by capital (small-scale or large-scale), by ownership (public: BHEL, SAIL; private: TISCO, Dabur;
    joint: Oil India Ltd; cooperative: sugar in Maharashtra, coir in Kerala), by bulk (heavy and light).
  explanations:
    text: 'Manufacturing makes raw materials more useful and valuable: cotton into cloth, iron ore into steel. Industries are sorted by what they use, who owns them, how big they are, and whether they make goods for other industries or for us to buy.'
    visual: 'Draw a sorting tree from ''Industry'' with branches: raw material (agro or mineral), ownership (public, private, joint, cooperative), role (basic or consumer), size (small or large).'
    step_by_step: 'Step 1: Ask what it uses: farm produce or minerals. Step 2: Ask who owns it. Step 3: Ask whether its products feed other industries (basic) or go to people (consumer). Step 4: Ask about capital: small or large scale.'
    real_world: 'Amul is a cooperative: lakhs of dairy farmers in Gujarat jointly own it and share its profits.'
  picture:
    kind: compare
    columns:
    - title: By raw material
      points:
      - 'Agro-based: cotton, jute, sugar'
      - 'Mineral-based: iron and steel, cement'
    - title: By ownership
      points:
      - 'Public: SAIL, BHEL'
      - 'Private: TISCO, Dabur'
      - 'Joint: Oil India Ltd'
      - 'Cooperative: sugar mills, Amul'
    alt: Classifying industries by raw material (agro-based or mineral-based) and by ownership (public, private, joint and cooperative).
  activity:
    type: sort
    prompt: Who owns the industry?
    bins:
    - Public sector
    - Private sector
    - Joint sector
    - Cooperative sector
    items:
    - label: BHEL
      bin: Public sector
      clue: Owned by the government.
      why: Public.
    - label: SAIL
      bin: Public sector
      clue: Steel Authority of India.
      why: Public.
    - label: TISCO
      bin: Private sector
      clue: Owned by a company.
      why: Private.
    - label: Dabur
      bin: Private sector
      clue: A private company.
      why: Private.
    - label: Oil India Ltd
      bin: Joint sector
      clue: Government and private together.
      why: Joint.
    - label: Sugar mills in Maharashtra owned by farmers
      bin: Cooperative sector
      clue: Owned by producers together.
      why: Cooperative.
    - label: Coir industry in Kerala
      bin: Cooperative sector
      clue: Run by workers' groups.
      why: Cooperative.
  lesson:
    - teach: 'Manufacturing turns raw materials into more valuable goods. It is the backbone of development: it creates jobs, reduces dependence on farming, earns foreign exchange and helps agriculture by making its tools. Industry and agriculture depend on each other.'
      check:
        prompt: Which is a reason manufacturing matters?
        options:
        - It creates jobs and adds value
        - It needs no raw materials
        - It replaces all farming
        answer: It creates jobs and adds value
        why: Raw materials become more valuable goods.
    - teach: Industries are classified by raw material (agro-based like cotton, sugar; mineral-based like iron and steel), by role (basic industries that supply others, consumer industries that make goods for people), by capital (small-scale, large-scale), by ownership (public, private, joint, cooperative) and by bulk (heavy, light).
      picture:
        kind: compare
        columns:
        - title: By raw material
          points:
          - 'Agro-based: cotton, sugar, jute'
          - 'Mineral-based: iron and steel, cement'
        - title: By ownership
          points:
          - 'Public: SAIL'
          - 'Private: TISCO'
          - 'Joint: Oil India'
          - 'Cooperative: sugar mills'
        alt: Industries classed by raw material (agro-based like cotton, sugar and jute; mineral-based like iron and steel and cement) and by ownership (public like SAIL, private like TISCO, joint like Oil India, cooperative like sugar mills).
      check:
        prompt: A sugar mill owned by sugarcane farmers is…
        options:
        - Cooperative
        - Public sector
        - Joint sector
        answer: Cooperative
        why: Owned by the raw material producers.
    - teach: Where industries come up depends on raw material, labour, capital, power, markets, water and transport. Cities grow because industries gather there (agglomeration economies). Manufacturing's share of GDP has stayed around 17%; the National Manufacturing Competitiveness Council aims to raise it.
      check:
        prompt: Industries gathering in a city to share services is called…
        options:
        - Agglomeration economies
        - Decentralisation
        - Deforestation
        answer: Agglomeration economies
        why: They benefit from being close together.
  items:
  - prompt: Which is an agro-based industry?
    options:
    - Cotton textiles
    - Iron and steel
    - Cement
    - Aluminium smelting
    answer: Cotton textiles
    difficulty: 1
    hints:
    - It uses a farm product.
    - Cotton is grown.
    solution: Cotton textiles use raw cotton from farms.
    mistakes:
      Iron and steel: c10ss_agro_mineral
  - prompt: 'Steel Authority of India Ltd (SAIL) is an example of a:'
    options:
    - Public sector industry
    - Private sector industry
    - Cooperative industry
    - Joint sector industry
    answer: Public sector industry
    difficulty: 1
    hints:
    - Owned by the government.
    - TISCO is private.
    solution: 'SAIL is owned and run by the government: public sector.'
    mistakes: {"Private sector industry": "s10_sail"}
  - prompt: 'Cooperative sugar mills in Maharashtra are owned by:'
    options:
    - The producers or suppliers of raw material
    - The government only
    - A single family
    - Foreign companies
    answer: The producers or suppliers of raw material
    difficulty: 2
    hints:
    - Farmers pool resources.
    - Profits shared.
    solution: Cooperative industries are owned and run by the producers of raw materials, like sugarcane farmers.
    mistakes: {"The government only": "s10_coop"}
  - prompt: Why is iron and steel called a basic industry?
    options:
    - Other industries depend on its products
    - It is small and simple
    - It makes only consumer goods
    - It needs no raw materials
    answer: Other industries depend on its products
    difficulty: 2
    hints:
    - Machines, tools, buildings.
    - Key industry.
    solution: Basic industries supply products that other industries use to make goods.
    mistakes: {"It is small and simple": "s10_basic_industry"}
  - prompt: Manufacturing's share in India's GDP has stayed around what percentage?
    answer: '17'
    check: '17'
    difficulty: 2
    hints:
    - Under one fifth.
    - Stagnant for a decade.
    solution: Manufacturing has contributed about 17% of GDP.
    mistakes: {"50": "s10_mfg_gdp", "25": "s10_mfg_gdp"}
  - prompt: Which factor does NOT usually decide where an industry is located?
    options:
    - The colour of the factory
    - Raw material
    - Power supply
    - Market
    answer: The colour of the factory
    difficulty: 1
    hints:
    - Think of costs.
    - Raw material, labour, power, market, transport.
    solution: Location depends on raw materials, labour, capital, power, market and transport, not appearance.
    mistakes: {"Market": "s10_location", "Power supply": "s10_location"}
  - prompt: Oil India Ltd, owned by the government and private firms together, is a … industry.
    options:
    - Joint sector
    - Public sector
    - Private sector
    - Cooperative
    answer: Joint sector
    difficulty: 2
    hints:
    - Two kinds of owners.
    - Government and private share it.
    solution: Shared ownership by state and private firms is the joint sector.
    mistakes:
      Public sector: c10ss11_sector
  - prompt: Which is a mineral-based industry?
    options:
    - Cement
    - Sugar
    - Cotton textiles
    - Edible oil
    answer: Cement
    difficulty: 1
    hints:
    - Its raw material is dug from the ground.
    - Limestone.
    solution: Cement uses limestone, a mineral.
    mistakes:
      Sugar: c10ss_agro_mineral
  - prompt: Industries that make goods for people to use directly, like toothpaste and TVs, are…
    options:
    - Consumer industries
    - Basic industries
    - Heavy industries
    - Joint sector industries
    answer: Consumer industries
    difficulty: 2
    hints:
    - Basic industries supply other industries.
    - These sell to us.
    solution: Consumer industries make goods for direct use by consumers.
    mistakes:
      Basic industries: s10_basic_industry
  - prompt: What decides whether an industry is small-scale or large-scale?
    options:
    - The amount of capital invested
    - The number of products
    - The colour of goods
    - The owner's age
    answer: The amount of capital invested
    difficulty: 2
    hints:
    - Think about money put into it.
    - A legal limit on investment is set.
    solution: Industries are classed by the maximum investment allowed for small-scale units.
    mistakes:
      The number of products: c10ss11_scale
  - prompt: Which is a light industry?
    options:
    - Electrical goods
    - Iron and steel
    - Shipbuilding
    - Heavy machinery
    answer: Electrical goods
    difficulty: 2
    hints:
    - Light raw materials and light products.
    - Three options are bulky.
    solution: Electrical goods use light materials and make light goods.
    mistakes:
      Iron and steel: c10ss11_weight
  - prompt: How does industry help agriculture?
    options:
    - It makes tools, fertilisers and pumps for farmers
    - It takes away farmland only
    - It has no link to farming
    - It stops farmers from selling
    answer: It makes tools, fertilisers and pumps for farmers
    difficulty: 1
    hints:
    - Farmers buy many factory goods.
    - Think of irrigation and fertiliser.
    solution: Industries supply irrigation pumps, fertilisers, pesticides and machines that raise farm output.
    mistakes:
      It has no link to farming: c10ss_agro_mineral
  - prompt: Which body was set up to improve manufacturing growth in India?
    options:
    - National Manufacturing Competitiveness Council
    - Reserve Bank of India
    - Election Commission
    - UNEP
    answer: National Manufacturing Competitiveness Council
    difficulty: 3
    hints:
    - Its name contains 'manufacturing'.
    - It was set up by the government.
    solution: The NMCC was set up to raise manufacturing's growth.
    mistakes:
      Reserve Bank of India: s10_mfg_gdp
  - prompt: Why do industries often come up near big cities?
    options:
    - Cities offer markets, banks, transport and workers
    - Cities have more forests
    - Land is free in cities
    - Cities have no rules
    answer: Cities offer markets, banks, transport and workers
    difficulty: 2
    hints:
    - Think of agglomeration economies.
    - What does a factory need?
    solution: Cities provide markets, services like banking and insurance, transport and labour.
    mistakes:
      Land is free in cities: s10_location
  - prompt: About what percentage of India's GDP comes from manufacturing?
    answer: '17'
    check: '17'
    difficulty: 3
    hints:
    - It has stayed below a fifth for years.
    - A number in the high teens.
    solution: Manufacturing's share of GDP has stayed around 17%.
    mistakes:
      '50': s10_mfg_gdp
      '25': s10_mfg_gdp
- code: cbse10ss.industry.pollution
  title: Major industries and pollution
  after:
  - cbse10ss.industry.types
  notes: |
    Textiles: the only industry in India self-reliant and complete in the chain from raw material to final
    product. Early cotton mills in Mumbai (1854); cotton mills cluster in Maharashtra, Gujarat and Tamil Nadu.
    Jute mills are mostly along the Hugli river in West Bengal (India is the largest producer of raw jute).
    Sugar mills have moved south (Maharashtra, Karnataka, Tamil Nadu) where sucrose content is higher. Iron and
    steel is a heavy basic industry; India is a major crude steel producer; plants are concentrated in the
    Chhotanagpur plateau region (Jamshedpur, Bokaro, Bhilai, Durgapur, Rourkela). Aluminium smelting is the
    second most important metallurgical industry. Chemical, fertiliser, cement, automobile, IT and electronics
    (Bengaluru is the electronic capital) industries. Pollution: air (smoke, dust), water (industrial effluents,
    hot water from power plants — thermal pollution), land and noise. Control: treating effluents in three
    stages (primary, secondary, tertiary), electrostatic precipitators, fabric filters, scrubbers, rainwater
    harvesting, using natural gas.
  explanations:
    text: 'Textiles, steel, aluminium, cement and electronics are some of India''s main industries, each located near what it needs: raw material, power or skilled workers. Industries also pollute air, water, land and our ears, so effluents must be treated and smoke filtered.'
    visual: 'Draw a factory with three outlets: a chimney with a filter (air), a pipe to a three-stage treatment tank before a river (water), and a fence of trees (noise and dust).'
    step_by_step: 'Step 1: Name the industry and its location. Step 2: Explain why it is there: raw material, power, labour, market. Step 3: Name the pollution it causes. Step 4: Name a way to control it.'
    real_world: Bengaluru became India's electronics and software capital because of its skilled graduates, pleasant climate and early research institutes.
  picture:
    kind: compare
    columns:
    - title: Pollution
      points:
      - 'Air: smoke, dust, gases'
      - 'Water: effluents, hot water'
      - 'Land: dumped waste'
      - 'Noise: machines'
    - title: Control
      points:
      - Electrostatic precipitators, scrubbers
      - Treat effluents in three stages
      - Reuse and recycle waste
      - Silencers, tree belts
    alt: 'Kinds of industrial pollution (air, water, land, noise) and how to control each: filters, effluent treatment, recycling and silencers.'
  activity:
    type: sort
    prompt: Which kind of pollution?
    bins:
    - Air
    - Water
    - Thermal
    - Noise
    items:
    - label: Smoke from a steel plant
      bin: Air
      clue: Goes up a chimney.
      why: Air pollution.
    - label: Factory effluents in a river
      bin: Water
      clue: Chemicals in the river.
      why: Water pollution.
    - label: Hot water from a power plant into a lake
      bin: Thermal
      clue: The water is warm.
      why: Thermal pollution.
    - label: Machines in a factory all day
      bin: Noise
      clue: Heard, not seen.
      why: Noise.
    - label: Dust from a cement factory
      bin: Air
      clue: In the breath.
      why: Air.
    - label: Dyes from a textile unit in a stream
      bin: Water
      clue: Coloured stream.
      why: Water.
  lesson:
    - teach: Cotton textiles are India's only self-reliant industry from raw material to finished product; early mills were in Mumbai (cotton-growing Maharashtra and Gujarat nearby). Jute mills line the Hugli river in West Bengal. Sugar mills have moved south and west where cane is sweeter and the season longer.
      check:
        prompt: Most jute mills are along the…
        options:
        - Hugli
        - Narmada
        - Godavari
        answer: Hugli
        why: Near the jute-growing delta.
    - teach: 'Iron and steel is a basic, heavy industry. It needs iron ore, coking coal and limestone (about 4 : 2 : 1), mostly found on the Chotanagpur plateau, so many plants are there. Other industries: aluminium smelting (needs bauxite and lots of cheap power), chemicals, fertilisers, cement, cars, and IT and electronics (Bengaluru is the electronic capital).'
      picture:
        kind: bars
        unit: parts of raw material
        bars:
        - label: iron ore
          value: 4
        - label: coking coal
          value: 2
        - label: limestone
          value: 1
        alt: Raw materials for steel in the ratio of about 4 parts iron ore to 2 parts coking coal to 1 part limestone.
      check:
        prompt: Which region has most iron and steel plants?
        options:
        - Chotanagpur plateau
        - Thar desert
        - Kashmir valley
        answer: Chotanagpur plateau
        why: Raw materials are close.
    - teach: 'Industries pollute air (smoke, dust, gases), water (chemical waste, dyes), land (dumping) and cause thermal pollution (hot water) and noise. Control: treat waste water before release, use electrostatic precipitators, scrubbers and fabric filters, harvest rain, and fit machines with silencers. NTPC is an example of a company that cares for the environment.'
      check:
        prompt: Hot water from a power plant in a river is…
        options:
        - Thermal pollution
        - Noise pollution
        - Air pollution
        answer: Thermal pollution
        why: It changes the water's temperature.
  items:
  - prompt: Which Indian industry is self-reliant and complete from raw material to the highest value product?
    options:
    - Textile industry
    - Automobile industry
    - Aluminium industry
    - IT industry
    answer: Textile industry
    difficulty: 2
    hints:
    - From fibre to finished garments.
    - One of the oldest.
    solution: The textile industry covers the whole chain from raw fibre to finished garments.
    mistakes: {"IT industry": "s10_textile", "Automobile industry": "s10_textile"}
  - prompt: 'Most jute mills in India are located along the:'
    options:
    - Hugli river in West Bengal
    - Narmada river
    - Coast of Kerala
    - Yamuna in Delhi
    answer: Hugli river in West Bengal
    difficulty: 1
    hints:
    - Near jute-growing areas.
    - Kolkata port.
    solution: Jute mills cluster along the Hugli because of nearby jute fields, water and cheap transport.
    mistakes: {"Coast of Kerala": "s10_hugli"}
  - prompt: Why have sugar mills shifted to southern and western states?
    options:
    - Sugarcane there has higher sucrose content and the season is longer
    - There is no sugarcane in the north
    - Southern states banned other crops
    - Labour is free there
    answer: Sugarcane there has higher sucrose content and the season is longer
    difficulty: 2
    hints:
    - Climate matters.
    - Cooperatives also do well.
    solution: Cane in the peninsula has more sucrose and a longer crushing season.
    mistakes: {"There is no sugarcane in the north": "s10_sugar_south"}
  - prompt: Which city is called the electronic capital of India?
    options:
    - Bengaluru
    - Mumbai
    - Kolkata
    - Chennai
    answer: Bengaluru
    difficulty: 1
    hints:
    - IT hub.
    - Karnataka.
    solution: Bengaluru is known as India's electronic capital.
    mistakes: {"Mumbai": "s10_bengaluru"}
  - prompt: 'Hot water released from power plants into rivers causes:'
    options:
    - Thermal pollution
    - Noise pollution
    - Air pollution
    - No pollution
    answer: Thermal pollution
    difficulty: 2
    hints:
    - It raises water temperature.
    - Harms aquatic life.
    solution: Hot water discharge causes thermal pollution, harming fish and plants.
    mistakes: {"Air pollution": "s10_thermal"}
  - prompt: Which device removes particles from factory smoke?
    options:
    - Electrostatic precipitator
    - Silencer
    - Rain gauge
    - Generator
    answer: Electrostatic precipitator
    difficulty: 2
    hints:
    - Uses electric charge.
    - Air pollution control.
    solution: Electrostatic precipitators remove particles from smoke.
    mistakes: {"Silencer": "s10_precipitator"}
  - prompt: Which industry needs a huge amount of cheap electricity, as well as bauxite?
    options:
    - Aluminium smelting
    - Cotton textiles
    - Jute
    - Software
    answer: Aluminium smelting
    difficulty: 2
    hints:
    - Bauxite is its ore.
    - Smelting takes a lot of power.
    solution: Aluminium smelting needs bauxite and regular cheap power.
    mistakes:
      Cotton textiles: s10_textile
  - prompt: Steel plants need iron ore, coking coal and limestone in the ratio…
    options:
    - '4 : 2 : 1'
    - '1 : 1 : 1'
    - '1 : 2 : 4'
    - '2 : 1 : 4'
    answer: '4 : 2 : 1'
    difficulty: 3
    hints:
    - Iron ore is needed most.
    - Limestone least.
    solution: Roughly 4 parts iron ore, 2 parts coking coal, 1 part limestone.
    mistakes:
      '1 : 2 : 4': c10ss11_steel_place
  - prompt: Why are many iron and steel plants on the Chotanagpur plateau?
    options:
    - Iron ore, coal and limestone are found nearby
    - It has the most rain
    - It is near the sea
    - It has no people
    answer: Iron ore, coal and limestone are found nearby
    difficulty: 2
    hints:
    - Steel needs heavy raw materials.
    - Carrying them far is costly.
    solution: The plateau has the raw materials, cheap labour and markets close together.
    mistakes:
      It is near the sea: c10ss11_steel_place
  - prompt: Which device removes dust from factory smoke?
    options:
    - Electrostatic precipitator
    - Silencer
    - Thermometer
    - Barometer
    answer: Electrostatic precipitator
    difficulty: 2
    hints:
    - Silencers cut noise.
    - This one uses electric charge to catch particles.
    solution: Electrostatic precipitators trap particulate matter in smoke.
    mistakes:
      Silencer: s10_precipitator
  - prompt: Untreated dye waste from textile mills poured into a river causes…
    options:
    - Water pollution
    - Noise pollution
    - Thermal pollution only
    - No pollution
    answer: Water pollution
    difficulty: 1
    hints:
    - The waste enters the river.
    - It harms fish and people.
    solution: 'Dyes and chemicals make the river polluted: water pollution.'
    mistakes:
      Noise pollution: c10ss11_pollution
  - prompt: Which state has the largest number of cotton mills, with Mumbai as an early centre?
    options:
    - Maharashtra
    - Kerala
    - Punjab
    - Assam
    answer: Maharashtra
    difficulty: 1
    hints:
    - Cotton grows in its black soil.
    - Mumbai is its capital.
    solution: Early mills grew in Maharashtra and Gujarat, the cotton-growing belt.
    mistakes:
      Assam: s10_textile
  - prompt: Why does India export yarn but import some fine cloth?
    options:
    - Spinning is advanced but weaving is less so and uses old machines
    - India grows no cotton
    - Weaving is banned
    - Yarn is too heavy to use
    answer: Spinning is advanced but weaving is less so and uses old machines
    difficulty: 3
    hints:
    - Our spinning is world class.
    - Much weaving is on handlooms and powerlooms.
    solution: Spinning is centralised and modern; weaving is spread out and uses low technology, so fine cloth is often imported.
    mistakes:
      India grows no cotton: s10_textile
  - prompt: Which public company is known for taking care of the environment in its power plants?
    options:
    - NTPC
    - TISCO
    - Hindustan Aeronautics
    - Indian Railways
    answer: NTPC
    difficulty: 2
    hints:
    - It makes electricity.
    - National Thermal Power Corporation.
    solution: NTPC uses ash, reduces emissions and grows green belts around its plants.
    mistakes:
      TISCO: c10ss11_control
  - prompt: Fitting machines with silencers reduces…
    options:
    - Noise pollution
    - Water pollution
    - Air pollution
    - Thermal pollution
    answer: Noise pollution
    difficulty: 1
    hints:
    - Silencers make machines quieter.
    - Which pollution is about sound?
    solution: Silencers reduce noise pollution.
    mistakes:
      Thermal pollution: c10ss11_pollution
