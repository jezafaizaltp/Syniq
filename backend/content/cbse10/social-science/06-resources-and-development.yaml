# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 1.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 6
title: Resources and Development
tips:
  c10ss_renewable: Coal and petroleum take millions of years to form, so they're non-renewable.
  c10ss_stock_potential: "Stock needs technology we don't have yet. Resources that we could use now but haven't started using are called by a word meaning 'possible'."
  s10_agenda21: "Agenda 21 came from the Earth Summit. It was about the 21st century, not 21 states."
  s10_alluvial: "The great plains of the north are made of soil carried by rivers. Which soil covers the most area?"
  s10_black_cotton: "Black soil is also called 'regur'. Which crop gives it its other name?"
  s10_forest_policy: "The policy wanted forests to cover a big share of the land, far more than the fifth India has, but less than half."
  s10_gandhi_greed: "Which quote talks about need versus greed?"
  s10_gully: "Gullies are deep channels cut by running water."
  s10_laterite: "'Later' means brick. This soil forms where heavy rain washes the soil out, in hot places."
  s10_red_iron: "Red colour in rocks usually comes from a metal. Which one?"
  s10_rio: "Kyoto is where a climate protocol was signed later. Where was the 1992 Earth Summit?"
  s10_terrace: "Overgrazing and cutting forests make erosion worse. Which method slows water on a slope?"
  c10ss6_origin: "Ask yourself whether this resource comes from living things or not. That is what classing by origin means."
  c10ss6_ownership: By ownership, resources can belong to individuals, communities, the nation or the world. Who owns this one?
  c10ss6_land_use: "Net sown area is land actually cropped. Land can also be left unsown for a season or more so that it rests; that is a different use."
  c10ss6_planning: 'Resource planning has three steps: find and list the resources, make a plan with the right technology and skills, then match it with national plans.'
  c10ss6_soil_type: "Think about how each soil forms: from river deposits, from old lava, from rocks in low rain, from heavy rain washing nutrients out, or from desert sand. Which fits this place?"
  c10ss6_erosion_cure: 'Each method slows water or wind: terraces on slopes, contour ploughing across slopes, strips of grass between crops, rows of trees as shelter belts.'
concepts:
- code: cbse10ss.resources.types
  title: Resources and their planning
  notes: |
    A resource is anything in our environment that can meet our needs, is technologically accessible,
    economically feasible and culturally acceptable. Classification: by origin (biotic, abiotic); by
    exhaustibility (renewable like solar and wind; non-renewable like coal and minerals); by ownership
    (individual, community, national, international); by status of development (potential, developed, stock,
    reserves). Indiscriminate use leads to depletion, concentration in few hands and environmental crises. The
    Earth Summit at Rio de Janeiro (1992) adopted Agenda 21 for sustainable development. Resource planning in
    India: survey and map resources, plan with suitable technology and institutions, and match plans to national
    goals. Gandhiji: 'There is enough for everybody's need and not for anybody's greed.' Land use in India:
    net sown area is about 54% of the total; forest about 22% (the National Forest Policy 1952 aimed for 33%).
  explanations:
    text: A resource is anything people can use, but only when they have the technology, money and willingness to use it. Some resources renew themselves, others run out. Careful planning and sustainable use mean there is enough for today without robbing future generations.
    visual: 'Draw four boxes for ways to sort resources: origin (living or non-living), exhaustibility (renewable or not), ownership (person to world), and development (potential to reserve).'
    step_by_step: 'Step 1: Ask where it comes from: biotic or abiotic. Step 2: Ask if it can be renewed. Step 3: Ask who owns it. Step 4: Ask if it is being used now (developed), could be used (potential), or needs technology we don''t have (stock).'
    real_world: 'Rajasthan and Gujarat have huge potential for solar and wind energy that is only now being developed: a potential resource becoming a developed one.'
  picture:
    kind: compare
    columns:
    - title: By exhaustibility
      points:
      - 'Renewable: sun, wind, water, forests'
      - 'Non-renewable: coal, petroleum, minerals'
    - title: By development
      points:
      - 'Potential: found but not yet used'
      - 'Developed: surveyed and in use'
      - 'Stock: no technology to use yet'
      - 'Reserves: part of stock kept for later'
    alt: 'Ways of classifying resources: renewable and non-renewable; and potential, developed, stock and reserves.'
  activity:
    type: sort
    prompt: Renewable or non-renewable?
    bins:
    - Renewable
    - Non-renewable
    items:
    - label: Solar energy
      bin: Renewable
      clue: Does the sun run out?
      why: Renewable.
    - label: Wind
      bin: Renewable
      clue: It keeps blowing.
      why: Renewable.
    - label: Coal
      bin: Non-renewable
      clue: Took millions of years to form.
      why: Non-renewable.
    - label: Iron ore
      bin: Non-renewable
      clue: A mineral.
      why: Non-renewable.
    - label: Forests (if replanted)
      bin: Renewable
      clue: Can grow back.
      why: Renewable with care.
    - label: Petroleum
      bin: Non-renewable
      clue: Fossil fuel.
      why: Non-renewable.
  lesson:
    - teach: A resource is anything in our environment that meets our needs, is technically possible to use, economically workable and culturally acceptable. Resources can be classed by origin (biotic, abiotic), exhaustibility (renewable, non-renewable), ownership (individual, community, national, international) and development (potential, developed, stock, reserves).
      picture:
        kind: compare
        columns:
        - title: By origin
          points:
          - 'Biotic: forests, fish'
          - 'Abiotic: rocks, metals'
        - title: By exhaustibility
          points:
          - 'Renewable: solar, wind'
          - 'Non-renewable: coal, oil'
        - title: By development
          points:
          - Potential
          - Developed
          - Stock and reserves
        alt: Resources classed by origin (biotic like forests, abiotic like rocks), by exhaustibility (renewable like solar, non-renewable like coal) and by development (potential, developed, stock and reserves).
      check:
        prompt: Fish in the sea are a … resource.
        options:
        - Biotic
        - Abiotic
        - Stock
        answer: Biotic
        why: They are living.
    - teach: 'Reckless use of resources causes depletion, concentration of resources in few hands, and pollution and global warming. The Earth Summit at Rio de Janeiro (1992) adopted Agenda 21 for sustainable development: meeting today''s needs without harming future generations. Gandhiji said there is enough for everybody''s need, not for anybody''s greed.'
      check:
        prompt: Sustainable development means…
        options:
        - Development that does not harm future generations
        - Using everything now
        - No development
        answer: Development that does not harm future generations
        why: Needs of both today and tomorrow.
    - teach: 'Resource planning in India: identify and list resources by surveys and maps; plan with suitable technology, skills and institutions; match with national development plans. Land is a key resource: India has about 43% plains, 30% mountains and 27% plateaus. Land degradation from mining, overgrazing and deforestation can be checked by afforestation, controlled grazing and stabilising sand dunes.'
      check:
        prompt: About what share of India's land is plains?
        options:
        - 43%
        - 13%
        - 80%
        answer: 43%
        why: Good for farming and industry.
  items:
  - prompt: Which of these is a renewable resource?
    options:
    - Wind energy
    - Coal
    - Petroleum
    - Iron ore
    answer: Wind energy
    difficulty: 1
    hints:
    - It doesn't run out.
    - Coal takes millions of years to form.
    solution: Wind is renewable; coal, petroleum and iron ore are non-renewable.
    mistakes:
      Coal: c10ss_renewable
  - prompt: Where was the Earth Summit of 1992 held?
    options:
    - Rio de Janeiro
    - Kyoto
    - Paris
    - New Delhi
    answer: Rio de Janeiro
    difficulty: 1
    hints:
    - In Brazil.
    - It adopted Agenda 21.
    solution: The Earth Summit was held in Rio de Janeiro, Brazil, in June 1992.
    mistakes: {"Kyoto": "s10_rio"}
  - prompt: 'Resources found in a region but not yet utilised are called:'
    options:
    - Potential resources
    - Developed resources
    - Stock
    - Reserves
    answer: Potential resources
    difficulty: 2
    hints:
    - Wind and solar in Rajasthan.
    - Not yet used, but could be.
    solution: Potential resources exist but haven't been developed yet.
    mistakes:
      Stock: c10ss_stock_potential
  - prompt: Which statement by Gandhiji is about resource conservation?
    options:
    - There is enough for everybody's need and not for anybody's greed
    - Do or die
    - Quit India
    - Swaraj is my birthright
    answer: There is enough for everybody's need and not for anybody's greed
    difficulty: 1
    hints:
    - About need and greed.
    - The others are freedom slogans.
    solution: Gandhiji warned against greed and over-exploitation of resources.
    mistakes: {"Do or die": "s10_gandhi_greed"}
  - prompt: The National Forest Policy (1952) aimed for what percentage of India's area under forests?
    answer: '33'
    check: '33'
    difficulty: 2
    hints:
    - One third.
    - Current cover is lower.
    solution: The policy set a target of 33% forest cover.
    mistakes: {"50": "s10_forest_policy", "20": "s10_forest_policy"}
  - prompt: What is Agenda 21?
    options:
    - A declaration to achieve global sustainable development
    - A list of 21 Indian states
    - A plan to build 21 dams
    - A trade agreement
    answer: A declaration to achieve global sustainable development
    difficulty: 2
    hints:
    - Signed at Rio, 1992.
    - For the 21st century.
    solution: Agenda 21 aims at sustainable development, combating environmental damage, poverty and disease.
    mistakes: {"A list of 21 Indian states": "s10_agenda21"}
  - prompt: Rocks and metals are … resources.
    options:
    - Abiotic
    - Biotic
    - Human-made
    - Community
    answer: Abiotic
    difficulty: 1
    hints:
    - They are not living.
    - The opposite of biotic.
    solution: Non-living resources like rocks and metals are abiotic.
    mistakes:
      Biotic: c10ss6_origin
  - prompt: Village grazing grounds and public parks are examples of … resources.
    options:
    - Community-owned
    - Individual
    - International
    - Stock
    answer: Community-owned
    difficulty: 2
    hints:
    - Everyone in the village can use them.
    - No one person owns them.
    solution: Resources open to all members of a community are community-owned.
    mistakes:
      Individual: c10ss6_ownership
  - prompt: Oceanic resources beyond 200 nautical miles from the coast belong to…
    options:
    - International institutions (no single country)
    - The nearest village
    - The fishermen
    - The ship owners
    answer: International institutions (no single country)
    difficulty: 3
    hints:
    - Up to 200 nautical miles is a country's exclusive economic zone.
    - Beyond it, no single nation owns them.
    solution: Beyond the exclusive economic zone, resources are international.
    mistakes:
      The fishermen: c10ss6_ownership
  - prompt: What is the first step in resource planning?
    options:
    - Identifying and listing resources across the country
    - Building factories
    - Selling resources abroad
    - Cutting forests
    answer: Identifying and listing resources across the country
    difficulty: 2
    hints:
    - You can't plan without knowing what you have.
    - Surveys and mapping.
    solution: Planning starts with surveying, mapping and listing resources.
    mistakes:
      Building factories: c10ss6_planning
  - prompt: Which of these causes land degradation in states like Jharkhand and Odisha?
    options:
    - Mining
    - Terrace farming
    - Shelter belts
    - Afforestation
    answer: Mining
    difficulty: 2
    hints:
    - Big pits and waste heaps are left behind.
    - These states are rich in minerals.
    solution: Mining has caused severe land degradation in mineral-rich states.
    mistakes:
      Afforestation: c10ss6_erosion_cure
  - prompt: About what percentage of India's land area is mountains?
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - Plains are 43% and plateaus 27%.
    - The three add to 100.
    solution: 100 − 43 − 27 = 30%.
    mistakes:
      '43': c10ss6_land_use
      '27': c10ss6_land_use
  - prompt: Land left uncultivated for one or more seasons to regain fertility is called…
    options:
    - Fallow land
    - Net sown area
    - Forest
    - Barren land
    answer: Fallow land
    difficulty: 2
    hints:
    - Farmers rest it.
    - 'It is not barren: it will be farmed again.'
    solution: Fallow land is rested so that it regains fertility.
    mistakes:
      Net sown area: c10ss6_land_use
  - prompt: Why must resources be planned carefully in India?
    options:
    - They are unevenly spread across regions
    - India has no resources
    - All states have the same resources
    - Resources never run out
    answer: They are unevenly spread across regions
    difficulty: 2
    hints:
    - Jharkhand has minerals but other states lack them.
    - Rajasthan has sun and wind but little water.
    solution: Resources are unequally spread, so balanced planning is needed.
    mistakes:
      Resources never run out: c10ss_renewable
  - prompt: Which of these is a 'reserve' resource?
    options:
    - Water in dams that can be used for power later with today's technology
    - Hydrogen fuel we can't yet use
    - Air we breathe
    - Coal already burnt
    answer: Water in dams that can be used for power later with today's technology
    difficulty: 3
    hints:
    - Reserves are a part of stock.
    - We have the know-how; we just haven't used it yet.
    solution: Reserves can be used with existing technology but are kept for future needs.
    mistakes:
      Hydrogen fuel we can't yet use: c10ss_stock_potential
- code: cbse10ss.resources.soil
  title: Soils and soil conservation
  after:
  - cbse10ss.resources.types
  notes: |
    Soil forms from rocks over millions of years by temperature changes, running water, wind and living
    organisms. Major soils of India: alluvial (most widespread, Northern Plains, very fertile; khadar new, bangar
    old); black (regur, Deccan plateau, made from lava, holds moisture, ideal for cotton); red and yellow (from
    crystalline rocks, red due to iron, yellow when hydrated); laterite (heavy rain and high temperature,
    leached, good for tea and cashew with manure); arid (sandy, saline, Rajasthan); forest (mountains).
    Soil erosion: by running water (gullies, badlands like the Chambal ravines; sheet erosion), wind, and human
    activities (deforestation, overgrazing, mining). Conservation: contour ploughing, terrace farming, strip
    cropping, shelter belts of trees, plugging gullies.
  explanations:
    text: 'Soil takes thousands of years to form and can be lost in a few rainy seasons. India has different soils in different regions: rich alluvial soil in the river plains, black cotton soil on the Deccan, red soil from old rocks, laterite in rainy hot areas, and sandy arid soil in deserts. Farmers protect soil with terraces, contour ploughing and rows of trees.'
    visual: 'Draw India with colour patches: green for alluvial across the north, black over Maharashtra and Gujarat, red down the eastern peninsula, brown laterite along the Western Ghats and northeast, yellow sand over Rajasthan.'
    step_by_step: 'Step 1: Find the region. Step 2: Match the soil: plains alluvial, Deccan black, eastern peninsula red, hilly heavy-rain laterite, desert arid. Step 3: Name a crop that suits it. Step 4: For erosion, name the cause and a fix.'
    real_world: Hill farmers in Uttarakhand and Kerala cut terraces into slopes so that rain doesn't wash the soil away.
  picture:
    kind: compare
    columns:
    - title: Soil
      points:
      - Alluvial
      - Black (regur)
      - Laterite
      - Arid
    - title: Where
      points:
      - Northern Plains, river deltas
      - 'Deccan: Maharashtra, Gujarat, MP'
      - Kerala, Karnataka, NE hills
      - Rajasthan
    - title: Good for
      points:
      - Wheat, rice, sugarcane
      - Cotton
      - Tea, coffee, cashew
      - Crops only with irrigation
    alt: 'Major soils of India, where they are found and the crops they suit: alluvial, black, laterite and arid soils.'
  activity:
    type: sort
    prompt: Which soil?
    bins:
    - Alluvial
    - Black
    - Laterite
    - Arid
    items:
    - label: Most widespread, in the Northern Plains
      bin: Alluvial
      clue: Brought by rivers.
      why: Alluvial.
    - label: Khadar and bangar
      bin: Alluvial
      clue: New and old river deposits.
      why: Alluvial.
    - label: Regur, made from lava, ideal for cotton
      bin: Black
      clue: Deccan plateau.
      why: Black soil.
    - label: Holds moisture well, cracks in summer
      bin: Black
      clue: Deccan.
      why: Black soil.
    - label: Leached by heavy rain; good for tea and cashew with manure
      bin: Laterite
      clue: High rainfall and temperature.
      why: Laterite.
    - label: Sandy and saline, in Rajasthan
      bin: Arid
      clue: Dry areas.
      why: Arid soil.
  lesson:
    - teach: Soil is a living system that takes millions of years to form, from rocks broken down by heat, water, wind and living things. India has several soil types. Alluvial soil, deposited by rivers, covers the northern plains and is very fertile. Black (regur) soil, from lava, holds moisture and suits cotton.
      check:
        prompt: Which soil is also called regur?
        options:
        - Black soil
        - Red soil
        - Laterite
        answer: Black soil
        why: Ideal for cotton.
    - teach: Red and yellow soils form on crystalline rocks in low-rain areas; iron gives the red colour. Laterite soil forms in hot, heavy-rain areas where rain washes nutrients out; with manure it grows tea, coffee and cashew. Arid soils in deserts are sandy and salty. Forest soils are in hilly forest areas.
      picture:
        kind: compare
        columns:
        - title: Alluvial
          points:
          - River plains
          - Very fertile
          - Wheat, rice, sugarcane
        - title: Black
          points:
          - Deccan lava area
          - Holds moisture
          - Cotton
        - title: Laterite
          points:
          - Hot, heavy rain
          - Leached
          - Tea, coffee, cashew
        alt: Alluvial soil in river plains is very fertile for wheat, rice and sugarcane; black soil in the Deccan lava area holds moisture for cotton; laterite in hot heavy-rain areas is leached and grows tea, coffee and cashew.
      check:
        prompt: Why is red soil red?
        options:
        - Iron in it
        - Copper in it
        - Lots of water
        answer: Iron in it
        why: Iron oxides give the colour.
    - teach: 'Soil erosion is the removal of soil by water and wind. Running water cuts gullies, making badlands (the Chambal ravines); sheet erosion washes topsoil away; wind blows soil off flat land. Conservation: contour ploughing, terrace farming, strip cropping, shelter belts of trees and controlled grazing.'
      check:
        prompt: Planting rows of trees to break wind is called…
        options:
        - Shelter belts
        - Strip cropping
        - Terrace farming
        answer: Shelter belts
        why: Trees slow the wind.
  items:
  - prompt: Which is the most widely spread soil in India?
    options:
    - Alluvial soil
    - Black soil
    - Laterite soil
    - Arid soil
    answer: Alluvial soil
    difficulty: 1
    hints:
    - Deposited by rivers.
    - Covers the Northern Plains.
    solution: Alluvial soil, deposited by the Indus, Ganga and Brahmaputra, is the most widespread.
    mistakes: {"Black soil": "s10_alluvial"}
  - prompt: 'Black soil is best known for growing:'
    options:
    - Cotton
    - Tea
    - Rice
    - Apples
    answer: Cotton
    difficulty: 1
    hints:
    - "Black soil holds moisture well. Think of the fibre crop grown widely on it in Maharashtra and Gujarat."
    - It holds moisture well.
    solution: Black (regur) soil is ideal for growing cotton.
    mistakes: {"Rice": "s10_black_cotton", "Tea": "s10_black_cotton"}
  - prompt: What makes red soil red?
    options:
    - Iron spread through crystalline rocks
    - Too much water
    - Volcanic ash
    - Red sand from deserts
    answer: Iron spread through crystalline rocks
    difficulty: 2
    hints:
    - Diffusion of iron.
    - Yellow when hydrated.
    solution: Red soil gets its colour from iron diffused in crystalline and metamorphic rocks.
    mistakes: {"Volcanic ash": "s10_red_iron"}
  - prompt: 'The ravines of the Chambal basin are an example of:'
    options:
    - Gully erosion forming badlands
    - Wind erosion
    - Sheet erosion only
    - Terrace farming
    answer: Gully erosion forming badlands
    difficulty: 2
    hints:
    - Running water cuts deep channels.
    - Land becomes unfit for farming.
    solution: Running water cut deep gullies there, creating badlands.
    mistakes: {"Wind erosion": "s10_gully"}
  - prompt: Which method reduces soil erosion on hill slopes?
    options:
    - Terrace farming
    - Overgrazing
    - Cutting forests
    - Ploughing up and down the slope
    answer: Terrace farming
    difficulty: 1
    hints:
    - Steps cut into the hill.
    - Slows the water.
    solution: Terraces slow running water and hold soil on slopes.
    mistakes: {"Ploughing up and down the slope": "s10_terrace"}
  - prompt: Laterite soil forms under which conditions?
    options:
    - High temperature and heavy rainfall
    - Very low rainfall
    - Cold and dry climate
    - In river deltas
    answer: High temperature and heavy rainfall
    difficulty: 2
    hints:
    - Heavy rain leaches nutrients.
    - From the Latin 'later', brick.
    solution: Laterite develops where high temperature and heavy rain wash away (leach) nutrients.
    mistakes: {"Very low rainfall": "s10_laterite"}
  - prompt: Which soil is found in the Deccan trap region?
    options:
    - Black soil
    - Alluvial soil
    - Arid soil
    - Forest soil
    answer: Black soil
    difficulty: 1
    hints:
    - The Deccan trap is old lava.
    - Cotton grows well in it.
    solution: Black soil formed from lava covers the Deccan trap region.
    mistakes:
      Alluvial soil: c10ss6_soil_type
  - prompt: Which soil supports tea, coffee and cashew in Kerala and Karnataka with good manure?
    options:
    - Laterite soil
    - Arid soil
    - Alluvial soil
    - Black soil
    answer: Laterite soil
    difficulty: 2
    hints:
    - It forms in hot, heavy-rain areas.
    - Its name means brick.
    solution: Laterite soil, with manures and fertilisers, is used for tea, coffee and cashew.
    mistakes:
      Arid soil: c10ss6_soil_type
  - prompt: Old alluvial soil is called…
    options:
    - Bangar
    - Khadar
    - Regur
    - Kankar
    answer: Bangar
    difficulty: 3
    hints:
    - New alluvium is khadar.
    - The older one has more kankar nodules.
    solution: Old alluvium is bangar; new alluvium is khadar.
    mistakes:
      Khadar: s10_alluvial
  - prompt: Ploughing along the contour lines of a slope helps to…
    options:
    - Slow water running down and reduce erosion
    - Make the soil red
    - Make deserts
    - Increase sheet erosion
    answer: Slow water running down and reduce erosion
    difficulty: 2
    hints:
    - Furrows across the slope act as barriers.
    - Water can't rush down.
    solution: Contour ploughing makes barriers that slow runoff and reduce erosion.
    mistakes:
      Increase sheet erosion: c10ss6_erosion_cure
  - prompt: When water flows as a sheet over large areas and washes topsoil away, it is called…
    options:
    - Sheet erosion
    - Gully erosion
    - Wind erosion
    - Strip cropping
    answer: Sheet erosion
    difficulty: 1
    hints:
    - Not channels, but a thin layer of water.
    - Over a broad area.
    solution: 'Water moving as a sheet removes topsoil: sheet erosion.'
    mistakes:
      Gully erosion: s10_gully
  - prompt: Which soil is sandy, saline and found in western Rajasthan?
    options:
    - Arid soil
    - Black soil
    - Laterite soil
    - Alluvial soil
    answer: Arid soil
    difficulty: 1
    hints:
    - It is a desert region.
    - Low humus and moisture.
    solution: Arid soils of the desert are sandy and saline.
    mistakes:
      Laterite soil: c10ss6_soil_type
  - prompt: Growing strips of grass between crops to break the force of wind is…
    options:
    - Strip cropping
    - Terrace farming
    - Contour ploughing
    - Shifting cultivation
    answer: Strip cropping
    difficulty: 2
    hints:
    - The field is divided into strips.
    - Grass grows in some of them.
    solution: 'Strips of grass between crops reduce wind force: strip cropping.'
    mistakes:
      Terrace farming: s10_terrace
  - prompt: Why does black soil need careful ploughing timing?
    options:
    - It becomes sticky when wet and cracks when dry
    - It is too sandy
    - It has no minerals
    - It is always frozen
    answer: It becomes sticky when wet and cracks when dry
    difficulty: 3
    hints:
    - It is clayey and holds moisture.
    - It swells and shrinks.
    solution: Black soil is sticky when wet and develops deep cracks when dry, so it is worked right after the first showers.
    mistakes:
      It is too sandy: s10_black_cotton
  - prompt: Which soil is the most important for India's farming?
    options:
    - Alluvial soil
    - Arid soil
    - Forest soil
    - Laterite soil
    answer: Alluvial soil
    difficulty: 1
    hints:
    - It covers the great northern plains.
    - Brought by rivers.
    solution: Alluvial soil is very fertile and supports much of India's farming.
    mistakes:
      Laterite soil: c10ss6_soil_type
