# CBSE Class 10 Social Science (NCERT), Geography: Contemporary India II, chapter 1.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 6
title: Resources and Development
tips:
  c10ss_renewable: Coal and petroleum take millions of years to form, so they're non-renewable.
  c10ss_stock_potential: Stock needs technology we don't have yet; potential resources could be used now but aren't.
concepts:
- code: cbse10ss.resources.types
  title: Resources and their planning
  notes: |
    A resource is anything in our environment that can meet our needs, is technologically accessible,
    economically feasible and culturally acceptable. Classification: by origin (biotic, abiotic); by
    exhaustibility (renewable like solar and wind; non-renewable like coal and minerals); by ownership
    (individual, community, national, international); by status of development (potential, developed, stock,
    reserves). Indiscriminate use leads to depletion, concentration in few hands and environmental crises. The
    Earth Summit at Rio de Janeiro (1992) adopted Agenda 21 for sustainable development. Resource planning in
    India: survey and map resources, plan with suitable technology and institutions, and match plans to national
    goals. Gandhiji: 'There is enough for everybody's need and not for anybody's greed.' Land use in India:
    net sown area is about 54% of the total; forest about 22% (the National Forest Policy 1952 aimed for 33%).
  explanations:
    text: A resource is anything people can use, but only when they have the technology, money and willingness to use it. Some resources renew themselves, others run out. Careful planning and sustainable use mean there is enough for today without robbing future generations.
    visual: 'Draw four boxes for ways to sort resources: origin (living or non-living), exhaustibility (renewable or not), ownership (person to world), and development (potential to reserve).'
    step_by_step: 'Step 1: Ask where it comes from: biotic or abiotic. Step 2: Ask if it can be renewed. Step 3: Ask who owns it. Step 4: Ask if it is being used now (developed), could be used (potential), or needs technology we don''t have (stock).'
    real_world: 'Rajasthan and Gujarat have huge potential for solar and wind energy that is only now being developed: a potential resource becoming a developed one.'
  picture:
    kind: compare
    columns:
    - title: By exhaustibility
      points:
      - 'Renewable: sun, wind, water, forests'
      - 'Non-renewable: coal, petroleum, minerals'
    - title: By development
      points:
      - 'Potential: found but not yet used'
      - 'Developed: surveyed and in use'
      - 'Stock: no technology to use yet'
      - 'Reserves: part of stock kept for later'
    alt: 'Ways of classifying resources: renewable and non-renewable; and potential, developed, stock and reserves.'
  items:
  - prompt: Which of these is a renewable resource?
    options:
    - Wind energy
    - Coal
    - Petroleum
    - Iron ore
    answer: Wind energy
    difficulty: 1
    hints:
    - It doesn't run out.
    - Coal takes millions of years to form.
    solution: Wind is renewable; coal, petroleum and iron ore are non-renewable.
    mistakes:
      Coal: c10ss_renewable
  - prompt: Where was the Earth Summit of 1992 held?
    options:
    - Rio de Janeiro
    - Kyoto
    - Paris
    - New Delhi
    answer: Rio de Janeiro
    difficulty: 1
    hints:
    - In Brazil.
    - It adopted Agenda 21.
    solution: The Earth Summit was held in Rio de Janeiro, Brazil, in June 1992.
  - prompt: 'Resources found in a region but not yet utilised are called:'
    options:
    - Potential resources
    - Developed resources
    - Stock
    - Reserves
    answer: Potential resources
    difficulty: 2
    hints:
    - Wind and solar in Rajasthan.
    - Not yet used, but could be.
    solution: Potential resources exist but haven't been developed yet.
    mistakes:
      Stock: c10ss_stock_potential
  - prompt: Which statement by Gandhiji is about resource conservation?
    options:
    - There is enough for everybody's need and not for anybody's greed
    - Do or die
    - Quit India
    - Swaraj is my birthright
    answer: There is enough for everybody's need and not for anybody's greed
    difficulty: 1
    hints:
    - About need and greed.
    - The others are freedom slogans.
    solution: Gandhiji warned against greed and over-exploitation of resources.
  - prompt: The National Forest Policy (1952) aimed for what percentage of India's area under forests?
    answer: '33'
    check: '33'
    difficulty: 2
    hints:
    - One third.
    - Current cover is lower.
    solution: The policy set a target of 33% forest cover.
  - prompt: What is Agenda 21?
    options:
    - A declaration to achieve global sustainable development
    - A list of 21 Indian states
    - A plan to build 21 dams
    - A trade agreement
    answer: A declaration to achieve global sustainable development
    difficulty: 2
    hints:
    - Signed at Rio, 1992.
    - For the 21st century.
    solution: Agenda 21 aims at sustainable development, combating environmental damage, poverty and disease.
- code: cbse10ss.resources.soil
  title: Soils and soil conservation
  after:
  - cbse10ss.resources.types
  notes: |
    Soil forms from rocks over millions of years by temperature changes, running water, wind and living
    organisms. Major soils of India: alluvial (most widespread, Northern Plains, very fertile; khadar new, bangar
    old); black (regur, Deccan plateau, made from lava, holds moisture, ideal for cotton); red and yellow (from
    crystalline rocks, red due to iron, yellow when hydrated); laterite (heavy rain and high temperature,
    leached, good for tea and cashew with manure); arid (sandy, saline, Rajasthan); forest (mountains).
    Soil erosion: by running water (gullies, badlands like the Chambal ravines; sheet erosion), wind, and human
    activities (deforestation, overgrazing, mining). Conservation: contour ploughing, terrace farming, strip
    cropping, shelter belts of trees, plugging gullies.
  explanations:
    text: 'Soil takes thousands of years to form and can be lost in a few rainy seasons. India has different soils in different regions: rich alluvial soil in the river plains, black cotton soil on the Deccan, red soil from old rocks, laterite in rainy hot areas, and sandy arid soil in deserts. Farmers protect soil with terraces, contour ploughing and rows of trees.'
    visual: 'Draw India with colour patches: green for alluvial across the north, black over Maharashtra and Gujarat, red down the eastern peninsula, brown laterite along the Western Ghats and northeast, yellow sand over Rajasthan.'
    step_by_step: 'Step 1: Find the region. Step 2: Match the soil: plains alluvial, Deccan black, eastern peninsula red, hilly heavy-rain laterite, desert arid. Step 3: Name a crop that suits it. Step 4: For erosion, name the cause and a fix.'
    real_world: Hill farmers in Uttarakhand and Kerala cut terraces into slopes so that rain doesn't wash the soil away.
  picture:
    kind: compare
    columns:
    - title: Soil
      points:
      - Alluvial
      - Black (regur)
      - Laterite
      - Arid
    - title: Where
      points:
      - Northern Plains, river deltas
      - 'Deccan: Maharashtra, Gujarat, MP'
      - Kerala, Karnataka, NE hills
      - Rajasthan
    - title: Good for
      points:
      - Wheat, rice, sugarcane
      - Cotton
      - Tea, coffee, cashew
      - Crops only with irrigation
    alt: 'Major soils of India, where they are found and the crops they suit: alluvial, black, laterite and arid soils.'
  items:
  - prompt: Which is the most widely spread soil in India?
    options:
    - Alluvial soil
    - Black soil
    - Laterite soil
    - Arid soil
    answer: Alluvial soil
    difficulty: 1
    hints:
    - Deposited by rivers.
    - Covers the Northern Plains.
    solution: Alluvial soil, deposited by the Indus, Ganga and Brahmaputra, is the most widespread.
  - prompt: 'Black soil is best known for growing:'
    options:
    - Cotton
    - Tea
    - Rice
    - Apples
    answer: Cotton
    difficulty: 1
    hints:
    - It is also called black cotton soil.
    - It holds moisture well.
    solution: Black (regur) soil is ideal for growing cotton.
  - prompt: What makes red soil red?
    options:
    - Iron spread through crystalline rocks
    - Too much water
    - Volcanic ash
    - Red sand from deserts
    answer: Iron spread through crystalline rocks
    difficulty: 2
    hints:
    - Diffusion of iron.
    - Yellow when hydrated.
    solution: Red soil gets its colour from iron diffused in crystalline and metamorphic rocks.
  - prompt: 'The ravines of the Chambal basin are an example of:'
    options:
    - Gully erosion forming badlands
    - Wind erosion
    - Sheet erosion only
    - Terrace farming
    answer: Gully erosion forming badlands
    difficulty: 2
    hints:
    - Running water cuts deep channels.
    - Land becomes unfit for farming.
    solution: Running water cut deep gullies there, creating badlands.
  - prompt: Which method reduces soil erosion on hill slopes?
    options:
    - Terrace farming
    - Overgrazing
    - Cutting forests
    - Ploughing up and down the slope
    answer: Terrace farming
    difficulty: 1
    hints:
    - Steps cut into the hill.
    - Slows the water.
    solution: Terraces slow running water and hold soil on slopes.
  - prompt: Laterite soil forms under which conditions?
    options:
    - High temperature and heavy rainfall
    - Very low rainfall
    - Cold and dry climate
    - In river deltas
    answer: High temperature and heavy rainfall
    difficulty: 2
    hints:
    - Heavy rain leaches nutrients.
    - From the Latin 'later', brick.
    solution: Laterite develops where high temperature and heavy rain wash away (leach) nutrients.
