# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 4.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 16
title: Political Parties
tips:
  c10ss_party_systems: 'India has many parties competing and forming alliances: a multi-party system.'
concepts:
- code: cbse10ss.parties.role
  title: What parties do and party systems
  notes: |
    A political party is a group of people who come together to contest elections and hold power. Parts: leaders,
    active members, followers. Functions: contest elections; put forward policies and programmes; make laws;
    form and run governments; act as opposition; shape public opinion; give people access to government
    machinery and welfare schemes. Party systems: one-party (China, Communist Party), two-party (USA, UK),
    multi-party (India). Coalition (alliance) governments: NDA, UPA, Left Front. The Election Commission
    registers parties; a party that gets at least 6% of votes in a state assembly election and wins at least 2
    seats is recognised as a state party; a party that gets at least 6% of votes in the Lok Sabha or assembly
    elections in four states and wins at least 4 Lok Sabha seats is a national party. National parties have
    included BJP, INC, BSP, CPI(M), AAP, NPP (as per the Election Commission's list in 2023).
  explanations:
    text: Political parties contest elections, offer policies, form governments or act as the opposition, and connect ordinary people to the government. India has a multi-party system, so governments are often coalitions of many parties. The Election Commission decides which parties count as national or state parties based on their votes and seats.
    visual: 'Draw three scales: one with a single party (China), one with two big parties (USA), one with many parties forming alliances (India).'
    step_by_step: 'Step 1: Name the party system: one, two or many. Step 2: List what parties do. Step 3: For recognition, check vote share (6%) and seats. Step 4: State or national party?'
    real_world: In many recent Indian governments, a large party has ruled with support from several regional parties as an alliance, such as the NDA.
  picture:
    kind: compare
    columns:
    - title: One-party
      points:
      - Only one party allowed
      - 'Example: China'
    - title: Two-party
      points:
      - Power alternates between two main parties
      - 'Examples: USA, UK'
    - title: Multi-party
      points:
      - Several parties compete
      - Coalitions often rule
      - 'Example: India'
    alt: 'Party systems: one-party like China, two-party like the USA and UK, and multi-party like India where coalitions are common.'
  activity:
    type: sort
    prompt: One-party, two-party or multi-party?
    bins:
    - One-party
    - Two-party
    - Multi-party
    items:
    - label: China
      bin: One-party
      clue: Only the Communist Party may rule.
      why: One-party.
    - label: USA
      bin: Two-party
      clue: Power swings between two.
      why: Two-party.
    - label: UK
      bin: Two-party
      clue: Two main parties.
      why: Two-party.
    - label: India
      bin: Multi-party
      clue: Coalitions like NDA and UPA.
      why: Multi-party.
  items:
  - prompt: India has which kind of party system?
    options:
    - Multi-party system
    - One-party system
    - Two-party system
    - No-party system
    answer: Multi-party system
    difficulty: 1
    hints:
    - Many parties compete.
    - Coalitions.
    solution: India has a multi-party system.
    mistakes:
      Two-party system: c10ss_party_systems
  - prompt: Which country has a one-party system?
    options:
    - China
    - USA
    - India
    - UK
    answer: China
    difficulty: 1
    hints:
    - Communist Party.
    - No real competition.
    solution: China allows only the Communist Party to rule.
  - prompt: Who registers political parties in India?
    options:
    - The Election Commission
    - The Supreme Court
    - The President
    - Parliament
    answer: The Election Commission
    difficulty: 1
    hints:
    - It conducts elections.
    - It gives symbols.
    solution: The Election Commission registers and recognises parties.
  - prompt: A party must get at least what percentage of votes in a state assembly election (and win at least 2 seats) to be recognised as a state party?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Six percent.
    - Also 2 seats.
    solution: At least 6% of votes and 2 seats.
  - prompt: Which is NOT a function of political parties?
    options:
    - Deciding court cases
    - Contesting elections
    - Forming governments
    - Shaping public opinion
    answer: Deciding court cases
    difficulty: 2
    hints:
    - That's the judiciary's job.
    - Parties work in the legislature and executive.
    solution: Courts decide cases; parties contest elections, make policies, form governments and shape opinion.
  - prompt: Why is the opposition important in a democracy?
    options:
    - It criticises the government and voices different views
    - It runs the government
    - It decides elections
    - It appoints judges
    answer: It criticises the government and voices different views
    difficulty: 2
    hints:
    - It keeps the government in check.
    - Parties that lose elections.
    solution: The opposition holds the government accountable and mobilises opposition to wrong policies.
- code: cbse10ss.parties.reform
  title: Challenges and reform of parties
  after:
  - cbse10ss.parties.role
  notes: |
    Challenges: lack of internal democracy (power in a few leaders; no organisational elections); dynastic
    succession (leadership passed within families); money and muscle power (rich candidates, criminals);
    meaningful choice lacking (parties look alike in ideology). Reforms: the anti-defection law (constitution
    amended in 1985) means an MLA or MP who changes party loses the seat; the Supreme Court order makes
    candidates file an affidavit about criminal cases and assets; the Election Commission requires parties to
    hold organisational elections and file income-tax returns. Suggestions: law to regulate internal affairs,
    one-third tickets to women, state funding of elections, pressure from people, media and movements.
  explanations:
    text: 'Parties face real problems: a few leaders control them, leadership often passes within families, money and criminals influence elections, and voters sometimes have little real choice. Reforms like the anti-defection law and candidate affidavits help, but public pressure matters most.'
    visual: 'Draw a party as a pyramid with a tiny top of leaders holding all the strings: that''s the lack of internal democracy. Then add a ladder from members to the top: internal elections.'
    step_by_step: 'Step 1: Identify the challenge: internal democracy, dynasty, money and muscle, or choice. Step 2: Match a reform: anti-defection law, affidavits, organisational elections. Step 3: Suggest public pressure as well.'
    real_world: 'Before voting you can look up a candidate''s affidavit online to see their declared assets and any criminal cases: this came from a Supreme Court order.'
  picture:
    kind: flow
    steps:
    - 'Problem: elected members switch parties for gain'
    - '1985: anti-defection law passed'
    - A member who defects loses the seat
    - 'Problem: hidden criminal cases and wealth'
    - 'Supreme Court: candidates file affidavits'
    alt: 'Two reforms: the anti-defection law of 1985 and affidavits about criminal cases and assets ordered by the Supreme Court.'
  activity:
    type: sort
    prompt: Challenge to parties, or a reform?
    bins:
    - Challenge
    - Reform
    items:
    - label: Leadership passed within one family
      bin: Challenge
      clue: Dynastic succession.
      why: A challenge.
    - label: Rich candidates and criminals win tickets
      bin: Challenge
      clue: Money and muscle.
      why: A challenge.
    - label: An MP who changes party loses the seat
      bin: Reform
      clue: Anti-defection law, 1985.
      why: A reform.
    - label: Candidates file affidavits on cases and assets
      bin: Reform
      clue: Supreme Court order.
      why: A reform.
    - label: No organisational elections inside the party
      bin: Challenge
      clue: Lack of internal democracy.
      why: A challenge.
    - label: Parties must file income-tax returns
      bin: Reform
      clue: Election Commission rule.
      why: A reform.
  items:
  - prompt: What does the anti-defection law do?
    options:
    - An MLA or MP who changes party loses their seat
    - It bans small parties
    - It stops elections
    - It gives parties free money
    answer: An MLA or MP who changes party loses their seat
    difficulty: 1
    hints:
    - Defection means switching sides.
    - Amendment of 1985.
    solution: Under the anti-defection law, an elected member who changes party loses the seat.
  - prompt: In which year was the anti-defection law brought in by amending the Constitution?
    answer: '1985'
    check: '1985'
    difficulty: 2
    hints:
    - Mid-1980s.
    - Rajiv Gandhi's government.
    solution: The Constitution was amended in 1985.
  - prompt: '''Dynastic succession'' in parties means:'
    options:
    - Top positions are held by members of one family
    - Leaders are elected by members
    - Parties merge
    - Old leaders retire early
    answer: Top positions are held by members of one family
    difficulty: 1
    hints:
    - Family control.
    - Unfair to other members.
    solution: Dynastic succession is when leadership passes within one family.
  - prompt: Candidates must file an affidavit giving details of their property and criminal cases. Who ordered this?
    options:
    - The Supreme Court
    - Parliament
    - The President
    - The Prime Minister
    answer: The Supreme Court
    difficulty: 2
    hints:
    - A court order.
    - To reduce money and crime in politics.
    solution: The Supreme Court ordered candidates to file affidavits about assets and criminal cases.
  - prompt: 'Lack of internal democracy in parties means:'
    options:
    - Power is concentrated in a few leaders with no organisational elections
    - Too many members vote
    - Parties have no leaders
    - Parties are too democratic
    answer: Power is concentrated in a few leaders with no organisational elections
    difficulty: 2
    hints:
    - Members can't influence decisions.
    - No meetings, no elections.
    solution: Parties often don't hold internal elections; a few leaders decide everything.
  - prompt: Which suggestion would reduce the role of money in elections?
    options:
    - State funding of elections
    - Allowing unlimited donations
    - Banning newspapers
    - Removing the Election Commission
    answer: State funding of elections
    difficulty: 2
    hints:
    - The government meets expenses.
    - Less need for rich donors.
    solution: State funding would let parties contest without depending on rich donors.
