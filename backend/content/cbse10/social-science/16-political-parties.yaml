# CBSE Class 10 Social Science (NCERT), Civics: Democratic Politics II, chapter 4.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 16
title: Political Parties
tips:
  c10ss_party_systems: "Count the parties that seriously compete for power in India and form alliances. Are there one, two, or many?"
  s10_china_party: "India, the USA and the UK all have rival parties. Which country allows only one?"
  s10_defection: "Defection means switching parties. What does the law do to someone who switches?"
  s10_defection_year: "The anti-defection law came in the mid-1980s."
  s10_dynasty: "A dynasty is a family line."
  s10_ec_register: "Parties register with the body that runs elections."
  s10_internal_democracy: "Internal democracy means members choose leaders. What happens without it?"
  s10_money_power: "Unlimited donations increase money's role. What would reduce it?"
  s10_opposition: "The opposition does not run the government. What does it do?"
  s10_party_function: "Parties contest elections and form governments. Which choice is a court's job?"
  s10_sc_affidavit: "This was ordered by a court, not passed as a law."
  s10_state_party: "A state party needs a modest share of the votes, plus seats. Recall the rule from the chapter."
  c10ss16_components: "Think about the people inside a party: who runs it, who does its work, and who simply supports it. Courts and governors are not part of a party."
  c10ss16_national: A recognised national party needs a set share of votes or seats across several states. State parties are recognised in one state.
  c10ss16_alliance: When several parties come together to fight elections and share power, they form an alliance or front.
  c10ss16_why_parties: Without parties, every candidate would be independent, no one could promise big policy changes, and no one would be responsible for running the government.
  c10ss16_reform: Reforms suggested include laws on internal democracy, a share of tickets for women, state funding of elections, and pressure from people and the media.
  c10ss16_in_house: This group sat in parliament as a party that had lost the election, and its job was to question the government. Courts and lobby groups are outside parliament.
concepts:
- code: cbse10ss.parties.role
  title: What parties do and party systems
  notes: |
    A political party is a group of people who come together to contest elections and hold power. Parts: leaders,
    active members, followers. Functions: contest elections; put forward policies and programmes; make laws;
    form and run governments; act as opposition; shape public opinion; give people access to government
    machinery and welfare schemes. Party systems: one-party (China, Communist Party), two-party (USA, UK),
    multi-party (India). Coalition (alliance) governments: NDA, UPA, Left Front. The Election Commission
    registers parties; a party that gets at least 6% of votes in a state assembly election and wins at least 2
    seats is recognised as a state party; a party that gets at least 6% of votes in the Lok Sabha or assembly
    elections in four states and wins at least 4 Lok Sabha seats is a national party. National parties have
    included BJP, INC, BSP, CPI(M), AAP, NPP (as per the Election Commission's list in 2023).
  explanations:
    text: Political parties contest elections, offer policies, form governments or act as the opposition, and connect ordinary people to the government. India has a multi-party system, so governments are often coalitions of many parties. The Election Commission decides which parties count as national or state parties based on their votes and seats.
    visual: 'Draw three scales: one with a single party (China), one with two big parties (USA), one with many parties forming alliances (India).'
    step_by_step: 'Step 1: Name the party system: one, two or many. Step 2: List what parties do. Step 3: For recognition, check vote share (6%) and seats. Step 4: State or national party?'
    real_world: In many recent Indian governments, a large party has ruled with support from several regional parties as an alliance, such as the NDA.
  picture:
    kind: compare
    columns:
    - title: One-party
      points:
      - Only one party allowed
      - 'Example: China'
    - title: Two-party
      points:
      - Power alternates between two main parties
      - 'Examples: USA, UK'
    - title: Multi-party
      points:
      - Several parties compete
      - Coalitions often rule
      - 'Example: India'
    alt: 'Party systems: one-party like China, two-party like the USA and UK, and multi-party like India where coalitions are common.'
  activity:
    type: sort
    prompt: One-party, two-party or multi-party?
    bins:
    - One-party
    - Two-party
    - Multi-party
    items:
    - label: China
      bin: One-party
      clue: Only the Communist Party may rule.
      why: One-party.
    - label: USA
      bin: Two-party
      clue: Power swings between two.
      why: Two-party.
    - label: UK
      bin: Two-party
      clue: Two main parties.
      why: Two-party.
    - label: India
      bin: Multi-party
      clue: Coalitions like NDA and UPA.
      why: Multi-party.
  lesson:
    - teach: A political party is a group of people who come together to contest elections and hold power. Parties contest elections, put forward policies, make laws, form and run governments, act as the opposition, shape public opinion, and give people access to government schemes. A party has leaders, active members and followers.
      check:
        prompt: Which is a function of a political party?
        options:
        - Contesting elections
        - Giving court judgments
        - Printing money
        answer: Contesting elections
        why: Parties compete for power.
      ways:
      - style: visual
        teach: Seven jobs political parties do in a democracy, from elections to helping people.
        picture:
          kind: flow
          steps:
          - Contest elections
          - Put forward policies
          - Make laws
          - Form and run governments
          - Act as the opposition
          - Shape public opinion
          - Help people reach schemes
          alt: Parties contest elections, put forward policies, make laws, form and run governments, act as the opposition, shape public opinion and help people reach government schemes.
      - style: real_world
        teach: Before an election, parties release manifestos listing what they will do. Voters compare them like menus and choose the one closest to their needs.
    - teach: 'Party systems: one-party (China, where only the Communist Party can rule), two-party (USA, UK, where power usually alternates between two main parties) and multi-party (India, where many parties compete and often form coalitions or alliances like the NDA and INDIA).'
      picture:
        kind: compare
        columns:
        - title: One-party
          points:
          - Only one party allowed to rule
          - China
        - title: Two-party
          points:
          - Two main parties alternate
          - USA, UK
        - title: Multi-party
          points:
          - Many parties, coalitions
          - India
        alt: 'One-party system: only one party may rule, as in China; two-party system: two main parties take turns, as in the USA and UK; multi-party system: many parties and coalitions, as in India.'
      check:
        prompt: India has a … party system.
        options:
        - Multi-party
        - Two-party
        - One-party
        answer: Multi-party
        why: Many parties compete.
      ways:
      - style: step_by_step
        teach: 'Name a party system. Step 1: Count the parties that can really win power. Step 2: Only one allowed? One-party. Step 3: Power usually swings between two? Two-party. Step 4: Three or more compete and often form alliances? Multi-party.'
      - style: real_world
        teach: In Kerala two big fronts, each an alliance of several parties, have often taken turns in power. That shows a multi-party system working through alliances.
    - teach: Every party must register with the Election Commission. Big established parties are recognised and get a special symbol. A state party needs at least 6% of votes in a state assembly election and at least 2 seats; a national party needs 6% of votes in Lok Sabha or assembly elections in four states and at least 4 Lok Sabha seats.
      check:
        prompt: Who registers political parties?
        options:
        - Election Commission
        - Supreme Court
        - President
        answer: Election Commission
        why: It runs elections.
      ways:
      - style: visual
        teach: State party and national party recognition rules, side by side.
        picture:
          kind: compare
          columns:
          - title: State party
            points:
            - share of votes in one state
            - plus a few assembly seats
            - symbol in that state
          - title: National party
            points:
            - votes in four or more states
            - plus Lok Sabha seats
            - symbol across India
          alt: A state party needs a set share of votes in one state plus a few assembly seats, and gets a symbol in that state. A national party needs votes in four or more states plus Lok Sabha seats, and gets a symbol across India.
      - style: step_by_step
        teach: 'How a new party gets started. Step 1: A group agrees on aims and policies. Step 2: It registers with the Election Commission. Step 3: It contests elections. Step 4: If it wins enough votes and seats, it is recognised and gets its own symbol.'
  items:
  - prompt: India has which kind of party system?
    options:
    - Multi-party system
    - One-party system
    - Two-party system
    - No-party system
    answer: Multi-party system
    difficulty: 1
    hints:
    - Many parties compete.
    - Coalitions.
    solution: India has a multi-party system.
    mistakes:
      Two-party system: c10ss_party_systems
  - prompt: Which country has a one-party system?
    options:
    - China
    - USA
    - India
    - UK
    answer: China
    difficulty: 1
    hints:
    - Communist Party.
    - No real competition.
    solution: China allows only the Communist Party to rule.
    mistakes: {"UK": "s10_china_party"}
  - prompt: Who registers political parties in India?
    options:
    - The Election Commission
    - The Supreme Court
    - The President
    - Parliament
    answer: The Election Commission
    difficulty: 1
    hints:
    - It conducts elections.
    - It gives symbols.
    solution: The Election Commission registers and recognises parties.
    mistakes: {"The Supreme Court": "s10_ec_register"}
  - prompt: A party must get at least what percentage of votes in a state assembly election (and win at least 2 seats) to be recognised as a state party?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Six percent.
    - Also 2 seats.
    solution: At least 6% of votes and 2 seats.
    mistakes: {"5": "s10_state_party", "10": "s10_state_party"}
  - prompt: Which is NOT a function of political parties?
    options:
    - Deciding court cases
    - Contesting elections
    - Forming governments
    - Shaping public opinion
    answer: Deciding court cases
    difficulty: 2
    hints:
    - That's the judiciary's job.
    - Parties work in the legislature and executive.
    solution: Courts decide cases; parties contest elections, make policies, form governments and shape opinion.
    mistakes: {"Shaping public opinion": "s10_party_function"}
  - prompt: Why is the opposition important in a democracy?
    options:
    - It criticises the government and voices different views
    - It runs the government
    - It decides elections
    - It appoints judges
    answer: It criticises the government and voices different views
    difficulty: 2
    hints:
    - It keeps the government in check.
    - Parties that lose elections.
    solution: The opposition holds the government accountable and mobilises opposition to wrong policies.
    mistakes: {"It runs the government": "s10_opposition"}
  - prompt: Which are the three components of a political party?
    options:
    - Leaders, active members and followers
    - Judges, police and army
    - Voters, banks and shops
    - Ministers, governors and courts
    answer: Leaders, active members and followers
    difficulty: 2
    hints:
    - Who runs it, who works for it, who supports it.
    - Not government offices.
    solution: A party has leaders, active members and followers.
    mistakes:
      Ministers, governors and courts: c10ss16_components
  - prompt: Which countries have a two-party system?
    options:
    - USA and UK
    - India and Pakistan
    - China and North Korea
    - France and Germany only
    answer: USA and UK
    difficulty: 1
    hints:
    - Two big parties alternate in power.
    - Democrats and Republicans in one.
    solution: The USA and UK are examples of two-party systems.
    mistakes:
      China and North Korea: s10_china_party
  - prompt: Why do we need political parties in a democracy?
    options:
    - Without them, no one would be responsible for policies and running the government
    - They decide court cases
    - They print money
    - They replace elections
    answer: Without them, no one would be responsible for policies and running the government
    difficulty: 2
    hints:
    - Imagine only independent candidates.
    - Who would form a government?
    solution: Parties bring people together on policies and take responsibility for governing.
    mistakes:
      They replace elections: c10ss16_why_parties
  - prompt: When several parties join to contest elections together, they form…
    options:
    - An alliance or front
    - A one-party system
    - A pressure group
    - A court
    answer: An alliance or front
    difficulty: 1
    hints:
    - Common in a multi-party system.
    - They share seats and power.
    solution: Parties joining hands form an alliance or front.
    mistakes:
      A pressure group: c10ss_party_systems
  - prompt: How many Lok Sabha seats must a party win (among other rules) to be a recognised national party?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - It also needs 6% of votes in four states.
    - A small number of seats.
    solution: A national party needs 6% of votes in four states and at least 4 Lok Sabha seats.
    mistakes:
      '2': s10_state_party
      '6': c10ss16_national
  - prompt: Why is the opposition party important?
    options:
    - It criticises the government and keeps it in check
    - It runs the courts
    - It writes the constitution
    - It has no role
    answer: It criticises the government and keeps it in check
    difficulty: 1
    hints:
    - It doesn't form the government.
    - It watches it.
    solution: The opposition raises different views and holds the government accountable.
    mistakes:
      It has no role: s10_opposition
  - prompt: How do parties help ordinary people get government benefits?
    options:
    - Local party workers help them reach officials and schemes
    - They print ration cards
    - They run all banks
    - They don't help at all
    answer: Local party workers help them reach officials and schemes
    difficulty: 2
    hints:
    - It is easier to approach a party worker than a senior officer.
    - Parties want people's trust.
    solution: Parties give people access to the government machinery and welfare schemes.
    mistakes:
      They print ration cards: s10_party_function
  - prompt: Why is a one-party system not considered democratic?
    options:
    - Voters have no real choice
    - It has too many parties
    - It holds too many elections
    - It has no leader
    answer: Voters have no real choice
    difficulty: 2
    hints:
    - Democracy needs competition.
    - Can the ruling party be replaced?
    solution: Without competing parties, people can't choose or change their rulers.
    mistakes:
      It has too many parties: s10_china_party
  - prompt: What special benefit does a recognised party get from the Election Commission?
    options:
    - A unique election symbol
    - Free seats in Parliament
    - Its own court
    - Money from the RBI
    answer: A unique election symbol
    difficulty: 2
    hints:
    - Think of the ballot or voting machine.
    - Only its candidates can use it.
    solution: Recognised parties get a unique symbol for their official candidates.
    mistakes:
      Free seats in Parliament: c10ss16_national
  - prompt: 'Assertion (A): A one-party system is not considered a democratic option.

      Reason (R): Voters have no real choice when only one party is allowed to contest.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Democracy needs a free choice between alternatives, which one-party rule removes. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A newly formed party wins 7% of the votes in a state assembly election and 3 seats. It asks for a reserved symbol. What can it most likely get?'
    options:
    - Recognition as a state party
    - Recognition as a national party
    - No recognition at all
    answer: Recognition as a state party
    hints:
    - Its votes are in one state only.
    - Check the rule for a state party.
    solution: A party with at least 6% of votes and at least 2 seats in a state assembly election can be recognised as a state party.
    mistakes:
      Recognition as a national party: c10ss16_national
      No recognition at all: s10_state_party
    exam: case
    difficulty: 2
  - prompt: 'Situation: In a country, the ruling party is defeated, and the party that was criticising it in parliament now forms the government. What role had that party been playing?'
    options:
    - The opposition
    - The judiciary
    - A pressure group
    answer: The opposition
    hints:
    - It was in parliament but not in government.
    - It criticised the ruling party.
    solution: 'Parties that lose elections act as the opposition: they criticise the government and offer an alternative.'
    mistakes:
      The judiciary: c10ss16_in_house
      A pressure group: c10ss16_in_house
    exam: competency
    difficulty: 2
- code: cbse10ss.parties.reform
  title: Challenges and reform of parties
  after:
  - cbse10ss.parties.role
  notes: |
    Challenges: lack of internal democracy (power in a few leaders; no organisational elections); dynastic
    succession (leadership passed within families); money and muscle power (rich candidates, criminals);
    meaningful choice lacking (parties look alike in ideology). Reforms: the anti-defection law (constitution
    amended in 1985) means an MLA or MP who changes party loses the seat; the Supreme Court order makes
    candidates file an affidavit about criminal cases and assets; the Election Commission requires parties to
    hold organisational elections and file income-tax returns. Suggestions: law to regulate internal affairs,
    one-third tickets to women, state funding of elections, pressure from people, media and movements.
  explanations:
    text: 'Parties face real problems: a few leaders control them, leadership often passes within families, money and criminals influence elections, and voters sometimes have little real choice. Reforms like the anti-defection law and candidate affidavits help, but public pressure matters most.'
    visual: 'Draw a party as a pyramid with a tiny top of leaders holding all the strings: that''s the lack of internal democracy. Then add a ladder from members to the top: internal elections.'
    step_by_step: 'Step 1: Identify the challenge: internal democracy, dynasty, money and muscle, or choice. Step 2: Match a reform: anti-defection law, affidavits, organisational elections. Step 3: Suggest public pressure as well.'
    real_world: 'Before voting you can look up a candidate''s affidavit online to see their declared assets and any criminal cases: this came from a Supreme Court order.'
  picture:
    kind: flow
    steps:
    - 'Problem: elected members switch parties for gain'
    - '1985: anti-defection law passed'
    - A member who defects loses the seat
    - 'Problem: hidden criminal cases and wealth'
    - 'Supreme Court: candidates file affidavits'
    alt: 'Two reforms: the anti-defection law of 1985 and affidavits about criminal cases and assets ordered by the Supreme Court.'
  activity:
    type: sort
    prompt: Challenge to parties, or a reform?
    bins:
    - Challenge
    - Reform
    items:
    - label: Leadership passed within one family
      bin: Challenge
      clue: Dynastic succession.
      why: A challenge.
    - label: Rich candidates and criminals win tickets
      bin: Challenge
      clue: Money and muscle.
      why: A challenge.
    - label: An MP who changes party loses the seat
      bin: Reform
      clue: Anti-defection law, 1985.
      why: A reform.
    - label: Candidates file affidavits on cases and assets
      bin: Reform
      clue: Supreme Court order.
      why: A reform.
    - label: No organisational elections inside the party
      bin: Challenge
      clue: Lack of internal democracy.
      why: A challenge.
    - label: Parties must file income-tax returns
      bin: Reform
      clue: Election Commission rule.
      why: A reform.
  lesson:
    - teach: 'Parties face challenges: lack of internal democracy (power in a few leaders'' hands, no regular elections inside), dynastic succession (top posts go to family members), money and muscle power (rich candidates and criminals), and lack of meaningful choice (parties offer similar policies).'
      check:
        prompt: Dynastic succession means…
        options:
        - Top posts go to family members of leaders
        - Members elect leaders
        - Parties merge
        answer: Top posts go to family members of leaders
        why: Power stays in one family.
      ways:
      - style: visual
        teach: Four challenges political parties face today, side by side.
        picture:
          kind: compare
          columns:
          - title: Inside the party
            points:
            - power with few leaders
            - family members get top posts
          - title: In elections
            points:
            - money and muscle power
            - rich donors gain influence
          - title: For voters
            points:
            - parties look alike
            - little real choice
          alt: Inside parties, power stays with a few leaders and family members get top posts. In elections, money and muscle power and rich donors gain influence. For voters, parties look alike and offer little real choice.
      - style: real_world
        teach: If a club's president stays for years, never holds elections and passes the post to a relative, ordinary members lose interest. The same happens inside a party with no internal democracy.
    - teach: Some reforms have been made. The anti-defection law (1985) disqualifies an elected member who changes party. The Supreme Court made candidates file an affidavit giving details of their property and criminal cases. The Election Commission made parties hold organisational elections and file income tax returns.
      picture:
        kind: flow
        steps:
        - 'Problem: defection'
        - Anti-defection law 1985
        - 'Problem: money and crime'
        - Affidavits on property and cases
        - 'Problem: no internal democracy'
        - Party elections required
        alt: 'Each problem with a reform: defection was met by the anti-defection law of 1985; money and crime by affidavits on property and criminal cases; lack of internal democracy by required party elections.'
      check:
        prompt: An MLA who switches party after election may…
        options:
        - Lose the seat
        - Become minister automatically
        - Get a bonus
        answer: Lose the seat
        why: Under the anti-defection law.
      ways:
      - style: step_by_step
        teach: 'How the anti-defection law works. Step 1: A candidate wins on a party''s ticket. Step 2: Later the member wants to switch to another party. Step 3: Under the law the member loses the seat. Step 4: So members are less likely to switch for money or posts.'
      - style: real_world
        teach: Before voting, you can read a candidate's affidavit online, showing their property, education and any criminal cases. It helps voters choose with open eyes.
    - teach: 'Suggested reforms: a law to regulate parties'' internal affairs, one-third of tickets to women, state funding of elections, and people''s pressure through petitions, the media and movements. People can also join parties to change them from inside.'
      check:
        prompt: State funding of elections aims to reduce…
        options:
        - The role of money
        - Voter turnout
        - The number of women
        answer: The role of money
        why: Parties would rely less on rich donors.
      ways:
      - style: visual
        teach: Suggested reforms for parties and who would push for each of them.
        picture:
          kind: compare
          columns:
          - title: By law
            points:
            - rules for internal elections
            - a share of tickets for women
            - state funding of elections
          - title: By people
            points:
            - petitions and media
            - movements
            - joining parties to change them
          alt: Reforms by law include rules for internal elections, a share of tickets for women and state funding of elections. Reforms by people include petitions, the media, movements and joining parties to change them.
      - style: step_by_step
        teach: 'Judge a reform idea. Step 1: Which problem does it target? Step 2: Will it reduce money or family power, or add more rules? Step 3: Could parties dodge it? Step 4: Does it give ordinary members and voters more say? Good reforms pass all four checks.'
  items:
  - prompt: What does the anti-defection law do?
    options:
    - An MLA or MP who changes party loses their seat
    - It bans small parties
    - It stops elections
    - It gives parties free money
    answer: An MLA or MP who changes party loses their seat
    difficulty: 1
    hints:
    - Defection means switching sides.
    - Amendment of 1985.
    solution: Under the anti-defection law, an elected member who changes party loses the seat.
    mistakes: {"It bans small parties": "s10_defection"}
  - prompt: In which year was the anti-defection law brought in by amending the Constitution?
    answer: '1985'
    check: '1985'
    difficulty: 2
    hints:
    - Mid-1980s.
    - Rajiv Gandhi's government.
    solution: The Constitution was amended in 1985.
    mistakes: {"1975": "s10_defection_year", "1992": "s10_defection_year"}
  - prompt: '''Dynastic succession'' in parties means:'
    options:
    - Top positions are held by members of one family
    - Leaders are elected by members
    - Parties merge
    - Old leaders retire early
    answer: Top positions are held by members of one family
    difficulty: 1
    hints:
    - Family control.
    - Unfair to other members.
    solution: Dynastic succession is when leadership passes within one family.
    mistakes: {"Leaders are elected by members": "s10_dynasty"}
  - prompt: Candidates must file an affidavit giving details of their property and criminal cases. Who ordered this?
    options:
    - The Supreme Court
    - Parliament
    - The President
    - The Prime Minister
    answer: The Supreme Court
    difficulty: 2
    hints:
    - A court order.
    - To reduce money and crime in politics.
    solution: The Supreme Court ordered candidates to file affidavits about assets and criminal cases.
    mistakes: {"Parliament": "s10_sc_affidavit"}
  - prompt: 'Lack of internal democracy in parties means:'
    options:
    - Power is concentrated in a few leaders with no organisational elections
    - Too many members vote
    - Parties have no leaders
    - Parties are too democratic
    answer: Power is concentrated in a few leaders with no organisational elections
    difficulty: 2
    hints:
    - Members can't influence decisions.
    - No meetings, no elections.
    solution: Parties often don't hold internal elections; a few leaders decide everything.
    mistakes: {"Parties are too democratic": "s10_internal_democracy"}
  - prompt: Which suggestion would reduce the role of money in elections?
    options:
    - State funding of elections
    - Allowing unlimited donations
    - Banning newspapers
    - Removing the Election Commission
    answer: State funding of elections
    difficulty: 2
    hints:
    - The government meets expenses.
    - Less need for rich donors.
    solution: State funding would let parties contest without depending on rich donors.
    mistakes: {"Allowing unlimited donations": "s10_money_power"}
  - prompt: What is 'defection'?
    options:
    - An elected member changing party
    - A party winning a majority
    - A court case
    - A new party forming
    answer: An elected member changing party
    difficulty: 1
    hints:
    - Leaving one side for another.
    - After being elected.
    solution: Defection means changing party allegiance after being elected.
    mistakes:
      A party winning a majority: s10_defection
  - prompt: Which of these is a challenge faced by political parties?
    options:
    - Growing role of money and muscle power
    - Too much internal democracy
    - Too many women leaders
    - Too few elections
    answer: Growing role of money and muscle power
