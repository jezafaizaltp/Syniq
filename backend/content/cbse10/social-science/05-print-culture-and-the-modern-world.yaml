- code: cbse10ss.print.india
  title: Print in India
  after:
  - cbse10ss.print.europe
  notes: |
    India had a rich tradition of handwritten manuscripts in Sanskrit, Arabic, Persian and regional languages, on
    palm leaves or handmade paper. Portuguese missionaries brought the printing press to Goa in the mid-16th
    century; Konkani and Tamil books followed. James Augustus Hickey began the Bengal Gazette (1780), a weekly.
    Print fuelled religious reform and debate: Raja Ram Mohun Roy's Sambad Kaumudi (1821); Deoband Seminary
    (1867) fatwas; Tulsidas's Ramcharitmanas printed (1810). Print reached women (Rashsundari Debi's
    autobiography Amar Jiban, 1876; Pandita Ramabai on upper-caste women's lives) and the poor (Jyotiba Phule's
    Gulamgiri, 1871, on caste; Kashibaba's Chhote Aur Bade Ka Sawal). The Vernacular Press Act (1878) gave the
    government powers to censor Indian-language papers; Bal Gangadhar Tilak wrote in Kesari and was jailed in
    1908.
  explanations:
    text: Print came to India with Portuguese missionaries in Goa in the sixteenth century. By the nineteenth century newspapers and cheap books carried debates about religion, caste and women's rights to ordinary readers, and nationalist papers criticised British rule, which tried to control them with censorship laws.
    visual: Draw a press in Goa (1550s), then a newspaper boy in Calcutta selling the Bengal Gazette (1780), then readers gathered around Kesari while a British officer frowns over the Vernacular Press Act (1878).
    step_by_step: 'Step 1: Before print: manuscripts. Step 2: Arrival: Portuguese in Goa. Step 3: Newspapers from 1780. Step 4: Reform debates, women''s and dalit voices. Step 5: Censorship: Vernacular Press Act, 1878.'
    real_world: Many Indian-language newspapers started in the 1800s, like Kesari in Marathi, are part of why India has one of the largest newspaper readerships in the world today.
  picture:
    kind: flow
    steps:
    - 'Mid-1500s: Portuguese bring the press to Goa'
    - '1780: Hickey''s Bengal Gazette'
    - '1821: Ram Mohun Roy''s Sambad Kaumudi'
    - '1871: Phule''s Gulamgiri on caste'
    - '1878: Vernacular Press Act censors Indian papers'
    alt: 'Print in India: the press reaches Goa in the 1500s, the Bengal Gazette in 1780, Sambad Kaumudi in 1821, Gulamgiri in 1871, and the Vernacular Press Act in 1878.'
  activity:
    type: sort
    prompt: Who wrote or did it?
    bins:
    - Raja Ram Mohun Roy
    - Rashsundari Debi
    - Jyotiba Phule
    - James Augustus Hickey
    items:
