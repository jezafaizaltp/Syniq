# CBSE Class 10 Social Science (NCERT), History: India and the Contemporary World II, chapter 5.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 5
title: Print Culture and the Modern World
tips:
  c10ss_diamond_sutra: "China invented woodblock printing, and the technique spread to its eastern island neighbour, where the oldest printed book was made in 868."
  s10_gulamgiri: "Gulamgiri means slavery. Phule wrote about which injustice in Indian society?"
  s10_gutenberg: "Luther used print, but did not invent the press."
  s10_gutenberg_bible: "The Diamond Sutra was printed in China. What did Gutenberg print first in Europe?"
  s10_hickey: "The Bengal Gazette was started by an Englishman, not an Indian reformer."
  s10_index: "A ban list stops ideas spreading. Which ideas did the Church fear?"
  s10_luther: "Luther challenged the Church. How did print carry his ideas?"
  s10_portuguese: "The press came to Goa in the mid-1500s, before the East India Company. Who was there first?"
  s10_print_1500: "By 1500 tens of millions of books had been printed: far more than a few million."
  s10_rashsundari: "Rashsundari Debi learned to read in secret. Why is her book a landmark?"
  s10_tilak: "Kesari was a Marathi paper. Who wrote in it?"
  c10ss5_tilak_paper: "Hickey's paper was in English and much older. Tilak wrote in Marathi, in a paper named after a fierce animal."
  s10_vernacular: "'Vernacular' means local languages. What power did the Act give over those papers?"
  c10ss5_china_japan: 'Print began in East Asia: China used hand printing from wooden blocks; the technique later went to Japan with Buddhist missionaries.'
  c10ss5_reading_public: Print made books cheaper, so more people could read them. Even those who couldn't read could listen to books read aloud.
  c10ss5_fear: Not everyone welcomed print. Some feared that rebellious or irreligious ideas would spread without control.
  c10ss5_menocchio: Menocchio was a miller in Italy who read books and reinterpreted the Bible. The Church saw him as a heretic.
  c10ss5_women_print: 'Print brought women into reading and writing: some learned in secret, and some wrote about the injustices they faced.'
  c10ss5_censorship: After 1857 the British grew suspicious of Indian newspapers and tried to control them by law.
concepts:
- code: cbse10ss.print.europe
  title: The print revolution in Europe
  notes: |
    The earliest printing was hand woodblock printing in China (from about 594 AD); Japan's Diamond Sutra (868 AD)
    is the oldest Japanese printed book. Marco Polo brought knowledge of printing to Italy. Johann Gutenberg of
    Strasbourg developed the first printing press in the 1430s; his first book was the Bible (about 180 copies,
    around 1455). By 1500 European presses had printed about 20 million copies. The print revolution created a
    reading public; books became cheaper; ideas spread fast. Martin Luther's Ninety-Five Theses (1517) spread by
    print and started the Protestant Reformation. The Roman Catholic Church kept an Index of Prohibited Books
    (from 1558); the miller Menocchio was executed for his views. Print spread Enlightenment ideas (Rousseau,
    Voltaire) and helped create conditions for the French Revolution. Chapbooks and the Bibliothèque Bleue were
    cheap books for the poor.
  explanations:
    text: Printing began with carved wooden blocks in China and Japan. Gutenberg's printing press in the 1430s made books fast and cheap in Europe, so ideas could reach thousands of people at once. Martin Luther's criticism of the Church spread by print and changed religion; later, print spread the ideas that led to the French Revolution.
    visual: 'Draw a scribe copying one page slowly by hand, next to Gutenberg''s press stamping out page after page: one book versus hundreds.'
    step_by_step: 'Step 1: China and Japan: woodblock printing. Step 2: Gutenberg''s press in the 1430s. Step 3: Cheaper books and a reading public. Step 4: Effects: the Reformation, the Enlightenment, fears of authorities.'
    real_world: Just as print let Luther's ideas spread in weeks, social media today lets one post reach millions, raising the same hopes and fears about what people read.
  picture:
    kind: flow
    steps:
    - 'c. 594 AD: woodblock printing in China'
    - '868 AD: Diamond Sutra printed in Japan'
    - '1430s: Gutenberg''s printing press'
    - 'c. 1455: Gutenberg Bible'
    - '1517: Luther''s Ninety-Five Theses spread by print'
    alt: 'Timeline of print: woodblock printing in China, the Diamond Sutra in Japan, Gutenberg''s press in the 1430s, the Gutenberg Bible, and Luther''s theses in 1517.'
  activity:
    type: order
    prompt: Put the history of print in order.
    steps:
    - Woodblock printing in China (from about 594 AD)
    - Diamond Sutra printed in Japan (868 AD)
    - Gutenberg's press; the first printed Bible (about 1455)
    - Luther's Ninety-Five Theses spread by print (1517)
    - Index of Prohibited Books (1558)
    reasons:
      Diamond Sutra printed in Japan (868 AD): Printing spread from China to Japan.
      Gutenberg's press; the first printed Bible (about 1455): Europe got the press centuries later.
      Luther's Ninety-Five Theses spread by print (1517): Luther used the new presses.
      Index of Prohibited Books (1558): The Church reacted after print spread Luther's ideas.
  lesson:
    - teach: The earliest print technology came from China, where books were printed by rubbing paper on inked woodblocks from about 594 AD. Buddhist missionaries took hand printing to Japan; the Diamond Sutra (868 AD) is the oldest Japanese printed book. Marco Polo brought woodblock knowledge to Italy in 1295.
      check:
        prompt: Who brought knowledge of woodblock printing to Italy?
        options:
        - Marco Polo
        - Gutenberg
        - Luther
        answer: Marco Polo
        why: He returned from China in 1295.
    - teach: Johann Gutenberg of Strasbourg developed the printing press in the 1430s, adapting an olive press and metal type. The first book he printed was the Bible (about 180 copies). By 1500 about 20 million copies of books had been printed in Europe. Print made books cheaper and created a new reading public.
      picture:
        kind: flow
        steps:
        - Woodblocks in China
        - 'Japan: Diamond Sutra 868'
        - Marco Polo to Italy 1295
        - Gutenberg's press 1430s
        - Books for a mass reading public
        alt: Print spread from woodblocks in China to Japan (the Diamond Sutra, 868), then to Italy with Marco Polo in 1295, and Gutenberg's press in the 1430s made books for a mass reading public.
      check:
        prompt: What was Gutenberg's first printed book?
        options:
        - The Bible
        - The Diamond Sutra
        - A newspaper
        answer: The Bible
        why: About 180 copies.
    - teach: Print spread new ideas and fears. Martin Luther's Ninety-five Theses (1517) were printed and widely read, starting the Protestant Reformation. The Catholic Church kept an Index of Prohibited Books from 1558. Many historians think print helped bring the French Revolution by spreading Enlightenment ideas of Voltaire and Rousseau.
      check:
        prompt: Luther said print was…
        options:
        - God's ultimate gift
        - A danger
        - Useless
        answer: God's ultimate gift
        why: It spread his ideas quickly.
