    answer: An Italian miller who read books and reinterpreted the Bible
    difficulty: 3
    hints:
    - He was punished by the Inquisition.
    - He was an ordinary man who read.
    solution: Menocchio, a 16th-century Italian miller, was executed for his views on God and creation.
    mistakes:
      A printer in Germany: c10ss5_menocchio
  - prompt: Why were some people afraid of the spread of print?
    options:
    - They feared rebellious and irreligious ideas would spread
    - Books were too heavy
    - Paper was poisonous
    - Print was too slow
    answer: They feared rebellious and irreligious ideas would spread
    difficulty: 2
    hints:
    - Think of the Church and kings.
    - Who would lose authority?
    solution: Religious and political authorities feared uncontrolled ideas.
    mistakes:
