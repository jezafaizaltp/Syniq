        options:
        - Rashsundari Debi
        - Pandita Ramabai
        - Tarabai Shinde
        answer: Rashsundari Debi
        why: She learned to read in secret.
    - teach: 'Print spread ideas of caste and social justice: Jyotiba Phule wrote Gulamgiri (1871); B.R. Ambedkar and E.V. Ramaswamy Naicker (Periyar) also wrote powerfully. Fearing nationalist papers after 1857, the British passed the Vernacular Press Act (1878) to censor Indian-language newspapers. Tilak wrote about Punjab revolutionaries in Kesari and was jailed in 1908.'
