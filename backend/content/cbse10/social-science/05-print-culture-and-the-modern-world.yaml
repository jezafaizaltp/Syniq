      bin: Raja Ram Mohun Roy
      clue: A reformer's paper.
      why: Ram Mohun Roy.
    - label: Amar Jiban, an autobiography (1876)
      bin: Rashsundari Debi
      clue: A woman who learned to read secretly.
      why: Rashsundari Debi.
    - label: Gulamgiri (1871), on caste
      bin: Jyotiba Phule
      clue: '''Slavery''.'
      why: Jyotiba Phule.
    - label: The Bengal Gazette (1780)
      bin: James Augustus Hickey
      clue: A weekly in English.
      why: Hickey.
    - label: Wrote against the injustice of caste in Maharashtra
      bin: Jyotiba Phule
      clue: Gulamgiri's author.
      why: Phule.
  lesson:
    - teach: India had a rich tradition of handwritten manuscripts on palm leaves or paper, in Sanskrit, Arabic, Persian and local languages. Portuguese missionaries brought the printing press to Goa in the mid-1500s. James Augustus Hickey began the Bengal Gazette in 1780, a weekly he called a commercial paper.
      check:
        prompt: Who brought the first printing press to India?
        options:
        - Portuguese missionaries
        - The British Company
        - The Mughals
        answer: Portuguese missionaries
        why: To Goa, in the mid-1500s.
    - teach: 'Print helped religious debate and reform. Raja Rammohun Roy published Sambad Kaumudi (1821); the Deoband Seminary (1867) issued thousands of fatwas; Tulsidas''s Ramcharitmanas was printed in Calcutta in 1810. Women''s reading grew: Rashsundari Debi wrote Amar Jiban (1876), and Tarabai Shinde and Pandita Ramabai wrote about women''s lives.'
      picture:
        kind: flow
        steps:
        - Manuscripts
        - Press in Goa, 1550s
        - Bengal Gazette 1780
        - Reform debates in print
        - Nationalist papers
        alt: 'Print in India: handwritten manuscripts, the first press in Goa in the 1550s, Hickey''s Bengal Gazette in 1780, reform debates in print, and nationalist newspapers.'
      check:
