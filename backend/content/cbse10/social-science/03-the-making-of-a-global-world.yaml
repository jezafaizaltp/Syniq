# CBSE Class 10 Social Science (NCERT), History: India and the Contemporary World II, chapter 3.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 3
title: The Making of a Global World
tips:
  c10ss_bretton_woods: Bretton Woods (1944) set up the IMF and World Bank. The WTO came in 1995.
concepts:
- code: cbse10ss.global.early
  title: Early trade and the nineteenth-century world economy
  notes: |
    Long before modern times, trade linked the world: the silk routes carried silk, pottery, spices, textiles and
    ideas between China, Asia and Europe; food crops like noodles, potatoes and chillies travelled (potatoes from
    the Americas changed Europe's diet; the Irish famine of 1845–49 followed potato blight). After Columbus,
    Europeans conquered the Americas; diseases like smallpox killed many native people. In the 19th century,
    flows of trade, labour and capital grew. Britain's Corn Laws were scrapped, so cheaper food was imported.
    Railways, steamships and refrigerated ships cut transport costs. Colonisation: the European powers
    partitioned Africa at the Berlin Conference (1885); rinderpest (1890s) killed cattle and forced Africans into
    wage labour. Indentured labourers went from India (from eastern UP, Bihar, central India, Tamil Nadu) to the
    Caribbean, Mauritius, Fiji: chutney music and Hosay festival are their traces.
  explanations:
    text: Trade has connected the world for thousands of years, carrying goods, food, people and germs. In the nineteenth century railways, steamships and colonies tied economies together much more tightly, so that food, workers and money moved across oceans.
    visual: 'Draw a world map with three kinds of arrows: goods (grain, cotton) from colonies to Britain, people (indentured workers) from India to the Caribbean and Fiji, and money (investments) from Britain outward.'
    step_by_step: 'Step 1: Name the three flows: trade, labour, capital. Step 2: Find what made them faster: technology. Step 3: Find who gained and who lost: colonisers and colonised. Step 4: Give an example: the Corn Laws, rinderpest, indenture.'
    real_world: The tradition of chutney music in Trinidad and Hosay processions there come from Indian indentured workers who went to the Caribbean in the nineteenth century.
  picture:
    kind: compare
    columns:
    - title: Trade
      points:
      - Grain, cotton, meat
      - Railways, steamships
      - Refrigerated ships for meat
    - title: Labour
      points:
      - Indentured Indian workers
      - To the Caribbean, Fiji, Mauritius
      - Hard contracts, few rights
    - title: Capital
      points:
      - British investment abroad
      - Railways in colonies
      - Banks and loans
    alt: 'Three flows of the nineteenth-century world economy: trade in goods, movement of labour such as indentured Indian workers, and movement of capital as investment.'
  items:
  - prompt: What were the 'silk routes'?
    options:
    - Trade routes linking Asia with Europe and northern Africa
    - Roads built by the British in India
    - Railways across Africa
    - Sea routes to America
    answer: Trade routes linking Asia with Europe and northern Africa
    difficulty: 1
    hints:
    - Chinese silk went west.
    - Land and sea.
    solution: The silk routes were networks carrying silk, spices, ideas and religions between Asia, Europe and Africa.
  - prompt: Which crop from the Americas became so important in Ireland that its failure caused a famine in the 1840s?
    options:
    - Potato
    - Wheat
    - Rice
    - Maize
    answer: Potato
    difficulty: 1
    hints:
    - It spread to Europe after Columbus.
    - A blight destroyed it.
    solution: Potato blight in Ireland (1845–49) led to famine and mass emigration.
  - prompt: What was the effect of abolishing the Corn Laws in Britain?
    options:
    - Cheaper food was imported and British farmers could not compete
    - Food prices rose sharply
    - Britain stopped importing grain
    - Corn was banned
    answer: Cheaper food was imported and British farmers could not compete
    difficulty: 2
    hints:
    - Corn Laws restricted grain imports.
    - Without them, imports flooded in.
    solution: Without the Corn Laws, cheap grain imports came in; land went uncultivated and people moved to cities.
  - prompt: How did rinderpest change African lives in the 1890s?
    options:
    - It killed most cattle, forcing Africans into wage labour
    - It improved harvests
    - It stopped European colonisation
    - It made cattle more valuable
    answer: It killed most cattle, forcing Africans into wage labour
    difficulty: 2
    hints:
    - A cattle disease.
    - Europeans used it to control land and labour.
    solution: Rinderpest wiped out about 90% of cattle, destroying livelihoods and pushing Africans to work for wages.
  - prompt: In which year did European powers meet in Berlin to divide Africa among themselves?
    answer: '1885'
    check: '1885'
    difficulty: 2
    hints:
    - Late nineteenth century.
    - The Berlin Conference.
    solution: The Berlin Conference of 1885 partitioned Africa.
  - prompt: What was indentured labour?
    options:
    - Bonded labour under a contract to work for an employer for a fixed time, often abroad
    - Free labour with full rights
    - Work only in one's own village
    - Slavery with no contract
    answer: Bonded labour under a contract to work for an employer for a fixed time, often abroad
    difficulty: 1
    hints:
    - Contracts of about five years.
    - Many went to plantations.
    solution: Indentured workers signed contracts to work for several years, often on plantations in distant colonies.
- code: cbse10ss.global.interwar
  title: The Great Depression and the post-war world
  after:
  - cbse10ss.global.early
  notes: |
    The First World War (1914–18) was the first modern industrial war; the USA emerged as a creditor nation.
    Mass production (Henry Ford's assembly line) and hire-purchase boosted consumption in the 1920s. The Great
    Depression began around 1929: farm prices crashed, US banks recalled loans, and trade, incomes and jobs
    fell worldwide. In India, exports and imports roughly halved between 1928 and 1934, agricultural prices fell
    sharply, peasants sold gold and silver (exports of gold rose), and rural distress fed the Civil Disobedience
    Movement. After the Second World War, the Bretton Woods conference (1944) set up the IMF and the World Bank
    (IBRD) with fixed exchange rates. Newly independent countries formed the Group of 77 to demand a New
    International Economic Order. From the 1970s MNCs moved production to low-wage Asian countries such as
    China.
  explanations:
    text: 'In 1929 the world economy crashed into the Great Depression: prices, trade and jobs collapsed together. After the Second World War leaders built new institutions, the IMF and World Bank, to keep the world economy steady. Later, companies spread factories across countries in search of cheaper production.'
    visual: Draw a line graph that rises through the 1920s, plunges after 1929, and slowly climbs back after 1945 with the IMF and World Bank labelled as supports under it.
    step_by_step: 'Step 1: Cause: overproduction, falling prices, US loans recalled. Step 2: Spread: trade links carried the crisis worldwide. Step 3: India: falling crop prices, debts, gold exports. Step 4: Recovery: Bretton Woods institutions after 1944.'
    real_world: Many Indian farmers who had borrowed money in the 1920s lost their land in the 1930s when crop prices halved during the Depression.
  picture:
    kind: flow
    steps:
    - '1920s: mass production and loans in the USA'
    - '1929: prices crash; US banks recall loans'
    - '1930s: trade, jobs and incomes fall worldwide'
    - 'India: crop prices fall, peasants sell gold'
    - '1944: Bretton Woods sets up the IMF and World Bank'
    alt: 'The Great Depression: boom in the 1920s, crash in 1929, worldwide fall in the 1930s, effects in India, and the Bretton Woods institutions in 1944.'
  items:
  - prompt: Which country became an international creditor after the First World War?
    options:
    - USA
    - Britain
    - Germany
    - India
    answer: USA
    difficulty: 1
    hints:
    - Britain had borrowed heavily.
    - It owned more overseas assets than it owed.
    solution: The USA emerged from the war as a creditor nation.
  - prompt: Who introduced the assembly line for car production?
    options:
    - Henry Ford
    - John Keynes
    - Adam Smith
    - Thomas Edison
    answer: Henry Ford
    difficulty: 1
    hints:
    - The T-Model car.
    - Detroit.
    solution: Henry Ford's assembly line made mass production of cars possible.
  - prompt: Roughly, by what percentage did India's exports and imports fall between 1928 and 1934?
    answer: '50'
    check: 100/2
    difficulty: 2
    hints:
    - They nearly halved.
    - Half of 100.
    solution: 'India''s exports and imports nearly halved: a fall of about 50%.'
  - prompt: What was set up at the Bretton Woods conference in 1944?
    options:
    - The IMF and the World Bank
    - The United Nations Security Council only
    - The WTO
    - The League of Nations
    answer: The IMF and the World Bank
    difficulty: 2
    hints:
    - It dealt with the post-war economy.
    - The WTO came much later.
    solution: Bretton Woods created the International Monetary Fund and the International Bank for Reconstruction and Development (World Bank).
    mistakes:
      The WTO: c10ss_bretton_woods
  - prompt: Why did Indian peasants sell their gold and silver during the Depression?
    options:
    - Crop prices fell, but they still had to pay revenue and debts
    - Gold became illegal
    - They wanted to buy cars
    - The British banned jewellery
    answer: Crop prices fell, but they still had to pay revenue and debts
    difficulty: 2
    hints:
    - Their incomes fell.
    - Revenue demand stayed the same.
    solution: With falling incomes and unchanged revenue demands, peasants sold their savings, so India exported gold.
  - prompt: What was the Group of 77 (G-77)?
    options:
    - Developing countries demanding a fairer world economic order
    - The richest industrial nations
    - A group of banks
    - A military alliance
    answer: Developing countries demanding a fairer world economic order
    difficulty: 2
    hints:
    - Newly independent nations.
    - New International Economic Order (NIEO).
    solution: The G-77 brought together developing nations to demand a New International Economic Order.
