# CBSE Class 10 Social Science (NCERT), History: India and the Contemporary World II, chapter 3.
# Chapters are numbered across the four books: History 1–5, Geography 6–12, Civics 13–17, Economics 18–22.
subject: cbse10-ss
chapter: 3
title: The Making of a Global World
tips:
  c10ss_bretton_woods: Bretton Woods (1944) set up the IMF and World Bank. The WTO came in 1995.
  c10ss3_money_bodies: "The WTO came decades later, and the UN is not a money body. Which two bodies were set up to manage money and loans between countries?"
  s10_berlin: "The Berlin Conference was in the mid-1880s."
  s10_corn_laws: "The Corn Laws had kept foreign grain out. What happens when cheap grain is let in?"
  s10_depression_trade: "India's trade crashed during the Depression: more than a small dip, but it did not vanish. Recall the figure from the chapter."
  s10_ford: "Keynes was an economist. Which car maker is famous for the assembly line?"
  s10_g77: "The G-77 was made up of newly independent, developing countries. What did they want?"
  s10_gold_sale: "Crop prices crashed but the revenue demand stayed the same. How did peasants find the money?"
  s10_indenture: "An indenture is a contract. Workers were bound by it for a fixed number of years."
  s10_potato: "The Irish famine is named after a crop that came from the Americas and grows underground."
  s10_rinderpest: "Rinderpest was a cattle disease. What happens to herders when their cattle die?"
  s10_silk_routes: "The silk routes were old trade links between continents, long before railways or the British in India."
  s10_us_creditor: "Britain borrowed heavily to fight the war. Who did it borrow from?"
  c10ss3_flows: "Economists see three flows in the world economy: goods, people and money. Which one is moving here?"
  c10ss3_exchange: After 1492, foods like potatoes, maize, tomatoes and chillies travelled from the Americas to the rest of the world. Germs travelled the other way and killed many Americans.
  c10ss3_tech: "Think about how food could survive a voyage of many weeks without going bad."
  c10ss3_depression: The Depression began with falling farm prices and the US stock market crash. Banks recalled loans, so trouble spread worldwide.
  c10ss3_postwar: After 1945 the aim was full employment and stable exchange rates. Bretton Woods set up institutions to manage that.
  c10ss3_globalisation: From the 1970s, firms shifted factories to low-wage Asian countries, especially China, and world trade grew fast.
concepts:
- code: cbse10ss.global.early
  title: Early trade and the nineteenth-century world economy
  notes: |
    Long before modern times, trade linked the world: the silk routes carried silk, pottery, spices, textiles and
    ideas between China, Asia and Europe; food crops like noodles, potatoes and chillies travelled (potatoes from
    the Americas changed Europe's diet; the Irish famine of 1845–49 followed potato blight). After Columbus,
    Europeans conquered the Americas; diseases like smallpox killed many native people. In the 19th century,
    flows of trade, labour and capital grew. Britain's Corn Laws were scrapped, so cheaper food was imported.
    Railways, steamships and refrigerated ships cut transport costs. Colonisation: the European powers
    partitioned Africa at the Berlin Conference (1885); rinderpest (1890s) killed cattle and forced Africans into
    wage labour. Indentured labourers went from India (from eastern UP, Bihar, central India, Tamil Nadu) to the
    Caribbean, Mauritius, Fiji: chutney music and Hosay festival are their traces.
  explanations:
    text: Trade has connected the world for thousands of years, carrying goods, food, people and germs. In the nineteenth century railways, steamships and colonies tied economies together much more tightly, so that food, workers and money moved across oceans.
    visual: 'Draw a world map with three kinds of arrows: goods (grain, cotton) from colonies to Britain, people (indentured workers) from India to the Caribbean and Fiji, and money (investments) from Britain outward.'
    step_by_step: 'Step 1: Name the three flows: trade, labour, capital. Step 2: Find what made them faster: technology. Step 3: Find who gained and who lost: colonisers and colonised. Step 4: Give an example: the Corn Laws, rinderpest, indenture.'
    real_world: The tradition of chutney music in Trinidad and Hosay processions there come from Indian indentured workers who went to the Caribbean in the nineteenth century.
  picture:
    kind: compare
    columns:
    - title: Trade
      points:
      - Grain, cotton, meat
      - Railways, steamships
      - Refrigerated ships for meat
    - title: Labour
      points:
      - Indentured Indian workers
      - To the Caribbean, Fiji, Mauritius
      - Hard contracts, few rights
    - title: Capital
      points:
      - British investment abroad
      - Railways in colonies
      - Banks and loans
    alt: 'Three flows of the nineteenth-century world economy: trade in goods, movement of labour such as indentured Indian workers, and movement of capital as investment.'
  activity:
    type: sort
    prompt: What did it carry or change across the world?
    bins:
    - Food
    - Disease
    - Labour
    - Ideas and goods
    items:
    - label: Potatoes from the Americas to Europe
      bin: Food
      clue: Became Europe's poor people's diet.
      why: Food travel; blight led to the Irish famine.
    - label: Smallpox in the Americas
      bin: Disease
      clue: Killed many native people.
      why: Disease carried by Europeans.
    - label: Rinderpest in 1890s Africa
      bin: Disease
      clue: Killed cattle.
      why: A cattle disease that forced Africans into wage labour.
    - label: Indentured workers to Fiji and the Caribbean
      bin: Labour
      clue: Chutney music and Hosay festival remain.
      why: Labour migration.
    - label: Silk and spices on the silk routes
      bin: Ideas and goods
      clue: China to Europe.
      why: Trade in goods (and ideas).
    - label: Noodles from China to Italy (as spaghetti)
      bin: Food
      clue: A dish travelled.
      why: Food.
  lesson:
    - teach: 'Long before modern times, people traded, travelled and spread ideas. The silk routes linked China with Asia and Europe, carrying silk, spices, textiles, Buddhism and Christianity. Foods travelled too: noodles may have come from China, and after Columbus reached America (1492), potatoes, maize, tomatoes and chillies spread across the world.'
      check:
        prompt: Which crop came to Europe from the Americas?
        options:
        - Potato
        - Wheat
        - Rice
        answer: Potato
        why: It came after 1492.
    - teach: 'The nineteenth century world economy had three flows: trade (goods), labour (people migrating) and capital (money lent and invested). In Britain the Corn Laws were abolished, cheap grain was imported, and lands in America, Russia and Australia were cleared to grow food. Railways, steamships and refrigerated ships made long-distance trade cheap.'
      picture:
        kind: compare
        columns:
        - title: Goods
          points:
          - Grain, cotton, meat
          - Carried by steamships
        - title: People
          points:
          - Workers migrate
          - Indentured labour
        - title: Capital
          points:
          - Loans and investment
          - Britain lends abroad
        alt: 'Three flows of the nineteenth century economy: goods such as grain and cotton by steamship, people migrating as workers and indentured labourers, and capital as British loans and investment abroad.'
      check:
        prompt: Workers moving to other countries for jobs is a flow of…
        options:
        - Labour
        - Capital
        - Goods
        answer: Labour
        why: People are moving.
    - teach: Colonialism had a dark side. At the Berlin Conference (1885), European powers divided Africa. Rinderpest, a cattle disease, killed about 90% of African cattle in the 1890s, forcing herders into wage work. Indian indentured labourers went to the Caribbean, Fiji, Mauritius and Malaysia on fixed contracts, often in hard conditions; the system was abolished in 1921.
      check:
        prompt: Indentured labourers worked under…
        options:
        - A contract for a fixed number of years
        - No contract at all
        - A royal order
        answer: A contract for a fixed number of years
        why: Indenture means a bond.
  items:
  - prompt: What were the 'silk routes'?
    options:
    - Trade routes linking Asia with Europe and northern Africa
    - Roads built by the British in India
    - Railways across Africa
    - Sea routes to America
    answer: Trade routes linking Asia with Europe and northern Africa
    difficulty: 1
    hints:
    - Chinese silk went west.
    - Land and sea.
    solution: The silk routes were networks carrying silk, spices, ideas and religions between Asia, Europe and Africa.
    mistakes: {"Roads built by the British in India": "s10_silk_routes"}
  - prompt: Which crop from the Americas became so important in Ireland that its failure caused a famine in the 1840s?
    options:
    - Potato
    - Wheat
    - Rice
    - Maize
    answer: Potato
    difficulty: 1
    hints:
    - It spread to Europe after Columbus.
    - A blight destroyed it.
    solution: Potato blight in Ireland (1845–49) led to famine and mass emigration.
    mistakes: {"Maize": "s10_potato", "Wheat": "s10_potato"}
  - prompt: What was the effect of abolishing the Corn Laws in Britain?
    options:
    - Cheaper food was imported and British farmers could not compete
    - Food prices rose sharply
    - Britain stopped importing grain
    - Corn was banned
    answer: Cheaper food was imported and British farmers could not compete
    difficulty: 2
    hints:
    - Corn Laws restricted grain imports.
    - Without them, imports flooded in.
    solution: Without the Corn Laws, cheap grain imports came in; land went uncultivated and people moved to cities.
    mistakes: {"Food prices rose sharply": "s10_corn_laws"}
  - prompt: How did rinderpest change African lives in the 1890s?
    options:
    - It killed most cattle, forcing Africans into wage labour
    - It improved harvests
    - It stopped European colonisation
    - It made cattle more valuable
    answer: It killed most cattle, forcing Africans into wage labour
    difficulty: 2
    hints:
    - A cattle disease.
    - Europeans used it to control land and labour.
    solution: Rinderpest wiped out about 90% of cattle, destroying livelihoods and pushing Africans to work for wages.
    mistakes: {"It made cattle more valuable": "s10_rinderpest"}
  - prompt: In which year did European powers meet in Berlin to divide Africa among themselves?
    answer: '1885'
    check: '1885'
    difficulty: 2
    hints:
    - Late nineteenth century.
    - The Berlin Conference.
    solution: The Berlin Conference of 1885 partitioned Africa.
    mistakes: {"1871": "s10_berlin", "1914": "s10_berlin"}
  - prompt: What was indentured labour?
    options:
    - Bonded labour under a contract to work for an employer for a fixed time, often abroad
    - Free labour with full rights
    - Work only in one's own village
    - Slavery with no contract
    answer: Bonded labour under a contract to work for an employer for a fixed time, often abroad
    difficulty: 1
    hints:
    - Contracts of about five years.
    - Many went to plantations.
    solution: Indentured workers signed contracts to work for several years, often on plantations in distant colonies.
    mistakes: {"Free labour with full rights": "s10_indenture", "Slavery with no contract": "s10_indenture"}
  - prompt: Which three flows describe the nineteenth century world economy?
    options:
    - Trade, labour and capital
    - Wars, kings and gods
    - Silk, spice and gold
    - Railways, ships and planes
    answer: Trade, labour and capital
    difficulty: 1
    hints:
    - Goods, people and money.
    - Economists' names for them.
    solution: The three flows are trade (goods), labour (people) and capital (money).
    mistakes:
      Silk, spice and gold: c10ss3_flows
  - prompt: British investors putting money into railways in Argentina is a flow of…
    options:
    - Capital
    - Labour
    - Goods
    - Ideas only
    answer: Capital
    difficulty: 2
    hints:
    - Money is moving.
    - It is investment.
    solution: Money invested abroad is a capital flow.
    mistakes:
      Labour: c10ss3_flows
  - prompt: What made it possible to send meat from America and Australia to Europe in the late 1800s?
    options:
    - Refrigerated ships
    - Silk routes
    - Camel caravans
    - Aeroplanes
    answer: Refrigerated ships
    difficulty: 2
    hints:
    - Meat spoils on a long voyage.
    - It must be kept cold.
    solution: Refrigerated ships carried frozen meat, making it cheaper in Europe.
    mistakes:
      Silk routes: c10ss3_tech
  - prompt: Why did so many Native Americans die after Europeans arrived in the 1500s?
    options:
    - Germs like smallpox to which they had no immunity
    - Floods
    - Lack of potatoes
    - Famine in Europe
    answer: Germs like smallpox to which they had no immunity
    difficulty: 2
    hints:
    - The deadliest weapon wasn't a gun.
    - They had never met these diseases.
    solution: European germs, especially smallpox, killed huge numbers of people.
    mistakes:
      Lack of potatoes: c10ss3_exchange
  - prompt: In which year did Columbus reach the Americas?
    answer: '1492'
    check: '1492'
    difficulty: 1
    hints:
    - Late in the fifteenth century.
    - Just before 1500.
    solution: Columbus reached the Americas in 1492.
    mistakes:
      '1885': s10_berlin
  - prompt: About what percentage of African cattle did rinderpest kill?
    answer: '90'
    check: '90'
    difficulty: 3
    hints:
    - It spread through Africa in the 1890s.
    - Almost all cattle died.
    solution: Rinderpest killed about 90% of the cattle.
    mistakes:
      '50': s10_rinderpest
      '10': s10_rinderpest
  - prompt: In which year was Indian indentured migration abolished?
    answer: '1921'
    check: '1921'
    difficulty: 3
    hints:
    - Nationalists opposed it for years.
    - Soon after the First World War.
    solution: Indentured migration was abolished in 1921.
    mistakes:
      '1885': s10_indenture
  - prompt: Which Caribbean festival shows the culture Indian indentured labourers carried with them?
    options:
    - Hosay in Trinidad
    - Diwali in Delhi
    - Christmas in London
    - Pongal in Tamil Nadu
    answer: Hosay in Trinidad
    difficulty: 3
    hints:
    - It grew from Muharram.
    - Held in the Caribbean.
    solution: Hosay in Trinidad grew from the Muharram procession and became a carnival.
    mistakes:
      Diwali in Delhi: s10_indenture
  - prompt: Why did India's trade with Britain become unequal in the 1800s?
    options:
    - Britain sold more goods to India than it bought, and used the surplus to pay its debts elsewhere
    - India sold everything for free
    - India had no trade
    - Britain banned Indian goods completely
    answer: Britain sold more goods to India than it bought, and used the surplus to pay its debts elsewhere
    difficulty: 3
    hints:
    - Think of the trade surplus.
    - Home charges were paid from India too.
    solution: Britain had a trade surplus with India, which helped balance its deficits with other countries.
    mistakes:
      India sold everything for free: c10ss3_flows
- code: cbse10ss.global.interwar
  title: The Great Depression and the post-war world
  after:
  - cbse10ss.global.early
  notes: |
    The First World War (1914–18) was the first modern industrial war; the USA emerged as a creditor nation.
    Mass production (Henry Ford's assembly line) and hire-purchase boosted consumption in the 1920s. The Great
    Depression began around 1929: farm prices crashed, US banks recalled loans, and trade, incomes and jobs
    fell worldwide. In India, exports and imports roughly halved between 1928 and 1934, agricultural prices fell
    sharply, peasants sold gold and silver (exports of gold rose), and rural distress fed the Civil Disobedience
    Movement. After the Second World War, the Bretton Woods conference (1944) set up the IMF and the World Bank
    (IBRD) with fixed exchange rates. Newly independent countries formed the Group of 77 to demand a New
    International Economic Order. From the 1970s MNCs moved production to low-wage Asian countries such as
    China.
  explanations:
    text: 'In 1929 the world economy crashed into the Great Depression: prices, trade and jobs collapsed together. After the Second World War leaders built new institutions, the IMF and World Bank, to keep the world economy steady. Later, companies spread factories across countries in search of cheaper production.'
    visual: Draw a line graph that rises through the 1920s, plunges after 1929, and slowly climbs back after 1945 with the IMF and World Bank labelled as supports under it.
    step_by_step: 'Step 1: Cause: overproduction, falling prices, US loans recalled. Step 2: Spread: trade links carried the crisis worldwide. Step 3: India: falling crop prices, debts, gold exports. Step 4: Recovery: Bretton Woods institutions after 1944.'
    real_world: Many Indian farmers who had borrowed money in the 1920s lost their land in the 1930s when crop prices halved during the Depression.
  picture:
    kind: flow
    steps:
    - '1920s: mass production and loans in the USA'
    - '1929: prices crash; US banks recall loans'
    - '1930s: trade, jobs and incomes fall worldwide'
    - 'India: crop prices fall, peasants sell gold'
    - '1944: Bretton Woods sets up the IMF and World Bank'
    alt: 'The Great Depression: boom in the 1920s, crash in 1929, worldwide fall in the 1930s, effects in India, and the Bretton Woods institutions in 1944.'
  activity:
    type: order
    prompt: Put the events in order.
    steps:
    - First World War ends (1918); the USA becomes a creditor
    - Mass production and hire-purchase boom in the 1920s
    - Great Depression begins (about 1929)
    - Bretton Woods sets up the IMF and World Bank (1944)
    - G-77 demands a New International Economic Order
    reasons:
      Mass production and hire-purchase boom in the 1920s: The boom came in the decade after the war.
      Great Depression begins (about 1929): The boom ended with the crash.
      Bretton Woods sets up the IMF and World Bank (1944): It was planned near the end of the Second World War.
      G-77 demands a New International Economic Order: Newly independent nations formed it after decolonisation.
  lesson:
    - teach: The First World War (1914–18) was the first modern industrial war, using machine guns, tanks and chemical weapons. Millions died. Britain borrowed heavily from the USA, which became an international creditor. After the war, the US economy boomed with mass production, like Henry Ford's assembly line.
      check:
        prompt: Who started the moving assembly line for cars?
        options:
        - Henry Ford
        - J.M. Keynes
        - Thomas Edison
        answer: Henry Ford
        why: At his Detroit plant.
    - teach: The Great Depression began around 1929. Farm prices fell, US banks recalled loans, and the stock market crashed. Factories closed and unemployment soared. In India, exports and imports nearly halved between 1928 and 1934; peasants' crop prices fell but revenue stayed the same, so many sold gold and silver.
      picture:
        kind: flow
        steps:
        - Farm prices fall
        - US stock market crash 1929
        - Banks recall loans
        - Trade collapses
        - Unemployment worldwide
        alt: 'How the Great Depression spread: farm prices fell, the US stock market crashed in 1929, banks recalled loans, trade collapsed, and unemployment rose across the world.'
      check:
        prompt: In India, who suffered most in the Depression?
        options:
        - Peasants
        - Rich industrialists only
        - British officials
        answer: Peasants
        why: Crop prices fell but taxes didn't.
    - teach: 'After 1945, the Bretton Woods conference (1944) set up the IMF and World Bank and a system of fixed exchange rates, bringing years of growth. Newly independent countries formed the G-77 to ask for a fair New International Economic Order. From the 1970s, companies moved production to low-wage Asian countries such as China: modern globalisation.'
      check:
        prompt: The World Bank was set up to…
        options:
        - Finance post-war reconstruction
        - Run the Olympics
        - Rule colonies
        answer: Finance post-war reconstruction
        why: Also called the IBRD.
  items:
  - prompt: Which country became an international creditor after the First World War?
    options:
    - USA
    - Britain
    - Germany
    - India
    answer: USA
    difficulty: 1
    hints:
    - Britain had borrowed heavily.
    - It owned more overseas assets than it owed.
    solution: The USA emerged from the war as a creditor nation.
    mistakes: {"Britain": "s10_us_creditor"}
  - prompt: Who introduced the assembly line for car production?
    options:
    - Henry Ford
    - John Keynes
    - Adam Smith
    - Thomas Edison
    answer: Henry Ford
    difficulty: 1
    hints:
    - The T-Model car.
    - Detroit.
    solution: Henry Ford's assembly line made mass production of cars possible.
    mistakes: {"John Keynes": "s10_ford", "Thomas Edison": "s10_ford"}
  - prompt: Roughly, by what percentage did India's exports and imports fall between 1928 and 1934?
    answer: '50'
    check: 100/2
    difficulty: 2
    hints:
    - They nearly halved.
    - Half of 100.
    solution: 'India''s exports and imports nearly halved: a fall of about 50%.'
    mistakes: {"10": "s10_depression_trade", "90": "s10_depression_trade"}
  - prompt: What was set up at the Bretton Woods conference in 1944?
    options:
    - The IMF and the World Bank
    - The United Nations Security Council only
    - The WTO
    - The League of Nations
    answer: The IMF and the World Bank
    difficulty: 2
    hints:
    - It dealt with the post-war economy.
    - The WTO came much later.
    solution: Bretton Woods created the International Monetary Fund and the International Bank for Reconstruction and Development (World Bank).
    mistakes:
      The WTO: c10ss_bretton_woods
  - prompt: Why did Indian peasants sell their gold and silver during the Depression?
    options:
    - Crop prices fell, but they still had to pay revenue and debts
    - Gold became illegal
    - They wanted to buy cars
    - The British banned jewellery
    answer: Crop prices fell, but they still had to pay revenue and debts
    difficulty: 2
    hints:
    - Their incomes fell.
    - Revenue demand stayed the same.
    solution: With falling incomes and unchanged revenue demands, peasants sold their savings, so India exported gold.
    mistakes: {"They wanted to buy cars": "s10_gold_sale"}
  - prompt: What was the Group of 77 (G-77)?
    options:
    - Developing countries demanding a fairer world economic order
    - The richest industrial nations
    - A group of banks
    - A military alliance
    answer: Developing countries demanding a fairer world economic order
    difficulty: 2
    hints:
    - Newly independent nations.
    - New International Economic Order (NIEO).
    solution: The G-77 brought together developing nations to demand a New International Economic Order.
    mistakes: {"The richest industrial nations": "s10_g77"}
  - prompt: Why was the First World War called a modern industrial war?
    options:
    - It used machine guns, tanks, aircraft and chemical weapons
    - It was fought in factories
    - It had no soldiers
    - It lasted one week
    answer: It used machine guns, tanks, aircraft and chemical weapons
    difficulty: 2
    hints:
    - Think of new weapons.
    - Made in modern industry.
    solution: Industrial weapons on a vast scale made it the first modern industrial war.
    mistakes:
      It was fought in factories: s10_us_creditor
  - prompt: In which year did the US stock market crash that began the Great Depression?
    answer: '1929'
    check: '1929'
    difficulty: 1
    hints:
    - Late 1920s.
    - The year of the Lahore Congress too.
    solution: The Wall Street crash was in 1929.
    mistakes:
      '1934': c10ss3_depression
      '1944': c10ss_bretton_woods
  - prompt: Why did US banks make the Depression spread worldwide?
    options:
    - They recalled loans from other countries
    - They printed more money for everyone
    - They lent more to Europe
    - They closed only in the USA
    answer: They recalled loans from other countries
    difficulty: 2
    hints:
    - Europe depended on US loans.
    - What happens when lenders want money back?
    solution: When US banks called back loans, European banks failed and trade collapsed.
    mistakes:
      They lent more to Europe: c10ss3_depression
  - prompt: Which two institutions were created at Bretton Woods?
    options:
    - IMF and World Bank
    - WTO and UNO
    - G-77 and NATO
    - UNESCO and WHO
    answer: IMF and World Bank
    difficulty: 2
    hints:
    - They manage money between countries.
    - The WTO came much later.
    solution: The IMF and the World Bank (IBRD) began in 1944–47.
    mistakes:
      WTO and UNO: c10ss3_money_bodies
  - prompt: Which economist helped plan the Bretton Woods system?
    options:
    - John Maynard Keynes
    - Henry Ford
    - Adam Smith
    - Karl Marx
    answer: John Maynard Keynes
    difficulty: 3
    hints:
    - A famous British economist.
    - Ford made cars.
    solution: Keynes was a key figure at Bretton Woods.
    mistakes:
      Henry Ford: s10_ford
  - prompt: What did the G-77 countries demand?
    options:
    - A New International Economic Order with fairer terms
    - More colonies
    - An end to the UN
    - Fixed prices for cars
    answer: A New International Economic Order with fairer terms
    difficulty: 2
    hints:
    - They were developing countries.
    - They wanted fair prices and control of resources.
    solution: G-77 asked for an NIEO giving them real control of their resources and fairer trade.
    mistakes:
      More colonies: s10_g77
  - prompt: Why did many companies move factories to China from the 1970s onwards?
    options:
    - Wages were low
    - It was cold there
    - Workers were all robots
    - Trade was banned elsewhere
    answer: Wages were low
    difficulty: 1
    hints:
    - Firms want to cut costs.
    - What was cheap in China?
    solution: Low-wage countries attracted foreign investment, a big step in globalisation.
    mistakes:
      Trade was banned elsewhere: c10ss3_globalisation
  - prompt: The years after Bretton Woods brought steady growth to Western countries. What is this period sometimes called?
    options:
    - The golden age
    - The dark age
    - The great depression
    - The iron age
    answer: The golden age
    difficulty: 2
    hints:
    - Trade and incomes grew fast.
    - A shining period.
    solution: 'The Bretton Woods era was an age of unprecedented growth: a golden age.'
    mistakes:
      The great depression: c10ss3_postwar
  - prompt: During the Depression, what happened to Indian wheat prices between 1928 and 1934?
    options:
    - They fell by about half
    - They doubled
    - They stayed the same
    - They rose slightly
    answer: They fell by about half
    difficulty: 2
    hints:
    - All agricultural prices crashed.
    - By around 50%.
    solution: Wheat prices in India fell by about 50%.
    mistakes:
      They doubled: c10ss3_depression
