subject: cbse10-hin
chapter: 11
title: नौबतखाने में इबादत
tips:
  h10_bharat_ratna: "यह देश का सबसे ऊँचा नागरिक सम्मान है, पद्म सम्मानों से भी ऊपर।"
  h10_kashi_umra: "वे बहुत छोटे थे जब नाना के घर काशी आए। उम्र एक अंक की है।"
  h10_reed: "बिस्मिल्ला खाँ का जन्मस्थान बिहार में है, वहीं नदी किनारे यह घास मिलती है।"
  h10_sachcha_sur: "बिस्मिल्ला खाँ के लिए संगीत ही इबादत था। वे खुदा से संगीत से जुड़ी क्या चीज़ माँगते?"
  h10_shehnai: "नौबतखाने में मंगल अवसरों पर फूँककर बजाया जाने वाला वाद्य।"

concepts:
- code: hin10c.k11.bismillah
  title: नौबतखाने में इबादत
  notes: |
    यतींद्र मिश्र का व्यक्तिचित्र, शहनाई वादक उस्ताद बिस्मिल्ला खाँ पर। उनका जन्म डुमराँव (बिहार) में हुआ; बचपन
    का नाम अमीरुद्दीन। शहनाई में लगने वाली रीड (नरकट) डुमराँव में सोन नदी के किनारे मिलती है। छह वर्ष की आयु
    में वे ननिहाल काशी आ गए, जहाँ मामा अलीबख्श खाँ बालाजी मंदिर में शहनाई बजाते थे। वे बालाजी मंदिर के
    नौबतखाने में रियाज़ करते, काशी विश्वनाथ और गंगा से उन्हें गहरा लगाव था; रसूलनबाई और बतूलनबाई के गायन से
    संगीत की ओर खिंचे। मुहर्रम में शोक, आठवीं तारीख को नौहा बजाते हुए पैदल चलते। वे पाँचों वक्त की नमाज़ में
    खुदा से 'सच्चा सुर' माँगते। उन्हें भारत रत्न समेत अनेक सम्मान मिले, फिर भी वे सादगी से फटी लुंगी पहनते।
    वे मानते थे कि काशी छोड़कर कहीं नहीं जाएँगे। भाव: संगीत की साधना, हिंदू-मुस्लिम एकता, सादगी।
  explanations:
    text: बिस्मिल्ला खाँ ने शहनाई को दुनिया भर में पहचान दिलाई। बचपन से काशी के बालाजी मंदिर में रियाज़ किया, गंगा और विश्वनाथ से प्रेम किया, और मुहर्रम पूरे मन से मनाया। भारत रत्न पाने के बाद भी वे सादा जीवन जीते और खुदा से बस 'सच्चा सुर' माँगते रहे।
    visual: 'कल्पना कीजिए: सुबह-सुबह गंगा के घाट, बालाजी मंदिर के नौबतखाने से शहनाई के सुर, और सफ़ेद लुंगी-कुर्ते में बैठे उस्ताद, आँखें बंद, साधना में डूबे।'
    step_by_step: '1. जन्म: डुमराँव; बचपन का नाम। 2. काशी आना, मामा और बालाजी मंदिर। 3. संगीत-प्रेम: रसूलनबाई-बतूलनबाई। 4. मुहर्रम और काशी दोनों से जुड़ाव। 5. सम्मान और सादगी।'
    real_world: बिस्मिल्ला खाँ ने 15 अगस्त 1947 को लाल किले पर शहनाई बजाई थी; संगीत और देश दोनों उन्हें प्रिय थे।
  picture:
    kind: flow
    steps:
    - डुमराँव में जन्म, नाम अमीरुद्दीन
    - छह वर्ष की आयु में काशी आए
    - बालाजी मंदिर के नौबतखाने में रियाज़
    - खुदा से 'सच्चा सुर' की माँग
    - भारत रत्न, फिर भी सादगी
    alt: 'बिस्मिल्ला खाँ का जीवन: डुमराँव में जन्म, काशी आगमन, बालाजी मंदिर में रियाज़, सच्चे सुर की प्रार्थना, भारत रत्न और सादगी।'
  activity:
    type: order
    prompt: बिस्मिल्ला खाँ के जीवन की बातें क्रम से लगाओ।
    steps:
    - डुमराँव में जन्म, नाम अमीरुद्दीन
    - छह वर्ष की आयु में ननिहाल काशी
    - मामा अलीबख्श खाँ के साथ बालाजी मंदिर
    - नौबतखाने में रियाज़
    - भारत रत्न, फिर भी फटी लुंगी
    reasons:
      छह वर्ष की आयु में ननिहाल काशी: जन्म डुमराँव में हुआ, काशी बाद में आए।
      मामा अलीबख्श खाँ के साथ बालाजी मंदिर: 'मामा काशी में थे: पहले काशी पहुँचना ज़रूरी।'
      नौबतखाने में रियाज़: 'बालाजी मंदिर के नौबतखाने में: मंदिर से जुड़ने के बाद।'
      भारत रत्न, फिर भी फटी लुंगी: बड़ा सम्मान बरसों की साधना के बाद आया।
  items:
  - prompt: बिस्मिल्ला खाँ का बचपन का नाम क्या था?
    options:
    - अमीरुद्दीन
    - अलीबख्श
    - शम्सुद्दीन
    - सादिक हुसैन
    answer: अमीरुद्दीन
    difficulty: 2
    hints:
    - अलीबख्श उनके मामा थे।
    - अ से शुरू।
    solution: उनका बचपन का नाम अमीरुद्दीन था।
    mistakes:
      अलीबख्श: hin10_read_again
  - prompt: बिस्मिल्ला खाँ किस वाद्य के वादक थे?
    options:
    - शहनाई
    - सितार
    - तबला
    - बाँसुरी
    answer: शहनाई
    difficulty: 1
    hints:
    - मंगल अवसरों का वाद्य।
    - रीड से बजता है।
    solution: वे शहनाई वादक थे।
    mistakes: {"सितार": "h10_shehnai"}
  - prompt: शहनाई की रीड (नरकट) कहाँ मिलती है?
    options:
    - डुमराँव में सोन नदी के किनारे
    - काशी में गंगा के घाट पर
    - लखनऊ में
    - दिल्ली में
    answer: डुमराँव में सोन नदी के किनारे
    difficulty: 2
    hints:
    - उनका जन्मस्थान।
    - बिहार।
    solution: शहनाई की रीड डुमराँव में सोन नदी के किनारे मिलती है।
    mistakes: {"काशी में गंगा के घाट पर": "h10_reed"}
  - prompt: बिस्मिल्ला खाँ कितने वर्ष की आयु में काशी आए?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - बहुत छोटी उम्र।
    - ननिहाल।
    solution: वे छह वर्ष की आयु में ननिहाल काशी आए।
    mistakes: {"16": "h10_kashi_umra", "10": "h10_kashi_umra"}
  - prompt: बिस्मिल्ला खाँ नमाज़ में खुदा से क्या माँगते थे?
    options:
    - सच्चा सुर
    - धन-दौलत
    - प्रसिद्धि
    - लंबी आयु
    answer: सच्चा सुर
    difficulty: 1
    hints:
    - संगीत की साधना।
    - '''सुर बख्श दे''।'
    solution: वे खुदा से सच्चा सुर माँगते थे।
    mistakes: {"प्रसिद्धि": "h10_sachcha_sur"}
  - prompt: बिस्मिल्ला खाँ को कौन-सा सर्वोच्च नागरिक सम्मान मिला?
    options:
    - भारत रत्न
    - पद्मश्री
    - ज्ञानपीठ
    - परमवीर चक्र
    answer: भारत रत्न
    difficulty: 1
    hints:
    - देश का सर्वोच्च नागरिक सम्मान।
    - सन 2001।
    solution: उन्हें भारत रत्न से सम्मानित किया गया।
    mistakes: {"पद्मश्री": "h10_bharat_ratna"}
