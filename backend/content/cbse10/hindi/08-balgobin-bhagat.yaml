subject: cbse10-hin
chapter: 8
title: बालगोबिन भगत
tips:
  h10_beta_mrityu: "भगत जी मानते थे कि आत्मा परमात्मा से मिल गई। तो क्या वे दुख मनाते?"
  h10_grihasth: "भगत जी के बेटा और पतोहू थे, खेती करते थे। फिर भी उनका आचरण कैसा था?"
  h10_kabir: "भगत जी इसी संत के पद गाते थे, जो जुलाहे थे और 'साखी' लिखते थे।"
  h10_kos: "गंगा बहुत दूर थी, फिर भी वे पैदल जाते थे। पाठ में कोसों की संख्या दहाई में है।"
  h10_patohu: "भगत जी पुरानी रीतियों से आगे की सोच रखते थे। युवा विधवा के भविष्य के लिए उन्होंने क्या सोचा?"
  h10k8_jeevan: भगत जी गृहस्थ होकर भी साधु जैसा जीवन जीते थे। सोचो कि यह बात उनके व्यवहार, पहनावे या नियमों में कैसे दिखती है।
  h10k8_ritu: लेखक ने अलग-अलग ऋतुओं में भगत जी के गायन का वर्णन किया है। प्रश्न किस महीने या समय का है?

concepts:
- code: hin10c.k8.balgobin
  title: बालगोबिन भगत
  notes: |
    रामवृक्ष बेनीपुरी का रेखाचित्र। बालगोबिन भगत मँझोले कद के, गोरे-चिट्टे, साठ से ऊपर के गृहस्थ थे, सफ़ेद बाल,
    कमर में लंगोटी, सिर पर कबीरपंथी टोपी। वे कबीर को 'साहब' मानते, उन्हीं के गीत गाते, खेती करते, किसी की
    चीज़ बिना पूछे न छूते, खेत की पैदावार पहले कबीरपंथी मठ में ले जाते और प्रसाद रूप में जो मिलता उसी से
    गुज़र करते। आषाढ़ में धान रोपते समय उनका गाना, भादों की अँधेरी रात में, कार्तिक से फागुन तक प्रभातियाँ।
    इकलौते बेटे की मृत्यु पर वे रोने के बजाय गाते रहे और पतोहू से कहा कि आत्मा परमात्मा से मिल गई, यह उत्सव का
    समय है। बेटे का क्रियाकर्म पतोहू से करवाया और उसके भाई को बुलाकर पतोहू की दूसरी शादी करने का आदेश दिया।
    वे हर वर्ष तीस कोस पैदल गंगा-स्नान जाते, रास्ते में उपवास रखते। एक बार लौटकर बीमार पड़े और नियम निभाते
    हुए चल बसे। भाव: सच्चा साधु वेश से नहीं, आचरण से; रूढ़ियों का विरोध।
  explanations:
    text: बालगोबिन भगत एक गृहस्थ किसान थे पर उनका आचरण साधुओं जैसा था। वे कबीर के गीत गाते, ईमानदारी से जीते, और समाज की रूढ़ियों को नहीं मानते थे। बेटे की मृत्यु पर उन्होंने शोक के बजाय गीत गाए, पतोहू से क्रियाकर्म करवाया और उसकी दूसरी शादी करवाई।
    visual: 'कल्पना कीजिए: आषाढ़ की रिमझिम में धान के खेत, कीचड़ में लथपथ लोग, और मेड़ पर बैठे सफ़ेद बालों वाले भगत जी कबीर के पद गा रहे हैं।'
    step_by_step: '1. रूप-रंग और वेशभूषा। 2. कबीर के प्रति भक्ति और ईमानदारी। 3. उनके गीत: ऋतुओं के साथ। 4. बेटे की मृत्यु पर व्यवहार। 5. पतोहू की दूसरी शादी। 6. गंगा-स्नान और मृत्यु।'
    real_world: आज भी कुछ लोग समाज की पुरानी बातों के बजाय सही को चुनते हैं, जैसे विधवा पुनर्विवाह का समर्थन; बालगोबिन भगत ऐसे ही थे।
  picture:
    kind: flow
    steps:
    - गृहस्थ पर साधु जैसा आचरण
    - कबीर के गीत, ईमानदार खेती
    - बेटे की मृत्यु पर शोक नहीं, उत्सव
    - पतोहू से क्रियाकर्म, उसकी दूसरी शादी
    - गंगा-स्नान की यात्रा, फिर मृत्यु
    alt: 'बालगोबिन भगत का जीवन: गृहस्थ साधु, कबीर-भक्ति, बेटे की मृत्यु पर उत्सव, पतोहू का पुनर्विवाह, गंगा-स्नान और मृत्यु।'
  activity:
    type: sort
    prompt: बालगोबिन भगत के कौन-से काम साधु वाले हैं और कौन-से रूढ़ियों को तोड़ते हैं?
    bins:
    - सच्चे साधु का आचरण
    - रूढ़ियों का विरोध
    items:
    - label: किसी की चीज़ बिना पूछे न छूते
      bin: सच्चे साधु का आचरण
      clue: यह ईमानदारी है या परंपरा तोड़ना?
      why: साधुता वेश से नहीं, ऐसे आचरण से।
    - label: पैदावार पहले कबीरपंथी मठ में
      bin: सच्चे साधु का आचरण
      clue: 'जो प्रसाद मिलता, उसी से गुज़र करते: यह क्या दिखाता है?'
      why: 'त्याग और संतोष: साधु का आचरण।'
    - label: तीस कोस पैदल गंगा-स्नान, रास्ते में उपवास
      bin: सच्चे साधु का आचरण
      clue: यह नियम-निष्ठा है या विरोध?
      why: 'कठोर नियम का पालन: साधु का आचरण।'
    - label: बेटे की मृत्यु पर रोने के बजाय गाना
      bin: रूढ़ियों का विरोध
      clue: शोक में आमतौर पर लोग क्या करते हैं?
      why: 'आत्मा परमात्मा से मिली: उत्सव मनाना रूढ़ि तोड़ना है।'
    - label: बेटे का क्रियाकर्म पतोहू से करवाया
      bin: रूढ़ियों का विरोध
      clue: परंपरा में यह कौन करता है?
      why: स्त्री से क्रियाकर्म करवाना रूढ़ि का विरोध।
    - label: पतोहू की दूसरी शादी का आदेश
      bin: रूढ़ियों का विरोध
      clue: उस समय विधवा-विवाह को समाज कैसे देखता था?
      why: विधवा-विवाह कराना रूढ़ि तोड़ना है।
  lesson:
    - teach: '''बालगोबिन भगत'' रामवृक्ष बेनीपुरी का रेखाचित्र है। भगत जी मँझोले कद के, गोरे-चिट्टे, साठ से ऊपर के थे। वे कमर में लंगोटी, सिर पर कबीरपंथियों जैसी कनफटी टोपी, माथे पर रामानंदी चंदन और गले में तुलसी की जड़ों की माला पहनते थे। वे खेतीबारी करने वाले गृहस्थ थे, पर साधु की तरह जीते थे। कबीर को ''साहब'' मानते और उनके ही पद गाते।'
      check:
        prompt: भगत जी किसे 'साहब' मानते थे?
        options:
        - कबीर को
        - तुलसीदास को
        - गाँव के ज़मींदार को
        answer: कबीर को
        why: वे कबीर के पद गाते और उनके आदर्शों पर चलते।
    - teach: वे कभी झूठ नहीं बोलते, किसी से झगड़ा नहीं करते, बिना पूछे किसी की चीज़ नहीं छूते। खेत की पैदावार पहले कबीरपंथी मठ (साहब के दरबार) में ले जाते और प्रसाद में जो मिलता उसी से गुज़ारा करते। आषाढ़ की रिमझिम में धान रोपते हुए, भादों की अँधेरी रात में, कार्तिक से फागुन तक भोर की प्रभातियों में, और गर्मियों की शाम को खँजड़ी बजाकर उनका संगीत गूँजता।
      picture:
        kind: flow
        steps:
        - 'आषाढ़: धान रोपते गाना'
        - 'भादों: आधी रात गायन'
        - 'कार्तिक-फागुन: प्रभातियाँ'
        - 'गर्मी: शाम को खँजड़ी'
        alt: 'बालगोबिन भगत का साल भर का गायन: आषाढ़ में धान रोपते, भादों की रात में, कार्तिक से फागुन तक प्रभातियाँ, और गर्मियों की शाम खँजड़ी के साथ।'
      check:
        prompt: भगत जी खेत की पैदावार पहले कहाँ ले जाते थे?
        options:
        - कबीरपंथी मठ में
        - बाज़ार में
        - ज़मींदार के घर
        answer: कबीरपंथी मठ में
        why: प्रसाद रूप में जो मिलता, उसी से गुज़ारा करते।
    - teach: 'इकलौते बेटे की मृत्यु पर वे रोए नहीं; उन्होंने कहा कि आत्मा परमात्मा के पास चली गई, यह आनंद की बात है। सामाजिक रीति तोड़कर बेटे की चिता को आग पतोहू से दिलवाई, और पतोहू के भाई को बुलाकर उसकी दूसरी शादी करने को कहा। हर साल तीस कोस पैदल गंगा-स्नान को जाते थे। ऐसी ही एक यात्रा के बाद बीमार पड़े, पर नियम नहीं छोड़े, और एक सुबह उनका गीत नहीं सुनाई दिया: वे चल बसे थे।'
      check:
        prompt: बेटे की चिता को आग किसने दी?
        options:
        - पतोहू ने
        - भगत जी ने
        - गाँव के पंडित ने
        answer: पतोहू ने
        why: भगत जी ने पुरानी रीति तोड़ी।
  items:
  - prompt: बालगोबिन भगत किसे 'साहब' मानते थे?
    options:
    - कबीर को
    - तुलसीदास को
    - सूरदास को
    - अपने गाँव के ज़मींदार को
    answer: कबीर को
    difficulty: 1
    hints:
    - कबीरपंथी टोपी।
    - उन्हीं के गीत गाते।
    solution: वे कबीर को साहब मानते थे।
    mistakes: {"तुलसीदास को": "h10_kabir"}
  - prompt: बालगोबिन भगत किस तरह के व्यक्ति थे?
    options:
    - गृहस्थ होकर भी साधु जैसे
    - संन्यासी
    - ज़मींदार
    - व्यापारी
    answer: गृहस्थ होकर भी साधु जैसे
    difficulty: 1
    hints:
    - उनका बेटा और पतोहू थे।
    - आचरण साधुओं जैसा।
    solution: वे गृहस्थ थे, पर उनका आचरण साधु जैसा था।
    mistakes: {"संन्यासी": "h10_grihasth"}
  - prompt: बेटे की मृत्यु पर भगत जी ने क्या किया?
    options:
    - रोने के बजाय गाते रहे और इसे उत्सव बताया
    - बहुत रोए
    - गाँव छोड़ दिया
    - किसी से बात नहीं की
    answer: रोने के बजाय गाते रहे और इसे उत्सव बताया
    difficulty: 2
    hints:
    - आत्मा परमात्मा से मिली।
    - पतोहू से भी यही कहा।
    solution: उन्होंने कहा कि आत्मा परमात्मा से मिल गई; यह उत्सव का समय है।
    mistakes: {"बहुत रोए": "h10_beta_mrityu"}
  - prompt: भगत जी ने पतोहू के बारे में क्या निर्णय लिया?
    options:
    - उसके भाई को बुलाकर उसकी दूसरी शादी करने को कहा
    - उसे घर से निकाल दिया
    - उसे संन्यासी बना दिया
    - उसे अकेला छोड़ दिया
    answer: उसके भाई को बुलाकर उसकी दूसरी शादी करने को कहा
    difficulty: 2
    hints:
    - वह उनकी सेवा करना चाहती थी।
    - रूढ़ियों का विरोध।
    solution: उन्होंने पतोहू की दूसरी शादी करवाने का आदेश दिया।
    mistakes: {"उसे घर से निकाल दिया": "h10_patohu"}
  - prompt: भगत जी गंगा-स्नान के लिए कितने कोस पैदल जाते थे?
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - बहुत दूर।
    - तीस।
    solution: वे तीस कोस पैदल चलकर गंगा-स्नान जाते थे।
    mistakes: {"3": "h10_kos"}
  - prompt: '''बालगोबिन भगत'' पाठ के लेखक कौन हैं?'
    options:
    - रामवृक्ष बेनीपुरी
    - यशपाल
    - स्वयं प्रकाश
    - प्रेमचंद
    answer: रामवृक्ष बेनीपुरी
    difficulty: 1
    hints:
    - रेखाचित्र।
    - बिहार के लेखक।
    solution: पाठ रामवृक्ष बेनीपुरी का है।
    mistakes:
      यशपाल: hin10_author
  - prompt: भगत जी के माथे पर कौन-सा चंदन होता था?
    options:
    - रामानंदी चंदन
    - लाल सिंदूर
    - भस्म
    - कुछ नहीं
    answer: रामानंदी चंदन
    difficulty: 3
    hints:
    - एक संप्रदाय से जुड़ा तिलक।
    - नाक से शुरू होकर ऊपर जाता था।
    solution: भगत जी रामानंदी चंदन लगाते थे।
    mistakes:
      भस्म: h10k8_jeevan
  - prompt: भगत जी बिना पूछे किसी की चीज़ क्यों नहीं छूते थे?
    options:
    - वे खरे और सिद्धांतवादी थे
    - उन्हें डर लगता था
    - उन्हें किसी चीज़ की ज़रूरत नहीं थी
    - उनकी आँखें कमज़ोर थीं
    answer: वे खरे और सिद्धांतवादी थे
    difficulty: 2
    hints:
    - वे दूसरे के खेत में शौच तक नहीं जाते थे।
    - यह उनका नियम था।
    solution: भगत जी अपने सिद्धांतों के पक्के थे; बिना पूछे किसी की चीज़ नहीं छूते थे।
    mistakes:
      उन्हें डर लगता था: h10k8_jeevan
  - prompt: आषाढ़ में भगत जी क्या करते हुए गाते थे?
    options:
    - खेत में धान रोपते हुए
    - नदी में नहाते हुए
    - मंदिर में पूजा करते हुए
    - बाज़ार जाते हुए
    answer: खेत में धान रोपते हुए
    difficulty: 2
    hints:
    - आषाढ़ बारिश का महीना है।
    - पूरा शरीर कीचड़ में लिथड़ा होता था।
    solution: आषाढ़ की रिमझिम में भगत जी धान रोपते हुए गाते थे।
