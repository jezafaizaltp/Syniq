subject: cbse10-hin
chapter: 5
title: यह दंतुरित मुसकान · फसल
tips:
  h10_danturit: "'दंतुरित' में 'दंत' है। छोटे बच्चे के मुँह में क्या निकल रहा है?"
  h10_fasal: "कवि गिनाते हैं: नदियों का पानी, हाथों का श्रम, मिट्टी, सूरज और हवा। क्या किसी एक का ही योगदान है?"
  h10_kankhi: "बच्चा माँ की ओट से कवि को चुपके से देखता है। 'कनखी' आँख के कोने को कहते हैं।"
  h10_muskan_prabhav: "कवि कहते हैं 'पिघलकर जल बन गया होगा कठिन पाषाण'। इसका अर्थ सोचो।"
  h10_pravasi: "कवि बहुत समय से घर से बाहर थे। छोटा बच्चा उन्हें कैसे पहचानता?"
  h10k5_kavita: 'यहाँ दो कविताएँ हैं: एक में बच्चे की मुस्कान, दूसरी में फसल का रहस्य। पहले पहचानो कि प्रश्न किसका है।'
  h10k5_bimb: नागार्जुन चित्रों से बात कहते हैं। सोचो कि चित्र किस भाव या बदलाव को दिखा रहा है।

concepts:
- code: hin10c.k5.nagarjun
  title: यह दंतुरित मुसकान · फसल
  notes: |
    नागार्जुन की दो कविताएँ। 'यह दंतुरित मुसकान': छोटे बच्चे की नए-नए दाँतों वाली (दंतुरित) मुस्कान देखकर कवि
    का कठोर मन भी पिघल जाता है; मुस्कान मृतक में भी जान डाल दे; जैसे कमल तालाब छोड़कर कवि की झोंपड़ी में
    खिल गया हो; बाँस-बबूल से भी शेफालिका के फूल झरने लगें। कवि लंबे समय बाद घर लौटे हैं ('चिर प्रवासी'), बच्चा
    उन्हें पहचानता नहीं; माँ के माध्यम से परिचय होता है; बच्चा कनखियों से देखता है।
    'फसल': फसल केवल अनाज नहीं, कई चीज़ों का मेल है — एक-दो नहीं, ढेर सारी नदियों का पानी, लाखों-करोड़ों हाथों
    का स्पर्श और श्रम, भूरी-काली-संदली मिट्टी का गुण, सूरज की किरणों का रूपांतर, हवा की थिरकन।
  explanations:
    text: पहली कविता में एक नन्हे बच्चे की नए दाँतों वाली मुस्कान कवि के सख़्त दिल को भी पिघला देती है। दूसरी कविता बताती है कि फसल केवल अनाज नहीं, बल्कि नदियों के पानी, किसानों की मेहनत, मिट्टी, धूप और हवा का मिला-जुला जादू है।
    visual: 'एक चित्र में झोंपड़ी में बैठा बच्चा, जिसके दो छोटे दाँत दिखते हैं, मुस्कुरा रहा है; दूसरे में खेत की फसल, जिसके चारों ओर तीर बने हैं: नदी, हाथ, मिट्टी, सूरज, हवा।'
    step_by_step: '1. ''दंतुरित'' का अर्थ: नए निकले दाँतों वाली। 2. मुस्कान का प्रभाव: कठोर मन पिघलना। 3. कवि और बच्चे का पहला परिचय। 4. ''फसल'' के घटक: पानी, श्रम, मिट्टी, धूप, हवा।'
    real_world: 'रोटी खाते समय सोचिए: उसमें किसान की मेहनत, नदी का पानी और धूप भी शामिल है। यही ''फसल'' कविता का संदेश है।'
  picture:
    kind: flow
    steps:
    - नदियों का पानी
    - लाखों-करोड़ों हाथों का श्रम
    - मिट्टी का गुण-धर्म
    - सूरज की किरणें
    - हवा की थिरकन = फसल
    alt: फसल कविता के अनुसार फसल नदियों के पानी, हाथों के श्रम, मिट्टी, सूरज की किरणों और हवा के मेल से बनती है।
  activity:
    type: sort
    prompt: '''फसल'' कविता के अनुसार फसल में क्या-क्या मिला है? और क्या ''यह दंतुरित मुसकान'' का है?'
    bins:
    - फसल में मिला
    - यह दंतुरित मुसकान
    items:
    - label: ढेर सारी नदियों का पानी
      bin: फसल में मिला
      clue: खेत को कहाँ-कहाँ से पानी मिलता है?
      why: एक-दो नहीं, ढेर सारी नदियों का पानी फसल में है।
    - label: लाखों-करोड़ों हाथों का श्रम
      bin: फसल में मिला
      clue: फसल किसकी मेहनत से उगती है?
      why: किसानों के श्रम का स्पर्श।
    - label: भूरी-काली-संदली मिट्टी का गुण
      bin: फसल में मिला
      clue: बीज किसमें उगता है?
      why: मिट्टी का गुण फसल में है।
    - label: सूरज की किरणों का रूपांतर
      bin: फसल में मिला
      clue: पौधे भोजन किससे बनाते हैं?
      why: सूर्य की किरणें फसल में बदल जाती हैं।
    - label: कमल तालाब छोड़कर झोंपड़ी में खिला
      bin: यह दंतुरित मुसकान
      clue: झोंपड़ी में खिला 'कमल' कौन है?
      why: बच्चे की मुस्कान झोंपड़ी में खिले कमल जैसी।
    - label: बाँस-बबूल से शेफालिका के फूल झरें
      bin: यह दंतुरित मुसकान
      clue: कठोर चीज़ से कोमल फूल कब झरते हैं?
      why: मुस्कान कठोर मन को भी कोमल कर दे।
  lesson:
    - teach: '''यह दंतुरित मुसकान'' में नागार्जुन एक छोटे बच्चे की नए दाँतों वाली मुस्कान का वर्णन करते हैं। कवि लंबे प्रवास के बाद घर लौटे हैं। बच्चे की मुस्कान इतनी सुंदर है कि मृतक में भी जान डाल दे। धूल से सने बच्चे का शरीर ऐसा लगता है मानो तालाब छोड़कर कमल कवि की झोंपड़ी में खिल रहे हों।'
      check:
        prompt: '''दंतुरित मुसकान'' का क्या अर्थ है?'
        options:
        - नए-नए दाँतों वाली मुस्कान
        - बिना दाँतों की हँसी
        - ज़ोर की हँसी
        answer: नए-नए दाँतों वाली मुस्कान
        why: बच्चे के दाँत अभी निकल रहे हैं।
    - teach: बच्चे के छूने से कवि का कठोर मन भी पिघल जाता है, मानो बाँस या बबूल से शेफालिका के फूल झरने लगें। बच्चा कवि को पहचान नहीं पाता और कनखियों से देखता है। कवि बच्चे और उसकी माँ को धन्य कहते हैं; वे स्वयं को 'चिर प्रवासी' और 'अन्य' मानते हैं, क्योंकि माँ ही बच्चे को मधुपर्क खिलाती रही।
      picture:
        kind: compare
        columns:
        - title: यह दंतुरित मुसकान
          points:
          - बच्चे की मुस्कान
          - कठोर मन पिघलता है
          - माँ को धन्यवाद
        - title: फसल
          points:
          - नदियों का पानी
          - करोड़ों हाथों का श्रम
          - मिट्टी, धूप, हवा
        alt: 'नागार्जुन की दो कविताओं की तुलना: दंतुरित मुसकान में बच्चे की मुस्कान कठोर मन पिघला देती है, फसल में पानी, श्रम, मिट्टी, धूप और हवा का योगदान है।'
      check:
        prompt: कवि स्वयं को 'अन्य' क्यों कहते हैं?
        options:
        - वे लंबे समय से घर से दूर प्रवास में थे
        - वे दूसरे देश के हैं
        - वे बच्चे के पिता नहीं हैं
        answer: वे लंबे समय से घर से दूर प्रवास में थे
        why: इसलिए बच्चा उन्हें पहचानता नहीं।
    - teach: '''फसल'' कविता पूछती है: फसल क्या है? उत्तर है: एक-दो नहीं, ढेर सारी नदियों के पानी का जादू; लाखों-करोड़ों हाथों के स्पर्श की गरिमा; हज़ारों खेतों की भूरी, काली, संदली मिट्टी का गुण-धर्म; सूरज की किरणों का रूपांतर और हवा की थिरकन का सिमटा हुआ संकोच। फसल प्रकृति और मनुष्य के मिले-जुले श्रम का फल है।'
      check:
        prompt: '''फसल'' कविता के अनुसार फसल क्या है?'
        options:
        - प्रकृति और मनुष्य के श्रम का मिला-जुला फल
        - केवल किसान की मेहनत
        - केवल बारिश का पानी
        answer: प्रकृति और मनुष्य के श्रम का मिला-जुला फल
        why: पानी, मिट्टी, धूप, हवा और हाथ सब मिलकर फसल बनाते हैं।
  items:
  - prompt: '''दंतुरित मुसकान'' का अर्थ है:'
    options:
    - नए-नए दाँतों वाली मुस्कान
    - बिना दाँतों की मुस्कान
    - बड़े दाँतों वाली हँसी
    - रोती हुई मुस्कान
    answer: नए-नए दाँतों वाली मुस्कान
    difficulty: 1
    hints:
    - छोटे बच्चे के दाँत निकल रहे हैं।
    - दंत = दाँत।
    solution: दंतुरित मुसकान छोटे बच्चे की नए दाँतों वाली मुस्कान है।
    mistakes: {"बिना दाँतों की मुस्कान": "h10_danturit"}
  - prompt: बच्चे की मुस्कान का कवि पर क्या प्रभाव पड़ता है?
    options:
    - उनका कठोर मन भी पिघल जाता है
    - वे क्रोधित हो जाते हैं
    - वे घर छोड़ देते हैं
    - कोई प्रभाव नहीं
    answer: उनका कठोर मन भी पिघल जाता है
    difficulty: 1
    hints:
    - मृतक में भी जान डाल दे।
    - कमल खिल गया।
    solution: बच्चे की मुस्कान से कवि का कठोर हृदय कोमल हो जाता है।
    mistakes: {"वे क्रोधित हो जाते हैं": "h10_muskan_prabhav"}
  - prompt: बच्चा कवि को पहचान क्यों नहीं पाता?
    options:
    - कवि बहुत दिनों बाद घर लौटे हैं
    - कवि ने चेहरा ढका है
    - बच्चा अंधा है
    - कवि अजनबी हैं
    answer: कवि बहुत दिनों बाद घर लौटे हैं
    difficulty: 2
    hints:
    - '''चिर प्रवासी''।'
    - माँ परिचय कराती है।
    solution: कवि लंबे समय बाहर रहे, इसलिए बच्चा उन्हें पहचान नहीं पाता।
    mistakes: {"बच्चा अंधा है": "h10_pravasi"}
  - prompt: '''फसल'' कविता के अनुसार फसल में किसका योगदान है?'
    options:
    - पानी, श्रम, मिट्टी, धूप और हवा सबका
    - केवल किसान का
    - केवल वर्षा का
    - केवल बीज का
    answer: पानी, श्रम, मिट्टी, धूप और हवा सबका
    difficulty: 1
    hints:
    - कई चीज़ों का मेल।
    - हाथों का स्पर्श भी।
    solution: फसल नदियों के पानी, हाथों के श्रम, मिट्टी, सूर्य और हवा का सम्मिलित रूप है।
    mistakes: {"केवल किसान का": "h10_fasal"}
  - prompt: इन कविताओं के कवि कौन हैं?
    options:
    - नागार्जुन
    - निराला
    - मंगलेश डबराल
    - जयशंकर प्रसाद
    answer: नागार्जुन
    difficulty: 1
    hints:
    - जनकवि।
    - मैथिली में 'यात्री'।
    solution: दोनों कविताएँ नागार्जुन की हैं।
    mistakes:
      निराला: hin10_author
  - prompt: '''कनखी मारना'' का अर्थ है:'
    options:
    - तिरछी नज़र से देखना
    - आँखें बंद करना
    - रोना
    - हँसना
    answer: तिरछी नज़र से देखना
    difficulty: 2
    hints:
    - बच्चा चुपके से देखता है।
    - आँख के कोने से।
    solution: कनखी मारना यानी आँख के कोने से तिरछा देखना।
    mistakes: {"आँखें बंद करना": "h10_kankhi"}
  - prompt: बच्चे की मुस्कान किसमें भी जान डाल सकती है?
    options:
    - मृतक में
    - पत्थर में
    - पेड़ में
    - नदी में
    answer: मृतक में
    difficulty: 1
    hints:
    - कविता की पहली पंक्ति याद करो।
    - इतनी जीवनदायी मुस्कान।
    solution: '''यह दंतुरित मुसकान मृतक में भी डाल देगी जान।'''
    mistakes:
      पत्थर में: h10k5_bimb
  - prompt: धूल से सने बच्चे को देखकर कवि को कैसा लगता है?
    options:
    - मानो कमल तालाब छोड़कर झोंपड़ी में खिल रहे हों
    - बच्चा बहुत गंदा है
    - बच्चा बीमार है
    - बच्चा खेत में है
    answer: मानो कमल तालाब छोड़कर झोंपड़ी में खिल रहे हों
    difficulty: 2
    hints:
    - '''जलजात'' का अर्थ कमल।'
    - बच्चा सुंदर फूल-सा लगता है।
    solution: धूल-धूसरित बच्चा कवि को झोंपड़ी में खिले कमल-सा लगता है।
    mistakes:
      बच्चा बहुत गंदा है: h10k5_bimb
  - prompt: '''बाँस था कि बबूल'' से कवि अपने किस रूप की ओर इशारा करते हैं?'
    options:
    - अपने कठोर, नीरस मन की ओर
    - अपने बगीचे की ओर
    - अपने घर की ओर
    - अपनी लाठी की ओर
    answer: अपने कठोर, नीरस मन की ओर
    difficulty: 3
    hints:
    - बाँस और बबूल कठोर और काँटेदार हैं।
    - बच्चे के छूने से इनसे फूल झरने लगे।
    solution: कवि का कठोर मन बच्चे के स्पर्श से कोमल हो गया, जैसे बाँस-बबूल से शेफालिका झरे।
    mistakes:
      अपनी लाठी की ओर: h10k5_bimb
  - prompt: कवि बच्चे की माँ को धन्य क्यों कहते हैं?
    options:
    - उसी ने बच्चे को पाला और उसे मधुपर्क खिलाया
    - वह बहुत अमीर है
    - वह कवि की बहन है
    - वह गाना गाती है
    answer: उसी ने बच्चे को पाला और उसे मधुपर्क खिलाया
    difficulty: 2
