subject: cbse10-hin
chapter: 4
title: उत्साह · अट नहीं रही है
concepts:
- code: hin10c.k4.nirala
  title: उत्साह · अट नहीं रही है
  notes: |
    सूर्यकांत त्रिपाठी 'निराला' की दो कविताएँ। 'उत्साह' एक आह्वान गीत है: कवि बादल से गरजने को कहते हैं;
    बादल क्रांति और नवजीवन का प्रतीक है — वह तपती, विकल धरती को शीतल करेगा और नई कल्पना व ऊर्जा लाएगा।
    'नवजीवन वाले', 'वज्र छिपा' बादल; कवि 'बादल, गरजो!' कहते हैं, फुहार नहीं। 'अट नहीं रही है' फागुन (वसंत) की
    शोभा का चित्र है: फागुन की आभा इतनी अधिक है कि कहीं समा नहीं रही; पेड़ों पर हरे-लाल पत्ते, फूलों की
    सुगंध, मन उड़ने को करता है; आँख हटाने पर भी नहीं हटती।
  explanations:
    text: 'निराला की ''उत्साह'' में कवि बादलों से गरजने को कहते हैं, क्योंकि बादल क्रांति और नया जीवन लाते हैं। ''अट नहीं रही है'' में फागुन महीने की सुंदरता इतनी फैली है कि कहीं समाती नहीं: हर तरफ़ हरियाली, फूल और सुगंध।'
    visual: 'दो चित्र: एक में तपती धरती के ऊपर काले गरजते बादल, बिजली चमकती हुई; दूसरे में फागुन में लाल-हरी कोंपलों और फूलों से लदे पेड़।'
    step_by_step: '1. ''उत्साह'': बादल किसका प्रतीक? क्रांति, नवजीवन। 2. कवि गरजने को क्यों कहते हैं? 3. ''अट नहीं रही है'': फागुन का सौंदर्य। 4. दोनों कविताओं का भाव।'
    real_world: भीषण गर्मी के बाद पहली बारिश जैसे सबको नई ऊर्जा देती है, वैसे ही निराला बादल को परिवर्तन का प्रतीक मानते हैं।
  picture:
    kind: compare
    columns:
    - title: उत्साह
      points:
      - बादल से गरजने का आह्वान
      - बादल = क्रांति, नवजीवन
      - तपती धरती को शीतलता
    - title: अट नहीं रही है
      points:
      - फागुन (वसंत) की शोभा
      - सौंदर्य कहीं समा नहीं रहा
      - हरे-लाल पत्ते, फूल, सुगंध
    alt: 'निराला की दो कविताएँ: उत्साह में बादल क्रांति और नवजीवन का प्रतीक है; अट नहीं रही है में फागुन की शोभा का वर्णन है।'
  items:
  - prompt: '''उत्साह'' कविता में कवि बादल से क्या करने को कहते हैं?'
    options:
    - गरजने को
    - फुहार बरसाने को
    - चुप रहने को
    - चले जाने को
    answer: गरजने को
    difficulty: 1
    hints:
    - '''बादल, गरजो!'''
    - क्रांति का आह्वान।
    solution: कवि बादल से गरजने को कहते हैं, फुहार नहीं।
  - prompt: '''उत्साह'' में बादल किसका प्रतीक है?'
    options:
    - क्रांति और नवजीवन
    - दुख और निराशा
    - आलस्य
    - सर्दी
    answer: क्रांति और नवजीवन
    difficulty: 2
    hints:
    - वह धरती को नया जीवन देता है।
    - वज्र छिपा है।
    solution: बादल परिवर्तन, क्रांति और नए जीवन का प्रतीक है।
    mistakes:
      दुख और निराशा: hin10_poem_meaning
  - prompt: '''अट नहीं रही है'' कविता किस महीने की शोभा का वर्णन करती है?'
    options:
    - फागुन
    - सावन
    - जेठ
    - पूस
    answer: फागुन
    difficulty: 1
    hints:
    - वसंत ऋतु।
    - होली का महीना।
    solution: कविता फागुन महीने की शोभा का वर्णन करती है।
  - prompt: '''अट नहीं रही है'' का अर्थ है:'
    options:
    - समा नहीं रही है
    - रुक नहीं रही है
    - दिख नहीं रही है
    - आ नहीं रही है
    answer: समा नहीं रही है
    difficulty: 2
    hints:
    - शोभा बहुत अधिक है।
    - '''अटना'' = समाना।'
    solution: फागुन की शोभा इतनी है कि कहीं समा नहीं रही।
  - prompt: इन कविताओं के कवि कौन हैं?
    options:
    - सूर्यकांत त्रिपाठी 'निराला'
    - जयशंकर प्रसाद
    - नागार्जुन
    - तुलसीदास
    answer: सूर्यकांत त्रिपाठी 'निराला'
    difficulty: 1
    hints:
    - छायावाद के कवि।
    - '''राम की शक्तिपूजा''।'
    solution: दोनों कविताएँ निराला की हैं।
    mistakes:
      जयशंकर प्रसाद: hin10_author
  - prompt: '''उत्साह'' किस प्रकार का गीत है?'
    options:
    - आह्वान गीत
    - शोक गीत
    - लोरी
    - भजन
    answer: आह्वान गीत
    difficulty: 2
    hints:
    - बादल को पुकारना।
    - उत्साह जगाना।
    solution: उत्साह एक आह्वान गीत है, जिसमें बादल को परिवर्तन के लिए पुकारा गया है।
