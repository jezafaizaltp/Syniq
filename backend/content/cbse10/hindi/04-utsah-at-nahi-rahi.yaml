subject: cbse10-hin
chapter: 4
title: उत्साह · अट नहीं रही है
tips:
  h10_aahvan: "कवि बादल को पुकारकर बुला रहे हैं। पुकारने वाला गीत क्या कहलाता है?"
  h10_at: "शोभा इतनी अधिक है कि कहीं भरी नहीं जा रही। 'अटना' का अर्थ सोचो।"
  h10_garjo: "कविता क्रांति और जोश की है। कवि बादल से धीमे नहीं, ज़ोर से कुछ करने को कहते हैं।"
  h10_phagun: "सावन वर्षा का महीना है। यह कविता वसंत की शोभा की है, होली के आसपास।"
  h10k4_kavita: 'यहाँ दो कविताएँ हैं: एक में बादल से आह्वान है, दूसरी में फागुन की शोभा। पहले पहचानो कि प्रश्न किस कविता का है।'
  h10k4_badal: निराला के बादल केवल पानी नहीं लाते; वे क्रांति और नई ऊर्जा के प्रतीक हैं। पंक्ति का गहरा अर्थ सोचो।

concepts:
- code: hin10c.k4.nirala
  title: उत्साह · अट नहीं रही है
  notes: |
    सूर्यकांत त्रिपाठी 'निराला' की दो कविताएँ। 'उत्साह' एक आह्वान गीत है: कवि बादल से गरजने को कहते हैं;
    बादल क्रांति और नवजीवन का प्रतीक है — वह तपती, विकल धरती को शीतल करेगा और नई कल्पना व ऊर्जा लाएगा।
    'नवजीवन वाले', 'वज्र छिपा' बादल; कवि 'बादल, गरजो!' कहते हैं, फुहार नहीं। 'अट नहीं रही है' फागुन (वसंत) की
    शोभा का चित्र है: फागुन की आभा इतनी अधिक है कि कहीं समा नहीं रही; पेड़ों पर हरे-लाल पत्ते, फूलों की
    सुगंध, मन उड़ने को करता है; आँख हटाने पर भी नहीं हटती।
  explanations:
    text: 'निराला की ''उत्साह'' में कवि बादलों से गरजने को कहते हैं, क्योंकि बादल क्रांति और नया जीवन लाते हैं। ''अट नहीं रही है'' में फागुन महीने की सुंदरता इतनी फैली है कि कहीं समाती नहीं: हर तरफ़ हरियाली, फूल और सुगंध।'
    visual: 'दो चित्र: एक में तपती धरती के ऊपर काले गरजते बादल, बिजली चमकती हुई; दूसरे में फागुन में लाल-हरी कोंपलों और फूलों से लदे पेड़।'
    step_by_step: '1. ''उत्साह'': बादल किसका प्रतीक? क्रांति, नवजीवन। 2. कवि गरजने को क्यों कहते हैं? 3. ''अट नहीं रही है'': फागुन का सौंदर्य। 4. दोनों कविताओं का भाव।'
    real_world: भीषण गर्मी के बाद पहली बारिश जैसे सबको नई ऊर्जा देती है, वैसे ही निराला बादल को परिवर्तन का प्रतीक मानते हैं।
  picture:
    kind: compare
    columns:
    - title: उत्साह
      points:
      - बादल से गरजने का आह्वान
      - बादल = क्रांति, नवजीवन
      - तपती धरती को शीतलता
    - title: अट नहीं रही है
      points:
      - फागुन (वसंत) की शोभा
      - सौंदर्य कहीं समा नहीं रहा
      - हरे-लाल पत्ते, फूल, सुगंध
    alt: 'निराला की दो कविताएँ: उत्साह में बादल क्रांति और नवजीवन का प्रतीक है; अट नहीं रही है में फागुन की शोभा का वर्णन है।'
  activity:
    type: sort
    prompt: यह पंक्ति या भाव किस कविता का है?
    bins:
    - उत्साह
    - अट नहीं रही है
    items:
    - label: '"बादल, गरजो!"'
      bin: उत्साह
      clue: किस कविता में कवि बादल को पुकारते हैं?
      why: 'उत्साह एक आह्वान गीत है: बादल से गरजने को कहा।'
    - label: वज्र छिपा, नवजीवन वाले बादल
      bin: उत्साह
      clue: क्रांति का प्रतीक कौन है?
      why: 'बादल क्रांति और नवजीवन का प्रतीक: उत्साह।'
    - label: तपती, विकल धरती को शीतल करना
      bin: उत्साह
      clue: धरती को राहत कौन देगा?
      why: 'बादल धरती को शीतल करेगा: उत्साह।'
    - label: पेड़ों पर हरे-लाल पत्ते
      bin: अट नहीं रही है
      clue: यह किस ऋतु की शोभा है?
      why: 'फागुन की शोभा: अट नहीं रही है।'
    - label: आँख हटाने पर भी नहीं हटती
      bin: अट नहीं रही है
      clue: इतनी सुंदरता किस महीने की है?
      why: फागुन की आभा से आँख नहीं हटती।
    - label: शोभा कहीं समा नहीं रही
      bin: अट नहीं रही है
      clue: '''अटना'' का अर्थ है समाना।'
      why: 'कविता का शीर्षक भाव: फागुन की आभा समा नहीं रही।'
  lesson:
    - teach: '''उत्साह'' सूर्यकांत त्रिपाठी ''निराला'' का आह्वान गीत है। कवि बादल से कहते हैं: ''बादल, गरजो! घेर घेर घोर गगन, धाराधर ओ!'' बादल के काले घुँघराले रूप को वे बच्चों के बालों और कल्पना जैसा बताते हैं। बादल के हृदय में बिजली की चमक है और वह नई कविता का वज्र छिपाए है।'
      check:
        prompt: '''उत्साह'' में कवि बादल से क्या कहते हैं?'
        options:
        - गरजने को
        - चुप रहने को
        - उड़ जाने को
        answer: गरजने को
        why: गरजना शक्ति और क्रांति का संकेत है।
    - teach: गर्मी (निदाघ) से संसार के सब लोग बेचैन और उन्मन हैं। कवि बादल से कहते हैं कि अज्ञात दिशा से आकर तपती धरती को फिर जल से शीतल कर दो। बादल यहाँ पीड़ित लोगों को राहत देने वाले और समाज में नया जीवन व क्रांति लाने वाले का प्रतीक है।
      picture:
        kind: compare
        columns:
        - title: उत्साह
          points:
          - बादल से आह्वान
          - गरजो, बरसो
          - क्रांति और नवजीवन
        - title: अट नहीं रही है
          points:
          - फागुन की शोभा
          - घर-घर में सुगंध
          - आँख हटती नहीं
        alt: 'निराला की दो कविताओं की तुलना: उत्साह में बादल से गरजने का आह्वान है, अट नहीं रही है में फागुन की सुंदरता है।'
      check:
        prompt: '''निदाघ'' का अर्थ क्या है?'
        options:
        - गर्मी
        - वर्षा
        - सर्दी
        answer: गर्मी
        why: तपती धरती की ओर संकेत है।
    - teach: '''अट नहीं रही है'' में फागुन महीने की सुंदरता का वर्णन है। फागुन की आभा इतनी है कि वह कहीं समा नहीं रही। फागुन जब साँस लेता है तो घर-घर सुगंध से भर जाता है; वह मन को आकाश में उड़ने के लिए पंख लगा देता है। कवि आँख हटाना चाहते हैं, पर हटती नहीं। पेड़ों की डालें कहीं हरे, कहीं लाल पत्तों से लदी हैं और कहीं फूलों की माला-सी पड़ी है।'
      check:
        prompt: फागुन के साँस लेने से क्या होता है?
        options:
        - घर-घर सुगंध से भर जाते हैं
        - आँधी आती है
        - ठंड बढ़ जाती है
        answer: घर-घर सुगंध से भर जाते हैं
        why: फूलों की खुशबू हर जगह फैलती है।
  items:
  - prompt: '''उत्साह'' कविता में कवि बादल से क्या करने को कहते हैं?'
    options:
    - गरजने को
    - फुहार बरसाने को
    - चुप रहने को
    - चले जाने को
    answer: गरजने को
    difficulty: 1
    hints:
    - '''बादल, गरजो!'''
    - क्रांति का आह्वान।
    solution: कवि बादल से गरजने को कहते हैं, फुहार नहीं।
    mistakes: {"फुहार बरसाने को": "h10_garjo"}
  - prompt: '''उत्साह'' में बादल किसका प्रतीक है?'
    options:
    - क्रांति और नवजीवन
    - दुख और निराशा
    - आलस्य
    - सर्दी
    answer: क्रांति और नवजीवन
    difficulty: 2
    hints:
    - वह धरती को नया जीवन देता है।
    - वज्र छिपा है।
    solution: बादल परिवर्तन, क्रांति और नए जीवन का प्रतीक है।
    mistakes:
      दुख और निराशा: hin10_poem_meaning
  - prompt: '''अट नहीं रही है'' कविता किस महीने की शोभा का वर्णन करती है?'
    options:
    - फागुन
    - सावन
    - जेठ
    - पूस
    answer: फागुन
    difficulty: 1
    hints:
    - वसंत ऋतु।
    - होली का महीना।
    solution: कविता फागुन महीने की शोभा का वर्णन करती है।
    mistakes: {"सावन": "h10_phagun"}
  - prompt: '''अट नहीं रही है'' का अर्थ है:'
    options:
    - समा नहीं रही है
    - रुक नहीं रही है
    - दिख नहीं रही है
    - आ नहीं रही है
    answer: समा नहीं रही है
    difficulty: 2
    hints:
    - शोभा बहुत अधिक है।
    - '''अटना'' = समाना।'
    solution: फागुन की शोभा इतनी है कि कहीं समा नहीं रही।
    mistakes: {"रुक नहीं रही है": "h10_at"}
  - prompt: इन कविताओं के कवि कौन हैं?
    options:
    - सूर्यकांत त्रिपाठी 'निराला'
    - जयशंकर प्रसाद
    - नागार्जुन
    - तुलसीदास
    answer: सूर्यकांत त्रिपाठी 'निराला'
    difficulty: 1
    hints:
    - छायावाद के कवि।
    - '''राम की शक्तिपूजा''।'
    solution: दोनों कविताएँ निराला की हैं।
    mistakes:
      जयशंकर प्रसाद: hin10_author
  - prompt: '''उत्साह'' किस प्रकार का गीत है?'
    options:
    - आह्वान गीत
    - शोक गीत
    - लोरी
    - भजन
    answer: आह्वान गीत
    difficulty: 2
    hints:
    - बादल को पुकारना।
    - उत्साह जगाना।
    solution: उत्साह एक आह्वान गीत है, जिसमें बादल को परिवर्तन के लिए पुकारा गया है।
    mistakes: {"शोक गीत": "h10_aahvan"}
  - prompt: '''उत्साह'' में बादल के बालों को कैसा बताया गया है?'
    options:
    - ललित, काले, घुँघराले
    - सफ़ेद और सीधे
    - लाल और लंबे
    - सुनहरे
    answer: ललित, काले, घुँघराले
    difficulty: 2
    hints:
    - बादलों का रंग सोचो।
    - बच्चों के सुंदर बालों जैसे।
    solution: कवि ने बादलों को ललित, काले, घुँघराले बालों जैसा कहा है।
    mistakes:
      सफ़ेद और सीधे: h10k4_badal
  - prompt: कवि बादल के हृदय में क्या बताते हैं?
    options:
    - बिजली की चमक
    - बर्फ़
    - सूरज की किरण
    - चाँदनी
    answer: बिजली की चमक
    difficulty: 2
    hints:
    - '''विद्युत छबि उर में''।'
    - बादलों में जो चमकती है।
    solution: बादल के हृदय में विद्युत की छवि है।
    mistakes:
      चाँदनी: h10k4_badal
  - prompt: बादल के भीतर छिपे 'वज्र' को कवि किससे जोड़ते हैं?
    options:
    - नूतन कविता
    - पुराना युद्ध
    - खेती
    - राजा की सेना
    answer: नूतन कविता
    difficulty: 3
    hints:
    - कवि स्वयं कवि हैं।
    - नई सोच वाली रचना।
    solution: '''वज्र छिपा, नूतन कविता फिर भर दो'' — बादल नई कविता की शक्ति रखता है।'
    mistakes:
      पुराना युद्ध: h10k4_badal
  - prompt: '''उत्साह'' में संसार के लोग क्यों बेचैन हैं?'
    options:
    - भीषण गर्मी के कारण
    - बाढ़ के कारण
    - ठंड के कारण
    - युद्ध के कारण
    answer: भीषण गर्मी के कारण
    difficulty: 2
    hints:
    - '''विश्व के निदाघ के सकल जन''।'
    - धरती तप रही है।
    solution: गर्मी से सब लोग विकल और उन्मन हैं।
    mistakes:
      बाढ़ के कारण: h10k4_kavita
  - prompt: '''अट नहीं रही है'' में फागुन मन को क्या करने के लिए पंख देता है?'
    options:
    - आकाश में उड़ने के लिए
    - सोने के लिए
    - रोने के लिए
    - भागने के लिए
    answer: आकाश में उड़ने के लिए
    difficulty: 2
    hints:
    - '''उड़ने को नभ में तुम पर-पर कर देते हो''।'
    - मन उमंग से भर जाता है।
    solution: फागुन मन में उमंग भरकर उसे आकाश में उड़ाना चाहता है।
    mistakes:
      सोने के लिए: h10k4_kavita
  - prompt: कवि फागुन की शोभा से आँख क्यों नहीं हटा पाते?
    options:
    - वह इतनी सुंदर है कि आँख हटती नहीं
    - उनकी आँखें दुख रही हैं
    - उन्हें कुछ और दिखता नहीं
    - वे बीमार हैं
    answer: वह इतनी सुंदर है कि आँख हटती नहीं
    difficulty: 1
    hints:
    - '''आँख हटाता हूँ तो हट नहीं रही है''।'
    - सुंदरता मन बाँध लेती है।
    solution: फागुन की सुंदरता इतनी मोहक है कि कवि की नज़र उस पर टिकी रहती है।
    mistakes:
      उनकी आँखें दुख रही हैं: h10k4_kavita
  - prompt: फागुन में पेड़ों की डालें कैसी दिखती हैं?
    options:
    - कहीं हरे, कहीं लाल पत्तों से लदी
    - बिल्कुल सूखी
    - बर्फ़ से ढकी
    - पत्तों से खाली
    answer: कहीं हरे, कहीं लाल पत्तों से लदी
    difficulty: 2
    hints:
    - नए पत्ते आए हैं।
    - दो रंग बताए गए हैं।
    solution: डालें कहीं हरी, कहीं लाल पत्तियों से लदी हैं।
