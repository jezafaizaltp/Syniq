subject: cbse10-hin
chapter: 2
title: राम-लक्ष्मण-परशुराम संवाद
tips:
  h10_dhanuhi: "लक्ष्मण तुलना कर रहे हैं: टूटे धनुष जैसी चीज़ें बचपन में भी टूटती थीं।"
  h10_dhanush: "सभा में किसी के धनुष को कुछ हुआ था। वह धनुष किस देवता का था?"
  h10_doha_chaupai: "यह अंश रामचरितमानस से है। तुलसी ने मानस किन छंदों में लिखा?"
  h10_kumhadbatiya: "कुम्हड़े का छोटा फल उँगली दिखाने भर से मुरझा जाता है, ऐसी मान्यता है। लक्ष्मण कह रहे हैं कि हम वैसे नहीं।"
  h10_ram_swabhav: "क्रोध परशुराम का है और व्यंग्य लक्ष्मण का। राम कैसे बात करते हैं?"
  h10k2_patra: "संवाद के हर पात्र का स्वभाव अलग है: एक क्रोधी, एक विनम्र, एक व्यंग्य करने वाला, एक मन ही मन मुस्कुराने वाला। प्रश्न की बात किस स्वभाव से मेल खाती है?"
  h10k2_vyangya: लक्ष्मण सीधा नहीं, उलटा कहकर चोट करते हैं। पंक्ति में छिपे व्यंग्य को पहचानो।

concepts:
- code: hin10c.k2.samvad
  title: राम-लक्ष्मण-परशुराम संवाद
  notes: |
    तुलसीदास के 'रामचरितमानस' (बालकांड) से, अवधी में, दोहा-चौपाई छंद। सीता-स्वयंवर में राम द्वारा शिव-धनुष तोड़े
    जाने पर परशुराम क्रोधित होकर आते हैं। राम विनम्रता से कहते हैं कि धनुष तोड़ने वाला कोई आपका दास ही होगा।
    लक्ष्मण व्यंग्य करते हैं कि बचपन में हमने ऐसी बहुत-सी धनुहियाँ तोड़ीं, तब आपने क्रोध नहीं किया; यह पुराना
    धनुष तो राम के छूते ही टूट गया। परशुराम अपने फरसे, बाल-ब्रह्मचारी होने और सहस्रबाहु की भुजाएँ काटने की
    बात कहकर डराते हैं। लक्ष्मण कहते हैं कि वीर युद्ध में पराक्रम दिखाते हैं, बातों में नहीं; हम कुम्हड़बतिया
    (छुई-मुई) नहीं जो तर्जनी देखकर मुरझा जाएँ। विश्वामित्र मन ही मन हँसते हैं; राम शांत रहकर स्थिति सँभालते हैं।
  explanations:
    text: 'शिव का धनुष टूटने पर परशुराम बहुत क्रोधित होते हैं। राम विनम्र रहते हैं, पर लक्ष्मण व्यंग्य से उनका क्रोध और भड़का देते हैं: बचपन में तो हमने बहुत धनुहियाँ तोड़ी थीं! यह संवाद क्रोध और विनम्रता, वीरता और डींग के बीच का अंतर दिखाता है।'
    visual: 'कल्पना कीजिए: स्वयंवर-सभा में टूटा धनुष, फरसा उठाए क्रोधित परशुराम, मुस्कुराते लक्ष्मण, हाथ जोड़े शांत राम, और पास बैठे मन ही मन हँसते विश्वामित्र।'
    step_by_step: '1. प्रसंग: धनुष-भंग। 2. राम की विनम्रता। 3. लक्ष्मण के व्यंग्य: धनुहियाँ, पुराना धनुष। 4. परशुराम की डींग: फरसा, सहस्रबाहु। 5. लक्ष्मण का उत्तर: वीर बातें नहीं, काम करते हैं।'
    real_world: बहस में शांत रहने वाला अक्सर बात बिगड़ने से बचा लेता है, जैसे राम ने किया, जबकि चुभते व्यंग्य से गुस्सा और बढ़ता है।
  picture:
    kind: compare
    columns:
    - title: राम
      points:
      - विनम्र और शांत
      - धनुष तोड़ने वाला आपका दास होगा
      - क्रोध को शांत करते हैं
    - title: लक्ष्मण
      points:
      - व्यंग्य करते हैं
      - बचपन में बहुत धनुहियाँ तोड़ीं
      - वीर बातें नहीं, काम करते हैं
    - title: परशुराम
      points:
      - अत्यंत क्रोधित
      - फरसा और सहस्रबाहु की बात
      - अपनी वीरता की डींग
    alt: राम विनम्र और शांत हैं, लक्ष्मण व्यंग्य करते हैं, और परशुराम क्रोध में अपनी वीरता की बातें करते हैं।
  activity:
    type: sort
    prompt: संवाद में यह बात किसकी है?
    bins:
    - राम
    - लक्ष्मण
    - परशुराम
    items:
    - label: धनुष तोड़नेवाला कोई आपका दास होगा
      bin: राम
      clue: विनम्रता से कौन बोलता है?
      why: राम क्रोध को शांत करने के लिए विनम्र रहते हैं।
    - label: बचपन में बहुत-सी धनुहियाँ तोड़ीं
      bin: लक्ष्मण
      clue: व्यंग्य कौन करता है?
      why: लक्ष्मण कहते हैं, तब तो आपने क्रोध नहीं किया।
    - label: पुराना धनुष छूते ही टूट गया
      bin: लक्ष्मण
      clue: धनुष को मामूली कौन बता रहा है?
      why: 'लक्ष्मण का व्यंग्य: राम का दोष नहीं।'
    - label: हम कुम्हड़बतिया नहीं
      bin: लक्ष्मण
      clue: तर्जनी देखकर मुरझाने वाली बात कौन कहता है?
      why: लक्ष्मण बताते हैं कि वे डरनेवाले नहीं।
    - label: फरसा और सहस्रबाहु की भुजाएँ
      bin: परशुराम
      clue: डराने के लिए अपने पराक्रम की बात कौन करता है?
      why: परशुराम अपने फरसे से डराते हैं।
    - label: बाल-ब्रह्मचारी होने की बात
      bin: परशुराम
      clue: यह अपनी बड़ाई कौन कर रहा है?
      why: परशुराम अपना परिचय देकर धमकाते हैं।
  lesson:
    - teach: 'यह अंश तुलसीदास के ''रामचरितमानस'' के बालकांड से है और अवधी भाषा में दोहा-चौपाई छंद में है। सीता-स्वयंवर में राम ने शिव का धनुष तोड़ दिया। यह सुनकर परशुराम क्रोध में सभा में आते हैं। राम विनम्रता से कहते हैं: ''नाथ, शिव का धनुष तोड़ने वाला आपका ही कोई दास होगा।'''
      check:
        prompt: राम ने धनुष तोड़ने वाले को क्या बताया?
        options:
        - परशुराम का ही कोई दास
        - एक शत्रु राजा
        - स्वयं लक्ष्मण
        answer: परशुराम का ही कोई दास
        why: राम परशुराम का क्रोध विनम्रता से शांत करना चाहते हैं।
    - teach: 'परशुराम कहते हैं कि जिसने धनुष तोड़ा, वह सहस्रबाहु के समान उनका शत्रु है। लक्ष्मण व्यंग्य करते हैं कि बचपन में हमने बहुत-सी धनुहियाँ तोड़ीं, तब तो आप कभी नाराज़ नहीं हुए। परशुराम अपनी वीरता गिनाते हैं: वे बाल ब्रह्मचारी हैं, क्षत्रियकुल के शत्रु हैं, उन्होंने कई बार पृथ्वी को राजाओं से रहित किया और सहस्रबाहु की भुजाएँ काटीं।'
      picture:
        kind: compare
        columns:
        - title: परशुराम
          points:
          - क्रोधी
          - अपनी वीरता का बखान
          - फरसा दिखाते हैं
        - title: लक्ष्मण
          points:
          - निडर
          - व्यंग्य से उत्तर
          - शूरवीर बखान नहीं करते
        - title: राम
          points:
          - विनम्र
          - शांत
          - क्रोध पर जल जैसे वचन
        alt: 'तीन पात्रों की तुलना: परशुराम क्रोधी और अपनी वीरता का बखान करते हैं, लक्ष्मण निडर और व्यंग्य करते हैं, राम विनम्र और शांत हैं।'
      check:
        prompt: लक्ष्मण का स्वभाव कैसा दिखाया गया है?
        options:
        - निडर और व्यंग्य करने वाला
        - डरपोक
        - चुप रहने वाला
        answer: निडर और व्यंग्य करने वाला
        why: वे परशुराम के क्रोध से नहीं डरते।
    - teach: 'लक्ष्मण कहते हैं: ''यहाँ कोई कुम्हड़बतिया नहीं जो तर्जनी देखकर मुरझा जाए'' और ''शूरवीर युद्ध में वीरता दिखाते हैं, बखान नहीं करते।'' वे कहते हैं कि हमारे कुल में देवता, ब्राह्मण, भगवान के भक्त और गाय पर वीरता नहीं दिखाई जाती। विश्वामित्र मन ही मन हँसते हैं कि परशुराम राम-लक्ष्मण को गन्ने की खाँड़ समझ रहे हैं, जबकि वे लोहे की तलवार हैं।'
      check:
        prompt: '''अयमय खाँड़ न ऊखमय'' किसने मन में सोचा?'
        options:
        - विश्वामित्र
        - राम
        - जनक
        answer: विश्वामित्र
        why: वे परशुराम की नासमझी पर मन में हँसते हैं।
  items:
  - prompt: यह अंश किस ग्रंथ से लिया गया है?
    options:
    - रामचरितमानस
    - सूरसागर
    - पद्मावत
    - कामायनी
    answer: रामचरितमानस
    difficulty: 1
    hints:
    - तुलसीदास की रचना।
    - बालकांड।
    solution: यह तुलसीदास के रामचरितमानस के बालकांड से है।
    mistakes:
      सूरसागर: hin10_author
  - prompt: परशुराम क्रोधित क्यों हुए?
    options:
    - शिव का धनुष टूट गया था
    - राम ने उनका अपमान किया था
    - सीता ने उन्हें नहीं बुलाया
    - विश्वामित्र ने उन्हें रोका
    answer: शिव का धनुष टूट गया था
    difficulty: 1
    hints:
    - सीता-स्वयंवर।
    - शिव उनके गुरु।
    solution: स्वयंवर में शिव-धनुष टूटने पर परशुराम क्रोधित हुए।
    mistakes: {"राम ने उनका अपमान किया था": "h10_dhanush"}
  - prompt: लक्ष्मण ने बचपन की कौन-सी बात कहकर व्यंग्य किया?
    options:
    - हमने बचपन में बहुत-सी धनुहियाँ तोड़ीं
    - हमने बचपन में बहुत युद्ध जीते
    - हम बचपन में फरसा चलाते थे
    - हमने बचपन में बहुत पढ़ाई की
    answer: हमने बचपन में बहुत-सी धनुहियाँ तोड़ीं
    difficulty: 2
    hints:
    - छोटे धनुष।
    - तब आपने क्रोध नहीं किया।
    solution: लक्ष्मण कहते हैं कि बचपन में बहुत धनुहियाँ तोड़ीं, तब तो आप नाराज़ नहीं हुए।
    mistakes: {"हमने बचपन में बहुत युद्ध जीते": "h10_dhanuhi"}
  - prompt: राम का स्वभाव इस संवाद में कैसा है?
    options:
    - विनम्र और शांत
    - क्रोधी
    - व्यंग्यपूर्ण
    - डरपोक
    answer: विनम्र और शांत
    difficulty: 1
    hints:
    - वे परशुराम को 'नाथ' कहते हैं।
    - स्थिति सँभालते हैं।
    solution: राम विनम्रता और शांति से परशुराम का क्रोध कम करने का प्रयास करते हैं।
    mistakes: {"क्रोधी": "h10_ram_swabhav", "व्यंग्यपूर्ण": "h10_ram_swabhav"}
  - prompt: '''कुम्हड़बतिया'' से लक्ष्मण का क्या आशय है?'
    options:
    - कमज़ोर जो तर्जनी देखते ही मुरझा जाए
    - बहुत बलवान योद्धा
    - एक प्रकार का धनुष
    - परशुराम का फरसा
    answer: कमज़ोर जो तर्जनी देखते ही मुरझा जाए
    difficulty: 2
    hints:
    - छोटा कोमल फल।
    - हम ऐसे नहीं हैं।
    solution: लक्ष्मण कहते हैं कि वे कुम्हड़बतिया जैसे कमज़ोर नहीं जो उँगली देखकर डर जाएँ।
    mistakes: {"बहुत बलवान योद्धा": "h10_kumhadbatiya"}
  - prompt: यह अंश किस छंद में है?
    options:
    - दोहा-चौपाई
    - सवैया
    - पद
    - मुक्त छंद
    answer: दोहा-चौपाई
    difficulty: 2
    hints:
    - रामचरितमानस का छंद।
    - अवधी भाषा।
    solution: रामचरितमानस दोहा-चौपाई छंद में लिखा गया है।
    mistakes: {"सवैया": "h10_doha_chaupai"}
  - prompt: यह अंश किस भाषा में है?
    options:
    - अवधी
    - ब्रजभाषा
    - खड़ी बोली
    - संस्कृत
    answer: अवधी
    difficulty: 2
    hints:
    - रामचरितमानस की भाषा।
    - सूरदास की भाषा इससे अलग है।
    solution: रामचरितमानस अवधी में लिखा गया है।
    mistakes:
      ब्रजभाषा: hin10_author
  - prompt: परशुराम ने धनुष तोड़ने वाले को किसके समान शत्रु बताया?
    options:
    - सहस्रबाहु
    - रावण
    - कंस
    - दुर्योधन
    answer: सहस्रबाहु
    difficulty: 2
    hints:
    - जिसकी भुजाएँ परशुराम ने काटी थीं।
    - हज़ार भुजाओं वाला राजा।
    solution: परशुराम ने कहा कि धनुष तोड़ने वाला सहस्रबाहु के समान उनका शत्रु है।
    mistakes:
      रावण: h10k2_patra
  - prompt: परशुराम अपने को क्या कहते हैं?
    options:
    - बाल ब्रह्मचारी और क्षत्रियकुल का शत्रु
    - राम का सेवक
    - एक साधारण मुनि
    - जनक का मित्र
    answer: बाल ब्रह्मचारी और क्षत्रियकुल का शत्रु
    difficulty: 2
    hints:
    - वे अपनी वीरता का बखान करते हैं।
    - उन्होंने कई बार पृथ्वी को राजाओं से रहित किया।
