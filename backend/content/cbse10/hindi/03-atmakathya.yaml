subject: cbse10-hin
chapter: 3
title: आत्मकथ्य
concepts:
- code: hin10c.k3.atmakathya
  title: आत्मकथ्य
  notes: |
    जयशंकर प्रसाद की कविता, छायावादी शैली। प्रेमचंद के संपादन में 'हंस' पत्रिका के आत्मकथा विशेषांक के लिए
    मित्रों ने प्रसाद से आत्मकथा लिखने को कहा; उत्तर में उन्होंने यह कविता लिखी। मन रूपी भौंरा (मधुप) गुनगुनाकर
    अपनी कहानी कहता है; मुरझाई पत्तियाँ जीवन की नश्वरता दिखाती हैं। कवि कहते हैं कि उनका जीवन साधारण है,
    उसमें कोई बड़ी उपलब्धि नहीं; दूसरों की दुर्बलता और अपनी भूलें बताकर क्या होगा। सुख के मधुर क्षणों की
    स्मृतियाँ ('उज्ज्वल गाथा') वे अपने तक रखना चाहते हैं। 'छोटे से जीवन की कैसे बड़ी कथाएँ आज कहूँ?' 'अभी समय
    भी नहीं, थकी सोई है मेरी मौन व्यथा।' भाव: विनम्रता, निजी दुख को सार्वजनिक न करना।
  explanations:
    text: 'दोस्तों ने प्रसाद जी से अपनी आत्मकथा लिखने को कहा। जवाब में उन्होंने यह कविता लिखी: मेरा जीवन साधारण है, उसमें बताने लायक कोई बड़ी बात नहीं; मेरी मीठी यादें मेरी अपनी हैं और मेरी व्यथा अभी थककर सोई है, उसे मत जगाओ।'
    visual: 'कल्पना कीजिए: मुरझाते पत्तों के बीच गुनगुनाता एक भौंरा, और एक कवि जो अपनी डायरी बंद करके कहता है, ''अभी नहीं।'''
    step_by_step: '1. प्रसंग: ''हंस'' का आत्मकथा विशेषांक। 2. प्रतीक: मधुप (मन), मुरझाई पत्तियाँ। 3. कवि का तर्क: साधारण जीवन, भूलें और दूसरों की कमियाँ। 4. मधुर स्मृतियाँ निजी हैं। 5. निष्कर्ष: व्यथा को सोने दो।'
    real_world: कई लोग अपने निजी दुखों को सबके सामने नहीं रखना चाहते, और यह उनका अधिकार है, जैसा प्रसाद जी कहते हैं।
  picture:
    kind: flow
    steps:
    - मित्र आत्मकथा लिखने को कहते हैं
    - 'कवि: मेरा जीवन साधारण है'
    - दूसरों की कमियाँ, अपनी भूलें बताकर क्या होगा
    - मधुर स्मृतियाँ निजी हैं
    - '''थकी सोई है मेरी मौन व्यथा'''
    alt: 'आत्मकथ्य का भाव: मित्रों का आग्रह, साधारण जीवन, भूलें न बताना, निजी स्मृतियाँ, और सोई हुई व्यथा।'
  items:
  - prompt: '''आत्मकथ्य'' कविता के कवि कौन हैं?'
    options:
    - जयशंकर प्रसाद
    - सूर्यकांत त्रिपाठी 'निराला'
    - नागार्जुन
    - मंगलेश डबराल
    answer: जयशंकर प्रसाद
    difficulty: 1
    hints:
    - '''कामायनी'' के रचयिता।'
    - छायावाद।
    solution: आत्मकथ्य जयशंकर प्रसाद की कविता है।
    mistakes:
      सूर्यकांत त्रिपाठी 'निराला': hin10_author
  - prompt: यह कविता किस पत्रिका के विशेषांक के लिए लिखी गई?
    options:
    - हंस
    - सरस्वती
    - माधुरी
    - धर्मयुग
    answer: हंस
    difficulty: 2
    hints:
    - प्रेमचंद संपादक थे।
    - आत्मकथा विशेषांक।
    solution: प्रेमचंद के संपादन में 'हंस' के आत्मकथा विशेषांक के लिए।
  - prompt: कविता में 'मधुप' किसका प्रतीक है?
    options:
    - मन
    - राजा
    - पेड़
    - बादल
    answer: मन
    difficulty: 2
    hints:
    - मधुप = भौंरा।
    - गुनगुनाकर कहानी कहता है।
    solution: मधुप (भौंरा) कवि के मन का प्रतीक है।
    mistakes:
      राजा: hin10_poem_meaning
  - prompt: कवि आत्मकथा क्यों नहीं लिखना चाहते?
    options:
    - उनका जीवन साधारण है और वे अपने दुख व भूलें सबको नहीं बताना चाहते
    - उनके पास समय नहीं
    - उन्हें लिखना नहीं आता
    - प्रकाशक ने मना किया
    answer: उनका जीवन साधारण है और वे अपने दुख व भूलें सबको नहीं बताना चाहते
    difficulty: 2
    hints:
    - '''छोटे से जीवन की बड़ी कथाएँ''।'
    - विनम्रता।
    solution: वे अपने जीवन को साधारण मानते हैं और निजी व्यथा को सार्वजनिक नहीं करना चाहते।
  - prompt: '''थकी सोई है मेरी मौन व्यथा'' का अर्थ है:'
    options:
    - कवि का दुख अभी शांत है, उसे जगाना नहीं चाहते
    - कवि बहुत थके हुए हैं
    - कवि सो गए हैं
    - कवि का दुख समाप्त हो गया
    answer: कवि का दुख अभी शांत है, उसे जगाना नहीं चाहते
    difficulty: 2
    hints:
    - व्यथा = दुख।
    - आत्मकथा लिखने से वह जाग जाएगी।
    solution: कवि की पीड़ा अभी शांत है; आत्मकथा लिखकर वे उसे फिर जगाना नहीं चाहते।
  - prompt: जयशंकर प्रसाद किस काव्यधारा के प्रमुख कवि हैं?
    options:
    - छायावाद
    - भक्तिकाल
    - रीतिकाल
    - प्रगतिवाद
    answer: छायावाद
    difficulty: 1
    hints:
    - निराला, पंत, महादेवी भी।
    - कोमल भाव, प्रतीक।
    solution: प्रसाद छायावाद के प्रमुख कवि हैं।
