# CBSE Class 10 Hindi A (NCERT Kshitij 2), a selection of lessons. Chapter numbers here are SYNiq's own order.
# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hin
chapter: 3
title: आत्मकथ्य
tips:
  h10_atmakathya_kyon: "कवि कहते हैं उनका जीवन छोटा-सा है। वे अपनी कौन-सी बातें छिपाना चाहते हैं?"
  h10_chhayavad: "प्रसाद, पंत, निराला और महादेवी आधुनिक काल की एक ही धारा के चार स्तंभ हैं।"
  h10_hans: "यह विशेषांक प्रेमचंद के संपादन वाली पत्रिका का आत्मकथा अंक था।"
  h10_maun_vyatha: "यहाँ 'सोई' शरीर की नहीं, मन के दुख की बात है।"
  h10k3_pratik: 'प्रसाद प्रतीकों में बात करते हैं: मधुप, मुरझाती पत्तियाँ, खाली गागर। सोचो प्रतीक जीवन की किस बात की ओर इशारा करता है।'
  h10k3_kyon: 'कवि आत्मकथा लिखने से बचना चाहते हैं। उनके कारणों को याद करो: साधारण जीवन, दुख, मित्रों का छल, सुख का सपना।'

concepts:
- code: hin10c.k3.atmakathya
  title: आत्मकथ्य
  notes: |
    जयशंकर प्रसाद की कविता, छायावादी शैली। प्रेमचंद के संपादन में 'हंस' पत्रिका के आत्मकथा विशेषांक के लिए
    मित्रों ने प्रसाद से आत्मकथा लिखने को कहा; उत्तर में उन्होंने यह कविता लिखी। मन रूपी भौंरा (मधुप) गुनगुनाकर
    अपनी कहानी कहता है; मुरझाई पत्तियाँ जीवन की नश्वरता दिखाती हैं। कवि कहते हैं कि उनका जीवन साधारण है,
    उसमें कोई बड़ी उपलब्धि नहीं; दूसरों की दुर्बलता और अपनी भूलें बताकर क्या होगा। सुख के मधुर क्षणों की
    स्मृतियाँ ('उज्ज्वल गाथा') वे अपने तक रखना चाहते हैं। 'छोटे से जीवन की कैसे बड़ी कथाएँ आज कहूँ?' 'अभी समय
    भी नहीं, थकी सोई है मेरी मौन व्यथा।' भाव: विनम्रता, निजी दुख को सार्वजनिक न करना।
  explanations:
    text: 'दोस्तों ने प्रसाद जी से अपनी आत्मकथा लिखने को कहा। जवाब में उन्होंने यह कविता लिखी: मेरा जीवन साधारण है, उसमें बताने लायक कोई बड़ी बात नहीं; मेरी मीठी यादें मेरी अपनी हैं और मेरी व्यथा अभी थककर सोई है, उसे मत जगाओ।'
    visual: 'कल्पना कीजिए: मुरझाते पत्तों के बीच गुनगुनाता एक भौंरा, और एक कवि जो अपनी डायरी बंद करके कहता है, ''अभी नहीं।'''
    step_by_step: '1. प्रसंग: ''हंस'' का आत्मकथा विशेषांक। 2. प्रतीक: मधुप (मन), मुरझाई पत्तियाँ। 3. कवि का तर्क: साधारण जीवन, भूलें और दूसरों की कमियाँ। 4. मधुर स्मृतियाँ निजी हैं। 5. निष्कर्ष: व्यथा को सोने दो।'
    real_world: कई लोग अपने निजी दुखों को सबके सामने नहीं रखना चाहते, और यह उनका अधिकार है, जैसा प्रसाद जी कहते हैं।
  picture:
    kind: flow
    steps:
    - मित्र आत्मकथा लिखने को कहते हैं
    - 'कवि: मेरा जीवन साधारण है'
    - दूसरों की कमियाँ, अपनी भूलें बताकर क्या होगा
    - मधुर स्मृतियाँ निजी हैं
    - '''थकी सोई है मेरी मौन व्यथा'''
    alt: 'आत्मकथ्य का भाव: मित्रों का आग्रह, साधारण जीवन, भूलें न बताना, निजी स्मृतियाँ, और सोई हुई व्यथा।'
  activity:
    type: sort
    prompt: कविता में कवि आत्मकथा न लिखने के कारण बताते हैं। कौन-सा कारण किस तरह का है?
    bins:
    - जीवन साधारण है
    - दूसरों की बात न खोलना
    - सुख-दुख अपने तक
    items:
    - label: छोटे से जीवन की बड़ी कथाएँ कैसे कहूँ
      bin: जीवन साधारण है
      clue: कवि अपने जीवन को कितना बड़ा मानते हैं?
      why: 'कवि अपने जीवन को छोटा, साधारण बताते हैं: विनम्रता।'
    - label: कोई बड़ी उपलब्धि नहीं
      bin: जीवन साधारण है
      clue: क्या कवि कुछ विशेष बताने लायक मानते हैं?
      why: 'उपलब्धि न होना: साधारण जीवन।'
    - label: दूसरों की दुर्बलता बताकर क्या होगा
      bin: दूसरों की बात न खोलना
      clue: आत्मकथा में किसकी कमियाँ भी आ जाएँगी?
      why: कवि दूसरों की कमियाँ सामने नहीं लाना चाहते।
    - label: सुख के मधुर क्षणों की उज्ज्वल गाथा
      bin: सुख-दुख अपने तक
      clue: इन यादों को कवि सबको सुनाना चाहते हैं?
      why: सुख की स्मृतियाँ वे अपने तक रखना चाहते हैं।
    - label: थकी सोई है मेरी मौन व्यथा
      bin: सुख-दुख अपने तक
      clue: व्यथा को जगाना चाहते हैं?
      why: निजी दुख को सार्वजनिक नहीं करना चाहते।
  lesson:
    - teach: '''आत्मकथ्य'' जयशंकर प्रसाद की कविता है। प्रेमचंद के संपादन में ''हंस'' पत्रिका का आत्मकथा विशेषांक निकलना था; मित्रों ने प्रसाद से आत्मकथा लिखने को कहा। प्रसाद ने उत्तर में यह कविता लिखी (1932)। वे छायावाद के प्रमुख कवि हैं।'
      check:
        prompt: यह कविता किस अवसर पर लिखी गई?
        options:
        - हंस के आत्मकथा विशेषांक के लिए
        - स्वतंत्रता दिवस पर
        - एक विवाह पर
        answer: हंस के आत्मकथा विशेषांक के लिए
        why: मित्रों ने आत्मकथा लिखने का आग्रह किया था।
    - teach: कवि कहते हैं कि मधुप (मन रूपी भौंरा) गुनगुनाकर अपनी कहानी कह रहा है; मुरझाकर गिरती पत्तियाँ जीवन की नश्वरता दिखाती हैं। उनका जीवन खाली गागर जैसा है। वे डरते हैं कि आत्मकथा पढ़कर लोग उनकी भूलें और दुर्बलताएँ जानेंगे, और मित्रों के छल भी सामने आएँगे।
      picture:
        kind: compare
        columns:
        - title: प्रतीक
          points:
          - मधुप
          - मुरझाती पत्तियाँ
          - खाली गागर
        - title: अर्थ
          points:
          - कवि का मन
          - जीवन की नश्वरता
          - सुखों से खाली जीवन
        alt: 'कविता के प्रतीक और उनके अर्थ: मधुप मन है, मुरझाती पत्तियाँ नश्वरता हैं, खाली गागर सुखहीन जीवन है।'
      check:
        prompt: '''गागर रीती'' का क्या अर्थ है?'
        options:
        - खाली घड़ा, यानी सुखों से खाली जीवन
        - भरा घड़ा
        - टूटा घड़ा
        answer: खाली घड़ा, यानी सुखों से खाली जीवन
        why: कवि अपने जीवन को सुखहीन मानते हैं।
    - teach: 'कवि अपनी प्रिया के साथ बिताए सुंदर क्षणों (मधुर चाँदनी रातें, अनुरागिनी उषा) को निजी मानते हैं और उन्हें सबके सामने नहीं खोलना चाहते। वे कहते हैं: ''छोटे से जीवन की कैसे बड़ी कथाएँ आज कहूँ? क्या यह अच्छा नहीं कि औरों की सुनता मैं मौन रहूँ?'' उनकी स्मृतियाँ ही थके पथिक का पाथेय (रास्ते का सहारा) हैं, और उनकी मौन व्यथा अभी थककर सोई है।'
      check:
        prompt: कवि अपनी स्मृतियों को क्या कहते हैं?
        options:
        - थके पथिक का पाथेय
        - भारी बोझ
        - पुरानी किताब
        answer: थके पथिक का पाथेय
        why: यादें ही उनके जीवन-पथ का सहारा हैं।
  items:
  - prompt: '''आत्मकथ्य'' कविता के कवि कौन हैं?'
    options:
    - जयशंकर प्रसाद
    - सूर्यकांत त्रिपाठी 'निराला'
    - नागार्जुन
    - मंगलेश डबराल
    answer: जयशंकर प्रसाद
    difficulty: 1
    hints:
    - '''कामायनी'' के रचयिता।'
    - छायावाद।
    solution: आत्मकथ्य जयशंकर प्रसाद की कविता है।
    mistakes:
      सूर्यकांत त्रिपाठी 'निराला': hin10_author
  - prompt: यह कविता किस पत्रिका के विशेषांक के लिए लिखी गई?
    options:
    - हंस
    - सरस्वती
    - माधुरी
    - धर्मयुग
    answer: हंस
    difficulty: 2
    hints:
    - प्रेमचंद संपादक थे।
    - आत्मकथा विशेषांक।
    solution: प्रेमचंद के संपादन में 'हंस' के आत्मकथा विशेषांक के लिए।
    mistakes: {"सरस्वती": "h10_hans"}
  - prompt: कविता में 'मधुप' किसका प्रतीक है?
    options:
    - मन
    - राजा
    - पेड़
    - बादल
    answer: मन
    difficulty: 2
    hints:
    - मधुप = भौंरा।
    - गुनगुनाकर कहानी कहता है।
    solution: मधुप (भौंरा) कवि के मन का प्रतीक है।
    mistakes:
      राजा: hin10_poem_meaning
  - prompt: कवि आत्मकथा क्यों नहीं लिखना चाहते?
    options:
    - उनका जीवन साधारण है और वे अपने दुख व भूलें सबको नहीं बताना चाहते
    - उनके पास समय नहीं
    - उन्हें लिखना नहीं आता
    - प्रकाशक ने मना किया
    answer: उनका जीवन साधारण है और वे अपने दुख व भूलें सबको नहीं बताना चाहते
    difficulty: 2
    hints:
    - '''छोटे से जीवन की बड़ी कथाएँ''।'
    - विनम्रता।
    solution: वे अपने जीवन को साधारण मानते हैं और निजी व्यथा को सार्वजनिक नहीं करना चाहते।
    mistakes: {"उनके पास समय नहीं": "h10_atmakathya_kyon"}
  - prompt: '''थकी सोई है मेरी मौन व्यथा'' का अर्थ है:'
    options:
    - कवि का दुख अभी शांत है, उसे जगाना नहीं चाहते
    - कवि बहुत थके हुए हैं
    - कवि सो गए हैं
    - कवि का दुख समाप्त हो गया
    answer: कवि का दुख अभी शांत है, उसे जगाना नहीं चाहते
    difficulty: 2
    hints:
    - व्यथा = दुख।
    - आत्मकथा लिखने से वह जाग जाएगी।
    solution: कवि की पीड़ा अभी शांत है; आत्मकथा लिखकर वे उसे फिर जगाना नहीं चाहते।
    mistakes: {"कवि बहुत थके हुए हैं": "h10_maun_vyatha"}
  - prompt: जयशंकर प्रसाद किस काव्यधारा के प्रमुख कवि हैं?
    options:
    - छायावाद
    - भक्तिकाल
    - रीतिकाल
    - प्रगतिवाद
    answer: छायावाद
    difficulty: 1
    hints:
    - निराला, पंत, महादेवी भी।
    - कोमल भाव, प्रतीक।
    solution: प्रसाद छायावाद के प्रमुख कवि हैं।
    mistakes: {"भक्तिकाल": "h10_chhayavad"}
  - prompt: हंस पत्रिका के संपादक कौन थे?
    options:
    - प्रेमचंद
    - निराला
    - जयशंकर प्रसाद
    - नागार्जुन
    answer: प्रेमचंद
    difficulty: 2
    hints:
    - एक प्रसिद्ध कहानीकार।
    - उन्होंने 'गोदान' लिखा।
    solution: हंस का संपादन प्रेमचंद करते थे।
    mistakes:
      जयशंकर प्रसाद: hin10_author
  - prompt: '''मुरझाकर गिर रहीं पत्तियाँ'' किसका संकेत हैं?'
    options:
    - जीवन की नश्वरता और निराशा
    - बसंत ऋतु
    - हरा-भरा जीवन
    - बगीचे की सफ़ाई
    answer: जीवन की नश्वरता और निराशा
    difficulty: 2
    hints:
    - मुरझाना अंत का संकेत है।
    - जीवन भी ऐसे ही बीतता है।
    solution: गिरती पत्तियाँ जीवन के नश्वर होने और उदासी का प्रतीक हैं।
    mistakes:
      बसंत ऋतु: h10k3_pratik
  - prompt: कवि क्यों कहते हैं कि वे औरों की सुनते हुए मौन रहें?
    options:
    - अपने छोटे-से जीवन की बड़ी कथा कहना उन्हें ठीक नहीं लगता
    - वे बोल नहीं सकते
    - उन्हें सुनना ही पसंद है
    - मित्र उन्हें चुप कराते हैं
    answer: अपने छोटे-से जीवन की बड़ी कथा कहना उन्हें ठीक नहीं लगता
    difficulty: 2
    hints:
    - कवि विनम्र हैं।
    - '''छोटे से जीवन की कैसे बड़ी कथाएँ आज कहूँ?'''
    solution: कवि अपने जीवन को साधारण मानते हैं और उसकी बड़ी कथा कहना नहीं चाहते।
    mistakes:
      वे बोल नहीं सकते: h10k3_kyon
  - prompt: कवि मित्रों के बारे में क्या डर व्यक्त करते हैं?
    options:
    - आत्मकथा पढ़कर वे कवि को ही खाली करने वाला समझेंगे, जबकि छल उन्होंने किया
    - मित्र उनकी प्रशंसा करेंगे
    - मित्र उन्हें छोड़ देंगे
    - मित्र किताब नहीं पढ़ेंगे
    answer: आत्मकथा पढ़कर वे कवि को ही खाली करने वाला समझेंगे, जबकि छल उन्होंने किया
    difficulty: 3
    hints:
    - कवि ने 'विडंबना' शब्द कहा।
    - दूसरों ने उनका रस लेकर अपनी गागर भरी।
    solution: कवि कहते हैं कि कहीं मित्र उन्हें दोषी न समझें, जबकि उनका रस लेकर मित्रों ने अपनी गागर भरी।
    mistakes:
      मित्र उनकी प्रशंसा करेंगे: h10k3_kyon
  - prompt: '''उज्ज्वल गाथा कैसे गाऊँ, मधुर चाँदनी रातों की'' में किस बात का संकेत है?'
    options:
