subject: cbse10-hin
chapter: 10
title: एक कहानी यह भी
tips:
  h10_1946: "आज़ादी 1947 में मिली, पर लेखिका उससे पहले वाले साल आंदोलन में उतर चुकी थीं।"
  h10_atmakathya_vidha: "लेखिका इसमें अपने ही जीवन की कहानी कह रही हैं।"
  h10_heen: "लेखिका रंग में साँवली और बचपन में दुबली थीं। पिता किससे तुलना करते थे?"
  h10_shabdkosh: "पिता विद्वान थे और एक बड़ी भाषा-परियोजना पर काम करते थे, दो भाषाओं के शब्दों वाली।"
  h10_sheela: "यह व्यक्ति कॉलेज में हिंदी पढ़ाती थीं और लेखिका को किताबें चुनना सिखाया।"
  h10k10_vyakti: 'लेखिका के जीवन पर कुछ लोगों का गहरा असर पड़ा: पिता, माँ, प्राध्यापिका और बहन। प्रश्न किसके असर के बारे में है?'
  h10k10_andolan: 1946-47 के दिनों में लेखिका भाषण, जुलूस और हड़तालों में सक्रिय थीं। उस समय की घटनाएँ क्रम से याद करो।

concepts:
- code: hin10c.k10.mannu
  title: एक कहानी यह भी
  notes: |
    मन्नू भंडारी का आत्मकथ्य। उनका जन्म मध्य प्रदेश के भानपुरा में हुआ, पर बचपन और किशोरावस्था अजमेर के
    ब्रह्मपुरी मोहल्ले के दो-मंज़िला मकान में बीती। पिता पहले इंदौर में प्रतिष्ठित थे, आर्थिक झटके के बाद अजमेर
    आए; वे विद्वान, अहंवादी और शक्की स्वभाव के थे, अंग्रेज़ी-हिंदी शब्दकोश पर काम करते थे। मन्नू काली थीं और
    बचपन में दुबली, जबकि बड़ी बहन सुशीला गोरी और स्वस्थ थीं; पिता की तुलना से उनमें हीनभावना आई। माँ
    धैर्यवान और सहनशील थीं। हिंदी की प्राध्यापिका शीला अग्रवाल ने उन्हें साहित्य चुनने और देश की स्थिति पर
    सोचने की प्रेरणा दी। 1946–47 में वे स्वतंत्रता आंदोलन में सक्रिय रहीं, भाषण दिए, हड़तालें करवाईं; पिता
    कभी नाराज़ होते, कभी गर्व करते। कॉलेज ने उनके विरुद्ध अनुशासनात्मक कार्रवाई की, पर छात्राओं के विरोध से
    वापस लेनी पड़ी। 15 अगस्त 1947 को आज़ादी की खुशी।
  explanations:
    text: 'मन्नू भंडारी अपने बचपन और किशोरावस्था की कहानी कहती हैं: अजमेर का घर, शक्की पर विद्वान पिता, सहनशील माँ, और प्राध्यापिका शीला अग्रवाल, जिन्होंने उन्हें साहित्य और स्वतंत्रता आंदोलन की राह दिखाई। यह एक लड़की के आत्मविश्वासी लेखिका बनने की कहानी है।'
    visual: 'कल्पना कीजिए: अजमेर की गली में दो-मंज़िला घर; ऊपर किताबों से घिरे पिता; रसोई में माँ; और चौराहे पर नारे लगाती, भाषण देती युवा मन्नू।'
    step_by_step: '1. जन्म और बचपन: भानपुरा, अजमेर। 2. पिता का स्वभाव। 3. हीनभावना का कारण। 4. शीला अग्रवाल की प्रेरणा। 5. 1946–47 का आंदोलन और पिता से टकराव। 6. आज़ादी का दिन।'
    real_world: अच्छे शिक्षक किसी विद्यार्थी की पूरी दिशा बदल सकते हैं, जैसे शीला अग्रवाल ने मन्नू भंडारी के साथ किया।
  picture:
    kind: flow
    steps:
    - भानपुरा में जन्म, अजमेर में बचपन
    - शक्की पर विद्वान पिता, सहनशील माँ
    - शीला अग्रवाल से प्रेरणा
    - 1946–47 में आंदोलन में भाग
    - '15 अगस्त 1947: आज़ादी'
    alt: 'मन्नू भंडारी का जीवन-क्रम: भानपुरा में जन्म, अजमेर में बचपन, माता-पिता, शीला अग्रवाल की प्रेरणा, आंदोलन और आज़ादी।'
  activity:
    type: sort
    prompt: लेखिका पर किसका क्या प्रभाव पड़ा?
    bins:
    - पिता
    - माँ
    - शीला अग्रवाल
    items:
    - label: बड़ी बहन से तुलना, हीनभावना
      bin: पिता
      clue: सुशीला से तुलना कौन करता था?
      why: पिता की तुलना से मन्नू में हीनभावना आई।
    - label: शक्की और अहंवादी स्वभाव
      bin: पिता
      clue: शब्दकोश पर काम करनेवाले विद्वान कौन?
      why: पिता विद्वान पर शक्की, अहंवादी थे।
    - label: आंदोलन पर कभी नाराज़, कभी गर्व
      bin: पिता
      clue: मन्नू के भाषणों पर दोहरी प्रतिक्रिया किसकी?
      why: पिता कभी नाराज़ होते, कभी गर्व करते।
    - label: धैर्य और सहनशीलता
      bin: माँ
      clue: घर में चुपचाप सब कौन सहता था?
      why: माँ धैर्यवान और सहनशील थीं।
    - label: साहित्य चुनने की प्रेरणा
      bin: शीला अग्रवाल
      clue: हिंदी की प्राध्यापिका कौन थीं?
      why: शीला अग्रवाल ने साहित्य की राह दिखाई।
    - label: देश की स्थिति पर सोचना
      bin: शीला अग्रवाल
      clue: कॉलेज में किसने आंदोलन की ओर मोड़ा?
      why: शीला अग्रवाल की प्रेरणा।
  lesson:
    - teach: '''एक कहानी यह भी'' मन्नू भंडारी का आत्मकथ्य है। उनका जन्म मध्य प्रदेश के भानपुरा गाँव में हुआ, पर बचपन अजमेर के ब्रह्मपुरी मोहल्ले में बीता। पिता इंदौर से अजमेर आए थे और अंग्रेज़ी-हिंदी विषयवार शब्दकोश बनाने में लगे थे। आर्थिक कठिनाइयों ने उन्हें शक्की और क्रोधी बना दिया था। माँ धैर्यवान और सहनशील थीं, पर लेखिका उन्हें आदर्श नहीं मान सकीं।'
      check:
        prompt: लेखिका का बचपन किस शहर में बीता?
        options:
        - अजमेर
        - इंदौर
        - दिल्ली
        answer: अजमेर
        why: ब्रह्मपुरी मोहल्ले में उनका घर था।
    - teach: पिता लेखिका की तुलना उनकी गोरी, स्वस्थ बड़ी बहन सुशीला से करते थे, जिससे लेखिका के मन में हीनभावना बैठ गई। फिर भी पिता ने उन्हें रसोई से दूर रखकर घर की राजनीतिक बहसों में बैठने दिया। सावित्री गर्ल्स कॉलेज की प्राध्यापिका शीला अग्रवाल ने उन्हें अच्छे साहित्य से जोड़ा और देश की स्थितियों में सक्रिय भागीदारी की प्रेरणा दी।
      picture:
        kind: compare
        columns:
        - title: पिता
          points:
          - शक्की और क्रोधी
          - बहन से तुलना
          - राजनीतिक बहसों में बैठाया
        - title: शीला अग्रवाल
          points:
          - साहित्य से जोड़ा
          - देशप्रेम जगाया
          - सक्रिय भागीदारी की प्रेरणा
        alt: 'लेखिका पर दो प्रभाव: पिता शक्की और क्रोधी थे पर राजनीतिक बहसों में बैठाते थे, शीला अग्रवाल ने साहित्य और देशप्रेम जगाया।'
      check:
        prompt: लेखिका को साहित्य और देश-प्रेम की प्रेरणा किसने दी?
        options:
        - शीला अग्रवाल ने
        - बहन सुशीला ने
        - माँ ने
        answer: शीला अग्रवाल ने
        why: वे लेखिका की प्राध्यापिका थीं।
    - teach: '1946-47 में लेखिका स्वतंत्रता आंदोलन में सक्रिय हो गईं: हड़तालें, जुलूस, भाषण। पिता को यह पसंद नहीं था, पर जब अजमेर के चौपड़ पर उनके भाषण की डॉ. अंबालाल ने प्रशंसा की, तो पिता गर्व से भर गए। कॉलेज ने शीला अग्रवाल को नोटिस दिया और थर्ड ईयर की कक्षाएँ बंद कीं, पर लड़कियों के आंदोलन से वे फिर खुलीं। पिता के दो विरोधी पहलू थे: आधुनिकता और यश की चाह, साथ ही परंपरागत सोच।'
      check:
        prompt: लेखिका के भाषण की प्रशंसा किसने की?
        options:
        - डॉ. अंबालाल ने
        - प्रिंसिपल ने
        - पड़ोसियों ने
        answer: डॉ. अंबालाल ने
        why: वे पिता के मित्र और शहर के प्रतिष्ठित व्यक्ति थे।
  items:
  - prompt: '''एक कहानी यह भी'' किस विधा की रचना है?'
    options:
    - आत्मकथ्य
    - कविता
    - नाटक
    - निबंध
    answer: आत्मकथ्य
    difficulty: 1
    hints:
    - लेखिका अपने बारे में लिखती हैं।
    - जीवन की घटनाएँ।
    solution: यह मन्नू भंडारी का आत्मकथ्य है।
    mistakes: {"कविता": "h10_atmakathya_vidha"}
  - prompt: मन्नू भंडारी का बचपन किस शहर में बीता?
    options:
    - अजमेर
    - इंदौर
    - दिल्ली
    - भोपाल
    answer: अजमेर
    difficulty: 1
    hints:
    - ब्रह्मपुरी मोहल्ला।
    - राजस्थान।
    solution: उनका बचपन अजमेर के ब्रह्मपुरी मोहल्ले में बीता।
    mistakes:
      इंदौर: hin10_read_again
  - prompt: लेखिका को साहित्य और देश-प्रेम की प्रेरणा किससे मिली?
    options:
    - प्राध्यापिका शीला अग्रवाल से
    - बड़ी बहन सुशीला से
    - पड़ोसी से
    - अपने भाई से
    answer: प्राध्यापिका शीला अग्रवाल से
    difficulty: 2
    hints:
    - हिंदी की प्राध्यापिका।
    - कॉलेज।
    solution: हिंदी प्राध्यापिका शीला अग्रवाल ने उन्हें प्रेरित किया।
    mistakes: {"बड़ी बहन सुशीला से": "h10_sheela"}
  - prompt: लेखिका के मन में हीनभावना क्यों आई?
    options:
    - पिता उनकी गोरी, स्वस्थ बहन से तुलना करते थे
    - वे पढ़ाई में कमज़ोर थीं
    - उनके पास पैसे नहीं थे
    - उनके दोस्त नहीं थे
    answer: पिता उनकी गोरी, स्वस्थ बहन से तुलना करते थे
    difficulty: 2
    hints:
    - वे काली और दुबली थीं।
    - बहन सुशीला।
    solution: पिता की तुलना से उनमें हीनभावना आ गई।
    mistakes: {"वे पढ़ाई में कमज़ोर थीं": "h10_heen"}
  - prompt: लेखिका किस वर्ष स्वतंत्रता आंदोलन में सक्रिय हुईं? (पहला वर्ष लिखें)
    answer: '1946'
    check: 1947 - 1
    difficulty: 2
    hints:
    - आज़ादी से एक साल पहले।
    - 1946–47।
    solution: वे 1946–47 में आंदोलन में सक्रिय रहीं।
    mistakes: {"1947": "h10_1946"}
  - prompt: लेखिका के पिता किस काम में लगे थे?
    options:
    - अंग्रेज़ी-हिंदी शब्दकोश बनाने में
    - खेती में
    - व्यापार में
    - सेना में
    answer: अंग्रेज़ी-हिंदी शब्दकोश बनाने में
    difficulty: 2
    hints:
    - विद्वान व्यक्ति।
    - भाषा का काम।
    solution: वे अंग्रेज़ी-हिंदी शब्दकोश पर काम कर रहे थे।
    mistakes: {"व्यापार में": "h10_shabdkosh"}
  - prompt: मन्नू भंडारी का जन्म कहाँ हुआ?
    options:
    - मध्य प्रदेश के भानपुरा गाँव में
