subject: cbse10-hin
chapter: 10
title: एक कहानी यह भी
concepts:
- code: hin10c.k10.mannu
  title: एक कहानी यह भी
  notes: |
    मन्नू भंडारी का आत्मकथ्य। उनका जन्म मध्य प्रदेश के भानपुरा में हुआ, पर बचपन और किशोरावस्था अजमेर के
    ब्रह्मपुरी मोहल्ले के दो-मंज़िला मकान में बीती। पिता पहले इंदौर में प्रतिष्ठित थे, आर्थिक झटके के बाद अजमेर
    आए; वे विद्वान, अहंवादी और शक्की स्वभाव के थे, अंग्रेज़ी-हिंदी शब्दकोश पर काम करते थे। मन्नू काली थीं और
    बचपन में दुबली, जबकि बड़ी बहन सुशीला गोरी और स्वस्थ थीं; पिता की तुलना से उनमें हीनभावना आई। माँ
    धैर्यवान और सहनशील थीं। हिंदी की प्राध्यापिका शीला अग्रवाल ने उन्हें साहित्य चुनने और देश की स्थिति पर
    सोचने की प्रेरणा दी। 1946–47 में वे स्वतंत्रता आंदोलन में सक्रिय रहीं, भाषण दिए, हड़तालें करवाईं; पिता
    कभी नाराज़ होते, कभी गर्व करते। कॉलेज ने उनके विरुद्ध अनुशासनात्मक कार्रवाई की, पर छात्राओं के विरोध से
    वापस लेनी पड़ी। 15 अगस्त 1947 को आज़ादी की खुशी।
  explanations:
    text: 'मन्नू भंडारी अपने बचपन और किशोरावस्था की कहानी कहती हैं: अजमेर का घर, शक्की पर विद्वान पिता, सहनशील माँ, और प्राध्यापिका शीला अग्रवाल, जिन्होंने उन्हें साहित्य और स्वतंत्रता आंदोलन की राह दिखाई। यह एक लड़की के आत्मविश्वासी लेखिका बनने की कहानी है।'
    visual: 'कल्पना कीजिए: अजमेर की गली में दो-मंज़िला घर; ऊपर किताबों से घिरे पिता; रसोई में माँ; और चौराहे पर नारे लगाती, भाषण देती युवा मन्नू।'
    step_by_step: '1. जन्म और बचपन: भानपुरा, अजमेर। 2. पिता का स्वभाव। 3. हीनभावना का कारण। 4. शीला अग्रवाल की प्रेरणा। 5. 1946–47 का आंदोलन और पिता से टकराव। 6. आज़ादी का दिन।'
    real_world: अच्छे शिक्षक किसी विद्यार्थी की पूरी दिशा बदल सकते हैं, जैसे शीला अग्रवाल ने मन्नू भंडारी के साथ किया।
  picture:
    kind: flow
    steps:
    - भानपुरा में जन्म, अजमेर में बचपन
    - शक्की पर विद्वान पिता, सहनशील माँ
    - शीला अग्रवाल से प्रेरणा
    - 1946–47 में आंदोलन में भाग
    - '15 अगस्त 1947: आज़ादी'
    alt: 'मन्नू भंडारी का जीवन-क्रम: भानपुरा में जन्म, अजमेर में बचपन, माता-पिता, शीला अग्रवाल की प्रेरणा, आंदोलन और आज़ादी।'
  items:
  - prompt: '''एक कहानी यह भी'' किस विधा की रचना है?'
    options:
    - आत्मकथ्य
    - कविता
    - नाटक
    - निबंध
    answer: आत्मकथ्य
    difficulty: 1
    hints:
    - लेखिका अपने बारे में लिखती हैं।
    - जीवन की घटनाएँ।
    solution: यह मन्नू भंडारी का आत्मकथ्य है।
  - prompt: मन्नू भंडारी का बचपन किस शहर में बीता?
    options:
    - अजमेर
    - इंदौर
    - दिल्ली
    - भोपाल
    answer: अजमेर
    difficulty: 1
    hints:
    - ब्रह्मपुरी मोहल्ला।
    - राजस्थान।
    solution: उनका बचपन अजमेर के ब्रह्मपुरी मोहल्ले में बीता।
    mistakes:
      इंदौर: hin10_read_again
  - prompt: लेखिका को साहित्य और देश-प्रेम की प्रेरणा किससे मिली?
    options:
    - प्राध्यापिका शीला अग्रवाल से
    - बड़ी बहन सुशीला से
    - पड़ोसी से
    - अपने भाई से
    answer: प्राध्यापिका शीला अग्रवाल से
    difficulty: 2
    hints:
    - हिंदी की प्राध्यापिका।
    - कॉलेज।
    solution: हिंदी प्राध्यापिका शीला अग्रवाल ने उन्हें प्रेरित किया।
  - prompt: लेखिका के मन में हीनभावना क्यों आई?
    options:
    - पिता उनकी गोरी, स्वस्थ बहन से तुलना करते थे
    - वे पढ़ाई में कमज़ोर थीं
    - उनके पास पैसे नहीं थे
    - उनके दोस्त नहीं थे
    answer: पिता उनकी गोरी, स्वस्थ बहन से तुलना करते थे
    difficulty: 2
    hints:
    - वे काली और दुबली थीं।
    - बहन सुशीला।
    solution: पिता की तुलना से उनमें हीनभावना आ गई।
  - prompt: लेखिका किस वर्ष स्वतंत्रता आंदोलन में सक्रिय हुईं? (पहला वर्ष लिखें)
    answer: '1946'
    check: 1947 - 1
    difficulty: 2
    hints:
    - आज़ादी से एक साल पहले।
    - 1946–47।
    solution: वे 1946–47 में आंदोलन में सक्रिय रहीं।
  - prompt: लेखिका के पिता किस काम में लगे थे?
    options:
    - अंग्रेज़ी-हिंदी शब्दकोश बनाने में
    - खेती में
    - व्यापार में
    - सेना में
    answer: अंग्रेज़ी-हिंदी शब्दकोश बनाने में
    difficulty: 2
    hints:
    - विद्वान व्यक्ति।
    - भाषा का काम।
    solution: वे अंग्रेज़ी-हिंदी शब्दकोश पर काम कर रहे थे।
