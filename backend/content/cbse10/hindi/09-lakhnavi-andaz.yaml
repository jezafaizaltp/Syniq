subject: cbse10-hin
chapter: 9
title: लखनवी अंदाज़
tips:
  h10_bojh: "नवाब साहब खीरे की तारीफ़ भी करते हैं। उनका बहाना पेट से जुड़ा था।"
  h10_kheera: "पूरी कहानी एक सब्ज़ी के इर्द-गिर्द घूमती है, जिसे नवाब साहब ने काटा, नमक-मिर्च लगाया पर खाया नहीं।"
  h10_phanken: "नवाब साहब ने फाँकों का केवल स्वाद 'सूँघकर' लिया। फिर उनका क्या किया?"
  h10_second_class: "लेखक नवाब साहब को जानते तक नहीं थे। वे भीड़ से बचकर क्या करना चाहते थे?"
  h10_vyangya: "लेखक सोचते हैं: बिना खीरा खाए पेट भर सकता है तो बिना कथ्य के कहानी भी बन सकती है।"
  h10k9_kram: नवाब साहब ने खीरे के साथ एक-एक करके बहुत-सा दिखावा किया। उस क्रम को फिर से याद करो।
  h10k9_vyangya: 'लेखक दो चीज़ों पर हँसते हैं: नवाबी दिखावे पर, और बिना घटना-पात्र की ''नई कहानी'' पर। प्रश्न किस ओर इशारा करता है?'

concepts:
- code: hin10c.k9.lakhnavi
  title: लखनवी अंदाज़
  notes: |
    यशपाल की व्यंग्य कहानी। लेखक भीड़ से बचने और एकांत में नई कहानी सोचने के लिए पैसेंजर ट्रेन के सेकंड क्लास
    डिब्बे में चढ़ते हैं। वहाँ एक सफ़ेदपोश नवाब साहब पालथी मारे बैठे हैं, जिनके सामने तौलिए पर दो ताज़े, चिकने
    खीरे रखे हैं। लेखक के आने से नवाब साहब असंतुष्ट दिखते हैं। कुछ देर बाद वे खीरे धोकर, छीलकर, फाँकें काटकर,
    नमक-मिर्च बुरककर लेखक से भी खाने को पूछते हैं; लेखक मना कर देते हैं। नवाब साहब फाँकों को उठाकर सूँघते,
    स्वाद का आनंद लेते और खिड़की से बाहर फेंक देते हैं, फिर डकार लेकर कहते हैं कि खीरा लज़ीज़ होता है पर
    पेट पर बोझ डालता है। लेखक सोचते हैं: जब खीरे की सुगंध और स्वाद की कल्पना से पेट भर सकता है, तो बिना
    विचार, घटना और पात्रों के नई कहानी क्यों नहीं लिखी जा सकती? व्यंग्य: दिखावे वाली नवाबी और 'नई कहानी' पर।
  explanations:
    text: 'ट्रेन में लेखक एक नवाब साहब से मिलते हैं जो बड़ी नज़ाकत से खीरा काटकर, नमक-मिर्च लगाकर, केवल सूँघते हैं और खिड़की से फेंक देते हैं, मानो खुशबू से ही पेट भर गया हो। इस दिखावे पर लेखक व्यंग्य करते हैं: तब तो बिना कहानी के भी कहानी लिखी जा सकती है!'
    visual: 'कल्पना कीजिए: सेकंड क्लास के डिब्बे में पालथी मारे नवाब साहब, तौलिए पर करीने से सजी खीरे की फाँकें, और खिड़की से बाहर उड़ती फाँकें।'
    step_by_step: '1. लेखक सेकंड क्लास में क्यों चढ़े? 2. नवाब साहब और खीरे। 3. खीरा तैयार करने की विधि। 4. सूँघकर फेंकना। 5. लेखक का निष्कर्ष: नई कहानी पर व्यंग्य।'
    real_world: आज भी कुछ लोग केवल दिखाने के लिए महँगी चीज़ें खरीदते हैं, उनका उपयोग नहीं करते; यही नवाबी दिखावा है।
  picture:
    kind: flow
    steps:
    - लेखक सेकंड क्लास डिब्बे में चढ़ते हैं
    - नवाब साहब के सामने दो खीरे रखे हैं
    - वे खीरे छीलकर नमक-मिर्च लगाते हैं
    - फाँकें सूँघकर खिड़की से फेंक देते हैं
    - 'लेखक: बिना घटना-पात्र के भी कहानी!'
    alt: 'लखनवी अंदाज़ की घटनाएँ: सेकंड क्लास डिब्बा, नवाब साहब के खीरे, नमक-मिर्च, सूँघकर फेंकना, और लेखक का व्यंग्यपूर्ण निष्कर्ष।'
  activity:
    type: order
    prompt: नवाब साहब ने खीरे के साथ क्या-क्या किया? क्रम से लगाओ।
    steps:
    - खीरे धोए
    - छीलकर फाँकें काटीं
    - नमक-मिर्च बुरका
    - फाँकें सूँघकर खिड़की से बाहर फेंकीं
    - 'डकार लेकर: खीरा पेट पर बोझ डालता है'
    reasons:
      छीलकर फाँकें काटीं: पहले धोया, फिर छीला।
      नमक-मिर्च बुरका: नमक-मिर्च फाँकों पर ही बुरका जा सकता है।
      फाँकें सूँघकर खिड़की से बाहर फेंकीं: सजी हुई फाँकों को ही सूँघा गया।
      'डकार लेकर: खीरा पेट पर बोझ डालता है': 'डकार ''खाने'' के बाद ली जाती है: व्यंग्य यहीं है।'
  lesson:
    - teach: '''लखनवी अंदाज़'' यशपाल का व्यंग्य है। लेखक भीड़ से बचने और नई कहानी पर सोचने के लिए पैसेंजर ट्रेन के सेकंड क्लास के डिब्बे में चढ़े। वहाँ एक सफ़ेदपोश नवाब साहब पालथी मारे बैठे थे; उनके सामने तौलिये पर दो ताज़े, चिकने खीरे रखे थे। लेखक के आने से वे असंतुष्ट दिखे।'
      check:
        prompt: लेखक सेकंड क्लास में क्यों बैठे?
        options:
        - भीड़ से बचकर कहानी पर सोचने के लिए
        - वह सस्ता था
        - नवाब साहब से मिलने
        answer: भीड़ से बचकर कहानी पर सोचने के लिए
        why: उन्हें एकांत चाहिए था।
    - teach: नवाब साहब ने लेखक को खीरा खाने का न्योता दिया; लेखक ने मना किया। फिर नवाब ने खीरे धोए, तौलिये से पोंछे, सिर काटकर झाग निकाला, छीलकर फाँकें बनाईं और उन पर जीरा-मिला नमक और लाल मिर्च बुरकी। फिर हर फाँक को सूँघकर स्वाद का आनंद लिया और खिड़की से बाहर फेंक दिया। अंत में तौलिये से हाथ-मुँह पोंछकर गर्व से डकार ली और लेट गए।
      picture:
        kind: flow
        steps:
        - खीरे धोए-पोंछे
        - छीलकर फाँकें
        - नमक-मिर्च बुरका
        - फाँकें सूँघीं
        - खिड़की से फेंकीं
        - डकार ली
        alt: 'नवाब साहब का खीरा-प्रसंग: धोना-पोंछना, छीलना और फाँकें बनाना, नमक-मिर्च बुरकना, सूँघना, खिड़की से फेंकना और डकार लेना।'
      check:
        prompt: नवाब साहब ने फाँकों का अंत में क्या किया?
        options:
        - सूँघकर खिड़की से फेंक दीं
        - खा लीं
        - लेखक को दे दीं
        answer: सूँघकर खिड़की से फेंक दीं
        why: वे दिखाना चाहते थे कि खीरा खाना उनकी शान के ख़िलाफ़ है।
    - teach: 'नवाब साहब ने कहा कि खीरा लज़ीज़ होता है पर पेट पर बोझ डालता है। लेखक सोचते हैं: जब खीरे की सुगंध और स्वाद की कल्पना से पेट भर सकता है और डकार आ सकती है, तो बिना घटना, पात्र और विचार के ''नई कहानी'' क्यों नहीं लिखी जा सकती? यह पतनशील सामंती दिखावे और बिना कथ्य की कहानी, दोनों पर व्यंग्य है।'
      check:
        prompt: कहानी में किस पर व्यंग्य है?
        options:
        - नवाबी दिखावे और बिना कथ्य की नई कहानी पर
        - रेलवे पर
        - किसानों पर
        answer: नवाबी दिखावे और बिना कथ्य की नई कहानी पर
        why: लेखक दोनों को खोखला मानते हैं।
  items:
  - prompt: नवाब साहब के सामने क्या रखा था?
    options:
    - दो ताज़े खीरे
    - आम
    - मिठाई
    - किताबें
    answer: दो ताज़े खीरे
    difficulty: 1
    hints:
    - तौलिए पर।
    - हरे और चिकने।
    solution: उनके सामने तौलिए पर दो ताज़े खीरे रखे थे।
    mistakes: {"आम": "h10_kheera"}
  - prompt: लेखक सेकंड क्लास में क्यों चढ़े?
    options:
    - भीड़ से बचने और एकांत में नई कहानी सोचने के लिए
    - फ़र्स्ट क्लास बंद था
    - नवाब साहब से मिलने
    - टिकट मुफ़्त था
    answer: भीड़ से बचने और एकांत में नई कहानी सोचने के लिए
    difficulty: 2
    hints:
    - सेकंड क्लास में भीड़ कम।
    - वे लेखक हैं।
    solution: वे एकांत में नई कहानी के बारे में सोचना चाहते थे।
    mistakes: {"नवाब साहब से मिलने": "h10_second_class"}
  - prompt: नवाब साहब ने खीरे की फाँकों का क्या किया?
    options:
    - सूँघकर खिड़की से बाहर फेंक दीं
    - खुद खा लीं
    - लेखक को दे दीं
    - थैले में रख लीं
    answer: सूँघकर खिड़की से बाहर फेंक दीं
    difficulty: 1
    hints:
    - खाया नहीं।
    - स्वाद की कल्पना।
    solution: उन्होंने हर फाँक सूँघी और खिड़की से फेंक दी।
    mistakes: {"खुद खा लीं": "h10_phanken"}
  - prompt: नवाब साहब ने खीरा न खाने का क्या कारण बताया?
    options:
    - खीरा लज़ीज़ होता है पर पेट पर बोझ डालता है
    - खीरा कड़वा था
    - उन्हें भूख नहीं थी
    - डॉक्टर ने मना किया था
    answer: खीरा लज़ीज़ होता है पर पेट पर बोझ डालता है
    difficulty: 2
    hints:
    - डकार लेने के बाद।
    - उनका तर्क।
    solution: उन्होंने कहा कि खीरा स्वादिष्ट पर भारी होता है।
    mistakes: {"खीरा कड़वा था": "h10_bojh"}
  - prompt: इस कहानी में लेखक किस पर व्यंग्य करते हैं?
    options:
    - दिखावे वाली नवाबी और बिना कथ्य की 'नई कहानी'
    - रेलवे की व्यवस्था
    - किसानों
    - खीरे की खेती
    answer: दिखावे वाली नवाबी और बिना कथ्य की 'नई कहानी'
    difficulty: 2
    hints:
    - सूँघकर पेट भरना।
    - बिना घटना, पात्र के कहानी।
    solution: लेखक दिखावटी नवाबी और कथ्यहीन कहानियों पर व्यंग्य करते हैं।
    mistakes: {"रेलवे की व्यवस्था": "h10_vyangya"}
  - prompt: '''लखनवी अंदाज़'' के लेखक कौन हैं?'
    options:
    - यशपाल
    - स्वयं प्रकाश
    - रामवृक्ष बेनीपुरी
    - यतींद्र मिश्र
    answer: यशपाल
    difficulty: 1
    hints:
    - '''झूठा सच'' उपन्यास।'
    - व्यंग्यकार भी।
    solution: लखनवी अंदाज़ यशपाल की रचना है।
    mistakes:
      स्वयं प्रकाश: hin10_author
  - prompt: लेखक किस ट्रेन में यात्रा कर रहे थे?
    options:
    - पैसेंजर ट्रेन
    - राजधानी एक्सप्रेस
    - मालगाड़ी
    - लोकल मेट्रो
    answer: पैसेंजर ट्रेन
    difficulty: 2
    hints:
    - धीमी चलने वाली ट्रेन।
    - हर स्टेशन पर रुकने वाली।
    solution: लेखक ने पैसेंजर ट्रेन का सेकंड क्लास टिकट लिया था।
    mistakes:
      राजधानी एक्सप्रेस: h10k9_kram
  - prompt: लेखक के आने पर नवाब साहब की प्रतिक्रिया कैसी थी?
    options:
    - असंतुष्ट, जैसे एकांत भंग हो गया
    - बहुत खुश
    - डर गए
    - उठकर चले गए
    answer: असंतुष्ट, जैसे एकांत भंग हो गया
    difficulty: 2
    hints:
    - उन्होंने लेखक से बात नहीं की।
    - वे भी अकेले रहना चाहते थे।
    solution: नवाब साहब ने लेखक के आने पर असंतोष दिखाया।
    mistakes:
      बहुत खुश: h10k9_kram
  - prompt: लेखक ने पहली बार खीरा खाने से क्यों मना किया?
    options:
    - आत्मसम्मान के कारण, क्योंकि नवाब पहले रूखे थे
    - उन्हें खीरा पसंद नहीं था
    - वे बीमार थे
    - खीरा सड़ा था
    answer: आत्मसम्मान के कारण, क्योंकि नवाब पहले रूखे थे
    difficulty: 3
    hints:
    - नवाब ने पहले उनकी उपेक्षा की थी।
    - लेखक भी अपनी शान रखना चाहते थे।
    solution: नवाब के पहले रूखे व्यवहार के कारण लेखक ने आत्मसम्मान में मना किया।
    mistakes:
      उन्हें खीरा पसंद नहीं था: h10k9_vyangya
  - prompt: नवाब साहब ने फाँकों पर क्या बुरका?
    options:
    - जीरा-मिला नमक और लाल मिर्च
    - चीनी
    - नींबू का रस
    - मक्खन
    answer: जीरा-मिला नमक और लाल मिर्च
    difficulty: 2
    hints:
    - एक चटपटा मसाला।
    - दो चीज़ें बुरकी गईं।
    solution: उन्होंने फाँकों पर जीरा-मिला नमक और लाल मिर्च की सुर्खी बुरकी।
    mistakes:
      चीनी: h10k9_kram
  - prompt: फाँकें फेंकने के बाद नवाब साहब ने क्या किया?
