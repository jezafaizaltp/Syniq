# CBSE Class 10 Hindi A (NCERT Kshitij 2), a selection of lessons. Chapter numbers here are SYNiq's own order.
# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hin
chapter: 6
title: संगतकार
tips:
  h10_awaz: "संगतकार की आवाज़ मुख्य गायक को ढकती नहीं। कविता में उसे कैसा कहा गया है?"
  h10_sangatkar: "'संगत' का अर्थ है साथ। संगतकार किसके साथ रहता है?"
  h10_sthayi: "गीत का बार-बार लौटने वाला हिस्सा 'स्थायी' है। संगतकार उसे कौन सँभालता है?"
  h10_vinamrata: "कवि कहते हैं इसे उसकी विफलता नहीं, मनुष्यता समझना चाहिए।"
  h10k6_bhumika: संगतकार हमेशा मुख्य गायक के पीछे रहकर उसे सहारा देता है। सोचो कि यह काम किस समय और किस तरह होता है।
  h10k6_arth: कविता में संगीत के शब्दों के पीछे जीवन की बात है। पंक्ति का सीधा अर्थ और गहरा अर्थ, दोनों सोचो।

concepts:
- code: hin10c.k6.sangatkar
  title: संगतकार
  notes: |
    मंगलेश डबराल की कविता। संगतकार मुख्य गायक के साथ गाने वाला सहायक है। उसकी आवाज़ सुंदर, कमज़ोर और काँपती
    है; वह गायक का छोटा भाई, शिष्य या दूर का रिश्तेदार हो सकता है। जब मुख्य गायक ऊँचे सुर में भटक जाता है या
    अंतरे की जटिल तानों में खो जाता है, तब संगतकार स्थायी को सँभाले रखता है और उसे लौटा लाता है; जब गायक की
    आवाज़ थकने लगती है, वह साथ देता है ताकि गायक अकेला न लगे। वह जानबूझकर अपनी आवाज़ को मुख्य गायक से ऊँचा
    नहीं उठने देता: 'उसकी आवाज़ में जो एक हिचक साफ़ सुनाई देती है... उसे विफलता नहीं, उसकी मनुष्यता समझा जाना
    चाहिए।' भाव: पर्दे के पीछे के सहयोगियों का महत्त्व।
  explanations:
    text: संगतकार वह गायक है जो मुख्य गायक के पीछे गाता है। जब मुख्य गायक की आवाज़ भटकती या थकती है, वह उसे सहारा देता है, पर कभी अपनी आवाज़ उससे ऊँची नहीं उठाता। कवि कहते हैं कि यह झिझक उसकी कमज़ोरी नहीं, उसकी मनुष्यता है।
    visual: 'कल्पना कीजिए: मंच पर मुख्य गायक बीच में, और थोड़ा पीछे बैठा संगतकार, जो धीमे स्वर में स्थायी पकड़े रखता है जब मुख्य गायक ऊँची तानों में खो जाता है।'
    step_by_step: '1. संगतकार कौन है? 2. वह मुख्य गायक की कैसे मदद करता है: भटकने पर, थकने पर। 3. वह अपनी आवाज़ ऊँची क्यों नहीं करता? 4. कवि का संदेश: उसकी हिचक मनुष्यता है।'
    real_world: फ़िल्म के हीरो के पीछे सैकड़ों लोग काम करते हैं जिनके नाम हम नहीं जानते; यह कविता ऐसे ही सहयोगियों को सम्मान देती है।
  picture:
    kind: flow
    steps:
    - मुख्य गायक ऊँचे सुर में भटकता है
    - संगतकार स्थायी को सँभाले रखता है
    - गायक थकता है तो वह साथ देता है
    - वह अपनी आवाज़ ऊँची नहीं उठाता
    - उसकी हिचक उसकी मनुष्यता है
    alt: 'संगतकार की भूमिका: भटकते गायक को सँभालना, थकने पर साथ देना, अपनी आवाज़ नीची रखना; उसकी हिचक उसकी मनुष्यता है।'
  activity:
    type: sort
    prompt: कविता में यह संगतकार के बारे में है या मुख्य गायक के?
    bins:
    - संगतकार
    - मुख्य गायक
    items:
    - label: ऊँचे सुर में भटक जाता है
      bin: मुख्य गायक
      clue: जटिल तानों में कौन खो जाता है?
      why: मुख्य गायक भटकता है, संगतकार उसे लौटा लाता है।
    - label: आवाज़ थकने लगती है
      bin: मुख्य गायक
      clue: किसे साथ की ज़रूरत पड़ती है?
      why: गायक थकता है, तब संगतकार साथ देता है।
    - label: स्थायी को सँभाले रखता है
      bin: संगतकार
      clue: गायक के भटकने पर कौन धुन थामे रहता है?
      why: संगतकार स्थायी सँभालता है।
    - label: सुंदर, कमज़ोर, काँपती आवाज़
      bin: संगतकार
      clue: किसकी आवाज़ का वर्णन ऐसा है?
      why: संगतकार की आवाज़।
    - label: आवाज़ जानबूझकर ऊँची नहीं उठाता
      bin: संगतकार
      clue: कौन अपने को पीछे रखता है?
      why: यह हिचक संगतकार की मनुष्यता है।
  lesson:
    - teach: '''संगतकार'' मंगलेश डबराल की कविता है। संगतकार वह है जो मुख्य गायक के साथ गाता है। उसकी आवाज़ सुंदर, कमज़ोर और काँपती हुई है, जबकि मुख्य गायक की आवाज़ चट्टान जैसी भारी है। वह मुख्य गायक का छोटा भाई, शिष्य या पैदल चलकर सीखने आने वाला कोई दूर का रिश्तेदार हो सकता है। प्राचीन काल से वह मुख्य गायक की गरज में अपनी गूँज मिलाता आया है।'
      check:
        prompt: मुख्य गायक की आवाज़ को कैसा बताया गया है?
        options:
        - चट्टान जैसी भारी
        - काँपती और कमज़ोर
        - बहुत धीमी
        answer: चट्टान जैसी भारी
        why: संगतकार की आवाज़ इससे अलग, कोमल है।
    - teach: जब मुख्य गायक अंतरे की जटिल तानों के जंगल में खो जाता है, संगतकार स्थायी को सँभाले रहता है, मानो उसका पीछे छूटा सामान जमा कर रहा हो। वह उसे उसका बचपन याद दिलाता है जब वह नौसिखिया था। तारसप्तक में जब गायक का गला बैठने लगता है और प्रेरणा साथ छोड़ने लगती है, तब संगतकार की आवाज़ उसे ढाढ़स बँधाती है कि वह अकेला नहीं है।
      picture:
        kind: flow
        steps:
        - गायक अंतरे में खो जाता है
        - संगतकार स्थायी सँभालता है
        - गला बैठने लगता है
        - संगतकार सुर मिलाता है
        - गायक को ढाढ़स मिलता है
        alt: 'संगतकार की भूमिका: गायक अंतरे में खोता है, संगतकार स्थायी सँभालता है, गला बैठने पर सुर मिलाकर गायक को ढाढ़स देता है।'
      check:
        prompt: गायक के भटकने पर संगतकार क्या सँभाले रहता है?
        options:
        - स्थायी
        - तबला
        - मंच
        answer: स्थायी
        why: स्थायी गीत की टेक है, जिस पर गायक लौटता है।
    - teach: संगतकार जानबूझकर अपनी आवाज़ मुख्य गायक से ऊँची नहीं उठने देता। उसकी आवाज़ में एक हिचक साफ़ सुनाई देती है। कवि कहते हैं कि इसे उसकी विफलता नहीं, उसकी मनुष्यता समझा जाना चाहिए। कविता उन सब सहयोगियों के सम्मान की बात करती है जो किसी की सफलता के पीछे चुपचाप योगदान देते हैं।
      check:
        prompt: कविता किन लोगों के महत्व की ओर ध्यान खींचती है?
        options:
        - पीछे रहकर सहयोग देने वालों के
        - केवल प्रसिद्ध गायकों के
        - दर्शकों के
        answer: पीछे रहकर सहयोग देने वालों के
        why: जैसे संगतकार, वैसे ही जीवन के हर क्षेत्र में ऐसे लोग हैं।
  items:
  - prompt: संगतकार कौन होता है?
    options:
    - मुख्य गायक के साथ गाने वाला सहायक
    - मुख्य गायक
    - श्रोता
    - मंच का संचालक
    answer: मुख्य गायक के साथ गाने वाला सहायक
    difficulty: 1
    hints:
    - संगत करने वाला।
    - पीछे से साथ देता है।
    solution: संगतकार मुख्य गायक के साथ स्वर मिलाने वाला सहायक गायक है।
    mistakes: {"मुख्य गायक": "h10_sangatkar"}
  - prompt: संगतकार की आवाज़ कैसी बताई गई है?
    options:
    - सुंदर, कमज़ोर और काँपती हुई
    - बहुत ऊँची और भारी
    - कर्कश
    - बहुत तेज़
    answer: सुंदर, कमज़ोर और काँपती हुई
    difficulty: 2
    hints:
    - वह मुख्य गायक से दबी रहती है।
    - काँपती।
    solution: उसकी आवाज़ सुंदर पर कमज़ोर और काँपती हुई है।
    mistakes: {"बहुत ऊँची और भारी": "h10_awaz"}
  - prompt: जब मुख्य गायक अंतरे में भटक जाता है, संगतकार क्या करता है?
    options:
    - स्थायी को सँभाले रखता है
    - गाना बंद कर देता है
    - मंच छोड़ देता है
    - और ऊँचा गाता है
    answer: स्थायी को सँभाले रखता है
    difficulty: 2
    hints:
    - स्थायी = गीत की टेक।
    - वह गायक को लौटा लाता है।
    solution: वह स्थायी को पकड़े रखता है ताकि गायक लौट सके।
    mistakes: {"गाना बंद कर देता है": "h10_sthayi"}
  - prompt: संगतकार अपनी आवाज़ मुख्य गायक से ऊँची क्यों नहीं उठाता?
    options:
    - वह मुख्य गायक का सम्मान करता है और उसे आगे रखना चाहता है
    - उसे गाना नहीं आता
    - उसका गला खराब है
    - उसे डर लगता है
    answer: वह मुख्य गायक का सम्मान करता है और उसे आगे रखना चाहता है
    difficulty: 2
    hints:
    - जानबूझकर।
    - मनुष्यता।
    solution: वह त्याग और सम्मान के कारण अपनी आवाज़ नीची रखता है।
    mistakes: {"उसे गाना नहीं आता": "h10_vinamrata"}
  - prompt: कवि के अनुसार संगतकार की हिचक को क्या समझना चाहिए?
    options:
    - उसकी मनुष्यता
    - उसकी विफलता
    - उसका आलस्य
    - उसका घमंड
    answer: उसकी मनुष्यता
    difficulty: 1
    hints:
    - '''विफलता नहीं''।'
    - कविता की अंतिम पंक्तियाँ।
    solution: कवि कहते हैं कि उसकी हिचक विफलता नहीं, मनुष्यता है।
    mistakes:
      उसकी विफलता: hin10_poem_meaning
  - prompt: '''संगतकार'' कविता के कवि कौन हैं?'
    options:
    - मंगलेश डबराल
    - नागार्जुन
    - निराला
    - सूरदास
    answer: मंगलेश डबराल
    difficulty: 1
    hints:
    - आधुनिक कवि।
    - उत्तराखंड से।
    solution: संगतकार मंगलेश डबराल की कविता है।
    mistakes:
      नागार्जुन: hin10_author
  - prompt: संगतकार कौन-कौन हो सकता है, कवि के अनुमान से?
    options:
    - गायक का छोटा भाई, शिष्य या दूर का रिश्तेदार
    - गायक का गुरु
    - राजा
    - दर्शक
    answer: गायक का छोटा भाई, शिष्य या दूर का रिश्तेदार
    difficulty: 2
    hints:
    - वह गायक से छोटा और सीखने वाला है।
    - कवि तीन अनुमान लगाते हैं।
    solution: संगतकार छोटा भाई, शिष्य या पैदल चलकर सीखने आने वाला रिश्तेदार हो सकता है।
    mistakes:
      गायक का गुरु: h10k6_bhumika
  - prompt: '''अंतरे की जटिल तानों का जंगल'' से क्या आशय है?'
    options:
    - गीत का कठिन, उलझा हुआ हिस्सा जहाँ गायक खो जाता है
    - सचमुच का जंगल
    - मंच की सजावट
    - वाद्य यंत्र
    answer: गीत का कठिन, उलझा हुआ हिस्सा जहाँ गायक खो जाता है
    difficulty: 2
    hints:
    - अंतरा गीत का एक भाग है।
    - जंगल में रास्ता भटकने जैसा।
    solution: अंतरे की कठिन तानें जंगल जैसी हैं जिनमें गायक भटक जाता है।
    mistakes:
      सचमुच का जंगल: h10k6_arth
  - prompt: संगतकार मुख्य गायक को कौन-सी याद दिलाता है?
    options:
    - उसका बचपन, जब वह नौसिखिया था
    - उसकी शादी
    - उसका पहला पुरस्कार
    - उसका घर
    answer: उसका बचपन, जब वह नौसिखिया था
    difficulty: 2
    hints:
    - जब वह सीख रहा था।
    - संगतकार भी अब वैसा ही है।
    solution: संगतकार गायक को उसके नौसिखिए दिनों की याद दिलाता है।
    mistakes:
      उसका पहला पुरस्कार: h10k6_bhumika
  - prompt: '''तारसप्तक'' का क्या अर्थ है?'
    options:
    - ऊँचे स्वरों का सप्तक
    - धीमे स्वर
    - तबले की ताल
    - गीत का अंत
    answer: ऊँचे स्वरों का सप्तक
    difficulty: 3
    hints:
    - संगीत में तीन सप्तक होते हैं।
    - जहाँ गला बैठने लगता है।
    solution: तारसप्तक सबसे ऊँचे स्वरों का सप्तक है।
    mistakes:
      धीमे स्वर: h10k6_arth
  - prompt: '''राख जैसा कुछ गिरता हुआ'' किस स्थिति को दिखाता है?'
    options:
    - गायक का उत्साह और प्रेरणा कम होना
    - आग लगना
    - बारिश होना
    - मंच टूटना
    answer: गायक का उत्साह और प्रेरणा कम होना
    difficulty: 3
    hints:
    - राख बुझी हुई आग है।
    - गायक थकने लगता है।
    solution: राख गिरना बुझते उत्साह का प्रतीक है।
    mistakes:
