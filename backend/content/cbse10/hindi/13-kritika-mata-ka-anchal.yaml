subject: cbse10-hin
chapter: 13
title: माता का अँचल
tips:
  h10_anchal: "पाठ का शीर्षक ही बताता है कि डर के समय बच्चा कहाँ गया।"
  h10_chuha: "बच्चे सोच रहे थे कि बिल से एक छोटा जानवर निकलेगा, पर निकला साँप।"
  h10_mamta: "पिता बहुत प्यार करते थे, फिर भी संकट में बच्चा किसके पास दौड़ा?"
  h10_pita_saath: "भोलानाथ सुबह से सोने, नहाने और पूजा तक किसके साथ रहता था? पाठ के शुरू के हिस्से दोबारा पढ़ो।"
  h10_ram_naam: "पिता रोज़ पूजा के बाद कागज़ पर भगवान का नाम लिखते थे।"
  h10c1_khel: भोलानाथ और उसके साथी बड़े लोगों के कामों की नकल करके खेलते थे। सोचो कि कौन-सा खेल किस काम की नकल था।
  h10c1_pita_maa: "पिता और माँ की भूमिकाएँ अलग थीं: एक साथ खेलते और पूजा कराते, दूसरी खिलाती, सजाती और संकट में सहारा देती। प्रश्न किसकी भूमिका का है?"

concepts:
- code: hin10c.c1.anchal
  title: माता का अँचल
  notes: |
    शिवपूजन सहाय की रचना, उपन्यास 'देहाती दुनिया' का अंश। बालक भोलानाथ (असली नाम तारकेश्वरनाथ) अपने पिता के
    बहुत क़रीब है: पिता उसे सुबह जगाकर नहलाते, पूजा में साथ बैठाते, माथे पर तिलक लगाते, कंधे पर बिठाकर गंगा
    ले जाते। पिता रामायण पढ़ते और 'राम-नाम' लिखकर कागज़ की गोलियाँ आटे में लपेटकर मछलियों को खिलाते। माँ उसे
    प्यार से खिलाती, सिर में तेल डालकर चोटी गूँथती। भोलानाथ साथियों के साथ खेलता: मिठाई की दुकान, घरौंदा,
    बारात, खेती का खेल; बूढ़े मूसन तिवारी को चिढ़ाता। एक दिन चूहे का बिल समझकर पानी डालते समय साँप निकल आया;
    डरकर भागा, गिरकर घायल हुआ, और पिता के पास नहीं, सीधे माँ के आँचल में जाकर छिप गया। भाव: संकट में माँ की
    ममता ही सबसे बड़ा सहारा; ग्रामीण बचपन के खेलों का चित्रण।
  explanations:
    text: भोलानाथ दिन भर पिता के साथ रहता है, पूजा करता है, खेलता है। पर जब एक दिन साँप से डरकर घायल होकर भागता है, तो पिता की गोद नहीं, सीधे माँ के आँचल में छिप जाता है। मुसीबत में बच्चे को सबसे बड़ी सुरक्षा माँ की ममता में मिलती है।
    visual: 'कल्पना कीजिए: गाँव की गलियों में धूल से सने बच्चे घरौंदा और बारात का खेल खेल रहे हैं; फिर डर से रोता भोलानाथ माँ की गोद में दुबका है और माँ उसके घावों पर हल्दी लगा रही है।'
    step_by_step: 1. भोलानाथ और पिता का संबंध। 2. माँ का दुलार। 3. बचपन के खेल। 4. साँप वाली घटना। 5. माँ के आँचल में शरण।
    real_world: बड़े होकर भी जब हम डरते या दुखी होते हैं, सबसे पहले माँ याद आती है; यह पाठ उसी सच्चाई को दिखाता है।
  picture:
    kind: flow
    steps:
    - पिता के साथ पूजा और गंगा-स्नान
    - 'माँ का दुलार: खाना, चोटी'
    - साथियों के साथ गाँव के खेल
    - चूहे के बिल से साँप निकला
    - डरकर माँ के आँचल में छिपा
    alt: 'माता का अँचल: पिता के साथ दिनचर्या, माँ का दुलार, गाँव के खेल, साँप से डर, और माँ के आँचल में शरण।'
  activity:
    type: order
    prompt: साँप वाले दिन की घटनाएँ क्रम से लगाओ।
    steps:
    - बच्चे चूहे का बिल समझकर पानी डालते हैं
    - बिल से साँप निकल आता है
    - भोलानाथ डरकर भागता है, गिरकर घायल
    - पिता के पास नहीं, माँ के आँचल में छिपता है
    reasons:
      बिल से साँप निकल आता है: पानी डालने से ही बिल में से साँप निकला।
      भोलानाथ डरकर भागता है, गिरकर घायल: साँप देखकर ही डर लगा।
      पिता के पास नहीं, माँ के आँचल में छिपता है: 'घायल होकर सहारा ढूँढ़ता है: यही कहानी का अंत है।'
  lesson:
    - teach: '''माता का अँचल'' शिवपूजन सहाय के उपन्यास ''देहाती दुनिया'' का अंश है। भोलानाथ (असली नाम तारकेश्वरनाथ) का अधिक समय पिता के साथ बीतता था। पिता सुबह उसे नहलाकर पूजा पर बैठाते, माथे पर तिलक लगाते और ''रामनामा बही'' पर राम-नाम लिखते। फिर आटे की गोलियों में राम-नाम की पर्चियाँ लपेटकर गंगा की मछलियों को खिलाते।'
      check:
        prompt: पिता आटे की गोलियाँ किसे खिलाते थे?
        options:
        - गंगा की मछलियों को
        - गाय को
        - चिड़ियों को
        answer: गंगा की मछलियों को
        why: उनमें राम-नाम की पर्चियाँ लिपटी होती थीं।
    - teach: 'माँ भोलानाथ को तोता, मैना, कबूतर, हंस, मोर के नाम ले-लेकर कौर खिलातीं, सिर पर सरसों का तेल डालकर चोटी गूँथतीं और ''कन्हैया'' बना देतीं। भोलानाथ साथियों के साथ बड़ों के कामों की नकल करते हुए खेलता: मिठाई की दुकान, घरौंदा और भोज (जीमन), बारात, और खेती। एक दिन बच्चों ने बूढ़े मूसन तिवारी को चिढ़ाया, तो वे पाठशाला तक पीछा करते आ गए।'
      picture:
        kind: flow
        steps:
        - पिता के साथ पूजा
        - माँ खिलाती-सजाती
        - साथियों संग खेल
        - चूहे के बिल में पानी
        - साँप निकला
        - माँ के आँचल में
        alt: 'पाठ का क्रम: पिता के साथ पूजा, माँ का खिलाना-सजाना, साथियों के खेल, चूहे के बिल में पानी डालना, साँप निकलना, और डरकर माँ के आँचल में छिपना।'
      check:
        prompt: बच्चे किसकी नकल करके खेलते थे?
        options:
        - बड़ों के कामों की
        - जानवरों की
        - शिक्षकों की
        answer: बड़ों के कामों की
        why: दुकान, भोज, बारात, खेती सब बड़ों के काम हैं।
    - teach: एक दिन बच्चे टीले पर चूहे के बिल में पानी डाल रहे थे कि उसमें से साँप निकल आया। डरकर भागते हुए भोलानाथ गिरा, लहूलुहान हुआ और सीधे घर जाकर माँ के आँचल में छिप गया। पिता बुलाते रहे, पर वह माँ से ही चिपका रहा। माँ ने हल्दी लगाई और रोने लगीं। पाठ बताता है कि संकट में बच्चे को माँ की ममता ही सबसे बड़ा सहारा लगती है।
      check:
        prompt: डरा हुआ भोलानाथ पिता के पास क्यों नहीं गया?
        options:
        - संकट में माँ की गोद ही सबसे सुरक्षित लगती है
        - पिता घर पर नहीं थे
        - पिता ने डाँटा था
        answer: संकट में माँ की गोद ही सबसे सुरक्षित लगती है
        why: पिता बुला रहे थे, फिर भी वह माँ से चिपका रहा।
  items:
  - prompt: भोलानाथ का असली नाम क्या था?
    options:
    - तारकेश्वरनाथ
    - मूसन तिवारी
    - रामनाथ
    - बैजू
    answer: तारकेश्वरनाथ
    difficulty: 1
    hints:
    - पिता उसे भोलानाथ कहते थे।
    - शिव का एक नाम।
    solution: भोलानाथ का असली नाम तारकेश्वरनाथ था।
    mistakes:
      मूसन तिवारी: hin10_read_again
  - prompt: भोलानाथ का अधिक समय किसके साथ बीतता था?
    options:
    - पिता के साथ
    - माँ के साथ
    - दादी के साथ
    - शिक्षक के साथ
    answer: पिता के साथ
    difficulty: 1
    hints:
    - पूजा, गंगा-स्नान।
    - कंधे पर बिठाते।
    solution: भोलानाथ का अधिकांश समय पिता के साथ बीतता था।
    mistakes: {"माँ के साथ": "h10_pita_saath"}
  - prompt: पिता रोज़ क्या लिखते थे?
    options:
    - राम-नाम
    - चिट्ठियाँ
    - कविताएँ
    - हिसाब
    answer: राम-नाम
    difficulty: 2
    hints:
    - धार्मिक व्यक्ति।
    - कागज़ की गोलियाँ।
    solution: पिता रोज़ राम-नाम लिखते और उन्हें आटे की गोलियों में लपेटकर मछलियों को खिलाते।
    mistakes: {"हिसाब": "h10_ram_naam"}
  - prompt: बच्चे किस बिल में पानी डाल रहे थे जब साँप निकला?
    options:
    - चूहे के बिल में
    - चींटी के बिल में
    - खरगोश के बिल में
    - मेंढक के बिल में
    answer: चूहे के बिल में
    difficulty: 2
    hints:
    - खेल-खेल में।
    - साँप अंदर था।
    solution: वे चूहे का बिल समझकर पानी डाल रहे थे, तभी साँप निकल आया।
    mistakes: {"चींटी के बिल में": "h10_chuha"}
  - prompt: डरकर भोलानाथ कहाँ जाकर छिपा?
    options:
    - माँ के आँचल में
    - पिता की गोद में
    - पेड़ पर
    - पड़ोसी के घर
    answer: माँ के आँचल में
    difficulty: 1
    hints:
    - पाठ का शीर्षक।
    - पिता बुलाते रहे।
    solution: वह सीधे माँ के आँचल में जाकर छिप गया।
    mistakes: {"पिता की गोद में": "h10_anchal"}
  - prompt: इस पाठ का मुख्य भाव क्या है?
    options:
    - संकट में माँ की ममता सबसे बड़ा सहारा है
    - पिता बच्चों से प्यार नहीं करते
    - साँप खतरनाक होते हैं
    - खेलना बुरा है
    answer: संकट में माँ की ममता सबसे बड़ा सहारा है
    difficulty: 2
    hints:
    - डर के समय बच्चा कहाँ गया?
    - माँ।
    solution: पाठ बताता है कि मुसीबत में बच्चे को माँ की ममता में सबसे अधिक सुरक्षा मिलती है।
    mistakes: {"पिता बच्चों से प्यार नहीं करते": "h10_mamta"}
  - prompt: '''माता का अँचल'' किस उपन्यास का अंश है?'
    options:
    - देहाती दुनिया
    - गोदान
    - मैला आँचल
    - गबन
    answer: देहाती दुनिया
    difficulty: 3
    hints:
    - गाँव के जीवन पर आधारित।
    - शिवपूजन सहाय का उपन्यास।
    solution: यह अंश शिवपूजन सहाय के 'देहाती दुनिया' से है।
    mistakes:
      मैला आँचल: hin10_author
  - prompt: माँ भोलानाथ को कौर कैसे खिलाती थीं?
    options:
    - तोता, मैना, कबूतर, हंस, मोर के नाम लेकर
    - डाँट-डाँटकर
    - कहानी सुनाकर
    - गीत गाकर
    answer: तोता, मैना, कबूतर, हंस, मोर के नाम लेकर
    difficulty: 2
    hints:
    - पक्षियों के नाम।
    - हर कौर किसी का हिस्सा।
    solution: माँ पक्षियों के नाम ले-लेकर कौर खिलाती थीं।
    mistakes:
      डाँट-डाँटकर: h10c1_pita_maa
  - prompt: माँ भोलानाथ को सजाकर क्या बना देती थीं?
    options:
    - कन्हैया
    - राजा
    - सिपाही
    - साधु
    answer: कन्हैया
    difficulty: 2
    hints:
    - चोटी गूँथकर, टोपी पहनाकर।
    - नटखट बालक कृष्ण।
    solution: माँ उसे सजाकर 'कन्हैया' बना देती थीं।
    mistakes:
      राजा: h10c1_pita_maa
  - prompt: बच्चों ने किसे चिढ़ाया था?
    options:
    - बूढ़े मूसन तिवारी को
    - गुरुजी को
    - बैजू को
    - पिता को
    answer: बूढ़े मूसन तिवारी को
    difficulty: 2
    hints:
    - उन्हें कम दिखता था।
    - वे पाठशाला तक पीछा करते आए।
    solution: बच्चों ने बूढ़े मूसन तिवारी को 'बुढ़वा बेईमान' कहकर चिढ़ाया।
    mistakes:
      गुरुजी को: h10c1_khel
  - prompt: मूसन तिवारी को चिढ़ाने का नतीजा क्या हुआ?
    options:
    - गुरुजी ने भोलानाथ को पकड़कर सज़ा दी
    - मूसन तिवारी ने मिठाई दी
    - बच्चे पुरस्कार पाए
    - कुछ नहीं हुआ
    answer: गुरुजी ने भोलानाथ को पकड़कर सज़ा दी
    difficulty: 2
    hints:
    - मूसन तिवारी पाठशाला पहुँच गए।
    - गुरुजी ने बच्चों को पकड़वाया।
    solution: गुरुजी ने भोलानाथ की ख़बर ली; पिता उसे छुड़ाकर ले गए।
    mistakes:
      मूसन तिवारी ने मिठाई दी: h10c1_khel
  - prompt: बच्चों के खेल में 'जीमन' का क्या अर्थ है?
    options:
    - भोज, सबका साथ खाना
    - नाचना
    - सोना
    - पढ़ना
    answer: भोज, सबका साथ खाना
    difficulty: 2
    hints:
    - घरौंदा बनाकर किया जाता था।
    - बड़ों की दावत की नकल।
    solution: जीमन यानी भोज, जिसमें सब बैठकर खाते हैं।
