subject: cbse10-hin
chapter: 13
title: माता का अँचल
tips:
  h10_anchal: "पाठ का शीर्षक ही बताता है कि डर के समय बच्चा कहाँ गया।"
  h10_chuha: "बच्चे सोच रहे थे कि बिल से एक छोटा जानवर निकलेगा, पर निकला साँप।"
  h10_mamta: "पिता बहुत प्यार करते थे, फिर भी संकट में बच्चा किसके पास दौड़ा?"
  h10_pita_saath: "भोलानाथ सुबह से सोने, नहाने और पूजा तक किसके साथ रहता था? पाठ के शुरू के हिस्से दोबारा पढ़ो।"
  h10_ram_naam: "पिता रोज़ पूजा के बाद कागज़ पर भगवान का नाम लिखते थे।"

concepts:
- code: hin10c.c1.anchal
  title: माता का अँचल
  notes: |
    शिवपूजन सहाय की रचना, उपन्यास 'देहाती दुनिया' का अंश। बालक भोलानाथ (असली नाम तारकेश्वरनाथ) अपने पिता के
    बहुत क़रीब है: पिता उसे सुबह जगाकर नहलाते, पूजा में साथ बैठाते, माथे पर तिलक लगाते, कंधे पर बिठाकर गंगा
    ले जाते। पिता रामायण पढ़ते और 'राम-नाम' लिखकर कागज़ की गोलियाँ आटे में लपेटकर मछलियों को खिलाते। माँ उसे
    प्यार से खिलाती, सिर में तेल डालकर चोटी गूँथती। भोलानाथ साथियों के साथ खेलता: मिठाई की दुकान, घरौंदा,
    बारात, खेती का खेल; बूढ़े मूसन तिवारी को चिढ़ाता। एक दिन चूहे का बिल समझकर पानी डालते समय साँप निकल आया;
    डरकर भागा, गिरकर घायल हुआ, और पिता के पास नहीं, सीधे माँ के आँचल में जाकर छिप गया। भाव: संकट में माँ की
    ममता ही सबसे बड़ा सहारा; ग्रामीण बचपन के खेलों का चित्रण।
  explanations:
    text: भोलानाथ दिन भर पिता के साथ रहता है, पूजा करता है, खेलता है। पर जब एक दिन साँप से डरकर घायल होकर भागता है, तो पिता की गोद नहीं, सीधे माँ के आँचल में छिप जाता है। मुसीबत में बच्चे को सबसे बड़ी सुरक्षा माँ की ममता में मिलती है।
    visual: 'कल्पना कीजिए: गाँव की गलियों में धूल से सने बच्चे घरौंदा और बारात का खेल खेल रहे हैं; फिर डर से रोता भोलानाथ माँ की गोद में दुबका है और माँ उसके घावों पर हल्दी लगा रही है।'
    step_by_step: 1. भोलानाथ और पिता का संबंध। 2. माँ का दुलार। 3. बचपन के खेल। 4. साँप वाली घटना। 5. माँ के आँचल में शरण।
    real_world: बड़े होकर भी जब हम डरते या दुखी होते हैं, सबसे पहले माँ याद आती है; यह पाठ उसी सच्चाई को दिखाता है।
  picture:
    kind: flow
    steps:
    - पिता के साथ पूजा और गंगा-स्नान
    - 'माँ का दुलार: खाना, चोटी'
    - साथियों के साथ गाँव के खेल
    - चूहे के बिल से साँप निकला
    - डरकर माँ के आँचल में छिपा
    alt: 'माता का अँचल: पिता के साथ दिनचर्या, माँ का दुलार, गाँव के खेल, साँप से डर, और माँ के आँचल में शरण।'
  items:
  - prompt: भोलानाथ का असली नाम क्या था?
    options:
    - तारकेश्वरनाथ
    - मूसन तिवारी
    - रामनाथ
    - बैजू
    answer: तारकेश्वरनाथ
    difficulty: 1
    hints:
    - पिता उसे भोलानाथ कहते थे।
    - शिव का एक नाम।
    solution: भोलानाथ का असली नाम तारकेश्वरनाथ था।
    mistakes:
      मूसन तिवारी: hin10_read_again
  - prompt: भोलानाथ का अधिक समय किसके साथ बीतता था?
    options:
    - पिता के साथ
    - माँ के साथ
    - दादी के साथ
    - शिक्षक के साथ
    answer: पिता के साथ
    difficulty: 1
    hints:
    - पूजा, गंगा-स्नान।
    - कंधे पर बिठाते।
    solution: भोलानाथ का अधिकांश समय पिता के साथ बीतता था।
    mistakes: {"माँ के साथ": "h10_pita_saath"}
  - prompt: पिता रोज़ क्या लिखते थे?
    options:
    - राम-नाम
    - चिट्ठियाँ
    - कविताएँ
    - हिसाब
    answer: राम-नाम
    difficulty: 2
    hints:
    - धार्मिक व्यक्ति।
    - कागज़ की गोलियाँ।
    solution: पिता रोज़ राम-नाम लिखते और उन्हें आटे की गोलियों में लपेटकर मछलियों को खिलाते।
    mistakes: {"हिसाब": "h10_ram_naam"}
  - prompt: बच्चे किस बिल में पानी डाल रहे थे जब साँप निकला?
    options:
    - चूहे के बिल में
    - चींटी के बिल में
    - खरगोश के बिल में
    - मेंढक के बिल में
    answer: चूहे के बिल में
    difficulty: 2
    hints:
    - खेल-खेल में।
    - साँप अंदर था।
    solution: वे चूहे का बिल समझकर पानी डाल रहे थे, तभी साँप निकल आया।
    mistakes: {"चींटी के बिल में": "h10_chuha"}
  - prompt: डरकर भोलानाथ कहाँ जाकर छिपा?
    options:
    - माँ के आँचल में
    - पिता की गोद में
    - पेड़ पर
    - पड़ोसी के घर
    answer: माँ के आँचल में
    difficulty: 1
    hints:
    - पाठ का शीर्षक।
    - पिता बुलाते रहे।
    solution: वह सीधे माँ के आँचल में जाकर छिप गया।
    mistakes: {"पिता की गोद में": "h10_anchal"}
  - prompt: इस पाठ का मुख्य भाव क्या है?
    options:
    - संकट में माँ की ममता सबसे बड़ा सहारा है
    - पिता बच्चों से प्यार नहीं करते
    - साँप खतरनाक होते हैं
    - खेलना बुरा है
    answer: संकट में माँ की ममता सबसे बड़ा सहारा है
    difficulty: 2
    hints:
    - डर के समय बच्चा कहाँ गया?
    - माँ।
    solution: पाठ बताता है कि मुसीबत में बच्चे को माँ की ममता में सबसे अधिक सुरक्षा मिलती है।
    mistakes: {"पिता बच्चों से प्यार नहीं करते": "h10_mamta"}
