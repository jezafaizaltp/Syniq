subject: cbse10-hin
chapter: 7
title: नेताजी का चश्मा
tips:
  h10_captain: "कैप्टन गरीब चश्मेवाला था, फिर भी चश्मा बदलता रहता था। उसके मन में नेताजी के लिए क्या था?"
  h10_chashma_sandesh: "अंत में एक बच्चे ने चश्मा लगाया, यह देखकर हालदार साहब भावुक हो गए। क्यों?"
  h10_netaji: "पाठ का नाम ही बता रहा है कि मूर्ति किस नेता की है। उनका नारा था 'तुम मुझे खून दो'।"
  h10_pandrah: "हालदार साहब कंपनी के काम से हर पखवाड़े गुज़रते थे। पखवाड़ा कितने दिन का होता है?"
  h10_sarkanda: "कैप्टन के बाद किसी बच्चे ने चश्मा लगाया। बच्चा किस चीज़ से बना सकता था?"
  h10k7_patra: 'कहानी के पात्र: हालदार साहब, पानवाला, कैप्टन चश्मेवाला और मूर्तिकार मास्टर मोतीलाल। प्रश्न किसके बारे में है?'
  h10k7_kram: 'मूर्ति पर चश्मा बार-बार बदलता है। घटनाओं के क्रम को याद करो: मूर्ति बनी, कैप्टन चश्मे बदलता रहा, कैप्टन नहीं रहा, फिर बच्चे।'

concepts:
- code: hin10c.k7.chashma
  title: नेताजी का चश्मा
  notes: |
    स्वयं प्रकाश की कहानी। एक कस्बे के मुख्य चौराहे पर नगरपालिका ने नेताजी सुभाषचंद्र बोस की संगमरमर की मूर्ति
    लगवाई, जिसे कस्बे के हाई स्कूल के ड्राइंग मास्टर मोतीलाल ने बनाया था। मूर्ति पर पत्थर का चश्मा नहीं था;
    कंपनी के काम से हर पंद्रहवें दिन कस्बे से गुज़रने वाले हालदार साहब देखते हैं कि मूर्ति पर असली चश्मा लगा है,
    जो बदलता रहता है। पानवाला बताता है कि कैप्टन चश्मेवाला, एक बूढ़ा, लँगड़ा, मरियल-सा फेरीवाला, ग्राहक को चश्मा
    बेचकर मूर्ति पर दूसरा फ्रेम लगा देता है; उसे नेताजी का बिना चश्मे के रहना बुरा लगता है। कुछ समय बाद
    कैप्टन मर जाता है; मूर्ति बिना चश्मे के रहती है और हालदार साहब दुखी होते हैं। अंत में वे देखते हैं कि किसी
    बच्चे ने सरकंडे का बना छोटा-सा चश्मा मूर्ति पर लगा दिया है, और उनकी आँखें भर आती हैं। भाव: देशभक्ति
    साधारण लोगों में भी जीवित है।
  explanations:
    text: एक कस्बे में नेताजी की मूर्ति पर चश्मा नहीं था। एक गरीब, लँगड़ा फेरीवाला, जिसे लोग कैप्टन कहते थे, रोज़ अपने बिकाऊ चश्मों में से एक मूर्ति पर लगा देता। उसकी मृत्यु के बाद मूर्ति सूनी हो गई, पर फिर किसी बच्चे ने सरकंडे का चश्मा लगा दिया। देशभक्ति साधारण लोगों के दिलों में रहती है।
    visual: 'कल्पना कीजिए: चौराहे पर नेताजी की सफ़ेद मूर्ति, आँखों पर बदलता असली चश्मा; पास में पान की दुकान; और अंत में मूर्ति की आँखों पर सरकंडे का छोटा-सा चश्मा।'
    step_by_step: '1. मूर्ति और उसकी कमी: चश्मा नहीं। 2. हालदार साहब का ध्यान: बदलते चश्मे। 3. कैप्टन चश्मेवाला का परिचय। 4. कैप्टन की मृत्यु। 5. सरकंडे का चश्मा: आशा।'
    real_world: स्वतंत्रता दिवस पर गरीब बच्चे भी कागज़ के झंडे बनाकर लहराते हैं; देशभक्ति के लिए पैसे नहीं, भावना चाहिए।
  picture:
    kind: flow
    steps:
    - चौराहे पर नेताजी की मूर्ति, चश्मा नहीं
    - हालदार साहब बदलते असली चश्मे देखते हैं
    - कैप्टन चश्मेवाला चश्मा लगाता है
    - कैप्टन की मृत्यु; मूर्ति बिना चश्मे के
    - बच्चे ने सरकंडे का चश्मा लगाया
    alt: 'नेताजी का चश्मा: बिना चश्मे की मूर्ति, कैप्टन के लगाए बदलते चश्मे, उसकी मृत्यु, और अंत में बच्चे का सरकंडे का चश्मा।'
  activity:
    type: order
    prompt: नेताजी की मूर्ति के चश्मे की कहानी क्रम से लगाओ।
    steps:
    - ड्राइंग मास्टर मोतीलाल मूर्ति बनाते हैं
    - हालदार साहब मूर्ति पर बदलते असली चश्मे देखते हैं
    - पानवाला कैप्टन चश्मेवाले के बारे में बताता है
    - कैप्टन मर जाता है, मूर्ति बिना चश्मे के
    - बच्चे का बनाया सरकंडे का चश्मा
    reasons:
      हालदार साहब मूर्ति पर बदलते असली चश्मे देखते हैं: चश्मा लगने के लिए पहले मूर्ति बननी चाहिए।
      पानवाला कैप्टन चश्मेवाले के बारे में बताता है: हालदार साहब बदलते चश्मे देखकर ही पूछते हैं।
      कैप्टन मर जाता है, मूर्ति बिना चश्मे के: कैप्टन के बारे में जानने के कुछ समय बाद।
      बच्चे का बनाया सरकंडे का चश्मा: कैप्टन के न रहने पर ही किसी और ने चश्मा लगाया।
  lesson:
    - teach: '''नेताजी का चश्मा'' स्वयं प्रकाश की कहानी है। हालदार साहब हर पंद्रहवें दिन कंपनी के काम से एक कस्बे से गुज़रते थे। कस्बे के मुख्य चौराहे पर नगरपालिका ने नेताजी सुभाषचंद्र बोस की संगमरमर की मूर्ति लगवाई थी, जो स्कूल के ड्राइंग मास्टर मोतीलाल ने बनाई थी। मूर्ति सुंदर थी, पर उस पर पत्थर का चश्मा नहीं था; असली चश्मे का फ़्रेम लगा था।'
      check:
        prompt: मूर्ति में क्या कमी थी?
        options:
        - पत्थर का चश्मा नहीं था
        - सिर नहीं था
        - मूर्ति टूटी थी
        answer: पत्थर का चश्मा नहीं था
        why: इसलिए असली चश्मा लगाया जाता था।
    - teach: हालदार साहब ने देखा कि मूर्ति का चश्मा बदलता रहता है। पानवाले ने बताया कि यह काम कैप्टन चश्मेवाला करता है, एक बूढ़ा, मरियल, लँगड़ा फेरीवाला। जब किसी ग्राहक को मूर्ति वाला फ़्रेम चाहिए होता, तो वह उसे उतारकर दे देता और मूर्ति पर दूसरा लगा देता। उसे नेताजी का बिना चश्मे के रहना अच्छा नहीं लगता था।
      picture:
        kind: flow
        steps:
        - मूर्ति बिना पत्थर के चश्मे
        - कैप्टन चश्मा लगाता है
        - चश्मे बदलते रहते हैं
        - कैप्टन की मृत्यु
        - मूर्ति बिना चश्मे
        - सरकंडे का चश्मा
        alt: 'कहानी का क्रम: मूर्ति बिना पत्थर के चश्मे के, कैप्टन असली चश्मे लगाता और बदलता है, कैप्टन की मृत्यु के बाद मूर्ति बिना चश्मे के, फिर बच्चों का सरकंडे का चश्मा।'
      check:
        prompt: मूर्ति पर चश्मा कौन लगाता था?
        options:
        - कैप्टन चश्मेवाला
        - पानवाला
        - हालदार साहब
        answer: कैप्टन चश्मेवाला
        why: वह फेरी लगाकर चश्मे बेचता था।
    - teach: दो साल बाद हालदार साहब ने देखा कि मूर्ति पर चश्मा नहीं है; पता चला कि कैप्टन मर गया। वे उदास हो गए कि देश के लिए सब कुछ न्योछावर करने वालों पर हँसने वाले लोग हैं। अगली बार उन्होंने गाड़ी न रोकने का सोचा, पर देखा कि मूर्ति पर सरकंडे का बना छोटा चश्मा लगा है, जो बच्चों ने बनाया था। उनकी आँखें भर आईं। कहानी बताती है कि देशभक्ति साधारण लोगों और बच्चों में भी जीवित है।
      check:
        prompt: अंत में हालदार साहब भावुक क्यों हो गए?
        options:
        - बच्चों ने मूर्ति पर सरकंडे का चश्मा लगाया था
        - मूर्ति हटा दी गई थी
        - पानवाले ने उन्हें डाँटा
        answer: बच्चों ने मूर्ति पर सरकंडे का चश्मा लगाया था
        why: उन्हें लगा कि देशभक्ति अगली पीढ़ी में भी है।
  items:
  - prompt: मूर्ति किसकी थी?
    options:
    - नेताजी सुभाषचंद्र बोस
    - महात्मा गांधी
    - भगत सिंह
    - जवाहरलाल नेहरू
    answer: नेताजी सुभाषचंद्र बोस
    difficulty: 1
    hints:
    - पाठ का शीर्षक।
    - आज़ाद हिंद फ़ौज।
    solution: मूर्ति नेताजी सुभाषचंद्र बोस की थी।
    mistakes: {"महात्मा गांधी": "h10_netaji"}
  - prompt: मूर्ति किसने बनाई थी?
    options:
    - ड्राइंग मास्टर मोतीलाल ने
    - कैप्टन ने
    - हालदार साहब ने
    - पानवाले ने
    answer: ड्राइंग मास्टर मोतीलाल ने
    difficulty: 2
    hints:
    - कस्बे के हाई स्कूल के।
    - जल्दी में बनाई।
    solution: कस्बे के हाई स्कूल के ड्राइंग मास्टर मोतीलाल ने मूर्ति बनाई।
    mistakes:
      कैप्टन ने: hin10_read_again
  - prompt: हालदार साहब कस्बे से हर कितने दिन बाद गुज़रते थे?
    answer: '15'
    check: 30/2
    difficulty: 1
    hints:
    - महीने में दो बार।
    - कंपनी के काम से।
    solution: वे हर पंद्रहवें दिन कस्बे से गुज़रते थे।
    mistakes: {"30": "h10_pandrah", "7": "h10_pandrah"}
  - prompt: कैप्टन मूर्ति पर चश्मा क्यों लगाता था?
    options:
    - उसे नेताजी का बिना चश्मे के रहना बुरा लगता था
    - उसे पैसे मिलते थे
    - नगरपालिका ने कहा था
    - मूर्ति उसकी थी
    answer: उसे नेताजी का बिना चश्मे के रहना बुरा लगता था
    difficulty: 2
    hints:
    - देशभक्ति।
    - वह गरीब फेरीवाला था।
    solution: देशभक्ति के कारण उसे मूर्ति बिना चश्मे के अधूरी लगती थी।
    mistakes: {"उसे पैसे मिलते थे": "h10_captain"}
  - prompt: कहानी के अंत में मूर्ति पर कैसा चश्मा था?
    options:
    - सरकंडे का बना छोटा चश्मा
    - सोने का चश्मा
    - काला धूप का चश्मा
    - कोई चश्मा नहीं
    answer: सरकंडे का बना छोटा चश्मा
    difficulty: 1
    hints:
    - किसी बच्चे ने बनाया।
    - हालदार साहब की आँखें भर आईं।
    solution: किसी बच्चे ने सरकंडे का चश्मा बनाकर लगा दिया।
    mistakes: {"सोने का चश्मा": "h10_sarkanda"}
  - prompt: कहानी का मुख्य संदेश क्या है?
    options:
    - देशभक्ति साधारण लोगों और बच्चों में भी जीवित है
    - मूर्तियाँ बेकार हैं
    - चश्मे महँगे होते हैं
    - नगरपालिका ठीक काम नहीं करती
    answer: देशभक्ति साधारण लोगों और बच्चों में भी जीवित है
    difficulty: 2
    hints:
    - कैप्टन और बच्चे।
    - आशा।
    solution: कहानी बताती है कि देशप्रेम आम लोगों के छोटे कामों में दिखता है।
    mistakes: {"मूर्तियाँ बेकार हैं": "h10_chashma_sandesh"}
  - prompt: मूर्ति किस पत्थर की बनी थी?
    options:
    - संगमरमर
    - ग्रेनाइट
    - लकड़ी
    - मिट्टी
    answer: संगमरमर
    difficulty: 1
    hints:
    - सफ़ेद, चिकना पत्थर।
    - ताजमहल भी इसी से बना है।
    solution: नेताजी की मूर्ति संगमरमर की थी।
    mistakes:
      मिट्टी: h10k7_kram
  - prompt: मूर्ति में नेताजी किस वेशभूषा में थे?
    options:
    - फ़ौजी वर्दी में
    - धोती-कुर्ते में
    - सूट में
    - साधु के वेश में
    answer: फ़ौजी वर्दी में
    difficulty: 2
    hints:
    - नेताजी आज़ाद हिंद फ़ौज के नेता थे।
    - '''दिल्ली चलो'' का नारा।'
    solution: मूर्ति में नेताजी फ़ौजी वर्दी में थे।
    mistakes:
      धोती-कुर्ते में: h10k7_patra
  - prompt: पानवाला कैसा व्यक्ति था?
    options:
    - काला, मोटा और हँसमुख
    - दुबला और गंभीर
    - बूढ़ा और लँगड़ा
    - क्रोधी और झगड़ालू
    answer: काला, मोटा और हँसमुख
    difficulty: 2
    hints:
    - उसकी तोंद हँसते समय हिलती थी।
    - वह मज़ाक करता था।
    solution: पानवाला काला, मोटा और खुशमिज़ाज था।
    mistakes:
      बूढ़ा और लँगड़ा: h10k7_patra
  - prompt: कैप्टन चश्मेवाला कैसा दिखता था?
    options:
    - बूढ़ा, मरियल और लँगड़ा
    - जवान और ताकतवर
    - मोटा और हँसमुख
    - फ़ौजी अफ़सर
    answer: बूढ़ा, मरियल और लँगड़ा
