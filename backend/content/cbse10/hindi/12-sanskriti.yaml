chapter: 12
title: संस्कृति
concepts:
- code: hin10c.k12.sanskriti
  title: संस्कृति
  notes: |
    भदंत आनंद कौसल्यायन का निबंध। 'सभ्यता' और 'संस्कृति' शब्दों का प्रयोग बहुत होता है पर अर्थ स्पष्ट नहीं।
    लेखक उदाहरण देते हैं: जिस व्यक्ति ने पहली बार आग का आविष्कार किया, या सुई-धागे की खोज की, उसकी वह
    योग्यता, प्रवृत्ति या प्रेरणा, जिससे आविष्कार हुआ, उसकी 'संस्कृति' है; और उस आविष्कार से बनी चीज़ें व
    जीवन-शैली 'सभ्यता' है। न्यूटन ने गुरुत्वाकर्षण का सिद्धांत खोजा, वह संस्कृत व्यक्ति था; आज का विद्यार्थी
    जो वह सिद्धांत जानता है, वह सभ्य हो सकता है पर संस्कृत नहीं। आविष्कार के पीछे भौतिक प्रेरणा (पेट भरना,
    तन ढकना) और आंतरिक प्रेरणा (जिज्ञासा, दूसरों के लिए त्याग — जैसे सिद्धार्थ, कार्ल मार्क्स, लेनिन) दोनों
    होती हैं। जो योग्यता आत्म-विनाश के साधन बनाए, वह 'असंस्कृति' है। संस्कृति मानव-कल्याण से जुड़ी है;
    उसे बाँटा नहीं जा सकता।
  explanations:
    text: लेखक सभ्यता और संस्कृति का अंतर समझाते हैं। आग या सुई-धागे की खोज करने की योग्यता और प्रेरणा संस्कृति है; उस खोज से बनी चीज़ें और रहन-सहन सभ्यता है। जो योग्यता विनाश के साधन बनाए, वह असंस्कृति है।
    visual: 'दो खाने बनाइए: बाएँ ''संस्कृति'' में आग खोजने वाले का जिज्ञासु मन; दाएँ ''सभ्यता'' में उससे बनी रसोई, दीपक और कारखाने।'
    step_by_step: '1. आविष्कार करने की योग्यता या प्रेरणा = संस्कृति। 2. उससे बना परिणाम = सभ्यता। 3. उदाहरण: आग, सुई-धागा, न्यूटन। 4. प्रेरणाएँ: भौतिक और आंतरिक। 5. असंस्कृति: विनाश की ओर।'
    real_world: मोबाइल फ़ोन का उपयोग करना सभ्यता है, पर उसे बनाने वाली जिज्ञासा और कल्पना संस्कृति थी।
  picture:
    kind: compare
    columns:
    - title: संस्कृति
      points:
      - आविष्कार की योग्यता और प्रेरणा
      - आग खोजने वाले की जिज्ञासा
      - न्यूटन की खोज की क्षमता
    - title: सभ्यता
      points:
      - आविष्कार का परिणाम
      - आग से बनी रसोई, दीपक
      - सिद्धांत जानने वाला आज का विद्यार्थी
    - title: असंस्कृति
      points:
      - विनाश के साधन बनाने वाली योग्यता
      - मानव-कल्याण के विरुद्ध
    alt: संस्कृति आविष्कार की योग्यता और प्रेरणा है, सभ्यता उसका परिणाम है, और असंस्कृति विनाश की ओर ले जाने वाली योग्यता है।
  items:
  - prompt: लेखक के अनुसार 'संस्कृति' क्या है?
    options:
    - आविष्कार करने की योग्यता, प्रवृत्ति या प्रेरणा
    - महँगे कपड़े पहनना
    - आविष्कार से बनी चीज़ें
    - बड़े शहरों में रहना
    answer: आविष्कार करने की योग्यता, प्रवृत्ति या प्रेरणा
    difficulty: 1
    hints:
    - आग खोजने वाले की क्षमता।
    - परिणाम नहीं, प्रेरणा।
    solution: संस्कृति वह योग्यता या प्रेरणा है जिससे आविष्कार होता है।
    mistakes:
      आविष्कार से बनी चीज़ें: hin10_read_again
  - prompt: लेखक के अनुसार 'सभ्यता' क्या है?
    options:
    - संस्कृति का परिणाम
    - आविष्कार की प्रेरणा
    - जिज्ञासा
    - धर्म
    answer: संस्कृति का परिणाम
    difficulty: 2
    hints:
    - आविष्कार से बनी चीज़ें और रहन-सहन।
    - परिणाम।
    solution: सभ्यता संस्कृति का परिणाम है।
  - prompt: न्यूटन को लेखक ने क्या कहा है?
    options:
    - संस्कृत व्यक्ति
    - असंस्कृत व्यक्ति
    - केवल सभ्य व्यक्ति
    - साधारण व्यक्ति
    answer: संस्कृत व्यक्ति
    difficulty: 2
    hints:
    - उसने गुरुत्वाकर्षण खोजा।
    - खोज करने की योग्यता।
    solution: गुरुत्वाकर्षण का सिद्धांत खोजने वाला न्यूटन संस्कृत व्यक्ति था।
  - prompt: लेखक ने किन दो आविष्कारों के उदाहरण दिए हैं?
    options:
    - आग और सुई-धागा
    - पहिया और रेल
    - बिजली और टेलीफ़ोन
    - कागज़ और छापाखाना
    answer: आग और सुई-धागा
    difficulty: 1
    hints:
    - बहुत पुराने आविष्कार।
    - पेट भरने और तन ढकने के लिए।
    solution: लेखक आग और सुई-धागे के आविष्कार का उदाहरण देते हैं।
  - prompt: '''असंस्कृति'' किसे कहा गया है?'
    options:
    - वह योग्यता जो विनाश के साधन बनाए
    - पुरानी परंपराएँ
    - गाँव का जीवन
    - पढ़ाई न करना
    answer: वह योग्यता जो विनाश के साधन बनाए
    difficulty: 2
    hints:
    - मानव-कल्याण के विरुद्ध।
    - आत्म-विनाश।
    solution: जो योग्यता आत्म-विनाश के साधन बनाती है, वह असंस्कृति है।
  - prompt: '''संस्कृति'' निबंध के लेखक कौन हैं?'
    options:
    - भदंत आनंद कौसल्यायन
    - यतींद्र मिश्र
    - यशपाल
    - मन्नू भंडारी
    answer: भदंत आनंद कौसल्यायन
    difficulty: 1
    hints:
    - बौद्ध भिक्षु।
    - हिंदी प्रचारक।
    solution: यह निबंध भदंत आनंद कौसल्यायन का है।
    mistakes:
      यतींद्र मिश्र: hin10_author
