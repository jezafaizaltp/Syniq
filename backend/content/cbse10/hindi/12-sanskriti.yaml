subject: cbse10-hin
chapter: 12
title: संस्कृति
tips:
  h10_aag_sui: "लेखक बहुत पुराने, आदिम आविष्कारों की बात करते हैं: एक गर्मी के लिए, एक कपड़े सीने के लिए।"
  h10_asanskriti: "लेखक के अनुसार जो बुद्धि मनुष्य का नाश करने वाली चीज़ें बनाए, वह क्या है?"
  h10_newton: "न्यूटन ने गुरुत्वाकर्षण खोजा, अपनी बुद्धि और जिज्ञासा से। लेखक ऐसे व्यक्ति को क्या कहते हैं?"
  h10_sabhyata: "लेखक के अनुसार संस्कृति पहले आती है, सभ्यता उससे बनती है।"
  h10k12_bhed: लेखक संस्कृति (आविष्कार की योग्यता) और सभ्यता (उसका परिणाम) में फ़र्क करते हैं। प्रश्न किस ओर इशारा करता है?
  h10k12_udaharan: 'लेखक के उदाहरण याद करो: आग, सुई-धागा, न्यूटन, सिद्धार्थ, मार्क्स, लेनिन। हर उदाहरण किस बात को समझाता है?'

concepts:
- code: hin10c.k12.sanskriti
  title: संस्कृति
  notes: |
    भदंत आनंद कौसल्यायन का निबंध। 'सभ्यता' और 'संस्कृति' शब्दों का प्रयोग बहुत होता है पर अर्थ स्पष्ट नहीं।
    लेखक उदाहरण देते हैं: जिस व्यक्ति ने पहली बार आग का आविष्कार किया, या सुई-धागे की खोज की, उसकी वह
    योग्यता, प्रवृत्ति या प्रेरणा, जिससे आविष्कार हुआ, उसकी 'संस्कृति' है; और उस आविष्कार से बनी चीज़ें व
    जीवन-शैली 'सभ्यता' है। न्यूटन ने गुरुत्वाकर्षण का सिद्धांत खोजा, वह संस्कृत व्यक्ति था; आज का विद्यार्थी
    जो वह सिद्धांत जानता है, वह सभ्य हो सकता है पर संस्कृत नहीं। आविष्कार के पीछे भौतिक प्रेरणा (पेट भरना,
    तन ढकना) और आंतरिक प्रेरणा (जिज्ञासा, दूसरों के लिए त्याग — जैसे सिद्धार्थ, कार्ल मार्क्स, लेनिन) दोनों
    होती हैं। जो योग्यता आत्म-विनाश के साधन बनाए, वह 'असंस्कृति' है। संस्कृति मानव-कल्याण से जुड़ी है;
    उसे बाँटा नहीं जा सकता।
  explanations:
    text: लेखक सभ्यता और संस्कृति का अंतर समझाते हैं। आग या सुई-धागे की खोज करने की योग्यता और प्रेरणा संस्कृति है; उस खोज से बनी चीज़ें और रहन-सहन सभ्यता है। जो योग्यता विनाश के साधन बनाए, वह असंस्कृति है।
    visual: 'दो खाने बनाइए: बाएँ ''संस्कृति'' में आग खोजने वाले का जिज्ञासु मन; दाएँ ''सभ्यता'' में उससे बनी रसोई, दीपक और कारखाने।'
    step_by_step: '1. आविष्कार करने की योग्यता या प्रेरणा = संस्कृति। 2. उससे बना परिणाम = सभ्यता। 3. उदाहरण: आग, सुई-धागा, न्यूटन। 4. प्रेरणाएँ: भौतिक और आंतरिक। 5. असंस्कृति: विनाश की ओर।'
    real_world: मोबाइल फ़ोन का उपयोग करना सभ्यता है, पर उसे बनाने वाली जिज्ञासा और कल्पना संस्कृति थी।
  picture:
    kind: compare
    columns:
    - title: संस्कृति
      points:
      - आविष्कार की योग्यता और प्रेरणा
      - आग खोजने वाले की जिज्ञासा
      - न्यूटन की खोज की क्षमता
    - title: सभ्यता
      points:
      - आविष्कार का परिणाम
      - आग से बनी रसोई, दीपक
      - सिद्धांत जानने वाला आज का विद्यार्थी
    - title: असंस्कृति
      points:
      - विनाश के साधन बनाने वाली योग्यता
      - मानव-कल्याण के विरुद्ध
    alt: संस्कृति आविष्कार की योग्यता और प्रेरणा है, सभ्यता उसका परिणाम है, और असंस्कृति विनाश की ओर ले जाने वाली योग्यता है।
  activity:
    type: sort
    prompt: लेखक के अनुसार यह 'संस्कृति' है, 'सभ्यता' है, या 'असंस्कृति'?
    bins:
    - संस्कृति
    - सभ्यता
    - असंस्कृति
    items:
    - label: आग खोजनेवाले की प्रेरणा और योग्यता
      bin: संस्कृति
      clue: आविष्कार के पीछे की शक्ति या उससे बनी चीज़?
      why: जिस योग्यता से आविष्कार हुआ, वह संस्कृति।
    - label: न्यूटन का गुरुत्वाकर्षण खोजना
      bin: संस्कृति
      clue: नई खोज करनेवाला क्या है?
      why: न्यूटन संस्कृत व्यक्ति थे।
    - label: सुई-धागे से बने कपड़े पहनना
      bin: सभ्यता
      clue: यह खोज है या खोज का नतीजा?
      why: आविष्कार से बनी जीवन-शैली सभ्यता है।
    - label: सिद्धांत जाननेवाला आज का विद्यार्थी
      bin: सभ्यता
      clue: क्या उसने खुद खोजा?
      why: वह सभ्य हो सकता है, संस्कृत नहीं।
    - label: आत्म-विनाश के साधन बनाना
      bin: असंस्कृति
      clue: क्या यह मानव-कल्याण से जुड़ा है?
      why: विनाश की योग्यता असंस्कृति है।
  lesson:
    - teach: '''संस्कृति'' भदंत आनंद कौसल्यायन का निबंध है। वे कहते हैं कि सभ्यता और संस्कृति शब्दों का प्रयोग बहुत होता है, पर अर्थ कम समझे जाते हैं। जिस योग्यता, प्रवृत्ति या प्रेरणा से कोई आविष्कार होता है, वह संस्कृति है; और उस आविष्कार का परिणाम (जैसे हमारा खान-पान, पहनावा, साधन) सभ्यता है।'
      check:
        prompt: लेखक के अनुसार सभ्यता क्या है?
        options:
        - संस्कृति का परिणाम
        - आविष्कार की प्रेरणा
        - पुरानी परंपरा
        answer: संस्कृति का परिणाम
        why: संस्कृति से जो बनता है, वह सभ्यता है।
    - teach: आग का आविष्कार पेट की ज्वाला ने करवाया, और सुई-धागे का आविष्कार सर्दी-गर्मी से बचने और शरीर सजाने की इच्छा ने। जिस व्यक्ति ने पहली बार आग या सुई-धागा खोजा, वह संस्कृत व्यक्ति था। न्यूटन ने गुरुत्वाकर्षण का सिद्धांत खोजा, इसलिए वह संस्कृत था; आज का विद्यार्थी न्यूटन से अधिक जानता है, पर उसे सभ्य कहा जा सकता है, संस्कृत नहीं।
      picture:
        kind: compare
        columns:
        - title: संस्कृति
          points:
          - आविष्कार की योग्यता
          - प्रेरणा, प्रवृत्ति
          - न्यूटन की खोज
        - title: सभ्यता
          points:
          - आविष्कार का परिणाम
          - खान-पान, पहनावा
          - विद्यार्थी का ज्ञान
        alt: 'संस्कृति और सभ्यता का अंतर: संस्कृति आविष्कार की योग्यता और प्रेरणा है, सभ्यता उसका परिणाम है।'
      check:
        prompt: आज के विद्यार्थी को लेखक क्या कहते हैं?
        options:
        - सभ्य, पर संस्कृत नहीं
        - संस्कृत, पर सभ्य नहीं
        - न सभ्य न संस्कृत
        answer: सभ्य, पर संस्कृत नहीं
        why: उसने कुछ खोजा नहीं, पहले की खोज को जाना है।
    - teach: केवल भौतिक ज़रूरत ही नहीं, ज्ञान की चाह (रात के तारों को देखकर जिज्ञासा) और दूसरों के कल्याण की भावना भी संस्कृति है। सिद्धार्थ ने मानवता को सुखी करने के लिए घर छोड़ा, कार्ल मार्क्स ने मज़दूरों के लिए दुखपूर्ण जीवन बिताया, लेनिन ने रोटी के सूखे टुकड़े दूसरों को खिलाए। जो योग्यता विनाश के साधन बनाए, वह असंस्कृति है। मानव संस्कृति अविभाज्य है; उसे धर्मों में बाँटना ठीक नहीं।
      check:
        prompt: लेखक के अनुसार मानव संस्कृति कैसी है?
        options:
        - अविभाज्य
        - धर्मों में बँटी
        - केवल पश्चिमी
        answer: अविभाज्य
        why: उसका कल्याणकारी अंश सबका साझा है।
  items:
  - prompt: लेखक के अनुसार 'संस्कृति' क्या है?
    options:
    - आविष्कार करने की योग्यता, प्रवृत्ति या प्रेरणा
    - महँगे कपड़े पहनना
    - आविष्कार से बनी चीज़ें
    - बड़े शहरों में रहना
    answer: आविष्कार करने की योग्यता, प्रवृत्ति या प्रेरणा
    difficulty: 1
    hints:
    - आग खोजने वाले की क्षमता।
    - परिणाम नहीं, प्रेरणा।
    solution: संस्कृति वह योग्यता या प्रेरणा है जिससे आविष्कार होता है।
    mistakes:
      आविष्कार से बनी चीज़ें: hin10_read_again
  - prompt: लेखक के अनुसार 'सभ्यता' क्या है?
    options:
    - संस्कृति का परिणाम
    - आविष्कार की प्रेरणा
    - जिज्ञासा
    - धर्म
    answer: संस्कृति का परिणाम
    difficulty: 2
    hints:
    - आविष्कार से बनी चीज़ें और रहन-सहन।
    - परिणाम।
    solution: सभ्यता संस्कृति का परिणाम है।
    mistakes: {"आविष्कार की प्रेरणा": "h10_sabhyata"}
  - prompt: न्यूटन को लेखक ने क्या कहा है?
    options:
    - संस्कृत व्यक्ति
    - असंस्कृत व्यक्ति
    - केवल सभ्य व्यक्ति
    - साधारण व्यक्ति
    answer: संस्कृत व्यक्ति
    difficulty: 2
    hints:
    - उसने गुरुत्वाकर्षण खोजा।
    - खोज करने की योग्यता।
    solution: गुरुत्वाकर्षण का सिद्धांत खोजने वाला न्यूटन संस्कृत व्यक्ति था।
    mistakes: {"असंस्कृत व्यक्ति": "h10_newton"}
  - prompt: लेखक ने किन दो आविष्कारों के उदाहरण दिए हैं?
    options:
    - आग और सुई-धागा
    - पहिया और रेल
    - बिजली और टेलीफ़ोन
    - कागज़ और छापाखाना
    answer: आग और सुई-धागा
    difficulty: 1
    hints:
    - बहुत पुराने आविष्कार।
    - पेट भरने और तन ढकने के लिए।
    solution: लेखक आग और सुई-धागे के आविष्कार का उदाहरण देते हैं।
    mistakes: {"बिजली और टेलीफ़ोन": "h10_aag_sui"}
  - prompt: '''असंस्कृति'' किसे कहा गया है?'
    options:
    - वह योग्यता जो विनाश के साधन बनाए
    - पुरानी परंपराएँ
    - गाँव का जीवन
    - पढ़ाई न करना
    answer: वह योग्यता जो विनाश के साधन बनाए
    difficulty: 2
    hints:
    - मानव-कल्याण के विरुद्ध।
    - आत्म-विनाश।
    solution: जो योग्यता आत्म-विनाश के साधन बनाती है, वह असंस्कृति है।
    mistakes: {"पुरानी परंपराएँ": "h10_asanskriti"}
  - prompt: '''संस्कृति'' निबंध के लेखक कौन हैं?'
    options:
    - भदंत आनंद कौसल्यायन
    - यतींद्र मिश्र
    - यशपाल
    - मन्नू भंडारी
    answer: भदंत आनंद कौसल्यायन
    difficulty: 1
    hints:
    - बौद्ध भिक्षु।
    - हिंदी प्रचारक।
    solution: यह निबंध भदंत आनंद कौसल्यायन का है।
    mistakes:
      यतींद्र मिश्र: hin10_author
  - prompt: आग के आविष्कार के पीछे कौन-सी प्रेरणा थी?
    options:
    - पेट की ज्वाला (भूख)
    - सजावट की इच्छा
    - युद्ध
    - खेल
    answer: पेट की ज्वाला (भूख)
    difficulty: 2
    hints:
    - खाना पकाने की ज़रूरत।
    - एक भौतिक प्रेरणा।
    solution: आग के आविष्कार की प्रेरणा भूख थी।
    mistakes:
      सजावट की इच्छा: h10k12_udaharan
  - prompt: सुई-धागे के आविष्कार के पीछे क्या प्रेरणा थी?
    options:
    - सर्दी-गर्मी से बचने और शरीर सजाने की इच्छा
    - भूख
    - धन कमाना
    - युद्ध जीतना
    answer: सर्दी-गर्मी से बचने और शरीर सजाने की इच्छा
    difficulty: 2
    hints:
    - कपड़े सिलने के लिए।
    - शरीर को ढकना।
    solution: सुई-धागा शीतोष्ण से बचने और शरीर सजाने के लिए खोजा गया।
    mistakes:
      भूख: h10k12_udaharan
  - prompt: न्यूटन ने किस सिद्धांत की खोज की?
    options:
    - गुरुत्वाकर्षण
    - सापेक्षता
    - विकासवाद
    - परमाणु
    answer: गुरुत्वाकर्षण
    difficulty: 1
    hints:
    - सेब गिरने की कहानी।
    - धरती चीज़ों को खींचती है।
    solution: न्यूटन ने गुरुत्वाकर्षण का सिद्धांत खोजा।
    mistakes:
      सापेक्षता: h10k12_udaharan
  - prompt: सिद्धार्थ ने घर क्यों छोड़ा?
    options:
    - मानवता को सुखी करने का मार्ग खोजने के लिए
    - धन कमाने के लिए
    - राज्य जीतने के लिए
    - पढ़ाई के लिए
    answer: मानवता को सुखी करने का मार्ग खोजने के लिए
