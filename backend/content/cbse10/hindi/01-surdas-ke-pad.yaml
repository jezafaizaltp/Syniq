# CBSE Class 10 Hindi A (NCERT Kshitij 2), a selection of lessons. Chapter numbers here are SYNiq's own order.
# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hin
chapter: 1
title: सूरदास के पद
tips:
  hin10_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10_badbhagi: "गोपियाँ उद्धव की तारीफ़ नहीं, व्यंग्य कर रही हैं। कृष्ण के पास रहकर भी उद्धव में क्या नहीं जागा?"
  h10_kakdi: "गोपियों को योग का संदेश अच्छा नहीं लगा। स्वाद के हिसाब से सोचो।"
  h10_purain: "यह पत्ता पानी में रहकर भी गीला नहीं होता। सोचो, जल में उगने वाला कौन-सा फूल-पौधा अपने चिकने पत्तों के लिए जाना जाता है।"
  h10_raj_dharm: "गोपियाँ कहती हैं कि अच्छा राजा अपनी प्रजा के साथ कैसा व्यवहार करता है?"
  h10k1_pad: 'चारों पदों में अलग-अलग बात है: उद्धव पर व्यंग्य, मन की व्यथा, हारिल की लकड़ी, और राजधर्म। प्रश्न किस पद का है, पहले यह पहचानो।'
  h10k1_upma: सूरदास उपमा से बात समझाते हैं। सोचो कि जिस चीज़ से तुलना की गई है, उसका स्वभाव क्या है।
concepts:
- code: hin10c.k1.surdas
  title: सूरदास के पद
  notes: |
    सूरदास के 'सूरसागर' के भ्रमरगीत से लिए पद, ब्रजभाषा में। कृष्ण मथुरा चले गए हैं और उद्धव को योग का संदेश देकर
    गोपियों के पास भेजते हैं। गोपियाँ उद्धव को व्यंग्य से 'बड़भागी' कहती हैं: वे कृष्ण के पास रहकर भी प्रेम से
    अछूते रहे, जैसे कमल का पत्ता (पुरइनि पात) जल में रहकर भी नहीं भीगता, और तेल की गगरी पानी में डूबकर भी
    उस पर बूँद नहीं ठहरती। 'मन की मन ही माँझ रही' — मन की बात मन में ही रह गई। कृष्ण उनके लिए 'हारिल की
    लकड़ी' हैं, जिसे वे कभी नहीं छोड़तीं। योग का संदेश उन्हें 'कड़वी ककड़ी' जैसा लगता है। अंत में वे कहती हैं कि
    कृष्ण ने राजनीति पढ़ ली है, और राजा का धर्म है कि प्रजा को न सताए।
  explanations:
    text: कृष्ण के मथुरा जाने के बाद उद्धव गोपियों को योग अपनाने का संदेश देने आते हैं। गोपियाँ व्यंग्य से कहती हैं कि उद्धव बड़े भाग्यशाली हैं जो कृष्ण के पास रहकर भी प्रेम से अछूते रहे। उनके लिए कृष्ण का प्रेम हारिल की लकड़ी जैसा है, और योग का संदेश कड़वी ककड़ी जैसा।
    visual: 'कल्पना कीजिए: तालाब में कमल का पत्ता, जिस पर पानी की बूँदें नहीं ठहरतीं; और एक हारिल पक्षी जो पंजों में लकड़ी पकड़े उड़ रहा है, उसे कभी नहीं छोड़ता।'
    step_by_step: '1. प्रसंग: उद्धव का योग-संदेश। 2. व्यंग्य: ''बड़भागी'' उद्धव। 3. उपमाएँ: कमल का पत्ता, तेल की गगरी। 4. गोपियों का प्रेम: हारिल की लकड़ी। 5. राजधर्म की याद।'
    real_world: जब कोई बहुत प्यार करने वाले को केवल 'समझदारी' की बातें समझाए, तो वह भी गोपियों की तरह कहेगा कि दिल की बात तर्क से नहीं बदलती।
  picture:
    kind: flow
    steps:
    - कृष्ण मथुरा जाते हैं
    - उद्धव योग का संदेश लेकर आते हैं
    - गोपियाँ व्यंग्य से उद्धव को 'बड़भागी' कहती हैं
    - कृष्ण उनके लिए 'हारिल की लकड़ी' हैं
    - योग का संदेश 'कड़वी ककड़ी' जैसा लगता है
    alt: 'सूरदास के पदों का क्रम: कृष्ण का मथुरा जाना, उद्धव का संदेश, गोपियों का व्यंग्य, हारिल की लकड़ी और कड़वी ककड़ी की उपमाएँ।'
  activity:
    type: sort
    prompt: गोपियाँ किससे किसकी तुलना करती हैं? उद्धव से, या अपने कृष्ण-प्रेम से?
    bins:
    - उद्धव जैसे (प्रेम से अछूते)
    - गोपियों का प्रेम
    - योग का संदेश
    items:
    - label: पुरइनि पात (कमल का पत्ता)
      bin: उद्धव जैसे (प्रेम से अछूते)
      clue: कमल का पत्ता जल में रहकर भी क्या नहीं होता?
      why: 'पत्ता भीगता नहीं: उद्धव कृष्ण के पास रहकर भी प्रेम से अछूते।'
    - label: तेल की गगरी
      bin: उद्धव जैसे (प्रेम से अछूते)
      clue: पानी में डुबाने पर गगरी पर बूँद ठहरती है?
      why: 'बूँद नहीं ठहरती: उद्धव पर प्रेम का असर नहीं।'
    - label: हारिल की लकड़ी
      bin: गोपियों का प्रेम
      clue: हारिल पक्षी लकड़ी को कब छोड़ता है?
      why: 'हारिल लकड़ी कभी नहीं छोड़ता: गोपियाँ कृष्ण को नहीं छोड़तीं।'
    - label: मन की मन ही माँझ रही
      bin: गोपियों का प्रेम
      clue: यह किसके मन की बात है?
      why: गोपियों की प्रेम-बात मन में ही रह गई।
    - label: कड़वी ककड़ी
      bin: योग का संदेश
      clue: गोपियों को कौन-सी बात बेस्वाद लगती है?
      why: उद्धव का योग-संदेश उन्हें कड़वी ककड़ी जैसा लगता है।
  lesson:
    - teach: ये पद सूरदास के 'सूरसागर' के 'भ्रमरगीत' से लिए गए हैं और ब्रजभाषा में हैं। कृष्ण मथुरा चले गए हैं और उन्होंने उद्धव को गोपियों के पास योग और निर्गुण ब्रह्म का संदेश लेकर भेजा है। गोपियाँ कृष्ण से प्रेम करती हैं, इसलिए वे उद्धव के ज्ञान पर व्यंग्य करती हैं।
      check:
        prompt: उद्धव गोपियों के पास क्या संदेश लेकर आए?
        options:
        - योग का संदेश
        - कृष्ण के लौटने का समाचार
        - विवाह का निमंत्रण
        answer: योग का संदेश
        why: कृष्ण ने उन्हें योग-संदेश देकर भेजा था।
    - teach: 'पहले पद में गोपियाँ उद्धव को व्यंग्य से ''बड़भागी'' कहती हैं: वे कृष्ण के पास रहकर भी प्रेम से अछूते रहे, जैसे कमल का पत्ता (पुरइनि पात) जल में रहकर भी गीला नहीं होता, या पानी में तेल की गगरी पर बूँद नहीं ठहरती। गोपियाँ खुद को गुड़ से चिपकी चींटी जैसा बताती हैं, जो प्रेम में पगी हैं।'
      picture:
        kind: compare
        columns:
        - title: उद्धव
          points:
          - कमल के पत्ते जैसे
          - प्रेम से अछूते
          - ज्ञान और योग
        - title: गोपियाँ
          points:
          - गुड़ से चिपकी चींटी जैसी
          - कृष्ण-प्रेम में डूबी
          - योग कड़वी ककड़ी
        alt: 'उद्धव और गोपियों की तुलना: उद्धव कमल के पत्ते की तरह प्रेम से अछूते, गोपियाँ गुड़ से चिपकी चींटी की तरह प्रेम में डूबी।'
      check:
        prompt: गोपियाँ अपनी तुलना किससे करती हैं?
        options:
        - गुड़ से चिपकी चींटी से
        - कमल के पत्ते से
        - तेल की गगरी से
        answer: गुड़ से चिपकी चींटी से
        why: वे कृष्ण-प्रेम से अलग नहीं हो सकतीं।
    - teach: दूसरे पद में गोपियाँ कहती हैं कि मन की बात मन में ही रह गई; वे कृष्ण के लौटने की आस में जी रही थीं, पर योग-संदेश ने विरह की आग और बढ़ा दी। तीसरे पद में कृष्ण उनके लिए हारिल की लकड़ी हैं, और योग कड़वी ककड़ी जैसा है। चौथे पद में वे कहती हैं कि कृष्ण राजनीति पढ़ आए हैं, और राजा का धर्म प्रजा को न सताना है।
      check:
        prompt: चौथे पद में गोपियाँ किस बात पर व्यंग्य करती हैं?
        options:
        - कृष्ण राजनीति पढ़ आए हैं
        - उद्धव बहुत भोले हैं
        - मथुरा बहुत दूर है
        answer: कृष्ण राजनीति पढ़ आए हैं
        why: वे कहती हैं कि अब कृष्ण चतुर राजनीतिज्ञ हो गए हैं।
  items:
  - prompt: सूरदास के ये पद किस भाषा में हैं?
    options:
    - ब्रजभाषा
    - अवधी
    - खड़ी बोली
    - मैथिली
    answer: ब्रजभाषा
    difficulty: 1
    hints:
    - कृष्ण की लीला-भूमि की भाषा।
    - तुलसी अवधी में लिखते थे।
    solution: सूरदास ने ब्रजभाषा में लिखा।
    mistakes:
      अवधी: hin10_author
  - prompt: गोपियाँ उद्धव को 'बड़भागी' क्यों कहती हैं?
    options:
    - व्यंग्य में, क्योंकि वे कृष्ण के पास रहकर भी प्रेम से अछूते रहे
    - क्योंकि वे बहुत धनी थे
    - क्योंकि वे राजा थे
    - क्योंकि वे गोपियों से प्रेम करते थे
    answer: व्यंग्य में, क्योंकि वे कृष्ण के पास रहकर भी प्रेम से अछूते रहे
    difficulty: 2
    hints:
    - यह प्रशंसा नहीं, व्यंग्य है।
    - कमल के पत्ते जैसा।
    solution: गोपियाँ व्यंग्य करती हैं कि उद्धव कृष्ण के निकट रहकर भी प्रेम में नहीं डूबे।
    mistakes: {"क्योंकि वे बहुत धनी थे": "h10_badbhagi"}
  - prompt: '''पुरइनि पात'' किसे कहा गया है?'
    options:
    - कमल का पत्ता
    - पीपल का पत्ता
    - तुलसी का पत्ता
    - केले का पत्ता
    answer: कमल का पत्ता
    difficulty: 1
    hints:
    - जल में रहकर भी नहीं भीगता।
    - तालाब में उगता है।
    solution: पुरइनि पात कमल का पत्ता है।
    mistakes: {"पीपल का पत्ता": "h10_purain"}
  - prompt: गोपियों ने कृष्ण को किसके समान बताया है?
    options:
    - हारिल की लकड़ी
    - कड़वी ककड़ी
    - तेल की गगरी
    - भौंरा
    answer: हारिल की लकड़ी
    difficulty: 1
    hints:
    - हारिल पक्षी उसे कभी नहीं छोड़ता।
    - दृढ़ प्रेम।
    solution: कृष्ण उनके लिए हारिल की लकड़ी हैं, जिसे वे कभी नहीं छोड़तीं।
    mistakes:
      कड़वी ककड़ी: hin10_poem_meaning
  - prompt: योग का संदेश गोपियों को कैसा लगता है?
    options:
    - कड़वी ककड़ी जैसा
    - मीठे फल जैसा
    - ठंडे पानी जैसा
    - मधुर संगीत जैसा
    answer: कड़वी ककड़ी जैसा
    difficulty: 1
    hints:
    - अप्रिय चीज़।
    - जिसे खाना मुश्किल।
    solution: योग-संदेश उन्हें कड़वी ककड़ी की तरह अप्रिय लगता है।
    mistakes: {"मीठे फल जैसा": "h10_kakdi"}
  - prompt: गोपियों के अनुसार राजा का धर्म क्या है?
    options:
    - प्रजा को न सताना
    - युद्ध करना
    - कर बढ़ाना
    - योग सिखाना
    answer: प्रजा को न सताना
    difficulty: 2
    hints:
    - कृष्ण ने राजनीति पढ़ ली है।
    - राजधर्म।
    solution: गोपियाँ याद दिलाती हैं कि राजधर्म है प्रजा को कष्ट न देना।
    mistakes: {"कर बढ़ाना": "h10_raj_dharm"}
  - prompt: ये पद सूरदास की किस रचना से लिए गए हैं?
    options:
    - सूरसागर
    - रामचरितमानस
    - साखी
    - पद्मावत
    answer: सूरसागर
    difficulty: 2
    hints:
    - यह सूरदास का प्रसिद्ध ग्रंथ है।
    - इसके 'भ्रमरगीत' अंश से ये पद लिए गए हैं।
    solution: ये पद सूरसागर के भ्रमरगीत से लिए गए हैं।
    mistakes:
      रामचरितमानस: hin10_author
  - prompt: '''ज्यौं जल माहँ तेल की गागरि'' से गोपियाँ उद्धव के बारे में क्या कहती हैं?'
    options:
    - वे प्रेम के बीच रहकर भी उससे अछूते रहे
    - वे बहुत भारी हैं
    - वे तैरना जानते हैं
    - वे तेल बेचते हैं
    answer: वे प्रेम के बीच रहकर भी उससे अछूते रहे
    difficulty: 2
    hints:
    - तेल लगी गगरी पर पानी नहीं ठहरता।
    - उद्धव पर कृष्ण के प्रेम का असर नहीं हुआ।
    solution: जैसे तेल की गगरी पर पानी की बूँद नहीं टिकती, वैसे ही उद्धव पर प्रेम का असर नहीं हुआ।
    mistakes:
      वे तैरना जानते हैं: h10k1_upma
  - prompt: गोपियाँ अपने को 'अबला' और 'भोरी' क्यों कहती हैं?
    options:
    - वे प्रेम में डूबी सीधी-सादी हैं, ज्ञान-योग नहीं समझतीं
    - वे बीमार हैं
    - वे बहुत चतुर हैं
