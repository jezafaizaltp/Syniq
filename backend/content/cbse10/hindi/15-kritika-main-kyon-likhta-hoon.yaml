subject: cbse10-hin
chapter: 15
title: मैं क्यों लिखता हूँ
tips:
  h10_anubhuti: "एक शब्द बाहर घटी घटना से जुड़ा है, दूसरा मन की संवेदना और कल्पना से। अज्ञेय किसे ज़्यादा गहरा मानते हैं?"
  h10_chhaya: "विस्फोट की रोशनी से पत्थर झुलस गया, पर जहाँ कोई मनुष्य खड़ा था वहाँ निशान अलग रह गया।"
  h10_hiroshima: "1945 में हिरोशिमा पर मनुष्य ने एक हथियार गिराया था। भूकंप प्राकृतिक होता है।"
  h10_kyon_likhta: "अज्ञेय बाहरी कारणों को मुख्य नहीं मानते। वे भीतर की किस बात से लिखते हैं?"
  h10c3_karan: "अज्ञेय लिखने के दो तरह के कारण बताते हैं: कुछ मन के अंदर से उठते हैं और मुख्य हैं, कुछ बाहर से आते हैं और गौण हैं। प्रश्न किस तरह के कारण की बात करता है?"
  h10c3_hiroshima: 'हिरोशिमा का अनुभव कई चरणों में कविता बना: जाना, देखना, पत्थर की छाया, भारत लौटना। चरण पहचानो।'

concepts:
- code: hin10c.c3.agyeya
  title: मैं क्यों लिखता हूँ
  notes: |
    सच्चिदानंद हीरानंद वात्स्यायन 'अज्ञेय' का निबंध। लेखक कहते हैं कि वे इसलिए लिखते हैं ताकि जान सकें कि
    वे क्यों लिखते हैं; लिखना भीतरी विवशता से मुक्ति पाने का उपाय है। कुछ लोग बाहरी दबाव (संपादक, प्रकाशक,
    पैसे) से लिखते हैं। वे 'अनुभव' और 'अनुभूति' में अंतर बताते हैं: अनुभव घटित घटना से मिलता है, अनुभूति
    संवेदना और कल्पना से, और वह अनुभव से गहरी होती है। उदाहरण: हिरोशिमा पर गिराए गए परमाणु बम के बारे में
    उन्होंने पढ़ा था; जापान जाकर हिरोशिमा का अस्पताल देखा, फिर भी लिख न पाए। एक दिन सड़क पर घूमते हुए
    उन्होंने एक जले हुए पत्थर पर किसी मनुष्य की उजली छाया देखी, जो विस्फोट के समय वहाँ खड़ा रहा होगा; तब
    उन्हें अनुभूति हुई। भारत लौटकर रेलगाड़ी में बैठे-बैठे उन्होंने 'हिरोशिमा' कविता लिखी। भाव: सच्चा लेखन
    भीतरी अनुभूति से जन्म लेता है; विज्ञान का दुरुपयोग।
  explanations:
    text: अज्ञेय बताते हैं कि वे लिखते हैं ताकि अपने भीतर की बेचैनी समझ सकें और उससे मुक्त हो सकें। सच्चा लेखन केवल अनुभव से नहीं, गहरी अनुभूति से आता है। हिरोशिमा में एक जले पत्थर पर मनुष्य की छाया देखकर उन्हें वह अनुभूति हुई, और भारत लौटकर उन्होंने 'हिरोशिमा' कविता लिखी।
    visual: 'कल्पना कीजिए: हिरोशिमा की सड़क पर एक झुलसा हुआ पत्थर, जिस पर एक मनुष्य की उजली परछाईं छपी है, और उसे चुपचाप देखते हुए लेखक।'
    step_by_step: '1. लेखक क्यों लिखते हैं: भीतरी विवशता। 2. बाहरी दबाव से लिखना। 3. अनुभव बनाम अनुभूति। 4. हिरोशिमा का उदाहरण: जला पत्थर, छाया। 5. रेलगाड़ी में कविता का जन्म।'
    real_world: हम युद्ध की ख़बरें रोज़ पढ़ते हैं, पर किसी एक चेहरे या चीज़ को देखकर ही असली दर्द महसूस करते हैं; यही अनुभूति है।
  picture:
    kind: compare
    columns:
    - title: अनुभव
      points:
      - घटित घटना से मिलता है
      - हिरोशिमा के बारे में पढ़ना
      - अस्पताल देखना
    - title: अनुभूति
      points:
      - संवेदना और कल्पना से
      - जले पत्थर पर मनुष्य की छाया देखना
      - जिससे कविता जन्मी
    alt: अनुभव घटनाओं से मिलता है, जैसे हिरोशिमा के बारे में पढ़ना; अनुभूति संवेदना से, जैसे जले पत्थर पर छाया देखना, जिससे कविता जन्मी।
  activity:
    type: order
    prompt: '''हिरोशिमा'' कविता कैसे लिखी गई? क्रम से लगाओ।'
    steps:
    - परमाणु बम के बारे में पढ़ा
    - जापान जाकर हिरोशिमा का अस्पताल देखा
    - जले पत्थर पर मनुष्य की उजली छाया देखी
    - भारत लौटकर रेलगाड़ी में कविता लिखी
    reasons:
      जापान जाकर हिरोशिमा का अस्पताल देखा: पढ़ने से अनुभव नहीं हुआ, तब वहाँ जाकर देखा।
      जले पत्थर पर मनुष्य की उजली छाया देखी: अस्पताल देखकर भी लिख न पाए; छाया बाद में एक दिन घूमते हुए दिखी।
      भारत लौटकर रेलगाड़ी में कविता लिखी: 'छाया देखकर अनुभूति हुई: उसी से कविता निकली।'
  lesson:
    - teach: '''मैं क्यों लिखता हूँ'' अज्ञेय (सच्चिदानंद हीरानंद वात्स्यायन) का निबंध है। वे कहते हैं कि वे यह जानने के लिए लिखते हैं कि वे क्यों लिखते हैं। लिखने का मुख्य कारण भीतरी विवशता है, जिससे लिखकर ही मुक्ति मिलती है। बाहरी दबाव, जैसे संपादकों का आग्रह, प्रकाशक का तक़ाज़ा, या पैसे की ज़रूरत, गौण कारण हैं।'
      check:
        prompt: अज्ञेय के लिखने का मुख्य कारण क्या है?
        options:
        - भीतरी विवशता से मुक्ति
        - पैसे कमाना
        - संपादक का आग्रह
        answer: भीतरी विवशता से मुक्ति
        why: बाहरी दबाव गौण हैं।
    - teach: लेखक अनुभव और अनुभूति में भेद करते हैं। अनुभव घटित का होता है, जो हमने देखा या भोगा। अनुभूति संवेदना और कल्पना से वह भी देख लेती है जो हमारे साथ घटित नहीं हुआ। इसलिए अनुभूति अनुभव से अधिक गहरी है। लेखक के लिए लिखना तभी संभव होता है जब अनुभव अनुभूति बनकर भीतर से विवश करे।
      picture:
        kind: compare
        columns:
        - title: अनुभव
          points:
          - जो घटा, उसे देखा
          - बाहर की बात
          - कम गहरा
        - title: अनुभूति
          points:
          - संवेदना और कल्पना
          - भीतर से जुड़ाव
          - अधिक गहरी
        alt: 'अनुभव और अनुभूति का अंतर: अनुभव जो घटा उसे देखना है, अनुभूति संवेदना और कल्पना से भीतर तक महसूस करना है, जो अधिक गहरी है।'
      check:
        prompt: अनुभूति को अधिक गहरी क्यों कहा गया?
        options:
        - वह संवेदना और कल्पना से अघटित को भी महसूस कर लेती है
        - वह केवल देखी चीज़ों से बनती है
        - वह किताबों से आती है
        answer: वह संवेदना और कल्पना से अघटित को भी महसूस कर लेती है
        why: अनुभव केवल घटित तक सीमित है।
    - teach: 'लेखक जापान में हिरोशिमा गए, जहाँ परमाणु बम गिरा था। उन्होंने अस्पतालों में घायल लोग देखे, पर तब कुछ लिख न सके। फिर एक दिन उन्होंने जले हुए पत्थर पर एक मनुष्य की उजली छाया देखी: विस्फोट के समय वहाँ खड़ा आदमी भाप बन गया था, और रेडियोधर्मी किरणों ने पत्थर को झुलसाकर उसकी छाया छोड़ दी। इस दृश्य से वे उस त्रासदी के ''भोक्ता'' बन गए। भारत लौटकर रेलगाड़ी में बैठे-बैठे उन्होंने ''हिरोशिमा'' कविता लिखी।'
      check:
        prompt: पत्थर पर मनुष्य की छाया देखकर लेखक क्या बन गए?
        options:
        - उस त्रासदी के भोक्ता
        - एक वैज्ञानिक
        - एक पर्यटक
        answer: उस त्रासदी के भोक्ता
        why: अनुभव अनुभूति बन गया।
  items:
  - prompt: '''मैं क्यों लिखता हूँ'' के लेखक कौन हैं?'
    options:
    - अज्ञेय
    - शिवपूजन सहाय
    - मधु कांकरिया
    - यशपाल
    answer: अज्ञेय
    difficulty: 1
    hints:
    - पूरा नाम सच्चिदानंद हीरानंद वात्स्यायन।
    - प्रयोगवाद।
    solution: यह निबंध अज्ञेय का है।
    mistakes:
      यशपाल: hin10_author
  - prompt: लेखक के अनुसार वे क्यों लिखते हैं?
    options:
    - यह जानने के लिए कि वे क्यों लिखते हैं, और भीतरी विवशता से मुक्ति के लिए
    - केवल पैसे के लिए
    - संपादक के कहने पर
    - प्रसिद्धि के लिए
    answer: यह जानने के लिए कि वे क्यों लिखते हैं, और भीतरी विवशता से मुक्ति के लिए
    difficulty: 2
    hints:
    - भीतरी कारण।
    - आत्म-पहचान।
    solution: वे भीतरी विवशता को पहचानने और उससे मुक्त होने के लिए लिखते हैं।
    mistakes: {"प्रसिद्धि के लिए": "h10_kyon_likhta"}
  - prompt: लेखक के अनुसार अनुभव और अनुभूति में कौन अधिक गहरी है?
    options:
    - अनुभूति
    - अनुभव
    - दोनों समान
    - कोई नहीं
    answer: अनुभूति
    difficulty: 2
    hints:
    - संवेदना और कल्पना से।
    - घटना से आगे।
    solution: अनुभूति अनुभव से अधिक गहरी होती है।
    mistakes: {"अनुभव": "h10_anubhuti"}
  - prompt: हिरोशिमा में लेखक ने पत्थर पर क्या देखा?
    options:
    - किसी मनुष्य की उजली छाया
    - एक चित्र
    - एक नाम
    - एक फूल
    answer: किसी मनुष्य की उजली छाया
    difficulty: 1
    hints:
    - विस्फोट के समय वहाँ कोई खड़ा था।
    - पत्थर झुलस गया।
    solution: जले पत्थर पर एक मनुष्य की उजली छाया थी।
    mistakes: {"एक चित्र": "h10_chhaya"}
  - prompt: लेखक ने 'हिरोशिमा' कविता कहाँ लिखी?
    options:
    - भारत लौटकर रेलगाड़ी में
    - हिरोशिमा के अस्पताल में
    - जापान के होटल में
    - विमान में
    answer: भारत लौटकर रेलगाड़ी में
    difficulty: 2
    hints:
    - जापान में नहीं लिख पाए।
    - बैठे-बैठे।
    solution: भारत लौटने के बाद रेलगाड़ी में बैठे-बैठे उन्होंने कविता लिखी।
    mistakes:
      हिरोशिमा के अस्पताल में: hin10_read_again
  - prompt: हिरोशिमा पर क्या गिराया गया था?
    options:
    - परमाणु बम
    - भूकंप
    - बाढ़
    - आग का गोला
    answer: परमाणु बम
    difficulty: 1
    hints:
    - दूसरा विश्वयुद्ध।
    - 1945।
    solution: 1945 में हिरोशिमा पर परमाणु बम गिराया गया था।
    mistakes: {"भूकंप": "h10_hiroshima"}
  - prompt: अज्ञेय का पूरा नाम क्या है?
    options:
    - सच्चिदानंद हीरानंद वात्स्यायन
    - सूर्यकांत त्रिपाठी
    - रामवृक्ष बेनीपुरी
    - जयशंकर प्रसाद
    answer: सच्चिदानंद हीरानंद वात्स्यायन
    difficulty: 2
    hints:
    - '''अज्ञेय'' उनका उपनाम है।'
    - निराला का नाम सूर्यकांत त्रिपाठी है।
    solution: अज्ञेय का पूरा नाम सच्चिदानंद हीरानंद वात्स्यायन है।
    mistakes:
      सूर्यकांत त्रिपाठी: hin10_author
  - prompt: लेखक के अनुसार लिखने के बाहरी कारण कौन-से हैं?
    options:
    - संपादक का आग्रह, प्रकाशक का तक़ाज़ा, आर्थिक ज़रूरत
    - भीतरी विवशता
    - अनुभूति
    - कल्पना
    answer: संपादक का आग्रह, प्रकाशक का तक़ाज़ा, आर्थिक ज़रूरत
    difficulty: 2
    hints:
    - ये बाहर से आने वाले दबाव हैं।
    - लेखक इन्हें गौण मानते हैं।
    solution: संपादक, प्रकाशक और पैसे की ज़रूरत बाहरी कारण हैं।
    mistakes:
      भीतरी विवशता: h10c3_karan
  - prompt: हिरोशिमा के अस्पताल देखकर लेखक तुरंत क्यों नहीं लिख पाए?
    options:
    - तब तक वह अनुभव अनुभूति नहीं बना था
    - उनके पास क़लम नहीं थी
    - उन्हें जापानी नहीं आती थी
    - वे बीमार थे
    answer: तब तक वह अनुभव अनुभूति नहीं बना था
    difficulty: 3
    hints:
    - देखना काफ़ी नहीं था।
    - भीतर से जुड़ाव चाहिए था।
    solution: देखने भर से अनुभव हुआ, पर अनुभूति न बनने से लिखना संभव न हुआ।
    mistakes:
      उनके पास क़लम नहीं थी: h10c3_hiroshima
  - prompt: पत्थर पर छाया कैसे बनी थी?
    options:
    - विस्फोट से आदमी भाप बन गया और किरणों ने पत्थर झुलसाकर उसकी छाया छोड़ दी
    - किसी ने रंग से बनाई
