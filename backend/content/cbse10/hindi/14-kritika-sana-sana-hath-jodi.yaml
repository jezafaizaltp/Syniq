subject: cbse10-hin
chapter: 14
title: साना-साना हाथ जोड़ि
tips:
  h10_guide: "यह फ़िल्म देव आनंद और वहीदा रहमान की है, आर. के. नारायण के उपन्यास पर।"
  h10_mehnatkash: "लेखिका वहाँ के लोगों की कड़ी मेहनत से प्रभावित हुईं।"
  h10_pathar: "सुंदर दृश्यों के बीच लेखिका ने मेहनत करते लोगों का दुख देखा।"
  h10_shwet_pataka: "सफ़ेद पताकाएँ शोक से जुड़ी हैं; रंगीन पताकाएँ शुभ काम की शुरुआत पर।"
  h10_sikkim: "यात्रा गंगटोक से शुरू होती है। गंगटोक किस राज्य की राजधानी है?"

concepts:
- code: hin10c.c2.sana
  title: साना-साना हाथ जोड़ि
  notes: |
    मधु कांकरिया का यात्रा-वृत्तांत, सिक्किम की यात्रा पर। लेखिका गंगटोक ('मेहनतकश बादशाहों का शहर') से
    यूमथांग की ओर जाती हैं; ड्राइवर-कम-गाइड जितेन नार्गे रास्ते की जानकारी देता है। एक नेपाली युवती से सीखी
    प्रार्थना 'साना-साना हाथ जोड़ि, गर्दहु प्रार्थना...' (छोटे-छोटे हाथ जोड़कर प्रार्थना करती हूँ कि मेरा जीवन
    अच्छाइयों को समर्पित हो)। रास्ते में श्वेत बौद्ध पताकाएँ (किसी की मृत्यु पर) और रंगीन पताकाएँ (नए काम पर);
    'कवी-लोंग स्टॉक' जहाँ 'गाइड' फ़िल्म की शूटिंग हुई थी; धर्म-चक्र (प्रेयर व्हील); 'सेवन सिस्टर्स वॉटरफॉल';
    लायुंग में रात; कटाओ ('भारत का स्विट्ज़रलैंड') में बर्फ़। पहाड़ी औरतें पत्थर तोड़कर सड़क बनाती हैं, पीठ पर
    बच्चे बँधे; बच्चे कई किलोमीटर चलकर स्कूल जाते हैं। सेना के जवान कठिन मौसम में सीमा पर तैनात। भाव: प्रकृति
    का सौंदर्य, श्रमिकों का संघर्ष, पर्यावरण-संरक्षण।
  explanations:
    text: लेखिका सिक्किम की यात्रा पर गंगटोक से यूमथांग और कटाओ तक जाती हैं। बर्फ़ से ढके पहाड़, झरने और बौद्ध पताकाएँ उन्हें मोह लेते हैं, पर पत्थर तोड़ती पहाड़ी औरतें और मीलों चलकर स्कूल जाते बच्चे उन्हें सोचने पर मजबूर करते हैं कि यह सुंदरता कितनी मेहनत पर टिकी है।
    visual: 'कल्पना कीजिए: टेढ़ी-मेढ़ी पहाड़ी सड़क पर जीप, हवा में लहराती सफ़ेद और रंगीन पताकाएँ, ऊँचाई से गिरता झरना, और सड़क किनारे पत्थर तोड़ती औरतें जिनकी पीठ पर बच्चे बँधे हैं।'
    step_by_step: '1. गंगटोक और प्रार्थना। 2. रास्ते के दृश्य: पताकाएँ, कवी-लोंग स्टॉक, धर्म-चक्र। 3. सेवन सिस्टर्स झरना, लायुंग, कटाओ। 4. पहाड़ी लोगों का श्रम। 5. संदेश: प्रकृति और मनुष्य।'
    real_world: पहाड़ों पर घूमने जाते समय हम सुंदर दृश्य देखते हैं, पर उन सड़कों को बनाने वालों की मेहनत भूल जाते हैं; यह पाठ उसकी याद दिलाता है।
  picture:
    kind: flow
    steps:
    - गंगटोक से यात्रा शुरू, गाइड जितेन नार्गे
    - रास्ते में बौद्ध पताकाएँ, कवी-लोंग स्टॉक
    - सेवन सिस्टर्स झरना
    - लायुंग में रात, कटाओ में बर्फ़
    - पत्थर तोड़ती औरतें, स्कूल जाते बच्चे
    alt: 'साना-साना हाथ जोड़ि की यात्रा: गंगटोक, बौद्ध पताकाएँ और कवी-लोंग स्टॉक, सेवन सिस्टर्स झरना, लायुंग और कटाओ, और पहाड़ी लोगों का श्रम।'
  activity:
    type: sort
    prompt: 'यात्रा में देखी चीज़ें: प्रकृति का सौंदर्य या लोगों का श्रम?'
    bins:
    - प्रकृति का सौंदर्य
    - लोगों का श्रम
    items:
    - label: सेवन सिस्टर्स वॉटरफॉल
      bin: प्रकृति का सौंदर्य
      clue: यह किसी ने बनाया या प्रकृति ने?
      why: झरना प्रकृति का सौंदर्य है।
    - label: कटाओ की बर्फ़
      bin: प्रकृति का सौंदर्य
      clue: '''भारत का स्विट्ज़रलैंड'' किस कारण?'
      why: 'बर्फ़ से ढका कटाओ: प्रकृति।'
    - label: पत्थर तोड़कर सड़क बनाती औरतें
      bin: लोगों का श्रम
      clue: पीठ पर बच्चे बाँधकर कौन काम कर रहा है?
      why: पहाड़ी औरतों का कठोर श्रम।
    - label: कई किलोमीटर चलकर स्कूल जाते बच्चे
      bin: लोगों का श्रम
      clue: यह सुंदर दृश्य है या कठिन जीवन?
      why: पहाड़ के बच्चों का संघर्ष।
    - label: सीमा पर तैनात जवान
      bin: लोगों का श्रम
      clue: कठिन मौसम में कौन डटा है?
      why: सेना के जवानों का कष्ट।
  items:
  - prompt: यह यात्रा-वृत्तांत किस राज्य की यात्रा पर है?
    options:
    - सिक्किम
    - हिमाचल प्रदेश
    - उत्तराखंड
    - असम
    answer: सिक्किम
    difficulty: 1
    hints:
    - राजधानी गंगटोक।
    - यूमथांग।
    solution: यह सिक्किम की यात्रा का वर्णन है।
    mistakes: {"हिमाचल प्रदेश": "h10_sikkim"}
  - prompt: लेखिका के ड्राइवर-कम-गाइड का नाम क्या था?
    options:
    - जितेन नार्गे
    - तेनज़िंग
    - मणि
    - राजू
    answer: जितेन नार्गे
    difficulty: 2
    hints:
    - वह रास्ते की जानकारी देता था।
    - नेपाली युवक।
    solution: ड्राइवर-कम-गाइड जितेन नार्गे था।
    mistakes:
      तेनज़िंग: hin10_read_again
  - prompt: गंगटोक को लेखिका ने क्या कहा है?
    options:
    - मेहनतकश बादशाहों का शहर
    - झीलों का शहर
    - गुलाबी शहर
    - बर्फ़ का शहर
    answer: मेहनतकश बादशाहों का शहर
    difficulty: 2
    hints:
    - वहाँ के लोग बहुत मेहनती हैं।
    - बादशाह।
    solution: लेखिका ने गंगटोक को मेहनतकश बादशाहों का शहर कहा।
    mistakes: {"झीलों का शहर": "h10_mehnatkash"}
  - prompt: श्वेत बौद्ध पताकाएँ कब फहराई जाती हैं?
    options:
    - किसी की मृत्यु पर
    - किसी नए काम की शुरुआत पर
    - विवाह पर
    - जन्मदिन पर
    answer: किसी की मृत्यु पर
    difficulty: 2
    hints:
    - शांति के लिए।
    - रंगीन पताकाएँ नए काम पर।
    solution: किसी बुद्धिस्ट की मृत्यु पर 108 श्वेत पताकाएँ फहराई जाती हैं; रंगीन पताकाएँ नए काम पर।
    mistakes: {"किसी नए काम की शुरुआत पर": "h10_shwet_pataka"}
  - prompt: '''कवी-लोंग स्टॉक'' किस फ़िल्म की शूटिंग के लिए प्रसिद्ध है?'
    options:
    - गाइड
    - शोले
    - मुग़ल-ए-आज़म
    - मदर इंडिया
    answer: गाइड
    difficulty: 2
    hints:
    - देव आनंद की फ़िल्म।
    - जितेन ने बताया।
    solution: कवी-लोंग स्टॉक में 'गाइड' फ़िल्म की शूटिंग हुई थी।
    mistakes: {"शोले": "h10_guide"}
  - prompt: लेखिका को सबसे अधिक किस दृश्य ने विचलित किया?
    options:
    - पत्थर तोड़ती पहाड़ी औरतें, जिनकी पीठ पर बच्चे बँधे थे
    - बर्फ़ से ढके पहाड़
    - बौद्ध मठ
    - झरने
    answer: पत्थर तोड़ती पहाड़ी औरतें, जिनकी पीठ पर बच्चे बँधे थे
    difficulty: 1
    hints:
    - सौंदर्य के बीच कठिन श्रम।
    - सड़क बनाना।
    solution: सौंदर्य के बीच कठिन श्रम करती औरतों को देखकर लेखिका का मन दुखी हुआ।
    mistakes: {"बर्फ़ से ढके पहाड़": "h10_pathar"}
