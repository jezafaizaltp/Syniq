    - खेल प्रतियोगिता
    - नाटक
    answer: झंडा फहराना और स्वतंत्रता की प्रतिज्ञा पढ़ना
    difficulty: 2
    hints:
    - कौंसिल ने इसकी सूचना दी थी।
    - शाम का कार्यक्रम।
    solution: मोनुमेंट के नीचे झंडा फहराकर प्रतिज्ञा पढ़ी जानी थी।
    mistakes:
