subject: cbse10-hinb
chapter: 9
title: डायरी का एक पन्ना
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  h10b_kalank: "उस दिन हज़ारों लोगों ने आंदोलन में भाग लिया। पहले शहर के बारे में क्या कहा जाता था?"
  h10b_kalkatta: "लेखक सीताराम सेकसरिया बंगाल में रहते थे और 26 जनवरी 1931 का वर्णन कर रहे हैं।"
  h10b_subhash: "यह जुलूस बंगाल का था। वहाँ के एक बड़े नेता झंडा लेकर निकले और पुलिस ने उन्हें रोका।"
  h10bs9_din: '26 जनवरी 1931 की घटनाएँ कई जगह हुईं: तैयारी, स्मारक पर झंडा, जुलूस, लाठीचार्ज, गिरफ़्तारियाँ। प्रश्न किस घटना का है?'
  h10bs9_bhav: 'डायरी में लेखक का गर्व झलकता है: कलकत्ता के लोगों, ख़ासकर स्त्रियों ने आगे बढ़कर हिस्सा लिया। उत्तर उसी भाव से सोचो।'
concepts:
- code: hin10b.s9.diary
  title: डायरी का एक पन्ना (सीताराम सेकसरिया)
  notes: |
    सीताराम सेकसरिया की डायरी का अंश: 26 जनवरी 1931, कलकत्ता। एक साल पहले (26 जनवरी 1930) पूर्ण स्वराज की
    प्रतिज्ञा ली गई थी, इसलिए यह दूसरा स्वतंत्रता दिवस मनाया जा रहा था। पूरे शहर में तैयारी: घरों और मकानों पर
    झंडे, सजावट, लोग जगह-जगह। पुलिस कमिश्नर ने नोटिस निकाला कि सभा नहीं होगी; फिर भी कौंसिल की ओर से नोटिस कि
    मोनुमेंट के नीचे झंडा फहराया जाएगा और स्वतंत्रता की प्रतिज्ञा पढ़ी जाएगी। सुभाष बाबू (सुभाषचंद्र बोस) जुलूस
    लेकर निकले, पुलिस ने लाठियाँ चलाईं, सुभाष बाबू पर भी लाठियाँ पड़ीं और उन्हें पकड़ लिया गया। स्त्रियाँ बड़ी
    संख्या में जुलूस में आईं, मोनुमेंट पर झंडा फहराया, प्रतिज्ञा पढ़ी; बहुत-सी स्त्रियाँ गिरफ़्तार हुईं, कई लोग
    घायल हुए। कलकत्ता पर कलंक था कि यहाँ आज़ादी का काम नहीं होता; इस दिन वह कलंक बहुत हद तक धुल गया।
  explanations:
    text: 26 जनवरी 1931 को कलकत्ता में दूसरा स्वतंत्रता दिवस मनाया गया। पुलिस ने सभा पर रोक लगाई, फिर भी सुभाषचंद्र बोस के नेतृत्व में जुलूस निकला, लाठियाँ चलीं, सुभाष बाबू गिरफ़्तार हुए और बहुत-सी स्त्रियों ने भी गिरफ़्तारी दी। इस दिन कलकत्ता ने साबित किया कि वह आज़ादी की लड़ाई में पीछे नहीं।
    visual: 'कलकत्ता का नक्शा सोचिए: घरों पर तिरंगे, बीच में ऊँचा मोनुमेंट, उसकी ओर बढ़ता जुलूस, आगे सुभाष बाबू और पीछे स्त्रियों का बड़ा दल, और रास्ते में लाठियाँ लिए पुलिस।'
    step_by_step: '1. तारीख और शहर: 26 जनवरी 1931, कलकत्ता। 2. दूसरा स्वतंत्रता दिवस। 3. पुलिस की रोक बनाम कौंसिल का नोटिस। 4. सुभाष बाबू का जुलूस, लाठी, गिरफ़्तारी। 5. स्त्रियों की भागीदारी। 6. कलंक का धुल जाना।'
    real_world: आज हम 26 जनवरी गणतंत्र दिवस के रूप में मनाते हैं; यह तारीख इसलिए चुनी गई क्योंकि 1930 से इसी दिन स्वतंत्रता दिवस मनाया जाता था, जैसा इस डायरी में है।
  picture:
    kind: flow
    steps:
    - '26 जनवरी 1930: पूर्ण स्वराज की प्रतिज्ञा'
    - '26 जनवरी 1931: कलकत्ता में तैयारी'
    - पुलिस की रोक
    - सुभाष बाबू का जुलूस, लाठियाँ, गिरफ़्तारी
    - स्त्रियों ने झंडा फहराया, गिरफ़्तारियाँ
    - कलकत्ता का कलंक धुला
    alt: '26 जनवरी 1931 की घटनाएँ: तैयारी, पुलिस की रोक, सुभाष बाबू का जुलूस और गिरफ़्तारी, स्त्रियों की भागीदारी।'
  activity:
    type: order
    prompt: 26 जनवरी 1931 का दिन, डायरी के अनुसार, क्रम से लगाओ।
    steps:
    - 26 जनवरी 1930 को पूर्ण स्वराज की प्रतिज्ञा
    - घरों पर झंडे, पूरे शहर में तैयारी
    - पुलिस कमिश्नर का नोटिस, सभा नहीं होगी
    - सुभाष बाबू के जुलूस पर लाठियाँ, गिरफ़्तारी
    - स्त्रियों ने मोनुमेंट पर झंडा फहराया
    reasons:
      घरों पर झंडे, पूरे शहर में तैयारी: एक साल पहले की प्रतिज्ञा की याद में ही दूसरा स्वतंत्रता दिवस मनाया जा रहा था।
      पुलिस कमिश्नर का नोटिस, सभा नहीं होगी: तैयारी देखकर ही पुलिस ने रोक लगाई।
      सुभाष बाबू के जुलूस पर लाठियाँ, गिरफ़्तारी: 'रोक के बावजूद जुलूस निकला: तब लाठियाँ चलीं।'
      स्त्रियों ने मोनुमेंट पर झंडा फहराया: सुभाष बाबू पकड़े गए, फिर भी स्त्रियों ने काम पूरा किया।
  lesson:
    - teach: '''डायरी का एक पन्ना'' सीताराम सेकसरिया की डायरी का अंश है, 26 जनवरी 1931 का। ठीक एक साल पहले 26 जनवरी 1930 को पूर्ण स्वराज की प्रतिज्ञा ली गई थी, इसलिए यह दूसरा ''स्वतंत्रता दिवस'' था। कलकत्ता (कोलकाता) में बड़े पैमाने पर तैयारी हुई: मकानों पर राष्ट्रीय झंडे लगे, जगह-जगह सजावट हुई।'
      check:
        prompt: 26 जनवरी 1931 को 'दूसरा स्वतंत्रता दिवस' क्यों कहा गया?
        options:
        - 1930 में इसी दिन पूर्ण स्वराज की प्रतिज्ञा ली गई थी
        - उस दिन देश आज़ाद हुआ
        - उस दिन संविधान बना
        answer: 1930 में इसी दिन पूर्ण स्वराज की प्रतिज्ञा ली गई थी
        why: यह उसकी पहली वर्षगाँठ थी।
    - teach: पुलिस कमिश्नर ने नोटिस निकाला था कि सभा नहीं होगी और भाग लेने वालों पर कार्रवाई होगी। फिर भी कौंसिल ने नोटिस दिया कि मोनुमेंट (स्मारक) के नीचे शाम को झंडा फहराया जाएगा और प्रतिज्ञा पढ़ी जाएगी। पुलिस ने भारी बंदोबस्त किया, लाठियाँ चलाईं, कई लोग घायल हुए।
      picture:
        kind: flow
        steps:
        - झंडे और सजावट
        - पुलिस का नोटिस
        - सुभाष बाबू का जुलूस
        - लाठीचार्ज और गिरफ़्तारियाँ
        - स्त्रियों का जुलूस
        - कलंक धुल गया
        alt: '26 जनवरी 1931 का क्रम: झंडे और सजावट, पुलिस का नोटिस, सुभाष बाबू का जुलूस, लाठीचार्ज और गिरफ़्तारियाँ, स्त्रियों का जुलूस, और कलकत्ता का कलंक धुलना।'
      check:
        prompt: पुलिस कमिश्नर के नोटिस में क्या कहा गया था?
        options:
        - कोई सभा नहीं होगी
        - सब झंडा फहराएँ
        - छुट्टी रहेगी
        answer: कोई सभा नहीं होगी
        why: सरकार आंदोलन रोकना चाहती थी।
    - teach: सुभाषचंद्र बोस ने जुलूस का नेतृत्व किया; उन पर लाठियाँ पड़ीं और वे गिरफ़्तार हुए। स्त्रियों ने बड़ी संख्या में भाग लिया, जुलूस निकाले और गिरफ़्तार हुईं। लेखक लिखते हैं कि आज कलकत्ता पर लगा कलंक धुल गया कि यहाँ आज़ादी का काम नहीं होता। यह पाठ अहिंसक प्रतिरोध और आम लोगों की देशभक्ति दिखाता है।
      check:
        prompt: इस दिन के आंदोलन की एक बड़ी विशेषता क्या थी?
        options:
        - स्त्रियों ने बड़ी संख्या में भाग लिया
        - केवल बच्चे शामिल हुए
        - कोई गिरफ़्तारी नहीं हुई
        answer: स्त्रियों ने बड़ी संख्या में भाग लिया
        why: लेखक इसे गर्व से दर्ज करते हैं।
  items:
  - prompt: '''डायरी का एक पन्ना'' के लेखक कौन हैं?'
    options:
    - सीताराम सेकसरिया
    - लीलाधर मंडलोई
    - प्रह्लाद अग्रवाल
    - रवींद्र केलेकर
    answer: सीताराम सेकसरिया
    difficulty: 1
    hints:
    - कलकत्ता के स्वतंत्रता सेनानी और समाजसेवी।
    - उन्होंने डायरी लिखी।
    solution: सीताराम सेकसरिया।
