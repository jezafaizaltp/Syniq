          - title: आज
            points:
            - लड़के उस पर घुड़सवारी करते हैं
            - चिड़ियाँ बैठकर गपशप करती हैं
          alt: अपने ज़माने में तोप ताक़तवर थी और सूरमाओं को मार गिराती थी; आज लड़के उस पर घुड़सवारी करते हैं और चिड़ियाँ उस पर बैठकर गपशप करती हैं।
      - style: step_by_step
        teach: 'पहला: जो तोप कभी डर पैदा करती थी, अब बच्चे उस पर खेलते हैं। दूसरा: छोटी चिड़ियाँ भी उससे नहीं डरतीं। तीसरा: इससे पता चलता है कि उसकी ताक़त ख़त्म हो चुकी है। चौथा: कवि का संदेश है कि दमन की कोई भी ताक़त हमेशा नहीं टिकती।'
