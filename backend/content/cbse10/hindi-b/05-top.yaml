    - कवि ने ख़ासतौर पर नाम लिया।
    solution: ख़ासकर गौरैयें तोप के भीतर घुस जाती हैं।
    mistakes:
      तोते: h10bs5_pratik
  - prompt: तोप की 'बड़ी सम्हाल' क्यों होती है?
