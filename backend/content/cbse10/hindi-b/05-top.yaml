    - भारत की सेना
    - बच्चों का खिलौना
    - बाग की सुंदरता
    answer: अत्याचारी शक्ति, जो हमेशा नहीं टिकती
    difficulty: 3
    hints:
    - कंपनी बाग और 1857।
    - अंत में मुँह बंद।
    solution: तोप कंपनी के दमन और ताकत के घमंड का प्रतीक है, जो एक दिन खत्म हो जाता है।
