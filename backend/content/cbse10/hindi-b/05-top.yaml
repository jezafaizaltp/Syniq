subject: cbse10-hinb
chapter: 5
title: तोप
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_company_bagh: "तोप शहर के एक बाग़ के द्वार पर रखी है, जिसका नाम अंग्रेज़ों की कंपनी से जुड़ा है।"
  h10b_do_baar: "कविता में तोप को साल में कुछ ख़ास मौकों पर ही चमकाया जाता है, जैसे राष्ट्रीय पर्वों पर।"
  h10bs5_kal: 'कविता में तोप के दो समय हैं: अपने ज़माने का डरावना रूप और आज का बेबस रूप। प्रश्न किस समय की बात करता है?'
  h10bs5_pratik: 'तोप, कंपनी बाग, चिड़ियाँ: हर चीज़ इतिहास या समाज की किसी बात का प्रतीक है। सोचो वह बात क्या है।'
concepts:
- code: hin10b.s5.top
  title: तोप (वीरेन डंगवाल)
  notes: |
    वीरेन डंगवाल की कविता। कंपनी बाग के मुहाने पर 1857 की एक तोप रखी है। उसकी बड़ी सँभाल होती है, विरासत में मिले
    कंपनी बाग की तरह, और साल में दो बार उसे चमकाया जाता है। सुबह-शाम आने वाले सैलानियों को वह बताती है कि अपने
    ज़माने में वह बड़ी ज़बर थी, उसने अच्छे-अच्छे सूरमाओं की धज्जियाँ उड़ा दी थीं। अब छोटे लड़के उस पर घुड़सवारी
    करते हैं, और चिड़ियाँ उस पर बैठकर गपशप करती हैं; गौरैयें शरारत में उसके भीतर भी घुस जाती हैं। वे बताती हैं
    कि तोप कितनी भी बड़ी हो, एक दिन उसका मुँह बंद होना ही है। तोप ईस्ट इंडिया कंपनी के दमन की याद है; संदेश: अत्याचार
    और ताकत का घमंड हमेशा नहीं टिकता, और विरासत हमें इतिहास से सबक सिखाती है।
  explanations:
    text: 'कंपनी बाग में 1857 की एक पुरानी तोप रखी है, जिसने कभी बहुत तबाही मचाई थी। आज बच्चे उस पर खेलते हैं और चिड़ियाँ उसके मुँह में घुस जाती हैं। कवि कहते हैं कि कितनी भी ताकतवर तोप हो, एक दिन उसका मुँह बंद होना ही है: अत्याचार हमेशा नहीं चलता।'
    visual: 'बाग के फाटक पर चमकती पुरानी तोप: उसकी नली पर बैठा एक बच्चा ''घुड़सवारी'' कर रहा है, ऊपर चिड़ियाँ गपशप कर रही हैं और एक गौरैया उसके मुँह के भीतर झाँक रही है।'
    step_by_step: '1. कंपनी बाग और 1857 की तोप। 2. साल में दो बार चमकाई जाती है। 3. तोप की डींग: सूरमाओं की धज्जियाँ उड़ाईं। 4. अब बच्चे और चिड़ियाँ। 5. संदेश: एक दिन मुँह बंद होना ही है।'
    real_world: संग्रहालयों में रखे पुराने हथियार हमें याद दिलाते हैं कि जो ताकत कभी डराती थी, वही आज बस इतिहास की एक चीज़ है।
  picture:
    kind: compare
    columns:
    - title: तब (1857)
      points:
      - बड़ी ज़बर तोप
      - सूरमाओं की धज्जियाँ उड़ाईं
      - कंपनी के दमन का हथियार
    - title: अब
      points:
      - बाग में सजावट
      - बच्चे घुड़सवारी करते हैं
      - चिड़ियाँ भीतर घुस जाती हैं
    alt: 1857 में तोप ताकतवर और डरावनी थी; आज बच्चे उस पर खेलते हैं और चिड़ियाँ उसमें घुस जाती हैं।
  activity:
    type: sort
    prompt: तोप का बीता ज़माना या आज का हाल?
    bins:
    - अपने ज़माने में
    - आज
    items:
    - label: अच्छे-अच्छे सूरमाओं की धज्जियाँ उड़ाईं
      bin: अपने ज़माने में
      clue: तोप सैलानियों को किस बात की शेखी सुनाती है?
      why: 1857 में तोप बड़ी ज़बर थी।
    - label: बड़ी ज़बर थी
      bin: अपने ज़माने में
      clue: यह अतीत की बात है या आज की?
      why: तोप अपने पुराने ज़ोर की बात करती है।
    - label: लड़के उस पर घुड़सवारी करते हैं
      bin: आज
      clue: अब बच्चे उससे डरते हैं?
      why: आज तोप बच्चों का खिलौना है।
    - label: चिड़ियाँ उस पर बैठकर गपशप करती हैं
      bin: आज
      clue: डरावनी तोप पर चिड़ियाँ कब बैठ सकती हैं?
      why: आज उसका मुँह बंद है।
    - label: साल में दो बार चमकाई जाती है
      bin: आज
      clue: यह सँभाल कब होती है?
      why: आज वह विरासत की तरह सँभाली जाती है।
  lesson:
    - teach: '''तोप'' वीरेन डंगवाल की कविता है। कंपनी बाग के मुहाने पर 1857 की एक तोप रखी है। कंपनी बाग और तोप दोनों हमें विरासत में मिले हैं: ईस्ट इंडिया कंपनी के शासन की याद। तोप की बड़ी देखभाल होती है और साल में दो बार उसे चमकाया जाता है।'
      check:
        prompt: तोप किस समय की है?
        options:
        - 1857 की
        - 1947 की
        - 1962 की
        answer: 1857 की
        why: पहले स्वतंत्रता संग्राम का समय।
    - teach: 'सुबह-शाम बाग में आने वाले सैलानियों को तोप मानो बताती है: ''मैं बड़ी ज़बर थी; अपने ज़माने में मैंने अच्छे-अच्छे सूरमाओं की धज्जियाँ उड़ा दी थीं।'' यानी इसी तोप ने 1857 में हमारे स्वतंत्रता सेनानियों को मारा था।'
      picture:
        kind: compare
        columns:
        - title: अपने ज़माने में
          points:
          - बड़ी ज़बर
          - सूरमाओं की धज्जियाँ उड़ाईं
          - डर का कारण
        - title: आज
          points:
          - बच्चे घुड़सवारी करते हैं
          - चिड़ियाँ गपशप करती हैं
          - गौरैयें भीतर घुसती हैं
        alt: 'तोप के दो रूप: अपने ज़माने में बड़ी ज़बर जिसने सूरमाओं को उड़ाया, आज बच्चे उस पर खेलते हैं और चिड़ियाँ बैठती हैं।'
      check:
        prompt: तोप ने अपने ज़माने में क्या किया था?
        options:
        - सूरमाओं की धज्जियाँ उड़ाई थीं
        - देश की रक्षा की थी
        - फूल बरसाए थे
        answer: सूरमाओं की धज्जियाँ उड़ाई थीं
        why: अंग्रेज़ों ने इससे क्रांतिकारियों को मारा।
    - teach: 'आज वह तोप बेबस है: छोटे लड़के उस पर घुड़सवारी करते हैं, चिड़ियाँ उस पर बैठकर गपशप करती हैं, और शरारती गौरैयें उसके भीतर भी घुस जाती हैं। चिड़ियाँ बताती हैं कि तोप कितनी भी बड़ी हो, एक दिन उसका मुँह बंद होना ही है। संदेश: अत्याचार और दमन की शक्ति हमेशा नहीं टिकती; साथ ही हमें अपनी विरासत से सीख लेनी चाहिए।'
      check:
        prompt: कविता का मुख्य संदेश क्या है?
        options:
        - अत्याचारी शक्ति का अंत निश्चित है
        - तोपें बहुत सुंदर होती हैं
        - बाग में खेलना मना है
        answer: अत्याचारी शक्ति का अंत निश्चित है
        why: चिड़ियाँ यही बताती हैं।
  items:
