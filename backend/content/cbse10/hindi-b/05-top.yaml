    - एक व्यापारी कंपनी जो शासक बन गई।
    solution: कंपनी बाग ईस्ट इंडिया कंपनी के शासन की याद दिलाता है।
    mistakes:
      किसी कारख़ाने की: h10bs5_pratik
  - prompt: तोप को साल में दो बार कब चमकाया जाता होगा?
