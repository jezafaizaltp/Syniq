    - teach: पुलिस ने काका को भाइयों से भी बचाया। अब काका पुलिस सुरक्षा में अकेले रहते हैं, एक नौकर के साथ। उन्होंने तय किया कि जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे, क्योंकि उन्होंने देखा था कि ज़मीन लिखवाने के बाद लोग कैसे दुत्कारे जाते हैं। कहानी दिखाती है कि लालच ने रिश्तों और धर्म दोनों को खोखला कर दिया है।
      check:
