subject: cbse10-hinb
chapter: 15
title: हरिहर काका
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
concepts:
- code: hin10b.c15.harihar
  title: हरिहर काका (मिथिलेश्वर)
  notes: |
    मिथिलेश्वर की कहानी (संचयन)। हरिहर काका गाँव के बूढ़े, निःसंतान व्यक्ति हैं; चार भाइयों में से एक, पत्नी का निधन
    हो चुका है। उनके हिस्से में पंद्रह बीघे खेत हैं। भाई और उनकी पत्नियाँ पहले उनकी सेवा करते थे, फिर रूखा-सूखा
    खाना देने लगे। गाँव की ठाकुरबारी का महंत उन्हें समझाता है कि ज़मीन ठाकुरजी के नाम लिख दो, स्वर्ग मिलेगा;
    भाई डरकर फिर सेवा करने लगते हैं। महंत के लोग हरिहर काका का अपहरण कर ठाकुरबारी में बंद करते हैं और ज़बरदस्ती
    सादे कागज़ों पर अँगूठे के निशान लगवा लेते हैं। भाई पुलिस लेकर उन्हें छुड़ाते हैं; बाद में भाई भी मारपीट करके
    ज़मीन अपने नाम लिखवाने की कोशिश करते हैं। अंत में हरिहर काका पुलिस सुरक्षा में, एक नौकर के साथ अलग रहते हैं और
    तय करते हैं कि जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे। कथावाचक (लेखक) से उनकी गहरी दोस्ती है। संदेश: स्वार्थ के
    कारण रिश्ते और धर्म-स्थल दोनों खोखले हो गए हैं।
  explanations:
    text: हरिहर काका के पास पंद्रह बीघे ज़मीन है और कोई संतान नहीं। उनकी ज़मीन के लालच में महंत ने अपहरण करवाकर अँगूठे के निशान लिए, और उनके अपने भाइयों ने भी मारपीट की। अंत में काका समझ जाते हैं कि सब ज़मीन के भूखे हैं, और जीते-जी ज़मीन किसी के नाम न लिखने का फ़ैसला करते हैं।
    visual: बीच में अकेले बैठे हरिहर काका, उनके सामने खेतों का कागज़। एक ओर ठाकुरबारी का महंत, दूसरी ओर उनके भाई, दोनों के हाथ उसी कागज़ की ओर बढ़ रहे हैं; पीछे खड़ा पुलिस का सिपाही।
    step_by_step: '1. हरिहर काका: निःसंतान, पंद्रह बीघे ज़मीन। 2. भाइयों का बदलता व्यवहार। 3. महंत का लालच और अपहरण, अँगूठे के निशान। 4. भाइयों द्वारा छुड़ाना, फिर उनकी भी हिंसा। 5. पुलिस सुरक्षा में अलग जीवन। 6. फ़ैसला: जीते-जी ज़मीन किसी के नाम नहीं।'
    real_world: आज भी कई बुज़ुर्गों के साथ संपत्ति के लिए बुरा बर्ताव होता है; इसीलिए बुज़ुर्गों की देखभाल और सुरक्षा के लिए कानून भी बने हैं।
  picture:
    kind: compare
    columns:
    - title: महंत (ठाकुरबारी)
      points:
      - स्वर्ग का लालच दिया
      - अपहरण करवाया
      - ज़बरदस्ती अँगूठे लगवाए
    - title: भाई
      points:
      - पहले सेवा, फिर रूखा खाना
      - पुलिस से छुड़ाया
      - फिर खुद मारपीट की
    alt: 'महंत और भाई दोनों हरिहर काका की ज़मीन चाहते हैं: महंत धर्म का सहारा लेता है, भाई रिश्ते का।'
  items:
  - prompt: '''हरिहर काका'' कहानी के लेखक कौन हैं?'
    options:
    - मिथिलेश्वर
    - गुरदयाल सिंह
    - राही मासूम रज़ा
    - प्रेमचंद
    answer: मिथिलेश्वर
    difficulty: 1
    hints:
    - बिहार के ग्रामीण जीवन के कथाकार।
    - नाम 'म' से।
    solution: मिथिलेश्वर।
    mistakes:
      गुरदयाल सिंह: hin10b_author
  - prompt: हरिहर काका के हिस्से में कितनी ज़मीन थी?
    options:
    - पंद्रह बीघे
    - पाँच बीघे
    - साठ बीघे
    - सौ बीघे
    answer: पंद्रह बीघे
    difficulty: 1
    hints:
    - चार भाइयों में बँटी ज़मीन का एक हिस्सा।
    - दस से ज़्यादा, बीस से कम।
    solution: पंद्रह बीघे।
    mistakes:
      साठ बीघे: hin10b_read_again
  - prompt: महंत हरिहर काका से क्या चाहता था?
    options:
    - उनकी ज़मीन ठाकुरबारी (ठाकुरजी) के नाम लिखवाना
    - उनकी सेवा करना
    - उन्हें तीर्थ पर भेजना
    - उनके भाइयों से सुलह कराना
    answer: उनकी ज़मीन ठाकुरबारी (ठाकुरजी) के नाम लिखवाना
    difficulty: 1
    hints:
    - स्वर्ग का लालच।
    - धार्मिक स्थान के नाम।
    solution: वह ज़मीन ठाकुरबारी के नाम करवाना चाहता था।
  - prompt: अपहरण के बाद महंत के लोगों ने काका से क्या करवाया?
    options:
    - सादे कागज़ों पर ज़बरदस्ती अँगूठे के निशान
    - भजन गवाया
    - खेतों में काम
    - भाइयों को चिट्ठी
    answer: सादे कागज़ों पर ज़बरदस्ती अँगूठे के निशान
    difficulty: 2
    hints:
    - ज़मीन लिखवाने की तैयारी।
    - अनपढ़ भी कर सकता है।
    solution: उन्होंने ज़बरदस्ती सादे कागज़ों पर अँगूठे के निशान लगवाए।
  - prompt: अंत में हरिहर काका ने क्या फ़ैसला किया?
    options:
    - जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे
    - ज़मीन ठाकुरबारी को दे देंगे
    - ज़मीन भाइयों को दे देंगे
    - गाँव छोड़ देंगे
    answer: जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे
    difficulty: 2
    hints:
    - उन्हें दोनों पक्षों का लालच दिख गया।
    - मरने से पहले नहीं।
    solution: उन्होंने तय किया कि जीते-जी ज़मीन किसी के नाम नहीं करेंगे।
    mistakes:
      ज़मीन ठाकुरबारी को दे देंगे: hin10b_read_again
  - prompt: कहानी का मुख्य संदेश क्या है?
    options:
    - स्वार्थ और लालच ने रिश्तों और धर्म दोनों को खोखला कर दिया है
    - ज़मीन बेच देनी चाहिए
    - गाँव में पुलिस ज़रूरी है
    - बुज़ुर्गों को काम करना चाहिए
    answer: स्वार्थ और लालच ने रिश्तों और धर्म दोनों को खोखला कर दिया है
    difficulty: 3
    hints:
    - महंत और भाई, दोनों एक जैसे निकले।
    - ज़मीन के लिए।
    solution: धन-संपत्ति के लालच में अपने भी और धर्म के ठेकेदार भी इंसानियत भूल जाते हैं।
    mistakes:
      ज़मीन बेच देनी चाहिए: hin10b_poem_meaning
