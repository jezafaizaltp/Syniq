subject: cbse10-hinb
chapter: 15
title: हरिहर काका
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_angutha: "महंत ज़मीन अपने नाम कराना चाहता था। इसके लिए कागज़ पर क्या चाहिए था?"
  h10b_mahant: "महंत सेवा का दिखावा करता था, पर असल में उसकी नज़र काका की संपत्ति पर थी।"
  h10bs15_paksh: 'हरिहर काका की ज़मीन के दो दावेदार हैं: ठाकुरबारी का महंत और उनके अपने भाई। प्रश्न किस पक्ष के व्यवहार का है?'
  h10bs15_badlav: शुरू में काका सबका आदर करते और भरोसा करते थे; अंत में वे मौन और सतर्क हो गए। बात किस मोड़ की है?
concepts:
- code: hin10b.c15.harihar
  title: हरिहर काका (मिथिलेश्वर)
  notes: |
    मिथिलेश्वर की कहानी (संचयन)। हरिहर काका गाँव के बूढ़े, निःसंतान व्यक्ति हैं; चार भाइयों में से एक, पत्नी का निधन
    हो चुका है। उनके हिस्से में पंद्रह बीघे खेत हैं। भाई और उनकी पत्नियाँ पहले उनकी सेवा करते थे, फिर रूखा-सूखा
    खाना देने लगे। गाँव की ठाकुरबारी का महंत उन्हें समझाता है कि ज़मीन ठाकुरजी के नाम लिख दो, स्वर्ग मिलेगा;
    भाई डरकर फिर सेवा करने लगते हैं। महंत के लोग हरिहर काका का अपहरण कर ठाकुरबारी में बंद करते हैं और ज़बरदस्ती
    सादे कागज़ों पर अँगूठे के निशान लगवा लेते हैं। भाई पुलिस लेकर उन्हें छुड़ाते हैं; बाद में भाई भी मारपीट करके
    ज़मीन अपने नाम लिखवाने की कोशिश करते हैं। अंत में हरिहर काका पुलिस सुरक्षा में, एक नौकर के साथ अलग रहते हैं और
    तय करते हैं कि जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे। कथावाचक (लेखक) से उनकी गहरी दोस्ती है। संदेश: स्वार्थ के
    कारण रिश्ते और धर्म-स्थल दोनों खोखले हो गए हैं।
  explanations:
    text: हरिहर काका के पास पंद्रह बीघे ज़मीन है और कोई संतान नहीं। उनकी ज़मीन के लालच में महंत ने अपहरण करवाकर अँगूठे के निशान लिए, और उनके अपने भाइयों ने भी मारपीट की। अंत में काका समझ जाते हैं कि सब ज़मीन के भूखे हैं, और जीते-जी ज़मीन किसी के नाम न लिखने का फ़ैसला करते हैं।
    visual: बीच में अकेले बैठे हरिहर काका, उनके सामने खेतों का कागज़। एक ओर ठाकुरबारी का महंत, दूसरी ओर उनके भाई, दोनों के हाथ उसी कागज़ की ओर बढ़ रहे हैं; पीछे खड़ा पुलिस का सिपाही।
    step_by_step: '1. हरिहर काका: निःसंतान, पंद्रह बीघे ज़मीन। 2. भाइयों का बदलता व्यवहार। 3. महंत का लालच और अपहरण, अँगूठे के निशान। 4. भाइयों द्वारा छुड़ाना, फिर उनकी भी हिंसा। 5. पुलिस सुरक्षा में अलग जीवन। 6. फ़ैसला: जीते-जी ज़मीन किसी के नाम नहीं।'
    real_world: आज भी कई बुज़ुर्गों के साथ संपत्ति के लिए बुरा बर्ताव होता है; इसीलिए बुज़ुर्गों की देखभाल और सुरक्षा के लिए कानून भी बने हैं।
  picture:
    kind: compare
    columns:
    - title: महंत (ठाकुरबारी)
      points:
      - स्वर्ग का लालच दिया
      - अपहरण करवाया
      - ज़बरदस्ती अँगूठे लगवाए
    - title: भाई
      points:
      - पहले सेवा, फिर रूखा खाना
      - पुलिस से छुड़ाया
      - फिर खुद मारपीट की
    alt: 'महंत और भाई दोनों हरिहर काका की ज़मीन चाहते हैं: महंत धर्म का सहारा लेता है, भाई रिश्ते का।'
  activity:
    type: order
    prompt: हरिहर काका की कहानी क्रम से लगाओ।
    steps:
    - भाई पहले सेवा करते, फिर रूखा-सूखा खाना
    - महंत ज़मीन ठाकुरजी के नाम लिखने को कहता है
    - महंत के लोग अपहरण कर अँगूठे लगवाते हैं
    - भाई पुलिस लेकर छुड़ाते हैं
    - पुलिस सुरक्षा में अलग रहना, ज़मीन किसी को नहीं
    reasons:
      महंत ज़मीन ठाकुरजी के नाम लिखने को कहता है: भाइयों के बुरे व्यवहार का फ़ायदा उठाकर महंत आता है।
      महंत के लोग अपहरण कर अँगूठे लगवाते हैं: समझाने से बात नहीं बनी, तब ज़बरदस्ती।
      भाई पुलिस लेकर छुड़ाते हैं: छुड़ाने के लिए पहले बंद होना ज़रूरी।
      पुलिस सुरक्षा में अलग रहना, ज़मीन किसी को नहीं: दोनों तरफ़ के स्वार्थ देखकर ही काका ने यह तय किया।
  lesson:
    - teach: '''हरिहर काका'' मिथिलेश्वर की कहानी है। काका के चार भाइयों में वे भी एक हैं; उनकी दो पत्नियाँ मर चुकी थीं और कोई संतान नहीं थी। उनके हिस्से में पंद्रह बीघे ज़मीन थी। वे भाइयों के परिवार के साथ रहते थे। शुरू में भाइयों की पत्नियाँ उनकी सेवा करती थीं, पर धीरे-धीरे उनकी उपेक्षा होने लगी, यहाँ तक कि उन्हें रूखा-सूखा बचा खाना मिलने लगा।'
      check:
        prompt: 'जाँचो: हरिहर काका के हिस्से में कितनी ज़मीन थी?'
        options:
        - पंद्रह बीघे
        - पाँच बीघे
        - पचास बीघे
        answer: पंद्रह बीघे
        why: इसी ज़मीन के लिए सब उनके पीछे थे।
      ways:
      - style: visual
        teach: भाइयों के परिवार में हरिहर काका की हालत कैसे बदली, क्रम से।
        picture:
          kind: flow
          steps:
          - पत्नियाँ नहीं रहीं, संतान नहीं
          - भाइयों के परिवार के साथ रहने लगे
          - शुरू में सेवा हुई
          - धीरे-धीरे उपेक्षा
          - रूखा-सूखा बचा खाना मिलने लगा
          alt: काका की पत्नियाँ नहीं रहीं और संतान नहीं थी; वे भाइयों के परिवार के साथ रहने लगे; शुरू में सेवा हुई, फिर धीरे-धीरे उपेक्षा हुई और उन्हें रूखा-सूखा बचा खाना मिलने लगा।
      - style: real_world
        teach: आज भी अख़बारों में ऐसी ख़बरें आती हैं कि संपत्ति लिखवाने के बाद किसी बुज़ुर्ग को घर से निकाल दिया गया। 'हरिहर काका' इसी सच्चाई की कहानी है।
    - teach: गाँव की ठाकुरबारी का महंत काका को समझाता है कि भाइयों पर भरोसा मत करो, अपनी ज़मीन ठाकुरजी के नाम लिख दो, स्वर्ग मिलेगा। जब काका नहीं माने, तो महंत के लोगों ने उनका अपहरण किया और ज़बरदस्ती सादे काग़ज़ों पर अँगूठे के निशान लगवा लिए। भाइयों ने पुलिस लेकर उन्हें छुड़ाया। पर बाद में भाई भी ज़मीन अपने नाम लिखवाने के लिए उन्हें धमकाने और मारने लगे।
      picture:
        kind: compare
        columns:
        - title: महंत
          points:
          - धर्म का डर दिखाया
          - अपहरण करवाया
          - अँगूठे लगवाए
        - title: भाई
          points:
          - पहले उपेक्षा की
          - फिर ख़ुशामद की
          - अंत में मारा-पीटा
        alt: 'हरिहर काका की ज़मीन के दो दावेदार: महंत ने धर्म का डर दिखाया, अपहरण करवाया और अँगूठे लगवाए; भाइयों ने उपेक्षा, ख़ुशामद और अंत में मारपीट की।'
      check:
        prompt: महंत ने काका को ज़मीन ठाकुरजी के नाम लिखने के लिए कैसे समझाया?
        options:
        - धर्म और स्वर्ग का लालच देकर
        - पैसे देकर
        - नौकरी देकर
        answer: धर्म और स्वर्ग का लालच देकर
        why: वह धर्म का सहारा लेकर स्वार्थ साध रहा था।
      ways:
      - style: step_by_step
        teach: 'पहला: महंत ने काका को स्वर्ग का लालच देकर ज़मीन ठाकुरजी के नाम लिखने को कहा। दूसरा: काका नहीं माने। तीसरा: महंत के लोगों ने उनका अपहरण करके ज़बरदस्ती सादे काग़ज़ों पर अँगूठे लगवाए। चौथा: भाइयों ने उन्हें छुड़ाया, पर बाद में वे भी ज़मीन के लिए धमकाने और मारने लगे।'
      - style: real_world
        teach: जब धर्म के नाम पर कोई कहे कि 'अपनी संपत्ति हमें दे दो, पुण्य मिलेगा', तो सावधान रहना चाहिए। कहानी का महंत धर्म का चोला पहनकर लालच कर रहा था।
    - teach: पुलिस ने काका को भाइयों से भी बचाया। अब काका पुलिस सुरक्षा में अकेले रहते हैं, एक नौकर के साथ। उन्होंने तय किया कि जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे, क्योंकि उन्होंने देखा था कि ज़मीन लिखवाने के बाद लोग कैसे दुत्कारे जाते हैं। कहानी दिखाती है कि लालच ने रिश्तों और धर्म दोनों को खोखला कर दिया है।
      check:
        prompt: हरिहर काका ने अंत में क्या फ़ैसला किया?
        options:
        - जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे
        - ज़मीन ठाकुरबारी को दे देंगे
        - ज़मीन भाइयों को दे देंगे
        answer: जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे
        why: उन्होंने सबका असली चेहरा देख लिया था।
      ways:
      - style: visual
        teach: ज़मीन के लिए दोनों पक्षों ने क्या किया, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: ठाकुरबारी का महंत
            points:
            - स्वर्ग का लालच दिया
            - अपहरण कर अँगूठे लगवाए
          - title: काका के भाई
            points:
            - पहले सेवा, फिर उपेक्षा
            - ज़मीन के लिए धमकाया और मारा
          alt: महंत ने स्वर्ग का लालच दिया और अपहरण कर अँगूठे लगवाए; भाइयों ने पहले सेवा की, फिर उपेक्षा की और ज़मीन के लिए धमकाया और मारा।
      - style: step_by_step
        teach: 'पहला: काका ने देखा कि ज़मीन लिखवाने के बाद लोग कैसे दुत्कारे जाते हैं। दूसरा: उन्होंने तय किया कि जीते-जी ज़मीन किसी के नाम नहीं लिखेंगे। तीसरा: अब वे पुलिस की सुरक्षा में, एक नौकर के साथ अकेले रहते हैं। चौथा: कहानी बताती है कि लालच ने रिश्ते और धर्म, दोनों को खोखला कर दिया।'
