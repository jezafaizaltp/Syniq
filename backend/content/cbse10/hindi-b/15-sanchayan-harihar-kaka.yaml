        alt: 'हरिहर काका की ज़मीन के दो दावेदार: महंत ने धर्म का डर दिखाया, अपहरण करवाया और अँगूठे लगवाए; भाइयों ने उपेक्षा, ख़ुशामद और अंत में मारपीट की।'
      check:
        prompt: महंत ने काका को ज़मीन ठाकुरजी के नाम लिखने के लिए कैसे समझाया?
        options:
        - धर्म और स्वर्ग का लालच देकर
