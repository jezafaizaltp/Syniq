subject: cbse10-hinb
chapter: 12
title: अब कहाँ दूसरे के दुख से दुखी होने वाले
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_chyonta: "पिता ने एक छोटे जीव को उसके घर से बेघर कर दिया था। उन्हें इसका दुख हुआ।"
  h10b_jaali: "कुछ पक्षी घर में घोंसला बनाकर आते-जाते थे और चीज़ें गिरा देते थे।"
  h10b_samudra: "समुद्र सिकुड़ते-सिकुड़ते गुस्सा हो गया और उसने बड़ी चीज़ों को उछाल दिया।"
  h10bs12_prasang: 'पाठ में कई छोटे प्रसंग हैं: सुलेमान, शेख अयाज़ के पिता, नूह, लेखक की माँ, वर्सोवा का समुद्र, लेखक की पत्नी। प्रश्न किस प्रसंग का है?'
  h10bs12_badlav: लेखक पुराने समय की संवेदनशीलता और आज के स्वार्थ की तुलना करते हैं। उत्तर में सोचो कि बात किस समय के व्यवहार को दिखाती है।
concepts:
- code: hin10b.s12.dukh
  title: अब कहाँ दूसरे के दुख से दुखी होने वाले (निदा फ़ाज़ली)
  notes: |
    निदा फ़ाज़ली का पाठ। पहले लोग पेड़-पौधों, पशु-पक्षियों और प्रकृति का दुख समझते थे; अब मनुष्य स्वार्थी हो गया है।
    उदाहरण: बादशाह सुलेमान, जो पशु-पक्षियों की भाषा समझते थे, चींटियों की बात सुनकर उनके लिए रास्ता बदल लेते हैं।
    सिंध के कवि शेख अयाज़ के पिता खाना खाते समय बाजू पर काला च्योंटा देखकर खाना छोड़कर उसे वापस कुएँ पर छोड़ने गए,
    क्योंकि उन्होंने 'एक घरवाले को बेघर कर दिया'। नूह ने एक घायल कुत्ते को दुत्कारा, कुत्ते ने कहा मैं अपनी मर्ज़ी से
    कुत्ता नहीं हूँ; इसके बाद नूह उम्र भर रोते रहे। लेखक की माँ सिखाती थीं: सूरज ढलने पर पेड़ों से पत्ते मत तोड़ो, दरिया
    पर जाओ तो उसे सलाम करो, कबूतरों और मुर्गों को मत सताओ; ग्वालियर में कबूतर का अंडा टूटने पर माँ ने दिन भर रोज़ा
    रखकर माफ़ी माँगी। अब बंबई (मुंबई) में बिल्डर समुद्र को पीछे धकेलकर इमारतें बना रहे हैं; गुस्साए समुद्र ने तीन
    जहाज़ उठाकर फेंक दिए: एक वर्ली के किनारे, एक बांद्रा में कार्टर रोड, एक गेटवे ऑफ़ इंडिया पर। लेखक के फ़्लैट में
    कबूतरों का घोंसला था; अंडा टूटने के बाद पत्नी ने खिड़की पर जाली लगा दी, अब कबूतर बाहर बैठकर उदास रहते हैं।
  explanations:
    text: 'लेखक बताते हैं कि पहले लोग चींटी, कबूतर, पेड़ और समुद्र तक का दुख समझते थे, जैसे शेख अयाज़ के पिता ने खाना छोड़कर च्योंटे को उसके घर पहुँचाया। आज मनुष्य ने समुद्र को पीछे धकेलकर इमारतें बना लीं और पक्षियों के लिए खिड़कियाँ बंद कर दीं: दूसरों के दुख से दुखी होने वाले अब कम रह गए हैं।'
    visual: 'दो चित्र साथ रखिए: पहला, पुराने आँगन में अंडा टूटने पर रोज़ा रखती लेखक की माँ; दूसरा, मुंबई के समुद्र किनारे ऊँची इमारतें और लहरों द्वारा किनारे पर फेंका गया जहाज़, तथा जाली लगी खिड़की के बाहर उदास कबूतर।'
    step_by_step: '1. सुलेमान और चींटियाँ। 2. शेख अयाज़ के पिता और च्योंटा। 3. नूह और कुत्ता। 4. लेखक की माँ की सीखें, अंडा टूटने पर रोज़ा। 5. मुंबई: समुद्र का सिमटना, तीन जहाज़ फेंकना। 6. खिड़की पर जाली और कबूतर।'
    real_world: शहर बढ़ाने के लिए जंगल कटते हैं और तालाब भरे जाते हैं; बाढ़ और गर्मी के रूप में प्रकृति उसका जवाब देती है, जैसे पाठ में समुद्र ने दिया।
  picture:
    kind: compare
    columns:
    - title: पहले
      points:
      - च्योंटे को घर लौटाना
      - अंडा टूटने पर रोज़ा
      - दरिया को सलाम
    - title: अब
      points:
      - समुद्र को पीछे धकेलकर इमारतें
      - खिड़की पर जाली
      - पक्षियों के लिए जगह नहीं
    alt: पहले लोग छोटे जीवों और प्रकृति का दुख समझते थे; अब मनुष्य अपनी सुविधा के लिए प्रकृति को पीछे धकेल रहा है।
  activity:
    type: sort
    prompt: यह पहले के लोगों का व्यवहार है या आज के मनुष्य का?
    bins:
    - दूसरों के दुख से दुखी (पहले)
    - स्वार्थी (आज)
    items:
    - label: सुलेमान ने चींटियों के लिए रास्ता बदला
      bin: दूसरों के दुख से दुखी (पहले)
      clue: बादशाह ने किसकी परवाह की?
      why: सुलेमान ने चींटियों का घर बचाया।
    - label: शेख अयाज़ के पिता च्योंटे को कुएँ पर छोड़ आए
      bin: दूसरों के दुख से दुखी (पहले)
      clue: खाना छोड़कर वे कहाँ गए?
      why: '''एक घरवाले को बेघर'' न करने के लिए।'
    - label: कबूतर का अंडा टूटने पर माँ का रोज़ा
      bin: दूसरों के दुख से दुखी (पहले)
      clue: माँ ने माफ़ी क्यों माँगी?
      why: पक्षी के दुख में दुखी होना।
    - label: बिल्डर समुद्र को पीछे धकेलते हैं
      bin: स्वार्थी (आज)
      clue: इमारतों के लिए किसकी जगह छीनी जा रही है?
      why: 'आज का स्वार्थ: समुद्र की ज़मीन पर कब्ज़ा।'
    - label: पेड़ काटकर बस्तियाँ बसाना
      bin: स्वार्थी (आज)
      clue: यह प्रकृति का ध्यान है या अपना फ़ायदा?
      why: अपने लिए प्रकृति को उजाड़ना।
  lesson:
    - teach: '''अब कहाँ दूसरे के दुख से दुखी होने वाले'' निदा फ़ाज़ली का पाठ है। लेखक बताते हैं कि पहले लोग सभी जीवों के दुख को अपना मानते थे। बाइबिल के सोलोमन (कुरान के सुलेमान) पशु-पक्षियों की भाषा समझते थे; एक बार चींटियों के डर से भागने पर उन्होंने कहा, ''घबराओ नहीं, सुलेमान को ख़ुदा ने सबका रखवाला बनाया है।'' सिंधी कवि शेख अयाज़ के पिता खाना छोड़कर उठ गए, ताकि बाज़ू पर चढ़ आए च्योंटे को उसके घर वापस छोड़ आएँ।'
      check:
        prompt: सुलेमान ने डरी हुई चींटियों से क्या कहा?
        options:
        - घबराओ नहीं, ख़ुदा ने मुझे सबका रखवाला बनाया है
        - रास्ते से हट जाओ
        - तुम्हें कुचल दूँगा
        answer: घबराओ नहीं, ख़ुदा ने मुझे सबका रखवाला बनाया है
        why: वे सब जीवों के रक्षक थे।
    - teach: 'नूह को एक घायल कुत्ते को दुत्कारने पर कुत्ते ने कहा, ''न मैं अपनी मर्ज़ी से कुत्ता हूँ, न तुम अपनी पसंद से इंसान।'' यह सुनकर नूह जीवन भर रोते रहे। लेखक की माँ कहती थीं: सूरज ढलने पर पेड़ों से पत्ते मत तोड़ो, दरिया पर जाओ तो सलाम करो, कबूतरों और मुर्गों को मत सताओ। ग्वालियर में कबूतर का अंडा माँ के हाथ से टूट गया, तो उन्होंने प्रायश्चित में दिन भर रोज़ा रखा और नमाज़ पढ़कर माफ़ी माँगी।'
      picture:
        kind: compare
        columns:
        - title: पहले
          points:
          - च्योंटे को घर छोड़ना
          - अंडा टूटने पर रोज़ा
          - पेड़-दरिया का सम्मान
        - title: आज
          points:
          - समुद्र को पीछे धकेलना
          - जंगल काटकर इमारतें
          - कबूतरों के लिए जाली
        alt: 'पहले और आज का अंतर: पहले लोग च्योंटे, अंडे, पेड़ और दरिया का ध्यान रखते थे; आज समुद्र पीछे धकेला जाता है, जंगल कटते हैं और कबूतरों को जाली से रोका जाता है।'
      check:
        prompt: नूह जीवन भर क्यों रोते रहे?
        options:
        - कुत्ते की बात से उन्हें अपनी ग़लती का एहसास हुआ
        - उनका घर टूट गया
        - वे बीमार थे
        answer: कुत्ते की बात से उन्हें अपनी ग़लती का एहसास हुआ
        why: हर जीव ईश्वर की रचना है।
    - teach: 'आज मनुष्य स्वार्थी हो गया है। मुंबई के वर्सोवा में जहाँ पहले जंगल और पशु-पक्षी थे, वहाँ बिल्डरों ने समुद्र को पीछे धकेलकर इमारतें बना दीं। ग़ुस्से में समुद्र ने तीन जहाज़ उठाकर अलग-अलग जगह फेंक दिए: एक वर्ली के किनारे, एक बांद्रा के कार्टर रोड पर, एक गेटवे ऑफ़ इंडिया पर। लेखक के फ़्लैट में कबूतरों ने घोंसला बनाया, तो पत्नी ने तंग आकर खिड़की पर जाली लगा दी। अब कबूतर उदास बैठे रहते हैं, पर उनके दुख में दुखी होने वाला कोई नहीं।'
      check:
        prompt: समुद्र ने अपना ग़ुस्सा कैसे दिखाया?
        options:
        - तीन जहाज़ उठाकर अलग-अलग किनारों पर फेंक दिए
        - शहर में बाढ़ ला दी
        - चुप हो गया
        answer: तीन जहाज़ उठाकर अलग-अलग किनारों पर फेंक दिए
        why: बिल्डरों ने उसकी ज़मीन छीनी थी।
  items:
  - prompt: इस पाठ के लेखक कौन हैं?
    options:
    - निदा फ़ाज़ली
    - कैफ़ी आज़मी
    - राही मासूम रज़ा
    - हबीब तनवीर
    answer: निदा फ़ाज़ली
    difficulty: 1
    hints:
    - शायर और गद्यकार।
    - ग्वालियर में बचपन।
    solution: निदा फ़ाज़ली।
    mistakes:
      कैफ़ी आज़मी: hin10b_author
  - prompt: शेख अयाज़ के पिता खाना छोड़कर क्यों उठ गए?
    options:
    - बाजू पर आए च्योंटे को उसके घर वापस छोड़ने
    - किसी मेहमान के आने पर
    - खाना अच्छा नहीं था
    - नमाज़ पढ़ने
    answer: बाजू पर आए च्योंटे को उसके घर वापस छोड़ने
    difficulty: 1
    hints:
    - एक छोटा काला जीव।
    - '''एक घरवाले को बेघर कर दिया''।'
    solution: वे च्योंटे को कुएँ पर उसके घर छोड़ने गए।
    mistakes: {"नमाज़ पढ़ने": "h10b_chyonta"}
  - prompt: कबूतर का अंडा टूटने पर लेखक की माँ ने क्या किया?
    options:
    - दिन भर रोज़ा रखकर माफ़ी माँगी
    - कबूतरों को भगा दिया
    - नया घोंसला बनाया
    - कुछ नहीं किया
    answer: दिन भर रोज़ा रखकर माफ़ी माँगी
    difficulty: 2
    hints:
    - उन्हें अपनी गलती लगी।
    - उपवास।
    solution: उन्होंने दिन भर रोज़ा रखा और खुदा से माफ़ी माँगी।
    mistakes:
      कबूतरों को भगा दिया: hin10b_read_again
  - prompt: बिल्डरों के समुद्र को पीछे धकेलने पर समुद्र ने क्या किया?
    options:
    - गुस्से में तीन जहाज़ उठाकर अलग-अलग किनारों पर फेंक दिए
    - शहर में बाढ़ ला दी
    - चुपचाप पीछे हट गया
    - मछलियाँ खत्म कर दीं
    answer: गुस्से में तीन जहाज़ उठाकर अलग-अलग किनारों पर फेंक दिए
    difficulty: 2
    hints:
    - वर्ली, बांद्रा, गेटवे ऑफ़ इंडिया।
    - तीन।
    solution: समुद्र ने तीन जहाज़ उठाकर वर्ली, बांद्रा (कार्टर रोड) और गेटवे ऑफ़ इंडिया पर फेंक दिए।
    mistakes: {"चुपचाप पीछे हट गया": "h10b_samudra"}
  - prompt: लेखक की पत्नी ने खिड़की पर जाली क्यों लगा दी?
    options:
    - कबूतरों के आने-जाने से परेशान होकर
    - चोरों से बचने के लिए
    - मच्छरों के कारण
    - धूप रोकने के लिए
    answer: कबूतरों के आने-जाने से परेशान होकर
    difficulty: 2
    hints:
