# CBSE Class 10 Hindi B (NCERT Sparsh 2). Chapter numbers here are SYNiq's own order.
# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hinb
chapter: 7
title: आत्मत्राण
tips:
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_atmatran: "'त्राण' का अर्थ है बचाव या रक्षा। 'आत्म' यानी स्वयं।"
  h10b_sanshay: "कवि दुख हटाने की प्रार्थना नहीं करते। वे ईश्वर पर अपना भरोसा बचाए रखना चाहते हैं।"
  h10bs7_maang: कवि हर पंक्ति में पहले कहते हैं कि वे क्या नहीं माँगते, फिर बताते हैं कि क्या चाहते हैं। प्रश्न किस हिस्से का है?
  h10bs7_bhav: 'यह प्रार्थना सामान्य प्रार्थनाओं से अलग है: कवि सहायता नहीं, साहस और शक्ति माँगते हैं। उसी भाव से उत्तर सोचो।'
concepts:
- code: hin10b.s7.atmatran
  title: आत्मत्राण (रवींद्रनाथ ठाकुर)
  notes: |
    रवींद्रनाथ ठाकुर (टैगोर, नोबेल पुरस्कार 1913) की बांग्ला कविता, हिंदी अनुवाद आचार्य हजारीप्रसाद द्विवेदी।
    'आत्मत्राण' = अपनी रक्षा स्वयं करना। कवि ईश्वर से यह नहीं माँगते कि मुझे विपदाओं से बचाओ, बल्कि यह कि विपदा
    में भय न हो। दुख में सांत्वना न मिले तो भी दुख पर जीत पा सकूँ। कोई सहायक न मिले तो अपना बल-पौरुष न डगमगाए।
    हानि या धोखा मिले तो भी मन में हार न मानूँ। तुम मुझे तारो, यह प्रार्थना नहीं; बस तैरने (संघर्ष करने) की शक्ति
    दो। मेरा भार हल्का न करो, पर उसे निर्भय होकर उठा सकूँ। सुख के दिनों में नम्र (नत शिर) होकर हर पल तुम्हें
    पहचानूँ; दुख की रात में जब सारी दुनिया धोखा दे, तब भी तुम पर संदेह न करूँ।
  explanations:
    text: 'कवि ईश्वर से मुसीबतों से बचाने की नहीं, मुसीबतों से लड़ने की शक्ति माँगते हैं: डर न लगे, हिम्मत न टूटे, बोझ उठा सकूँ। सुख में ईश्वर को न भूलूँ और दुख में ईश्वर पर शक न करूँ।'
    visual: 'दो चित्रों की तुलना: एक व्यक्ति नाव में बैठा है और कोई उसे खींचकर पार ले जा रहा है (कवि यह नहीं चाहते); दूसरा व्यक्ति खुद तैरकर लहरें पार कर रहा है (कवि यही शक्ति माँगते हैं)।'
    step_by_step: 1. कवि और अनुवादक। 2. बचाव नहीं, निर्भयता माँगना। 3. सांत्वना नहीं, दुख पर जीत। 4. सहायक न मिले तो अपना बल। 5. तारो नहीं, तैरने की शक्ति। 6. सुख में विनम्रता, दुख में अटूट विश्वास।
    real_world: 'परीक्षा से पहले ''प्रश्न आसान आएँ'' की जगह ''जो भी आए, उसे करने की हिम्मत रहे'' माँगना: यही इस कविता का भाव है।'
  picture:
    kind: compare
    columns:
    - title: कवि क्या नहीं माँगते
      points:
      - विपदाओं से बचाव
      - दुख में सांत्वना
      - भार कम करना
      - मुझे तार दो
    - title: कवि क्या माँगते हैं
      points:
      - विपदा में निर्भयता
      - दुख पर विजय
      - भार उठाने की शक्ति
      - तैरने की शक्ति
    alt: कवि बचाव, सांत्वना और भार कम करना नहीं, बल्कि निर्भयता, दुख पर विजय और संघर्ष की शक्ति माँगते हैं।
  activity:
    type: sort
    prompt: कवि ईश्वर से क्या माँगते हैं और क्या नहीं माँगते?
    bins:
    - माँगते हैं
    - नहीं माँगते
    items:
    - label: विपदा में भय न हो
      bin: माँगते हैं
      clue: विपदा से बचाव या विपदा में निडरता?
      why: कवि निडर होकर विपदा सहना चाहते हैं।
    - label: तैरने की शक्ति
      bin: माँगते हैं
      clue: '''तुम मुझे तारो'' कवि चाहते हैं या कुछ और?'
      why: संघर्ष करने की शक्ति माँगते हैं।
    - label: भार निर्भय होकर उठा सकूँ
      bin: माँगते हैं
      clue: भार के बारे में कवि की प्रार्थना क्या है?
      why: भार उठाने की क्षमता माँगते हैं।
    - label: मुझे विपदाओं से बचाओ
      bin: नहीं माँगते
      clue: '''आत्मत्राण'' का अर्थ याद करो।'
      why: कवि बचाव नहीं, अपनी रक्षा की शक्ति चाहते हैं।
    - label: मेरा भार हल्का कर दो
      bin: नहीं माँगते
      clue: क्या कवि बोझ कम चाहते हैं?
      why: भार हल्का करने की प्रार्थना नहीं करते।
    - label: तुम मुझे तारो
      bin: नहीं माँगते
      clue: कवि खुद तैरना चाहते हैं या पार करवाया जाना?
      why: तारने की नहीं, तैरने की शक्ति माँगते हैं।
  lesson:
    - teach: '''आत्मत्राण'' रवींद्रनाथ ठाकुर (टैगोर) की बांग्ला कविता है, जिसका हिंदी अनुवाद आचार्य हजारीप्रसाद द्विवेदी ने किया। ''आत्मत्राण'' का अर्थ है अपनी रक्षा स्वयं करना। टैगोर को ''गीतांजलि'' के लिए 1913 में नोबेल पुरस्कार मिला था; वे एशिया के पहले नोबेल विजेता थे।'
      check:
        prompt: टैगोर को नोबेल पुरस्कार किस रचना के लिए मिला?
        options:
        - गीतांजलि
        - कामायनी
        - गोदान
        answer: गीतांजलि
        why: 1913 में।
    - teach: 'कवि कहते हैं: ''विपदाओं से मुझे बचाओ, यह मेरी प्रार्थना नहीं; केवल इतना हो, कभी न विपदा में पाऊँ भय।'' वे दुखी मन के लिए सांत्वना नहीं माँगते, पर दुख पर विजय पाने की शक्ति माँगते हैं। अगर कोई सहायक न मिले, तो भी उनका बल और पौरुष न डगमगाए; संसार में हानि या धोखा मिले, तो भी मन हार न माने।'
      picture:
        kind: compare
        columns:
        - title: कवि क्या नहीं माँगते
          points:
          - विपदा से बचाव
          - सांत्वना
          - रोज़ रक्षा
          - भार हल्का करना
        - title: कवि क्या माँगते हैं
          points:
          - विपदा में निर्भयता
          - दुख पर विजय
          - तरने की शक्ति
          - भार उठाने का साहस
        alt: 'आत्मत्राण में कवि की प्रार्थना: वे विपदा से बचाव, सांत्वना, रक्षा और भार हल्का करना नहीं माँगते; वे निर्भयता, दुख पर विजय, तरने की शक्ति और साहस माँगते हैं।'
      check:
        prompt: कवि विपदा के समय क्या चाहते हैं?
        options:
        - कि उन्हें भय न हो
        - कि ईश्वर विपदा हटा दें
        - कि कोई उनकी सहायता करे
        answer: कि उन्हें भय न हो
        why: वे विपदा से लड़ना चाहते हैं।
    - teach: '''मेरा त्राण करो अनुदिन तुम, यह मेरी प्रार्थना नहीं; बस इतना होवे, तरने की हो शक्ति अनामय।'' वे भार हल्का करने को नहीं कहते, बल्कि उसे निर्भय होकर उठाने की शक्ति माँगते हैं। सुख के दिनों में भी सिर झुकाकर हर पल ईश्वर का मुख पहचानें, और दुख की रात में जब सारी दुनिया धोखा दे, तब भी ईश्वर पर संशय न करें।'
      check:
        prompt: सुख के दिनों में कवि क्या करना चाहते हैं?
        options:
        - विनम्र होकर हर पल ईश्वर को याद करें
        - ईश्वर को भूल जाएँ
        - उत्सव मनाएँ
        answer: विनम्र होकर हर पल ईश्वर को याद करें
        why: '''नत शिर होकर सुख के दिन में तव मुख पहचानूँ''।'
  items:
  - prompt: '''आत्मत्राण'' कविता के मूल कवि कौन हैं?'
    options:
    - रवींद्रनाथ ठाकुर
    - हजारीप्रसाद द्विवेदी
    - सुमित्रानंदन पंत
    - कबीर
    answer: रवींद्रनाथ ठाकुर
    difficulty: 1
    hints:
    - मूल कविता बांग्ला में है।
    - नोबेल पुरस्कार विजेता।
    solution: रवींद्रनाथ ठाकुर; अनुवाद हजारीप्रसाद द्विवेदी का है।
    mistakes:
      हजारीप्रसाद द्विवेदी: hin10b_author
  - prompt: इस कविता का हिंदी अनुवाद किसने किया?
    options:
    - हजारीप्रसाद द्विवेदी
    - प्रेमचंद
    - मैथिलीशरण गुप्त
    - महादेवी वर्मा
    answer: हजारीप्रसाद द्विवेदी
    difficulty: 2
    hints:
    - प्रसिद्ध निबंधकार और आचार्य।
    - शांतिनिकेतन में रहे।
    solution: आचार्य हजारीप्रसाद द्विवेदी।
    mistakes:
      मैथिलीशरण गुप्त: hin10b_author
  - prompt: '''आत्मत्राण'' का अर्थ क्या है?'
    options:
    - अपनी रक्षा स्वयं करना
    - ईश्वर की पूजा
    - आत्मा की कथा
    - दूसरों की सेवा
    answer: अपनी रक्षा स्वयं करना
    difficulty: 1
    hints:
    - '''त्राण'' = रक्षा।'
    - '''आत्म'' = स्वयं।'
    solution: आत्मत्राण = अपना बचाव स्वयं करना।
    mistakes: {"आत्मा की कथा": "h10b_atmatran"}
  - prompt: कवि ईश्वर से क्या माँगते हैं?
    options:
    - विपदाओं में भी भय न हो और संघर्ष की शक्ति मिले
    - सभी विपदाओं से बचाव
    - बहुत धन और सुख
    - दुख में सांत्वना
    answer: विपदाओं में भी भय न हो और संघर्ष की शक्ति मिले
    difficulty: 2
    hints:
    - '''विपदाओं से मुझे बचाओ, यह मेरी प्रार्थना नहीं।'''
    - तैरने की शक्ति।
    solution: कवि निर्भयता और संघर्ष करने की शक्ति माँगते हैं, बचाव नहीं।
    mistakes:
      सभी विपदाओं से बचाव: hin10b_poem_meaning
  - prompt: '''तरने की हो शक्ति अनामय'' का भाव क्या है?'
    options:
    - मुसीबत को खुद पार करने की पूरी शक्ति हो
    - कवि तैरना सीखना चाहते हैं
    - कोई नाव में बैठाकर पार ले जाए
    - बीमारी न हो
    answer: मुसीबत को खुद पार करने की पूरी शक्ति हो
    difficulty: 3
    hints:
    - तारना = कोई और पार करे; तरना = खुद पार करना।
    - संसार रूपी सागर।
    solution: कवि चाहते हैं कि वे स्वयं दुखों के सागर को पार करने में समर्थ हों।
    mistakes:
      कवि तैरना सीखना चाहते हैं: hin10b_poem_meaning
  - prompt: दुख की रात में कवि ईश्वर से क्या चाहते हैं?
    options:
    - ईश्वर पर कोई संशय न हो
    - दुनिया उनकी मदद करे
    - दुख तुरंत खत्म हो
    - वे सो जाएँ
    answer: ईश्वर पर कोई संशय न हो
    difficulty: 2
    hints:
    - जब सारी दुनिया धोखा दे।
    - विश्वास।
    solution: जब सारी दुनिया धोखा दे, तब भी वे ईश्वर पर संदेह न करें।
    mistakes: {"दुख तुरंत खत्म हो": "h10b_sanshay"}
  - prompt: '''आत्मत्राण'' मूल रूप से किस भाषा में लिखी गई?'
    options:
    - बांग्ला
    - हिंदी
    - संस्कृत
    - अंग्रेज़ी
    answer: बांग्ला
    difficulty: 2
    hints:
    - टैगोर बंगाल के थे।
    - हिंदी में तो इसका अनुवाद है।
    solution: मूल कविता बांग्ला में है; हजारीप्रसाद द्विवेदी ने हिंदी में अनुवाद किया।
    mistakes:
      हिंदी: hin10b_author
  - prompt: कवि सहायक न मिलने पर क्या चाहते हैं?
    options:
    - उनका अपना बल और पौरुष न डगमगाए
    - ईश्वर स्वयं आ जाएँ
    - वे घर बैठ जाएँ
    - दूसरे उनकी मदद करें
    answer: उनका अपना बल और पौरुष न डगमगाए
    difficulty: 2
    hints:
    - '''तो अपना बल पौरुष न हिले''।'
    - आत्मनिर्भरता।
    solution: कोई सहायक न मिले तो भी कवि का आत्मबल अडिग रहे।
    mistakes:
      ईश्वर स्वयं आ जाएँ: h10bs7_bhav
  - prompt: हानि या धोखा मिलने पर कवि क्या चाहते हैं?
    options:
    - मन में हार न मानें
    - बदला लें
    - रोते रहें
    - संसार छोड़ दें
    answer: मन में हार न मानें
    difficulty: 2
    hints:
    - '''तो भी मन में ना मानूँ क्षय''।'
    - '''क्षय'' यानी नाश, हार।'
    solution: हानि और धोखे में भी कवि मन से नहीं टूटना चाहते।
    mistakes:
      बदला लें: h10bs7_bhav
  - prompt: कवि अपने भार के बारे में क्या प्रार्थना करते हैं?
    options:
    - भार हल्का न करें, बस उसे निर्भय होकर उठाने की शक्ति दें
    - सारा भार ले लें
    - भार दोगुना कर दें
    - भार किसी और को दे दें
    answer: भार हल्का न करें, बस उसे निर्भय होकर उठाने की शक्ति दें
    difficulty: 2
    hints:
    - '''वहन कर सकूँ इसको निर्भय''।'
    - वे ज़िम्मेदारी से भागते नहीं।
