subject: cbse10-hinb
chapter: 7
title: आत्मत्राण
tips:
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
concepts:
- code: hin10b.s7.atmatran
  title: आत्मत्राण (रवींद्रनाथ ठाकुर)
  notes: |
    रवींद्रनाथ ठाकुर (टैगोर, नोबेल पुरस्कार 1913) की बांग्ला कविता, हिंदी अनुवाद आचार्य हजारीप्रसाद द्विवेदी।
    'आत्मत्राण' = अपनी रक्षा स्वयं करना। कवि ईश्वर से यह नहीं माँगते कि मुझे विपदाओं से बचाओ, बल्कि यह कि विपदा
    में भय न हो। दुख में सांत्वना न मिले तो भी दुख पर जीत पा सकूँ। कोई सहायक न मिले तो अपना बल-पौरुष न डगमगाए।
    हानि या धोखा मिले तो भी मन में हार न मानूँ। तुम मुझे तारो, यह प्रार्थना नहीं; बस तैरने (संघर्ष करने) की शक्ति
    दो। मेरा भार हल्का न करो, पर उसे निर्भय होकर उठा सकूँ। सुख के दिनों में नम्र (नत शिर) होकर हर पल तुम्हें
    पहचानूँ; दुख की रात में जब सारी दुनिया धोखा दे, तब भी तुम पर संदेह न करूँ।
  explanations:
    text: 'कवि ईश्वर से मुसीबतों से बचाने की नहीं, मुसीबतों से लड़ने की शक्ति माँगते हैं: डर न लगे, हिम्मत न टूटे, बोझ उठा सकूँ। सुख में ईश्वर को न भूलूँ और दुख में ईश्वर पर शक न करूँ।'
    visual: 'दो चित्रों की तुलना: एक व्यक्ति नाव में बैठा है और कोई उसे खींचकर पार ले जा रहा है (कवि यह नहीं चाहते); दूसरा व्यक्ति खुद तैरकर लहरें पार कर रहा है (कवि यही शक्ति माँगते हैं)।'
    step_by_step: 1. कवि और अनुवादक। 2. बचाव नहीं, निर्भयता माँगना। 3. सांत्वना नहीं, दुख पर जीत। 4. सहायक न मिले तो अपना बल। 5. तारो नहीं, तैरने की शक्ति। 6. सुख में विनम्रता, दुख में अटूट विश्वास।
    real_world: 'परीक्षा से पहले ''प्रश्न आसान आएँ'' की जगह ''जो भी आए, उसे करने की हिम्मत रहे'' माँगना: यही इस कविता का भाव है।'
  picture:
    kind: compare
    columns:
    - title: कवि क्या नहीं माँगते
      points:
      - विपदाओं से बचाव
      - दुख में सांत्वना
      - भार कम करना
      - मुझे तार दो
    - title: कवि क्या माँगते हैं
      points:
      - विपदा में निर्भयता
      - दुख पर विजय
      - भार उठाने की शक्ति
      - तैरने की शक्ति
    alt: कवि बचाव, सांत्वना और भार कम करना नहीं, बल्कि निर्भयता, दुख पर विजय और संघर्ष की शक्ति माँगते हैं।
  items:
  - prompt: '''आत्मत्राण'' कविता के मूल कवि कौन हैं?'
    options:
    - रवींद्रनाथ ठाकुर
    - हजारीप्रसाद द्विवेदी
    - सुमित्रानंदन पंत
    - कबीर
    answer: रवींद्रनाथ ठाकुर
    difficulty: 1
    hints:
    - मूल कविता बांग्ला में है।
    - नोबेल पुरस्कार विजेता।
    solution: रवींद्रनाथ ठाकुर; अनुवाद हजारीप्रसाद द्विवेदी का है।
    mistakes:
      हजारीप्रसाद द्विवेदी: hin10b_author
  - prompt: इस कविता का हिंदी अनुवाद किसने किया?
    options:
    - हजारीप्रसाद द्विवेदी
    - प्रेमचंद
    - मैथिलीशरण गुप्त
    - महादेवी वर्मा
    answer: हजारीप्रसाद द्विवेदी
    difficulty: 2
    hints:
    - प्रसिद्ध निबंधकार और आचार्य।
    - शांतिनिकेतन में रहे।
    solution: आचार्य हजारीप्रसाद द्विवेदी।
    mistakes:
      मैथिलीशरण गुप्त: hin10b_author
  - prompt: '''आत्मत्राण'' का अर्थ क्या है?'
    options:
    - अपनी रक्षा स्वयं करना
    - ईश्वर की पूजा
    - आत्मा की कथा
    - दूसरों की सेवा
    answer: अपनी रक्षा स्वयं करना
    difficulty: 1
    hints:
    - '''त्राण'' = रक्षा।'
    - '''आत्म'' = स्वयं।'
    solution: आत्मत्राण = अपना बचाव स्वयं करना।
  - prompt: कवि ईश्वर से क्या माँगते हैं?
    options:
    - विपदाओं में भी भय न हो और संघर्ष की शक्ति मिले
    - सभी विपदाओं से बचाव
    - बहुत धन और सुख
    - दुख में सांत्वना
    answer: विपदाओं में भी भय न हो और संघर्ष की शक्ति मिले
    difficulty: 2
    hints:
    - '''विपदाओं से मुझे बचाओ, यह मेरी प्रार्थना नहीं।'''
    - तैरने की शक्ति।
    solution: कवि निर्भयता और संघर्ष करने की शक्ति माँगते हैं, बचाव नहीं।
    mistakes:
      सभी विपदाओं से बचाव: hin10b_poem_meaning
  - prompt: '''तरने की हो शक्ति अनामय'' का भाव क्या है?'
    options:
    - मुसीबत को खुद पार करने की पूरी शक्ति हो
    - कवि तैरना सीखना चाहते हैं
    - कोई नाव में बैठाकर पार ले जाए
    - बीमारी न हो
    answer: मुसीबत को खुद पार करने की पूरी शक्ति हो
    difficulty: 3
    hints:
    - तारना = कोई और पार करे; तरना = खुद पार करना।
    - संसार रूपी सागर।
    solution: कवि चाहते हैं कि वे स्वयं दुखों के सागर को पार करने में समर्थ हों।
    mistakes:
      कवि तैरना सीखना चाहते हैं: hin10b_poem_meaning
  - prompt: दुख की रात में कवि ईश्वर से क्या चाहते हैं?
    options:
    - ईश्वर पर कोई संशय न हो
    - दुनिया उनकी मदद करे
    - दुख तुरंत खत्म हो
    - वे सो जाएँ
    answer: ईश्वर पर कोई संशय न हो
    difficulty: 2
    hints:
    - जब सारी दुनिया धोखा दे।
    - विश्वास।
    solution: जब सारी दुनिया धोखा दे, तब भी वे ईश्वर पर संदेह न करें।
