subject: cbse10-hinb
chapter: 13
title: पतझर में टूटी पत्तियाँ
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_ginni: "शुद्ध सोना बहुत नरम होता है। गिन्नी में उसे मज़बूत बनाने के लिए एक लाल रंग की धातु मिलाई जाती है।"
  h10bs13_prasang: 'पाठ में दो प्रसंग हैं: ''गिन्नी का सोना'' (आदर्श और व्यवहार) और ''झेन की देन'' (वर्तमान में जीना)। प्रश्न किस प्रसंग का है?'
  h10bs13_tulna: लेखक शुद्ध सोने को आदर्श और ताँबे को व्यवहार मानते हैं। सोचो कि कौन किसके स्तर पर उठता या गिरता है।
concepts:
- code: hin10b.s13.patjhar
  title: पतझर में टूटी पत्तियाँ (रवींद्र केलेकर)
  notes: |
    रवींद्र केलेकर के दो प्रसंग। (1) गिन्नी का सोना: शुद्ध सोना अलग है और गिन्नी का सोना अलग; गिन्नी के सोने में थोड़ा
    ताँबा मिला होता है, इसलिए वह ज़्यादा चमकता और मज़बूत होता है। शुद्ध आदर्श शुद्ध सोने जैसे हैं; व्यावहारिकता
    (प्रैक्टिकल आइडियलिज़्म) ताँबे जैसी है। जो लोग आदर्शों में व्यावहारिकता मिलाकर चलते हैं, वे अक्सर आदर्शों को नीचे
    गिरा देते हैं; गांधीजी ने इसका उलटा किया: व्यवहार को आदर्शों के स्तर पर चढ़ाया, यानी ताँबे में सोना मिलाया।
    समाज के शाश्वत मूल्य आदर्शवादी लोगों ने दिए हैं। (2) झेन की देन: जापान में लोग अमेरिका से होड़ में इतनी तेज़
    ज़िंदगी जीते हैं कि बहुतों को मानसिक रोग हो जाते हैं। लेखक का मित्र उन्हें 'टी-सेरेमनी' (चा-नो-यू) में ले गया:
    शांत कुटिया, चाजीन (परोसने वाला) बड़े ढंग से चाय बनाता है, केवल तीन लोग, बिल्कुल शांति; चाय की चुस्कियों में
    डेढ़ घंटा बीता और लेखक को लगा वे अनंतकाल में जी रहे हैं। सीख: भूत और भविष्य मिथ्या हैं, वर्तमान ही सत्य है, उसी
    में जियो।
  explanations:
    text: पहले प्रसंग में लेखक कहते हैं कि शुद्ध सोने में ताँबा मिलाने से गिन्नी बनती है; वैसे ही आदर्शों में व्यावहारिकता मिलाने से अक्सर आदर्श कमज़ोर होते हैं, पर गांधीजी ने व्यवहार को आदर्श तक उठाया। दूसरे प्रसंग में जापान की शांत 'चा-नो-यू' चाय-विधि बताती है कि तेज़ जीवन के बीच वर्तमान में जीना ही सच्ची शांति है।
    visual: 'दो खाने: पहले में सोने की ईंट और ताँबा मिली चमकती गिन्नी; दूसरे में एक छोटी जापानी कुटिया, जहाँ तीन लोग शांति से बैठे हैं और चाजीन धीरे-धीरे चाय डाल रहा है।'
    step_by_step: '1. शुद्ध सोना बनाम गिन्नी का सोना। 2. आदर्श = सोना, व्यावहारिकता = ताँबा। 3. गांधीजी: व्यवहार को आदर्श तक उठाया। 4. जापान की तेज़ ज़िंदगी, मानसिक रोग। 5. चा-नो-यू की शांति। 6. वर्तमान में जीना।'
    real_world: मोबाइल और भागदौड़ के बीच कुछ देर बिना जल्दबाज़ी के चाय पीना या साँसों पर ध्यान देना वही 'झेन' वाली शांति देता है।
  picture:
    kind: compare
    columns:
    - title: गिन्नी का सोना
      points:
      - शुद्ध सोना = आदर्श
      - ताँबा = व्यावहारिकता
      - 'गांधीजी: व्यवहार को आदर्श तक उठाया'
    - title: झेन की देन
      points:
      - जापान की तेज़ ज़िंदगी
      - चा-नो-यू (टी-सेरेमनी)
      - वर्तमान ही सत्य
    alt: पहला प्रसंग आदर्श और व्यवहार की बात करता है; दूसरा जापान की चाय-विधि से वर्तमान में जीना सिखाता है।
  activity:
    type: sort
    prompt: '''गिन्नी का सोना'' प्रसंग में किसका प्रतीक क्या है?'
    bins:
    - शुद्ध सोना
    - ताँबा
    items:
    - label: शुद्ध आदर्श
      bin: शुद्ध सोना
      clue: कीमती और बिना मिलावट का क्या है?
      why: आदर्श शुद्ध सोने जैसे हैं।
    - label: समाज के शाश्वत मूल्य
      bin: शुद्ध सोना
      clue: ये मूल्य किन लोगों ने दिए?
      why: 'आदर्शवादी लोगों ने: सोना।'
    - label: व्यावहारिकता
      bin: ताँबा
      clue: जो मिलाने से चमक और मज़बूती बढ़ती है?
      why: व्यावहारिकता ताँबे जैसी है।
    - label: गिन्नी में मिली मज़बूती की धातु
      bin: ताँबा
      clue: गिन्नी का सोना शुद्ध सोने से अलग क्यों?
      why: उसमें थोड़ा ताँबा मिला होता है।
  lesson:
    - teach: '''पतझर में टूटी पत्तियाँ'' रवींद्र केलेकर के दो प्रसंग हैं। पहला, ''गिन्नी का सोना'': शुद्ध सोना अलग है और गिन्नी का सोना अलग। गिन्नी के सोने में थोड़ा ताँबा मिला होता है, इसलिए वह ज़्यादा चमकता और मज़बूत होता है; गहने उसी से बनते हैं। लेखक शुद्ध सोने को शुद्ध आदर्श और ताँबे को व्यावहारिकता का प्रतीक मानते हैं।'
      check:
        prompt: गिन्नी के सोने में क्या मिलाया जाता है?
        options:
        - ताँबा
        - चाँदी
        - लोहा
        answer: ताँबा
        why: इससे वह मज़बूत बनता है।
    - teach: '''प्रैक्टिकल आइडियलिस्ट'' आदर्शों में थोड़ा व्यवहार मिलाकर चलते हैं; पर कभी-कभी व्यवहार इतना हावी हो जाता है कि ताँबे में सोना नहीं, सोने में ताँबा बचता है। गांधीजी इसके उलट थे: वे व्यवहार को आदर्शों के स्तर पर चढ़ाते थे, सोने में ताँबा नहीं, ताँबे में सोना मिलाकर उसकी क़ीमत बढ़ाते थे। समाज के पास जो शाश्वत मूल्य हैं, वे आदर्शवादियों की देन हैं; व्यवहारवादी केवल लाभ-हानि देखकर आगे बढ़ते हैं।'
      picture:
        kind: compare
        columns:
        - title: गिन्नी का सोना
          points:
          - शुद्ध सोना = आदर्श
          - ताँबा = व्यवहार
          - 'गांधीजी: व्यवहार को आदर्श तक उठाया'
        - title: झेन की देन
          points:
          - जापानियों में मानसिक तनाव
          - चा-नो-यू में शांति
          - वर्तमान ही सत्य
        alt: 'पाठ के दो प्रसंग: गिन्नी का सोना में आदर्श और व्यवहार की बात है, झेन की देन में चा-नो-यू की शांति और वर्तमान में जीने की सीख है।'
      check:
        prompt: गांधीजी ने व्यवहार और आदर्श के साथ क्या किया?
        options:
        - व्यवहार को आदर्श के स्तर पर उठाया
        - आदर्श छोड़ दिए
        - केवल व्यवहार अपनाया
        answer: व्यवहार को आदर्श के स्तर पर उठाया
        why: वे ताँबे में सोना मिलाते थे।
    - teach: 'दूसरा प्रसंग, ''झेन की देन'': जापान में लोग अमेरिका से होड़ में एक महीने का काम एक दिन में करना चाहते हैं, इसलिए बहुत से लोग मानसिक रोगों से पीड़ित हैं। लेखक का मित्र उन्हें ''टी-सेरेमनी'' (चा-नो-यू) में ले गया: एक शांत पर्णकुटी, जहाँ चाजीन बड़ी नज़ाकत से चाय बनाता है और तीन से अधिक लोग नहीं बैठते। धीरे-धीरे दो-दो घूँट चाय पीते हुए लेखक को लगा कि वे अनंत काल में जी रहे हैं। सीख: भूत और भविष्य मिथ्या हैं; वर्तमान ही सत्य है।'
      check:
        prompt: चा-नो-यू में एक साथ अधिकतम कितने लोग बैठते हैं?
        options:
        - तीन
        - दस
        - बीस
        answer: तीन
        why: शांति बनाए रखने के लिए।
  items:
  - prompt: '''पतझर में टूटी पत्तियाँ'' के लेखक कौन हैं?'
    options:
    - रवींद्र केलेकर
    - रवींद्रनाथ ठाकुर
    - लीलाधर मंडलोई
    - प्रह्लाद अग्रवाल
    answer: रवींद्र केलेकर
    difficulty: 1
    hints:
    - कोंकणी और हिंदी के लेखक।
    - नाम ठाकुर से मिलता-जुलता है, पर वे नहीं।
    solution: रवींद्र केलेकर।
    mistakes:
      रवींद्रनाथ ठाकुर: hin10b_author
  - prompt: गिन्नी के सोने में क्या मिला होता है?
    options:
    - ताँबा
    - चाँदी
    - लोहा
    - पीतल
    answer: ताँबा
    difficulty: 1
    hints:
    - इससे सोना मज़बूत और चमकीला होता है।
    - लाल रंग की धातु।
    solution: थोड़ा-सा ताँबा।
    mistakes: {"चाँदी": "h10b_ginni"}
  - prompt: लेखक ने शुद्ध सोने को किसका प्रतीक माना है?
    options:
    - शुद्ध आदर्श
    - व्यावहारिकता
    - धन
    - जापान
    answer: शुद्ध आदर्श
    difficulty: 2
    hints:
    - ताँबा = व्यावहारिकता।
    - तो सोना?
    solution: शुद्ध सोना शुद्ध आदर्शों का प्रतीक है।
    mistakes:
      व्यावहारिकता: hin10b_poem_meaning
  - prompt: गांधीजी ने आदर्श और व्यवहार के बारे में क्या किया?
    options:
    - व्यवहार को आदर्शों के स्तर पर चढ़ाया
    - आदर्शों को व्यवहार के स्तर पर उतारा
    - केवल आदर्शों की बात की
    - व्यवहार छोड़ दिया
    answer: व्यवहार को आदर्शों के स्तर पर चढ़ाया
    difficulty: 3
    hints:
    - सोने में ताँबा नहीं, ताँबे में सोना।
    - वे दूसरे व्यावहारिक लोगों से अलग थे।
    solution: गांधीजी ने व्यवहार को ऊपर उठाकर आदर्शों तक पहुँचाया।
    mistakes:
      आदर्शों को व्यवहार के स्तर पर उतारा: hin10b_poem_meaning
  - prompt: जापान की चाय-विधि (टी-सेरेमनी) को क्या कहते हैं?
    options:
    - चा-नो-यू
    - झेन
    - चाजीन
    - सुशी
    answer: चा-नो-यू
    difficulty: 2
    hints:
    - चाजीन तो परोसने वाला है।
    - झेन एक दर्शन है।
    solution: चा-नो-यू।
    mistakes:
      चाजीन: hin10b_read_again
  - prompt: '''झेन की देन'' प्रसंग की मुख्य सीख क्या है?'
    options:
    - वर्तमान ही सत्य है, उसी में जीना चाहिए
    - चाय सेहत के लिए अच्छी है
    - जापान अमेरिका से आगे है
    - काम तेज़ी से करना चाहिए
    answer: वर्तमान ही सत्य है, उसी में जीना चाहिए
    difficulty: 2
    hints:
    - भूत और भविष्य मिथ्या।
    - अनंतकाल का अनुभव।
    solution: भूत-भविष्य की चिंता छोड़कर वर्तमान में शांति से जीना।
    mistakes:
      काम तेज़ी से करना चाहिए: hin10b_poem_meaning
  - prompt: गहने गिन्नी के सोने से क्यों बनाए जाते हैं?
    options:
