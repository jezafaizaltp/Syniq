    - वह नरम होता है
    answer: वह ज़्यादा चमकदार और मज़बूत होता है
    difficulty: 2
    hints:
    - ताँबा मिलाने से गुण बदलता है।
    - शुद्ध सोना बहुत नरम होता है।
    solution: ताँबा मिलने से गिन्नी का सोना चमकदार और मज़बूत बनता है।
    mistakes:
      वह नरम होता है: h10bs13_tulna
  - prompt: लेखक के अनुसार समाज के शाश्वत मूल्य किसकी देन हैं?
    options:
    - आदर्शवादी लोगों की
    - व्यवहारवादी लोगों की
    - व्यापारियों की
    - राजाओं की
    answer: आदर्शवादी लोगों की
    difficulty: 2
    hints:
    - जो सिद्धांतों पर अडिग रहे।
    - व्यवहारवादी लाभ-हानि देखते हैं।
    solution: समाज के शाश्वत मूल्य आदर्शवादियों ने दिए हैं।
    mistakes:
      व्यवहारवादी लोगों की: h10bs13_tulna
  - prompt: व्यवहारवादी लोगों की क्या विशेषता लेखक बताते हैं?
    options:
    - वे हर कदम पर लाभ-हानि का हिसाब लगाकर चलते हैं
    - वे कभी आगे नहीं बढ़ते
    - वे आदर्शों के लिए सब त्याग देते हैं
    - वे बहुत भोले होते हैं
    answer: वे हर कदम पर लाभ-हानि का हिसाब लगाकर चलते हैं
    difficulty: 2
