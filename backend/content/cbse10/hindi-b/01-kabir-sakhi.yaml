# CBSE Class 10 Hindi B (NCERT Sparsh 2). Chapter numbers here are SYNiq's own order.
# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hinb
chapter: 1
title: साखी
tips:
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_nindak: "निंदक हमारी कमियाँ बताता है। इससे हमारे स्वभाव पर क्या असर होता है?"
  h10b_sakhi: "'साखी' शब्द 'साक्षी' से बना है। साक्षी का अर्थ गवाह होता है।"
  h10bs1_doha: 'हर साखी में एक अलग सीख है: मीठी वाणी, भीतर का ईश्वर, अहंकार, विरह, निंदक, प्रेम, और मोह त्याग। प्रश्न किस साखी का है?'
  h10bs1_pratik: कबीर रोज़ की चीज़ों को प्रतीक बनाते हैं। सोचो कि चीज़ जीवन या भक्ति की किस बात की ओर इशारा करती है।
concepts:
- code: hin10b.s1.sakhi
  title: साखी (कबीर)
  notes: |
    कबीर की साखियाँ: 'साखी' का अर्थ है साक्षी, यानी अपनी आँखों देखा सच। भाषा सधुक्कड़ी (कई बोलियों का मेल)।
    मुख्य साखियाँ: ऐसी बाँणी बोलिए, मन का आपा खोइ (मीठी वाणी से अपना और दूसरों का मन शीतल); कस्तूरी कुंडलि बसै,
    मृग ढूँढै बन माँहि (ईश्वर मन के भीतर है, मनुष्य बाहर ढूँढता है); जब मैं था तब हरि नहीं, अब हरि हैं मैं नाँहि
    (अहंकार मिटा तो ईश्वर मिले; दीपक = ज्ञान, अँधियारा = अज्ञान); सुखिया सब संसार है, खायै अरु सोवै, दुखिया दास
    कबीर है, जागै अरु रोवै; बिरह भुवंगम तन बसै, मंत्र न लागै कोइ; निंदक नेड़ा राखिये, आँगणि कुटी बँधाइ (निंदक बिना
    साबुन-पानी के स्वभाव निर्मल करता है); पोथी पढ़ि पढ़ि जग मुवा, पंडित भया न कोइ, ऐकै अषिर पीव का पढ़ै सु पंडित
    होइ (प्रेम का एक अक्षर ही सच्चा ज्ञान); हम घर जाल्या आपणाँ (मोह-माया का घर जलाकर ही ज्ञान का मार्ग)।
  explanations:
    text: कबीर कहते हैं कि मीठी वाणी बोलो, अहंकार छोड़ो, और ईश्वर को बाहर नहीं, अपने मन में खोजो, जैसे हिरण कस्तूरी अपनी नाभि में होते हुए भी जंगल में ढूँढता है। निंदक को पास रखो, वह स्वभाव निर्मल करता है। बहुत पोथियाँ पढ़ने से नहीं, प्रेम का एक अक्षर समझने से मनुष्य ज्ञानी बनता है।
    visual: 'दो चित्र साथ रखिए: जंगल में भटकता हिरण, जिसकी अपनी नाभि में कस्तूरी चमक रही है; और अँधेरे कमरे में जलता दीपक। पहला बताता है ईश्वर कहाँ है, दूसरा बताता है कि ज्ञान आने पर अज्ञान कैसे मिटता है।'
    step_by_step: '1. साखी = आँखों देखा सच। 2. मीठी वाणी। 3. कस्तूरी और हिरण: ईश्वर भीतर। 4. ''मैं'' मिटे तो हरि मिलें; दीपक = ज्ञान। 5. निंदक पास रखो। 6. पोथी नहीं, प्रेम का एक अक्षर।'
    real_world: कोई हमारी कमी बताए तो बुरा लगता है, पर कबीर कहते हैं ऐसा व्यक्ति हमें बिना साबुन-पानी के बेहतर बना देता है।
  picture:
    kind: compare
    columns:
    - title: कबीर क्या छोड़ने को कहते हैं
      points:
      - अहंकार ('मैं')
      - कड़वी वाणी
      - केवल पोथी-ज्ञान
    - title: कबीर क्या अपनाने को कहते हैं
      points:
      - मीठी वाणी
      - मन के भीतर ईश्वर
      - प्रेम का एक अक्षर
    alt: कबीर अहंकार, कड़वी वाणी और केवल किताबी ज्ञान छोड़ने, और मीठी वाणी, भीतर के ईश्वर और प्रेम को अपनाने को कहते हैं।
  activity:
    type: sort
    prompt: साखी में किस चीज़ का प्रतीक क्या है?
    bins:
    - ईश्वर या ज्ञान
    - अज्ञान या अहंकार
    - मनुष्य
    items:
    - label: कस्तूरी
      bin: ईश्वर या ज्ञान
      clue: जो मृग की नाभि में ही है, पर वह बाहर ढूँढ़ता है?
      why: कस्तूरी = ईश्वर, जो मन के भीतर है।
    - label: मृग
      bin: मनुष्य
      clue: वन-वन कौन भटकता है?
      why: मृग = मनुष्य, जो ईश्वर को बाहर ढूँढ़ता है।
    - label: दीपक
      bin: ईश्वर या ज्ञान
      clue: दीपक के जलने से अँधेरे का क्या होता है?
      why: दीपक = ज्ञान, जिससे अज्ञान मिटता है।
    - label: अँधियारा
      bin: अज्ञान या अहंकार
      clue: दीपक जलने पर क्या मिट जाता है?
      why: अँधियारा = अज्ञान।
    - label: '"जब मैं था" का ''मैं'''
      bin: अज्ञान या अहंकार
      clue: '''मैं'' के रहते हरि क्यों नहीं मिले?'
      why: '''मैं'' = अहंकार; वह मिटा तो हरि मिले।'
    - label: पीव (प्रिय) का एक अक्षर
      bin: ईश्वर या ज्ञान
      clue: पोथी पढ़ने से बड़ा ज्ञान कौन-सा है?
      why: प्रेम का एक अक्षर ही सच्चा ज्ञान है।
  lesson:
    - teach: 'कबीर निर्गुण भक्ति के संत कवि थे। ''साखी'' का अर्थ है साक्षी, यानी आँखों देखा सच। उनकी भाषा ''सधुक्कड़ी'' या ''पंचमेल खिचड़ी'' कहलाती है। पहली साखी: ''ऐसी बाँणी बोलिए, मन का आपा खोइ। अपना तन सीतल करै, औरन कौं सुख होइ॥'' अहंकार छोड़कर मीठी वाणी बोलने से अपना मन शांत होता है और सुनने वाले को सुख मिलता है।'
      check:
        prompt: मीठी वाणी बोलने से क्या लाभ है?
        options:
        - अपना मन शीतल होता है और दूसरों को सुख मिलता है
        - धन मिलता है
        - लोग डरते हैं
        answer: अपना मन शीतल होता है और दूसरों को सुख मिलता है
        why: दोनों को लाभ होता है।
    - teach: '''कस्तूरी कुंडलि बसै, मृग ढूँढै बन माँहि'' — कस्तूरी हिरण की अपनी नाभि में होती है, पर वह उसे जंगल में ढूँढता है; वैसे ही ईश्वर हर हृदय में है, पर लोग उसे बाहर खोजते हैं। ''जब मैं था तब हरि नहीं'' — जब तक अहंकार था, ईश्वर नहीं मिला; ज्ञान के दीपक से अहंकार का अँधेरा मिट गया। ''निंदक नेड़ा राखिये'' — निंदक को पास रखो, वह बिना साबुन-पानी के स्वभाव निर्मल कर देता है।'
      picture:
        kind: compare
        columns:
        - title: प्रतीक
          points:
          - कस्तूरी
          - दीपक
          - निंदक
        - title: अर्थ
          points:
          - मन में बसा ईश्वर
          - ज्ञान, जो अहंकार मिटाए
          - दोष दिखाने वाला, जो सुधारे
        alt: 'कबीर की साखियों के प्रतीक और अर्थ: कस्तूरी मन में बसा ईश्वर, दीपक ज्ञान जो अहंकार मिटाए, निंदक जो दोष दिखाकर सुधारे।'
      check:
        prompt: कस्तूरी हिरण के उदाहरण से क्या बात समझाई गई है?
        options:
        - ईश्वर हमारे भीतर है, हम बाहर ढूँढते हैं
        - हिरण बहुत तेज़ दौड़ता है
        - जंगल में ख़ुशबू है
        answer: ईश्वर हमारे भीतर है, हम बाहर ढूँढते हैं
        why: कस्तूरी हिरण की अपनी नाभि में होती है।
    - teach: '''पोथी पढ़ि पढ़ि जग मुवा, पंडित भया न कोइ। ऐकै अषिर पीव का, पढ़ै सु पंडित होइ॥'' किताबें पढ़कर कोई ज्ञानी नहीं बनता; प्रेम का एक अक्षर पढ़ने वाला ही सच्चा ज्ञानी है। ''सुखिया सब संसार है, खायै अरु सोवै'' — संसार खा-सोकर सुखी है, पर कबीर ईश्वर के लिए जागते और रोते हैं। अंतिम साखी में कबीर ने ''घर'' (मोह-माया) जला दिया और साथ चलने वालों का घर जलाने को तैयार हैं।'
      check:
        prompt: कबीर के अनुसार सच्चा ज्ञानी कौन है?
        options:
        - जो प्रेम का एक अक्षर पढ़ ले
        - जो बहुत किताबें पढ़े
        - जो धनी हो
        answer: जो प्रेम का एक अक्षर पढ़ ले
        why: प्रेम ही सच्चा ज्ञान है।
  items:
  - prompt: '''साखी'' के रचनाकार कौन हैं?'
    options:
    - कबीर
    - मीराबाई
    - तुलसीदास
    - सूरदास
    answer: कबीर
    difficulty: 1
    hints:
    - निर्गुण संत कवि।
    - बनारस के जुलाहे।
    solution: कबीर।
    mistakes:
      मीराबाई: hin10b_author
  - prompt: '''साखी'' शब्द का अर्थ क्या है?'
    options:
    - साक्षी या आँखों देखा सच
    - सखी या सहेली
    - गीत
    - कहानी
    answer: साक्षी या आँखों देखा सच
    difficulty: 1
    hints:
    - यह 'साक्षी' से बना है।
    - कबीर ने जो खुद अनुभव किया।
    solution: साखी = साक्षी, प्रत्यक्ष अनुभव से कही गई बात।
    mistakes: {"सखी या सहेली": "h10b_sakhi"}
  - prompt: कस्तूरी और हिरण के उदाहरण से कबीर क्या कहना चाहते हैं?
    options:
    - ईश्वर मन के भीतर है, पर मनुष्य उसे बाहर ढूँढता है
    - हिरण बहुत तेज़ दौड़ता है
    - जंगल में कस्तूरी मिलती है
    - हिरण को सुगंध पसंद है
    answer: ईश्वर मन के भीतर है, पर मनुष्य उसे बाहर ढूँढता है
    difficulty: 2
    hints:
    - कस्तूरी कहाँ है?
    - हिरण उसे कहाँ ढूँढता है?
    solution: कस्तूरी हिरण की नाभि में है, वैसे ही ईश्वर मनुष्य के मन में है।
    mistakes:
      जंगल में कस्तूरी मिलती है: hin10b_poem_meaning
  - prompt: निंदक को पास रखने से क्या लाभ होता है?
    options:
    - वह बिना साबुन-पानी के स्वभाव निर्मल कर देता है
    - वह हमारी प्रशंसा करता है
    - वह घर साफ़ करता है
    - वह धन देता है
    answer: वह बिना साबुन-पानी के स्वभाव निर्मल कर देता है
    difficulty: 2
    hints:
    - निंदक हमारी कमियाँ बताता है।
    - स्वभाव की सफ़ाई।
    solution: निंदक हमारी कमियाँ दिखाता है, जिससे हम अपना स्वभाव सुधारते हैं।
    mistakes: {"वह हमारी प्रशंसा करता है": "h10b_nindak"}
  - prompt: '''जब मैं था तब हरि नहीं'' में ''मैं'' किसका प्रतीक है?'
    options:
    - अहंकार
    - कवि का शरीर
    - ईश्वर
    - संसार
    answer: अहंकार
    difficulty: 2
    hints:
    - '''मैं'' मिटा तो हरि मिले।'
    - घमंड।
    solution: '''मैं'' अहंकार है; अहंकार मिटने पर ही ईश्वर मिलते हैं।'
    mistakes:
      ईश्वर: hin10b_poem_meaning
  - prompt: कबीर के अनुसार सच्चा पंडित कौन है?
    options:
    - जो प्रेम का एक अक्षर पढ़ ले
    - जो बहुत पोथियाँ पढ़े
    - जो संस्कृत जाने
    - जो मंदिर में रहे
    answer: जो प्रेम का एक अक्षर पढ़ ले
    difficulty: 3
    hints:
    - '''पोथी पढ़ि पढ़ि जग मुवा।'''
    - '''पीव'' का अर्थ प्रिय।'
    solution: प्रेम का एक अक्षर समझने वाला ही सच्चा ज्ञानी है, केवल पोथी पढ़ने वाला नहीं।
    mistakes:
      जो बहुत पोथियाँ पढ़े: hin10b_poem_meaning
  - prompt: कबीर की भाषा को क्या कहा जाता है?
    options:
    - सधुक्कड़ी (पंचमेल खिचड़ी)
    - शुद्ध संस्कृत
    - अवधी
    - खड़ी बोली
    answer: सधुक्कड़ी (पंचमेल खिचड़ी)
    difficulty: 2
    hints:
    - कई बोलियों का मेल।
    - साधुओं की भाषा।
    solution: कबीर की भाषा सधुक्कड़ी या पंचमेल खिचड़ी कहलाती है।
    mistakes:
      अवधी: hin10b_author
  - prompt: '''मन का आपा खोइ'' का क्या अर्थ है?'
    options:
    - मन का अहंकार छोड़कर
    - मन को खो देना
    - मन से भूल जाना
    - मन से खेलना
    answer: मन का अहंकार छोड़कर
    difficulty: 2
    hints:
    - '''आपा'' यानी अपनापन, घमंड।'
    - मीठी वाणी के लिए ज़रूरी।
    solution: मन का अहंकार त्यागकर बोलने को कहा गया है।
    mistakes:
      मन को खो देना: h10bs1_pratik
  - prompt: '''सब अँधियारा मिटि गया, जब दीपक देख्या माँहि'' में ''दीपक'' किसका प्रतीक है?'
    options:
    - ज्ञान
    - आग
    - सूरज
    - धन
    answer: ज्ञान
    difficulty: 2
    hints:
    - अँधेरा अज्ञान और अहंकार है।
    - भीतर का प्रकाश।
    solution: दीपक ज्ञान का प्रतीक है, जो अहंकार का अँधेरा मिटाता है।
    mistakes:
      सूरज: h10bs1_pratik
  - prompt: कबीर संसार को सुखी और स्वयं को दुखी क्यों कहते हैं?
    options:
    - संसार खा-सोकर संतुष्ट है, कबीर ईश्वर की चिंता में जागते हैं
    - कबीर ग़रीब थे
    - संसार अमीर है
    - कबीर बीमार थे
    answer: संसार खा-सोकर संतुष्ट है, कबीर ईश्वर की चिंता में जागते हैं
    difficulty: 2
    hints:
    - '''खायै अरु सोवै'' और ''जागै अरु रोवै''।'
    - कबीर ईश्वर से मिलन चाहते हैं।
    solution: संसार भौतिक सुख में मग्न है; कबीर प्रभु-विरह में जागते-रोते हैं।
    mistakes:
      कबीर ग़रीब थे: h10bs1_doha
  - prompt: '''बिरह भुवंगम तन बसै'' में विरह की तुलना किससे की गई है?'
    options:
    - साँप से
    - आग से
    - पानी से
    - पक्षी से
    answer: साँप से
    difficulty: 2
    hints:
    - '''भुवंगम'' का अर्थ याद करो।'
    - जिसका ज़हर किसी मंत्र से नहीं उतरता।
    solution: विरह को साँप (भुवंगम) कहा गया है जिस पर कोई मंत्र असर नहीं करता।
    mistakes:
      आग से: h10bs1_pratik
  - prompt: कबीर के अनुसार राम-वियोगी की क्या दशा होती है?
    options:
    - वह जीवित नहीं रहता, और रहे तो पागल-सा हो जाता है
    - वह बहुत ख़ुश रहता है
    - वह धनी हो जाता है
    - वह सो जाता है
    answer: वह जीवित नहीं रहता, और रहे तो पागल-सा हो जाता है
    difficulty: 3
    hints:
    - '''राम बियोगी ना जिवै, जिवै तो बौरा होइ''।'
    - '''बौरा'' का अर्थ पागल।'
    solution: प्रभु से बिछड़ा भक्त या तो जीवित नहीं रहता, या पागल-सा हो जाता है।
    mistakes:
      वह बहुत ख़ुश रहता है: h10bs1_doha
  - prompt: निंदक को कहाँ रखने की सलाह दी गई है?
    options:
    - आँगन में कुटिया बनाकर पास ही
    - दूर जंगल में
    - घर से बाहर
    - मंदिर में
    answer: आँगन में कुटिया बनाकर पास ही
    difficulty: 2
    hints:
    - '''आँगणि कुटी बँधाइ''।'
    - जितना पास, उतना लाभ।
    solution: कबीर निंदक को आँगन में कुटिया बनाकर पास रखने को कहते हैं।
    mistakes:
      दूर जंगल में: h10bs1_doha
  - prompt: अंतिम साखी में 'घर जलाने' का क्या अर्थ है?
    options:
    - मोह-माया और विषय-वासना को त्याग देना
    - सचमुच घर में आग लगाना
    - घर बेच देना
    - घर छोड़कर भाग जाना
    answer: मोह-माया और विषय-वासना को त्याग देना
    difficulty: 3
    hints:
    - कबीर ने ज्ञान की मशाल (मुराड़ा) हाथ में ली।
    - यह प्रतीकात्मक है।
    solution: घर जलाना यानी सांसारिक मोह-माया को ज्ञान से नष्ट करना।
    mistakes:
      सचमुच घर में आग लगाना: h10bs1_pratik
  - prompt: कबीर किस प्रकार की भक्ति के कवि थे?
    options:
    - निर्गुण भक्ति
    - सगुण कृष्ण भक्ति
    - सगुण राम भक्ति
    - देवी भक्ति
    answer: निर्गुण भक्ति
    difficulty: 1
    hints:
    - वे मूर्तिपूजा के विरोधी थे।
    - ईश्वर को निराकार मानते थे।
    solution: कबीर निर्गुण भक्ति धारा के संत कवि थे।
    mistakes:
      सगुण कृष्ण भक्ति: hin10b_author
