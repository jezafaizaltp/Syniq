# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hinb
chapter: 1
title: साखी
tips:
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_nindak: "निंदक हमारी कमियाँ बताता है। इससे हमारे स्वभाव पर क्या असर होता है?"
  h10b_sakhi: "'साखी' शब्द 'साक्षी' से बना है। साक्षी का अर्थ गवाह होता है।"
concepts:
- code: hin10b.s1.sakhi
  title: साखी (कबीर)
  notes: |
    कबीर की साखियाँ: 'साखी' का अर्थ है साक्षी, यानी अपनी आँखों देखा सच। भाषा सधुक्कड़ी (कई बोलियों का मेल)।
    मुख्य साखियाँ: ऐसी बाँणी बोलिए, मन का आपा खोइ (मीठी वाणी से अपना और दूसरों का मन शीतल); कस्तूरी कुंडलि बसै,
    मृग ढूँढै बन माँहि (ईश्वर मन के भीतर है, मनुष्य बाहर ढूँढता है); जब मैं था तब हरि नहीं, अब हरि हैं मैं नाँहि
    (अहंकार मिटा तो ईश्वर मिले; दीपक = ज्ञान, अँधियारा = अज्ञान); सुखिया सब संसार है, खायै अरु सोवै, दुखिया दास
    कबीर है, जागै अरु रोवै; बिरह भुवंगम तन बसै, मंत्र न लागै कोइ; निंदक नेड़ा राखिये, आँगणि कुटी बँधाइ (निंदक बिना
    साबुन-पानी के स्वभाव निर्मल करता है); पोथी पढ़ि पढ़ि जग मुवा, पंडित भया न कोइ, ऐकै अषिर पीव का पढ़ै सु पंडित
    होइ (प्रेम का एक अक्षर ही सच्चा ज्ञान); हम घर जाल्या आपणाँ (मोह-माया का घर जलाकर ही ज्ञान का मार्ग)।
  explanations:
    text: कबीर कहते हैं कि मीठी वाणी बोलो, अहंकार छोड़ो, और ईश्वर को बाहर नहीं, अपने मन में खोजो, जैसे हिरण कस्तूरी अपनी नाभि में होते हुए भी जंगल में ढूँढता है। निंदक को पास रखो, वह स्वभाव निर्मल करता है। बहुत पोथियाँ पढ़ने से नहीं, प्रेम का एक अक्षर समझने से मनुष्य ज्ञानी बनता है।
    visual: 'दो चित्र साथ रखिए: जंगल में भटकता हिरण, जिसकी अपनी नाभि में कस्तूरी चमक रही है; और अँधेरे कमरे में जलता दीपक। पहला बताता है ईश्वर कहाँ है, दूसरा बताता है कि ज्ञान आने पर अज्ञान कैसे मिटता है।'
    step_by_step: '1. साखी = आँखों देखा सच। 2. मीठी वाणी। 3. कस्तूरी और हिरण: ईश्वर भीतर। 4. ''मैं'' मिटे तो हरि मिलें; दीपक = ज्ञान। 5. निंदक पास रखो। 6. पोथी नहीं, प्रेम का एक अक्षर।'
    real_world: कोई हमारी कमी बताए तो बुरा लगता है, पर कबीर कहते हैं ऐसा व्यक्ति हमें बिना साबुन-पानी के बेहतर बना देता है।
  picture:
    kind: compare
    columns:
    - title: कबीर क्या छोड़ने को कहते हैं
      points:
      - अहंकार ('मैं')
      - कड़वी वाणी
      - केवल पोथी-ज्ञान
    - title: कबीर क्या अपनाने को कहते हैं
      points:
      - मीठी वाणी
      - मन के भीतर ईश्वर
      - प्रेम का एक अक्षर
    alt: कबीर अहंकार, कड़वी वाणी और केवल किताबी ज्ञान छोड़ने, और मीठी वाणी, भीतर के ईश्वर और प्रेम को अपनाने को कहते हैं।
  items:
  - prompt: '''साखी'' के रचनाकार कौन हैं?'
    options:
    - कबीर
    - मीराबाई
    - तुलसीदास
    - सूरदास
    answer: कबीर
    difficulty: 1
    hints:
    - निर्गुण संत कवि।
    - बनारस के जुलाहे।
    solution: कबीर।
    mistakes:
      मीराबाई: hin10b_author
  - prompt: '''साखी'' शब्द का अर्थ क्या है?'
    options:
    - साक्षी या आँखों देखा सच
    - सखी या सहेली
    - गीत
    - कहानी
    answer: साक्षी या आँखों देखा सच
    difficulty: 1
    hints:
    - यह 'साक्षी' से बना है।
    - कबीर ने जो खुद अनुभव किया।
    solution: साखी = साक्षी, प्रत्यक्ष अनुभव से कही गई बात।
    mistakes: {"सखी या सहेली": "h10b_sakhi"}
  - prompt: कस्तूरी और हिरण के उदाहरण से कबीर क्या कहना चाहते हैं?
    options:
    - ईश्वर मन के भीतर है, पर मनुष्य उसे बाहर ढूँढता है
    - हिरण बहुत तेज़ दौड़ता है
    - जंगल में कस्तूरी मिलती है
    - हिरण को सुगंध पसंद है
    answer: ईश्वर मन के भीतर है, पर मनुष्य उसे बाहर ढूँढता है
    difficulty: 2
    hints:
    - कस्तूरी कहाँ है?
    - हिरण उसे कहाँ ढूँढता है?
    solution: कस्तूरी हिरण की नाभि में है, वैसे ही ईश्वर मनुष्य के मन में है।
    mistakes:
      जंगल में कस्तूरी मिलती है: hin10b_poem_meaning
  - prompt: निंदक को पास रखने से क्या लाभ होता है?
    options:
    - वह बिना साबुन-पानी के स्वभाव निर्मल कर देता है
    - वह हमारी प्रशंसा करता है
    - वह घर साफ़ करता है
    - वह धन देता है
    answer: वह बिना साबुन-पानी के स्वभाव निर्मल कर देता है
    difficulty: 2
    hints:
    - निंदक हमारी कमियाँ बताता है।
    - स्वभाव की सफ़ाई।
    solution: निंदक हमारी कमियाँ दिखाता है, जिससे हम अपना स्वभाव सुधारते हैं।
    mistakes: {"वह हमारी प्रशंसा करता है": "h10b_nindak"}
  - prompt: '''जब मैं था तब हरि नहीं'' में ''मैं'' किसका प्रतीक है?'
    options:
    - अहंकार
    - कवि का शरीर
    - ईश्वर
    - संसार
    answer: अहंकार
    difficulty: 2
    hints:
    - '''मैं'' मिटा तो हरि मिले।'
    - घमंड।
    solution: '''मैं'' अहंकार है; अहंकार मिटने पर ही ईश्वर मिलते हैं।'
    mistakes:
      ईश्वर: hin10b_poem_meaning
  - prompt: कबीर के अनुसार सच्चा पंडित कौन है?
    options:
    - जो प्रेम का एक अक्षर पढ़ ले
    - जो बहुत पोथियाँ पढ़े
    - जो संस्कृत जाने
    - जो मंदिर में रहे
    answer: जो प्रेम का एक अक्षर पढ़ ले
    difficulty: 3
    hints:
    - '''पोथी पढ़ि पढ़ि जग मुवा।'''
    - '''पीव'' का अर्थ प्रिय।'
    solution: प्रेम का एक अक्षर समझने वाला ही सच्चा ज्ञानी है, केवल पोथी पढ़ने वाला नहीं।
    mistakes:
      जो बहुत पोथियाँ पढ़े: hin10b_poem_meaning
