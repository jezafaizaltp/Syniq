subject: cbse10-hinb
chapter: 8
title: बड़े भाई साहब
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_ant: "अंत में भाई साहब के भीतर का बच्चा जाग उठता है। एक कटी पतंग उड़ती आ रही थी।"
  h10b_patang: "किताबें तो बड़े भाई के हाथ में रहती थीं। छोटा भाई मैदान और आसमान की ओर भागता था।"
  h10b_ravan: "भाई साहब ने एक बहुत बलवान राजा का उदाहरण दिया जो अहंकार के कारण नष्ट हो गया।"
  h10bs8_bhai: 'दोनों भाई बिल्कुल अलग हैं: बड़े भाई हर समय पढ़ते और उपदेश देते, छोटे भाई खेलते-कूदते। बात किस भाई के बारे में है?'
  h10bs8_kram: 'कहानी परीक्षा-परिणामों के साथ आगे बढ़ती है: पहले साल, दूसरे साल, फिर पतंग वाला अंत। घटना किस मोड़ पर है?'
concepts:
- code: hin10b.s8.bhaisahab
  title: बड़े भाई साहब (प्रेमचंद)
  notes: |
    प्रेमचंद की कहानी, छोटे भाई की ज़ुबानी। बड़े भाई साहब उससे पाँच साल बड़े, पर केवल तीन दरजे आगे। वे हर समय किताबें
    खोले बैठे रहते, कॉपी के हाशियों पर चिड़ियों, कुत्तों, बिल्लियों की तस्वीरें बनाते, और फिर भी फेल हो जाते। छोटा भाई
    पढ़ाई से ज़्यादा खेल में मन लगाता: गुल्ली-डंडा, कंकरियाँ उछालना, पतंग (कनकौए) उड़ाना, फिर भी हर साल अव्वल पास होता।
    बड़े भाई साहब लंबे उपदेश देते: अंग्रेज़ी, इतिहास (बादशाहों के नाम), ज्यामिति की कठिनाई; घमंड पर रावण का उदाहरण।
    छोटा भाई पास होने पर घमंडी और लापरवाह होने लगता है। अंत में बड़े भाई साहब समझाते हैं कि किताबी ज्ञान से बड़ा
    जीवन का अनुभव है (अम्माँ-दादा का उदाहरण), वे बड़े होने के नाते अपना अधिकार और ज़िम्मेदारी जताते हैं, और खुद भी
    पतंग उड़ाने की इच्छा मानते हैं। उसी समय एक कटी पतंग आती है, बड़े भाई साहब लंबे होने के कारण उसकी डोर पकड़ लेते
    हैं और होस्टल की ओर दौड़ पड़ते हैं; छोटा भाई पीछे-पीछे।
  explanations:
    text: बड़े भाई साहब हर समय पढ़ते रहते पर फेल हो जाते, जबकि छोटा भाई खेलते-कूदते भी पास हो जाता। बड़े भाई उसे उपदेश देते, घमंड से बचने को कहते। अंत में वे बताते हैं कि अनुभव किताबों से बड़ा है, और बड़े होने के कारण वे अपनी इच्छाएँ दबाकर छोटे भाई के लिए आदर्श बने रहते हैं। फिर दोनों मिलकर कटी पतंग के पीछे दौड़ पड़ते हैं।
    visual: 'दो भाइयों का चित्र: एक मेज़ पर किताबों के ढेर के पीछे, कॉपी के हाशिये पर चिड़ियाँ बनाते बड़े भाई; दूसरा मैदान में पतंग उड़ाता छोटा भाई। आख़िरी चित्र: कटी पतंग की डोर पकड़कर दौड़ते बड़े भाई साहब।'
    step_by_step: '1. पाँच साल बड़े, तीन दरजे आगे। 2. बड़े भाई की रटंत पढ़ाई, फिर भी फेल। 3. छोटे का खेल, फिर भी अव्वल। 4. उपदेश: अंग्रेज़ी, इतिहास, ज्यामिति, घमंड पर रावण। 5. अनुभव का महत्व। 6. पतंग की डोर पकड़कर दौड़ना।'
    real_world: घर के बड़े भाई-बहन अक्सर अपनी इच्छाएँ दबाकर छोटों के सामने अच्छा उदाहरण बनने की कोशिश करते हैं; यह कहानी उसी ज़िम्मेदारी की है।
  picture:
    kind: compare
    columns:
    - title: बड़े भाई साहब
      points:
      - हर समय किताबें
      - रटंत पढ़ाई
      - बार-बार फेल
      - अनुभव को बड़ा मानते
    - title: छोटा भाई
      points:
      - खेल-कूद, पतंग
      - कम पढ़ाई
      - हर साल अव्वल
      - पास होकर घमंड
    alt: बड़े भाई साहब बहुत पढ़कर भी फेल होते हैं; छोटा भाई खेलकर भी अव्वल आता है।
  activity:
    type: sort
    prompt: कहानी में यह बड़े भाई साहब के बारे में है या छोटे भाई के?
    bins:
    - बड़े भाई साहब
    - छोटा भाई
    items:
    - label: हर समय किताबें खोले बैठे, फिर भी फेल
      bin: बड़े भाई साहब
      clue: पाँच साल बड़े, पर तीन दरजे आगे कौन?
      why: बड़े भाई साहब मेहनत करते पर फेल होते।
    - label: हाशियों पर चिड़ियों-बिल्लियों की तस्वीरें
      bin: बड़े भाई साहब
      clue: पढ़ाई के समय कॉपी पर चित्र कौन बनाता?
      why: बड़े भाई साहब ऐसा करते थे।
    - label: लंबे उपदेश, रावण का उदाहरण
      bin: बड़े भाई साहब
      clue: घमंड पर कौन समझाता है?
      why: बड़े भाई साहब के उपदेश।
    - label: गुल्ली-डंडा और कनकौए, फिर भी अव्वल
      bin: छोटा भाई
      clue: खेलकर भी कौन पास होता?
      why: छोटा भाई खेल में मन लगाकर भी अव्वल।
    - label: पास होकर घमंडी और लापरवाह
      bin: छोटा भाई
      clue: अव्वल आने पर किसका सिर फिरने लगा?
      why: छोटे भाई में घमंड आने लगा।
    - label: लंबे होने से कटी पतंग की डोर पकड़ी
      bin: बड़े भाई साहब
      clue: अंत में ऊँचाई का फ़ायदा किसे मिला?
      why: बड़े भाई साहब डोर पकड़कर दौड़ पड़े।
  lesson:
    - teach: '''बड़े भाई साहब'' प्रेमचंद की कहानी है। दोनों भाई हॉस्टल में रहकर पढ़ते हैं। बड़े भाई छोटे भाई से पाँच साल बड़े हैं, पर केवल तीन कक्षा आगे हैं। वे हर समय किताबें खोले बैठे रहते, हाशियों पर चित्र बनाते और शब्द दोहराते। छोटा भाई खेल, गुल्ली-डंडा और पतंगबाज़ी का शौकीन है। बड़े भाई उसे लंबे-लंबे उपदेश देकर डाँटते रहते हैं।'
      check:
        prompt: बड़े भाई छोटे भाई से कितनी कक्षा आगे थे?
        options:
        - तीन
        - पाँच
        - एक
        answer: तीन
        why: वे पाँच साल बड़े थे, पर कुछ बार फ़ेल हो चुके थे।
      ways:
      - style: visual
        teach: दोनों भाइयों का स्वभाव और दिनचर्या, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: बड़े भाई साहब
            points:
            - हर समय किताब खोले रहते
            - रटते और हाशियों पर चित्र बनाते
            - उपदेश देते रहते
          - title: छोटा भाई
            points:
            - खेल का शौकीन
            - गुल्ली-डंडा और पतंगबाज़ी
            - डाँट सुनता रहता
          alt: बड़े भाई साहब हर समय किताब खोले रहते, रटते, हाशियों पर चित्र बनाते और उपदेश देते; छोटा भाई खेल, गुल्ली-डंडा और पतंगबाज़ी का शौकीन है और डाँट सुनता रहता है।
      - style: real_world
        teach: कई घरों में बड़े भाई-बहन को कहा जाता है, 'तुम बड़े हो, उदाहरण बनो।' प्रेमचंद की कहानी दिखाती है कि यह ज़िम्मेदारी कभी-कभी बड़े भाई के बचपन को भी दबा देती है।
    - teach: 'सालाना परीक्षा में बड़े भाई फ़ेल हो गए और छोटा भाई प्रथम आया। छोटे भाई का घमंड बढ़ा तो बड़े भाई ने समझाया कि घमंड ने रावण जैसे राजा को भी नष्ट कर दिया। उन्होंने पढ़ाई की कठिनाइयाँ बताईं: अंग्रेज़ी, इतिहास के बादशाहों के नाम, ज्यामिति, और ''समय की पाबंदी'' जैसे निबंध। अगले साल फिर बड़े भाई फ़ेल हुए और छोटा भाई प्रथम आया; अब दोनों में एक ही कक्षा का अंतर रह गया।'
      picture:
        kind: flow
        steps:
        - बड़े भाई पढ़ते, छोटा खेलता
        - 'पहला साल: बड़े फ़ेल, छोटा प्रथम'
        - रावण वाला उपदेश
        - 'दूसरा साल: फिर वही'
        - पतंग की डोर पकड़कर दौड़
        alt: 'कहानी का क्रम: बड़े भाई पढ़ते और छोटा खेलता है, पहले साल बड़े फ़ेल और छोटा प्रथम, घमंड पर उपदेश, दूसरे साल फिर वही, और अंत में बड़े भाई पतंग की डोर पकड़कर दौड़ते हैं।'
      check:
        prompt: घमंड के बारे में समझाते हुए बड़े भाई ने किसका उदाहरण दिया?
        options:
        - रावण का
        - अकबर का
        - अर्जुन का
        answer: रावण का
        why: घमंड ने उसका नाश कर दिया।
      ways:
      - style: step_by_step
        teach: 'पहला: सालाना परीक्षा का नतीजा आता है। दूसरा: बड़े भाई फ़ेल होते हैं, छोटा भाई प्रथम आता है। तीसरा: छोटे भाई में घमंड आता है, तो बड़े भाई रावण का उदाहरण देकर समझाते हैं। चौथा: अगले साल भी यही होता है और दोनों के बीच सिर्फ़ एक कक्षा का अंतर बचता है।'
      - style: real_world
        teach: कोई विद्यार्थी हर पाठ रटता है पर अर्थ नहीं समझता, तो प्रश्न थोड़ा बदलते ही अटक जाता है। बड़े भाई साहब की असफलता के पीछे भी यही रटने की आदत दिखाई देती है।
    - teach: अंत में बड़े भाई स्वीकार करते हैं कि उनका भी मन खेलने और पतंग उड़ाने को करता है, पर बड़ा होने के नाते उन्हें आदर्श बनना पड़ता है। वे कहते हैं कि किताबी ज्ञान से बड़ा जीवन का अनुभव है, और अम्माँ-दादा कम पढ़े होकर भी घर बेहतर चलाते हैं। तभी एक कटी पतंग ऊपर से गुज़रती है; लंबे बड़े भाई उछलकर उसकी डोर पकड़ लेते हैं और हॉस्टल की ओर दौड़ पड़ते हैं, छोटा भाई पीछे-पीछे।
      check:
        prompt: बड़े भाई अपनी इच्छाएँ क्यों दबाते थे?
        options:
        - छोटे भाई के सामने अच्छा उदाहरण बनने के लिए
        - उन्हें खेल पसंद नहीं था
        - वे बीमार थे
        answer: छोटे भाई के सामने अच्छा उदाहरण बनने के लिए
        why: बड़े होने की ज़िम्मेदारी।
      ways:
      - style: visual
        teach: 'कहानी का अंत: बड़े भाई का मन कैसे खुल जाता है, क्रम से।'
        picture:
          kind: flow
          steps:
          - बड़े भाई अपने मन की बात मानते हैं
          - बड़ा होने के कारण आदर्श बनना पड़ता है
          - अनुभव को किताबी ज्ञान से बड़ा बताते हैं
          - कटी पतंग देखकर उछलकर डोर पकड़ते हैं
          - दोनों हॉस्टल की ओर दौड़ते हैं
          alt: अंत में बड़े भाई मानते हैं कि उनका भी खेलने का मन करता है, पर आदर्श बनना पड़ता है; वे अनुभव को किताबी ज्ञान से बड़ा बताते हैं; फिर कटी पतंग की डोर उछलकर पकड़ते हैं और दोनों हॉस्टल की ओर दौड़ते हैं।
      - style: step_by_step
        teach: 'पहला: बड़े भाई कहते हैं कि अम्माँ-दादा कम पढ़े हैं, फिर भी घर अच्छी तरह चलाते हैं। दूसरा: इससे वे दिखाते हैं कि अनुभव का मूल्य किताबों से ज़्यादा है। तीसरा: वे स्वीकार करते हैं कि उनका भी मन खेलने को करता है। चौथा: पतंग की डोर पकड़ते ही उनके भीतर का बच्चा सामने आ जाता है।'
  items:
  - prompt: '''बड़े भाई साहब'' कहानी के लेखक कौन हैं?'
    options:
    - प्रेमचंद
    - यशपाल
    - निदा फ़ाज़ली
    - हबीब तनवीर
    answer: प्रेमचंद
    difficulty: 1
    hints:
    - उपन्यास सम्राट।
    - '''गोदान'' के लेखक।'
    solution: "'बड़े भाई साहब' प्रेमचंद की कहानी है।"
