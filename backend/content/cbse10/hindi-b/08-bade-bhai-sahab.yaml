subject: cbse10-hinb
chapter: 8
title: बड़े भाई साहब
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_ant: "अंत में भाई साहब के भीतर का बच्चा जाग उठता है। एक कटी पतंग उड़ती आ रही थी।"
  h10b_patang: "किताबें तो बड़े भाई के हाथ में रहती थीं। छोटा भाई मैदान और आसमान की ओर भागता था।"
  h10b_ravan: "भाई साहब ने एक बहुत बलवान राजा का उदाहरण दिया जो अहंकार के कारण नष्ट हो गया।"
  h10bs8_bhai: 'दोनों भाई बिल्कुल अलग हैं: बड़े भाई हर समय पढ़ते और उपदेश देते, छोटे भाई खेलते-कूदते। बात किस भाई के बारे में है?'
  h10bs8_kram: 'कहानी परीक्षा-परिणामों के साथ आगे बढ़ती है: पहले साल, दूसरे साल, फिर पतंग वाला अंत। घटना किस मोड़ पर है?'
concepts:
- code: hin10b.s8.bhaisahab
  title: बड़े भाई साहब (प्रेमचंद)
  notes: |
    प्रेमचंद की कहानी, छोटे भाई की ज़ुबानी। बड़े भाई साहब उससे पाँच साल बड़े, पर केवल तीन दरजे आगे। वे हर समय किताबें
    खोले बैठे रहते, कॉपी के हाशियों पर चिड़ियों, कुत्तों, बिल्लियों की तस्वीरें बनाते, और फिर भी फेल हो जाते। छोटा भाई
    पढ़ाई से ज़्यादा खेल में मन लगाता: गुल्ली-डंडा, कंकरियाँ उछालना, पतंग (कनकौए) उड़ाना, फिर भी हर साल अव्वल पास होता।
    बड़े भाई साहब लंबे उपदेश देते: अंग्रेज़ी, इतिहास (बादशाहों के नाम), ज्यामिति की कठिनाई; घमंड पर रावण का उदाहरण।
    छोटा भाई पास होने पर घमंडी और लापरवाह होने लगता है। अंत में बड़े भाई साहब समझाते हैं कि किताबी ज्ञान से बड़ा
    जीवन का अनुभव है (अम्माँ-दादा का उदाहरण), वे बड़े होने के नाते अपना अधिकार और ज़िम्मेदारी जताते हैं, और खुद भी
    पतंग उड़ाने की इच्छा मानते हैं। उसी समय एक कटी पतंग आती है, बड़े भाई साहब लंबे होने के कारण उसकी डोर पकड़ लेते
    हैं और होस्टल की ओर दौड़ पड़ते हैं; छोटा भाई पीछे-पीछे।
  explanations:
    text: बड़े भाई साहब हर समय पढ़ते रहते पर फेल हो जाते, जबकि छोटा भाई खेलते-कूदते भी पास हो जाता। बड़े भाई उसे उपदेश देते, घमंड से बचने को कहते। अंत में वे बताते हैं कि अनुभव किताबों से बड़ा है, और बड़े होने के कारण वे अपनी इच्छाएँ दबाकर छोटे भाई के लिए आदर्श बने रहते हैं। फिर दोनों मिलकर कटी पतंग के पीछे दौड़ पड़ते हैं।
    visual: 'दो भाइयों का चित्र: एक मेज़ पर किताबों के ढेर के पीछे, कॉपी के हाशिये पर चिड़ियाँ बनाते बड़े भाई; दूसरा मैदान में पतंग उड़ाता छोटा भाई। आख़िरी चित्र: कटी पतंग की डोर पकड़कर दौड़ते बड़े भाई साहब।'
    step_by_step: '1. पाँच साल बड़े, तीन दरजे आगे। 2. बड़े भाई की रटंत पढ़ाई, फिर भी फेल। 3. छोटे का खेल, फिर भी अव्वल। 4. उपदेश: अंग्रेज़ी, इतिहास, ज्यामिति, घमंड पर रावण। 5. अनुभव का महत्व। 6. पतंग की डोर पकड़कर दौड़ना।'
    real_world: घर के बड़े भाई-बहन अक्सर अपनी इच्छाएँ दबाकर छोटों के सामने अच्छा उदाहरण बनने की कोशिश करते हैं; यह कहानी उसी ज़िम्मेदारी की है।
