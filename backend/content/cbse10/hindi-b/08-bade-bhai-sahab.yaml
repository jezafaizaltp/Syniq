  activity:
    type: sort
    prompt: कहानी में यह बड़े भाई साहब के बारे में है या छोटे भाई के?
    bins:
    - बड़े भाई साहब
    - छोटा भाई
    items:
    - label: हर समय किताबें खोले बैठे, फिर भी फेल
      bin: बड़े भाई साहब
      clue: पाँच साल बड़े, पर तीन दरजे आगे कौन?
      why: बड़े भाई साहब मेहनत करते पर फेल होते।
    - label: हाशियों पर चिड़ियों-बिल्लियों की तस्वीरें
      bin: बड़े भाई साहब
      clue: पढ़ाई के समय कॉपी पर चित्र कौन बनाता?
      why: बड़े भाई साहब ऐसा करते थे।
    - label: लंबे उपदेश, रावण का उदाहरण
      bin: बड़े भाई साहब
      clue: घमंड पर कौन समझाता है?
      why: बड़े भाई साहब के उपदेश।
    - label: गुल्ली-डंडा और कनकौए, फिर भी अव्वल
      bin: छोटा भाई
      clue: खेलकर भी कौन पास होता?
      why: छोटा भाई खेल में मन लगाकर भी अव्वल।
    - label: पास होकर घमंडी और लापरवाह
      bin: छोटा भाई
      clue: अव्वल आने पर किसका सिर फिरने लगा?
      why: छोटे भाई में घमंड आने लगा।
    - label: लंबे होने से कटी पतंग की डोर पकड़ी
      bin: बड़े भाई साहब
      clue: अंत में ऊँचाई का फ़ायदा किसे मिला?
      why: बड़े भाई साहब डोर पकड़कर दौड़ पड़े।
  lesson:
    - teach: '''बड़े भाई साहब'' प्रेमचंद की कहानी है। दोनों भाई हॉस्टल में रहकर पढ़ते हैं। बड़े भाई छोटे भाई से पाँच साल बड़े हैं, पर केवल तीन कक्षा आगे हैं। वे हर समय किताबें खोले बैठे रहते, हाशियों पर चित्र बनाते और शब्द दोहराते। छोटा भाई खेल, गुल्ली-डंडा और पतंगबाज़ी का शौकीन है। बड़े भाई उसे लंबे-लंबे उपदेश देकर डाँटते रहते हैं।'
      check:
        prompt: बड़े भाई छोटे भाई से कितनी कक्षा आगे थे?
        options:
        - तीन
        - पाँच
        - एक
        answer: तीन
        why: वे पाँच साल बड़े थे, पर कुछ बार फ़ेल हो चुके थे।
    - teach: 'सालाना परीक्षा में बड़े भाई फ़ेल हो गए और छोटा भाई प्रथम आया। छोटे भाई का घमंड बढ़ा तो बड़े भाई ने समझाया कि घमंड ने रावण जैसे राजा को भी नष्ट कर दिया। उन्होंने पढ़ाई की कठिनाइयाँ बताईं: अंग्रेज़ी, इतिहास के बादशाहों के नाम, ज्यामिति, और ''समय की पाबंदी'' जैसे निबंध। अगले साल फिर बड़े भाई फ़ेल हुए और छोटा भाई प्रथम आया; अब दोनों में एक ही कक्षा का अंतर रह गया।'
      picture:
        kind: flow
        steps:
        - बड़े भाई पढ़ते, छोटा खेलता
        - 'पहला साल: बड़े फ़ेल, छोटा प्रथम'
        - रावण वाला उपदेश
        - 'दूसरा साल: फिर वही'
        - पतंग की डोर पकड़कर दौड़
        alt: 'कहानी का क्रम: बड़े भाई पढ़ते और छोटा खेलता है, पहले साल बड़े फ़ेल और छोटा प्रथम, घमंड पर उपदेश, दूसरे साल फिर वही, और अंत में बड़े भाई पतंग की डोर पकड़कर दौड़ते हैं।'
      check:
        prompt: घमंड के बारे में समझाते हुए बड़े भाई ने किसका उदाहरण दिया?
        options:
        - रावण का
        - अकबर का
        - अर्जुन का
        answer: रावण का
        why: घमंड ने उसका नाश कर दिया।
    - teach: अंत में बड़े भाई स्वीकार करते हैं कि उनका भी मन खेलने और पतंग उड़ाने को करता है, पर बड़ा होने के नाते उन्हें आदर्श बनना पड़ता है। वे कहते हैं कि किताबी ज्ञान से बड़ा जीवन का अनुभव है, और अम्माँ-दादा कम पढ़े होकर भी घर बेहतर चलाते हैं। तभी एक कटी पतंग ऊपर से गुज़रती है; लंबे बड़े भाई उछलकर उसकी डोर पकड़ लेते हैं और हॉस्टल की ओर दौड़ पड़ते हैं, छोटा भाई पीछे-पीछे।
      check:
        prompt: बड़े भाई अपनी इच्छाएँ क्यों दबाते थे?
        options:
        - छोटे भाई के सामने अच्छा उदाहरण बनने के लिए
        - उन्हें खेल पसंद नहीं था
        - वे बीमार थे
        answer: छोटे भाई के सामने अच्छा उदाहरण बनने के लिए
        why: बड़े होने की ज़िम्मेदारी।
