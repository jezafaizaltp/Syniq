subject: cbse10-hinb
chapter: 16
title: सपनों के-से दिन
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
concepts:
- code: hin10b.c16.sapne
  title: सपनों के-से दिन (गुरदयाल सिंह)
  notes: |
    गुरदयाल सिंह के बचपन के संस्मरण (संचयन)। लेखक और उनके साथी बच्चे स्कूल जाना पसंद नहीं करते थे; खेल-कूद, नंगे
    पाँव फटी-मैली कपड़ों में घूमना, छुट्टियों में ननिहाल जाना और तालाब में नहाना उन्हें भाता था। छुट्टियों का
    काम पूरा न होने पर मास्टरों की मार का डर रहता। पीटी मास्टर प्रीतमचंद बहुत सख़्त थे, ज़रा-सी गलती पर 'खाल
    खींचते'। पर स्काउटिंग के अभ्यास में धोबी की धुली वर्दी, पॉलिश किए जूते, नीली-पीली झंडियाँ लेकर परेड करना बच्चों
    को अच्छा लगता, और प्रीतमचंद की 'शाबाश' उन्हें फ़ौजी जैसा महसूस कराती। हेडमास्टर शर्मा जी स्वभाव से नरम थे,
    बच्चों को मारने के ख़िलाफ़। जब प्रीतमचंद ने फ़ारसी की कक्षा में शब्दरूप याद न करने पर बच्चों को मुर्गा बनाया,
    तो हेडमास्टर ने उन्हें मुअत्तल (निलंबित) कर दिया। बाद में पता चला कि प्रीतमचंद घर पर दो तोते पालते थे और उन्हें
    प्यार से भीगे बादाम खिलाते थे: कठोर व्यक्ति का कोमल पक्ष। हेडमास्टर लेखक को पुरानी किताबें दिलवाते थे, जिससे
    उनकी पढ़ाई चलती रही।
  explanations:
    text: लेखक को बचपन में स्कूल जाना अच्छा नहीं लगता था, क्योंकि पीटी मास्टर प्रीतमचंद बहुत मारते थे; पर स्काउट परेड में उनकी 'शाबाश' बहुत भाती थी। बच्चों को मुर्गा बनाने पर नरम दिल हेडमास्टर शर्मा जी ने प्रीतमचंद को निलंबित कर दिया। बाद में पता चला कि वही सख़्त मास्टर घर पर तोतों को प्यार से बादाम खिलाते थे।
    visual: 'तीन दृश्य: गाँव के तालाब में छपाक लगाते बच्चे; धुली वर्दी में झंडियाँ लेकर परेड करते बच्चे और सामने सख़्त चेहरे वाले प्रीतमचंद; और घर में पिंजरे के तोतों को बादाम खिलाते वही प्रीतमचंद।'
    step_by_step: '1. बचपन: खेल प्रिय, स्कूल नहीं। 2. छुट्टियाँ, ननिहाल, गृहकार्य का डर। 3. पीटी मास्टर प्रीतमचंद की सख़्ती। 4. स्काउट परेड का आनंद। 5. हेडमास्टर शर्मा जी द्वारा प्रीतमचंद का निलंबन। 6. तोतों को बादाम: कोमल पक्ष।'
    real_world: आज कक्षा में शारीरिक दंड कानून के ख़िलाफ़ है; हेडमास्टर शर्मा जी का सोच वही था कि बच्चों को डराकर नहीं, प्यार से पढ़ाना चाहिए।
  picture:
    kind: compare
    columns:
    - title: पीटी मास्टर प्रीतमचंद
      points:
      - बहुत सख़्त, मारते थे
      - बच्चों को मुर्गा बनाया
      - पर तोतों को बादाम खिलाते
    - title: हेडमास्टर शर्मा जी
      points:
      - नरम स्वभाव
      - मार के ख़िलाफ़
      - प्रीतमचंद को मुअत्तल किया
    alt: प्रीतमचंद सख़्त थे पर तोतों से प्यार करते थे; शर्मा जी नरम थे और बच्चों को मारने के ख़िलाफ़ थे।
  items:
  - prompt: '''सपनों के-से दिन'' के लेखक कौन हैं?'
    options:
    - गुरदयाल सिंह
    - मिथिलेश्वर
    - प्रेमचंद
    - लीलाधर मंडलोई
    answer: गुरदयाल सिंह
    difficulty: 1
    hints:
    - पंजाबी के प्रसिद्ध कथाकार।
    - ज्ञानपीठ पुरस्कार विजेता।
    solution: गुरदयाल सिंह।
    mistakes:
      मिथिलेश्वर: hin10b_author
  - prompt: पीटी मास्टर का नाम क्या था?
    options:
    - प्रीतमचंद
    - शर्मा जी
    - हरिहर
    - इफ़्फ़न
    answer: प्रीतमचंद
    difficulty: 1
    hints:
    - बहुत सख़्त अध्यापक।
    - शर्मा जी हेडमास्टर थे।
    solution: प्रीतमचंद।
    mistakes:
      शर्मा जी: hin10b_read_again
  - prompt: बच्चों को स्कूल में क्या अच्छा लगता था?
    options:
    - स्काउट परेड, धुली वर्दी और झंडियाँ
    - गृहकार्य
    - फ़ारसी की कक्षा
    - मास्टरों की डाँट
    answer: स्काउट परेड, धुली वर्दी और झंडियाँ
    difficulty: 2
    hints:
    - तब वे खुद को फ़ौजी समझते।
    - प्रीतमचंद की 'शाबाश'।
    solution: स्काउटिंग की परेड, जब वे धुली वर्दी में झंडियाँ लेकर चलते।
  - prompt: हेडमास्टर शर्मा जी ने प्रीतमचंद को मुअत्तल क्यों किया?
    options:
    - उन्होंने बच्चों को मुर्गा बनाकर कठोर सज़ा दी
    - वे देर से आते थे
    - वे परेड नहीं कराते थे
    - वे फ़ारसी नहीं जानते थे
    answer: उन्होंने बच्चों को मुर्गा बनाकर कठोर सज़ा दी
    difficulty: 2
    hints:
    - फ़ारसी की कक्षा का प्रसंग।
    - हेडमास्टर मार के ख़िलाफ़ थे।
    solution: फ़ारसी के शब्दरूप याद न होने पर उन्होंने बच्चों को मुर्गा बनाया, जो शर्मा जी को असहनीय लगा।
  - prompt: प्रीतमचंद का कोमल पक्ष किस बात से पता चलता है?
    options:
    - वे घर पर तोतों को भीगे बादाम खिलाते थे
    - वे बच्चों को मिठाई देते थे
    - वे गाना गाते थे
    - वे रोज़ छुट्टी देते थे
    answer: वे घर पर तोतों को भीगे बादाम खिलाते थे
    difficulty: 3
    hints:
    - पक्षी।
    - प्यार से खिलाना।
    solution: वे अपने दो तोतों को प्यार से भीगे बादाम खिलाते थे।
    mistakes:
      वे बच्चों को मिठाई देते थे: hin10b_read_again
  - prompt: हेडमास्टर ने लेखक की पढ़ाई में कैसे मदद की?
    options:
    - उन्हें पुरानी किताबें दिलवाकर
    - उनकी फ़ीस माफ़ करके
    - घर पर पढ़ाकर
    - नई कॉपियाँ देकर
    answer: उन्हें पुरानी किताबें दिलवाकर
    difficulty: 2
    hints:
    - परिवार नई किताबें नहीं खरीद पाता।
    - किसी की इस्तेमाल की हुई।
    solution: वे लेखक को पुरानी किताबें दिलवा देते थे, जिससे पढ़ाई चलती रही।
