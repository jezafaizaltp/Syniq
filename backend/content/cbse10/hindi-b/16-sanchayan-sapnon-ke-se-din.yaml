subject: cbse10-hinb
chapter: 16
title: सपनों के-से दिन
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  h10b_kitaben: "लेखक का परिवार पढ़ाई का खर्च नहीं उठाना चाहता था। हेडमास्टर ने एक अमीर परिवार के बच्चे की चीज़ें दिलवाईं।"
  h10b_muattal: "हेडमास्टर बच्चों पर कठोरता पसंद नहीं करते थे। पीटी मास्टर ने फ़ारसी की कक्षा में क्या किया?"
  h10b_parade: "बच्चों को स्कूल में ज़्यादातर डर लगता था, पर एक मौका ऐसा था जब वे खुद को फ़ौजी जैसा महसूस करते थे।"
  h10bs16_school: 'लेखक के स्कूल के अनुभव में दो रंग हैं: डर (मार, सज़ा) और ख़ुशी (परेड, छुट्टियाँ, किताबों की गंध)। प्रश्न किस अनुभव का है?'
  h10bs16_patra: 'पाठ में कई लोग हैं: पीटी मास्टर प्रीतमचंद, हेडमास्टर शर्मा जी, साथी ओमा। बात किसके स्वभाव या काम की है?'
concepts:
- code: hin10b.c16.sapne
  title: सपनों के-से दिन (गुरदयाल सिंह)
  notes: |
    गुरदयाल सिंह के बचपन के संस्मरण (संचयन)। लेखक और उनके साथी बच्चे स्कूल जाना पसंद नहीं करते थे; खेल-कूद, नंगे
    पाँव फटी-मैली कपड़ों में घूमना, छुट्टियों में ननिहाल जाना और तालाब में नहाना उन्हें भाता था। छुट्टियों का
    काम पूरा न होने पर मास्टरों की मार का डर रहता। पीटी मास्टर प्रीतमचंद बहुत सख़्त थे, ज़रा-सी गलती पर 'खाल
    खींचते'। पर स्काउटिंग के अभ्यास में धोबी की धुली वर्दी, पॉलिश किए जूते, नीली-पीली झंडियाँ लेकर परेड करना बच्चों
    को अच्छा लगता, और प्रीतमचंद की 'शाबाश' उन्हें फ़ौजी जैसा महसूस कराती। हेडमास्टर शर्मा जी स्वभाव से नरम थे,
    बच्चों को मारने के ख़िलाफ़। जब प्रीतमचंद ने फ़ारसी की कक्षा में शब्दरूप याद न करने पर बच्चों को मुर्गा बनाया,
    तो हेडमास्टर ने उन्हें मुअत्तल (निलंबित) कर दिया। बाद में पता चला कि प्रीतमचंद घर पर दो तोते पालते थे और उन्हें
    प्यार से भीगे बादाम खिलाते थे: कठोर व्यक्ति का कोमल पक्ष। हेडमास्टर लेखक को पुरानी किताबें दिलवाते थे, जिससे
    उनकी पढ़ाई चलती रही।
  explanations:
    text: लेखक को बचपन में स्कूल जाना अच्छा नहीं लगता था, क्योंकि पीटी मास्टर प्रीतमचंद बहुत मारते थे; पर स्काउट परेड में उनकी 'शाबाश' बहुत भाती थी। बच्चों को मुर्गा बनाने पर नरम दिल हेडमास्टर शर्मा जी ने प्रीतमचंद को निलंबित कर दिया। बाद में पता चला कि वही सख़्त मास्टर घर पर तोतों को प्यार से बादाम खिलाते थे।
    visual: 'तीन दृश्य: गाँव के तालाब में छपाक लगाते बच्चे; धुली वर्दी में झंडियाँ लेकर परेड करते बच्चे और सामने सख़्त चेहरे वाले प्रीतमचंद; और घर में पिंजरे के तोतों को बादाम खिलाते वही प्रीतमचंद।'
    step_by_step: '1. बचपन: खेल प्रिय, स्कूल नहीं। 2. छुट्टियाँ, ननिहाल, गृहकार्य का डर। 3. पीटी मास्टर प्रीतमचंद की सख़्ती। 4. स्काउट परेड का आनंद। 5. हेडमास्टर शर्मा जी द्वारा प्रीतमचंद का निलंबन। 6. तोतों को बादाम: कोमल पक्ष।'
    real_world: आज कक्षा में शारीरिक दंड कानून के ख़िलाफ़ है; हेडमास्टर शर्मा जी का सोच वही था कि बच्चों को डराकर नहीं, प्यार से पढ़ाना चाहिए।
  picture:
    kind: compare
    columns:
    - title: पीटी मास्टर प्रीतमचंद
      points:
      - बहुत सख़्त, मारते थे
      - बच्चों को मुर्गा बनाया
      - पर तोतों को बादाम खिलाते
    - title: हेडमास्टर शर्मा जी
      points:
      - नरम स्वभाव
      - मार के ख़िलाफ़
      - प्रीतमचंद को मुअत्तल किया
    alt: प्रीतमचंद सख़्त थे पर तोतों से प्यार करते थे; शर्मा जी नरम थे और बच्चों को मारने के ख़िलाफ़ थे।
  activity:
    type: sort
    prompt: यह पीटी मास्टर प्रीतमचंद के बारे में है या हेडमास्टर शर्मा जी के?
    bins:
    - प्रीतमचंद
    - शर्मा जी
    items:
    - label: ज़रा-सी गलती पर खाल खींचना
      bin: प्रीतमचंद
      clue: सबसे सख़्त मास्टर कौन?
      why: पीटी मास्टर प्रीतमचंद।
    - label: फ़ारसी की कक्षा में मुर्गा बनाया
      bin: प्रीतमचंद
      clue: किसकी इस सज़ा पर कार्रवाई हुई?
      why: प्रीतमचंद ने बच्चों को मुर्गा बनाया।
    - label: तोतों को भीगे बादाम खिलाना
      bin: प्रीतमचंद
      clue: कठोर व्यक्ति का कोमल पक्ष किसका?
      why: प्रीतमचंद घर पर तोते पालते थे।
    - label: बच्चों को मारने के ख़िलाफ़
      bin: शर्मा जी
      clue: स्वभाव से नरम कौन?
      why: हेडमास्टर शर्मा जी।
    - label: प्रीतमचंद को मुअत्तल किया
      bin: शर्मा जी
      clue: मास्टर को निलंबित कौन कर सकता है?
      why: हेडमास्टर ने निलंबित किया।
    - label: लेखक को पुरानी किताबें दिलवाना
      bin: शर्मा जी
      clue: लेखक की पढ़ाई किसकी मदद से चली?
      why: शर्मा जी पुरानी किताबें दिलवाते थे।
  lesson:
    - teach: '''सपनों के-से दिन'' गुरदयाल सिंह का संस्मरण है। बचपन में लेखक के साथी अलग-अलग परिवारों से थे, कुछ हरियाणा या राजस्थान से आए परिवारों के, जिनकी बोली अलग थी, पर खेलते समय सब एक हो जाते। अधिकांश बच्चों को स्कूल जाना अच्छा नहीं लगता था; माता-पिता भी पढ़ाई को ज़्यादा महत्त्व नहीं देते थे। गर्मी की छुट्टियों में ननिहाल जाना और तालाब में नहाना सबसे सुखद लगता।'
      check:
        prompt: अलग बोली होने पर भी बच्चे कैसे घुल-मिल जाते थे?
        options:
        - खेल में सब एक हो जाते
        - वे एक ही स्कूल के थे
        - शिक्षक मिला देते थे
        answer: खेल में सब एक हो जाते
        why: बचपन में भाषा दीवार नहीं बनती।
      ways:
      - style: visual
        teach: लेखक के बचपन में खेल और स्कूल कैसे लगते थे, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: खेल और छुट्टियाँ
            points:
            - अलग बोली वाले साथी भी एक हो जाते
            - ननिहाल जाना, तालाब में नहाना
          - title: स्कूल
            points:
            - अधिकांश बच्चों को अच्छा नहीं लगता
            - माता-पिता भी पढ़ाई को कम महत्त्व देते
          alt: खेल में अलग बोली वाले साथी भी एक हो जाते और छुट्टियों में ननिहाल जाना और तालाब में नहाना सुखद लगता; स्कूल अधिकांश बच्चों को अच्छा नहीं लगता था और माता-पिता भी पढ़ाई को कम महत्त्व देते थे।
      - style: real_world
        teach: आज भी किसी कक्षा में अलग-अलग राज्यों से आए बच्चे होते हैं, जिनकी भाषा अलग होती है। पर मैदान में खेल शुरू होते ही वे बिना किसी परेशानी के एक टीम बन जाते हैं, जैसे लेखक के बचपन में होता था।
    - teach: छुट्टियों के अंत में दिए काम (जैसे 200 सवाल) न करने का डर सताता। ओमा, जो ठिगना था और जिसका सिर बहुत बड़ा था, काम करने के बजाय मार खाना सस्ता समझता था। स्कूल में पीटी मास्टर प्रीतमचंद बहुत सख़्त थे; उनकी 'शाबाश' बच्चों को फ़ौज के तमग़ों जैसी लगती। स्काउट परेड, धुली वर्दी, पॉलिश किए जूते और झंडियाँ बच्चों को अच्छी लगतीं।
      picture:
        kind: compare
        columns:
        - title: स्कूल का डर
          points:
          - छुट्टियों का अधूरा काम
          - पीटी मास्टर की मार
          - मुर्गा बनाने की सज़ा
        - title: स्कूल की ख़ुशी
          points:
          - स्काउट परेड
          - मास्टर की 'शाबाश'
          - नई किताबों की गंध
        alt: 'लेखक के स्कूल के दो अनुभव: डर में अधूरा काम, मार और सज़ा; ख़ुशी में स्काउट परेड, शाबाश और नई किताबों की गंध।'
      check:
        prompt: 'जाँचो: बच्चों को स्कूल में क्या अच्छा लगता था?'
        options:
        - स्काउट परेड और धुली वर्दी
        - मार खाना
        - सवाल हल करना
        answer: स्काउट परेड और धुली वर्दी
        why: परेड में वे ख़ुद को फ़ौजी जैसा समझते।
      ways:
      - style: step_by_step
        teach: 'पहला: छुट्टियाँ ख़त्म होने को आतीं तो दिए गए काम की याद आती। दूसरा: काम पूरा न होने का डर सताने लगता। तीसरा: ओमा जैसे साथी काम की जगह मार खाना सस्ता सौदा मानते। चौथा: पर स्काउट परेड के दिन वही स्कूल अच्छा लगने लगता, धुली वर्दी और पॉलिश किए जूतों के साथ।'
      - style: real_world
        teach: कई विद्यार्थियों को पढ़ाई से ज़्यादा स्कूल का खेल-दिवस या परेड याद रहती है। लेखक को भी पीटी मास्टर की एक 'शाबाश' फ़ौज के तमग़े जैसी लगती थी।
    - teach: 'प्रीतमचंद चौथी कक्षा को फ़ारसी पढ़ाने लगे। शब्द-रूप याद न होने पर उन्होंने बच्चों को मुर्गा बनवाया। हेडमास्टर शर्मा जी, जो बच्चों को मारने के ख़िलाफ़ थे, ने यह देखकर उन्हें मुअत्तल (निलंबित) कर दिया। फिर भी प्रीतमचंद का एक कोमल पक्ष था: वे घर पर पिंजरे के तोतों को भीगे बादाम खिलाते और उनसे मीठी बातें करते। हेडमास्टर ने लेखक को एक धनी परिवार के लड़के की पुरानी किताबें दिलवाईं, जिससे उनकी पढ़ाई चलती रही।'
      check:
        prompt: हेडमास्टर शर्मा जी ने प्रीतमचंद को क्यों मुअत्तल किया?
        options:
        - उन्होंने बच्चों को मुर्गा बनाकर कठोर सज़ा दी
        - वे देर से आते थे
        - उन्होंने पैसे लिए
        answer: उन्होंने बच्चों को मुर्गा बनाकर कठोर सज़ा दी
        why: हेडमास्टर कठोर दंड के विरोधी थे।
      ways:
      - style: visual
        teach: पीटी मास्टर प्रीतमचंद के दो रूप, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: स्कूल में
            points:
            - बहुत सख़्त, बच्चों को मुर्गा बनवाया
            - हेडमास्टर ने मुअत्तल किया
          - title: घर पर
            points:
            - तोतों को भीगे बादाम खिलाते
            - उनसे मीठी बातें करते
          alt: स्कूल में प्रीतमचंद बहुत सख़्त थे, बच्चों को मुर्गा बनवाया और हेडमास्टर ने उन्हें मुअत्तल किया; घर पर वे तोतों को भीगे बादाम खिलाते और उनसे मीठी बातें करते थे।
      - style: step_by_step
        teach: 'पहला: प्रीतमचंद ने फ़ारसी के शब्द-रूप याद न होने पर बच्चों को कड़ी सज़ा दी। दूसरा: हेडमास्टर शर्मा जी बच्चों को मारने के ख़िलाफ़ थे। तीसरा: उन्होंने प्रीतमचंद को मुअत्तल कर दिया। चौथा: हेडमास्टर ने लेखक को पुरानी किताबें दिलवाकर उनकी पढ़ाई भी जारी रखवाई।'
  items:
  - prompt: '''सपनों के-से दिन'' के लेखक कौन हैं?'
    options:
    - गुरदयाल सिंह
    - मिथिलेश्वर
    - प्रेमचंद
    - लीलाधर मंडलोई
    answer: गुरदयाल सिंह
    difficulty: 1
    hints:
    - पंजाबी के प्रसिद्ध कथाकार।
    - ज्ञानपीठ पुरस्कार विजेता।
    solution: "'सपनों के-से दिन' गुरदयाल सिंह का संस्मरण है।"
    mistakes:
      मिथिलेश्वर: hin10b_author
  - prompt: पीटी मास्टर का नाम क्या था?
    options:
    - प्रीतमचंद
    - शर्मा जी
    - हरिहर
    - इफ़्फ़न
    answer: प्रीतमचंद
