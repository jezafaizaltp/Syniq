subject: cbse10-hinb
chapter: 11
title: तीसरी कसम के शिल्पकार शैलेंद्र
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  h10b_gulfam: "ईदगाह प्रेमचंद की कहानी है। तीसरी कसम फणीश्वरनाथ रेणु की कहानी पर बनी।"
  h10b_rajkapoor: "शैलेंद्र ने फ़िल्म बनाई थी। हीरामन का अभिनय एक मशहूर अभिनेता-निर्देशक ने किया।"
  h10b_swarn_padak: "यह भारत सरकार का राष्ट्रीय फ़िल्म सम्मान था, देश के प्रथम नागरिक के नाम वाला।"
concepts:
- code: hin10b.s11.shailendra
  title: तीसरी कसम के शिल्पकार शैलेंद्र (प्रह्लाद अग्रवाल)
  notes: |
    प्रह्लाद अग्रवाल का संस्मरणात्मक लेख। गीतकार शैलेंद्र ने फ़िल्म 'तीसरी कसम' बनाई, जो फणीश्वरनाथ रेणु की कहानी
    'मारे गए गुलफ़ाम' पर आधारित थी। उसमें राज कपूर ने गाड़ीवान हीरामन और वहीदा रहमान ने नौटंकी कलाकार हीराबाई
    की भूमिका निभाई; राज कपूर अपनी दोस्ती के कारण इसमें आए। फ़िल्म ने कहानी की आत्मा सच्चाई से परदे पर उतारी और
    उसे राष्ट्रपति स्वर्ण पदक सहित कई सम्मान मिले, पर फ़िल्म को वितरक नहीं मिले और यह व्यावसायिक रूप से असफल रही।
    शैलेंद्र कवि-हृदय थे, धन कमाने वाले निर्माता नहीं। गीत 'रातें दसों दिशाओं से कहेंगी अपनी कहानियाँ' पर संगीतकार
    शंकर-जयकिशन ने आपत्ति की कि दिशाएँ चार होती हैं, पर शैलेंद्र 'दसों दिशाएँ' बदलने को तैयार नहीं हुए। उनके गीत
    सरल, भावपूर्ण और आम आदमी के दुख-सुख से जुड़े थे (जैसे 'सजनवा बैरी हो गए हमार')। फ़िल्म की असफलता के बाद
    शैलेंद्र का निधन हो गया।
  explanations:
    text: कवि-गीतकार शैलेंद्र ने रेणु की कहानी 'मारे गए गुलफ़ाम' पर 'तीसरी कसम' बनाई, जिसमें राज कपूर हीरामन और वहीदा रहमान हीराबाई बने। फ़िल्म को राष्ट्रपति स्वर्ण पदक मिला, पर पैसा नहीं मिला, क्योंकि शैलेंद्र ने कमाई के लिए नहीं, सच्ची भावना के लिए फ़िल्म बनाई थी।
    visual: 'एक फ़िल्म की रील सोचिए: पहले फ्रेम में रेणु की किताब ''मारे गए गुलफ़ाम'', फिर बैलगाड़ी पर हीरामन (राज कपूर) और हीराबाई (वहीदा रहमान), फिर राष्ट्रपति स्वर्ण पदक, और आख़िरी फ्रेम में खाली सिनेमाघर।'
    step_by_step: '1. शैलेंद्र: गीतकार से निर्माता। 2. कहानी: रेणु की ''मारे गए गुलफ़ाम''। 3. कलाकार: राज कपूर, वहीदा रहमान। 4. सम्मान: राष्ट्रपति स्वर्ण पदक। 5. व्यावसायिक असफलता। 6. ''दसों दिशाएँ'' पर अडिग रहना।'
    real_world: आज भी कई अच्छी फ़िल्में पुरस्कार जीतती हैं पर बॉक्स ऑफिस पर नहीं चलतीं; शैलेंद्र ने कला को कमाई से ऊपर रखा।
  picture:
    kind: compare
    columns:
    - title: कहानी में
      points:
      - '''मारे गए गुलफ़ाम'' (रेणु)'
      - गाड़ीवान हीरामन
      - नौटंकी की हीराबाई
    - title: फ़िल्म में
      points:
      - '''तीसरी कसम'' (शैलेंद्र)'
      - राज कपूर
      - वहीदा रहमान
    alt: रेणु की कहानी 'मारे गए गुलफ़ाम' पर फ़िल्म 'तीसरी कसम' बनी, जिसमें राज कपूर हीरामन और वहीदा रहमान हीराबाई बने।
  items:
  - prompt: इस पाठ के लेखक कौन हैं?
    options:
    - प्रह्लाद अग्रवाल
    - शैलेंद्र
    - फणीश्वरनाथ रेणु
    - निदा फ़ाज़ली
    answer: प्रह्लाद अग्रवाल
    difficulty: 1
    hints:
    - फ़िल्मों पर लिखने वाले लेखक।
    - पाठ शैलेंद्र के बारे में है, उनका लिखा नहीं।
    solution: प्रह्लाद अग्रवाल।
    mistakes:
      शैलेंद्र: hin10b_author
  - prompt: फ़िल्म 'तीसरी कसम' किस कहानी पर आधारित थी?
    options:
    - मारे गए गुलफ़ाम
    - पंचलाइट
    - ईदगाह
    - दो बैलों की कथा
    answer: मारे गए गुलफ़ाम
    difficulty: 1
    hints:
    - फणीश्वरनाथ रेणु की कहानी।
    - '''गुलफ़ाम'' शब्द।'
    solution: रेणु की कहानी 'मारे गए गुलफ़ाम'।
    mistakes: {"ईदगाह": "h10b_gulfam"}
  - prompt: फ़िल्म में हीरामन की भूमिका किसने निभाई?
    options:
    - राज कपूर
    - दिलीप कुमार
    - देव आनंद
    - शैलेंद्र
    answer: राज कपूर
    difficulty: 1
    hints:
    - शैलेंद्र के मित्र।
    - '''शोमैन''।'
    solution: राज कपूर ने।
    mistakes: {"शैलेंद्र": "h10b_rajkapoor"}
  - prompt: हीराबाई की भूमिका किसने निभाई?
    options:
    - वहीदा रहमान
    - नरगिस
    - मधुबाला
    - मीना कुमारी
    answer: वहीदा रहमान
    difficulty: 2
    hints:
    - '''गाइड'' की नायिका भी।'
    - नाम 'व' से।
    solution: वहीदा रहमान ने।
    mistakes:
      नरगिस: hin10b_read_again
  - prompt: '''तीसरी कसम'' को कौन-सा बड़ा सम्मान मिला?'
    options:
    - राष्ट्रपति स्वर्ण पदक
    - ऑस्कर
    - भारत रत्न
    - नोबेल पुरस्कार
    answer: राष्ट्रपति स्वर्ण पदक
    difficulty: 2
    hints:
    - भारत सरकार का फ़िल्म सम्मान।
    - स्वर्ण।
    solution: सर्वश्रेष्ठ फ़िल्म के लिए राष्ट्रपति स्वर्ण पदक।
    mistakes: {"ऑस्कर": "h10b_swarn_padak"}
  - prompt: शंकर-जयकिशन ने 'दसों दिशाएँ' पर क्या आपत्ति की?
    options:
    - दिशाएँ चार होती हैं, दस नहीं
    - शब्द बहुत कठिन है
    - गाना बहुत लंबा है
    - धुन नहीं बैठती
    answer: दिशाएँ चार होती हैं, दस नहीं
    difficulty: 3
    hints:
    - आम लोग कितनी दिशाएँ जानते हैं?
    - शैलेंद्र नहीं माने।
    solution: उनका कहना था कि लोग चार दिशाएँ जानते हैं; शैलेंद्र ने 'दसों दिशाएँ' ही रखा।
    mistakes:
      शब्द बहुत कठिन है: hin10b_read_again
