    items:
    - label: फ़िल्म बनाई, घाटा सहा
      bin: शैलेंद्र
      clue: गीतकार जो निर्माता बने?
      why: शैलेंद्र ने 'तीसरी कसम' बनाई।
    - label: '''दसों दिशाएँ'' बदलने से इनकार'
      bin: शैलेंद्र
      clue: गीत के शब्द पर कौन अड़ा रहा?
      why: शैलेंद्र 'दसों दिशाओं' पर अड़े रहे।
    - label: गाड़ीवान हीरामन की भूमिका
      bin: राज कपूर
      clue: दोस्ती के कारण कौन अभिनेता आया?
      why: राज कपूर ने हीरामन का रोल किया।
    - label: '''मारे गए गुलफ़ाम'' कहानी'
      bin: फणीश्वरनाथ रेणु
      clue: फ़िल्म किसकी कहानी पर बनी?
      why: रेणु की कहानी पर आधारित।
    - label: 'दिशाएँ चार होती हैं: आपत्ति'
      bin: शंकर-जयकिशन
      clue: संगीत देने वाले किसने यह कहा?
      why: संगीतकार शंकर-जयकिशन की आपत्ति।
  lesson:
    - teach: '''तीसरी कसम के शिल्पकार शैलेंद्र'' प्रह्लाद अग्रवाल का संस्मरण है। प्रसिद्ध गीतकार शैलेंद्र ने अपने जीवन में केवल एक फ़िल्म बनाई: ''तीसरी कसम'', जो फणीश्वरनाथ रेणु की कहानी ''मारे गए गुलफ़ाम'' पर आधारित थी। इसमें राज कपूर ने गाड़ीवान हीरामन और वहीदा रहमान ने नौटंकी की कलाकार हीराबाई की भूमिका निभाई।'
      check:
        prompt: '''तीसरी कसम'' किसकी कहानी पर बनी?'
        options:
        - फणीश्वरनाथ रेणु
        - प्रेमचंद
        - यशपाल
        answer: फणीश्वरनाथ रेणु
        why: उनकी कहानी 'मारे गए गुलफ़ाम' पर।
    - teach: फ़िल्म को राष्ट्रपति स्वर्ण पदक और बंगाल फ़िल्म जर्नलिस्ट एसोसिएशन का सर्वश्रेष्ठ फ़िल्म पुरस्कार मिला, फिर भी वह व्यावसायिक रूप से सफल नहीं हुई, क्योंकि उसमें सस्ता मसाला नहीं था। शैलेंद्र भावुक कवि थे; उन्हें धन या यश नहीं, आत्म-संतुष्टि चाहिए थी। राज कपूर ने मित्र के नाते उन्हें फ़िल्म के जोखिमों से आगाह भी किया था। आर्थिक घाटे और चिंता के बीच शैलेंद्र का जल्दी देहांत हो गया।
      picture:
        kind: compare
        columns:
        - title: फ़िल्म की उपलब्धि
          points:
          - राष्ट्रपति स्वर्ण पदक
          - कलात्मक, सच्ची फ़िल्म
          - राज कपूर का श्रेष्ठ अभिनय
        - title: फ़िल्म की कठिनाई
          points:
          - वितरक नहीं मिले
          - व्यावसायिक असफलता
          - शैलेंद्र पर कर्ज़ और चिंता
        alt: 'तीसरी कसम की उपलब्धि और कठिनाई: पुरस्कार, कलात्मकता और श्रेष्ठ अभिनय मिला, पर वितरक नहीं मिले और शैलेंद्र को घाटा व चिंता झेलनी पड़ी।'
      check:
        prompt: फ़िल्म व्यावसायिक रूप से सफल क्यों नहीं हुई?
        options:
        - उसमें सस्ता मनोरंजन और मसाला नहीं था
        - उसमें गाने नहीं थे
        - वह बहुत लंबी थी
        answer: उसमें सस्ता मनोरंजन और मसाला नहीं था
        why: वितरक उसकी करुणा का मूल्य नहीं समझ सके।
    - teach: शैलेंद्र मानते थे कि कलाकार का कर्तव्य दर्शकों की रुचि सुधारना है, उसके नाम पर सस्ता परोसना नहीं। 'श्री 420' के गीत 'रातें दसों दिशाओं से कहेंगी अपनी कहानियाँ' पर संगीतकार शंकर-जयकिशन ने आपत्ति की कि दिशाएँ चार होती हैं, पर शैलेंद्र ने 'दसों' ही रखा। फ़िल्म में दुख को भी सहज, जीवन के सत्य के रूप में दिखाया गया। राज कपूर ने हीरामन को ऐसे जिया कि वे राज कपूर नहीं, हीरामन ही लगे।
      check:
        prompt: शैलेंद्र के अनुसार कलाकार का कर्तव्य क्या है?
        options:
        - दर्शकों की रुचि का परिष्कार करना
        - केवल पैसा कमाना
        - दर्शकों को जो पसंद हो वही देना
        answer: दर्शकों की रुचि का परिष्कार करना
        why: सस्ते मनोरंजन से बचना।
