subject: cbse10-hinb
chapter: 4
title: पर्वत प्रदेश में पावस
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_darpan: "पर्वत ताल में अपना रूप निहार रहा है। रूप किसमें देखा जाता है?"
  h10b_pavas: "कविता में बादल, झरने और बरसात हैं। 'पावस' उसी ऋतु का नाम है।"
  h10bs4_drishya: 'कविता में प्रकृति पल-पल बदलती है: पहले साफ़ पहाड़, ताल, झरने, पेड़; फिर अचानक बादल सब ढक लेते हैं। प्रश्न किस दृश्य का है?'
  h10bs4_manvi: "पंत पहाड़, झरने और पेड़ों को देखते, गाते और चिंता करते दिखाते हैं। सोचो कि चीज़ क्या 'कर' रही है और उसके पीछे क्या भाव है।"
concepts:
- code: hin10b.s4.pavas
  title: पर्वत प्रदेश में पावस (सुमित्रानंदन पंत)
  notes: |
    सुमित्रानंदन पंत (प्रकृति के सुकुमार कवि) की कविता। वर्षा ऋतु (पावस) में पर्वतीय प्रदेश की प्रकृति पल-पल
    अपना रूप बदलती है। करधनी (मेखला) के आकार का विशाल पर्वत अपने हज़ारों फूल रूपी नेत्रों (दृग-सुमन) से नीचे
    दर्पण-से फैले तालाब में अपना विशाल आकार बार-बार देख रहा है। झाग भरे झरने मोती की लड़ियों जैसे झरते हुए
    पर्वत का गौरव गा रहे हैं। पर्वत के हृदय से उठे पेड़ ऊँची आकांक्षाओं से चुपचाप, एकटक आकाश की ओर देख रहे हैं।
    अचानक बादल छा जाते हैं: लगता है पर्वत पारे जैसे चमकीले पंख फड़फड़ाकर उड़ गया, केवल झरनों का शोर बचा, आकाश
    धरती पर टूट पड़ा, डरकर शाल के पेड़ धरती में धँस गए, तालाब से धुआँ उठता है मानो वह जल गया। ऐसा लगता है इंद्र
    बादलों के विमान में घूमकर जादू (इंद्रजाल) दिखा रहे हैं।
  explanations:
    text: वर्षा में पहाड़ों का रूप हर पल बदलता है। पर्वत फूलों की आँखों से तालाब रूपी दर्पण में अपना रूप देखता है, झरने मोतियों की लड़ियों जैसे गिरते हैं, पेड़ आकाश को ताकते हैं। फिर बादल आते हैं और सब छिप जाता है, मानो पर्वत उड़ गया और इंद्र जादू दिखा रहे हैं।
    visual: 'दो दृश्य बनाइए। पहला: धूप में विशाल पर्वत, नीचे दर्पण जैसा ताल, मोती-से झरने, आकाश की ओर उठे पेड़। दूसरा: घने बादल, पर्वत गायब, केवल झरनों की आवाज़, ताल से उठता धुआँ, बादलों के विमान पर इंद्र।'
    step_by_step: '1. पल-पल बदलती प्रकृति। 2. पर्वत और दर्पण-सा ताल। 3. मोती की लड़ियों-से झरने। 4. आकाश ताकते पेड़। 5. बादल: पर्वत ''उड़ गया'', शाल धँसे, ताल ''जल गया''। 6. इंद्र का इंद्रजाल।'
    real_world: बरसात में किसी पहाड़ी जगह पर पाँच मिनट में साफ़ घाटी पूरी तरह धुंध में छिप जाती है, ठीक वैसे ही जैसे कविता में पर्वत 'उड़' जाता है।
  picture:
    kind: flow
    steps:
    - पर्वत ताल रूपी दर्पण में अपना रूप देखता है
    - झरने मोतियों की लड़ियों-से गिरते हैं
    - पेड़ आकाश को एकटक ताकते हैं
    - 'बादल छाते हैं: पर्वत ''उड़ जाता है'''
    - इंद्र का इंद्रजाल
    alt: 'कविता में दृश्य बदलते हैं: पर्वत, ताल, झरने और पेड़, फिर बादल छाकर सब छिपा देते हैं।'
  activity:
    type: sort
    prompt: कविता में किस चीज़ को किस रूप में देखा गया है?
    bins:
    - पर्वत के
    - बादल छाने पर
    items:
    - label: हज़ारों दृग-सुमन (फूल रूपी आँखें)
      bin: पर्वत के
      clue: पर्वत तालाब में अपना रूप किससे देख रहा है?
      why: फूल पर्वत की आँखें हैं।
    - label: दर्पण-सा तालाब
      bin: पर्वत के
      clue: पर्वत अपना आकार कहाँ निहारता है?
      why: तालाब पर्वत का दर्पण है।
    - label: मोती की लड़ियों-से झरने
      bin: पर्वत के
      clue: झरने किसका गौरव गा रहे हैं?
      why: झरने पर्वत का गुणगान करते हैं।
    - label: पर्वत पारे जैसे पंख लगाकर उड़ गया
      bin: बादल छाने पर
      clue: पर्वत अचानक दिखना कब बंद हुआ?
      why: बादलों से ढककर पर्वत 'उड़ गया' लगता है।
    - label: शाल के पेड़ धरती में धँस गए
      bin: बादल छाने पर
      clue: पेड़ डरे हुए कब लगे?
      why: बादलों में पेड़ ओझल हो गए।
    - label: तालाब से धुआँ उठना
      bin: बादल छाने पर
      clue: कोहरा उठता देख तालाब कैसा लगा?
      why: 'मानो तालाब जल गया हो: बादल छाने का दृश्य।'
  lesson:
    - teach: '''पर्वत प्रदेश में पावस'' सुमित्रानंदन पंत की कविता है, जिन्हें ''प्रकृति का सुकुमार कवि'' कहा जाता है। वर्षा ऋतु में पहाड़ों पर प्रकृति पल-पल अपना वेश बदलती है। करघनी (मेखला) के आकार का विशाल पर्वत अपने हज़ारों फूल रूपी आँखें फाड़कर नीचे ताल के जल में अपना विशाल रूप बार-बार निहार रहा है; वह ताल दर्पण-सा फैला है।'
      check:
        prompt: पर्वत के फूलों को कवि ने क्या कहा है?
        options:
        - उसकी हज़ारों आँखें
        - उसके गहने
        - उसके बाल
        answer: उसकी हज़ारों आँखें
        why: '''सहस्र दृग-सुमन'' यानी फूल रूपी आँखें।'
    - teach: झाग भरे झरने पर्वत का गौरव गाते हुए झर-झर बहते हैं; वे मोती की लड़ियों जैसे सुंदर हैं। पर्वत के हृदय से उठे ऊँचे पेड़ ऊँची आकांक्षाओं की तरह शांत आकाश को एकटक, अटल, कुछ चिंतित-से निहार रहे हैं।
      picture:
        kind: flow
        steps:
        - पर्वत ताल में खुद को देखता है
        - झरने गौरव गाते हैं
        - पेड़ आकाश ताकते हैं
        - बादल छा जाते हैं
        - पर्वत गायब, शाल धँसे
        - इंद्र का इंद्रजाल
        alt: 'कविता के बदलते दृश्य: पर्वत ताल में अपना रूप देखता है, झरने गाते हैं, पेड़ आकाश ताकते हैं, फिर बादल छा जाते हैं, पर्वत गायब और शाल धँसे लगते हैं, मानो इंद्र जादू दिखा रहा हो।'
      check:
        prompt: पेड़ आकाश की ओर किस भाव से देख रहे हैं?
        options:
        - ऊँची आकांक्षा से, अपलक और कुछ चिंतित
        - ग़ुस्से से
        - डर से भागते हुए
        answer: ऊँची आकांक्षा से, अपलक और कुछ चिंतित
        why: वे ऊपर उठना चाहते हैं।
    - teach: 'अचानक बादल छा जाते हैं: लगता है पर्वत पारे के समान चमकीले पंख फड़फड़ाकर उड़ गया; केवल झरनों का शोर बचा। मानो आकाश धरती पर टूट पड़ा। डर से शाल के पेड़ धरती में धँस गए; ताल से उठता कोहरा ऐसा लगता है मानो ताल जल गया और धुआँ उठ रहा है। इस तरह इंद्र बादलों के विमान में घूमते हुए इंद्रजाल (जादू) दिखा रहे थे।'
      check:
        prompt: ताल से उठते कोहरे को कवि ने कैसे देखा?
        options:
        - मानो ताल जल गया और धुआँ उठ रहा है
        - मानो ताल सूख गया
        - मानो ताल में मछलियाँ नाच रही हैं
        answer: मानो ताल जल गया और धुआँ उठ रहा है
        why: कोहरा धुएँ जैसा दिखता है।
  items:
  - prompt: '''पर्वत प्रदेश में पावस'' के कवि कौन हैं?'
    options:
    - सुमित्रानंदन पंत
    - मैथिलीशरण गुप्त
    - महादेवी वर्मा
    - निराला
    answer: सुमित्रानंदन पंत
    difficulty: 1
    hints:
    - प्रकृति के सुकुमार कवि।
    - कौसानी में जन्म।
    solution: सुमित्रानंदन पंत।
    mistakes:
      मैथिलीशरण गुप्त: hin10b_author
  - prompt: '''पावस'' का अर्थ क्या है?'
    options:
    - वर्षा ऋतु
    - गर्मी
    - सर्दी
    - वसंत
    answer: वर्षा ऋतु
    difficulty: 1
    hints:
    - बादल और झरने।
    - बरसात।
    solution: पावस = वर्षा ऋतु।
    mistakes: {"वसंत": "h10b_pavas"}
  - prompt: पर्वत के नीचे फैले ताल की तुलना किससे की गई है?
    options:
    - दर्पण से
    - आकाश से
    - सागर से
    - मोती से
    answer: दर्पण से
    difficulty: 1
    hints:
    - पर्वत उसमें अपना रूप देखता है।
    - जिसमें चेहरा दिखे।
    solution: ताल दर्पण-सा फैला है, जिसमें पर्वत अपना आकार देखता है।
    mistakes: {"सागर से": "h10b_darpan"}
  - prompt: झरने किसके समान बताए गए हैं?
    options:
    - मोती की लड़ियों के
    - चाँदी की थाली के
    - सफ़ेद बादलों के
    - दूध की धारा के
    answer: मोती की लड़ियों के
    difficulty: 2
    hints:
    - झाग भरे, चमकीले।
    - माला जैसी।
    solution: झाग भरे झरने मोती की लड़ियों जैसे सुंदर लगते हैं।
    mistakes:
      सफ़ेद बादलों के: hin10b_read_again
  - prompt: बादल छाने पर शाल के पेड़ों के बारे में कवि क्या कहते हैं?
    options:
    - वे डरकर धरती में धँस गए
    - वे आकाश में उड़ गए
    - वे नाचने लगे
    - वे गिर गए
    answer: वे डरकर धरती में धँस गए
    difficulty: 2
    hints:
    - '''धँस गए धरा में सभय शाल''।'
    - बादलों से छिप जाना।
    solution: बादलों में छिप जाने से लगता है शाल के पेड़ डरकर धरती में धँस गए।
    mistakes:
      वे आकाश में उड़ गए: hin10b_poem_meaning
  - prompt: '''यों जलद-यान में विचर-विचर था इंद्र खेलता इंद्रजाल'' का भाव क्या है?'
    options:
    - बदलते दृश्य ऐसे लगते हैं मानो इंद्र बादलों के विमान से जादू दिखा रहे हों
    - इंद्र युद्ध कर रहे हैं
    - बादल विमान बन गए हैं
    - बारिश रुक गई है
    answer: बदलते दृश्य ऐसे लगते हैं मानो इंद्र बादलों के विमान से जादू दिखा रहे हों
    difficulty: 3
    hints:
    - इंद्र वर्षा के देवता हैं।
    - इंद्रजाल = जादू।
    solution: पल-पल बदलते दृश्य देखकर लगता है कि इंद्र बादल रूपी विमान में घूमकर जादू दिखा रहे हैं।
    mistakes:
      बादल विमान बन गए हैं: hin10b_poem_meaning
  - prompt: '''मेखलाकार'' पर्वत का अर्थ क्या है?'
    options:
    - करघनी (कमरबंद) के आकार का, गोल घेरे वाला
    - बहुत ऊँचा
    - बर्फ़ से ढका
    - नुकीला
    answer: करघनी (कमरबंद) के आकार का, गोल घेरे वाला
    difficulty: 3
    hints:
    - '''मेखला'' कमर का गहना है।'
    - पर्वत घेरा बनाए खड़ा है।
    solution: मेखलाकार यानी करघनी की तरह गोलाई में फैला हुआ।
    mistakes:
      बहुत ऊँचा: h10bs4_drishya
  - prompt: पर्वत ताल के जल में क्या देख रहा है?
    options:
    - अपना विशाल रूप
    - मछलियाँ
    - चाँद
    - बादल
    answer: अपना विशाल रूप
    difficulty: 2
    hints:
    - ताल दर्पण की तरह है।
    - '''निज महाकार''।'
    solution: पर्वत ताल रूपी दर्पण में अपना विशाल आकार निहार रहा है।
    mistakes:
      चाँद: h10bs4_manvi
  - prompt: झरने किसका गुणगान कर रहे हैं?
    options:
    - पर्वत के गौरव का
    - बादलों का
    - ताल का
    - इंद्र का
    answer: पर्वत के गौरव का
    difficulty: 2
    hints:
    - '''गिरि का गौरव गाकर झर-झर''।'
    - वे पर्वत से निकलते हैं।
    solution: झरने पर्वत का गौरव गाते हुए बह रहे हैं।
    mistakes:
      इंद्र का: h10bs4_manvi
  - prompt: बादल छाने पर पर्वत के बारे में कवि क्या कहते हैं?
    options:
    - वह पारे जैसे पंख फड़काकर उड़ गया
    - वह गिर पड़ा
    - वह बड़ा हो गया
    - वह रोने लगा
    answer: वह पारे जैसे पंख फड़काकर उड़ गया
