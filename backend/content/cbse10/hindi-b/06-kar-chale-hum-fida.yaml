subject: cbse10-hinb
chapter: 6
title: कर चले हम फ़िदा
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_haqeeqat: "यह फ़िल्म 1964 में बनी थी और हिमालय की ऊँचाइयों पर लड़े गए युद्ध पर थी।"
  h10b_lakshman_rekha: "रामायण में एक रेखा खींची गई थी जिसे पार करने से संकट आया। यहाँ वही भाव है।"
  h10bs6_bhav: यह गीत युद्ध में शहीद होते सैनिकों की ओर से देशवासियों को संदेश है। सोचो कि पंक्ति में सैनिक क्या कह रहे हैं और क्यों।
  h10bs6_pratik: 'गीत में रामायण के प्रतीक हैं: रावण, सीता, राम-लक्ष्मण, लकीर। हर प्रतीक का देश से क्या संबंध है?'
concepts:
- code: hin10b.s6.fida
  title: कर चले हम फ़िदा (कैफ़ी आज़मी)
  notes: |
    कैफ़ी आज़मी का गीत, फ़िल्म 'हकीकत' (1964) के लिए लिखा गया, जो 1962 के भारत-चीन युद्ध पर थी। देश के लिए प्राण
    देते सैनिक साथियों से कहते हैं: हमने जान-तन न्योछावर कर दिया, अब देश तुम्हारे हवाले है। साँस थमती गई, नब्ज़
    जमती गई, फिर भी कदम नहीं रुके; सिर कट गए पर हिमालय का सिर (देश का सम्मान) नहीं झुकने दिया; मरते दम तक बाँकपन
    बना रहा। जीने के मौसम बहुत हैं, पर जान देने की रुत रोज़ नहीं आती। आज धरती दुलहन बनी है। कुर्बानियों की राह
    वीरान न हो, नए काफ़िले सजाते रहना। अपने खून से ज़मीन पर लकीर खींच दो कि इस तरफ़ कोई रावण न आ सके; कोई हाथ
    सीता (भारत माता) के दामन को न छू पाए; राम भी तुम, लक्ष्मण भी तुम।
  explanations:
    text: 'युद्ध में शहीद होते सैनिक अपने साथियों से कहते हैं: हमने देश के लिए जान दे दी, पर हिमालय का सिर नहीं झुकने दिया; अब देश की रक्षा तुम्हारे हाथ में है। सीमा पर खून से ऐसी लकीर खींच दो कि कोई दुश्मन (रावण) देश (सीता) को छू न सके।'
    visual: बर्फ़ से ढका हिमालय, उस पर गर्व से लहराता तिरंगा, और नीचे बर्फ़ पर खिंची एक लाल लकीर, जिसे लक्ष्मण-रेखा की तरह कोई पार नहीं कर सकता।
    step_by_step: '1. प्रसंग: 1962 का युद्ध, फ़िल्म ''हकीकत''। 2. आख़िरी साँस तक लड़ना। 3. हिमालय का सिर न झुकने देना। 4. जान देने की रुत रोज़ नहीं आती। 5. कुर्बानी की राह चलती रहे। 6. लकीर, रावण, सीता: सीमा की रक्षा।'
    real_world: सीमा पर तैनात सैनिक कठोर ठंड में भी पहरा देते हैं ताकि हम सुरक्षित रहें; यह गीत उन्हीं के त्याग को याद करता है।
  picture:
    kind: compare
    columns:
    - title: प्रतीक
      points:
      - हिमालय का सिर
      - खून की लकीर
      - रावण
      - सीता का दामन
    - title: अर्थ
      points:
      - देश का सम्मान
      - सीमा (लक्ष्मण-रेखा)
      - दुश्मन
      - भारत माता की मर्यादा
    alt: 'गीत के प्रतीक: हिमालय का सिर देश का सम्मान, लकीर सीमा, रावण दुश्मन और सीता का दामन देश की मर्यादा है।'
  activity:
    type: sort
    prompt: गीत में किस चीज़ से क्या मतलब है?
    bins:
    - देश का सम्मान
    - दुश्मन
    - सैनिक का साहस
    items:
    - label: हिमालय का सिर
      bin: देश का सम्मान
      clue: सिर कट गए पर क्या नहीं झुकने दिया?
      why: हिमालय का सिर = देश का गौरव।
    - label: सीता का दामन
      bin: देश का सम्मान
      clue: किसे कोई हाथ न छू पाए?
      why: सीता = भारत माता, उसकी मर्यादा।
    - label: रावण
      bin: दुश्मन
      clue: खून की लकीर किसके लिए खींचनी है?
      why: रावण = देश पर हमला करने वाला।
    - label: साँस थमती गई, फिर भी कदम नहीं रुके
      bin: सैनिक का साहस
      clue: मरते हुए भी कौन आगे बढ़ता रहा?
      why: सैनिकों का अदम्य साहस।
    - label: मरते दम तक बाँकपन
      bin: सैनिक का साहस
      clue: आख़िरी साँस तक क्या बना रहा?
      why: 'वीरता की शान: सैनिक का साहस।'
  lesson:
    - teach: '''कर चले हम फ़िदा'' कैफ़ी आज़मी का गीत है, जो 1962 के भारत-चीन युद्ध पर बनी फ़िल्म ''हकीकत'' (1964) के लिए लिखा गया। इसमें युद्धभूमि में घायल, शहीद होते सैनिक देशवासियों से कहते हैं: ''कर चले हम फ़िदा जानो-तन साथियो, अब तुम्हारे हवाले वतन साथियो।'' यानी हमने तन-मन देश पर न्योछावर कर दिया, अब देश की रक्षा तुम्हारे ज़िम्मे है।'
      check:
        prompt: यह गीत किस फ़िल्म के लिए लिखा गया?
        options:
        - हकीकत
        - बॉर्डर
        - उपकार
        answer: हकीकत
        why: यह 1962 के युद्ध पर बनी फ़िल्म है।
    - teach: 'सैनिक कहते हैं: साँसें थमती गईं, नब्ज़ जमती गई (बर्फ़ीली ठंड में), फिर भी बढ़ते कदम नहीं रुके। सिर कट गए तो ग़म नहीं, पर हिमालय का सिर (देश का सम्मान) नहीं झुकने दिया। मरते-मरते भी उनका बाँकपन (साहस, शान) बना रहा। जीने के मौक़े बहुत हैं, पर देश के लिए जान देने का अवसर रोज़ नहीं आता। आज धरती दुलहन बनी है।'
      picture:
        kind: compare
        columns:
        - title: प्रतीक
          points:
          - हिमालय का सिर
          - रावण
          - सीता का दामन
          - राम-लक्ष्मण
        - title: अर्थ
          points:
          - देश का सम्मान
          - दुश्मन
          - भारत माता की मर्यादा
          - देश के रक्षक, सैनिक और नागरिक
        alt: 'गीत के प्रतीक और अर्थ: हिमालय का सिर देश का सम्मान, रावण दुश्मन, सीता का दामन भारत माता की मर्यादा, राम-लक्ष्मण देश के रक्षक।'
      check:
        prompt: '''सर हिमालय का हमने न झुकने दिया'' का अर्थ क्या है?'
        options:
        - देश का सम्मान बनाए रखा
        - हिमालय पर चढ़ गए
        - पहाड़ काट दिया
        answer: देश का सम्मान बनाए रखा
        why: हिमालय भारत के गौरव का प्रतीक है।
    - teach: सैनिक अगली पीढ़ी से कहते हैं कि क़ुर्बानी की राह कभी सूनी न हो; नए काफ़िले सजाते रहना। जीत का जश्न इस शहादत के बाद आएगा। सिर पर कफ़न बाँध लो। अपने ख़ून से धरती पर लकीर (लक्ष्मण-रेखा जैसी सीमा) खींच दो ताकि कोई रावण इधर न आए; जो हाथ उठे उसे तोड़ दो, ताकि सीता के दामन (भारत माता की मर्यादा) को कोई न छू पाए। तुम ही राम हो, तुम ही लक्ष्मण।
      check:
        prompt: '''इस तरफ़ आने पाए न रावन कोई'' में ''रावण'' किसका प्रतीक है?'
        options:
        - देश का दुश्मन
        - एक राजा
        - एक सैनिक
        answer: देश का दुश्मन
        why: जो सीमा लाँघकर आए।
  items:
  - prompt: '''कर चले हम फ़िदा'' गीत किसने लिखा?'
    options:
    - कैफ़ी आज़मी
    - वीरेन डंगवाल
    - शैलेंद्र
    - निदा फ़ाज़ली
    answer: कैफ़ी आज़मी
    difficulty: 1
    hints:
    - उर्दू के प्रसिद्ध शायर।
    - शबाना आज़मी के पिता।
    solution: कैफ़ी आज़मी।
    mistakes:
      शैलेंद्र: hin10b_author
  - prompt: यह गीत किस फ़िल्म के लिए लिखा गया?
    options:
    - हकीकत
    - तीसरी कसम
    - संगम
    - बॉर्डर
    answer: हकीकत
    difficulty: 1
    hints:
    - 1964 की फ़िल्म।
    - युद्ध पर आधारित।
    solution: फ़िल्म 'हकीकत' (1964)।
    mistakes:
      तीसरी कसम: hin10b_read_again
  - prompt: फ़िल्म 'हकीकत' किस युद्ध पर आधारित थी?
    options:
    - 1962 का भारत-चीन युद्ध
    - 1971 का भारत-पाक युद्ध
    - 1857 का संग्राम
    - कारगिल युद्ध
    answer: 1962 का भारत-चीन युद्ध
    difficulty: 2
    hints:
    - हिमालय पर लड़ाई।
    - उत्तर-पूर्वी पड़ोसी देश।
    solution: 1962 का भारत-चीन युद्ध।
    mistakes: {"1971 का भारत-पाक युद्ध": "h10b_haqeeqat"}
  - prompt: '''सर हिमालय का हमने न झुकने दिया'' का अर्थ क्या है?'
    options:
    - सैनिकों ने देश का सम्मान बनाए रखा
    - सैनिक हिमालय पर चढ़े
    - हिमालय बहुत ऊँचा है
    - सैनिकों ने सिर नहीं झुकाया क्योंकि वे थके नहीं थे
    answer: सैनिकों ने देश का सम्मान बनाए रखा
    difficulty: 2
    hints:
    - हिमालय भारत का प्रतीक है।
    - गौरव।
    solution: जान देकर भी देश का गौरव और सम्मान नहीं गिरने दिया।
    mistakes:
      सैनिक हिमालय पर चढ़े: hin10b_poem_meaning
  - prompt: गीत में 'सीता का दामन' किसका प्रतीक है?
    options:
    - भारत माता की मर्यादा
    - रामायण की कथा
    - स्त्रियों के वस्त्र
    - हिमालय
    answer: भारत माता की मर्यादा
    difficulty: 2
    hints:
    - '''छू न पाए सीता का दामन कोई''।'
    - देश को माँ माना जाता है।
    solution: सीता का दामन देश (भारत माता) की इज़्ज़त का प्रतीक है।
    mistakes:
      रामायण की कथा: hin10b_poem_meaning
  - prompt: '''खींच दो अपने खूँ से ज़मीं पर लकीर'' में किसकी ओर संकेत है?'
    options:
    - लक्ष्मण-रेखा की तरह सीमा की रक्षा
    - नक्शा बनाने की
    - खेल के मैदान की
    - सड़क बनाने की
    answer: लक्ष्मण-रेखा की तरह सीमा की रक्षा
    difficulty: 3
    hints:
    - उस लकीर को रावण पार न कर सके।
    - रामायण का प्रसंग।
    solution: लक्ष्मण-रेखा की तरह देश की सीमा ऐसी बनाओ कि कोई दुश्मन पार न कर सके।
    mistakes: {"नक्शा बनाने की": "h10b_lakshman_rekha"}
  - prompt: कैफ़ी आज़मी का असली नाम क्या था?
    options:
    - अतहर हुसैन रिज़वी
    - जावेद अख़्तर
    - साहिर लुधियानवी
    - मजरूह सुल्तानपुरी
    answer: अतहर हुसैन रिज़वी
    difficulty: 3
    hints:
    - '''कैफ़ी'' उपनाम है।'
    - वे उत्तर प्रदेश के आज़मगढ़ से थे।
    solution: कैफ़ी आज़मी का असली नाम अतहर हुसैन रिज़वी था।
    mistakes:
      साहिर लुधियानवी: hin10b_author
  - prompt: '''साँस थमती गई, नब्ज़ जमती गई'' किस स्थिति का वर्णन है?'
    options:
    - बर्फ़ीली ठंड और घावों में भी सैनिक लड़ते रहे
    - सैनिक सो गए
    - सैनिक भाग गए
    - युद्ध ख़त्म हो गया
    answer: बर्फ़ीली ठंड और घावों में भी सैनिक लड़ते रहे
    difficulty: 2
    hints:
    - युद्ध हिमालय पर था।
    - '''फिर भी बढ़ते कदम को न रुकने दिया''।'
    solution: मरते समय भी सैनिक आगे बढ़ते रहे।
    mistakes:
      सैनिक भाग गए: h10bs6_bhav
  - prompt: '''मरते-मरते रहा बाँकपन साथियो'' में ''बाँकपन'' का अर्थ है:'
    options:
    - साहस और शान
    - डर
    - थकान
    - आलस्य
    answer: साहस और शान
    difficulty: 2
    hints:
    - एक वीर की अदा।
    - मृत्यु के समय भी नहीं गया।
    solution: बाँकपन यानी जवानी का जोश, साहस और शान।
    mistakes:
      डर: h10bs6_bhav
  - prompt: '''जान देने की रुत रोज़ आती नहीं'' का क्या भाव है?'
    options:
    - देश के लिए बलिदान का अवसर सौभाग्य से मिलता है
    - मौसम रोज़ बदलता है
    - जीना आसान है
    - रोज़ युद्ध होता है
    answer: देश के लिए बलिदान का अवसर सौभाग्य से मिलता है
    difficulty: 2
    hints:
    - '''ज़िंदा रहने के मौसम बहुत हैं''।'
    - पर देश पर मरने का मौक़ा कम।
    solution: जीने के अवसर बहुत हैं, देश के लिए शहीद होने का मौक़ा कभी-कभी ही आता है।
    mistakes:
      मौसम रोज़ बदलता है: h10bs6_bhav
  - prompt: '''आज धरती बनी है दुलहन'' से क्या आशय है?'
    options:
    - शहीदों के ख़ून से धरती सजी है, मानो दुलहन हो
    - धरती पर शादी हो रही है
