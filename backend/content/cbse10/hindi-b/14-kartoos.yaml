subject: cbse10-hinb
chapter: 14
title: कारतूस
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_ekanki: "इसमें पात्र, संवाद और मंच निर्देश हैं, और एक ही अंक है।"
  h10b_jaan_bakhshi: "कर्नल ने अनजाने में वज़ीर अली की मदद की थी। वज़ीर अली ने बदले में क्या दिखाया?"
  h10b_kartoos_maang: "एकांकी का नाम ही बता रहा है कि सवार ने क्या माँगा।"
  h10bs14_itihas: 'एकांकी के पीछे इतिहास है: अवध की गद्दी, कंपनी की चाल, वकील की हत्या, अंग्रेज़ों से टक्कर। प्रश्न किस घटना से जुड़ा है?'
  h10bs14_patra: 'कर्नल, लेफ़्टिनेंट, सिपाही और सवार (जो असल में वज़ीर अली है): हर पात्र की बात अलग है। किसने क्या कहा या किया?'
concepts:
- code: hin10b.s14.kartoos
  title: कारतूस (हबीब तनवीर)
  notes: |
    हबीब तनवीर का एकांकी। अवध के नवाब आसिफ़उद्दौला के बेटे वज़ीर अली को अंग्रेज़ों ने गद्दी से हटाकर सआदत अली को नवाब
    बनाया और वज़ीर अली को बनारस भेज दिया। अंग्रेज़ों से नफ़रत करने वाले वज़ीर अली ने कंपनी के वकील की हत्या कर दी और
    तब से अंग्रेज़ों को चकमा देता फिर रहा था; वह नेपाल जाना चाहता था। कर्नल कालिंज का खेमा जंगल में है; कर्नल और
    लेफ़्टिनेंट वज़ीर अली की बहादुरी की चर्चा करते हैं और उसकी तुलना रॉबिनहुड से करते हैं। एक घुड़सवार आता है, कर्नल
    से अकेले में मिलकर कहता है कि वज़ीर अली को पकड़ने के लिए कारतूस चाहिए। कर्नल दस कारतूस दे देता है। नाम पूछने पर
    सवार कहता है: 'वज़ीर अली। आपने मुझे कारतूस दिए, इसलिए आपकी जान बख्शी करता हूँ', और चला जाता है। कर्नल कहता है:
    'एक जाँबाज़ सिपाही'।
  explanations:
    text: अंग्रेज़ों ने वज़ीर अली को अवध की गद्दी से हटाया; उसने कंपनी के वकील को मार डाला और अंग्रेज़ उसे पकड़ नहीं पा रहे थे। वह खुद अकेला कर्नल के खेमे में आया, उससे कारतूस लिए, अपना नाम बताया और कर्नल की जान बख्श दी। कर्नल को मानना पड़ा कि वह 'जाँबाज़ सिपाही' है।
    visual: जंगल में अंग्रेज़ कर्नल का खेमा, रात का समय। एक घुड़सवार अंदर आता है, कर्नल उसे कारतूसों की थैली देता है; घुड़सवार दरवाज़े पर मुड़कर कहता है 'वज़ीर अली', और कर्नल हक्का-बक्का खड़ा रह जाता है।
    step_by_step: 1. वज़ीर अली को गद्दी से हटाना, बनारस भेजना। 2. कंपनी के वकील की हत्या। 3. कर्नल के खेमे में चर्चा, रॉबिनहुड से तुलना। 4. सवार का आना, कारतूस माँगना। 5. नाम बताना, जान बख्शना। 6. 'जाँबाज़ सिपाही'।
    real_world: इतिहास में कई वीर ऐसे थे जिनकी हिम्मत की तारीफ़ उनके दुश्मनों ने भी की; कर्नल का 'जाँबाज़ सिपाही' कहना वैसी ही तारीफ़ है।
  picture:
    kind: flow
    steps:
    - अंग्रेज़ों ने वज़ीर अली को गद्दी से हटाया
    - बनारस भेजा गया
    - कंपनी के वकील की हत्या
    - कर्नल के खेमे में अकेले पहुँचा
    - कारतूस लिए, नाम बताया, जान बख्शी
    alt: 'वज़ीर अली की कहानी: गद्दी से हटाया जाना, वकील की हत्या, और कर्नल के खेमे से कारतूस लेकर निकल जाना।'
  activity:
    type: order
    prompt: एकांकी 'कारतूस' की घटनाएँ क्रम से लगाओ।
    steps:
    - अंग्रेज़ वज़ीर अली को गद्दी से हटाते हैं
    - वज़ीर अली कंपनी के वकील की हत्या करता है
    - कर्नल के खेमे में वज़ीर अली की बहादुरी की चर्चा
    - घुड़सवार अकेले में कारतूस माँगता है
    - '"वज़ीर अली... आपकी जान बख्शी करता हूँ"'
    reasons:
      वज़ीर अली कंपनी के वकील की हत्या करता है: गद्दी से हटाए जाने के बाद ही उसकी अंग्रेज़ों से नफ़रत बढ़ी।
      कर्नल के खेमे में वज़ीर अली की बहादुरी की चर्चा: हत्या के बाद से अंग्रेज़ उसे पकड़ने निकले हैं।
      घुड़सवार अकेले में कारतूस माँगता है: चर्चा के बीच ही सवार आता है।
      '"वज़ीर अली... आपकी जान बख्शी करता हूँ"': कारतूस मिलने के बाद ही वह अपना नाम बताता है।
  lesson:
    - teach: '''कारतूस'' हबीब तनवीर का एकांकी है, 1799 के समय का। गोरखपुर के जंगल में कर्नल कालिंज का ख़ेमा लगा है। वह वज़ीर अली को पकड़ने आया है। वज़ीर अली अवध के नवाब आसिफ़उद्दौला का बेटा था; अंग्रेज़ों ने उसे गद्दी से हटाकर उसके चाचा सआदत अली को नवाब बना दिया और वज़ीर अली को बनारस भेज दिया।'
      check:
        prompt: अंग्रेज़ों ने वज़ीर अली की जगह किसे नवाब बनाया?
        options:
        - सआदत अली
        - आसिफ़उद्दौला
        - टीपू सुल्तान
        answer: सआदत अली
        why: वह अंग्रेज़ों का समर्थक था।
    - teach: गवर्नर जनरल ने वज़ीर अली को कलकत्ता बुलाया। उसने कंपनी के वकील से शिकायत की, पर वकील ने उसे बुरा-भला कहा; वज़ीर अली ने ख़ंजर से वकील को मार डाला और भाग निकला। वह नेपाल पहुँचकर अफ़ग़ानिस्तान के बादशाह शाहे-ज़मा की मदद से अंग्रेज़ों को देश से निकालना चाहता था। वह इतना साहसी था कि कर्नल उसे रॉबिनहुड जैसा कहता है।
      picture:
        kind: flow
        steps:
        - गद्दी से हटाया
        - बनारस भेजा
        - वकील की हत्या
        - जंगल में छिपा
        - कर्नल से कारतूस लिए
        - जान बख्शी
        alt: 'वज़ीर अली की कहानी: गद्दी से हटाया गया, बनारस भेजा गया, वकील की हत्या की, जंगल में छिपा, कर्नल से कारतूस लिए और उसकी जान बख्शी।'
      check:
        prompt: वज़ीर अली ने वकील को क्यों मारा?
        options:
        - वकील ने शिकायत सुनने के बजाय उसे बुरा-भला कहा
        - वकील ने पैसे चुराए
        - वकील ने उसे गिरफ़्तार किया
        answer: वकील ने शिकायत सुनने के बजाय उसे बुरा-भला कहा
        why: अपमान से वह क्रोधित हो गया।
    - teach: 'एक घुड़सवार अकेला कर्नल के ख़ेमे में आता है और वज़ीर अली को पकड़ने के लिए कुछ कारतूस माँगता है। कर्नल उसे दस कारतूस दे देता है। जाते-जाते सवार अपना नाम बताता है: ''वज़ीर अली। आपने मुझे कारतूस दिए, इसलिए आपकी जान बख्शता हूँ।'' कर्नल हक्का-बक्का रह जाता है और कहता है: ''एक जाँबाज़ सिपाही।'''
      check:
        prompt: सवार ने कर्नल से कितने कारतूस लिए?
        options:
        - दस
        - सौ
        - एक
        answer: दस
        why: कर्नल ने बिना पहचाने दे दिए।
  items:
  - prompt: '''कारतूस'' एकांकी के लेखक कौन हैं?'
    options:
    - हबीब तनवीर
    - प्रेमचंद
    - राही मासूम रज़ा
    - निदा फ़ाज़ली
    answer: हबीब तनवीर
    difficulty: 1
    hints:
    - प्रसिद्ध नाटककार और रंगकर्मी।
    - '''आगरा बाज़ार''।'
    solution: हबीब तनवीर।
    mistakes:
      राही मासूम रज़ा: hin10b_author
  - prompt: '''कारतूस'' किस विधा की रचना है?'
    options:
    - एकांकी
    - कविता
    - डायरी
    - संस्मरण
    answer: एकांकी
    difficulty: 1
    hints:
    - इसमें संवाद और पात्र हैं।
    - एक अंक का नाटक।
    solution: एकांकी (एक अंक का नाटक)।
    mistakes: {"कविता": "h10b_ekanki"}
  - prompt: वज़ीर अली ने किसकी हत्या की थी?
    options:
    - कंपनी के वकील की
    - कर्नल कालिंज की
    - सआदत अली की
    - लेफ़्टिनेंट की
    answer: कंपनी के वकील की
    difficulty: 2
    hints:
    - बनारस में।
    - कंपनी का एक अधिकारी।
    solution: उसने कंपनी के वकील की हत्या की।
    mistakes:
      कर्नल कालिंज की: hin10b_read_again
  - prompt: सवार ने कर्नल से क्या माँगा?
    options:
    - कारतूस
    - घोड़ा
    - पैसे
    - खाना
    answer: कारतूस
    difficulty: 1
    hints:
    - पाठ का शीर्षक।
    - बंदूक की गोलियाँ।
    solution: उसने कारतूस माँगे; कर्नल ने दस कारतूस दिए।
    mistakes: {"घोड़ा": "h10b_kartoos_maang"}
  - prompt: वज़ीर अली ने कर्नल की जान क्यों बख्श दी?
    options:
    - क्योंकि कर्नल ने उसे कारतूस दिए थे
    - क्योंकि कर्नल उसका दोस्त था
    - क्योंकि उसके पास हथियार नहीं थे
    - क्योंकि सिपाही आ गए थे
    answer: क्योंकि कर्नल ने उसे कारतूस दिए थे
    difficulty: 2
    hints:
    - उसने खुद कारण बताया।
    - '''आपने मुझे कारतूस दिए, इसलिए...'''
    solution: कर्नल ने उसे कारतूस दिए थे, इसलिए उसने जान बख्श दी।
    mistakes: {"क्योंकि कर्नल उसका दोस्त था": "h10b_jaan_bakhshi"}
  - prompt: कर्नल ने अंत में वज़ीर अली को क्या कहा?
    options:
    - एक जाँबाज़ सिपाही
    - एक डरपोक चोर
    - एक धोखेबाज़
    - एक पागल
    answer: एक जाँबाज़ सिपाही
    difficulty: 3
    hints:
    - दुश्मन की भी तारीफ़।
    - बहादुर।
    solution: कर्नल ने उसे 'एक जाँबाज़ सिपाही' कहा।
    mistakes:
      एक धोखेबाज़: hin10b_poem_meaning
  - prompt: कर्नल का ख़ेमा कहाँ लगा था?
    options:
    - गोरखपुर के जंगल में
    - कलकत्ता में
    - बनारस में
    - लखनऊ के महल में
    answer: गोरखपुर के जंगल में
    difficulty: 2
    hints:
    - वज़ीर अली जंगल में छिपा था।
    - नेपाल के रास्ते के पास।
    solution: कर्नल कालिंज का ख़ेमा गोरखपुर के जंगल में था।
    mistakes:
      कलकत्ता में: h10bs14_itihas
  - prompt: वज़ीर अली किस नवाब का बेटा था?
    options:
    - आसिफ़उद्दौला
    - सआदत अली
    - शमसुद्दौला
    - टीपू सुल्तान
    answer: आसिफ़उद्दौला
    difficulty: 2
    hints:
    - अवध का नवाब।
    - उसके भाई को गद्दी मिली।
    solution: वज़ीर अली अवध के नवाब आसिफ़उद्दौला का बेटा था।
    mistakes:
      सआदत अली: h10bs14_itihas
  - prompt: वज़ीर अली किस बादशाह की मदद से अंग्रेज़ों को निकालना चाहता था?
    options:
    - अफ़ग़ानिस्तान के शाहे-ज़मा
    - मुग़ल बादशाह
    - नेपाल के राजा
    - फ़्रांस के नेपोलियन
    answer: अफ़ग़ानिस्तान के शाहे-ज़मा
    difficulty: 3
    hints:
    - एक पड़ोसी देश का शासक।
    - उसे हिंदुस्तान पर हमले का न्योता दिया गया।
    solution: वज़ीर अली, टीपू सुल्तान और बंगाल के नवाब ने अफ़ग़ानिस्तान के शाहे-ज़मा को न्योता दिया।
    mistakes:
      फ़्रांस के नेपोलियन: h10bs14_itihas
  - prompt: कर्नल ने वज़ीर अली की तुलना किससे की?
    options:
    - रॉबिनहुड से
    - नेपोलियन से
    - सिकंदर से
    - रावण से
    answer: रॉबिनहुड से
    difficulty: 2
    hints:
    - एक प्रसिद्ध साहसी डाकू।
    - जो अमीरों से लड़ता।
    solution: कर्नल ने वज़ीर अली के साहस के लिए उसे रॉबिनहुड जैसा कहा।
    mistakes:
      नेपोलियन से: h10bs14_patra
  - prompt: वज़ीर अली की मुख्य इच्छा क्या थी?
    options:
    - अंग्रेज़ों को देश से बाहर निकालना
    - धन कमाना
    - कर्नल से दोस्ती
    - नेपाल में बस जाना
    answer: अंग्रेज़ों को देश से बाहर निकालना
    difficulty: 1
    hints:
