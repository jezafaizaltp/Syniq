subject: cbse10-hinb
chapter: 14
title: कारतूस
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_ekanki: "इसमें पात्र, संवाद और मंच निर्देश हैं, और एक ही अंक है।"
  h10b_jaan_bakhshi: "कर्नल ने अनजाने में वज़ीर अली की मदद की थी। वज़ीर अली ने बदले में क्या दिखाया?"
  h10b_kartoos_maang: "एकांकी का नाम ही बता रहा है कि सवार ने क्या माँगा।"
concepts:
- code: hin10b.s14.kartoos
  title: कारतूस (हबीब तनवीर)
  notes: |
    हबीब तनवीर का एकांकी। अवध के नवाब आसिफ़उद्दौला के बेटे वज़ीर अली को अंग्रेज़ों ने गद्दी से हटाकर सआदत अली को नवाब
    बनाया और वज़ीर अली को बनारस भेज दिया। अंग्रेज़ों से नफ़रत करने वाले वज़ीर अली ने कंपनी के वकील की हत्या कर दी और
    तब से अंग्रेज़ों को चकमा देता फिर रहा था; वह नेपाल जाना चाहता था। कर्नल कालिंज का खेमा जंगल में है; कर्नल और
    लेफ़्टिनेंट वज़ीर अली की बहादुरी की चर्चा करते हैं और उसकी तुलना रॉबिनहुड से करते हैं। एक घुड़सवार आता है, कर्नल
    से अकेले में मिलकर कहता है कि वज़ीर अली को पकड़ने के लिए कारतूस चाहिए। कर्नल दस कारतूस दे देता है। नाम पूछने पर
    सवार कहता है: 'वज़ीर अली। आपने मुझे कारतूस दिए, इसलिए आपकी जान बख्शी करता हूँ', और चला जाता है। कर्नल कहता है:
    'एक जाँबाज़ सिपाही'।
  explanations:
    text: अंग्रेज़ों ने वज़ीर अली को अवध की गद्दी से हटाया; उसने कंपनी के वकील को मार डाला और अंग्रेज़ उसे पकड़ नहीं पा रहे थे। वह खुद अकेला कर्नल के खेमे में आया, उससे कारतूस लिए, अपना नाम बताया और कर्नल की जान बख्श दी। कर्नल को मानना पड़ा कि वह 'जाँबाज़ सिपाही' है।
    visual: जंगल में अंग्रेज़ कर्नल का खेमा, रात का समय। एक घुड़सवार अंदर आता है, कर्नल उसे कारतूसों की थैली देता है; घुड़सवार दरवाज़े पर मुड़कर कहता है 'वज़ीर अली', और कर्नल हक्का-बक्का खड़ा रह जाता है।
    step_by_step: 1. वज़ीर अली को गद्दी से हटाना, बनारस भेजना। 2. कंपनी के वकील की हत्या। 3. कर्नल के खेमे में चर्चा, रॉबिनहुड से तुलना। 4. सवार का आना, कारतूस माँगना। 5. नाम बताना, जान बख्शना। 6. 'जाँबाज़ सिपाही'।
    real_world: इतिहास में कई वीर ऐसे थे जिनकी हिम्मत की तारीफ़ उनके दुश्मनों ने भी की; कर्नल का 'जाँबाज़ सिपाही' कहना वैसी ही तारीफ़ है।
  picture:
    kind: flow
    steps:
    - अंग्रेज़ों ने वज़ीर अली को गद्दी से हटाया
    - बनारस भेजा गया
    - कंपनी के वकील की हत्या
    - कर्नल के खेमे में अकेले पहुँचा
    - कारतूस लिए, नाम बताया, जान बख्शी
    alt: 'वज़ीर अली की कहानी: गद्दी से हटाया जाना, वकील की हत्या, और कर्नल के खेमे से कारतूस लेकर निकल जाना।'
  items:
  - prompt: '''कारतूस'' एकांकी के लेखक कौन हैं?'
    options:
    - हबीब तनवीर
    - प्रेमचंद
    - राही मासूम रज़ा
    - निदा फ़ाज़ली
    answer: हबीब तनवीर
    difficulty: 1
    hints:
    - प्रसिद्ध नाटककार और रंगकर्मी।
    - '''आगरा बाज़ार''।'
    solution: हबीब तनवीर।
    mistakes:
      राही मासूम रज़ा: hin10b_author
  - prompt: '''कारतूस'' किस विधा की रचना है?'
    options:
    - एकांकी
    - कविता
    - डायरी
    - संस्मरण
    answer: एकांकी
    difficulty: 1
    hints:
    - इसमें संवाद और पात्र हैं।
    - एक अंक का नाटक।
    solution: एकांकी (एक अंक का नाटक)।
    mistakes: {"कविता": "h10b_ekanki"}
  - prompt: वज़ीर अली ने किसकी हत्या की थी?
    options:
    - कंपनी के वकील की
    - कर्नल कालिंज की
    - सआदत अली की
    - लेफ़्टिनेंट की
    answer: कंपनी के वकील की
    difficulty: 2
    hints:
    - बनारस में।
    - कंपनी का एक अधिकारी।
    solution: उसने कंपनी के वकील की हत्या की।
    mistakes:
      कर्नल कालिंज की: hin10b_read_again
  - prompt: सवार ने कर्नल से क्या माँगा?
    options:
    - कारतूस
    - घोड़ा
    - पैसे
    - खाना
    answer: कारतूस
    difficulty: 1
    hints:
    - पाठ का शीर्षक।
    - बंदूक की गोलियाँ।
    solution: उसने कारतूस माँगे; कर्नल ने दस कारतूस दिए।
    mistakes: {"घोड़ा": "h10b_kartoos_maang"}
  - prompt: वज़ीर अली ने कर्नल की जान क्यों बख्श दी?
    options:
    - क्योंकि कर्नल ने उसे कारतूस दिए थे
    - क्योंकि कर्नल उसका दोस्त था
    - क्योंकि उसके पास हथियार नहीं थे
    - क्योंकि सिपाही आ गए थे
    answer: क्योंकि कर्नल ने उसे कारतूस दिए थे
    difficulty: 2
    hints:
    - उसने खुद कारण बताया।
    - '''आपने मुझे कारतूस दिए, इसलिए...'''
    solution: कर्नल ने उसे कारतूस दिए थे, इसलिए उसने जान बख्श दी।
    mistakes: {"क्योंकि कर्नल उसका दोस्त था": "h10b_jaan_bakhshi"}
  - prompt: कर्नल ने अंत में वज़ीर अली को क्या कहा?
    options:
    - एक जाँबाज़ सिपाही
    - एक डरपोक चोर
    - एक धोखेबाज़
    - एक पागल
    answer: एक जाँबाज़ सिपाही
    difficulty: 3
    hints:
    - दुश्मन की भी तारीफ़।
    - बहादुर।
    solution: कर्नल ने उसे 'एक जाँबाज़ सिपाही' कहा।
    mistakes:
      एक धोखेबाज़: hin10b_poem_meaning
