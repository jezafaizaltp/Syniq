# CBSE Class 10 Hindi B (NCERT Sparsh 2). Chapter numbers here are SYNiq's own order.
# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hinb
chapter: 2
title: पद (मीरा)
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_draupadi: "सभा में द्रौपदी का वस्त्र खींचा जा रहा था। कृष्ण ने उसी वस्त्र के साथ क्या किया?"
  h10b_meera_bhasha: "मीरा राजस्थान की थीं और ब्रज व गुजरात तक घूमीं। उनकी भाषा में इन जगहों का मेल है।"
  h10b_prahlad: "नरसिंह रूप हिरण्यकशिपु को मारने के लिए था। उसका भक्त पुत्र कौन था?"
  h10bs2_pad: पहले पद में मीरा कृष्ण से दुख दूर करने की विनती करती हैं; दूसरे में उनकी दासी बनने की इच्छा। प्रश्न किस पद का है?
  h10bs2_bhakt: पहले पद में तीन भक्तों के उदाहरण हैं, हर एक का संकट अलग था। किसे किस संकट से बचाया गया?
concepts:
- code: hin10b.s2.meera
  title: मीरा के पद
  notes: |
    मीराबाई कृष्ण की भक्त कवयित्री; भाषा राजस्थानी, ब्रज और गुजराती का मेल। पहला पद: 'हरि आप हरो जन री भीर'।
    मीरा कृष्ण से अपनी पीड़ा दूर करने को कहती हैं और याद दिलाती हैं कि उन्होंने द्रौपदी की लाज रखी (चीर बढ़ाया),
    भक्त प्रह्लाद के लिए नरसिंह रूप धरा, डूबते गजराज (हाथी) को मगरमच्छ से बचाया। दूसरा पद: 'स्याम म्हाने चाकर
    राखो जी'। मीरा कृष्ण की दासी (चाकर) बनना चाहती हैं: चाकरी में दर्शन, स्मरण (वेतन/खर्ची) और भाव-भक्ति की
    जागीर मिलेगी। कृष्ण का रूप: मोर मुकुट, पीतांबर, गले में वैजयंती माला, वृंदावन में गाय चराते, मुरली बजाते।
    मीरा ऊँचे महल बनाकर बीच-बीच में फुलवारी लगाना चाहती हैं और आधी रात यमुना किनारे दर्शन चाहती हैं।
  explanations:
    text: 'मीरा कृष्ण से कहती हैं: जैसे आपने द्रौपदी की लाज बचाई, प्रह्लाद के लिए नरसिंह बने और गजराज को बचाया, वैसे ही मेरी पीड़ा भी हरो। दूसरे पद में वे कृष्ण की नौकरानी बनना चाहती हैं, क्योंकि इस नौकरी में उन्हें रोज़ दर्शन, स्मरण और भक्ति की जागीर मिलेगी।'
    visual: 'तीन चित्र: सभा में द्रौपदी का बढ़ता चीर; खंभे से निकलते नरसिंह; पानी में मगरमच्छ से जूझता हाथी। फिर चौथा: मोर मुकुट और पीतांबर पहने कृष्ण, जिनकी सेविका बनना मीरा चाहती हैं।'
    step_by_step: '1. पहला पद: पीड़ा हरने की प्रार्थना। 2. तीन उदाहरण: द्रौपदी, नरसिंह (प्रह्लाद), गजराज। 3. दूसरा पद: चाकर बनने की इच्छा। 4. चाकरी के तीन लाभ: दर्शन, स्मरण, भाव-भक्ति। 5. कृष्ण का रूप-वर्णन।'
    real_world: जैसे कोई अपने प्रिय के पास रहने के लिए छोटा-सा काम भी खुशी से कर ले, मीरा कृष्ण के पास रहने के लिए उनकी सेविका बनना चाहती हैं।
  picture:
    kind: flow
    steps:
    - 'द्रौपदी की लाज: चीर बढ़ाया'
    - प्रह्लाद के लिए नरसिंह रूप
    - गजराज को मगरमच्छ से बचाया
    - 'मीरा: मेरी पीड़ा भी हरो'
    alt: 'मीरा कृष्ण के तीन उपकार गिनाती हैं: द्रौपदी, प्रह्लाद और गजराज की रक्षा, फिर अपनी पीड़ा हरने को कहती हैं।'
  activity:
    type: sort
    prompt: पहले पद में ईश्वर ने किसकी कैसे रक्षा की?
    bins:
    - द्रौपदी
    - प्रह्लाद
    - गजराज
    items:
    - label: चीर बढ़ाकर लाज रखी
      bin: द्रौपदी
      clue: भरी सभा में किसकी लाज बचाई गई?
      why: कृष्ण ने चीर बढ़ाकर द्रौपदी की लाज रखी।
    - label: सभा में अपमान से बचाया
      bin: द्रौपदी
      clue: चीरहरण किसका हो रहा था?
      why: द्रौपदी।
    - label: नरसिंह रूप धरा
      bin: प्रह्लाद
      clue: भक्त बालक को बचाने के लिए कौन-सा रूप?
      why: प्रह्लाद के लिए नरसिंह अवतार।
    - label: मगरमच्छ से बचाया
      bin: गजराज
      clue: पानी में किसका पैर पकड़ा गया था?
      why: डूबते हाथी (गजराज) को मगर से छुड़ाया।
  lesson:
    - teach: मीराबाई सगुण कृष्ण-भक्त कवयित्री थीं। उनका जन्म राजस्थान के कुड़की गाँव में हुआ और विवाह मेवाड़ के राजकुमार भोजराज से। उनके गुरु संत रैदास (रविदास) माने जाते हैं। उनके पदों की भाषा राजस्थानी, ब्रज और गुजराती का मेल है। वे कृष्ण को 'गिरधर नागर' कहकर पुकारती हैं।
      check:
        prompt: मीरा के गुरु कौन माने जाते हैं?
        options:
        - रैदास
        - कबीर
        - तुलसीदास
        answer: रैदास
        why: संत रैदास निर्गुण संत थे।
    - teach: 'पहले पद में मीरा कहती हैं: ''हरि आप हरो जन री भीर'' — हे हरि, अपने भक्तों का दुख आप ही दूर करते हैं। उन्होंने द्रौपदी की लाज बचाने के लिए चीर बढ़ाया, भक्त प्रह्लाद के लिए नरसिंह रूप धरा, और डूबते गजराज (हाथी) को मगरमच्छ से बचाया। मीरा विनती करती हैं कि उनकी पीड़ा भी ऐसे ही हर लें।'
      picture:
        kind: compare
        columns:
        - title: भक्त
          points:
          - द्रौपदी
          - प्रह्लाद
          - गजराज
        - title: कृष्ण की सहायता
          points:
          - चीर बढ़ाया
          - नरसिंह रूप धरा
          - मगरमच्छ से बचाया
        alt: 'मीरा के पहले पद में तीन भक्त और उनकी सहायता: द्रौपदी का चीर बढ़ाया, प्रह्लाद के लिए नरसिंह रूप, गजराज को मगरमच्छ से बचाया।'
      check:
        prompt: प्रह्लाद की रक्षा के लिए भगवान ने कौन-सा रूप धारण किया?
        options:
        - नरसिंह
        - वामन
        - मत्स्य
        answer: नरसिंह
        why: आधे मनुष्य, आधे सिंह का रूप।
    - teach: 'दूसरे पद ''स्याम म्हाने चाकर राखो जी'' में मीरा कृष्ण की नौकरानी बनना चाहती हैं। वे बाग लगाएँगी, रोज़ सुबह दर्शन पाएँगी, वृंदावन की कुंज गलियों में गोविंद की लीला गाएँगी। चाकरी के बदले उन्हें तीन चीज़ें मिलेंगी: दर्शन, स्मरण (खर्ची) और भाव-भक्ति (जागीर)। वे ऊँचे महलों के बीच खिड़कियाँ बनाकर, कुसुंबी साड़ी पहनकर दर्शन करना चाहती हैं, और आधी रात यमुना किनारे दर्शन की विनती करती हैं।'
      check:
        prompt: चाकरी के बदले मीरा क्या पाना चाहती हैं?
        options:
        - दर्शन, स्मरण और भाव-भक्ति
        - धन और महल
        - राज्य
        answer: दर्शन, स्मरण और भाव-भक्ति
        why: ये ही उनकी 'खर्ची' और 'जागीर' हैं।
  items:
  - prompt: इन पदों की रचयिता कौन हैं?
    options:
    - मीराबाई
    - महादेवी वर्मा
    - सुभद्राकुमारी चौहान
    - कबीर
    answer: मीराबाई
    difficulty: 1
    hints:
    - कृष्ण की दीवानी।
    - राजस्थान की भक्त कवयित्री।
    solution: मीराबाई।
    mistakes:
      महादेवी वर्मा: hin10b_author
  - prompt: कृष्ण ने द्रौपदी की लाज कैसे रखी?
    options:
    - चीर बढ़ाकर
    - युद्ध करके
    - सभा छोड़कर
    - धन देकर
    answer: चीर बढ़ाकर
    difficulty: 1
    hints:
    - भरी सभा का प्रसंग।
    - वस्त्र।
    solution: उन्होंने द्रौपदी का चीर बढ़ा दिया।
    mistakes: {"युद्ध करके": "h10b_draupadi"}
  - prompt: कृष्ण ने गजराज को किससे बचाया?
    options:
    - मगरमच्छ से
    - शेर से
    - आग से
    - शिकारी से
    answer: मगरमच्छ से
    difficulty: 1
    hints:
    - गजराज पानी में डूब रहा था।
    - पानी का जीव।
    solution: डूबते गजराज को मगरमच्छ से बचाया।
    mistakes:
      शेर से: hin10b_read_again
  - prompt: भक्त के लिए 'नरहरि' (नरसिंह) रूप किसके लिए धारण किया गया?
    options:
    - प्रह्लाद
    - ध्रुव
    - सुदामा
    - अर्जुन
    answer: प्रह्लाद
    difficulty: 2
    hints:
    - हिरण्यकशिपु का पुत्र।
    - खंभे से प्रकट।
    solution: प्रह्लाद की रक्षा के लिए।
    mistakes: {"ध्रुव": "h10b_prahlad"}
  - prompt: मीरा कृष्ण की चाकरी क्यों करना चाहती हैं?
    options:
    - उन्हें दर्शन, स्मरण और भाव-भक्ति मिलेगी
    - उन्हें बहुत धन मिलेगा
    - उन्हें महल मिलेगा
    - उन्हें राज्य मिलेगा
    answer: उन्हें दर्शन, स्मरण और भाव-भक्ति मिलेगी
    difficulty: 2
    hints:
    - तीन लाभ गिनाए गए हैं।
    - '''जागीरी'' भक्ति की है।'
    solution: चाकरी में दर्शन, स्मरण रूपी खर्ची और भाव-भक्ति की जागीर मिलेगी।
    mistakes:
      उन्हें बहुत धन मिलेगा: hin10b_poem_meaning
  - prompt: मीरा के पदों की भाषा कैसी है?
    options:
    - राजस्थानी, ब्रज और गुजराती का मेल
    - शुद्ध संस्कृत
    - अवधी
    - खड़ी बोली
    answer: राजस्थानी, ब्रज और गुजराती का मेल
    difficulty: 3
    hints:
    - मीरा राजस्थान की थीं।
    - बाद में गुजरात (द्वारका) भी गईं।
    solution: राजस्थानी मिश्रित ब्रजभाषा, गुजराती शब्दों के साथ।
    mistakes: {"शुद्ध संस्कृत": "h10b_meera_bhasha"}
  - prompt: मीरा कृष्ण को किस नाम से पुकारती हैं?
    options:
    - गिरधर नागर
    - रघुपति
    - भोलेनाथ
    - निर्गुण राम
    answer: गिरधर नागर
    difficulty: 1
    hints:
    - गिरि (पर्वत) धारण करने वाले।
    - गोवर्धन उठाने वाले।
    solution: मीरा कृष्ण को 'गिरधर नागर' कहती हैं।
    mistakes:
      रघुपति: hin10b_author
  - prompt: मीरा का विवाह किससे हुआ था?
    options:
    - मेवाड़ के राजकुमार भोजराज से
    - जोधपुर के राजा से
    - कृष्ण से
    - रैदास से
    answer: मेवाड़ के राजकुमार भोजराज से
    difficulty: 3
    hints:
    - राजस्थान का एक राजघराना।
    - राणा सांगा के पुत्र।
    solution: मीरा का विवाह मेवाड़ के राजकुमार भोजराज से हुआ था।
    mistakes:
      रैदास से: h10bs2_pad
  - prompt: '''हरि आप हरो जन री भीर'' में ''भीर'' का अर्थ है:'
    options:
    - पीड़ा, संकट
    - भीड़
    - भोजन
    - सेना
    answer: पीड़ा, संकट
    difficulty: 2
    hints:
    - यह भीड़ नहीं है।
    - भक्तों पर आई विपत्ति।
    solution: '''भीर'' यानी पीड़ा या संकट।'
    mistakes:
      भीड़: h10bs2_pad
  - prompt: गजराज किस संकट में था?
    options:
    - पानी में मगरमच्छ ने उसे पकड़ लिया था
    - जंगल में आग लगी थी
    - शिकारी पीछे पड़ा था
    - वह रास्ता भूल गया था
    answer: पानी में मगरमच्छ ने उसे पकड़ लिया था
    difficulty: 2
    hints:
    - '''बूढ़तो गजराज राख्यो''।'
    - वह डूब रहा था।
    solution: मगरमच्छ ने गजराज का पैर पकड़कर पानी में खींच लिया था।
    mistakes:
      जंगल में आग लगी थी: h10bs2_bhakt
  - prompt: मीरा कृष्ण की चाकरी में क्या-क्या करेंगी?
    options:
    - बाग लगाएँगी और वृंदावन में गोविंद की लीला गाएँगी
    - राज्य चलाएँगी
    - युद्ध करेंगी
    - व्यापार करेंगी
    answer: बाग लगाएँगी और वृंदावन में गोविंद की लीला गाएँगी
    difficulty: 2
    hints:
    - '''चाकर रहस्यूँ बाग लगास्यूँ''।'
    - कुंज गलियों में गीत।
    solution: मीरा बाग लगाएँगी, रोज़ दर्शन पाएँगी और गोविंद की लीला गाएँगी।
    mistakes:
      राज्य चलाएँगी: h10bs2_pad
  - prompt: मीरा ने कृष्ण के रूप का वर्णन कैसे किया है?
    options:
