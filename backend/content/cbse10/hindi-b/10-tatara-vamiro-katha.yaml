    - पशु-पर्व में
    - बाज़ार में
    - जंगल में शिकार करते हुए
    answer: समुद्र किनारे, उसका गीत सुनकर
    difficulty: 2
    hints:
    - शाम का समय था।
    - एक मधुर आवाज़ आई।
    solution: तताँरा ने समुद्र किनारे वामीरो का गीत सुना और उसे देखा।
    mistakes:
      पशु-पर्व में: h10bs10_kram
  - prompt: वामीरो ने तताँरा के प्रश्नों का उत्तर पहले क्यों नहीं दिया?
    options:
    - वह एक अजनबी युवक से झिझक रही थी
