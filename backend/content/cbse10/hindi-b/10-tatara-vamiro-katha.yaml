subject: cbse10-hinb
chapter: 10
title: तताँरा-वामीरो कथा
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_andaman: "यह कथा बंगाल की खाड़ी के द्वीपों की लोककथा है, लिटिल अंदमान और कार-निकोबार की।"
  h10b_talwar: "तताँरा की तलवार साधारण पदार्थ की थी, पर लोग उसमें अलौकिक शक्ति मानते थे।"
concepts:
- code: hin10b.s10.tatara
  title: तताँरा-वामीरो कथा (लीलाधर मंडलोई)
  notes: |
    लीलाधर मंडलोई द्वारा लिखी अंदमान-निकोबार की लोककथा। तताँरा पासा गाँव का सुंदर, बलिष्ठ और सबकी मदद करने वाला
    युवक था; उसकी कमर में हमेशा लकड़ी की एक तलवार बँधी रहती, जिसमें लोग दैवीय शक्ति मानते थे। एक शाम समुद्र
    किनारे उसने लपाती गाँव की वामीरो का मधुर गीत सुना और दोनों में प्रेम हो गया। पर रीति थी कि विवाह अपने ही गाँव
    में होगा। पासा गाँव के पशु-पर्व में वामीरो की माँ ने तताँरा का अपमान किया। क्रोध में तताँरा ने अपनी तलवार
    ज़मीन में घोंपकर खींची तो धरती फट गई और द्वीप दो टुकड़ों में बँट गया (माना जाता है: लिटिल अंदमान और
    कार-निकोबार)। तताँरा बहते टुकड़े पर दूर चला गया, वामीरो पुकारती रही और फिर गायब हो गई। उनकी याद में
    निकोबारियों ने दूसरे गाँवों में भी विवाह करना शुरू कर दिया। यह त्याग से पुरानी रूढ़ि टूटने की कथा है।
  explanations:
    text: पासा गाँव के तताँरा और लपाती गाँव की वामीरो एक-दूसरे से प्रेम करते थे, पर गाँव के बाहर विवाह की मनाही थी। अपमान से क्रोधित तताँरा ने अपनी जादुई लकड़ी की तलवार से धरती चीर दी और द्वीप दो भागों में बँट गया। दोनों बिछड़ गए, पर उनके त्याग के बाद यह रीति बदल गई।
    visual: 'समुद्र किनारे एक द्वीप, बीच से फटती धरती: एक ओर लकड़ी की तलवार लिए तताँरा बहता जा रहा है, दूसरी ओर पुकारती वामीरो। नीचे लिखा है: ''इसके बाद गाँव के बाहर भी विवाह होने लगे।'''
    step_by_step: 1. तताँरा (पासा) और उसकी लकड़ी की तलवार। 2. वामीरो (लपाती) का गीत, प्रेम। 3. गाँव के बाहर विवाह की मनाही। 4. पशु-पर्व में अपमान। 5. तलवार से द्वीप के दो टुकड़े। 6. बिछोह और रीति का बदलना।
    real_world: कई समाजों में पुराने नियम तभी बदले जब किसी ने उनकी कीमत चुकाई; यह कथा बताती है कि प्रेम और त्याग रूढ़ियों को तोड़ सकते हैं।
  picture:
    kind: flow
    steps:
    - तताँरा (पासा) और वामीरो (लपाती) का प्रेम
    - 'रीति: गाँव के बाहर विवाह नहीं'
    - पशु-पर्व में तताँरा का अपमान
    - तलवार से धरती फटी, द्वीप दो भागों में
    - दोनों बिछड़े; बाद में रीति बदली
    alt: 'तताँरा-वामीरो कथा का क्रम: प्रेम, रीति की रोक, अपमान, द्वीप का बँटना और रीति का बदलना।'
  activity:
    type: order
    prompt: तताँरा-वामीरो की कथा क्रम से लगाओ।
    steps:
    - तताँरा समुद्र किनारे वामीरो का गीत सुनता है
    - दोनों में प्रेम, पर विवाह गाँव में ही होने की रीति
    - पशु-पर्व में वामीरो की माँ तताँरा का अपमान करती है
    - तताँरा तलवार घोंपता है, द्वीप दो टुकड़े
    - निकोबारी दूसरे गाँवों में भी विवाह करने लगते हैं
    reasons:
      दोनों में प्रेम, पर विवाह गाँव में ही होने की रीति: गीत सुनकर ही दोनों की पहली मुलाकात हुई।
      पशु-पर्व में वामीरो की माँ तताँरा का अपमान करती है: 'अपमान इसलिए हुआ कि तताँरा दूसरे गाँव का था: रीति वाली बात पहले।'
      तताँरा तलवार घोंपता है, द्वीप दो टुकड़े: अपमान से आए क्रोध में तलवार घोंपी।
      निकोबारी दूसरे गाँवों में भी विवाह करने लगते हैं: 'यह दोनों के बिछड़ने की याद में हुआ: अंत में।'
  items:
  - prompt: '''तताँरा-वामीरो कथा'' के लेखक कौन हैं?'
    options:
    - लीलाधर मंडलोई
    - रवींद्र केलेकर
    - सीताराम सेकसरिया
    - मिथिलेश्वर
    answer: लीलाधर मंडलोई
    difficulty: 1
    hints:
    - कवि और गद्यकार, अंदमान पर भी लिखा।
    - नाम 'ल' से शुरू।
    solution: लीलाधर मंडलोई।
    mistakes:
      रवींद्र केलेकर: hin10b_author
  - prompt: यह कथा किस क्षेत्र की है?
    options:
    - अंदमान-निकोबार
    - कश्मीर
    - राजस्थान
    - केरल
    answer: अंदमान-निकोबार
    difficulty: 1
    hints:
    - समुद्र से घिरे द्वीप।
    - बंगाल की खाड़ी।
    solution: अंदमान-निकोबार द्वीप समूह।
    mistakes: {"केरल": "h10b_andaman"}
  - prompt: वामीरो किस गाँव की थी?
    options:
    - लपाती
    - पासा
    - कार
    - हैवलॉक
    answer: लपाती
    difficulty: 2
    hints:
    - तताँरा पासा का था।
    - दूसरा गाँव।
    solution: वामीरो लपाती गाँव की थी, तताँरा पासा का।
    mistakes:
      पासा: hin10b_read_again
  - prompt: तताँरा की तलवार की क्या विशेषता थी?
    options:
    - वह लकड़ी की थी और उसमें दैवीय शक्ति मानी जाती थी
    - वह सोने की थी
    - वह बहुत भारी लोहे की थी
    - वह उसके पिता ने बनाई थी
    answer: वह लकड़ी की थी और उसमें दैवीय शक्ति मानी जाती थी
    difficulty: 1
    hints:
    - वह हमेशा कमर में बँधी रहती।
    - लोग उसे जादुई मानते।
    solution: वह लकड़ी की तलवार थी, जिसमें लोग अद्भुत शक्ति मानते थे।
    mistakes: {"वह सोने की थी": "h10b_talwar"}
  - prompt: तताँरा और वामीरो का विवाह क्यों संभव नहीं था?
    options:
    - रीति थी कि विवाह अपने ही गाँव में हो
    - दोनों के परिवार गरीब थे
    - तताँरा के पास घर नहीं था
    - वामीरो की शादी तय हो चुकी थी
    answer: रीति थी कि विवाह अपने ही गाँव में हो
    difficulty: 2
    hints:
    - दोनों अलग-अलग गाँवों के थे।
    - पुरानी परंपरा।
    solution: उस समय गाँव के बाहर विवाह वर्जित था।
    mistakes:
      दोनों के परिवार गरीब थे: hin10b_read_again
  - prompt: इस कथा से निकोबारी समाज में क्या बदलाव आया?
    options:
    - दूसरे गाँवों में भी विवाह होने लगे
    - तलवारें रखना बंद हुआ
    - पशु-पर्व बंद हो गया
    - लोग द्वीप छोड़कर चले गए
    answer: दूसरे गाँवों में भी विवाह होने लगे
    difficulty: 3
    hints:
    - दोनों का त्याग व्यर्थ नहीं गया।
    - रूढ़ि टूटी।
    solution: तताँरा-वामीरो के त्याग के बाद निकोबारी दूसरे गाँवों में भी वैवाहिक संबंध करने लगे।
    mistakes:
      पशु-पर्व बंद हो गया: hin10b_poem_meaning
