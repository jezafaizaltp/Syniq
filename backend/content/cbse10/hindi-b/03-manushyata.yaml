# Written from memory of the NCERT texts, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse10-hinb
chapter: 3
title: मनुष्यता
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_mahavibhuti: "कवि दूसरों का दुख समझने को सबसे बड़ी पूँजी मानते हैं।"
  h10b_rantidev: "मांस दान राजा शिबि ने किया था। रंतिदेव भूखे थे, उन्होंने अपने सामने की चीज़ दान की।"
  h10bs3_daani: कवि ने चार महान दानियों के उदाहरण दिए हैं, और हर एक ने कुछ अलग दिया। किसने क्या दिया, उसे मिलाओ।
  h10bs3_seekh: 'कविता की हर पंक्ति एक सीख देती है: परोपकार, सहानुभूति, घमंड छोड़ना, मिलकर चलना। प्रश्न किस सीख की ओर है?'
concepts:
- code: hin10b.s3.manushyata
  title: मनुष्यता (मैथिलीशरण गुप्त)
  notes: |
    मैथिलीशरण गुप्त (राष्ट्रकवि) की कविता। संदेश: मनुष्य मरणशील है, इसलिए ऐसा जीवन जियो और ऐसी मृत्यु पाओ कि सब
    याद करें। 'वही पशु-प्रवृत्ति है कि आप आप ही चरे, वही मनुष्य है कि जो मनुष्य के लिए मरे।' उदार दानियों के
    उदाहरण: रंतिदेव (भूख से व्याकुल होते हुए भी अपने हाथ का भोजन का थाल दे दिया), दधीचि (देवताओं के लिए अपनी
    अस्थियाँ दान कीं), उशीनर/शिबि (कबूतर की रक्षा के लिए अपना मांस दिया), कर्ण (कवच-कुंडल दान)। सहानुभूति ही
    सबसे बड़ी पूँजी (महाविभूति) है। धन पर घमंड मत करो, कोई अनाथ नहीं, त्रिलोकनाथ सबके साथ हैं। सब एक पिता
    (ईश्वर) की संतान हैं, भाई-भाई हैं; मिलकर चलो, बाधाएँ हटाते हुए 'अभीष्ट मार्ग' पर खुशी से बढ़ो।
  explanations:
    text: कवि कहते हैं कि सच्चा मनुष्य वही है जो दूसरों के लिए जिए और मरे; केवल अपने लिए जीना पशु-प्रवृत्ति है। रंतिदेव, दधीचि, शिबि और कर्ण जैसे दानी इसी कारण अमर हैं। धन का घमंड छोड़ो, सबसे सहानुभूति रखो और सबको भाई मानकर मिलकर आगे बढ़ो।
    visual: 'एक तराज़ू सोचिए: एक पलड़े पर ''अपने लिए जीना'' (पशु-प्रवृत्ति), दूसरे पर ''दूसरों के लिए जीना'' (मनुष्यता)। दूसरे पलड़े पर चार दानी खड़े हैं: थाल देते रंतिदेव, अस्थियाँ देते दधीचि, कबूतर बचाते शिबि, कवच देते कर्ण।'
    step_by_step: 1. मृत्यु से मत डरो, सुमृत्यु पाओ। 2. पशु-प्रवृत्ति बनाम मनुष्यता। 3. दानियों के उदाहरण। 4. सहानुभूति = महाविभूति। 5. धन का घमंड नहीं। 6. सब भाई, मिलकर चलो।
    real_world: 'किसी घायल को अस्पताल पहुँचाना या भूखे को खाना देना: रोज़ के ऐसे छोटे काम भी उसी ''मनुष्यता'' का हिस्सा हैं जिसकी बात कवि करते हैं।'
  picture:
    kind: compare
    columns:
    - title: दानी
      points:
      - रंतिदेव
      - दधीचि
      - उशीनर (शिबि)
      - कर्ण
    - title: क्या दान किया
      points:
      - भूख में भोजन का थाल
      - अपनी अस्थियाँ
      - कबूतर के लिए अपना मांस
      - कवच-कुंडल
    alt: रंतिदेव ने भोजन का थाल, दधीचि ने अस्थियाँ, शिबि ने अपना मांस और कर्ण ने कवच-कुंडल दान किए।
  activity:
    type: sort
    prompt: किस दानी ने क्या दिया?
    bins:
    - रंतिदेव
    - दधीचि
    - शिबि (उशीनर)
    - कर्ण
    items:
    - label: भूख में भी अपने भोजन का थाल
      bin: रंतिदेव
      clue: भूख से व्याकुल होते हुए किसने खाना दे दिया?
      why: रंतिदेव ने अपना थाल दान किया।
    - label: देवताओं के लिए अपनी अस्थियाँ
      bin: दधीचि
      clue: वज्र बनाने के लिए हड्डियाँ किसने दीं?
      why: दधीचि ने अस्थियाँ दान कीं।
    - label: कबूतर की रक्षा के लिए अपना मांस
      bin: शिबि (उशीनर)
      clue: शरण में आए पक्षी को किसने बचाया?
      why: शिबि ने कबूतर के बदले अपना मांस दिया।
    - label: कवच-कुंडल
      bin: कर्ण
      clue: जन्म से मिले कवच किसके पास थे?
      why: कर्ण ने कवच-कुंडल दान किए।
  lesson:
    - teach: '''मनुष्यता'' राष्ट्रकवि मैथिलीशरण गुप्त की कविता है। कवि कहते हैं: तुम मरणशील हो, पर मृत्यु से मत डरो; ऐसे मरो कि सब याद करें। जो केवल अपने लिए जीता है, उसमें पशु-प्रवृत्ति है; ''वही मनुष्य है कि जो मनुष्य के लिए मरे।'' उदार व्यक्ति की कथा सरस्वती गाती है, धरती उसका आभार मानती है और सारी सृष्टि उसे पूजती है।'
      check:
        prompt: कवि के अनुसार सच्चा मनुष्य कौन है?
        options:
        - जो दूसरों के लिए जिए और मरे
        - जो सबसे धनी हो
        - जो केवल अपना पेट भरे
        answer: जो दूसरों के लिए जिए और मरे
        why: अपने लिए जीना पशु-प्रवृत्ति है।
    - teach: 'कवि परोपकार के उदाहरण देते हैं: भूखे रंतिदेव ने अपने हाथ का भोजन-थाल दे दिया; दधीचि ने देवताओं के लिए अपनी अस्थियाँ दान कीं (जिनसे वज्र बना); राजा उशीनर (शिबि) ने कबूतर बचाने के लिए अपना मांस दिया; और कर्ण ने अपना कवच-कुंडल (शरीर का चर्म) दान किया। नश्वर शरीर के लिए अमर आत्मा क्यों डरे?'
      picture:
        kind: compare
        columns:
        - title: दानी
          points:
          - रंतिदेव
          - दधीचि
          - उशीनर (शिबि)
          - कर्ण
        - title: क्या दिया
          points:
          - भोजन का थाल
          - अपनी अस्थियाँ
          - अपना मांस
          - कवच-कुंडल
        alt: 'मनुष्यता कविता के चार दानी और उनके दान: रंतिदेव ने भोजन-थाल, दधीचि ने अस्थियाँ, उशीनर ने मांस, कर्ण ने कवच-कुंडल दिया।'
      check:
        prompt: दधीचि ने क्या दान किया?
        options:
        - अपनी अस्थियाँ
        - अपना राज्य
        - भोजन
        answer: अपनी अस्थियाँ
        why: उनसे देवताओं का वज्र बना।
    - teach: सहानुभूति सबसे बड़ी पूँजी (महाविभूति) है; उससे धरती वश में होती है। बुद्ध के विरोधी भी उनके दया-प्रवाह में बह गए। धन पर घमंड मत करो, क्योंकि कोई अनाथ नहीं, ईश्वर सबके साथ है। सब मनुष्य भाई हैं; एक-दूसरे का सहारा बनकर आगे बढ़ो। विपत्तियों को हटाते हुए हँसते-खेलते अपने लक्ष्य पर चलो, और दूसरों को तारते हुए स्वयं तरो।
      check:
        prompt: कवि ने 'महाविभूति' किसे कहा है?
        options:
        - सहानुभूति
        - धन
        - बल
        answer: सहानुभूति
        why: दया और करुणा सबसे बड़ी पूँजी है।
  items:
  - prompt: '''मनुष्यता'' कविता के कवि कौन हैं?'
    options:
    - मैथिलीशरण गुप्त
    - सुमित्रानंदन पंत
    - जयशंकर प्रसाद
    - रामधारी सिंह दिनकर
    answer: मैथिलीशरण गुप्त
    difficulty: 1
    hints:
    - राष्ट्रकवि।
    - '''साकेत'' के रचयिता।'
    solution: मैथिलीशरण गुप्त।
    mistakes:
      सुमित्रानंदन पंत: hin10b_author
  - prompt: कवि के अनुसार सच्चा मनुष्य कौन है?
    options:
    - जो मनुष्य के लिए मरे
    - जो केवल अपने लिए जिए
    - जो सबसे धनी हो
    - जो कभी न मरे
    answer: जो मनुष्य के लिए मरे
    difficulty: 1
    hints:
    - '''वही मनुष्य है कि जो...'''
    - दूसरों के लिए।
    solution: जो दूसरे मनुष्यों के लिए जिए और मरे।
    mistakes:
      जो केवल अपने लिए जिए: hin10b_poem_meaning
  - prompt: दधीचि ने क्या दान किया था?
    options:
    - अपनी अस्थियाँ
    - कवच-कुंडल
    - भोजन का थाल
    - अपना राज्य
    answer: अपनी अस्थियाँ
    difficulty: 1
    hints:
    - देवताओं के अस्त्र के लिए।
    - शरीर का कठोर भाग।
    solution: दधीचि ने अपनी अस्थियाँ दान कीं।
    mistakes:
      कवच-कुंडल: hin10b_read_again
  - prompt: कवि ने किसे 'महाविभूति' कहा है?
    options:
    - सहानुभूति
    - धन
    - बल
    - विद्या
    answer: सहानुभूति
    difficulty: 2
    hints:
    - दूसरों का दुख समझना।
    - सबसे बड़ी पूँजी।
    solution: सहानुभूति को सबसे बड़ी पूँजी (महाविभूति) कहा है।
    mistakes: {"धन": "h10b_mahavibhuti"}
  - prompt: रंतिदेव ने भूख से व्याकुल होने पर भी क्या किया?
    options:
    - अपने हाथ का भोजन का थाल दान कर दिया
    - अपना मांस दान कर दिया
    - कवच दान कर दिया
    - युद्ध किया
    answer: अपने हाथ का भोजन का थाल दान कर दिया
    difficulty: 2
    hints:
    - '''करस्थ थाल''।'
    - हाथ में रखा भोजन।
    solution: उन्होंने भूखे होते हुए भी अपने हाथ का भोजन माँगने वाले को दे दिया।
    mistakes: {"अपना मांस दान कर दिया": "h10b_rantidev"}
  - prompt: कवि धन पर घमंड न करने को क्यों कहते हैं?
    options:
    - कोई अनाथ नहीं, ईश्वर सबके साथ हैं
    - धन जल्दी खत्म होता है
    - धन चोरी हो जाता है
    - धन से बल नहीं मिलता
    answer: कोई अनाथ नहीं, ईश्वर सबके साथ हैं
    difficulty: 3
    hints:
    - '''अनाथ कौन है यहाँ?'''
    - त्रिलोकनाथ।
    solution: धन के कारण स्वयं को सनाथ मानकर घमंड मत करो, क्योंकि त्रिलोकनाथ सबके साथ हैं।
    mistakes:
      धन जल्दी खत्म होता है: hin10b_poem_meaning
  - prompt: कवि मृत्यु के बारे में क्या कहते हैं?
    options:
    - मृत्यु से मत डरो, ऐसे मरो कि सब याद करें
    - मृत्यु से हमेशा डरो
    - मृत्यु कभी नहीं आती
    - मृत्यु के बाद सब भूल जाते हैं
    answer: मृत्यु से मत डरो, ऐसे मरो कि सब याद करें
    difficulty: 2
    hints:
    - '''मरो परंतु यों मरो''।'
    - सुमृत्यु की बात।
    solution: कवि कहते हैं कि मृत्यु से न डरें, बल्कि ऐसा जीवन जिएँ कि लोग याद करें।
    mistakes:
      मृत्यु से हमेशा डरो: h10bs3_seekh
  - prompt: कर्ण ने क्या दान किया?
    options:
    - अपना कवच-कुंडल (शरीर का चर्म)
    - अपनी अस्थियाँ
    - अपना मांस
    - भोजन का थाल
    answer: अपना कवच-कुंडल (शरीर का चर्म)
    difficulty: 2
    hints:
    - वह जन्म से उसके शरीर पर था।
    - इंद्र ने माँगा था।
    solution: कर्ण ने अपना जन्मजात कवच-कुंडल दान कर दिया।
    mistakes:
      अपनी अस्थियाँ: h10bs3_daani
      अपना मांस: h10bs3_daani
  - prompt: राजा उशीनर (शिबि) ने किसके लिए अपना मांस दिया?
    options:
    - शरण में आए कबूतर की रक्षा के लिए
    - देवताओं के वज्र के लिए
    - भूखे ब्राह्मण के लिए
    - युद्ध जीतने के लिए
    answer: शरण में आए कबूतर की रक्षा के लिए
    difficulty: 3
    hints:
    - एक बाज़ उसका पीछा कर रहा था।
    - शरणागत की रक्षा।
    solution: उशीनर ने कबूतर के बराबर अपना मांस बाज़ को देकर उसे बचाया।
    mistakes:
      देवताओं के वज्र के लिए: h10bs3_daani
  - prompt: '''वही पशु-प्रवृत्ति है कि आप आप ही चरे'' का अर्थ क्या है?'
    options:
    - केवल अपने लिए जीना पशु जैसा स्वभाव है
    - पशु घास खाते हैं
    - पशुओं को चराना अच्छा है
    - मनुष्य पशु से बड़ा है
    answer: केवल अपने लिए जीना पशु जैसा स्वभाव है
    difficulty: 2
    hints:
    - '''आप आप ही चरे'' यानी अपना ही पेट भरे।'
    - स्वार्थ की बात।
    solution: जो केवल अपना पेट भरता है, उसमें पशु-प्रवृत्ति है।
    mistakes:
      पशु घास खाते हैं: h10bs3_seekh
