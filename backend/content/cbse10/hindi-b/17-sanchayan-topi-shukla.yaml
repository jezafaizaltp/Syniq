        alt: 'टोपी के दो घर: अपने घर में डाँट, शिकायत और पिटाई; इफ़्फ़न के घर में दादी का प्यार, पूरबी बोली और सच्ची दोस्ती।'
      check:
        prompt: खाने की मेज़ पर टोपी ने कौन-सा शब्द कहा जिस पर हंगामा हुआ?
