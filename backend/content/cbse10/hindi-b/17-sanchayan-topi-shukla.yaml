    - मुन्नी बाबू शुक्ला
    - रामदुलारी शुक्ला
    answer: बलभद्र नारायण शुक्ला
    difficulty: 1
    hints:
    - '''शुक्ला'' उपनाम।'
    - बलराम का एक नाम।
    solution: बलभद्र नारायण शुक्ला।
