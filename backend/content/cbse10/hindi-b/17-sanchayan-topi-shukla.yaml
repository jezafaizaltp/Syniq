        why: उसके घर में यह शब्द नहीं बोला जाता था।
    - teach: इफ़्फ़न के पिता का तबादला मुरादाबाद हो गया और टोपी अकेला पड़ गया। नए कलेक्टर के बेटों (डब्बू, बीलू, गुड्डू) ने उसका मज़ाक उड़ाया और उस पर कुत्ता छोड़ दिया। तब टोपी ने कसम खाई कि वह ऐसे लड़के से दोस्ती नहीं करेगा जिसके पिता की नौकरी तबादले वाली हो। कहानी बताती है कि प्रेम और दोस्ती धर्म-जाति से बड़े हैं।
      check:
        prompt: इफ़्फ़न के जाने का कारण क्या था?
