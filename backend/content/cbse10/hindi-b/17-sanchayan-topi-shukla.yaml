subject: cbse10-hinb
chapter: 17
title: टोपी शुक्ला
tips:
  hin10b_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin10b_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे दिया गया है।'
  hin10b_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h10b_ammi: "'अम्मी' शब्द टोपी के हिंदू घर में अलग माना गया। घर वालों की प्रतिक्रिया अच्छी नहीं थी।"
  h10b_iffan_dadi: "टोपी की अपनी दादी उसे डाँटती थीं। उसे सबसे ज़्यादा अपनापन दोस्त के घर मिला।"
concepts:
- code: hin10b.c17.topi
  title: टोपी शुक्ला (राही मासूम रज़ा)
  notes: |
    राही मासूम रज़ा के उपन्यास 'टोपी शुक्ला' का अंश (संचयन)। बलभद्र नारायण शुक्ला उर्फ़ टोपी और इफ़्फ़न (सैयद ज़रगाम
    मुरतुज़ा के बेटे) गहरे दोस्त हैं; धर्म अलग है पर प्रेम में फ़र्क नहीं। टोपी को इफ़्फ़न की दादी बहुत प्यारी लगती हैं:
    वे पूरबी बोली बोलती हैं, जो टोपी की माँ जैसी लगती है, और उसे प्यार देती हैं। टोपी की अपनी दादी सुभद्रादेवी उसे
    डाँटती रहती हैं। एक दिन खाने पर टोपी ने अपनी माँ को 'अम्मी' कह दिया तो घर में हंगामा हो गया, भाई मुन्नी बाबू ने
    झूठ बोला कि टोपी ने कबाब खाया, और टोपी की खूब पिटाई हुई; केवल बूढ़ी नौकरानी सीता उसे समझती थी। इफ़्फ़न की दादी की
    मृत्यु से टोपी अकेला हो गया। इफ़्फ़न के पिता (कलेक्टर) का तबादला मुरादाबाद हो गया; नए कलेक्टर के बेटों से टोपी
    की नहीं बनी। तब टोपी ने कसम खाई कि वह किसी ऐसे लड़के से दोस्ती नहीं करेगा जिसके पिता की नौकरी तबादले वाली हो।
    अकेलेपन में वह नौवीं कक्षा में दो बार फेल हुआ और तीसरी बार तीसरे दर्जे में पास हुआ। संदेश: प्रेम और अपनापन धर्म
    और जाति से बड़े हैं; बच्चों को प्यार और समझ चाहिए।
  explanations:
    text: टोपी शुक्ला और इफ़्फ़न अलग धर्म के होते हुए भी पक्के दोस्त हैं। टोपी को इफ़्फ़न की दादी से बहुत प्यार मिलता है, जो उसे अपने घर में नहीं मिलता। दादी की मृत्यु और इफ़्फ़न के पिता के तबादले के बाद टोपी अकेला पड़ जाता है। कहानी बताती है कि प्यार और दोस्ती धर्म-जाति की दीवारें नहीं मानते।
    visual: दो घर, बीच में एक रास्ता। एक घर में कड़ी नज़र वाली दादी सुभद्रादेवी और डाँट खाता टोपी; दूसरे घर में इफ़्फ़न की दादी, जो टोपी को पास बैठाकर प्यार से बातें कर रही हैं। रास्ते पर टोपी और इफ़्फ़न हाथ पकड़े चल रहे हैं।
    step_by_step: 1. टोपी (बलभद्र नारायण शुक्ला) और इफ़्फ़न की दोस्ती। 2. इफ़्फ़न की दादी का प्यार। 3. 'अम्मी' शब्द पर घर में हंगामा। 4. दादी की मृत्यु, इफ़्फ़न का मुरादाबाद जाना। 5. टोपी की कसम। 6. नौवीं में दो बार फेल।
    real_world: स्कूल में अलग-अलग धर्मों और भाषाओं के दोस्त एक-दूसरे के घर जाकर त्योहार मनाते हैं; टोपी और इफ़्फ़न की दोस्ती भी ऐसी ही थी।
