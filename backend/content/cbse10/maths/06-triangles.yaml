# CBSE Class 10 Mathematics (NCERT), chapter 6. Format: content/README.md.
subject: cbse10-math
chapter: 6
title: Triangles
tips:
  c10_ratio_upside: 'Keep each ratio the same way up: small triangle over big triangle on both sides (or big over small on both).'
  c10_part_not_whole: 'AD : DB is part to part. For similar triangles compare AD with the whole side AB.'
  t10_angle_sum: "Similar triangles have equal angles. Find the third angle from 180°."
  t10_bpt_equation: "BPT gives AD/DB = AE/EC. Cross-multiply, expand both sides, and the x² terms cancel."
  t10_converse_bpt: "A converse swaps 'if' and 'then'. BPT: parallel ⇒ equal ratios. So the converse is equal ratios ⇒ …?"
  t10_same_ratio_parallel: "Both sides are cut in the same ratio. Which theorem turns equal ratios into a fact about the line ST?"
  t10_scale_factor: "Divide each side of the big triangle by the matching side of the small one. Same number each time?"
  t10_similarity_tests: "AA, SSS and SAS work. With two sides and an angle, the angle must be BETWEEN the sides."
  c10m6_same_ratio: 'With DE ∥ BC, the small piece over the other piece on one side equals the matching ratio on the other side: AD/DB = AE/EC. Line the parts up before you cross-multiply.'
  c10m6_whole_side: For the parallel side DE compared with BC, use the whole side AD/AB, not AD/DB.
  c10m6_match: 'Read the letters in order: if △ABC ~ △PQR then A↔P, B↔Q, C↔R. Pair sides by those letters.'
  c10m6_tests: Similarity needs AA, SSS (all ratios equal) or SAS (an angle between two sides in the same ratio). An angle that is not between the two sides doesn't count.
concepts:
- code: cbse10m.tri.bpt
  title: Basic Proportionality Theorem
  notes: |
    Similar figures have the same shape: corresponding angles equal and corresponding sides in the same ratio.
    Basic Proportionality Theorem (Thales): a line drawn parallel to one side of a triangle, cutting the other
    two sides at distinct points, divides them in the same ratio: if DE ∥ BC in triangle ABC, then AD/DB =
    AE/EC. Converse: a line dividing two sides in the same ratio is parallel to the third side.
  explanations:
    text: 'If you draw a line across a triangle parallel to its base, it cuts the two slanting sides in the same ratio. So if DE is parallel to BC, AD : DB = AE : EC. And the other way round: if a line cuts two sides in the same ratio, it must be parallel to the third.'
    visual: 'Draw triangle ABC with a horizontal shelf DE parallel to BC. On the left side, AD is 2 cm and DB is 3 cm; on the right side, AE is 4 cm and EC is 6 cm. Both sides are cut in the ratio 2 : 3.'
    step_by_step: 'Step 1: Check that the line is parallel to a side. Step 2: Write AD/DB = AE/EC with the matching pieces. Step 3: Put in the known lengths. Step 4: Cross-multiply and solve for the missing length.'
    real_world: 'A ladder leans on a wall with a horizontal rung halfway up its height: the rung also sits halfway along the ladder. Parallel lines cut slanted lines in proportion.'
  picture:
    kind: geometry
    points:
      A:
      - 5
      - 9
      B:
      - 1
      - 1
      C:
      - 9
      - 1
      D:
      - 3.4
      - 5.8
      E:
      - 6.6
      - 5.8
    segments:
    - - A
      - D
      - '2'
    - - D
      - B
      - '3'
    - - A
      - E
      - '4'
    - - E
      - C
      - '6'
    - - B
      - C
    - - D
      - E
    caption: 'DE ∥ BC, so AD/DB = AE/EC: 2/3 = 4/6.'
    alt: Triangle ABC with DE parallel to BC. AD is 2, DB is 3, AE is 4 and EC is 6, so both sides are cut in the ratio 2 to 3.
  activity:
    type: formula
    prompt: 'In triangle ABC, DE ∥ BC cuts AB at D and AC at E, with AE = 4 cm. By Thales, AD : DB = AE : EC.'
    inputs:
    - name: ad
      label: AD
      min: 1
      max: 12
      step: 1
      start: 1
      unit: cm
    - name: db
      label: DB
      min: 1
      max: 12
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: ec
      label: EC
      expr: 4*db/ad
      unit: cm
      places: 2
    - name: r
      label: AD ÷ DB
      expr: ad/db
      places: 2
    goals:
    - prompt: 'AD = 3 cm. Make EC = 8 cm: how long is DB?'
      want:
        ad: 3
        ec: 8
      hint: 'AE : EC is 4 : 8 = 1 : 2. AD : DB must be the same.'
      mistakes:
      - when:
          ad: 3
          db: 8
        say: DB = 8 copies EC, but the sides are cut in the same ratio, not into the same lengths. With DB = 8, EC = 10.67.
      - when:
          ad: 3
          db: 4
        say: 'DB = 4 copies AE. Match AD with AE and DB with EC: AD : DB = AE : EC.'
    - prompt: 'Now DB = 3 cm. Make EC = 2 cm: how long is AD?'
      want:
        db: 3
        ec: 2
      mistakes:
      - when:
          db: 3
          ad: 2
        say: 'AD = 2 gives EC = 6. You paired the wrong sides: AD goes with AE, DB with EC.'
      - when:
          db: 3
          ad: 3
        say: AD = DB makes AE = EC = 4. Here EC is half of AE, so DB is half of AD.
  lesson:
    - teach: 'Similar figures have the same shape but maybe not the same size: matching angles are equal and matching sides are in the same ratio. All circles are similar; all squares are similar; but two rectangles need not be.'
      check:
        prompt: Which pair is always similar?
        options:
        - Two squares
        - Two rectangles
        - Two triangles
        answer: Two squares
        why: All angles 90° and all sides in one ratio.
    - teach: 'Basic Proportionality Theorem (Thales): if a line parallel to one side of a triangle cuts the other two sides, it divides them in the same ratio. In △ABC with DE ∥ BC (D on AB, E on AC): AD/DB = AE/EC. The converse also holds: if AD/DB = AE/EC, then DE ∥ BC.'
      picture:
        kind: geometry
        points:
          A:
          - 3
          - 6
          B:
          - 0
          - 0
          C:
          - 6
          - 0
          D:
          - 2
          - 4
          E:
          - 4
          - 4
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - A
        - - D
          - E
        alt: Triangle ABC with segment DE parallel to BC, cutting AB at D and AC at E.
      check:
        prompt: AD = 2, DB = 4, AE = 3. EC = ?
        options:
        - '6'
        - '1.5'
        - '8'
        answer: '6'
        why: 2/4 = 3/EC gives EC = 6.
    - teach: 'Because △ADE ~ △ABC, the parallel side compares with the whole sides: DE/BC = AD/AB. Use AB = AD + DB, not DB alone.'
      check:
        prompt: AD = 2, DB = 4, BC = 9. DE = ?
        options:
        - '3'
        - '4.5'
        - '6'
        answer: '3'
        why: DE/9 = 2/6.
  items:
  - prompt: In triangle ABC, DE ∥ BC. AD = 2 cm, DB = 3 cm and AE = 4 cm. Find EC in cm.
    answer: '6'
    check: 4*3/2
    difficulty: 1
    hints:
    - AD/DB = AE/EC.
    - 2/3 = 4/EC.
    solution: 'Step 1: 2/3 = 4/EC. Step 2: EC = 4 × 3/2 = 6 cm.'
    mistakes:
      8/3: c10_ratio_upside
  - prompt: In triangle ABC, DE ∥ BC. AD = 1.5 cm, DB = 3 cm and EC = 4 cm. Find AE in cm.
    answer: '2'
    check: 4*1.5/3
    difficulty: 1
    hints:
    - AD/DB = AE/EC.
    - 1.5/3 = AE/4.
    solution: 'Step 1: 1.5/3 = AE/4. Step 2: AE = 4 × 0.5 = 2 cm.'
    mistakes:
      '8': c10_ratio_upside
  - prompt: Which is the converse of the Basic Proportionality Theorem?
    options:
    - If a line divides two sides of a triangle in the same ratio, it is parallel to the third side
    - Parallel lines never meet
    - Angles in a triangle add to 180°
    - The longest side is opposite the largest angle
    answer: If a line divides two sides of a triangle in the same ratio, it is parallel to the third side
    difficulty: 1
    hints:
    - A converse swaps the 'if' and the 'then'.
    - 'BPT: parallel ⇒ same ratio.'
    solution: BPT says a parallel line gives equal ratios; the converse says equal ratios give a parallel line.
    mistakes: {"Parallel lines never meet": "t10_converse_bpt", "Angles in a triangle add to 180°": "t10_converse_bpt"}
  - prompt: In triangle PQR, S is on PQ and T on PR with PS/SQ = 3/5 and PT/TR = 3/5. What can you say about ST?
    options:
    - ST ∥ QR
    - ST = QR
    - ST ⊥ QR
    - Nothing
    answer: ST ∥ QR
    difficulty: 2
    hints:
    - The two sides are cut in the same ratio.
    - Use the converse of BPT.
    solution: The sides PQ and PR are divided in the same ratio, so by the converse of BPT, ST ∥ QR.
    mistakes: {"ST = QR": "t10_same_ratio_parallel", "Nothing": "t10_same_ratio_parallel"}
  - prompt: DE ∥ BC in triangle ABC, with AD = x, DB = x − 2, AE = x + 2 and EC = x − 1. Find x.
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - x/(x − 2) = (x + 2)/(x − 1).
    - x(x − 1) = (x + 2)(x − 2).
    solution: 'Step 1: x(x − 1) = (x + 2)(x − 2). Step 2: x² − x = x² − 4, so x = 4. Check: 4/2 = 6/3 ✓.'
    mistakes: {"2": "t10_bpt_equation", "6": "t10_bpt_equation"}
  - prompt: In triangle ABC, DE ∥ BC, AD/DB = 1/2 and BC = 9 cm. Find DE in cm.
    answer: '3'
    check: 9/3
    difficulty: 3
    hints:
    - AD/AB = 1/3, not 1/2.
    - Triangle ADE is similar to triangle ABC.
    solution: 'Step 1: AD : DB = 1 : 2, so AD/AB = 1/3. Step 2: Triangles ADE and ABC are similar, so DE/BC = 1/3. Step 3: DE = 3 cm.'
    mistakes:
      9/2: c10_part_not_whole
  - prompt: In △ABC, DE ∥ BC with AD = 4 cm, DB = 6 cm and AE = 5 cm. Find AC in cm. Type a decimal.
    answer: '12.5'
    check: 5 + 5 * 6 / 4
    difficulty: 2
    hints:
    - First find EC from AD/DB = AE/EC.
    - Then AC = AE + EC.
    solution: 'Step 1: 4/6 = 5/EC, so EC = 7.5. Step 2: AC = 5 + 7.5 = 12.5 cm.'
    mistakes:
      '7.5': c10m6_whole_side
      '3.33': c10m6_same_ratio
  - prompt: In △PQR, ST ∥ QR with PS = 3, SQ = 9 and PT = 2. Find TR.
    answer: '6'
    check: 2 * 9 / 3
    difficulty: 1
    hints:
    - PS/SQ = PT/TR.
    - 3/9 = 2/TR.
    solution: TR = 2 × 9 ÷ 3 = 6.
    mistakes:
      '18': c10m6_same_ratio
  - prompt: D and E are on AB and AC with AD = 3, DB = 5, AE = 4.5, EC = 7.5. Is DE ∥ BC?
    options:
    - Yes, the ratios are equal
    - No, the ratios differ
    - Only if AB = AC
    - Cannot be decided
    answer: Yes, the ratios are equal
    difficulty: 2
    hints:
    - Find AD/DB and AE/EC.
    - 3/5 and 4.5/7.5.
    solution: 3/5 = 0.6 and 4.5/7.5 = 0.6; equal ratios, so by the converse of BPT, DE ∥ BC.
    mistakes:
      No, the ratios differ: c10m6_same_ratio
  - prompt: In △ABC, DE ∥ BC, AD = 3 cm, AB = 12 cm and BC = 16 cm. Find DE in cm.
    answer: '4'
    check: 16 * 3 / 12
    difficulty: 2
    hints:
    - DE/BC = AD/AB.
    - Use the whole side AB.
    solution: DE = 16 × 3/12 = 4 cm.
    mistakes:
      '5.33': c10m6_whole_side
      '48': c10m6_same_ratio
  - prompt: A line through the mid-point of one side of a triangle, parallel to another side, meets the third side at…
    options:
    - Its mid-point
    - A vertex
    - One-third of the way
    - Nowhere
    answer: Its mid-point
    difficulty: 2
    hints:
    - AD/DB = 1.
    - So AE/EC = 1 too.
    solution: By BPT, AD/DB = 1 forces AE/EC = 1, so E is the mid-point.
    mistakes:
      One-third of the way: c10m6_same_ratio
  - prompt: Which pair of figures is NOT always similar?
    options:
    - Two rhombuses
    - Two circles
    - Two equilateral triangles
    - Two squares
    answer: Two rhombuses
    difficulty: 1
    hints:
    - Similar needs equal angles.
    - Can a rhombus be squashed?
    solution: Rhombuses can have different angles, so they need not be similar.
    mistakes:
      Two equilateral triangles: c10m6_tests
  - prompt: DE ∥ BC in △ABC with AD/DB = 3/4. Find AE/AC as a fraction.
    answer: 3/7
    check: 3/7
    difficulty: 3
    hints:
    - AE/EC = 3/4.
    - AC = AE + EC = 3 + 4 parts.
    solution: 'Step 1: AE : EC = 3 : 4. Step 2: AE/AC = 3/(3 + 4) = 3/7.'
    mistakes:
      3/4: c10m6_whole_side
  - prompt: Who is the Basic Proportionality Theorem also named after?
    options:
    - Thales
    - Pythagoras
    - Euclid
    - Brahmagupta
    answer: Thales
    difficulty: 1
    hints:
    - A Greek mathematician.
    - Not the right-triangle one.
    solution: BPT is also called Thales' theorem.
    mistakes:
      Pythagoras: c10m6_tests
  - prompt: In trapezium ABCD with AB ∥ DC, diagonals meet at O. Which is true?
    options:
    - AO/OC = BO/OD
    - AO = OC
    - AO/OC = OD/BO
    - AO + OC = BD
    answer: AO/OC = BO/OD
    difficulty: 3
    hints:
    - △AOB ~ △COD by AA.
    - Match the sides in order.
    solution: △AOB ~ △COD (alternate angles), so AO/OC = BO/OD.
    mistakes:
      AO/OC = OD/BO: c10m6_match
- code: cbse10m.tri.similar
  title: Similarity criteria
  after:
  - cbse10m.tri.bpt
  notes: |
    Two triangles are similar if their corresponding angles are equal and their corresponding sides are in the
    same ratio. Criteria: AAA (or AA) similarity; SSS similarity (all three side ratios equal); SAS similarity
    (one angle equal and the sides including it in the same ratio). If △ABC ~ △PQR, then AB/PQ = BC/QR =
    CA/RP and ∠A = ∠P, ∠B = ∠Q, ∠C = ∠R; the order of letters shows which parts match.
  explanations:
    text: 'Similar triangles are enlargements or reductions of each other. You don''t need to check everything: two equal angles (AA) is enough, or all three sides in the same ratio (SSS), or one equal angle with the sides around it in the same ratio (SAS). Then every pair of matching sides has the same ratio.'
    visual: 'Photocopy a triangle at 200%. The copy has the same angles, and every side is exactly twice as long. Lay the small one in the corner of the big one: the corners fit perfectly.'
    step_by_step: 'Step 1: Match the corners using equal angles. Step 2: Name the triangles in matching order, e.g. △ABC ~ △PQR. Step 3: Write the side ratios AB/PQ = BC/QR = CA/RP. Step 4: Use one known ratio to find a missing side.'
    real_world: To find a tree's height, measure the shadow of a 1.5 m stick and the tree's shadow at the same time. The sun's rays make similar triangles, so height/shadow is the same for both.
  picture:
    kind: geometry
    points:
      A:
      - 0.5
      - 1
      B:
      - 2.75
      - 1
      C:
      - 0.5
      - 4
      P:
      - 4
      - 1
      Q:
      - 8.5
      - 1
      R:
      - 4
      - 7
    segments:
    - - A
      - B
      - '3'
    - - A
      - C
      - '4'
    - - B
      - C
      - '5'
    - - P
      - Q
      - '6'
    - - P
      - R
      - '8'
    - - Q
      - R
      - '10'
    caption: 6/3 = 8/4 = 10/5 = 2, so △ABC ~ △PQR by SSS.
    alt: Triangle ABC with sides 3, 4, 5 beside triangle PQR with sides 6, 8, 10. Every side ratio is 2, so they are similar.
  activity:
    type: sort
    prompt: Are the two triangles similar? If so, by which test?
    bins:
    - AA
    - SSS
    - SAS
    - Not similar
    items:
    - label: Angles 50°, 60° and 50°, 70°
      bin: AA
      clue: Find the third angle of each triangle.
      why: 'Both have 50°, 60° and 70°: two equal angles is enough (AA).'
    - label: Sides 3, 4, 5 and 6, 8, 10
      bin: SSS
      clue: Divide each side of the second by the matching side of the first.
      why: 'Every side doubles: all three ratios are 2, so SSS.'
    - label: Sides 2, 3, 4 and 4, 6, 9
      bin: Not similar
      clue: Check all three ratios, not just two.
      why: '4/2 = 2 and 6/3 = 2, but 9/4 = 2.25: not all equal, so not similar.'
    - label: AB/PQ = AC/PR = 2 and ∠A = ∠P
      bin: SAS
      clue: Is the equal angle between the two sides in the ratio?
      why: '∠A sits between AB and AC: an included angle with sides in proportion, SAS.'
    - label: AB/PQ = AC/PR = 2 and ∠B = ∠Q
      bin: Not similar
      clue: Is ∠B between AB and AC?
      why: '∠B isn''t between those sides, so SAS doesn''t apply: they need not be similar.'
    - label: Two equilateral triangles
      bin: AA
      clue: What are all the angles of an equilateral triangle?
      why: 'All angles are 60° in both: AA.'
    - label: Angles 40°, 80° and 40°, 70°
      bin: Not similar
      clue: Work out each third angle.
      why: 'One is 40°, 80°, 60°, the other 40°, 70°, 70°: the angles differ.'
    - label: Sides 5, 5, 8 and 10, 10, 16
      bin: SSS
      clue: Does every side scale by the same number?
      why: 'Every side doubles: SSS.'
    - label: Two right triangles that each have a 35° angle
      bin: AA
      clue: Each has 90° and 35°. Is that two equal angles?
      why: 90° and 35° match, so AA.
    - label: Two isosceles triangles
      bin: Not similar
      clue: Could one be tall and thin, the other short and wide?
      why: Isosceles triangles can have different angles, so not always similar.
  lesson:
    - teach: 'Two triangles are similar if matching angles are equal and matching sides are in the same ratio. You don''t need to check everything: AA (two angles equal) is enough, because the third angle then matches too.'
      check:
        prompt: Two angles of one triangle are 40° and 75°, and of another 40° and 65°. Similar?
        options:
        - 'Yes'
        - 'No'
        - Cannot tell
        answer: 'Yes'
        why: 'The third angles are 65° and 75°: all three match.'
    - teach: 'SSS: all three side ratios equal. SAS: one angle equal and the two sides around it in the same ratio. SSA is NOT a test. The letter order matters: △ABC ~ △PQR means A↔P, B↔Q, C↔R, so AB/PQ = BC/QR = CA/RP.'
      picture:
        kind: compare
        columns:
        - title: Valid tests
          points:
          - AA
          - SSS (ratios)
          - SAS (included angle)
        - title: Not a test
          points:
          - SSA
          - Just one angle
          - Just one ratio
        alt: Valid similarity tests AA, SSS and SAS compared with invalid ones.
      check:
        prompt: △ABC ~ △XYZ. Which side matches BC?
        options:
        - YZ
        - XY
        - XZ
        answer: YZ
        why: B↔Y and C↔Z.
  items:
  - prompt: Which is NOT a test for similar triangles?
    options:
    - SSA
    - AA
    - SSS
    - SAS
    answer: SSA
    difficulty: 1
    hints:
    - 'Similarity tests: AAA/AA, SSS, SAS.'
    - The angle must be between the two sides.
    solution: AA, SSS and SAS are similarity tests. SSA (angle not between the sides) is not.
    mistakes: {"SAS": "t10_similarity_tests", "SSS": "t10_similarity_tests"}
  - prompt: Triangles with sides 3, 4, 5 and 6, 8, 10 are…
    options:
    - similar by SSS
    - congruent
    - not similar
    - similar by AA only
    answer: similar by SSS
    difficulty: 1
    hints:
    - Compare 6/3, 8/4 and 10/5.
    - All equal 2.
    solution: 6/3 = 8/4 = 10/5 = 2, so they are similar by SSS (not congruent, as the sizes differ).
    mistakes: {"congruent": "t10_scale_factor", "not similar": "t10_scale_factor"}
  - prompt: △ABC ~ △PQR, AB = 4 cm, PQ = 6 cm and BC = 5 cm. Find QR in cm. Type a decimal.
    answer: '7.5'
    check: 5*6/4
    difficulty: 2
    hints:
    - AB/PQ = BC/QR.
    - 4/6 = 5/QR.
    solution: 'Step 1: 4/6 = 5/QR. Step 2: QR = 5 × 6/4 = 7.5 cm.'
    mistakes:
      10/3: c10_ratio_upside
  - prompt: In △ABC and △DEF, ∠A = ∠D = 50° and ∠B = ∠E = 60°. Find ∠F in degrees.
    answer: '70'
    check: 180 - 50 - 60
    difficulty: 1
    hints:
    - The triangles are similar by AA.
    - ∠F = ∠C = 180° − 50° − 60°.
    solution: 'Step 1: AA similarity, so ∠F = ∠C. Step 2: ∠C = 180 − 50 − 60 = 70°.'
    mistakes: {"60": "t10_angle_sum", "110": "t10_angle_sum"}
  - prompt: A 1.5 m stick casts a 2 m shadow. At the same time a tree casts a 12 m shadow. How tall is the tree, in metres?
    answer: '9'
    check: 12*1.5/2
    difficulty: 2
    hints:
    - height/shadow is the same for both.
    - 1.5/2 = h/12.
    solution: 'Step 1: The triangles are similar (AA). Step 2: 1.5/2 = h/12, so h = 12 × 0.75 = 9 m.'
    mistakes:
      '16': c10_ratio_upside
  - prompt: △ABC ~ △DEF with AB/DE = 2/3. The perimeter of △ABC is 24 cm. Find the perimeter of △DEF in cm.
    answer: '36'
    check: 24*3/2
    difficulty: 3
    hints:
    - Perimeters are in the same ratio as sides.
    - 24/P = 2/3.
    solution: 'Step 1: Perimeters scale like sides: 24/P = 2/3. Step 2: P = 36 cm.'
    mistakes:
      '16': c10_ratio_upside
  - prompt: △ABC ~ △DEF with AB = 3 cm, DE = 9 cm and AC = 4 cm. Find DF in cm.
    answer: '12'
    check: 4 * 9 / 3
    difficulty: 1
    hints:
    - Scale factor DE/AB = 3.
    - DF matches AC.
    solution: DF = 4 × 3 = 12 cm.
    mistakes:
      '6.75': c10m6_match
      '1.33': c10m6_match
  - prompt: Sides 2, 3, 4 and 4, 6, 8. Are the triangles similar?
    options:
    - Yes, by SSS
    - Yes, by AA
    - 'No'
    - Only by SAS
    answer: Yes, by SSS
    difficulty: 1
    hints:
    - Find each ratio.
    - 4/2, 6/3, 8/4.
    solution: All ratios are 2, so the triangles are similar by SSS.
    mistakes:
      'No': c10m6_tests
  - prompt: A 6 m pole casts a 4 m shadow while a tower casts a 28 m shadow. Find the tower's height in metres.
    answer: '42'
    check: 6 * 28 / 4
    difficulty: 2
    hints:
    - Sun rays make similar triangles.
    - height/shadow is the same.
    solution: 6/4 = h/28, so h = 42 m.
    mistakes:
      '18.67': c10m6_match
  - prompt: In △PQR and △XYZ, PQ/XY = PR/XZ and ∠P = ∠X. By which test are they similar?
    options:
    - SAS
    - SSS
    - AA
    - SSA
    answer: SAS
    difficulty: 2
    hints:
    - Two sides in ratio and one angle.
    - Is ∠P between PQ and PR?
    solution: ∠P is between PQ and PR, so it is SAS similarity.
    mistakes:
      SSA: c10m6_tests
  - prompt: △ABC ~ △PQR with ∠A = 47° and ∠Q = 83°. Find ∠R in degrees.
    answer: '50'
    check: 180 - 47 - 83
    difficulty: 1
    hints:
    - ∠P = ∠A = 47°.
    - Angles of a triangle add to 180°.
    solution: ∠R = 180 − 47 − 83 = 50°.
    mistakes:
      '47': c10m6_match
      '83': c10m6_match
