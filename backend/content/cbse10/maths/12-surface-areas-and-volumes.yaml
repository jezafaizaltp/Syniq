# CBSE Class 10 Mathematics (NCERT), chapter 12. Format: content/README.md.
subject: cbse10-math
chapter: 12
title: Surface Areas and Volumes
tips:
  c10_hemisphere_curved: That's the total surface including the flat circle (3πr²). The curved part alone is 2πr².
  c10_hidden_faces: Where two solids are joined, those faces are hidden inside and don't count.
  c10_cone_third: 'A cone holds one third of the cylinder with the same base and height: (1/3)πr²h.'
  c10_hemisphere_half: 'That''s a whole sphere. A hemisphere is half: (2/3)πr³.'
  c10_litres: That's in cubic metres. Multiply by 1000 to get litres.
  t10_combined_surface: "Count only the outside surfaces: the cylinder's curved side and the two curved domes. The flat joins are hidden."
  t10_combined_volume: "Add the two volumes. Cone = (1/3)πr²h with its own height."
  t10_compare_volumes: "Write both volumes in terms of r: cylinder πr² × h with h = 2r, sphere (4/3)πr³. Compare the numbers in front of πr³."
  t10_cylinder_minus_cone: "Remaining = cylinder − cone = πr²h − (1/3)πr²h."
  c10m12_hidden_faces: When solids are joined, the faces that touch are hidden. Count only what you could paint from outside.
  c10m12_csa_tsa: Curved surface is only the bent part. Total surface adds the flat circles too. Which does the question ask?
  c10m12_formula: 'Check the formula: cylinder curved 2πrh, cone curved πrl, sphere 4πr², hemisphere curved 2πr².'
  c10m12_vol_formula: 'Volumes: cylinder πr²h, cone (1/3)πr²h, sphere (4/3)πr³, hemisphere (2/3)πr³.'
  c10m12_recast: When a solid is melted and recast, its volume stays the same. Set the two volumes equal.
  c10m12_units: 'That is the volume in cubic metres. The question asks for litres: how many litres are in one cubic metre?'
  c10m12_radius: Use the radius, which is half the diameter.
concepts:
- code: cbse10m.solid.surface
  title: Surface area of combined solids
  notes: |
    Formulas: cuboid 2(lb + bh + hl); cube 6a²; cylinder curved 2πrh, total 2πr(r + h); cone curved πrl with
    l = √(r² + h²); sphere 4πr²; hemisphere curved 2πr², total 3πr². For a solid made by joining shapes, the
    total surface area is the sum of the curved/outer surfaces that remain visible; faces that are joined
    (hidden) are not counted.
  explanations:
    text: When solids are stuck together, like a cone on a hemisphere (an ice-cream cone) or a cylinder with hemispherical ends (a capsule), the surface you can touch is just the outside parts. Add the curved surfaces you can see, and leave out the circles where the pieces join.
    visual: 'Draw a capsule: a cylinder with a hemisphere on each end. Colour the outside surface: two hemisphere domes and the cylinder''s side. The circles where they meet are inside, not coloured.'
    step_by_step: 'Step 1: Name the pieces. Step 2: Decide which surfaces are visible. Step 3: Use the right formula for each visible surface. Step 4: Add them.'
    real_world: To paint a toy shaped like a cone on a hemisphere, you only need paint for the cone's slanted side and the hemisphere's dome.
  picture:
    kind: compare
    columns:
    - title: Capsule
      points:
      - 'Cylinder side: 2πrh'
      - 'Two hemisphere domes: 2 × 2πr²'
      - 'Hidden: the circles where they join'
    - title: 'Toy: cone on hemisphere'
      points:
      - 'Cone''s slanted side: πrl'
      - 'Hemisphere dome: 2πr²'
      - 'Hidden: the shared flat circle'
    alt: Two combined solids. A capsule's surface is the cylinder side plus two hemisphere domes. A cone-on-hemisphere toy's surface is the cone's slanted side plus the dome. Joined faces are hidden.
  activity:
    type: formula
    prompt: A toy is a cone of radius 3 cm on a hemisphere of the same radius. Change the cone's height h.
    inputs:
    - name: h
      label: Cone height h
      min: 1
      max: 12
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: l
      label: Slant height l = √(9 + h²)
      expr: sqrt(9+h^2)
      unit: cm
      places: 2
    - name: vis
      label: 'Outside of the toy: 2πr² + πrl'
      expr: 2*pi*9+pi*3*sqrt(9+h^2)
      unit: cm²
      places: 1
    - name: all
      label: Both shapes' full surfaces added
      expr: 3*pi*9+pi*3*(sqrt(9+h^2)+3)
      unit: cm²
      places: 1
    goals:
    - prompt: Make the toy's outside surface about 103.7 cm², to paint it.
      want:
        vis:
        - 103
        - 104.5
      hint: 2π × 9 is the hemisphere's curve. What slant l gives 3πl ≈ 47.1?
      mistakes:
      - when:
          h: 5
        say: 'With h = 5 the slant is √34 ≈ 5.83. The curved surface uses the slant l, not the height: you want l = 5.'
      - when:
          h:
          - 1
          - 2
        say: Too flat a cone. The slant must be 5 cm.
    - prompt: Now make the outside surface about 120 cm².
      want:
        vis:
        - 119
        - 121
      mistakes:
      - when:
          h: 7
        say: h = 7 gives l ≈ 7.6 and about 128 cm². The slant is longer than the height, so the height is a bit less than the slant you need.
      - when:
          h:
          - 1
          - 4
        say: 'Too short: the slant must be nearly 6.7 cm. Count only the outside: the glued circles inside are hidden.'
  lesson:
    - teach: 'Many real objects are two solids joined together: a capsule is a cylinder with two hemispheres, an ice-cream cone is a cone with a hemisphere. Their surface area is the area you could paint from outside.'
      picture:
        kind: flow
        steps:
        - Name the solids
        - List the outside surfaces
        - Leave out the faces that touch
        - Add the areas
        alt: 'Four steps for a combined solid: name the parts, list the outside surfaces, leave out the hidden joining faces, add up.'
      check:
        prompt: A cone sits on a hemisphere of the same radius. Which surface is hidden?
        options:
        - The flat circles where they join
        - The cone's curved side
        - The hemisphere's curved side
        answer: The flat circles where they join
        why: The joining faces press against each other.
    - teach: 'Curved surfaces: cylinder 2πrh, cone πrl with slant l = √(r² + h²), sphere 4πr², hemisphere 2πr². A hemisphere''s total surface also has its flat circle: 3πr².'
      check:
        prompt: Curved surface of a hemisphere of radius r?
        options:
        - 2πr²
        - 4πr²
        - 3πr²
        answer: 2πr²
        why: Half of the sphere's 4πr².
    - teach: 'Example: a tent is a cylinder (r = 7 m, h = 3 m) with a cone on top (slant 10 m). Canvas = 2πrh + πrl = 2 × 22/7 × 7 × 3 + 22/7 × 7 × 10 = 132 + 220 = 352 m². There is no floor and no hidden join to paint.'
      check:
        prompt: Why don't we add the cone's base circle to the tent's canvas?
        options:
        - It is hidden where the cone meets the cylinder
        - It is too small
        - Cones have no base
        answer: It is hidden where the cone meets the cylinder
        why: That face is inside the tent.
  items:
  - prompt: Find the curved surface area of a hemisphere of radius 7 cm, in cm². Use π = 22/7.
    answer: '308'
    check: 2*Rational(22, 7)*49
    difficulty: 1
    hints:
    - Curved surface = 2πr².
    - 2 × 22/7 × 49.
    solution: 2 × 22/7 × 49 = 308 cm².
    mistakes:
      '462': c10_hemisphere_curved
  - prompt: Find the slant height of a cone with radius 6 cm and height 8 cm, in cm.
    answer: '10'
    check: sqrt(6^2 + 8^2)
    difficulty: 1
    hints:
    - l = √(r² + h²).
    - √(36 + 64).
    solution: l = √(36 + 64) = 10 cm.
    mistakes:
      '14': c10_add_not_square
  - prompt: A cylinder of radius 7 cm and height 10 cm has a hemisphere of radius 7 cm on each end. Find the total surface area in cm². Use π = 22/7.
    answer: '1056'
    check: 2*Rational(22, 7)*7*10 + 4*Rational(22, 7)*49
    difficulty: 2
    hints:
    - Cylinder side 2πrh = 440.
    - Two domes = 2 × 2πr² = 616.
    solution: 'Step 1: Cylinder side = 2 × 22/7 × 7 × 10 = 440. Step 2: Two domes = 4 × 22/7 × 49 = 616. Step 3: Total = 1056 cm².'
    mistakes: {"1364": "c10_hidden_faces", "748": "t10_combined_surface"}
  - prompt: A toy is a cone of radius 3.5 cm and slant height 5 cm on a hemisphere of the same radius. Find its total surface area, in cm². Use π = 22/7.
    answer: '132'
    check: Rational(22, 7)*Rational(7, 2)*5 + 2*Rational(22, 7)*Rational(7, 2)**2
    difficulty: 2
    hints:
    - Cone side = πrl = 22/7 × 3.5 × 5 = 55.
    - Dome = 2πr² = 77.
    solution: 'Step 1: Cone side = 55 cm². Step 2: Hemisphere dome = 2 × 22/7 × 12.25 = 77 cm². Step 3: Total = 132 cm².'
    mistakes: {"170.5": "c10_hidden_faces", "55": "t10_combined_surface"}
  - prompt: Two cubes of side 5 cm are joined end to end. What is the surface area of the new cuboid?
    options:
    - 250 cm²
    - 300 cm²
    - 150 cm²
    - 200 cm²
    answer: 250 cm²
    difficulty: 2
    hints:
    - The cuboid is 10 × 5 × 5.
    - 2(50 + 25 + 50).
    solution: 'Step 1: The cuboid is 10 × 5 × 5. Step 2: 2(10×5 + 5×5 + 5×10) = 2(125) = 250 cm². (Two faces are hidden, so it is less than 2 × 150.)'
    mistakes:
      300 cm²: c10_hidden_faces
  - prompt: A cube of side 10 cm has a hemisphere of radius 5 cm on top. Its total surface area is 600 + bπ cm². Find b.
    answer: '25'
    check: 2*25 - 25
    difficulty: 3
    hints:
    - Cube faces 600, minus the circle πr² hidden, plus the dome 2πr².
    - 600 − 25π + 50π.
    solution: 'Step 1: Cube = 600. Step 2: Remove the hidden circle (25π) and add the dome (50π). Step 3: Total = 600 + 25π, so b = 25.'
    mistakes: {"50": "c10_hidden_faces", "75": "c10_hidden_faces"}
  - prompt: Find the curved surface area of a cylinder of radius 7 cm and height 10 cm, in cm². Use π = 22/7.
    answer: '440'
    check: 2 * 22 / 7 * 7 * 10
    difficulty: 1
    hints:
    - Curved surface = 2πrh.
    - 2 × 22/7 × 7 = 44.
    solution: 44 × 10 = 440 cm².
    mistakes:
      '1540': c10m12_formula
      '220': c10m12_formula
  - prompt: Find the curved surface area of a cone of radius 7 cm and slant height 10 cm, in cm². Use π = 22/7.
    answer: '220'
    check: 22 / 7 * 7 * 10
    difficulty: 1
    hints:
    - Cone curved surface = πrl.
    - 22/7 × 7 = 22.
    solution: 22 × 10 = 220 cm².
    mistakes:
      '440': c10m12_formula
  - prompt: Find the surface area of a sphere of radius 7 cm, in cm². Use π = 22/7.
    answer: '616'
    check: 4 * 22 / 7 * 49
    difficulty: 1
    hints:
    - Sphere = 4πr².
    - 22/7 × 49 = 154.
    solution: 4 × 154 = 616 cm².
    mistakes:
      '154': c10m12_formula
      '308': c10m12_formula
  - prompt: Find the total surface area of a solid hemisphere of radius 7 cm, in cm². Use π = 22/7.
    answer: '462'
    check: 3 * 22 / 7 * 49
    difficulty: 2
    hints:
    - Curved part 2πr² plus the flat circle πr².
    - 3 × 154.
    solution: TSA = 3πr² = 3 × 154 = 462 cm².
    mistakes:
      '308': c10m12_csa_tsa
      '616': c10m12_formula
  - prompt: A capsule is a cylinder of radius 7 mm and length 10 mm with a hemisphere at each end. Find its surface area, in mm². Use π = 22/7.
    answer: '1056'
    check: 2 * 22 / 7 * 7 * 10 + 4 * 22 / 7 * 49
    difficulty: 3
    hints:
    - Two hemispheres make one sphere.
    - Cylinder curved 440 + sphere 616.
    solution: 440 + 616 = 1056 mm².
    mistakes:
      '1364': c10m12_hidden_faces
      '748': c10m12_formula
  - prompt: A tent is a cylinder of radius 7 m and height 3 m with a cone of slant height 10 m on top. How much canvas, in m²? Use π = 22/7.
    answer: '352'
    check: 2 * 22 / 7 * 7 * 3 + 22 / 7 * 7 * 10
    difficulty: 3
    hints:
    - Cylinder curved 2πrh + cone curved πrl.
    - 132 + 220.
    solution: Canvas = 132 + 220 = 352 m².
    mistakes:
      '506': c10m12_hidden_faces
      '198': c10m12_formula
  - prompt: Find the slant height of a cone with radius 5 cm and height 12 cm, in cm.
    answer: '13'
    check: (5**2 + 12**2) ** 0.5
    difficulty: 2
    hints:
    - l = √(r² + h²).
    - √(25 + 144).
    solution: l = √169 = 13 cm.
    mistakes:
      '17': c10m12_formula
      '7': c10m12_formula
  - prompt: A hemisphere of diameter 14 cm is cut from the top of a cylinder of radius 7 cm. Compared with the flat top, the scooped surface is…
    options:
    - Twice the area
    - The same area
    - Half the area
    - Four times the area
    answer: Twice the area
    difficulty: 3
    hints:
    - Flat top = πr².
    - Hemisphere curved = 2πr².
    solution: 2πr² is twice πr², so the scooped surface is twice the flat top.
    mistakes:
      The same area: c10m12_formula
  - prompt: A toy is a cone on a hemisphere of radius 3.5 cm. Which is NOT part of its outside surface?
    options:
    - The cone's flat base
    - The cone's curved side
    - The hemisphere's curved side
    - Every part of it is outside
    answer: The cone's flat base
    difficulty: 1
    hints:
    - Where do the two pieces join?
    - Can you paint that face?
    solution: The cone's base sits on the hemisphere's flat face; both are hidden.
    mistakes:
      Every part of it is outside: c10m12_hidden_faces
- code: cbse10m.solid.volume
  title: Volume of combined solids
  after:
  - cbse10m.solid.surface
  notes: |
    Volumes: cuboid lbh; cube a³; cylinder πr²h; cone (1/3)πr²h; sphere (4/3)πr³; hemisphere (2/3)πr³. The
    volume of a combined solid is the sum of the volumes of its parts (or the difference, when one is cut out
    of another). Unlike surface area, no part is 'hidden': every piece's volume counts.
  explanations:
    text: The space inside a combined solid is just the pieces' volumes added together. A tent shaped like a cylinder with a cone on top holds the cylinder's volume plus the cone's. If a shape is hollowed out, subtract the hollow.
    visual: 'Draw an ice-cream cone filled to the top with a hemisphere of ice-cream on it. Shade both parts: the ice-cream volume is the cone''s volume plus the hemisphere''s.'
    step_by_step: 'Step 1: Split the solid into simple parts. Step 2: Find each part''s volume. Step 3: Add (or subtract a hollow). Step 4: Check the units: cm³ or m³.'
    real_world: A pencil is roughly a cylinder with a cone at the tip. Its wood volume is the cylinder's plus the cone's, minus the thin cylinder of graphite.
  picture:
    kind: flow
    steps:
    - 'Cylinder: r = 3 cm, h = 7 cm → πr²h = 63π'
    - 'Cone on top: r = 3, h = 4 → (1/3)πr²h = 12π'
    - 'Add: 63π + 12π = 75π cm³'
    - ≈ 235.7 cm³ with π = 22/7
    alt: 'The volume of a cylinder with a cone on top: 63π plus 12π makes 75π cubic cm.'
  activity:
    type: formula
    prompt: A cone of the same base and height is carved out of a wooden cylinder. What's left = cylinder − cone.
    inputs:
    - name: r
      label: Radius r
      min: 1
      max: 10
      step: 1
      start: 1
      unit: cm
    - name: h
      label: Height h
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: cyl
      label: Cylinder πr²h
      expr: pi*r^2*h
      unit: cm³
      places: 1
    - name: cone
      label: Cone ⅓πr²h
      expr: pi*r^2*h/3
      unit: cm³
      places: 1
    - name: left
      label: Wood left
      expr: pi*r^2*h*2/3
      unit: cm³
      places: 1
    goals:
    - prompt: With r = 6 cm, make the wood left about 1056 cm³.
      want:
        r: 6
        left:
        - 1050
        - 1062
      hint: What's left is ⅔ of the cylinder.
      mistakes:
      - when:
          r: 6
          h: 7
        say: 'With h = 7, cylinder + cone make about 1056 cm³. But the cone was cut out: subtract it, don''t add it.'
      - when:
          r: 6
          h:
          - 9
          - 10
        say: The whole cylinder is about 1056 cm³ here, before carving. Taking the cone out leaves only ⅔.
    - prompt: With r = 3 cm, make the wood left about 150.8 cm³.
      want:
        r: 3
        left:
        - 150
        - 151.6
      mistakes:
      - when:
          r: 3
          h: 4
        say: h = 4 leaves about 75 cm³. Left = ⅔ πr²h, so h must be twice as tall.
      - when:
          r: 3
          h:
          - 5
          - 6
        say: That's the cylinder's whole volume near 150.8. After carving, only ⅔ stays.
  lesson:
    - teach: Volume is how much space a solid fills. For joined solids, add the volumes of the parts. For a hollow or cut-out solid, subtract the part removed. Faces don't matter for volume.
      check:
        prompt: A cone is drilled out of a cylinder. Volume left = ?
        options:
        - Cylinder − cone
        - Cylinder + cone
        - Cone − cylinder
        answer: Cylinder − cone
        why: The cone's space is gone.
    - teach: 'Formulas: cylinder πr²h, cone (1/3)πr²h, sphere (4/3)πr³, hemisphere (2/3)πr³. A cone holds one third of a cylinder with the same base and height.'
      picture:
        kind: bars
        unit: × πr³ when h = r
        bars:
        - label: cylinder
          value: 1
        - label: hemisphere
          value: 0.67
        - label: cone
          value: 0.33
        alt: With height equal to the radius, the cylinder holds 1 πr³, the hemisphere two thirds and the cone one third.
      check:
        prompt: 'Same base and height: a cylinder holds 30 litres. The cone holds…'
        options:
        - 10 litres
        - 15 litres
        - 90 litres
        answer: 10 litres
        why: One third.
    - teach: Melting and recasting keeps the volume the same. If a sphere is melted into small balls, number of balls = big volume ÷ small volume. 1 m³ = 1000 litres and 1000 cm³ = 1 litre.
      check:
        prompt: A metal sphere is melted into a cylinder. What stays the same?
        options:
        - Volume
        - Surface area
        - Radius
        answer: Volume
        why: No metal is lost.
  items:
  - prompt: Find the volume of a cone of radius 3 cm and height 7 cm, in cm³. Use π = 22/7.
    answer: '66'
    check: Rational(1, 3)*Rational(22, 7)*9*7
    difficulty: 1
    hints:
    - V = (1/3)πr²h.
    - 1/3 × 22/7 × 9 × 7.
    solution: V = 1/3 × 22/7 × 9 × 7 = 66 cm³.
    mistakes:
      '198': c10_cone_third
  - prompt: Find the volume of a hemisphere of radius 21 cm, in cm³. Use π = 22/7.
    answer: '19404'
    check: Rational(2, 3)*Rational(22, 7)*21**3
    difficulty: 2
    hints:
    - V = (2/3)πr³.
    - 2/3 × 22/7 × 9261.
    solution: V = 2/3 × 22/7 × 21³ = 19404 cm³.
    mistakes:
      '38808': c10_hemisphere_half
  - prompt: A cylinder of radius 3 cm and height 7 cm has a cone of the same radius and height 4 cm on top. The volume is kπ cm³. Find k.
    answer: '75'
    check: 9*7 + Rational(1, 3)*9*4
    difficulty: 2
    hints:
    - Cylinder = 9 × 7 π = 63π.
    - Cone = 1/3 × 9 × 4 π = 12π.
    solution: 'Step 1: Cylinder = 63π. Step 2: Cone = 12π. Step 3: Total = 75π, so k = 75.'
    mistakes: {"99": "c10_cone_third", "63": "t10_combined_volume"}
  - prompt: A cone of radius 7 cm and height 15 cm is cut from a cylinder with the same radius and height. The remaining volume is kπ cm³. Find k.
    answer: '490'
    check: Rational(2, 3)*49*15
    difficulty: 3
    hints:
    - Cylinder − cone = πr²h − (1/3)πr²h = (2/3)πr²h.
    - 2/3 × 49 × 15.
    solution: 'Step 1: Remaining = (2/3)πr²h. Step 2: = 2/3 × 49 × 15 π = 490π, so k = 490.'
    mistakes: {"245": "t10_cylinder_minus_cone", "735": "t10_cylinder_minus_cone"}
  - prompt: A sphere and a cylinder have the same radius r, and the cylinder's height is 2r. Which has the larger volume?
    options:
    - The cylinder
    - The sphere
    - They are equal
    - Can't tell
    answer: The cylinder
    difficulty: 2
    hints:
    - Cylinder = πr² × 2r = 2πr³.
    - Sphere = (4/3)πr³.
    solution: Cylinder = 2πr³, sphere = (4/3)πr³ ≈ 1.33πr³. The cylinder is larger (the sphere is 2/3 of it).
    mistakes: {"The sphere": "t10_compare_volumes", "They are equal": "t10_compare_volumes"}
  - prompt: A cuboid tank 2 m × 1.5 m × 1 m is full of water. How many litres does it hold? (1 m³ = 1000 litres)
    answer: '3000'
    check: 2*1.5*1*1000
    difficulty: 1
    hints:
    - Volume = 2 × 1.5 × 1 = 3 m³.
    - × 1000.
    solution: 'Step 1: 3 m³. Step 2: 3 × 1000 = 3000 litres.'
    mistakes:
      '3': c10_litres
  - prompt: Find the volume of a cylinder of radius 7 cm and height 10 cm, in cm³. Use π = 22/7.
    answer: '1540'
    check: 22 / 7 * 49 * 10
    difficulty: 1
    hints:
    - V = πr²h.
    - 22/7 × 49 = 154.
    solution: 154 × 10 = 1540 cm³.
    mistakes:
      '440': c10m12_vol_formula
      '513.33': c10m12_vol_formula
  - prompt: Find the volume of a sphere of radius 3 cm, as kπ cm³. Find k.
    answer: '36'
    check: 4 / 3 * 27
    difficulty: 2
    hints:
    - V = (4/3)πr³.
    - r³ = 27.
    solution: (4/3) × 27 = 36, so V = 36π.
    mistakes:
      '108': c10m12_vol_formula
      '12': c10m12_vol_formula
  - prompt: Find the volume of a cone of radius 6 cm and height 7 cm, in cm³. Use π = 22/7.
    answer: '264'
    check: 1 / 3 * 22 / 7 * 36 * 7
    difficulty: 2
    hints:
    - V = (1/3)πr²h.
    - 22/7 × 36 × 7 = 792.
    solution: 792 ÷ 3 = 264 cm³.
    mistakes:
      '792': c10m12_vol_formula
  - prompt: A metal sphere of radius 6 cm is melted into small spheres of radius 1 cm. How many small spheres?
    answer: '216'
    check: 6**3 / 1**3
    difficulty: 3
    hints:
    - Volumes are equal in total.
    - 'The (4/3)π cancels: compare r³.'
    solution: 6³ ÷ 1³ = 216 small spheres.
    mistakes:
      '6': c10m12_recast
      '36': c10m12_recast
  - prompt: A sphere of radius 3 cm is melted and recast into a cylinder of radius 3 cm. Find the cylinder's height in cm.
    answer: '4'
    check: 4 / 3 * 27 / 9
    difficulty: 3
    hints:
    - (4/3)π × 27 = π × 9 × h.
    - 36 = 9h.
    solution: h = 36 ÷ 9 = 4 cm.
    mistakes:
      '3': c10m12_recast
      '12': c10m12_recast
  - prompt: A hemispherical bowl has diameter 42 cm. How many litres does it hold? Use π = 22/7. (1000 cm³ = 1 litre)
    answer: '19.404'
    check: 2 / 3 * 22 / 7 * 21**3 / 1000
    difficulty: 3
    hints:
    - Radius = 21 cm.
    - V = (2/3)πr³ in cm³, then ÷ 1000.
    solution: V = (2/3) × 22/7 × 9261 = 19404 cm³ = 19.404 litres.
    mistakes:
      '155.232': c10m12_radius
      '38.808': c10m12_vol_formula
  - prompt: An ice-cream cone has radius 3 cm and height 7 cm with a hemisphere of ice-cream on top. Its volume is kπ cm³. Find k.
    answer: '39'
    check: 1 / 3 * 9 * 7 + 2 / 3 * 27
    difficulty: 3
    hints:
    - Cone (1/3)π × 9 × 7 = 21π.
    - Hemisphere (2/3)π × 27 = 18π.
    solution: 21π + 18π = 39π, so k = 39.
    mistakes:
      '21': c10m12_hidden_faces
      '57': c10m12_vol_formula
  - prompt: A cylinder and a cone have the same radius and height. The cylinder's volume is how many times the cone's?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Cone has a (1/3) in front.
    - Divide πr²h by (1/3)πr²h.
    solution: πr²h ÷ (1/3)πr²h = 3.
    mistakes:
      '2': c10m12_vol_formula
  - prompt: A water tank is a cylinder of radius 1 m and height 7 m. How many litres does it hold? Use π = 22/7. (1 m³ = 1000 litres)
    answer: '22000'
    check: 22 / 7 * 1 * 7 * 1000
    difficulty: 2
    hints:
    - V = πr²h in m³.
    - Then × 1000.
    solution: V = 22/7 × 1 × 7 = 22 m³ = 22000 litres.
    mistakes:
      '22': c10m12_units
      '44000': c10m12_formula
