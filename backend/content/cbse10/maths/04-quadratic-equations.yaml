# CBSE Class 10 Mathematics (NCERT), chapter 4. Format: content/README.md.
subject: cbse10-math
chapter: 4
title: Quadratic Equations
tips:
  c10_root_sign: "Factorise, then set each bracket to zero: (x − k) = 0 gives x = +k, and (x + k) = 0 gives x = −k. Check by substituting."
  c10_reject_negative: A length, age or number of people can't be negative. Keep the root that makes sense.
  c10_discriminant_sign: "D = b² − 4ac subtracts 4ac. Square b (it is always positive), then take away 4 × a × c, minding the sign of c."
  c10_simplify_root: "Simplify the root by taking out a perfect square: √12 = √(4 × 3) = 2√3. Then divide every term by the number in front."
  t10_discriminant_nature: "Work out D = b² − 4ac. If D is positive there are two different real roots, if zero the roots are equal, and if negative there are none that are real."
  t10_equal_roots_d0: "Equal roots means D = 0. Set k² − 4 × 1 × 16 = 0 and solve for k."
  t10_formula_2a: "x = (−b ± √D) / 2a. With a = 2 the bottom is 4, and −b is −1."
  t10_quadratic_power_two: "A quadratic has highest power 2. Look at the highest power in each option."
  t10_split_middle: "Multiply a × c, then find two numbers with that product that add to b. Split the middle term with them, group in pairs and factorise."
  c10m4_pair: Look for two numbers that multiply to a × c and add to b. Check both conditions before splitting.
  c10m4_bracket_sign: If a bracket is (x + 3), setting it to 0 gives x = −3, not 3. Flip the sign when you solve each bracket.
  c10m4_D: "Work out D = b² − 4ac carefully, signs included. Is it above zero, exactly zero or below zero? Then picture the parabola: does it cross, touch or miss the x-axis?"
  c10m4_sense: In a word problem, a length, age or count cannot be negative. Keep the root that makes sense.
  c10m4_formula: In x = (−b ± √D) / 2a, divide the whole top by 2a, and start with −b, not b.
concepts:
- code: cbse10m.quad.factorise
  title: Solving quadratic equations by factorising
  notes: |
    A quadratic equation is ax² + bx + c = 0 with a ≠ 0. Its roots are the values of x that satisfy it, the
    zeroes of ax² + bx + c. To solve by factorising, split the middle term: find two numbers whose product is
    ac and whose sum is b, factorise into two brackets, and set each bracket to 0. Word problems lead to
    quadratics (e.g. area, consecutive numbers, speed); reject roots that make no sense (negative lengths).
  explanations:
    text: 'To solve x² − 5x + 6 = 0, find two numbers that multiply to 6 and add to −5: −2 and −3. So (x − 2)(x − 3) = 0. A product is 0 only if one bracket is 0, so x = 2 or x = 3.'
    visual: 'Draw a rectangle with area x² + 5x + 6 made of tiles: one x × x square, five x × 1 strips and six small squares. They fit into a rectangle (x + 2) by (x + 3), so x² + 5x + 6 = (x + 2)(x + 3).'
    step_by_step: 'Step 1: Write the equation as ax² + bx + c = 0. Step 2: Find two numbers with product ac and sum b. Step 3: Split the middle term and factorise. Step 4: Set each factor to 0 and solve. Step 5: Check both roots, and reject any that don''t fit the situation.'
    real_world: A rectangular garden is 3 m longer than it is wide and has an area of 40 m². Then x(x + 3) = 40, so x² + 3x − 40 = 0 = (x + 8)(x − 5). The width can't be −8, so it is 5 m.
  picture:
    kind: area_grid
    cols:
    - size: 3
      label: x
    - size: 1.6
      label: + 3
    rows:
    - size: 3
      label: x
    - size: 1.2
      label: + 2
    cells:
    - - x²
      - 3x
    - - 2x
      - '6'
    caption: x² + 5x + 6 = (x + 2)(x + 3), so x² + 5x + 6 = 0 when x = −2 or x = −3.
    alt: A rectangle x + 3 wide and x + 2 tall made of x², 3x, 2x and 6, showing x² + 5x + 6 = (x + 2)(x + 3).
  activity:
    type: formula
    prompt: x² + 3x − 40 = (x − 5)(x + 8). Move x and watch both brackets.
    inputs:
    - name: x
      label: x
      min: -10
      max: 10
      step: 1
      start: 0
    outputs:
    - name: v
      label: x² + 3x − 40
      expr: x^2+3*x-40
    - name: f1
      label: x − 5
      expr: x-5
    - name: f2
      label: x + 8
      expr: x+8
    goals:
    - prompt: 'Find the positive root: the x that makes x² + 3x − 40 = 0.'
      want:
        v: 0
        x:
        - 1
        - 10
      hint: A product is 0 when one bracket is 0. When is x − 5 = 0?
      mistakes:
      - when:
          x: 8
        say: 'x = 8 gives 64 + 24 − 40 = 48. The bracket (x + 8) is 0 at x = −8, not 8: a bracket is 0 at minus its number.'
      - when:
          x: 4
        say: 'x = 4 gives −12: still below 0. Look at which bracket can reach 0 for a positive x.'
    - prompt: Now find the negative root. Could a plot of land be this wide?
      want:
        v: 0
        x:
        - -10
        - -1
      mistakes:
      - when:
          x: -5
        say: x = −5 gives 25 − 15 − 40 = −30. (x − 5) is 0 at +5; the other bracket, (x + 8), gives the negative root.
      - when:
          x: 8
        say: That's positive. The negative root makes (x + 8) = 0.
  lesson:
    - teach: 'A quadratic equation has the form ax² + bx + c = 0 with a ≠ 0. Its roots are the values of x that make it true. To solve by factorising, split the middle term: find two numbers that multiply to ac and add to b.'
      check:
        prompt: For x² + 5x + 6, which two numbers multiply to 6 and add to 5?
        options:
        - 2 and 3
        - 1 and 6
        - −2 and −3
        answer: 2 and 3
        why: 2 × 3 = 6 and 2 + 3 = 5.
    - teach: 'Then factorise and set each bracket to zero. 2x² − 5x + 3 = 0: ac = 6, numbers −2 and −3. 2x² − 2x − 3x + 3 = 2x(x − 1) − 3(x − 1) = (2x − 3)(x − 1). So x = 3/2 or x = 1.'
      picture:
        kind: flow
        steps:
        - 2x² − 5x + 3 = 0
        - 'Split: −2x − 3x'
        - 2x(x − 1) − 3(x − 1)
        - (2x − 3)(x − 1) = 0
        - x = 3/2 or x = 1
        alt: Solving 2x squared minus 5x plus 3 equals 0 by splitting the middle term.
      check:
        prompt: (x + 4)(x − 7) = 0 gives…
        options:
        - x = −4 or 7
        - x = 4 or −7
        - x = 4 or 7
        answer: x = −4 or 7
        why: Each bracket is zero at the opposite sign.
    - teach: 'Many problems lead to quadratics: areas, consecutive numbers, ages, speeds. Solve, then reject roots that make no sense, like a negative length.'
      check:
        prompt: A width comes out as 6 or −9 metres. Which is the answer?
        options:
        - 6 m
        - −9 m
        - Both
        answer: 6 m
        why: A width cannot be negative.
  items:
  - prompt: Solve x² − 5x + 6 = 0. Give the larger root.
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Two numbers that multiply to 6 and add to −5.
    - (x − 2)(x − 3) = 0.
    solution: 'Step 1: (x − 2)(x − 3) = 0. Step 2: x = 2 or x = 3. The larger is 3.'
    mistakes:
      '-3': c10_root_sign
  - prompt: Solve x² + 7x + 12 = 0. Give the larger root.
    answer: '-3'
    check: '-3'
    difficulty: 1
    hints:
    - Two numbers that multiply to 12 and add to 7.
    - (x + 3)(x + 4) = 0.
    solution: 'Step 1: (x + 3)(x + 4) = 0. Step 2: x = −3 or x = −4. The larger is −3.'
    mistakes:
      '3': c10_root_sign
  - prompt: Which is a quadratic equation?
    options:
    - x² − 3x = 4
    - x³ − x = 0
    - 2x + 1 = 7
    - 1/x = 2
    answer: x² − 3x = 4
    difficulty: 1
    hints:
    - The highest power of x must be 2.
    - x³ is degree 3.
    solution: x² − 3x = 4 has highest power 2, so it is quadratic.
    mistakes: {"x³ − x = 0": "t10_quadratic_power_two", "2x + 1 = 7": "t10_quadratic_power_two"}
  - prompt: Solve 2x² − x − 6 = 0. Give the positive root.
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 'Product ac = −12, sum −1: use −4 and 3.'
    - 2x² − 4x + 3x − 6 = (x − 2)(2x + 3).
    solution: 'Step 1: 2x² − 4x + 3x − 6 = 2x(x − 2) + 3(x − 2) = (x − 2)(2x + 3). Step 2: x = 2 or x = −3/2. The positive root is 2.'
    mistakes: {"1.5": "c10_root_sign", "3": "t10_split_middle"}
  - prompt: A rectangle is 3 m longer than it is wide and its area is 40 m². Find its width in metres.
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - x(x + 3) = 40.
    - x² + 3x − 40 = (x + 8)(x − 5).
    solution: 'Step 1: x² + 3x − 40 = 0. Step 2: (x + 8)(x − 5) = 0. Step 3: A width can''t be −8, so it is 5 m.'
    mistakes:
      '-8': c10_reject_negative
  - prompt: The product of two consecutive positive whole numbers is 306. Find the smaller number.
    answer: '17'
    check: '17'
    difficulty: 3
    hints:
    - x(x + 1) = 306.
    - x² + x − 306 = (x + 18)(x − 17).
    solution: 'Step 1: x² + x − 306 = 0. Step 2: (x + 18)(x − 17) = 0. Step 3: x must be positive, so x = 17 (and 17 × 18 = 306).'
    mistakes:
      '18': c10_other_unknown
  - prompt: Solve x² − 3x − 10 = 0. Give the negative root.
    answer: '-2'
    check: '-2'
    difficulty: 1
    hints:
    - Numbers multiplying to −10 and adding to −3.
    - −5 and 2.
    solution: 'Step 1: (x − 5)(x + 2) = 0. Step 2: x = 5 or −2; negative root −2.'
    mistakes:
      '2': c10m4_bracket_sign
      '-5': c10m4_bracket_sign
  - prompt: Solve 6x² − x − 2 = 0. Give the positive root as a fraction.
    answer: 2/3
    check: 2/3
    difficulty: 2
    hints:
    - 'ac = −12: numbers −4 and 3.'
    - 6x² − 4x + 3x − 2.
    solution: 'Step 1: 2x(3x − 2) + 1(3x − 2) = (2x + 1)(3x − 2). Step 2: x = 2/3 or −1/2.'
    mistakes:
      1/2: c10m4_bracket_sign
      -2/3: c10m4_bracket_sign
  - prompt: Is x = 3 a root of x² − 2x − 3 = 0?
    options:
    - 'Yes'
    - 'No'
    - Only if x is negative
    - It has no roots
    answer: 'Yes'
    difficulty: 1
    hints:
    - Substitute x = 3.
    - 9 − 6 − 3.
    solution: 9 − 6 − 3 = 0, so 3 is a root.
    mistakes:
      'No': c10m4_pair
  - prompt: Solve x² = 49. Give the positive root.
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Take the square root.
    - Remember ± .
    solution: x = ±7, so the positive root is 7.
    mistakes:
      '49': c10m4_formula
      '-7': c10m4_sense
  - prompt: The sum of a number and its square is 72. If the number is positive, find it.
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - x² + x − 72 = 0.
    - Numbers multiplying to −72, adding to 1.
    solution: 'Step 1: (x + 9)(x − 8) = 0. Step 2: x = 8 (positive).'
    mistakes:
      '9': c10m4_bracket_sign
      '-9': c10m4_sense
  - prompt: A right triangle's base is 7 cm more than its height, and its hypotenuse is 13 cm. Find the height, in cm.
    answer: '5'
    check: '5'
    difficulty: 3
    hints:
    - h² + (h + 7)² = 169.
    - 2h² + 14h − 120 = 0, so h² + 7h − 60 = 0.
    solution: 'Step 1: (h + 12)(h − 5) = 0. Step 2: h = 5 cm (base 12 cm).'
    mistakes:
      '12': c10m4_sense
      '-12': c10m4_sense
  - prompt: Which equation is NOT quadratic?
    options:
    - (x + 1)² = x² + 3
    - x² + 2x = 0
    - 2x² = 8
    - x(x − 1) = 4
    answer: (x + 1)² = x² + 3
    difficulty: 2
    hints:
    - Expand and simplify each one.
    - Does the x² survive?
    solution: '(x + 1)² = x² + 2x + 1, so the equation becomes 2x + 1 = 3: the x² cancels, so it is linear.'
    mistakes:
      x(x − 1) = 4: c10m4_pair
  - prompt: Solve 3x² − 12 = 0. Give the positive root.
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - 3x² = 12.
    - x² = 4.
    solution: x² = 4, so x = ±2; positive root 2.
    mistakes:
      '4': c10m4_formula
  - prompt: A train travels 360 km at a uniform speed. If the speed were 5 km/h more, it would take 1 hour less. Find the speed, in km/h.
    answer: '40'
    check: '40'
    difficulty: 3
    hints:
    - 360/x − 360/(x + 5) = 1.
    - x² + 5x − 1800 = 0.
    solution: 'Step 1: (x + 45)(x − 40) = 0. Step 2: x = 40 km/h.'
    mistakes:
      '45': c10m4_bracket_sign
      '-45': c10m4_sense
- code: cbse10m.quad.formula
  title: The quadratic formula and nature of roots
  after:
  - cbse10m.quad.factorise
  notes: |
    The roots of ax² + bx + c = 0 are x = (−b ± √(b² − 4ac)) / 2a, found by completing the square. The
    discriminant D = b² − 4ac decides the nature of the roots: D > 0 two distinct real roots; D = 0 two equal
    real roots (−b/2a); D < 0 no real roots.
  explanations:
    text: The formula x = (−b ± √(b² − 4ac)) / 2a solves any quadratic. The part under the root, b² − 4ac, is called the discriminant. If it is positive there are two different roots, if it is zero there is one repeated root, and if it is negative there are no real roots.
    visual: 'Picture parabolas against the x-axis: one dipping below the axis (crosses twice, D > 0), one just touching it (D = 0), and one floating above it (never crosses, D < 0).'
    step_by_step: 'Step 1: Read a, b and c. Step 2: Work out D = b² − 4ac. Step 3: If D < 0, stop: no real roots. Step 4: Otherwise x = (−b + √D)/2a and x = (−b − √D)/2a. Step 5: Check by substituting.'
    real_world: 'Engineers use the discriminant to see whether a thrown object ever reaches a certain height: if D < 0 for that height, it never gets there.'
  picture:
    kind: compare
    columns:
    - title: D > 0
      points:
      - Two different real roots
      - Graph crosses the x-axis twice
    - title: D = 0
      points:
      - Two equal real roots, −b/2a
      - Graph touches the x-axis once
    - title: D < 0
      points:
      - No real roots
      - Graph never meets the x-axis
    alt: 'The discriminant D = b² − 4ac: positive gives two different roots, zero gives two equal roots, negative gives no real roots.'
  activity:
    type: formula
    prompt: 'For x² + bx + c = 0 the discriminant D = b² − 4c decides the roots: D > 0 two, D = 0 one repeated, D < 0 none.'
    inputs:
    - name: b
      label: b
      min: -10
      max: 10
      step: 1
      start: 0
    - name: c
      label: c
      min: -10
      max: 10
      step: 1
      start: 0
    outputs:
    - name: d
      label: D = b² − 4c
      expr: b^2-4*c
    - name: n
      label: Real roots
      expr: 1+(b^2-4*c)/max(abs(b^2-4*c),0.000001)
    goals:
    - prompt: Make x² + 6x + c have two equal roots.
      want:
        b: 6
        d: 0
      hint: 'Equal roots need D = 0: 36 − 4c = 0.'
      mistakes:
      - when:
          b: 6
          c: -9
        say: 'D = 36 + 36 = 72: subtracting 4 × (−9) adds 36. For D = 0, 4c must be +36.'
      - when:
          b: 6
          c: 6
        say: 'D = 36 − 24 = 12, still above 0: two different roots.'
    - prompt: With b = 4, make the equation have no real roots.
      want:
        b: 4
        n: 0
      mistakes:
      - when:
          b: 4
          c: 4
        say: 'D = 16 − 16 = 0: one repeated root, not none. c needs to be a little bigger.'
      - when:
          b: 4
          c:
          - -10
          - 3
        say: D = 16 − 4c is still positive, so the parabola crosses the axis twice. D < 0 needs 4c > 16.
    - prompt: With c = 5, make two different real roots.
      want:
        c: 5
        n: 2
      mistakes:
      - when:
          c: 5
          b:
          - -4
          - 4
        say: 'D = b² − 20 is 0 or less here. b² must be more than 20: try a bigger b, either sign.'
  lesson:
    - teach: 'Every quadratic ax² + bx + c = 0 can be solved with the quadratic formula: x = (−b ± √(b² − 4ac)) / 2a. It comes from completing the square. For x² − 4x + 1 = 0: x = (4 ± √12)/2 = 2 ± √3.'
      check:
        prompt: In the formula, the top starts with…
        options:
        - −b
        - b
        - a
        answer: −b
        why: x = (−b ± √D) / 2a.
    - teach: The part under the root, D = b² − 4ac, is the discriminant. It tells the nature of the roots without solving.
      picture:
        kind: compare
        columns:
        - title: D > 0
          points:
          - Two distinct real roots
          - Parabola crosses twice
        - title: D = 0
          points:
          - Two equal real roots
          - Touches once
        - title: D < 0
          points:
          - No real roots
          - Misses the axis
        alt: 'The discriminant decides the roots: positive gives two, zero gives one repeated, negative gives none.'
      check:
        prompt: For x² + x + 1 = 0, D = 1 − 4 = −3. The roots are…
        options:
        - Not real
        - Two equal
        - Two distinct
        answer: Not real
        why: D < 0.
  items:
  - prompt: Find the discriminant of x² − 4x + 3.
    answer: '4'
    check: (-4)^2 - 4*1*3
    difficulty: 1
    hints:
    - D = b² − 4ac.
    - 16 − 12.
    solution: 'Step 1: a = 1, b = −4, c = 3. Step 2: D = 16 − 12 = 4.'
    mistakes:
      '28': c10_discriminant_sign
  - prompt: What is the nature of the roots of x² + 2x + 5 = 0?
    options:
    - No real roots
    - Two equal real roots
    - Two different real roots
    - One root only
    answer: No real roots
    difficulty: 1
    hints:
    - Work out b² − 4ac.
    - 4 − 20 = −16.
    solution: 'Step 1: D = 4 − 20 = −16. Step 2: D < 0, so there are no real roots.'
    mistakes: {"Two different real roots": "c10_discriminant_sign", "Two equal real roots": "t10_discriminant_nature"}
  - prompt: What is the nature of the roots of 4x² − 12x + 9 = 0?
    options:
    - Two equal real roots
    - No real roots
    - Two different real roots
    - Three roots
    answer: Two equal real roots
    difficulty: 2
    hints:
    - D = 144 − 144.
    - 4x² − 12x + 9 = (2x − 3)².
    solution: 'Step 1: D = (−12)² − 4 × 4 × 9 = 144 − 144 = 0. Step 2: So the roots are equal: x = 3/2.'
    mistakes: {"No real roots": "t10_discriminant_nature", "Two different real roots": "t10_discriminant_nature"}
  - prompt: Use the formula to solve x² − 6x + 7 = 0. The roots are 3 ± √k. Find k.
    answer: '2'
    check: (36 - 28)/4
    difficulty: 2
    hints:
    - D = 36 − 28 = 8.
    - x = (6 ± √8)/2 = 3 ± √2.
    solution: 'Step 1: D = 36 − 28 = 8. Step 2: x = (6 ± √8)/2 = (6 ± 2√2)/2 = 3 ± √2. So k = 2.'
    mistakes:
      '8': c10_simplify_root
  - prompt: For which positive k does x² + kx + 16 = 0 have equal roots?
    answer: '8'
    check: sqrt(64)
    difficulty: 2
    hints:
    - 'Equal roots: D = 0.'
    - k² − 64 = 0.
    solution: 'Step 1: D = k² − 64 = 0. Step 2: k = ±8; the positive value is 8.'
    mistakes: {"4": "t10_equal_roots_d0", "64": "t10_equal_roots_d0"}
  - prompt: Solve 2x² + x − 6 = 0 with the formula. Give the positive root as a fraction like 3/2.
    answer: 3/2
    check: (-1 + sqrt(49))/4
    difficulty: 3
    hints:
    - D = 1 + 48 = 49.
    - x = (−1 ± 7)/4.
    solution: 'Step 1: D = 1² − 4 × 2 × (−6) = 49. Step 2: x = (−1 + 7)/4 = 3/2 or (−1 − 7)/4 = −2.'
    mistakes: {"2": "c10_root_sign", "3": "t10_formula_2a"}
  - prompt: Find the discriminant of 2x² − 7x + 3.
    answer: '25'
    check: 49 - 24
    difficulty: 1
    hints:
    - D = b² − 4ac.
    - 49 − 4 × 2 × 3.
    solution: D = 49 − 24 = 25.
    mistakes:
      '73': c10m4_D
      '-25': c10m4_D
  - prompt: What is the nature of the roots of 2x² − 3x + 5 = 0?
    options:
    - No real roots
    - Two distinct real roots
    - Two equal real roots
    - One root only
    answer: No real roots
    difficulty: 1
    hints:
    - D = 9 − 40.
    - Is it negative?
    solution: D = 9 − 40 = −31 < 0, so there are no real roots.
    mistakes:
      Two distinct real roots: c10m4_D
  - prompt: Find the positive k for which 2x² + kx + 3 = 0 has equal roots. It is k = 2√m; find m.
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - 'Equal roots: D = 0.'
    - k² = 24.
    solution: 'Step 1: k² − 24 = 0. Step 2: k = √24 = 2√6, so m = 6.'
    mistakes:
      '24': c10m4_formula
      '12': c10m4_D
  - prompt: Use the formula on x² + 4x − 5 = 0. Give the larger root.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - D = 16 + 20 = 36.
    - x = (−4 ± 6)/2.
    solution: 'Step 1: D = 36, √D = 6. Step 2: x = (−4 + 6)/2 = 1 or (−4 − 6)/2 = −5.'
    mistakes:
      '5': c10m4_formula
      '-5': c10m4_formula
  - prompt: For which value of D does a quadratic have two equal roots?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - The ± part adds nothing.
    - √D must be 0.
    solution: When D = 0, both roots are −b/2a.
    mistakes:
      '1': c10m4_D
  - prompt: Is it possible to design a rectangular park with perimeter 80 m and area 400 m²?
    options:
    - Yes, a 20 m by 20 m square
    - No, D is negative
    - Yes, 30 m by 10 m
    - No, the area is too small
    answer: Yes, a 20 m by 20 m square
    difficulty: 3
    hints:
    - l + b = 40 and lb = 400.
    - 'x² − 40x + 400 = 0: find D.'
    solution: 'Step 1: x² − 40x + 400 = 0 has D = 1600 − 1600 = 0. Step 2: equal roots x = 20, so a 20 m × 20 m park works.'
    mistakes:
      Yes, 30 m by 10 m: c10m4_sense
      No, D is negative: c10m4_D
  - prompt: The roots of x² − 2x − 1 = 0 are 1 ± √k. Find k.
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
