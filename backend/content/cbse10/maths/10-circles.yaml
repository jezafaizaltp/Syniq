# CBSE Class 10 Mathematics (NCERT), chapter 10. Format: content/README.md.
subject: cbse10-math
chapter: 10
title: Circles
tips:
  c10_pythag_subtract: 'The line to the centre is the hypotenuse. To find the tangent (a shorter side), subtract the squares: √(d² − r²).'
  c10_half_chord: That is half the chord. The radius to the point of contact cuts the chord in half, so double it.
  c10_supplementary: In OAPB the angles at A and B are both 90°, so ∠APB and ∠AOB add to 180°.
  t10_bisects_angle: "OP bisects the angle between the two tangents. Halve ∠APB."
  t10_equal_tangents: "The two tangents from one outside point are always equal."
  t10_pitot: "For a quadrilateral around a circle, opposite sides add up equally: AB + CD = BC + AD."
  t10_rhs: "Look at triangles OAP and OBP: what angles, sides and shared side do they have?"
  t10_tangent_perp: "The radius drawn to the point of contact meets the tangent at a right angle."
  t10_tangents_inside: "Every line through a point inside the circle cuts the circle twice. Can any of them be a tangent?"
  t10_two_tangents: "From an outside point there are exactly two tangents, one on each side."
  c10m10_pyth: The radius, the tangent and the line to the centre make a right triangle with the right angle at the point of contact. Which one is the hypotenuse?
  c10m10_secant: A tangent touches the circle at exactly one point. A line that cuts it at two points is a secant.
  c10m10_on_circle: "Two tangents come from a point outside the circle. Here the point sits on the circle itself."
  c10m10_through: "A tangent only touches the circle once. This line goes in and out again."
  c10m10_kite: In quadrilateral OAPB the angles at A and B are 90° each. The four angles add up to 360°.
  c10m10_split_tangent: Each side of the figure is made of two tangent pieces. Pieces from the same corner are equal; name them and add.
  c10m10_parallel: Tangents at the two ends of a diameter are both perpendicular to that diameter. What does that make them?
concepts:
- code: cbse10m.circ.tangent
  title: Tangent to a circle
  notes: |
    A tangent is a line that meets a circle at exactly one point, the point of contact; a secant meets it at
    two points. Theorem: the tangent at any point of a circle is perpendicular to the radius through the point
    of contact. There is exactly one tangent at a point on the circle, none through a point inside, and two
    through a point outside.
  explanations:
    text: A tangent just touches a circle at one point, like a wheel touching the road. The radius drawn to that point always meets the tangent at a right angle. That right angle lets you use Pythagoras with the radius, the tangent and the line to the centre.
    visual: 'Draw a circle with centre O and a straight road touching it at P. Draw the radius OP: it stands straight up from the road at 90°, like a spoke pointing at the ground.'
    step_by_step: 'Step 1: Join the centre to the point of contact. Step 2: Mark the right angle between that radius and the tangent. Step 3: Use the right triangle: (line from centre)² = radius² + tangent².'
    real_world: 'When a car wheel rolls on a flat road, the spoke pointing straight down is always perpendicular to the road: the road is a tangent to the wheel.'
  picture:
    kind: geometry
    points:
      O:
      - 4
      - 5
      P:
      - 4
      - 1
      Q:
      - 9
      - 1
      _L:
      - 0
      - 1
    circles:
    - centre: O
      radius: 4
    segments:
    - - _L
      - Q
    - - O
      - P
      - r = 4
    - - P
      - Q
      - tangent
    - - O
      - Q
    angles:
    - at: P
      from: Q
      to: O
      label: 90°
    caption: The radius OP meets the tangent at P at a right angle, so OQ² = OP² + PQ².
    alt: A circle with centre O and a tangent line touching it at P. The radius OP is perpendicular to the tangent, making a right triangle OPQ.
  activity:
    type: angle
    prompt: Turn the arm to make each angle in a circle with tangents.
    goals:
    - prompt: Make the angle between a radius and the tangent at its point of contact.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: 180° would make the tangent run along the radius, into the circle. The tangent touches at right angles to the radius.
      - when:
          degrees:
          - 45
          - 60
        say: 'Too narrow: the tangent would cut into the circle. It meets the radius at a right angle.'
    - prompt: Tangents PA and PB meet at P with ∠APB = 80°. Make ∠AOB at the centre.
      degrees: 100
      mistakes:
      - when:
          degrees: 80
        say: 'Not equal: OAPB has right angles at A and B, so ∠AOB + ∠APB = 360° − 180° = 180°.'
      - when:
          degrees: 280
        say: 280° is the reflex angle round the other side. Inside OAPB, ∠AOB and ∠APB add to 180°.
    - prompt: PA is a tangent and OA a radius. ∠OPA = 30°. Make ∠AOP.
      degrees: 60
      mistakes:
      - when:
          degrees: 90
        say: The 90° is at A, where radius meets tangent. The three angles of triangle OAP add to 180°.
      - when:
          degrees: 30
        say: 30° is at P. At O it's what's left from 180° after 90° and 30°.
  lesson:
    - teach: A line can meet a circle in two points (a secant), in no points, or in exactly one point. A line that touches the circle at exactly one point is a tangent, and that point is the point of contact.
      check:
        prompt: A line meets a circle at exactly one point. It is a…
        options:
        - Tangent
        - Secant
        - Chord
        answer: Tangent
        why: One point of contact means it only touches.
    - teach: 'Key theorem: the tangent at any point is perpendicular to the radius through that point. So the radius, the tangent and the line from the centre to an outside point form a right triangle with the right angle at the point of contact.'
      picture:
        kind: geometry
        points:
          O:
          - 0
          - 0
          A:
          - 0
          - 3
          P:
          - 4
          - 3
        segments:
        - - O
          - A
        - - A
          - P
        - - O
          - P
        angles:
        - at: A
          from: O
          to: P
        alt: Centre O, radius OA = 3 up to the point of contact A, tangent AP = 4 along the top, and OP = 5 as the hypotenuse; the right angle is at A.
      check:
        prompt: In the picture, which side is the hypotenuse?
        options:
        - OP
        - OA
        - AP
        answer: OP
        why: It is opposite the right angle at A.
    - teach: 'Use Pythagoras: OP² = OA² + AP². With radius 3 and OP = 5, the tangent AP = √(25 − 9) = 4. From a point inside the circle there is no tangent; from a point on the circle there is exactly one.'
      check:
        prompt: Radius 5 cm, P is 13 cm from the centre. Tangent length?
        options:
        - 12 cm
        - 8 cm
        - 18 cm
        answer: 12 cm
        why: √(169 − 25) = 12.
  items:
  - prompt: How many tangents can be drawn to a circle from a point outside it?
    options:
    - '2'
    - '1'
    - '0'
    - Infinitely many
    answer: '2'
    difficulty: 1
    hints:
    - Picture lines from the point just grazing the circle.
    - One on each side.
    solution: From a point outside a circle there are exactly two tangents.
    mistakes: {"1": "t10_two_tangents", "Infinitely many": "t10_two_tangents"}
  - prompt: What angle does a tangent make with the radius at the point of contact?
    options:
    - 90°
    - 45°
    - 60°
    - 180°
    answer: 90°
    difficulty: 1
    hints:
    - It's the main theorem of the chapter.
    - Perpendicular.
    solution: 'The tangent is perpendicular to the radius at the point of contact: 90°.'
    mistakes: {"45°": "t10_tangent_perp", "180°": "t10_tangent_perp"}
  - prompt: A tangent from a point Q, 5 cm from the centre, touches a circle of radius 3 cm. Find the tangent's length in cm.
    answer: '4'
    check: sqrt(5^2 - 3^2)
    difficulty: 1
    hints:
    - The radius and tangent meet at 90°.
    - √(25 − 9).
    solution: 'Step 1: OQ² = r² + PQ². Step 2: PQ = √(25 − 9) = 4 cm.'
    mistakes:
      '34': c10_pythag_subtract
  - prompt: From a point Q, the tangent to a circle is 24 cm long and Q is 25 cm from the centre. Find the radius in cm.
    answer: '7'
    check: sqrt(25^2 - 24^2)
    difficulty: 2
    hints:
    - r² + 24² = 25².
    - √(625 − 576).
    solution: 'Step 1: r² = 25² − 24² = 49. Step 2: r = 7 cm.'
    mistakes: {"1": "c10_pythag_subtract", "49": "c10_pythag_subtract"}
  - prompt: How many tangents can be drawn through a point inside a circle?
    options:
    - '0'
    - '1'
    - '2'
    - Infinitely many
    answer: '0'
    difficulty: 2
    hints:
    - Any line through an inside point...
    - '...cuts the circle twice.'
    solution: Every line through an inside point cuts the circle at two points, so no tangent passes through it.
    mistakes: {"1": "t10_tangents_inside", "2": "t10_tangents_inside"}
  - prompt: Two concentric circles have radii 5 cm and 3 cm. Find the length of a chord of the bigger circle that touches the smaller one, in cm.
    answer: '8'
    check: 2*sqrt(25 - 9)
    difficulty: 3
    hints:
    - The chord is tangent to the small circle, so it meets its radius at 90°.
    - Half-chord = √(25 − 9) = 4.
    solution: 'Step 1: The small radius is perpendicular to the chord and bisects it. Step 2: Half-chord = √(5² − 3²) = 4. Step 3: Chord = 8 cm.'
    mistakes:
      '4': c10_half_chord
  - prompt: The radius of a circle is 8 cm and a point P is 17 cm from the centre. Find the length of the tangent from P, in cm.
    answer: '15'
    check: (17**2 - 8**2) ** 0.5
    difficulty: 2
    hints:
    - Right angle at the point of contact.
    - Tangent² = 17² − 8².
    solution: Tangent = √(289 − 64) = √225 = 15 cm.
    mistakes:
      '9': c10m10_pyth
      '25': c10m10_pyth
  - prompt: The tangent from P is 12 cm and the radius is 9 cm. How far is P from the centre, in cm?
    answer: '15'
    check: (12**2 + 9**2) ** 0.5
    difficulty: 2
    hints:
    - OP is the hypotenuse.
    - OP² = 12² + 9².
    solution: OP = √(144 + 81) = √225 = 15 cm.
    mistakes:
      '3': c10m10_pyth
      '21': c10m10_pyth
  - prompt: How many tangents can a circle have in all?
    options:
    - Infinitely many
    - One
    - Two
    - Four
    answer: Infinitely many
    difficulty: 1
    hints:
    - There is a tangent at every point on the circle.
    - How many points does a circle have?
    solution: Each point of the circle has its own tangent, so there are infinitely many.
    mistakes:
      Two: c10m10_secant
  - prompt: A line cuts a circle at two points. What is it called?
    options:
    - Secant
    - Tangent
    - Radius
    - Diameter
    answer: Secant
    difficulty: 1
    hints:
    - A tangent only touches.
    - This one goes through.
    solution: A line meeting a circle in two points is a secant.
    mistakes:
      Tangent: c10m10_through
  - prompt: Tangents are drawn at the two ends of a diameter. How are they related?
    options:
    - They are parallel
    - They meet at the centre
    - They are perpendicular
    - They are the same line
    answer: They are parallel
    difficulty: 2
    hints:
    - Each tangent makes 90° with the diameter.
    - Two lines at 90° to the same line…
    solution: Both are perpendicular to the same diameter, so they are parallel.
    mistakes:
      They are perpendicular: c10m10_parallel
  - prompt: PQ is a tangent at Q to a circle with centre O. ∠OPQ = 35°. Find ∠POQ in degrees.
    answer: '55'
    check: 180 - 90 - 35
    difficulty: 2
    hints:
    - ∠OQP = 90°.
    - Angles of triangle OPQ add to 180°.
    solution: ∠POQ = 180° − 90° − 35° = 55°.
    mistakes:
      '145': c10m10_pyth
      '35': c10m10_pyth
  - prompt: A chord of the outer of two concentric circles (radii 10 cm and 6 cm) touches the inner circle. Find the chord's length in cm.
    answer: '16'
    check: 2 * (10**2 - 6**2) ** 0.5
    difficulty: 3
    hints:
    - The inner radius meets the chord at 90°, at the chord's midpoint.
    - Half-chord = √(10² − 6²).
    solution: Half-chord = √(100 − 36) = 8, so the chord is 16 cm.
    mistakes:
      '8': c10m10_pyth
  - prompt: The tangent at a point P of a circle and the radius OP meet at what angle, in degrees?
    answer: '90'
    check: '90'
    difficulty: 1
    hints:
    - This is the main theorem of the chapter.
    - 'Think of the picture: radius up, tangent across.'
    solution: 'The tangent is perpendicular to the radius at the point of contact: 90°.'
    mistakes:
      '180': c10m10_pyth
      '45': c10m10_pyth
  - prompt: A point P lies on a circle. How many tangents to the circle pass through P?
    options:
    - Exactly one
    - None
    - Two
    - Infinitely many
    answer: Exactly one
    difficulty: 1
    hints:
    - 'Inside: none. Outside: two.'
    - On the circle itself…
    solution: Through a point on the circle there is exactly one tangent.
    mistakes:
      Two: c10m10_on_circle
- code: cbse10m.circ.two_tangents
  title: Two tangents from an outside point
  after:
  - cbse10m.circ.tangent
  notes: |
    The lengths of the two tangents drawn from an external point to a circle are equal (proved with congruent
    right triangles OPA and OPB, RHS). The line from the centre to the external point bisects the angle
    between the tangents. The angle between the two tangents and the angle between the radii to the points
    of contact add up to 180°. A quadrilateral circumscribing a circle has AB + CD = AD + BC.
  explanations:
    text: 'If you draw two tangents to a circle from the same outside point, they are exactly the same length. That one fact solves many problems: for example, in a four-sided shape drawn around a circle, opposite sides add up to the same total.'
    visual: 'Draw a circle and a point P outside it. Draw the two tangents PA and PB, and the radii OA and OB. You get a kite shape OAPB: PA = PB, OA = OB, and the angles at A and B are right angles.'
    step_by_step: 'Step 1: Spot tangents from the same point and mark them equal. Step 2: Mark right angles where radii meet tangents. Step 3: In quadrilateral OAPB, ∠APB + ∠AOB = 180°. Step 4: For a quadrilateral around a circle, split each side into tangent pieces and add.'
    real_world: A belt wrapped around a pulley leaves it along two straight tangent lines. From the point where they meet, both straight pieces have the same length.
  picture:
    kind: geometry
    points:
      O:
      - 3
      - 5
      A:
      - 5.1
      - 8.2
      B:
      - 5.1
      - 1.8
      P:
      - 10
      - 5
    circles:
    - centre: O
      radius: 3.83
    segments:
    - - P
      - A
      - tangent
    - - P
      - B
      - tangent
    - - O
      - A
    - - O
      - B
    - - O
      - P
    angles:
    - at: A
      from: O
      to: P
      label: 90°
    - at: B
      from: P
      to: O
      label: 90°
    caption: 'PA = PB: tangents from the same outside point are equal, and OP bisects the angle APB.'
    alt: A circle with centre O and two tangents PA and PB from an outside point P. The radii OA and OB meet the tangents at right angles, and PA equals PB.
  activity:
    type: formula
    prompt: A tangent from P touches the circle at A. Radius OA ⊥ PA, so OA² + PA² = OP².
    inputs:
    - name: r
      label: Radius OA
      min: 1
      max: 15
      step: 1
      start: 1
      unit: cm
    - name: op
      label: Distance OP
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: t
      label: Tangent length PA (= PB)
      expr: sqrt(max(0,op^2-r^2))
      unit: cm
      places: 2
    goals:
    - prompt: P is 13 cm from the centre and the tangent PA is 12 cm. Find the radius.
      want:
        op: 13
        t: 12
      hint: r² + 12² = 13².
      mistakes:
      - when:
          op: 13
          r: 1
        say: '13 − 12 = 1 subtracts lengths, but OA and PA meet at a right angle: r² + 12² = 13².'
      - when:
          op: 13
          r: 12
        say: 12 is the tangent, not the radius. The radius is the other short side of the right triangle.
    - prompt: The radius is 6 cm and the tangent is 8 cm. How far is P from the centre?
      want:
        r: 6
        t: 8
      mistakes:
      - when:
          r: 6
          op: 14
        say: '6 + 8 = 14 adds the two sides, but OP is the hypotenuse: √(6² + 8²).'
      - when:
          r: 6
          op:
          - 1
          - 6
        say: P must be outside the circle, further than the radius, or there is no tangent from it.
  lesson:
    - teach: 'From a point P outside a circle you can draw exactly two tangents, PA and PB. They are always equal in length: triangles OAP and OBP are congruent (right angle, equal radii, shared OP).'
      picture:
        kind: geometry
        points:
          O:
          - 3
          - 5
          A:
          - 4.8
          - 7.4
          B:
          - 4.8
          - 2.6
          P:
          - 8
          - 5
        segments:
        - - O
          - A
        - - O
          - B
        - - A
          - P
        - - B
          - P
        - - O
          - P
        angles:
        - at: A
          from: O
          to: P
        - at: B
          from: O
          to: P
        alt: Circle centre O with tangents PA and PB from the outside point P; radii OA and OB meet the tangents at right angles, and OP joins the centre to P.
      check:
        prompt: PA = 9 cm. What is PB?
        options:
        - 9 cm
        - 18 cm
        - 4.5 cm
        answer: 9 cm
        why: Tangents from one outside point are equal.
    - teach: OP bisects the angle APB, and in quadrilateral OAPB the angles at A and B are 90°. So ∠AOB + ∠APB = 180°. If ∠APB = 70°, then ∠AOB = 110° and ∠OPA = 35°.
      check:
        prompt: ∠APB = 50°. Then ∠AOB = ?
        options:
        - 130°
        - 50°
        - 100°
        answer: 130°
        why: 180° − 50° = 130°.
    - teach: When a circle sits inside a quadrilateral touching all four sides, each side is split into two tangent pieces. Pieces from the same corner are equal, so AB + CD = AD + BC. For a triangle around a circle, name the pieces from each corner and add.
      check:
        prompt: A quadrilateral around a circle has AB = 5, CD = 7, BC = 6. AD = ?
        options:
        - '6'
        - '8'
        - '18'
        answer: '6'
        why: AB + CD = 12 = BC + AD, so AD = 6.
  items:
  - prompt: From a point P, two tangents PA and PB are drawn. PA = 7 cm. Find PB in cm.
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Tangents from one point are equal.
    - PB = PA.
    solution: PB = PA = 7 cm.
    mistakes: {"14": "t10_equal_tangents", "3.5": "t10_equal_tangents"}
  - prompt: Two tangents from P make an angle ∠APB = 80°. Find ∠AOB in degrees, where O is the centre.
    answer: '100'
    check: 180 - 80
    difficulty: 2
    hints:
    - In OAPB the angles at A and B are 90°.
    - ∠APB + ∠AOB = 180°.
    solution: 'Step 1: The four angles add to 360° and two are 90°. Step 2: ∠AOB = 180° − 80° = 100°.'
    mistakes:
      '80': c10_supplementary
  - prompt: The tangents from P make ∠APB = 60°. Find ∠OPA in degrees.
    answer: '30'
    check: 60/2
    difficulty: 2
    hints:
    - OP bisects the angle between the tangents.
    - 60 ÷ 2.
    solution: OP bisects ∠APB, so ∠OPA = 30°.
    mistakes: {"60": "t10_bisects_angle", "120": "c10_supplementary"}
  - prompt: A quadrilateral ABCD is drawn around a circle. AB = 6, BC = 7 and CD = 4. Find AD.
    answer: '3'
    check: 6 + 4 - 7
    difficulty: 3
    hints:
    - AB + CD = AD + BC.
    - 6 + 4 = AD + 7.
    solution: 'Step 1: For a quadrilateral around a circle, AB + CD = BC + AD. Step 2: 10 = 7 + AD, so AD = 3.'
    mistakes: {"5": "t10_pitot", "17": "t10_pitot"}
  - prompt: Why are the two tangents from an outside point equal?
    options:
    - The right triangles OAP and OBP are congruent (RHS)
    - All lines from P are equal
    - The circle is symmetric about every line
    - Because OA = OP
    answer: The right triangles OAP and OBP are congruent (RHS)
    difficulty: 2
    hints:
    - Both have a right angle, the common hypotenuse OP, and OA = OB.
    - RHS congruence.
    solution: △OAP and △OBP have right angles at A and B, common hypotenuse OP and OA = OB (radii), so they are congruent by RHS and PA = PB.
    mistakes: {"All lines from P are equal": "t10_rhs", "Because OA = OP": "t10_rhs"}
  - prompt: From a point 13 cm from the centre of a circle of radius 5 cm, two tangents are drawn. Find the length of each tangent, in cm.
    answer: '12'
    check: sqrt(13^2 - 5^2)
    difficulty: 1
    hints:
    - Right angle at the point of contact.
    - √(169 − 25).
    solution: Each tangent = √(13² − 5²) = √144 = 12 cm.
    mistakes:
      '194': c10_pythag_subtract
  - prompt: Two tangents from P make ∠APB = 110°. Find ∠AOB in degrees.
    answer: '70'
    check: 180 - 110
    difficulty: 2
    hints:
    - In OAPB, the angles at A and B are 90° each.
    - ∠AOB + ∠APB = 180°.
    solution: ∠AOB = 180° − 110° = 70°.
    mistakes:
      '110': c10m10_kite
      '250': c10m10_kite
  - prompt: ∠AOB = 140° for tangents PA and PB. Find ∠APB in degrees.
    answer: '40'
    check: 180 - 140
    difficulty: 2
    hints:
    - The four angles of OAPB add to 360°.
    - Two of them are right angles.
    solution: ∠APB = 360° − 90° − 90° − 140° = 40°.
    mistakes:
      '140': c10m10_kite
      '220': c10m10_kite
  - prompt: Tangents PA and PB make ∠APB = 90° and the radius is 5 cm. What shape is OAPB?
    options:
    - A square
    - A rhombus that is not a square
    - A trapezium
    - A kite that is not a square
    answer: A square
    difficulty: 3
    hints:
    - All four angles are 90°.
    - OA = OB and PA = PB; is PA also 5?
    solution: All angles are 90° so it is a rectangle; OA = OB = 5 and PA = PB, and a rectangle with two equal neighbouring sides (OA = AP here, since ∠OPA = 45°) is a square.
    mistakes:
      A kite that is not a square: c10m10_kite
  - prompt: A circle touches the sides of quadrilateral PQRS. PQ = 8, QR = 9, RS = 10. Find SP.
    answer: '9'
    check: 8 + 10 - 9
    difficulty: 2
    hints:
    - Opposite sides add up equally.
    - PQ + RS = QR + SP.
    solution: PQ + RS = 18 = QR + SP, so SP = 18 − 9 = 9.
    mistakes:
      '27': c10m10_split_tangent
      '11': c10m10_split_tangent
  - prompt: A triangle ABC is drawn around a circle. The tangent pieces from A, B and C are 4 cm, 6 cm and 8 cm. Find BC in cm.
    answer: '14'
    check: 6 + 8
    difficulty: 2
    hints:
    - Side BC is made of the piece from B and the piece from C.
    - Add those two.
    solution: BC = 6 + 8 = 14 cm.
    mistakes:
      '10': c10m10_split_tangent
      '12': c10m10_split_tangent
  - prompt: For that triangle (pieces 4, 6, 8 cm from A, B, C), find the perimeter in cm.
    answer: '36'
    check: 2 * (4 + 6 + 8)
    difficulty: 2
    hints:
    - Each piece is used on two sides.
    - Perimeter = 2 × (sum of the pieces).
    solution: Perimeter = 2 × (4 + 6 + 8) = 36 cm.
    mistakes:
      '18': c10m10_split_tangent
  - prompt: Tangents PA and PB make ∠APB = 70°. Find ∠PAB in degrees.
    answer: '55'
    check: (180 - 70) / 2
