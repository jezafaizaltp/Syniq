# CBSE Class 10 Mathematics (NCERT), chapter 9. Format: content/README.md.
subject: cbse10-math
chapter: 9
title: Some Applications of Trigonometry
tips:
  c10_depression_angle: 'Angle of depression from the top equals angle of elevation from the bottom: they are alternate angles.'
concepts:
- code: cbse10m.trig.heights
  title: Heights and distances
  notes: |
    The line of sight joins the eye to the object. The angle of elevation is the angle between the horizontal
    and the line of sight when looking up; the angle of depression is between the horizontal and the line of
    sight when looking down. Draw the right triangle formed by the height, the horizontal distance and the
    line of sight, then use tan (height/distance) or sin/cos. The angle of depression from A to B equals the
    angle of elevation from B to A (alternate angles).
  explanations:
    text: 'To find a height you can''t measure, stand a known distance away and measure the angle up to the top: the angle of elevation. The height, the distance and your line of sight make a right triangle, so height = distance × tan(angle).'
    visual: Draw a tower standing on flat ground. Mark a person 30 m from its foot, and a slanted line from the person's feet to the top of the tower. The angle at the person's feet is 60°. The tower is the opposite side; the 30 m is the adjacent side.
    step_by_step: 'Step 1: Draw the picture and mark the right angle. Step 2: Mark the angle of elevation or depression in the right place. Step 3: Label what you know and what you want. Step 4: Choose tan, sin or cos. Step 5: Solve, using √3 ≈ 1.732 if asked.'
    real_world: Firefighters use the angle of elevation to choose how far from a building to park so their ladder reaches the right window.
  picture:
    kind: geometry
    points:
      P:
      - 1
      - 1
      F:
      - 6
      - 1
      T:
      - 6
      - 9.66
    segments:
    - - P
      - F
      - 30 m
    - - F
      - T
      - h
    - - P
      - T
    angles:
    - at: P
      from: F
      to: T
      label: 60°
    - at: F
      from: T
      to: P
      label: 90°
    caption: tan 60° = h/30, so h = 30√3 ≈ 52 m.
    alt: A tower of height h whose foot is 30 m from a point P on the ground. The angle of elevation from P to the top is 60°, so h = 30√3.
  items:
  - prompt: From a point 30 m from the foot of a tower, the angle of elevation of the top is 45°. Find the height in metres.
    answer: '30'
    check: 30*tan(pi/4)
    difficulty: 1
    hints:
    - tan 45° = h/30.
    - tan 45° = 1.
    solution: 'Step 1: tan 45° = h/30 = 1. Step 2: h = 30 m.'
  - prompt: A kite's string is 100 m long and makes an angle of 30° with the ground. How high is the kite, in metres?
    answer: '50'
    check: 100*sin(pi/6)
    difficulty: 2
    hints:
    - sin 30° = height/string.
    - 100 × 1/2.
    solution: 'Step 1: sin 30° = h/100. Step 2: h = 100 × 1/2 = 50 m.'
  - prompt: A tower is 30 m from a point and the angle of elevation of its top is 60°. Its height is 30√k m. Find k.
    answer: '3'
    check: (30*tan(pi/3)/30)^2
    difficulty: 2
    hints:
    - tan 60° = h/30.
    - tan 60° = √3.
    solution: 'Step 1: h = 30 tan 60° = 30√3 m. So k = 3.'
  - prompt: From the top of a cliff the angle of depression of a boat is 30°. What is the angle of elevation of the cliff top from the boat?
    options:
    - 30°
    - 60°
    - 90°
    - 45°
    answer: 30°
    difficulty: 1
    hints:
    - The horizontal at the top is parallel to the sea.
    - Alternate angles are equal.
    solution: The angle of depression and the angle of elevation are alternate angles between parallel horizontals, so both are 30°.
    mistakes:
      60°: c10_depression_angle
  - prompt: From the top of a 75 m lighthouse, the angle of depression of a ship is 45°. How far is the ship from the foot of the lighthouse, in metres?
    answer: '75'
    check: 75/tan(pi/4)
    difficulty: 2
    hints:
    - The angle of elevation from the ship is also 45°.
    - tan 45° = 75/d.
    solution: 'Step 1: tan 45° = 75/d. Step 2: d = 75 m.'
  - prompt: A pole casts a shadow √3 times its height. Find the sun's angle of elevation in degrees.
    answer: '30'
    check: '30'
    difficulty: 3
    hints:
    - tan θ = height/shadow = 1/√3.
    - Which angle has tan = 1/√3?
    solution: 'Step 1: tan θ = h/(√3 h) = 1/√3. Step 2: θ = 30°.'
    mistakes:
      '60': c10_trig_upside
