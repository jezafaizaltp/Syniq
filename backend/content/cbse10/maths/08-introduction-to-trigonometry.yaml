# CBSE Class 10 Mathematics (NCERT), chapter 8. Format: content/README.md.
subject: cbse10-math
chapter: 8
title: Introduction to Trigonometry
tips:
  c10m8_tan_order: "Draw the triangle: sec = hypotenuse/adjacent. tan is opposite/adjacent, so check which side goes on top."
  c10m8_dont_forget: "Did you include all three parts? The last term, cosec 60°, is taken away."
  c10m8_same_ratio: "Adding to 90° links sin of one with cos of the other. Here both are cos: what does an equal cos say about acute angles?"
  c10_trig_upside: 'Check which side goes on top: sin and cos have the hypotenuse on the bottom; tan is opposite over adjacent.'
  c10_trig_which: That's tan, not sin. sin uses the hypotenuse, so find it with Pythagoras first.
  c10_sin_cos_swap: "The sin row and cos row run in opposite directions: the angle whose sine is ½ is the angle whose cosine is √3/2. Read the right row."
  t10_identity_one: "There is an identity: sin²A + cos²A is the same number for every angle. Square each value, then add, and see."
  t10_pythag_trig: "sin A = 3/5 means opposite 3, hypotenuse 5. Find the adjacent side, then cos = adjacent/hypotenuse."
  t10_sec_identity: "1 + tan²A = sec²A. Square the secant."
  t10_tan_def: "tan = opposite/adjacent. Write sin and cos as sides over the hypotenuse and see which division gives that."
  t10_trig_table: "Use the pattern: sin at 0°, 30°, 45°, 60°, 90° is √0/2, √1/2, √2/2, √3/2, √4/2, and cos runs the other way. tan = sin ÷ cos. Put each value in, then work out."
  c10m8_soh: 'Name the sides from the angle''s point of view: opposite is across from it, adjacent is next to it, hypotenuse is the longest. sin = opp/hyp, cos = adj/hyp, tan = opp/adj.'
  c10m8_third_side: You know two sides of the right triangle. Find the third with Pythagoras before you write the ratio you need.
  c10m8_flip: cosec, sec and cot are the upside-down versions of sin, cos and tan. Check whether the fraction should be flipped.
  c10m8_table: 'Rebuild the table: sin goes 0, 1/2, 1/√2, √3/2, 1 for 0°, 30°, 45°, 60°, 90°; cos runs the same values backwards.'
  c10m8_tan_row: "Go along the tan row of your table, angle by angle, and stop where the value matches the one given."
  c10m8_identity: Use sin²A + cos²A = 1 (or 1 + tan²A = sec²A). Square the ratios before you add them.
  pq10m8_sin_not_tan: 'That is opposite ÷ slope. tan uses opposite ÷ adjacent: find the ground length first.'
  pq10m8_cos_not_tan: That is adjacent ÷ hypotenuse. Which ratio is tan?
  pq10m8_forgot_tan: sin²30° + cos²30° is only part of the sum. Add tan 45° too.
  pq10m8_check_values: Look up the real values of sin 30°, sin 60° and sin 90°, then compare both sides.
concepts:
- code: cbse10m.trig.ratios
  title: Trigonometric ratios
  notes: |
    In a right triangle ABC with the right angle at B, for the acute angle A: sin A = opposite/hypotenuse =
    BC/AC, cos A = adjacent/hypotenuse = AB/AC, tan A = opposite/adjacent = BC/AB; cosec A = 1/sin A,
    sec A = 1/cos A, cot A = 1/tan A; tan A = sin A/cos A. The ratios depend only on the angle, not on the
    size of the triangle. Given one ratio, draw a triangle with those sides and find the others by Pythagoras.
  explanations:
    text: 'In a right-angled triangle, pick an acute angle. The side across from it is the opposite, the side next to it (not the longest) is the adjacent, and the longest side is the hypotenuse. sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent. A memory aid: SOH CAH TOA.'
    visual: 'Draw a right triangle with the right angle at B. Stand at corner A and look across: the side you face, BC, is opposite. The side you stand on, AB, is adjacent. The slanted side AC is the hypotenuse.'
    step_by_step: 'Step 1: Mark the angle you''re working with. Step 2: Label opposite, adjacent and hypotenuse from that angle. Step 3: Pick the ratio that uses the sides you know. Step 4: If a side is missing, find it with Pythagoras first.'
    real_world: A wheelchair ramp must not be too steep. If it rises 1 m over a slope of 12 m, then sin of its angle is 1/12, which builders check against safety rules.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 1
      B:
      - 9
      - 1
      C:
      - 9
      - 7
    segments:
    - - A
      - B
      - adjacent 4
    - - B
      - C
      - opposite 3
    - - A
      - C
      - hypotenuse 5
    angles:
    - at: B
      from: C
      to: A
      label: 90°
    - at: A
      from: B
      to: C
      label: A
    caption: 'From angle A: sin A = 3/5, cos A = 4/5, tan A = 3/4.'
    alt: A right triangle with the right angle at B. From angle A, the opposite side is 3, the adjacent side 4 and the hypotenuse 5.
  activity:
    type: formula
    prompt: Right triangle ABC with the right angle at B. Change the side opposite A and the side next to A.
    inputs:
    - name: o
      label: Opposite A (BC)
      min: 1
      max: 12
      step: 1
      start: 1
    - name: a
      label: Adjacent to A (AB)
      min: 1
      max: 12
      step: 1
      start: 1
    outputs:
    - name: h
      label: Hypotenuse AC
      expr: sqrt(o^2+a^2)
      places: 2
    - name: sin
      label: sin A = opp ÷ hyp
      expr: o/sqrt(o^2+a^2)
      places: 3
    - name: cos
      label: cos A = adj ÷ hyp
      expr: a/sqrt(o^2+a^2)
      places: 3
    - name: tan
      label: tan A = opp ÷ adj
      expr: o/a
      places: 3
    goals:
    - prompt: Make sin A = 0.6 with a hypotenuse of 10.
      want:
        sin: 0.6
        h: 10
      hint: sin A = opposite ÷ hypotenuse. 0.6 of 10 is?
      mistakes:
      - when:
          o: 8
          a: 6
        say: 'That makes sin A = 0.8 and cos A = 0.6: opposite and adjacent swapped. Opposite is the side facing A.'
      - when:
          o: 6
          a: 10
        say: The 10 went on the adjacent side, but 10 must be the hypotenuse, the longest side, facing the right angle.
    - prompt: Make tan A = 4/3 with a hypotenuse of 5.
      want:
        tan:
        - 1.333
        - 1.334
        h: 5
      mistakes:
      - when:
          o: 3
          a: 4
        say: 'tan A = 3/4 = 0.75: flipped. tan is opposite over adjacent.'
    - prompt: Make sin A = 0.6 again, with a hypotenuse of 15.
      want:
        sin: 0.6
        h: 15
      mistakes:
      - when:
          o: 6
          a: 8
        say: 'That''s the triangle with hypotenuse 10. Scale every side by the same amount: the ratio stays 0.6.'
  lesson:
    - teach: In a right triangle, pick one acute angle A. The side across from A is the opposite, the side next to A (not the hypotenuse) is the adjacent, and the longest side, across from the right angle, is the hypotenuse.
      picture:
        kind: geometry
        points:
          A:
          - 0
          - 0
          B:
          - 4
          - 0
          C:
          - 4
          - 3
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - A
        angles:
        - at: A
          from: B
          to: C
        alt: 'Right triangle ABC with the right angle at B: AB = 4 is adjacent to angle A, BC = 3 is opposite, AC = 5 is the hypotenuse.'
      check:
        prompt: In the picture, which side is opposite angle A?
        options:
        - BC
        - AB
        - AC
        answer: BC
        why: BC is across from A.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find the right angle; the side across from it is the hypotenuse. Step 2: Stand at angle A. Step 3: The side across from A is the opposite. Step 4: The remaining side, touching A, is the adjacent. Step 5: Switch to the other acute angle and opposite and adjacent swap; the hypotenuse stays.'
      - style: real_world
        teach: A ladder leans on a wall. The ladder is the hypotenuse. For the angle at the ground, the height it reaches up the wall is the opposite side, and the gap between its foot and the wall is the adjacent side.
    - teach: 'sin A = opposite/hypotenuse, cos A = adjacent/hypotenuse, tan A = opposite/adjacent. Their reciprocals: cosec A = 1/sin A, sec A = 1/cos A, cot A = 1/tan A. Also tan A = sin A/cos A. With sides 3, 4, 5: sin A = 3/5, cos A = 4/5, tan A = 3/4.'
      check:
        prompt: With opposite 3, adjacent 4, hypotenuse 5, sec A = ?
        options:
        - 5/4
        - 4/5
        - 5/3
        answer: 5/4
        why: sec = 1/cos = 5/4.
      ways:
      - style: visual
        teach: 'From angle A: opposite 3, adjacent 4, hypotenuse 5. So sin A = 3/5, cos A = 4/5 and tan A = 3/4. A memory aid: SOH CAH TOA.'
        picture:
          kind: geometry
          points:
            A:
            - 1
            - 1
            B:
            - 9
            - 1
            C:
            - 9
            - 7
          segments:
          - - A
            - B
            - adjacent 4
          - - B
            - C
            - opposite 3
          - - A
            - C
            - hypotenuse 5
          angles:
          - at: A
            from: B
            to: C
            label: A
          - at: B
            from: A
            to: C
            label: 90°
          alt: A right triangle with the right angle at B. From angle A, the adjacent side is 4, the opposite side is 3 and the hypotenuse is 5.
      - style: step_by_step
        teach: 'Step 1: Label the sides from A: opposite 3, adjacent 4, hypotenuse 5. Step 2: SOH: sin A = opposite/hypotenuse = 3/5. Step 3: CAH: cos A = adjacent/hypotenuse = 4/5. Step 4: TOA: tan A = opposite/adjacent = 3/4. Step 5: Flip each for the reciprocals: cosec A = 5/3, sec A = 5/4, cot A = 4/3.'
    - teach: The ratios depend only on the angle, not on the size of the triangle. Given one ratio, draw a triangle with those sides, find the third side by Pythagoras, and read off the others. If tan A = 8/15, the hypotenuse is √(64 + 225) = 17, so sin A = 8/17.
      check:
        prompt: If cos A = 12/13, what is sin A?
        options:
        - 5/13
        - 12/5
        - 13/5
        answer: 5/13
        why: Third side √(169 − 144) = 5.
      ways:
      - style: visual
        teach: Given one ratio, build the triangle and read the rest.
        picture:
          kind: flow
          steps:
          - tan A = 8/15
          - opposite 8, adjacent 15
          - hyp = √(64 + 225) = 17
          - sin A = 8/17
          - cos A = 15/17
          alt: From tan A equals 8 over 15, the sides are 8 and 15, the hypotenuse is 17, so sin A is 8 over 17 and cos A is 15 over 17.
      - style: real_world
        teach: 'A ramp rises 1 m for every 12 m along the ground. A short ramp and a long ramp with the same slope have the same steepness: tan A = 1/12 for both. The ratio depends only on the angle, not on how big the triangle is.'
  items:
  - prompt: In a right triangle the side opposite angle A is 3 and the hypotenuse is 5. Find sin A. Type a fraction.
    answer: 3/5
    check: 3/5
    difficulty: 1
    hints:
    - sin = opposite/hypotenuse.
    - 3/5.
    solution: sin A = opposite/hypotenuse = 3/5.
    mistakes:
      5/3: c10_trig_upside
  - prompt: With opposite 3, adjacent 4 and hypotenuse 5, find tan A. Type a fraction.
    answer: 3/4
    check: 3/4
    difficulty: 1
    hints:
    - tan = opposite/adjacent.
    - 3/4.
    solution: tan A = 3/4.
    mistakes:
      4/3: c10_trig_upside
  - prompt: If sin A = 3/5, find cos A. Type a fraction.
    answer: 4/5
    check: sqrt(25 - 9)/5
    difficulty: 2
    hints:
    - Draw a triangle with opposite 3, hypotenuse 5.
    - Adjacent = √(25 − 9) = 4.
    solution: 'Step 1: Adjacent = √(5² − 3²) = 4. Step 2: cos A = 4/5.'
    mistakes: {"3/4": "c10_trig_upside", "2/5": "t10_pythag_trig"}
  - prompt: If tan A = 5/12, find sin A. Type a fraction.
    answer: 5/13
    check: 5/sqrt(5^2 + 12^2)
    difficulty: 2
    hints:
    - Opposite 5, adjacent 12.
    - Hypotenuse = √(25 + 144) = 13.
    solution: 'Step 1: Hypotenuse = √(144 + 25) = 13. Step 2: sin A = 5/13.'
    mistakes:
      5/12: c10_trig_which
  - prompt: Which equals tan A?
    options:
    - sin A / cos A
    - cos A / sin A
    - sin A × cos A
    - 1 / sin A
    answer: sin A / cos A
    difficulty: 1
    hints:
    - (opp/hyp) ÷ (adj/hyp).
    - The hypotenuses cancel.
    solution: sin A / cos A = (opp/hyp)/(adj/hyp) = opp/adj = tan A.
    mistakes: {"cos A / sin A": "t10_tan_def", "sin A × cos A": "t10_tan_def"}
  - prompt: If cos A = 7/25, find tan A. Type a fraction.
    answer: 24/7
    check: sqrt(625 - 49)/7
    difficulty: 3
    hints:
    - Adjacent 7, hypotenuse 25.
    - Opposite = √(625 − 49) = 24.
    solution: 'Step 1: Opposite = √(25² − 7²) = √576 = 24. Step 2: tan A = 24/7.'
    mistakes:
      7/24: c10_trig_upside
  - prompt: In a right triangle, opposite = 8 and adjacent = 15. Find sin A as a fraction.
    answer: 8/17
    check: 8/17
    difficulty: 2
    hints:
    - Hypotenuse = √(64 + 225).
    - = 17.
    solution: 'Step 1: Hypotenuse = 17. Step 2: sin A = 8/17.'
    mistakes:
      8/15: c10m8_soh
      15/17: c10m8_soh
  - prompt: If sin A = 12/13, find cos A as a fraction.
    answer: 5/13
    check: 5/13
    difficulty: 2
    hints:
    - Adjacent = √(169 − 144).
    - = 5.
    solution: Adjacent = 5, so cos A = 5/13.
    mistakes:
      13/12: c10m8_flip
      12/5: c10m8_soh
  - prompt: If tan A = 4/3, find cosec A as a fraction.
    answer: 5/4
    check: 5/4
    difficulty: 2
    hints:
    - Hypotenuse = 5.
    - cosec = hyp/opp.
    solution: 'Step 1: sides 4, 3, 5. Step 2: sin A = 4/5, so cosec A = 5/4.'
    mistakes:
      4/5: c10m8_flip
      5/3: c10m8_soh
  - prompt: Which ratio is adjacent/opposite?
    options:
    - cot A
    - tan A
    - sec A
    - sin A
    answer: cot A
    difficulty: 1
    hints:
    - tan is opposite/adjacent.
    - This is its reciprocal.
    solution: cot A = 1/tan A = adjacent/opposite.
    mistakes:
      tan A: c10m8_flip
  - prompt: In △PQR, right-angled at Q, PQ = 5 and QR = 12. Find tan R as a fraction.
    answer: 5/12
    check: 5/12
    difficulty: 2
    hints:
    - 'Look from R: opposite is PQ.'
    - Adjacent is QR.
    solution: tan R = PQ/QR = 5/12.
    mistakes:
      12/5: c10m8_soh
  - prompt: Can sin A be 4/3 for an acute angle A?
    options:
    - No, sin A is never more than 1
    - 'Yes'
    - Only if A = 90°
    - Only for large triangles
    answer: No, sin A is never more than 1
    difficulty: 2
    hints:
    - sin = opposite/hypotenuse.
    - Can the opposite be longer than the hypotenuse?
    solution: The hypotenuse is the longest side, so opp/hyp ≤ 1; 4/3 is impossible.
    mistakes:
      'Yes': c10m8_soh
  - prompt: If 3 cot A = 4, find (1 − tan²A)/(1 + tan²A) as a fraction.
    answer: 7/25
    check: 7/25
    difficulty: 3
    hints:
    - tan A = 3/4, tan²A = 9/16.
    - (7/16)/(25/16).
    solution: 'Step 1: tan²A = 9/16. Step 2: (1 − 9/16)/(1 + 9/16) = (7/16)/(25/16) = 7/25.'
    mistakes:
      1/7: c10m8_flip
      25/7: c10m8_flip
  - prompt: If ∠A and ∠B are acute and cos A = cos B, then…
    options:
    - ∠A = ∠B
    - ∠A > ∠B
    - ∠A + ∠B = 90°
    - Nothing can be said
    answer: ∠A = ∠B
    difficulty: 2
    hints:
    - Ratios depend only on the angle.
    - Same cos, same angle (acute).
    solution: For acute angles, equal cos values mean equal angles.
    mistakes:
      ∠A + ∠B = 90°: c10m8_same_ratio
  - prompt: Find sin A × cosec A for any acute A.
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - cosec A = 1/sin A.
    - A number times its reciprocal.
    solution: sin A × 1/sin A = 1.
    mistakes:
      '0': c10m8_flip
  - prompt: 'Assertion (A): For an acute angle A, sin A can never be greater than 1.

      Reason (R): In a right triangle, the hypotenuse is the longest side.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: sin A = opposite ÷ hypotenuse, and by R the opposite is shorter than the hypotenuse, so the fraction is less than 1. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case study: A wheelchair ramp rises 5 m along a slope 13 m long. What is the tan of the angle the ramp makes with the ground?'
    options:
    - 5/12
    - 5/13
    - 12/13
    answer: 5/12
    hints:
    - The slope is the hypotenuse. Find the ground length with Pythagoras.
    - Ground = √(13² − 5²).
    solution: Ground = √(169 − 25) = √144 = 12 m. tan = opposite/adjacent = 5/12.
    mistakes:
      5/13: pq10m8_sin_not_tan
      12/13: pq10m8_cos_not_tan
    exam: case
    difficulty: 2
- code: cbse10m.trig.values
  title: Ratios of special angles and identities
  after:
  - cbse10m.trig.ratios
  notes: |
    Values: sin 0° = 0, sin 30° = 1/2, sin 45° = 1/√2, sin 60° = √3/2, sin 90° = 1; cos is the reverse order
    (cos 0° = 1, cos 30° = √3/2, cos 45° = 1/√2, cos 60° = 1/2, cos 90° = 0); tan 0° = 0, tan 30° = 1/√3,
    tan 45° = 1, tan 60° = √3, tan 90° not defined. Identities for 0° ≤ A ≤ 90°: sin²A + cos²A = 1,
    1 + tan²A = sec²A (A < 90°), 1 + cot²A = cosec²A (A > 0°).
  explanations:
    text: 'A handful of angles come up again and again. For sin, take √0/2, √1/2, √2/2, √3/2, √4/2 for 0°, 30°, 45°, 60°, 90°: that gives 0, 1/2, 1/√2, √3/2, 1. cos is the same list backwards. And always sin²A + cos²A = 1, straight from Pythagoras.'
    visual: Draw a table with angles 0°, 30°, 45°, 60°, 90° across the top. In the sin row write √0/2, √1/2, √2/2, √3/2, √4/2 and simplify. Copy the row backwards for cos. Divide sin by cos for tan.
    step_by_step: 'Step 1: Write the values you need from the table. Step 2: Substitute them into the expression. Step 3: Simplify fractions and roots. Step 4: For an identity, start from the more complicated side and use sin²A + cos²A = 1.'
    real_world: 'Surveyors and architects use 30°, 45° and 60° all the time: a roof pitched at 45° rises as much as it runs across, because tan 45° = 1.'
  picture:
    kind: bars
    unit: sin of the angle (× 100)
    bars:
    - label: 0°
      value: 0
    - label: 30°
      value: 50
    - label: 45°
      value: 70.7
    - label: 60°
      value: 86.6
    - label: 90°
      value: 100
    caption: 'sin grows from 0 at 0° to 1 at 90°: 0, 1/2, 1/√2 ≈ 0.707, √3/2 ≈ 0.866, 1. cos goes the other way.'
    alt: Bars for sin 0°, 30°, 45°, 60° and 90°, rising from 0 to 0.5, 0.707, 0.866 and 1 (shown times 100).
  activity:
    type: angle
    prompt: Turn the arm to the angle A that makes each statement true (0° to 90°).
    goals:
    - prompt: tan A = √3
      degrees: 60
      mistakes:
      - when:
          degrees: 30
        say: tan 30° = 1/√3, the flip of √3. tan grows as the angle grows.
      - when:
          degrees: 90
        say: 'tan 90° isn''t defined: the opposite side would grow without end.'
    - prompt: sin A = 1/√2
      degrees: 45
      mistakes:
      - when:
          degrees: 30
        say: sin 30° = 1/2 = 0.5, less than 1/√2 ≈ 0.71. sin grows from 0 at 0° to 1 at 90°.
      - when:
          degrees: 90
        say: sin 90° = 1, the biggest sin can be. 1/√2 is less than that.
    - prompt: cos A = 0
      degrees: 90
      mistakes:
      - when:
          degrees:
          - 5
          - 30
        say: Near 0°, cos is close to 1, not 0. cos falls from 1 at 0° to 0 at 90°.
    - prompt: sin A = cos 20°
      degrees: 70
      mistakes:
      - when:
          degrees: 20
        say: sin 20° ≈ 0.34 but cos 20° ≈ 0.94. sin A = cos(90° − A).
      - when:
          degrees: 110
        say: 'Keep A between 0° and 90°: sin A = cos(90° − A).'
  lesson:
    - teach: 'Special angles: draw an equilateral triangle of side 2 and cut it in half to get 30° and 60° (sides 1, √3, 2); a right isosceles triangle with legs 1 gives 45° (hypotenuse √2).'
      picture:
        kind: compare
        columns:
        - title: sin
          points:
          - 0° → 0
          - 30° → 1/2
          - 45° → 1/√2
          - 60° → √3/2
          - 90° → 1
        - title: cos
          points:
          - 0° → 1
          - 30° → √3/2
          - 45° → 1/√2
          - 60° → 1/2
          - 90° → 0
        - title: tan
          points:
          - 0° → 0
          - 30° → 1/√3
          - 45° → 1
          - 60° → √3
          - 90° → not defined
        alt: Table of sin, cos and tan for 0, 30, 45, 60 and 90 degrees.
      check:
        prompt: cos 60° = ?
        options:
        - 1/2
        - √3/2
        - '1'
        answer: 1/2
        why: cos runs the sin values backwards.
      ways:
      - style: visual
        teach: 'The special-angle values in one table. Read sin down 30°, 45°, 60°: it goes 1/2, 1/√2, √3/2, and cos goes the other way.'
        picture:
          kind: compare
          columns:
          - title: 30°
            points:
            - sin = 1/2
            - cos = √3/2
            - tan = 1/√3
          - title: 45°
            points:
            - sin = 1/√2
            - cos = 1/√2
            - tan = 1
          - title: 60°
            points:
            - sin = √3/2
            - cos = 1/2
            - tan = √3
          alt: At 30 degrees sin is a half, cos root 3 over 2, tan 1 over root 3. At 45 degrees sin and cos are 1 over root 2 and tan is 1. At 60 degrees sin is root 3 over 2, cos a half, tan root 3.
      - style: step_by_step
        teach: 'Step 1: Draw an equilateral triangle with side 2; every angle is 60°. Step 2: Cut it down the middle: the base halves to 1 and the top angle halves to 30°. Step 3: The height is √(4 − 1) = √3. Step 4: Read off: sin 30° = 1/2, cos 30° = √3/2, sin 60° = √3/2, cos 60° = 1/2. Step 5: For 45°, legs 1 and 1 give hypotenuse √2, so sin 45° = cos 45° = 1/√2.'
    - teach: 'Three identities hold for every allowed angle: sin²A + cos²A = 1; 1 + tan²A = sec²A; 1 + cot²A = cosec²A. They come from Pythagoras: divide opp² + adj² = hyp² by hyp², adj² or opp².'
      check:
        prompt: sec²A − tan²A = ?
        options:
        - '1'
        - '0'
        - '2'
        answer: '1'
        why: 1 + tan²A = sec²A.
      ways:
      - style: visual
        teach: All three identities come from Pythagoras, divided by a different side each time.
        picture:
          kind: flow
          steps:
          - opp² + adj² = hyp²
          - '÷ hyp²: sin²A + cos²A = 1'
          - '÷ adj²: tan²A + 1 = sec²A'
          - '÷ opp²: cot²A + 1 = cosec²A'
          alt: Dividing opposite squared plus adjacent squared equals hypotenuse squared by each side squared gives the three identities.
      - style: step_by_step
        teach: 'Step 1: To simplify (1 − cos²A) × cosec²A, look for an identity. Step 2: From sin²A + cos²A = 1, 1 − cos²A = sin²A. Step 3: So the expression is sin²A × cosec²A. Step 4: cosec A = 1/sin A, so this is sin²A × 1/sin²A = 1.'
  items:
  - prompt: Find sin 30° + cos 60°.
    answer: '1'
    check: sin(pi/6) + cos(pi/3)
    difficulty: 1
    hints:
    - sin 30° = 1/2.
    - cos 60° = 1/2.
    solution: 1/2 + 1/2 = 1.
    mistakes: {"0.5": "t10_trig_table", "2": "c10_sin_cos_swap"}
  - prompt: Find tan 45°.
    answer: '1'
    check: tan(pi/4)
    difficulty: 1
    hints:
    - Opposite and adjacent are equal at 45°.
    - 1/1.
    solution: tan 45° = 1.
    mistakes: {"0": "t10_trig_table", "45": "t10_trig_table"}
  - prompt: Find 2 sin 30° × cos 0°.
    answer: '1'
    check: 2*sin(pi/6)*cos(0)
    difficulty: 1
    hints:
    - sin 30° = 1/2 and cos 0° = 1.
    - 2 × 1/2 × 1.
    solution: 2 × 1/2 × 1 = 1.
    mistakes: {"0": "t10_trig_table", "2": "t10_trig_table"}
  - prompt: 'Find sin²60° + cos²60°. '
    answer: '1'
    check: sin(pi/3)^2 + cos(pi/3)^2
    difficulty: 2
    hints:
    - Use the identity sin²A + cos²A = 1.
    - 'Or: 3/4 + 1/4.'
    solution: 'Step 1: (√3/2)² + (1/2)² = 3/4 + 1/4 = 1. This is the identity sin²A + cos²A = 1.'
    mistakes: {"0.5": "t10_identity_one", "2": "t10_identity_one"}
  - prompt: Find 2 tan²45° + cos²30° − sin²60°.
    answer: '2'
    check: 2*tan(pi/4)^2 + cos(pi/6)^2 - sin(pi/3)^2
    difficulty: 2
    hints:
    - tan 45° = 1.
    - cos²30° = sin²60° = 3/4.
    solution: 'Step 1: 2 × 1 + 3/4 − 3/4 = 2.'
    mistakes: {"1": "t10_trig_table", "3.5": "t10_trig_table"}
  - prompt: If sin A = 1/2 and A is acute, find A in degrees.
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - Which angle has sin = 1/2?
    - Look at the table.
    solution: sin 30° = 1/2, so A = 30°.
    mistakes:
      '60': c10_sin_cos_swap
  - prompt: If sec A = 13/12, find 1 + tan²A as a fraction.
    answer: 169/144
    check: (13/12)^2
    difficulty: 3
    hints:
    - 1 + tan²A = sec²A.
    - (13/12)².
    solution: 'Step 1: 1 + tan²A = sec²A. Step 2: (13/12)² = 169/144.'
    mistakes: {"13/12": "t10_sec_identity", "25/144": "t10_sec_identity"}
  - prompt: Find sin 60° cos 30° + sin 30° cos 60°.
    answer: '1'
    check: 3/4 + 1/4
    difficulty: 2
    hints:
    - √3/2 × √3/2 = 3/4.
    - 1/2 × 1/2 = 1/4.
    solution: 3/4 + 1/4 = 1.
    mistakes:
      1/2: c10m8_table
      3/4: c10m8_table
  - prompt: Find 4 sin 30° × cos 60°.
    answer: '1'
    check: 4 * 0.5 * 0.5
    difficulty: 1
    hints:
    - sin 30° = 1/2.
    - cos 60° = 1/2.
    solution: 4 × 1/2 × 1/2 = 1.
    mistakes:
      '2': c10m8_table
      '4': c10m8_table
  - prompt: If tan(A + B) = √3 and A + B is acute, find A + B in degrees.
    answer: '60'
    check: '60'
    difficulty: 1
    hints:
    - Which angle has tan = √3?
    - Look at the tan row.
    solution: tan 60° = √3, so A + B = 60°.
    mistakes:
      '30': c10m8_tan_row
      '45': c10m8_tan_row
  - prompt: Simplify (1 + tan²A)cos²A.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - 1 + tan²A = sec²A.
    - sec²A × cos²A.
    solution: sec²A × cos²A = 1.
    mistakes:
      '0': c10m8_identity
      '2': c10m8_identity
  - prompt: If sin A = 3/5, find sin²A + cos²A.
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - It is an identity.
    - True for any A.
    solution: sin²A + cos²A = 1 always.
    mistakes:
      6/5: c10m8_identity
      9/25: c10m8_identity
  - prompt: Which is undefined?
    options:
    - tan 90°
    - sin 90°
    - cos 90°
    - tan 0°
    answer: tan 90°
    difficulty: 1
    hints:
    - tan = sin/cos.
    - cos 90° = 0.
    solution: tan 90° = 1/0, which is not defined.
    mistakes:
      cos 90°: c10m8_table
  - prompt: Find sin 30° + tan 45° − cosec 60°, taking √3 ≈ 1.732. Give 2 decimal places.
    answer: '0.35'
    check: round(0.5 + 1 - 2/1.732, 2)
    difficulty: 3
    hints:
    - cosec 60° = 2/√3 ≈ 1.155.
    - 0.5 + 1 − 1.155.
    solution: 1/2 + 1 − 2/√3 ≈ 1.5 − 1.155 = 0.35.
    mistakes:
      '1.5': c10m8_dont_forget
  - prompt: If sec A = 5/4, find tan A as a fraction (A acute).
    answer: 3/4
    check: 3/4
    difficulty: 2
    hints:
    - tan²A = sec²A − 1.
    - 25/16 − 1 = 9/16.
    solution: tan²A = 9/16, so tan A = 3/4.
    mistakes:
      4/3: c10m8_tan_order
      9/16: c10m8_identity
  - prompt: Find cos 45°/(sec 30° + cosec 30°) when written as 3√2 − √6 over k. Find k.
    answer: '8'
    check: '8'
    difficulty: 3
    hints:
    - sec 30° = 2/√3, cosec 30° = 2.
    - (1/√2) ÷ ((2 + 2√3)/√3).
    solution: 'Step 1: = √3/(√2(2 + 2√3)) = √3/(2√2(1 + √3)). Step 2: Multiply by (√3 − 1)/(√3 − 1): √3(√3 − 1)/(2√2 × 2) = (3 − √3)/(4√2) = (3√2 − √6)/8, so k = 8.'
    mistakes:
      '4': c10m8_table
  - prompt: 'Assertion (A): sec²θ − tan²θ = 1 for every angle θ where both are defined.

      Reason (R): 1 + tan²θ = sec²θ.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Subtract tan²θ from both sides of R to get A. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: The value of sin²30° + cos²30° + tan 45° is
    options:
    - '2'
    - '1'
    - 3/2
    answer: '2'
    hints:
    - 'Group the first two terms: what identity do they make?'
    - tan 45° = 1.
    solution: sin²30° + cos²30° = 1 and tan 45° = 1, so the total is 2.
    mistakes:
      '1': pq10m8_forgot_tan
    exam: one_mark
    difficulty: 1
  - prompt: A student writes sin(30° + 60°) = sin 30° + sin 60°. Which check shows this is wrong?
    options:
    - sin 90° = 1, but 1/2 + √3/2 is more than 1
    - sin 30° is not defined
    - sin 60° is greater than 1
    answer: sin 90° = 1, but 1/2 + √3/2 is more than 1
    hints:
    - Work out both sides with the special values.
    - The left side is sin 90°.
    solution: 'Left: sin 90° = 1. Right: 1/2 + √3/2 ≈ 0.5 + 0.87 = 1.37. They differ, so sin(A + B) is not sin A + sin B.'
    mistakes:
      sin 30° is not defined: pq10m8_check_values
      sin 60° is greater than 1: pq10m8_check_values
    exam: competency
    difficulty: 2
