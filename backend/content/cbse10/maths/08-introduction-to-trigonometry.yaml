# CBSE Class 10 Mathematics (NCERT), chapter 8. Format: content/README.md.
subject: cbse10-math
chapter: 8
title: Introduction to Trigonometry
tips:
  c10_trig_upside: 'Check which side goes on top: sin and cos have the hypotenuse on the bottom; tan is opposite over adjacent.'
  c10_trig_which: That's tan, not sin. sin uses the hypotenuse, so find it with Pythagoras first.
  c10_sin_cos_swap: "The sin row and cos row run in opposite directions: the angle whose sine is ½ is the angle whose cosine is √3/2. Read the right row."
  t10_identity_one: "There is an identity: sin²A + cos²A is the same number for every angle. Square each value, then add, and see."
  t10_pythag_trig: "sin A = 3/5 means opposite 3, hypotenuse 5. Find the adjacent side, then cos = adjacent/hypotenuse."
  t10_sec_identity: "1 + tan²A = sec²A. Square the secant."
  t10_tan_def: "tan = opposite/adjacent. Write sin and cos as sides over the hypotenuse and see which division gives that."
  t10_trig_table: "Use the pattern: sin at 0°, 30°, 45°, 60°, 90° is √0/2, √1/2, √2/2, √3/2, √4/2, and cos runs the other way. tan = sin ÷ cos. Put each value in, then work out."
concepts:
- code: cbse10m.trig.ratios
  title: Trigonometric ratios
  notes: |
    In a right triangle ABC with the right angle at B, for the acute angle A: sin A = opposite/hypotenuse =
    BC/AC, cos A = adjacent/hypotenuse = AB/AC, tan A = opposite/adjacent = BC/AB; cosec A = 1/sin A,
    sec A = 1/cos A, cot A = 1/tan A; tan A = sin A/cos A. The ratios depend only on the angle, not on the
    size of the triangle. Given one ratio, draw a triangle with those sides and find the others by Pythagoras.
  explanations:
    text: 'In a right-angled triangle, pick an acute angle. The side across from it is the opposite, the side next to it (not the longest) is the adjacent, and the longest side is the hypotenuse. sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent. A memory aid: SOH CAH TOA.'
    visual: 'Draw a right triangle with the right angle at B. Stand at corner A and look across: the side you face, BC, is opposite. The side you stand on, AB, is adjacent. The slanted side AC is the hypotenuse.'
    step_by_step: 'Step 1: Mark the angle you''re working with. Step 2: Label opposite, adjacent and hypotenuse from that angle. Step 3: Pick the ratio that uses the sides you know. Step 4: If a side is missing, find it with Pythagoras first.'
    real_world: A wheelchair ramp must not be too steep. If it rises 1 m over a slope of 12 m, then sin of its angle is 1/12, which builders check against safety rules.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 1
      B:
      - 9
      - 1
      C:
      - 9
      - 7
    segments:
    - - A
      - B
      - adjacent 4
    - - B
      - C
      - opposite 3
    - - A
      - C
      - hypotenuse 5
    angles:
    - at: B
      from: C
      to: A
      label: 90°
    - at: A
      from: B
      to: C
      label: A
    caption: 'From angle A: sin A = 3/5, cos A = 4/5, tan A = 3/4.'
    alt: A right triangle with the right angle at B. From angle A, the opposite side is 3, the adjacent side 4 and the hypotenuse 5.
  activity:
    type: formula
    prompt: Right triangle ABC with the right angle at B. Change the side opposite A and the side next to A.
    inputs:
    - name: o
      label: Opposite A (BC)
      min: 1
      max: 12
      step: 1
      start: 1
    - name: a
      label: Adjacent to A (AB)
      min: 1
      max: 12
      step: 1
      start: 1
    outputs:
    - name: h
      label: Hypotenuse AC
      expr: sqrt(o^2+a^2)
      places: 2
    - name: sin
      label: sin A = opp ÷ hyp
      expr: o/sqrt(o^2+a^2)
      places: 3
    - name: cos
      label: cos A = adj ÷ hyp
      expr: a/sqrt(o^2+a^2)
      places: 3
    - name: tan
      label: tan A = opp ÷ adj
      expr: o/a
      places: 3
    goals:
    - prompt: Make sin A = 0.6 with a hypotenuse of 10.
      want:
        sin: 0.6
        h: 10
      hint: sin A = opposite ÷ hypotenuse. 0.6 of 10 is?
      mistakes:
      - when:
          o: 8
          a: 6
        say: 'That makes sin A = 0.8 and cos A = 0.6: opposite and adjacent swapped. Opposite is the side facing A.'
      - when:
          o: 6
          a: 10
        say: The 10 went on the adjacent side, but 10 must be the hypotenuse, the longest side, facing the right angle.
    - prompt: Make tan A = 4/3 with a hypotenuse of 5.
      want:
        tan:
        - 1.333
        - 1.334
        h: 5
      mistakes:
      - when:
          o: 3
          a: 4
        say: 'tan A = 3/4 = 0.75: flipped. tan is opposite over adjacent.'
    - prompt: Make sin A = 0.6 again, with a hypotenuse of 15.
      want:
        sin: 0.6
        h: 15
      mistakes:
      - when:
          o: 6
          a: 8
        say: 'That''s the triangle with hypotenuse 10. Scale every side by the same amount: the ratio stays 0.6.'
  items:
  - prompt: In a right triangle the side opposite angle A is 3 and the hypotenuse is 5. Find sin A. Type a fraction.
    answer: 3/5
    check: 3/5
    difficulty: 1
    hints:
    - sin = opposite/hypotenuse.
    - 3/5.
    solution: sin A = opposite/hypotenuse = 3/5.
    mistakes:
      5/3: c10_trig_upside
  - prompt: With opposite 3, adjacent 4 and hypotenuse 5, find tan A. Type a fraction.
    answer: 3/4
    check: 3/4
    difficulty: 1
    hints:
    - tan = opposite/adjacent.
    - 3/4.
    solution: tan A = 3/4.
    mistakes:
      4/3: c10_trig_upside
  - prompt: If sin A = 3/5, find cos A. Type a fraction.
    answer: 4/5
    check: sqrt(25 - 9)/5
    difficulty: 2
    hints:
    - Draw a triangle with opposite 3, hypotenuse 5.
    - Adjacent = √(25 − 9) = 4.
    solution: 'Step 1: Adjacent = √(5² − 3²) = 4. Step 2: cos A = 4/5.'
    mistakes: {"3/4": "c10_trig_upside", "2/5": "t10_pythag_trig"}
  - prompt: If tan A = 5/12, find sin A. Type a fraction.
    answer: 5/13
    check: 5/sqrt(5^2 + 12^2)
    difficulty: 2
    hints:
    - Opposite 5, adjacent 12.
    - Hypotenuse = √(25 + 144) = 13.
    solution: 'Step 1: Hypotenuse = √(144 + 25) = 13. Step 2: sin A = 5/13.'
    mistakes:
      5/12: c10_trig_which
  - prompt: Which equals tan A?
    options:
    - sin A / cos A
    - cos A / sin A
    - sin A × cos A
    - 1 / sin A
    answer: sin A / cos A
    difficulty: 1
    hints:
    - (opp/hyp) ÷ (adj/hyp).
    - The hypotenuses cancel.
    solution: sin A / cos A = (opp/hyp)/(adj/hyp) = opp/adj = tan A.
    mistakes: {"cos A / sin A": "t10_tan_def", "sin A × cos A": "t10_tan_def"}
  - prompt: If cos A = 7/25, find tan A. Type a fraction.
    answer: 24/7
    check: sqrt(625 - 49)/7
    difficulty: 3
    hints:
    - Adjacent 7, hypotenuse 25.
    - Opposite = √(625 − 49) = 24.
    solution: 'Step 1: Opposite = √(25² − 7²) = √576 = 24. Step 2: tan A = 24/7.'
    mistakes:
      7/24: c10_trig_upside
- code: cbse10m.trig.values
  title: Ratios of special angles and identities
  after:
  - cbse10m.trig.ratios
  notes: |
    Values: sin 0° = 0, sin 30° = 1/2, sin 45° = 1/√2, sin 60° = √3/2, sin 90° = 1; cos is the reverse order
    (cos 0° = 1, cos 30° = √3/2, cos 45° = 1/√2, cos 60° = 1/2, cos 90° = 0); tan 0° = 0, tan 30° = 1/√3,
    tan 45° = 1, tan 60° = √3, tan 90° not defined. Identities for 0° ≤ A ≤ 90°: sin²A + cos²A = 1,
    1 + tan²A = sec²A (A < 90°), 1 + cot²A = cosec²A (A > 0°).
  explanations:
    text: 'A handful of angles come up again and again. For sin, take √0/2, √1/2, √2/2, √3/2, √4/2 for 0°, 30°, 45°, 60°, 90°: that gives 0, 1/2, 1/√2, √3/2, 1. cos is the same list backwards. And always sin²A + cos²A = 1, straight from Pythagoras.'
    visual: Draw a table with angles 0°, 30°, 45°, 60°, 90° across the top. In the sin row write √0/2, √1/2, √2/2, √3/2, √4/2 and simplify. Copy the row backwards for cos. Divide sin by cos for tan.
    step_by_step: 'Step 1: Write the values you need from the table. Step 2: Substitute them into the expression. Step 3: Simplify fractions and roots. Step 4: For an identity, start from the more complicated side and use sin²A + cos²A = 1.'
    real_world: 'Surveyors and architects use 30°, 45° and 60° all the time: a roof pitched at 45° rises as much as it runs across, because tan 45° = 1.'
  picture:
    kind: bars
    unit: sin of the angle (× 100)
    bars:
    - label: 0°
      value: 0
    - label: 30°
      value: 50
    - label: 45°
      value: 70.7
    - label: 60°
      value: 86.6
    - label: 90°
      value: 100
    caption: 'sin grows from 0 at 0° to 1 at 90°: 0, 1/2, 1/√2 ≈ 0.707, √3/2 ≈ 0.866, 1. cos goes the other way.'
    alt: Bars for sin 0°, 30°, 45°, 60° and 90°, rising from 0 to 0.5, 0.707, 0.866 and 1 (shown times 100).
  activity:
    type: angle
    prompt: Turn the arm to the angle A that makes each statement true (0° to 90°).
    goals:
    - prompt: tan A = √3
      degrees: 60
      mistakes:
      - when:
          degrees: 30
        say: tan 30° = 1/√3, the flip of √3. tan grows as the angle grows.
      - when:
          degrees: 90
        say: 'tan 90° isn''t defined: the opposite side would grow without end.'
    - prompt: sin A = 1/√2
      degrees: 45
      mistakes:
      - when:
          degrees: 30
        say: sin 30° = 1/2 = 0.5, less than 1/√2 ≈ 0.71. sin grows from 0 at 0° to 1 at 90°.
      - when:
          degrees: 90
        say: sin 90° = 1, the biggest sin can be. 1/√2 is less than that.
    - prompt: cos A = 0
      degrees: 90
      mistakes:
      - when:
          degrees:
          - 5
          - 30
        say: Near 0°, cos is close to 1, not 0. cos falls from 1 at 0° to 0 at 90°.
    - prompt: sin A = cos 20°
      degrees: 70
      mistakes:
      - when:
          degrees: 20
        say: sin 20° ≈ 0.34 but cos 20° ≈ 0.94. sin A = cos(90° − A).
      - when:
          degrees: 110
        say: 'Keep A between 0° and 90°: sin A = cos(90° − A).'
  items:
  - prompt: Find sin 30° + cos 60°.
    answer: '1'
    check: sin(pi/6) + cos(pi/3)
    difficulty: 1
    hints:
    - sin 30° = 1/2.
    - cos 60° = 1/2.
    solution: 1/2 + 1/2 = 1.
    mistakes: {"0.5": "t10_trig_table", "2": "c10_sin_cos_swap"}
  - prompt: Find tan 45°.
    answer: '1'
    check: tan(pi/4)
    difficulty: 1
    hints:
    - Opposite and adjacent are equal at 45°.
    - 1/1.
    solution: tan 45° = 1.
    mistakes: {"0": "t10_trig_table", "45": "t10_trig_table"}
  - prompt: Find 2 sin 30° × cos 0°.
    answer: '1'
    check: 2*sin(pi/6)*cos(0)
    difficulty: 1
    hints:
    - sin 30° = 1/2 and cos 0° = 1.
    - 2 × 1/2 × 1.
    solution: 2 × 1/2 × 1 = 1.
    mistakes: {"0": "t10_trig_table", "2": "t10_trig_table"}
  - prompt: 'Find sin²60° + cos²60°. '
    answer: '1'
    check: sin(pi/3)^2 + cos(pi/3)^2
    difficulty: 2
    hints:
    - Use the identity sin²A + cos²A = 1.
    - 'Or: 3/4 + 1/4.'
    solution: 'Step 1: (√3/2)² + (1/2)² = 3/4 + 1/4 = 1. This is the identity sin²A + cos²A = 1.'
    mistakes: {"0.5": "t10_identity_one", "2": "t10_identity_one"}
  - prompt: Find 2 tan²45° + cos²30° − sin²60°.
    answer: '2'
    check: 2*tan(pi/4)^2 + cos(pi/6)^2 - sin(pi/3)^2
    difficulty: 2
    hints:
    - tan 45° = 1.
    - cos²30° = sin²60° = 3/4.
    solution: 'Step 1: 2 × 1 + 3/4 − 3/4 = 2.'
    mistakes: {"1": "t10_trig_table", "3.5": "t10_trig_table"}
  - prompt: If sin A = 1/2 and A is acute, find A in degrees.
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - Which angle has sin = 1/2?
    - Look at the table.
    solution: sin 30° = 1/2, so A = 30°.
    mistakes:
      '60': c10_sin_cos_swap
  - prompt: If sec A = 13/12, find 1 + tan²A as a fraction.
    answer: 169/144
    check: (13/12)^2
    difficulty: 3
    hints:
    - 1 + tan²A = sec²A.
    - (13/12)².
    solution: 'Step 1: 1 + tan²A = sec²A. Step 2: (13/12)² = 169/144.'
    mistakes: {"13/12": "t10_sec_identity", "25/144": "t10_sec_identity"}
