# CBSE Class 10 Mathematics (NCERT), chapter 2. Format: content/README.md.
subject: cbse10-math
chapter: 2
title: Polynomials
tips:
  c10_zero_sign: "Set the polynomial equal to zero and solve: moving a number across the = changes its sign. Check by putting your answer back in."
  c10_sum_sign: "For ax² + bx + c, the sum of zeroes is −b/a and the product is c/a. Watch the sign of b: it flips. For a cubic, use the x² coefficient the same way."
  t10_above_axis: "If the lowest point of an upward curve is above the x-axis, can the curve ever touch the axis?"
  t10_degree_max_zeroes: "A polynomial of degree n has at most n zeroes. What is the degree of a cubic?"
  t10_perfect_square_touch: "x² − 6x + 9 is a perfect square, (x − a)². Find a: the graph touches the x-axis there, on the axis so y = 0."
  t10_product_c_over_a: "Product of zeroes = c/a; sum of zeroes = −b/a. Check which one is asked."
  t10_put_zero_in: "If 3 is a zero, then putting x = 3 makes the polynomial 0. Substitute and solve for k."
  t10_zero_crossings: "Each place the graph meets the x-axis is one zero. Count the meeting points."
  c10m2_count_meets: Count only the points where the curve meets the x-axis. Points where it meets the y-axis are not zeroes.
  c10m2_x_not_y: A zero is an x-value. Read the x-coordinate of the meeting point, not the y-coordinate.
  c10m2_signs: For ax² + bx + c, the sum of zeroes is −b/a (note the minus) and the product is c/a. Check which one the question wants and keep the signs.
  c10m2_build: A quadratic with zeroes summing to S and multiplying to P is x² − Sx + P. Watch the minus in front of S.
concepts:
- code: cbse10m.poly.zeroes_graph
  title: Zeroes of a polynomial on a graph
  notes: |
    The zeroes of p(x) are the x-coordinates of the points where the graph of y = p(x) meets the x-axis.
    A linear polynomial ax + b (a ≠ 0) has exactly one zero, −b/a. The graph of a quadratic is a parabola
    (opening up if a > 0, down if a < 0) and can meet the x-axis at two points, one point or none, so a
    quadratic has at most 2 zeroes; a cubic has at most 3.
  explanations:
    text: 'A zero of a polynomial is an x that makes it 0. On the graph of y = p(x), those are exactly the places where the curve touches or crosses the x-axis, because there y = 0. Count the crossings to count the zeroes: a straight line crosses once, a parabola at most twice, a cubic at most three times.'
    visual: 'Sketch y = x² − 4: a U-shape with its lowest point at (0, −4). It crosses the x-axis at x = −2 and x = 2. Those two crossing points are the two zeroes.'
    step_by_step: 'Step 1: Draw or imagine the graph of y = p(x). Step 2: Find where it meets the x-axis. Step 3: Read off the x-coordinates: those are the zeroes. Step 4: The number of meeting points is the number of zeroes.'
    real_world: 'If a ball''s height is h(t) = 20t − 5t², the zeroes t = 0 and t = 4 are when it is on the ground: when it is thrown and when it lands.'
  picture:
    kind: geometry
    axes: true
    range:
    - -4
    - 4
    points:
      (−2, 0):
      - -2
      - 0
      (2, 0):
      - 2
      - 0
      _a:
      - -2.65
      - 3
      _b:
      - -1
      - -3
      _c:
      - 0
      - -4
      _d:
      - 1
      - -3
      _e:
      - 2.65
      - 3
    segments:
    - - _a
      - (−2, 0)
    - - (−2, 0)
      - _b
    - - _b
      - _c
    - - _c
      - _d
    - - _d
      - (2, 0)
    - - (2, 0)
      - _e
    caption: y = x² − 4 meets the x-axis at x = −2 and x = 2, so those are its zeroes.
    alt: A U-shaped graph of y = x² − 4 with its lowest point at (0, −4), crossing the x-axis at −2 and 2.
  activity:
    type: formula
    prompt: The graph of y = x² + bx + c is a parabola. Its zeroes are where it meets the x-axis.
    inputs:
    - name: b
      label: b
      min: -6
      max: 6
      step: 1
      start: 0
    - name: c
      label: c
      min: -9
      max: 9
      step: 1
      start: 4
    outputs:
    - name: p2
      label: Value at x = 2
      expr: 4+2*b+c
    - name: p3
      label: Value at x = 3
      expr: 9+3*b+c
    - name: low
      label: Height of the lowest point
      expr: c-b^2/4
      places: 2
    - name: n
      label: Times it meets the x-axis
      expr: 1+(b^2-4*c)/max(abs(b^2-4*c),0.000001)
    goals:
    - prompt: Make the zeroes 2 and 3.
      want:
        p2: 0
        p3: 0
      hint: If 2 and 3 are zeroes, x² + bx + c = (x − 2)(x − 3). Multiply it out.
      mistakes:
      - when:
          b: 5
          c: 6
        say: 'x² + 5x + 6 = (x + 2)(x + 3): its zeroes are −2 and −3. A zero of 2 comes from the bracket (x − 2).'
      - when:
          b: -5
          c: -6
        say: 'x² − 5x − 6 = (x − 6)(x + 1): zeroes 6 and −1. The constant is the product of the zeroes: 2 × 3 = +6.'
      - when:
          p2: 0
        say: 'x = 2 is a zero now. Check x = 3 as well: both values must be 0.'
    - prompt: Make the parabola touch the x-axis at just one point.
      want:
        n: 1
      mistakes:
      - when:
          low:
          - 0.25
          - 30
        say: 'The lowest point is above the axis, so the curve never reaches it: no zeroes.'
      - when:
          low:
          - -30
          - -0.25
        say: 'The lowest point is below the axis, so the curve dips through it twice. It must just touch: lowest point at height 0.'
    - prompt: Make a parabola that never meets the x-axis, with its lowest point 1 above it.
      want:
        n: 0
        low: 1
      mistakes:
      - when:
          low:
          - -30
          - -0.25
        say: 'Below the axis: the curve crosses it twice. Lift the lowest point up to 1.'
      - when:
          low: 0
        say: It touches the axis at one point. Lift it a little more.
  lesson:
    - teach: A zero of a polynomial p(x) is a value of x that makes p(x) = 0. On the graph of y = p(x), a zero is where the curve meets the x-axis, because there y = 0. So the zeroes are the x-coordinates of those meeting points.
      check:
        prompt: The graph of y = p(x) meets the x-axis at (−1, 0) and (4, 0). What are the zeroes?
        options:
        - −1 and 4
        - 0 and 0
        - −1 only
        answer: −1 and 4
        why: Zeroes are the x-coordinates where y = 0.
    - teach: 'A linear polynomial ax + b has exactly one zero, −b/a: its graph is a straight line crossing the x-axis once. A quadratic''s graph is a parabola: opening up if a > 0, down if a < 0. It can cross the x-axis twice, touch it once, or miss it. So a quadratic has at most 2 zeroes, and a cubic at most 3.'
      picture:
        kind: compare
        columns:
        - title: Parabola
          points:
          - 'Crosses twice: 2 zeroes'
          - 'Touches once: 1 zero'
          - 'Misses: no zeroes'
        - title: Degree
          points:
          - 'Linear: exactly 1'
          - 'Quadratic: at most 2'
          - 'Cubic: at most 3'
        alt: How many zeroes a parabola can have, and the most zeroes for each degree.
      check:
        prompt: A parabola opening downwards has its highest point at (2, −3). How many zeroes?
        options:
        - '0'
        - '1'
        - '2'
        answer: '0'
        why: Its highest point is below the x-axis, so it never reaches it.
  items:
  - prompt: The graph of y = p(x) meets the x-axis at exactly 3 points. How many zeroes does p(x) have?
    options:
    - '3'
    - '2'
    - '1'
    - '0'
    answer: '3'
    difficulty: 1
    hints:
    - Each meeting point gives one zero.
    - Count the points.
    solution: 'Step 1: Each point where the graph meets the x-axis gives a zero. Step 2: 3 points, so 3 zeroes.'
    mistakes: {"2": "t10_zero_crossings", "1": "t10_zero_crossings"}
  - prompt: A parabola opening upwards has its lowest point at (0, 2). How many zeroes does its polynomial have?
    options:
    - '0'
    - '1'
    - '2'
    - '3'
    answer: '0'
    difficulty: 2
    hints:
    - Is the lowest point above or below the x-axis?
    - The curve never comes down to y = 0.
    solution: 'Step 1: The lowest point is at y = 2, above the x-axis. Step 2: The curve never meets the x-axis, so there are no zeroes.'
    mistakes: {"1": "t10_above_axis", "2": "t10_above_axis"}
  - prompt: Find the zero of p(x) = 3x − 12.
    answer: '4'
    check: 12/3
    difficulty: 1
    hints:
    - Set 3x − 12 = 0.
    - 3x = 12.
    solution: 'Step 1: 3x − 12 = 0. Step 2: x = 4.'
    mistakes:
      '-4': c10_zero_sign
  - prompt: At most how many zeroes can a cubic polynomial have?
    options:
    - '3'
    - '2'
    - '4'
    - Infinitely many
    answer: '3'
    difficulty: 1
    hints:
    - The degree tells you the most zeroes.
    - Cubic means degree 3.
    solution: A polynomial of degree n has at most n zeroes; a cubic has at most 3.
    mistakes: {"4": "t10_degree_max_zeroes", "Infinitely many": "t10_degree_max_zeroes"}
  - prompt: The graph of y = x² − 6x + 9 touches the x-axis at one point. Which point?
    options:
    - (3, 0)
    - (−3, 0)
    - (9, 0)
    - (0, 9)
    answer: (3, 0)
    difficulty: 2
    hints:
    - x² − 6x + 9 = (x − 3)².
    - When is (x − 3)² = 0?
    solution: 'Step 1: x² − 6x + 9 = (x − 3)². Step 2: It is 0 only at x = 3. Step 3: So the graph touches the x-axis at (3, 0).'
    mistakes: {"(−3, 0)": "c10_root_sign", "(0, 9)": "t10_perfect_square_touch"}
  - prompt: y = x² − 5x + 6 crosses the x-axis at x = 2 and at one other point. What is the other x?
    answer: '3'
    check: 6/2
    difficulty: 3
    hints:
    - Factorise x² − 5x + 6.
    - (x − 2)(x − 3).
    solution: 'Step 1: x² − 5x + 6 = (x − 2)(x − 3). Step 2: The zeroes are 2 and 3, so the other crossing is at x = 3.'
    mistakes:
      '-3': c10_zero_sign
  - prompt: Find the zero of p(x) = 2x + 9. Type a fraction like −9/2.
    answer: -9/2
    check: -9/2
    difficulty: 1
    hints:
    - Set 2x + 9 = 0.
    - Solve for x.
    solution: 'Step 1: 2x + 9 = 0. Step 2: x = −9/2.'
    mistakes:
      9/2: c10m2_signs
      '-9': c10m2_x_not_y
  - prompt: The graph of y = p(x) cuts the x-axis at x = −2, 0 and 5. How many zeroes does p(x) have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count the meeting points.
    - x = 0 counts too.
    solution: Three meeting points with the x-axis mean three zeroes.
    mistakes:
      '2': c10m2_count_meets
  - prompt: The graph of a polynomial meets the y-axis at (0, 6) and the x-axis at (2, 0) and (3, 0). Which are its zeroes?
    options:
    - 2 and 3
    - 6, 2 and 3
    - 0 and 6
    - 6 only
    answer: 2 and 3
    difficulty: 2
    hints:
    - Only x-axis meetings count.
    - The y-axis point is not a zero.
    solution: 'The zeroes are the x-values where the curve meets the x-axis: 2 and 3.'
    mistakes:
      6, 2 and 3: c10m2_count_meets
      0 and 6: c10m2_x_not_y
  - prompt: Is x = 2 a zero of p(x) = x² − 3x + 2?
    options:
    - 'Yes'
    - 'No'
    - Only if x is negative
    - It cannot be checked
    answer: 'Yes'
    difficulty: 1
    hints:
    - Put x = 2 into p(x).
    - Is the result 0?
    solution: p(2) = 4 − 6 + 2 = 0, so 2 is a zero.
    mistakes:
      'No': c10m2_x_not_y
  - prompt: Which polynomial's graph is a parabola opening downwards?
    options:
    - −x² + 4
    - x² − 4
    - 2x + 1
    - x³
    answer: −x² + 4
    difficulty: 2
    hints:
    - It must be quadratic.
    - Look at the sign of x².
    solution: A quadratic with a negative x² coefficient opens downwards.
    mistakes:
      x² − 4: c10m2_signs
  - prompt: A polynomial of degree 4 can have at most how many zeroes?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - 'Degree 2: at most 2.'
    - Same pattern.
    solution: A polynomial of degree n has at most n zeroes, so at most 4.
    mistakes:
      '2': c10m2_count_meets
  - prompt: How many zeroes does x² + 4 have?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - x² is never negative.
    - Can x² + 4 ever be 0?
    solution: 'x² + 4 ≥ 4 for every x, so its parabola stays above the x-axis: no zeroes.'
    mistakes:
      '2': c10m2_count_meets
      '-4': c10m2_x_not_y
  - prompt: y = x² − 9 meets the x-axis at x = 3 and one other point. What is the other x?
    answer: '-3'
    check: '-3'
    difficulty: 2
    hints:
    - x² − 9 = (x − 3)(x + 3).
    - Set the other bracket to 0.
    solution: 'Step 1: x² − 9 = (x − 3)(x + 3). Step 2: x + 3 = 0 gives x = −3.'
    mistakes:
      '9': c10m2_x_not_y
      '3': c10m2_signs
  - prompt: The line y = 4x − 8 crosses the x-axis at which point?
    options:
    - (2, 0)
    - (0, −8)
    - (−2, 0)
    - (8, 0)
    answer: (2, 0)
    difficulty: 2
    hints:
    - On the x-axis, y = 0.
    - Solve 4x − 8 = 0.
    solution: 4x − 8 = 0 gives x = 2, so the point is (2, 0).
    mistakes:
      (0, −8): c10m2_x_not_y
      (−2, 0): c10m2_signs
- code: cbse10m.poly.relations
  title: Zeroes and coefficients
  after:
  - cbse10m.poly.zeroes_graph
  notes: |
    For a quadratic ax² + bx + c with zeroes α and β: α + β = −b/a and αβ = c/a. A quadratic with zeroes
    whose sum is S and product is P is k(x² − Sx + P). For a cubic ax³ + bx² + cx + d with zeroes α, β, γ:
    α + β + γ = −b/a, αβ + βγ + γα = c/a, αβγ = −d/a.
  explanations:
    text: You can find the sum and product of a quadratic's zeroes without solving it. For ax² + bx + c, the zeroes add to −b/a and multiply to c/a. Going backwards, if you know the sum and product, the quadratic is x² − (sum)x + (product).
    visual: 'Write the quadratic as a row of three boxes: [a] x² + [b] x + [c]. Draw an arrow from b to a labelled ''sum = −b/a'' and an arrow from c to a labelled ''product = c/a''.'
    step_by_step: 'Step 1: Read off a, b and c (with their signs). Step 2: Sum of zeroes = −b/a. Step 3: Product of zeroes = c/a. Step 4: To build a quadratic from sum S and product P, write x² − Sx + P.'
    real_world: 'Two numbers have a sum of 10 and a product of 21. Instead of guessing, write x² − 10x + 21 = (x − 3)(x − 7): the numbers are 3 and 7.'
  picture:
    kind: flow
    steps:
    - 'x² − 5x + 6: a = 1, b = −5, c = 6'
    - Sum of zeroes = −b/a = 5
    - Product of zeroes = c/a = 6
    - 'Zeroes 2 and 3: 2 + 3 = 5 and 2 × 3 = 6 ✓'
    alt: 'Checking the rules on x² − 5x + 6: the sum of the zeroes is −b/a = 5 and the product is c/a = 6, which matches the zeroes 2 and 3.'
  activity:
    type: formula
    prompt: Choose two zeroes p and q. The quadratic with these zeroes is x² − (p + q)x + pq.
    inputs:
    - name: p
      label: Zero p
      min: -6
      max: 6
      step: 1
      start: 0
    - name: q
      label: Zero q
      min: -6
      max: 6
      step: 1
      start: 0
    outputs:
    - name: s
      label: Sum of zeroes
      expr: p+q
    - name: pr
      label: Product of zeroes
      expr: p*q
    - name: bb
      label: b in x² + bx + c
      expr: -(p+q)
    - name: cc
      label: c in x² + bx + c
      expr: p*q
    goals:
    - prompt: Find the zeroes of x² − 7x + 10.
      want:
        bb: -7
        cc: 10
      hint: Sum of zeroes = −b/a, product = c/a. Which two numbers add to 7 and multiply to 10?
      mistakes:
      - when:
          p: -2
          q: -5
        say: Zeroes −2 and −5 give x² + 7x + 10. The sum of the zeroes is −b, so b = −7 needs zeroes that add to +7.
      - when:
          p: -5
          q: -2
        say: 'Zeroes −5 and −2 give x² + 7x + 10. The sum of the zeroes is −b: here +7.'
      - when:
          cc: 10
        say: 'The product 10 is right. Now the sum: it must be 7.'
    - prompt: Find the zeroes of x² + x − 12.
      want:
        bb: 1
        cc: -12
      mistakes:
      - when:
          p: -3
          q: 4
        say: −3 and 4 add to +1, which gives x² − x − 12. Sum of zeroes = −b = −1.
      - when:
          p: 4
          q: -3
        say: 4 and −3 add to +1, giving x² − x − 12. The zeroes must add to −1.
      - when:
          cc: 12
        say: 'Product +12: both zeroes have the same sign. c = −12 needs one positive and one negative.'
  lesson:
    - teach: 'For a quadratic ax² + bx + c with zeroes α and β: sum α + β = −b/a, product αβ = c/a. For x² − 5x + 6 (zeroes 2 and 3): sum = −(−5)/1 = 5 and product = 6/1 = 6. Check: 2 + 3 = 5 and 2 × 3 = 6.'
      picture:
        kind: compare
        columns:
        - title: Sum of zeroes
          points:
          - −b/a
          - x² − 5x + 6 → 5
        - title: Product of zeroes
          points:
          - c/a
          - x² − 5x + 6 → 6
        alt: Sum of zeroes is minus b over a; product is c over a, shown for x squared minus 5x plus 6.
      check:
        prompt: Sum of the zeroes of 3x² − 6x + 1?
        options:
        - '2'
        - −2
        - 1/3
        answer: '2'
        why: −b/a = −(−6)/3 = 2.
    - teach: 'To build a quadratic from its zeroes: if the sum is S and the product is P, the quadratic is k(x² − Sx + P) for any non-zero k. Zeroes 4 and −1: S = 3, P = −4, giving x² − 3x − 4.'
      check:
        prompt: Quadratic with zeroes summing to 5 and multiplying to 4?
        options:
        - x² − 5x + 4
        - x² + 5x + 4
        - x² − 4x + 5
        answer: x² − 5x + 4
        why: x² − Sx + P.
    - teach: 'For a cubic ax³ + bx² + cx + d with zeroes α, β, γ: α + β + γ = −b/a, αβ + βγ + γα = c/a and αβγ = −d/a.'
      check:
        prompt: Product of the zeroes of 2x³ − 4x² + x − 6?
        options:
        - '3'
        - −3
        - '6'
        answer: '3'
        why: −d/a = −(−6)/2 = 3.
  items:
  - prompt: Find the sum of the zeroes of x² − 7x + 10.
    answer: '7'
    check: -(-7)/1
    difficulty: 1
    hints:
    - Sum = −b/a.
    - b = −7, a = 1.
    solution: 'Step 1: a = 1, b = −7. Step 2: Sum = −(−7)/1 = 7. Step 3: Check: zeroes 2 and 5 add to 7.'
    mistakes:
      '-7': c10_sum_sign
  - prompt: Find the product of the zeroes of x² − 7x + 10.
    answer: '10'
    check: 10/1
    difficulty: 1
    hints:
    - Product = c/a.
    - c = 10, a = 1.
    solution: 'Step 1: Product = c/a = 10/1 = 10. Step 2: Check: 2 × 5 = 10.'
    mistakes: {"7": "t10_product_c_over_a", "-7": "c10_sum_sign"}
  - prompt: Find the sum of the zeroes of 2x² + 8x − 5.
    answer: '-4'
    check: -8/2
    difficulty: 2
    hints:
    - Sum = −b/a.
    - −8/2.
    solution: 'Step 1: a = 2, b = 8. Step 2: Sum = −8/2 = −4.'
    mistakes:
      '4': c10_sum_sign
  - prompt: Find the product of the zeroes of 2x² + 8x − 5. Type a fraction like −5/2.
    answer: -5/2
    check: -5/2
    difficulty: 2
    hints:
    - Product = c/a.
    - c = −5, a = 2.
    solution: 'Step 1: Product = c/a = −5/2.'
    mistakes: {"-4": "t10_product_c_over_a", "5/2": "t10_product_c_over_a"}
  - prompt: Which quadratic has zeroes with sum 4 and product 3?
    options:
    - x² − 4x + 3
    - x² + 4x + 3
    - x² − 3x + 4
    - x² + 3x − 4
    answer: x² − 4x + 3
    difficulty: 2
    hints:
    - Use x² − (sum)x + (product).
    - x² − 4x + 3.
    solution: 'Step 1: x² − (sum)x + (product) = x² − 4x + 3. Step 2: Check: (x − 1)(x − 3) has zeroes 1 and 3; 1 + 3 = 4, 1 × 3 = 3.'
    mistakes:
      x² + 4x + 3: c10_sum_sign
  - prompt: For the cubic x³ − 6x² + 11x − 6, find the sum of its three zeroes.
    answer: '6'
    check: 1 + 2 + 3
    difficulty: 3
    hints:
    - For a cubic, sum = −b/a.
    - b = −6, a = 1.
    solution: 'Step 1: a = 1, b = −6. Step 2: Sum = 6. Step 3: Check: the zeroes 1, 2 and 3 add to 6.'
    mistakes:
      '-6': c10_sum_sign
  - prompt: If one zero of x² + kx − 12 is 3, find k.
    answer: '1'
    check: (12 - 9)/3
    difficulty: 3
    hints:
    - Put x = 3 and set it to 0.
    - 9 + 3k − 12 = 0.
    solution: 'Step 1: 3² + 3k − 12 = 0. Step 2: 3k = 3, so k = 1. Step 3: Check: x² + x − 12 = (x − 3)(x + 4).'
    mistakes: {"-1": "t10_put_zero_in", "3": "t10_put_zero_in"}
  - prompt: Find the sum of the zeroes of x² + 3x − 10.
    answer: '-3'
    check: '-3'
    difficulty: 1
    hints:
    - Sum = −b/a.
    - b = 3, a = 1.
    solution: Sum = −3/1 = −3.
    mistakes:
      '3': c10m2_signs
      '-10': c10m2_signs
  - prompt: Find the product of the zeroes of x² + 3x − 10.
    answer: '-10'
    check: '-10'
    difficulty: 1
    hints:
    - Product = c/a.
    - c = −10, a = 1.
    solution: Product = −10/1 = −10.
    mistakes:
      '10': c10m2_signs
      '-3': c10m2_signs
  - prompt: Which quadratic has zeroes −2 and 5?
    options:
    - x² − 3x − 10
    - x² + 3x − 10
    - x² − 3x + 10
    - x² + 7x + 10
    answer: x² − 3x − 10
