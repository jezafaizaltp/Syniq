# CBSE Class 10 Mathematics (NCERT), chapter 1. Format: content/README.md.
subject: cbse10-math
chapter: 1
title: Real Numbers

tips:
  hcf_lcm_swapped: "HCF uses the smallest power of each common prime; LCM uses the largest power of every prime that appears."
  hcf_times_lcm_divide: "HCF × LCM = the product of the two numbers. So LCM = (a × b) ÷ HCF, a division, not a multiplication."
  not_coprime_check: "Coprime means the only common factor is 1. Look for any shared prime first."
  t10_conjugate_product: "(a + b)(a − b) = a² − b². Square √3 and see what is left."
  t10_count_twos: "Count how many times 2 divides 140 before you reach an odd number. That count is the power of 2."
  t10_ends_in_zero: "A number ends in 0 only if it has both 2 and 5 among its prime factors. What primes does 6ⁿ have?"
  t10_hcf_common_prime: "Split each number into primes, then take only the primes that appear in every number."
  t10_irrational_closure: "Test each claim with √2: √2 × √2, √2 + (−√2), √4. One counterexample breaks a claim."
  t10_lowest_terms_start: "Proof by contradiction starts with the fraction in its simplest form, so a and b share no factor."
  t10_multiply_roots: "√a × √b = √(a × b). Multiply inside the root first, then simplify."
  t10_perfect_square_rational: "Simplify first. A square root of a perfect square, a decimal that stops and a fraction are all rational."
  t10_prime_divides: "The prime factors of a² are those of a, each twice. If p appears in a², where else must it appear?"
  t10_prime_only: "In a prime factorisation every factor must be prime. Check each factor: can 4 or 14 be split further?"
  t10_simplify_each: "Work out each option: √16, (√3)², 6/2. The one with a root that can't be simplified is irrational."
  c10m1_ladder: 'Break the number down one prime at a time: divide by 2 while you can, then 3, then 5, and so on, until you reach 1.'
  c10m1_smallest_common: For the HCF, keep only the primes both numbers share, each with the smaller power. For the LCM, keep every prime, each with the larger power.
  c10m1_product_rule: For two numbers, HCF × LCM equals the product of the numbers. Rearrange that to find the missing one.
  c10m1_root_check: Is the number under the root a perfect square? If not, its square root cannot be written as a fraction.
  c10m1_mix_rule: "When a fraction is added to, taken from or multiplies (non-zero) a root that is not a whole number, can the root ever disappear? Check whether any roots cancel or combine into a perfect square."

concepts:
  - code: cbse10m.real.fundamental
    title: Fundamental Theorem of Arithmetic
    notes: |
      Every composite number can be written as a product of primes in exactly one way, apart from the order
      of the factors. HCF = product of the smallest power of each common prime factor; LCM = product of the
      greatest power of each prime factor involved. For two positive integers a and b, HCF(a, b) × LCM(a, b) = a × b.
    explanations:
      text: "Every whole number bigger than 1 is either prime or can be broken into primes in only one way: 60 = 2² × 3 × 5, and no other set of primes multiplies to 60. Once two numbers are in prime form, the HCF takes the smallest power of each shared prime and the LCM takes the biggest power of every prime."
      visual: "Draw a factor tree for 60: split it into 6 × 10, then 6 into 2 × 3 and 10 into 2 × 5. The leaves at the bottom are all primes: 2, 3, 2, 5. However you start the tree, you always end with the same leaves."
      step_by_step: "Step 1: Break each number into primes, for example 12 = 2² × 3 and 18 = 2 × 3². Step 2: HCF: take each prime both share, with the smaller power: 2¹ × 3¹ = 6. Step 3: LCM: take every prime with the bigger power: 2² × 3² = 36. Step 4: Check: 6 × 36 = 216 = 12 × 18."
      real_world: "Two buses leave the depot together, one every 12 minutes and one every 18 minutes. They next leave together after the LCM, 36 minutes. If you cut ribbons of 12 m and 18 m into equal pieces as long as possible, each piece is the HCF, 6 m."
    picture:
      kind: flow
      steps: ["12 = 2² × 3 and 18 = 2 × 3²", "HCF: shared primes, smaller powers: 2 × 3 = 6", "LCM: all primes, bigger powers: 2² × 3² = 36", "Check: 6 × 36 = 216 = 12 × 18"]
      alt: "Finding the HCF and LCM of 12 and 18 from their prime factors: the HCF is 6, the LCM is 36, and 6 × 36 equals 12 × 18."
    activity:
      type: formula
      prompt: Build two numbers from 2s and 3s. HCF takes the smaller power of each prime, LCM the bigger power.
      inputs:
      - name: p
        label: Powers of 2 in a
        min: 0
        max: 4
        step: 1
        start: 0
      - name: q
        label: Powers of 3 in a
        min: 0
        max: 4
        step: 1
        start: 0
      - name: r
        label: Powers of 2 in b
        min: 0
        max: 4
        step: 1
        start: 0
      - name: s
        label: Powers of 3 in b
        min: 0
        max: 4
        step: 1
        start: 0
      outputs:
      - name: a
        label: a
        expr: 2^p*3^q
      - name: b
        label: b
        expr: 2^r*3^s
      - name: hcf
        label: HCF
        expr: 2^min(p,r)*3^min(q,s)
      - name: lcm
        label: LCM
        expr: 2^max(p,r)*3^max(q,s)
      goals:
      - prompt: Find a and b with HCF 6 and LCM 72, where neither number is 6 or 72.
        want:
          hcf: 6
          lcm: 72
          a:
          - 7
          - 71
          b:
          - 7
          - 71
        hint: 6 = 2 × 3 and 72 = 2³ × 3². Each prime's smaller power goes in the HCF, its bigger power in the LCM.
        mistakes:
        - when:
            a: 12
            b: 36
          say: '12 × 36 = 432 = 6 × 72, but a right product isn''t enough: HCF(12, 36) is 12, because 12 divides 36.'
        - when:
            a: 8
            b: 54
          say: '8 × 54 = 432 too, but 8 has no 3 in it, so the only shared prime is 2: HCF 2.'
        - when:
            hcf: 6
          say: 'The HCF is right. The LCM takes the biggest power of each prime: it needs 2³ and 3² between the two numbers.'
      - prompt: Now make HCF 1 and LCM 72, with neither number 1.
        want:
          hcf: 1
          lcm: 72
          a:
          - 2
          - 72
          b:
          - 2
          - 72
        mistakes:
        - when:
            hcf: 2
          say: 'They share a 2. For HCF 1 no prime may be in both: give all the 2s to one number and all the 3s to the other.'
        - when:
            hcf: 3
          say: They share a 3. For HCF 1, keep the 3s in one number only.
    lesson:
      - teach: The Fundamental Theorem of Arithmetic says every composite number can be written as a product of primes in exactly one way, apart from the order. For example, 360 = 2³ × 3² × 5. Whichever way you start dividing, you end with the same primes.
        picture:
          kind: flow
          steps:
          - '360'
          - ÷2 → 180
          - ÷2 → 90
          - ÷2 → 45
          - ÷3 → 15
          - ÷3 → 5
          - ÷5 → 1
          alt: 'Dividing 360 by primes step by step: three 2s, two 3s and one 5.'
        check:
          prompt: What is 360 as a product of primes?
          options:
          - 2³ × 3² × 5
          - 2² × 3³ × 5
          - 2 × 3 × 60
          answer: 2³ × 3² × 5
          why: Three 2s, two 3s and one 5 multiply to 360.
      - teach: 'To find the HCF, take each prime the numbers share, with its smallest power. To find the LCM, take every prime that appears, with its greatest power. For 12 = 2² × 3 and 18 = 2 × 3²: HCF = 2 × 3 = 6 and LCM = 2² × 3² = 36.'
        picture:
          kind: compare
          columns:
          - title: HCF
            points:
            - Common primes only
            - Smallest power
            - 12, 18 → 2 × 3 = 6
          - title: LCM
            points:
            - All primes
            - Greatest power
            - 12, 18 → 2² × 3² = 36
          alt: HCF uses common primes with the smallest powers; LCM uses all primes with the greatest powers.
        check:
          prompt: For 12 and 18, the LCM is…
          options:
          - '36'
          - '6'
          - '216'
          answer: '36'
          why: 2² × 3² = 36.
      - teach: 'For any two positive integers a and b, HCF(a, b) × LCM(a, b) = a × b. Check: 6 × 36 = 216 = 12 × 18. This shortcut works for two numbers only, not three.'
        check:
          prompt: HCF × LCM of 12 and 18 equals…
          options:
          - 12 × 18
          - 12 + 18
          - 18 − 12
          answer: 12 × 18
          why: That is the product rule for two numbers.
    items:
      - prompt: "Which is the prime factorisation of 140?"
        options: ["2² × 5 × 7", "2 × 5 × 14", "4 × 5 × 7", "2³ × 5 × 7"]
        answer: "2² × 5 × 7"
        difficulty: 1
        hints: ["Every factor must be prime.", "140 = 2 × 70 = 2 × 2 × 35."]
        solution: "Step 1: 140 = 2 × 70 = 2 × 2 × 35. Step 2: 35 = 5 × 7. Step 3: So 140 = 2² × 5 × 7. (14 and 4 are not prime.)"
        mistakes: {"2 × 5 × 14": "t10_prime_only", "2³ × 5 × 7": "t10_count_twos"}
      - prompt: "Find the HCF of 26 and 91."
        answer: "13"
        check: "gcd(26, 91)"
        difficulty: 1
        hints: ["Write 26 and 91 as products of primes and look for a shared factor.", "91 = 7 × 13."]
        solution: "Step 1: 26 = 2 × 13 and 91 = 7 × 13. Step 2: The only shared prime is 13, so the HCF is 13."
        mistakes: {"182": "hcf_lcm_swapped", "1": "t10_hcf_common_prime"}
      - prompt: "Find the LCM of 26 and 91."
        answer: "182"
        check: "lcm(26, 91)"
        difficulty: 1
        hints: ["26 = 2 × 13, 91 = 7 × 13.", "Take every prime once: 2 × 7 × 13."]
        solution: "Step 1: 26 = 2 × 13, 91 = 7 × 13. Step 2: LCM = 2 × 7 × 13 = 182. Step 3: Check: 13 × 182 = 2366 = 26 × 91."
        mistakes: {"13": hcf_lcm_swapped}
      - prompt: "Find the HCF of 12, 15 and 21."
        answer: "3"
        check: "gcd(gcd(12, 15), 21)"
        difficulty: 2
        hints: ["12 = 2² × 3, 15 = 3 × 5, 21 = 3 × 7.", "Which prime is in all three?"]
        solution: "Step 1: 12 = 2² × 3, 15 = 3 × 5, 21 = 3 × 7. Step 2: Only 3 is in all three, so the HCF is 3."
        mistakes: {"420": "hcf_lcm_swapped", "1": "t10_hcf_common_prime"}
      - prompt: "Find the LCM of 12, 15 and 21."
        answer: "420"
        check: "lcm(lcm(12, 15), 21)"
        difficulty: 2
        hints: ["Take the highest power of each prime: 2², 3, 5, 7.", "4 × 3 × 5 × 7."]
        solution: "Step 1: Primes needed: 2², 3, 5, 7. Step 2: LCM = 4 × 3 × 5 × 7 = 420."
        mistakes: {"3": hcf_lcm_swapped}
      - prompt: "The HCF of two numbers is 9 and their product is 1620. Find their LCM."
        answer: "180"
        check: "1620/9"
        difficulty: 2
        hints: ["HCF × LCM = product of the numbers.", "LCM = 1620 ÷ 9."]
        solution: "Step 1: HCF × LCM = 1620. Step 2: LCM = 1620 ÷ 9 = 180."
        mistakes: {"14580": hcf_times_lcm_divide}
      - prompt: "Two bells ring every 18 and 24 minutes. They ring together at 9 a.m. After how many minutes do they next ring together?"
        answer: "72"
        check: "lcm(18, 24)"
        difficulty: 2
        hints: ["You need a time that is a multiple of both 18 and 24.", "18 = 2 × 3², 24 = 2³ × 3."]
        solution: "Step 1: 18 = 2 × 3², 24 = 2³ × 3. Step 2: LCM = 2³ × 3² = 72. Step 3: They ring together again after 72 minutes."
        mistakes: {"6": hcf_lcm_swapped}
      - prompt: "Which pair of numbers is coprime?"
        options: ["8 and 15", "12 and 18", "14 and 21", "9 and 27"]
        answer: "8 and 15"
        difficulty: 2
        hints: ["Coprime numbers share no prime factor.", "8 = 2³, 15 = 3 × 5."]
        solution: "Step 1: 8 = 2³ and 15 = 3 × 5 share no prime, so their HCF is 1. Step 2: 12 and 18 share 6, 14 and 21 share 7, 9 and 27 share 9."
        mistakes: {"14 and 21": not_coprime_check}
      - prompt: "Could 6ⁿ end with the digit 0 for some natural number n?"
        options: ["No, because 6ⁿ has no prime factor 5", "Yes, when n is even", "Yes, when n = 5", "Only when n is a multiple of 10"]
        answer: "No, because 6ⁿ has no prime factor 5"
        difficulty: 3
        hints: ["A number ending in 0 is divisible by 10 = 2 × 5.", "6ⁿ = 2ⁿ × 3ⁿ. Is there a 5?"]
        solution: "Step 1: To end in 0, a number must have both 2 and 5 as prime factors. Step 2: 6ⁿ = 2ⁿ × 3ⁿ, and by the Fundamental Theorem these are its only primes. Step 3: There is no 5, so 6ⁿ never ends in 0."

        mistakes: {"Yes, when n = 5": "t10_ends_in_zero", "Only when n is a multiple of 10": "t10_ends_in_zero"}
      - prompt: Find the HCF of 96 and 404.
        answer: '4'
        check: '4'
        difficulty: 2
        hints:
        - 96 = 2⁵ × 3.
        - 404 = 2² × 101.
        solution: 'Step 1: 96 = 2⁵ × 3 and 404 = 2² × 101. Step 2: The only common prime is 2, smallest power 2². Step 3: HCF = 4.'
        mistakes:
          '2': c10m1_smallest_common
          '8': c10m1_smallest_common
      - prompt: Find the LCM of 96 and 404.
        answer: '9696'
        check: 96 * 404 // 4
        difficulty: 2
        hints:
        - Use HCF × LCM = product.
        - The HCF is 4.
        solution: 'Step 1: 96 × 404 = 38784. Step 2: LCM = 38784 ÷ 4 = 9696.'
        mistakes:
          '38784': c10m1_product_rule
          '4': c10m1_smallest_common
      - prompt: What is the prime factorisation of 3825?
        options:
        - 3² × 5² × 17
        - 3 × 5² × 51
        - 3² × 5 × 85
        - 5² × 153
        answer: 3² × 5² × 17
        difficulty: 2
        hints:
        - It ends in 5, so divide by 5.
        - Keep going until every factor is prime.
        solution: 'Step 1: 3825 ÷ 5 = 765, ÷ 5 = 153. Step 2: 153 = 9 × 17 = 3² × 17. Step 3: 3825 = 3² × 5² × 17.'
        mistakes:
          3 × 5² × 51: c10m1_ladder
          5² × 153: c10m1_ladder
      - prompt: LCM of two numbers is 120 and their HCF is 4. One number is 24. Find the other.
        answer: '20'
        check: 120 * 4 // 24
        difficulty: 2
        hints:
        - HCF × LCM = product of the numbers.
        - Divide that product by 24.
        solution: 'Step 1: Product = 4 × 120 = 480. Step 2: Other number = 480 ÷ 24 = 20.'
        mistakes:
          '5': c10m1_product_rule
          '480': c10m1_product_rule
      - prompt: Find the HCF of 6, 72 and 120.
        answer: '6'
        check: '6'
        difficulty: 1
        hints:
        - 6 = 2 × 3.
        - Does 6 divide 72 and 120?
        solution: 'Step 1: 6 = 2 × 3, 72 = 2³ × 3², 120 = 2³ × 3 × 5. Step 2: Common primes with smallest powers: 2 × 3 = 6.'
        mistakes:
          '2': c10m1_smallest_common
          '12': c10m1_smallest_common
      - prompt: Is 7 × 11 × 13 + 13 a prime number or a composite number?
        options:
        - Composite
        - Prime
        - Neither
        - It cannot be decided
        answer: Composite
        difficulty: 3
        hints:
        - Look for a common factor in both parts.
        - Take 13 out.
        solution: 'Step 1: 7 × 11 × 13 + 13 = 13 × (77 + 1) = 13 × 78. Step 2: It has factors other than 1 and itself, so it is composite.'
        mistakes:
          Prime: c10m1_ladder
      - prompt: Sonia takes 18 minutes to drive one round of a field; Ravi takes 12 minutes. They start together at the same point in the same direction. After how many minutes do they meet again at the start?
        answer: '36'
        check: '36'
        difficulty: 2
        hints:
        - They meet when both have done whole rounds.
        - Find the LCM of 18 and 12.
        solution: 'Step 1: 18 = 2 × 3², 12 = 2² × 3. Step 2: LCM = 2² × 3² = 36 minutes.'
        mistakes:
          '6': c10m1_smallest_common
          '216': c10m1_product_rule
      - prompt: How many times does the prime 2 appear in the prime factorisation of 1024?
        answer: '10'
        check: '10'
        difficulty: 2
        hints:
        - 1024 is a power of 2.
        - 'Keep halving: 512, 256, ...'
        solution: 1024 = 2¹⁰, so 2 appears 10 times.
        mistakes:
          '9': c10m1_ladder
          '512': c10m1_ladder
  - code: cbse10m.real.irrational
    title: Proving numbers irrational
    after: [cbse10m.real.fundamental]
    notes: |
      If a prime p divides a², then p divides a. Using this, √2, √3 and √p for any prime p are proved irrational
      by contradiction: assume √p = a/b in lowest terms, square, and show p divides both a and b. The sum or
      difference of a rational and an irrational number is irrational; the product or quotient of a non-zero
      rational and an irrational number is irrational.
    explanations:
      text: "To prove √2 is irrational, pretend it isn't: √2 = a/b with a and b sharing no factor. Squaring gives a² = 2b², so 2 divides a², so 2 divides a. Then a = 2c, and 4c² = 2b² gives b² = 2c², so 2 divides b too. But a and b were supposed to share nothing. The pretence breaks, so √2 is irrational."
      visual: "Picture a fraction a/b already cut down as far as it goes, like 3/4. The proof shows that if a/b were √2, you could always divide top and bottom by 2 again. A fraction that never stops simplifying can't exist."
      step_by_step: "Step 1: Assume the number is rational: √p = a/b, a and b coprime. Step 2: Square: a² = p b². Step 3: So p divides a², hence p divides a. Write a = pc. Step 4: Then p²c² = p b², so b² = p c², and p divides b. Step 5: Now p divides both a and b, which contradicts coprime. So √p is irrational."
      real_world: "A square tile with side 1 m has a diagonal of √2 m. Because √2 is irrational, no tape measure, however finely marked, will ever show the diagonal as an exact fraction of a metre."
    picture:
      kind: flow
      steps: ["Assume √2 = a/b, with a and b sharing no factor", "Square both sides: a² = 2b²", "So 2 divides a; write a = 2c", "Then 4c² = 2b², so b² = 2c² and 2 divides b", "2 divides both a and b: impossible, so √2 is irrational"]
      alt: "The proof that √2 is irrational in five steps: assume it is a fraction in lowest terms, then show 2 divides both top and bottom, which is impossible."
    activity:
      type: sort
      prompt: Work each one out first. Is the answer rational or irrational?
      bins:
      - Rational
      - Irrational
      items:
      - label: √5 + 3
        bin: Irrational
        clue: Is a rational plus an irrational ever rational?
        why: If √5 + 3 were rational, √5 = (it) − 3 would be too. It isn't, so the sum is irrational.
      - label: (√3)²
        bin: Rational
        clue: What does squaring a square root do?
        why: (√3)² = 3, a whole number.
      - label: √8 ÷ √2
        bin: Rational
        clue: Combine them under one root first.
        why: √8 ÷ √2 = √4 = 2.
      - label: 3√7
        bin: Irrational
        clue: Can a non-zero rational times an irrational be rational?
        why: If 3√7 were p/q, √7 would be p/(3q). It isn't, so 3√7 is irrational.
      - label: (2 + √3)(2 − √3)
        bin: Rational
        clue: Use (a + b)(a − b) = a² − b².
        why: '4 − 3 = 1: the roots cancel.'
      - label: √2 + √2
        bin: Irrational
        clue: 'Add them: what is √2 + √2?'
        why: '√2 + √2 = 2√2, a rational times an irrational: irrational.'
      - label: 0.4545…
        bin: Rational
        clue: Does a block of digits repeat?
        why: '''45'' repeats forever: 45/99 = 5/11, rational.'
      - label: (1 + √2)²
        bin: Irrational
        clue: 'Expand: (1 + √2)² = 1 + 2√2 + 2. Does the √2 go away?'
        why: 'It is 3 + 2√2, and the 2√2 stays: irrational.'
      - label: √49 ÷ √16
        bin: Rational
        clue: Work out each root.
        why: 7 ÷ 4 = 7/4.
      - label: π − 3
        bin: Irrational
        clue: Is π itself rational?
        why: π is irrational, and taking away 3 can't fix that.
    lesson:
      - teach: 'A rational number can be written as p/q, with integers p, q and q ≠ 0. An irrational number cannot. √2, √3, √5 and √p for any prime p are irrational. A key fact used to prove this: if a prime p divides a², then p divides a.'
        check:
          prompt: Which of these is rational?
          options:
          - √16
          - √7
          - √3
          answer: √16
          why: √16 = 4 = 4/1.
      - teach: 'Proof that √3 is irrational, by contradiction. Suppose √3 = a/b with a, b coprime. Then 3b² = a², so 3 divides a², and so 3 divides a. Write a = 3c: then 3b² = 9c², so b² = 3c², and 3 divides b too. But a and b were coprime: contradiction. So √3 is irrational.'
        picture:
          kind: flow
          steps:
          - Assume √3 = a/b, coprime
          - 3b² = a²
          - 3 divides a
          - a = 3c, so b² = 3c²
          - 3 divides b
          - Contradiction
          alt: Steps of the proof that root 3 is irrational, ending in a contradiction.
        check:
          prompt: Why is the end a contradiction?
          options:
          - 3 divides both a and b, but they were coprime
          - b became zero
          - a became negative
          answer: 3 divides both a and b, but they were coprime
          why: Coprime numbers share no factor except 1.
      - teach: 'Mixing: rational + irrational is irrational (so 5 + √2 is irrational); a non-zero rational × irrational is irrational (so 3√2 is irrational). But two irrationals can give a rational: √2 × √2 = 2, and (3 + √2) + (3 − √2) = 6.'
        check:
          prompt: Is 7√5 rational or irrational?
          options:
          - Irrational
          - Rational
          - It depends
          answer: Irrational
          why: Non-zero rational times irrational is irrational.
    items:
      - prompt: "Which of these is irrational?"
        options: ["√5", "√25", "0.25", "7/3"]
        answer: "√5"
        difficulty: 1
        hints: ["Which square root does not come out as a whole number?", "√25 = 5."]
        solution: "Step 1: √25 = 5, 0.25 = 1/4 and 7/3 are rational. Step 2: 5 is prime, so √5 is irrational."
        mistakes: {"√25": "t10_perfect_square_rational", "0.25": "t10_perfect_square_rational"}
      - prompt: "Which of these numbers is irrational?"
        options: ["3 + 2√5", "√16 + 1", "(√3)²", "6/2"]
        answer: "3 + 2√5"
        difficulty: 1
        hints: ["A rational number plus an irrational number is irrational.", "(√3)² = 3."]
        solution: "Step 1: √16 + 1 = 5, (√3)² = 3 and 6/2 = 3 are rational. Step 2: 2√5 is irrational, and 3 + (irrational) is irrational."
        mistakes: {"√16 + 1": "t10_simplify_each", "(√3)²": "t10_simplify_each"}
      - prompt: "In the proof that √3 is irrational, we assume √3 = a/b where a and b are…"
        options: ["coprime integers, with b ≠ 0", "both even", "both prime", "equal"]
        answer: "coprime integers, with b ≠ 0"
        difficulty: 2
        hints: ["Any fraction can be cut down to lowest terms.", "Lowest terms means the top and bottom share no factor."]
        solution: "Step 1: We write the fraction in lowest terms, so a and b are coprime and b ≠ 0. Step 2: The proof then shows 3 divides both, a contradiction."
        mistakes: {"both even": "t10_lowest_terms_start", "both prime": "t10_lowest_terms_start"}
      - prompt: "If a prime p divides a², what must also be true?"
        options: ["p divides a", "p² divides a", "a is prime", "p divides a + 1"]
        answer: "p divides a"
        difficulty: 2
        hints: ["Think of the prime factors of a and of a².", "a² has the same primes as a, each twice."]
        solution: "Step 1: The primes of a² are the primes of a, each appearing twice. Step 2: So if p is a prime factor of a², it is already a prime factor of a."
        mistakes: {"a is prime": "t10_prime_divides", "p divides a + 1": "t10_prime_divides"}
      - prompt: "Which is rational?"
        options: ["(2 + √3)(2 − √3)", "2 + √3", "√3/2", "2√3"]
        answer: "(2 + √3)(2 − √3)"
        difficulty: 2
        hints: ["Use (a + b)(a − b) = a² − b².", "4 − 3."]
        solution: "Step 1: (2 + √3)(2 − √3) = 2² − (√3)² = 4 − 3 = 1. Step 2: 1 is rational. The others are irrational."
        mistakes: {"2 + √3": "t10_conjugate_product", "2√3": "t10_conjugate_product"}
      - prompt: "√2 × √8 = ?"
        answer: "4"
        check: "sqrt(2)*sqrt(8)"
        difficulty: 2
        hints: ["√a × √b = √(ab).", "√16."]
        solution: "Step 1: √2 × √8 = √16. Step 2: √16 = 4. So two irrational numbers can multiply to a rational one."
        mistakes: {"16": "t10_multiply_roots", "10": "t10_multiply_roots"}
      - prompt: "Which statement is always true?"
        options: ["Rational × non-zero rational is rational", "Irrational × irrational is irrational", "Irrational + irrational is irrational", "√(any whole number) is irrational"]
        answer: "Rational × non-zero rational is rational"
        difficulty: 3
        hints: ["Try √2 × √2 and √2 + (−√2).", "√4 is a whole number."]
        solution: "Step 1: √2 × √2 = 2 and √2 + (−√2) = 0 are rational, so the second and third fail. Step 2: √4 = 2 is rational. Step 3: (p/q)(r/s) = pr/qs is always rational."
        mistakes: {"Irrational × irrational is irrational": "t10_irrational_closure", "√(any whole number) is irrational": "t10_irrational_closure"}
      - prompt: Which of these numbers cannot be written as p/q?
        options:
        - 6 + √2
        - √25
        - '0.75'
        - 22/7
        answer: 6 + √2
        difficulty: 1
        hints:
        - Which one has a root that is not a perfect square?
        - Rational + irrational is irrational.
        solution: √2 is irrational, so 6 + √2 is irrational. √25 = 5, 0.75 = 3/4 and 22/7 are rational.
        mistakes:
          √25: c10m1_root_check
          22/7: c10m1_root_check
      - prompt: Which of these is rational?
        options:
        - √3 × √12
        - √3 + √12
        - √12
        - 2√3
        answer: √3 × √12
        difficulty: 2
        hints:
        - Multiply under one root.
        - Is 36 a perfect square?
        solution: 'Step 1: √3 × √12 = √36. Step 2: √36 = 6, which is rational.'
        mistakes:
          √3 + √12: c10m1_mix_rule
          2√3: c10m1_mix_rule
      - prompt: In proving √5 irrational, after assuming √5 = a/b we get 5b² = a². What can we conclude next?
        options:
        - 5 divides a
        - 5 divides b only
        - a = b
        - b = 5
        answer: 5 divides a
        difficulty: 2
        hints:
        - 5 divides a².
        - Use the prime-divides-square fact.
        solution: 'Step 1: 5b² = a², so 5 divides a². Step 2: 5 is prime, so 5 divides a.'
        mistakes:
          5 divides b only: c10m1_root_check
      - prompt: Is 1/√2 rational or irrational?
        options:
        - Irrational
        - Rational
        - An integer
        - Zero
        answer: Irrational
        difficulty: 2
        hints:
        - 1/√2 = √2/2.
        - That is ½ times an irrational.
        solution: 1/√2 = (1/2)√2, a non-zero rational times an irrational, so it is irrational.
        mistakes:
          Rational: c10m1_mix_rule
      - prompt: Simplify (√5 + √2)(√5 − √2).
        answer: '3'
        check: 5 - 2
        difficulty: 2
        hints:
        - Use (a + b)(a − b) = a² − b².
        - Square each root.
        solution: 'Step 1: (√5)² − (√2)² = 5 − 2. Step 2: = 3.'
        mistakes:
          '7': c10m1_mix_rule
      - prompt: Which statement about irrational numbers is correct?
        options:
        - The sum of two irrationals can be rational
        - The sum of two irrationals is always irrational
        - Every square root is irrational
        - π = 22/7 exactly
        answer: The sum of two irrationals can be rational
        difficulty: 3
        hints:
        - Try (2 + √3) + (2 − √3).
        - 22/7 is only an approximation.
        solution: (2 + √3) + (2 − √3) = 4, rational. So two irrationals can sum to a rational.
        mistakes:
          The sum of two irrationals is always irrational: c10m1_mix_rule
          Every square root is irrational: c10m1_root_check
      - prompt: √18 simplifies to k√2. Find k.
        answer: '3'
        check: '3'
        difficulty: 1
        hints:
        - 18 = 9 × 2.
        - √9 = 3.
        solution: √18 = √(9 × 2) = 3√2, so k = 3.
        mistakes:
          '9': c10m1_root_check
          '2': c10m1_root_check
      - prompt: Is 5 − 2√3 rational or irrational?
        options:
        - Irrational
        - Rational
        - Zero
        - Negative rational
        answer: Irrational
        difficulty: 1
        hints:
        - 2√3 is irrational.
        - Rational minus irrational?
        solution: 2√3 is irrational, and a rational minus an irrational is irrational.
        mistakes:
          Rational: c10m1_mix_rule
