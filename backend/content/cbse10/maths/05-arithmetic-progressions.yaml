# CBSE Class 10 Mathematics (NCERT), chapter 5. Format: content/README.md.
subject: cbse10-math
chapter: 5
title: Arithmetic Progressions
tips:
  c10_n_minus_1: 'The nth term adds d only (n − 1) times: the first term already counts as one term.'
  c10_d_sign: d = next term − this term. If the terms go down, d is negative.
  c10_halve_sum: 'Pairing gives twice the sum. Remember to divide by 2: Sₙ = n/2 × (first + last).'
  t10_d_next_minus: "d = second term − first term. Not a term, and not the sum."
  t10_sum_formula: "Sₙ = n/2 × [2a + (n − 1)d]. Use n − 1, and don't forget to multiply by n/2."
  t10_terms_apart: "Count the steps between the two terms (subtract their positions), then divide the jump in value by that number of steps."
  c10m5_next_minus: The common difference is any term minus the term just before it, in that order. A falling list has a negative d.
  c10m5_n_minus_one: To reach the nth term you add d only (n − 1) times, because the first term already counts as one.
  c10m5_count: To count terms, set aₙ equal to the last term and solve for n. Don't just divide the last term by d.
  c10m5_sum: Sₙ = n/2 × (first + last), or n/2 × [2a + (n − 1)d]. Don't forget the n/2 in front.
  c10m5_average: "Think of the sum as the number of terms times the average term. In an AP, the average term is halfway between the first and the last."
concepts:
- code: cbse10m.ap.nth
  title: The nth term of an AP
  notes: |
    An arithmetic progression is a list of numbers where each term after the first is got by adding a fixed
    number d, the common difference, to the one before: a, a + d, a + 2d, … d can be positive, negative or
    zero. The nth term is aₙ = a + (n − 1)d. The nth term from the end of an AP with last term l is
    l − (n − 1)d.
  explanations:
    text: 'In an AP you add the same number each time: 3, 7, 11, 15, … adds 4. To reach the 10th term you start at the first term and add the difference 9 times (not 10), so a₁₀ = 3 + 9 × 4 = 39. In general aₙ = a + (n − 1)d.'
    visual: Draw a staircase where every step rises by the same height d. The first step is at height a. To stand on step n you climb n − 1 more steps, so your height is a + (n − 1)d.
    step_by_step: 'Step 1: Find a, the first term. Step 2: Find d = second term − first term (check with the next pair). Step 3: Use aₙ = a + (n − 1)d. Step 4: To find which term equals a number, solve a + (n − 1)d = that number for n; n must be a positive whole number.'
    real_world: 'A taxi charges ₹50 for the first km and ₹15 for each km after that. The fares for 1, 2, 3, … km form an AP: 50, 65, 80, … The 10th km''s fare is 50 + 9 × 15 = ₹185.'
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 2
    points:
    - at: 3
      label: a₁ = 3
    - at: 7
      label: a₂ = 7
    - at: 11
      label: a₃ = 11
    - at: 15
      label: a₄ = 15
    jumps:
    - from: 3
      to: 7
      label: '+4'
    - from: 7
      to: 11
      label: '+4'
    - from: 11
      to: 15
      label: '+4'
    caption: 'Each term is 4 more than the one before: d = 4, so aₙ = 3 + (n − 1) × 4.'
    alt: The AP 3, 7, 11, 15 on a number line, with equal jumps of 4 between the terms.
  activity:
    type: formula
    prompt: An AP starts at a and adds d each time. aₙ = a + (n − 1)d.
    inputs:
    - name: a
      label: First term a
      min: -20
      max: 60
      step: 1
      start: 0
    - name: d
      label: Common difference d
      min: -10
      max: 10
      step: 1
      start: 0
    outputs:
    - name: a3
      label: a₃
      expr: a+2*d
    - name: a6
      label: a₆
      expr: a+5*d
    - name: a10
      label: a₁₀
      expr: a+9*d
    - name: a20
      label: a₂₀
      expr: a+19*d
    goals:
    - prompt: An AP has a₃ = 12 and a₁₀ = 33. Find a and d.
      want:
        a3: 12
        a10: 33
      hint: From the 3rd to the 10th term is 7 jumps of d.
      mistakes:
      - when:
          a: 3
          d: 3
        say: 'With a = 3, the 3rd term is 9. a₃ = a + 2d: only two jumps after the first term.'
      - when:
          d:
          - 4
          - 5
        say: 'Too steep: from a₃ to a₁₀ is 7 jumps and the terms rise by 21.'
    - prompt: An AP starts at 50 and its 6th term is 25. Find d.
      want:
        a: 50
        a6: 25
      mistakes:
      - when:
          d: 5
        say: 'd = 5 makes the AP grow: 50, 55, 60… It falls to 25, so d is negative.'
      - when:
          d: -4
        say: 'd = −4 gives a₆ = 30: there are 5 jumps from the 1st term to the 6th, not 6.'
  lesson:
    - teach: 'An arithmetic progression (AP) is a list where you add the same number d each time to get the next term: a, a + d, a + 2d, … d is the common difference, and it can be positive, negative or zero. 4, 7, 10, 13 has d = 3; 10, 6, 2, −2 has d = −4.'
      picture:
        kind: number_line
        from: 0
        to: 14
        step: 1
        points:
        - at: 4
          label: a₁
        - at: 7
          label: a₂
        - at: 10
          label: a₃
        - at: 13
          label: a₄
        jumps:
        - from: 4
          to: 7
          label: '+3'
        - from: 7
          to: 10
          label: '+3'
        - from: 10
          to: 13
          label: '+3'
        alt: The AP 4, 7, 10, 13 on a number line, each jump +3.
      check:
        prompt: Common difference of 10, 6, 2, −2?
        options:
        - −4
        - '4'
        - '2'
        answer: −4
        why: 6 − 10 = −4.
    - teach: 'The nth term is aₙ = a + (n − 1)d. You add d only (n − 1) times because you start at the first term. For 4, 7, 10, …: a₂₀ = 4 + 19 × 3 = 61.'
      check:
        prompt: a₁₀ of 4, 7, 10, … ?
        options:
        - '31'
        - '34'
        - '30'
        answer: '31'
        why: 4 + 9 × 3 = 31.
    - teach: To find which term equals a given number, set a + (n − 1)d equal to it and solve for n. n must come out as a positive whole number, or the number is not in the AP.
      check:
        prompt: Which term of 4, 7, 10, … is 43?
        options:
        - 14th
        - 13th
        - 43rd
        answer: 14th
        why: 4 + (n − 1)3 = 43 gives n = 14.
  items:
  - prompt: Find the common difference of the AP 5, 9, 13, 17, …
    answer: '4'
    check: 9 - 5
    difficulty: 1
    hints:
    - d = second term − first term.
    - 9 − 5.
    solution: d = 9 − 5 = 4 (and 13 − 9 = 4 ✓).
    mistakes: {"5": "t10_d_next_minus", "14": "t10_d_next_minus"}
  - prompt: Find the 10th term of the AP 3, 7, 11, …
    answer: '39'
    check: 3 + (10 - 1)*4
    difficulty: 1
    hints:
    - aₙ = a + (n − 1)d.
    - 3 + 9 × 4.
    solution: 'Step 1: a = 3, d = 4. Step 2: a₁₀ = 3 + 9 × 4 = 39.'
    mistakes:
      '43': c10_n_minus_1
  - prompt: Find the common difference of the AP 20, 17, 14, 11, …
    answer: '-3'
    check: 17 - 20
    difficulty: 1
    hints:
    - Subtract a term from the next one.
    - 17 − 20.
    solution: d = 17 − 20 = −3. The terms go down.
    mistakes:
      '3': c10_d_sign
  - prompt: Which term of the AP 21, 18, 15, … is −81?
    answer: '35'
    check: (-81 - 21)/(-3) + 1
    difficulty: 2
    hints:
    - a + (n − 1)d = −81 with a = 21, d = −3.
    - (n − 1)(−3) = −102.
    solution: 'Step 1: 21 + (n − 1)(−3) = −81. Step 2: (n − 1)(−3) = −102, so n − 1 = 34. Step 3: n = 35.'
    mistakes:
      '34': c10_n_minus_1
  - prompt: The 3rd term of an AP is 12 and the 7th term is 24. Find d.
    answer: '3'
    check: (24 - 12)/4
    difficulty: 2
    hints:
    - a₇ − a₃ = 4d.
    - 24 − 12 = 4d.
    solution: 'Step 1: a₇ − a₃ = (a + 6d) − (a + 2d) = 4d. Step 2: 4d = 12, so d = 3.'
    mistakes: {"12": "t10_terms_apart", "2.4": "t10_terms_apart"}
  - prompt: How many two-digit numbers are divisible by 3?
    answer: '30'
    check: (99 - 12)/3 + 1
    difficulty: 3
    hints:
    - They are 12, 15, …, 99.
    - 99 = 12 + (n − 1) × 3.
    solution: 'Step 1: The AP is 12, 15, …, 99 with d = 3. Step 2: 99 = 12 + (n − 1)3, so n − 1 = 29. Step 3: n = 30.'
    mistakes:
      '29': c10_n_minus_1
  - prompt: Find the 30th term of the AP 10, 7, 4, …
    answer: '-77'
    check: 10 + 29 * (-3)
    difficulty: 2
    hints:
    - d = −3.
    - a₃₀ = 10 + 29d.
    solution: 'Step 1: d = 7 − 10 = −3. Step 2: a₃₀ = 10 + 29(−3) = −77.'
    mistakes:
      '97': c10m5_next_minus
      '-80': c10m5_n_minus_one
  - prompt: Is 301 a term of the AP 5, 11, 17, 23, …? Type the term number if it is, or 0 if it is not.
    answer: '0'
    check: '0'
    difficulty: 3
    hints:
    - 5 + (n − 1)6 = 301.
    - Is n a whole number?
    solution: 'Step 1: (n − 1)6 = 296, so n − 1 = 49.33… Step 2: n is not whole, so 301 is not a term.'
    mistakes:
      '50': c10m5_count
  - prompt: How many terms are there in the AP 7, 13, 19, …, 205?
    answer: '34'
    check: (205 - 7) // 6 + 1
    difficulty: 2
    hints:
    - 7 + (n − 1)6 = 205.
    - (n − 1) = 33.
    solution: 'Step 1: (n − 1)6 = 198, so n − 1 = 33. Step 2: n = 34.'
    mistakes:
      '33': c10m5_n_minus_one
  - prompt: Which list is an AP?
    options:
    - 2, 5, 8, 11
    - 1, 2, 4, 8
    - 1, 4, 9, 16
    - 3, 3², 3³
    answer: 2, 5, 8, 11
    difficulty: 1
    hints:
    - Check the differences.
    - Must be the same each time.
    solution: Only 2, 5, 8, 11 has a constant difference (3).
    mistakes:
      1, 2, 4, 8: c10m5_next_minus
  - prompt: Find the 11th term from the last of the AP 10, 7, 4, …, −62.
    answer: '-32'
    check: -62 + 10 * 3
    difficulty: 3
    hints:
    - 'Read the AP backwards: −62, −59, …'
    - From the end, d = +3.
    solution: 'Step 1: Backwards the AP starts at −62 with d = 3. Step 2: 11th term = −62 + 10 × 3 = −32.'
    mistakes:
      '-29': c10m5_n_minus_one
      '-92': c10m5_next_minus
  - prompt: If 2x, x + 10 and 3x + 2 are in AP, find x.
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - The middle term minus the first equals the last minus the middle.
    - (x + 10) − 2x = (3x + 2) − (x + 10).
    solution: 'Step 1: 10 − x = 2x − 8. Step 2: 3x = 18, so x = 6.'
    mistakes:
      '18': c10m5_next_minus
  - prompt: A salary starts at ₹5000 and rises by ₹200 each year. In which year does it reach ₹7000?
    answer: '11'
    check: '11'
    difficulty: 2
    hints:
    - 5000 + (n − 1)200 = 7000.
    - (n − 1) = 10.
    solution: 'Step 1: (n − 1)200 = 2000. Step 2: n − 1 = 10, so year 11.'
    mistakes:
      '10': c10m5_n_minus_one
  - prompt: The 17th term of an AP exceeds its 10th term by 7. Find d.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - a₁₇ − a₁₀ = 7d.
    - 7d = 7.
    solution: a₁₇ − a₁₀ = (a + 16d) − (a + 9d) = 7d = 7, so d = 1.
    mistakes:
      '7': c10m5_n_minus_one
  - prompt: Find d for the AP √2, 3√2, 5√2, … It is k√2; find k.
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - 3√2 − √2.
    - Subtract like terms.
    solution: d = 3√2 − √2 = 2√2, so k = 2.
    mistakes:
      '3': c10m5_next_minus
- code: cbse10m.ap.sum
  title: Sum of the first n terms
  after:
  - cbse10m.ap.nth
  notes: |
    The sum of the first n terms of an AP is Sₙ = n/2 [2a + (n − 1)d], or Sₙ = n/2 (a + l) where l is the
    last (nth) term. Gauss's trick: write the sum forwards and backwards; each pair adds to a + l, and there
    are n pairs, so 2Sₙ = n(a + l). The nth term can also be found as aₙ = Sₙ − Sₙ₋₁.
  explanations:
    text: 'To add 1 + 2 + … + 100, pair the first and last (1 + 100), the second and second-last (2 + 99), and so on: every pair makes 101, and there are 50 pairs, so the sum is 5050. For any AP: Sₙ = n/2 × (first + last) = n/2 [2a + (n − 1)d].'
    visual: 'Build the AP as a staircase of blocks, then put an identical staircase upside down on top of it. Together they make a rectangle n blocks long and (a + l) high. The staircase is half of it: n(a + l)/2.'
    step_by_step: 'Step 1: Find a, d and n. Step 2: If you know the last term l, use Sₙ = n/2 (a + l). Step 3: Otherwise use Sₙ = n/2 [2a + (n − 1)d]. Step 4: To find n from a sum, set up the equation and solve; n must be a positive whole number.'
    real_world: Saving ₹50 in the first week, ₹60 in the second, ₹70 in the third, and so on for a year of 52 weeks gives S₅₂ = 26 × (100 + 51 × 10) = ₹15,860.
  picture:
    kind: flow
    steps:
    - S = 1 + 2 + 3 + … + 100
    - 'Backwards: S = 100 + 99 + … + 1'
    - 'Add the two rows: each pair makes 101'
    - '100 pairs: 2S = 100 × 101'
    - S = 5050
    alt: 'Gauss''s trick for 1 + 2 + … + 100: write the sum forwards and backwards, each pair adds to 101, so twice the sum is 100 × 101 and the sum is 5050.'
  activity:
    type: formula
    prompt: 'For an AP, Sₙ = 3n² + n. The nth term is what the nth term adds: aₙ = Sₙ − Sₙ₋₁.'
    inputs:
    - name: n
      label: n
      min: 1
      max: 15
      step: 1
      start: 8
    outputs:
    - name: sn
      label: Sₙ
      expr: 3*n^2+n
    - name: sp
      label: Sₙ₋₁
      expr: 3*(n-1)^2+(n-1)
    - name: an
      label: aₙ = Sₙ − Sₙ₋₁
      expr: 6*n-2
    goals:
    - prompt: Which term of the AP is 28?
      want:
        an: 28
      hint: Each new term is the jump from Sₙ₋₁ to Sₙ.
      mistakes:
      - when:
          n: 3
        say: S₃ = 30 is the sum of the first three terms, not the 3rd term. aₙ is what Sₙ adds to Sₙ₋₁.
      - when:
          n:
          - 6
          - 15
        say: 'Too far along: the terms go up by 6 each time.'
    - prompt: Find the first term.
      want:
        an: 4
      mistakes:
      - when:
          n: 2
        say: a₂ = 14 − 4 = 10. The first term is S₁ itself, with nothing before it.
  lesson:
    - teach: 'To add 1 + 2 + … + 100, write it forwards and backwards and add: each pair makes 101, and there are 100 pairs, so twice the sum is 100 × 101 and the sum is 5050. In general, Sₙ = n/2 × (a + l), where l is the last term.'
      picture:
        kind: flow
        steps:
        - 1 + 2 + … + 100
        - 100 + 99 + … + 1
        - Each pair = 101
        - 100 pairs → 10100
        - Half → 5050
        alt: 'Gauss''s trick: writing the sum forwards and backwards, each pair makes 101, giving 5050.'
      check:
        prompt: Sum of 2 + 4 + 6 + … + 20 (10 terms)?
        options:
        - '110'
        - '220'
        - '100'
        answer: '110'
        why: 10/2 × (2 + 20) = 110.
    - teach: 'If you don''t know the last term, use Sₙ = n/2 [2a + (n − 1)d]. For 3, 7, 11, … the first 10 terms sum to 10/2 × (6 + 36) = 210. You can also get a term from sums: aₙ = Sₙ − Sₙ₋₁.'
      check:
        prompt: If S₅ = 40 and S₄ = 30, a₅ = ?
        options:
        - '10'
        - '70'
        - '8'
        answer: '10'
        why: a₅ = S₅ − S₄.
  items:
  - prompt: Find the sum 1 + 2 + 3 + … + 100.
    answer: '5050'
    check: 100*101/2
    difficulty: 1
    hints:
    - Sₙ = n/2 (first + last).
    - 50 × 101.
    solution: 'Step 1: n = 100, first 1, last 100. Step 2: S = 100/2 × 101 = 5050.'
    mistakes:
      '10100': c10_halve_sum
  - prompt: Find the sum of the first 10 terms of 2, 5, 8, …
    answer: '155'
    check: 10*(2*2 + 9*3)/2
    difficulty: 1
    hints:
    - Sₙ = n/2 [2a + (n − 1)d].
    - 5 × (4 + 27).
    solution: 'Step 1: a = 2, d = 3, n = 10. Step 2: S₁₀ = 5 × (4 + 9 × 3) = 5 × 31 = 155.'
    mistakes: {"29": "t10_sum_formula", "170": "c10_n_minus_1"}
  - prompt: Find the sum of the first 20 odd numbers.
    answer: '400'
    check: 20^2
    difficulty: 2
    hints:
    - '1 + 3 + 5 + …: a = 1, d = 2.'
    - S = 10 × (2 + 38).
    solution: 'Step 1: a = 1, d = 2, n = 20. Step 2: S = 10 × (2 + 19 × 2) = 10 × 40 = 400 (= 20²).'
    mistakes: {"39": "t10_sum_formula", "800": "c10_halve_sum"}
  - prompt: An AP has first term 5, last term 45 and 9 terms. Find their sum.
    answer: '225'
    check: 9*(5 + 45)/2
    difficulty: 2
    hints:
    - Sₙ = n/2 (a + l).
    - 9/2 × 50.
    solution: 'Step 1: S = 9/2 × (5 + 45) = 9/2 × 50 = 225.'
    mistakes: {"450": "c10_halve_sum", "50": "c10_halve_sum"}
  - prompt: You save ₹50 in week 1, ₹60 in week 2, ₹70 in week 3, and so on. How much have you saved after 12 weeks, in rupees?
    answer: '1260'
    check: 12*(2*50 + 11*10)/2
    difficulty: 2
    hints:
    - a = 50, d = 10, n = 12.
    - 6 × (100 + 110).
    solution: 'Step 1: S₁₂ = 12/2 × (2 × 50 + 11 × 10) = 6 × 210 = 1260.'
    mistakes: {"160": "t10_sum_formula", "1320": "c10_n_minus_1"}
  - prompt: How many terms of 3, 6, 9, … must be added to get 165?
    answer: '10'
    check: '10'
    difficulty: 3
    hints:
    - Sₙ = n/2 [6 + (n − 1)3] = 165.
    - 3n² + 3n = 330, so n² + n − 110 = 0.
    solution: 'Step 1: n/2 (6 + 3n − 3) = 165, so n(3n + 3) = 330. Step 2: n² + n − 110 = 0 = (n + 11)(n − 10). Step 3: n = 10.'
    mistakes:
      '-11': c10_reject_negative
  - prompt: Find the sum of the first 15 terms of 2, 7, 12, …
    answer: '555'
    check: 15 * (4 + 14 * 5) // 2
    difficulty: 2
    hints:
    - a = 2, d = 5, n = 15.
    - S = 15/2 × (4 + 70).
    solution: S₁₅ = 15/2 × [4 + 14 × 5] = 15/2 × 74 = 555.
    mistakes:
      '1110': c10m5_sum
      '72': c10m5_sum
  - prompt: Find the sum of all odd numbers from 1 to 49.
    answer: '625'
    check: 25 * 25
    difficulty: 2
    hints:
    - There are 25 odd numbers.
    - S = 25/2 × (1 + 49).
    solution: 'Step 1: n = 25. Step 2: S = 25/2 × 50 = 625.'
    mistakes:
      '1250': c10m5_sum
      '49': c10m5_count
  - prompt: Find the sum of the first 40 positive integers divisible by 6.
    answer: '4920'
    check: 40 * (6 + 240) // 2
    difficulty: 2
    hints:
    - 6, 12, …, 240.
    - S = 40/2 × (6 + 240).
    solution: S = 20 × 246 = 4920.
    mistakes:
      '9840': c10m5_sum
  - prompt: Sₙ = 3n² + 5n. Find the first term.
    answer: '8'
    check: 3 + 5
    difficulty: 2
    hints:
    - a₁ = S₁.
    - Put n = 1.
    solution: a₁ = S₁ = 3 + 5 = 8.
    mistakes:
      '3': c10m5_sum
      '5': c10m5_sum
  - prompt: Sₙ = 3n² + 5n. Find the common difference.
    answer: '6'
    check: (3*4 + 10) - 8 - 8
    difficulty: 3
    hints:
    - S₂ = 22, so a₂ = 22 − 8.
    - d = a₂ − a₁.
    solution: 'Step 1: S₂ = 12 + 10 = 22, a₂ = 22 − 8 = 14. Step 2: d = 14 − 8 = 6.'
    mistakes:
      '14': c10m5_next_minus
      '3': c10m5_sum
  - prompt: Find 34 + 32 + 30 + … + 10.
    answer: '286'
    check: 13 * (34 + 10) // 2
    difficulty: 2
    hints:
    - d = −2; count the terms first.
    - 34 + (n − 1)(−2) = 10 gives n = 13.
    solution: 'Step 1: n = 13. Step 2: S = 13/2 × (34 + 10) = 286.'
    mistakes:
      '572': c10m5_sum
      '264': c10m5_count
  - prompt: A ladder has rungs whose lengths decrease uniformly from 45 cm at the bottom to 25 cm at the top, with 11 rungs. Find the total length of wood for the rungs, in cm.
    answer: '385'
    check: 11 * (45 + 25) // 2
    difficulty: 2
    hints:
    - Sum of an AP with 11 terms.
    - First 45, last 25.
    solution: S = 11/2 × (45 + 25) = 11 × 35 = 385 cm.
    mistakes:
      '770': c10m5_sum
      '70': c10m5_sum
  - prompt: How many terms of 24, 21, 18, … give a sum of 78? Give the smaller answer.
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - n/2 [48 + (n − 1)(−3)] = 78.
    - n² − 17n + 52 = 0.
    solution: 'Step 1: (n − 4)(n − 13) = 0. Step 2: n = 4 or 13; both work because the extra terms after the 4th add to zero.'
    mistakes:
      '13': c10m5_count
  - prompt: Which formula gives the sum when you know the first and last terms?
    options:
    - Sₙ = n/2 (a + l)
    - Sₙ = a + (n − 1)d
    - Sₙ = n(a + l)
    - Sₙ = a × l
    answer: Sₙ = n/2 (a + l)
    difficulty: 1
    hints:
