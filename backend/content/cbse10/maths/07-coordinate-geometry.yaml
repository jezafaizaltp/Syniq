# CBSE Class 10 Mathematics (NCERT), chapter 7. Format: content/README.md.
subject: cbse10-math
chapter: 7
title: Coordinate Geometry
tips:
  c10_add_not_square: Don't just add the differences. Square each, add the squares, then take the square root.
  c10_minus_negative: 'Subtracting a negative adds: 5 − (−3) = 8.'
  c10_section_swap: 'In the section formula m₁ goes with the second point B and m₂ with A: (m₁x₂ + m₂x₁)/(m₁ + m₂).'
  c10_midpoint_half: 'The mid-point is the average of the two ends. Work backwards: B = 2 × mid-point − A.'
  t10_collinear_sum: "Find AB, BC and AC. The points are on one line if the two shorter distances add to the longest."
  t10_distance_origin: "Distance from the origin = √(x² + y²). Square both numbers, including the negative one."
  t10_equidistant: "A point on the x-axis is (x, 0). Set its squared distances to both points equal and solve."
  t10_midpoint_average: "Mid-point = average of the two ends: add the x-values (or y-values) and divide by 2."
  t10_section_ratio: "Use x = (kx₂ + x₁)/(k + 1) with the x-values, then solve for k."
  c10m7_square_then_add: Find the change in x and the change in y, square EACH, add them, then take the square root of the total.
  c10m7_minus_minus: 'Subtracting a negative coordinate adds: 3 − (−2) = 5. Write the brackets in before you square.'
  c10m7_ratio_order: 'In the section formula, m₁ goes with the SECOND point and m₂ with the FIRST: (m₁x₂ + m₂x₁)/(m₁ + m₂).'
  c10m7_average: 'The mid-point is the average of the two x''s and the average of the two y''s: add and halve.'
concepts:
- code: cbse10m.coord.distance
  title: Distance formula
  notes: |
    The distance between P(x₁, y₁) and Q(x₂, y₂) is PQ = √[(x₂ − x₁)² + (y₂ − y₁)²], from Pythagoras' theorem
    on the right triangle with legs |x₂ − x₁| and |y₂ − y₁|. The distance of P(x, y) from the origin is
    √(x² + y²). Uses: checking collinearity, types of triangles and quadrilaterals, equidistant points.
  explanations:
    text: To find the distance between two points, draw the right triangle with them at the ends of the slanted side. Its legs are the change in x and the change in y, so the distance is √(change in x² + change in y²).
    visual: Plot (1, 2) and (4, 6). Draw a line across from (1, 2) to (4, 2), then up to (4, 6). The legs are 3 and 4, so the slanted side is 5.
    step_by_step: 'Step 1: Subtract the x-coordinates and square. Step 2: Subtract the y-coordinates and square. Step 3: Add the squares. Step 4: Take the square root.'
    real_world: 'A delivery app works out the straight-line distance between your house at (2, 3) km and the shop at (5, 7) km on its map: √(9 + 16) = 5 km.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 7
    points:
      P(1, 2):
      - 1
      - 2
      Q(4, 6):
      - 4
      - 6
      _R:
      - 4
      - 2
    segments:
    - - P(1, 2)
      - _R
      - '3'
    - - _R
      - Q(4, 6)
      - '4'
    - - P(1, 2)
      - Q(4, 6)
      - '5'
    caption: PQ = √(3² + 4²) = √25 = 5.
    alt: Points P(1, 2) and Q(4, 6) on axes joined by a slanted line, with a right triangle of legs 3 across and 4 up, so PQ = 5.
  activity:
    type: graph
    mode: point
    range:
    - -8
    - 8
    prompt: Use the distance formula PQ = √((x₂ − x₁)² + (y₂ − y₁)²). Move the point.
    goals:
    - prompt: Find the point on the x-axis that is the same distance from A(2, −5) and B(−2, 9).
      x: -7
      y: 0
      hint: On the x-axis, P = (x, 0). Set PA² = PB² and solve for x.
      mistakes:
      - when:
          x: 0
          y: 2
        say: '(0, 2) is the midpoint of AB. It is equally far from both, but it isn''t on the x-axis: there y = 0.'
      - when:
          x: 7
          y: 0
        say: 'At (7, 0), PA² = 25 + 25 = 50 but PB² = 81 + 81 = 162: not equal. Check the signs when you square (x + 2).'
      - when:
          x: 0
          y: 0
        say: The origin is √29 from A and √85 from B. Slide along the x-axis until they match.
    - prompt: Plot a point with y = 4 that is 5 units from the origin, in Quadrant II.
      x: -3
      y: 4
      mistakes:
      - when:
          x: 3
          y: 4
        say: (3, 4) is 5 from the origin, but it's in Quadrant I. Quadrant II has negative x.
      - when:
          x: -1
          y: 4
        say: 1 + 4 = 5 adds the moves, but the distance is √(1 + 16) ≈ 4.1. Use x² + 4² = 5².
  lesson:
    - teach: 'The distance between P(x₁, y₁) and Q(x₂, y₂) comes from Pythagoras: draw the right triangle with a horizontal leg x₂ − x₁ and a vertical leg y₂ − y₁. So PQ = √[(x₂ − x₁)² + (y₂ − y₁)²].'
      picture:
        kind: geometry
        axes: true
        range:
        - -1
        - 8
        points:
          P:
          - 1
          - 1
          Q:
          - 7
          - 5
          _R:
          - 7
          - 1
        segments:
        - - P
          - Q
        - - P
          - _R
        - - _R
          - Q
        alt: Points P(1, 1) and Q(7, 5) joined, with a right triangle showing horizontal leg 6 and vertical leg 4.
      check:
        prompt: For P(1, 1) and Q(7, 5), the legs are…
        options:
        - 6 and 4
        - 8 and 6
        - 1 and 5
        answer: 6 and 4
        why: 7 − 1 = 6 and 5 − 1 = 4.
    - teach: So PQ = √(36 + 16) = √52 = 2√13. From the origin, the distance to (x, y) is √(x² + y²). Distances help to check collinearity (the two shorter distances add to the longest) and to classify triangles and quadrilaterals.
      check:
        prompt: Distance of (5, 12) from the origin?
        options:
        - '13'
        - '17'
        - '7'
        answer: '13'
        why: √(25 + 144) = 13.
  items:
  - prompt: Find the distance between (1, 2) and (4, 6).
    answer: '5'
    check: sqrt((4-1)^2 + (6-2)^2)
    difficulty: 1
    hints:
    - √[(4 − 1)² + (6 − 2)²].
    - √(9 + 16).
    solution: 'Step 1: Differences 3 and 4. Step 2: √(9 + 16) = √25 = 5.'
    mistakes:
      '7': c10_add_not_square
  - prompt: Find the distance of (6, −8) from the origin.
    answer: '10'
    check: sqrt(6^2 + 8^2)
    difficulty: 1
    hints:
    - √(x² + y²).
    - √(36 + 64).
    solution: 'Step 1: √(6² + (−8)²) = √100 = 10.'
    mistakes: {"2": "t10_distance_origin", "14": "c10_add_not_square"}
  - prompt: Find the distance between (−3, 2) and (5, −4).
    answer: '10'
    check: sqrt(8^2 + 6^2)
    difficulty: 2
    hints:
    - Differences 8 and −6.
    - √(64 + 36).
    solution: 'Step 1: x: 5 − (−3) = 8; y: −4 − 2 = −6. Step 2: √(64 + 36) = 10.'
    mistakes:
      '2': c10_minus_negative
  - prompt: Are A(1, 5), B(2, 3) and C(−2, 11) collinear?
    options:
    - 'Yes'
    - 'No'
    - Only A and B
    - Can't tell
    answer: 'Yes'
    difficulty: 2
    hints:
    - Find AB, BC and AC.
    - Does the longest equal the sum of the other two?
    solution: 'Step 1: AB = √5, BC = √80 = 4√5, AC = √45 = 3√5. Step 2: AB + AC = 4√5 = BC, so the points lie on one line.'
    mistakes: {"No": "t10_collinear_sum", "Can't tell": "t10_collinear_sum"}
  - prompt: Find x if the distance between (x, 3) and (2, −1) is 5 and x > 2.
    answer: '5'
    check: 2 + 3
    difficulty: 3
    hints:
    - (x − 2)² + 16 = 25.
    - (x − 2)² = 9.
    solution: 'Step 1: (x − 2)² + 4² = 25. Step 2: (x − 2)² = 9, so x − 2 = ±3. Step 3: x > 2 gives x = 5.'
    mistakes:
      '-1': c10_reject_negative
  - prompt: Find the point on the x-axis equidistant from (2, −5) and (−2, 9). Give its x-coordinate.
    answer: '-7'
    check: -56/8
    difficulty: 3
    hints:
    - The point is (x, 0).
    - (x − 2)² + 25 = (x + 2)² + 81.
    solution: 'Step 1: (x − 2)² + 25 = (x + 2)² + 81. Step 2: −4x + 29 = 4x + 85, so −8x = 56. Step 3: x = −7.'
    mistakes: {"7": "c10_minus_negative", "0": "t10_equidistant"}
  - prompt: Find the distance between (2, 3) and (10, −3).
    answer: '10'
    check: ((10-2)**2 + (-3-3)**2) ** 0.5
    difficulty: 1
    hints:
    - 'Changes: 8 and −6.'
    - √(64 + 36).
    solution: √(8² + 6²) = √100 = 10.
    mistakes:
      '14': c10m7_square_then_add
      '8': c10m7_minus_minus
  - prompt: Find the distance between (−5, 7) and (−1, 3). It is k√2; find k.
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - 'Changes: 4 and −4.'
    - √32 = 4√2.
    solution: √(16 + 16) = √32 = 4√2, so k = 4.
    mistakes:
      '8': c10m7_square_then_add
      '32': c10m7_square_then_add
  - prompt: Do (0, 0), (3, 0) and (0, 4) form a right triangle? Type the length of the longest side.
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Two sides are 3 and 4.
    - Third side from (3, 0) to (0, 4).
    solution: Sides 3, 4 and √(9 + 16) = 5; 3² + 4² = 5², so yes.
    mistakes:
      '7': c10m7_square_then_add
  - prompt: Find y if the distance between (2, y) and (2, 5) is 3 and y > 5.
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Same x, so distance = |y − 5|.
    - y − 5 = 3.
    solution: y − 5 = 3, so y = 8.
    mistakes:
      '2': c10m7_minus_minus
  - prompt: A(1, 1), B(4, 1), C(4, 5), D(1, 5). What shape is ABCD?
    options:
    - Rectangle
    - Square
    - Rhombus
    - Trapezium only
    answer: Rectangle
    difficulty: 2
    hints:
    - AB = 3 and BC = 4.
    - Diagonals AC and BD both 5.
    solution: 'Opposite sides 3 and 4, diagonals equal (5): a rectangle, not a square.'
    mistakes:
      Square: c10m7_square_then_add
  - prompt: Are (1, 1), (2, 2) and (4, 4) collinear?
    options:
    - 'Yes'
    - 'No'
    - Only two of them
    - Cannot tell
    answer: 'Yes'
    difficulty: 2
    hints:
    - 'Distances: √2, 2√2, 3√2.'
    - Do two add to the third?
    solution: √2 + 2√2 = 3√2, so the points are collinear (all on y = x).
    mistakes:
      'No': c10m7_square_then_add
  - prompt: Find the point on the y-axis equidistant from (6, 5) and (−4, 3). Give its y-coordinate.
    answer: '9'
    check: '9'
    difficulty: 3
    hints:
    - Point (0, y).
    - 36 + (y − 5)² = 16 + (y − 3)².
    solution: 'Step 1: 36 + y² − 10y + 25 = 16 + y² − 6y + 9. Step 2: 61 − 10y = 25 − 6y, so 4y = 36, y = 9.'
    mistakes:
      '-9': c10m7_minus_minus
  - prompt: What is the distance between (a, b) and (−a, −b)?
    options:
    - 2√(a² + b²)
    - √(a² + b²)
    - 2(a + b)
    - '0'
    answer: 2√(a² + b²)
    difficulty: 3
    hints:
    - 'Changes: −2a and −2b.'
    - √(4a² + 4b²).
    solution: √(4a² + 4b²) = 2√(a² + b²).
    mistakes:
      √(a² + b²): c10m7_minus_minus
      '0': c10m7_minus_minus
  - prompt: Find the distance of (−6, 8) from the origin.
    answer: '10'
    check: '10'
    difficulty: 1
    hints:
    - √(x² + y²).
    - 36 + 64.
    solution: √(36 + 64) = √100 = 10.
    mistakes:
      '2': c10m7_square_then_add
      '14': c10m7_square_then_add
- code: cbse10m.coord.section
  title: Section formula
  after:
  - cbse10m.coord.distance
  notes: |
    The point P dividing the join of A(x₁, y₁) and B(x₂, y₂) internally in the ratio m₁ : m₂ is
    ((m₁x₂ + m₂x₁)/(m₁ + m₂), (m₁y₂ + m₂y₁)/(m₁ + m₂)). The mid-point is ((x₁ + x₂)/2, (y₁ + y₂)/2). Points
    of trisection divide a segment in 1 : 2 and 2 : 1. To find the ratio in which a point divides a segment,
    take k : 1 and solve.
  explanations:
    text: 'The section formula finds the point that splits a line in a given ratio. For m : n from A to B, each coordinate is (m × B''s coordinate + n × A''s coordinate) ÷ (m + n). Note the cross-over: m goes with B. The mid-point is the special case 1 : 1, simply the average.'
    visual: 'Draw a segment from A(1, 2) to B(7, 8) and mark it into 3 equal parts. The point one part from A divides AB in 1 : 2, at (3, 4); the point two parts from A, at (5, 6), divides it in 2 : 1.'
    step_by_step: 'Step 1: Write A(x₁, y₁), B(x₂, y₂) and the ratio m₁ : m₂ (from A). Step 2: x = (m₁x₂ + m₂x₁)/(m₁ + m₂). Step 3: y = (m₁y₂ + m₂y₁)/(m₁ + m₂). Step 4: Check that the point lies between A and B.'
    real_world: 'A metro line runs straight from station A to station B. Planners want a new station a third of the way from A: the section formula with ratio 1 : 2 gives its map position.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 9
    points:
      A(1, 2):
      - 1
      - 2
      P(3, 4):
      - 3
      - 4
      Q(5, 6):
      - 5
      - 6
      B(7, 8):
      - 7
      - 8
    segments:
    - - A(1, 2)
      - B(7, 8)
    caption: 'P divides AB in 1 : 2 and Q in 2 : 1: they are the points of trisection.'
    alt: A segment from A(1, 2) to B(7, 8) on axes, with points P(3, 4) and Q(5, 6) splitting it into three equal parts.
  activity:
    type: graph
    mode: point
    range:
    - -8
    - 8
    prompt: 'A point dividing AB in m : n is ((m·x₂ + n·x₁)/(m + n), (m·y₂ + n·y₁)/(m + n)). Move the point.'
    goals:
    - prompt: 'Plot P dividing A(−1, 7) and B(4, −3) in the ratio 2 : 3.'
      x: 1
      y: 3
      hint: '2 : 3 means 5 equal parts, P is 2 parts from A. A to B is 5 across and 10 down.'
      mistakes:
      - when:
          x: 2
          y: 1
        say: 'That divides AB in 3 : 2, nearer B. 2 : 3 means P is 2 parts from A and 3 from B: nearer A.'
    - prompt: Plot the point of trisection of A(2, −2) and B(−7, 4) nearer to A.
      x: -1
      y: 0
      mistakes:
      - when:
          x: -4
          y: 2
        say: 'That''s 2/3 of the way, the trisection point nearer B. Nearer A is 1 : 2.'
  lesson:
    - teach: 'The mid-point of A(x₁, y₁) and B(x₂, y₂) is ((x₁ + x₂)/2, (y₁ + y₂)/2): the average of the x''s and of the y''s. For (2, 3) and (8, 9) it is (5, 6).'
      check:
        prompt: Mid-point of (−4, 2) and (6, 8)?
        options:
        - (1, 5)
        - (5, 1)
        - (2, 10)
        answer: (1, 5)
        why: (−4 + 6)/2 = 1 and (2 + 8)/2 = 5.
    - teach: 'Section formula: the point dividing AB internally in the ratio m₁ : m₂ is ((m₁x₂ + m₂x₁)/(m₁ + m₂), (m₁y₂ + m₂y₁)/(m₁ + m₂)). Note the crossing: m₁ multiplies the coordinate of B. Points of trisection divide AB in 1 : 2 and 2 : 1.'
      picture:
        kind: number_line
        from: 0
        to: 9
        step: 1
        points:
        - at: 0
          label: A
        - at: 3
          label: '1 : 2'
        - at: 6
          label: '2 : 1'
        - at: 9
          label: B
        alt: A segment from A to B split into three equal parts by the two points of trisection.
      check:
        prompt: 'A(0, 0), B(9, 0). Point dividing AB in 1 : 2?'
        options:
        - (3, 0)
        - (6, 0)
        - (4.5, 0)
        answer: (3, 0)
        why: (1 × 9 + 2 × 0)/3 = 3.
  items:
  - prompt: Find the x-coordinate of the mid-point of (2, 5) and (8, 1).
    answer: '5'
    check: (2 + 8)/2
    difficulty: 1
    hints:
    - Average the x-coordinates.
    - (2 + 8)/2.
    solution: 'Step 1: (2 + 8)/2 = 5. (The mid-point is (5, 3).)'
    mistakes: {"10": "t10_midpoint_average", "3": "t10_midpoint_average"}
  - prompt: Find the y-coordinate of the mid-point of (2, 5) and (8, 1).
    answer: '3'
    check: (5 + 1)/2
    difficulty: 1
    hints:
    - Average the y-coordinates.
    - (5 + 1)/2.
    solution: (5 + 1)/2 = 3.
    mistakes: {"6": "t10_midpoint_average", "2": "t10_midpoint_average"}
  - prompt: 'P divides the join of A(1, 2) and B(7, 8) in the ratio 1 : 2. Find the x-coordinate of P.'
    answer: '3'
    check: (1*7 + 2*1)/3
    difficulty: 2
    hints:
    - x = (1 × 7 + 2 × 1)/(1 + 2).
    - 9/3.
    solution: 'Step 1: x = (1 × 7 + 2 × 1)/3 = 9/3 = 3. (y = (8 + 4)/3 = 4.)'
    mistakes:
      '5': c10_section_swap
  - prompt: 'Find the y-coordinate of the point dividing (−1, 7) and (4, −3) in the ratio 2 : 3.'
    answer: '3'
    check: (2*(-3) + 3*7)/5
    difficulty: 2
    hints:
    - y = (2 × (−3) + 3 × 7)/5.
    - (−6 + 21)/5.
    solution: 'Step 1: y = (2(−3) + 3(7))/5 = 15/5 = 3. (x = (8 − 3)/5 = 1.)'
    mistakes:
      '1': c10_section_swap
  - prompt: The mid-point of AB is (3, 4) and A is (1, 2). Find the x-coordinate of B.
    answer: '5'
    check: 2*3 - 1
    difficulty: 2
    hints:
    - (1 + x)/2 = 3.
    - 1 + x = 6.
    solution: 'Step 1: (1 + x)/2 = 3, so x = 5. (B is (5, 6).)'
    mistakes:
      '2': c10_midpoint_half
  - prompt: 'In what ratio k : 1 does the point (−4, 6) divide the join of (−6, 10) and (3, −8)? Give k as a fraction like 2/7.'
    answer: 2/7
    check: 2/7
    difficulty: 3
    hints:
    - 'Use x: −4 = (3k − 6)/(k + 1).'
    - −4k − 4 = 3k − 6.
    solution: 'Step 1: −4(k + 1) = 3k − 6. Step 2: −7k = −2, so k = 2/7. The ratio is 2 : 7.'
    mistakes: {"7/2": "c10_section_swap", "2": "t10_section_ratio"}
  - prompt: 'Find the x-coordinate of the point dividing (4, −3) and (8, 5) in the ratio 3 : 1.'
    answer: '7'
    check: (3*8 + 1*4) / 4
    difficulty: 2
    hints:
    - x = (m₁x₂ + m₂x₁)/(m₁ + m₂).
    - (3 × 8 + 1 × 4)/4.
    solution: x = (24 + 4)/4 = 7.
    mistakes:
      '5': c10m7_ratio_order
      '6': c10m7_average
  - prompt: 'Find the y-coordinate of the same point (dividing (4, −3) and (8, 5) in 3 : 1).'
    answer: '3'
    check: (3*5 + 1*(-3)) / 4
    difficulty: 2
    hints:
    - (3 × 5 + 1 × (−3))/4.
    - 15 − 3 = 12.
    solution: y = (15 − 3)/4 = 3.
    mistakes:
      '-1': c10m7_ratio_order
      '1': c10m7_average
  - prompt: The mid-point of (x, 4) and (6, −2) is (5, 1). Find x.
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - (x + 6)/2 = 5.
    - x + 6 = 10.
    solution: x + 6 = 10, so x = 4.
    mistakes:
      '10': c10m7_average
      '16': c10m7_average
  - prompt: Find the points of trisection of (2, −2) and (−7, 4). Give the x-coordinate of the one nearer (2, −2).
    answer: '-1'
    check: (1*(-7) + 2*2) / 3
    difficulty: 2
    hints:
    - 'Nearer A means ratio 1 : 2.'
    - (1 × (−7) + 2 × 2)/3.
    solution: x = (−7 + 4)/3 = −1. (The point is (−1, 0).)
    mistakes:
      '-4': c10m7_ratio_order
  - prompt: 'In what ratio does the x-axis divide the join of (1, −5) and (−4, 5)? Type it as k for k : 1.'
    answer: '1'
    check: '1'
    difficulty: 3
    hints:
    - On the x-axis, y = 0.
    - (5k − 5)/(k + 1) = 0.
    solution: '5k − 5 = 0, so k = 1: the ratio is 1 : 1 (the mid-point).'
    mistakes:
      '5': c10m7_ratio_order
  - prompt: (1, 2), (4, y), (x, 6) and (3, 5) are vertices of a parallelogram in order. Find x using equal mid-points of the diagonals.
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - 'Diagonals: (1, 2)–(x, 6) and (4, y)–(3, 5).'
    - (1 + x)/2 = (4 + 3)/2.
    solution: 'Diagonals bisect each other: 1 + x = 7, so x = 6. (Also 2 + 6 = y + 5 gives y = 3.)'
    mistakes:
      '7': c10m7_average
  - prompt: Find the mid-point of (−2, −3) and (4, −7).
    options:
    - (1, −5)
    - (3, −5)
    - (1, 2)
    - (−3, 5)
    answer: (1, −5)
    difficulty: 1
    hints:
    - 'Average the x''s: (−2 + 4)/2.'
    - 'Average the y''s: (−3 − 7)/2.'
    solution: (2/2, −10/2) = (1, −5).
    mistakes:
      (3, −5): c10m7_minus_minus
      (1, 2): c10m7_minus_minus
  - prompt: 'A is (3, 0) and B is (9, 6). P divides AB in 2 : 1. Find the y-coordinate of P.'
