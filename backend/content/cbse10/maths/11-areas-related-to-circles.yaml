# CBSE Class 10 Mathematics (NCERT), chapter 11. Format: content/README.md.
subject: cbse10-math
chapter: 11
title: Areas Related to Circles
tips:
  c10_arc_not_area: That is the arc length. Area uses πr², not 2πr.
  c10_area_not_arc: That is the sector's area. Arc length uses 2πr, not πr².
  c10_major_minor: 'That is the minor (smaller) sector. The major sector is the rest: whole circle minus minor.'
  c10_perimeter_radii: The perimeter of a sector is the arc plus the two straight radii.
  c10_subtract_triangle: That is the whole sector. Take away the triangle to leave the segment.
  c10_radius_diameter: Use the radius, half the diameter, in πr².
  t10_clock_angle: "The minute hand turns 360° in 60 minutes. Find the angle for 5 minutes first, then take that fraction of πr²."
  t10_composite_area: "Add the rectangle and the semicircle. A semicircle is half of πr² with r = half of 7."
  t10_sector_fraction: "Sector area = (θ/360) × πr². What fraction of the whole circle is 50π?"
  t10_segment_def: "A segment is cut off by a chord. A sector is cut off by two radii."
  t10_square_minus_circle: "Area outside the circle = square area − circle area. The circle's diameter is the square's side."
  c10m11_fraction: A sector is the fraction θ/360 of the whole circle. Work out that fraction first, then take it of πr² (area) or 2πr (arc).
  c10m11_area_vs_arc: Area uses πr² and is in square units. Arc length uses 2πr and is in plain units. Which one does the question want?
  c10m11_perimeter: A sector's boundary is the arc plus two radii. Did you add both radii?
  c10m11_segment: Segment = sector − triangle. Find the sector first, then take away the triangle made by the two radii and the chord.
  c10m11_major: The major part is the whole circle minus the minor part.
concepts:
- code: cbse10m.area.sector
  title: Arcs and sectors
  notes: |
    For a circle of radius r and a sector with angle θ (in degrees) at the centre: length of the arc =
    (θ/360) × 2πr; area of the sector = (θ/360) × πr². A minor sector has θ < 180°; the major sector is the
    rest, area πr² − minor sector. Use π = 22/7 or 3.14 as told.
  explanations:
    text: 'A sector is a slice of a circle, like a slice of pizza. Its angle at the centre tells you what fraction of the circle it is: θ/360. So its area is that fraction of πr², and its curved edge (the arc) is that fraction of the circumference 2πr.'
    visual: Draw a clock face. From 12 to 3 the minute hand sweeps 90°, a quarter of the circle. The shaded slice is 90/360 = 1/4 of the whole area, and the rim from 12 to 3 is a quarter of the circumference.
    step_by_step: 'Step 1: Find the fraction θ/360. Step 2: Area of sector = fraction × πr². Step 3: Arc length = fraction × 2πr. Step 4: Major sector = whole circle − minor sector.'
    real_world: The windscreen wiper of a car sweeps a sector. A wiper 25 cm long turning through 115° cleans (115/360) × π × 25² ≈ 627 cm² of glass.
  picture:
    kind: geometry
    points:
      O:
      - 5
      - 5
      A:
      - 9
      - 5
      B:
      - 5
      - 9
    circles:
    - centre: O
      radius: 4
    segments:
    - - O
      - A
      - r
    - - O
      - B
      - r
    angles:
    - at: O
      from: A
      to: B
      label: 90°
    caption: 'A 90° sector is 90/360 = 1/4 of the circle: area πr²/4, arc 2πr/4.'
    alt: A circle with centre O and two radii OA and OB at 90° to each other, marking off a quarter-circle sector.
  activity:
    type: formula
    prompt: A sector of radius r and angle θ. Arc = (θ/360) × 2πr; area = (θ/360) × πr².
    inputs:
    - name: r
      label: Radius r
      min: 1
      max: 21
      step: 1
      start: 1
      unit: cm
    - name: t
      label: Angle θ
      min: 0
      max: 360
      step: 5
      start: 0
      unit: °
    outputs:
    - name: arc
      label: Arc length
      expr: t/360*2*pi*r
      unit: cm
      places: 2
    - name: minor
      label: Sector area
      expr: t/360*pi*r^2
      unit: cm²
      places: 2
    - name: major
      label: The rest of the circle
      expr: (360-t)/360*pi*r^2
      unit: cm²
      places: 2
    goals:
    - prompt: A clock's minute hand is 14 cm long. Find the area it sweeps in 5 minutes.
      want:
        r: 14
        minor:
        - 51
        - 51.5
      hint: The hand turns 360° in 60 minutes. How many degrees in 5 minutes?
      mistakes:
      - when:
          r: 14
          t: 5
        say: '5 minutes isn''t 5°. The minute hand turns 360° in 60 minutes: 6° every minute.'
      - when:
          r: 14
          t: 60
        say: '60° is 10 minutes of turning: the hand goes 6° a minute.'
    - prompt: A 21 cm pendulum swings through an arc 22 cm long. Find the angle.
      want:
        r: 21
        arc:
        - 21.9
        - 22.1
      mistakes:
      - when:
          r: 21
          t: 20
        say: The arc is a length, not an angle. θ/360 of the whole edge (2π × 21 ≈ 132 cm) must be 22 cm.
      - when:
          r: 21
          t: 120
        say: 120° sweeps a third of the edge, 44 cm. 22 cm is a sixth.
  lesson:
    - teach: 'A sector is a slice of a circle cut by two radii, like a slice of pizza. The angle θ at the centre tells you what fraction of the circle it is: θ/360. A 90° sector is a quarter, a 60° sector is a sixth.'
      picture:
        kind: bars
        unit: degrees out of 360
        bars:
        - label: 90° sector
          value: 90
        - label: 60° sector
          value: 60
        - label: whole circle
          value: 360
        alt: Bars comparing a 90° sector, a 60° sector and the whole circle of 360°, showing that 90° is a quarter and 60° is a sixth.
      check:
        prompt: What fraction of the circle is a 120° sector?
        options:
        - 1/3
        - 1/4
        - 1/2
        answer: 1/3
        why: 120/360 = 1/3.
    - teach: 'Area of a sector = (θ/360) × πr². Arc length = (θ/360) × 2πr. Example: r = 7 cm, θ = 90°: area = 1/4 × 22/7 × 49 = 38.5 cm², arc = 1/4 × 2 × 22/7 × 7 = 11 cm.'
      check:
        prompt: r = 14 cm, θ = 180°. Arc length? (π = 22/7)
        options:
        - 44 cm
        - 88 cm
        - 308 cm
        answer: 44 cm
        why: Half of 2 × 22/7 × 14 = 88, so 44 cm.
    - teach: 'The rest of the circle is the major sector: πr² minus the minor sector. A sector''s perimeter is its arc plus two radii.'
      check:
        prompt: Minor sector 30 cm², circle 154 cm². Major sector?
        options:
        - 124 cm²
        - 184 cm²
        - 30 cm²
        answer: 124 cm²
        why: 154 − 30 = 124.
  items:
  - prompt: Find the area of a sector of angle 90° in a circle of radius 14 cm. Use π = 22/7. Answer in cm².
    answer: '154'
    check: Rational(90, 360)*Rational(22, 7)*14**2
    difficulty: 1
    hints:
    - Area = (90/360) × πr².
    - 1/4 × 22/7 × 196.
    solution: 'Step 1: Fraction = 1/4. Step 2: Area = 1/4 × 22/7 × 14 × 14 = 154 cm².'
    mistakes:
      '22': c10_arc_not_area
  - prompt: Find the length of the arc of a 60° sector of a circle of radius 21 cm. Use π = 22/7. Answer in cm.
    answer: '22'
    check: Rational(60, 360)*2*Rational(22, 7)*21
    difficulty: 1
    hints:
    - Arc = (60/360) × 2πr.
    - 1/6 × 2 × 22/7 × 21.
    solution: 'Step 1: Fraction = 1/6. Step 2: Arc = 1/6 × 2 × 22/7 × 21 = 22 cm.'
    mistakes:
      '231': c10_area_not_arc
  - prompt: The minute hand of a clock is 14 cm long. Find the area it sweeps in 5 minutes, in cm². Use π = 22/7. Type a fraction or decimal.
    answer: 154/3
    check: Rational(30, 360)*Rational(22, 7)*14**2
    difficulty: 2
    hints:
    - In 5 minutes it turns 30°.
    - (30/360) × 22/7 × 196.
    solution: 'Step 1: 60 minutes = 360°, so 5 minutes = 30°. Step 2: Area = 1/12 × 22/7 × 196 = 154/3 ≈ 51.33 cm².'
    mistakes: {"616": "t10_clock_angle", "22/3": "c10_arc_not_area"}
  - prompt: A circle of radius 7 cm has a minor sector of 90°. Find the area of the major sector in cm². Use π = 22/7. Type a decimal.
    answer: '115.5'
    check: Rational(270, 360)*Rational(22, 7)*49
    difficulty: 2
    hints:
    - Major = whole − minor.
    - Whole = 154; minor = 38.5.
    solution: 'Step 1: Whole area = 22/7 × 49 = 154. Step 2: Minor = 154/4 = 38.5. Step 3: Major = 154 − 38.5 = 115.5 cm².'
    mistakes:
      '38.5': c10_major_minor
  - prompt: A sector of a circle of radius 10 cm has area 50π cm². Find its angle in degrees.
    answer: '180'
    check: 360*50/100
    difficulty: 3
    hints:
    - (θ/360) × π × 100 = 50π.
    - θ/360 = 1/2.
    solution: 'Step 1: (θ/360) × 100π = 50π. Step 2: θ/360 = 1/2, so θ = 180°: a semicircle.'
    mistakes: {"90": "t10_sector_fraction", "360": "t10_sector_fraction"}
  - prompt: Find the perimeter of a quadrant (90° sector) of a circle of radius 14 cm, in cm. Use π = 22/7.
    answer: '50'
    check: Rational(1, 4)*2*Rational(22, 7)*14 + 28
    difficulty: 3
    hints:
    - Perimeter = arc + 2 radii.
    - Arc = 1/4 × 2 × 22/7 × 14 = 22.
    solution: 'Step 1: Arc = 22 cm. Step 2: Perimeter = 22 + 14 + 14 = 50 cm.'
    mistakes:
      '22': c10_perimeter_radii
  - prompt: Find the area of a 60° sector of a circle of radius 6 cm, as kπ cm². Find k.
    answer: '6'
    check: 60 / 360 * 36
    difficulty: 2
    hints:
    - 60° is one sixth of the circle.
    - 'Whole circle: 36π.'
    solution: Area = (1/6) × 36π = 6π cm², so k = 6.
    mistakes:
      '36': c10m11_fraction
      '2': c10m11_area_vs_arc
  - prompt: Find the arc length of a 90° sector of a circle of radius 14 cm, in cm. Use π = 22/7.
    answer: '22'
    check: 90 / 360 * 2 * 22 / 7 * 14
    difficulty: 2
    hints:
    - 90° is a quarter.
    - Circumference = 2 × 22/7 × 14 = 88.
    solution: Arc = 88 ÷ 4 = 22 cm.
    mistakes:
      '154': c10m11_area_vs_arc
      '88': c10m11_fraction
  - prompt: Find the area of a 120° sector of a circle of radius 3 cm, as kπ cm². Find k.
    answer: '3'
    check: 120 / 360 * 9
    difficulty: 2
    hints:
    - 120° is a third.
    - πr² = 9π.
    solution: Area = 9π ÷ 3 = 3π, so k = 3.
    mistakes:
      '9': c10m11_fraction
      '2': c10m11_area_vs_arc
  - prompt: Find the perimeter of a 90° sector of radius 7 cm, in cm. Use π = 22/7.
    answer: '25'
    check: 90 / 360 * 2 * 22 / 7 * 7 + 14
    difficulty: 2
    hints:
    - Arc = quarter of 44.
    - Then add both radii.
    solution: Arc = 11 cm. Perimeter = 11 + 7 + 7 = 25 cm.
    mistakes:
      '11': c10m11_perimeter
      '18': c10m11_perimeter
  - prompt: An arc of a circle of radius 10 cm is 5π cm long. Find the angle at the centre, in degrees.
    answer: '90'
    check: 5 / 20 * 360
    difficulty: 3
    hints:
    - Circumference = 20π.
    - What fraction of 20π is 5π?
    solution: 5π/20π = 1/4, so θ = 360° ÷ 4 = 90°.
    mistakes:
      '45': c10m11_area_vs_arc
      '180': c10m11_fraction
  - prompt: A circle has radius 6 cm. Its minor sector has angle 60°. Find the major sector's area as kπ cm². Find k.
    answer: '30'
    check: 300 / 360 * 36
    difficulty: 3
    hints:
    - The major sector's angle is 360° − 60°.
    - 'Or: whole 36π minus 6π.'
    solution: Major = 36π − 6π = 30π cm², so k = 30.
    mistakes:
      '6': c10m11_major
      '36': c10m11_major
  - prompt: A cow is tied with a 14 m rope at a corner of a big square field. Over what area can it graze, in m²? Use π = 22/7.
    answer: '154'
    check: 90 / 360 * 22 / 7 * 14 * 14
    difficulty: 3
    hints:
    - At a corner, the cow sweeps a 90° sector.
    - Quarter of 22/7 × 196.
    solution: Area = 1/4 × 616 = 154 m².
    mistakes:
      '616': c10m11_fraction
      '22': c10m11_area_vs_arc
  - prompt: Doubling the radius of a sector (same angle) does what to its area?
    options:
    - Makes it 4 times as big
    - Doubles it
    - Leaves it the same
    - Halves it
    answer: Makes it 4 times as big
    difficulty: 2
    hints:
    - Area has r².
    - (2r)² = ?
    solution: Area depends on r², and (2r)² = 4r², so it becomes 4 times as big.
    mistakes:
      Doubles it: c10m11_area_vs_arc
  - prompt: Which formula gives the length of an arc with angle θ in a circle of radius r?
    options:
    - (θ/360) × 2πr
    - (θ/360) × πr²
    - θ × r
    - (360/θ) × 2πr
    answer: (θ/360) × 2πr
    difficulty: 1
    hints:
    - Length is part of the circumference.
    - Circumference = 2πr.
    solution: An arc is the fraction θ/360 of the circumference 2πr.
    mistakes:
      (θ/360) × πr²: c10m11_area_vs_arc
      (360/θ) × 2πr: c10m11_fraction
- code: cbse10m.area.segment
  title: Segments and combined shapes
  after:
  - cbse10m.area.sector
  notes: |
    A segment is the region between a chord and its arc. Area of minor segment = area of sector − area of the
    triangle formed by the two radii and the chord. For θ = 90°, the triangle is right-angled with area r²/2;
    for θ = 60°, it is equilateral with area (√3/4)r². Areas of combined plane figures: split into rectangles,
    triangles, semicircles, sectors, and add or subtract.
  explanations:
    text: A segment is the curved sliver between a chord and the circle. Its area is the slice (sector) minus the triangle inside it. Combined shapes, like a running track or a flower bed, are just simpler shapes added together or cut away.
    visual: Draw a 90° sector and shade the triangle formed by the two radii and the chord. The part of the sector left unshaded, a thin curved piece, is the segment.
    step_by_step: 'Step 1: Find the sector area. Step 2: Find the triangle''s area (r²/2 for 90°, (√3/4)r² for 60°). Step 3: Segment = sector − triangle. Step 4: For combined shapes, list the pieces and add or subtract their areas.'
    real_world: 'A shop''s semicircular window on top of a rectangular door: total glass = rectangle + semicircle.'
  picture:
    kind: flow
    steps:
    - Radius 14 cm, angle 90°
    - Sector = 1/4 × 22/7 × 196 = 154 cm²
    - Triangle = 1/2 × 14 × 14 = 98 cm²
    - Segment = 154 − 98 = 56 cm²
    alt: 'Finding the area of a 90° segment of a circle of radius 14 cm: the sector is 154, the triangle 98, so the segment is 56 square cm.'
  activity:
    type: formula
    prompt: A chord subtends 90° at the centre. Minor segment = sector − triangle = πr²/4 − r²/2.
    inputs:
    - name: r
      label: Radius r
      min: 1
      max: 21
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: sec
      label: Sector (quarter circle)
      expr: pi*r^2/4
      unit: cm²
      places: 2
    - name: tri
      label: Triangle OAB
      expr: r^2/2
      unit: cm²
      places: 2
    - name: seg
      label: Minor segment
      expr: pi*r^2/4-r^2/2
      unit: cm²
      places: 2
    goals:
    - prompt: Make the minor segment about 56 cm².
      want:
        seg:
        - 55.5
        - 56.5
      hint: The segment is about 0.285 × r².
      mistakes:
      - when:
          r: 8
        say: 'At r = 8 the sector is about 50 cm², but the segment is the sector minus the triangle: only about 18 cm².'
      - when:
          r: 11
        say: At r = 11 the triangle alone is 60.5 cm². The segment is the small piece between the chord and the arc.
    - prompt: Make the minor segment about 28.5 cm².
      want:
        seg:
        - 28
        - 29
      mistakes:
      - when:
          r: 6
        say: 'At r = 6 the whole quarter-circle sector is about 28.3 cm², but the segment is the sector minus the triangle: just 10.3 cm².'
  lesson:
    - teach: 'A chord cuts a circle into two segments. The smaller one is the minor segment. To find its area: take the sector with the same angle and subtract the triangle made by the two radii and the chord.'
      picture:
        kind: flow
        steps:
        - Sector area (θ/360) πr²
        - Triangle area from the two radii
        - Segment = sector − triangle
        alt: 'Three steps: find the sector area, find the triangle made by the two radii, then subtract to get the segment.'
      check:
        prompt: Segment area = ?
        options:
        - Sector − triangle
        - Sector + triangle
        - Circle − sector
        answer: Sector − triangle
        why: The triangle part of the sector is not in the segment.
    - teach: 'Triangle areas you need: for θ = 90°, triangle = ½ r². For θ = 60°, the triangle is equilateral: (√3/4) r². Example: r = 14, θ = 90°: sector = 154, triangle = 98, segment = 56 cm².'
      check:
        prompt: r = 10 cm, θ = 90°. Triangle area?
        options:
        - 50 cm²
        - 100 cm²
        - 25 cm²
        answer: 50 cm²
        why: ½ × 10 × 10 = 50.
    - teach: Major segment = circle − minor segment. For shaded-region questions, list the shapes you see, find each area, and add or subtract.
      check:
        prompt: Circle 154 cm², minor segment 14 cm². Major segment?
        options:
        - 140 cm²
        - 168 cm²
        - 154 cm²
        answer: 140 cm²
        why: 154 − 14 = 140.
  items:
  - prompt: Find the area of the minor segment of a circle of radius 14 cm cut off by a 90° angle at the centre. Use π = 22/7. Answer in cm².
    answer: '56'
    check: Rational(22, 7)*196/4 - 98
    difficulty: 2
    hints:
    - Segment = sector − triangle.
    - 154 − 98.
    solution: 'Step 1: Sector = 154 cm². Step 2: Triangle = 1/2 × 14 × 14 = 98 cm². Step 3: Segment = 56 cm².'
    mistakes:
      '154': c10_subtract_triangle
  - prompt: A rectangle 10 cm × 7 cm has a semicircle of diameter 7 cm on one of its 7 cm sides (outwards). Find the total area in cm². Use π = 22/7. Type a decimal.
    answer: '89.25'
    check: 70 + Rational(1, 2)*Rational(22, 7)*Rational(7, 2)**2
    difficulty: 2
    hints:
    - Semicircle radius 3.5.
    - 70 + 1/2 × 22/7 × 3.5².
    solution: 'Step 1: Rectangle = 70. Step 2: Semicircle = 1/2 × 22/7 × 12.25 = 19.25. Step 3: Total = 89.25 cm².'
    mistakes: {"108.5": "c10_radius_diameter", "70": "t10_composite_area"}
  - prompt: A square of side 14 cm has a circle drawn inside touching all four sides. Find the area outside the circle but inside the square, in cm². Use π = 22/7.
    answer: '42'
    check: 196 - Rational(22, 7)*49
    difficulty: 2
    hints:
    - Circle radius = 7.
    - 196 − 154.
    solution: 'Step 1: Square = 196. Step 2: Circle = 22/7 × 49 = 154. Step 3: Difference = 42 cm².'
    mistakes: {"154": "t10_square_minus_circle", "616": "c10_radius_diameter"}
  - prompt: Find the area of a semicircle of diameter 28 cm, in cm². Use π = 22/7.
    answer: '308'
    check: Rational(1, 2)*Rational(22, 7)*196
    difficulty: 1
    hints:
    - Radius = 14.
    - 1/2 × 22/7 × 196.
    solution: 'Step 1: r = 14. Step 2: 1/2 × 22/7 × 196 = 308 cm².'
    mistakes:
      '1232': c10_radius_diameter
  - prompt: What is a segment of a circle?
    options:
    - The region between a chord and its arc
    - The region between two radii
    - A line through the centre
    - The whole boundary of the circle
    answer: The region between a chord and its arc
    difficulty: 1
    hints:
    - Two radii make a sector.
    - A chord cuts off a piece.
    solution: A segment is the region between a chord and the arc it cuts off.
    mistakes: {"The region between two radii": "t10_segment_def", "A line through the centre": "t10_segment_def"}
  - prompt: Find the area of the minor segment for a 60° angle in a circle of radius 6 cm, written as aπ − b√3. Find a.
    answer: '6'
    check: Rational(60, 360)*36
    difficulty: 3
    hints:
    - Sector = (60/360) × π × 36 = 6π.
    - 'Triangle is equilateral: (√3/4) × 36 = 9√3.'
    solution: 'Step 1: Sector = 6π. Step 2: Triangle = 9√3. Step 3: Segment = 6π − 9√3, so a = 6.'
    mistakes: {"9": "c10_subtract_triangle", "12": "t10_sector_fraction"}
  - prompt: In a circle of radius 10 cm, a chord makes 90° at the centre. Find the minor segment's area in cm². Use π = 3.14.
    answer: '28.5'
    check: 0.25 * 3.14 * 100 - 50
    difficulty: 2
    hints:
    - Sector = quarter of 314.
    - Triangle = ½ × 10 × 10.
    solution: Sector = 78.5, triangle = 50, segment = 28.5 cm².
    mistakes:
      '78.5': c10m11_segment
      '128.5': c10m11_segment
  - prompt: For that circle (r = 10 cm, 90° chord), find the major segment's area in cm². Use π = 3.14.
    answer: '285.5'
    check: 314 - 28.5
    difficulty: 3
    hints:
    - Whole circle = 314.
    - Take away the minor segment.
    solution: Major = 314 − 28.5 = 285.5 cm².
    mistakes:
      '28.5': c10m11_major
      '235.5': c10m11_segment
  - prompt: A circle of radius 7 cm has a 90° sector. Find the minor segment's area in cm². Use π = 22/7.
    answer: '14'
    check: 38.5 - 24.5
    difficulty: 2
    hints:
    - Sector = quarter of 154.
    - Triangle = ½ × 7 × 7.
    solution: Sector = 38.5, triangle = 24.5, segment = 14 cm².
    mistakes:
      '38.5': c10m11_segment
      '63': c10m11_segment
  - prompt: Which shape is between a chord and its arc?
    options:
    - A segment
    - A sector
    - A triangle
    - A semicircle
    answer: A segment
    difficulty: 1
    hints:
    - A sector is between two radii and an arc.
    - This one has a chord instead of radii.
    solution: The region between a chord and its arc is a segment.
    mistakes:
      A sector: c10m11_segment
  - prompt: A square of side 14 cm has a quarter circle of radius 14 cm drawn from one corner. Find the area of the square NOT covered, in cm². Use π = 22/7.
    answer: '42'
    check: 196 - 154
    difficulty: 3
    hints:
    - Quarter circle = ¼ × 22/7 × 196.
    - Square = 196.
    solution: Quarter circle = 154. Uncovered = 196 − 154 = 42 cm².
    mistakes:
      '154': c10m11_major
      '350': c10m11_segment
  - prompt: A chord subtends 60° at the centre of a circle of radius 12 cm. The triangle it forms with the centre is…
    options:
    - Equilateral
    - Right-angled
    - Scalene
    - Obtuse
    answer: Equilateral
    difficulty: 2
    hints:
    - Two sides are radii, so it is isosceles.
    - The base angles share 120°.
    solution: Base angles = 60° each, so all angles are 60° and it is equilateral.
    mistakes:
      Right-angled: c10m11_segment
  - prompt: A circular park of radius 21 m has a path cut off by a chord at 90°. Find the minor segment's area in m². Use π = 22/7.
    answer: '126'
    check: 0.25 * 22 / 7 * 441 - 0.5 * 441
    difficulty: 3
    hints:
    - Sector = ¼ × 22/7 × 441.
    - Triangle = ½ × 21 × 21.
    solution: Sector = 346.5, triangle = 220.5, segment = 126 m².
    mistakes:
