# CBSE Class 10 Mathematics (NCERT), chapter 3. Format: content/README.md.
subject: cbse10-math
chapter: 3
title: Pair of Linear Equations in Two Variables
tips:
  c10_other_unknown: 'That is the other unknown. Read the question again: which one does it ask for?'
  c10_divide_count: That is the cost of more than one. Divide by how many there are to get the cost of one.
  t10_all_ratios_equal: "If all three ratios are equal, one equation is just a multiple of the other: the same line."
  t10_compare_ratios: "Compare a₁/a₂, b₁/b₂ and c₁/c₂. Equal first two but a different third means parallel lines."
  t10_eliminate_y: "Make the y-coefficients equal (multiply each equation), then subtract to remove y."
  t10_fraction_equations: "Write each condition as an equation, cross-multiply, then solve the pair. Check your fraction in both conditions."
  t10_no_solution_k: "No solution needs a₁/a₂ = b₁/b₂ (but different c ratio). Set k/3 equal to 2/1."
  t10_one_meeting: "The solutions are the points the two lines share. How many points do two crossing lines share?"
  t10_substitute_x: "Put x = 3 into one equation and solve for y. Then check in the other."
  t10_substitution: "Replace y with 2x in the second equation, so there is only one letter left."
  t10_sum_diff: "Add the two equations x + y = 50 and x − y = 8 to remove y. Which number is asked for: larger or smaller?"
  t10_unequal_slope_ratio: "Exactly one solution happens when a₁/a₂ ≠ b₁/b₂. Check each pair for that."
  c10m3_ratio_test: 'Compare a₁/a₂, b₁/b₂ and c₁/c₂. Different first two: lines cross. First two equal but third different: parallel. All three equal: the same line.'
  c10m3_check_both: Put your answer back into BOTH equations. If one fails, a sign or a step went wrong.
  c10m3_which_unknown: Make sure you give the unknown the question asks for, not the other one you found on the way.
  c10m3_set_up: Name the two unknowns first, then turn each sentence of the problem into one equation.
concepts:
- code: cbse10m.pair.graph
  title: Pairs of lines and their solutions
  notes: |
    A pair of linear equations a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0 can be shown as two lines.
    Intersecting lines: one solution (consistent), when a₁/a₂ ≠ b₁/b₂. Coincident lines: infinitely many
    solutions (dependent, consistent), when a₁/a₂ = b₁/b₂ = c₁/c₂. Parallel lines: no solution (inconsistent),
    when a₁/a₂ = b₁/b₂ ≠ c₁/c₂.
  explanations:
    text: Each linear equation is a straight line, and a solution of both is a point on both lines. Two lines can cross once (one solution), lie on top of each other (infinitely many solutions) or run parallel (no solution). Comparing the ratios of the coefficients tells you which, without drawing.
    visual: 'Draw three small pictures: an X (lines crossing, one solution), two lines drawn over each other (the same line, infinitely many solutions) and two parallel rails (no solution).'
    step_by_step: 'Step 1: Write both equations as ax + by + c = 0. Step 2: Work out a₁/a₂, b₁/b₂ and c₁/c₂. Step 3: If a₁/a₂ ≠ b₁/b₂, the lines cross: one solution. Step 4: If all three ratios are equal, the lines coincide. Step 5: If the first two are equal but not the third, the lines are parallel: no solution.'
    real_world: 'Two taxi companies: one charges ₹50 plus ₹10 a km, the other ₹20 plus ₹15 a km. Their cost lines cross at 6 km, where both charge ₹110.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 7
    x_label: x
    y_label: y
    points:
      _a:
      - 0
      - 5
      _b:
      - 5
      - 0
      _c:
      - 0
      - 1
      _d:
      - 6
      - 4
      (3, 2):
      - 3
      - 2
    segments:
    - - _a
      - _b
      - x + y = 5
    - - _c
      - _d
      - x − 2y = −1
    caption: 'The lines cross at (3, 2): that point is the one solution of both equations.'
    alt: Two lines on axes, x + y = 5 and x − 2y = −1, crossing at the point (3, 2), the only solution of both.
  activity:
    type: graph
    mode: line
    range:
    - -6
    - 6
    m_step: 0.5
    prompt: One line of the pair is y = 2x + 1. Draw the other line so the pair has the number of solutions asked for.
    goals:
    - prompt: 'No solution: draw a line parallel to y = 2x + 1 that crosses the y-axis at −3.'
      m: 2
      c: -3
      mistakes:
      - when:
          m: -2
          c: -3
        say: 'Slope −2 tilts the other way, so it crosses y = 2x + 1: one solution, not none.'
      - when:
          m: 2
          c: 1
        say: 'That''s y = 2x + 1 itself: the lines lie on top of each other, so there are infinitely many solutions.'
    - prompt: 'Exactly one solution, at (1, 3): draw a line through (0, 4) and (1, 3).'
      through:
      - - 0
        - 4
      - - 1
        - 3
      mistakes:
      - when:
          m: 2
          c: 4
        say: 'This is parallel to y = 2x + 1 (same slope 2), so they never meet: no solution.'
      - when:
          m: 1
          c: 4
        say: Slope 1 goes up as you move right, missing (1, 3). From (0, 4) to (1, 3) it drops 1.
    - prompt: 'Infinitely many solutions: draw 4x − 2y + 2 = 0.'
      m: 2
      c: 1
      hint: 'Get y on its own first: 2y = 4x + 2.'
      mistakes:
      - when:
          m: 4
          c: 2
        say: You read 4 and 2 straight off, but y has 2 in front. Divide everything by 2 first.
      - when:
          m: 2
          c: 2
        say: 'Right slope, but 2y = 4x + 2 means y = 2x + 1: the constant halves too.'
  lesson:
    - teach: Each linear equation in two variables is a straight line. Two such equations are two lines, and a solution is a point on both. Two lines can cross once (one solution), be parallel (no solution), or lie on top of each other (infinitely many solutions).
      picture:
        kind: compare
        columns:
        - title: Intersecting
          points:
          - Cross once
          - One solution
          - Consistent
        - title: Parallel
          points:
          - Never meet
          - No solution
          - Inconsistent
        - title: Coincident
          points:
          - Same line
          - Infinitely many
          - Dependent
        alt: 'Three ways two lines can sit: intersecting with one solution, parallel with none, coincident with infinitely many.'
      check:
        prompt: Parallel lines give how many solutions?
        options:
        - None
        - One
        - Infinitely many
        answer: None
        why: They never meet.
    - teach: 'Without drawing, compare the ratios for a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0. If a₁/a₂ ≠ b₁/b₂: intersecting. If a₁/a₂ = b₁/b₂ ≠ c₁/c₂: parallel. If all three ratios are equal: coincident.'
      check:
        prompt: For x + y − 4 = 0 and 2x + 2y − 8 = 0, the ratios are 1/2, 1/2, 1/2. The lines are…
        options:
        - Coincident
        - Parallel
        - Intersecting
        answer: Coincident
        why: All three ratios are equal.
  items:
  - prompt: Two lines cross at exactly one point. How many solutions does the pair of equations have?
    options:
    - One
    - None
    - Infinitely many
    - Two
    answer: One
    difficulty: 1
    hints:
    - A solution is a point on both lines.
    - They share one point.
    solution: Crossing lines share exactly one point, so there is one solution.
    mistakes: {"Infinitely many": "t10_one_meeting", "Two": "t10_one_meeting"}
  - prompt: For x + 2y = 4 and 2x + 4y = 12, what kind of lines are they?
    options:
    - 'Parallel: no solution'
    - 'Crossing: one solution'
    - 'The same line: infinitely many'
    - 'Perpendicular: one solution'
    answer: 'Parallel: no solution'
    difficulty: 2
    hints:
    - Compare 1/2, 2/4 and 4/12.
    - The first two ratios are equal; the third is not.
    solution: 'Step 1: a₁/a₂ = 1/2, b₁/b₂ = 2/4 = 1/2, c₁/c₂ = 4/12 = 1/3. Step 2: The first two are equal but not the third, so the lines are parallel: no solution.'
    mistakes: {"Crossing: one solution": "t10_compare_ratios", "The same line: infinitely many": "t10_compare_ratios"}
  - prompt: For 2x − 3y = 5 and 4x − 6y = 10, how many solutions are there?
    options:
    - Infinitely many
    - One
    - None
    - Two
    answer: Infinitely many
    difficulty: 2
    hints:
    - Is the second equation just the first times 2?
    - All three ratios equal 1/2.
    solution: 'Step 1: 2/4 = −3/−6 = 5/10 = 1/2. Step 2: All ratios are equal, so the lines coincide: infinitely many solutions.'
    mistakes: {"None": "t10_all_ratios_equal", "One": "t10_all_ratios_equal"}
  - prompt: Which pair of equations has exactly one solution?
    options:
    - x + y = 3 and x − y = 1
    - x + y = 3 and 2x + 2y = 6
    - x + y = 3 and x + y = 5
    - 2x + y = 1 and 4x + 2y = 7
    answer: x + y = 3 and x − y = 1
    difficulty: 1
    hints:
    - Look for a₁/a₂ ≠ b₁/b₂.
    - 1/1 and 1/(−1) are different.
    solution: 'Step 1: For x + y = 3 and x − y = 1, a₁/a₂ = 1 but b₁/b₂ = −1. Step 2: Different, so the lines cross once (at x = 2, y = 1).'
    mistakes: {"x + y = 3 and 2x + 2y = 6": "t10_unequal_slope_ratio", "x + y = 3 and x + y = 5": "t10_unequal_slope_ratio"}
  - prompt: The lines x + y = 5 and x − 2y = −1 cross at (3, y). Find y.
    answer: '2'
    check: 5 - 3
    difficulty: 2
    hints:
    - Put x = 3 into x + y = 5.
    - 3 + y = 5.
    solution: 'Step 1: 3 + y = 5, so y = 2. Step 2: Check in the other: 3 − 4 = −1 ✓.'
    mistakes: {"8": "t10_substitute_x", "-2": "t10_substitute_x"}
  - prompt: For which value of k do kx + 2y = 5 and 3x + y = 1 have no solution?
    answer: '6'
    check: 3*2
    difficulty: 3
    hints:
    - 'Parallel lines: a₁/a₂ = b₁/b₂.'
    - k/3 = 2/1.
    solution: 'Step 1: For no solution, k/3 = 2/1. Step 2: k = 6. Step 3: Then c₁/c₂ = 5/1 ≠ 2, so the lines are parallel.'
    mistakes: {"3": "t10_no_solution_k", "1.5": "t10_no_solution_k"}
  - prompt: For 3x + 2y = 5 and 2x − 3y = 7, are the lines intersecting, parallel or coincident?
    options:
    - Intersecting
    - Parallel
    - Coincident
    - Cannot tell
    answer: Intersecting
    difficulty: 1
    hints:
    - Compare a₁/a₂ and b₁/b₂.
    - 3/2 and 2/(−3).
    solution: a₁/a₂ = 3/2 and b₁/b₂ = −2/3 are different, so the lines intersect.
    mistakes:
      Parallel: c10m3_ratio_test
  - prompt: For 2x − 3y = 8 and 4x − 6y = 9, how many solutions are there?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - 'Ratios: 2/4, −3/−6, 8/9.'
    - First two equal, third different.
    solution: 'a₁/a₂ = b₁/b₂ = 1/2 but c₁/c₂ = 8/9, so the lines are parallel: no solution.'
    mistakes:
      '1': c10m3_ratio_test
  - prompt: A pair of equations has no solution. What is it called?
    options:
    - Inconsistent
    - Consistent
    - Dependent
    - Coincident
    answer: Inconsistent
    difficulty: 1
    hints:
    - Consistent means at least one solution.
    - This one has none.
    solution: A pair with no solution is inconsistent.
    mistakes:
      Dependent: c10m3_ratio_test
  - prompt: For which k are 3x + y = 1 and (2k − 1)x + (k − 1)y = 2k + 1 parallel? Use a₁/a₂ = b₁/b₂.
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - 3/(2k − 1) = 1/(k − 1).
    - Cross-multiply.
    solution: 'Step 1: 3(k − 1) = 2k − 1. Step 2: 3k − 3 = 2k − 1, so k = 2. Step 3: Check: with k = 2 the second line is 3x + y = 5, and c₁/c₂ = 1/5 is not 1, so the lines are parallel.'
    mistakes:
      '1': c10m3_ratio_test
      '-2': c10m3_ratio_test
  - prompt: The lines y = x + 1 and y = −x + 5 cross at (2, k). Find k.
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Put x = 2 into either line.
    - y = 2 + 1.
    solution: 'y = 2 + 1 = 3. Check: −2 + 5 = 3.'
    mistakes:
      '2': c10m3_which_unknown
  - prompt: Which pair of equations is dependent (infinitely many solutions)?
    options:
    - x + 2y = 3 and 3x + 6y = 9
    - x + 2y = 3 and 3x + 6y = 8
    - x + 2y = 3 and x − 2y = 3
    - x = 3 and y = 3
    answer: x + 2y = 3 and 3x + 6y = 9
    difficulty: 2
    hints:
    - Look for one equation that is a multiple of the other.
    - All three ratios equal.
    solution: 3x + 6y = 9 is 3 × (x + 2y = 3), so the lines coincide.
    mistakes:
      x + 2y = 3 and 3x + 6y = 8: c10m3_ratio_test
  - prompt: Where does the line 2x + y = 6 cross the y-axis?
    options:
    - (0, 6)
    - (3, 0)
    - (6, 0)
    - (0, 3)
    answer: (0, 6)
    difficulty: 1
    hints:
    - On the y-axis, x = 0.
    - Put x = 0.
    solution: x = 0 gives y = 6, so (0, 6).
    mistakes:
      (3, 0): c10m3_which_unknown
  - prompt: Is the pair 5x − 8y + 1 = 0 and 3x − (24/5)y + 3/5 = 0 consistent?
    options:
    - Yes, infinitely many solutions
    - No, no solution
    - Yes, exactly one solution
    - Cannot tell
    answer: Yes, infinitely many solutions
    difficulty: 3
    hints:
    - Find a₁/a₂, b₁/b₂, c₁/c₂.
    - 5/3, −8/(−24/5) = 5/3, 1/(3/5) = 5/3.
    solution: 'All three ratios equal 5/3, so the lines coincide: consistent with infinitely many solutions.'
    mistakes:
      No, no solution: c10m3_ratio_test
  - prompt: Lines x = 2 and y = −1 meet at which point?
    options:
    - (2, −1)
    - (−1, 2)
    - (2, 2)
    - They do not meet
    answer: (2, −1)
    difficulty: 1
    hints:
    - x = 2 is a vertical line.
    - y = −1 is a horizontal line.
    solution: A vertical and a horizontal line meet at (2, −1).
    mistakes:
      (−1, 2): c10m3_which_unknown
- code: cbse10m.pair.algebra
  title: Solving by substitution and elimination
  after:
  - cbse10m.pair.graph
  notes: |
    Substitution: make one variable the subject of one equation and put it into the other. Elimination:
    multiply the equations so one variable has equal (or opposite) coefficients, then subtract (or add) to
    remove it. Solve for the remaining variable and substitute back. Word problems: name the two unknowns,
    write two equations from the conditions, solve and check.
  explanations:
    text: 'To solve two equations together, get rid of one unknown. Substitution: rearrange one equation (y = 5 − x) and put it into the other. Elimination: make the numbers in front of one unknown match, then subtract the equations so it disappears.'
    visual: 'Picture two shopping bills. Bill A: 2 pens + 1 book = ₹70. Bill B: 2 pens + 3 books = ₹130. Put B under A and subtract: the 2 pens cancel, leaving 2 books = ₹60, so a book costs ₹30.'
    step_by_step: 'Step 1: Choose substitution or elimination. Step 2: Remove one unknown to get one equation in one variable. Step 3: Solve it. Step 4: Put the value back to find the other unknown. Step 5: Check both original equations.'
    real_world: 'A school pays ₹4200 for 3 chairs and 2 tables, and ₹3850 for 5 chairs and 1 table. Doubling the second bill and subtracting the first removes the tables: 7 chairs cost ₹3500, so a chair is ₹500 and a table ₹1350.'
  picture:
    kind: flow
    steps:
    - x + y = 14 and x − y = 4
    - 'Add the equations: 2x = 18'
    - x = 9
    - 'Put back: 9 + y = 14, so y = 5'
    - 'Check: 9 − 5 = 4 ✓'
    alt: 'Solving x + y = 14 and x − y = 4 by elimination: adding gives 2x = 18, so x = 9 and y = 5.'
  activity:
    type: formula
    prompt: A pencil costs ₹p and a pen ₹q. Both bills must be right at the same time.
    inputs:
    - name: p
      label: Pencil price p
      min: 1
      max: 10
      step: 1
      start: 1
      unit: ₹
    - name: q
      label: Pen price q
      min: 1
      max: 10
      step: 1
      start: 1
      unit: ₹
    outputs:
    - name: c1
      label: 5 pencils + 7 pens
      expr: 5*p+7*q
      unit: ₹
    - name: c2
      label: 7 pencils + 5 pens
      expr: 7*p+5*q
      unit: ₹
    - name: sm
      label: 1 pencil + 1 pen
      expr: p+q
      unit: ₹
    - name: df
      label: Pen − pencil
      expr: q-p
      unit: ₹
    goals:
    - prompt: 5 pencils and 7 pens cost ₹50; 7 pencils and 5 pens cost ₹46. Find p and q.
      want:
        c1: 50
        c2: 46
      hint: 'Add the two bills: 12p + 12q = 96. What is p + q? Then subtract them.'
      mistakes:
      - when:
          p: 5
          q: 3
        say: 'Swapped: pencils at ₹5 make the first bill ₹46 and the second ₹50.'
      - when:
          c1: 50
        say: The first bill fits, but one equation has many answers. The second bill must fit too.
    - prompt: A pen and a pencil together cost ₹11, and the pen costs ₹3 more.
      want:
        sm: 11
        df: 3
      mistakes:
      - when:
          p: 7
          q: 4
        say: 'Swapped: then the pencil is ₹3 dearer than the pen.'
      - when:
          sm: 11
        say: The total is right. Now the pen must also cost ₹3 more than the pencil.
      - when:
          df: 3
        say: The difference is right; the two must also add to ₹11.
  lesson:
    - teach: 'Substitution: make one variable the subject of one equation and put it into the other. Solve x + y = 7 and 2x − y = 2: from the first, y = 7 − x. Then 2x − (7 − x) = 2, so 3x = 9, x = 3, and y = 4.'
      check:
        prompt: After substituting, what is x?
        options:
        - '3'
        - '4'
        - '7'
        answer: '3'
        why: 3x = 9.
    - teach: 'Elimination: make the coefficients of one variable equal (or opposite), then subtract (or add) to remove it. 3x + 2y = 12 and 5x − 2y = 4: add them, 8x = 16, x = 2; then 6 + 2y = 12, y = 3. Always check your answer in both equations.'
      picture:
        kind: flow
        steps:
        - Match one variable's coefficients
        - Add or subtract
        - Solve for the other
        - Substitute back
        - Check in both
        alt: 'Steps of elimination: match coefficients, add or subtract, solve, substitute back, check.'
      check:
        prompt: In 3x + 2y = 12 and 5x − 2y = 4, why add the equations?
        options:
        - The y terms cancel
        - The x terms cancel
        - To double everything
        answer: The y terms cancel
        why: +2y and −2y make 0.
    - teach: 'Word problems: name the two unknowns, write one equation from each condition, solve, and check the answer makes sense in the story.'
      check:
        prompt: First step in a word problem?
        options:
        - Name the two unknowns
        - Guess the answer
        - Draw a circle
        answer: Name the two unknowns
        why: Then each condition becomes an equation.
  items:
  - prompt: Solve x + y = 14 and x − y = 4. What is x?
    answer: '9'
    check: (14 + 4)/2
    difficulty: 1
    hints:
    - Add the two equations.
    - 2x = 18.
    solution: 'Step 1: Adding: 2x = 18. Step 2: x = 9. Step 3: y = 14 − 9 = 5.'
    mistakes:
      '5': c10_other_unknown
  - prompt: Solve x + y = 14 and x − y = 4. What is y?
    answer: '5'
    check: (14 - 4)/2
    difficulty: 1
    hints:
    - Subtract the second equation from the first.
    - 2y = 10.
    solution: 'Step 1: Subtracting: 2y = 10. Step 2: y = 5.'
    mistakes:
      '9': c10_other_unknown
  - prompt: Solve y = 2x and x + y = 12. What is x?
    answer: '4'
    check: 12/3
    difficulty: 1
    hints:
    - Substitute y = 2x into x + y = 12.
    - 3x = 12.
    solution: 'Step 1: x + 2x = 12. Step 2: 3x = 12, so x = 4 (and y = 8).'
    mistakes: {"8": "c10_other_unknown", "6": "t10_substitution"}
  - prompt: Solve 3x + 2y = 11 and 2x + 3y = 4. What is x?
    answer: '5'
    check: (33 - 8)/5
    difficulty: 2
    hints:
    - Multiply the first by 3 and the second by 2.
    - 9x + 6y = 33 and 4x + 6y = 8.
    solution: 'Step 1: 9x + 6y = 33 and 4x + 6y = 8. Step 2: Subtract: 5x = 25, so x = 5. Step 3: y = (11 − 15)/2 = −2.'
    mistakes: {"-2": "c10_other_unknown", "3": "t10_eliminate_y"}
  - prompt: 2 pens and 1 book cost ₹70; 2 pens and 3 books cost ₹130. What does one book cost, in rupees?
    answer: '30'
    check: (130 - 70)/2
    difficulty: 2
    hints:
    - Subtract the first bill from the second.
    - 2 books = ₹60.
    solution: 'Step 1: Subtracting: 2 books = 130 − 70 = ₹60. Step 2: One book = ₹30. Step 3: A pen = (70 − 30)/2 = ₹20.'
    mistakes:
      '60': c10_divide_count
  - prompt: The sum of two numbers is 50 and one is 8 more than the other. What is the larger number?
    answer: '29'
    check: (50 + 8)/2
    difficulty: 2
    hints:
    - x + y = 50 and x − y = 8.
    - 2x = 58.
    solution: 'Step 1: x + y = 50, x − y = 8. Step 2: 2x = 58, x = 29. Step 3: The other is 21.'
    mistakes: {"21": "t10_sum_diff", "25": "t10_sum_diff"}
  - prompt: A fraction x/y becomes 9/11 if 2 is added to both its numerator and denominator, and 5/6 if 3 is added to both. Find x.
    answer: '7'
    check: ((-4)*(-5) - (-3)*(-9))/(11*(-5) - 6*(-9))
    difficulty: 3
    hints:
    - (x + 2)/(y + 2) = 9/11 gives 11x − 9y = −4.
    - (x + 3)/(y + 3) = 5/6 gives 6x − 5y = −3.
    solution: 'Step 1: 11x + 22 = 9y + 18, so 11x − 9y = −4. Step 2: 6x + 18 = 5y + 15, so 6x − 5y = −3. Step 3: Solving: x = 7, y = 9. Check: 9/11 and 10/12 = 5/6 ✓.'
    mistakes: {"9": "c10_other_unknown", "5": "t10_fraction_equations"}
  - prompt: Solve 2x + 3y = 13 and x − y = −1. What is y?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - From the second, x = y − 1.
    - Substitute into the first.
    solution: 'Step 1: x = y − 1. Step 2: 2(y − 1) + 3y = 13, so 5y = 15, y = 3 (and x = 2).'
    mistakes:
      '2': c10m3_which_unknown
  - prompt: Solve 5x + 3y = 35 and 2x − 3y = −7. What is x?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Add the equations.
    - The y terms cancel.
    solution: 'Step 1: 7x = 28, so x = 4. Step 2: 20 + 3y = 35, y = 5.'
    mistakes:
      '5': c10m3_which_unknown
      '7': c10m3_check_both
