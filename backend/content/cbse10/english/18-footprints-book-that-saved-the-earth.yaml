subject: cbse10-eng
chapter: 18
title: The Book That Saved the Earth (Claire Boiko)
tips:
  e10_diddle: "In the rhyme, 'the cow jumped over the moon'. How did Think-Tank read that?"
  e10_humpty: "Think-Tank had a big egg-shaped head. Who in the rhymes looks like that?"
  e10_mother_goose: "The Martians misunderstood a book of children's rhymes."
  e10_noodle: "Think-Tank ran away. The assistant he always insulted took over."
  e10_satire_book: "Think-Tank thinks he is a genius but is wrong about everything."
  e10_think_tank: "Noodle is the assistant. The ruler had a name about his 'big brain'."
  e10f9_rhymes: Think-Tank reads each nursery rhyme literally, as a military secret. Picture what he believes the rhyme means.
  e10f9_cast: The Martians are Think-Tank (ruler), Noodle (his assistant), Captain Omega, Lieutenant Iota and Sergeant Oop. Who is meant?

concepts:
- code: cbse10e.f9.book
  title: The Book That Saved the Earth (Claire Boiko)
  notes: |
    A play told by a Historian from the twenty-fifth century, recalling the twenty-first century, when a
    Martian invasion of Earth was stopped by a book: Mother Goose. Think-Tank, the conceited ruler of Mars with
    an enormous brain, commands Captain Omega's crew (Lieutenant Iota, Sergeant Oop) to study Earth from a
    library in a town. Noodle, Think-Tank's apprentice, helps. They find Mother Goose nursery rhymes and take
    them literally: 'Hey Diddle Diddle, the cow jumped over the moon' convinces Think-Tank that Earth's cows are
    so advanced they have space programmes; 'Humpty Dumpty' looks like Think-Tank himself and his fall scares
    him. Think-Tank orders the evacuation of Mars and flees to Alpha Centauri. Noodle becomes the new ruler and
    wants peace with Earth. Satire on arrogance and ignorance.
  explanations:
    text: In this comic play, Martians planning to invade Earth study a book of nursery rhymes, Mother Goose, and take every rhyme literally. Their arrogant leader Think-Tank decides Earth's cows fly to the moon and that his egg-shaped look means he'll be smashed like Humpty Dumpty, so he calls off the invasion and flees.
    visual: Picture a huge-headed Martian on a throne, terrified as his crew reads aloud 'The cow jumped over the moon', while his assistant Noodle tries not to laugh.
    step_by_step: 'Step 1: The frame: a Historian of the future. Step 2: Think-Tank''s plan to invade. Step 3: The crew in the library with Mother Goose. Step 4: Literal readings of rhymes. Step 5: The invasion is called off; Noodle takes charge.'
    real_world: 'Misreading a joke or a poem literally, as Think-Tank did, is like taking a cartoon as real news: a reminder to check the type of text you are reading.'
  picture:
    kind: flow
    steps:
    - Think-Tank plans to invade Earth
    - His crew finds a library and Mother Goose
    - 'Rhymes read literally: a cow on the moon'
    - Humpty Dumpty frightens Think-Tank
    - He flees; Noodle seeks peace with Earth
    alt: 'The Book That Saved the Earth: Think-Tank plans an invasion, the crew reads Mother Goose literally, Humpty Dumpty frightens him, and Noodle seeks peace.'
  activity:
    type: sort
    prompt: 'The Book That Saved the Earth: what did the Martians think?'
    bins:
    - Rhyme they read
    - What Think-Tank thought
    items:
    - label: The cow jumped over the moon
      bin: Rhyme they read
      clue: Hey Diddle Diddle.
      why: This is the rhyme itself.
    - label: Earth's cows have space programmes
      bin: What Think-Tank thought
      clue: Taking it literally.
      why: Think-Tank took the rhyme literally.
    - label: Humpty Dumpty had a great fall
      bin: Rhyme they read
      clue: A rhyme about an egg.
      why: That's the rhyme.
    - label: Someone like me will fall
      bin: What Think-Tank thought
      clue: He looks like the egg.
      why: He thought Humpty was a threat to him.
    - label: Mars must be evacuated
      bin: What Think-Tank thought
      clue: His order.
      why: Fear made him order the evacuation.
  lesson:
    - teach: '''The Book That Saved the Earth'' by Claire Boiko is a funny play. A Historian of the future says the twentieth century was the Era of the Book, and tells how a book of nursery rhymes, ''Mother Goose'', saved the Earth from a Martian invasion in the twenty-first century.'
      check:
        prompt: Which book saved the Earth?
        options:
        - Mother Goose
        - An encyclopedia
        - A science textbook
        answer: Mother Goose
        why: A book of nursery rhymes.
    - teach: Think-Tank, the vain, big-headed ruler of Mars, sends Captain Omega with Lieutenant Iota and Sergeant Oop to Earth. They land in a library and do not know what books are; they think they are sandwiches and try eating them. Noodle, Think-Tank's apprentice, suggests they are for reading.
      picture:
        kind: flow
        steps:
        - Martians land in a library
        - Think books are sandwiches
        - Read Mother Goose
        - Think-Tank misreads rhymes
        - Martians flee
        - Noodle becomes ruler
        alt: 'The play''s plot: the Martians land in a library, think books are sandwiches, read Mother Goose, Think-Tank misreads the rhymes, the Martians flee, and Noodle becomes ruler.'
      check:
        prompt: What did the Martians first think books were?
        options:
        - Sandwiches
        - Weapons
        - Hats
        answer: Sandwiches
        why: They tried to eat them.
    - teach: Think-Tank misreads 'Hey Diddle Diddle' as proof that Earth has a space programme, with cows jumping over the moon and dogs laughing, and decides earthlings are advanced. 'Humpty Dumpty', an egg-shaped man who has a great fall, terrifies him because his own head is egg-shaped. He orders a retreat, and Noodle becomes the new ruler. The play mocks vanity and false knowledge.
      check:
        prompt: Why did Humpty Dumpty frighten Think-Tank?
        options:
        - His own head was egg-shaped
        - He feared walls
        - He hated eggs to eat
        answer: His own head was egg-shaped
        why: He thought it was a plot against him.
  items:
  - prompt: Which book 'saved the Earth'?
    options:
    - Mother Goose nursery rhymes
    - A science textbook
    - A dictionary
    - A history book
    answer: Mother Goose nursery rhymes
    difficulty: 1
    hints:
    - Rhymes for children.
    - Humpty Dumpty.
    solution: A book of Mother Goose nursery rhymes.
    mistakes: {"A science textbook": "e10_mother_goose"}
  - prompt: Who was the ruler of Mars?
    options:
    - Think-Tank
    - Noodle
    - Captain Omega
    - Sergeant Oop
    answer: Think-Tank
    difficulty: 1
    hints:
    - Huge brain, very proud.
    - '''Mightiest Think-Tank''.'
    solution: Think-Tank was the conceited ruler of Mars.
    mistakes: {"Noodle": "e10_think_tank"}
  - prompt: What did Think-Tank conclude from 'Hey Diddle Diddle'?
    options:
    - Earth's cows were advanced enough to fly to the moon
    - Earth had no animals
    - Cats play music on Mars
    - Dishes could run
    answer: Earth's cows were advanced enough to fly to the moon
    difficulty: 2
    hints:
    - '''The cow jumped over the moon.'''
    - Taken literally.
    solution: He thought Earth's cows had space programmes.
    mistakes: {"Earth had no animals": "e10_diddle"}
  - prompt: Why did Humpty Dumpty frighten Think-Tank?
    options:
    - Humpty looked like him, and the rhyme describes a great fall
    - Humpty was a real soldier
    - It was written in Martian
    - It mentioned Mars
    answer: Humpty looked like him, and the rhyme describes a great fall
    difficulty: 2
    hints:
    - An egg-shaped head.
    - '''Had a great fall''.'
    solution: He saw himself in egg-shaped Humpty and feared a plot against him.
    mistakes: {"It mentioned Mars": "e10_humpty"}
  - prompt: Who became the new ruler of Mars?
    options:
    - Noodle
    - Think-Tank's son
    - Captain Omega
    - Lieutenant Iota
    answer: Noodle
    difficulty: 1
    hints:
    - Think-Tank's apprentice.
    - He wanted peace.
    solution: Noodle, the apprentice, took over and wanted peace with Earth.
    mistakes: {"Lieutenant Iota": "e10_noodle"}
  - prompt: What does the play satirise?
    options:
    - Arrogance and ignorance passing for intelligence
    - Space travel
    - Libraries
    - Children's books
    answer: Arrogance and ignorance passing for intelligence
    difficulty: 2
    hints:
    - Think-Tank thinks he knows everything.
    - He misreads simple rhymes.
    solution: It mocks a proud leader who thinks he is brilliant but misunderstands simple texts.
    mistakes: {"Space travel": "e10_satire_book"}
  - prompt: Who narrates the history in the play?
    options:
    - A Historian of the future
    - Think-Tank
    - Noodle
    - Captain Omega
    answer: A Historian of the future
    difficulty: 2
    hints:
    - Someone who records the past.
    - Not a Martian.
    solution: A Historian from the future introduces the story.
    mistakes:
      Noodle: e10f9_cast
  - prompt: What does the Historian call the twentieth century?
    options:
    - The Era of the Book
    - The Age of Machines
    - The Space Age
    - The Dark Ages
    answer: The Era of the Book
    difficulty: 2
    hints:
    - People read many books then.
    - The play is about a book.
    solution: The twentieth century is called the Era of the Book.
    mistakes:
      The Space Age: e10f9_rhymes
  - prompt: Who was Captain Omega?
    options:
    - Leader of the Martian probe to Earth
    - The ruler of Mars
    - A librarian
    - Think-Tank's apprentice
    answer: Leader of the Martian probe to Earth
    difficulty: 2
    hints:
    - He took Iota and Oop with him.
    - He reported to Think-Tank.
    solution: Captain Omega led the probe to Earth.
    mistakes:
      The ruler of Mars: e10f9_cast
  - prompt: Where did the Martian probe land?
    options:
    - In a library
    - In a school playground
    - In a zoo
    - In a hospital
    answer: In a library
    difficulty: 1
    hints:
    - They found many books there.
    - A place for reading.
    solution: They landed in a library on Earth.
    mistakes:
      In a zoo: e10f9_cast
  - prompt: Who is Noodle?
    options:
    - Think-Tank's apprentice, who is wiser than his master
    - The ruler of Mars at the start
    - A human librarian
    - A sergeant on the probe
    answer: Think-Tank's apprentice, who is wiser than his master
    difficulty: 2
    hints:
    - He stays at Think-Tank's side on Mars.
    - Think-Tank insults him, yet Noodle often gives the right idea.
    solution: Noodle is Think-Tank's humble apprentice, who quietly gives sensible suggestions.
    mistakes:
      A sergeant on the probe: e10f9_cast
  - prompt: In 'Hey Diddle Diddle', what did Think-Tank think the cow jumping over the moon meant?
    options:
    - Earth had a space programme even for cows
    - Cows were dangerous
    - The moon was made of milk
    - It was a farm song
    answer: Earth had a space programme even for cows
    difficulty: 2
    hints:
    - He read it as fact.
    - Space travel.
    solution: He thought earthlings had sent cows into space.
    mistakes:
      The moon was made of milk: e10f9_rhymes
  - prompt: What kind of character is Think-Tank?
    options:
    - Vain, pompous and foolish
    - Wise and humble
    - Kind and gentle
    - Shy and quiet
    answer: Vain, pompous and foolish
    difficulty: 2
    hints:
    - He calls himself the most powerful brain.
    - He misreads simple rhymes.
    solution: Think-Tank is self-important and foolish.
    mistakes:
      Wise and humble: e10f9_cast
  - prompt: What happened to Think-Tank at the end?
    options:
    - He fled in fear and Noodle replaced him
    - He conquered Earth
    - He became a librarian
    - He married Iota
    answer: He fled in fear and Noodle replaced him
    difficulty: 2
    hints:
    - He ordered a retreat.
    - His apprentice took over.
    solution: Terrified, Think-Tank fled; Noodle became ruler and offered friendship to Earth.
    mistakes:
      He conquered Earth: e10f9_cast
  - prompt: Who wrote 'The Book That Saved the Earth'?
    options:
    - Claire Boiko
    - Anton Chekhov
    - H. G. Wells
    - Victor Canning
    answer: Claire Boiko
    difficulty: 1
    hints:
    - An American writer of children's plays.
    - Not the author of 'The Proposal'.
    solution: The play is by Claire Boiko.
    mistakes:
      Anton Chekhov: eng10_author
