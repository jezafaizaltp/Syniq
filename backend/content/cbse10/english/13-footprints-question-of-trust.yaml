# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 4.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 13
title: A Question of Trust (Victor Canning)
tips:
  e10_fingerprints: "Horace took off his gloves to open the safe for the woman. What did that leave behind?"
  e10_horace_books: "Horace loved something on shelves, and it was costly."
  e10_locksmith: "His job taught him how to open safes. He loved books, but that was not his work."
  e10_sherry: "Horace knew the dog's name. What happens when you call a dog by name kindly?"
  e10_trust_irony: "Horace was an expert thief. What happened to him that he would never expect?"
  e10_woman_red: "She pretended to be from the house. Later Horace found out she had tricked him."
  e10f4_horace: 'Horace leads a double life: respectable locksmith for most of the year, one careful robbery a year. Which part does the question ask about?'
  e10f4_trick: The lady in red tricked Horace by acting as the owner. Think what she made him do and what it left behind.

concepts:
- code: cbse10e.f4.trust
  title: A Question of Trust (Victor Canning)
  notes: |
    Horace Danby, a respectable, lonely locksmith of about fifty, robs one safe every year to buy rare,
    expensive books, and lives comfortably on the rest. He plans to rob Shotover Grange while the family is
    away. He gets past the dog Sherry by calling her name and is about to open the safe when a young woman in
    red appears, claiming to be the owner's wife. She is charming and asks him to open the safe because she
    has forgotten the combination, saying she won't call the police. He opens it without gloves, and she takes
    the jewels. Later he is arrested because his fingerprints are everywhere; nobody believes his story about
    the lady. She was a thief herself who had tricked him. Irony: a thief is tricked by another thief.
  explanations:
    text: Horace Danby is a locksmith who robs one safe a year to buy rare books. While robbing a country house, he is caught by a charming woman who says she's the owner's wife and asks him to open the safe for her. He does, without gloves. She takes the jewels and he is arrested, because she was a cleverer thief than he was.
    visual: Picture Horace kneeling at a safe in a quiet house, a young woman in red standing in the doorway smiling, and later Horace in a prison cell surrounded by fingerprints.
    step_by_step: 'Step 1: Who Horace is and why he steals. Step 2: The plan: Shotover Grange. Step 3: The woman in red and her story. Step 4: He opens the safe without gloves. Step 5: The arrest and the irony.'
    real_world: 'Online scams work the same way: a friendly, confident stranger wins your trust and then takes what you have.'
  picture:
    kind: flow
    steps:
    - Horace robs one safe a year to buy rare books
    - He breaks into Shotover Grange
    - A woman in red says she's the owner's wife
    - He opens the safe without gloves
    - She takes the jewels; he is arrested
    alt: 'A Question of Trust: Horace robs safes for rare books, breaks into Shotover Grange, is tricked by a woman in red, opens the safe without gloves and is arrested.'
  activity:
    type: sort
    prompt: 'A Question of Trust: what is true about Horace Danby?'
    bins:
    - His habit
    - How he is tricked
    items:
    - label: Robs one safe every year
      bin: His habit
      clue: Every year.
      why: Robbing once a year is his routine.
    - label: Buys rare, expensive books
      bin: His habit
      clue: What the money is for.
      why: He steals to buy rare books.
    - label: Opens the safe without gloves
      bin: How he is tricked
      clue: He leaves something behind.
      why: 'Without gloves he leaves fingerprints: the woman''s trick.'
    - label: A lady in red claims to be the wife
      bin: How he is tricked
      clue: Who is she really?
      why: She is a thief pretending to be the owner's wife.
    - label: Calls the dog Sherry by name
      bin: His habit
      clue: He plans well.
      why: He prepared by learning the dog's name.
  lesson:
    - teach: '''A Question of Trust'' by Victor Canning is about Horace Danby, a respectable, unmarried man of about fifty who makes and repairs locks. Once a year he robs a safe so that he can buy rare and expensive books, and he lives quietly on the money for the rest of the year. He has never been caught.'
      check:
        prompt: Why did Horace rob a safe once a year?
        options:
        - To buy rare, expensive books
        - To help the poor
        - To pay a debt
        answer: To buy rare, expensive books
        why: He loved books.
    - teach: He plans to rob the safe at Shotover Grange, whose family has gone to London. He knows the servants are at the cinema, and he deals with the dog, Sherry, by being friendly. As he opens the safe, he starts sneezing from hay fever caused by the flowers. A young woman in red appears, says she is the lady of the house, and asks him to open the safe for her jewels, as she has forgotten the combination.
      picture:
        kind: flow
        steps:
        - Plans Shotover Grange
        - Gets past Sherry
        - Woman in red appears
        - Opens safe bare-handed
        - 'Arrested: fingerprints'
        alt: 'Horace''s last robbery: plans Shotover Grange, gets past the dog Sherry, the woman in red appears, he opens the safe without gloves, and is arrested because of his fingerprints.'
      check:
        prompt: Why did Horace sneeze in the house?
        options:
        - He had hay fever from the flowers
        - He had a cold from the rain
        - There was dust in the safe
        answer: He had hay fever from the flowers
        why: The room had flowers.
    - teach: Horace takes off his gloves to work and opens the safe. The woman takes the jewels and leaves. Later he is arrested because his fingerprints are on the safe; the woman was a thief, not the lady of the house. Ironically, the man who stole by trusting no one was ruined by trusting a stranger. In prison he works in the library.
      check:
        prompt: Why was Horace caught?
        options:
        - His fingerprints were on the safe
        - Sherry barked
        - The servants saw him
        answer: His fingerprints were on the safe
        why: He took off his gloves.
  items:
  - prompt: Why did Horace Danby rob a safe every year?
    options:
    - To buy rare, expensive books
    - To feed his family
    - To pay off debts
    - For fun
    answer: To buy rare, expensive books
    difficulty: 1
    hints:
    - He loved books.
    - Once a year.
    solution: He stole to buy rare and expensive books.
    mistakes: {"To pay off debts": "e10_horace_books"}
  - prompt: How did Horace deal with the dog, Sherry?
    options:
    - He called her by her name and she became friendly
    - He gave her poisoned meat
    - He tied her up
    - He ran away from her
    answer: He called her by her name and she became friendly
    difficulty: 2
    hints:
    - He had studied the house.
    - Dogs respond to their names.
    solution: Knowing her name, he spoke to Sherry and she didn't bark.
    mistakes: {"He gave her poisoned meat": "e10_sherry"}
  - prompt: Who was the woman in red really?
    options:
    - A thief who tricked Horace
    - The owner's wife
    - A police officer
    - The maid
    answer: A thief who tricked Horace
    difficulty: 2
    hints:
    - She made him open the safe.
    - The family was away.
    solution: She was a clever thief who pretended to be the owner's wife.
    mistakes: {"The owner's wife": "e10_woman_red"}
  - prompt: Why was Horace caught?
    options:
    - His fingerprints were all over the safe
    - The dog bit him
    - The woman called the police in front of him
    - He confessed
    answer: His fingerprints were all over the safe
    difficulty: 1
    hints:
    - He removed his gloves.
    - Evidence.
    solution: He had opened the safe without gloves, leaving fingerprints.
    mistakes: {"The dog bit him": "e10_fingerprints"}
  - prompt: What is ironic about the story?
    options:
    - A thief is tricked by another thief
    - The dog helped the police
    - Horace became rich
    - The jewels were fake
    answer: A thief is tricked by another thief
    difficulty: 2
    hints:
    - Horace thought he was clever.
    - Opposite of expectations.
    solution: Horace, a careful thief, is outwitted by another thief.
    mistakes: {"Horace became rich": "e10_trust_irony"}
  - prompt: What was Horace's regular job?
    options:
    - A locksmith
    - A librarian
    - A banker
    - A gardener
    answer: A locksmith
    difficulty: 1
    hints:
    - He was good with locks.
    - That's why safes were easy.
    solution: Horace was a locksmith.
    mistakes: {"A librarian": "e10_locksmith"}
  - prompt: Which house did Horace plan to rob?
    options:
    - Shotover Grange
    - Baker Street
    - The Coach and Horses
    - Buckingham Palace
    answer: Shotover Grange
    difficulty: 1
    hints:
    - A country house.
    - The family was away.
    solution: Horace planned to rob the safe at Shotover Grange.
    mistakes:
      The Coach and Horses: e10f4_horace
  - prompt: Where were the servants on the afternoon of the robbery?
    options:
    - At the cinema
    - In the kitchen
    - In London with the family
    - In the garden
    answer: At the cinema
    difficulty: 2
    hints:
    - It was their day off.
    - Horace had studied their routine.
    solution: The servants had gone to the cinema.
    mistakes:
      In the garden: e10f4_horace
  - prompt: How old was Horace Danby?
    options:
    - About fifty
    - About twenty
    - About seventy
    - About thirty
    answer: About fifty
    difficulty: 2
    hints:
    - Middle-aged.
    - Half a century.
    solution: Horace was about fifty years old.
    mistakes:
      About twenty: e10f4_horace
  - prompt: Why did Horace take off his gloves?
    options:
    - To work the safe more easily
    - Because they were wet
    - To shake hands
    - Because the lady asked
    answer: To work the safe more easily
    difficulty: 2
    hints:
    - He needed his fingers to work.
    - He thought there was no risk.
    solution: He removed his gloves to work the lock, believing the woman was the owner.
    mistakes:
      Because the lady asked: e10f4_trick
  - prompt: How did the woman in red convince Horace?
    options:
    - She acted calmly as the lady of the house and said she'd forgotten the combination
    - She showed him a police badge
    - She threatened him with a gun
    - She paid him
    answer: She acted calmly as the lady of the house and said she'd forgotten the combination
    difficulty: 3
    hints:
    - She was a confident actor.
    - She claimed the jewels were hers.
    solution: She calmly played the owner who had forgotten her safe's combination.
    mistakes:
      She threatened him with a gun: e10f4_trick
  - prompt: What job does Horace do in prison?
    options:
    - Works in the prison library
    - Cooks in the kitchen
    - Teaches locks
    - Guards the gate
    answer: Works in the prison library
    difficulty: 2
    hints:
    - It suits his love of books.
    - He still thinks of the woman.
    solution: In prison Horace helps in the library.
    mistakes:
      Teaches locks: e10f4_horace
  - prompt: Whom does Horace find it hard to forgive?
    options:
    - The woman in red who tricked him
    - Sherry the dog
    - The police
    - Himself only
    answer: The woman in red who tricked him
    difficulty: 2
    hints:
    - She escaped.
    - He was punished for her theft.
    solution: Horace keeps thinking of the clever woman who tricked him.
    mistakes:
      Sherry the dog: e10f4_trick
  - prompt: Which phrase best describes Horace's character?
    options:
    - A careful, respectable man with a secret weakness
    - A violent gangster
    - A careless boy
    - A cruel master
    answer: A careful, respectable man with a secret weakness
    difficulty: 2
    hints:
    - He plans everything.
    - His love of books drives his crime.
    solution: Horace is careful and respectable, but steals for his passion for books.
    mistakes:
      A violent gangster: e10f4_horace
  - prompt: Who wrote 'A Question of Trust'?
    options:
    - Victor Canning
    - Robert Arthur
    - Ruskin Bond
    - H. G. Wells
    answer: Victor Canning
    difficulty: 1
    hints:
    - A British thriller writer.
    - Not the author of 'The Midnight Visitor'.
    solution: The story is by Victor Canning.
    mistakes:
      Robert Arthur: eng10_author
