concepts:
- code: cbse10e.f1.surgery
  title: A Triumph of Surgery (James Herriot)
  notes: |
    Mrs Pumphrey, a rich lady, overfeeds her Pekinese dog Tricki with cream cakes, chocolates, malt and cod
    liver oil, and gives him little exercise; he becomes fat and lethargic and stops eating. The vet, James
    Herriot, takes him to his surgery for treatment, though he says it is a matter of diet. For two days he
    gives Tricki no food, only water; Tricki starts playing with the other dogs and joining them at meals. Mrs
    Pumphrey sends eggs, wine and brandy, which the vets enjoy. After about a fortnight Tricki is healthy and
    goes home; Mrs Pumphrey calls it 'a triumph of surgery'. Humour and irony: no surgery was done.
  explanations:
    text: Mrs Pumphrey loves her dog Tricki so much that she overfeeds him until he is fat and ill. The vet takes Tricki to his surgery, gives him no rich food, and lets him run with other dogs. Tricki recovers, and Mrs Pumphrey calls it 'a triumph of surgery', though the cure was only diet and exercise.
    visual: Picture a fat little Pekinese on a velvet cushion surrounded by cakes; then the same dog, slim and happy, racing around a yard with big dogs.
    step_by_step: 'Step 1: The problem: overfeeding, no exercise. Step 2: The vet''s plan: take Tricki away. Step 3: The cure: no food at first, then playing and eating with other dogs. Step 4: The irony: no surgery at all.'
    real_world: Doctors often say the best medicine for many illnesses is simply better food and more exercise, as Tricki's cure shows.
  picture:
    kind: flow
    steps:
    - Mrs Pumphrey overfeeds Tricki
    - Tricki becomes fat and ill
    - Herriot takes him to the surgery
    - No rich food, play with other dogs
    - 'Tricki recovers: ''a triumph of surgery'''
    alt: 'Tricki''s story: overfed and ill, taken to the vet''s surgery, cured by diet and play, and praised as a triumph of surgery.'
  activity:
    type: sort
    prompt: 'A Triumph of Surgery: what made Tricki ill, and what cured him?'
    bins:
    - Made him ill
    - Cured him
    items:
    - label: Cream cakes and chocolates
      bin: Made him ill
      clue: Rich food.
      why: Overfeeding sweets made him fat and ill.
    - label: Two days of only water
      bin: Cured him
      clue: The vet's plan.
      why: Herriot's diet of only water helped him.
    - label: Very little exercise
      bin: Made him ill
      clue: Lazy days.
      why: Lack of exercise made him lethargic.
    - label: Playing with the other dogs
      bin: Cured him
      clue: Running and fun.
      why: Exercise with other dogs restored his health.
    - label: Malt and cod liver oil
      bin: Made him ill
      clue: Extra 'tonics'.
      why: These extras were part of the overfeeding.
  items:
  - prompt: What kind of dog was Tricki?
    options:
    - A Pekinese
    - A German Shepherd
    - A Labrador
    - A Bulldog
    answer: A Pekinese
    difficulty: 1
    hints:
    - A small breed.
    - Lap dog.
    solution: Tricki was a Pekinese.
    mistakes: {"A German Shepherd": "e10_tricki_breed"}
  - prompt: Why did Tricki fall ill?
    options:
    - He was overfed and got too little exercise
    - He caught an infection
    - He was hit by a car
    - He ate poison
    answer: He was overfed and got too little exercise
    difficulty: 1
    hints:
    - Cream cakes and chocolate.
    - Mrs Pumphrey's love.
    solution: Overfeeding and no exercise made him fat and lethargic.
    mistakes: {"He caught an infection": "e10_tricki_ill"}
  - prompt: What did Herriot give Tricki for the first two days?
    options:
    - Only water, no food
    - Medicine injections
    - Cream cakes
    - Surgery
    answer: Only water, no food
    difficulty: 2
    hints:
    - Starting the cure.
    - No food at all.
    solution: He gave Tricki no food, just plenty of water, for two days.
    mistakes: {"Cream cakes": "e10_tricki_diet"}
  - prompt: Why is the title 'A Triumph of Surgery' ironic?
    options:
    - No surgery was done; diet and exercise cured him
    - The surgery failed
    - Tricki died
    - Herriot was not a vet
    answer: No surgery was done; diet and exercise cured him
    difficulty: 2
    hints:
    - Mrs Pumphrey's words.
    - What actually cured him?
    solution: Mrs Pumphrey thinks surgery saved Tricki, but it was only proper food and play.
    mistakes: {"The surgery failed": "e10_surgery_irony"}
  - prompt: What did Mrs Pumphrey send to the surgery while Tricki was there?
    options:
    - Eggs, wine and brandy
    - Toys for Tricki
    - Money for the vet
    - Flowers
    answer: Eggs, wine and brandy
    difficulty: 2
    hints:
    - For Tricki's 'recovery'.
    - The vets enjoyed them.
    solution: She sent fresh eggs, wine and brandy, which the vets enjoyed.
    mistakes: {"Money for the vet": "e10_pumphrey_sends"}
  - prompt: How did Tricki start eating again?
    options:
    - By joining the other dogs at mealtimes
    - From Mrs Pumphrey's hand
    - By force-feeding
    - By surgery
    answer: By joining the other dogs at mealtimes
    difficulty: 1
    hints:
    - Competition at the bowl.
    - He played with them.
    solution: He began rushing to eat with the other dogs.
    mistakes: {"From Mrs Pumphrey's hand": "e10_tricki_eats"}
