# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 1.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 10
title: A Triumph of Surgery (James Herriot)
tips:
  e10_pumphrey_sends: "She sent rich food and drink to 'build Tricki up', which Herriot's staff enjoyed."
  e10_surgery_irony: "Did Herriot ever operate on Tricki? Think of what really cured him."
  e10_tricki_breed: "Tricki was a small, fluffy lapdog, a breed from China."
  e10_tricki_diet: "Cream cakes made him ill. Herriot did the opposite of overfeeding."
  e10_tricki_eats: "At the surgery he was with many other dogs. How did that help his appetite?"
  e10_tricki_ill: "Mrs Pumphrey fed him cream cakes and chocolates and he hardly walked."
  e10f1_cure: Herriot's 'treatment' was really about food and exercise, not medicine. Think what he changed in Tricki's life.
  e10f1_pumphrey: Mrs Pumphrey loves Tricki deeply but spoils him. Ask whether the choice shows love, spoiling, or Herriot's view.

concepts:
- code: cbse10e.f1.surgery
  title: A Triumph of Surgery (James Herriot)
  notes: |
    Mrs Pumphrey, a rich lady, overfeeds her Pekinese dog Tricki with cream cakes, chocolates, malt and cod
    liver oil, and gives him little exercise; he becomes fat and lethargic and stops eating. The vet, James
    Herriot, takes him to his surgery for treatment, though he says it is a matter of diet. For two days he
    gives Tricki no food, only water; Tricki starts playing with the other dogs and joining them at meals. Mrs
    Pumphrey sends eggs, wine and brandy, which the vets enjoy. After about a fortnight Tricki is healthy and
    goes home; Mrs Pumphrey calls it 'a triumph of surgery'. Humour and irony: no surgery was done.
  explanations:
    text: Mrs Pumphrey loves her dog Tricki so much that she overfeeds him until he is fat and ill. The vet takes Tricki to his surgery, gives him no rich food, and lets him run with other dogs. Tricki recovers, and Mrs Pumphrey calls it 'a triumph of surgery', though the cure was only diet and exercise.
    visual: Picture a fat little Pekinese on a velvet cushion surrounded by cakes; then the same dog, slim and happy, racing around a yard with big dogs.
    step_by_step: 'Step 1: The problem: overfeeding, no exercise. Step 2: The vet''s plan: take Tricki away. Step 3: The cure: no food at first, then playing and eating with other dogs. Step 4: The irony: no surgery at all.'
    real_world: Doctors often say the best medicine for many illnesses is simply better food and more exercise, as Tricki's cure shows.
  picture:
    kind: flow
    steps:
    - Mrs Pumphrey overfeeds Tricki
    - Tricki becomes fat and ill
    - Herriot takes him to the surgery
    - No rich food, play with other dogs
    - 'Tricki recovers: ''a triumph of surgery'''
    alt: 'Tricki''s story: overfed and ill, taken to the vet''s surgery, cured by diet and play, and praised as a triumph of surgery.'
  activity:
    type: sort
    prompt: 'A Triumph of Surgery: what made Tricki ill, and what cured him?'
    bins:
    - Made him ill
    - Cured him
    items:
    - label: Cream cakes and chocolates
      bin: Made him ill
      clue: Rich food.
      why: Overfeeding sweets made him fat and ill.
    - label: Two days of only water
      bin: Cured him
      clue: The vet's plan.
      why: Herriot's diet of only water helped him.
    - label: Very little exercise
      bin: Made him ill
      clue: Lazy days.
      why: Lack of exercise made him lethargic.
    - label: Playing with the other dogs
      bin: Cured him
      clue: Running and fun.
      why: Exercise with other dogs restored his health.
    - label: Malt and cod liver oil
      bin: Made him ill
      clue: Extra 'tonics'.
      why: These extras were part of the overfeeding.
  lesson:
    - teach: In 'A Triumph of Surgery' by James Herriot, a vet, the rich Mrs Pumphrey owns Tricki, a Pekingese she loves dearly. She overfeeds him with cream cakes, chocolates, malt, cod-liver oil and Horlicks, and he gets little exercise. Tricki becomes fat, listless, refuses food and vomits.
      check:
        prompt: Why did Tricki fall ill?
        options:
        - Overfeeding and too little exercise
        - A broken leg
        - An infection from other dogs
        answer: Overfeeding and too little exercise
        why: He was spoilt with rich food.
    - teach: Herriot takes Tricki to his surgery, though Mrs Pumphrey weeps. He gives him no food for two days, only water. Tricki starts joining the other dogs, running and playing. Meanwhile Mrs Pumphrey sends eggs, and bottles of wine and brandy 'to build up his strength', which Herriot and his colleagues enjoy.
      picture:
        kind: flow
        steps:
        - Overfed, falls ill
        - Taken to the surgery
        - 'Two days: water only'
        - Plays with other dogs
        - Returns fit after two weeks
        alt: 'Tricki''s cure: overfed and ill, taken to the surgery, given only water for two days, plays with the other dogs, and returns fit after about two weeks.'
      check:
        prompt: What did Herriot give Tricki for the first two days?
        options:
        - Only water
        - Cream cakes
        - Medicines and injections
        answer: Only water
        why: A starvation diet to set him right.
    - teach: 'After about two weeks Tricki is fit and lively. Mrs Pumphrey, overjoyed, calls it ''a triumph of surgery''. The title is ironic: no surgery or medicine was used; the cure was simply a proper diet and exercise. The story gently mocks rich people who spoil pets and shows that too much love can harm.'
      check:
        prompt: What really cured Tricki?
        options:
        - Diet and exercise
        - An operation
        - A strong medicine
        answer: Diet and exercise
        why: That is why the title is ironic.
  items:
  - prompt: What kind of dog was Tricki?
    options:
    - A Pekinese
    - A German Shepherd
    - A Labrador
    - A Bulldog
    answer: A Pekinese
    difficulty: 1
    hints:
    - A small breed.
    - Lap dog.
    solution: Tricki was a Pekinese.
    mistakes: {"A German Shepherd": "e10_tricki_breed"}
  - prompt: Why did Tricki fall ill?
    options:
    - He was overfed and got too little exercise
    - He caught an infection
    - He was hit by a car
    - He ate poison
    answer: He was overfed and got too little exercise
    difficulty: 1
    hints:
    - Cream cakes and chocolate.
    - Mrs Pumphrey's love.
    solution: Overfeeding and no exercise made him fat and lethargic.
    mistakes: {"He caught an infection": "e10_tricki_ill"}
  - prompt: What did Herriot give Tricki for the first two days?
    options:
    - Only water, no food
    - Medicine injections
    - Cream cakes
    - Surgery
    answer: Only water, no food
    difficulty: 2
    hints:
    - Starting the cure.
    - No food at all.
    solution: He gave Tricki no food, just plenty of water, for two days.
    mistakes: {"Cream cakes": "e10_tricki_diet"}
  - prompt: Why is the title 'A Triumph of Surgery' ironic?
    options:
    - No surgery was done; diet and exercise cured him
    - The surgery failed
    - Tricki died
    - Herriot was not a vet
    answer: No surgery was done; diet and exercise cured him
    difficulty: 2
    hints:
    - Mrs Pumphrey's words.
    - What actually cured him?
    solution: Mrs Pumphrey thinks surgery saved Tricki, but it was only proper food and play.
    mistakes: {"The surgery failed": "e10_surgery_irony"}
  - prompt: What did Mrs Pumphrey send to the surgery while Tricki was there?
    options:
    - Eggs, wine and brandy
    - Toys for Tricki
    - Money for the vet
    - Flowers
    answer: Eggs, wine and brandy
    difficulty: 2
    hints:
    - For Tricki's 'recovery'.
    - The vets enjoyed them.
    solution: She sent fresh eggs, wine and brandy, which the vets enjoyed.
    mistakes: {"Money for the vet": "e10_pumphrey_sends"}
  - prompt: How did Tricki start eating again?
    options:
    - By joining the other dogs at mealtimes
    - From Mrs Pumphrey's hand
    - By force-feeding
    - By surgery
    answer: By joining the other dogs at mealtimes
    difficulty: 1
    hints:
    - Competition at the bowl.
    - He played with them.
    solution: He began rushing to eat with the other dogs.
    mistakes: {"From Mrs Pumphrey's hand": "e10_tricki_eats"}
  - prompt: What is James Herriot's profession in the story?
    options:
    - A veterinary surgeon
    - A doctor for people
    - A chef
    - A dog trainer
    answer: A veterinary surgeon
    difficulty: 1
    hints:
    - He treats animals.
    - He has a surgery for them.
    solution: Herriot is a vet.
    mistakes:
      A dog trainer: eng10_read_again
  - prompt: Which of these did Mrs Pumphrey give Tricki between meals?
    options:
    - Cream cakes and chocolates
    - Raw vegetables
    - Only water
    - Dry dog biscuits
    answer: Cream cakes and chocolates
    difficulty: 1
    hints:
    - Sweet, rich snacks.
    - She spoilt him.
    solution: She fed him cream cakes and chocolates between meals.
    mistakes:
      Only water: e10f1_cure
  - prompt: Why did Mrs Pumphrey weep when Tricki was taken away?
    options:
    - She loved him and could not bear to part from him
    - She was angry with Herriot
    - She was ill
    - She had lost money
    answer: She loved him and could not bear to part from him
    difficulty: 2
    hints:
    - She treated him like a child.
    - Separation hurt her.
    solution: She was deeply attached to Tricki.
    mistakes:
      She was angry with Herriot: e10f1_pumphrey
  - prompt: Why did Mrs Pumphrey send eggs, wine and brandy to the surgery?
    options:
    - To build up Tricki's strength
    - As a gift for the staff's party
    - To pay the bill
    - For the other dogs
    answer: To build up Tricki's strength
    difficulty: 2
    hints:
    - She thought Tricki needed nourishment.
    - Herriot enjoyed them instead.
    solution: She sent them to build up Tricki's strength, but Herriot and his colleagues enjoyed them.
    mistakes:
      To pay the bill: e10f1_pumphrey
  - prompt: How did Tricki change during his stay at the surgery?
    options:
    - He became active and played with the other dogs
    - He became fatter
    - He slept all day
    - He refused to drink water
    answer: He became active and played with the other dogs
    difficulty: 2
    hints:
    - He was among other dogs.
    - He ran around.
    solution: Tricki joined the pack of dogs, ran about and became lively.
    mistakes:
      He became fatter: e10f1_cure
  - prompt: Why did Herriot not tell Mrs Pumphrey the truth about the cure?
    options:
    - He did not want to hurt her feelings, and he enjoyed her gifts
    - He forgot
    - She would not let him speak
    - He did not know
    answer: He did not want to hurt her feelings, and he enjoyed her gifts
    difficulty: 3
    hints:
    - He was kind to her.
    - The eggs and wine were welcome.
    solution: He kindly let her believe it was medical skill.
    mistakes:
      He did not know: e10f1_cure
  - prompt: What does the story suggest about Mrs Pumphrey's love?
    options:
    - Excessive love and pampering can harm a pet
    - She did not care for Tricki
    - Pets should never be loved
    - She was a cruel owner
    answer: Excessive love and pampering can harm a pet
    difficulty: 2
    hints:
    - She loved him too much.
    - Her love made him ill.
    solution: Her overindulgence made Tricki sick.
    mistakes:
      She was a cruel owner: e10f1_pumphrey
  - prompt: How did Mrs Pumphrey describe Tricki's recovery?
    options:
    - As a triumph of surgery
    - As a miracle of God
    - As her own achievement
    - As bad luck
    answer: As a triumph of surgery
    difficulty: 1
    hints:
    - Read the title.
    - She credited Herriot's skill.
    solution: She called it 'a triumph of surgery'.
    mistakes:
      As a miracle of God: e10f1_pumphrey
  - prompt: Which word best describes Herriot's attitude to Tricki?
    options:
    - Caring and sensible
    - Cruel
    - Careless
    - Greedy for money
    answer: Caring and sensible
    difficulty: 2
    hints:
    - He knew what Tricki truly needed.
    - He was fond of the dog.
    solution: Herriot cared for Tricki and treated him sensibly.
    mistakes:
      Cruel: e10f1_cure
