concepts:
- code: cbse10e.f6.ebright
  title: The Making of a Scientist (Robert W. Peterson)
  notes: |
    Richard H. Ebright grew up in Reading, Pennsylvania, and collected butterflies from kindergarten. His mother
    encouraged him with books, telescopes, microscopes and trips. A book, 'The Travels of Monarchs', invited
    readers to tag monarch butterflies for research by Dr Frederick Urquhart of the University of Toronto. In
    seventh grade he lost a county science fair, which taught him that a real experiment is needed. He studied
    the viceroy butterfly, which copies the monarch (mimicry: birds avoid monarchs because they taste bad). In
    high school he discovered an unknown insect hormone in the gold spots of the monarch pupa. Later he and a
    college roommate published a theory of how cells read their DNA. He was also a debater, public speaker,
    canoeist and Eagle Scout. Ingredients of a scientist: a first-rate mind, curiosity, and the will to win for
    the right reasons.
  explanations:
    text: 'Richard Ebright began collecting butterflies as a small child. With his mother''s encouragement and the challenge of science fairs, he moved from collecting to real experiments, discovering a new insect hormone in high school and later a theory about how cells read DNA. His story shows what makes a scientist: curiosity, hard work and the wish to do your best.'
    visual: Picture a boy in a field with a butterfly net, then the same boy in a lab with a microscope, a monarch pupa and its gold spots under the lens.
    step_by_step: 'Step 1: Childhood: butterflies and his mother''s support. Step 2: The tagging project with Dr Urquhart. Step 3: Losing the science fair: experiments matter. Step 4: Discoveries: the viceroy, the hormone, DNA. Step 5: What makes a scientist.'
    real_world: 'Many science fairs in Indian schools give students the same push Ebright got: a reason to turn a hobby into an experiment.'
  picture:
    kind: flow
    steps:
    - 'Kindergarten: starts collecting butterflies'
    - Tags monarchs for Dr Urquhart
    - 'Seventh grade: loses a science fair'
    - Studies viceroy mimicry; finds a pupa hormone
    - 'Later: a new theory of how cells read DNA'
    alt: 'Ebright''s path: collecting butterflies, tagging monarchs, losing a science fair, discovering a hormone, and a theory about DNA.'
  activity:
    type: sort
    prompt: 'The Making of a Scientist: what did Ebright do?'
    bins:
    - As a boy
    - In high school
    - Later
    items:
    - label: Collected butterflies from kindergarten
      bin: As a boy
      clue: Very young.
      why: This began in kindergarten.
    - label: Tagged monarchs for Dr Urquhart
      bin: As a boy
      clue: After reading a book.
      why: The Travels of Monarchs got him tagging as a child.
    - label: Found a hormone in the monarch pupa's gold spots
      bin: In high school
      clue: A real experiment.
      why: This was his high-school discovery.
    - label: A theory of how cells read DNA
      bin: Later
      clue: With a college roommate.
      why: This came later, at college.
    - label: Lost a county science fair
      bin: As a boy
      clue: Seventh grade.
      why: In seventh grade he learnt he needed a real experiment.
  items:
  - prompt: What did Ebright collect as a child?
    options:
    - Butterflies
    - Stamps
    - Coins
    - Shells
    answer: Butterflies
    difficulty: 1
    hints:
    - Monarchs especially.
    - From kindergarten.
    solution: He collected butterflies, along with rocks, fossils and coins.
    mistakes: {"Stamps": "e10_ebright_collect"}
  - prompt: Who encouraged Ebright most in his early years?
    options:
    - His mother
    - His grandfather
    - A neighbour
    - His sister
    answer: His mother
    difficulty: 1
    hints:
    - She bought him books and equipment.
    - His father died when he was in third grade.
    solution: His mother supported him with books, telescopes and trips.
    mistakes: {"His grandfather": "e10_ebright_mother"}
  - prompt: Which researcher asked readers to tag monarch butterflies?
    options:
    - Dr Frederick Urquhart
    - Dr Herriot
    - Dr Griffin
    - Dr Jaffers
    answer: Dr Frederick Urquhart
    difficulty: 2
    hints:
    - University of Toronto.
    - Study of migration.
    solution: Dr Urquhart of the University of Toronto studied monarch migration.
    mistakes: {"Dr Herriot": "e10_urquhart"}
  - prompt: What lesson did Ebright learn from losing the science fair?
    options:
    - A real experiment is needed, not just a display
    - Science fairs are unfair
    - He should stop studying insects
    - Only winning matters
    answer: A real experiment is needed, not just a display
    difficulty: 2
    hints:
    - His frog-tissue slides lost.
    - Winners had done experiments.
    solution: He realised that winners did real experiments, not just displays.
    mistakes: {"Science fairs are unfair": "e10_science_fair"}
  - prompt: What did Ebright discover in the gold spots of the monarch pupa?
    options:
    - An unknown insect hormone
    - A new colour
    - Poison
    - Eggs
    answer: An unknown insect hormone
    difficulty: 2
    hints:
    - Needed for the butterfly's full development.
    - High school project.
    solution: He found a previously unknown hormone in the gold spots.
    mistakes: {"A new colour": "e10_gold_spots"}
  - prompt: Why do birds avoid monarch butterflies?
    options:
    - Monarchs taste bad to them
    - Monarchs are too big
    - Monarchs sting
    - Monarchs fly too high
    answer: Monarchs taste bad to them
    difficulty: 2
    hints:
    - Viceroys copy them.
    - Mimicry.
    solution: Monarchs taste bad, so birds avoid them; viceroys look similar and are spared too.
    mistakes: {"Monarchs sting": "e10_viceroy"}
