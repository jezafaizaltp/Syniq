    answer: A first-rate mind, curiosity, and the will to win for the right reasons
    difficulty: 2
    hints:
    - Three qualities are named.
    - Curiosity is one.
    solution: The writer lists a first-rate mind, curiosity, and the will to win for the right reasons.
    mistakes:
      Luck and good marks: e10f6_qualities
  - prompt: Which illness did Ebright study in monarch caterpillars in eighth grade?
    options:
    - A virus disease that kills nearly all monarch caterpillars every few years
    - A disease that turns them blue
    - Malaria
    - A disease of the wings only
    answer: A virus disease that kills nearly all monarch caterpillars every few years
    difficulty: 3
    hints:
    - It struck in cycles.
    - It was caused by a virus.
    solution: He sought the cause of a virus disease that wipes out monarch caterpillars every few years.
    mistakes:
      Malaria: e10f6_steps
