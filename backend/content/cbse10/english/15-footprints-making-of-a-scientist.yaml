# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 6.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 15
title: The Making of a Scientist (Robert W. Peterson)
tips:
  e10_ebright_collect: "Ebright's whole science career started with an insect."
  e10_ebright_mother: "His father died when he was young. Who bought him books and telescopes?"
  e10_gold_spots: "He found that the gold spots made a chemical needed for growth."
  e10_science_fair: "He had only shown slides of frog tissue. What were the winners doing instead?"
  e10_urquhart: "Herriot is the vet from another story. The tagging researcher studied butterfly migration."
  e10_viceroy: "Viceroy butterflies copy the monarch's look. Why would looking like a monarch protect them?"
  e10f6_steps: Ebright's projects grew one after another, from collecting to real experiments. Place the event in his path.
  e10f6_qualities: "Think about Ebright himself: the writer describes what kind of mind and attitude made him a scientist, and what he did with his time. Which choice fits that?"

concepts:
- code: cbse10e.f6.ebright
  title: The Making of a Scientist (Robert W. Peterson)
  notes: |
    Richard H. Ebright grew up in Reading, Pennsylvania, and collected butterflies from kindergarten. His mother
    encouraged him with books, telescopes, microscopes and trips. A book, 'The Travels of Monarchs', invited
    readers to tag monarch butterflies for research by Dr Frederick Urquhart of the University of Toronto. In
    seventh grade he lost a county science fair, which taught him that a real experiment is needed. He studied
    the viceroy butterfly, which copies the monarch (mimicry: birds avoid monarchs because they taste bad). In
    high school he discovered an unknown insect hormone in the gold spots of the monarch pupa. Later he and a
    college roommate published a theory of how cells read their DNA. He was also a debater, public speaker,
    canoeist and Eagle Scout. Ingredients of a scientist: a first-rate mind, curiosity, and the will to win for
    the right reasons.
  explanations:
    text: 'Richard Ebright began collecting butterflies as a small child. With his mother''s encouragement and the challenge of science fairs, he moved from collecting to real experiments, discovering a new insect hormone in high school and later a theory about how cells read DNA. His story shows what makes a scientist: curiosity, hard work and the wish to do your best.'
    visual: Picture a boy in a field with a butterfly net, then the same boy in a lab with a microscope, a monarch pupa and its gold spots under the lens.
    step_by_step: 'Step 1: Childhood: butterflies and his mother''s support. Step 2: The tagging project with Dr Urquhart. Step 3: Losing the science fair: experiments matter. Step 4: Discoveries: the viceroy, the hormone, DNA. Step 5: What makes a scientist.'
    real_world: 'Many science fairs in Indian schools give students the same push Ebright got: a reason to turn a hobby into an experiment.'
  picture:
    kind: flow
    steps:
    - 'Kindergarten: starts collecting butterflies'
    - Tags monarchs for Dr Urquhart
    - 'Seventh grade: loses a science fair'
    - Studies viceroy mimicry; finds a pupa hormone
    - 'Later: a new theory of how cells read DNA'
    alt: 'Ebright''s path: collecting butterflies, tagging monarchs, losing a science fair, discovering a hormone, and a theory about DNA.'
  activity:
    type: sort
    prompt: 'The Making of a Scientist: what did Ebright do?'
    bins:
    - As a boy
    - In high school
    - Later
    items:
    - label: Collected butterflies from kindergarten
      bin: As a boy
      clue: Very young.
      why: This began in kindergarten.
    - label: Tagged monarchs for Dr Urquhart
      bin: As a boy
      clue: After reading a book.
      why: The Travels of Monarchs got him tagging as a child.
    - label: Found a hormone in the monarch pupa's gold spots
      bin: In high school
      clue: A real experiment.
      why: This was his high-school discovery.
    - label: A theory of how cells read DNA
      bin: Later
      clue: With a college roommate.
      why: This came later, at college.
    - label: Lost a county science fair
      bin: As a boy
      clue: Seventh grade.
      why: In seventh grade he learnt he needed a real experiment.
  lesson:
    - teach: '''The Making of a Scientist'' by Robert W. Peterson tells how Richard H. Ebright grew from a curious boy in Reading, Pennsylvania, into a scientist. As a child he collected everything: butterflies, rocks, fossils and coins. His mother encouraged him, bought him equipment, and gave him the book ''The Travels of Monarch X'', which opened the world of science to him.'
      check:
        prompt: Which book opened the world of science to Ebright?
        options:
        - The Travels of Monarch X
        - The Diary of Anne Frank
        - Mother Goose
        answer: The Travels of Monarch X
        why: A gift from his mother.
    - teach: The book invited readers to help Dr Frederick A. Urquhart of the University of Toronto study monarch migration by tagging butterflies. In seventh grade Ebright lost a science fair because others had done real experiments; he learned that he must do real experiments. In eighth grade he found the cause of a virus disease that kills nearly all monarch caterpillars every few years, and later tested whether viceroy butterflies copy monarchs.
      picture:
        kind: flow
        steps:
        - Collects butterflies
        - Tags monarchs for Urquhart
        - Loses science fair
        - Does real experiments
        - 'Gold spots: a hormone'
        - How cells read DNA
        alt: 'Ebright''s path: collecting butterflies, tagging monarchs, losing a science fair, doing real experiments, finding the gold spots make a hormone, and studying how cells read DNA.'
      check:
        prompt: What did Ebright learn from losing the science fair?
        options:
        - He needed to do real experiments
        - He should stop doing science
        - Judges are unfair
        answer: He needed to do real experiments
        why: Winners had tested ideas, not just displayed.
    - teach: Ebright showed that the twelve gold spots on a monarch pupa produce a hormone needed for the butterfly's full development. Later he studied how cells read their DNA. He was also a debater, public speaker, canoeist and Eagle Scout, and graduated from Harvard with highest honours. The writer says a scientist needs a first-rate mind, curiosity, and the will to win for the right reasons.
      check:
        prompt: What did Ebright find about the gold spots?
        options:
        - They produce a hormone for the butterfly's development
        - They are only decoration
        - They are eyes
        answer: They produce a hormone for the butterfly's development
        why: He tested this in experiments.
  items:
  - prompt: What did Ebright collect as a child?
    options:
    - Butterflies
    - Stamps
    - Coins
    - Shells
    answer: Butterflies
    difficulty: 1
    hints:
    - Monarchs especially.
    - From kindergarten.
    solution: He collected butterflies, along with rocks, fossils and coins.
    mistakes: {"Stamps": "e10_ebright_collect"}
  - prompt: Who encouraged Ebright most in his early years?
    options:
    - His mother
    - His grandfather
    - A neighbour
    - His sister
    answer: His mother
    difficulty: 1
    hints:
    - She bought him books and equipment.
    - His father died when he was in third grade.
    solution: His mother supported him with books, telescopes and trips.
    mistakes: {"His grandfather": "e10_ebright_mother"}
  - prompt: Which researcher asked readers to tag monarch butterflies?
    options:
    - Dr Frederick Urquhart
    - Dr Herriot
    - Dr Griffin
    - Dr Jaffers
    answer: Dr Frederick Urquhart
    difficulty: 2
    hints:
    - University of Toronto.
    - Study of migration.
    solution: Dr Urquhart of the University of Toronto studied monarch migration.
    mistakes: {"Dr Herriot": "e10_urquhart"}
  - prompt: What lesson did Ebright learn from losing the science fair?
    options:
    - A real experiment is needed, not just a display
    - Science fairs are unfair
    - He should stop studying insects
    - Only winning matters
    answer: A real experiment is needed, not just a display
    difficulty: 2
    hints:
    - His frog-tissue slides lost.
    - Winners had done experiments.
    solution: He realised that winners did real experiments, not just displays.
    mistakes: {"Science fairs are unfair": "e10_science_fair"}
  - prompt: What did Ebright discover in the gold spots of the monarch pupa?
    options:
    - An unknown insect hormone
    - A new colour
    - Poison
    - Eggs
    answer: An unknown insect hormone
    difficulty: 2
    hints:
    - Needed for the butterfly's full development.
    - High school project.
    solution: He found a previously unknown hormone in the gold spots.
    mistakes: {"A new colour": "e10_gold_spots"}
  - prompt: Why do birds avoid monarch butterflies?
    options:
    - Monarchs taste bad to them
    - Monarchs are too big
    - Monarchs sting
    - Monarchs fly too high
    answer: Monarchs taste bad to them
    difficulty: 2
    hints:
    - Viceroys copy them.
    - Mimicry.
    solution: Monarchs taste bad, so birds avoid them; viceroys look similar and are spared too.
    mistakes: {"Monarchs sting": "e10_viceroy"}
  - prompt: Where did Ebright grow up?
    options:
    - Reading, Pennsylvania
    - Toronto, Canada
    - London, England
    - Iping
    answer: Reading, Pennsylvania
    difficulty: 2
    hints:
    - A town in the United States.
    - It shares its name with an activity.
    solution: Ebright grew up in Reading, Pennsylvania.
    mistakes:
      Toronto, Canada: e10f6_steps
  - prompt: At which university was Dr Urquhart?
    options:
    - University of Toronto
    - Harvard
    - Oxford
    - Delhi University
    answer: University of Toronto
    difficulty: 2
    hints:
    - He was in Canada.
    - Not the university Ebright went to.
    solution: Dr Frederick Urquhart was at the University of Toronto.
    mistakes:
      Harvard: e10f6_steps
  - prompt: Why did Ebright's interest in tagging butterflies fade?
    options:
    - It was tedious, and very few tagged butterflies were ever recaptured
    - His mother stopped him
    - He lost his net
    - He moved to a city
    answer: It was tedious, and very few tagged butterflies were ever recaptured
    difficulty: 3
    hints:
    - He got almost no results.
    - Only two were ever found.
    solution: Tagging was slow and only two of his butterflies were recaptured.
    mistakes:
      His mother stopped him: e10f6_steps
  - prompt: Which theory did Ebright test about viceroys?
    options:
    - That viceroys copy monarchs because birds avoid monarchs
    - That viceroys are poisonous plants
    - That viceroys migrate to Mexico
    - That viceroys are larger than eagles
    answer: That viceroys copy monarchs because birds avoid monarchs
    difficulty: 3
    hints:
    - It is about looking alike.
    - Birds dislike the taste of monarchs.
    solution: He tested whether viceroys mimic monarchs to escape birds.
    mistakes:
      That viceroys migrate to Mexico: e10f6_steps
  - prompt: How did Ebright's mother help him?
    options:
    - She took him on trips, bought him telescopes and microscopes, and gave him books
    - She did his homework
    - She sold his collections
    - She kept him from school
    answer: She took him on trips, bought him telescopes and microscopes, and gave him books
    difficulty: 2
    hints:
    - She encouraged his curiosity.
    - She provided equipment.
    solution: His mother encouraged him with trips, equipment and books.
    mistakes:
      She did his homework: e10f6_qualities
  - prompt: What did Ebright later study about cells?
    options:
    - How cells read their DNA blueprint
    - How cells change colour
    - How cells make sugar
    - How cells fly
    answer: How cells read their DNA blueprint
    difficulty: 3
    hints:
    - It is about genetics.
    - The cell's instructions.
    solution: He and his roommate developed a theory of how cells read their DNA.
    mistakes:
      How cells make sugar: e10f6_steps
  - prompt: Which of these was NOT one of Ebright's interests?
    options:
    - Professional football
    - Debating
    - Canoeing
    - Public speaking
    answer: Professional football
    difficulty: 2
    hints:
    - He was a skilled speaker and outdoorsman.
    - Which is a sport he never mentions?
    solution: He was a debater, public speaker and canoeist, not a footballer.
    mistakes:
      Canoeing: e10f6_qualities
  - prompt: According to the writer, what is needed to make a scientist?
    options:
    - A first-rate mind, curiosity, and the will to win for the right reasons
