chapter: 6
title: Mijbil the Otter · Fog
concepts:
- code: cbse10e.u6.mijbil
  title: Mijbil the Otter (Gavin Maxwell)
  notes: |
    In 1956 Gavin Maxwell, in Basra, Iraq, decided to keep an otter instead of a dog. A friend sent him a young
    otter from the marshes, which he named Mijbil (Mij). It turned out to be a new subspecies, later called
    Maxwell's otter (Lutrogale perspicillata maxwelli). Mij loved water: he played in the bath, splashing and
    wallowing, and could turn on the tap himself. He played with marbles and a rubber ball. The airline would
    not let pets in the cabin, so Mij travelled in a box; he tore the lining and got out, causing chaos, and an
    air hostess let Maxwell keep him on his knee. In London people guessed what he was: a baby seal, a squirrel,
    a walrus, a hippo, a beaver, a bear cub, a leopard, even a 'brontosaur'.
  explanations:
    text: Gavin Maxwell, living in Iraq, adopts a playful young otter called Mijbil. Mij loves water, plays with marbles and a ball, causes chaos on a flight to London, and baffles Londoners who can't guess what animal he is. He turns out to be a new kind of otter, named after Maxwell.
    visual: Picture an otter in a bathtub splashing water everywhere, rolling a marble across a suitcase lid, and peeping out of a torn box on an aeroplane while passengers scream.
    step_by_step: 'Step 1: Where and when: Basra, 1956. Step 2: How Maxwell got Mij. Step 3: Mij''s habits: water, toys. Step 4: The journey: the box and the flight. Step 5: London: people''s guesses.'
    real_world: Like Mij, pets can't tell us what they need, so owners learn by watching how they play and what they love.
  picture:
    kind: flow
    steps:
    - '1956: Maxwell in Basra wants an otter'
    - A friend sends young Mijbil from the marshes
    - Mij loves water and plays with marbles
    - 'Flight to London: Mij escapes his box'
    - Londoners guess wildly what he is
    alt: 'Mijbil''s story: Maxwell gets the otter in Basra in 1956, Mij''s love of water and play, the chaotic flight, and Londoners'' guesses.'
  items:
  - prompt: Where was Gavin Maxwell when he got Mijbil?
    options:
    - Basra, Iraq
    - London
    - Delhi
    - Cairo
    answer: Basra, Iraq
    difficulty: 1
    hints:
    - In the Middle East.
    - Near the marshes.
    solution: Maxwell was in Basra, Iraq.
  - prompt: In which year did Maxwell get Mijbil?
    answer: '1956'
    check: '1956'
    difficulty: 2
    hints:
    - Mid-twentieth century.
    - The 1950s.
    solution: The story is set in 1956.
  - prompt: What did Mijbil love most?
    options:
    - Water
    - Sand
    - Snow
    - Fire
    answer: Water
    difficulty: 1
    hints:
    - The bath.
    - He could turn on the tap.
    solution: 'Mij loved water: he splashed and played in the bath.'
  - prompt: What was the new subspecies of otter named?
    options:
    - Maxwell's otter
    - Mij's otter
    - Basra otter
    - London otter
    answer: Maxwell's otter
    difficulty: 2
    hints:
    - After the writer.
    - Lutrogale perspicillata maxwelli.
    solution: It was named Maxwell's otter after Gavin Maxwell.
  - prompt: Why did Mij cause trouble on the aeroplane?
    options:
    - He tore open his box and escaped
    - He bit the pilot
    - He ate the food
    - He was too heavy
    answer: He tore open his box and escaped
    difficulty: 2
    hints:
    - He hated being shut in.
    - Blood and chaos.
    solution: Mij tore the box's lining, got out, and ran about the cabin.
  - prompt: Which of these did a Londoner guess Mij was?
    options:
    - A baby seal
    - A cat
    - A rabbit
    - A parrot
    answer: A baby seal
    difficulty: 1
    hints:
    - Many strange guesses.
    - Also hippo and walrus.
    solution: People guessed a baby seal, a squirrel, a walrus, a hippo, and more.
- code: cbse10e.u6.fog
  title: Fog (Carl Sandburg)
  after:
  - cbse10e.u6.mijbil
  notes: |
    A very short poem comparing fog to a cat. The fog comes 'on little cat feet', silently; it sits looking over
    the harbour and city 'on silent haunches', and then moves on. It is an extended metaphor: the fog, like a
    cat, arrives quietly, stays a while, and leaves without warning. Free verse (no rhyme scheme).
  explanations:
    text: 'Carl Sandburg''s ''Fog'' compares fog to a cat: it creeps in silently on little cat feet, sits looking over the harbour and city, and then quietly moves on.'
    visual: Picture grey fog creeping over a harbour like a cat padding in, sitting still on its haunches to look at the city, then slipping away.
    step_by_step: 'Step 1: Find the comparison: fog and cat. Step 2: List how the fog acts: comes silently, sits, moves on. Step 3: Name the device: metaphor. Step 4: Note the form: free verse.'
    real_world: On a winter morning in Delhi, fog seems to creep in overnight, hang over the city, and vanish by noon, just like Sandburg's cat.
  picture:
    kind: compare
    columns:
    - title: The fog
      points:
      - Comes in silently
      - Hangs over harbour and city
      - Leaves without a sound
    - title: A cat
      points:
      - Walks on little silent feet
      - Sits on its haunches, watching
      - Wanders off when it likes
    alt: 'Fog compared with a cat: both arrive silently, sit watching, and leave whenever they like.'
  items:
  - prompt: To what does Sandburg compare the fog?
    options:
    - A cat
    - A dog
    - A ghost
    - A cloud
    answer: A cat
    difficulty: 1
    hints:
    - '''Little cat feet''.'
    - It sits on haunches.
    solution: The fog is compared to a cat.
  - prompt: How does the fog come?
    options:
    - On little cat feet
    - With a loud roar
    - Like a storm
    - Very fast
    answer: On little cat feet
    difficulty: 1
    hints:
    - Silently.
    - Softly.
    solution: It comes 'on little cat feet', silently.
  - prompt: What figure of speech runs through 'Fog'?
    options:
    - Metaphor
    - Simile
    - Alliteration only
    - Hyperbole
    answer: Metaphor
    difficulty: 2
    hints:
    - No 'like' or 'as'.
    - Fog is described as a cat.
    solution: The whole poem is an extended metaphor of fog as a cat.
    mistakes:
      Simile: eng10_poem_meaning
  - prompt: What does the fog look over?
    options:
    - The harbour and city
    - The forest
    - The desert
    - A school
    answer: The harbour and city
    difficulty: 1
    hints:
    - Sitting on silent haunches.
    - Near the sea.
    solution: It sits looking over the harbour and city.
  - prompt: What happens at the end of the poem?
    options:
    - The fog moves on
    - The fog becomes rain
    - The cat catches a mouse
    - The city wakes up
    answer: The fog moves on
    difficulty: 2
    hints:
    - Last words.
    - Like a cat leaving.
    solution: Then it 'moves on'.
  - prompt: Is 'Fog' written with a rhyme scheme?
    options:
    - No, it is in free verse
    - Yes, aabb
    - Yes, abab
    - It is a sonnet
    answer: No, it is in free verse
    difficulty: 2
    hints:
    - Check line endings.
    - No regular rhyme.
    solution: Fog is free verse, with no fixed rhyme scheme.
