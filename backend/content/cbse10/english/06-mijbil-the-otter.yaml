# CBSE Class 10 English (NCERT First Flight), unit 6: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 6
title: Mijbil the Otter · Fog
tips:
  e10_basra: "Maxwell was in the Middle East near the Tigris marshes, waiting for mail."
  e10_fog_cat: "Look at the phrase 'little ... feet'. Which animal walks silently like that?"
  e10_fog_city: "The fog sits looking over water where ships come in, and a town."
  e10_fog_end: "Like a cat that sits a while and then leaves, the fog does the same."
  e10_fog_quiet: "The fog arrives silently and softly, the way a pet creeps in."
  e10_free_verse: "Read the line endings aloud. Do any of them rhyme?"
  e10_maxwells_otter: "Subspecies are often named after the person who first described them."
  e10_mij_box: "Mij was shut in a box for the flight and hated it. What did he do to the box?"
  e10_mij_guess: "People guessed many sea and land animals. One guess was a young sea animal with flippers."
  e10_mij_water: "Otters swim. Mij played with the bath for hours."
  e10_mij_year: "Look for the year at the start of the story, early in the second half of the 1950s."
  e10u6_mij_play: Mij invented his own games. Think about what object he played with and where.
  e10u6_journey: "The journey from Basra to London had several stages: the box, the plane, the cabin, the flat. Think who was on the plane and able to help."
  e10u6_fog_lines: '''Fog'' is only six lines long. Recall the cat image line by line.'
  e10u6_imagery: Sandburg never says 'like a cat'; he gives the fog a cat's actions. Think about what kind of comparison that is.

concepts:
- code: cbse10e.u6.mijbil
  title: Mijbil the Otter (Gavin Maxwell)
  notes: |
    In 1956 Gavin Maxwell, in Basra, Iraq, decided to keep an otter instead of a dog. A friend sent him a young
    otter from the marshes, which he named Mijbil (Mij). It turned out to be a new subspecies, later called
    Maxwell's otter (Lutrogale perspicillata maxwelli). Mij loved water: he played in the bath, splashing and
    wallowing, and could turn on the tap himself. He played with marbles and a rubber ball. The airline would
    not let pets in the cabin, so Mij travelled in a box; he tore the lining and got out, causing chaos, and an
    air hostess let Maxwell keep him on his knee. In London people guessed what he was: a baby seal, a squirrel,
    a walrus, a hippo, a beaver, a bear cub, a leopard, even a 'brontosaur'.
  explanations:
    text: Gavin Maxwell, living in Iraq, adopts a playful young otter called Mijbil. Mij loves water, plays with marbles and a ball, causes chaos on a flight to London, and baffles Londoners who can't guess what animal he is. He turns out to be a new kind of otter, named after Maxwell.
    visual: Picture an otter in a bathtub splashing water everywhere, rolling a marble across a suitcase lid, and peeping out of a torn box on an aeroplane while passengers scream.
    step_by_step: 'Step 1: Where and when: Basra, 1956. Step 2: How Maxwell got Mij. Step 3: Mij''s habits: water, toys. Step 4: The journey: the box and the flight. Step 5: London: people''s guesses.'
    real_world: Like Mij, pets can't tell us what they need, so owners learn by watching how they play and what they love.
  picture:
    kind: flow
    steps:
    - '1956: Maxwell in Basra wants an otter'
    - A friend sends young Mijbil from the marshes
    - Mij loves water and plays with marbles
    - 'Flight to London: Mij escapes his box'
    - Londoners guess wildly what he is
    alt: 'Mijbil''s story: Maxwell gets the otter in Basra in 1956, Mij''s love of water and play, the chaotic flight, and Londoners'' guesses.'
  activity:
    type: sort
    prompt: 'Mijbil the Otter: what did Mij do?'
    bins:
    - Loved water
    - Played with toys
    - Caused chaos
    items:
    - label: Turned on the bath tap himself
      bin: Loved water
      clue: Why would he want the tap on?
      why: He wanted water so much he learnt to turn the tap.
    - label: Juggled marbles
      bin: Played with toys
      clue: Small round things.
      why: Marbles were his toys.
    - label: Tore the lining of his box on the plane
      bin: Caused chaos
      clue: In the airline.
      why: Escaping his box on the plane caused chaos.
    - label: Splashed and wallowed in the bath
      bin: Loved water
      clue: Playing in the tub.
      why: Wallowing in the bath shows his love of water.
    - label: Rolled a rubber ball
      bin: Played with toys
      clue: A bouncing thing.
      why: The rubber ball was a toy.
  lesson:
    - teach: 'In ''Mijbil the Otter'', Gavin Maxwell went to Basra in Iraq in early 1956 and decided to keep an otter. His friend found him one from the marshes of the Tigris: Mijbil. Mij turned out to be a new subspecies, later named Maxwell''s otter (Lutrogale perspicillata maxwelli). At first Mij was aloof, but within a day he came to Maxwell''s bed and slept there.'
      check:
        prompt: Where did Maxwell get Mijbil?
        options:
        - Near Basra in Iraq
        - In London
        - In Scotland
        answer: Near Basra in Iraq
        why: He was travelling in southern Iraq in 1956.
    - teach: Mij loved water. He would splash in the bathtub, and he even learned to turn on the tap himself. He played with a rubber ball, and invented a game of rolling marbles down a slanting suitcase lid. Otters, Maxwell says, need to play and to keep busy.
      check:
        prompt: What game did Mij invent with the suitcase?
        options:
        - Rolling marbles down its lid
        - Hiding inside it
        - Pulling it on a rope
        answer: Rolling marbles down its lid
        why: He tilted the lid and chased the rolling marbles.
    - teach: 'Taking Mij to England was hard: the airline would not allow pets in the cabin, so Mij was put in a box. He tore the lining and bled; Maxwell rushed to the box during the flight, and Mij escaped into the cabin, causing chaos. A kind air hostess helped. In London, people guessed wildly what Mij was: a baby seal, a squirrel, a hippo, a beaver, a bear cub, a leopard, even a ''brontosaurus''.'
      picture:
        kind: flow
        steps:
        - Mij in a lined box
        - Mij tears the lining
        - Escapes on the plane
        - Air hostess helps
        - 'London: people guess'
        alt: 'Mij''s journey to London: put in a box, tears its lining, escapes on the plane, an air hostess helps, and Londoners guess what he is.'
      check:
        prompt: Why was Mij put in a box for the flight?
        options:
        - The airline did not allow animals in the cabin
        - He liked boxes
        - He was asleep
        answer: The airline did not allow animals in the cabin
        why: So he had to travel boxed.
  items:
  - prompt: Where was Gavin Maxwell when he got Mijbil?
    options:
    - Basra, Iraq
    - London
    - Delhi
    - Cairo
    answer: Basra, Iraq
    difficulty: 1
    hints:
    - In the Middle East.
    - Near the marshes.
    solution: Maxwell was in Basra, Iraq.
    mistakes: {"Cairo": "e10_basra"}
  - prompt: In which year did Maxwell get Mijbil?
    answer: '1956'
    check: '1956'
    difficulty: 2
    hints:
    - Mid-twentieth century.
    - The 1950s.
    solution: The story is set in 1956.
    mistakes: {"1960": "e10_mij_year"}
  - prompt: What did Mijbil love most?
    options:
    - Water
    - Sand
    - Snow
    - Fire
    answer: Water
    difficulty: 1
    hints:
    - The bath.
    - He could turn on the tap.
    solution: 'Mij loved water: he splashed and played in the bath.'
    mistakes: {"Sand": "e10_mij_water"}
  - prompt: What was the new subspecies of otter named?
    options:
    - Maxwell's otter
    - Mij's otter
    - Basra otter
    - London otter
    answer: Maxwell's otter
    difficulty: 2
    hints:
    - After the writer.
    - Lutrogale perspicillata maxwelli.
    solution: It was named Maxwell's otter after Gavin Maxwell.
    mistakes: {"Mij's otter": "e10_maxwells_otter"}
  - prompt: Why did Mij cause trouble on the aeroplane?
    options:
    - He tore open his box and escaped
    - He bit the pilot
    - He ate the food
    - He was too heavy
    answer: He tore open his box and escaped
    difficulty: 2
    hints:
    - He hated being shut in.
    - Blood and chaos.
    solution: Mij tore the box's lining, got out, and ran about the cabin.
    mistakes: {"He bit the pilot": "e10_mij_box"}
  - prompt: Which of these did a Londoner guess Mij was?
    options:
    - A baby seal
    - A cat
    - A rabbit
    - A parrot
    answer: A baby seal
    difficulty: 1
    hints:
    - Many strange guesses.
    - Also hippo and walrus.
    solution: People guessed a baby seal, a squirrel, a walrus, a hippo, and more.
    mistakes: {"A cat": "e10_mij_guess"}
  - prompt: Which river marshes did Mij come from?
    options:
    - The Tigris marshes
    - The Thames
    - The Nile
    - The Ganga
    answer: The Tigris marshes
    difficulty: 2
    hints:
    - It is in Iraq.
    - One of the two great rivers of Mesopotamia.
    solution: Mij was brought from the marshes of the Tigris.
    mistakes:
      The Thames: e10u6_journey
  - prompt: What did Mij do in the bath on his very first day?
    options:
    - Went wild with joy, rolling and splashing
    - Stayed afraid in a corner
    - Fell asleep
    - Ran away
    answer: Went wild with joy, rolling and splashing
    difficulty: 1
    hints:
    - Otters love water.
    - Think of a happy animal.
    solution: Mij plunged and rolled in the water, wild with joy.
    mistakes:
      Stayed afraid in a corner: e10u6_mij_play
  - prompt: What did Mij soon learn to do in the bathroom?
    options:
    - Turn on the tap himself
    - Use the towel
    - Close the door
    - Brush his teeth
    answer: Turn on the tap himself
    difficulty: 2
    hints:
    - It gave him water whenever he wanted.
    - He had clever paws.
    solution: Within a week Mij learned to turn on the bath tap on his own.
    mistakes:
      Close the door: e10u6_mij_play
  - prompt: Which toy did Mij play with for hours?
    options:
    - A rubber ball
    - A doll
    - A wooden horse
    - A kite
    answer: A rubber ball
    difficulty: 1
    hints:
    - It bounces.
    - He juggled it and tossed it.
    solution: Mij played for hours with a rubber ball and marbles.
    mistakes:
      A kite: e10u6_mij_play
  - prompt: Who helped Maxwell when Mij escaped on the plane?
    options:
    - The air hostess
    - The pilot
    - A policeman
    - A vet
    answer: The air hostess
    difficulty: 2
    hints:
    - She worked on the plane.
    - She let Mij stay on Maxwell's knee.
    solution: A kind air hostess helped and allowed Mij on Maxwell's lap.
    mistakes:
      The pilot: e10u6_journey
  - prompt: Why did Maxwell decide to keep an otter?
    options:
    - He thought of keeping an otter instead of a dog
    - He was a zoo keeper
    - He wanted to sell it
    - He found one injured
    answer: He thought of keeping an otter instead of a dog
    difficulty: 3
    hints:
    - He was travelling in Iraq, near otter country.
    - He wanted an unusual pet.
    solution: By 1956 Maxwell had decided he would like to keep an otter instead of a dog.
    mistakes:
      He was a zoo keeper: eng10_read_again
  - prompt: How did Mij behave towards Maxwell in the first day?
    options:
    - Aloof and uninterested at first, then he came to sleep on Maxwell's bed
    - Bit Maxwell all day
    - Ran away and never returned
    - Sang loudly all night
    answer: Aloof and uninterested at first, then he came to sleep on Maxwell's bed
    difficulty: 3
    hints:
    - He did not take to Maxwell at once.
    - By the next night things changed.
    solution: Mij was aloof at first but within a day came to Maxwell's bed to sleep.
    mistakes:
      Ran away and never returned: eng10_read_again
  - prompt: What is Maxwell's general point about otters that are kept as pets?
    options:
    - They need lots of play and water to be happy
    - They prefer cages
    - They hate people
    - They sleep all day
    answer: They need lots of play and water to be happy
    difficulty: 2
    hints:
    - Think of Mij's games.
    - Otters are lively animals.
    solution: Mij's behaviour shows that otters need play and water.
    mistakes:
      They prefer cages: e10u6_mij_play
  - prompt: 'The new subspecies was named after:'
    options:
    - Gavin Maxwell
    - Mij's first owner
    - The air hostess
    - Basra city
    answer: Gavin Maxwell
    difficulty: 2
    hints:
    - Its name is 'Maxwell's otter'.
    - Look at the author's name.
    solution: Lutrogale perspicillata maxwelli is named after Gavin Maxwell.
    mistakes:
      Basra city: e10u6_journey
- code: cbse10e.u6.fog
  title: Fog (Carl Sandburg)
  after:
  - cbse10e.u6.mijbil
  notes: |
    A very short poem comparing fog to a cat. The fog comes 'on little cat feet', silently; it sits looking over
    the harbour and city 'on silent haunches', and then moves on. It is an extended metaphor: the fog, like a
    cat, arrives quietly, stays a while, and leaves without warning. Free verse (no rhyme scheme).
  explanations:
    text: 'Carl Sandburg''s ''Fog'' compares fog to a cat: it creeps in silently on little cat feet, sits looking over the harbour and city, and then quietly moves on.'
    visual: Picture grey fog creeping over a harbour like a cat padding in, sitting still on its haunches to look at the city, then slipping away.
    step_by_step: 'Step 1: Find the comparison: fog and cat. Step 2: List how the fog acts: comes silently, sits, moves on. Step 3: Name the device: metaphor. Step 4: Note the form: free verse.'
    real_world: On a winter morning in Delhi, fog seems to creep in overnight, hang over the city, and vanish by noon, just like Sandburg's cat.
  picture:
    kind: compare
    columns:
    - title: The fog
      points:
      - Comes in silently
      - Hangs over harbour and city
      - Leaves without a sound
    - title: A cat
      points:
      - Walks on little silent feet
      - Sits on its haunches, watching
      - Wanders off when it likes
    alt: 'Fog compared with a cat: both arrive silently, sit watching, and leave whenever they like.'
  activity:
    type: sort
    prompt: 'Fog: the fog, or the cat it is compared to?'
    bins:
    - The real fog
    - Like a cat
    items:
    - label: Covers the harbour and city
      bin: The real fog
      clue: What fog actually does.
      why: Fog really covers a harbour.
    - label: Comes on little cat feet
      bin: Like a cat
      clue: Fog has no feet.
      why: 'Feet belong to the cat: this is the comparison.'
    - label: Sits on silent haunches
      bin: Like a cat
      clue: Haunches are a cat's hind legs.
      why: Fog can't sit; the cat image does.
    - label: Moves on and disappears
      bin: The real fog
      clue: Fog lifts.
      why: Fog really lifts and moves away.
    - label: Arrives silently
      bin: Like a cat
      clue: How does a cat walk?
      why: Arriving silently is the cat-like quality given to fog.
  lesson:
    - teach: '''Fog'' by Carl Sandburg is a six-line poem. ''The fog comes / on little cat feet. / It sits looking / over harbor and city / on silent haunches / and then moves on.'' The fog is shown acting like a cat: silent, watchful, and then gone.'
      check:
        prompt: How many lines does 'Fog' have?
        options:
        - Six
        - Fourteen
        - Twenty
        answer: Six
        why: It is a very short poem.
    - teach: 'This is a metaphor that runs through the whole poem, also called an extended metaphor. The poet never says ''like a cat''; instead he gives the fog a cat''s actions: little cat feet, sitting on haunches, looking, moving on. Haunches are the hips and thighs an animal sits on.'
      picture:
        kind: compare
        columns:
        - title: The cat
          points:
          - walks silently
          - sits on its haunches
          - watches, then leaves
        - title: The fog
          points:
          - arrives quietly
          - settles over the city
          - lifts and drifts away
        alt: 'How Sandburg''s fog matches a cat: silent walking, sitting on haunches, watching and then leaving.'
      check:
        prompt: Which word in the poem means an animal's hips and thighs?
        options:
        - Haunches
        - Harbor
        - Feet
        answer: Haunches
        why: A cat sits on its haunches.
    - teach: 'The poem is in free verse: no rhyme and no regular rhythm. Like an imagist poem, it uses one sharp picture to make the reader see something familiar in a new way. Sandburg wrote about Chicago and city life.'
      check:
        prompt: What kind of verse is 'Fog' written in?
        options:
        - Free verse
        - A sonnet
        - Rhyming couplets
        answer: Free verse
        why: There is no rhyme or fixed metre.
  items:
  - prompt: To what does Sandburg compare the fog?
    options:
    - A cat
    - A dog
    - A ghost
    - A cloud
    answer: A cat
    difficulty: 1
    hints:
    - '''Little cat feet''.'
    - It sits on haunches.
    solution: The fog is compared to a cat.
    mistakes: {"A ghost": "e10_fog_cat"}
  - prompt: How does the fog come?
    options:
    - On little cat feet
    - With a loud roar
    - Like a storm
    - Very fast
    answer: On little cat feet
    difficulty: 1
