    mistakes:
      Moves very quickly: e10u6_fog_lines
  - prompt: Which American city did Sandburg often write about?
    options:
    - Chicago
    - Paris
    - Mumbai
    - Sydney
    answer: Chicago
    difficulty: 3
    hints:
    - Sandburg was American.
    - A big city near Lake Michigan.
    solution: Sandburg is famous for his Chicago poems.
    mistakes:
      Paris: eng10_author
  - prompt: Why might the poet choose a cat, not a dog, for the fog?
    options:
    - A cat moves silently and leaves on its own
    - A cat barks
    - A cat is large
    - A cat loves water
    answer: A cat moves silently and leaves on its own
    difficulty: 2
    hints:
    - Fog is silent.
    - Cats are independent.
    solution: A cat's silent, independent movement fits the fog.
    mistakes:
      A cat barks: e10u6_imagery
  - prompt: Which sense does the poem mostly appeal to?
    options:
    - Sight
    - Taste
    - Smell
    - Hearing loud sounds
    answer: Sight
    difficulty: 2
    hints:
    - We picture the fog.
    - We 'see' the cat image.
    solution: The poem paints a picture; it appeals mainly to sight.
    mistakes:
      Taste: e10u6_imagery
  - prompt: Who wrote the poem 'Fog'?
    options:
    - Carl Sandburg
    - Adrienne Rich
    - Robert Frost
    - John Berryman
    answer: Carl Sandburg
    difficulty: 1
    hints:
    - An American poet.
    - He wrote about Chicago.
    solution: '''Fog'' is by Carl Sandburg.'
    mistakes:
      Adrienne Rich: eng10_author
  - prompt: Which statement about the poem is true?
    options:
    - It compares fog to a cat without using 'like' or 'as'
    - It rhymes in every line
    - It is about a real cat
    - It is set in a village
    answer: It compares fog to a cat without using 'like' or 'as'
    difficulty: 3
    hints:
    - Think metaphor, not simile.
    - There is no rhyme.
    solution: The comparison is a metaphor, not a simile.
    mistakes:
      It is about a real cat: e10u6_imagery
  - prompt: What word in the poem shows the fog makes no sound as it sits?
    options:
    - Silent
    - Little
    - Looking
    - Moves
    answer: Silent
    difficulty: 2
    hints:
    - Read 'on ___ haunches'.
    - It means without noise.
    solution: '''on silent haunches'' shows the fog is soundless.'
    mistakes:
      Looking: e10u6_fog_lines
