# CBSE Class 10 English (NCERT First Flight), unit 4: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 4
title: From the Diary of Anne Frank · Amanda!
tips:
  e10_amanda_dream: "Amanda dreams of swimming freely in a green sea."
  e10_amanda_end: "The adult never stops correcting her. The last line is one more order."
  e10_amanda_message: "The nagging pushes Amanda into her dream world. What is the poet asking adults to give children?"
  e10_anne_birthday: "She got the diary when she turned thirteen, on 12 June 1942. The date has a 12, but her age was one more."
  e10_anne_friend: "Anne had many friends but felt she could not share her real thoughts with any of them."
  e10_brackets: "The adult speaks in the plain lines. Whose dreamy, silent answers are in brackets?"
  e10_duck_poem: "Anne answered the punishment with humour, in verse, about a family of birds."
  e10_keesing: "The essay topics were all about one habit of Anne's in class."
  e10_kitty: "Margot was Anne's sister. The diary got a friendly name like a pen-friend's."
  e10_orphan: "Amanda is tired of being told what to do all day. What would be different with no one to tell her?"
  e10_rapunzel: "In the fairy tale the hair lets someone climb up. Amanda wants to keep everyone out."
  e10_talking_trait: "Anne blamed someone in her family for the habit. Who talked a lot too?"
  e10u4_essays: Mr Keesing gave Anne three punishment essays, each sillier in title. Her answers got cleverer each time. Which one is this?
  e10u4_diary_why: 'Anne felt that paper is more patient than people: she had friends, but no true friend to share her deepest thoughts.'
  e10u4_amanda_orders: The adult gives Amanda one instruction after another. Find the line about the habit or chore being mentioned.
  e10u4_amanda_dreams: "Amanda escapes into daydreams of being somewhere free and alone. Which daydream in the poem matches what the question describes?"

concepts:
- code: cbse10e.u4.anne
  title: From the Diary of Anne Frank
  notes: |
    Anne Frank, a Jewish girl, received a diary on her thirteenth birthday (12 June 1942) and named it Kitty,
    her only true friend: 'paper has more patience than people'. She had family and friends but no one to
    confide in. Her family moved from Germany to Holland in 1933 (Anne joined later); her grandmother died in
    January 1942. She went to a Montessori nursery and school, then the Jewish Lyceum. Her maths teacher, Mr
    Keesing, punished her for talking with essays: 'A Chatterbox', 'An Incorrigible Chatterbox', and 'Quack,
    Quack, Quack, said Mistress Chatterbox'. She argued talking is a student's trait inherited from her mother,
    and wrote the last as a funny poem about a mother duck and ducklings bitten by a father swan. Mr Keesing
    laughed, read it aloud, and let her talk after that. The family later hid from the Nazis; Anne died in a
    concentration camp in 1945.
  explanations:
    text: Anne Frank was given a diary on her thirteenth birthday and called it Kitty, the friend she could tell everything. She writes about her family, school, and a maths teacher who kept punishing her for talking by making her write essays, until her funny poem made him laugh and let her be.
    visual: Picture Anne at her desk with a red-checked diary labelled 'Kitty', and across the room Mr Keesing reading her duck poem aloud to a laughing class.
    step_by_step: 'Step 1: Why a diary? She had no true friend to confide in. Step 2: Her family''s story: Germany to Holland. Step 3: School: Mr Keesing''s three essays. Step 4: How she won him over: the poem.'
    real_world: 'Many people keep a journal for the same reason Anne did: paper listens without judging when you feel nobody understands you.'
  picture:
    kind: flow
    steps:
    - 'Essay 1: ''A Chatterbox'' – talking is inherited'
    - 'Essay 2: ''An Incorrigible Chatterbox'''
    - 'Essay 3: ''Quack, Quack, Quack, said Mistress Chatterbox'''
    - Anne writes it as a funny poem
    - Mr Keesing laughs and lets her talk
    alt: Anne's three punishment essays for talking in class, ending with a funny poem that made Mr Keesing laugh and stop punishing her.
  activity:
    type: order
    prompt: 'From the Diary of Anne Frank: put the Chatterbox story in order.'
    steps:
    - Anne keeps talking in maths class
    - Mr Keesing sets 'A Chatterbox' as an essay
    - She argues talking is inherited from her mother
    - She gets 'An Incorrigible Chatterbox'
    - She writes 'Quack, Quack' as a funny poem
    - Mr Keesing laughs and lets her talk
    reasons:
      Mr Keesing sets 'A Chatterbox' as an essay: Her talking earns her a punishment.
      She argues talking is inherited from her mother: Her essay gives a clever reason for talking.
      She gets 'An Incorrigible Chatterbox': She keeps talking, so she gets another essay.
      She writes 'Quack, Quack' as a funny poem: A third essay comes; she turns it into a poem.
      Mr Keesing laughs and lets her talk: The poem's humour wins him over.
  lesson:
    - teach: Anne Frank, a Jewish girl, received a diary on her 13th birthday (12 June 1942). She lived in Amsterdam during the Second World War and later hid from the Nazis. She named her diary 'Kitty' and wrote to it as a friend, because she felt she had no true friend to confide in.
      check:
        prompt: Why did Anne call the diary 'Kitty'?
        options:
        - She wanted it to be her close friend
        - Kitty was her sister
        - It was a cat's name she liked
        answer: She wanted it to be her close friend
        why: She wrote letters to it.
    - teach: 'Anne gives a short history of her family: born in Frankfurt in 1929, the family moved to Holland in 1933 because her father, Otto Frank, was Jewish. She went to the Montessori nursery and later to the Jewish Lyceum. Her grandmother''s death affected her deeply.'
      picture:
        kind: flow
        steps:
        - Born Frankfurt 1929
        - Moves to Amsterdam 1933
        - Montessori school
        - Jewish Lyceum
        - Diary from 12 June 1942
        alt: 'Anne Frank''s life in the diary: born in Frankfurt in 1929, moved to Amsterdam in 1933, went to Montessori school, then the Jewish Lyceum, and began her diary on 12 June 1942.'
      check:
        prompt: Where was Anne born?
        options:
        - Frankfurt
        - Amsterdam
        - Paris
        answer: Frankfurt
        why: The family moved later.
    - teach: 'Anne talked a lot in class, so her maths teacher Mr Keesing gave her extra essays: ''A Chatterbox'', then ''An Incorrigible Chatterbox'', then ''Quack, Quack, Quack, Said Mistress Chatterback''. She argued that talking is a student''s trait and inherited from her mother, and finally wrote a funny poem about ducks. Mr Keesing took the joke well and let her talk.'
      check:
        prompt: How did Anne finally win Mr Keesing over?
        options:
        - With a funny poem about ducks
        - By staying silent
        - By crying
        answer: With a funny poem about ducks
        why: He saw the joke.
  items:
  - prompt: On which birthday did Anne receive her diary?
    answer: '13'
    check: '13'
    difficulty: 1
    hints:
    - She was a young teenager.
    - 12 June 1942.
    solution: She received the diary on her thirteenth birthday.
    mistakes: {"12": "e10_anne_birthday"}
  - prompt: What did Anne name her diary?
    options:
    - Kitty
    - Margot
    - Lucy
    - Annie
    answer: Kitty
    difficulty: 1
    hints:
    - She wanted it to be a friend.
    - A pet name.
    solution: She called her diary Kitty.
    mistakes: {"Margot": "e10_kitty"}
  - prompt: Why did Anne feel she needed a diary?
    options:
    - She had no true friend to confide in
    - Her teacher asked her to
    - She wanted to publish a book
    - She had lost her memory
    answer: She had no true friend to confide in
    difficulty: 2
    hints:
    - '''Paper has more patience than people''.'
    - She had friends, but not close ones.
    solution: Though she had family and friends, she had no one she could truly confide in.
    mistakes: {"She wanted to publish a book": "e10_anne_friend"}
  - prompt: Why did Mr Keesing give Anne extra homework?
    options:
    - She talked too much in class
    - She didn't do maths homework
    - She was late every day
    - She fought with classmates
    answer: She talked too much in class
    difficulty: 1
    hints:
    - '''Chatterbox''.'
    - Maths class.
    solution: Mr Keesing punished her for talking in class.
    mistakes: {"She didn't do maths homework": "e10_keesing"}
  - prompt: How did Anne finally win over Mr Keesing?
    options:
    - She wrote a funny poem about a duck family
    - She stopped talking completely
    - She complained to the headmaster
    - She changed schools
    answer: She wrote a funny poem about a duck family
    difficulty: 2
    hints:
    - '''Quack, Quack, Quack''.'
    - He read it aloud.
    solution: Her humorous poem made him laugh, and he stopped punishing her.
    mistakes: {"She stopped talking completely": "e10_duck_poem"}
  - prompt: In her first essay, what argument did Anne give for talking?
    options:
    - Talking is a student's trait, inherited from her mother
    - She was bored in class
    - Talking helps maths
    - Her friends forced her
    answer: Talking is a student's trait, inherited from her mother
    difficulty: 2
    hints:
    - Inherited.
    - Her mother talked too.
    solution: She argued that talking is a female trait inherited from her mother.
    mistakes: {"She was bored in class": "e10_talking_trait"}
  - prompt: In which year was Anne Frank born?
    answer: '1929'
    check: '1929'
    difficulty: 2
    hints:
    - She turned 13 in 1942.
    - Subtract.
    solution: 1942 − 13 = 1929.
    mistakes:
      '1942': e10_anne_birthday
      '1933': eng10_read_again
  - prompt: Why did Anne's family move to Holland?
    options:
    - They were Jewish and life in Germany became dangerous
    - Her father got a job in a bank
    - They wanted a holiday
    - Her school moved
    answer: They were Jewish and life in Germany became dangerous
    difficulty: 2
    hints:
    - It was 1933.
    - Hitler had come to power.
    solution: Being Jewish, the family moved to Holland in 1933 to escape persecution.
    mistakes:
      Her father got a job in a bank: eng10_read_again
  - prompt: Why does Anne say 'paper has more patience than people'?
    options:
    - She can write her deepest thoughts without being judged
    - Paper is cheap
    - People are always busy
    - She likes writing on paper
    answer: She can write her deepest thoughts without being judged
    difficulty: 2
    hints:
    - She felt low and lonely that day.
    - She couldn't share her feelings with friends.
    solution: A diary listens patiently to everything, unlike people.
    mistakes:
      Paper is cheap: e10u4_diary_why
  - prompt: What was the title of Anne's second punishment essay?
    options:
    - An Incorrigible Chatterbox
    - A Chatterbox
    - Quack, Quack, Quack, Said Mistress Chatterback
    - My Best Friend
    answer: An Incorrigible Chatterbox
    difficulty: 2
    hints:
    - The first was simply 'A Chatterbox'.
    - The second added a word meaning 'can't be corrected'.
    solution: The second essay was 'An Incorrigible Chatterbox'.
    mistakes:
      A Chatterbox: e10u4_essays
  - prompt: What does 'incorrigible' mean?
    options:
    - Impossible to correct or change
    - Very quiet
    - Very clever
    - Easy to teach
    answer: Impossible to correct or change
    difficulty: 2
    hints:
    - Mr Keesing thought Anne would never stop talking.
    - In + corrigible (correctable).
    solution: Incorrigible means one whose habits cannot be corrected.
    mistakes:
      Very quiet: e10u4_essays
  - prompt: How many words did the first punishment essay have to be?
    answer: '300'
    check: '300'
    difficulty: 3
    hints:
    - A few hundred.
    - More than two hundred.
    solution: Mr Keesing asked for 300 words on 'A Chatterbox'.
    mistakes:
      '100': e10u4_essays
      '500': e10u4_essays
  - prompt: Who did Anne say she inherited talking from?
    options:
    - Her mother
    - Her father
    - Mr Keesing
    - Her sister
    answer: Her mother
    difficulty: 1
    hints:
    - Someone at home also talked a lot.
    - A parent.
    solution: Anne argued she got the habit from her mother, who talked as much.
    mistakes:
      Mr Keesing: e10_talking_trait
  - prompt: Who was Margot?
    options:
    - Anne's elder sister
    - Anne's teacher
    - Anne's diary
    - Anne's grandmother
    answer: Anne's elder sister
    difficulty: 1
    hints:
    - She went to the same school.
    - She was older by three years.
    solution: Margot was Anne's elder sister.
    mistakes:
      Anne's diary: e10_kitty
  - prompt: What does the diary show about Anne?
    options:
    - She was thoughtful, witty and honest about her feelings
    - She was cruel
    - She never went to school
    - She disliked writing
    answer: She was thoughtful, witty and honest about her feelings
    difficulty: 2
    hints:
    - Think of the duck poem.
    - She wrote openly about loneliness.
    solution: Her writing shows humour, maturity and honesty.
    mistakes:
      She was cruel: e10u4_diary_why
- code: cbse10e.u4.amanda
  title: Amanda! (Robin Klein)
  after:
  - cbse10e.u4.anne
  notes: |
    A girl named Amanda is constantly scolded: don't bite your nails, don't hunch your shoulders, sit up
    straight, finish your homework, clean your shoes, don't eat chocolate (acne), don't sulk. In between she
    daydreams (lines in brackets): she is a mermaid drifting in a calm emerald sea; an orphan roaming the
    streets, free, making patterns in the dust; Rapunzel in a tower where life is tranquil and she would never
    let down her hair. The poem ends with the adult asking, 'Will you please look at me when I'm speaking to
    you, Amanda!' Theme: children need freedom; too much nagging pushes them into a world of imagination.
  explanations:
    text: 'Amanda is told off again and again for small things, and in her head she escapes: she''s a mermaid in a green sea, a free orphan, or Rapunzel alone in a peaceful tower. The poem shows how constant nagging makes children withdraw into their own world.'
    visual: Picture a girl at a table while speech bubbles of 'Don't…! Stop…!' fly at her, and above her head a thought bubble showing her swimming as a mermaid in a calm green sea.
    step_by_step: 'Step 1: List the instructions. Step 2: List the daydreams (in brackets). Step 3: Compare: nagging vs freedom. Step 4: State the message.'
    real_world: A child who hears 'don't' all day may stop listening altogether, just as Amanda drifts off into daydreams.
  picture:
    kind: compare
    columns:
    - title: What adults say
      points:
      - Don't bite your nails
      - Sit up straight
      - Finish your homework
      - Don't eat chocolate
    - title: What Amanda imagines
      points:
      - A mermaid in an emerald sea
      - A free orphan in the streets
      - Rapunzel in a quiet tower
      - Peace and freedom
    alt: 'Amanda''s world: adults nagging her about nails, posture, homework and chocolate, while she imagines being a mermaid, a free orphan or Rapunzel.'
  activity:
    type: sort
    prompt: 'Amanda!: a scolding or a daydream?'
    bins:
    - What adults say
    - Amanda's daydream
    items:
    - label: Don't bite your nails
      bin: What adults say
      clue: An order.
      why: A 'don't' is the adult nagging.
    - label: A mermaid in an emerald sea
      bin: Amanda's daydream
      clue: In brackets in the poem.
      why: 'Lines in brackets are her daydreams: the mermaid is one.'
    - label: Sit up straight
      bin: What adults say
      clue: Another order.
      why: Orders about posture come from the adult.
    - label: An orphan roaming the streets, free
      bin: Amanda's daydream
      clue: She imagines freedom.
      why: She imagines being an orphan to be free of nagging.
    - label: Rapunzel in a tranquil tower
      bin: Amanda's daydream
      clue: A fairy tale.
      why: Rapunzel is her daydream; she'd never let down her hair.
    - label: Look at me when I'm speaking
      bin: What adults say
      clue: The poem's last line.
      why: The adult's final scolding ends the poem.
  lesson:
    - teach: '''Amanda!'' by Robin Klein is a poem of an adult''s non-stop instructions to a girl: don''t bite your nails, don''t hunch your shoulders, sit up straight, finish your homework, tidy your room, don''t eat chocolate, don''t sulk. The adult''s lines are in plain text.'
      check:
        prompt: Who speaks the plain (non-bracketed) lines?
        options:
        - An adult, perhaps her mother
        - Amanda
        - A teacher in school only
        answer: An adult, perhaps her mother
        why: The instructions come from a grown-up.
    - teach: 'Amanda''s thoughts are in brackets. She escapes into daydreams: a mermaid drifting in a languid emerald sea, an orphan roaming the streets in freedom, and Rapunzel in a tower who would never let down her hair. Each dream shows her longing for freedom and silence.'
      picture:
        kind: compare
        columns:
        - title: Adult's words
          points:
          - Don't bite your nails
          - Sit up straight
          - Did you finish your homework?
        - title: Amanda's dreams
          points:
          - A mermaid in a green sea
          - An orphan, free
          - Rapunzel in a tower
        alt: 'The adult says: don''t bite your nails, sit up straight, did you finish your homework; Amanda dreams of being a mermaid in a green sea, a free orphan, and Rapunzel in a tower.'
      check:
        prompt: Why does Amanda dream of being an orphan?
        options:
        - No one would tell her what to do
        - She dislikes her family's food
        - She wants money
        answer: No one would tell her what to do
        why: She longs for freedom.
    - teach: 'The poem ends with the adult saying, ''Anyone would think that I was nagging at you, Amanda!'' The irony is that the adult is nagging. The message: too many orders make children withdraw; they need space, love and understanding.'
      check:
        prompt: The poem's message is that children need…
        options:
        - Freedom and understanding
        - More rules
        - More homework
        answer: Freedom and understanding
        why: Nagging pushes them away.
  items:
  - prompt: Which of these does Amanda imagine being?
    options:
    - A mermaid
    - A doctor
    - A queen
    - A bird
    answer: A mermaid
    difficulty: 1
    hints:
    - In an emerald sea.
    - Calm and free.
    solution: She imagines being a mermaid drifting in a languid emerald sea.
    mistakes: {"A queen": "e10_amanda_dream"}
  - prompt: Why does Amanda want to be an orphan?
    options:
    - Orphans have no one to scold them and are free
    - She dislikes her family's food
    - Orphans are rich
    - She wants to travel abroad
    answer: Orphans have no one to scold them and are free
    difficulty: 2
    hints:
    - Freedom.
    - Roaming the streets.
    solution: She imagines an orphan's freedom from constant instructions.
    mistakes: {"Orphans are rich": "e10_orphan"}
  - prompt: Why would Amanda, as Rapunzel, never let down her hair?
    options:
    - She wants to stay alone in peace
