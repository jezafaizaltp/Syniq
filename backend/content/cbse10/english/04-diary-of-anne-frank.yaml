    mistakes: {"Good girl, Amanda!": "e10_amanda_end"}
  - prompt: What do the lines in brackets show?
    options:
    - Amanda's daydreams
    - The adult's thoughts
    - Stage directions
    - Footnotes
    answer: Amanda's daydreams
    difficulty: 2
    hints:
    - They alternate with the scolding.
    - Her inner world.
    solution: The bracketed lines are Amanda's imagined escapes.
    mistakes: {"The adult's thoughts": "e10_brackets"}
  - prompt: What is the main message of 'Amanda!'?
    options:
    - Constant nagging makes children withdraw; they need freedom
    - Children should obey without question
    - Mermaids are real
    - Chocolate is bad
    answer: Constant nagging makes children withdraw; they need freedom
    difficulty: 2
    hints:
    - She stops listening.
    - She escapes into dreams.
    solution: The poem shows how excessive control drives children into their own world.
    mistakes: {"Children should obey without question": "e10_amanda_message"}
  - prompt: What does the adult tell Amanda not to eat?
    options:
    - Chocolate
    - Rice
    - Vegetables
    - Fruit
    answer: Chocolate
    difficulty: 1
    hints:
    - It's about her skin.
    - A sweet treat.
    solution: The adult says, 'Don't eat that chocolate, Amanda! Remember your acne.'
    mistakes:
      Vegetables: e10u4_amanda_orders
  - prompt: In her mermaid dream, what kind of sea does Amanda drift in?
    options:
    - A languid, emerald sea
    - A stormy black sea
    - A frozen sea
    - A muddy river
    answer: A languid, emerald sea
    difficulty: 2
    hints:
    - Calm and slow.
    - A green colour.
    solution: She imagines a languid emerald sea.
    mistakes:
      A stormy black sea: e10_amanda_dream
  - prompt: What does 'languid' mean?
    options:
    - Slow and relaxed
    - Fast and noisy
    - Angry
    - Cold
    answer: Slow and relaxed
    difficulty: 2
    hints:
    - The mermaid drifts.
    - No hurry.
    solution: Languid means moving slowly and gently.
