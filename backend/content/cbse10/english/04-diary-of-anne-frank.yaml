# CBSE Class 10 English (NCERT First Flight), unit 4: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 4
title: From the Diary of Anne Frank · Amanda!
concepts:
- code: cbse10e.u4.anne
  title: From the Diary of Anne Frank
  notes: |
    Anne Frank, a Jewish girl, received a diary on her thirteenth birthday (12 June 1942) and named it Kitty,
    her only true friend: 'paper has more patience than people'. She had family and friends but no one to
    confide in. Her family moved from Germany to Holland in 1933 (Anne joined later); her grandmother died in
    January 1942. She went to a Montessori nursery and school, then the Jewish Lyceum. Her maths teacher, Mr
    Keesing, punished her for talking with essays: 'A Chatterbox', 'An Incorrigible Chatterbox', and 'Quack,
    Quack, Quack, said Mistress Chatterbox'. She argued talking is a student's trait inherited from her mother,
    and wrote the last as a funny poem about a mother duck and ducklings bitten by a father swan. Mr Keesing
    laughed, read it aloud, and let her talk after that. The family later hid from the Nazis; Anne died in a
    concentration camp in 1945.
  explanations:
    text: Anne Frank was given a diary on her thirteenth birthday and called it Kitty, the friend she could tell everything. She writes about her family, school, and a maths teacher who kept punishing her for talking by making her write essays, until her funny poem made him laugh and let her be.
    visual: Picture Anne at her desk with a red-checked diary labelled 'Kitty', and across the room Mr Keesing reading her duck poem aloud to a laughing class.
    step_by_step: 'Step 1: Why a diary? She had no true friend to confide in. Step 2: Her family''s story: Germany to Holland. Step 3: School: Mr Keesing''s three essays. Step 4: How she won him over: the poem.'
    real_world: 'Many people keep a journal for the same reason Anne did: paper listens without judging when you feel nobody understands you.'
  picture:
    kind: flow
    steps:
    - 'Essay 1: ''A Chatterbox'' – talking is inherited'
    - 'Essay 2: ''An Incorrigible Chatterbox'''
    - 'Essay 3: ''Quack, Quack, Quack, said Mistress Chatterbox'''
    - Anne writes it as a funny poem
    - Mr Keesing laughs and lets her talk
    alt: Anne's three punishment essays for talking in class, ending with a funny poem that made Mr Keesing laugh and stop punishing her.
  items:
  - prompt: On which birthday did Anne receive her diary?
    answer: '13'
    check: '13'
    difficulty: 1
    hints:
    - She was a young teenager.
    - 12 June 1942.
    solution: She received the diary on her thirteenth birthday.
  - prompt: What did Anne name her diary?
    options:
    - Kitty
    - Margot
    - Lucy
    - Annie
    answer: Kitty
    difficulty: 1
    hints:
    - She wanted it to be a friend.
    - A pet name.
    solution: She called her diary Kitty.
  - prompt: Why did Anne feel she needed a diary?
    options:
    - She had no true friend to confide in
    - Her teacher asked her to
    - She wanted to publish a book
    - She had lost her memory
    answer: She had no true friend to confide in
    difficulty: 2
    hints:
    - '''Paper has more patience than people''.'
    - She had friends, but not close ones.
    solution: Though she had family and friends, she had no one she could truly confide in.
  - prompt: Why did Mr Keesing give Anne extra homework?
    options:
    - She talked too much in class
    - She didn't do maths homework
    - She was late every day
    - She fought with classmates
    answer: She talked too much in class
    difficulty: 1
    hints:
    - '''Chatterbox''.'
    - Maths class.
    solution: Mr Keesing punished her for talking in class.
  - prompt: How did Anne finally win over Mr Keesing?
    options:
    - She wrote a funny poem about a duck family
    - She stopped talking completely
    - She complained to the headmaster
    - She changed schools
    answer: She wrote a funny poem about a duck family
    difficulty: 2
    hints:
    - '''Quack, Quack, Quack''.'
    - He read it aloud.
    solution: Her humorous poem made him laugh, and he stopped punishing her.
  - prompt: In her first essay, what argument did Anne give for talking?
    options:
    - Talking is a student's trait, inherited from her mother
    - She was bored in class
    - Talking helps maths
    - Her friends forced her
    answer: Talking is a student's trait, inherited from her mother
    difficulty: 2
    hints:
    - Inherited.
    - Her mother talked too.
    solution: She argued that talking is a female trait inherited from her mother.
- code: cbse10e.u4.amanda
  title: Amanda! (Robin Klein)
  after:
  - cbse10e.u4.anne
  notes: |
    A girl named Amanda is constantly scolded: don't bite your nails, don't hunch your shoulders, sit up
    straight, finish your homework, clean your shoes, don't eat chocolate (acne), don't sulk. In between she
    daydreams (lines in brackets): she is a mermaid drifting in a calm emerald sea; an orphan roaming the
    streets, free, making patterns in the dust; Rapunzel in a tower where life is tranquil and she would never
    let down her hair. The poem ends with the adult asking, 'Will you please look at me when I'm speaking to
    you, Amanda!' Theme: children need freedom; too much nagging pushes them into a world of imagination.
  explanations:
    text: 'Amanda is told off again and again for small things, and in her head she escapes: she''s a mermaid in a green sea, a free orphan, or Rapunzel alone in a peaceful tower. The poem shows how constant nagging makes children withdraw into their own world.'
    visual: Picture a girl at a table while speech bubbles of 'Don't…! Stop…!' fly at her, and above her head a thought bubble showing her swimming as a mermaid in a calm green sea.
    step_by_step: 'Step 1: List the instructions. Step 2: List the daydreams (in brackets). Step 3: Compare: nagging vs freedom. Step 4: State the message.'
    real_world: A child who hears 'don't' all day may stop listening altogether, just as Amanda drifts off into daydreams.
  picture:
    kind: compare
    columns:
    - title: What adults say
      points:
      - Don't bite your nails
      - Sit up straight
      - Finish your homework
      - Don't eat chocolate
    - title: What Amanda imagines
      points:
      - A mermaid in an emerald sea
      - A free orphan in the streets
      - Rapunzel in a quiet tower
      - Peace and freedom
    alt: 'Amanda''s world: adults nagging her about nails, posture, homework and chocolate, while she imagines being a mermaid, a free orphan or Rapunzel.'
  items:
  - prompt: Which of these does Amanda imagine being?
    options:
    - A mermaid
    - A doctor
    - A queen
    - A bird
    answer: A mermaid
    difficulty: 1
    hints:
    - In an emerald sea.
    - Calm and free.
    solution: She imagines being a mermaid drifting in a languid emerald sea.
  - prompt: Why does Amanda want to be an orphan?
    options:
    - Orphans have no one to scold them and are free
    - She dislikes her family's food
    - Orphans are rich
    - She wants to travel abroad
    answer: Orphans have no one to scold them and are free
    difficulty: 2
    hints:
    - Freedom.
    - Roaming the streets.
    solution: She imagines an orphan's freedom from constant instructions.
  - prompt: Why would Amanda, as Rapunzel, never let down her hair?
    options:
    - She wants to stay alone in peace
    - Her hair is too short
    - She is afraid of heights
    - She is waiting for a prince
    answer: She wants to stay alone in peace
    difficulty: 2
    hints:
    - Life in the tower is tranquil.
    - No one could come up.
    solution: She wants the tranquillity of being alone, away from nagging.
  - prompt: What does the adult say at the end?
    options:
    - Will you please look at me when I'm speaking to you, Amanda!
    - Good girl, Amanda!
    - Go out and play, Amanda!
    - I'm sorry, Amanda!
    answer: Will you please look at me when I'm speaking to you, Amanda!
    difficulty: 1
    hints:
    - She wasn't listening.
    - More scolding.
    solution: The poem ends with the adult demanding Amanda's attention.
  - prompt: What do the lines in brackets show?
    options:
    - Amanda's daydreams
    - The adult's thoughts
    - Stage directions
    - Footnotes
    answer: Amanda's daydreams
    difficulty: 2
    hints:
    - They alternate with the scolding.
    - Her inner world.
    solution: The bracketed lines are Amanda's imagined escapes.
  - prompt: What is the main message of 'Amanda!'?
    options:
    - Constant nagging makes children withdraw; they need freedom
    - Children should obey without question
    - Mermaids are real
    - Chocolate is bad
    answer: Constant nagging makes children withdraw; they need freedom
    difficulty: 2
    hints:
    - She stops listening.
    - She escapes into dreams.
    solution: The poem shows how excessive control drives children into their own world.
