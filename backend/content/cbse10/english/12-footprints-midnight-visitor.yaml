# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 3.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 12
title: The Midnight Visitor (Robert Arthur)
tips:
  e10_ausable: "Fowler was disappointed: Ausable looked nothing like the spies in films. He was very heavy."
  e10_balcony: "Ausable's lie made Max think he could hide outside the window."
  e10_fowler: "Fowler was a young man hoping to see real spy work, someone who writes stories."
  e10_max_report: "Max wanted secret papers, about weapons."
  e10_presence_of_mind: "Ausable had no weapon. He made up a story on the spot."
  e10_waiter: "Ausable had ordered drinks earlier. Who would bring them?"
  e10f3_plan: Ausable never fights Max; he wins with an invented story. Trace the trick step by step.
  e10f3_people: 'Three people are in the room at first: Ausable, Fowler and Max; a fourth arrives at the door. Who is being described?'

concepts:
- code: cbse10e.f3.visitor
  title: The Midnight Visitor (Robert Arthur)
  notes: |
    Ausable, a fat secret agent who doesn't look like one, returns to his hotel room in Paris with Fowler, a
    young writer hoping for excitement. They find Max, a rival spy, with a pistol, waiting for an important
    report about missiles. Ausable calmly invents a story: a balcony below the window, which Max must have used,
    and the hotel management promised to fix it. When there is a knock at the door, Ausable says it is the
    police he had arranged to come. Max, panicking, climbs out of the window onto the 'balcony', which doesn't
    exist, and falls (he is not killed, just injured, but he is out of the way). The knock was the waiter
    bringing the drinks Ausable had ordered. Theme: presence of mind beats force.
  explanations:
    text: Ausable, a fat secret agent who looks nothing like a spy, finds a rival agent, Max, waiting in his hotel room with a gun. Calmly, Ausable invents a balcony below the window and says the police are about to knock. When the knock comes, Max climbs out onto the 'balcony', which doesn't exist, and falls. The knock was only the waiter with drinks.
    visual: 'Picture a dark hotel room: a fat man sitting calmly, a thin man with a pistol near the open window, and a waiter at the door with a tray of drinks.'
    step_by_step: 'Step 1: The setting and characters: Ausable, Fowler, Max. Step 2: The threat: Max''s gun. Step 3: Ausable''s lie: the balcony and the police. Step 4: The knock and Max''s jump. Step 5: The twist: only the waiter.'
    real_world: Staying calm in an emergency, as Ausable did, often matters more than strength.
  picture:
    kind: flow
    steps:
    - Ausable and Fowler find Max with a gun
    - Ausable invents a balcony under the window
    - He says police will come
    - 'A knock: Max jumps onto the ''balcony'''
    - There's no balcony; it was the waiter
    alt: 'The Midnight Visitor: Max waits with a gun, Ausable invents a balcony and police, a knock comes, Max jumps, and the knock was only the waiter.'
  activity:
    type: order
    prompt: 'The Midnight Visitor: put Ausable''s trick in order.'
    steps:
    - Max waits in the room with a pistol
    - Ausable talks of a balcony below the window
    - There is a knock at the door
    - Ausable says it is the police
    - Max climbs out to the 'balcony' and falls
    reasons:
      Ausable talks of a balcony below the window: He invents a way out for Max.
      There is a knock at the door: The waiter Ausable had ordered arrives.
      Ausable says it is the police: He uses the knock to scare Max.
      Max climbs out to the 'balcony' and falls: Fearing the police, he takes the fake way out.
  lesson:
    - teach: 'In ''The Midnight Visitor'' by Robert Arthur, Ausable is a secret agent who looks nothing like one: he is fat, lives in a small room on the sixth floor of a French hotel, and speaks without excitement. Fowler, a young writer, follows him, hoping for romance and adventure like in films, and is disappointed.'
      check:
        prompt: Why was Fowler disappointed by Ausable?
        options:
        - Ausable was fat and dull, not a dashing spy
        - Ausable was rude to him
        - Ausable refused to meet him
        answer: Ausable was fat and dull, not a dashing spy
        why: He expected adventure like in films.
      ways:
      - style: visual
        teach: Fowler's idea of a spy compared with Ausable in real life.
        picture:
          kind: compare
          columns:
          - title: What Fowler expected
            points:
            - slim and mysterious
            - dangerous women and pistols
            - thrilling adventures
          - title: What Ausable was
            points:
            - fat, with a heavy accent
            - a dull room high up
            - calm and clever
          alt: Fowler expected a slim, mysterious spy with dangerous women, pistols and thrilling adventures. Ausable was fat, spoke with a heavy accent, lived in a dull room high up, and was calm and clever.
      - style: real_world
        teach: Real detectives and agents rarely look like film heroes. Their real skill is noticing things and thinking fast, just as Ausable shows.
    - teach: In Ausable's room they find Max, another agent, holding a pistol. Max wants an important report about new missiles. Ausable calmly says the balcony under his window lets people climb in, and that he will complain to the management. Then there is a knock at the door, and Ausable says it must be the police, whom he had asked to guard the report.
      picture:
        kind: flow
        steps:
        - Max waits with a pistol
        - Ausable invents a balcony
        - Knock at the door
        - Max goes out the window
        - Falls; waiter brings drinks
        alt: 'Ausable''s trick: Max waits with a pistol, Ausable invents a balcony, a knock comes, Max goes out the window and falls, and it is only the waiter with drinks.'
      check:
        prompt: What did Max want from Ausable?
        options:
        - A report about new missiles
        - Money
        - A passport
        answer: A report about new missiles
        why: It was secret and valuable.
      ways:
      - style: step_by_step
        teach: 'Track the danger in the room. Step 1: Max is waiting with a pistol. Step 2: He wants the secret report. Step 3: Ausable stays calm and talks. Step 4: He invents a story about a balcony. Step 5: A knock makes Max believe the police are coming.'
      - style: real_world
        teach: In a crisis, a calm voice and a quick idea often help more than strength. People who keep their heads in danger, like Ausable, are said to have presence of mind.
    - teach: Fearing the police, Max climbs out of the window to hide on the 'balcony', but there is no balcony. He falls with a scream. The knock was only Henry, the waiter, bringing drinks that Ausable had ordered. Ausable's presence of mind and quick invention defeat a man with a gun.
      check:
        prompt: Who was really at the door?
        options:
        - The waiter with drinks
        - The police
        - Fowler's friend
        answer: The waiter with drinks
        why: Ausable had ordered drinks earlier.
      ways:
      - style: visual
        teach: Ausable's trick on Max, step by step, from lie to fall.
        picture:
          kind: flow
          steps:
          - Ausable mentions a balcony below the window
          - Claims the police use it
          - Knock at the door
          - Max fears the police
          - Max climbs out to hide
          - 'No balcony: he falls'
          alt: Ausable mentions a balcony below the window and claims the police have used it. There is a knock, Max fears the police and climbs out to hide, but there is no balcony and he falls.
      - style: step_by_step
        teach: 'Read the twist. Step 1: Ausable had ordered a drink earlier. Step 2: The knock is only the waiter. Step 3: Ausable used that timing for his lie. Step 4: The reader, like Fowler, is surprised: brains beat a pistol.'
  items:
  - prompt: How was Ausable different from the usual idea of a secret agent?
    options:
    - He was fat and didn't look like a spy
    - He was very tall and handsome
    - He carried many weapons
    - He spoke no French
    answer: He was fat and didn't look like a spy
    difficulty: 1
    hints:
    - Fowler was disappointed.
    - No disguises or guns.
    solution: Ausable was fat and dull-looking, unlike the dashing spies of stories.
    mistakes: {"He was very tall and handsome": "e10_ausable"}
  - prompt: What was Max looking for?
    options:
    - "A secret report about missiles"
    - "Money hidden in the room safe"
    - "Diamonds sewn into a coat"
    - "A stolen painting in a frame"
    answer: A secret report about missiles
    difficulty: 2
    hints:
    - A document.
    - Important for countries.
    solution: Max wanted a report about new missiles.
    mistakes: {"Diamonds sewn into a coat": "e10_max_report"}
  - prompt: What did Ausable claim was under his window?
    options:
    - A balcony
    - A swimming pool
    - A fire escape ladder
    - A garden
    answer: A balcony
    difficulty: 1
    hints:
    - Max could hide there.
    - It didn't exist.
    solution: He said there was a balcony below the window.
    mistakes: {"A swimming pool": "e10_balcony"}
  - prompt: Who actually knocked at the door?
    options:
    - The waiter with drinks
    - The police
    - Fowler's friend
    - The hotel manager
    answer: The waiter with drinks
    difficulty: 1
    hints:
    - Ausable had ordered something.
    - Not the police.
    solution: It was the waiter bringing the drinks Ausable had ordered.
    mistakes: {"The police": "e10_waiter"}
  - prompt: What quality helped Ausable defeat Max?
    options:
    - Presence of mind
    - Physical strength
    - A hidden gun
    - Luck alone
    answer: Presence of mind
    difficulty: 2
    hints:
    - He stayed calm.
    - He made up a story.
    solution: His quick thinking and calm made Max fall into a trap.
    mistakes: {"A hidden gun": "e10_presence_of_mind"}
  - prompt: Who was Fowler?
    options:
    - "A young writer who came with Ausable"
    - "Another spy working for a rival country"
    - "The hotel waiter who brought the drinks"
    - "A policeman sent to guard Ausable"
    answer: A young writer who came with Ausable
    difficulty: 1
    hints:
    - He wanted excitement.
    - He watched everything.
    solution: Fowler was a writer hoping to see the romantic side of spying.
    mistakes: {"Another spy working for a rival country": "e10_fowler"}
  - prompt: On which floor was Ausable's room?
    options:
    - The sixth floor
    - The ground floor
    - The second floor
    - The tenth floor
    answer: The sixth floor
    difficulty: 2
    hints:
    - It was high up.
    - That is why the fall mattered.
    solution: Ausable's room was on the sixth floor.
    mistakes:
      The ground floor: e10f3_plan
  - prompt: What was Max holding when Ausable and Fowler entered?
    options:
    - A small pistol
    - A bunch of keys
    - A secret report
    - A tray of drinks
    answer: A small pistol
    difficulty: 2
    hints:
    - He meant to threaten Ausable.
    - It was a weapon.
    solution: Max stood in the room holding a small automatic pistol.
    mistakes:
      A tray of drinks: e10f3_people
  - prompt: What did Fowler expect a secret agent's life to be like?
    options:
    - "Full of mysterious notes, dark-eyed women and gunfire"
    - "Quiet and boring, with nothing much happening"
    - "Full of paperwork and long office meetings"
    - "Like a teacher's life, with fixed hours"
    answer: Full of mysterious notes, dark-eyed women and gunfire
    difficulty: 2
    hints:
    - Like spy films.
    - Exciting and romantic.
    solution: Fowler imagined romance and adventure from stories.
    mistakes:
      "Quiet and boring, with nothing much happening": e10f3_people
  - prompt: Why did Max believe the balcony story?
    options:
    - "Ausable told it calmly and confidently, with no sign of a trick"
    - "He had seen the balcony himself the week before he came"
    - "Fowler confirmed it and described the balcony to him"
    - "The waiter told him about it when he entered the hotel"
    answer: Ausable told it calmly and confidently, with no sign of a trick
    difficulty: 3
    hints:
    - Ausable stayed relaxed.
    - He even complained about it.
    solution: Ausable's calm, annoyed manner made the invented balcony believable.
    mistakes:
      "He had seen the balcony himself the week before he came": e10f3_plan
  - prompt: What did Ausable say he would do about the balcony?
    options:
    - "Complain to the hotel management"
    - "Build a wall across the window"
    - "Move to a room on a higher floor"
    - "Call a carpenter to take it down"
    answer: Complain to the hotel management
    difficulty: 2
    hints:
    - It made his room unsafe.
    - He would talk to the hotel.
    solution: He grumbled he would complain to the management about the balcony.
    mistakes:
      "Build a wall across the window": e10f3_plan
  - prompt: What was the waiter's name?
    options:
    - Henry
    - Max
    - Fowler
    - Jaffers
    answer: Henry
    difficulty: 2
    hints:
    - He brought drinks.
    - Not one of the main three.
    solution: Henry, the waiter, knocked at the door.
    mistakes:
      Max: e10f3_people
      Fowler: e10f3_people
  - prompt: Which word best describes Max at the end?
    options:
    - Outwitted
    - Victorious
    - Rich
    - Calm
    answer: Outwitted
    difficulty: 2
    hints:
    - He fell for a trick.
    - He had the gun but lost.
    solution: Max was outwitted by Ausable's invention.
    mistakes:
      Victorious: e10f3_plan
  - prompt: Who wrote 'The Midnight Visitor'?
    options:
    - Robert Arthur
    - Ruskin Bond
    - Victor Canning
    - James Herriot
    answer: Robert Arthur
    difficulty: 1
    hints:
    - An American writer of mysteries.
    - Not the writer of 'A Question of Trust'.
    solution: The story is by Robert Arthur.
    mistakes:
      Victor Canning: eng10_author
  - prompt: What lesson does the story teach?
    options:
    - "A calm, quick mind can beat force"
    - "Carry a gun when you travel"
    - "Never trust the waiters in a hotel"
    - "Hotels are always unsafe at night"
    answer: A calm, quick mind can beat force
    difficulty: 2
    hints:
    - Ausable had no weapon.
    - He used his wits.
    solution: Presence of mind defeated a man with a pistol.
    mistakes:
      "Carry a gun when you travel": e10f3_plan
  - prompt: 'Assertion (A): Ausable defeated Max without using any weapon.

      Reason (R): He used presence of mind and an invented story about a balcony.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. His calm thinking and clever lie, not force, made Max fall. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A shopkeeper is threatened by a robber and calmly says the police patrol passes every five minutes and will arrive any second. The robber runs away. Whose method is this like?'
    options:
    - Ausable's
    - Max's
    - Fowler's
    answer: Ausable's
    hints:
    - Who used a made-up story to beat an armed man?
    - Who stayed calm?
    solution: Like Ausable, the shopkeeper uses presence of mind and a clever story, not force, to defeat the threat.
    mistakes:
      Max's: e10f3_plan
      Fowler's: e10_fowler
    exam: case
    difficulty: 2
  - prompt: 'Situation: Why did Max believe the story about the balcony so easily?'
    options:
    - "He was nervous, the knock seemed to prove the police were coming, and Ausable spoke calmly"
    - "He had seen the balcony himself from the street outside earlier that evening"
    - "Fowler told him it was there and that he had stood on it the day before"
    answer: He was nervous, the knock seemed to prove the police were coming, and Ausable spoke calmly
    hints:
    - What happened right after Ausable spoke?
    - How did Ausable sound?
    solution: Max was tense; Ausable's calm, believable story and the timely knock made him panic and believe it.
    mistakes:
      "He had seen the balcony himself from the street outside earlier that evening": e10_balcony
      "Fowler told him it was there and that he had stood on it the day before": e10f3_people
    exam: competency
    difficulty: 2
