concepts:
- code: cbse10e.f3.visitor
  title: The Midnight Visitor (Robert Arthur)
  notes: |
    Ausable, a fat secret agent who doesn't look like one, returns to his hotel room in Paris with Fowler, a
    young writer hoping for excitement. They find Max, a rival spy, with a pistol, waiting for an important
    report about missiles. Ausable calmly invents a story: a balcony below the window, which Max must have used,
    and the hotel management promised to fix it. When there is a knock at the door, Ausable says it is the
    police he had arranged to come. Max, panicking, climbs out of the window onto the 'balcony', which doesn't
    exist, and falls (he is not killed, just injured, but he is out of the way). The knock was the waiter
    bringing the drinks Ausable had ordered. Theme: presence of mind beats force.
  explanations:
    text: Ausable, a fat secret agent who looks nothing like a spy, finds a rival agent, Max, waiting in his hotel room with a gun. Calmly, Ausable invents a balcony below the window and says the police are about to knock. When the knock comes, Max climbs out onto the 'balcony', which doesn't exist, and falls. The knock was only the waiter with drinks.
    visual: 'Picture a dark hotel room: a fat man sitting calmly, a thin man with a pistol near the open window, and a waiter at the door with a tray of drinks.'
    step_by_step: 'Step 1: The setting and characters: Ausable, Fowler, Max. Step 2: The threat: Max''s gun. Step 3: Ausable''s lie: the balcony and the police. Step 4: The knock and Max''s jump. Step 5: The twist: only the waiter.'
    real_world: Staying calm in an emergency, as Ausable did, often matters more than strength.
  picture:
    kind: flow
    steps:
    - Ausable and Fowler find Max with a gun
    - Ausable invents a balcony under the window
    - He says police will come
    - 'A knock: Max jumps onto the ''balcony'''
    - There's no balcony; it was the waiter
    alt: 'The Midnight Visitor: Max waits with a gun, Ausable invents a balcony and police, a knock comes, Max jumps, and the knock was only the waiter.'
  activity:
    type: order
    prompt: 'The Midnight Visitor: put Ausable''s trick in order.'
    steps:
    - Max waits in the room with a pistol
    - Ausable talks of a balcony below the window
    - There is a knock at the door
    - Ausable says it is the police
    - Max climbs out to the 'balcony' and falls
    reasons:
      Ausable talks of a balcony below the window: He invents a way out for Max.
      There is a knock at the door: The waiter Ausable had ordered arrives.
      Ausable says it is the police: He uses the knock to scare Max.
      Max climbs out to the 'balcony' and falls: Fearing the police, he takes the fake way out.
  items:
  - prompt: How was Ausable different from the usual idea of a secret agent?
    options:
    - He was fat and didn't look like a spy
    - He was very tall and handsome
    - He carried many weapons
    - He spoke no French
    answer: He was fat and didn't look like a spy
    difficulty: 1
    hints:
    - Fowler was disappointed.
    - No disguises or guns.
    solution: Ausable was fat and dull-looking, unlike the dashing spies of stories.
    mistakes: {"He was very tall and handsome": "e10_ausable"}
  - prompt: What was Max looking for?
    options:
    - A secret report about missiles
    - Money
    - Diamonds
    - A stolen painting
    answer: A secret report about missiles
    difficulty: 2
    hints:
    - A document.
    - Important for countries.
    solution: Max wanted a report about new missiles.
    mistakes: {"Diamonds": "e10_max_report"}
  - prompt: What did Ausable claim was under his window?
    options:
    - A balcony
    - A swimming pool
    - A fire escape ladder
    - A garden
    answer: A balcony
    difficulty: 1
    hints:
    - Max could hide there.
    - It didn't exist.
    solution: He said there was a balcony below the window.
    mistakes: {"A swimming pool": "e10_balcony"}
  - prompt: Who actually knocked at the door?
    options:
    - The waiter with drinks
    - The police
    - Fowler's friend
    - The hotel manager
    answer: The waiter with drinks
    difficulty: 1
    hints:
    - Ausable had ordered something.
    - Not the police.
    solution: It was the waiter bringing the drinks Ausable had ordered.
    mistakes: {"The police": "e10_waiter"}
  - prompt: What quality helped Ausable defeat Max?
    options:
    - Presence of mind
    - Physical strength
    - A hidden gun
    - Luck alone
    answer: Presence of mind
    difficulty: 2
    hints:
    - He stayed calm.
    - He made up a story.
    solution: His quick thinking and calm made Max fall into a trap.
    mistakes: {"A hidden gun": "e10_presence_of_mind"}
  - prompt: Who was Fowler?
    options:
    - A young writer who came with Ausable
    - Another spy
    - The hotel waiter
    - A policeman
    answer: A young writer who came with Ausable
    difficulty: 1
    hints:
    - He wanted excitement.
    - He watched everything.
    solution: Fowler was a writer hoping to see the romantic side of spying.
    mistakes: {"Another spy": "e10_fowler"}
