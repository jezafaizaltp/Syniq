    - So she's loved for herself.
    solution: She says she can dye her hair so men will love her for herself.
    mistakes: {"Cut her hair short": "e10_dye"}
  - prompt: According to the old religious man's text, who can love a person for themselves alone?
    options:
    - Only God
    - Her parents
    - Her friends
    - No one at all
    answer: Only God
    difficulty: 1
    hints:
    - The final lines.
    - Divine love.
    solution: Only God could love her for herself alone.
    mistakes: {"Her parents": "e10_only_god"}
  - prompt: What are the 'great honey-coloured ramparts'?
    options:
    - Anne's yellow hair
    - The walls of a castle
    - A beehive
    - The city walls
    answer: Anne's yellow hair
    difficulty: 2
    hints:
    - A metaphor.
    - Ramparts are protective walls.
    solution: Her golden hair falling over her ears is compared to ramparts.
    mistakes: {"The walls of a castle": "e10_ramparts"}
  - prompt: Who wrote 'For Anne Gregory'?
    options:
    - W. B. Yeats
    - Robert Frost
    - Carl Sandburg
    - Ogden Nash
    answer: W. B. Yeats
    difficulty: 1
    hints:
    - An Irish poet.
    - Anne was his friend's granddaughter.
    solution: The poem is by W. B. Yeats.
    mistakes:
      Robert Frost: eng10_author
  - prompt: What is the theme of the poem?
    options:
    - Outer beauty versus the inner self
    - The beauty of nature
    - War and peace
    - Life in the city
    answer: Outer beauty versus the inner self
    difficulty: 2
    hints:
    - Love for hair vs love for self.
    - Appearance.
    solution: The poem contrasts love for looks with love for the real person.
    mistakes: {"The beauty of nature": "e10_anne_theme"}
