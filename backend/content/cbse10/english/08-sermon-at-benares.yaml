    mistakes:
      Seven years: e10u8_life
  - prompt: Why is Benares important in the story?
    options:
    - The Buddha preached his first sermon there
    - Siddhartha was born there
    - He was married there
    - Kisa Gotami lived there
    answer: The Buddha preached his first sermon there
    difficulty: 1
    hints:
    - Read the title.
    - It is on the Ganges.
    solution: The Buddha preached his first sermon at Benares.
    mistakes:
      Siddhartha was born there: e10u8_life
  - prompt: What did Kisa Gotami first ask the neighbours for?
    options:
    - Medicine to cure her son
    - Food
    - Money
    - Mustard seed
    answer: Medicine to cure her son
    difficulty: 2
    hints:
    - She did not accept that he was dead.
