    options:
    - Her yellow hair
    - Her singing
    - Her wealth
    - Her kindness
    answer: Her yellow hair
    difficulty: 1
    hints:
    - Honey-coloured ramparts.
    - Outer beauty.
    solution: He says young men will love her yellow hair.
    mistakes: {"Her wealth": "e10_yellow_hair"}
