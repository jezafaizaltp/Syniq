subject: cbse10-eng
chapter: 8
title: The Sermon at Benares · For Anne Gregory
tips:
  e10_anne_theme: "Anne wants to be loved for who she is, not how she looks."
  e10_bodhi: "The tree of enlightenment is the 'Bodhi' tree. It is a kind of fig with heart-shaped leaves."
  e10_dye: "Anne wants to change its colour, not its length."
  e10_four_sights: "Siddhartha saw suffering for the first time: illness, old age, death and someone who had given up the world."
  e10_kisa: "Kisa could not find a single house where no one had died. What did that teach her?"
  e10_mustard: "The Buddha asked for a small seed, from a very special kind of house."
  e10_only_god: "The old man says no human can love you for yourself alone. Who is left?"
  e10_ramparts: "Ramparts are walls, but here it is a metaphor. What on Anne is golden like honey?"
  e10_wander_years: "Read the line about how long Gautama wandered seeking the truth. It's a number often used in stories."
  e10_yellow_hair: "The poem keeps returning to something Anne could change by dyeing it."

concepts:
- code: cbse10e.u8.sermon
  title: The Sermon at Benares
  notes: |
    Gautama Buddha (Siddhartha Gautama), born a prince in northern India, was shielded from suffering. At about
    twenty-five he saw a sick man, an aged man, a funeral procession, and a monk begging for alms. He left his
    palace to seek enlightenment, wandered for seven years, and sat under a peepal tree (the Bodhi tree, tree of
    wisdom) at Bodh Gaya until he was enlightened. He preached his first sermon at Benares (Varanasi). The story
    of Kisa Gotami: her only son died; she went from house to house asking for medicine. The Buddha asked her
    for a handful of mustard seed from a house where no one had lost a child, husband, parent or friend. She
    found none and understood that death is common to all; grief is selfish. The Buddha taught that all mortals
    must die, and the wise do not grieve; lamentation brings no peace, only more pain.
  explanations:
    text: Prince Siddhartha saw sickness, old age and death, left his palace to understand suffering, and became the Buddha, the Enlightened One. In his sermon at Benares he tells of Kisa Gotami, whose son had died. Asked to bring mustard seed from a house untouched by death, she found none and understood that death comes to everyone.
    visual: Picture Kisa Gotami knocking at door after door, a handful of mustard seed offered at each, but each family saying, 'We have lost someone too.' Her search ends at dusk, with lights flickering out across the city.
    step_by_step: 'Step 1: Siddhartha''s sheltered life. Step 2: The four sights. Step 3: Enlightenment under the Bodhi tree. Step 4: The first sermon at Benares. Step 5: Kisa Gotami and the mustard seed: death is universal.'
    real_world: When we lose someone, it can help to remember, as Kisa Gotami learnt, that every family has faced loss and we are not alone in our grief.
  picture:
    kind: flow
    steps:
    - Prince Siddhartha lives shielded from suffering
    - At about 25 he sees sickness, age, death and a monk
    - He seeks the truth for seven years
    - Enlightenment under the Bodhi tree
    - First sermon at Benares
    alt: 'From prince to Buddha: a sheltered life, the four sights at about twenty-five, seven years of seeking, enlightenment under the Bodhi tree, and the first sermon at Benares.'
  activity:
    type: order
    prompt: 'The Sermon at Benares: put Kisa Gotami''s story in order.'
    steps:
    - Kisa Gotami's only son dies
    - She goes house to house asking for medicine
    - The Buddha asks for mustard seed
    - No house has been free of death
    - She understands death comes to all
    reasons:
      She goes house to house asking for medicine: Grief drives her to search for a cure.
      The Buddha asks for mustard seed: People send her to the Buddha.
      No house has been free of death: She searches for a house where no one died.
      She understands death comes to all: Finding none, she sees death is common to all.
