    solution: He wandered for seven years seeking enlightenment.
    mistakes: {"6": "e10_wander_years"}
  - prompt: What did the Buddha ask Kisa Gotami to bring?
    options:
    - A handful of mustard seed from a house where no one had died
    - Water from the Ganga
    - A flower from his garden
    - Medicine from a doctor
    answer: A handful of mustard seed from a house where no one had died
    difficulty: 1
    hints:
    - A common spice.
    - A special condition.
    solution: He asked for mustard seed from a house that had not lost a child, husband, parent or friend.
    mistakes: {"Water from the Ganga": "e10_mustard"}
  - prompt: What did Kisa Gotami learn?
    options:
    - Death is common to all, and grief for oneself is selfish
    - Mustard seed cures death
    - Her son would return
    - Only the poor die
    answer: Death is common to all, and grief for oneself is selfish
    difficulty: 2
    hints:
    - No house was free of death.
    - She was not alone.
    solution: She understood that death comes to everyone.
    mistakes: {"Mustard seed cures death": "e10_kisa"}
  - prompt: What sights made Siddhartha leave his palace?
    options:
    - A sick man, an aged man, a funeral and a monk
    - A battle and a fire
    - A flood
    - A festival
    answer: A sick man, an aged man, a funeral and a monk
    difficulty: 2
    hints:
