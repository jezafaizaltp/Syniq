  - prompt: Under which tree did Siddhartha gain enlightenment?
    options:
    - Peepal (the Bodhi tree)
    - Banyan
    - Neem
    - Mango
    answer: Peepal (the Bodhi tree)
    difficulty: 1
    hints:
    - Tree of wisdom.
    - At Bodh Gaya.
    solution: He was enlightened under a peepal tree, called the Bodhi tree.
  - prompt: For how many years did Siddhartha wander before his enlightenment?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - Less than ten.
    - Seven.
    solution: He wandered for seven years seeking enlightenment.
  - prompt: What did the Buddha ask Kisa Gotami to bring?
    options:
    - A handful of mustard seed from a house where no one had died
    - Water from the Ganga
    - A flower from his garden
    - Medicine from a doctor
    answer: A handful of mustard seed from a house where no one had died
    difficulty: 1
    hints:
    - A common spice.
    - A special condition.
    solution: He asked for mustard seed from a house that had not lost a child, husband, parent or friend.
  - prompt: What did Kisa Gotami learn?
    options:
    - Death is common to all, and grief for oneself is selfish
    - Mustard seed cures death
    - Her son would return
    - Only the poor die
    answer: Death is common to all, and grief for oneself is selfish
    difficulty: 2
    hints:
    - No house was free of death.
    - She was not alone.
    solution: She understood that death comes to everyone.
  - prompt: What sights made Siddhartha leave his palace?
    options:
    - A sick man, an aged man, a funeral and a monk
    - A battle and a fire
    - A flood
    - A festival
    answer: A sick man, an aged man, a funeral and a monk
    difficulty: 2
    hints:
    - Suffering he had never seen.
    - Four sights.
    solution: He saw sickness, old age, death and a monk seeking peace.
- code: cbse10e.u8.anne
  title: For Anne Gregory (W. B. Yeats)
  after:
  - cbse10e.u8.sermon
  notes: |
    A dialogue between a young woman (Anne Gregory) and an older speaker. He says no young man, thrown into
    despair by her great honey-coloured ramparts (her yellow hair), could love her for herself alone and not
    for her yellow hair. She replies she can dye her hair brown, black or carrot so that men will love her for
    herself. He answers that an old religious man has found a text proving 'only God, my dear, could love you
    for yourself alone and not your yellow hair'. Theme: outer beauty vs inner self; human love is often drawn
    by appearance.
  explanations:
    text: In this conversation, an older speaker tells young Anne that men will always love her for her beautiful yellow hair, not for herself. She says she'll dye it. He replies that only God can love a person purely for who they are, without regard to looks.
    visual: Picture a young woman with golden hair arguing with an old man, holding up pots of brown, black and orange dye; he points upward, saying 'only God'.
    step_by_step: 'Step 1: The speaker''s claim: men love her hair. Step 2: Anne''s reply: she''ll dye it. Step 3: The final answer: only God loves the true self. Step 4: The theme: outer vs inner beauty.'
    real_world: Social media often rewards looks over character, which is the very concern this poem raises.
  picture:
    kind: compare
    columns:
    - title: Speaker
      points:
      - Young men will love your yellow hair
      - Not you for yourself
      - Only God loves the true self
    - title: Anne
      points:
      - I can dye my hair
      - Brown, black or carrot
      - Then they will love me for myself
    alt: 'For Anne Gregory: the speaker says men love her yellow hair, Anne says she''ll dye it, and the speaker answers that only God loves a person for themselves.'
  items:
  - prompt: What does the speaker say men love about Anne?
    options:
    - Her yellow hair
    - Her singing
    - Her wealth
    - Her kindness
    answer: Her yellow hair
    difficulty: 1
    hints:
    - Honey-coloured ramparts.
    - Outer beauty.
    solution: He says young men will love her yellow hair.
  - prompt: What does Anne say she will do?
    options:
    - Dye her hair brown, black or carrot
    - Cut her hair short
    - Wear a hat
    - Leave town
    answer: Dye her hair brown, black or carrot
    difficulty: 1
    hints:
    - Change its colour.
    - So she's loved for herself.
    solution: She says she can dye her hair so men will love her for herself.
  - prompt: According to the old religious man's text, who can love a person for themselves alone?
    options:
    - Only God
    - Her parents
    - Her friends
    - No one at all
    answer: Only God
    difficulty: 1
    hints:
    - The final lines.
    - Divine love.
    solution: Only God could love her for herself alone.
  - prompt: What are the 'great honey-coloured ramparts'?
    options:
    - Anne's yellow hair
    - The walls of a castle
    - A beehive
    - The city walls
    answer: Anne's yellow hair
    difficulty: 2
    hints:
    - A metaphor.
    - Ramparts are protective walls.
    solution: Her golden hair falling over her ears is compared to ramparts.
  - prompt: Who wrote 'For Anne Gregory'?
    options:
    - W. B. Yeats
    - Robert Frost
    - Carl Sandburg
    - Ogden Nash
    answer: W. B. Yeats
    difficulty: 1
    hints:
    - An Irish poet.
    - Anne was his friend's granddaughter.
    solution: The poem is by W. B. Yeats.
    mistakes:
      Robert Frost: eng10_author
  - prompt: What is the theme of the poem?
    options:
    - Outer beauty versus the inner self
    - The beauty of nature
    - War and peace
    - Life in the city
    answer: Outer beauty versus the inner self
    difficulty: 2
    hints:
    - Love for hair vs love for self.
    - Appearance.
    solution: The poem contrasts love for looks with love for the real person.
