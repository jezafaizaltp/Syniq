    - Four sights.
    solution: He saw sickness, old age, death and a monk seeking peace.
    mistakes: {"A battle and a fire": "e10_four_sights"}
- code: cbse10e.u8.anne
  title: For Anne Gregory (W. B. Yeats)
  after:
  - cbse10e.u8.sermon
  notes: |
    A dialogue between a young woman (Anne Gregory) and an older speaker. He says no young man, thrown into
    despair by her great honey-coloured ramparts (her yellow hair), could love her for herself alone and not
    for her yellow hair. She replies she can dye her hair brown, black or carrot so that men will love her for
    herself. He answers that an old religious man has found a text proving 'only God, my dear, could love you
    for yourself alone and not your yellow hair'. Theme: outer beauty vs inner self; human love is often drawn
    by appearance.
  explanations:
    text: In this conversation, an older speaker tells young Anne that men will always love her for her beautiful yellow hair, not for herself. She says she'll dye it. He replies that only God can love a person purely for who they are, without regard to looks.
    visual: Picture a young woman with golden hair arguing with an old man, holding up pots of brown, black and orange dye; he points upward, saying 'only God'.
    step_by_step: 'Step 1: The speaker''s claim: men love her hair. Step 2: Anne''s reply: she''ll dye it. Step 3: The final answer: only God loves the true self. Step 4: The theme: outer vs inner beauty.'
    real_world: Social media often rewards looks over character, which is the very concern this poem raises.
  picture:
    kind: compare
    columns:
    - title: Speaker
      points:
      - Young men will love your yellow hair
      - Not you for yourself
      - Only God loves the true self
    - title: Anne
      points:
      - I can dye my hair
      - Brown, black or carrot
      - Then they will love me for myself
    alt: 'For Anne Gregory: the speaker says men love her yellow hair, Anne says she''ll dye it, and the speaker answers that only God loves a person for themselves.'
  activity:
    type: sort
    prompt: 'For Anne Gregory: who says it?'
    bins:
    - The older speaker
    - Anne
    items:
    - label: No young man will love you for yourself
      bin: The older speaker
      clue: The warning.
      why: The older speaker warns that men love her hair.
    - label: I can dye my hair brown or black
      bin: Anne
      clue: Her answer.
      why: Anne says she can change her hair colour.
    - label: Your yellow hair, those great ramparts
      bin: The older speaker
      clue: He describes her hair.
      why: He calls her honey-coloured hair ramparts.
    - label: So men will love me for myself
      bin: Anne
      clue: What she hopes.
      why: Anne wants to be loved for herself.
    - label: Only God could love you for yourself
      bin: The older speaker
      clue: The final line.
      why: The older speaker ends with this; only God sees past looks.
  items:
