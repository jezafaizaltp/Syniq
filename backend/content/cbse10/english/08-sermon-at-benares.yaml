# CBSE Class 10 English (NCERT First Flight), unit 8: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 8
title: The Sermon at Benares · For Anne Gregory
tips:
  e10_anne_theme: "Anne wants to be loved for who she is, not how she looks."
  e10_bodhi: "The tree of enlightenment is the 'Bodhi' tree. It is a kind of fig with heart-shaped leaves."
  e10_dye: "Anne wants to change its colour, not its length."
  e10_four_sights: "Siddhartha saw suffering for the first time: illness, old age, death and someone who had given up the world."
  e10_kisa: "Kisa could not find a single house where no one had died. What did that teach her?"
  e10_mustard: "The Buddha asked for a small seed, from a very special kind of house."
  e10_only_god: "The old man says no human can love you for yourself alone. Who is left?"
  e10_ramparts: "Ramparts are walls, but here it is a metaphor. What on Anne is golden like honey?"
  e10_wander_years: "Read the line about how long Gautama wandered seeking the truth. It's a number often used in stories."
  e10_yellow_hair: "The poem keeps returning to something Anne could change by dyeing it."
  e10u8_life: 'Siddhartha''s life moves in stages: palace, the four sights, wandering, enlightenment, teaching. Place the event in that order.'
  e10u8_sermon_idea: The sermon's lesson is that all who are born must die, and the wise do not grieve. Check which choice fits that idea.
  e10u8_yeats: The poem is a dialogue between a young woman and an older speaker about outer beauty and inner self. Who says what?

concepts:
- code: cbse10e.u8.sermon
  title: The Sermon at Benares
  notes: |
    Gautama Buddha (Siddhartha Gautama), born a prince in northern India, was shielded from suffering. At about
    twenty-five he saw a sick man, an aged man, a funeral procession, and a monk begging for alms. He left his
    palace to seek enlightenment, wandered for seven years, and sat under a peepal tree (the Bodhi tree, tree of
    wisdom) at Bodh Gaya until he was enlightened. He preached his first sermon at Benares (Varanasi). The story
    of Kisa Gotami: her only son died; she went from house to house asking for medicine. The Buddha asked her
    for a handful of mustard seed from a house where no one had lost a child, husband, parent or friend. She
    found none and understood that death is common to all; grief is selfish. The Buddha taught that all mortals
    must die, and the wise do not grieve; lamentation brings no peace, only more pain.
  explanations:
    text: Prince Siddhartha saw sickness, old age and death, left his palace to understand suffering, and became the Buddha, the Enlightened One. In his sermon at Benares he tells of Kisa Gotami, whose son had died. Asked to bring mustard seed from a house untouched by death, she found none and understood that death comes to everyone.
    visual: Picture Kisa Gotami knocking at door after door, a handful of mustard seed offered at each, but each family saying, 'We have lost someone too.' Her search ends at dusk, with lights flickering out across the city.
    step_by_step: 'Step 1: Siddhartha''s sheltered life. Step 2: The four sights. Step 3: Enlightenment under the Bodhi tree. Step 4: The first sermon at Benares. Step 5: Kisa Gotami and the mustard seed: death is universal.'
    real_world: When we lose someone, it can help to remember, as Kisa Gotami learnt, that every family has faced loss and we are not alone in our grief.
  picture:
    kind: flow
    steps:
    - Prince Siddhartha lives shielded from suffering
    - At about 25 he sees sickness, age, death and a monk
    - He seeks the truth for seven years
    - Enlightenment under the Bodhi tree
    - First sermon at Benares
    alt: 'From prince to Buddha: a sheltered life, the four sights at about twenty-five, seven years of seeking, enlightenment under the Bodhi tree, and the first sermon at Benares.'
  activity:
    type: order
    prompt: 'The Sermon at Benares: put Kisa Gotami''s story in order.'
    steps:
    - Kisa Gotami's only son dies
    - She goes house to house asking for medicine
    - The Buddha asks for mustard seed
    - No house has been free of death
    - She understands death comes to all
    reasons:
      She goes house to house asking for medicine: Grief drives her to search for a cure.
      The Buddha asks for mustard seed: People send her to the Buddha.
      No house has been free of death: She searches for a house where no one died.
      She understands death comes to all: Finding none, she sees death is common to all.
  lesson:
    - teach: Gautama Buddha (c. 563–483 BC) was born Prince Siddhartha Gautama in north India. At twelve he was sent away to study the Hindu sacred scriptures, and at sixteen he married a princess. Shielded from suffering, he lived in the palace for about ten years. Then, going out hunting, he saw a sick man, an aged man, a funeral procession, and a monk begging for alms. These sights moved him to leave the palace and seek enlightenment.
      check:
        prompt: Which of these was one of the sights that moved Siddhartha?
        options:
        - A funeral procession
        - A royal wedding
        - A horse race
        answer: A funeral procession
        why: He saw a sick man, an old man, a funeral and a monk.
      ways:
      - style: visual
        teach: The four sights that moved Prince Siddhartha to seek the truth.
        picture:
          kind: compare
          columns:
          - title: Suffering
            points:
            - a sick man
            - an aged man
            - a funeral
          - title: A way out
            points:
            - a monk begging
            - calm and at peace
          alt: Siddhartha saw suffering in a sick man, an aged man and a funeral. He saw a way out in a calm, peaceful monk begging for alms.
      - style: step_by_step
        teach: 'Follow Siddhartha''s life in order. Step 1: A prince kept away from all sorrow. Step 2: The four sights show him suffering. Step 3: He leaves the palace to seek answers. Step 4: Years of wandering. Step 5: Enlightenment under a tree, and he becomes the Buddha.'
    - teach: He wandered for seven years and then sat under a peepal tree, vowing to stay until he found enlightenment. After seven days he was enlightened and renamed the tree the Bodhi Tree (tree of wisdom). He became the Buddha, the Awakened or Enlightened One, and preached his first sermon at Benares (Varanasi), the holiest bathing place on the Ganges.
      picture:
        kind: flow
        steps:
        - Prince in a palace
        - Sees four sights
        - Wanders 7 years
        - Enlightened under Bodhi Tree
        - First sermon at Benares
        alt: 'The Buddha''s path: prince in a palace, sees four sights, wanders seven years, is enlightened under the Bodhi Tree, preaches at Benares.'
      check:
        prompt: What does 'Bodhi Tree' mean?
        options:
        - Tree of wisdom
        - Tree of fruit
        - Tree of the king
        answer: Tree of wisdom
        why: Bodhi means awakening or wisdom.
      ways:
      - style: real_world
        teach: Many people find that a single shock, like a loved one's illness, makes them think deeply about life. For Siddhartha, the four sights were that shock.
      - style: step_by_step
        teach: 'Understand ''enlightenment''. Step 1: It means waking up to the truth about life. Step 2: The Buddha saw that suffering comes from desire and attachment. Step 3: He saw a path out of suffering. Step 4: He then taught this to others, beginning at Benares.'
    - teach: 'Kisa Gotami''s only son died. Grief-stricken, she carried his body asking for medicine. The Buddha asked her to bring a handful of mustard seed from a house where no one had lost a child, husband, parent or friend. She found no such house, and understood that death is common to all. The sermon teaches: the wise do not grieve; lamenting brings no peace, only more pain; those who overcome sorrow are blessed.'
      check:
        prompt: What did Kisa Gotami realise?
        options:
        - Death comes to everyone, so grief must be overcome
        - Mustard seed cures all illness
        - Her son was only sleeping
        answer: Death comes to everyone, so grief must be overcome
        why: Every house had lost someone.
      ways:
      - style: visual
        teach: Kisa Gotami's search and what it taught her, step by step.
        picture:
          kind: flow
          steps:
          - Her son dies
          - She begs for medicine
          - Buddha asks for mustard seed
          - Every house has lost someone
          - She sees death comes to all
          alt: Kisa Gotami's son dies, she begs for medicine, the Buddha asks for mustard seed from a house where no one has died, every house has lost someone, and she sees that death comes to all.
      - style: real_world
        teach: 'Support groups for grieving families work on the same idea as the mustard seed: meeting others who have lost loved ones eases the feeling of being alone in sorrow.'
  items:
  - prompt: Where did the Buddha preach his first sermon?
    options:
    - Benares (Varanasi)
    - Bodh Gaya
    - Lumbini
    - Kushinagar
    answer: Benares (Varanasi)
    difficulty: 1
    hints:
    - Title of the lesson.
    - On the Ganga.
    solution: The first sermon was preached at Benares.
    mistakes:
      Bodh Gaya: eng10_read_again
  - prompt: Under which tree did Siddhartha gain enlightenment?
    options:
    - Peepal (the Bodhi tree)
    - Banyan
    - Neem
    - Mango
    answer: Peepal (the Bodhi tree)
    difficulty: 1
    hints:
    - Tree of wisdom.
    - At Bodh Gaya.
    solution: He was enlightened under a peepal tree, called the Bodhi tree.
    mistakes: {"Banyan": "e10_bodhi"}
  - prompt: For how many years did Siddhartha wander before his enlightenment?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - Less than ten.
    - Seven.
    solution: He wandered for seven years seeking enlightenment.
    mistakes: {"6": "e10_wander_years"}
  - prompt: What did the Buddha ask Kisa Gotami to bring?
    options:
    - "A handful of mustard seed from a house where no one had died"
    - "Water from the Ganga, carried in a clay pot from Benares"
    - "A flower from his garden, picked before sunrise"
    - "Medicine from a doctor who had cured many children"
    answer: A handful of mustard seed from a house where no one had died
    difficulty: 1
    hints:
    - A common spice.
    - A special condition.
    solution: He asked for mustard seed from a house that had not lost a child, husband, parent or friend.
    mistakes: {"Water from the Ganga, carried in a clay pot from Benares": "e10_mustard"}
  - prompt: What did Kisa Gotami learn?
    options:
    - "Death is common to all, and grief for oneself is selfish"
    - "Mustard seed is a medicine that can cure death"
    - "Her son would come back to life if she prayed"
    - "Only the poor die, while the rich live on"
    answer: Death is common to all, and grief for oneself is selfish
    difficulty: 2
    hints:
    - No house was free of death.
    - She was not alone.
    solution: She understood that death comes to everyone.
    mistakes: {"Mustard seed is a medicine that can cure death": "e10_kisa"}
  - prompt: What sights made Siddhartha leave his palace?
    options:
    - "A sick man, an aged man, a funeral and a monk"
    - "A great battle and a palace fire at night"
    - "A flood that swept away a nearby village"
    - "A festival with music, dancing and feasting"
    answer: A sick man, an aged man, a funeral and a monk
    difficulty: 2
    hints:
    - Suffering he had never seen.
    - Four sights.
    solution: He saw sickness, old age, death and a monk seeking peace.
    mistakes: {"A great battle and a palace fire at night": "e10_four_sights"}
  - prompt: At what age was Siddhartha sent away to study?
    options:
    - Twelve
    - Sixteen
    - Twenty-five
    - Six
    answer: Twelve
    difficulty: 2
    hints:
    - Before his marriage.
    - He married at sixteen.
    solution: At twelve he was sent to study the sacred scriptures.
    mistakes:
      Sixteen: e10u8_life
  - prompt: At what age did Siddhartha marry?
    options:
    - Sixteen
    - Twelve
    - Twenty
    - Thirty
    answer: Sixteen
    difficulty: 2
    hints:
    - Four years after he went to study.
    - He married a princess.
    solution: He married a princess at sixteen.
    mistakes:
      Twelve: e10u8_life
  - prompt: For how long did Siddhartha sit under the peepal tree before enlightenment?
    options:
    - Seven days
    - Seven years
    - One month
    - Forty days
    answer: Seven days
    difficulty: 2
    hints:
    - Seven years was how long he wandered.
    - This was much shorter.
    solution: After seven days under the tree he was enlightened.
    mistakes:
      Seven years: e10u8_life
  - prompt: Why is Benares important in the story?
    options:
    - "The Buddha preached his first sermon there"
    - "Siddhartha was born there as a young prince"
    - "Siddhartha was married there to a princess"
    - "Kisa Gotami lived there with her family"
    answer: The Buddha preached his first sermon there
    difficulty: 1
    hints:
    - Read the title.
    - It is on the Ganges.
    solution: The Buddha preached his first sermon at Benares.
    mistakes:
      "Siddhartha was born there as a young prince": e10u8_life
  - prompt: What did Kisa Gotami first ask the neighbours for?
    options:
    - Medicine to cure her son
    - Food
    - Money
    - Mustard seed
    answer: Medicine to cure her son
    difficulty: 2
    hints:
    - She did not accept that he was dead.
    - She went house to house.
    solution: She asked for medicine, but people laughed, thinking she had lost her senses.
    mistakes:
      Mustard seed: e10u8_sermon_idea
  - prompt: To what does the Buddha compare mortals in the sermon?
    options:
    - "Earthen vessels made by a potter, which all end in being broken"
    - "Birds flying freely in the sky, which never come down"
    - "Stars in the night sky, which never fade or die"
    - "Rivers flowing to the sea, which never stop flowing"
    answer: Earthen vessels made by a potter, which all end in being broken
    difficulty: 3
    hints:
    - Something made of clay.
    - It breaks in the end.
    solution: 'Like clay pots, the life of mortals ends in breaking: death.'
    mistakes:
      "Stars in the night sky, which never fade or die": e10u8_sermon_idea
  - prompt: 'Like ripe fruits, mortals are in danger of:'
    options:
    - Falling, that is, dying
    - Being eaten
    - Turning sweet
    - Growing bigger
    answer: Falling, that is, dying
    difficulty: 2
    hints:
    - Ripe fruit drops early.
    - Think of what falling stands for.
    solution: As ripe fruits are in early danger of falling, mortals are always in danger of death.
    mistakes:
      Turning sweet: e10u8_sermon_idea
  - prompt: According to the sermon, what does weeping and grieving do?
    options:
    - "Brings more pain and harms the body, not peace"
    - "Brings the dead back to life if it is sincere"
    - "Gives peace of mind to the one who grieves"
    - "Cures illness in the body and the mind"
    answer: Brings more pain and harms the body, not peace
    difficulty: 2
    hints:
    - Grief does not change death.
    - It makes one sick and pale.
    solution: Lamenting only increases pain and makes the body suffer.
    mistakes:
      "Gives peace of mind to the one who grieves": e10u8_sermon_idea
  - prompt: What did Kisa Gotami do with her son's body in the end?
    options:
    - "Left it in the forest and went to the Buddha"
    - "Kept it at home and stayed beside it"
    - "Buried it in the palace garden"
    - "Took it all the way to Benares"
    answer: Left it in the forest and went to the Buddha
    difficulty: 3
    hints:
    - She had understood death.
    - She went back to the teacher.
    solution: She put the body away in the forest and returned to the Buddha.
    mistakes:
      "Kept it at home and stayed beside it": e10u8_sermon_idea
  - prompt: 'Assertion (A): The Buddha asked Kisa Gotami to bring mustard seed from a house where no one had died.

      Reason (R): He wanted her to discover for herself that death comes to every family.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. By searching, she learnt that death is universal, which eased her grief. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A friend is shattered after losing a grandparent and feels no one else could understand such pain. What would the Buddha''s lesson to Kisa Gotami suggest?'
    options:
    - "Every family faces death, so grief is shared and must be accepted wisely"
    - "Search everywhere for a medicine that can bring the dead back to life"
    - "Avoid thinking or talking about death altogether, so it hurts less"
    answer: Every family faces death, so grief is shared and must be accepted wisely
    hints:
    - What did Kisa Gotami find in every house?
    - What did she learn about death?
    solution: The Buddha's lesson is that death is common to all, and the wise do not grieve without end.
    mistakes:
      "Search everywhere for a medicine that can bring the dead back to life": e10_kisa
      "Avoid thinking or talking about death altogether, so it hurts less": e10u8_sermon_idea
    exam: case
    difficulty: 2
  - prompt: 'Situation: The Buddha says mortals are like ripe fruits and earthen pots. What does this comparison mean?'
    options:
    - "Like ripe fruit falling or pots breaking, everyone who is born will die"
    - "People are as sweet and tasty as ripe fruit, and as useful as pots"
    - "Pots and ripe fruit last for ever, and so do people who live well"
    answer: Like ripe fruit falling or pots breaking, everyone who is born will die
    hints:
    - What happens to ripe fruit and clay pots in the end?
    - The sermon is about death.
    solution: Ripe fruit falls and earthen pots break; in the same way all living beings must die.
    mistakes:
      "People are as sweet and tasty as ripe fruit, and as useful as pots": e10u8_sermon_idea
      "Pots and ripe fruit last for ever, and so do people who live well": e10u8_sermon_idea
    exam: competency
    difficulty: 2
- code: cbse10e.u8.anne
  title: For Anne Gregory (W. B. Yeats)
  after:
  - cbse10e.u8.sermon
  notes: |
    A dialogue between a young woman (Anne Gregory) and an older speaker. He says no young man, thrown into
    despair by her great honey-coloured ramparts (her yellow hair), could love her for herself alone and not
    for her yellow hair. She replies she can dye her hair brown, black or carrot so that men will love her for
    herself. He answers that an old religious man has found a text proving 'only God, my dear, could love you
    for yourself alone and not your yellow hair'. Theme: outer beauty vs inner self; human love is often drawn
    by appearance.
  explanations:
    text: In this conversation, an older speaker tells young Anne that men will always love her for her beautiful yellow hair, not for herself. She says she'll dye it. He replies that only God can love a person purely for who they are, without regard to looks.
    visual: Picture a young woman with golden hair arguing with an old man, holding up pots of brown, black and orange dye; he points upward, saying 'only God'.
    step_by_step: 'Step 1: The speaker''s claim: men love her hair. Step 2: Anne''s reply: she''ll dye it. Step 3: The final answer: only God loves the true self. Step 4: The theme: outer vs inner beauty.'
    real_world: Social media often rewards looks over character, which is the very concern this poem raises.
  picture:
    kind: compare
    columns:
    - title: Speaker
      points:
      - Young men will love your yellow hair
      - Not you for yourself
      - Only God loves the true self
    - title: Anne
      points:
      - I can dye my hair
      - Brown, black or carrot
      - Then they will love me for myself
    alt: 'For Anne Gregory: the speaker says men love her yellow hair, Anne says she''ll dye it, and the speaker answers that only God loves a person for themselves.'
  activity:
    type: sort
    prompt: 'For Anne Gregory: who says it?'
    bins:
    - The older speaker
    - Anne
    items:
    - label: No young man will love you for yourself
      bin: The older speaker
      clue: The warning.
      why: The older speaker warns that men love her hair.
    - label: I can dye my hair brown or black
      bin: Anne
      clue: Her answer.
      why: Anne says she can change her hair colour.
    - label: Your yellow hair, those great ramparts
      bin: The older speaker
      clue: He describes her hair.
      why: He calls her honey-coloured hair ramparts.
    - label: So men will love me for myself
      bin: Anne
      clue: What she hopes.
      why: Anne wants to be loved for herself.
    - label: Only God could love you for yourself
      bin: The older speaker
      clue: The final line.
      why: The older speaker ends with this; only God sees past looks.
  lesson:
    - teach: '''For Anne Gregory'' by W. B. Yeats is a conversation in three stanzas. Anne was a real young woman, granddaughter of Yeats''s friend Lady Gregory. The older speaker tells her that young men, maddened by her ''great honey-coloured ramparts'' at her ear (her golden hair), will never love her ''for yourself alone''.'
      check:
        prompt: What are the 'honey-coloured ramparts'?
        options:
        - Anne's yellow hair
        - Castle walls
        - Fields of wheat
        answer: Anne's yellow hair
        why: Her hair falls like walls around her ear.
      ways:
      - style: visual
        teach: The two voices in 'For Anne Gregory' and what each believes.
        picture:
          kind: compare
          columns:
          - title: The old speaker
            points:
            - young men love your hair
            - looks attract love
            - only God loves the true self
          - title: Anne
            points:
            - I can dye my hair
            - love me for myself
            - inner self matters
          alt: The old speaker says young men love Anne's hair, that looks attract love, and only God loves the true self. Anne says she can dye her hair and wants to be loved for herself, because the inner self matters.
      - style: real_world
        teach: Many people today worry that friends or followers like their photos, not who they really are. Anne Gregory had the same worry about her golden hair.
    - teach: Anne replies that she can dye her hair brown, black or carrot, so that young men will love her for herself and not her hair. Anne believes outer appearance can be changed to test true love.
      picture:
        kind: compare
        columns:
        - title: The older speaker
          points:
          - men love your yellow hair
          - an old religious man found a text
          - only God loves you for yourself
        - title: Anne
          points:
          - I can dye my hair
          - brown, black or carrot
          - then they will love me for myself
        alt: 'The two voices in the poem: the older speaker says men love Anne''s hair and only God loves her for herself; Anne says she can dye her hair.'
      check:
        prompt: Which colours does Anne say she might dye her hair?
        options:
        - Brown, black or carrot
        - Red, blue or green
        - White or grey
        answer: Brown, black or carrot
        why: She lists three ordinary colours.
      ways:
      - style: step_by_step
        teach: 'Read the poem as a debate. Step 1: Stanza 1: the speaker says her hair will win hearts. Step 2: Stanza 2: Anne says she will change its colour to be loved for herself. Step 3: Stanza 3: the speaker says only God can love her that way. Step 4: The debate is left for the reader to judge.'
      - style: real_world
        teach: When choosing friends, many of us first notice how someone looks or dresses, then come to value them for kindness and humour. Yeats's poem asks which kind of love is real.
    - teach: 'The speaker answers that he heard an old religious man say he had found a text proving that ''only God, my dear, could love you for yourself alone and not your yellow hair''. The theme: human love is drawn by outer beauty; only divine love sees the inner self.'
      check:
        prompt: Who, says the speaker, can love Anne for herself alone?
        options:
        - Only God
        - Her parents
        - Her best friend
        answer: Only God
        why: Human love is drawn by looks.
      ways:
      - style: visual
        teach: Two kinds of love the poem sets side by side.
        picture:
          kind: compare
          columns:
          - title: Love for looks
            points:
            - outer beauty
            - can fade or change
            - human love, says the speaker
          - title: Love for the self
            points:
            - inner goodness
            - lasting
            - divine love, says the speaker
          alt: Love for looks is about outer beauty, can fade or change, and the speaker calls it human love. Love for the self is about inner goodness, is lasting, and the speaker calls it divine love.
      - style: step_by_step
        teach: 'Form your own view of the poem. Step 1: State the speaker''s view. Step 2: State Anne''s view. Step 3: Think of a real example from your life. Step 4: Decide which view you agree with and give one reason.'
  items:
  - prompt: What does the speaker say men love about Anne?
    options:
    - Her yellow hair
    - Her singing
    - Her wealth
    - Her kindness
    answer: Her yellow hair
    difficulty: 1
    hints:
    - Honey-coloured ramparts.
    - Outer beauty.
    solution: He says young men will love her yellow hair.
    mistakes: {"Her wealth": "e10_yellow_hair"}
  - prompt: What does Anne say she will do?
    options:
    - "Dye her hair brown, black or carrot"
    - "Cut her hair very short like a boy"
    - "Wear a big hat to cover her hair"
    - "Leave town and never come back"
    answer: Dye her hair brown, black or carrot
    difficulty: 1
    hints:
    - Change its colour.
    - So she's loved for herself.
    solution: She says she can dye her hair so men will love her for herself.
    mistakes: {"Cut her hair very short like a boy": "e10_dye"}
  - prompt: According to the old religious man's text, who can love a person for themselves alone?
    options:
    - Only God
    - Her parents
    - Her friends
    - No one at all
    answer: Only God
    difficulty: 1
    hints:
    - The final lines.
    - Divine love.
    solution: Only God could love her for herself alone.
    mistakes: {"Her parents": "e10_only_god"}
  - prompt: What are the 'great honey-coloured ramparts'?
    options:
    - Anne's yellow hair
    - The walls of a castle
    - A beehive
    - The city walls
    answer: Anne's yellow hair
    difficulty: 2
    hints:
    - A metaphor.
    - Ramparts are protective walls.
    solution: Her golden hair falling over her ears is compared to ramparts.
    mistakes: {"The walls of a castle": "e10_ramparts"}
  - prompt: Who wrote 'For Anne Gregory'?
    options:
    - W. B. Yeats
    - Robert Frost
    - Carl Sandburg
