# CBSE Class 10 English (NCERT First Flight), unit 2: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 2
title: 'Nelson Mandela: Long Walk to Freedom · A Tiger in the Zoo'
tips:
  e10_apartheid: "Apartheid means 'apartness'. What were people kept apart by?"
  e10_courage: "Mandela admits he felt fear many times. So courage must be about what you do with the fear."
  e10_mandela_year: "1990 is when Mandela was freed from prison. The swearing-in came after South Africa's first free elections, four years later."
  e10_oppressor: "Mandela says the oppressor is also a prisoner. A prisoner of what feeling?"
  e10_quiet_rage: "He is angry but cannot do anything about it. Why would that anger stay silent?"
  e10_tiger_cage: "The tiger is restless, not resting. Picture him walking up and down."
  e10_tiger_stars: "He ignores the visitors. At night he looks far above, at something bright."
  e10_tiger_theme: "The poem contrasts the cage with the forest. Whose side is the poet on?"
  e10_tiger_wild: "The poet wants him free, not in any cage. Look for the jungle scene with water."
  e10_twin: "Mandela says every man has two duties: one at home and one to the wider community."
  e10_velvet_pads: "Pads are the soft undersides of feet. What does velvet tell you about how he walks?"

concepts:
- code: cbse10e.u2.mandela
  title: 'Nelson Mandela: Long Walk to Freedom'
  notes: |
    On 10 May 1994, Nelson Mandela was sworn in as South Africa's first Black President, at the amphitheatre of
    the Union Buildings in Pretoria, before dignitaries from many nations. He spoke of ending an 'extraordinary
    human disaster' (apartheid, a system of racial discrimination) and building a society all humanity would be
    proud of. Jets flew past; two national anthems were sung. He remembers the many who sacrificed for freedom
    and says the country's greatest wealth is its people. Every man has twin obligations: to his family and to
    his people and country; under apartheid, fulfilling one meant neglecting the other. Courage is 'not the
    absence of fear, but the triumph over it'. No one is born hating; people learn to hate and can be taught
    to love. Freedom grew from a boy's personal freedom to a hunger for the freedom of his people; the oppressor
    must be liberated as surely as the oppressed, because both are robbed of their humanity.
  explanations:
    text: On 10 May 1994 Nelson Mandela became South Africa's first Black President, ending apartheid. In his memoir he explains that true courage is triumphing over fear, that hatred is learnt and love can be taught, and that both the oppressed and the oppressor need to be freed.
    visual: Picture the Union Buildings in Pretoria with leaders from around the world, fighter jets trailing smoke in the colours of the new flag, and two anthems being sung together.
    step_by_step: 'Step 1: The event: the inauguration on 10 May 1994. Step 2: What it ended: apartheid. Step 3: His ideas: twin obligations, courage, love can be taught. Step 4: His meaning of freedom: for all, including the oppressor.'
    real_world: 'Mandela spent 27 years in prison and still chose forgiveness over revenge: an example of ''the triumph over fear''.'
  picture:
    kind: flow
    steps:
    - 'Boyhood: freedom to run and play'
    - 'Youth: wanting freedom for himself'
    - Seeing his people were not free
    - Hunger for the freedom of all his people
    - '10 May 1994: first democratic government'
    alt: Mandela's idea of freedom grew from a boy's freedom to play, to his own rights, to the freedom of all his people, achieved on 10 May 1994.
  activity:
    type: sort
    prompt: 'Long Walk to Freedom: what did Mandela say about each?'
    bins:
    - Courage
    - Twin obligations
    - Hate and love
    - Freedom
    items:
    - label: Not the absence of fear
      bin: Courage
      clue: What does a brave person do with fear?
      why: Courage is the triumph over fear, not having none.
    - label: To family and to his people
      bin: Twin obligations
      clue: Two duties.
      why: 'Every man has two duties: to family, and to people and country.'
    - label: No one is born hating
      bin: Hate and love
      clue: Hate is learnt.
      why: People learn to hate, so they can learn to love.
    - label: The oppressor must be liberated too
      bin: Freedom
      clue: Both sides lose their humanity.
      why: Mandela said freedom is for oppressor and oppressed alike.
    - label: Apartheid made one duty neglect the other
      bin: Twin obligations
      clue: A Black man couldn't do both.
      why: 'Serving his people meant leaving his family: the twin obligations clashed.'
    - label: Can be taught to love
      bin: Hate and love
      clue: If hate is learnt…
      why: Since hatred is taught, love can be taught too.
  items:
  - prompt: In which year was Nelson Mandela sworn in as President of South Africa?
    answer: '1994'
    check: '1994'
    difficulty: 1
    hints:
    - 10 May.
    - Early 1990s.
    solution: He was inaugurated on 10 May 1994.
    mistakes: {"1990": "e10_mandela_year"}
  - prompt: Where did the inauguration ceremony take place?
    options:
    - The amphitheatre of the Union Buildings, Pretoria
    - Robben Island
    - Cape Town stadium
    - Johannesburg airport
    answer: The amphitheatre of the Union Buildings, Pretoria
    difficulty: 2
    hints:
    - A government building.
    - In Pretoria.
    solution: The ceremony was held at the Union Buildings in Pretoria.
    mistakes:
      Robben Island: eng10_read_again
  - prompt: What was apartheid?
    options:
    - A system of racial discrimination
    - A sports event
    - A kind of government building
    - A national anthem
    answer: A system of racial discrimination
    difficulty: 1
    hints:
    - '''Extraordinary human disaster''.'
    - Separation by race.
    solution: Apartheid was a political system that separated people by race and denied Black people rights.
    mistakes: {"A kind of government building": "e10_apartheid"}
  - prompt: According to Mandela, what is courage?
    options:
    - Not the absence of fear, but the triumph over it
    - Never feeling afraid
    - Fighting with weapons
    - Avoiding danger
    answer: Not the absence of fear, but the triumph over it
    difficulty: 1
    hints:
    - Brave people also feel fear.
    - They conquer it.
    solution: He says the brave man is not one who feels no fear but one who conquers it.
    mistakes: {"Never feeling afraid": "e10_courage"}
  - prompt: What are the 'twin obligations' Mandela speaks of?
    options:
    - To one's family and to one's people and country
    - To work and to play
    - To the church and the state
    - To friends and enemies
    answer: To one's family and to one's people and country
    difficulty: 2
    hints:
    - Two kinds of duty.
    - Apartheid made it hard to do both.
    solution: Every man has duties to his family and to his community and country.
    mistakes: {"To work and to play": "e10_twin"}
  - prompt: Why does Mandela say the oppressor must also be liberated?
    options:
    - Hatred robs the oppressor of his humanity too
    - Oppressors are poor
    - Oppressors want to leave the country
    - It is a law
    answer: Hatred robs the oppressor of his humanity too
    difficulty: 2
    hints:
    - Both are 'robbed of their humanity'.
    - Prisoner of hatred.
    solution: A person who takes away another's freedom is a prisoner of hatred and prejudice, so he too must be freed.
    mistakes: {"Oppressors want to leave the country": "e10_oppressor"}
- code: cbse10e.u2.tiger
  title: A Tiger in the Zoo (Leslie Norris)
  after:
  - cbse10e.u2.mandela
  notes: |
    The poem contrasts a tiger in a zoo with where it should be. In the cage he stalks 'the length of his
    cage', quiet and full of rage, with velvet pads. He should be lurking in shadow, sliding through long
    grass near the water hole where plump deer pass; snarling around houses at the jungle's edge, baring his
    white fangs and claws, terrorising the village. Instead he ignores visitors, hears the last voice at night
    and the patrolling cars, and stares with his brilliant eyes at the brilliant stars. Theme: captivity versus
    freedom; animals belong in the wild.
  explanations:
    text: 'The poet shows a tiger pacing in a small cage and imagines where it should be: hiding in long grass near a water hole, hunting deer, roaring near villages at the forest''s edge. Trapped, its only escape is staring at the stars at night. The poem asks whether wild animals should be caged at all.'
    visual: 'Draw two halves: on the left, a tiger pacing back and forth behind bars, eyes on the stars; on the right, a tiger crouched in tall grass by a pool as deer come to drink.'
    step_by_step: 'Step 1: Find the cage lines (stalks, quiet rage, ignores visitors). Step 2: Find the wild lines (shadow, long grass, water hole, village edge). Step 3: Compare them. Step 4: State the theme: freedom vs captivity.'
    real_world: Many modern zoos now build large open enclosures, or support wildlife sanctuaries instead, because animals pace and suffer in small cages.
  picture:
    kind: compare
    columns:
    - title: In the zoo
      points:
      - Stalks the length of his cage
      - Quiet rage
      - Ignores visitors
      - Stares at the stars at night
    - title: In the wild
      points:
      - Lurks in shadow, long grass
      - Near the water hole, deer pass
      - Snarls at the jungle's edge
      - Terrorises the village
    alt: The tiger in the zoo, pacing with quiet rage and staring at the stars, compared with the tiger in the wild, lurking in grass by the water hole and snarling at the jungle's edge.
  activity:
    type: sort
    prompt: 'A Tiger in the Zoo: in the cage or in the wild?'
    bins:
    - In the cage
    - In the wild
    items:
    - label: Stalks the length of his cage
      bin: In the cage
      clue: Limited space.
      why: Walking only the cage's length is captivity.
    - label: Lurks in shadow near the water hole
      bin: In the wild
      clue: Where deer pass.
      why: 'The water hole and long grass are where he should be: the wild.'
    - label: Ignores visitors
      bin: In the cage
      clue: People staring at him.
      why: Visitors come to the zoo, so this is in the cage.
    - label: Snarls around houses at the jungle edge
      bin: In the wild
      clue: Terrorising the village.
      why: Scaring villagers is his wild nature.
    - label: Stares at the brilliant stars
      bin: In the cage
      clue: At night, hearing patrol cars.
      why: At night in the zoo he stares at stars, longing to be free.
    - label: Bares white fangs and claws
      bin: In the wild
      clue: Showing his power.
      why: Showing fangs is his natural, wild behaviour.
  items:
  - prompt: What does the tiger do in the cage?
    options:
    - Stalks the length of his cage
    - Sleeps all day
    - Plays with visitors
    - Eats constantly
    answer: Stalks the length of his cage
    difficulty: 1
    hints:
    - He moves restlessly.
    - Few steps of space.
    solution: He paces the length of his cage in quiet rage.
    mistakes: {"Sleeps all day": "e10_tiger_cage"}
  - prompt: Where does the poet say the tiger should be?
    options:
    - Lurking in shadow near the water hole
    - In a circus
    - In a bigger cage
    - In a city park
    answer: Lurking in shadow near the water hole
    difficulty: 1
    hints:
    - The wild.
    - Where plump deer pass.
    solution: He should be hiding in long grass near the water hole, hunting deer.
    mistakes: {"In a bigger cage": "e10_tiger_wild"}
  - prompt: What does the tiger stare at, at night?
    options:
    - The brilliant stars
    - The zookeeper
    - The moon only
    - The visitors
    answer: The brilliant stars
    difficulty: 1
    hints:
    - Last line.
    - His brilliant eyes.
    solution: He stares with his brilliant eyes at the brilliant stars.
    mistakes: {"The visitors": "e10_tiger_stars"}
  - prompt: What is the poem's main theme?
    options:
    - Wild animals suffer in captivity and belong in the wild
    - Zoos are fun for children
    - Tigers are dangerous to villages
    - Stars are beautiful
    answer: Wild animals suffer in captivity and belong in the wild
    difficulty: 2
    hints:
    - Contrast between cage and jungle.
    - Quiet rage.
    solution: The poem contrasts captivity with freedom to show that animals belong in their natural home.
    mistakes: {"Zoos are fun for children": "e10_tiger_theme"}
  - prompt: Why is the tiger's rage called 'quiet'?
    options:
    - He is angry but powerless in the cage, so he can't express it
    - He is happy
    - He is asleep
    - He is ill
    answer: He is angry but powerless in the cage, so he can't express it
    difficulty: 2
    hints:
    - Rage held inside.
    - No space to show it.
    solution: His anger at being caged has no outlet, so it stays silent.
    mistakes: {"He is happy": "e10_quiet_rage"}
  - prompt: 'In the poem, ''on pads of velvet quiet'' describes:'
    options:
    - His soft, silent paws
    - His fur colour
    - The cage floor
    - The visitors' clothes
    answer: His soft, silent paws
    difficulty: 2
    hints:
    - Pads are paw cushions.
    - Velvet is soft.
    solution: The tiger's paws are soft as velvet, making no sound.
    mistakes: {"His fur colour": "e10_velvet_pads"}
