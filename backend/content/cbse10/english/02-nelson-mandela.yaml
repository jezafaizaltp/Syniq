    solution: The tiger's paws are soft as velvet, making no sound.
    mistakes: {"His fur colour": "e10_velvet_pads"}
  - prompt: What is the tiger's cage made of, as the poem describes it?
    options:
    - Concrete
    - Wood
    - Glass
    - Grass
    answer: Concrete
    difficulty: 1
