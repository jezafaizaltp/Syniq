  - prompt: In the wild, what would the tiger do at the edge of the forest?
    options:
    - Snarl around houses and terrorise the village
    - Sleep in the sun
    - Play with children
    - Eat grass
    answer: Snarl around houses and terrorise the village
    difficulty: 2
    hints:
    - He would show his strength.
    - Villagers would fear him.
    solution: He would snarl near houses and frighten the village.
    mistakes:
      Play with children: e10u2_tiger_contrast
  - prompt: Why does the tiger ignore visitors?
    options:
    - He is angry and unhappy at being caged
    - He can't see them
    - He likes them
    - He is asleep
    answer: He is angry and unhappy at being caged
    difficulty: 2
    hints:
    - Think of his quiet rage.
    - He wants freedom, not attention.
    solution: Trapped and frustrated, the tiger pays no attention to the visitors.
    mistakes:
      He likes them: e10_quiet_rage
  - prompt: What poetic device is used in 'brilliant eyes / brilliant stars'?
    options:
    - Repetition
    - Simile
    - Rhyme scheme only
    - Onomatopoeia
    answer: Repetition
    difficulty: 3
    hints:
    - One word is used twice.
    - It links the eyes and the stars.
    solution: Repeating 'brilliant' joins the tiger's eyes with the stars and his longing.
