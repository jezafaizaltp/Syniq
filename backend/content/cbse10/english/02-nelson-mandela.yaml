# CBSE Class 10 English (NCERT First Flight), unit 2: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 2
title: 'Nelson Mandela: Long Walk to Freedom · A Tiger in the Zoo'
tips:
  e10_apartheid: "Apartheid means 'apartness'. What were people kept apart by?"
  e10_courage: "Mandela admits he felt fear many times. So courage must be about what you do with the fear."
  e10_mandela_year: "1990 is when Mandela was freed from prison. The swearing-in came after South Africa's first free elections, four years later."
  e10_oppressor: "Mandela says the oppressor is also a prisoner. A prisoner of what feeling?"
  e10_quiet_rage: "He is angry but cannot do anything about it. Why would that anger stay silent?"
  e10_tiger_cage: "The tiger is restless, not resting. Picture him walking up and down."
  e10_tiger_stars: "He ignores the visitors. At night he looks far above, at something bright."
  e10_tiger_theme: "The poem contrasts the cage with the forest. Whose side is the poet on?"
  e10_tiger_wild: "The poet wants him free, not in any cage. Look for the jungle scene with water."
  e10_twin: "Mandela says every man has two duties: one at home and one to the wider community."
  e10_velvet_pads: "Pads are the soft undersides of feet. What does velvet tell you about how he walks?"
  e10u2_freedom: 'Mandela describes how his idea of freedom grew: first his own small freedoms as a boy, then the freedom of his people. Which stage is this?'
  e10u2_ceremony: 'Picture the inauguration day: leaders from many countries, jets flying past, and the new flag. What happened there?'
  e10u2_vocab: 'Use the sentence around the word: what is happening to the people or the country at that moment?'
  e10u2_tiger_contrast: 'The poem moves between two places: the cage where the tiger is, and the wild where he should be. Which place is this line about?'

concepts:
- code: cbse10e.u2.mandela
  title: 'Nelson Mandela: Long Walk to Freedom'
  notes: |
    On 10 May 1994, Nelson Mandela was sworn in as South Africa's first Black President, at the amphitheatre of
    the Union Buildings in Pretoria, before dignitaries from many nations. He spoke of ending an 'extraordinary
    human disaster' (apartheid, a system of racial discrimination) and building a society all humanity would be
    proud of. Jets flew past; two national anthems were sung. He remembers the many who sacrificed for freedom
    and says the country's greatest wealth is its people. Every man has twin obligations: to his family and to
    his people and country; under apartheid, fulfilling one meant neglecting the other. Courage is 'not the
    absence of fear, but the triumph over it'. No one is born hating; people learn to hate and can be taught
    to love. Freedom grew from a boy's personal freedom to a hunger for the freedom of his people; the oppressor
    must be liberated as surely as the oppressed, because both are robbed of their humanity.
  explanations:
    text: On 10 May 1994 Nelson Mandela became South Africa's first Black President, ending apartheid. In his memoir he explains that true courage is triumphing over fear, that hatred is learnt and love can be taught, and that both the oppressed and the oppressor need to be freed.
    visual: Picture the Union Buildings in Pretoria with leaders from around the world, fighter jets trailing smoke in the colours of the new flag, and two anthems being sung together.
    step_by_step: 'Step 1: The event: the inauguration on 10 May 1994. Step 2: What it ended: apartheid. Step 3: His ideas: twin obligations, courage, love can be taught. Step 4: His meaning of freedom: for all, including the oppressor.'
    real_world: 'Mandela spent 27 years in prison and still chose forgiveness over revenge: an example of ''the triumph over fear''.'
  picture:
    kind: flow
    steps:
    - 'Boyhood: freedom to run and play'
    - 'Youth: wanting freedom for himself'
    - Seeing his people were not free
    - Hunger for the freedom of all his people
    - '10 May 1994: first democratic government'
    alt: Mandela's idea of freedom grew from a boy's freedom to play, to his own rights, to the freedom of all his people, achieved on 10 May 1994.
  activity:
    type: sort
    prompt: 'Long Walk to Freedom: what did Mandela say about each?'
    bins:
    - Courage
    - Twin obligations
    - Hate and love
    - Freedom
    items:
    - label: Not the absence of fear
      bin: Courage
      clue: What does a brave person do with fear?
      why: Courage is the triumph over fear, not having none.
    - label: To family and to his people
      bin: Twin obligations
      clue: Two duties.
      why: 'Every man has two duties: to family, and to people and country.'
    - label: No one is born hating
      bin: Hate and love
      clue: Hate is learnt.
      why: People learn to hate, so they can learn to love.
    - label: The oppressor must be liberated too
      bin: Freedom
      clue: Both sides lose their humanity.
      why: Mandela said freedom is for oppressor and oppressed alike.
    - label: Apartheid made one duty neglect the other
      bin: Twin obligations
      clue: A Black man couldn't do both.
      why: 'Serving his people meant leaving his family: the twin obligations clashed.'
    - label: Can be taught to love
      bin: Hate and love
      clue: If hate is learnt…
      why: Since hatred is taught, love can be taught too.
  lesson:
    - teach: On 10 May 1994, Nelson Mandela was sworn in as South Africa's first Black President at the Union Buildings amphitheatre in Pretoria. Leaders from many nations came. He spoke of a 'rainbow nation' and of ending apartheid, the system of racial discrimination that had kept people apart by colour.
      check:
        prompt: Where was Mandela sworn in?
        options:
        - Union Buildings, Pretoria
        - Robben Island
        - Cape Town stadium
        answer: Union Buildings, Pretoria
        why: An amphitheatre there.
      ways:
      - style: visual
        teach: 'The inauguration day: what each part of the ceremony showed.'
        picture:
          kind: compare
          columns:
          - title: Leaders from many nations
            points:
            - the world accepts the new government
            - South Africa no longer shunned
          - title: Air force jets
            points:
            - the army is loyal to democracy
          - title: Two anthems sung
            points:
            - old and new South Africa joined
            - unity
          alt: Leaders from many nations showed the world accepted the new government and South Africa was no longer shunned. Air force jets showed the army's loyalty to democracy. Two anthems sung together showed unity between old and new South Africa.
      - style: real_world
        teach: On India's Republic Day, the parade, the flag and foreign guests show the country's unity and its place in the world. Mandela's inauguration did the same for a new South Africa.
    - teach: 'Mandela says every man has twin obligations: to his family, parents and wife and children, and to his people, community and country. Under apartheid a Black man who tried to fulfil his duty to his people was punished, so he could not live a normal family life.'
      picture:
        kind: compare
        columns:
        - title: Duty to family
          points:
          - Parents
          - Wife and children
        - title: Duty to people
          points:
          - Community
          - Country
        alt: 'Mandela''s twin obligations: to his family (parents, wife and children) and to his people (community and country).'
      check:
        prompt: Why couldn't Mandela fulfil both duties?
        options:
        - Apartheid punished those who served their people
        - He had no family
        - He lived abroad
        answer: Apartheid punished those who served their people
        why: He was jailed for it.
      ways:
      - style: step_by_step
        teach: 'Understand the twin obligations. Step 1: Duty one is to family: parents, partner, children. Step 2: Duty two is to the people and the country. Step 3: In a free country, one can meet both. Step 4: Under apartheid, serving the people meant prison, so family was left behind.'
      - style: real_world
        teach: Soldiers posted far from home, and freedom fighters who went to jail, often had to choose country over family. Mandela describes that painful choice.
    - teach: 'Mandela''s idea of freedom grew: as a boy he wanted freedom to run in the fields; as a young man, freedom to earn and marry; then he saw his people were not free, and the ''hunger for freedom'' for all became his life. He says courage is not the absence of fear but the triumph over it, and the oppressor too is a prisoner of hatred.'
      check:
        prompt: For Mandela, courage is…
        options:
        - The triumph over fear
        - Having no fear
        - Being angry
        answer: The triumph over fear
        why: Brave people feel fear but conquer it.
      ways:
      - style: visual
        teach: How Mandela's idea of freedom grew from a boy's wish to a whole people's right.
        picture:
          kind: flow
          steps:
          - 'Boy: run free in the fields'
          - 'Young man: earn a living, marry'
          - Sees his people are not free
          - Joins the struggle for all
          - Sees the oppressor must be freed too
          alt: As a boy Mandela wanted to run free in the fields. As a young man he wanted to earn a living and marry. Then he saw his people were not free, joined the struggle for all, and came to see that the oppressor must be freed too.
      - style: step_by_step
        teach: 'Read Mandela''s idea of courage. Step 1: He admits he felt fear many times. Step 2: Brave people still feel fear. Step 3: Courage is acting rightly despite the fear. Step 4: So courage means beating fear, not never having it.'
  items:
  - prompt: In which year was Nelson Mandela sworn in as President of South Africa?
    answer: '1994'
    check: '1994'
    difficulty: 1
    hints:
    - 10 May.
    - Early 1990s.
    solution: He was inaugurated on 10 May 1994.
    mistakes: {"1990": "e10_mandela_year"}
  - prompt: Where did the inauguration ceremony take place?
    options:
    - "The amphitheatre of the Union Buildings, Pretoria"
    - "The prison on Robben Island, near Cape Town"
    - "A sports stadium in the city of Cape Town"
    - "The main airport building in Johannesburg"
    answer: The amphitheatre of the Union Buildings, Pretoria
    difficulty: 2
    hints:
    - A government building.
    - In Pretoria.
    solution: The ceremony was held at the Union Buildings in Pretoria.
    mistakes:
      "The prison on Robben Island, near Cape Town": eng10_read_again
  - prompt: What was apartheid?
    options:
    - A system of racial discrimination
    - A sports event
    - A kind of government building
    - A national anthem
    answer: A system of racial discrimination
    difficulty: 1
    hints:
    - '''Extraordinary human disaster''.'
    - Separation by race.
    solution: Apartheid was a political system that separated people by race and denied Black people rights.
    mistakes: {"A kind of government building": "e10_apartheid"}
  - prompt: According to Mandela, what is courage?
    options:
    - "Not the absence of fear, but the triumph over it"
    - "Never feeling afraid of anything at all"
    - "Fighting the enemy with weapons"
    - "Staying away from every danger"
    answer: Not the absence of fear, but the triumph over it
    difficulty: 1
    hints:
    - Brave people also feel fear.
    - They conquer it.
    solution: He says the brave man is not one who feels no fear but one who conquers it.
    mistakes: {"Never feeling afraid of anything at all": "e10_courage"}
  - prompt: What are the 'twin obligations' Mandela speaks of?
    options:
    - "To one's family and to one's people and country"
    - "To one's work and to one's play and rest"
    - "To the church and to the state that rules"
    - "To one's friends and to one's enemies"
    answer: To one's family and to one's people and country
    difficulty: 2
    hints:
    - Two kinds of duty.
    - Apartheid made it hard to do both.
    solution: Every man has duties to his family and to his community and country.
    mistakes: {"To one's work and to one's play and rest": "e10_twin"}
  - prompt: Why does Mandela say the oppressor must also be liberated?
    options:
    - Hatred robs the oppressor of his humanity too
    - Oppressors are poor
    - Oppressors want to leave the country
    - It is a law
    answer: Hatred robs the oppressor of his humanity too
    difficulty: 2
    hints:
    - Both are 'robbed of their humanity'.
    - Prisoner of hatred.
    solution: A person who takes away another's freedom is a prisoner of hatred and prejudice, so he too must be freed.
    mistakes: {"Oppressors want to leave the country": "e10_oppressor"}
  - prompt: Mandela was President of which country?
    options:
    - South Africa
    - Kenya
    - Nigeria
    - Zimbabwe
    answer: South Africa
    difficulty: 1
    hints:
    - The ceremony was in Pretoria.
    - The country that had apartheid.
    solution: Nelson Mandela became the first Black President of South Africa.
    mistakes:
      Kenya: eng10_read_again
  - prompt: What did the jets of the South African Air Force show at the ceremony?
    options:
    - "The military's loyalty to democracy"
    - "That a war was about to begin"
    - "A sports show for the guests"
    - "A protest against the new government"
    answer: The military's loyalty to democracy
    difficulty: 2
    hints:
    - The same forces once served apartheid.
    - Now they saluted the new President.
    solution: The fly-past showed the army's loyalty to the new democracy.
    mistakes:
      "That a war was about to begin": e10u2_ceremony
  - prompt: Why does Mandela call South Africa's new nation a 'rainbow' nation?
    options:
    - "It includes people of many races and colours"
    - "It rains a lot there, so rainbows are common"
    - "It has a colourful flag, and that is all"
    - "It is near the sea, where rainbows form"
    answer: It includes people of many races and colours
    difficulty: 2
    hints:
    - A rainbow has many colours together.
    - Apartheid had kept them apart.
    solution: The rainbow stands for many races living together in one nation.
    mistakes:
      "It rains a lot there, so rainbows are common": e10_apartheid
  - prompt: What did freedom mean to Mandela as a boy?
    options:
    - "Running in the fields and swimming in streams"
    - "The freedom of all his people from apartheid"
    - "Earning a living and raising a family"
    - "Becoming President of his country"
    answer: Running in the fields and swimming in streams
    difficulty: 2
    hints:
    - He was a child then.
    - Simple outdoor freedoms.
    solution: 'As a boy he thought he was born free: to run, swim, roast mealies and ride bulls.'
    mistakes:
      "The freedom of all his people from apartheid": e10u2_freedom
  - prompt: In the text, what does 'transitory' mean?
    options:
    - "Lasting only a short time"
    - "Lasting for ever, permanent"
    - "Very loud and noisy"
    - "Painful and hard to bear"
    answer: Lasting only a short time
    difficulty: 3
    hints:
    - Mandela says his early freedom was 'an illusion'.
    - It didn't last.
    solution: Transitory means temporary, not lasting.
    mistakes:
      "Lasting for ever, permanent": e10u2_vocab
  - prompt: Who were sworn in as Deputy Presidents along with Mandela?
    options:
    - "Thabo Mbeki and F. W. de Klerk"
    - "Desmond Tutu and Oliver Tambo"
    - "Walter Sisulu and Oliver Tambo"
    - "Desmond Tutu and Walter Sisulu"
    answer: Thabo Mbeki and F. W. de Klerk
    difficulty: 3
    hints:
    - There were two deputies.
    - One was the outgoing white leader.
    solution: Thabo Mbeki and F. W. de Klerk were sworn in as Deputy Presidents.
    mistakes:
      "Desmond Tutu and Oliver Tambo": eng10_read_again
  - prompt: What does Mandela say the oppressor is a prisoner of?
    options:
    - "Hatred, prejudice and narrow-mindedness"
    - "A jail cell on a lonely island"
    - "Poverty and hunger in old age"
    - "The law of the old government"
    answer: Hatred, prejudice and narrow-mindedness
    difficulty: 2
    hints:
    - The oppressor is not physically locked up.
    - His own feelings trap him.
    solution: The oppressor is locked behind the bars of prejudice and narrow-mindedness.
    mistakes:
      "A jail cell on a lonely island": e10_oppressor
  - prompt: What did Mandela say is the greatest wealth of his country?
    options:
    - Its people
    - Its gold
    - Its diamonds
    - Its farms
    answer: Its people
    difficulty: 2
    hints:
    - Not minerals, though the country is rich in them.
    - Finer than the purest diamonds.
    solution: Mandela said the country's greatest wealth is its people.
    mistakes:
      Its gold: e10u2_vocab
  - prompt: Why did Mandela join the African National Congress?
    options:
    - "His hunger for his own freedom became a hunger for his people's freedom"
    - "He wanted to become rich and powerful through politics and to own land"
    - "He wanted to leave the country and live abroad in safety with his family"
    - "His family forced him to join against his wishes when he was still a boy"
    answer: His hunger for his own freedom became a hunger for his people's freedom
    difficulty: 3
    hints:
    - He saw that his people were not free.
    - His aim widened.
    solution: Realising all his people were unfree, he joined the ANC to fight for them.
    mistakes:
      "He wanted to become rich and powerful through politics and to own land": e10u2_freedom
  - prompt: 'Assertion (A): Mandela says the oppressor must be liberated just as surely as the oppressed.

      Reason (R): A person who takes away another''s freedom is a prisoner of hatred, prejudice and narrow-mindedness.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The oppressor is also not free, being trapped by hatred, so he too needs liberation. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A student says, ''Mandela was never afraid, so he was brave.'' How would Mandela respond?'
    options:
    - "He felt fear many times; courage is triumph over fear"
    - "He agrees: truly brave people never feel any fear"
    - "Courage means staying away from danger altogether"
    answer: He felt fear many times; courage is triumph over fear
    hints:
    - Does Mandela say he never felt afraid?
    - What does he say courage is?
    solution: Mandela says he felt fear more times than he could remember, and that the brave man is one who conquers fear.
    mistakes:
      "He agrees: truly brave people never feel any fear": e10_courage
      "Courage means staying away from danger altogether": e10_courage
    exam: case
    difficulty: 2
  - prompt: 'Situation: Mandela says South Africa''s greatest wealth is its people, not its gold or diamonds. What does this suggest about his values?'
    options:
    - "He values human goodness and courage more than riches"
    - "He thinks gold and diamond mining should stop"
    - "He believes that only the leaders of a nation matter"
    answer: He values human goodness and courage more than riches
    hints:
    - What does he compare people with?
    - What has he seen in people during the struggle?
    solution: Mandela saw courage and goodness in ordinary people, which he valued more than the country's minerals.
    mistakes:
      "He thinks gold and diamond mining should stop": eng10_read_again
      "He believes that only the leaders of a nation matter": e10u2_freedom
    exam: competency
    difficulty: 2
- code: cbse10e.u2.tiger
  title: A Tiger in the Zoo (Leslie Norris)
  after:
  - cbse10e.u2.mandela
  notes: |
    The poem contrasts a tiger in a zoo with where it should be. In the cage he stalks 'the length of his
    cage', quiet and full of rage, with velvet pads. He should be lurking in shadow, sliding through long
    grass near the water hole where plump deer pass; snarling around houses at the jungle's edge, baring his
    white fangs and claws, terrorising the village. Instead he ignores visitors, hears the last voice at night
    and the patrolling cars, and stares with his brilliant eyes at the brilliant stars. Theme: captivity versus
    freedom; animals belong in the wild.
  explanations:
    text: 'The poet shows a tiger pacing in a small cage and imagines where it should be: hiding in long grass near a water hole, hunting deer, roaring near villages at the forest''s edge. Trapped, its only escape is staring at the stars at night. The poem asks whether wild animals should be caged at all.'
    visual: 'Draw two halves: on the left, a tiger pacing back and forth behind bars, eyes on the stars; on the right, a tiger crouched in tall grass by a pool as deer come to drink.'
    step_by_step: 'Step 1: Find the cage lines (stalks, quiet rage, ignores visitors). Step 2: Find the wild lines (shadow, long grass, water hole, village edge). Step 3: Compare them. Step 4: State the theme: freedom vs captivity.'
    real_world: Many modern zoos now build large open enclosures, or support wildlife sanctuaries instead, because animals pace and suffer in small cages.
  picture:
    kind: compare
    columns:
    - title: In the zoo
      points:
      - Stalks the length of his cage
      - Quiet rage
      - Ignores visitors
      - Stares at the stars at night
    - title: In the wild
      points:
      - Lurks in shadow, long grass
      - Near the water hole, deer pass
      - Snarls at the jungle's edge
      - Terrorises the village
    alt: The tiger in the zoo, pacing with quiet rage and staring at the stars, compared with the tiger in the wild, lurking in grass by the water hole and snarling at the jungle's edge.
  activity:
    type: sort
    prompt: 'A Tiger in the Zoo: in the cage or in the wild?'
    bins:
    - In the cage
    - In the wild
    items:
    - label: Stalks the length of his cage
      bin: In the cage
      clue: Limited space.
      why: Walking only the cage's length is captivity.
    - label: Lurks in shadow near the water hole
      bin: In the wild
      clue: Where deer pass.
      why: 'The water hole and long grass are where he should be: the wild.'
    - label: Ignores visitors
      bin: In the cage
      clue: People staring at him.
      why: Visitors come to the zoo, so this is in the cage.
    - label: Snarls around houses at the jungle edge
      bin: In the wild
      clue: Terrorising the village.
      why: Scaring villagers is his wild nature.
    - label: Stares at the brilliant stars
      bin: In the cage
      clue: At night, hearing patrol cars.
      why: At night in the zoo he stares at stars, longing to be free.
    - label: Bares white fangs and claws
      bin: In the wild
      clue: Showing his power.
      why: Showing fangs is his natural, wild behaviour.
  lesson:
    - teach: In 'A Tiger in the Zoo', Leslie Norris shows a tiger pacing his small concrete cage, 'stalking the length of his cage' with quiet rage. His stripes are bright and his pads are velvet-soft, but he cannot use his strength.
      check:
        prompt: What is the tiger doing in the cage?
        options:
        - Pacing up and down
        - Sleeping happily
        - Eating
        answer: Pacing up and down
        why: He is restless.
      ways:
      - style: visual
        teach: The tiger in the cage and the tiger in the wild, as the poem pictures them.
        picture:
          kind: compare
          columns:
          - title: In the cage
            points:
            - pacing a few steps
            - quiet rage
            - ignores visitors
          - title: In the wild
            points:
            - hiding in long grass
            - hunting near water
            - scaring villages
          alt: In the cage the tiger paces a few steps with quiet rage and ignores visitors. In the wild it hides in long grass, hunts near water and scares villages.
      - style: real_world
        teach: 'Watch a big animal in a small zoo enclosure: it often walks the same path again and again. Keepers call this pacing, a sign of stress and boredom.'
    - teach: 'The poet imagines where the tiger should be: lurking in shadows near the water hole, hunting plump deer, and snarling at the edge of the jungle to scare villagers. The contrast between cage and wild shows that animals belong in freedom.'
      picture:
        kind: compare
        columns:
        - title: In the zoo
          points:
          - Concrete cell
          - Pacing
          - Ignoring visitors
        - title: In the wild
          points:
          - Long grass, water hole
          - Hunting deer
          - Terrorising villages
        alt: In the zoo the tiger is in a concrete cell, pacing and ignoring visitors; in the wild he would hide in long grass near a water hole, hunt deer and frighten villages.
      check:
        prompt: Where should the tiger be lurking?
        options:
        - In shadow near the water hole
        - In a cage
        - In a house
        answer: In shadow near the water hole
        why: Waiting for plump deer.
      ways:
      - style: step_by_step
        teach: 'See how the poem is built. Step 1: Stanzas 1–2 show the tiger in the cage. Step 2: Stanzas 3–4 imagine him in the jungle. Step 3: Stanza 5 returns to the cage at night. Step 4: The swing between the two places makes the cage feel even smaller.'
      - style: real_world
        teach: Wildlife reserves like Periyar in Kerala let tigers roam large forests, while visitors watch from a distance. That is closer to the life the poet wants for the tiger.
    - teach: 'At night the tiger hears patrolling cars and stares with brilliant eyes at the brilliant stars: he longs for freedom. The poem''s message: caging wild animals takes away their dignity and natural life.'
      check:
        prompt: What does the tiger stare at in the night?
        options:
        - The stars
        - The zookeeper
        - His food
        answer: The stars
        why: A sign of longing for freedom.
      ways:
      - style: visual
        teach: Poetic devices in 'A Tiger in the Zoo' and the effect each one has.
        picture:
          kind: compare
          columns:
          - title: Alliteration
            points:
            - sliding through long grass
            - repeated sounds
          - title: Repetition
            points:
            - brilliant eyes, brilliant stars
            - stresses longing
          - title: Contrast
            points:
            - cage versus jungle
            - shows loss of freedom
          alt: Alliteration repeats sounds, as in sliding through long grass. Repetition, as in brilliant eyes and brilliant stars, stresses longing. Contrast between cage and jungle shows the loss of freedom.
      - style: step_by_step
        teach: 'Find the poet''s message. Step 1: Notice the words for the cage: few steps, concrete, locked. Step 2: Notice the words for the jungle: shadow, water, deer, terror. Step 3: Ask which life feels right for a tiger. Step 4: The message: wild animals belong in the wild.'
  items:
  - prompt: What does the tiger do in the cage?
    options:
    - "Stalks the length of his cage"
    - "Sleeps peacefully all day long"
    - "Plays happily with the visitors"
    - "Eats constantly from his bowl"
    answer: Stalks the length of his cage
    difficulty: 1
    hints:
    - He moves restlessly.
    - Few steps of space.
    solution: He paces the length of his cage in quiet rage.
    mistakes: {"Sleeps peacefully all day long": "e10_tiger_cage"}
  - prompt: Where does the poet say the tiger should be?
    options:
    - "Lurking in shadow near the water hole"
    - "Performing tricks in a travelling circus"
    - "Living in a bigger, cleaner cage"
