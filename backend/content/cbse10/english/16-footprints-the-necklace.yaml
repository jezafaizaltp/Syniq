concepts:
- code: cbse10e.f7.necklace
  title: The Necklace (Guy de Maupassant)
  notes: |
    Matilda Loisel, pretty but unhappy with her modest life as the wife of a clerk in the Ministry of Public
    Instruction, dreams of luxury. Her husband brings an invitation to a ball; she weeps that she has no dress,
    so he gives her the 400 francs he saved for a gun. She borrows a diamond necklace from her rich friend
    Mme Jeanne Forestier. She is the most admired at the ball, but on returning home finds the necklace lost.
    They buy a similar one for 36,000 francs, using his inheritance of 18,000 francs and borrowing the rest.
    For ten years they work hard, dismiss the servant and live in an attic to repay the debt; Matilda loses her
    beauty. Then she meets Mme Forestier, tells her the truth, and learns the original necklace was false (paste),
    worth at most 500 francs. Theme: vanity and pride; the cost of living beyond one's means; irony.
  explanations:
    text: Matilda, unhappy with her ordinary life, borrows a diamond necklace from a rich friend to shine at a ball, and loses it. She and her husband spend ten years in poverty paying for a replacement. Then she learns that the original necklace was fake, worth only a fraction of what they paid.
    visual: Picture Matilda glittering at a ball with the necklace; then ten years later, with rough hands, scrubbing floors in an attic; then her shocked face as her friend says, 'But mine was false!'
    step_by_step: 'Step 1: Matilda''s discontent. Step 2: The ball and the borrowed necklace. Step 3: The loss and the 36,000-franc replacement. Step 4: Ten years of hardship. Step 5: The twist: it was fake.'
    real_world: People who take big loans to show off at weddings or parties sometimes spend years repaying, the way the Loisels did.
  picture:
    kind: flow
    steps:
    - Matilda borrows a diamond necklace for a ball
    - She loses it on the way home
    - They buy a replacement for 36,000 francs
    - Ten years of hard work to repay debts
    - The original was fake, worth 500 francs
    alt: 'The Necklace: Matilda borrows and loses a necklace, buys a replacement for 36,000 francs, works ten years to repay, then learns the original was worth only 500 francs.'
  activity:
    type: scale
    min: 0
    max: 40000
    step: 100
    start: 0
    unit: francs
    prompt: 'The Necklace: mark the amounts in francs.'
    zones:
    - from: 0
      to: 1000
      label: Small
      says: The cost of a dress or a fake.
    - from: 1000
      to: 40000
      label: Huge
      says: Ten years of debt.
    goals:
    - prompt: The replacement necklace cost…
      value: 36000
      mistakes:
      - when:
          v: 18000
        say: That's only his inheritance. They borrowed the rest, so the price was double that.
      - when:
          v: 500
        say: 'That''s what the lost necklace was really worth. The diamond one they bought cost far more: think of ten years of debt.'
    - prompt: The lost necklace was really worth at most…
      value: 500
      mistakes:
      - when:
          v: 36000
        say: 'That''s what they paid. The original was paste, a fake: it was worth very little.'
      - when:
          v: 400
        say: That's the dress money. Mme Forestier says the paste necklace was worth a little more than that.
    - prompt: Her husband gave her this for a dress.
      value: 400
      start: 0
      mistakes:
      - when:
          v: 500
        say: 'That''s the necklace''s value. He gave the money he had saved for a gun: a little less.'
  lesson:
    - teach: '''The Necklace'' by Guy de Maupassant is about Matilda Loisel, a pretty young woman married to a clerk in the office of the Board of Education in Paris. She is unhappy with her simple life and dreams of luxury. Her husband brings an invitation to a ball given by the Minister of Public Instruction. She cries because she has no dress, so he gives her the 400 francs he had saved for a gun.'
      check:
        prompt: Why was Matilda unhappy?
        options:
        - She dreamt of luxury but lived simply
        - She was ill
        - Her husband was cruel
        answer: She dreamt of luxury but lived simply
        why: She felt born for wealth.
    - teach: She borrows a diamond necklace from her rich school friend Madame Forestier. She is the star of the ball, but on returning home she finds the necklace gone. The Loisels buy a similar one for 36,000 francs, using his 18,000 inheritance and borrowing the rest, and return it without telling the truth.
      picture:
        kind: flow
        steps:
        - Invitation to a ball
        - 400 francs for a dress
        - Borrows the necklace
        - Loses it
        - Buys one for 36,000
        - Ten years of hard work
        alt: 'The plot of The Necklace: invitation, dress, borrowed necklace, lost, replaced for 36,000 francs, and ten years of hard work to repay.'
      check:
        prompt: From whom did Matilda borrow the necklace?
        options:
        - Madame Forestier
        - The Minister's wife
        - Her mother
        answer: Madame Forestier
        why: Her wealthy school friend.
    - teach: They dismiss their maid, move to a cheaper room, and work for ten years to repay the debts; Matilda grows old and coarse. One Sunday on the Champs Elysées she meets Madame Forestier and tells her the story. Madame Forestier reveals the original necklace was imitation, worth at most 500 francs. The twist shows how vanity and pride led to ruin.
      check:
        prompt: What was the shock at the end?
        options:
        - The original necklace was fake
        - Madame Forestier had stolen it
        - Loisel had found it
        answer: The original necklace was fake
        why: Worth at most 500 francs.
