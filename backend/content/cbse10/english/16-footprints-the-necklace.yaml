    solution: She borrowed it from her friend Mme Jeanne Forestier.
    mistakes:
      Mrs Pumphrey: eng10_read_again
  - prompt: How many francs did the replacement necklace cost?
    answer: '36000'
    check: '36000'
    difficulty: 1
    hints:
