title: The Necklace (Guy de Maupassant)
concepts:
- code: cbse10e.f7.necklace
  title: The Necklace (Guy de Maupassant)
  notes: |
    Matilda Loisel, pretty but unhappy with her modest life as the wife of a clerk in the Ministry of Public
    Instruction, dreams of luxury. Her husband brings an invitation to a ball; she weeps that she has no dress,
    so he gives her the 400 francs he saved for a gun. She borrows a diamond necklace from her rich friend
    Mme Jeanne Forestier. She is the most admired at the ball, but on returning home finds the necklace lost.
    They buy a similar one for 36,000 francs, using his inheritance of 18,000 francs and borrowing the rest.
    For ten years they work hard, dismiss the servant and live in an attic to repay the debt; Matilda loses her
    beauty. Then she meets Mme Forestier, tells her the truth, and learns the original necklace was false (paste),
    worth at most 500 francs. Theme: vanity and pride; the cost of living beyond one's means; irony.
  explanations:
    text: Matilda, unhappy with her ordinary life, borrows a diamond necklace from a rich friend to shine at a ball, and loses it. She and her husband spend ten years in poverty paying for a replacement. Then she learns that the original necklace was fake, worth only a fraction of what they paid.
    visual: Picture Matilda glittering at a ball with the necklace; then ten years later, with rough hands, scrubbing floors in an attic; then her shocked face as her friend says, 'But mine was false!'
    step_by_step: 'Step 1: Matilda''s discontent. Step 2: The ball and the borrowed necklace. Step 3: The loss and the 36,000-franc replacement. Step 4: Ten years of hardship. Step 5: The twist: it was fake.'
    real_world: People who take big loans to show off at weddings or parties sometimes spend years repaying, the way the Loisels did.
  picture:
