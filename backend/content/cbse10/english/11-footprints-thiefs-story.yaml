    hints:
    - Think of what Anil was teaching him.
    - A bigger reward than money.
    solution: Hari realised education could get him far more than stolen notes.
    mistakes:
      It was fake money: e10f2_hari
  - prompt: What did Hari think about how different people react to being robbed?
    options:
