    mistakes:
      He saved Anil's life: e10f2_hari
  - prompt: Why did Anil feed Hari's first meal to a stray dog?
    options:
    - It was so badly cooked that it couldn't be eaten
    - The dog was hungry
    - Anil was not hungry
    - Hari asked him to
    answer: It was so badly cooked that it couldn't be eaten
    difficulty: 2
    hints:
