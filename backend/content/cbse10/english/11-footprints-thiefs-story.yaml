concepts:
- code: cbse10e.f2.thief
  title: The Thief's Story (Ruskin Bond)
  notes: |
    Hari Singh, a fifteen-year-old thief, makes friends with Anil, a writer of about twenty-five, and works for
    him. Anil feeds him, teaches him to write his name and promises to teach him whole sentences and
    arithmetic. One night Hari steals six hundred rupees (a bundle of notes Anil earned from a book). He goes to
    the station but cannot board the train; he realises that if he runs away, he will lose the chance of an
    education and Anil's trust. He returns in the rain and puts the money back. In the morning Anil gives him a
    fifty-rupee note, still wet, and says they will begin writing sentences, showing he knew and forgave.
    Theme: trust, kindness and the power of education to reform.
  explanations:
    text: Hari, a young thief, gets a job with Anil, a kind writer who starts teaching him to read and write. Hari steals Anil's money but, at the station, realises that education and trust are worth more. He returns the money secretly. Next morning Anil hands him a still-wet fifty-rupee note, quietly showing that he knew and forgave him.
    visual: Picture Hari on a rain-soaked station platform, a train pulling out, then Hari creeping back into Anil's room to tuck the wet notes under the mattress.
    step_by_step: 'Step 1: Who Hari is: a fifteen-year-old thief. Step 2: How Anil treats him: food, lessons, trust. Step 3: The theft and the station. Step 4: The return. Step 5: The wet note: Anil knew.'
    real_world: A teacher's trust can change a student's life, the way Anil's faith turned Hari away from stealing.
  picture:
    kind: flow
    steps:
    - Hari, 15, a thief, works for Anil
    - Anil teaches him to write
    - Hari steals Anil's money
    - At the station he changes his mind
    - He returns it; Anil gives him a wet note
    alt: 'The Thief''s Story: Hari works for Anil, learns to write, steals the money, changes his mind at the station, returns it, and Anil gives him a wet note.'
  activity:
    type: order
    prompt: 'The Thief''s Story: put the events in order.'
    steps:
    - Hari Singh makes friends with Anil
    - Anil feeds him and teaches him to write his name
    - Hari steals six hundred rupees
    - He cannot board the train
    - He returns in the rain and puts the money back
    - Anil gives him a still-wet fifty-rupee note
    reasons:
      Anil feeds him and teaches him to write his name: The friendship lets Hari stay in the house.
      Hari steals six hundred rupees: Living there, he sees the money.
      He cannot board the train: He thinks of the education he'd lose.
      He returns in the rain and puts the money back: He decides trust and learning are worth more.
      Anil gives him a still-wet fifty-rupee note: Anil knew, and forgives him.
  lesson:
    - teach: '''The Thief''s Story'' by Ruskin Bond is told by Hari Singh, a fifteen-year-old thief who changes names often. He makes friends with Anil, a young writer of about twenty-five, and asks for work. Anil cannot pay, but agrees to feed him if he cooks. Hari''s first meal is so bad that Anil gives it to a stray dog, but he lets Hari stay.'
      check:
        prompt: Who tells 'The Thief's Story'?
        options:
        - Hari Singh, the thief
        - Anil
        - A police officer
        answer: Hari Singh, the thief
        why: It is told in the first person.
    - teach: Anil teaches Hari to cook, to write his name, and promises to teach him full sentences and to add figures. Hari makes about a rupee a day by cheating on the shopping. Anil earns money by fits and starts from writing for magazines. One day Anil brings home a bundle of notes from selling a book, and keeps it under his mattress.
      picture:
        kind: flow
        steps:
        - Hari meets Anil
        - Works as cook
        - Steals 600 rupees
        - At Lucknow station, can't board
        - Returns in the rain
        - Anil gives him 50 rupees
        alt: 'Hari''s story: meets Anil, works as cook, steals the money, cannot board the train at Lucknow, returns in the rain, and Anil gives him fifty rupees.'
      check:
        prompt: How did Anil earn his living?
        options:
        - Writing for magazines
        - Running a shop
        - Teaching in a school
        answer: Writing for magazines
        why: His income came by fits and starts.
    - teach: 'Hari steals the money (600 rupees) and goes to the station to catch the Lucknow Express, but he cannot board. He realises that education will make him a ''big man'', far more than stolen money. He returns in the rain, slips the wet notes back under the mattress. Next morning Anil gives him a fifty-rupee note, still wet, and says they will start writing sentences: he knew, but forgave. Trust changes Hari.'
      check:
        prompt: How did Hari know Anil had found out?
        options:
        - The fifty-rupee note Anil gave him was still wet
        - Anil shouted at him
        - The police came
        answer: The fifty-rupee note Anil gave him was still wet
        why: The wet note came from the money Hari returned.
  items:
  - prompt: How old was Hari Singh, the thief?
    answer: '15'
    check: '15'
    difficulty: 1
    hints:
    - A teenager.
    - He says so at the start.
    solution: Hari was fifteen.
    mistakes: {"16": "e10_hari_age"}
  - prompt: What did Anil teach Hari?
    options:
    - To write his name, and he promised to teach sentences and adding numbers
    - To cook only
    - To steal better
    - To drive a car
    answer: To write his name, and he promised to teach sentences and adding numbers
    difficulty: 1
    hints:
    - Education.
    - Hari couldn't write.
    solution: Anil taught Hari to write his name and promised more lessons.
    mistakes: {"To steal better": "e10_anil_teach"}
  - prompt: Why did Hari not board the train with the stolen money?
    options:
    - He realised he would lose the chance of an education and Anil's trust
    - He had no ticket money
    - The police stopped him
    - The train was cancelled
    answer: He realised he would lose the chance of an education and Anil's trust
    difficulty: 2
    hints:
    - What would he lose?
    - Being able to read.
    solution: He saw that learning to read and write could make him a 'big man', far more valuable than stolen money.
    mistakes: {"The police stopped him": "e10_hari_return"}
  - prompt: How did Hari know Anil had discovered the theft?
    options:
    - Anil gave him a fifty-rupee note that was still wet
    - Anil shouted at him
    - Anil called the police
    - Anil told him directly
    answer: Anil gave him a fifty-rupee note that was still wet
    difficulty: 2
    hints:
    - The rain.
    - The notes had got wet.
    solution: The note was still wet from the rain, so Anil had found the returned money.
    mistakes: {"Anil called the police": "e10_wet_note"}
  - prompt: What does the story show about trust?
    options:
    - Kindness and trust can change a person
    - Thieves can never change
    - Trust is foolish
    - Money matters most
    answer: Kindness and trust can change a person
    difficulty: 2
    hints:
    - Anil never accused him.
    - Hari returned the money.
    solution: Anil's trust and kindness led Hari to give up stealing.
    mistakes: {"Thieves can never change": "e10_trust_change"}
  - prompt: What was Anil's job?
