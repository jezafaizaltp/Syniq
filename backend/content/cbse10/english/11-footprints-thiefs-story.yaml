subject: cbse10-eng
chapter: 11
title: The Thief's Story (Ruskin Bond)
tips:
  e10_anil_job: "Anil earned money irregularly, from selling what he wrote."
  e10_anil_teach: "Anil was a writer. What skill did he start teaching the boy?"
  e10_hari_age: "Look at the first lines where the thief describes himself. He is a teenager."
  e10_hari_return: "No one stopped him. He stood at the station and thought about what he would lose."
