    - A writer
    - A policeman
    - A shopkeeper
    - A teacher at a school
    answer: A writer
    difficulty: 1
    hints:
    - He earned money from a book.
    - Irregular income.
    solution: Anil was a writer who earned money from his books.
    mistakes: {"A policeman": "e10_anil_job"}
  - prompt: How did Hari first get Anil's attention?
    options:
