# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 2.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 11
title: The Thief's Story (Ruskin Bond)
tips:
  e10_anil_job: "Anil earned money irregularly, from selling what he wrote."
  e10_anil_teach: "Anil was a writer. What skill did he start teaching the boy?"
  e10_hari_age: "Look at the first lines where the thief describes himself. He is a teenager."
  e10_hari_return: "No one stopped him. He stood at the station and thought about what he would lose."
  e10_trust_change: "Hari came back. What changed him?"
  e10_wet_note: "Hari had got the money wet in the rain. What did Anil hand him the next morning?"
  e10f2_hari: 'Hari Singh tells this story himself. Think about his thoughts at each stage: arriving, stealing, at the station, returning.'
  e10f2_anil: Anil is a struggling writer who trusts Hari. Recall what he does and how he earns.

concepts:
- code: cbse10e.f2.thief
  title: The Thief's Story (Ruskin Bond)
  notes: |
    Hari Singh, a fifteen-year-old thief, makes friends with Anil, a writer of about twenty-five, and works for
    him. Anil feeds him, teaches him to write his name and promises to teach him whole sentences and
    arithmetic. One night Hari steals six hundred rupees (a bundle of notes Anil earned from a book). He goes to
    the station but cannot board the train; he realises that if he runs away, he will lose the chance of an
    education and Anil's trust. He returns in the rain and puts the money back. In the morning Anil gives him a
    fifty-rupee note, still wet, and says they will begin writing sentences, showing he knew and forgave.
    Theme: trust, kindness and the power of education to reform.
  explanations:
    text: Hari, a young thief, gets a job with Anil, a kind writer who starts teaching him to read and write. Hari steals Anil's money but, at the station, realises that education and trust are worth more. He returns the money secretly. Next morning Anil hands him a still-wet fifty-rupee note, quietly showing that he knew and forgave him.
    visual: Picture Hari on a rain-soaked station platform, a train pulling out, then Hari creeping back into Anil's room to tuck the wet notes under the mattress.
    step_by_step: 'Step 1: Who Hari is: a fifteen-year-old thief. Step 2: How Anil treats him: food, lessons, trust. Step 3: The theft and the station. Step 4: The return. Step 5: The wet note: Anil knew.'
    real_world: A teacher's trust can change a student's life, the way Anil's faith turned Hari away from stealing.
  picture:
    kind: flow
    steps:
    - Hari, 15, a thief, works for Anil
    - Anil teaches him to write
    - Hari steals Anil's money
    - At the station he changes his mind
    - He returns it; Anil gives him a wet note
    alt: 'The Thief''s Story: Hari works for Anil, learns to write, steals the money, changes his mind at the station, returns it, and Anil gives him a wet note.'
  activity:
    type: order
    prompt: 'The Thief''s Story: put the events in order.'
    steps:
    - Hari Singh makes friends with Anil
    - Anil feeds him and teaches him to write his name
    - Hari steals six hundred rupees
    - He cannot board the train
    - He returns in the rain and puts the money back
    - Anil gives him a still-wet fifty-rupee note
    reasons:
      Anil feeds him and teaches him to write his name: The friendship lets Hari stay in the house.
      Hari steals six hundred rupees: Living there, he sees the money.
      He cannot board the train: He thinks of the education he'd lose.
      He returns in the rain and puts the money back: He decides trust and learning are worth more.
      Anil gives him a still-wet fifty-rupee note: Anil knew, and forgives him.
  lesson:
    - teach: '''The Thief''s Story'' by Ruskin Bond is told by Hari Singh, a fifteen-year-old thief who changes names often. He makes friends with Anil, a young writer of about twenty-five, and asks for work. Anil cannot pay, but agrees to feed him if he cooks. Hari''s first meal is so bad that Anil gives it to a stray dog, but he lets Hari stay.'
      check:
        prompt: Who tells 'The Thief's Story'?
        options:
        - Hari Singh, the thief
        - Anil
        - A police officer
        answer: Hari Singh, the thief
        why: It is told in the first person.
      ways:
      - style: visual
        teach: 'Hari Singh and Anil compared: two very different people who meet.'
        picture:
          kind: compare
          columns:
          - title: Hari Singh
            points:
            - fifteen, a thief
            - changes his name often
            - good at reading faces
          - title: Anil
            points:
            - young writer
            - earns money now and then
            - trusting and kind
          alt: Hari Singh is fifteen, a thief who changes his name often and is good at reading faces. Anil is a young writer who earns money now and then and is trusting and kind.
      - style: real_world
        teach: A teacher who gives a second chance to a student others have given up on can change that student's life. Anil does this for Hari.
    - teach: Anil teaches Hari to cook, to write his name, and promises to teach him full sentences and to add figures. Hari makes about a rupee a day by cheating on the shopping. Anil earns money by fits and starts from writing for magazines. One day Anil brings home a bundle of notes from selling a book, and keeps it under his mattress.
      picture:
        kind: flow
        steps:
        - Hari meets Anil
        - Works as cook
        - Steals 600 rupees
        - At Lucknow station, can't board
        - Returns in the rain
        - Anil gives him 50 rupees
        alt: 'Hari''s story: meets Anil, works as cook, steals the money, cannot board the train at Lucknow, returns in the rain, and Anil gives him fifty rupees.'
      check:
        prompt: How did Anil earn his living?
        options:
        - Writing for magazines
        - Running a shop
        - Teaching in a school
        answer: Writing for magazines
        why: His income came by fits and starts.
      ways:
      - style: step_by_step
        teach: 'Follow the deal between them. Step 1: Hari offers to work for Anil. Step 2: Anil can''t pay, but gives food and shelter. Step 3: Hari cooks and shops, taking a small cut. Step 4: Anil teaches him to write and add numbers. Step 5: Trust grows on both sides.'
      - style: real_world
        teach: Many people in India learned to read and write as adults, through evening classes or a kind employer. Learning can begin at any age.
    - teach: 'Hari steals the money (600 rupees) and goes to the station to catch the Lucknow Express, but he cannot board. He realises that education will make him a ''big man'', far more than stolen money. He returns in the rain, slips the wet notes back under the mattress. Next morning Anil gives him a fifty-rupee note, still wet, and says they will start writing sentences: he knew, but forgave. Trust changes Hari.'
      check:
        prompt: How did Hari know Anil had found out?
        options:
        - The fifty-rupee note Anil gave him was still wet
        - Anil shouted at him
        - The police came
        answer: The fifty-rupee note Anil gave him was still wet
        why: The wet note came from the money Hari returned.
      ways:
      - style: visual
        teach: 'Hari''s night at the station: the choice that changed him.'
        picture:
          kind: flow
          steps:
          - Steals Anil's money
          - Runs to the station
          - Train leaves; he stays
          - Thinks of Anil's trust and lessons
          - Returns and puts the money back
          alt: Hari steals Anil's money and runs to the station. The train leaves but he stays, thinking of Anil's trust and lessons, and he returns and puts the money back.
      - style: step_by_step
        teach: 'Understand why Hari returns. Step 1: He knows how people react to theft, but Anil would only be sad. Step 2: He sees that education could make him a big man. Step 3: Stealing would end those lessons. Step 4: So he chooses learning and trust over money.'
  items:
  - prompt: How old was Hari Singh, the thief?
    answer: '15'
    check: '15'
    difficulty: 1
    hints:
    - A teenager.
    - He says so at the start.
    solution: "Hari Singh tells us he is fifteen and an experienced thief."
    mistakes: {"16": "e10_hari_age"}
  - prompt: What did Anil teach Hari?
    options:
    - "To write his name, and he promised to teach sentences and adding numbers"
    - "To cook simple meals, and he promised to teach him nothing else"
    - "To steal better, without getting caught by the police"
    - "To drive a car, so that he could become a driver"
    answer: To write his name, and he promised to teach sentences and adding numbers
    difficulty: 1
    hints:
    - Education.
    - Hari couldn't write.
    solution: Anil taught Hari to write his name and promised more lessons.
    mistakes: {"To steal better, without getting caught by the police": "e10_anil_teach"}
  - prompt: Why did Hari not board the train with the stolen money?
    options:
    - "He realised he would lose the chance of an education and Anil's trust"
    - "He had no money left for a ticket after paying for his food"
    - "The police stopped him at the station and asked questions"
    - "The train was cancelled because of heavy rain that night"
    answer: He realised he would lose the chance of an education and Anil's trust
    difficulty: 2
    hints:
    - What would he lose?
    - Being able to read.
    solution: He saw that learning to read and write could make him a 'big man', far more valuable than stolen money.
    mistakes: {"The police stopped him at the station and asked questions": "e10_hari_return"}
  - prompt: How did Hari know Anil had discovered the theft?
    options:
    - "Anil gave him a fifty-rupee note that was still wet"
    - "Anil shouted at him angrily as soon as he woke"
    - "Anil called the police and they came to the room"
    - "Anil told him directly that he knew about it"
    answer: Anil gave him a fifty-rupee note that was still wet
    difficulty: 2
    hints:
    - The rain.
    - The notes had got wet.
    solution: The note was still wet from the rain, so Anil had found the returned money.
    mistakes: {"Anil called the police and they came to the room": "e10_wet_note"}
  - prompt: What does the story show about trust?
    options:
    - "Kindness and trust can change a person"
    - "Thieves can never change their ways"
    - "Trusting anyone is always foolish"
    - "Money matters more than anything"
    answer: Kindness and trust can change a person
    difficulty: 2
    hints:
    - Anil never accused him.
    - Hari returned the money.
    solution: Anil's trust and kindness led Hari to give up stealing.
    mistakes: {"Thieves can never change their ways": "e10_trust_change"}
  - prompt: What was Anil's job?
    options:
    - A writer
    - A policeman
    - A shopkeeper
    - A teacher at a school
    answer: A writer
    difficulty: 1
    hints:
    - He earned money from a book.
    - Irregular income.
    solution: Anil was a writer who earned money from his books.
    mistakes: {"A policeman": "e10_anil_job"}
  - prompt: How did Hari first get Anil's attention?
    options:
    - "He flattered Anil while watching a wrestling match"
    - "He saved Anil's life when he fell into the river"
    - "He wrote him a letter asking for work"
    - "He sold him a second-hand book at the market"
    answer: He flattered Anil while watching a wrestling match
    difficulty: 3
    hints:
    - They met at a public event.
    - Hari praised him.
    solution: Hari met Anil at a wrestling match and flattered him.
    mistakes:
      "He saved Anil's life when he fell into the river": e10f2_hari
  - prompt: Why did Anil feed Hari's first meal to a stray dog?
    options:
    - "It was so badly cooked that it couldn't be eaten"
    - "The dog was hungry and had followed them home"
    - "Anil was not hungry that night and had eaten out"
    - "Hari asked him to feed it to the dog himself"
    answer: It was so badly cooked that it couldn't be eaten
    difficulty: 2
    hints:
    - Hari claimed he could cook.
    - He could not, really.
    solution: The meal was terrible, so Anil gave it to the stray dog.
    mistakes:
      "The dog was hungry and had followed them home": e10f2_hari
  - prompt: How much money did Hari steal?
    options:
    - Six hundred rupees
    - Fifty rupees
    - Sixty rupees
    - One rupee
    answer: Six hundred rupees
    difficulty: 2
    hints:
    - It was a bundle of notes.
    - Anil had sold a book.
    solution: Hari stole six hundred rupees in fifty-rupee notes.
    mistakes:
      Fifty rupees: e10f2_hari
  - prompt: Where did Hari plan to go with the stolen money?
    options:
    - "Lucknow, by the Lucknow Express"
    - "Delhi, by the night bus"
    - "Mumbai, by a ship from the port"
    - "His village, walking all the way"
    answer: Lucknow, by the Lucknow Express
    difficulty: 2
    hints:
    - He went to the railway station.
    - A train named after a city.
    solution: He meant to take the Lucknow Express.
    mistakes:
      "Delhi, by the night bus": e10f2_hari
  - prompt: Why did Hari think the money was not worth stealing in the end?
    options:
    - "Learning to read and write could make him a 'big man'"
    - "It was fake money that no shop would take"
    - "It was too little to buy a train ticket"
    - "He was afraid of the police, and nothing else"
    answer: Learning to read and write could make him a 'big man'
    difficulty: 3
    hints:
    - Think of what Anil was teaching him.
    - A bigger reward than money.
    solution: Hari realised education could get him far more than stolen notes.
    mistakes:
      "It was fake money that no shop would take": e10f2_hari
  - prompt: What did Hari think about how different people react to being robbed?
    options:
    - "A trusting man looks sad, not angry or frightened"
    - "Everyone calls the police at once, whoever they are"
    - "Rich men never even notice that they have been robbed"
    - "All people cry loudly and tell the whole street"
    answer: A trusting man looks sad, not angry or frightened
    difficulty: 3
    hints:
    - He had studied faces as a thief.
    - Anil was trusting.
    solution: Hari knew that a trusting man's face shows only sadness, which he could not bear.
    mistakes:
      "Everyone calls the police at once, whoever they are": e10f2_hari
  - prompt: What was the weather when Hari returned to Anil's room?
    options:
    - It was raining
    - It was very hot and sunny
    - It was snowing
    - A dust storm was blowing
    answer: It was raining
    difficulty: 1
    hints:
    - The notes got damp.
    - He was soaked.
    solution: Hari walked back in the rain, so the notes got wet.
    mistakes:
      It was very hot and sunny: e10f2_hari
  - prompt: Why didn't Anil scold Hari or call the police?
    options:
    - "He trusted Hari to change and wanted to give him a chance"
    - "He was afraid that Hari would hurt him if he spoke"
    - "He did not care about money at all, so it did not matter"
    - "He never noticed the theft and did not know it happened"
    answer: He trusted Hari to change and wanted to give him a chance
    difficulty: 2
    hints:
    - He gave him money instead.
    - He wanted to keep teaching him.
    solution: Anil forgave Hari silently and kept faith in him.
    mistakes:
      "He never noticed the theft and did not know it happened": e10f2_anil
  - prompt: Who wrote 'The Thief's Story'?
    options:
    - Ruskin Bond
    - James Herriot
    - Victor Canning
    - H. G. Wells
    answer: Ruskin Bond
    difficulty: 1
    hints:
    - An Indian writer of English.
    - He lived in the hills of Mussoorie.
    solution: The story is by Ruskin Bond.
    mistakes:
      Victor Canning: eng10_author
  - prompt: 'Assertion (A): Anil does not say anything about the theft the next morning.

      Reason (R): He knows Hari has returned the money and wants to give him another chance.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Anil notices the wet notes but stays silent, accepting Hari's change of heart. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: The morning after, Anil hands Hari a fifty-rupee note that is still damp from the rain. What does this suggest?'
    options:
    - Anil knows about the theft but forgives Hari
    - Anil has just come back from the bank
    - The money was never stolen
    answer: Anil knows about the theft but forgives Hari
    hints:
    - Why would the note be wet?
    - Where had the money been at night?
    solution: The note is wet from Hari's night in the rain, so Anil knows what happened, yet he says nothing and trusts Hari.
    mistakes:
      Anil has just come back from the bank: e10_wet_note
      The money was never stolen: e10_trust_change
    exam: case
    difficulty: 2
  - prompt: 'Situation: Hari says he could make a rupee a day by cheating on the shopping, yet he still wanted to learn. Why did learning matter more?'
    options:
    - "Education could make him a respected, big man one day"
    - "He wanted to steal much larger sums of money later"
    - "Anil paid him a high salary to stay and learn"
    answer: Education could make him a respected, big man one day
    hints:
    - What did Anil promise to teach?
    - What future did Hari picture?
    solution: Hari realised that reading, writing and arithmetic could lead to a better life than stealing.
    mistakes:
      "He wanted to steal much larger sums of money later": e10f2_hari
      "Anil paid him a high salary to stay and learn": e10_anil_job
    exam: competency
    difficulty: 2
