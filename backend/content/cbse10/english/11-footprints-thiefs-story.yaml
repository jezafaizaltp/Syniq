    options:
    - Six hundred rupees
    - Fifty rupees
    - Sixty rupees
    - One rupee
    answer: Six hundred rupees
    difficulty: 2
    hints:
    - It was a bundle of notes.
    - Anil had sold a book.
    solution: Hari stole six hundred rupees in fifty-rupee notes.
    mistakes:
      Fifty rupees: e10f2_hari
  - prompt: Where did Hari plan to go with the stolen money?
    options:
    - Lucknow, by the Lucknow Express
    - Delhi by bus
    - Mumbai by ship
    - His village on foot
    answer: Lucknow, by the Lucknow Express
    difficulty: 2
    hints:
    - He went to the railway station.
    - A train named after a city.
    solution: He meant to take the Lucknow Express.
    mistakes:
      Delhi by bus: e10f2_hari
  - prompt: Why did Hari think the money was not worth stealing in the end?
    options:
