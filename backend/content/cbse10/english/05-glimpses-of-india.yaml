- code: cbse10e.u5.trees
  title: The Trees (Adrienne Rich)
  after:
  - cbse10e.u5.glimpses
  notes: |
    The trees inside the poet's house are moving out into the forest, which has been empty: no bird sits there,
    no insect hides, no sun buries its feet in shadow. All night the roots work to free themselves from the
    cracks in the veranda floor; leaves strain towards the glass; small twigs stiff with exertion; long-cramped
    boughs shuffle under the roof. The poet sits writing long letters, hardly mentioning the departure. By
    morning, the whole moon is broken like a mirror and the trees have rushed out to the forest. Themes: nature
    reclaiming its place; it can also be read as people (especially women) breaking free from confinement.
  explanations:
    text: In this strange, dreamlike poem the plants inside a house tear themselves free and march out to the empty forest overnight. It shows nature wanting to be free and taking back its place, and can also be read as people breaking out of the limits placed on them.
    visual: Picture a moonlit house where roots crack through the veranda floor, leaves press against the windows, and by dawn a line of trees is walking out of the door into the forest.
    step_by_step: 'Step 1: Where are the trees? Inside a house. Step 2: Where do they go? To the empty forest. Step 3: How do they move? Roots, leaves, twigs, boughs strain. Step 4: What does it mean? Nature, or people, breaking free.'
    real_world: 'Cities that tear out trees for buildings find, years later, that plants crack through pavements and walls: nature keeps pushing to return.'
  picture:
    kind: flow
    steps:
    - Trees are trapped inside the house
    - The forest outside is empty, no birds or insects
    - All night roots and boughs struggle to get free
    - The poet writes letters, hardly noticing
    - By morning the trees have rushed into the forest
    alt: In The Trees, plants trapped inside a house struggle all night and by morning move out to fill the empty forest.
  activity:
    type: order
    prompt: 'The Trees: put the night''s movement in order.'
    steps:
    - The forest outside is empty
    - Roots work to free themselves from the floor
    - Leaves strain towards the glass
    - Long-cramped boughs shuffle under the roof
    - By morning the trees rush out to the forest
    reasons:
      Roots work to free themselves from the floor: The trees begin to leave the house.
      Leaves strain towards the glass: Once roots loosen, the tops push outward.
      Long-cramped boughs shuffle under the roof: The whole tree moves towards the door.
      By morning the trees rush out to the forest: After a night of effort they escape.
  items:
  - prompt: Where are the trees at the beginning of the poem?
    options:
    - Inside the house
    - In the forest
    - In a park
    - On a mountain
    answer: Inside the house
    difficulty: 1
    hints:
    - They are moving out.
    - Veranda and roof.
    solution: The trees are inside the poet's house.
  - prompt: What is the forest like before the trees arrive?
    options:
    - 'Empty: no birds, no insects, no shade'
    - Full of animals
    - On fire
    - Covered in snow
    answer: 'Empty: no birds, no insects, no shade'
    difficulty: 1
    hints:
    - '''The forest that was empty''.'
    - No bird could sit.
    solution: The forest has no trees, so birds and insects have no place there.
  - prompt: What does the poet do while the trees move out?
    options:
    - She writes long letters
    - She sleeps
    - She calls for help
    - She cuts the trees
    answer: She writes long letters
    difficulty: 2
    hints:
    - She is busy indoors.
    - She hardly mentions the departure.
    solution: She sits writing long letters, barely mentioning the trees leaving.
  - prompt: What happens to the moon at the end?
    options:
    - It is broken like a mirror
    - It turns red
    - It disappears
    - It becomes full
    answer: It is broken like a mirror
    difficulty: 2
    hints:
    - Seen through the leaves.
    - Image of shattering.
    solution: The moon appears broken like a mirror, its light shattered through the branches.
  - prompt: What can the poem be read as, besides nature?
    options:
    - People breaking free from confinement
    - A recipe
    - A travel guide
    - A science report
    answer: People breaking free from confinement
    difficulty: 2
    hints:
    - Trees inside a house are confined.
    - Women's freedom is one reading.
    solution: The trees' escape can stand for people, especially women, breaking free.
  - prompt: Which part of the trees works all night to free itself from cracks in the veranda floor?
    options:
    - The roots
    - The flowers
    - The fruit
    - The bark
    answer: The roots
    difficulty: 1
    hints:
    - Underground parts.
    - Veranda floor.
    solution: The roots work all night to disengage themselves from the cracks in the floor.
