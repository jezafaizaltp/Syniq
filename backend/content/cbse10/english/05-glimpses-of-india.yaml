# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 5
title: Glimpses of India · The Trees
tips:
  e10_baker_staff: "The sound was 'jhang, jhang'. What did the baker carry that made it?"
  e10_cariappa: "India's first Indian Commander-in-Chief came from Coorg. Manekshaw was from elsewhere."
  e10_coorg_state: "Coorg lies between Mysore and Mangalore. Which state are those cities in?"
  e10_dhekiabari: "Pranjol's father managed a tea garden in the north-east, in the Brahmaputra valley."
  e10_forest_empty: "The forest is waiting for its trees. Without trees, what would be missing?"
  e10_kabai: "The kabai is something the baker wore, not something he sold."
  e10_letters: "The poet sits indoors at her desk while the trees leave."
  e10_moon_mirror: "As the trees move out, the moon looks cracked into pieces through their branches."
  e10_roots: "Cracks in a floor are pushed open from below. Which part of a tree grows under the ground?"
  e10_tea_legend: "The emperor story is the Chinese legend. The Indian one is about a Buddhist monk who fell asleep while meditating."
  e10_trees_inside: "The poem begins with trees in pots and on the veranda, longing to get out."
  e10_trees_meaning: "Trees kept indoors and longing to be free could stand for people kept indoors too."
  e10u5_piece: 'Glimpses of India has three short pieces in three regions. Match the detail to its region first: Goa, Karnataka or Assam.'
  e10u5_bread: The writer links each kind of bread to an occasion in Goan life. Think which event the question is about.
  e10u5_coorg_people: Coorgis are known for stories about where they came from and for their army tradition. Read which part the question asks.
  e10u5_tea_facts: Pranjol's family runs a tea garden in Assam. Recall what Rajvir read about tea before reaching the garden.
  e10u5_trees_move: In the poem the trees move from inside the house to the forest, step by step through one night. Picture each step in order.
  e10u5_trees_poet: The speaker stays calm indoors while the trees leave. Look at what she is doing with her hands and mind.

concepts:
- code: cbse10e.u5.glimpses
  title: 'Glimpses of India: A Baker from Goa · Coorg · Tea from Assam'
  notes: |
    A Baker from Goa (Lucio Rodrigues): bakers (paders) in Goa kept the Portuguese tradition of loaves alive.
    The baker came twice a day, announcing himself with the jhang, jhang thud of his bamboo staff; children ran
    to meet him for bread-bangles. He wore a kabai (a single-piece long frock) and later shirt and trousers.
    Bol (sweet bread) for marriages, sweet bread for Christmas, cakes and bolinhas; the baker's family was
    never poor: a plump physique was proof of a baker's trade.
    Coorg (Lokesh Abrol): Kodagu, a small district of Karnataka between Mysore and Mangaluru, rich in coffee
    estates and rainforest. Kodavus may be of Greek or Arab descent; they wear a long black coat (kuppia) with an
    embroidered waist-belt; they alone may carry firearms without a licence. The Coorg Regiment is famous; Field
    Marshal Cariappa was a Coorgi. River Kaveri; Brahmagiri hills; Nisargadhama island; Tibetan monks at Bylakuppe.
    Tea from Assam (Arup Kumar Datta): Pranjol (from Assam) and Rajvir travel by train to Dhekiabari tea estate,
    managed by Pranjol's father. Legends: a Chinese emperor's boiling water got tea leaves in it; the monk
    Bodhidharma cut off his eyelids and ten tea plants grew. Assam has the largest concentration of tea
    plantations in the world; the second flush in May–June yields the best tea.
  explanations:
    text: Three short pieces show different corners of India. In Goa, bakers still sell Portuguese-style bread and announce themselves with a thumping bamboo staff. Coorg in Karnataka is a land of coffee, rainforest and brave soldiers. In Assam, two boys visit a huge tea garden and hear legends about how tea was discovered.
    visual: 'Draw a map of India with three pins: Goa (a baker with a basket and bamboo staff), Coorg (coffee bushes and a soldier), Assam (green rows of tea bushes and women plucking leaves).'
    step_by_step: 'Step 1: Which place? Step 2: What is special there (bread, coffee and soldiers, tea)? Step 3: Recall one custom or legend from each. Step 4: Name the writer.'
    real_world: Bylakuppe near Coorg has one of India's largest Tibetan settlements, where visitors see monks in red robes.
  picture:
    kind: compare
    columns:
    - title: A Baker from Goa
      points:
      - Paders keep Portuguese bread alive
      - 'Bamboo staff: jhang, jhang'
      - 'Kabai: a long frock'
      - Bol for weddings
    - title: Coorg
      points:
      - Kodagu district, Karnataka
      - Coffee and rainforest
      - 'Kodavus: maybe Greek or Arab descent'
      - Field Marshal Cariappa
    - title: Tea from Assam
      points:
      - Pranjol and Rajvir
      - Dhekiabari tea estate
      - 'Legends: emperor, Bodhidharma'
      - Second flush, May–June, best tea
    alt: 'Three glimpses of India: Goa''s bakers with their bamboo staffs, Coorg''s coffee and soldiers, and Assam''s tea gardens and legends.'
  activity:
    type: sort
    prompt: 'Glimpses of India: which piece?'
    bins:
    - A Baker from Goa
    - Coorg
    - Tea from Assam
    items:
    - label: The jhang, jhang of a bamboo staff
      bin: A Baker from Goa
      clue: Announcing bread.
      why: The pader's staff announces the Goan baker.
    - label: Kodavus carry firearms without a licence
      bin: Coorg
      clue: A special right.
      why: Only Kodavus in Coorg have this right.
    - label: Dhekiabari estate and Pranjol's father
      bin: Tea from Assam
      clue: Two boys on a train.
      why: Pranjol and Rajvir visit Dhekiabari tea estate in Assam.
    - label: Field Marshal Cariappa
      bin: Coorg
      clue: A famous soldier from Kodagu.
      why: Cariappa was a Coorgi.
    - label: Bol for marriages
      bin: A Baker from Goa
      clue: A sweet bread.
      why: Bol is the Goan sweet bread for weddings.
    - label: Bodhidharma's eyelids legend
      bin: Tea from Assam
      clue: How tea plants grew.
      why: The legend of how tea began is in Tea from Assam.
  lesson:
    - teach: '''A Baker from Goa'' by Lucio Rodrigues remembers the Portuguese-era bakers (pader) of Goa. The baker came twice a day with a jingling bamboo staff, wearing a knee-length frock called a ''kabai'' (later shirt and half pants). Bread was part of every celebration: marriages need sweet bread (bol), a daughter''s engagement needs bread, Christmas needs cakes and bolinhas. Baking was a profitable trade; bakers and their families never starved.'
      check:
        prompt: What did the Goan baker wear in the old days?
        options:
        - A knee-length frock called a kabai
        - A long black coat
        - A white kurta
        answer: A knee-length frock called a kabai
        why: The writer describes it as a single-piece long frock.
    - teach: '''Coorg'' by Lokesh Abrol describes Kodagu, the smallest district of Karnataka, between Mysore and Mangalore. It has evergreen rainforests, coffee estates and rivers like the Kaveri. Coorgis are said to be of Greek or Arab descent; they wear the kuppia, a long black coat, and are known for hospitality and bravery. The Coorg Regiment is highly decorated, and General Cariappa, the first Indian Army chief, was a Coorgi. Coorgis are the only people in India allowed to carry firearms without a licence.'
      picture:
        kind: compare
        columns:
        - title: A Baker from Goa
          points:
          - Goa
          - pader and his bread
          - jingling bamboo staff
        - title: Coorg
          points:
          - Karnataka
          - coffee, forests, Kaveri
          - brave, hospitable people
        - title: Tea from Assam
          points:
          - Assam
          - Dhekiabari tea estate
          - legends of tea
        alt: 'Three pieces of Glimpses of India compared: the Goan baker, Coorg in Karnataka, and tea gardens in Assam.'
      check:
        prompt: What special right do the people of Coorg have?
        options:
        - Carrying firearms without a licence
        - Not paying any tax
        - Owning all the rivers
        answer: Carrying firearms without a licence
        why: The piece mentions this unusual privilege.
    - teach: '''Tea from Assam'' by Arup Kumar Datta follows Pranjol and his friend Rajvir travelling by train to Dhekiabari, the tea garden Pranjol''s father manages. Rajvir has read about tea: a Chinese legend says emperor Shen Nong found tea when leaves fell into boiling water; an Indian legend says Bodhidharma cut off his eyelids and tea plants grew from them. Tea was first drunk in China in 2700 BC, and Assam has the largest concentration of tea plantations in the world.'
      check:
        prompt: Which emperor, in the Chinese legend, discovered tea?
        options:
        - Shen Nong
        - Ashoka
        - Kublai Khan
        answer: Shen Nong
        why: Leaves fell into his boiling water.
