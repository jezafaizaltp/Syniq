# CBSE Class 10 English (NCERT First Flight), unit 5: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 5
title: Glimpses of India · The Trees
concepts:
- code: cbse10e.u5.glimpses
  title: 'Glimpses of India: A Baker from Goa · Coorg · Tea from Assam'
  notes: |
    A Baker from Goa (Lucio Rodrigues): bakers (paders) in Goa kept the Portuguese tradition of loaves alive.
    The baker came twice a day, announcing himself with the jhang, jhang thud of his bamboo staff; children ran
    to meet him for bread-bangles. He wore a kabai (a single-piece long frock) and later shirt and trousers.
    Bol (sweet bread) for marriages, sweet bread for Christmas, cakes and bolinhas; the baker's family was
    never poor: a plump physique was proof of a baker's trade.
    Coorg (Lokesh Abrol): Kodagu, a small district of Karnataka between Mysore and Mangaluru, rich in coffee
    estates and rainforest. Kodavus may be of Greek or Arab descent; they wear a long black coat (kuppia) with an
    embroidered waist-belt; they alone may carry firearms without a licence. The Coorg Regiment is famous; Field
    Marshal Cariappa was a Coorgi. River Kaveri; Brahmagiri hills; Nisargadhama island; Tibetan monks at Bylakuppe.
    Tea from Assam (Arup Kumar Datta): Pranjol (from Assam) and Rajvir travel by train to Dhekiabari tea estate,
    managed by Pranjol's father. Legends: a Chinese emperor's boiling water got tea leaves in it; the monk
    Bodhidharma cut off his eyelids and ten tea plants grew. Assam has the largest concentration of tea
    plantations in the world; the second flush in May–June yields the best tea.
  explanations:
    text: Three short pieces show different corners of India. In Goa, bakers still sell Portuguese-style bread and announce themselves with a thumping bamboo staff. Coorg in Karnataka is a land of coffee, rainforest and brave soldiers. In Assam, two boys visit a huge tea garden and hear legends about how tea was discovered.
    visual: 'Draw a map of India with three pins: Goa (a baker with a basket and bamboo staff), Coorg (coffee bushes and a soldier), Assam (green rows of tea bushes and women plucking leaves).'
    step_by_step: 'Step 1: Which place? Step 2: What is special there (bread, coffee and soldiers, tea)? Step 3: Recall one custom or legend from each. Step 4: Name the writer.'
    real_world: Bylakuppe near Coorg has one of India's largest Tibetan settlements, where visitors see monks in red robes.
