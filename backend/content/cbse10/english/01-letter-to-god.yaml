# CBSE Class 10 English (NCERT First Flight), unit 1: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 1
title: A Letter to God · Dust of Snow · Fire and Ice
tips:
  eng10_read_again: 'Go back to the lesson: the answer is in the text. Find the part about that person or event.'
  eng10_poem_meaning: Poems often mean more than they say. Ask what the picture in the poem stands for in life.
  eng10_author: 'Match each lesson with its writer: the name is under the title.'
concepts:
- code: cbse10e.u1.letter
  title: A Letter to God (G. L. Fuentes)
  notes: |
    Lencho, a farmer, lives in the only house on the crest of a low hill, overlooking his ripe corn field. He
    hopes for rain; the raindrops look to him like 'new coins'. Then a hailstorm destroys the whole crop. With
    a deep faith in God, he writes a letter to God asking for 100 pesos to sow again and live until the next
    crop, and posts it. The postmaster laughs, then is moved by such faith; he collects money from employees,
    gives part of his salary and friends give too, and sends 70 pesos signed 'God'. Lencho counts the money,
    is angry that 30 pesos are missing, and writes again asking God to send the rest, but not by mail, because
    'the post office employees are a bunch of crooks'. Irony: he distrusts the very people who helped him.
  explanations:
    text: 'Lencho, a poor farmer, loses his crop to a hailstorm and writes to God for 100 pesos. The postmaster, touched by his faith, collects 70 pesos and sends it as if from God. Lencho, sure that God couldn''t make a mistake, decides the post office workers stole the rest. The story is full of irony: he blames the people who helped him.'
    visual: 'Picture three scenes: raindrops falling like shining coins on a green field; white hailstones covering the field like salt; the postmaster laughing, then reaching into his own pocket.'
    step_by_step: 'Step 1: Hope: rain like new coins. Step 2: Disaster: the hailstorm. Step 3: Faith: the letter to God for 100 pesos. Step 4: Kindness: the postmaster sends 70 pesos. Step 5: Irony: Lencho calls the employees crooks.'
    real_world: Sometimes people who help quietly, like the postmaster, get no thanks or even blame. Real kindness doesn't wait for credit.
  picture:
    kind: flow
    steps:
    - Rain falls like 'new coins' on Lencho's corn
    - A hailstorm destroys the whole crop
    - Lencho writes to God asking for 100 pesos
    - The postmaster collects 70 pesos and sends it
    - Lencho calls the post office employees 'crooks'
    alt: 'The story in five steps: hope from the rain, the hailstorm, Lencho''s letter to God for 100 pesos, the postmaster''s 70 pesos, and Lencho''s accusation.'
  items:
  - prompt: What did Lencho compare the raindrops to?
    options:
    - New coins
    - Pearls
    - Tears
    - Diamonds
    answer: New coins
    difficulty: 1
    hints:
    - He was thinking of money from the harvest.
    - Big drops were ten-cent pieces.
    solution: 'He said the big drops were ten-cent pieces and the small ones fives: ''new coins''.'
    mistakes:
      Pearls: eng10_read_again
  - prompt: How many pesos did Lencho ask God for?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Enough to sow again and live.
    - A round number.
    solution: Lencho asked for 100 pesos.
  - prompt: Lencho asked for 100 pesos and received 70. How many pesos did he think were missing?
    answer: '30'
    check: 100 - 70
    difficulty: 1
    hints:
    - Subtract.
    - 100 − 70.
    solution: 100 − 70 = 30 pesos.
  - prompt: Why did the postmaster send money to Lencho?
    options:
    - He didn't want to shake Lencho's faith in God
    - Lencho was his relative
    - It was his duty by law
    - Lencho threatened him
    answer: He didn't want to shake Lencho's faith in God
    difficulty: 2
    hints:
    - He first laughed, then became serious.
    - He admired such faith.
    solution: Moved by Lencho's faith, the postmaster decided to answer the letter so that faith wouldn't be shaken.
  - prompt: What is ironic about the end of the story?
    options:
    - Lencho calls the people who helped him crooks
    - Lencho gets more money than he asked for
    - The postmaster takes the money
    - God replies in person
    answer: Lencho calls the people who helped him crooks
    difficulty: 2
    hints:
    - Irony is the opposite of what you expect.
    - Who actually gave the money?
    solution: The employees gave their own money, yet Lencho thinks they stole some of it.
  - prompt: Why did Lencho not want the remaining money sent by mail?
    options:
    - He thought the post office employees were a bunch of crooks
    - The post office was closed
    - He wanted to collect it himself from God
    - The postman was ill
    answer: He thought the post office employees were a bunch of crooks
    difficulty: 1
    hints:
    - Read his second letter.
    - Whom did he blame?
    solution: He believed the post office staff had stolen 30 pesos.
- code: cbse10e.u1.frost
  title: Dust of Snow · Fire and Ice (Robert Frost)
  after:
  - cbse10e.u1.letter
  notes: |
    Dust of Snow: a crow shakes down the dust of snow from a hemlock tree onto the poet. This small moment
    changes his mood and saves 'some part of a day I had rued' (regretted). The crow and hemlock, usually
    linked with gloom and death, here bring cheer: small things in nature can lift a sad mood.
    Fire and Ice: some say the world will end in fire, some in ice. Fire stands for desire (greed, lust,
    passion) and ice for hatred (coldness, indifference). The poet thinks fire would do it, but ice is 'also
    great and would suffice'. Both poems are short with rhyme; Frost uses simple images for deep ideas.
  explanations:
    text: 'In ''Dust of Snow'' a crow shakes snow from a hemlock tree onto the poet, and that small moment turns a bad day around. In ''Fire and Ice'' Frost asks how the world will end, and uses fire for desire and ice for hatred: either could destroy us.'
    visual: Picture a man walking sadly under a dark hemlock tree. A black crow flaps its wings and soft snow falls on his head; he smiles. Then picture the world with one half in flames (desire) and one half frozen (hatred).
    step_by_step: 'Step 1: Find the symbol (crow, hemlock, fire, ice). Step 2: Ask what it usually means. Step 3: Ask what it means in this poem. Step 4: State the message.'
    real_world: A friend's text or a bird's song on a bad day can change your whole mood, just as the dust of snow did for Frost.
  picture:
    kind: compare
    columns:
    - title: Dust of Snow
      points:
      - 'Crow and hemlock: usually gloomy'
      - Snow falls on the poet
      - His mood changes
      - Small things can heal a bad day
    - title: Fire and Ice
      points:
      - Fire = desire
      - Ice = hatred
      - Either could end the world
      - Warning against extreme feelings
    alt: 'Two Frost poems: in Dust of Snow a crow and hemlock lift the poet''s mood; in Fire and Ice, fire stands for desire and ice for hatred, both able to destroy the world.'
  items:
  - prompt: In 'Dust of Snow', which bird shakes the snow onto the poet?
    options:
    - A crow
    - A sparrow
    - A robin
    - An owl
    answer: A crow
    difficulty: 1
    hints:
    - A black bird.
    - Usually seen as a bad omen.
    solution: A crow shook the dust of snow from a hemlock tree.
  - prompt: In 'Dust of Snow', what does 'rued' mean?
    options:
    - Regretted
    - Enjoyed
    - Forgotten
    - Planned
    answer: Regretted
    difficulty: 2
    hints:
    - '''A day I had rued''.'
    - He was unhappy about it.
    solution: Rued means regretted; the poet was having a bad day.
  - prompt: 'In ''Fire and Ice'', fire stands for:'
    options:
    - Desire
    - Hatred
    - Peace
    - Knowledge
    answer: Desire
    difficulty: 1
    hints:
    - Burning passion.
    - Ice is the other.
    solution: Fire stands for desire; ice for hatred.
    mistakes:
      Hatred: eng10_poem_meaning
  - prompt: Why is the hemlock tree an unusual choice in 'Dust of Snow'?
    options:
    - It is poisonous and linked with gloom, yet it brings cheer here
    - It has bright flowers
    - It grows only in India
    - It is a fruit tree
    answer: It is poisonous and linked with gloom, yet it brings cheer here
    difficulty: 2
    hints:
    - Hemlock is poisonous.
    - Frost turns the image around.
    solution: Hemlock and the crow usually suggest sorrow, but here they lift the poet's mood.
  - prompt: What is the poet's conclusion about ice in 'Fire and Ice'?
    options:
    - It is also great and would suffice to destroy the world
    - It can never destroy anything
    - It is better than fire
    - It will save the world
    answer: It is also great and would suffice to destroy the world
    difficulty: 2
    hints:
    - '''Would suffice''.'
    - Hatred is as dangerous as desire.
    solution: He says ice (hatred) would also be enough to end the world.
  - prompt: What is the main message of 'Dust of Snow'?
    options:
    - Small moments in nature can change our mood
    - Crows are harmful
    - Winter is sad
    - Trees should be cut down
    answer: Small moments in nature can change our mood
    difficulty: 1
    hints:
    - The poet's day was saved.
    - A tiny event.
    solution: A small, natural moment turned the poet's bad day into a better one.
