    answer: Small moments in nature can lift a sad mood
    difficulty: 1
    hints:
    - A tiny event changed his day.
    - It was a natural moment.
    solution: The poem shows how a small, natural event can change one's mood.
    mistakes:
      Snow is dangerous: e10_dust_message
  - prompt: Who wrote 'Dust of Snow' and 'Fire and Ice'?
    options:
    - Robert Frost
    - G. L. Fuentes
    - Leslie Norris
    - John Berryman
    answer: Robert Frost
    difficulty: 1
    hints:
    - An American poet.
    - His name is itself a cold word.
    solution: Both poems are by Robert Frost.
    mistakes:
      G. L. Fuentes: eng10_author
