# CBSE Class 10 English (NCERT First Flight), unit 1: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 1
title: A Letter to God · Dust of Snow · Fire and Ice
tips:
  eng10_read_again: 'Go back to the lesson: the answer is in the text. Find the part about that person or event.'
  eng10_poem_meaning: Poems often mean more than they say. Ask what the picture in the poem stands for in life.
  eng10_author: 'Match each lesson with its writer: the name is under the title.'
  e10_crooks: "Read Lencho's second letter. Whom does he suspect of taking the missing money?"
  e10_dust_message: "A tiny shower of snow changed the poet's whole day. What is the poem saying about small moments?"
  e10_frost_bird: "The bird in this poem is black and often thought of as a bad sign, like the hemlock."
  e10_hemlock: "Frost chose a tree linked with poison and sorrow. What is surprising about it bringing cheer?"
  e10_ice: "Read the last lines: the poet says ice 'would suffice'. What does 'suffice' mean?"
  e10_irony_lencho: "Irony is the opposite of what we expect. Who does Lencho blame, and who actually helped him?"
  e10_pesos_asked: "70 is what reached Lencho. Look for the sum he wrote in his first letter to God."
  e10_pesos_missing: "He expected the full amount and got less. Subtract what arrived from what he asked for; don't add them."
  e10_postmaster: "Answering letters to God was not part of any rule. What did the postmaster not want to break in Lencho?"
  e10_rued: "The poet had a day he was sad about. 'Rued' is linked to the word 'rueful'."
  e10u1_hail: 'Follow the weather in the story: first a welcome rain, then something much worse that destroyed the crop.'
  e10u1_faith: "Lencho's faith is total and simple: he never doubts that his prayer will be answered, even after losing everything."
  e10u1_words: Work out the word from the sentence around it. What is happening to the people or the crop at that moment?
  e10u1_frost_change: In 'Dust of Snow' a tiny, ordinary moment changes the poet's mood. What was the mood before, and after?
  e10u1_fire_ice: In 'Fire and Ice', fire and ice stand for human feelings that could destroy the world. Which feeling goes with which?
  e10u1_tasted: "The poet says he has 'tasted of desire'. Which of the two images in the poem stands for desire?"
concepts:
- code: cbse10e.u1.letter
  title: A Letter to God (G. L. Fuentes)
  notes: |
    Lencho, a farmer, lives in the only house on the crest of a low hill, overlooking his ripe corn field. He
    hopes for rain; the raindrops look to him like 'new coins'. Then a hailstorm destroys the whole crop. With
    a deep faith in God, he writes a letter to God asking for 100 pesos to sow again and live until the next
    crop, and posts it. The postmaster laughs, then is moved by such faith; he collects money from employees,
    gives part of his salary and friends give too, and sends 70 pesos signed 'God'. Lencho counts the money,
    is angry that 30 pesos are missing, and writes again asking God to send the rest, but not by mail, because
    'the post office employees are a bunch of crooks'. Irony: he distrusts the very people who helped him.
  explanations:
    text: 'Lencho, a poor farmer, loses his crop to a hailstorm and writes to God for 100 pesos. The postmaster, touched by his faith, collects 70 pesos and sends it as if from God. Lencho, sure that God couldn''t make a mistake, decides the post office workers stole the rest. The story is full of irony: he blames the people who helped him.'
    visual: 'Picture three scenes: raindrops falling like shining coins on a green field; white hailstones covering the field like salt; the postmaster laughing, then reaching into his own pocket.'
    step_by_step: 'Step 1: Hope: rain like new coins. Step 2: Disaster: the hailstorm. Step 3: Faith: the letter to God for 100 pesos. Step 4: Kindness: the postmaster sends 70 pesos. Step 5: Irony: Lencho calls the employees crooks.'
    real_world: Sometimes people who help quietly, like the postmaster, get no thanks or even blame. Real kindness doesn't wait for credit.
  picture:
    kind: flow
    steps:
    - Rain falls like 'new coins' on Lencho's corn
    - A hailstorm destroys the whole crop
    - Lencho writes to God asking for 100 pesos
    - The postmaster collects 70 pesos and sends it
    - Lencho calls the post office employees 'crooks'
    alt: 'The story in five steps: hope from the rain, the hailstorm, Lencho''s letter to God for 100 pesos, the postmaster''s 70 pesos, and Lencho''s accusation.'
  activity:
    type: number_line
    min: 0
    max: 100
    step: 5
    start: 0
    prompt: 'A Letter to God: Lencho asked for 100 pesos. Mark the amounts.'
    goals:
    - prompt: How much did the postmaster send?
      target: 70
      mistakes:
      - when:
          v: 100
        say: 'That''s what Lencho asked for. The postmaster couldn''t collect it all: Lencho later says some was missing.'
      - when:
          v: 30
        say: That's what Lencho thought was missing. What arrived = asked for − missing.
    - prompt: How many pesos did Lencho think were missing?
      target: 30
      mistakes:
      - when:
          v: 70
        say: That's what arrived. He asked for 100, so 100 − 70 were missing.
      - when:
          v: 100
        say: That's the full request. Missing = asked − received.
  lesson:
    - teach: 'Lencho is a hard-working farmer whose house stands on a hill above his ripe corn field. He hopes for rain, and it comes; he calls the drops ''new coins''. But then a hailstorm destroys his whole crop. The family is left with nothing, but Lencho has one hope: help from God.'
      check:
        prompt: What destroyed Lencho's crop?
        options:
        - A hailstorm
        - A flood
        - Locusts
        answer: A hailstorm
        why: Hailstones as big as pearls fell for an hour.
    - teach: Lencho writes a letter to God asking for 100 pesos and posts it. The postmaster laughs, then is moved by Lencho's faith. He collects money from his staff and friends, and with his own salary sends 70 pesos, signing it 'God', so as not to shake that faith.
      picture:
        kind: flow
        steps:
        - Rain like new coins
        - Hailstorm ruins crop
        - Letter to God asking 100 pesos
        - Postmaster collects 70 pesos
        - Lencho blames the post office
        alt: 'Story order: rain like new coins, a hailstorm ruins the crop, Lencho writes to God for 100 pesos, the postmaster collects and sends 70 pesos, and Lencho blames the post office staff.'
      check:
        prompt: Why did the postmaster reply to the letter?
        options:
        - He did not want to shake Lencho's faith in God
        - It was his duty
        - Lencho was his friend
        answer: He did not want to shake Lencho's faith in God
        why: He admired that faith.
    - teach: 'Lencho is not surprised to get money from God, but he is angry that only 70 pesos came. He writes a second letter asking God to send the rest, but not by mail, because the post office employees are ''a bunch of crooks''. The irony: he suspects the very people who helped him.'
      check:
        prompt: Whom does Lencho blame in his second letter?
        options:
        - The post office employees
        - God
        - The rain
        answer: The post office employees
        why: He thinks they stole the money.
  items:
  - prompt: What did Lencho compare the raindrops to?
    options:
    - New coins
    - Pearls
    - Tears
    - Diamonds
    answer: New coins
    difficulty: 1
    hints:
    - He was thinking of money from the harvest.
    - Big drops were ten-cent pieces.
    solution: 'He said the big drops were ten-cent pieces and the small ones fives: ''new coins''.'
    mistakes:
      Pearls: eng10_read_again
  - prompt: How many pesos did Lencho ask God for?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Enough to sow again and live.
    - A round number.
    solution: Lencho asked for 100 pesos.
    mistakes: {"70": "e10_pesos_asked"}
  - prompt: Lencho asked for 100 pesos and received 70. How many pesos did he think were missing?
    answer: '30'
    check: 100 - 70
    difficulty: 1
    hints:
    - Subtract.
    - 100 − 70.
    solution: 100 − 70 = 30 pesos.
    mistakes: {"170": "e10_pesos_missing"}
  - prompt: Why did the postmaster send money to Lencho?
    options:
    - He didn't want to shake Lencho's faith in God
    - Lencho was his relative
    - It was his duty by law
    - Lencho threatened him
    answer: He didn't want to shake Lencho's faith in God
    difficulty: 2
    hints:
    - He first laughed, then became serious.
    - He admired such faith.
    solution: Moved by Lencho's faith, the postmaster decided to answer the letter so that faith wouldn't be shaken.
    mistakes: {"It was his duty by law": "e10_postmaster"}
  - prompt: What is ironic about the end of the story?
    options:
    - Lencho calls the people who helped him crooks
    - Lencho gets more money than he asked for
    - The postmaster takes the money
    - God replies in person
    answer: Lencho calls the people who helped him crooks
    difficulty: 2
    hints:
    - Irony is the opposite of what you expect.
    - Who actually gave the money?
    solution: The employees gave their own money, yet Lencho thinks they stole some of it.
    mistakes: {"Lencho gets more money than he asked for": "e10_irony_lencho"}
  - prompt: Why did Lencho not want the remaining money sent by mail?
    options:
    - He thought the post office employees were a bunch of crooks
    - The post office was closed
    - He wanted to collect it himself from God
    - The postman was ill
    answer: He thought the post office employees were a bunch of crooks
    difficulty: 1
    hints:
    - Read his second letter.
    - Whom did he blame?
    solution: He believed the post office staff had stolen 30 pesos.
    mistakes: {"He wanted to collect it himself from God": "e10_crooks"}
  - prompt: Where was Lencho's house?
    options:
    - On the crest of a low hill
    - In a busy town
    - Beside the sea
    - Inside a forest
    answer: On the crest of a low hill
    difficulty: 1
    hints:
    - From it he could see the river and his field.
    - It was the only house in the valley.
    solution: Lencho's house stood on the crest of a low hill overlooking the valley.
    mistakes:
      In a busy town: eng10_read_again
  - prompt: What did the hailstones look like, according to the story?
    options:
    - Frozen pearls
    - New coins
    - Silver stars
    - Small stones from the river
    answer: Frozen pearls
    difficulty: 2
    hints:
    - The raindrops were 'new coins'.
    - The hailstones were compared to something else.
    solution: The hailstones were described as frozen pearls.
    mistakes:
      New coins: e10u1_hail
  - prompt: After the hailstorm, what did Lencho's field look like?
    options:
    - As if covered with salt
    - Green and fresh
    - Full of ripe corn
    - Covered in flowers
    answer: As if covered with salt
    difficulty: 2
    hints:
    - The crop was destroyed.
    - The field was white.
    solution: The field was white, as if covered with salt; not a leaf remained.
    mistakes:
      Full of ripe corn: e10u1_hail
  - prompt: Whom did Lencho think of as the one 'one hope'?
    options:
    - God
    - The postmaster
    - His neighbours
    - The government
    answer: God
    difficulty: 1
    hints:
    - He had been taught that someone watches over everyone.
    - He wrote to them.
    solution: Lencho believed God would help him.
    mistakes:
      The postmaster: e10u1_faith
  - prompt: In the story, what does 'consolation' mean?
    options:
    - Comfort in a time of sadness
    - Anger
    - Payment
    - A loud noise
    answer: Comfort in a time of sadness
    difficulty: 2
    hints:
    - The family had lost everything.
    - What do sad people need?
    solution: Consolation is comfort given to someone who is upset.
    mistakes:
      Anger: e10u1_words
  - prompt: How did the postmaster collect the money he sent?
    options:
    - From his employees, his own salary and friends
    - From the bank
    - From Lencho's family
    - From the government
    answer: From his employees, his own salary and friends
    difficulty: 2
    hints:
    - He asked people around him.
    - He also gave something himself.
    solution: He asked his staff for money, gave part of his salary, and friends contributed.
    mistakes:
      From the bank: e10_postmaster
  - prompt: What kind of man was Lencho?
    options:
    - Hard-working with total faith in God
    - Lazy and greedy
    - Rich and proud
    - Clever and cunning
    answer: Hard-working with total faith in God
    difficulty: 2
    hints:
    - He worked 'like an ox' in his fields.
    - He believed without a doubt.
    solution: Lencho was a hard-working farmer with unshakeable faith in God.
    mistakes:
      Lazy and greedy: e10u1_faith
  - prompt: How did Lencho react on receiving the money?
    options:
    - He was not surprised, but angry it was less
    - He was shocked and thankful
    - He gave it away
    - He went to thank the postmaster
    answer: He was not surprised, but angry it was less
    difficulty: 2
    hints:
    - His faith was so sure that it didn't surprise him.
    - He counted it.
    solution: He expected the money, so wasn't surprised, but was angry to find only 70 pesos.
    mistakes:
      He was shocked and thankful: e10u1_faith
  - prompt: Who wrote 'A Letter to God'?
    options:
    - G. L. Fuentes
    - Robert Frost
    - Nelson Mandela
    - Anne Frank
    answer: G. L. Fuentes
    difficulty: 1
    hints:
    - Frost wrote the poems in this unit.
    - A Spanish name.
    solution: The story is by G. L. Fuentes.
    mistakes:
      Robert Frost: eng10_author
- code: cbse10e.u1.frost
  title: Dust of Snow · Fire and Ice (Robert Frost)
  after:
  - cbse10e.u1.letter
  notes: |
    Dust of Snow: a crow shakes down the dust of snow from a hemlock tree onto the poet. This small moment
    changes his mood and saves 'some part of a day I had rued' (regretted). The crow and hemlock, usually
    linked with gloom and death, here bring cheer: small things in nature can lift a sad mood.
    Fire and Ice: some say the world will end in fire, some in ice. Fire stands for desire (greed, lust,
    passion) and ice for hatred (coldness, indifference). The poet thinks fire would do it, but ice is 'also
    great and would suffice'. Both poems are short with rhyme; Frost uses simple images for deep ideas.
  explanations:
    text: 'In ''Dust of Snow'' a crow shakes snow from a hemlock tree onto the poet, and that small moment turns a bad day around. In ''Fire and Ice'' Frost asks how the world will end, and uses fire for desire and ice for hatred: either could destroy us.'
    visual: Picture a man walking sadly under a dark hemlock tree. A black crow flaps its wings and soft snow falls on his head; he smiles. Then picture the world with one half in flames (desire) and one half frozen (hatred).
    step_by_step: 'Step 1: Find the symbol (crow, hemlock, fire, ice). Step 2: Ask what it usually means. Step 3: Ask what it means in this poem. Step 4: State the message.'
    real_world: A friend's text or a bird's song on a bad day can change your whole mood, just as the dust of snow did for Frost.
  picture:
    kind: compare
    columns:
    - title: Dust of Snow
      points:
      - 'Crow and hemlock: usually gloomy'
      - Snow falls on the poet
      - His mood changes
      - Small things can heal a bad day
    - title: Fire and Ice
      points:
      - Fire = desire
      - Ice = hatred
      - Either could end the world
      - Warning against extreme feelings
    alt: 'Two Frost poems: in Dust of Snow a crow and hemlock lift the poet''s mood; in Fire and Ice, fire stands for desire and ice for hatred, both able to destroy the world.'
  activity:
    type: sort
    prompt: Dust of Snow or Fire and Ice?
    bins:
    - Dust of Snow
    - Fire and Ice
    items:
    - label: A crow shakes snow from a hemlock
      bin: Dust of Snow
      clue: A small moment in nature.
      why: The crow and hemlock are in Dust of Snow.
    - label: Desire could end the world
      bin: Fire and Ice
      clue: What does fire stand for?
      why: 'Fire = desire: an idea from Fire and Ice.'
    - label: Saves part of a day he had rued
      bin: Dust of Snow
      clue: A mood that changes.
      why: His bad day is saved by the snow falling on him.
    - label: Hatred 'would suffice'
      bin: Fire and Ice
      clue: What does ice stand for?
      why: Ice = hatred, which would also be enough to destroy.
    - label: Small things can lift a sad mood
      bin: Dust of Snow
      clue: The poem's message.
      why: That's the message of Dust of Snow.
    - label: How the world will end
      bin: Fire and Ice
      clue: The big question.
      why: Fire and Ice asks how the world will end.
  lesson:
    - teach: 'In ''Dust of Snow'', a crow shakes down fine snow from a hemlock tree onto the poet. This tiny event changes his mood and saves part of a day he had ''rued'' (regretted). Crows and hemlock usually suggest gloom, yet here they bring cheer: small things can change our mood.'
      check:
        prompt: What changed the poet's mood?
        options:
        - Snow dust shaken by a crow
        - A letter
        - Sunshine
        answer: Snow dust shaken by a crow
        why: A small, natural moment.
    - teach: In 'Fire and Ice', Frost asks how the world will end. Fire stands for desire (greed, lust, passion); ice stands for hatred (coldness, indifference). The poet says from his experience of desire he favours fire, but hate would also 'suffice' (be enough) to destroy the world.
      picture:
        kind: compare
        columns:
        - title: Fire
          points:
          - Desire
          - Greed and passion
          - Burns quickly
        - title: Ice
          points:
          - Hatred
          - Coldness, indifference
          - Freezes slowly
        alt: In 'Fire and Ice', fire stands for desire, greed and passion; ice stands for hatred, coldness and indifference.
      check:
        prompt: Ice stands for…
        options:
        - Hatred
        - Desire
        - Love
        answer: Hatred
        why: It is cold and destroys.
    - teach: 'Both poems are short and use simple images from nature to say something deep. Frost uses rhyme and symbols: snow, a crow, a hemlock tree, fire and ice. Ask what each image stands for in human life.'
      check:
        prompt: Frost's poems use nature images as…
        options:
        - Symbols of human feelings
        - Weather reports
        - Science facts
        answer: Symbols of human feelings
        why: They point to deeper meanings.
  items:
  - prompt: In 'Dust of Snow', which bird shakes the snow onto the poet?
    options:
    - A crow
    - A sparrow
    - A robin
    - An owl
    answer: A crow
    difficulty: 1
    hints:
    - A black bird.
    - Usually seen as a bad omen.
    solution: A crow shook the dust of snow from a hemlock tree.
    mistakes: {"A sparrow": "e10_frost_bird"}
  - prompt: In 'Dust of Snow', what does 'rued' mean?
    options:
    - Regretted
    - Enjoyed
    - Forgotten
    - Planned
    answer: Regretted
    difficulty: 2
    hints:
    - '''A day I had rued''.'
    - He was unhappy about it.
    solution: Rued means regretted; the poet was having a bad day.
    mistakes: {"Enjoyed": "e10_rued"}
  - prompt: 'In ''Fire and Ice'', fire stands for:'
    options:
    - Desire
    - Hatred
    - Peace
    - Knowledge
    answer: Desire
    difficulty: 1
    hints:
    - Burning passion.
    - Ice is the other.
    solution: Fire stands for desire; ice for hatred.
    mistakes:
      Hatred: eng10_poem_meaning
  - prompt: Why is the hemlock tree an unusual choice in 'Dust of Snow'?
    options:
    - It is poisonous and linked with gloom, yet it brings cheer here
    - It has bright flowers
    - It grows only in India
    - It is a fruit tree
    answer: It is poisonous and linked with gloom, yet it brings cheer here
    difficulty: 2
    hints:
    - Hemlock is poisonous.
    - Frost turns the image around.
    solution: Hemlock and the crow usually suggest sorrow, but here they lift the poet's mood.
    mistakes: {"It has bright flowers": "e10_hemlock"}
  - prompt: What is the poet's conclusion about ice in 'Fire and Ice'?
    options:
    - It is also great and would suffice to destroy the world
    - It can never destroy anything
    - It is better than fire
    - It will save the world
    answer: It is also great and would suffice to destroy the world
    difficulty: 2
    hints:
    - '''Would suffice''.'
    - Hatred is as dangerous as desire.
    solution: He says ice (hatred) would also be enough to end the world.
    mistakes: {"It can never destroy anything": "e10_ice"}
  - prompt: What is the main message of 'Dust of Snow'?
    options:
    - Small moments in nature can change our mood
    - Crows are harmful
    - Winter is sad
    - Trees should be cut down
    answer: Small moments in nature can change our mood
    difficulty: 1
    hints:
    - The poet's day was saved.
    - A tiny event.
    solution: A small, natural moment turned the poet's bad day into a better one.
    mistakes: {"Winter is sad": "e10_dust_message"}
  - prompt: From which tree did the snow fall in 'Dust of Snow'?
    options:
    - Hemlock
    - Oak
    - Maple
    - Pine
    answer: Hemlock
    difficulty: 1
    hints:
    - A poisonous plant has the same name.
    - An unusual choice for a cheerful poem.
    solution: The crow shook snow from a hemlock tree.
    mistakes:
      Oak: e10_hemlock
  - prompt: In 'Fire and Ice', what does 'suffice' mean?
    options:
    - Be enough
    - Be too little
    - Melt away
    - Burn
    answer: Be enough
    difficulty: 2
    hints:
    - Ice 'would suffice' to destroy the world.
    - It means it would do the job.
    solution: Suffice means to be enough.
    mistakes:
      Be too little: e10u1_words
  - prompt: What mood was the poet in before the snow fell on him?
    options:
    - Sad and regretful
    - Very happy
    - Excited
    - Sleepy
    answer: Sad and regretful
    difficulty: 2
    hints:
    - He had 'rued' the day.
    - The snow changed his mood.
    solution: He was in a sad, regretful mood until the snow dust fell.
    mistakes:
      Very happy: e10u1_frost_change
  - prompt: Which does the poet favour as the way the world will end, from his experience of desire?
    options:
    - Fire
    - Ice
    - Water
    - Wind
    answer: Fire
    difficulty: 2
    hints:
    - He has 'tasted of desire'.
    - Desire goes with which image?
    solution: From his experience of desire, he holds with those who favour fire.
    mistakes:
      Ice: e10u1_tasted
  - prompt: Why does the poet use a crow in 'Dust of Snow'?
    options:
    - A bird usually linked with gloom brings cheer, which is a surprise
    - Crows are the most beautiful birds
    - Crows bring snow
    - He loves black colour
    answer: A bird usually linked with gloom brings cheer, which is a surprise
    difficulty: 3
    hints:
    - Crows are often seen as bad omens.
    - What happens in the poem is the opposite.
    solution: Using a 'gloomy' bird to lift his mood shows that even unlikely things can bring joy.
    mistakes:
      Crows are the most beautiful birds: e10_frost_bird
  - prompt: How many lines does 'Fire and Ice' have?
    answer: '9'
    check: '9'
    difficulty: 3
    hints:
    - It is a very short poem.
    - Fewer than ten lines.
    solution: '''Fire and Ice'' is a nine-line poem.'
    mistakes:
      '14': eng10_poem_meaning
  - prompt: In 'Fire and Ice', fire and ice stand for…
    options:
    - Desire and hatred
