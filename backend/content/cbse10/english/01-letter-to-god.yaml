    - Both can destroy.
    solution: Fire is desire; ice is hatred.
    mistakes:
      Summer and winter: e10u1_fire_ice
  - prompt: What lesson does 'Dust of Snow' teach?
    options:
    - Small moments in nature can lift a sad mood
