# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 8.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 17
title: Bholi (K. A. Abbas)
tips:
  e10_bholi_future: "Bholi now had education and confidence. How would she use it at home?"
  e10_bholi_refuse: "Bishamber took money to marry her. What does that show about him?"
  e10_bholi_school: "Bholi was sent to school by her parents. Why did they think school would not matter for her?"
  e10_bholi_teacher: "Someone at school spoke kindly to her and promised to teach her. Who?"
  e10_dowry: "Bishamber's demand was large, in thousands of rupees. Read the wedding scene again."
  e10_sulekha: "Her real name means 'one who writes well', which fits how she ends the story."
  e10f8_change: Bholi changes from a silent, frightened child into a confident young woman. Place the moment in that journey.
  e10f8_family: Ramlal's family thought of Bholi as a burden; the teacher saw her worth. Whose view does the choice show?
  e10f8_which_story: Think about which character was helped by a kind teacher at school and later refused a greedy groom. Did this character do either?

concepts:
- code: cbse10e.f8.bholi
  title: Bholi (K. A. Abbas)
  notes: |
    Sulekha, nicknamed Bholi (simpleton), is the youngest daughter of Ramlal, the numberdar of a village. At ten
    months she fell off a cot and something went wrong with her brain; at two she had smallpox that left her
    face pitted; she stammered and was slow to learn. Her parents worried no one would marry her. When a girls'
    school opened, Ramlal sent Bholi because she was considered useless at home. The kind teacher encouraged
    her to speak and promised she would learn and stop being afraid. Years later an old, lame widower grocer,
    Bishamber Nath, agrees to marry Bholi without dowry; at the wedding, seeing her pockmarked face, he demands
    five thousand rupees. Ramlal pays, but Bholi, now confident, throws the money back and refuses to marry a
    greedy, contemptible man. She says she will look after her parents and teach in the school. Themes: power
    of education and kindness; dowry and treatment of girls.
  explanations:
    text: 'Bholi is mocked and neglected because of her looks and her stammer, until a kind teacher at the new village school gives her confidence. At her wedding, when the old groom demands a dowry because of her pockmarked face, Bholi refuses to marry him. She chooses to teach instead: education has given her a voice.'
    visual: Picture a shy girl hiding her face in a classroom while a smiling teacher holds out a picture book; then the same girl, years later, in a wedding dress, throwing a bundle of notes back at a greedy groom.
    step_by_step: 'Step 1: Bholi''s childhood: accident, smallpox, stammer. Step 2: School and the kind teacher. Step 3: The marriage offer from Bishamber. Step 4: The dowry demand. Step 5: Bholi''s refusal and her new life.'
    real_world: Laws in India ban dowry, but stories like Bholi's show that real change comes when girls are educated and confident enough to say no.
  picture:
    kind: flow
    steps:
    - Bholi is mocked for her looks and stammer
    - She goes to the new girls' school
    - A kind teacher gives her confidence
    - At her wedding the groom demands dowry
    - Bholi refuses and chooses to teach
    alt: 'Bholi''s journey: mocked as a child, encouraged by a kind teacher, she refuses a greedy groom who demands dowry and chooses to teach.'
  activity:
    type: order
    prompt: 'Bholi: put her life in order.'
    steps:
    - She falls off a cot at ten months
    - Smallpox leaves her face pitted
    - She is sent to the new girls' school
    - The teacher encourages her to speak
    - Bishamber demands five thousand rupees
    - Bholi refuses to marry him
    reasons:
      Smallpox leaves her face pitted: This came at two, after the fall.
      She is sent to the new girls' school: Seen as useless at home, she is sent off.
      The teacher encourages her to speak: At school she meets kindness.
      Bishamber demands five thousand rupees: Years later, at her wedding.
      Bholi refuses to marry him: Now confident, she rejects a greedy man.
  lesson:
    - teach: '''Bholi'' by K. A. Abbas is about Sulekha, called Bholi (the simpleton), the fourth daughter of Ramlal, the numberdar of a village. At ten months she fell off a cot and was hurt in the head; at two she had smallpox that left her face pock-marked. She stammered and was laughed at, so she hardly spoke. Her parents worried no one would marry her.'
      check:
        prompt: 'Quick check: What was Bholi''s real name?'
        options:
        - Sulekha
        - Radha
        - Mangla
        answer: Sulekha
        why: Bholi was a nickname meaning simpleton.
      ways:
      - style: visual
        teach: Why Bholi was neglected at home as a child, side by side.
        picture:
          kind: compare
          columns:
          - title: What happened to her
            points:
            - fell off a cot as a baby
            - smallpox left pock-marks
            - stammered when she spoke
          - title: How the family treated her
            points:
            - called her a simpleton
            - gave her less care
            - thought no one would marry her
          alt: As a baby Bholi fell off a cot, smallpox left pock-marks and she stammered. Her family called her a simpleton, gave her less care and thought no one would marry her.
      - style: real_world
        teach: Children who are teased for how they look or speak often stop talking in class. A single kind adult can change that, as Bholi's teacher did.
    - teach: When a primary school for girls opened, the Tehsildar asked Ramlal to set an example by sending his daughters. Ramlal sent Bholi, thinking no one would marry her anyway. Her kind teacher spoke gently, encouraged her to speak without stammering, and promised that learning would make her respected. Bholi gained confidence.
      picture:
        kind: flow
        steps:
        - Silent, laughed at
        - Sent to school
        - Kind teacher encourages
        - Gains confidence
        - Refuses greedy groom
        - Will teach in the school
        alt: 'Bholi''s journey: a silent child, sent to school, encouraged by a kind teacher, gains confidence, refuses a greedy groom, and decides to teach.'
      check:
        prompt: 'Quick check: Why was Bholi sent to school?'
        options:
        - The Tehsildar asked Ramlal to set an example
        - She begged to go
        - Her sisters were already there
        answer: The Tehsildar asked Ramlal to set an example
        why: Her parents also thought she would not marry.
      ways:
      - style: step_by_step
        teach: 'See how school changed Bholi. Step 1: She is scared on the first day. Step 2: The teacher speaks gently and asks her name. Step 3: She is encouraged to speak despite the stammer. Step 4: She is promised books and learning. Step 5: Slowly she gains confidence.'
      - style: real_world
        teach: Government schemes like 'Beti Bachao, Beti Padhao' aim to get every girl into school, because education can change a girl's whole future, as it did Bholi's.
    - teach: Years later, a rich but old, lame grocer, Bishamber Nath, agreed to marry her. At the wedding, seeing her pock-marks, he demanded a dowry of five thousand rupees. Ramlal paid, but Bholi threw the money at Bishamber and refused to marry such a mean, greedy coward. She said she would teach in the school and look after her parents in their old age. The story is about girls' education, confidence, and the evil of dowry.
      check:
        prompt: What did Bholi do with the dowry money?
        options:
        - Threw it at Bishamber and refused to marry him
        - Kept it for school
        - Gave it to her teacher
        answer: Threw it at Bishamber and refused to marry him
        why: She would not marry a greedy man.
      ways:
      - style: visual
        teach: Bholi before school and after school, side by side.
        picture:
          kind: compare
          columns:
          - title: Before
            points:
            - silent and scared
            - stammers
            - treated as a burden
          - title: After
            points:
            - confident
            - speaks clearly
            - refuses an unfair marriage
          alt: Before school Bholi was silent, scared, stammered and was treated as a burden. After school she was confident, spoke clearly and refused an unfair marriage.
      - style: step_by_step
        teach: 'Read the wedding scene. Step 1: The groom sees her pock-marks. Step 2: He demands a large dowry. Step 3: Her father pays to save his honour. Step 4: Bholi throws the garland aside and refuses to marry a greedy man. Step 5: She chooses dignity over fear.'
  items:
  - prompt: What was Bholi's real name?
    options:
    - Sulekha
    - Radha
    - Champa
    - Valli
    answer: Sulekha
    difficulty: 1
    hints:
    - Bholi was a nickname.
    - It means simpleton.
    solution: Bholi's real name was Sulekha.
    mistakes: {"Radha": "e10_sulekha"}
  - prompt: Why was Bholi sent to school?
    options:
    - "Her parents thought she was useless at home and no one would marry her"
    - "She asked to go to school, as she wanted to learn like her sisters"
    - "The law required every girl in the village to go to school that year"
    - "Her brothers insisted that she should study with them in the town"
    answer: Her parents thought she was useless at home and no one would marry her
    difficulty: 2
    hints:
    - Her sisters were married.
    - Ramlal's reasoning.
    solution: Her parents saw her as a burden, so they sent her to the new school.
    mistakes: {"She asked to go to school, as she wanted to learn like her sisters": "e10_bholi_school"}
  - prompt: Who helped Bholi gain confidence?
    options:
    - Her teacher
    - Bishamber Nath
    - Her father
    - The tehsildar
    answer: Her teacher
    difficulty: 1
    hints:
    - At the school.
    - She promised Bholi would stop stammering.
    solution: Her kind teacher encouraged her to speak and learn.
    mistakes: {"Bishamber Nath": "e10_bholi_teacher"}
  - prompt: How many rupees did Bishamber demand as dowry at the wedding?
    answer: '5000'
    check: '5000'
    difficulty: 2
    hints:
    - Thousands.
    - After seeing her face.
    solution: He demanded five thousand rupees.
    mistakes: {"500": "e10_dowry"}
  - prompt: Why did Bholi refuse to marry Bishamber?
    options:
    - "He was greedy and contemptible for demanding dowry"
    - "He was too young for her and still in school"
    - "She loved someone else in the village"
    - "Her teacher forbade her to marry anyone"
    answer: He was greedy and contemptible for demanding dowry
    difficulty: 2
    hints:
    - The dowry demand.
    - She now had courage.
    solution: She would not marry a mean, greedy man who demanded money.
    mistakes: {"She loved someone else in the village": "e10_bholi_refuse"}
  - prompt: What did Bholi decide to do after refusing the marriage?
    options:
    - "Look after her parents and teach in the school"
    - "Leave the village and go to live in the city"
    - "Marry someone else who was richer than Bishamber"
    - "Work in Bishamber's grocery shop in the town"
    answer: Look after her parents and teach in the school
    difficulty: 1
    hints:
    - She had learnt a lot.
    - Her teacher's example.
    solution: She chose to care for her parents and become a teacher.
    mistakes: {"Leave the village and go to live in the city": "e10_bholi_future"}
  - prompt: Who was Ramlal?
    options:
    - "Bholi's father, the village numberdar"
    - "The Tehsildar who opened the school"
    - "Bholi's teacher at the primary school"
    - "The grocer who wanted to marry Bholi"
    answer: Bholi's father, the village numberdar
    difficulty: 1
    hints:
    - A village official.
    - He had several daughters.
    solution: Ramlal, the numberdar, was Bholi's father.
    mistakes:
      "The grocer who wanted to marry Bholi": e10f8_family
  - prompt: What happened to Bholi when she was ten months old?
    options:
    - "She fell off a cot and was hurt in the head"
    - "She got smallpox and was left with marks"
    - "She lost her sight after a high fever"
    - "She lost both her parents in a flood"
    answer: She fell off a cot and was hurt in the head
    difficulty: 2
    hints:
    - Smallpox came later, at two.
    - It was a fall.
    solution: She fell from a cot at ten months, which affected her.
    mistakes:
      "She got smallpox and was left with marks": e10f8_change
  - prompt: Why was Bholi laughed at by other children?
    options:
    - She stammered
    - She was very tall
    - She sang badly
    - She was rich
    answer: She stammered
    difficulty: 1
    hints:
    - It was about her speech.
    - She spoke very little.
    solution: Children mocked her stammer, so she rarely spoke.
    mistakes:
      She was rich: e10f8_family
  - prompt: What did Bholi think at first about going to school?
    options:
    - "She was frightened but liked the idea of new clothes and being washed"
    - "She refused to go at all and hid in the cowshed for the whole day"
    - "She was proud that she alone of all the sisters had been chosen to go"
    - "She cried for days and would not eat or speak to anyone at home"
    answer: She was frightened but liked the idea of new clothes and being washed
    difficulty: 3
    hints:
    - Her mother bathed her and gave her a clean dress.
    - She was also scared.
    solution: She was afraid, but pleased at being bathed and given a clean dress.
    mistakes:
      "She refused to go at all and hid in the cowshed for the whole day": e10f8_change
  - prompt: Why did Bholi's parents accept Bishamber's proposal?
    options:
    - "They feared no one else would marry her, and he was well-off"
    - "They loved Bishamber like their own son and trusted him fully"
    - "Bholi chose him herself when she saw him at the village fair"
    - "The teacher suggested him to them as a good and kind match"
    answer: They feared no one else would marry her, and he was well-off
    difficulty: 2
    hints:
    - He was old and lame.
    - But he asked for no dowry at first.
    solution: Worried about her looks, they accepted the older, well-off grocer.
    mistakes:
      "Bholi chose him herself when she saw him at the village fair": e10f8_family
  - prompt: What did Bishamber see that made him demand dowry?
    options:
    - Bholi's pock-marked face
    - Ramlal's big house
    - Her school books
    - Her sisters
    answer: Bholi's pock-marked face
    difficulty: 2
    hints:
    - He lifted her veil.
    - Smallpox had left marks.
    solution: On seeing her pock-marks he demanded five thousand rupees.
    mistakes:
      Ramlal's big house: e10f8_family
  - prompt: How did the teacher change Bholi's life?
    options:
    - "She encouraged her to speak and believe in herself"
    - "She punished her every time she stammered in class"
    - "She found her a husband who would not ask for dowry"
    - "She gave her money to buy new clothes and books"
    answer: She encouraged her to speak and believe in herself
    difficulty: 2
    hints:
    - She was gentle.
    - She said Bholi's stammer would go.
    solution: The teacher's kindness gave Bholi confidence and education.
    mistakes:
      "She found her a husband who would not ask for dowry": e10f8_family
  - prompt: What social evil does the story attack?
    options:
    - Dowry and neglect of girls
    - Child labour in factories
    - Pollution
    - Cruelty to animals
    answer: Dowry and neglect of girls
    difficulty: 2
    hints:
    - Think of Bishamber's demand.
    - Think of how Bholi was treated at home.
    solution: The story criticises dowry and the neglect of girls' education.
    mistakes:
      Pollution: e10f8_change
  - prompt: Who wrote 'Bholi'?
    options:
    - K. A. Abbas
    - Ruskin Bond
    - Vallikkannan
    - Guy de Maupassant
    answer: K. A. Abbas
    difficulty: 1
    hints:
    - An Indian writer and filmmaker.
    - Khwaja Ahmad ___.
    solution: '''Bholi'' is by K. A. Abbas.'
    mistakes:
      Ruskin Bond: eng10_author
  - prompt: 'Assertion (A): Bholi refused to marry Bishamber Nath.

      Reason (R): He showed his greed by demanding a dowry, and she had gained the confidence to stand up for herself.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. His greed and her new self-respect from education led to the refusal. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A shy girl who stammers is encouraged by a teacher, learns to read, and later speaks up against an unfair decision by her family. Which character''s journey does this match?'
    options:
    - Bholi
    - Matilda Loisel
    - Amanda
    answer: Bholi
    hints:
    - Who was helped by a kind teacher?
    - Who refused a marriage?
    solution: Bholi was encouraged by her teacher, grew confident and refused a greedy groom.
    mistakes:
      Matilda Loisel: e10f8_which_story
      Amanda: e10f8_which_story
    exam: case
    difficulty: 2
  - prompt: 'Situation: At the end, Bholi says she will look after her parents in their old age and teach in the school. What does this show?'
    options:
    - Education made her independent and responsible
    - She wanted to leave the village at once
    - She was angry with her teacher
    answer: Education made her independent and responsible
    hints:
    - What will she do for her parents?
    - What job does she plan?
    solution: Bholi plans to support her parents and teach, showing the independence education gave her.
    mistakes:
      She wanted to leave the village at once: e10_bholi_future
      She was angry with her teacher: e10_bholi_teacher
    exam: competency
    difficulty: 2
