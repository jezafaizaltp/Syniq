title: Bholi (K. A. Abbas)
concepts:
- code: cbse10e.f8.bholi
  title: Bholi (K. A. Abbas)
  notes: |
    Sulekha, nicknamed Bholi (simpleton), is the youngest daughter of Ramlal, the numberdar of a village. At ten
    months she fell off a cot and something went wrong with her brain; at two she had smallpox that left her
    face pitted; she stammered and was slow to learn. Her parents worried no one would marry her. When a girls'
    school opened, Ramlal sent Bholi because she was considered useless at home. The kind teacher encouraged
    her to speak and promised she would learn and stop being afraid. Years later an old, lame widower grocer,
    Bishamber Nath, agrees to marry Bholi without dowry; at the wedding, seeing her pockmarked face, he demands
    five thousand rupees. Ramlal pays, but Bholi, now confident, throws the money back and refuses to marry a
    greedy, contemptible man. She says she will look after her parents and teach in the school. Themes: power
    of education and kindness; dowry and treatment of girls.
  explanations:
    text: 'Bholi is mocked and neglected because of her looks and her stammer, until a kind teacher at the new village school gives her confidence. At her wedding, when the old groom demands a dowry because of her pockmarked face, Bholi refuses to marry him. She chooses to teach instead: education has given her a voice.'
    visual: Picture a shy girl hiding her face in a classroom while a smiling teacher holds out a picture book; then the same girl, years later, in a wedding dress, throwing a bundle of notes back at a greedy groom.
    step_by_step: 'Step 1: Bholi''s childhood: accident, smallpox, stammer. Step 2: School and the kind teacher. Step 3: The marriage offer from Bishamber. Step 4: The dowry demand. Step 5: Bholi''s refusal and her new life.'
    real_world: Laws in India ban dowry, but stories like Bholi's show that real change comes when girls are educated and confident enough to say no.
  picture:
    kind: flow
    steps:
    - Bholi is mocked for her looks and stammer
    - She goes to the new girls' school
    - A kind teacher gives her confidence
    - At her wedding the groom demands dowry
    - Bholi refuses and chooses to teach
    alt: 'Bholi''s journey: mocked as a child, encouraged by a kind teacher, she refuses a greedy groom who demands dowry and chooses to teach.'
  items:
  - prompt: What was Bholi's real name?
    options:
    - Sulekha
    - Radha
    - Champa
    - Valli
    answer: Sulekha
    difficulty: 1
    hints:
    - Bholi was a nickname.
    - It means simpleton.
    solution: Bholi's real name was Sulekha.
  - prompt: Why was Bholi sent to school?
    options:
    - Her parents thought she was useless at home and no one would marry her
    - She asked to go
    - The law required it
    - Her brothers insisted
    answer: Her parents thought she was useless at home and no one would marry her
    difficulty: 2
    hints:
    - Her sisters were married.
    - Ramlal's reasoning.
    solution: Her parents saw her as a burden, so they sent her to the new school.
  - prompt: Who helped Bholi gain confidence?
    options:
    - Her teacher
    - Bishamber Nath
    - Her father
    - The tehsildar
    answer: Her teacher
    difficulty: 1
    hints:
    - At the school.
    - She promised Bholi would stop stammering.
    solution: Her kind teacher encouraged her to speak and learn.
  - prompt: How many rupees did Bishamber demand as dowry at the wedding?
    answer: '5000'
    check: '5000'
    difficulty: 2
    hints:
    - Thousands.
    - After seeing her face.
    solution: He demanded five thousand rupees.
  - prompt: Why did Bholi refuse to marry Bishamber?
    options:
    - He was greedy and contemptible for demanding dowry
    - He was too young
    - She loved someone else
    - Her teacher forbade it
    answer: He was greedy and contemptible for demanding dowry
    difficulty: 2
    hints:
    - The dowry demand.
    - She now had courage.
    solution: She would not marry a mean, greedy man who demanded money.
  - prompt: What did Bholi decide to do after refusing the marriage?
    options:
    - Look after her parents and teach in the school
    - Leave the village
    - Marry someone rich
    - Work in Bishamber's shop
    answer: Look after her parents and teach in the school
    difficulty: 1
    hints:
    - She had learnt a lot.
    - Her teacher's example.
    solution: She chose to care for her parents and become a teacher.
