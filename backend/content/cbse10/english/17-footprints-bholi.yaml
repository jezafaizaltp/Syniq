    - Bishamber demands five thousand rupees
    - Bholi refuses to marry him
    reasons:
      Smallpox leaves her face pitted: This came at two, after the fall.
      She is sent to the new girls' school: Seen as useless at home, she is sent off.
      The teacher encourages her to speak: At school she meets kindness.
      Bishamber demands five thousand rupees: Years later, at her wedding.
      Bholi refuses to marry him: Now confident, she rejects a greedy man.
  lesson:
    - teach: '''Bholi'' by K. A. Abbas is about Sulekha, called Bholi (the simpleton), the fourth daughter of Ramlal, the numberdar of a village. At ten months she fell off a cot and was hurt in the head; at two she had smallpox that left her face pock-marked. She stammered and was laughed at, so she hardly spoke. Her parents worried no one would marry her.'
      check:
        prompt: What was Bholi's real name?
        options:
        - Sulekha
        - Radha
        - Mangla
        answer: Sulekha
        why: Bholi was a nickname meaning simpleton.
    - teach: When a primary school for girls opened, the Tehsildar asked Ramlal to set an example by sending his daughters. Ramlal sent Bholi, thinking no one would marry her anyway. Her kind teacher spoke gently, encouraged her to speak without stammering, and promised that learning would make her respected. Bholi gained confidence.
      picture:
        kind: flow
        steps:
        - Silent, laughed at
        - Sent to school
        - Kind teacher encourages
        - Gains confidence
        - Refuses greedy groom
        - Will teach in the school
        alt: 'Bholi''s journey: a silent child, sent to school, encouraged by a kind teacher, gains confidence, refuses a greedy groom, and decides to teach.'
      check:
        prompt: Why was Bholi sent to school?
        options:
        - The Tehsildar asked Ramlal to set an example
        - She begged to go
        - Her sisters were already there
        answer: The Tehsildar asked Ramlal to set an example
        why: Her parents also thought she would not marry.
    - teach: Years later, a rich but old, lame grocer, Bishamber Nath, agreed to marry her. At the wedding, seeing her pock-marks, he demanded a dowry of five thousand rupees. Ramlal paid, but Bholi threw the money at Bishamber and refused to marry such a mean, greedy coward. She said she would teach in the school and look after her parents in their old age. The story is about girls' education, confidence, and the evil of dowry.
      check:
        prompt: What did Bholi do with the dowry money?
        options:
        - Threw it at Bishamber and refused to marry him
        - Kept it for school
        - Gave it to her teacher
        answer: Threw it at Bishamber and refused to marry him
        why: She would not marry a greedy man.
