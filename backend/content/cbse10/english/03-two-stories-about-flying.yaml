# CBSE Class 10 English (NCERT First Flight), unit 3: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 3
title: Two Stories about Flying · How to Tell Wild Animals · The Ball Poem
tips:
  e10_ball_loss: "The poet says money is external. What does the boy need to learn that money can't buy?"
  e10_ball_water: "The boy watches the ball bounce down the street and into deep water by the docks."
  e10_bear: "Stripes belong to another animal in the poem. The bear's way of greeting you is a little too friendly."
  e10_crocodile: "People say an animal sheds false tears while eating. It lives in rivers and has a long snout full of teeth."
  e10_dakota: "The narrator flew an old propeller plane, the kind used in wartime to carry people and cargo."
  e10_epistemology: "'Epistemology' means the study of knowing. Knowing what, here?"
  e10_seagull_fear: "His parents kept calling him to fly. What held him back was inside him."
  e10_seagull_hunger: "He was very hungry. What did his mother hold just out of reach?"
  e10_storm: "In the clouds the pilot couldn't find his way. Which instruments help a pilot find the way?"
  e10_tower: "The mystery is that nobody else saw the black aeroplane. What did the woman say about other planes?"
  e10_two_stories: "Only one story has a bird. Think of what both the seagull and the pilot faced, and how they got through."
  e10_wild_tone: "The poem gives silly ways to tell dangerous animals. Does it make you cry or smile?"

concepts:
- code: cbse10e.u3.flying
  title: 'Two Stories about Flying: His First Flight · The Black Aeroplane'
  notes: |
    His First Flight (Liam O'Flaherty): a young seagull is afraid to fly, though his brothers and sister have
    flown. His family scolds him and leaves him alone on the ledge. Hungry, he begs; his mother flies near with a
    piece of fish, stops just out of reach, and he dives at it; falling, his wings spread and he flies, then
    lands on the sea and floats. Theme: overcoming fear; hunger forced courage.
    The Black Aeroplane (Frederick Forsyth): the narrator flies an old Dakota from Paris to England, dreaming of
    breakfast. He flies into huge black storm clouds; his compass and radio fail; fuel is low. A black
    aeroplane without lights appears; its pilot guides him down to a runway. At the control tower, a woman says
    no other aeroplane was flying that night. The mystery remains: who helped him?
  explanations:
    text: Two stories about flying and fear. A young seagull too scared to fly finally does when hunger makes him dive for a fish his mother holds out. A pilot lost in a storm is guided home by a mysterious black aeroplane that, the control tower says, was never there.
    visual: Picture a young seagull on a cliff ledge, the sea far below, his mother hovering with a fish just out of reach. Then picture a small plane in black clouds, a dark shape flying beside it with no lights.
    step_by_step: 'Step 1: Who is afraid and why? Step 2: What forces a choice: hunger or the storm? Step 3: What happens: the dive, the guidance. Step 4: The ending: flight, or a mystery.'
    real_world: Many of us, like the seagull, only learn to swim or ride a cycle when someone stops holding on and we have to try.
  picture:
    kind: compare
    columns:
    - title: His First Flight
      points:
      - Young seagull afraid to fly
      - Family leaves him alone, hungry
      - Mother holds out a fish
      - He dives and flies
    - title: The Black Aeroplane
      points:
      - Pilot flying a Dakota from Paris
      - Storm; compass and radio fail
      - A black aeroplane guides him
      - 'Tower: no other plane flying'
    alt: 'His First Flight: a hungry young seagull dives for a fish and flies. The Black Aeroplane: a pilot lost in a storm is guided by a mystery plane the tower says wasn''t there.'
  activity:
    type: order
    prompt: 'His First Flight: put the seagull''s day in order.'
    steps:
    - His family flies; he stays afraid on the ledge
    - He is left alone and gets hungry
    - His mother flies near with a piece of fish
    - He dives at the fish and falls
    - His wings spread and he flies
    - He lands on the sea and floats
    reasons:
      He is left alone and gets hungry: His family leaves him to make him try.
      His mother flies near with a piece of fish: His hunger and begging bring her close.
      He dives at the fish and falls: The fish is just out of reach, so he lunges.
      His wings spread and he flies: Falling forces his wings open.
      He lands on the sea and floats: After flying, he comes down onto the water.
  items:
  - prompt: Why did the young seagull not fly with his brothers and sister?
    options:
    - He was afraid his wings wouldn't support him
    - He was ill
    - He had no wings
    - His parents forbade it
    answer: He was afraid his wings wouldn't support him
    difficulty: 1
    hints:
    - The ledge was high.
    - Fear.
    solution: He was afraid that his wings would not carry him over the sea.
    mistakes: {"His parents forbade it": "e10_seagull_fear"}
  - prompt: What finally made the seagull fly?
    options:
    - He dived at the fish his mother held out and his wings spread
    - His father pushed him
    - A storm blew him
    - He jumped to escape a cat
    answer: He dived at the fish his mother held out and his wings spread
    difficulty: 1
    hints:
    - Hunger.
    - Mother stopped just out of reach.
    solution: Maddened by hunger, he dived at the fish and found himself flying.
    mistakes: {"His father pushed him": "e10_seagull_hunger"}
  - prompt: Which aeroplane was the narrator flying in 'The Black Aeroplane'?
    options:
    - An old Dakota
    - A jet fighter
    - A helicopter
    - A glider
    answer: An old Dakota
    difficulty: 2
    hints:
    - A small old plane.
    - From Paris to England.
    solution: He was flying an old Dakota from Paris back to England.
    mistakes: {"A jet fighter": "e10_dakota"}
  - prompt: What went wrong during the storm?
    options:
    - The compass and radio stopped working and fuel was low
    - The engine caught fire
    - A bird hit the windscreen
    - The passengers panicked
    answer: The compass and radio stopped working and fuel was low
    difficulty: 2
    hints:
    - Instruments.
    - He couldn't find his way.
    solution: In the storm his compass and radio failed and his fuel was running out.
    mistakes: {"The engine caught fire": "e10_storm"}
  - prompt: What did the woman in the control tower tell the pilot?
    options:
    - No other aeroplane was flying that night
    - The black aeroplane had landed
    - He had broken the rules
    - His plane was stolen
    answer: No other aeroplane was flying that night
    difficulty: 1
    hints:
    - The mystery.
    - She saw only one plane on radar.
    solution: She said there were no other aeroplanes up that night.
    mistakes: {"The black aeroplane had landed": "e10_tower"}
  - prompt: What is common to both stories?
    options:
    - Overcoming fear with help, in a moment of danger
    - Both are about birds
    - Both end in a crash
    - Both are set in India
    answer: Overcoming fear with help, in a moment of danger
    difficulty: 2
    hints:
    - Seagull and pilot.
    - Each gets help.
    solution: Both show a character facing fear in danger, helped by someone (the mother; the mystery pilot).
    mistakes: {"Both are about birds": "e10_two_stories"}
- code: cbse10e.u3.poems
  title: How to Tell Wild Animals (Carolyn Wells) · The Ball Poem (John Berryman)
  after:
  - cbse10e.u3.flying
  notes: |
    How to Tell Wild Animals: a humorous poem on identifying animals by what they do to you. The Asian lion
    roars at you as you're dying; the Bengal tiger is noble, with black stripes on yellow; the leopard leaps at
    you, spotted; the bear hugs you very hard; the hyena laughs (and smiles); the crocodile weeps tears as it
    eats you; the chameleon is like a lizard without ears or wings, changing colour. Uses poetic licence
    ('ferocious', 'dye'); funny exaggeration.
    The Ball Poem: a boy loses his ball into the harbour water. The poet says not to buy him another ball; the
    boy must learn the 'epistemology of loss': that everyone loses things, and money cannot buy back what is
    lost. Growing up means learning to bear loss.
  explanations:
    text: '''How to Tell Wild Animals'' is a funny guide: you''ll know a bear when it hugs you hard and a crocodile when it cries while eating you. ''The Ball Poem'' is serious: a boy loses his ball in the water, and the poet says he must learn to live with loss, because money can''t buy back everything.'
    visual: 'Picture a jungle notice board with jokes: ''If it roars as you die: lion. If it hugs you very hard: bear. If it weeps while eating you: crocodile.'' Then picture a small boy staring at a ball bobbing away on dark harbour water.'
    step_by_step: 'Step 1: Note the tone: comic or serious. Step 2: For the animals, match the animal with its clue. Step 3: For the ball, ask what the ball stands for (childhood, things we lose). Step 4: State the lesson.'
    real_world: When a child breaks a favourite toy, buying a new one at once doesn't teach them how to handle loss, which the Ball Poem says is part of growing up.
  picture:
    kind: compare
    columns:
    - title: How to Tell Wild Animals
      points:
      - 'Lion: roars as you die'
      - 'Bear: hugs you very hard'
      - 'Crocodile: weeps as it eats'
      - 'Chameleon: lizard without ears'
    - title: The Ball Poem
      points:
      - Boy loses his ball in the harbour
      - Don't buy him another
      - He must learn about loss
      - Money can't buy back what's lost
    alt: How to Tell Wild Animals gives funny clues for each animal; The Ball Poem shows a boy who loses his ball and must learn to accept loss.
  activity:
    type: sort
    prompt: 'How to Tell Wild Animals: which animal?'
    bins:
    - Lion
    - Leopard
    - Bear
    - Hyena
    - Crocodile
    items:
    - label: Roars at you as you're dying
      bin: Lion
      clue: The Asian one.
      why: The Asian lion roars at you.
    - label: Leaps at you, spotted
      bin: Leopard
      clue: Spots.
      why: The spotted one that leaps is the leopard.
    - label: Hugs you very hard
      bin: Bear
      clue: A crushing hug.
      why: A bear hugs you hard.
    - label: Laughs and smiles
      bin: Hyena
      clue: Known for a laughing sound.
      why: The hyena laughs.
    - label: Weeps tears as it eats you
      bin: Crocodile
      clue: False tears.
      why: 'Crocodile tears: it weeps while eating.'
  items:
  - prompt: In 'How to Tell Wild Animals', how can you tell a bear?
    options:
    - It hugs you very hard
    - It weeps while eating
    - It has black stripes
    - It changes colour
    answer: It hugs you very hard
    difficulty: 1
    hints:
    - A 'bear hug'.
    - Funny clue.
    solution: If it hugs you very hard, it's a bear.
    mistakes: {"It has black stripes": "e10_bear"}
  - prompt: Which animal 'weeps' while eating its prey, in the poem?
    options:
    - Crocodile
    - Hyena
    - Leopard
    - Lion
    answer: Crocodile
    difficulty: 1
    hints:
    - '''Crocodile tears''.'
    - False sorrow.
    solution: 'The crocodile weeps as it eats you: crocodile tears.'
    mistakes: {"Hyena": "e10_crocodile"}
  - prompt: What is the tone of 'How to Tell Wild Animals'?
    options:
    - Humorous
    - Tragic
    - Angry
    - Religious
    answer: Humorous
    difficulty: 1
    hints:
    - The clues are jokes.
    - Exaggeration.
    solution: The poem is light-hearted and funny.
    mistakes: {"Tragic": "e10_wild_tone"}
  - prompt: In 'The Ball Poem', where does the boy's ball go?
    options:
    - Into the harbour water
    - Over a wall
    - Into a tree
    - Down a well
    answer: Into the harbour water
    difficulty: 1
    hints:
    - It bounces down the street.
    - Into the water.
    solution: The ball bounces down the street and into the water of the harbour.
    mistakes: {"Over a wall": "e10_ball_water"}
  - prompt: Why does the poet not want to buy the boy another ball?
    options:
    - The boy must learn to accept loss
    - The poet has no money
    - Balls are dangerous
    - The boy doesn't like balls
    answer: The boy must learn to accept loss
    difficulty: 2
    hints:
    - '''Epistemology of loss''.'
    - Growing up.
    solution: The boy must learn how to stand up after a loss; a new ball would not teach him that.
    mistakes: {"The poet has no money": "e10_ball_loss"}
  - prompt: What does 'epistemology of loss' mean in the poem?
    options:
    - Understanding what it means to lose something
    - A science of balls
    - The cost of toys
    - A type of game
    answer: Understanding what it means to lose something
    difficulty: 2
    hints:
    - Epistemology = how we know.
    - Learning through loss.
    solution: It means coming to know and accept the nature of loss.
    mistakes: {"A science of balls": "e10_epistemology"}
