subject: cbse10-eng
chapter: 9
title: The Proposal
concepts:
- code: cbse10e.u9.proposal
  title: The Proposal (Anton Chekhov)
  notes: |
    A one-act comic play set in 19th-century rural Russia. Ivan Vassilevitch Lomov, a nervous, hypochondriac
    landowner of 35, comes to propose to Natalya Stepanovna, the 25-year-old daughter of his neighbour Stepan
    Stepanovitch Chubukov. Chubukov is delighted. But before Lomov can propose, he and Natalya quarrel over who
    owns the Oxen Meadows; Chubukov joins in, and Lomov leaves with palpitations. When Natalya learns he came to
    propose, she screams for him to return. They then quarrel over whose dog is better, Lomov's Guess or
    Chubukov's Squeezer. Lomov faints; Chubukov hurriedly puts Natalya's hand in his and declares them engaged,
    and they keep quarrelling. Themes: satire on marriage for property and convenience; quarrelsome, materialistic
    upper class.
  explanations:
    text: 'Lomov comes to ask his neighbour''s daughter Natalya to marry him, but they keep fighting before he can say it: first over who owns a meadow, then over whose dog is better. Her father finally joins their hands while they are still arguing. Chekhov is making fun of people who marry for land and wealth.'
    visual: 'Picture a Russian drawing room: Lomov in an evening coat clutching his chest, Natalya and Chubukov shouting at him about ''Oxen Meadows'', and later two people arguing about dogs while champagne is being poured.'
    step_by_step: 'Step 1: Why Lomov came: to propose. Step 2: First quarrel: the Oxen Meadows. Step 3: Lomov leaves; Natalya learns why he came. Step 4: Second quarrel: Guess vs Squeezer. Step 5: Engagement amid quarrels: the satire.'
    real_world: Family arguments over a small strip of land are still common, and this play laughs at how such disputes can matter more to people than relationships.
  picture:
    kind: flow
    steps:
    - Lomov arrives to propose to Natalya
    - They quarrel over the Oxen Meadows
    - Lomov leaves; Natalya learns he came to propose
    - They quarrel over the dogs Guess and Squeezer
    - Chubukov joins their hands; they keep quarrelling
    alt: 'The plot of The Proposal: Lomov comes to propose, quarrels over the Oxen Meadows, returns, quarrels over the dogs, and is engaged while still arguing.'
  items:
  - prompt: Who wrote 'The Proposal'?
    options:
    - Anton Chekhov
    - Leo Tolstoy
    - Guy de Maupassant
    - Oscar Wilde
    answer: Anton Chekhov
    difficulty: 1
    hints:
    - A Russian writer.
    - Known for short plays.
    solution: The play is by Anton Chekhov.
    mistakes:
      Guy de Maupassant: eng10_author
  - prompt: What was the first quarrel about?
    options:
    - Ownership of the Oxen Meadows
    - The dogs
    - Money for the wedding
    - A broken fence
    answer: Ownership of the Oxen Meadows
    difficulty: 1
    hints:
    - Land.
    - Between the two estates.
    solution: Lomov and Natalya first quarrel over who owns the Oxen Meadows.
  - prompt: What were the names of the dogs they argued about?
    options:
    - Guess and Squeezer
    - Ink and Blink
    - Mustard and Custard
    - Rex and Max
    answer: Guess and Squeezer
    difficulty: 1
    hints:
    - Lomov's dog and Chubukov's dog.
    - Hunting dogs.
    solution: Lomov's Guess and Chubukov's Squeezer.
  - prompt: How old was Lomov, according to the play?
    answer: '35'
    check: '35'
    difficulty: 2
    hints:
    - He says he is past the right age to marry.
    - Mid-thirties.
    solution: Lomov says he is 35.
  - prompt: Why did Lomov want to marry Natalya?
    options:
    - She was a good housekeeper and their lands were next to each other
    - He loved her deeply
    - She was very rich and famous
    - His parents forced him
    answer: She was a good housekeeper and their lands were next to each other
    difficulty: 2
    hints:
    - Practical reasons.
    - Not romantic love.
    solution: He wanted a quiet, regular life and saw her as a good housekeeper, and their estates adjoined.
  - prompt: What does Chekhov satirise in the play?
    options:
    - Marriage for property and convenience among the rich
    - The army
    - City life
    - Religion
    answer: Marriage for property and convenience among the rich
    difficulty: 2
    hints:
    - What are they fighting over?
    - Land and status.
    solution: The play mocks wealthy families who see marriage as a matter of property.
