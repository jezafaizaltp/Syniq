# CBSE Class 10 English (NCERT First Flight), unit 9: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 9
title: The Proposal
tips:
  e10_chekhov_satire: "The whole play is a quarrel over land and dogs during a marriage proposal. What is being mocked?"
  e10_dogs_names: "Mustard and Custard are from 'The Tale of Custard the Dragon'. The play's dogs have odd names too."
  e10_lomov_age: "Lomov says he is past the age when a man should marry. Look for the number he gives."
  e10_lomov_reason: "Lomov lists practical reasons, not feelings. Think of land and housekeeping."
  e10_oxen_meadows: "The dogs come in the second quarrel. The first was over a piece of land."
  e10u9_people: 'There are only three characters: Chubukov the landowner, his daughter Natalya, and their neighbour Lomov. Who is being described?'
  e10u9_order: The play moves from Lomov's arrival, to the Oxen Meadows quarrel, to the dog quarrel, to the hurried engagement. Place the event.
  e10u9_lomov_health: Lomov complains constantly about his body. Recall the symptoms he keeps listing.

concepts:
- code: cbse10e.u9.proposal
  title: The Proposal (Anton Chekhov)
  notes: |
    A one-act comic play set in 19th-century rural Russia. Ivan Vassilevitch Lomov, a nervous, hypochondriac
    landowner of 35, comes to propose to Natalya Stepanovna, the 25-year-old daughter of his neighbour Stepan
    Stepanovitch Chubukov. Chubukov is delighted. But before Lomov can propose, he and Natalya quarrel over who
    owns the Oxen Meadows; Chubukov joins in, and Lomov leaves with palpitations. When Natalya learns he came to
    propose, she screams for him to return. They then quarrel over whose dog is better, Lomov's Guess or
    Chubukov's Squeezer. Lomov faints; Chubukov hurriedly puts Natalya's hand in his and declares them engaged,
    and they keep quarrelling. Themes: satire on marriage for property and convenience; quarrelsome, materialistic
    upper class.
  explanations:
    text: 'Lomov comes to ask his neighbour''s daughter Natalya to marry him, but they keep fighting before he can say it: first over who owns a meadow, then over whose dog is better. Her father finally joins their hands while they are still arguing. Chekhov is making fun of people who marry for land and wealth.'
    visual: 'Picture a Russian drawing room: Lomov in an evening coat clutching his chest, Natalya and Chubukov shouting at him about ''Oxen Meadows'', and later two people arguing about dogs while champagne is being poured.'
    step_by_step: 'Step 1: Why Lomov came: to propose. Step 2: First quarrel: the Oxen Meadows. Step 3: Lomov leaves; Natalya learns why he came. Step 4: Second quarrel: Guess vs Squeezer. Step 5: Engagement amid quarrels: the satire.'
    real_world: Family arguments over a small strip of land are still common, and this play laughs at how such disputes can matter more to people than relationships.
  picture:
    kind: flow
    steps:
    - Lomov arrives to propose to Natalya
    - They quarrel over the Oxen Meadows
    - Lomov leaves; Natalya learns he came to propose
    - They quarrel over the dogs Guess and Squeezer
    - Chubukov joins their hands; they keep quarrelling
    alt: 'The plot of The Proposal: Lomov comes to propose, quarrels over the Oxen Meadows, returns, quarrels over the dogs, and is engaged while still arguing.'
  activity:
    type: sort
    prompt: 'The Proposal: what do they quarrel about?'
    bins:
    - Oxen Meadows
    - The dogs
    - Not a quarrel
    items:
    - label: Who owns the land
      bin: Oxen Meadows
      clue: A piece of land.
      why: Ownership of land is the Oxen Meadows quarrel.
    - label: Guess or Squeezer
      bin: The dogs
      clue: Two names.
      why: Guess and Squeezer are the two dogs.
    - label: Lomov came to propose
      bin: Not a quarrel
      clue: Why did he come?
      why: This is his purpose, not a quarrel.
    - label: Whose hunting animal is better
      bin: The dogs
      clue: Hunting.
      why: They argue about whose dog is better.
    - label: Chubukov joins the land fight
      bin: Oxen Meadows
      clue: The father.
      why: Chubukov takes Natalya's side over the meadows.
  lesson:
    - teach: '''The Proposal'' is a one-act farce by Anton Chekhov, set in rural Russia. Ivan Vassilevitch Lomov, a nervous, hypochondriac landowner of 35, arrives in evening dress at the home of his neighbour Stepan Stepanovitch Chubukov to ask for the hand of his daughter Natalya Stepanovna. Chubukov is delighted; he had long wished for it.'
      check:
        prompt: Why does Lomov visit Chubukov?
        options:
        - To propose to Natalya
        - To borrow money
        - To buy a dog
        answer: To propose to Natalya
        why: He comes in evening dress.
    - teach: Before Lomov can propose, he and Natalya quarrel over who owns the Oxen Meadows, a strip between their estates. Chubukov joins in; insults fly and Lomov is thrown out. When Natalya learns he came to propose, she becomes hysterical and demands he be brought back.
      picture:
        kind: flow
        steps:
        - Lomov comes to propose
        - 'Quarrel: Oxen Meadows'
        - Lomov sent away
        - Natalya wants him back
        - 'Quarrel: Guess vs Squeezer'
        - Hurried engagement
        alt: 'The plot of The Proposal: Lomov comes to propose, they quarrel over the Oxen Meadows, he is sent away, Natalya wants him back, they quarrel over the dogs, and are hurriedly engaged.'
      check:
        prompt: What was the first quarrel about?
        options:
        - The Oxen Meadows
        - Dogs
        - Money
        answer: The Oxen Meadows
        why: Land between their estates.
    - teach: 'Lomov returns but they now quarrel over whose dog is better: Lomov''s Guess or Natalya''s Squeezer. Lomov collapses; Chubukov thinks he is dead. When he recovers, Chubukov hurriedly joins their hands, and they begin quarrelling again. Chekhov satirises marriages arranged for property and the petty quarrels of the rich, and the comedy comes from exaggeration.'
      check:
        prompt: How does the play end?
        options:
        - They are engaged but go on quarrelling
        - Lomov leaves for good
        - Natalya marries someone else
        answer: They are engaged but go on quarrelling
        why: Chubukov calls for champagne amid the noise.
  items:
  - prompt: Who wrote 'The Proposal'?
    options:
    - Anton Chekhov
    - Leo Tolstoy
    - Guy de Maupassant
    - Oscar Wilde
    answer: Anton Chekhov
    difficulty: 1
    hints:
    - A Russian writer.
    - Known for short plays.
    solution: The play is by Anton Chekhov.
    mistakes:
      Guy de Maupassant: eng10_author
  - prompt: What was the first quarrel about?
    options:
    - Ownership of the Oxen Meadows
    - The dogs
    - Money for the wedding
    - A broken fence
    answer: Ownership of the Oxen Meadows
    difficulty: 1
    hints:
    - Land.
    - Between the two estates.
    solution: Lomov and Natalya first quarrel over who owns the Oxen Meadows.
    mistakes: {"The dogs": "e10_oxen_meadows"}
  - prompt: What were the names of the dogs they argued about?
    options:
    - Guess and Squeezer
    - Ink and Blink
    - Mustard and Custard
    - Rex and Max
    answer: Guess and Squeezer
    difficulty: 1
    hints:
    - Lomov's dog and Chubukov's dog.
    - Hunting dogs.
    solution: Lomov's Guess and Chubukov's Squeezer.
    mistakes: {"Mustard and Custard": "e10_dogs_names"}
  - prompt: How old was Lomov, according to the play?
    answer: '35'
    check: '35'
    difficulty: 2
    hints:
    - He says he is past the right age to marry.
    - Mid-thirties.
    solution: Lomov says he is 35.
    mistakes: {"25": "e10_lomov_age"}
  - prompt: Why did Lomov want to marry Natalya?
    options:
    - She was a good housekeeper and their lands were next to each other
    - He loved her deeply
    - She was very rich and famous
    - His parents forced him
    answer: She was a good housekeeper and their lands were next to each other
    difficulty: 2
    hints:
    - Practical reasons.
    - Not romantic love.
    solution: He wanted a quiet, regular life and saw her as a good housekeeper, and their estates adjoined.
    mistakes: {"He loved her deeply": "e10_lomov_reason"}
  - prompt: What does Chekhov satirise in the play?
    options:
    - Marriage for property and convenience among the rich
    - The army
    - City life
    - Religion
    answer: Marriage for property and convenience among the rich
    difficulty: 2
    hints:
    - What are they fighting over?
    - Land and status.
    solution: The play mocks wealthy families who see marriage as a matter of property.
    mistakes: {"The army": "e10_chekhov_satire"}
  - prompt: What does Chubukov first suspect when Lomov arrives in evening dress?
    options:
    - That Lomov has come to borrow money
    - That he is going to a wedding
    - That he is ill
    - That he wants the dogs
    answer: That Lomov has come to borrow money
    difficulty: 3
    hints:
    - Chubukov is suspicious and practical.
    - He says to himself that he won't give anything.
    solution: Chubukov thinks Lomov has come to borrow money and decides not to give any.
    mistakes:
      That he wants the dogs: e10u9_order
  - prompt: Which illness symptoms does Lomov often complain of?
    options:
    - Palpitations and a numb foot
    - A broken arm
    - Toothache only
    - Bad eyesight
    answer: Palpitations and a numb foot
    difficulty: 2
    hints:
    - His heart and his leg.
    - He is a hypochondriac.
    solution: Lomov keeps complaining of palpitations, a twitching eyebrow and a numb foot.
    mistakes:
      A broken arm: e10u9_lomov_health
  - prompt: What is a 'hypochondriac', as Lomov is?
    options:
    - Someone who constantly worries about being ill
    - A very brave person
    - A farmer
    - A hunter
    answer: Someone who constantly worries about being ill
    difficulty: 2
    hints:
    - Lomov always talks of his health.
    - It is about imagined illness.
    solution: A hypochondriac worries excessively about his health.
    mistakes:
      A very brave person: e10u9_lomov_health
  - prompt: What is Natalya doing when she enters?
    options:
    - Wearing a housework apron, shelling peas
    - Dancing
    - Reading a letter
    - Playing the piano
    answer: Wearing a housework apron, shelling peas
    difficulty: 3
    hints:
    - She is busy with work at home.
    - She apologises for her apron.
    solution: She comes in wearing an apron, saying they were shelling peas for drying.
    mistakes:
      Playing the piano: e10u9_people
  - prompt: Who is Natalya's dog?
    options:
    - Squeezer
    - Guess
    - Mustard
    - Custard
    answer: Squeezer
    difficulty: 1
    hints:
    - Lomov's dog is Guess.
    - Hers is the other one.
    solution: Natalya's dog is Squeezer; Lomov's is Guess.
    mistakes:
      Guess: e10u9_people
  - prompt: What does Lomov say is wrong with Squeezer?
    options:
    - 'He is overshot: his lower jaw is shorter than the upper'
    - He is blind
    - He is too old
    - He cannot bark
    answer: 'He is overshot: his lower jaw is shorter than the upper'
    difficulty: 3
    hints:
    - It is about the dog's jaw.
    - A fault in a hunting dog.
    solution: Lomov insists Squeezer is overshot, his lower jaw shorter than the upper.
    mistakes:
      He is blind: e10u9_order
  - prompt: Why does Chubukov hurriedly join the hands of Lomov and Natalya?
    options:
    - To settle the marriage before another quarrel breaks out
    - Because Lomov is rich in money
    - Because Natalya insisted on a dog
    - Because the priest arrived
    answer: To settle the marriage before another quarrel breaks out
    difficulty: 2
    hints:
    - Lomov has just recovered from fainting.
    - Chubukov is impatient.
    solution: Chubukov quickly makes them kiss and agree, to finish the matter.
    mistakes:
      Because the priest arrived: e10u9_order
  - prompt: What kind of play is 'The Proposal'?
    options:
    - A one-act farce
    - A tragedy in five acts
    - A historical drama
    - A musical
    answer: A one-act farce
    difficulty: 2
    hints:
    - It is short and funny.
    - Exaggerated comedy.
    solution: The Proposal is a one-act farce.
    mistakes:
      A tragedy in five acts: e10_chekhov_satire
  - prompt: Who is Chubukov?
    options:
    - Natalya's father, a landowner
    - Lomov's servant
    - A doctor
    - Natalya's brother
    answer: Natalya's father, a landowner
    difficulty: 1
    hints:
    - Lomov comes to his house.
    - He gives his daughter's hand.
    solution: Stepan Stepanovitch Chubukov is Natalya's father and Lomov's neighbour.
    mistakes:
      A doctor: e10u9_people
