# CBSE Class 10 English (NCERT First Flight), unit 7: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 7
title: Madam Rides the Bus · The Tale of Custard the Dragon
tips:
  e10_custard_brave: "The 'cowardly' dragon was the only one who did not run."
  e10_custard_coward: "Custard was the one who asked to be kept safe. What did the others call him for that?"
  e10_custard_message: "The boasters ran; the quiet one acted. What does that say about courage?"
  e10_dead_cow: "On the way out she had laughed at a young cow running ahead of the bus. What did she see on the way back?"
  e10_madam: "Valli was a small girl. The conductor was joking about how grown-up she behaved."
  e10_made_up: "Look for words that are not in any dictionary, made up to sound funny."
  e10_pirate: "The intruder had a pistol in each hand and a cutlass in his teeth."
  e10_valli_age: "Valli is a young girl of single digits. Look for her age at the very start of the story."
  e10_valli_drink: "Valli wanted to be treated like a grown-up passenger, not given treats like a child."
  e10_valli_secret: "Valli had planned the trip in secret. Did she tell anyone at home?"
  e10u7_valli_plan: Valli planned her trip carefully for months. Recall how she gathered information and money.
  e10u7_bus_sights: On the way to town Valli was delighted by everything outside the window. On the way back one sight changed her mood.
  e10u7_custard_pets: Belinda had four pets in the little white house. Match each name to its animal.
  e10u7_rhyme: Nash uses rhyming couplets and silly invented words. Read the line aloud and listen to the sound.

concepts:
- code: cbse10e.u7.madam
  title: Madam Rides the Bus (Vallikkannan)
  notes: |
    Valliammai (Valli), an eight-year-old girl in a village, longs to ride the bus she watches from her front
    door. She gathers information, saves coins for months, and learns the fare to the town is thirty paise one
    way (sixty paise for the round trip). One afternoon, while her mother sleeps, she boards the bus alone. The
    conductor teasingly calls her 'madam'; she behaves maturely, refuses to be treated as a child and insists on
    paying for her own ticket, and refuses the offer of a drink. She enjoys the view: canal, palm trees, hills,
    a young cow running in front of the bus. On the way back she sees the same cow lying dead by the road and
    is shaken; she loses her joy. Home before her mother wakes, she hears her mother talk about a relative's
    death and keeps her secret. Theme: a child's first encounter with the world, and with death.
  explanations:
    text: Eight-year-old Valli saves her coins for months to take a bus ride to town on her own. She enjoys the trip, standing up to the teasing conductor, until on the way back she sees a cow she'd laughed at earlier lying dead on the road. It is her first brush with death, and she comes home a little more grown up.
    visual: Picture Valli on the bus seat, face pressed to the window, a young cow running ahead of the bus; then the same road, on the way back, with the cow lying still by the roadside.
    step_by_step: 'Step 1: Her wish: to ride the bus. Step 2: Her plan: saving and gathering facts. Step 3: The ride: the conductor''s teasing and the joyful sights. Step 4: The turn: the dead cow. Step 5: Her secret, and what she learnt.'
    real_world: Many children remember a first trip alone, like going to a shop by themselves, as the day they felt grown up, just as Valli did.
  picture:
    kind: flow
    steps:
    - Valli, 8, longs to ride the bus
    - She saves coins and learns the fare
    - She rides alone; the conductor calls her 'madam'
    - She laughs at a cow running ahead of the bus
    - On the way back the cow lies dead; her joy fades
    alt: 'Valli''s bus ride: her wish, saving the fare, the joyful ride with the teasing conductor, the running cow, and the dead cow on the way back.'
  activity:
    type: number_line
    min: 0
    max: 100
    step: 5
    start: 0
    prompt: 'Madam Rides the Bus: the fare to town was 30 paise one way.'
    goals:
    - prompt: How much did Valli need for the round trip?
      target: 60
      mistakes:
      - when:
          v: 30
        say: 'That''s one way. A round trip is there and back: 30 + 30.'
      - when:
          v: 90
        say: 'That''s three trips. She went there and came back: 2 × 30.'
    - prompt: How much for one way?
      target: 30
      mistakes:
      - when:
          v: 60
        say: That's the round trip. One way is half of 60.
  lesson:
    - teach: '''Madam Rides the Bus'' by Vallikkannan is about Valli (Valliammai), an eight-year-old girl in a village. Her favourite pastime was standing at her front door watching the bus that ran between the village and the nearest town. She longed to ride it. By listening carefully to neighbours, she learnt that the town was six miles away, the trip took 45 minutes, and the fare was thirty paise one way.'
      check:
        prompt: How did Valli learn the details of the bus trip?
        options:
        - By listening to neighbours and asking questions
        - From a guidebook
        - From her teacher
        answer: By listening to neighbours and asking questions
        why: She gathered the facts quietly.
    - teach: Valli saved every coin she got, resisting sweets, toys and rides, until she had sixty paise. One afternoon, while her mother napped, she boarded the bus. The conductor jokingly called her 'madam'. She refused help to climb in, paid her fare, and sat by the window. She saw a canal, palm trees, green fields, distant mountains and a big blue sky.
      picture:
        kind: flow
        steps:
        - Watches the bus daily
        - Gathers facts
        - Saves 60 paise
        - Rides to town
        - Sees the dead cow
        - Home, keeps secret
        alt: 'Valli''s adventure: watching the bus, gathering facts, saving sixty paise, riding to town, seeing the dead cow on the way back, and keeping the trip secret at home.'
      check:
        prompt: How much money did Valli save for the round trip?
        options:
        - Sixty paise
        - Thirty paise
        - One rupee
        answer: Sixty paise
        why: Thirty paise each way.
    - teach: Valli did not get off in town; she stayed on and returned by the same bus. On the way back she saw a young cow that had been hit and killed by a vehicle, the same cow that had run in front of the bus earlier and made her laugh. This shocked her, and she lost the joy of the trip. That is the story's first meeting with death. At home she kept her journey a secret, though she nearly let it slip.
      check:
        prompt: Why did Valli lose her happiness on the way back?
        options:
        - She saw the young cow lying dead on the road
        - She lost her money
        - The bus broke down
        answer: She saw the young cow lying dead on the road
        why: It was the same cow that had amused her earlier.
  items:
  - prompt: How old was Valli?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - A young girl.
    - Under ten.
    solution: Valli was eight years old.
    mistakes: {"10": "e10_valli_age"}
  - prompt: The fare was thirty paise each way. How many paise did Valli need for the round trip?
    answer: '60'
    check: 30*2
    difficulty: 1
    hints:
    - Going and coming back.
    - 30 × 2.
    solution: 30 × 2 = 60 paise.
    mistakes:
      '30': eng10_read_again
  - prompt: Why did the conductor call Valli 'madam'?
    options:
    - Teasingly, because she acted grown-up and independent
    - Because she was a teacher
    - Because she was rich
    - Because she was his boss
    answer: Teasingly, because she acted grown-up and independent
    difficulty: 2
    hints:
    - She insisted on paying for herself.
    - He was amused.
    solution: Valli behaved like an adult, so the conductor jokingly called her madam.
    mistakes: {"Because she was a teacher": "e10_madam"}
  - prompt: Why did Valli refuse the drink the conductor offered?
    options:
    - She didn't want to be treated as a child or owe him
    - She wasn't thirsty at all
    - It was poisonous
    - She had no money
    answer: She didn't want to be treated as a child or owe him
    difficulty: 2
    hints:
    - Self-respect.
    - She was independent.
    solution: She was independent and didn't want favours from a stranger.
    mistakes: {"It was poisonous": "e10_valli_drink"}
  - prompt: What made Valli lose her happiness on the return trip?
    options:
    - She saw the cow lying dead by the road
    - She lost her money
    - The bus broke down
    - The conductor scolded her
    answer: She saw the cow lying dead by the road
    difficulty: 1
    hints:
    - She had laughed at it earlier.
    - Death.
    solution: Seeing the dead cow shocked her and took away her joy.
    mistakes: {"The bus broke down": "e10_dead_cow"}
  - prompt: What did Valli do when she got home?
    options:
    - She kept her trip a secret
    - She told her mother everything
    - She cried loudly
    - She went to the bus stop again
    answer: She kept her trip a secret
    difficulty: 1
    hints:
    - Her mother was talking.
    - No one knew.
    solution: She said nothing about the trip; it stayed her secret.
    mistakes: {"She told her mother everything": "e10_valli_secret"}
  - prompt: What was Valli's favourite pastime?
    options:
    - Standing at the front door watching the street
    - Reading books
    - Playing cricket
    - Drawing pictures
    answer: Standing at the front door watching the street
    difficulty: 1
    hints:
    - She had no playmates of her own age nearby.
    - The bus passed her door.
    solution: She loved standing at the doorway watching what happened in the street.
    mistakes:
      Reading books: eng10_read_again
  - prompt: How far was the town from Valli's village?
    options:
    - Six miles
    - Sixty miles
    - Two miles
    - Twenty miles
    answer: Six miles
    difficulty: 2
    hints:
    - The ride took about 45 minutes.
    - It is a short distance.
    solution: The town was six miles from the village.
    mistakes:
      Sixty miles: e10u7_valli_plan
  - prompt: How long did the bus take to reach the town?
    options:
    - Forty-five minutes
    - Three hours
    - Ten minutes
    - A whole day
    answer: Forty-five minutes
    difficulty: 2
    hints:
    - It was a short trip.
    - Less than an hour.
    solution: The trip took forty-five minutes one way.
    mistakes:
      Three hours: e10u7_valli_plan
  - prompt: How did Valli save money for the bus?
    options:
    - She resisted spending coins on sweets, toys and rides
    - She borrowed from her mother
    - She sold her toys
    - She worked in a shop
    answer: She resisted spending coins on sweets, toys and rides
    difficulty: 2
    hints:
    - It took self-control.
    - She kept every stray coin.
    solution: She saved every coin and did not buy peppermints or toys.
    mistakes:
      She borrowed from her mother: e10u7_valli_plan
  - prompt: When did Valli slip out to catch the bus?
    options:
    - In the afternoon, while her mother was napping
    - At midnight
    - Early morning before school
    - On a holiday with her family
    answer: In the afternoon, while her mother was napping
    difficulty: 2
    hints:
    - Nobody was watching her.
    - Her mother slept after lunch.
    solution: She left while her mother took her afternoon nap.
    mistakes:
      On a holiday with her family: e10u7_valli_plan
  - prompt: Which of these did Valli see from the bus window on the way to town?
    options:
    - A canal, palm trees and green fields
    - Snow and pine trees
    - The sea and ships
    - A desert with camels
    answer: A canal, palm trees and green fields
    difficulty: 2
    hints:
    - It is a South Indian village.
    - Water and greenery.
    solution: She saw a canal, palm trees, grassland, mountains and the sky.
    mistakes:
      The sea and ships: e10u7_bus_sights
  - prompt: How did Valli react when the elderly woman spoke to her on the bus?
    options:
    - She found her ugly and annoying and moved away
    - She hugged her
    - She cried
    - She gave her money
    answer: She found her ugly and annoying and moved away
    difficulty: 3
    hints:
    - Valli disliked her.
    - She did not want to be treated like a child.
    solution: Valli thought the woman was ugly, with big earlobes and paan-stained mouth, and kept away.
    mistakes:
      She hugged her: eng10_read_again
  - prompt: Why did Valli not get off the bus in town?
    options:
    - She had money only for the fare there and back
    - The town was closed
    - She was asleep
    - The conductor stopped her
    answer: She had money only for the fare there and back
    difficulty: 2
    hints:
    - Count her money.
    - Sixty paise covered the two rides.
    solution: She had no money to spend in town, so she rode back.
    mistakes:
      The town was closed: e10u7_valli_plan
  - prompt: What does the dead cow teach Valli?
    options:
    - That life can end suddenly; her first experience of death
    - That buses are slow
    - That cows are dangerous
    - That towns are dirty
    answer: That life can end suddenly; her first experience of death
    difficulty: 3
    hints:
    - Earlier the cow made her laugh.
    - Now it was lifeless.
    solution: The sight of the dead cow is Valli's first brush with death.
    mistakes:
      That buses are slow: e10u7_bus_sights
- code: cbse10e.u7.custard
  title: The Tale of Custard the Dragon (Ogden Nash)
  after:
  - cbse10e.u7.madam
  notes: |
    A humorous ballad. Belinda lives in a little white house with a black kitten Ink, a grey mouse Blink, a
    little yellow dog Mustard, and a 'realio, trulio' little pet dragon called Custard, who has sharp teeth,
    spikes, a mouth like a fireplace and a chimney for a nose. The others are brave and tease Custard as a
    coward because he cries for a nice safe cage. When a pirate climbs in through the window, Ink, Blink and
    Mustard flee, Belinda cries for help, but Custard jumps up, snorting, and gobbles the pirate. Afterwards
    the others still claim they are braver, and Custard again cries for a nice safe cage. Rhyme scheme aabb;
    repetition and made-up words ('realio, trulio'). Theme: true courage shows in action, not boasts.
  explanations:
    text: In this funny poem, Belinda's pets boast of their bravery and mock Custard the dragon as a coward. But when a pirate breaks in, the boasters run and hide while Custard fights and eats the pirate. Even then they keep boasting. Real courage shows in action, not words.
    visual: 'Picture a little white house: a black kitten, a grey mouse and a yellow dog bragging while a dragon sits in a corner asking for a cage. Then a pirate bursts in: the kitten hides in a hole, the mouse in a hole, the dog behind the door, and the dragon leaps forward.'
    step_by_step: 'Step 1: Meet the characters and their names. Step 2: Note who claims to be brave. Step 3: What happens when the pirate comes? Step 4: Who is truly brave? Step 5: Note the humour and rhyme.'
    real_world: People who boast loudly aren't always the ones who act when trouble comes; sometimes the quiet one steps up, like Custard.
  picture:
    kind: compare
    columns:
    - title: Claim to be brave
      points:
      - Belinda
      - Ink the kitten
      - Blink the mouse
      - Mustard the dog
    - title: Actually brave
      points:
      - Custard the dragon
      - Fights and eats the pirate
      - Yet still wants a safe cage
    alt: Belinda and her kitten, mouse and dog claim to be brave but flee from the pirate; Custard the dragon, called a coward, fights and eats the pirate.
  activity:
    type: sort
    prompt: 'The Tale of Custard the Dragon: who is it?'
    bins:
    - Ink
    - Blink
    - Mustard
    - Custard
    items:
    - label: A little black kitten
      bin: Ink
      clue: Named after dark writing liquid.
      why: Ink is the black kitten.
    - label: A little grey mouse
      bin: Blink
      clue: Rhymes with Ink.
      why: Blink is the grey mouse.
    - label: A little yellow dog
      bin: Mustard
      clue: Yellow like a sauce.
      why: Mustard is the yellow dog.
    - label: Cries for a nice safe cage
      bin: Custard
      clue: Teased as a coward.
      why: Custard asks for a safe cage, so the others call him a coward.
    - label: Gobbles the pirate
      bin: Custard
      clue: Who acts when the pirate comes?
      why: The others flee; Custard eats the pirate. True courage shows in action.
  lesson:
    - teach: '''The Tale of Custard the Dragon'' by Ogden Nash is a funny ballad. Belinda lived in a little white house with a little black kitten (Ink), a little grey mouse (Blink), a little yellow dog (Mustard), and a little pet dragon (Custard). Custard had big sharp teeth, spikes on top, a mouth like a fireplace and daggers on his toes, but he was a coward and cried for a ''nice safe cage''.'
      check:
        prompt: What was the name of Belinda's kitten?
        options:
        - Ink
        - Blink
        - Mustard
        answer: Ink
        why: Ink, the little black kitten.
    - teach: Belinda, Ink, Blink and Mustard all claimed to be brave and laughed at Custard. Then a pirate climbed in through the window with pistols and a cutlass. The 'brave' ones ran and hid. Custard jumped on the pirate, snorting like an engine, and gobbled him up.
      picture:
        kind: compare
        columns:
        - title: Claimed brave
          points:
          - Belinda, Ink, Blink, Mustard
          - laughed at Custard
          - hid from the pirate
        - title: Called a coward
          points:
          - Custard the dragon
          - cried for a safe cage
          - fought and ate the pirate
        alt: The pets who boasted of bravery hid from the pirate, while Custard, mocked as a coward, fought him.
      check:
        prompt: Who actually faced the pirate?
        options:
        - Custard
        - Mustard
        - Belinda
        answer: Custard
        why: The others hid.
    - teach: 'Afterwards, the others again boasted they were twice as brave as before, and Custard again cried for a nice safe cage. The poem uses rhyming couplets (aabb), repetition, and invented words like ''realio, trulio'' for comic effect. Its message: real courage shows in action, not in boasting; looks and talk can mislead.'
      check:
        prompt: What is the rhyme scheme of the poem?
        options:
        - aabb
        - abab
        - No rhyme
        answer: aabb
        why: Lines rhyme in pairs.
  items:
  - prompt: What was the name of Belinda's dragon?
    options:
    - Custard
    - Mustard
    - Ink
    - Blink
    answer: Custard
    difficulty: 1
    hints:
    - Title of the poem.
    - Mustard is the dog.
    solution: The dragon was called Custard.
    mistakes:
      Mustard: eng10_read_again
  - prompt: Why did the others laugh at Custard?
    options:
    - He cried for a nice safe cage, so they called him a coward
    - He was too small
    - He ate all the food
    - He could not breathe fire
    answer: He cried for a nice safe cage, so they called him a coward
    difficulty: 1
    hints:
    - They thought he was scared.
    - A safe cage.
    solution: They mocked Custard as a coward because he wanted a safe cage.
    mistakes: {"He could not breathe fire": "e10_custard_coward"}
  - prompt: Who climbed in through the window?
    options:
    - A pirate
    - A thief with a sack
    - A soldier
    - A lion
    answer: A pirate
    difficulty: 1
    hints:
    - With pistols and a cutlass.
    - Danger.
    solution: A pirate climbed in through the window.
    mistakes: {"A lion": "e10_pirate"}
  - prompt: What did Custard do to the pirate?
    options:
    - He gobbled the pirate up
    - He ran away
    - He called the police
    - He hid behind the door
    answer: He gobbled the pirate up
    difficulty: 1
    hints:
    - The bravest act.
    - Snorting like an engine.
    solution: Custard jumped at the pirate and ate him.
    mistakes: {"He ran away": "e10_custard_brave"}
  - prompt: Which phrase is an example of made-up words for humour?
    options:
    - Realio, trulio
    - Little white house
    - Black kitten
    - Safe cage
    answer: Realio, trulio
    difficulty: 2
    hints:
    - Not real English.
    - Funny rhyme.
    solution: '''Realio, trulio'' is invented to sound funny and emphasise that the dragon was real.'
    mistakes: {"Little white house": "e10_made_up"}
  - prompt: What is the message of the poem?
    options:
    - True courage is shown in action, not in boasting
    - Dragons are dangerous pets
    - Pirates are funny
    - Cats are the bravest animals
    answer: True courage is shown in action, not in boasting
    difficulty: 2
    hints:
    - Who boasted? Who acted?
    - Irony.
    solution: 'The boasters fled while the ''coward'' fought: courage is in deeds.'
    mistakes: {"Dragons are dangerous pets": "e10_custard_message"}
  - prompt: What kind of animal was Blink?
    options:
    - A little grey mouse
    - A little yellow dog
    - A black kitten
    - A dragon
    answer: A little grey mouse
    difficulty: 1
    hints:
    - Blink rhymes with Ink.
    - It is grey.
    solution: Blink was the little grey mouse.
    mistakes:
      A little yellow dog: e10u7_custard_pets
      A black kitten: e10u7_custard_pets
  - prompt: What was Mustard?
    options:
    - A little yellow dog
    - A little grey mouse
    - A kitten
    - A pirate's parrot
    answer: A little yellow dog
    difficulty: 1
    hints:
    - Mustard is a yellow sauce.
    - It was 'as sharp as mustard'.
    solution: Mustard was the little yellow dog.
    mistakes:
      A little grey mouse: e10u7_custard_pets
  - prompt: How is Custard's mouth described?
    options:
    - Like a fireplace
    - Like a cave
    - Like a cup
    - Like a flower
    answer: Like a fireplace
    difficulty: 2
    hints:
    - Dragons breathe fire.
    - Something in a house that holds fire.
    solution: '''His mouth was like a fireplace.'''
    mistakes:
      Like a cave: e10u7_rhyme
  - prompt: What did Custard cry for?
    options:
    - A nice safe cage
    - His mother
    - Food
    - A sword
    answer: A nice safe cage
    difficulty: 1
    hints:
    - He wanted protection.
    - Somewhere he could be locked in safely.
    solution: Custard cried for 'a nice safe cage'.
    mistakes:
      A sword: eng10_read_again
  - prompt: Which weapons did the pirate carry?
    options:
    - Pistols and a cutlass
    - A bow and arrows
    - A spear
    - A cannon
    answer: Pistols and a cutlass
    difficulty: 2
    hints:
    - A cutlass is a curved sword.
    - Plus guns in each hand.
    solution: The pirate had a pistol in each hand and a cutlass in his teeth.
    mistakes:
      A cannon: eng10_read_again
  - prompt: What did Mustard do when the pirate came?
    options:
    - Fled with a terrified yelp
    - Ran up to the pirate
    - Hid in the cage
    - Went out to call the police
    answer: Fled with a terrified yelp
    difficulty: 2
    hints:
    - The 'brave' dog fled.
    - A frightened dog sound.
    solution: Mustard fled with a terrified yelp.
    mistakes:
      Ran up to the pirate: e10u7_custard_pets
  - prompt: What did Belinda do when the pirate came?
    options:
    - Turned pale and cried for help
    - Hid in a cupboard
    - Hid under the bed
    - Climbed onto the roof
    answer: Turned pale and cried for help
    difficulty: 3
    hints:
    - She did not fight the pirate.
    - She shouted 'Help! Help!'
    solution: Belinda paled and cried 'Help! Help!'
    mistakes:
      Climbed onto the roof: e10u7_custard_pets
  - prompt: Which pair of words from the poem rhyme?
    options:
    - house / mouse
    - dragon / cage
    - pirate / window
    - kitten / dog
    answer: house / mouse
    difficulty: 1
    hints:
    - Read the first stanza.
    - Listen for the matching end sound.
    solution: '''little white house'' rhymes with ''little grey mouse''.'
    mistakes:
      dragon / cage: e10u7_rhyme
  - prompt: What does the ending, with the others boasting again, show?
    options:
    - Boasters do not change; true courage is shown, not claimed
    - Custard became proud
    - The pirate came back
    - Belinda sold Custard
    answer: Boasters do not change; true courage is shown, not claimed
    difficulty: 3
    hints:
    - Nothing really changes after the fight.
    - Think of the poem's message.
    solution: 'They claim to be braver than ever, while Custard stays modest: courage is in deeds.'
    mistakes:
      Custard became proud: e10u7_rhyme
