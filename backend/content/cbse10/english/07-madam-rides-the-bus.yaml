# CBSE Class 10 English (NCERT First Flight), unit 7: a prose lesson and its poem(s).
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 7
title: Madam Rides the Bus · The Tale of Custard the Dragon
tips:
  e10_custard_brave: "The 'cowardly' dragon was the only one who did not run."
  e10_custard_coward: "Custard was the one who asked to be kept safe. What did the others call him for that?"
  e10_custard_message: "The boasters ran; the quiet one acted. What does that say about courage?"
  e10_dead_cow: "On the way out she had laughed at a young cow running ahead of the bus. What did she see on the way back?"
  e10_madam: "Valli was a small girl. The conductor was joking about how grown-up she behaved."
  e10_made_up: "Look for words that are not in any dictionary, made up to sound funny."
  e10_pirate: "The intruder had a pistol in each hand and a cutlass in his teeth."
  e10_valli_age: "Valli is a young girl of single digits. Look for her age at the very start of the story."
  e10_valli_drink: "Valli wanted to be treated like a grown-up passenger, not given treats like a child."
  e10_valli_secret: "Valli had planned the trip in secret. Did she tell anyone at home?"

concepts:
- code: cbse10e.u7.madam
  title: Madam Rides the Bus (Vallikkannan)
  notes: |
    Valliammai (Valli), an eight-year-old girl in a village, longs to ride the bus she watches from her front
    door. She gathers information, saves coins for months, and learns the fare to the town is thirty paise one
    way (sixty paise for the round trip). One afternoon, while her mother sleeps, she boards the bus alone. The
    conductor teasingly calls her 'madam'; she behaves maturely, refuses to be treated as a child and insists on
    paying for her own ticket, and refuses the offer of a drink. She enjoys the view: canal, palm trees, hills,
    a young cow running in front of the bus. On the way back she sees the same cow lying dead by the road and
    is shaken; she loses her joy. Home before her mother wakes, she hears her mother talk about a relative's
    death and keeps her secret. Theme: a child's first encounter with the world, and with death.
  explanations:
    text: Eight-year-old Valli saves her coins for months to take a bus ride to town on her own. She enjoys the trip, standing up to the teasing conductor, until on the way back she sees a cow she'd laughed at earlier lying dead on the road. It is her first brush with death, and she comes home a little more grown up.
    visual: Picture Valli on the bus seat, face pressed to the window, a young cow running ahead of the bus; then the same road, on the way back, with the cow lying still by the roadside.
    step_by_step: 'Step 1: Her wish: to ride the bus. Step 2: Her plan: saving and gathering facts. Step 3: The ride: the conductor''s teasing and the joyful sights. Step 4: The turn: the dead cow. Step 5: Her secret, and what she learnt.'
    real_world: Many children remember a first trip alone, like going to a shop by themselves, as the day they felt grown up, just as Valli did.
  picture:
    kind: flow
    steps:
    - Valli, 8, longs to ride the bus
    - She saves coins and learns the fare
    - She rides alone; the conductor calls her 'madam'
    - She laughs at a cow running ahead of the bus
    - On the way back the cow lies dead; her joy fades
    alt: 'Valli''s bus ride: her wish, saving the fare, the joyful ride with the teasing conductor, the running cow, and the dead cow on the way back.'
  activity:
    type: number_line
    min: 0
    max: 100
    step: 5
    start: 0
    prompt: 'Madam Rides the Bus: the fare to town was 30 paise one way.'
    goals:
    - prompt: How much did Valli need for the round trip?
      target: 60
      mistakes:
      - when:
          v: 30
        say: 'That''s one way. A round trip is there and back: 30 + 30.'
      - when:
          v: 90
        say: 'That''s three trips. She went there and came back: 2 × 30.'
    - prompt: How much for one way?
      target: 30
      mistakes:
      - when:
          v: 60
        say: That's the round trip. One way is half of 60.
  items:
  - prompt: How old was Valli?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - A young girl.
    - Under ten.
    solution: Valli was eight years old.
    mistakes: {"10": "e10_valli_age"}
  - prompt: The fare was thirty paise each way. How many paise did Valli need for the round trip?
    answer: '60'
    check: 30*2
    difficulty: 1
    hints:
    - Going and coming back.
    - 30 × 2.
    solution: 30 × 2 = 60 paise.
    mistakes:
      '30': eng10_read_again
  - prompt: Why did the conductor call Valli 'madam'?
    options:
    - Teasingly, because she acted grown-up and independent
    - Because she was a teacher
    - Because she was rich
    - Because she was his boss
    answer: Teasingly, because she acted grown-up and independent
    difficulty: 2
    hints:
    - She insisted on paying for herself.
    - He was amused.
    solution: Valli behaved like an adult, so the conductor jokingly called her madam.
    mistakes: {"Because she was a teacher": "e10_madam"}
  - prompt: Why did Valli refuse the drink the conductor offered?
    options:
    - She didn't want to be treated as a child or owe him
    - She wasn't thirsty at all
    - It was poisonous
    - She had no money
    answer: She didn't want to be treated as a child or owe him
    difficulty: 2
    hints:
    - Self-respect.
    - She was independent.
    solution: She was independent and didn't want favours from a stranger.
    mistakes: {"It was poisonous": "e10_valli_drink"}
  - prompt: What made Valli lose her happiness on the return trip?
    options:
    - She saw the cow lying dead by the road
    - She lost her money
    - The bus broke down
    - The conductor scolded her
    answer: She saw the cow lying dead by the road
    difficulty: 1
    hints:
    - She had laughed at it earlier.
    - Death.
    solution: Seeing the dead cow shocked her and took away her joy.
    mistakes: {"The bus broke down": "e10_dead_cow"}
  - prompt: What did Valli do when she got home?
    options:
    - She kept her trip a secret
    - She told her mother everything
    - She cried loudly
    - She went to the bus stop again
    answer: She kept her trip a secret
    difficulty: 1
    hints:
    - Her mother was talking.
    - No one knew.
    solution: She said nothing about the trip; it stayed her secret.
    mistakes: {"She told her mother everything": "e10_valli_secret"}
- code: cbse10e.u7.custard
  title: The Tale of Custard the Dragon (Ogden Nash)
  after:
  - cbse10e.u7.madam
  notes: |
    A humorous ballad. Belinda lives in a little white house with a black kitten Ink, a grey mouse Blink, a
    little yellow dog Mustard, and a 'realio, trulio' little pet dragon called Custard, who has sharp teeth,
    spikes, a mouth like a fireplace and a chimney for a nose. The others are brave and tease Custard as a
    coward because he cries for a nice safe cage. When a pirate climbs in through the window, Ink, Blink and
    Mustard flee, Belinda cries for help, but Custard jumps up, snorting, and gobbles the pirate. Afterwards
    the others still claim they are braver, and Custard again cries for a nice safe cage. Rhyme scheme aabb;
    repetition and made-up words ('realio, trulio'). Theme: true courage shows in action, not boasts.
  explanations:
    text: In this funny poem, Belinda's pets boast of their bravery and mock Custard the dragon as a coward. But when a pirate breaks in, the boasters run and hide while Custard fights and eats the pirate. Even then they keep boasting. Real courage shows in action, not words.
    visual: 'Picture a little white house: a black kitten, a grey mouse and a yellow dog bragging while a dragon sits in a corner asking for a cage. Then a pirate bursts in: the kitten hides in a hole, the mouse in a hole, the dog behind the door, and the dragon leaps forward.'
    step_by_step: 'Step 1: Meet the characters and their names. Step 2: Note who claims to be brave. Step 3: What happens when the pirate comes? Step 4: Who is truly brave? Step 5: Note the humour and rhyme.'
    real_world: People who boast loudly aren't always the ones who act when trouble comes; sometimes the quiet one steps up, like Custard.
  picture:
    kind: compare
    columns:
    - title: Claim to be brave
      points:
      - Belinda
      - Ink the kitten
      - Blink the mouse
      - Mustard the dog
    - title: Actually brave
      points:
      - Custard the dragon
      - Fights and eats the pirate
      - Yet still wants a safe cage
    alt: Belinda and her kitten, mouse and dog claim to be brave but flee from the pirate; Custard the dragon, called a coward, fights and eats the pirate.
  activity:
    type: sort
    prompt: 'The Tale of Custard the Dragon: who is it?'
    bins:
    - Ink
    - Blink
    - Mustard
    - Custard
    items:
    - label: A little black kitten
      bin: Ink
      clue: Named after dark writing liquid.
      why: Ink is the black kitten.
    - label: A little grey mouse
      bin: Blink
      clue: Rhymes with Ink.
      why: Blink is the grey mouse.
    - label: A little yellow dog
      bin: Mustard
      clue: Yellow like a sauce.
      why: Mustard is the yellow dog.
    - label: Cries for a nice safe cage
      bin: Custard
      clue: Teased as a coward.
      why: Custard asks for a safe cage, so the others call him a coward.
    - label: Gobbles the pirate
      bin: Custard
      clue: Who acts when the pirate comes?
      why: The others flee; Custard eats the pirate. True courage shows in action.
  items:
  - prompt: What was the name of Belinda's dragon?
    options:
    - Custard
    - Mustard
    - Ink
    - Blink
    answer: Custard
    difficulty: 1
    hints:
    - Title of the poem.
    - Mustard is the dog.
    solution: The dragon was called Custard.
    mistakes:
      Mustard: eng10_read_again
  - prompt: Why did the others laugh at Custard?
    options:
    - He cried for a nice safe cage, so they called him a coward
    - He was too small
    - He ate all the food
    - He could not breathe fire
    answer: He cried for a nice safe cage, so they called him a coward
    difficulty: 1
    hints:
    - They thought he was scared.
    - A safe cage.
    solution: They mocked Custard as a coward because he wanted a safe cage.
    mistakes: {"He could not breathe fire": "e10_custard_coward"}
  - prompt: Who climbed in through the window?
    options:
    - A pirate
    - A thief with a sack
    - A soldier
    - A lion
    answer: A pirate
    difficulty: 1
    hints:
    - With pistols and a cutlass.
    - Danger.
    solution: A pirate climbed in through the window.
    mistakes: {"A lion": "e10_pirate"}
  - prompt: What did Custard do to the pirate?
    options:
    - He gobbled the pirate up
    - He ran away
    - He called the police
    - He hid behind the door
    answer: He gobbled the pirate up
    difficulty: 1
    hints:
    - The bravest act.
    - Snorting like an engine.
    solution: Custard jumped at the pirate and ate him.
    mistakes: {"He ran away": "e10_custard_brave"}
  - prompt: Which phrase is an example of made-up words for humour?
    options:
    - Realio, trulio
    - Little white house
    - Black kitten
    - Safe cage
    answer: Realio, trulio
    difficulty: 2
    hints:
    - Not real English.
    - Funny rhyme.
    solution: '''Realio, trulio'' is invented to sound funny and emphasise that the dragon was real.'
    mistakes: {"Little white house": "e10_made_up"}
  - prompt: What is the message of the poem?
    options:
    - True courage is shown in action, not in boasting
    - Dragons are dangerous pets
    - Pirates are funny
    - Cats are the bravest animals
    answer: True courage is shown in action, not in boasting
    difficulty: 2
    hints:
    - Who boasted? Who acted?
    - Irony.
    solution: 'The boasters fled while the ''coward'' fought: courage is in deeds.'
    mistakes: {"Dragons are dangerous pets": "e10_custard_message"}
