# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 5.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 14
title: Footprints without Feet (H. G. Wells)
tips:
  e10_bandages: "Griffin was not hurt. What would people see if he showed his face?"
  e10_footprints: "The boys saw prints appearing in the mud but no one making them."
  e10_griffin: "The title says 'footprints without feet'. Why would there be no feet to see?"
  e10_jaffers: "Griffin could only be seen through what he wore."
  e10_lawless: "'Lawless' means without respect for the law. What did Griffin do with his power?"
  e10f5_griffin: Griffin's invisibility helps him escape but ruins every chance of normal life. Follow his steps from London to Iping.
  e10f5_iping: At Iping, Griffin stays at the Coach and Horses inn, run by Mrs Hall. Recall who sees what there.

concepts:
- code: cbse10e.f5.griffin
  title: Footprints without Feet (H. G. Wells)
  notes: |
    Griffin, a brilliant but lawless scientist, discovers how to make the human body transparent and becomes
    invisible after swallowing certain drugs. In London, two boys see fresh muddy footprints appearing on a
    staircase with no one there. Griffin set fire to his landlord's house in revenge. Invisible in winter, he
    must be naked and is cold; he steals clothes from a store and a theatrical shop. He goes to the village of
    Iping and stays at an inn run by Mrs Hall, wrapped in bandages, dark glasses and a false nose. Short of
    money, he robs the clergyman's house. Mrs Hall finds his room empty and the furniture seems to attack her.
    When the constable Jaffers tries to arrest him, Griffin takes off his clothes, becomes invisible, knocks
    Jaffers out and escapes. Theme: science misused leads to misery.
  explanations:
    text: Griffin, a scientist, finds a way to make himself invisible but uses it for crime. He leaves mysterious footprints in London, steals clothes, frightens the people of the village of Iping, robs a clergyman and escapes arrest by vanishing. The story shows how a great discovery can be wasted by a person without morals.
    visual: Picture a man wrapped in bandages, dark glasses and a hat at a village inn, and then the same clothes collapsing empty to the floor as he vanishes before a stunned constable.
    step_by_step: 'Step 1: Griffin''s discovery: invisibility. Step 2: London: the footprints and stolen clothes. Step 3: Iping: the inn and Mrs Hall. Step 4: The clergyman''s robbery. Step 5: The escape from Jaffers.'
    real_world: Many inventions can help or harm depending on who uses them, which is the warning in Griffin's story.
  picture:
    kind: flow
    steps:
    - Griffin discovers how to become invisible
    - In London, footprints appear with no one there
    - He steals clothes and goes to Iping
    - He robs the clergyman's house
    - He vanishes to escape the constable
    alt: 'Griffin''s story: he becomes invisible, leaves footprints in London, steals clothes, goes to Iping, robs the clergyman and escapes by vanishing.'
  activity:
    type: order
    prompt: 'Footprints without Feet: put Griffin''s story in order.'
    steps:
    - Griffin finds how to become invisible
    - Two boys see muddy footprints on a staircase
    - He steals clothes from a shop
    - He stays at Mrs Hall's inn in Iping
    - He robs the clergyman's house
    - He knocks out Jaffers and escapes
    reasons:
      Two boys see muddy footprints on a staircase: He walks in London unseen, leaving prints.
      He steals clothes from a shop: Invisible means naked in winter, so he needs clothes.
      He stays at Mrs Hall's inn in Iping: Dressed and bandaged, he finds a room.
      He robs the clergyman's house: He runs short of money.
      He knocks out Jaffers and escapes: When the constable tries to arrest him, he undresses.
  lesson:
    - teach: '''Footprints without Feet'' by H. G. Wells is about Griffin, a brilliant but lawless scientist who discovered how to make the human body transparent, invisible, by swallowing certain rare drugs. In London, two boys were amazed to see fresh muddy footprints appearing on the steps, with no one there: Griffin had stepped in mud, barefoot and invisible.'
      check:
        prompt: What did the two boys see in London?
        options:
        - Fresh muddy footprints with no one in sight
        - A ghost in a white sheet
        - A flying car
        answer: Fresh muddy footprints with no one in sight
        why: Griffin was invisible and barefoot.
    - teach: Griffin had set fire to his landlord's house after a quarrel. Cold and naked, he hid in a big London store, took clothes, and later stole from a theatrical company. To hide his invisibility, he wrapped his face in bandages and wore dark glasses, a false nose, big bushy side-whiskers and a hat. He went to the village of Iping and stayed at the Coach and Horses inn, run by Mrs Hall.
      picture:
        kind: flow
        steps:
        - Becomes invisible
        - Sets landlord's house on fire
        - Hides in a London store
        - Disguised, goes to Iping
        - Escapes Jaffers
        alt: 'Griffin''s path: becomes invisible, burns his landlord''s house, hides in a London store, goes to Iping in disguise, and escapes the constable Jaffers.'
      check:
        prompt: Where did Griffin stay in Iping?
        options:
        - The Coach and Horses inn
        - Shotover Grange
        - A London store
        answer: The Coach and Horses inn
        why: Mrs Hall ran it.
    - teach: Mrs Hall saw furniture flying in his room and thought it was spirits. Griffin robbed the clergyman's house. When the constable Jaffers came to arrest him, Griffin took off his clothes and became fully invisible, knocked Jaffers down and escaped. Wells shows that science without ethics can make a man dangerous and lonely.
      check:
        prompt: How did Griffin escape Jaffers?
        options:
        - He took off his clothes and became fully invisible
        - He jumped on a horse
        - He hid in a cupboard
        answer: He took off his clothes and became fully invisible
        why: Only his clothes could be seen.
  items:
  - prompt: What did Griffin discover?
    options:
    - How to make the human body invisible
    - A new medicine for colds
    - How to fly
    - A new planet
    answer: How to make the human body invisible
    difficulty: 1
    hints:
    - Transparent body.
    - Footprints without feet.
    solution: 'Griffin found a way to make his body transparent: invisible.'
    mistakes: {"How to fly": "e10_griffin"}
  - prompt: What did the two boys in London see?
    options:
    - Fresh muddy footprints with no one there
    - A ghost
    - A flying man
    - A burning house
    answer: Fresh muddy footprints with no one there
    difficulty: 1
    hints:
    - Title of the story.
    - On a staircase.
    solution: They saw footprints appearing with no visible person.
    mistakes: {"A ghost": "e10_footprints"}
  - prompt: In which village did Griffin stay at an inn?
    options:
    - Iping
    - London
    - Paris
    - Shotover
    answer: Iping
    difficulty: 2
    hints:
    - Run by Mrs Hall.
    - A small English village.
    solution: He stayed at an inn in Iping run by Mrs Hall.
    mistakes:
      London: eng10_read_again
  - prompt: Why did Griffin wear bandages and dark glasses?
    options:
    - To hide his invisible face
    - Because he was injured
    - Because of an eye disease
    - To look fashionable
    answer: To hide his invisible face
    difficulty: 2
    hints:
    - Otherwise his head would seem empty.
    - Disguise.
    solution: Being invisible, he covered his head so that people would see a shape.
    mistakes: {"Because he was injured": "e10_bandages"}
  - prompt: How did Griffin escape the constable Jaffers?
    options:
    - He took off his clothes and became invisible
    - He jumped from a window
    - He bribed him
    - He ran into the forest
    answer: He took off his clothes and became invisible
    difficulty: 1
    hints:
    - Without clothes he couldn't be seen.
    - Then he knocked Jaffers out.
    solution: He threw off his clothes and fought invisibly.
    mistakes: {"He bribed him": "e10_jaffers"}
  - prompt: Why is Griffin called 'lawless'?
    options:
    - He used his discovery to commit crimes
    - He was a lawyer
    - He wrote laws
    - He lived in a jungle
    answer: He used his discovery to commit crimes
    difficulty: 2
    hints:
    - Fire, theft, assault.
    - No respect for rules.
    solution: 'He burnt a house, stole and attacked people: he had no respect for the law.'
    mistakes: {"He was a lawyer": "e10_lawless"}
  - prompt: How did Griffin become invisible?
    options:
    - By swallowing certain rare drugs
    - By wearing a magic ring
    - By a lightning strike
    - By a spell from a witch
    answer: By swallowing certain rare drugs
    difficulty: 1
    hints:
    - He was a scientist.
    - It was a chemical discovery.
    solution: Griffin swallowed rare drugs that made his body transparent.
    mistakes:
      By wearing a magic ring: e10f5_griffin
  - prompt: Why did Griffin set fire to his landlord's house?
    options:
    - Out of revenge, after the landlord tried to evict him
    - By accident while cooking
    - To keep warm
    - To hide his experiments from thieves
    answer: Out of revenge, after the landlord tried to evict him
    difficulty: 3
    hints:
    - They had quarrelled.
    - He was angry.
    solution: The landlord disliked him and tried to eject him; Griffin set the house on fire in revenge.
    mistakes:
      By accident while cooking: e10f5_griffin
  - prompt: Why did Griffin hide in a big London store?
    options:
    - It was winter and he needed warmth and clothes
    - To buy a gift
    - To meet a friend
    - To work there
    answer: It was winter and he needed warmth and clothes
    difficulty: 2
    hints:
    - Being invisible meant going naked.
    - It was cold.
    solution: Naked and cold in winter, he hid in a store to get clothes and warmth.
    mistakes:
      To buy a gift: e10f5_griffin
  - prompt: What did Mrs Hall think when she saw furniture flying in Griffin's room?
    options:
    - That the furniture was full of spirits
    - That there was an earthquake
    - That children were playing
    - That Griffin was dancing
    answer: That the furniture was full of spirits
    difficulty: 2
    hints:
    - She could not see anyone.
    - She was superstitious.
    solution: She believed spirits had entered the furniture.
    mistakes:
      That there was an earthquake: e10f5_iping
  - prompt: Whose house in Iping did Griffin rob?
    options:
    - The clergyman's
    - The doctor's
    - Mrs Hall's
    - The constable's
    answer: The clergyman's
    difficulty: 2
    hints:
    - A religious man.
    - Money disappeared from his desk.
    solution: Griffin robbed the clergyman's house of money.
    mistakes:
      Mrs Hall's: e10f5_iping
  - prompt: What did Griffin wear to hide his invisibility?
    options:
    - Bandages, dark glasses, a false nose and whiskers
    - A mask and cape
    - A doctor's coat
    - A soldier's uniform
    answer: Bandages, dark glasses, a false nose and whiskers
    difficulty: 2
    hints:
    - His face had to look solid.
    - He looked like an injured man.
    solution: He covered his face with bandages, glasses, a false nose and whiskers.
    mistakes:
      A mask and cape: e10f5_griffin
  - prompt: Why were the villagers of Iping curious about Griffin?
    options:
    - He was always bandaged, rude and kept to himself
    - He was very famous
    - He sang loudly
    - He was very friendly
    answer: He was always bandaged, rude and kept to himself
    difficulty: 2
    hints:
    - He looked strange.
    - He did not mix with people.
    solution: His bandaged face and unfriendly ways made people curious.
    mistakes:
      He was very friendly: e10f5_iping
  - prompt: Who wrote 'Footprints without Feet'?
    options:
    - H. G. Wells
    - Victor Canning
    - Ruskin Bond
    - Robert Arthur
    answer: H. G. Wells
    difficulty: 1
    hints:
    - He also wrote 'The Time Machine'.
    - A British science-fiction pioneer.
    solution: The story is from H. G. Wells's 'The Invisible Man'.
    mistakes:
      Ruskin Bond: eng10_author
  - prompt: What message does the story carry about science?
    options:
    - Science used without ethics can make a person dangerous
    - Science is always harmless
    - Scientists should live in villages
    - Invisibility is useful for everyone
    answer: Science used without ethics can make a person dangerous
    difficulty: 3
    hints:
    - Griffin misused his discovery.
    - He became a criminal.
    solution: Griffin's misuse shows science needs ethics.
    mistakes:
      Science is always harmless: e10f5_griffin
