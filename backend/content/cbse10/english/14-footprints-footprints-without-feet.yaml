# CBSE Class 10 English (NCERT Footprints without Feet, supplementary reader), chapter 5.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse10-eng
chapter: 14
title: Footprints without Feet (H. G. Wells)
concepts:
- code: cbse10e.f5.griffin
  title: Footprints without Feet (H. G. Wells)
  notes: |
    Griffin, a brilliant but lawless scientist, discovers how to make the human body transparent and becomes
    invisible after swallowing certain drugs. In London, two boys see fresh muddy footprints appearing on a
    staircase with no one there. Griffin set fire to his landlord's house in revenge. Invisible in winter, he
    must be naked and is cold; he steals clothes from a store and a theatrical shop. He goes to the village of
    Iping and stays at an inn run by Mrs Hall, wrapped in bandages, dark glasses and a false nose. Short of
    money, he robs the clergyman's house. Mrs Hall finds his room empty and the furniture seems to attack her.
    When the constable Jaffers tries to arrest him, Griffin takes off his clothes, becomes invisible, knocks
    Jaffers out and escapes. Theme: science misused leads to misery.
  explanations:
    text: Griffin, a scientist, finds a way to make himself invisible but uses it for crime. He leaves mysterious footprints in London, steals clothes, frightens the people of the village of Iping, robs a clergyman and escapes arrest by vanishing. The story shows how a great discovery can be wasted by a person without morals.
    visual: Picture a man wrapped in bandages, dark glasses and a hat at a village inn, and then the same clothes collapsing empty to the floor as he vanishes before a stunned constable.
    step_by_step: 'Step 1: Griffin''s discovery: invisibility. Step 2: London: the footprints and stolen clothes. Step 3: Iping: the inn and Mrs Hall. Step 4: The clergyman''s robbery. Step 5: The escape from Jaffers.'
    real_world: Many inventions can help or harm depending on who uses them, which is the warning in Griffin's story.
  picture:
    kind: flow
    steps:
    - Griffin discovers how to become invisible
    - In London, footprints appear with no one there
    - He steals clothes and goes to Iping
    - He robs the clergyman's house
    - He vanishes to escape the constable
    alt: 'Griffin''s story: he becomes invisible, leaves footprints in London, steals clothes, goes to Iping, robs the clergyman and escapes by vanishing.'
  items:
  - prompt: What did Griffin discover?
    options:
    - How to make the human body invisible
    - A new medicine for colds
    - How to fly
    - A new planet
    answer: How to make the human body invisible
    difficulty: 1
    hints:
    - Transparent body.
    - Footprints without feet.
    solution: 'Griffin found a way to make his body transparent: invisible.'
  - prompt: What did the two boys in London see?
    options:
    - Fresh muddy footprints with no one there
    - A ghost
    - A flying man
    - A burning house
    answer: Fresh muddy footprints with no one there
    difficulty: 1
    hints:
    - Title of the story.
    - On a staircase.
    solution: They saw footprints appearing with no visible person.
  - prompt: In which village did Griffin stay at an inn?
    options:
    - Iping
    - London
    - Paris
    - Shotover
    answer: Iping
    difficulty: 2
    hints:
    - Run by Mrs Hall.
    - A small English village.
    solution: He stayed at an inn in Iping run by Mrs Hall.
    mistakes:
      London: eng10_read_again
  - prompt: Why did Griffin wear bandages and dark glasses?
    options:
    - To hide his invisible face
    - Because he was injured
    - Because of an eye disease
    - To look fashionable
    answer: To hide his invisible face
    difficulty: 2
    hints:
    - Otherwise his head would seem empty.
    - Disguise.
    solution: Being invisible, he covered his head so that people would see a shape.
  - prompt: How did Griffin escape the constable Jaffers?
    options:
    - He took off his clothes and became invisible
    - He jumped from a window
    - He bribed him
    - He ran into the forest
    answer: He took off his clothes and became invisible
    difficulty: 1
    hints:
    - Without clothes he couldn't be seen.
    - Then he knocked Jaffers out.
    solution: He threw off his clothes and fought invisibly.
  - prompt: Why is Griffin called 'lawless'?
    options:
    - He used his discovery to commit crimes
    - He was a lawyer
    - He wrote laws
    - He lived in a jungle
    answer: He used his discovery to commit crimes
    difficulty: 2
    hints:
    - Fire, theft, assault.
    - No respect for rules.
    solution: 'He burnt a house, stole and attacked people: he had no respect for the law.'
