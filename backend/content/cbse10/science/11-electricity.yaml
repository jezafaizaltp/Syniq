# CBSE Class 10 Science (NCERT), chapter 11. Format: content/README.md.
subject: cbse10-sci
chapter: 11
title: Electricity
tips:
  c10s_time_seconds: 'Change the time to seconds first: 1 minute = 60 s.'
  c10s_ohm_rearrange: From V = IR, R = V ÷ I. Dividing by 0.5 doubles the number.
  c10s_meter_connection: Ammeters go in series; voltmeters go in parallel across the part.
  c10s_series_parallel: Adding them is for series. In parallel use 1/R = 1/R₁ + 1/R₂; the total is smaller than each.
  c10s_stretch_area: 'Stretching makes the wire thinner too, so the resistance rises twice: ×2 for length and ×2 for area.'
  c10s_kwh_units: 'Convert watts to kilowatts first: 100 W = 0.1 kW.'
  c10s_square_current: 'In H = I²Rt the current is squared: 3² = 9.'
  t10_cost_units: "Find units per day (kW × hours), then for 30 days, then multiply by the rate."
  t10_fuse: "When too much current flows, the fuse wire gets hot. What must it do to protect the circuit?"
  t10_kwh_joules: "1 kWh = 1000 W × 3600 s. Multiply both."
  t10_nichrome: "A heater needs a wire that gets hot and doesn't burn away. Which property makes a wire get hot?"
  t10_p_vi: "Power = voltage × current. Multiply."
  c10s11_q_it: Charge = current × time (Q = I t), with time in seconds. Which of the three do you need?
  c10s11_v_wq: 'Potential difference is work done per unit charge: V = W ÷ Q.'
  c10s11_resistivity: R = ρ l ÷ A. Longer wire, more resistance; thicker wire, less. Resistivity depends only on the material.
  c10s11_series_total: In series, the same current flows through every part and the resistances simply add.
  c10s11_parallel_v: In parallel, every branch gets the full voltage and the currents of the branches add up.
  c10s11_power_forms: Power can be written P = VI = I²R = V²/R. Pick the form that uses the numbers you have.
concepts:
- code: cbse10s.elec.ohm
  title: Current, potential difference and Ohm's law
  notes: |
    Electric current is the rate of flow of charge: I = Q/t, unit ampere (A); 1 C is the charge of about
    6.25 × 10¹⁸ electrons. Current is measured by an ammeter in series. Potential difference is the work done
    per unit charge: V = W/Q, unit volt (V); measured by a voltmeter in parallel. Ohm's law: at constant
    temperature, V = IR. Resistance R depends on length (R ∝ l), area (R ∝ 1/A) and material: R = ρl/A, where ρ
    is resistivity (Ω m). Metals have low ρ; alloys like nichrome have higher ρ and are used in heaters.
    In series, R = R₁ + R₂ + R₃ and the current is the same through each. In parallel, 1/R = 1/R₁ + 1/R₂ + 1/R₃,
    the voltage is the same across each, and the total resistance is less than the smallest one; house wiring
    is in parallel.
  explanations:
    text: 'Current is how much charge flows each second; voltage is the push that drives it; resistance is how hard the wire makes it. Ohm''s law links them: voltage equals current times resistance. Resistors in a line add up; resistors side by side give an easier path, so the total is smaller.'
    visual: 'Draw two pipes: in series the water must go through both narrow sections one after the other (harder); in parallel it can split between them (easier).'
    step_by_step: 'Step 1: Write what you know: V, I, R. Step 2: Combine resistors first: series add; parallel use 1/R = 1/R₁ + 1/R₂. Step 3: Use V = IR for the total. Step 4: Check units: volts, amperes, ohms.'
    real_world: Home appliances are wired in parallel so each gets the full 220 V and one can be switched off without the others going off.
  picture:
    kind: flow
    steps:
    - 'Two resistors: 6 Ω and 3 Ω'
    - 'Series: 6 + 3 = 9 Ω'
    - 'Parallel: 1/R = 1/6 + 1/3 = 1/2'
    - So R = 2 Ω, less than either one
    alt: 'Combining a 6 ohm and a 3 ohm resistor: 9 ohms in series, 2 ohms in parallel.'
  activity:
    type: formula
    prompt: Two resistors, R₁ and R₂, with a 12 V battery. In series R = R₁ + R₂; in parallel 1/R = 1/R₁ + 1/R₂. I = V ÷ R.
    inputs:
    - name: r1
      label: R₁
      min: 1
      max: 12
      step: 1
      start: 1
      unit: Ω
    - name: r2
      label: R₂
      min: 1
      max: 12
      step: 1
      start: 1
      unit: Ω
    outputs:
    - name: rs
      label: Series R
      expr: r1+r2
      unit: Ω
      places: 2
    - name: rp
      label: Parallel R
      expr: r1*r2/(r1+r2)
      unit: Ω
      places: 2
    - name: is
      label: Current in series
      expr: 12/(r1+r2)
      unit: A
      places: 2
    - name: ip
      label: Current in parallel
      expr: 12/(r1*r2/(r1+r2))
      unit: A
      places: 2
    goals:
    - prompt: Join two resistors in parallel to make 2 Ω.
      want:
        rp: 2
      hint: In parallel the total is less than either one. Try two equal resistors.
      mistakes:
      - when:
          r1: 1
          r2: 1
        say: '1 + 1 = 2 is series. In parallel, two 1 Ω paths give only 0.5 Ω: more paths, less resistance.'
      - when:
          rs: 2
        say: That's 2 Ω in series. Parallel is always smaller than the smallest resistor.
    - prompt: R₁ = 4 Ω. Choose R₂ so the series current is 1 A.
      want:
        r1: 4
        is: 1
      mistakes:
      - when:
          r1: 4
          r2: 12
        say: '12 Ω alone would give 1 A, but in series the 4 Ω adds on: 16 Ω gives only 0.75 A.'
      - when:
          r1: 4
          r2: 3
        say: In series the current depends on the total, R₁ + R₂. 1 A from 12 V needs 12 Ω in all.
  lesson:
    - teach: 'Electric current is the rate of flow of charge: I = Q ÷ t, measured in amperes (A). One coulomb is the charge of about 6 × 10¹⁸ electrons. An ammeter, connected in series, measures current. Conventional current flows from + to −, opposite to the electrons.'
      check:
        prompt: 10 C passes in 5 s. Current?
        options:
        - 2 A
        - 50 A
        - 0.5 A
        answer: 2 A
        why: 10 ÷ 5 = 2.
    - teach: 'Potential difference V = W ÷ Q, in volts, measured by a voltmeter in parallel. Ohm''s law: at constant temperature, V = IR, where R is resistance in ohms (Ω). Resistance depends on length, area and material: R = ρ l ÷ A, where ρ is resistivity.'
      picture:
        kind: compare
        columns:
        - title: More resistance
          points:
          - Longer wire
          - Thinner wire
          - Higher resistivity (nichrome)
        - title: Less resistance
          points:
          - Shorter wire
          - Thicker wire
          - Lower resistivity (copper)
        alt: Resistance is higher for a longer, thinner wire of high-resistivity material like nichrome, and lower for a shorter, thicker wire of copper.
      check:
        prompt: V = 12 V, I = 3 A. R?
        options:
        - 4 Ω
        - 36 Ω
        - 0.25 Ω
        answer: 4 Ω
        why: R = V ÷ I.
    - teach: 'Series: R = R₁ + R₂ + …; the current is the same everywhere and the voltages add. Parallel: 1/R = 1/R₁ + 1/R₂ + …; every branch has the full voltage and the total resistance is less than the smallest one. Houses are wired in parallel so each appliance gets full voltage and can be switched on its own.'
      check:
        prompt: 4 Ω and 4 Ω in parallel give…
        options:
        - 2 Ω
        - 8 Ω
        - 4 Ω
        answer: 2 Ω
        why: 1/R = 1/4 + 1/4 = 1/2.
  items:
  - prompt: A charge of 30 C flows through a wire in 1 minute. What is the current, in amperes?
    answer: '0.5'
    check: 30/60
    difficulty: 1
    hints:
    - I = Q/t with t in seconds.
    - t = 60 s.
    solution: I = 30 ÷ 60 = 0.5 A.
    mistakes:
      '30': c10s_time_seconds
  - prompt: A bulb draws 0.5 A from a 220 V supply. What is its resistance, in ohms?
    answer: '440'
    check: 220/Rational(1, 2)
    difficulty: 1
    hints:
    - R = V/I.
    - 220 ÷ 0.5.
    solution: R = 220 ÷ 0.5 = 440 Ω.
    mistakes:
      '110': c10s_ohm_rearrange
  - prompt: How is a voltmeter connected in a circuit?
    options:
    - In parallel with the component
    - In series with the component
    - Either way
    - Only across the battery
    answer: In parallel with the component
    difficulty: 1
    hints:
    - It measures the difference between two points.
    - Ammeter goes in series.
    solution: A voltmeter is connected in parallel across the component it measures.
    mistakes:
      In series with the component: c10s_meter_connection
  - prompt: Find the total resistance of 6 Ω and 3 Ω connected in parallel, in ohms.
    answer: '2'
    check: 1/(Rational(1, 6) + Rational(1, 3))
    difficulty: 2
    hints:
    - 1/R = 1/6 + 1/3.
    - = 1/2.
    solution: 1/R = 1/6 + 2/6 = 3/6 = 1/2, so R = 2 Ω.
    mistakes:
      '9': c10s_series_parallel
  - prompt: A wire has resistance 10 Ω. It is stretched to double its length (its area halves). What is the new resistance, in ohms?
    answer: '40'
    check: 10*2*2
    difficulty: 3
    hints:
    - R = ρl/A.
    - l doubles and A halves.
    solution: 'Step 1: Length ×2 makes R ×2. Step 2: Area ÷2 makes R ×2 again. Step 3: 10 × 4 = 40 Ω.'
    mistakes:
      '20': c10s_stretch_area
  - prompt: Why is nichrome used in electric heaters?
    options:
    - It has high resistivity and doesn't oxidise easily when hot
    - It has very low resistance
    - It is magnetic
    - It is a good insulator
    answer: It has high resistivity and doesn't oxidise easily when hot
    difficulty: 2
    hints:
    - Heating needs resistance.
    - Copper would just carry the current.
    solution: Nichrome's high resistivity produces heat, and it doesn't burn easily at high temperature.
    mistakes: {"It has very low resistance": "t10_nichrome", "It is a good insulator": "t10_nichrome"}
  - prompt: A current of 2 A flows for 5 minutes. How much charge flows, in coulombs?
    answer: '600'
    check: 2 * 5 * 60
    difficulty: 2
    hints:
    - Q = I t.
    - Change minutes to seconds.
    solution: Q = 2 × 300 = 600 C.
    mistakes:
      '10': c10s_time_seconds
  - prompt: How much work is done moving 4 C of charge across a potential difference of 6 V, in joules?
    answer: '24'
    check: 6 * 4
    difficulty: 2
    hints:
    - V = W ÷ Q.
    - So W = V × Q.
    solution: W = 6 × 4 = 24 J.
    mistakes:
      '1.5': c10s11_v_wq
      '0.67': c10s11_v_wq
  - prompt: Resistors of 2 Ω, 3 Ω and 5 Ω are in series. What is the total resistance, in ohms?
    answer: '10'
    check: 2 + 3 + 5
    difficulty: 1
    hints:
    - In series, resistances add.
    - Add all three.
    solution: 2 + 3 + 5 = 10 Ω.
    mistakes:
      '0.97': c10s_series_parallel
  - prompt: A 12 V battery is joined to 2 Ω and 4 Ω in series. What is the current, in amperes?
    answer: '2'
    check: 12 / (2 + 4)
    difficulty: 2
    hints:
    - Total R = 6 Ω.
    - I = V ÷ R.
    solution: I = 12 ÷ 6 = 2 A.
    mistakes:
      '6': c10s11_series_total
      '9': c10s11_series_total
  - prompt: Three 6 Ω resistors are in parallel. What is the total resistance, in ohms?
    answer: '2'
    check: 1 / (1/6 + 1/6 + 1/6)
    difficulty: 2
    hints:
    - 1/R = 1/6 + 1/6 + 1/6.
    - = 3/6.
    solution: 1/R = 1/2, so R = 2 Ω.
    mistakes:
      '18': c10s_series_parallel
      '6': c10s_series_parallel
  - prompt: In a parallel circuit with a 6 V battery, each of two branches has 3 Ω. What is the total current, in amperes?
    answer: '4'
    check: 6/3 + 6/3
    difficulty: 3
    hints:
    - Each branch gets the full 6 V.
    - Find each branch current, then add.
    solution: 'Each branch: 6 ÷ 3 = 2 A. Total = 4 A.'
    mistakes:
      '1': c10s11_parallel_v
      '2': c10s11_parallel_v
  - prompt: If a wire's length is halved (same material and thickness), what happens to its resistance?
    options:
    - It halves
    - It doubles
    - It stays the same
    - It becomes four times
    answer: It halves
    difficulty: 2
    hints:
    - R = ρ l ÷ A.
    - R is proportional to l.
    solution: Halving l halves R.
    mistakes:
      It doubles: c10s11_resistivity
  - prompt: What is the SI unit of resistivity?
    options:
    - Ω m
    - Ω
    - Ω/m
    - V/A
    answer: Ω m
    difficulty: 2
    hints:
    - ρ = R A ÷ l.
    - Ω × m² ÷ m.
    solution: ρ = RA/l has units Ω m² / m = Ω m.
    mistakes:
      Ω: c10s11_resistivity
      Ω/m: c10s11_resistivity
  - prompt: Why are household appliances connected in parallel, not series?
    options:
    - Each gets full voltage and can be switched separately
    - It uses less wire
    - It increases total resistance
    - Series is not allowed by law
    answer: Each gets full voltage and can be switched separately
    difficulty: 2
    hints:
    - In series, one switched-off device breaks the circuit.
    - And they would share the voltage.
    solution: Parallel wiring gives each appliance the full 220 V and independent switching.
    mistakes:
      It increases total resistance: c10s11_parallel_v
- code: cbse10s.elec.power
  title: Heating effect and electric power
  after:
  - cbse10s.elec.ohm
  notes: |
    When current flows through a resistor, energy is turned into heat: H = I²Rt (Joule's law of heating).
    Uses: electric iron, toaster, heater, bulb filament (tungsten, high melting point, in inert gas), and the
    fuse (a wire with a low melting point that melts and breaks the circuit if too much current flows).
    Electric power P = VI = I²R = V²/R, unit watt (W). Energy E = Pt; the commercial unit is the kilowatt-hour:
    1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J, the 'unit' on electricity bills.
  explanations:
    text: 'A current passing through a resistor makes it hot; that is how heaters, irons and filament bulbs work. Power tells you how quickly an appliance uses energy, and electricity bills count energy in kilowatt-hours: one kilowatt used for one hour.'
    visual: 'Draw an electricity bill: a 1000 W heater running for 3 hours uses 3 kWh, which is 3 units. At ₹6 a unit it costs ₹18.'
    step_by_step: 'Step 1: Find the power: P = VI, or I²R, or V²/R. Step 2: Energy = P × t. Step 3: For bills, use P in kW and t in hours to get kWh (units). Step 4: Multiply by the price per unit.'
    real_world: A fuse in a house circuit melts if a fault makes too much current flow, cutting the supply before wires overheat and cause a fire.
  picture:
    kind: bars
    bars:
    - label: LED bulb
      value: 10
    - label: Fan
      value: 60
    - label: Television
      value: 100
    - label: Iron
      value: 1000
    - label: Heater
      value: 2000
    unit: watts
    alt: 'Bar chart of typical power ratings: LED bulb 10 watts, fan 60, television 100, iron 1000, heater 2000.'
  activity:
    type: formula
    prompt: An appliance of power P on 220 V draws I = P ÷ 220. Its fuse must carry that current but melt soon above it.
    inputs:
    - name: p
      label: Power P
      min: 100
      max: 3000
      step: 100
      start: 100
      unit: W
    - name: fz
      label: Fuse rating
      min: 1
      max: 15
      step: 1
      start: 1
      unit: A
    outputs:
    - name: i
      label: Current drawn
      expr: p/220
      unit: A
      places: 2
    - name: sp
      label: Fuse rating − current
      expr: fz-p/220
      unit: A
      places: 2
    goals:
    - prompt: 'A 2000 W kettle: choose the smallest fuse that won''t blow.'
      want:
        p: 2000
        sp:
        - 0
        - 0.99
      hint: 'Work out the current: 2000 ÷ 220. The fuse must be just above it.'
      mistakes:
      - when:
          p: 2000
          fz:
          - 1
          - 9
        say: 'The kettle draws about 9.1 A, more than this fuse allows: it would melt every time you switch on.'
      - when:
          p: 2000
          fz:
          - 13
          - 15
        say: This fuse lets far more than 9.1 A through. In a fault the wires could overheat before it melts.
    - prompt: With a 5 A fuse, find the most powerful appliance (in 100 W steps) that won't blow it.
      want:
        fz: 5
        sp:
        - 0
        - 0.4
      mistakes:
      - when:
          fz: 5
          p:
          - 1200
          - 3000
        say: Over 1100 W the current passes 5 A, so the fuse melts. I = P ÷ 220.
      - when:
          fz: 5
          p:
          - 100
          - 1000
        say: That's safe, but a more powerful one still fits under 5 A.
  lesson:
    - teach: 'A current through a resistor produces heat. Joule''s law of heating: H = I²Rt. Doubling the current gives four times the heat. This heat is used in heaters, irons, toasters and filament bulbs (tungsten, high melting point), and in fuses.'
      check:
        prompt: If current doubles, heat produced becomes…
        options:
        - 4 times
        - 2 times
        - Half
        answer: 4 times
        why: Heat depends on I².
    - teach: 'Electric power is the rate of using energy: P = VI = I²R = V²/R, in watts. Energy used = power × time. Commercially, energy is measured in kilowatt hours (kWh), called units: 1 kWh = 3.6 × 10⁶ J.'
      picture:
        kind: flow
        steps:
        - Power in kW
        - × hours used
        - = kWh (units)
        - × rate per unit
        - = cost
        alt: 'To find the electricity cost: power in kilowatts times hours gives units (kWh); units times the rate per unit gives the cost.'
      check:
        prompt: A 2 kW heater runs 3 hours. Units used?
        options:
        - '6'
        - '5'
        - '1.5'
        answer: '6'
        why: 2 × 3 = 6 kWh.
    - teach: 'A fuse is a wire with a low melting point placed in series. If too much current flows, it heats up and melts, breaking the circuit. A fuse''s rating should be just above the normal current: I = P ÷ V. A 1100 W iron at 220 V draws 5 A.'
      check:
        prompt: Where is a fuse connected?
        options:
        - In series with the device
        - In parallel with the device
        - Across the switch
        answer: In series with the device
        why: All the current must pass through it.
  items:
  - prompt: An electric iron draws 4 A at 220 V. What is its power, in watts?
    answer: '880'
    check: 220*4
    difficulty: 1
    hints:
    - P = VI.
    - 220 × 4.
    solution: P = 220 × 4 = 880 W.
    mistakes: {"55": "t10_p_vi", "224": "t10_p_vi"}
  - prompt: A 100 W bulb is used for 10 hours. How many kWh (units) of energy does it use?
    answer: '1'
    check: Rational(100, 1000)*10
    difficulty: 1
    hints:
    - 'Change W to kW: 0.1 kW.'
    - E = P × t.
    solution: 'Step 1: 100 W = 0.1 kW. Step 2: 0.1 × 10 = 1 kWh.'
    mistakes:
      '1000': c10s_kwh_units
  - prompt: How many joules are in 1 kWh? Give the answer as a plain number.
    answer: '3600000'
    check: 1000*3600
    difficulty: 2
    hints:
    - 1 kW = 1000 W.
    - 1 h = 3600 s.
    solution: 1 kWh = 1000 × 3600 = 3 600 000 J (3.6 × 10⁶ J).
    mistakes: {"1000": "t10_kwh_joules", "3600": "t10_kwh_joules"}
  - prompt: A 2 Ω resistor carries 3 A for 10 s. How much heat is produced, in joules?
    answer: '180'
    check: 3**2*2*10
    difficulty: 2
    hints:
    - H = I²Rt.
    - 9 × 2 × 10.
    solution: H = 3² × 2 × 10 = 180 J.
    mistakes:
      '60': c10s_square_current
  - prompt: A 1.5 kW heater runs 2 hours a day for 30 days. At ₹6 per unit, what is the cost, in rupees?
    answer: '540'
    check: Rational(3, 2)*2*30*6
    difficulty: 3
    hints:
    - Energy per day = 1.5 × 2 = 3 kWh.
    - Then 30 days and ₹6 each.
    solution: 'Step 1: 3 kWh a day. Step 2: 3 × 30 = 90 units. Step 3: 90 × 6 = ₹540.'
    mistakes: {"18": "t10_cost_units", "540000": "c10s_kwh_units"}
  - prompt: Why does a fuse wire have a low melting point?
    options:
    - So it melts and breaks the circuit when too much current flows
    - So it heats the room
    - So it lasts longer
    - So it conducts better
    answer: So it melts and breaks the circuit when too much current flows
    difficulty: 2
    hints:
    - It is a safety device.
    - It is in series with the appliance.
    solution: If the current is too large, the fuse heats up, melts and breaks the circuit, protecting the wiring.
    mistakes: {"So it heats the room": "t10_fuse", "So it conducts better": "t10_fuse"}
  - prompt: A bulb is rated 60 W, 220 V. What is the energy it uses in 1 minute, in joules?
    answer: '3600'
    check: 60 * 60
    difficulty: 2
    hints:
    - Energy = power × time.
    - Time in seconds.
    solution: 60 × 60 = 3600 J.
    mistakes:
      '60': c10s_time_seconds
  - prompt: A heater of resistance 20 Ω draws 5 A. What is its power, in watts?
    answer: '500'
    check: 5**2 * 20
    difficulty: 2
    hints:
    - P = I²R.
    - 5² = 25.
    solution: P = 25 × 20 = 500 W.
    mistakes:
      '100': c10s_square_current
      '4': c10s11_power_forms
  - prompt: A 220 V supply runs a device of resistance 110 Ω. What is the power, in watts?
    answer: '440'
    check: 220**2 / 110
    difficulty: 2
    hints:
    - P = V²/R.
    - 220² = 48400.
    solution: P = 48400 ÷ 110 = 440 W.
    mistakes:
      '2': c10s11_power_forms
      '24200': c10s11_power_forms
  - prompt: A 1100 W iron runs on 220 V. What current does it draw, in amperes?
    answer: '5'
    check: 1100 / 220
    difficulty: 1
    hints:
    - P = VI.
    - I = P ÷ V.
    solution: I = 1100 ÷ 220 = 5 A.
    mistakes:
      '0.2': t10_p_vi
  - prompt: Four 250 W bulbs run 5 hours a day. How many units are used per day?
    answer: '5'
    check: 4 * 0.25 * 5
    difficulty: 2
    hints:
    - Total power = 1000 W = 1 kW.
    - kWh = kW × hours.
    solution: 1 kW × 5 h = 5 kWh.
    mistakes:
      '5000': c10s_kwh_units
      '1.25': c10s_kwh_units
  - prompt: Why is tungsten used for bulb filaments?
    options:
    - Its melting point is very high
    - It is cheap
    - It is a good insulator
    - It melts easily
    answer: Its melting point is very high
    difficulty: 1
    hints:
    - Filaments glow white-hot.
    - They must not melt.
    solution: Tungsten melts at about 3380 °C, so it can glow without melting.
    mistakes:
      It melts easily: t10_fuse
  - prompt: How much heat does 2 A produce in a 10 Ω resistor in 1 minute, in joules?
    answer: '2400'
    check: 2**2 * 10 * 60
    difficulty: 3
    hints:
    - H = I²Rt with t in seconds.
    - 4 × 10 × 60.
    solution: H = 4 × 10 × 60 = 2400 J.
    mistakes:
      '40': c10s_time_seconds
      '1200': c10s_square_current
  - prompt: Two bulbs, 100 W and 60 W, are joined in parallel to 220 V. What total power do they use, in watts?
    answer: '160'
    check: 100 + 60
    difficulty: 2
    hints:
    - In parallel each gets its rated voltage.
    - Powers add.
    solution: 'Each works at its rating: 100 + 60 = 160 W.'
    mistakes:
      '40': c10s11_parallel_v
  - prompt: What is the commercial unit of electrical energy?
    options:
    - Kilowatt hour
    - Watt
    - Joule per second
    - Volt
