# CBSE Class 10 Science (NCERT), chapter 9. Format: content/README.md.
subject: cbse10-sci
chapter: 9
title: Light – Reflection and Refraction
tips:
  c10s_focal_half: The focal length is half the radius of curvature, not double it.
  c10s_sign_convention: 'Use the sign convention: distances against the incoming light are negative. Check the sign of v.'
  c10s_bend_direction: "Light slows down in glass. Picture a cart rolling at a slant from smooth floor onto a rug: the wheel that hits the rug first slows first and the cart turns. Which way, compared with the normal?"
  c10s_index_ratio: Refractive index is speed in vacuum divided by speed in the medium, so it is more than 1.
  c10s_power_metres: 'Put the focal length in metres before taking 1/f: 50 cm = 0.5 m.'
  t10_concave_enlarged: "A concave mirror gives an erect, enlarged image only when the object is very close, inside the focus."
  t10_concave_lens: "A diverging lens always gives the same kind of image, wherever the object is."
  t10_convex_wide: "A rear-view mirror must show a wide area and an upright image. Which mirror always does that?"
  t10_focus_midway: "The focus is midway between the pole and the centre of curvature."
  t10_magnification_sign: "m = −v/u. Put in both negatives carefully: the image is real and inverted, so m is negative."
  t10_power_focal: "f = 1/P in metres. Convert to cm and keep the sign: negative power means a diverging lens."
  c10s9_laws: The angle of incidence equals the angle of reflection, and both are measured from the normal, not from the mirror surface.
  c10s9_mirror_formula: Use 1/v + 1/u = 1/f for mirrors. Put every distance in with its sign, then solve for the unknown.
  c10s9_lens_formula: For lenses it is 1/v − 1/u = 1/f. Watch the minus sign and the sign of u.
  c10s9_image_kind: Real images form in front of a mirror (or behind a lens) and are inverted; virtual images can't be caught on a screen and are upright.
  c10s9_magnification: Magnification m = image height ÷ object height. A negative m means the image is upside down; |m| bigger than 1 means bigger.
  c10s9_snell: Use n = sin i ÷ sin r, or n = speed in vacuum ÷ speed in the medium. Which one fits the numbers you have?
concepts:
- code: cbse10s.light.mirrors
  title: Reflection and spherical mirrors
  notes: |
    Laws of reflection: the angle of incidence equals the angle of reflection, and the incident ray, reflected
    ray and normal lie in one plane. Spherical mirrors: concave (converging) and convex (diverging). Pole P,
    centre of curvature C, principal focus F; focal length f = R/2. Concave mirror images depend on the
    object: beyond C → real, inverted, diminished between F and C; at C → at C, same size; between C and F →
    beyond C, enlarged; at F → at infinity; between F and P → virtual, erect, enlarged behind the mirror. A
    convex mirror always gives a virtual, erect, diminished image (wide view: rear-view mirrors). Sign
    convention: distances measured from the pole; along the incident light positive, against it negative;
    object distance u is negative; f is negative for concave, positive for convex. Mirror formula
    1/v + 1/u = 1/f; magnification m = h'/h = −v/u (negative m: real, inverted).
  explanations:
    text: Curved mirrors bend the pattern of reflected light. A concave mirror, curved in like a spoon's bowl, can make a real upside-down image or a magnified upright one depending on where the object is. A convex mirror, curved out, always shows a smaller upright image of a wide area.
    visual: 'Draw a concave mirror with the principal axis, F halfway between P and C. From the top of an object beyond C draw one ray parallel to the axis (it reflects through F) and one through F (it reflects parallel). Where they cross is the image: inverted and smaller.'
    step_by_step: 'Step 1: Write u (negative, object in front) and f (negative for concave). Step 2: Use 1/v = 1/f − 1/u. Step 3: Negative v means a real image in front; positive v means a virtual one behind. Step 4: m = −v/u.'
    real_world: Shop and car rear-view mirrors are convex so the driver sees a wide area behind, while dentists use concave mirrors to see an enlarged image of a tooth.
  picture:
    kind: geometry
    axes: false
    points:
      P:
      - 10
      - 5
      F:
      - 7
      - 5
      C:
      - 4
      - 5
      A:
      - 2
      - 7
      _B:
      - 2
      - 5
      A':
      - 5.2
      - 3.8
      _I:
      - 5.2
      - 5
      _M:
      - 10
      - 7
      _N:
      - 10
      - 3.8
      _T:
      - 10
      - 8.5
      _D:
      - 10
      - 1.5
    segments:
    - - _B
      - P
    - - _T
      - _D
    - - _B
      - A
    - - A
      - _M
    - - _M
      - A'
    - - A
      - _N
    - - _N
      - A'
    - - _I
      - A'
    alt: 'Ray diagram for a concave mirror (drawn as a straight line at P) with the object beyond C: a ray parallel to the axis reflects through F, a ray through F reflects parallel, and they meet between C and F in an inverted, smaller image.'
  activity:
    type: formula
    prompt: A concave mirror with f = −15 cm. Move the object (u is negative, in front of the mirror). 1/v + 1/u = 1/f, magnification m = −v/u.
    inputs:
    - name: u
      label: Object distance u
      min: -60
      max: -10
      step: 10
      start: -60
      unit: cm
    outputs:
    - name: v
      label: Image distance v
      expr: 1/(1/(-15)-1/u)
      unit: cm
      places: 1
    - name: m
      label: Magnification m
      expr: -(1/(1/(-15)-1/u))/u
      places: 2
    goals:
    - prompt: Make a real, inverted image the same size as the object (m = −1).
      want:
        m: -1
      hint: 'Real, inverted and same size: the object sits at C, twice the focal length.'
      mistakes:
      - when:
          u: -60
        say: Far beyond C the image is smaller (m = −1/3). Move the object in towards C.
      - when:
          u: -10
        say: Inside F the image is virtual, upright and enlarged (m = +3), like a shaving mirror.
      - when:
          u: -20
        say: Between F and C the image is real but enlarged (m = −3). Move out to C.
    - prompt: Now make an upright image 3 times as big.
      want:
        m: 3
      mistakes:
      - when:
          u: -20
        say: '3 times bigger but inverted (m = −3): a real image. An upright image needs the object inside F.'
      - when:
          u: -30
        say: At C the image is the same size and inverted.
  lesson:
    - teach: Light travels in straight lines. When it reflects, the angle of incidence equals the angle of reflection, both measured from the normal; the incident ray, reflected ray and normal lie in one plane. A plane mirror gives a virtual, upright image as far behind as the object is in front.
      check:
        prompt: A ray hits a mirror at 30° to the normal. Angle of reflection?
        options:
        - 30°
        - 60°
        - 90°
        answer: 30°
        why: i = r.
    - teach: 'Spherical mirrors: concave (curves inwards, converges light) and convex (bulges out, diverges light). Words: pole P (centre of the mirror), centre of curvature C, radius R, principal focus F, focal length f = R/2.'
      picture:
        kind: number_line
        from: -40
        to: 0
        step: 10
        points:
        - at: -40
          label: C
        - at: -20
          label: F
        - at: 0
          label: P (mirror)
        alt: 'Along the principal axis in front of a concave mirror of radius 40 cm: C at 40 cm, F at 20 cm, the pole P at the mirror.'
      check:
        prompt: R = 40 cm. Focal length?
        options:
        - 20 cm
        - 40 cm
        - 80 cm
        answer: 20 cm
        why: f = R/2.
    - teach: 'Mirror formula: 1/v + 1/u = 1/f, magnification m = −v/u = h′/h. Sign convention: measure from the pole; distances in the direction of incoming light are +, against it are −. Concave f is −, convex f is +. Concave mirrors: torches, shaving mirrors, dentists. Convex: vehicle rear-view mirrors.'
      check:
        prompt: For a concave mirror, f is…
        options:
        - Negative
        - Positive
        - Zero
        answer: Negative
        why: F is in front, against the light direction.
  items:
  - prompt: 'The focal length of a spherical mirror is related to its radius of curvature R by:'
    options:
    - f = R/2
    - f = 2R
    - f = R
    - f = R²
    answer: f = R/2
    difficulty: 1
    hints:
    - F is halfway between P and C.
    - Half of R.
    solution: The focus lies midway between the pole and the centre of curvature, so f = R/2.
    mistakes: {"f = 2R": "c10s_focal_half", "f = R": "t10_focus_midway"}
  - prompt: A concave mirror has a radius of curvature of 30 cm. What is its focal length, in cm (ignoring sign)?
    answer: '15'
    check: 30/2
    difficulty: 1
    hints:
    - f = R/2.
    - 30 ÷ 2.
    solution: f = 30 ÷ 2 = 15 cm.
    mistakes:
      '60': c10s_focal_half
  - prompt: Which mirror is used as a rear-view mirror in vehicles?
    options:
    - Convex
    - Concave
    - Plane
    - Any mirror
    answer: Convex
    difficulty: 1
    hints:
    - It gives a wide field of view.
    - Image is always erect.
    solution: Convex mirrors always give an erect, diminished image of a wide area.
    mistakes: {"Concave": "t10_convex_wide", "Plane": "t10_convex_wide"}
  - prompt: An object is placed 30 cm in front of a concave mirror of focal length 20 cm. Find the image distance v, in cm, using the sign convention.
    answer: '-60'
    check: 1/(-Rational(1, 20) + Rational(1, 30))
    difficulty: 2
    hints:
    - u = −30, f = −20.
    - 1/v = 1/f − 1/u.
    solution: 'Step 1: 1/v = −1/20 + 1/30 = −1/60. Step 2: v = −60 cm (a real image 60 cm in front).'
    mistakes:
      '60': c10s_sign_convention
  - prompt: For that image (u = −30 cm, v = −60 cm), what is the magnification m?
    answer: '-2'
    check: -(-60)/(-30)
    difficulty: 2
    hints:
    - m = −v/u.
    - −(−60)/(−30).
    solution: 'm = −(−60)/(−30) = −2: real, inverted, twice the size.'
    mistakes: {"2": "t10_magnification_sign", "0.5": "t10_magnification_sign"}
  - prompt: Where must an object be placed in front of a concave mirror to get an erect, enlarged image?
    options:
    - Between the pole and the focus
    - At the centre of curvature
    - Beyond C
    - At the focus
    answer: Between the pole and the focus
    difficulty: 2
    hints:
    - That's how a shaving mirror works.
    - The image is virtual.
    solution: Between P and F the image is virtual, erect and enlarged, behind the mirror.
    mistakes: {"At the centre of curvature": "t10_concave_enlarged", "Beyond C": "t10_concave_enlarged"}
  - prompt: A convex mirror has radius of curvature 24 cm. What is its focal length in cm, with sign?
    answer: '12'
    check: 24 / 2
    difficulty: 2
    hints:
    - f = R/2.
    - For a convex mirror, F is behind the mirror.
    solution: f = +24/2 = +12 cm.
    mistakes:
      '-12': c10s_sign_convention
      '48': c10s_focal_half
  - prompt: An object is 20 cm in front of a concave mirror of focal length 10 cm. Find v in cm, with sign.
    answer: '-20'
    check: 1 / (1/(-10) - 1/(-20))
    difficulty: 3
    hints:
    - u = −20, f = −10.
    - 1/v = 1/f − 1/u = −1/10 + 1/20.
    solution: '1/v = −1/20, so v = −20 cm: the image is at C, real and inverted.'
    mistakes:
      '20': c10s_sign_convention
      '-6.67': c10s9_mirror_formula
  - prompt: For that image (u = −20 cm, v = −20 cm), what is the magnification?
    answer: '-1'
    check: -(-20) / (-20)
    difficulty: 2
    hints:
    - m = −v/u.
    - Put both negatives in carefully.
    solution: 'm = −(−20)/(−20) = −1: same size, inverted.'
    mistakes:
      '1': c10s9_magnification
  - prompt: Which mirror is used by dentists to see large images of teeth?
    options:
    - Concave
    - Convex
    - Plane
    - None of these
    answer: Concave
    difficulty: 1
    hints:
    - They need an enlarged, upright image.
    - Which mirror can enlarge?
    solution: A concave mirror with the tooth inside F gives an enlarged, upright image.
    mistakes:
      Convex: t10_convex_wide
  - prompt: Where is the object placed in front of a concave mirror to get a real image at infinity?
    options:
    - At the focus F
    - At C
    - Beyond C
    - Between P and F
    answer: At the focus F
    difficulty: 2
    hints:
    - Rays from F become parallel after reflection.
    - Parallel rays meet at infinity.
    solution: Rays from F reflect parallel, so the image is at infinity (used in torches).
    mistakes:
      At C: c10s9_image_kind
  - prompt: An image formed by a mirror has m = +0.5. What kind of image is it?
    options:
    - Virtual, upright and half size
    - Real, inverted and half size
    - Real and upright
    - Virtual and twice the size
    answer: Virtual, upright and half size
    difficulty: 2
    hints:
    - Positive m means upright.
    - 0.5 means smaller.
    solution: 'm positive and less than 1: virtual, upright and diminished (as in a convex mirror).'
    mistakes:
      Real, inverted and half size: c10s9_magnification
  - prompt: A ray of light makes an angle of 35° with a plane mirror surface. What is the angle of reflection, in degrees?
    answer: '55'
    check: 90 - 35
    difficulty: 3
    hints:
    - Angles are measured from the normal.
    - The normal is at 90° to the mirror.
    solution: Angle of incidence = 90° − 35° = 55°, so the reflection is also 55°.
    mistakes:
      '35': c10s9_laws
  - prompt: An object 4 cm tall gives an image 12 cm tall and inverted. What is the magnification?
    answer: '-3'
    check: -12 / 4
    difficulty: 2
    hints:
    - m = h′/h.
    - Inverted means a negative image height.
    solution: m = −12/4 = −3.
    mistakes:
      '3': c10s9_magnification
      '-0.33': c10s9_magnification
  - prompt: Why are convex mirrors put up at sharp bends in hill roads?
    options:
    - It shows a wide field of view
    - It makes images bigger
    - It makes real images
    - It focuses light to a point
    answer: It shows a wide field of view
    difficulty: 1
    hints:
    - Convex mirrors bulge outwards.
    - They spread rays out.
    solution: Convex mirrors show a wide area with small upright images, so they are used for safety views.
    mistakes:
      It makes images bigger: t10_convex_wide
- code: cbse10s.light.lenses
  title: Refraction and lenses
  after:
  - cbse10s.light.mirrors
  notes: |
    Light bends (refracts) when it goes from one medium to another because its speed changes. Laws: incident
    ray, refracted ray and normal are in one plane; sin i / sin r is constant (Snell's law). Going into a denser
    medium the ray bends towards the normal. Refractive index n = c / v (speed of light in vacuum ÷ speed in the
    medium): water 1.33, glass 1.5, diamond 2.42. In a glass slab the emergent ray is parallel to the incident
    ray but shifted. Lenses: convex (converging) and concave (diverging); optical centre O, focus F, 2F. Convex
    lens images are like a concave mirror's (real and inverted unless the object is inside F, when it acts as a
    magnifier); a concave lens always gives a virtual, erect, diminished image. Lens formula 1/v − 1/u = 1/f;
    m = v/u; f is positive for convex and negative for concave. Power P = 1/f (f in metres), unit dioptre (D);
    convex positive, concave negative; powers of lenses in contact add.
  explanations:
    text: 'Light slows down in glass or water and bends as it enters. Lenses use this bending: a convex lens, thicker in the middle, brings rays together to a focus; a concave lens, thinner in the middle, spreads them out. The power of a lens tells you how strongly it bends light.'
    visual: Draw a convex lens with F on both sides. From the top of an object beyond 2F draw a ray parallel to the axis (it bends through F on the far side) and a ray through the centre (it goes straight). Where they meet is the real, inverted image.
    step_by_step: 'Step 1: Write u (negative) and f (positive for convex, negative for concave). Step 2: Use 1/v = 1/f + 1/u. Step 3: Positive v means a real image on the other side. Step 4: m = v/u. Step 5: P = 1/f with f in metres.'
    real_world: 'A pencil in a glass of water looks bent at the surface: light from the underwater part bends as it leaves the water, so the pencil appears raised.'
  picture:
    kind: geometry
    axes: false
    points:
      O:
      - 5
      - 5
      F:
      - 7
      - 5
      F':
      - 3
      - 5
      A:
      - 0.5
      - 6.5
      _B:
      - 0.5
      - 5
      _L:
      - 5
      - 6.5
      A':
      - 8.6
      - 3.8
      _I:
      - 8.6
      - 5
      _E:
      - 10
      - 5
      _U:
      - 5
      - 8.5
      _W:
      - 5
      - 1.5
    segments:
    - - _B
      - _E
    - - _U
      - _W
    - - _B
      - A
    - - A
      - _L
    - - _L
      - A'
    - - A
      - A'
    - - _I
      - A'
    alt: 'Ray diagram for a convex lens (drawn as a line through O) with the object beyond 2F: a ray parallel to the axis bends through F on the far side, a ray through the centre goes straight, and they meet in a smaller inverted image.'
  activity:
    type: formula
    prompt: 'Refractive index n = c ÷ v: the speed of light in air (3 × 10⁸ m/s) over its speed in the material.'
    inputs:
    - name: v
      label: Light's speed in it (× 10⁸ m/s)
      min: 1
      max: 3
      step: 0.05
      start: 3
    outputs:
    - name: n
      label: Refractive index n
      expr: 3/v
      places: 3
    goals:
    - prompt: Make glass, with n = 1.5.
      want:
        n: 1.5
      hint: n = 3 ÷ v, so v = 3 ÷ n.
      mistakes:
      - when:
          v: 1.5
        say: 'Speed 1.5 gives n = 2. n = c ÷ v, so the speed is c ÷ n: not the same number as n.'
      - when:
          v: 3
        say: 'At 3 × 10⁸ m/s light isn''t slowed at all: n = 1, like air or a vacuum.'
    - prompt: 'Make diamond, n ≈ 2.42: light bends most in it.'
      want:
        n:
        - 2.39
        - 2.45
      mistakes:
      - when:
          v:
          - 2.5
          - 3
        say: Faster light means a smaller n. Diamond bends light most, so light is slowest in it.
    - prompt: Make water, n ≈ 1.33.
      want:
        n:
        - 1.32
        - 1.34
      mistakes:
      - when:
          v:
          - 1.3
          - 1.35
        say: 'That uses n''s number as the speed. Light in water is slower than in air, but only a little: v = 3 ÷ 1.33.'
  lesson:
    - teach: 'Refraction is the bending of light when it passes from one medium to another, because its speed changes. Going into a denser medium (air → glass) it slows and bends towards the normal; coming out it bends away. Snell''s law: sin i / sin r = constant, the refractive index n.'
      picture:
        kind: bars
        unit: refractive index
        bars:
        - label: air
          value: 1.0003
        - label: water
          value: 1.33
        - label: glass
          value: 1.5
        - label: diamond
          value: 2.42
        alt: 'Refractive indices: air about 1, water 1.33, crown glass 1.5, diamond 2.42; the higher the value, the more light slows and bends.'
      check:
        prompt: In which does light travel slowest?
        options:
        - Diamond
        - Water
        - Air
        answer: Diamond
        why: Highest refractive index.
    - teach: 'Lenses: convex (thicker in the middle, converging) and concave (thinner in the middle, diverging). Lens formula: 1/v − 1/u = 1/f, magnification m = v/u. Convex f is +, concave f is −. A convex lens can give real inverted images or, with the object inside F, a virtual enlarged one (a magnifying glass).'
      check:
        prompt: A magnifying glass is a…
        options:
        - Convex lens
        - Concave lens
        - Plane glass
        answer: Convex lens
        why: Object inside F gives an enlarged image.
    - teach: 'Power of a lens P = 1/f, with f in metres; the unit is the dioptre (D). Convex lenses have + power, concave −. Lenses in contact add their powers: P = P₁ + P₂.'
      check:
        prompt: f = +0.25 m. Power?
        options:
        - +4 D
        - −4 D
        - +0.25 D
        answer: +4 D
        why: 1/0.25 = 4.
  items:
  - prompt: 'When light goes from air into glass, it bends:'
    options:
    - Towards the normal
    - Away from the normal
    - It doesn't bend
    - Back into the air
    answer: Towards the normal
    difficulty: 1
    hints:
    - Glass is optically denser.
    - Light slows down.
    solution: Going into a denser medium, light slows and bends towards the normal.
    mistakes:
      Away from the normal: c10s_bend_direction
  - prompt: Light travels at 3 × 10⁸ m/s in vacuum and 2 × 10⁸ m/s in glass. Find the refractive index of glass.
    answer: '1.5'
    check: 3*10**8/(2*10**8)
    difficulty: 1
    hints:
    - n = c / v.
    - 3 ÷ 2.
    solution: n = 3 × 10⁸ ÷ 2 × 10⁸ = 1.5.
    mistakes:
      '0.67': c10s_index_ratio
  - prompt: What is the power, in dioptres, of a convex lens of focal length 50 cm?
    answer: '2'
    check: 1/Rational(50, 100)
    difficulty: 1
    hints:
    - 'Convert to metres: 0.5 m.'
    - P = 1/f.
    solution: 'Step 1: f = 0.5 m. Step 2: P = 1/0.5 = +2 D.'
    mistakes:
      '0.02': c10s_power_metres
  - prompt: An object is 30 cm in front of a convex lens of focal length 15 cm. Find the image distance v, in cm.
    answer: '30'
    check: 1/(Rational(1, 15) - Rational(1, 30))
    difficulty: 2
    hints:
    - u = −30, f = +15.
    - 1/v = 1/f + 1/u.
    solution: 'Step 1: 1/v = 1/15 − 1/30 = 1/30. Step 2: v = +30 cm: real, on the other side, same size (object at 2F).'
    mistakes:
      '-30': c10s_sign_convention
  - prompt: A lens has power −2.5 D. What is its focal length, in cm?
    answer: '-40'
    check: 100/(-Rational(5, 2))
    difficulty: 2
    hints:
    - f = 1/P metres.
    - 1 ÷ (−2.5) = −0.4 m.
    solution: 'Step 1: f = 1/(−2.5) = −0.4 m. Step 2: = −40 cm, a concave lens.'
    mistakes: {"40": "t10_power_focal", "-0.4": "t10_power_focal"}
  - prompt: Which lens always forms a virtual, erect and diminished image?
    options:
    - Concave lens
    - Convex lens
    - Both
    - Neither
    answer: Concave lens
    difficulty: 2
    hints:
    - It spreads light out.
    - Diverging lens.
    solution: A concave (diverging) lens always gives a virtual, erect, diminished image.
    mistakes: {"Convex lens": "t10_concave_lens", "Both": "t10_concave_lens"}
  - prompt: A concave lens has focal length 20 cm. What is its power in dioptres, with sign?
    answer: '-5'
    check: 1 / (-0.2)
    difficulty: 2
    hints:
    - Change 20 cm to metres.
    - Concave means negative.
    solution: P = 1/(−0.2) = −5 D.
    mistakes:
      '5': t10_power_focal
      '-0.05': c10s_power_metres
  - prompt: Two lenses of power +3 D and −1 D are placed in contact. What is the total power in dioptres?
    answer: '2'
    check: 3 + (-1)
    difficulty: 2
    hints:
    - Powers in contact add.
    - Keep the signs.
    solution: P = 3 − 1 = +2 D.
    mistakes:
      '4': t10_power_focal
  - prompt: Light enters water (n = 1.33) from air. Its speed in water is about 3 × 10⁸ ÷ 1.33 m/s. Is it faster or slower than in air?
    options:
    - Slower
    - Faster
    - The same
    - It stops
    answer: Slower
    difficulty: 1
    hints:
    - Dividing by a number bigger than 1.
    - Denser medium.
    solution: v = c/n, so it is slower in water.
    mistakes:
      Faster: c10s_index_ratio
  - prompt: An object is 20 cm from a convex lens of focal length 10 cm. Find v in cm, with sign.
    answer: '20'
    check: 1 / (1/10 + 1/(-20))
    difficulty: 3
    hints:
    - u = −20, f = +10.
