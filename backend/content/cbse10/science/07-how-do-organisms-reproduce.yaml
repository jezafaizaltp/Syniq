# CBSE Class 10 Science (NCERT), chapter 7. Format: content/README.md.
subject: cbse10-sci
chapter: 7
title: How do Organisms Reproduce?
tips:
  c10s_flower_parts: "The stigma is the sticky top that receives pollen. The part that makes pollen sits on the stamens, at the tip of each filament."
  c10s_ovary_ovule: "After fertilisation, the ovules inside become seeds. What does the case around them, the ovary, become?"
  c10s_gamete_half: Gametes carry half the chromosomes so that the zygote gets the full number back.
  t10_barrier_method: "Only a method that stops body fluids passing can also block infections."
  t10_bryophyllum: "Look at a Bryophyllum leaf: small plantlets grow along its edges."
  t10_fission: "Splitting into two equal halves is one method; growing a bud is another. Which does Amoeba do?"
  t10_oviduct: "The egg leaves the ovary and travels down a tube. Where does it meet the sperm?"
  t10_placenta: "The embryo can't eat or breathe. Which organ links it to the mother's blood?"
  t10_regeneration: "Each piece regrows the parts it has lost. What is that called?"
  t10_rhizopus_spores: "Bread mould forms black blobs on stalks that release tiny cells that spread by air."
  t10_seedless: "Which fruit we buy has no seeds inside, so it must be grown another way?"
  t10_variation_use: "If the environment changes, would identical individuals or varied ones have a better chance that some survive?"
  c10s7_dna_copy: Reproduction copies DNA, and the copies are never perfect. Small changes in the copies are the source of variation.
  c10s7_methods: 'Match the method to the living thing: splitting into two, splitting into many, growing a bud, regrowing from pieces, spores, or new plants from roots, stems and leaves. What does this organism do?'
  c10s7_flower_role: Male parts make pollen; female parts receive it and hold the ovules. Is this part male or female, and what is its job?
  c10s7_pollination_kind: Self-pollination is pollen landing on the same flower; cross-pollination moves pollen to another plant, often by insects or wind.
  c10s7_two_plants: "Count the plants involved. Pollen staying on the same flower has one name; pollen travelling to a different plant has another."
  c10s7_male_female: Follow the path of sperm in males, and of the egg in females. Which organ does this job?
  c10s7_health: Think about which method blocks fluids, which changes hormones, and which blocks a tube.
concepts:
- code: cbse10s.repro.asexual
  title: Reproduction and asexual methods
  notes: |
    Reproduction makes new individuals; DNA copying passes on information, with small variations that help a
    species survive changes. Asexual reproduction needs one parent and gives near-identical offspring:
    fission (binary in Amoeba and bacteria, multiple in Plasmodium), fragmentation (Spirogyra), regeneration
    (Planaria, Hydra), budding (Hydra, yeast), spore formation (Rhizopus bread mould), vegetative propagation
    (Bryophyllum leaf buds, potato eyes, stem cuttings, layering, grafting). Vegetative propagation gives
    seedless plants like banana, orange and rose, and plants that flower sooner, all like the parent.
  explanations:
    text: Some living things make copies of themselves with no partner. A bacterium splits in two, Hydra grows a bud that breaks off, bread mould releases spores, and a potato grows new plants from its eyes. The young are almost exact copies of the parent.
    visual: Draw an Amoeba stretching, its nucleus splitting in two, and the cell pinching in the middle into two Amoebae. That is binary fission.
    step_by_step: 'Step 1: Count the parents: one means asexual. Step 2: Watch what happens: splitting (fission), breaking into pieces (fragmentation), a growth that drops off (budding), spores, or a new plant from a root, stem or leaf (vegetative).'
    real_world: Gardeners grow new rose and money plants from stem cuttings because each cutting will be exactly like the parent plant.
  picture:
    kind: compare
    columns:
    - title: Animals and microbes
      points:
      - 'Binary fission: Amoeba, bacteria'
      - 'Multiple fission: Plasmodium'
      - 'Budding: Hydra, yeast'
      - 'Regeneration: Planaria'
    - title: Plants and fungi
      points:
      - 'Fragmentation: Spirogyra'
      - 'Spores: Rhizopus'
      - 'Leaf buds: Bryophyllum'
      - 'Stem tubers: potato'
    alt: 'Asexual reproduction examples: fission, budding and regeneration in animals and microbes; fragmentation, spores and vegetative propagation in plants and fungi.'
  activity:
    type: sort
    prompt: Which kind of asexual reproduction is it?
    bins:
    - Fission
    - Fragmentation
    - Regeneration
    - Budding
    - Spore formation
    items:
    - label: Amoeba splits into two
      bin: Fission
      clue: Does one cell divide into equal parts?
      why: 'Binary fission: one cell splits into two.'
    - label: Plasmodium divides into many cells at once
      bin: Fission
      clue: Does one cell split into many?
      why: 'Multiple fission: one cell becomes many.'
    - label: Spirogyra breaks into pieces that each grow
      bin: Fragmentation
      clue: Does the body just break apart, each piece growing?
      why: 'Mature Spirogyra breaks up and each fragment grows: fragmentation.'
    - label: Planaria cut into pieces, each regrows a whole body
      bin: Regeneration
      clue: Do specialised cells rebuild the missing parts?
      why: 'Cut pieces rebuild the whole body from special cells: regeneration.'
    - label: Hydra grows a small outgrowth that breaks off
      bin: Budding
      clue: Does a small copy grow out of the parent?
      why: 'A bud grows from repeated cell division and detaches: budding.'
    - label: Yeast forms a bulge that becomes a new cell
      bin: Budding
      clue: Is the new one a small outgrowth?
      why: Yeast reproduces by budding.
    - label: Rhizopus releases tiny cells from knob-like ends
      bin: Spore formation
      clue: What are the knobs full of?
      why: The sporangia release spores that grow into new moulds.
    - label: Leishmania splits in a definite direction
      bin: Fission
      clue: One cell into two equal cells?
      why: Leishmania divides by binary fission, along a fixed plane.
  lesson:
    - teach: Reproduction makes new individuals and copies DNA. The copying is not perfect, so small variations appear. Variation helps a species survive if the environment changes. In asexual reproduction a single parent makes offspring, with no gametes.
      check:
        prompt: Why is variation useful?
        options:
        - Some may survive if conditions change
        - It makes everyone identical
        - It stops reproduction
        answer: Some may survive if conditions change
        why: Different individuals cope differently.
    - teach: 'Methods of asexual reproduction: fission (Amoeba splits into two; Plasmodium into many), fragmentation (Spirogyra breaks into pieces), regeneration (Planaria regrows from pieces), budding (Hydra, yeast), spore formation (Rhizopus), and vegetative propagation in plants (new plants from roots, stems or leaves).'
      picture:
        kind: compare
        columns:
        - title: Animals and microbes
          points:
          - 'Fission: Amoeba'
          - 'Budding: Hydra'
          - 'Regeneration: Planaria'
        - title: Plants and fungi
          points:
          - 'Fragmentation: Spirogyra'
          - 'Spores: Rhizopus'
          - 'Vegetative: potato, Bryophyllum'
        alt: 'Asexual methods: fission in Amoeba, budding in Hydra, regeneration in Planaria; fragmentation in Spirogyra, spores in Rhizopus, vegetative propagation in potato and Bryophyllum.'
      check:
        prompt: Hydra grows a small outgrowth that becomes a new Hydra. This is…
        options:
        - Budding
        - Fission
        - Spore formation
        answer: Budding
        why: A bud grows on the parent.
    - teach: Gardeners use vegetative propagation by layering, cutting and grafting. Plants grown this way flower and fruit sooner, and plants without seeds (banana, orange, rose, grapes) can be grown. Tissue culture grows many plants from a few cells in a lab.
      check:
        prompt: Which plant is usually grown from stem cuttings?
        options:
        - Rose
        - Mango from seed
        - Wheat
        answer: Rose
        why: Rose stems root easily.
  items:
  - prompt: 'Amoeba divides into two daughter cells. This is:'
    options:
    - Binary fission
    - Budding
    - Spore formation
    - Fragmentation
    answer: Binary fission
    difficulty: 1
    hints:
    - One cell splits in two.
    - '''Binary'' means two.'
    solution: Amoeba splits into two by binary fission.
    mistakes: {"Budding": "t10_fission", "Fragmentation": "t10_fission"}
  - prompt: 'Bryophyllum can grow new plants from:'
    options:
    - Buds on the edges of its leaves
    - Seeds only
    - Spores
    - Its flowers
    answer: Buds on the edges of its leaves
    difficulty: 1
    hints:
    - Vegetative propagation.
    - Leaf margins.
    solution: Bryophyllum leaves have buds along their edges that grow into new plants.
    mistakes: {"Seeds only": "t10_bryophyllum", "Spores": "t10_bryophyllum"}
  - prompt: 'Bread mould (Rhizopus) reproduces by:'
    options:
    - Spores
    - Budding
    - Binary fission
    - Seeds
    answer: Spores
    difficulty: 1
    hints:
    - Look for the black dots.
    - Sporangia.
    solution: Rhizopus forms sporangia that release spores.
    mistakes: {"Budding": "t10_rhizopus_spores", "Seeds": "t10_rhizopus_spores"}
  - prompt: Why is variation useful to a species?
    options:
    - Some individuals may survive if the environment changes
    - It makes all offspring identical
    - It stops reproduction
    - It makes organisms bigger
    answer: Some individuals may survive if the environment changes
    difficulty: 2
    hints:
    - Think of a sudden rise in temperature.
    - Different individuals cope differently.
    solution: Variation means some individuals may have traits that help them survive a change, so the species continues.
    mistakes: {"It makes all offspring identical": "t10_variation_use", "It makes organisms bigger": "t10_variation_use"}
  - prompt: Which plant is grown by vegetative propagation because it has no seeds?
    options:
    - Banana
    - Mango
    - Pea
    - Wheat
    answer: Banana
    difficulty: 2
    hints:
    - Cultivated varieties are seedless.
    - Grown from suckers.
    solution: Cultivated bananas are seedless and are grown from suckers.
    mistakes: {"Mango": "t10_seedless", "Pea": "t10_seedless"}
  - prompt: 'Planaria cut into pieces can grow into whole new animals. This is:'
    options:
    - Regeneration
    - Budding
    - Spore formation
    - Sexual reproduction
    answer: Regeneration
    difficulty: 2
    hints:
    - Each piece rebuilds the missing parts.
    - Specialised cells divide.
    solution: 'Each piece regrows the missing parts: regeneration.'
    mistakes: {"Budding": "t10_regeneration", "Sexual reproduction": "t10_regeneration"}
  - prompt: Plasmodium, the malaria parasite, divides into many daughter cells at once. This is…
    options:
    - Multiple fission
    - Binary fission
    - Budding
    - Regeneration
    answer: Multiple fission
    difficulty: 2
    hints:
    - Not two, but many.
    - Fission means splitting.
    solution: Splitting into many cells at once is multiple fission.
    mistakes:
      Binary fission: t10_fission
  - prompt: Spirogyra breaks into pieces, and each grows into a new filament. This is…
    options:
    - Fragmentation
    - Budding
    - Spore formation
    - Fertilisation
    answer: Fragmentation
    difficulty: 2
    hints:
    - It simply breaks up.
    - Each piece grows on its own.
    solution: Breaking into fragments that each grow is fragmentation.
    mistakes:
      Budding: c10s7_methods
  - prompt: Yeast reproduces mainly by…
    options:
    - Budding
    - Regeneration
    - Fragmentation
    - Seeds
    answer: Budding
    difficulty: 1
    hints:
    - Like Hydra.
    - A small outgrowth forms.
    solution: Yeast cells form small buds that separate into new cells.
    mistakes:
      Regeneration: c10s7_methods
  - prompt: Growing many plants from a few cells in a nutrient medium in a lab is called…
    options:
    - Tissue culture
    - Grafting
    - Layering
    - Pollination
    answer: Tissue culture
    difficulty: 2
    hints:
    - It happens in a lab.
    - It starts from cells, not cuttings.
    solution: Tissue culture grows plants from small pieces of tissue in a nutrient medium.
    mistakes:
      Grafting: c10s7_methods
  - prompt: Potato plants grow from the 'eyes' on a potato. Which part is the potato?
    options:
    - An underground stem
    - A root
    - A seed
    - A leaf
    answer: An underground stem
    difficulty: 2
    hints:
    - Eyes are buds.
    - Buds grow on stems, not roots.
    solution: A potato tuber is a swollen underground stem with buds (eyes).
    mistakes:
      A seed: t10_seedless
  - prompt: What is one advantage of vegetative propagation?
    options:
    - Plants bear flowers and fruit sooner
    - It always makes new varieties
    - It needs seeds
    - It needs two parents
    answer: Plants bear flowers and fruit sooner
    difficulty: 2
    hints:
    - It starts from a grown part, not a seed.
    - So it saves time.
    solution: Vegetatively grown plants flower and fruit earlier and are copies of the parent.
    mistakes:
      It always makes new varieties: c10s7_dna_copy
  - prompt: Why are offspring from asexual reproduction very similar to the parent?
    options:
    - They get a copy of the DNA of a single parent
    - They come from two parents
    - They eat the same food
    - They live in the same place
    answer: They get a copy of the DNA of a single parent
    difficulty: 2
    hints:
    - How many parents?
    - Whose DNA do they get?
    solution: Only one parent's DNA is copied, with tiny changes, so offspring are very similar.
    mistakes:
      They come from two parents: c10s7_dna_copy
  - prompt: What makes it possible for spores of Rhizopus to survive in bad conditions?
    options:
    - Thick walls
    - Wings
    - Roots
    - Leaves
    answer: Thick walls
    difficulty: 2
    hints:
    - Spores wait until it is moist again.
    - What protects them?
    solution: Spores have thick walls that protect them until conditions are right.
    mistakes:
      Wings: t10_rhizopus_spores
  - prompt: Which organism can regrow its whole body from a small piece?
    options:
    - Planaria
    - Human
    - Dog
    - Mango tree seed
    answer: Planaria
    difficulty: 1
    hints:
    - A simple flatworm.
    - Hydra can do it too.
    solution: Planaria regenerates whole bodies from fragments.
    mistakes:
      Human: t10_regeneration
- code: cbse10s.repro.sexual
  title: Sexual reproduction in plants and humans
  after:
  - cbse10s.repro.asexual
  notes: |
    Sexual reproduction joins a male and a female germ cell (gametes), each with half the chromosomes, into a
    zygote; it creates more variation. Flowers: stamens (anther makes pollen) are male; the pistil (stigma,
    style, ovary with ovules) is female. Pollination carries pollen to a stigma: self- or cross-pollination
    (by wind, insects, water). A pollen tube grows to the ovule; fertilisation makes a zygote; the ovule becomes
    a seed and the ovary becomes the fruit. Humans: puberty brings changes; testes make sperm and testosterone;
    ovaries release an egg each month and make oestrogen. Fertilisation happens in the oviduct; the embryo
    implants in the uterus and is fed through the placenta. Without fertilisation the uterus lining breaks down
    (menstruation). Reproductive health: barrier, hormonal and surgical methods of contraception; condoms also
    protect against sexually transmitted infections such as HIV-AIDS.
  explanations:
    text: In sexual reproduction two parents each give half the instructions, so the young are a new mix. In flowering plants pollen carries the male cell to the female part; in humans a sperm and an egg join to make one cell that grows into a baby.
    visual: 'Draw a flower cut in half: stamens around the edge with pollen-filled anthers, a pistil in the middle. Draw a pollen grain landing on the stigma and a tube growing down the style into the ovary to reach an ovule.'
    step_by_step: 'Step 1: Pollen is made in the anther. Step 2: Pollination: pollen reaches a stigma. Step 3: A pollen tube grows to the ovule. Step 4: Fertilisation forms a zygote. Step 5: Ovule → seed, ovary → fruit.'
    real_world: 'Bees visiting mustard flowers for nectar carry pollen from flower to flower: they make cross-pollination happen, which is why farmers value them.'
  picture:
    kind: flow
    steps:
    - Anther makes pollen
    - 'Pollination: pollen lands on the stigma'
    - Pollen tube grows down the style
    - Fertilisation in the ovule makes a zygote
    - Ovule becomes the seed; ovary becomes the fruit
    alt: 'From pollen to fruit: pollination, pollen tube growth, fertilisation, then the ovule becomes a seed and the ovary a fruit.'
  activity:
    type: order
    prompt: Put the steps from pollen to fruit in a flowering plant in order.
    steps:
    - Pollen grains form in the anther
    - 'Pollen lands on a stigma: pollination'
    - A pollen tube grows down the style to the ovule
    - 'The male gamete fuses with the egg: fertilisation'
    - The ovule becomes a seed and the ovary a fruit
    reasons:
      'Pollen lands on a stigma: pollination': Pollen has to be made in the anther before it can be carried.
      A pollen tube grows down the style to the ovule: The tube grows only after pollen reaches the stigma.
      'The male gamete fuses with the egg: fertilisation': The male gamete travels down the pollen tube to reach the egg.
      The ovule becomes a seed and the ovary a fruit: Seeds and fruit form only after fertilisation.
  lesson:
    - teach: Sexual reproduction joins two gametes, each with half the chromosomes, so the zygote has the full number and new mixes of traits. In a flower, the stamen (anther + filament) makes pollen; the pistil (stigma, style, ovary) holds the ovules.
      picture:
        kind: compare
        columns:
        - title: Stamen (male)
          points:
          - Anther makes pollen
          - Filament holds it up
        - title: Pistil (female)
          points:
          - Stigma catches pollen
          - Style is the tube
          - Ovary holds ovules
        alt: 'Male stamen: anther makes pollen on a filament; female pistil: sticky stigma, style, and ovary holding the ovules.'
      check:
        prompt: Which part catches pollen?
        options:
        - Stigma
        - Anther
        - Filament
        answer: Stigma
        why: It is sticky.
    - teach: 'Pollination moves pollen to the stigma (self or cross). A pollen tube grows down the style to the ovule, and the male gamete fuses with the egg: fertilisation. The zygote becomes the embryo, the ovule becomes the seed, and the ovary becomes the fruit.'
      check:
        prompt: After fertilisation, the ovule becomes…
        options:
        - The seed
        - The fruit
        - The flower
        answer: The seed
        why: The ovary becomes the fruit.
    - teach: 'In humans, puberty brings the body''s reproductive system to maturity. Testes make sperm and testosterone; sperm travel through the vas deferens. Ovaries release one egg a month; it moves down the oviduct, where fertilisation happens, and the embryo implants in the uterus and gets food through the placenta. Contraception methods: barrier (condom), hormonal (pills), copper-T, and surgery.'
      check:
        prompt: Where does the embryo grow?
        options:
        - Uterus
        - Ovary
        - Oviduct
        answer: Uterus
        why: It implants in the uterus wall.
  items:
  - prompt: Which part of a flower makes pollen?
    options:
    - Anther
    - Stigma
    - Ovary
    - Petal
    answer: Anther
    difficulty: 1
    hints:
    - Part of the stamen.
    - Male part.
    solution: The anther, at the top of the stamen, makes pollen grains.
    mistakes:
      Stigma: c10s_flower_parts
  - prompt: 'After fertilisation, the ovary of a flower becomes:'
    options:
    - The fruit
    - The seed
    - The petal
    - The pollen
    answer: The fruit
    difficulty: 1
    hints:
    - The ovule becomes the seed.
    - What holds the seeds?
    solution: The ovary develops into the fruit, and the ovules inside become seeds.
    mistakes:
      The seed: c10s_ovary_ovule
  - prompt: A human body cell has 46 chromosomes. How many does a sperm cell have?
    answer: '23'
    check: 46/2
    difficulty: 2
    hints:
    - Gametes have half.
    - 46 ÷ 2.
    solution: 'Step 1: Gametes carry half the chromosomes. Step 2: 46 ÷ 2 = 23.'
    mistakes:
      '46': c10s_gamete_half
  - prompt: Where does fertilisation usually take place in the human female?
    options:
    - Oviduct (fallopian tube)
    - Uterus
    - Ovary
    - Vagina
    answer: Oviduct (fallopian tube)
    difficulty: 2
    hints:
    - The egg travels from the ovary.
    - The embryo then moves to the uterus.
    solution: Sperm meet the egg in the oviduct. The zygote then moves to the uterus and implants.
    mistakes: {"Uterus": "t10_oviduct", "Ovary": "t10_oviduct"}
  - prompt: What does the placenta do?
    options:
    - Passes food and oxygen from mother to embryo and removes wastes
    - Makes eggs
    - Produces sperm
    - Stores urine
    answer: Passes food and oxygen from mother to embryo and removes wastes
    difficulty: 2
    hints:
    - It joins the embryo to the uterus wall.
    - Exchange of materials.
    solution: The placenta lets glucose and oxygen pass from the mother's blood to the embryo, and wastes pass back.
    mistakes: {"Makes eggs": "t10_placenta", "Stores urine": "t10_placenta"}
  - prompt: Which method of contraception also protects against sexually transmitted infections?
    options:
    - Condom
    - Oral pills
    - Copper-T
    - Surgery
    answer: Condom
    difficulty: 2
    hints:
    - It is a barrier.
    - It stops body fluids mixing.
    solution: Condoms are a barrier, so they also reduce the spread of infections such as HIV.
    mistakes: {"Oral pills": "t10_barrier_method", "Copper-T": "t10_barrier_method"}
  - prompt: Pollen from one flower reaches the stigma of a flower on another plant. This is…
    options:
    - Cross-pollination
    - Self-pollination
    - Fertilisation
    - Germination
    answer: Cross-pollination
    difficulty: 1
    hints:
    - Two different plants.
    - Insects and wind help.
    solution: Pollen moving to another plant is cross-pollination.
    mistakes:
      Self-pollination: c10s7_two_plants
  - prompt: Which tube carries the male gamete down to the ovule?
    options:
    - Pollen tube
    - Fallopian tube
    - Filament
    - Xylem
    answer: Pollen tube
    difficulty: 2
    hints:
    - It grows out of the pollen grain.
    - Down through the style.
    solution: The pollen tube grows down the style and carries the male gamete to the ovule.
    mistakes:
      Filament: c10s7_flower_role
  - prompt: Which part of the seed grows into the new plant?
    options:
    - Embryo
    - Seed coat
    - Ovary wall
    - Petal
    answer: Embryo
    difficulty: 1
    hints:
    - It came from the zygote.
    - It has a tiny root and shoot.
    solution: The embryo inside the seed develops into the new plant.
    mistakes:
      Seed coat: c10s_ovary_ovule
  - prompt: Where are sperm made in human males?
    options:
    - Testes
    - Vas deferens
    - Prostate gland
    - Urethra
    answer: Testes
    difficulty: 1
    hints:
    - They also make testosterone.
    - Outside the body cavity, where it is cooler.
    solution: Sperm are made in the testes.
    mistakes:
      Vas deferens: c10s7_male_female
  - prompt: How many eggs does a woman's ovary usually release each month?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - The two ovaries usually take turns.
    - Usually just a single egg.
    solution: Usually one egg is released each month.
    mistakes:
      '2': c10s7_male_female
  - prompt: Copper-T placed in the uterus is a method of…
    options:
    - Preventing pregnancy
    - Treating infections
    - Making eggs
    - Feeding the embryo
    answer: Preventing pregnancy
    difficulty: 2
    hints:
    - It is a contraceptive device.
    - It doesn't protect against infections.
    solution: Copper-T prevents pregnancy, though not sexually transmitted infections.
    mistakes:
      Treating infections: c10s7_health
  - prompt: Which is a sexually transmitted infection?
    options:
    - HIV-AIDS
    - Malaria
    - Typhoid
    - Goitre
    answer: HIV-AIDS
    difficulty: 1
    hints:
    - It spreads through sexual contact.
    - Malaria spreads by mosquitoes.
    solution: HIV-AIDS (also gonorrhoea, syphilis, warts) spread by sexual contact.
    mistakes:
      Malaria: t10_barrier_method
  - prompt: A body cell of a plant has 24 chromosomes. How many chromosomes does its zygote have?
    answer: '24'
    check: 12 + 12
    difficulty: 2
    hints:
    - Each gamete carries half.
    - Two gametes join.
    solution: '12 + 12 = 24: the full number is restored.'
    mistakes:
      '12': c10s_gamete_half
      '48': c10s_gamete_half
  - prompt: In which part of the flower is the ovule found?
    options:
    - Ovary
    - Anther
    - Stigma
    - Petal
    answer: Ovary
    difficulty: 1
    hints:
    - It is the swollen base of the pistil.
    - It later becomes the fruit.
    solution: Ovules are inside the ovary.
    mistakes:
      Anther: c10s7_flower_role
      Stigma: c10s7_flower_role
