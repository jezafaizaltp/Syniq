# CBSE Class 10 Science (NCERT), chapter 7. Format: content/README.md.
subject: cbse10-sci
chapter: 7
title: How do Organisms Reproduce?
tips:
  c10s_flower_parts: The stigma receives pollen; the anther makes it.
  c10s_ovary_ovule: Ovules become seeds; the ovary around them becomes the fruit.
  c10s_gamete_half: Gametes carry half the chromosomes so that the zygote gets the full number back.
  t10_barrier_method: "Only a method that stops body fluids passing can also block infections."
  t10_bryophyllum: "Look at a Bryophyllum leaf: small plantlets grow along its edges."
  t10_fission: "Splitting into two equal halves is one method; growing a bud is another. Which does Amoeba do?"
  t10_oviduct: "The egg leaves the ovary and travels down a tube. Where does it meet the sperm?"
  t10_placenta: "The embryo can't eat or breathe. Which organ links it to the mother's blood?"
  t10_regeneration: "Each piece regrows the parts it has lost. What is that called?"
  t10_rhizopus_spores: "Bread mould forms black blobs on stalks that release tiny cells that spread by air."
  t10_seedless: "Which fruit we buy has no seeds inside, so it must be grown another way?"
  t10_variation_use: "If the environment changes, would identical individuals or varied ones have a better chance that some survive?"
concepts:
- code: cbse10s.repro.asexual
  title: Reproduction and asexual methods
  notes: |
    Reproduction makes new individuals; DNA copying passes on information, with small variations that help a
    species survive changes. Asexual reproduction needs one parent and gives near-identical offspring:
    fission (binary in Amoeba and bacteria, multiple in Plasmodium), fragmentation (Spirogyra), regeneration
    (Planaria, Hydra), budding (Hydra, yeast), spore formation (Rhizopus bread mould), vegetative propagation
    (Bryophyllum leaf buds, potato eyes, stem cuttings, layering, grafting). Vegetative propagation gives
    seedless plants like banana, orange and rose, and plants that flower sooner, all like the parent.
  explanations:
    text: Some living things make copies of themselves with no partner. A bacterium splits in two, Hydra grows a bud that breaks off, bread mould releases spores, and a potato grows new plants from its eyes. The young are almost exact copies of the parent.
    visual: Draw an Amoeba stretching, its nucleus splitting in two, and the cell pinching in the middle into two Amoebae. That is binary fission.
    step_by_step: 'Step 1: Count the parents: one means asexual. Step 2: Watch what happens: splitting (fission), breaking into pieces (fragmentation), a growth that drops off (budding), spores, or a new plant from a root, stem or leaf (vegetative).'
    real_world: Gardeners grow new rose and money plants from stem cuttings because each cutting will be exactly like the parent plant.
  picture:
    kind: compare
    columns:
    - title: Animals and microbes
      points:
      - 'Binary fission: Amoeba, bacteria'
      - 'Multiple fission: Plasmodium'
      - 'Budding: Hydra, yeast'
      - 'Regeneration: Planaria'
    - title: Plants and fungi
      points:
      - 'Fragmentation: Spirogyra'
      - 'Spores: Rhizopus'
      - 'Leaf buds: Bryophyllum'
      - 'Stem tubers: potato'
    alt: 'Asexual reproduction examples: fission, budding and regeneration in animals and microbes; fragmentation, spores and vegetative propagation in plants and fungi.'
  activity:
    type: sort
    prompt: Which kind of asexual reproduction is it?
    bins:
    - Fission
    - Fragmentation
    - Regeneration
    - Budding
    - Spore formation
    items:
    - label: Amoeba splits into two
      bin: Fission
      clue: Does one cell divide into equal parts?
      why: 'Binary fission: one cell splits into two.'
    - label: Plasmodium divides into many cells at once
      bin: Fission
      clue: Does one cell split into many?
      why: 'Multiple fission: one cell becomes many.'
    - label: Spirogyra breaks into pieces that each grow
      bin: Fragmentation
      clue: Does the body just break apart, each piece growing?
      why: 'Mature Spirogyra breaks up and each fragment grows: fragmentation.'
    - label: Planaria cut into pieces, each regrows a whole body
      bin: Regeneration
      clue: Do specialised cells rebuild the missing parts?
      why: 'Cut pieces rebuild the whole body from special cells: regeneration.'
    - label: Hydra grows a small outgrowth that breaks off
      bin: Budding
      clue: Does a small copy grow out of the parent?
      why: 'A bud grows from repeated cell division and detaches: budding.'
    - label: Yeast forms a bulge that becomes a new cell
      bin: Budding
      clue: Is the new one a small outgrowth?
      why: Yeast reproduces by budding.
    - label: Rhizopus releases tiny cells from knob-like ends
      bin: Spore formation
      clue: What are the knobs full of?
      why: The sporangia release spores that grow into new moulds.
    - label: Leishmania splits in a definite direction
      bin: Fission
      clue: One cell into two equal cells?
      why: Leishmania divides by binary fission, along a fixed plane.
  items:
  - prompt: 'Amoeba divides into two daughter cells. This is:'
    options:
    - Binary fission
    - Budding
    - Spore formation
    - Fragmentation
    answer: Binary fission
    difficulty: 1
    hints:
    - One cell splits in two.
    - '''Binary'' means two.'
    solution: Amoeba splits into two by binary fission.
    mistakes: {"Budding": "t10_fission", "Fragmentation": "t10_fission"}
  - prompt: 'Bryophyllum can grow new plants from:'
    options:
    - Buds on the edges of its leaves
    - Seeds only
    - Spores
    - Its flowers
    answer: Buds on the edges of its leaves
    difficulty: 1
    hints:
    - Vegetative propagation.
    - Leaf margins.
    solution: Bryophyllum leaves have buds along their edges that grow into new plants.
    mistakes: {"Seeds only": "t10_bryophyllum", "Spores": "t10_bryophyllum"}
  - prompt: 'Bread mould (Rhizopus) reproduces by:'
    options:
    - Spores
    - Budding
    - Binary fission
    - Seeds
    answer: Spores
    difficulty: 1
    hints:
    - Look for the black dots.
    - Sporangia.
    solution: Rhizopus forms sporangia that release spores.
    mistakes: {"Budding": "t10_rhizopus_spores", "Seeds": "t10_rhizopus_spores"}
  - prompt: Why is variation useful to a species?
    options:
    - Some individuals may survive if the environment changes
    - It makes all offspring identical
    - It stops reproduction
    - It makes organisms bigger
    answer: Some individuals may survive if the environment changes
    difficulty: 2
    hints:
    - Think of a sudden rise in temperature.
    - Different individuals cope differently.
    solution: Variation means some individuals may have traits that help them survive a change, so the species continues.
    mistakes: {"It makes all offspring identical": "t10_variation_use", "It makes organisms bigger": "t10_variation_use"}
  - prompt: Which plant is grown by vegetative propagation because it has no seeds?
    options:
    - Banana
    - Mango
    - Pea
    - Wheat
    answer: Banana
    difficulty: 2
    hints:
    - Cultivated varieties are seedless.
    - Grown from suckers.
    solution: Cultivated bananas are seedless and are grown from suckers.
    mistakes: {"Mango": "t10_seedless", "Pea": "t10_seedless"}
  - prompt: 'Planaria cut into pieces can grow into whole new animals. This is:'
    options:
    - Regeneration
    - Budding
    - Spore formation
    - Sexual reproduction
    answer: Regeneration
    difficulty: 2
    hints:
    - Each piece rebuilds the missing parts.
    - Specialised cells divide.
    solution: 'Each piece regrows the missing parts: regeneration.'
    mistakes: {"Budding": "t10_regeneration", "Sexual reproduction": "t10_regeneration"}
- code: cbse10s.repro.sexual
  title: Sexual reproduction in plants and humans
  after:
  - cbse10s.repro.asexual
  notes: |
    Sexual reproduction joins a male and a female germ cell (gametes), each with half the chromosomes, into a
    zygote; it creates more variation. Flowers: stamens (anther makes pollen) are male; the pistil (stigma,
    style, ovary with ovules) is female. Pollination carries pollen to a stigma: self- or cross-pollination
    (by wind, insects, water). A pollen tube grows to the ovule; fertilisation makes a zygote; the ovule becomes
    a seed and the ovary becomes the fruit. Humans: puberty brings changes; testes make sperm and testosterone;
    ovaries release an egg each month and make oestrogen. Fertilisation happens in the oviduct; the embryo
    implants in the uterus and is fed through the placenta. Without fertilisation the uterus lining breaks down
    (menstruation). Reproductive health: barrier, hormonal and surgical methods of contraception; condoms also
    protect against sexually transmitted infections such as HIV-AIDS.
  explanations:
    text: In sexual reproduction two parents each give half the instructions, so the young are a new mix. In flowering plants pollen carries the male cell to the female part; in humans a sperm and an egg join to make one cell that grows into a baby.
    visual: 'Draw a flower cut in half: stamens around the edge with pollen-filled anthers, a pistil in the middle. Draw a pollen grain landing on the stigma and a tube growing down the style into the ovary to reach an ovule.'
    step_by_step: 'Step 1: Pollen is made in the anther. Step 2: Pollination: pollen reaches a stigma. Step 3: A pollen tube grows to the ovule. Step 4: Fertilisation forms a zygote. Step 5: Ovule → seed, ovary → fruit.'
    real_world: 'Bees visiting mustard flowers for nectar carry pollen from flower to flower: they make cross-pollination happen, which is why farmers value them.'
  picture:
    kind: flow
    steps:
    - Anther makes pollen
    - 'Pollination: pollen lands on the stigma'
    - Pollen tube grows down the style
    - Fertilisation in the ovule makes a zygote
    - Ovule becomes the seed; ovary becomes the fruit
    alt: 'From pollen to fruit: pollination, pollen tube growth, fertilisation, then the ovule becomes a seed and the ovary a fruit.'
  activity:
    type: order
    prompt: Put the steps from pollen to fruit in a flowering plant in order.
    steps:
    - Pollen grains form in the anther
    - 'Pollen lands on a stigma: pollination'
    - A pollen tube grows down the style to the ovule
    - 'The male gamete fuses with the egg: fertilisation'
    - The ovule becomes a seed and the ovary a fruit
    reasons:
      'Pollen lands on a stigma: pollination': Pollen has to be made in the anther before it can be carried.
      A pollen tube grows down the style to the ovule: The tube grows only after pollen reaches the stigma.
      'The male gamete fuses with the egg: fertilisation': The male gamete travels down the pollen tube to reach the egg.
      The ovule becomes a seed and the ovary a fruit: Seeds and fruit form only after fertilisation.
  items:
  - prompt: Which part of a flower makes pollen?
    options:
    - Anther
    - Stigma
    - Ovary
    - Petal
    answer: Anther
    difficulty: 1
    hints:
    - Part of the stamen.
    - Male part.
    solution: The anther, at the top of the stamen, makes pollen grains.
    mistakes:
      Stigma: c10s_flower_parts
  - prompt: 'After fertilisation, the ovary of a flower becomes:'
    options:
    - The fruit
    - The seed
    - The petal
    - The pollen
    answer: The fruit
    difficulty: 1
    hints:
    - The ovule becomes the seed.
    - What holds the seeds?
    solution: The ovary develops into the fruit, and the ovules inside become seeds.
    mistakes:
      The seed: c10s_ovary_ovule
  - prompt: A human body cell has 46 chromosomes. How many does a sperm cell have?
    answer: '23'
    check: 46/2
    difficulty: 2
    hints:
    - Gametes have half.
    - 46 ÷ 2.
    solution: 'Step 1: Gametes carry half the chromosomes. Step 2: 46 ÷ 2 = 23.'
    mistakes:
      '46': c10s_gamete_half
  - prompt: Where does fertilisation usually take place in the human female?
    options:
    - Oviduct (fallopian tube)
    - Uterus
    - Ovary
    - Vagina
    answer: Oviduct (fallopian tube)
    difficulty: 2
    hints:
    - The egg travels from the ovary.
    - The embryo then moves to the uterus.
    solution: Sperm meet the egg in the oviduct. The zygote then moves to the uterus and implants.
    mistakes: {"Uterus": "t10_oviduct", "Ovary": "t10_oviduct"}
  - prompt: What does the placenta do?
    options:
    - Passes food and oxygen from mother to embryo and removes wastes
    - Makes eggs
    - Produces sperm
    - Stores urine
    answer: Passes food and oxygen from mother to embryo and removes wastes
    difficulty: 2
    hints:
    - It joins the embryo to the uterus wall.
    - Exchange of materials.
    solution: The placenta lets glucose and oxygen pass from the mother's blood to the embryo, and wastes pass back.
    mistakes: {"Makes eggs": "t10_placenta", "Stores urine": "t10_placenta"}
  - prompt: Which method of contraception also protects against sexually transmitted infections?
    options:
    - Condom
    - Oral pills
    - Copper-T
    - Surgery
    answer: Condom
    difficulty: 2
    hints:
    - It is a barrier.
    - It stops body fluids mixing.
    solution: Condoms are a barrier, so they also reduce the spread of infections such as HIV.
    mistakes: {"Oral pills": "t10_barrier_method", "Copper-T": "t10_barrier_method"}
