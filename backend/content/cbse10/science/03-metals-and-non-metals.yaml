# CBSE Class 10 Science (NCERT), chapter 3. Format: content/README.md.
subject: cbse10-sci
chapter: 3
title: Metals and Non-metals
tips:
  c10s_ductile_malleable: Ductile means drawn into wires; malleable means beaten into sheets.
  c10s_ion_charge: A positive ion has lost electrons, so it has fewer than the neutral atom.
  c10s_roast_calcine: "Two heating methods: one in plenty of air (for sulphide ores), one with little or no air (for carbonate ores). Which kind of ore is in the question?"
  t10_cathode_deposit: "Copper ions are positive. Which electrode attracts positive ions?"
  t10_galvanise_zinc: "Galvanising uses a more reactive metal coating. Tin plating is different."
  t10_graphite_conducts: "One form of carbon has free electrons and is used for electrodes. Diamond doesn't conduct."
  t10_liquid_metal: "Only one metal is liquid at room temperature; it is used in old thermometers."
  t10_reactive_electrolysis: "Very reactive metals hold on to their compounds too tightly for carbon to pull them off. What's needed instead?"
  t10_rust_needs: "Iron in dry air doesn't rust, and nor does iron in boiled water with an oil layer on top. So what two things must both be present?"
  c10s3_metal_props: Metals are usually shiny, hard, malleable, ductile, sonorous and good conductors. Non-metals are usually dull, brittle and poor conductors. Which list fits?
  c10s3_exceptions: "Most metals are hard and good conductors, and most non-metals are dull, but a few break the rule. Think of the odd ones out from this chapter."
  c10s3_series: 'Use the reactivity series: K, Na, Ca, Mg, Al, Zn, Fe, Pb, (H), Cu, Hg, Ag, Au. Metals above H give hydrogen with dilute acids.'
  c10s3_ionic: Ionic compounds form when a metal gives electrons to a non-metal. They have high melting points and conduct only when melted or dissolved.
  c10s3_ore_method: 'Low reactivity: heat alone. Middle: roast or calcine to the oxide, then reduce with carbon. Very high: electrolysis of the molten compound.'
  c10s3_alloy: "Think of brass or steel: what goes into them, and are the parts chemically joined or just mixed?"
concepts:
- code: cbse10s.metal.properties
  title: Properties and reactivity of metals
  notes: |
    Metals are lustrous, malleable, ductile, good conductors of heat and electricity, and usually hard and
    sonorous (exceptions: sodium and potassium are soft; mercury is liquid; gallium and caesium melt in the
    hand). Non-metals are mostly dull, brittle and poor conductors (graphite conducts; iodine is lustrous;
    diamond is the hardest natural substance). Metal oxides are basic (some, like Al₂O₃ and ZnO, are
    amphoteric); non-metal oxides are acidic or neutral. Reactivity series (most to least): K, Na, Ca, Mg, Al,
    Zn, Fe, Pb, (H), Cu, Hg, Ag, Au. Metals above hydrogen give H₂ with dilute acids; sodium and potassium react
    violently with cold water; a more reactive metal displaces a less reactive one from its salt solution.
    Metals lose electrons to form positive ions, non-metals gain them; ionic compounds (like NaCl) have high
    melting points and conduct when molten or dissolved.
  explanations:
    text: Metals are shiny, bend without breaking, and carry electricity. How eagerly a metal reacts depends on how easily it gives away electrons; the reactivity series lists them from the most eager, potassium, down to the least, gold.
    visual: Draw a ladder with K at the top and Au at the bottom. A metal can push any metal below it out of a compound, but never one above it.
    step_by_step: 'Step 1: Find both metals on the reactivity series. Step 2: If the free metal is higher than the metal in the compound, displacement happens. Step 3: If it is lower, nothing happens. Step 4: Metals above hydrogen give hydrogen with dilute acid.'
    real_world: Gold and silver stay shiny for centuries in jewellery because they are at the bottom of the reactivity series and hardly react with air or water.
  picture:
    kind: flow
    steps:
    - 'K, Na, Ca: react with cold water'
    - 'Mg, Al, Zn, Fe: react with acids (and steam)'
    - 'Pb: reacts slowly with acids'
    - 'H: the dividing line'
    - 'Cu, Hg, Ag, Au: don''t give hydrogen with dilute acid'
    alt: 'The reactivity series from most reactive to least: potassium, sodium and calcium react with cold water; copper, mercury, silver and gold sit below hydrogen.'
  activity:
    type: order
    prompt: Put these metals in the reactivity series, most reactive first.
    steps:
    - Potassium
    - Magnesium
    - Zinc
    - Iron
    - Copper
    - Gold
    reasons:
      Magnesium: Potassium reacts violently with cold water; magnesium only with hot water. Potassium comes first.
      Zinc: Magnesium displaces zinc from zinc sulphate, so magnesium is more reactive.
      Iron: Zinc displaces iron from iron sulphate, so zinc is above iron.
      Copper: Iron displaces copper from copper sulphate (the blue fades), so iron is above copper.
      Gold: Copper slowly reacts with air; gold doesn't react at all. Gold is last.
  lesson:
    - teach: 'Metals are usually lustrous (shiny), hard, malleable (beaten into sheets), ductile (drawn into wires), sonorous (they ring) and good conductors of heat and electricity. Non-metals are mostly dull, brittle and poor conductors. Exceptions: mercury is liquid, sodium is soft enough to cut, graphite conducts, iodine is lustrous.'
      picture:
        kind: compare
        columns:
        - title: Metals
          points:
          - Shiny, hard
          - Malleable and ductile
          - Good conductors
          - Basic oxides
        - title: Non-metals
          points:
          - Dull, brittle
          - Poor conductors
          - Acidic or neutral oxides
        alt: Metals are shiny, hard, malleable, ductile, good conductors with basic oxides; non-metals are dull, brittle, poor conductors with acidic or neutral oxides.
      check:
        prompt: Gold is beaten into thin foil. This shows it is…
        options:
        - Malleable
        - Ductile
        - Sonorous
        answer: Malleable
        why: Malleable means beaten into sheets.
    - teach: Metals react with oxygen to give basic oxides; some (aluminium, zinc oxide) are amphoteric and react with both acids and bases. Sodium and potassium react so fast with air and water that they are kept in kerosene. Metals above hydrogen in the reactivity series give hydrogen with dilute acids.
      check:
        prompt: Why is sodium stored in kerosene?
        options:
        - It reacts violently with air and water
        - It is a liquid
        - It is heavy
        answer: It reacts violently with air and water
        why: Kerosene keeps air and water away.
    - teach: 'Ionic bonds: a metal atom gives electrons to a non-metal atom, making oppositely charged ions. Na (2,8,1) gives one electron to Cl (2,8,7): Na⁺ and Cl⁻. Ionic compounds are hard solids with high melting points, dissolve in water and conduct electricity when molten or dissolved.'
      check:
        prompt: Mg (2,8,2) forms which ion?
        options:
        - Mg²⁺
        - Mg²⁻
        - Mg⁺
        answer: Mg²⁺
        why: It loses 2 electrons.
  items:
  - prompt: Which metal is a liquid at room temperature?
    options:
    - Mercury
    - Sodium
    - Aluminium
    - Copper
    answer: Mercury
    difficulty: 1
    hints:
    - It is used in old thermometers.
    - Symbol Hg.
    solution: Mercury is the only metal that is liquid at room temperature.
    mistakes: {"Sodium": "t10_liquid_metal", "Aluminium": "t10_liquid_metal"}
  - prompt: Which property lets copper be drawn into thin wires?
    options:
    - Ductility
    - Malleability
    - Lustre
    - Sonority
    answer: Ductility
    difficulty: 1
    hints:
    - Wire = drawing out.
    - Malleable means beaten into sheets.
    solution: Ductility is the ability to be drawn into wires.
    mistakes:
      Malleability: c10s_ductile_malleable
  - prompt: Which non-metal conducts electricity?
    options:
    - Graphite
    - Sulphur
    - Iodine
    - Diamond
    answer: Graphite
    difficulty: 1
    hints:
    - Pencil 'lead'.
    - A form of carbon.
    solution: Graphite, a form of carbon, conducts electricity. It is used in electrodes.
    mistakes: {"Diamond": "t10_graphite_conducts", "Sulphur": "t10_graphite_conducts"}
  - prompt: A copper strip is put in iron sulphate solution. What happens?
    options:
    - Nothing, because copper is less reactive than iron
    - Iron is deposited on the copper
    - The solution turns blue at once and iron comes out
    - Hydrogen gas bubbles off
    answer: Nothing, because copper is less reactive than iron
    difficulty: 2
    hints:
    - Where is copper compared to iron?
    - Only a more reactive metal displaces.
    solution: Copper is below iron in the reactivity series, so it cannot displace iron. No reaction.
    mistakes:
      Iron is deposited on the copper: c10s_reactivity_order
  - prompt: Why do ionic compounds like NaCl conduct electricity when dissolved in water but not as solids?
    options:
    - In water the ions are free to move
    - Water itself carries the current
    - The solid has no ions
    - Dissolving makes free electrons
    answer: In water the ions are free to move
    difficulty: 2
    hints:
    - Solid NaCl still has ions.
    - They are locked in place in the crystal.
    solution: In the solid, ions are fixed in a lattice. Dissolved or molten, they move and carry charge.
    mistakes: {"Water itself carries the current": "ions_must_move", "The solid has no ions": "ions_must_move"}
  - prompt: Sodium (atomic number 11) forms Na⁺. How many electrons does Na⁺ have?
    answer: '10'
    check: 11 - 1
    difficulty: 2
    hints:
    - Neutral Na has 11 electrons.
    - It loses one.
    solution: 'Step 1: Na has 11 electrons (2, 8, 1). Step 2: It loses 1 to form Na⁺: 10 electrons (2, 8).'
    mistakes:
      '12': c10s_ion_charge
  - prompt: Copper is used for electric wires. Which two properties does this use?
    options:
    - Ductile and good conductor
    - Malleable and sonorous
    - Shiny and hard
    - Brittle and dull
    answer: Ductile and good conductor
    difficulty: 1
    hints:
    - Wires are drawn out.
    - And they must carry current.
    solution: Copper can be drawn into wires (ductile) and conducts electricity well.
    mistakes:
      Malleable and sonorous: c10s_ductile_malleable
  - prompt: Which metal can be cut with a knife?
    options:
    - Sodium
    - Iron
    - Copper
    - Aluminium
    answer: Sodium
    difficulty: 1
    hints:
    - Most metals are hard.
    - One reactive metal is very soft.
    solution: Sodium (and potassium) are soft enough to cut with a knife.
    mistakes:
      Aluminium: c10s3_exceptions
  - prompt: Which non-metal is lustrous?
    options:
    - Iodine
    - Sulphur
    - Carbon (charcoal)
    - Phosphorus
    answer: Iodine
    difficulty: 2
    hints:
    - Most non-metals are dull.
    - One has shiny purple-black crystals.
    solution: Iodine crystals are shiny, an exception among non-metals.
    mistakes:
      Sulphur: c10s3_exceptions
  - prompt: Aluminium oxide reacts with both HCl and NaOH. Such oxides are called…
    options:
    - Amphoteric
    - Neutral
    - Acidic
    - Basic only
    answer: Amphoteric
    difficulty: 2
    hints:
    - It acts as both a base and an acid.
    - There is a special word for this.
    solution: Oxides that react with both acids and bases are amphoteric.
    mistakes:
      Neutral: c10s3_metal_props
  - prompt: Which metal does NOT give hydrogen with dilute hydrochloric acid?
    options:
    - Copper
    - Zinc
    - Magnesium
    - Iron
    answer: Copper
    difficulty: 2
    hints:
    - Only metals above hydrogen in the series do.
    - Find the one below hydrogen.
    solution: Copper is below hydrogen in the reactivity series, so it doesn't displace hydrogen.
    mistakes:
      Iron: c10s3_series
      Zinc: c10s3_series
  - prompt: Chlorine has 17 electrons. How many electrons does the chloride ion Cl⁻ have?
    answer: '18'
    check: 17 + 1
    difficulty: 2
    hints:
    - A negative ion has gained electrons.
    - One minus sign means one electron.
    solution: 'Cl gains 1 electron: 17 + 1 = 18.'
    mistakes:
      '16': c10s_ion_charge
      '17': c10s_ion_charge
  - prompt: Why do ionic compounds have high melting points?
    options:
    - Strong attraction between oppositely charged ions
    - They are made of molecules
    - They contain water
    - They are metals
    answer: Strong attraction between oppositely charged ions
    difficulty: 2
    hints:
    - What holds an ionic solid together?
    - Plus and minus attract strongly.
    solution: A lot of energy is needed to overcome the strong forces between ions.
    mistakes:
      They are made of molecules: c10s3_ionic
  - prompt: Which metal is the best conductor of heat?
    options:
    - Silver
    - Lead
    - Mercury
    - Iron
    answer: Silver
    difficulty: 2
    hints:
    - Lead and mercury are poor conductors of heat.
    - Of the others, the one used for jewellery and coins conducts best.
    solution: Silver and copper are the best conductors of heat; lead and mercury are poor.
    mistakes:
      Lead: c10s3_exceptions
      Mercury: c10s3_exceptions
  - prompt: A metal X burns to form an oxide that turns red litmus blue. What kind of oxide is it?
    options:
    - Basic
    - Acidic
    - Neutral
    - It cannot be a metal
    answer: Basic
    difficulty: 1
    hints:
    - Turning red litmus blue means…
    - Metal oxides are usually this.
    solution: Turning red litmus blue shows a basic oxide, typical of metals.
    mistakes:
      Acidic: c10s2_metal_oxide
- code: cbse10s.metal.extraction
  title: Extracting metals and preventing corrosion
  after:
  - cbse10s.metal.properties
  notes: |
    Minerals that are mined profitably for a metal are ores; the unwanted earthy part is gangue. After
    concentrating the ore: highly reactive metals (K, Na, Ca, Mg, Al) are got by electrolysis of their molten
    compounds; middle metals (Zn, Fe, Pb) — sulphide ores are roasted (heated in air) and carbonate ores are
    calcined (heated without air) to oxides, which are reduced by carbon (or by aluminium in the thermit
    reaction: Fe₂O₃ + 2Al → 2Fe + Al₂O₃); low metals (Hg, Cu) are got by heating their ores alone. Impure copper
    is refined by electrolysis (impure anode, pure cathode). Corrosion: iron rusts with air and water; silver
    goes black (Ag₂S); copper goes green. Prevention: painting, oiling, galvanising (zinc coat), chrome plating,
    anodising, alloying (stainless steel). Alloys: brass (Cu + Zn), bronze (Cu + Sn), solder (Pb + Sn).
  explanations:
    text: How a metal is extracted depends on where it sits in the reactivity series. The most reactive ones hold on so tightly that only electricity can pull them out; middle ones can be reduced with carbon; the least reactive ones come out just by heating.
    visual: 'Draw three boxes beside the reactivity series: top box ''electrolysis'', middle box ''roast or calcine, then reduce with carbon'', bottom box ''just heat''.'
    step_by_step: 'Step 1: Find the metal in the series. Step 2: Top (K to Al): electrolysis of the molten compound. Step 3: Middle (Zn, Fe, Pb): convert to oxide, reduce with carbon. Step 4: Bottom (Cu, Hg): heat the ore. Step 5: Refine by electrolysis if needed.'
    real_world: Iron gates are painted and steel buckets are galvanised with zinc so that air and water can't reach the iron and make it rust.
  picture:
    kind: compare
    columns:
    - title: High reactivity
      points:
      - K, Na, Ca, Mg, Al
      - Electrolysis of molten compound
      - Carbon can't reduce them
    - title: Middle
      points:
      - Zn, Fe, Pb
      - Roast sulphides or calcine carbonates
      - Reduce the oxide with carbon
    - title: Low
      points:
      - Cu, Hg
      - Heat the ore alone
      - Refine by electrolysis
    alt: 'Three columns showing how metals are extracted: electrolysis for highly reactive metals, reduction by carbon for middle metals, and heating alone for low-reactivity metals.'
  activity:
    type: sort
    prompt: How is each metal got from its ore?
    bins:
    - Electrolysis of the molten ore
    - Roasting, then heating with carbon
    - Heating the ore in air alone
    - Found free in nature
    items:
    - label: Sodium
      bin: Electrolysis of the molten ore
      clue: Can carbon pull oxygen from such a reactive metal?
      why: 'Sodium is too reactive for carbon to reduce: electrolysis of molten NaCl.'
    - label: Aluminium
      bin: Electrolysis of the molten ore
      clue: Is aluminium near the top of the series?
      why: Aluminium is high in the series, so it's got by electrolysis of molten alumina.
    - label: Zinc from zinc blende (ZnS)
      bin: Roasting, then heating with carbon
      clue: Is zinc in the middle of the series?
      why: Roast ZnS to ZnO, then reduce it with carbon.
    - label: Iron
      bin: Roasting, then heating with carbon
      clue: Which element in a blast furnace takes oxygen from iron oxide?
      why: 'Iron is a middle metal: its oxide is reduced by carbon (coke).'
    - label: Mercury from cinnabar (HgS)
      bin: Heating the ore in air alone
      clue: Is mercury low in the series?
      why: Heating HgS in air gives HgO, which breaks down to mercury on more heating.
    - label: Gold
      bin: Found free in nature
      clue: Does gold react with air or water?
      why: Gold is so unreactive it is found as the metal itself.
    - label: Potassium
      bin: Electrolysis of the molten ore
      clue: Which is more reactive, potassium or carbon?
      why: 'Potassium is the most reactive: only electrolysis works.'
    - label: Copper from Cu₂S
      bin: Heating the ore in air alone
      clue: Is copper low in the series?
      why: Heating Cu₂S in air gives copper directly (self-reduction).
  lesson:
    - teach: Metals are found in minerals; a mineral we can profitably extract from is an ore. Gold and silver are found free (low reactivity). Most ores also contain earth, sand and rock called gangue, which is removed first (enrichment).
      picture:
        kind: flow
        steps:
        - Ore
        - Remove gangue
        - Turn into oxide (roast or calcine)
        - Reduce to metal
        - Refine
        alt: 'Steps from ore to metal: remove the gangue, roast or calcine to the oxide, reduce to the metal, then refine.'
      check:
        prompt: Unwanted sand and rock in an ore is called…
        options:
        - Gangue
        - Slag
        - Alloy
        answer: Gangue
        why: Gangue is removed before extraction.
    - teach: 'How to get the metal depends on reactivity. Low (mercury, copper): heating alone. Middle (zinc, iron, lead): sulphide ores are roasted (heated in air), carbonate ores are calcined (heated with little air) to get the oxide, which is then reduced with carbon. High (sodium, magnesium, aluminium): electrolysis of the molten compound.'
      check:
        prompt: Aluminium is extracted by…
        options:
        - Electrolysis
        - Heating with carbon
        - Heating alone
        answer: Electrolysis
        why: It is too reactive for carbon to reduce.
    - teach: 'Impure metals are refined by electrolysis: impure metal is the anode, a thin strip of pure metal is the cathode, and pure metal collects on the cathode. Corrosion (rusting of iron needs air and water) is prevented by painting, oiling, galvanising with zinc, or making alloys such as stainless steel.'
      check:
        prompt: Which keeps iron from rusting by coating it with zinc?
        options:
        - Galvanising
        - Roasting
        - Calcination
        answer: Galvanising
        why: Zinc protects the iron.
  items:
  - prompt: 'Heating a sulphide ore strongly in excess air is called:'
    options:
    - Roasting
    - Calcination
    - Electrolysis
    - Galvanising
    answer: Roasting
    difficulty: 1
    hints:
    - Calcination is without air.
    - Roasting uses air.
    solution: Roasting heats a sulphide ore in air to turn it into the oxide.
    mistakes:
      Calcination: c10s_roast_calcine
  - prompt: 'Sodium is extracted by:'
    options:
    - Electrolysis of molten sodium chloride
    - Heating sodium chloride with carbon
    - Heating its ore alone
    - Roasting
    answer: Electrolysis of molten sodium chloride
    difficulty: 1
    hints:
    - Sodium is near the top of the series.
    - Carbon is not strong enough.
    solution: Highly reactive metals like sodium are got by electrolysis of their molten compounds.
    mistakes: {"Heating sodium chloride with carbon": "t10_reactive_electrolysis", "Roasting": "t10_reactive_electrolysis"}
  - prompt: What two things are needed for iron to rust?
    options:
    - Air (oxygen) and water
    - Water and salt only
    - Air only
    - Heat and light
    answer: Air (oxygen) and water
    difficulty: 1
    hints:
    - Iron nails in dry air don't rust.
    - Nor in boiled water with no air.
    solution: Rusting needs both oxygen and water.
    mistakes: {"Air only": "t10_rust_needs", "Water and salt only": "t10_rust_needs"}
  - prompt: 'Galvanising protects iron by:'
    options:
    - Coating it with zinc
    - Coating it with tin
    - Mixing it with carbon
    - Painting it red
    answer: Coating it with zinc
    difficulty: 1
    hints:
    - Galvanised buckets look grey.
    - Zinc is more reactive than iron.
    solution: Galvanising is coating iron with zinc. Even if scratched, the zinc corrodes first.
    mistakes: {"Coating it with tin": "t10_galvanise_zinc", "Mixing it with carbon": "t10_galvanise_zinc"}
  - prompt: In the thermit reaction, Fe₂O₃ + 2Al → 2Fe + Al₂O₃, which substance is reduced?
    options:
    - Fe₂O₃
    - Al
    - Fe
    - Al₂O₃
    answer: Fe₂O₃
    difficulty: 2
    hints:
    - Reduction is loss of oxygen.
    - Which reactant loses oxygen?
    solution: Iron(III) oxide loses oxygen to aluminium, so Fe₂O₃ is reduced and Al is oxidised.
    mistakes:
      Al: c10s_oxidised_reduced
  - prompt: During electrolytic refining of copper, where does pure copper collect?
    options:
    - On the cathode (negative electrode)
    - On the anode (positive electrode)
    - At the bottom as anode mud
    - It stays in the solution
    answer: On the cathode (negative electrode)
    difficulty: 2
    hints:
    - Cu²⁺ ions are positive.
    - Positive ions go to the negative electrode.
    solution: Copper ions move to the cathode and deposit as pure copper. Impurities fall as anode mud.
    mistakes: {"On the anode (positive electrode)": "t10_cathode_deposit", "It stays in the solution": "t10_cathode_deposit"}
  - prompt: Heating zinc carbonate in limited air to get zinc oxide is called…
    options:
    - Calcination
    - Roasting
    - Electrolysis
    - Galvanising
    answer: Calcination
    difficulty: 2
    hints:
    - It is a carbonate ore.
    - Limited air.
    solution: 'Carbonate ores are calcined: ZnCO₃ → ZnO + CO₂.'
    mistakes:
      Roasting: c10s_roast_calcine
  - prompt: Which metal is found free (native) in nature?
    options:
    - Gold
    - Sodium
    - Iron
    - Aluminium
    answer: Gold
    difficulty: 1
    hints:
    - Unreactive metals don't combine with others.
    - It doesn't tarnish.
    solution: Gold is so unreactive that it is found as the free metal.
    mistakes:
      Sodium: c10s3_series
  - prompt: Cinnabar (HgS) gives mercury by…
    options:
    - Heating alone
    - Electrolysis
    - Reduction with aluminium
    - Galvanising
    answer: Heating alone
    difficulty: 2
    hints:
    - Mercury is low in the reactivity series.
    - Low-reactivity metals need the least work.
    solution: Roasting HgS gives HgO, which on further heating gives mercury.
    mistakes:
      Electrolysis: c10s3_ore_method
  - prompt: Why can't carbon be used to get sodium from sodium oxide?
    options:
    - Sodium holds oxygen more strongly than carbon does
    - Carbon is too expensive
    - Sodium is a non-metal
    - Sodium oxide is a gas
    answer: Sodium holds oxygen more strongly than carbon does
    difficulty: 3
    hints:
    - Carbon can only pull oxygen from less reactive metals.
    - Where is sodium in the series?
    solution: Sodium is more reactive than carbon, so carbon can't take its oxygen; electrolysis is used.
    mistakes:
      Carbon is too expensive: t10_reactive_electrolysis
  - prompt: In electrolytic refining of copper, the anode is…
    options:
    - Impure copper
    - Pure copper
    - Graphite
    - Zinc
    answer: Impure copper
    difficulty: 2
    hints:
    - Pure copper collects at the cathode.
    - So the other electrode is the one that dissolves.
    solution: Impure copper is the anode; it dissolves and pure copper deposits on the cathode.
    mistakes:
      Pure copper: t10_cathode_deposit
  - prompt: What is an alloy?
    options:
    - A mixture of a metal with other metals or a non-metal
    - A pure metal
    - An ore
    - A compound of a metal with oxygen
    answer: A mixture of a metal with other metals or a non-metal
    difficulty: 1
    hints:
    - Brass and steel are examples.
    - They are mixtures, not compounds.
    solution: An alloy is a uniform mixture of a metal with other metals or a non-metal.
    mistakes:
      An ore: c10s3_alloy
  - prompt: Brass is an alloy of copper and…
    options:
    - Zinc
    - Tin
    - Iron
    - Lead
    answer: Zinc
    difficulty: 2
    hints:
    - Bronze is copper and tin.
    - Brass is the other one.
    solution: Brass = copper + zinc; bronze = copper + tin.
    mistakes:
      Tin: c10s3_alloy
  - prompt: Silver articles turn black in air. Why?
    options:
    - They react with sulphur in the air
    - They rust
    - They melt
    - They lose electrons to water
    answer: They react with sulphur in the air
    difficulty: 2
    hints:
    - It is corrosion, but not rusting.
    - The black coating is silver sulphide.
    solution: Silver reacts with sulphur compounds in air to form black silver sulphide.
    mistakes:
      They rust: t10_rust_needs
  - prompt: Solder, used to join electrical wires, is an alloy of lead and tin. Why is it useful?
    options:
    - It has a low melting point
    - It is very hard
    - It is magnetic
    - It doesn't conduct
    answer: It has a low melting point
    difficulty: 2
    hints:
    - Joining wires means melting the solder.
    - Without damaging the wires.
    solution: Solder melts at a low temperature, so it can join wires easily.
    mistakes:
      It doesn't conduct: c10s3_alloy
