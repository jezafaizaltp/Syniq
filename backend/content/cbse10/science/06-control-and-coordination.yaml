# CBSE Class 10 Science (NCERT), chapter 6. Format: content/README.md.
subject: cbse10-sci
chapter: 6
title: Control and Coordination
tips:
  c10s_sensory_motor: Sensory neurons carry signals in to the spinal cord; motor neurons carry commands out to muscles.
  c10s_plant_hormone: "One hormone slows growth (it helps plants rest). Another makes cells on the shaded side grow longer, so the shoot bends towards light."
  t10_adrenaline: "The 'fight or flight' hormone speeds the heart in danger."
  t10_cerebellum: "Balance and smooth movement are handled by the 'little brain' at the back."
  t10_hormone_speed: "Hormones travel in the blood. Is that faster or slower than a nerve signal?"
  t10_insulin: "Which pancreas hormone helps cells take up sugar from blood?"
  t10_medulla: "Involuntary actions like heartbeat are controlled by the part of the hindbrain joined to the spinal cord."
  t10_reflex_spinal: "In a reflex, which organ handles the signal: the brain, or something closer?"
  t10_synapse: "Neurons don't touch. The tiny gap where the signal crosses has a name."
  t10_thyroid_iodine: "Lack of iodine causes goitre, a swelling of which gland?"
  c10s6_salt: "Think of the mineral added to table salt to protect the gland in your neck."
  t10_touch_me_not: "Plants have no nerves or muscles, and folding happens in seconds, too fast for growth. What moves inside the cells?"
  t10_tropism_names: "Photo = light, geo = earth, hydro = water. What is the shoot growing towards?"
  c10s6_brain_parts: Split the brain into fore-, mid- and hindbrain. Thinking, senses and voluntary action belong to one part; balance and automatic body jobs to another. Which job is this?
  c10s6_neuron_parts: A signal enters a neuron through its short branches, runs along the long fibre, and leaves at the far end. Which piece of that path is asked about?
  c10s6_protection: Think about what surrounds and cushions the brain and the spinal cord.
  c10s6_tropism_dir: Roots and shoots respond in opposite ways. Does this part grow towards or away from the stimulus?
  c10s6_gland_hormone: 'Match each gland to its hormone: thyroid, pancreas, adrenal, pituitary, testes, ovaries. Which gland makes this one?'
  c10s6_master: "One gland at the base of the brain sends out hormones that switch other glands on and off. Which one sits there?"
  c10s6_feedback: 'Hormone levels are kept steady by feedback: when the level is too high, less is released.'
concepts:
- code: cbse10s.control.nervous
  title: Nervous system and reflexes
  notes: |
    Receptors sense changes (stimuli) and send electrical impulses along neurons: dendrite → cell body → axon →
    nerve ending; at a synapse the impulse crosses by chemicals. A reflex action is a quick, automatic
    response; its path (reflex arc) is receptor → sensory neuron → spinal cord (relay) → motor neuron →
    effector (muscle or gland). The central nervous system is the brain and spinal cord, protected by skull,
    vertebral column and fluid. Forebrain: thinking, memory, senses, voluntary actions. Midbrain and hindbrain:
    medulla controls involuntary actions (heartbeat, breathing, blood pressure, vomiting); cerebellum keeps
    posture and balance and makes movements precise; pons helps breathing. Plants have no nerves: they respond
    by changes in water (touch-me-not folds) or growth.
  explanations:
    text: Your nervous system is a fast messaging network. Senses pick up a change, nerves carry the message as an electrical signal, and the brain or spinal cord decides what to do. For emergencies the spinal cord handles it alone, so you pull back from a hot pan before you even feel the pain.
    visual: Draw a hand touching a flame, a wire running to the spinal cord, a U-turn there, and a wire back to the arm muscle. That U-turn is the reflex arc; another wire goes up to the brain, but it arrives later.
    step_by_step: 'Step 1: Find the stimulus and receptor. Step 2: Sensory neuron carries the signal in. Step 3: Relay in the spinal cord. Step 4: Motor neuron carries the signal out. Step 5: The effector muscle responds.'
    real_world: 'When something flies at your eyes you blink before you think. That''s a reflex: fast, automatic and protective.'
  picture:
    kind: flow
    steps:
    - Receptor in the skin senses heat
    - Sensory neuron carries the impulse
    - Spinal cord relays it
    - Motor neuron carries the command
    - Arm muscle pulls the hand away
    alt: 'The reflex arc: receptor, sensory neuron, spinal cord, motor neuron, effector muscle.'
  activity:
    type: order
    prompt: You touch a hot pan. Put the steps of the reflex arc in order.
    steps:
    - Receptors in the skin sense the heat
    - A sensory neuron carries the message
    - A relay neuron in the spinal cord passes it on
    - A motor neuron carries the order out
    - Arm muscles contract and pull the hand away
    reasons:
      A sensory neuron carries the message: Nothing can be carried until a receptor senses the heat.
      A relay neuron in the spinal cord passes it on: The spinal cord gets the message from the sensory neuron.
      A motor neuron carries the order out: The order comes from the relay in the spinal cord.
      Arm muscles contract and pull the hand away: Muscles act only when the motor neuron's message reaches them.
  lesson:
    - teach: 'Animals respond to changes using the nervous system. Receptors (in the eyes, ears, nose, tongue, skin) pick up information. A neuron carries it: dendrites receive, the axon carries the electrical impulse, and at its end a chemical crosses a tiny gap called a synapse to the next cell.'
      picture:
        kind: flow
        steps:
        - Dendrite receives
        - Cell body
        - Axon carries impulse
        - Chemical crosses the synapse
        - Next neuron or muscle
        alt: A nerve impulse is received at the dendrite, passes the cell body, runs along the axon and crosses the synapse as a chemical to the next cell.
      check:
        prompt: The long fibre carrying the impulse is the…
        options:
        - Axon
        - Dendrite
        - Synapse
        answer: Axon
        why: Dendrites receive; the axon carries.
    - teach: 'A reflex is a quick, automatic response, like pulling your hand from a flame. The path is the reflex arc: receptor → sensory neuron → spinal cord (relay) → motor neuron → muscle (effector). It is fast because the spinal cord answers before the brain thinks.'
      check:
        prompt: In a reflex arc, which neuron carries the signal to the muscle?
        options:
        - Motor neuron
        - Sensory neuron
        - Relay neuron
        answer: Motor neuron
        why: Motor neurons drive muscles.
    - teach: 'The brain has three main parts. Forebrain (cerebrum): thinking, memory, senses, voluntary actions. Midbrain and hindbrain: the medulla controls breathing, heartbeat, blood pressure, salivation and vomiting; the cerebellum controls balance and posture. The skull protects the brain, the backbone protects the spinal cord, and fluid cushions both.'
      check:
        prompt: Which part lets you think and remember?
        options:
        - Forebrain
        - Medulla
        - Cerebellum
        answer: Forebrain
        why: The cerebrum is the thinking part.
  items:
  - prompt: What is the correct order of a reflex arc?
    options:
    - Receptor → sensory neuron → spinal cord → motor neuron → effector
    - Effector → motor neuron → brain → receptor
    - Receptor → motor neuron → spinal cord → sensory neuron → effector
    - Brain → receptor → effector
    answer: Receptor → sensory neuron → spinal cord → motor neuron → effector
    difficulty: 1
    hints:
    - Sensory comes in, motor goes out.
    - Spinal cord is the middle.
    solution: Signals go in by the sensory neuron, are relayed in the spinal cord, and go out by the motor neuron.
    mistakes:
      Receptor → motor neuron → spinal cord → sensory neuron → effector: c10s_sensory_motor
  - prompt: Which part of the brain keeps your balance when you ride a bicycle?
    options:
    - Cerebellum
    - Medulla
    - Forebrain (cerebrum)
    - Pons
    answer: Cerebellum
    difficulty: 1
    hints:
    - It is in the hindbrain.
    - Posture and precise movement.
    solution: The cerebellum controls posture, balance and precision of movements.
    mistakes: {"Medulla": "t10_cerebellum", "Forebrain (cerebrum)": "t10_cerebellum"}
  - prompt: Which part of the brain controls heartbeat and breathing?
    options:
    - Medulla
    - Cerebellum
    - Forebrain
    - Spinal cord
    answer: Medulla
    difficulty: 2
    hints:
    - These are involuntary.
    - Part of the hindbrain.
    solution: The medulla controls involuntary actions such as heartbeat, breathing and blood pressure.
    mistakes: {"Cerebellum": "t10_medulla", "Forebrain": "t10_medulla"}
  - prompt: Where does a nerve impulse pass from one neuron to the next?
    options:
    - At a synapse
    - At the cell nucleus
    - In the bone
    - In the blood
    answer: At a synapse
    difficulty: 1
    hints:
    - A tiny gap.
    - Chemicals cross it.
    solution: At a synapse, chemicals carry the signal across the gap to the next neuron.
    mistakes: {"At the cell nucleus": "t10_synapse", "In the blood": "t10_synapse"}
  - prompt: Why is a reflex faster than a thought-out action?
    options:
    - The signal is handled by the spinal cord without waiting for the brain
    - Reflex nerves are thicker
    - Reflexes use hormones
    - The brain is switched off
    answer: The signal is handled by the spinal cord without waiting for the brain
    difficulty: 2
    hints:
    - Shorter path.
    - No decision-making.
    solution: The reflex arc takes a short route through the spinal cord, so the response comes before the brain processes it.
    mistakes: {"Reflex nerves are thicker": "t10_reflex_spinal", "The brain is switched off": "t10_reflex_spinal"}
  - prompt: 'Leaves of the touch-me-not plant fold when touched. This is because:'
    options:
    - Cells change shape by moving water
    - The plant grows towards the touch
    - Nerves carry a signal
    - Muscles in the leaf contract
    answer: Cells change shape by moving water
    difficulty: 2
    hints:
    - Plants have no nerves or muscles.
    - It's too quick to be growth.
    solution: Cells at the base of the leaflets lose water quickly and change shape, so the leaves fold. No growth is involved.
    mistakes: {"The plant grows towards the touch": "t10_touch_me_not", "Nerves carry a signal": "t10_touch_me_not"}
  - prompt: Which part of a neuron receives information first?
    options:
    - Dendrite
    - Axon
    - Synapse
    - Nerve ending
    answer: Dendrite
    difficulty: 1
    hints:
    - The short branches at the cell body.
    - Signals come in there.
    solution: Dendrites pick up the information and start the impulse.
    mistakes:
      Axon: c10s6_neuron_parts
  - prompt: In a reflex arc, which part receives the stimulus, like heat on the skin?
    options:
    - Receptor
    - Effector
    - Motor neuron
    - Brain
    answer: Receptor
    difficulty: 1
    hints:
    - The arc starts where the change is sensed.
    - Skin has these.
    solution: The receptor in the skin senses the heat first.
    mistakes:
      Effector: c10s_sensory_motor
  - prompt: Which part of the brain controls voluntary actions like writing?
    options:
    - Forebrain (cerebrum)
    - Medulla
    - Cerebellum
    - Spinal cord
    answer: Forebrain (cerebrum)
    difficulty: 2
    hints:
    - Writing is done on purpose.
    - Which part thinks and plans?
    solution: Voluntary actions are controlled by the cerebrum in the forebrain.
    mistakes:
      Cerebellum: c10s6_brain_parts
      Medulla: c10s6_brain_parts
  - prompt: Which part of the brain controls vomiting and salivation?
    options:
    - Medulla
    - Cerebrum
    - Cerebellum
    - Pituitary
    answer: Medulla
    difficulty: 2
    hints:
    - They happen without you deciding.
    - The hindbrain part joined to the spinal cord.
    solution: The medulla controls involuntary actions such as vomiting and salivation.
    mistakes:
      Cerebellum: c10s6_brain_parts
      Cerebrum: c10s6_brain_parts
  - prompt: What protects the spinal cord?
    options:
    - The vertebral column (backbone)
    - The skull
    - The ribs
    - The muscles of the arm
    answer: The vertebral column (backbone)
    difficulty: 1
    hints:
    - The skull is for the brain.
    - The cord runs down your back.
    solution: The spinal cord runs inside the vertebral column, which protects it.
    mistakes:
      The skull: c10s6_protection
  - prompt: Muscles contract when a nerve signal arrives because of changes in…
    options:
    - Special proteins in the muscle cells
    - Bones
    - Blood sugar only
    - The skull
    answer: Special proteins in the muscle cells
    difficulty: 3
    hints:
    - Muscle cells change their shape.
    - Something inside them rearranges.
    solution: Muscle proteins change their shape and arrangement, so the cell shortens.
    mistakes:
      Bones: c10s6_protection
  - prompt: A sudden loud sound makes you blink. This is a…
    options:
    - Reflex action
    - Voluntary action
    - Hormone action
    - Tropism
    answer: Reflex action
    difficulty: 1
    hints:
    - You didn't decide to blink.
    - It was very fast.
    solution: A fast automatic response is a reflex action.
    mistakes:
      Voluntary action: t10_reflex_spinal
  - prompt: What crosses the synapse to pass the signal on?
    options:
    - A chemical
    - Blood
    - An electric wire
    - Light
    answer: A chemical
    difficulty: 2
    hints:
    - The impulse is electrical along the axon.
    - At the gap it changes form.
    solution: At the axon's end a chemical is released, which crosses the gap and starts a new impulse.
    mistakes:
      An electric wire: c10s6_neuron_parts
  - prompt: A person loses balance after an injury at the back of the head. Which part is probably hurt?
    options:
    - Cerebellum
    - Cerebrum
    - Medulla
    - Pituitary
    answer: Cerebellum
    difficulty: 2
    hints:
    - Balance and posture.
    - The 'little brain'.
    solution: The cerebellum controls balance and posture.
    mistakes:
      Cerebrum: c10s6_brain_parts
      Medulla: c10s6_brain_parts
- code: cbse10s.control.hormones
  title: Hormones in plants and animals
  after:
  - cbse10s.control.nervous
  notes: |
    Plants respond to stimuli by growth (tropisms): phototropism (shoots grow towards light), geotropism (roots
    grow down), hydrotropism (roots towards water), chemotropism (pollen tube towards the ovule). Plant
    hormones: auxin (made at shoot tips; collects on the shaded side and makes it grow more, bending the shoot
    to light), gibberellins (stem growth), cytokinins (cell division, in fruits and seeds), abscisic acid
    (inhibits growth, wilting of leaves). Animal hormones come from endocrine glands into the blood: thyroxine
    (thyroid; needs iodine, lack causes goitre), growth hormone (pituitary, the 'master gland'), adrenaline
    (adrenal; fight or flight: faster heartbeat and breathing), insulin (pancreas; lowers blood sugar, lack
    causes diabetes), testosterone and oestrogen (puberty changes). Feedback controls the amount released.
  explanations:
    text: Hormones are chemical messages carried in fluid or blood. They work more slowly than nerves but their effects last longer. In plants they control which way and how fast things grow; in animals they control growth, energy use and emergencies.
    visual: Draw a seedling in a box with a hole on one side. Auxin gathers on the dark side, those cells stretch more, and the shoot bends towards the light.
    step_by_step: 'Step 1: Plant or animal? Step 2: Plant: which direction is the growth (towards light, down, towards water)? Name the tropism and the hormone. Step 3: Animal: name the gland, its hormone, and what it controls.'
    real_world: 'Iodised salt prevents goitre: the thyroid needs iodine to make thyroxine.'
  picture:
    kind: compare
    columns:
    - title: Plant hormones
      points:
      - 'Auxin: bending towards light'
      - 'Gibberellins: stem growth'
      - 'Cytokinins: cell division'
      - 'Abscisic acid: stops growth, wilting'
    - title: Animal hormones
      points:
      - 'Thyroxine (thyroid): energy use'
      - 'Insulin (pancreas): blood sugar'
      - 'Adrenaline (adrenal): emergencies'
      - Growth hormone (pituitary)
    alt: Plant hormones auxin, gibberellins, cytokinins and abscisic acid, and animal hormones thyroxine, insulin, adrenaline and growth hormone, with what each does.
  activity:
    type: sort
    prompt: Which hormone does each job?
    bins:
    - Auxin
    - Gibberellin
    - Abscisic acid
    - Insulin
    - Adrenaline
    items:
    - label: Makes a shoot bend towards light
      bin: Auxin
      clue: Which plant hormone collects on the shaded side?
      why: Auxin makes the shaded side grow more, so the shoot bends to light.
    - label: Makes the stem grow longer
      bin: Gibberellin
      clue: Which plant hormone helps stems lengthen?
      why: Gibberellins help stems grow taller.
    - label: Closes stomata and makes leaves wilt in drought
      bin: Abscisic acid
      clue: Which plant hormone stops or slows growth?
      why: Abscisic acid inhibits growth and closes stomata.
    - label: Lowers the sugar in the blood
      bin: Insulin
      clue: Which hormone is missing in diabetes?
      why: Insulin from the pancreas lowers blood sugar.
    - label: Makes the heart beat faster when you're scared
      bin: Adrenaline
      clue: Which hormone gets the body ready for danger?
      why: Adrenaline from the adrenal glands prepares the body to act.
    - label: Collects on the shaded side of a shoot tip
      bin: Auxin
      clue: Which hormone is made at the shoot tip?
      why: Auxin moves away from light to the shaded side.
    - label: Made by the pancreas
      bin: Insulin
      clue: Which hormone does the pancreas release?
      why: The pancreas makes insulin.
    - label: Made by the adrenal glands
      bin: Adrenaline
      clue: What does its name come from?
      why: Adrenaline is made by the adrenal glands above the kidneys.
    - label: Inhibits plant growth
      bin: Abscisic acid
      clue: Is this hormone a promoter or an inhibitor?
      why: Abscisic acid is the growth-inhibiting plant hormone.
  lesson:
    - teach: Plants have no nerves but respond with hormones. Auxin makes cells on the shaded side of a shoot grow longer, so it bends towards light. Gibberellins help stems grow, cytokinins promote cell division, and abscisic acid slows growth and makes leaves wilt.
      picture:
        kind: compare
        columns:
        - title: Shoot
          points:
          - Grows towards light
          - Grows away from gravity
        - title: Root
          points:
          - Grows away from light
          - Grows towards gravity and water
        alt: Shoots grow towards light and away from gravity; roots grow away from light and towards gravity and water.
      check:
        prompt: Which hormone slows growth?
        options:
        - Abscisic acid
        - Auxin
        - Gibberellin
        answer: Abscisic acid
        why: It inhibits growth.
    - teach: 'Directional growth responses are tropisms: phototropism (light), geotropism (gravity), hydrotropism (water), chemotropism (chemicals, like a pollen tube growing to the ovule). Shoots are positively phototropic; roots are positively geotropic. The touch-me-not plant moves by changing water in cells, not by growth.'
      check:
        prompt: A pollen tube growing towards the ovule is…
        options:
        - Chemotropism
        - Phototropism
        - Geotropism
        answer: Chemotropism
        why: It follows chemicals.
    - teach: 'In animals, endocrine glands release hormones into the blood. Pituitary: growth hormone. Thyroid: thyroxin (needs iodine). Pancreas: insulin (lowers blood sugar). Adrenal: adrenaline (fight or flight). Testes: testosterone; ovaries: oestrogen. Feedback keeps hormone levels steady.'
      check:
        prompt: Too little growth hormone in childhood causes…
        options:
        - Dwarfism
        - Goitre
        - Diabetes
        answer: Dwarfism
        why: Growth hormone controls growth.
  items:
  - prompt: 'A plant shoot bending towards a window is an example of:'
    options:
    - Phototropism
    - Geotropism
    - Hydrotropism
    - Chemotropism
    answer: Phototropism
    difficulty: 1
    hints:
    - '''Photo'' means light.'
    - Shoots grow to light.
    solution: Growth towards light is phototropism.
    mistakes: {"Geotropism": "t10_tropism_names", "Hydrotropism": "t10_tropism_names"}
  - prompt: Which plant hormone makes the shaded side of a shoot grow faster?
    options:
    - Auxin
    - Abscisic acid
    - Insulin
    - Cytokinin
    answer: Auxin
    difficulty: 2
    hints:
    - It's made at the shoot tip.
    - It moves away from light.
    solution: Auxin collects on the shaded side and makes those cells grow longer, bending the shoot towards light.
    mistakes:
      Abscisic acid: c10s_plant_hormone
  - prompt: Iodine is needed by which gland?
    options:
    - Thyroid
    - Pancreas
    - Adrenal
    - Pituitary
    answer: Thyroid
    difficulty: 1
    hints:
    - It makes thyroxine.
    - Lack causes goitre.
    solution: The thyroid uses iodine to make thyroxine. Lack of iodine causes goitre.
    mistakes: {"Pancreas": "t10_thyroid_iodine", "Adrenal": "t10_thyroid_iodine"}
  - prompt: Which hormone lowers the level of sugar in the blood?
    options:
    - Insulin
    - Adrenaline
    - Thyroxine
    - Growth hormone
    answer: Insulin
    difficulty: 1
    hints:
    - Made by the pancreas.
    - Its lack causes diabetes.
    solution: Insulin, from the pancreas, helps cells take up glucose, lowering blood sugar.
    mistakes: {"Adrenaline": "t10_insulin", "Thyroxine": "t10_insulin"}
  - prompt: Your heart races when you are frightened. Which hormone causes this?
    options:
    - Adrenaline
    - Insulin
    - Oestrogen
    - Gibberellin
    answer: Adrenaline
    difficulty: 1
    hints:
    - Fight or flight.
    - From the adrenal glands.
    solution: 'Adrenaline prepares the body for action: faster heartbeat and breathing.'
    mistakes: {"Insulin": "t10_adrenaline", "Gibberellin": "t10_adrenaline"}
  - prompt: How do hormones differ from nerve impulses?
    options:
    - They are slower but their effects usually last longer
    - They are faster and shorter
    - They only work in plants
    - They travel along neurons
    answer: They are slower but their effects usually last longer
    difficulty: 2
    hints:
    - Hormones travel in the blood.
    - Nerves are electrical.
    solution: Hormones are carried in the blood, so they act more slowly than nerve impulses but for longer, and can reach many organs.
    mistakes: {"They are faster and shorter": "t10_hormone_speed", "They travel along neurons": "t10_hormone_speed"}
  - prompt: Roots grow downwards into the soil. This is…
    options:
    - Positive geotropism
    - Negative geotropism
    - Phototropism
    - Chemotropism
    answer: Positive geotropism
    difficulty: 2
    hints:
    - Geo means earth, the pull of gravity.
    - Roots grow towards it.
    solution: 'Roots grow towards gravity: positive geotropism.'
    mistakes:
      Negative geotropism: c10s6_tropism_dir
  - prompt: Which plant hormone helps stems grow taller?
    options:
    - Gibberellin
    - Abscisic acid
    - Insulin
    - Thyroxin
    answer: Gibberellin
    difficulty: 2
    hints:
    - It promotes growth.
    - Abscisic acid does the opposite.
    solution: Gibberellins help stem growth.
    mistakes:
      Abscisic acid: c10s_plant_hormone
  - prompt: Which plant hormone promotes cell division and is found in fruits and seeds?
    options:
    - Cytokinin
    - Auxin
    - Abscisic acid
    - Adrenaline
    answer: Cytokinin
    difficulty: 2
    hints:
    - '''Cyto'' means cell.'
    - Present where cells divide fast.
    solution: Cytokinins promote cell division.
    mistakes:
      Auxin: c10s_plant_hormone
  - prompt: Which gland is called the master gland because it controls others?
    options:
    - Pituitary
    - Thyroid
    - Adrenal
    - Pancreas
    answer: Pituitary
    difficulty: 2
    hints:
    - It sits at the base of the brain.
    - It makes growth hormone.
    solution: The pituitary releases hormones that control many other glands.
    mistakes:
      Thyroid: c10s6_master
  - prompt: Diabetes is caused by too little of which hormone?
    options:
    - Insulin
    - Adrenaline
    - Thyroxin
    - Testosterone
    answer: Insulin
    difficulty: 1
    hints:
    - Blood sugar stays too high.
    - The pancreas makes it.
    solution: 'Without enough insulin, blood sugar rises: diabetes.'
    mistakes:
      Thyroxin: t10_insulin
  - prompt: Which hormone brings the changes of puberty in boys?
    options:
    - Testosterone
    - Oestrogen
    - Insulin
    - Thyroxin
    answer: Testosterone
    difficulty: 1
    hints:
    - Made in the testes.
    - Not the ovary hormone.
    solution: Testosterone from the testes causes the changes of puberty in boys.
    mistakes:
      Oestrogen: c10s6_gland_hormone
  - prompt: How is the release of insulin controlled when blood sugar rises?
    options:
    - The pancreas senses it and releases more insulin
    - The brain stops breathing
    - Muscles release insulin
    - It never changes
    answer: The pancreas senses it and releases more insulin
    difficulty: 3
    hints:
    - Hormone levels follow need.
    - This is feedback.
    solution: High blood sugar is sensed by pancreas cells, which release more insulin; when sugar falls, less is released.
    mistakes:
      It never changes: c10s6_feedback
  - prompt: Goitre is linked to a lack of which mineral in food?
    options:
    - Iodine
    - Iron
    - Calcium
    - Sodium
    answer: Iodine
    difficulty: 1
    hints:
    - Thyroxin needs it.
    - It is added to table salt.
    solution: Iodine is needed to make thyroxin; lack of it swells the thyroid (goitre).
    mistakes:
      Iron: c10s6_salt
  - prompt: Tendrils of a pea plant coil around a support when they touch it. This is a response to…
    options:
    - Touch
    - Light
    - Water
    - Gravity
    answer: Touch
    difficulty: 2
    hints:
    - The tendril grows more on the side away from the support.
    - What did the tendril sense?
    solution: Tendrils respond to contact (touch) and wrap around the support.
    mistakes:
      Light: c10s6_tropism_dir
