# CBSE Class 10 Science (NCERT), chapter 12. Format: content/README.md.
subject: cbse10-sci
chapter: 12
title: Magnetic Effects of Electric Current
tips:
  c10s_hand_rules: "One rule uses the right hand gripping the wire, thumb along the current, to show the field. Fleming's left-hand rule gives the force on a wire instead."
  c10s_overload_short: "A short circuit is when live and neutral wires touch. When too many appliances draw current from one socket, it has a different name."
  t10_ac_50: "India's mains voltage is 220 V, but the question asks for the frequency. Indian AC changes direction a fixed number of cycles each second, fewer than the US's 60."
  t10_earth_wire: "If the metal body of an appliance becomes live, where should that current go instead of through you?"
  t10_field_n_to_s: "A compass placed outside a magnet points away from N and towards S."
  t10_fleming_left: "Fore-finger Field, seCond finger Current, thuMb Motion."
  t10_force_perpendicular: "The force is zero when the wire runs along the field. When is it biggest?"
  t10_lines_no_cross: "A compass needle at one point can only point one way."
  t10_motor: "Which device turns electrical energy into movement using a magnet and a coil?"
  t10_soft_iron: "An electromagnet should switch off when the current stops. Which core loses its magnetism easily?"
  t10_solenoid_uniform: "Inside a long coil the field lines are straight and equally spaced. What does that mean?"
  t10_stronger_magnet: "The field of a coil comes from the current. What would make more of it?"
concepts:
- code: cbse10s.mag.field
  title: Magnetic fields of currents
  notes: |
    A magnet's field is shown by field lines: they go from north to south outside the magnet, are closed
    loops, never cross, and are closer where the field is stronger. A current in a wire makes a magnetic field
    (Oersted): around a straight wire the lines are circles, direction by the right-hand thumb rule (thumb
    along the current, fingers curl with the field). A circular loop gives a field that is straight at its
    centre. A solenoid (a long coil) gives a field like a bar magnet with a uniform field inside; with a soft
    iron core it becomes an electromagnet. The field is stronger with more current and more turns.
  explanations:
    text: Electric current makes magnetism. A straight wire is surrounded by circular field lines; coil the wire into a solenoid and it behaves like a bar magnet that you can switch on and off. Put soft iron inside and it becomes a strong electromagnet.
    visual: 'Draw a wire coming straight up out of the page with concentric circles around it. Grip the wire with your right hand, thumb up: your fingers curl anticlockwise, the direction of the field.'
    step_by_step: 'Step 1: Find the current direction. Step 2: Use the right-hand thumb rule: thumb along the current, fingers give the field. Step 3: For a solenoid, the end where the current goes anticlockwise (seen from that end) is north.'
    real_world: Cranes in scrapyards lift cars with huge electromagnets, then drop them by switching off the current.
  picture:
    kind: flow
    steps:
    - Current flows in a wire
    - Circular magnetic field around it
    - 'Coil the wire: a solenoid'
    - Field like a bar magnet, uniform inside
    - 'Add a soft iron core: an electromagnet'
    alt: From a current in a wire to a solenoid to an electromagnet.
  activity:
    type: sort
    prompt: Does each change make the magnetic field stronger, weaker, or not change its strength?
    bins:
    - Stronger
    - Weaker
    - Same strength
    items:
    - label: More turns in the coil
      bin: Stronger
      clue: Does each turn add its own field?
      why: Each turn adds to the field, so more turns make it stronger.
    - label: A bigger current
      bin: Stronger
      clue: Does the field depend on how much current flows?
      why: More current makes a stronger field.
    - label: A soft iron core inside the coil
      bin: Stronger
      clue: Why does an electromagnet have an iron core?
      why: Soft iron becomes magnetised and adds to the field.
    - label: Moving further from a straight wire
      bin: Weaker
      clue: Are the field lines closer together near the wire or far away?
      why: The field weakens with distance from the wire.
    - label: Reversing the current
      bin: Same strength
      clue: Does it change how much current flows, or which way?
      why: The field's direction flips, but its strength stays the same.
    - label: Fewer turns in the coil
      bin: Weaker
      clue: 'Fewer turns: fewer fields adding up?'
      why: Fewer turns, weaker field.
    - label: A smaller current
      bin: Weaker
      clue: 'Less current: more or less field?'
      why: Less current makes a weaker field.
    - label: Moving closer to a straight wire
      bin: Stronger
      clue: Where are the circles of field lines closest?
      why: 'Near the wire the field lines are close together: stronger.'
  items:
  - prompt: 'Magnetic field lines outside a bar magnet go:'
    options:
    - From the north pole to the south pole
    - From south to north
    - In straight lines away from both poles
    - Nowhere; there is no field outside
    answer: From the north pole to the south pole
    difficulty: 1
    hints:
    - A compass needle's north end follows them.
    - They are closed loops.
    solution: Outside a magnet, field lines go from N to S; inside, from S to N.
    mistakes: {"From south to north": "t10_field_n_to_s", "Nowhere; there is no field outside": "t10_field_n_to_s"}
  - prompt: Why do two magnetic field lines never cross?
    options:
    - The compass would point two ways at once at that point
    - They repel each other like charges
    - They are too thin
    - They do cross near the poles
    answer: The compass would point two ways at once at that point
    difficulty: 2
    hints:
    - A field line shows the direction of the field.
    - One point has one direction.
    solution: At any point the field has one direction. If lines crossed, there would be two directions there.
    mistakes: {"They repel each other like charges": "t10_lines_no_cross", "They do cross near the poles": "t10_lines_no_cross"}
  - prompt: Which rule gives the direction of the field around a straight current-carrying wire?
    options:
    - Right-hand thumb rule
    - Fleming's left-hand rule
    - Fleming's right-hand rule
    - Ohm's law
    answer: Right-hand thumb rule
    difficulty: 1
    hints:
    - Grip the wire.
    - Thumb along the current.
    solution: 'The right-hand thumb rule: thumb along the current, curled fingers show the field.'
    mistakes:
      Fleming's left-hand rule: c10s_hand_rules
  - prompt: 'The field inside a long solenoid is:'
    options:
    - Uniform, with parallel lines
    - Zero
    - Circular
    - Strongest at the ends only
    answer: Uniform, with parallel lines
    difficulty: 2
    hints:
    - Like inside a bar magnet.
    - Straight, evenly spaced lines.
    solution: 'Inside a long solenoid the field lines are parallel and evenly spaced: a uniform field.'
    mistakes: {"Zero": "t10_solenoid_uniform", "Strongest at the ends only": "t10_solenoid_uniform"}
  - prompt: How can you make an electromagnet stronger?
    options:
    - Increase the current or the number of turns
    - Use a plastic core
    - Use thinner insulation
    - Reverse the current
    answer: Increase the current or the number of turns
    difficulty: 1
    hints:
    - More current, more field.
    - More turns add up.
    solution: More current and more turns give a stronger field; a soft iron core helps too.
    mistakes: {"Use a plastic core": "t10_stronger_magnet", "Reverse the current": "t10_stronger_magnet"}
  - prompt: Why is soft iron used for the core of an electromagnet?
    options:
    - It magnetises strongly and loses its magnetism when the current stops
    - It is a good insulator
    - It never becomes magnetic
    - It is cheap and heavy
    answer: It magnetises strongly and loses its magnetism when the current stops
    difficulty: 2
    hints:
    - We want to switch it off.
    - Steel would stay magnetised.
    solution: Soft iron becomes strongly magnetic but doesn't keep its magnetism, so the electromagnet can be switched off.
    mistakes: {"It is a good insulator": "t10_soft_iron", "It never becomes magnetic": "t10_soft_iron"}
- code: cbse10s.mag.motor
  title: Force on a current and domestic circuits
  after:
  - cbse10s.mag.field
  notes: |
    A current-carrying conductor in a magnetic field feels a force (largest when it is perpendicular to the
    field). Fleming's left-hand rule: forefinger = field, middle finger = current, thumb = motion (force).
    This is how electric motors, loudspeakers and fans work. Medical imaging (MRI) uses magnetic fields made by
    currents in the body. Domestic circuits in India: 220 V, 50 Hz AC; live wire (red/brown insulation),
    neutral (black/blue), earth (green) connected to metal bodies of appliances for safety. Circuits of 5 A
    (lights, fans) and 15 A (heaters, geysers). Fuses and MCBs protect against overloading (too many
    appliances) and short circuits (live touches neutral). Appliances are connected in parallel.
  explanations:
    text: A wire carrying current in a magnetic field gets pushed sideways. Fleming's left-hand rule tells you which way. This push turns electric motors. At home, safe wiring uses a live, a neutral and an earth wire, with fuses or circuit breakers to cut off dangerous currents.
    visual: 'Hold out your left hand with thumb, first finger and middle finger at right angles: First finger = Field, seCond finger = Current, thuMb = Motion.'
    step_by_step: 'Step 1: Find the field direction (N to S). Step 2: Find the current direction. Step 3: Point the left hand''s forefinger along the field and middle finger along the current. Step 4: The thumb gives the force.'
    real_world: A ceiling fan's motor spins because coils carrying current sit in a magnetic field and are pushed round and round.
  picture:
    kind: compare
    columns:
    - title: Live wire
      points:
      - Red or brown insulation
      - At 220 V
      - Fuse or switch goes here
    - title: Neutral wire
      points:
      - Black or blue insulation
      - At about 0 V
      - Completes the circuit
    - title: Earth wire
      points:
      - Green insulation
      - Joined to metal body
      - Carries leaking current to ground
    alt: 'The three wires in a home circuit: live (red or brown, 220 volts), neutral (black or blue), and earth (green, joined to metal parts for safety).'
  activity:
    type: sort
    prompt: Which part of a home's wiring does each describe?
    bins:
    - Live wire
    - Neutral wire
    - Earth wire
    - Fuse or MCB
    items:
    - label: Brings current at 220 V into the house
      bin: Live wire
      clue: Which wire is at high voltage?
      why: The live wire is at 220 V.
    - label: Is at zero potential and completes the circuit
      bin: Neutral wire
      clue: Which wire carries current back, at 0 V?
      why: The neutral wire is at 0 V and completes the circuit.
    - label: Joins an iron's metal body to the ground
      bin: Earth wire
      clue: Which wire protects you if the metal body becomes live?
      why: The earth wire carries leaked current safely into the ground.
    - label: Melts or trips if too much current flows
      bin: Fuse or MCB
      clue: What stops an overload from overheating the wires?
      why: A fuse melts, or an MCB trips, and breaks the circuit.
    - label: The switch should be fitted on it
      bin: Live wire
      clue: If the switch is off, which wire should be cut off?
      why: The switch goes on the live wire, so a switched-off appliance is not live.
    - label: Has green insulation
      bin: Earth wire
      clue: What colour is the safety wire?
      why: Earth is green (or green and yellow).
    - label: Has red or brown insulation
      bin: Live wire
      clue: Which colour warns of 220 V?
      why: Live is red (older) or brown (newer).
    - label: Has black or blue insulation
      bin: Neutral wire
      clue: Which wire returns current?
      why: Neutral is black (older) or blue (newer).
    - label: Can be reset after an overload
      bin: Fuse or MCB
      clue: A fuse melts. Which safety device just switches back on?
      why: A miniature circuit breaker (MCB) trips and can be reset.
  items:
  - prompt: 'In Fleming''s left-hand rule, the thumb shows the direction of:'
    options:
    - The force (motion)
    - The current
    - The magnetic field
    - The voltage
    answer: The force (motion)
    difficulty: 1
    hints:
    - thuMb = Motion.
    - Forefinger is field, middle finger is current.
    solution: The thumb points along the force on the conductor.
    mistakes: {"The current": "t10_fleming_left", "The magnetic field": "t10_fleming_left"}
  - prompt: When is the force on a current-carrying wire in a magnetic field largest?
    options:
    - When the wire is perpendicular to the field
    - When it is parallel to the field
    - When there is no current
    - When the wire is made of iron
    answer: When the wire is perpendicular to the field
    difficulty: 2
    hints:
    - Parallel gives no force.
    - Right angles.
    solution: The force is greatest when the current is at right angles to the field and zero when parallel.
    mistakes: {"When it is parallel to the field": "t10_force_perpendicular", "When there is no current": "t10_force_perpendicular"}
  - prompt: What is the purpose of the earth wire?
    options:
    - To carry leaking current safely to the ground if the metal body becomes live
    - To bring current into the house
    - To make appliances work faster
    - To reduce the electricity bill
    answer: To carry leaking current safely to the ground if the metal body becomes live
    difficulty: 1
    hints:
    - It is joined to metal parts.
    - Prevents shocks.
    solution: If a fault makes the metal case live, the earth wire takes the current to the ground so the user doesn't get a shock.
    mistakes: {"To bring current into the house": "t10_earth_wire", "To reduce the electricity bill": "t10_earth_wire"}
  - prompt: What is the frequency of AC mains supply in India, in hertz?
    answer: '50'
    check: 100/2
    difficulty: 1
    hints:
    - The direction changes 100 times a second.
    - Half of that.
    solution: AC in India is 220 V at 50 Hz.
    mistakes: {"220": "t10_ac_50", "60": "t10_ac_50"}
  - prompt: 'Too many appliances are switched on from one socket and the fuse melts. This is due to:'
    options:
    - Overloading
    - A short circuit
    - Earthing
    - Low voltage
    answer: Overloading
    difficulty: 2
    hints:
    - Too much total current.
    - A short circuit is live touching neutral.
    solution: Drawing too much current from one circuit is overloading.
    mistakes:
      A short circuit: c10s_overload_short
  - prompt: Which device works on the force on a current-carrying conductor in a magnetic field?
    options:
    - Electric motor
    - Electric heater
    - Fuse
    - Bulb
    answer: Electric motor
    difficulty: 2
    hints:
    - It turns electricity into motion.
    - Fans and mixers.
    solution: An electric motor turns because current-carrying coils are pushed by the magnetic field.
    mistakes: {"Electric heater": "t10_motor", "Fuse": "t10_motor"}
