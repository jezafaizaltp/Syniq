# CBSE Class 10 Science (NCERT), chapter 12. Format: content/README.md.
subject: cbse10-sci
chapter: 12
title: Magnetic Effects of Electric Current
tips:
  c10s_hand_rules: "One rule uses the right hand gripping the wire, thumb along the current, to show the field. Fleming's left-hand rule gives the force on a wire instead."
  c10s_overload_short: "A short circuit is when live and neutral wires touch. When too many appliances draw current from one socket, it has a different name."
  c10s12_too_many: "Overloading means too many appliances on one socket. Here no appliance is involved: the two wires touch each other."
  t10_ac_50: "India's mains voltage is 220 V, but the question asks for the frequency. Indian AC changes direction a fixed number of cycles each second, fewer than the US's 60."
  c10s12_hz_volts: "50 is the frequency in hertz. This question asks for the voltage of the mains supply."
  t10_earth_wire: "If the metal body of an appliance becomes live, where should that current go instead of through you?"
  t10_field_n_to_s: "A compass placed outside a magnet points away from N and towards S."
  t10_fleming_left: "Fore-finger Field, seCond finger Current, thuMb Motion."
  t10_force_perpendicular: "The force is zero when the wire runs along the field. When is it biggest?"
  c10s12_along: "The force is biggest when the wire crosses the field at right angles. Picture the wire turning until it lies along the field lines: what happens to the force?"
  t10_lines_no_cross: "A compass needle at one point can only point one way."
  t10_motor: "Which device turns electrical energy into movement using a magnet and a coil?"
  t10_soft_iron: "An electromagnet should switch off when the current stops. Which core loses its magnetism easily?"
  t10_solenoid_uniform: "Inside a long coil the field lines are straight and equally spaced. What does that mean?"
  t10_stronger_magnet: "The field of a coil comes from the current. What would make more of it?"
  c10s12_field_strength: Field lines bunch together where the field is strong and spread out where it is weak.
  c10s12_wire_field: The field around a straight wire forms circles. It is stronger closer to the wire and with more current.
  c10s12_reverse: Reversing the current, or the field, reverses the force. Reversing both brings it back.
  c10s12_wires: 'Indian wiring: live (red), neutral (black) and earth (green). Which wire does this job?'
  c10s12_safety: A fuse or MCB cuts the current when it gets too large; the earth wire carries leakage safely to the ground.
concepts:
- code: cbse10s.mag.field
  title: Magnetic fields of currents
  notes: |
    A magnet's field is shown by field lines: they go from north to south outside the magnet, are closed
    loops, never cross, and are closer where the field is stronger. A current in a wire makes a magnetic field
    (Oersted): around a straight wire the lines are circles, direction by the right-hand thumb rule (thumb
    along the current, fingers curl with the field). A circular loop gives a field that is straight at its
    centre. A solenoid (a long coil) gives a field like a bar magnet with a uniform field inside; with a soft
    iron core it becomes an electromagnet. The field is stronger with more current and more turns.
  explanations:
    text: Electric current makes magnetism. A straight wire is surrounded by circular field lines; coil the wire into a solenoid and it behaves like a bar magnet that you can switch on and off. Put soft iron inside and it becomes a strong electromagnet.
    visual: 'Draw a wire coming straight up out of the page with concentric circles around it. Grip the wire with your right hand, thumb up: your fingers curl anticlockwise, the direction of the field.'
    step_by_step: 'Step 1: Find the current direction. Step 2: Use the right-hand thumb rule: thumb along the current, fingers give the field. Step 3: For a solenoid, the end where the current goes anticlockwise (seen from that end) is north.'
    real_world: Cranes in scrapyards lift cars with huge electromagnets, then drop them by switching off the current.
  picture:
    kind: flow
    steps:
    - Current flows in a wire
    - Circular magnetic field around it
    - 'Coil the wire: a solenoid'
    - Field like a bar magnet, uniform inside
    - 'Add a soft iron core: an electromagnet'
    alt: From a current in a wire to a solenoid to an electromagnet.
  activity:
    type: sort
    prompt: Does each change make the magnetic field stronger, weaker, or not change its strength?
    bins:
    - Stronger
    - Weaker
    - Same strength
    items:
    - label: More turns in the coil
      bin: Stronger
      clue: Does each turn add its own field?
      why: Each turn adds to the field, so more turns make it stronger.
    - label: A bigger current
      bin: Stronger
      clue: Does the field depend on how much current flows?
      why: More current makes a stronger field.
    - label: A soft iron core inside the coil
      bin: Stronger
      clue: Why does an electromagnet have an iron core?
      why: Soft iron becomes magnetised and adds to the field.
    - label: Moving further from a straight wire
      bin: Weaker
      clue: Are the field lines closer together near the wire or far away?
      why: The field weakens with distance from the wire.
    - label: Reversing the current
      bin: Same strength
      clue: Does it change how much current flows, or which way?
      why: The field's direction flips, but its strength stays the same.
    - label: Fewer turns in the coil
      bin: Weaker
      clue: 'Fewer turns: fewer fields adding up?'
      why: Fewer turns, weaker field.
    - label: A smaller current
      bin: Weaker
      clue: 'Less current: more or less field?'
      why: Less current makes a weaker field.
    - label: Moving closer to a straight wire
      bin: Stronger
      clue: Where are the circles of field lines closest?
      why: 'Near the wire the field lines are close together: stronger.'
  lesson:
    - teach: A compass needle is a small magnet. Around a bar magnet, field lines go from the north pole to the south pole outside the magnet, and S to N inside, forming closed loops. Where lines are close the field is strong. Two lines never cross.
      check:
        prompt: Where is the field of a bar magnet strongest?
        options:
        - Near the poles
        - In the middle of its side
        - Far away
        answer: Near the poles
        why: Lines are crowded there.
      ways:
      - style: visual
        teach: Field lines around a bar magnet, followed with a compass from one end to the other.
        picture:
          kind: flow
          steps:
          - Leave the north pole
          - Curve round outside
          - Enter the south pole
          - Run S to N inside
          - Closed loop
          alt: Field lines leave the north pole, curve round outside the magnet, enter the south pole, run from south to north inside, and form a closed loop.
      - style: real_world
        teach: Sprinkle iron filings on paper over a magnet and tap it gently. The filings line up along the field lines and crowd near the poles, where the field is strongest.
    - teach: 'Oersted found that a current in a wire deflects a compass: electricity makes magnetism. Around a straight wire, field lines are concentric circles. The right-hand thumb rule: grip the wire with the thumb along the current; the curled fingers show the field.'
      picture:
        kind: compare
        columns:
        - title: Straight wire
          points:
          - Circles around the wire
          - Stronger near the wire
        - title: Circular loop
          points:
          - Lines straight at the centre
          - More turns, stronger field
        - title: Solenoid
          points:
          - Like a bar magnet
          - Uniform field inside
        alt: 'Straight wire: circular field lines, stronger near the wire. Circular loop: nearly straight lines at its centre, stronger with more turns. Solenoid: field like a bar magnet with a uniform field inside.'
      check:
        prompt: Doubling the current in a straight wire makes the field…
        options:
        - Stronger
        - Weaker
        - Reverse
        answer: Stronger
        why: The field grows with current.
      ways:
      - style: step_by_step
        teach: 'Use the right-hand thumb rule. Step 1: Imagine holding the wire in your right hand. Step 2: Point your thumb the way the current flows. Step 3: Your fingers curl round the wire. Step 4: The curl shows the direction of the magnetic field circles.'
      - style: real_world
        teach: Lay a compass under a wire joined to a cell and a switch. Close the switch and the needle swings; open it and the needle swings back. That is Oersted's discovery on your desk.
    - teach: A solenoid is a long coil of wire. Its field is like a bar magnet's, with a uniform field inside. Putting a soft iron core inside makes an electromagnet, which is magnetic only while current flows. More turns, more current or a core make it stronger.
      check:
        prompt: An electromagnet loses its magnetism when…
        options:
        - The current stops
        - It gets cold
        - It is turned around
        answer: The current stops
        why: Soft iron loses magnetism easily.
      ways:
      - style: visual
        teach: Three ways to make an electromagnet stronger, and one that does not help.
        picture:
          kind: compare
          columns:
          - title: Makes it stronger
            points:
            - more turns of wire
            - more current
            - soft iron core
          - title: Does not help
            points:
            - wooden or plastic core
            - thinner insulation alone
          alt: More turns, more current and a soft iron core make an electromagnet stronger. A wooden or plastic core, or only changing the insulation, does not help.
      - style: real_world
        teach: 'Scrapyards use huge electromagnets on cranes to lift old cars. Switch the current on to pick a car up, switch it off to drop it: a permanent magnet could not let go.'
  items:
  - prompt: 'Magnetic field lines outside a bar magnet go:'
    options:
    - From the north pole to the south pole
    - From south to north
    - In straight lines away from both poles
    - Nowhere; there is no field outside
    answer: From the north pole to the south pole
    difficulty: 1
    hints:
    - A compass needle's north end follows them.
    - They are closed loops.
    solution: Outside a magnet, field lines go from N to S; inside, from S to N.
    mistakes: {"From south to north": "t10_field_n_to_s", "Nowhere; there is no field outside": "t10_field_n_to_s"}
  - prompt: Why do two magnetic field lines never cross?
    options:
    - "The compass would point two ways at once at that point"
    - "They repel each other like two equal charges do"
    - "They are too thin to meet each other anywhere"
    - "They do cross, but only near the poles of a magnet"
    answer: The compass would point two ways at once at that point
    difficulty: 2
    hints:
    - A field line shows the direction of the field.
    - One point has one direction.
    solution: At any point the field has one direction. If lines crossed, there would be two directions there.
    mistakes: {"They repel each other like two equal charges do": "t10_lines_no_cross", "They do cross, but only near the poles of a magnet": "t10_lines_no_cross"}
  - prompt: Which rule gives the direction of the field around a straight current-carrying wire?
    options:
    - Right-hand thumb rule
    - Fleming's left-hand rule
    - Fleming's right-hand rule
    - Ohm's law
    answer: Right-hand thumb rule
    difficulty: 1
    hints:
    - Grip the wire.
    - Thumb along the current.
    solution: 'The right-hand thumb rule: thumb along the current, curled fingers show the field.'
    mistakes:
      Fleming's left-hand rule: c10s_hand_rules
  - prompt: 'The field inside a long solenoid is:'
    options:
    - Uniform, with parallel lines
    - Zero
    - Circular
    - Strongest at the ends only
    answer: Uniform, with parallel lines
    difficulty: 2
    hints:
    - Like inside a bar magnet.
    - Straight, evenly spaced lines.
    solution: 'Inside a long solenoid the field lines are parallel and evenly spaced: a uniform field.'
    mistakes: {"Zero": "t10_solenoid_uniform", "Strongest at the ends only": "t10_solenoid_uniform"}
  - prompt: How can you make an electromagnet stronger?
    options:
    - "Increase the current or the number of turns"
    - "Use a plastic core in place of soft iron"
    - "Use thinner insulation on the copper wire"
    - "Reverse the direction of the current"
    answer: Increase the current or the number of turns
    difficulty: 1
    hints:
    - More current, more field.
    - More turns add up.
    solution: More current and more turns give a stronger field; a soft iron core helps too.
    mistakes: {"Use a plastic core in place of soft iron": "t10_stronger_magnet", "Reverse the direction of the current": "t10_stronger_magnet"}
  - prompt: Why is soft iron used for the core of an electromagnet?
    options:
    - "It magnetises strongly and loses its magnetism when the current stops"
    - "It is a good insulator, so the current stays inside the coil"
    - "It never becomes magnetic, so it does not disturb the field"
    - "It is cheap and heavy, which keeps the magnet steady"
    answer: It magnetises strongly and loses its magnetism when the current stops
    difficulty: 2
    hints:
    - We want to switch it off.
    - Steel would stay magnetised.
    solution: Soft iron becomes strongly magnetic but doesn't keep its magnetism, so the electromagnet can be switched off.
    mistakes: {"It is a good insulator, so the current stays inside the coil": "t10_soft_iron", "It never becomes magnetic, so it does not disturb the field": "t10_soft_iron"}
  - prompt: Who first showed that an electric current produces a magnetic field?
    options:
    - Hans Christian Oersted
    - Michael Faraday
    - Isaac Newton
    - Georg Ohm
    answer: Hans Christian Oersted
    difficulty: 1
    hints:
    - He saw a compass needle move near a wire.
    - In 1820.
    solution: Oersted noticed a compass deflect near a current-carrying wire.
    mistakes:
      Georg Ohm: c10s12_wire_field
  - prompt: What shape are the field lines around a straight current-carrying wire?
    options:
    - Concentric circles
    - Straight parallel lines
    - Spirals going out
    - Zig-zags
    answer: Concentric circles
    difficulty: 1
    hints:
    - Sprinkle iron filings on a card around the wire.
    - They wrap around it.
    solution: The field lines are circles centred on the wire.
    mistakes:
      Straight parallel lines: t10_solenoid_uniform
  - prompt: A compass is moved further from a current-carrying wire. What happens to its deflection?
    options:
    - It gets smaller
    - It gets bigger
    - It stays the same
    - It reverses
    answer: It gets smaller
    difficulty: 2
    hints:
    - How does the field change with distance?
    - Lines spread out further away.
    solution: The field weakens with distance, so the needle turns less.
    mistakes:
      It gets bigger: c10s12_wire_field
  - prompt: The current in a wire is reversed. What happens to the direction of its magnetic field?
    options:
    - It reverses
    - It stays the same
    - It disappears
    - It becomes straight
    answer: It reverses
    difficulty: 1
    hints:
    - Use the right-hand thumb rule.
    - Point the thumb the other way.
    solution: Reversing the current reverses the field.
    mistakes:
      It stays the same: c10s_hand_rules
  - prompt: Field lines are closer together at A than at B. Where is the field stronger?
    options:
    - At A
    - At B
    - The same at both
    - Cannot tell
    answer: At A
    difficulty: 1
    hints:
    - Crowded lines mean something.
    - Think of the poles of a magnet.
    solution: Closer lines show a stronger field.
    mistakes:
      At B: c10s12_field_strength
  - prompt: A solenoid behaves like a…
    options:
    - Bar magnet
    - Horseshoe battery
    - Light bulb
    - Resistor only
    answer: Bar magnet
    difficulty: 1
    hints:
    - One end acts as a north pole.
    - The other end as a south pole.
    solution: A current-carrying solenoid has a field like a bar magnet.
    mistakes:
      Resistor only: t10_solenoid_uniform
  - prompt: Which of these does NOT make an electromagnet stronger?
    options:
    - Using a plastic core
    - More turns
    - More current
    - A soft iron core
    answer: Using a plastic core
    difficulty: 2
    hints:
    - Three of these help.
    - Which core material doesn't help?
    solution: Plastic is not magnetic, so it doesn't strengthen the field.
    mistakes:
      More turns: t10_stronger_magnet
  - prompt: Where do magnetic field lines go inside a bar magnet?
    options:
    - From south to north
    - From north to south
    - Nowhere
    - In circles around it
    answer: From south to north
    difficulty: 2
    hints:
    - Outside they go N to S.
    - They form closed loops.
    solution: To close the loop, lines inside run from S to N.
    mistakes:
      From north to south: t10_field_n_to_s
  - prompt: Why is the field inside a long solenoid useful?
    options:
    - "It is uniform, the same at all points"
    - "It is zero, so nothing inside is disturbed"
    - "It keeps changing direction along the coil"
    - "It is circular, going round the wire"
    answer: It is uniform, the same at all points
    difficulty: 2
    hints:
    - The lines inside are straight and parallel.
    - Equally spaced.
    solution: Straight, parallel, equally spaced lines mean a uniform field, useful for magnetising things.
    mistakes:
      "It is circular, going round the wire": c10s12_wire_field
  - prompt: 'Assertion (A): The core of an electromagnet is made of soft iron, not steel.

      Reason (R): Soft iron loses its magnetism as soon as the current is switched off.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. An electromagnet must switch off with the current, and soft iron does that; steel would stay magnetised. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Kabir places a compass 2 cm from a long straight wire and sees a small deflection. Kabir wants a bigger deflection without moving the compass. What should Kabir do?'
    options:
    - Increase the current in the wire
    - Reverse the current in the wire
    - Use a thinner compass needle
    answer: Increase the current in the wire
    hints:
    - What decides how strong the field around a wire is?
    - Reversing changes only the direction.
    solution: The field around a straight wire is stronger with more current, so the needle swings further. Reversing the current only flips the direction.
    mistakes:
      Reverse the current in the wire: c10s12_reverse
      Use a thinner compass needle: c10s12_wire_field
    exam: case
    difficulty: 2
  - prompt: 'Situation: Current flows vertically upward in a wire passing through a horizontal card. Looking down from above, which way do the field lines go?'
    options:
    - Anticlockwise
    - Clockwise
    - Straight out from the wire
    answer: Anticlockwise
    hints:
    - Use the right-hand thumb rule with the thumb pointing up.
    - Look at your curled fingers from above.
    solution: With the thumb pointing up, the fingers curl anticlockwise when seen from above, so the field lines go anticlockwise.
    mistakes:
      Clockwise: c10s_hand_rules
      Straight out from the wire: c10s12_wire_field
    exam: competency
    difficulty: 2
- code: cbse10s.mag.motor
  title: Force on a current and domestic circuits
  after:
  - cbse10s.mag.field
  notes: |
    A current-carrying conductor in a magnetic field feels a force (largest when it is perpendicular to the
    field). Fleming's left-hand rule: forefinger = field, middle finger = current, thumb = motion (force).
    This is how electric motors, loudspeakers and fans work. Medical imaging (MRI) uses magnetic fields made by
    currents in the body. Domestic circuits in India: 220 V, 50 Hz AC; live wire (red/brown insulation),
    neutral (black/blue), earth (green) connected to metal bodies of appliances for safety. Circuits of 5 A
    (lights, fans) and 15 A (heaters, geysers). Fuses and MCBs protect against overloading (too many
    appliances) and short circuits (live touches neutral). Appliances are connected in parallel.
  explanations:
    text: A wire carrying current in a magnetic field gets pushed sideways. Fleming's left-hand rule tells you which way. This push turns electric motors. At home, safe wiring uses a live, a neutral and an earth wire, with fuses or circuit breakers to cut off dangerous currents.
    visual: 'Hold out your left hand with thumb, first finger and middle finger at right angles: First finger = Field, seCond finger = Current, thuMb = Motion.'
    step_by_step: 'Step 1: Find the field direction (N to S). Step 2: Find the current direction. Step 3: Point the left hand''s forefinger along the field and middle finger along the current. Step 4: The thumb gives the force.'
    real_world: A ceiling fan's motor spins because coils carrying current sit in a magnetic field and are pushed round and round.
  picture:
    kind: compare
    columns:
    - title: Live wire
      points:
      - Red or brown insulation
      - At 220 V
      - Fuse or switch goes here
    - title: Neutral wire
      points:
      - Black or blue insulation
      - At about 0 V
      - Completes the circuit
    - title: Earth wire
      points:
      - Green insulation
      - Joined to metal body
      - Carries leaking current to ground
    alt: 'The three wires in a home circuit: live (red or brown, 220 volts), neutral (black or blue), and earth (green, joined to metal parts for safety).'
  activity:
    type: sort
    prompt: Which part of a home's wiring does each describe?
    bins:
    - Live wire
    - Neutral wire
    - Earth wire
    - Fuse or MCB
    items:
    - label: Brings current at 220 V into the house
      bin: Live wire
      clue: Which wire is at high voltage?
      why: The live wire is at 220 V.
    - label: Is at zero potential and completes the circuit
      bin: Neutral wire
      clue: Which wire carries current back, at 0 V?
      why: The neutral wire is at 0 V and completes the circuit.
    - label: Joins an iron's metal body to the ground
      bin: Earth wire
      clue: Which wire protects you if the metal body becomes live?
      why: The earth wire carries leaked current safely into the ground.
    - label: Melts or trips if too much current flows
      bin: Fuse or MCB
      clue: What stops an overload from overheating the wires?
      why: A fuse melts, or an MCB trips, and breaks the circuit.
    - label: The switch should be fitted on it
      bin: Live wire
      clue: If the switch is off, which wire should be cut off?
      why: The switch goes on the live wire, so a switched-off appliance is not live.
    - label: Has green insulation
      bin: Earth wire
      clue: What colour is the safety wire?
      why: Earth is green (or green and yellow).
    - label: Has red or brown insulation
      bin: Live wire
      clue: Which colour warns of 220 V?
      why: Live is red (older) or brown (newer).
    - label: Has black or blue insulation
      bin: Neutral wire
      clue: Which wire returns current?
      why: Neutral is black (older) or blue (newer).
    - label: Can be reset after an overload
      bin: Fuse or MCB
      clue: A fuse melts. Which safety device just switches back on?
      why: A miniature circuit breaker (MCB) trips and can be reset.
  lesson:
    - teach: 'A current-carrying wire in a magnetic field feels a force. The force is largest when the current is at right angles to the field. Fleming''s left-hand rule: first finger = field, second finger = current, thumb = motion (force). Reversing current or field reverses the force.'
      check:
        prompt: In Fleming's left-hand rule, the first finger shows…
        options:
        - Field
        - Current
        - Force
        answer: Field
        why: First finger, Field.
      ways:
      - style: step_by_step
        teach: 'Use Fleming''s left-hand rule. Step 1: Hold the thumb, first finger and second finger of your left hand at right angles. Step 2: Point the first finger along the field (N to S). Step 3: Point the second finger along the current. Step 4: The thumb now shows the force.'
      - style: visual
        teach: How the force changes when you reverse things.
        picture:
          kind: compare
          columns:
          - title: Reverse current only
            points:
            - force reverses
          - title: Reverse field only
            points:
            - force reverses
          - title: Reverse both
            points:
            - force stays the same way
          alt: Reversing only the current reverses the force. Reversing only the field reverses the force. Reversing both leaves the force in the same direction.
    - teach: This force is used in electric motors (fans, mixers, washing machines) and loudspeakers. It is also used in MRI scanners, where magnetic fields inside the body make images.
      check:
        prompt: An electric motor changes electrical energy into…
        options:
        - Mechanical energy
        - Heat only
        - Light
        answer: Mechanical energy
        why: It makes things turn.
      ways:
      - style: visual
        teach: Inside an electric motor, from current to spinning, step by step.
        picture:
          kind: flow
          steps:
          - Current enters the coil
          - Magnet's field pushes the sides
          - Sides pushed opposite ways
          - Coil turns
          - Split ring flips current
          - Coil keeps turning
          alt: Current enters the coil, the magnet's field pushes the two sides in opposite directions, the coil turns, the split ring reverses the current each half turn, and the coil keeps turning.
      - style: real_world
        teach: A ceiling fan, a mixer and a washing machine all have a coil spinning between magnets. The same push on a current makes a loudspeaker cone move back and forth to make sound.
    - teach: 'Domestic circuits in India: 220 V AC at 50 Hz. Live wire (red), neutral (black) and earth (green). Appliances are in parallel. The earth wire protects from shocks by taking leakage current to the ground. Fuses and MCBs protect against overloading and short circuits.'
      picture:
        kind: compare
        columns:
        - title: Live
          points:
          - Red insulation
          - 220 V
        - title: Neutral
          points:
          - Black insulation
          - 0 V
        - title: Earth
          points:
          - Green insulation
          - Safety path to the ground
        alt: Live wire has red insulation at 220 V, neutral has black at 0 V, earth has green and gives a safety path to the ground.
      check:
        prompt: Which wire has green insulation?
        options:
        - Earth
        - Live
        - Neutral
        answer: Earth
        why: Green is earth.
      ways:
      - style: step_by_step
        teach: 'Check a home circuit for safety. Step 1: Live (red) brings current in at 220 V. Step 2: Neutral (black) takes it back. Step 3: Earth (green) is joined to metal bodies of appliances. Step 4: A fuse or MCB on the live wire cuts off a dangerous current.'
      - style: real_world
        teach: Plugging a heater, an iron and a kettle into one multi-plug can overload the socket. The wires grow hot; an MCB trips to stop a fire.
  items:
  - prompt: 'In Fleming''s left-hand rule, the thumb shows the direction of:'
    options:
    - The force (motion)
    - The current
    - The magnetic field
    - The voltage
    answer: The force (motion)
    difficulty: 1
    hints:
    - thuMb = Motion.
    - Forefinger is field, middle finger is current.
    solution: The thumb points along the force on the conductor.
