# CBSE Class 10 Science (NCERT), chapter 2. Format: content/README.md.
subject: cbse10-sci
chapter: 2
title: Acids, Bases and Salts
tips:
  c10s_metal_vs_carbonate: "Metals react with acids to give one gas that burns with a pop; carbonates give another gas that turns limewater milky."
  c10s_ph_direction: "pH 7 is neutral. Below 7 is one side, above 7 the other. A lower pH means more hydrogen ions."
  c10s_ph_log: 'pH goes in powers of ten: each step of 1 is ten times as many H⁺ ions.'
  t10_dilution_heat: "Mixing acid and water gives out a lot of heat. What could happen if a little water lands on lots of acid?"
  t10_indicator_colours: "Phenolphthalein is colourless in acid and pink in base."
  t10_ions_conduct: "Current needs ions. Which substance splits into ions in water?"
  t10_neutralisation: "Acid + base → salt + water. What is that reaction called?"
  t10_pop_sets: "Plaster of Paris takes back water as it sets. Which calcium sulphate has 2 waters?"
  t10_read_formula: "The number in front of H₂O in the formula tells you how many water molecules there are."
  t10_salt_uses: "Which salt gives off CO₂ gas when heated and is mildly basic?"
  c10s2_litmus: Acids turn blue litmus red; bases turn red litmus blue. Which colour change did you see?
  c10s2_ions: "Acids give H⁺ ions in water; bases give OH⁻ ions. Which ion does this substance give?"
  c10s2_salt_parent: 'A salt''s name comes from its parents: the metal part from the base, the second part from the acid (chloride from hydrochloric, sulphate from sulphuric, nitrate from nitric).'
  c10s2_metal_oxide: Metal oxides behave like bases; non-metal oxides behave like acids.
  c10s2_ph_scale: "Picture the 0 to 14 scale with neutral in the middle. Lower numbers are acidic. Which side is this one on?"
  c10s2_chlor_alkali: 'Electrolysing brine gives three products: one gas at each electrode, plus a solution left behind.'
concepts:
- code: cbse10s.acid.reactions
  title: Acids, bases and how they react
  notes: |
    Acids taste sour, turn blue litmus red and give H⁺ (H₃O⁺) ions in water. Bases taste bitter, feel soapy,
    turn red litmus blue and give OH⁻ ions; bases that dissolve in water are alkalis. Indicators: litmus,
    phenolphthalein (colourless in acid, pink in base), methyl orange (red in acid, yellow in base), and
    olfactory indicators (onion, vanilla). Reactions: acid + metal → salt + hydrogen (the gas burns with a pop);
    acid + metal carbonate/hydrogencarbonate → salt + water + CO₂ (turns limewater milky); acid + base → salt
    + water (neutralisation); acid + metal oxide → salt + water. Diluting acid: always add acid to water, slowly.
  explanations:
    text: Acids release hydrogen ions in water and bases release hydroxide ions. When they meet, those ions make water and the acid and base cancel each other out, leaving a salt. Acids also fizz with reactive metals (giving hydrogen) and with carbonates (giving carbon dioxide).
    visual: 'Draw a beaker of acid with H⁺ dots and a beaker of base with OH⁻ dots. Pour them together: each H⁺ grabs an OH⁻ to make H₂O, and the leftover ions form the salt.'
    step_by_step: 'Step 1: Name the reactants: acid with a metal, a carbonate, or a base? Step 2: Metal → salt + hydrogen. Step 3: Carbonate → salt + water + carbon dioxide. Step 4: Base → salt + water. Step 5: Test the gas: pop for hydrogen, milky limewater for CO₂.'
    real_world: An antacid tablet for acidity is a mild base like magnesium hydroxide. It neutralises extra acid in the stomach.
  picture:
    kind: flow
    steps:
    - Acid (HCl) gives H⁺ ions
    - Base (NaOH) gives OH⁻ ions
    - H⁺ + OH⁻ → H₂O
    - Leftover Na⁺ and Cl⁻ make the salt NaCl
    - HCl + NaOH → NaCl + H₂O
    alt: 'Neutralisation: hydrogen ions from the acid and hydroxide ions from the base join to make water, and the rest forms a salt.'
  activity:
    type: sort
    prompt: Acid, base or neutral?
    bins:
    - Acid
    - Base
    - Neutral
    items:
    - label: Turns blue litmus red
      bin: Acid
      clue: What colour does litmus turn in vinegar?
      why: Acids turn blue litmus red.
    - label: Turns phenolphthalein pink
      bin: Base
      clue: Phenolphthalein stays colourless in which kind?
      why: Phenolphthalein turns pink only in a base.
    - label: Methyl orange turns yellow
      bin: Base
      clue: Methyl orange goes red in which kind?
      why: Methyl orange is red in acid and yellow in base.
    - label: Lemon juice
      bin: Acid
      clue: How does it taste?
      why: 'Sour taste: lemon juice contains citric acid.'
    - label: Soap solution
      bin: Base
      clue: How does soap feel between your fingers?
      why: 'Slippery and bitter: soap solution is basic.'
    - label: Gives H⁺ ions in water
      bin: Acid
      clue: Which ions make a solution acidic?
      why: H⁺ (as H₃O⁺) ions make a solution acidic.
    - label: Distilled water
      bin: Neutral
      clue: Does it change either litmus?
      why: 'Pure water changes neither litmus: pH 7, neutral.'
    - label: Baking soda solution
      bin: Base
      clue: Why is baking soda used for acidity?
      why: Sodium hydrogencarbonate solution is mildly basic, so it cancels acid.
    - label: Sugar solution
      bin: Neutral
      clue: Does dissolved sugar give H⁺ or OH⁻ ions?
      why: 'Sugar gives neither ion: neutral.'
    - label: Turns red litmus blue
      bin: Base
      clue: Which kind turns litmus blue?
      why: Bases turn red litmus blue.
  lesson:
    - teach: 'Acids taste sour and turn blue litmus red. Bases taste bitter, feel soapy and turn red litmus blue. Indicators show which is which: phenolphthalein turns pink in base; methyl orange is red in acid and yellow in base. Some, like onion, are olfactory: their smell changes.'
      picture:
        kind: compare
        columns:
        - title: Acid
          points:
          - Blue litmus → red
          - Sour
          - Gives H⁺ in water
        - title: Base
          points:
          - Red litmus → blue
          - Bitter, soapy
          - Gives OH⁻ in water
        alt: Acids turn blue litmus red, taste sour and give H⁺ ions; bases turn red litmus blue, taste bitter and give OH⁻ ions.
      check:
        prompt: A solution turns red litmus blue. It is…
        options:
        - A base
        - An acid
        - Neutral
        answer: A base
        why: Bases turn red litmus blue.
    - teach: 'Acid + metal → salt + hydrogen (the gas burns with a pop). Acid + metal carbonate or hydrogencarbonate → salt + water + carbon dioxide (turns limewater milky). Acid + base → salt + water: neutralisation. Acid + metal oxide → salt + water, so metal oxides are basic.'
      check:
        prompt: Acid + sodium carbonate gives which gas?
        options:
        - Carbon dioxide
        - Hydrogen
        - Oxygen
        answer: Carbon dioxide
        why: Carbonates give CO₂.
    - teach: Acids make H⁺ ions in water (they become H₃O⁺); bases soluble in water are alkalis and make OH⁻ ions. These ions let the solutions conduct electricity. Diluting a strong acid gives out heat, so always add acid slowly to water.
      check:
        prompt: Which ion makes a solution acidic?
        options:
        - H⁺
        - OH⁻
        - Na⁺
        answer: H⁺
        why: Acids release hydrogen ions.
  items:
  - prompt: Which gas is given off when zinc reacts with dilute sulphuric acid?
    options:
    - Hydrogen
    - Oxygen
    - Carbon dioxide
    - Chlorine
    answer: Hydrogen
    difficulty: 1
    hints:
    - Acid + metal gives salt + ?
    - It burns with a pop.
    solution: Zn + H₂SO₄ → ZnSO₄ + H₂. The gas is hydrogen.
    mistakes:
      Carbon dioxide: c10s_metal_vs_carbonate
  - prompt: 'Phenolphthalein is added to a solution and it turns pink. The solution is:'
    options:
    - Basic
    - Acidic
    - Neutral
    - Salty water
    answer: Basic
    difficulty: 1
    hints:
    - Phenolphthalein is colourless in acid.
    - Pink means base.
    solution: Phenolphthalein turns pink in basic solutions.
    mistakes: {"Acidic": "t10_indicator_colours", "Neutral": "t10_indicator_colours"}
  - prompt: Acid reacts with sodium carbonate. Which gas turns limewater milky?
    options:
    - Carbon dioxide
    - Hydrogen
    - Oxygen
    - Nitrogen
    answer: Carbon dioxide
    difficulty: 1
    hints:
    - Carbonate contains carbon and oxygen.
    - Limewater test.
    solution: Carbonates give CO₂ with acids, and CO₂ turns limewater milky.
    mistakes:
      Hydrogen: c10s_metal_vs_carbonate
  - prompt: 'HCl + NaOH → NaCl + H₂O is called:'
    options:
    - Neutralisation
    - Decomposition
    - Displacement of a metal
    - Combustion
    answer: Neutralisation
    difficulty: 1
    hints:
    - Acid + base.
    - Salt and water form.
    solution: 'An acid and a base react to give salt and water: neutralisation.'
    mistakes: {"Decomposition": "t10_neutralisation", "Combustion": "t10_neutralisation"}
  - prompt: Why should you add acid to water, and not water to acid, when diluting?
    options:
    - Mixing gives out a lot of heat; adding water to acid can make it boil and splash
    - Acid is lighter than water
    - Water reacts with acid to make hydrogen
    - Adding acid first makes it stronger
    answer: Mixing gives out a lot of heat; adding water to acid can make it boil and splash
    difficulty: 2
    hints:
    - Diluting acid is very exothermic.
    - Small amounts of acid into lots of water spread the heat.
    solution: Dilution releases heat. A little water added to concentrated acid can boil and spatter acid; adding acid slowly to water keeps it safe.
    mistakes: {"Acid is lighter than water": "t10_dilution_heat", "Adding acid first makes it stronger": "t10_dilution_heat"}
  - prompt: 'Which solution conducts electricity: glucose in water or dilute HCl?'
    options:
    - Dilute HCl
    - Glucose in water
    - Both equally
    - Neither
    answer: Dilute HCl
    difficulty: 2
    hints:
    - Conduction needs ions.
    - HCl gives H⁺ and Cl⁻ in water.
    solution: HCl forms ions in water, so it conducts. Glucose stays as molecules, so it doesn't.
    mistakes: {"Glucose in water": "t10_ions_conduct", "Both equally": "t10_ions_conduct"}
  - prompt: A solution turns blue litmus red. What is it?
    options:
    - An acid
    - A base
    - A neutral solution
    - Pure water
    answer: An acid
    difficulty: 1
    hints:
    - Think about what turns blue litmus to red.
    - Sour things do it.
    solution: Acids turn blue litmus red.
    mistakes:
      A base: c10s2_litmus
  - prompt: Methyl orange is added to a solution and turns yellow. The solution is…
    options:
    - Basic
    - Acidic
    - Neutral
    - Colourless
    answer: Basic
    difficulty: 2
    hints:
    - Methyl orange is red in one and yellow in the other.
    - It is red in acid.
    solution: Methyl orange is yellow in basic solutions.
    mistakes:
      Acidic: c10s2_litmus
  - prompt: Dilute HCl is added to copper oxide. The solution turns blue-green. What forms?
    options:
    - Copper chloride and water
    - Copper and hydrogen
    - Copper sulphate
    - Copper carbonate
    answer: Copper chloride and water
    difficulty: 2
    hints:
    - Metal oxide + acid → salt + water.
    - HCl gives chloride salts.
    solution: CuO + 2HCl → CuCl₂ + H₂O; copper chloride gives the colour.
    mistakes:
      Copper and hydrogen: c10s2_metal_oxide
      Copper sulphate: c10s2_salt_parent
  - prompt: Carbon dioxide reacts with lime water (a base) to form a salt and water. What does this tell you about CO₂?
    options:
    - Non-metal oxides are acidic
    - CO₂ is a base
    - CO₂ is a metal oxide
    - CO₂ is neutral
    answer: Non-metal oxides are acidic
    difficulty: 3
    hints:
    - Base + ? → salt + water.
    - Carbon is a non-metal.
    solution: Only an acidic substance neutralises a base, so non-metal oxides like CO₂ are acidic.
    mistakes:
      CO₂ is a base: c10s2_metal_oxide
  - prompt: Which salt forms when sodium hydroxide reacts with sulphuric acid?
    options:
    - Sodium sulphate
    - Sodium chloride
    - Sodium nitrate
    - Sodium carbonate
    answer: Sodium sulphate
    difficulty: 1
    hints:
    - Metal part from the base.
    - The other part from the acid.
    solution: '2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O: sodium sulphate.'
    mistakes:
      Sodium chloride: c10s2_salt_parent
  - prompt: Why does dry HCl gas not change the colour of dry blue litmus paper?
    options:
    - No H⁺ ions form without water
    - HCl is a base
    - Litmus only works on solids
    - HCl gas has no hydrogen
    answer: No H⁺ ions form without water
    difficulty: 3
    hints:
    - Acids show their nature only with water.
    - What do they release in water?
    solution: H⁺ ions form only when HCl dissolves in water; dry HCl has none, so no colour change.
    mistakes:
      HCl is a base: c10s2_ions
  - prompt: Which substances are bases that dissolve in water?
    options:
    - Alkalis
    - Acids
    - Salts
    - Indicators
    answer: Alkalis
    difficulty: 1
    hints:
    - NaOH and KOH are examples.
    - They give OH⁻ ions.
    solution: Water-soluble bases are called alkalis.
    mistakes:
      Salts: c10s2_ions
  - prompt: Which is an olfactory indicator?
    options:
    - Onion
    - Litmus
    - Phenolphthalein
    - Methyl orange
    answer: Onion
    difficulty: 2
    hints:
    - Olfactory is about smell.
    - Its smell disappears in a base.
    solution: Onion's smell changes in a base, so it is an olfactory indicator.
    mistakes:
      Litmus: c10s2_litmus
  - prompt: Fresh milk has pH 6. A milkman adds a little baking soda. Why?
    options:
    - To make it slightly basic so it keeps longer
    - To make it sour
    - To make it thicker
    - To add sugar
    answer: To make it slightly basic so it keeps longer
    difficulty: 2
    hints:
    - Baking soda is mildly basic.
    - Milk turns sour as acid builds up.
    solution: Raising the pH slightly delays souring, so milk keeps longer.
    mistakes:
      To make it sour: c10s2_ions
- code: cbse10s.acid.ph
  title: pH and salts in daily life
  after:
  - cbse10s.acid.reactions
  notes: |
    pH measures how acidic or basic a solution is, on a scale from 0 to 14: below 7 acidic, 7 neutral, above
    7 basic. Lower pH means more H⁺ ions; each step of 1 is ten times the H⁺ concentration. Universal
    indicator shows pH by colour. pH matters: our body works at 7.0–7.8, tooth decay starts below 5.5, acid rain
    has pH below 5.6, plants need soil of the right pH. Salts: common salt NaCl (raw material for NaOH by the
    chlor-alkali process, giving Cl₂ and H₂); bleaching powder CaOCl₂; baking soda NaHCO₃ (antacid, baking
    powder); washing soda Na₂CO₃·10H₂O; plaster of Paris CaSO₄·½H₂O, which sets into gypsum CaSO₄·2H₂O with
    water. Water of crystallisation is water fixed in a salt's crystals (blue CuSO₄·5H₂O turns white on heating).
  explanations:
    text: The pH number tells you how acidic something is. Seven is neutral like pure water; the further below 7, the stronger the acid, and the further above 7, the stronger the base. Each whole number down means ten times more hydrogen ions.
    visual: Draw a ruler from 0 to 14, red at 0, green at 7, purple at 14. Place lemon juice near 2, pure water at 7, baking soda solution near 9, and soap solution around 10.
    step_by_step: 'Step 1: Find the pH. Step 2: Below 7 is acidic, 7 is neutral, above 7 is basic. Step 3: To compare two acids, the lower pH is stronger. Step 4: Each step of 1 is a factor of 10 in H⁺.'
    real_world: Toothpaste is basic. Brushing after eating neutralises the acid that bacteria make from sugar, which would otherwise wear away enamel below pH 5.5.
  picture:
    kind: bars
    bars:
    - label: Lemon juice
      value: 2
    - label: Vinegar
      value: 3
    - label: Pure water
      value: 7
    - label: Blood
      value: 7.4
    - label: Baking soda
      value: 8.5
    - label: Milk of magnesia
      value: 10
    unit: pH
    alt: 'Bar chart of pH values: lemon juice 2, vinegar 3, pure water 7, blood 7.4, baking soda solution 8.5, milk of magnesia 10.'
  activity:
    type: scale
    min: 0
    max: 14
    step: 0.5
    start: 10
    unit: pH
    orientation: horizontal
    prompt: The pH scale runs from 0 to 14. Move the marker.
    zones:
    - from: 0
      to: 6.5
      label: Acidic
      says: 'Below 7: acidic. The lower the pH, the more H⁺ ions.'
    - from: 6.5
      to: 7.5
      label: Neutral
      says: 'Around 7: neutral, like pure water.'
    - from: 7.5
      to: 14
      label: Basic
      says: 'Above 7: basic (alkaline). The higher the pH, the more OH⁻ ions.'
    goals:
    - prompt: Mark pure water.
      value: 7
      mistakes:
      - when:
          v: 0
        say: 0 is the most acidic end, not 'nothing'. Neutral sits in the middle, at 7.
      - when:
          v: 14
        say: 14 is the most basic end. Pure water is neither acidic nor basic.
    - prompt: Milk of magnesia cancels stomach acid. Put it in the right zone.
      zone: Basic
      mistakes:
      - when:
          v:
          - 0
          - 6.5
        say: An acid wouldn't cancel stomach acid; it would add to it. An antacid is a base.
    - prompt: Tooth decay starts when the mouth falls below this pH. Mark it.
      value: 5.5
      mistakes:
      - when:
          v:
          - 7.5
          - 14
        say: Above 7 is basic. Decay is caused by acid from bacteria, so the danger is below 7.
      - when:
          v: 7
        say: 7 is neutral. Decay starts once the mouth is a little acidic.
    - prompt: Which is more acidic, pH 2 or pH 5? Mark the more acidic one.
      value: 2
      mistakes:
      - when:
          v: 5
        say: 'A lower pH means more H⁺ ions: pH 2 has 1000 times the H⁺ of pH 5.'
  lesson:
    - teach: 'The pH scale runs from 0 to 14 and measures H⁺ ions. pH 7 is neutral (pure water). Below 7 is acidic: lower means stronger acid. Above 7 is basic: higher means stronger base. Universal indicator shows the pH by its colour.'
      picture:
        kind: number_line
        from: 0
        to: 14
        step: 1
        points:
        - at: 2
          label: lemon juice
        - at: 7
          label: pure water
        - at: 10
          label: milk of magnesia
        - at: 13
          label: sodium hydroxide
        alt: pH scale from 0 to 14 with lemon juice at 2, pure water at 7, milk of magnesia at 10 and sodium hydroxide at 13.
      check:
        prompt: Which is the strongest acid?
        options:
        - pH 1
        - pH 5
        - pH 7
        answer: pH 1
        why: Lower pH means more H⁺.
    - teach: pH matters in life. Our body works at 7.0–7.8. Stomach acid helps digestion; too much causes indigestion, cured by an antacid (a mild base). Tooth decay starts below pH 5.5. Bee stings (acid) are soothed with baking soda; acid rain below 5.6 harms rivers.
      check:
        prompt: An antacid for indigestion is…
        options:
        - A mild base
        - A strong acid
        - Pure water
        answer: A mild base
        why: It neutralises extra stomach acid.
    - teach: 'Salts from daily life: common salt (NaCl) is the raw material for many. Electrolysing brine (chlor-alkali) gives NaOH, chlorine and hydrogen. Bleaching powder (CaOCl₂), baking soda (NaHCO₃), washing soda (Na₂CO₃·10H₂O) and plaster of Paris (CaSO₄·½H₂O) are made from it or similar salts.'
      check:
        prompt: Which salt softens hard water and is used in laundry?
        options:
        - Washing soda
        - Baking soda
        - Plaster of Paris
        answer: Washing soda
        why: Sodium carbonate removes hardness.
  items:
  - prompt: 'A solution has pH 3. It is:'
    options:
    - Acidic
    - Basic
    - Neutral
    - A salt solution with no ions
    answer: Acidic
    difficulty: 1
    hints:
    - "pH 7 is neutral. Is 3 below or above 7, and what does that side of the scale mean?"
    - 3 < 7.
    solution: pH 3 is below 7, so it is acidic.
    mistakes:
      Basic: c10s_ph_direction
  - prompt: 'Which solution has more hydrogen ions: pH 2 or pH 5?'
    options:
    - pH 2
    - pH 5
    - They are equal
    - pH doesn't tell you
    answer: pH 2
    difficulty: 1
    hints:
    - Lower pH means more H⁺.
    - 2 is lower.
    solution: The lower the pH, the more H⁺ ions. pH 2 has a thousand times more than pH 5.
    mistakes:
      pH 5: c10s_ph_direction
  - prompt: How many times more H⁺ ions does a solution of pH 3 have than one of pH 6?
    answer: '1000'
    check: 10**(6 - 3)
    difficulty: 2
    hints:
    - Each step of 1 is ten times.
    - 6 − 3 = 3 steps.
    solution: 'Step 1: 6 − 3 = 3 steps. Step 2: 10 × 10 × 10 = 1000 times.'
    mistakes:
      '3': c10s_ph_log
  - prompt: Which salt is used to make cakes rise and in antacids?
    options:
    - Baking soda (NaHCO₃)
    - Washing soda (Na₂CO₃·10H₂O)
    - Bleaching powder (CaOCl₂)
    - Plaster of Paris
    answer: Baking soda (NaHCO₃)
    difficulty: 1
    hints:
    - When heated it gives CO₂.
    - Sodium hydrogencarbonate.
    solution: Baking soda gives CO₂ when heated or with acid, which makes cakes rise, and it is mildly basic, so it neutralises acid.
    mistakes: {"Washing soda (Na₂CO₃·10H₂O)": "t10_salt_uses", "Bleaching powder (CaOCl₂)": "t10_salt_uses"}
  - prompt: Plaster of Paris is mixed with water and becomes hard. What forms?
    options:
    - Gypsum, CaSO₄·2H₂O
    - Limestone, CaCO₃
    - Quicklime, CaO
    - Bleaching powder
    answer: Gypsum, CaSO₄·2H₂O
    difficulty: 2
    hints:
    - Plaster of Paris is CaSO₄·½H₂O.
    - It takes up water.
    solution: CaSO₄·½H₂O + 1½H₂O → CaSO₄·2H₂O. It sets into hard gypsum.
    mistakes: {"Limestone, CaCO₃": "t10_pop_sets", "Quicklime, CaO": "t10_pop_sets"}
  - prompt: How many molecules of water of crystallisation are in one formula unit of copper sulphate crystals, CuSO₄·5H₂O?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Look after the dot.
    - 5H₂O.
    solution: The formula CuSO₄·5H₂O has 5 water molecules for each CuSO₄.
    mistakes: {"1": "t10_read_formula", "10": "t10_read_formula"}
  - prompt: A solution has pH 11. It is…
    options:
    - Basic
    - Acidic
    - Neutral
    - Strongly acidic
    answer: Basic
    difficulty: 1
    hints:
    - Compare with 7.
    - Above 7…
    solution: pH above 7 is basic.
    mistakes:
      Acidic: c10s2_ph_scale
  - prompt: Which pH is neutral?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Pure water is neutral.
    - It is the middle of 0 to 14.
    solution: pH 7 is neutral.
    mistakes:
      '0': c10s2_ph_scale
      '14': c10s2_ph_scale
  - prompt: Below what pH does tooth decay start?
    answer: '5.5'
    check: '5.5'
    difficulty: 2
    hints:
    - Acids from food bacteria lower the pH in the mouth.
    - It is a little below 6.
    solution: Tooth enamel starts to corrode below pH 5.5.
    mistakes:
      '7': c10s2_ph_scale
  - prompt: Rain water with pH below 5.6 is called…
    options:
    - Acid rain
    - Basic rain
    - Neutral rain
    - Hard water
    answer: Acid rain
    difficulty: 1
    hints:
    - Below 7 is acidic.
    - It harms aquatic life.
    solution: Rain with pH below 5.6 is acid rain.
    mistakes:
      Basic rain: c10s2_ph_scale
  - prompt: Electrolysis of brine gives which gas at the anode?
    options:
    - Chlorine
    - Hydrogen
    - Oxygen
    - Carbon dioxide
    answer: Chlorine
    difficulty: 2
    hints:
    - The anode attracts negative ions.
    - Brine has Cl⁻ ions.
    solution: Cl⁻ ions give chlorine gas at the anode; hydrogen forms at the cathode, NaOH stays in solution.
    mistakes:
      Hydrogen: c10s2_chlor_alkali
  - prompt: What is the chemical formula of baking soda?
    options:
    - NaHCO₃
    - Na₂CO₃
    - NaCl
    - CaOCl₂
    answer: NaHCO₃
    difficulty: 2
    hints:
    - Its full name is sodium hydrogencarbonate.
    - It has an H in it.
    solution: Baking soda is sodium hydrogencarbonate, NaHCO₃.
    mistakes:
      Na₂CO₃: t10_salt_uses
  - prompt: Bleaching powder is made by passing chlorine over…
    options:
    - Dry slaked lime
    - Common salt
    - Baking soda
    - Washing soda
    answer: Dry slaked lime
    difficulty: 2
    hints:
    - Bleaching powder is a calcium compound.
