# CBSE Class 10 Science (NCERT), chapter 5. Format: content/README.md.
subject: cbse10-sci
chapter: 5
title: Life Processes
tips:
  c10s_enzyme_place: "Pepsin works in the stomach on protein. Starch digestion starts earlier, in the mouth, with an enzyme found in saliva."
  c10s_anaerobic_kind: "Without oxygen, muscles make one product; yeast makes a different pair, which is why dough rises and drinks ferment."
  c10s_artery_vein: "A for Away: one kind of vessel carries blood from the heart under high pressure; the other brings it back."
  c10s_xylem_phloem: "Plants have two transport tissues: one made of dead, hollow tubes for water moving up, one of living sieve tubes for food. Gases enter leaves through tiny pores, and water is pulled up as leaves lose water vapour."
  t10_bile_role: "Bile contains no enzymes. It breaks big fat drops into tiny ones. What is that called?"
  t10_count_oxygen: "Count O atoms on the left, subtract the O in glucose, then halve for O₂ molecules."
  t10_heart_chambers: "Count both atria and both ventricles."
  t10_left_ventricle: "Which chamber pumps blood the furthest, to the whole body?"
  t10_nephron: "Neurons are nerve cells; alveoli are in the lungs. What is the kidney's filtering unit?"
  t10_stomata: "Gases enter and leave leaves through tiny pores on their surface."
  t10_villi_absorb: "Absorption needs a huge surface. Which part of the gut has millions of finger-like villi?"
  c10s5_auto_hetero: Does the living thing make its own food from simple things like CO₂ and water, or does it take in food made by others?
  c10s5_photo_needs: 'Photosynthesis needs four things: sunlight, chlorophyll, carbon dioxide and water. Which one did the experiment take away?'
  c10s5_gut_order: 'Follow the food: mouth, oesophagus, stomach, small intestine, large intestine. Where are you in that journey?'
  c10s5_resp_energy: Breathing in oxygen lets glucose be broken down fully and gives the most energy. Without oxygen, less energy is released.
  c10s5_blood_parts: "Each part of blood has one main job: carrying oxygen, fighting germs, sealing cuts, or carrying dissolved food. Which part does this job?"
  c10s5_circulation: 'Mammals use double circulation: blood goes through the heart twice in one full trip, once for the lungs and once for the body.'
  c10s5_plant_excrete: Plants get rid of extra water by transpiration and store some wastes in old leaves, bark and resins. Which route fits here?
concepts:
- code: cbse10s.life.nutrition
  title: Nutrition and respiration
  notes: |
    Life processes keep an organism alive: nutrition, respiration, transport and excretion. Autotrophs (green
    plants) make food by photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ with sunlight and chlorophyll; CO₂ enters
    through stomata, whose guard cells open and close them. Heterotrophs take in food: holozoic (amoeba engulfs
    food with pseudopodia), saprophytic (fungi), parasitic (Cuscuta, lice). Human digestion: mouth (salivary
    amylase: starch → sugar), stomach (HCl, pepsin, mucus), small intestine (bile from the liver emulsifies fats;
    pancreatic juice has trypsin and lipase; villi absorb digested food), large intestine (absorbs water).
    Respiration breaks down glucose for energy (ATP). Aerobic, in mitochondria: glucose → CO₂ + H₂O + much
    energy. Anaerobic in yeast: → ethanol + CO₂; in muscles short of oxygen: → lactic acid (cramps).
  explanations:
    text: Every living thing needs food and energy. Plants make their own food from carbon dioxide and water using sunlight; animals digest food made by others. Cells then 'burn' glucose in respiration to release energy, fully with oxygen or partly without it.
    visual: 'Draw a leaf as a kitchen: CO₂ comes in through tiny doors (stomata), water arrives through pipes from the roots, sunlight is the stove, and glucose and oxygen come out.'
    step_by_step: 'Step 1: Ask who makes the food: a plant (photosynthesis) or an animal (digestion)? Step 2: For digestion, follow the food: mouth, stomach, small intestine, large intestine. Step 3: For energy, ask whether oxygen is present: aerobic gives CO₂ + water; without it, ethanol (yeast) or lactic acid (muscles).'
    real_world: After a fast sprint your legs ache. Your muscles ran short of oxygen and made lactic acid by anaerobic respiration.
  picture:
    kind: flow
    steps:
    - Glucose (6 carbons) in the cytoplasm
    - Breaks into pyruvate (3 carbons) + a little energy
    - 'With oxygen, in mitochondria: CO₂ + H₂O + lots of energy'
    - 'No oxygen in muscle: lactic acid + a little energy'
    - 'No oxygen in yeast: ethanol + CO₂ + a little energy'
    alt: 'Respiration pathways: glucose becomes pyruvate, which goes on to carbon dioxide and water with oxygen, or to lactic acid in muscle or ethanol and carbon dioxide in yeast without oxygen.'
  activity:
    type: sort
    prompt: How does each one get its food?
    bins:
    - Autotrophic
    - Holozoic
    - Parasitic
    - Saprophytic
    items:
    - label: Green plants
      bin: Autotrophic
      clue: Do they make their own food?
      why: 'They make food by photosynthesis: autotrophic.'
    - label: Humans
      bin: Holozoic
      clue: Do we take in whole food and digest it inside?
      why: 'We ingest food and digest it inside: holozoic.'
    - label: Amoeba
      bin: Holozoic
      clue: Does it engulf food with false feet?
      why: 'Amoeba takes in whole food and digests it in a food vacuole: holozoic.'
    - label: Cuscuta (amarbel)
      bin: Parasitic
      clue: It is a plant without green leaves. Where does it get food?
      why: 'It takes food from the host plant it wraps around: parasitic.'
    - label: Tapeworm
      bin: Parasitic
      clue: Does it live inside another animal and take its food?
      why: 'It lives in the gut of its host and absorbs food: parasitic.'
    - label: Mushroom
      bin: Saprophytic
      clue: Does it feed on living or dead matter?
      why: 'It breaks down dead matter outside its body and absorbs it: saprophytic.'
    - label: Bread mould
      bin: Saprophytic
      clue: What does mould grow on?
      why: 'It feeds on dead food matter: saprophytic.'
    - label: Lice
      bin: Parasitic
      clue: Do lice feed on a living host?
      why: 'Lice suck blood from a living host: parasitic.'
    - label: Cow
      bin: Holozoic
      clue: Does a cow eat whole grass and digest it inside?
      why: 'It ingests and digests food inside: holozoic.'
  lesson:
    - teach: 'Life processes keep us alive: nutrition, respiration, transport and excretion. In autotrophic nutrition, green plants make food by photosynthesis: carbon dioxide + water → glucose + oxygen, using sunlight and chlorophyll. Heterotrophs (animals, fungi) take in food made by others.'
      picture:
        kind: flow
        steps:
        - CO₂ in through stomata
        - Water up from roots
        - Chlorophyll traps sunlight
        - Glucose made, O₂ given out
        alt: 'Photosynthesis: carbon dioxide enters through stomata, water comes up from the roots, chlorophyll traps sunlight, and glucose is made while oxygen is given out.'
      check:
        prompt: Which gas do plants give out in photosynthesis?
        options:
        - Oxygen
        - Carbon dioxide
        - Nitrogen
        answer: Oxygen
        why: Water is split and oxygen released.
      ways:
      - style: step_by_step
        teach: 'Show that a leaf needs chlorophyll. Step 1: Take a potted plant with variegated (green and white) leaves. Step 2: Keep it in sunlight for a few hours. Step 3: Boil a leaf in alcohol to remove the green colour, then add iodine. Step 4: Only the parts that were green turn blue-black: only they made starch.'
      - style: real_world
        teach: A grass lawn under a tin shed stays pale and thin, while the sunlit part is thick and green. Without light, grass cannot photosynthesise and make its food.
    - teach: 'Human digestion: saliva (salivary amylase) starts on starch in the mouth; the stomach makes HCl, pepsin and mucus; in the small intestine, bile from the liver emulsifies fats and pancreatic juice digests proteins, carbohydrates and fats. Villi absorb the digested food. The large intestine absorbs water.'
      check:
        prompt: Where is digestion completed?
        options:
        - Small intestine
        - Stomach
        - Large intestine
        answer: Small intestine
        why: Pancreatic and intestinal juices finish the job there.
      ways:
      - style: visual
        teach: The journey of a bite of food and what each part adds.
        picture:
          kind: flow
          steps:
          - 'mouth: salivary amylase on starch'
          - 'stomach: HCl, pepsin on protein, mucus'
          - 'small intestine: bile and pancreatic juice'
          - villi absorb digested food
          - large intestine absorbs water
          alt: In the mouth, salivary amylase starts on starch. In the stomach, hydrochloric acid and pepsin start on protein while mucus protects the lining. In the small intestine, bile and pancreatic juice finish digestion and villi absorb the food. The large intestine takes back water.
      - style: real_world
        teach: Chewing a piece of plain roti for a minute makes it taste slightly sweet. Salivary amylase is already breaking starch into sugar in your mouth.
    - teach: 'Respiration releases energy from glucose. Aerobic (with oxygen, in mitochondria): CO₂ + water + lots of energy. Anaerobic: yeast makes ethanol + CO₂; muscles short of oxygen make lactic acid (cramps). Energy is stored as ATP. In humans, air passes nose → trachea → bronchi → alveoli, where gases are exchanged.'
      check:
        prompt: Where in the cell does aerobic respiration finish?
        options:
        - Mitochondria
        - Nucleus
        - Cell wall
        answer: Mitochondria
        why: Pyruvate is broken down fully there.
      ways:
      - style: visual
        teach: Aerobic and anaerobic respiration of glucose, side by side.
        picture:
          kind: compare
          columns:
          - title: Aerobic
            points:
            - with oxygen, in mitochondria
            - CO₂ + water
            - a lot of energy
          - title: Anaerobic in yeast
            points:
            - without oxygen
            - ethanol + CO₂
            - a little energy
          - title: Anaerobic in muscle
            points:
            - oxygen runs short
            - lactic acid
            - a little energy, cramps
          alt: Aerobic respiration uses oxygen in mitochondria and gives carbon dioxide, water and a lot of energy. Yeast without oxygen makes ethanol and carbon dioxide. Muscles short of oxygen make lactic acid and get cramps.
      - style: step_by_step
        teach: 'Follow a breath of air. Step 1: Air enters the nostrils, where hairs and mucus trap dust. Step 2: It passes the pharynx, larynx and the trachea held open by cartilage rings. Step 3: It moves through bronchi and bronchioles. Step 4: In the alveoli, oxygen enters the blood and carbon dioxide leaves.'
  items:
  - prompt: Through which openings does carbon dioxide enter a leaf?
    options:
    - Stomata
    - Root hairs
    - Xylem
    - Villi
    answer: Stomata
    difficulty: 1
    hints:
    - Tiny pores on the leaf surface.
    - Guard cells open and close them.
    solution: CO₂ enters through stomata, controlled by guard cells.
    mistakes: {"Root hairs": "t10_stomata", "Xylem": "c10s_xylem_phloem"}
  - prompt: Which enzyme in saliva begins the digestion of starch?
    options:
    - Salivary amylase
    - Pepsin
    - Trypsin
    - Lipase
    answer: Salivary amylase
    difficulty: 1
    hints:
    - Starch is a carbohydrate.
    - Pepsin works on proteins in the stomach.
    solution: Salivary amylase breaks starch into sugar in the mouth.
    mistakes:
      Pepsin: c10s_enzyme_place
  - prompt: What does bile do?
    options:
    - "Breaks fat into small droplets (emulsifies it)"
    - "Digests proteins into amino acids in the stomach"
    - "Kills all the bacteria that enter the stomach"
    - "Absorbs water from food in the large intestine"
    answer: Breaks fat into small droplets (emulsifies it)
    difficulty: 2
    hints:
    - Bile has no enzymes.
    - It helps lipase work.
    solution: Bile from the liver emulsifies fats so lipase can digest them faster. It also makes the food alkaline.
    mistakes: {"Digests proteins into amino acids in the stomach": "t10_bile_role", "Absorbs water from food in the large intestine": "t10_bile_role"}
  - prompt: Where is most digested food absorbed?
    options:
    - "In the villi of the small intestine"
    - "In the walls of the stomach"
    - "In the large intestine"
    - "In the mouth, under the tongue"
    answer: In the villi of the small intestine
    difficulty: 1
    hints:
    - Finger-like projections.
    - Large surface area.
    solution: The villi of the small intestine give a huge surface area for absorbing digested food.
    mistakes: {"In the walls of the stomach": "t10_villi_absorb", "In the large intestine": "t10_villi_absorb"}
  - prompt: 'Yeast respiring without oxygen produces:'
    options:
    - Ethanol and carbon dioxide
    - Lactic acid
    - Carbon dioxide and water only
    - Oxygen and glucose
    answer: Ethanol and carbon dioxide
    difficulty: 2
    hints:
    - This is used in bread and brewing.
    - Lactic acid is in muscles.
    solution: Anaerobic respiration in yeast gives ethanol, CO₂ and a little energy.
    mistakes:
      Lactic acid: c10s_anaerobic_kind
  - prompt: In photosynthesis, 6CO₂ + 6H₂O → C₆H₁₂O₆ + xO₂. Find x.
    answer: '6'
    check: (6*2 + 6 - 6)/2
    difficulty: 2
    hints:
    - Count oxygen atoms on the left.
    - 12 + 6 = 18; glucose has 6.
    solution: 'Step 1: O on the left = 12 + 6 = 18. Step 2: Glucose uses 6. Step 3: 12 O left = 6 O₂.'
    mistakes: {"12": "t10_count_oxygen", "9": "t10_count_oxygen"}
  - prompt: Mushrooms and bread mould break down dead matter outside their bodies and absorb it. This is…
    options:
    - Saprotrophic nutrition
    - Autotrophic nutrition
    - Parasitic nutrition
    - Photosynthesis
    answer: Saprotrophic nutrition
    difficulty: 2
    hints:
    - They don't make their own food.
    - They feed on dead and decaying matter.
    solution: Feeding on dead matter by absorbing it is saprotrophic nutrition.
    mistakes:
      Autotrophic nutrition: c10s5_auto_hetero
  - prompt: Cuscuta (amarbel) lives on another plant and takes food from it. This is…
    options:
    - Parasitic nutrition
    - Autotrophic nutrition
    - Saprotrophic nutrition
    - Holozoic nutrition
    answer: Parasitic nutrition
    difficulty: 2
    hints:
    - It harms its host.
    - It takes food from a living plant.
    solution: Taking food from a living host is parasitic nutrition.
    mistakes:
      Autotrophic nutrition: c10s5_auto_hetero
  - prompt: A plant is kept in the dark for 3 days, then one leaf is tested with iodine. What happens?
    options:
    - "No blue-black colour: no starch"
    - "It turns blue-black: starch is there"
    - "It turns red: sugar is there"
    - "It glows: chlorophyll is there"
    answer: 'No blue-black colour: no starch'
    difficulty: 3
    hints:
    - Iodine turns starch blue-black.
    - In the dark, can starch be made?
    solution: Without light no starch is made, and stored starch is used up, so iodine shows no blue-black.
    mistakes:
      "It turns blue-black: starch is there": c10s5_photo_needs
  - prompt: Which acid is made in the stomach?
    options:
    - Hydrochloric acid
    - Sulphuric acid
    - Lactic acid
    - Nitric acid
    answer: Hydrochloric acid
    difficulty: 1
    hints:
    - It helps pepsin work.
    - It also kills germs in food.
    solution: Gastric glands make hydrochloric acid.
    mistakes:
      Lactic acid: c10s_anaerobic_kind
  - prompt: Why do we get muscle cramps after running hard?
    options:
    - "Lactic acid builds up when oxygen runs short"
    - "Muscles make alcohol when they work hard"
    - "Too much oxygen reaches the muscles at once"
    - "Glucose in the muscles turns into starch"
    answer: Lactic acid builds up when oxygen runs short
    difficulty: 2
    hints:
    - Oxygen can't reach the muscles fast enough.
    - What do muscles make without oxygen?
    solution: Muscles respire anaerobically and lactic acid builds up, causing cramps.
    mistakes:
      "Muscles make alcohol when they work hard": c10s_anaerobic_kind
  - prompt: What is the energy currency of the cell?
    options:
    - ATP
    - Glucose
    - Oxygen
    - Chlorophyll
    answer: ATP
    difficulty: 1
    hints:
    - Energy from respiration is stored in this molecule.
    - Three letters.
    solution: Energy released in respiration is stored as ATP and used for cell work.
    mistakes:
      Glucose: c10s5_resp_energy
  - prompt: Where in the lungs are gases exchanged with the blood?
    options:
    - Alveoli
    - Trachea
    - Bronchi
    - Larynx
    answer: Alveoli
    difficulty: 1
    hints:
    - Tiny balloon-like sacs.
    - They have thin walls and many blood vessels.
    solution: Oxygen and carbon dioxide pass between air and blood in the alveoli.
    mistakes:
      Trachea: c10s5_gut_order
  - prompt: Which gives more energy from one glucose molecule?
    options:
    - Aerobic respiration
    - Anaerobic respiration in yeast
    - Anaerobic respiration in muscle
    - They give the same
    answer: Aerobic respiration
    difficulty: 2
    hints:
    - Full breakdown releases more.
    - Which kind breaks glucose all the way to CO₂ and water?
    solution: With oxygen, glucose is broken down fully, releasing far more energy.
    mistakes:
      They give the same: c10s5_resp_energy
  - prompt: Why do the rings of cartilage in the trachea matter?
    options:
    - "They stop the air passage from collapsing"
    - "They digest food that enters the windpipe"
    - "They make the mucus that traps dust"
    - "They exchange oxygen and carbon dioxide"
    answer: They stop the air passage from collapsing
    difficulty: 2
    hints:
    - The trachea must always stay open.
    - Cartilage is stiff.
    solution: The rings keep the trachea open even when there is little air in it.
    mistakes:
      "They exchange oxygen and carbon dioxide": c10s5_gut_order
  - prompt: 'Assertion (A): The walls of the small intestine have millions of finger-like villi.

      Reason (R): Villi increase the surface area for absorbing digested food.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Villi exist to give a huge surface for absorption, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A baker mixes yeast into dough and leaves it in a warm place. After two hours the dough has risen and smells slightly of alcohol. Which process explains this?'
    options:
    - Anaerobic respiration in yeast, giving CO₂ and ethanol
    - Photosynthesis in yeast, giving oxygen
    - Aerobic respiration in muscles, giving lactic acid
    answer: Anaerobic respiration in yeast, giving CO₂ and ethanol
    hints:
    - Which living thing is in the dough?
    - Without much oxygen, what does yeast make?
    solution: Yeast respires anaerobically, making carbon dioxide (which makes the dough rise) and a little ethanol (the smell).
    mistakes:
      Photosynthesis in yeast, giving oxygen: c10s5_auto_hetero
      Aerobic respiration in muscles, giving lactic acid: c10s_anaerobic_kind
    exam: case
    difficulty: 2
  - prompt: 'Situation: A patient has had the gall bladder removed and is told to eat less fried food. Why?'
    options:
    - "Less bile reaches the intestine, so fats are not broken into small droplets well"
    - "The stomach can no longer make acid, so fried food stays undigested for longer"
    - "Saliva stops digesting starch, so the oil in fried food cannot be broken down"
    answer: Less bile reaches the intestine, so fats are not broken into small droplets well
    hints:
    - The gall bladder stores something made by the liver.
    - What does that substance do to fats?
    solution: The gall bladder stores bile, which emulsifies fats. Without it, fatty food is harder to digest.
    mistakes:
      "The stomach can no longer make acid, so fried food stays undigested for longer": t10_bile_role
      "Saliva stops digesting starch, so the oil in fried food cannot be broken down": c10s5_gut_order
    exam: competency
    difficulty: 2
- code: cbse10s.life.transport
  title: Transport and excretion
  after:
  - cbse10s.life.nutrition
  notes: |
    Human transport: blood (plasma, red cells with haemoglobin carrying O₂, white cells, platelets for
    clotting) pumped by a four-chambered heart. Double circulation: right side sends deoxygenated blood to the
    lungs; left side sends oxygenated blood to the body; the left ventricle has the thickest wall. Arteries
    carry blood away from the heart (thick, elastic walls); veins bring it back (valves); capillaries exchange
    materials. Lymph carries absorbed fat and drains tissue fluid. Plants: xylem carries water and minerals up
    from the roots (pulled by transpiration); phloem carries food (translocation, uses energy). Excretion in
    humans: kidneys filter blood in nephrons (glomerulus, Bowman's capsule, tubule reabsorbs useful substances)
    to make urine; urine goes by ureters to the bladder. Dialysis is an artificial kidney. Plants get rid of
    wastes by storing them in old leaves, bark, resins and gums, and giving out O₂ and water vapour.
  explanations:
    text: 'Your heart is a double pump: one side sends blood to the lungs to pick up oxygen, the other sends it round the body. Kidneys clean the blood by filtering it in millions of tiny tubes. Plants move water up through xylem and food around through phloem.'
    visual: 'Draw the heart as two side-by-side pumps. Right pump: body → right atrium → right ventricle → lungs. Left pump: lungs → left atrium → left ventricle → body.'
    step_by_step: 'Step 1: Follow blue (low-oxygen) blood from the body into the right side. Step 2: To the lungs, where it picks up oxygen. Step 3: Back to the left side. Step 4: The thick left ventricle pumps it to the whole body.'
    real_world: When someone's kidneys fail, a dialysis machine filters their blood through a membrane, doing the kidney's job outside the body.
  picture:
    kind: flow
    steps:
    - Body → vena cava → right atrium
    - Right ventricle → lungs (pick up O₂)
    - Lungs → left atrium
    - Left ventricle (thickest wall) → aorta → body
    alt: 'Double circulation: blood goes from the body to the right side of the heart, to the lungs, back to the left side, and out to the body.'
  activity:
    type: order
    prompt: Follow blood once round the human heart and lungs. Put the stops in order.
    steps:
    - Blood low in oxygen returns from the body
    - It enters the right atrium
    - The right ventricle pumps it out
    - In the lungs it picks up oxygen
    - Oxygen-rich blood enters the left atrium
    - The thick-walled left ventricle pumps it to the body
    reasons:
      It enters the right atrium: Blood must return from the body before it enters the heart.
      The right ventricle pumps it out: Blood passes from the right atrium down to the right ventricle.
      In the lungs it picks up oxygen: The right ventricle pumps blood to the lungs.
      Oxygen-rich blood enters the left atrium: Blood comes back from the lungs into the left atrium.
      The thick-walled left ventricle pumps it to the body: Blood passes from the left atrium to the left ventricle, which pumps hardest.
  lesson:
    - teach: Blood transports food, oxygen and wastes. Plasma carries dissolved food, CO₂ and wastes; red blood cells carry oxygen using haemoglobin; platelets help blood clot. The heart pumps it through arteries (thick walls, away from the heart), capillaries (one cell thick, for exchange) and veins (with valves, back to the heart).
      check:
        prompt: Which cells carry oxygen?
        options:
        - Red blood cells
        - Platelets
        - White blood cells
        answer: Red blood cells
        why: They contain haemoglobin.
      ways:
      - style: visual
        teach: 'Arteries, veins and capillaries compared: direction, walls and pressure.'
        picture:
          kind: compare
          columns:
          - title: Artery
            points:
            - away from heart
            - thick elastic walls
            - high pressure
          - title: Vein
            points:
            - towards heart
            - thin walls, valves
            - low pressure
          - title: Capillary
            points:
            - between the two
            - one cell thick
            - exchange with tissues
          alt: Arteries carry blood away from the heart with thick elastic walls under high pressure. Veins bring it back with thin walls and valves at low pressure. Capillaries, one cell thick, link them and exchange materials with tissues.
      - style: real_world
        teach: When a doctor checks your pulse at the wrist, they feel an artery stretching with each heartbeat. Veins, like the blue lines on the back of your hand, have no pulse.
    - teach: 'The human heart has four chambers. The right side gets used blood from the body and sends it to the lungs; the left side gets oxygen-rich blood from the lungs and pumps it to the body. Blood passes the heart twice in each round: double circulation. This keeps oxygen-rich and oxygen-poor blood apart.'
      picture:
        kind: flow
        steps:
        - Body
        - Right atrium
        - Right ventricle
        - Lungs
        - Left atrium
        - Left ventricle
        - Body
        alt: 'Double circulation: body to right atrium to right ventricle to lungs, then back to left atrium, left ventricle and out to the body.'
      check:
        prompt: Blood from the lungs enters the…
        options:
        - Left atrium
        - Right atrium
        - Right ventricle
        answer: Left atrium
        why: The left side carries oxygen-rich blood.
      ways:
      - style: step_by_step
        teach: 'Trace one drop of blood. Step 1: Used blood from the body enters the right atrium. Step 2: The right ventricle pumps it to the lungs to pick up oxygen. Step 3: It returns to the left atrium. Step 4: The left ventricle pumps it out through the aorta to the body.'
      - style: real_world
        teach: A blood pressure reading like 120/80 shows the pressure in the arteries when the ventricles squeeze (120) and when they relax (80). Very high readings strain the heart.
    - teach: 'In plants, xylem carries water and minerals up from the roots, pulled by transpiration (water evaporating from leaves). Phloem carries food (translocation) up and down, using energy. Excretion in humans: each kidney has about a million nephrons that filter blood; urine goes through the ureters to the bladder. Dialysis is an artificial kidney.'
      check:
        prompt: Transpiration helps…
        options:
        - Pull water up the xylem
        - Move food in phloem
        - Filter blood
        answer: Pull water up the xylem
        why: Evaporation from leaves creates the pull.
      ways:
      - style: visual
        teach: Xylem and phloem in a plant, side by side.
        picture:
          kind: compare
          columns:
          - title: Xylem
            points:
            - water and minerals
            - upwards only
            - pulled by transpiration
          - title: Phloem
            points:
            - food (sugars)
            - up and down
            - uses energy (ATP)
          alt: Xylem carries water and minerals upwards only, pulled by transpiration. Phloem carries food up and down and uses energy.
      - style: step_by_step
        teach: 'Follow how a nephron makes urine. Step 1: Blood is filtered in the glomerulus inside Bowman''s capsule. Step 2: Glucose, amino acids, salts and much water are taken back into the blood along the tubule. Step 3: What is left is urine. Step 4: It flows through the ureter to the bladder.'
  items:
  - prompt: Which blood vessels carry blood away from the heart?
    options:
    - Arteries
    - Veins
    - Capillaries
    - Lymph vessels
    answer: Arteries
    difficulty: 1
    hints:
    - A for Away.
    - Thick, elastic walls.
    solution: Arteries carry blood away from the heart under high pressure.
    mistakes:
      Veins: c10s_artery_vein
  - prompt: Which chamber of the heart has the thickest wall?
    options:
    - Left ventricle
    - Right atrium
    - Left atrium
    - Right ventricle
    answer: Left ventricle
    difficulty: 2
    hints:
    - It pumps blood to the whole body.
    - That needs the most force.
    solution: The left ventricle pumps blood to the whole body, so its muscular wall is thickest.
    mistakes: {"Right atrium": "t10_left_ventricle", "Right ventricle": "t10_left_ventricle"}
  - prompt: How many chambers does the human heart have?
    answer: '4'
    check: 2 + 2
    difficulty: 1
    hints:
    - Two atria.
    - Two ventricles.
    solution: 'Two atria and two ventricles: 4 chambers.'
    mistakes: {"2": "t10_heart_chambers", "3": "t10_heart_chambers"}
  - prompt: 'Water moves up a tall tree mainly because of:'
    options:
    - "Transpiration pulling water from the leaves"
    - "Phloem pumping it up from the roots"
    - "Gravity pulling it upwards through the stem"
    - "The heart of the tree beating to push it"
    answer: Transpiration pulling water from the leaves
    difficulty: 2
    hints:
    - Water evaporates from leaves.
    - This creates a suction pull in the xylem.
    solution: Evaporation from leaves (transpiration) pulls a column of water up through the xylem.
    mistakes:
      "Phloem pumping it up from the roots": c10s_xylem_phloem
  - prompt: What is the basic filtering unit of the kidney?
    options:
    - Nephron
    - Neuron
    - Alveolus
    - Villus
    answer: Nephron
    difficulty: 1
    hints:
    - Each kidney has about a million.
    - Neuron is a nerve cell.
    solution: The nephron filters blood and forms urine.
    mistakes: {"Neuron": "t10_nephron", "Alveolus": "t10_nephron"}
  - prompt: Which tissue carries food made in the leaves to other parts of the plant?
    options:
    - Phloem
    - Xylem
    - Stomata
    - Root hairs
    answer: Phloem
    difficulty: 1
    hints:
    - Xylem carries water.
    - Translocation.
    solution: Phloem transports food (sugars) from leaves to other parts.
    mistakes:
      Xylem: c10s_xylem_phloem
  - prompt: Which blood vessels are only one cell thick?
    options:
    - Capillaries
    - Arteries
    - Veins
    - Aorta
    answer: Capillaries
    difficulty: 1
    hints:
    - Exchange needs thin walls.
    - They are the tiniest vessels.
    solution: Capillaries have walls one cell thick so materials can pass through.
    mistakes:
      Veins: c10s_artery_vein
  - prompt: What stops blood flowing backwards in veins?
    options:
    - Valves
    - Platelets
    - Thick muscle walls
    - Capillaries
    answer: Valves
    difficulty: 1
    hints:
    - Blood in veins is at low pressure.
    - Flaps that open one way.
    solution: Veins have valves that let blood flow only towards the heart.
    mistakes:
      Thick muscle walls: c10s_artery_vein
  - prompt: Which part of blood helps it clot at a cut?
    options:
    - Platelets
    - Red blood cells
    - Plasma
    - Haemoglobin
    answer: Platelets
    difficulty: 1
    hints:
    - Small cell pieces.
    - They plug leaks.
    solution: Platelets help blood clot and stop bleeding.
    mistakes:
      Red blood cells: c10s5_blood_parts
  - prompt: Why do mammals and birds need double circulation?
    options:
    - "To keep oxygen-rich and oxygen-poor blood apart for a high energy supply"
    - "Because they have two hearts, one for each side of the body"
    - "Because they live in water and need extra oxygen from it"
    - "To make urine twice as fast as other animals"
    answer: To keep oxygen-rich and oxygen-poor blood apart for a high energy supply
    difficulty: 3
    hints:
    - They keep a constant body temperature.
    - That needs lots of energy, so lots of oxygen.
    solution: Separating the blood gives an efficient oxygen supply for warm-blooded animals.
    mistakes:
      "Because they have two hearts, one for each side of the body": c10s5_circulation
  - prompt: How many chambers does a fish heart have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Fish have single circulation.
    - Blood goes heart → gills → body.
    solution: 'A fish heart has 2 chambers: one atrium and one ventricle.'
    mistakes:
      '4': c10s5_circulation
      '3': c10s5_circulation
  - prompt: The movement of food through phloem is called…
    options:
    - Translocation
    - Transpiration
    - Excretion
    - Osmosis
    answer: Translocation
    difficulty: 2
    hints:
    - It is not about water.
    - '''Trans'' + ''location'': moving to places.'
    solution: Food moving in phloem is translocation.
    mistakes:
      Transpiration: c10s_xylem_phloem
  - prompt: Urine passes from the kidneys to the urinary bladder through the…
    options:
    - Ureters
    - Urethra
    - Nephrons
    - Arteries
    answer: Ureters
    difficulty: 2
    hints:
    - Two tubes, one from each kidney.
    - The urethra comes after the bladder.
    solution: The ureters carry urine from each kidney to the bladder.
    mistakes:
      Urethra: t10_nephron
  - prompt: What is used when a person's kidneys fail?
    options:
    - "Dialysis (artificial kidney)"
    - "A pacemaker for the heart"
    - "An inhaler for the lungs"
    - "Insulin injections daily"
    answer: Dialysis (artificial kidney)
    difficulty: 1
    hints:
    - It cleans the blood outside the body.
    - It does the kidney's job.
    solution: Haemodialysis filters wastes from the blood like a kidney.
    mistakes:
      "A pacemaker for the heart": t10_nephron
  - prompt: How do plants get rid of some wastes?
    options:
    - "Storing them in old leaves that fall off"
    - "Through kidneys in their roots"
    - "By breathing out urea through the leaves"
    - "Through blood that flows to the roots"
    answer: Storing them in old leaves that fall off
    difficulty: 2
    hints:
    - Plants have no special excretory organs.
    - What happens to old leaves?
    solution: Plants store wastes in old leaves, bark and resins, and shed them.
    mistakes:
      "Through kidneys in their roots": c10s5_plant_excrete
  - prompt: 'Assertion (A): The left ventricle has a thicker wall than the right ventricle.

      Reason (R): The left ventricle pumps blood to the whole body, while the right ventricle pumps it only to the lungs.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Pumping blood all round the body needs much more force, so the left ventricle wall is thicker; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: On a hot, dry, windy afternoon, a potted plant''s leaves droop even though the soil is moist. Which process is happening faster than the roots can keep up with?'
    options:
    - Transpiration from the leaves
    - Translocation of food in phloem
    - Photosynthesis at night
    answer: Transpiration from the leaves
    hints:
    - Heat and wind dry out leaves.
    - Which process loses water from leaves through stomata?
    solution: Hot, dry, windy air speeds up transpiration, so leaves lose water faster than the roots supply it and droop.
    mistakes:
      Translocation of food in phloem: c10s_xylem_phloem
      Photosynthesis at night: c10s_xylem_phloem
    exam: case
    difficulty: 2
  - prompt: 'Situation: A blood test shows a person has very few platelets. What problem is most likely?'
    options:
    - Cuts keep bleeding for a long time
    - Too little oxygen is carried
    - Food is not digested
    answer: Cuts keep bleeding for a long time
    hints:
    - What is the job of platelets?
    - What happens at a cut if blood cannot clot?
    solution: Platelets help blood clot. With too few, cuts keep bleeding.
    mistakes:
      Too little oxygen is carried: c10s5_blood_parts
      Food is not digested: c10s5_blood_parts
    exam: competency
    difficulty: 2
