# CBSE Class 10 Science (NCERT), chapter 5. Format: content/README.md.
subject: cbse10-sci
chapter: 5
title: Life Processes
tips:
  c10s_enzyme_place: "Pepsin works in the stomach on protein. Starch digestion starts earlier, in the mouth, with an enzyme found in saliva."
  c10s_anaerobic_kind: "Without oxygen, muscles make one product; yeast makes a different pair, which is why dough rises and drinks ferment."
  c10s_artery_vein: "A for Away: one kind of vessel carries blood from the heart under high pressure; the other brings it back."
  c10s_xylem_phloem: "Plants have two transport tissues: one made of dead, hollow tubes for water moving up, one of living sieve tubes for food. Gases enter leaves through tiny pores, and water is pulled up as leaves lose water vapour."
  t10_bile_role: "Bile contains no enzymes. It breaks big fat drops into tiny ones. What is that called?"
  t10_count_oxygen: "Count O atoms on the left, subtract the O in glucose, then halve for O₂ molecules."
  t10_heart_chambers: "Count both atria and both ventricles."
  t10_left_ventricle: "Which chamber pumps blood the furthest, to the whole body?"
  t10_nephron: "Neurons are nerve cells; alveoli are in the lungs. What is the kidney's filtering unit?"
  t10_stomata: "Gases enter and leave leaves through tiny pores on their surface."
  t10_villi_absorb: "Absorption needs a huge surface. Which part of the gut has millions of finger-like villi?"
  c10s5_auto_hetero: Does the living thing make its own food from simple things like CO₂ and water, or does it take in food made by others?
  c10s5_photo_needs: 'Photosynthesis needs four things: sunlight, chlorophyll, carbon dioxide and water. Which one did the experiment take away?'
  c10s5_gut_order: 'Follow the food: mouth, oesophagus, stomach, small intestine, large intestine. Where are you in that journey?'
  c10s5_resp_energy: Breathing in oxygen lets glucose be broken down fully and gives the most energy. Without oxygen, less energy is released.
  c10s5_blood_parts: "Each part of blood has one main job: carrying oxygen, fighting germs, sealing cuts, or carrying dissolved food. Which part does this job?"
  c10s5_circulation: 'Mammals use double circulation: blood goes through the heart twice in one full trip, once for the lungs and once for the body.'
  c10s5_plant_excrete: Plants get rid of extra water by transpiration and store some wastes in old leaves, bark and resins. Which route fits here?
concepts:
- code: cbse10s.life.nutrition
  title: Nutrition and respiration
  notes: |
    Life processes keep an organism alive: nutrition, respiration, transport and excretion. Autotrophs (green
    plants) make food by photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ with sunlight and chlorophyll; CO₂ enters
    through stomata, whose guard cells open and close them. Heterotrophs take in food: holozoic (amoeba engulfs
    food with pseudopodia), saprophytic (fungi), parasitic (Cuscuta, lice). Human digestion: mouth (salivary
    amylase: starch → sugar), stomach (HCl, pepsin, mucus), small intestine (bile from the liver emulsifies fats;
    pancreatic juice has trypsin and lipase; villi absorb digested food), large intestine (absorbs water).
    Respiration breaks down glucose for energy (ATP). Aerobic, in mitochondria: glucose → CO₂ + H₂O + much
    energy. Anaerobic in yeast: → ethanol + CO₂; in muscles short of oxygen: → lactic acid (cramps).
  explanations:
    text: Every living thing needs food and energy. Plants make their own food from carbon dioxide and water using sunlight; animals digest food made by others. Cells then 'burn' glucose in respiration to release energy, fully with oxygen or partly without it.
    visual: 'Draw a leaf as a kitchen: CO₂ comes in through tiny doors (stomata), water arrives through pipes from the roots, sunlight is the stove, and glucose and oxygen come out.'
    step_by_step: 'Step 1: Ask who makes the food: a plant (photosynthesis) or an animal (digestion)? Step 2: For digestion, follow the food: mouth, stomach, small intestine, large intestine. Step 3: For energy, ask whether oxygen is present: aerobic gives CO₂ + water; without it, ethanol (yeast) or lactic acid (muscles).'
    real_world: After a fast sprint your legs ache. Your muscles ran short of oxygen and made lactic acid by anaerobic respiration.
  picture:
    kind: flow
    steps:
    - Glucose (6 carbons) in the cytoplasm
    - Breaks into pyruvate (3 carbons) + a little energy
    - 'With oxygen, in mitochondria: CO₂ + H₂O + lots of energy'
    - 'No oxygen in muscle: lactic acid + a little energy'
    - 'No oxygen in yeast: ethanol + CO₂ + a little energy'
    alt: 'Respiration pathways: glucose becomes pyruvate, which goes on to carbon dioxide and water with oxygen, or to lactic acid in muscle or ethanol and carbon dioxide in yeast without oxygen.'
  activity:
    type: sort
    prompt: How does each one get its food?
    bins:
    - Autotrophic
    - Holozoic
    - Parasitic
    - Saprophytic
    items:
    - label: Green plants
      bin: Autotrophic
      clue: Do they make their own food?
      why: 'They make food by photosynthesis: autotrophic.'
    - label: Humans
      bin: Holozoic
      clue: Do we take in whole food and digest it inside?
      why: 'We ingest food and digest it inside: holozoic.'
    - label: Amoeba
      bin: Holozoic
      clue: Does it engulf food with false feet?
      why: 'Amoeba takes in whole food and digests it in a food vacuole: holozoic.'
    - label: Cuscuta (amarbel)
      bin: Parasitic
      clue: It is a plant without green leaves. Where does it get food?
      why: 'It takes food from the host plant it wraps around: parasitic.'
    - label: Tapeworm
      bin: Parasitic
      clue: Does it live inside another animal and take its food?
      why: 'It lives in the gut of its host and absorbs food: parasitic.'
    - label: Mushroom
      bin: Saprophytic
      clue: Does it feed on living or dead matter?
      why: 'It breaks down dead matter outside its body and absorbs it: saprophytic.'
    - label: Bread mould
      bin: Saprophytic
      clue: What does mould grow on?
      why: 'It feeds on dead food matter: saprophytic.'
    - label: Lice
      bin: Parasitic
      clue: Do lice feed on a living host?
      why: 'Lice suck blood from a living host: parasitic.'
    - label: Cow
      bin: Holozoic
      clue: Does a cow eat whole grass and digest it inside?
      why: 'It ingests and digests food inside: holozoic.'
  lesson:
    - teach: 'Life processes keep us alive: nutrition, respiration, transport and excretion. In autotrophic nutrition, green plants make food by photosynthesis: carbon dioxide + water → glucose + oxygen, using sunlight and chlorophyll. Heterotrophs (animals, fungi) take in food made by others.'
      picture:
        kind: flow
        steps:
        - CO₂ in through stomata
        - Water up from roots
        - Chlorophyll traps sunlight
        - Glucose made, O₂ given out
        alt: 'Photosynthesis: carbon dioxide enters through stomata, water comes up from the roots, chlorophyll traps sunlight, and glucose is made while oxygen is given out.'
      check:
        prompt: Which gas do plants give out in photosynthesis?
        options:
        - Oxygen
        - Carbon dioxide
        - Nitrogen
        answer: Oxygen
        why: Water is split and oxygen released.
    - teach: 'Human digestion: saliva (salivary amylase) starts on starch in the mouth; the stomach makes HCl, pepsin and mucus; in the small intestine, bile from the liver emulsifies fats and pancreatic juice digests proteins, carbohydrates and fats. Villi absorb the digested food. The large intestine absorbs water.'
      check:
        prompt: Where is digestion completed?
        options:
        - Small intestine
        - Stomach
        - Large intestine
        answer: Small intestine
        why: Pancreatic and intestinal juices finish the job there.
    - teach: 'Respiration releases energy from glucose. Aerobic (with oxygen, in mitochondria): CO₂ + water + lots of energy. Anaerobic: yeast makes ethanol + CO₂; muscles short of oxygen make lactic acid (cramps). Energy is stored as ATP. In humans, air passes nose → trachea → bronchi → alveoli, where gases are exchanged.'
      check:
        prompt: Where in the cell does aerobic respiration finish?
        options:
        - Mitochondria
        - Nucleus
        - Cell wall
        answer: Mitochondria
        why: Pyruvate is broken down fully there.
  items:
  - prompt: Through which openings does carbon dioxide enter a leaf?
    options:
    - Stomata
    - Root hairs
    - Xylem
    - Villi
    answer: Stomata
    difficulty: 1
    hints:
    - Tiny pores on the leaf surface.
    - Guard cells open and close them.
    solution: CO₂ enters through stomata, controlled by guard cells.
    mistakes: {"Root hairs": "t10_stomata", "Xylem": "c10s_xylem_phloem"}
  - prompt: Which enzyme in saliva begins the digestion of starch?
    options:
    - Salivary amylase
    - Pepsin
    - Trypsin
    - Lipase
    answer: Salivary amylase
    difficulty: 1
    hints:
    - Starch is a carbohydrate.
    - Pepsin works on proteins in the stomach.
    solution: Salivary amylase breaks starch into sugar in the mouth.
    mistakes:
      Pepsin: c10s_enzyme_place
  - prompt: What does bile do?
    options:
    - Breaks fat into small droplets (emulsifies it)
    - Digests proteins
    - Kills all bacteria in the stomach
    - Absorbs water
    answer: Breaks fat into small droplets (emulsifies it)
    difficulty: 2
    hints:
    - Bile has no enzymes.
    - It helps lipase work.
    solution: Bile from the liver emulsifies fats so lipase can digest them faster. It also makes the food alkaline.
    mistakes: {"Digests proteins": "t10_bile_role", "Absorbs water": "t10_bile_role"}
  - prompt: Where is most digested food absorbed?
    options:
    - In the villi of the small intestine
    - In the stomach
    - In the large intestine
    - In the mouth
    answer: In the villi of the small intestine
    difficulty: 1
    hints:
    - Finger-like projections.
    - Large surface area.
    solution: The villi of the small intestine give a huge surface area for absorbing digested food.
    mistakes: {"In the stomach": "t10_villi_absorb", "In the large intestine": "t10_villi_absorb"}
  - prompt: 'Yeast respiring without oxygen produces:'
    options:
    - Ethanol and carbon dioxide
    - Lactic acid
    - Carbon dioxide and water only
    - Oxygen and glucose
    answer: Ethanol and carbon dioxide
    difficulty: 2
    hints:
    - This is used in bread and brewing.
    - Lactic acid is in muscles.
    solution: Anaerobic respiration in yeast gives ethanol, CO₂ and a little energy.
    mistakes:
      Lactic acid: c10s_anaerobic_kind
  - prompt: In photosynthesis, 6CO₂ + 6H₂O → C₆H₁₂O₆ + xO₂. Find x.
    answer: '6'
    check: (6*2 + 6 - 6)/2
    difficulty: 2
    hints:
    - Count oxygen atoms on the left.
    - 12 + 6 = 18; glucose has 6.
    solution: 'Step 1: O on the left = 12 + 6 = 18. Step 2: Glucose uses 6. Step 3: 12 O left = 6 O₂.'
    mistakes: {"12": "t10_count_oxygen", "9": "t10_count_oxygen"}
  - prompt: Mushrooms and bread mould break down dead matter outside their bodies and absorb it. This is…
    options:
    - Saprotrophic nutrition
    - Autotrophic nutrition
    - Parasitic nutrition
    - Photosynthesis
    answer: Saprotrophic nutrition
    difficulty: 2
    hints:
    - They don't make their own food.
    - They feed on dead and decaying matter.
    solution: Feeding on dead matter by absorbing it is saprotrophic nutrition.
    mistakes:
      Autotrophic nutrition: c10s5_auto_hetero
  - prompt: Cuscuta (amarbel) lives on another plant and takes food from it. This is…
    options:
    - Parasitic nutrition
    - Autotrophic nutrition
    - Saprotrophic nutrition
    - Holozoic nutrition
    answer: Parasitic nutrition
    difficulty: 2
    hints:
    - It harms its host.
    - It takes food from a living plant.
    solution: Taking food from a living host is parasitic nutrition.
    mistakes:
      Autotrophic nutrition: c10s5_auto_hetero
  - prompt: A plant is kept in the dark for 3 days, then one leaf is tested with iodine. What happens?
    options:
    - 'No blue-black colour: no starch'
    - It turns blue-black
    - It turns red
    - It glows
    answer: 'No blue-black colour: no starch'
    difficulty: 3
    hints:
    - Iodine turns starch blue-black.
    - In the dark, can starch be made?
    solution: Without light no starch is made, and stored starch is used up, so iodine shows no blue-black.
    mistakes:
      It turns blue-black: c10s5_photo_needs
  - prompt: Which acid is made in the stomach?
    options:
    - Hydrochloric acid
    - Sulphuric acid
    - Lactic acid
    - Nitric acid
    answer: Hydrochloric acid
    difficulty: 1
    hints:
    - It helps pepsin work.
    - It also kills germs in food.
    solution: Gastric glands make hydrochloric acid.
    mistakes:
      Lactic acid: c10s_anaerobic_kind
  - prompt: Why do we get muscle cramps after running hard?
    options:
    - Lactic acid builds up when oxygen runs short
    - Muscles make alcohol
    - Too much oxygen
    - Glucose turns to starch
    answer: Lactic acid builds up when oxygen runs short
    difficulty: 2
    hints:
    - Oxygen can't reach the muscles fast enough.
    - What do muscles make without oxygen?
    solution: Muscles respire anaerobically and lactic acid builds up, causing cramps.
    mistakes:
      Muscles make alcohol: c10s_anaerobic_kind
  - prompt: What is the energy currency of the cell?
    options:
    - ATP
    - Glucose
    - Oxygen
    - Chlorophyll
    answer: ATP
    difficulty: 1
    hints:
    - Energy from respiration is stored in this molecule.
    - Three letters.
    solution: Energy released in respiration is stored as ATP and used for cell work.
    mistakes:
      Glucose: c10s5_resp_energy
  - prompt: Where in the lungs are gases exchanged with the blood?
    options:
    - Alveoli
    - Trachea
    - Bronchi
    - Larynx
    answer: Alveoli
    difficulty: 1
