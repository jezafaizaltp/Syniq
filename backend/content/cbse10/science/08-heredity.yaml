# CBSE Class 10 Science (NCERT), chapter 8. Format: content/README.md.
subject: cbse10-sci
chapter: 8
title: Heredity
tips:
  c10s_no_blending: 'Traits don''t blend: the dominant one shows fully.'
  c10s_ratio_part: 'That''s the tall plants. Dwarf is only 1 part of the 3 : 1.'
  c10s_genotype_phenotype: "3 : 1 is how the plants look (phenotype). For the gene pairs, write out the Punnett square from Tt × Tt and count each pair."
  c10s_sex_father: Every egg carries X. Whether the sperm carries X or Y decides the sex.
  c10s_pairs_count: "A human body cell has 46 chromosomes. The question asks for pairs: how many pairs make 46?"
  c10s_independent_chance: "Each child is a new, separate chance, like a fresh coin toss. Earlier children don't change it."
  t10_gamete_halve: "Body cells have 46. Gametes carry half."
  t10_gene_def: "A gene is smaller than a chromosome: a stretch of DNA."
  t10_independent: "Look at the new combinations in F2, like round-green. Could they appear if traits always stayed together?"
  t10_ratio_parts: "Add the ratio parts (9 + 3 + 3 + 1). Each part is 160 ÷ that total. Both-recessive is 1 part."
  t10_temperature_sex: "In some reptiles there are no sex chromosomes. What outside condition decides?"
  t10_xy: "Males and females differ by one chromosome: which pair has a Y?"
  c10s8_dominant: When two different versions of a trait meet, the dominant one shows and the recessive one hides. A hidden trait can come back when two hidden copies meet.
  c10s8_square: Write the gametes of each parent along the sides of a 2 × 2 square and fill in the four boxes. Then count.
  c10s8_inherited_acquired: An inherited trait comes from genes in the gametes. A trait gained during life, like a skill or an injury, does not change the genes.
  c10s8_gene_protein: A gene carries the instructions for a protein, and the protein (often an enzyme or hormone) makes the trait.
  c10s8_xy_count: Mothers always pass on an X. Fathers pass on X or Y with equal chance.
concepts:
- code: cbse10s.heredity.mendel
  title: Mendel's rules of inheritance
  notes: |
    Heredity is the passing of traits from parents to offspring. Mendel crossed pea plants with contrasting
    traits (tall/dwarf, round/wrinkled seeds, violet/white flowers). Crossing pure tall (TT) with dwarf (tt):
    all F1 plants are tall (Tt), because tall is dominant and dwarf recessive. Selfing F1 gives F2 in the ratio
    3 tall : 1 dwarf (genotypes 1 TT : 2 Tt : 1 tt). Each trait is controlled by a pair of factors (genes), one
    from each parent, and each gamete gets one. In a dihybrid cross (round yellow × wrinkled green), F2 shows
    9 : 3 : 3 : 1, so traits are inherited independently. Genes are sections of DNA on chromosomes that control
    proteins, for example an enzyme for a growth hormone that decides height.
  explanations:
    text: Each parent passes one copy of every gene to a child. If one copy is 'dominant', it shows whenever it's there; the 'recessive' one only shows when both copies are recessive. That is why two tall pea plants carrying a hidden dwarf gene can have some dwarf offspring, about one in four.
    visual: 'Draw a 2 × 2 Punnett square. Write T and t across the top for one parent and T and t down the side for the other. Fill the boxes: TT, Tt, Tt, tt. Three boxes are tall, one is dwarf.'
    step_by_step: 'Step 1: Write each parent''s genes. Step 2: Split them into the gametes each can make. Step 3: Fill a Punnett square. Step 4: Count the boxes for each look (phenotype) and each gene pair (genotype).'
    real_world: A brown-eyed couple can have a blue-eyed child if both carry a hidden recessive gene, just as Mendel's tall pea plants could produce dwarf plants.
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: T
    - size: 1
      label: t
    rows:
    - size: 1
      label: T
    - size: 1
      label: t
    cells:
    - - TT tall
      - Tt tall
    - - Tt tall
      - tt dwarf
    alt: 'Punnett square for Tt crossed with Tt: boxes TT tall, Tt tall, Tt tall and tt dwarf, giving three tall to one dwarf.'
    caption: 'Tt × Tt gives 3 tall : 1 dwarf'
  activity:
    type: number_line
    min: 0
    max: 1000
    step: 25
    start: 0
    prompt: 'Mendel''s peas: T (tall) is dominant over t (dwarf). Mark how many of 1000 offspring you''d expect. The marker stays where you leave it.'
    goals:
    - prompt: 'Tt × Tt: about how many are dwarf?'
      target: 250
      hint: 'Draw the Punnett square: TT, Tt, tT, tt. Which boxes are dwarf?'
      mistakes:
      - when:
          v: 500
        say: Half? Only tt is dwarf, and tt fills 1 of the 4 boxes. Tt plants have a T, so they are tall.
      - when:
          v: 750
        say: '750 is the tall plants: TT, Tt and tT, 3 boxes of 4.'
    - prompt: Of those 1000, about how many are tall but carry the dwarf gene (Tt)?
      target: 500
      mistakes:
      - when:
          v: 750
        say: 750 is all the tall plants, but a third of them are TT, with no t at all.
      - when:
          v: 250
        say: '250 is TT (or tt). Tt fills 2 of the 4 boxes: Tt and tT.'
    - prompt: About how many are pure tall (TT)?
      target: 250
      mistakes:
      - when:
          v: 750
        say: '750 counts every tall plant. Pure tall has two T''s: just 1 box of 4.'
    - prompt: A test cross, Tt × tt. About how many of 1000 are dwarf?
      target: 500
      mistakes:
      - when:
          v: 250
        say: That's for Tt × Tt. With one tt parent, every box gets a t from it, so half are tt.
      - when:
          v: 1000
        say: The Tt parent can pass on T, so half the offspring are Tt and tall.
  lesson:
    - teach: 'Heredity is how traits pass from parents to children. Mendel crossed pea plants with contrasting traits, like tall and short. All F1 plants were tall: tall is dominant, short is recessive. When F1 plants self-pollinated, F2 had tall and short in a ratio of about 3 : 1. The short trait was hidden, not lost.'
      picture:
        kind: flow
        steps:
        - TT × tt
        - 'F1: all Tt (tall)'
        - Tt × Tt
        - 'F2: 1 TT, 2 Tt, 1 tt'
        - '3 tall : 1 short'
        alt: 'Mendel''s monohybrid cross: TT crossed with tt gives all tall Tt in F1; Tt selfed gives TT, Tt, Tt, tt in F2, a ratio of 3 tall to 1 short.'
      check:
        prompt: Which trait showed in all F1 plants?
        options:
        - The dominant one
        - The recessive one
        - A blend
        answer: The dominant one
        why: Tt shows the dominant trait.
    - teach: Each trait is controlled by a pair of factors, now called genes, one from each parent. Gametes carry only one of each pair. A gene is a section of DNA that carries the instructions for a protein; for example, a gene for an enzyme that makes a growth hormone decides plant height.
      check:
        prompt: How many copies of each gene does a gamete carry?
        options:
        - One
        - Two
        - Four
        answer: One
        why: Gametes carry one of each pair.
    - teach: 'Crossing two traits at once (round yellow × wrinkled green) gave F2 in 9 : 3 : 3 : 1, including new mixes like round green. So traits are inherited independently. Traits gained during life (acquired traits, like a skill) are not passed on, because they don''t change the DNA of gametes.'
      check:
        prompt: Can a wrestler's big muscles be inherited?
        options:
        - No, they are acquired
        - Yes, always
        - Only by sons
        answer: No, they are acquired
        why: Training doesn't change the genes.
  items:
  - prompt: 'A pure tall pea plant (TT) is crossed with a dwarf one (tt). The F1 plants are:'
    options:
    - All tall
    - All dwarf
    - Half tall, half dwarf
    - Medium height
    answer: All tall
    difficulty: 1
    hints:
    - Each F1 gets T and t.
    - T is dominant.
    solution: Every F1 plant is Tt. Tall is dominant, so all are tall.
    mistakes:
      Medium height: c10s_no_blending
  - prompt: F1 plants (Tt) are self-pollinated. Out of 400 F2 plants, about how many are dwarf?
    answer: '100'
    check: 400*Rational(1, 4)
    difficulty: 2
    hints:
    - 'F2 ratio is 3 tall : 1 dwarf.'
    - One quarter are dwarf.
    solution: 'Step 1: 1 in 4 are tt (dwarf). Step 2: 400 ÷ 4 = 100.'
    mistakes:
      '300': c10s_ratio_part
  - prompt: 'In the F2 generation of a monohybrid cross, the genotype ratio TT : Tt : tt is:'
    options:
    - '1 : 2 : 1'
    - '3 : 1'
    - '9 : 3 : 3 : 1'
    - '1 : 1'
    answer: '1 : 2 : 1'
    difficulty: 2
    hints:
    - Fill the Punnett square.
    - Count each gene pair.
    solution: 'TT, Tt, Tt, tt gives 1 : 2 : 1. The look (phenotype) ratio is 3 : 1.'
    mistakes:
      '3 : 1': c10s_genotype_phenotype
  - prompt: 'In a dihybrid cross Mendel got 9 : 3 : 3 : 1 in F2. What did this show?'
    options:
    - Different traits are inherited independently
    - Traits always stay together
    - Dwarf is dominant
    - Traits blend
    answer: Different traits are inherited independently
    difficulty: 2
    hints:
    - New combinations appeared.
    - Like round green and wrinkled yellow.
    solution: New combinations of traits appeared, so the genes for seed shape and colour were passed on independently.
    mistakes: {"Traits always stay together": "t10_independent", "Traits blend": "c10s_no_blending"}
  - prompt: 'In a 9 : 3 : 3 : 1 F2 of 160 plants, how many show both recessive traits?'
    answer: '10'
    check: 160*Rational(1, 9 + 3 + 3 + 1)
    difficulty: 3
    hints:
    - Total parts = 16.
    - Both recessive is 1 part.
    solution: 'Step 1: 9 + 3 + 3 + 1 = 16 parts. Step 2: 160 ÷ 16 = 10 per part. Step 3: Both recessive = 1 part = 10.'
    mistakes: {"90": "t10_ratio_parts", "16": "t10_ratio_parts"}
  - prompt: 'A gene is best described as:'
    options:
    - A section of DNA that controls a characteristic
    - A whole chromosome
    - A type of cell
    - A hormone
    answer: A section of DNA that controls a characteristic
    difficulty: 1
    hints:
    - Genes are on chromosomes.
    - They carry instructions for proteins.
    solution: A gene is a stretch of DNA that carries instructions for a protein, which affects a trait.
    mistakes: {"A whole chromosome": "t10_gene_def", "A hormone": "t10_gene_def"}
  - prompt: In Mendel's cross of tall (TT) and dwarf (tt) peas, what is the genotype of the F1 plants?
    options:
    - Tt
    - TT
    - tt
    - TTtt
    answer: Tt
    difficulty: 1
    hints:
    - Each parent gives one gene.
    - One T and one t.
    solution: 'Every F1 plant gets T from one parent and t from the other: Tt.'
    mistakes:
      TT: c10s8_square
  - prompt: Tt × tt. What fraction of offspring are dwarf? Type a fraction.
    answer: 1/2
    check: 2/4
    difficulty: 2
    hints:
    - 'Gametes: T or t, and only t.'
    - 'Fill the square: Tt, Tt, tt, tt.'
    solution: 2 of 4 boxes are tt, so half are dwarf.
    mistakes:
      1/4: c10s8_square
      3/4: c10s8_square
  - prompt: Two tall pea plants produce some dwarf offspring. What must both parents be?
    options:
    - Tt
    - TT
    - tt
    - One TT and one tt
    answer: Tt
    difficulty: 3
    hints:
    - Dwarf needs tt.
    - Each parent must pass on a t but still look tall.
    solution: Both parents must carry a hidden t and look tall, so both are Tt.
    mistakes:
      TT: c10s8_dominant
      One TT and one tt: c10s8_dominant
  - prompt: Which of these is an acquired trait?
    options:
    - Ability to swim learnt in a pool
    - Eye colour
    - Blood group
    - Shape of the earlobe
    answer: Ability to swim learnt in a pool
    difficulty: 1
    hints:
    - Acquired means gained during life.
    - Which one did you learn?
    solution: Swimming is learnt, so it is acquired and not passed on.
    mistakes:
      Eye colour: c10s8_inherited_acquired
      Blood group: c10s8_inherited_acquired
  - prompt: How does a gene control a trait like height in a plant?
    options:
    - It codes for a protein, such as an enzyme that makes a growth hormone
    - It grows into the stem
    - It carries water
    - It is a hormone itself
    answer: It codes for a protein, such as an enzyme that makes a growth hormone
    difficulty: 3
    hints:
    - Genes are instructions.
    - Instructions for making what?
    solution: A gene codes for a protein; if the enzyme works well, more growth hormone is made and the plant is tall.
    mistakes:
      It is a hormone itself: c10s8_gene_protein
  - prompt: 'In a round yellow × wrinkled green cross, F2 had 9 : 3 : 3 : 1. Out of 16, how many were round and yellow?'
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - Both dominant traits together is the biggest group.
    - Look at the first number of the ratio.
    solution: Round yellow (both dominant) is 9 of 16.
    mistakes:
      '1': t10_ratio_parts
      '3': t10_ratio_parts
  - prompt: Why did Mendel choose pea plants?
    options:
    - They have clear contrasting traits and grow quickly
    - They are trees
    - They don't have flowers
    - They live for many years
    answer: They have clear contrasting traits and grow quickly
    difficulty: 1
    hints:
    - He needed traits that are easy to tell apart.
    - And many generations.
    solution: Peas have clear either-or traits (tall/short, round/wrinkled) and a short life cycle.
    mistakes:
      They are trees: c10s8_dominant
  - prompt: A plant with genotype tt crossed with TT. Out of 100 offspring, how many are tall?
    answer: '100'
    check: '100'
    difficulty: 2
    hints:
    - Every offspring gets one T and one t.
    - Which trait shows in Tt?
    solution: All offspring are Tt, which look tall, so all 100 are tall.
    mistakes:
      '50': c10s8_square
      '75': c10s8_square
  - prompt: In a monohybrid F2 of 400 plants, how many are pure tall (TT)?
    answer: '100'
    check: 400 / 4
    difficulty: 2
    hints:
    - 'TT : Tt : tt = 1 : 2 : 1.'
    - TT is one part of four.
    solution: 400 ÷ 4 = 100.
    mistakes:
      '300': c10s_genotype_phenotype
      '200': c10s_genotype_phenotype
- code: cbse10s.heredity.sex
  title: How sex is decided in humans
  after:
  - cbse10s.heredity.mendel
  notes: |
    Humans have 23 pairs of chromosomes: 22 pairs are the same in both sexes and one pair is the sex
    chromosomes. Women have XX; men have XY. Every egg carries an X. A sperm carries either X or Y, in equal
    numbers. Egg + X sperm → XX (girl); egg + Y sperm → XY (boy). So the chance of a boy or a girl is 1/2 each
    time, and it is the father's sperm that decides the sex, not the mother. In some animals temperature
    decides sex (some turtles, crocodiles) and some snails can change sex.
  explanations:
    text: Whether a baby is a girl or a boy depends on one pair of chromosomes. Mothers always pass on an X; fathers pass on either an X or a Y. An X from the father makes a girl (XX), a Y makes a boy (XY), so each child has an even chance of being either.
    visual: 'Draw a 2 × 2 grid: mother''s X and X along the top, father''s X and Y down the side. Two boxes are XX (girls), two are XY (boys).'
    step_by_step: 'Step 1: Mother''s eggs: all X. Step 2: Father''s sperm: half X, half Y. Step 3: Combine. Step 4: XX = girl, XY = boy; chance 1/2 each.'
    real_world: 'Blaming a mother for having only daughters is wrong science: the sperm''s X or Y decides the sex, and it is chance each time.'
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: X (egg)
    - size: 1
      label: X (egg)
    rows:
    - size: 1
      label: X (sperm)
    - size: 1
      label: Y (sperm)
    cells:
    - - XX girl
      - XX girl
    - - XY boy
      - XY boy
    alt: 'Grid crossing the mother''s X eggs with the father''s X and Y sperm: two XX girls and two XY boys, an equal chance.'
    caption: 'Each child: 1/2 chance girl, 1/2 chance boy'
  activity:
    type: sort
    prompt: True or false?
    bins:
    - 'True'
    - 'False'
    items:
    - label: The mother decides if the baby is a boy or a girl
      bin: 'False'
      clue: What does every egg carry? Does that ever change?
      why: 'Every egg carries X. Whether the sperm brings X or Y decides it: not the mother.'
    - label: Every egg carries an X chromosome
      bin: 'True'
      clue: What are a woman's sex chromosomes?
      why: Women are XX, so every egg has an X.
    - label: About half of all sperm carry a Y chromosome
      bin: 'True'
      clue: What are a man's sex chromosomes?
      why: Men are XY, so sperm carry X or Y in equal numbers.
    - label: A boy gets his X chromosome from his father
      bin: 'False'
      clue: What does a father give to make a boy?
      why: A boy gets Y from his father, so his X comes from his mother.
    - label: Women have XX and men have XY
      bin: 'True'
      clue: Which pair is the same in both, and which differs?
      why: The 23rd pair is XX in women and XY in men.
    - label: Each birth has about a 1 in 2 chance of being a boy
      bin: 'True'
      clue: X sperm and Y sperm are equal in number. What does that mean?
      why: Equal X and Y sperm give about a 1/2 chance each time.
    - label: After three girls, a boy is more likely next
      bin: 'False'
      clue: Does the next sperm remember earlier births?
      why: 'Each birth is independent: still about 1/2.'
    - label: Humans have 23 pairs of chromosomes
      bin: 'True'
      clue: How many pairs, counting the sex chromosomes?
      why: '22 pairs plus one pair of sex chromosomes: 23 pairs.'
    - label: In some reptiles, temperature decides the sex
      bin: 'True'
      clue: Do all animals use X and Y chromosomes?
      why: In many turtles and crocodiles, the egg's temperature decides it.
  lesson:
    - teach: 'Humans have 23 pairs of chromosomes. 22 pairs are the same in men and women (autosomes). The 23rd pair is the sex chromosomes: women have XX, men have XY.'
      picture:
        kind: compare
        columns:
        - title: Woman
          points:
          - 22 pairs + XX
          - Every egg has X
        - title: Man
          points:
          - 22 pairs + XY
          - Half the sperm have X, half have Y
        alt: A woman has 22 pairs plus XX, so every egg carries X; a man has 22 pairs plus XY, so half his sperm carry X and half carry Y.
      check:
        prompt: Sex chromosomes of a woman?
        options:
        - XX
        - XY
        - YY
        answer: XX
        why: Women have two X.
    - teach: Every egg carries an X. A sperm carries X or Y with equal chance. X sperm + egg → XX (girl). Y sperm + egg → XY (boy). So the father's sperm decides the sex, and each child has about a 50% chance of either.
      check:
        prompt: A Y sperm fertilises an egg. The child is…
        options:
        - A boy
        - A girl
        - Either
        answer: A boy
        why: XY is male.
    - teach: Not all animals use chromosomes. In some reptiles the temperature of the eggs decides the sex. Snails can change sex. So sex determination varies across living things.
      check:
        prompt: In some turtles, sex depends on…
        options:
        - Egg temperature
        - Food
        - The father's colour
        answer: Egg temperature
        why: There are no sex chromosomes.
  items:
  - prompt: What are the sex chromosomes of a human male?
    options:
    - XY
    - XX
    - YY
    - XO
    answer: XY
    difficulty: 1
    hints:
    - Females are XX.
    - Males have one of each.
    solution: Males have XY; females have XX.
    mistakes: {"XX": "t10_xy", "YY": "t10_xy"}
  - prompt: Which parent's gamete decides the sex of the child?
    options:
    - The father's sperm
    - The mother's egg
    - Both equally
    - Neither; it depends on food
    answer: The father's sperm
    difficulty: 1
    hints:
    - Every egg has X.
    - Sperm can carry X or Y.
    solution: All eggs carry X, so the sperm (X or Y) decides the sex.
    mistakes:
      The mother's egg: c10s_sex_father
  - prompt: How many pairs of chromosomes does a human body cell have?
    answer: '23'
    check: 46/2
    difficulty: 1
    hints:
    - 46 chromosomes in all.
    - Half of 46 pairs.
    solution: 46 chromosomes make 23 pairs.
    mistakes:
      '46': c10s_pairs_count
  - prompt: A couple already has two daughters. What is the chance that their next child is a son?
    options:
    - 1/2
    - 1/3
    - 1/4
    - Certain
    answer: 1/2
    difficulty: 2
    hints:
    - Each child is a fresh event.
    - Sperm are half X, half Y.
    solution: 'Every child has an equal chance of XX or XY, whatever happened before: 1/2.'
    mistakes:
      Certain: c10s_independent_chance
  - prompt: In some turtles, what decides whether eggs hatch as males or females?
    options:
    - The temperature at which the eggs are kept
    - X and Y chromosomes only
    - The mother's diet
    - The number of eggs
    answer: The temperature at which the eggs are kept
    difficulty: 2
    hints:
    - Not all animals use X and Y.
    - It is an environmental factor.
    solution: In some reptiles the incubation temperature of the eggs decides the sex.
    mistakes: {"X and Y chromosomes only": "t10_temperature_sex", "The mother's diet": "t10_temperature_sex"}
  - prompt: Out of 44 autosomes and 2 sex chromosomes in a body cell, how many chromosomes does an egg cell carry?
    answer: '23'
    check: (44 + 2)/2
    difficulty: 2
    hints:
    - Gametes have half.
    - (44 + 2) ÷ 2.
    solution: 'Step 1: Total 46. Step 2: Egg has half: 23 (22 autosomes + X).'
    mistakes: {"46": "t10_gamete_halve", "22": "t10_gamete_halve"}
  - prompt: What are the sex chromosomes of a human female?
    options:
    - XX
    - XY
    - YY
    - X only
    answer: XX
    difficulty: 1
    hints:
    - Males have XY.
    - Females have two of the same.
    solution: Females have XX.
    mistakes:
      XY: t10_xy
  - prompt: Which sex chromosome does every egg carry?
    options:
    - X
    - Y
    - Either X or Y
    - None
    answer: X
    difficulty: 1
    hints:
    - The mother has XX.
    - She can only pass on one kind.
    solution: All eggs carry X.
    mistakes:
      Either X or Y: c10s_sex_father
  - prompt: What is the chance that a baby is a girl? Type a percentage number.
    answer: '50'
    check: 100 / 2
    difficulty: 1
    hints:
    - Half the sperm carry X.
    - Half carry Y.
    solution: X sperm and Y sperm are equally likely, so 50%.
    mistakes:
      '25': c10s8_xy_count
      '100': c10s8_xy_count
  - prompt: How many autosomes are in a human body cell?
    answer: '44'
    check: 22 * 2
    difficulty: 2
    hints:
    - Autosomes are the 22 non-sex pairs.
    - Count the chromosomes, not the pairs.
    solution: 22 pairs × 2 = 44 autosomes.
    mistakes:
      '22': c10s_pairs_count
      '46': c10s_pairs_count
  - prompt: A sperm with X fertilises an egg. What is the child's sex?
    options:
    - Girl
    - Boy
    - It depends on the mother
    - It cannot be known
    answer: Girl
    difficulty: 1
    hints:
    - The egg gives X too.
    - X + X = ?
    solution: 'X from the father + X from the mother = XX: a girl.'
    mistakes:
      It depends on the mother: c10s_sex_father
  - prompt: Is it fair to blame a mother for not having a son?
    options:
    - No, the father's sperm decides the sex
    - Yes, the egg decides
    - Yes, the mother's food decides
    - No, the grandparents decide
    answer: No, the father's sperm decides the sex
    difficulty: 2
    hints:
    - What does every egg carry?
    - Where can a Y come from?
    solution: Only the father can pass on Y, and it is chance; the mother has no say in it.
    mistakes:
      Yes, the egg decides: c10s_sex_father
  - prompt: How many sex chromosomes are in a human sperm cell?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - A gamete has one of each pair.
    - Sex chromosomes are one pair.
    solution: 'A sperm has 23 chromosomes: 22 autosomes and one sex chromosome (X or Y).'
    mistakes:
      '2': t10_gamete_halve
  - prompt: Which animal can change its sex?
    options:
    - Some snails
    - Humans
    - Dogs
    - Pea plants
    answer: Some snails
    difficulty: 2
    hints:
    - Not mammals.
    - A shelled animal in the textbook.
    solution: Some snails can change sex, showing sex is not always fixed by genes.
    mistakes:
      Humans: t10_temperature_sex
  - prompt: In humans, is sex determined by genes or by the environment?
    options:
    - By genes (sex chromosomes)
    - By temperature
    - By food
    - By light
    answer: By genes (sex chromosomes)
    difficulty: 1
    hints:
    - Think XX and XY.
    - Temperature works for some reptiles.
    solution: In humans, the sex chromosomes from the parents decide the sex.
    mistakes:
      By temperature: t10_temperature_sex
