# CBSE Class 10 Science (NCERT), chapter 8. Format: content/README.md.
subject: cbse10-sci
chapter: 8
title: Heredity
tips:
  c10s_no_blending: 'Traits don''t blend: the dominant one shows fully.'
  c10s_ratio_part: 'That''s the tall plants. Dwarf is only 1 part of the 3 : 1.'
  c10s_genotype_phenotype: '3 : 1 is how the plants look. The gene pairs are TT, Tt, Tt, tt: 1 : 2 : 1.'
  c10s_sex_father: Every egg carries X. Whether the sperm carries X or Y decides the sex.
  c10s_pairs_count: '46 is the number of chromosomes. They come in pairs: 23 pairs.'
  c10s_independent_chance: Each child is a new chance of 1/2, whatever the older children are.
concepts:
- code: cbse10s.heredity.mendel
  title: Mendel's rules of inheritance
  notes: |
    Heredity is the passing of traits from parents to offspring. Mendel crossed pea plants with contrasting
    traits (tall/dwarf, round/wrinkled seeds, violet/white flowers). Crossing pure tall (TT) with dwarf (tt):
    all F1 plants are tall (Tt), because tall is dominant and dwarf recessive. Selfing F1 gives F2 in the ratio
    3 tall : 1 dwarf (genotypes 1 TT : 2 Tt : 1 tt). Each trait is controlled by a pair of factors (genes), one
    from each parent, and each gamete gets one. In a dihybrid cross (round yellow × wrinkled green), F2 shows
    9 : 3 : 3 : 1, so traits are inherited independently. Genes are sections of DNA on chromosomes that control
    proteins, for example an enzyme for a growth hormone that decides height.
  explanations:
    text: Each parent passes one copy of every gene to a child. If one copy is 'dominant', it shows whenever it's there; the 'recessive' one only shows when both copies are recessive. That is why two tall pea plants carrying a hidden dwarf gene can have some dwarf offspring, about one in four.
    visual: 'Draw a 2 × 2 Punnett square. Write T and t across the top for one parent and T and t down the side for the other. Fill the boxes: TT, Tt, Tt, tt. Three boxes are tall, one is dwarf.'
    step_by_step: 'Step 1: Write each parent''s genes. Step 2: Split them into the gametes each can make. Step 3: Fill a Punnett square. Step 4: Count the boxes for each look (phenotype) and each gene pair (genotype).'
    real_world: A brown-eyed couple can have a blue-eyed child if both carry a hidden recessive gene, just as Mendel's tall pea plants could produce dwarf plants.
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: T
    - size: 1
      label: t
    rows:
    - size: 1
      label: T
    - size: 1
      label: t
    cells:
    - - TT tall
      - Tt tall
    - - Tt tall
      - tt dwarf
    alt: 'Punnett square for Tt crossed with Tt: boxes TT tall, Tt tall, Tt tall and tt dwarf, giving three tall to one dwarf.'
    caption: 'Tt × Tt gives 3 tall : 1 dwarf'
  items:
  - prompt: 'A pure tall pea plant (TT) is crossed with a dwarf one (tt). The F1 plants are:'
    options:
    - All tall
    - All dwarf
    - Half tall, half dwarf
    - Medium height
    answer: All tall
    difficulty: 1
    hints:
    - Each F1 gets T and t.
    - T is dominant.
    solution: Every F1 plant is Tt. Tall is dominant, so all are tall.
    mistakes:
      Medium height: c10s_no_blending
  - prompt: F1 plants (Tt) are self-pollinated. Out of 400 F2 plants, about how many are dwarf?
    answer: '100'
    check: 400*Rational(1, 4)
    difficulty: 2
    hints:
    - 'F2 ratio is 3 tall : 1 dwarf.'
    - One quarter are dwarf.
    solution: 'Step 1: 1 in 4 are tt (dwarf). Step 2: 400 ÷ 4 = 100.'
    mistakes:
      '300': c10s_ratio_part
  - prompt: 'In the F2 generation of a monohybrid cross, the genotype ratio TT : Tt : tt is:'
    options:
    - '1 : 2 : 1'
    - '3 : 1'
    - '9 : 3 : 3 : 1'
    - '1 : 1'
    answer: '1 : 2 : 1'
    difficulty: 2
    hints:
    - Fill the Punnett square.
    - Count each gene pair.
    solution: 'TT, Tt, Tt, tt gives 1 : 2 : 1. The look (phenotype) ratio is 3 : 1.'
    mistakes:
      '3 : 1': c10s_genotype_phenotype
  - prompt: 'In a dihybrid cross Mendel got 9 : 3 : 3 : 1 in F2. What did this show?'
    options:
    - Different traits are inherited independently
    - Traits always stay together
    - Dwarf is dominant
    - Traits blend
    answer: Different traits are inherited independently
    difficulty: 2
    hints:
    - New combinations appeared.
    - Like round green and wrinkled yellow.
    solution: New combinations of traits appeared, so the genes for seed shape and colour were passed on independently.
  - prompt: 'In a 9 : 3 : 3 : 1 F2 of 160 plants, how many show both recessive traits?'
    answer: '10'
    check: 160*Rational(1, 9 + 3 + 3 + 1)
    difficulty: 3
    hints:
    - Total parts = 16.
    - Both recessive is 1 part.
    solution: 'Step 1: 9 + 3 + 3 + 1 = 16 parts. Step 2: 160 ÷ 16 = 10 per part. Step 3: Both recessive = 1 part = 10.'
  - prompt: 'A gene is best described as:'
    options:
    - A section of DNA that controls a characteristic
    - A whole chromosome
    - A type of cell
    - A hormone
    answer: A section of DNA that controls a characteristic
    difficulty: 1
    hints:
    - Genes are on chromosomes.
    - They carry instructions for proteins.
    solution: A gene is a stretch of DNA that carries instructions for a protein, which affects a trait.
- code: cbse10s.heredity.sex
  title: How sex is decided in humans
  after:
  - cbse10s.heredity.mendel
  notes: |
    Humans have 23 pairs of chromosomes: 22 pairs are the same in both sexes and one pair is the sex
    chromosomes. Women have XX; men have XY. Every egg carries an X. A sperm carries either X or Y, in equal
    numbers. Egg + X sperm → XX (girl); egg + Y sperm → XY (boy). So the chance of a boy or a girl is 1/2 each
    time, and it is the father's sperm that decides the sex, not the mother. In some animals temperature
    decides sex (some turtles, crocodiles) and some snails can change sex.
  explanations:
    text: Whether a baby is a girl or a boy depends on one pair of chromosomes. Mothers always pass on an X; fathers pass on either an X or a Y. An X from the father makes a girl (XX), a Y makes a boy (XY), so each child has an even chance of being either.
    visual: 'Draw a 2 × 2 grid: mother''s X and X along the top, father''s X and Y down the side. Two boxes are XX (girls), two are XY (boys).'
    step_by_step: 'Step 1: Mother''s eggs: all X. Step 2: Father''s sperm: half X, half Y. Step 3: Combine. Step 4: XX = girl, XY = boy; chance 1/2 each.'
    real_world: 'Blaming a mother for having only daughters is wrong science: the sperm''s X or Y decides the sex, and it is chance each time.'
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: X (egg)
    - size: 1
      label: X (egg)
    rows:
    - size: 1
      label: X (sperm)
    - size: 1
      label: Y (sperm)
    cells:
    - - XX girl
      - XX girl
    - - XY boy
      - XY boy
    alt: 'Grid crossing the mother''s X eggs with the father''s X and Y sperm: two XX girls and two XY boys, an equal chance.'
    caption: 'Each child: 1/2 chance girl, 1/2 chance boy'
  items:
  - prompt: What are the sex chromosomes of a human male?
    options:
    - XY
    - XX
    - YY
    - XO
    answer: XY
    difficulty: 1
    hints:
    - Females are XX.
    - Males have one of each.
    solution: Males have XY; females have XX.
  - prompt: Which parent's gamete decides the sex of the child?
    options:
    - The father's sperm
    - The mother's egg
    - Both equally
    - Neither; it depends on food
    answer: The father's sperm
    difficulty: 1
    hints:
    - Every egg has X.
    - Sperm can carry X or Y.
    solution: All eggs carry X, so the sperm (X or Y) decides the sex.
    mistakes:
      The mother's egg: c10s_sex_father
  - prompt: How many pairs of chromosomes does a human body cell have?
    answer: '23'
    check: 46/2
    difficulty: 1
    hints:
    - 46 chromosomes in all.
    - Half of 46 pairs.
    solution: 46 chromosomes make 23 pairs.
    mistakes:
      '46': c10s_pairs_count
  - prompt: A couple already has two daughters. What is the chance that their next child is a son?
    options:
    - 1/2
    - 1/3
    - 1/4
    - Certain
    answer: 1/2
    difficulty: 2
    hints:
    - Each child is a fresh event.
    - Sperm are half X, half Y.
    solution: 'Every child has an equal chance of XX or XY, whatever happened before: 1/2.'
    mistakes:
      Certain: c10s_independent_chance
  - prompt: In some turtles, what decides whether eggs hatch as males or females?
    options:
    - The temperature at which the eggs are kept
    - X and Y chromosomes only
    - The mother's diet
    - The number of eggs
    answer: The temperature at which the eggs are kept
    difficulty: 2
    hints:
    - Not all animals use X and Y.
    - It is an environmental factor.
    solution: In some reptiles the incubation temperature of the eggs decides the sex.
  - prompt: Out of 44 autosomes and 2 sex chromosomes in a body cell, how many chromosomes does an egg cell carry?
    answer: '23'
    check: (44 + 2)/2
    difficulty: 2
    hints:
    - Gametes have half.
    - (44 + 2) ÷ 2.
    solution: 'Step 1: Total 46. Step 2: Egg has half: 23 (22 autosomes + X).'
