# CBSE Class 10 Science (NCERT), chapter 1. Format: content/README.md.
subject: cbse10-sci
chapter: 1
title: Chemical Reactions and Equations
tips:
  c10s_physical_change: Melting changes the state but not the substance. A chemical change makes a new substance.
  c10s_balance_count: 'Count the oxygen atoms: O₂ has two on the left, so you need two MgO on the right.'
  c10s_subscripts: Changing a subscript makes a different substance. Balance only with the numbers in front.
  c10s_reactivity_order: The metal that ends up inside the compound is the more reactive one.
  c10s_oxidised_reduced: The substance that gains oxygen is oxidised; the one that loses oxygen is reduced.
concepts:
- code: cbse10s.react.equations
  title: Writing and balancing chemical equations
  notes: |
    A chemical reaction makes new substances; signs include a change of colour, a gas given off, a precipitate,
    a change of temperature or a change of state. A chemical equation writes reactants → products using
    formulae. Because atoms are neither made nor destroyed (law of conservation of mass), an equation is
    balanced so that each element has the same number of atoms on both sides. Only the coefficients in front
    of formulae are changed, never the subscripts. States are shown as (s), (l), (g), (aq).
  explanations:
    text: A chemical equation is a short sentence about a reaction. Balancing it means making sure every atom that goes in also comes out, because atoms can only be rearranged, not created or lost. You fix the count by putting numbers in front of formulas, never by changing the formulas themselves.
    visual: Draw the atoms as coloured balls on both sides of the arrow. For H₂ + O₂ → H₂O you see two red O balls on the left and one on the right. Put a 2 in front of H₂O, then you need four H balls on the left, so put a 2 in front of H₂.
    step_by_step: 'Step 1: Write the word equation, then the formulae. Step 2: Count atoms of each element on both sides. Step 3: Start with the element in the most complicated formula; change a coefficient. Step 4: Recount and repeat until every element matches. Step 5: Add state symbols.'
    real_world: When magnesium ribbon burns in a sparkler-like white flame, it leaves white powder. The equation 2Mg + O₂ → 2MgO tells you two magnesium atoms need one oxygen molecule.
  picture:
    kind: flow
    steps:
    - 'Skeleton: H₂ + O₂ → H₂O'
    - 'Count O: 2 on the left, 1 on the right'
    - 'Put 2 before H₂O: H₂ + O₂ → 2H₂O'
    - 'Now H: 2 on the left, 4 on the right'
    - 'Put 2 before H₂: 2H₂ + O₂ → 2H₂O, balanced'
    alt: 'Balancing hydrogen and oxygen making water: first fix the oxygen by writing 2H2O, then fix the hydrogen by writing 2H2.'
  activity:
    type: formula
    prompt: Balance CH₄ + O₂ → CO₂ + H₂O by choosing how many of each molecule. Never change the formulas.
    inputs:
    - name: a
      label: CH₄
      min: 1
      max: 6
      step: 1
      start: 1
    - name: b
      label: O₂
      min: 1
      max: 6
      step: 1
      start: 1
    - name: c
      label: CO₂
      min: 1
      max: 6
      step: 1
      start: 1
    - name: d
      label: H₂O
      min: 1
      max: 6
      step: 1
      start: 1
    outputs:
    - name: dc
      label: 'C atoms: left − right'
      expr: a-c
    - name: dh
      label: 'H atoms: left − right'
      expr: 4*a-2*d
    - name: do
      label: 'O atoms: left − right'
      expr: 2*b-(2*c+d)
    - name: tot
      label: Molecules in all
      expr: a+b+c+d
    goals:
    - prompt: Balance it with the smallest whole numbers.
      want:
        dc: 0
        dh: 0
        do: 0
        tot: 6
      hint: 'Balance C, then H, and leave O until last: count the O atoms on the right.'
      mistakes:
      - when:
          a: 1
          b: 1
          c: 1
          d: 2
        say: C and H balance, but the right has 2 + 2 = 4 oxygen atoms and one O₂ gives only 2.
      - when:
          a: 2
          b: 4
          c: 2
          d: 4
        say: Balanced, but every number can be halved. Use the smallest whole numbers.
      - when:
          a: 1
          b: 2
          c: 1
          d: 1
        say: One H₂O has only 2 H, but CH₄ has 4. Hydrogen doesn't balance.
    - prompt: Burn 2 molecules of methane and keep it balanced.
      want:
        a: 2
        dc: 0
        dh: 0
        do: 0
      mistakes:
      - when:
          a: 2
          b: 2
          c: 2
          d: 4
        say: 'Doubling the methane doubles the oxygen it needs too: count the O on the right.'
      - when:
          a: 2
          c: 1
        say: 2 CH₄ have 2 carbon atoms, so 2 CO₂ must come out.
  items:
  - prompt: Which of these shows that a chemical reaction has happened?
    options:
    - A gas is given off when two liquids are mixed
    - Ice melts into water
    - Sugar dissolves in water
    - A glass breaks
    answer: A gas is given off when two liquids are mixed
    difficulty: 1
    hints:
    - Melting and dissolving don't make a new substance.
    - A new gas is a new substance.
    solution: A gas given off means a new substance has formed. Melting, dissolving and breaking are physical changes.
    mistakes:
      Ice melts into water: c10s_physical_change
  - prompt: Why must a chemical equation be balanced?
    options:
    - Atoms are not created or destroyed in a reaction
    - To make the equation look neat
    - Because products are heavier
    - To show the colour change
    answer: Atoms are not created or destroyed in a reaction
    difficulty: 1
    hints:
    - Think about the law of conservation of mass.
    - The same atoms are rearranged.
    solution: Mass is conserved, so the number of atoms of each element must be the same on both sides.
  - prompt: 'Balance: Mg + O₂ → MgO. What number goes in front of MgO?'
    answer: '2'
    check: 2*1
    difficulty: 1
    hints:
    - 'Count O: 2 on the left.'
    - Each MgO has one O.
    solution: 'Step 1: O₂ has 2 O atoms. Step 2: Write 2MgO. Step 3: Then 2Mg on the left: 2Mg + O₂ → 2MgO.'
    mistakes:
      '1': c10s_balance_count
  - prompt: 'Balance: Fe + H₂O → Fe₃O₄ + H₂. What number goes in front of H₂O?'
    answer: '4'
    check: 4/1
    difficulty: 2
    hints:
    - Fe₃O₄ has 4 oxygen atoms.
    - Each H₂O gives one O.
    solution: 'Step 1: Fe₃O₄ needs 4 O, so 4H₂O. Step 2: That gives 8 H, so 4H₂. Step 3: 3Fe on the left: 3Fe + 4H₂O → Fe₃O₄ + 4H₂.'
  - prompt: A student balances H₂ + O₂ → H₂O by writing H₂ + O₂ → H₂O₂. What is wrong?
    options:
    - The formula of the product was changed
    - Nothing, it is balanced
    - Hydrogen is not balanced
    - The arrow should point left
    answer: The formula of the product was changed
    difficulty: 2
    hints:
    - H₂O₂ is hydrogen peroxide, a different substance.
    - Only coefficients may change.
    solution: Changing a subscript changes the substance. The correct balanced equation is 2H₂ + O₂ → 2H₂O.
    mistakes:
      Nothing, it is balanced: c10s_subscripts
  - prompt: 'Balance: C₃H₈ + O₂ → CO₂ + H₂O. What number goes in front of O₂?'
    answer: '5'
    check: (3*2 + 4)/2
    difficulty: 3
    hints:
    - C₃H₈ gives 3CO₂ and 4H₂O.
    - 'Count O on the right: 6 + 4.'
    solution: 'Step 1: 3 C → 3CO₂. Step 2: 8 H → 4H₂O. Step 3: O on the right = 3×2 + 4 = 10, so 5O₂.'
- code: cbse10s.react.types
  title: Types of chemical reactions
  after:
  - cbse10s.react.equations
  notes: |
    Combination: two or more substances form one (CaO + H₂O → Ca(OH)₂, quicklime slaking, exothermic).
    Decomposition: one substance breaks into simpler ones by heat (thermal: CaCO₃ → CaO + CO₂), electricity
    (electrolysis of water) or light (2AgCl → 2Ag + Cl₂, used in black-and-white photography).
    Displacement: a more reactive element pushes a less reactive one out of its compound (Fe + CuSO₄ → FeSO₄ + Cu).
    Double displacement: ions are exchanged, often forming a precipitate (Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl).
    Oxidation is gain of oxygen or loss of hydrogen; reduction is loss of oxygen or gain of hydrogen; a redox
    reaction has both (CuO + H₂ → Cu + H₂O). Exothermic reactions give out heat (respiration); endothermic ones
    take it in. Everyday effects: corrosion (rusting of iron) and rancidity (oxidation of fats; prevented by
    antioxidants or nitrogen-filled packets).
  explanations:
    text: 'Most reactions fit a few patterns. Things join (combination), one thing splits (decomposition), one element swaps into a compound (displacement), or two compounds swap partners (double displacement). Many reactions also move oxygen around: whatever gains oxygen is oxidised, whatever loses it is reduced.'
    visual: 'Picture dance partners. Combination: two dancers pair up. Decomposition: a pair splits. Displacement: a newcomer cuts in and takes a partner. Double displacement: two pairs swap partners.'
    step_by_step: 'Step 1: Count reactants and products. Step 2: Two or more → one is combination; one → two or more is decomposition. Step 3: Element + compound → element + compound is displacement. Step 4: Compound + compound swapping ions is double displacement. Step 5: Track oxygen or hydrogen for oxidation and reduction.'
    real_world: An iron nail left in blue copper sulphate solution turns brown and the blue fades. Iron is more reactive than copper, so it displaces copper from the solution.
  picture:
    kind: compare
    columns:
    - title: Joining and splitting
      points:
      - 'Combination: A + B → AB'
      - CaO + H₂O → Ca(OH)₂
      - 'Decomposition: AB → A + B'
      - CaCO₃ → CaO + CO₂ (by heat)
    - title: Swapping
      points:
      - 'Displacement: A + BC → AC + B'
      - Fe + CuSO₄ → FeSO₄ + Cu
      - 'Double displacement: AB + CD → AD + CB'
      - Na₂SO₄ + BaCl₂ → BaSO₄ + 2NaCl
    alt: 'Two columns of reaction types: joining and splitting (combination and decomposition), and swapping (displacement and double displacement), each with an example.'
  activity:
    type: sort
    prompt: What type of reaction is each one?
    bins:
    - Combination
    - Decomposition
    - Displacement
    - Double displacement
    items:
    - label: CaO + H₂O → Ca(OH)₂
      bin: Combination
      clue: How many products are made?
      why: 'Two substances join into one: combination (slaking lime, which gets hot).'
    - label: CaCO₃ → CaO + CO₂ on heating
      bin: Decomposition
      clue: How many substances do you start with?
      why: 'One substance breaks into two on heating: thermal decomposition.'
    - label: Fe + CuSO₄ → FeSO₄ + Cu
      bin: Displacement
      clue: Does one element push another out of its compound?
      why: 'More reactive iron pushes copper out: displacement.'
    - label: Na₂SO₄ + BaCl₂ → BaSO₄ + 2NaCl
      bin: Double displacement
      clue: Do the two compounds swap partners?
      why: 'The ions swap partners and white BaSO₄ precipitates: double displacement.'
    - label: 2AgCl → 2Ag + Cl₂ in sunlight
      bin: Decomposition
      clue: Is one thing breaking apart, using light?
      why: 'Light splits silver chloride: photolytic decomposition.'
    - label: 2Mg + O₂ → 2MgO
      bin: Combination
      clue: How many products?
      why: 'Magnesium and oxygen join into one product: combination.'
    - label: Zn + H₂SO₄ → ZnSO₄ + H₂
      bin: Displacement
      clue: Is an element replacing another in a compound?
      why: 'Zinc pushes hydrogen out of the acid: displacement.'
    - label: Water split by electricity into H₂ and O₂
      bin: Decomposition
      clue: One substance or two at the start?
      why: 'Electricity breaks water into two gases: electrolytic decomposition.'
    - label: AgNO₃ + NaCl → AgCl + NaNO₃
      bin: Double displacement
      clue: 'Two compounds in, two out: did they swap?'
      why: 'Ag and Na swap partners: double displacement.'
  items:
  - prompt: CaO + H₂O → Ca(OH)₂ is which type of reaction?
    options:
    - Combination
    - Decomposition
    - Displacement
    - Double displacement
    answer: Combination
    difficulty: 1
    hints:
    - How many products are there?
    - Two substances make one.
    solution: Two reactants form one product, so it is a combination reaction (and it gives out heat).
  - prompt: 'Heating calcium carbonate gives calcium oxide and carbon dioxide. This is:'
    options:
    - Thermal decomposition
    - Combination
    - Displacement
    - Neutralisation
    answer: Thermal decomposition
    difficulty: 1
    hints:
    - One substance becomes two.
    - Heat is used.
    solution: 'One compound breaks into two by heating: thermal decomposition.'
  - prompt: Fe + CuSO₄ → FeSO₄ + Cu. Why does this happen?
    options:
    - Iron is more reactive than copper
    - Copper is more reactive than iron
    - Sulphate prefers iron because it is heavier
    - Copper sulphate decomposes on its own
    answer: Iron is more reactive than copper
    difficulty: 2
    hints:
    - Which element ends up in the compound?
    - The more reactive metal displaces the less reactive one.
    solution: In a displacement reaction the more reactive metal takes the place of the less reactive one. Iron is above copper in reactivity.
    mistakes:
      Copper is more reactive than iron: c10s_reactivity_order
  - prompt: In CuO + H₂ → Cu + H₂O, which substance is oxidised?
    options:
    - H₂
    - CuO
    - Cu
    - H₂O
    answer: H₂
    difficulty: 2
    hints:
    - Oxidation is gain of oxygen.
    - Which reactant picks up oxygen?
    solution: Hydrogen gains oxygen to become H₂O, so H₂ is oxidised. CuO loses oxygen, so it is reduced.
    mistakes:
      CuO: c10s_oxidised_reduced
  - prompt: 'Mixing sodium sulphate and barium chloride solutions gives a white solid. The white solid is:'
    options:
    - Barium sulphate, a precipitate
    - Sodium chloride
    - Barium chloride
    - Sodium sulphate
    answer: Barium sulphate, a precipitate
    difficulty: 2
    hints:
    - The ions swap partners.
    - BaSO₄ is insoluble.
    solution: Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl. Barium sulphate is insoluble, so it settles as a white precipitate.
  - prompt: Chips packets are often filled with nitrogen gas. Why?
    options:
    - To stop the oil in the chips from being oxidised and going rancid
    - To make the chips taste salty
    - Nitrogen makes the chips crunchier by reacting with them
    - To make the packet heavier
    answer: To stop the oil in the chips from being oxidised and going rancid
    difficulty: 2
    hints:
    - Fats and oils react with oxygen over time.
    - Nitrogen is unreactive.
    solution: Rancidity is the oxidation of fats and oils. Nitrogen keeps oxygen away.
