# CBSE Class 10 Science (NCERT), chapter 4. Format: content/README.md.
subject: cbse10-sci
chapter: 4
title: Carbon and its Compounds
tips:
  c10s_alkane_formula: 'Alkanes follow CₙH₂ₙ₊₂: double the carbons and add two.'
  c10s_count_cc: Count the carbon–carbon bond too, not only the bonds to hydrogen.
  c10s_addition_substitution: Addition adds atoms across a double bond; substitution swaps one atom for another.
concepts:
- code: cbse10s.carbon.bonding
  title: Covalent bonds and families of carbon compounds
  notes: |
    Carbon (2, 4) has four valence electrons; it neither loses nor gains four easily, so it shares electrons,
    forming covalent bonds (single, double or triple). Covalent compounds have low melting and boiling points
    and do not conduct. Carbon forms so many compounds because of catenation (bonding to other carbon atoms in
    chains, branches and rings) and tetravalency. Hydrocarbons: alkanes (saturated, single bonds, CₙH₂ₙ₊₂),
    alkenes (one C=C, CₙH₂ₙ), alkynes (one C≡C, CₙH₂ₙ₋₂). A homologous series has the same functional group,
    and each member differs from the next by CH₂ (14 u). Functional groups: –OH alcohol, –CHO aldehyde, C=O
    ketone, –COOH carboxylic acid, halo (–Cl, –Br). Isomers have the same formula but different structures
    (butane and isobutane). Allotropes: diamond, graphite, fullerenes.
  explanations:
    text: Carbon has four electrons to share, so it makes four bonds. It also loves to bond with other carbon atoms, building long chains, branches and rings. That's why there are millions of carbon compounds, grouped into families that differ step by step by one CH₂.
    visual: 'Draw a carbon atom with four arms. Methane: four H on the arms. Ethane: two carbons holding hands, each with three H. Ethene: two carbons holding two hands (a double bond), each with two H.'
    step_by_step: 'Step 1: Count carbons (meth 1, eth 2, prop 3, but 4, pent 5). Step 2: Check bonds: all single → -ane; one double → -ene; one triple → -yne. Step 3: Use the formula CₙH₂ₙ₊₂, CₙH₂ₙ or CₙH₂ₙ₋₂. Step 4: Add the functional group ending: -ol, -al, -one, -oic acid.'
    real_world: LPG is mainly butane and propane, both alkanes. The same chain-building that makes fuels also makes the long molecules in plastics and in our own bodies.
  picture:
    kind: compare
    columns:
    - title: Alkanes
      points:
      - Single bonds only
      - CₙH₂ₙ₊₂
      - Methane CH₄, ethane C₂H₆
      - Saturated
    - title: Alkenes
      points:
      - One C=C double bond
      - CₙH₂ₙ
      - Ethene C₂H₄
      - Unsaturated
    - title: Alkynes
      points:
      - One C≡C triple bond
      - CₙH₂ₙ₋₂
      - Ethyne C₂H₂
      - Unsaturated
    alt: 'Three hydrocarbon families: alkanes with single bonds and formula CnH2n+2, alkenes with a double bond and CnH2n, alkynes with a triple bond and CnH2n-2.'
  items:
  - prompt: What type of bond does carbon mostly form?
    options:
    - Covalent
    - Ionic
    - Metallic
    - None
    answer: Covalent
    difficulty: 1
    hints:
    - Carbon has 4 valence electrons.
    - It shares them.
    solution: Carbon shares electrons, forming covalent bonds.
  - prompt: How many hydrogen atoms are in pentane, the alkane with 5 carbon atoms?
    answer: '12'
    check: 2*5 + 2
    difficulty: 1
    hints:
    - 'Alkanes: CₙH₂ₙ₊₂.'
    - n = 5.
    solution: 'Step 1: CₙH₂ₙ₊₂. Step 2: 2 × 5 + 2 = 12. Pentane is C₅H₁₂.'
    mistakes:
      '10': c10s_alkane_formula
  - prompt: How many covalent bonds are in one molecule of ethane, C₂H₆?
    answer: '7'
    check: 6 + 1
    difficulty: 2
    hints:
    - Each H makes one bond to C.
    - Don't forget the C–C bond.
    solution: 'Step 1: 6 C–H bonds. Step 2: 1 C–C bond. Step 3: Total 7.'
    mistakes:
      '6': c10s_count_cc
  - prompt: C₃H₆ belongs to which family?
    options:
    - Alkenes
    - Alkanes
    - Alkynes
    - Alcohols
    answer: Alkenes
    difficulty: 2
    hints:
    - Test CₙH₂ₙ with n = 3.
    - 2 × 3 = 6.
    solution: C₃H₆ fits CₙH₂ₙ, so it is an alkene (propene).
  - prompt: Two neighbouring members of a homologous series differ in molecular mass by how many units?
    answer: '14'
    check: 12 + 2*1
    difficulty: 2
    hints:
    - They differ by CH₂.
    - C = 12, H = 1.
    solution: 'Step 1: Difference is CH₂. Step 2: 12 + 2 × 1 = 14 u.'
  - prompt: Which functional group is in ethanoic acid?
    options:
    - –COOH
    - –OH
    - –CHO
    - C=O (ketone)
    answer: –COOH
    difficulty: 1
    hints:
    - '''-oic acid'' ending.'
    - Carboxylic acid group.
    solution: Ethanoic acid (CH₃COOH) has the carboxylic acid group –COOH.
- code: cbse10s.carbon.reactions
  title: Reactions of carbon compounds, ethanol and soap
  after:
  - cbse10s.carbon.bonding
  notes: |
    Combustion: carbon compounds burn in oxygen to give CO₂, H₂O, heat and light; saturated compounds burn with
    a clean blue flame, unsaturated ones with a sooty yellow flame. Oxidation: ethanol → ethanoic acid with
    alkaline KMnO₄ or acidified K₂Cr₂O₇. Addition: unsaturated compounds add hydrogen with a nickel catalyst
    (hydrogenation of vegetable oil). Substitution: alkanes react with chlorine in sunlight, H replaced by Cl.
    Ethanol (C₂H₅OH): reacts with sodium to give H₂; heated with concentrated H₂SO₄ gives ethene. Ethanoic acid
    (CH₃COOH, 5–8% in vinegar): a weak acid; with an alcohol and acid catalyst gives a sweet-smelling ester
    (esterification); with NaHCO₃ gives CO₂. Soaps are sodium salts of long-chain fatty acids: the ionic end
    faces water and the long carbon tail goes into oil, forming micelles that lift dirt away. Hard water (Ca²⁺,
    Mg²⁺) makes scum with soap; detergents work in hard water.
  explanations:
    text: Carbon compounds burn to give carbon dioxide and water. Ethanol can be oxidised into ethanoic acid, and the two can join to make sweet-smelling esters. Soap cleans because each molecule has a water-loving head and an oil-loving tail.
    visual: 'Draw a soap molecule as a tadpole: a round head (ionic, likes water) and a long tail (carbon chain, likes oil). Many tadpoles surround an oil drop with tails in and heads out: that ball is a micelle, and water can wash it away.'
    step_by_step: 'Step 1: Is the compound burning? Then CO₂ + H₂O. Step 2: Is oxygen being added to an alcohol? Oxidation to an acid. Step 3: Is hydrogen being added across a double bond? Addition. Step 4: Is one H swapped for Cl? Substitution. Step 5: Acid + alcohol → ester.'
    real_world: Vanaspati ghee is made by adding hydrogen to vegetable oil with a nickel catalyst, turning liquid unsaturated oil into a more solid fat.
  picture:
    kind: flow
    steps:
    - 'Soap molecule: ionic head + long carbon tail'
    - Tails dissolve in the oily dirt
    - Heads stay in the water
    - Molecules form a ball (micelle) around the oil
    - Rinsing carries the micelles away
    alt: 'How soap cleans: tails go into the oil, heads stay in water, and the oil is trapped in balls called micelles that rinse away.'
  items:
  - prompt: What are the products when methane burns completely in air?
    options:
    - Carbon dioxide and water
    - Carbon monoxide and hydrogen
    - Carbon and water
    - Oxygen and hydrogen
    answer: Carbon dioxide and water
    difficulty: 1
    hints:
    - Complete combustion.
    - CH₄ + 2O₂ → ?
    solution: CH₄ + 2O₂ → CO₂ + 2H₂O, with heat and light.
  - prompt: 'Adding hydrogen to vegetable oil using a nickel catalyst is an example of:'
    options:
    - An addition reaction
    - A substitution reaction
    - Combustion
    - Esterification
    answer: An addition reaction
    difficulty: 1
    hints:
    - H₂ adds across the C=C bond.
    - Unsaturated becomes saturated.
    solution: 'Hydrogen adds across double bonds: an addition (hydrogenation) reaction.'
    mistakes:
      A substitution reaction: c10s_addition_substitution
  - prompt: 'Ethanol reacts with ethanoic acid in the presence of an acid catalyst to form:'
    options:
    - An ester
    - Ethene
    - Soap
    - Ethanal
    answer: An ester
    difficulty: 2
    hints:
    - It smells sweet.
    - Acid + alcohol.
    solution: 'Esterification: CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂O. The ester smells sweet.'
  - prompt: Why does a soap form scum in hard water?
    options:
    - Calcium and magnesium ions react with soap to make an insoluble solid
    - Hard water is too cold
    - Soap is a strong acid
    - Hard water contains oil
    answer: Calcium and magnesium ions react with soap to make an insoluble solid
    difficulty: 2
    hints:
    - What makes water 'hard'?
    - Ca²⁺ and Mg²⁺ salts.
    solution: The Ca²⁺ and Mg²⁺ ions combine with soap to form an insoluble scum, so less lather forms.
  - prompt: 'A substance burns with a sooty yellow flame. It is most likely:'
    options:
    - An unsaturated hydrocarbon
    - A saturated hydrocarbon in plenty of air
    - Hydrogen
    - Methane
    answer: An unsaturated hydrocarbon
    difficulty: 2
    hints:
    - Saturated compounds burn with a clean blue flame.
    - Soot means incomplete burning.
    solution: Unsaturated hydrocarbons have a higher carbon share and burn with a sooty yellow flame.
  - prompt: 'Methane reacts with chlorine in sunlight to give CH₃Cl and HCl. This is:'
    options:
    - Substitution
    - Addition
    - Oxidation to an acid
    - Neutralisation
    answer: Substitution
    difficulty: 2
    hints:
    - Methane has no double bond.
    - One H is replaced.
    solution: 'A hydrogen atom of methane is replaced by chlorine: substitution.'
    mistakes:
      Addition: c10s_addition_substitution
