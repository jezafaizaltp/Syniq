# CBSE Class 10 Science (NCERT), chapter 4. Format: content/README.md.
subject: cbse10-sci
chapter: 4
title: Carbon and its Compounds
tips:
  c10s_alkane_formula: 'Alkanes follow CₙH₂ₙ₊₂: double the carbons and add two.'
  c10s_count_cc: Count the carbon–carbon bond too, not only the bonds to hydrogen.
  c10s_addition_substitution: "Does the reaction add atoms across a double bond (no atoms lost), or swap one atom for another (a by-product forms)?"
  t10_acid_group: "'-oic acid' names belong to the carboxylic acid group."
  t10_carbon_shares: "Carbon can't easily gain or lose 4 electrons. So what does it do with them?"
  t10_ch2_mass: "Neighbours in a series differ by one CH₂. Add the masses of one C and two H."
  t10_cnh2n: "Check the formula: CₙH₂ₙ₊₂ (alkane), CₙH₂ₙ (alkene), CₙH₂ₙ₋₂ (alkyne). For C₃, how many H?"
  t10_complete_combustion: "Complete burning with plenty of oxygen fully oxidises carbon and hydrogen. What do they become?"
  t10_esterification: "An acid and an alcohol react to make a sweet-smelling compound. What family is it?"
  t10_hard_water: "Hard water contains calcium and magnesium ions. What do they do with soap?"
  t10_sooty_flame: "A sooty flame means not all the carbon burns. Which hydrocarbons have more carbon for their hydrogen?"
  c10s4_valency: Carbon has 4 outer electrons, so it forms 4 bonds. Count the bonds each carbon makes.
  c10s4_catenation: "Keep two words apart: one means having four bonds, the other means carbon linking to carbon in chains and rings."
  c10s4_functional: "Look at the name ending: -ol, -al, -one and -oic acid each mark a different group. Which group goes with this ending?"
  c10s4_series: Members of a homologous series have the same functional group and differ by CH₂. Check the general formula.
  c10s4_oxidation: 'Alkaline potassium permanganate or acidified potassium dichromate add oxygen: ethanol becomes ethanoic acid.'
  c10s4_soap_micelle: Soap molecules have a water-loving ionic end and an oil-loving carbon tail. Which end points into the oil?
concepts:
- code: cbse10s.carbon.bonding
  title: Covalent bonds and families of carbon compounds
  notes: |
    Carbon (2, 4) has four valence electrons; it neither loses nor gains four easily, so it shares electrons,
    forming covalent bonds (single, double or triple). Covalent compounds have low melting and boiling points
    and do not conduct. Carbon forms so many compounds because of catenation (bonding to other carbon atoms in
    chains, branches and rings) and tetravalency. Hydrocarbons: alkanes (saturated, single bonds, CₙH₂ₙ₊₂),
    alkenes (one C=C, CₙH₂ₙ), alkynes (one C≡C, CₙH₂ₙ₋₂). A homologous series has the same functional group,
    and each member differs from the next by CH₂ (14 u). Functional groups: –OH alcohol, –CHO aldehyde, C=O
    ketone, –COOH carboxylic acid, halo (–Cl, –Br). Isomers have the same formula but different structures
    (butane and isobutane). Allotropes: diamond, graphite, fullerenes.
  explanations:
    text: Carbon has four electrons to share, so it makes four bonds. It also loves to bond with other carbon atoms, building long chains, branches and rings. That's why there are millions of carbon compounds, grouped into families that differ step by step by one CH₂.
    visual: 'Draw a carbon atom with four arms. Methane: four H on the arms. Ethane: two carbons holding hands, each with three H. Ethene: two carbons holding two hands (a double bond), each with two H.'
    step_by_step: 'Step 1: Count carbons (meth 1, eth 2, prop 3, but 4, pent 5). Step 2: Check bonds: all single → -ane; one double → -ene; one triple → -yne. Step 3: Use the formula CₙH₂ₙ₊₂, CₙH₂ₙ or CₙH₂ₙ₋₂. Step 4: Add the functional group ending: -ol, -al, -one, -oic acid.'
    real_world: LPG is mainly butane and propane, both alkanes. The same chain-building that makes fuels also makes the long molecules in plastics and in our own bodies.
  picture:
    kind: compare
    columns:
    - title: Alkanes
      points:
      - Single bonds only
      - CₙH₂ₙ₊₂
      - Methane CH₄, ethane C₂H₆
      - Saturated
    - title: Alkenes
      points:
      - One C=C double bond
      - CₙH₂ₙ
      - Ethene C₂H₄
      - Unsaturated
    - title: Alkynes
      points:
      - One C≡C triple bond
      - CₙH₂ₙ₋₂
      - Ethyne C₂H₂
      - Unsaturated
    alt: 'Three hydrocarbon families: alkanes with single bonds and formula CnH2n+2, alkenes with a double bond and CnH2n, alkynes with a triple bond and CnH2n-2.'
  activity:
    type: sort
    prompt: Which family does each compound belong to?
    bins:
    - Alkane
    - Alkene
    - Alkyne
    - Alcohol
    - Carboxylic acid
    items:
    - label: CH₄
      bin: Alkane
      clue: Does it fit CₙH₂ₙ₊₂?
      why: 'n = 1: 2n + 2 = 4. Methane, all single bonds: an alkane.'
    - label: C₂H₄
      bin: Alkene
      clue: Does it fit CₙH₂ₙ? Is there a double bond?
      why: 'n = 2: 2n = 4. Ethene has a C=C double bond: an alkene.'
    - label: C₂H₂
      bin: Alkyne
      clue: Does it fit CₙH₂ₙ₋₂?
      why: 'n = 2: 2n − 2 = 2. Ethyne has a triple bond: an alkyne.'
    - label: C₂H₅OH
      bin: Alcohol
      clue: Which group is on the end?
      why: 'The −OH group makes it an alcohol: ethanol.'
    - label: CH₃COOH
      bin: Carboxylic acid
      clue: Which group is on the end?
      why: 'The −COOH group makes it a carboxylic acid: ethanoic acid (vinegar).'
    - label: C₃H₈
      bin: Alkane
      clue: 'Count the H: is it 2n + 2?'
      why: 'n = 3: 2 × 3 + 2 = 8. Propane, an alkane.'
    - label: C₃H₆
      bin: Alkene
      clue: 'Count the H: is it 2n or 2n + 2?'
      why: 'n = 3: 2 × 3 = 6. Propene, an alkene.'
    - label: HCOOH
      bin: Carboxylic acid
      clue: Look for the −COOH group.
      why: 'Methanoic acid has −COOH: a carboxylic acid.'
    - label: CH₃OH
      bin: Alcohol
      clue: Is there an −OH group?
      why: 'Methanol has −OH: an alcohol.'
    - label: C₄H₁₀
      bin: Alkane
      clue: Is it CₙH₂ₙ₊₂?
      why: 'n = 4: 2 × 4 + 2 = 10. Butane, an alkane (in LPG).'
  lesson:
    - teach: Carbon has 4 electrons in its outer shell. Gaining or losing 4 is too hard, so it shares electrons, forming covalent bonds. Methane, CH₄, has four single bonds. Two shared pairs make a double bond (O=O), three make a triple bond (N≡N).
      check:
        prompt: How many bonds does each carbon atom form?
        options:
        - '4'
        - '2'
        - '3'
        answer: '4'
        why: It has 4 outer electrons to share.
    - teach: Carbon is special because of catenation (bonding to other carbon atoms to form chains, branches and rings) and tetravalency (4 bonds). Hydrocarbons with only single bonds are saturated (alkanes, CₙH₂ₙ₊₂). Those with double or triple bonds are unsaturated (alkenes CₙH₂ₙ, alkynes CₙH₂ₙ₋₂).
      picture:
        kind: compare
        columns:
        - title: Alkane
          points:
          - Single bonds only
          - CₙH₂ₙ₊₂
          - Ethane C₂H₆
        - title: Alkene
          points:
          - One C=C
          - CₙH₂ₙ
          - Ethene C₂H₄
        - title: Alkyne
          points:
          - One C≡C
          - CₙH₂ₙ₋₂
          - Ethyne C₂H₂
        alt: Alkanes have single bonds (CₙH₂ₙ₊₂, ethane); alkenes have a double bond (CₙH₂ₙ, ethene); alkynes have a triple bond (CₙH₂ₙ₋₂, ethyne).
      check:
        prompt: C₂H₂ is…
        options:
        - An alkyne
        - An alkane
        - An alkene
        answer: An alkyne
        why: 2n − 2 = 2 hydrogens.
    - teach: 'A functional group (like −OH in alcohols or −COOH in acids) decides how a compound reacts. A homologous series is a family with the same functional group in which each member differs from the next by CH₂ (14 u). Names: meth (1 C), eth (2), prop (3), but (4), pent (5); then -ane, -ene, -ol, -al, -one, -oic acid.'
      check:
        prompt: Propanol has how many carbons?
        options:
        - '3'
        - '2'
        - '4'
        answer: '3'
        why: Prop = 3.
  items:
  - prompt: What type of bond does carbon mostly form?
    options:
    - Covalent
    - Ionic
    - Metallic
    - None
    answer: Covalent
    difficulty: 1
    hints:
    - Carbon has 4 valence electrons.
    - It shares them.
    solution: Carbon shares electrons, forming covalent bonds.
    mistakes: {"Ionic": "t10_carbon_shares", "Metallic": "t10_carbon_shares"}
  - prompt: How many hydrogen atoms are in pentane, the alkane with 5 carbon atoms?
    answer: '12'
    check: 2*5 + 2
    difficulty: 1
    hints:
    - 'Alkanes: CₙH₂ₙ₊₂.'
    - n = 5.
    solution: 'Step 1: CₙH₂ₙ₊₂. Step 2: 2 × 5 + 2 = 12. Pentane is C₅H₁₂.'
    mistakes:
      '10': c10s_alkane_formula
  - prompt: How many covalent bonds are in one molecule of ethane, C₂H₆?
    answer: '7'
    check: 6 + 1
    difficulty: 2
    hints:
    - Each H makes one bond to C.
    - Don't forget the C–C bond.
    solution: 'Step 1: 6 C–H bonds. Step 2: 1 C–C bond. Step 3: Total 7.'
    mistakes:
      '6': c10s_count_cc
  - prompt: C₃H₆ belongs to which family?
    options:
    - Alkenes
    - Alkanes
    - Alkynes
    - Alcohols
    answer: Alkenes
    difficulty: 2
    hints:
    - Test CₙH₂ₙ with n = 3.
    - 2 × 3 = 6.
    solution: C₃H₆ fits CₙH₂ₙ, so it is an alkene (propene).
    mistakes: {"Alkanes": "t10_cnh2n", "Alkynes": "t10_cnh2n"}
  - prompt: Two neighbouring members of a homologous series differ in molecular mass by how many units?
    answer: '14'
    check: 12 + 2*1
    difficulty: 2
    hints:
    - They differ by CH₂.
    - C = 12, H = 1.
    solution: 'Step 1: Difference is CH₂. Step 2: 12 + 2 × 1 = 14 u.'
    mistakes: {"12": "t10_ch2_mass", "2": "t10_ch2_mass"}
  - prompt: Which functional group is in ethanoic acid?
    options:
    - –COOH
    - –OH
    - –CHO
    - C=O (ketone)
    answer: –COOH
    difficulty: 1
    hints:
    - '''-oic acid'' ending.'
    - Carboxylic acid group.
    solution: Ethanoic acid (CH₃COOH) has the carboxylic acid group –COOH.
    mistakes: {"–OH": "t10_acid_group", "–CHO": "t10_acid_group"}
  - prompt: How many hydrogen atoms are in butane, the alkane with 4 carbons?
    answer: '10'
    check: 2 * 4 + 2
    difficulty: 2
    hints:
    - Alkanes are CₙH₂ₙ₊₂.
    - n = 4.
    solution: 2 × 4 + 2 = 10, so butane is C₄H₁₀.
    mistakes:
      '8': t10_cnh2n
      '6': t10_cnh2n
  - prompt: How many hydrogen atoms are in propene (3 carbons, one double bond)?
    answer: '6'
    check: 2 * 3
    difficulty: 2
    hints:
    - Propene has one double bond.
    - Alkenes are CₙH₂ₙ.
    solution: 'C₃H₆: 2 × 3 = 6.'
    mistakes:
      '8': t10_cnh2n
      '4': t10_cnh2n
  - prompt: What is carbon's ability to bond with other carbon atoms in long chains called?
    options:
    - Catenation
    - Tetravalency
    - Isomerism
    - Combustion
    answer: Catenation
    difficulty: 1
    hints:
    - It comes from a word meaning 'chain'.
    - It is about C joining to C.
    solution: Catenation is carbon linking to carbon in chains, branches and rings.
    mistakes:
      Tetravalency: c10s4_catenation
  - prompt: Which functional group is in propanone?
    options:
    - Ketone
    - Alcohol
    - Aldehyde
    - Carboxylic acid
    answer: Ketone
    difficulty: 2
    hints:
    - Look at the ending.
    - -one.
    solution: The -one ending means a ketone group.
    mistakes:
      Aldehyde: c10s4_functional
      Alcohol: c10s4_functional
  - prompt: Which pair are in the same homologous series?
    options:
    - CH₄ and C₂H₆
    - C₂H₄ and C₂H₆
    - CH₄ and C₂H₄
    - C₂H₂ and C₂H₆
    answer: CH₄ and C₂H₆
    difficulty: 2
    hints:
    - Same general formula.
    - They differ by CH₂.
    solution: CH₄ and C₂H₆ are both alkanes and differ by CH₂.
    mistakes:
      C₂H₄ and C₂H₆: c10s4_series
      CH₄ and C₂H₄: c10s4_series
  - prompt: How many electrons are shared in a double bond?
    answer: '4'
    check: 2 * 2
    difficulty: 2
    hints:
    - A double bond is two shared pairs.
    - Each pair has 2 electrons.
    solution: 2 pairs × 2 electrons = 4 electrons.
    mistakes:
      '2': c10s_count_cc
      '1': c10s_count_cc
  - prompt: Why are covalent compounds like methane poor conductors of electricity?
    options:
    - They have no ions or free electrons
    - They are metals
    - They are always solids
    - They have too many electrons
    answer: They have no ions or free electrons
    difficulty: 2
    hints:
    - Current needs moving charges.
    - Shared electrons stay in the bonds.
    solution: Covalent molecules have no charged particles free to move, so they don't conduct.
    mistakes:
      They are metals: t10_ions_conduct
  - prompt: What is the name of CH₃CH₂OH?
    options:
    - Ethanol
    - Methanol
    - Ethanoic acid
    - Ethanal
    answer: Ethanol
    difficulty: 1
    hints:
    - Count the carbons.
    - The −OH group ends in -ol.
    solution: '2 carbons (eth) and −OH (-ol): ethanol.'
    mistakes:
      Ethanoic acid: c10s4_functional
      Ethanal: c10s4_functional
  - prompt: Diamond and graphite are both pure carbon. What are they called?
    options:
    - Allotropes
    - Isomers
    - Alloys
    - Isotopes
    answer: Allotropes
    difficulty: 2
    hints:
    - Same element, different structure.
    - Fullerene is another one.
    solution: Different forms of the same element are allotropes.
    mistakes:
      Isomers: c10s4_catenation
      Alloys: c10s3_alloy
- code: cbse10s.carbon.reactions
  title: Reactions of carbon compounds, ethanol and soap
  after:
  - cbse10s.carbon.bonding
  notes: |
    Combustion: carbon compounds burn in oxygen to give CO₂, H₂O, heat and light; saturated compounds burn with
    a clean blue flame, unsaturated ones with a sooty yellow flame. Oxidation: ethanol → ethanoic acid with
    alkaline KMnO₄ or acidified K₂Cr₂O₇. Addition: unsaturated compounds add hydrogen with a nickel catalyst
    (hydrogenation of vegetable oil). Substitution: alkanes react with chlorine in sunlight, H replaced by Cl.
    Ethanol (C₂H₅OH): reacts with sodium to give H₂; heated with concentrated H₂SO₄ gives ethene. Ethanoic acid
    (CH₃COOH, 5–8% in vinegar): a weak acid; with an alcohol and acid catalyst gives a sweet-smelling ester
    (esterification); with NaHCO₃ gives CO₂. Soaps are sodium salts of long-chain fatty acids: the ionic end
    faces water and the long carbon tail goes into oil, forming micelles that lift dirt away. Hard water (Ca²⁺,
    Mg²⁺) makes scum with soap; detergents work in hard water.
  explanations:
    text: Carbon compounds burn to give carbon dioxide and water. Ethanol can be oxidised into ethanoic acid, and the two can join to make sweet-smelling esters. Soap cleans because each molecule has a water-loving head and an oil-loving tail.
    visual: 'Draw a soap molecule as a tadpole: a round head (ionic, likes water) and a long tail (carbon chain, likes oil). Many tadpoles surround an oil drop with tails in and heads out: that ball is a micelle, and water can wash it away.'
    step_by_step: 'Step 1: Is the compound burning? Then CO₂ + H₂O. Step 2: Is oxygen being added to an alcohol? Oxidation to an acid. Step 3: Is hydrogen being added across a double bond? Addition. Step 4: Is one H swapped for Cl? Substitution. Step 5: Acid + alcohol → ester.'
    real_world: Vanaspati ghee is made by adding hydrogen to vegetable oil with a nickel catalyst, turning liquid unsaturated oil into a more solid fat.
  picture:
    kind: flow
    steps:
    - 'Soap molecule: ionic head + long carbon tail'
    - Tails dissolve in the oily dirt
    - Heads stay in the water
    - Molecules form a ball (micelle) around the oil
    - Rinsing carries the micelles away
    alt: 'How soap cleans: tails go into the oil, heads stay in water, and the oil is trapped in balls called micelles that rinse away.'
  activity:
    type: sort
    prompt: What kind of reaction is it?
    bins:
    - Combustion
    - Oxidation
    - Addition
    - Substitution
    - Esterification
    items:
    - label: Methane burns with a clean blue flame
      bin: Combustion
      clue: Is it burning in oxygen to give CO₂ and water?
      why: 'Burning in oxygen with heat and light: combustion.'
    - label: Ethanol turns to ethanoic acid with alkaline KMnO₄
      bin: Oxidation
      clue: What does KMnO₄ give to the ethanol?
      why: 'KMnO₄ is an oxidising agent: it adds oxygen, making an acid. Oxidation.'
    - label: Vegetable oil + hydrogen, with nickel, makes ghee
      bin: Addition
      clue: Does hydrogen join across a double bond?
      why: 'Hydrogen adds across C=C bonds (hydrogenation): addition.'
    - label: CH₄ + Cl₂ in sunlight → CH₃Cl + HCl
      bin: Substitution
      clue: Is an H swapped for a Cl?
      why: 'A chlorine atom replaces a hydrogen atom: substitution.'
    - label: Ethanol + ethanoic acid → a sweet-smelling ester
      bin: Esterification
      clue: What smells sweet?
      why: 'An acid and an alcohol make an ester: esterification.'
    - label: A candle burns
      bin: Combustion
      clue: Is wax reacting with oxygen and giving flame?
      why: 'Burning wax in oxygen: combustion.'
    - label: Ethene + hydrogen → ethane
      bin: Addition
      clue: Two molecules become one. What happens to the double bond?
      why: 'H₂ adds across the C=C bond: addition.'
    - label: Naphthalene burns with a sooty yellow flame
      bin: Combustion
      clue: Is it burning?
      why: Unsaturated compounds burn with a sooty flame, but it's still combustion.
    - label: Ethanol with acidified potassium dichromate
      bin: Oxidation
      clue: Does the orange dichromate add oxygen?
      why: Acidified dichromate oxidises ethanol to ethanoic acid.
  lesson:
    - teach: Carbon compounds burn in oxygen to give CO₂, water, heat and light (combustion). Saturated hydrocarbons burn with a clean blue flame; unsaturated ones give a sooty yellow flame. Oxidising agents such as alkaline KMnO₄ turn ethanol into ethanoic acid.
      check:
        prompt: Ethanol + alkaline KMnO₄ (heated) gives…
        options:
        - Ethanoic acid
        - Ethene
        - Methane
        answer: Ethanoic acid
        why: The oxidising agent adds oxygen.
    - teach: 'Addition: unsaturated compounds add hydrogen with a nickel catalyst (hydrogenation of vegetable oils). Substitution: in sunlight, chlorine replaces hydrogen in saturated hydrocarbons (CH₄ + Cl₂ → CH₃Cl + HCl). Ethanol + sodium → sodium ethoxide + hydrogen. Ethanol heated with hot concentrated H₂SO₄ loses water to give ethene.'
      picture:
        kind: compare
        columns:
        - title: Addition
          points:
          - Across a double bond
          - Nothing lost
          - Oil + H₂ → fat
        - title: Substitution
          points:
          - One atom swaps in
          - A by-product forms
          - CH₄ + Cl₂ → CH₃Cl + HCl
        alt: Addition puts atoms across a double bond with nothing lost; substitution swaps one atom for another and makes a by-product.
      check:
        prompt: Which needs a double or triple bond?
        options:
        - Addition
        - Substitution
        - Combustion
        answer: Addition
        why: Atoms add across the multiple bond.
    - teach: 'Ethanoic acid (vinegar is 5–8% in water) reacts with alcohols to form sweet-smelling esters, and with sodium carbonate to give CO₂. Soaps are sodium salts of long-chain acids: their ionic end faces water and their carbon tail goes into oil, forming micelles that lift dirt away. Detergents also work in hard water.'
      check:
        prompt: Which end of a soap molecule dissolves in oil?
        options:
        - The long carbon tail
        - The ionic end
        - Neither
        answer: The long carbon tail
        why: The tail is oil-loving.
  items:
  - prompt: What are the products when methane burns completely in air?
    options:
    - Carbon dioxide and water
    - Carbon monoxide and hydrogen
    - Carbon and water
    - Oxygen and hydrogen
    answer: Carbon dioxide and water
    difficulty: 1
    hints:
    - Complete combustion.
    - CH₄ + 2O₂ → ?
    solution: CH₄ + 2O₂ → CO₂ + 2H₂O, with heat and light.
    mistakes: {"Carbon monoxide and hydrogen": "t10_complete_combustion", "Carbon and water": "t10_complete_combustion"}
  - prompt: 'Adding hydrogen to vegetable oil using a nickel catalyst is an example of:'
    options:
    - An addition reaction
    - A substitution reaction
    - Combustion
    - Esterification
    answer: An addition reaction
    difficulty: 1
    hints:
    - H₂ adds across the C=C bond.
    - Unsaturated becomes saturated.
    solution: 'Hydrogen adds across double bonds: an addition (hydrogenation) reaction.'
    mistakes:
      A substitution reaction: c10s_addition_substitution
  - prompt: 'Ethanol reacts with ethanoic acid in the presence of an acid catalyst to form:'
    options:
    - An ester
    - Ethene
    - Soap
    - Ethanal
    answer: An ester
    difficulty: 2
    hints:
    - It smells sweet.
    - Acid + alcohol.
    solution: 'Esterification: CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂O. The ester smells sweet.'
    mistakes: {"Ethene": "t10_esterification", "Soap": "t10_esterification"}
  - prompt: Why does a soap form scum in hard water?
    options:
    - Calcium and magnesium ions react with soap to make an insoluble solid
    - Hard water is too cold
    - Soap is a strong acid
    - Hard water contains oil
    answer: Calcium and magnesium ions react with soap to make an insoluble solid
    difficulty: 2
    hints:
    - What makes water 'hard'?
    - Ca²⁺ and Mg²⁺ salts.
    solution: The Ca²⁺ and Mg²⁺ ions combine with soap to form an insoluble scum, so less lather forms.
    mistakes: {"Hard water is too cold": "t10_hard_water", "Soap is a strong acid": "t10_hard_water"}
  - prompt: 'A substance burns with a sooty yellow flame. It is most likely:'
    options:
    - An unsaturated hydrocarbon
    - A saturated hydrocarbon in plenty of air
    - Hydrogen
    - Methane
    answer: An unsaturated hydrocarbon
    difficulty: 2
    hints:
    - Saturated compounds burn with a clean blue flame.
    - Soot means incomplete burning.
    solution: Unsaturated hydrocarbons have a higher carbon share and burn with a sooty yellow flame.
    mistakes: {"A saturated hydrocarbon in plenty of air": "t10_sooty_flame", "Hydrogen": "t10_sooty_flame"}
  - prompt: 'Methane reacts with chlorine in sunlight to give CH₃Cl and HCl. This is:'
    options:
    - Substitution
    - Addition
    - Oxidation to an acid
    - Neutralisation
    answer: Substitution
    difficulty: 2
    hints:
    - Methane has no double bond.
    - One H is replaced.
    solution: 'A hydrogen atom of methane is replaced by chlorine: substitution.'
    mistakes:
      Addition: c10s_addition_substitution
  - prompt: Hydrogenation of vegetable oils needs which catalyst?
    options:
    - Nickel
    - Iron
    - Platinum wire only
    - Sodium
    answer: Nickel
    difficulty: 1
    hints:
    - It is a metal catalyst.
    - Used in making vanaspati ghee.
    solution: Hydrogen is added to oils using a nickel catalyst.
    mistakes:
      Sodium: c10s_addition_substitution
  - prompt: Ethanol reacts with sodium. Which gas is given off?
    options:
    - Hydrogen
    - Oxygen
    - Carbon dioxide
    - Chlorine
    answer: Hydrogen
    difficulty: 2
    hints:
    - Sodium replaces the H of −OH.
    - That H leaves as a gas.
    solution: 2Na + 2CH₃CH₂OH → 2CH₃CH₂ONa + H₂.
    mistakes:
      Carbon dioxide: c10s_metal_vs_carbonate
  - prompt: Ethanol heated with excess hot concentrated sulphuric acid gives…
    options:
    - Ethene
    - Ethanoic acid
