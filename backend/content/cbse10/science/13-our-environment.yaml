# CBSE Class 10 Science (NCERT), chapter 13. Format: content/README.md.
subject: cbse10-sci
chapter: 13
title: Our Environment
tips:
  c10s_trophic_level: 'Count from the producer: plants first, then the herbivore that eats them (primary consumer).'
  c10s_ten_percent: That's only one step. Take 10% again for the next level up.
  c10s_ozone_formula: 'O₂ is ordinary oxygen. Ozone has one more atom: O₃.'
  c10s_biodegradable: Paper is made from plants, so microbes can break it down.
  t10_biomagnification: "Each level eats many of the level below. Where does a chemical that doesn't break down pile up most?"
  t10_cfc: "Which chemicals from old fridges and sprays release chlorine high up?"
  t10_compost: "In compost, tiny living things break down kitchen waste into something useful for soil."
  t10_decomposers: "Decomposers break down dead matter. Which choice can't make food and feeds on dead things?"
  t10_energy_loss: "Only about 10% of energy passes to the next level. What happens after a few levels?"
  t10_manmade_eco: "Which ecosystem do people plant and look after?"
  t10_ozone_uv: "The ozone layer absorbs one kind of harmful sunlight that causes skin cancer."
  t10_reduce_waste: "Which choice lets kitchen waste be composted and dry waste be reused?"
concepts:
- code: cbse10s.env.ecosystem
  title: Ecosystems and food chains
  notes: |
    An ecosystem is the living things (biotic) and the non-living surroundings (abiotic) of an area, working
    together: forests, ponds, lakes, and man-made ones like gardens and crop fields. Producers (green plants)
    make food; consumers are herbivores, carnivores and omnivores; decomposers (bacteria, fungi) break down dead
    matter and return nutrients to the soil. A food chain shows who eats whom; each step is a trophic level. Food
    chains link into food webs. Energy flows one way, from the Sun to producers to consumers; only about 10%
    of the energy at one level passes to the next (10% law), so food chains are short (3–4 levels).
    Biological magnification: non-biodegradable chemicals like pesticides build up at each level, so the top
    consumers (including humans) have the highest concentration.
  explanations:
    text: In an ecosystem energy passes from the Sun to plants and then from one eater to the next. At each step about nine tenths is used up or lost as heat, so only a tenth moves on. That is why food chains rarely go beyond four levels, and why poisons that don't break down pile up at the top.
    visual: 'Draw a pyramid of four layers: grass (10 000 J), grasshopper (1 000 J), frog (100 J), snake (10 J). Each layer gets about a tenth of the one below.'
    step_by_step: 'Step 1: Find the producer. Step 2: Follow the arrows from food to eater. Step 3: For energy, divide by 10 at each step up. Step 4: For harmful chemicals, the amount increases at each step up.'
    real_world: 'DDT sprayed on crops was found in high levels in fish-eating birds, which laid eggs with thin shells: biological magnification at work.'
  picture:
    kind: bars
    bars:
    - label: Grass (producer)
      value: 10000
    - label: Grasshopper
      value: 1000
    - label: Frog
      value: 100
    - label: Snake
      value: 10
    unit: joules
    alt: 'Bar chart of energy at each trophic level: grass 10,000 joules, grasshopper 1,000, frog 100, snake 10, showing the 10 percent law.'
  activity:
    type: formula
    prompt: Only about 10% of the energy at one level passes to the next. Plants (producers) capture E joules.
    inputs:
    - name: e
      label: Energy captured by plants
      min: 500
      max: 50000
      step: 500
      start: 500
      unit: J
    outputs:
    - name: h
      label: Herbivores (insects)
      expr: e*0.1
      unit: J
    - name: c1
      label: First carnivores (frogs)
      expr: e*0.01
      unit: J
    - name: c2
      label: Top carnivores (snakes)
      expr: e*0.001
      unit: J
      places: 1
    goals:
    - prompt: Snakes at the top need 20 J. How much must the plants capture?
      want:
        c2: 20
      hint: 'Work back up: each level down holds 10 times more.'
      mistakes:
      - when:
          e: 2000
        say: '2000 J of plants leaves just 2 J for the snakes. Three steps of 10%: 10% of 10% of 10%.'
      - when:
          e: 6000
        say: Taking away 10% at each step isn't the rule; only 10% is passed on.
    - prompt: Frogs need 50 J. How much must the plants capture?
      want:
        c1: 50
      mistakes:
      - when:
          e: 500
        say: '500 J of plants gives the frogs only 5 J: frogs are two steps up, so they get 1% of it.'
      - when:
          e: 50000
        say: That's enough for 500 J of frogs. Frogs are two steps up, not three.
  items:
  - prompt: Which of these are decomposers?
    options:
    - Bacteria and fungi
    - Green plants
    - Lions and tigers
    - Grasshoppers
    answer: Bacteria and fungi
    difficulty: 1
    hints:
    - They break down dead matter.
    - They return nutrients to the soil.
    solution: Bacteria and fungi decompose dead plants and animals.
    mistakes: {"Green plants": "t10_decomposers", "Grasshoppers": "t10_decomposers"}
  - prompt: 'In the chain grass → deer → lion, the deer is a:'
    options:
    - Primary consumer (herbivore)
    - Producer
    - Secondary consumer
    - Decomposer
    answer: Primary consumer (herbivore)
    difficulty: 1
    hints:
    - It eats the producer.
    - Second trophic level.
    solution: The deer eats grass, the producer, so it is a primary consumer.
    mistakes:
      Secondary consumer: c10s_trophic_level
  - prompt: Plants in a food chain capture 20 000 J. By the 10% law, how much energy reaches the secondary consumers, in joules?
    answer: '200'
    check: 20000*Rational(1, 10)**2
    difficulty: 2
    hints:
    - 'Producers → primary consumers: 10%.'
    - Then another 10%.
    solution: 'Step 1: Primary consumers get 2 000 J. Step 2: Secondary consumers get 200 J.'
    mistakes:
      '2000': c10s_ten_percent
  - prompt: Why are food chains usually only 3 or 4 steps long?
    options:
    - So little energy is left after a few levels
    - Animals don't like long chains
    - There are not enough plants
    - Decomposers stop them
    answer: So little energy is left after a few levels
    difficulty: 2
    hints:
    - Only about 10% passes on.
    - After 4 steps it's 0.1%.
    solution: Energy decreases tenfold at each level, so there isn't enough to support many more levels.
    mistakes: {"There are not enough plants": "t10_energy_loss", "Decomposers stop them": "t10_energy_loss"}
  - prompt: A pesticide that doesn't break down is found in a food chain. Which organism will have the highest concentration?
    options:
    - The top consumer
    - The producer
    - The herbivore
    - It is the same in all
    answer: The top consumer
    difficulty: 2
    hints:
    - Biological magnification.
    - It builds up at each step.
    solution: Non-biodegradable chemicals concentrate at each trophic level, so the top consumer has the most.
    mistakes: {"The producer": "t10_biomagnification", "It is the same in all": "t10_biomagnification"}
  - prompt: Which is a man-made ecosystem?
    options:
    - A crop field
    - A forest
    - A lake
    - A mountain grassland
    answer: A crop field
    difficulty: 1
    hints:
    - Humans plant and manage it.
    - Gardens and aquariums too.
    solution: Crop fields, gardens and aquariums are artificial ecosystems.
    mistakes: {"A forest": "t10_manmade_eco", "A lake": "t10_manmade_eco"}
- code: cbse10s.env.waste
  title: Ozone and managing waste
  after:
  - cbse10s.env.ecosystem
  notes: |
    Ozone (O₃) in the upper atmosphere shields Earth from the Sun's harmful ultraviolet rays. It is formed when
    UV splits O₂ into O atoms, which join O₂. Chlorofluorocarbons (CFCs), once used in refrigerators and
    aerosols, destroy ozone; in 1987 UNEP got countries to agree to limit them (Montreal Protocol). Waste:
    biodegradable materials are broken down by microbes (food, paper, cotton); non-biodegradable ones are not
    (plastics, glass, some chemicals) and persist and harm the environment. Disposal: reduce, reuse, recycle;
    composting kitchen waste; segregating waste at source; avoiding single-use plastic; using cloth bags.
  explanations:
    text: High up in the atmosphere, a thin ozone layer stops harmful ultraviolet light. Some chemicals like CFCs thin it. On the ground, waste that microbes can break down is biodegradable; plastic and glass are not, so they pile up unless we reduce, reuse and recycle.
    visual: 'Draw two bins: a green one for peels, paper and leaves (biodegradable, can become compost) and a blue one for plastic bottles, glass and cans (non-biodegradable, to be recycled).'
    step_by_step: 'Step 1: Ask whether microbes can break it down. Step 2: Yes → biodegradable → compost. Step 3: No → non-biodegradable → reduce use, reuse, recycle. Step 4: Separate the two at home.'
    real_world: Many Indian cities ask households to separate wet and dry waste so that kitchen waste can be composted and plastic sent for recycling.
  picture:
    kind: compare
    columns:
    - title: Biodegradable
      points:
      - Broken down by microbes
      - Fruit peels, paper, cotton
      - Can be composted
    - title: Non-biodegradable
      points:
      - Not broken down by microbes
      - Plastic, glass, metal cans
      - Reduce, reuse, recycle
    alt: Biodegradable waste like peels and paper is broken down by microbes and composted; non-biodegradable waste like plastic and glass must be reduced, reused or recycled.
  activity:
    type: sort
    prompt: Can microbes break it down?
    bins:
    - Biodegradable
    - Non-biodegradable
    items:
    - label: Banana peel
      bin: Biodegradable
      clue: Was it once part of a living thing?
      why: 'Bacteria and fungi break it down quickly: biodegradable.'
    - label: Plastic bag
      bin: Non-biodegradable
      clue: Can bacteria eat plastic?
      why: 'Microbes can''t break plastic down: it stays for hundreds of years.'
    - label: Newspaper
      bin: Biodegradable
      clue: What is paper made from?
      why: Paper comes from wood, which microbes break down.
    - label: Glass bottle
      bin: Non-biodegradable
      clue: Does glass rot?
      why: Glass doesn't rot, but it can be recycled.
    - label: Cotton cloth
      bin: Biodegradable
      clue: Where does cotton come from?
      why: Cotton is a plant fibre that microbes break down.
    - label: DDT pesticide
      bin: Non-biodegradable
      clue: Why does DDT build up in food chains?
      why: DDT isn't broken down, so it builds up (biological magnification).
    - label: Aluminium can
      bin: Non-biodegradable
      clue: Does a metal can rot?
      why: Microbes can't break down aluminium; recycle it.
    - label: Cow dung
      bin: Biodegradable
      clue: What happens to dung in a biogas plant?
      why: Microbes break it down, making biogas and manure.
    - label: Wood shavings
      bin: Biodegradable
      clue: Does wood rot?
      why: Wood is broken down by fungi and bacteria.
    - label: Polythene wrapper
      bin: Non-biodegradable
      clue: Is polythene a kind of plastic?
      why: 'Polythene is a plastic: not biodegradable.'
  items:
  - prompt: What does the ozone layer protect us from?
    options:
    - Ultraviolet rays from the Sun
    - Meteorites
    - Acid rain
    - Infrared heat only
    answer: Ultraviolet rays from the Sun
    difficulty: 1
    hints:
    - UV can cause skin cancer.
    - It's in the upper atmosphere.
    solution: Ozone absorbs harmful UV radiation from the Sun.
    mistakes: {"Meteorites": "t10_ozone_uv", "Acid rain": "t10_ozone_uv"}
  - prompt: How many oxygen atoms are in one molecule of ozone?
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - Formula O₃.
    - Oxygen gas is O₂.
    solution: 'Ozone is O₃: 3 oxygen atoms.'
    mistakes:
      '2': c10s_ozone_formula
  - prompt: Which chemicals were mainly responsible for thinning the ozone layer?
    options:
    - Chlorofluorocarbons (CFCs)
    - Carbon dioxide
    - Oxygen
    - Water vapour
    answer: Chlorofluorocarbons (CFCs)
    difficulty: 1
    hints:
    - Used in old fridges and aerosol sprays.
    - Contain chlorine.
    solution: CFCs release chlorine in the upper atmosphere, which breaks down ozone.
    mistakes: {"Carbon dioxide": "t10_cfc", "Water vapour": "t10_cfc"}
  - prompt: Which of these is non-biodegradable?
    options:
    - Plastic bag
    - Banana peel
    - Paper
    - Cotton cloth
    answer: Plastic bag
    difficulty: 1
    hints:
    - Microbes can't break it down.
    - It lasts for hundreds of years.
    solution: Plastic is not broken down by microbes, so it is non-biodegradable.
    mistakes:
      Paper: c10s_biodegradable
  - prompt: Why do we compost kitchen waste?
    options:
    - Microbes turn it into manure for soil
    - It makes the waste last longer
    - It turns plastic into food
    - It produces ozone
    answer: Microbes turn it into manure for soil
    difficulty: 2
    hints:
    - Kitchen waste is biodegradable.
    - Compost feeds plants.
    solution: Composting lets microbes break down biodegradable waste into rich manure.
    mistakes: {"It makes the waste last longer": "t10_compost", "It turns plastic into food": "t10_compost"}
  - prompt: Which practice best reduces waste going to landfills?
    options:
    - Separating wet and dry waste and recycling
    - Burning plastic in the open
    - Throwing waste into rivers
    - Using more disposable cups
    answer: Separating wet and dry waste and recycling
    difficulty: 2
    hints:
    - Burning plastic pollutes the air.
    - Reduce, reuse, recycle.
    solution: Separating waste lets wet waste be composted and dry waste be recycled, so less goes to landfills.
    mistakes: {"Burning plastic in the open": "t10_reduce_waste", "Using more disposable cups": "t10_reduce_waste"}
