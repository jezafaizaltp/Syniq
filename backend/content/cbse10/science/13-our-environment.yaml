# CBSE Class 10 Science (NCERT), chapter 13. Format: content/README.md.
subject: cbse10-sci
chapter: 13
title: Our Environment
tips:
  c10s_trophic_level: "Count from the producer: plants are first, the animal that eats plants is the first consumer, and so on."
  c10s_ten_percent: That's only one step. Take 10% again for the next level up.
  c10s_ozone_formula: 'O₂ is ordinary oxygen. Ozone has one more atom: O₃.'
  c10s_biodegradable: Paper is made from plants, so microbes can break it down.
  t10_biomagnification: "Each level eats many of the level below. Where does a chemical that doesn't break down pile up most?"
  t10_cfc: "Which chemicals from old fridges and sprays release chlorine high up?"
  t10_compost: "In compost, tiny living things break down kitchen waste into something useful for soil."
  t10_decomposers: "Decomposers break down dead matter. Which choice can't make food and feeds on dead things?"
  c10s13_dead: "Producers make food from sunlight. Which group feeds on dead things and breaks them down?"
  t10_energy_loss: "Only about 10% of energy passes to the next level. What happens after a few levels?"
  t10_manmade_eco: "Which ecosystem do people plant and look after?"
  t10_ozone_uv: "The ozone layer absorbs one kind of harmful sunlight that causes skin cancer."
  t10_reduce_waste: "Which choice lets kitchen waste be composted and dry waste be reused?"
  c10s13_bio_abio: Living parts of an ecosystem are biotic; non-living parts like air, water, soil and temperature are abiotic.
  c10s13_web: "Most animals eat more than one kind of food, so their chains cross and link up like a net. What is that net called?"
  c10s13_energy_flow: 'Energy flows one way: from the sun to producers to consumers. It is not passed back, and some is lost as heat at every step.'
  c10s13_ozone_place: Good ozone is high up in the atmosphere; there it blocks harmful rays from the sun.
  c10s13_3r: "Using less, using again as it is, and making into something new are three different Rs. Which one fits what happens here?"
concepts:
- code: cbse10s.env.ecosystem
  title: Ecosystems and food chains
  notes: |
    An ecosystem is the living things (biotic) and the non-living surroundings (abiotic) of an area, working
    together: forests, ponds, lakes, and man-made ones like gardens and crop fields. Producers (green plants)
    make food; consumers are herbivores, carnivores and omnivores; decomposers (bacteria, fungi) break down dead
    matter and return nutrients to the soil. A food chain shows who eats whom; each step is a trophic level. Food
    chains link into food webs. Energy flows one way, from the Sun to producers to consumers; only about 10%
    of the energy at one level passes to the next (10% law), so food chains are short (3–4 levels).
    Biological magnification: non-biodegradable chemicals like pesticides build up at each level, so the top
    consumers (including humans) have the highest concentration.
  explanations:
    text: In an ecosystem energy passes from the Sun to plants and then from one eater to the next. At each step about nine tenths is used up or lost as heat, so only a tenth moves on. That is why food chains rarely go beyond four levels, and why poisons that don't break down pile up at the top.
    visual: 'Draw a pyramid of four layers: grass (10 000 J), grasshopper (1 000 J), frog (100 J), snake (10 J). Each layer gets about a tenth of the one below.'
    step_by_step: 'Step 1: Find the producer. Step 2: Follow the arrows from food to eater. Step 3: For energy, divide by 10 at each step up. Step 4: For harmful chemicals, the amount increases at each step up.'
    real_world: 'DDT sprayed on crops was found in high levels in fish-eating birds, which laid eggs with thin shells: biological magnification at work.'
  picture:
    kind: bars
    bars:
    - label: Grass (producer)
      value: 10000
    - label: Grasshopper
      value: 1000
    - label: Frog
      value: 100
    - label: Snake
      value: 10
    unit: joules
    alt: 'Bar chart of energy at each trophic level: grass 10,000 joules, grasshopper 1,000, frog 100, snake 10, showing the 10 percent law.'
  activity:
    type: formula
    prompt: Only about 10% of the energy at one level passes to the next. Plants (producers) capture E joules.
    inputs:
    - name: e
      label: Energy captured by plants
      min: 500
      max: 50000
      step: 500
      start: 500
      unit: J
    outputs:
    - name: h
      label: Herbivores (insects)
      expr: e*0.1
      unit: J
    - name: c1
      label: First carnivores (frogs)
      expr: e*0.01
      unit: J
    - name: c2
      label: Top carnivores (snakes)
      expr: e*0.001
      unit: J
      places: 1
    goals:
    - prompt: Snakes at the top need 20 J. How much must the plants capture?
      want:
        c2: 20
      hint: 'Work back up: each level down holds 10 times more.'
      mistakes:
      - when:
          e: 2000
        say: '2000 J of plants leaves just 2 J for the snakes. Three steps of 10%: 10% of 10% of 10%.'
      - when:
          e: 6000
        say: Taking away 10% at each step isn't the rule; only 10% is passed on.
    - prompt: Frogs need 50 J. How much must the plants capture?
      want:
        c1: 50
      mistakes:
      - when:
          e: 500
        say: '500 J of plants gives the frogs only 5 J: frogs are two steps up, so they get 1% of it.'
      - when:
          e: 50000
        say: That's enough for 500 J of frogs. Frogs are two steps up, not three.
  lesson:
    - teach: 'An ecosystem is all the living things in an area (biotic: plants, animals, microbes) together with the non-living things (abiotic: temperature, rain, soil, air). Natural ecosystems include forests, ponds and lakes; gardens, crop fields and aquariums are made by people.'
      check:
        prompt: Which is an abiotic part of a pond?
        options:
        - Water temperature
        - Fish
        - Algae
        answer: Water temperature
        why: It is non-living.
    - teach: 'Producers (green plants) make food from sunlight. Consumers eat others: herbivores, carnivores, omnivores, parasites. Decomposers (bacteria, fungi) break down dead matter and return nutrients to the soil. A food chain shows who eats whom; each step is a trophic level. Linked food chains form a food web.'
      picture:
        kind: flow
        steps:
        - Grass (producer)
        - Grasshopper (herbivore)
        - Frog
        - Snake
        - Eagle
        alt: 'A food chain: grass is eaten by a grasshopper, which is eaten by a frog, then a snake, then an eagle; each step is a trophic level.'
      check:
        prompt: In the chain shown, the frog is at which trophic level?
        options:
        - Third
        - Second
        - Fourth
        answer: Third
        why: Grass 1, grasshopper 2, frog 3.
    - teach: 'Plants capture about 1% of the sunlight falling on leaves. Only about 10% of the energy at one level passes to the next (the 10% law); the rest is used or lost as heat. So food chains are short. Chemicals like pesticides that don''t break down build up at each level: biological magnification. Top consumers get the most.'
      check:
        prompt: Plants have 1000 J. Herbivores get about…
        options:
        - 100 J
        - 10 J
        - 900 J
        answer: 100 J
        why: 10% passes on.
  items:
  - prompt: Which of these are decomposers?
    options:
    - Bacteria and fungi
    - Green plants
    - Lions and tigers
    - Grasshoppers
    answer: Bacteria and fungi
    difficulty: 1
    hints:
    - They break down dead matter.
    - They return nutrients to the soil.
    solution: Bacteria and fungi decompose dead plants and animals.
    mistakes: {"Green plants": "t10_decomposers", "Grasshoppers": "t10_decomposers"}
  - prompt: 'In the chain grass → deer → lion, the deer is a:'
    options:
    - Primary consumer (herbivore)
    - Producer
    - Secondary consumer
    - Decomposer
    answer: Primary consumer (herbivore)
    difficulty: 1
    hints:
    - It eats the producer.
    - Second trophic level.
    solution: The deer eats grass, the producer, so it is a primary consumer.
    mistakes:
      Secondary consumer: c10s_trophic_level
  - prompt: Plants in a food chain capture 20 000 J. By the 10% law, how much energy reaches the secondary consumers, in joules?
    answer: '200'
    check: 20000*Rational(1, 10)**2
    difficulty: 2
    hints:
    - 'Producers → primary consumers: 10%.'
    - Then another 10%.
    solution: 'Step 1: Primary consumers get 2 000 J. Step 2: Secondary consumers get 200 J.'
    mistakes:
      '2000': c10s_ten_percent
  - prompt: Why are food chains usually only 3 or 4 steps long?
    options:
    - So little energy is left after a few levels
    - Animals don't like long chains
    - There are not enough plants
    - Decomposers stop them
    answer: So little energy is left after a few levels
    difficulty: 2
    hints:
    - Only about 10% passes on.
    - After 4 steps it's 0.1%.
    solution: Energy decreases tenfold at each level, so there isn't enough to support many more levels.
    mistakes: {"There are not enough plants": "t10_energy_loss", "Decomposers stop them": "t10_energy_loss"}
  - prompt: A pesticide that doesn't break down is found in a food chain. Which organism will have the highest concentration?
    options:
    - The top consumer
    - The producer
    - The herbivore
    - It is the same in all
    answer: The top consumer
    difficulty: 2
    hints:
    - Biological magnification.
    - It builds up at each step.
    solution: Non-biodegradable chemicals concentrate at each trophic level, so the top consumer has the most.
    mistakes: {"The producer": "t10_biomagnification", "It is the same in all": "t10_biomagnification"}
  - prompt: Which is a man-made ecosystem?
    options:
    - A crop field
    - A forest
    - A lake
    - A mountain grassland
    answer: A crop field
    difficulty: 1
    hints:
    - Humans plant and manage it.
    - Gardens and aquariums too.
    solution: Crop fields, gardens and aquariums are artificial ecosystems.
    mistakes: {"A forest": "t10_manmade_eco", "A lake": "t10_manmade_eco"}
  - prompt: In grass → goat → human, what is the goat?
    options:
    - Herbivore (primary consumer)
    - Producer
    - Decomposer
    - Top carnivore
    answer: Herbivore (primary consumer)
    difficulty: 1
    hints:
    - It eats the plant.
    - First animal in the chain.
    solution: The goat eats grass, so it is a herbivore, the primary consumer.
    mistakes:
      Producer: c10s_trophic_level
  - prompt: Which group returns nutrients from dead plants and animals to the soil?
    options:
    - Decomposers
    - Herbivores
    - Carnivores
    - Producers
    answer: Decomposers
    difficulty: 1
    hints:
    - Bacteria and fungi.
    - They break down dead matter.
    solution: Decomposers break down dead matter into simple substances for the soil.
    mistakes:
      Producers: c10s13_dead
  - prompt: A crop field is an example of…
    options:
    - A man-made ecosystem
    - A natural ecosystem
    - A food web
    - A decomposer
    answer: A man-made ecosystem
    difficulty: 1
    hints:
    - Who plants and cares for it?
    - Same as a garden or aquarium.
    solution: 'Crop fields are planted and looked after by people: man-made (artificial) ecosystems.'
    mistakes:
      A natural ecosystem: t10_manmade_eco
  - prompt: Herbivores get 500 J from plants. By the 10% law, how much reaches the carnivores that eat them, in joules?
    answer: '50'
    check: 500 * 0.1
    difficulty: 2
    hints:
    - One step up.
    - Take 10%.
    solution: 10% of 500 = 50 J.
    mistakes:
      '5': c10s_ten_percent
      '450': c10s13_energy_flow
  - prompt: Why is the flow of energy in an ecosystem called one-way?
    options:
    - Energy passed to the next level doesn't come back
    - Energy goes up and down
    - Animals give energy back to plants
    - The sun takes it back
    answer: Energy passed to the next level doesn't come back
    difficulty: 2
    hints:
    - Energy from the sun to plants to animals.
    - Does a lion give energy back to grass?
    solution: Energy moves from lower to higher levels and never returns; much is lost as heat.
    mistakes:
      Animals give energy back to plants: c10s13_energy_flow
  - prompt: Many food chains joined together in an ecosystem form a…
    options:
    - Food web
    - Trophic level
    - Food pyramid only
    - Decomposer chain
    answer: Food web
    difficulty: 1
    hints:
    - Most animals eat more than one food.
    - The chains cross like a net.
    solution: Interlinked food chains form a food web.
    mistakes:
      Trophic level: c10s13_web
  - prompt: About what percentage of the sunlight falling on leaves do plants capture?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - It is a very small amount.
    - Much smaller than 10%.
    solution: Plants capture about 1% of the sunlight falling on their leaves.
    mistakes:
      '10': c10s_ten_percent
  - prompt: Which of these is abiotic?
    options:
    - Rainfall
    - Earthworm
    - Mushroom
    - Grass
    answer: Rainfall
    difficulty: 1
    hints:
    - Abiotic means non-living.
    - Three of these are alive.
    solution: Rainfall is a non-living (abiotic) factor.
    mistakes:
      Mushroom: c10s13_bio_abio
  - prompt: Why are human beings often at the top of food chains most affected by pesticides like DDT?
    options:
    - The chemical builds up at each trophic level
    - Humans eat only plants
    - DDT is made in the body
    - Pesticides break down quickly
    answer: The chemical builds up at each trophic level
    difficulty: 2
    hints:
    - DDT doesn't break down.
    - Each level eats many of the one below.
    solution: 'Non-biodegradable chemicals accumulate up the chain: biological magnification.'
    mistakes:
      Pesticides break down quickly: t10_biomagnification
- code: cbse10s.env.waste
  title: Ozone and managing waste
  after:
  - cbse10s.env.ecosystem
  notes: |
    Ozone (O₃) in the upper atmosphere shields Earth from the Sun's harmful ultraviolet rays. It is formed when
    UV splits O₂ into O atoms, which join O₂. Chlorofluorocarbons (CFCs), once used in refrigerators and
    aerosols, destroy ozone; in 1987 UNEP got countries to agree to limit them (Montreal Protocol). Waste:
    biodegradable materials are broken down by microbes (food, paper, cotton); non-biodegradable ones are not
    (plastics, glass, some chemicals) and persist and harm the environment. Disposal: reduce, reuse, recycle;
    composting kitchen waste; segregating waste at source; avoiding single-use plastic; using cloth bags.
  explanations:
    text: High up in the atmosphere, a thin ozone layer stops harmful ultraviolet light. Some chemicals like CFCs thin it. On the ground, waste that microbes can break down is biodegradable; plastic and glass are not, so they pile up unless we reduce, reuse and recycle.
    visual: 'Draw two bins: a green one for peels, paper and leaves (biodegradable, can become compost) and a blue one for plastic bottles, glass and cans (non-biodegradable, to be recycled).'
    step_by_step: 'Step 1: Ask whether microbes can break it down. Step 2: Yes → biodegradable → compost. Step 3: No → non-biodegradable → reduce use, reuse, recycle. Step 4: Separate the two at home.'
    real_world: Many Indian cities ask households to separate wet and dry waste so that kitchen waste can be composted and plastic sent for recycling.
  picture:
    kind: compare
    columns:
    - title: Biodegradable
      points:
      - Broken down by microbes
      - Fruit peels, paper, cotton
      - Can be composted
    - title: Non-biodegradable
      points:
      - Not broken down by microbes
      - Plastic, glass, metal cans
      - Reduce, reuse, recycle
    alt: Biodegradable waste like peels and paper is broken down by microbes and composted; non-biodegradable waste like plastic and glass must be reduced, reused or recycled.
  activity:
    type: sort
    prompt: Can microbes break it down?
    bins:
    - Biodegradable
    - Non-biodegradable
    items:
    - label: Banana peel
      bin: Biodegradable
      clue: Was it once part of a living thing?
      why: 'Bacteria and fungi break it down quickly: biodegradable.'
    - label: Plastic bag
      bin: Non-biodegradable
      clue: Can bacteria eat plastic?
      why: 'Microbes can''t break plastic down: it stays for hundreds of years.'
    - label: Newspaper
      bin: Biodegradable
      clue: What is paper made from?
      why: Paper comes from wood, which microbes break down.
    - label: Glass bottle
      bin: Non-biodegradable
      clue: Does glass rot?
      why: Glass doesn't rot, but it can be recycled.
    - label: Cotton cloth
      bin: Biodegradable
      clue: Where does cotton come from?
      why: Cotton is a plant fibre that microbes break down.
    - label: DDT pesticide
      bin: Non-biodegradable
      clue: Why does DDT build up in food chains?
      why: DDT isn't broken down, so it builds up (biological magnification).
    - label: Aluminium can
      bin: Non-biodegradable
      clue: Does a metal can rot?
      why: Microbes can't break down aluminium; recycle it.
    - label: Cow dung
      bin: Biodegradable
      clue: What happens to dung in a biogas plant?
      why: Microbes break it down, making biogas and manure.
    - label: Wood shavings
      bin: Biodegradable
      clue: Does wood rot?
      why: Wood is broken down by fungi and bacteria.
    - label: Polythene wrapper
      bin: Non-biodegradable
      clue: Is polythene a kind of plastic?
      why: 'Polythene is a plastic: not biodegradable.'
  lesson:
    - teach: Ozone (O₃) high in the atmosphere shields Earth from the sun's harmful ultraviolet (UV) rays, which cause skin cancer. It forms when UV splits O₂ and the free O atoms join with O₂. Chlorofluorocarbons (CFCs) from old fridges and sprays damaged it; a 1987 agreement (UNEP) froze their production.
      check:
        prompt: Ozone protects us from…
        options:
        - Ultraviolet rays
        - Visible light
        - Radio waves
        answer: Ultraviolet rays
        why: UV causes skin cancer.
    - teach: Waste that microbes can break down is biodegradable (peels, paper, cotton). Waste they can't break down is non-biodegradable (plastic, glass, metal cans, DDT). Non-biodegradable waste stays for a very long time and harms soil, water and animals.
      picture:
        kind: compare
        columns:
        - title: Biodegradable
          points:
          - Vegetable peels
          - Paper
          - Cotton cloth
        - title: Non-biodegradable
          points:
          - Plastic bags
          - Glass
          - Metal cans
        alt: Biodegradable waste such as peels, paper and cotton is broken down by microbes; plastic bags, glass and metal cans are not.
      check:
        prompt: Which is non-biodegradable?
        options:
        - Polythene bag
        - Banana peel
        - Paper
        answer: Polythene bag
        why: Microbes can't break plastic down.
    - teach: 'We can cut waste: separate wet (kitchen) and dry waste; compost biodegradable waste; reduce, reuse and recycle; carry cloth bags instead of plastic; use steel or glass in place of disposable cups. Kulhads (clay cups) on trains were dropped partly because making them used up fertile topsoil.'
      check:
        prompt: Using a glass jar again to store spices is…
        options:
        - Reuse
        - Recycle
        - Reduce
        answer: Reuse
        why: Used again as it is.
  items:
  - prompt: What does the ozone layer protect us from?
    options:
    - Ultraviolet rays from the Sun
    - Meteorites
    - Acid rain
    - Infrared heat only
    answer: Ultraviolet rays from the Sun
    difficulty: 1
    hints:
    - UV can cause skin cancer.
    - It's in the upper atmosphere.
    solution: Ozone absorbs harmful UV radiation from the Sun.
    mistakes: {"Meteorites": "t10_ozone_uv", "Acid rain": "t10_ozone_uv"}
  - prompt: How many oxygen atoms are in one molecule of ozone?
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - Formula O₃.
    - Oxygen gas is O₂.
    solution: 'Ozone is O₃: 3 oxygen atoms.'
    mistakes:
      '2': c10s_ozone_formula
  - prompt: Which chemicals were mainly responsible for thinning the ozone layer?
    options:
    - Chlorofluorocarbons (CFCs)
    - Carbon dioxide
    - Oxygen
    - Water vapour
    answer: Chlorofluorocarbons (CFCs)
    difficulty: 1
    hints:
    - Used in old fridges and aerosol sprays.
    - Contain chlorine.
    solution: CFCs release chlorine in the upper atmosphere, which breaks down ozone.
    mistakes: {"Carbon dioxide": "t10_cfc", "Water vapour": "t10_cfc"}
  - prompt: Which of these is non-biodegradable?
    options:
    - Plastic bag
    - Banana peel
    - Paper
    - Cotton cloth
    answer: Plastic bag
    difficulty: 1
    hints:
    - Microbes can't break it down.
    - It lasts for hundreds of years.
    solution: Plastic is not broken down by microbes, so it is non-biodegradable.
    mistakes:
      Paper: c10s_biodegradable
  - prompt: Why do we compost kitchen waste?
    options:
    - Microbes turn it into manure for soil
    - It makes the waste last longer
    - It turns plastic into food
    - It produces ozone
    answer: Microbes turn it into manure for soil
    difficulty: 2
    hints:
    - Kitchen waste is biodegradable.
    - Compost feeds plants.
    solution: Composting lets microbes break down biodegradable waste into rich manure.
    mistakes: {"It makes the waste last longer": "t10_compost", "It turns plastic into food": "t10_compost"}
  - prompt: Which practice best reduces waste going to landfills?
    options:
    - Separating wet and dry waste and recycling
    - Burning plastic in the open
    - Throwing waste into rivers
    - Using more disposable cups
    answer: Separating wet and dry waste and recycling
    difficulty: 2
    hints:
    - Burning plastic pollutes the air.
    - Reduce, reuse, recycle.
    solution: Separating waste lets wet waste be composted and dry waste be recycled, so less goes to landfills.
    mistakes: {"Burning plastic in the open": "t10_reduce_waste", "Using more disposable cups": "t10_reduce_waste"}
  - prompt: Which is biodegradable?
    options:
    - Cotton cloth
    - Plastic bottle
    - Aluminium can
    - Glass
    answer: Cotton cloth
    difficulty: 1
    hints:
    - Made from a plant.
    - Microbes can break it down.
    solution: Cotton is natural plant fibre and breaks down.
    mistakes:
      Plastic bottle: c10s_biodegradable
  - prompt: What type of radiation does the ozone layer absorb?
    options:
    - Ultraviolet
    - Infrared
    - Visible
    - Radio
    answer: Ultraviolet
    difficulty: 1
    hints:
    - It causes sunburn and skin cancer.
    - Beyond violet.
    solution: Ozone absorbs ultraviolet radiation.
    mistakes:
      Infrared: t10_ozone_uv
  - prompt: Ozone near the ground is harmful, but ozone high up is useful. Why is high-up ozone useful?
    options:
    - It blocks UV rays from the sun
    - It makes rain
    - It gives us oxygen to breathe
    - It warms the earth
    answer: It blocks UV rays from the sun
    difficulty: 2
    hints:
    - It is a shield.
    - Against which rays?
    solution: High-up ozone absorbs harmful UV rays before they reach us.
    mistakes:
      It gives us oxygen to breathe: c10s13_ozone_place
  - prompt: Melting old aluminium cans to make new ones is…
    options:
    - Recycling
    - Reusing
    - Reducing
    - Composting
    answer: Recycling
    difficulty: 1
    hints:
    - The can is changed into something new.
    - Not used as it is.
    solution: Making a material into a new product is recycling.
    mistakes:
      Reusing: c10s13_3r
  - prompt: Switching off lights and fans when not needed is an example of…
    options:
    - Reduce
    - Reuse
    - Recycle
    - Compost
    answer: Reduce
    difficulty: 1
    hints:
    - Using less.
    - Saving electricity.
    solution: Using less energy is reducing.
    mistakes:
      Recycle: c10s13_3r
  - prompt: In which year did UNEP get countries to agree to freeze CFC production?
    answer: '1987'
    check: '1987'
    difficulty: 3
    hints:
    - Ozone loss was noticed in the 1980s.
    - Late in that decade.
    solution: In 1987 UNEP got an agreement to freeze CFC production at 1986 levels.
    mistakes:
      '1997': t10_cfc
  - prompt: Why were disposable clay cups (kulhads) on trains given up?
    options:
    - Making so many used up fertile topsoil
    - They were too expensive
    - They were plastic
    - Trains became faster
    answer: Making so many used up fertile topsoil
    difficulty: 3
    hints:
    - Clay comes from the ground.
    - Millions were needed every day.
    solution: Making huge numbers of kulhads would remove fertile topsoil, so the idea was dropped.
    mistakes:
      They were plastic: c10s_biodegradable
  - prompt: What should be done with wet kitchen waste?
    options:
    - Compost it
    - Burn it with plastic
    - Throw it in a river
    - Bury it in plastic bags
    answer: Compost it
    difficulty: 1
    hints:
    - It is biodegradable.
    - It can become manure.
    solution: Kitchen waste can be composted into manure.
    mistakes:
      Bury it in plastic bags: t10_compost
  - prompt: Why is non-biodegradable waste harmful?
    options:
    - It stays a long time and harms soil, water and animals
    - It breaks down too fast
    - It feeds plants
    - It makes ozone
    answer: It stays a long time and harms soil, water and animals
    difficulty: 2
    hints:
    - Microbes can't break it.
    - It piles up.
    solution: It persists in the environment and harms living things.
    mistakes:
      It breaks down too fast: c10s_biodegradable
