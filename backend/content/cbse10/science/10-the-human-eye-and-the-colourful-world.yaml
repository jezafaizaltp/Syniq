# CBSE Class 10 Science (NCERT), chapter 10. Format: content/README.md.
subject: cbse10-sci
chapter: 10
title: The Human Eye and the Colourful World
tips:
  c10s_myopia_lens: "In short sight the image forms in front of the retina. You need a lens that spreads rays apart a little, so they meet further back. Which lens diverges light?"
  c10s_dispersion_scatter: "One process splits white light into a band of colours by refraction (a prism). The other sends light off in all directions (blue sky)."
  t10_accommodation: "The eye lens changes its focal length to see near and far. That power has a name."
  t10_atmospheric_refraction: "Starlight passes through moving layers of air of different densities. What does that do to its path?"
  t10_bifocal: "Older eyes may have trouble with both near and far. One lens has two parts for that."
  t10_hypermetropia: "In far-sightedness, near objects are blurred because the image would form beyond the retina."
  t10_near_point: "A normal eye can read comfortably at about a hand-span and a half from the face."
  t10_no_scattering: "With no air there is nothing to scatter sunlight. What colour does the sky look?"
  t10_retina: "The cornea and lens focus light. Which layer at the back has rods and cones?"
  c10s10_front: "The screen with light-sensitive cells is at the back of the eye. This question is about the very first clear layer at the front."
  t10_scattering_blue: "Tiny air particles scatter short wavelengths more. Which colour has a short wavelength?"
  t10_sunrise_minutes: "Atmospheric refraction lifts the Sun's image by a little, worth only a couple of minutes."
  t10_violet_most: "Shorter wavelengths bend more in a prism. Which end of the rainbow has the shortest wavelength?"
  c10s10_eye_parts: 'Follow light into the eye: through the clear front, past the coloured ring with its hole, through the lens, onto the screen at the back. Which part does this job?'
  c10s10_defect_lens: Short sight needs rays spread apart before they enter the eye; long sight needs them brought together. Which does this person need?
  c10s10_far_near: Far point for a normal eye is infinity; near point is 25 cm. Which one has moved for this person?
  c10s10_prism_path: A prism bends light twice, once going in and once coming out, both times towards its base.
  c10s10_size_scatter: Very tiny particles scatter blue the most. Bigger particles scatter all colours about equally, which looks white.
concepts:
- code: cbse10s.eye.defects
  title: The eye and its defects
  notes: |
    The eye: cornea (most bending of light), iris and pupil (control light), crystalline lens, ciliary muscles,
    retina (light-sensitive cells: rods and cones), optic nerve. Accommodation: ciliary muscles change the lens's
    focal length so we see near and far; near point about 25 cm, far point infinity. Defects: myopia
    (short-sightedness: can't see far; image forms in front of the retina; eyeball too long or lens too strong;
    corrected by a concave lens), hypermetropia (long-sightedness: can't see near; image behind the retina;
    corrected by a convex lens), presbyopia (with age the lens hardens: near point moves away; bifocals).
    Cataract: the lens turns cloudy; treated by surgery. We donate eyes after death; corneal blindness can be
    cured.
  explanations:
    text: 'The eye is a camera that refocuses itself: muscles squeeze or relax the lens so near and far things both land sharply on the retina. When the eye can''t focus far away (myopia) a concave lens helps; when it can''t focus close up (hypermetropia) a convex lens helps.'
    visual: Draw an eyeball with light from a far tree. In a myopic eye the rays cross before the retina; add a concave lens in front and they spread just enough to meet on the retina.
    step_by_step: 'Step 1: Ask what the person can''t see clearly: far or near. Step 2: Far → myopia → image in front of retina → concave lens (negative power). Step 3: Near → hypermetropia → image behind retina → convex lens (positive power).'
    real_world: A student who can read a book but not the blackboard has myopia, and wears glasses with negative power.
  picture:
    kind: compare
    columns:
    - title: Myopia (short sight)
      points:
      - Can't see far clearly
      - Image forms before the retina
      - Eyeball too long
      - Corrected by a concave lens
    - title: Hypermetropia (long sight)
      points:
      - Can't see near clearly
      - Image forms behind the retina
      - Eyeball too short
      - Corrected by a convex lens
    alt: 'Myopia and hypermetropia compared: what can''t be seen, where the image forms, the cause, and the corrective lens.'
  activity:
    type: sort
    prompt: Which defect of vision is it?
    bins:
    - Myopia
    - Hypermetropia
    - Presbyopia
    items:
    - label: Can't read the board from the back of the class
      bin: Myopia
      clue: Is it near or far things that blur?
      why: 'Far things blur: short-sightedness, myopia. A concave lens corrects it.'
    - label: Can't read a book held close
      bin: Hypermetropia
      clue: Is it near or far things that blur?
      why: 'Near things blur: long-sightedness, hypermetropia. A convex lens corrects it.'
    - label: The image forms in front of the retina
      bin: Myopia
      clue: Is the light focused too soon or too late?
      why: Focusing too soon, in front of the retina, is myopia.
    - label: The image forms behind the retina
      bin: Hypermetropia
      clue: Is the light focused too soon or too late?
      why: Focusing behind the retina is hypermetropia.
    - label: The eyeball is too long
      bin: Myopia
      clue: 'A longer eyeball: is the retina too far or too near the lens?'
      why: 'The retina is too far back, so the image falls in front of it: myopia.'
    - label: The eyeball is too short
      bin: Hypermetropia
      clue: 'A shorter eyeball: where does the image land?'
      why: 'The retina is too close, so the image falls behind it: hypermetropia.'
    - label: Ciliary muscles weaken with age
      bin: Presbyopia
      clue: Is this caused by age?
      why: 'With age the lens stiffens and the ciliary muscles weaken: presbyopia.'
    - label: A grandparent needs bifocals for both near and far
      bin: Presbyopia
      clue: Do both near and far need help?
      why: Presbyopia often comes with myopia, so bifocals have two parts.
    - label: Corrected by a concave (diverging) lens
      bin: Myopia
      clue: Does the eye need to spread the light out or bring it together?
      why: A concave lens spreads light so it focuses further back, on the retina.
  lesson:
    - teach: Light enters the eye through the cornea, passes the pupil (the hole in the iris), and the lens focuses it onto the retina, which has light-sensitive cells that send signals along the optic nerve to the brain. The iris controls the pupil's size.
      picture:
        kind: flow
        steps:
        - Cornea
        - Pupil (in the iris)
        - Eye lens
        - Retina
        - Optic nerve to brain
        alt: Light passes the cornea, through the pupil in the iris, is focused by the eye lens onto the retina, and signals go along the optic nerve to the brain.
      check:
        prompt: Which part controls how much light enters?
        options:
        - Iris
        - Retina
        - Optic nerve
        answer: Iris
        why: It changes the pupil's size.
    - teach: 'Ciliary muscles change the lens''s shape so we can focus near and far: accommodation. A normal eye sees clearly from 25 cm (near point) to infinity (far point). In old age the lens may become cloudy (cataract), treated by surgery.'
      check:
        prompt: Near point of a normal young eye?
        options:
        - 25 cm
        - 2.5 cm
        - 250 cm
        answer: 25 cm
        why: Least distance of distinct vision.
    - teach: 'Defects: myopia (short sight) — distant things blurred, image in front of the retina; corrected with a concave lens. Hypermetropia (long sight) — near things blurred, image behind the retina; corrected with a convex lens. Presbyopia (age) — weak focusing; often bifocal lenses.'
      picture:
        kind: compare
        columns:
        - title: Myopia
          points:
          - Far objects blurred
          - Image in front of retina
          - Concave lens
        - title: Hypermetropia
          points:
          - Near objects blurred
          - Image behind retina
          - Convex lens
        alt: 'Myopia: far objects blurred, image in front of the retina, fixed with a concave lens. Hypermetropia: near objects blurred, image behind the retina, fixed with a convex lens.'
      check:
        prompt: A child can't read the blackboard from the back. Which lens?
        options:
        - Concave
        - Convex
        - Bifocal
        answer: Concave
        why: 'Far objects are blurred: myopia.'
  items:
  - prompt: Which part of the eye has light-sensitive cells?
    options:
    - Retina
    - Cornea
    - Iris
    - Pupil
    answer: Retina
    difficulty: 1
    hints:
    - Rods and cones.
    - The screen at the back.
    solution: The retina has rods and cones that turn light into nerve signals.
    mistakes: {"Cornea": "t10_retina", "Iris": "t10_retina"}
  - prompt: 'The ability of the eye to focus on near and far objects is called:'
    options:
    - Accommodation
    - Dispersion
    - Refraction
    - Persistence
    answer: Accommodation
    difficulty: 1
    hints:
    - Ciliary muscles change the lens.
    - Focal length changes.
    solution: Accommodation is the eye adjusting the focal length of its lens.
    mistakes: {"Dispersion": "t10_accommodation", "Persistence": "t10_accommodation"}
  - prompt: What is the least distance of distinct vision (near point) for a normal young eye, in cm?
    answer: '25'
    check: '25'
    difficulty: 1
    hints:
    - About a hand-span and a bit.
    - A standard number.
    solution: The near point of a normal eye is about 25 cm.
    mistakes: {"100": "t10_near_point", "5": "t10_near_point"}
  - prompt: A person can't see distant objects clearly. Which lens corrects this?
    options:
    - Concave lens
    - Convex lens
    - Plane glass
    - Bifocal only
    answer: Concave lens
    difficulty: 2
    hints:
    - This is myopia.
    - The image forms in front of the retina.
    solution: Myopia is corrected with a concave (diverging) lens.
    mistakes:
      Convex lens: c10s_myopia_lens
  - prompt: 'In hypermetropia, the image of a near object forms:'
    options:
    - Behind the retina
    - In front of the retina
    - On the retina
    - On the cornea
    answer: Behind the retina
    difficulty: 2
    hints:
    - Long-sightedness.
    - Near objects look blurred.
    solution: In hypermetropia the image of a near object forms behind the retina.
    mistakes: {"In front of the retina": "t10_hypermetropia", "On the cornea": "t10_hypermetropia"}
  - prompt: Why do older people often need bifocal lenses?
    options:
    - They may have both myopia and hypermetropia
    - Their retina has stopped working
    - Their pupils are too big
    - They have cataract in both eyes
    answer: They may have both myopia and hypermetropia
    difficulty: 2
    hints:
    - With age, near vision often gets weak too.
    - Upper part for far, lower for near.
    solution: Bifocals have a concave upper part for far vision and a convex lower part for near vision.
    mistakes: {"Their pupils are too big": "t10_bifocal", "Their retina has stopped working": "t10_bifocal"}
  - prompt: Which muscles change the shape of the eye lens?
    options:
    - Ciliary muscles
    - Iris muscles
    - Optic muscles
    - Retina muscles
    answer: Ciliary muscles
    difficulty: 2
    hints:
    - They hold the lens.
    - They help accommodation.
    solution: Ciliary muscles relax or contract to change the lens's curvature.
    mistakes:
      Iris muscles: c10s10_eye_parts
  - prompt: Light enters the eye mainly through which thin clear front surface, where most bending happens?
    options:
    - Cornea
    - Retina
    - Iris
    - Optic nerve
    answer: Cornea
    difficulty: 2
    hints:
    - It is the transparent bulge at the front.
    - It does most of the refraction.
    solution: Most refraction of light happens at the cornea.
    mistakes:
      Retina: c10s10_front
  - prompt: A person's far point is 2 m instead of infinity. What defect is this?
    options:
    - Myopia
    - Hypermetropia
    - Presbyopia
    - Cataract
    answer: Myopia
    difficulty: 2
    hints:
    - They can't see beyond 2 m clearly.
    - Far things are blurred.
    solution: 'Distant objects blurred: myopia (short sight).'
    mistakes:
      Hypermetropia: c10s10_far_near
  - prompt: A person's near point is 1 m. Which lens helps them read a book?
    options:
    - Convex
    - Concave
    - Plane
    - Cylindrical
    answer: Convex
    difficulty: 2
    hints:
    - Near objects are blurred.
    - The lens must help bring rays together.
    solution: This is hypermetropia, corrected with a converging (convex) lens.
    mistakes:
      Concave: c10s10_defect_lens
  - prompt: The eye lens becomes cloudy in old age, blurring vision. This is…
    options:
    - Cataract
    - Myopia
    - Colour blindness
    - Night blindness
    answer: Cataract
    difficulty: 1
    hints:
    - It is about the lens turning milky.
    - It is treated by surgery.
    solution: A cloudy lens is a cataract; surgery can restore vision.
    mistakes:
      Myopia: c10s10_eye_parts
  - prompt: What happens to the pupil in bright light?
    options:
    - It becomes smaller
    - It becomes bigger
    - It stays the same
    - It closes completely
    answer: It becomes smaller
    difficulty: 1
    hints:
    - Too much light can harm the retina.
    - The iris adjusts it.
    solution: In bright light the iris makes the pupil smaller to let in less light.
    mistakes:
      It becomes bigger: c10s10_eye_parts
  - prompt: A myopic person needs a lens of focal length −80 cm. What is its power in dioptres?
    answer: '-1.25'
    check: 1 / (-0.8)
    difficulty: 3
    hints:
    - P = 1/f in metres.
    - −80 cm = −0.8 m.
    solution: P = 1/(−0.8) = −1.25 D.
    mistakes:
      '1.25': c10s10_defect_lens
      '-0.0125': c10s_power_metres
  - prompt: Why can't we see clearly an object held 5 cm from the eye?
    options:
    - It is closer than the near point
    - It is beyond the far point
    - The retina is too big
    - The pupil is closed
    answer: It is closer than the near point
    difficulty: 2
    hints:
    - The lens can only bend so much.
    - Remember 25 cm.
    solution: The eye can't focus objects closer than its near point (about 25 cm).
    mistakes:
      It is beyond the far point: t10_near_point
  - prompt: Where is the image formed in an eye with hypermetropia (for a near object)?
    options:
    - Behind the retina
    - In front of the retina
    - On the cornea
    - On the iris
    answer: Behind the retina
    difficulty: 2
    hints:
    - Near objects are blurred.
    - The lens can't bend the rays enough.
    solution: The rays would meet behind the retina, so the image is blurred.
    mistakes:
      In front of the retina: c10s10_defect_lens
- code: cbse10s.eye.colours
  title: Prisms, dispersion and scattering
  after:
  - cbse10s.eye.defects
  notes: |
    A prism refracts light twice and the emergent ray is bent through the angle of deviation. White light is a
    mix of colours; a prism splits it into a spectrum (VIBGYOR): dispersion. Violet bends most, red least. A
    second, inverted prism recombines the colours into white (Newton). A rainbow forms when sunlight is
    dispersed, refracted and internally reflected in raindrops; it is seen opposite the Sun. Atmospheric
    refraction makes stars twinkle and the Sun visible about two minutes before actual sunrise and after
    sunset. Scattering: very fine particles scatter blue light most, so the sky looks blue; at sunrise and
    sunset light travels through more air, the blue is scattered away and the Sun looks reddish. Red light is
    scattered least, so danger signals are red. In space the sky looks dark because there is no air to scatter.
  explanations:
    text: White light is really all colours together. A prism or raindrop bends each colour by a different amount, spreading them into a rainbow. Tiny particles in air scatter blue light much more than red, which is why the daytime sky is blue and sunsets are red.
    visual: Draw a white beam entering a triangular prism and a fan of seven colours coming out, red at the top bending least and violet at the bottom bending most.
    step_by_step: 'Step 1: Splitting into colours → dispersion (different colours bend differently). Step 2: Blue sky or red sunset → scattering (blue scatters most). Step 3: Twinkling stars or early sunrise → atmospheric refraction.'
    real_world: Traffic lights use red for 'stop' because red light is scattered least by fog and dust and can be seen from far away.
  picture:
    kind: flow
    steps:
    - White sunlight enters a raindrop
    - Refraction splits it into colours
    - Light reflects off the back of the drop
    - It refracts again as it leaves
    - We see a rainbow, opposite the Sun
    alt: 'How a rainbow forms: sunlight is refracted and split in a raindrop, reflected inside it, and refracted again as it leaves.'
  activity:
    type: sort
    prompt: Which effect of light explains each one?
    bins:
    - Dispersion
    - Scattering
    - Atmospheric refraction
    items:
    - label: A rainbow after rain
      bin: Dispersion
      clue: Is white light being split into colours?
      why: 'Raindrops split sunlight into its colours: dispersion (with refraction and reflection).'
    - label: The sky looks blue
      bin: Scattering
      clue: Do tiny air particles throw some colours around more?
      why: Air scatters blue light most, so the sky looks blue.
    - label: The Sun looks red at sunrise
      bin: Scattering
      clue: Near the horizon, light passes through more air. What is lost?
      why: Most blue is scattered away on the long path; red, scattered least, reaches us.
    - label: Stars twinkle
      bin: Atmospheric refraction
      clue: Does moving air keep bending starlight?
      why: Changing layers of air keep bending starlight, so it flickers.
    - label: A prism splits white light
      bin: Dispersion
      clue: Does each colour bend by a different amount?
      why: 'Violet bends most and red least: dispersion.'
    - label: Danger signals are red
      bin: Scattering
      clue: Which colour travels furthest through fog and smoke?
      why: Red is scattered least, so it is seen from far away.
    - label: The Sun is seen about 2 minutes before it really rises
      bin: Atmospheric refraction
      clue: Does air bend the light over the horizon?
      why: Air bends sunlight round the horizon, so we see the Sun early.
    - label: The sky looks black to astronauts
      bin: Scattering
      clue: Is there air in space to scatter light?
      why: 'No air, no scattering: the sky looks dark.'
    - label: Planets don't twinkle
      bin: Atmospheric refraction
      clue: Why might a disc of light flicker less than a point?
      why: A planet is a small disc, so the bending averages out.
  lesson:
    - teach: 'A glass prism bends light twice, towards its base. White light splits into seven colours: VIBGYOR. This is dispersion: each colour bends by a different amount; violet bends most, red least. A rainbow is dispersion by raindrops, seen with the sun behind you.'
      picture:
        kind: bars
        unit: how much it bends (more = taller)
        bars:
        - label: red
          value: 1
        - label: orange
          value: 2
        - label: yellow
          value: 3
        - label: green
          value: 4
        - label: blue
          value: 5
        - label: indigo
          value: 6
        - label: violet
          value: 7
        alt: In a prism red bends the least and violet bends the most, with orange, yellow, green, blue and indigo in between.
      check:
        prompt: Which colour is at the bottom of a prism's spectrum, bent most?
        options:
        - Violet
        - Red
        - Green
        answer: Violet
        why: Violet bends the most.
    - teach: 'Atmospheric refraction: air layers have different densities, so light bends as it passes through. Stars twinkle because their starlight keeps bending by slightly changing amounts. The sun appears about 2 minutes before sunrise and stays 2 minutes after sunset.'
      check:
        prompt: Planets don't twinkle much because…
        options:
        - They are closer and look like small discs
        - They have no light
        - They are hotter
        answer: They are closer and look like small discs
        why: Many points average out the flicker.
    - teach: 'Scattering: tiny particles in the air scatter blue light (short wavelength) more than red, so the sky is blue. At sunrise and sunset, light travels through more air, the blue is scattered away, and red reaches us. Danger signals are red because red is scattered least. The path of a beam through dust is visible: the Tyndall effect.'
      check:
        prompt: Why are danger lights red?
        options:
        - Red is scattered least, so it is seen far away
        - Red is cheapest
        - Red bends most
        answer: Red is scattered least, so it is seen far away
        why: Longest wavelength, least scattering.
  items:
  - prompt: 'The splitting of white light into its colours is called:'
    options:
    - Dispersion
    - Reflection
    - Scattering
    - Accommodation
    answer: Dispersion
    difficulty: 1
    hints:
    - A prism does it.
    - VIBGYOR.
    solution: Dispersion is the splitting of white light into a spectrum.
    mistakes:
      Scattering: c10s_dispersion_scatter
  - prompt: Which colour of light bends the most in a prism?
    options:
    - Violet
    - Red
    - Green
    - Yellow
    answer: Violet
    difficulty: 1
    hints:
    - It is at the bottom of the spectrum.
    - Shortest wavelength.
    solution: Violet light deviates the most, red the least.
    mistakes: {"Red": "t10_violet_most", "Green": "t10_violet_most"}
  - prompt: Why is the clear sky blue?
    options:
    - Air particles scatter blue light more than red
    - The sea reflects blue light
    - Blue light is absorbed by air
    - The Sun gives out only blue light
    answer: Air particles scatter blue light more than red
    difficulty: 1
    hints:
    - Scattering by tiny particles.
    - Shorter wavelengths scatter more.
    solution: Very small particles in air scatter short-wavelength blue light most, so blue comes to us from all over the sky.
    mistakes: {"The sea reflects blue light": "t10_scattering_blue", "Blue light is absorbed by air": "t10_scattering_blue"}
  - prompt: Why do stars twinkle?
    options:
    - Atmospheric refraction keeps changing the starlight's path
    - Stars switch on and off
    - Clouds block them
    - The Earth spins too fast
    answer: Atmospheric refraction keeps changing the starlight's path
    difficulty: 2
    hints:
    - The air is always moving.
    - Its refractive index changes.
    solution: 'Starlight bends through moving layers of air, so the amount reaching our eyes flickers: twinkling.'
    mistakes: {"Stars switch on and off": "t10_atmospheric_refraction", "The Earth spins too fast": "t10_atmospheric_refraction"}
  - prompt: Because of atmospheric refraction, the Sun is visible about how many minutes before it actually rises?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Advance sunrise and delayed sunset.
    - A small number of minutes.
    solution: The Sun can be seen about 2 minutes before actual sunrise (and about 2 minutes after actual sunset).
    mistakes: {"30": "t10_sunrise_minutes", "10": "t10_sunrise_minutes"}
  - prompt: 'An astronaut in space sees the sky as:'
    options:
    - Dark
    - Blue
    - Red
    - White
    answer: Dark
    difficulty: 2
    hints:
    - No atmosphere.
    - Nothing to scatter light.
    solution: Without air to scatter sunlight, the sky looks dark.
    mistakes: {"Blue": "t10_no_scattering", "White": "t10_no_scattering"}
  - prompt: Light passes through a prism. Which colour bends the least?
    options:
    - Red
    - Violet
    - Blue
    - Green
    answer: Red
    difficulty: 1
    hints:
    - The opposite end from violet.
    - Longest wavelength.
    solution: Red light bends the least.
    mistakes:
      Violet: t10_violet_most
  - prompt: Why does the sun look reddish at sunrise?
    options:
    - Its light travels through more air, so blue is scattered away
    - The sun is cooler in the morning
    - The sun is red then
    - Clouds are red
    answer: Its light travels through more air, so blue is scattered away
    difficulty: 2
    hints:
    - The sun is near the horizon.
    - Light passes a thicker layer of air.
    solution: Near the horizon light crosses more air; most blue is scattered off, so red reaches us.
    mistakes:
      The sun is cooler in the morning: t10_scattering_blue
  - prompt: Clouds look white. Why?
    options:
    - Their water droplets are large and scatter all colours equally
    - Water is white
    - They reflect only blue
    - They absorb red
    answer: Their water droplets are large and scatter all colours equally
    difficulty: 3
    hints:
    - Small particles scatter blue.
    - What about bigger droplets?
    solution: Larger droplets scatter all colours about equally, which mixes to white.
    mistakes:
      They reflect only blue: c10s10_size_scatter
  - prompt: A beam of sunlight entering a dark room through a small hole is visible because of…
    options:
    - The Tyndall effect
    - Dispersion
    - Total internal reflection
    - Refraction in a prism
    answer: The Tyndall effect
    difficulty: 2
    hints:
    - Dust in the air scatters light.
    - It is named after a scientist.
    solution: 'Dust particles scatter the light so the beam''s path is seen: the Tyndall effect.'
    mistakes:
      Dispersion: c10s_dispersion_scatter
  - prompt: How many colours are in the spectrum of white light (VIBGYOR)?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Count the letters of VIBGYOR.
    - Violet to red.
    solution: 'Violet, indigo, blue, green, yellow, orange, red: 7.'
    mistakes:
      '6': c10s10_prism_path
      '3': c10s10_prism_path
  - prompt: A second prism placed upside down after the first one turns the spectrum back into…
    options:
    - White light
    - Only red
    - Only violet
    - Darkness
    answer: White light
    difficulty: 2
    hints:
    - Newton tried this.
    - The second prism undoes the bending.
    solution: The inverted prism recombines the colours into white light.
    mistakes:
      Only red: c10s10_prism_path
  - prompt: To see a rainbow, where should the sun be?
    options:
    - Behind you
    - In front of you
    - Directly overhead
    - Below the horizon
    answer: Behind you
    difficulty: 2
