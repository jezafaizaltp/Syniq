# CBSE Class 9 Mathematics (NCERT), chapter 12. Format: content/README.md.
subject: cbse9-math
chapter: 12
title: Statistics

tips:
  class_width: "Class width is upper limit minus lower limit: for 10–20 it is 10."
  class_mark_middle: "The class mark is the middle of the class: (lower + upper) ÷ 2."
  half_width: "The class mark is in the middle, so the lower limit is only half a width below it."
  unequal_widths: "When class widths differ, a histogram's bar height must be adjusted: height = frequency × (smallest width ÷ this width)."
  bar_vs_histogram: "A histogram's bars touch because the classes run on without gaps. Bar graphs have gaps between separate categories."

concepts:
  - code: cbse9m.stats.tables
    title: Grouped frequency tables
    notes: |
      Raw data can be grouped into classes (class intervals) like 10–20, 20–30 (an observation equal to an
      upper limit goes in the next class). Class width (size) = upper limit − lower limit. Class mark =
      (lower + upper)/2. Frequency is the number of observations in a class; frequencies add to the total.
    explanations:
      text: "When there's lots of data, group it into classes like 0–10, 10–20, 20–30. Count how many values fall in each: that's the frequency. Each class has a width (20 − 10 = 10) and a class mark, its middle (15 for 10–20). A value of exactly 20 goes in 20–30."
      visual: "Picture labelled boxes on a shelf, each for a range of marks. Drop each student's score into its box and count how many end up in each. The label's middle number is the class mark."
      step_by_step: "Step 1: Choose classes of equal width that cover all the data. Step 2: Tally each value into its class (upper limit goes to the next class). Step 3: Count tallies for the frequency. Step 4: Width = upper − lower. Step 5: Class mark = (lower + upper) ÷ 2."
      real_world: "A doctor groups patients' ages into 0–10, 10–20 and so on to see which age group visits most. Nobody's exact age is needed to see the pattern."
    picture:
      kind: bars
      touching: true
      unit: students in each class of marks
      bars:
      - {label: 0–10, value: 3}
      - {label: 10–20, value: 5}
      - {label: 20–30, value: 9}
      - {label: 30–40, value: 6}
      - {label: 40–50, value: 2}
      caption: Each block is one class. The class mark of 20–30 is (20 + 30) ÷ 2 = 25.
      alt: Five touching blocks for marks 0–10, 10–20, 20–30, 30–40 and 40–50, with 3, 5, 9, 6 and 2 students.
    items:
      - prompt: "What is the class mark of the class 20–30?"
        answer: "25"
        check: "(20 + 30)/2"
        difficulty: 1
        hints: ["It's the middle of the class.", "(20 + 30) ÷ 2."]
        solution: "Class mark = (20 + 30) ÷ 2 = 25."
        mistakes: {"10": class_mark_middle}
      - prompt: "What is the width of the class 35–40?"
        answer: "5"
        check: "40 - 35"
        difficulty: 1
        hints: ["Upper minus lower.", "40 − 35."]
        solution: "Width = 40 − 35 = 5."
        mistakes: {"37.5": class_width}
      - prompt: "Classes are 0–10, 10–20, 20–30. In which class does the value 20 go?"
        options: ["20–30", "10–20", "Both", "Neither"]
        answer: "20–30"
        difficulty: 1
        hints: ["The upper limit isn't included in its class.", "20 is the lower limit of 20–30."]
        solution: "By the usual rule, a value equal to an upper limit goes in the next class: 20–30."
      - prompt: "The class marks of a table are 15, 25, 35, 45. What is the class width?"
        answer: "10"
        check: "25 - 15"
        difficulty: 2
        hints: ["Class marks are one width apart.", "25 − 15."]
        solution: "Consecutive class marks differ by the class width: 10."
      - prompt: "A class has mark 47.5 and width 5. What is its lower limit?"
        answer: "45"
        check: "47.5 - 5/2"
        difficulty: 2
        hints: ["The mark is halfway.", "47.5 − 2.5."]
        solution: "Lower limit = 47.5 − 5 ÷ 2 = 45, so the class is 45–50."
        mistakes: {"42.5": half_width}
      - prompt: "Frequencies of four classes are 4, 9, x and 5, with 30 observations in all. Find x."
        answer: "12"
        check: "30 - 4 - 9 - 5"
        difficulty: 2
        hints: ["The frequencies add to the total.", "30 − 18."]
        solution: "Step 1: 4 + 9 + 5 = 18. Step 2: x = 30 − 18 = 12."

  - code: cbse9m.stats.graphs
    title: Bar graphs, histograms and frequency polygons
    after: [cbse9m.stats.tables]
    notes: |
      Bar graph: separate bars of equal width with gaps, one per category. Histogram: for continuous grouped
      data, adjoining rectangles with class intervals on the x-axis; area is proportional to frequency, so
      with unequal widths heights are adjusted (frequency × smallest width ÷ class width). Frequency polygon:
      join the mid-points (class marks) of the tops of the histogram bars, closing it at class marks of
      imaginary classes of zero frequency at each end.
    explanations:
      text: "A bar graph has gaps between bars because each bar is a separate thing, like favourite fruits. A histogram's bars touch because the classes follow on, like marks 0–10, 10–20. Join the middles of the histogram tops and you get a frequency polygon."
      visual: "Picture blocks standing shoulder to shoulder along a number line: a histogram. Put a dot at the centre of each block's top and join the dots, dropping down to zero at a pretend empty class at each end: that's the frequency polygon."
      step_by_step: "Step 1: Put class intervals on the x-axis and frequency on the y-axis. Step 2: Draw a rectangle for each class, touching its neighbours. Step 3: If widths differ, adjust each height: frequency × (smallest width ÷ its width). Step 4: For a polygon, mark each class mark at its frequency and join them, closing at zero on both ends."
      real_world: "A weather office plots rainfall by month as a bar graph, but the heights of a school's students in 5 cm groups as a histogram, because height runs on smoothly with no gaps."
    picture:
      kind: bars
      touching: true
      unit: frequency
      bars:
      - {label: 140–145, value: 4}
      - {label: 145–150, value: 10}
      - {label: 150–155, value: 14}
      - {label: 155–160, value: 8}
      - {label: 160–165, value: 3}
      caption: 'A histogram: the blocks touch because the classes run on without gaps. Join the middles of the tops for the frequency polygon.'
      alt: A histogram of heights in cm with touching blocks for 140–145 to 160–165 and frequencies 4, 10, 14, 8 and 3.
    items:
      - prompt: "In which graph do the bars touch each other?"
        options: ["Histogram", "Bar graph", "Pie chart", "Pictograph"]
        answer: "Histogram"
        difficulty: 1
        hints: ["Which graph shows continuous classes?", "0–10, 10–20 run on with no gap."]
        solution: "A histogram's bars touch because its classes are continuous."
        mistakes: {"Bar graph": bar_vs_histogram}
      - prompt: "A frequency polygon joins which points?"
        options: ["The class marks at the tops of the bars", "The corners of the bars", "The upper limits", "The lower limits"]
        answer: "The class marks at the tops of the bars"
        difficulty: 1
        hints: ["Use the middle of each class.", "That's the class mark."]
        solution: "Each point is at a class mark, at the height of that class's frequency."
        mistakes: {"The upper limits": class_mark_middle}
      - prompt: "A histogram has classes of width 10, except one class 40–60 with frequency 12. What height should its bar have?"
        answer: "6"
        check: "12*10/20"
        difficulty: 2
        hints: ["Width 20 is twice the usual 10.", "12 × 10 ÷ 20."]
        solution: "Step 1: Its width is 20, the smallest is 10. Step 2: Adjusted height = 12 × 10 ÷ 20 = 6."
        mistakes: {"12": unequal_widths}
      - prompt: "Classes are 10–20, 20–30, 30–40. To close the frequency polygon on the left, at what x-value is the zero point?"
        answer: "5"
        check: "(0 + 10)/2"
        difficulty: 2
        hints: ["Imagine a class 0–10 with frequency 0.", "Its class mark."]
        solution: "The imaginary class before 10–20 is 0–10, with class mark 5. The polygon starts at (5, 0)."
        mistakes: {"10": class_mark_middle}
      - prompt: "In a bar graph of favourite sports, the 'Cricket' bar is 18 units tall and 'Football' is 12. How many more chose cricket?"
        answer: "6"
        check: "18 - 12"
        difficulty: 1
        hints: ["Bar heights show frequency.", "18 − 12."]
        solution: "18 − 12 = 6 more students chose cricket."
      - prompt: "A histogram uses widths 5 for most classes, but class 25–40 has frequency 9. What height should its bar have?"
        answer: "3"
        check: "9*5/15"
        difficulty: 3
        hints: ["The width is 15.", "9 × 5 ÷ 15."]
        solution: "Step 1: Width = 15, smallest width = 5. Step 2: Height = 9 × 5 ÷ 15 = 3."
        mistakes: {"9": unequal_widths}
