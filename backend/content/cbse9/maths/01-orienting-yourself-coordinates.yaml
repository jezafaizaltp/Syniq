# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 1. Format: content/README.md.
subject: cbse9-math
chapter: 1
title: 'Orienting Yourself: The Use of Coordinates'
tips:
  axis_point_zero: A point on the x-axis has y = 0, and a point on the y-axis has x = 0.
  rectangle_area_not_perimeter: Area is length × breadth. Adding the sides all the way round gives the perimeter instead.
  quadrant_signs: Quadrant I is (+, +), II is (−, +), III is (−, −), IV is (+, −). Go anticlockwise from the top right.
  distance_forgot_root: 'After adding the squares, take the square root: the distance is √(dx² + dy²), not dx² + dy².'
  distance_added_sides: The straight-line distance is the slanted side of the right triangle, so use Pythagoras, not dx + dy.
  midpoint_subtracted: 'The midpoint is the average: add the two x-values and halve, then add the two y-values and halve.'
  collinear_by_sum: "Points are on one line when the two short distances add up exactly to the long one. Check AB + BC against AC."
  diagonals_share_midpoint: "Both diagonals of a parallelogram have the same midpoint. Find it from A and C, then work out what D must be so B and D share it."
  midpoint_no_halve: "Adding the coordinates is only half the job. Divide each sum by 2 to land in the middle."
  origin_zero: "The origin is where the two axes cross. On the x-axis y is 0, and on the y-axis x is 0, so at the crossing both are 0."
  vertical_distance: "When both points have the same x, they sit on one vertical line. The distance is just the gap between the y-values."
concepts:
- code: cbse9gm.coord.plane
  title: The Cartesian plane
  notes: |
    Two perpendicular number lines, the x-axis (horizontal) and y-axis (vertical), meet at the origin O(0, 0).
    They divide the plane into four quadrants, numbered anticlockwise from the top right. Signs of (x, y):
    I (+, +), II (−, +), III (−, −), IV (+, −). Points on an axis are in no quadrant.
  explanations:
    text: Draw a horizontal number line (the x-axis) and a vertical one (the y-axis) crossing at 0. That crossing point is the origin. The two lines cut the page into four quadrants, numbered I, II, III, IV going anticlockwise from the top right.
    visual: 'Picture a plus sign on squared paper. Top right is Quadrant I where both numbers are positive. Move anticlockwise: top left is II (x negative), bottom left is III (both negative), bottom right is IV (y negative).'
    step_by_step: 'Step 1: Look at the sign of x: positive is right of the y-axis, negative is left. Step 2: Look at the sign of y: positive is above the x-axis, negative is below. Step 3: Right and above is I, left and above is II, left and below is III, right and below is IV. Step 4: If either number is 0, the point is on an axis, not in a quadrant.'
    real_world: A city map with a clock tower at the centre works the same way. 'Two blocks east and three blocks north' is (2, 3) in Quadrant I. 'Two blocks west and three south' is (−2, −3) in Quadrant III.
  picture:
    kind: geometry
    axes: true
    range:
    - -6
    - 6
    points:
      A(3, 2):
      - 3
      - 2
      B(−3, 2):
      - -3
      - 2
      C(−3, −2):
      - -3
      - -2
      D(3, −2):
      - 3
      - -2
    caption: A is in Quadrant I, B in II, C in III and D in IV, going anticlockwise.
    alt: 'Coordinate axes with four points: A(3, 2) top right in Quadrant I, B(−3, 2) top left in II, C(−3, −2) bottom left in III, D(3, −2) bottom right in IV.'
  activity:
    type: sort
    prompt: Where does each point sit? Choose its quadrant, or 'On an axis'.
    bins:
    - Quadrant I
    - Quadrant II
    - Quadrant III
    - Quadrant IV
    - On an axis
    items:
    - label: (3, 5)
      bin: Quadrant I
      clue: Which way does x = 3 take you, left or right? And y = 5, up or down?
      why: 'Right and up: the top right, Quadrant I.'
    - label: (−2, 4)
      bin: Quadrant II
      clue: 'x is −2: is that left or right of the y-axis?'
      why: 'Left (x negative) and up (y positive): the top left, Quadrant II.'
    - label: (−5, −1)
      bin: Quadrant III
      clue: Look at both signs. Where is 'left and down'?
      why: 'Both negative: left and down, the bottom left, Quadrant III.'
    - label: (4, −3)
      bin: Quadrant IV
      clue: 'y is −3: is that above or below the x-axis?'
      why: 'Right (x positive) and down (y negative): the bottom right, Quadrant IV.'
    - label: (0, 6)
      bin: On an axis
      clue: 'x is 0: how far left or right do you move?'
      why: x = 0 means no move sideways, so the point sits on the y-axis, in no quadrant.
    - label: (−7, 0)
      bin: On an axis
      clue: 'y is 0: how far up or down do you move?'
      why: 'y = 0 means no move up or down: the point stays on the x-axis, in no quadrant.'
    - label: (−1, −6)
      bin: Quadrant III
      clue: Is either number positive?
      why: 'Both are negative, so it is left and down: Quadrant III.'
    - label: (6, −0.5)
      bin: Quadrant IV
      clue: Is −0.5 above or below zero?
      why: 'y is negative, even if only a little, so the point is just below the x-axis: Quadrant IV.'
    - label: (−3, 3)
      bin: Quadrant II
      clue: The numbers look alike. Which sign does each one have?
      why: 'x is negative and y positive: Quadrant II. Numbers of the same size can sit in different quadrants.'
  items:
  - prompt: In which quadrant is the point (−4, 5)?
    options:
    - Quadrant II
    - Quadrant I
    - Quadrant III
    - Quadrant IV
    answer: Quadrant II
    difficulty: 1
    hints:
    - x is negative, so it's to the left.
    - y is positive, so it's above.
    solution: 'Step 1: x = −4 is negative: left of the y-axis. Step 2: y = 5 is positive: above the x-axis. Step 3: Left and above is Quadrant II.'
    mistakes:
      Quadrant IV: quadrant_signs
  - prompt: In which quadrant is the point (3, −2)?
    options:
    - Quadrant IV
    - Quadrant II
    - Quadrant III
    - Quadrant I
    answer: Quadrant IV
    difficulty: 1
    hints:
    - 'x is positive: right.'
    - 'y is negative: below.'
    solution: 'Step 1: x = 3 is right of the y-axis. Step 2: y = −2 is below the x-axis. Step 3: Right and below is Quadrant IV.'
    mistakes:
      Quadrant II: quadrant_signs
  - prompt: What are the coordinates of the origin?
    options:
    - (0, 0)
    - (1, 1)
    - (0, 1)
    - (1, 0)
    answer: (0, 0)
    difficulty: 1
    hints:
    - The origin is where the axes cross.
    - Both axes are at 0 there.
    solution: The axes cross where x = 0 and y = 0, so the origin is (0, 0).
    mistakes: {"(1, 1)": "origin_zero", "(0, 1)": "origin_zero"}
  - prompt: Where does the point (0, −6) lie?
    options:
    - On the y-axis
    - On the x-axis
    - In Quadrant III
    - In Quadrant IV
    answer: On the y-axis
    difficulty: 2
    hints:
    - Its x-coordinate is 0.
    - x = 0 means no distance left or right of the y-axis.
    solution: 'Step 1: x = 0, so the point is neither left nor right of the y-axis. Step 2: It lies on the y-axis, 6 units below the origin.'
    mistakes:
      On the x-axis: axis_point_zero
  - prompt: A point has both coordinates negative. Which quadrant is it in?
    options:
    - Quadrant III
    - Quadrant I
    - Quadrant II
    - Quadrant IV
    answer: Quadrant III
    difficulty: 2
    hints:
    - Negative x means left.
    - Negative y means below.
    solution: Left and below the origin is Quadrant III.
    mistakes:
      Quadrant I: quadrant_signs
  - prompt: Which point is NOT in any quadrant?
    options:
    - (5, 0)
    - (5, 1)
    - (−1, 5)
    - (−5, −1)
    answer: (5, 0)
    difficulty: 2
    hints:
    - Look for a 0.
    - A point with a 0 coordinate sits on an axis.
    solution: (5, 0) has y = 0, so it lies on the x-axis, which belongs to no quadrant.
    mistakes:
      (5, 1): axis_point_zero
- code: cbse9gm.coord.plot
  title: Coordinates of a point
  after:
  - cbse9gm.coord.plane
  notes: |
    A point P is written (x, y): x is the abscissa (distance from the y-axis, signed), y is the ordinate
    (distance from the x-axis, signed). Order matters: (2, 5) ≠ (5, 2). To plot, move x along the x-axis
    first, then y parallel to the y-axis.
  explanations:
    text: 'Coordinates are always written (x, y): first how far across, then how far up or down. The first number is called the abscissa and the second the ordinate. (2, 5) and (5, 2) are different points.'
    visual: Walk along the corridor before you take the stairs. Start at the origin, walk x steps right (or left if negative), then climb y steps up (or down if negative). Where you stop is the point.
    step_by_step: 'Step 1: Start at the origin. Step 2: Move along the x-axis by the first number. Step 3: From there, move up or down by the second number. Step 4: Mark the point and label it with its coordinates.'
    real_world: In a cinema, 'Row F, Seat 12' finds one seat. Swap them to 'Row 12, Seat F' and you're somewhere else. Coordinates need the same fixed order.
  picture:
    kind: geometry
    axes: true
    range:
    - -2
    - 6
    points:
      O:
      - 0
      - 0
      H:
      - 4
      - 0
      P(4, 3):
      - 4
      - 3
    segments:
    - - O
      - H
      - 4 right
    - - H
      - P(4, 3)
      - 3 up
    caption: 'To plot P(4, 3): start at O, go 4 along the x-axis, then 3 up.'
    alt: Coordinate axes. A path goes from the origin O 4 steps right to H, then 3 steps up to the point P(4, 3).
  activity:
    type: graph
    mode: point
    range:
    - -6
    - 6
    prompt: Move the point with the buttons. The first number says how far across, the second how far up or down.
    goals:
    - prompt: Plot P(2, 5).
      x: 2
      y: 5
      mistakes:
      - when:
          x: 5
          y: 2
        say: 'That''s (5, 2): 5 across and 2 up. The first number is the across move, so P is only 2 across.'
      - when:
          x: 2
          y: -5
        say: That's 5 below the x-axis. A positive y goes up.
    - prompt: Plot Q(−4, 3).
      x: -4
      y: 3
      mistakes:
      - when:
          x: 4
          y: 3
        say: That's (4, 3), right of the y-axis. A negative x goes left.
      - when:
          x: 3
          y: -4
        say: 'That''s (3, −4): the two numbers swapped places. Go across first, by −4.'
    - prompt: Plot R(0, −3). Its abscissa is 0.
      x: 0
      y: -3
      mistakes:
      - when:
          x: -3
          y: 0
        say: That's (−3, 0), on the x-axis. An abscissa of 0 means no move across at all; the −3 is the up-or-down move.
    - prompt: Plot S(−5, −2).
      x: -5
      y: -2
      mistakes:
      - when:
          x: -2
          y: -5
        say: 'That''s (−2, −5): swapped. S is 5 to the left and only 2 down.'
      - when:
          x: 5
          y: 2
        say: 'Both signs dropped: that''s (5, 2), top right. Two negatives put S bottom left.'
  items:
  - prompt: What is the abscissa of the point (7, −3)?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - The abscissa is the x-coordinate.
    - It's the first number.
    solution: The abscissa is the first coordinate, x = 7.
    mistakes:
      '-3': swapped_coordinates
  - prompt: What is the ordinate of the point (−2, 9)?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - The ordinate is the y-coordinate.
    - It's the second number.
    solution: The ordinate is the second coordinate, y = 9.
    mistakes:
      '-2': swapped_coordinates
  - prompt: A point is 4 units to the left of the y-axis and 1 unit above the x-axis. What are its coordinates?
    options:
    - (−4, 1)
    - (4, 1)
    - (1, −4)
    - (−1, 4)
    answer: (−4, 1)
    difficulty: 2
    hints:
    - Left of the y-axis means x is negative.
    - Above the x-axis means y is positive.
    solution: 'Step 1: Left 4 gives x = −4. Step 2: Up 1 gives y = 1. Step 3: The point is (−4, 1).'
    mistakes:
      (1, −4): swapped_coordinates
  - prompt: How far is the point (−5, 3) from the y-axis?
    answer: '5'
    check: abs(-5)
    difficulty: 2
    hints:
    - Distance from the y-axis is given by x.
    - Distance is never negative.
    solution: 'Step 1: Distance from the y-axis is the size of x. Step 2: |−5| = 5 units.'
    mistakes:
      '-5': negative_distance
      '3': swapped_coordinates
  - prompt: A point lies on the x-axis, 6 units to the left of the origin. What is its ordinate?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - Points on the x-axis have no height.
    - The ordinate is y.
    solution: A point on the x-axis has y = 0, so its ordinate is 0. The point is (−6, 0).
    mistakes:
      '-6': axis_point_zero
  - prompt: The points (0, 0), (4, 0) and (4, 3) are three corners of a rectangle. What is its area in square units?
    answer: '12'
    check: 4*3
    difficulty: 3
    hints:
    - The fourth corner is (0, 3).
    - Length 4, breadth 3.
    solution: 'Step 1: The sides run from x = 0 to 4 (length 4) and y = 0 to 3 (breadth 3). Step 2: Area = 4 × 3 = 12 square units.'
    mistakes:
      '14': rectangle_area_not_perimeter
- code: cbse9gm.coord.distance
  title: Distance between two points
  after:
  - cbse9gm.coord.plot
  notes: |
    The distance between P(x₁, y₁) and Q(x₂, y₂) is found by drawing a right triangle with PQ as the slanted
    side: the horizontal side is |x₂ − x₁| and the vertical side is |y₂ − y₁|. By Pythagoras,
    PQ = √((x₂ − x₁)² + (y₂ − y₁)²). The distance of P from the origin is √(x² + y²). Points on the same
    horizontal line are |x₂ − x₁| apart; on the same vertical line, |y₂ − y₁|.
  explanations:
    text: 'To find how far apart two points are, find how far you go across (the change in x) and how far up or down (the change in y). These are two sides of a right triangle, and the distance is the slanted side: distance = √(across² + up²).'
    visual: 'Plot A(1, 1) and B(4, 5). From A draw a line across to (4, 1), then up to B. You have a right triangle with sides 3 and 4. The slanted side AB is the distance: √(3² + 4²) = √25 = 5.'
    step_by_step: 'Step 1: Subtract the x-values: dx = x₂ − x₁. Step 2: Subtract the y-values: dy = y₂ − y₁. Step 3: Square both and add: dx² + dy². Step 4: Take the square root.'
    real_world: 'On a city map with square blocks, your home is 3 blocks east and 4 blocks north of school. Walking along the roads is 7 blocks, but a bird flies straight: √(3² + 4²) = 5 blocks.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 6
    points:
      A:
      - 1
      - 1
      B:
      - 4
      - 5
      C:
      - 4
      - 1
    segments:
    - - A
      - C
      - '3'
    - - C
      - B
      - '4'
    - - A
      - B
      - '5'
    angles:
    - at: C
      from: A
      to: B
      label: 90°
    caption: AB = √(3² + 4²) = 5
    alt: Points A(1, 1) and B(4, 5) on a grid, joined by a slanted line of length 5, with a right triangle of sides 3 across and 4 up.
  activity:
    type: formula
    prompt: P is fixed at (1, 2). Move Q and compare the walk along the grid with the straight line PQ.
    inputs:
    - name: x
      label: Q's x
      min: -6
      max: 10
      step: 1
      start: 1
    - name: y
      label: Q's y
      min: -6
      max: 10
      step: 1
      start: 2
    outputs:
    - name: dx
      label: Across |x − 1|
      expr: abs(x-1)
    - name: dy
      label: Up or down |y − 2|
      expr: abs(y-2)
    - name: walk
      label: Walk along the grid
      expr: abs(x-1)+abs(y-2)
    - name: d
      label: Straight line PQ
      expr: sqrt((x-1)^2+(y-2)^2)
      places: 2
    goals:
    - prompt: Move Q so PQ is exactly 5 in a straight line, and Q is not straight across or straight up from P.
      want:
        d: 5
        dx:
        - 1
        - 16
        dy:
        - 1
        - 16
      hint: Which two whole numbers, squared and added, make 5² = 25?
      mistakes:
      - when:
          dx: 0
        say: Q is straight above or below P, so you only need one side. Move Q sideways too, so Pythagoras is needed.
      - when:
          dy: 0
        say: Q is straight across from P. Move it up or down too, so the line is slanted.
      - when:
          walk: 5
        say: Q is 5 steps away along the grid, but the straight line cuts the corner, so PQ is shorter than 5. PQ² = across² + up².
      - when:
          d:
          - 2.2
          - 2.3
        say: Across² + up² is 5 here, so PQ = √5 ≈ 2.24. To make PQ = 5, across² + up² must be 25.
    - prompt: Now move Q so PQ is exactly 10, again on a slant.
      want:
        d: 10
        dx:
        - 1
        - 16
        dy:
        - 1
        - 16
      mistakes:
      - when:
          dx: 0
        say: 'Q is straight above or below P. Keep the line slanted: move Q sideways too.'
      - when:
          dy: 0
        say: 'Q is straight across from P. Keep the line slanted: move Q up or down too.'
      - when:
          walk: 10
        say: 10 steps along the grid, but the slanted line is shorter. For PQ = 10 you need across² + up² = 100.
      - when:
          d:
          - 3.1
          - 3.2
        say: Across² + up² is 10, so PQ = √10 ≈ 3.16, not 10. Square the distance you want, not the sides you have.
  items:
  - prompt: Find the distance between (0, 0) and (6, 8).
    answer: '10'
    check: sqrt(6^2 + 8^2)
    difficulty: 1
    hints:
    - Across 6, up 8.
    - √(36 + 64).
    solution: 'Step 1: dx = 6, dy = 8. Step 2: 36 + 64 = 100. Step 3: √100 = 10.'
    mistakes:
      '14': distance_added_sides
      '100': distance_forgot_root
  - prompt: Find the distance between (2, 3) and (2, 10).
    answer: '7'
    check: 10 - 3
    difficulty: 1
    hints:
    - Both points have x = 2.
    - They are on the same vertical line.
    solution: 'Step 1: The x-values are equal, so the points are on a vertical line. Step 2: Distance = 10 − 3 = 7.'
    mistakes: {"13": "vertical_distance", "49": "distance_forgot_root"}
  - prompt: Find the distance between (1, 2) and (4, 6).
    answer: '5'
    check: sqrt((4-1)^2 + (6-2)^2)
    difficulty: 2
    hints:
    - dx = 3, dy = 4.
    - √(9 + 16).
    solution: 'Step 1: dx = 4 − 1 = 3, dy = 6 − 2 = 4. Step 2: 9 + 16 = 25. Step 3: √25 = 5.'
    mistakes:
      '7': distance_added_sides
      '25': distance_forgot_root
  - prompt: How far is the point (−5, 12) from the origin?
    answer: '13'
    check: sqrt((-5)^2 + 12^2)
    difficulty: 2
    hints:
    - Use √(x² + y²).
    - (−5)² = 25.
    solution: 'Step 1: (−5)² + 12² = 25 + 144 = 169. Step 2: √169 = 13.'
    mistakes:
      '7': distance_added_sides
  - prompt: Find the distance between (−1, −2) and (2, 2).
    answer: '5'
    check: sqrt((2-(-1))^2 + (2-(-2))^2)
    difficulty: 3
    hints:
    - dx = 2 − (−1) = 3.
    - dy = 2 − (−2) = 4.
    solution: 'Step 1: dx = 3, dy = 4. Step 2: √(9 + 16) = √25 = 5.'
    mistakes: {"7": "distance_added_sides", "25": "distance_forgot_root"}
  - prompt: Are A(0, 0), B(3, 4) and C(6, 8) on one straight line? (AB = 5, BC = 5, AC = 10)
    options:
    - Yes, because AB + BC = AC
    - No, because AB = BC
    - No, because AC is the longest
    - Can't tell from distances
    answer: Yes, because AB + BC = AC
    difficulty: 3
    hints:
    - If B is on the straight path from A to C, going via B is no longer.
    - 5 + 5 = 10.
    solution: 'Step 1: AB + BC = 5 + 5 = 10 = AC. Step 2: Going via B is no longer than going straight, so B lies on segment AC: the points are collinear.'
    mistakes: {"No, because AB = BC": "collinear_by_sum", "Can't tell from distances": "collinear_by_sum"}
- code: cbse9gm.coord.midpoint
  title: The midpoint of a segment
  after:
  - cbse9gm.coord.distance
  notes: |
    The midpoint of the segment joining (x₁, y₁) and (x₂, y₂) is ((x₁ + x₂)/2, (y₁ + y₂)/2): the average of
    the x-values and the average of the y-values. If M is the midpoint of AB and A and M are known, then
    B = (2·xM − xA, 2·yM − yA).
  explanations:
    text: 'The midpoint is exactly halfway, so its x-value is halfway between the two x-values and its y-value is halfway between the two y-values. Halfway between two numbers is their average: add and divide by 2.'
    visual: 'Plot A(2, 1) and B(6, 5). Halfway across, 2 → 6, is 4. Halfway up, 1 → 5, is 3. Mark M(4, 3): it sits in the middle of the line AB, the same distance from both ends.'
    step_by_step: 'Step 1: Add the x-values and halve. Step 2: Add the y-values and halve. Step 3: Write the midpoint as (x, y). Step 4: Check: the distance to each end should be the same.'
    real_world: 'Two friends live at (2, 1) and (6, 5) on a town grid and want to meet halfway: they meet at (4, 3), so each walks the same distance.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 7
    points:
      A:
      - 2
      - 1
      M:
      - 4
      - 3
      B:
      - 6
      - 5
    segments:
    - - A
      - M
    - - M
      - B
    caption: M = ((2 + 6)/2, (1 + 5)/2) = (4, 3)
    alt: Segment from A(2, 1) to B(6, 5) with its midpoint M(4, 3) marked in the middle.
  activity:
    type: formula
    prompt: A is at (2, 1). Move B and watch M, the midpoint of AB.
    inputs:
    - name: x
      label: B's x
      min: -8
      max: 10
      step: 1
      start: 2
    - name: y
      label: B's y
      min: -8
      max: 10
      step: 1
      start: 1
    outputs:
    - name: mx
      label: M's x = (2 + x) ÷ 2
      expr: (2+x)/2
    - name: my
      label: M's y = (1 + y) ÷ 2
      expr: (1+y)/2
    goals:
    - prompt: Make the midpoint M = (5, 4). Where must B be?
      want:
        mx: 5
        my: 4
      hint: M is halfway. How far is it from A to M across, and up? Where does the same step again take you?
      mistakes:
      - when:
          x: 3
          y: 3
        say: B at (3, 3) is M − A. Then the midpoint is (2.5, 2), between A and M. B must be on the far side of M.
      - when:
          x: 5
          y: 4
        say: With B on top of M, the midpoint is (3.5, 2.5), halfway from A to M. M must be in the middle, with B beyond it.
      - when:
          x: 8
        say: 'B''s x is right: M''s x is 5. Now y: A is 3 below M, so how far above M is B?'
    - prompt: Now make M = (−1, 0).
      want:
        mx: -1
        my: 0
      mistakes:
      - when:
          x: -3
          y: -1
        say: B at (−3, −1) is M − A, giving M = (−0.5, 0). From A to M is 3 left and 1 down; B is that same step again past M.
      - when:
          x: -1
          y: 0
        say: With B on top of M, the midpoint is halfway from A to M. B has to be as far past M as A is before it.
  items:
  - prompt: Find the x-coordinate of the midpoint of (2, 4) and (8, 10).
    answer: '5'
    check: (2 + 8)/2
    difficulty: 1
    hints:
    - Average the x-values.
    - (2 + 8) ÷ 2.
    solution: 'Step 1: 2 + 8 = 10. Step 2: 10 ÷ 2 = 5. (The midpoint is (5, 7).)'
    mistakes:
      '3': midpoint_subtracted
      '10': forgot_divide
  - prompt: What is the midpoint of (0, 0) and (6, 4)?
    options:
    - (3, 2)
    - (6, 4)
    - (2, 3)
    - (12, 8)
    answer: (3, 2)
    difficulty: 1
    hints:
    - Halve each coordinate.
    - x first, then y.
    solution: 'Step 1: (0 + 6)/2 = 3. Step 2: (0 + 4)/2 = 2. Midpoint (3, 2).'
    mistakes: {"(6, 4)": "midpoint_no_halve", "(12, 8)": "midpoint_no_halve"}
  - prompt: Find the y-coordinate of the midpoint of (−3, 7) and (5, −1).
    answer: '3'
    check: (7 + (-1))/2
    difficulty: 2
    hints:
    - 'Add the y-values: 7 + (−1).'
    - Then halve.
    solution: 'Step 1: 7 + (−1) = 6. Step 2: 6 ÷ 2 = 3. (The midpoint is (1, 3).)'
    mistakes:
      '4': midpoint_subtracted
  - prompt: M(4, 5) is the midpoint of AB, and A is (1, 2). What is the x-coordinate of B?
    answer: '7'
    check: 2*4 - 1
    difficulty: 2
    hints:
    - From A to M, x goes up by 3.
    - Go up by 3 again.
    solution: 'Step 1: x goes 1 → 4, up 3. Step 2: B is another 3 on: 4 + 3 = 7. (B = (7, 8).)'
    mistakes:
      '2.5': midpoint_subtracted
  - prompt: The ends of a diameter of a circle are (−2, 3) and (6, 3). What are the coordinates of the centre?
    options:
    - (2, 3)
    - (4, 3)
    - (2, 0)
    - (8, 6)
    answer: (2, 3)
    difficulty: 2
    hints:
    - The centre is the midpoint of a diameter.
    - (−2 + 6)/2.
    solution: 'Step 1: The centre is the midpoint of the diameter. Step 2: ((−2 + 6)/2, (3 + 3)/2) = (2, 3).'
    mistakes: {"(4, 3)": "midpoint_subtracted", "(8, 6)": "midpoint_no_halve"}
  - prompt: The diagonals of a parallelogram bisect each other. Three corners are A(0, 0), B(4, 0) and C(6, 3), with D opposite B. Find the x-coordinate of D.
    answer: '2'
    check: 0 + 6 - 4
    difficulty: 3
    hints:
    - Midpoint of AC = midpoint of BD.
    - Midpoint of AC is (3, 1.5).
    solution: 'Step 1: Midpoint of AC = (3, 1.5). Step 2: It is also the midpoint of BD, so (4 + x)/2 = 3, x = 2. (D = (2, 3).)'
    mistakes: {"6": "diagonals_share_midpoint", "10": "diagonals_share_midpoint"}
