# CBSE Class 9 Mathematics (NCERT), chapter 3. Format: content/README.md.
subject: cbse9-math
chapter: 3
title: Coordinate Geometry

tips:
  axis_point_zero: "A point on the x-axis has y = 0, and a point on the y-axis has x = 0."
  rectangle_area_not_perimeter: "Area is length × breadth. Adding the sides all the way round gives the perimeter instead."
  quadrant_signs: "Quadrant I is (+, +), II is (−, +), III is (−, −), IV is (+, −). Go anticlockwise from the top right."

concepts:
  - code: cbse9m.coord.plane
    title: The Cartesian plane
    notes: |
      Two perpendicular number lines, the x-axis (horizontal) and y-axis (vertical), meet at the origin O(0, 0).
      They divide the plane into four quadrants, numbered anticlockwise from the top right. Signs of (x, y):
      I (+, +), II (−, +), III (−, −), IV (+, −). Points on an axis are in no quadrant.
    explanations:
      text: "Draw a horizontal number line (the x-axis) and a vertical one (the y-axis) crossing at 0. That crossing point is the origin. The two lines cut the page into four quadrants, numbered I, II, III, IV going anticlockwise from the top right."
      visual: "Picture a plus sign on squared paper. Top right is Quadrant I where both numbers are positive. Move anticlockwise: top left is II (x negative), bottom left is III (both negative), bottom right is IV (y negative)."
      step_by_step: "Step 1: Look at the sign of x: positive is right of the y-axis, negative is left. Step 2: Look at the sign of y: positive is above the x-axis, negative is below. Step 3: Right and above is I, left and above is II, left and below is III, right and below is IV. Step 4: If either number is 0, the point is on an axis, not in a quadrant."
      real_world: "A city map with a clock tower at the centre works the same way. 'Two blocks east and three blocks north' is (2, 3) in Quadrant I. 'Two blocks west and three south' is (−2, −3) in Quadrant III."
    picture:
      kind: geometry
      axes: true
      range: [-6, 6]
      points:
        A(3, 2): [3, 2]
        B(−3, 2): [-3, 2]
        C(−3, −2): [-3, -2]
        D(3, −2): [3, -2]
      caption: A is in Quadrant I, B in II, C in III and D in IV, going anticlockwise.
      alt: 'Coordinate axes with four points: A(3, 2) top right in Quadrant I, B(−3, 2) top left in II, C(−3, −2) bottom left in III, D(3, −2) bottom right in IV.'
    items:
      - prompt: "In which quadrant is the point (−4, 5)?"
        options: ["Quadrant II", "Quadrant I", "Quadrant III", "Quadrant IV"]
        answer: "Quadrant II"
        difficulty: 1
        hints: ["x is negative, so it's to the left.", "y is positive, so it's above."]
        solution: "Step 1: x = −4 is negative: left of the y-axis. Step 2: y = 5 is positive: above the x-axis. Step 3: Left and above is Quadrant II."
        mistakes: {"Quadrant IV": quadrant_signs}
      - prompt: "In which quadrant is the point (3, −2)?"
        options: ["Quadrant IV", "Quadrant II", "Quadrant III", "Quadrant I"]
        answer: "Quadrant IV"
        difficulty: 1
        hints: ["x is positive: right.", "y is negative: below."]
        solution: "Step 1: x = 3 is right of the y-axis. Step 2: y = −2 is below the x-axis. Step 3: Right and below is Quadrant IV."
        mistakes: {"Quadrant II": quadrant_signs}
      - prompt: "What are the coordinates of the origin?"
        options: ["(0, 0)", "(1, 1)", "(0, 1)", "(1, 0)"]
        answer: "(0, 0)"
        difficulty: 1
        hints: ["The origin is where the axes cross.", "Both axes are at 0 there."]
        solution: "The axes cross where x = 0 and y = 0, so the origin is (0, 0)."
      - prompt: "Where does the point (0, −6) lie?"
        options: ["On the y-axis", "On the x-axis", "In Quadrant III", "In Quadrant IV"]
        answer: "On the y-axis"
        difficulty: 2
        hints: ["Its x-coordinate is 0.", "x = 0 means no distance left or right of the y-axis."]
        solution: "Step 1: x = 0, so the point is neither left nor right of the y-axis. Step 2: It lies on the y-axis, 6 units below the origin."
        mistakes: {"On the x-axis": axis_point_zero}
      - prompt: "A point has both coordinates negative. Which quadrant is it in?"
        options: ["Quadrant III", "Quadrant I", "Quadrant II", "Quadrant IV"]
        answer: "Quadrant III"
        difficulty: 2
        hints: ["Negative x means left.", "Negative y means below."]
        solution: "Left and below the origin is Quadrant III."
        mistakes: {"Quadrant I": quadrant_signs}
      - prompt: "Which point is NOT in any quadrant?"
        options: ["(5, 0)", "(5, 1)", "(−1, 5)", "(−5, −1)"]
        answer: "(5, 0)"
        difficulty: 2
        hints: ["Look for a 0.", "A point with a 0 coordinate sits on an axis."]
        solution: "(5, 0) has y = 0, so it lies on the x-axis, which belongs to no quadrant."
        mistakes: {"(5, 1)": axis_point_zero}

  - code: cbse9m.coord.plot
    title: Coordinates of a point
    after: [cbse9m.coord.plane]
    notes: |
      A point P is written (x, y): x is the abscissa (distance from the y-axis, signed), y is the ordinate
      (distance from the x-axis, signed). Order matters: (2, 5) ≠ (5, 2). To plot, move x along the x-axis
      first, then y parallel to the y-axis.
    explanations:
      text: "Coordinates are always written (x, y): first how far across, then how far up or down. The first number is called the abscissa and the second the ordinate. (2, 5) and (5, 2) are different points."
      visual: "Walk along the corridor before you take the stairs. Start at the origin, walk x steps right (or left if negative), then climb y steps up (or down if negative). Where you stop is the point."
      step_by_step: "Step 1: Start at the origin. Step 2: Move along the x-axis by the first number. Step 3: From there, move up or down by the second number. Step 4: Mark the point and label it with its coordinates."
      real_world: "In a cinema, 'Row F, Seat 12' finds one seat. Swap them to 'Row 12, Seat F' and you're somewhere else. Coordinates need the same fixed order."
    picture:
      kind: geometry
      axes: true
      range: [-2, 6]
      points:
        O: [0, 0]
        H: [4, 0]
        P(4, 3): [4, 3]
      segments:
      - [O, H, 4 right]
      - [H, 'P(4, 3)', 3 up]
      caption: 'To plot P(4, 3): start at O, go 4 along the x-axis, then 3 up.'
      alt: Coordinate axes. A path goes from the origin O 4 steps right to H, then 3 steps up to the point P(4, 3).
    items:
      - prompt: "What is the abscissa of the point (7, −3)?"
        answer: "7"
        check: "7"
        difficulty: 1
        hints: ["The abscissa is the x-coordinate.", "It's the first number."]
        solution: "The abscissa is the first coordinate, x = 7."
        mistakes: {"-3": swapped_coordinates}
      - prompt: "What is the ordinate of the point (−2, 9)?"
        answer: "9"
        check: "9"
        difficulty: 1
        hints: ["The ordinate is the y-coordinate.", "It's the second number."]
        solution: "The ordinate is the second coordinate, y = 9."
        mistakes: {"-2": swapped_coordinates}
      - prompt: "A point is 4 units to the left of the y-axis and 1 unit above the x-axis. What are its coordinates?"
        options: ["(−4, 1)", "(4, 1)", "(1, −4)", "(−1, 4)"]
        answer: "(−4, 1)"
        difficulty: 2
        hints: ["Left of the y-axis means x is negative.", "Above the x-axis means y is positive."]
        solution: "Step 1: Left 4 gives x = −4. Step 2: Up 1 gives y = 1. Step 3: The point is (−4, 1)."
        mistakes: {"(1, −4)": swapped_coordinates}
      - prompt: "How far is the point (−5, 3) from the y-axis?"
        answer: "5"
        check: "abs(-5)"
        difficulty: 2
        hints: ["Distance from the y-axis is given by x.", "Distance is never negative."]
        solution: "Step 1: Distance from the y-axis is the size of x. Step 2: |−5| = 5 units."
        mistakes: {"-5": negative_distance, "3": swapped_coordinates}
      - prompt: "A point lies on the x-axis, 6 units to the left of the origin. What is its ordinate?"
        answer: "0"
        check: "0"
        difficulty: 2
        hints: ["Points on the x-axis have no height.", "The ordinate is y."]
        solution: "A point on the x-axis has y = 0, so its ordinate is 0. The point is (−6, 0)."
        mistakes: {"-6": axis_point_zero}
      - prompt: "The points (0, 0), (4, 0) and (4, 3) are three corners of a rectangle. What is its area in square units?"
        answer: "12"
        check: "4*3"
        difficulty: 3
        hints: ["The fourth corner is (0, 3).", "Length 4, breadth 3."]
        solution: "Step 1: The sides run from x = 0 to 4 (length 4) and y = 0 to 3 (breadth 3). Step 2: Area = 4 × 3 = 12 square units."
        mistakes: {"14": rectangle_area_not_perimeter}
