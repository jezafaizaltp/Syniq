# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 9. Format: content/README.md.
subject: cbse9-math
chapter: 9
title: Propositions and their Converses
tips:
  converse_assumed_true: 'A converse swaps the ''if'' and ''then'' parts. It needs its own proof: a true statement can have a false converse.'
  examples_not_proof: Examples that work don't prove a statement for every case; one counterexample is enough to disprove it.
concepts:
- code: cbse9gm.logic.converse
  title: Propositions and their converses
  notes: |
    A proposition is a statement that is either true or false. Many have the form 'If P, then Q'. Its
    converse is 'If Q, then P'. A true proposition can have a false converse: 'If a number is a multiple of
    4, then it is even' is true, but 'If a number is even, then it is a multiple of 4' is false (6). When
    both a statement and its converse are true we can say 'P if and only if Q' (for example: a triangle has
    two equal sides if and only if it has two equal angles).
  explanations:
    text: '''If it is a square, then it has four equal sides'' is true. Swap the parts and you get the converse: ''If it has four equal sides, then it is a square.'' That is false: a rhombus has four equal sides but need not be a square. So always check a converse separately.'
    visual: 'Draw a big circle labelled ''four equal sides'' and a smaller circle inside it labelled ''squares''. Everything in the small circle is in the big one (the statement is true), but not everything in the big circle is in the small one: the rhombuses sit outside it (the converse is false).'
    step_by_step: 'Step 1: Write the statement as ''If P, then Q''. Step 2: Swap to get ''If Q, then P''. Step 3: Look for a case where Q is true but P is false. Step 4: If you find one, the converse is false; if not, try to prove it.'
    real_world: '''If it is raining, the road is wet'' is true. The converse, ''If the road is wet, it is raining'', is false: a water tanker may have just passed.'
  picture:
    kind: compare
    columns:
    - title: Statement (true)
      points:
      - If a shape is a square,
      - then it has four equal sides.
    - title: Converse (false)
      points:
      - If a shape has four equal sides,
      - then it is a square.
      - 'Counterexample: a rhombus'
    alt: A true statement about squares and its false converse, disproved by a rhombus.
  activity:
    type: sort
    prompt: Is the statement true? And is its converse (swap the 'if' and 'then' parts) true too?
    bins:
    - True, and so is the converse
    - True, but the converse is false
    - The statement is false
    items:
    - label: If a number is a multiple of 4, then it is even.
      bin: True, but the converse is false
      clue: 'Swap it: is every even number a multiple of 4? Try 6.'
      why: True, but 6 is even and not a multiple of 4, so the converse is false.
    - label: If a triangle has two equal sides, it has two equal angles.
      bin: True, and so is the converse
      clue: If a triangle has two equal angles, must two sides be equal?
      why: 'Both are true: a triangle has two equal sides if and only if it has two equal angles.'
    - label: If a quadrilateral is a square, its diagonals are equal.
      bin: True, but the converse is false
      clue: Does any other shape have equal diagonals?
      why: True, but a rectangle has equal diagonals and isn't a square, so the converse is false.
    - label: If x = 3, then x² = 9.
      bin: True, but the converse is false
      clue: If x² = 9, must x be 3? What else squares to 9?
      why: True, but x = −3 also gives x² = 9, so the converse is false.
    - label: If a number ends in 0, it is divisible by 10.
      bin: True, and so is the converse
      clue: Does every multiple of 10 end in 0?
      why: 'Both directions hold: a whole number ends in 0 if and only if 10 divides it.'
    - label: If two angles are vertically opposite, they are equal.
      bin: True, but the converse is false
      clue: Are all equal angles vertically opposite?
      why: True, but two 40° angles in different places are equal without being opposite.
    - label: If a number is even, then it is a multiple of 4.
      bin: The statement is false
      clue: Test it with a small even number.
      why: '6 is even but not a multiple of 4: one counterexample makes it false.'
    - label: If n is odd, then n² is even.
      bin: The statement is false
      clue: Try n = 3.
      why: 3² = 9 is odd, so the statement is false. In fact an odd number squared is always odd.
    - label: If a triangle's sides fit a² + b² = c², it is right-angled.
      bin: True, and so is the converse
      clue: Is this Pythagoras or its converse? Do both hold?
      why: This is the converse of Pythagoras, and it is true, as is Pythagoras itself.
  items:
  - prompt: What is the converse of 'If a number ends in 0, then it is divisible by 5'?
    options:
    - If a number is divisible by 5, then it ends in 0
    - If a number does not end in 0, then it is not divisible by 5
    - If a number ends in 5, then it is divisible by 0
    - A number ends in 0 and is divisible by 5
    answer: If a number is divisible by 5, then it ends in 0
    difficulty: 1
    hints:
    - Swap the 'if' part and the 'then' part.
    - The 'then' part was 'divisible by 5'.
    solution: 'Step 1: P = ends in 0, Q = divisible by 5. Step 2: Converse: if Q then P, ''If a number is divisible by 5, then it ends in 0''.'
  - prompt: Is that converse true?
    options:
    - 'No: 15 is divisible by 5 but ends in 5'
    - Yes, always
    - Yes, for even numbers only
    - It can't be decided
    answer: 'No: 15 is divisible by 5 but ends in 5'
    difficulty: 1
    hints:
    - Think of multiples of 5.
    - 5, 10, 15, 20…
    solution: 'Step 1: 15 is divisible by 5. Step 2: It doesn''t end in 0. So the converse is false.'
    mistakes:
      Yes, always: converse_assumed_true
  - prompt: Which of these is a proposition?
    options:
    - 7 is a prime number
    - Please close the door
    - Is it raining?
    - What a lovely day!
    answer: 7 is a prime number
    difficulty: 1
    hints:
    - A proposition is either true or false.
    - Questions and orders are neither.
    solution: 'Step 1: ''7 is a prime number'' is a statement that is true. Step 2: The others are an order, a question and an exclamation.'
  - prompt: 'Statement: ''If two angles are vertically opposite, they are equal.'' Which is true?'
    options:
    - The statement is true, but its converse is false
    - Both are true
    - Both are false
    - The statement is false, but its converse is true
    answer: The statement is true, but its converse is false
    difficulty: 2
    hints:
    - 'Converse: ''If two angles are equal, they are vertically opposite.'''
    - Two angles of 60° in different triangles are equal.
    solution: 'Step 1: Vertically opposite angles are always equal: true. Step 2: Equal angles need not be vertically opposite (two 60° angles anywhere), so the converse is false.'
    mistakes:
      Both are true: converse_assumed_true
  - prompt: Which pair is true both ways, so we can say 'if and only if'?
    options:
    - A triangle has three equal sides ↔ it has three equal angles
    - A number is even ↔ it is a multiple of 4
    - A shape is a rectangle ↔ it has four right angles and four equal sides
    - x² = 9 ↔ x = 3
    answer: A triangle has three equal sides ↔ it has three equal angles
    difficulty: 3
    hints:
    - Test each converse.
    - x = −3 also gives x² = 9.
    solution: 'Step 1: Equilateral triangles have equal angles, and a triangle with equal angles has equal sides: both true. Step 2: 6 is even but not a multiple of 4; a rectangle need not have equal sides; x² = 9 also when x = −3.'
  - prompt: In Pythagoras' theorem, 'If a triangle is right-angled, then a² + b² = c².' What does the converse say?
    options:
    - If a² + b² = c² for a triangle's sides, then it is right-angled
    - If a triangle is not right-angled, then a² + b² ≠ c²
    - If a² + b² = c², then the triangle is equilateral
    - Every triangle has a² + b² = c²
    answer: If a² + b² = c² for a triangle's sides, then it is right-angled
    difficulty: 2
    hints:
    - Swap the two parts.
    - The converse of Pythagoras is also true.
    solution: 'Step 1: Swap ''right-angled'' and ''a² + b² = c²''. Step 2: This converse is true too: builders use 3, 4, 5 to make right angles.'
- code: cbse9gm.logic.counterexample
  title: Proving and disproving with counterexamples
  after:
  - cbse9gm.logic.converse
  notes: |
    To prove a statement about all numbers or all shapes, examples are not enough: we need a general
    argument (algebra or geometry). To disprove it, one counterexample is enough. Example: 'n² + n + 41 is
    prime for every whole number n' works for n = 0 to 39 but fails at n = 40 (40² + 40 + 41 = 41²). A
    general proof: the sum of two odd numbers is even, because (2a + 1) + (2b + 1) = 2(a + b + 1).
  explanations:
    text: 'Showing that a rule works for 10 numbers doesn''t prove it works for all of them. But to prove a rule wrong you need just one example where it fails: a counterexample. To prove it right, use letters: any odd number is 2a + 1, so two odd numbers add to 2(a + b + 1), always even.'
    visual: 'Draw two rows of dots for 7 and 9, each paired up with one dot left over. Put them together: the two leftover dots pair up with each other. Every dot now has a partner, so the total is even, whichever odd numbers you start with.'
    step_by_step: 'Step 1: Try a few cases to see if the statement seems true. Step 2: Look hard for a case where it fails; one is enough to disprove it. Step 3: If none appears, write a general argument using letters. Step 4: Check the argument covers every case.'
    real_world: '''All swans are white'' was believed in Europe for centuries until black swans were found in Australia: one counterexample ended it.'
  picture:
    kind: flow
    steps:
    - 'Claim: n² + n + 41 is always prime'
    - 'n = 0, 1, 2, … 39: prime every time'
    - 'n = 40: 40² + 40 + 41 = 1681'
    - 1681 = 41 × 41, not prime
    - 'One counterexample: the claim is false'
    alt: The claim that n squared plus n plus 41 is always prime holds up to 39 but fails at 40, which gives 41 squared.
  activity:
    type: sort
    prompt: Does each piece of work prove the claim, only give examples, or disprove it?
    bins:
    - Proves it for every case
    - Only examples
    - Disproves it
    items:
    - label: 'Odd + odd is even: (2a + 1) + (2b + 1) = 2(a + b + 1)'
      bin: Proves it for every case
      clue: Does this cover every odd number, or just some?
      why: 'a and b stand for any whole numbers, so this covers every pair of odd numbers: a proof.'
    - label: 'Odd + odd is even: 3 + 5 = 8 and 7 + 9 = 16'
      bin: Only examples
      clue: Do two cases cover every odd number?
      why: 'Two examples that work can''t show it works for all: they are only evidence.'
    - label: 'n² + n + 41 is always prime: n = 40 gives 41 × 41'
      bin: Disproves it
      clue: Is 41 × 41 prime?
      why: 'One case that fails is enough: n = 40 gives 1681 = 41², not prime.'
    - label: 'n² + n + 41 is always prime: it works for n = 0 to 39'
      bin: Only examples
      clue: Is 40 cases the same as every case?
      why: 40 cases are still only examples, and the claim fails at n = 40.
    - label: 'Every prime is odd: 2 is prime and even'
      bin: Disproves it
      clue: Is 2 prime? Is it odd?
      why: 2 is a prime that is even, so one counterexample shows the claim is false.
    - label: 'n² is never less than n: try n = ½'
      bin: Disproves it
      clue: Work out (½)². Is it less than ½?
      why: (½)² = ¼, which is less than ½, so the claim fails.
    - label: 'A triangle''s angles add to 180°: I measured 20 triangles'
      bin: Only examples
      clue: Could triangle 21 be different?
      why: Measuring many is still examples, and measurements are rough. A proof uses parallel lines.
    - label: 'Angle sum 180°: a parallel line through a corner shows it'
      bin: Proves it for every case
      clue: Does this argument work for any triangle?
      why: It uses only facts true for every triangle, so it is a proof.
  items:
  - prompt: How many counterexamples do you need to show a statement about all numbers is false?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - If it fails even once, it isn't true for all.
    - The smallest whole number above 0.
    solution: 'Step 1: ''For all numbers'' means no exceptions. Step 2: One exception, one counterexample, is enough.'
  - prompt: Which number is a counterexample to 'Every odd number is prime'?
    options:
    - '9'
    - '7'
    - '3'
    - '2'
    answer: '9'
    difficulty: 1
    hints:
    - Find an odd number that is not prime.
    - 3 × 3.
    solution: 'Step 1: 9 is odd. Step 2: 9 = 3 × 3, so it is not prime. That disproves the statement.'
  - prompt: Ravi checks that 'n² + n + 41 is prime' for n = 0 to 10 and says it is always prime. What is wrong?
    options:
    - Examples can't prove it for every n; in fact n = 40 gives 41²
    - Nothing, 11 examples is enough
    - He should check n = 0 to 20 only
    - Primes can't be tested with formulas
    answer: Examples can't prove it for every n; in fact n = 40 gives 41²
    difficulty: 2
    hints:
    - Can a finite list cover every number?
    - Try n = 40.
    solution: 'Step 1: Examples only show it works for those n. Step 2: At n = 40, 40² + 40 + 41 = 1681 = 41², not prime.'
    mistakes:
      Nothing, 11 examples is enough: examples_not_proof
  - prompt: An odd number can be written as 2a + 1. Adding two odd numbers gives 2a + 1 + 2b + 1. Which form shows the sum is even?
    options:
    - 2(a + b + 1)
    - 2a + 2b + 1
    - a + b + 2
    - 2(a + b) + 1
    answer: 2(a + b + 1)
    check: 2*a + 1 + 2*b + 1
    difficulty: 2
    hints:
    - 'Collect: 2a + 2b + 2.'
    - Take out the 2.
    solution: 'Step 1: 2a + 1 + 2b + 1 = 2a + 2b + 2. Step 2: = 2(a + b + 1), a multiple of 2, so it is even.'
  - prompt: Which is a counterexample to 'The square of any number is bigger than the number'?
    options:
    - 1/2
    - '3'
    - '10'
    - −4
    answer: 1/2
    difficulty: 2
    hints:
    - Try a number between 0 and 1.
    - (1/2)² = 1/4.
    solution: 'Step 1: (1/2)² = 1/4. Step 2: 1/4 is less than 1/2, so the statement fails.'
  - prompt: 'Prove or disprove: ''The product of two consecutive whole numbers is always even.'' Which is right?'
    options:
    - 'True: one of any two consecutive numbers is even, so the product is even'
    - 'False: 3 × 5 = 15'
    - True only for numbers below 10
    - 'False: 0 × 1 = 0'
    answer: 'True: one of any two consecutive numbers is even, so the product is even'
    difficulty: 3
    hints:
    - 3 and 5 are not consecutive.
    - Consecutive numbers alternate odd, even.
    solution: 'Step 1: Of n and n + 1, one is even. Step 2: An even number times anything is even. So the statement is true (and 0 is even too).'
