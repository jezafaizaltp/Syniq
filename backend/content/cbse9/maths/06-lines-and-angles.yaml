# CBSE Class 9 Mathematics (NCERT), chapter 6. Format: content/README.md.
subject: cbse9-math
chapter: 6
title: Lines and Angles

tips:
  complement_vs_supplement: "Complementary angles add to 90°. Supplementary angles add to 180°. 'C' comes before 'S', and 90 before 180."
  vertical_equal: "Vertically opposite angles are equal, not supplementary. The angles next to each other make the linear pair."
  cointerior_supplementary: "Co-interior (same-side interior) angles add to 180°. Alternate and corresponding angles are equal."

concepts:
  - code: cbse9m.angles.pairs
    title: Pairs of angles
    notes: |
      Acute (< 90°), right (90°), obtuse (90°–180°), straight (180°), reflex (180°–360°). Complementary sum
      90°, supplementary sum 180°. Adjacent angles share a vertex and an arm. A linear pair is two adjacent
      angles on a straight line: sum 180° (axiom). When two lines intersect, vertically opposite angles are
      equal (theorem).
    explanations:
      text: "Angles on a straight line add up to 180°, so if one is 70° the other is 110°: that's a linear pair. When two lines cross they make an X. The angles opposite each other in the X, called vertically opposite angles, are always equal."
      visual: "Draw an X. Shade the top and bottom angles in one colour and the left and right ones in another. Same colour means equal angles. Any two angles side by side along one line add to 180°."
      step_by_step: "Step 1: Do the angles sit side by side on a straight line? They add to 180°. Step 2: Are they opposite each other at a crossing? They are equal. Step 3: Do they make a right angle together? They add to 90°. Step 4: Write the equation and solve."
      real_world: "Open a pair of scissors. The angle between the blades equals the angle between the handles: vertically opposite angles. Open them wider and both grow together."
    items:
      - prompt: "Find the complement of 35°. Type the number of degrees."
        answer: "55"
        check: "90 - 35"
        difficulty: 1
        hints: ["Complementary angles add to 90°.", "90 − 35."]
        solution: "Step 1: Complement = 90° − 35°. Step 2: = 55°."
        mistakes: {"145": complement_vs_supplement}
      - prompt: "Find the supplement of 112°. Type the number of degrees."
        answer: "68"
        check: "180 - 112"
        difficulty: 1
        hints: ["Supplementary angles add to 180°.", "180 − 112."]
        solution: "Step 1: Supplement = 180° − 112°. Step 2: = 68°."
      - prompt: "Two angles form a linear pair. One is 3 times the other. Find the smaller angle in degrees."
        answer: "45"
        check: "180/4"
        difficulty: 2
        hints: ["x + 3x = 180.", "4x = 180."]
        solution: "Step 1: x + 3x = 180°. Step 2: 4x = 180°, so x = 45°. The angles are 45° and 135°."
        mistakes: {"60": complement_vs_supplement}
      - prompt: "Two lines cross. One angle is 40°. What is the angle vertically opposite to it?"
        answer: "40"
        check: "40"
        difficulty: 1
        hints: ["Vertically opposite angles are equal.", "No working needed."]
        solution: "Vertically opposite angles are equal, so it is 40°."
        mistakes: {"140": vertical_equal}
      - prompt: "Two lines cross. One angle is 40°. What is an angle next to it (adjacent)?"
        answer: "140"
        check: "180 - 40"
        difficulty: 2
        hints: ["Adjacent angles at a crossing make a linear pair.", "180 − 40."]
        solution: "Adjacent angles on a line add to 180°, so it is 180° − 40° = 140°."
        mistakes: {"40": vertical_equal}
      - prompt: "Angles (2x + 10)° and (3x − 20)° are vertically opposite. Find x."
        answer: "30"
        check: "30"
        difficulty: 3
        hints: ["Vertically opposite angles are equal.", "2x + 10 = 3x − 20."]
        solution: "Step 1: 2x + 10 = 3x − 20. Step 2: 30 = x. Step 3: Each angle is 70°."
      - prompt: "An angle of 250° is called…"
        options: ["Reflex", "Obtuse", "Straight", "Acute"]
        answer: "Reflex"
        difficulty: 1
        hints: ["It's bigger than 180°.", "Less than 360°."]
        solution: "Angles between 180° and 360° are reflex angles."

  - code: cbse9m.angles.parallel
    title: Parallel lines and a transversal
    after: [cbse9m.angles.pairs]
    notes: |
      A transversal cuts two lines at distinct points, forming corresponding, alternate interior, alternate
      exterior and co-interior (same-side interior) angles. If the lines are parallel: corresponding angles
      are equal (axiom), alternate interior angles are equal, co-interior angles sum to 180°. Conversely,
      any of these conditions shows the lines are parallel. Lines parallel to the same line are parallel.
    explanations:
      text: "When a line cuts across two parallel lines, the same pattern of angles appears at both crossings. Matching positions (corresponding angles) are equal. The Z-shape angles (alternate angles) are equal. The angles inside on the same side (co-interior) add to 180°."
      visual: "Look for letters. An F shape shows corresponding angles: equal. A Z shape shows alternate angles: equal. A C or U shape shows co-interior angles: they add to 180°."
      step_by_step: "Step 1: Mark the two angles you're comparing. Step 2: Trace the shape they make: F, Z or C. Step 3: F or Z means equal; C means they add to 180°. Step 4: Write the equation and solve."
      real_world: "A ladder's side rails are parallel and each rung is a transversal. The angle a rung makes with the left rail at the top matches the angle at every other rung, which is why the rungs all look the same."
    items:
      - prompt: "Two parallel lines are cut by a transversal. A corresponding angle is 65°. What is the matching corresponding angle?"
        answer: "65"
        check: "65"
        difficulty: 1
        hints: ["Corresponding angles are in matching positions.", "With parallel lines they are equal."]
        solution: "Corresponding angles are equal when the lines are parallel, so 65°."
      - prompt: "Two parallel lines are cut by a transversal. One alternate interior angle is 72°. What is the other?"
        answer: "72"
        check: "72"
        difficulty: 1
        hints: ["Alternate angles make a Z.", "They are equal."]
        solution: "Alternate interior angles are equal, so 72°."
        mistakes: {"108": cointerior_supplementary}
      - prompt: "Two parallel lines are cut by a transversal. One co-interior angle is 72°. What is the other?"
        answer: "108"
        check: "180 - 72"
        difficulty: 2
        hints: ["Co-interior angles make a C shape.", "They add to 180°."]
        solution: "Step 1: Co-interior angles add to 180°. Step 2: 180° − 72° = 108°."
        mistakes: {"72": cointerior_supplementary}
      - prompt: "A transversal cuts two lines. The co-interior angles are 95° and 85°. Are the lines parallel?"
        options: ["Yes, because 95° + 85° = 180°", "No, because the angles are different", "Only if the angles were equal", "Can't tell"]
        answer: "Yes, because 95° + 85° = 180°"
        difficulty: 2
        hints: ["What should co-interior angles add to for parallel lines?", "95 + 85 = ?"]
        solution: "Co-interior angles adding to 180° means the lines are parallel."
        mistakes: {"Only if the angles were equal": cointerior_supplementary}
      - prompt: "AB ∥ CD and a transversal makes co-interior angles (2x)° and (x + 30)°. Find x."
        answer: "50"
        check: "150/3"
        difficulty: 3
        hints: ["Co-interior angles add to 180°.", "3x + 30 = 180."]
        solution: "Step 1: 2x + x + 30 = 180. Step 2: 3x = 150. Step 3: x = 50."
      - prompt: "Line l ∥ m and m ∥ n. What can you say about l and n?"
        options: ["l ∥ n", "l is perpendicular to n", "l and n meet at one point", "Nothing"]
        answer: "l ∥ n"
        difficulty: 2
        hints: ["Lines parallel to the same line…", "…are parallel to each other."]
        solution: "Lines that are parallel to the same line are parallel to each other, so l ∥ n."
