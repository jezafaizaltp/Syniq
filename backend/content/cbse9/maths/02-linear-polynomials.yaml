# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 2. Format: content/README.md.
subject: cbse9-math
chapter: 2
title: Introduction to Linear Polynomials
tips:
  exponent_multiply_instead_add: 'When you multiply powers of the same base, add the exponents: a^m × a^n = a^(m + n).'
  degree_count_terms: The degree is the highest power of the variable, not the number of terms.
  zero_sign_flip: 'A zero makes the polynomial equal 0. For x − a the zero is +a: put it back in to check.'
  slope_rise_run_swap: 'Slope is how much y changes for each 1 step in x: change in y ÷ change in x, not the other way round.'
  intercept_is_coefficient: In y = ax + b the number on its own, b, is where the line crosses the y-axis; a is the slope.
  growth_vs_decay: If the amount goes up by the same step each time, a is positive (growth); if it goes down, a is negative (decay).
  constant_degree: "A plain number is the number times x⁰. What power of x is that?"
  empty_means_zero: "Empty means the amount left is 0. Set the expression equal to 0 and solve for x."
  fixed_plus_rate: "The fixed charge is paid once; the per-km charge is multiplied by the distance. Do the multiplying, then add the fixed part."
  linear_same_gap: "A linear table goes up by the same amount every step. Find the gaps between the y-values and see which stay equal."
  negative_cube: "(−1)³ = −1 × −1 × −1. Count the minus signs: an odd number of them leaves the answer negative."
  parallel_same_slope: "Parallel lines climb at the same rate: their x-coefficients (slopes) are equal. The number on its own can differ."
  poly_name_parts: "Two separate checks: the highest power names the degree (linear, quadratic, cubic), and the number of terms names it binomial or trinomial."
  polynomial_whole_powers: "In a polynomial every power of x is a whole number 0, 1, 2, … Rewrite 1/x and √x as powers and look."
  slope_negative_down: "A negative slope means y goes DOWN as x goes up. Multiply the slope by x and add it to the starting value."
  square_root_two_signs: "x² = 9 has two answers: a positive one and a negative one, because a negative times itself is positive too."
  start_height: "The plant starts at 4 cm, so only the growth beyond that comes from the daily 0.5 cm. Take the start away first, then divide."
  step_back_to_zero: "Find how much y changes for each step in x, then walk back from x = 1 to x = 0."
  sub_every_term: "Replace every x with the number in brackets, do the powers first, then the multiplying, then add and subtract."
  x_axis_y_zero: "A line crosses the x-axis where y = 0. Put 0 for y and solve."
  c9m2_highest_not_first: The degree is the highest power anywhere in the polynomial, not the power of the first term written. Scan every term.
  c9m2_rate_is_slope: In a linear rule the number multiplying x is how much changes each step; the number on its own is where you start. Which one does the question ask for?
concepts:
- code: cbse9gm.poly.degree
  title: Polynomials and their degree
  notes: |
    A polynomial in one variable x is a sum of terms a·xⁿ with whole-number powers. Its degree is the highest
    power with a non-zero coefficient. Linear (degree 1), quadratic (2) and cubic (3) polynomials;
    monomials, binomials and trinomials by number of terms. A non-zero constant has degree 0. Expressions
    with √x or 1/x are not polynomials.
  explanations:
    text: 'A polynomial is made of terms like 3x², −5x and 7, where x is only raised to whole-number powers. Its degree is the highest power of x: 4x³ − x + 2 has degree 3, so it is a cubic. 1/x and √x are not allowed, so x + 1/x is not a polynomial.'
    visual: 'Line the terms up from the highest power to the lowest: 4x³ + 0x² − x + 2. The first term with a non-zero number in front tells you the degree. Count the terms to name it: one term is a monomial, two a binomial, three a trinomial.'
    step_by_step: 'Step 1: Check every power of x is a whole number (0, 1, 2, …). If not, it''s not a polynomial. Step 2: Find the highest power with a non-zero coefficient: that''s the degree. Step 3: Degree 1 is linear, 2 quadratic, 3 cubic. Step 4: Count the terms to say monomial, binomial or trinomial.'
    real_world: 'The area of a square of side x is x², a quadratic. The volume of a cube of side x is x³, a cubic. The perimeter of the square, 4x, is linear: double the side and it only doubles.'
  picture:
    kind: flow
    steps:
    - 'Highest power first: 4x³ + 0x² − x + 2'
    - 'First term that isn''t zero: 4x³'
    - Its power is 3, so the degree is 3 (cubic)
    - 'Count the non-zero terms: 3, so it is a trinomial'
    alt: 'Steps finding the degree of 4x³ − x + 2: write powers from highest, the first non-zero term is 4x³, so the degree is 3.'
  activity:
    type: sort
    prompt: What is the degree of each one? Or is it not a polynomial at all?
    bins:
    - Degree 1
    - Degree 2
    - Degree 3
    - Not a polynomial
    items:
    - label: 3x + 7
      bin: Degree 1
      clue: What is the highest power of x you can see?
      why: 'The highest power is x¹: degree 1, a linear polynomial.'
    - label: x² − 5x + 6
      bin: Degree 2
      clue: Look for the biggest little number on x.
      why: 'The highest power is x²: degree 2, quadratic.'
    - label: 2x³ + x
      bin: Degree 3
      clue: Which power of x is the highest?
      why: 'x³ is the highest power: degree 3, cubic.'
    - label: √x + 1
      bin: Not a polynomial
      clue: Is the power on x a whole number here?
      why: √x is x to the power ½. Polynomial powers must be whole numbers.
    - label: 1/x + 2
      bin: Not a polynomial
      clue: Can you write 1/x as x to a whole-number power?
      why: 1/x is x⁻¹, a negative power, so it is not a polynomial.
    - label: x(x + 1)
      bin: Degree 2
      clue: Multiply it out first. What is the highest power then?
      why: 'x(x + 1) = x² + x: degree 2.'
    - label: 7x² + x³
      bin: Degree 3
      clue: Which power is the highest, not which comes first?
      why: 'The highest power is x³, even though it is written last: degree 3.'
    - label: x³ − x³ + 2x
      bin: Degree 1
      clue: What do the two x³ terms do to each other?
      why: 'x³ − x³ = 0, which leaves 2x: degree 1.'
    - label: 5 − 4x
      bin: Degree 1
      clue: Does the order of the terms change the degree?
      why: 'The x term has power 1: degree 1, written backwards.'
  lesson:
    - teach: 'A polynomial is built from terms like 4x³, −2x and 7: a number times a whole-number power of x. The number in front is the coefficient. Expressions with √x, 1/x or x^½ are not polynomials, because those powers are not whole numbers.'
      check:
        prompt: Which of these is NOT a polynomial?
        options:
        - x + 1/x
        - x² + 1
        - '7'
        answer: x + 1/x
        why: 1/x is x to the power −1, not a whole-number power.
    - teach: The degree of a polynomial is its highest power of x (with a non-zero coefficient). 3x − 5 has degree 1 (linear), x² + 2x has degree 2 (quadratic), 2x³ − x has degree 3 (cubic). A plain number like 9 has degree 0.
      picture:
        kind: compare
        columns:
        - title: Name by degree
          points:
          - 'Degree 0: constant, 9'
          - 'Degree 1: linear, 3x − 5'
          - 'Degree 2: quadratic, x² + 2x'
          - 'Degree 3: cubic, 2x³ − x'
        - title: Name by number of terms
          points:
          - '1 term: monomial, 5x²'
          - '2 terms: binomial, x + 4'
          - '3 terms: trinomial, x² + x + 1'
        alt: 'Two ways to name a polynomial: by its highest power and by how many terms it has.'
      check:
        prompt: What is the degree of 7 − x + 4x²?
        options:
        - '2'
        - '1'
        - '0'
        answer: '2'
        why: The highest power is x², even though it is written last.
    - teach: 'We also name a polynomial by how many terms it has: one term is a monomial, two a binomial, three a trinomial. So 3y² + 5y is a quadratic binomial: degree 2, two terms.'
      check:
        prompt: What kind of polynomial is x³ − 1?
        options:
        - Cubic binomial
        - Linear binomial
        - Cubic trinomial
        answer: Cubic binomial
        why: Highest power 3 (cubic) and two terms (binomial).
  items:
  - prompt: What is the degree of 5x³ − 2x² + x − 7?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Look for the highest power of x.
    - x³ is the highest.
    solution: 'Step 1: The powers are 3, 2, 1 and 0. Step 2: The highest is 3, so the degree is 3.'
    mistakes:
      '4': degree_count_terms
  - prompt: Which of these is a polynomial?
    options:
    - x² − 3x + 2
    - x + 1/x
    - √x + 4
    - x^(−2) + 1
    answer: x² − 3x + 2
    difficulty: 1
    hints:
    - Every power of x must be a whole number.
    - 1/x = x^(−1) and √x = x^(1/2).
    solution: 'Step 1: 1/x, √x and x^(−2) have powers −1, 1/2 and −2. Step 2: Only x² − 3x + 2 has whole-number powers.'
    mistakes: {"x + 1/x": "polynomial_whole_powers", "√x + 4": "polynomial_whole_powers"}
  - prompt: What kind of polynomial is 3y² + 5y?
    options:
    - Quadratic binomial
    - Linear binomial
    - Cubic trinomial
    - Quadratic trinomial
    answer: Quadratic binomial
    difficulty: 1
    hints:
    - Highest power gives the degree.
    - Count the terms.
    solution: 'Step 1: The highest power is 2, so it is quadratic. Step 2: It has 2 terms, so it is a binomial.'
    mistakes: {"Quadratic trinomial": "poly_name_parts", "Linear binomial": "poly_name_parts"}
  - prompt: What is the coefficient of x² in 2 − x² + 4x³?
    answer: '-1'
    check: '-1'
    difficulty: 2
    hints:
    - The coefficient is the number multiplied by x².
    - −x² means −1 × x².
    solution: 'Step 1: The x² term is −x². Step 2: −x² = −1 × x², so the coefficient is −1.'
    mistakes:
      '1': zero_sign_flip
  - prompt: What is the degree of the polynomial 9 (a constant)?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - 9 = 9x⁰.
    - Any number to the power 0 is 1.
    solution: 'Step 1: 9 = 9 × x⁰. Step 2: The power is 0, so the degree is 0.'
    mistakes: {"1": "constant_degree", "9": "constant_degree"}
  - prompt: What is the degree of (x² + 1)(x³ − 2)?
    answer: '5'
    check: 2 + 3
    difficulty: 3
    hints:
    - Multiply the highest terms only.
    - x² × x³ = ?
    solution: 'Step 1: The highest-power term is x² × x³ = x⁵. Step 2: So the degree is 5.'
    mistakes:
      '6': exponent_multiply_instead_add
  - prompt: What is the degree of 4x − 9?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Find the highest power of x.
    - x on its own means x¹.
    solution: 'The highest power is x¹, so the degree is 1: a linear polynomial.'
    mistakes:
      '2': degree_count_terms
      '0': constant_degree
  - prompt: What is the coefficient of x in 6x² − 5x + 1?
    answer: '-5'
    check: '-5'
    difficulty: 1
    hints:
    - Look at the term with x¹.
    - Keep its sign.
    solution: The x-term is −5x, so the coefficient is −5.
    mistakes:
      '5': poly_name_parts
      '6': poly_name_parts
  - prompt: Which of these is NOT a polynomial?
    options:
    - √x + 2
    - x² − 2
    - 3x
    - '5'
    answer: √x + 2
    difficulty: 1
    hints:
    - Every power must be a whole number.
    - √x is x to the power ½.
    solution: √x = x^½, and ½ is not a whole number, so √x + 2 is not a polynomial. 5 is a constant polynomial.
    mistakes:
      '5': constant_degree
  - prompt: What is the degree of 2 + 3x − x⁴ + x²?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Look at every term, not just the first.
    - Which power is largest?
    solution: The powers are 0, 1, 4 and 2. The highest is 4, so the degree is 4.
    mistakes:
      '0': c9m2_highest_not_first
      '2': c9m2_highest_not_first
  - prompt: What kind of polynomial is 8x?
    options:
    - Linear monomial
    - Linear binomial
    - Quadratic monomial
    - Constant
    answer: Linear monomial
    difficulty: 2
    hints:
    - Count the terms.
    - Find the power of x.
    solution: 'One term (monomial) and power 1 (linear): a linear monomial.'
    mistakes:
      Linear binomial: degree_count_terms
  - prompt: What is the constant term of x³ − 4x + 11?
    answer: '11'
    check: '11'
    difficulty: 2
    hints:
    - The constant term has no x.
    - It is the number on its own.
    solution: The term without x is 11.
    mistakes:
      '-4': poly_name_parts
      '3': poly_name_parts
  - prompt: Which polynomial has degree 3 and exactly two terms?
    options:
    - x³ + 7
    - x³ + x + 1
    - 3x + 7
    - x² + 3
    answer: x³ + 7
    difficulty: 2
    hints:
    - Degree 3 means x³ is the highest power.
    - 'Two terms: a binomial.'
    solution: x³ + 7 has highest power 3 and two terms. x³ + x + 1 has three terms.
    mistakes:
      3x + 7: c9m2_highest_not_first
      x³ + x + 1: degree_count_terms
  - prompt: What is the degree of (x + 2)(x − 5)?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Multiply out the first terms of each bracket.
    - x × x = x².
    solution: (x + 2)(x − 5) = x² − 3x − 10, so the degree is 2.
    mistakes:
      '1': exponent_multiply_instead_add
      '4': degree_count_terms
  - prompt: If p(x) = 3x² + kx³ − 1 has degree 2, what must k be?
    answer: '0'
    check: '0'
    difficulty: 3
    hints:
    - If k were not 0, which power would be highest?
    - The x³ term must vanish.
    solution: For the degree to be 2, the x³ term must disappear, so its coefficient k = 0.
    mistakes:
      '3': c9m2_highest_not_first
      '1': c9m2_highest_not_first
- code: cbse9gm.poly.zeroes
  title: Values and zeroes of a polynomial
  after:
  - cbse9gm.poly.degree
  notes: |
    p(a) is the value of p(x) at x = a. A zero of p(x) is a number c with p(c) = 0. A linear polynomial
    ax + b has exactly one zero, −b/a. A non-zero constant polynomial has no zero. A polynomial can have
    more than one zero, e.g. x² − 1 has zeroes 1 and −1.
  explanations:
    text: 'To find p(2), put 2 in place of x everywhere and work it out. A zero of the polynomial is a value of x that makes the whole thing 0. For 2x − 6, set 2x − 6 = 0: x = 3, so 3 is its zero.'
    visual: Think of the polynomial as a machine. Feed in a number for x and a value comes out. A zero is a number that makes the machine print 0. For x² − 4, feeding in 2 or −2 both print 0.
    step_by_step: 'Step 1: To find p(a), replace every x with (a), in brackets. Step 2: Do powers, then multiplication, then addition and subtraction. Step 3: To find the zero of ax + b, solve ax + b = 0. Step 4: x = −b/a. Step 5: Check by putting it back in: you should get 0.'
    real_world: 'A shop''s profit is p(x) = 20x − 500 rupees for x items sold. The zero, x = 25, is the break-even point: sell 25 items and you''ve earned back the ₹500 you spent.'
  picture:
    kind: number_line
    from: -4
    to: 4
    step: 1
    points:
    - at: -2
      label: p(−2) = 0
    - at: 0
      label: p(0) = −4
    - at: 2
      label: p(2) = 0
    caption: 'For p(x) = x² − 4, the zeroes are −2 and 2: they make the value 0.'
    alt: A number line from −4 to 4. At −2 and at 2, p(x) = x² − 4 equals 0, so they are the zeroes. At 0 the value is −4.
  activity:
    type: formula
    prompt: Move x and watch the values of two polynomials.
    inputs:
    - name: x
      label: x
      min: -6
      max: 6
      step: 0.5
      start: 0
    outputs:
    - name: p
      label: p(x) = 2x − 6
      expr: 2*x-6
    - name: q
      label: q(x) = x² − 1
      expr: x^2-1
    goals:
    - prompt: 'Find the zero of p(x) = 2x − 6: the x that makes p(x) = 0.'
      want:
        p: 0
      hint: p(x) = 0 means 2x − 6 = 0. What must 2x be?
      mistakes:
      - when:
          x: -3
        say: 'p(−3) = −12. The −6 has to be cancelled by +6, so 2x must be positive 6: the sign flips when −6 moves across.'
      - when:
          x: 6
        say: 'p(6) = 6, not 0. You read off the 6, but the x is doubled first: 2x has to equal 6.'
    - prompt: q(x) = x² − 1 has two zeroes. Find the negative one.
      want:
        q: 0
        x:
        - -6
        - -0.5
      mistakes:
      - when:
          x: 1
        say: q(1) = 0 too, but that's the positive zero. Which other number also squares to 1?
      - when:
          x: -1.5
        say: 'q(−1.5) = 1.25: (−1.5)² is positive and bigger than 1. Come a little closer to 0.'
    - prompt: Make p(x) equal −10.
      want:
        p: -10
      mistakes:
      - when:
          x: -5
        say: 'p(−5) = −16: that makes 2x = −10, but the −6 is still there. 2x − 6 = −10 means 2x = −4.'
      - when:
          x: 2
        say: p(2) = −2. To reach −10, 2x has to be negative.
  lesson:
    - teach: 'p(a) means: put x = a into the polynomial and work it out. For p(x) = x² + 2x, p(3) = 9 + 6 = 15. Replace every x, and be careful with negatives: p(−1) = 1 − 2 = −1.'
      check:
        prompt: If p(x) = 2x + 7, what is p(−3)?
        options:
        - '1'
        - '13'
        - −1
        answer: '1'
        why: 2 × (−3) + 7 = −6 + 7 = 1.
    - teach: 'A zero of p(x) is a number c that makes p(c) = 0. It is where the graph of y = p(x) touches the x-axis. For 2x − 8: set 2x − 8 = 0, so x = 4. Check: 2 × 4 − 8 = 0.'
      picture:
        kind: geometry
        axes: true
        range:
        - -6
        - 6
        points:
          (4, 0):
          - 4
          - 0
          _a:
          - 1
          - -6
          _b:
          - 5
          - 2
        segments:
        - - _a
          - _b
          - y = 2x − 8
        caption: The line meets the x-axis at x = 4, the zero of 2x − 8.
        alt: The line y = 2x − 8 crossing the x-axis at the point (4, 0).
      check:
        prompt: What is the zero of x − 6?
        options:
        - '6'
        - −6
        - '0'
        answer: '6'
        why: 6 − 6 = 0, so x = 6 is the zero.
    - teach: 'A linear polynomial ax + b has exactly one zero, x = −b/a. Watch the sign: the zero of x + 5 is −5. A polynomial of higher degree can have more zeroes: x² − 4 has zeroes 2 and −2.'
      check:
        prompt: What is the zero of 4x + 2?
        options:
        - −1/2
        - 1/2
        - −2
        answer: −1/2
        why: 4x + 2 = 0 gives x = −2/4 = −1/2.
  items:
  - prompt: If p(x) = x² − 3x + 2, find p(4).
    answer: '6'
    check: 4^2 - 3*4 + 2
    difficulty: 1
    hints:
    - Put 4 in place of x.
    - 16 − 12 + 2.
    solution: 'Step 1: p(4) = 4² − 3 × 4 + 2. Step 2: = 16 − 12 + 2 = 6.'
    mistakes: {"30": "sub_every_term", "-2": "sub_every_term"}
  - prompt: Find the zero of p(x) = 2x − 6.
    answer: '3'
    check: 6/2
    difficulty: 1
    hints:
    - Set 2x − 6 = 0.
    - 2x = 6.
    solution: 'Step 1: 2x − 6 = 0. Step 2: 2x = 6, so x = 3. Step 3: Check: p(3) = 6 − 6 = 0.'
    mistakes:
      '-3': zero_sign_flip
  - prompt: Find the zero of p(x) = x + 5.
    answer: '-5'
    check: '-5'
    difficulty: 1
    hints:
    - Set x + 5 = 0.
    - Take 5 to the other side.
    solution: 'Step 1: x + 5 = 0. Step 2: x = −5. Step 3: Check: −5 + 5 = 0.'
    mistakes:
      '5': zero_sign_flip
  - prompt: If p(x) = 3x³ − x + 1, find p(−1).
    answer: '-1'
    check: 3*(-1)^3 - (-1) + 1
    difficulty: 2
    hints:
    - (−1)³ = −1.
    - 3 × (−1) − (−1) + 1.
    solution: 'Step 1: p(−1) = 3(−1)³ − (−1) + 1. Step 2: = −3 + 1 + 1 = −1.'
    mistakes: {"3": "negative_cube", "-3": "minus_negative"}
  - prompt: Find the zero of p(x) = 3x + 2. Type a fraction like −2/3.
    answer: -2/3
    check: -2/3
    difficulty: 2
    hints:
    - Set 3x + 2 = 0.
    - 3x = −2.
    solution: 'Step 1: 3x + 2 = 0. Step 2: 3x = −2. Step 3: x = −2/3.'
    mistakes:
      2/3: zero_sign_flip
  - prompt: Which numbers are zeroes of x² − 9?
    options:
    - 3 and −3
    - 9 and −9
    - Only 3
    - 0 and 9
    answer: 3 and −3
    difficulty: 2
    hints:
    - Set x² − 9 = 0, so x² = 9.
    - Both 3² and (−3)² are 9.
    solution: 'Step 1: x² − 9 = 0 means x² = 9. Step 2: x = 3 or x = −3.'
    mistakes: {"Only 3": "square_root_two_signs", "9 and −9": "square_root_two_signs"}
  - prompt: If p(x) = kx − 4 and p(2) = 0, what is k?
    answer: '2'
    check: 4/2
    difficulty: 3
    hints:
    - Put x = 2 and set the result to 0.
    - 2k − 4 = 0.
    solution: 'Step 1: p(2) = 2k − 4 = 0. Step 2: 2k = 4, so k = 2.'
    mistakes: {"-2": "zero_sign_flip", "8": "sub_every_term"}
  - prompt: If p(x) = 5x − 3, find p(2).
    answer: '7'
    check: 5*2 - 3
    difficulty: 1
    hints:
    - Replace x by 2.
    - 5 × 2 − 3.
    solution: p(2) = 10 − 3 = 7.
    mistakes:
      '13': sub_every_term
  - prompt: Find the zero of p(x) = x − 9.
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - Set x − 9 = 0.
    - Add 9 to both sides.
    solution: x − 9 = 0 gives x = 9.
    mistakes:
      '-9': zero_sign_flip
  - prompt: If p(x) = x² + x + 1, find p(0).
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Every x becomes 0.
    - Only the constant is left.
    solution: p(0) = 0 + 0 + 1 = 1.
    mistakes:
      '0': empty_means_zero
  - prompt: Find the zero of p(x) = 5x + 20.
    answer: '-4'
    check: -20/5
    difficulty: 2
    hints:
    - Set 5x + 20 = 0.
    - 5x = −20.
    solution: 5x = −20, so x = −4.
    mistakes:
      '4': zero_sign_flip
      '-20': step_back_to_zero
  - prompt: If p(x) = x² − 2x, find p(−2).
    answer: '8'
    check: (-2)**2 - 2*(-2)
    difficulty: 2
    hints:
    - (−2)² = 4.
    - −2 × (−2) = +4.
    solution: p(−2) = 4 − 2(−2) = 4 + 4 = 8.
    mistakes:
      '0': negative_cube
      '-8': negative_cube
  - prompt: Which numbers are zeroes of x² − 16?
    options:
    - 4 and −4
    - 4 only
    - 16 and −16
    - 8 and −8
    answer: 4 and −4
    difficulty: 2
    hints:
    - x² = 16.
    - Both a positive and a negative number square to 16.
    solution: x² = 16 gives x = 4 or x = −4. Both make x² − 16 = 0.
    mistakes:
      4 only: square_root_two_signs
      8 and −8: square_root_two_signs
  - prompt: Is x = 2 a zero of p(x) = x³ − 8?
    options:
    - 'Yes'
    - 'No'
    - Only if x is negative
    answer: 'Yes'
    difficulty: 2
    hints:
    - Work out p(2).
    - 2³ = 8.
    solution: p(2) = 8 − 8 = 0, so 2 is a zero.
    mistakes:
      'No': sub_every_term
  - prompt: p(x) = 3x + k has zero x = 2. What is k?
    answer: '-6'
    check: '-6'
    difficulty: 3
    hints:
    - p(2) must be 0.
    - 3 × 2 + k = 0.
    solution: 6 + k = 0, so k = −6.
    mistakes:
      '6': zero_sign_flip
      '2': step_back_to_zero
- code: cbse9gm.linear.growth
  title: Linear growth and decay
  after:
  - cbse9gm.poly.degree
  notes: |
    A linear polynomial ax + b (a ≠ 0) changes by the same amount a every time x goes up by 1. If a > 0
    the quantity grows steadily (linear growth); if a < 0 it shrinks steadily (linear decay). Examples: a taxi
    fare of ₹50 plus ₹12 per km is 12x + 50; a 20 L tank leaking 2 L per hour holds 20 − 2x litres. Tables of
    values with equal differences show a linear relationship.
  explanations:
    text: 'Something grows linearly when it goes up by the same amount every step: ₹50 to start and ₹12 for every km gives 50, 62, 74, 86… That rule is y = 12x + 50. If it goes down by the same amount each step, like water leaking 2 L every hour, it is linear decay: y = 20 − 2x.'
    visual: 'Make a table: x = 0, 1, 2, 3 and y = 50, 62, 74, 86. Under the y-row write the gaps: +12, +12, +12. Equal gaps are the sign of a linear rule. Plot the points: they lie on one straight line.'
    step_by_step: 'Step 1: Find the starting value (when x = 0): that is b. Step 2: Find the change for each step of 1: that is a. Step 3: Write y = ax + b. Step 4: Check with another row of the table.'
    real_world: 'A phone plan costs ₹199 plus ₹2 per extra GB. 0 GB extra: ₹199; 5 GB: ₹209. The bill grows linearly, ₹2 for every GB.'
  picture:
    kind: bars
    unit: ₹
    bars:
    - label: 0 km
      value: 50
    - label: 1 km
      value: 62
    - label: 2 km
      value: 74
    - label: 3 km
      value: 86
    - label: 4 km
      value: 98
    caption: 'Each bar is ₹12 taller than the last: fare = 12x + 50.'
    alt: Bars for a taxi fare at 0 to 4 km rising by the same 12 rupees each step, from 50 to 98.
  activity:
    type: formula
    prompt: Something starts at b and changes by the same amount a every hour. After x hours it is ax + b.
    inputs:
    - name: a
      label: Change each hour a
      min: -15
      max: 25
      step: 1
      start: 0
      unit: L
    - name: b
      label: Start b
      min: 0
      max: 60
      step: 2
      start: 0
      unit: L
    outputs:
    - name: t2
      label: After 2 hours
      expr: 2*a+b
      unit: L
    - name: t5
      label: After 5 hours
      expr: 5*a+b
      unit: L
    goals:
    - prompt: A tank being filled holds 26 L after 2 hours and 47 L after 5 hours. Find a and b.
      want:
        t2: 26
        t5: 47
      hint: How much came in between hour 2 and hour 5? How many hours is that?
      mistakes:
      - when:
          a: 13
          b: 0
        say: 13 L an hour from empty fits 26 L at 2 hours, but gives 65 L at 5 hours. Only 21 L came in over those 3 hours.
      - when:
          a: 21
        say: 21 L is what came in over 3 hours (hour 2 to hour 5), not in one hour.
      - when:
          a: 7
          b: 26
        say: The rate is right, but 26 L is what's in the tank after 2 hours. At the start, 2 hours of filling hadn't happened yet.
    - prompt: A leaking tank holds 40 L after 2 hours and 28 L after 5 hours. Find a and b.
      want:
        t2: 40
        t5: 28
      mistakes:
      - when:
          a: 4
        say: 'A positive a means the tank fills up. It is losing water, so the change each hour is negative: linear decay.'
      - when:
          a: -12
        say: −12 L is the loss over 3 hours. Each hour it loses a third of that.
      - when:
          a: -4
          b: 40
        say: The leak rate is right, but 40 L is after 2 hours of leaking. At the start there was more.
  lesson:
    - teach: 'Some quantities change by the same amount every step. A phone plan of ₹100 plus ₹2 a minute costs 100, 102, 104, … — always 2 more. Such a rule is linear: y = (change per step) × x + (starting value), here y = 2x + 100.'
      check:
        prompt: A gym charges ₹500 to join and ₹300 a month. Which rule gives the cost for x months?
        options:
        - 300x + 500
        - 500x + 300
        - 800x
        answer: 300x + 500
        why: ₹300 is added each month (the rate) and ₹500 is paid once at the start.
    - teach: If the change per step is positive, the quantity grows (linear growth). If it is negative, it shrinks steadily (linear decay). A candle 20 cm long burning 2 cm an hour is 20 − 2x cm after x hours, and it is gone when 20 − 2x = 0, at x = 10.
      picture:
        kind: bars
        bars:
        - label: 0 h
          value: 20
        - label: 2 h
          value: 16
        - label: 4 h
          value: 12
        - label: 6 h
          value: 8
        - label: 8 h
          value: 4
        unit: cm
        alt: 'Candle length falling by 4 cm every 2 hours: 20, 16, 12, 8, 4 cm.'
      check:
        prompt: The candle is 20 − 2x cm. How long is it after 3 hours?
        options:
        - 14 cm
        - 18 cm
        - 6 cm
        answer: 14 cm
        why: 20 − 2 × 3 = 20 − 6 = 14.
    - teach: 'In a table, a linear relationship shows equal gaps: x goes 0, 1, 2, 3 and y goes 7, 10, 13, 16 (always +3). If the gaps change (like 1, 2, 4, 8), it is not linear.'
      check:
        prompt: Which list of y-values (for x = 0, 1, 2, 3) is linear?
        options:
        - 9, 7, 5, 3
        - 1, 2, 4, 8
        - 0, 1, 4, 9
        answer: 9, 7, 5, 3
        why: 'It goes down by 2 every time: equal gaps.'
  items:
  - prompt: A taxi charges ₹40 plus ₹15 per km. What is the fare for 6 km, in ₹?
    answer: '130'
    check: 40 + 15*6
    difficulty: 1
    hints:
    - Fare = 15x + 40.
    - 15 × 6 = 90.
    solution: 'Step 1: 15 × 6 = 90. Step 2: 90 + 40 = 130.'
    mistakes: {"90": "fixed_plus_rate", "330": "fixed_plus_rate"}
  - prompt: Which table shows a linear relationship?
    options:
    - 'x: 0, 1, 2, 3 → y: 5, 8, 11, 14'
    - 'x: 0, 1, 2, 3 → y: 1, 2, 4, 8'
    - 'x: 0, 1, 2, 3 → y: 0, 1, 4, 9'
    - 'x: 0, 1, 2, 3 → y: 5, 6, 8, 11'
    answer: 'x: 0, 1, 2, 3 → y: 5, 8, 11, 14'
    difficulty: 1
    hints:
    - Look at the gaps between the y-values.
    - Linear means equal gaps.
    solution: 'Step 1: 5, 8, 11, 14 goes up by 3 every time. Step 2: The others have gaps that change, so they are not linear.'
    mistakes: {"x: 0, 1, 2, 3 → y: 1, 2, 4, 8": "linear_same_gap", "x: 0, 1, 2, 3 → y: 5, 6, 8, 11": "linear_same_gap"}
  - prompt: A 30 L tank leaks 1.5 L per hour. Which rule gives the water left after x hours?
    options:
    - 30 − 1.5x
    - 1.5x + 30
    - 30x − 1.5
    - 1.5 − 30x
    answer: 30 − 1.5x
    difficulty: 2
    hints:
    - It starts at 30.
    - It goes down by 1.5 each hour.
    solution: 'Step 1: Start: 30 L. Step 2: Each hour it loses 1.5 L, so subtract 1.5x. Rule: 30 − 1.5x.'
    mistakes:
      1.5x + 30: growth_vs_decay
  - prompt: In that tank (30 − 1.5x litres after x hours), after how many hours is it empty?
    answer: '20'
    check: 30/1.5
    difficulty: 2
    hints:
    - Empty means 30 − 1.5x = 0.
    - 30 ÷ 1.5.
    solution: 'Step 1: 30 − 1.5x = 0. Step 2: 1.5x = 30, so x = 20 hours.'
    mistakes: {"45": "empty_means_zero", "28.5": "empty_means_zero"}
  - prompt: A plant is 4 cm tall and grows 0.5 cm a day. On which day is it 10 cm tall?
    answer: '12'
    check: (10 - 4)/0.5
    difficulty: 2
    hints:
    - Height = 0.5x + 4.
    - It must grow 6 cm.
    solution: 'Step 1: 0.5x + 4 = 10. Step 2: 0.5x = 6, so x = 12.'
    mistakes: {"20": "start_height", "28": "start_height"}
  - prompt: A linear rule gives y = 7 when x = 1 and y = 19 when x = 4. What is y when x = 0?
    answer: '3'
    check: 7 - (19 - 7)/(4 - 1)
    difficulty: 3
    hints:
    - From x = 1 to x = 4, y goes up 12 in 3 steps.
    - So each step is 4. Go back one step from x = 1.
    solution: 'Step 1: Change per step = (19 − 7) ÷ 3 = 4. Step 2: At x = 0: 7 − 4 = 3. (Rule: y = 4x + 3.)'
    mistakes: {"7": "step_back_to_zero", "4": "intercept_is_coefficient"}
  - prompt: An auto charges ₹30 plus ₹10 per km. What is the fare for 8 km, in ₹?
    answer: '110'
    check: 30 + 10*8
    difficulty: 1
    hints:
    - Fare = 30 + 10 × km.
    - 10 × 8 = 80.
    solution: 30 + 80 = ₹110.
    mistakes:
      '80': fixed_plus_rate
      '320': fixed_plus_rate
  - prompt: A tank has 50 L and loses 5 L each hour. How much is left after 4 hours, in litres?
    answer: '30'
    check: 50 - 5*4
    difficulty: 1
    hints:
    - It loses 5 L each hour.
    - 50 − 5 × 4.
    solution: 50 − 20 = 30 L.
    mistakes:
      '70': growth_vs_decay
      '45': sub_every_term
  - prompt: Which rule shows linear decay?
    options:
    - y = 40 − 3x
    - y = 3x + 40
    - y = 40
    - y = x²
    answer: y = 40 − 3x
    difficulty: 1
    hints:
    - Decay means it goes down steadily.
    - The number multiplying x must be negative.
    solution: 'In 40 − 3x, y drops by 3 each time x goes up by 1: linear decay.'
    mistakes:
      y = 3x + 40: growth_vs_decay
  - prompt: y-values for x = 0, 1, 2, 3 are 4, 9, 14, 19. What is y when x = 6?
    answer: '34'
    check: 4 + 5*6
    difficulty: 2
    hints:
    - The gap is 5 each step; the start is 4.
    - y = 5x + 4.
    solution: y = 5x + 4, so y(6) = 30 + 4 = 34.
    mistakes:
      '30': start_height
      '24': linear_same_gap
  - prompt: A savings box starts with ₹200, and ₹50 is added every week. After how many weeks does it hold ₹600?
    answer: '8'
    check: (600 - 200)/50
    difficulty: 2
    hints:
    - 200 + 50x = 600.
    - 50x = 400.
    solution: 50x = 400, so x = 8 weeks.
    mistakes:
      '12': fixed_plus_rate
      '400': step_back_to_zero
  - prompt: A phone battery at 100% drops 8% an hour. After how many hours does it reach 20%?
    answer: '10'
    check: (100 - 20)/8
    difficulty: 2
    hints:
    - 100 − 8x = 20.
    - 8x = 80.
    solution: 8x = 80, so x = 10 hours.
    mistakes:
      '80': step_back_to_zero
      '2.5': growth_vs_decay
  - prompt: In y = 12x + 250, what does 250 mean if y is a bill in ₹ and x is units used?
    options:
    - A fixed charge paid even when nothing is used
    - The cost of each unit
    - The number of units
    - The total bill
    answer: A fixed charge paid even when nothing is used
    difficulty: 2
    hints:
    - Put x = 0.
    - What is left when no units are used?
    solution: At x = 0 the bill is 250. So 250 is the fixed charge, and 12 is the cost per unit.
    mistakes:
      The cost of each unit: c9m2_rate_is_slope
  - prompt: A linear rule gives y = 10 when x = 2 and y = 22 when x = 5. What is the change in y for each step of 1 in x?
    answer: '4'
    check: (22 - 10)/(5 - 2)
    difficulty: 3
    hints:
    - y went up by 12.
    - That happened over 3 steps.
    solution: y rose 22 − 10 = 12 over 3 steps, so 4 per step.
    mistakes:
      '12': linear_same_gap
      '6': linear_same_gap
  - prompt: Water in a pool rises 3 cm an hour from 15 cm, and a second pool falls 2 cm an hour from 65 cm. After how many hours are they at the same level?
    answer: '10'
    check: (65 - 15)/(3 + 2)
    difficulty: 3
    hints:
    - 15 + 3x = 65 − 2x.
    - 5x = 50.
    solution: 15 + 3x = 65 − 2x gives 5x = 50, so x = 10 hours (both at 45 cm).
    mistakes:
      '50': linear_same_gap
      50/1: linear_same_gap
- code: cbse9gm.linear.slope
  title: Slope and y-intercept of y = ax + b
  after:
  - cbse9gm.linear.growth
  notes: |
    The graph of y = ax + b is a straight line. a is the slope: the change in y for each increase of 1 in x
    (rise over run between any two points). b is the y-intercept: the value of y where the line crosses the
    y-axis (x = 0). A positive slope rises left to right, a negative slope falls, slope 0 is horizontal. Lines
    with the same slope are parallel. The zero of ax + b is x = −b/a, where the line crosses the x-axis.
  explanations:
    text: 'In y = ax + b, a tells you how steep the line is: every step of 1 to the right, the line goes up a (or down if a is negative). b tells you where the line starts on the y-axis. So y = 2x + 1 starts at 1 and climbs 2 for every 1 across.'
    visual: Draw y = 2x + 1. Start at (0, 1) on the y-axis. Step 1 right and 2 up to (1, 3), again to (2, 5). Join them. The staircase of '1 across, 2 up' is the slope; the starting point (0, 1) is the intercept.
    step_by_step: 'Step 1: Pick two points on the line. Step 2: Rise = difference in y; run = difference in x. Step 3: Slope = rise ÷ run. Step 4: The y-intercept is the y-value at x = 0.'
    real_world: 'A road sign saying ''1 in 10'' means the road rises 1 m for every 10 m across: a slope of 1/10. A steeper hill has a bigger slope.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 6
    points:
      P:
      - 0
      - 1
      Q:
      - 2
      - 5
      _R:
      - 2
      - 1
    segments:
    - - P
      - _R
      - run 2
    - - _R
      - Q
      - rise 4
    - - P
      - Q
    caption: Slope = rise ÷ run = 4 ÷ 2 = 2; the line crosses the y-axis at 1.
    alt: The line y = 2x + 1 through (0, 1) and (2, 5), with a step of 2 across and 4 up showing slope 2.
  activity:
    type: graph
    mode: line
    range:
    - -6
    - 6
    m_step: 0.5
    prompt: The line is y = ax + b. Tilt it to change the slope a; slide it up or down to change b, where it crosses the y-axis.
    goals:
    - prompt: Make y = 2x − 3.
      m: 2
      c: -3
      mistakes:
      - when:
          m: -3
          c: 2
        say: 'You swapped them: this line has slope −3 and crosses at 2. The number with x is the slope.'
      - when:
          m: 2
          c: 3
        say: This crosses the y-axis at +3. In y = 2x − 3 it crosses at −3, below the origin.
    - prompt: Make the line through (0, 4) and (2, 0).
      through:
      - - 0
        - 4
      - - 2
        - 0
      hint: 'From (0, 4) to (2, 0): how far up or down, for how far across?'
      mistakes:
      - when:
          m: 2
          c: 4
        say: 'This line rises: from (0, 4), 2 across takes it up to (2, 8). It has to drop to (2, 0).'
      - when:
          m: -0.5
          c: 4
        say: 'Slope −½ drops 1 for every 2 across, reaching (2, 3). Slope is rise ÷ run: the drop is 4 over a run of 2.'
    - prompt: Make a line parallel to y = x + 1 that crosses the y-axis at −2.
      m: 1
      c: -2
      mistakes:
      - when:
          m: -1
          c: -2
        say: Slope −1 goes down, but y = x + 1 goes up 1 for each 1 across. Parallel lines climb at the same rate.
      - when:
          m: 1
          c: 1
        say: That's y = x + 1 itself, not a parallel line. Keep the tilt, slide it down to cross at −2.
  lesson:
    - teach: 'The graph of y = ax + b is a straight line. The number a is its slope: how much y goes up when x goes up by 1. Between any two points, slope = rise ÷ run = (change in y) ÷ (change in x).'
      picture:
        kind: geometry
        axes: true
        range:
        - -1
        - 7
        points:
          (1, 2):
          - 1
          - 2
          (3, 6):
          - 3
          - 6
          _c:
          - 3
          - 2
        segments:
        - - (1, 2)
          - _c
          - run 2
        - - _c
          - (3, 6)
          - rise 4
        - - (1, 2)
          - (3, 6)
        caption: 'Rise 4 over run 2: slope 2.'
        alt: Line from (1, 2) to (3, 6) with a run of 2 across and a rise of 4 up, so slope 2.
      check:
        prompt: A line goes through (0, 1) and (2, 7). What is its slope?
        options:
        - '3'
        - 1/3
        - '6'
        answer: '3'
        why: Rise 7 − 1 = 6, run 2 − 0 = 2, slope 6 ÷ 2 = 3.
    - teach: 'The number b is the y-intercept: where the line crosses the y-axis, because at x = 0, y = b. In y = 4x − 3 the slope is 4 and the line crosses the y-axis at −3.'
      check:
        prompt: Where does y = −x + 6 cross the y-axis?
        options:
        - '6'
        - −1
        - −6
        answer: '6'
        why: At x = 0, y = 6.
    - teach: 'A positive slope climbs left to right, a negative slope falls, slope 0 is flat. Lines with the same slope never meet: they are parallel. The line crosses the x-axis where y = 0, at x = −b/a.'
      check:
        prompt: Which line falls from left to right?
        options:
        - y = −3x + 1
        - y = 3x − 1
        - y = 2
        answer: y = −3x + 1
        why: Its slope −3 is negative.
  items:
  - prompt: What is the slope of y = 3x − 5?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - In y = ax + b, the slope is a.
    - The number with x.
    solution: 'Step 1: Compare with y = ax + b. Step 2: a = 3, so the slope is 3.'
    mistakes:
      '-5': intercept_is_coefficient
  - prompt: Where does y = 3x − 5 cross the y-axis? Give the y-value.
    answer: '-5'
    check: '-5'
    difficulty: 1
    hints:
    - Put x = 0.
    - 3 × 0 − 5.
    solution: 'Step 1: At the y-axis, x = 0. Step 2: y = −5.'
    mistakes:
      '3': intercept_is_coefficient
  - prompt: Find the slope of the line through (1, 2) and (3, 8).
    answer: '3'
    check: (8 - 2)/(3 - 1)
    difficulty: 2
    hints:
    - Rise = 8 − 2.
    - Run = 3 − 1.
    solution: 'Step 1: Rise = 6, run = 2. Step 2: Slope = 6 ÷ 2 = 3.'
    mistakes:
      1/3: slope_rise_run_swap
  - prompt: Which line is parallel to y = −2x + 4?
    options:
    - y = −2x − 1
    - y = 2x + 4
    - y = 4x − 2
    - y = −x + 4
    answer: y = −2x − 1
    difficulty: 2
    hints:
    - Parallel lines have the same slope.
    - Look for −2 in front of x.
    solution: 'Step 1: The slope is −2. Step 2: y = −2x − 1 also has slope −2, so it is parallel.'
    mistakes: {"y = 2x + 4": "parallel_same_slope", "y = −x + 4": "parallel_same_slope"}
  - prompt: Where does y = 2x − 6 cross the x-axis? Give the x-value.
    answer: '3'
    check: 6/2
    difficulty: 2
    hints:
    - On the x-axis, y = 0.
    - 2x − 6 = 0.
    solution: 'Step 1: 2x − 6 = 0. Step 2: x = 3. This is the zero of the polynomial 2x − 6.'
    mistakes: {"-6": "x_axis_y_zero", "-3": "zero_sign_flip"}
  - prompt: A line has slope −1/2 and passes through (0, 4). What is y when x = 6?
    answer: '1'
    check: -1/2*6 + 4
    difficulty: 3
    hints:
    - The line is y = −x/2 + 4.
    - Six steps right, each going down 1/2.
    solution: 'Step 1: y = −(1/2)x + 4. Step 2: y = −3 + 4 = 1.'
    mistakes: {"7": "slope_negative_down", "-8": "slope_negative_down"}
  - prompt: What is the slope of y = 7x + 2?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Compare with y = ax + b.
    - The slope multiplies x.
    solution: a = 7, so the slope is 7.
    mistakes:
      '2': intercept_is_coefficient
  - prompt: What is the y-intercept of y = −2x + 9?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - Put x = 0.
    - What is left?
    solution: At x = 0, y = 9.
    mistakes:
      '-2': intercept_is_coefficient
  - prompt: Find the slope of the line through (2, 5) and (6, 13).
    answer: '2'
    check: (13 - 5)/(6 - 2)
    difficulty: 2
    hints:
    - Rise = 13 − 5.
    - Run = 6 − 2.
    solution: Slope = 8 ÷ 4 = 2.
    mistakes:
      1/2: slope_rise_run_swap
      '8': slope_rise_run_swap
  - prompt: Find the slope of the line through (0, 8) and (4, 0).
    answer: '-2'
    check: (0 - 8)/(4 - 0)
    difficulty: 2
    hints:
    - y goes down as x goes up.
    - Rise = 0 − 8 = −8; run = 4.
    solution: Slope = −8 ÷ 4 = −2.
    mistakes:
      '2': slope_negative_down
      -1/2: slope_rise_run_swap
  - prompt: Which line is parallel to y = 5x − 3?
    options:
    - y = 5x + 8
    - y = −5x − 3
    - y = 3x + 5
    - y = x/5
    answer: y = 5x + 8
    difficulty: 2
    hints:
    - Parallel lines have equal slopes.
    - Look for slope 5.
    solution: y = 5x + 8 has the same slope, 5, so it is parallel.
    mistakes:
      y = −5x − 3: parallel_same_slope
      y = 3x + 5: parallel_same_slope
  - prompt: Where does y = 3x + 12 cross the x-axis? Give the x-value.
    answer: '-4'
    check: -12/3
    difficulty: 2
    hints:
    - On the x-axis, y = 0.
    - 3x + 12 = 0.
    solution: 3x = −12, so x = −4.
    mistakes:
      '4': zero_sign_flip
      '12': x_axis_y_zero
  - prompt: What is the slope of a horizontal line such as y = 4?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - Does y change as x changes?
    - Rise is 0.
    solution: y stays 4 everywhere, so the rise is 0 and the slope is 0.
    mistakes:
      '4': intercept_is_coefficient
