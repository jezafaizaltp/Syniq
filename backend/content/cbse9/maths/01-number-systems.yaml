# CBSE Class 9 Mathematics (NCERT), chapter 1. Format: content/README.md.
subject: cbse9-math
chapter: 1
title: Number Systems

tips:
  recurring_digits_count: "Count how many digits repeat. One repeating digit means multiply by 10; two repeating digits means multiply by 100."
  irrational_root_of_square: "The square root of a perfect square, like √9 = 3, is a whole number, so it is rational."
  rationalise_top_only: "Multiply both the top and the bottom by the same root, so the value doesn't change."
  surd_add_inside: "√a + √b is not √(a + b). Only like roots, such as 2√3 + 5√3, can be added."
  exponent_multiply_instead_add: "When you multiply powers of the same base, add the exponents: a^m × a^n = a^(m + n)."
  exponent_negative_sign: "A negative exponent means one over the power, not a negative number: 2^(−3) = 1/8."
  fraction_exponent_root: "A power of 1/n means the nth root: 27^(1/3) is the cube root of 27."

concepts:
  - code: cbse9m.numbers.rational_irrational
    title: Rational and irrational numbers
    notes: |
      Natural numbers, whole numbers, integers and rational numbers (p/q, q ≠ 0) are introduced on the
      number line. Irrational numbers such as √2, √3 and π cannot be written as p/q. Rational and irrational
      numbers together make the real numbers; every real number is a point on the number line. Between any
      two rational numbers there are infinitely many rational numbers (for example their average).
    explanations:
      text: "A rational number can be written as one whole number over another, like 3/4, −5 (= −5/1) or 0.25 (= 1/4). An irrational number can't: √2 = 1.41421356… goes on forever without repeating. Together they are the real numbers, and every real number has its own point on the number line."
      visual: "Draw a number line. Mark 0, 1, 2 and then 1/2 halfway between 0 and 1. To find √2, draw a square with side 1 on the line from 0: its diagonal is √2. Swing the diagonal down onto the line with a compass and mark where it lands, a little after 1.4. That point is real, but no fraction lands exactly there."
      step_by_step: "Step 1: Ask: can it be written as p/q with whole numbers p and q, and q not 0? Step 2: Whole numbers and integers: yes, put them over 1. Step 3: Terminating or repeating decimals: yes. Step 4: Square roots of non-square numbers, and π: no, they are irrational. Step 5: Rational and irrational together are the real numbers."
      real_world: "You can share 3 rotis between 4 people: each gets 3/4, a rational amount. But the diagonal of a 1 metre square tile is √2 metres, and no ruler can mark it exactly as a fraction, however fine its marks are."
    items:
      - prompt: "Which of these is irrational?"
        options: ["√5", "√16", "0.75", "−3"]
        answer: "√5"
        difficulty: 1
        hints: ["Can each number be written as p/q?", "√16 = 4, so it is rational."]
        solution: "Step 1: √16 = 4, 0.75 = 3/4 and −3 = −3/1 are all rational. Step 2: 5 is not a perfect square, so √5 cannot be written as p/q. It is irrational."
        mistakes: {"√16": irrational_root_of_square}
      - prompt: "Which of these is rational?"
        options: ["√49", "√7", "π", "√2 + 1"]
        answer: "√49"
        difficulty: 1
        hints: ["Which square root comes out as a whole number?", "7 × 7 = 49."]
        solution: "Step 1: √49 = 7 = 7/1, so it is rational. Step 2: √7, π and √2 + 1 go on forever without repeating."
      - prompt: "What is the number exactly halfway between 1/4 and 3/4? Type a fraction like 2/3."
        answer: "1/2"
        check: "(1/4 + 3/4)/2"
        difficulty: 1
        hints: ["Halfway between two numbers is their average.", "Add them and divide by 2."]
        solution: "Step 1: 1/4 + 3/4 = 1. Step 2: 1 ÷ 2 = 1/2."
        mistakes: {"1": forgot_divide}
      - prompt: "Which statement is true?"
        options: ["Every integer is a rational number", "Every rational number is an integer", "Every real number is rational", "√9 is irrational"]
        answer: "Every integer is a rational number"
        difficulty: 2
        hints: ["Any integer n can be written as n/1.", "1/2 is rational but not an integer."]
        solution: "Step 1: Any integer n = n/1, so it is rational. Step 2: 1/2 is rational but not an integer, √2 is real but not rational, and √9 = 3 is rational."
        mistakes: {"√9 is irrational": irrational_root_of_square}
      - prompt: "How many rational numbers are there between 1 and 2?"
        options: ["Infinitely many", "None", "Exactly one", "Exactly nine"]
        answer: "Infinitely many"
        difficulty: 2
        hints: ["1.5 is one. Is there one between 1 and 1.5?", "You can always find the average of two numbers."]
        solution: "Step 1: 1.5 is between 1 and 2. Step 2: 1.25 is between 1 and 1.5, 1.125 between 1 and 1.25, and so on for ever. So there are infinitely many."
      - prompt: "Using a square of side 1 on the number line, its diagonal is swung down from 0. Which number does it mark?"
        options: ["√2", "2", "1.5", "√3"]
        answer: "√2"
        check: "sqrt(1^2 + 1^2)"
        difficulty: 3
        hints: ["Use Pythagoras on the square: the diagonal² = 1² + 1².", "Diagonal² = 2."]
        solution: "Step 1: Diagonal² = 1² + 1² = 2. Step 2: Diagonal = √2. Step 3: The compass marks √2 on the line, about 1.414."

  - code: cbse9m.numbers.decimals
    title: Decimal expansions
    after: [cbse9m.numbers.rational_irrational]
    notes: |
      The decimal expansion of a rational number either terminates (1/8 = 0.125) or is non-terminating
      recurring (1/3 = 0.333…, 1/7 = 0.142857…). Irrational numbers have non-terminating, non-recurring
      expansions. A recurring decimal can be written as p/q: for x = 0.333…, 10x − x = 3, so x = 1/3;
      for x = 0.1212…, 100x − x = 12, so x = 12/99 = 4/33.
    explanations:
      text: "Divide to turn a fraction into a decimal. Either the division stops (1/8 = 0.125) or the same digits come back again and again (1/3 = 0.333…). A recurring decimal can be turned back into a fraction: if x = 0.777…, then 10x = 7.777…, and 10x − x = 7, so 9x = 7 and x = 7/9."
      visual: "Write 0.777… on one line and 7.777… (ten times it) directly underneath. Line up the decimal points. Every 7 after the point matches the one above, so subtracting the top from the bottom leaves just 7. That 7 is nine of the original number."
      step_by_step: "Step 1: Call the recurring decimal x. Step 2: Count the repeating digits: 1 digit, multiply by 10; 2 digits, multiply by 100. Step 3: Subtract x from that. The repeating tails cancel. Step 4: Divide to find x as a fraction. Step 5: Simplify the fraction."
      real_world: "Share ₹10 equally among 3 friends on a phone calculator and you get 3.3333…, the 3s never stop. That is just 10/3 rupees each; in real life someone keeps the extra paisa."
    items:
      - prompt: "Write 0.777… (the 7 repeats) as a fraction. Type a fraction like 2/3."
        answer: "7/9"
        check: "7/9"
        difficulty: 1
        hints: ["Let x = 0.777…, so 10x = 7.777…", "10x − x = 7, so 9x = 7."]
        solution: "Step 1: x = 0.777… and 10x = 7.777… Step 2: Subtracting, 9x = 7. Step 3: x = 7/9."
        mistakes: {"7/10": recurring_digits_count}
      - prompt: "Write 1/8 as a decimal."
        answer: "0.125"
        check: "1/8"
        difficulty: 1
        hints: ["Divide 1 by 8.", "1/8 is half of 1/4 = 0.25."]
        solution: "Step 1: 1 ÷ 8 = 0.125. Step 2: The division stops, so it is a terminating decimal."
      - prompt: "Which fraction has a terminating decimal expansion?"
        options: ["3/20", "1/3", "2/7", "5/6"]
        answer: "3/20"
        difficulty: 2
        hints: ["A fraction in lowest terms terminates when the bottom has only 2s and 5s as factors.", "20 = 2 × 2 × 5."]
        solution: "Step 1: 20 = 2² × 5, so 3/20 = 0.15 terminates. Step 2: 3, 7 and 6 (= 2 × 3) have other factors, so those recur."
      - prompt: "Write 0.4747… (47 repeats) as a fraction in lowest terms. Type a fraction like 2/3."
        answer: "47/99"
        check: "47/99"
        difficulty: 2
        hints: ["Two digits repeat, so multiply by 100.", "100x − x = 47."]
        solution: "Step 1: x = 0.4747… and 100x = 47.4747… Step 2: Subtracting, 99x = 47. Step 3: x = 47/99, already in lowest terms."
        mistakes: {"47/9": recurring_digits_count, "47/100": recurring_digits_count}
      - prompt: "Write 0.2333… (only the 3 repeats) as a fraction in lowest terms. Type a fraction like 2/3."
        answer: "7/30"
        check: "(23 - 2)/90"
        difficulty: 3
        hints: ["Let x = 0.2333…; then 10x = 2.333… and 100x = 23.333…", "100x − 10x = 21, so 90x = 21."]
        solution: "Step 1: 10x = 2.333… and 100x = 23.333… Step 2: Subtracting, 90x = 21. Step 3: x = 21/90 = 7/30."
      - prompt: "What kind of decimal expansion does an irrational number have?"
        options: ["Non-terminating and non-recurring", "Terminating", "Non-terminating and recurring", "Always ending in 5"]
        answer: "Non-terminating and non-recurring"
        difficulty: 1
        hints: ["Rational numbers either stop or repeat.", "Irrational numbers do neither."]
        solution: "Step 1: Rational numbers terminate or recur. Step 2: An irrational number like √2 = 1.41421356… never stops and never repeats."

  - code: cbse9m.numbers.surds
    title: Operations on real numbers
    after: [cbse9m.numbers.rational_irrational]
    notes: |
      Identities for positive real numbers a, b: √ab = √a √b, √(a/b) = √a/√b, (√a + √b)(√a − √b) = a − b,
      (a + √b)(a − √b) = a² − b, (√a + √b)² = a + 2√ab + b. Like roots add (2√3 + 5√3 = 7√3).
      Rationalising the denominator: multiply top and bottom by a suitable root, e.g. 1/√2 = √2/2 and
      1/(√7 − √2) = (√7 + √2)/5.
    explanations:
      text: "Roots multiply and divide neatly: √2 × √8 = √16 = 4. But they only add when they are the same root: 3√5 + 2√5 = 5√5, while √2 + √3 stays as it is. To get rid of a root on the bottom of a fraction, multiply top and bottom by that root: 1/√3 = √3/3."
      visual: "Think of √3 as a kind of object, like an apple. 3 apples + 2 apples = 5 apples, so 3√3 + 2√3 = 5√3. But apples and mangoes don't combine into one fruit: √2 + √3 stays as two different things."
      step_by_step: "Step 1: Split roots into a square factor: √12 = √4 × √3 = 2√3. Step 2: Add or subtract only like roots. Step 3: Multiply using √a × √b = √ab. Step 4: To rationalise 1/√a, multiply top and bottom by √a. Step 5: For 1/(√a − √b), multiply top and bottom by (√a + √b), since (√a − √b)(√a + √b) = a − b."
      real_world: "A square plot of 50 m² has sides of √50 = 5√2 m, about 7.07 m. Writing it as 5√2 makes it easy to see that two such plots side by side are 10√2 m long."
    items:
      - prompt: "Simplify √12."
        options: ["2√3", "3√2", "6", "4√3"]
        answer: "2√3"
        check: "sqrt(12)"
        difficulty: 1
        hints: ["Find a square number that divides 12.", "12 = 4 × 3, and √4 = 2."]
        solution: "Step 1: 12 = 4 × 3. Step 2: √12 = √4 × √3 = 2√3."
      - prompt: "Simplify 3√5 + 4√5."
        options: ["7√5", "7√10", "12√5", "√35"]
        answer: "7√5"
        check: "3*sqrt(5) + 4*sqrt(5)"
        difficulty: 1
        hints: ["These are like roots.", "3 of √5 plus 4 of √5."]
        solution: "Step 1: Both are multiples of √5. Step 2: 3√5 + 4√5 = 7√5."
        mistakes: {"7√10": surd_add_inside}
      - prompt: "What is √2 × √18?"
        answer: "6"
        check: "sqrt(2*18)"
        difficulty: 1
        hints: ["√a × √b = √(ab).", "2 × 18 = 36."]
        solution: "Step 1: √2 × √18 = √36. Step 2: √36 = 6."
      - prompt: "Rationalise the denominator of 1/√7."
        options: ["√7/7", "7/√7", "1/7", "√7"]
        answer: "√7/7"
        check: "1/sqrt(7)"
        difficulty: 2
        hints: ["Multiply the top and the bottom by √7.", "√7 × √7 = 7."]
        solution: "Step 1: 1/√7 × √7/√7 = √7/7. Step 2: The bottom is now 7, a whole number."
        mistakes: {"1/7": rationalise_top_only}
      - prompt: "What is (√5 + √3)(√5 − √3)?"
        answer: "2"
        check: "expand((sqrt(5) + sqrt(3))*(sqrt(5) - sqrt(3)))"
        difficulty: 2
        hints: ["Use (a + b)(a − b) = a² − b².", "(√5)² = 5 and (√3)² = 3."]
        solution: "Step 1: (√5 + √3)(√5 − √3) = (√5)² − (√3)². Step 2: = 5 − 3 = 2."
        mistakes: {"8": surd_add_inside}
      - prompt: "Is √2 + √3 equal to √5?"
        options: ["No, √2 + √3 is about 3.15 and √5 is about 2.24", "Yes, roots always add inside", "Yes, because 2 + 3 = 5", "Only when rounded"]
        answer: "No, √2 + √3 is about 3.15 and √5 is about 2.24"
        difficulty: 2
        hints: ["Work out each side with decimals.", "√2 ≈ 1.414 and √3 ≈ 1.732."]
        solution: "Step 1: √2 + √3 ≈ 1.414 + 1.732 = 3.146. Step 2: √5 ≈ 2.236. Step 3: They are different, so roots can't be added inside."
        mistakes: {"Yes, because 2 + 3 = 5": surd_add_inside}
      - prompt: "Rationalise the denominator of 1/(√7 − √2)."
        options: ["(√7 + √2)/5", "(√7 − √2)/5", "(√7 + √2)/9", "√5/5"]
        answer: "(√7 + √2)/5"
        check: "1/(sqrt(7) - sqrt(2))"
        difficulty: 3
        hints: ["Multiply top and bottom by √7 + √2.", "(√7 − √2)(√7 + √2) = 7 − 2."]
        solution: "Step 1: Multiply top and bottom by (√7 + √2). Step 2: The bottom becomes 7 − 2 = 5. Step 3: The answer is (√7 + √2)/5."
      - prompt: "Expand (√3 + √2)²."
        options: ["5 + 2√6", "5", "5 + √6", "6 + 2√5"]
        answer: "5 + 2√6"
        check: "expand((sqrt(3) + sqrt(2))^2)"
        difficulty: 3
        hints: ["(a + b)² = a² + 2ab + b².", "2 × √3 × √2 = 2√6."]
        solution: "Step 1: (√3)² = 3 and (√2)² = 2. Step 2: 2 × √3 × √2 = 2√6. Step 3: Total = 3 + 2 + 2√6 = 5 + 2√6."

  - code: cbse9m.numbers.exponents
    title: Laws of exponents for real numbers
    after: [cbse9m.numbers.surds]
    notes: |
      For a > 0 and rational p, q: a^p × a^q = a^(p+q), (a^p)^q = a^(pq), a^p / a^q = a^(p−q), a^p × b^p = (ab)^p.
      a^(1/n) is the nth root of a, and a^(m/n) = (nth root of a)^m. a^0 = 1 and a^(−n) = 1/a^n.
      NCERT examples: 64^(1/2) = 8, 32^(1/5) = 2, 125^(1/3) = 5, 9^(3/2) = 27, 2^(2/3) × 2^(1/3) = 2.
    explanations:
      text: "Exponents count how many times a number is multiplied. Multiplying powers of the same base adds the exponents: 2³ × 2² = 2⁵. A fractional exponent means a root: 64^(1/2) = √64 = 8, and 27^(1/3) is the cube root, 3. A negative exponent means 'one over': 2^(−3) = 1/8."
      visual: "Write 2³ × 2² as (2 × 2 × 2) × (2 × 2): count the 2s, there are 5. For 9^(3/2), first take the square root (the 2 at the bottom): 3. Then cube it (the 3 at the top): 27."
      step_by_step: "Step 1: Same base, multiplying: add the exponents. Step 2: Dividing: subtract them. Step 3: Power of a power: multiply them. Step 4: a^(m/n): take the nth root, then raise to m. Step 5: a^(−n) = 1/a^n, and a^0 = 1."
      real_world: "A bacteria colony doubles every hour. After 3 hours it is 2³ = 8 times bigger, and after 2 more hours, 2³ × 2² = 2⁵ = 32 times bigger than at the start."
    items:
      - prompt: "Find 64^(1/2)."
        answer: "8"
        check: "64^(1/2)"
        difficulty: 1
        hints: ["A power of 1/2 means the square root.", "Which number times itself is 64?"]
        solution: "Step 1: 64^(1/2) = √64. Step 2: 8 × 8 = 64, so the answer is 8."
        mistakes: {"32": fraction_exponent_root}
      - prompt: "Find 125^(1/3)."
        answer: "5"
        check: "125^(1/3)"
        difficulty: 1
        hints: ["A power of 1/3 means the cube root.", "Which number multiplied by itself three times is 125?"]
        solution: "Step 1: 125^(1/3) is the cube root of 125. Step 2: 5 × 5 × 5 = 125, so the answer is 5."
      - prompt: "Simplify 2³ × 2⁴ and give the value."
        answer: "128"
        check: "2^(3+4)"
        difficulty: 1
        hints: ["Same base, so add the exponents.", "2⁷ = ?"]
        solution: "Step 1: 2³ × 2⁴ = 2⁷. Step 2: 2⁷ = 128."
        mistakes: {"4096": exponent_multiply_instead_add}
      - prompt: "Find 9^(3/2)."
        answer: "27"
        check: "9^(3/2)"
        difficulty: 2
        hints: ["First take the square root of 9.", "Then cube the result."]
        solution: "Step 1: √9 = 3. Step 2: 3³ = 27."
      - prompt: "Find 2^(−3). Type a fraction like 2/3."
        answer: "1/8"
        check: "2^(-3)"
        difficulty: 2
        hints: ["A negative exponent means one over the power.", "2³ = 8."]
        solution: "Step 1: 2^(−3) = 1/2³. Step 2: = 1/8."
        mistakes: {"-8": exponent_negative_sign, "-6": exponent_negative_sign}
      - prompt: "Simplify 2^(2/3) × 2^(1/3)."
        answer: "2"
        check: "2^(2/3) * 2^(1/3)"
        difficulty: 2
        hints: ["Add the exponents.", "2/3 + 1/3 = 1."]
        solution: "Step 1: 2^(2/3) × 2^(1/3) = 2^(2/3 + 1/3). Step 2: = 2¹ = 2."
      - prompt: "Find 32^(2/5)."
        answer: "4"
        check: "32^(2/5)"
        difficulty: 3
        hints: ["First find the fifth root of 32.", "2⁵ = 32; then square 2."]
        solution: "Step 1: The fifth root of 32 is 2. Step 2: 2² = 4."
      - prompt: "Simplify 7^(1/2) × 8^(1/2)."
        options: ["√56", "√15", "56", "15^(1/2)"]
        answer: "√56"
        check: "sqrt(7)*sqrt(8)"
        difficulty: 3
        hints: ["Use a^p × b^p = (ab)^p.", "7 × 8 = 56."]
        solution: "Step 1: 7^(1/2) × 8^(1/2) = (7 × 8)^(1/2). Step 2: = 56^(1/2) = √56, which is 2√14."
