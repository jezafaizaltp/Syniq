# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 13. Format: content/README.md.
subject: cbse9-math
chapter: 13
title: Two Variables, One Line
tips:
  standard_form_sign: "Move every term to the left side, changing its sign as it crosses the =. Then read off the number with no letter."
  one_solution_only: "Pick x = 0 and find y, then pick x = 3 and find y. Then try x = 1, 2, 10… Does it ever stop working?"
  twice_which_way: '''x is twice y'' means x = 2y: the 2 goes with the smaller amount.'
  substitute_both: Put the x value in for x and the y value in for y. (2, 3) means x = 2, y = 3.
  elimination_sign: To eliminate a letter, make its numbers match and then subtract if the signs are the same, add if they are opposite.
  pair_parallel_no_solution: Parallel lines never meet, so a pair of equations with the same slope but different intercepts has no solution.
  pair_found_one_value: You've found one letter; put it back into an equation to find the other.
  check_by_substituting: "Put x = 2 and y = 3 into the left side and see if it equals the right side."
  eliminate_pen: "Double the second equation so the pens match, then subtract to leave only pencils."
  k_both_places: "Put x = k and y = 2k into the equation, collect the k's, then solve."
  linear_power_one: "Linear means every variable has power 1 (or 0). Look for a squared term."
  missing_variable_zero: "If y doesn't appear, how many y's are there? Write the equation as x + (?)·y − 5 = 0."
  no_solution_ratio: "No solution means parallel lines: the x and y coefficients are in the same ratio, but the constants are not."
  solve_for_y: "Put the given x in, then get y on its own."
  y_intercept_x0: "Put x = 0, so the x-term disappears. Then solve for y."
concepts:
- code: cbse9gm.lin2.form
  title: Writing ax + by + c = 0
  notes: |
    A linear equation in two variables can be written as ax + by + c = 0 with a, b, c real and a, b not
    both zero. Equations like x = 3 are also linear in two variables (0·y). Writing a word statement as an
    equation: "cost of a notebook is twice a pen" becomes x = 2y, i.e. x − 2y = 0.
  explanations:
    text: 'A linear equation in two variables has two unknowns, each to the power 1, like 2x + 3y = 12. Its standard form is ax + by + c = 0: move every term to the left side. For 2x + 3y = 12, that''s 2x + 3y − 12 = 0, so a = 2, b = 3, c = −12.'
    visual: 'Picture a balance with everything moved onto one pan so the other pan reads 0. Then read off the three numbers in order: the one beside x is a, beside y is b, and the lone number is c.'
    step_by_step: 'Step 1: Move all terms to the left side, changing sign when a term crosses the equals sign. Step 2: Arrange as (x term) + (y term) + (number) = 0. Step 3: Read a, b and c, keeping their signs. Step 4: If a variable is missing, its coefficient is 0.'
    real_world: Two pens and three pencils cost ₹24. If a pen is ₹x and a pencil ₹y, then 2x + 3y = 24, or 2x + 3y − 24 = 0. Many different prices could fit; that's why it has two unknowns.
  picture:
    kind: flow
    steps:
    - 'Start: 2x = 5 − 3y'
    - 'Move everything to one side: 2x + 3y − 5 = 0'
    - 'Number with x: a = 2'
    - 'Number with y: b = 3'
    - 'The lone number: c = −5'
    alt: Steps rewriting 2x = 5 − 3y as 2x + 3y − 5 = 0, so a = 2, b = 3 and c = −5.
  activity:
    type: sort
    prompt: Is it a linear equation in two variables (it can be written ax + by + c = 0)?
    bins:
    - Linear in two variables
    - Not linear
    items:
    - label: 2x + 3y = 7
      bin: Linear in two variables
      clue: Are x and y each to the power 1, and not multiplied together?
      why: 'Both to the power 1, just added: 2x + 3y − 7 = 0.'
    - label: x = 3
      bin: Linear in two variables
      clue: Could y be there with a 0 in front?
      why: 'x = 3 is x + 0·y − 3 = 0: linear in two variables, with b = 0.'
    - label: y = 2x
      bin: Linear in two variables
      clue: Move everything to one side. What form do you get?
      why: '2x − y = 0: a = 2, b = −1, c = 0.'
    - label: xy = 6
      bin: Not linear
      clue: Are x and y multiplied together?
      why: x × y is a product of the variables, so it isn't of the form ax + by + c.
    - label: x² + y = 4
      bin: Not linear
      clue: What power does x have?
      why: x² has power 2, so it isn't linear.
    - label: 3x − 5y + 2 = 0
      bin: Linear in two variables
      clue: Does it already look like ax + by + c = 0?
      why: a = 3, b = −5, c = 2.
    - label: 1/x + y = 2
      bin: Not linear
      clue: Can 1/x be written as a number times x?
      why: 1/x is x to the power −1, not linear.
    - label: 'A notebook costs twice a pen: x = 2y'
      bin: Linear in two variables
      clue: Bring it to one side. What are a, b and c?
      why: 'x − 2y = 0: linear in two variables.'
    - label: √x + y = 5
      bin: Not linear
      clue: What power is √x?
      why: √x is x to the power ½, so not linear.
  items:
  - prompt: Write 3x + 2y = 9 as ax + by + c = 0. What is c?
    answer: '-9'
    check: '-9'
    difficulty: 1
    hints:
    - Move 9 to the left side.
    - It becomes −9.
    solution: 'Step 1: 3x + 2y − 9 = 0. Step 2: So a = 3, b = 2, c = −9.'
    mistakes:
      '9': standard_form_sign
  - prompt: In x − 4y + 7 = 0, what is b?
    answer: '-4'
    check: '-4'
    difficulty: 1
    hints:
    - b is the number with y.
    - Keep the sign.
    solution: The y term is −4y, so b = −4.
    mistakes:
      '4': dropped_sign
  - prompt: Write x = 5 in the form ax + by + c = 0. What is b?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - There is no y term.
    - x + 0·y − 5 = 0.
    solution: 'Step 1: x = 5 becomes x + 0·y − 5 = 0. Step 2: So b = 0.'
    mistakes: {"1": "missing_variable_zero", "-5": "missing_variable_zero"}
  - prompt: Write 2x = 3y − 5 as ax + by + c = 0, with a = 2. What is c?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Bring 3y and −5 to the left.
    - 2x − 3y + 5 = 0.
    solution: 'Step 1: 2x − 3y + 5 = 0. Step 2: So a = 2, b = −3, c = 5.'
    mistakes:
      '-5': standard_form_sign
  - prompt: The cost of a notebook (₹x) is twice the cost of a pen (₹y). Which equation shows this?
    options:
    - x − 2y = 0
    - 2x − y = 0
    - x + 2y = 0
    - x − y = 2
    answer: x − 2y = 0
    difficulty: 2
    hints:
    - Notebook = 2 × pen.
    - x = 2y.
    solution: 'Step 1: x = 2y. Step 2: Move 2y across: x − 2y = 0.'
    mistakes:
      2x − y = 0: twice_which_way
  - prompt: Which of these is NOT a linear equation in two variables?
    options:
    - x² + y = 4
    - x + y = 4
    - 2x − 3y = 0
    - y = 7
    answer: x² + y = 4
    difficulty: 2
    hints:
    - Linear means each variable has power 1.
    - Look for a square.
    solution: 'x² has power 2, so x² + y = 4 is not linear. y = 7 is linear: it is 0·x + y − 7 = 0.'
    mistakes: {"y = 7": "linear_power_one", "2x − 3y = 0": "linear_power_one"}
- code: cbse9gm.lin2.solutions
  title: Solutions of a linear equation
  after:
  - cbse9gm.lin2.form
  notes: |
    A solution is a pair (x, y) that makes the equation true. A linear equation in two variables has
    infinitely many solutions: choose any x and solve for y. To check a pair, substitute both values.
    To find k when (p, q) is a solution of an equation with k, substitute and solve for k.
  explanations:
    text: A solution is a pair of numbers, one for x and one for y, that makes the equation true. For x + y = 5, (2, 3) works, so does (0, 5), so does (10, −5). There are endlessly many, because you can choose any x and then work out y.
    visual: Make a two-column table, x and y. Write any number you like in the x column, then work out what y has to be. Every row of the table is a solution, and you can keep adding rows forever.
    step_by_step: 'Step 1: To check a pair (p, q), put x = p and y = q into the equation. Step 2: Work out the left side. Step 3: If both sides match, it is a solution. Step 4: To find a solution, choose x (0 is easy), then solve for y.'
    real_world: If you and a friend share 10 laddoos, you might take 4 and they take 6, or 5 and 5, or 7 and 3. x + y = 10 has many answers; each one is a fair way the sharing could go.
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 6
    points:
      (0, 4):
      - 0
      - 4
      (1, 3):
      - 1
      - 3
      (3, 1):
      - 3
      - 1
      (4, 0):
      - 4
      - 0
    segments:
    - - (0, 4)
      - (4, 0)
      - x + y = 4
    caption: Every point on the line is a solution of x + y = 4, and there are infinitely many.
    alt: Axes with the line x + y = 4 passing through the solutions (0, 4), (1, 3), (3, 1) and (4, 0).
  activity:
    type: graph
    mode: point
    range:
    - -6
    - 6
    prompt: A solution is a pair (x, y) that makes the equation true. Move the point to one.
    goals:
    - prompt: Find the solution of 2x + y = 6 that has x = 4.
      x: 4
      y: -2
      hint: With x = 4, 2x is 8. What must y be to bring the total to 6?
      mistakes:
      - when:
          x: 4
          y: 2
        say: 2(4) + 2 = 10, not 6. When x = 4, 2x is already 8, so y must take 2 away.
      - when:
          x: -2
          y: 4
        say: 'That''s (−2, 4): the numbers swapped. x = 4 is the first number.'
    - prompt: Find the solution of x − 2y = 4 that lies on the y-axis.
      x: 0
      y: -2
      mistakes:
      - when:
          x: 4
          y: 0
        say: (4, 0) is a solution, but it lies on the x-axis. On the y-axis, x = 0.
      - when:
          x: 0
          y: 2
        say: '0 − 2(2) = −4, not 4. The sign flipped: −2y = 4 needs a negative y.'
    - prompt: (2, k) is a solution of 3x + 2y = 12. Put the point at (2, k).
      x: 2
      y: 3
      mistakes:
      - when:
          x: 2
          y: 6
        say: 3(2) + 2(6) = 18. Take 3 × 2 away from 12 first, then share what's left by 2.
      - when:
          x: 3
          y: 2
        say: 'That''s (3, 2): swapped. The point is (2, k), so x = 2.'
  items:
  - prompt: Is (2, 3) a solution of x + 2y = 8?
    options:
    - 'Yes'
    - 'No'
    - Only if x = 3
    answer: 'Yes'
    difficulty: 1
    hints:
    - Put x = 2 and y = 3.
    - 2 + 2 × 3 = ?
    solution: 'Step 1: 2 + 2 × 3 = 2 + 6 = 8. Step 2: That equals the right side, so yes.'
    mistakes: {"No": "check_by_substituting", "Only if x = 3": "substitute_both"}
  - prompt: For x + y = 7, if x = 2, what is y?
    answer: '5'
    check: 7 - 2
    difficulty: 1
    hints:
    - 2 + y = 7.
    - Subtract 2.
    solution: 'Step 1: 2 + y = 7. Step 2: y = 5. So (2, 5) is a solution.'
    mistakes: {"9": "solve_for_y", "2": "solve_for_y"}
  - prompt: How many solutions does 2x + 3y = 6 have?
    options:
    - Infinitely many
    - Exactly one
    - Exactly two
    - None
    answer: Infinitely many
    difficulty: 1
    hints:
    - Can you pick any x?
    - Each x gives a y.
    solution: For every value of x you can solve for y, so there are infinitely many solutions.
    mistakes:
      Exactly one: one_solution_only
  - prompt: For 2x + 3y = 12, find y when x = 0.
    answer: '4'
    check: 12/3
    difficulty: 2
    hints:
    - Put x = 0.
    - 3y = 12.
    solution: 'Step 1: 2(0) + 3y = 12. Step 2: 3y = 12, so y = 4. The solution is (0, 4).'
    mistakes: {"6": "y_intercept_x0", "12": "y_intercept_x0"}
  - prompt: For x − 2y = 4, find x when y = −1.
    answer: '2'
    check: 4 + 2*(-1)
    difficulty: 2
    hints:
    - x − 2(−1) = 4.
    - x + 2 = 4.
    solution: 'Step 1: x − 2(−1) = 4. Step 2: x + 2 = 4. Step 3: x = 2.'
    mistakes:
      '6': minus_negative
  - prompt: If x = 2, y = 1 is a solution of 2x + 3y = k, what is k?
    answer: '7'
    check: 2*2 + 3*1
    difficulty: 2
    hints:
    - Put the values in.
    - 4 + 3.
    solution: 'Step 1: k = 2(2) + 3(1). Step 2: k = 4 + 3 = 7.'
    mistakes:
      '8': substitute_both
  - prompt: Which pair is a solution of 3x − y = 5?
    options:
    - (2, 1)
    - (1, 2)
    - (0, 5)
    - (2, −1)
    answer: (2, 1)
    difficulty: 2
    hints:
    - Test each pair.
    - 3(2) − 1 = ?
    solution: 'Step 1: For (2, 1): 6 − 1 = 5. Step 2: That''s right. The others give −1, −5 and 7.'
    mistakes:
      (1, 2): substitute_both
  - prompt: If (k, 2k) is a solution of x + y = 12, what is k?
    answer: '4'
    check: 12/3
    difficulty: 3
    hints:
    - k + 2k = 12.
    - 3k = 12.
    solution: 'Step 1: k + 2k = 12. Step 2: 3k = 12, so k = 4. The solution is (4, 8).'
    mistakes: {"6": "k_both_places", "8": "k_both_places"}
- code: cbse9gm.lin2.pairs
  title: Pairs of linear equations
  after:
  - cbse9gm.lin2.solutions
  notes: |
    Two linear equations in x and y together can have one solution (the lines cross), no solution (the lines
    are parallel) or infinitely many (the lines are the same). For a₁x + b₁y + c₁ = 0 and
    a₂x + b₂y + c₂ = 0: one solution if a₁/a₂ ≠ b₁/b₂; none if a₁/a₂ = b₁/b₂ ≠ c₁/c₂; infinitely many if all
    three ratios are equal. Solve by graphing (read the crossing point), substitution (make one letter the
    subject and put it into the other equation) or elimination (add or subtract to remove one letter).
  explanations:
    text: 'One equation like x + y = 10 has endless solutions. Add a second, x − y = 2, and only one pair works for both: x = 6, y = 4. On a graph, that pair is where the two lines cross. If the lines are parallel there''s no answer; if they are the same line, every point works.'
    visual: 'Draw x + y = 10 through (0, 10) and (10, 0). Draw x − y = 2 through (2, 0) and (6, 4). They cross at (6, 4): the one point on both lines, the solution of the pair.'
    step_by_step: 'Step 1: Line up the equations. Step 2: To eliminate y, add or subtract them (make the y-numbers match first). Step 3: Solve for x. Step 4: Put x back into one equation to find y. Step 5: Check in both equations.'
    real_world: '2 pens and 3 pencils cost ₹46; 1 pen and 1 pencil cost ₹18. Two equations, two unknowns: a pen costs ₹8 and a pencil ₹10. Shopkeepers'' puzzles like this are pairs of equations.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 11
    points:
      _A:
      - 0
      - 10
      _B:
      - 10
      - 0
      _C:
      - 2
      - 0
      _D:
      - 9
      - 7
      P:
      - 6
      - 4
    segments:
    - - _A
      - _B
      - x + y = 10
    - - _C
      - _D
      - x − y = 2
    caption: The lines cross at P(6, 4), the solution of both equations.
    alt: The lines x + y = 10 and x − y = 2 drawn on a grid, crossing at the point (6, 4).
  activity:
    type: sort
    prompt: How many solutions does each pair of equations have? Compare a₁/a₂, b₁/b₂ and c₁/c₂.
    bins:
    - Exactly one
    - None
    - Infinitely many
    items:
    - label: x + y = 5 and 2x + 2y = 10
      bin: Infinitely many
      clue: Is the second just the first multiplied by something?
      why: 'The second is the first × 2: the same line, so every point on it is a solution.'
    - label: x + y = 5 and x + y = 7
      bin: None
      clue: Can two numbers add to 5 and 7 at once?
      why: 'Same slope, different constants: parallel lines that never meet.'
    - label: x + y = 5 and x − y = 1
      bin: Exactly one
      clue: Compare 1/1 with 1/(−1). Equal?
      why: 'a₁/a₂ ≠ b₁/b₂: the lines cross once, at (3, 2).'
    - label: 2x + 3y = 6 and 4x + 6y = 15
      bin: None
      clue: a and b both double. Does c double too?
      why: 'a and b double but 6 doesn''t become 15: parallel lines, no solution.'
    - label: 3x − y = 2 and 6x − 2y = 4
      bin: Infinitely many
      clue: Is every number doubled, constants too?
      why: 'Everything doubles, so it''s the same line: infinitely many solutions.'
    - label: y = 2x + 1 and y = 3x + 1
      bin: Exactly one
      clue: Are the slopes the same?
      why: Different slopes, so the lines cross once (at (0, 1)), even though they share the same intercept.
    - label: y = 2x + 1 and y = 2x − 4
      bin: None
      clue: Same slope? Same intercept?
      why: 'Same slope, different intercepts: parallel, so no solution.'
    - label: x = 3 and y = 3
      bin: Exactly one
      clue: One line is upright, one is flat. Do they meet?
      why: 'An upright line and a flat line always cross once: at (3, 3).'
  items:
  - prompt: Solve x + y = 10 and x − y = 2. What is x?
    answer: '6'
    check: (10 + 2)/2
    difficulty: 1
    hints:
    - 'Add the two equations: 2x = 12.'
    - Divide by 2.
    solution: 'Step 1: Adding: 2x = 12. Step 2: x = 6 (and then y = 4).'
    mistakes:
      '12': forgot_divide
  - prompt: Solve y = 2x and x + y = 9. What is y?
    answer: '6'
    check: 2*3
    difficulty: 1
    hints:
    - 'Substitute y = 2x into the second: x + 2x = 9.'
    - x = 3.
    solution: 'Step 1: 3x = 9, x = 3. Step 2: y = 2 × 3 = 6.'
    mistakes:
      '3': pair_found_one_value
  - prompt: How many solutions does the pair 2x + 3y = 6 and 4x + 6y = 15 have?
    options:
    - None
    - One
    - Two
    - Infinitely many
    answer: None
    difficulty: 2
    hints:
    - Compare the ratios 2/4, 3/6 and 6/15.
    - The first two are equal, the third is not.
    solution: 'Step 1: 2/4 = 3/6 = 1/2, but 6/15 = 2/5. Step 2: Same slope, different line: parallel lines, no solution.'
    mistakes:
      Infinitely many: pair_parallel_no_solution
  - prompt: Solve 3x + 2y = 16 and x + 2y = 8. What is x?
    answer: '4'
    check: (16 - 8)/(3 - 1)
    difficulty: 2
    hints:
    - 'Subtract the second from the first: the 2y disappears.'
    - 2x = 8.
    solution: 'Step 1: (3x + 2y) − (x + 2y) = 16 − 8, so 2x = 8. Step 2: x = 4 (then y = 2).'
    mistakes:
      '6': elimination_sign
  - prompt: 2 pens and 3 pencils cost ₹46. 1 pen and 1 pencil cost ₹18. What does one pencil cost, in ₹?
    answer: '10'
    check: 46 - 2*18
    difficulty: 2
    hints:
    - 'Double the second: 2 pens + 2 pencils = ₹36.'
    - Subtract from the first.
    solution: 'Step 1: 2p + 2q = 36. Step 2: Subtract from 2p + 3q = 46: q = 10. A pencil costs ₹10 (and a pen ₹8).'
    mistakes: {"8": "pair_found_one_value", "28": "eliminate_pen"}
  - prompt: For which value of k do 2x + ky = 5 and 4x + 6y = 7 have no solution?
    answer: '3'
    check: 6*2/4
    difficulty: 3
    hints:
    - No solution means a₁/a₂ = b₁/b₂ ≠ c₁/c₂.
    - 2/4 = k/6.
    solution: 'Step 1: 2/4 = k/6 gives k = 3. Step 2: Check 5/7 ≠ 1/2, so the lines are parallel and distinct: no solution.'
    mistakes: {"6": "no_solution_ratio", "12": "no_solution_ratio"}
