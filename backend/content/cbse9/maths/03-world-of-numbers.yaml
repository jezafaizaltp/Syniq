# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 3. Format: content/README.md.
subject: cbse9-math
chapter: 3
title: The World of Numbers
tips:
  recurring_digits_count: Count how many digits repeat. One repeating digit means multiply by 10; two repeating digits means multiply by 100.
  irrational_root_of_square: The square root of a perfect square, like √9 = 3, is a whole number, so it is rational.
  sqrt_spiral_add: Each new triangle adds a side of 1 to the last hypotenuse √n, so the new hypotenuse is √(n + 1), not √n + 1.
  always_another_between: "Between any two fractions you can find their average, and then another between that and either end. Does that ever stop?"
  contradiction_start: "A proof by contradiction starts by assuming the opposite of what you want to prove, then shows it leads to nonsense."
  diagonal_root_two: "Use Pythagoras on the square: diagonal² = 1² + 1². The compass carries that diagonal length to the number line."
  irrational_decimal: "Rational numbers end or repeat. An irrational one is the opposite on both counts."
  long_division_decimal: "Divide the top by the bottom: 1 ÷ 8. Keep adding zeros and dividing until it stops."
  lowest_terms_clash: "We assumed p/q was in lowest terms. Look at what the proof shows about p and q: can both share a factor if they're in lowest terms?"
  odd_squared_odd: "Try it: 3², 5², 7². What do odd numbers give when squared? So what must p be if p² is even?"
  partly_recurring: "Only the 3 repeats, not the 2. Multiply by 10 and by 100 so the repeating parts line up, subtract, then simplify."
  rational_perfect_square: "A square root is rational when the number inside is a perfect square. Which one comes out as a whole number?"
  rational_plus_irrational: "If √2 + 3 were rational, subtracting 3 would make √2 rational. Is it?"
  simplify_root_first: "Simplify each square root first. If the inside is a perfect square (or a fraction of perfect squares), the root is rational."
concepts:
- code: cbse9gm.numbers.rational_irrational
  title: Rational and irrational numbers
  notes: |
    Natural numbers, whole numbers, integers and rational numbers (p/q, q ≠ 0) are introduced on the
    number line. Irrational numbers such as √2, √3 and π cannot be written as p/q. Rational and irrational
    numbers together make the real numbers; every real number is a point on the number line. Between any
    two rational numbers there are infinitely many rational numbers (for example their average).
  explanations:
    text: 'A rational number can be written as one whole number over another, like 3/4, −5 (= −5/1) or 0.25 (= 1/4). An irrational number can''t: √2 = 1.41421356… goes on forever without repeating. Together they are the real numbers, and every real number has its own point on the number line.'
    visual: 'Draw a number line. Mark 0, 1, 2 and then 1/2 halfway between 0 and 1. To find √2, draw a square with side 1 on the line from 0: its diagonal is √2. Swing the diagonal down onto the line with a compass and mark where it lands, a little after 1.4. That point is real, but no fraction lands exactly there.'
    step_by_step: 'Step 1: Ask: can it be written as p/q with whole numbers p and q, and q not 0? Step 2: Whole numbers and integers: yes, put them over 1. Step 3: Terminating or repeating decimals: yes. Step 4: Square roots of non-square numbers, and π: no, they are irrational. Step 5: Rational and irrational together are the real numbers.'
    real_world: 'You can share 3 rotis between 4 people: each gets 3/4, a rational amount. But the diagonal of a 1 metre square tile is √2 metres, and no ruler can mark it exactly as a fraction, however fine its marks are.'
  picture:
    kind: number_line
    from: -2
    to: 4
    step: 1
    points:
    - at: -1.5
      label: −3/2
    - at: 0.5
      label: 1/2
    - at: 1.41421
      label: √2
    - at: 3.14159
      label: π
    caption: −3/2 and 1/2 are rational. √2 and π are irrational, but they still have their own points.
    alt: A number line from −2 to 4 with points at −3/2, 1/2, √2 (just after 1.4) and π (just after 3.1).
  activity:
    type: sort
    prompt: Can it be written as p/q with whole numbers p and q (q not 0)?
    bins:
    - Rational
    - Irrational
    items:
    - label: √16
      bin: Rational
      clue: What is √16 exactly?
      why: √16 = 4 = 4/1, so it is rational. Square roots of perfect squares are whole numbers.
    - label: √2
      bin: Irrational
      clue: Is there a fraction that squares to exactly 2?
      why: 'No fraction squares to 2, so √2 can''t be p/q: irrational.'
    - label: π
      bin: Irrational
      clue: Does its decimal ever end or settle into a repeat?
      why: π = 3.14159… never ends or repeats, so it can't be p/q.
    - label: 22/7
      bin: Rational
      clue: Look at how it is written. Is it already p/q?
      why: 22/7 is p/q, so rational. It is only close to π, which is irrational.
    - label: 0.333…
      bin: Rational
      clue: Does a block of digits repeat forever?
      why: 0.333… = 1/3. A recurring decimal is always p/q.
    - label: 0.101001000100001…
      bin: Irrational
      clue: Is there one block that repeats, or does the gap keep growing?
      why: 'The zeros keep growing, so no block repeats: non-terminating, non-recurring, irrational.'
    - label: '3.14'
      bin: Rational
      clue: Does this decimal stop?
      why: 3.14 stops, so it is 314/100. It is not π, just a rational number close to it.
    - label: √2 × √2
      bin: Rational
      clue: Work it out first. What is √2 × √2?
      why: √2 × √2 = 2 = 2/1. Two irrationals can multiply to a rational.
    - label: −5
      bin: Rational
      clue: Can a negative whole number be a fraction?
      why: −5 = −5/1. Every integer is rational.
    - label: 2√3
      bin: Irrational
      clue: If 2√3 were p/q, what would √3 be?
      why: If 2√3 were p/q, √3 would be p/(2q), a fraction. √3 isn't, so 2√3 is irrational.
  items:
  - prompt: Which of these is irrational?
    options:
    - √5
    - √16
    - '0.75'
    - −3
    answer: √5
    difficulty: 1
    hints:
    - Can each number be written as p/q?
    - √16 = 4, so it is rational.
    solution: 'Step 1: √16 = 4, 0.75 = 3/4 and −3 = −3/1 are all rational. Step 2: 5 is not a perfect square, so √5 cannot be written as p/q. It is irrational.'
    mistakes:
      √16: irrational_root_of_square
  - prompt: Which of these is rational?
    options:
    - √49
    - √7
    - π
    - √2 + 1
    answer: √49
    difficulty: 1
    hints:
    - Which square root comes out as a whole number?
    - 7 × 7 = 49.
    solution: 'Step 1: √49 = 7 = 7/1, so it is rational. Step 2: √7, π and √2 + 1 go on forever without repeating.'
    mistakes: {"√7": "rational_perfect_square", "√2 + 1": "rational_perfect_square"}
  - prompt: What is the number exactly halfway between 1/4 and 3/4? Type a fraction like 2/3.
    answer: 1/2
    check: (1/4 + 3/4)/2
    difficulty: 1
    hints:
    - Halfway between two numbers is their average.
    - Add them and divide by 2.
    solution: 'Step 1: 1/4 + 3/4 = 1. Step 2: 1 ÷ 2 = 1/2.'
    mistakes:
      '1': forgot_divide
  - prompt: Which statement is true?
    options:
    - Every integer is a rational number
    - Every rational number is an integer
    - Every real number is rational
    - √9 is irrational
    answer: Every integer is a rational number
    difficulty: 2
    hints:
    - Any integer n can be written as n/1.
    - 1/2 is rational but not an integer.
    solution: 'Step 1: Any integer n = n/1, so it is rational. Step 2: 1/2 is rational but not an integer, √2 is real but not rational, and √9 = 3 is rational.'
    mistakes:
      √9 is irrational: irrational_root_of_square
  - prompt: How many rational numbers are there between 1 and 2?
    options:
    - Infinitely many
    - None
    - Exactly one
    - Exactly nine
    answer: Infinitely many
    difficulty: 2
    hints:
    - 1.5 is one. Is there one between 1 and 1.5?
    - You can always find the average of two numbers.
    solution: 'Step 1: 1.5 is between 1 and 2. Step 2: 1.25 is between 1 and 1.5, 1.125 between 1 and 1.25, and so on for ever. So there are infinitely many.'
    mistakes: {"None": "always_another_between", "Exactly nine": "always_another_between"}
  - prompt: Using a square of side 1 on the number line, its diagonal is swung down from 0. Which number does it mark?
    options:
    - √2
    - '2'
    - '1.5'
    - √3
    answer: √2
    check: sqrt(1^2 + 1^2)
    difficulty: 3
    hints:
    - 'Use Pythagoras on the square: the diagonal² = 1² + 1².'
    - Diagonal² = 2.
    solution: 'Step 1: Diagonal² = 1² + 1² = 2. Step 2: Diagonal = √2. Step 3: The compass marks √2 on the line, about 1.414.'
    mistakes: {"2": "diagonal_root_two", "1.5": "diagonal_root_two"}
- code: cbse9gm.numbers.decimals
  title: Decimal expansions
  after:
  - cbse9gm.numbers.rational_irrational
  notes: |
    The decimal expansion of a rational number either terminates (1/8 = 0.125) or is non-terminating
    recurring (1/3 = 0.333…, 1/7 = 0.142857…). Irrational numbers have non-terminating, non-recurring
    expansions. A recurring decimal can be written as p/q: for x = 0.333…, 10x − x = 3, so x = 1/3;
    for x = 0.1212…, 100x − x = 12, so x = 12/99 = 4/33.
  explanations:
    text: 'Divide to turn a fraction into a decimal. Either the division stops (1/8 = 0.125) or the same digits come back again and again (1/3 = 0.333…). A recurring decimal can be turned back into a fraction: if x = 0.777…, then 10x = 7.777…, and 10x − x = 7, so 9x = 7 and x = 7/9.'
    visual: Write 0.777… on one line and 7.777… (ten times it) directly underneath. Line up the decimal points. Every 7 after the point matches the one above, so subtracting the top from the bottom leaves just 7. That 7 is nine of the original number.
    step_by_step: 'Step 1: Call the recurring decimal x. Step 2: Count the repeating digits: 1 digit, multiply by 10; 2 digits, multiply by 100. Step 3: Subtract x from that. The repeating tails cancel. Step 4: Divide to find x as a fraction. Step 5: Simplify the fraction.'
    real_world: Share ₹10 equally among 3 friends on a phone calculator and you get 3.3333…, the 3s never stop. That is just 10/3 rupees each; in real life someone keeps the extra paisa.
  picture:
    kind: flow
    steps:
    - Let x = 0.777…
    - Then 10x = 7.777…
    - 'Subtract: 10x − x = 7.777… − 0.777…'
    - So 9x = 7
    - x = 7/9
    alt: Five steps turning 0.777… into the fraction 7/9 by subtracting x from 10x.
  activity:
    type: sort
    prompt: Will the decimal stop, repeat a block forever, or do neither?
    bins:
    - Stops
    - Repeats a block
    - Neither
    items:
    - label: 1/8
      bin: Stops
      clue: What primes make up the denominator 8?
      why: '8 = 2 × 2 × 2, only 2s, so it stops: 1/8 = 0.125.'
    - label: 1/7
      bin: Repeats a block
      clue: Does 7 divide into a power of 10?
      why: '7 is not 2 or 5, so the division never finishes: 1/7 = 0.142857 142857…'
    - label: 3/20
      bin: Stops
      clue: Break 20 into primes. Any besides 2 and 5?
      why: '20 = 2 × 2 × 5, so it stops: 3/20 = 0.15.'
    - label: 2/9
      bin: Repeats a block
      clue: Can 9 go into 10, 100 or 1000 exactly?
      why: 9 never divides a power of 10, so 2/9 = 0.222… repeats.
    - label: 7/12
      bin: Repeats a block
      clue: 12 = 2 × 2 × 3. What does the 3 do?
      why: 'The factor 3 means it never ends: 7/12 = 0.58333…'
    - label: 9/75
      bin: Stops
      clue: Simplify the fraction first. What's left in the denominator?
      why: '9/75 = 3/25, and 25 = 5 × 5, so it stops: 0.12.'
    - label: √5
      bin: Neither
      clue: Is √5 a fraction at all?
      why: √5 is irrational, so its decimal never stops and never repeats.
    - label: 0.7272…
      bin: Repeats a block
      clue: Which digits come back again and again?
      why: '''72'' repeats forever. It is 72/99 = 8/11, a rational number.'
    - label: π
      bin: Neither
      clue: Has anyone found a repeating block in π?
      why: 'π is irrational: 3.14159… never stops and never repeats.'
    - label: 1/6
      bin: Repeats a block
      clue: 6 = 2 × 3. Which factor keeps the digits going?
      why: 'The 3 makes it repeat: 1/6 = 0.1666…, with the 6 going on forever.'
  items:
  - prompt: Write 0.777… (the 7 repeats) as a fraction. Type a fraction like 2/3.
    answer: 7/9
    check: 7/9
    difficulty: 1
    hints:
    - Let x = 0.777…, so 10x = 7.777…
    - 10x − x = 7, so 9x = 7.
    solution: 'Step 1: x = 0.777… and 10x = 7.777… Step 2: Subtracting, 9x = 7. Step 3: x = 7/9.'
    mistakes:
      7/10: recurring_digits_count
  - prompt: Write 1/8 as a decimal.
    answer: '0.125'
    check: 1/8
    difficulty: 1
    hints:
    - Divide 1 by 8.
    - 1/8 is half of 1/4 = 0.25.
    solution: 'Step 1: 1 ÷ 8 = 0.125. Step 2: The division stops, so it is a terminating decimal.'
    mistakes: {"0.18": "long_division_decimal", "1.8": "long_division_decimal"}
  - prompt: Which fraction has a terminating decimal expansion?
    options:
    - 3/20
    - 1/3
    - 2/7
    - 5/6
    answer: 3/20
    difficulty: 2
    hints:
    - A fraction in lowest terms terminates when the bottom has only 2s and 5s as factors.
    - 20 = 2 × 2 × 5.
    solution: 'Step 1: 20 = 2² × 5, so 3/20 = 0.15 terminates. Step 2: 3, 7 and 6 (= 2 × 3) have other factors, so those recur.'
    mistakes: {"1/3": "terminating_denominator", "5/6": "terminating_denominator"}
  - prompt: Write 0.4747… (47 repeats) as a fraction in lowest terms. Type a fraction like 2/3.
    answer: 47/99
    check: 47/99
    difficulty: 2
    hints:
    - Two digits repeat, so multiply by 100.
    - 100x − x = 47.
    solution: 'Step 1: x = 0.4747… and 100x = 47.4747… Step 2: Subtracting, 99x = 47. Step 3: x = 47/99, already in lowest terms.'
    mistakes:
      47/9: recurring_digits_count
      47/100: recurring_digits_count
  - prompt: Write 0.2333… (only the 3 repeats) as a fraction in lowest terms. Type a fraction like 2/3.
    answer: 7/30
    check: (23 - 2)/90
    difficulty: 3
    hints:
    - Let x = 0.2333…; then 10x = 2.333… and 100x = 23.333…
    - 100x − 10x = 21, so 90x = 21.
    solution: 'Step 1: 10x = 2.333… and 100x = 23.333… Step 2: Subtracting, 90x = 21. Step 3: x = 21/90 = 7/30.'
    mistakes: {"0.2": "partly_recurring", "0.23": "partly_recurring"}
  - prompt: What kind of decimal expansion does an irrational number have?
    options:
    - Non-terminating and non-recurring
    - Terminating
    - Non-terminating and recurring
    - Always ending in 5
    answer: Non-terminating and non-recurring
    difficulty: 1
    hints:
    - Rational numbers either stop or repeat.
    - Irrational numbers do neither.
    solution: 'Step 1: Rational numbers terminate or recur. Step 2: An irrational number like √2 = 1.41421356… never stops and never repeats.'
    mistakes: {"Non-terminating and recurring": "irrational_decimal", "Terminating": "irrational_decimal"}
- code: cbse9gm.numbers.proof_spiral
  title: Proving √2 is irrational, and the square root spiral
  after:
  - cbse9gm.numbers.rational_irrational
  notes: |
    Proof by contradiction that √2 is irrational: suppose √2 = p/q in lowest terms. Then p² = 2q², so p² is
    even, so p is even; write p = 2k. Then 4k² = 2q², so q² = 2k² and q is even too. But p/q was in lowest
    terms, so p and q can't both be even: contradiction. The same idea shows √3 is irrational (using
    multiples of 3). The square root spiral: start with a right triangle of legs 1 and 1 (hypotenuse √2);
    on each hypotenuse √n build a right triangle with the other leg 1, giving hypotenuse √(n + 1). This
    marks √2, √3, √4 = 2, √5, … as lengths.
  explanations:
    text: 'To prove √2 can''t be a fraction, pretend it is one, p/q, already in lowest terms, and follow the maths: it forces both p and q to be even, which a fraction in lowest terms can''t be. Since pretending led to something impossible, √2 is not a fraction: it is irrational.'
    visual: 'Draw a right triangle with two sides of 1: its long side is √2. On that long side draw another right angle with a side of 1: the new long side is √3. Keep going, turning each time, and the triangles curl into a snail-shell spiral whose spokes are √2, √3, √4, √5…'
    step_by_step: 'Step 1: Suppose √2 = p/q in lowest terms. Step 2: Square: p² = 2q², so p² is even, so p is even. Step 3: Put p = 2k: 4k² = 2q², so q² = 2k² and q is even. Step 4: Both even contradicts lowest terms. Step 5: So √2 is irrational.'
    real_world: 'A detective rules a suspect out by assuming they did it and finding the story impossible: they''d have been in two places at once. Proof by contradiction works the same way.'
  picture:
    kind: flow
    steps:
    - Suppose √2 = p/q in lowest terms
    - 'p² = 2q², so p is even: p = 2k'
    - '4k² = 2q², so q² = 2k²: q is even'
    - 'p and q both even: not lowest terms!'
    - So √2 is irrational
    alt: The five steps of the proof that √2 is irrational, ending in a contradiction.
  activity:
    type: order
    prompt: Put the steps of the proof that √2 is irrational in order.
    steps:
    - Suppose √2 = p/q, in lowest terms
    - 'Square both sides: p² = 2q²'
    - 'So p² is even, which makes p even: p = 2k'
    - 'Put p = 2k in: 4k² = 2q², so q² = 2k²'
    - So q is even too
    - 'p and q both even is not lowest terms: a contradiction'
    reasons:
      'Square both sides: p² = 2q²': You can only square both sides once you've supposed √2 = p/q.
      'So p² is even, which makes p even: p = 2k': p² is even only because p² = 2q², so you need that line first.
      'Put p = 2k in: 4k² = 2q², so q² = 2k²': You can only put in p = 2k after showing p is even.
      So q is even too: q² = 2k² is what shows q² is even. Find that first.
      'p and q both even is not lowest terms: a contradiction': The clash only appears once you know both p and q are even.
  items:
  - prompt: In the proof that √2 is irrational, what do we suppose at the start?
    options:
    - √2 = p/q in lowest terms
    - √2 = 1.414 exactly
    - √2 is even
    - p and q are both even
    answer: √2 = p/q in lowest terms
    difficulty: 1
    hints:
    - Proof by contradiction assumes the opposite.
    - The opposite of 'irrational'.
    solution: 'Step 1: We want to show √2 is not a fraction. Step 2: So we assume it is one, p/q, in lowest terms, and look for a contradiction.'
    mistakes: {"√2 = 1.414 exactly": "contradiction_start", "p and q are both even": "contradiction_start"}
  - prompt: If p² is even, what must be true of p?
    options:
    - p is even
    - p is odd
    - p is a multiple of 4
    - Nothing can be said
    answer: p is even
    difficulty: 1
    hints:
    - What is an odd number squared?
    - 3² = 9, 5² = 25.
    solution: 'Step 1: An odd number squared is odd. Step 2: So if p² is even, p can''t be odd: p is even.'
    mistakes: {"p is odd": "odd_squared_odd", "Nothing can be said": "odd_squared_odd"}
  - prompt: Why does the proof end in a contradiction?
    options:
    - p and q both turn out even, but p/q was in lowest terms
    - p turns out bigger than q
    - √2 turns out negative
    - q turns out to be 0
    answer: p and q both turn out even, but p/q was in lowest terms
    difficulty: 2
    hints:
    - What do we learn about p, and then about q?
    - Lowest terms means no common factor.
    solution: 'Step 1: p is even and q is even, so both share the factor 2. Step 2: That contradicts p/q being in lowest terms.'
    mistakes: {"p turns out bigger than q": "lowest_terms_clash", "√2 turns out negative": "lowest_terms_clash"}
  - prompt: In the square root spiral, a triangle is built on a side of length √4 with the other leg 1. How long is its hypotenuse?
    options:
    - √5
    - '3'
    - '5'
    - √3
    answer: √5
    check: sqrt(5)
    difficulty: 2
    hints:
    - Hypotenuse² = (√4)² + 1².
    - = 5.
    solution: 'Step 1: (√4)² + 1² = 4 + 1 = 5. Step 2: Hypotenuse = √5 ≈ 2.236.'
    mistakes:
      '3': sqrt_spiral_add
  - prompt: Which of these is irrational?
    options:
    - √3
    - √(4/9)
    - √0.25
    - √121
    answer: √3
    difficulty: 2
    hints:
    - Which are perfect squares?
    - √(4/9) = 2/3.
    solution: 'Step 1: √(4/9) = 2/3, √0.25 = 0.5, √121 = 11 are rational. Step 2: 3 is not a perfect square, so √3 is irrational.'
    mistakes: {"√(4/9)": "simplify_root_first", "√0.25": "simplify_root_first"}
  - prompt: Is √2 + 3 rational or irrational?
    options:
    - Irrational
    - Rational
    - It depends on the decimal places
    - It is an integer
    answer: Irrational
    difficulty: 3
    hints:
    - Suppose √2 + 3 = r, a rational number.
    - Then √2 = r − 3.
    solution: 'Step 1: If √2 + 3 were rational, then √2 = (√2 + 3) − 3 would be rational too. Step 2: But √2 is irrational, so √2 + 3 is irrational.'
    mistakes: {"Rational": "rational_plus_irrational", "It depends on the decimal places": "rational_plus_irrational"}
