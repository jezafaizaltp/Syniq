# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 11. Format: content/README.md.
subject: cbse9-math
chapter: 11
title: The World of Algorithms
tips:
  gcd_vs_lcm: The GCD is the biggest number that divides both; it can't be bigger than the smaller number. The LCM is the one that is a multiple of both.
  euclid_stop_early: Keep going until the remainder is 0; the GCD is the last non-zero number (the last divisor).
concepts:
- code: cbse9gm.algo.basics
  title: Algorithms, divisors and the GCD
  notes: |
    An algorithm is a finite list of clear steps that solves every case of a problem, like column addition
    digit by digit with carries. To find the greatest common divisor (GCD) of two numbers, one algorithm
    lists all divisors of each and picks the largest common one; this is slow for big numbers. A good
    algorithm must be correct (we can justify why it always works) and efficient (the number of steps
    grows slowly as the input grows).
  explanations:
    text: 'An algorithm is a recipe: clear steps that always finish and always give the right answer. Column addition is one: add the units, carry, add the tens, carry… One way to find the GCD of 24 and 36 is to list all divisors of each and take the biggest one they share: 12.'
    visual: Write the divisors of 24 in one row (1, 2, 3, 4, 6, 8, 12, 24) and of 36 below (1, 2, 3, 4, 6, 9, 12, 18, 36). Circle the numbers in both rows. The largest circled number, 12, is the GCD.
    step_by_step: 'Step 1: List every divisor of the first number. Step 2: List every divisor of the second. Step 3: Mark the common ones. Step 4: The largest common divisor is the GCD.'
    real_world: 'A recipe that says ''add some salt, cook a while'' is not an algorithm. ''Add 1 teaspoon of salt, cook 10 minutes'' is: anyone following it gets the same result. Computers need instructions that exact.'
  picture:
    kind: compare
    columns:
    - title: Divisors of 24
      points:
      - 1, 2, 3, 4
      - 6, 8
      - 12 ← largest common
      - '24'
    - title: Divisors of 36
      points:
      - 1, 2, 3, 4
      - 6, 9
      - 12 ← largest common
      - 18, 36
    alt: The divisors of 24 and of 36 listed side by side, with 12 as the greatest common divisor.
  items:
  - prompt: Find the GCD of 18 and 24.
    answer: '6'
    check: gcd(18, 24)
    difficulty: 1
    hints:
    - 'Divisors of 18: 1, 2, 3, 6, 9, 18.'
    - Which of these divide 24?
    solution: 'Step 1: Common divisors: 1, 2, 3, 6. Step 2: The largest is 6.'
    mistakes:
      '72': gcd_vs_lcm
  - prompt: Which of these is an algorithm?
    options:
    - Add the units digits, write the units of the sum, carry the tens, repeat for the next column
    - Guess the answer and hope
    - Add the numbers somehow
    - Ask a friend
    answer: Add the units digits, write the units of the sum, carry the tens, repeat for the next column
    difficulty: 1
    hints:
    - An algorithm has exact steps.
    - Anyone following it gets the same answer.
    solution: 'Step 1: Only the column-addition steps are exact and always finish. Step 2: The others are not clear steps.'
  - prompt: How many divisors does 36 have?
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - 'Pair them: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6.'
    - 6 × 6 counts once.
    solution: 'Step 1: Pairs: (1, 36), (2, 18), (3, 12), (4, 9), (6, 6). Step 2: That is 4 × 2 + 1 = 9 divisors.'
  - prompt: Find the GCD of 45 and 75.
    answer: '15'
    check: gcd(45, 75)
    difficulty: 2
    hints:
    - Both are multiples of 5 and of 3.
    - Try 15.
    solution: 'Step 1: 45 = 3 × 15, 75 = 5 × 15. Step 2: 3 and 5 share no factor, so the GCD is 15.'
    mistakes:
      '225': gcd_vs_lcm
      '5': euclid_stop_early
  - prompt: To list divisors of n, you only need to test numbers up to √n. Why?
    options:
    - Divisors come in pairs, and one of each pair is at most √n
    - Numbers above √n are never divisors
    - √n is always prime
    - It is faster to divide by small numbers
    answer: Divisors come in pairs, and one of each pair is at most √n
    difficulty: 3
    hints:
    - 'For 36: 2 pairs with 18, 3 with 12.'
    - If both were bigger than √n, their product would be bigger than n.
    solution: 'Step 1: If d divides n, so does n/d. Step 2: They can''t both be more than √n, or the product would be more than n. So testing up to √n finds every pair.'
  - prompt: Two numbers have GCD 1. What are they called?
    options:
    - Co-prime
    - Prime
    - Even
    - Square
    answer: Co-prime
    difficulty: 2
    hints:
    - They share no factor except 1.
    - 8 and 15 are an example.
    solution: 'Step 1: GCD 1 means no common factor other than 1. Step 2: Such numbers are co-prime (they need not be prime themselves: 8 and 15).'
- code: cbse9gm.algo.euclid
  title: Euclid's algorithm for the GCD
  after:
  - cbse9gm.algo.basics
  notes: |
    Euclid's algorithm: the GCD of a and b (a > b) is the same as the GCD of b and a − b, because any number
    dividing a and b also divides their difference. Repeated subtraction can be shortened to division with
    remainder: GCD(a, b) = GCD(b, r) where r is the remainder of a ÷ b. Stop when the remainder is 0; the last
    divisor is the GCD. It needs far fewer steps than listing divisors.
  explanations:
    text: 'Euclid noticed that whatever divides two numbers also divides their difference. So GCD(48, 18) = GCD(18, 30)… or faster, use remainders: 48 ÷ 18 leaves 12, 18 ÷ 12 leaves 6, 12 ÷ 6 leaves 0. The last divisor, 6, is the GCD.'
    visual: 'Draw a 48 by 18 rectangle. Cut off as many 18 × 18 squares as fit: two, leaving a 12 × 18 strip. Cut 12 × 12 squares from that: one, leaving 12 × 6. Cut 6 × 6 squares: exactly two, nothing left. 6 is the biggest square tile that fills the whole rectangle: the GCD.'
    step_by_step: 'Step 1: Divide the bigger number by the smaller and find the remainder. Step 2: Replace the pair with (smaller, remainder). Step 3: Repeat until the remainder is 0. Step 4: The last divisor is the GCD.'
    real_world: 'A tiler with a 48 cm × 18 cm space wants the largest square tiles that fit exactly with no cutting: Euclid''s algorithm gives 6 cm.'
  picture:
    kind: flow
    steps:
    - 48 = 2 × 18 + 12
    - 18 = 1 × 12 + 6
    - 12 = 2 × 6 + 0
    - GCD(48, 18) = 6
    alt: Euclid's algorithm on 48 and 18 with remainders 12, 6 and 0, giving GCD 6.
  items:
  - prompt: In Euclid's algorithm for 48 and 18, what is the first remainder?
    answer: '12'
    check: 48 - 2*18
    difficulty: 1
    hints:
    - 18 goes into 48 twice.
    - 48 − 36.
    solution: 'Step 1: 48 = 2 × 18 + 12. The remainder is 12.'
  - prompt: Use Euclid's algorithm to find GCD(84, 36).
    answer: '12'
    check: gcd(84, 36)
    difficulty: 1
    hints:
    - 84 = 2 × 36 + 12.
    - 36 = 3 × 12 + 0.
    solution: 'Step 1: 84 = 2 × 36 + 12. Step 2: 36 = 3 × 12 + 0. Step 3: GCD = 12.'
  - prompt: Find GCD(391, 299).
    answer: '23'
    check: gcd(391, 299)
    difficulty: 2
    hints:
    - 391 = 1 × 299 + 92.
    - 299 = 3 × 92 + 23.
    solution: 'Step 1: 391 = 299 + 92. Step 2: 299 = 3 × 92 + 23. Step 3: 92 = 4 × 23 + 0. GCD = 23.'
    mistakes:
      '92': euclid_stop_early
  - prompt: Why does any number that divides a and b also divide a − b?
    options:
    - If a = dm and b = dn, then a − b = d(m − n)
    - Because a − b is always smaller
    - Because a and b are prime
    - It only works for even numbers
    answer: If a = dm and b = dn, then a − b = d(m − n)
    difficulty: 2
    hints:
    - Write a and b as multiples of d.
    - Take d out as a common factor.
    solution: 'Step 1: a = dm, b = dn. Step 2: a − b = d(m − n), a multiple of d.'
  - prompt: A hall is 72 m by 30 m. What is the largest square tile side (in m) that covers it exactly?
    answer: '6'
    check: gcd(72, 30)
    difficulty: 2
    hints:
    - The tile side must divide 72 and 30.
    - 72 = 2 × 30 + 12; 30 = 2 × 12 + 6; 12 = 2 × 6.
    solution: 'Step 1: Euclid: 72 → 30 → 12 → 6 → 0. Step 2: GCD = 6, so 6 m tiles.'
    mistakes:
      '360': gcd_vs_lcm
  - prompt: Why is Euclid's algorithm better than listing all divisors for very large numbers?
    options:
    - It needs far fewer steps, because the numbers shrink quickly
    - It gives a bigger GCD
    - It works without division
    - Listing divisors gives the wrong answer
    answer: It needs far fewer steps, because the numbers shrink quickly
    difficulty: 3
    hints:
    - Think about efficiency.
    - Each remainder is smaller than the divisor.
    solution: 'Step 1: Both give the same GCD. Step 2: Euclid''s remainders shrink fast, so even 10-digit numbers take only a few dozen steps, while listing divisors could take millions.'
