# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 11. Format: content/README.md.
subject: cbse9-math
chapter: 11
title: The World of Algorithms
tips:
  gcd_vs_lcm: The GCD is the biggest number that divides both; it can't be bigger than the smaller number. The LCM is the one that is a multiple of both.
  euclid_stop_early: Keep going until the remainder is 0; the GCD is the last non-zero number (the last divisor).
  algorithm_exact_steps: "An algorithm is a list of exact steps that always finishes and always gives the answer. Which choice is like that?"
  common_factor_out: "If d divides both, write a = d × m and b = d × n. What do you get when you subtract?"
  coprime_meaning: "GCD 1 means two numbers share no factor except 1. They don't have to be prime themselves: think of 9 and 10. The name says they are prime 'together'."
  divisor_pair_root: "Divisors come in pairs d and n/d. If both were bigger than √n, their product would be bigger than n."
  divisor_pairs: "List the divisors in pairs that multiply to 36. A square number has one pair where both are the same: count it once."
  euclid_continue: "Divide, keep the remainder, then divide the old divisor by it. Stop when the remainder is 0."
  euclid_remainder: "Divide the big number by the small one: how many whole 18s fit in 48, and what is left?"
  euclid_speed: "Both methods give the same GCD. Think about how many steps each needs when the numbers are huge."
concepts:
- code: cbse9gm.algo.basics
  title: Algorithms, divisors and the GCD
  notes: |
    An algorithm is a finite list of clear steps that solves every case of a problem, like column addition
    digit by digit with carries. To find the greatest common divisor (GCD) of two numbers, one algorithm
    lists all divisors of each and picks the largest common one; this is slow for big numbers. A good
    algorithm must be correct (we can justify why it always works) and efficient (the number of steps
    grows slowly as the input grows).
  explanations:
    text: 'An algorithm is a recipe: clear steps that always finish and always give the right answer. Column addition is one: add the units, carry, add the tens, carry… One way to find the GCD of 24 and 36 is to list all divisors of each and take the biggest one they share: 12.'
    visual: Write the divisors of 24 in one row (1, 2, 3, 4, 6, 8, 12, 24) and of 36 below (1, 2, 3, 4, 6, 9, 12, 18, 36). Circle the numbers in both rows. The largest circled number, 12, is the GCD.
    step_by_step: 'Step 1: List every divisor of the first number. Step 2: List every divisor of the second. Step 3: Mark the common ones. Step 4: The largest common divisor is the GCD.'
    real_world: 'A recipe that says ''add some salt, cook a while'' is not an algorithm. ''Add 1 teaspoon of salt, cook 10 minutes'' is: anyone following it gets the same result. Computers need instructions that exact.'
  picture:
    kind: compare
    columns:
    - title: Divisors of 24
      points:
      - 1, 2, 3, 4
      - 6, 8
      - 12 ← largest common
      - '24'
    - title: Divisors of 36
      points:
      - 1, 2, 3, 4
      - 6, 9
      - 12 ← largest common
      - 18, 36
    alt: The divisors of 24 and of 36 listed side by side, with 12 as the greatest common divisor.
  activity:
    type: order
    prompt: An algorithm is a list of clear steps. Put the steps of column addition for 487 + 256 in order.
    steps:
    - 'Add the ones: 7 + 6 = 13'
    - Write 3 in the ones, carry 1 to the tens
    - 'Add the tens and the carry: 8 + 5 + 1 = 14'
    - Write 4 in the tens, carry 1 to the hundreds
    - 'Add the hundreds and the carry: 4 + 2 + 1 = 7'
    - 'Write 7 in the hundreds: the answer is 743'
    reasons:
      Write 3 in the ones, carry 1 to the tens: You can't write or carry anything until the ones are added.
      'Add the tens and the carry: 8 + 5 + 1 = 14': The tens need the carry from the ones, so the ones must be finished first.
      Write 4 in the tens, carry 1 to the hundreds: You need the tens total, 14, before you know what to write and carry.
      'Add the hundreds and the carry: 4 + 2 + 1 = 7': The hundreds need the carry from the tens column.
      'Write 7 in the hundreds: the answer is 743': The last digit comes only after the hundreds are added.
  lesson:
    - teach: 'An algorithm is a finite list of clear steps that solves every case of a problem. Column addition is one: add the units, write the units digit, carry the tens, move left, repeat. A recipe that says ''add some salt'' is not exact enough to be an algorithm.'
      check:
        prompt: Which is an algorithm?
        options:
        - To double a number, add it to itself
        - Think hard until you see the answer
        - Guess a number you like
        answer: To double a number, add it to itself
        why: It is a clear step that works for every number.
    - teach: 'The greatest common divisor (GCD) of two numbers is the biggest number that divides both. One algorithm: list the divisors of each, then pick the largest common one. Divisors of 12: 1, 2, 3, 4, 6, 12. Of 18: 1, 2, 3, 6, 9, 18. GCD = 6.'
      picture:
        kind: compare
        columns:
        - title: Divisors of 12
          points:
          - 1, 2, 3, 4, 6, 12
        - title: Divisors of 18
          points:
          - 1, 2, 3, 6, 9, 18
        - title: Common
          points:
          - 1, 2, 3, 6
          - 'Greatest: 6'
        alt: Divisors of 12 and of 18 listed side by side; the common ones are 1, 2, 3, 6 and the greatest is 6.
      check:
        prompt: What is the GCD of 8 and 20?
        options:
        - '4'
        - '2'
        - '40'
        answer: '4'
        why: 'Divisors of 8: 1, 2, 4, 8. Of 20: 1, 2, 4, 5, 10, 20. Largest common: 4.'
    - teach: 'Divisors come in pairs: 36 = 1 × 36 = 2 × 18 = 3 × 12 = 4 × 9 = 6 × 6. One number of each pair is at most √36 = 6, so you only need to test up to √n. Still, for huge numbers listing is slow. A good algorithm is correct AND efficient.'
      check:
        prompt: To list the divisors of 100, up to which number must you test?
        options:
        - '10'
        - '50'
        - '100'
        answer: '10'
        why: √100 = 10; each divisor above 10 pairs with one below.
  items:
  - prompt: Find the GCD of 18 and 24.
    answer: '6'
    check: gcd(18, 24)
    difficulty: 1
    hints:
    - 'Divisors of 18: 1, 2, 3, 6, 9, 18.'
    - Which of these divide 24?
    solution: 'Step 1: Common divisors: 1, 2, 3, 6. Step 2: The largest is 6.'
    mistakes:
      '72': gcd_vs_lcm
  - prompt: Which of these is an algorithm?
    options:
    - Add the units digits, write the units of the sum, carry the tens, repeat for the next column
    - Guess the answer and hope
    - Add the numbers somehow
    - Ask a friend
    answer: Add the units digits, write the units of the sum, carry the tens, repeat for the next column
    difficulty: 1
    hints:
    - An algorithm has exact steps.
    - Anyone following it gets the same answer.
    solution: 'Step 1: Only the column-addition steps are exact and always finish. Step 2: The others are not clear steps.'
    mistakes: {"Add the numbers somehow": "algorithm_exact_steps", "Guess the answer and hope": "algorithm_exact_steps"}
  - prompt: How many divisors does 36 have?
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - 'Pair them: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6.'
    - 6 × 6 counts once.
    solution: 'Step 1: Pairs: (1, 36), (2, 18), (3, 12), (4, 9), (6, 6). Step 2: That is 4 × 2 + 1 = 9 divisors.'
    mistakes: {"10": "divisor_pairs", "8": "divisor_pairs"}
  - prompt: Find the GCD of 45 and 75.
    answer: '15'
    check: gcd(45, 75)
    difficulty: 2
    hints:
    - Both are multiples of 5 and of 3.
    - Try 15.
    solution: 'Step 1: 45 = 3 × 15, 75 = 5 × 15. Step 2: 3 and 5 share no factor, so the GCD is 15.'
    mistakes:
      '225': gcd_vs_lcm
      '5': euclid_stop_early
  - prompt: To list divisors of n, you only need to test numbers up to √n. Why?
    options:
    - Divisors come in pairs, and one of each pair is at most √n
    - Numbers above √n are never divisors
    - √n is always prime
    - It is faster to divide by small numbers
    answer: Divisors come in pairs, and one of each pair is at most √n
    difficulty: 3
    hints:
    - 'For 36: 2 pairs with 18, 3 with 12.'
    - If both were bigger than √n, their product would be bigger than n.
    solution: 'Step 1: If d divides n, so does n/d. Step 2: They can''t both be more than √n, or the product would be more than n. So testing up to √n finds every pair.'
    mistakes: {"Numbers above √n are never divisors": "divisor_pair_root", "√n is always prime": "divisor_pair_root"}
  - prompt: Two numbers have GCD 1. What are they called?
    options:
    - Co-prime
    - Prime
    - Even
    - Square
    answer: Co-prime
    difficulty: 2
    hints:
    - They share no factor except 1.
    - 8 and 15 are an example.
    solution: 'Step 1: GCD 1 means no common factor other than 1. Step 2: Such numbers are co-prime (they need not be prime themselves: 8 and 15).'
    mistakes: {"Prime": "coprime_meaning", "Square": "coprime_meaning"}
  - prompt: Find the GCD of 12 and 30.
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'List divisors of 12: 1, 2, 3, 4, 6, 12.'
    - Which of those divide 30?
    solution: Common divisors are 1, 2, 3, 6. The greatest is 6.
    mistakes:
      '60': gcd_vs_lcm
      '3': gcd_vs_lcm
  - prompt: How many divisors does 12 have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'Pair them: 1 × 12, 2 × 6, 3 × 4.'
    - Count both numbers in each pair.
    solution: '1, 2, 3, 4, 6, 12: six divisors.'
    mistakes:
      '3': divisor_pairs
      '4': divisor_pairs
  - prompt: Find the GCD of 14 and 15.
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - 14 = 2 × 7, 15 = 3 × 5.
    - Do they share any prime?
    solution: No common prime factor, so the GCD is 1; they are co-prime.
    mistakes:
      '210': gcd_vs_lcm
      '0': coprime_meaning
  - prompt: Find the GCD of 24 and 36.
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - Both are multiples of 12.
    - 'Check: does any bigger number divide both?'
    solution: Divisors of 24 include 12; 36 = 3 × 12. Nothing bigger divides 24 and 36, so GCD = 12.
    mistakes:
      '6': gcd_vs_lcm
      '72': gcd_vs_lcm
  - prompt: How many divisors does 49 have?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 49 = 7 × 7.
    - The pair 7 × 7 gives only one new divisor.
    solution: '1, 7, 49: three divisors. A square number has an odd number of divisors.'
    mistakes:
      '4': divisor_pair_root
      '2': divisor_pairs
  - prompt: Which pair of numbers is co-prime?
    options:
    - 8 and 15
    - 6 and 9
    - 10 and 25
    - 12 and 18
    answer: 8 and 15
    difficulty: 2
    hints:
    - Co-prime means GCD = 1.
    - 8 = 2³, 15 = 3 × 5.
    solution: 8 and 15 share no factor except 1, so they are co-prime.
    mistakes:
      6 and 9: coprime_meaning
  - prompt: A step says 'If the number looks big, divide it by something.' Why is this not a proper algorithm step?
    options:
    - 'It is not exact: ''looks big'' and ''something'' are unclear'
    - It uses division
    - It is too short
    - Algorithms can't use 'if'
    answer: 'It is not exact: ''looks big'' and ''something'' are unclear'
    difficulty: 2
    hints:
    - Could two people follow it and get different results?
    - Each step must be clear.
    solution: An algorithm's steps must be exact so anyone gets the same result. 'Looks big' and 'something' are vague.
    mistakes:
      Algorithms can't use 'if': algorithm_exact_steps
  - prompt: To find all divisors of 144 by testing, what is the largest number you need to test?
    answer: '12'
    check: sqrt(144)
    difficulty: 3
    hints:
    - Divisors pair up around √144.
    - √144 = 12.
    solution: √144 = 12. Each divisor bigger than 12 pairs with one smaller than 12.
    mistakes:
      '72': divisor_pair_root
      '144': divisor_pair_root
  - prompt: Three ropes are 24 m, 36 m and 60 m long. They are cut into pieces of equal length, as long as possible, with nothing left over. How long is each piece, in m?
    answer: '12'
    check: '12'
    difficulty: 3
    hints:
    - The piece length must divide all three lengths.
    - Find the GCD of 24, 36 and 60.
    solution: GCD(24, 36) = 12, and 12 divides 60. So each piece is 12 m.
    mistakes:
      '6': gcd_vs_lcm
      '360': gcd_vs_lcm
- code: cbse9gm.algo.euclid
  title: Euclid's algorithm for the GCD
  after:
  - cbse9gm.algo.basics
  notes: |
    Euclid's algorithm: the GCD of a and b (a > b) is the same as the GCD of b and a − b, because any number
    dividing a and b also divides their difference. Repeated subtraction can be shortened to division with
    remainder: GCD(a, b) = GCD(b, r) where r is the remainder of a ÷ b. Stop when the remainder is 0; the last
    divisor is the GCD. It needs far fewer steps than listing divisors.
  explanations:
    text: 'Euclid noticed that whatever divides two numbers also divides their difference. So GCD(48, 18) = GCD(18, 30)… or faster, use remainders: 48 ÷ 18 leaves 12, 18 ÷ 12 leaves 6, 12 ÷ 6 leaves 0. The last divisor, 6, is the GCD.'
    visual: 'Draw a 48 by 18 rectangle. Cut off as many 18 × 18 squares as fit: two, leaving a 12 × 18 strip. Cut 12 × 12 squares from that: one, leaving 12 × 6. Cut 6 × 6 squares: exactly two, nothing left. 6 is the biggest square tile that fills the whole rectangle: the GCD.'
    step_by_step: 'Step 1: Divide the bigger number by the smaller and find the remainder. Step 2: Replace the pair with (smaller, remainder). Step 3: Repeat until the remainder is 0. Step 4: The last divisor is the GCD.'
    real_world: 'A tiler with a 48 cm × 18 cm space wants the largest square tiles that fit exactly with no cutting: Euclid''s algorithm gives 6 cm.'
  picture:
    kind: flow
    steps:
    - 48 = 2 × 18 + 12
    - 18 = 1 × 12 + 6
    - 12 = 2 × 6 + 0
    - GCD(48, 18) = 6
    alt: Euclid's algorithm on 48 and 18 with remainders 12, 6 and 0, giving GCD 6.
  activity:
    type: number_line
    min: 0
    max: 80
    step: 2
    start: 78
    prompt: Euclid's algorithm for the GCD of 78 and 30. The marker starts at 78 and stays where you leave it.
    goals:
    - prompt: Take 30 away from 78 as many times as it fits. Where do you land?
      target: 18
      hint: Is what's left still 30 or more? Then 30 fits again.
      mistakes:
      - when:
          v: 48
        say: 48 is still bigger than 30, so 30 fits again. Keep taking 30 away until what's left is smaller than 30.
      - when:
          v:
          - 0
          - 16
        say: 'That''s gone too far: 30 no longer fits into what''s left. Stop at the remainder.'
    - prompt: The pair is now 30 and 18. Take 18 from 30 as many times as it fits. Where do you land?
      target: 12
      mistakes:
      - when:
          v: 18
        say: '18 is the smaller number of the new pair. The step works on 30: take 18 from it.'
      - when:
          v:
          - 0
          - 10
        say: 18 fits into 30 only once. What is left after one 18?
    - prompt: The pair is 18 and 12. Keep going until one number divides the other exactly. Mark the GCD.
      target: 6
      mistakes:
      - when:
          v: 12
        say: 12 doesn't divide 18 exactly (6 is left over), so it can't be the GCD. Keep going with the pair 12 and 6.
      - when:
          v: 0
        say: 0 is where the subtraction stops. The GCD is the last number that divided exactly.
      - when:
          v: 2
        say: 2 divides both, but is it the greatest? Finish the steps.
  lesson:
    - teach: 'Euclid noticed: any number that divides both a and b also divides a − b. So GCD(a, b) = GCD(b, a − b). GCD(30, 12) = GCD(12, 18) = GCD(12, 6) = GCD(6, 6) = 6. The numbers keep getting smaller.'
      check:
        prompt: GCD(50, 20) equals which of these?
        options:
        - GCD(20, 30)
        - GCD(50, 70)
        - GCD(20, 2)
        answer: GCD(20, 30)
        why: 50 − 20 = 30, and the GCD doesn't change.
    - teach: Subtracting many times is the same as dividing and keeping the remainder. So GCD(a, b) = GCD(b, r), where r is the remainder of a ÷ b. Repeat until the remainder is 0; the last divisor is the GCD.
      picture:
        kind: flow
        steps:
        - GCD(252, 105)
        - 252 = 2 × 105 + 42
        - 105 = 2 × 42 + 21
        - 42 = 2 × 21 + 0
        - GCD = 21
        alt: 'Euclid''s algorithm for 252 and 105: remainders 42, 21, 0, so the GCD is 21.'
      check:
        prompt: What is the remainder when 100 is divided by 36?
        options:
        - '28'
        - '64'
        - '2'
        answer: '28'
        why: 100 = 2 × 36 + 28.
    - teach: 'Euclid''s algorithm is fast: the numbers shrink quickly, so even huge numbers need only a few steps, while listing divisors would take ages. It solves real problems like the largest tile that fits a floor exactly.'
      check:
        prompt: In Euclid's algorithm, when do you stop?
        options:
        - When the remainder is 0
        - When the remainder is 1
        - After three steps
        answer: When the remainder is 0
        why: Then the last divisor is the GCD.
  items:
  - prompt: In Euclid's algorithm for 48 and 18, what is the first remainder?
    answer: '12'
    check: 48 - 2*18
    difficulty: 1
    hints:
    - 18 goes into 48 twice.
    - 48 − 36.
    solution: 'Step 1: 48 = 2 × 18 + 12. The remainder is 12.'
    mistakes: {"2": "euclid_remainder", "30": "euclid_remainder"}
  - prompt: Use Euclid's algorithm to find GCD(84, 36).
    answer: '12'
    check: gcd(84, 36)
    difficulty: 1
    hints:
    - 84 = 2 × 36 + 12.
    - 36 = 3 × 12 + 0.
    solution: 'Step 1: 84 = 2 × 36 + 12. Step 2: 36 = 3 × 12 + 0. Step 3: GCD = 12.'
    mistakes: {"6": "euclid_continue", "252": "gcd_vs_lcm"}
  - prompt: Find GCD(391, 299).
    answer: '23'
    check: gcd(391, 299)
    difficulty: 2
    hints:
    - 391 = 1 × 299 + 92.
    - 299 = 3 × 92 + 23.
    solution: 'Step 1: 391 = 299 + 92. Step 2: 299 = 3 × 92 + 23. Step 3: 92 = 4 × 23 + 0. GCD = 23.'
    mistakes:
      '92': euclid_stop_early
  - prompt: Why does any number that divides a and b also divide a − b?
    options:
    - If a = dm and b = dn, then a − b = d(m − n)
    - Because a − b is always smaller
    - Because a and b are prime
    - It only works for even numbers
    answer: If a = dm and b = dn, then a − b = d(m − n)
    difficulty: 2
    hints:
    - Write a and b as multiples of d.
    - Take d out as a common factor.
    solution: 'Step 1: a = dm, b = dn. Step 2: a − b = d(m − n), a multiple of d.'
    mistakes: {"Because a − b is always smaller": "common_factor_out", "It only works for even numbers": "common_factor_out"}
  - prompt: A hall is 72 m by 30 m. What is the largest square tile side (in m) that covers it exactly?
    answer: '6'
    check: gcd(72, 30)
    difficulty: 2
    hints:
    - The tile side must divide 72 and 30.
    - 72 = 2 × 30 + 12; 30 = 2 × 12 + 6; 12 = 2 × 6.
    solution: 'Step 1: Euclid: 72 → 30 → 12 → 6 → 0. Step 2: GCD = 6, so 6 m tiles.'
    mistakes:
      '360': gcd_vs_lcm
  - prompt: Why is Euclid's algorithm better than listing all divisors for very large numbers?
    options:
    - It needs far fewer steps, because the numbers shrink quickly
    - It gives a bigger GCD
    - It works without division
    - Listing divisors gives the wrong answer
    answer: It needs far fewer steps, because the numbers shrink quickly
    difficulty: 3
    hints:
    - Think about efficiency.
    - Each remainder is smaller than the divisor.
    solution: 'Step 1: Both give the same GCD. Step 2: Euclid''s remainders shrink fast, so even 10-digit numbers take only a few dozen steps, while listing divisors could take millions.'
    mistakes: {"It gives a bigger GCD": "euclid_speed", "Listing divisors gives the wrong answer": "euclid_speed"}
  - prompt: In Euclid's algorithm for 60 and 25, what is the first remainder?
    answer: '10'
    check: 60 % 25
    difficulty: 1
    hints:
    - 60 ÷ 25.
    - 60 = 2 × 25 + ?
    solution: 60 = 2 × 25 + 10, so the remainder is 10.
    mistakes:
      '2': euclid_remainder
      '35': euclid_remainder
  - prompt: Use Euclid's algorithm to find GCD(60, 25).
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 60 = 2 × 25 + 10, then 25 = 2 × 10 + 5.
    - Then 10 = 2 × 5 + 0.
    solution: Remainders 10, 5, 0. The last divisor is 5.
    mistakes:
      '10': euclid_stop_early
      '0': euclid_continue
  - prompt: Use Euclid's algorithm to find GCD(56, 21).
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - 56 = 2 × 21 + 14.
    - 21 = 1 × 14 + 7, then 14 = 2 × 7 + 0.
    solution: Remainders 14, 7, 0. GCD = 7.
    mistakes:
      '14': euclid_stop_early
      '21': euclid_stop_early
  - prompt: Find GCD(1071, 462).
    answer: '21'
    check: '21'
    difficulty: 2
    hints:
    - 1071 = 2 × 462 + 147.
    - 462 = 3 × 147 + 21; 147 = 7 × 21 + 0.
    solution: Remainders 147, 21, 0. GCD = 21.
    mistakes:
      '147': euclid_stop_early
      '7': euclid_continue
  - prompt: Find GCD(144, 89).
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - 144 − 89 = 55, 89 − 55 = 34, …
    - These are Fibonacci numbers; keep going.
    solution: The remainders run 55, 34, 21, 13, 8, 5, 3, 2, 1, 0. GCD = 1.
    mistakes:
      '89': euclid_stop_early
  - prompt: A floor is 360 cm by 150 cm. What is the side of the largest square tile (in cm) that covers it exactly?
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - The tile side must divide both lengths.
    - 360 = 2 × 150 + 60; 150 = 2 × 60 + 30; 60 = 2 × 30.
    solution: GCD(360, 150) = 30, so 30 cm tiles.
    mistakes:
      '60': euclid_stop_early
      '10': gcd_vs_lcm
  - prompt: If d divides both 91 and 35, which of these must d also divide?
    options:
    - '56'
    - '126'
    - '3185'
    - '2'
    answer: '56'
    difficulty: 2
    hints:
    - A common divisor divides the difference.
    - 91 − 35.
    solution: d divides 91 − 35 = 56. (It also divides the sum 126, but 56 is the difference Euclid uses.)
    mistakes:
      '2': common_factor_out
  - prompt: Using Euclid's algorithm, how many divisions are needed for GCD(100, 75)?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - 100 = 1 × 75 + 25.
    - 75 = 3 × 25 + 0.
    solution: 'Two divisions: remainders 25 then 0. GCD = 25.'
    mistakes:
      '3': euclid_speed
      '1': euclid_stop_early
  - prompt: Two bells ring every 84 s and 120 s. The largest unit of time that divides both gaps exactly is what, in s?
    answer: '12'
    check: '12'
    difficulty: 3
    hints:
    - Find GCD(120, 84).
    - 120 = 1 × 84 + 36; 84 = 2 × 36 + 12; 36 = 3 × 12.
    solution: Remainders 36, 12, 0. GCD = 12 s.
    mistakes:
      '36': euclid_stop_early
      '840': gcd_vs_lcm
