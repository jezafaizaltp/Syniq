# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 4. Format: content/README.md.
subject: cbse9-math
chapter: 4
title: Exploring Algebraic Identities
tips:
  factor_theorem_sign: x − a is a factor when p(a) = 0. So for x + 2, test p(−2), not p(2).
  middle_term_split: Look for two numbers that multiply to (first coefficient × constant) and add to the middle coefficient.
  square_missing_middle: '(a + b)² has a middle term 2ab: (a + b)² = a² + 2ab + b², not a² + b².'
  cube_missing_terms: (a + b)³ = a³ + b³ + 3ab(a + b). Don't drop the 3ab(a + b) part.
  cancel_terms_not_factors: You can only cancel a factor that multiplies the whole top and the whole bottom. Factorise first, then cancel.
  a2_minus_b2_factor: "Write each part as a square: 9x² = (3x)², 25 = 5². Then a² − b² = (a + b)(a − b)."
  cancel_after_factor: "Factorise the top first. Only a whole bracket that appears top and bottom can cancel."
  cube_identity: "Write 99 as 100 − 1 and use (a − b)³ = a³ − b³ − 3ab(a − b). Keep every term."
  cubes_sum_zero: "When a + b + c = 0, a³ + b³ + c³ = 3abc. Check that the three numbers add to 0, then multiply."
  diff_of_squares: "Write the two numbers as (a + b) and (a − b) around a round number a, then use a² − b²."
  factor_pair_signs: "Find two numbers that multiply to the last number and add to the middle number. Watch the signs: both must be negative to give + and −."
  factor_theorem_try: "Try small values: if p(1) = 0 then (x − 1) is a factor. Divide it out, then factorise the quadratic left over."
  square_of_sum: "(100 + 5)² = 100² + 2 × 100 × 5 + 5². Don't skip the middle term."
  c9m4_cube_middle: 'A cube of a sum has four terms: x³, then 3x²y, then 3xy², then y³. Check that you have the two middle terms and their 3s.'
  c9m4_sum_zero_link: "The identity x³ + y³ + z³ − 3xyz = (x + y + z)(…) links the cubes to the product xyz. If x + y + z = 0, the right side is 0, but the −3xyz on the left is still there."
concepts:
- code: cbse9gm.poly.identities
  title: Algebraic identities
  after:
  - cbse9gm.poly.factorise
  notes: |
    Identities: (x + y)² = x² + 2xy + y², (x − y)² = x² − 2xy + y², x² − y² = (x + y)(x − y),
    (x + a)(x + b) = x² + (a + b)x + ab, (x + y + z)² = x² + y² + z² + 2xy + 2yz + 2zx,
    (x + y)³ = x³ + y³ + 3xy(x + y), (x − y)³ = x³ − y³ − 3xy(x − y),
    x³ + y³ + z³ − 3xyz = (x + y + z)(x² + y² + z² − xy − yz − zx); so if x + y + z = 0, x³ + y³ + z³ = 3xyz.
    Used for quick calculation, e.g. 104 × 96 = 100² − 4² = 9984 and 99³ = (100 − 1)³.
  explanations:
    text: Identities are shortcuts that are true for every value. (a + b)² = a² + 2ab + b², so 103² = 100² + 2 × 100 × 3 + 3² = 10609. And a² − b² = (a + b)(a − b), so 104 × 96 = (100 + 4)(100 − 4) = 10000 − 16 = 9984.
    visual: 'Draw a square of side a + b and cut it into an a × a square, a b × b square and two a × b rectangles. Their areas add to a² + 2ab + b². That''s why (a + b)² has the middle 2ab: it''s the two rectangles.'
    step_by_step: 'Step 1: Match the expression to an identity: a square of a sum, a difference of squares, a cube… Step 2: Decide what a and b (and c) are. Step 3: Substitute into the identity. Step 4: Simplify each term. Step 5: For numbers, split them around a round number like 100.'
    real_world: A tailor making a square tablecloth adds a 3 cm border to a 100 cm square. The new area is 103² = 10000 + 600 + 9 = 10609 cm², worked out in your head with (a + b)².
  picture:
    kind: area_grid
    cols:
    - size: 3
      label: a
    - size: 1.5
      label: b
    rows:
    - size: 3
      label: a
    - size: 1.5
      label: b
    cells:
    - - a²
      - ab
    - - ab
      - b²
    caption: (a + b)² = a² + ab + ab + b² = a² + 2ab + b²
    alt: A square of side a + b split into an a² square, a b² square and two ab rectangles, showing (a + b)² = a² + 2ab + b².
  activity:
    type: formula
    prompt: Is (a + b)² the same as a² + b²? Change a and b, and watch the extra 2ab.
    inputs:
    - name: a
      label: a
      min: 0
      max: 10
      step: 1
      start: 0
    - name: b
      label: b
      min: 0
      max: 10
      step: 1
      start: 0
    outputs:
    - name: sq
      label: (a + b)²
      expr: (a+b)^2
    - name: parts
      label: a² + b²
      expr: a^2+b^2
    - name: gap
      label: 2ab
      expr: 2*a*b
    goals:
    - prompt: Make (a + b)² = 64 while a² + b² = 34.
      want:
        sq: 64
        parts: 34
      hint: a + b must be 8. Which pair adding to 8 has squares that add to 34?
      mistakes:
      - when:
          sq: 64
        say: (a + b)² = 64 is right, but the square also holds two a × b strips worth 2ab. With a² + b² = 34, those strips must be 30.
      - when:
          parts: 34
        say: 'a² + b² = 34 is right, but (a + b)² is bigger: it adds 2ab. Which pair also has a + b = 8?'
      - when:
          b: 0
        say: With b = 0 there are no strips, so (a + b)² and a² + b² look equal. Use two non-zero parts to see the 2ab.
    - prompt: Now make (a + b)² = 100 and a² + b² = 52.
      want:
        sq: 100
        parts: 52
      mistakes:
      - when:
          sq: 100
        say: a + b = 10 is right. The two strips, 2ab, must make up 100 − 52 = 48 here.
      - when:
          parts: 52
        say: a² + b² = 52 is right, but then a + b must be 10 as well.
  lesson:
    - teach: 'An identity is an equation true for every value of the letters. The most used one: (x + y)² = x² + 2xy + y². Think of a square of side x + y cut into a square x², a square y², and two rectangles xy.'
      picture:
        kind: area_grid
        cols:
        - size: 3
          label: x
        - size: 1
          label: y
        rows:
        - size: 3
          label: x
        - size: 1
          label: y
        cells:
        - - x²
          - xy
        - - xy
          - y²
        alt: A square of side x + y split into x², two xy rectangles and y², showing (x + y)² = x² + 2xy + y².
      check:
        prompt: Expand (x + 3)².
        options:
        - x² + 6x + 9
        - x² + 9
        - x² + 3x + 9
        answer: x² + 6x + 9
        why: x² + 2 × x × 3 + 3² = x² + 6x + 9. The middle 2xy term is the one people forget.
    - teach: 'Two more: (x − y)² = x² − 2xy + y², and x² − y² = (x + y)(x − y). The second is great for quick sums: 51 × 49 = (50 + 1)(50 − 1) = 2500 − 1 = 2499.'
      check:
        prompt: Using x² − y², what is 62 × 58?
        options:
        - '3596'
        - '3600'
        - '3604'
        answer: '3596'
        why: (60 + 2)(60 − 2) = 3600 − 4 = 3596.
    - teach: 'For three terms: (x + y + z)² = x² + y² + z² + 2xy + 2yz + 2zx. For cubes: (x + y)³ = x³ + 3x²y + 3xy² + y³ and (x − y)³ = x³ − 3x²y + 3xy² − y³.'
      check:
        prompt: Expand (a + 2)³.
        options:
        - a³ + 6a² + 12a + 8
        - a³ + 8
        - a³ + 2a² + 4a + 8
        answer: a³ + 6a² + 12a + 8
        why: a³ + 3a²(2) + 3a(2²) + 2³ = a³ + 6a² + 12a + 8.
    - teach: 'One special identity: x³ + y³ + z³ − 3xyz = (x + y + z)(x² + y² + z² − xy − yz − zx). So if x + y + z = 0, then x³ + y³ + z³ = 3xyz. Example: 1³ + 2³ + (−3)³ = 3 × 1 × 2 × (−3) = −18.'
      check:
        prompt: Find 4³ + 1³ + (−5)³ without cubing.
        options:
        - −60
        - '60'
        - '0'
        answer: −60
        why: 4 + 1 − 5 = 0, so the sum is 3 × 4 × 1 × (−5) = −60.
  items:
  - prompt: Using an identity, find 104 × 96.
    answer: '9984'
    check: 104*96
    difficulty: 1
    hints:
    - 104 = 100 + 4 and 96 = 100 − 4.
    - (a + b)(a − b) = a² − b².
    solution: 'Step 1: 104 × 96 = (100 + 4)(100 − 4). Step 2: = 100² − 4² = 10000 − 16 = 9984.'
    mistakes: {"10016": "diff_of_squares", "9996": "diff_of_squares"}
  - prompt: Expand (x + 4)².
    options:
    - x² + 8x + 16
    - x² + 16
    - x² + 4x + 16
    - x² + 8x + 8
    answer: x² + 8x + 16
    check: expand((x + 4)^2)
    difficulty: 1
    hints:
    - (a + b)² = a² + 2ab + b².
    - 2 × x × 4 = 8x.
    solution: 'Step 1: a = x and b = 4. Step 2: x² + 2 × x × 4 + 4² = x² + 8x + 16.'
    mistakes:
      x² + 16: square_missing_middle
  - prompt: Using an identity, find 103².
    answer: '10609'
    check: 103^2
    difficulty: 1
    hints:
    - 103 = 100 + 3.
    - (a + b)² = a² + 2ab + b².
    solution: 'Step 1: 103² = (100 + 3)². Step 2: = 10000 + 600 + 9 = 10609.'
    mistakes:
      '10009': square_missing_middle
  - prompt: Factorise 9x² − 25.
    options:
    - (3x + 5)(3x − 5)
    - (9x + 5)(x − 5)
    - (3x − 5)²
    - (3x + 25)(3x − 1)
    answer: (3x + 5)(3x − 5)
    check: 9x^2 - 25
    difficulty: 2
    hints:
    - 9x² = (3x)² and 25 = 5².
    - a² − b² = (a + b)(a − b).
    solution: 'Step 1: 9x² − 25 = (3x)² − 5². Step 2: = (3x + 5)(3x − 5).'
    mistakes: {"(3x − 5)²": "a2_minus_b2_factor", "(9x + 5)(x − 5)": "a2_minus_b2_factor"}
  - prompt: Expand (x + 2y + 3z)².
    options:
    - x² + 4y² + 9z² + 4xy + 12yz + 6xz
    - x² + 4y² + 9z²
    - x² + 2y² + 3z² + 4xy + 12yz + 6xz
    - x² + 4y² + 9z² + 2xy + 6yz + 3xz
    answer: x² + 4y² + 9z² + 4xy + 12yz + 6xz
    check: expand((x + 2y + 3z)^2)
    difficulty: 2
    hints:
    - (a + b + c)² = a² + b² + c² + 2ab + 2bc + 2ca.
    - a = x, b = 2y, c = 3z.
    solution: 'Step 1: Squares: x², 4y², 9z². Step 2: 2ab = 4xy, 2bc = 12yz, 2ca = 6xz. Step 3: Add them all.'
    mistakes:
      x² + 4y² + 9z²: square_missing_middle
  - prompt: Expand (x + 1)³.
    options:
    - x³ + 3x² + 3x + 1
    - x³ + 1
    - x³ + 3x + 1
    - x³ + x² + x + 1
    answer: x³ + 3x² + 3x + 1
    check: expand((x + 1)^3)
    difficulty: 2
    hints:
    - (a + b)³ = a³ + b³ + 3ab(a + b).
    - 3 × x × 1 × (x + 1) = 3x² + 3x.
    solution: 'Step 1: a³ + b³ = x³ + 1. Step 2: 3ab(a + b) = 3x(x + 1) = 3x² + 3x. Step 3: Total x³ + 3x² + 3x + 1.'
    mistakes:
      x³ + 1: cube_missing_terms
  - prompt: Using an identity, find 99³.
    answer: '970299'
    check: 99^3
    difficulty: 3
    hints:
    - 99 = 100 − 1.
    - (a − b)³ = a³ − b³ − 3ab(a − b).
    solution: 'Step 1: 99³ = (100 − 1)³. Step 2: = 1000000 − 1 − 300 × 99. Step 3: = 1000000 − 1 − 29700 = 970299.'
    mistakes: {"999999": "cube_identity", "970000": "cube_identity"}
  - prompt: Without cubing, find (−12)³ + 7³ + 5³.
    answer: '-1260'
    check: (-12)^3 + 7^3 + 5^3
    difficulty: 3
    hints:
    - −12 + 7 + 5 = 0.
    - If a + b + c = 0, then a³ + b³ + c³ = 3abc.
    solution: 'Step 1: −12 + 7 + 5 = 0. Step 2: So the sum of cubes = 3 × (−12) × 7 × 5. Step 3: = −1260.'
    mistakes: {"0": "cubes_sum_zero", "1260": "cubes_sum_zero"}
  - prompt: Expand (x + 5)².
    options:
    - x² + 10x + 25
    - x² + 25
    - x² + 5x + 25
    - x² + 10x + 10
    answer: x² + 10x + 25
    check: expand((x + 5)^2)
    difficulty: 1
    hints:
    - Use (x + y)² = x² + 2xy + y².
    - 2 × x × 5 = 10x.
    solution: x² + 2(5)x + 25 = x² + 10x + 25.
    mistakes:
      x² + 25: square_missing_middle
  - prompt: Expand (y − 4)².
    options:
    - y² − 8y + 16
    - y² − 16
    - y² + 8y + 16
    - y² − 8y − 16
    answer: y² − 8y + 16
    check: expand((y - 4)^2)
    difficulty: 1
    hints:
    - Use (x − y)² = x² − 2xy + y².
    - (−4)² is positive.
    solution: y² − 2(4)y + 16 = y² − 8y + 16.
    mistakes:
      y² − 16: square_missing_middle
      y² − 8y − 16: square_of_sum
  - prompt: Using an identity, find 47 × 53.
    answer: '2491'
    check: 47*53
    difficulty: 1
    hints:
    - Both are 3 away from 50.
    - (50 − 3)(50 + 3) = 50² − 3².
    solution: 2500 − 9 = 2491.
    mistakes:
      '2509': diff_of_squares
      '2500': diff_of_squares
  - prompt: Using an identity, find 98².
    answer: '9604'
    check: 98**2
    difficulty: 2
    hints:
    - 98 = 100 − 2.
    - (100 − 2)² = 10000 − 400 + 4.
    solution: 10000 − 2(100)(2) + 4 = 9604.
    mistakes:
      '9996': square_missing_middle
      '10004': square_missing_middle
  - prompt: Expand (x + 3)(x + 7).
    options:
    - x² + 10x + 21
    - x² + 21x + 10
    - x² + 21
    - x² + 10x + 10
    answer: x² + 10x + 21
    check: expand((x + 3)*(x + 7))
    difficulty: 2
    hints:
    - (x + a)(x + b) = x² + (a + b)x + ab.
    - a + b = 10, ab = 21.
    solution: x² + (3 + 7)x + 3 × 7 = x² + 10x + 21.
    mistakes:
      x² + 21x + 10: factor_pair_signs
      x² + 21: square_missing_middle
  - prompt: Expand (2x − 1)³.
    options:
    - 8x³ − 12x² + 6x − 1
    - 8x³ − 1
    - 2x³ − 6x² + 6x − 1
    - 8x³ + 12x² + 6x − 1
    answer: 8x³ − 12x² + 6x − 1
    check: expand((2*x - 1)^3)
    difficulty: 2
    hints:
    - (a − b)³ = a³ − 3a²b + 3ab² − b³ with a = 2x, b = 1.
    - a³ = 8x³ and 3a²b = 12x².
    solution: 8x³ − 3(4x²)(1) + 3(2x)(1) − 1 = 8x³ − 12x² + 6x − 1.
    mistakes:
      8x³ − 1: c9m4_cube_middle
      2x³ − 6x² + 6x − 1: cube_identity
  - prompt: If x + y = 7 and xy = 10, find x² + y².
    answer: '29'
    check: 7**2 - 2*10
    difficulty: 3
    hints:
    - (x + y)² = x² + y² + 2xy.
    - 49 = x² + y² + 20.
    solution: x² + y² = 49 − 20 = 29.
    mistakes:
      '49': square_of_sum
      '69': square_of_sum
  - prompt: If a + b + c = 0, what is a³ + b³ + c³?
    options:
    - 3abc
    - '0'
    - abc
    - a + b + c
    answer: 3abc
    difficulty: 3
    hints:
    - Use x³ + y³ + z³ − 3xyz = (x + y + z)(…).
    - The right side becomes 0.
    solution: With a + b + c = 0, a³ + b³ + c³ − 3abc = 0, so a³ + b³ + c³ = 3abc.
    mistakes:
      '0': c9m4_sum_zero_link
  - prompt: Using an identity, find 101³.
    answer: '1030301'
    check: 101**3
    difficulty: 3
    hints:
    - (100 + 1)³ = 100³ + 3(100²)(1) + 3(100)(1) + 1.
    - 1000000 + 30000 + 300 + 1.
    solution: 1000000 + 30000 + 300 + 1 = 1030301.
    mistakes:
      '1000001': c9m4_cube_middle
      '1030001': cube_identity
- code: cbse9gm.poly.factorise
  title: Factor theorem and factorising
  after:
  - cbse9gm.poly.zeroes
  notes: |
    Factor theorem: if p(a) = 0 then x − a is a factor of p(x), and conversely. Quadratics ax² + bx + c are
    factorised by splitting the middle term: find p, q with p + q = b and pq = ac. Cubics: find one zero by
    trial among factors of the constant, then divide or split. NCERT examples: 6x² + 17x + 5 = (3x + 1)(2x + 5),
    x³ − 23x² + 142x − 120 = (x − 1)(x − 10)(x − 12).
  explanations:
    text: 'If putting x = a into a polynomial gives 0, then (x − a) is one of its factors. To factorise x² + 7x + 12, look for two numbers that multiply to 12 and add to 7: 3 and 4. So x² + 7x + 12 = (x + 3)(x + 4).'
    visual: 'Picture x² + 7x + 12 as tiles: one big x × x square, seven x × 1 strips and twelve 1 × 1 squares. Arrange them into a rectangle: it comes out (x + 3) long and (x + 4) wide. Those are the factors.'
    step_by_step: 'Step 1: For ax² + bx + c, work out a × c. Step 2: Find two numbers that multiply to a × c and add to b. Step 3: Split the middle term into those two. Step 4: Group in pairs and take out the common factor. Step 5: Check by multiplying the brackets back out.'
    real_world: 'A rectangular garden has area x² + 7x + 12 square metres. Factorising tells you it could be (x + 3) m by (x + 4) m: for x = 2, that''s 5 m by 6 m = 30 m², and the formula gives 4 + 14 + 12 = 30.'
  picture:
    kind: area_grid
    cols:
    - size: 3
      label: x
    - size: 1.6
      label: + 4
    rows:
    - size: 3
      label: x
    - size: 1.2
      label: + 3
    cells:
    - - x²
      - 4x
    - - 3x
      - '12'
    caption: x² + 4x + 3x + 12 = x² + 7x + 12, so x² + 7x + 12 = (x + 3)(x + 4).
    alt: A rectangle x + 4 wide and x + 3 tall, split into x², 4x, 3x and 12. Together they make x² + 7x + 12.
  activity:
    type: formula
    prompt: 'To factorise ax² + bx + c, split the middle term: find p and q with p + q = b and p × q = a × c.'
    inputs:
    - name: p
      label: p
      min: -10
      max: 30
      step: 1
      start: 0
    - name: q
      label: q
      min: -10
      max: 30
      step: 1
      start: 0
    outputs:
    - name: s
      label: p + q
      expr: p+q
    - name: pr
      label: p × q
      expr: p*q
    goals:
    - prompt: '6x² + 17x + 5: find p and q with p + q = 17 and p × q = 6 × 5 = 30.'
      want:
        s: 17
        pr: 30
      hint: List pairs that multiply to 30. Which pair adds to 17?
      mistakes:
      - when:
          pr: 5
        say: p × q = 5 uses only the last number. With 6x² in front, the product must be 6 × 5 = 30.
      - when:
          pr: 6
        say: 'p × q = 6 uses only the x² number. The product is a × c: 6 × 5.'
      - when:
          s: 17
        say: p + q = 17 is right; now the product must be 30 too.
    - prompt: '2x² + 7x + 3: p + q = 7 and p × q = 6.'
      want:
        s: 7
        pr: 6
      mistakes:
      - when:
          pr: 3
        say: Product 3 forgets the 2 in front of x². It must be 2 × 3.
      - when:
          s: 7
        say: The sum is right; now make the product 6 as well.
    - prompt: 'x² − 5x + 6: p + q = −5 and p × q = 6.'
      want:
        s: -5
        pr: 6
      mistakes:
      - when:
          p: 2
          q: 3
        say: 2 × 3 = 6, but 2 + 3 = +5. To keep the product +6 and make the sum −5, what sign must both have?
      - when:
          p: 3
          q: 2
        say: 3 × 2 = 6, but the sum is +5. Both numbers need the same sign, and the sum is negative.
      - when:
          pr: -6
        say: 'The product is −6: one number is negative and one positive. Since +6 is wanted, both must share a sign.'
  lesson:
    - teach: 'Factorising is expanding in reverse. x² + 5x + 6: find two numbers that multiply to 6 and add to 5. They are 2 and 3, so x² + 5x + 6 = (x + 2)(x + 3).'
      check:
        prompt: Which two numbers multiply to 12 and add to 7?
        options:
        - 3 and 4
        - 2 and 6
        - 1 and 12
        answer: 3 and 4
        why: 3 × 4 = 12 and 3 + 4 = 7.
    - teach: 'When x² has a number in front, split the middle term. 2x² + 7x + 3: multiply 2 × 3 = 6, find numbers multiplying to 6 and adding to 7: 6 and 1. Write 2x² + 6x + x + 3 = 2x(x + 3) + 1(x + 3) = (2x + 1)(x + 3).'
      picture:
        kind: flow
        steps:
        - 2x² + 7x + 3
        - a × c = 6; 6 + 1 = 7
        - 2x² + 6x + x + 3
        - 2x(x + 3) + 1(x + 3)
        - (2x + 1)(x + 3)
        alt: Splitting the middle term of 2x² + 7x + 3 into 6x + x and grouping to get (2x + 1)(x + 3).
      check:
        prompt: To factorise 3x² + 10x + 8, which two numbers do we need?
        options:
        - 6 and 4
        - 8 and 2
        - 3 and 8
        answer: 6 and 4
        why: a × c = 24, and 6 × 4 = 24, 6 + 4 = 10.
    - teach: 'Factor theorem: x − a is a factor of p(x) exactly when p(a) = 0. To test x − 2, work out p(2). To test x + 3, work out p(−3), because x + 3 = x − (−3). For a cubic, try small factors of the constant term to find one zero.'
      check:
        prompt: To check if x + 1 is a factor of p(x), which value do you work out?
        options:
        - p(−1)
        - p(1)
        - p(0)
        answer: p(−1)
        why: x + 1 = x − (−1), so test x = −1.
  items:
  - prompt: Factorise x² + 7x + 12.
    options:
    - (x + 3)(x + 4)
    - (x + 2)(x + 6)
    - (x + 1)(x + 12)
    - (x − 3)(x − 4)
    answer: (x + 3)(x + 4)
    check: x^2 + 7x + 12
    difficulty: 1
    hints:
    - Find two numbers that multiply to 12 and add to 7.
    - 3 × 4 = 12 and 3 + 4 = 7.
    solution: 'Step 1: 3 × 4 = 12 and 3 + 4 = 7. Step 2: x² + 7x + 12 = (x + 3)(x + 4).'
    mistakes:
      (x + 2)(x + 6): middle_term_split
  - prompt: Is (x − 1) a factor of x³ + x² + x − 3?
    options:
    - Yes, because p(1) = 0
    - No, because p(1) = 6
    - No, because p(−1) ≠ 0
    - Yes, because p(0) = −3
    answer: Yes, because p(1) = 0
    difficulty: 1
    hints:
    - 'Use the factor theorem: test p(1).'
    - 1 + 1 + 1 − 3 = ?
    solution: 'Step 1: p(1) = 1 + 1 + 1 − 3 = 0. Step 2: So x − 1 is a factor.'
    mistakes:
      No, because p(−1) ≠ 0: factor_theorem_sign
  - prompt: Factorise x² − 5x + 6.
    options:
    - (x − 2)(x − 3)
    - (x + 2)(x + 3)
    - (x − 1)(x − 6)
    - (x − 2)(x + 3)
    answer: (x − 2)(x − 3)
    check: x^2 - 5x + 6
    difficulty: 2
    hints:
    - Two numbers that multiply to +6 and add to −5.
    - Both must be negative.
    solution: 'Step 1: (−2) × (−3) = 6 and −2 + (−3) = −5. Step 2: x² − 5x + 6 = (x − 2)(x − 3).'
    mistakes: {"(x + 2)(x + 3)": "factor_pair_signs", "(x − 2)(x + 3)": "factor_pair_signs"}
  - prompt: Factorise 6x² + 17x + 5.
    options:
    - (3x + 1)(2x + 5)
    - (6x + 1)(x + 5)
    - (3x + 5)(2x + 1)
    - (2x + 1)(3x + 5)
    answer: (3x + 1)(2x + 5)
    check: 6x^2 + 17x + 5
    difficulty: 2
    hints:
    - a × c = 6 × 5 = 30. Which two numbers multiply to 30 and add to 17?
    - '15 and 2: 6x² + 15x + 2x + 5.'
    solution: 'Step 1: 6 × 5 = 30 = 15 × 2, and 15 + 2 = 17. Step 2: 6x² + 15x + 2x + 5 = 3x(2x + 5) + 1(2x + 5). Step 3: = (3x + 1)(2x + 5).'
    mistakes:
      (6x + 1)(x + 5): middle_term_split
  - prompt: If x + 2 is a factor of x² + kx + 6, what is k?
    answer: '5'
    check: ((-2)^2 + 6)/2
    difficulty: 2
    hints:
    - By the factor theorem, p(−2) = 0.
    - 4 − 2k + 6 = 0.
    solution: 'Step 1: p(−2) = 4 − 2k + 6 = 0. Step 2: 10 = 2k, so k = 5.'
    mistakes:
      '-5': factor_theorem_sign
  - prompt: Factorise x³ − 23x² + 142x − 120.
    options:
    - (x − 1)(x − 10)(x − 12)
    - (x − 2)(x − 6)(x − 10)
    - (x + 1)(x + 10)(x + 12)
    - (x − 1)(x − 4)(x − 30)
    answer: (x − 1)(x − 10)(x − 12)
    check: x^3 - 23x^2 + 142x - 120
    difficulty: 3
    hints:
    - 'Try x = 1: 1 − 23 + 142 − 120 = 0, so x − 1 is a factor.'
    - Then factorise x² − 22x + 120.
    solution: 'Step 1: p(1) = 0, so x − 1 is a factor. Step 2: Dividing gives x² − 22x + 120. Step 3: −10 × −12 = 120 and −10 − 12 = −22. Step 4: So it is (x − 1)(x − 10)(x − 12).'
    mistakes: {"(x + 1)(x + 10)(x + 12)": "factor_theorem_try", "(x − 2)(x − 6)(x − 10)": "factor_theorem_try"}
  - prompt: Factorise x² + 8x + 15.
    options:
    - (x + 3)(x + 5)
    - (x + 1)(x + 15)
    - (x + 8)(x + 15)
    - (x − 3)(x − 5)
    answer: (x + 3)(x + 5)
    check: expand((x + 3)*(x + 5))
    difficulty: 1
    hints:
    - Multiply to 15, add to 8.
    - 3 and 5.
    solution: 3 × 5 = 15 and 3 + 5 = 8, so (x + 3)(x + 5).
    mistakes:
      (x − 3)(x − 5): factor_pair_signs
      (x + 1)(x + 15): middle_term_split
  - prompt: Factorise x² − 9x + 20.
    options:
    - (x − 4)(x − 5)
    - (x + 4)(x + 5)
    - (x − 2)(x − 10)
    - (x − 4)(x + 5)
    answer: (x − 4)(x − 5)
    check: expand((x - 4)*(x - 5))
    difficulty: 1
    hints:
    - Multiply to +20, add to −9.
    - Both numbers are negative.
    solution: (−4)(−5) = 20 and −4 − 5 = −9, so (x − 4)(x − 5).
    mistakes:
      (x + 4)(x + 5): factor_pair_signs
      (x − 4)(x + 5): factor_pair_signs
  - prompt: Factorise x² + 2x − 15.
    options:
    - (x + 5)(x − 3)
    - (x − 5)(x + 3)
    - (x + 5)(x + 3)
    - (x + 15)(x − 1)
    answer: (x + 5)(x − 3)
    check: expand((x + 5)*(x - 3))
    difficulty: 2
    hints:
    - Multiply to −15, add to +2.
    - One positive, one negative; the bigger is positive.
    solution: 5 × (−3) = −15 and 5 − 3 = 2, so (x + 5)(x − 3).
    mistakes:
      (x − 5)(x + 3): factor_pair_signs
      (x + 5)(x + 3): factor_pair_signs
  - prompt: Is x − 3 a factor of x³ − 27?
    options:
    - Yes, because p(3) = 0
    - No, because p(3) = 27
    - No, because p(−3) ≠ 0
    - Only if x = 3
    answer: Yes, because p(3) = 0
    difficulty: 2
    hints:
    - Work out p(3).
    - 3³ = 27.
    solution: p(3) = 27 − 27 = 0, so by the factor theorem x − 3 is a factor.
    mistakes:
      No, because p(−3) ≠ 0: factor_theorem_sign
  - prompt: Factorise 2x² + 5x + 3.
    options:
    - (2x + 3)(x + 1)
    - (2x + 1)(x + 3)
    - (x + 3)(x + 1)
    - (2x + 5)(x + 3)
    answer: (2x + 3)(x + 1)
    check: expand((2*x + 3)*(x + 1))
    difficulty: 2
    hints:
    - 'a × c = 6: find two numbers with product 6, sum 5.'
    - 2x² + 2x + 3x + 3.
    solution: 2x² + 2x + 3x + 3 = 2x(x + 1) + 3(x + 1) = (2x + 3)(x + 1).
    mistakes:
      (2x + 1)(x + 3): middle_term_split
  - prompt: Factorise 3x² − 10x + 8.
    options:
    - (3x − 4)(x − 2)
    - (3x + 4)(x + 2)
    - (3x − 2)(x − 4)
    - (3x − 8)(x − 1)
    answer: (3x − 4)(x − 2)
    check: expand((3*x - 4)*(x - 2))
    difficulty: 2
    hints:
    - 'a × c = 24: product 24, sum −10.'
    - −6 and −4.
    solution: 3x² − 6x − 4x + 8 = 3x(x − 2) − 4(x − 2) = (3x − 4)(x − 2).
    mistakes:
      (3x + 4)(x + 2): factor_pair_signs
      (3x − 2)(x − 4): middle_term_split
  - prompt: If x − 1 is a factor of x³ + kx − 4, what is k?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - p(1) must be 0.
    - 1 + k − 4 = 0.
    solution: p(1) = 1 + k − 4 = 0, so k = 3.
    mistakes:
      '-3': factor_theorem_sign
      '5': factor_theorem_try
  - prompt: Factorise x³ − 6x² + 11x − 6.
    options:
    - (x − 1)(x − 2)(x − 3)
    - (x + 1)(x + 2)(x + 3)
    - (x − 1)(x − 6)(x + 1)
    - (x − 2)(x − 3)²
    answer: (x − 1)(x − 2)(x − 3)
    check: expand((x - 1)*(x - 2)*(x - 3))
    difficulty: 3
    hints:
    - 'Try x = 1: 1 − 6 + 11 − 6.'
    - p(1) = 0, then the rest is x² − 5x + 6.
    solution: p(1) = 0, so x − 1 is a factor. Dividing leaves x² − 5x + 6 = (x − 2)(x − 3).
    mistakes:
      (x + 1)(x + 2)(x + 3): factor_theorem_sign
  - prompt: Factorise 4x² − 12x + 9.
    options:
    - (2x − 3)²
    - (2x + 3)²
    - (4x − 3)(x − 3)
    - (2x − 3)(2x + 3)
    answer: (2x − 3)²
    check: expand((2*x - 3)^2)
    difficulty: 3
    hints:
    - 4x² = (2x)² and 9 = 3².
    - Is the middle term −2 × 2x × 3?
    solution: 4x² − 12x + 9 = (2x)² − 2(2x)(3) + 3² = (2x − 3)².
    mistakes:
      (2x − 3)(2x + 3): a2_minus_b2_factor
      (2x + 3)²: factor_pair_signs
- code: cbse9gm.identities.rational
  title: Simplifying rational expressions
  after:
  - cbse9gm.poly.factorise
  notes: |
    A rational expression is one polynomial divided by another, like (x² − 9)/(x + 3). To simplify, factorise
    the top and bottom using identities or splitting the middle term, then cancel common factors (values that
    make the bottom zero are not allowed). (x² − 9)/(x + 3) = (x + 3)(x − 3)/(x + 3) = x − 3 for x ≠ −3.
    Identities also give quick arithmetic: 103² = (100 + 3)² = 10609, 99 × 101 = 100² − 1 = 9999.
  explanations:
    text: 'A fraction made of polynomials simplifies like a number fraction: 6/9 = (2·3)/(3·3) = 2/3. Factorise top and bottom, then cancel what is the same. (x² − 9)/(x + 3) = (x + 3)(x − 3)/(x + 3) = x − 3.'
    visual: 'Write x² − 9 as a box of factors: [x + 3][x − 3]. Write x + 3 below the line as one box [x + 3]. Cross out the matching boxes, top and bottom: [x − 3] is left.'
    step_by_step: 'Step 1: Factorise the top. Step 2: Factorise the bottom. Step 3: Cancel factors that appear in both. Step 4: Note values of x that make the bottom zero: they are not allowed.'
    real_world: 'Shortcuts like 99 × 101 = 100² − 1 = 9999 come from the same identities: shop-keepers and quiz champions use them to calculate in their heads.'
  picture:
    kind: flow
    steps:
    - (x² − 9) / (x + 3)
    - (x + 3)(x − 3) / (x + 3)
    - cancel (x + 3)
    - x − 3   (x ≠ −3)
    alt: Simplifying x squared minus 9 over x plus 3 by factorising the top and cancelling to get x minus 3.
  activity:
    type: formula
    prompt: Move x and compare. Can you cancel, and what may you cancel?
    inputs:
    - name: x
      label: x
      min: 0
      max: 12
      step: 1
      start: 4
    outputs:
    - name: a
      label: (x² − 9) ÷ (x + 3)
      expr: (x^2-9)/(x+3)
      places: 2
    - name: b
      label: x − 3
      expr: x-3
    - name: c
      label: (x + 6) ÷ (x + 3)
      expr: (x+6)/(x+3)
      places: 2
    goals:
    - prompt: Make (x² − 9) ÷ (x + 3) equal 5. Watch x − 3 as you go.
      want:
        a: 5
      hint: Factorise x² − 9 as (x + 3)(x − 3). What does dividing by x + 3 leave?
      mistakes:
      - when:
          x: 5
        say: 'At x = 5 it is (25 − 9) ÷ 8 = 2. Notice it always equals x − 3: so which x makes x − 3 = 5?'
      - when:
          x: 2
        say: At x = 2 it is −5 ÷ 5 = −1, the same as x − 3. To get 5, x − 3 must be 5.
    - prompt: Someone 'cancels the x's' in (x + 6) ÷ (x + 3) and says it is always 6 ÷ 3 = 2. Find the only x here where that's true.
      want:
        c: 2
      mistakes:
      - when:
          x: 3
        say: At x = 3 it is 9 ÷ 6 = 1.5, not 2. The x is added, not multiplied, so it isn't a factor you can cancel.
      - when:
          x:
          - 1
          - 12
        say: For this x the top is less than twice the bottom, so the value is below 2. You may cancel only a factor of the whole top and bottom.
  lesson:
    - teach: 'A rational expression is a fraction made of polynomials, like (x² − 4)/(x + 2). Simplify it like a number fraction: break the top and bottom into factors, then cancel a factor they share.'
      check:
        prompt: What do you do first to simplify (x² − 25)/(x − 5)?
        options:
        - Factorise the top
        - Cancel the x's
        - Subtract 5 from 25
        answer: Factorise the top
        why: x² − 25 = (x + 5)(x − 5). Only whole factors can be cancelled.
    - teach: (x² − 25)/(x − 5) = (x + 5)(x − 5)/(x − 5) = x + 5 (for x ≠ 5). You may cancel only factors, things multiplied, never parts of a sum. In (x + 6)/6 the 6 is added to x, so it can't be cancelled.
      picture:
        kind: compare
        columns:
        - title: Can cancel (a factor)
          points:
          - (x + 5)(x − 5) / (x − 5)
          - 3x / 3
          - 2(x + 1) / (x + 1)
        - title: Can't cancel (part of a sum)
          points:
          - (x + 6) / 6
          - (x² + 1) / x
          - (x + 3) / (x + 5)
        alt: Factors that multiply the whole top can be cancelled; numbers added inside a sum cannot.
      check:
        prompt: Simplify 3(x + 2)/(x + 2).
        options:
        - '3'
        - 3x
        - It can't be simplified
        answer: '3'
        why: (x + 2) is a factor of both top and bottom.
    - teach: 'Identities also make mental arithmetic easy: 99 × 101 = 100² − 1² = 9999, and 105² = 100² + 2(100)(5) + 25 = 11025.'
      check:
        prompt: Find 999 × 1001.
        options:
        - '999999'
        - '1000000'
        - '999001'
        answer: '999999'
        why: 1000² − 1² = 1000000 − 1.
  items:
  - prompt: Simplify (x² − 16)/(x − 4).
    options:
    - x + 4
    - x − 4
    - x² − 4
    - x + 16
    answer: x + 4
    check: cancel((x^2 - 16)/(x - 4))
    difficulty: 1
    hints:
    - "Factorise the top: it is a difference of two squares."
    - Cancel (x − 4).
    solution: 'Step 1: x² − 16 = (x + 4)(x − 4). Step 2: Cancel x − 4: x + 4.'
    mistakes: {"x − 4": "cancel_after_factor", "x + 16": "cancel_terms_not_factors"}
  - prompt: Use (a + b)(a − b) = a² − b² to work out 98 × 102.
    answer: '9996'
    check: 98*102
    difficulty: 1
    hints:
    - 98 = 100 − 2, 102 = 100 + 2.
    - 100² − 2².
    solution: 'Step 1: 98 × 102 = (100 − 2)(100 + 2). Step 2: = 10000 − 4 = 9996.'
    mistakes: {"10004": "diff_of_squares", "9600": "diff_of_squares"}
  - prompt: Simplify (x² + 5x + 6)/(x + 2).
    options:
    - x + 3
    - x + 2
    - x² + 3
    - 5x + 3
    answer: x + 3
    check: cancel((x^2 + 5*x + 6)/(x + 2))
    difficulty: 2
    hints:
    - Find two numbers that multiply to 6 and add to 5.
    - x² + 5x + 6 = (x + 2)(x + 3).
    solution: 'Step 1: x² + 5x + 6 = (x + 2)(x + 3). Step 2: Cancel x + 2: x + 3.'
    mistakes: {"x² + 3": "cancel_terms_not_factors", "5x + 3": "cancel_terms_not_factors"}
  - prompt: A student writes (x + 6)/6 = x + 1. What went wrong?
    options:
    - 6 is not a factor of the whole top, so it can't be cancelled
    - Nothing, it is right
    - The answer should be x
    - They should have cancelled the x
    answer: 6 is not a factor of the whole top, so it can't be cancelled
    difficulty: 2
    hints:
    - 'Try x = 6: (6 + 6)/6 = 2. Is x + 1 = 7?'
    - Only factors cancel, not terms.
    solution: 'Step 1: (x + 6)/6 = x/6 + 1. Step 2: The 6 divides only part of the top, so it can''t be cancelled from x.'
    mistakes:
      Nothing, it is right: cancel_terms_not_factors
  - prompt: Simplify (2x² − 8)/(x² − 2x).
    options:
    - 2(x + 2)/x
    - 2/x
    - (x + 2)/x
    - 2(x − 2)/x
    answer: 2(x + 2)/x
    check: cancel((2*x^2 - 8)/(x^2 - 2*x))
    difficulty: 3
    hints:
    - 'Top: 2(x² − 4) = 2(x + 2)(x − 2).'
    - 'Bottom: x(x − 2).'
    solution: 'Step 1: Top = 2(x + 2)(x − 2). Step 2: Bottom = x(x − 2). Step 3: Cancel x − 2: 2(x + 2)/x.'
    mistakes: {"2/x": "cancel_after_factor", "2(x − 2)/x": "cancel_after_factor"}
  - prompt: Use an identity to work out 105².
    answer: '11025'
    check: 105^2
    difficulty: 2
    hints:
    - 105 = 100 + 5.
    - (a + b)² = a² + 2ab + b².
    solution: 'Step 1: (100 + 5)² = 10000 + 1000 + 25. Step 2: = 11025.'
    mistakes: {"10025": "square_of_sum", "1025": "square_of_sum"}
  - prompt: Simplify (x² − 36)/(x + 6).
    options:
    - x − 6
    - x + 6
    - x − 30
    - x² − 6
    answer: x − 6
    difficulty: 1
    hints:
    - Write x² − 36 as a difference of two squares.
    - Cancel x + 6.
    solution: (x + 6)(x − 6)/(x + 6) = x − 6, for x ≠ −6.
    mistakes:
      x − 30: cancel_terms_not_factors
      x + 6: a2_minus_b2_factor
  - prompt: Use an identity to work out 49 × 51.
    answer: '2499'
    check: 49*51
    difficulty: 1
    hints:
    - (50 − 1)(50 + 1).
    - 2500 − 1.
    solution: 50² − 1² = 2499.
    mistakes:
      '2501': diff_of_squares
      '2500': diff_of_squares
  - prompt: Simplify 5x/(5x²).
    options:
    - 1/x
    - x
    - '5'
    - 1/5x
    answer: 1/x
    difficulty: 1
    hints:
    - 5x² = 5x × x.
    - Cancel 5x.
    solution: 5x/(5x · x) = 1/x.
    mistakes:
      x: cancel_after_factor
  - prompt: Simplify (x² + 7x + 12)/(x + 3).
    options:
    - x + 4
    - x + 3
    - x + 9
    - x² + 4
    answer: x + 4
    difficulty: 2
    hints:
    - 'Factorise the top: product 12, sum 7.'
    - (x + 3)(x + 4).
    solution: (x + 3)(x + 4)/(x + 3) = x + 4.
    mistakes:
      x + 9: cancel_terms_not_factors
  - prompt: Simplify (x² − 1)/(x² + x).
    options:
    - (x − 1)/x
    - −1/x
    - x − 1
    - (x + 1)/x
    answer: (x − 1)/x
    difficulty: 2
    hints:
    - 'Top: (x + 1)(x − 1). Bottom: x(x + 1).'
    - Cancel x + 1.
    solution: (x + 1)(x − 1)/(x(x + 1)) = (x − 1)/x.
    mistakes:
      −1/x: cancel_terms_not_factors
      x − 1: cancel_after_factor
  - prompt: Which expression can be simplified by cancelling?
    options:
    - (2x + 4)/2
    - (x + 4)/4
    - (x² + 1)/x
    - (x + 2)/(x + 3)
    answer: (2x + 4)/2
    difficulty: 2
    hints:
    - Can the top be written as 2 × something?
    - 2x + 4 = 2(x + 2).
    solution: (2x + 4)/2 = 2(x + 2)/2 = x + 2. The others have no common factor.
    mistakes:
      (x + 4)/4: cancel_terms_not_factors
  - prompt: Use an identity to work out 95².
    answer: '9025'
    check: 95**2
    difficulty: 2
    hints:
    - (100 − 5)².
    - 10000 − 1000 + 25.
    solution: 10000 − 2(100)(5) + 25 = 9025.
    mistakes:
      '9975': square_missing_middle
      '10025': square_missing_middle
  - prompt: Simplify (x² − 4x + 4)/(x² − 4).
    options:
    - (x − 2)/(x + 2)
    - (x + 2)/(x − 2)
    - −4x
    - '1'
    answer: (x − 2)/(x + 2)
    difficulty: 3
    hints:
    - 'Top: (x − 2)². Bottom: (x + 2)(x − 2).'
    - Cancel one (x − 2).
    solution: (x − 2)²/((x + 2)(x − 2)) = (x − 2)/(x + 2).
    mistakes:
      −4x: cancel_terms_not_factors
      '1': cancel_after_factor
  - prompt: Simplify (3x² + 6x)/(x² − 4).
    options:
    - 3x/(x − 2)
    - 3x/(x + 2)
    - 3/(x − 2)
    - (3x + 6)/(x − 4)
    answer: 3x/(x − 2)
    difficulty: 3
    hints:
    - 'Top: 3x(x + 2).'
    - 'Bottom: (x + 2)(x − 2).'
    solution: 3x(x + 2)/((x + 2)(x − 2)) = 3x/(x − 2).
    mistakes:
      3x/(x + 2): a2_minus_b2_factor
      (3x + 6)/(x − 4): cancel_terms_not_factors
