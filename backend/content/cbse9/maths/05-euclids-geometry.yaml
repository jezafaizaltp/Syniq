# CBSE Class 9 Mathematics (NCERT), chapter 5. Format: content/README.md.
subject: cbse9-math
chapter: 5
title: Introduction to Euclid's Geometry

tips:
  axiom_vs_postulate: "Euclid's axioms are common ideas used across all of maths (like 'the whole is greater than the part'). Postulates are assumptions only about geometry (like 'a straight line can be drawn between any two points')."
  undefined_terms: "Point, line and plane are taken as undefined: we describe them, but every definition would need more words that would need defining."
  one_line_two_points: "Through two distinct points there is exactly one line, not many."

concepts:
  - code: cbse9m.euclid.terms
    title: Definitions, axioms and postulates
    notes: |
      Euclid (around 300 BCE, Elements) began with definitions, axioms (common notions used throughout
      mathematics) and postulates (assumptions specific to geometry), and proved theorems from them.
      Point, line and plane are treated as undefined terms. Sample axioms: things equal to the same thing
      are equal to one another; if equals are added to equals the wholes are equal; the whole is greater
      than the part. Theorems are statements proved from axioms and postulates.
    explanations:
      text: "Euclid built geometry like a building: a few starting assumptions at the bottom, and everything else proved from them. Axioms are general truths, like 'things equal to the same thing are equal to each other'. Postulates are geometry-only assumptions, like 'a straight line can be drawn from any point to any other point'. Theorems are what you prove."
      visual: "Draw a pyramid. The bottom row is definitions, axioms and postulates: accepted without proof. Each row above is a theorem, resting on the rows below. Pull out a bottom brick and everything above it would fall."
      step_by_step: "Step 1: Ask, is it accepted without proof? If no, it is a theorem. Step 2: If yes, ask: is it only about points, lines and figures? Then it's a postulate. Step 3: If it is a general idea used in all of maths, it's an axiom. Step 4: Point, line and plane are left undefined."
      real_world: "A cricket match runs on rules everyone agrees on before the toss: those are like axioms. Who wins is worked out from the rules and what happens on the field, the way a theorem is worked out from axioms."
    picture:
      kind: flow
      steps: ['Definitions: what words like point and line mean', 'Axioms and postulates: accepted without proof', 'Theorems: proved from the axioms and postulates', 'More theorems, built on earlier ones']
      alt: 'A chain from the bottom up: definitions, then axioms and postulates accepted without proof, then theorems proved from them, then more theorems.'
    items:
      - prompt: "Which is one of Euclid's axioms?"
        options: ["The whole is greater than the part.", "All right angles are equal.", "A circle can be drawn with any centre and radius.", "The angles of a triangle add to 180°."]
        answer: "The whole is greater than the part."
        difficulty: 1
        hints: ["Axioms are general ideas, not only about shapes.", "Which one would also work for numbers or money?"]
        solution: "'The whole is greater than the part' is a common notion used everywhere in maths, so it is an axiom. The two in the middle are postulates; the last is a theorem."
        mistakes: {"All right angles are equal.": axiom_vs_postulate}
      - prompt: "Which of these is taken as undefined in Euclid's geometry?"
        options: ["Point", "Circle", "Square", "Radius"]
        answer: "Point"
        difficulty: 1
        hints: ["Which one can't be defined without other words that need defining?", "Circle and radius can be defined using points."]
        solution: "A point is an undefined term. Circle, square and radius are all defined using points and lines."
        mistakes: {"Circle": undefined_terms}
      - prompt: "Through two different points, how many lines can be drawn?"
        answer: "1"
        check: "1"
        difficulty: 1
        hints: ["Try it with a ruler.", "Any second line through both would lie on the first."]
        solution: "Through two distinct points there is exactly one line."
        mistakes: {"2": one_line_two_points}
      - prompt: "If a = b and b = c, then a = c. This uses which of Euclid's axioms?"
        options: ["Things equal to the same thing are equal to one another.", "The whole is greater than the part.", "Things which coincide are equal.", "Things which are double the same thing are equal."]
        answer: "Things equal to the same thing are equal to one another."
        difficulty: 2
        hints: ["Both a and c are equal to b.", "What is b here?"]
        solution: "a and c are both equal to the same thing, b, so they are equal to one another."
      - prompt: "If AC = BD, and C and D lie between, so that AB + BC = AC and BC + CD = BD, which axiom shows AB = CD?"
        options: ["If equals are subtracted from equals, the remainders are equal.", "If equals are added to equals, the wholes are equal.", "The whole is greater than the part.", "Things which coincide are equal."]
        answer: "If equals are subtracted from equals, the remainders are equal."
        difficulty: 3
        hints: ["AB + BC = BC + CD.", "Take BC away from both sides."]
        solution: "Step 1: AB + BC = BC + CD since both equal AC = BD. Step 2: Subtracting BC from both sides gives AB = CD, using 'equals subtracted from equals leave equal remainders'."
      - prompt: "A statement that is proved using axioms and postulates is called a…"
        options: ["Theorem", "Postulate", "Axiom", "Definition"]
        answer: "Theorem"
        difficulty: 2
        hints: ["Axioms and postulates are not proved.", "What do we call a proved result?"]
        solution: "A proved statement is a theorem."
        mistakes: {"Postulate": axiom_vs_postulate}

  - code: cbse9m.euclid.postulates
    title: Euclid's five postulates
    after: [cbse9m.euclid.terms]
    notes: |
      1. A straight line may be drawn from any point to any other point. 2. A terminated line can be
      produced indefinitely. 3. A circle can be drawn with any centre and any radius. 4. All right angles
      are equal to one another. 5. If a line falling on two lines makes interior angles on the same side
      summing to less than two right angles, the two lines meet on that side. Consequences: two distinct
      lines cannot have more than one point in common; every line segment has exactly one midpoint.
    explanations:
      text: "Euclid's five postulates are: you can join any two points with a line; you can extend a line as far as you like; you can draw a circle with any centre and radius; all right angles are equal; and the fifth, about when two lines meet. From these he proved, for example, that two different lines can cross at most once."
      visual: "Picture a ruler and compass. Postulates 1 and 2 are what a ruler lets you do: join points and extend lines. Postulate 3 is the compass. Postulate 4 says every corner of every square matches. Postulate 5: if two lines lean towards each other, they will meet on that side."
      step_by_step: "Step 1: Joining or extending lines: postulates 1 and 2. Step 2: Drawing circles: postulate 3. Step 3: Comparing right angles: postulate 4. Step 4: Interior angles on one side less than 180° meaning the lines meet: postulate 5."
      real_world: "Two straight railway tracks that tilt even slightly towards each other will eventually cross. That's the fifth postulate. Tracks that never meet must make interior angles of exactly 180° on each side."
    picture:
      kind: compare
      columns:
      - title: Ruler
        points: ['1: a straight line can join any two points', '2: a line segment can be extended']
      - title: Compass and corners
        points: ['3: a circle can be drawn with any centre and radius', '4: all right angles are equal']
      - title: Parallel lines
        points: ['5: lines leaning towards each other meet on that side']
      alt: 'Euclid''s five postulates in three groups: two about a ruler, two about a compass and right angles, and the fifth about lines that lean towards each other.'
    items:
      - prompt: "'A circle can be drawn with any centre and any radius' is Euclid's postulate number…"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["1 and 2 are about lines.", "The next one is about circles."]
        solution: "Postulate 3 is about drawing circles."
      - prompt: "How many points can two different straight lines have in common, at most?"
        answer: "1"
        check: "1"
        difficulty: 1
        hints: ["If they shared two points, what would postulate 1 say?", "Only one line passes through two points."]
        solution: "If two lines shared two points they would be the same line, so different lines share at most 1 point."
        mistakes: {"2": one_line_two_points}
      - prompt: "Lines l and m are cut by a line n. The interior angles on one side add up to 170°. What happens?"
        options: ["l and m meet on that side", "l and m are parallel", "l and m meet on the other side", "l and m never meet"]
        answer: "l and m meet on that side"
        difficulty: 2
        hints: ["170° is less than two right angles.", "That is postulate 5."]
        solution: "Step 1: 170° < 180°. Step 2: By postulate 5, the lines meet on the side where the angles add to less than 180°."
      - prompt: "Which postulate says a line segment can be extended as far as needed in a straight line?"
        answer: "2"
        check: "2"
        difficulty: 2
        hints: ["Postulate 1 is joining two points.", "The next one extends the line."]
        solution: "Postulate 2: a terminated line can be produced indefinitely."
      - prompt: "How many midpoints does a line segment have?"
        answer: "1"
        check: "1"
        difficulty: 2
        hints: ["Suppose there were two, C and D.", "Then AC = CB and AD = DB; Euclid shows C and D coincide."]
        solution: "Every line segment has exactly one midpoint: if C and D were both midpoints, AC = AD, so C and D are the same point."
      - prompt: "Which statement is Euclid's fourth postulate?"
        options: ["All right angles are equal to one another.", "A straight line can be drawn between any two points.", "The whole is greater than the part.", "Parallel lines never meet."]
        answer: "All right angles are equal to one another."
        difficulty: 2
        hints: ["It compares angles.", "Which angle is always 90°?"]
        solution: "Postulate 4 is 'all right angles are equal to one another'."
        mistakes: {"The whole is greater than the part.": axiom_vs_postulate}
