# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 10. Format: content/README.md.
subject: cbse9-math
chapter: 10
title: 'How Quantities Combine: Understanding Data'
tips:
  weighted_plain_mean: 'The groups are different sizes, so a plain average of the averages is wrong: multiply each by its weight, add, then divide by the total weight.'
  hundred_percent_totals: A 100% stacked bar shows each part as a share of its own total; equal heights don't mean equal totals.
  equal_groups_mean: "With equal-sized groups you can average the averages. Check the sizes first."
  mixture_balance: "Set up total cost = total weight × mixed price, then solve for the unknown weight."
  percent_of_total: "Percentage = part ÷ whole × 100. The whole is the total class, not the other group."
  rest_percent: "First find what percent is left for 'other' (100 minus the rest), then take that percent of the total."
  share_needs_percent: "To compare shares in groups of different sizes, every bar must show percent of its own group."
  share_not_count: "A bigger count doesn't mean a bigger share. Divide each village's bus users by its own population."
  stacked_total: "A stacked bar's height is the sum of its parts."
  weighted_total: "Find the total stars from each group (count × average), add them, then divide by the total number of reviews."
concepts:
- code: cbse9gm.data.weighted
  title: Weighted means and mixtures
  notes: |
    When quantities combine with different weights, use the weighted mean:
    (w₁x₁ + w₂x₂ + … + wₙxₙ) ÷ (w₁ + w₂ + … + wₙ). The average of averages is only correct when the groups
    are the same size. Uses: the mean of two classes of different sizes, the price of a mixture of two kinds
    of rice, a final mark made from tests worth different percentages, overall ratings.
  explanations:
    text: 'If 30 students averaged 60 and 10 students averaged 80, the overall average is not (60 + 80)/2 = 70. The bigger group counts for more: (30 × 60 + 10 × 80) ÷ 40 = 65. Each average is weighted by how many it stands for.'
    visual: Picture a seesaw with 30 children at the 60 mark and 10 children at the 80 mark. It balances at 65, nearer the heavier side, not at the halfway point 70.
    step_by_step: 'Step 1: Multiply each value by its weight. Step 2: Add these products. Step 3: Add the weights. Step 4: Divide the first total by the second.'
    real_world: A shopkeeper mixes 8 kg of rice at ₹50/kg with 2 kg at ₹80/kg. The mixture costs (400 + 160) ÷ 10 = ₹56/kg, not ₹65/kg.
  picture:
    kind: number_line
    from: 55
    to: 85
    step: 5
    points:
    - at: 60
      label: 30 students
    - at: 65
      label: overall 65
    - at: 80
      label: 10 students
    alt: A number line from 55 to 85 marking 60 for 30 students, 80 for 10 students, and the weighted mean 65, closer to the bigger group.
  activity:
    type: formula
    prompt: Mix x kg of rice at ₹40/kg with y kg at ₹60/kg. The mixture's price is a weighted mean.
    inputs:
    - name: x
      label: Rice at ₹40
      min: 1
      max: 20
      step: 1
      start: 1
      unit: kg
    - name: y
      label: Rice at ₹60
      min: 1
      max: 20
      step: 1
      start: 1
      unit: kg
    outputs:
    - name: kg
      label: Total
      expr: x+y
      unit: kg
    - name: price
      label: Price of the mix per kg
      expr: (40*x+60*y)/(x+y)
      unit: ₹
      places: 2
    goals:
    - prompt: Make 10 kg of mixture costing ₹46 per kg.
      want:
        kg: 10
        price: 46
      hint: ₹46 is nearer 40 than 60. Which rice should there be more of?
      mistakes:
      - when:
          x: 5
          y: 5
        say: Equal amounts give ₹50, the plain average of 40 and 60. To pull the price down to ₹46, more of the cheaper rice is needed.
      - when:
          x: 3
          y: 7
        say: 'That''s ₹54: more of the dear rice pushes the price up, not down.'
    - prompt: Now make 20 kg costing ₹55 per kg.
      want:
        kg: 20
        price: 55
      mistakes:
      - when:
          x: 10
          y: 10
        say: Equal amounts give ₹50. The average of averages is only right when the amounts are equal.
      - when:
          x: 15
          y: 5
        say: 'That''s ₹45: you have more cheap rice. ₹55 is nearer 60.'
  lesson:
    - teach: 'The mean is total ÷ count. When groups of different sizes combine, the bigger group pulls the mean more. 30 students averaging 60 and 10 averaging 80 don''t average 70: the totals are 1800 and 800, so the mean is 2600 ÷ 40 = 65.'
      check:
        prompt: 10 students average 40 and 10 average 60. What is the overall mean?
        options:
        - '50'
        - '45'
        - '100'
        answer: '50'
        why: 'Equal groups, so the plain average works: (400 + 600) ÷ 20 = 50.'
    - teach: Weighted mean = (w₁x₁ + w₂x₂ + …) ÷ (w₁ + w₂ + …), where each value x is multiplied by its weight w (its size or importance). The average of averages is right only when the weights are equal.
      picture:
        kind: bars
        bars:
        - label: '30 students: 60'
          value: 1800
        - label: '10 students: 80'
          value: 800
        - label: All 40
          value: 2600
        unit: marks
        alt: Total marks of each group, 1800 and 800, add to 2600 for 40 students, a mean of 65.
      check:
        prompt: A final mark is 30% test, 70% project. Test 50, project 90. Final mark?
        options:
        - '78'
        - '70'
        - '84'
        answer: '78'
        why: 0.3 × 50 + 0.7 × 90 = 15 + 63 = 78.
    - teach: 'Mixtures work the same way. 6 kg of dal at ₹100/kg mixed with 4 kg at ₹150/kg: total cost 600 + 600 = ₹1200 for 10 kg, so ₹120 per kg. The mixture price is always between the two, nearer to the one with more weight.'
      check:
        prompt: 1 kg at ₹40 mixed with 3 kg at ₹80. Price per kg?
        options:
        - ₹70
        - ₹60
        - ₹50
        answer: ₹70
        why: (40 + 240) ÷ 4 = 70.
  items:
  - prompt: Class A (20 students) averages 50 and class B (20 students) averages 70. What is the overall average?
    answer: '60'
    check: (20*50 + 20*70)/40
    difficulty: 1
    hints:
    - Equal-sized groups.
    - Then the plain average works.
    solution: 'Step 1: (20 × 50 + 20 × 70) ÷ 40 = 2400 ÷ 40 = 60.'
    mistakes: {"120": "equal_groups_mean", "50": "equal_groups_mean"}
  - prompt: 30 students averaged 60 and 10 students averaged 80. What is the overall average?
    answer: '65'
    check: (30*60 + 10*80)/40
    difficulty: 1
    hints:
    - 'Total marks: 30 × 60 + 10 × 80.'
    - Divide by 40 students.
    solution: 'Step 1: 1800 + 800 = 2600. Step 2: 2600 ÷ 40 = 65.'
    mistakes:
      '70': weighted_plain_mean
  - prompt: 8 kg of rice at ₹50/kg is mixed with 2 kg at ₹80/kg. What is the price of the mixture per kg, in ₹?
    answer: '56'
    check: (8*50 + 2*80)/10
    difficulty: 2
    hints:
    - Total cost ÷ total kg.
    - 400 + 160.
    solution: 'Step 1: Cost = 400 + 160 = ₹560. Step 2: 560 ÷ 10 = ₹56/kg.'
    mistakes:
      '65': weighted_plain_mean
  - prompt: A final mark is 40% from a test and 60% from a project. Asha gets 70 in the test and 90 in the project. What is her final mark?
    answer: '82'
    check: 0.4*70 + 0.6*90
    difficulty: 2
    hints:
    - Weights 0.4 and 0.6 add to 1.
    - 0.4 × 70 + 0.6 × 90.
    solution: 'Step 1: 0.4 × 70 = 28. Step 2: 0.6 × 90 = 54. Step 3: 28 + 54 = 82.'
    mistakes:
      '80': weighted_plain_mean
  - prompt: A shop has 40 reviews averaging 4.5 stars and 10 new reviews averaging 2 stars. What is the new overall average?
    answer: '4'
    check: (40*4.5 + 10*2)/50
    difficulty: 2
    hints:
    - 'Total stars: 180 + 20.'
    - Divide by 50 reviews.
    solution: 'Step 1: 40 × 4.5 = 180, 10 × 2 = 20. Step 2: 200 ÷ 50 = 4 stars.'
    mistakes: {"3.25": "weighted_plain_mean", "200": "weighted_total"}
  - prompt: How many kg of tea at ₹200/kg must be mixed with 3 kg at ₹300/kg to get a mixture at ₹240/kg?
    answer: '4.5'
    check: 3*(300 - 240)/(240 - 200)
    difficulty: 3
    hints:
    - 'Let the amount be x: (200x + 900) ÷ (x + 3) = 240.'
    - 200x + 900 = 240x + 720.
    solution: 'Step 1: 200x + 900 = 240(x + 3). Step 2: 900 − 720 = 40x, so x = 4.5 kg.'
    mistakes: {"3": "mixture_balance", "6": "mixture_balance"}
  - prompt: Group A (25 people) averages 30 and group B (25 people) averages 50. What is the overall average?
    answer: '40'
    check: (25*30 + 25*50)/50
    difficulty: 1
    hints:
    - The groups are the same size.
    - So the plain average of 30 and 50 works.
    solution: (750 + 1250) ÷ 50 = 40.
    mistakes:
      '80': equal_groups_mean
  - prompt: 20 students averaged 70 and 5 students averaged 50. What is the overall average?
    answer: '66'
    check: (20*70 + 5*50)/25
    difficulty: 1
    hints:
    - 'Totals: 1400 and 250.'
    - Divide by 25.
    solution: 1650 ÷ 25 = 66.
    mistakes:
      '60': weighted_plain_mean
      '1650': weighted_total
  - prompt: A cricketer scores an average of 40 in 6 matches and 70 in 4 matches. What is the average over all 10?
    answer: '52'
    check: (6*40 + 4*70)/10
    difficulty: 1
    hints:
    - 'Totals: 240 and 280.'
    - 520 ÷ 10.
    solution: (240 + 280) ÷ 10 = 52.
    mistakes:
      '55': weighted_plain_mean
  - prompt: 5 kg of rice at ₹40/kg is mixed with 5 kg at ₹60/kg. Price of the mixture per kg, in ₹?
    answer: '50'
    check: (5*40 + 5*60)/10
    difficulty: 2
    hints:
    - Total cost ÷ total weight.
    - 500 ÷ 10.
    solution: (200 + 300) ÷ 10 = ₹50 per kg.
    mistakes:
      '100': weighted_total
  - prompt: A course mark is 20% homework, 30% test and 50% exam. Ravi scores 90, 60 and 70. What is his mark?
    answer: '71'
    check: 0.2*90 + 0.3*60 + 0.5*70
    difficulty: 2
    hints:
    - Multiply each mark by its weight.
    - 18 + 18 + 35.
    solution: 18 + 18 + 35 = 71.
    mistakes:
      '73.33': weighted_plain_mean
  - prompt: Why is the overall average of 30 students at 60 and 10 students at 80 not 70?
    options:
    - The groups are different sizes, so the 30 count more
    - Because 70 is not a whole number
    - Averages can't be added
    - Because 80 is too high
    answer: The groups are different sizes, so the 30 count more
    difficulty: 2
    hints:
    - 70 would be right if both groups had the same size.
    - Which group has more students?
    solution: There are three times as many students at 60, so the overall mean (65) is pulled towards 60.
    mistakes:
      Averages can't be added: equal_groups_mean
  - prompt: A hotel has 80 ratings averaging 4 stars. 20 new ratings average 5 stars. What is the new average?
    answer: '4.2'
    check: (80*4 + 20*5)/100
    difficulty: 2
    hints:
    - 'Totals: 320 and 100.'
    - Divide by 100.
    solution: 420 ÷ 100 = 4.2 stars.
    mistakes:
      '4.5': weighted_plain_mean
  - prompt: How many kg of sugar at ₹30/kg must be mixed with 6 kg at ₹50/kg to get a mixture at ₹45/kg?
    answer: '2'
    check: 6*(50 - 45)/(45 - 30)
    difficulty: 3
    hints:
    - Each kg of the ₹50 sugar is ₹5 above 45; each kg of ₹30 sugar is ₹15 below.
    - 15x = 6 × 5.
    solution: 'The extras must balance: 15x = 30, so x = 2 kg.'
    mistakes:
      '6': mixture_balance
      '18': mixture_balance
  - prompt: The mean of 10 numbers is 20. One number, 38, is removed. What is the mean of the rest?
    answer: '18'
    check: (200 - 38)/9
    difficulty: 3
    hints:
    - Total of the 10 numbers = 200.
    - (200 − 38) ÷ 9.
    solution: 162 ÷ 9 = 18.
    mistakes:
      '16.2': weighted_total
- code: cbse9gm.data.stacked
  title: Stacked and 100% stacked bar charts
  after:
  - cbse9gm.data.weighted
  notes: |
    A stacked bar chart splits each bar into parts, so you can read both the total and its parts (for example
    boys and girls in each class). A 100% stacked bar chart makes every bar the same height (100%) and shows
    each part as a percentage of its own total, which is best for comparing proportions, not totals. Part %
    = part ÷ total × 100.
  explanations:
    text: 'A stacked bar shows a total made of pieces, piled on top of each other: class 9A has 18 girls and 22 boys, a bar 40 tall split into 18 and 22. A 100% stacked bar stretches every bar to the same height so you can compare shares: girls are 45% of 9A.'
    visual: 'Draw two bars: 9A with 18 girls under 22 boys (total 40), 9B with 15 girls under 15 boys (total 30). Now redraw both as 100% bars: 9A is split 45% / 55%, 9B 50% / 50%. 9B has fewer girls, but a bigger share of girls.'
    step_by_step: 'Step 1: For a stacked bar, read the total at the top and each part by its own height. Step 2: For a 100% bar, work out each part as part ÷ total × 100. Step 3: Compare totals with stacked bars, proportions with 100% bars.'
    real_world: A school's results chart might stack pass and fail for each subject. A 100% version shows which subject has the best pass rate, even if subjects have different numbers of students.
  picture:
    kind: bars
    unit: students
    bars:
    - label: 9A girls
      value: 18
    - label: 9A boys
      value: 22
    - label: 9B girls
      value: 15
    - label: 9B boys
      value: 15
    caption: 9A total 40 (girls 45%); 9B total 30 (girls 50%).
    alt: Bars for girls and boys in 9A (18 and 22) and 9B (15 and 15).
  activity:
    type: formula
    prompt: A class has g girls and b boys. On a 100% stacked bar, the girls' part is g ÷ (g + b) × 100.
    inputs:
    - name: g
      label: Girls
      min: 0
      max: 40
      step: 1
      start: 0
    - name: b
      label: Boys
      min: 0
      max: 60
      step: 1
      start: 0
    outputs:
    - name: t
      label: Whole class
      expr: g+b
    - name: pct
      label: Girls' part of the 100% bar
      expr: g/max(g+b,1)*100
      unit: '%'
      places: 1
    goals:
    - prompt: Class 9A has 30 students, and the girls' part of its 100% bar is 40%. How many girls and boys?
      want:
        t: 30
        pct: 40
      hint: '40% of the whole class of 30: how many is that?'
      mistakes:
      - when:
          g: 12
          b: 30
        say: 12 girls and 30 boys is 42 students, but the class has 30 altogether. The boys are the rest of the 30.
      - when:
          g: 40
        say: 40 is the percentage, not a count. 40% of 30 students is fewer than 30.
    - prompt: Class 9B has 15 girls, more than 9A, but its girls' part is only 30%. How many boys?
      want:
        g: 15
        pct: 30
      mistakes:
      - when:
          b: 50
        say: 15 is 30% of 50, but the bar's 100% is the whole class, girls plus boys. With 50 boys the class is 65, and girls are only 23%.
      - when:
          b: 15
        say: Equal numbers make each part 50%. For girls to be only 30%, boys must be the other 70%.
  lesson:
    - teach: 'A stacked bar chart piles the parts of each total on top of each other. A bar for Class 9A might show 14 girls at the bottom and 16 boys on top: the whole bar is 30, and you can still read each part.'
      picture:
        kind: bars
        bars:
        - label: 9A girls
          value: 14
        - label: 9A boys
          value: 16
        - label: 9B girls
          value: 20
        - label: 9B boys
          value: 20
        unit: students
        alt: 'Girls and boys in two classes: 9A has 14 girls and 16 boys (30), 9B has 20 and 20 (40).'
      check:
        prompt: A stacked bar has parts 8, 5 and 7. How tall is the bar?
        options:
        - '20'
        - '8'
        - '7'
        answer: '20'
        why: 8 + 5 + 7 = 20.
    - teach: 'To compare shares, turn each part into a percentage of its own total: part ÷ total × 100. In 9A girls are 14/30 ≈ 47%; in 9B 20/40 = 50%. 9B has more girls AND a bigger share, but that isn''t always so.'
      check:
        prompt: 45 of 150 households have a scooter. What percentage is that?
        options:
        - 30%
        - 45%
        - 15%
        answer: 30%
        why: 45 ÷ 150 × 100 = 30.
    - teach: 'A 100% stacked bar chart makes every bar the same height, 100%, and shows each part as a percentage. It is best for comparing shares, but it hides the totals: two equal-height bars may stand for 30 people and 3000 people.'
      check:
        prompt: Which chart shows that a big school and a small school have the same share of cyclists?
        options:
        - 100% stacked bars
        - Ordinary stacked bars
        - A single total bar
        answer: 100% stacked bars
        why: Every bar is scaled to 100%, so equal shares look equal.
  items:
  - prompt: A stacked bar for a class has 12 girls on the bottom and 18 boys on top. What is the height of the whole bar?
    answer: '30'
    check: 12 + 18
    difficulty: 1
    hints:
    - The parts stack up to the total.
    - 12 + 18.
    solution: 'Step 1: 12 + 18 = 30 students.'
    mistakes: {"18": "stacked_total", "6": "stacked_total"}
  - prompt: In that class (12 girls, 18 boys), what percentage are girls?
    answer: '40'
    check: 12/30*100
    difficulty: 1
    hints:
    - Part ÷ total × 100.
    - 12 ÷ 30.
    solution: 'Step 1: 12 ÷ 30 = 0.4. Step 2: 0.4 × 100 = 40%.'
    mistakes: {"12": "percent_of_total", "66.7": "percent_of_total"}
  - prompt: Which chart is best for comparing the share of girls in classes of different sizes?
    options:
    - A 100% stacked bar chart
    - A stacked bar chart
    - A pictograph
    - A single bar of the total
    answer: A 100% stacked bar chart
    difficulty: 2
    hints:
    - Shares are proportions.
    - Which chart makes every total 100%?
    solution: 'Step 1: Comparing shares means comparing proportions. Step 2: A 100% stacked bar shows each part as a percentage of its own class.'
    mistakes: {"A stacked bar chart": "share_needs_percent", "A single bar of the total": "share_needs_percent"}
  - prompt: In a 100% stacked bar chart, two bars are the same height. What can you say?
    options:
    - 'Nothing about their totals: every bar is 100% tall'
    - They have the same total
    - They have the same parts
    - One must be wrong
    answer: 'Nothing about their totals: every bar is 100% tall'
    difficulty: 2
    hints:
    - How tall is every bar in this kind of chart?
    - Totals are hidden.
    solution: 'Step 1: Every bar in a 100% chart has height 100%. Step 2: So equal heights tell you nothing about the actual totals.'
    mistakes:
      They have the same total: hundred_percent_totals
  - prompt: 'Village P: 300 of 1200 people use buses. Village Q: 200 of 500. Which village has the bigger share of bus users?'
    options:
    - Q (40%)
    - P (25%)
    - Both the same
    - P, because 300 > 200
    answer: Q (40%)
    difficulty: 2
    hints:
    - Work out each as a percentage.
    - 300/1200 and 200/500.
    solution: 'Step 1: P: 300 ÷ 1200 = 25%. Step 2: Q: 200 ÷ 500 = 40%. Q has the bigger share, though P has more bus users.'
    mistakes: {"P, because 300 > 200": "share_not_count", "Both the same": "share_not_count"}
  - prompt: A 100% stacked bar shows a family spends 30% on food, 25% on rent, 15% on travel and the rest on other things. If they spend ₹40,000 a month, how much is 'other', in ₹?
    answer: '12000'
    check: (100 - 30 - 25 - 15)/100*40000
    difficulty: 3
    hints:
    - Other = 100 − 30 − 25 − 15 = 30%.
    - 30% of 40,000.
    solution: 'Step 1: Other = 30%. Step 2: 0.3 × 40000 = ₹12,000.'
    mistakes: {"28000": "rest_percent", "30": "rest_percent"}
  - prompt: A stacked bar shows 9 cars, 15 bikes and 6 buses. How tall is the whole bar?
    answer: '30'
    check: 9 + 15 + 6
    difficulty: 1
    hints:
    - Add the parts.
    - 9 + 15 + 6.
    solution: 'The bar height is the total: 30.'
    mistakes:
      '15': stacked_total
  - prompt: In a class of 40, 10 walk to school. What percentage walk?
    answer: '25'
    check: 10/40*100
    difficulty: 1
    hints:
    - Part ÷ total × 100.
    - 10 ÷ 40.
    solution: 10 ÷ 40 = 0.25 = 25%.
    mistakes:
      '10': share_needs_percent
      '40': percent_of_total
  - prompt: In a 100% stacked bar, 'tea' is 35% and 'coffee' is 45%. What percentage is the rest?
    answer: '20'
    check: 100 - 35 - 45
    difficulty: 1
    hints:
    - The bar adds up to 100%.
    - 100 − 35 − 45.
    solution: 100 − 80 = 20%.
    mistakes:
      '80': rest_percent
  - prompt: Shop A sold 60 pens of which 15 were blue. Shop B sold 200 pens of which 40 were blue. Which shop had the bigger share of blue pens?
    options:
    - A (25%)
    - B (20%)
    - B, because 40 > 15
    - They are the same
    answer: A (25%)
    difficulty: 2
    hints:
    - Compare percentages, not counts.
    - 15/60 and 40/200.
    solution: 'A: 25%. B: 20%. Shop A had the bigger share, even though B sold more blue pens.'
    mistakes:
      B, because 40 > 15: share_not_count
  - prompt: Two bars in a 100% stacked chart are equally tall. One is for a village of 300, one for a city of 3 lakh. What does the equal height mean?
    options:
    - 'Nothing about size: every bar is 100%'
    - Both places have the same population
    - The village is bigger
    - The chart is wrong
    answer: 'Nothing about size: every bar is 100%'
    difficulty: 2
    hints:
    - What is the height of every bar in a 100% chart?
    - Totals are hidden.
    solution: Every bar is drawn to 100%, so equal height says nothing about totals.
    mistakes:
      Both places have the same population: hundred_percent_totals
  - prompt: In a class, 18 of 45 students like football. What percentage is that?
    answer: '40'
    check: 18/45*100
    difficulty: 2
    hints:
    - 18 ÷ 45.
    - Times 100.
    solution: 18 ÷ 45 = 0.4 = 40%.
    mistakes:
      '18': share_needs_percent
  - prompt: A town's budget bar (100%) is 40% roads, 35% schools, 25% health. The budget is ₹8 crore. How much for schools, in crore ₹?
    answer: '2.8'
    check: 0.35*8
    difficulty: 2
    hints:
    - 35% of 8.
    - 0.35 × 8.
    solution: 0.35 × 8 = ₹2.8 crore.
    mistakes:
      '35': percent_of_total
      '3.2': percent_of_total
  - prompt: Class X has 12 girls in 30. Class Y has 18 girls in 60. A 100% stacked chart is drawn. Which statement is right?
    options:
    - X's girls part is taller (40% vs 30%)
    - Y's girls part is taller (18 vs 12)
    - Both girls parts are equal
    - Y's bar is taller overall
    answer: X's girls part is taller (40% vs 30%)
    difficulty: 3
    hints:
    - Turn each into a percentage.
    - 12/30 and 18/60.
    solution: 'X: 40%, Y: 30%. In a 100% chart the girls part of X is taller, and both bars are the same height.'
    mistakes:
      Y's girls part is taller (18 vs 12): share_not_count
      Y's bar is taller overall: hundred_percent_totals
  - prompt: 'A family spends ₹30,000 a month: 40% on food and 20% on rent. Next month, total spending stays the same but food rises to 45%. By how much does food spending rise, in ₹?'
    answer: '1500'
    check: 0.05*30000
    difficulty: 3
    hints:
    - The share rose by 5 percentage points.
    - 5% of 30,000.
    solution: Food was ₹12,000 and becomes ₹13,500, a rise of ₹1,500.
    mistakes:
      '5': percent_of_total
      '13500': percent_of_total
