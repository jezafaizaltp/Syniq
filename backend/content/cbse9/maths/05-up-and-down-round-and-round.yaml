# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 5. Format: content/README.md.
subject: cbse9-math
chapter: 5
title: I'm Up and Down, and Round and Round
tips:
  centre_double: The angle at the centre is DOUBLE the angle at the circle on the same arc, not half.
  semicircle_right: "Draw the triangle with the diameter as one side and the third corner on the circle. Join the centre to that corner: you get two isosceles triangles. Add up their angles."
  same_segment_equal: Angles in the same segment (standing on the same chord, on the same side) are equal.
  chord_right_triangle: "The radius, half the chord and the distance from the centre make a right triangle. Use half the chord, not all of it."
  equal_chords_equal_distance: "Equal chords are the same distance from the centre. Nothing else to calculate."
  perp_bisects_chord: "Draw the perpendicular from the centre to a chord. Measure the two pieces of the chord: what do you notice?"
  three_points_one_circle: "Three points not on a line fix exactly the centre (where the perpendicular bisectors meet). How many centres, so how many circles?"
  c9m5_half_chord: The right triangle uses half the chord, not the whole chord. Halve the chord before squaring, or double your answer at the end if you found half.
  c9m5_opposite_not_adjacent: In a cyclic quadrilateral the angles that add to 180° are opposite each other (A with C, B with D), not side by side.
concepts:
- code: cbse9gm.circle.chords
  title: Chords and their distance from the centre
  notes: |
    Equal chords subtend equal angles at the centre (and conversely). The perpendicular from the centre to
    a chord bisects it; the line from the centre to the mid-point of a chord is perpendicular to it. There
    is exactly one circle through three non-collinear points. Equal chords are equidistant from the
    centre (and conversely). Using Pythagoras: (half chord)² + (distance)² = r².
  explanations:
    text: 'A chord is a line joining two points on a circle. Drop a perpendicular from the centre to a chord and it cuts the chord exactly in half. That makes a right triangle: radius as the long side, half the chord and the distance from the centre as the other two. So (half chord)² + distance² = radius².'
    visual: 'Draw a circle, a chord, and a line straight down from the centre to the chord. You''ve made a right-angled triangle: one corner at the centre, one at the chord''s middle, one at the chord''s end. Its slanted side is the radius.'
    step_by_step: 'Step 1: Halve the chord. Step 2: Make a right triangle with the radius as hypotenuse. Step 3: Use r² = (half chord)² + d². Step 4: Solve for whichever is missing. Step 5: If you found half the chord, double it.'
    real_world: To find the centre of a round plate, draw two chords and the perpendicular bisector of each. They cross at the centre, because every perpendicular bisector of a chord passes through it.
  picture:
    kind: geometry
    points:
      O:
      - 5
      - 5
      A:
      - 1.8
      - 2.6
      B:
      - 8.2
      - 2.6
      M:
      - 5
      - 2.6
    circles:
    - centre: O
      radius: 4
    segments:
    - - A
      - B
    - - O
      - M
      - '2.4'
    - - O
      - B
      - r = 4
    angles:
    - at: M
      from: B
      to: O
      label: 90°
    caption: 'The line from the centre at right angles to the chord halves it: MB² = 4² − 2.4² = 3.2², so AB = 6.4.'
    alt: A circle with centre O and radius 4. A chord AB with its mid-point M; OM is 2.4 and meets AB at a right angle, making a right triangle OMB.
  activity:
    type: formula
    prompt: A circle has radius 13 cm. Move a chord closer to or further from the centre. Half chord² + distance² = radius².
    inputs:
    - name: d
      label: Distance from centre
      min: 0
      max: 13
      step: 1
      start: 13
      unit: cm
    outputs:
    - name: h
      label: Half the chord
      expr: sqrt(169-d^2)
      unit: cm
      places: 2
    - name: c
      label: Chord length
      expr: 2*sqrt(169-d^2)
      unit: cm
      places: 2
    goals:
    - prompt: Make a chord 24 cm long.
      want:
        c: 24
      hint: 'Half of 24 is 12. 12² + d² = 13²: what is d²?'
      mistakes:
      - when:
          d: 12
        say: '12 cm from the centre gives a half chord of √(169 − 144) = 5: a 10 cm chord. 12 is half the chord, not the distance.'
      - when:
          d: 11
        say: At 11 cm the chord is about 13.9 cm. Closer to the centre, chords get longer.
    - prompt: Now make a chord 10 cm long.
      want:
        c: 10
      mistakes:
      - when:
          d: 5
        say: 5 cm from the centre gives a 24 cm chord. A short chord sits far from the centre.
    - prompt: Make the longest chord possible.
      want:
        c: 26
      mistakes:
      - when:
          d: 13
        say: 'At 13 cm the line only touches the circle: the chord shrinks to nothing. Where would the longest chord pass?'
      - when:
          d:
          - 1
          - 3
        say: 'Close, but not the longest yet. The longest chord goes right through the centre: the diameter.'
  lesson:
    - teach: 'A chord is a line segment joining two points of a circle. The longest chord passes through the centre: the diameter. Draw a perpendicular from the centre O to a chord AB: it always cuts the chord into two equal halves.'
      picture:
        kind: geometry
        points:
          O:
          - 5
          - 5
          A:
          - 2
          - 3
          B:
          - 8
          - 3
          M:
          - 5
          - 3
        circles:
        - centre: O
          radius: 3.6
        segments:
        - - A
          - B
        - - O
          - M
          - d
        - - O
          - A
          - r
        caption: OM ⟂ AB, so AM = MB. Triangle OMA has a right angle at M.
        alt: Circle with centre O, chord AB and the perpendicular OM from the centre to the midpoint M of AB; OA is a radius.
      check:
        prompt: A chord is 10 cm long. The perpendicular from the centre meets it at M. How long is AM?
        options:
        - 5 cm
        - 10 cm
        - 20 cm
        answer: 5 cm
        why: 'The perpendicular from the centre bisects the chord: 10 ÷ 2 = 5.'
    - teach: 'Triangle OMA is right-angled at M. Its sides are the radius r (OA), the distance d from the centre (OM) and half the chord (AM). Pythagoras: (half chord)² + d² = r². With chord 8 and d = 3: 4² + 3² = 25, so r = 5.'
      check:
        prompt: Radius 10, distance from the centre 6. What is half the chord?
        options:
        - '8'
        - '4'
        - '16'
        answer: '8'
        why: half² = 100 − 36 = 64, so half chord = 8 and the chord is 16.
    - teach: Equal chords are the same distance from the centre, and chords the same distance from the centre are equal. Equal chords also make equal angles at the centre. And through any three points not on one line, there is exactly one circle.
      check:
        prompt: Two chords are each 5 cm from the centre. One is 12 cm long. How long is the other?
        options:
        - 12 cm
        - 5 cm
        - 6 cm
        answer: 12 cm
        why: Same distance from the centre means equal chords.
  items:
  - prompt: A chord is 8 cm long and 3 cm from the centre. Find the radius in cm.
    answer: '5'
    check: sqrt(4^2 + 3^2)
    difficulty: 1
    hints:
    - Half the chord is 4 cm.
    - r² = 4² + 3².
    solution: 'Step 1: Half chord = 4 cm. Step 2: r² = 16 + 9 = 25. Step 3: r = 5 cm.'
    mistakes: {"11": "half_chord", "7": "added_sides"}
  - prompt: A circle has radius 13 cm. A chord is 5 cm from the centre. Find the length of the chord in cm.
    answer: '24'
    check: 2*sqrt(13^2 - 5^2)
    difficulty: 2
    hints:
    - Half chord² = 13² − 5².
    - Then double it.
    solution: 'Step 1: Half chord² = 169 − 25 = 144. Step 2: Half chord = 12. Step 3: Chord = 24 cm.'
    mistakes:
      '12': half_chord
  - prompt: Two chords of a circle are equal. One is 4 cm from the centre. How far is the other from the centre, in cm?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Equal chords are equidistant from the centre.
    - Same distance.
    solution: 'Equal chords are the same distance from the centre: 4 cm.'
    mistakes: {"8": "equal_chords_equal_distance", "2": "equal_chords_equal_distance"}
  - prompt: The perpendicular from the centre to a chord…
    options:
    - bisects the chord
    - is equal to the chord
    - is parallel to the chord
    - passes through one end of the chord
    answer: bisects the chord
    difficulty: 1
    hints:
    - Think of the folded paper circle.
    - It cuts it in half.
    solution: The perpendicular from the centre to a chord bisects the chord.
    mistakes: {"is equal to the chord": "perp_bisects_chord", "passes through one end of the chord": "perp_bisects_chord"}
  - prompt: How many circles can pass through three points that are not on one line?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - Draw perpendicular bisectors of two of the segments.
    - They meet at one point.
    solution: Exactly one circle passes through three non-collinear points.
    mistakes: {"3": "three_points_one_circle", "0": "three_points_one_circle"}
  - prompt: A chord of length 16 cm is in a circle of radius 10 cm. How far is the chord from the centre, in cm?
    answer: '6'
    check: sqrt(10^2 - 8^2)
    difficulty: 2
    hints:
    - Half chord = 8 cm.
    - d² = 100 − 64.
    solution: 'Step 1: d² = 10² − 8² = 36. Step 2: d = 6 cm.'
    mistakes: {"2": "chord_right_triangle", "36": "distance_forgot_root"}
  - prompt: A chord is 6 cm long and 4 cm from the centre. Find the radius in cm.
    answer: '5'
    check: sqrt(3**2 + 4**2)
    difficulty: 1
    hints:
    - Half the chord is 3.
    - r² = 3² + 4².
    solution: r² = 9 + 16 = 25, so r = 5 cm.
    mistakes:
      '7': chord_right_triangle
      '52': c9m5_half_chord
  - prompt: The perpendicular from the centre meets a chord of 14 cm. How long is each part?
    answer: '7'
    check: 14/2
    difficulty: 1
    hints:
    - The perpendicular from the centre bisects the chord.
    - Split 14 into two equal parts.
    solution: 14 ÷ 2 = 7 cm on each side.
    mistakes:
      '14': perp_bisects_chord
      '28': perp_bisects_chord
  - prompt: Two chords of a circle are each 7 cm from the centre. One is 20 cm long. How long is the other, in cm?
    answer: '20'
    check: '20'
    difficulty: 1
    hints:
    - Chords equally far from the centre are…
    - …equal.
    solution: Chords equidistant from the centre are equal, so 20 cm.
    mistakes:
      '7': equal_chords_equal_distance
  - prompt: A circle has radius 5 cm. A chord is 3 cm from the centre. Find the chord's length in cm.
    answer: '8'
    check: 2*sqrt(25 - 9)
    difficulty: 2
    hints:
    - Half chord² = 5² − 3².
    - Then double.
    solution: Half chord = √(25 − 9) = 4, so the chord is 8 cm.
    mistakes:
      '4': c9m5_half_chord
      '16': chord_right_triangle
  - prompt: A circle has radius 17 cm and a chord of 30 cm. How far is the chord from the centre, in cm?
    answer: '8'
    check: sqrt(17**2 - 15**2)
    difficulty: 2
    hints:
    - Half chord = 15.
    - d² = 17² − 15² = 289 − 225.
    solution: d² = 64, so d = 8 cm.
    mistakes:
      '64': chord_right_triangle
      '2': chord_right_triangle
  - prompt: Two equal chords make angles at the centre. One angle is 70°. What is the other, in degrees?
    answer: '70'
    check: '70'
    difficulty: 2
    hints:
    - Equal chords subtend equal angles at the centre.
    - No working needed.
    solution: 'Equal chords make equal angles at the centre: 70°.'
    mistakes:
      '110': equal_chords_equal_distance
      '35': centre_double
  - prompt: Which chord of a circle is the longest?
    options:
    - The diameter
    - Any chord near the edge
    - A chord 1 cm from the centre
    - All chords are equal
    answer: The diameter
    difficulty: 2
    hints:
    - Closer to the centre means longer.
    - Distance 0 from the centre.
    solution: The closer a chord is to the centre, the longer it is. The diameter passes through the centre, so it is longest.
    mistakes:
      All chords are equal: equal_chords_equal_distance
  - prompt: Chord AB = 24 cm is 5 cm from the centre. Chord CD of the same circle is 12 cm from the centre. How long is CD, in cm?
    answer: '10'
    check: 2*sqrt(13**2 - 12**2)
    difficulty: 3
    hints:
    - 'First find r: r² = 12² + 5².'
    - Then half of CD = √(r² − 12²).
    solution: r² = 144 + 25 = 169, r = 13. Half CD = √(169 − 144) = 5, so CD = 10 cm.
    mistakes:
      '5': c9m5_half_chord
      '24': equal_chords_equal_distance
  - prompt: Three points A, B, C lie on one straight line. How many circles pass through all three?
    answer: '0'
    check: '0'
    difficulty: 3
    hints:
    - The centre must be equally far from all three.
    - Perpendicular bisectors of AB and BC are parallel.
    solution: 'The perpendicular bisectors of AB and BC are parallel and never meet, so no centre exists: 0 circles.'
    mistakes:
      '1': three_points_one_circle
- code: cbse9gm.circle.angles
  title: Angles in a circle and cyclic quadrilaterals
  after:
  - cbse9gm.circle.chords
  notes: |
    The angle subtended by an arc at the centre is double the angle it subtends at any point on the rest
    of the circle. Angles in the same segment are equal. The angle in a semicircle is 90°. A cyclic
    quadrilateral has all four vertices on a circle; its opposite angles sum to 180° (and conversely).
  explanations:
    text: An arc makes an angle at the centre that is twice the angle it makes at the edge of the circle. So an angle in a semicircle, where the centre angle is 180°, is always 90°. In a quadrilateral with all corners on a circle, opposite angles add to 180°.
    visual: 'Draw a chord and pick a point on the big part of the circle. Join it to both ends of the chord: that''s the angle at the circle. Join the centre to both ends: that''s the angle at the centre, and it''s always twice as wide.'
    step_by_step: 'Step 1: Find the arc both angles stand on. Step 2: Angle at centre = 2 × angle at circle. Step 3: If the chord is a diameter, the angle at the circle is 90°. Step 4: For a cyclic quadrilateral, opposite angles add to 180°.'
    real_world: A photographer standing anywhere on a circular path around a stage sees the stage at the same angle, because angles in the same segment are equal. That's why seats in an arc give everyone the same view width.
  picture:
    kind: geometry
    points:
      O:
      - 5
      - 5
      A:
      - 2.43
      - 1.94
      B:
      - 7.57
      - 1.94
      P:
      - 4.31
      - 8.94
    circles:
    - centre: O
      radius: 4
    segments:
    - - P
      - A
    - - P
      - B
    - - O
      - A
    - - O
      - B
    angles:
    - at: O
      from: A
      to: B
      label: 80°
    - at: P
      from: A
      to: B
      label: 40°
    caption: The angle at the centre (80°) is twice the angle at the circle (40°) on the same chord AB.
    alt: A circle with centre O and chord AB. The angle AOB at the centre is 80°, and the angle APB at a point P on the circle is 40°, half as much.
  activity:
    type: angle
    prompt: Turn the arm to make each angle in a circle.
    goals:
    - prompt: Arc AB makes 140° at the centre. Make the angle it makes at a point on the rest of the circle.
      degrees: 70
      mistakes:
      - when:
          degrees: 140
        say: 140° is the angle at the centre. A point on the circle sees the same arc at half the angle.
      - when:
          degrees: 280
        say: 280° is double. It's the centre angle that is double the angle on the circle, not the other way round.
    - prompt: Make the angle in a semicircle.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: 180° is the straight angle the diameter makes at the centre. A point on the circle sees it at half that.
      - when:
          degrees:
          - 45
          - 60
        say: Too narrow. A diameter is a 180° arc at the centre; the angle on the circle is half of 180°.
    - prompt: A cyclic quadrilateral has one angle of 75°. Make the angle opposite it.
      degrees: 105
      mistakes:
      - when:
          degrees: 75
        say: Equal angles belong to the same segment. Opposite corners of a cyclic quadrilateral add to 180° instead.
      - when:
          degrees: 285
        say: '285° makes 360° with 75°: a full turn. Opposite angles of a cyclic quadrilateral add to a straight angle.'
    - prompt: Angle ACB on arc AB is 40°. Make angle ADB, with D in the same segment.
      degrees: 40
      mistakes:
      - when:
          degrees: 80
        say: 80° is what the centre sees. Every point in the same segment sees the arc at the same angle.
      - when:
          degrees: 140
        say: '140° would add to 180° with 40°: that''s for opposite corners of a cyclic quadrilateral, not the same segment.'
  lesson:
    - teach: An arc of a circle makes an angle at the centre and an angle at any point on the rest of the circle. The angle at the centre is always double the angle at the circle. If the arc makes 40° at the circle, it makes 80° at the centre.
      picture:
        kind: geometry
        points:
          O:
          - 5
          - 5
          A:
          - 2
          - 3.5
          B:
          - 8
          - 3.5
          P:
          - 5
          - 8.4
        circles:
        - centre: O
          radius: 3.4
        segments:
        - - O
          - A
        - - O
          - B
        - - P
          - A
        - - P
          - B
        angles:
        - at: O
          from: A
          to: B
          label: 2x
        - at: P
          from: A
          to: B
          label: x
        caption: The angle at the centre is double the angle at P.
        alt: Circle with centre O, arc AB, angle AOB labelled 2x and angle APB at a point P on the circle labelled x.
      check:
        prompt: An arc makes 120° at the centre. What angle does it make at the circle?
        options:
        - 60°
        - 240°
        - 120°
        answer: 60°
        why: Half of 120° is 60°.
    - teach: 'Two results follow. Angles in the same segment (standing on the same arc, on the same side) are equal. And the angle in a semicircle is 90°: a diameter makes 180° at the centre, so half of that at the circle.'
      check:
        prompt: AB is a diameter. C is on the circle. What is ∠ACB?
        options:
        - 90°
        - 180°
        - 45°
        answer: 90°
        why: The angle in a semicircle is a right angle.
    - teach: 'A cyclic quadrilateral has all four corners on a circle. Its opposite angles add up to 180°: ∠A + ∠C = 180° and ∠B + ∠D = 180°. If ∠A = 70°, then ∠C = 110°.'
      check:
        prompt: In cyclic quadrilateral PQRS, ∠Q = 95°. What is ∠S?
        options:
        - 85°
        - 95°
        - 265°
        answer: 85°
        why: Q and S are opposite, so ∠S = 180° − 95° = 85°.
  items:
  - prompt: An arc subtends 50° at a point on the circle. What angle does it subtend at the centre, in degrees?
    answer: '100'
    check: 2*50
    difficulty: 1
    hints:
    - Centre angle is double.
    - 2 × 50.
    solution: Angle at centre = 2 × 50° = 100°.
    mistakes:
      '25': centre_double
  - prompt: An arc subtends 130° at the centre. What angle does it subtend at a point on the remaining part of the circle?
    answer: '65'
    check: 130/2
    difficulty: 1
    hints:
    - Angle at circle is half.
    - 130 ÷ 2.
    solution: Angle at circle = 130° ÷ 2 = 65°.
    mistakes:
      '260': centre_double
  - prompt: AB is a diameter and C is a point on the circle. Find ∠ACB in degrees.
    answer: '90'
    check: 180/2
    difficulty: 1
    hints:
    - The angle at the centre is a straight angle, 180°.
    - Half of 180°.
    solution: The angle in a semicircle is 90°.
    mistakes:
      '180': semicircle_right
  - prompt: ABCD is a cyclic quadrilateral with ∠A = 75°. Find ∠C in degrees.
    answer: '105'
    check: 180 - 75
    difficulty: 2
    hints:
    - ∠A and ∠C are opposite.
    - Opposite angles add to 180°.
    solution: ∠C = 180° − 75° = 105°.
    mistakes:
      '75': opposite_angles_cyclic
  - prompt: Points P and Q are on the same arc of a circle, and chord AB subtends ∠APB = 40°. Find ∠AQB in degrees.
    answer: '40'
    check: '40'
    difficulty: 2
    hints:
    - P and Q are in the same segment.
    - Angles in the same segment are equal.
    solution: ∠AQB = ∠APB = 40°, as angles in the same segment are equal.
    mistakes:
      '80': same_segment_equal
  - prompt: In cyclic quadrilateral ABCD, ∠B = (2x + 10)° and ∠D = (x + 20)°. Find x.
    answer: '50'
    check: 150/3
    difficulty: 3
    hints:
    - ∠B + ∠D = 180°.
    - 3x + 30 = 180.
    solution: 'Step 1: 2x + 10 + x + 20 = 180. Step 2: 3x = 150. Step 3: x = 50.'
    mistakes:
      '30': opposite_angles_cyclic
  - prompt: An arc subtends 35° at a point on the circle. What does it subtend at the centre, in degrees?
    answer: '70'
    check: 2*35
    difficulty: 1
    hints:
    - The centre angle is double.
    - 2 × 35.
    solution: 2 × 35° = 70°.
    mistakes:
      '17.5': centre_double
      '35': centre_double
  - prompt: An arc subtends 100° at the centre. What does it subtend at a point on the remaining circle, in degrees?
    answer: '50'
    check: 100/2
    difficulty: 1
    hints:
    - The angle at the circle is half the centre angle.
    - 100 ÷ 2.
    solution: 100° ÷ 2 = 50°.
    mistakes:
      '200': centre_double
      '100': centre_double
  - prompt: ABCD is a cyclic quadrilateral with ∠B = 110°. Find ∠D in degrees.
    answer: '70'
    check: 180 - 110
    difficulty: 1
    hints:
    - B and D are opposite.
    - Opposite angles add to 180°.
    solution: ∠D = 180° − 110° = 70°.
    mistakes:
      '110': cyclic_only
      '250': c9m5_opposite_not_adjacent
  - prompt: PQ is a diameter of a circle and R is another point on it. ∠PQR = 40°. Find ∠QPR in degrees.
    answer: '50'
    check: 180 - 90 - 40
    difficulty: 2
    hints:
    - ∠PRQ is in a semicircle.
    - Angles of a triangle add to 180°.
    solution: ∠PRQ = 90°, so ∠QPR = 180° − 90° − 40° = 50°.
    mistakes:
      '40': semicircle_right
      '140': semicircle_right
  - prompt: Chord AB subtends ∠ACB = 55° at C on the circle. D is on the same arc as C. Find ∠ADB in degrees.
    answer: '55'
    check: '55'
    difficulty: 2
    hints:
    - C and D are in the same segment.
    - Angles in the same segment are equal.
    solution: ∠ADB = ∠ACB = 55°.
    mistakes:
      '110': same_segment_equal
      '125': same_segment_equal
  - prompt: Can a quadrilateral with angles 80°, 90°, 100° and 90° (in order) be cyclic?
    options:
    - Yes, both pairs of opposite angles add to 180°
    - No, no angle is 180°
    - No, two angles are equal
    - Only if it is a square
    answer: Yes, both pairs of opposite angles add to 180°
    difficulty: 2
    hints:
    - Pair the 1st with the 3rd angle and the 2nd with the 4th.
    - 80 + 100 and 90 + 90.
    solution: 80° + 100° = 180° and 90° + 90° = 180°, so the quadrilateral can be cyclic.
    mistakes:
      No, no angle is 180°: cyclic_only
  - prompt: O is the centre and ∠AOB = 140°. C is on the major arc. Find ∠ACB in degrees.
    answer: '70'
    check: 140/2
    difficulty: 2
    hints:
    - C is on the other side from the arc AB.
    - Halve the centre angle.
    solution: ∠ACB = 140° ÷ 2 = 70°.
    mistakes:
      '280': centre_double
      '40': semicircle_right
  - prompt: In cyclic quadrilateral ABCD, ∠A = (3x − 10)° and ∠C = (x + 30)°. Find x.
    answer: '40'
    check: (180 - 20)/4
    difficulty: 3
    hints:
    - ∠A + ∠C = 180.
    - 4x + 20 = 180.
    solution: 3x − 10 + x + 30 = 180, so 4x = 160 and x = 40.
