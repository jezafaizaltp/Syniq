# CBSE Class 9 Mathematics (NCERT), chapter 2. Format: content/README.md.
subject: cbse9-math
chapter: 2
title: Polynomials

tips:
  degree_count_terms: "The degree is the highest power of the variable, not the number of terms."
  zero_sign_flip: "A zero makes the polynomial equal 0. For x − a the zero is +a: put it back in to check."
  factor_theorem_sign: "x − a is a factor when p(a) = 0. So for x + 2, test p(−2), not p(2)."
  middle_term_split: "Look for two numbers that multiply to (first coefficient × constant) and add to the middle coefficient."
  square_missing_middle: "(a + b)² has a middle term 2ab: (a + b)² = a² + 2ab + b², not a² + b²."
  cube_missing_terms: "(a + b)³ = a³ + b³ + 3ab(a + b). Don't drop the 3ab(a + b) part."

concepts:
  - code: cbse9m.poly.degree
    title: Polynomials and their degree
    notes: |
      A polynomial in one variable x is a sum of terms a·xⁿ with whole-number powers. Its degree is the highest
      power with a non-zero coefficient. Linear (degree 1), quadratic (2) and cubic (3) polynomials;
      monomials, binomials and trinomials by number of terms. A non-zero constant has degree 0. Expressions
      with √x or 1/x are not polynomials.
    explanations:
      text: "A polynomial is made of terms like 3x², −5x and 7, where x is only raised to whole-number powers. Its degree is the highest power of x: 4x³ − x + 2 has degree 3, so it is a cubic. 1/x and √x are not allowed, so x + 1/x is not a polynomial."
      visual: "Line the terms up from the highest power to the lowest: 4x³ + 0x² − x + 2. The first term with a non-zero number in front tells you the degree. Count the terms to name it: one term is a monomial, two a binomial, three a trinomial."
      step_by_step: "Step 1: Check every power of x is a whole number (0, 1, 2, …). If not, it's not a polynomial. Step 2: Find the highest power with a non-zero coefficient: that's the degree. Step 3: Degree 1 is linear, 2 quadratic, 3 cubic. Step 4: Count the terms to say monomial, binomial or trinomial."
      real_world: "The area of a square of side x is x², a quadratic. The volume of a cube of side x is x³, a cubic. The perimeter of the square, 4x, is linear: double the side and it only doubles."
    picture:
      kind: flow
      steps: ['Highest power first: 4x³ + 0x² − x + 2', 'First term that isn''t zero: 4x³', 'Its power is 3, so the degree is 3 (cubic)', 'Count the non-zero terms: 3, so it is a trinomial']
      alt: 'Steps finding the degree of 4x³ − x + 2: write powers from highest, the first non-zero term is 4x³, so the degree is 3.'
    items:
      - prompt: "What is the degree of 5x³ − 2x² + x − 7?"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["Look for the highest power of x.", "x³ is the highest."]
        solution: "Step 1: The powers are 3, 2, 1 and 0. Step 2: The highest is 3, so the degree is 3."
        mistakes: {"4": degree_count_terms}
      - prompt: "Which of these is a polynomial?"
        options: ["x² − 3x + 2", "x + 1/x", "√x + 4", "x^(−2) + 1"]
        answer: "x² − 3x + 2"
        difficulty: 1
        hints: ["Every power of x must be a whole number.", "1/x = x^(−1) and √x = x^(1/2)."]
        solution: "Step 1: 1/x, √x and x^(−2) have powers −1, 1/2 and −2. Step 2: Only x² − 3x + 2 has whole-number powers."
      - prompt: "What kind of polynomial is 3y² + 5y?"
        options: ["Quadratic binomial", "Linear binomial", "Cubic trinomial", "Quadratic trinomial"]
        answer: "Quadratic binomial"
        difficulty: 1
        hints: ["Highest power gives the degree.", "Count the terms."]
        solution: "Step 1: The highest power is 2, so it is quadratic. Step 2: It has 2 terms, so it is a binomial."
      - prompt: "What is the coefficient of x² in 2 − x² + 4x³?"
        answer: "-1"
        check: "-1"
        difficulty: 2
        hints: ["The coefficient is the number multiplied by x².", "−x² means −1 × x²."]
        solution: "Step 1: The x² term is −x². Step 2: −x² = −1 × x², so the coefficient is −1."
        mistakes: {"1": zero_sign_flip}
      - prompt: "What is the degree of the polynomial 9 (a constant)?"
        answer: "0"
        check: "0"
        difficulty: 2
        hints: ["9 = 9x⁰.", "Any number to the power 0 is 1."]
        solution: "Step 1: 9 = 9 × x⁰. Step 2: The power is 0, so the degree is 0."
      - prompt: "What is the degree of (x² + 1)(x³ − 2)?"
        answer: "5"
        check: "2 + 3"
        difficulty: 3
        hints: ["Multiply the highest terms only.", "x² × x³ = ?"]
        solution: "Step 1: The highest-power term is x² × x³ = x⁵. Step 2: So the degree is 5."
        mistakes: {"6": exponent_multiply_instead_add}

  - code: cbse9m.poly.zeroes
    title: Values and zeroes of a polynomial
    after: [cbse9m.poly.degree]
    notes: |
      p(a) is the value of p(x) at x = a. A zero of p(x) is a number c with p(c) = 0. A linear polynomial
      ax + b has exactly one zero, −b/a. A non-zero constant polynomial has no zero. A polynomial can have
      more than one zero, e.g. x² − 1 has zeroes 1 and −1.
    explanations:
      text: "To find p(2), put 2 in place of x everywhere and work it out. A zero of the polynomial is a value of x that makes the whole thing 0. For 2x − 6, set 2x − 6 = 0: x = 3, so 3 is its zero."
      visual: "Think of the polynomial as a machine. Feed in a number for x and a value comes out. A zero is a number that makes the machine print 0. For x² − 4, feeding in 2 or −2 both print 0."
      step_by_step: "Step 1: To find p(a), replace every x with (a), in brackets. Step 2: Do powers, then multiplication, then addition and subtraction. Step 3: To find the zero of ax + b, solve ax + b = 0. Step 4: x = −b/a. Step 5: Check by putting it back in: you should get 0."
      real_world: "A shop's profit is p(x) = 20x − 500 rupees for x items sold. The zero, x = 25, is the break-even point: sell 25 items and you've earned back the ₹500 you spent."
    picture:
      kind: number_line
      from: -4
      to: 4
      step: 1
      points:
      - {at: -2, label: p(−2) = 0}
      - {at: 0, label: p(0) = −4}
      - {at: 2, label: p(2) = 0}
      caption: 'For p(x) = x² − 4, the zeroes are −2 and 2: they make the value 0.'
      alt: A number line from −4 to 4. At −2 and at 2, p(x) = x² − 4 equals 0, so they are the zeroes. At 0 the value is −4.
    items:
      - prompt: "If p(x) = x² − 3x + 2, find p(4)."
        answer: "6"
        check: "4^2 - 3*4 + 2"
        difficulty: 1
        hints: ["Put 4 in place of x.", "16 − 12 + 2."]
        solution: "Step 1: p(4) = 4² − 3 × 4 + 2. Step 2: = 16 − 12 + 2 = 6."
      - prompt: "Find the zero of p(x) = 2x − 6."
        answer: "3"
        check: "6/2"
        difficulty: 1
        hints: ["Set 2x − 6 = 0.", "2x = 6."]
        solution: "Step 1: 2x − 6 = 0. Step 2: 2x = 6, so x = 3. Step 3: Check: p(3) = 6 − 6 = 0."
        mistakes: {"-3": zero_sign_flip}
      - prompt: "Find the zero of p(x) = x + 5."
        answer: "-5"
        check: "-5"
        difficulty: 1
        hints: ["Set x + 5 = 0.", "Take 5 to the other side."]
        solution: "Step 1: x + 5 = 0. Step 2: x = −5. Step 3: Check: −5 + 5 = 0."
        mistakes: {"5": zero_sign_flip}
      - prompt: "If p(x) = 3x³ − x + 1, find p(−1)."
        answer: "-1"
        check: "3*(-1)^3 - (-1) + 1"
        difficulty: 2
        hints: ["(−1)³ = −1.", "3 × (−1) − (−1) + 1."]
        solution: "Step 1: p(−1) = 3(−1)³ − (−1) + 1. Step 2: = −3 + 1 + 1 = −1."
      - prompt: "Find the zero of p(x) = 3x + 2. Type a fraction like −2/3."
        answer: "-2/3"
        check: "-2/3"
        difficulty: 2
        hints: ["Set 3x + 2 = 0.", "3x = −2."]
        solution: "Step 1: 3x + 2 = 0. Step 2: 3x = −2. Step 3: x = −2/3."
        mistakes: {"2/3": zero_sign_flip}
      - prompt: "Which numbers are zeroes of x² − 9?"
        options: ["3 and −3", "9 and −9", "Only 3", "0 and 9"]
        answer: "3 and −3"
        difficulty: 2
        hints: ["Set x² − 9 = 0, so x² = 9.", "Both 3² and (−3)² are 9."]
        solution: "Step 1: x² − 9 = 0 means x² = 9. Step 2: x = 3 or x = −3."
      - prompt: "If p(x) = kx − 4 and p(2) = 0, what is k?"
        answer: "2"
        check: "4/2"
        difficulty: 3
        hints: ["Put x = 2 and set the result to 0.", "2k − 4 = 0."]
        solution: "Step 1: p(2) = 2k − 4 = 0. Step 2: 2k = 4, so k = 2."

  - code: cbse9m.poly.factorise
    title: Factor theorem and factorising
    after: [cbse9m.poly.zeroes]
    notes: |
      Factor theorem: if p(a) = 0 then x − a is a factor of p(x), and conversely. Quadratics ax² + bx + c are
      factorised by splitting the middle term: find p, q with p + q = b and pq = ac. Cubics: find one zero by
      trial among factors of the constant, then divide or split. NCERT examples: 6x² + 17x + 5 = (3x + 1)(2x + 5),
      x³ − 23x² + 142x − 120 = (x − 1)(x − 10)(x − 12).
    explanations:
      text: "If putting x = a into a polynomial gives 0, then (x − a) is one of its factors. To factorise x² + 7x + 12, look for two numbers that multiply to 12 and add to 7: 3 and 4. So x² + 7x + 12 = (x + 3)(x + 4)."
      visual: "Picture x² + 7x + 12 as tiles: one big x × x square, seven x × 1 strips and twelve 1 × 1 squares. Arrange them into a rectangle: it comes out (x + 3) long and (x + 4) wide. Those are the factors."
      step_by_step: "Step 1: For ax² + bx + c, work out a × c. Step 2: Find two numbers that multiply to a × c and add to b. Step 3: Split the middle term into those two. Step 4: Group in pairs and take out the common factor. Step 5: Check by multiplying the brackets back out."
      real_world: "A rectangular garden has area x² + 7x + 12 square metres. Factorising tells you it could be (x + 3) m by (x + 4) m: for x = 2, that's 5 m by 6 m = 30 m², and the formula gives 4 + 14 + 12 = 30."
    picture:
      kind: area_grid
      cols:
      - {size: 3, label: x}
      - {size: 1.6, label: + 4}
      rows:
      - {size: 3, label: x}
      - {size: 1.2, label: + 3}
      cells:
      - [x², 4x]
      - [3x, '12']
      caption: x² + 4x + 3x + 12 = x² + 7x + 12, so x² + 7x + 12 = (x + 3)(x + 4).
      alt: A rectangle x + 4 wide and x + 3 tall, split into x², 4x, 3x and 12. Together they make x² + 7x + 12.
    items:
      - prompt: "Factorise x² + 7x + 12."
        options: ["(x + 3)(x + 4)", "(x + 2)(x + 6)", "(x + 1)(x + 12)", "(x − 3)(x − 4)"]
        answer: "(x + 3)(x + 4)"
        check: "x^2 + 7x + 12"
        difficulty: 1
        hints: ["Find two numbers that multiply to 12 and add to 7.", "3 × 4 = 12 and 3 + 4 = 7."]
        solution: "Step 1: 3 × 4 = 12 and 3 + 4 = 7. Step 2: x² + 7x + 12 = (x + 3)(x + 4)."
        mistakes: {"(x + 2)(x + 6)": middle_term_split}
      - prompt: "Is (x − 1) a factor of x³ + x² + x − 3?"
        options: ["Yes, because p(1) = 0", "No, because p(1) = 6", "No, because p(−1) ≠ 0", "Yes, because p(0) = −3"]
        answer: "Yes, because p(1) = 0"
        difficulty: 1
        hints: ["Use the factor theorem: test p(1).", "1 + 1 + 1 − 3 = ?"]
        solution: "Step 1: p(1) = 1 + 1 + 1 − 3 = 0. Step 2: So x − 1 is a factor."
        mistakes: {"No, because p(−1) ≠ 0": factor_theorem_sign}
      - prompt: "Factorise x² − 5x + 6."
        options: ["(x − 2)(x − 3)", "(x + 2)(x + 3)", "(x − 1)(x − 6)", "(x − 2)(x + 3)"]
        answer: "(x − 2)(x − 3)"
        check: "x^2 - 5x + 6"
        difficulty: 2
        hints: ["Two numbers that multiply to +6 and add to −5.", "Both must be negative."]
        solution: "Step 1: (−2) × (−3) = 6 and −2 + (−3) = −5. Step 2: x² − 5x + 6 = (x − 2)(x − 3)."
      - prompt: "Factorise 6x² + 17x + 5."
        options: ["(3x + 1)(2x + 5)", "(6x + 1)(x + 5)", "(3x + 5)(2x + 1)", "(2x + 1)(3x + 5)"]
        answer: "(3x + 1)(2x + 5)"
        check: "6x^2 + 17x + 5"
        difficulty: 2
        hints: ["a × c = 6 × 5 = 30. Which two numbers multiply to 30 and add to 17?", "15 and 2: 6x² + 15x + 2x + 5."]
        solution: "Step 1: 6 × 5 = 30 = 15 × 2, and 15 + 2 = 17. Step 2: 6x² + 15x + 2x + 5 = 3x(2x + 5) + 1(2x + 5). Step 3: = (3x + 1)(2x + 5)."
        mistakes: {"(6x + 1)(x + 5)": middle_term_split}
      - prompt: "If x + 2 is a factor of x² + kx + 6, what is k?"
        answer: "5"
        check: "((-2)^2 + 6)/2"
        difficulty: 2
        hints: ["By the factor theorem, p(−2) = 0.", "4 − 2k + 6 = 0."]
        solution: "Step 1: p(−2) = 4 − 2k + 6 = 0. Step 2: 10 = 2k, so k = 5."
        mistakes: {"-5": factor_theorem_sign}
      - prompt: "Factorise x³ − 23x² + 142x − 120."
        options: ["(x − 1)(x − 10)(x − 12)", "(x − 2)(x − 6)(x − 10)", "(x + 1)(x + 10)(x + 12)", "(x − 1)(x − 4)(x − 30)"]
        answer: "(x − 1)(x − 10)(x − 12)"
        check: "x^3 - 23x^2 + 142x - 120"
        difficulty: 3
        hints: ["Try x = 1: 1 − 23 + 142 − 120 = 0, so x − 1 is a factor.", "Then factorise x² − 22x + 120."]
        solution: "Step 1: p(1) = 0, so x − 1 is a factor. Step 2: Dividing gives x² − 22x + 120. Step 3: −10 × −12 = 120 and −10 − 12 = −22. Step 4: So it is (x − 1)(x − 10)(x − 12)."

  - code: cbse9m.poly.identities
    title: Algebraic identities
    after: [cbse9m.poly.factorise]
    notes: |
      Identities: (x + y)² = x² + 2xy + y², (x − y)² = x² − 2xy + y², x² − y² = (x + y)(x − y),
      (x + a)(x + b) = x² + (a + b)x + ab, (x + y + z)² = x² + y² + z² + 2xy + 2yz + 2zx,
      (x + y)³ = x³ + y³ + 3xy(x + y), (x − y)³ = x³ − y³ − 3xy(x − y),
      x³ + y³ + z³ − 3xyz = (x + y + z)(x² + y² + z² − xy − yz − zx); so if x + y + z = 0, x³ + y³ + z³ = 3xyz.
      Used for quick calculation, e.g. 104 × 96 = 100² − 4² = 9984 and 99³ = (100 − 1)³.
    explanations:
      text: "Identities are shortcuts that are true for every value. (a + b)² = a² + 2ab + b², so 103² = 100² + 2 × 100 × 3 + 3² = 10609. And a² − b² = (a + b)(a − b), so 104 × 96 = (100 + 4)(100 − 4) = 10000 − 16 = 9984."
      visual: "Draw a square of side a + b and cut it into an a × a square, a b × b square and two a × b rectangles. Their areas add to a² + 2ab + b². That's why (a + b)² has the middle 2ab: it's the two rectangles."
      step_by_step: "Step 1: Match the expression to an identity: a square of a sum, a difference of squares, a cube… Step 2: Decide what a and b (and c) are. Step 3: Substitute into the identity. Step 4: Simplify each term. Step 5: For numbers, split them around a round number like 100."
      real_world: "A tailor making a square tablecloth adds a 3 cm border to a 100 cm square. The new area is 103² = 10000 + 600 + 9 = 10609 cm², worked out in your head with (a + b)²."
    picture:
      kind: area_grid
      cols:
      - {size: 3, label: a}
      - {size: 1.5, label: b}
      rows:
      - {size: 3, label: a}
      - {size: 1.5, label: b}
      cells:
      - [a², ab]
      - [ab, b²]
      caption: (a + b)² = a² + ab + ab + b² = a² + 2ab + b²
      alt: A square of side a + b split into an a² square, a b² square and two ab rectangles, showing (a + b)² = a² + 2ab + b².
    items:
      - prompt: "Using an identity, find 104 × 96."
        answer: "9984"
        check: "104*96"
        difficulty: 1
        hints: ["104 = 100 + 4 and 96 = 100 − 4.", "(a + b)(a − b) = a² − b²."]
        solution: "Step 1: 104 × 96 = (100 + 4)(100 − 4). Step 2: = 100² − 4² = 10000 − 16 = 9984."
      - prompt: "Expand (x + 4)²."
        options: ["x² + 8x + 16", "x² + 16", "x² + 4x + 16", "x² + 8x + 8"]
        answer: "x² + 8x + 16"
        check: "expand((x + 4)^2)"
        difficulty: 1
        hints: ["(a + b)² = a² + 2ab + b².", "2 × x × 4 = 8x."]
        solution: "Step 1: a = x and b = 4. Step 2: x² + 2 × x × 4 + 4² = x² + 8x + 16."
        mistakes: {"x² + 16": square_missing_middle}
      - prompt: "Using an identity, find 103²."
        answer: "10609"
        check: "103^2"
        difficulty: 1
        hints: ["103 = 100 + 3.", "(a + b)² = a² + 2ab + b²."]
        solution: "Step 1: 103² = (100 + 3)². Step 2: = 10000 + 600 + 9 = 10609."
        mistakes: {"10009": square_missing_middle}
      - prompt: "Factorise 9x² − 25."
        options: ["(3x + 5)(3x − 5)", "(9x + 5)(x − 5)", "(3x − 5)²", "(3x + 25)(3x − 1)"]
        answer: "(3x + 5)(3x − 5)"
        check: "9x^2 - 25"
        difficulty: 2
        hints: ["9x² = (3x)² and 25 = 5².", "a² − b² = (a + b)(a − b)."]
        solution: "Step 1: 9x² − 25 = (3x)² − 5². Step 2: = (3x + 5)(3x − 5)."
      - prompt: "Expand (x + 2y + 3z)²."
        options: ["x² + 4y² + 9z² + 4xy + 12yz + 6xz", "x² + 4y² + 9z²", "x² + 2y² + 3z² + 4xy + 12yz + 6xz", "x² + 4y² + 9z² + 2xy + 6yz + 3xz"]
        answer: "x² + 4y² + 9z² + 4xy + 12yz + 6xz"
        check: "expand((x + 2y + 3z)^2)"
        difficulty: 2
        hints: ["(a + b + c)² = a² + b² + c² + 2ab + 2bc + 2ca.", "a = x, b = 2y, c = 3z."]
        solution: "Step 1: Squares: x², 4y², 9z². Step 2: 2ab = 4xy, 2bc = 12yz, 2ca = 6xz. Step 3: Add them all."
        mistakes: {"x² + 4y² + 9z²": square_missing_middle}
      - prompt: "Expand (x + 1)³."
        options: ["x³ + 3x² + 3x + 1", "x³ + 1", "x³ + 3x + 1", "x³ + x² + x + 1"]
        answer: "x³ + 3x² + 3x + 1"
        check: "expand((x + 1)^3)"
        difficulty: 2
        hints: ["(a + b)³ = a³ + b³ + 3ab(a + b).", "3 × x × 1 × (x + 1) = 3x² + 3x."]
        solution: "Step 1: a³ + b³ = x³ + 1. Step 2: 3ab(a + b) = 3x(x + 1) = 3x² + 3x. Step 3: Total x³ + 3x² + 3x + 1."
        mistakes: {"x³ + 1": cube_missing_terms}
      - prompt: "Using an identity, find 99³."
        answer: "970299"
        check: "99^3"
        difficulty: 3
        hints: ["99 = 100 − 1.", "(a − b)³ = a³ − b³ − 3ab(a − b)."]
        solution: "Step 1: 99³ = (100 − 1)³. Step 2: = 1000000 − 1 − 300 × 99. Step 3: = 1000000 − 1 − 29700 = 970299."
      - prompt: "Without cubing, find (−12)³ + 7³ + 5³."
        answer: "-1260"
        check: "(-12)^3 + 7^3 + 5^3"
        difficulty: 3
        hints: ["−12 + 7 + 5 = 0.", "If a + b + c = 0, then a³ + b³ + c³ = 3abc."]
        solution: "Step 1: −12 + 7 + 5 = 0. Step 2: So the sum of cubes = 3 × (−12) × 7 × 5. Step 3: = −1260."
