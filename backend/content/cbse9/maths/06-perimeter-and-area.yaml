# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 6. Format: content/README.md.
subject: cbse9-math
chapter: 6
title: 'Measuring Space: Perimeter and Area'
tips:
  semi_perimeter_half: 's is the SEMI-perimeter: add the three sides, then halve it.'
  heron_forgot_root: 'Heron''s formula ends with a square root: area = √(s(s − a)(s − b)(s − c)).'
  sector_full_circle: 'A sector is only part of the circle: multiply the full-circle amount by θ/360.'
  area_radius_not_squared: 'Area uses r², the radius times itself: πr², not πr or 2πr.'
  brahmagupta_half: 's is half the perimeter: add the four sides and divide by 2 before subtracting each side.'
  brahmagupta_steps: "Find s = half the perimeter, then multiply (s − a)(s − b)(s − c)(s − d) and take the square root."
  circumference_2pir: "Circumference = 2πr. Area is πr². Check which one the question asks for."
  cyclic_only: "Brahmagupta's formula needs a quadrilateral whose four corners lie on a circle. It fails for other shapes with the same sides."
  d_zero_triangle: "If d = 0, the quadrilateral has only three sides left. What formula gives a triangle's area from its three sides?"
  heron_steps: "Find s (half the perimeter), then s − a, s − b, s − c, multiply all four and take the square root."
  pi_not_fraction: "22/7 and 3.14 are only close to π. π's decimals go on for ever without repeating."
  ratio_to_sides: "First turn the ratio into real sides: the parts add to 12, so each part is 48 ÷ 12. Then use Heron's formula."
  c9m6_fraction_of_circle: 'An arc or sector is a fraction of the whole circle: θ/360. Work out that fraction first, then take that much of 2πr (arc) or πr² (sector).'
concepts:
- code: cbse9gm.area.heron
  title: Area of a triangle by Heron's formula
  notes: |
    For a triangle with sides a, b, c, s = (a + b + c)/2 and area = √(s(s − a)(s − b)(s − c)). Useful when
    the height is not known. For an equilateral triangle of side a this gives (√3/4)a².
  explanations:
    text: 'When you know all three sides but not the height, use Heron''s formula. First find s, half the perimeter. Then multiply s by (s − a), (s − b) and (s − c), and take the square root. For sides 3, 4, 5: s = 6, and area = √(6 × 3 × 2 × 1) = √36 = 6.'
    visual: 'Write the four numbers in a row: s, s − a, s − b, s − c. Multiply them along the row, then put the answer under a square-root sign. Factorising into primes first makes the root easy to spot.'
    step_by_step: 'Step 1: Add the sides. Step 2: Halve it to get s. Step 3: Work out s − a, s − b and s − c. Step 4: Multiply all four numbers. Step 5: Take the square root. Step 6: Write square units.'
    real_world: A farmer has a triangular field with sides measured by rope, but no way to measure its height across the middle of the crop. Heron's formula gives the area from the three side lengths alone.
  picture:
    kind: geometry
    points:
      A:
      - 4
      - 8.7
      B:
      - 1
      - 1.5
      C:
      - 9.4
      - 1.5
    segments:
    - - A
      - B
      - '13'
    - - B
      - C
      - '14'
    - - C
      - A
      - '15'
    caption: s = (13 + 14 + 15) ÷ 2 = 21. Area = √(21 × 8 × 7 × 6) = √7056 = 84.
    alt: A triangle with sides 13, 14 and 15. Half the perimeter is 21, and Heron's formula gives an area of 84.
  activity:
    type: formula
    prompt: A triangle has sides 13 cm and 14 cm. Choose the third side c. s = (13 + 14 + c) ÷ 2, area = √(s(s − 13)(s − 14)(s − c)).
    inputs:
    - name: c
      label: Third side c
      min: 1
      max: 30
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: s
      label: s (half the perimeter)
      expr: (27+c)/2
      unit: cm
    - name: prod
      label: s(s − 13)(s − 14)(s − c)
      expr: max(0,((27+c)/2)*((27+c)/2-13)*((27+c)/2-14)*((27+c)/2-c))
    - name: area
      label: Area
      expr: sqrt(max(0,((27+c)/2)*((27+c)/2-13)*((27+c)/2-14)*((27+c)/2-c)))
      unit: cm²
      places: 2
    goals:
    - prompt: Choose c so the area is exactly 84 cm².
      want:
        area: 84
      hint: The product under the root must be 84² = 7056.
      mistakes:
      - when:
          c:
          - 27
          - 30
        say: 'With c = 27 or more, 13 and 14 together can''t reach round the third side: it''s flat, so the area is 0. Each side must be shorter than the other two together.'
      - when:
          c: 14
        say: With c = 14, s = 20.5 and the area is about 81 cm². The product under the root must be 7056 for 84 cm².
    - prompt: 'Make the area as big as you can: over 90 cm².'
      want:
        area:
        - 90
        - 92
      mistakes:
      - when:
          c:
          - 21
          - 30
        say: 'A longer side doesn''t always mean more area: as c nears 27 the triangle flattens. The biggest area comes when the 13 and 14 sides meet at a right angle.'
      - when:
          c:
          - 1
          - 17
        say: 'Still room to grow: open the angle between the 13 and 14 sides wider by making c longer.'
  lesson:
    - teach: 'Area of a triangle = ½ × base × height, but often we know only the three sides. Heron''s formula needs only the sides a, b, c. First find s, the semi-perimeter: s = (a + b + c)/2.'
      check:
        prompt: A triangle has sides 5, 6 and 7. What is s?
        options:
        - '9'
        - '18'
        - '6'
        answer: '9'
        why: (5 + 6 + 7)/2 = 18/2 = 9.
    - teach: 'Then area = √(s(s − a)(s − b)(s − c)). For sides 5, 12, 13: s = 15, so area = √(15 × 10 × 3 × 2) = √900 = 30.'
      picture:
        kind: flow
        steps:
        - Sides 5, 12, 13
        - s = 30 ÷ 2 = 15
        - s − a, s − b, s − c = 10, 3, 2
        - 15 × 10 × 3 × 2 = 900
        - Area = √900 = 30
        alt: 'Heron''s formula worked for sides 5, 12, 13: s = 15, product 900, area 30.'
      check:
        prompt: Sides 6, 8, 10 give s = 12. What is s(s − a)(s − b)(s − c)?
        options:
        - '576'
        - '24'
        - '48'
        answer: '576'
        why: 12 × 6 × 4 × 2 = 576, and √576 = 24 is the area.
    - teach: 'Check by another way when you can: 6, 8, 10 is a right triangle (36 + 64 = 100), so its area is ½ × 6 × 8 = 24, the same as Heron''s. Don''t forget the square root at the end.'
      check:
        prompt: Heron's formula gives √144 for a triangle. What is the area?
        options:
        - '12'
        - '144'
        - '72'
        answer: '12'
        why: 'The area is the square root: √144 = 12.'
  items:
  - prompt: Find s for a triangle with sides 7 cm, 8 cm and 9 cm.
    answer: '12'
    check: (7 + 8 + 9)/2
    difficulty: 1
    hints:
    - Add the sides.
    - Halve it.
    solution: s = (7 + 8 + 9) ÷ 2 = 24 ÷ 2 = 12 cm.
    mistakes:
      '24': semi_perimeter_half
  - prompt: Find the area of a triangle with sides 3 cm, 4 cm and 5 cm, in cm².
    answer: '6'
    check: sqrt(6*3*2*1)
    difficulty: 1
    hints:
    - s = 6.
    - √(6 × 3 × 2 × 1).
    solution: 'Step 1: s = 6. Step 2: Area = √(6 × 3 × 2 × 1) = √36 = 6 cm².'
    mistakes:
      '36': heron_forgot_root
  - prompt: Find the area of a triangle with sides 13 m, 14 m and 15 m, in m².
    answer: '84'
    check: sqrt(21*8*7*6)
    difficulty: 2
    hints:
    - s = 21.
    - √(21 × 8 × 7 × 6).
    solution: 'Step 1: s = 21. Step 2: s − a = 8, s − b = 7, s − c = 6. Step 3: Area = √7056 = 84 m².'
    mistakes:
      '7056': heron_forgot_root
  - prompt: A triangle has sides 5 cm, 5 cm and 6 cm. Find its area in cm².
    answer: '12'
    check: sqrt(8*3*3*2)
    difficulty: 2
    hints:
    - s = 8.
    - √(8 × 3 × 3 × 2).
    solution: 'Step 1: s = 8. Step 2: Area = √(8 × 3 × 3 × 2) = √144 = 12 cm².'
    mistakes: {"144": "heron_forgot_root", "15": "heron_steps"}
  - prompt: 'The sides of a triangle are in the ratio 3 : 4 : 5 and its perimeter is 48 cm. Find its area in cm².'
    answer: '96'
    check: sqrt(24*12*8*4)
    difficulty: 3
    hints:
    - Sides are 12, 16, 20.
    - s = 24.
    solution: 'Step 1: 12x = 48, x = 4, sides 12, 16, 20. Step 2: s = 24. Step 3: Area = √(24 × 12 × 8 × 4) = √9216 = 96 cm².'
    mistakes: {"6": "ratio_to_sides", "9216": "heron_forgot_root"}
  - prompt: An equilateral triangle has side 6 cm. Find s in cm.
    answer: '9'
    check: 18/2
    difficulty: 1
    hints:
    - Perimeter = 3 × 6.
    - Halve it.
    solution: s = (6 + 6 + 6) ÷ 2 = 9 cm.
    mistakes:
      '18': semi_perimeter_half
  - prompt: A triangle has sides 9 cm, 12 cm and 15 cm. Find its area in cm².
    answer: '54'
    check: sqrt(18*9*6*3)
    difficulty: 2
    hints:
    - s = 18.
    - √(18 × 9 × 6 × 3).
    solution: 'Step 1: s = 18. Step 2: Area = √2916 = 54 cm².'
    mistakes:
      '2916': heron_forgot_root
  - prompt: Find s for a triangle with sides 4 cm, 7 cm and 9 cm.
    answer: '10'
    check: (4 + 7 + 9)/2
    difficulty: 1
    hints:
    - Add the sides.
    - Halve the perimeter.
    solution: (4 + 7 + 9)/2 = 20/2 = 10.
    mistakes:
      '20': semi_perimeter_half
  - prompt: Find the area of a triangle with sides 6 cm, 8 cm and 10 cm, in cm².
    answer: '24'
    check: sqrt(12*6*4*2)
    difficulty: 1
    hints:
    - s = 12.
    - √(12 × 6 × 4 × 2).
    solution: √576 = 24 cm².
    mistakes:
      '576': heron_forgot_root
      '48': heron_steps
  - prompt: Find the area of a triangle with sides 5 cm, 12 cm and 13 cm, in cm².
    answer: '30'
    check: sqrt(15*10*3*2)
    difficulty: 1
    hints:
    - s = 15.
    - 15 × 10 × 3 × 2 = 900.
    solution: √900 = 30 cm².
    mistakes:
      '900': heron_forgot_root
      '60': heron_steps
  - prompt: A triangle has sides 10 cm, 10 cm and 12 cm. Find its area in cm².
    answer: '48'
    check: sqrt(16*6*6*4)
    difficulty: 2
    hints:
    - s = 16.
    - 16 × 6 × 6 × 4.
    solution: √2304 = 48 cm².
    mistakes:
      '2304': heron_forgot_root
      '32': semi_perimeter_half
  - prompt: Find the area of a triangle with sides 7 m, 24 m and 25 m, in m².
    answer: '84'
    check: sqrt(28*21*4*3)
    difficulty: 2
    hints:
    - s = 28.
    - 28 × 21 × 4 × 3 = 7056.
    solution: √7056 = 84 m².
    mistakes:
      '7056': heron_forgot_root
      '168': heron_steps
  - prompt: An equilateral triangle has side 4 cm. Using Heron's formula, its area is √(6 × 2 × 2 × 2). What is that?
    options:
    - 4√3 cm²
    - 48 cm²
    - 12 cm²
    - 8 cm²
    answer: 4√3 cm²
    difficulty: 2
    hints:
    - 6 × 2 × 2 × 2 = 48.
    - √48 = √(16 × 3).
    solution: √48 = 4√3 ≈ 6.93 cm².
    mistakes:
      48 cm²: heron_forgot_root
  - prompt: A triangular park has sides 50 m, 120 m and 130 m. Find its area in m².
    answer: '3000'
    check: sqrt(150*100*30*20)
    difficulty: 2
    hints:
    - s = 150.
    - 150 × 100 × 30 × 20 = 9,000,000.
    solution: √9000000 = 3000 m².
    mistakes:
      '9000000': heron_forgot_root
      '6000': heron_steps
  - prompt: 'The sides of a triangle are in the ratio 5 : 12 : 13 and its perimeter is 60 cm. Find its area in cm².'
    answer: '120'
    check: sqrt(30*20*6*4)
    difficulty: 3
    hints:
    - 5 + 12 + 13 = 30 parts for 60 cm, so each part is 2.
    - Sides 10, 24, 26; s = 30.
    solution: Sides 10, 24, 26. s = 30. Area = √(30 × 20 × 6 × 4) = √14400 = 120 cm².
    mistakes:
      '30': ratio_to_sides
      '14400': heron_forgot_root
  - prompt: An isosceles triangle has perimeter 32 cm and base 12 cm. Find its area in cm².
    answer: '48'
    check: sqrt(16*6*6*4)
    difficulty: 3
    hints:
    - The equal sides are (32 − 12)/2 = 10.
    - s = 16.
    solution: Sides 10, 10, 12. Area = √(16 × 6 × 6 × 4) = √2304 = 48 cm².
    mistakes:
      '2304': heron_forgot_root
      '96': semi_perimeter_half
- code: cbse9gm.area.circle_sector
  title: Circles, arcs and sectors
  after:
  - cbse9gm.area.heron
  notes: |
    π is the ratio of any circle's circumference to its diameter; it is irrational (≈ 3.14159, often 22/7).
    Circumference = 2πr; area = πr². An arc of angle θ (in degrees) has length (θ/360) × 2πr; a sector of
    angle θ has area (θ/360) × πr². A semicircle is the sector with θ = 180°, a quadrant θ = 90°.
  explanations:
    text: A sector is a slice of a round pizza. If the slice's angle is θ, it is θ/360 of the whole circle, so its area is θ/360 × πr² and its curved edge (the arc) is θ/360 × 2πr.
    visual: 'Draw a circle of radius 7 and shade a 90° slice from the centre. The slice is a quarter of the circle: area = ¼ × (22/7) × 7 × 7 = 38.5, and its curved edge is ¼ × 2 × (22/7) × 7 = 11.'
    step_by_step: 'Step 1: Find the fraction of the circle: θ/360. Step 2: Whole area = πr² (or whole circumference = 2πr). Step 3: Multiply the two. Step 4: For the sector''s perimeter, add the two radii to the arc.'
    real_world: 'A wall clock''s minute hand sweeps a sector: in 15 minutes it turns 90°, so the tip travels a quarter of the circumference.'
  picture:
    kind: geometry
    points:
      O:
      - 5
      - 5
      A:
      - 9
      - 5
      B:
      - 5
      - 9
    circles:
    - centre: O
      radius: 4
    segments:
    - - O
      - A
      - r
    - - O
      - B
      - r
    angles:
    - at: O
      from: A
      to: B
      label: 90°
    caption: A 90° sector is 90/360 = ¼ of the circle.
    alt: A circle with centre O and two radii OA and OB at right angles, marking a quarter-circle sector.
  activity:
    type: formula
    prompt: Change the radius r and the angle θ of a sector. Arc = (θ/360) × 2πr, area = (θ/360) × πr².
    inputs:
    - name: r
      label: Radius r
      min: 1
      max: 14
      step: 1
      start: 1
      unit: cm
    - name: t
      label: Angle θ
      min: 0
      max: 360
      step: 15
      start: 0
      unit: °
    outputs:
    - name: arc
      label: Arc length
      expr: t/360*2*pi*r
      unit: cm
      places: 2
    - name: area
      label: Sector area
      expr: t/360*pi*r^2
      unit: cm²
      places: 2
    goals:
    - prompt: Make a sector with an arc of about 22 cm and an area of about 154 cm².
      want:
        arc:
        - 21.9
        - 22.1
        area:
        - 153.5
        - 154.5
      hint: Area ÷ arc = r/2 for any sector. What radius does that give?
      mistakes:
      - when:
          r: 7
          t: 360
        say: A whole circle of radius 7 has the right area, but its edge is 44 cm, not 22. The same area with a longer radius is a thinner slice.
      - when:
          t: 360
        say: 'θ = 360° is the whole circle. A sector is a part of it: what fraction of 360° do you need?'
      - when:
          arc:
          - 21.9
          - 22.1
        say: 'The arc is right. Now the area: a sector with radius r has area = arc × r ÷ 2.'
    - prompt: Make a semicircle with an area of about 77 cm².
      want:
        t: 180
        area:
        - 76.5
        - 77.5
      mistakes:
      - when:
          t: 360
          r: 5
        say: That's a whole circle of radius 5, about 78.5 cm². A semicircle is half a circle, so it needs a bigger radius to hold the same.
      - when:
          t: 90
        say: 90° is a quadrant, a quarter circle. A semicircle is half a turn.
      - when:
          t: 180
          r:
          - 10
          - 14
        say: 'That semicircle is much too big: area grows with r², so doubling r makes it four times as big.'
  lesson:
    - teach: 'For every circle, circumference ÷ diameter is the same number, π ≈ 3.14159… (often 22/7). So circumference C = πd = 2πr, and the area A = πr². π is irrational: 22/7 is only an approximation.'
      check:
        prompt: A circle has radius 7 cm. What is its circumference (π = 22/7)?
        options:
        - 44 cm
        - 22 cm
        - 154 cm
        answer: 44 cm
        why: 2 × 22/7 × 7 = 44. (154 cm² is the area.)
    - teach: 'An arc is a piece of the circumference, and a sector is a slice of the area, cut by an angle θ at the centre. Both are the fraction θ/360 of the whole: arc = (θ/360) × 2πr, sector = (θ/360) × πr².'
      picture:
        kind: geometry
        points:
          O:
          - 5
          - 5
          A:
          - 8.5
          - 5
          B:
          - 5
          - 8.5
        circles:
        - centre: O
          radius: 3.5
        segments:
        - - O
          - A
          - r
        - - O
          - B
          - r
        angles:
        - at: O
          from: A
          to: B
          label: 90°
        caption: A 90° sector is 90/360 = ¼ of the circle.
        alt: Circle with centre O and two radii OA and OB at 90°, cutting off a quarter of the circle.
      check:
        prompt: What fraction of the circle is a 120° sector?
        options:
        - 1/3
        - 1/4
        - 1/2
        answer: 1/3
        why: 120/360 = 1/3.
    - teach: 'Example: radius 14 cm, θ = 45°. Fraction 45/360 = 1/8. Arc = 1/8 × 2 × 22/7 × 14 = 11 cm. Sector = 1/8 × 22/7 × 196 = 77 cm².'
      check:
        prompt: A semicircle has radius 7 cm. What is its area (π = 22/7)?
        options:
        - 77 cm²
        - 154 cm²
        - 22 cm²
        answer: 77 cm²
        why: Half of 22/7 × 49 = 154 is 77.
  items:
  - prompt: Find the circumference of a circle of radius 7 cm, using π = 22/7.
    answer: '44'
    check: 2*22/7*7
    difficulty: 1
    hints:
    - C = 2πr.
    - 2 × 22/7 × 7.
    solution: 'Step 1: C = 2 × (22/7) × 7. Step 2: = 44 cm.'
    mistakes: {"22": "circumference_2pir", "154": "circumference_2pir"}
  - prompt: Find the area of a circle of radius 14 cm, using π = 22/7.
    answer: '616'
    check: 22/7*14^2
    difficulty: 1
    hints:
    - A = πr².
    - 22/7 × 196.
    solution: 'Step 1: r² = 196. Step 2: (22/7) × 196 = 616 cm².'
    mistakes:
      '44': area_radius_not_squared
      '88': area_radius_not_squared
  - prompt: Find the area of a 90° sector of a circle of radius 14 cm (π = 22/7).
    answer: '154'
    check: 90/360*22/7*14^2
    difficulty: 2
    hints:
    - 90° is a quarter of the circle.
    - ¼ × 616.
    solution: 'Step 1: Full area = 616 cm². Step 2: 90/360 = 1/4. Step 3: 616 ÷ 4 = 154 cm².'
    mistakes:
      '616': sector_full_circle
  - prompt: Find the length of a 60° arc of a circle of radius 21 cm (π = 22/7).
    answer: '22'
    check: 60/360*2*22/7*21
    difficulty: 2
    hints:
    - 60° is 1/6 of the circle.
    - Circumference = 2 × 22/7 × 21 = 132.
    solution: 'Step 1: Circumference = 132 cm. Step 2: 1/6 of 132 = 22 cm.'
    mistakes:
      '132': sector_full_circle
  - prompt: Why is π called irrational?
    options:
    - It cannot be written exactly as a fraction p/q
    - It changes with the size of the circle
    - It is exactly 22/7
    - It is a negative number
    answer: It cannot be written exactly as a fraction p/q
    difficulty: 2
    hints:
    - 22/7 is only close to π.
    - Its decimals never repeat.
    solution: 'Step 1: π = 3.14159… goes on without repeating. Step 2: So no fraction equals it exactly; 22/7 is an approximation.'
    mistakes: {"It is exactly 22/7": "pi_not_fraction", "It changes with the size of the circle": "pi_not_fraction"}
  - prompt: The minute hand of a clock is 7 cm long. What area does it sweep in 30 minutes, in cm² (π = 22/7)?
    answer: '77'
    check: 180/360*22/7*7^2
    difficulty: 3
    hints:
    - In 30 minutes the hand turns 180°.
    - Half of (22/7) × 49.
    solution: 'Step 1: 60 minutes = 360°, so 30 minutes = 180°. Step 2: Full area = (22/7) × 49 = 154 cm². Step 3: Half of 154 = 77 cm².'
    mistakes:
      '154': sector_full_circle
  - prompt: Find the circumference of a circle of radius 14 cm, using π = 22/7.
    answer: '88'
    check: 2*22/7*14
    difficulty: 1
    hints:
    - C = 2πr.
    - 2 × 22/7 × 14.
    solution: 2 × 22 × 2 = 88 cm.
    mistakes:
      '44': circumference_2pir
      '616': circumference_2pir
  - prompt: Find the area of a circle of radius 7 cm, using π = 22/7.
    answer: '154'
    check: 22/7*49
    difficulty: 1
    hints:
    - A = πr².
    - 22/7 × 49.
    solution: 22 × 7 = 154 cm².
    mistakes:
      '44': area_radius_not_squared
      '22': area_radius_not_squared
  - prompt: A circle has diameter 21 cm. Find its circumference in cm (π = 22/7).
    answer: '66'
    check: 22/7*21
    difficulty: 1
    hints:
    - C = πd.
    - 22/7 × 21.
    solution: 22 × 3 = 66 cm.
    mistakes:
      '132': circumference_2pir
      '33': circumference_2pir
  - prompt: Find the area of a 60° sector of a circle of radius 21 cm (π = 22/7).
    answer: '231'
    check: 60/360*22/7*21**2
    difficulty: 2
    hints:
    - 60° is 1/6 of the circle.
    - 1/6 × 22/7 × 441.
    solution: Whole area = 1386 cm². One sixth = 231 cm².
    mistakes:
      '1386': sector_full_circle
      '22': c9m6_fraction_of_circle
  - prompt: Find the length of a 90° arc of a circle of radius 14 cm (π = 22/7).
    answer: '22'
    check: 90/360*2*22/7*14
    difficulty: 2
    hints:
    - 90° is ¼ of the circle.
    - ¼ of 88.
    solution: Circumference 88 cm; a quarter is 22 cm.
    mistakes:
      '88': sector_full_circle
      '154': c9m6_fraction_of_circle
  - prompt: A circle's circumference is 132 cm. Find its radius in cm (π = 22/7).
    answer: '21'
    check: 132/(2*22/7)
    difficulty: 2
    hints:
    - 2πr = 132.
    - r = 132 ÷ (44/7).
    solution: r = 132 × 7/44 = 21 cm.
    mistakes:
      '42': circumference_2pir
  - prompt: Which value is exactly π?
    options:
    - None of these; π can't be written as a fraction or finite decimal
    - 22/7
    - '3.14'
    - '3.1416'
    answer: None of these; π can't be written as a fraction or finite decimal
    difficulty: 2
    hints:
    - Is π rational?
    - 22/7 and 3.14 are close, not equal.
    solution: π is irrational, so no fraction or finite decimal equals it exactly. 22/7 = 3.1428… and π = 3.14159…
    mistakes:
      22/7: pi_not_fraction
      '3.14': pi_not_fraction
  - prompt: A circular field of radius 35 m is fenced. Fencing costs ₹20 per metre. Find the cost in ₹ (π = 22/7).
    answer: '4400'
    check: 2*22/7*35*20
    difficulty: 3
    hints:
    - Fence = circumference.
    - 2 × 22/7 × 35 = 220 m.
    solution: Circumference = 220 m; cost = 220 × 20 = ₹4400.
    mistakes:
      '77000': area_radius_not_squared
      '2200': circumference_2pir
  - prompt: A pizza of radius 14 cm is cut into 8 equal slices. What is the area of one slice in cm² (π = 22/7)?
    answer: '77'
    check: 22/7*14**2/8
    difficulty: 3
    hints:
    - Each slice is a 45° sector.
    - Whole area 616 cm².
    solution: 616 ÷ 8 = 77 cm².
    mistakes:
      '616': sector_full_circle
      '11': c9m6_fraction_of_circle
- code: cbse9gm.area.brahmagupta
  title: Brahmagupta's formula for cyclic quadrilaterals
  after:
  - cbse9gm.area.heron
  notes: |
    Brahmagupta (7th century) gave the area of a cyclic quadrilateral (all four corners on one circle) with
    sides a, b, c, d: with s = (a + b + c + d)/2, area = √((s − a)(s − b)(s − c)(s − d)). If one side shrinks to
    0 the quadrilateral becomes a triangle and the formula becomes Heron's. A rectangle is cyclic: for sides
    a, b, a, b, s = a + b and the formula gives √(b·a·b·a) = ab.
  explanations:
    text: 'Heron''s formula finds a triangle''s area from its three sides. Brahmagupta went further: for a four-sided figure whose corners all sit on one circle, area = √((s − a)(s − b)(s − c)(s − d)), where s is half the perimeter.'
    visual: 'Draw a circle and put four corners on it: a cyclic quadrilateral with sides a, b, c, d. Write s = half the perimeter, then four brackets: (s − a), (s − b), (s − c), (s − d). Multiply them and take the square root.'
    step_by_step: 'Step 1: Check the corners lie on one circle. Step 2: s = (a + b + c + d)/2. Step 3: Work out s − a, s − b, s − c, s − d. Step 4: Multiply and take the square root.'
    real_world: 'A farmer''s field shaped like a cyclic quadrilateral can be measured just by walking its four sides: no need to measure any angle or height.'
  picture:
    kind: flow
    steps:
    - Sides 5, 5, 5, 5 (a square in a circle)
    - s = 20 ÷ 2 = 10
    - (10 − 5)⁴ = 5⁴ = 625
    - Area = √625 = 25
    alt: 'Brahmagupta''s formula on a square of side 5: s is 10, the product is 625, and the area is 25.'
  activity:
    type: sort
    prompt: 'Brahmagupta''s formula works only for cyclic quadrilaterals: all four corners on one circle. Can you use it?'
    bins:
    - Yes, it is cyclic
    - No, it isn't cyclic
    items:
    - label: A rectangle
      bin: Yes, it is cyclic
      clue: Opposite angles are 90° and 90°. What do they add to?
      why: 90° + 90° = 180°, so a rectangle is cyclic. The formula gives √(b·a·b·a) = ab.
    - label: A square
      bin: Yes, it is cyclic
      clue: Do its opposite angles add to 180°?
      why: 'All angles are 90°, so opposite pairs add to 180°: cyclic.'
    - label: A rhombus that is not a square
      bin: No, it isn't cyclic
      clue: Its opposite angles are equal. Are they 90°?
      why: Equal opposite angles add to 180° only if both are 90°. A non-square rhombus can't be cyclic.
    - label: A parallelogram that is not a rectangle
      bin: No, it isn't cyclic
      clue: Opposite angles of a parallelogram are equal. Can two equal angles add to 180° without being 90°?
      why: They'd both have to be 90°, making a rectangle. So it isn't cyclic.
    - label: An isosceles trapezium
      bin: Yes, it is cyclic
      clue: Its base angles are equal. Do the angles on each slanted side add to 180°?
      why: 'Angles on each slanted side add to 180° and the base angles match, so opposite angles add to 180°: cyclic.'
    - label: Opposite angles of 70° and 110°
      bin: Yes, it is cyclic
      clue: Add the two opposite angles.
      why: '70° + 110° = 180°: cyclic, so the formula works.'
    - label: Opposite angles of 80° and 110°
      bin: No, it isn't cyclic
      clue: Add the two opposite angles.
      why: '80° + 110° = 190°, not 180°: not cyclic, so the formula gives the wrong area.'
    - label: A triangle (one side shrunk to 0)
      bin: Yes, it is cyclic
      clue: Can you draw a circle through any three corners?
      why: Any triangle fits in a circle. With d = 0 Brahmagupta's formula turns into Heron's.
  lesson:
    - teach: Heron found a triangle's area from its sides. Brahmagupta, a 7th-century Indian mathematician, did the same for a cyclic quadrilateral (all four corners on one circle). With sides a, b, c, d, let s = (a + b + c + d)/2.
      check:
        prompt: A cyclic quadrilateral has sides 2, 3, 4, 5. What is s?
        options:
        - '7'
        - '14'
        - '3.5'
        answer: '7'
        why: (2 + 3 + 4 + 5)/2 = 14/2 = 7.
    - teach: 'Area = √((s − a)(s − b)(s − c)(s − d)). For a square of side 5: s = 10, so area = √(5 × 5 × 5 × 5) = 25. It works only when the quadrilateral is cyclic; rectangles and squares always are.'
      picture:
        kind: compare
        columns:
        - title: Heron (triangle)
          points:
          - s = (a + b + c)/2
          - Area = √(s(s − a)(s − b)(s − c))
        - title: Brahmagupta (cyclic quadrilateral)
          points:
          - s = (a + b + c + d)/2
          - Area = √((s − a)(s − b)(s − c)(s − d))
        alt: 'Heron''s formula beside Brahmagupta''s: put d = 0 in Brahmagupta''s and s − d becomes s, giving Heron''s.'
      check:
        prompt: 'Rectangle 8 by 2 (sides 8, 2, 8, 2): s = 10. What area does the formula give?'
        options:
        - '16'
        - '20'
        - '256'
        answer: '16'
        why: √(2 × 8 × 2 × 8) = √256 = 16 = 8 × 2.
    - teach: If one side d shrinks to 0, the quadrilateral becomes a triangle, s − d becomes s, and the formula turns into Heron's. A non-cyclic quadrilateral with the same sides has a smaller area, so the formula would overestimate it.
      check:
        prompt: What happens to Brahmagupta's formula when d = 0?
        options:
        - It becomes Heron's formula
        - It gives 0
        - It stops working
        answer: It becomes Heron's formula
        why: s − d = s, giving √(s(s − a)(s − b)(s − c)).
  items:
  - prompt: For a cyclic quadrilateral with sides 3, 4, 5 and 6, what is s?
    answer: '9'
    check: (3 + 4 + 5 + 6)/2
    difficulty: 1
    hints:
    - s is half the perimeter.
    - 18 ÷ 2.
    solution: 'Step 1: Perimeter = 18. Step 2: s = 9.'
    mistakes:
      '18': brahmagupta_half
  - prompt: Use Brahmagupta's formula for a rectangle 6 by 4 (sides 6, 4, 6, 4). What area does it give?
    answer: '24'
    check: sqrt((10-6)*(10-4)*(10-6)*(10-4))
    difficulty: 1
    hints:
    - s = 10.
    - √(4 × 6 × 4 × 6).
    solution: 'Step 1: s = 20/2 = 10. Step 2: √(4 × 6 × 4 × 6) = √576 = 24, the same as 6 × 4.'
    mistakes: {"576": "brahmagupta_steps", "20": "brahmagupta_half"}
  - prompt: Find the area of a cyclic quadrilateral with sides 5, 5, 5 and 5.
    answer: '25'
    check: sqrt(5^4)
    difficulty: 2
    hints:
    - s = 10.
    - Each bracket is 5.
    solution: 'Step 1: s = 10. Step 2: √(5 × 5 × 5 × 5) = 25.'
    mistakes: {"625": "brahmagupta_steps", "20": "brahmagupta_half"}
  - prompt: Brahmagupta's formula works for which quadrilaterals?
    options:
    - Those whose four corners lie on a circle
    - Every quadrilateral
    - Only squares
    - Only those with a right angle
    answer: Those whose four corners lie on a circle
    difficulty: 2
    hints:
    - They are called cyclic.
    - A rectangle is one.
    solution: 'Step 1: The formula needs a cyclic quadrilateral. Step 2: For other shapes with the same sides it gives the wrong area.'
    mistakes: {"Every quadrilateral": "cyclic_only", "Only squares": "cyclic_only"}
  - prompt: If one side d of the quadrilateral becomes 0, Brahmagupta's formula turns into which formula?
    options:
    - Heron's formula for a triangle
    - The area of a circle
    - The area of a rectangle
    - Pythagoras' theorem
    answer: Heron's formula for a triangle
    difficulty: 2
    hints:
    - Four sides with one of length 0 is a triangle.
    - √(s(s − a)(s − b)(s − c)).
    solution: 'Step 1: With d = 0, s − d = s. Step 2: The formula becomes √(s(s − a)(s − b)(s − c)), Heron''s formula.'
    mistakes: {"The area of a rectangle": "d_zero_triangle", "Pythagoras' theorem": "d_zero_triangle"}
  - prompt: Find the area of a cyclic quadrilateral with sides 7, 15, 20 and 24.
    answer: '234'
    check: sqrt((33-7)*(33-15)*(33-20)*(33-24))
    difficulty: 3
    hints:
    - s = 66 ÷ 2 = 33.
    - 26 × 18 × 13 × 9.
    solution: 'Step 1: s = 33. Step 2: (33 − 7)(33 − 15)(33 − 20)(33 − 24) = 26 × 18 × 13 × 9 = 54756. Step 3: √54756 = 234.'
    mistakes:
      '468': brahmagupta_half
  - prompt: A cyclic quadrilateral has sides 6, 7, 8 and 9. What is s?
    answer: '15'
    check: (6 + 7 + 8 + 9)/2
    difficulty: 1
    hints:
    - Add the four sides.
    - Halve.
    solution: 30/2 = 15.
    mistakes:
      '30': semi_perimeter_half
  - prompt: Use Brahmagupta's formula on a square of side 7. What area does it give?
    answer: '49'
    check: sqrt(7**4)
    difficulty: 1
    hints:
    - s = 14, so each s − a = 7.
    - √(7 × 7 × 7 × 7).
    solution: √2401 = 49, the same as 7 × 7.
    mistakes:
      '2401': heron_forgot_root
      '28': brahmagupta_steps
  - prompt: Rectangle 9 by 4 (sides 9, 4, 9, 4). What is the area from Brahmagupta's formula?
    answer: '36'
    check: sqrt(4*9*4*9)
    difficulty: 1
    hints:
    - s = 13.
    - s − a = 4, 9, 4, 9.
    solution: √(4 × 9 × 4 × 9) = √1296 = 36.
    mistakes:
      '1296': heron_forgot_root
      '26': brahmagupta_half
  - prompt: Find the area of a cyclic quadrilateral with sides 3, 3, 5 and 5.
    answer: '15'
    check: sqrt(5*5*3*3)
    difficulty: 2
    hints:
    - s = 8.
    - 's − a: 5, 5, 3, 3.'
    solution: √(5 × 5 × 3 × 3) = √225 = 15.
    mistakes:
      '225': heron_forgot_root
      '16': brahmagupta_steps
  - prompt: Which quadrilateral is always cyclic?
    options:
    - A rectangle
    - A rhombus that is not a square
    - A parallelogram
    - Any kite
    answer: A rectangle
    difficulty: 2
    hints:
    - Cyclic means opposite angles add to 180°.
    - Which shape has all angles 90°?
    solution: A rectangle has opposite angles 90° + 90° = 180°, so it is always cyclic.
    mistakes:
      A parallelogram: cyclic_only
      A rhombus that is not a square: cyclic_only
  - prompt: A cyclic quadrilateral has sides 1, 5, 5 and 7. Find its area.
    answer: '16'
    check: sqrt(8*4*4*2)
    difficulty: 2
    hints:
    - s = 9.
    - 's − a: 8, 4, 4, 2.'
    solution: √(8 × 4 × 4 × 2) = √256 = 16.
    mistakes:
      '256': heron_forgot_root
      '18': semi_perimeter_half
  - prompt: Why can't Brahmagupta's formula be used for every quadrilateral?
    options:
    - It needs all four corners on one circle
    - It needs all sides equal
    - It works only for triangles
    - It needs a right angle
    answer: It needs all four corners on one circle
    difficulty: 2
    hints:
    - Four sides don't fix the shape of a quadrilateral.
    - Which condition makes the formula true?
    solution: The same four sides can make many shapes with different areas. The formula gives the area only of the cyclic one.
    mistakes:
      It needs all sides equal: cyclic_only
  - prompt: Set d = 0 in Brahmagupta's formula for sides 3, 4, 5, 0. What area does it give?
    answer: '6'
    check: sqrt(6*3*2*1)
    difficulty: 3
    hints:
    - s = 6.
    - √((6 − 3)(6 − 4)(6 − 5)(6 − 0)).
    solution: √(3 × 2 × 1 × 6) = √36 = 6, the area of the 3-4-5 triangle.
    mistakes:
      '36': heron_forgot_root
      '0': d_zero_triangle
  - prompt: A cyclic quadrilateral has sides 5, 5, 11 and 11. Find its area.
    answer: '55'
    check: sqrt(11*11*5*5)
    difficulty: 3
    hints:
    - s = 16.
    - 's − a: 11, 11, 5, 5.'
    solution: √(11 × 11 × 5 × 5) = 11 × 5 = 55.
    mistakes:
      '3025': heron_forgot_root
      '32': brahmagupta_half
