# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 14. Format: content/README.md.
subject: cbse9-math
chapter: 14
title: 'Math of Space: Surface Area and Volume'
tips:
  slant_not_height: For a cone, the curved surface uses the slant height l, where l² = r² + h². Don't use the vertical height h.
  cone_third: 'A cone holds one third of the cylinder with the same base and height: V = ⅓πr²h.'
  hemisphere_total: 'A solid hemisphere has a curved part (2πr²) AND a flat circular top (πr²): total 3πr².'
  cone_base: 'Total surface area includes the flat circular base too: TSA = πrl + πr².'
  sphere_four: Surface area of a sphere is 4πr², four times the area of its biggest circle.
  cylinder_curved_vs_total: The curved surface is 2πrh only; the total adds the two circular ends, 2πr².
  volume_used_diameter: 'Use the radius in πr²h: halve the diameter first.'
  cone_csa_pirl: "Curved surface of a cone = πrl, using the slant height l. There's no 2 in front."
  csa_cylinder_2pirh: "The curved surface unrolls into a rectangle: one side is the circumference 2πr, the other the height."
  cube_six_faces: "A cube has 6 equal square faces. Find one face's area, then multiply by 6."
  hemisphere_csa: "A hemisphere's curved surface is half of a sphere's 4πr²."
  hemisphere_volume: "A hemisphere holds half a sphere: (2/3)πr³. Cube the radius first."
  m3_to_litres: "Find the volume in m³ first, then remember 1 m³ holds 1000 litres."
  sphere_volume: "Volume of a sphere = (4/3)πr³. Cube the radius (21 × 21 × 21) before multiplying."
  volume_lbh: "Volume = length × breadth × height. Area of the faces is a different thing."
concepts:
- code: cbse9gm.solid.cuboid_cylinder
  title: Cuboids and cylinders
  notes: |
    Cuboid with length l, width w, height h: surface area 2(lw + wh + hl), volume lwh; a cube of side a has
    surface area 6a² and volume a³. Cylinder with radius r and height h: curved surface area 2πrh (the label
    unrolls to a rectangle 2πr by h), total surface area 2πr(h + r), volume πr²h. 1 litre = 1000 cm³.
    Guesstimates: estimate real objects (a water tank, a pencil) by rounding their measures.
  explanations:
    text: 'Volume measures how much fits inside; surface area measures how much covers the outside. A cuboid holds l × w × h. A cylinder is a stack of circles: volume = πr²h. Its curved side unrolls into a rectangle 2πr long and h tall, so the curved surface is 2πrh.'
    visual: 'Peel the label off a can and lay it flat: it is a rectangle whose length is the can''s circumference 2πr and whose width is the height h. Add the two circular lids, πr² each, for the total surface area.'
    step_by_step: 'Step 1: Decide whether you need surface area (covering) or volume (filling). Step 2: Use radius, not diameter. Step 3: Put the numbers into the formula. Step 4: Convert units (1000 cm³ = 1 litre).'
    real_world: 'A water tank 1 m across and 1.4 m tall holds about 3.14 × 0.5² × 1.4 ≈ 1.1 m³, roughly 1100 litres: enough for a family for a day or two.'
  picture:
    kind: flow
    steps:
    - 'Cylinder: radius r, height h'
    - 'Unroll the side: a rectangle 2πr × h'
    - Curved surface = 2πrh
    - 'Add two lids: 2πr²'
    - Volume = πr²h
    alt: A cylinder's curved side unrolls to a rectangle 2 pi r by h; add two circular lids for the total surface; volume is pi r squared h.
  activity:
    type: formula
    prompt: A tin is a cylinder. Change the radius r and height h.
    inputs:
    - name: r
      label: Radius r
      min: 1
      max: 14
      step: 1
      start: 1
      unit: cm
    - name: h
      label: Height h
      min: 1
      max: 60
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: csa
      label: Curved surface 2πrh
      expr: 2*pi*r*h
      unit: cm²
      places: 1
    - name: tsa
      label: Total surface 2πr(h + r)
      expr: 2*pi*r*(h+r)
      unit: cm²
      places: 1
    - name: vol
      label: Volume πr²h
      expr: pi*r^2*h
      unit: cm³
      places: 1
    goals:
    - prompt: A tin has radius 7 cm. Its paper label (round the side only) must be 440 cm². Find the height.
      want:
        r: 7
        csa:
        - 439
        - 441
      hint: 'The label unrolls into a rectangle: 2πr long and h tall.'
      mistakes:
      - when:
          r: 7
          h: 3
        say: With h = 3 the whole tin, lids included, is 440 cm². A label only wraps the curved side, not the two circles.
    - prompt: 'Same radius: make the tin hold about 2.31 litres (1 litre = 1000 cm³).'
      want:
        r: 7
        vol:
        - 2300
        - 2320
      mistakes:
      - when:
          r: 7
          h:
          - 52
          - 53
        say: 'You made the curved surface 2310 cm²: that''s the label''s area, not what the tin holds. Volume is πr² × h.'
      - when:
          r: 7
          h:
          - 1
          - 2
        say: That holds only about 154 to 308 cm³, under a third of a litre. 2.31 litres is 2310 cm³.
  lesson:
    - teach: 'Surface area is the area of all the outside faces, like the paper to wrap a box. Volume is the space inside, like the water a tank holds. A cuboid l × w × h has 6 rectangular faces in 3 equal pairs: surface area 2(lw + wh + hl), volume lwh.'
      picture:
        kind: flow
        steps:
        - 'Top and bottom: 2 × lw'
        - 'Front and back: 2 × lh'
        - 'Two sides: 2 × wh'
        - 'Add them: 2(lw + wh + hl)'
        alt: The six faces of a cuboid come in three equal pairs, so the surface area is 2(lw + wh + hl).
      check:
        prompt: A box is 5 cm × 4 cm × 2 cm. What is its volume?
        options:
        - 40 cm³
        - 11 cm³
        - 76 cm³
        answer: 40 cm³
        why: 5 × 4 × 2 = 40. (76 cm² is its surface area.)
    - teach: 'A cube of side a has 6 equal square faces: surface area 6a², volume a³. A cylinder of radius r and height h: unroll its curved side and you get a rectangle 2πr long and h high, so curved surface area = 2πrh. Add the two circles for the total: 2πr(h + r). Volume = πr²h.'
      check:
        prompt: A cylinder has r = 7 cm and h = 5 cm. Curved surface area (π = 22/7)?
        options:
        - 220 cm²
        - 770 cm²
        - 154 cm²
        answer: 220 cm²
        why: 2 × 22/7 × 7 × 5 = 220.
    - teach: 'Units: area in cm² or m², volume in cm³ or m³. 1 litre = 1000 cm³ and 1 m³ = 1000 litres. Before calculating a real object, guess: a classroom bucket holds about 10 litres, a water tank on a roof about 1000.'
      check:
        prompt: A tank holds 2 m³. How many litres is that?
        options:
        - '2000'
        - '200'
        - '20'
        answer: '2000'
        why: 1 m³ = 1000 L.
  items:
  - prompt: Find the volume of a cuboid 8 cm long, 5 cm wide and 3 cm high, in cm³.
    answer: '120'
    check: 8*5*3
    difficulty: 1
    hints:
    - V = lwh.
    - 8 × 5 × 3.
    solution: 'Step 1: 8 × 5 = 40. Step 2: 40 × 3 = 120 cm³.'
    mistakes: {"16": "volume_lbh", "158": "volume_lbh"}
  - prompt: Find the total surface area of a cube of side 4 cm, in cm².
    answer: '96'
    check: 6*4^2
    difficulty: 1
    hints:
    - 6 faces, each 4 × 4.
    - 6 × 16.
    solution: 'Step 1: Each face is 16 cm². Step 2: 6 × 16 = 96 cm².'
    mistakes: {"16": "cube_six_faces", "64": "cube_six_faces"}
  - prompt: Find the curved surface area of a cylinder with radius 7 cm and height 10 cm (π = 22/7), in cm².
    answer: '440'
    check: 2*22/7*7*10
    difficulty: 1
    hints:
    - CSA = 2πrh.
    - 2 × 22/7 × 7 × 10.
    solution: 'Step 1: 2 × (22/7) × 7 = 44. Step 2: 44 × 10 = 440 cm².'
    mistakes: {"748": "cylinder_curved_vs_total", "1540": "csa_cylinder_2pirh"}
  - prompt: Find the volume of a cylinder with diameter 14 cm and height 20 cm (π = 22/7), in cm³.
    answer: '3080'
    check: 22/7*7^2*20
    difficulty: 2
    hints:
    - Radius = 7 cm.
    - πr²h = 22/7 × 49 × 20.
    solution: 'Step 1: r = 7. Step 2: (22/7) × 49 = 154. Step 3: 154 × 20 = 3080 cm³.'
    mistakes:
      '12320': volume_used_diameter
  - prompt: Find the total surface area of a closed cylinder with radius 7 cm and height 3 cm (π = 22/7), in cm².
    answer: '440'
    check: 2*22/7*7*(3 + 7)
    difficulty: 2
    hints:
    - TSA = 2πr(h + r).
    - 2 × 22/7 × 7 × 10.
    solution: 'Step 1: 2πr = 44. Step 2: h + r = 10. Step 3: 44 × 10 = 440 cm².'
    mistakes:
      '132': cylinder_curved_vs_total
  - prompt: A cylindrical tank has radius 1 m and height 2 m. Roughly how many litres does it hold? (π ≈ 3.14, 1 m³ = 1000 L)
    answer: '6280'
    check: 3.14*1^2*2*1000
    difficulty: 3
    hints:
    - V = πr²h = 3.14 × 1 × 2 m³.
    - Multiply by 1000 for litres.
    solution: 'Step 1: V = 3.14 × 1 × 2 = 6.28 m³. Step 2: 6.28 × 1000 = 6280 L.'
    mistakes: {"6.28": "m3_to_litres", "628": "m3_to_litres"}
  - prompt: Find the volume of a cube of side 5 cm, in cm³.
    answer: '125'
    check: 5**3
    difficulty: 1
    hints:
    - Volume = a³.
    - 5 × 5 × 5.
    solution: 5³ = 125 cm³.
    mistakes:
      '150': cube_six_faces
      '25': volume_lbh
  - prompt: Find the total surface area of a cuboid 6 cm × 4 cm × 3 cm, in cm².
    answer: '108'
    check: 2*(6*4 + 4*3 + 3*6)
    difficulty: 1
    hints:
    - 2(lw + wh + hl).
    - 24 + 12 + 18 = 54.
    solution: 2 × 54 = 108 cm².
    mistakes:
      '54': cube_six_faces
      '72': volume_lbh
  - prompt: Find the volume of a cylinder with radius 7 cm and height 10 cm (π = 22/7), in cm³.
    answer: '1540'
    check: 22/7*49*10
    difficulty: 1
    hints:
    - V = πr²h.
    - 22/7 × 49 × 10.
    solution: 154 × 10 = 1540 cm³.
    mistakes:
      '440': csa_cylinder_2pirh
      '6160': volume_used_diameter
  - prompt: A cuboid tank is 2 m × 1.5 m × 1 m. How many litres does it hold?
    answer: '3000'
    check: 2*1.5*1*1000
    difficulty: 2
    hints:
    - Volume = 3 m³.
    - 1 m³ = 1000 L.
    solution: 3 m³ × 1000 = 3000 litres.
    mistakes:
      '3': m3_to_litres
      '300': m3_to_litres
  - prompt: Find the curved surface area of a cylinder with diameter 14 cm and height 15 cm (π = 22/7), in cm².
    answer: '660'
    check: 2*22/7*7*15
    difficulty: 2
    hints:
    - Radius = 7 cm.
    - 2πrh.
    solution: 2 × 22/7 × 7 × 15 = 660 cm².
    mistakes:
      '1320': volume_used_diameter
      '968': cylinder_curved_vs_total
  - prompt: A cube has total surface area 150 cm². What is its side, in cm?
    answer: '5'
    check: sqrt(150/6)
    difficulty: 2
    hints:
    - 6a² = 150.
    - a² = 25.
    solution: a² = 25, so a = 5 cm.
    mistakes:
      '25': cube_six_faces
  - prompt: A closed cylinder has radius 14 cm and height 6 cm. Find its total surface area (π = 22/7), in cm².
    answer: '1760'
    check: 2*22/7*14*(6 + 14)
    difficulty: 2
    hints:
    - 2πr(h + r).
    - 2 × 22/7 × 14 × 20.
    solution: 88 × 20 = 1760 cm².
    mistakes:
      '528': cylinder_curved_vs_total
  - prompt: A cylindrical glass has radius 3.5 cm and height 10 cm. How many millilitres does it hold (π = 22/7)? (1 cm³ = 1 mL)
    answer: '385'
    check: 22/7*3.5**2*10
    difficulty: 3
    hints:
    - πr²h.
    - 22/7 × 12.25 × 10.
    solution: 38.5 × 10 = 385 cm³ = 385 mL.
    mistakes:
      '220': csa_cylinder_2pirh
      '1540': volume_used_diameter
  - prompt: A road roller is a cylinder of diameter 1.4 m and length 2 m. What area does it press in 5 full turns, in m² (π = 22/7)?
    answer: '44'
    check: 5*2*22/7*0.7*2
    difficulty: 3
    hints:
    - 'One turn presses its curved surface: 2πrh.'
    - r = 0.7 m.
    solution: 'One turn: 2 × 22/7 × 0.7 × 2 = 8.8 m². Five turns: 44 m².'
    mistakes:
      '8.8': csa_cylinder_2pirh
      '88': volume_used_diameter
- code: cbse9gm.solid.cone
  title: Right circular cone
  notes: |
    Slant height l = √(r² + h²). Curved surface area = πrl. Total surface area = πr(l + r). Volume =
    ⅓πr²h. Use π = 22/7 unless told otherwise.
  explanations:
    text: 'A cone has a round base and a point on top. Its slant height l is the distance along the side from the tip to the edge of the base: l² = r² + h². The curved surface area is πrl, add πr² for the base. Its volume is one third of a cylinder with the same base and height: ⅓πr²h.'
    visual: 'Cut a cone open along a slant line and flatten it: you get a sector of a circle whose radius is l and whose curved edge is the base''s circumference 2πr. Its area works out to πrl. Fill a cone with water and pour it into a matching cylinder: it takes three cones to fill it.'
    step_by_step: 'Step 1: Write down r and h (or l). Step 2: If you need l, use l = √(r² + h²). Step 3: Curved area = πrl. Step 4: Total area = πr(l + r). Step 5: Volume = ⅓ × π × r² × h. Step 6: Use π = 22/7 and give units: cm² for area, cm³ for volume.'
    real_world: 'A birthday cap is a cone with no base: the paper needed is its curved surface area πrl. An ice-cream cone''s volume tells you how much ice cream fits inside.'
  picture:
    kind: geometry
    points:
      A:
      - 5
      - 9
      B:
      - 2
      - 2
      C:
      - 8
      - 2
      O:
      - 5
      - 2
    segments:
    - - A
      - B
      - l
    - - A
      - C
    - - B
      - O
    - - O
      - C
      - r
    - - A
      - O
      - h
    angles:
    - at: O
      from: C
      to: A
      label: 90°
    caption: l² = h² + r². Curved surface = πrl. Volume = (1/3)πr²h.
    alt: A cone seen from the side with height h, base radius r and slant height l, which form a right triangle, so l² = h² + r².
  activity:
    type: formula
    prompt: A cone has radius r and height h. Its slant height l is the slanted side of a right triangle.
    inputs:
    - name: r
      label: Radius r
      min: 1
      max: 12
      step: 1
      start: 1
      unit: cm
    - name: h
      label: Height h
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: l
      label: Slant height l = √(r² + h²)
      expr: sqrt(r^2+h^2)
      unit: cm
      places: 2
    - name: csa
      label: Curved surface πrl
      expr: pi*r*sqrt(r^2+h^2)
      unit: cm²
      places: 1
    - name: vol
      label: Volume ⅓πr²h
      expr: pi*r^2*h/3
      unit: cm³
      places: 1
    goals:
    - prompt: Make a cone 8 cm tall with a slant height of exactly 10 cm.
      want:
        h: 8
        l: 10
      hint: r, h and l form a right triangle with l the longest side. r² + 8² = 10².
      mistakes:
      - when:
          r: 2
        say: 'You took 10 − 8 = 2, but the slant height is the slanted side of a right triangle: r² + h² = l², not r + h = l.'
      - when:
          r: 10
        say: 'That makes the radius 10 too, but the slant is the longest side: r must be shorter than l.'
    - prompt: Make a cone of radius 4 cm that holds as much as a cylinder of radius 4 cm and height 3 cm (about 150.8 cm³).
      want:
        r: 4
        vol:
        - 150
        - 151.6
      mistakes:
      - when:
          r: 4
          h: 3
        say: Same base and height holds only a third of the cylinder. A cone needs 3 times the height to hold the same.
      - when:
          r: 4
          h: 1
        say: That's a third of the height, a third of the volume again. The ⅓ in the formula needs the height to grow, not shrink.
  lesson:
    - teach: A right circular cone has a circular base of radius r, a height h straight up from the centre to the tip, and a slant height l along the side. h, r and l make a right triangle, so l = √(r² + h²).
      picture:
        kind: geometry
        points:
          V:
          - 5
          - 9
          O:
          - 5
          - 2
          A:
          - 9
          - 2
        segments:
        - - V
          - O
          - h
        - - O
          - A
          - r
        - - V
          - A
          - l
        caption: l² = r² + h².
        alt: 'Half of a cone seen from the side: height h from tip V to centre O, radius r from O to A, slant height l from V to A.'
      check:
        prompt: r = 5 cm, h = 12 cm. What is l?
        options:
        - 13 cm
        - 17 cm
        - 7 cm
        answer: 13 cm
        why: √(25 + 144) = √169 = 13.
    - teach: The curved surface of a cone unrolls into a sector, with area πrl. Add the base circle πr² for the total surface area πr(l + r). Note it uses l, not h.
      check:
        prompt: r = 7, l = 10. Curved surface area (π = 22/7)?
        options:
        - '220'
        - '154'
        - '374'
        answer: '220'
        why: 22/7 × 7 × 10 = 220.
    - teach: 'A cone holds exactly one third of a cylinder with the same base and height: V = ⅓πr²h. Three full cones of water fill the matching cylinder. The volume uses the height h, not the slant height.'
      check:
        prompt: A cylinder of the same base and height holds 600 cm³. How much does the cone hold?
        options:
        - 200 cm³
        - 300 cm³
        - 1800 cm³
        answer: 200 cm³
        why: One third of 600.
  items:
  - prompt: A cone has radius 6 cm and height 8 cm. Find its slant height in cm.
    answer: '10'
    check: sqrt(6^2 + 8^2)
    difficulty: 1
    hints:
    - l² = r² + h².
    - 36 + 64.
    solution: 'Step 1: l² = 36 + 64 = 100. Step 2: l = 10 cm.'
    mistakes:
      '14': added_sides
  - prompt: Find the curved surface area of a cone with radius 7 cm and slant height 10 cm (π = 22/7), in cm².
    answer: '220'
    check: 22/7*7*10
    difficulty: 1
    hints:
    - CSA = πrl.
    - 22/7 × 7 × 10.
    solution: CSA = 22/7 × 7 × 10 = 220 cm².
    mistakes: {"440": "cone_csa_pirl", "374": "cone_base"}
  - prompt: Find the volume of a cone with radius 7 cm and height 12 cm (π = 22/7), in cm³.
    answer: '616'
    check: 1/3*22/7*7^2*12
    difficulty: 2
    hints:
    - V = ⅓πr²h.
    - ⅓ × 22/7 × 49 × 12.
    solution: 'Step 1: πr²h = 22/7 × 49 × 12 = 1848. Step 2: ⅓ of 1848 = 616 cm³.'
    mistakes:
      '1848': cone_third
  - prompt: A cone has radius 3 cm and height 4 cm. Find its curved surface area in cm², taking π = 3.14.
    answer: '47.1'
    check: 3.14*3*5
    difficulty: 2
    hints:
    - 'First find l: √(9 + 16) = 5.'
    - πrl = 3.14 × 3 × 5.
    solution: 'Step 1: l = 5 cm. Step 2: CSA = 3.14 × 3 × 5 = 47.1 cm².'
    mistakes:
      '37.68': slant_not_height
  - prompt: Find the total surface area of a cone with radius 7 cm and slant height 18 cm (π = 22/7), in cm².
    answer: '550'
    check: 22/7*7*(18 + 7)
    difficulty: 2
    hints:
    - TSA = πr(l + r).
    - 22/7 × 7 × 25.
    solution: TSA = 22/7 × 7 × (18 + 7) = 22 × 25 = 550 cm².
    mistakes:
      '396': cone_base
  - prompt: A conical tent is 10 m high with base radius 24 m. Find the canvas needed for its curved surface, in m² (π = 22/7). Round to the nearest whole number.
    answer: '1961'
    check: round(22/7*24*26)
    difficulty: 3
    hints:
    - l = √(24² + 10²) = 26.
    - πrl = 22/7 × 24 × 26.
    solution: 'Step 1: l = √(576 + 100) = 26 m. Step 2: CSA = 22/7 × 24 × 26 = 13728/7 ≈ 1961 m².'
    mistakes:
      '754': slant_not_height
  - prompt: A cone has radius 9 cm and height 12 cm. Find its slant height in cm.
    answer: '15'
    check: sqrt(81 + 144)
    difficulty: 1
    hints:
    - l = √(r² + h²).
    - 81 + 144 = 225.
    solution: √225 = 15 cm.
    mistakes:
      '21': slant_not_height
      '225': slant_not_height
  - prompt: Find the curved surface area of a cone with radius 14 cm and slant height 5 cm (π = 22/7), in cm².
    answer: '220'
    check: 22/7*14*5
    difficulty: 1
    hints:
    - πrl.
    - 22/7 × 14 × 5.
    solution: 44 × 5 = 220 cm².
    mistakes:
      '836': cone_base
  - prompt: Find the volume of a cone with radius 3 cm and height 7 cm (π = 22/7), in cm³.
    answer: '66'
    check: 22/7*9*7/3
    difficulty: 1
    hints:
    - ⅓πr²h.
    - ⅓ × 22/7 × 9 × 7.
    solution: ⅓ × 198 = 66 cm³.
    mistakes:
      '198': cone_third
  - prompt: A cone has radius 7 cm and slant height 25 cm. Find its height in cm.
    answer: '24'
    check: sqrt(625 - 49)
    difficulty: 2
    hints:
    - h² = l² − r².
    - 625 − 49 = 576.
    solution: √576 = 24 cm.
    mistakes:
      '18': slant_not_height
      '576': slant_not_height
  - prompt: Find the total surface area of a cone with radius 14 cm and slant height 16 cm (π = 22/7), in cm².
    answer: '1320'
    check: 22/7*14*(16 + 14)
    difficulty: 2
    hints:
    - πr(l + r).
    - 44 × 30.
    solution: 22/7 × 14 × 30 = 1320 cm².
    mistakes:
      '704': cone_base
  - prompt: A cone and a cylinder have the same base and height. The cylinder holds 4.5 L. How much does the cone hold, in L?
    answer: '1.5'
    check: 4.5/3
    difficulty: 2
    hints:
    - The cone holds a third.
    - 4.5 ÷ 3.
    solution: The cone holds a third of the cylinder, so 4.5 ÷ 3 = 1.5 L.
    mistakes:
      '13.5': cone_third
      '2.25': cone_third
  - prompt: A cone has radius 6 cm and height 8 cm. Find its curved surface area, taking π = 3.14, in cm².
    answer: '188.4'
    check: 3.14*6*10
    difficulty: 2
    hints:
    - First find l = 10.
    - πrl = 3.14 × 6 × 10.
    solution: l = √(36 + 64) = 10. CSA = 3.14 × 60 = 188.4 cm².
    mistakes:
      '150.72': slant_not_height
  - prompt: A conical heap of grain has diameter 21 m and height 6 m. Find its volume in m³ (π = 22/7).
    answer: '693'
    check: 22/7*10.5**2*6/3
    difficulty: 3
    hints:
    - Radius = 10.5 m.
    - ⅓ × 22/7 × 110.25 × 6.
    solution: ⅓ × 22/7 × 10.5 × 10.5 × 6 = 693 m³.
    mistakes:
      '2079': cone_third
      '2772': volume_used_diameter
  - prompt: How many metres of cloth 5 m wide are needed for a conical tent of radius 7 m and slant height 25 m (π = 22/7)?
    answer: '110'
    check: 22/7*7*25/5
    difficulty: 3
    hints:
    - Cloth area = curved surface = πrl = 550 m².
    - Length = area ÷ width.
    solution: 550 ÷ 5 = 110 m of cloth.
    mistakes:
      '550': cone_csa_pirl
      '2750': cone_csa_pirl
- code: cbse9gm.solid.sphere
  title: Sphere and hemisphere
  after:
  - cbse9gm.solid.cone
  notes: |
    Sphere: surface area 4πr², volume (4/3)πr³. Hemisphere: curved surface 2πr², total surface 3πr²
    (solid), volume (2/3)πr³. A hemispherical bowl has only the curved surface (inner or outer).
  explanations:
    text: 'A sphere is a perfectly round ball. Its surface area is 4πr²: exactly four times the area of a circle with the same radius. Its volume is (4/3)πr³. A hemisphere is half a sphere: half the volume, (2/3)πr³, and a curved surface of 2πr², plus πr² for the flat top if it''s solid.'
    visual: 'Wind string around a ball''s outside, then wind the same string into flat circles of the same radius: it covers four of them. Slice the ball in half and you have two hemispheres, each with a dome and a flat circle.'
    step_by_step: 'Step 1: Find r (halve the diameter if needed). Step 2: Sphere area = 4πr², volume = (4/3)πr³. Step 3: Hemisphere curved area = 2πr², total = 3πr², volume = (2/3)πr³. Step 4: Use π = 22/7 and units.'
    real_world: 'The leather needed to cover a football is its surface area 4πr². A coconut shell bowl is a hemisphere: the curd it holds is its volume (2/3)πr³.'
  picture:
    kind: compare
    columns:
    - title: Sphere
      points:
      - Surface area 4πr², like four flat circles
      - Volume (4/3)πr³
    - title: Hemisphere
      points:
      - Curved surface 2πr²
      - Total surface 3πr² (dome + flat circle)
      - Volume (2/3)πr³
    alt: A sphere has surface area 4πr² and volume four thirds πr³. A hemisphere has curved surface 2πr², total surface 3πr² and volume two thirds πr³.
  activity:
    type: formula
    prompt: A hemisphere is half a sphere. Change the radius r and compare.
    inputs:
    - name: r
      label: Radius r
      min: 0.5
      max: 14
      step: 0.5
      start: 1
      unit: cm
    outputs:
    - name: curved
      label: Hemisphere curved 2πr²
      expr: 2*pi*r^2
      unit: cm²
      places: 1
    - name: total
      label: Solid hemisphere total 3πr²
      expr: 3*pi*r^2
      unit: cm²
      places: 1
    - name: hv
      label: Hemisphere volume ⅔πr³
      expr: 2*pi*r^3/3
      unit: cm³
      places: 1
    - name: sv
      label: Whole sphere volume ⁴⁄₃πr³
      expr: 4*pi*r^3/3
      unit: cm³
      places: 1
    goals:
    - prompt: A hemispherical bowl must hold about 2425 cm³ of soup. Choose r.
      want:
        hv:
        - 2420
        - 2430
      mistakes:
      - when:
          r: 8.5
        say: 'At r = 8.5 a whole sphere holds about 2572 cm³, but a bowl is half a sphere: it holds only about 1286 cm³.'
      - when:
          r:
          - 13
          - 14
        say: 'Much too big: volume grows with r³, so a little more radius adds a lot of soup.'
    - prompt: 'Paint all of a solid hemisphere, curved top and flat base: about 942 cm². Choose r.'
      want:
        total:
        - 940
        - 944
      mistakes:
      - when:
          r: 12
        say: 'At r = 12 the curved part alone is about 905 cm², close to 942 on its own. A solid hemisphere also has a flat circle at the base: 2πr² + πr².'
      - when:
          r: 8.5
        say: 'That paints about 908 cm² of a whole sphere''s 4πr². A hemisphere is half the curve plus a flat circle: 3πr².'
  lesson:
    - teach: 'A sphere is a perfectly round ball. All points on it are r from the centre. Its surface area is 4πr²: exactly four times the area of a circle with the same radius. Its volume is (4/3)πr³.'
      check:
        prompt: A sphere has r = 7 cm. Surface area (π = 22/7)?
        options:
        - 616 cm²
        - 154 cm²
        - 1437 cm²
        answer: 616 cm²
        why: 4 × 22/7 × 49 = 616.
    - teach: 'A hemisphere is half a sphere. Its curved surface is half of 4πr², so 2πr². A solid hemisphere also has a flat circle πr² on top: total 3πr². A bowl is open, so only the curved part counts. Volume of a hemisphere = (2/3)πr³.'
      picture:
        kind: compare
        columns:
        - title: Sphere
          points:
          - Surface 4πr²
          - Volume (4/3)πr³
        - title: Hemisphere
          points:
          - Curved 2πr²
          - Solid total 3πr²
          - Volume (2/3)πr³
        alt: 'Sphere formulas beside hemisphere formulas: half the sphere''s curved surface, plus the flat circle for a solid hemisphere.'
      check:
        prompt: A solid hemisphere has r = 7 cm. Total surface area (π = 22/7)?
        options:
        - 462 cm²
        - 308 cm²
        - 616 cm²
        answer: 462 cm²
        why: 3 × 22/7 × 49 = 462.
    - teach: 'Watch for diameter: a ball of diameter 14 cm has r = 7. Using 14 as r makes the surface area 4 times too big and the volume 8 times too big.'
      check:
        prompt: A ball has diameter 6 cm. Which radius do you use?
        options:
        - 3 cm
        - 6 cm
        - 12 cm
        answer: 3 cm
        why: Radius is half the diameter.
  items:
  - prompt: Find the surface area of a sphere of radius 7 cm (π = 22/7), in cm².
    answer: '616'
    check: 4*22/7*7^2
    difficulty: 1
    hints:
    - 4πr².
    - 4 × 22/7 × 49.
    solution: Surface area = 4 × 22/7 × 49 = 616 cm².
    mistakes:
      '154': sphere_four
  - prompt: Find the volume of a sphere of radius 21 cm (π = 22/7), in cm³.
    answer: '38808'
    check: 4/3*22/7*21^3
    difficulty: 2
    hints:
    - (4/3)πr³.
    - 21³ = 9261.
    solution: Volume = 4/3 × 22/7 × 9261 = 38808 cm³.
    mistakes: {"5544": "sphere_volume", "1848": "sphere_volume"}
  - prompt: Find the curved surface area of a hemisphere of radius 7 cm (π = 22/7), in cm².
    answer: '308'
    check: 2*22/7*7^2
    difficulty: 1
    hints:
    - 2πr².
    - 2 × 22/7 × 49.
    solution: CSA = 2 × 22/7 × 49 = 308 cm².
    mistakes: {"616": "hemisphere_csa", "462": "hemisphere_total"}
  - prompt: Find the total surface area of a solid hemisphere of radius 7 cm (π = 22/7), in cm².
    answer: '462'
    check: 3*22/7*7^2
    difficulty: 2
    hints:
    - Curved 2πr² plus flat πr².
    - 3πr².
    solution: TSA = 3 × 22/7 × 49 = 462 cm².
    mistakes:
      '308': hemisphere_total
  - prompt: A hemispherical bowl has radius 3.5 cm. How much can it hold, in cm³ (π = 22/7)? Give your answer as a decimal to 2 places.
    answer: '89.83'
    check: round(2/3*22/7*3.5^3, 2)
    difficulty: 3
    hints:
    - (2/3)πr³.
    - 3.5³ = 42.875.
    solution: 'Step 1: (2/3) × 22/7 × 42.875 = 539/6. Step 2: ≈ 89.83 cm³.'
    mistakes: {"179.67": "hemisphere_volume", "25.67": "hemisphere_volume"}
  - prompt: A ball has diameter 14 cm. Find its surface area in cm² (π = 22/7).
    answer: '616'
    check: 4*22/7*(14/2)^2
    difficulty: 2
    hints:
    - r = 7 cm.
    - 4πr².
    solution: 'Step 1: r = 14 ÷ 2 = 7 cm. Step 2: 4 × 22/7 × 49 = 616 cm².'
    mistakes:
      '2464': radius_diameter
  - prompt: Find the surface area of a sphere of radius 14 cm (π = 22/7), in cm².
    answer: '2464'
    check: 4*22/7*14**2
    difficulty: 1
    hints:
    - 4πr².
    - 4 × 22/7 × 196.
    solution: 4 × 616 = 2464 cm².
    mistakes:
      '616': sphere_four
      '11498.67': sphere_volume
  - prompt: Find the curved surface area of a hemisphere of radius 14 cm (π = 22/7), in cm².
    answer: '1232'
    check: 2*22/7*196
    difficulty: 1
    hints:
    - 2πr².
    - 2 × 22/7 × 196.
    solution: 2 × 616 = 1232 cm².
    mistakes:
      '1848': hemisphere_csa
      '2464': hemisphere_csa
  - prompt: Find the volume of a sphere of radius 3 cm, taking π = 3.14, in cm³.
    answer: '113.04'
    check: 4/3*3.14*27
    difficulty: 1
    hints:
    - (4/3)πr³.
    - (4/3) × 3.14 × 27.
    solution: 36 × 3.14 = 113.04 cm³.
    mistakes:
      '28.26': sphere_volume
      '339.12': sphere_volume
  - prompt: Find the total surface area of a solid hemisphere of radius 14 cm (π = 22/7), in cm².
    answer: '1848'
    check: 3*22/7*196
    difficulty: 2
    hints:
    - 3πr².
    - 3 × 616.
    solution: 3 × 22/7 × 196 = 3 × 616 = 1848 cm².
    mistakes:
      '1232': hemisphere_total
  - prompt: Find the volume of a hemisphere of radius 21 cm (π = 22/7), in cm³.
    answer: '19404'
    check: 2/3*22/7*21**3
    difficulty: 2
    hints:
    - (2/3)πr³.
    - Half of the sphere's 38808.
    solution: 38808 ÷ 2 = 19404 cm³.
    mistakes:
      '38808': hemisphere_volume
  - prompt: A sphere has surface area 154 cm². Find its radius in cm (π = 22/7).
    answer: '3.5'
    check: sqrt(154/(4*22/7))
    difficulty: 2
    hints:
    - 4πr² = 154.
    - r² = 154 ÷ (88/7) = 12.25.
    solution: r² = 12.25, so r = 3.5 cm.
    mistakes:
      '7': sphere_four
      '12.25': sphere_four
  - prompt: A football has diameter 28 cm. How much leather covers it, in cm² (π = 22/7)?
    answer: '2464'
    check: 4*22/7*14**2
    difficulty: 2
    hints:
    - r = 14 cm.
    - 4πr².
    solution: 4 × 22/7 × 196 = 2464 cm².
    mistakes:
      '9856': volume_used_diameter
      '616': sphere_four
  - prompt: The radius of a ball is doubled. How many times bigger does its volume become?
    answer: '8'
    check: 2**3
    difficulty: 3
    hints:
    - Volume depends on r³.
    - 2³.
    solution: (2r)³ = 8r³, so 8 times.
    mistakes:
      '2': sphere_volume
      '4': sphere_four
  - prompt: A hemispherical tank of radius 1.4 m is full of water. How many litres does it hold (π = 22/7)? Round to the nearest litre.
    answer: '5749'
    check: round(2/3*22/7*1.4**3*1000)
    difficulty: 3
    hints:
    - (2/3)πr³ in m³.
    - Then × 1000 for litres.
    solution: (2/3) × 22/7 × 2.744 = 5.749 m³ ≈ 5749 litres.
    mistakes:
      '5.749': m3_to_litres
      '11499': hemisphere_volume
