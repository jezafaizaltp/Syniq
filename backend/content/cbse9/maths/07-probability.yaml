# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 7. Format: content/README.md.
subject: cbse9-math
chapter: 7
title: 'The Mathematics of Maybe: Introduction to Probability'
tips:
  probability_over_one: "A probability is favourable outcomes ÷ all outcomes, so it can never go below the value for 'impossible' or above the value for 'certain'. For 'did not happen', subtract the 'did happen' count first."
  probability_wrong_total: Count every possible outcome for the bottom of the fraction, not just the unfavourable ones.
  tree_add_instead_multiply: 'Along the branches of a tree, multiply: the chance of this AND then that is the product.'
  certain_is_one: "Probability runs from impossible to certain. Impossible is at 0; where on the scale is certain?"
  complement_one_minus: "Rain and no rain together cover every case, so their probabilities add to 1."
  expected_count: "Expected count = probability × number of trials. What fraction of rolls should show a 6?"
  not_event_complement: "The question asks about days WITHOUT rain. Count those days first, then divide by the total."
  small_sample: "10 tosses is a very small sample, and a coin has no memory. What happens to the fraction of heads over thousands of tosses?"
concepts:
- code: cbse9gm.prob.scale
  title: Chance, the probability scale and experiments
  notes: |
    Probability measures how likely an event is on a scale from 0 (impossible) to 1 (certain), with 1/2 an
    even chance. Some outcomes are random: we can't say what happens in one trial, but patterns appear over
    many trials. Empirical (experimental) probability = number of times the event happened ÷ number of
    trials. As the number of trials grows, the empirical probability tends to settle near the theoretical one.
  explanations:
    text: Probability says how likely something is, from 0 (it can never happen) to 1 (it always happens). If you toss a coin 100 times and get 47 heads, the experimental probability of heads is 47/100 = 0.47. Toss it many more times and it settles close to 1/2.
    visual: 'Draw a line from 0 to 1. Mark ''impossible'' at 0, ''even chance'' at 1/2 and ''certain'' at 1. Place events on it: ''the sun rises tomorrow'' near 1, ''a coin shows heads'' at 1/2, ''rolling a 7 on a dice'' at 0.'
    step_by_step: 'Step 1: Do the experiment many times (the trials). Step 2: Count how often the event happened. Step 3: Divide by the number of trials. Step 4: Check the answer is between 0 and 1.'
    real_world: A cricketer who scored a fifty in 12 of 40 innings has an experimental probability of 12/40 = 0.3 of scoring a fifty in the next one.
  picture:
    kind: number_line
    from: 0
    to: 1
    step: 0.25
    points:
    - at: 0
      label: impossible
    - at: 0.5
      label: even chance
    - at: 1
      label: certain
    alt: A probability scale from 0, impossible, through one half, even chance, to 1, certain.
  activity:
    type: scale
    min: 0
    max: 1
    step: 0.05
    start: 0.5
    orientation: horizontal
    unit: chance
    prompt: The probability scale runs from 0 (impossible) to 1 (certain). Move the marker.
    zones:
    - from: 0.05
      to: 0.3
      label: Unlikely
      says: 'Below about 0.3: it can happen, but less often than not.'
    - from: 0.3
      to: 0.7
      label: About even
      says: 'Around 0.5: about as likely to happen as not.'
    - from: 0.7
      to: 0.95
      label: Likely
      says: 'Above about 0.7: it happens more often than not, but not every time.'
    goals:
    - prompt: A normal dice shows 7.
      value: 0
      mistakes:
      - when:
          v:
          - 0.05
          - 1
        say: 'That says 7 could come up. A dice has only 1 to 6, so 7 never can. Something impossible isn''t just unlikely: its probability is exactly 0.'
    - prompt: You pick a marble from a bag of 3 red and 17 blue. It is red.
      value: 0.15
      mistakes:
      - when:
          v: 0.85
        say: '0.85 is 17 out of 20: that''s blue. Red is the 3.'
      - when:
          v: 0.3
        say: 0.3 is 3 out of 10, but the bag holds 20 marbles. Divide by all of them.
    - prompt: A coin was tossed 40 times and landed heads 26 times. Mark the experimental probability of heads.
      value: 0.65
      hint: Experimental probability = times it happened ÷ number of tries.
      mistakes:
      - when:
          v: 0.5
        say: 0.5 is what we'd expect in theory. The experiment gave 26 heads out of 40 tries.
      - when:
          v: 0.35
        say: '0.35 is 14 out of 40: the tails.'
    - prompt: 'A spinner has 4 equal parts: 3 green and 1 yellow. It lands on green.'
      value: 0.75
      mistakes:
      - when:
          v: 0.25
        say: 0.25 is the one yellow part. Green has 3 of the 4.
      - when:
          v: 1
        say: 1 means certain, but it could land on yellow.
  lesson:
    - teach: Probability measures how likely something is, on a scale from 0 to 1. 0 means impossible (rolling a 7 on a normal dice). 1 means certain (the sun rising tomorrow). 1/2 is an even chance, like heads on a fair coin. No probability is below 0 or above 1.
      picture:
        kind: number_line
        from: 0
        to: 1
        step: 0.25
        points:
        - at: 0
          label: impossible
        - at: 0.5
          label: even chance
        - at: 1
          label: certain
        alt: Probability scale from 0 (impossible) through 0.5 (even chance) to 1 (certain).
      check:
        prompt: Which number could be a probability?
        options:
        - '0.85'
        - '1.5'
        - −0.2
        answer: '0.85'
        why: A probability must lie between 0 and 1.
    - teach: We can't say what one coin toss will give, but over many tosses a pattern appears. Experimental (empirical) probability = number of times the event happened ÷ number of trials. If 100 tosses give 53 heads, the experimental probability of heads is 53/100 = 0.53.
      check:
        prompt: A spinner lands on red 30 times in 120 spins. What is the experimental probability of red?
        options:
        - '0.25'
        - '0.3'
        - '4'
        answer: '0.25'
        why: 30 ÷ 120 = 0.25.
    - teach: 'With only a few trials, results jump around: 10 tosses could easily give 7 heads. With many trials, the experimental probability settles close to the theoretical one. To predict, multiply: in 300 rolls of a dice, expect about 300 × 1/6 = 50 sixes.'
      check:
        prompt: A coin is tossed 400 times. About how many heads do you expect?
        options:
        - '200'
        - '400'
        - '100'
        answer: '200'
        why: 400 × 1/2 = 200, roughly.
  items:
  - prompt: What is the probability of an event that is certain to happen?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - The top of the scale.
    - Impossible is 0.
    solution: 'Step 1: Probabilities go from 0 to 1. Step 2: Certain is 1.'
    mistakes: {"100": "probability_over_one", "0": "certain_is_one"}
  - prompt: A coin is tossed 200 times and shows heads 96 times. What is the experimental probability of heads? Type a decimal.
    answer: '0.48'
    check: 96/200
    difficulty: 1
    hints:
    - Times it happened ÷ number of trials.
    - 96 ÷ 200.
    solution: 'Step 1: 96 ÷ 200 = 0.48.'
    mistakes:
      '96': probability_over_one
  - prompt: Which of these could NOT be a probability?
    options:
    - '1.2'
    - '0'
    - '0.75'
    - 3/8
    answer: '1.2'
    difficulty: 1
    hints:
    - Probabilities are between 0 and 1.
    - Which is bigger than 1?
    solution: 'Step 1: Every probability is from 0 to 1. Step 2: 1.2 is more than 1, so it is impossible as a probability.'
    mistakes:
      '0': probability_over_one
  - prompt: In 50 days, it rained on 15. What is the experimental probability that it did NOT rain on a day? Type a decimal.
    answer: '0.7'
    check: (50 - 15)/50
    difficulty: 2
    hints:
    - 'Days without rain: 50 − 15.'
    - 35 ÷ 50.
    solution: 'Step 1: 35 days had no rain. Step 2: 35 ÷ 50 = 0.7.'
    mistakes: {"0.3": "not_event_complement", "35": "probability_over_one"}
  - prompt: A dice is rolled 600 times. About how many times would you expect a 6?
    answer: '100'
    check: 600/6
    difficulty: 2
    hints:
    - Each face has probability 1/6.
    - 1/6 of 600.
    solution: 'Step 1: P(6) = 1/6. Step 2: 600 × 1/6 = 100. The real count will be close to 100, not always exactly 100.'
    mistakes: {"6": "expected_count", "60": "expected_count"}
  - prompt: Riya tosses a coin 10 times and gets 7 heads. What is the best conclusion?
    options:
    - 10 tosses is too few; with many more tosses the fraction of heads should get close to 1/2
    - The coin must be unfair
    - Heads has probability 0.7 for every coin
    - Tails is now more likely next time
    answer: 10 tosses is too few; with many more tosses the fraction of heads should get close to 1/2
    difficulty: 3
    hints:
    - Random results vary a lot in small experiments.
    - A coin has no memory.
    solution: 'Step 1: In 10 tosses, 7 heads happens quite often with a fair coin. Step 2: Over many tosses the experimental probability settles near 1/2. Step 3: The coin has no memory, so tails is not ''due''.'
    mistakes: {"The coin must be unfair": "small_sample", "Tails is now more likely next time": "small_sample"}
  - prompt: What is the probability of an impossible event?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - The scale runs from impossible to certain.
    - Certain is 1.
    solution: An impossible event has probability 0.
    mistakes:
      '1': certain_is_one
  - prompt: A dice is rolled 60 times and shows 4 eleven times. What is the experimental probability of a 4? Type a fraction.
    answer: 11/60
    check: 11/60
    difficulty: 1
    hints:
    - Times it happened ÷ number of trials.
    - 11 ÷ 60.
    solution: "It happened 11 times in 60 rolls, so 11 ÷ 60 = 11/60."
    mistakes:
      1/6: small_sample
      11/49: probability_wrong_total
  - prompt: Which event has probability closest to 1?
    options:
    - A ball dropped will fall down
    - A coin shows heads
    - A dice shows 6
    - It snows in Chennai in May
    answer: A ball dropped will fall down
    difficulty: 1
    hints:
    - Probability 1 means certain.
    - Which one always happens?
    solution: A dropped ball always falls, so its probability is 1.
    mistakes:
      A coin shows heads: certain_is_one
  - prompt: In 80 matches, a team won 20. What is the experimental probability that it did NOT win a match? Type a decimal.
    answer: '0.75'
    check: 60/80
    difficulty: 2
    hints:
    - It did not win 80 − 20 = 60 matches.
    - 60 ÷ 80.
    solution: P(not win) = 60/80 = 0.75, or 1 − 0.25.
    mistakes:
      '0.25': not_event_complement
  - prompt: A dice is rolled 900 times. About how many times would you expect an even number?
    answer: '450'
    check: 900/2
    difficulty: 2
    hints:
    - 3 of the 6 faces are even.
    - 900 × 1/2.
    solution: P(even) = 1/2, so about 450 times.
    mistakes:
      '150': expected_count
      '300': expected_count
  - prompt: A coin is tossed 1000 times and shows tails 512 times. What is the experimental probability of heads? Type a decimal.
    answer: '0.488'
    check: 488/1000
    difficulty: 2
    hints:
    - Heads came 1000 − 512 times.
    - 488 ÷ 1000.
    solution: Heads = 488, so 488/1000 = 0.488.
    mistakes:
      '0.512': not_event_complement
      '0.5': small_sample
  - prompt: Which of these fractions could NOT be a probability?
    options:
    - 5/4
    - 3/4
    - '0'
    - '0.99'
    answer: 5/4
    difficulty: 2
    hints:
    - A probability can't be more than 1.
    - Is 5/4 bigger than 1?
    solution: 5/4 = 1.25, which is more than 1, so it can't be a probability.
    mistakes:
      '0': probability_over_one
  - prompt: Out of 250 bulbs tested, 10 were faulty. A shop gets 1000 such bulbs. About how many are faulty?
    answer: '40'
    check: 1000*10/250
    difficulty: 3
    hints:
    - Experimental P(faulty) = 10/250 = 0.04.
    - 0.04 × 1000.
    solution: P(faulty) = 0.04, so about 0.04 × 1000 = 40 bulbs.
    mistakes:
      '10': expected_count
      '960': not_event_complement
  - prompt: Two students each toss a coin. Anu tosses 20 times (12 heads), Ben tosses 2000 times (1012 heads). Whose experimental probability is likely closer to 1/2?
    options:
    - Ben's, because he made many more tosses
    - Anu's, because 12 is closer to 10
    - They are equally good
    - Neither can be trusted
    answer: Ben's, because he made many more tosses
    difficulty: 3
    hints:
    - What happens as the number of trials grows?
    - Compare 12/20 and 1012/2000.
    solution: 'Anu: 0.6. Ben: 0.506. More trials settle closer to the true value, so Ben''s is closer.'
    mistakes:
      They are equally good: small_sample
      Anu's, because 12 is closer to 10: small_sample
- code: cbse9gm.prob.theoretical
  title: Theoretical probability, outcomes and tree diagrams
  after:
  - cbse9gm.prob.scale
  notes: |
    When all outcomes are equally likely, P(event) = number of favourable outcomes ÷ total number of
    outcomes. The sample space is the list of all outcomes. For two steps (two coins, a coin and a dice) a
    table or tree diagram lists every combination: two coins give HH, HT, TH, TT. Along a branch, probabilities
    multiply. P(not A) = 1 − P(A).
  explanations:
    text: 'If every outcome is equally likely, count: probability = favourable outcomes ÷ all outcomes. A dice has 6 faces, and 3 are even, so P(even) = 3/6 = 1/2. For two coins, list all four results, HH, HT, TH and TT: getting one head and one tail happens 2 ways in 4, so it is 1/2.'
    visual: 'Draw a tree: from a start dot, two branches H and T for the first coin. From each, two more branches H and T for the second coin. The four ends are HH, HT, TH, TT. Circle the ends that match the event and count them.'
    step_by_step: 'Step 1: List all equally likely outcomes (use a table or tree for two steps). Step 2: Count those that match the event. Step 3: Divide by the total. Step 4: For ''not A'', use 1 − P(A).'
    real_world: In a lucky draw with 500 tickets, if you hold 5 your chance of winning is 5/500 = 1/100.
  picture:
    kind: flow
    steps:
    - 'Toss coin 1: H or T'
    - 'Toss coin 2: H or T'
    - 'Outcomes: HH, HT, TH, TT'
    - 'One head and one tail: HT, TH'
    - P = 2/4 = 1/2
    alt: Two coin tosses give four outcomes; two of them have one head and one tail, so the probability is one half.
  activity:
    type: number_line
    min: 0
    max: 36
    step: 1
    start: 0
    prompt: 'Two dice are rolled: 6 × 6 = 36 equally likely pairs. Mark how many pairs fit: the probability is that many out of 36.'
    goals:
    - prompt: The two numbers add up to 7.
      target: 6
      hint: 'List pairs: (1, 6), (2, 5), … and remember (6, 1) is a different pair.'
      mistakes:
      - when:
          v: 1
        say: '1/36 is just one pair. A total of 7 can be made in more ways: count every ordered pair.'
      - when:
          v: 3
        say: 3/36 counts (1, 6) and (6, 1) as the same. The dice are different, so each order is its own outcome.
    - prompt: Both dice show an even number.
      target: 9
      mistakes:
      - when:
          v: 3
        say: '3/36 counts only doubles like (2, 2). Each die can be 2, 4 or 6 on its own: 3 choices × 3 choices.'
      - when:
          v: 18
        say: '18/36 is a half. Along a tree, chances multiply: ½ × ½ is a quarter.'
    - prompt: NOT both even.
      target: 27
      mistakes:
      - when:
          v: 9
        say: '9/36 is ''both even''. ''Not'' is everything else: P(not A) = 1 − P(A).'
      - when:
          v: 18
        say: 18 is half of 36, but 'both even' was a quarter. What's left after a quarter?
    - prompt: The total is 1.
      target: 0
      mistakes:
      - when:
          v: 1
        say: The smallest total is 1 + 1 = 2, so a total of 1 is impossible.
  lesson:
    - teach: 'When every outcome is equally likely, we can work out probability without experiments: P(event) = favourable outcomes ÷ total outcomes. A dice has 6 outcomes; ''a number below 3'' is 1 or 2, so P = 2/6 = 1/3.'
      check:
        prompt: A dice is rolled. What is P(an odd number)?
        options:
        - 1/2
        - 1/3
        - 1/6
        answer: 1/2
        why: '1, 3, 5: 3 of 6 outcomes.'
    - teach: 'The list of all outcomes is the sample space. For two steps, list every combination with a table or tree. Two coins: HH, HT, TH, TT, 4 outcomes. ''One head and one tail'' is HT or TH, so P = 2/4 = 1/2.'
      picture:
        kind: flow
        steps:
        - 'First coin: H or T'
        - 'Second coin: H or T for each'
        - 'Outcomes: HH, HT, TH, TT'
        - 'One of each: HT, TH'
        - P = 2/4 = 1/2
        alt: A two-step tree for two coins giving four outcomes, two of which have one head and one tail.
      check:
        prompt: A coin is tossed and a dice rolled. How many outcomes?
        options:
        - '12'
        - '8'
        - '6'
        answer: '12'
        why: 2 × 6 = 12.
    - teach: 'Two helpful rules. P(not A) = 1 − P(A): if P(win) = 0.3, P(not win) = 0.7. Along a tree branch, multiply: P(H then H) = 1/2 × 1/2 = 1/4.'
      check:
        prompt: P(a bus is late) = 0.2. What is P(it is not late)?
        options:
        - '0.8'
        - '0.2'
        - '1.2'
        answer: '0.8'
        why: 1 − 0.2 = 0.8.
  items:
  - prompt: A dice is rolled. What is the probability of getting a number greater than 4? Type a fraction.
    answer: 1/3
    check: 2/6
    difficulty: 1
    hints:
    - Which faces are greater than 4?
    - '5 and 6: 2 out of 6.'
    solution: 'Step 1: Favourable: 5, 6 (2 outcomes). Step 2: 2/6 = 1/3.'
    mistakes:
      2/4: probability_wrong_total
  - prompt: A bag has 3 red and 5 blue marbles. One is picked at random. What is P(red)? Type a fraction.
    answer: 3/8
    check: 3/(3 + 5)
    difficulty: 1
    hints:
    - 'Total marbles: 8.'
    - 'Red: 3.'
    solution: 'Step 1: Total = 8. Step 2: P(red) = 3/8.'
    mistakes:
      3/5: probability_wrong_total
  - prompt: Two coins are tossed. What is the probability of two heads? Type a fraction.
    answer: 1/4
    check: 1/2*1/2
    difficulty: 2
    hints:
    - List HH, HT, TH, TT.
    - Only HH.
    solution: 'Step 1: 4 equally likely outcomes. Step 2: Only HH works: 1/4.'
    mistakes:
      1/3: probability_wrong_total
      '1': tree_add_instead_multiply
  - prompt: If P(rain tomorrow) = 0.35, what is P(no rain tomorrow)? Type a decimal.
    answer: '0.65'
    check: 1 - 0.35
    difficulty: 2
    hints:
    - P(not A) = 1 − P(A).
    - 1 − 0.35.
    solution: 'Step 1: Rain or no rain covers everything, so the two add to 1. Step 2: 1 − 0.35 = 0.65.'
    mistakes: {"0.35": "complement_one_minus", "0.75": "complement_one_minus"}
  - prompt: A coin is tossed and a dice is rolled. How many outcomes are in the sample space?
    answer: '12'
    check: 2*6
    difficulty: 2
    hints:
    - Each coin result pairs with each dice result.
    - 2 × 6.
    solution: 'Step 1: H1 … H6 and T1 … T6. Step 2: 2 × 6 = 12 outcomes.'
    mistakes:
      '8': tree_add_instead_multiply
  - prompt: Two dice are rolled. What is the probability that the total is 7? Type a fraction.
    answer: 1/6
    check: 6/36
    difficulty: 3
    hints:
    - There are 6 × 6 = 36 outcomes.
    - (1,6), (2,5), (3,4), (4,3), (5,2), (6,1).
    solution: 'Step 1: 36 equally likely pairs. Step 2: 6 pairs total 7. Step 3: 6/36 = 1/6.'
    mistakes:
      1/11: probability_wrong_total
  - prompt: A dice is rolled. What is the probability of a 2? Type a fraction.
    answer: 1/6
    check: 1/6
    difficulty: 1
    hints:
    - How many faces show 2?
    - 1 out of 6.
    solution: '1 favourable outcome out of 6: 1/6.'
    mistakes:
      1/2: probability_wrong_total
      2/6: probability_wrong_total
  - prompt: A box has 4 green and 6 yellow balls. One is picked at random. What is P(yellow)? Type a fraction.
    answer: 3/5
    check: 6/10
    difficulty: 1
    hints:
    - Total balls = 10.
    - 6 ÷ 10.
    solution: 6/10 = 3/5.
    mistakes:
      6/4: probability_wrong_total
      2/5: not_event_complement
  - prompt: A letter is chosen at random from the word MATHS. What is P(a vowel)? Type a fraction.
    answer: 1/5
    check: 1/5
    difficulty: 1
    hints:
    - MATHS has 5 letters.
    - Only A is a vowel.
    solution: '1 vowel out of 5 letters: 1/5.'
    mistakes:
      4/5: not_event_complement
  - prompt: Two coins are tossed. What is P(at least one head)? Type a fraction.
    answer: 3/4
    check: 3/4
    difficulty: 2
    hints:
    - List HH, HT, TH, TT.
    - Only TT has no head.
    solution: 'HH, HT, TH: 3 out of 4, so 3/4.'
    mistakes:
      1/4: not_event_complement
      1/2: probability_wrong_total
  - prompt: A card is drawn from 1, 2, 3, …, 20. What is P(a multiple of 5)? Type a fraction.
    answer: 1/5
    check: 4/20
    difficulty: 2
    hints:
    - 'Multiples of 5 up to 20: 5, 10, 15, 20.'
    - 4 ÷ 20.
    solution: 4/20 = 1/5.
    mistakes:
      1/4: probability_wrong_total
      4/5: not_event_complement
  - prompt: P(A) = 2/7. What is P(not A)? Type a fraction.
    answer: 5/7
    check: 5/7
    difficulty: 2
    hints:
    - P(not A) = 1 − P(A).
    - 7/7 − 2/7.
    solution: 1 − 2/7 = 5/7.
    mistakes:
      2/7: complement_one_minus
      7/2: complement_one_minus
  - prompt: A coin is tossed and a dice is rolled. What is P(heads and a 6)? Type a fraction.
    answer: 1/12
    check: 1/2*1/6
    difficulty: 2
    hints:
    - There are 12 outcomes.
    - 'Multiply along the branch: 1/2 × 1/6.'
    solution: 'Only H6 works: 1/12.'
    mistakes:
      2/3: tree_add_instead_multiply
      1/6: probability_wrong_total
  - prompt: Two dice are rolled. What is P(a double, the same number on both)? Type a fraction.
    answer: 1/6
    check: 6/36
    difficulty: 3
    hints:
    - 36 outcomes in all.
    - 'Doubles: (1,1), (2,2), …, (6,6).'
    solution: '6 doubles out of 36: 1/6.'
    mistakes:
      1/36: probability_wrong_total
      1/12: probability_wrong_total
  - prompt: Three coins are tossed. What is P(all three heads)? Type a fraction.
    answer: 1/8
    check: (1/2)**3
    difficulty: 3
    hints:
    - Each coin has 2 outcomes; 2 × 2 × 2 = 8.
    - Only HHH works.
    solution: 1/2 × 1/2 × 1/2 = 1/8.
    mistakes:
      3/2: tree_add_instead_multiply
      1/6: probability_wrong_total
      1/3: probability_wrong_total
