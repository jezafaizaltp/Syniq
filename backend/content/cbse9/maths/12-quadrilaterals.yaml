# CBSE Class 9 Mathematics (NCERT Ganita Manjari, 2026-27), chapter 12. Format: content/README.md.
subject: cbse9-math
chapter: 12
title: Quadrilaterals
tips:
  quad_sum_360: 'The angles of a quadrilateral add to 360°, not 180°: a diagonal splits it into two triangles.'
  parallelogram_adjacent: In a parallelogram, opposite angles are equal and adjacent angles add to 180°.
  midpoint_half: The segment joining the midpoints of two sides is half the THIRD side, and parallel to it.
  centroid_ratio_flip: 'The centroid is twice as far from the corner as from the midpoint of the opposite side: 2 : 1 from the vertex.'
  centroid_average: "The centroid is the average of the three corners: add the three x-values and divide by the number of corners."
  centroid_reverse: "The centroid's y is the average of the three y-values. Multiply by 3, then take away the two you know."
  converse_midpoint: "A line through the mid-point of one side, parallel to another side, cuts the third side in half."
  diagonals_bisect: "The diagonals of a parallelogram cut each other in half. AO is half of AC."
  equal_and_perp: "Rectangles have equal diagonals; rhombuses have perpendicular ones. Which shape is both?"
  midpoint_theorem_parallel: "The mid-point theorem says the joining segment is parallel to the third side and half as long. It doesn't touch the third side."
  midpoint_theorem_used: "Draw one diagonal. It splits the quadrilateral into two triangles, each with two midpoints joined. Which theorem is about that?"
  varignon_parallelogram: "Each side of the inner shape is parallel to a diagonal and half its length. Opposite sides match: which shape has that?"
  varignon_perimeter: "Each side of the midpoint shape is half a diagonal, and each diagonal is used twice."
  c9m12_one_pair_test: "Draw a diagonal. With one pair of sides equal and parallel, the two triangles it makes are congruent (SAS). What does that tell you about the other two sides?"
concepts:
- code: cbse9gm.quad.parallelogram
  title: Properties of a parallelogram
  notes: |
    Angle sum of a quadrilateral is 360°. In a parallelogram: a diagonal divides it into two congruent
    triangles; opposite sides are equal; opposite angles are equal; diagonals bisect each other; adjacent
    angles are supplementary. Each converse also proves a quadrilateral is a parallelogram, as does one
    pair of opposite sides being equal and parallel. Rectangle: diagonals equal. Rhombus: diagonals
    perpendicular. Square: both.
  explanations:
    text: A parallelogram has two pairs of parallel sides. Because of that, opposite sides are equal, opposite angles are equal, angles next to each other add to 180°, and the diagonals cut each other exactly in half.
    visual: 'Push a rectangle sideways at the top and you get a parallelogram. The opposite sides keep their lengths, and the two pointy corners match each other, as do the two blunt corners. Draw both diagonals: they cross at the exact middle of each.'
    step_by_step: 'Step 1: Opposite angles are equal. Step 2: Neighbouring angles add to 180°. Step 3: Opposite sides are equal. Step 4: Diagonals bisect each other: each half is half the diagonal. Step 5: For any quadrilateral, all four angles add to 360°.'
    real_world: A scissor lift's arms form parallelograms. As it rises, the angles change but opposite sides stay equal and parallel, so the platform stays level.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 6
      - 2
      C:
      - 9
      - 7
      D:
      - 4
      - 7
      O:
      - 5
      - 4.5
    segments:
    - - A
      - B
      - a
    - - B
      - C
      - b
    - - C
      - D
      - a
    - - D
      - A
      - b
    - - A
      - C
    - - B
      - D
    caption: Opposite sides are equal, and the diagonals cut each other in half at O.
    alt: Parallelogram ABCD with opposite sides labelled a and a, b and b. The diagonals AC and BD cross at their mid-point O.
  activity:
    type: angle
    prompt: Turn the arm to make each angle.
    goals:
    - prompt: ABCD is a parallelogram with ∠A = 70°. Make ∠B.
      degrees: 110
      mistakes:
      - when:
          degrees: 70
        say: 70° is ∠C, opposite A. B is next to A, and adjacent angles of a parallelogram add to 180°.
      - when:
          degrees: 290
        say: 290° makes a full turn with 70°. Adjacent angles make a straight angle, 180°.
    - prompt: Now make ∠C.
      degrees: 70
      mistakes:
      - when:
          degrees: 110
        say: 110° is ∠B or ∠D, next to A. C is opposite A, and opposite angles are equal.
    - prompt: A quadrilateral (not a parallelogram) has angles 80°, 95° and 100°. Make the fourth.
      degrees: 85
      mistakes:
      - when:
          degrees: 95
        say: 'Only a parallelogram has equal opposite angles. For any quadrilateral, use the angle sum: 360°.'
      - when:
          degrees: 180
        say: The angles of a quadrilateral add to 360°, not 180°. What is left after 275°?
    - prompt: Make the angle at which a rhombus's diagonals cross.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: '180° is a straight line: the diagonals would lie along each other. In a rhombus they cross at right angles.'
      - when:
          degrees:
          - 45
          - 60
        say: Too narrow. The diagonals of a rhombus cut each other at right angles, making four equal corners in the middle.
  lesson:
    - teach: Any quadrilateral can be cut by a diagonal into two triangles, each with angles adding to 180°. So the four angles of a quadrilateral add to 360°.
      check:
        prompt: Three angles of a quadrilateral are 90°, 90° and 100°. What is the fourth?
        options:
        - 80°
        - 100°
        - 180°
        answer: 80°
        why: 360 − 280 = 80.
    - teach: 'A parallelogram has both pairs of opposite sides parallel. Then: opposite sides are equal, opposite angles are equal, and adjacent angles add to 180° (co-interior angles between parallel lines). The diagonals cut each other in half.'
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 2
          B:
          - 6
          - 2
          C:
          - 8
          - 6
          D:
          - 3
          - 6
          O:
          - 4.5
          - 4
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - D
        - - D
          - A
        - - A
          - C
        - - B
          - D
        angles:
        - at: A
          from: B
          to: D
          label: x
        - at: B
          from: C
          to: A
          label: 180° − x
        caption: Opposite angles are equal; neighbours add to 180°; O is the midpoint of both diagonals.
        alt: Parallelogram ABCD with diagonals meeting at O; angle A is x and angle B is 180° minus x.
      check:
        prompt: In parallelogram PQRS, ∠P = 65°. What is ∠Q?
        options:
        - 115°
        - 65°
        - 25°
        answer: 115°
        why: P and Q are adjacent, so they add to 180°.
    - teach: 'Special parallelograms: a rectangle has equal diagonals; a rhombus has perpendicular diagonals; a square has both. And to prove a quadrilateral is a parallelogram, it is enough to show one pair of opposite sides is equal and parallel.'
      check:
        prompt: Which quadrilateral has diagonals that are perpendicular but not always equal?
        options:
        - Rhombus
        - Rectangle
        - Square
        answer: Rhombus
        why: A rhombus's diagonals cross at right angles; they are equal only if it is a square.
  items:
  - prompt: Three angles of a quadrilateral are 80°, 95° and 110°. Find the fourth angle in degrees.
    answer: '75'
    check: 360 - 80 - 95 - 110
    difficulty: 1
    hints:
    - The four angles add to 360°.
    - 360 − 285.
    solution: 'Step 1: 80 + 95 + 110 = 285. Step 2: 360 − 285 = 75°.'
    mistakes:
      '-105': quad_sum_360
  - prompt: In parallelogram ABCD, ∠A = 70°. Find ∠C in degrees.
    answer: '70'
    check: '70'
    difficulty: 1
    hints:
    - ∠A and ∠C are opposite.
    - Opposite angles are equal.
    solution: Opposite angles of a parallelogram are equal, so ∠C = 70°.
    mistakes:
      '110': parallelogram_adjacent
  - prompt: In parallelogram ABCD, ∠A = 70°. Find ∠B in degrees.
    answer: '110'
    check: 180 - 70
    difficulty: 2
    hints:
    - ∠A and ∠B are adjacent.
    - Adjacent angles add to 180°.
    solution: ∠B = 180° − 70° = 110°.
    mistakes:
      '70': parallelogram_adjacent
  - prompt: The diagonals of a parallelogram meet at O. If AC = 14 cm, how long is AO in cm?
    answer: '7'
    check: 14/2
    difficulty: 2
    hints:
    - Diagonals bisect each other.
    - AO is half of AC.
    solution: The diagonals bisect each other, so AO = 14 ÷ 2 = 7 cm.
    mistakes: {"14": "diagonals_bisect", "28": "diagonals_bisect"}
  - prompt: Which quadrilateral has diagonals that are equal AND perpendicular?
    options:
    - Square
    - Rhombus
    - Rectangle
    - Parallelogram
    answer: Square
    difficulty: 2
    hints:
    - 'Rectangle: equal diagonals.'
    - 'Rhombus: perpendicular diagonals.'
    solution: A square is both a rectangle and a rhombus, so its diagonals are equal and perpendicular.
    mistakes: {"Rhombus": "equal_and_perp", "Rectangle": "equal_and_perp"}
  - prompt: 'Two adjacent angles of a parallelogram are in the ratio 2 : 3. Find the smaller angle in degrees.'
    answer: '72'
    check: 180*2/5
    difficulty: 3
    hints:
    - Adjacent angles add to 180°.
    - 2x + 3x = 180.
    solution: 'Step 1: 5x = 180°, so x = 36°. Step 2: Smaller angle = 2 × 36° = 72°.'
    mistakes:
      '144': quad_sum_360
  - prompt: The angles of a quadrilateral are x, 2x, 3x and 4x. Find x in degrees.
    answer: '36'
    check: 360/10
    difficulty: 2
    hints:
    - They add to 360°.
    - 10x = 360.
    solution: 'Step 1: x + 2x + 3x + 4x = 10x = 360°. Step 2: x = 36°.'
    mistakes:
      '18': quad_sum_360
  - prompt: Three angles of a quadrilateral are 70°, 120° and 85°. Find the fourth, in degrees.
    answer: '85'
    check: 360 - 70 - 120 - 85
    difficulty: 1
    hints:
    - The angles add to 360°.
    - 360 − 275.
    solution: 360 − 275 = 85°.
    mistakes:
      '265': quad_sum_360
      '5': quad_sum_360
  - prompt: In parallelogram ABCD, AB = 9 cm. How long is CD, in cm?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - AB and CD are opposite sides.
    - Opposite sides of a parallelogram are equal.
    solution: Opposite sides are equal, so CD = 9 cm.
    mistakes:
      '18': parallelogram_adjacent
  - prompt: In parallelogram ABCD, ∠B = 125°. Find ∠D in degrees.
    answer: '125'
    check: '125'
    difficulty: 1
    hints:
    - B and D are opposite.
    - Opposite angles are equal.
    solution: ∠D = ∠B = 125°.
    mistakes:
      '55': parallelogram_adjacent
  - prompt: The diagonals of parallelogram PQRS meet at O. OQ = 5 cm. How long is QS, in cm?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - The diagonals bisect each other.
    - O is the middle of QS.
    solution: QS = 2 × OQ = 10 cm.
    mistakes:
      '5': diagonals_bisect
      '2.5': diagonals_bisect
  - prompt: Which quadrilateral has equal diagonals that are not always perpendicular?
    options:
    - Rectangle
    - Rhombus
    - Square
    - Kite
    answer: Rectangle
    difficulty: 2
    hints:
    - Picture a long, thin shape with four right angles.
    - Its diagonals are equal but cross at a slant.
    solution: A rectangle's diagonals are equal; they are perpendicular only when it is a square.
    mistakes:
      Rhombus: equal_and_perp
      Square: equal_and_perp
  - prompt: In parallelogram ABCD, ∠A = (2x + 10)° and ∠B = (3x − 30)°. Find x.
    answer: '40'
    check: 200/5
    difficulty: 2
    hints:
    - 'A and B are adjacent: they add to 180°.'
    - 5x − 20 = 180.
    solution: 2x + 10 + 3x − 30 = 180, so 5x = 200 and x = 40.
    mistakes:
      '8': parallelogram_adjacent
      '36': quad_sum_360
  - prompt: A quadrilateral has one pair of opposite sides equal AND parallel. What must it be?
    options:
    - A parallelogram
    - A rectangle
    - A trapezium only
    - Nothing can be said
    answer: A parallelogram
    difficulty: 2
    hints:
    - Join a diagonal and compare the two triangles it makes.
    - The triangles are congruent, so the other pair of sides is parallel too.
    solution: One pair of opposite sides equal and parallel is enough to prove a parallelogram.
    mistakes:
      Nothing can be said: c9m12_one_pair_test
      A rectangle: equal_and_perp
  - prompt: In a rhombus, one diagonal makes an angle of 35° with a side. What angle do the diagonals make with each other, in degrees?
    answer: '90'
    check: '90'
    difficulty: 3
    hints:
    - What is special about a rhombus's diagonals?
    - They are perpendicular.
    solution: The diagonals of a rhombus always cross at 90°, whatever the side angle.
    mistakes:
      '35': equal_and_perp
      '70': equal_and_perp
- code: cbse9gm.quad.midpoint
  title: The mid-point theorem
  after:
  - cbse9gm.quad.parallelogram
  notes: |
    Mid-point theorem: the segment joining the mid-points of two sides of a triangle is parallel to the
    third side and half of it. Converse: a line through the mid-point of one side, parallel to another,
    bisects the third side. Joining the mid-points of the sides of any quadrilateral gives a parallelogram.
  explanations:
    text: In any triangle, join the middle points of two sides. That joining line is parallel to the third side and exactly half as long. If the third side is 10 cm, the mid-point line is 5 cm.
    visual: Draw a triangle and mark the middle of the left and right sides. Join them with a line. It runs level with the bottom side, like a shelf halfway up, and is exactly half the bottom's length.
    step_by_step: 'Step 1: Check both points are mid-points of two sides. Step 2: The third side is the one they don''t touch. Step 3: The mid-point segment = third side ÷ 2. Step 4: Or, if you know the segment, the third side = segment × 2.'
    real_world: An A-frame ladder has a crossbar fixed at the middle of both legs. The crossbar is half as wide as the gap between the feet, so if the feet are 1 m apart, the bar is 50 cm.
  picture:
    kind: geometry
    points:
      A:
      - 5
      - 9
      B:
      - 1
      - 1
      C:
      - 9
      - 1
      D:
      - 3
      - 5
      E:
      - 7
      - 5
    segments:
    - - A
      - B
    - - A
      - C
    - - B
      - C
      - 8 cm
    - - D
      - E
      - 4 cm
    caption: D and E are mid-points of AB and AC. DE is parallel to BC and half as long.
    alt: Triangle ABC with base BC of 8 cm. D and E are the mid-points of AB and AC, and the line DE is level with BC and 4 cm long.
  activity:
    type: formula
    prompt: In triangle ABC, P and Q are the midpoints of AB and AC. Change the three sides.
    inputs:
    - name: a
      label: BC
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    - name: b
      label: CA
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    - name: c
      label: AB
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: pq
      label: PQ
      expr: a/2
      unit: cm
    - name: big
      label: Perimeter of ABC
      expr: a+b+c
      unit: cm
    - name: small
      label: Perimeter of the midpoint triangle
      expr: (a+b+c)/2
      unit: cm
    goals:
    - prompt: Make PQ = 6 cm.
      want:
        pq: 6
      hint: PQ joins the midpoints of AB and AC. Which side is it parallel to?
      mistakes:
      - when:
          a: 6
        say: With BC = 6, PQ is only 3. The segment joining the midpoints is half the third side.
      - when:
          b: 12
        say: PQ doesn't depend on CA. It is parallel to BC and half of it.
    - prompt: With BC = 10 cm, make the midpoint triangle's perimeter 15 cm.
      want:
        a: 10
        small: 15
      mistakes:
      - when:
          big: 15
        say: That's ABC's perimeter. Each side of the midpoint triangle is half a side of ABC, so its perimeter is half of ABC's.
      - when:
          small: 10
        say: 'Not yet: the midpoint triangle''s sides are half of BC, CA and AB. CA + AB must grow.'
  lesson:
    - teach: 'In any triangle ABC, mark D, the midpoint of AB, and E, the midpoint of AC. Join DE. The mid-point theorem says: DE is parallel to BC, and DE is exactly half of BC.'
      picture:
        kind: geometry
        points:
          A:
          - 5
          - 9
          B:
          - 1
          - 1
          C:
          - 9
          - 1
          D:
          - 3
          - 5
          E:
          - 7
          - 5
        segments:
        - - A
          - B
        - - B
          - C
          - '12'
        - - C
          - A
        - - D
          - E
          - '6'
        caption: D and E are midpoints, so DE ∥ BC and DE = ½BC.
        alt: Triangle ABC with midpoints D on AB and E on AC; DE is parallel to BC and half its length, 6 against 12.
      check:
        prompt: BC = 18 cm. D and E are midpoints of AB and AC. How long is DE?
        options:
        - 9 cm
        - 18 cm
        - 36 cm
        answer: 9 cm
        why: DE is half of BC.
    - teach: 'The converse also holds: a line through the midpoint of one side, parallel to a second side, cuts the third side exactly in half.'
      check:
        prompt: D is the midpoint of AB and DE ∥ BC meets AC at E. AC = 16 cm. What is AE?
        options:
        - 8 cm
        - 16 cm
        - 4 cm
        answer: 8 cm
        why: By the converse, E is the midpoint of AC.
    - teach: Join the midpoints of all three sides and you get a small triangle whose sides are halves of the big triangle's sides, so its perimeter is half. Joining the midpoints of any quadrilateral's sides gives a parallelogram.
      check:
        prompt: A triangle has perimeter 30 cm. What is the perimeter of the triangle formed by joining its midpoints?
        options:
        - 15 cm
        - 30 cm
        - 10 cm
        answer: 15 cm
        why: Each side is half, so the perimeter is half.
  items:
  - prompt: D and E are mid-points of AB and AC in △ABC. If BC = 12 cm, find DE in cm.
    answer: '6'
    check: 12/2
    difficulty: 1
    hints:
    - DE is parallel to BC.
    - DE is half of BC.
    solution: By the mid-point theorem, DE = BC ÷ 2 = 6 cm.
    mistakes:
      '24': midpoint_half
  - prompt: D and E are mid-points of AB and AC. If DE = 4.5 cm, find BC in cm.
    answer: '9'
    check: 4.5*2
    difficulty: 1
    hints:
    - DE is half of BC.
    - BC = 2 × DE.
    solution: BC = 2 × 4.5 = 9 cm.
    mistakes:
      '2.25': midpoint_half
  - prompt: In △ABC, D and E are mid-points of AB and AC. What can you say about DE and BC?
    options:
    - DE ∥ BC
    - DE ⊥ BC
    - DE = BC
    - DE meets BC
    answer: DE ∥ BC
    difficulty: 1
    hints:
    - Think of the shelf halfway up.
    - It runs level with the base.
    solution: The mid-point theorem says DE ∥ BC (and DE = BC/2).
    mistakes: {"DE = BC": "midpoint_half", "DE meets BC": "midpoint_theorem_parallel"}
  - prompt: A triangle has sides 8 cm, 10 cm and 12 cm. The mid-points are joined to make a smaller triangle. Find its perimeter in cm.
    answer: '15'
    check: (8 + 10 + 12)/2
    difficulty: 2
    hints:
    - Each side of the small triangle is half of one side of the big one.
    - 4 + 5 + 6.
    solution: 'Step 1: Sides are 4, 5 and 6 cm. Step 2: Perimeter = 15 cm.'
    mistakes:
      '30': midpoint_half
  - prompt: The mid-points of the sides of any quadrilateral are joined in order. What shape do you get?
    options:
    - Parallelogram
    - Square
    - Rhombus
    - Trapezium only
    answer: Parallelogram
    difficulty: 2
    hints:
    - Draw a diagonal of the quadrilateral.
    - Two of the new sides are each half of it and parallel to it.
    solution: 'Each pair of opposite sides is parallel to the same diagonal and half of it, so they are equal and parallel: a parallelogram.'
    mistakes: {"Square": "varignon_parallelogram", "Trapezium only": "varignon_parallelogram"}
  - prompt: Through the mid-point D of AB in △ABC, a line parallel to BC meets AC at E. If AC = 10 cm, find AE in cm.
    answer: '5'
    check: 10/2
    difficulty: 3
    hints:
    - This is the converse of the mid-point theorem.
    - E is the mid-point of AC.
    solution: The line through D parallel to BC bisects AC, so AE = 10 ÷ 2 = 5 cm.
    mistakes: {"10": "converse_midpoint", "20": "converse_midpoint"}
  - prompt: D and E are mid-points of AB and AC in △ABC. If BC = 20 cm, find DE in cm.
    answer: '10'
    check: 20/2
    difficulty: 1
    hints:
    - DE is half of BC.
    - 20 ÷ 2.
    solution: DE = ½ × 20 = 10 cm.
    mistakes:
      '20': midpoint_half
      '40': midpoint_half
  - prompt: D and E are mid-points of AB and AC. If DE = 7 cm, find BC in cm.
    answer: '14'
    check: 2*7
    difficulty: 1
    hints:
    - BC is twice DE.
    - 2 × 7.
    solution: BC = 2 × 7 = 14 cm.
    mistakes:
      '3.5': midpoint_half
      '7': midpoint_half
  - prompt: In △PQR, X and Y are the midpoints of PQ and PR. Which side is XY parallel to?
    options:
    - QR
    - PQ
    - PR
    - None
    answer: QR
    difficulty: 1
    hints:
    - XY joins midpoints of two sides.
    - It is parallel to the third side.
    solution: By the mid-point theorem, XY ∥ QR.
    mistakes:
      PQ: midpoint_theorem_parallel
  - prompt: A triangle has sides 6 cm, 9 cm and 11 cm. The midpoints are joined. What is the perimeter of the new triangle, in cm?
    answer: '13'
    check: (6 + 9 + 11)/2
    difficulty: 2
    hints:
    - Each new side is half an old side.
    - Half of 26.
    solution: 'Sides 3, 4.5, 5.5: perimeter 13 cm.'
    mistakes:
      '26': midpoint_half
      '52': midpoint_half
  - prompt: In △ABC, D is the midpoint of AB. A line through D parallel to BC meets AC at E. If AE = 6 cm, find AC in cm.
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - By the converse, E is the midpoint of AC.
    - AC = 2 × AE.
    solution: E is the midpoint of AC, so AC = 12 cm.
    mistakes:
      '6': converse_midpoint
      '3': converse_midpoint
  - prompt: ABCD is any quadrilateral. P, Q, R, S are midpoints of AB, BC, CD, DA. Why is PQ ∥ SR?
    options:
    - Both are parallel to the diagonal AC
    - Both are parallel to BD
    - Because ABCD is a parallelogram
    - Because PQ = QR
    answer: Both are parallel to the diagonal AC
    difficulty: 2
    hints:
    - 'Look at △ABC: P and Q are midpoints of two of its sides.'
    - Then look at △ACD.
    solution: In △ABC, PQ ∥ AC. In △ACD, SR ∥ AC. So PQ ∥ SR.
    mistakes:
      Because ABCD is a parallelogram: varignon_parallelogram
  - prompt: D and E are midpoints of AB and AC. ∠ABC = 55°. Find ∠ADE in degrees.
    answer: '55'
    check: '55'
    difficulty: 2
    hints:
    - DE ∥ BC.
    - Corresponding angles along AB are equal.
    solution: DE ∥ BC, so ∠ADE = ∠ABC = 55° (corresponding angles).
    mistakes:
      '125': midpoint_theorem_parallel
      '27.5': midpoint_half
  - prompt: An equilateral triangle has side 16 cm. Its midpoints are joined, then the midpoints of the new triangle are joined. What is the side of the smallest triangle, in cm?
    answer: '4'
    check: 16/4
    difficulty: 3
    hints:
    - Each joining halves the side.
    - 16 → 8 → ?
    solution: 16 → 8 → 4 cm.
    mistakes:
      '8': midpoint_half
      '2': midpoint_half
  - prompt: In △ABC, D and E are midpoints of AB and AC, and DE = 2x + 1 while BC = 5x − 4. Find x.
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - BC = 2 × DE.
    - 5x − 4 = 4x + 2.
    solution: '5x − 4 = 2(2x + 1) = 4x + 2, so x = 6. Check: DE = 13, BC = 26.'
    mistakes:
      '1.67': midpoint_half
      '3': midpoint_theorem_used
- code: cbse9gm.quad.centroid_varignon
  title: Medians, the centroid and midpoint quadrilaterals
  after:
  - cbse9gm.quad.midpoint
  notes: |
    A median joins a vertex of a triangle to the midpoint of the opposite side. The three medians meet at one
    point, the centroid, which divides each median in the ratio 2 : 1 from the vertex (it is the balance point
    of a triangle cut from card). With vertices (x₁, y₁), (x₂, y₂), (x₃, y₃) the centroid is
    ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3). Varignon's theorem: joining the midpoints of the sides of any
    quadrilateral in order gives a parallelogram (by the midpoint theorem each side is parallel to a diagonal
    and half as long). Any quadrilateral can tile the plane.
  explanations:
    text: 'Join each corner of a triangle to the middle of the opposite side: the three lines meet at one point, the centroid, two-thirds of the way down each line from the corner. Join the midpoints of the four sides of any quadrilateral and you always get a parallelogram: that''s Varignon''s theorem.'
    visual: 'Draw any four-sided shape ABCD, mark the midpoints P, Q, R, S of its sides and join them. Now draw the diagonal AC: PQ and SR are both parallel to it and half its length (midpoint theorem). Opposite sides equal and parallel: PQRS is a parallelogram.'
    step_by_step: 'Step 1: For the centroid, find the midpoint of a side and join it to the opposite vertex. Step 2: The centroid is 2/3 of the way along from the vertex. Step 3: With coordinates, average the three x''s and the three y''s. Step 4: For any quadrilateral, the midpoints joined in order form a parallelogram.'
    real_world: 'Balance a cardboard triangle on a pencil point: the only spot where it balances is the centroid.'
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 1
      B:
      - 9
      - 1
      C:
      - 4
      - 8
      M:
      - 6.5
      - 4.5
      G:
      - 4.67
      - 3.33
    segments:
    - - A
      - B
    - - B
      - C
    - - C
      - A
    - - A
      - M
    caption: 'G is on median AM with AG : GM = 2 : 1.'
    alt: Triangle ABC with M the midpoint of BC and the median AM; the centroid G lies two-thirds of the way from A to M.
  activity:
    type: graph
    mode: point
    range:
    - -6
    - 6
    prompt: 'Move the point to the centroid: where the three medians meet. It is the average of the three corners.'
    goals:
    - prompt: Triangle A(−4, −1), B(4, −1), C(0, 5). Plot its centroid.
      x: 0
      y: 1
      hint: Add the three x-values and divide by 3. Then the three y-values.
      mistakes:
      - when:
          x: 0
          y: -1
        say: (0, −1) is the midpoint of AB, where the median from C ends. The centroid is a third of the way up from there towards C.
      - when:
          x: 0
          y: 3
        say: 'This is 2 : 1 from the side, not from the corner. The centroid splits the median 2 : 1 from the vertex, so it sits nearer the side.'
      - when:
          x: 0
          y: 2
        say: 'You averaged only two y-values. Use all three: (−1 − 1 + 5) ÷ 3.'
    - prompt: Triangle A(−3, 5), B(6, −1), C(0, −4). Plot its centroid.
      x: 1
      y: 0
      mistakes:
      - when:
          x: 3
          y: 0
        say: You added the x-values, 3, but didn't divide by 3. The centroid is the average.
      - when:
          x: 0
          y: 1
        say: 'Swapped: the x-values average to 1 and the y-values to 0.'
  lesson:
    - teach: A median of a triangle joins a corner to the midpoint of the opposite side. Every triangle has three medians, and they always meet at one point, the centroid G. If you cut the triangle from card, it balances on G.
      check:
        prompt: A median joins a vertex to…
        options:
        - the midpoint of the opposite side
        - the opposite vertex
        - the centre of the circle
        answer: the midpoint of the opposite side
        why: That is what a median is.
    - teach: 'G divides each median in the ratio 2 : 1 from the vertex. If median AM is 9 cm, AG = 6 cm and GM = 3 cm. On a coordinate grid, G is the average of the three vertices: ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3).'
      picture:
        kind: geometry
        points:
          A:
          - 5
          - 9
          B:
          - 1
          - 1
          C:
          - 9
          - 1
          M:
          - 5
          - 1
          G:
          - 5
          - 3.67
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - A
        - - A
          - G
          - 2 parts
        - - G
          - M
          - 1 part
        caption: 'AG : GM = 2 : 1.'
        alt: Triangle ABC with median AM; the centroid G divides AM so that AG is two parts and GM is one part.
      check:
        prompt: Vertices (0, 0), (9, 0), (0, 6). What is the centroid?
        options:
        - (3, 2)
        - (4.5, 3)
        - (9, 6)
        answer: (3, 2)
        why: ((0 + 9 + 0)/3, (0 + 0 + 6)/3) = (3, 2).
    - teach: 'Varignon''s theorem: joining the midpoints of any quadrilateral''s sides, in order, makes a parallelogram. Each of its sides is parallel to a diagonal and half as long, so its perimeter equals the sum of the diagonals.'
      check:
        prompt: A quadrilateral's diagonals are 8 cm and 12 cm. What is the perimeter of its midpoint parallelogram?
        options:
        - 20 cm
        - 40 cm
        - 10 cm
        answer: 20 cm
        why: 'Two sides of 4 and two of 6: 4 + 6 + 4 + 6 = 20.'
  items:
  - prompt: Find the x-coordinate of the centroid of the triangle with vertices (0, 0), (6, 0) and (3, 9).
    answer: '3'
    check: (0 + 6 + 3)/3
    difficulty: 1
    hints:
    - Average the three x-values.
    - (0 + 6 + 3) ÷ 3.
    solution: 'Step 1: 0 + 6 + 3 = 9. Step 2: 9 ÷ 3 = 3. (The centroid is (3, 3).)'
    mistakes: {"9": "centroid_average", "4.5": "centroid_average"}
  - prompt: A median AM is 12 cm long. How far is the centroid G from A, in cm?
    answer: '8'
    check: 2/3*12
    difficulty: 1
    hints:
    - 'AG : GM = 2 : 1.'
    - AG is 2/3 of AM.
    solution: 'Step 1: AG = (2/3) × 12. Step 2: = 8 cm (and GM = 4 cm).'
    mistakes:
      '4': centroid_ratio_flip
      '6': centroid_ratio_flip
  - prompt: What shape do you always get by joining the midpoints of the sides of any quadrilateral in order?
    options:
    - A parallelogram
    - A square
    - A rectangle
    - A trapezium that is not a parallelogram
    answer: A parallelogram
    difficulty: 1
    hints:
    - Varignon's theorem.
    - Use the midpoint theorem with a diagonal.
    solution: 'Step 1: Each pair of opposite sides is parallel to the same diagonal and half its length. Step 2: So the midpoint quadrilateral is a parallelogram.'
    mistakes: {"A square": "varignon_parallelogram", "A rectangle": "varignon_parallelogram"}
  - prompt: A quadrilateral has diagonals 10 cm and 14 cm. What is the perimeter of its midpoint quadrilateral, in cm?
    answer: '24'
    check: 10 + 14
    difficulty: 2
    hints:
    - Each side of the midpoint quadrilateral is half a diagonal.
    - Two sides of 5 and two of 7.
    solution: 'Step 1: Sides are 5, 7, 5, 7. Step 2: Perimeter = 24 cm, the sum of the diagonals.'
    mistakes: {"48": "varignon_perimeter", "12": "varignon_perimeter"}
  - prompt: Which theorem is used to prove Varignon's result about midpoint quadrilaterals?
    options:
    - The midpoint theorem
    - Pythagoras' theorem
    - Heron's formula
    - The angle sum property
    answer: The midpoint theorem
    difficulty: 2
    hints:
    - Join midpoints of two sides of a triangle.
    - That segment is parallel to the third side and half of it.
    solution: 'Step 1: Draw a diagonal to split the quadrilateral into two triangles. Step 2: In each, the midpoint theorem makes the joining segment parallel to the diagonal and half its length.'
    mistakes: {"Pythagoras' theorem": "midpoint_theorem_used", "Heron's formula": "midpoint_theorem_used"}
  - prompt: The centroid of a triangle is (4, 5). Two vertices are (1, 2) and (8, 3). What is the y-coordinate of the third vertex?
    answer: '10'
    check: 3*5 - 2 - 3
    difficulty: 3
    hints:
    - (2 + 3 + y) ÷ 3 = 5.
    - 2 + 3 + y = 15.
    solution: 'Step 1: (2 + 3 + y)/3 = 5. Step 2: y = 15 − 5 = 10. (The x-coordinate is 12 − 9 = 3.)'
    mistakes: {"5": "centroid_reverse", "15": "centroid_reverse"}
  - prompt: Find the y-coordinate of the centroid of the triangle with vertices (1, 2), (4, 6) and (7, 1).
    answer: '3'
    check: (2 + 6 + 1)/3
    difficulty: 1
    hints:
    - Average the three y-values.
    - (2 + 6 + 1) ÷ 3.
    solution: 9 ÷ 3 = 3.
    mistakes:
      '9': centroid_average
      '4.5': centroid_average
  - prompt: Median PM is 15 cm. How far is the centroid from M, in cm?
    answer: '5'
    check: 15/3
    difficulty: 1
    hints:
    - 'PG : GM = 2 : 1.'
    - GM is one third of the median.
    solution: GM = 15 ÷ 3 = 5 cm (and PG = 10 cm).
    mistakes:
      '10': centroid_ratio_flip
      '7.5': centroid_ratio_flip
  - prompt: How many medians does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - One from each corner.
    - A triangle has three corners.
    solution: 'One median from each vertex: 3.'
    mistakes:
      '1': centroid_average
      '2': centroid_average
  - prompt: AG = 10 cm, where G is the centroid on median AM. How long is AM, in cm?
    answer: '15'
    check: 10*3/2
    difficulty: 2
    hints:
    - AG is 2 parts of 3.
    - One part = 5 cm.
    solution: AG = 2 parts = 10, so 1 part = 5 and AM = 15 cm.
    mistakes:
      '20': centroid_reverse
      '30': centroid_reverse
  - prompt: Find the centroid of the triangle with vertices (−3, 4), (5, 2) and (1, −3).
    options:
    - (1, 1)
    - (3, 3)
    - (1, 3)
    - (−1, 1)
    answer: (1, 1)
    difficulty: 2
    hints:
    - (−3 + 5 + 1) ÷ 3.
    - (4 + 2 − 3) ÷ 3.
    solution: (3/3, 3/3) = (1, 1).
    mistakes:
      (3, 3): centroid_average
  - prompt: A rectangle has diagonals 10 cm each. What shape is its midpoint quadrilateral?
    options:
    - A rhombus
    - A rectangle that is not a square
    - A trapezium
    - A kite that is not a parallelogram
    answer: A rhombus
    difficulty: 2
    hints:
    - Each side of the midpoint shape is half a diagonal.
    - Both diagonals are equal.
    solution: All four sides are 5 cm, so the parallelogram is a rhombus.
    mistakes:
      A trapezium: varignon_parallelogram
  - prompt: A quadrilateral has diagonals 9 cm and 15 cm. Find the perimeter of its midpoint quadrilateral, in cm.
    answer: '24'
    check: 9 + 15
    difficulty: 2
    hints:
    - 'Sides are half the diagonals: 4.5 and 7.5.'
    - Two of each.
    solution: 2 × 4.5 + 2 × 7.5 = 24 cm, the sum of the diagonals.
    mistakes:
      '48': varignon_perimeter
      '12': varignon_perimeter
  - prompt: The centroid is (2, 3). Two vertices are (0, 0) and (5, 1). What is the x-coordinate of the third vertex?
    answer: '1'
    check: 3*2 - 0 - 5
    difficulty: 3
    hints:
    - (0 + 5 + x)/3 = 2.
    - 5 + x = 6.
    solution: 0 + 5 + x = 6, so x = 1.
    mistakes:
      '-3': centroid_reverse
      '6': centroid_reverse
  - prompt: In △ABC, median AD = 18 cm and G is the centroid. M is the midpoint of AG. How long is MD, in cm?
    answer: '12'
    check: 6 + 6
    difficulty: 3
    hints:
    - Split the median 2 : 1 at G.
    - M is 6 from G; MD = MG + GD.
    solution: AG = 12 cm, so MG = 6 cm. MD = 6 + 6 = 12 cm.
    mistakes:
      '6': centroid_ratio_flip
      '9': centroid_ratio_flip
