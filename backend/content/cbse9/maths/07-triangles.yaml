# CBSE Class 9 Mathematics (NCERT), chapter 7. Format: content/README.md.
subject: cbse9-math
chapter: 7
title: Triangles

tips:
  ssa_not_rule: "Two sides and an angle that is NOT between them (SSA) does not prove congruence. The angle must be the included one: SAS."
  aaa_not_rule: "Three equal angles (AAA) give the same shape but maybe a different size, so it is not a congruence rule."
  cpct_order: "Match the letters in order: if △ABC ≅ △PQR then A↔P, B↔Q, C↔R, so AB = PQ, BC = QR, CA = RP."
  side_opposite_angle: "The side opposite an angle is the one that does not touch that corner."
  isosceles_base_angles: "In an isosceles triangle the angles opposite the equal sides (the base angles) are equal."

concepts:
  - code: cbse9m.tri.congruence
    title: Congruence rules
    notes: |
      Two triangles are congruent if all corresponding sides and angles are equal. Criteria: SAS (axiom),
      ASA, AAS, SSS and RHS (right angle–hypotenuse–side). SSA and AAA are not criteria. After proving
      congruence, corresponding parts of congruent triangles are equal (CPCT). The order of letters in
      △ABC ≅ △PQR gives the correspondence.
    explanations:
      text: "Congruent triangles are exact copies: same size, same shape. You don't need to check all six parts. Any one of these is enough: SSS (three sides), SAS (two sides and the angle between them), ASA or AAS (two angles and a side), or RHS for right triangles (right angle, hypotenuse and one side)."
      visual: "Cut a triangle from paper and lay it on the other. If it fits exactly, even after flipping, they're congruent. The rules tell you which three measurements guarantee a perfect fit: notice SAS puts the angle in the middle, between the two sides."
      step_by_step: "Step 1: List what you know is equal: sides (S), angles (A), right angle (R), hypotenuse (H). Step 2: Check the order: for SAS the angle must be between the two sides. Step 3: Name the rule. Step 4: Write the congruence with matching letters in order. Step 5: Use CPCT to get other equal parts."
      real_world: "Roof trusses are built from triangles because a triangle with fixed sides cannot change shape: that's SSS. A carpenter who cuts two trusses with the same three lengths knows they'll match."
    picture:
      kind: geometry
      points:
        A: [0.5, 1]
        B: [4.5, 1]
        C: [2.1, 3.77]
        P: [5.5, 1]
        Q: [9.5, 1]
        R: [7.1, 3.77]
      segments:
      - [A, B, 4 cm]
      - [B, C]
      - [C, A, 3.2 cm]
      - [P, Q, 4 cm]
      - [Q, R]
      - [R, P, 3.2 cm]
      angles:
      - {at: A, from: B, to: C, label: 60°}
      - {at: P, from: Q, to: R, label: 60°}
      caption: 'SAS: two sides and the angle between them match, so triangle ABC ≅ triangle PQR.'
      alt: Two triangles ABC and PQR. In both, one side is 4 cm, another is 3.2 cm, and the angle between them is 60°, so they are congruent by SAS.
    items:
      - prompt: "AB = PQ, BC = QR and ∠B = ∠Q. Which rule shows △ABC ≅ △PQR?"
        options: ["SAS", "SSS", "ASA", "RHS"]
        answer: "SAS"
        difficulty: 1
        hints: ["Two sides and an angle.", "Is ∠B between AB and BC?"]
        solution: "∠B lies between sides AB and BC, so it's two sides and the included angle: SAS."
      - prompt: "All three sides of one triangle equal the three sides of another. Which rule applies?"
        options: ["SSS", "SAS", "AAA", "RHS"]
        answer: "SSS"
        difficulty: 1
        hints: ["S stands for side.", "Three sides."]
        solution: "Three pairs of equal sides: SSS."
      - prompt: "Which of these is NOT a congruence rule?"
        options: ["AAA", "ASA", "RHS", "SSS"]
        answer: "AAA"
        difficulty: 1
        hints: ["Can two triangles have the same angles but different sizes?", "Think of a small and a big equilateral triangle."]
        solution: "AAA only gives the same shape, not the same size, so it is not a congruence rule."
        mistakes: {"RHS": aaa_not_rule}
      - prompt: "If △ABC ≅ △DEF, which side equals BC?"
        options: ["EF", "DE", "DF", "AC"]
        answer: "EF"
        difficulty: 2
        hints: ["A↔D, B↔E, C↔F.", "BC matches the 2nd and 3rd letters."]
        solution: "Step 1: B↔E and C↔F. Step 2: So BC = EF."
        mistakes: {"DE": cpct_order}
      - prompt: "In right triangles ABC and PQR (right-angled at B and Q), AC = PR and AB = PQ. Which rule applies?"
        options: ["RHS", "SAS", "ASA", "SSS"]
        answer: "RHS"
        difficulty: 2
        hints: ["There is a right angle.", "AC and PR are the hypotenuses."]
        solution: "Right angle, equal hypotenuses and one equal side: RHS."
      - prompt: "Two triangles have AB = PQ, AC = PR and ∠B = ∠Q. Are they surely congruent?"
        options: ["No, the angle is not between the sides", "Yes, by SAS", "Yes, by SSS", "Yes, by ASA"]
        answer: "No, the angle is not between the sides"
        difficulty: 3
        hints: ["Where is ∠B compared with sides AB and AC?", "∠A would be between them."]
        solution: "∠B is not between AB and AC, so this is SSA, which does not guarantee congruence."
        mistakes: {"Yes, by SAS": ssa_not_rule}
      - prompt: "△ABC ≅ △PQR with ∠A = 50° and ∠B = 70°. Find ∠R in degrees."
        answer: "60"
        check: "180 - 50 - 70"
        difficulty: 2
        hints: ["∠R corresponds to ∠C.", "∠C = 180° − 50° − 70°."]
        solution: "Step 1: ∠C = 180° − 50° − 70° = 60°. Step 2: R↔C, so ∠R = 60°."
        mistakes: {"70": cpct_order}

  - code: cbse9m.tri.isosceles
    title: Isosceles triangles
    after: [cbse9m.tri.congruence]
    notes: |
      Angles opposite equal sides of an isosceles triangle are equal (proved with SAS on the bisector of the
      vertex angle). Conversely, sides opposite equal angles are equal. Each angle of an equilateral
      triangle is 60°. The angle-sum of a triangle is 180°.
    explanations:
      text: "If two sides of a triangle are equal, the angles opposite them are equal too. Those are called the base angles. It also works backwards: if two angles are equal, the sides opposite them are equal. An equilateral triangle has all three angles 60°."
      visual: "Fold an isosceles triangle down the middle from the top. The two halves match exactly, so the two bottom corners sit on top of each other: they must be equal."
      step_by_step: "Step 1: Find the two equal sides. Step 2: The angles opposite them (not between them) are the base angles, and they're equal. Step 3: Use 180° for the angle sum: vertex + 2 × base = 180°. Step 4: Solve for the unknown angle."
      real_world: "The two sloping sides of a symmetric house roof are equal, so the roof meets both walls at the same angle. Builders use this to check both sides are cut the same."
    picture:
      kind: geometry
      points:
        A: [5, 8.5]
        B: [2, 1.5]
        C: [8, 1.5]
        M: [5, 1.5]
      segments:
      - [A, B, 5 cm]
      - [A, C, 5 cm]
      - [B, C]
      - [A, M]
      angles:
      - {at: B, from: C, to: A, label: x}
      - {at: C, from: A, to: B, label: x}
      caption: 'AB = AC, so folding along AM puts B on C: the angles opposite the equal sides are equal.'
      alt: An isosceles triangle ABC with AB = AC = 5 cm and a fold line from A to the middle M of BC. The base angles at B and C are both x.
    items:
      - prompt: "In △ABC, AB = AC and ∠B = 50°. Find ∠C in degrees."
        answer: "50"
        check: "50"
        difficulty: 1
        hints: ["Angles opposite equal sides are equal.", "∠B is opposite AC; ∠C is opposite AB."]
        solution: "AB = AC, so ∠C = ∠B = 50°."
        mistakes: {"80": isosceles_base_angles}
      - prompt: "In △ABC, AB = AC and ∠B = 50°. Find ∠A in degrees."
        answer: "80"
        check: "180 - 2*50"
        difficulty: 2
        hints: ["∠C = 50° too.", "180 − 50 − 50."]
        solution: "Step 1: ∠C = ∠B = 50°. Step 2: ∠A = 180° − 100° = 80°."
        mistakes: {"130": isosceles_base_angles}
      - prompt: "Each angle of an equilateral triangle is how many degrees?"
        answer: "60"
        check: "180/3"
        difficulty: 1
        hints: ["All three angles are equal.", "180 ÷ 3."]
        solution: "The three equal angles add to 180°, so each is 60°."
      - prompt: "The vertex angle of an isosceles triangle is 40°. Find each base angle in degrees."
        answer: "70"
        check: "(180 - 40)/2"
        difficulty: 2
        hints: ["The two base angles are equal.", "(180 − 40) ÷ 2."]
        solution: "Step 1: Base angles together = 180° − 40° = 140°. Step 2: Each = 70°."
        mistakes: {"140": forgot_divide}
      - prompt: "In △PQR, ∠Q = ∠R = 65°. Which two sides are equal?"
        options: ["PQ and PR", "PQ and QR", "QR and PR", "None"]
        answer: "PQ and PR"
        difficulty: 2
        hints: ["Sides opposite equal angles are equal.", "Opposite ∠Q is PR; opposite ∠R is PQ."]
        solution: "∠Q = ∠R, so the sides opposite them, PR and PQ, are equal."
        mistakes: {"QR and PR": side_opposite_angle}
      - prompt: "In isosceles △ABC with AB = AC, the base angles are each (x + 10)° and ∠A = 2x°. Find x."
        answer: "40"
        check: "160/4"
        difficulty: 3
        hints: ["2(x + 10) + 2x = 180.", "4x + 20 = 180."]
        solution: "Step 1: 2x + 20 + 2x = 180. Step 2: 4x = 160. Step 3: x = 40, so the angles are 50°, 50°, 80°."
