# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 9. Format: content/README.md.
subject: cbse9-ss
chapter: 9
title: 'The Price Puzzle: What Drives the Market'
tips:
  law_of_demand: "When price rises, do people buy more or less of the thing (other things staying the same)?"
  law_of_supply: When price rises, sellers offer more; when price falls, they offer less.
  equilibrium_meaning: "If sellers offer more than buyers want, goods are left over, and prices tend to drop. If buyers want more than is offered, there isn't enough."
  s9_demand_fall: "Subtract the new quantity from the old one: 50 − 30."
  s9_demand_price: "More buyers chase the same flowers. What happens to the price?"
  s9_equilibrium: "When the amount buyers want equals the amount sellers offer, the market is balanced."
  s9_income_demand: "With more money, families buy more at every price. Which way does demand shift?"
  s9_msp_floor: "MSP stops the price going below a level. Is that a ceiling or a floor?"
  s9_shortage: "Shortage = what buyers want − what sellers offer: 70 − 40."
  s9_substitutes: "Complements are used together, like a pen and ink. Tea and coffee are used instead of each other."
  s9_supply_fall: "Fewer onions reach the market. What happens to supply?"
  c9ss9_buyer_side: Think like a buyer. When something gets dearer, do you buy more of it or less?
  c9ss9_seller_side: Think like a seller. If you can get a higher price, do you want to sell more or less?
  c9ss9_shift: Ask what changed. Not the price, but something else about buyers or sellers. Which side moves?
  c9ss9_read_table: Read both numbers at that price. Which is bigger, what buyers want or what sellers offer?
  c9ss9_balance: Find the price at which what buyers want is the same as what sellers offer.
  c9ss9_govt_price: Ask whether the government is setting a highest allowed price or a lowest allowed price, and who it wants to protect.
concepts:
- code: cbse9us.price.demand_supply
  title: Demand and supply
  notes: |
    A market is any place or system where buyers and sellers meet: a weekly haat, a mall or an online shop.
    Demand is the quantity of a good buyers are willing and able to buy at different prices. The law of demand:
    other things being equal, when the price rises the quantity demanded falls, and when the price falls it
    rises. Demand also changes with income, tastes, prices of related goods (substitutes like tea and coffee,
    complements like pens and ink) and expectations. Supply is the quantity sellers are willing to offer at
    different prices. The law of supply: as price rises, quantity supplied rises. Supply also changes with
    costs of inputs, technology, weather (for crops), number of sellers and taxes. Demand and supply are
    shown as schedules (tables) and curves: the demand curve slopes down, the supply curve slopes up.
  explanations:
    text: 'When mangoes are cheap, people buy more; when they''re expensive, people buy fewer. That''s demand. Sellers act the other way: when prices are high, they bring more mangoes to market. That''s supply.'
    visual: Draw a graph with price up the side and quantity along the bottom. A line falling from top-left to bottom-right is demand; a line rising from bottom-left to top-right is supply.
    step_by_step: 'Step 1: Is the question about buyers (demand) or sellers (supply)? Step 2: Price up → buyers buy less, sellers sell more. Step 3: Price down → buyers buy more, sellers sell less. Step 4: Other changes (income, weather, costs) shift the whole curve.'
    real_world: After a heavy rain damages tomato crops, supply drops, so tomato prices in Kerala markets can jump within days.
  picture:
    kind: bars
    bars:
    - label: ₹20/kg
      value: 50
    - label: ₹40/kg
      value: 30
    - label: ₹60/kg
      value: 15
    caption: Kilograms of mangoes bought at each price
    alt: 'A demand schedule: at ₹20 a kg buyers take 50 kg, at ₹40 they take 30 kg, at ₹60 only 15 kg.'
  activity:
    type: sort
    prompt: Does demand or supply change, and which way?
    bins:
    - Demand rises
    - Demand falls
    - Supply rises
    - Supply falls
    items:
    - label: Price of tea falls (for tea)
      bin: Demand rises
      clue: Law of demand.
      why: Lower price, more demanded.
    - label: Coffee gets cheaper (demand for tea)
      bin: Demand falls
      clue: Substitute goods.
      why: People switch to coffee.
    - label: A bumper mango harvest
      bin: Supply rises
      clue: Weather.
      why: More mangoes to sell.
    - label: Fuel price rises for bus companies
      bin: Supply falls
      clue: Input costs.
      why: Costlier inputs, less supply.
    - label: Incomes rise in a town
      bin: Demand rises
      clue: More to spend.
      why: Demand rises.
  lesson:
    - teach: 'A market is any place or system where buyers and sellers meet: a weekly haat, a mall or a shopping app. Demand is how much buyers are willing and able to buy at each price. The law of demand: other things staying the same, when the price rises, buyers buy less; when it falls, they buy more.'
      picture:
        kind: bars
        bars:
        - label: ₹20/kg
          value: 50
        - label: ₹30/kg
          value: 40
        - label: ₹40/kg
          value: 30
        unit: kg of mangoes bought
        alt: 'Demand schedule for mangoes: at 20 rupees 50 kg, at 30 rupees 40 kg, at 40 rupees 30 kg.'
      check:
        prompt: In the picture, as price rises, the quantity bought…
        options:
        - Falls
        - Rises
        - Stays the same
        answer: Falls
        why: That is the law of demand.
    - teach: 'Demand also changes when other things change: income, tastes, the prices of related goods, and expectations. Substitutes can replace each other (tea and coffee): if coffee gets dearer, people buy more tea. Complements go together (pens and ink, cars and petrol).'
      check:
        prompt: Pens and ink are…
        options:
        - Complements
        - Substitutes
        - Free goods
        answer: Complements
        why: They are used together.
    - teach: 'Supply is how much sellers are willing to offer at each price. The law of supply: when the price rises, sellers offer more. Supply also changes with input costs, technology, weather for crops, the number of sellers and taxes. On a graph, the demand curve slopes down and the supply curve slopes up.'
      check:
        prompt: Floods destroy a crop. Its supply…
        options:
        - Falls
        - Rises
        - Does not change
        answer: Falls
        why: Less crop means less to sell at every price.
  items:
  - prompt: According to the law of demand, if the price of bananas rises, the quantity demanded will…
    options:
    - Fall
    - Rise
    - Stay the same
    - Become zero at once
    answer: Fall
    difficulty: 1
    hints:
    - People buy less of costlier things.
    - Other things being equal.
    solution: 'Step 1: Higher price makes the good less attractive. Step 2: Quantity demanded falls.'
    mistakes:
      Rise: law_of_demand
  - prompt: If the price of a good rises, what do sellers usually do?
    options:
    - Offer more for sale
    - Offer less for sale
    - Stop selling
    - Lower the price
    answer: Offer more for sale
    difficulty: 1
    hints:
    - Higher price, higher earnings.
    - Law of supply.
    solution: 'Step 1: Higher prices mean more profit per unit. Step 2: Sellers supply more.'
    mistakes:
      Offer less for sale: law_of_supply
  - prompt: Tea and coffee are examples of…
    options:
    - Substitutes
    - Complements
    - Free goods
    - Capital goods
    answer: Substitutes
    difficulty: 1
    hints:
    - One can replace the other.
    - Pens and ink go together; these don't.
    solution: 'Step 1: People can drink one instead of the other. Step 2: So they are substitutes.'
    mistakes: {"Complements": "s9_substitutes"}
  - prompt: 'Using the schedule: mangoes at ₹20/kg sell 50 kg and at ₹40/kg sell 30 kg. By how many kg does demand fall when price rises from ₹20 to ₹40?'
    answer: '20'
    check: '20'
    difficulty: 2
    hints:
    - Subtract the quantities.
    - 50 − 30.
    solution: 'Step 1: Quantity at ₹20 is 50 kg, at ₹40 is 30 kg. Step 2: 50 − 30 = 20 kg.'
    mistakes: {"80": "s9_demand_fall", "30": "s9_demand_fall"}
  - prompt: Floods destroy onion crops. What happens to the supply of onions?
    options:
    - It falls
    - It rises
    - It doesn't change
    - Demand falls instead
    answer: It falls
    difficulty: 2
    hints:
    - Fewer onions to sell.
    - Weather affects crop supply.
    solution: 'Step 1: Crops are damaged. Step 2: Less is available to sell, so supply falls.'
    mistakes: {"It rises": "s9_supply_fall", "Demand falls instead": "s9_supply_fall"}
  - prompt: Families' incomes rise. What usually happens to the demand for most goods like clothes?
    options:
    - Demand rises at every price
    - Demand falls
    - Supply falls
    - Nothing changes
    answer: Demand rises at every price
    difficulty: 3
    hints:
    - More money to spend.
    - This shifts the whole demand curve.
    solution: 'Step 1: With more income people can afford more. Step 2: Demand for normal goods rises at every price.'
    mistakes: {"Demand falls": "s9_income_demand", "Supply falls": "s9_income_demand"}
  - prompt: If the price of coffee rises sharply, what usually happens to the demand for tea?
    options:
    - It rises
    - It falls
    - It stops completely
    - Tea becomes free
    answer: It rises
    difficulty: 2
    hints:
    - Tea and coffee can replace each other.
    - People switch to the cheaper drink.
    solution: 'Step 1: Tea and coffee are substitutes. Step 2: When coffee is dearer, people switch to tea.'
    mistakes:
      It falls: c9ss9_shift
  - prompt: Petrol prices rise a lot. What may happen to the demand for cars?
    options:
    - It falls
    - It rises
    - It doubles
    - Nothing can change it
    answer: It falls
    difficulty: 2
    hints:
    - Cars and petrol are used together.
    - Running a car becomes costlier.
    solution: 'Step 1: Cars and petrol are complements. Step 2: Dearer petrol makes owning a car less attractive.'
    mistakes:
      It rises: c9ss9_shift
  - prompt: A new machine lets a factory make shirts more cheaply. What happens to the supply of shirts?
    options:
    - It rises
    - It falls
    - It stops
    - It becomes demand
    answer: It rises
    difficulty: 2
    hints:
    - Better technology lowers costs.
    - Sellers can offer more at each price.
    solution: 'Step 1: Lower costs make producing more worthwhile. Step 2: Supply rises.'
    mistakes:
      It falls: c9ss9_seller_side
  - prompt: The demand curve slopes…
    options:
    - Downward from left to right
    - Upward from left to right
    - Straight up
    - It is a circle
    answer: Downward from left to right
    difficulty: 1
    hints:
    - Higher price, less bought.
    - Read the curve from low quantity to high quantity.
    solution: As price falls, quantity demanded rises, so the curve slopes down.
    mistakes:
      Upward from left to right: c9ss9_buyer_side
  - prompt: 'Ice-cream sellers in a town: at ₹10, they offer 100 cups; at ₹20, they offer 160 cups. How many more cups do they offer at the higher price?'
    answer: 60
    check: 160 - 100
    difficulty: 2
    hints:
    - Compare the two amounts.
    - Subtract the smaller from the larger.
    solution: 'Step 1: 160 − 100. Step 2: Sellers offer 60 more cups at ₹20.'
    mistakes:
      '100': c9ss9_read_table
  - prompt: Which of these is a market?
    options:
    - A weekly vegetable haat
    - A forest with no people
    - An empty field
    - A library
    answer: A weekly vegetable haat
    difficulty: 1
    hints:
    - Buyers and sellers must meet.
    - Goods change hands for money.
    solution: A haat is where buyers and sellers meet, so it is a market.
    mistakes:
      A library: c9ss9_buyer_side
  - prompt: A new tax raises the cost of making soap. What usually happens to soap supply?
    options:
    - It falls
    - It rises
    - It is unaffected
    - Demand becomes zero
    answer: It falls
    difficulty: 2
    hints:
    - Taxes raise sellers' costs.
    - Higher costs mean less offered at each price.
    solution: 'Step 1: Tax raises production cost. Step 2: Sellers offer less at each price.'
    mistakes:
      It rises: c9ss9_seller_side
  - prompt: Why do sellers offer more of a good when its price rises?
    options:
    - They can earn more profit
    - They feel sorry for buyers
    - Costs fall to zero
    - Buyers ask them to
    answer: They can earn more profit
    difficulty: 1
    hints:
    - What does a seller want?
    - Each unit now earns more.
    solution: A higher price makes each unit more profitable, so sellers offer more.
    mistakes:
      They feel sorry for buyers: c9ss9_seller_side
  - prompt: Students start preferring millet snacks after a health campaign. What happens to demand for millet snacks?
    options:
    - It rises at every price
    - It falls at every price
    - Supply falls
    - Nothing changes
    answer: It rises at every price
    difficulty: 3
    hints:
    - Price has not changed.
    - Tastes have.
    solution: 'Step 1: A change in tastes shifts demand. Step 2: More people want millet snacks at each price.'
    mistakes:
      Supply falls: c9ss9_shift
- code: cbse9us.price.equilibrium
  title: Market equilibrium, shortages and surpluses
  notes: |
    In a market, the price settles where the quantity buyers want equals the quantity sellers offer: the
    equilibrium price, and that quantity is the equilibrium quantity. If the price is above equilibrium,
    sellers offer more than buyers want: a surplus (excess supply), and sellers cut prices. If the price is
    below equilibrium, buyers want more than is available: a shortage (excess demand), and prices rise. Price
    thus works like a signal. When demand rises (festival season) the price rises; when supply rises (bumper
    harvest) the price falls. Governments sometimes step in: a price ceiling (maximum price, e.g. on essential
    medicines) can cause shortages; a price floor (minimum price, e.g. Minimum Support Price for wheat and rice)
    protects farmers but can create surpluses that the government buys and stores.
  explanations:
    text: 'Picture a tug of war between buyers and sellers. If the price is too high, unsold goods pile up and sellers lower it. If it''s too low, goods run out and the price goes up. It settles where the amount wanted equals the amount offered: equilibrium.'
    visual: 'Draw the falling demand line and rising supply line crossing in an X. Mark the crossing point E: the equilibrium price and quantity. Above E, shade a gap ''surplus''; below E, a gap ''shortage''.'
    step_by_step: 'Step 1: Make a table of price, quantity demanded and quantity supplied. Step 2: Find the row where they are equal: equilibrium. Step 3: Above it, supply > demand: surplus. Step 4: Below it, demand > supply: shortage.'
    real_world: 'Flower prices in Kerala shoot up just before Onam, when everyone wants flowers for pookalam: demand jumps faster than supply.'
  picture:
    kind: compare
    columns:
    - title: Price too high
      points:
      - Supply > demand
      - Surplus
      - Price falls
    - title: Equilibrium
      points:
      - Supply = demand
      - Market clears
    - title: Price too low
      points:
      - Demand > supply
      - Shortage
      - Price rises
    alt: Above the equilibrium price there is a surplus and the price falls; below it there is a shortage and the price rises; at equilibrium supply equals demand.
  activity:
    type: formula
    prompt: Change the price. Demand = 120 − 2 × price; supply = 2 × price.
    inputs:
    - name: p
      label: Price
      min: 10
      max: 50
      step: 5
      start: 10
      unit: ₹
    outputs:
    - name: d
      label: Quantity demanded
      expr: 120-2*p
    - name: s
      label: Quantity supplied
      expr: 2*p
    - name: g
      label: Demand minus supply
      expr: 120-4*p
    goals:
    - prompt: Find the equilibrium price.
      want:
        g: 0
      mistakes:
      - when:
          g:
          - 20
          - 80
        say: 'Shortage: buyers want more than sellers offer, so the price rises.'
      - when:
          g:
          - -80
          - -20
        say: 'Surplus: sellers offer more than buyers want, so the price falls.'
    - prompt: Show a surplus of 40.
      want:
        g: -40
      mistakes:
      - when:
          g:
          - 20
          - 80
        say: That's a shortage. A surplus needs a price above equilibrium.
  lesson:
    - teach: 'Put demand and supply together. At a high price, sellers offer a lot but buyers want little: a surplus, so sellers cut the price. At a low price, buyers want a lot but there is little to sell: a shortage, so the price rises. The price settles where what buyers want equals what sellers offer: the equilibrium price.'
      picture:
        kind: compare
        columns:
        - title: Price too high
          points:
          - Supply more than demand
          - Surplus
          - Price falls
        - title: Equilibrium
          points:
          - Supply equals demand
          - No pressure to change
        - title: Price too low
          points:
          - Demand more than supply
          - Shortage
          - Price rises
        alt: Too high a price gives a surplus, too low a price gives a shortage, and equilibrium is where they balance.
      check:
        prompt: At the current price, buyers want more than sellers offer. This is a…
        options:
        - Shortage
        - Surplus
        - Equilibrium
        answer: Shortage
        why: Excess demand is a shortage.
    - teach: Price works like a signal. When demand rises, say flowers before Onam, the price rises. When supply rises, say a bumper harvest, the price falls. Governments sometimes step in. A price ceiling is a highest allowed price, as on essential medicines, and can cause shortages. A price floor is a lowest allowed price, like the Minimum Support Price (MSP) for wheat and rice, which protects farmers but can leave surpluses that the government buys and stores.
      check:
        prompt: MSP for wheat is a…
        options:
        - Price floor
        - Price ceiling
        - Tax
        answer: Price floor
        why: It sets a lowest price to protect farmers.
  items:
  - prompt: At ₹30 a kg, buyers want 40 kg and sellers offer 40 kg of a vegetable. ₹30 is the…
    options:
    - Equilibrium price
    - Ceiling price
    - Shortage price
    - Surplus price
    answer: Equilibrium price
    difficulty: 1
    hints:
    - Demand equals supply.
    - The market clears.
    solution: 'Step 1: Quantity demanded = quantity supplied = 40 kg. Step 2: So ₹30 is the equilibrium price.'
    mistakes: {"Surplus price": "s9_equilibrium", "Ceiling price": "s9_equilibrium"}
  - prompt: If sellers offer more than buyers want at the current price, there is a…
    options:
    - Surplus
    - Shortage
    - Equilibrium
    - Subsidy
    answer: Surplus
    difficulty: 1
    hints:
    - Goods are left over.
    - Excess supply.
    solution: 'Step 1: Supply is greater than demand. Step 2: The extra unsold goods are a surplus.'
    mistakes:
      Shortage: equilibrium_meaning
  - prompt: At ₹50, buyers want 70 units and sellers offer 40 units. What is the shortage, in units?
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - Demand minus supply.
    - 70 − 40.
    solution: 'Step 1: Demand 70, supply 40. Step 2: Shortage = 70 − 40 = 30 units.'
    mistakes: {"110": "s9_shortage", "40": "s9_shortage"}
  - prompt: Just before Onam, the demand for flowers rises sharply. What happens to their price?
    options:
    - It rises
    - It falls
    - It stays fixed
    - It becomes zero
    answer: It rises
    difficulty: 2
    hints:
    - More buyers, same flowers.
    - A shortage pushes price up.
    solution: 'Step 1: Demand rises faster than supply. Step 2: The shortage pushes the price up.'
    mistakes: {"It falls": "s9_demand_price"}
  - prompt: The Minimum Support Price for rice is an example of a…
    options:
    - Price floor
    - Price ceiling
    - Equilibrium price
    - Tax
    answer: Price floor
    difficulty: 2
    hints:
    - Price cannot go below it.
    - Protects farmers.
    solution: 'Step 1: MSP sets a lowest price the government will pay. Step 2: A minimum price is a price floor.'
    mistakes: {"Price ceiling": "s9_msp_floor"}
  - prompt: A bumper harvest doubles the supply of potatoes while demand stays the same. What is likely?
    options:
    - Potato prices fall
    - Potato prices rise
    - Demand doubles
    - There is a shortage
    answer: Potato prices fall
    difficulty: 3
    hints:
    - More potatoes at the old price than buyers want.
    - Sellers compete by cutting prices.
    solution: 'Step 1: At the old price there is a surplus. Step 2: Sellers lower prices until buyers take the extra potatoes.'
    mistakes:
      There is a shortage: equilibrium_meaning
  - prompt: 'Use the schedule. Price ₹10: demand 80, supply 20. Price ₹20: demand 50, supply 50. Price ₹30: demand 30, supply 70. What is the equilibrium price?'
    options:
    - ₹20
    - ₹10
    - ₹30
    - ₹50
    answer: ₹20
    difficulty: 2
    hints:
    - Look for the row where two numbers match.
    - Compare demand and supply in each row.
    solution: 'Step 1: At ₹20, demand is 50 and supply is 50. Step 2: They are equal, so ₹20 is the equilibrium.'
    mistakes:
      ₹10: c9ss9_balance
  - prompt: 'Same schedule: at ₹30, demand is 30 and supply is 70. How big is the surplus, in units?'
    answer: 40
    check: 70 - 30
    difficulty: 2
    hints:
    - Surplus means supply is more than demand.
    - Subtract demand from supply.
    solution: 'Step 1: 70 − 30. Step 2: The surplus is 40 units.'
    mistakes:
      '30': c9ss9_read_table
      '70': c9ss9_read_table
  - prompt: There is a shortage of a toy. What usually happens to its price?
    options:
    - It rises
    - It falls
    - It stays at zero
    - It becomes equilibrium immediately at a lower price
    answer: It rises
    difficulty: 1
    hints:
    - Many buyers want too few toys.
    - Sellers can charge more.
    solution: When buyers compete for too few goods, the price goes up.
    mistakes:
      It falls: c9ss9_read_table
  - prompt: The government sets a maximum price for an essential medicine below the market price. What can happen?
    options:
    - A shortage of the medicine
    - A surplus of the medicine
    - The medicine becomes free
    - Nothing at all
    answer: A shortage of the medicine
    difficulty: 3
    hints:
    - Is this a ceiling or a floor?
    - At a lower price, buyers want more and sellers offer less.
    solution: 'Step 1: A maximum price below equilibrium is a ceiling. Step 2: Demand exceeds supply, so there is a shortage.'
    mistakes:
      A surplus of the medicine: c9ss9_govt_price
  - prompt: What can happen when the MSP for wheat is set above the market price?
    options:
    - A surplus that the government buys and stores
    - A shortage of wheat
    - Wheat disappears
    - Farmers stop growing wheat
    answer: A surplus that the government buys and stores
    difficulty: 3
    hints:
    - A price floor above equilibrium.
    - Farmers offer more than buyers want.
    solution: 'Step 1: A higher fixed price raises supply and lowers demand. Step 2: The extra wheat is bought and stored by the government.'
    mistakes:
      A shortage of wheat: c9ss9_govt_price
  - prompt: The price at which quantity demanded equals quantity supplied is called the…
    options:
    - Equilibrium price
    - Maximum price
    - Cost price
    - Ceiling price
    answer: Equilibrium price
    difficulty: 1
    hints:
    - Equi means equal.
    - The market balances here.
    solution: Where demand equals supply, the price is the equilibrium price.
    mistakes:
      Ceiling price: c9ss9_govt_price
  - prompt: A cyclone damages coconut trees in Kerala, but demand for coconuts stays the same. What happens to coconut prices?
    options:
    - They rise
    - They fall
    - They stay the same
    - They become zero
    answer: They rise
    difficulty: 2
    hints:
    - 'Which side changed: buyers or sellers?'
    - Less to sell, same buyers.
    solution: 'Step 1: Supply falls. Step 2: With the same demand, a shortage pushes the price up.'
    mistakes:
      They fall: c9ss9_shift
  - prompt: At ₹15, buyers want 60 notebooks but shops have only 35. What is the shortage, in notebooks?
    answer: 25
    check: 60 - 35
    difficulty: 2
    hints:
    - Shortage is demand minus supply.
    - Subtract.
    solution: 'Step 1: 60 − 35. Step 2: The shortage is 25 notebooks.'
    mistakes:
      '35': c9ss9_read_table
      '60': c9ss9_read_table
  - prompt: Why is price called a 'signal' in a market?
    options:
    - It tells buyers and sellers when goods are scarce or plentiful
    - It is printed in red
    - It never changes
    - It is set by a traffic police officer
    answer: It tells buyers and sellers when goods are scarce or plentiful
    difficulty: 3
    hints:
    - What does a rising price tell sellers?
    - What does it tell buyers?
    solution: 'Step 1: Rising prices tell sellers to supply more and buyers to buy less. Step 2: Falling prices do the opposite.'
    mistakes:
      It never changes: c9ss9_balance
