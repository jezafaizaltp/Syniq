# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 9. Format: content/README.md.
subject: cbse9-ss
chapter: 9
title: 'The Price Puzzle: What Drives the Market'
tips:
  law_of_demand: When price rises, quantity demanded falls; when price falls, quantity demanded rises (other things staying the same).
  law_of_supply: When price rises, sellers offer more; when price falls, they offer less.
  equilibrium_meaning: Equilibrium is the price where quantity demanded equals quantity supplied; above it there is a surplus, below it a shortage.
concepts:
- code: cbse9us.price.demand_supply
  title: Demand and supply
  notes: |
    A market is any place or system where buyers and sellers meet: a weekly haat, a mall or an online shop.
    Demand is the quantity of a good buyers are willing and able to buy at different prices. The law of demand:
    other things being equal, when the price rises the quantity demanded falls, and when the price falls it
    rises. Demand also changes with income, tastes, prices of related goods (substitutes like tea and coffee,
    complements like pens and ink) and expectations. Supply is the quantity sellers are willing to offer at
    different prices. The law of supply: as price rises, quantity supplied rises. Supply also changes with
    costs of inputs, technology, weather (for crops), number of sellers and taxes. Demand and supply are
    shown as schedules (tables) and curves: the demand curve slopes down, the supply curve slopes up.
  explanations:
    text: 'When mangoes are cheap, people buy more; when they''re expensive, people buy fewer. That''s demand. Sellers act the other way: when prices are high, they bring more mangoes to market. That''s supply.'
    visual: Draw a graph with price up the side and quantity along the bottom. A line falling from top-left to bottom-right is demand; a line rising from bottom-left to top-right is supply.
    step_by_step: 'Step 1: Is the question about buyers (demand) or sellers (supply)? Step 2: Price up → buyers buy less, sellers sell more. Step 3: Price down → buyers buy more, sellers sell less. Step 4: Other changes (income, weather, costs) shift the whole curve.'
    real_world: After a heavy rain damages tomato crops, supply drops, so tomato prices in Kerala markets can jump within days.
  picture:
    kind: bars
    bars:
    - label: ₹20/kg
      value: 50
    - label: ₹40/kg
      value: 30
    - label: ₹60/kg
      value: 15
    caption: Kilograms of mangoes bought at each price
    alt: 'A demand schedule: at ₹20 a kg buyers take 50 kg, at ₹40 they take 30 kg, at ₹60 only 15 kg.'
  activity:
    type: sort
    prompt: Does demand or supply change, and which way?
    bins:
    - Demand rises
    - Demand falls
    - Supply rises
    - Supply falls
    items:
    - label: Price of tea falls (for tea)
      bin: Demand rises
      clue: Law of demand.
      why: Lower price, more demanded.
    - label: Coffee gets cheaper (demand for tea)
      bin: Demand falls
      clue: Substitute goods.
      why: People switch to coffee.
    - label: A bumper mango harvest
      bin: Supply rises
      clue: Weather.
      why: More mangoes to sell.
    - label: Fuel price rises for bus companies
      bin: Supply falls
      clue: Input costs.
      why: Costlier inputs, less supply.
    - label: Incomes rise in a town
      bin: Demand rises
      clue: More to spend.
      why: Demand rises.
  items:
  - prompt: According to the law of demand, if the price of bananas rises, the quantity demanded will…
    options:
    - Fall
    - Rise
    - Stay the same
    - Become zero at once
    answer: Fall
    difficulty: 1
    hints:
    - People buy less of costlier things.
    - Other things being equal.
    solution: 'Step 1: Higher price makes the good less attractive. Step 2: Quantity demanded falls.'
    mistakes:
      Rise: law_of_demand
  - prompt: If the price of a good rises, what do sellers usually do?
    options:
    - Offer more for sale
    - Offer less for sale
    - Stop selling
    - Lower the price
    answer: Offer more for sale
    difficulty: 1
    hints:
    - Higher price, higher earnings.
    - Law of supply.
    solution: 'Step 1: Higher prices mean more profit per unit. Step 2: Sellers supply more.'
    mistakes:
      Offer less for sale: law_of_supply
  - prompt: Tea and coffee are examples of…
    options:
    - Substitutes
    - Complements
    - Free goods
    - Capital goods
    answer: Substitutes
    difficulty: 1
    hints:
    - One can replace the other.
    - Pens and ink go together; these don't.
    solution: 'Step 1: People can drink one instead of the other. Step 2: So they are substitutes.'
  - prompt: 'Using the schedule: mangoes at ₹20/kg sell 50 kg and at ₹40/kg sell 30 kg. By how many kg does demand fall when price rises from ₹20 to ₹40?'
    answer: '20'
    check: '20'
    difficulty: 2
    hints:
    - Subtract the quantities.
    - 50 − 30.
    solution: 'Step 1: Quantity at ₹20 is 50 kg, at ₹40 is 30 kg. Step 2: 50 − 30 = 20 kg.'
  - prompt: Floods destroy onion crops. What happens to the supply of onions?
    options:
    - It falls
    - It rises
    - It doesn't change
    - Demand falls instead
    answer: It falls
    difficulty: 2
    hints:
    - Fewer onions to sell.
    - Weather affects crop supply.
    solution: 'Step 1: Crops are damaged. Step 2: Less is available to sell, so supply falls.'
  - prompt: Families' incomes rise. What usually happens to the demand for most goods like clothes?
    options:
    - Demand rises at every price
    - Demand falls
    - Supply falls
    - Nothing changes
    answer: Demand rises at every price
    difficulty: 3
    hints:
    - More money to spend.
    - This shifts the whole demand curve.
    solution: 'Step 1: With more income people can afford more. Step 2: Demand for normal goods rises at every price.'
- code: cbse9us.price.equilibrium
  title: Market equilibrium, shortages and surpluses
  notes: |
    In a market, the price settles where the quantity buyers want equals the quantity sellers offer: the
    equilibrium price, and that quantity is the equilibrium quantity. If the price is above equilibrium,
    sellers offer more than buyers want: a surplus (excess supply), and sellers cut prices. If the price is
    below equilibrium, buyers want more than is available: a shortage (excess demand), and prices rise. Price
    thus works like a signal. When demand rises (festival season) the price rises; when supply rises (bumper
    harvest) the price falls. Governments sometimes step in: a price ceiling (maximum price, e.g. on essential
    medicines) can cause shortages; a price floor (minimum price, e.g. Minimum Support Price for wheat and rice)
    protects farmers but can create surpluses that the government buys and stores.
  explanations:
    text: 'Picture a tug of war between buyers and sellers. If the price is too high, unsold goods pile up and sellers lower it. If it''s too low, goods run out and the price goes up. It settles where the amount wanted equals the amount offered: equilibrium.'
    visual: 'Draw the falling demand line and rising supply line crossing in an X. Mark the crossing point E: the equilibrium price and quantity. Above E, shade a gap ''surplus''; below E, a gap ''shortage''.'
    step_by_step: 'Step 1: Make a table of price, quantity demanded and quantity supplied. Step 2: Find the row where they are equal: equilibrium. Step 3: Above it, supply > demand: surplus. Step 4: Below it, demand > supply: shortage.'
    real_world: 'Flower prices in Kerala shoot up just before Onam, when everyone wants flowers for pookalam: demand jumps faster than supply.'
  picture:
    kind: compare
    columns:
    - title: Price too high
      points:
      - Supply > demand
      - Surplus
      - Price falls
    - title: Equilibrium
      points:
      - Supply = demand
      - Market clears
    - title: Price too low
      points:
      - Demand > supply
      - Shortage
      - Price rises
    alt: Above the equilibrium price there is a surplus and the price falls; below it there is a shortage and the price rises; at equilibrium supply equals demand.
  activity:
    type: formula
    prompt: Change the price. Demand = 120 − 2 × price; supply = 2 × price.
    inputs:
    - name: p
      label: Price
      min: 10
      max: 50
      step: 5
      start: 10
      unit: ₹
    outputs:
    - name: d
      label: Quantity demanded
      expr: 120-2*p
    - name: s
      label: Quantity supplied
      expr: 2*p
    - name: g
      label: Demand minus supply
      expr: 120-4*p
    goals:
    - prompt: Find the equilibrium price.
      want:
        g: 0
      mistakes:
      - when:
          g:
          - 20
          - 80
        say: 'Shortage: buyers want more than sellers offer, so the price rises.'
      - when:
          g:
          - -80
          - -20
        say: 'Surplus: sellers offer more than buyers want, so the price falls.'
    - prompt: Show a surplus of 40.
      want:
        g: -40
      mistakes:
      - when:
          g:
          - 20
          - 80
        say: That's a shortage. A surplus needs a price above equilibrium.
  items:
  - prompt: At ₹30 a kg, buyers want 40 kg and sellers offer 40 kg of a vegetable. ₹30 is the…
    options:
    - Equilibrium price
    - Ceiling price
    - Shortage price
    - Surplus price
    answer: Equilibrium price
    difficulty: 1
    hints:
    - Demand equals supply.
    - The market clears.
    solution: 'Step 1: Quantity demanded = quantity supplied = 40 kg. Step 2: So ₹30 is the equilibrium price.'
  - prompt: If sellers offer more than buyers want at the current price, there is a…
    options:
    - Surplus
    - Shortage
    - Equilibrium
    - Subsidy
    answer: Surplus
    difficulty: 1
    hints:
    - Goods are left over.
    - Excess supply.
    solution: 'Step 1: Supply is greater than demand. Step 2: The extra unsold goods are a surplus.'
    mistakes:
      Shortage: equilibrium_meaning
  - prompt: At ₹50, buyers want 70 units and sellers offer 40 units. What is the shortage, in units?
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - Demand minus supply.
    - 70 − 40.
    solution: 'Step 1: Demand 70, supply 40. Step 2: Shortage = 70 − 40 = 30 units.'
  - prompt: Just before Onam, the demand for flowers rises sharply. What happens to their price?
    options:
    - It rises
    - It falls
    - It stays fixed
    - It becomes zero
    answer: It rises
    difficulty: 2
    hints:
    - More buyers, same flowers.
    - A shortage pushes price up.
    solution: 'Step 1: Demand rises faster than supply. Step 2: The shortage pushes the price up.'
  - prompt: The Minimum Support Price for rice is an example of a…
    options:
    - Price floor
    - Price ceiling
    - Equilibrium price
    - Tax
    answer: Price floor
    difficulty: 2
    hints:
    - Price cannot go below it.
    - Protects farmers.
    solution: 'Step 1: MSP sets a lowest price the government will pay. Step 2: A minimum price is a price floor.'
  - prompt: A bumper harvest doubles the supply of potatoes while demand stays the same. What is likely?
    options:
    - Potato prices fall
    - Potato prices rise
    - Demand doubles
    - There is a shortage
    answer: Potato prices fall
    difficulty: 3
    hints:
    - More potatoes at the old price than buyers want.
    - Sellers compete by cutting prices.
    solution: 'Step 1: At the old price there is a surplus. Step 2: Sellers lower prices until buyers take the extra potatoes.'
    mistakes:
      There is a shortage: equilibrium_meaning
