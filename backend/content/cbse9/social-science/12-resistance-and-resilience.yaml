# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 12. Format: content/README.md.
subject: cbse9-ss
chapter: 12
title: Resistance and Resilience (1000–1700 CE)
tips:
  resistance_resilience: Resistance is actively opposing a threat (battles, revolts); resilience is surviving and adapting while keeping one's way of life (faith, temples, trade, language).
  battle_dates: Kasahrada 1178 (Naiki Devi), Haldighati 1576 (Maharana Pratap), Talikota 1565 (Vijayanagara), Saraighat 1671 (Lachit Borphukan).
concepts:
- code: cbse9us.resist.struggles
  title: Kingdoms and leaders who resisted, 1000–1700 CE
  notes: |
    Between about 1000 and 1700 CE, India faced invasions and the rise of the Delhi Sultanate (from 1206)
    and later the Mughal empire. Many rulers and communities resisted. Queen Naiki Devi of the Chaulukya
    kingdom defeated Muhammad Ghuri at Kasahrada (1178). Maharana Pratap of Mewar fought the Mughals at
    Haldighati (1576) and then used guerrilla warfare in the Aravallis, winning back much of Mewar after the
    battle of Dewair (1582). The Vijayanagara empire, founded by Harihara and Bukka in 1336 near Hampi,
    protected the south for over two centuries until its defeat at Talikota (1565). The Ahoms of Assam
    (1228–1826) used rivers, forests and the paik system; Lachit Borphukan defeated the Mughal fleet at
    Saraighat (1671). Chhatrapati Shivaji built a Maratha state with hill forts such as Raigad and Sinhagad,
    was crowned in 1674 and spoke of swarajya (self-rule). The Sikh Gurus resisted oppression: Guru Tegh
    Bahadur was executed in 1675 and Guru Gobind Singh founded the Khalsa in 1699. The Jats of the
    Ganga–Yamuna Doab, led by Gokul, rose in 1669.
  explanations:
    text: 'For seven centuries many Indian rulers and communities fought to protect their land and way of life. They used their knowledge of hills, forests and rivers to fight bigger armies: Maharana Pratap in the Aravallis, Shivaji from his hill forts, and Lachit Borphukan on the Brahmaputra.'
    visual: 'Draw a map of India with symbols: a sword at Haldighati (Rajasthan), a fort at Raigad (Maharashtra), boats at Saraighat (Assam), and a temple city at Hampi (Karnataka).'
    step_by_step: 'Step 1: Find the region. Step 2: Name the leader or kingdom. Step 3: Recall the battle and date. Step 4: Note how terrain helped: hills, forests or rivers.'
    real_world: The National Defence Academy gives its best cadet the Lachit Borphukan gold medal, honouring the Ahom general's victory at Saraighat.
  picture:
    kind: flow
    steps:
    - '1178 Kasahrada: Naiki Devi'
    - 1336 Vijayanagara founded
    - '1576 Haldighati: Maharana Pratap'
    - '1671 Saraighat: Lachit Borphukan'
    - 1674 Shivaji crowned
    - 1699 Khalsa founded
    alt: 'A timeline of resistance from 1178 to 1699: Kasahrada, the founding of Vijayanagara, Haldighati, Saraighat, Shivaji''s coronation and the founding of the Khalsa.'
  activity:
    type: order
    prompt: Put the acts of resistance in order.
    steps:
    - Naiki Devi defeats Muhammad Ghuri (1178)
    - Vijayanagara founded (1336)
    - Battle of Haldighati (1576)
    - Lachit Borphukan wins at Saraighat (1671)
    - Shivaji crowned (1674)
    - Guru Gobind Singh founds the Khalsa (1699)
    reasons:
      Vijayanagara founded (1336): Vijayanagara came about 150 years after Kasahrada.
      Battle of Haldighati (1576): Maharana Pratap fought the Mughals in the 16th century.
      Lachit Borphukan wins at Saraighat (1671): The Ahom victory came a century after Haldighati.
      Shivaji crowned (1674): Shivaji's coronation came three years after Saraighat.
      Guru Gobind Singh founds the Khalsa (1699): The Khalsa came at the end of the century.
  items:
  - prompt: Who defeated the Mughal navy at the battle of Saraighat in 1671?
    options:
    - Lachit Borphukan
    - Maharana Pratap
    - Shivaji
    - Krishnadeva Raya
    answer: Lachit Borphukan
    difficulty: 1
    hints:
    - An Ahom general.
    - On the Brahmaputra in Assam.
    solution: 'Step 1: Saraighat is on the Brahmaputra near Guwahati. Step 2: The Ahom general Lachit Borphukan won it.'
  - prompt: The Vijayanagara empire was founded in 1336 by…
    options:
    - Harihara and Bukka
    - Bimbisara and Ajatashatru
    - Shivaji and Sambhaji
    - Babur and Humayun
    answer: Harihara and Bukka
    difficulty: 1
    hints:
    - Two brothers.
    - Capital near Hampi.
    solution: 'Step 1: Vijayanagara was founded by two brothers. Step 2: They were Harihara and Bukka.'
  - prompt: In which year was the Khalsa founded by Guru Gobind Singh?
    answer: '1699'
    check: '1699'
    difficulty: 1
    hints:
    - End of the 17th century.
    - At Anandpur Sahib.
    solution: 'Step 1: Guru Gobind Singh created the Khalsa on Baisakhi day. Step 2: The year was 1699.'
  - prompt: After Haldighati, how did Maharana Pratap continue to resist the Mughals?
    options:
    - Guerrilla warfare from the Aravalli hills
    - He surrendered his kingdom
    - He built a navy
    - He moved to Assam
    answer: Guerrilla warfare from the Aravalli hills
    difficulty: 2
    hints:
    - He used the terrain.
    - Small surprise attacks.
    solution: 'Step 1: Open battle against a larger army was costly. Step 2: He used the hills for surprise guerrilla attacks and later regained much of Mewar.'
    mistakes:
      He surrendered his kingdom: resistance_resilience
  - prompt: What did Shivaji mean by swarajya?
    options:
    - Self-rule
    - Foreign rule
    - Rule by priests
    - Trade with Europe
    answer: Self-rule
    difficulty: 2
    hints:
    - Swa = own, rajya = rule.
    - The Maratha state.
    solution: 'Step 1: Swa means own. Step 2: Swarajya means one''s own rule, self-rule.'
  - prompt: Which battle ended Vijayanagara's power in 1565?
    options:
    - Talikota
    - Haldighati
    - Saraighat
    - Kasahrada
    answer: Talikota
    difficulty: 2
    hints:
    - An alliance of Deccan sultanates.
    - Hampi was sacked afterwards.
    solution: 'Step 1: In 1565 the Deccan sultanates allied against Vijayanagara. Step 2: They won at Talikota.'
    mistakes:
      Haldighati: battle_dates
- code: cbse9us.resist.resilience
  title: Resilience through faith, temples and trade
  notes: |
    Alongside battles, society survived and adapted: resilience. The Bhakti movement spread devotion through
    nam kirtan (singing God's name) and community sankirtana in local languages such as Marathi, Awadhi,
    Telugu, Bengali and Tamil, so faith did not depend on any one place or ruler; Chaitanya Mahaprabhu led
    public sankirtana in Bengal. Some sects, like the Dadu Panth, kept warrior ascetics who protected
    pilgrims and trade routes. Temples were social and economic centres: they managed land grants, gave
    loans, employed artisans, kept music and dance (such as Bharatanatyam) alive and settled disputes. Where
    temples were at risk, the haveli style (temples in house-like buildings) developed. The economy kept
    growing: farming expanded with the Persian wheel for irrigation, and inland and Indian Ocean trade
    flourished. Merchants used the hundi (a bill of exchange, like a cheque) and sarrafs (money changers and
    bankers) and gumashtas (agents) kept trade moving across long distances.
  explanations:
    text: 'Resistance is fighting back; resilience is bending without breaking. Even when rulers changed, ordinary people kept their culture alive: singing bhajans in their own languages, gathering at temples that also acted as banks and schools of art, and trading with clever tools like the hundi.'
    visual: 'Draw two columns: ''Resistance'' with a sword and a fort; ''Resilience'' with singers in a sankirtana, a temple with artisans, and a merchant handing over a hundi paper.'
    step_by_step: 'Step 1: Is it fighting a threat? → resistance. Step 2: Is it surviving and adapting while keeping traditions? → resilience. Step 3: Find the tool: Bhakti songs, temples, trade instruments like the hundi.'
    real_world: Bhakti poems by saints such as Tukaram and Meera are still sung today, centuries later, showing how the tradition outlasted empires.
  picture:
    kind: compare
    columns:
    - title: Resistance
      points:
      - Battles and revolts
      - Hill forts, guerrilla war
    - title: Resilience
      points:
      - Bhakti in local languages
      - Temples as centres
      - Trade with hundis
    alt: Resistance means battles and guerrilla war; resilience means keeping culture alive through Bhakti, temples and trade.
  activity:
    type: sort
    prompt: How did society stay strong?
    bins:
    - Faith
    - Temples
    - Trade
    items:
    - label: Nam kirtan in local languages
      bin: Faith
      clue: Singing God's name.
      why: Bhakti.
    - label: Chaitanya's public sankirtana
      bin: Faith
      clue: In Bengal.
      why: Bhakti.
    - label: Managing land grants and giving loans
      bin: Temples
      clue: Social and economic centres.
      why: Temples.
    - label: Keeping Bharatanatyam alive
      bin: Temples
      clue: Music and dance.
      why: Temples.
    - label: Hundi, a bill of exchange
      bin: Trade
      clue: Like a cheque.
      why: Trade.
    - label: Sarrafs and gumashtas
      bin: Trade
      clue: Bankers and agents.
      why: Trade.
  items:
  - prompt: What is a hundi?
    options:
    - A bill of exchange used by merchants
    - A type of temple
    - A weapon
    - A musical instrument
    answer: A bill of exchange used by merchants
    difficulty: 1
    hints:
    - Like a cheque.
    - Used to send money over long distances.
    solution: 'Step 1: Merchants needed to move money safely. Step 2: The hundi was a paper bill of exchange.'
  - prompt: The Persian wheel was used for…
    options:
    - Lifting water for irrigation
    - Making pottery
    - Spinning cotton
    - Grinding grain
    answer: Lifting water for irrigation
    difficulty: 1
    hints:
    - Farming expanded with it.
    - Wells.
    solution: 'Step 1: It is a wheel with pots that lifts water from wells. Step 2: It helped irrigate fields.'
  - prompt: How did the Bhakti saints spread devotion widely?
    options:
    - By singing in local languages that ordinary people spoke
    - By writing only in Persian
    - By keeping it secret
    - By banning music
    answer: By singing in local languages that ordinary people spoke
    difficulty: 1
    hints:
    - Marathi, Awadhi, Telugu, Bengali.
    - Nam kirtan.
    solution: 'Step 1: The saints composed songs in everyday languages. Step 2: So everyone could take part.'
  - prompt: Which of these is an example of resilience rather than resistance?
    options:
    - Keeping temple arts like Bharatanatyam alive
    - Fighting at Haldighati
    - Defending a hill fort
    - A rebellion against a governor
    answer: Keeping temple arts like Bharatanatyam alive
    difficulty: 2
    hints:
    - Not a fight.
    - Preserving culture.
    solution: 'Step 1: Battles and revolts are resistance. Step 2: Preserving arts and traditions through hard times is resilience.'
    mistakes:
      Fighting at Haldighati: resistance_resilience
      Defending a hill fort: resistance_resilience
  - prompt: Besides worship, what role did temples play in society?
    options:
    - They managed land, gave loans and employed artisans
    - They were only for kings
    - They had no economic role
    - They were army barracks
    answer: They managed land, gave loans and employed artisans
    difficulty: 2
    hints:
    - Land grants.
    - Many workers.
    solution: 'Step 1: Temples received land grants and donations. Step 2: They lent money, employed many artisans and supported arts.'
  - prompt: Why did some communities build temples in the 'haveli' style?
    options:
    - To protect them by making them look like houses
    - Because stone was banned
    - To attract foreign traders
    - Because kings lived in them
    answer: To protect them by making them look like houses
    difficulty: 3
    hints:
    - Haveli means a mansion.
    - Avoiding destruction.
    solution: 'Step 1: Large temples were at risk. Step 2: House-like haveli temples drew less attention and survived.'
