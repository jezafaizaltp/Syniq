    - Rule by priests
    - Trade with Europe
    answer: Self-rule
    difficulty: 2
    hints:
    - Swa = own, rajya = rule.
    - The Maratha state.
    solution: 'Step 1: Swa means own. Step 2: Swarajya means one''s own rule, self-rule.'
    mistakes: {"Foreign rule": "s9_swarajya"}
  - prompt: Which battle ended Vijayanagara's power in 1565?
    options:
    - Talikota
