# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 12. Format: content/README.md.
subject: cbse9-ss
chapter: 12
title: Resistance and Resilience (1000–1700 CE)
tips:
  resistance_resilience: Resistance is actively opposing a threat (battles, revolts); resilience is surviving and adapting while keeping one's way of life (faith, temples, trade, language).
  battle_dates: "Vijayanagara fell after a battle in 1565 against the Deccan sultanates, named after a village on the Krishna. Haldighati (1576) was a Mughal–Mewar battle."
  s9_bhakti_language: "Bhakti saints wanted ordinary people to understand. Which language would those people know?"
  s9_harihara: "Vijayanagara was a southern empire founded by two brothers in 1336."
  s9_haveli: "A haveli is a large house. Why would a temple want to look like one?"
  s9_hundi: "Merchants needed to move money safely over long distances. A hundi was a paper for that."
  s9_khalsa: "The Khalsa was founded at Anandpur on Baisakhi, near the end of the 17th century (the 1600s)."
  s9_lachit: "Saraighat is in Assam. Which Ahom general fought there?"
  s9_persian_wheel: "The Persian wheel was turned by animals to bring something up from a well."
  s9_swarajya: "'Swa' means own and 'rajya' means rule."
  s9_temple_economy: "Temples owned land and had wealth. What could they do with it besides worship?"
  c9ss12_place_leader: Match the leader to their region. Mewar is in Rajasthan, Vijayanagara in the south, the Ahoms in Assam, the Marathas in the western hills.
  c9ss12_rajput: He was a Rajput ruler who fought at Haldighati in Rajasthan. Which kingdom in that region, with Chittor as an old capital, fits?
  c9ss12_timeline: Put the events in order on a timeline from 1000 to 1700 CE. Which came early, and which near the end?
  c9ss12_how_fought: Think about the land they fought in. Hills, rivers and forests let smaller forces beat bigger armies.
  c9ss12_resist_or_adapt: Resistance means fighting back. Resilience means surviving and carrying on, through faith, art, work and trade. Which is this?
  c9ss12_trade_tool: Think about how a merchant could move money across India without carrying heavy coins.
  c9ss12_temple_role: Temples were more than places of prayer. Think about land, money, work and the arts.
concepts:
- code: cbse9us.resist.struggles
  title: Kingdoms and leaders who resisted, 1000–1700 CE
  notes: |
    Between about 1000 and 1700 CE, India faced invasions and the rise of the Delhi Sultanate (from 1206)
    and later the Mughal empire. Many rulers and communities resisted. Queen Naiki Devi of the Chaulukya
    kingdom defeated Muhammad Ghuri at Kasahrada (1178). Maharana Pratap of Mewar fought the Mughals at
    Haldighati (1576) and then used guerrilla warfare in the Aravallis, winning back much of Mewar after the
    battle of Dewair (1582). The Vijayanagara empire, founded by Harihara and Bukka in 1336 near Hampi,
    protected the south for over two centuries until its defeat at Talikota (1565). The Ahoms of Assam
    (1228–1826) used rivers, forests and the paik system; Lachit Borphukan defeated the Mughal fleet at
    Saraighat (1671). Chhatrapati Shivaji built a Maratha state with hill forts such as Raigad and Sinhagad,
    was crowned in 1674 and spoke of swarajya (self-rule). The Sikh Gurus resisted oppression: Guru Tegh
    Bahadur was executed in 1675 and Guru Gobind Singh founded the Khalsa in 1699. The Jats of the
    Ganga–Yamuna Doab, led by Gokul, rose in 1669.
  explanations:
    text: 'For seven centuries many Indian rulers and communities fought to protect their land and way of life. They used their knowledge of hills, forests and rivers to fight bigger armies: Maharana Pratap in the Aravallis, Shivaji from his hill forts, and Lachit Borphukan on the Brahmaputra.'
    visual: 'Draw a map of India with symbols: a sword at Haldighati (Rajasthan), a fort at Raigad (Maharashtra), boats at Saraighat (Assam), and a temple city at Hampi (Karnataka).'
    step_by_step: 'Step 1: Find the region. Step 2: Name the leader or kingdom. Step 3: Recall the battle and date. Step 4: Note how terrain helped: hills, forests or rivers.'
    real_world: The National Defence Academy gives its best cadet the Lachit Borphukan gold medal, honouring the Ahom general's victory at Saraighat.
  picture:
    kind: flow
    steps:
    - '1178 Kasahrada: Naiki Devi'
    - 1336 Vijayanagara founded
    - '1576 Haldighati: Maharana Pratap'
    - '1671 Saraighat: Lachit Borphukan'
    - 1674 Shivaji crowned
    - 1699 Khalsa founded
    alt: 'A timeline of resistance from 1178 to 1699: Kasahrada, the founding of Vijayanagara, Haldighati, Saraighat, Shivaji''s coronation and the founding of the Khalsa.'
  activity:
    type: order
    prompt: Put the acts of resistance in order.
    steps:
    - Naiki Devi defeats Muhammad Ghuri (1178)
    - Vijayanagara founded (1336)
    - Battle of Haldighati (1576)
    - Lachit Borphukan wins at Saraighat (1671)
    - Shivaji crowned (1674)
    - Guru Gobind Singh founds the Khalsa (1699)
    reasons:
      Vijayanagara founded (1336): Vijayanagara came about 150 years after Kasahrada.
      Battle of Haldighati (1576): Maharana Pratap fought the Mughals in the 16th century.
      Lachit Borphukan wins at Saraighat (1671): The Ahom victory came a century after Haldighati.
      Shivaji crowned (1674): Shivaji's coronation came three years after Saraighat.
      Guru Gobind Singh founds the Khalsa (1699): The Khalsa came at the end of the century.
  lesson:
    - teach: Between about 1000 and 1700 CE, India saw invasions, the Delhi Sultanate (from 1206) and later the Mughal empire. Many rulers and peoples resisted. Queen Naiki Devi of the Chaulukyas defeated Muhammad Ghuri at Kasahrada in 1178. Maharana Pratap of Mewar fought the Mughals at Haldighati in 1576, then used guerrilla warfare from the Aravalli hills and won back much of Mewar after the battle of Dewair in 1582.
      check:
        prompt: How did Maharana Pratap fight after Haldighati?
        options:
        - Guerrilla warfare from the hills
        - He gave up at once
        - With a navy
        answer: Guerrilla warfare from the hills
        why: Small, fast attacks from the Aravallis wore down a bigger army.
    - teach: In the south, Harihara and Bukka founded the Vijayanagara empire in 1336 near Hampi; it protected the south for over two centuries until its defeat at Talikota in 1565. In Assam the Ahoms (1228–1826) used rivers, forests and the paik system of militia service; Lachit Borphukan defeated the Mughal fleet at Saraighat in 1671.
      picture:
        kind: flow
        steps:
        - 1178 Kasahrada
        - 1336 Vijayanagara founded
        - 1565 Talikota
        - 1576 Haldighati
        - 1671 Saraighat
        - 1674 Shivaji crowned
        - 1699 Khalsa
        alt: Timeline of resistance from Kasahrada in 1178 to the founding of the Khalsa in 1699.
      check:
        prompt: Where did Lachit Borphukan defeat the Mughal fleet?
        options:
        - Saraighat
        - Haldighati
        - Talikota
        answer: Saraighat
        why: A river battle on the Brahmaputra near Guwahati, 1671.
    - teach: 'Chhatrapati Shivaji built a Maratha state using hill forts like Raigad and Sinhagad, was crowned in 1674, and spoke of swarajya, self-rule. The Sikh Gurus resisted oppression: Guru Tegh Bahadur was executed in 1675, and Guru Gobind Singh founded the Khalsa in 1699. The Jats of the Ganga–Yamuna Doab, led by Gokul, rose in 1669.'
      check:
        prompt: In which year was Shivaji crowned?
        options:
        - '1674'
        - '1576'
        - '1336'
        answer: '1674'
        why: His coronation at Raigad was in 1674.
  items:
  - prompt: Who defeated the Mughal navy at the battle of Saraighat in 1671?
    options:
    - Lachit Borphukan
    - Maharana Pratap
    - Shivaji
    - Krishnadeva Raya
    answer: Lachit Borphukan
    difficulty: 1
    hints:
    - An Ahom general.
    - On the Brahmaputra in Assam.
    solution: 'Step 1: Saraighat is on the Brahmaputra near Guwahati. Step 2: The Ahom general Lachit Borphukan won it.'
    mistakes: {"Shivaji": "s9_lachit"}
  - prompt: The Vijayanagara empire was founded in 1336 by…
