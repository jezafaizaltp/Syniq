    solution: 'Step 1: Rivers cut narrow V-valleys. Step 2: Glaciers scrape wide U-shaped valleys.'
    mistakes: {"A river": "s9_glacier_valley"}
  - prompt: A fan-shaped landform at a river's mouth made of deposited silt is a…
