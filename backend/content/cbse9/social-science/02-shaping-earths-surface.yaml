    mistakes:
      Volcanoes: endo_exo
  - prompt: Which of these is an exogenic process?
    options:
    - Erosion by a river
    - A volcanic eruption
    - An earthquake
    - Folding of rocks
    answer: Erosion by a river
    difficulty: 1
    hints:
    - Exo- means outside.
    - It works on the surface.
    solution: 'River erosion acts on the surface: exogenic.'
    mistakes:
      A volcanic eruption: endo_exo
  - prompt: Sand dunes are made mainly by…
    options:
    - Wind
    - Glaciers
    - Sea waves
    - Earthquakes
    answer: Wind
    difficulty: 1
    hints:
    - They are found in deserts.
    - Sand is blown into piles.
    solution: Wind carries sand and piles it into dunes.
    mistakes:
      Glaciers: c9ss2_agent_landform
  - prompt: Sea caves and cliffs are made by…
    options:
    - Sea waves
    - Wind
    - Glaciers
    - Rivers
    answer: Sea waves
    difficulty: 1
    hints:
    - Found along coasts.
    - Water crashing on rocks.
    solution: Waves erode the coast into cliffs and caves.
    mistakes:
      Rivers: c9ss2_agent_landform
  - prompt: A river valley in the mountains is narrow and deep. What shape is it?
    options:
    - V-shaped
    - U-shaped
