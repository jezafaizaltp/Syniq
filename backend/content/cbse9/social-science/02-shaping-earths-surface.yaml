# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 2. Format: content/README.md.
subject: cbse9-ss
chapter: 2
title: Shaping of the Earth's Surface
tips:
  earth_layers_order: "From outside in: the thin rocky skin we live on, the thick mantle, then a liquid layer and a solid centre. Which is thinnest, which is liquid?"
  endo_exo: "Endo- means inside and exo- means outside. Is the force coming from deep inside the Earth or acting on its surface, like wind and rivers?"
  plate_boundary: Plates moving together collide (fold mountains, trenches), moving apart make ridges and rift valleys, sliding past cause earthquakes.
  s9_delta: "A meander is a bend in the river's middle course. Which landform forms where the river meets the sea and drops its silt?"
  s9_glacier_valley: "A river cuts a narrow V. Which slow, heavy, wide mass of ice scrapes out a broad U?"
  s9_landslide_human: "Roots hold soil together. Which action takes the roots away and loads a steep slope?"
  s9_mantle_heat: "The force comes from deep inside the Earth, not from anything at the surface."
  s9_plate_edges: "Earthquakes come from sudden movement. Where do the plates rub and push against each other?"
  s9_weather_erode: "One process breaks rock where it sits; the other moves the pieces. They are not the same step."
  c9ss2_layer_state: 'Recall each layer''s state: the crust is solid rock, the mantle is hot and mostly solid but can flow slowly, the outer core is liquid metal, the inner core is solid metal.'
  c9ss2_agent_landform: "Picture where this landform is found: a dry desert, a rocky coast, a cold high valley, or along a river's course. Which agent is at work in that place?"
concepts:
- code: cbse9us.earth.interior_plates
  title: Inside the Earth and moving plates
  notes: |
    The Earth has layers: the crust (thin, solid; continental crust thicker than oceanic), the mantle (hot,
    thick, with a partly molten upper part on which plates move), the outer core (liquid iron and nickel) and
    the inner core (solid, very hot). The lithosphere (crust and upper mantle) is broken into large plates.
    Plate tectonic theory says these plates move slowly (a few cm a year), carried by heat currents in the
    mantle. At convergent boundaries plates collide: one may sink under another (subduction, trenches,
    volcanoes) or both crumple up into fold mountains (the Himalayas, as the Indian plate pushes into the
    Eurasian plate). At divergent boundaries plates move apart (mid-ocean ridges, rift valleys). At transform
    boundaries they slide past each other. Most earthquakes and volcanoes lie along plate boundaries, for
    example the Pacific "Ring of Fire".
  explanations:
    text: 'The Earth is like a cracked egg: a thin shell (crust) broken into pieces called plates, resting on a hot, slowly flowing mantle. The plates drift a few centimetres a year. Where they push together we get mountains and earthquakes; where they pull apart, new ocean floor forms.'
    visual: 'Draw a circle cut open: a thin brown crust, a thick orange mantle, a yellow liquid outer core and a red solid inner core. On the surface, draw two plates with arrows pushing into each other and a mountain range folding up between them.'
    step_by_step: 'Step 1: Name the layers from outside in: crust, mantle, outer core, inner core. Step 2: The crust and top mantle form plates. Step 3: Heat in the mantle moves the plates. Step 4: Collide → mountains, trenches. Apart → ridges. Slide past → earthquakes.'
    real_world: The Indian plate is still pushing north into Asia by about 5 cm a year, which is why the Himalayas are still rising and why North India and Nepal have earthquakes.
  picture:
    kind: flow
    steps:
    - Crust
    - Mantle
    - Outer core (liquid)
    - Inner core (solid)
    alt: 'The layers of the Earth from the outside to the centre: crust, mantle, liquid outer core and solid inner core.'
  activity:
    type: sort
    prompt: Which plate boundary?
    bins:
    - Convergent
    - Divergent
    - Transform
    items:
    - label: Indian Plate pushes into the Eurasian Plate
      bin: Convergent
      clue: Moving together.
      why: 'Convergent: the Himalayas.'
    - label: One plate sinks under another, making a trench
      bin: Convergent
      clue: Subduction.
      why: Convergent.
    - label: A mid-ocean ridge forms
      bin: Divergent
      clue: Moving apart.
      why: Divergent.
    - label: A rift valley opens
      bin: Divergent
      clue: Moving apart.
      why: Divergent.
    - label: Plates slide past each other
      bin: Transform
      clue: Sideways.
      why: Transform.
  lesson:
    - teach: 'The Earth is like an onion with layers. The crust is the thin rocky skin we live on (thicker under continents, thinner under oceans). Below is the mantle, very hot and thick. At the centre is the core: an outer core of liquid iron and nickel and a solid, extremely hot inner core.'
      picture:
        kind: flow
        steps:
        - 'Crust: thin, solid rock'
        - 'Mantle: hot, thick, slowly flowing'
        - 'Outer core: liquid iron and nickel'
        - 'Inner core: solid, very hot'
        alt: 'Earth''s layers from the outside in: crust, mantle, outer core, inner core.'
      check:
        prompt: Which layer do we live on?
        options:
        - Crust
        - Mantle
        - Core
        answer: Crust
        why: The crust is the outermost, thinnest layer.
    - teach: The crust and top of the mantle (the lithosphere) are broken into huge pieces called plates. Heat currents in the mantle move them a few centimetres a year, about as fast as your fingernails grow. This idea is plate tectonics.
      check:
        prompt: About how fast do plates move?
        options:
        - A few centimetres a year
        - A few metres a day
        - They don't move
        answer: A few centimetres a year
        why: Very slowly, but over millions of years they cross oceans.
    - teach: 'Where plates collide (convergent), one may sink under the other, making trenches and volcanoes, or both crumple into fold mountains: the Indian plate pushing into the Eurasian plate made the Himalayas. Where plates pull apart (divergent), magma rises to form new crust at mid-ocean ridges. Where they slide past each other (transform), earthquakes are common.'
      check:
        prompt: At which kind of boundary do fold mountains form?
        options:
        - Convergent
        - Divergent
        - None
        answer: Convergent
        why: Colliding plates crumple and push rock upwards.
  items:
  - prompt: Which is the thinnest layer of the Earth?
    options:
    - Crust
    - Mantle
    - Outer core
    - Inner core
    answer: Crust
    difficulty: 1
    hints:
    - We live on it.
    - Like the skin of an apple.
    solution: 'Step 1: The crust is only a few to about 70 km thick. Step 2: The other layers are thousands of km thick.'
    mistakes:
      Mantle: earth_layers_order
  - prompt: Which layer of the Earth is liquid?
    options:
    - Outer core
    - Inner core
    - Crust
    - Lithosphere
    answer: Outer core
    difficulty: 1
    hints:
    - It lies around the centre.
    - The inner core is solid because of huge pressure.
    solution: 'Step 1: The outer core is liquid iron and nickel. Step 2: The inner core is solid.'
    mistakes:
      Inner core: earth_layers_order
  - prompt: How were the Himalayas formed?
    options:
    - The Indian plate collided with the Eurasian plate
    - Two plates moved apart
    - A volcano erupted
    - Rivers deposited sand
    answer: The Indian plate collided with the Eurasian plate
    difficulty: 1
    hints:
    - Fold mountains.
    - Plates pushing together.
    solution: 'Step 1: The Indian plate moved north. Step 2: It pushed into the Eurasian plate, folding the rocks upward into the Himalayas.'
    mistakes:
      Two plates moved apart: plate_boundary
  - prompt: Why do most earthquakes happen along plate boundaries?
    options:
    - Plates move, push and slide against each other there
    - Those places are hotter
    - Rivers flow there
    - The crust is thickest there
    answer: Plates move, push and slide against each other there
    difficulty: 2
    hints:
    - Stress builds up where plates meet.
    - Sudden release shakes the ground.
    solution: 'Step 1: At boundaries plates grind and lock. Step 2: Stress builds and is suddenly released as an earthquake.'
    mistakes: {"Those places are hotter": "s9_plate_edges", "The crust is thickest there": "s9_plate_edges"}
  - prompt: What happens at a divergent plate boundary?
    options:
    - Plates move apart and new crust forms
    - Plates collide and make fold mountains
    - Plates slide past each other
    - Plates stop moving
    answer: Plates move apart and new crust forms
    difficulty: 2
    hints:
    - Diverge means go different ways.
    - Mid-ocean ridges.
    solution: 'Step 1: The plates pull apart. Step 2: Magma rises and makes new crust, as at mid-ocean ridges.'
    mistakes:
      Plates collide and make fold mountains: plate_boundary
  - prompt: What moves the plates of the Earth?
    options:
    - Heat currents in the mantle
    - Ocean waves
    - The Moon's light
    - Winds
    answer: Heat currents in the mantle
    difficulty: 2
    hints:
    - It comes from inside the Earth.
    - Hot material rises and cool material sinks.
    solution: 'Step 1: Heat from the core warms the mantle. Step 2: Slow convection currents drag the plates above them.'
    mistakes: {"Ocean waves": "s9_mantle_heat", "Winds": "s9_mantle_heat"}
  - prompt: Which is the innermost layer of the Earth?
    options:
    - Inner core
    - Outer core
    - Mantle
    - Crust
    answer: Inner core
    difficulty: 1
    hints:
    - It is at the very centre.
    - It is solid and extremely hot.
    solution: The inner core is at the centre of the Earth.
    mistakes:
      Mantle: earth_layers_order
  - prompt: The outer core is made mostly of…
    options:
    - Liquid iron and nickel
    - Solid granite
    - Water
    - Air
    answer: Liquid iron and nickel
    difficulty: 1
    hints:
    - It is metal.
    - It is not solid.
    solution: The outer core is liquid iron and nickel.
    mistakes:
      Solid granite: c9ss2_layer_state
  - prompt: Is the crust thicker under continents or under oceans?
    options:
    - Under continents
    - Under oceans
    - It is the same everywhere
    - There is no crust under oceans
    answer: Under continents
    difficulty: 1
    hints:
    - Continental crust is lighter but thicker.
    - Oceanic crust is thinner.
    solution: Continental crust is thicker than oceanic crust.
    mistakes:
      Under oceans: earth_layers_order
  - prompt: What forms at a mid-ocean ridge?
    options:
    - New crust, as plates move apart
    - Fold mountains
    - Deep trenches only
    - Deltas
    answer: New crust, as plates move apart
    difficulty: 2
    hints:
    - It is a divergent boundary.
    - Magma rises into the gap.
    solution: At divergent boundaries magma rises and cools, making new oceanic crust.
    mistakes:
      Fold mountains: plate_boundary
  - prompt: The 'Ring of Fire' around the Pacific Ocean has many…
    options:
    - Volcanoes and earthquakes
    - Deserts
    - Deltas
    - Glaciers only
    answer: Volcanoes and earthquakes
    difficulty: 2
    hints:
    - '''Fire'' suggests volcanoes.'
    - It follows plate boundaries.
    solution: The Pacific is ringed by plate boundaries, so it has many volcanoes and earthquakes.
    mistakes:
      Deserts: s9_plate_edges
  - prompt: When an oceanic plate sinks under another plate, what is this called?
    options:
    - Subduction
    - Erosion
    - Weathering
    - Deposition
    answer: Subduction
    difficulty: 2
    hints:
    - It happens at convergent boundaries.
    - It makes deep trenches.
    solution: 'The heavier oceanic plate goes down under the other: subduction.'
    mistakes:
      Erosion: endo_exo
  - prompt: The Himalayas are still rising slowly. Why?
    options:
    - The Indian plate is still pushing into the Eurasian plate
    - Rivers are adding soil
    - Glaciers are piling up ice
    - Volcanoes are erupting there
    answer: The Indian plate is still pushing into the Eurasian plate
    difficulty: 2
    hints:
    - How were they formed?
    - The push hasn't stopped.
    solution: The plates are still converging, so the Himalayas keep rising a little each year.
    mistakes:
      Rivers are adding soil: s9_mantle_heat
  - prompt: Why does the mantle move the plates?
    options:
    - Heat from deep inside makes hot rock rise and cooler rock sink in slow currents
    - The Moon pulls the plates
    - Wind pushes the continents
    - Ocean waves push them
    answer: Heat from deep inside makes hot rock rise and cooler rock sink in slow currents
    difficulty: 3
    hints:
    - Think of water heating in a pot.
    - Hot material rises.
    solution: Convection currents in the hot mantle drag the plates above them.
    mistakes:
      Wind pushes the continents: s9_mantle_heat
  - prompt: Fossils of the same land animals are found in Africa and South America. What does this support?
    options:
    - The continents were once joined and have drifted apart
    - The animals swam across the ocean
    - The fossils were carried by wind
    - The continents never moved
    answer: The continents were once joined and have drifted apart
    difficulty: 3
    hints:
    - Land animals can't cross oceans.
    - Plates move.
    solution: Matching fossils on far-apart continents suggest they were joined long ago.
    mistakes:
      The continents never moved: plate_boundary
- code: cbse9us.earth.landforms
  title: Forces that shape landforms, and disasters
  notes: |
    Landforms are made by two kinds of forces. Endogenic (internal) forces come from inside the Earth: slow
    ones build mountains and plateaus by folding and faulting; sudden ones cause earthquakes and volcanoes.
    Exogenic (external) forces work on the surface: weathering breaks rocks where they are, and erosion by
    running water, wind, glaciers and sea waves carries material away and deposits it elsewhere. Rivers make
    V-shaped valleys, waterfalls, meanders, ox-bow lakes, floodplains and deltas; wind makes sand dunes and
    mushroom rocks; glaciers carve U-shaped valleys and leave moraines; waves make sea cliffs, caves and
    beaches. Sudden landform changes can be disasters: earthquakes, volcanic eruptions, tsunamis and
    landslides (common on steep, deforested slopes in heavy rain, as in the Western Ghats and Himalayas).
    Preparedness: earthquake-safe buildings, warning systems, avoiding building on unstable slopes, drills.
  explanations:
    text: Inside forces lift and crack the land; outside forces wear it down. Mountains rise from below, then rivers, wind and ice carve them into valleys, and drop the bits as plains, dunes and deltas. When these changes happen suddenly, like a landslide or earthquake, they become disasters.
    visual: 'Draw a river from mountain to sea: a narrow V-valley and waterfall high up, wide loops (meanders) and an ox-bow lake in the middle, and a fan-shaped delta at the mouth.'
    step_by_step: 'Step 1: Is the force from inside (endogenic) or outside (exogenic)? Step 2: Inside: folding, faulting, earthquakes, volcanoes. Step 3: Outside: weathering then erosion and deposition. Step 4: Name the agent: river, wind, glacier or waves. Step 5: Match the landform it makes.'
    real_world: The Wayanad landslides of July 2024 followed extreme rain on steep slopes; mapping risky slopes and early warnings help save lives.
  picture:
    kind: flow
    steps:
    - 'Mountains: V-shaped valley, waterfall'
    - 'Plains: meanders, ox-bow lakes'
    - Floodplain deposits
    - 'Sea: delta'
    alt: Landforms made by a river from its source in the mountains to its mouth at the sea.
  activity:
    type: sort
    prompt: Made by which agent?
    bins:
    - River
    - Wind
    - Glacier
    - Sea waves
    items:
    - label: V-shaped valley
      bin: River
      clue: Running water cuts down.
      why: River.
    - label: Ox-bow lake
      bin: River
      clue: A cut-off meander.
      why: River.
    - label: Mushroom rock
      bin: Wind
      clue: Sand rubs the bottom.
      why: Wind.
    - label: Sand dune
      bin: Wind
      clue: Piles of sand.
      why: Wind.
    - label: U-shaped valley
      bin: Glacier
      clue: Moving ice.
      why: Glacier.
    - label: Moraine
      bin: Glacier
      clue: Debris left by ice.
      why: Glacier.
    - label: Sea cliff
      bin: Sea waves
      clue: Coast.
      why: Waves.
  lesson:
    - teach: 'Two kinds of forces shape the land. Endogenic forces come from inside the Earth: slow ones fold and fault rock into mountains and plateaus; sudden ones cause earthquakes and volcanoes. Exogenic forces act on the surface: weathering breaks rock in place, and erosion by water, wind, ice and waves carries it away and drops it elsewhere (deposition).'
      check:
        prompt: A volcano is caused by…
        options:
        - An endogenic force
        - An exogenic force
        - Weathering
        answer: An endogenic force
        why: It comes from inside the Earth.
    - teach: 'Each agent makes its own landforms. Rivers: V-shaped valleys, waterfalls, meanders, ox-bow lakes, floodplains, deltas. Wind: sand dunes, mushroom rocks. Glaciers: U-shaped valleys, moraines. Sea waves: cliffs, caves, sea arches, beaches.'
      picture:
        kind: compare
        columns:
        - title: Agent
          points:
          - River
          - Wind
          - Glacier
          - Sea waves
        - title: Landforms
          points:
          - V-valley, meander, ox-bow lake, delta
          - Sand dunes, mushroom rocks
          - U-valley, moraine
          - Cliff, sea cave, beach
        alt: Four agents of erosion and the landforms each one makes.
      check:
        prompt: An ox-bow lake is made by…
        options:
        - A river
        - Wind
        - A glacier
        answer: A river
        why: A meander loop is cut off from the river and left as a lake.
    - teach: 'Sudden changes can be disasters: earthquakes, eruptions, tsunamis, landslides. Landslides are common on steep slopes after heavy rain, especially where forests are cut (Western Ghats, Himalayas). We reduce harm with earthquake-safe buildings, early warnings, keeping forests on slopes and practising drills.'
      check:
        prompt: Which reduces landslide risk on a hill?
        options:
        - Keeping trees on the slope
        - Cutting the trees
        - Building heavy houses on the edge
        answer: Keeping trees on the slope
        why: Roots bind the soil together.
  items:
  - prompt: Which of these is an endogenic force?
    options:
    - Earthquake
    - Wind erosion
    - River deposition
    - Sea waves
    answer: Earthquake
    difficulty: 1
    hints:
    - Endo means inside.
    - It starts deep in the Earth.
    solution: 'Step 1: Endogenic forces start inside the Earth. Step 2: An earthquake is one; the others act on the surface.'
    mistakes:
