# CBSE Class 9 Social Science (NCERT), History chapter 3. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 3
title: Nazism and the Rise of Hitler

tips:
  weimar_treaty: "The Treaty of Versailles (1919) was harsh on Germany: lost territory and colonies, paid £6 billion in reparations, and was demilitarised. Many Germans blamed the Weimar Republic for it."
  ww2_start: "The Second World War began in September 1939 when Germany invaded Poland."

concepts:
  - code: cbse9ss.nazi.rise
    title: Weimar Germany and Hitler's rise
    notes: |
      Germany lost the First World War; the Weimar Republic signed the Treaty of Versailles (1919): loss of
      overseas colonies, 13% territory, 75% iron and 26% coal (to France, Poland, Denmark, Lithuania),
      reparations of £6 billion, Rhineland occupied. Hyperinflation in 1923; Great Depression (1929)
      onwards. Weaknesses of the Weimar constitution: proportional representation, Article 48 (emergency
      powers). Hitler's Nazi party grew from 2.6% of votes in 1928 to 37% in 1932. Hitler became
      Chancellor on 30 January 1933. Fire Decree, Enabling Act (March 1933) set up dictatorship.
    explanations:
      text: "After losing the First World War, Germany signed the harsh Treaty of Versailles. Its new Weimar Republic faced massive inflation in 1923 and then the Great Depression in 1929. In this despair, Hitler promised jobs, national pride and to undo Versailles. His Nazi party grew fast, and he became Chancellor in 1933. Within months the Enabling Act let him rule as a dictator."
      visual: "Draw a staircase going down: 1919 Versailles, 1923 hyperinflation, 1929 Depression. At the bottom, unhappy people. Then one step up labelled 1933 Hitler Chancellor, and a locked door labelled Enabling Act."
      step_by_step: "Step 1: Defeat in 1918 and the Treaty of Versailles. Step 2: Economic crises: 1923 inflation, 1929 Depression. Step 3: Weak constitution with emergency powers. Step 4: Hitler's propaganda and promises. Step 5: 1933: Chancellor, then Enabling Act, then dictatorship."
      real_world: "In 1923, German money lost value so fast that people needed cartloads of notes to buy a loaf of bread. Economic chaos like this makes people willing to listen to anyone who promises order."
    picture:
      kind: flow
      steps: ['1919: the Treaty of Versailles, a harsh peace', '1923: hyperinflation makes money worthless', '1929: the Great Depression, millions jobless', 'January 1933: Hitler becomes Chancellor', 'March 1933: the Enabling Act
          begins the dictatorship']
      alt: Germany's slide from the Treaty of Versailles in 1919, hyperinflation in 1923 and the Depression in 1929 to Hitler becoming Chancellor and dictator in 1933.
    items:
      - prompt: "Which treaty ended the First World War for Germany?"
        options: ["Treaty of Versailles", "Treaty of Vienna", "Treaty of Paris (1763)", "Treaty of Brest-Litovsk"]
        answer: "Treaty of Versailles"
        difficulty: 1
        hints: ["Signed in 1919.", "In a French palace."]
        solution: "Germany signed the Treaty of Versailles in 1919."
      - prompt: "In which year did Hitler become Chancellor of Germany?"
        answer: "1933"
        check: "1933"
        difficulty: 1
        hints: ["30 January.", "After the Great Depression."]
        solution: "Hitler became Chancellor on 30 January 1933."
      - prompt: "How much did Germany have to pay in reparations under the Treaty of Versailles, in billion pounds?"
        answer: "6"
        check: "6"
        difficulty: 2
        hints: ["A huge sum.", "Between 5 and 7."]
        solution: "Germany was made to pay £6 billion."
      - prompt: "Which law in March 1933 gave Hitler power to rule by decree?"
        options: ["The Enabling Act", "The Fire Decree", "The Nuremberg Laws", "Article 48"]
        answer: "The Enabling Act"
        difficulty: 2
        hints: ["It 'enabled' him.", "It sidelined parliament."]
        solution: "The Enabling Act of March 1933 established dictatorship."
      - prompt: "The Nazi vote share rose to about what percentage in 1932?"
        answer: "37"
        check: "37"
        difficulty: 3
        hints: ["Up from 2.6% in 1928.", "More than a third."]
        solution: "By 1932, the Nazis won about 37% of the votes."
      - prompt: "Which article of the Weimar constitution gave the President emergency powers?"
        answer: "48"
        check: "48"
        difficulty: 3
        hints: ["Rule by decree.", "Between 40 and 50."]
        solution: "Article 48 allowed the President to suspend civil rights and rule by decree."

  - code: cbse9ss.nazi.society
    title: Nazi ideology, society and war
    after: [cbse9ss.nazi.rise]
    notes: |
      Nazi ideology: racial hierarchy with 'Aryans' at the top, Jews persecuted; Lebensraum (living space);
      Nuremberg Laws 1935; Kristallnacht 1938; ghettos and gas chambers: the Holocaust, about six million
      Jews killed, along with Roma, people with disabilities and others. Youth indoctrinated (Hitler Youth),
      women told to be mothers. Propaganda by Goebbels. Germany invaded Poland in September 1939, starting
      the Second World War; it ended in 1945 after the US joined (Pearl Harbor 1941) and atomic bombs on
      Hiroshima and Nagasaki.
    explanations:
      text: "The Nazis believed in a false racial order, with so-called Aryans at the top and Jews at the bottom. Laws took away Jews' rights, and then millions were murdered in the Holocaust, along with Roma, disabled people and others. Children were trained to obey, and propaganda filled the media. Germany's invasion of Poland in 1939 began the Second World War, which ended in 1945."
      visual: "Draw a timeline: 1933 power, 1935 Nuremberg Laws, 1938 Kristallnacht, 1939 Poland invaded, 1941 US enters war, 1945 war ends. Write 'Holocaust: about 6 million Jews killed' across 1941–45."
      step_by_step: "Step 1: Ideology: racism and 'living space'. Step 2: Laws against Jews (1935). Step 3: Violence and ghettos (1938 onward). Step 4: War from 1939. Step 5: Genocide in camps. Step 6: Defeat in 1945."
      real_world: "Remembering the Holocaust is why many countries now teach about hate speech and protect minority rights. Anne Frank's diary, written while hiding, is read by students around the world."
    picture:
      kind: flow
      steps: ['1933: the Nazis take power', '1935: the Nuremberg Laws take away Jews'' rights', '1938: Kristallnacht attacks', '1939: Germany invades Poland; the war begins', '1941: Germany attacks the USSR; the USA joins the war',
        '1945: Germany is defeated']
      alt: A timeline of Nazi Germany from 1933 through the Nuremberg Laws, Kristallnacht and the invasion of Poland to defeat in 1945.
    items:
      - prompt: "When did the Second World War begin?"
        answer: "1939"
        check: "1939"
        difficulty: 1
        hints: ["Germany invaded Poland.", "September."]
        solution: "It began in September 1939."
        mistakes: {"1941": ww2_start}
      - prompt: "Who was Hitler's propaganda minister?"
        options: ["Joseph Goebbels", "Hermann Göring", "Heinrich Himmler", "Paul von Hindenburg"]
        answer: "Joseph Goebbels"
        difficulty: 2
        hints: ["Minister of Propaganda.", "He controlled films and newspapers."]
        solution: "Joseph Goebbels ran Nazi propaganda."
      - prompt: "Which laws of 1935 took away citizenship rights from German Jews?"
        options: ["The Nuremberg Laws", "The Enabling Act", "The Fire Decree", "The Treaty of Versailles"]
        answer: "The Nuremberg Laws"
        difficulty: 2
        hints: ["Named after a city.", "1935."]
        solution: "The Nuremberg Laws (1935) stripped Jews of citizenship."
      - prompt: "About how many million Jews were killed in the Holocaust?"
        answer: "6"
        check: "6"
        difficulty: 1
        hints: ["A huge number.", "Six."]
        solution: "About six million Jews were killed."
      - prompt: "What did the Nazi idea of 'Lebensraum' mean?"
        options: ["Living space to be taken in the east", "A youth organisation", "A secret police", "A type of election"]
        answer: "Living space to be taken in the east"
        difficulty: 2
        hints: ["German for 'living space'.", "It justified invading Poland and the USSR."]
        solution: "Lebensraum meant conquering land for Germans to settle, especially in Eastern Europe."
      - prompt: "Which event in 1941 brought the USA into the Second World War?"
        options: ["Japan's attack on Pearl Harbor", "Germany's invasion of Poland", "The fall of France", "The atomic bombing of Hiroshima"]
        answer: "Japan's attack on Pearl Harbor"
        difficulty: 3
        hints: ["A US naval base in Hawaii.", "December 1941."]
        solution: "Japan's attack on Pearl Harbor brought the USA into the war."
