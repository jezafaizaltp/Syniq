# CBSE Class 9 Social Science (NCERT), Geography chapter 6. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 11
title: Population

tips:
  density_per_km2: "Population density = number of people ÷ area in km². It is people per square kilometre."
  growth_rate: "Growth rate = (change in population ÷ starting population) × 100, in percent."
  birth_minus_death: "Natural growth = birth rate − death rate. Migration also changes a place's population."

concepts:
  - code: cbse9ss.pop.size
    title: Size, distribution and density
    notes: |
      Census of India every 10 years; first complete census 1881; 2011 census: 1,210.6 million, about 17.5%
      of the world's population on 2.4% of its area. Uttar Pradesh most populous (199 million), Sikkim least
      (0.6 million); Lakshadweep only 64,429. Density 382 persons per km² (2011); Bihar highest (1,102),
      Arunachal Pradesh lowest (17). Density depends on relief, climate, soil, water and jobs.
    explanations:
      text: "India counts its people every 10 years in the census. In 2011 it had about 121 crore people: about 17.5% of the world's population on only 2.4% of its land. Some states are packed and others sparse: Bihar has over 1,100 people per square kilometre, while Arunachal Pradesh has just 17."
      visual: "Draw two equal squares, one for Bihar and one for Arunachal. Fill Bihar's with dots until it's crowded; put just a handful in Arunachal's. Density is how many dots fit in each square kilometre."
      step_by_step: "Step 1: Population density = people ÷ area. Step 2: Flat, fertile, well-watered land with jobs has high density. Step 3: Mountains, deserts and thick forests have low density. Step 4: Use census figures for comparisons."
      real_world: "Kerala's coastal belt is densely populated because of fertile land, fishing and trade, while the hilly forests of Idukki have far fewer people per square kilometre."
    picture:
      kind: bars
      unit: people per km² (Census 2011)
      bars:
      - {label: Bihar, value: 1102}
      - {label: India, value: 382}
      - {label: Arunachal Pradesh, value: 17}
      caption: Density = people ÷ area. Bihar is the most crowded state; Arunachal Pradesh the least.
      alt: 'Population density in 2011: Bihar 1,102 people per square km, India as a whole 382, and Arunachal Pradesh 17.'
    items:
      - prompt: "How often is the census held in India?"
        options: ["Every 10 years", "Every 5 years", "Every year", "Every 20 years"]
        answer: "Every 10 years"
        difficulty: 1
        hints: ["Once a decade.", "2001, 2011…"]
        solution: "The census is held every 10 years."
      - prompt: "India's population in 2011 was about what percentage of the world's?"
        answer: "17.5"
        check: "17.5"
        difficulty: 1
        hints: ["Between 15 and 20.", "Seventeen and a half."]
        solution: "About 17.5% of the world's population."
      - prompt: "A district has 600,000 people living in 1,500 km². What is its population density, in persons per km²?"
        answer: "400"
        check: "600000/1500"
        difficulty: 2
        hints: ["People ÷ area.", "600,000 ÷ 1,500."]
        solution: "600,000 ÷ 1,500 = 400 persons per km²."
        mistakes: {"0.0025": density_per_km2}
      - prompt: "Which state had the highest population density in 2011?"
        options: ["Bihar", "Uttar Pradesh", "Kerala", "West Bengal"]
        answer: "Bihar"
        difficulty: 2
        hints: ["Over 1,100 per km².", "In the Ganga plain."]
        solution: "Bihar had the highest density, 1,102 per km²."
      - prompt: "Which state is the most populous?"
        options: ["Uttar Pradesh", "Bihar", "Maharashtra", "Kerala"]
        answer: "Uttar Pradesh"
        difficulty: 1
        hints: ["About 199 million in 2011.", "In northern India."]
        solution: "Uttar Pradesh is the most populous state."
      - prompt: "What was India's population density in 2011, in persons per km²?"
        answer: "382"
        check: "382"
        difficulty: 3
        hints: ["Between 350 and 400.", "Up from 325 in 2001."]
        solution: "India's density in 2011 was 382 persons per km²."

  - code: cbse9ss.pop.change
    title: Population growth and change
    after: [cbse9ss.pop.size]
    notes: |
      Population growth: absolute increase and annual growth rate (% per year). Rapid growth from 1951 to
      1981; the growth rate has been declining since. Three processes of change: births, deaths, migration.
      Birth rate and death rate per thousand per year; natural growth = birth rate − death rate. Death
      rates fell faster than birth rates after 1951. Migration: internal (mostly rural to urban), push and
      pull factors. Age composition: children (0–14), working age (15–59), aged (60+). Sex ratio: females
      per 1000 males (940 in 2011; Kerala 1084). Literacy rate 74.04% (2011). National Population Policy
      2000.
    explanations:
      text: "A population changes in three ways: births add people, deaths remove them, and migration moves them. India grew fastest between 1951 and 1981 because death rates fell (better health care) while birth rates stayed high. The sex ratio, girls and women per 1000 men, was 940 in 2011, but Kerala had 1084, the highest."
      visual: "Draw a bathtub. A tap pours in water (births), the drain lets water out (deaths), and a pipe connects to another tub (migration). The level rises if the tap runs faster than the drain."
      step_by_step: "Step 1: Natural growth rate = birth rate − death rate. Step 2: Growth rate % = (change ÷ starting population) × 100. Step 3: Sex ratio = females per 1000 males. Step 4: Migration is driven by push factors (lack of jobs) and pull factors (opportunities in cities)."
      real_world: "Many young people from rural Kerala and other states migrate to Gulf countries and big Indian cities for work, which changes the age and sex balance of both the villages and the cities."
    picture:
      kind: flow
      steps: [Births add people, Deaths take people away, Migration moves people in or out, Natural growth = birth rate − death rate]
      alt: 'Population change: births add people, deaths remove them and migration moves them in or out. Natural growth is the birth rate minus the death rate.'
      caption: If births are more than deaths, the population grows, like a tub filling faster than it drains.
    items:
      - prompt: "A town's birth rate is 22 per thousand and its death rate is 8 per thousand. What is its natural growth rate, per thousand?"
        answer: "14"
        check: "22 - 8"
        difficulty: 1
        hints: ["Birth rate − death rate.", "22 − 8."]
        solution: "22 − 8 = 14 per thousand."
        mistakes: {"30": birth_minus_death}
      - prompt: "What was India's sex ratio in 2011 (females per 1000 males)?"
        answer: "940"
        check: "940"
        difficulty: 1
        hints: ["Fewer women than men.", "Between 900 and 1000."]
        solution: "The sex ratio in 2011 was 940."
      - prompt: "Which state had the highest sex ratio in 2011?"
        options: ["Kerala", "Haryana", "Punjab", "Uttar Pradesh"]
        answer: "Kerala"
        difficulty: 1
        hints: ["Over 1000.", "In the south."]
        solution: "Kerala had 1084 females per 1000 males."
      - prompt: "A village grew from 2,000 to 2,300 people in 10 years. What was its growth rate over the decade, in percent?"
        answer: "15"
        check: "(2300 - 2000)/2000*100"
        difficulty: 2
        hints: ["Change = 300.", "300 ÷ 2000 × 100."]
        solution: "300 ÷ 2000 × 100 = 15%."
        mistakes: {"13.04": growth_rate}
      - prompt: "What was India's literacy rate in 2011, in percent? Type it to 2 decimal places."
        answer: "74.04"
        check: "74.04"
        difficulty: 3
        hints: ["Just under three quarters.", "Seventy-four point zero four."]
        solution: "The literacy rate in 2011 was 74.04%."
      - prompt: "Why did India's population grow fast after 1951?"
        options: ["Death rates fell faster than birth rates", "Birth rates fell sharply", "Many people emigrated", "The census changed"]
        answer: "Death rates fell faster than birth rates"
        difficulty: 2
        hints: ["Better health care saved lives.", "Births stayed high."]
        solution: "Falling death rates with continued high birth rates caused rapid growth."
      - prompt: "Most internal migration in India is from…"
        options: ["Rural to urban areas", "Urban to rural areas", "India to abroad", "Hills to deserts"]
        answer: "Rural to urban areas"
        difficulty: 2
        hints: ["Cities pull people with jobs.", "Villages push with poverty."]
        solution: "Most migration is from villages to towns and cities."
