- code: cbse9us.climate.seasons
  title: Seasons and distribution of rainfall
  after:
  - cbse9us.climate.controls
  notes: |
    Four seasons: cold weather (mid-November to February; western disturbances bring winter rain to the
    north-west, which helps rabi crops), hot weather (March–May; loo; mango showers in Kerala and
    Karnataka; kaal baisakhi in Bengal), advancing monsoon (June–September; onset in Kerala about 1 June,
    covers India by mid-July; breaks in monsoon), retreating monsoon (October–November; October heat;
    cyclones; Coromandel coast gets rain). Rainfall: over 400 cm on west coast and north-east (Mawsynram
    highest in the world); below 60 cm in western Rajasthan, Ladakh, parts of Gujarat. Monsoon as a
    unifying bond.
  explanations:
    text: 'India has four seasons: cold weather (winter), hot weather (summer), the advancing south-west monsoon, and the retreating monsoon. The monsoon reaches Kerala around 1 June and covers the country by mid-July. Rain is very uneven: Mawsynram in Meghalaya gets the most in the world, while western Rajasthan gets less than 60 cm a year.'
    visual: 'Draw a circle split into four: Nov–Feb (cold, with a snowflake), Mar–May (hot, with a sun and ''loo'' winds), Jun–Sep (rain clouds), Oct–Nov (clouds moving back, cyclone symbol near the east coast).'
    step_by_step: 'Step 1: Name the months. Step 2: Match the season. Step 3: Recall a special wind or rain: western disturbances (winter, north-west), loo (summer, north), mango showers (summer, Kerala), kaal baisakhi (summer, Bengal), cyclones (October–November, east coast).'
    real_world: In Kerala, pre-monsoon 'mango showers' in April and May help ripen mangoes early. Chennai gets heavy rain in November from the north-east monsoon, when most of India is dry.
  picture:
    kind: flow
    steps:
    - 'Cold season: mid-November to February'
    - 'Hot season: March to May'
    - 'Advancing monsoon: June to September'
    - 'Retreating monsoon: October and November'
    alt: 'India''s four seasons in order: cold from mid-November to February, hot from March to May, the advancing monsoon June to September, and the retreating monsoon in October and November.'
  activity:
    type: sort
    prompt: Which season?
    bins:
    - Cold weather
    - Hot weather
    - Advancing monsoon
    - Retreating monsoon
    items:
    - label: Western disturbances bring winter rain
      bin: Cold weather
      clue: Helps rabi crops.
      why: Cold weather.
    - label: Loo blows; mango showers in Kerala
      bin: Hot weather
      clue: March–May.
      why: Hot weather.
    - label: Onset in Kerala about 1 June
      bin: Advancing monsoon
      clue: Rain moves north.
      why: Advancing monsoon.
    - label: October heat; Coromandel coast gets rain
      bin: Retreating monsoon
      clue: October–November.
      why: Retreating monsoon.
    - label: Kaal baisakhi storms in Bengal
      bin: Hot weather
      clue: Before the rains.
      why: Hot weather.
  lesson:
    - teach: 'India has four seasons. Cold season (December–February): cool, dry, clear days; western disturbances from the Mediterranean bring winter rain to the north-west, good for rabi crops. Hot season (March–May): the north gets the hot, dry loo; pre-monsoon storms give mango showers in Kerala and Karnataka and kaal baisakhi in Bengal.'
      check:
        prompt: Which season brings the loo?
        options:
        - Hot season
        - Cold season
        - Retreating monsoon
        answer: Hot season
        why: The loo blows in May–June over north India.
      ways:
      - style: visual
        teach: India's four seasons and the months each one covers.
        picture:
          kind: flow
          steps:
          - 'Cold: Dec–Feb'
          - 'Hot: Mar–May'
          - 'SW monsoon: Jun–Sep'
          - 'Retreating monsoon: Oct–Nov'
          alt: 'India''s seasons: cold from December to February, hot from March to May, the south-west monsoon from June to September, and the retreating monsoon in October and November.'
      - style: real_world
        teach: Farmers in Punjab welcome winter rain from western disturbances for their wheat (a rabi crop). In Kerala, April's mango showers help mangoes ripen. Each season matters to someone's harvest.
    - teach: 'The south-west monsoon reaches Kerala around 1 June and covers India by mid-July, bringing most of the year''s rain until September, with dry ''breaks'' in between. In October–November the monsoon retreats: skies clear, ''October heat'' is humid, and north-east winds and cyclones bring rain to the Coromandel coast of Tamil Nadu.'
      picture:
        kind: flow
        steps:
        - 'Dec–Feb: cold season'
        - 'Mar–May: hot season, loo'
        - 'Jun–Sep: south-west monsoon'
        - 'Oct–Nov: retreating monsoon, Tamil Nadu rain'
        alt: India's four seasons in order through the year.
      check:
        prompt: When does Tamil Nadu's coast get much of its rain?
        options:
        - October–November
        - June–July
        - January
        answer: October–November
        why: During the retreating monsoon, north-east winds bring rain there.
      ways:
      - style: step_by_step
        teach: 'Step 1: The monsoon reaches Kerala around 1 June. Step 2: It covers India by mid-July. Step 3: It brings most rain till September, with breaks. Step 4: It retreats in October–November, when Tamil Nadu''s Coromandel coast gets rain from north-east winds.'
      - style: real_world
        teach: Each year the news reports 'monsoon arrives in Kerala'. Schools reopen around then, umbrellas come out, and farmers across India watch the forecast, because the timing decides when they sow.
    - teach: 'Rainfall is very uneven. Over 400 cm falls on the west coast and in the north-east: Mawsynram in Meghalaya is among the wettest places on Earth. Less than 60 cm falls in western Rajasthan, Ladakh and parts of Gujarat. Yet the monsoon unites India: farmers everywhere wait for it.'
      check:
        prompt: Which region gets less than 60 cm of rain a year?
        options:
        - Western Rajasthan
        - Kerala coast
        - Meghalaya
        answer: Western Rajasthan
        why: It lies in the dry Thar desert.
      ways:
      - style: visual
        teach: Rainfall varies hugely from place to place across India.
        picture:
          kind: bars
          bars:
          - label: west coast, NE
            value: 400
          - label: most of India
            value: 100
          - label: W Rajasthan, Ladakh
            value: 60
          alt: The west coast and north-east get over 400 centimetres of rain a year; much of India gets around 100; western Rajasthan and Ladakh get under 60.
      - style: step_by_step
        teach: 'Step 1: Is the place facing moist winds, on a coast or hill slope? More rain. Step 2: Is it behind mountains or far inland? Less rain. Mawsynram faces the winds; western Rajasthan is far from them.'
