concepts:
- code: cbse9us.atmos.layers
  title: The atmosphere, its layers, and weather versus climate
  notes: |
    The atmosphere is the blanket of air held around the Earth by gravity. It is mostly nitrogen (about 78%)
    and oxygen (about 21%), with argon, carbon dioxide, water vapour and dust. It protects life by absorbing
    harmful ultraviolet rays, keeping temperatures moderate and burning up meteors. Layers from the ground up:
    troposphere (up to about 8 km at the poles and 18 km at the Equator; all weather, clouds and rain; it
    gets colder with height, about 6.5 °C per km), stratosphere (calm air used by jet planes; contains the
    ozone layer), mesosphere (coldest; meteors burn here), thermosphere (very hot, ionosphere reflects radio
    waves) and exosphere (outermost, thin air). Weather is the short-term state of the air (temperature,
    pressure, wind, humidity, rain); climate is the long-term average over about 30 years. Air pressure is
    the weight of air; it falls with height. Winds blow from high to low pressure. Global pressure belts and
    planetary winds (trade winds, westerlies, polar easterlies) shape climates across the world.
  explanations:
    text: The atmosphere is like a layered blanket. The bottom layer, the troposphere, is where we live and where all the weather happens. Above it, the stratosphere holds the ozone layer that shields us from UV rays. Weather is today's mood of the air; climate is its personality over many years.
    visual: 'Draw a tall column. Label from bottom: Troposphere (clouds, rain, us), Stratosphere (ozone, a jet plane), Mesosphere (a burning meteor), Thermosphere (radio waves bouncing), Exosphere (a satellite).'
    step_by_step: 'Step 1: Name what the question is about: today or many years? (weather or climate). Step 2: For layers, start from the ground: tropo, strato, meso, thermo, exo. Step 3: Link each to its clue: weather, ozone, meteors, radio, satellites.'
    real_world: Planes fly in the lower stratosphere because the air there is calm, above the bumpy clouds of the troposphere.
  picture:
    kind: flow
    steps:
    - 'Troposphere: weather'
    - 'Stratosphere: ozone layer'
    - 'Mesosphere: meteors burn'
    - 'Thermosphere: radio waves'
    - 'Exosphere: thin air'
    alt: The five layers of the atmosphere from the ground upwards, with what happens in each.
  activity:
    type: scale
    min: 0
    max: 100
    step: 1
    start: 100
    unit: km
    prompt: Height above the ground (km). Find the layer.
    zones:
    - from: 0
      to: 12
      label: Troposphere
      says: All weather happens here, up to 8–18 km.
    - from: 12
      to: 50
      label: Stratosphere
      says: Calm air for jets; the ozone layer.
    - from: 50
      to: 80
      label: Mesosphere
      says: Coldest layer; meteors burn up here.
    - from: 80
      to: 100
      label: Thermosphere
      says: Very hot; the ionosphere reflects radio waves.
    goals:
    - prompt: Where do clouds and rain form?
      zone: Troposphere
      mistakes:
      - when:
          v:
          - 13
          - 50
        say: 'That''s the stratosphere: calm, no weather. Weather is in the lowest layer.'
    - prompt: Where is the ozone layer?
      zone: Stratosphere
      mistakes:
      - when:
          v:
          - 0
          - 11
        say: That's the troposphere. Ozone is higher up, in the stratosphere.
    - prompt: Where do most meteors burn up?
      zone: Mesosphere
      mistakes:
      - when:
          v:
          - 81
          - 100
        say: 'Too high: meteors burn in the mesosphere.'
    orientation: vertical
  items:
  - prompt: In which layer of the atmosphere does almost all weather happen?
    options:
    - Troposphere
    - Stratosphere
    - Mesosphere
    - Exosphere
    answer: Troposphere
    difficulty: 1
    hints:
    - The lowest layer.
    - Clouds and rain.
    solution: 'Step 1: Clouds, rain and storms form in the lowest layer. Step 2: That is the troposphere.'
    mistakes:
      Stratosphere: atmos_layers
  - prompt: The ozone layer is found in the…
    options:
    - Stratosphere
    - Troposphere
    - Thermosphere
    - Exosphere
    answer: Stratosphere
    difficulty: 1
    hints:
    - The layer just above the weather.
    - Jet planes fly near its base.
    solution: 'Step 1: Ozone collects 15 to 35 km up. Step 2: That is in the stratosphere.'
    mistakes:
      Troposphere: atmos_layers
  - prompt: '''It rained heavily in Kochi this afternoon.'' This describes…'
    options:
    - Weather
    - Climate
    - Both equally
    - Neither
    answer: Weather
    difficulty: 1
    hints:
    - One afternoon is a short time.
    - Climate is over about 30 years.
    solution: 'Step 1: It is about one afternoon. Step 2: Short-term conditions are weather.'
    mistakes:
      Climate: weather_climate
  - prompt: Which gas makes up most of the atmosphere?
    options:
    - Nitrogen
    - Oxygen
    - Carbon dioxide
    - Water vapour
    answer: Nitrogen
    difficulty: 1
    hints:
    - About 78%.
    - Not the one we need to breathe.
    solution: 'Step 1: Air is about 78% nitrogen and 21% oxygen. Step 2: Nitrogen is the largest share.'
    mistakes: {"Oxygen": "s9_nitrogen"}
  - prompt: What happens to air temperature as you climb higher in the troposphere?
    options:
    - It falls, by about 6.5 °C per km
    - It rises
    - It stays the same
    - It doubles every km
    answer: It falls, by about 6.5 °C per km
    difficulty: 2
    hints:
    - Hill stations are cool.
    - The ground warms the air from below.
    solution: 'Step 1: The air is heated from the ground. Step 2: So it gets colder with height, about 6.5 °C for each km.'
    mistakes: {"It rises": "s9_lapse_rate"}
  - prompt: Why do winds blow?
    options:
    - Air moves from high pressure to low pressure
    - The Moon pulls the air
    - Trees push the air
    - Air moves from low pressure to high pressure
    answer: Air moves from high pressure to low pressure
    difficulty: 2
    hints:
    - Uneven heating makes pressure differences.
    - Like air rushing out of a pumped tyre.
    solution: 'Step 1: Uneven heating makes some places high pressure and others low. Step 2: Air flows from high to low: that is wind.'
    mistakes: {"Air moves from low pressure to high pressure": "s9_pressure_wind"}
- code: cbse9us.climate.controls
  title: Climate controls and the monsoon mechanism
  notes: |
    Weather is the state of the atmosphere at a time; climate the average over 30+ years. Controls:
    latitude, altitude, pressure and winds, distance from the sea (continentality), ocean currents,
    relief. India's climate is monsoon type. Factors: Tropic of Cancer, Himalayas block cold winds, land and
    water distribution, relief. Monsoon mechanism: differential heating of land and sea, shift of ITCZ
    (Inter Tropical Convergence Zone), high pressure east of Madagascar, Tibetan plateau heating, the
    tropical easterly jet stream, El Niño. 'Monsoon' from the Arabic 'mausim' (season).
  explanations:
    text: 'Weather is what the sky is doing today; climate is the pattern over many years. India has a monsoon climate: the winds reverse direction with the seasons. In summer the land heats up much more than the sea, creating low pressure over north India. Moist winds from the Indian Ocean rush in, bringing the south-west monsoon rains.'
    visual: Draw India with a big L (low pressure) over the north-west in summer and an H (high pressure) over the Indian Ocean. Arrows curve from the H to the L across the Arabian Sea and Bay of Bengal, carrying rain clouds.
    step_by_step: 'Step 1: Land heats faster than sea in summer: low pressure over land. Step 2: High pressure stays over the ocean. Step 3: Winds blow from high to low: from sea to land. Step 4: They carry moisture and drop rain when they meet the Western Ghats and Himalayas. Step 5: In winter the pattern reverses.'
    real_world: Farmers across India watch the monsoon's arrival date closely because most crops are planted with its first rains. A delay of even two weeks can affect food prices.
  picture:
    kind: flow
    steps:
    - 'Summer: the land heats up faster than the sea'
    - Low pressure forms over north-west India
    - High pressure stays over the Indian Ocean
    - Moist winds blow from the sea towards the land
    - They bring rain from June to September
    alt: 'How the monsoon works: the land heats faster than the sea, low pressure forms over India, and moist sea winds blow in and bring rain from June to September.'
  activity:
    type: sort
    prompt: Weather or climate?
    bins:
    - Weather
    - Climate
    items:
    - label: It's raining in Kochi right now
      bin: Weather
      clue: A short time.
      why: Weather.
    - label: Kerala gets heavy rain every June
      bin: Climate
      clue: The average over many years.
      why: Climate.
    - label: Today's temperature is 34 °C
      bin: Weather
      clue: One day.
      why: Weather.
    - label: Rajasthan is dry year after year
      bin: Climate
      clue: Long-term.
      why: Climate.
    - label: A storm is expected tonight
      bin: Weather
      clue: Short-term.
      why: Weather.
    - label: India has a monsoon type
      bin: Climate
      clue: Over 30+ years.
      why: Climate.
  items:
  - prompt: The word 'monsoon' comes from the Arabic word…
    options:
    - Mausim
    - Mansoor
    - Musafir
    - Mausam-e-garma
    answer: Mausim
    difficulty: 1
    hints:
    - It means season.
    - Arab sailors used it.
    solution: '''Monsoon'' comes from ''mausim'', meaning season.'
    mistakes: {"Mausam-e-garma": "s9_mausim", "Mansoor": "s9_mausim"}
  - prompt: Climate is the average weather over a period of at least how many years?
    answer: '30'
    check: '30'
    difficulty: 1
    hints:
    - Several decades.
    - Three decades.
    solution: Climate is the average over more than 30 years.
    mistakes: {"10": "s9_climate_years", "100": "s9_climate_years"}
  - prompt: Why do the Himalayas matter for India's climate?
    options:
    - They block cold winds from Central Asia
    - They make India colder
    - They stop all rain
    - They create deserts in the south
    answer: They block cold winds from Central Asia
    difficulty: 2
    hints:
    - Think of a wall to the north.
    - Winters are milder than in Central Asia.
    solution: The Himalayas shield India from icy northern winds and trap monsoon winds.
    mistakes: {"They make India colder": "s9_himalaya_wall"}
  - prompt: The low-pressure belt near the Equator where trade winds meet is called the…
    options:
    - ITCZ
    - Jet stream
    - El Niño
    - Western disturbance
    answer: ITCZ
    difficulty: 2
    hints:
    - Inter Tropical Convergence Zone.
    - It shifts north in summer.
    solution: This is the Inter Tropical Convergence Zone (ITCZ).
    mistakes: {"Jet stream": "s9_itcz"}
  - prompt: In summer, why is there low pressure over north-west India?
    options:
    - The land heats up much more than the sea
    - It is close to the sea
    - Snow covers it
    - It is at high altitude
    answer: The land heats up much more than the sea
    difficulty: 2
    hints:
    - Hot air rises.
    - Differential heating.
    solution: Intense heating of the land creates low pressure that draws in moist sea winds.
    mistakes: {"It is close to the sea": "s9_land_heats"}
  - prompt: Which warm ocean current off Peru, when present, can weaken the Indian monsoon?
    options:
    - El Niño
    - Gulf Stream
    - Kuroshio
    - Labrador Current
    answer: El Niño
    difficulty: 3
    hints:
    - Spanish for 'the child'.
    - Appears every few years.
    solution: El Niño, a warm current off Peru, is linked with weaker monsoons in India.
    mistakes: {"Gulf Stream": "s9_el_nino"}
- code: cbse9us.climate.seasons
  title: Seasons and distribution of rainfall
  after:
  - cbse9us.climate.controls
  notes: |
    Four seasons: cold weather (mid-November to February; western disturbances bring winter rain to the
    north-west, which helps rabi crops), hot weather (March–May; loo; mango showers in Kerala and
    Karnataka; kaal baisakhi in Bengal), advancing monsoon (June–September; onset in Kerala about 1 June,
    covers India by mid-July; breaks in monsoon), retreating monsoon (October–November; October heat;
    cyclones; Coromandel coast gets rain). Rainfall: over 400 cm on west coast and north-east (Mawsynram
    highest in the world); below 60 cm in western Rajasthan, Ladakh, parts of Gujarat. Monsoon as a
    unifying bond.
  explanations:
    text: 'India has four seasons: cold weather (winter), hot weather (summer), the advancing south-west monsoon, and the retreating monsoon. The monsoon reaches Kerala around 1 June and covers the country by mid-July. Rain is very uneven: Mawsynram in Meghalaya gets the most in the world, while western Rajasthan gets less than 60 cm a year.'
    visual: 'Draw a circle split into four: Nov–Feb (cold, with a snowflake), Mar–May (hot, with a sun and ''loo'' winds), Jun–Sep (rain clouds), Oct–Nov (clouds moving back, cyclone symbol near the east coast).'
    step_by_step: 'Step 1: Name the months. Step 2: Match the season. Step 3: Recall a special wind or rain: western disturbances (winter, north-west), loo (summer, north), mango showers (summer, Kerala), kaal baisakhi (summer, Bengal), cyclones (October–November, east coast).'
    real_world: In Kerala, pre-monsoon 'mango showers' in April and May help ripen mangoes early. Chennai gets heavy rain in November from the north-east monsoon, when most of India is dry.
  picture:
    kind: flow
    steps:
    - 'Cold season: mid-November to February'
    - 'Hot season: March to May'
    - 'Advancing monsoon: June to September'
    - 'Retreating monsoon: October and November'
    alt: 'India''s four seasons in order: cold from mid-November to February, hot from March to May, the advancing monsoon June to September, and the retreating monsoon in October and November.'
  activity:
    type: sort
    prompt: Which season?
    bins:
    - Cold weather
    - Hot weather
    - Advancing monsoon
    - Retreating monsoon
    items:
    - label: Western disturbances bring winter rain
      bin: Cold weather
      clue: Helps rabi crops.
      why: Cold weather.
    - label: Loo blows; mango showers in Kerala
      bin: Hot weather
      clue: March–May.
      why: Hot weather.
    - label: Onset in Kerala about 1 June
      bin: Advancing monsoon
      clue: Rain moves north.
      why: Advancing monsoon.
    - label: October heat; Coromandel coast gets rain
      bin: Retreating monsoon
      clue: October–November.
      why: Retreating monsoon.
    - label: Kaal baisakhi storms in Bengal
      bin: Hot weather
      clue: Before the rains.
      why: Hot weather.
  items:
  - prompt: Which place receives the highest average rainfall in the world?
    options:
    - Mawsynram
    - Cherrapunji
    - Mumbai
    - Thiruvananthapuram
    answer: Mawsynram
    difficulty: 1
    hints:
    - In Meghalaya.
    - Near Cherrapunji.
    solution: Mawsynram has the highest average rainfall in the world.
    mistakes:
      Cherrapunji: mawsynram_rain
  - prompt: Hot, dry winds that blow over north India in summer are called…
    options:
    - Loo
    - Kaal baisakhi
    - Mango showers
    - Western disturbances
    answer: Loo
    difficulty: 1
    hints:
    - Daytime summer winds.
    - They can cause heatstroke.
    solution: These winds are the loo.
    mistakes: {"Kaal baisakhi": "s9_loo"}
  - prompt: Pre-monsoon showers that help mangoes ripen in Kerala and Karnataka are called…
    options:
    - Mango showers
    - Kaal baisakhi
    - Loo
    - Cyclones
    answer: Mango showers
    difficulty: 1
    hints:
    - Named after a fruit.
    - April–May.
    solution: They are called mango showers.
    mistakes: {"Kaal baisakhi": "s9_mango_showers"}
  - prompt: Areas with less than how many cm of annual rainfall include western Rajasthan and Ladakh?
    answer: '60'
    check: '60'
    difficulty: 2
    hints:
    - Very dry areas.
    - Less than a metre; much less.
    solution: These areas get less than 60 cm a year.
    mistakes: {"100": "s9_low_rain", "20": "s9_low_rain"}
  - prompt: Winter rain in north-west India, useful for rabi crops, is brought by…
    options:
    - Western disturbances
    - The south-west monsoon
    - Loo
    - Kaal baisakhi
    answer: Western disturbances
    difficulty: 2
    hints:
    - They come from the Mediterranean region.
    - Cold weather season.
    solution: Western disturbances bring winter rain to the north-west.
    mistakes: {"The south-west monsoon": "s9_western_dist"}
  - prompt: During which months does the Coromandel coast of Tamil Nadu get much of its rain?
    options:
    - October–November
    - June–July
    - March–April
    - December–January only
    answer: October–November
    difficulty: 2
    hints:
    - Retreating monsoon.
    - North-east winds pick up moisture over the Bay of Bengal.
    solution: Tamil Nadu gets much rain in October–November during the retreating monsoon.
    mistakes:
      June–July: retreating_monsoon
  - prompt: By about which date does the monsoon usually reach Kerala?
    options:
    - 1 June
    - 15 July
    - 1 September
    - 15 March
    answer: 1 June
    difficulty: 3
    hints:
    - Start of June.
    - It covers India by mid-July.
    solution: The monsoon usually sets in over Kerala around 1 June.
    mistakes:
      15 July: monsoon_onset_kerala
