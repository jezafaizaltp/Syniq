# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 3. Format: content/README.md.
subject: cbse9-ss
chapter: 3
title: Atmosphere and Climate
tips:
  mawsynram_rain: "Two neighbouring towns in Meghalaya compete for the world record; the newer record-holder is the one that is not Cherrapunji."
  monsoon_onset_kerala: "Kerala is where the monsoon arrives first, at the start of the summer rains, in the first week of the month after May."
  retreating_monsoon: "The Coromandel coast gets most rain when the monsoon pulls back and winds blow from the north-east, late in the year."
  weather_climate: "One word describes the air at a place for a short time (hours or days); the other is the average pattern over about 30 years. Which one fits 'this afternoon'?"
  atmos_layers: "The layer closest to the ground holds nearly all water vapour, so weather happens there. The next layer up holds the ozone."
  s9_climate_years: "Climate is a long-term average, longer than a person's school years. Weather over a few years is not enough to call it climate."
  s9_el_nino: "The Gulf Stream is in the Atlantic. Which warm current appears off Peru in the Pacific?"
  s9_himalaya_wall: "The Himalayas sit to India's north like a wall. What do they stop coming from Central Asia?"
  s9_itcz: "A jet stream is a fast wind high up. Which zone is the low-pressure belt where the trade winds meet near the Equator?"
  s9_land_heats: "Land warms up faster than water. What does very hot land do to the air pressure above it?"
  s9_lapse_rate: "Mountain tops are colder than the plains below. Which way does temperature go as you climb?"
  s9_loo: "Kaal baisakhi are evening storms in Bengal. What are the hot, dry daytime winds of north India called?"
  s9_low_rain: "Look at the rainfall map key: the driest band is the lowest range shown, below the semi-arid band."
  s9_mango_showers: "Kaal baisakhi happen in Bengal and Assam. Which showers in the south are named after a fruit?"
  s9_mausim: "The Arabic word means 'season'. Which choice is the Arabic word, not a Hindi or Urdu phrase?"
  s9_nitrogen: "Oxygen is the gas we breathe, but it is not the biggest share of the air. Which gas is about 78%?"
  s9_pressure_wind: "Air is pushed out of where there is more of it. Think of air leaving a balloon."
  s9_western_dist: "The south-west monsoon brings summer rain. Which winter weather systems come from the Mediterranean side?"
  c9ss3_small_share: "That gas is the big one, about four fifths of the air. The question asks for the one fifth: the gas we need to breathe."
  c9ss3_khasi: "Mawsynram sits in the Khasi hills, in the state whose name means 'abode of clouds'."
  c9ss3_bengal_storms: "Mango showers fall in Kerala and Karnataka. The Bengal storms are named after a month of the Bengali calendar."
  c9ss3_layer_job: 'Go up from the ground: weather happens in the lowest layer, the ozone sits in the calm layer above it, meteors burn higher still, and radio waves bounce off the very high, thin, hot air.'
  c9ss3_season_months: "Place the season in the year: the cool months come before the summer heat, the big rains follow the heat, and the rains pull back as the year ends."
  c9ss3_climate_control: Climate depends on latitude, height above sea level, distance from the sea, winds, ocean currents and mountains. Which of these is different between the two places?
  c9ss3_inland_coast: Look at where each city lies on the map. What is next to one and far from the other, and how does that change summer and winter?
concepts:
- code: cbse9us.atmos.layers
  title: The atmosphere, its layers, and weather versus climate
  notes: |
    The atmosphere is the blanket of air held around the Earth by gravity. It is mostly nitrogen (about 78%)
    and oxygen (about 21%), with argon, carbon dioxide, water vapour and dust. It protects life by absorbing
    harmful ultraviolet rays, keeping temperatures moderate and burning up meteors. Layers from the ground up:
    troposphere (up to about 8 km at the poles and 18 km at the Equator; all weather, clouds and rain; it
    gets colder with height, about 6.5 °C per km), stratosphere (calm air used by jet planes; contains the
    ozone layer), mesosphere (coldest; meteors burn here), thermosphere (very hot, ionosphere reflects radio
    waves) and exosphere (outermost, thin air). Weather is the short-term state of the air (temperature,
    pressure, wind, humidity, rain); climate is the long-term average over about 30 years. Air pressure is
    the weight of air; it falls with height. Winds blow from high to low pressure. Global pressure belts and
    planetary winds (trade winds, westerlies, polar easterlies) shape climates across the world.
  explanations:
    text: The atmosphere is like a layered blanket. The bottom layer, the troposphere, is where we live and where all the weather happens. Above it, the stratosphere holds the ozone layer that shields us from UV rays. Weather is today's mood of the air; climate is its personality over many years.
    visual: 'Draw a tall column. Label from bottom: Troposphere (clouds, rain, us), Stratosphere (ozone, a jet plane), Mesosphere (a burning meteor), Thermosphere (radio waves bouncing), Exosphere (a satellite).'
    step_by_step: 'Step 1: Name what the question is about: today or many years? (weather or climate). Step 2: For layers, start from the ground: tropo, strato, meso, thermo, exo. Step 3: Link each to its clue: weather, ozone, meteors, radio, satellites.'
    real_world: Planes fly in the lower stratosphere because the air there is calm, above the bumpy clouds of the troposphere.
  picture:
    kind: flow
    steps:
    - 'Troposphere: weather'
    - 'Stratosphere: ozone layer'
    - 'Mesosphere: meteors burn'
    - 'Thermosphere: radio waves'
    - 'Exosphere: thin air'
    alt: The five layers of the atmosphere from the ground upwards, with what happens in each.
  activity:
    type: scale
    min: 0
    max: 100
    step: 1
    start: 100
    unit: km
    prompt: Height above the ground (km). Find the layer.
    zones:
    - from: 0
      to: 12
      label: Troposphere
      says: All weather happens here, up to 8–18 km.
    - from: 12
      to: 50
      label: Stratosphere
      says: Calm air for jets; the ozone layer.
    - from: 50
      to: 80
      label: Mesosphere
      says: Coldest layer; meteors burn up here.
    - from: 80
      to: 100
      label: Thermosphere
      says: Very hot; the ionosphere reflects radio waves.
    goals:
    - prompt: Where do clouds and rain form?
      zone: Troposphere
      mistakes:
      - when:
          v:
          - 13
          - 50
        say: 'That''s the stratosphere: calm, no weather. Weather is in the lowest layer.'
    - prompt: Where is the ozone layer?
      zone: Stratosphere
      mistakes:
      - when:
          v:
          - 0
          - 11
        say: That's the troposphere. Ozone is higher up, in the stratosphere.
    - prompt: Where do most meteors burn up?
      zone: Mesosphere
      mistakes:
      - when:
          v:
          - 81
          - 100
        say: 'Too high: meteors burn in the mesosphere.'
    orientation: vertical
  lesson:
    - teach: 'The atmosphere is the blanket of air held around the Earth by gravity: about 78% nitrogen, 21% oxygen, plus argon, carbon dioxide, water vapour and dust. It lets us breathe, keeps temperatures moderate, absorbs harmful ultraviolet rays and burns up most meteors.'
      check:
        prompt: What keeps the atmosphere around the Earth?
        options:
        - Gravity
        - Wind
        - Clouds
        answer: Gravity
        why: The Earth's gravity holds the air in place.
    - teach: 'Layers from the ground up: troposphere (all weather; cools about 6.5 °C per km), stratosphere (calm, jets fly here; ozone layer), mesosphere (coldest; meteors burn), thermosphere (very hot; the ionosphere reflects radio waves), exosphere (thin outer air).'
      picture:
        kind: flow
        steps:
        - 'Troposphere: weather, clouds'
        - 'Stratosphere: ozone, jet planes'
        - 'Mesosphere: meteors burn'
        - 'Thermosphere: radio waves bounce'
        - 'Exosphere: thin outer air'
        alt: Five layers of the atmosphere from the ground up, each with what happens there.
      check:
        prompt: Meteors burn up mostly in the…
        options:
        - Mesosphere
        - Troposphere
        - Exosphere
        answer: Mesosphere
        why: Friction with the air there heats them until they burn.
    - teach: 'Weather is the state of the air now or over a few days: temperature, pressure, wind, humidity, rain. Climate is the average weather of a place over about 30 years. Air pressure is the weight of the air above; it falls as you go higher. Winds blow from high pressure to low pressure.'
      check:
        prompt: '''Kerala has a hot, wet climate.'' This describes…'
        options:
        - Climate
        - Weather
        - Pressure
        answer: Climate
        why: It is the long-term pattern, not today's air.
  items:
  - prompt: In which layer of the atmosphere does almost all weather happen?
    options:
    - Troposphere
    - Stratosphere
    - Mesosphere
    - Exosphere
    answer: Troposphere
    difficulty: 1
    hints:
    - The lowest layer.
    - Clouds and rain.
    solution: 'Step 1: Clouds, rain and storms form in the lowest layer. Step 2: That is the troposphere.'
    mistakes:
      Stratosphere: atmos_layers
  - prompt: The ozone layer is found in the…
    options:
    - Stratosphere
    - Troposphere
    - Thermosphere
    - Exosphere
    answer: Stratosphere
    difficulty: 1
    hints:
    - The layer just above the weather.
    - Jet planes fly near its base.
    solution: 'Step 1: Ozone collects 15 to 35 km up. Step 2: That is in the stratosphere.'
    mistakes:
      Troposphere: atmos_layers
  - prompt: '''It rained heavily in Kochi this afternoon.'' This describes…'
    options:
    - Weather
    - Climate
    - Both equally
    - Neither
    answer: Weather
    difficulty: 1
    hints:
    - One afternoon is a short time.
    - Climate is over about 30 years.
    solution: 'Step 1: It is about one afternoon. Step 2: Short-term conditions are weather.'
    mistakes:
      Climate: weather_climate
  - prompt: Which gas makes up most of the atmosphere?
    options:
    - Nitrogen
    - Oxygen
    - Carbon dioxide
    - Water vapour
    answer: Nitrogen
    difficulty: 1
    hints:
    - About 78%.
    - Not the one we need to breathe.
    solution: 'Step 1: Air is about 78% nitrogen and 21% oxygen. Step 2: Nitrogen is the largest share.'
    mistakes: {"Oxygen": "s9_nitrogen"}
  - prompt: What happens to air temperature as you climb higher in the troposphere?
    options:
    - It falls, by about 6.5 °C per km
    - It rises
    - It stays the same
    - It doubles every km
    answer: It falls, by about 6.5 °C per km
    difficulty: 2
    hints:
    - Hill stations are cool.
    - The ground warms the air from below.
    solution: 'Step 1: The air is heated from the ground. Step 2: So it gets colder with height, about 6.5 °C for each km.'
    mistakes: {"It rises": "s9_lapse_rate"}
  - prompt: Why do winds blow?
    options:
    - Air moves from high pressure to low pressure
    - The Moon pulls the air
    - Trees push the air
    - Air moves from low pressure to high pressure
    answer: Air moves from high pressure to low pressure
    difficulty: 2
    hints:
    - Uneven heating makes pressure differences.
    - Like air rushing out of a pumped tyre.
    solution: 'Step 1: Uneven heating makes some places high pressure and others low. Step 2: Air flows from high to low: that is wind.'
    mistakes: {"Air moves from low pressure to high pressure": "s9_pressure_wind"}
  - prompt: Which layer of the atmosphere is closest to the ground?
    options:
    - Troposphere
    - Stratosphere
    - Mesosphere
    - Exosphere
    answer: Troposphere
    difficulty: 1
    hints:
    - We live in it.
    - All weather happens there.
    solution: The troposphere is the lowest layer, where we live and weather happens.
    mistakes:
      Stratosphere: atmos_layers
  - prompt: Which gas is about 21% of the air?
    options:
    - Oxygen
    - Nitrogen
    - Carbon dioxide
    - Argon
    answer: Oxygen
    difficulty: 1
    hints:
    - We need it to breathe.
    - Nitrogen is about 78%.
    solution: Oxygen is about 21% of the air.
    mistakes:
      Nitrogen: c9ss3_small_share
  - prompt: '''Tomorrow will be cloudy with light rain in Delhi.'' This is a statement about…'
    options:
    - Weather
    - Climate
    - Latitude
    - Ozone
    answer: Weather
    difficulty: 1
    hints:
    - It is about one day.
    - Short-term.
    solution: A forecast for one day describes weather.
    mistakes:
      Climate: weather_climate
  - prompt: Which layer reflects radio waves back to Earth?
    options:
    - Ionosphere (in the thermosphere)
    - Troposphere
    - Stratosphere
    - Ozone layer
    answer: Ionosphere (in the thermosphere)
    difficulty: 2
    hints:
    - It is very high and has charged particles.
    - It helps long-distance radio.
    solution: The ionosphere, part of the thermosphere, reflects radio waves.
    mistakes:
      Ozone layer: c9ss3_layer_job
  - prompt: Jet planes fly in the lower stratosphere. Why?
    options:
    - The air is calm, above most clouds and storms
    - There is no air there
    - It is the hottest layer
    - Meteors protect them
    answer: The air is calm, above most clouds and storms
    difficulty: 2
    hints:
    - Weather is in the troposphere below.
    - Calm air is safer and smoother.
    solution: The stratosphere is above the weather, so the air is calm.
    mistakes:
      It is the hottest layer: c9ss3_layer_job
  - prompt: A town at sea level is 30 °C. About what is the temperature on a hill 2 km higher, in °C?
    answer: '17'
    check: 30 - 2*6.5
    difficulty: 2
    hints:
    - Temperature falls about 6.5 °C per km.
    - 30 − 13.
    solution: '2 × 6.5 = 13 °C cooler: about 17 °C.'
    mistakes:
      '43': s9_lapse_rate
      '23.5': s9_lapse_rate
  - prompt: Why is air pressure lower on a mountain top?
    options:
    - There is less air above pressing down
    - It is closer to the Sun
    - Mountains push air away
    - There is more oxygen
    answer: There is less air above pressing down
    difficulty: 2
    hints:
    - Pressure is the weight of air above you.
    - Higher up, less air is above.
    solution: Higher up there is less air overhead, so pressure is lower.
    mistakes:
      It is closer to the Sun: s9_pressure_wind
  - prompt: Which job of the atmosphere protects us from skin damage by sunlight?
    options:
    - Ozone absorbing ultraviolet rays
    - Nitrogen feeding plants
    - Clouds making rain
    - Wind cooling us
    answer: Ozone absorbing ultraviolet rays
    difficulty: 3
    hints:
    - UV rays cause sunburn.
    - Which layer absorbs them?
    solution: The ozone layer in the stratosphere absorbs most harmful UV rays.
    mistakes:
      Clouds making rain: atmos_layers
  - prompt: Without the atmosphere, why would days be much hotter and nights much colder?
    options:
    - Nothing would block sunlight by day or trap heat at night
    - The Sun would be closer
    - There would be more oceans
    - Gravity would stop
    answer: Nothing would block sunlight by day or trap heat at night
    difficulty: 3
    hints:
    - The Moon has no atmosphere.
    - Air acts like a blanket.
    solution: The atmosphere moderates temperature, like a blanket; the airless Moon swings between extremes.
    mistakes:
      The Sun would be closer: c9ss3_layer_job
- code: cbse9us.climate.controls
  title: Climate controls and the monsoon mechanism
  notes: |
    Weather is the state of the atmosphere at a time; climate the average over 30+ years. Controls:
    latitude, altitude, pressure and winds, distance from the sea (continentality), ocean currents,
    relief. India's climate is monsoon type. Factors: Tropic of Cancer, Himalayas block cold winds, land and
    water distribution, relief. Monsoon mechanism: differential heating of land and sea, shift of ITCZ
    (Inter Tropical Convergence Zone), high pressure east of Madagascar, Tibetan plateau heating, the
    tropical easterly jet stream, El Niño. 'Monsoon' from the Arabic 'mausim' (season).
  explanations:
    text: 'Weather is what the sky is doing today; climate is the pattern over many years. India has a monsoon climate: the winds reverse direction with the seasons. In summer the land heats up much more than the sea, creating low pressure over north India. Moist winds from the Indian Ocean rush in, bringing the south-west monsoon rains.'
    visual: Draw India with a big L (low pressure) over the north-west in summer and an H (high pressure) over the Indian Ocean. Arrows curve from the H to the L across the Arabian Sea and Bay of Bengal, carrying rain clouds.
    step_by_step: 'Step 1: Land heats faster than sea in summer: low pressure over land. Step 2: High pressure stays over the ocean. Step 3: Winds blow from high to low: from sea to land. Step 4: They carry moisture and drop rain when they meet the Western Ghats and Himalayas. Step 5: In winter the pattern reverses.'
    real_world: Farmers across India watch the monsoon's arrival date closely because most crops are planted with its first rains. A delay of even two weeks can affect food prices.
  picture:
    kind: flow
    steps:
    - 'Summer: the land heats up faster than the sea'
    - Low pressure forms over north-west India
    - High pressure stays over the Indian Ocean
    - Moist winds blow from the sea towards the land
    - They bring rain from June to September
    alt: 'How the monsoon works: the land heats faster than the sea, low pressure forms over India, and moist sea winds blow in and bring rain from June to September.'
  activity:
    type: sort
    prompt: Weather or climate?
    bins:
    - Weather
    - Climate
    items:
    - label: It's raining in Kochi right now
      bin: Weather
      clue: A short time.
      why: Weather.
    - label: Kerala gets heavy rain every June
      bin: Climate
      clue: The average over many years.
      why: Climate.
    - label: Today's temperature is 34 °C
      bin: Weather
      clue: One day.
      why: Weather.
    - label: Rajasthan is dry year after year
      bin: Climate
      clue: Long-term.
      why: Climate.
    - label: A storm is expected tonight
      bin: Weather
      clue: Short-term.
      why: Weather.
    - label: India has a monsoon type
      bin: Climate
      clue: Over 30+ years.
      why: Climate.
  lesson:
    - teach: 'Why do places have different climates? Six controls: latitude (nearer the Equator is hotter), altitude (higher is cooler), pressure and winds, distance from the sea (coasts are milder, inland has extremes), ocean currents, and relief (mountains block winds and rain).'
      picture:
        kind: compare
        columns:
        - title: Control
          points:
          - Latitude
          - Altitude
          - Distance from sea
          - Relief
        - title: Example
          points:
          - Chennai warmer than Delhi in winter
          - Shimla cooler than Chandigarh
          - Mumbai milder than Nagpur
          - Western Ghats wet on the west side
        alt: Four climate controls each with an Indian example.
      check:
        prompt: Shimla is cooler than Chandigarh mainly because of…
        options:
        - Altitude
        - Latitude
        - Ocean currents
        answer: Altitude
        why: Shimla is much higher up.
    - teach: 'India has a monsoon climate: seasons decided by winds that reverse direction. The Himalayas shield India from icy Central Asian winds, so the north stays warmer in winter than other places at the same latitude. The Tropic of Cancer runs through the middle of India.'
      check:
        prompt: What do the Himalayas block?
        options:
        - Cold winds from Central Asia
        - The south-west monsoon from the sea
        - Sunlight
        answer: Cold winds from Central Asia
        why: They act like a wall to the north.
    - teach: 'How the monsoon works: in summer the land heats up much more than the sea, creating low pressure over north-west India. The ITCZ (where trade winds meet) shifts north. Moist winds from the Indian Ocean rush towards the low, bringing rain. Heating of the Tibetan plateau and jet streams help; El Niño (warm water off Peru) can weaken the monsoon.'
      check:
        prompt: Why do moist winds blow from the sea onto India in summer?
        options:
        - The land is hotter, so pressure over it is lower
        - The sea is hotter
        - The Himalayas pull them
        answer: The land is hotter, so pressure over it is lower
        why: Winds move from high pressure (sea) to low pressure (land).
  items:
  - prompt: The word 'monsoon' comes from the Arabic word…
    options:
    - Mausim
    - Mansoor
    - Musafir
    - Mausam-e-garma
    answer: Mausim
    difficulty: 1
    hints:
    - It means season.
    - Arab sailors used it.
    solution: '''Monsoon'' comes from ''mausim'', meaning season.'
    mistakes: {"Mausam-e-garma": "s9_mausim", "Mansoor": "s9_mausim"}
  - prompt: Climate is the average weather over a period of at least how many years?
    answer: '30'
    check: '30'
    difficulty: 1
    hints:
    - Several decades.
    - Three decades.
    solution: Climate is the average over more than 30 years.
    mistakes: {"10": "s9_climate_years", "100": "s9_climate_years"}
  - prompt: Why do the Himalayas matter for India's climate?
    options:
    - They block cold winds from Central Asia
    - They make India colder
    - They stop all rain
    - They create deserts in the south
    answer: They block cold winds from Central Asia
    difficulty: 2
    hints:
    - Think of a wall to the north.
    - Winters are milder than in Central Asia.
    solution: The Himalayas shield India from icy northern winds and trap monsoon winds.
    mistakes: {"They make India colder": "s9_himalaya_wall"}
  - prompt: The low-pressure belt near the Equator where trade winds meet is called the…
    options:
    - ITCZ
    - Jet stream
    - El Niño
    - Western disturbance
    answer: ITCZ
    difficulty: 2
    hints:
    - Inter Tropical Convergence Zone.
    - It shifts north in summer.
    solution: This is the Inter Tropical Convergence Zone (ITCZ).
    mistakes: {"Jet stream": "s9_itcz"}
  - prompt: In summer, why is there low pressure over north-west India?
    options:
    - The land heats up much more than the sea
    - It is close to the sea
    - Snow covers it
    - It is at high altitude
    answer: The land heats up much more than the sea
    difficulty: 2
    hints:
    - Hot air rises.
    - Differential heating.
    solution: Intense heating of the land creates low pressure that draws in moist sea winds.
    mistakes: {"It is close to the sea": "s9_land_heats"}
  - prompt: Which warm ocean current off Peru, when present, can weaken the Indian monsoon?
    options:
    - El Niño
    - Gulf Stream
    - Kuroshio
    - Labrador Current
    answer: El Niño
    difficulty: 3
    hints:
    - Spanish for 'the child'.
    - Appears every few years.
    solution: El Niño, a warm current off Peru, is linked with weaker monsoons in India.
    mistakes: {"Gulf Stream": "s9_el_nino"}
  - prompt: Which line of latitude passes through the middle of India?
    options:
    - Tropic of Cancer
    - Equator
    - Tropic of Capricorn
    - Arctic Circle
    answer: Tropic of Cancer
    difficulty: 1
    hints:
    - It is about 23.5° N.
    - India is north of the Equator.
    solution: The Tropic of Cancer (23.5° N) passes through the middle of India.
    mistakes:
      Equator: c9ss3_climate_control
  - prompt: Why are coastal places like Mumbai milder than inland places like Nagpur?
    options:
    - The sea keeps temperatures moderate
    - They are higher up
    - They get no rain
    - They are nearer the Equator by a lot
    answer: The sea keeps temperatures moderate
    difficulty: 1
    hints:
    - Water heats and cools slowly.
    - This is called continentality inland.
    solution: The sea moderates coastal temperatures; inland places have hotter summers and colder winters.
    mistakes:
      They are higher up: c9ss3_climate_control
  - prompt: The word 'monsoon' refers to winds that…
    options:
    - Change direction with the seasons
    - Blow the same way all year
    - Blow only at night
    - Never bring rain
    answer: Change direction with the seasons
    difficulty: 1
    hints:
    - '''Mausim'' means season.'
    - Summer and winter winds differ.
    solution: Monsoon winds reverse direction between summer and winter.
    mistakes:
      Blow the same way all year: s9_mausim
  - prompt: Leh in Ladakh is very cold in winter though it is at about the same latitude as parts of Punjab. Why?
    options:
    - It is at a very high altitude
    - It is near the sea
    - It gets heavy monsoon rain
    - It is on the Equator
    answer: It is at a very high altitude
    difficulty: 2
    hints:
    - Leh is about 3500 m up.
    - Temperature falls with height.
    solution: Leh's great height makes it very cold.
    mistakes:
      It is near the sea: c9ss3_climate_control
  - prompt: In summer, why does pressure fall over north-west India?
    options:
    - Strong heating makes the air rise
    - Snow falls there
    - The sea is near
    - Winds stop
    answer: Strong heating makes the air rise
    difficulty: 2
    hints:
    - Hot land, hot air.
    - Rising air leaves low pressure.
    solution: Intense summer heating makes air rise, creating a low-pressure area.
    mistakes:
      Snow falls there: s9_land_heats
  - prompt: Which of these can weaken the Indian monsoon?
    options:
    - El Niño
    - The Himalayas
    - The Tropic of Cancer
    - The Western Ghats
    answer: El Niño
    difficulty: 2
    hints:
    - It is a warm current in the Pacific.
    - It appears off Peru in some years.
    solution: El Niño years often bring weaker monsoon rains to India.
    mistakes:
      The Himalayas: s9_el_nino
  - prompt: Why is the windward (west) side of the Western Ghats much wetter than the leeward (east) side?
    options:
    - Moist winds rise up the west slopes and drop their rain there
    - The east side is closer to the sea
    - The east side is higher
    - Rain falls only at night on the east
    answer: Moist winds rise up the west slopes and drop their rain there
    difficulty: 3
    hints:
    - Rising air cools and its moisture condenses.
    - Little is left for the other side.
    solution: The monsoon winds rise and cool on the west, raining heavily; the east lies in the rain shadow.
    mistakes:
      The east side is closer to the sea: c9ss3_climate_control
  - prompt: Where is the ITCZ found in July?
    options:
    - Shifted north, over the Ganga plain
    - Over the South Pole
    - Exactly at the Equator
    - Over Australia
    answer: Shifted north, over the Ganga plain
