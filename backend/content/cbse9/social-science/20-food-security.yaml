# CBSE Class 9 Social Science (NCERT), Economics chapter 4. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 20
title: Food Security in India

tips:
  food_security_three: "Food security means availability (enough food grown or stored), accessibility (food within reach of everyone) and affordability (enough money to buy it)."
  buffer_stock_fci: "The Food Corporation of India buys grain from farmers at the Minimum Support Price and keeps it as buffer stock."
  pds_ration: "Ration shops (fair price shops) under the Public Distribution System sell grain, sugar and kerosene at prices below the market."

concepts:
  - code: cbse9ss.food.meaning
    title: What food security means and who is food insecure
    notes: |
      Food security: availability, accessibility, affordability of food for all at all times. Threatened in
      calamities (drought, floods) and famines; Bengal Famine 1943 killed about 30 lakh people. Chronic
      hunger (always inadequate food) vs seasonal hunger (part of the year). Food insecure: landless
      labourers, traditional artisans, petty self-employed, beggars; urban casual workers; SCs, STs and some
      OBCs; areas like Uttar Pradesh, Bihar, Jharkhand, Odisha, West Bengal, Chhattisgarh, parts of MP and
      Maharashtra. Self-sufficiency in food grains since the Green Revolution (wheat first, Punjab and
      Haryana).
    explanations:
      text: "Food security means everyone has enough nutritious food at all times. That needs three things: enough food in the country (availability), food that reaches everyone (accessibility) and money to buy it (affordability). Disasters can break this, as in the Bengal Famine of 1943 when about 30 lakh people died. Hunger can be chronic (always) or seasonal (in some months)."
      visual: "Draw a three-legged stool labelled Availability, Accessibility, Affordability. A family sits on it. If any leg breaks, from a drought, a blocked road or lost wages, the family falls into hunger."
      step_by_step: "Step 1: Is enough food produced or stored? Availability. Step 2: Can it reach the person? Accessibility. Step 3: Can they pay for it? Affordability. Step 4: Is the hunger all year or only some months? Chronic or seasonal."
      real_world: "During the 2018 Kerala floods, food was available in the state, but many families were cut off. Relief camps and ration shops kept the accessibility leg of the stool standing."
    items:
      - prompt: "Which three dimensions make up food security?"
        options: ["Availability, accessibility, affordability", "Growing, cooking, eating", "Buying, selling, storing", "Rice, wheat, pulses"]
        answer: "Availability, accessibility, affordability"
        difficulty: 1
        hints: ["Three A's.", "Is there food, can you reach it, can you pay?"]
        solution: "Availability, accessibility and affordability."
        mistakes: {"Buying, selling, storing": food_security_three}
      - prompt: "In which year did the Bengal Famine take place?"
        answer: "1943"
        check: "1943"
        difficulty: 1
        hints: ["During the Second World War.", "Before independence."]
        solution: "The Bengal Famine was in 1943."
      - prompt: "About how many lakh people died in the Bengal Famine?"
        answer: "30"
        check: "30"
        difficulty: 2
        hints: ["3 million.", "Thirty lakh."]
        solution: "About 30 lakh (3 million) people died."
      - prompt: "Hunger that lasts only during certain months of the year is called…"
        options: ["Seasonal hunger", "Chronic hunger", "Famine", "Malnutrition only"]
        answer: "Seasonal hunger"
        difficulty: 1
        hints: ["Linked to farming cycles.", "Not all year."]
        solution: "This is seasonal hunger."
      - prompt: "Which crop's production rose first and most during the Green Revolution?"
        options: ["Wheat", "Cotton", "Tea", "Jute"]
        answer: "Wheat"
        difficulty: 2
        hints: ["Punjab and Haryana.", "A rabi grain."]
        solution: "Wheat production rose fastest, especially in Punjab and Haryana."
      - prompt: "Which group is among the most food insecure, according to NCERT?"
        options: ["Landless agricultural labourers", "Large farmers", "Government employees", "Shop owners in cities"]
        answer: "Landless agricultural labourers"
        difficulty: 3
        hints: ["No land, irregular income.", "Rural poor."]
        solution: "Landless labourers are among the most food insecure."

  - code: cbse9ss.food.system
    title: Buffer stock, PDS and cooperatives
    after: [cbse9ss.food.meaning]
    notes: |
      Food security system: buffer stock and Public Distribution System. Food Corporation of India (FCI)
      procures wheat and rice at Minimum Support Price (MSP) announced before sowing; issue price lower than
      market. PDS through about 5.5 lakh ration (fair price) shops. Ration cards: Antyodaya (poorest),
      BPL, APL. National Food Security Act 2013: 75% rural and 50% urban population eligible. Schemes:
      Antyodaya Anna Yojana (2000; 35 kg per family per month), Targeted PDS (1997). Problems: overflowing
      granaries, leakages, poor quality. Cooperatives: Mother Dairy (Delhi), Amul (Gujarat, White
      Revolution), Academy of Development Science grain banks (Maharashtra).
    explanations:
      text: "The government keeps India fed through two systems. The Food Corporation of India buys wheat and rice from farmers at a Minimum Support Price and stores it as a buffer stock. Then the Public Distribution System sells this grain cheaply through ration shops. The National Food Security Act of 2013 covers 75% of rural and 50% of urban people."
      visual: "Draw a chain: farmer → FCI warehouse (buffer stock, bought at MSP) → ration shop (PDS) → family with a ration card. Under the warehouse, write 'saved for bad years'."
      step_by_step: "Step 1: Before sowing, the government announces the MSP. Step 2: FCI buys surplus grain at MSP. Step 3: Grain is stored as buffer stock. Step 4: It is sold at a lower issue price in ration shops. Step 5: Families use ration cards (Antyodaya, BPL, APL)."
      real_world: "Kerala's ration shops supply rice to almost every family. In 2020, free rice and kits through ration shops helped families through the lockdown."
    picture:
      kind: flow
      steps: [The farmer sells grain to the FCI at the minimum support price, The FCI stores it as a buffer stock, Grain goes out to ration shops (the PDS), Families buy it cheaply with a ration card]
      alt: 'Food security chain: farmers sell grain to the Food Corporation of India at the minimum support price, it is stored as buffer stock and sold cheaply through ration shops.'
    items:
      - prompt: "Which organisation buys and stores food grains for the buffer stock?"
        options: ["Food Corporation of India", "Reserve Bank of India", "Election Commission", "NITI Aayog"]
        answer: "Food Corporation of India"
        difficulty: 1
        hints: ["FCI.", "Buys at MSP."]
        solution: "The Food Corporation of India (FCI)."
        mistakes: {"Reserve Bank of India": buffer_stock_fci}
      - prompt: "Under the National Food Security Act 2013, what percentage of the rural population is eligible?"
        answer: "75"
        check: "75"
        difficulty: 2
        hints: ["Three quarters.", "Urban is 50%."]
        solution: "75% of the rural population."
      - prompt: "The price at which the government buys grain from farmers, announced before sowing, is the…"
        options: ["Minimum Support Price", "Issue price", "Market price", "Retail price"]
        answer: "Minimum Support Price"
        difficulty: 1
        hints: ["MSP.", "It supports farmers."]
        solution: "The Minimum Support Price (MSP)."
      - prompt: "How many kg of food grains per family per month were given under Antyodaya Anna Yojana?"
        answer: "35"
        check: "35"
        difficulty: 2
        hints: ["Raised from 25 kg.", "Between 30 and 40."]
        solution: "35 kg per family per month."
      - prompt: "Ration shops that sell grain cheaply are part of the…"
        options: ["Public Distribution System", "Stock market", "Green Revolution", "MGNREGA"]
        answer: "Public Distribution System"
        difficulty: 1
        hints: ["PDS.", "Fair price shops."]
        solution: "They are part of the Public Distribution System."
        mistakes: {"Stock market": pds_ration}
      - prompt: "Which cooperative in Gujarat led the White Revolution?"
        options: ["Amul", "Mother Dairy", "FCI", "Nafed"]
        answer: "Amul"
        difficulty: 2
        hints: ["Famous for milk and butter.", "Anand, Gujarat."]
        solution: "Amul led the White Revolution in milk."
      - prompt: "Under the 2013 Act, what percentage of the urban population is eligible?"
        answer: "50"
        check: "50"
        difficulty: 3
        hints: ["Half.", "Rural is 75%."]
        solution: "50% of the urban population."
