# CBSE Class 9 Social Science (NCERT), Economics chapter 3. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 19
title: Poverty as a Challenge

tips:
  poverty_line_calories: "India's poverty line was based on calories: 2,400 per person per day in rural areas and 2,100 in urban areas. Rural needs are higher because work is more physical."
  poverty_ratio: "Poverty ratio = number of poor ÷ total population × 100."

concepts:
  - code: cbse9ss.poverty.line
    title: Measuring poverty
    notes: |
      Poverty: hunger, lack of shelter, illiteracy, ill health, lack of clean water and sanitation, no
      regular job, helplessness. Social exclusion and vulnerability. Poverty line based on minimum
      consumption: calorie requirement of 2,400 per person per day in rural areas and 2,100 in urban areas;
      monetary poverty line (e.g. ₹816 rural, ₹1,000 urban per person per month in 2011–12). World Bank:
      $1.90 a day (2011 PPP). Poverty ratio in India fell from about 45% (1993–94) to about 22% (2011–12);
      about 270 million poor in 2011–12. Vulnerable groups: Scheduled Castes and Tribes, rural agricultural
      labourers, urban casual labourers. Inter-state disparities: Bihar and Odisha highest; Kerala, Punjab,
      Himachal low.
    explanations:
      text: "A family is considered poor if it can't afford the minimum food, clothing, shelter and other basics. India's poverty line was based on calories: 2,400 a day in villages and 2,100 in towns, converted into money. In 2011–12 the line was about ₹816 a month per person in villages and ₹1,000 in towns. About 22% of Indians were below it then, down from about 45% in 1993–94."
      visual: "Draw a horizontal line across a bar chart of monthly spending. Families whose bars stop below the line are counted as poor. Over the years, fewer bars stop below it."
      step_by_step: "Step 1: Work out the minimum needs (calories, clothing, shelter). Step 2: Convert to money: the poverty line. Step 3: Count people spending below it. Step 4: Poverty ratio = poor ÷ total × 100."
      real_world: "Kerala reduced poverty sharply by investing in education, health, land reforms and public food distribution, while some states with fast growth still have many poor people."
    items:
      - prompt: "What was the calorie requirement used for the rural poverty line, per person per day?"
        answer: "2400"
        check: "2400"
        difficulty: 1
        hints: ["Higher than urban.", "Rural work is more physical."]
        solution: "2,400 calories per person per day in rural areas."
        mistakes: {"2100": poverty_line_calories}
      - prompt: "What was the calorie requirement used for the urban poverty line, per person per day?"
        answer: "2100"
        check: "2100"
        difficulty: 1
        hints: ["Lower than rural.", "Just over two thousand."]
        solution: "2,100 calories per person per day in urban areas."
        mistakes: {"2400": poverty_line_calories}
      - prompt: "Why is the calorie need higher in rural areas?"
        options: ["People do more physical work", "Food is cheaper", "There are more children", "The weather is colder"]
        answer: "People do more physical work"
        difficulty: 2
        hints: ["Farming is hard work.", "More energy needed."]
        solution: "Rural people usually do more physical work, so they need more calories."
      - prompt: "A town has 50,000 people, of whom 9,000 are below the poverty line. What is its poverty ratio, in percent?"
        answer: "18"
        check: "9000/50000*100"
        difficulty: 2
        hints: ["Poor ÷ total × 100.", "9,000 ÷ 50,000 × 100."]
        solution: "9,000 ÷ 50,000 × 100 = 18%."
        mistakes: {"0.18": poverty_ratio}
      - prompt: "Which group is among the most vulnerable to poverty, according to NCERT?"
        options: ["Rural agricultural labourers", "Government officers", "Large landowners", "Bank managers"]
        answer: "Rural agricultural labourers"
        difficulty: 1
        hints: ["Low, irregular wages.", "Often landless."]
        solution: "Rural agricultural labourers are among the most vulnerable."
      - prompt: "India's poverty ratio was about what percent in 2011–12?"
        answer: "22"
        check: "22"
        difficulty: 3
        hints: ["Down from about 45% in 1993–94.", "Just over a fifth."]
        solution: "About 22% in 2011–12."

  - code: cbse9ss.poverty.causes
    title: Causes of poverty and anti-poverty measures
    after: [cbse9ss.poverty.line]
    notes: |
      Causes: low economic development under colonial rule, high population growth, unequal land
      distribution (failure of land reforms), socio-cultural factors (spending on ceremonies), indebtedness,
      lack of jobs. Anti-poverty strategy: promotion of economic growth and targeted programmes. Programmes:
      MGNREGA 2005 (100 days of wage employment a year to rural households; one-third jobs for women),
      PMRY (1993), REGP (1995), SGSY (1999), PMGY (2000), Antyodaya Anna Yojana. Future challenges: health,
      education, job security, gender equity.
    explanations:
      text: "Poverty in India has many roots: slow growth under colonial rule, rapid population growth, unequal ownership of land, debt, and too few jobs. The government fights it in two ways: by helping the economy grow and through targeted schemes like MGNREGA, which guarantees 100 days of paid work a year to every rural household that wants it."
      visual: "Draw a tree with roots labelled 'colonial past', 'population growth', 'unequal land', 'debt', 'few jobs'. Its fruit is poverty. Then draw two tools cutting at it: 'economic growth' and 'targeted schemes (MGNREGA)'."
      step_by_step: "Step 1: Identify the cause: history, population, land, debt or jobs. Step 2: Match the remedy: growth for jobs, land reform for land, schemes like MGNREGA for work, food schemes for hunger. Step 3: Look ahead: health, education and jobs are the next challenges."
      real_world: "Under MGNREGA, village workers build ponds, roads and wells. Many women in Kerala's villages earn their own income through it."
    items:
      - prompt: "MGNREGA guarantees how many days of wage employment a year to rural households?"
        answer: "100"
        check: "100"
        difficulty: 1
        hints: ["A round number.", "One hundred."]
        solution: "MGNREGA provides 100 days of work a year."
      - prompt: "In which year was MGNREGA passed?"
        answer: "2005"
        check: "2005"
        difficulty: 2
        hints: ["Mid-2000s.", "Early in that decade."]
        solution: "MGNREGA was passed in 2005."
      - prompt: "Under MGNREGA, what fraction of jobs are reserved for women? Type a fraction."
        answer: "1/3"
        check: "1/3"
        difficulty: 2
        hints: ["One-third.", "A fraction with 3 at the bottom."]
        solution: "One-third of the jobs are reserved for women."
      - prompt: "Which is a cause of poverty in India?"
        options: ["Unequal distribution of land", "Too many jobs", "Very low population growth", "High literacy"]
        answer: "Unequal distribution of land"
        difficulty: 1
        hints: ["Land reforms were not fully carried out.", "Few own most land."]
        solution: "Unequal land distribution keeps many families poor."
      - prompt: "What is India's two-part anti-poverty strategy?"
        options: ["Economic growth and targeted anti-poverty programmes", "Higher taxes and fewer schools", "Closing factories and more farms", "Only charity"]
        answer: "Economic growth and targeted anti-poverty programmes"
        difficulty: 2
        hints: ["One broad, one specific.", "Growth plus schemes."]
        solution: "Promote growth and run targeted programmes for the poor."
      - prompt: "Which state had among the highest poverty ratios, according to NCERT's figures for 2011–12?"
        options: ["Bihar", "Kerala", "Punjab", "Himachal Pradesh"]
        answer: "Bihar"
        difficulty: 3
        hints: ["Also Odisha.", "Kerala and Punjab were low."]
        solution: "Bihar and Odisha had among the highest poverty ratios."
