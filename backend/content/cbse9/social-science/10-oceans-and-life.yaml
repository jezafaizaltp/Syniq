    solution: The EEZ gives a country exclusive rights over its resources, while ships may still pass.
    mistakes:
      Right to stop all ships passing: c9ss10_zone_distance
  - prompt: Why do ocean warning systems use deep-ocean buoys?
    options:
    - To detect tsunami waves far out at sea
    - To catch fish
    - To mark the high seas
    - To make waves
    answer: To detect tsunami waves far out at sea
    difficulty: 3
    hints:
    - They float far from shore.
    - Early detection gives time to escape.
    solution: 'Step 1: Buoys measure changes in sea level far from land. Step 2: This gives early warning before a tsunami reaches the coast.'
    mistakes:
      To catch fish: c9ss10_water_moves
