# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 10. Format: content/README.md.
subject: cbse9-ss
chapter: 10
title: Oceans and Life
tips:
  waves_tides_currents: "Waves come from wind; tides from the pull of a heavenly body's gravity; tsunamis from a sudden shake of the sea floor; currents from winds, Earth's spin and differences in heat and salt."
  maritime_zones: "Zones grow outward from the coast: territorial waters, then a contiguous zone at twice that distance, then a much wider economic zone. Beyond, the high seas belong to no one country."
  s9_blue_economy: "'Blue' stands for the ocean. The idea is to use it and keep it healthy."
  s9_mariana: "Ridges rise up from the sea floor. The deepest point is in a trench in the Pacific."
  s9_nonliving: "Fish, seaweed and prawns are alive. Which resource is not?"
  s9_shelf: "The abyssal plain is far out and deep. Which part is shallow and next to the land?"
  s9_spring_tide: "Spring tides have nothing to do with the season. They happen when the Sun, Moon and Earth line up."
  s9_tsunami_warning: "A tsunami starts at sea. Which instruments measure the sea itself?"
  c9ss10_land_share: That is roughly the share of the Earth covered by land. The question asks about water.
  c9ss10_floor_shape: Picture walking out from the beach into the sea. Is this part shallow and near land, a steep drop, a wide deep plain, a long mountain chain, or a narrow deep gash?
  c9ss10_water_moves: Sort the movement. Is it made by wind on the surface, by the pull of the Moon, or a steady river-like stream inside the ocean?
  c9ss10_moon_phase: Think about where the Sun and Moon are. When they line up, their pulls add together.
  c9ss10_warm_cold: Ask where the current comes from. Water from the Equator brings warmth; water from the poles brings cold.
  c9ss10_zone_distance: Each zone is measured from the coast in nautical miles. Recall the order 12, 24, 200 and what each one allows.
  c9ss10_next_zone: Start at the edge of territorial waters and move one zone outward. That zone is twice as wide from the coast.
  c9ss10_living: Ask whether the resource is alive or grew from life in the sea, or whether it is a mineral, fuel or form of energy.
  c9ss10_blue: Blue Economy has two halves. Using the ocean for jobs and growth, and keeping it healthy. Does the option keep both?
concepts:
- code: cbse9us.ocean.floor_movements
  title: The ocean floor and movements of ocean water
  notes: |
    Oceans cover about 71% of the Earth. The ocean floor has relief like land: the continental shelf (shallow,
    gently sloping edge of a continent, rich in fish and oil), the continental slope, the deep abyssal plains,
    mid-ocean ridges (underwater mountain chains where plates move apart), deep trenches (the Mariana Trench
    in the Pacific, about 11 km deep, is the deepest point on Earth), and seamounts and flat-topped guyots
    (underwater volcanoes). Ocean water moves in three main ways. Waves are made by wind blowing over the
    surface; huge waves called tsunamis are set off by undersea earthquakes. Tides are the regular rise and
    fall of sea level, about twice a day, caused mainly by the Moon's gravity (and the Sun's); spring tides
    (highest) come at full and new moon, neap tides at quarter moons. Currents are large streams of water
    moving in set directions, driven by winds, Earth's rotation and differences in temperature and salinity;
    warm currents (Gulf Stream) warm coasts, cold currents (Labrador) cool them.
  explanations:
    text: 'Under the sea lies a hidden landscape: shallow shelves near the coast, vast flat plains, underwater mountain chains and trenches deeper than Everest is tall. The water itself never rests: wind makes waves, the Moon pulls tides in and out, and currents flow like rivers across the oceans.'
    visual: 'Draw a cross-section from the coast: a gently sloping shelf, a steep slope, a flat deep plain, a ridge rising in the middle and a narrow V-shaped trench on the far side.'
    step_by_step: 'Step 1: Near the coast → continental shelf. Step 2: Deep and flat → abyssal plain. Step 3: Mountain chain underwater → ridge; very deep narrow gap → trench. Step 4: For movement, ask the cause: wind (waves), Moon (tides), steady flow (currents).'
    real_world: Fishers in Kerala plan trips around the tides, and the continental shelf off the west coast is one of India's richest fishing grounds.
  picture:
    kind: flow
    steps:
    - Coast
    - Continental shelf
    - Continental slope
    - Abyssal plain
    - Mid-ocean ridge or trench
    alt: 'The ocean floor from the coast outwards: continental shelf, slope, abyssal plain and then ridges or trenches.'
  activity:
    type: order
    prompt: 'From the coast to the deep sea: put the ocean floor in order.'
    steps:
    - Continental shelf
    - Continental slope
    - Abyssal plain
    - Trench (like the Mariana Trench)
    reasons:
      Continental slope: The shelf ends at the slope, which drops steeply.
      Abyssal plain: Below the slope lie the deep plains.
      Trench (like the Mariana Trench): Trenches are the deepest parts, cut into the floor.
  lesson:
    - teach: 'Oceans cover about 71% of the Earth. The ocean floor has its own relief. Next to each continent is the continental shelf: shallow, gently sloping, rich in fish and oil. Then the continental slope drops steeply to the deep, flat abyssal plains. Mid-ocean ridges are long underwater mountain chains where plates move apart, and trenches are narrow, very deep cuts. The Mariana Trench in the Pacific, about 11 km deep, is the deepest point on Earth. Seamounts and flat-topped guyots are underwater volcanoes.'
      picture:
        kind: flow
        steps:
        - Coast
        - Continental shelf (shallow)
        - Continental slope (steep)
        - Abyssal plain (deep, flat)
        - Trench (deepest)
        alt: 'Going out from the coast: continental shelf, continental slope, abyssal plain, and a deep trench.'
      check:
        prompt: Which part of the ocean floor is nearest the coast and shallow?
        options:
        - Continental shelf
        - Abyssal plain
        - Trench
        answer: Continental shelf
        why: It is the submerged edge of the continent.
    - teach: 'Ocean water moves in three main ways. Waves are made by wind blowing on the surface; a tsunami is a giant wave set off by an undersea earthquake. Tides are the rise and fall of sea level about twice a day, caused mainly by the Moon''s gravity, helped by the Sun. When Sun, Moon and Earth line up, at full moon and new moon, we get the highest tides: spring tides. At quarter moons we get the weakest: neap tides.'
      check:
        prompt: Spring tides happen at…
        options:
        - Full moon and new moon
        - Quarter moons
        - Only in spring
        answer: Full moon and new moon
        why: Sun and Moon pull in a line.
    - teach: Currents are huge streams of water flowing in set paths, driven by winds, the Earth's rotation, and differences in temperature and salinity. Warm currents flow from the Equator towards the poles and warm the coasts they pass, like the Gulf Stream near western Europe. Cold currents flow from the poles and cool coasts, like the Labrador Current near Canada.
      check:
        prompt: The Gulf Stream is a…
        options:
        - Warm current
        - Cold current
        - Tide
        answer: Warm current
        why: It carries warm water from near the Equator.
  items:
  - prompt: What mainly causes the tides?
    options:
    - The pull of the Moon's gravity
    - Wind
    - Earthquakes
    - River water
    answer: The pull of the Moon's gravity
    difficulty: 1
    hints:
    - Twice a day.
    - Spring tides come at full moon.
    solution: 'Step 1: The Moon''s gravity pulls on the oceans. Step 2: This makes the sea rise and fall: tides.'
    mistakes:
      Wind: waves_tides_currents
  - prompt: The deepest point on Earth is in the…
    options:
    - Mariana Trench
    - Indian Ocean ridge
    - Bay of Bengal
    - Arabian Sea shelf
    answer: Mariana Trench
    difficulty: 1
    hints:
    - In the Pacific Ocean.
    - About 11 km deep.
    solution: 'Step 1: Trenches are the deepest parts of oceans. Step 2: The Mariana Trench in the Pacific is the deepest.'
    mistakes: {"Indian Ocean ridge": "s9_mariana"}
  - prompt: The shallow, gently sloping sea floor next to a continent is the…
    options:
    - Continental shelf
    - Abyssal plain
    - Trench
    - Mid-ocean ridge
    answer: Continental shelf
    difficulty: 1
    hints:
    - Like a shelf around the land.
    - Rich in fish.
    solution: 'Step 1: Near the coast the sea is shallow. Step 2: That gently sloping part is the continental shelf.'
    mistakes: {"Abyssal plain": "s9_shelf", "Trench": "s9_shelf"}
  - prompt: A tsunami is usually triggered by…
    options:
    - An undersea earthquake
    - A strong sea breeze
    - The full moon
    - Heavy rain
    answer: An undersea earthquake
    difficulty: 2
    hints:
    - The 2004 Indian Ocean tsunami.
    - The sea floor suddenly moves.
    solution: 'Step 1: A sudden shift of the sea floor pushes a huge mass of water. Step 2: That sets off a tsunami.'
    mistakes:
      The full moon: waves_tides_currents
  - prompt: When do the highest tides (spring tides) occur?
    options:
    - At full moon and new moon
    - Only at quarter moons
    - Only in spring season
    - Only during storms
    answer: At full moon and new moon
    difficulty: 2
    hints:
    - Sun, Moon and Earth in a line.
    - Not about the season.
    solution: 'Step 1: At full and new moon the Sun and Moon pull in line. Step 2: Their pulls add up and give the highest tides.'
    mistakes: {"Only in spring season": "s9_spring_tide"}
  - prompt: Ocean currents are caused by…
    options:
    - Winds, Earth's rotation and differences in temperature and salinity
    - Only the Moon
    - Only ships
    - Only rivers
    answer: Winds, Earth's rotation and differences in temperature and salinity
    difficulty: 2
    hints:
    - More than one cause.
    - Warm and cold water move differently.
    solution: 'Step 1: Steady winds push surface water. Step 2: Earth''s rotation turns it, and differences in heat and salt keep water moving.'
    mistakes:
      Only the Moon: waves_tides_currents
  - prompt: What are the weakest tides, at quarter moons, called?
    options:
    - Neap tides
    - Spring tides
    - Tsunamis
    - Currents
    answer: Neap tides
    difficulty: 1
    hints:
    - They are the opposite of spring tides.
    - The Sun and Moon pull at right angles.
    solution: At quarter moons, the pulls partly cancel and we get neap tides.
    mistakes:
      Spring tides: c9ss10_moon_phase
  - prompt: A long underwater mountain chain where plates move apart is a…
    options:
    - Mid-ocean ridge
    - Continental shelf
    - Abyssal plain
    - Lagoon
    answer: Mid-ocean ridge
    difficulty: 2
    hints:
    - Mountains under the sea.
    - Found near the middle of oceans.
    solution: Mid-ocean ridges form where plates pull apart and magma rises.
    mistakes:
      Abyssal plain: c9ss10_floor_shape
  - prompt: The Labrador Current cools the coast of eastern Canada. It is a…
    options:
    - Cold current
    - Warm current
    - Spring tide
    - Tsunami
    answer: Cold current
    difficulty: 1
    hints:
    - It cools the coast.
    - It comes from the Arctic.
    solution: Currents from polar waters are cold and cool the coasts they pass.
    mistakes:
      Warm current: c9ss10_warm_cold
  - prompt: About what percentage of the Earth's surface do oceans cover?
    answer: 71
    check: '71'
    difficulty: 1
    hints:
    - More than two-thirds.
    - Less than three-quarters.
    solution: Oceans cover about 71% of the Earth.
    mistakes:
      '29': c9ss10_land_share
  - prompt: Ordinary waves on a beach are made mainly by…
    options:
    - Wind blowing over the water
    - The Moon's gravity
    - Earthquakes
    - Rivers
    answer: Wind blowing over the water
    difficulty: 1
    hints:
    - Watch the sea on a windy day.
    - Tides, not waves, follow the Moon.
    solution: Wind passes energy to surface water, making waves.
    mistakes:
      The Moon's gravity: c9ss10_water_moves
  - prompt: Why is the continental shelf important to people?
    options:
    - It is rich in fish and oil
    - It is the deepest place
    - Nothing lives there
    - It is made of ice
    answer: It is rich in fish and oil
    difficulty: 2
    hints:
    - It is shallow and sunlit.
    - Mumbai High is offshore here.
    solution: Shallow, sunlit shelves support fish, and many oil fields lie under them.
    mistakes:
      It is the deepest place: c9ss10_floor_shape
  - prompt: A flat-topped underwater volcano is called a…
    options:
    - Guyot
    - Trench
    - Shelf
    - Tide
    answer: Guyot
    difficulty: 3
    hints:
    - Seamounts are underwater volcanoes too.
    - Waves once wore its top flat.
    solution: A guyot is a seamount whose top was flattened, probably by waves when it was near the surface.
    mistakes:
      Trench: c9ss10_floor_shape
  - prompt: About how many times a day does sea level rise and fall at most coasts?
    options:
    - Twice
    - Once a year
    - Every minute
    - Never
    answer: Twice
    difficulty: 2
    hints:
    - Fishermen plan around high tide.
    - The Earth turns once a day past two bulges of water.
    solution: Most coasts have two high tides and two low tides a day.
    mistakes:
      Once a year: c9ss10_water_moves
  - prompt: Which of these does NOT drive ocean currents?
    options:
    - The colour of the water
    - Winds
    - Earth's rotation
    - Differences in temperature and salinity
    answer: The colour of the water
    difficulty: 2
    hints:
    - Three are real forces.
    - One has nothing to do with motion.
    solution: Winds, rotation, and temperature and salinity differences move currents; colour does not.
    mistakes:
      Winds: c9ss10_water_moves
- code: cbse9us.ocean.resources_zones
  title: Ocean resources, the Blue Economy and maritime zones
  notes: |
    Oceans give living resources (fish, prawns, seaweed) and non-living ones (oil and natural gas from
    offshore fields such as Mumbai High, salt, minerals, sand, and energy from tides, waves and offshore wind).
    They also carry most of world trade and shape climate. The Blue Economy means using ocean resources for
    growth and jobs while keeping oceans healthy: sustainable fishing, ports and shipping, tourism and clean
    energy. Threats include overfishing, plastic and oil pollution, and warming. The UN Convention on the Law
    of the Sea (UNCLOS) sets maritime zones measured from the coast: territorial waters up to 12 nautical
    miles (full control), the contiguous zone up to 24 nautical miles (customs and law enforcement), the
    Exclusive Economic Zone up to 200 nautical miles (rights to fish and mine), and beyond that the high seas,
    open to all. Early warning systems, such as INCOIS in Hyderabad, use seismic stations, tide gauges, ocean
    buoys and satellites to warn coastal people about tsunamis and cyclones.
  explanations:
    text: 'The sea is a store of food, fuel and energy, and a highway for trade. Countries have rights over the sea near their coasts in zones: complete control up to 12 nautical miles, and rights to fish and mine up to 200. Using all this without harming the oceans is the Blue Economy.'
    visual: 'Draw a coastline and three lines going out to sea: 12 nm (territorial waters), 24 nm (contiguous zone), 200 nm (EEZ). Beyond, label ''high seas''. Add fishing boats, an oil rig and a cargo ship.'
    step_by_step: 'Step 1: Living resource or non-living? Step 2: How far from the coast? 12 nm territorial, 24 contiguous, 200 EEZ. Step 3: Is the use sustainable? That decides if it fits the Blue Economy.'
    real_world: After the 2004 tsunami, India set up a tsunami warning centre at INCOIS, Hyderabad, which now sends alerts to coastal states within minutes of a big undersea earthquake.
  picture:
    kind: flow
    steps:
    - 'Territorial waters: 12 nm'
    - 'Contiguous zone: 24 nm'
    - 'Exclusive Economic Zone: 200 nm'
    - 'High seas: open to all'
    alt: 'Maritime zones measured from the coast: territorial waters to 12 nautical miles, contiguous zone to 24, Exclusive Economic Zone to 200, then the high seas.'
  activity:
    type: scale
    min: 0
    max: 250
    step: 1
    start: 125
    unit: nm
    prompt: Distance from the coast (nautical miles). Which zone?
    zones:
    - from: 0
      to: 12
      label: Territorial waters
      says: 'Up to 12 nm: full control.'
    - from: 12
      to: 24
      label: Contiguous zone
      says: 'Up to 24 nm: customs and law enforcement.'
    - from: 24
      to: 200
      label: EEZ
      says: 'Up to 200 nm: rights to fish and mine.'
    - from: 200
      to: 250
      label: High seas
      says: 'Beyond 200 nm: open to all.'
    goals:
    - prompt: Where does India have full control?
      zone: Territorial waters
      mistakes:
      - when:
          v:
          - 13
          - 23
        say: 'That''s the contiguous zone: customs only.'
    - prompt: Where can India fish and mine but not fully control?
      zone: EEZ
      mistakes:
      - when:
          v:
          - 0
          - 11
        say: 'That''s territorial waters: full control. Fishing rights stretch farther.'
    - prompt: Where is it open to all countries?
      zone: High seas
      mistakes:
      - when:
          v:
          - 25
          - 199
        say: That's still India's EEZ.
  lesson:
    - teach: 'Oceans give living resources such as fish, prawns and seaweed, and non-living ones such as oil and gas from offshore fields like Mumbai High, salt, minerals, sand, and energy from tides, waves and offshore wind. They carry most of world trade and shape our climate. The Blue Economy means using these resources for growth and jobs while keeping oceans healthy: sustainable fishing, ports, tourism and clean energy. Overfishing, plastic and oil pollution, and warming are the main threats.'
      picture:
        kind: compare
        columns:
        - title: Living
          points:
          - Fish
          - Prawns
          - Seaweed
        - title: Non-living
          points:
          - Oil and gas
          - Salt
          - Minerals and sand
          - Tidal and wave energy
        alt: Living ocean resources such as fish and seaweed compared with non-living ones such as oil, salt and tidal energy.
      check:
        prompt: Salt from the sea is a…
        options:
        - Non-living resource
        - Living resource
        - Current
        answer: Non-living resource
        why: Salt is a mineral, not a living thing.
    - teach: 'The UN Convention on the Law of the Sea (UNCLOS) divides the sea into zones measured from the coast. Territorial waters go out 12 nautical miles: the country has full control. The contiguous zone goes to 24 nautical miles, for customs and law enforcement. The Exclusive Economic Zone (EEZ) goes to 200 nautical miles: the country alone may fish and mine there. Beyond lie the high seas, open to all.'
      picture:
        kind: number_line
        from: 0
        to: 220
        step: 20
        points:
        - at: 12
          label: Territorial 12
        - at: 24
          label: Contiguous 24
        - at: 200
          label: EEZ 200
        alt: A line from the coast showing territorial waters to 12, contiguous zone to 24 and EEZ to 200 nautical miles.
      check:
        prompt: A foreign trawler fishes 150 nautical miles off India's coast without permission. Which zone is it in?
        options:
        - India's EEZ
        - The high seas
        - Territorial waters
        answer: India's EEZ
        why: 150 is beyond 24 but within 200.
    - teach: Early warning saves lives. INCOIS in Hyderabad uses seismic stations, tide gauges, deep-ocean buoys and satellites to warn coastal people of tsunamis and storm surges, so they can move to safety in time.
      check:
        prompt: Where is India's ocean warning centre INCOIS?
        options:
        - Hyderabad
        - Mumbai
        - Kochi
        answer: Hyderabad
        why: INCOIS is based in Hyderabad.
  items:
  - prompt: How far from the coast does a country's Exclusive Economic Zone extend, in nautical miles?
    answer: '200'
    check: '200'
    difficulty: 1
    hints:
    - Much farther than 12.
    - Rights to fish and mine.
    solution: 'Step 1: UNCLOS sets the EEZ. Step 2: It extends up to 200 nautical miles.'
    mistakes:
      '12': maritime_zones
      '24': maritime_zones
  - prompt: Which of these is a non-living ocean resource?
    options:
    - Offshore oil and gas
    - Fish
    - Seaweed
    - Prawns
    answer: Offshore oil and gas
    difficulty: 1
    hints:
    - Not a plant or animal.
    - Mumbai High.
    solution: 'Step 1: Fish, seaweed and prawns are living. Step 2: Oil and gas are non-living resources.'
    mistakes: {"Seaweed": "s9_nonliving"}
  - prompt: Territorial waters extend up to how many nautical miles from the coast?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - The smallest zone.
    - Full control of the country.
    solution: 'Step 1: Territorial waters are closest to the coast. Step 2: They reach 12 nautical miles.'
    mistakes:
      '200': maritime_zones
      '24': maritime_zones
  - prompt: What does the 'Blue Economy' mean?
    options:
    - Using ocean resources for growth while keeping oceans healthy
    - Painting ships blue
    - Banning all fishing
    - Using oceans only for dumping waste
    answer: Using ocean resources for growth while keeping oceans healthy
    difficulty: 2
    hints:
    - Blue = ocean.
    - Sustainable.
    solution: 'Step 1: Blue refers to oceans. Step 2: The Blue Economy is sustainable use of ocean resources for jobs and growth.'
    mistakes: {"Banning all fishing": "s9_blue_economy"}
  - prompt: Which tool helps warn coastal people about a tsunami?
    options:
    - Tide gauges and ocean buoys linked to a warning centre
    - Rain gauges on mountains
    - Thermometers in schools
    - Wind vanes on rooftops
    answer: Tide gauges and ocean buoys linked to a warning centre
    difficulty: 2
    hints:
    - They measure the sea itself.
    - INCOIS, Hyderabad.
    solution: 'Step 1: Seismic stations detect the quake. Step 2: Tide gauges and buoys confirm a wave, and the centre sends alerts.'
    mistakes: {"Rain gauges on mountains": "s9_tsunami_warning", "Wind vanes on rooftops": "s9_tsunami_warning"}
  - prompt: Who may fish freely on the high seas?
    options:
    - All countries
    - Only the nearest country
    - No one
    - Only the United Nations
    answer: All countries
    difficulty: 3
    hints:
    - Beyond 200 nautical miles.
    - No single country owns them.
    solution: 'Step 1: The high seas lie beyond every EEZ. Step 2: They are open to all countries, under international law.'
    mistakes:
      Only the nearest country: maritime_zones
  - prompt: A ship is 18 nautical miles from India's coast. Which zone is it in?
    options:
    - Contiguous zone
    - Territorial waters
    - High seas
    - Beyond the EEZ
    answer: Contiguous zone
    difficulty: 2
    hints:
    - It is past 12.
    - But not past 24.
    solution: 'Step 1: 18 is more than 12, so not territorial waters. Step 2: It is less than 24, so it is in the contiguous zone.'
    mistakes:
      Territorial waters: c9ss10_zone_distance
  - prompt: Which of these is a living ocean resource?
    options:
    - Seaweed
    - Salt
    - Offshore gas
    - Sand
    answer: Seaweed
    difficulty: 1
    hints:
    - Which one grows?
    - It is a plant-like organism.
    solution: Seaweed is a living organism; the others are non-living.
    mistakes:
      Salt: c9ss10_living
  - prompt: Which offshore oil field lies off the coast of Maharashtra?
    options:
    - Mumbai High
    - Digboi
    - Ankleshwar
    - Jharia
    answer: Mumbai High
    difficulty: 2
    hints:
    - It is under the sea.
    - Named after a nearby city.
    solution: Mumbai High is India's best-known offshore oil field.
    mistakes:
      Jharia: c9ss10_living
  - prompt: Which of these fits the idea of the Blue Economy?
    options:
    - Fishing with limits so fish stocks recover
    - Dumping plastic at sea
    - Catching every fish possible this year
    - Spilling oil from ships
    answer: Fishing with limits so fish stocks recover
    difficulty: 2
    hints:
    - It must give jobs and keep the ocean healthy.
    - Think about next year's catch.
    solution: 'Step 1: Limited fishing still gives jobs. Step 2: It lets stocks recover, keeping oceans healthy.'
    mistakes:
      Catching every fish possible this year: c9ss10_blue
  - prompt: How far from the coast does the contiguous zone end, in nautical miles?
    answer: 24
    check: '24'
    difficulty: 2
    hints:
    - It is twice the territorial limit.
    - Territorial waters end at 12.
    solution: 'Step 1: Territorial waters end at 12. Step 2: The contiguous zone extends to 24.'
    mistakes:
      '12': c9ss10_next_zone
      '200': c9ss10_next_zone
  - prompt: Which international agreement sets out maritime zones?
    options:
    - UNCLOS
    - The Paris Agreement
    - The Kyoto Protocol
    - The Forest Rights Act
    answer: UNCLOS
    difficulty: 2
    hints:
    - It is about the Law of the Sea.
    - A UN convention.
    solution: The UN Convention on the Law of the Sea (UNCLOS) defines the zones.
    mistakes:
      The Paris Agreement: c9ss10_zone_distance
  - prompt: Which is a major threat to ocean life?
    options:
