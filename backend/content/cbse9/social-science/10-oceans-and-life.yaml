    - Moonlight
    - Tides
    - Sea breeze
    answer: Plastic pollution
    difficulty: 1
    hints:
    - Three of these are natural and harmless.
    - One is made by people.
    solution: Plastic harms sea animals that eat it or get trapped in it.
    mistakes:
      Tides: c9ss10_blue
  - prompt: Within its EEZ, what special right does a country have?
    options:
    - Sole right to fish and mine
    - Right to stop all ships passing
    - Right to change the tides
