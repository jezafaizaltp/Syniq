# CBSE Class 9 Social Science (NCERT), Civics chapter 2. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 13
title: Constitutional Design

tips:
  constitution_dates: "The Constituent Assembly adopted the Constitution on 26 November 1949. It came into effect on 26 January 1950: Republic Day."
  preamble_words: "The Preamble declares India SOVEREIGN, SOCIALIST, SECULAR, DEMOCRATIC REPUBLIC."
  ambedkar_drafting: "Dr B.R. Ambedkar chaired the Drafting Committee. Dr Rajendra Prasad was President of the Constituent Assembly."

concepts:
  - code: cbse9ss.const.south_africa
    title: Why a constitution is needed, from South Africa
    notes: |
      Apartheid in South Africa: racial discrimination by the white minority government against blacks,
      coloured and Indians. Nelson Mandela imprisoned for 28 years (Robben Island). African National
      Congress led the struggle. Apartheid ended 26 April 1994 with a new democratic government; Mandela
      became President. The new constitution (1996) is one of the finest; based on reconciliation and
      equal rights. A constitution is a set of written rules accepted by all; it creates trust, specifies
      how government is formed, limits powers, and expresses aspirations.
    explanations:
      text: "Under apartheid, South Africa's white minority government kept black, coloured and Indian people segregated and without rights. Nelson Mandela spent 28 years in prison for opposing it. When apartheid ended in 1994, South Africans wrote a new constitution together, oppressors and oppressed alike, promising equal rights for all."
      visual: "Picture two queues at a hospital, one marked 'whites only' and a longer one for everyone else. Then picture them merged into one queue under a sign 'All citizens equal'. That change is what the new constitution did."
      step_by_step: "Step 1: Apartheid: laws separated people by race. Step 2: Struggle: ANC, Mandela, protests. Step 3: 1994: first democratic elections. Step 4: New constitution: equal rights and reconciliation. Step 5: Lesson: a constitution builds trust between different groups."
      real_world: "Nelson Mandela's autobiography, 'Long Walk to Freedom', is read worldwide. His willingness to forgive his jailers helped South Africa avoid a civil war."
    items:
      - prompt: "For how many years was Nelson Mandela imprisoned?"
        answer: "28"
        check: "28"
        difficulty: 1
        hints: ["Nearly three decades.", "Released in 1990."]
        solution: "Mandela spent 28 years in prison."
      - prompt: "What was apartheid?"
        options: ["A system of racial discrimination in South Africa", "A South African political party", "A type of election", "A trade agreement"]
        answer: "A system of racial discrimination in South Africa"
        difficulty: 1
        hints: ["It means 'separateness'.", "Based on race."]
        solution: "Apartheid was the official system of racial segregation in South Africa."
      - prompt: "In which year did South Africa become a democracy?"
        answer: "1994"
        check: "1994"
        difficulty: 2
        hints: ["Mandela became President.", "Mid-1990s."]
        solution: "Apartheid ended and democracy began in 1994."
      - prompt: "Which organisation led the struggle against apartheid?"
        options: ["African National Congress", "Indian National Congress", "Jacobin Club", "Muslim League"]
        answer: "African National Congress"
        difficulty: 2
        hints: ["ANC.", "Mandela's party."]
        solution: "The African National Congress (ANC)."
      - prompt: "What is a constitution?"
        options: ["A set of written rules accepted by all people of a country", "A list of the President's speeches", "A daily newspaper", "A type of tax"]
        answer: "A set of written rules accepted by all people of a country"
        difficulty: 1
        hints: ["The supreme law.", "Rules for how government works."]
        solution: "A constitution is the set of fundamental written rules that everyone accepts."
      - prompt: "Why is a constitution needed? Choose the best reason."
        options: ["It builds trust between different groups and limits the government's powers", "It makes the government stronger than the people", "It replaces elections", "It stops all change"]
        answer: "It builds trust between different groups and limits the government's powers"
        difficulty: 3
        hints: ["Think of South Africa's divided groups.", "It also protects rights."]
        solution: "A constitution creates trust, defines how government is formed, limits power and protects rights."

  - code: cbse9ss.const.india
    title: Making of the Indian Constitution
    after: [cbse9ss.const.south_africa]
    notes: |
      Motilal Nehru drafted a constitution in 1928; Karachi session 1931 on rights. Constituent Assembly
      elected in July 1946, first met December 1946; 299 members after partition. Dr Rajendra Prasad
      President; Dr B.R. Ambedkar chaired the Drafting Committee. Adopted 26 November 1949; in force 26
      January 1950. Preamble: We, the people of India… sovereign, socialist, secular, democratic republic;
      justice, liberty, equality, fraternity. Constitution has been amended many times; it is a living
      document.
    explanations:
      text: "India's Constitution was written by a Constituent Assembly elected in 1946, with Dr Rajendra Prasad as President and Dr B.R. Ambedkar leading the Drafting Committee. It was adopted on 26 November 1949 and came into force on 26 January 1950, which we celebrate as Republic Day. Its Preamble promises justice, liberty, equality and fraternity to all citizens."
      visual: "Draw a timeline: 1928 Motilal Nehru's draft, 1946 Assembly meets, 26 Nov 1949 adopted, 26 Jan 1950 in force. Above it write the Preamble's key words: Sovereign, Socialist, Secular, Democratic, Republic."
      step_by_step: "Step 1: Who wrote it? The Constituent Assembly (299 members). Step 2: Key people: Prasad (President), Ambedkar (Drafting). Step 3: Dates: adopted 26/11/1949, in force 26/01/1950. Step 4: Preamble values: justice, liberty, equality, fraternity."
      real_world: "26 November is now celebrated as Constitution Day in India, and many schools read the Preamble aloud in assembly that day."
    items:
      - prompt: "On which date did India's Constitution come into force?"
        options: ["26 January 1950", "15 August 1947", "26 November 1949", "2 October 1950"]
        answer: "26 January 1950"
        difficulty: 1
        hints: ["Republic Day.", "Not the adoption date."]
        solution: "It came into force on 26 January 1950."
        mistakes: {"26 November 1949": constitution_dates}
      - prompt: "Who chaired the Drafting Committee of the Indian Constitution?"
        options: ["Dr B.R. Ambedkar", "Dr Rajendra Prasad", "Jawaharlal Nehru", "Sardar Patel"]
        answer: "Dr B.R. Ambedkar"
        difficulty: 1
        hints: ["Often called the father of the Constitution.", "Not the Assembly's President."]
        solution: "Dr B.R. Ambedkar chaired the Drafting Committee."
        mistakes: {"Dr Rajendra Prasad": ambedkar_drafting}
      - prompt: "How many members did the Constituent Assembly have after partition?"
        answer: "299"
        check: "299"
        difficulty: 2
        hints: ["Just under 300.", "Some members went to Pakistan."]
        solution: "The Constituent Assembly had 299 members."
      - prompt: "Which word in the Preamble means India is free to make its own decisions, with no outside power controlling it?"
        options: ["Sovereign", "Secular", "Socialist", "Fraternity"]
        answer: "Sovereign"
        difficulty: 2
        hints: ["Supreme power.", "No external authority."]
        solution: "Sovereign means India has supreme authority over its own affairs."
        mistakes: {"Secular": preamble_words}
      - prompt: "In which year did Motilal Nehru draft a constitution for India?"
        answer: "1928"
        check: "1928"
        difficulty: 3
        hints: ["Before the Karachi session of 1931.", "Late 1920s."]
        solution: "Motilal Nehru and others drafted a constitution in 1928."
      - prompt: "What does 'secular' mean in the Preamble?"
        options: ["The state has no official religion and treats all religions equally", "Everyone must follow one religion", "Religion is banned", "Only the majority religion is protected"]
        answer: "The state has no official religion and treats all religions equally"
        difficulty: 2
        hints: ["Freedom of religion.", "Equal respect."]
        solution: "Secular means the government does not favour any religion."
