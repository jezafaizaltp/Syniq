# CBSE Class 9 Social Science (NCERT), Geography chapter 3. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 8
title: Drainage

tips:
  rift_west: "The Narmada and Tapi flow WEST through rift valleys into the Arabian Sea, making estuaries, not deltas."
  perennial_himalayan: "Himalayan rivers are perennial (fed by rain and melting snow). Most peninsular rivers are seasonal, depending on rain."
  largest_delta: "The Sundarban delta, formed by the Ganga and Brahmaputra, is the world's largest and fastest-growing delta."

concepts:
  - code: cbse9ss.drain.himalayan
    title: Himalayan river systems
    notes: |
      Drainage basin; water divide (e.g. between Indus and Ganga near Ambala). Himalayan rivers: perennial,
      long courses, erosion, meanders, oxbow lakes, deltas. Indus (rises near Lake Mansarovar in Tibet;
      tributaries Jhelum, Chenab, Ravi, Beas, Satluj; Indus Water Treaty 1960 lets India use 20% of its
      water). Ganga (Bhagirathi from Gangotri glacier joins Alaknanda at Devprayag; tributaries Yamuna,
      Ghaghara, Gandak, Kosi ('sorrow of Bihar'), Chambal, Son). Brahmaputra (Tsang Po in Tibet, Dihang,
      Majuli the largest inhabited riverine island). Sundarban delta.
    explanations:
      text: "The great Himalayan rivers are the Indus, Ganga and Brahmaputra. They are fed by both rain and melting snow, so they flow all year. The Ganga starts as the Bhagirathi at the Gangotri glacier, joined by the Alaknanda at Devprayag. Together with the Brahmaputra, it forms the Sundarban delta, the biggest in the world."
      visual: "Draw three trees lying on their sides with roots in the Himalayas. The Indus tree's branches point west into Pakistan. The Ganga tree's branches spread across the northern plains. The Brahmaputra loops east through Tibet and Assam, then all meet the Bay of Bengal in a fan-shaped delta."
      step_by_step: "Step 1: Name the system: Indus, Ganga or Brahmaputra. Step 2: Name its source. Step 3: Name its tributaries. Step 4: Note special features: Kosi floods, Majuli island, Sundarban delta, Indus Water Treaty."
      real_world: "Majuli in Assam, an island in the Brahmaputra, has villages, schools and monasteries. The Kosi River changes course so often and floods so badly that it is called the sorrow of Bihar."
    items:
      - prompt: "At which place do the Bhagirathi and Alaknanda meet to form the Ganga?"
        options: ["Devprayag", "Haridwar", "Allahabad", "Rishikesh"]
        answer: "Devprayag"
        difficulty: 1
        hints: ["'Prayag' means confluence.", "In Uttarakhand."]
        solution: "They meet at Devprayag."
      - prompt: "Which river is known as the 'sorrow of Bihar'?"
        options: ["Kosi", "Gandak", "Son", "Yamuna"]
        answer: "Kosi"
        difficulty: 1
        hints: ["It floods and changes course.", "Rises in Nepal."]
        solution: "The Kosi is called the sorrow of Bihar."
      - prompt: "Under the Indus Water Treaty, what percentage of the Indus system's water can India use?"
        answer: "20"
        check: "20"
        difficulty: 2
        hints: ["Signed in 1960.", "One fifth."]
        solution: "India can use 20% of the total water carried by the Indus system."
      - prompt: "Which is the largest inhabited riverine island in the world?"
        options: ["Majuli", "Srirangam", "Sriharikota", "Diu"]
        answer: "Majuli"
        difficulty: 2
        hints: ["In the Brahmaputra.", "In Assam."]
        solution: "Majuli in the Brahmaputra is the largest inhabited riverine island."
      - prompt: "Why do Himalayan rivers flow all year round?"
        options: ["They are fed by both rain and melting snow", "They are fed only by rain", "They have dams", "They are very short"]
        answer: "They are fed by both rain and melting snow"
        difficulty: 1
        hints: ["Glaciers.", "Summer melt."]
        solution: "Rain and snowmelt make them perennial."
        mistakes: {"They are fed only by rain": perennial_himalayan}
      - prompt: "Which delta is the world's largest?"
        options: ["Sundarban delta", "Mahanadi delta", "Krishna delta", "Kaveri delta"]
        answer: "Sundarban delta"
        difficulty: 2
        hints: ["Formed by the Ganga and Brahmaputra.", "Home of the Royal Bengal tiger."]
        solution: "The Sundarban delta is the largest and fastest-growing delta."
        mistakes: {"Mahanadi delta": largest_delta}
      - prompt: "In which year was the Indus Water Treaty signed?"
        answer: "1960"
        check: "1960"
        difficulty: 3
        hints: ["Between India and Pakistan.", "Start of a decade."]
        solution: "The Indus Water Treaty was signed in 1960."

  - code: cbse9ss.drain.peninsular
    title: Peninsular rivers, lakes and pollution
    after: [cbse9ss.drain.himalayan]
    notes: |
      Main water divide is the Western Ghats. Most peninsular rivers flow east into the Bay of Bengal and
      form deltas: Mahanadi, Godavari ('Dakshin Ganga', largest peninsular river, about 1,500 km), Krishna,
      Kaveri. Narmada and Tapi flow west through rift valleys and form estuaries. Lakes: Wular (freshwater,
      J&K, tectonic), Dal, Bhimtal, Nainital, Loktak, Barapani; salt: Sambhar; lagoons: Chilika, Pulicat,
      Kolleru. Rivers support agriculture, transport, power; pollution from sewage and industry; National
      River Conservation Plan / Namami Gange.
    explanations:
      text: "Because the plateau tilts east, most peninsular rivers, like the Godavari, Krishna and Kaveri, flow east into the Bay of Bengal and build deltas. The Narmada and Tapi are exceptions: they flow west through rift valleys into the Arabian Sea and form estuaries. Peninsular rivers depend on monsoon rain, so many shrink in summer."
      visual: "Draw the south of India like a ramp sloping east. Arrows on the ramp go right to the Bay of Bengal. In the middle, two arrows go left: the Narmada and Tapi, flowing through cracks (rift valleys) to the Arabian Sea."
      step_by_step: "Step 1: Which way does it flow? East means delta; west means estuary. Step 2: Source and states. Step 3: Longest: Godavari, the 'Dakshin Ganga'. Step 4: Lakes: freshwater (Wular, Dal), salt (Sambhar), lagoon (Chilika)."
      real_world: "Kerala's 44 rivers are short and flow west from the Western Ghats to the Arabian Sea. The Periyar is the longest of them; Vembanad Lake is where several rivers meet the sea."
    items:
      - prompt: "Which is the largest peninsular river, also called Dakshin Ganga?"
        options: ["Godavari", "Krishna", "Kaveri", "Mahanadi"]
        answer: "Godavari"
        difficulty: 1
        hints: ["About 1,500 km long.", "Rises in Nashik."]
        solution: "The Godavari is the largest peninsular river."
      - prompt: "Which river flows west through a rift valley?"
        options: ["Narmada", "Godavari", "Krishna", "Mahanadi"]
        answer: "Narmada"
        difficulty: 1
        hints: ["Rises in Amarkantak.", "Ends in the Arabian Sea."]
        solution: "The Narmada flows west through a rift valley."
        mistakes: {"Godavari": rift_west}
      - prompt: "About how long is the Godavari, in km?"
        answer: "1500"
        check: "1500"
        difficulty: 2
        hints: ["Over a thousand km.", "One and a half thousand."]
        solution: "The Godavari is about 1,500 km long."
      - prompt: "Which is the largest freshwater lake in India?"
        options: ["Wular", "Sambhar", "Chilika", "Dal"]
        answer: "Wular"
        difficulty: 2
        hints: ["In Jammu and Kashmir.", "Formed by tectonic activity."]
        solution: "Wular Lake is the largest freshwater lake."
      - prompt: "Rivers flowing west, like the Narmada and Tapi, form…"
        options: ["Estuaries", "Deltas", "Oxbow lakes", "Waterfalls only"]
        answer: "Estuaries"
        difficulty: 2
        hints: ["They don't drop silt in a fan.", "Fast flow through hard rock."]
        solution: "They form estuaries, not deltas."
        mistakes: {"Deltas": rift_west}
      - prompt: "Sambhar Lake in Rajasthan is used to produce…"
        options: ["Salt", "Fish", "Electricity", "Sugar"]
        answer: "Salt"
        difficulty: 1
        hints: ["It's a salt-water lake.", "In a dry region."]
        solution: "Sambhar Lake water is used to make salt."
      - prompt: "What is the main water divide of peninsular India?"
        options: ["Western Ghats", "Eastern Ghats", "Vindhyas", "Aravallis"]
        answer: "Western Ghats"
        difficulty: 3
        hints: ["Near the west coast.", "Rivers flow away from it in both directions."]
        solution: "The Western Ghats form the main water divide."
