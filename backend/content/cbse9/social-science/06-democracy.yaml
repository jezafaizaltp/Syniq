# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 6. Format: content/README.md.
subject: cbse9-ss
chapter: 6
title: Democracy
tips:
  free_fair_election: Holding elections is not enough. A democracy needs free and fair elections where those in power can actually lose.
  one_person_one_vote: "'One person, one vote, one value' is about fairness: does every adult's vote count the same, or do some count more?"
  s9_against_democracy: "An argument AGAINST shows a weakness. Which choice is a problem, not a strength?"
  s9_amartya_sen: "Which Indian economist won the Nobel Prize for work on famines and welfare?"
  s9_democracy_beyond: "Democracy is a way of deciding together. Where else do groups of people decide things?"
  s9_dignity: "Dignity comes from being treated as equal. Which choice says that?"
  s9_famine_china: "It was one of the worst famines in history: tens of millions died, not thousands and not hundreds of millions."
  s9_for_democracy: "An argument FOR democracy shows something good about it. Which choice is a strength?"
  s9_mexico: "The PRI was a party in Latin America. India changes governments by elections."
  s9_mugabe: "Zimbabwe did hold elections. What happened to opponents and to people's rights?"
  s9_musharraf: "Elections were held. Who still had the final say?"
  s9_pri_years: "1930 to 2000: count the years between them."
  c9ss6_who_decides: Ask who really takes the final decisions. Are they people the voters chose and can remove?
  c9ss6_real_choice: An election is only a real choice if the people in power could actually lose it. Check whether that was possible here.
  c9ss6_equal_vote: Check whether every adult gets a vote and whether each vote has the same weight.
  c9ss6_rights_check: Elections are not enough. Ask whether the government respected the law and people's freedom to speak and oppose.
  c9ss6_for_against: Decide first whether the statement praises democracy or complains about it.
  c9ss6_beyond: Think about places where people make decisions together every day, not only in parliament.
concepts:
- code: cbse9us.demo.features
  title: Features of democracy
  notes: |
    Democracy: a form of government in which the rulers are elected by the people. Features: major
    decisions by elected leaders (Pakistan under Musharraf was not a democracy despite elections); free
    and fair electoral competition (Mexico's PRI won every election 1930–2000 unfairly; China's elections
    offer no real choice); one person, one vote, one value (Saudi women once denied vote; Estonia's
    Russian minority; Fiji's unequal vote); rule of law and respect for rights (Zimbabwe under Mugabe).
    Definition: a democracy is a form of government in which rulers elected by the people take all major
    decisions, elections offer a free and fair choice, each adult has one vote of equal value, and
    government works within constitutional law and citizens' rights.
  explanations:
    text: A democracy is a government chosen by the people. But elections alone don't make one. In a real democracy, elected leaders make the major decisions, elections are free and fair so rulers can be voted out, every adult has one vote of equal value, and the government follows the constitution and respects citizens' rights.
    visual: 'Picture a table with four legs: elected leaders decide, free and fair elections, one person one vote one value, rule of law and rights. Take away any leg and the table tips over: it''s no longer a full democracy.'
    step_by_step: 'Step 1: Who really decides? Elected leaders, not the army or a king. Step 2: Can the ruling party lose an election? Step 3: Does every adult vote, with equal value? Step 4: Does the government obey the constitution and protect rights? If all four, it''s a democracy.'
    real_world: In a school election where the principal picks the winner regardless of votes, students voted but didn't choose. That's like Mexico's PRI winning every election for 70 years with unfair practices.
  activity:
    type: sort
    prompt: Is this democratic?
    bins:
    - Democratic
    - Not democratic
    items:
    - label: Elected leaders take the major decisions
      bin: Democratic
      clue: Who decides?
      why: Democratic.
    - label: An army ruler decides, despite elections (Musharraf)
      bin: Not democratic
      clue: Who really rules?
      why: Not democratic.
    - label: One party wins every election by unfair means (PRI, Mexico)
      bin: Not democratic
      clue: Free and fair?
      why: Not democratic.
    - label: Each adult has one vote of equal value
      bin: Democratic
      clue: Equality of votes.
      why: Democratic.
    - label: Women denied the vote
      bin: Not democratic
      clue: Is it universal?
      why: Not democratic.
    - label: Government follows constitutional law and rights
      bin: Democratic
      clue: Rule of law.
      why: Democratic.
  lesson:
    - teach: 'Democracy is a form of government in which the rulers are elected by the people. But elections alone are not enough. In Pakistan, General Musharraf held elections, yet the final powers stayed with him and the army, not with elected leaders. So the first feature is: major decisions are taken by elected leaders.'
      check:
        prompt: Why was Pakistan under Musharraf not a democracy?
        options:
        - Final power stayed with the military ruler
        - There were no people
        - Nobody could read
        answer: Final power stayed with the military ruler
        why: Elected leaders must hold the real power.
    - teach: 'Second, the election must offer a free and fair choice: those in power must be able to lose. In Mexico, the PRI won every election from 1930 to 2000 using unfair means, and in China voters have no real choice of party. Third, one person, one vote, one value: every adult votes, and every vote counts the same. Fourth, the government works within constitutional law and respects citizens'' rights; under Mugabe, Zimbabwe held elections but opponents were harassed.'
      picture:
        kind: flow
        steps:
        - Elected leaders decide
        - Free and fair choice
        - One person, one vote, one value
        - Rule of law and rights
        alt: 'Four features of democracy shown in order: elected leaders decide, free and fair choice, equal votes, rule of law and rights.'
      check:
        prompt: Which election was NOT a real choice?
        options:
        - One where the ruling party could never lose
        - One where the ruling party lost
        - One with many parties competing
        answer: One where the ruling party could never lose
        why: If the rulers can never lose, people have no real choice.
  items:
  - prompt: Which feature is essential for an election to be democratic?
    options:
    - Those in power can lose
    - Only one party contests
    - Voting is optional for rulers only
    - The army counts the votes
    answer: Those in power can lose
    difficulty: 1
    hints:
    - Real choice.
    - Free and fair competition.
    solution: A democratic election must give a real chance for the ruling party to be defeated.
    mistakes:
      Only one party contests: free_fair_election
  - prompt: For how many years did the PRI win every election in Mexico, from 1930 to 2000?
    answer: '70'
    check: 2000 - 1930
    difficulty: 2
    hints:
    - 2000 − 1930.
    - Seven decades.
    solution: 70 years, through unfair means.
    mistakes: {"30": "s9_pri_years", "60": "s9_pri_years"}
  - prompt: Why was Pakistan under General Musharraf not a democracy, even though elections were held?
    options:
    - Final powers stayed with the military ruler, not elected leaders
    - There were no political parties
    - Women could not vote
    - There was no constitution at all
    answer: Final powers stayed with the military ruler, not elected leaders
    difficulty: 2
    hints:
    - Who took the major decisions?
    - He could dismiss the elected assemblies.
    solution: Elected representatives did not hold final power; the military ruler did.
    mistakes: {"There were no political parties": "s9_musharraf"}
  - prompt: The principle 'one person, one vote, one value' means…
    options:
    - Every adult's vote counts equally
    - Only one person can vote
    - Votes are bought for value
    - One party gets all votes
    answer: Every adult's vote counts equally
    difficulty: 1
    hints:
    - Political equality.
    - No vote is worth more than another.
    solution: Each adult citizen has one vote, and each vote has equal value.
    mistakes:
      Only one person can vote: one_person_one_vote
  - prompt: In which country did the ruling party win every election from 1930 to 2000 by unfair means?
    options:
    - Mexico
    - India
    - Japan
    - Canada
    answer: Mexico
    difficulty: 2
    hints:
    - Party called PRI.
    - Latin America.
    solution: Mexico's PRI party.
    mistakes: {"India": "s9_mexico"}
  - prompt: Under Robert Mugabe, why was Zimbabwe's government not fully democratic?
    options:
    - It did not respect rights and harassed opponents
    - It held no elections at all
    - It was ruled by a king
    - It had no parliament
    answer: It did not respect rights and harassed opponents
    difficulty: 3
    hints:
    - Elections were held but…
    - Rule of law and rights.
    solution: Popular governments must respect rights and the rule of law; Mugabe's government did not.
    mistakes: {"It held no elections at all": "s9_mugabe"}
  - prompt: In some country, women are not allowed to vote. Which feature of democracy is missing?
    options:
    - One person, one vote, one value
    - A written history
    - A large army
    - A big capital city
    answer: One person, one vote, one value
    difficulty: 1
    hints:
    - Think about who gets to take part.
    - Every adult should have an equal say.
    solution: 'Step 1: Half the adults cannot vote. Step 2: So the principle that every adult has one equal vote is broken.'
    mistakes:
      A large army: c9ss6_equal_vote
  - prompt: In China, elections are held regularly, but which is the problem?
    options:
    - Voters have no real choice of party
    - Nobody is allowed to vote
    - There are no candidates at all
    - Votes are counted twice
    answer: Voters have no real choice of party
    difficulty: 2
    hints:
    - Elections do happen there.
    - Can a party other than the ruling one form a government?
    solution: 'Step 1: Candidates must be approved by the ruling party. Step 2: So voters cannot choose a different party, and the choice is not real.'
    mistakes:
      Nobody is allowed to vote: c9ss6_real_choice
  - prompt: A country's army chief can overrule any law passed by elected members. Is it a democracy?
    options:
    - No, because elected leaders do not have the final say
    - Yes, because there was an election
    - Yes, because the army is strong
    - Only on weekdays
    answer: No, because elected leaders do not have the final say
    difficulty: 2
    hints:
    - Who holds the final power here?
    - Remember the Pakistan example.
    solution: 'Step 1: Real decisions are taken by someone nobody elected. Step 2: So it fails the first feature of democracy.'
    mistakes:
      Yes, because there was an election: c9ss6_who_decides
  - prompt: Which of these shows rule of law in a democracy?
    options:
    - Even the Prime Minister must obey the courts
    - The ruler can jail critics at will
    - Laws apply only to the poor
    - The army writes the laws
    answer: Even the Prime Minister must obey the courts
    difficulty: 1
    hints:
    - Rule of law means the law is above everyone.
    - No person is above it.
    solution: Under the rule of law, the law binds every person, including the most powerful.
    mistakes:
      The ruler can jail critics at will: c9ss6_rights_check
  - prompt: Which of these is NOT a feature of democracy?
    options:
    - Leaders rule for life without elections
    - Free and fair elections
    - Equal value of each vote
    - Respect for citizens' rights
    answer: Leaders rule for life without elections
    difficulty: 1
    hints:
    - Three of these are in the definition.
    - Democracy lets people change their rulers.
    solution: 'Step 1: Free elections, equal votes and rights are all features. Step 2: Rule for life without elections is the opposite.'
    mistakes:
      Equal value of each vote: c9ss6_equal_vote
  - prompt: In Fiji, the vote of an indigenous Fijian once had more value than that of an Indian-Fijian. Which principle did this break?
    options:
    - One vote, one value
    - Freedom of religion
    - Right to education
    - Separation of powers
    answer: One vote, one value
    difficulty: 2
    hints:
    - Both groups could vote.
    - Did each vote carry the same weight?
    solution: 'Step 1: Both groups voted, but one group''s vote weighed more. Step 2: That breaks the idea that every vote is equal.'
    mistakes:
      Freedom of religion: c9ss6_equal_vote
  - prompt: Why is it not enough for a country just to hold elections to be called a democracy?
    options:
    - The elections must be free and fair and the elected must really rule
    - Elections are too costly
    - Elections happen only once
    - Voters always choose wrongly
    answer: The elections must be free and fair and the elected must really rule
    difficulty: 3
    hints:
    - Remember Mexico and Pakistan.
    - What went wrong in both even though elections were held?
    solution: 'Step 1: Mexico had elections that the rulers could not lose. Step 2: Pakistan had elections but the army ruled. Step 3: So elections must be fair and lead to real power.'
    mistakes:
      Elections are too costly: c9ss6_real_choice
  - prompt: Opposition leaders are arrested before an election and newspapers are shut down. What is being destroyed?
    options:
    - Free and fair competition and citizens' rights
    - The weather
    - The economy only
    - Nothing important
    answer: Free and fair competition and citizens' rights
    difficulty: 2
    hints:
    - Can voters hear all sides?
    - Can rivals campaign freely?
    solution: 'Step 1: Rivals cannot campaign and people cannot get news. Step 2: So the election is not a fair contest and rights are violated.'
    mistakes:
      The economy only: c9ss6_rights_check
  - prompt: Who chooses the rulers in a democracy?
    options:
    - The people, through elections
    - The richest family
    - The army chief
    - A foreign country
    answer: The people, through elections
    difficulty: 1
    hints:
    - Demos means people in Greek.
    - Kratia means rule.
    solution: Democracy means rule by the people, who choose their rulers in elections.
    mistakes:
      The army chief: c9ss6_who_decides
- code: cbse9us.demo.why
  title: Arguments for and against democracy
  after:
  - cbse9us.demo.features
  notes: |
    Arguments against: leaders keep changing (instability), more about politics than morality, delays in
    decision-making, ordinary people don't know what's good, corruption. Arguments for: more accountable
    government, better decisions through consultation, a method to deal with differences, enhances the
    dignity of citizens, allows the correction of mistakes. Example: China's famine (1958–61) killed about
    30 million while India, a democracy, never had such a famine after independence (Amartya Sen).
    Broader meanings of democracy: in families, schools, offices.
  explanations:
    text: 'Critics say democracy is slow, unstable and sometimes corrupt. But it has strong advantages: governments must answer to the people, decisions improve through discussion, it handles differences peacefully, it respects every citizen''s dignity, and mistakes can be corrected at the next election. Famines have been far worse under dictatorships than in democracies.'
    visual: 'Draw a balance scale. On one side: slow decisions, frequent changes, corruption. On the other: accountability, dignity, peaceful handling of differences, chance to correct mistakes. The second side is heavier.'
    step_by_step: 'Step 1: List the criticisms. Step 2: List the strengths. Step 3: Weigh them with examples: China''s famine of 1958–61 versus India''s democracy after 1947. Step 4: Conclude: democracy is better than other forms, though not perfect.'
    real_world: In a class where students discuss and vote on a trip, deciding takes longer, but everyone feels respected and the class can change its mind next time. That's democracy in daily life.
  picture:
    kind: compare
    columns:
    - title: Against democracy
      points:
      - Decisions can be slow
      - Leaders keep changing
      - Corruption can happen
    - title: For democracy
      points:
      - Government answers to the people
      - Respects everyone's dignity
      - Settles differences peacefully
      - Lets us correct mistakes
    alt: Arguments against democracy, such as slow decisions and corruption, beside arguments for it, such as accountability, dignity and peaceful ways to settle differences.
  activity:
    type: sort
    prompt: An argument for democracy, or against?
    bins:
    - For
    - Against
    items:
    - label: More accountable government
      bin: For
      clue: Leaders answer to people.
      why: For.
    - label: Delays in decision-making
      bin: Against
      clue: Too much discussion.
      why: Against.
    - label: Allows correcting mistakes
      bin: For
      clue: Can change course.
      why: For.
    - label: Leaders keep changing
      bin: Against
      clue: Instability.
      why: Against.
    - label: Enhances the dignity of citizens
      bin: For
      clue: Everyone counts.
      why: For.
    - label: Ordinary people don't know what's good
      bin: Against
      clue: A common complaint.
      why: Against.
  lesson:
    - teach: 'People argue against democracy too: leaders keep changing, so there is instability; there is a lot of politics and power play; decisions take time because many people are consulted; ordinary voters may not know what is good for them; and there can be corruption. Some of these are true, but they are problems in every kind of government.'
      check:
        prompt: Which is an argument made AGAINST democracy?
        options:
        - Decisions take a long time
        - Citizens are treated equally
        - Mistakes can be corrected
        answer: Decisions take a long time
        why: Consulting many people can cause delay.
    - teach: 'Arguments for democracy: it makes government accountable to the people; consultation and discussion lead to better decisions; it gives a peaceful way to deal with differences; it treats every citizen with equal dignity; and it allows mistakes to be corrected, because rulers can be questioned and changed. Amartya Sen pointed out that in China''s famine of 1958–61 about 30 million people died, while democratic India never had such a famine after independence, because a free press and elections force governments to act.'
      picture:
        kind: compare
        columns:
        - title: Against
          points:
          - Instability
          - Delays
          - Corruption
          - Voters may not know best
        - title: For
          points:
          - Accountable government
          - Better decisions
          - Handles differences
          - Dignity of citizens
          - Mistakes corrected
        alt: Arguments against democracy compared with arguments for democracy.
      check:
        prompt: Why do democracies rarely have big famines, according to Amartya Sen?
        options:
        - A free press and elections force the government to act
        - They have no droughts
        - They never grow food
        answer: A free press and elections force the government to act
        why: Rulers who can be voted out cannot ignore starving people.
    - teach: 'Democracy is not only about governments. A family where children are heard, a school where students elect a council, or an office where workers are consulted all follow democratic ideas: everyone has a voice, and decisions come from discussion.'
      check:
        prompt: A class elects its monitor by secret vote. This is…
        options:
        - Democracy beyond government
        - A famine
        - A monarchy
        answer: Democracy beyond government
        why: Democratic ideas can work in schools and families too.
  items:
  - prompt: About how many million people died in China's famine of 1958–61?
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - One of the worst famines in history.
    - Tens of millions.
    solution: About 30 million people died.
    mistakes: {"3": "s9_famine_china", "300": "s9_famine_china"}
  - prompt: Which is an argument FOR democracy?
    options:
    - It allows mistakes to be corrected
    - Leaders keep changing
    - Decisions take a long time
    - It leads to corruption
    answer: It allows mistakes to be corrected
    difficulty: 1
    hints:
    - Three of these are criticisms.
    - Elections let people change course.
    solution: Democracy allows mistakes to be corrected through debate and elections.
    mistakes: {"Decisions take a long time": "s9_for_democracy"}
  - prompt: Which is an argument AGAINST democracy?
    options:
    - Decision-making is delayed
    - It enhances dignity
    - Government is accountable
    - It handles differences peacefully
    answer: Decision-making is delayed
    difficulty: 1
    hints:
    - Consulting many people takes time.
    - Criticism.
    solution: Critics say consultation delays decisions.
    mistakes: {"Government is accountable": "s9_against_democracy"}
  - prompt: Which economist pointed out that famines don't happen in functioning democracies?
    options:
    - Amartya Sen
    - Karl Marx
    - Adam Smith
    - Jean Drèze
    answer: Amartya Sen
    difficulty: 2
    hints:
    - Indian Nobel laureate.
    - Won the Nobel in 1998.
    solution: Amartya Sen made this argument.
    mistakes: {"Jean Drèze": "s9_amartya_sen", "Adam Smith": "s9_amartya_sen"}
  - prompt: Why is democracy said to enhance the dignity of citizens?
    options:
    - It treats everyone as equal regardless of wealth or education
    - It gives the rich more votes
    - It is cheaper to run
    - It has fewer laws
    answer: It treats everyone as equal regardless of wealth or education
    difficulty: 2
    hints:
    - Political equality.
    - Poorest and richest have the same vote.
    solution: Democracy is based on political equality, so it respects every citizen's dignity.
    mistakes: {"It gives the rich more votes": "s9_dignity"}
  - prompt: Democracy can also apply to which of these, beyond governments?
    options:
    - Families, schools and organisations
    - Only parliaments
    - Only courts
    - Only the army
    answer: Families, schools and organisations
    difficulty: 3
    hints:
    - Broader meaning.
    - Decisions taken by discussion and equal say.
    solution: Democratic ways of deciding apply in families, schools and organisations too.
    mistakes: {"Only parliaments": "s9_democracy_beyond"}
  - prompt: '''Democracy gives a peaceful way to settle quarrels between groups.'' This is an argument…'
    options:
    - For democracy
    - Against democracy
    - About famines
    - About the army
    answer: For democracy
    difficulty: 1
    hints:
    - Is the statement praising or criticising?
    - Peaceful settlement is a good thing.
    solution: 'Step 1: Handling differences peacefully is a benefit. Step 2: So it is an argument in favour of democracy.'
    mistakes:
      Against democracy: c9ss6_for_against
  - prompt: '''In a democracy, leaders change too often.'' This argument is about…'
    options:
    - Instability
    - Dignity
    - Accountability
    - Equality
    answer: Instability
    difficulty: 1
    hints:
    - Frequent changes make things shaky.
    - Is this praise or complaint?
    solution: Leaders changing often is said to make a government unstable.
    mistakes:
      Dignity: c9ss6_for_against
  - prompt: A government made a bad policy. In a democracy, how can it be corrected?
    options:
    - People can question it, debate it and vote the government out
    - It can never be changed
    - Only a king can change it
    - By closing the newspapers
    answer: People can question it, debate it and vote the government out
    difficulty: 2
    hints:
    - Who can rulers be questioned by?
    - What happens at the next election?
    solution: 'Step 1: Public debate and a free press expose the mistake. Step 2: Elections let people replace the rulers.'
    mistakes:
      By closing the newspapers: c9ss6_rights_check
  - prompt: Why is a democratic government called accountable?
    options:
    - It must answer to the people
    - It counts money well
    - It never makes mistakes
    - It has more accountants
    answer: It must answer to the people
    difficulty: 2
    hints:
    - To account for something is to explain it.
    - Who do rulers explain their actions to?
    solution: 'Step 1: Accountable means having to answer for your actions. Step 2: In a democracy, rulers answer to citizens.'
    mistakes:
      It counts money well: c9ss6_for_against
  - prompt: A family discusses together before deciding where to go on holiday, and the children's views are heard. This shows…
    options:
    - Democratic ideas in a family
    - A dictatorship
    - A famine
    - Proportional representation
    answer: Democratic ideas in a family
    difficulty: 1
    hints:
    - Everyone has a voice.
    - Decisions come from discussion.
    solution: Hearing everyone before deciding is a democratic way of working, even at home.
    mistakes:
      A dictatorship: c9ss6_beyond
  - prompt: Which statement about democracy is FAIR?
    options:
    - It is better than other forms but not perfect
    - It solves every problem
    - It never has corruption
    - It is the worst form of government
    answer: It is better than other forms but not perfect
    difficulty: 3
    hints:
    - Some complaints against democracy are true.
    - Compare it with the alternatives.
    solution: 'Step 1: Democracy has real weaknesses like delay and corruption. Step 2: But other systems have these too, plus no way to correct them.'
    mistakes:
      It solves every problem: c9ss6_for_against
  - prompt: Why might a decision take longer in a democracy than under a dictator?
    options:
    - Many people are consulted and views are debated
    - Democracies have slower clocks
    - Nobody wants to decide
    - Laws are banned
    answer: Many people are consulted and views are debated
    difficulty: 1
    hints:
    - Who must agree before a decision?
    - Discussion takes time.
    solution: Consulting and debating take time, but often give better decisions.
    mistakes:
      Laws are banned: c9ss6_for_against
  - prompt: A poor, uneducated voter's vote counts the same as a rich minister's vote. Which benefit of democracy is this?
    options:
    - It enhances the dignity of citizens
    - It speeds up decisions
    - It increases the army
    - It ends all poverty
    answer: It enhances the dignity of citizens
    difficulty: 2
    hints:
    - Every person is treated as equal.
    - Think about respect.
    solution: 'Step 1: Each vote has equal value. Step 2: Treating everyone as equal gives them dignity.'
    mistakes:
      It ends all poverty: c9ss6_for_against
  - prompt: In which country did a famine around 1958–61 kill about 30 million people?
    options:
    - China
    - India
    - Mexico
    - Fiji
    answer: China
    difficulty: 2
    hints:
    - It was not a democracy.
    - It is India's large northern neighbour.
    solution: China's famine of 1958–61 killed about 30 million people; there was no free press to warn or elections to punish failure.
    mistakes:
      India: c9ss6_for_against
