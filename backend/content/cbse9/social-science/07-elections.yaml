# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 7. Format: content/README.md.
subject: cbse9-ss
chapter: 7
title: Elections
tips:
  voting_age: In India, every citizen aged 18 or more can vote. To contest Lok Sabha or Assembly elections the minimum age is 25.
  reserved_constituencies: 'Some constituencies are reserved for Scheduled Castes and Scheduled Tribes: only candidates from those groups can stand, but everyone votes.'
  eci_independent: 'The Election Commission is independent: it is not under the government in power, and its Chief Election Commissioner is not easy to remove.'
  fptp_pr: 'First Past the Post: the candidate with the most votes in a constituency wins, even without a majority. Proportional Representation: parties get seats in proportion to their share of votes.'
  emergency_dates: The national Emergency was declared on 25 June 1975 and lifted in March 1977; elections in 1977 brought a new government.
concepts:
- code: cbse9us.elect.system
  title: Why elections and India's electoral system
  notes: |
    Elections let people choose representatives regularly and change them. Haryana 1987 example (Devi Lal's
    Nyaya Yudh). Democratic elections need: universal adult franchise, choice of parties and candidates,
    regular elections (every 5 years), free and fair conduct. Lok Sabha: 543 constituencies; each elects
    one MP. Assembly constituencies elect MLAs. Reserved constituencies: 84 for SC, 47 for ST in the Lok
    Sabha (as of 2019). Voters' list (electoral roll); EPIC (Election Photo Identity Card). Voting age 18;
    candidate age 25; candidates file nominations and declare criminal cases, assets, education.
  explanations:
    text: Elections let people choose who governs them and replace them if they do badly. India is divided into 543 Lok Sabha constituencies, each electing one MP. Every citizen aged 18 or over can vote, and candidates must be at least 25. Some seats are reserved for Scheduled Castes and Scheduled Tribes so that these groups get fair representation.
    visual: Picture a map of India cut into 543 pieces like a jigsaw. Each piece sends one MP to the Lok Sabha in Delhi. Some pieces are coloured to show reserved seats.
    step_by_step: 'Step 1: Divide the country into constituencies. Step 2: Prepare the voters'' list of everyone 18+. Step 3: Candidates (25+) file nominations and declare assets and criminal cases. Step 4: Campaign. Step 5: Polling with EVMs. Step 6: Counting; the candidate with the most votes wins.'
    real_world: Before every election, voters can check their name on the electoral roll online and get a voter ID card (EPIC). First-time voters turning 18 are encouraged to register on National Voters' Day, 25 January.
  activity:
    type: scale
    min: 15
    max: 90
    step: 1
    start: 15
    unit: no.
    prompt: India's electoral system. Slide to the number.
    zones: []
    goals:
    - prompt: Minimum age to vote
      value: 18
      mistakes:
      - when:
          v: 25
        say: 25 is the minimum age to contest. Voting starts at 18.
      - when:
          v: 21
        say: It was 21 before 1988. Now it is 18.
    - prompt: Minimum age to contest a Lok Sabha election
      value: 25
      mistakes:
      - when:
          v: 18
        say: 18 is the voting age. Candidates must be 25.
    - prompt: Lok Sabha seats reserved for SC (as of 2019)
      value: 84
      mistakes:
      - when:
          v: 47
        say: 47 is for ST. SC have 84.
    - prompt: Lok Sabha seats reserved for ST
      value: 47
      mistakes:
      - when:
          v: 84
        say: 84 is for SC. ST have 47.
  items:
  - prompt: How many Lok Sabha constituencies are there?
    answer: '543'
    check: '543'
    difficulty: 1
    hints:
    - Each elects one MP.
    - Just over 540.
    solution: There are 543 Lok Sabha constituencies.
  - prompt: What is the minimum age to vote in India?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Adult franchise.
    - Lowered from 21 in 1989.
    solution: Citizens aged 18 or above can vote.
    mistakes:
      '25': voting_age
  - prompt: What is the minimum age to contest a Lok Sabha election?
    answer: '25'
    check: '25'
    difficulty: 2
    hints:
    - Older than the voting age.
    - A quarter century.
    solution: A candidate must be at least 25 years old.
    mistakes:
      '18': voting_age
  - prompt: In a constituency reserved for Scheduled Castes, who can vote?
    options:
    - All voters of that constituency
    - Only Scheduled Caste voters
    - Only women
    - Only party members
    answer: All voters of that constituency
    difficulty: 2
    hints:
    - Reservation is about who can stand.
    - Not about who can vote.
    solution: Only SC candidates can contest, but all registered voters can vote.
    mistakes:
      Only Scheduled Caste voters: reserved_constituencies
  - prompt: How often are Lok Sabha elections normally held?
    options:
    - Every 5 years
    - Every 4 years
    - Every 2 years
    - Every 10 years
    answer: Every 5 years
    difficulty: 1
    hints:
    - The term of the Lok Sabha.
    - 'Last ones: 2019, 2024.'
    solution: Lok Sabha elections are held every five years.
  - prompt: What must candidates declare when filing nominations?
    options:
    - Criminal cases, assets and education
    - Their caste only
    - Their favourite party
    - Nothing
    answer: Criminal cases, assets and education
    difficulty: 3
    hints:
    - A Supreme Court direction.
    - So voters can make informed choices.
    solution: Candidates must declare pending criminal cases, assets and liabilities, and education.
- code: cbse9us.elect.fair
  title: What makes elections democratic
  after:
  - cbse9us.elect.system
  notes: |
    Election Commission of India: independent, conducts elections, enforces the code of conduct, can order
    repolls, controls government officials on election duty. Chief Election Commissioner appointed by
    the President but not answerable to the government. Code of conduct: no use of government resources,
    no places of worship for campaigning, no new projects after announcement. Indian elections are
    generally free and fair: ruling parties often lose; high turnout among poor, rural and less educated
    voters; results accepted. Challenges: money power, candidates with criminal links, family politics.
  explanations:
    text: 'An independent Election Commission runs India''s elections. It enforces a code of conduct, so the ruling party can''t misuse government money or officials, and it can cancel and re-hold a poll if there is cheating. Indian elections are largely free and fair: ruling parties often lose, and poor and rural voters turn out in large numbers. Challenges remain, like the role of money and candidates with criminal records.'
    visual: 'Picture a cricket match. The Election Commission is the umpire: neutral, enforcing the rules on both teams, and able to order a replay. The code of conduct is the rulebook.'
    step_by_step: 'Step 1: Who conducts elections? The Election Commission. Step 2: Is it independent? Yes; the CEC isn''t answerable to the government. Step 3: What rules apply? The code of conduct. Step 4: Is it fair? Check if rulers lose, turnout is high, results are accepted. Step 5: Note the challenges.'
    real_world: In past elections, the Election Commission has transferred officials, stopped ministers from announcing new schemes, and even ordered repolling in booths where machines were tampered with.
  activity:
    type: sort
    prompt: Allowed under the code of conduct, or not?
    bins:
    - Allowed
    - Not allowed
    items:
    - label: Campaigning at a public rally
      bin: Allowed
      clue: Normal campaign.
      why: Allowed.
    - label: Using a government car for campaigning
      bin: Not allowed
      clue: Government resources.
      why: Not allowed.
    - label: Campaigning in a place of worship
      bin: Not allowed
      clue: Religion.
      why: Not allowed.
    - label: Announcing a new project after elections are announced
      bin: Not allowed
      clue: Bribing voters with schemes.
      why: Not allowed.
    - label: Door-to-door canvassing
      bin: Allowed
      clue: Meeting voters.
      why: Allowed.
  items:
  - prompt: Who conducts elections in India?
    options:
    - The Election Commission
    - The Prime Minister
    - The Supreme Court
    - The ruling party
    answer: The Election Commission
    difficulty: 1
    hints:
    - An independent body.
    - Headed by the Chief Election Commissioner.
    solution: The Election Commission of India conducts elections.
  - prompt: Why is the Election Commission said to be independent?
    options:
    - Its head is not answerable to the government in power
    - It is run by the ruling party
    - It is elected every year
    - It works for the Prime Minister
    answer: Its head is not answerable to the government in power
    difficulty: 2
    hints:
    - Appointed by the President.
    - But hard to remove.
    solution: The CEC is not answerable to the President or government once appointed.
    mistakes:
      It works for the Prime Minister: eci_independent
  - prompt: Which is NOT allowed under the model code of conduct?
    options:
    - Using a place of worship for campaigning
    - Holding public meetings
    - Printing posters
    - Going door to door
    answer: Using a place of worship for campaigning
    difficulty: 1
    hints:
    - Religion must not be used.
    - Three are normal campaigning.
    solution: Campaigning from places of worship is banned.
  - prompt: Which is a sign that Indian elections are free and fair?
    options:
    - Ruling parties often lose elections
    - The same party always wins
    - Only rich people vote
    - Results are often rejected
    answer: Ruling parties often lose elections
    difficulty: 2
    hints:
    - Real competition.
    - Governments change.
    solution: Governments regularly lose, showing real choice.
  - prompt: Which is a challenge to free and fair elections in India?
    options:
    - Money power and candidates with criminal links
    - An independent Election Commission
    - High voter turnout
    - Secret ballot
    answer: Money power and candidates with criminal links
    difficulty: 2
    hints:
    - Three are strengths.
    - Rich candidates have an unfair edge.
    solution: Money power and criminal candidates are real challenges.
  - prompt: If the Election Commission finds cheating in some booths, what can it do?
    options:
    - Order a repoll
    - Ignore it
    - Declare the ruling party the winner
    - Cancel all elections nationwide
    answer: Order a repoll
    difficulty: 3
    hints:
    - It has wide powers.
    - Hold the vote again in those booths.
    solution: It can order a repoll in the affected booths or constituency.
- code: cbse9us.elect.fptp_pr
  title: Voting systems and the Emergency
  notes: |
    Countries use different ways to turn votes into seats. India uses First Past the Post (FPTP) for the Lok
    Sabha and state assemblies: the country is divided into constituencies, each elects one member, and the
    candidate with the most votes wins, even if that is less than half the votes. It is simple and links each
    area to one representative, but a party's share of seats can differ a lot from its share of votes.
    Proportional Representation (PR), used in countries such as the Netherlands and Israel, gives parties seats
    in proportion to their vote share; India uses a form of it (single transferable vote) for the Rajya Sabha
    and for electing the President. The Emergency (25 June 1975 to March 1977) shows why free elections and
    rights matter: under Article 352 civil liberties were suspended, the press was censored, opposition leaders
    were jailed and elections were postponed. In the 1977 elections voters defeated the ruling party, and the
    44th Amendment (1978) added safeguards against misuse of emergency powers.
  explanations:
    text: In First Past the Post, like a race, whoever comes first in each constituency wins the seat, even with only 40% of the votes. In Proportional Representation, a party with 30% of the votes gets about 30% of the seats. The Emergency of 1975–77 showed what happens when elections and freedoms are suspended, and how voters can restore them.
    visual: 'Draw one constituency with three candidates: A 40%, B 35%, C 25%. Put a crown on A: FPTP winner. Next to it draw a 10-seat parliament split 4–4–2 (rounded): PR.'
    step_by_step: 'Step 1: Count votes in each constituency. Step 2: FPTP: the highest wins the seat. Step 3: PR: add up national votes and share out seats by percentage. Step 4: Compare: FPTP is simple and local; PR matches seats to votes more closely.'
    real_world: In the 1977 Lok Sabha election, held right after the Emergency, voters across North India voted out the ruling party, a strong sign of the power of the ballot.
  picture:
    kind: bars
    bars:
    - label: Candidate A
      value: 40
    - label: Candidate B
      value: 35
    - label: Candidate C
      value: 25
    caption: 'FPTP: A wins with 40%, less than half the votes'
    alt: 'Votes in one constituency: A 40%, B 35%, C 25%. Under First Past the Post, A wins the seat.'
  activity:
    type: sort
    prompt: First Past the Post or Proportional Representation?
    bins:
    - FPTP
    - PR
    items:
    - label: Lok Sabha elections
      bin: FPTP
      clue: One member per constituency.
      why: FPTP.
    - label: Most votes wins, even under half
      bin: FPTP
      clue: Most, not majority.
      why: FPTP.
    - label: Seats in proportion to vote share
      bin: PR
      clue: Netherlands and Israel.
      why: PR.
    - label: Rajya Sabha elections
      bin: PR
      clue: Single transferable vote.
      why: A form of PR.
    - label: Electing the President
      bin: PR
      clue: Single transferable vote.
      why: A form of PR.
    - label: State assembly elections
      bin: FPTP
      clue: Constituencies.
      why: FPTP.
  items:
  - prompt: Which electoral system is used for Lok Sabha elections in India?
    options:
    - First Past the Post
    - Proportional Representation
    - Lottery
    - Nomination by the President
    answer: First Past the Post
    difficulty: 1
    hints:
    - One member per constituency.
    - Most votes wins.
    solution: 'Step 1: Each Lok Sabha constituency elects one member. Step 2: The candidate with the most votes wins: First Past the Post.'
    mistakes:
      Proportional Representation: fptp_pr
  - prompt: In which year was the national Emergency declared in India?
    answer: '1975'
    check: '1975'
    difficulty: 1
    hints:
    - 25 June.
    - Two years before the 1977 election.
    solution: 'Step 1: The Emergency was declared on 25 June 1975. Step 2: Answer: 1975.'
    mistakes:
      '1977': emergency_dates
  - prompt: Candidates in a constituency get 40%, 35% and 25% of the votes. Under FPTP, who wins?
    options:
    - The candidate with 40%
    - Nobody, as no one has over 50%
    - All three share the seat
    - The candidate with 25%
    answer: The candidate with 40%
    difficulty: 1
    hints:
    - Most votes, not majority.
    - Like a race.
    solution: 'Step 1: FPTP needs only the most votes. Step 2: 40% is the highest, so that candidate wins.'
    mistakes:
      Nobody, as no one has over 50%: fptp_pr
  - prompt: A party wins 20% of votes nationally. Under pure Proportional Representation in a 100-seat house, about how many seats does it get?
    answer: '20'
    check: '20'
    difficulty: 2
    hints:
    - Seats match the vote share.
    - 20% of 100.
    solution: 'Step 1: Seats are shared by vote percentage. Step 2: 20% of 100 = 20 seats.'
  - prompt: Which of these happened during the Emergency of 1975–77?
    options:
    - Press censorship and arrest of opposition leaders
    - Extra elections every year
    - More freedom for newspapers
    - Abolition of Parliament
    answer: Press censorship and arrest of opposition leaders
    difficulty: 2
    hints:
    - Civil liberties were suspended.
    - Newspapers were controlled.
    solution: 'Step 1: Fundamental rights were curtailed. Step 2: The press was censored and many opposition leaders were jailed.'
  - prompt: Which is a criticism of the First Past the Post system?
    options:
    - A party's seat share can be very different from its vote share
    - It is too hard to count
    - It has no constituencies
    - Only one party can stand
    answer: A party's seat share can be very different from its vote share
    difficulty: 3
    hints:
    - Winning many seats narrowly.
    - Votes for losers win nothing.
    solution: 'Step 1: A party can win many seats with narrow leads. Step 2: So its seats may far exceed or fall short of its vote share.'
