# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 7. Format: content/README.md.
subject: cbse9-ss
chapter: 7
title: Elections
tips:
  c9us_voting_age: "Voting starts at the age of adulthood. Standing for Lok Sabha needs a few more years of age, and the two ages are different. Check which one the question asks."
  reserved_constituencies: 'Some constituencies are reserved for Scheduled Castes and Scheduled Tribes: only candidates from those groups can stand, but everyone votes.'
  eci_independent: 'The Election Commission is independent: it is not under the government in power, and its Chief Election Commissioner is not easy to remove.'
  fptp_pr: "In one system the winner just needs more votes than anyone else, not over half. In the other, seats follow each party's share of the vote. Think about how a single MP is chosen in your own constituency."
  emergency_dates: "The Emergency was declared in the mid-1970s and lifted two years later, when elections were held."
  s9_543: "That count includes the two seats once nominated for Anglo-Indians. Count only the seats voters elect."
  s9_rs_size: "Around 250 is the Rajya Sabha. The Lok Sabha, elected directly by voters, is more than twice as big."
  s9_ec: "An election needs a referee who is not one of the players. Who is independent of the government?"
  s9_emergency: "During the Emergency, rights were suspended. What happened to the press and the opposition?"
  s9_five_years: "A Lok Sabha's normal term is the same as most state assemblies'."
  s9_fptp_gap: "Under First Past the Post, a party can win many seats on a small lead. Compare its seats with its votes."
  s9_model_code: "Campaigning is allowed, but religion must not be used to win votes."
  s9_money_crime: "A challenge is a problem. Which choice works against fair elections?"
  s9_nomination: "Voters need facts to judge a candidate. What would a voter want to know?"
  s9_pr_share: "In proportional representation, seat share matches vote share."
  s9_repoll: "The Commission fixes the booths where cheating happened. It doesn't cancel everything."
  s9_ruling_loses: "If elections are free, can those in power lose?"
  c9ss7_constituency: Picture the map split into areas. How many winners does each area send, and who in that area may vote?
  c9ss7_age_rule: Voting and standing for election have different age limits. Which one is the question about?
  c9ss7_who_runs: Think of the body set up by the Constitution to run every election, which the government cannot order around.
  c9ss7_fair_sign: Ask what would happen in an unfair system. Would the ruling party ever lose?
  c9ss7_most_votes: Under this system the winner does not need half the votes. Look only for who is ahead.
  c9ss7_share_seats: Under this system a party's seats follow its share of the votes. Work out that share of the seats.
  c9ss7_emergency: Remember what was taken away from citizens for those 21 months, and what voters did afterwards.
concepts:
- code: cbse9us.elect.system
  title: Why elections and India's electoral system
  notes: |
    Elections let people choose representatives regularly and change them. Haryana 1987 example (Devi Lal's
    Nyaya Yudh). Democratic elections need: universal adult franchise, choice of parties and candidates,
    regular elections (every 5 years), free and fair conduct. Lok Sabha: 543 constituencies; each elects
    one MP. Assembly constituencies elect MLAs. Reserved constituencies: 84 for SC, 47 for ST in the Lok
    Sabha (as of 2019). Voters' list (electoral roll); EPIC (Election Photo Identity Card). Voting age 18;
    candidate age 25; candidates file nominations and declare criminal cases, assets, education.
  explanations:
    text: Elections let people choose who governs them and replace them if they do badly. India is divided into 543 Lok Sabha constituencies, each electing one MP. Every citizen aged 18 or over can vote, and candidates must be at least 25. Some seats are reserved for Scheduled Castes and Scheduled Tribes so that these groups get fair representation.
    visual: Picture a map of India cut into 543 pieces like a jigsaw. Each piece sends one MP to the Lok Sabha in Delhi. Some pieces are coloured to show reserved seats.
    step_by_step: 'Step 1: Divide the country into constituencies. Step 2: Prepare the voters'' list of everyone 18+. Step 3: Candidates (25+) file nominations and declare assets and criminal cases. Step 4: Campaign. Step 5: Polling with EVMs. Step 6: Counting; the candidate with the most votes wins.'
    real_world: Before every election, voters can check their name on the electoral roll online and get a voter ID card (EPIC). First-time voters turning 18 are encouraged to register on National Voters' Day, 25 January.
  activity:
    type: scale
    min: 15
    max: 90
    step: 1
    start: 15
    unit: no.
    prompt: India's electoral system. Slide to the number.
    zones: []
    goals:
    - prompt: Minimum age to vote
      value: 18
      mistakes:
      - when:
          v: 25
        say: That's the age to contest an election. Voting starts younger.
      - when:
          v: 21
        say: It was 21 before 1988. The 61st Amendment lowered it.
    - prompt: Minimum age to contest a Lok Sabha election
      value: 25
      mistakes:
      - when:
          v: 18
        say: That's the voting age. A candidate must be older.
    - prompt: Lok Sabha seats reserved for SC (as of 2019)
      value: 84
      mistakes:
      - when:
          v: 47
        say: That's the ST number. SC have more seats reserved.
    - prompt: Lok Sabha seats reserved for ST
      value: 47
      mistakes:
      - when:
          v: 84
        say: That's the SC number. ST have fewer seats reserved.
  lesson:
    - teach: In a democracy people cannot all sit together to make laws, so they choose representatives in elections, and can change them at the next election. For the Lok Sabha, India is divided into 543 constituencies. Voters in each constituency elect one Member of Parliament (MP). In the same way, each state is divided into assembly constituencies that elect MLAs.
      check:
        prompt: How many MPs does one Lok Sabha constituency elect?
        options:
        - One
        - Two
        - Ten
        answer: One
        why: Each constituency sends one representative.
    - teach: 'Every citizen aged 18 or more can vote: this is universal adult franchise. Names are listed in the voters'' list, and voters carry an Election Photo Identity Card (EPIC). To stand for the Lok Sabha a candidate must be at least 25 and must declare any criminal cases, assets and education. Some constituencies are reserved for Scheduled Castes (84) and Scheduled Tribes (47): only SC or ST candidates may contest there, but all voters of the area vote.'
      picture:
        kind: compare
        columns:
        - title: Voter
          points:
          - Age 18 or more
          - Name in voters' list
          - Carries EPIC
        - title: Candidate (Lok Sabha)
          points:
          - Age 25 or more
          - Files nomination
          - Declares cases, assets, education
        alt: Rules for a voter compared with rules for a Lok Sabha candidate.
      check:
        prompt: In a reserved SC constituency, who may vote?
        options:
        - All voters of the constituency
        - Only SC voters
        - Only candidates
        answer: All voters of the constituency
        why: Reservation is about who can stand, not who can vote.
  items:
  - prompt: How many Lok Sabha constituencies are there?
    answer: '543'
    check: '543'
    difficulty: 1
    hints:
    - Each elects one MP.
    - Just over 540.
    solution: There are 543 Lok Sabha constituencies.
    mistakes: {"545": "s9_543", "250": "s9_rs_size"}
  - prompt: What is the minimum age to vote in India?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Adult franchise.
    - Lowered from 21 in 1989.
    solution: Citizens aged 18 or above can vote.
    mistakes:
      '25': c9us_voting_age
  - prompt: What is the minimum age to contest a Lok Sabha election?
    answer: '25'
    check: '25'
    difficulty: 2
    hints:
    - Older than the voting age.
    - A quarter century.
    solution: A candidate must be at least 25 years old.
    mistakes:
      '18': c9us_voting_age
  - prompt: In a constituency reserved for Scheduled Castes, who can vote?
    options:
    - All voters of that constituency
    - Only Scheduled Caste voters
    - Only women
    - Only party members
    answer: All voters of that constituency
    difficulty: 2
    hints:
    - Reservation is about who can stand.
    - Not about who can vote.
    solution: Only SC candidates can contest, but all registered voters can vote.
    mistakes:
      Only Scheduled Caste voters: reserved_constituencies
  - prompt: How often are Lok Sabha elections normally held?
    options:
    - Every 5 years
    - Every 4 years
    - Every 2 years
    - Every 10 years
    answer: Every 5 years
    difficulty: 1
    hints:
    - The term of the Lok Sabha.
    - 'Last ones: 2019, 2024.'
    solution: Lok Sabha elections are held every five years.
    mistakes: {"Every 4 years": "s9_five_years"}
  - prompt: What must candidates declare when filing nominations?
    options:
    - Criminal cases, assets and education
    - Their caste only
    - Their favourite party
    - Nothing
    answer: Criminal cases, assets and education
    difficulty: 3
    hints:
    - A Supreme Court direction.
    - So voters can make informed choices.
    solution: Candidates must declare pending criminal cases, assets and liabilities, and education.
    mistakes: {"Their caste only": "s9_nomination"}
  - prompt: What is the list of all people eligible to vote in a constituency called?
    options:
    - The voters' list (electoral roll)
    - The census
    - The budget
    - The ration card
    answer: The voters' list (electoral roll)
    difficulty: 1
    hints:
    - It is prepared before elections.
    - Your name must be on it to vote.
    solution: The electoral roll, or voters' list, names everyone allowed to vote.
    mistakes:
      The census: c9ss7_constituency
  - prompt: In a constituency reserved for Scheduled Tribes, who may stand as a candidate?
    options:
    - Only a person from a Scheduled Tribe
    - Anyone aged 18
    - Only women
    - Only sitting MPs
    answer: Only a person from a Scheduled Tribe
    difficulty: 2
    hints:
    - Reservation limits the candidates.
    - It does not limit the voters.
    solution: 'Step 1: Reservation is for candidates. Step 2: In an ST seat only ST candidates may contest; all voters vote.'
    mistakes:
      Anyone aged 18: c9ss7_constituency
  - prompt: A 21-year-old wants to contest a Lok Sabha seat. Can they?
    options:
    - No, they must be at least 25
    - Yes, any voter can
    - Yes, if their parents agree
    - No, they must be at least 40
    answer: No, they must be at least 25
    difficulty: 2
    hints:
    - Voting age and candidate age differ.
    - Candidate age is higher.
    solution: 'Step 1: The minimum age to contest the Lok Sabha is 25. Step 2: 21 is below that, so they cannot yet.'
    mistakes:
      Yes, any voter can: c9ss7_age_rule
  - prompt: Why do we need elections in a democracy?
    options:
    - So people can choose and change their representatives
    - So the army can rule
    - So taxes are higher
    - So nobody has to decide
    answer: So people can choose and change their representatives
    difficulty: 1
    hints:
    - Millions cannot all make laws themselves.
    - They choose someone to do it.
    solution: Elections let citizens pick representatives and replace them if they are unhappy.
    mistakes:
      So the army can rule: c9ss6_who_decides
  - prompt: An MLA is elected to the…
    options:
    - State Legislative Assembly
    - Lok Sabha
    - Supreme Court
    - Village panchayat only
    answer: State Legislative Assembly
    difficulty: 1
    hints:
    - 'MLA: Member of the Legislative ...'
    - It works at the state level.
    solution: MLAs are Members of the Legislative Assembly of a state.
    mistakes:
      Lok Sabha: c9ss7_constituency
  - prompt: How many Lok Sabha seats are reserved for Scheduled Tribes?
    answer: 47
    check: '47'
    difficulty: 3
    hints:
    - Fewer than the SC seats.
    - The SC number is 84.
    solution: 'Step 1: 84 seats are reserved for SC. Step 2: 47 seats are reserved for ST.'
    mistakes:
      '84': c9ss7_constituency
  - prompt: What does 'universal adult franchise' mean?
    options:
    - Every adult citizen has the right to vote
    - Only educated people vote
    - Only men vote
    - Only taxpayers vote
    answer: Every adult citizen has the right to vote
    difficulty: 2
    hints:
    - Universal means for all.
    - Franchise means the right to vote.
    solution: Universal adult franchise gives the vote to all adult citizens, regardless of wealth, caste, gender or education.
    mistakes:
      Only educated people vote: c9ss6_equal_vote
  - prompt: Why must candidates declare their assets and criminal cases?
    options:
    - So voters can make an informed choice
    - To pay more tax
    - To get a free car
    - To avoid the election
    answer: So voters can make an informed choice
    difficulty: 2
    hints:
    - Who reads this information?
    - It helps people judge a candidate.
    solution: 'Step 1: The details are made public. Step 2: Voters can then judge whom to trust.'
    mistakes:
      To pay more tax: c9ss7_who_runs
  - prompt: What does EPIC stand for in Indian elections?
    options:
    - Election Photo Identity Card
    - Every Person Is Counted
    - Electoral Party Information Centre
    - Election Polling Index Code
    answer: Election Photo Identity Card
    difficulty: 1
    hints:
    - Voters carry it.
    - It has their photo.
    solution: The EPIC is the voter's photo identity card.
    mistakes:
      Every Person Is Counted: c9ss7_constituency
- code: cbse9us.elect.fair
  title: What makes elections democratic
  after:
  - cbse9us.elect.system
  notes: |
    Election Commission of India: independent, conducts elections, enforces the code of conduct, can order
    repolls, controls government officials on election duty. Chief Election Commissioner appointed by
    the President but not answerable to the government. Code of conduct: no use of government resources,
    no places of worship for campaigning, no new projects after announcement. Indian elections are
    generally free and fair: ruling parties often lose; high turnout among poor, rural and less educated
    voters; results accepted. Challenges: money power, candidates with criminal links, family politics.
  explanations:
    text: 'An independent Election Commission runs India''s elections. It enforces a code of conduct, so the ruling party can''t misuse government money or officials, and it can cancel and re-hold a poll if there is cheating. Indian elections are largely free and fair: ruling parties often lose, and poor and rural voters turn out in large numbers. Challenges remain, like the role of money and candidates with criminal records.'
    visual: 'Picture a cricket match. The Election Commission is the umpire: neutral, enforcing the rules on both teams, and able to order a replay. The code of conduct is the rulebook.'
    step_by_step: 'Step 1: Who conducts elections? The Election Commission. Step 2: Is it independent? Yes; the CEC isn''t answerable to the government. Step 3: What rules apply? The code of conduct. Step 4: Is it fair? Check if rulers lose, turnout is high, results are accepted. Step 5: Note the challenges.'
    real_world: In past elections, the Election Commission has transferred officials, stopped ministers from announcing new schemes, and even ordered repolling in booths where machines were tampered with.
  activity:
    type: sort
    prompt: Allowed under the code of conduct, or not?
    bins:
    - Allowed
    - Not allowed
    items:
    - label: Campaigning at a public rally
      bin: Allowed
      clue: Normal campaign.
      why: Allowed.
    - label: Using a government car for campaigning
      bin: Not allowed
      clue: Government resources.
      why: Not allowed.
    - label: Campaigning in a place of worship
      bin: Not allowed
      clue: Religion.
      why: Not allowed.
    - label: Announcing a new project after elections are announced
      bin: Not allowed
      clue: Bribing voters with schemes.
      why: Not allowed.
    - label: Door-to-door canvassing
      bin: Allowed
      clue: Meeting voters.
      why: Allowed.
  lesson:
    - teach: 'Elections in India are run by the Election Commission. It is independent: the Chief Election Commissioner is appointed by the President, but once appointed is not answerable to the government. During elections the Commission controls officials on election duty, enforces the model code of conduct and can order a repoll where cheating is found.'
      check:
        prompt: Who conducts elections in India?
        options:
        - The Election Commission
        - The ruling party
        - The army
        answer: The Election Commission
        why: It is an independent constitutional body.
    - teach: 'The model code of conduct says parties and candidates must not use places of worship for campaigning, must not use government vehicles or officials, and ministers must not announce new projects once elections are declared. Signs that Indian elections are free and fair: ruling parties often lose; voter turnout is high, especially among poor and rural people; and losers accept the results. Challenges remain: money power, candidates with criminal links, and some parties run by one family.'
      picture:
        kind: compare
        columns:
        - title: Signs of fair elections
          points:
          - Ruling parties often lose
          - High turnout of the poor
          - Results accepted
        - title: Challenges
          points:
          - Money power
          - Candidates with criminal links
          - Family politics
        alt: Signs that Indian elections are fair compared with the challenges that remain.
      check:
        prompt: Which suggests elections are fair?
        options:
        - Ruling parties sometimes lose
        - The same party always wins
        - Nobody votes
        answer: Ruling parties sometimes lose
        why: If rulers can lose, the contest is real.
  items:
  - prompt: Who conducts elections in India?
    options:
    - The Election Commission
    - The Prime Minister
    - The Supreme Court
    - The ruling party
    answer: The Election Commission
    difficulty: 1
    hints:
    - An independent body.
    - Headed by the Chief Election Commissioner.
    solution: The Election Commission of India conducts elections.
    mistakes: {"The Prime Minister": "s9_ec", "The ruling party": "s9_ec"}
  - prompt: Why is the Election Commission said to be independent?
    options:
    - Its head is not answerable to the government in power
    - It is run by the ruling party
    - It is elected every year
    - It works for the Prime Minister
    answer: Its head is not answerable to the government in power
    difficulty: 2
    hints:
    - Appointed by the President.
    - But hard to remove.
    solution: The CEC is not answerable to the President or government once appointed.
    mistakes:
      It works for the Prime Minister: eci_independent
  - prompt: Which is NOT allowed under the model code of conduct?
    options:
    - Using a place of worship for campaigning
    - Holding public meetings
    - Printing posters
    - Going door to door
    answer: Using a place of worship for campaigning
    difficulty: 1
    hints:
    - Religion must not be used.
    - Three are normal campaigning.
    solution: Campaigning from places of worship is banned.
    mistakes: {"Holding public meetings": "s9_model_code"}
  - prompt: Which is a sign that Indian elections are free and fair?
    options:
    - Ruling parties often lose elections
    - The same party always wins
    - Only rich people vote
    - Results are often rejected
    answer: Ruling parties often lose elections
    difficulty: 2
    hints:
    - Real competition.
    - Governments change.
    solution: Governments regularly lose, showing real choice.
    mistakes: {"The same party always wins": "s9_ruling_loses"}
  - prompt: Which is a challenge to free and fair elections in India?
    options:
    - Money power and candidates with criminal links
    - An independent Election Commission
    - High voter turnout
    - Secret ballot
    answer: Money power and candidates with criminal links
    difficulty: 2
    hints:
    - Three are strengths.
    - Rich candidates have an unfair edge.
    solution: Money power and criminal candidates are real challenges.
    mistakes: {"An independent Election Commission": "s9_money_crime"}
  - prompt: If the Election Commission finds cheating in some booths, what can it do?
    options:
    - Order a repoll
    - Ignore it
    - Declare the ruling party the winner
    - Cancel all elections nationwide
    answer: Order a repoll
    difficulty: 3
    hints:
    - It has wide powers.
    - Hold the vote again in those booths.
    solution: It can order a repoll in the affected booths or constituency.
    mistakes: {"Cancel all elections nationwide": "s9_repoll"}
  - prompt: Elections have been announced. A minister wants to open a new bridge project in their own constituency. Is this allowed?
    options:
    - No, the code of conduct forbids new projects after announcement
    - Yes, ministers can do anything
    - Yes, if it is a small bridge
    - Only on Sundays
    answer: No, the code of conduct forbids new projects after announcement
    difficulty: 2
    hints:
    - Why might a new project now be unfair?
    - It could win votes using public money.
    solution: 'Step 1: Announcing projects during elections uses government power to win votes. Step 2: The code of conduct forbids it.'
    mistakes:
      Yes, ministers can do anything: c9ss7_who_runs
  - prompt: Who appoints the Chief Election Commissioner?
    options:
    - The President
    - The ruling party chief
    - The Supreme Court judges by vote
    - The voters directly
    answer: The President
    difficulty: 2
    hints:
    - The head of the state.
    - Once appointed, the CEC is not answerable to the government.
    solution: The President appoints the CEC, who then works independently.
    mistakes:
      The ruling party chief: c9ss7_who_runs
  - prompt: During elections, a government officer on election duty takes orders from…
    options:
    - The Election Commission
    - The local MLA
    - The ruling party
    - Any candidate
    answer: The Election Commission
    difficulty: 2
    hints:
    - Who controls the elections?
    - Not the government of the day.
    solution: Officials on election duty work under the Election Commission, not the government.
    mistakes:
      The ruling party: c9ss7_who_runs
  - prompt: Which group in India votes in larger proportion than the rich and educated?
    options:
    - Poor and rural people
    - Only city businessmen
    - Only foreigners
    - Only MPs
    answer: Poor and rural people
    difficulty: 2
    hints:
    - This is unusual compared with many countries.
    - Think of turnout in villages.
    solution: In India, poor, rural and less educated voters often turn out in higher proportions.
    mistakes:
      Only city businessmen: c9ss7_fair_sign
  - prompt: A candidate gives voters money to win their votes. Which challenge is this?
    options:
    - Money power
    - Universal franchise
    - Rule of law
    - Proportional representation
    answer: Money power
    difficulty: 1
    hints:
    - What is being used to win?
    - It gives rich candidates an unfair edge.
    solution: Using money to buy votes is the challenge of money power.
    mistakes:
      Rule of law: c9ss7_fair_sign
  - prompt: Which of these is NOT allowed under the model code of conduct?
    options:
    - Using government vehicles for campaigning
    - Holding a public meeting
    - Printing posters
    - Going door to door
    answer: Using government vehicles for campaigning
    difficulty: 1
    hints:
    - Three are normal campaign activities.
    - One misuses public property.
    solution: 'Step 1: Meetings, posters and visits are allowed. Step 2: Using government vehicles misuses public resources.'
    mistakes:
      Holding a public meeting: c9ss7_who_runs
  - prompt: After losing an election, a party accepts the result and sits in opposition. What does this show?
    options:
    - People trust the electoral process
    - The election was unfair
    - The army took over
    - No votes were counted
    answer: People trust the electoral process
    difficulty: 2
    hints:
    - Would losers accept a rigged result?
    - Acceptance means trust.
    solution: Losers accepting results shows the election is seen as fair.
    mistakes:
      The election was unfair: c9ss7_fair_sign
  - prompt: Why is it important that the Election Commission is independent of the government?
    options:
    - So the ruling party cannot bend the rules to win
    - So elections cost less
    - So there are no candidates
    - So the EC can make laws
    answer: So the ruling party cannot bend the rules to win
    difficulty: 3
    hints:
    - Who might want to misuse power in an election?
    - A referee must not belong to one team.
    solution: 'Step 1: The ruling party is also a contestant. Step 2: If it controlled the referee, it could tilt the contest.'
    mistakes:
      So elections cost less: c9ss7_who_runs
  - prompt: Which is a challenge to fair elections in India?
    options:
    - Some parties are controlled by one family
    - Votes are secret
    - There are many parties
    - Voters carry ID cards
    answer: Some parties are controlled by one family
    difficulty: 2
    hints:
    - Three of these are good features.
    - Who gets tickets in such parties?
    solution: When a few families control parties, ordinary members have little chance to rise.
    mistakes:
      Votes are secret: c9ss7_fair_sign
- code: cbse9us.elect.fptp_pr
  title: Voting systems and the Emergency
  notes: |
    Countries use different ways to turn votes into seats. India uses First Past the Post (FPTP) for the Lok
    Sabha and state assemblies: the country is divided into constituencies, each elects one member, and the
    candidate with the most votes wins, even if that is less than half the votes. It is simple and links each
    area to one representative, but a party's share of seats can differ a lot from its share of votes.
    Proportional Representation (PR), used in countries such as the Netherlands and Israel, gives parties seats
    in proportion to their vote share; India uses a form of it (single transferable vote) for the Rajya Sabha
    and for electing the President. The Emergency (25 June 1975 to March 1977) shows why free elections and
    rights matter: under Article 352 civil liberties were suspended, the press was censored, opposition leaders
    were jailed and elections were postponed. In the 1977 elections voters defeated the ruling party, and the
    44th Amendment (1978) added safeguards against misuse of emergency powers.
  explanations:
    text: In First Past the Post, like a race, whoever comes first in each constituency wins the seat, even with only 40% of the votes. In Proportional Representation, a party with 30% of the votes gets about 30% of the seats. The Emergency of 1975–77 showed what happens when elections and freedoms are suspended, and how voters can restore them.
    visual: 'Draw one constituency with three candidates: A 40%, B 35%, C 25%. Put a crown on A: FPTP winner. Next to it draw a 10-seat parliament split 4–4–2 (rounded): PR.'
    step_by_step: 'Step 1: Count votes in each constituency. Step 2: FPTP: the highest wins the seat. Step 3: PR: add up national votes and share out seats by percentage. Step 4: Compare: FPTP is simple and local; PR matches seats to votes more closely.'
    real_world: In the 1977 Lok Sabha election, held right after the Emergency, voters across North India voted out the ruling party, a strong sign of the power of the ballot.
  picture:
    kind: bars
    bars:
    - label: Candidate A
      value: 40
    - label: Candidate B
      value: 35
    - label: Candidate C
      value: 25
    caption: 'FPTP: A wins with 40%, less than half the votes'
    alt: 'Votes in one constituency: A 40%, B 35%, C 25%. Under First Past the Post, A wins the seat.'
  activity:
    type: sort
    prompt: First Past the Post or Proportional Representation?
    bins:
    - FPTP
    - PR
    items:
    - label: Lok Sabha elections
      bin: FPTP
      clue: One member per constituency.
      why: FPTP.
    - label: Most votes wins, even under half
      bin: FPTP
      clue: Most, not majority.
      why: FPTP.
    - label: Seats in proportion to vote share
      bin: PR
      clue: Netherlands and Israel.
      why: PR.
    - label: Rajya Sabha elections
      bin: PR
      clue: Single transferable vote.
      why: A form of PR.
    - label: Electing the President
      bin: PR
      clue: Single transferable vote.
      why: A form of PR.
    - label: State assembly elections
      bin: FPTP
      clue: Constituencies.
      why: FPTP.
  lesson:
    - teach: In India's Lok Sabha and assembly elections, the candidate with the most votes in a constituency wins, even with less than half the votes. This is First Past the Post (FPTP). It is simple and gives each area one representative. But a party's share of seats can be very different from its share of votes.
      picture:
        kind: bars
        bars:
        - label: A
          value: 40
        - label: B
          value: 35
        - label: C
          value: 25
        unit: '% of votes'
        alt: 'Votes in one constituency: candidate A 40 percent, B 35 percent, C 25 percent.'
      check:
        prompt: In the picture, who wins under FPTP?
        options:
        - Candidate A
        - Candidate B
        - Nobody, a rerun is needed
        answer: Candidate A
        why: The highest number of votes wins, even below half.
    - teach: 'Under Proportional Representation (PR), used in countries like the Netherlands and Israel, parties get seats in proportion to their votes: 30% of votes means about 30% of seats. India uses a form of PR (single transferable vote) to elect the Rajya Sabha and the President.'
      check:
        prompt: A party wins 30% of votes. Under PR in a 100-seat house, about how many seats?
        options:
        - '30'
        - '100'
        - '0'
        answer: '30'
        why: Seats follow vote share.
    - teach: Why do fair elections and rights matter? On 25 June 1975 a national Emergency was declared under Article 352. Civil liberties were suspended, the press was censored, opposition leaders were jailed and elections were put off. It lasted until March 1977. In the 1977 election voters defeated the ruling party, and the 44th Amendment (1978) added safeguards against misuse of emergency powers.
      picture:
        kind: flow
        steps:
        - 'June 1975: Emergency declared'
        - Rights suspended, press censored
        - 'March 1977: elections, ruling party defeated'
        - '1978: 44th Amendment safeguards'
        alt: Timeline of the Emergency from its declaration in 1975 to the 1977 election and the 1978 safeguards.
      check:
        prompt: What did voters do in 1977?
        options:
        - Defeated the ruling party
        - Cancelled all elections
        - Made the Emergency permanent
        answer: Defeated the ruling party
        why: Elections let people punish the misuse of power.
  items:
  - prompt: Which electoral system is used for Lok Sabha elections in India?
    options:
    - First Past the Post
    - Proportional Representation
    - Lottery
    - Nomination by the President
    answer: First Past the Post
    difficulty: 1
    hints:
    - One member per constituency.
    - Most votes wins.
    solution: 'Step 1: Each Lok Sabha constituency elects one member. Step 2: The candidate with the most votes wins: First Past the Post.'
    mistakes:
      Proportional Representation: fptp_pr
  - prompt: In which year was the national Emergency declared in India?
    answer: '1975'
    check: '1975'
    difficulty: 1
    hints:
    - 25 June.
    - Two years before the 1977 election.
    solution: 'Step 1: The Emergency was declared on 25 June 1975. Step 2: Answer: 1975.'
    mistakes:
      '1977': emergency_dates
  - prompt: Candidates in a constituency get 40%, 35% and 25% of the votes. Under FPTP, who wins?
    options:
    - The candidate with 40%
    - Nobody, as no one has over 50%
    - All three share the seat
    - The candidate with 25%
    answer: The candidate with 40%
    difficulty: 1
    hints:
    - Most votes, not majority.
    - Like a race.
    solution: 'Step 1: FPTP needs only the most votes. Step 2: 40% is the highest, so that candidate wins.'
    mistakes:
      Nobody, as no one has over 50%: fptp_pr
  - prompt: A party wins 20% of votes nationally. Under pure Proportional Representation in a 100-seat house, about how many seats does it get?
    answer: '20'
    check: '20'
    difficulty: 2
    hints:
    - Seats match the vote share.
    - 20% of 100.
    solution: 'Step 1: Seats are shared by vote percentage. Step 2: 20% of 100 = 20 seats.'
    mistakes: {"0": "s9_pr_share", "100": "s9_pr_share"}
  - prompt: Which of these happened during the Emergency of 1975–77?
    options:
    - Press censorship and arrest of opposition leaders
    - Extra elections every year
    - More freedom for newspapers
    - Abolition of Parliament
    answer: Press censorship and arrest of opposition leaders
    difficulty: 2
    hints:
    - Civil liberties were suspended.
    - Newspapers were controlled.
    solution: 'Step 1: Fundamental rights were curtailed. Step 2: The press was censored and many opposition leaders were jailed.'
    mistakes: {"More freedom for newspapers": "s9_emergency"}
  - prompt: Which is a criticism of the First Past the Post system?
    options:
    - A party's seat share can be very different from its vote share
    - It is too hard to count
    - It has no constituencies
    - Only one party can stand
    answer: A party's seat share can be very different from its vote share
    difficulty: 3
    hints:
    - Winning many seats narrowly.
    - Votes for losers win nothing.
    solution: 'Step 1: A party can win many seats with narrow leads. Step 2: So its seats may far exceed or fall short of its vote share.'
    mistakes: {"It is too hard to count": "s9_fptp_gap"}
  - prompt: Which method is used to elect members of the Rajya Sabha?
    options:
    - A form of proportional representation
    - First Past the Post
    - Lottery
    - Appointment by the army
    answer: A form of proportional representation
    difficulty: 2
    hints:
    - It is not the Lok Sabha method.
    - It uses single transferable vote.
    solution: Rajya Sabha members are elected by state MLAs using single transferable vote, a type of PR.
    mistakes:
      First Past the Post: c9ss7_share_seats
  - prompt: Under which Article of the Constitution was the national Emergency of 1975 declared?
    options:
    - Article 352
    - Article 21
    - Article 370
    - Article 1
    answer: Article 352
    difficulty: 3
    hints:
    - It is the national emergency article.
    - It is in the 350s.
    solution: A national emergency is declared under Article 352.
    mistakes:
      Article 21: c9ss7_emergency
  - prompt: Party X won 30% of votes nationally but 55% of seats under FPTP. What does this show?
    options:
    - Seat share can differ greatly from vote share
    - FPTP gives exactly fair shares
    - The votes were not counted
    - Party X lost
    answer: Seat share can differ greatly from vote share
    difficulty: 2
    hints:
    - Compare the two numbers.
    - Are they close?
    solution: 'Step 1: 30% of votes became 55% of seats. Step 2: Under FPTP, winning many close contests can multiply seats.'
    mistakes:
      FPTP gives exactly fair shares: c9ss7_most_votes
  - prompt: Which amendment, passed in 1978, added safeguards against misuse of emergency powers?
    options:
    - 44th Amendment
    - 1st Amendment
    - 73rd Amendment
    - 86th Amendment
    answer: 44th Amendment
    difficulty: 3
    hints:
    - It came right after the Emergency.
    - Its number is in the 40s.
    solution: The 44th Amendment (1978) made it harder to misuse emergency powers.
    mistakes:
      73rd Amendment: c9ss7_emergency
  - prompt: In a 200-seat house using PR, a party gets 15% of votes. About how many seats does it get?
    answer: 30
    check: 200 * 15 / 100
    difficulty: 2
    hints:
    - Seats follow vote share.
    - Find 15% of 200.
    solution: 'Step 1: 15% of 200 = 200 × 15 ÷ 100. Step 2: That is 30 seats.'
    mistakes:
      '15': c9ss7_share_seats
  - prompt: Which is an advantage of the FPTP system?
    options:
    - It is simple and links each area to one representative
    - It always matches votes and seats exactly
    - It needs no voters
    - It has no constituencies
    answer: It is simple and links each area to one representative
    difficulty: 2
    hints:
    - Think about voters knowing their own MP.
    - It is easy to understand.
    solution: FPTP is easy to understand, and every constituency has a known representative.
    mistakes:
      It always matches votes and seats exactly: c9ss7_most_votes
  - prompt: Candidates get 45%, 30% and 25% of the votes. Under FPTP, does the winner have a majority (more than half) of the votes?
    options:
    - No, but they still win
    - Yes, 45% is more than half
    - No, so there is no winner
    - Yes, because they came first
    answer: No, but they still win
    difficulty: 2
    hints:
    - Half is 50%.
    - FPTP needs only the most votes.
    solution: 'Step 1: 45% is less than 50%. Step 2: Under FPTP the leader still wins.'
    mistakes:
      No, so there is no winner: c9ss7_most_votes
  - prompt: How long did the national Emergency last?
    options:
    - About 21 months, June 1975 to March 1977
    - About one week
    - About ten years
    - It is still in force
    answer: About 21 months, June 1975 to March 1977
    difficulty: 2
    hints:
    - It began in mid-1975.
    - It ended before the 1977 elections.
    solution: From 25 June 1975 to March 1977 is about 21 months.
    mistakes:
      About ten years: c9ss7_emergency
  - prompt: What lesson does the Emergency teach about democracy?
    options:
    - Rights and free elections need protection from misuse of power
    - Elections are not needed
    - The press should always be censored
    - Opposition leaders should be jailed
    answer: Rights and free elections need protection from misuse of power
    difficulty: 3
    hints:
    - What was taken away in 1975?
    - How was it set right?
    solution: 'Step 1: Rights and elections were suspended. Step 2: Voters punished this in 1977, and safeguards were added. Step 3: Democracy needs alert citizens and safeguards.'
    mistakes:
      Elections are not needed: c9ss7_emergency
