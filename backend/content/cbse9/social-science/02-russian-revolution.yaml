# CBSE Class 9 Social Science (NCERT), History chapter 2. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 2
title: Socialism in Europe and the Russian Revolution

tips:
  liberal_radical_conservative: "Liberals wanted change but not votes for all; radicals wanted government by the majority, including women; conservatives wanted change slowly, respecting the past."
  february_october: "February 1917 removed the Tsar. October 1917 brought the Bolsheviks under Lenin to power."

concepts:
  - code: cbse9ss.russia.ideas
    title: Liberals, radicals, conservatives and socialism
    notes: |
      After the French Revolution: liberals (religious tolerance, individual rights, elected parliament, but
      vote only for property-owning men), radicals (majority rule, women's suffrage, against concentration
      of property), conservatives (accepted slow change). Industrial society brought long hours and poor
      conditions. Socialists opposed private property: Robert Owen (New Harmony), Louis Blanc, Karl Marx and
      Friedrich Engels (capitalist society, workers to overthrow capitalism, communist society). Second
      International (1889); labour parties in Britain and Germany.
    explanations:
      text: "After 1789, Europeans argued about how much society should change. Liberals wanted rights and parliaments but limited voting. Radicals wanted every adult to vote, including women. Conservatives wanted change slowly. Socialists went further: factories and land should be owned by society, not individuals. Karl Marx argued workers would overthrow capitalism."
      visual: "Draw a line from 'keep things as they are' to 'change everything'. Put conservatives near the left, liberals in the middle, radicals further right, and socialists at the far end."
      step_by_step: "Step 1: Ask, who should vote? Liberals: property-owning men. Radicals: all, including women. Step 2: Ask, who should own property? Socialists: society as a whole. Step 3: Ask, how fast should change come? Conservatives: slowly."
      real_world: "Debates today about who should own railways or electricity companies, the government or private firms, echo these same 19th-century arguments."
    items:
      - prompt: "Which group wanted a government based on the majority, including women?"
        options: ["Radicals", "Liberals", "Conservatives", "Monarchists"]
        answer: "Radicals"
        difficulty: 1
        hints: ["They went beyond the liberals.", "Universal vote."]
        solution: "Radicals supported majority rule and women's suffrage."
        mistakes: {"Liberals": liberal_radical_conservative}
      - prompt: "Who wrote, with Engels, that workers would overthrow capitalism?"
        options: ["Karl Marx", "Robert Owen", "Louis Blanc", "Lenin"]
        answer: "Karl Marx"
        difficulty: 1
        hints: ["German thinker.", "The Communist Manifesto."]
        solution: "Karl Marx, with Friedrich Engels."
      - prompt: "Socialists were against which of these?"
        options: ["Private property", "Education", "Factories", "Voting"]
        answer: "Private property"
        difficulty: 1
        hints: ["They saw it as the root of inequality.", "Owned by society instead."]
        solution: "Socialists opposed private ownership of property."
      - prompt: "Robert Owen tried to build a cooperative community called New Harmony. In which country?"
        options: ["USA", "Russia", "France", "Germany"]
        answer: "USA"
        difficulty: 2
        hints: ["He was English, but the community was abroad.", "Indiana."]
        solution: "New Harmony was in Indiana, USA."
      - prompt: "Liberals wanted voting rights for…"
        options: ["Property-owning men only", "All adults", "Women only", "Nobody"]
        answer: "Property-owning men only"
        difficulty: 2
        hints: ["They were not democrats in today's sense.", "Radicals wanted more."]
        solution: "Liberals supported voting only by men who owned property."
        mistakes: {"All adults": liberal_radical_conservative}
      - prompt: "In which year was the Second International formed?"
        answer: "1889"
        check: "1889"
        difficulty: 3
        hints: ["An international body of socialists.", "Exactly 100 years after the French Revolution."]
        solution: "The Second International was formed in 1889."

  - code: cbse9ss.russia.revolution
    title: The Russian Revolution and its results
    after: [cbse9ss.russia.ideas]
    notes: |
      Russian Empire under Tsar Nicholas II; about 85% agriculturists. 1905 Revolution after Bloody Sunday;
      Duma created. First World War hardships. February Revolution 1917: Tsar abdicated, Provisional
      Government. Lenin's April Theses: end war, land to peasants, banks nationalised ("Peace, Land, Bread").
      October Revolution 1917 (24–25 October): Bolsheviks took power. Civil war (Reds vs Whites/Greens),
      Cheka, centralised planning; Stalin's Five Year Plans (1928 onward) and collectivisation. Global
      influence: inspired communist parties, including the Communist Party of India (M.N. Roy).
    explanations:
      text: "Russia in 1914 was ruled by Tsar Nicholas II, and most people were poor peasants. The First World War made life worse. In February 1917 the Tsar was forced out. In October 1917 Lenin's Bolsheviks took power, promising 'Peace, Land, Bread'. Later, Stalin's Five Year Plans built industry fast, and collectivisation forced peasants onto state-controlled farms."
      visual: "Draw two arrows in 1917: February, the Tsar's crown falls; October, the Bolshevik red flag rises. Then a long arrow through the 1920s and 30s labelled 'Five Year Plans' and 'collective farms'."
      step_by_step: "Step 1: 1905: Bloody Sunday, a Duma is formed. Step 2: 1914–17: war brings hunger. Step 3: February 1917: Tsar abdicates. Step 4: October 1917: Bolsheviks under Lenin take power. Step 5: Civil war, then Stalin's plans and collectivisation."
      real_world: "The idea of Five Year Plans travelled far: independent India also used Five Year Plans from 1951 to guide its economy, though in a mixed economy."
    items:
      - prompt: "Who was the Tsar of Russia during the 1917 revolution?"
        options: ["Nicholas II", "Alexander III", "Peter the Great", "Lenin"]
        answer: "Nicholas II"
        difficulty: 1
        hints: ["He abdicated in February 1917.", "The last Tsar."]
        solution: "Nicholas II was the last Tsar."
      - prompt: "What was the Bolsheviks' famous slogan?"
        options: ["Peace, Land, Bread", "Liberty, Equality, Fraternity", "Blood and Iron", "Workers of the world, unite only"]
        answer: "Peace, Land, Bread"
        difficulty: 1
        hints: ["From Lenin's April Theses.", "End war, give land, feed people."]
        solution: "Peace, Land, Bread."
      - prompt: "In which revolution of 1917 did the Bolsheviks take power?"
        options: ["October Revolution", "February Revolution", "1905 Revolution", "July Days"]
        answer: "October Revolution"
        difficulty: 1
        hints: ["February removed the Tsar.", "Lenin came to power later in the year."]
        solution: "The Bolsheviks seized power in the October Revolution."
        mistakes: {"February Revolution": february_october}
      - prompt: "About what percentage of Russia's people were agriculturists in the early 1900s?"
        answer: "85"
        check: "85"
        difficulty: 2
        hints: ["A very large majority.", "More than four in five."]
        solution: "About 85% of Russians earned their living from farming."
      - prompt: "Stalin's policy of combining small farms into large state-controlled farms was called…"
        options: ["Collectivisation", "Industrialisation", "Privatisation", "Liberalisation"]
        answer: "Collectivisation"
        difficulty: 2
        hints: ["Farms called kolkhoz.", "Collective."]
        solution: "This was collectivisation."
      - prompt: "In which year did the first Five Year Plan of the USSR begin?"
        answer: "1928"
        check: "1928"
        difficulty: 3
        hints: ["Under Stalin.", "Late 1920s."]
        solution: "The first Five Year Plan began in 1928."
