# CBSE Class 9 Social Science (NCERT), History: India and the Contemporary World I, chapter 1.
# Chapters are numbered across the four books: History 1–5, Geography 6–11, Civics 12–16, Economics 17–20.
subject: cbse9-ss
chapter: 1
title: The French Revolution

tips:
  three_estates: "The First Estate was the clergy, the Second the nobility, and the Third everyone else (peasants, workers, merchants, lawyers). Only the Third Estate paid taxes like the taille."
  tennis_court: "The Tennis Court Oath (20 June 1789) was taken by Third Estate members who declared themselves the National Assembly."

concepts:
  - code: cbse9ss.french.causes
    title: France before 1789 and the outbreak
    notes: |
      Louis XVI became king in 1774; France was in debt after wars, including helping the American
      colonies. Society of estates: clergy and nobility were exempt from taxes; the Third Estate paid taxes
      to the state (taille), tithes to the church and feudal dues. Rising bread prices and a subsistence
      crisis. Philosophers: John Locke (against divine right), Rousseau (The Social Contract), Montesquieu
      (The Spirit of the Laws: separation of powers). Estates General met 5 May 1789; voting by estate
      rejected; Third Estate formed the National Assembly (Tennis Court Oath, 20 June). Storming of the
      Bastille on 14 July 1789.
    explanations:
      text: "Before 1789, French society was split into three estates. The clergy and nobles had privileges and paid almost no taxes, while the Third Estate, about 97% of people, carried the burden. When the king called the Estates General to raise taxes, the Third Estate demanded one vote per member, was refused, and declared itself the National Assembly. On 14 July 1789 crowds stormed the Bastille prison."
      visual: "Draw a pyramid. A small top for the clergy, a slightly bigger layer for the nobles, and a huge base for peasants, workers and the middle class. Draw all the tax arrows coming from the base and going up: that pressure is what toppled the pyramid."
      step_by_step: "Step 1: Debt: wars left France broke. Step 2: Unfair taxes: only the Third Estate paid. Step 3: Bread prices rose; people were hungry. Step 4: New ideas from Locke, Rousseau and Montesquieu questioned the king's absolute power. Step 5: The Estates General failed; the National Assembly formed. Step 6: The Bastille fell on 14 July 1789."
      real_world: "Imagine a class where only one group of students does all the cleaning while two groups are excused. Eventually the cleaners demand equal rules. The French Revolution was this, for a whole country."
    picture:
      kind: flow
      steps: [Wars and a costly court leave France in debt, Louis XVI plans new taxes, 'The Estates General meets, May 1789', The Third Estate forms the National Assembly, 'The Bastille is stormed, 14 July 1789']
      alt: 'Steps to the French Revolution: debt, new taxes, the Estates General in May 1789, the National Assembly, and the fall of the Bastille on 14 July 1789.'
    items:
      - prompt: "In which year did the French Revolution begin?"
        answer: "1789"
        check: "1789"
        difficulty: 1
        hints: ["The Bastille was stormed in this year.", "Late 18th century."]
        solution: "The Revolution began in 1789 with the storming of the Bastille on 14 July."
      - prompt: "Which group made up the First Estate in France?"
        options: ["The clergy", "The nobility", "Peasants", "Merchants"]
        answer: "The clergy"
        difficulty: 1
        hints: ["It's linked to the church.", "Nobles were the Second Estate."]
        solution: "The First Estate was the clergy."
        mistakes: {"The nobility": three_estates}
      - prompt: "Who paid the tax called taille?"
        options: ["Only the Third Estate", "Only the clergy", "Only the nobles", "All three estates"]
        answer: "Only the Third Estate"
        difficulty: 1
        hints: ["The first two estates were exempt.", "Peasants and commoners paid it."]
        solution: "The taille was a direct tax paid only by the Third Estate."
        mistakes: {"All three estates": three_estates}
      - prompt: "Who wrote 'The Social Contract'?"
        options: ["Jean-Jacques Rousseau", "John Locke", "Montesquieu", "Louis XVI"]
        answer: "Jean-Jacques Rousseau"
        difficulty: 2
        hints: ["A government based on a contract between people and their representatives.", "French philosopher."]
        solution: "Rousseau wrote The Social Contract."
      - prompt: "Montesquieu proposed dividing government into the legislative, executive and judiciary. How many branches is that?"
        answer: "3"
        check: "3"
        difficulty: 2
        hints: ["Separation of powers.", "Count them."]
        solution: "Three branches, in The Spirit of the Laws."
      - prompt: "What did the Tennis Court Oath members declare themselves?"
        options: ["The National Assembly", "The Estates General", "The Jacobin Club", "The Directory"]
        answer: "The National Assembly"
        difficulty: 2
        hints: ["20 June 1789.", "They vowed to draft a constitution."]
        solution: "Third Estate members declared themselves the National Assembly."
        mistakes: {"The Estates General": tennis_court}

  - code: cbse9ss.french.republic
    title: Constitution, Republic and legacy
    after: [cbse9ss.french.causes]
    notes: |
      Constitution of 1791: constitutional monarchy, only active citizens (men over 25 paying taxes) could
      vote; Declaration of the Rights of Man and Citizen. 1792: Jacobins (Robespierre), France became a
      republic; Louis XVI executed 1793. Reign of Terror 1793–94 ended with Robespierre's execution.
      Directory, then Napoleon (emperor 1804). Women's clubs (Olympe de Gouges); women got the vote in France
      only in 1946. Slavery abolished 1794, reintroduced by Napoleon, finally abolished 1848. Legacy: liberty,
      equality, fraternity spread worldwide (Tipu Sultan, Raja Rammohan Roy referred to it).
    explanations:
      text: "The National Assembly wrote a constitution in 1791 and the Declaration of the Rights of Man. In 1792 France became a republic, and Louis XVI was executed in 1793. Robespierre's Reign of Terror followed until 1794. Later Napoleon took power and crowned himself emperor in 1804. The ideas of liberty, equality and fraternity spread across the world."
      visual: "Draw a timeline: 1789 Bastille, 1791 Constitution, 1792 Republic, 1793 King executed and Terror begins, 1794 Robespierre falls, 1804 Napoleon emperor. Above it, write the motto 'Liberty, Equality, Fraternity'."
      step_by_step: "Step 1: Constitutional monarchy (1791): the king's power limited. Step 2: Republic (1792): no king. Step 3: Terror (1793–94): harsh rule by Robespierre. Step 4: Directory, then Napoleon (1804). Step 5: Long-term: rights of citizens, end of feudal privileges, abolition of slavery (finally 1848)."
      real_world: "The words 'liberty' and 'equality' in India's own Preamble echo the French Revolution's motto. Indian reformers like Raja Rammohan Roy wrote about it."
    picture:
      kind: flow
      steps: ['1789: the Bastille is stormed', '1791: a constitution limits the king''s powers', '1792: France becomes a republic', '1793: Louis XVI is executed; the Terror begins', '1794: Robespierre falls', '1804: Napoleon crowns
          himself emperor']
      alt: A timeline of France from the Bastille in 1789 through the 1791 constitution, the 1792 republic, the Terror, Robespierre's fall and Napoleon in 1804.
    items:
      - prompt: "In which year was France declared a republic?"
        answer: "1792"
        check: "1792"
        difficulty: 1
        hints: ["Three years after the Bastille.", "The king was executed the next year."]
        solution: "France became a republic in 1792."
      - prompt: "Who led the Jacobins during the Reign of Terror?"
        options: ["Maximilien Robespierre", "Napoleon Bonaparte", "Louis XVI", "Olympe de Gouges"]
        answer: "Maximilien Robespierre"
        difficulty: 1
        hints: ["He was executed in 1794.", "Not the later emperor."]
        solution: "Robespierre led the Jacobin government during the Terror."
      - prompt: "Under the Constitution of 1791, who could vote?"
        options: ["Men over 25 who paid taxes", "All adults", "All men", "Only nobles"]
        answer: "Men over 25 who paid taxes"
        difficulty: 2
        hints: ["They were called active citizens.", "Women couldn't vote."]
        solution: "Only active citizens, men over 25 who paid taxes equal to at least 3 days' wages, could vote."
      - prompt: "In which year did women in France finally get the right to vote?"
        answer: "1946"
        check: "1946"
        difficulty: 2
        hints: ["Long after the Revolution.", "After the Second World War."]
        solution: "French women won the vote in 1946."
      - prompt: "What was the motto of the French Revolution?"
        options: ["Liberty, Equality, Fraternity", "Peace, Land, Bread", "Unity, Faith, Discipline", "Blood and Iron"]
        answer: "Liberty, Equality, Fraternity"
        difficulty: 1
        hints: ["Three words.", "Freedom, sameness and brotherhood."]
        solution: "Liberty, Equality, Fraternity."
      - prompt: "When was slavery finally abolished in the French colonies?"
        answer: "1848"
        check: "1848"
        difficulty: 3
        hints: ["Abolished in 1794 but brought back by Napoleon.", "Mid-19th century."]
        solution: "Slavery was finally abolished in 1848."
