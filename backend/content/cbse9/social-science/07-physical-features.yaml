# CBSE Class 9 Social Science (NCERT), Geography chapter 2. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 7
title: Physical Features of India

tips:
  himadri_highest: "The Himadri (Great Himalaya) is the northernmost and highest range. The Himachal (Lesser Himalaya) is in the middle, and the Shiwaliks are the outermost and lowest."
  ghats_east_west: "The Western Ghats are continuous and higher; the Eastern Ghats are broken by rivers and lower."
  bhabar_terai: "Bhabar is the narrow belt of pebbles at the foot of the Shiwaliks where streams disappear. Terai is the wet, marshy belt south of it where they re-emerge."

concepts:
  - code: cbse9ss.phys.himalaya
    title: The Himalayas and the Northern Plains
    notes: |
      Himalayas: young fold mountains, about 2,400 km long, width 400 km (Kashmir) to 150 km (Arunachal).
      Parallel ranges: Himadri (highest, average 6,000 m, Mount Everest, Kanchenjunga), Himachal (Pir Panjal,
      Dhaula Dhar, Mahabharat; Kashmir, Kangra, Kullu valleys), Shiwaliks (outermost; duns like Dehradun).
      Divisions by rivers: Punjab, Kumaon, Nepal, Assam Himalayas. Purvachal hills in the east. Northern
      Plains: formed by Indus, Ganga, Brahmaputra; about 7 lakh km²; bhabar, terai, bhangar (old alluvium),
      khadar (new alluvium). Punjab plains have doabs.
    explanations:
      text: "The Himalayas are young fold mountains with three parallel ranges: the Himadri (highest, with Everest), the Himachal (middle, with valleys like Kullu and Kashmir), and the Shiwaliks (lowest, at the outer edge). South of them lie the Northern Plains, built from silt carried by the Indus, Ganga and Brahmaputra: some of the most fertile land in the world."
      visual: "Draw three wavy lines from north to south getting lower: Himadri, Himachal, Shiwalik. Below them draw a flat plain with rivers flowing across. Between the mountains and plain, mark a pebbly strip (bhabar) and then a marshy strip (terai)."
      step_by_step: "Step 1: North to south: Himadri, Himachal, Shiwalik. Step 2: The valleys between Himachal and Shiwalik are called duns. Step 3: The plains: bhabar (pebbles), terai (marshy), bhangar (old alluvium, terraced), khadar (new alluvium, renewed each year)."
      real_world: "Dehradun sits in a dun, a long valley between the Lesser Himalaya and the Shiwaliks. Farmers in the Ganga plain grow two or three crops a year thanks to the rich alluvial soil."
    items:
      - prompt: "Which is the highest range of the Himalayas?"
        options: ["Himadri", "Himachal", "Shiwalik", "Purvachal"]
        answer: "Himadri"
        difficulty: 1
        hints: ["Also called the Great Himalaya.", "Mount Everest is here."]
        solution: "The Himadri is the highest range."
        mistakes: {"Shiwalik": himadri_highest}
      - prompt: "About how long are the Himalayas from west to east, in km?"
        answer: "2400"
        check: "2400"
        difficulty: 2
        hints: ["Over two thousand km.", "Indus to Brahmaputra."]
        solution: "The Himalayas run about 2,400 km."
      - prompt: "Longitudinal valleys between the Lesser Himalaya and the Shiwaliks are called…"
        options: ["Duns", "Doabs", "Bugyals", "Ghats"]
        answer: "Duns"
        difficulty: 2
        hints: ["Dehradun is one.", "Not the land between two rivers."]
        solution: "These valleys are called duns."
      - prompt: "The newer, younger alluvium of the plains, renewed every year by floods, is called…"
        options: ["Khadar", "Bhangar", "Bhabar", "Terai"]
        answer: "Khadar"
        difficulty: 2
        hints: ["Bhangar is older.", "Found in floodplains."]
        solution: "Khadar is new alluvium, very fertile."
      - prompt: "The marshy, wet belt just south of the bhabar is called…"
        options: ["Terai", "Khadar", "Doab", "Delta"]
        answer: "Terai"
        difficulty: 1
        hints: ["Streams re-emerge here.", "Once thick forest with wildlife."]
        solution: "The terai is the marshy region where streams re-emerge."
        mistakes: {"Doab": bhabar_terai}
      - prompt: "What is the average height of the Himadri range, in metres?"
        answer: "6000"
        check: "6000"
        difficulty: 3
        hints: ["Very high.", "Thousands of metres."]
        solution: "The Himadri has an average height of about 6,000 m."

  - code: cbse9ss.phys.peninsula
    title: Peninsular Plateau, desert, coasts and islands
    after: [cbse9ss.phys.himalaya]
    notes: |
      Peninsular Plateau: oldest landmass, igneous and metamorphic rocks; Central Highlands (Malwa plateau,
      Vindhyas, Satpura) and Deccan Plateau (Western Ghats higher, continuous: Anai Mudi 2,695 m highest
      peak of Peninsular India; Eastern Ghats lower, broken: Mahendragiri). Deccan Trap of black soil.
      Thar Desert west of the Aravalli; Luni the only large river. Coastal plains: western (Konkan, Kannad,
      Malabar) and eastern (Northern Circar, Coromandel) with deltas of Mahanadi, Godavari, Krishna,
      Kaveri; Chilika lake (largest saltwater lake in India). Islands: Lakshadweep (coral, Kavaratti) and
      Andaman and Nicobar (Port Blair, Barren Island volcano).
    explanations:
      text: "South of the plains lies the Peninsular Plateau, India's oldest land, made of hard old rocks. Its western edge is the Western Ghats, high and unbroken, and its eastern edge the Eastern Ghats, lower and broken by rivers. In the west is the Thar Desert. Coastal plains run along both coasts, and India has two island groups: Lakshadweep in the Arabian Sea and Andaman and Nicobar in the Bay of Bengal."
      visual: "Picture a tilted table: the high side is the Western Ghats, and it slopes down eastwards, so most big rivers of the south (Godavari, Krishna, Kaveri) flow east into the Bay of Bengal, making deltas."
      step_by_step: "Step 1: Plateau: Central Highlands (north) and Deccan (south). Step 2: Western Ghats: higher, continuous; Eastern Ghats: lower, broken. Step 3: Desert: Thar, west of the Aravallis. Step 4: Coasts: west narrow (Konkan, Kannad, Malabar), east wide with deltas. Step 5: Islands: Lakshadweep (coral) and Andaman and Nicobar."
      real_world: "Kerala's coast is the Malabar coast, with backwaters (kayals) like Vembanad. Anai Mudi in the Western Ghats, near Munnar, is the highest peak south of the Himalayas."
    items:
      - prompt: "Which is the highest peak of Peninsular India?"
        options: ["Anai Mudi", "Mahendragiri", "Doddabetta", "Mount Abu"]
        answer: "Anai Mudi"
        difficulty: 1
        hints: ["In Kerala.", "Near Munnar."]
        solution: "Anai Mudi (2,695 m) is the highest peak of Peninsular India."
      - prompt: "Which Ghats are higher and continuous?"
        options: ["Western Ghats", "Eastern Ghats", "Both equally", "Neither"]
        answer: "Western Ghats"
        difficulty: 1
        hints: ["The Eastern Ghats are cut by rivers.", "Along the Arabian Sea."]
        solution: "The Western Ghats are higher and continuous."
        mistakes: {"Eastern Ghats": ghats_east_west}
      - prompt: "The Lakshadweep islands are made of…"
        options: ["Coral", "Volcanic rock", "Sand dunes", "Granite mountains"]
        answer: "Coral"
        difficulty: 2
        hints: ["Formed by tiny marine animals.", "In the Arabian Sea."]
        solution: "Lakshadweep is made of coral deposits."
      - prompt: "What is the height of Anai Mudi, in metres?"
        answer: "2695"
        check: "2695"
        difficulty: 3
        hints: ["Just under 2,700.", "Highest south of the Himalayas."]
        solution: "Anai Mudi is 2,695 m high."
      - prompt: "Which is the largest saltwater lake in India?"
        options: ["Chilika", "Vembanad", "Pulicat", "Wular"]
        answer: "Chilika"
        difficulty: 2
        hints: ["In Odisha.", "South of the Mahanadi delta."]
        solution: "Chilika Lake in Odisha is the largest saltwater lake."
      - prompt: "Which is the only large river in the Thar Desert?"
        options: ["Luni", "Narmada", "Tapi", "Chambal"]
        answer: "Luni"
        difficulty: 2
        hints: ["It flows into the Rann of Kutch.", "Short name."]
        solution: "The Luni is the only large river in the desert."
      - prompt: "India's only active volcano, Barren Island, is in…"
        options: ["Andaman and Nicobar Islands", "Lakshadweep", "Western Ghats", "Himalayas"]
        answer: "Andaman and Nicobar Islands"
        difficulty: 3
        hints: ["Bay of Bengal.", "East of the mainland."]
        solution: "Barren Island is in the Andaman and Nicobar group."
