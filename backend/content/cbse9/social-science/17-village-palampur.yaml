# CBSE Class 9 Social Science (NCERT), Economics chapter 1. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 17
title: The Story of Village Palampur

tips:
  four_factors: "The four factors of production are land, labour, physical capital, and knowledge and enterprise (human capital)."
  fixed_vs_working: "Fixed capital (tools, machines, buildings) is used for many years. Working capital (raw materials, money in hand) is used up in production."
  hectare_size: "1 hectare = 10,000 square metres, a square with 100 m sides."

concepts:
  - code: cbse9ss.palampur.factors
    title: Factors of production and farming
    notes: |
      Palampur: imaginary village with about 450 families; farming is the main activity. Factors of
      production: land, labour, physical capital (fixed: tools, machines, buildings; working: raw
      materials, money), knowledge and enterprise (human capital). Land is fixed: increase output by multiple
      cropping and modern farming methods (HYV seeds, chemical fertilisers, pesticides, tubewell irrigation:
      Green Revolution in the late 1960s, Punjab, Haryana, western UP). Land measured in hectares.
      Sustainability: overuse of chemical fertilisers harms soil, and tubewells deplete groundwater.
    explanations:
      text: "To produce anything you need four things: land, labour, physical capital (tools, machines, raw materials, money) and the knowledge and enterprise to put them together. In Palampur, land is limited, so farmers grow more by multiple cropping (more than one crop a year) and modern methods like HYV seeds, fertilisers and tubewell irrigation, which spread with the Green Revolution."
      visual: "Draw a recipe card titled 'Wheat'. Ingredients: land (a field), labour (farmers and workers), physical capital (seeds, tractor, tubewell, fertiliser), and the cook's skill (knowledge and enterprise). Leave one out and the recipe fails."
      step_by_step: "Step 1: Identify the four factors. Step 2: Split physical capital: fixed (lasts years) or working (used up). Step 3: Land is fixed, so raise output per hectare by multiple cropping and modern methods. Step 4: Watch for costs: soil damage and falling groundwater."
      real_world: "Farmers in Kuttanad, Kerala, grow rice below sea level using pumps and dykes: land, labour, physical capital and generations of knowledge working together."
    items:
      - prompt: "How many factors of production are there, according to NCERT?"
        answer: "4"
        check: "4"
        difficulty: 1
        hints: ["Land, labour, physical capital, and one more.", "Knowledge and enterprise."]
        solution: "Four: land, labour, physical capital, and knowledge and enterprise."
        mistakes: {"3": four_factors}
      - prompt: "Which of these is working capital?"
        options: ["Seeds and fertiliser", "A tractor", "A tubewell", "A farm building"]
        answer: "Seeds and fertiliser"
        difficulty: 1
        hints: ["Used up in one season.", "Not used year after year."]
        solution: "Seeds and fertiliser are used up in production, so they are working capital."
        mistakes: {"A tractor": fixed_vs_working}
      - prompt: "Growing more than one crop on the same land in a year is called…"
        options: ["Multiple cropping", "Crop rotation only", "Shifting cultivation", "Monoculture"]
        answer: "Multiple cropping"
        difficulty: 1
        hints: ["Many crops.", "Two or three harvests a year."]
        solution: "This is multiple cropping."
      - prompt: "How many square metres are there in one hectare?"
        answer: "10000"
        check: "100*100"
        difficulty: 2
        hints: ["A square 100 m by 100 m.", "100 × 100."]
        solution: "1 hectare = 100 × 100 = 10,000 m²."
        mistakes: {"1000": hectare_size}
      - prompt: "A farmer gets 30 quintals of wheat from 2 hectares. What is the yield per hectare, in quintals?"
        answer: "15"
        check: "30/2"
        difficulty: 2
        hints: ["Yield = produce ÷ area.", "30 ÷ 2."]
        solution: "30 ÷ 2 = 15 quintals per hectare."
      - prompt: "Which was a feature of the Green Revolution?"
        options: ["HYV seeds with fertilisers and irrigation", "Ending all irrigation", "Using only manure", "Growing only cotton"]
        answer: "HYV seeds with fertilisers and irrigation"
        difficulty: 2
        hints: ["Late 1960s.", "High Yielding Varieties."]
        solution: "The Green Revolution used HYV seeds with chemical fertilisers, pesticides and irrigation."
      - prompt: "What is a long-term problem of using too many chemical fertilisers?"
        options: ["Loss of soil fertility", "More soil fertility forever", "Lower costs", "More rain"]
        answer: "Loss of soil fertility"
        difficulty: 3
        hints: ["Soil organisms are killed.", "Sustainability."]
        solution: "Overuse of chemicals reduces natural soil fertility over time."

  - code: cbse9ss.palampur.nonfarm
    title: Distribution of land and non-farm activities
    after: [cbse9ss.palampur.factors]
    notes: |
      In Palampur, about one-third of families (150) are landless (mostly dalits); 240 families cultivate
      small plots of less than 2 hectares; 60 families of medium and large farmers own more than 2 hectares.
      Farm labourers are paid daily wages, often less than the government's minimum wage. Surplus wheat is
      sold in the market; large farmers can save and invest. Non-farm activities employ about 25% of
      Palampur's workers: dairy, small-scale manufacturing (sugarcane crushing, jaggery), shopkeeping,
      transport (rickshaws, tongas, jeeps, tractors). Credit often from moneylenders at high interest.
    explanations:
      text: "In Palampur land is shared very unequally: 150 families have no land at all and work as labourers, 240 families farm small plots, and just 60 families own most of the land. Besides farming, about a quarter of workers do non-farm work: dairy, shops, small manufacturing like jaggery-making, and transport."
      visual: "Draw 450 dots for families. Colour 150 grey (landless), 240 light green (small farms), and 60 dark green (medium and large farms). The dark green dots own the biggest share of the fields."
      step_by_step: "Step 1: Who owns the land? Count families by farm size. Step 2: Who works the land? Often landless labourers for low wages. Step 3: What else do people do? Dairy, shops, manufacturing, transport. Step 4: Who can invest? Farmers with surplus to sell."
      real_world: "In many Kerala villages, families combine farming with other work: a small plot of tapioca and coconut, a cow for milk, and someone driving an autorickshaw or running a tea shop."
    items:
      - prompt: "About how many families in Palampur are landless?"
        answer: "150"
        check: "150"
        difficulty: 1
        hints: ["One-third of 450.", "450 ÷ 3."]
        solution: "About 150 families have no land."
      - prompt: "What fraction of Palampur's families are landless? Type a fraction."
        answer: "1/3"
        check: "150/450"
        difficulty: 2
        hints: ["150 out of 450.", "Simplify."]
        solution: "150 ÷ 450 = 1/3."
      - prompt: "Small farmers in Palampur cultivate plots of less than how many hectares?"
        answer: "2"
        check: "2"
        difficulty: 2
        hints: ["Medium and large farmers have more.", "A small number."]
        solution: "Small farmers have less than 2 hectares."
      - prompt: "About what percentage of Palampur's workers are in non-farm activities?"
        answer: "25"
        check: "25"
        difficulty: 2
        hints: ["One in four.", "A quarter."]
        solution: "About 25% of workers are engaged in non-farm activities."
      - prompt: "Which is a non-farm activity in Palampur?"
        options: ["Dairy", "Growing wheat", "Growing sugarcane", "Harvesting jowar"]
        answer: "Dairy"
        difficulty: 1
        hints: ["Three of these are crops.", "Milk."]
        solution: "Dairy is a non-farm activity."
      - prompt: "Why are farm labourers often paid less than the minimum wage?"
        options: ["Many workers compete for limited farm work", "They work too little", "The government pays them extra", "They own land"]
        answer: "Many workers compete for limited farm work"
        difficulty: 3
        hints: ["Supply of labour is high.", "Few other jobs."]
        solution: "High competition for work lets employers pay low wages."
