    - Save the tiger
    - Work is worship
    answer: Our village, our rule
    difficulty: 2
    hints:
    - It is about self-government.
    - The village decides for itself.
    solution: The Gond village's motto means 'our village, our rule'.
    mistakes:
      Forests for factories: c9ss11_community_rule
