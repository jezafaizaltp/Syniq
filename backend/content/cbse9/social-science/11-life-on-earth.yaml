    - Kandhamal is a district there.
    - It is on India's east coast.
    solution: Kandhamal Haldi is turmeric from Kandhamal district, Odisha.
    mistakes:
      Kerala: c9ss11_forest_use
  - prompt: Why are ecological commons under threat?
    options:
    - Population pressure, industry and privatisation
