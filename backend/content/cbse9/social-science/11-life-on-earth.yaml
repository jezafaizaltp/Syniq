# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 11. Format: content/README.md.
subject: cbse9-ss
chapter: 11
title: Life on Earth
tips:
  biosphere_vs_park: "Zoos keep animals in cages; national parks have strict rules with no people living inside. Which protected area keeps a whole ecosystem with people in its outer zones?"
  biome_ecosystem: A biome is a very large region with a similar climate and typical plants and animals; an ecosystem is a smaller unit where living and non-living things interact.
  energy_pyramid: "Energy is lost at every step of the food chain. The level at the bottom has the most. Which level is at the very top?"
  fra_rights: "The Forest Rights Act gives power to the village assembly of all adults in the community, not to outside companies."
  s9_aquatic_share: "Most of the Earth's surface is water, well over half."
  s9_biosphere_count: "Count the biosphere reserves on the NCERT list: it is between 15 and 20."
  s9_bird_share: "India has a big share of the world's bird species, but far less than a third. Recall the percentage from the wildlife section."
  s9_commons: "'Commons' are shared. Who shares and looks after them?"
  s9_fra_year: "The Forest Rights Act came in the middle of the 2000s decade, well after the 1980 Forest Conservation Act."
  s9_gene_bank: "A gene bank stores many kinds of life. What do rainforests have plenty of?"
  s9_gi_tag: "GI means Geographical Indication. It ties a product to where it comes from."
  s9_gir: "The Asiatic lion lives in one forest in Gujarat. The Sundarbans is home to tigers."
  s9_ntfp: "Timber means wood logs. Which product comes from the forest but is not wood?"
  s9_rhino: "The one-horned rhino lives in the grasslands of the north-east, like Kaziranga."
  s9_thenmala: "Thenmala in Kerala is famous for being planned for visitors who care about nature."
  s9_tundra: "Permafrost means ground that stays frozen. Which biome is near the poles?"
  s9_western_ghats: "A hotspot has very many species found nowhere else. Which wet, forested region has that?"
  s9_wild_ass: "The wild ass lives in a salty desert marsh in Gujarat."
  c9ss11_biome_climate: Biomes are sorted by climate. Ask how hot and how wet the place is all year, then match the plants that could live there.
  c9ss11_scale: Ask about size and scale. A biome spreads across countries and continents. Is the thing in the question that big, or much smaller?
  c9ss11_alive: Ask of each option whether it is alive. Does it grow, feed and reproduce?
  c9ss11_hotspot_map: Picture where these islands sit on the map, far to the south-east, nearer to Indonesia than to India's North-East.
  c9ss11_energy_level: Energy is lost at every step up the food chain. The higher the level, the less energy there.
  c9ss11_animal_home: Each of these animals has one special home in India. Think of the landscape it needs, swamp, salt desert, dry forest or mangrove.
  c9ss11_protect_type: Compare how strict each area is. Which one allows people to live in its outer zones, and which keeps them out?
  c9ss11_forest_use: Ask whether the product needs the tree to be cut down, or can be gathered while the forest stays.
  c9ss11_community_rule: Think about who looks after shared land and water, and how the law now gives forest villages a say.
concepts:
- code: cbse9us.life.biomes
  title: Biomes, ecosystems and biodiversity
  notes: |
    A biome is a large natural region with a similar climate (temperature and rainfall) and typical plants
    and animals. Terrestrial biomes include tropical rainforests (between the tropics, hot and wet all year,
    the richest in species, called 'gene banks'), savannas and grasslands, deserts, temperate forests,
    coniferous forests and the tundra (very cold; permafrost; mosses, lichens and small shrubs). Aquatic
    biomes (freshwater and marine) cover about three-fourths of the Earth. An ecosystem is a smaller area in
    which living things (producers, consumers, decomposers) and non-living things (soil, water, air,
    sunlight) interact. Energy flows from producers to herbivores to carnivores to top predators; the energy
    pyramid narrows upwards because energy is lost at each level. Biodiversity is the variety of life: of
    genes within a species, of species, and of ecosystems. India is megadiverse; its biodiversity hotspots
    are the Himalaya, the Western Ghats (with Sri Lanka), the Indo-Burma region of the North-East, and
    Sundaland (Nicobar Islands).
  explanations:
    text: 'Earth''s land is like a patchwork of big natural regions called biomes: hot wet rainforests, dry deserts, frozen tundra. Inside each, smaller ecosystems link plants, animals, soil and sunlight. The more variety of life a place has, the richer its biodiversity.'
    visual: 'Draw a pyramid: grass at the wide base, deer above, a tiger at the narrow top. Write ''energy decreases upward'' beside it.'
    step_by_step: 'Step 1: Check the climate: hot or cold, wet or dry. Step 2: Name the biome. Step 3: Inside it, find producers, consumers and decomposers. Step 4: Energy flows up the pyramid and shrinks at each step.'
    real_world: The Western Ghats in Kerala, a biodiversity hotspot, are home to the lion-tailed macaque and Nilgiri tahr, found almost nowhere else.
  picture:
    kind: flow
    steps:
    - 'Producers: plants, algae'
    - Herbivores
    - Carnivores
    - Top predators
    alt: Energy flows up the pyramid from producers to herbivores, carnivores and top predators, getting smaller at each level.
  activity:
    type: sort
    prompt: Which biome?
    bins:
    - Tropical rainforest
    - Desert
    - Tundra
    items:
    - label: Hot and wet all year, richest in species
      bin: Tropical rainforest
      clue: A 'gene bank'.
      why: Rainforest.
    - label: Permafrost, mosses and lichens
      bin: Tundra
      clue: Very cold.
      why: Tundra.
    - label: Very little rain, cacti
      bin: Desert
      clue: Dry.
      why: Desert.
    - label: Between the tropics, tall trees in layers
      bin: Tropical rainforest
      clue: Wet.
      why: Rainforest.
    - label: Small shrubs on frozen ground
      bin: Tundra
      clue: Cold.
      why: Tundra.
  lesson:
    - teach: A biome is a large natural region with a similar climate and typical plants and animals. Tropical rainforests near the Equator are hot and wet all year and hold the most species, so they are called gene banks. Then come savannas and grasslands, deserts, temperate forests, coniferous forests, and the tundra, so cold that the ground stays frozen (permafrost) and only mosses, lichens and small shrubs grow. Aquatic biomes, fresh water and sea, cover about three-fourths of the Earth.
      picture:
        kind: flow
        steps:
        - Tropical rainforest (hot, wet)
        - Savanna
        - Desert (dry)
        - Temperate forest
        - Coniferous forest
        - Tundra (frozen)
        alt: Land biomes from the hot, wet rainforest through savanna, desert and forests to the frozen tundra.
      check:
        prompt: Which biome has permafrost?
        options:
        - Tundra
        - Tropical rainforest
        - Savanna
        answer: Tundra
        why: It is so cold the ground stays frozen.
    - teach: An ecosystem is a smaller unit, a pond, a forest patch, where living things (producers, consumers, decomposers) interact with non-living things (soil, water, air, sunlight). Energy flows from plants to herbivores to carnivores to top predators. Much energy is lost at each step, so the energy pyramid narrows to the top.
      picture:
        kind: bars
        bars:
        - label: Plants
          value: 1000
        - label: Herbivores
          value: 100
        - label: Carnivores
          value: 10
        - label: Top predators
          value: 1
        unit: energy units
        alt: 'Energy shrinks at each level: plants 1000, herbivores 100, carnivores 10, top predators 1.'
      check:
        prompt: Which level has the most energy?
        options:
        - Plants
        - Carnivores
        - Top predators
        answer: Plants
        why: Producers capture energy from sunlight; each level up has less.
    - teach: 'Biodiversity is the variety of life: of genes within a species, of species, and of ecosystems. India is one of the world''s megadiverse countries. Its biodiversity hotspots are the Himalaya, the Western Ghats (with Sri Lanka), the Indo-Burma region of the North-East, and Sundaland (the Nicobar Islands).'
      check:
        prompt: Which is one of India's biodiversity hotspots?
        options:
        - Indo-Burma region
        - The Thar Desert
        - The Deccan plateau
        answer: Indo-Burma region
        why: The North-East is part of the Indo-Burma hotspot.
  items:
  - prompt: Which biome has frozen ground called permafrost?
    options:
    - Tundra
    - Tropical rainforest
    - Savanna
    - Desert
    answer: Tundra
    difficulty: 1
    hints:
    - Very cold regions near the poles.
    - Mosses and lichens.
    solution: 'Step 1: Permafrost is permanently frozen soil. Step 2: It is found in the tundra.'
    mistakes: {"Desert": "s9_tundra"}
  - prompt: Why are tropical rainforests called 'gene banks'?
    options:
    - They hold a huge variety of species
    - They store seeds in banks
    - They have few plants
    - They are cold and dry
    answer: They hold a huge variety of species
    difficulty: 1
    hints:
    - Hot and wet all year.
    - Richest biodiversity.
    solution: 'Step 1: Rainforests have the most species of any biome. Step 2: So they store a vast variety of genes.'
    mistakes: {"They store seeds in banks": "s9_gene_bank"}
  - prompt: Which of these is a biodiversity hotspot in India?
    options:
    - Western Ghats
    - Thar Desert
    - Deccan Plateau
    - Indo-Gangetic Plain
    answer: Western Ghats
    difficulty: 1
    hints:
    - Runs along Kerala.
    - Many species found nowhere else.
    solution: 'Step 1: Hotspots have many unique, threatened species. Step 2: The Western Ghats are one.'
    mistakes: {"Thar Desert": "s9_western_ghats", "Indo-Gangetic Plain": "s9_western_ghats"}
  - prompt: What is the difference between a biome and an ecosystem?
    options:
    - A biome is a large climate region; an ecosystem is a smaller unit of interacting living and non-living things
    - They are exactly the same
    - An ecosystem is always larger
    - A biome has no animals
    answer: A biome is a large climate region; an ecosystem is a smaller unit of interacting living and non-living things
    difficulty: 2
    hints:
    - Think of scale.
    - A pond is an ecosystem.
    solution: 'Step 1: Biomes are huge regions set by climate. Step 2: Ecosystems are smaller units inside them.'
    mistakes:
      An ecosystem is always larger: biome_ecosystem
  - prompt: In an energy pyramid, which level has the least energy?
    options:
    - Top predators
    - Producers
    - Herbivores
    - All are equal
    answer: Top predators
    difficulty: 2
    hints:
    - Energy is lost at each step.
    - The narrow top.
    solution: 'Step 1: Energy is lost at every level. Step 2: The top predators at the tip have the least.'
    mistakes:
      Producers: energy_pyramid
  - prompt: Aquatic biomes cover about what fraction of the Earth's surface?
    options:
    - Three-fourths
    - One-fourth
    - Half
    - One-tenth
    answer: Three-fourths
    difficulty: 2
    hints:
    - Oceans are about 71%.
    - More than half.
    solution: 'Step 1: Water covers about 71% of the surface. Step 2: That is about three-fourths.'
    mistakes: {"Half": "s9_aquatic_share", "One-fourth": "s9_aquatic_share"}
  - prompt: Which biome is hot and wet all year and lies near the Equator?
    options:
    - Tropical rainforest
    - Tundra
    - Coniferous forest
    - Desert
    answer: Tropical rainforest
    difficulty: 1
    hints:
    - Near the Equator.
    - Rain almost every day.
    solution: Tropical rainforests lie between the tropics and are hot and wet all year.
    mistakes:
      Desert: c9ss11_biome_climate
  - prompt: A small pond with fish, water plants, bacteria, water and sunlight is best called…
    options:
    - An ecosystem
    - A biome
    - A continent
    - A hotspot
    answer: An ecosystem
    difficulty: 1
    hints:
    - It is small.
    - Living and non-living things interact.
    solution: 'A pond is a small unit where living and non-living things interact: an ecosystem.'
    mistakes:
      A biome: c9ss11_scale
  - prompt: In an energy pyramid, plants have 10,000 units and herbivores get about one-tenth. How many units reach herbivores?
    answer: 1000
    check: 10000 / 10
    difficulty: 2
    hints:
    - About one-tenth passes up.
    - Divide by 10.
    solution: 'Step 1: One-tenth of 10,000. Step 2: 10,000 ÷ 10 = 1,000 units.'
    mistakes:
      '10000': c9ss11_energy_level
      '100000': c9ss11_energy_level
  - prompt: Which of these is a decomposer?
    options:
    - Fungi
    - Grass
    - Deer
    - Tiger
    answer: Fungi
    difficulty: 1
    hints:
    - It breaks down dead matter.
    - Mushrooms are an example.
    solution: Fungi and bacteria break down dead plants and animals, returning nutrients to soil.
    mistakes:
      Grass: c9ss11_energy_level
  - prompt: Coniferous forests with pine and fir trees are found in…
    options:
    - Cold regions such as high latitudes and mountains
    - Hot deserts
    - Tropical islands only
    - Under the sea
    answer: Cold regions such as high latitudes and mountains
    difficulty: 2
    hints:
    - Needle-shaped leaves shed snow.
    - Think of Himalayan slopes.
    solution: Conifers grow in cold climates, with cone shapes and needle leaves that suit snow.
    mistakes:
      Hot deserts: c9ss11_biome_climate
  - prompt: Variety of genes within one species, such as many kinds of rice, is…
    options:
    - Genetic diversity
    - Ecosystem diversity
    - A biome
    - An energy pyramid
    answer: Genetic diversity
    difficulty: 2
    hints:
    - All are rice, the same species.
    - They differ inside the species.
    solution: Differences within a species are genetic diversity.
    mistakes:
      Ecosystem diversity: c9ss11_scale
  - prompt: Which of these is a non-living part of an ecosystem?
    options:
    - Sunlight
    - Frog
    - Moss
    - Bacteria
    answer: Sunlight
    difficulty: 1
    hints:
    - Three are alive.
    - One gives energy but is not alive.
    solution: Sunlight, water, soil and air are non-living (abiotic) parts.
    mistakes:
      Bacteria: c9ss11_alive
  - prompt: The Nicobar Islands are part of which biodiversity hotspot?
    options:
    - Sundaland
    - Himalaya
    - Western Ghats
    - Indo-Burma
    answer: Sundaland
    difficulty: 3
    hints:
    - It is shared with islands of South-East Asia.
    - Not the North-East.
    solution: The Nicobar Islands belong to the Sundaland hotspot.
    mistakes:
      Indo-Burma: c9ss11_hotspot_map
  - prompt: Why do top predators like tigers need large areas of forest?
    options:
    - Little energy reaches their level, so they need many prey
    - They do not eat
    - They eat only plants
    - They avoid other animals
    answer: Little energy reaches their level, so they need many prey
    difficulty: 3
    hints:
    - Think of the energy pyramid.
    - What happens to energy at each step?
    solution: 'Step 1: Energy shrinks at each level. Step 2: A tiger needs many prey animals, which need large areas.'
    mistakes:
      They eat only plants: c9ss11_energy_level
- code: cbse9us.veg.wildlife
  title: Wildlife and its protection
  notes: |
    India has about 90,000 animal species, about 2,000 bird species (13% of world), 2,546 fish species.
    Elephants in Assam, Karnataka, Kerala; one-horned rhinoceros in Assam and West Bengal swamps; Asiatic
    lion only in Gir forest (Gujarat); tigers in Madhya Pradesh, Sundarbans, Himalayan region; wild ass in
    the Rann of Kutch. Threats: hunting, pollution, habitat loss. Protection: 18 biosphere reserves (12 in
    UNESCO's World Network, e.g. Nilgiri, Sundarbans, Gulf of Mannar, Nanda Devi), national parks,
    wildlife sanctuaries, Project Tiger, Project Rhino, etc. Medicinal plants: sarpagandha, neem, tulsi.
  explanations:
    text: 'India''s wildlife is rich: elephants in Kerala and Karnataka, one-horned rhinos in Assam, the last Asiatic lions in Gujarat''s Gir forest, and tigers across many states. Hunting and loss of forests have pushed many species towards extinction, so India set up biosphere reserves, national parks, sanctuaries and projects like Project Tiger.'
    visual: 'Draw a map of India with animal icons: lion in Gujarat, rhino in Assam, elephant in Kerala, tiger in the Sundarbans, wild ass in Kutch. Circle a few areas in green labelled ''biosphere reserve''.'
    step_by_step: 'Step 1: Match the animal to its home: lion–Gir, rhino–Assam, wild ass–Rann of Kutch, elephant–Kerala/Karnataka/Assam. Step 2: Identify threats: hunting, habitat loss, pollution. Step 3: Name protections: reserves, parks, sanctuaries, special projects.'
    real_world: The Nilgiri Biosphere Reserve covers parts of Kerala, Karnataka and Tamil Nadu, and was the first in India to join UNESCO's network. Periyar Tiger Reserve in Kerala protects tigers and elephants.
  activity:
    type: sort
    prompt: Where does it live in India?
    bins:
    - Gir forest (Gujarat)
    - Assam
    - Rann of Kutch
    items:
    - label: Asiatic lion
      bin: Gir forest (Gujarat)
      clue: Its only home.
      why: Gir.
    - label: One-horned rhinoceros
      bin: Assam
      clue: Swampy grasslands.
      why: Assam (and West Bengal).
    - label: Wild ass
      bin: Rann of Kutch
      clue: Salt marsh.
      why: Rann of Kutch.
    - label: Elephants (one of their homes)
      bin: Assam
      clue: Also Karnataka, Kerala.
      why: Assam.
  lesson:
    - teach: 'India has about 90,000 animal species and about 2,000 bird species, roughly 13% of the world''s birds. Some animals have special homes: elephants in Assam, Karnataka and Kerala; the one-horned rhinoceros in the swamps of Assam and West Bengal; the Asiatic lion only in the Gir forest of Gujarat; tigers in Madhya Pradesh, the Sundarbans and the Himalayan region; and the wild ass in the Rann of Kutch.'
      picture:
        kind: compare
        columns:
        - title: Animal
          points:
          - Asiatic lion
          - One-horned rhino
          - Wild ass
          - Tiger
        - title: Home
          points:
          - Gir forest, Gujarat
          - Assam, West Bengal swamps
          - Rann of Kutch
          - MP, Sundarbans, Himalaya
        alt: 'Animals of India matched with their homes: lion in Gir, rhino in Assam, wild ass in Rann of Kutch, tiger in MP and Sundarbans.'
      check:
        prompt: Where does the Asiatic lion live in the wild?
        options:
        - Gir forest
        - Sundarbans
        - Rann of Kutch
        answer: Gir forest
        why: Gir in Gujarat is its only wild home.
    - teach: 'Wildlife is threatened by hunting, pollution and loss of habitat. India protects it through national parks and wildlife sanctuaries, projects for single species like Project Tiger and Project Rhino, and 18 biosphere reserves, such as the Nilgiri, Sundarbans, Gulf of Mannar and Nanda Devi; 12 are in UNESCO''s world network. A biosphere reserve protects a whole ecosystem: its core is untouched, while people can live and work in its outer zones.'
      check:
        prompt: Which protected area lets people live in its outer zones?
        options:
        - Biosphere reserve
        - Core of a national park
        - A zoo cage
        answer: Biosphere reserve
        why: It protects the ecosystem while allowing local people in buffer and transition zones.
    - teach: 'Plants matter too. Many are medicinal: sarpagandha for blood pressure, neem as an antiseptic, tulsi for coughs and colds. Protecting forests protects these plants and the knowledge of the people who use them.'
      check:
        prompt: Which plant is used as an antiseptic?
        options:
        - Neem
        - Rice
        - Wheat
        answer: Neem
        why: Neem has antibacterial properties.
  items:
  - prompt: The Asiatic lion is found in the wild only in…
    options:
    - Gir forest, Gujarat
    - Sundarbans
    - Kaziranga
    - Periyar
    answer: Gir forest, Gujarat
    difficulty: 1
    hints:
    - Western India.
    - Gujarat.
    solution: Asiatic lions live only in the Gir forest.
    mistakes: {"Sundarbans": "s9_gir"}
  - prompt: Where is the one-horned rhinoceros mainly found?
    options:
    - Assam and West Bengal
    - Rajasthan
    - Kerala
    - Ladakh
    answer: Assam and West Bengal
    difficulty: 1
    hints:
    - Swampy grasslands.
    - Kaziranga National Park.
    solution: One-horned rhinos live in the swamps of Assam and West Bengal.
    mistakes: {"Rajasthan": "s9_rhino", "Kerala": "s9_rhino"}
  - prompt: How many biosphere reserves does India have, according to NCERT?
    answer: '18'
    check: '18'
    difficulty: 2
    hints:
    - Between 15 and 20.
    - 12 are in UNESCO's network.
    solution: India has 18 biosphere reserves.
    mistakes: {"10": "s9_biosphere_count", "28": "s9_biosphere_count"}
  - prompt: The Indian wild ass lives in…
    options:
    - Rann of Kutch
    - Western Ghats
    - Sundarbans
    - Kashmir valley
    answer: Rann of Kutch
    difficulty: 2
    hints:
    - A salty desert.
    - In Gujarat.
    solution: The wild ass is found in the Rann of Kutch.
    mistakes: {"Sundarbans": "s9_wild_ass", "Western Ghats": "s9_wild_ass"}
  - prompt: About what percentage of the world's bird species are found in India?
    answer: '13'
    check: '13'
    difficulty: 3
    hints:
    - About 2,000 species.
    - Between 10 and 15.
    solution: India has about 13% of the world's bird species.
    mistakes: {"30": "s9_bird_share", "3": "s9_bird_share"}
  - prompt: Which of these protects a whole ecosystem, allowing people to live in its outer zones?
    options:
    - Biosphere reserve
    - Zoo
    - Botanical garden
    - Fish farm
    answer: Biosphere reserve
    difficulty: 2
    hints:
    - It has a core, a buffer and a transition zone.
    - Nilgiri is one.
    solution: A biosphere reserve protects an entire ecosystem with human use allowed in outer zones.
    mistakes:
      Zoo: biosphere_vs_park
  - prompt: Which project was started to save India's national animal?
    options:
    - Project Tiger
    - Project Rhino
    - Project Elephant
    - Project Lion
    answer: Project Tiger
    difficulty: 1
    hints:
    - India's national animal is a big cat.
    - It has stripes.
    solution: Project Tiger protects tigers and their habitats.
    mistakes:
      Project Lion: c9ss11_animal_home
  - prompt: Which biosphere reserve is in the Ganga delta, home to tigers in mangroves?
    options:
    - Sundarbans
    - Nilgiri
    - Nanda Devi
    - Gulf of Mannar
    answer: Sundarbans
    difficulty: 2
    hints:
    - Mangroves grow in a delta.
    - In West Bengal.
    solution: The Sundarbans in the Ganga–Brahmaputra delta are famous for mangrove tigers.
    mistakes:
      Nanda Devi: c9ss11_animal_home
  - prompt: How many of India's biosphere reserves are in UNESCO's World Network?
    answer: 12
    check: '12'
    difficulty: 3
    hints:
    - Fewer than the total.
    - India has 18 in all.
    solution: Of India's 18 biosphere reserves, 12 are in UNESCO's network.
    mistakes:
      '18': c9ss11_protect_type
  - prompt: Which is the biggest threat to wildlife when forests are cleared for farms and towns?
    options:
    - Loss of habitat
    - Too much rain
    - More birds
    - Moonlight
    answer: Loss of habitat
    difficulty: 1
    hints:
    - Where will the animals live?
    - Habitat means home.
    solution: Clearing forests destroys the homes of animals.
    mistakes:
      Too much rain: c9ss11_protect_type
  - prompt: Sarpagandha is used to treat…
    options:
    - Blood pressure
    - Broken bones
    - Toothache only
    - Sunburn
    answer: Blood pressure
    difficulty: 2
    hints:
    - It is a medicinal plant.
    - It acts on the heart and blood vessels.
    solution: Sarpagandha is used for treating high blood pressure.
    mistakes:
      Sunburn: c9ss11_forest_use
  - prompt: Which biosphere reserve is in Kerala, Tamil Nadu and Karnataka?
    options:
    - Nilgiri
    - Sundarbans
    - Nanda Devi
    - Gulf of Mannar
    answer: Nilgiri
    difficulty: 2
    hints:
    - It is in the Western Ghats.
    - Named after the 'blue mountains'.
    solution: The Nilgiri biosphere reserve spans Kerala, Tamil Nadu and Karnataka.
    mistakes:
      Gulf of Mannar: c9ss11_animal_home
  - prompt: Elephants are found in the wild in which of these states?
    options:
    - Kerala
    - Rajasthan's Thar Desert
    - Punjab
    - Haryana
    answer: Kerala
    difficulty: 1
    hints:
    - They need big forests.
    - Think of the Western Ghats.
    solution: Elephants live in the forests of Kerala, Karnataka and Assam.
    mistakes:
      Punjab: c9ss11_animal_home
  - prompt: How is a biosphere reserve different from a zoo?
    options:
    - It protects animals in their natural ecosystem
    - It keeps animals in cages
    - It has no animals
    - It is only for birds
    answer: It protects animals in their natural ecosystem
    difficulty: 2
    hints:
    - Where do the animals live?
    - Which keeps the whole ecosystem?
    solution: A biosphere reserve protects plants, animals and their natural habitat together.
    mistakes:
      It keeps animals in cages: c9ss11_protect_type
  - prompt: Why is it important to protect medicinal plants like tulsi and neem?
    options:
    - They are sources of medicines and traditional knowledge
    - They are only decorative
    - They harm people
    - They are not found in India
    answer: They are sources of medicines and traditional knowledge
    difficulty: 2
    hints:
    - What are they used for?
    - Who knows how to use them?
    solution: Medicinal plants give remedies and carry knowledge built up over generations.
    mistakes:
      They are only decorative: c9ss11_forest_use
- code: cbse9us.life.forests_commons
  title: Forests, livelihoods and the commons
  notes: |
    Millions of people depend on forests for food, fuel, fodder, medicine, timber and non-timber forest
    products (NTFPs) such as honey, tendu leaves, bamboo, lac and medicinal plants. Ecological commons are
    shared resources such as forests, rivers, lakes and grazing land, traditionally managed by community
    rules; they are threatened by population pressure, industry and privatisation. The Forest Rights Act,
    2006 (Scheduled Tribes and Other Traditional Forest Dwellers Act) recognises the rights of forest
    communities over land and resources they have long used, including minor forest produce, with the Gram
    Sabha at the centre. Mendha Lekha in Gadchiroli, Maharashtra, a Gond village with the motto "Mawa Nate
    Mawa Raj" (our village, our rule), was among the first to gain community forest rights and manages its
    bamboo sustainably. Geographical Indication (GI) tags, such as for Kandhamal Haldi, help forest products
    earn better prices. Thenmala in Kollam district, Kerala, was India's first planned ecotourism destination.
  explanations:
    text: 'Forests are not empty land: they feed and support millions of people. Communities have long shared forests, rivers and pastures as commons with their own rules. The Forest Rights Act gives forest dwellers legal rights to these resources and lets their Gram Sabha manage them.'
    visual: Draw a forest with people collecting honey, bamboo and tendu leaves, and a village meeting under a tree labelled 'Gram Sabha decides'.
    step_by_step: 'Step 1: List what people take from forests. Step 2: Ask who owns and manages them: community commons. Step 3: Link to the law: FRA 2006 and the Gram Sabha. Step 4: Ask if the use is sustainable.'
    real_world: Thenmala ecotourism in the Western Ghats earns money for local people while asking visitors to protect the forest.
  picture:
    kind: compare
    columns:
    - title: Forest gives
      points:
      - Food, fuel, fodder
      - Honey, bamboo, tendu
      - Medicine
    - title: Community protects
      points:
      - Gram Sabha rules
      - Forest Rights Act 2006
      - Sustainable harvest
    alt: What forests give people and how communities protect them through Gram Sabha rules and the Forest Rights Act.
  activity:
    type: sort
    prompt: What does it mean for forest people?
    bins:
    - Forest Rights Act
    - Commons
    - NTFP
    items:
    - label: Rights over land long used, with the Gram Sabha
      bin: Forest Rights Act
      clue: A 2006 law.
      why: Forest Rights Act.
    - label: Mendha Lekha manages its own bamboo
      bin: Forest Rights Act
      clue: Community forest rights.
      why: Forest Rights Act.
    - label: A grazing ground shared by the village
      bin: Commons
      clue: Shared resource.
      why: Commons.
    - label: A river used by all
      bin: Commons
      clue: Shared.
      why: Commons.
    - label: Honey and tendu leaves
      bin: NTFP
      clue: Not timber.
      why: Non-timber forest products.
    - label: Lac and bamboo
      bin: NTFP
      clue: Not timber.
      why: NTFP.
  lesson:
    - teach: 'Millions of people depend on forests for food, fuel, fodder, medicine and timber. Many forest products can be gathered without cutting trees: honey, tendu leaves (for bidis), bamboo, lac and medicinal plants. These are non-timber forest products (NTFPs).'
      picture:
        kind: compare
        columns:
        - title: Timber
          points:
          - Tree is cut
          - Wood for building and furniture
        - title: Non-timber (NTFP)
          points:
          - Tree stays
          - Honey
          - Tendu leaves
          - Bamboo, lac
          - Medicinal plants
        alt: Timber needs trees to be cut; non-timber forest products like honey and tendu leaves are gathered while trees stay.
      check:
        prompt: Tendu leaves are a…
        options:
        - Non-timber forest product
        - Type of timber
        - Mineral
        answer: Non-timber forest product
        why: They are gathered without cutting the tree.
    - teach: Forests, rivers, lakes and grazing land that a community shares and manages by its own rules are called ecological commons. They are under pressure from growing population, industry and privatisation. The Forest Rights Act, 2006 recognises the rights of forest-dwelling communities over land and resources they have long used, with the Gram Sabha at the centre. Mendha Lekha, a Gond village in Gadchiroli, Maharashtra, with the motto 'Mawa Nate Mawa Raj' (our village, our rule), was among the first to win community forest rights and manages its bamboo sustainably.
      check:
        prompt: Under the Forest Rights Act, which body is central?
        options:
        - The Gram Sabha
        - A private company
        - The army
        answer: The Gram Sabha
        why: The village assembly decides on community forest rights.
    - teach: Communities can also earn more. A Geographical Indication (GI) tag, such as for Kandhamal Haldi from Odisha, links a product to its place so it can fetch a better price. Ecotourism earns money while protecting nature; Thenmala in Kollam district, Kerala, was India's first planned ecotourism destination.
      check:
        prompt: How does a GI tag help?
        options:
        - It links a product to its place for a better price
        - It bans the product
        - It cuts down forests
        answer: It links a product to its place for a better price
        why: Buyers trust and pay more for genuine regional products.
  items:
  - prompt: Which of these is a non-timber forest product?
    options:
    - Honey
    - Teak logs
    - Iron ore
    - Cement
    answer: Honey
    difficulty: 1
    hints:
    - Not wood.
    - Collected without cutting trees.
    solution: 'Step 1: NTFPs are forest products other than timber. Step 2: Honey is one.'
    mistakes: {"Teak logs": "s9_ntfp"}
  - prompt: In which year was the Forest Rights Act passed?
    answer: '2006'
    check: '2006'
    difficulty: 1
    hints:
    - Early 21st century.
    - Scheduled Tribes and Other Traditional Forest Dwellers Act.
    solution: 'Step 1: The Act recognising forest rights came in 2006. Step 2: Answer: 2006.'
    mistakes: {"1980": "s9_fra_year", "2016": "s9_fra_year"}
  - prompt: Thenmala in Kollam district is known as India's first…
    options:
    - Planned ecotourism destination
    - Tiger reserve
    - Biosphere reserve
    - National park
    answer: Planned ecotourism destination
    difficulty: 1
    hints:
    - Tourism that protects nature.
    - In the Western Ghats.
    solution: 'Step 1: Thenmala was planned for tourism that benefits nature and local people. Step 2: It was India''s first planned ecotourism destination.'
    mistakes: {"Tiger reserve": "s9_thenmala"}
  - prompt: Under the Forest Rights Act, which body is central to managing community forest rights?
    options:
    - The Gram Sabha
    - The Supreme Court
    - A private company
    - The Rajya Sabha
    answer: The Gram Sabha
    difficulty: 2
    hints:
    - Village assembly.
    - Mendha Lekha.
    solution: 'Step 1: The Act gives rights to communities. Step 2: The village Gram Sabha decides how the forest is used.'
    mistakes:
      A private company: fra_rights
  - prompt: What are 'ecological commons'?
    options:
    - Natural resources shared and managed by a community
    - Private gardens
    - Government offices
    - Factories near forests
    answer: Natural resources shared and managed by a community
    difficulty: 2
    hints:
    - Common grazing land, village ponds.
    - No single owner.
    solution: 'Step 1: Commons belong to the community. Step 2: Forests, ponds and pastures shared under local rules are ecological commons.'
    mistakes: {"Private gardens": "s9_commons"}
  - prompt: How does a GI tag help forest communities?
    options:
    - It links a product to its place, so it can earn a better price
    - It bans the product
    - It makes the product free
    - It moves the product abroad
    answer: It links a product to its place, so it can earn a better price
    difficulty: 3
    hints:
    - Geographical Indication.
    - Kandhamal Haldi.
    solution: 'Step 1: A GI tag certifies the origin and special quality. Step 2: Buyers trust it and pay more, which helps producers.'
    mistakes: {"It bans the product": "s9_gi_tag"}
  - prompt: Which of these is NOT a non-timber forest product?
    options:
    - Teak planks
    - Honey
    - Lac
    - Tendu leaves
    answer: Teak planks
    difficulty: 1
    hints:
    - Which one needs the tree cut?
    - Planks are sawn wood.
    solution: Teak planks are timber; the others are gathered without cutting trees.
    mistakes:
      Lac: c9ss11_forest_use
  - prompt: A village shares a grazing ground and has rules about how many cattle each family may graze. This ground is an example of…
    options:
    - An ecological commons
    - Private property
    - A national park
    - A factory
    answer: An ecological commons
    difficulty: 2
    hints:
    - It is shared.
    - The community manages it.
    solution: Shared natural resources managed by community rules are ecological commons.
    mistakes:
      Private property: c9ss11_community_rule
  - prompt: What does the Mendha Lekha motto 'Mawa Nate Mawa Raj' mean?
    options:
