    difficulty: 2
    hints:
    - Who wants the land?
    - Shared land can be fenced off.
    solution: More people, industries and private ownership take over shared land and water.
    mistakes:
      Too many community rules: c9ss11_community_rule
  - prompt: Which forest product does Mendha Lekha manage sustainably?
    options:
    - Bamboo
    - Coal
    - Oil
    - Iron ore
    answer: Bamboo
    difficulty: 1
    hints:
    - It grows fast.
    - It is a giant grass.
    solution: Mendha Lekha harvests bamboo under its community forest rights.
    mistakes:
      Coal: c9ss11_forest_use
  - prompt: What is ecotourism?
    options:
    - Tourism that earns income while protecting nature
    - Cutting forests for hotels
    - Tourism only in cities
    - Hunting trips
    answer: Tourism that earns income while protecting nature
    difficulty: 2
    hints:
    - Eco is from ecology.
    - Visitors come to enjoy nature.
