  - prompt: Why did the Forest Rights Act matter to forest communities?
    options:
    - It recognised their rights over land and resources they had long used
    - It banned them from forests
    - It sold forests to companies
    - It made them pay new taxes
    answer: It recognised their rights over land and resources they had long used
    difficulty: 3
    hints:
    - Before the Act, many were seen as encroachers.
    - What does 'rights' suggest?
    solution: 'Step 1: Communities had used forests for generations without legal rights. Step 2: The Act recognised these rights and gave Gram Sabhas a role.'
    mistakes:
      It banned them from forests: c9ss11_community_rule
  - prompt: Which of these is a sustainable way of using a forest?
