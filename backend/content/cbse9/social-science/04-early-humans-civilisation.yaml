# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 4. Format: content/README.md.
subject: cbse9-ss
chapter: 4
title: Early Humans and Beginning of Civilisation
tips:
  stone_ages: "Old Stone Age: hunting and gathering; Middle: tiny tools; New: farming, polished tools and settled villages. Palaeo = old, meso = middle, neo = new."
  harappan_features: Harappan cities had grid streets, covered drains, baked-brick houses, granaries and the Great Bath at Mohenjo-daro; the script is still not deciphered.
  river_civilisations: "Each early civilisation had its own river: Mesopotamia's two rivers, the Indus, the Huang He, and Egypt's great river that flows north into the Mediterranean."
  c9ss4_pharaoh_clue: Use the clue about the rulers. Which civilisation called its kings pharaohs and buried them in giant stone tombs?
  s9_archaeology: "People who left no writing left objects. Who digs those up and studies them?"
  s9_bhimbetka: "The Great Bath and the dockyard belong to Harappan cities. Bhimbetka is much older, with rock shelters."
  s9_great_bath: "Lothal is known for its dockyard. Which big city had the Great Bath?"
  s9_lothal: "Mohenjo-daro had the Great Bath. Which Gujarat site was a port with a dockyard?"
  s9_mehrgarh: "Mehrgarh is in present-day Pakistan and is very old, older than any empire."
  s9_microliths: "'Mega' means big and 'micro' means small. Which word fits tiny tools?"
  s9_river_valley: "Rivers give two big gifts: water and fertile soil. What do those lead to?"
  s9_surplus: "Farming meant staying in one place. What did extra food let people do?"
  c9ss4_age_order: 'Put the ages in order: Old Stone Age (rough tools, hunting), Middle Stone Age (tiny tools), New Stone Age (polished tools, farming). Which stage fits what is described?'
  c9ss4_site_fact: 'Each Harappan site is remembered for one thing: a bath, a dockyard, ploughed fields, a big water system. Which site goes with the clue in the question?'
concepts:
- code: cbse9us.early.humans
  title: Early humans, from hunting to farming
  notes: |
    Early humans lived for hundreds of thousands of years as hunter-gatherers, moving with the seasons and
    using stone tools. Historians divide the Stone Age into the Palaeolithic (Old Stone Age: rough tools,
    hunting, gathering, use of fire; rock shelters such as Bhimbetka in Madhya Pradesh with paintings),
    the Mesolithic (Middle: small sharp tools called microliths, beginning of herding) and the Neolithic
    (New: polished tools, farming, domestication of animals, pottery, weaving and settled villages). Mehrgarh
    (in present-day Balochistan) is one of the earliest farming villages in South Asia, with wheat and barley,
    cattle, sheep and goats. Farming meant food surpluses, larger settlements, crafts and trade. Evidence comes
    from archaeology: tools, bones, seeds, pottery and cave art.
  explanations:
    text: For most of human history, people moved from place to place to hunt and gather food. When they learned to grow crops and keep animals, they could stay in one place, store extra food and build villages. That change, the Neolithic revolution, led to towns and civilisations.
    visual: 'Draw a timeline with three steps: a hunter with a rough stone axe (Palaeolithic), a person with tiny sharp blades on an arrow (Mesolithic), and a family beside a mud house, field and pot (Neolithic).'
    step_by_step: 'Step 1: Look at the tools: rough (Palaeo), tiny (Meso) or polished (Neo). Step 2: Look at the food: hunting/gathering or farming? Step 3: Look at homes: moving or settled? Step 4: Match to the age.'
    real_world: The Bhimbetka rock shelters, a UNESCO World Heritage Site, still show paintings of hunting and dancing made thousands of years ago.
  picture:
    kind: flow
    steps:
    - 'Palaeolithic: hunting, rough tools'
    - 'Mesolithic: microliths, herding begins'
    - 'Neolithic: farming, villages'
    - Food surplus, crafts, trade
    - Towns and civilisations
    alt: How humans moved from hunting and gathering through farming to towns and civilisations.
  activity:
    type: order
    prompt: Put the stages of early human life in order.
    steps:
    - 'Palaeolithic: rough tools, hunting, fire'
    - 'Mesolithic: microliths, herding begins'
    - 'Neolithic: farming, pottery, villages like Mehrgarh'
    - Food surpluses, crafts and trade
    reasons:
      'Mesolithic: microliths, herding begins': Smaller, sharper tools came after rough ones.
      'Neolithic: farming, pottery, villages like Mehrgarh': Farming needed settled life, which came after herding began.
      Food surpluses, crafts and trade: Surpluses came only after farming took hold.
  lesson:
    - teach: For hundreds of thousands of years early humans were hunter-gatherers. They moved with the seasons, following animals and fruiting plants, used stone tools, learnt to control fire, and sheltered in caves and rock shelters. At Bhimbetka in Madhya Pradesh, rock shelters still have their paintings of animals and people.
      check:
        prompt: Why did early hunter-gatherers keep moving?
        options:
        - To follow animals and seasonal plants
        - To find schools
        - To trade with cities
        answer: To follow animals and seasonal plants
        why: Their food moved and changed with the seasons.
    - teach: 'Historians divide the Stone Age into three stages. Palaeolithic (Old): large rough tools, hunting and gathering. Mesolithic (Middle): tiny sharp tools called microliths, set in handles; herding begins. Neolithic (New): polished tools, farming, tamed animals, pottery, weaving and settled villages.'
      picture:
        kind: flow
        steps:
        - 'Palaeolithic: rough tools, hunting, fire'
        - 'Mesolithic: microliths, herding begins'
        - 'Neolithic: farming, pottery, villages'
        alt: The three stages of the Stone Age and what was new in each.
      check:
        prompt: Pottery and farming villages belong to which stage?
        options:
        - Neolithic
        - Palaeolithic
        - Mesolithic
        answer: Neolithic
        why: The New Stone Age brought farming and settled life.
    - teach: 'Farming changed everything. Growing wheat, barley and rice gave surplus food, so people stayed in one place, villages grew, and some people could become potters, weavers or traders. Mehrgarh (in present-day Balochistan) is one of the earliest farming villages in South Asia. We know about these people from archaeology: tools, bones, seeds, pots and paintings.'
      check:
        prompt: Why could some people in a farming village become potters?
        options:
        - Surplus food meant not everyone had to farm
        - They didn't need food
        - Pots grew on trees
        answer: Surplus food meant not everyone had to farm
        why: Extra food freed some people for other work.
  items:
  - prompt: In which age did people start farming and living in settled villages?
    options:
    - Neolithic
    - Palaeolithic
    - Mesolithic
    - Iron Age only
    answer: Neolithic
    difficulty: 1
    hints:
    - '''Neo'' means new.'
    - Polished tools and pottery.
    solution: 'Step 1: Farming and settled life came with the New Stone Age. Step 2: That is the Neolithic.'
    mistakes:
      Palaeolithic: stone_ages
  - prompt: Tiny, sharp stone tools of the Middle Stone Age are called…
    options:
    - Microliths
    - Megaliths
    - Monoliths
    - Hand axes
    answer: Microliths
    difficulty: 1
    hints:
    - '''Micro'' means small.'
    - They were fixed onto arrows and sickles.
    solution: 'Step 1: Small stone tools. Step 2: ''Micro'' small + ''lith'' stone: microliths.'
    mistakes: {"Megaliths": "s9_microliths"}
  - prompt: Bhimbetka in Madhya Pradesh is famous for…
    options:
    - Rock shelters with ancient paintings
    - A Harappan dockyard
    - The Great Bath
    - Iron tools
    answer: Rock shelters with ancient paintings
    difficulty: 1
    hints:
    - Early humans lived in caves there.
    - Paintings of animals and hunts.
    solution: 'Step 1: Bhimbetka has rock shelters used for thousands of years. Step 2: Their walls carry prehistoric paintings.'
    mistakes: {"The Great Bath": "s9_bhimbetka", "A Harappan dockyard": "s9_bhimbetka"}
  - prompt: Why did farming lead to the growth of villages and towns?
    options:
    - It produced surplus food, so people could stay and some could do other work
    - It needed people to keep moving
    - It made hunting easier
    - It stopped trade
    answer: It produced surplus food, so people could stay and some could do other work
    difficulty: 2
    hints:
    - Fields need looking after.
    - Extra grain can be stored.
    solution: 'Step 1: Crops tie people to one place. Step 2: Surplus food lets some people become potters, weavers and traders, and settlements grow.'
    mistakes: {"It needed people to keep moving": "s9_surplus"}
  - prompt: Mehrgarh is important because it is…
    options:
    - One of the earliest farming villages in South Asia
    - The capital of the Mauryas
    - A Palaeolithic hunting camp in Kerala
    - An Egyptian pyramid site
    answer: One of the earliest farming villages in South Asia
    difficulty: 2
    hints:
    - In Balochistan.
    - Wheat, barley, cattle and goats.
    solution: 'Step 1: Remains of wheat, barley and domestic animals were found there. Step 2: It is one of the earliest farming settlements in South Asia.'
    mistakes: {"The capital of the Mauryas": "s9_mehrgarh"}
  - prompt: How do historians learn about people who left no writing?
    options:
    - From tools, bones, seeds, pottery and cave art found by archaeologists
    - Only from newspapers
    - From written inscriptions
    - They cannot learn anything
    answer: From tools, bones, seeds, pottery and cave art found by archaeologists
    difficulty: 2
    hints:
    - Things left behind.
    - Archaeology.
    solution: 'Step 1: Prehistoric people left objects, not writing. Step 2: Archaeologists study these remains.'
    mistakes: {"From written inscriptions": "s9_archaeology"}
  - prompt: In which Stone Age did people use mainly rough, large stone tools and live by hunting and gathering?
    options:
    - Palaeolithic
    - Neolithic
    - Mesolithic
    - Iron Age
    answer: Palaeolithic
    difficulty: 1
    hints:
    - '''Palaeo'' means old.'
    - The earliest stage.
    solution: The Palaeolithic or Old Stone Age.
    mistakes:
      Neolithic: c9ss4_age_order
  - prompt: Which skill did Palaeolithic people learn that gave warmth, light and safety?
    options:
    - Controlling fire
    - Writing
    - Using iron
    - Building cities
    answer: Controlling fire
    difficulty: 1
    hints:
    - It also helped cook food.
    - It kept animals away.
    solution: Control of fire gave warmth, light, cooked food and protection.
    mistakes:
      Building cities: stone_ages
  - prompt: Taming animals like goats and cattle is called…
    options:
    - Domestication
    - Hunting
    - Gathering
    - Weaving
    answer: Domestication
    difficulty: 1
    hints:
    - The animals live with people.
    - '''Domus'' means home.'
    solution: Keeping and breeding animals for use is domestication.
    mistakes:
      Hunting: stone_ages
  - prompt: Which crops were grown at Mehrgarh?
    options:
    - Wheat and barley
    - Tea and coffee
    - Potatoes and tomatoes
    - Rubber and cocoa
    answer: Wheat and barley
    difficulty: 2
    hints:
    - Early grains of north-west South Asia.
    - The others came much later.
    solution: Mehrgarh's early farmers grew wheat and barley.
    mistakes:
      Tea and coffee: s9_mehrgarh
  - prompt: Why are polished stone axes a sign of the Neolithic age?
    options:
    - Neolithic people ground tools smooth for farming and cutting trees
    - Old Stone Age people polished everything
    - Polished tools were made of iron
    - They were found only in cities
    answer: Neolithic people ground tools smooth for farming and cutting trees
    difficulty: 2
    hints:
    - The New Stone Age made better tools.
    - Farming needed clearing land.
    solution: Grinding and polishing gave sharper, stronger tools for clearing land and farming.
    mistakes:
      Old Stone Age people polished everything: c9ss4_age_order
  - prompt: What do the Bhimbetka paintings tell us?
    options:
    - What animals early people saw and how they hunted and danced
    - The prices of goods
    - The names of kings
    - The script of Harappa
    answer: What animals early people saw and how they hunted and danced
    difficulty: 2
    hints:
    - They are pictures, not writing.
    - They show daily life.
    solution: The paintings show animals, hunting and group dances from early life.
    mistakes:
      The names of kings: s9_bhimbetka
  - prompt: Why did people make pots once they began farming?
    options:
    - To store grain and cook food
    - To pay taxes
    - To build houses
    - To make tools
    answer: To store grain and cook food
    difficulty: 2
    hints:
    - Farmers had surplus grain.
    - Grain must be kept dry and safe.
    solution: Pots stored grain, water and oil, and were used for cooking.
    mistakes:
      To pay taxes: s9_surplus
  - prompt: An archaeologist finds charred grains of rice in an old hearth. What can this suggest?
    options:
    - People there grew or ate rice
    - People there could write
    - There was a king
    - The site was a city
    answer: People there grew or ate rice
    difficulty: 3
    hints:
    - Grains are food remains.
    - Don't claim more than the evidence shows.
    solution: Charred grain shows rice was used there; it can't show writing or kings.
    mistakes:
      People there could write: s9_archaeology
  - prompt: Which change came FIRST?
    options:
    - Making microliths
    - Building Harappan cities
    - Using iron ploughs
    - Writing on seals
    answer: Making microliths
    difficulty: 3
    hints:
    - Microliths are Mesolithic.
    - Cities and writing came much later.
    solution: Microliths (Mesolithic) came long before cities, seals and iron.
    mistakes:
      Building Harappan cities: c9ss4_age_order
- code: cbse9us.early.civilisations
  title: The first civilisations, Harappa and beyond
  notes: |
    Civilisations grew in river valleys where fertile soil and water gave food surpluses: Mesopotamia (Tigris
    and Euphrates; cuneiform writing, ziggurats), Egypt (Nile; pharaohs, pyramids, hieroglyphs), the Harappan
    or Indus–Sarasvati civilisation (about 2600–1900 BCE at its height) and early China (Huang He; Shang
    dynasty, oracle bones). Harappan sites include Harappa, Mohenjo-daro, Dholavira, Lothal (a dockyard),
    Kalibangan and Rakhigarhi. Features: planned cities in a grid with a citadel and lower town, baked bricks
    of standard size, covered drains, the Great Bath at Mohenjo-daro, granaries, standard weights, seals with
    a script that is still not deciphered, crafts such as beads and bronze (the 'dancing girl'), and trade as
    far as Mesopotamia. The cities declined around 1900 BCE, probably because of changing rivers, climate and
    reduced trade, but many practices continued in later Indian life.
  explanations:
    text: 'The first civilisations grew beside rivers. The Harappans built some of the world''s best-planned cities: straight streets crossing at right angles, brick houses with bathrooms, and covered drains, about 4,500 years ago, at the same time as the pyramids of Egypt.'
    visual: 'Draw a Harappan street map: straight streets in a grid, houses facing side lanes, a covered drain along each street, a raised citadel with the Great Bath, and a lower town.'
    step_by_step: 'Step 1: Find the river (Indus, Nile, Tigris–Euphrates, Huang He). Step 2: Name the civilisation. Step 3: Recall its special clue: grid cities and drains (Harappa), pyramids (Egypt), cuneiform (Mesopotamia), oracle bones (China).'
    real_world: Dholavira in Gujarat, with its clever water reservoirs, was made a UNESCO World Heritage Site in 2021.
  picture:
    kind: compare
    columns:
    - title: Harappa
      points:
      - Indus–Sarasvati
      - Grid cities, drains
      - Script not deciphered
    - title: Egypt
      points:
      - Nile
      - Pyramids, pharaohs
      - Hieroglyphs
    - title: Mesopotamia
      points:
      - Tigris and Euphrates
      - Ziggurats
      - Cuneiform
    alt: Harappa, Egypt and Mesopotamia compared by river, buildings and writing.
  activity:
    type: sort
    prompt: Which river-valley civilisation?
    bins:
    - Mesopotamia
    - Egypt
    - Harappan
    - Early China
    items:
    - label: Cuneiform writing and ziggurats
      bin: Mesopotamia
      clue: Tigris and Euphrates.
      why: Mesopotamia.
    - label: Pyramids and hieroglyphs
      bin: Egypt
      clue: The Nile.
      why: Egypt.
    - label: Great Bath and covered drains
      bin: Harappan
      clue: Mohenjo-daro.
      why: Harappan.
    - label: Dockyard at Lothal
      bin: Harappan
      clue: Gujarat.
      why: Harappan.
    - label: Oracle bones of the Shang
      bin: Early China
      clue: Huang He.
      why: Early China.
    - label: Pharaohs
      bin: Egypt
      clue: Nile kings.
      why: Egypt.
  lesson:
    - teach: The first civilisations grew in river valleys, where fertile soil and water gave surplus food and rivers made transport easy. Mesopotamia grew between the Tigris and Euphrates (cuneiform writing, ziggurats), Egypt along the Nile (pharaohs, pyramids, hieroglyphs), China on the Huang He (Shang dynasty, oracle bones), and the Harappan civilisation along the Indus and Sarasvati.
      picture:
        kind: compare
        columns:
        - title: Civilisation
          points:
          - Mesopotamia
          - Egypt
          - Harappan
          - Early China
        - title: River
          points:
          - Tigris and Euphrates
          - Nile
          - Indus and Sarasvati
          - Huang He
        alt: Four early civilisations and the rivers they grew along.
      check:
        prompt: Cuneiform writing comes from…
        options:
        - Mesopotamia
        - Egypt
        - China
        answer: Mesopotamia
        why: Wedge-shaped marks pressed into clay tablets.
    - teach: 'Harappan cities (about 2600–1900 BCE at their height) were carefully planned: streets in a grid, a raised citadel and a lower town, standard baked bricks, covered drains, granaries and, at Mohenjo-daro, the Great Bath. Other sites: Harappa, Dholavira, Lothal (a dockyard), Kalibangan (ploughed field), Rakhigarhi.'
      check:
        prompt: Which feature shows Harappans cared about cleanliness?
        options:
        - Covered drains along the streets
        - Pyramids
        - Oracle bones
        answer: Covered drains along the streets
        why: Waste water flowed away in covered drains.
    - teach: Harappans made seals with animals and a script that no one has deciphered yet. They used standard weights, made beads and bronze objects (the 'dancing girl'), and traded as far as Mesopotamia. Around 1900 BCE the cities declined, probably due to changing rivers, climate and trade, but many crafts and customs carried on.
      check:
        prompt: Why can't we read Harappan writing?
        options:
        - The script has not been deciphered
        - They had no writing
        - All seals were lost
        answer: The script has not been deciphered
        why: Many seals survive, but the code hasn't been cracked.
