# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 8. Format: content/README.md.
subject: cbse9-ss
chapter: 8
title: 'Building Blocks in Economics: The Problem of Choice'
tips:
  opportunity_cost: Opportunity cost is the value of the next best option you give up, not the money you spend.
  scarcity_meaning: Scarcity means wants are unlimited but resources are limited, so we must choose; it does not only mean a shortage in a famine.
  central_problems: "Every economy must decide what to make, how to make it, and for whom. Which choice has nothing to do with producing goods?"
  s9_capital: "Land is nature's gift and labour is human effort. What is a man-made tool used to produce more?"
  s9_entrepreneur: "The worker gives labour and the bank lends money. Who organises everything and bears the risk?"
  s9_free_good: "A free good is plentiful and costs nothing. Which one does nobody have to pay for?"
  s9_mixed: "Both government and private businesses decide. That is a mix of the two systems."
  s9_trade_off: "A subsidy is help from government. What is it called when you give up one thing to get another?"
  s9_wages: "Rent goes to land and interest to capital. What is paid for work?"
  c9ss8_next_best: Opportunity cost is not what you got. It is the best thing you gave up to get it. Find that one option.
  c9ss8_limited: Ask whether there is enough of it for everyone's wants without anyone paying or giving anything up.
  c9ss8_which_question: Sort the choice into one of three questions. Is it about which goods, which method, or who gets them?
  c9ss8_factor: Ask what role it plays in making things. Is it nature's gift, human effort, a made tool, or the organiser who takes the risk?
  c9ss8_reward: Each factor earns its own kind of income. Match the factor to its payment.
  c9ss8_who_decides: Ask who decides what to make. Prices and private firms, the government, or both together?
concepts:
- code: cbse9us.choice.scarcity
  title: Scarcity, choice and opportunity cost
  notes: |
    Economics begins with a basic fact: human wants are unlimited, but resources (time, money, land, labour,
    materials) are limited. This is scarcity, and it means every person, family, business and government must
    make choices. Choosing one thing means giving up something else: a trade-off. The value of the next best
    alternative given up is the opportunity cost. For example, if Anu spends Saturday at a coding class instead
    of working at her uncle's shop for ₹500, the opportunity cost of the class is the ₹500 (and whatever else
    she might have done). Resources also have alternative uses: a piece of land could grow rice, become a
    playground or a factory. Goods can be needs (food, shelter) or wants; free goods (air) versus economic
    goods (which need scarce resources). Good choices compare benefits and costs at the margin.
  explanations:
    text: 'You have ₹100 and two things you''d like: a book and a movie ticket. You can''t have both: that''s scarcity. If you pick the book, the movie you gave up is the opportunity cost. Every choice, by people or governments, has a cost like this.'
    visual: Draw a fork in a road. One path leads to 'Book', the other to 'Movie'. Walking down the book path, the movie path becomes grey with a label 'opportunity cost'.
    step_by_step: 'Step 1: List the options. Step 2: Choose the best one. Step 3: Find the next best option you didn''t choose. Step 4: Its value is the opportunity cost.'
    real_world: When a state government spends more on new roads, it may have less for hospitals that year; that trade-off is debated in every budget.
  picture:
    kind: compare
    columns:
    - title: You choose
      points:
      - Coding class on Saturday
    - title: You give up
      points:
      - ₹500 shop work
      - = opportunity cost
    alt: Choosing a coding class means giving up ₹500 of shop work; that is the opportunity cost.
  activity:
    type: sort
    prompt: What is the opportunity cost?
    bins:
    - Lost earnings
    - Lost playtime
    - Nothing given up
    items:
    - label: Anu goes to coding class instead of working for ₹500
      bin: Lost earnings
      clue: What did she give up?
      why: The next best choice she gave up.
    - label: Ravi studies instead of playing cricket
      bin: Lost playtime
      clue: What was the next best choice?
      why: Cricket was given up.
    - label: Breathing fresh air
      bin: Nothing given up
      clue: Is air scarce?
      why: Air is a free good.
    - label: Meera skips a ₹500 tuition job to rest
      bin: Lost earnings
      clue: Same amount given up.
      why: ₹500 of earnings.
  lesson:
    - teach: Human wants have no end, but the things we use to satisfy them, time, money, land, labour and materials, are limited. This gap is called scarcity. Because of scarcity, every person, family, business and government has to choose.
      check:
        prompt: Scarcity means…
        options:
        - Wants are more than the resources to meet them
        - There is nothing at all
        - Everyone is rich
        answer: Wants are more than the resources to meet them
        why: Scarcity is wants compared with resources, not total emptiness.
    - teach: 'When you choose one thing you give up another: a trade-off. The value of the best option you gave up is the opportunity cost. If Anu goes to a coding class on Saturday instead of earning ₹500 at her uncle''s shop, the class costs her ₹500 of lost earnings, even if the class itself is free.'
      picture:
        kind: flow
        steps:
        - Limited resources
        - Must choose
        - Give up next best option
        - That is the opportunity cost
        alt: Limited resources lead to choice, giving up the next best option, which is the opportunity cost.
      check:
        prompt: Anu's coding class is free. What is its opportunity cost?
        options:
        - The ₹500 she could have earned
        - Nothing at all
        - The class fee
        answer: The ₹500 she could have earned
        why: The cost is what she gave up.
    - teach: 'Goods that need scarce resources are economic goods, like rice or a bicycle. A few things, like the air we breathe, are free goods: there is enough for all and nobody must give anything up. Even rich countries face scarcity, because wants grow faster than resources.'
      check:
        prompt: Which is a free good?
        options:
        - Air
        - A mobile phone
        - Petrol
        answer: Air
        why: Air is available to all without giving anything up.
  items:
  - prompt: What is the basic economic problem that forces us to make choices?
    options:
    - 'Scarcity: unlimited wants and limited resources'
    - Too much money
    - Too many shops
    - Unlimited resources
    answer: 'Scarcity: unlimited wants and limited resources'
    difficulty: 1
    hints:
    - We can't have everything.
    - Resources are limited.
    solution: 'Step 1: Wants have no end. Step 2: Resources are limited. Step 3: This gap is scarcity, which forces choice.'
    mistakes:
      Unlimited resources: scarcity_meaning
  - prompt: Ravi can either work for ₹400 or attend a free workshop on Sunday. He attends the workshop. What is his opportunity cost?
    answer: '400'
    check: '400'
    difficulty: 1
    hints:
    - What did he give up?
    - The workshop is free.
    solution: 'Step 1: The next best option was working. Step 2: He gave up ₹400, which is the opportunity cost.'
    mistakes:
      '0': opportunity_cost
  - prompt: Which of these is a free good?
    options:
    - Air
    - A school bag
    - Electricity
    - Rice
    answer: Air
    difficulty: 1
    hints:
    - Nature gives it in plenty.
    - No price is paid.
    solution: 'Step 1: Free goods are plentiful and need no scarce resources. Step 2: Air is one.'
    mistakes: {"Electricity": "s9_free_good"}
  - prompt: Giving up some of one thing to get more of another is called a…
    options:
    - Trade-off
    - Subsidy
    - Tax
    - Profit
    answer: Trade-off
    difficulty: 2
    hints:
    - Trading one thing for another.
    - Every choice involves one.
    solution: 'Step 1: You can''t have more of everything. Step 2: Accepting less of one to get more of another is a trade-off.'
    mistakes: {"Subsidy": "s9_trade_off", "Profit": "s9_trade_off"}
  - prompt: A farmer uses a field for coconut instead of banana, which would have earned ₹30,000. The coconut earns ₹40,000. What is the opportunity cost of growing coconut?
    options:
    - ₹30,000, the earnings from banana given up
    - ₹40,000
    - ₹70,000
    - Nothing
    answer: ₹30,000, the earnings from banana given up
    difficulty: 2
    hints:
    - The next best use of the field.
    - Not the coconut's own earnings.
    solution: 'Step 1: The next best use was banana. Step 2: Its ₹30,000 is the opportunity cost.'
    mistakes:
      ₹40,000: opportunity_cost
      Nothing: opportunity_cost
  - prompt: Why does even a rich country face scarcity?
    options:
    - Its wants still exceed its resources, so it must choose
    - Rich countries have no scarcity
    - Because money is unlimited
    - Because it has no land
    answer: Its wants still exceed its resources, so it must choose
    difficulty: 3
    hints:
    - Scarcity is relative to wants.
    - Budgets still have limits.
    solution: 'Step 1: Wants grow with income. Step 2: Resources are still limited, so choices are still needed.'
    mistakes:
      Rich countries have no scarcity: scarcity_meaning
  - prompt: Meena has ₹200. She can buy a book or a movie ticket, and she buys the book. What is her opportunity cost?
    options:
    - The movie she gave up
    - The book
    - ₹0
    - ₹400
    answer: The movie she gave up
    difficulty: 1
    hints:
    - What did she not get?
    - Cost here is what is given up.
    solution: 'Step 1: She chose the book. Step 2: The thing given up, the movie, is her opportunity cost.'
    mistakes:
      The book: c9ss8_next_best
  - prompt: A student can spend an evening studying, playing cricket, or watching TV. They study, and would have chosen cricket next. What is the opportunity cost of studying?
    options:
    - Playing cricket
    - Watching TV
    - Both cricket and TV
    - Nothing
    answer: Playing cricket
    difficulty: 2
    hints:
    - Only one option counts.
    - It is the next best one.
    solution: 'Step 1: Opportunity cost is only the next best option. Step 2: That was cricket, not TV.'
    mistakes:
      Both cricket and TV: c9ss8_next_best
  - prompt: Which of these is an economic good?
    options:
    - A notebook
    - Sunlight
    - Air
    - Sea breeze
    answer: A notebook
    difficulty: 1
    hints:
    - Which one needs scarce resources to make?
    - You pay for it.
    solution: A notebook needs paper, labour and machines, which are scarce, so it is an economic good.
    mistakes:
      Sunlight: c9ss8_limited
  - prompt: A government spends ₹100 crore on a new stadium instead of a hospital. What is the opportunity cost?
    options:
    - The hospital not built
    - The stadium
    - ₹200 crore
    - Nothing, governments have unlimited money
    answer: The hospital not built
    difficulty: 2
    hints:
    - What did the government give up?
    - Governments also face scarcity.
    solution: 'Step 1: Money spent on one project cannot be spent on another. Step 2: The hospital given up is the opportunity cost.'
    mistakes:
      Nothing, governments have unlimited money: c9ss8_limited
  - prompt: Ali can work 3 hours for ₹150 an hour or go to a free cricket match. He goes to the match. What is his opportunity cost in rupees?
    answer: 450
    check: 3 * 150
    difficulty: 2
    hints:
    - What did he give up?
    - Hours × pay per hour.
    solution: 'Step 1: Lost earnings = 3 × ₹150. Step 2: That is ₹450.'
    mistakes:
      '150': c9ss8_next_best
      '0': c9ss8_next_best
  - prompt: A piece of land could become a playground, a rice field or a factory. This shows that resources…
    options:
    - Have alternative uses
    - Are unlimited
    - Have no value
    - Cannot be used
    answer: Have alternative uses
    difficulty: 1
    hints:
    - Count how many uses the land has.
    - Choosing one rules out the others.
    solution: One resource can be used in many ways, so we must choose among them.
    mistakes:
      Are unlimited: c9ss8_limited
  - prompt: Which statement about scarcity is true?
    options:
    - Every economy faces it, rich or poor
    - Only poor countries face it
    - It ends when people earn more
    - It applies only to water
    answer: Every economy faces it, rich or poor
    difficulty: 2
    hints:
    - Do wants stop when income rises?
    - Think of a rich country's wish list.
    solution: Wants keep growing, so even rich economies must choose.
    mistakes:
      It ends when people earn more: c9ss8_limited
  - prompt: Choosing more of one thing means having less of another. This is called a…
    options:
    - Trade-off
    - Free good
    - Surplus
    - Profit
    answer: Trade-off
    difficulty: 1
    hints:
    - You trade one thing for another.
    - It follows from scarcity.
    solution: Giving up some of one thing to get more of another is a trade-off.
    mistakes:
      Free good: c9ss8_limited
  - prompt: Why is time considered a scarce resource for a student?
    options:
    - There are only 24 hours a day, and many things to do
    - Clocks are expensive
    - Time can be bought in shops
    - Students have unlimited time
    answer: There are only 24 hours a day, and many things to do
    difficulty: 2
    hints:
    - Can you add hours to a day?
    - List what a student wants to do.
    solution: 'Step 1: A day has fixed hours. Step 2: Study, sleep, play and help at home all compete for them.'
    mistakes:
      Students have unlimited time: c9ss8_limited
- code: cbse9us.choice.central
  title: The central problems of an economy and factors of production
  notes: |
    Because resources are scarce, every economy must answer three central questions: what to produce (and how
    much), how to produce (which methods, labour-intensive or capital-intensive), and for whom to produce (how
    output is shared). Resources used in production are the factors of production: land (all natural
    resources), labour (human effort), capital (tools, machines, buildings, money for production) and
    entrepreneurship (organising the others and taking risk). Their rewards are rent, wages, interest and
    profit. Economies answer the central questions differently: in a market economy mainly through prices and
    private choices, in a centrally planned economy through government decisions, and in a mixed economy, like
    India, through both. A production possibility frontier shows the combinations of two goods an economy can
    make with its resources; moving along it shows the opportunity cost.
  explanations:
    text: Every country is like a big kitchen with limited ingredients. It must decide what dishes to cook, how to cook them (by hand or by machine) and who gets to eat. The ingredients are land, labour, capital and the cook who organises it all, the entrepreneur.
    visual: 'Draw a bakery: the plot it stands on (land), the baker (labour), the oven (capital) and the owner with a plan (entrepreneur). Arrows show their rewards: rent, wages, interest, profit.'
    step_by_step: 'Step 1: What to produce? Choose among goods. Step 2: How? Pick methods. Step 3: For whom? Decide who gets the output. Step 4: Identify the factors: land, labour, capital, entrepreneurship.'
    real_world: 'India is a mixed economy: the government runs railways and sets minimum support prices, while private firms make most cars, phones and clothes.'
  picture:
    kind: compare
    columns:
    - title: Factor
      points:
      - Land
      - Labour
      - Capital
      - Entrepreneur
    - title: Reward
      points:
      - Rent
      - Wages
      - Interest
      - Profit
    alt: 'The four factors of production and their rewards: land earns rent, labour wages, capital interest, entrepreneurship profit.'
  activity:
    type: sort
    prompt: Which central problem is it?
    bins:
    - What to produce
    - How to produce
    - For whom to produce
    items:
    - label: More rice or more cotton?
      bin: What to produce
      clue: Which goods.
      why: What.
    - label: Machines or many workers?
      bin: How to produce
      clue: Methods.
      why: How.
    - label: Who gets the cars made?
      bin: For whom to produce
      clue: Sharing output.
      why: For whom.
    - label: Hospitals or highways?
      bin: What to produce
      clue: Which goods.
      why: What.
    - label: Labour-intensive or capital-intensive?
      bin: How to produce
      clue: Methods.
      why: How.
    - label: Should the poor get free rice?
      bin: For whom to produce
      clue: Distribution.
      why: For whom.
  lesson:
    - teach: 'Because resources are scarce, every economy must answer three central questions. What to produce, and how much? How to produce: by hand with many workers, or with machines? For whom to produce: how is the output shared among people?'
      picture:
        kind: flow
        steps:
        - What to produce?
        - How to produce?
        - For whom to produce?
        alt: 'The three central problems of an economy: what, how and for whom to produce.'
      check:
        prompt: Deciding whether to make more rice or more cars is about…
        options:
        - What to produce
        - How to produce
        - For whom to produce
        answer: What to produce
        why: It is about which goods and how much.
    - teach: The resources used in production are the factors of production. Land means all natural resources. Labour is human effort. Capital is tools, machines, buildings and money used for production. The entrepreneur brings them together and takes the risk. Their rewards are rent, wages, interest and profit.
      picture:
        kind: compare
        columns:
        - title: Factor
          points:
          - Land
          - Labour
          - Capital
          - Entrepreneur
        - title: Reward
          points:
          - Rent
          - Wages
          - Interest
          - Profit
        alt: 'The four factors of production next to their rewards: land and rent, labour and wages, capital and interest, entrepreneur and profit.'
      check:
        prompt: A factory's machine is which factor?
        options:
        - Capital
        - Land
        - Labour
        answer: Capital
        why: Machines are man-made aids to production.
    - teach: 'Economies answer the central questions in different ways. In a market economy, prices and private firms decide. In a centrally planned economy, the government decides. In a mixed economy, like India, both play a role: private firms make most goods, while the government runs railways, sets rules and provides services.'
      check:
        prompt: India is a…
        options:
        - Mixed economy
        - Pure market economy
        - Pure planned economy
        answer: Mixed economy
        why: Both the government and private firms decide.
  items:
  - prompt: Which of these is NOT one of the three central problems of an economy?
    options:
    - Where to go on holiday
    - What to produce
    - How to produce
    - For whom to produce
    answer: Where to go on holiday
    difficulty: 1
    hints:
    - What, how and for whom.
    - One option is a personal choice.
    solution: 'Step 1: The central problems are what, how and for whom to produce. Step 2: A holiday destination is not one of them.'
    mistakes:
      How to produce: central_problems
  - prompt: A tractor used on a farm is an example of which factor of production?
    options:
    - Capital
    - Land
    - Labour
    - Entrepreneurship
    answer: Capital
    difficulty: 1
    hints:
    - Man-made tools and machines.
    - Used to produce other goods.
    solution: 'Step 1: Machines made by people to help production are capital. Step 2: A tractor is capital.'
    mistakes: {"Land": "s9_capital", "Labour": "s9_capital"}
  - prompt: The reward for labour is…
    options:
    - Wages
    - Rent
    - Interest
    - Profit
    answer: Wages
    difficulty: 1
    hints:
    - Paid to workers.
    - Daily or monthly pay.
    solution: 'Step 1: Labour is human effort. Step 2: It earns wages.'
    mistakes: {"Rent": "s9_wages", "Profit": "s9_wages"}
  - prompt: Choosing between making cloth with handlooms or with power looms is part of which central problem?
    options:
    - How to produce
    - What to produce
    - For whom to produce
    - None
    answer: How to produce
    difficulty: 2
    hints:
    - It's about methods.
    - Labour-intensive or capital-intensive.
    solution: 'Step 1: The product (cloth) is already chosen. Step 2: Choosing the method is ''how to produce''.'
    mistakes:
      What to produce: central_problems
  - prompt: India, where both government and private businesses decide what is produced, is called a…
    options:
    - Mixed economy
    - Market economy only
    - Barter economy
    - Centrally planned economy only
    answer: Mixed economy
    difficulty: 2
    hints:
    - Both sectors.
    - Railways and private car makers.
    solution: 'Step 1: Both the public and private sectors play big roles. Step 2: That is a mixed economy.'
    mistakes: {"Market economy only": "s9_mixed", "Centrally planned economy only": "s9_mixed"}
  - prompt: Who brings land, labour and capital together and takes the risk of a business?
    options:
    - The entrepreneur
    - The landlord
    - The worker
    - The bank
    answer: The entrepreneur
    difficulty: 2
    hints:
    - Earns profit, or bears loss.
    - The organiser.
    solution: 'Step 1: Someone must plan and take risk. Step 2: That person is the entrepreneur, rewarded with profit.'
    mistakes: {"The bank": "s9_entrepreneur", "The worker": "s9_entrepreneur"}
  - prompt: A government decides that food should reach poor families through ration shops. Which central problem is this?
    options:
    - For whom to produce
    - What to produce
    - How to produce
    - Where to go on holiday
    answer: For whom to produce
    difficulty: 2
    hints:
    - It is about who gets the goods.
    - Distribution, not making.
    solution: 'Step 1: The question is how output is shared. Step 2: That is ''for whom to produce''.'
    mistakes:
      What to produce: c9ss8_which_question
  - prompt: A river used to irrigate fields is which factor of production?
    options:
    - Land
    - Labour
    - Capital
    - Entrepreneur
    answer: Land
    difficulty: 1
    hints:
    - Who made the river?
    - Gifts of nature count here.
    solution: All natural resources, including rivers, are counted as land.
    mistakes:
      Capital: c9ss8_factor
  - prompt: A bank lends money to a factory. What reward does the bank get?
    options:
    - Interest
    - Rent
    - Wages
    - Profit
    answer: Interest
    difficulty: 2
    hints:
    - Money for production counts as capital.
    - Capital earns...
    solution: 'Step 1: Lent money is capital. Step 2: The reward of capital is interest.'
    mistakes:
      Rent: c9ss8_reward
  - prompt: A carpenter's work of making a chair is which factor of production?
    options:
    - Labour
    - Land
    - Capital
    - Rent
    answer: Labour
    difficulty: 1
    hints:
    - It is human effort.
    - Physical or mental work.
    solution: Human effort used in production is labour.
    mistakes:
      Capital: c9ss8_factor
  - prompt: In which kind of economy does the government decide almost everything that is produced?
    options:
    - Centrally planned economy
    - Market economy
    - Mixed economy
    - Barter economy
    answer: Centrally planned economy
    difficulty: 2
    hints:
    - Think of a central plan.
    - Private firms have little say.
    solution: In a centrally planned economy, the government decides what, how and for whom.
    mistakes:
      Market economy: c9ss8_who_decides
  - prompt: A landowner lets a shopkeeper use their building. What does the landowner earn?
    options:
    - Rent
    - Wages
    - Interest
    - Profit
    answer: Rent
    difficulty: 1
    hints:
    - Land and buildings are let out.
    - What do tenants pay?
    solution: The reward for letting land or property is rent.
    mistakes:
      Profit: c9ss8_reward
  - prompt: A clothes company switches from many tailors to automatic machines. Which central problem is it answering?
    options:
    - How to produce
    - What to produce
    - For whom to produce
    - Why to produce
    answer: How to produce
    difficulty: 2
    hints:
    - The product is the same.
    - Only the method changes.
    solution: 'Step 1: Same clothes, different method. Step 2: That is ''how to produce''.'
    mistakes:
      What to produce: c9ss8_which_question
  - prompt: What reward does an entrepreneur get if the business does well?
    options:
    - Profit
    - Rent
    - Interest
    - Wages
    answer: Profit
    difficulty: 1
    hints:
    - They take the risk.
    - What is left after paying the others.
    solution: The entrepreneur earns profit, what remains after paying rent, wages and interest.
    mistakes:
      Wages: c9ss8_reward
  - prompt: In a market economy, what mainly decides what is produced?
    options:
    - Prices and the choices of buyers and private firms
    - Only the government
    - Only the army
    - A lottery
    answer: Prices and the choices of buyers and private firms
    difficulty: 2
    hints:
    - Think of a free market.
    - Firms make what sells.
    solution: 'Step 1: Firms produce what people will buy. Step 2: Prices signal what is wanted.'
    mistakes:
      Only the government: c9ss8_who_decides
