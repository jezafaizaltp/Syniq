# CBSE Class 9 Social Science (NCERT), History chapter 5. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 5
title: Pastoralists in the Modern World

tips:
  pastoral_groups: "Gujjar Bakarwals (Jammu and Kashmir), Gaddis (Himachal), Bhotiyas, Sherpas and Kinnauris (Garhwal–Kumaon), Dhangars (Maharashtra), Raikas (Rajasthan), Maasai (East Africa)."
  criminal_tribes_act: "The Criminal Tribes Act of 1871 labelled many trader, craft and pastoral communities as 'criminal by birth'."

concepts:
  - code: cbse9ss.pastoral.india
    title: Pastoral nomads in India and colonial rule
    notes: |
      Pastoralists move seasonally with herds: Gujjar Bakarwals (J&K) and Gaddis (Himachal) move between
      winter low hills and summer high meadows (bugyals); Dhangars (Maharashtra), Gollas, Kurumas and Kurubas
      (Karnataka, Andhra), Raikas (Rajasthan). Colonial changes: waste land rules (grazing land given to
      cultivators), Forest Acts, Criminal Tribes Act 1871, grazing tax (1850s onward). Pastoralists
      reduced herds, found new pastures, combined with farming and trade.
    explanations:
      text: "Pastoralists are herders who move with their animals through the seasons. The Gujjar Bakarwals of Kashmir go up to high meadows in summer and down to the foothills in winter. Colonial rules hurt them: grazing land was handed to farmers, forests were closed, a grazing tax was charged on every animal, and some communities were branded criminal."
      visual: "Draw a mountain. Put a herd near the top labelled 'summer: meadows' and the same herd at the bottom labelled 'winter: low hills'. Draw arrows between them for the yearly journey."
      step_by_step: "Step 1: Name the group and region. Step 2: Describe the seasonal movement. Step 3: List colonial rules: wasteland rules, Forest Acts, Criminal Tribes Act, grazing tax. Step 4: Describe how herders adapted."
      real_world: "Even today, in spring you can see Gaddi shepherds moving their flocks up roads in Himachal towards the high pastures, as their families have done for centuries."
    items:
      - prompt: "Which pastoral community lives in Jammu and Kashmir?"
        options: ["Gujjar Bakarwals", "Dhangars", "Raikas", "Maasai"]
        answer: "Gujjar Bakarwals"
        difficulty: 1
        hints: ["They herd goats and sheep.", "Dhangars are from Maharashtra."]
        solution: "The Gujjar Bakarwals live in Jammu and Kashmir."
        mistakes: {"Dhangars": pastoral_groups}
      - prompt: "In which year was the Criminal Tribes Act passed?"
        answer: "1871"
        check: "1871"
        difficulty: 2
        hints: ["Late 19th century.", "Same decade as the 1878 Forest Act."]
        solution: "The Criminal Tribes Act was passed in 1871."
      - prompt: "High-altitude meadows in the Garhwal and Kumaon hills are called…"
        options: ["Bugyals", "Ghats", "Doabs", "Terai"]
        answer: "Bugyals"
        difficulty: 2
        hints: ["Summer pastures above 12,000 feet.", "Not the Western Ghats."]
        solution: "These high meadows are called bugyals."
      - prompt: "Why did the colonial government give grazing land to cultivators?"
        options: ["To increase land revenue and crops", "To help pastoralists", "To build forests", "To make cities"]
        answer: "To increase land revenue and crops"
        difficulty: 1
        hints: ["Uncultivated land gave no tax.", "Called 'waste land'."]
        solution: "Farmed land produced crops and revenue, so 'waste' grazing land was given to cultivators."
      - prompt: "Raikas are pastoralists from which state?"
        options: ["Rajasthan", "Kerala", "Assam", "Punjab"]
        answer: "Rajasthan"
        difficulty: 2
        hints: ["Desert region.", "They herd camels too."]
        solution: "The Raikas live in Rajasthan."
        mistakes: {"Punjab": pastoral_groups}
      - prompt: "How did many pastoralists respond to colonial restrictions?"
        options: ["Reduced herds and found new pastures", "Gave up all animals immediately", "Moved to Europe", "Joined the British army only"]
        answer: "Reduced herds and found new pastures"
        difficulty: 3
        hints: ["They adapted.", "Some also took up farming or trade."]
        solution: "They cut herd sizes, found new grazing grounds, and some combined herding with farming or trade."

  - code: cbse9ss.pastoral.africa
    title: The Maasai of East Africa
    after: [cbse9ss.pastoral.india]
    notes: |
      Over half of the world's pastoralists live in Africa. The Maasai of Kenya and Tanzania lost about 60%
      of their pre-colonial lands when European powers divided Maasailand (1885, British Kenya and German
      Tanganyika). Game reserves (Maasai Mara, Serengeti) closed grazing areas. Movement restricted. Drought
      killed cattle. Social changes: elders and warriors lost authority; inequality grew between rich and
      poor herders.
    explanations:
      text: "The Maasai are cattle herders of East Africa. In 1885 the British and Germans split Maasailand with a border, and the Maasai lost about 60% of their land. Their best grazing land became farms and game reserves like the Serengeti, and laws stopped them moving freely. In droughts, many cattle died because herds couldn't go to better pastures."
      visual: "Draw a map with a straight line splitting Maasailand into Kenya (British) and Tanganyika (German). Shade large areas as 'farms' and 'game reserves'. What's left for the Maasai is a small squeezed patch."
      step_by_step: "Step 1: Before: wide grazing lands and free movement. Step 2: 1885: split between Britain and Germany. Step 3: Land lost to farms and reserves. Step 4: Movement restricted, drought made it worse. Step 5: Society changed: richer herders gained, poorer ones lost."
      real_world: "Tourists today visit the Maasai Mara reserve to see lions and wildebeest. Many don't know that the land was once Maasai grazing land."
    items:
      - prompt: "In which countries do the Maasai mainly live?"
        options: ["Kenya and Tanzania", "Egypt and Sudan", "Nigeria and Ghana", "South Africa and Namibia"]
        answer: "Kenya and Tanzania"
        difficulty: 1
        hints: ["East Africa.", "Serengeti is in Tanzania."]
        solution: "The Maasai live mainly in Kenya and Tanzania."
      - prompt: "About what percentage of their pre-colonial lands did the Maasai lose?"
        answer: "60"
        check: "60"
        difficulty: 1
        hints: ["More than half.", "Three-fifths."]
        solution: "They lost about 60% of their lands."
      - prompt: "In which year was Maasailand divided between British Kenya and German Tanganyika?"
        answer: "1885"
        check: "1885"
        difficulty: 2
        hints: ["During the 'scramble for Africa'.", "1880s."]
        solution: "Maasailand was divided in 1885."
      - prompt: "Which of these was a game reserve created on Maasai grazing land?"
        options: ["Serengeti", "Sahara", "Kalahari", "Congo"]
        answer: "Serengeti"
        difficulty: 2
        hints: ["Famous for wildlife migration.", "In Tanzania."]
        solution: "The Serengeti National Park was created on Maasai land."
      - prompt: "More than half of the world's pastoralists live in which continent?"
        options: ["Africa", "Asia", "Europe", "South America"]
        answer: "Africa"
        difficulty: 1
        hints: ["The Maasai are one example.", "Also Somali, Berber, Turkana."]
        solution: "Over half of the world's pastoral population lives in Africa."
      - prompt: "How did colonial rules affect Maasai society?"
        options: ["Elders lost authority and inequality grew", "Everyone became richer", "Herds grew larger for all", "Nothing changed"]
        answer: "Elders lost authority and inequality grew"
        difficulty: 3
        hints: ["Chiefs appointed by the British.", "Some rich herders bought land."]
        solution: "Traditional elders and warriors lost power, and the gap between rich and poor herders grew."
