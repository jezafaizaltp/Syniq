# CBSE Class 9 Social Science (NCERT), Geography chapter 5. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 10
title: Natural Vegetation and Wildlife

tips:
  forest_types_rain: "Tropical evergreen forests need over 200 cm of rain; tropical deciduous 70–200 cm; thorn forests below 70 cm."
  mangrove_delta: "Mangrove forests grow in coastal deltas flooded by tides. The Sundari tree gives the Sundarbans its name."
  biosphere_vs_park: "A biosphere reserve protects a whole ecosystem with people living in its outer zones. National parks protect wildlife with stricter rules."

concepts:
  - code: cbse9ss.veg.types
    title: Types of vegetation
    notes: |
      Natural vegetation grows without human help; flora and fauna. India is one of 12 mega-biodiversity
      countries, with about 47,000 plant species (10th in the world) and about 15,000 flowering plants
      (6% of the world's). Factors: relief (land, soil) and climate (temperature, photoperiod,
      precipitation). Types: tropical evergreen (more than 200 cm; Western Ghats, north-east, Andaman;
      ebony, mahogany, rosewood), tropical deciduous (monsoon forests; moist 100–200 cm: teak, sal; dry
      70–100 cm), tropical thorn forests and scrubs (below 70 cm; acacias, cactus), montane forests
      (change with altitude), mangroves (deltas; Sundari tree). Forest cover about 21–24% of area.
    explanations:
      text: "The plants that grow naturally in a place depend mostly on its rain and temperature. Very wet places like the Western Ghats have tropical evergreen forests that stay green all year. Most of India has deciduous monsoon forests, whose trees shed leaves in the dry season: teak and sal grow here. Dry areas have thorny scrub, mountains have forests that change with height, and river deltas have mangroves."
      visual: "Draw a rain gauge with three marks. Above 200 cm: a dense evergreen forest. 70–200 cm: deciduous trees with a few bare branches. Below 70 cm: cactus and thorn bushes. Then draw a mountain with layers: broadleaf forest at the bottom, conifers higher, alpine grass at the top."
      step_by_step: "Step 1: Check rainfall. Step 2: Over 200 cm: evergreen. 100–200: moist deciduous. 70–100: dry deciduous. Below 70: thorn. Step 3: Mountains: by altitude. Step 4: Deltas with tides: mangroves."
      real_world: "Teak from Nilambur in Kerala, grown in moist deciduous forest, has been prized for shipbuilding and furniture for centuries. Silent Valley in the Western Ghats is a protected tropical evergreen forest."
    picture:
      kind: compare
      columns:
      - title: Over 200 cm of rain
        points: [Tropical evergreen forest, 'Ebony, mahogany, rosewood']
      - title: 70 to 200 cm
        points: [Tropical deciduous forest, 'Teak, sal, bamboo']
      - title: Under 70 cm
        points: [Thorn forest and scrub, 'Acacia, khair, cactus']
      alt: 'More rain, thicker forest: over 200 cm gives evergreen forest, 70 to 200 cm deciduous forest, and under 70 cm thorn forest and scrub.'
    items:
      - prompt: "Tropical evergreen forests grow where rainfall is more than how many cm?"
        answer: "200"
        check: "200"
        difficulty: 1
        hints: ["Very heavy rain.", "Two metres."]
        solution: "They need more than 200 cm of rain."
        mistakes: {"70": forest_types_rain}
      - prompt: "Which is the most widespread forest type in India?"
        options: ["Tropical deciduous", "Tropical evergreen", "Mangrove", "Montane"]
        answer: "Tropical deciduous"
        difficulty: 1
        hints: ["Also called monsoon forests.", "Teak and sal."]
        solution: "Tropical deciduous (monsoon) forests are the most widespread."
      - prompt: "Which tree is typical of the mangrove forests of the Ganga–Brahmaputra delta?"
        options: ["Sundari", "Teak", "Deodar", "Babool"]
        answer: "Sundari"
        difficulty: 2
        hints: ["The Sundarbans are named after it.", "Hard, durable wood."]
        solution: "The Sundari tree gives the Sundarbans their name."
        mistakes: {"Teak": mangrove_delta}
      - prompt: "Thorn forests and scrubs grow where rainfall is less than how many cm?"
        answer: "70"
        check: "70"
        difficulty: 2
        hints: ["Dry regions.", "Below the deciduous range."]
        solution: "They grow where rainfall is below 70 cm."
        mistakes: {"200": forest_types_rain}
      - prompt: "Teak and sal are typical of which forest type?"
        options: ["Tropical deciduous", "Tropical evergreen", "Thorn", "Mangrove"]
        answer: "Tropical deciduous"
        difficulty: 1
        hints: ["They shed leaves in the dry season.", "Monsoon forests."]
        solution: "Teak and sal grow in tropical deciduous forests."
      - prompt: "About how many plant species does India have?"
        answer: "47000"
        check: "47000"
        difficulty: 3
        hints: ["Tens of thousands.", "Just under 50,000."]
        solution: "India has about 47,000 plant species."

  - code: cbse9ss.veg.wildlife
    title: Wildlife and its protection
    after: [cbse9ss.veg.types]
    notes: |
      India has about 90,000 animal species, about 2,000 bird species (13% of world), 2,546 fish species.
      Elephants in Assam, Karnataka, Kerala; one-horned rhinoceros in Assam and West Bengal swamps; Asiatic
      lion only in Gir forest (Gujarat); tigers in Madhya Pradesh, Sundarbans, Himalayan region; wild ass in
      the Rann of Kutch. Threats: hunting, pollution, habitat loss. Protection: 18 biosphere reserves (12 in
      UNESCO's World Network, e.g. Nilgiri, Sundarbans, Gulf of Mannar, Nanda Devi), national parks,
      wildlife sanctuaries, Project Tiger, Project Rhino, etc. Medicinal plants: sarpagandha, neem, tulsi.
    explanations:
      text: "India's wildlife is rich: elephants in Kerala and Karnataka, one-horned rhinos in Assam, the last Asiatic lions in Gujarat's Gir forest, and tigers across many states. Hunting and loss of forests have pushed many species towards extinction, so India set up biosphere reserves, national parks, sanctuaries and projects like Project Tiger."
      visual: "Draw a map of India with animal icons: lion in Gujarat, rhino in Assam, elephant in Kerala, tiger in the Sundarbans, wild ass in Kutch. Circle a few areas in green labelled 'biosphere reserve'."
      step_by_step: "Step 1: Match the animal to its home: lion–Gir, rhino–Assam, wild ass–Rann of Kutch, elephant–Kerala/Karnataka/Assam. Step 2: Identify threats: hunting, habitat loss, pollution. Step 3: Name protections: reserves, parks, sanctuaries, special projects."
      real_world: "The Nilgiri Biosphere Reserve covers parts of Kerala, Karnataka and Tamil Nadu, and was the first in India to join UNESCO's network. Periyar Tiger Reserve in Kerala protects tigers and elephants."
    items:
      - prompt: "The Asiatic lion is found in the wild only in…"
        options: ["Gir forest, Gujarat", "Sundarbans", "Kaziranga", "Periyar"]
        answer: "Gir forest, Gujarat"
        difficulty: 1
        hints: ["Western India.", "Gujarat."]
        solution: "Asiatic lions live only in the Gir forest."
      - prompt: "Where is the one-horned rhinoceros mainly found?"
        options: ["Assam and West Bengal", "Rajasthan", "Kerala", "Ladakh"]
        answer: "Assam and West Bengal"
        difficulty: 1
        hints: ["Swampy grasslands.", "Kaziranga National Park."]
        solution: "One-horned rhinos live in the swamps of Assam and West Bengal."
      - prompt: "How many biosphere reserves does India have, according to NCERT?"
        answer: "18"
        check: "18"
        difficulty: 2
        hints: ["Between 15 and 20.", "12 are in UNESCO's network."]
        solution: "India has 18 biosphere reserves."
      - prompt: "The Indian wild ass lives in…"
        options: ["Rann of Kutch", "Western Ghats", "Sundarbans", "Kashmir valley"]
        answer: "Rann of Kutch"
        difficulty: 2
        hints: ["A salty desert.", "In Gujarat."]
        solution: "The wild ass is found in the Rann of Kutch."
      - prompt: "About what percentage of the world's bird species are found in India?"
        answer: "13"
        check: "13"
        difficulty: 3
        hints: ["About 2,000 species.", "Between 10 and 15."]
        solution: "India has about 13% of the world's bird species."
      - prompt: "Which of these protects a whole ecosystem, allowing people to live in its outer zones?"
        options: ["Biosphere reserve", "Zoo", "Botanical garden", "Fish farm"]
        answer: "Biosphere reserve"
        difficulty: 2
        hints: ["It has a core, a buffer and a transition zone.", "Nilgiri is one."]
        solution: "A biosphere reserve protects an entire ecosystem with human use allowed in outer zones."
        mistakes: {"Zoo": biosphere_vs_park}
