# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 5. Format: content/README.md.
subject: cbse9-ss
chapter: 5
title: State and Society up to 1000 CE
tips:
  janapada_terms: Jana was a tribe or people; janapada the land where a jana settled; mahajanapadas were the sixteen large states of about the 6th century BCE.
  c9ss5_jana_word: Break the word down. The same root is in janata and janapada. Is it about money, buildings, or human beings?
  monarchy_republic: In a monarchy a king rules, usually by birth; in a gana-sangha (republic) a group of leaders decided together in an assembly, as among the Vajjis and Shakyas.
  s9_crop_tax: "Most people farmed. What could the king take a share of every season?"
  s9_guild_bank: "Guilds handled a lot of money. What could they do with deposits, like a bank does?"
  s9_kautilya: "Kalidasa was a poet and Megasthenes a Greek visitor. Who was the adviser who wrote on statecraft?"
  s9_magadha: "Which kingdom, in present-day Bihar, grew into the Mauryan empire?"
  s9_muziris: "Lothal is a Harappan port in Gujarat. Which port was on the Kerala coast?"
  s9_rajadharma: "Dharma means duty. What would a king owe his people first?"
  s9_sabha_samiti: "Lok Sabha and Rajya Sabha are today's Parliament. What were the Vedic assemblies called?"
  s9_saptanga: "The seven limbs are parts of running a state: king, ministers, land, fort, treasury, army, ally. Which choice is not one of them?"
  s9_shreni: "Viharas were for monks and sabhas were assemblies. What were craft and trade groups called?"
  s9_sixteen: "Buddhist and Jain texts list the mahajanapadas. The number is between 15 and 17."
  c9ss5_ruler_match: Place the clue in time first. Was it the age of the early kingdoms, the first big empire, or a later one? Then think which name fits that age.
  c9ss5_assembly_rule: Ask who made the decisions. Was it one king who ruled by birth, or a group of leaders meeting in an assembly?
  pqc9ss5_one_or_many: Did one ruler decide, or did many leaders decide together in an assembly?
concepts:
- code: cbse9us.state.janapadas
  title: From janas to mahajanapadas, kings and republics
  notes: |
    Early political life was based on kinship: the jana (tribe or people) and kula (family). In the Vedic
    period the raja was a leader in war, advised by assemblies called the sabha and samiti. As people settled
    and farmed, the land of a jana became a janapada. By about the 6th century BCE there were sixteen
    mahajanapadas such as Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara and the Vajji
    confederacy. Some were monarchies ruled by kings; others were gana-sanghas (republics) where many leaders
    met in an assembly (the Vajjis with their capital at Vaishali, the Shakyas of the Buddha). Magadha, with
    fertile land, iron ores, rivers and able rulers (Bimbisara, Ajatashatru), grew into the most powerful.
    Kings were expected to follow dharma (rajadharma): to protect the people, keep order and be just.
    Later the Mauryas (Chandragupta, Ashoka) and the Guptas built large empires; Ashoka's edicts spoke of
    dhamma and the welfare of all. In the south, the Cholas, Cheras and Pandyas, and later the Pallavas and
    Chalukyas, ruled.
  explanations:
    text: Picture a tribe (jana) settling on land; that land becomes its janapada. Over time some janapadas grew into sixteen big states, the mahajanapadas. Some were ruled by a king, others by a council that decided together, an early kind of republic.
    visual: 'Draw a ladder: family (kula) → tribe (jana) → its land (janapada) → big state (mahajanapada) → empire (Mauryas). Beside the mahajanapada step, draw two pictures: a king on a throne (monarchy) and a circle of leaders talking (gana-sangha).'
    step_by_step: 'Step 1: Who rules? One king → monarchy; a council → gana-sangha. Step 2: How big? Tribe land → janapada; large state → mahajanapada. Step 3: Magadha grew strongest thanks to land, iron, rivers and rulers.'
    real_world: Vaishali in Bihar, capital of the Vajji gana-sangha, is often called one of the world's earliest republics.
  picture:
    kind: flow
    steps:
    - Kula (family)
    - Jana (tribe)
    - Janapada (land of a jana)
    - Mahajanapada (large state)
    - Empire (Mauryas)
    alt: How political units grew in early India from family and tribe to janapada, mahajanapada and empire.
  activity:
    type: sort
    prompt: Monarchy or gana-sangha (republic)?
    bins:
    - Monarchy
    - Gana-sangha
    items:
    - label: Magadha under Bimbisara
      bin: Monarchy
      clue: One king.
      why: Monarchy.
    - label: Vajjis with capital at Vaishali
      bin: Gana-sangha
      clue: Many leaders in an assembly.
      why: Gana-sangha.
    - label: The Shakyas, the Buddha's people
      bin: Gana-sangha
      clue: Assembly rule.
      why: Gana-sangha.
    - label: Kosala
      bin: Monarchy
      clue: Ruled by a king.
      why: Monarchy.
    - label: Avanti
      bin: Monarchy
      clue: A king.
      why: Monarchy.
  lesson:
    - teach: 'Early political life rested on kinship: the jana (a people or tribe) and the kula (family). In the Vedic period the raja led in war and was advised by two assemblies, the sabha and the samiti. When a jana settled and farmed, its land became a janapada.'
      check:
        prompt: What was a janapada?
        options:
        - The land where a jana settled
        - A kind of tax
        - A temple
        answer: The land where a jana settled
        why: '''Pada'' is foot: where a people set foot and stayed.'
      ways:
      - style: visual
        teach: How early political units grew from family to territory.
        picture:
          kind: flow
          steps:
          - 'kula: family'
          - 'jana: a people'
          - 'janapada: land of a jana'
          - 'mahajanapada: big state'
          alt: Families, the kula, formed a people, the jana; when a jana settled, its land became a janapada; the largest became mahajanapadas.
      - style: real_world
        teach: 'Many Indian place names keep these old ideas: ''pada'' means foot, so a janapada is where a jana set foot and settled. The raja led in war, but the sabha and samiti assemblies advised him.'
    - teach: 'By about the 6th century BCE there were sixteen big states, the mahajanapadas: Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara, the Vajji confederacy and others. Some were monarchies ruled by a king; others were gana-sanghas, where many leaders decided together in an assembly, like the Vajjis of Vaishali.'
      picture:
        kind: compare
        columns:
        - title: Monarchy
          points:
          - One king rules
          - Power often passed by birth
          - 'Example: Magadha'
        - title: Gana-sangha
          points:
          - Many leaders in an assembly
          - Decisions by discussion
          - 'Example: Vajjis of Vaishali'
        alt: A monarchy ruled by one king compared with a gana-sangha ruled by an assembly.
      check:
        prompt: The Vajjis were ruled by…
        options:
        - An assembly of leaders
        - A single emperor
        - Priests only
        answer: An assembly of leaders
        why: They were a gana-sangha.
      ways:
      - style: visual
        teach: Two ways of ruling among the mahajanapadas.
        picture:
          kind: compare
          columns:
          - title: Monarchy
            points:
            - one king rules
            - Magadha, Kosala
          - title: Gana-sangha
            points:
            - many leaders decide together
            - Vajji confederacy
          alt: In a monarchy like Magadha or Kosala one king ruled; in a gana-sangha like the Vajji confederacy many leaders decided together in an assembly.
      - style: step_by_step
        teach: 'Step 1: Around the 6th century BCE, sixteen big states appear in Buddhist and Jain texts. Step 2: Ask who decides. Step 3: One king? Monarchy. Step 4: An assembly of many leaders? Gana-sangha.'
    - teach: 'Magadha, with fertile land, iron ore, rivers for transport and strong kings like Bimbisara and Ajatashatru, became the most powerful mahajanapada. It grew into the Mauryan empire under Chandragupta and Ashoka, whose edicts spoke of dhamma and the welfare of all. Kings were expected to follow rajadharma: protect the people and rule justly.'
      check:
        prompt: Which helped Magadha grow strong?
        options:
        - Iron ore and fertile land
        - Deserts all around
        - No rivers
        answer: Iron ore and fertile land
        why: Iron made tools and weapons; fertile land fed a large population.
      ways:
      - style: visual
        teach: The reasons Magadha grew more powerful than its rivals.
        picture:
          kind: compare
          columns:
          - title: Land and resources
            points:
            - fertile soil
            - iron ore
            - rivers for transport
          - title: Leaders
            points:
            - Bimbisara
            - Ajatashatru
            - later the Mauryas
          alt: Magadha had fertile land, iron ore and rivers, and strong rulers like Bimbisara and Ajatashatru, leading to the Mauryan empire.
      - style: step_by_step
        teach: 'Step 1: Fertile land → more crops and taxes. Step 2: Iron → tools and weapons. Step 3: Rivers → transport and defence. Step 4: Strong kings used these to expand. Magadha became the Mauryan empire under Chandragupta and Ashoka.'
  items:
  - prompt: How many mahajanapadas are mentioned in early Buddhist and Jain texts?
    answer: '16'
    check: '16'
    difficulty: 1
    hints:
    - Between ten and twenty.
    - Magadha, Kosala, Vatsa, Avanti and more.
    solution: 'Step 1: The texts list sixteen great states. Step 2: Answer: 16.'
    mistakes: {"18": "s9_sixteen", "12": "s9_sixteen"}
  - prompt: Which mahajanapada became the most powerful?
    options:
    - Magadha
    - Gandhara
    - Kuru
    - Vatsa
    answer: Magadha
    difficulty: 1
    hints:
    - In present-day Bihar.
    - Bimbisara and Ajatashatru ruled it.
    solution: 'Step 1: Fertile land, iron, rivers and strong rulers helped it. Step 2: Magadha became the strongest.'
    mistakes: {"Kuru": "s9_magadha", "Gandhara": "s9_magadha"}
  - prompt: The Vedic assemblies that advised the raja were the…
    options:
    - Sabha and samiti
    - Lok Sabha and Rajya Sabha
    - Gram sabha and panchayat
    - Sangha and vihara
    answer: Sabha and samiti
    difficulty: 1
    hints:
    - Mentioned in the Vedas.
    - Not modern Parliament.
    solution: 'Step 1: Vedic texts mention two assemblies. Step 2: They were the sabha and samiti.'
    mistakes: {"Lok Sabha and Rajya Sabha": "s9_sabha_samiti"}
  - prompt: How was a gana-sangha different from a monarchy?
    options:
    - "Many leaders decided together in an assembly"
    - "A single king ruled, and his son ruled after him"
    - "It had no rules or leaders of any kind"
    - "Priests alone ruled it, without any assembly"
    answer: Many leaders decided together in an assembly
    difficulty: 2
    hints:
    - Gana means many.
    - The Vajjis of Vaishali.
    solution: 'Step 1: In a monarchy one king rules. Step 2: In a gana-sangha a group of leaders discussed and decided together.'
    mistakes:
      "A single king ruled, and his son ruled after him": monarchy_republic
  - prompt: What does 'janapada' literally mean?
    options:
    - "The land where a jana (people) set foot and settled"
    - "A large empire ruled by an emperor from his capital"
    - "A group of monks who lived together in a monastery"
    - "A royal palace where the king lived with his court"
    answer: The land where a jana (people) set foot and settled
    difficulty: 2
    hints:
    - Jana = people, pada = foot.
    - Land of a tribe.
    solution: 'Step 1: Jana means people; pada means foot. Step 2: A janapada is the land where a people settled.'
    mistakes:
      "A large empire ruled by an emperor from his capital": janapada_terms
  - prompt: According to the idea of rajadharma, what was a king's first duty?
    options:
    - To protect the people and rule justly
    - To build the largest palace
    - To collect as much tax as possible
    - To avoid all advisers
    answer: To protect the people and rule justly
    difficulty: 2
    hints:
    - Dharma means duty and right conduct.
    - The welfare of subjects.
    solution: 'Step 1: Rajadharma is the duty of the ruler. Step 2: It centres on protecting the people and keeping justice.'
    mistakes: {"To collect as much tax as possible": "s9_rajadharma"}
  - prompt: In Vedic times, a jana was…
    options:
    - A tribe or people
    - A coin
    - A temple
    - A tax
    answer: A tribe or people
    difficulty: 1
    hints:
    - It is the root of 'janapada'.
    - Think of the word janata.
    solution: A jana was a people or tribe linked by kinship.
    mistakes:
      A coin: c9ss5_jana_word
  - prompt: Which of these was a gana-sangha (republic)?
    options:
    - The Vajjis
    - Magadha
    - Kosala
    - Avanti
    answer: The Vajjis
    difficulty: 1
    hints:
    - Their capital was Vaishali.
    - Many leaders ruled together.
    solution: The Vajji confederacy was a gana-sangha.
    mistakes:
      Magadha: c9ss5_assembly_rule
  - prompt: Which emperor's edicts spoke of dhamma and the welfare of all?
    options:
    - Ashoka
    - Bimbisara
    - Chandragupta Maurya
    - Ajatashatru
    answer: Ashoka
    difficulty: 1
    hints:
    - He changed after the Kalinga war.
    - His edicts are on rocks and pillars.
    solution: Ashoka's edicts spread his message of dhamma.
    mistakes:
      Chandragupta Maurya: c9ss5_ruler_match
  - prompt: Which was the capital of the Vajji confederacy?
    options:
    - Vaishali
    - Pataliputra
    - Ujjain
    - Taxila
    answer: Vaishali
    difficulty: 2
    hints:
    - It is in north Bihar.
    - Pataliputra was Magadha's.
    solution: Vaishali was the Vajji capital.
    mistakes:
      Pataliputra: s9_magadha
  - prompt: Bimbisara and Ajatashatru were kings of…
    options:
    - Magadha
    - Kosala
    - Avanti
    - Gandhara
    answer: Magadha
    difficulty: 2
    hints:
    - They built up the kingdom that became the Mauryan empire.
    - Present-day Bihar.
    solution: Both were early kings of Magadha.
    mistakes:
      Kosala: c9ss5_ruler_match
  - prompt: The Buddha belonged to which gana-sangha?
    options:
    - The Shakyas
    - The Mauryas
    - The Guptas
    - The Cholas
    answer: The Shakyas
    difficulty: 2
    hints:
    - He is called Shakyamuni.
    - It was a republic, not an empire.
    solution: Siddhartha Gautama was born among the Shakyas.
    mistakes:
      The Mauryas: monarchy_republic
  - prompt: Which three kingdoms ruled in the far south in early times?
    options:
    - Cholas, Cheras and Pandyas
    - Mauryas, Guptas and Kushanas
    - Kosala, Vatsa and Avanti
    - Vajjis, Shakyas and Mallas
    answer: Cholas, Cheras and Pandyas
    difficulty: 2
    hints:
    - Sangam poems mention them.
    - The Cheras ruled Kerala.
    solution: The Cholas, Cheras and Pandyas ruled the far south.
    mistakes:
      Mauryas, Guptas and Kushanas: c9ss5_ruler_match
  - prompt: How did the sabha and samiti limit a raja's power?
    options:
    - "The raja had to consult them on important matters"
    - "They chose all the priests for the kingdom"
    - "They collected all the taxes for the raja"
    - "They had no real role in the kingdom"
    answer: The raja had to consult them on important matters
    difficulty: 3
    hints:
    - They were assemblies.
    - Advice and discussion.
    solution: The raja sought their advice, so he did not rule alone.
    mistakes:
      "They had no real role in the kingdom": s9_sabha_samiti
  - prompt: Why might a gana-sangha make slower decisions than a monarchy?
    options:
    - "Many leaders had to discuss and agree"
    - "It had no army to carry out decisions"
    - "It had no land of its own to govern"
    - "Its leaders were only young children"
    answer: Many leaders had to discuss and agree
    difficulty: 3
    hints:
    - Think about a meeting versus one person deciding.
    - Discussion takes time.
    solution: Decisions needed debate and agreement among many, while a king could decide alone.
    mistakes:
      "It had no army to carry out decisions": monarchy_republic
  - prompt: 'Assertion (A): The Vajji confederacy was a gana-sangha.

      Reason (R): In a gana-sangha, many leaders took decisions together in an assembly.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The Vajjis were ruled by an assembly of leaders, which is what makes a gana-sangha, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: A historian reads that in one ancient state, ''the elders met in the hall and decided by discussion''. What kind of state was this most likely?'
    options:
    - A gana-sangha
    - A monarchy
    - An empire ruled by one emperor
    answer: A gana-sangha
    hints:
    - Who is making decisions here?
    - Was it one person or many?
    solution: Many leaders deciding together in an assembly describes a gana-sangha.
    mistakes:
      A monarchy: pqc9ss5_one_or_many
      An empire ruled by one emperor: pqc9ss5_one_or_many
    exam: case
    difficulty: 2
- code: cbse9us.state.society_economy
  title: Society, administration and trade up to 1000 CE
  notes: |
    As states grew, kings needed ministers, officials, taxes and armies. Kautilya's Arthashastra (linked with
    Chandragupta Maurya) describes ministers (mantri-parishad), tax collection, spies, treasury and the
    saptanga (seven limbs) of the state: king, ministers, territory, fort, treasury, army and ally. Taxes
    were mostly a share of the crop (often one-sixth, bhaga). Vedic society had varnas, and over time many
    occupation-based groups (jatis) formed; texts also show debates about birth and merit, and new ideas of
    the Buddha and Mahavira who welcomed people of all backgrounds. The economy rested on farming with iron
    ploughshares and irrigation, crafts and trade. Merchants and craftspeople formed guilds (shreni) that set
    rules, trained workers, acted like banks and donated to temples and monasteries. Punch-marked coins came
    into use. Trade routes such as the Uttarapatha and Dakshinapatha, and sea trade with Rome and Southeast
    Asia (Muziris on the Kerala coast, Arikamedu) brought pepper, spices, textiles and gold.
  explanations:
    text: A growing kingdom needs money and people to run it. Kings collected a share of the harvest as tax and appointed ministers. Craftspeople and traders organised themselves into guilds, a bit like today's trade associations, and goods travelled along great roads and across the sea, even to Rome.
    visual: Draw a king in the centre with arrows to ministers, army and treasury. Below, draw a weavers' guild hall and a road leading to a port called Muziris with ships carrying pepper towards Rome.
    step_by_step: 'Step 1: Who runs the state? King, ministers, officials (Arthashastra). Step 2: Where does the money come from? Taxes, mainly a share of crops. Step 3: Who organises crafts and trade? Guilds (shreni). Step 4: Where does trade go? Land routes and sea ports.'
    real_world: Excavations at Pattanam near Kodungallur in Kerala, thought to be ancient Muziris, have found Roman pottery and coins from about 2,000 years ago.
  picture:
    kind: flow
    steps:
    - Farmers grow crops
    - Share paid as tax (bhaga)
    - Treasury pays officials, army
    - Guilds organise crafts
    - Traders carry goods by land and sea
    alt: How farming, taxes, guilds and trade supported early Indian states.
  activity:
    type: sort
    prompt: 'Kautilya''s saptanga: which limb of the state?'
    bins:
    - King
    - Treasury
    - Army
    - Ally
    items:
    - label: The ruler who follows rajadharma
      bin: King
      clue: The head.
      why: King.
    - label: Taxes collected as one-sixth of the crop
      bin: Treasury
      clue: Where money goes.
      why: Treasury.
    - label: Soldiers and elephants
      bin: Army
      clue: Defence.
      why: Army.
    - label: A friendly neighbouring king
      bin: Ally
      clue: Outside help.
      why: Ally.
    - label: Punch-marked coins stored safely
      bin: Treasury
      clue: Wealth.
      why: Treasury.
  lesson:
    - teach: 'As states grew, kings needed ministers, officials, taxes and armies. Kautilya''s Arthashastra, linked with Chandragupta Maurya, describes how to run a state: a council of ministers, tax collectors, spies and a treasury. It names seven limbs (saptanga) of the state: king, ministers, territory, fort, treasury, army and ally.'
      check:
        prompt: Which is one of the seven limbs of the state?
        options:
        - Treasury
        - Temple
        - Market
        answer: Treasury
        why: King, ministers, territory, fort, treasury, army, ally.
      ways:
      - style: visual
        teach: The seven limbs of the state, as listed in the Arthashastra.
        picture:
          kind: flow
          steps:
          - king
          - ministers
          - territory
          - fort
          - treasury
          - army
          - ally
          alt: The Arthashastra's seven limbs of the state are the king, ministers, territory, fort, treasury, army and ally.
      - style: real_world
        teach: 'A school also needs ''limbs'' to run: a principal, staff, a campus, a boundary wall, a budget, security and partner schools. Kautilya described a state the same way, as parts that must all work together.'
    - teach: Most people farmed, so the king's main income was a share of the crop, often one-sixth (bhaga). Iron ploughs and irrigation increased harvests. Society had varnas and many occupation-based jatis; the Buddha and Mahavira welcomed people of all backgrounds.
      check:
        prompt: What share of the crop was often taken as tax?
        options:
        - One-sixth
        - One-half
        - All of it
        answer: One-sixth
        why: The tax called bhaga was often a sixth.
      ways:
      - style: step_by_step
        teach: 'Step 1: Most people farmed. Step 2: The king took a share of the crop, often one-sixth (bhaga). Step 3: Iron ploughs and irrigation raised harvests, so taxes grew too. Step 4: Society had varnas and many jatis based on work.'
      - style: visual
        teach: A farmer's harvest split between the family and the king's share.
        picture:
          kind: bars
          bars:
          - label: farmer keeps
            value: 5
          - label: king's share (bhaga)
            value: 1
          alt: Out of six parts of the harvest, the farmer kept five and one part, one-sixth, went to the king as tax.
    - teach: 'Craftspeople and merchants formed guilds (shrenis) that set rules, trained workers, kept deposits and lent money like banks, and gave gifts to monasteries and temples. Punch-marked coins came into use. Trade routes crossed the land (Uttarapatha, Dakshinapatha) and the sea: pepper and spices went from Muziris in Kerala to Rome.'
      picture:
        kind: flow
        steps:
        - Farmers grow surplus
        - Craftspeople make goods
        - Guilds organise and finance
        - Merchants trade by land and sea
        - Pepper from Muziris reaches Rome
        alt: How farming surplus, crafts, guilds and trade linked early India's economy to Rome.
      check:
        prompt: What did guilds do besides organising crafts?
        options:
        - Kept deposits and lent money
        - Ruled kingdoms
        - Wrote the Vedas
        answer: Kept deposits and lent money
        why: They acted like early banks.
      ways:
      - style: step_by_step
        teach: 'Step 1: Craftspeople and merchants joined guilds (shrenis). Step 2: Guilds set rules and trained workers. Step 3: They kept deposits and lent money, like banks. Step 4: Punch-marked coins made trade easier.'
      - style: real_world
        teach: 'Romans prized Kerala''s black pepper. Ships sailed from Muziris carrying pepper and spices, and Roman gold coins have been found in south India: evidence of trade across the sea about 2000 years ago.'
  items:
  - prompt: The Arthashastra, a text on statecraft, is linked with…
    options:
    - Kautilya
    - Kalidasa
    - Ashoka
    - Megasthenes
    answer: Kautilya
    difficulty: 1
    hints:
    - Also called Chanakya.
    - Adviser to Chandragupta Maurya.
    solution: 'Step 1: The Arthashastra deals with government and economy. Step 2: It is credited to Kautilya (Chanakya).'
    mistakes: {"Megasthenes": "s9_kautilya", "Kalidasa": "s9_kautilya"}
  - prompt: Associations of craftspeople and merchants in early India were called…
    options:
    - Shrenis (guilds)
    - Sabhas
    - Viharas
    - Janapadas
    answer: Shrenis (guilds)
    difficulty: 1
    hints:
    - Like trade associations.
    - They also acted like banks.
    solution: 'Step 1: Craftspeople and traders grouped together. Step 2: These groups were shrenis, or guilds.'
    mistakes: {"Janapadas": "s9_shreni", "Viharas": "s9_shreni"}
  - prompt: Which ancient port on the Kerala coast traded pepper with Rome?
    options:
    - Muziris
