# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 5. Format: content/README.md.
subject: cbse9-ss
chapter: 5
title: State and Society up to 1000 CE
tips:
  janapada_terms: Jana was a tribe or people; janapada the land where a jana settled; mahajanapadas were the sixteen large states of about the 6th century BCE.
  monarchy_republic: In a monarchy a king rules, usually by birth; in a gana-sangha (republic) a group of leaders decided together in an assembly, as among the Vajjis and Shakyas.
concepts:
- code: cbse9us.state.janapadas
  title: From janas to mahajanapadas, kings and republics
  notes: |
    Early political life was based on kinship: the jana (tribe or people) and kula (family). In the Vedic
    period the raja was a leader in war, advised by assemblies called the sabha and samiti. As people settled
    and farmed, the land of a jana became a janapada. By about the 6th century BCE there were sixteen
    mahajanapadas such as Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara and the Vajji
    confederacy. Some were monarchies ruled by kings; others were gana-sanghas (republics) where many leaders
    met in an assembly (the Vajjis with their capital at Vaishali, the Shakyas of the Buddha). Magadha, with
    fertile land, iron ores, rivers and able rulers (Bimbisara, Ajatashatru), grew into the most powerful.
    Kings were expected to follow dharma (rajadharma): to protect the people, keep order and be just.
    Later the Mauryas (Chandragupta, Ashoka) and the Guptas built large empires; Ashoka's edicts spoke of
    dhamma and the welfare of all. In the south, the Cholas, Cheras and Pandyas, and later the Pallavas and
    Chalukyas, ruled.
  explanations:
    text: Picture a tribe (jana) settling on land; that land becomes its janapada. Over time some janapadas grew into sixteen big states, the mahajanapadas. Some were ruled by a king, others by a council that decided together, an early kind of republic.
    visual: 'Draw a ladder: family (kula) → tribe (jana) → its land (janapada) → big state (mahajanapada) → empire (Mauryas). Beside the mahajanapada step, draw two pictures: a king on a throne (monarchy) and a circle of leaders talking (gana-sangha).'
    step_by_step: 'Step 1: Who rules? One king → monarchy; a council → gana-sangha. Step 2: How big? Tribe land → janapada; large state → mahajanapada. Step 3: Magadha grew strongest thanks to land, iron, rivers and rulers.'
    real_world: Vaishali in Bihar, capital of the Vajji gana-sangha, is often called one of the world's earliest republics.
  picture:
    kind: flow
    steps:
    - Kula (family)
    - Jana (tribe)
    - Janapada (land of a jana)
    - Mahajanapada (large state)
    - Empire (Mauryas)
    alt: How political units grew in early India from family and tribe to janapada, mahajanapada and empire.
  activity:
    type: sort
    prompt: Monarchy or gana-sangha (republic)?
    bins:
    - Monarchy
    - Gana-sangha
    items:
    - label: Magadha under Bimbisara
      bin: Monarchy
      clue: One king.
      why: Monarchy.
    - label: Vajjis with capital at Vaishali
      bin: Gana-sangha
      clue: Many leaders in an assembly.
      why: Gana-sangha.
    - label: The Shakyas, the Buddha's people
      bin: Gana-sangha
      clue: Assembly rule.
      why: Gana-sangha.
    - label: Kosala
      bin: Monarchy
      clue: Ruled by a king.
      why: Monarchy.
    - label: Avanti
      bin: Monarchy
      clue: A king.
      why: Monarchy.
  items:
  - prompt: How many mahajanapadas are mentioned in early Buddhist and Jain texts?
    answer: '16'
    check: '16'
    difficulty: 1
    hints:
    - Between ten and twenty.
    - Magadha, Kosala, Vatsa, Avanti and more.
    solution: 'Step 1: The texts list sixteen great states. Step 2: Answer: 16.'
  - prompt: Which mahajanapada became the most powerful?
    options:
    - Magadha
    - Gandhara
    - Kuru
    - Vatsa
    answer: Magadha
    difficulty: 1
    hints:
    - In present-day Bihar.
    - Bimbisara and Ajatashatru ruled it.
    solution: 'Step 1: Fertile land, iron, rivers and strong rulers helped it. Step 2: Magadha became the strongest.'
  - prompt: The Vedic assemblies that advised the raja were the…
    options:
    - Sabha and samiti
    - Lok Sabha and Rajya Sabha
    - Gram sabha and panchayat
    - Sangha and vihara
    answer: Sabha and samiti
    difficulty: 1
    hints:
    - Mentioned in the Vedas.
    - Not modern Parliament.
    solution: 'Step 1: Vedic texts mention two assemblies. Step 2: They were the sabha and samiti.'
  - prompt: How was a gana-sangha different from a monarchy?
    options:
    - Many leaders decided together in an assembly
    - A single king ruled by birth
    - It had no rules
    - Priests alone ruled it
    answer: Many leaders decided together in an assembly
    difficulty: 2
    hints:
    - Gana means many.
    - The Vajjis of Vaishali.
    solution: 'Step 1: In a monarchy one king rules. Step 2: In a gana-sangha a group of leaders discussed and decided together.'
    mistakes:
      A single king ruled by birth: monarchy_republic
  - prompt: What does 'janapada' literally mean?
    options:
    - The land where a jana (people) set foot and settled
    - A large empire
    - A group of monks
    - A royal palace
    answer: The land where a jana (people) set foot and settled
    difficulty: 2
    hints:
    - Jana = people, pada = foot.
    - Land of a tribe.
    solution: 'Step 1: Jana means people; pada means foot. Step 2: A janapada is the land where a people settled.'
    mistakes:
      A large empire: janapada_terms
  - prompt: According to the idea of rajadharma, what was a king's first duty?
    options:
    - To protect the people and rule justly
    - To build the largest palace
    - To collect as much tax as possible
    - To avoid all advisers
    answer: To protect the people and rule justly
    difficulty: 2
    hints:
    - Dharma means duty and right conduct.
    - The welfare of subjects.
    solution: 'Step 1: Rajadharma is the duty of the ruler. Step 2: It centres on protecting the people and keeping justice.'
- code: cbse9us.state.society_economy
  title: Society, administration and trade up to 1000 CE
  notes: |
    As states grew, kings needed ministers, officials, taxes and armies. Kautilya's Arthashastra (linked with
    Chandragupta Maurya) describes ministers (mantri-parishad), tax collection, spies, treasury and the
    saptanga (seven limbs) of the state: king, ministers, territory, fort, treasury, army and ally. Taxes
    were mostly a share of the crop (often one-sixth, bhaga). Vedic society had varnas, and over time many
    occupation-based groups (jatis) formed; texts also show debates about birth and merit, and new ideas of
    the Buddha and Mahavira who welcomed people of all backgrounds. The economy rested on farming with iron
    ploughshares and irrigation, crafts and trade. Merchants and craftspeople formed guilds (shreni) that set
    rules, trained workers, acted like banks and donated to temples and monasteries. Punch-marked coins came
    into use. Trade routes such as the Uttarapatha and Dakshinapatha, and sea trade with Rome and Southeast
    Asia (Muziris on the Kerala coast, Arikamedu) brought pepper, spices, textiles and gold.
  explanations:
    text: A growing kingdom needs money and people to run it. Kings collected a share of the harvest as tax and appointed ministers. Craftspeople and traders organised themselves into guilds, a bit like today's trade associations, and goods travelled along great roads and across the sea, even to Rome.
    visual: Draw a king in the centre with arrows to ministers, army and treasury. Below, draw a weavers' guild hall and a road leading to a port called Muziris with ships carrying pepper towards Rome.
    step_by_step: 'Step 1: Who runs the state? King, ministers, officials (Arthashastra). Step 2: Where does the money come from? Taxes, mainly a share of crops. Step 3: Who organises crafts and trade? Guilds (shreni). Step 4: Where does trade go? Land routes and sea ports.'
    real_world: Excavations at Pattanam near Kodungallur in Kerala, thought to be ancient Muziris, have found Roman pottery and coins from about 2,000 years ago.
  picture:
    kind: flow
    steps:
    - Farmers grow crops
    - Share paid as tax (bhaga)
    - Treasury pays officials, army
    - Guilds organise crafts
    - Traders carry goods by land and sea
    alt: How farming, taxes, guilds and trade supported early Indian states.
  activity:
    type: sort
    prompt: 'Kautilya''s saptanga: which limb of the state?'
    bins:
    - King
    - Treasury
    - Army
    - Ally
    items:
    - label: The ruler who follows rajadharma
      bin: King
      clue: The head.
      why: King.
    - label: Taxes collected as one-sixth of the crop
      bin: Treasury
      clue: Where money goes.
      why: Treasury.
    - label: Soldiers and elephants
      bin: Army
      clue: Defence.
      why: Army.
    - label: A friendly neighbouring king
      bin: Ally
      clue: Outside help.
      why: Ally.
    - label: Punch-marked coins stored safely
      bin: Treasury
      clue: Wealth.
      why: Treasury.
  items:
  - prompt: The Arthashastra, a text on statecraft, is linked with…
    options:
    - Kautilya
    - Kalidasa
    - Ashoka
    - Megasthenes
    answer: Kautilya
    difficulty: 1
    hints:
    - Also called Chanakya.
    - Adviser to Chandragupta Maurya.
    solution: 'Step 1: The Arthashastra deals with government and economy. Step 2: It is credited to Kautilya (Chanakya).'
  - prompt: Associations of craftspeople and merchants in early India were called…
    options:
    - Shrenis (guilds)
    - Sabhas
    - Viharas
    - Janapadas
    answer: Shrenis (guilds)
    difficulty: 1
    hints:
    - Like trade associations.
    - They also acted like banks.
    solution: 'Step 1: Craftspeople and traders grouped together. Step 2: These groups were shrenis, or guilds.'
  - prompt: Which ancient port on the Kerala coast traded pepper with Rome?
    options:
    - Muziris
    - Lothal
    - Tamralipti
    - Bharuch
    answer: Muziris
    difficulty: 1
    hints:
    - Near today's Kodungallur.
    - Roman coins found nearby.
    solution: 'Step 1: Pepper was Kerala''s famous export. Step 2: It was shipped from Muziris.'
  - prompt: What was the main source of income for kings in early India?
    options:
    - A share of the crops as tax
    - Selling palaces
    - Gifts from Rome
    - Fees from schools
    answer: A share of the crops as tax
    difficulty: 2
    hints:
    - Most people were farmers.
    - Often one-sixth.
    solution: 'Step 1: The economy was mainly farming. Step 2: Kings took a share of the harvest (bhaga) as tax.'
  - prompt: Which of these is NOT one of the seven limbs (saptanga) of the state in the Arthashastra?
    options:
    - Temple
    - Treasury
    - Army
    - Ally
    answer: Temple
    difficulty: 2
    hints:
    - King, ministers, territory, fort, treasury, army, ally.
    - Count them.
    solution: 'Step 1: The seven limbs are king, ministers, territory, fort, treasury, army and ally. Step 2: Temple is not one of them.'
  - prompt: Besides organising crafts, how did guilds help the economy?
    options:
    - They kept deposits and lent money like banks
    - They collected taxes for the king
    - They stopped all trade
    - They ruled kingdoms
    answer: They kept deposits and lent money like banks
    difficulty: 3
    hints:
    - Inscriptions record money deposited with guilds.
    - Interest was paid.
    solution: 'Step 1: Inscriptions show people depositing money with guilds. Step 2: Guilds used it and paid interest, acting like banks.'
