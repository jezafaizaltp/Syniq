# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 5. Format: content/README.md.
subject: cbse9-ss
chapter: 5
title: State and Society up to 1000 CE
tips:
  janapada_terms: Jana was a tribe or people; janapada the land where a jana settled; mahajanapadas were the sixteen large states of about the 6th century BCE.
  c9ss5_jana_word: Break the word down. The same root is in janata and janapada. Is it about money, buildings, or human beings?
  monarchy_republic: In a monarchy a king rules, usually by birth; in a gana-sangha (republic) a group of leaders decided together in an assembly, as among the Vajjis and Shakyas.
  s9_crop_tax: "Most people farmed. What could the king take a share of every season?"
  s9_guild_bank: "Guilds handled a lot of money. What could they do with deposits, like a bank does?"
  s9_kautilya: "Kalidasa was a poet and Megasthenes a Greek visitor. Who was the adviser who wrote on statecraft?"
  s9_magadha: "Which kingdom, in present-day Bihar, grew into the Mauryan empire?"
  s9_muziris: "Lothal is a Harappan port in Gujarat. Which port was on the Kerala coast?"
  s9_rajadharma: "Dharma means duty. What would a king owe his people first?"
  s9_sabha_samiti: "Lok Sabha and Rajya Sabha are today's Parliament. What were the Vedic assemblies called?"
  s9_saptanga: "The seven limbs are parts of running a state: king, ministers, land, fort, treasury, army, ally. Which choice is not one of them?"
  s9_shreni: "Viharas were for monks and sabhas were assemblies. What were craft and trade groups called?"
  s9_sixteen: "Buddhist and Jain texts list the mahajanapadas. The number is between 15 and 17."
  c9ss5_ruler_match: Place the clue in time first. Was it the age of the early kingdoms, the first big empire, or a later one? Then think which name fits that age.
  c9ss5_assembly_rule: Ask who made the decisions. Was it one king who ruled by birth, or a group of leaders meeting in an assembly?
concepts:
- code: cbse9us.state.janapadas
  title: From janas to mahajanapadas, kings and republics
  notes: |
    Early political life was based on kinship: the jana (tribe or people) and kula (family). In the Vedic
    period the raja was a leader in war, advised by assemblies called the sabha and samiti. As people settled
    and farmed, the land of a jana became a janapada. By about the 6th century BCE there were sixteen
    mahajanapadas such as Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara and the Vajji
    confederacy. Some were monarchies ruled by kings; others were gana-sanghas (republics) where many leaders
    met in an assembly (the Vajjis with their capital at Vaishali, the Shakyas of the Buddha). Magadha, with
    fertile land, iron ores, rivers and able rulers (Bimbisara, Ajatashatru), grew into the most powerful.
    Kings were expected to follow dharma (rajadharma): to protect the people, keep order and be just.
    Later the Mauryas (Chandragupta, Ashoka) and the Guptas built large empires; Ashoka's edicts spoke of
    dhamma and the welfare of all. In the south, the Cholas, Cheras and Pandyas, and later the Pallavas and
    Chalukyas, ruled.
  explanations:
    text: Picture a tribe (jana) settling on land; that land becomes its janapada. Over time some janapadas grew into sixteen big states, the mahajanapadas. Some were ruled by a king, others by a council that decided together, an early kind of republic.
    visual: 'Draw a ladder: family (kula) → tribe (jana) → its land (janapada) → big state (mahajanapada) → empire (Mauryas). Beside the mahajanapada step, draw two pictures: a king on a throne (monarchy) and a circle of leaders talking (gana-sangha).'
    step_by_step: 'Step 1: Who rules? One king → monarchy; a council → gana-sangha. Step 2: How big? Tribe land → janapada; large state → mahajanapada. Step 3: Magadha grew strongest thanks to land, iron, rivers and rulers.'
    real_world: Vaishali in Bihar, capital of the Vajji gana-sangha, is often called one of the world's earliest republics.
  picture:
    kind: flow
    steps:
    - Kula (family)
    - Jana (tribe)
    - Janapada (land of a jana)
    - Mahajanapada (large state)
    - Empire (Mauryas)
    alt: How political units grew in early India from family and tribe to janapada, mahajanapada and empire.
  activity:
    type: sort
    prompt: Monarchy or gana-sangha (republic)?
    bins:
    - Monarchy
    - Gana-sangha
    items:
    - label: Magadha under Bimbisara
      bin: Monarchy
      clue: One king.
      why: Monarchy.
    - label: Vajjis with capital at Vaishali
      bin: Gana-sangha
      clue: Many leaders in an assembly.
      why: Gana-sangha.
    - label: The Shakyas, the Buddha's people
      bin: Gana-sangha
      clue: Assembly rule.
      why: Gana-sangha.
    - label: Kosala
      bin: Monarchy
      clue: Ruled by a king.
      why: Monarchy.
    - label: Avanti
      bin: Monarchy
      clue: A king.
      why: Monarchy.
  lesson:
    - teach: 'Early political life rested on kinship: the jana (a people or tribe) and the kula (family). In the Vedic period the raja led in war and was advised by two assemblies, the sabha and the samiti. When a jana settled and farmed, its land became a janapada.'
      check:
        prompt: What was a janapada?
        options:
        - The land where a jana settled
        - A kind of tax
        - A temple
        answer: The land where a jana settled
        why: '''Pada'' is foot: where a people set foot and stayed.'
    - teach: 'By about the 6th century BCE there were sixteen big states, the mahajanapadas: Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara, the Vajji confederacy and others. Some were monarchies ruled by a king; others were gana-sanghas, where many leaders decided together in an assembly, like the Vajjis of Vaishali.'
      picture:
        kind: compare
        columns:
        - title: Monarchy
          points:
          - One king rules
          - Power often passed by birth
          - 'Example: Magadha'
        - title: Gana-sangha
          points:
          - Many leaders in an assembly
          - Decisions by discussion
          - 'Example: Vajjis of Vaishali'
        alt: A monarchy ruled by one king compared with a gana-sangha ruled by an assembly.
      check:
        prompt: The Vajjis were ruled by…
        options:
        - An assembly of leaders
        - A single emperor
        - Priests only
        answer: An assembly of leaders
        why: They were a gana-sangha.
    - teach: 'Magadha, with fertile land, iron ore, rivers for transport and strong kings like Bimbisara and Ajatashatru, became the most powerful mahajanapada. It grew into the Mauryan empire under Chandragupta and Ashoka, whose edicts spoke of dhamma and the welfare of all. Kings were expected to follow rajadharma: protect the people and rule justly.'
      check:
        prompt: Which helped Magadha grow strong?
        options:
        - Iron ore and fertile land
        - Deserts all around
        - No rivers
        answer: Iron ore and fertile land
        why: Iron made tools and weapons; fertile land fed a large population.
  items:
