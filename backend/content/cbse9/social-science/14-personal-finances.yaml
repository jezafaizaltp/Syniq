# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 14. Format: content/README.md.
subject: cbse9-ss
chapter: 14
title: Managing Your Personal Finances
tips:
  risk_return: "Higher possible returns usually come with higher risk. Which choice promises a fixed amount from a bank? Spreading money over many assets lowers risk."
  slab_tax: In a progressive slab system each rate applies only to the income inside that slab, not to the whole income.
  s9_budget_first: "You can't plan spending without knowing what comes in and what goes out."
  s9_compound: "After year 1: 1,000 + 10% = 1,100. Year 2 adds 10% of 1,100, not of 1,000."
  s9_inflation: "Prices rise over the years. What happens to what the same cash can buy?"
  s9_need_want: "A need is something you can't do without. Which one is required for school?"
  s9_premium: "A dividend is paid by a company to shareholders. What do you pay an insurer regularly?"
  s9_risk_pool: "Insurance can't stop accidents. It spreads the cost of losses across many people."
  s9_saving_sub: "Savings = income − spending: 15,000 − 12,000."
  s9_shares: "A share is a part of the company itself, not a loan."
  s9_start_early: "Same amount, same interest. Who gives compounding more years to grow?"
concepts:
- code: cbse9us.money.budget_saving
  title: Budgeting and saving
  notes: |
    Personal finance is planning and managing your money to meet needs, wants and goals. Its pillars are
    income, budgeting, saving, investing and protection (insurance and careful borrowing). A budget lists
    expected income and spending; the steps are: list expenses, set a savings goal (how much and by when),
    track spending against the budget, and review and adjust it. Needs (food, rent, school fees) come before
    wants (a new phone). Savings = income − spending. Cash kept idle at home loses value because of inflation
    (rising prices). Compounding means earning interest on earlier interest too, so starting to save early
    helps a lot: a person who starts saving at 25 ends up with far more at 65 than one who starts at 35, even
    with the same yearly amount. Borrowing should be for real needs (such as an education loan); an EMI
    (equated monthly instalment) repays principal plus interest, and must be paid on time.
  explanations:
    text: 'A budget is a plan for your money: what comes in, what goes out, and what you keep. Saving a little every month and starting early lets compounding work: your interest starts earning interest of its own.'
    visual: Draw a jar labelled 'Income ₹10,000'. Arrows go out to 'Needs ₹6,000', 'Wants ₹2,000' and 'Savings ₹2,000'. Next to it draw a small plant growing into a tree labelled 'compounding'.
    step_by_step: 'Step 1: Write your income. Step 2: List needs, then wants. Step 3: Decide your savings first. Step 4: Track what you spend. Step 5: Review each month and adjust.'
    real_world: Many families in Kerala save through chit funds and post office recurring deposits; regular small deposits add up over years.
  picture:
    kind: bars
    bars:
    - label: Needs
      value: 6000
    - label: Wants
      value: 2000
    - label: Savings
      value: 2000
    unit: ₹
    caption: A monthly budget for an income of ₹10,000
    alt: 'A monthly budget of ₹10,000: ₹6,000 for needs, ₹2,000 for wants and ₹2,000 saved.'
  activity:
    type: number_line
    min: 0
    max: 4000
    step: 100
    start: 4000
    prompt: Savings = income − spending. Mark the monthly savings (₹).
    goals:
    - prompt: Income ₹10,000, spending ₹8,000
      target: 2000
      mistakes:
      - when:
          v: 1800
        say: Saving = income − spending. Take the spending away from the income again.
    - prompt: Income ₹12,000, spending ₹9,000
      target: 3000
      mistakes:
      - when:
          v: 2000
        say: 'That''s the last answer. Use this month''s income and spending: income − spending.'
    - prompt: Income ₹9,000, spending ₹9,000
      target: 0
      mistakes:
      - when:
          v: 1000
        say: 'Spending equals income: nothing is left to save.'
  items:
  - prompt: Meena earns ₹15,000 a month and spends ₹12,000. How much does she save, in rupees?
    answer: '3000'
    check: '3000'
    difficulty: 1
    hints:
    - Savings = income − spending.
    - 15,000 − 12,000.
    solution: 'Step 1: Savings = income − spending. Step 2: 15,000 − 12,000 = ₹3,000.'
    mistakes: {"27000": "s9_saving_sub", "12000": "s9_saving_sub"}
  - prompt: Which of these is a need rather than a want?
    options:
    - School fees
    - A new video game
    - Eating out every week
    - Designer shoes
    answer: School fees
    difficulty: 1
    hints:
    - Something essential.
    - Education.
    solution: 'Step 1: Needs are essential for living and growing. Step 2: School fees are a need; the rest are wants.'
    mistakes: {"A new video game": "s9_need_want"}
  - prompt: What is the first step in making a budget?
    options:
    - Identify your income and expenses
    - Buy shares
    - Take a loan
    - Spend all your money
    answer: Identify your income and expenses
    difficulty: 1
    hints:
    - You must know your numbers.
    - List them.
    solution: 'Step 1: A budget starts by listing income and expenses. Step 2: Then you set goals and track.'
    mistakes: {"Take a loan": "s9_budget_first"}
  - prompt: Why does keeping a lot of cash at home for years lose value?
    options:
    - Inflation makes prices rise, so the money buys less
    - Cash grows by itself
    - Banks take it away
    - Coins rust
    answer: Inflation makes prices rise, so the money buys less
    difficulty: 2
    hints:
    - Prices go up over time.
    - Same notes, fewer goods.
    solution: 'Step 1: Prices rise over time (inflation). Step 2: The same cash buys less, so its real value falls.'
    mistakes: {"Cash grows by itself": "s9_inflation"}
  - prompt: ₹1,000 is deposited at 10% interest compounded yearly. How much is in the account after 2 years, in rupees?
    answer: '1210'
    check: '1210'
    difficulty: 2
    hints:
    - 'Year 1: 1,000 + 100.'
    - 'Year 2: interest on 1,100.'
    solution: 'Step 1: After year 1: 1,000 + 10% = 1,100. Step 2: After year 2: 1,100 + 110 = ₹1,210.'
    mistakes: {"1200": "s9_compound", "1100": "s9_compound"}
  - prompt: Bhavisha starts saving at 25 and Dhruv at 35, the same amount each year at the same interest. At 65, who has more and why?
    options:
    - Bhavisha, because compounding has more years to work
    - Dhruv, because he started later
    - Both have the same
    - Neither saves anything
    answer: Bhavisha, because compounding has more years to work
    difficulty: 3
    hints:
    - Time matters most in compounding.
    - Ten extra years.
    solution: 'Step 1: Bhavisha''s money grows for 40 years, Dhruv''s for 30. Step 2: Interest on interest over the extra years gives her much more.'
    mistakes: {"Both have the same": "s9_start_early", "Dhruv, because he started later": "s9_start_early"}
- code: cbse9us.money.invest_insure_tax
  title: Investing, insurance and income tax
  notes: |
    Investing puts savings into assets to earn returns. Options: fixed deposits (bank or post office, fixed
    rate, low risk, lower return), bonds (lending to government or companies for regular interest), mutual
    funds (pooled money managed by professionals and spread across many assets, which reduces risk) and shares
    (part-ownership of a company; dividends and price growth; highest risk and highest possible long-term
    return). This is the risk–return trade-off; investors should also think about time horizon and liquidity
    (how quickly money can be taken out). Diversification means not putting all eggs in one basket.
    Insurance is a contract: the policyholder pays a premium and the insurer pays for covered losses; many
    people's premiums are pooled so the few who suffer losses are helped (risk sharing). Types: health, life
    and general (motor, property, crop, cattle). Income tax in India is progressive: income is split into
    slabs and each slab is taxed at its own rate (new regime 2025–26: nil up to ₹4 lakh, 5% for ₹4–8 lakh,
    10% for ₹8–12 lakh, rising to 30% above ₹24 lakh). Taxes pay for public services and reduce inequality.
  explanations:
    text: 'Investing is putting your savings to work. Safer options like fixed deposits grow slowly; riskier ones like shares can grow faster but can also fall. Insurance shares risk: many people pay small premiums so the few who face a loss are helped. Income tax takes a bigger share from higher incomes.'
    visual: 'Draw a staircase from low to high: Fixed deposit, Bonds, Mutual funds, Shares. Label the left side ''lower risk, lower return'' and the right ''higher risk, higher possible return''.'
    step_by_step: 'Step 1: What is the goal and when is the money needed? Step 2: Pick options to match the risk you can take. Step 3: Spread money across options. Step 4: Protect against big losses with insurance. Step 5: For tax, apply each slab''s rate only to the income in that slab.'
    real_world: Crop insurance under PM Fasal Bima Yojana pays farmers when floods or drought destroy their crops, using the premiums pooled from many farmers.
  picture:
    kind: flow
    steps:
    - 'Fixed deposit: low risk'
    - Bonds
    - Mutual funds
    - 'Shares: highest risk and return'
    alt: Investment options arranged from lowest risk and return (fixed deposit) to highest (shares).
  activity:
    type: order
    prompt: Order the investments from lowest risk to highest risk.
    steps:
    - Fixed deposit
    - Bond
    - Mutual fund
    - Shares
    reasons:
      Bond: A bond pays regular interest but the borrower could fail, so a little more risk than a bank FD.
      Mutual fund: Pooled and spread across assets, but values move with markets.
      Shares: 'Part-ownership: highest risk and highest possible return.'
  items:
  - prompt: Which investment is generally the safest, with a fixed, assured return?
    options:
    - Fixed deposit
    - Shares
    - Starting a new business
    - Lottery tickets
    answer: Fixed deposit
    difficulty: 1
    hints:
    - Bank or post office.
    - Fixed rate.
    solution: 'Step 1: Fixed deposits pay a set interest. Step 2: They are low risk.'
    mistakes:
      Shares: risk_return
  - prompt: The regular amount paid to an insurance company for a policy is called a…
    options:
    - Premium
    - Dividend
    - Salary
    - Fine
    answer: Premium
    difficulty: 1
    hints:
    - Paid by the policyholder.
    - Monthly or yearly.
    solution: 'Step 1: The policyholder pays regularly for cover. Step 2: That payment is the premium.'
    mistakes: {"Dividend": "s9_premium"}
  - prompt: Buying shares of a company means you…
    options:
    - Own a small part of the company
    - Lend money to the government
    - Get a fixed interest always
    - Buy insurance
    answer: Own a small part of the company
    difficulty: 1
    hints:
    - Shareholder.
    - You may get dividends.
    solution: 'Step 1: A share is a unit of ownership. Step 2: Shareholders own part of the company.'
    mistakes: {"Lend money to the government": "s9_shares", "Get a fixed interest always": "s9_shares"}
  - prompt: Why do mutual funds have lower risk than buying a single company's shares?
    options:
    - Money is spread across many assets (diversification)
    - They are guaranteed by law to rise
    - They never fall
    - They are only for banks
    answer: Money is spread across many assets (diversification)
    difficulty: 2
    hints:
    - Don't put all eggs in one basket.
    - Pooled money.
    solution: 'Step 1: A fund invests in many companies and assets. Step 2: A loss in one is balanced by others.'
    mistakes:
      They never fall: risk_return
  - prompt: Under the new regime, income from ₹4 lakh to ₹8 lakh is taxed at 5%. A person's taxable income is ₹6 lakh. How much tax is due on the ₹4–6 lakh part, in rupees?
    answer: '10000'
    check: '10000'
    difficulty: 2
    hints:
    - Only the part above ₹4 lakh is taxed in this slab.
    - 5% of ₹2,00,000.
    solution: 'Step 1: Income in the 5% slab = 6 lakh − 4 lakh = ₹2,00,000. Step 2: 5% of 2,00,000 = ₹10,000.'
    mistakes:
      '30000': slab_tax
  - prompt: How does insurance help an individual through 'risk sharing'?
    options:
    - Many pay premiums into a pool that pays the few who suffer losses
    - The insurer never pays
    - Each person keeps their own premium
    - It stops accidents from happening
    answer: Many pay premiums into a pool that pays the few who suffer losses
    difficulty: 3
    hints:
    - Not everyone has a loss in the same year.
    - Pooling.
    solution: 'Step 1: Premiums from many are pooled. Step 2: The pool pays those few who face a loss, so the cost is shared.'
    mistakes: {"It stops accidents from happening": "s9_risk_pool"}
