# CBSE Class 9 Social Science (NCERT), Economics chapter 2. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 18
title: People as Resource

tips:
  sectors: "Primary sector: agriculture, fishing, mining. Secondary: manufacturing. Tertiary (services): trade, transport, banking, teaching, health."
  disguised_unemployment: "In disguised unemployment, more people work than are needed: taking some away doesn't reduce output. It's common in farming."
  seasonal_unemployment: "Seasonal unemployment happens when there is no work in certain months, like for farm workers after harvest."

concepts:
  - code: cbse9ss.people.capital
    title: Human capital and economic activities
    notes: |
      Population as an asset when invested in through education, training and health: human capital
      formation. Examples: Sakal and Vilas (Sakal educated, gets a good job; Vilas without schooling, low
      earnings). Japan invested in people despite few natural resources. Economic activities: market
      activities (for pay or profit) and non-market (own consumption). Sectors: primary, secondary,
      tertiary. Women's work at home is often unpaid. Quality of population: literacy, health (life
      expectancy, infant mortality), skills.
    explanations:
      text: "People become a resource for a country when they are educated, healthy and skilled: this is called human capital. Japan has few natural resources but became rich by investing in its people. Work can be in the primary sector (farming, fishing), secondary (factories) or tertiary (services like teaching, banking, transport)."
      visual: "Draw two seedlings. One gets water, sunlight and care (education and health) and grows into a fruit tree. The other gets none and stays small. People are the same: investment makes them productive."
      step_by_step: "Step 1: Is the activity paid or for profit? Market activity. For one's own use? Non-market. Step 2: Which sector: taking from nature (primary), making things (secondary), providing services (tertiary). Step 3: What improves quality? Education, health and training."
      real_world: "Kerala has high literacy and good health indicators, and many Keralites work as nurses, engineers and technicians around the world: an example of human capital."
    items:
      - prompt: "Fishing belongs to which sector?"
        options: ["Primary", "Secondary", "Tertiary", "None"]
        answer: "Primary"
        difficulty: 1
        hints: ["Taken directly from nature.", "Like farming and mining."]
        solution: "Fishing is a primary sector activity."
        mistakes: {"Tertiary": sectors}
      - prompt: "Banking belongs to which sector?"
        options: ["Tertiary", "Primary", "Secondary", "Quaternary only"]
        answer: "Tertiary"
        difficulty: 1
        hints: ["It's a service.", "No goods are made."]
        solution: "Banking is a service: tertiary sector."
        mistakes: {"Secondary": sectors}
      - prompt: "Investment in education, training and health of people is called…"
        options: ["Human capital formation", "Physical capital", "Disguised unemployment", "Barter"]
        answer: "Human capital formation"
        difficulty: 1
        hints: ["People as resource.", "Investing in humans."]
        solution: "This is human capital formation."
      - prompt: "Which country became rich by investing in its people despite having few natural resources?"
        options: ["Japan", "Saudi Arabia", "Brazil", "Russia"]
        answer: "Japan"
        difficulty: 2
        hints: ["An island nation in East Asia.", "Famous for technology."]
        solution: "Japan invested heavily in education and health."
      - prompt: "Cooking for one's own family, unpaid, is a…"
        options: ["Non-market activity", "Market activity", "Secondary activity", "Tertiary market activity"]
        answer: "Non-market activity"
        difficulty: 2
        hints: ["No payment or profit.", "For own use."]
        solution: "Unpaid work for own consumption is a non-market activity."
      - prompt: "Manufacturing sugar from sugarcane belongs to which sector?"
        options: ["Secondary", "Primary", "Tertiary", "None"]
        answer: "Secondary"
        difficulty: 2
        hints: ["Raw material is processed.", "Factories."]
        solution: "Processing and manufacturing is the secondary sector."
        mistakes: {"Primary": sectors}

  - code: cbse9ss.people.unemployment
    title: Unemployment, education and health
    after: [cbse9ss.people.capital]
    notes: |
      Unemployment: people willing and able to work at going wages cannot find jobs; working age 15–59.
      Rural: seasonal and disguised unemployment. Urban: educated unemployment. Unemployment wastes
      manpower, increases dependence, and lowers quality of life. Education: literacy rate 74% (2011);
      Sarva Shiksha Abhiyan, mid-day meals, Navodaya Vidyalayas. Health: life expectancy and infant
      mortality improving; National Health Policy. Women are paid less and often work in the unorganised
      sector.
    explanations:
      text: "Unemployment means people who want work at current wages can't find it. In villages there is seasonal unemployment (no work after harvest) and disguised unemployment (more family members on a farm than needed). In towns, many educated young people can't find jobs that match their skills. Education and health schemes aim to build human capital so people can find better work."
      visual: "Picture a small field with five family members all 'working' on it, but three would be enough. Take two away and the harvest is the same: that's disguised unemployment."
      step_by_step: "Step 1: Is there work only in some months? Seasonal. Step 2: Are more people working than needed? Disguised. Step 3: Educated but jobless? Educated unemployment. Step 4: Remedies: education, skills, health care and job creation."
      real_world: "Mid-day meals in schools help children stay in school and stay healthy, building human capital from a young age. Kerala's scheme is one of the oldest in the country."
    picture:
      kind: compare
      columns:
      - title: Disguised unemployment
        points: [More people working than needed, Take some away and output stays the same, Common on small family farms]
      - title: Seasonal unemployment
        points: [Work only in some months, No work between sowing and harvest, Common among farm workers]
      alt: Disguised unemployment is more people working than needed, as on small family farms; seasonal unemployment is having work only in some months of the year.
    items:
      - prompt: "Farm workers with no work after harvest face which type of unemployment?"
        options: ["Seasonal", "Disguised", "Educated", "Technological"]
        answer: "Seasonal"
        difficulty: 1
        hints: ["It depends on the time of year.", "Certain months only."]
        solution: "This is seasonal unemployment."
        mistakes: {"Disguised": seasonal_unemployment}
      - prompt: "Five family members work on a farm that needs only three. What type of unemployment is this?"
        options: ["Disguised", "Seasonal", "Educated", "None"]
        answer: "Disguised"
        difficulty: 1
        hints: ["Everyone appears to be working.", "Output wouldn't fall if two left."]
        solution: "This is disguised unemployment."
        mistakes: {"Seasonal": disguised_unemployment}
      - prompt: "In the farm example above, how many people are disguisedly unemployed?"
        answer: "2"
        check: "5 - 3"
        difficulty: 2
        hints: ["Working minus needed.", "5 − 3."]
        solution: "5 − 3 = 2 people are disguisedly unemployed."
      - prompt: "What is the working-age group in India, according to NCERT? Type the lower age."
        answer: "15"
        check: "15"
        difficulty: 2
        hints: ["15 to 59.", "The lower number."]
        solution: "The working-age population is 15–59 years."
      - prompt: "Graduates who cannot find jobs face…"
        options: ["Educated unemployment", "Seasonal unemployment", "Disguised unemployment", "Full employment"]
        answer: "Educated unemployment"
        difficulty: 2
        hints: ["Common in towns.", "They have degrees."]
        solution: "This is educated unemployment."
      - prompt: "Why is unemployment harmful for the economy?"
        options: ["Manpower is wasted and dependence increases", "It raises production", "It lowers population", "It improves health"]
        answer: "Manpower is wasted and dependence increases"
        difficulty: 3
        hints: ["Unused human resource.", "Workers support non-workers."]
        solution: "Unemployment wastes human resources and increases economic dependence."
