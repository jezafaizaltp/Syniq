# CBSE Class 9 Social Science (NCERT), Geography: Contemporary India I, chapter 1. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 6
title: India – Size and Location

tips:
  tropic_cancer: "The Tropic of Cancer (23°30′N) divides India almost into two halves. The Equator does not pass through India."
  standard_meridian: "India's Standard Meridian is 82°30′E, passing through Mirzapur in Uttar Pradesh. IST is 5 h 30 min ahead of GMT."
  time_per_degree: "The Earth turns 1° every 4 minutes. 30° of longitude makes 2 hours of time difference."

concepts:
  - code: cbse9ss.geo.location
    title: Location, size and time
    notes: |
      India lies wholly in the Northern Hemisphere: mainland between 8°4′N and 37°6′N and 68°7′E and
      97°25′E. The Tropic of Cancer (23°30′N) divides it almost into two halves. Area 3.28 million km²,
      about 2.4% of the world's land; seventh largest country. Land boundary about 15,200 km; coastline of
      mainland plus islands 7,516.6 km. North–south extent about 3,214 km; east–west about 2,933 km.
      Longitudinal extent about 30°, so about 2 hours' time difference from Gujarat to Arunachal; Standard
      Meridian 82°30′E (Mirzapur). Southernmost point Indira Point (Great Nicobar).
    explanations:
      text: "India lies north of the Equator, with the Tropic of Cancer running through its middle. It is the seventh largest country, with about 2.4% of the world's land. Because India stretches about 30° east to west, the sun rises about 2 hours earlier in Arunachal Pradesh than in Gujarat, so the whole country uses one time based on 82°30′E."
      visual: "Picture India on a globe: a big triangle pointing south into the Indian Ocean. A line across the middle at 23°30′N is the Tropic of Cancer. A line down the middle at 82°30′E through Mirzapur sets India's clocks."
      step_by_step: "Step 1: Latitudes 8°4′N to 37°6′N; longitudes 68°7′E to 97°25′E. Step 2: Tropic of Cancer divides it almost in half. Step 3: Longitude span ≈ 30° × 4 minutes = 120 minutes = 2 hours. Step 4: IST uses 82°30′E, 5 h 30 min ahead of GMT."
      real_world: "When it's 6 am in Itanagar, the sky is already bright, but in Dwarka it's still dark. Both clocks say the same time because India uses one standard time."
    items:
      - prompt: "Which line of latitude divides India almost into two halves?"
        options: ["Tropic of Cancer", "Equator", "Tropic of Capricorn", "Arctic Circle"]
        answer: "Tropic of Cancer"
        difficulty: 1
        hints: ["23°30′N.", "The Equator doesn't pass through India."]
        solution: "The Tropic of Cancer passes through the middle of India."
        mistakes: {"Equator": tropic_cancer}
      - prompt: "India's area is about what percentage of the world's total land area?"
        answer: "2.4"
        check: "2.4"
        difficulty: 1
        hints: ["Between 2 and 3.", "Two point something."]
        solution: "India covers about 2.4% of the world's land."
      - prompt: "India's Standard Meridian passes through which town?"
        options: ["Mirzapur", "Delhi", "Nagpur", "Kanyakumari"]
        answer: "Mirzapur"
        difficulty: 2
        hints: ["82°30′E.", "In Uttar Pradesh."]
        solution: "82°30′E passes through Mirzapur."
        mistakes: {"Nagpur": standard_meridian}
      - prompt: "India stretches about 30° of longitude. How many hours of time difference is that?"
        answer: "2"
        check: "30*4/60"
        difficulty: 2
        hints: ["4 minutes per degree.", "30 × 4 = 120 minutes."]
        solution: "30 × 4 = 120 minutes = 2 hours."
        mistakes: {"30": time_per_degree}
      - prompt: "What is India's rank in the world by area?"
        answer: "7"
        check: "7"
        difficulty: 1
        hints: ["Russia, Canada, USA, China, Brazil, Australia are bigger.", "Count them."]
        solution: "India is the seventh largest country."
      - prompt: "What is the southernmost point of India?"
        options: ["Indira Point", "Kanyakumari", "Rameswaram", "Port Blair"]
        answer: "Indira Point"
        difficulty: 2
        hints: ["It's on an island.", "Great Nicobar."]
        solution: "Indira Point on Great Nicobar is the southernmost point; Kanyakumari is the mainland's tip."
      - prompt: "By how many hours and minutes is IST ahead of GMT? Type the hours as a decimal."
        answer: "5.5"
        check: "82.5*4/60"
        difficulty: 3
        hints: ["82.5° × 4 minutes.", "330 minutes."]
        solution: "82.5 × 4 = 330 minutes = 5 h 30 min = 5.5 hours."

  - code: cbse9ss.geo.neighbours
    title: India and the world, and its neighbours
    after: [cbse9ss.geo.location]
    notes: |
      India's central location in the Indian Ocean between East and West Asia; the only country with an
      ocean named after it. Trans-Indian Ocean routes; the Suez Canal (1869) cut the distance to Europe by
      about 7,000 km. Ancient links: ideas of the Upanishads, Ramayana, Panchtantra, numerals and decimal
      system travelled; Greek sculpture and West Asian architecture came in. 28 states and 8 Union
      Territories. Neighbours: Pakistan, Afghanistan (northwest), China, Nepal, Bhutan (north), Myanmar,
      Bangladesh (east); Sri Lanka across the Palk Strait and Gulf of Mannar; Maldives to the south.
    explanations:
      text: "India sits at the heart of the Indian Ocean, the only ocean named after a country. Sea routes from Europe and Africa to East Asia pass close by. India shares land borders with Pakistan, Afghanistan, China, Nepal, Bhutan, Myanmar and Bangladesh, and Sri Lanka and the Maldives are island neighbours across the sea."
      visual: "Draw India in the centre. Around it, starting top-left and going clockwise: Pakistan, Afghanistan, China, Nepal, Bhutan, Myanmar, Bangladesh. Below: Sri Lanka across the narrow Palk Strait, and the Maldives further southwest."
      step_by_step: "Step 1: North-west: Pakistan, Afghanistan. Step 2: North: China, Nepal, Bhutan. Step 3: East: Myanmar, Bangladesh. Step 4: South across sea: Sri Lanka (Palk Strait), Maldives."
      real_world: "Indian numerals travelled through Arab traders to Europe, which is why the numbers 0–9 you write are often called Hindu-Arabic numerals."
    items:
      - prompt: "Which water body separates India from Sri Lanka?"
        options: ["Palk Strait", "Strait of Malacca", "Suez Canal", "Gulf of Kutch"]
        answer: "Palk Strait"
        difficulty: 1
        hints: ["Also the Gulf of Mannar.", "Near Rameswaram."]
        solution: "The Palk Strait and Gulf of Mannar separate India and Sri Lanka."
      - prompt: "How many states does India have?"
        answer: "28"
        check: "28"
        difficulty: 1
        hints: ["And 8 Union Territories.", "Between 25 and 30."]
        solution: "India has 28 states and 8 Union Territories."
      - prompt: "Which of these does NOT share a land border with India?"
        options: ["Sri Lanka", "Nepal", "Bhutan", "Myanmar"]
        answer: "Sri Lanka"
        difficulty: 1
        hints: ["One of them is an island.", "Across the sea."]
        solution: "Sri Lanka is an island; it has no land border with India."
      - prompt: "The opening of the Suez Canal reduced India's distance from Europe by about how many km?"
        answer: "7000"
        check: "7000"
        difficulty: 2
        hints: ["Opened in 1869.", "Thousands of km."]
        solution: "It cut the distance by about 7,000 km."
      - prompt: "Which is the only ocean named after a country?"
        options: ["Indian Ocean", "Pacific Ocean", "Atlantic Ocean", "Arctic Ocean"]
        answer: "Indian Ocean"
        difficulty: 1
        hints: ["Think of India.", "Its central location."]
        solution: "The Indian Ocean is named after India."
      - prompt: "Which of these neighbours lies to the north-west of India?"
        options: ["Afghanistan", "Bangladesh", "Myanmar", "Bhutan"]
        answer: "Afghanistan"
        difficulty: 2
        hints: ["Bangladesh and Myanmar are in the east.", "Bhutan is in the north."]
        solution: "Afghanistan is India's north-western neighbour."
