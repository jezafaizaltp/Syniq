# CBSE Class 9 Social Science (NCERT), Civics chapter 4. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 15
title: Working of Institutions

tips:
  pm_appointed: "The President appoints as Prime Minister the leader of the majority party or coalition in the Lok Sabha."
  money_bill_lok_sabha: "Money bills can start only in the Lok Sabha. The Rajya Sabha can only delay them for 14 days."
  three_organs: "Legislature makes laws, executive carries them out, judiciary settles disputes and checks that laws follow the Constitution."

concepts:
  - code: cbse9ss.inst.parliament
    title: Parliament and the executive
    notes: |
      Example: Office Memorandum of 13 August 1990 implementing Mandal Commission recommendations (27%
      reservation for socially and educationally backward classes in central government jobs); upheld by
      the Supreme Court in Indira Sawhney case (1992). Parliament: President, Lok Sabha (House of the
      People, up to 552, now 543 elected) and Rajya Sabha (Council of States, up to 250). Lok Sabha is more
      powerful: money bills, controls the Council of Ministers (no-confidence). Political executive (elected,
      temporary) vs permanent executive (civil servants). Prime Minister: leader of majority in Lok Sabha;
      Council of Ministers (Cabinet, Ministers of State, Deputy Ministers). President: nominal head, elected
      indirectly by MPs and MLAs.
    explanations:
      text: "Parliament makes India's laws. It has two houses: the Lok Sabha, directly elected by the people, and the Rajya Sabha, elected by state assemblies. The Lok Sabha is more powerful: money bills start there and it can remove the government. The Prime Minister, leader of the majority in the Lok Sabha, heads the Council of Ministers. The President is the head of state but mostly acts on the ministers' advice."
      visual: "Draw a building with three rooms. The biggest room is the Lok Sabha (543 elected MPs). A smaller room is the Rajya Sabha. A third room is the President's office. The Prime Minister sits in the Lok Sabha room at the head of the Cabinet table."
      step_by_step: "Step 1: Parliament = President + Lok Sabha + Rajya Sabha. Step 2: Lok Sabha: directly elected, money bills, can pass no-confidence. Step 3: Executive: political (ministers, elected, change) and permanent (civil servants, stay). Step 4: PM leads; President is nominal head."
      real_world: "When you hear that the Union Budget was 'passed by Parliament', the Lok Sabha did the real voting: the Rajya Sabha could only suggest changes and delay it by 14 days."
    picture:
      kind: compare
      columns:
      - title: Lok Sabha
        points: [Elected directly by the people, 543 elected members, Money bills start here; it has more power]
      - title: Rajya Sabha
        points: [Elected by state MLAs, 'At most 250 members, 12 nominated', 'Can only delay a money bill, by 14 days']
      alt: Lok Sabha members are elected by the people and it has more power over money; Rajya Sabha members are chosen by state MLAs and it can only delay money bills.
    items:
      - prompt: "Which house of Parliament is directly elected by the people?"
        options: ["Lok Sabha", "Rajya Sabha", "Both", "Neither"]
        answer: "Lok Sabha"
        difficulty: 1
        hints: ["House of the People.", "543 constituencies."]
        solution: "The Lok Sabha is directly elected."
      - prompt: "For how many days can the Rajya Sabha delay a money bill?"
        answer: "14"
        check: "14"
        difficulty: 2
        hints: ["Two weeks.", "It cannot reject it."]
        solution: "The Rajya Sabha can delay a money bill by 14 days."
        mistakes: {"30": money_bill_lok_sabha}
      - prompt: "Who appoints the Prime Minister?"
        options: ["The President", "The Chief Justice", "The Speaker", "The Rajya Sabha"]
        answer: "The President"
        difficulty: 1
        hints: ["Head of state.", "Appoints the majority leader."]
        solution: "The President appoints the leader of the Lok Sabha majority as PM."
        mistakes: {"The Speaker": pm_appointed}
      - prompt: "What percentage of central government jobs did the 1990 Office Memorandum reserve for backward classes?"
        answer: "27"
        check: "27"
        difficulty: 2
        hints: ["Mandal Commission.", "Just over a quarter."]
        solution: "It reserved 27% for socially and educationally backward classes."
      - prompt: "Civil servants who stay in office even when governments change are called the…"
        options: ["Permanent executive", "Political executive", "Legislature", "Judiciary"]
        answer: "Permanent executive"
        difficulty: 2
        hints: ["They are not elected.", "IAS officers, for example."]
        solution: "They are the permanent executive."
      - prompt: "How is the President of India elected?"
        options: ["Indirectly, by elected MPs and MLAs", "Directly by all citizens", "By the Prime Minister", "By the Supreme Court"]
        answer: "Indirectly, by elected MPs and MLAs"
        difficulty: 3
        hints: ["Not a direct election.", "Electoral college."]
        solution: "The President is elected indirectly by MPs and MLAs."

  - code: cbse9ss.inst.judiciary
    title: The judiciary
    after: [cbse9ss.inst.parliament]
    notes: |
      Integrated judiciary: Supreme Court, High Courts, district and local courts. Supreme Court controls
      judicial administration; decisions binding on all courts. Independence: judges appointed by the
      President on the advice of the PM in consultation with the Chief Justice (collegium practice); can be
      removed only by impeachment by a two-thirds majority of both houses. Judicial review: courts can
      declare laws or actions unconstitutional. Guardian of Fundamental Rights. Public interest litigation
      (PIL) lets anyone approach courts for public causes.
    explanations:
      text: "India's courts form one connected system: local courts, then High Courts in states, and the Supreme Court at the top. Judges are independent: they can be removed only by a very difficult impeachment process. Courts can strike down laws that break the Constitution (judicial review), and anyone can go to court on behalf of the public through a PIL."
      visual: "Draw a pyramid: many district courts at the base, High Courts in the middle, one Supreme Court at the top. Arrows go up for appeals. A shield over the top labelled 'Fundamental Rights'."
      step_by_step: "Step 1: Lowest: district courts. Step 2: Appeal to the High Court. Step 3: Final appeal to the Supreme Court. Step 4: Judges are independent; removal needs a two-thirds majority in both houses. Step 5: Judicial review checks laws; PILs let anyone raise public concerns."
      real_world: "Courts have used PILs to order cleaner air in Delhi, midday meals in schools, and protection for forests, all after ordinary citizens raised the issue."
    picture:
      kind: flow
      steps: [District courts, High Court of the state, Supreme Court of India]
      alt: 'The courts in order: district courts, then the state''s High Court, then the Supreme Court. Appeals go up one step at a time.'
      caption: Each arrow is an appeal to a higher court. The Supreme Court's decision is final.
    items:
      - prompt: "Which is the highest court in India?"
        options: ["Supreme Court", "High Court", "District Court", "Lok Adalat"]
        answer: "Supreme Court"
        difficulty: 1
        hints: ["At the top of the pyramid.", "In New Delhi."]
        solution: "The Supreme Court is the highest court."
      - prompt: "The power of courts to declare a law unconstitutional is called…"
        options: ["Judicial review", "Impeachment", "No-confidence", "Ordinance"]
        answer: "Judicial review"
        difficulty: 1
        hints: ["Courts review laws.", "Against the Constitution."]
        solution: "This is judicial review."
      - prompt: "What fraction majority of both houses is needed to remove a Supreme Court judge? Type it as a fraction."
        answer: "2/3"
        check: "2/3"
        difficulty: 2
        hints: ["Two-thirds.", "Very difficult on purpose."]
        solution: "A two-thirds majority of members present and voting in both houses is needed."
      - prompt: "A case filed in court by anyone for the public good is called a…"
        options: ["Public interest litigation", "Money bill", "Writ of election", "Ordinance"]
        answer: "Public interest litigation"
        difficulty: 2
        hints: ["PIL.", "Not about a personal dispute."]
        solution: "This is a public interest litigation (PIL)."
      - prompt: "Which organ of government settles disputes and protects the Constitution?"
        options: ["Judiciary", "Legislature", "Executive", "Election Commission"]
        answer: "Judiciary"
        difficulty: 1
        hints: ["Courts.", "Not the law-makers."]
        solution: "The judiciary settles disputes and guards the Constitution."
        mistakes: {"Legislature": three_organs}
      - prompt: "In which 1992 case did the Supreme Court uphold the reservation order of 1990?"
        options: ["Indira Sawhney case", "Kesavananda Bharati case", "Minerva Mills case", "Golaknath case"]
        answer: "Indira Sawhney case"
        difficulty: 3
        hints: ["Also called the Mandal case.", "A woman's name."]
        solution: "The Indira Sawhney case (1992) upheld the order, with some changes."
