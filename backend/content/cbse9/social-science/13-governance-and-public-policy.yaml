# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 13. Format: content/README.md.
subject: cbse9-ss
chapter: 13
title: Governance and Public Policy
tips:
  government_governance: Government means the institutions (legislature, executive, judiciary); governance is the wider process of making and carrying out decisions, involving citizens, media and civil society too.
  policy_programme_scheme: "A policy sets a broad goal, a programme plans to reach it, and a delivery of specific benefits to people is the third kind. Health cover for poor families is a direct benefit."
  s9_accountability: "Being 'accountable' means you have to give an account of what you did."
  s9_adoption: "First the problem, then formulation, then the policy is formally approved before it is carried out."
  s9_egov: "Privatisation means handing work to private firms. Here the government itself delivers a service online. What is that called?"
  s9_evaluation: "Evaluation looks back at what happened. What is it for?"
  s9_judiciary: "The legislature makes laws and the executive carries them out. Who settles disputes?"
  s9_kasturirangan: "The NEP 2020 committee was chaired by a space scientist who once headed ISRO."
  s9_mundaka: "'Satyameva Jayate' comes from one of the Upanishads, not from the Constitution."
  s9_nep_year: "The NEP replaced a policy from 1986 and was approved in the year the COVID pandemic began."
  s9_public_input: "The people a policy affects know their own problems. Why ask them?"
  s9_transparency: "Good governance is open to citizens. Which choice is about openness?"
  c9ss13_three_organs: Ask what the body does with laws. Does it make them, carry them out, or explain them and settle disputes?
  c9ss13_feature: Name the quality the example shows. Is it openness, answering for actions, everyone taking part, quick response, or including everyone?
  c9ss13_wider: Government is the official institutions. Governance also counts everyone else who shapes public decisions.
  c9ss13_cycle_order: Walk through the cycle. See the problem, draft a plan, make it official, put it into action, then check how it worked.
  c9ss13_level: Is it the broad goal, the plan to reach it, or a specific benefit that reaches people?
  c9ss13_source: Recall the ancient text or tradition this idea comes from.
concepts:
- code: cbse9us.gov.good_governance
  title: Government, governance and good governance
  notes: |
    Government is the set of institutions that hold political authority: the legislature (makes laws), the
    executive (carries them out) and the judiciary (interprets them). Governance is wider: the whole process
    of making, implementing and monitoring decisions in the public interest, with citizens, media, civil
    society, the private sector and international bodies (such as the WHO) as stakeholders. India's
    traditions of governance include the Vedic sabha and samiti, the idea of rajadharma, and Kautilya's
    Arthashastra ("In the happiness of the people lies the happiness of the ruler"); the national motto
    Satyameva Jayate comes from the Mundaka Upanishad. Good governance has seven features: participation,
    transparency, accountability, rule of law, responsiveness, effectiveness and inclusiveness. E-governance
    uses digital technology to deliver services (online certificates, DigiLocker), share information and take
    feedback. Challenges include poor coordination, unequal access, misuse of office and misinformation.
  explanations:
    text: 'The government is the team on the field: legislature, executive and judiciary. Governance is the whole game, including the fans, referees and commentators: citizens, the media and civil society. Good governance means the game is open, fair and serves everyone.'
    visual: 'Draw a circle labelled ''Government'' (three boxes: legislature, executive, judiciary) inside a bigger circle labelled ''Governance'' with citizens, media, NGOs and businesses around it.'
    step_by_step: 'Step 1: Is it about institutions only? → government. Step 2: Does it include everyone involved in decisions? → governance. Step 3: Check the seven features: participation, transparency, accountability, rule of law, responsiveness, effectiveness, inclusiveness.'
    real_world: With the RTI Act, any citizen can ask a government office for information, which makes governance more transparent and accountable.
  picture:
    kind: compare
    columns:
    - title: Government
      points:
      - Legislature
      - Executive
      - Judiciary
    - title: Governance
      points:
      - Government
      - Citizens and media
      - Civil society, businesses
    alt: Government is the three institutions; governance includes them plus citizens, the media, civil society and businesses.
  activity:
    type: sort
    prompt: Which feature of good governance?
    bins:
    - Transparency
    - Accountability
    - Participation
    - Inclusiveness
    items:
    - label: Government spending posted online for all
      bin: Transparency
      clue: Can people see it?
      why: Transparency.
    - label: An official must answer for a failed project
      bin: Accountability
      clue: Who answers?
      why: Accountability.
    - label: Citizens give feedback on a new scheme
      bin: Participation
      clue: People take part.
      why: Participation.
    - label: Services reach remote villages and disabled people
      bin: Inclusiveness
      clue: No one left out.
      why: Inclusiveness.
  lesson:
    - teach: 'Government is the set of institutions with political authority: the legislature makes laws, the executive carries them out, and the judiciary interprets them and settles disputes. Governance is wider: the whole process of making, carrying out and checking public decisions, involving citizens, the media, civil society groups, businesses and even international bodies like the WHO.'
      picture:
        kind: flow
        steps:
        - Legislature makes laws
        - Executive carries them out
        - Judiciary interprets them
        alt: 'The three organs of government: legislature makes laws, executive carries them out, judiciary interprets them.'
      check:
        prompt: Which organ carries out laws?
        options:
        - Executive
        - Judiciary
        - Legislature
        answer: Executive
        why: The executive implements laws.
    - teach: 'India has old traditions of governance: the Vedic sabha and samiti, the idea of rajadharma, and Kautilya''s Arthashastra, which says ''In the happiness of the people lies the happiness of the ruler''. The national motto Satyameva Jayate, ''Truth alone triumphs'', comes from the Mundaka Upanishad.'
      check:
        prompt: Which text said the ruler's happiness lies in the people's happiness?
        options:
        - Arthashastra
        - A modern newspaper
        - The Rigveda only
        answer: Arthashastra
        why: Kautilya wrote this in the Arthashastra.
    - teach: 'Good governance has seven features: participation, transparency, accountability, rule of law, responsiveness, effectiveness and inclusiveness. E-governance uses digital tools to deliver services, such as online certificates and DigiLocker, share information and take feedback. Challenges include poor coordination, unequal internet access, misuse of office and misinformation.'
      picture:
        kind: compare
        columns:
        - title: Good governance
          points:
          - Participation
          - Transparency
          - Accountability
          - Rule of law
        - title: Also
          points:
          - Responsiveness
          - Effectiveness
          - Inclusiveness
        alt: The seven features of good governance listed in two columns.
      check:
        prompt: A government publishes all its spending online. This is…
        options:
        - Transparency
        - Misinformation
        - Secrecy
        answer: Transparency
        why: Openness about information is transparency.
  items:
  - prompt: Which of these is a feature of good governance?
    options:
    - Transparency
    - Secrecy
    - Favouritism
    - Delay
    answer: Transparency
    difficulty: 1
    hints:
    - Openness.
    - People can see how decisions are made.
    solution: 'Step 1: Good governance is open. Step 2: Transparency is one of its seven features.'
    mistakes: {"Secrecy": "s9_transparency"}
  - prompt: India's national motto 'Satyameva Jayate' is taken from the…
    options:
    - Mundaka Upanishad
    - Arthashastra
    - Rigveda
    - Constitution's Preamble
    answer: Mundaka Upanishad
    difficulty: 1
    hints:
    - An Upanishad.
    - It means 'Truth alone triumphs'.
    solution: 'Step 1: The motto means ''Truth alone triumphs''. Step 2: It comes from the Mundaka Upanishad.'
    mistakes: {"Constitution's Preamble": "s9_mundaka", "Rigveda": "s9_mundaka"}
  - prompt: Which part of government interprets laws and settles disputes?
    options:
    - Judiciary
    - Legislature
    - Executive
    - Media
    answer: Judiciary
    difficulty: 1
    hints:
    - Courts.
    - Not law-making.
    solution: 'Step 1: Courts interpret laws. Step 2: The courts form the judiciary.'
    mistakes: {"Legislature": "s9_judiciary", "Executive": "s9_judiciary"}
  - prompt: How is governance different from government?
    options:
    - Governance includes citizens, media and civil society, not just state institutions
    - They mean exactly the same thing
    - Governance means only the courts
    - Government is wider than governance
    answer: Governance includes citizens, media and civil society, not just state institutions
    difficulty: 2
    hints:
    - Think of who takes part.
    - Many stakeholders.
    solution: 'Step 1: Government is the institutions. Step 2: Governance is the wider process including many stakeholders.'
    mistakes:
      They mean exactly the same thing: government_governance
      Government is wider than governance: government_governance
  - prompt: A citizen applies for a caste certificate online and downloads it from DigiLocker. This is an example of…
    options:
    - E-governance
    - Rule by decree
    - Censorship
    - Privatisation
    answer: E-governance
    difficulty: 2
    hints:
    - Digital delivery of services.
    - No office visit needed.
    solution: 'Step 1: The service is delivered online. Step 2: Using technology for public services is e-governance.'
    mistakes: {"Privatisation": "s9_egov"}
  - prompt: Officials having to explain and answer for their decisions is called…
    options:
    - Accountability
    - Inclusiveness
    - Participation
    - Effectiveness
    answer: Accountability
    difficulty: 2
    hints:
    - Being answerable.
    - RTI helps it.
    solution: 'Step 1: Officials must justify actions to the public. Step 2: That is accountability.'
    mistakes: {"Participation": "s9_accountability"}
  - prompt: Which organ of government makes laws?
    options:
    - Legislature
    - Executive
    - Judiciary
    - Media
    answer: Legislature
    difficulty: 1
    hints:
    - Parliament is an example.
    - MPs debate and pass bills.
    solution: The legislature, such as Parliament, makes laws.
    mistakes:
      Judiciary: c9ss13_three_organs
  - prompt: A municipality fixes a broken water pipe within a day of a complaint. Which feature of good governance does this show?
    options:
    - Responsiveness
    - Secrecy
    - Delay
    - Inequality
    answer: Responsiveness
    difficulty: 2
    hints:
    - How fast did it act?
    - It reacted to citizens' needs.
    solution: Acting quickly on citizens' complaints is responsiveness.
    mistakes:
      Delay: c9ss13_feature
  - prompt: Which of these is a stakeholder in governance but NOT part of the government?
    options:
    - A newspaper
    - Parliament
    - The Supreme Court
    - A government ministry
    answer: A newspaper
    difficulty: 2
    hints:
    - Three are state institutions.
    - Governance is wider than government.
    solution: Media is a stakeholder in governance but not an organ of government.
    mistakes:
      Parliament: c9ss13_wider
  - prompt: What does 'Satyameva Jayate' mean?
    options:
    - Truth alone triumphs
    - Unity is strength
    - Work is worship
    - Our village, our rule
    answer: Truth alone triumphs
    difficulty: 1
    hints:
    - Satya means truth.
    - Jayate means wins.
    solution: Satyameva Jayate means 'Truth alone triumphs'.
    mistakes:
      Unity is strength: c9ss13_source
  - prompt: A new scheme makes sure people with disabilities, women and poor families are all reached. Which feature is this?
    options:
    - Inclusiveness
    - Secrecy
    - Delay
    - Misinformation
    answer: Inclusiveness
    difficulty: 2
    hints:
    - Nobody is left out.
    - It includes everyone.
    solution: Reaching every group, especially those often left out, is inclusiveness.
    mistakes:
      Secrecy: c9ss13_feature
  - prompt: Which is a challenge for e-governance in India?
    options:
    - Not everyone has internet or digital skills
    - Too many people have computers
    - Certificates become too easy to get
    - Paper is banned
    answer: Not everyone has internet or digital skills
    difficulty: 2
    hints:
    - Who might be left out of online services?
    - Think of remote villages.
    solution: Unequal access to devices, internet and skills means some citizens cannot use online services.
    mistakes:
      Too many people have computers: c9ss13_wider
  - prompt: Citizens give suggestions at a ward meeting before a new park is planned. Which feature is this?
    options:
    - Participation
    - Rule of law
    - Effectiveness
    - Secrecy
    answer: Participation
    difficulty: 1
    hints:
    - Citizens are taking part.
    - They have a say before the decision.
    solution: When citizens take part in decisions, that is participation.
    mistakes:
      Rule of law: c9ss13_feature
  - prompt: Which of these is NOT one of the seven features of good governance?
    options:
    - Favouritism
    - Accountability
    - Transparency
    - Effectiveness
    answer: Favouritism
    difficulty: 1
    hints:
    - Three are good qualities.
    - One means unfair treatment.
    solution: Favouritism is the opposite of good governance; the other three are features.
    mistakes:
      Effectiveness: c9ss13_feature
  - prompt: What is DigiLocker used for?
    options:
    - Storing and getting official documents online
    - Locking bank lockers
    - Booking train tickets only
    - Playing games
    answer: Storing and getting official documents online
    difficulty: 2
    hints:
    - It is a government e-service.
    - Certificates can be downloaded.
    solution: DigiLocker lets citizens keep and share official documents digitally.
    mistakes:
      Playing games: c9ss13_wider
- code: cbse9us.gov.policy_cycle
  title: Public policy and the policy cycle
  notes: |
    Public policy is a planned course of action the government adopts to solve a public problem, paid for
    with public money and open to citizens' input. A policy sets the broad goal, a programme is the plan to
    reach it, and a scheme delivers specific benefits (for example, the National Health Policy 2017 led to
    programmes to strengthen healthcare and to the Ayushman Bharat PM-JAY scheme). The policy cycle has
    stages: identifying the problem (desirability), formulation (consulting stakeholders and drafting),
    adoption (laws and rules), implementation, monitoring and evaluation, whose feedback leads to changes.
    Example: the National Education Policy 2020. A need to replace the 1986 policy was recognised; a
    committee chaired by Dr K. Kasturirangan was set up in 2017; about two lakh suggestions were received; the
    Union Cabinet approved the policy in July 2020.
  explanations:
    text: A public policy is like a plan to fix a big problem for the whole country. First the problem is spotted, then experts and citizens suggest solutions, the government adopts a plan, puts it into action, checks how it's going, and improves it. Then the cycle begins again.
    visual: 'Draw a circle of six arrows: Problem → Formulation → Adoption → Implementation → Monitoring → Evaluation → back to Problem.'
    step_by_step: 'Step 1: Name the problem. Step 2: Draft options after consultation. Step 3: Adopt the policy. Step 4: Implement it through programmes and schemes. Step 5: Monitor progress. Step 6: Evaluate and feed back.'
    real_world: NEP 2020 took about five years from the start of consultation to Cabinet approval, and received around two lakh public suggestions.
  picture:
    kind: flow
    steps:
    - Identify the problem
    - Formulation
    - Adoption
    - Implementation
    - Monitoring
    - Evaluation and feedback
    alt: The six stages of the public policy cycle from identifying the problem to evaluation and feedback.
  activity:
    type: order
    prompt: 'Put the policy cycle in order (example: NEP 2020).'
    steps:
    - 'Identify the problem: the 1986 policy needs replacing'
    - 'Formulation: Kasturirangan committee, two lakh suggestions'
    - 'Adoption: Union Cabinet approves (July 2020)'
    - Implementation
    - Monitoring and evaluation, then changes
    reasons:
      'Formulation: Kasturirangan committee, two lakh suggestions': Drafting comes after the problem is agreed.
      'Adoption: Union Cabinet approves (July 2020)': A draft is approved after consultation.
      Implementation: Carry out only what has been adopted.
      Monitoring and evaluation, then changes: You can only judge a policy once it is running.
  lesson:
    - teach: Public policy is a planned course of action the government adopts to solve a public problem, paid for with public money and open to citizens' views. A policy sets the broad goal; a programme is the plan to reach it; a scheme delivers specific benefits. For example, the National Health Policy 2017 led to programmes to strengthen healthcare, and to the Ayushman Bharat PM-JAY scheme that gives health cover to poor families.
      picture:
        kind: flow
        steps:
        - 'Policy: broad goal'
        - 'Programme: plan'
        - 'Scheme: specific benefit'
        alt: A policy sets the goal, a programme plans it, and a scheme delivers a specific benefit.
      check:
        prompt: Ayushman Bharat PM-JAY is a…
        options:
        - Scheme
        - Policy
        - Court
        answer: Scheme
        why: 'It delivers a specific benefit: health cover.'
    - teach: 'Policies pass through a cycle: identify the problem, formulate (consult and draft), adopt (pass laws and rules), implement, then monitor and evaluate. Evaluation gives feedback, and the policy is improved, starting the cycle again.'
      picture:
        kind: flow
        steps:
        - Identify problem
        - Formulation
        - Adoption
        - Implementation
        - Monitoring and evaluation
        - Feedback
        alt: 'The policy cycle: identify, formulate, adopt, implement, monitor and evaluate, then feedback.'
      check:
        prompt: Which stage comes right after adoption?
        options:
        - Implementation
        - Formulation
        - Identifying the problem
        answer: Implementation
        why: Once adopted, the policy is put into action.
    - teach: 'Example: the National Education Policy 2020. The need to replace the 1986 policy was recognised; in 2017 a committee chaired by Dr K. Kasturirangan was set up; about two lakh suggestions came from the public; and the Union Cabinet approved the policy in July 2020.'
      check:
        prompt: About how many public suggestions were received for NEP 2020?
        options:
        - About two lakh
        - About ten
        - None
        answer: About two lakh
        why: Wide consultation is part of formulation.
  items:
  - prompt: In the policy cycle, which stage comes right after formulation?
    options:
    - Adoption
    - Evaluation
    - Monitoring
    - Identifying the problem
    answer: Adoption
    difficulty: 1
    hints:
    - The draft becomes official.
    - Laws and rules are framed.
    solution: 'Step 1: Formulation produces a draft. Step 2: Next the government adopts it.'
    mistakes: {"Monitoring": "s9_adoption", "Evaluation": "s9_adoption"}
  - prompt: In which year was the National Education Policy approved by the Union Cabinet?
    answer: '2020'
    check: '2020'
    difficulty: 1
    hints:
    - Its name has the year.
    - July.
    solution: 'Step 1: The policy is called NEP 2020. Step 2: It was approved in July 2020.'
    mistakes: {"2019": "s9_nep_year", "1986": "s9_nep_year"}
  - prompt: Who chaired the committee that drafted the National Education Policy 2020?
    options:
    - Dr K. Kasturirangan
    - Dr B. R. Ambedkar
    - Dr A. P. J. Abdul Kalam
    - Dr M. S. Swaminathan
    answer: Dr K. Kasturirangan
    difficulty: 1
    hints:
    - A former ISRO chairman.
    - Committee set up in 2017.
    solution: 'Step 1: The committee was set up in 2017. Step 2: It was chaired by Dr K. Kasturirangan.'
    mistakes: {"Dr A. P. J. Abdul Kalam": "s9_kasturirangan"}
  - prompt: Ayushman Bharat PM-JAY, which gives health cover to poor families, is best described as a…
    options:
    - Scheme
    - Policy
    - Constitution
    - Court judgment
    answer: Scheme
    difficulty: 2
    hints:
    - It delivers specific benefits.
    - It comes under a health policy.
    solution: 'Step 1: The policy sets the goal; programmes plan it. Step 2: PM-JAY delivers benefits directly, so it is a scheme.'
    mistakes:
      Policy: policy_programme_scheme
  - prompt: Why is evaluation an important stage of the policy cycle?
    options:
    - It checks the impact and gives feedback to improve the policy
    - It ends the policy forever
    - It is only for show
    - It replaces implementation
    answer: It checks the impact and gives feedback to improve the policy
    difficulty: 2
    hints:
    - Did it work?
    - The cycle starts again.
    solution: 'Step 1: Evaluation measures results. Step 2: Its findings feed back into new or improved policy.'
    mistakes: {"It ends the policy forever": "s9_evaluation"}
  - prompt: Why do governments invite public suggestions while formulating a policy?
    options:
    - To include the views of those affected and make the policy better
    - Because the law forbids experts
    - To delay the policy
    - To avoid implementation
    answer: To include the views of those affected and make the policy better
    difficulty: 3
    hints:
    - Participation.
    - NEP got about two lakh suggestions.
    solution: 'Step 1: Citizens know their own problems. Step 2: Their input makes the policy fairer and more workable.'
    mistakes: {"To delay the policy": "s9_public_input"}
  - prompt: Which stage of the policy cycle comes first?
    options:
    - Identifying the problem
    - Evaluation
    - Implementation
    - Adoption
    answer: Identifying the problem
    difficulty: 1
    hints:
    - You can't solve what you haven't noticed.
    - It starts the cycle.
    solution: The cycle begins by recognising a public problem.
    mistakes:
      Evaluation: c9ss13_cycle_order
  - prompt: Officials visit schools to see whether a new mid-day meal rule is being followed. Which stage is this?
    options:
    - Monitoring
    - Formulation
    - Identifying the problem
    - Adoption
    answer: Monitoring
    difficulty: 2
    hints:
    - The rule is already in action.
    - They are checking on it.
    solution: Checking how a policy is being carried out is monitoring.
    mistakes:
      Formulation: c9ss13_cycle_order
  - prompt: Which policy did NEP 2020 replace?
    options:
    - The 1986 National Policy on Education
    - The Forest Rights Act
    - The Constitution
    - The National Health Policy
    answer: The 1986 National Policy on Education
    difficulty: 2
    hints:
    - It was an older education policy.
    - It was from the 1980s.
    solution: NEP 2020 replaced the National Policy on Education of 1986.
    mistakes:
      The National Health Policy: c9ss13_level
  - prompt: In which year was the committee to draft NEP 2020 set up?
    answer: 2017
    check: '2017'
    difficulty: 3
    hints:
    - Three years before approval.
    - Approval was in 2020.
    solution: 'Step 1: Approval came in 2020. Step 2: The committee was set up three years earlier, in 2017.'
    mistakes:
      '2020': c9ss13_cycle_order
  - prompt: The broad goal 'health for all' is best called a…
    options:
    - Policy
    - Scheme
    - Hospital
    - Court order
    answer: Policy
    difficulty: 2
    hints:
    - It is a big goal, not a specific benefit.
    - Programmes and schemes come from it.
    solution: A broad goal like 'health for all' is set by a policy.
    mistakes:
      Scheme: c9ss13_level
  - prompt: Parliament passes a law to give effect to a new policy. Which stage is this?
    options:
    - Adoption
    - Evaluation
    - Identifying the problem
    - Monitoring
    answer: Adoption
    difficulty: 2
    hints:
    - The plan is being made official.
    - Laws and rules are passed.
    solution: Making a policy official through laws and rules is adoption.
    mistakes:
      Monitoring: c9ss13_cycle_order
  - prompt: Why is public money involved in public policy?
    options:
    - Policies are paid for by taxes and serve the public
    - Policies are free
    - Only companies pay for them
    - Money is not needed
    answer: Policies are paid for by taxes and serve the public
    difficulty: 2
    hints:
    - Where does the government get money?
    - Who benefits?
    solution: Governments use tax money to carry out policies for the public good.
    mistakes:
      Policies are free: c9ss13_level
  - prompt: A study finds that a scheme reached only half the families it aimed at. What should happen next?
    options:
    - Use the feedback to improve the scheme
    - Hide the study
    - Stop all schemes forever
    - Ignore it
    answer: Use the feedback to improve the scheme
    difficulty: 3
    hints:
    - What is evaluation for?
    - The cycle continues.
    solution: 'Step 1: Evaluation shows the gap. Step 2: Feedback is used to change the scheme and reach more families.'
    mistakes:
      Hide the study: c9ss13_cycle_order
  - prompt: In which month and year did the Union Cabinet approve NEP 2020?
    options:
    - July 2020
    - January 2017
    - March 1986
    - August 2025
    answer: July 2020
    difficulty: 2
    hints:
    - The year is in its name.
    - Mid-year.
    solution: The Union Cabinet approved NEP in July 2020.
    mistakes:
      January 2017: c9ss13_cycle_order
