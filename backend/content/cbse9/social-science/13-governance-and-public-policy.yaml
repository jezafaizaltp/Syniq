# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 13. Format: content/README.md.
subject: cbse9-ss
chapter: 13
title: Governance and Public Policy
tips:
  government_governance: Government means the institutions (legislature, executive, judiciary); governance is the wider process of making and carrying out decisions, involving citizens, media and civil society too.
  policy_programme_scheme: A policy sets the broad goal, a programme is the plan to reach it, and a scheme delivers specific benefits to people.
  s9_accountability: "Being 'accountable' means you have to give an account of what you did."
  s9_adoption: "First the problem, then formulation, then the policy is formally approved before it is carried out."
  s9_egov: "Privatisation means handing work to private firms. Here the government itself delivers a service online. What is that called?"
  s9_evaluation: "Evaluation looks back at what happened. What is it for?"
  s9_judiciary: "The legislature makes laws and the executive carries them out. Who settles disputes?"
  s9_kasturirangan: "The NEP 2020 committee was chaired by a space scientist who once headed ISRO."
  s9_mundaka: "'Satyameva Jayate' comes from one of the Upanishads, not from the Constitution."
  s9_nep_year: "The NEP replaced a policy from 1986 and was approved in the year the COVID pandemic began."
  s9_public_input: "The people a policy affects know their own problems. Why ask them?"
  s9_transparency: "Good governance is open to citizens. Which choice is about openness?"
concepts:
- code: cbse9us.gov.good_governance
  title: Government, governance and good governance
  notes: |
    Government is the set of institutions that hold political authority: the legislature (makes laws), the
    executive (carries them out) and the judiciary (interprets them). Governance is wider: the whole process
    of making, implementing and monitoring decisions in the public interest, with citizens, media, civil
    society, the private sector and international bodies (such as the WHO) as stakeholders. India's
    traditions of governance include the Vedic sabha and samiti, the idea of rajadharma, and Kautilya's
    Arthashastra ("In the happiness of the people lies the happiness of the ruler"); the national motto
    Satyameva Jayate comes from the Mundaka Upanishad. Good governance has seven features: participation,
    transparency, accountability, rule of law, responsiveness, effectiveness and inclusiveness. E-governance
    uses digital technology to deliver services (online certificates, DigiLocker), share information and take
    feedback. Challenges include poor coordination, unequal access, misuse of office and misinformation.
  explanations:
    text: 'The government is the team on the field: legislature, executive and judiciary. Governance is the whole game, including the fans, referees and commentators: citizens, the media and civil society. Good governance means the game is open, fair and serves everyone.'
    visual: 'Draw a circle labelled ''Government'' (three boxes: legislature, executive, judiciary) inside a bigger circle labelled ''Governance'' with citizens, media, NGOs and businesses around it.'
    step_by_step: 'Step 1: Is it about institutions only? → government. Step 2: Does it include everyone involved in decisions? → governance. Step 3: Check the seven features: participation, transparency, accountability, rule of law, responsiveness, effectiveness, inclusiveness.'
    real_world: With the RTI Act, any citizen can ask a government office for information, which makes governance more transparent and accountable.
  picture:
    kind: compare
    columns:
    - title: Government
      points:
      - Legislature
      - Executive
      - Judiciary
    - title: Governance
      points:
      - Government
      - Citizens and media
      - Civil society, businesses
    alt: Government is the three institutions; governance includes them plus citizens, the media, civil society and businesses.
  activity:
    type: sort
    prompt: Which feature of good governance?
    bins:
    - Transparency
    - Accountability
    - Participation
    - Inclusiveness
    items:
    - label: Government spending posted online for all
      bin: Transparency
      clue: Can people see it?
      why: Transparency.
    - label: An official must answer for a failed project
      bin: Accountability
      clue: Who answers?
      why: Accountability.
    - label: Citizens give feedback on a new scheme
      bin: Participation
      clue: People take part.
      why: Participation.
    - label: Services reach remote villages and disabled people
      bin: Inclusiveness
      clue: No one left out.
      why: Inclusiveness.
  items:
  - prompt: Which of these is a feature of good governance?
    options:
    - Transparency
    - Secrecy
    - Favouritism
    - Delay
    answer: Transparency
    difficulty: 1
    hints:
    - Openness.
    - People can see how decisions are made.
    solution: 'Step 1: Good governance is open. Step 2: Transparency is one of its seven features.'
    mistakes: {"Secrecy": "s9_transparency"}
  - prompt: India's national motto 'Satyameva Jayate' is taken from the…
    options:
    - Mundaka Upanishad
    - Arthashastra
    - Rigveda
    - Constitution's Preamble
    answer: Mundaka Upanishad
    difficulty: 1
    hints:
    - An Upanishad.
    - It means 'Truth alone triumphs'.
    solution: 'Step 1: The motto means ''Truth alone triumphs''. Step 2: It comes from the Mundaka Upanishad.'
    mistakes: {"Constitution's Preamble": "s9_mundaka", "Rigveda": "s9_mundaka"}
  - prompt: Which part of government interprets laws and settles disputes?
    options:
    - Judiciary
    - Legislature
    - Executive
    - Media
    answer: Judiciary
    difficulty: 1
    hints:
    - Courts.
    - Not law-making.
    solution: 'Step 1: Courts interpret laws. Step 2: The courts form the judiciary.'
    mistakes: {"Legislature": "s9_judiciary", "Executive": "s9_judiciary"}
  - prompt: How is governance different from government?
    options:
    - Governance includes citizens, media and civil society, not just state institutions
    - They mean exactly the same thing
    - Governance means only the courts
    - Government is wider than governance
    answer: Governance includes citizens, media and civil society, not just state institutions
    difficulty: 2
    hints:
    - Think of who takes part.
    - Many stakeholders.
    solution: 'Step 1: Government is the institutions. Step 2: Governance is the wider process including many stakeholders.'
    mistakes:
      They mean exactly the same thing: government_governance
      Government is wider than governance: government_governance
  - prompt: A citizen applies for a caste certificate online and downloads it from DigiLocker. This is an example of…
    options:
    - E-governance
    - Rule by decree
    - Censorship
    - Privatisation
    answer: E-governance
    difficulty: 2
    hints:
    - Digital delivery of services.
    - No office visit needed.
    solution: 'Step 1: The service is delivered online. Step 2: Using technology for public services is e-governance.'
    mistakes: {"Privatisation": "s9_egov"}
  - prompt: Officials having to explain and answer for their decisions is called…
    options:
    - Accountability
    - Inclusiveness
    - Participation
    - Effectiveness
    answer: Accountability
    difficulty: 2
    hints:
    - Being answerable.
    - RTI helps it.
    solution: 'Step 1: Officials must justify actions to the public. Step 2: That is accountability.'
    mistakes: {"Participation": "s9_accountability"}
- code: cbse9us.gov.policy_cycle
  title: Public policy and the policy cycle
  notes: |
    Public policy is a planned course of action the government adopts to solve a public problem, paid for
    with public money and open to citizens' input. A policy sets the broad goal, a programme is the plan to
    reach it, and a scheme delivers specific benefits (for example, the National Health Policy 2017 led to
    programmes to strengthen healthcare and to the Ayushman Bharat PM-JAY scheme). The policy cycle has
    stages: identifying the problem (desirability), formulation (consulting stakeholders and drafting),
    adoption (laws and rules), implementation, monitoring and evaluation, whose feedback leads to changes.
    Example: the National Education Policy 2020. A need to replace the 1986 policy was recognised; a
    committee chaired by Dr K. Kasturirangan was set up in 2017; about two lakh suggestions were received; the
    Union Cabinet approved the policy in July 2020.
  explanations:
    text: A public policy is like a plan to fix a big problem for the whole country. First the problem is spotted, then experts and citizens suggest solutions, the government adopts a plan, puts it into action, checks how it's going, and improves it. Then the cycle begins again.
    visual: 'Draw a circle of six arrows: Problem → Formulation → Adoption → Implementation → Monitoring → Evaluation → back to Problem.'
    step_by_step: 'Step 1: Name the problem. Step 2: Draft options after consultation. Step 3: Adopt the policy. Step 4: Implement it through programmes and schemes. Step 5: Monitor progress. Step 6: Evaluate and feed back.'
    real_world: NEP 2020 took about five years from the start of consultation to Cabinet approval, and received around two lakh public suggestions.
  picture:
    kind: flow
    steps:
    - Identify the problem
    - Formulation
    - Adoption
    - Implementation
    - Monitoring
    - Evaluation and feedback
    alt: The six stages of the public policy cycle from identifying the problem to evaluation and feedback.
  activity:
    type: order
    prompt: 'Put the policy cycle in order (example: NEP 2020).'
    steps:
    - 'Identify the problem: the 1986 policy needs replacing'
    - 'Formulation: Kasturirangan committee, two lakh suggestions'
    - 'Adoption: Union Cabinet approves (July 2020)'
    - Implementation
    - Monitoring and evaluation, then changes
    reasons:
      'Formulation: Kasturirangan committee, two lakh suggestions': Drafting comes after the problem is agreed.
      'Adoption: Union Cabinet approves (July 2020)': A draft is approved after consultation.
      Implementation: Carry out only what has been adopted.
      Monitoring and evaluation, then changes: You can only judge a policy once it is running.
  items:
  - prompt: In the policy cycle, which stage comes right after formulation?
    options:
    - Adoption
    - Evaluation
    - Monitoring
    - Identifying the problem
    answer: Adoption
    difficulty: 1
    hints:
    - The draft becomes official.
    - Laws and rules are framed.
    solution: 'Step 1: Formulation produces a draft. Step 2: Next the government adopts it.'
    mistakes: {"Monitoring": "s9_adoption", "Evaluation": "s9_adoption"}
  - prompt: In which year was the National Education Policy approved by the Union Cabinet?
    answer: '2020'
    check: '2020'
    difficulty: 1
    hints:
    - Its name has the year.
    - July.
    solution: 'Step 1: The policy is called NEP 2020. Step 2: It was approved in July 2020.'
    mistakes: {"2019": "s9_nep_year", "1986": "s9_nep_year"}
  - prompt: Who chaired the committee that drafted the National Education Policy 2020?
    options:
    - Dr K. Kasturirangan
    - Dr B. R. Ambedkar
    - Dr A. P. J. Abdul Kalam
    - Dr M. S. Swaminathan
    answer: Dr K. Kasturirangan
    difficulty: 1
    hints:
    - A former ISRO chairman.
    - Committee set up in 2017.
    solution: 'Step 1: The committee was set up in 2017. Step 2: It was chaired by Dr K. Kasturirangan.'
    mistakes: {"Dr A. P. J. Abdul Kalam": "s9_kasturirangan"}
  - prompt: Ayushman Bharat PM-JAY, which gives health cover to poor families, is best described as a…
    options:
    - Scheme
    - Policy
    - Constitution
    - Court judgment
    answer: Scheme
    difficulty: 2
    hints:
    - It delivers specific benefits.
    - It comes under a health policy.
    solution: 'Step 1: The policy sets the goal; programmes plan it. Step 2: PM-JAY delivers benefits directly, so it is a scheme.'
    mistakes:
      Policy: policy_programme_scheme
  - prompt: Why is evaluation an important stage of the policy cycle?
    options:
    - It checks the impact and gives feedback to improve the policy
    - It ends the policy forever
    - It is only for show
    - It replaces implementation
    answer: It checks the impact and gives feedback to improve the policy
    difficulty: 2
    hints:
    - Did it work?
    - The cycle starts again.
    solution: 'Step 1: Evaluation measures results. Step 2: Its findings feed back into new or improved policy.'
    mistakes: {"It ends the policy forever": "s9_evaluation"}
  - prompt: Why do governments invite public suggestions while formulating a policy?
    options:
    - To include the views of those affected and make the policy better
    - Because the law forbids experts
    - To delay the policy
    - To avoid implementation
    answer: To include the views of those affected and make the policy better
    difficulty: 3
    hints:
    - Participation.
    - NEP got about two lakh suggestions.
    solution: 'Step 1: Citizens know their own problems. Step 2: Their input makes the policy fairer and more workable.'
    mistakes: {"To delay the policy": "s9_public_input"}
