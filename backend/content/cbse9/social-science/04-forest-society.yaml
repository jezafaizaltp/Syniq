# CBSE Class 9 Social Science (NCERT), History chapter 4. See chapter 1 for numbering.
subject: cbse9-ss
chapter: 4
title: Forest Society and Colonialism

tips:
  forest_act_classes: "The 1878 Forest Act divided forests into reserved (best, no access), protected and village forests."
  shifting_cultivation: "Shifting cultivation (jhum, podu, bewar, penda) clears a patch by cutting and burning, grows crops for a few years, then leaves it to regrow."

concepts:
  - code: cbse9ss.forest.colonial
    title: Why forests disappeared under colonial rule
    notes: |
      Deforestation from 1880s: land for cultivation (commercial crops like jute, sugar, wheat, cotton),
      railway sleepers (each mile needed 1,760–2,000 sleepers), plantations (tea, coffee, rubber). British
      needed oak forests for the Royal Navy. Dietrich Brandis, first Inspector General of Forests (1864),
      set up the Indian Forest Service; Imperial Forest Research Institute at Dehradun (1906) taught
      scientific forestry (plantations of single species). Forest Acts of 1865, 1878 (amended), 1927:
      reserved, protected and village forests. Shifting cultivation banned.
    explanations:
      text: "Under British rule, huge areas of India's forests were cut down. Land was cleared for commercial crops, timber went into railway sleepers and ships, and hillsides became tea and coffee plantations. The British set up a Forest Department, led by Dietrich Brandis, and Forest Acts that took forests away from the communities who had always used them."
      visual: "Draw a forest on the left. Arrows lead out of it to a railway track (sleepers), a ship (timber for the Navy), a tea estate, and a farm field. On the right, a villager standing outside a fence marked 'Reserved Forest: no entry'."
      step_by_step: "Step 1: Why cut forests? Crops, railways, ships, plantations. Step 2: Who managed them? The Forest Department under Brandis (1864). Step 3: How? Forest Acts dividing forests into reserved, protected and village. Step 4: Effect: villagers lost access to grazing, firewood, fruits and hunting."
      real_world: "Old railway lines through the Western Ghats were laid on wooden sleepers cut from local forests. Today, many tea and coffee estates in Munnar and Coorg stand on land that was once dense forest."
    picture:
      kind: compare
      columns:
      - title: Why forests were cut
        points: [Sleepers for the railways, Timber for the Royal Navy's ships, 'Tea, coffee and rubber plantations', More farmland]
      - title: What it did to people
        points: ['Villagers lost grazing, firewood and food', Shifting cultivation was banned, Forest laws made locals trespassers]
      alt: Under colonial rule forests were cut for railways, ships, plantations and farms, and forest people lost grazing, firewood, food and their way of farming.
    items:
      - prompt: "Who was the first Inspector General of Forests in India?"
        options: ["Dietrich Brandis", "Lord Dalhousie", "Warren Hastings", "Verrier Elwin"]
        answer: "Dietrich Brandis"
        difficulty: 1
        hints: ["A German forest expert.", "Appointed in 1864."]
        solution: "Dietrich Brandis became the first Inspector General of Forests."
      - prompt: "In which year was the Indian Forest Service set up?"
        answer: "1864"
        check: "1864"
        difficulty: 2
        hints: ["Same year Brandis was appointed.", "1860s."]
        solution: "The Indian Forest Service was set up in 1864."
      - prompt: "Which were the best forests under the 1878 Forest Act?"
        options: ["Reserved forests", "Protected forests", "Village forests", "Sacred groves"]
        answer: "Reserved forests"
        difficulty: 1
        hints: ["Villagers couldn't take anything from them.", "Kept for the state."]
        solution: "Reserved forests were the best, with no access for villagers."
        mistakes: {"Village forests": forest_act_classes}
      - prompt: "Why did the railways need so much forest wood?"
        options: ["For sleepers and fuel", "For station roofs only", "For coaches only", "They didn't use wood"]
        answer: "For sleepers and fuel"
        difficulty: 1
        hints: ["Tracks lay on wooden bars.", "Early engines burned wood."]
        solution: "Wood was used for railway sleepers and as fuel for engines."
      - prompt: "Where was the Imperial Forest Research Institute set up in 1906?"
        options: ["Dehradun", "Shimla", "Kolkata", "Bengaluru"]
        answer: "Dehradun"
        difficulty: 2
        hints: ["In present-day Uttarakhand.", "Still a forest research centre."]
        solution: "It was set up at Dehradun."
      - prompt: "Each mile of railway track needed about how many sleepers (lower figure)?"
        answer: "1760"
        check: "1760"
        difficulty: 3
        hints: ["Between 1,760 and 2,000.", "The lower number."]
        solution: "Between 1,760 and 2,000 sleepers were needed per mile."

  - code: cbse9ss.forest.people
    title: Forest communities and rebellion
    after: [cbse9ss.forest.colonial]
    notes: |
      Forest communities depended on forests for food, medicine, fodder, materials and shifting
      cultivation (jhum, podu, bewar, penda). Colonial laws made these 'illegal'; forced labour (begar),
      'forest villages' for labour. Bastar rebellion (1910) led by Gunda Dhur, against reservation of
      forests. In Java, the Dutch had similar policies; the Saminist movement (Surontiko Samin) challenged
      state ownership of forests. Wars (World Wars) increased cutting. New trends: community forest
      management.
    explanations:
      text: "For forest communities, the forest was home, market and pharmacy. Colonial laws banned shifting cultivation, hunting and collecting, and forced many into labour. People resisted: in Bastar in 1910, adivasis led by Gunda Dhur rose against the reservation of their forests. In Java, under the Dutch, the Saminists argued that the forest belonged to the people, not the state."
      visual: "Draw a circle labelled 'forest' with arrows to food, medicine, fodder, houses and farming. Then draw a big X across them labelled 'Forest Acts', and a crowd with drums labelled 'Bastar 1910'."
      step_by_step: "Step 1: List what forest people needed. Step 2: See which colonial laws stopped each one. Step 3: Note the response: protest, migration or rebellion. Step 4: Compare Bastar (India) with Java (Dutch colony): same pattern."
      real_world: "Today, Joint Forest Management lets villagers in many states protect forests and share in their produce, an attempt to undo the colonial idea that forests and people should be kept apart."
    items:
      - prompt: "Who led the Bastar rebellion of 1910?"
        options: ["Gunda Dhur", "Birsa Munda", "Surontiko Samin", "Alluri Sitarama Raju"]
        answer: "Gunda Dhur"
        difficulty: 1
        hints: ["From village Nethanar.", "Bastar is in present-day Chhattisgarh."]
        solution: "Gunda Dhur led the Bastar rebellion."
      - prompt: "In which year did the Bastar rebellion take place?"
        answer: "1910"
        check: "1910"
        difficulty: 1
        hints: ["Early 20th century.", "Four years before the First World War."]
        solution: "The Bastar rebellion took place in 1910."
      - prompt: "What is shifting cultivation?"
        options: ["Clearing and burning a patch, farming it, then moving on", "Growing crops in terraces", "Growing only rice in rows", "Farming with machines"]
        answer: "Clearing and burning a patch, farming it, then moving on"
        difficulty: 1
        hints: ["Also called slash-and-burn.", "The land rests and regrows."]
        solution: "Parts of the forest are cut and burnt, crops grown, then the land is left to regrow."
        mistakes: {"Growing crops in terraces": shifting_cultivation}
      - prompt: "The Saminist movement against state control of forests took place in…"
        options: ["Java", "Bastar", "Bengal", "Kenya"]
        answer: "Java"
        difficulty: 2
        hints: ["A Dutch colony.", "Now part of Indonesia."]
        solution: "The Saminist movement was in Java."
      - prompt: "Which of these is a local name for shifting cultivation in India?"
        options: ["Jhum", "Kharif", "Taille", "Begar"]
        answer: "Jhum"
        difficulty: 2
        hints: ["Used in the north-east.", "Others: podu, bewar, penda."]
        solution: "Jhum is a name for shifting cultivation in north-east India."
        mistakes: {"Begar": shifting_cultivation}
      - prompt: "Why did the colonial government ban shifting cultivation?"
        options: ["It made forests hard to manage for timber and taxes", "It produced too much food", "It used too much water", "Villagers asked for the ban"]
        answer: "It made forests hard to manage for timber and taxes"
        difficulty: 3
        hints: ["The state wanted timber for railways.", "Moving fields are hard to tax."]
        solution: "Foresters thought burning wasted timber and fields that moved were hard to tax."
