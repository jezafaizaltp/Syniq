# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 1. Format: content/README.md.
subject: cbse9-ss
chapter: 1
title: Understanding Social Science
tips:
  ss_branches: "Each branch of social science has its own question: the past, places, power and government, or using scarce money and resources."
  s9_connected: "Look for the choice where one event spreads into several areas of life at once."
  s9_many_sources: "One source shows one side. Think about what a second view adds to the picture."
  s9_river_dispute: "A river is a feature of the land, and sharing it between states needs rules and decisions. Which two subjects cover those?"
  s9_sources_history: "Coins and old buildings are clues left behind from the past. Which subject studies the past?"
concepts:
- code: cbse9us.intro.branches
  title: What social science studies
  notes: |
    Social science studies people living together in society: how they lived in the past, where and in what
    surroundings they live, how they govern themselves and how they earn, spend and share resources. Its four
    main parts are History (the past, using sources such as inscriptions, coins, texts and archaeology),
    Geography (Earth, places, resources and how people and environment shape each other), Political Science
    (power, government, rights, laws and citizenship) and Economics (choices about scarce resources,
    production, markets and livelihoods). The parts are connected: a river (geography) shapes where cities
    grew (history), how water is shared between states (politics) and what crops people grow and sell
    (economics). Social science asks big questions, looks at evidence and different points of view, and helps
    us become informed citizens.
  explanations:
    text: 'Social science is the study of us: people living together. History asks what happened before, Geography asks where and why there, Political Science asks who decides and how, and Economics asks how we make, share and choose with limited things. One event, like a flood, touches all four.'
    visual: 'Draw a river in the middle of a page with four arrows: History (old towns on its banks), Geography (where it flows, its floods), Political Science (states sharing its water) and Economics (farmers and fishers who earn from it).'
    step_by_step: 'Step 1: Ask what the question is about. Step 2: The past → History. Step 3: Places and nature → Geography. Step 4: Power, laws, government → Political Science. Step 5: Money, work, choices → Economics. Step 6: Look for links between them.'
    real_world: Kerala's 2018 floods were studied by geographers (rain and rivers), historians (earlier floods like 1924), political scientists (how relief was organised) and economists (losses to farms and jobs).
  picture:
    kind: compare
    columns:
    - title: History and Geography
      points:
      - 'History: the past'
      - 'Geography: places, nature'
    - title: Politics and Economics
      points:
      - 'Political Science: power, laws'
      - 'Economics: choices, resources'
    alt: 'The four parts of social science: History, Geography, Political Science and Economics, and what each studies.'
  activity:
    type: sort
    prompt: Which branch of social science asks this?
    bins:
    - History
    - Geography
    - Political Science
    - Economics
    items:
    - label: What do Ashoka's inscriptions tell us?
      bin: History
      clue: The past, from sources.
      why: History.
    - label: Why did cities grow by this river?
      bin: Geography
      clue: Places and environment.
      why: Geography.
    - label: How should river water be shared between states?
      bin: Political Science
      clue: Power and laws.
      why: Political science.
    - label: What crops should a farmer grow and sell?
      bin: Economics
      clue: Choices about scarce resources.
      why: Economics.
    - label: Who has the right to vote?
      bin: Political Science
      clue: Rights and citizenship.
      why: Political science.
    - label: Where are coal and iron found?
      bin: Geography
      clue: Resources on Earth.
      why: Geography.
  lesson:
    - teach: 'Social science studies people living together. It asks four kinds of questions. History: what happened in the past, and how do we know? Geography: where do people live, and how do land, water and climate shape their lives? Political Science: who holds power, how are rules made, what rights do people have? Economics: how do people make, share and spend scarce resources?'
      picture:
        kind: compare
        columns:
        - title: Branch
          points:
          - History
          - Geography
          - Political Science
          - Economics
        - title: Its question
          points:
          - What happened before?
          - Where, and why there?
          - Who decides, and how?
          - How do we use scarce resources?
        alt: The four branches of social science, each with its own guiding question.
      check:
        prompt: Why a village has a weekly market, and what prices are paid there, is mainly a question for…
        options:
        - Economics
        - History
        - Geography
        answer: Economics
        why: Buying, selling and prices are about using scarce resources.
    - teach: 'History uses sources: inscriptions on stone, coins, old texts, buildings and objects dug up by archaeologists. Each source shows only part of the story, and some are written from one side, so historians compare many sources before deciding.'
      check:
        prompt: A king's own inscription praises his victories. What should a historian do?
        options:
        - Check it against other sources
        - Accept every word
        - Ignore all inscriptions
        answer: Check it against other sources
        why: A ruler's record may show only his side; other sources give balance.
    - teach: 'The branches are connected. Think of the monsoon: geography explains the rain; when it fails, crops and prices change (economics); the government plans relief (political science); and old records of famines are history. A good social scientist looks at all sides, uses evidence and respects different points of view.'
      check:
        prompt: Which pair of branches is MOST involved in deciding where to build a new dam?
        options:
        - Geography and Political Science
        - History and Economics only
        - None
        answer: Geography and Political Science
        why: The site depends on the land and river; the decision is made by government.
  items:
  - prompt: Which part of social science studies how governments are formed and how laws are made?
    options:
    - Political Science
    - Geography
    - Economics
    - History
    answer: Political Science
    difficulty: 1
    hints:
    - Think of power and rules.
    - Elections and Parliament.
    solution: 'Step 1: Governments and laws are about power and rules. Step 2: That is Political Science.'
    mistakes:
      Economics: ss_branches
  - prompt: A study of how people choose to spend limited money and resources belongs mainly to…
    options:
    - Economics
    - History
    - Geography
    - Political Science
    answer: Economics
    difficulty: 1
    hints:
    - Scarcity and choice.
    - Markets and livelihoods.
    solution: 'Step 1: Limited resources mean choices. Step 2: Studying those choices is Economics.'
    mistakes:
      Political Science: ss_branches
  - prompt: Coins, inscriptions and old buildings are sources mainly used in…
    options:
    - History
    - Economics
    - Geography
    - Political Science
    answer: History
    difficulty: 1
    hints:
    - They tell us about the past.
    - Archaeologists dig them up.
    solution: 'Step 1: These are traces left by people long ago. Step 2: Historians use them as sources.'
    mistakes: {"Economics": "s9_sources_history", "Geography": "s9_sources_history"}
  - prompt: Why does a social scientist look at more than one source or point of view?
    options:
    - To get a fuller and fairer picture
    - To make the work longer
    - Because one source is always false
    - To avoid using evidence
    answer: To get a fuller and fairer picture
    difficulty: 2
    hints:
    - Each source sees part of the story.
    - Different people experience events differently.
    solution: 'Step 1: Every source has its own view. Step 2: Comparing several gives a fuller, fairer understanding.'
    mistakes: {"Because one source is always false": "s9_many_sources"}
  - prompt: Two states argue over sharing a river's water. Which two parts of social science are MOST involved?
    options:
    - Geography and Political Science
    - History and Economics only
    - Only History
    - Only Economics
    answer: Geography and Political Science
    difficulty: 2
    hints:
    - Where does the river flow?
    - Who decides how it is shared?
    solution: 'Step 1: The river''s course and water are geography. Step 2: Deciding and governing the sharing is political science.'
    mistakes: {"History and Economics only": "s9_river_dispute", "Only Economics": "s9_river_dispute"}
  - prompt: Which statement best shows that the parts of social science are connected?
    options:
    - A monsoon failure affects crops, prices and government relief
    - History only studies kings
    - Geography is only about maps
    - Economics never studies people
    answer: A monsoon failure affects crops, prices and government relief
    difficulty: 3
    hints:
    - Look for one event touching many areas.
    - Weather, money, government.
    solution: 'Step 1: The monsoon is geography. Step 2: Crops and prices are economics. Step 3: Relief is politics. One event links them all.'
    mistakes: {"Geography is only about maps": "s9_connected"}
  - prompt: Which branch of social science studies rivers, mountains, climate and where people live?
    options:
    - Geography
    - History
    - Economics
    - Political Science
    answer: Geography
    difficulty: 1
    hints:
    - It is about places and the Earth.
    - Maps are its main tool.
    solution: Geography studies the Earth, its places and how people and environment shape each other.
    mistakes:
      History: ss_branches
  - prompt: A study of the right to vote and how elections are held belongs mainly to…
    options:
    - Political Science
    - Geography
    - History
    - Economics
    answer: Political Science
    difficulty: 1
    hints:
    - It is about power, rights and government.
    - Voting chooses who governs.
    solution: Rights, elections and government are the subject of political science.
    mistakes:
      Economics: ss_branches
  - prompt: Which of these is a source for history?
    options:
    - An old coin found in a field
    - Tomorrow's weather forecast
    - A plan for a new road
    - A price list for next year
    answer: An old coin found in a field
    difficulty: 1
    hints:
    - History studies the past.
    - Which object comes from long ago?
    solution: An old coin is evidence left from the past, so it is a historical source.
    mistakes:
      Tomorrow's weather forecast: s9_sources_history
  - prompt: Who digs up and studies objects such as pots, tools and bones from the past?
    options:
    - Archaeologists
    - Economists
    - Geographers
    - Judges
    answer: Archaeologists
    difficulty: 2
    hints:
    - They excavate old sites.
    - Their work helps history.
    solution: Archaeologists excavate and study material remains of the past.
    mistakes:
      Geographers: ss_branches
  - prompt: A farmer asks whether to grow rice or cotton, which needs less water and earns more. Which two branches help most?
    options:
    - Geography and Economics
    - History and Political Science
    - Only History
    - Only Political Science
    answer: Geography and Economics
    difficulty: 2
    hints:
    - Water and soil are about the land.
    - Earnings are about money.
    solution: Water and soil are geography; costs and earnings are economics.
    mistakes:
      History and Political Science: s9_connected
  - prompt: Why do social scientists listen to people from different groups on the same issue?
    options:
    - Each group may see the issue differently, and all views matter
    - To find the one correct group
    - To save time
    - Because one view is always enough
    answer: Each group may see the issue differently, and all views matter
    difficulty: 2
    hints:
    - One source shows one side.
    - A fair picture needs several.
    solution: Different groups are affected differently, so hearing many views gives a fuller, fairer picture.
    mistakes:
      Because one view is always enough: s9_many_sources
  - prompt: Why do we study social science at school?
    options:
    - To understand society and become informed, responsible citizens
    - Only to memorise dates
    - Only to pass exams
    - To learn one correct opinion
    answer: To understand society and become informed, responsible citizens
    difficulty: 2
    hints:
    - Think about voting, rights and community life.
    - It is about how we live together.
    solution: Social science helps us understand how society works and take part in it wisely.
    mistakes:
      To learn one correct opinion: s9_many_sources
  - prompt: A flood damages crops in a district. Which shows how the branches connect?
    options:
    - Rain and rivers (geography) hit crops and prices (economics), and the government sends relief (political science)
    - Only geography matters
    - Only economics matters
    - Floods have nothing to do with society
    answer: Rain and rivers (geography) hit crops and prices (economics), and the government sends relief (political science)
    difficulty: 3
    hints:
    - Follow the flood's effects step by step.
    - One event touches several parts of life.
    solution: The flood is a geographic event with economic effects and a political response, showing how the branches connect.
    mistakes:
      Only geography matters: s9_connected
  - prompt: Two old accounts of a battle disagree on who won. What should a historian do?
    options:
    - Compare them with other evidence and ask who wrote each and why
    - Pick the longer one
    - Pick the older one only
    - Ignore the battle
    answer: Compare them with other evidence and ask who wrote each and why
    difficulty: 3
    hints:
    - Writers may have taken sides.
    - Look for more sources.
    solution: Historians weigh sources against each other and consider each writer's purpose.
    mistakes:
      Pick the longer one: s9_many_sources
