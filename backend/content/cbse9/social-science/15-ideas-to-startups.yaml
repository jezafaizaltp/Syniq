- code: cbse9us.startup.profit
  title: Revenue, costs and profit
  notes: |
    Revenue is the money a business earns from sales: price × quantity sold. Expenses are its costs. Fixed
    costs stay the same whatever the output (rent, salaries, loan interest); variable costs change with output
    (raw materials, packaging, electricity for machines). Total cost = fixed cost + variable cost. Profit =
    total revenue − total expenses; if expenses exceed revenue, there is a loss. A profit and loss account
    records these over a period such as a month or a year. Selling more spreads the fixed cost over more units,
    so the cost per unit falls. The break-even point is where revenue just equals total cost.
  explanations:
    text: If you sell 100 cups of lime juice at ₹20 each, your revenue is ₹2,000. If the stall rent is ₹500 and the lemons, sugar and cups cost ₹800, your total cost is ₹1,300. Your profit is ₹700.
    visual: 'Draw a juice stall. Above it, a bar for revenue ₹2,000; beside it a stacked bar: rent ₹500 (fixed) + lemons and cups ₹800 (variable) = ₹1,300. The gap between the bars is profit ₹700.'
    step_by_step: 'Step 1: Revenue = price × quantity. Step 2: Add fixed and variable costs. Step 3: Profit = revenue − total cost. Step 4: If negative, it''s a loss.'
    real_world: A small Kudumbashree catering unit counts its rent and staff as fixed costs and rice and vegetables as variable costs when pricing its meals.
  picture:
    kind: bars
    bars:
    - label: Revenue
      value: 2000
    - label: Total cost
      value: 1300
    - label: Profit
      value: 700
    unit: ₹
    caption: A lime juice stall's day
    alt: Revenue ₹2,000, total cost ₹1,300, so profit is ₹700.
  activity:
    type: formula
    prompt: A stall sells juice at ₹20 a cup. Fixed cost ₹300 a day; each cup costs ₹10 to make.
    inputs:
    - name: q
      label: Cups sold
      min: 0
      max: 60
      step: 5
      start: 0
    outputs:
    - name: r
      label: Revenue
      expr: 20*q
      unit: ₹
    - name: c
      label: Total cost
      expr: 300+10*q
      unit: ₹
    - name: pr
      label: Profit
      expr: 10*q-300
      unit: ₹
    goals:
    - prompt: Find the break-even point (no profit, no loss).
      want:
        pr: 0
      mistakes:
      - when:
          pr:
          - -300
          - -50
        say: 'Still a loss: revenue hasn''t covered the fixed ₹300 yet. Sell more.'
      - when:
          pr:
          - 50
          - 300
        say: That's already a profit. Break-even is where profit is exactly zero.
    - prompt: Make a profit of ₹200.
      want:
        pr: 200
      mistakes:
      - when:
          pr:
          - -300
          - -50
        say: 'A loss: each cup adds only ₹10 profit after its cost.'
  lesson:
    - teach: 'Revenue is the money a business earns from sales: price × quantity sold. Expenses are its costs. Fixed costs stay the same whatever is produced, like rent, salaries and loan interest. Variable costs change with output, like raw materials, packaging and power for machines. Total cost = fixed cost + variable cost.'
      picture:
        kind: compare
        columns:
        - title: Fixed costs
          points:
          - Rent
          - Salaries
          - Loan interest
        - title: Variable costs
          points:
          - Raw materials
          - Packaging
          - Power for machines
        alt: Fixed costs like rent and salaries compared with variable costs like raw materials and packaging.
      check:
        prompt: Flour used by a bakery is a…
        options:
        - Variable cost
        - Fixed cost
        - Revenue
        answer: Variable cost
        why: More bread needs more flour.
    - teach: 'Profit = total revenue − total expenses. If expenses are bigger, there is a loss. A profit and loss account records these for a month or a year. Selling more spreads the fixed cost over more units, so cost per unit falls. The break-even point is where revenue exactly equals total cost: no profit, no loss.'
      picture:
        kind: bars
        bars:
        - label: Revenue
          value: 5000
        - label: Fixed cost
          value: 1200
        - label: Variable cost
          value: 2000
        - label: Profit
          value: 1800
        unit: rupees
        alt: Revenue 5000 rupees, fixed cost 1200, variable cost 2000, leaving profit of 1800.
      check:
        prompt: In the picture, how is the profit found?
        options:
        - Revenue minus fixed and variable costs
        - Fixed plus variable costs
        - Revenue plus costs
        answer: Revenue minus fixed and variable costs
        why: 5,000 − (1,200 + 2,000) = 1,800.
  items:
  - prompt: A stall sells 50 samosas at ₹12 each. What is its revenue, in rupees?
    answer: '600'
    check: '600'
    difficulty: 1
    hints:
    - Revenue = price × quantity.
    - 12 × 50.
    solution: 'Step 1: Revenue = price × quantity. Step 2: 12 × 50 = ₹600.'
    mistakes: {"62": "s9_revenue", "500": "s9_revenue"}
  - prompt: Which of these is a fixed cost for a bakery?
    options:
    - Monthly shop rent
    - Flour
    - Sugar
    - Packaging boxes
    answer: Monthly shop rent
    difficulty: 1
    hints:
    - Same every month.
    - Doesn't change with output.
    solution: 'Step 1: Rent is paid whatever the sales. Step 2: So it is a fixed cost; the others are variable.'
    mistakes:
      Flour: c9us_fixed_variable
  - prompt: Revenue is ₹5,000 and total expenses are ₹3,200. What is the profit, in rupees?
    answer: '1800'
    check: '1800'
    difficulty: 1
    hints:
    - Profit = revenue − expenses.
    - 5,000 − 3,200.
    solution: 'Step 1: Profit = revenue − expenses. Step 2: 5,000 − 3,200 = ₹1,800.'
    mistakes:
      '8200': profit_formula
  - prompt: Fixed costs are ₹1,000 and variable costs are ₹1,500. Revenue is ₹2,200. What is the result?
    options:
    - A loss of ₹300
    - A profit of ₹300
    - A profit of ₹700
    - A profit of ₹1,200
    answer: A loss of ₹300
    difficulty: 2
    hints:
    - Total cost = fixed + variable.
    - Compare with revenue.
    solution: 'Step 1: Total cost = 1,000 + 1,500 = ₹2,500. Step 2: 2,200 − 2,500 = −300, a loss of ₹300.'
    mistakes:
      A profit of ₹1,200: profit_formula
      A profit of ₹700: profit_formula
  - prompt: If a business makes more units, what happens to its fixed cost per unit?
    options:
    - It falls
    - It rises
    - It stays the same
    - It becomes variable
    answer: It falls
    difficulty: 2
    hints:
    - The same rent spread over more items.
    - Divide by a bigger number.
    solution: 'Step 1: Total fixed cost stays the same. Step 2: Divided over more units, the cost per unit falls.'
    mistakes:
      It stays the same: c9us_fixed_variable
  - prompt: A tailor's fixed costs are ₹3,000 a month. Each shirt earns ₹150 more than its material costs. How many shirts must be sold to break even?
    answer: '20'
    check: '20'
    difficulty: 3
    hints:
    - Each shirt covers ₹150 of fixed cost.
    - 3,000 ÷ 150.
    solution: 'Step 1: Each shirt contributes ₹150 towards fixed costs. Step 2: 3,000 ÷ 150 = 20 shirts.'
    mistakes: {"200": "s9_break_even", "2": "s9_break_even"}
  - prompt: A juice stall sells 80 glasses at ₹15 each. What is its revenue, in rupees?
    answer: 1200
    check: 80 * 15
    difficulty: 1
    hints:
    - Revenue = price × quantity.
    - Multiply.
    solution: 'Step 1: 80 × 15. Step 2: Revenue is ₹1,200.'
    mistakes:
      '95': c9ss15_revenue
  - prompt: Which is a variable cost for a tailoring shop?
    options:
    - Cloth used for each shirt
    - Monthly shop rent
    - Fixed salary of the manager
    - Yearly loan interest
    answer: Cloth used for each shirt
    difficulty: 1
    hints:
    - Which one grows with more shirts?
    - Rent stays the same.
    solution: More shirts need more cloth, so cloth is a variable cost.
    mistakes:
      Monthly shop rent: c9ss15_cost_kind
  - prompt: Fixed costs are ₹2,000 and variable costs are ₹3,000. What is the total cost, in rupees?
    answer: 5000
    check: 2000 + 3000
    difficulty: 1
    hints:
    - Total cost has two parts.
    - Add them.
    solution: 'Step 1: 2,000 + 3,000. Step 2: Total cost is ₹5,000.'
    mistakes:
      '1000': c9ss15_cost_kind
  - prompt: Revenue is ₹8,000, fixed costs ₹3,000 and variable costs ₹4,000. What is the profit, in rupees?
    answer: 1000
    check: 8000 - (3000 + 4000)
    difficulty: 2
    hints:
    - Add both costs first.
    - Then subtract from revenue.
    solution: 'Step 1: Total cost = 3,000 + 4,000 = 7,000. Step 2: Profit = 8,000 − 7,000 = ₹1,000.'
    mistakes:
      '5000': c9ss15_profit_loss
      '4000': c9ss15_profit_loss
  - prompt: A business makes 100 units with a fixed cost of ₹1,000. Then it makes 200 units. What is the fixed cost per unit now, in rupees?
    answer: 5
    check: 1000 / 200
    difficulty: 2
    hints:
    - The fixed cost does not change.
    - Share it over 200 units.
    solution: 'Step 1: Fixed cost stays ₹1,000. Step 2: 1,000 ÷ 200 = ₹5 per unit.'
    mistakes:
      '10': c9ss15_cost_kind
  - prompt: At the break-even point…
    options:
    - Revenue equals total cost
    - Profit is the highest
    - Costs are zero
    - Revenue is zero
    answer: Revenue equals total cost
    difficulty: 2
    hints:
    - No profit, no loss.
    - The two sides balance.
    solution: Break-even is where revenue just covers all costs.
    mistakes:
      Profit is the highest: c9ss15_profit_loss
  - prompt: A candle maker's fixed costs are ₹1,200 a month. Each candle earns ₹30 more than its own material cost. How many candles must be sold to break even?
    answer: 40
    check: 1200 / 30
    difficulty: 3
    hints:
    - Each candle helps pay the fixed cost.
    - Divide the fixed cost by the amount each candle covers.
    solution: 'Step 1: Each candle covers ₹30 of fixed cost. Step 2: 1,200 ÷ 30 = 40 candles.'
    mistakes:
      '36000': c9ss15_break_even
      '1230': c9ss15_break_even
  - prompt: What does a profit and loss account show?
    options:
    - Revenue and expenses over a period, and the result
    - Only the owner's name
    - The number of customers' phones
    - The tax slab
    answer: Revenue and expenses over a period, and the result
    difficulty: 2
    hints:
    - Its name tells you.
    - It covers a month or a year.
    solution: It records income and costs for a period and shows profit or loss.
    mistakes:
      The tax slab: c9ss15_profit_loss
  - prompt: Revenue is ₹4,500 and total costs are ₹5,200. What is the result?
    options:
    - A loss of ₹700
    - A profit of ₹700
    - A profit of ₹9,700
    - Break-even
    answer: A loss of ₹700
    difficulty: 2
    hints:
    - Which is bigger, revenue or cost?
    - Find the difference.
    solution: 'Step 1: Costs exceed revenue. Step 2: 5,200 − 4,500 = ₹700 loss.'
    mistakes:
      A profit of ₹700: c9ss15_profit_loss
