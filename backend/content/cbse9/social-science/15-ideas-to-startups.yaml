    mistakes:
      Finance: c9ss15_function
  - prompt: A business plan section says 'college students near the campus'. Which part of the plan is this?
    options:
    - Customers
    - Location of the bank
    - Tax slab
    - Dividend
    answer: Customers
    difficulty: 2
    hints:
    - It names who will buy.
    - Target market.
    solution: Describing who will buy is the customers part of the plan.
    mistakes:
      Tax slab: c9ss15_plan_parts
  - prompt: Who began as a hotel clerk and built a luxury hotel chain?
    options:
    - Mohan Singh Oberoi
    - Lachit Borphukan
    - Dr K. Kasturirangan
