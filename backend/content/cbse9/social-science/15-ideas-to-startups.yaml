# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 15. Format: content/README.md.
subject: cbse9-ss
chapter: 15
title: From Ideas to Startups
tips:
  profit_formula: "Profit = total revenue − total expenses. Add all costs first. If expenses are larger than revenue, the result is a loss."
  c9us_fixed_variable: Fixed costs (rent, salaries) stay the same however much you produce; variable costs (raw materials, packaging) rise with output.
  s9_break_even: "Break even when the earnings cover the fixed costs: 3,000 ÷ 150."
  s9_business_plan: "A plan is a roadmap. Which choice describes a plan, not a loan or a form?"
  s9_hr: "Marketing sells the product. Which area looks after the people working in the business?"
  s9_lijjat: "Lijjat Papad is a famous women's cooperative that started very small."
  s9_revenue: "Revenue = number sold × price: 50 × 12."
  s9_risk_taker: "Entrepreneurs start something new to solve a problem, which always has some risk."
  s9_startup_rank: "India is near the very top, but the USA is still ahead. Recall the rank given in the chapter."
  s9_unicorn: "The name is a rare, magical animal, because such startups are rare."
  c9ss15_story: Recall the founders' story. How many people started it, where, and with how much money?
  c9ss15_function: Ask which job in a business this is about. Running daily work, handling money, looking after people, or selling to customers?
  c9ss15_plan_parts: A business plan answers who will buy, what it costs, where, who will work, at what price, and how people will hear of it.
  c9ss15_entrepreneur_trait: Think about what makes someone start something new when success is not certain.
  c9ss15_revenue: Revenue is all the money from sales. Multiply the price by how many were sold.
  c9ss15_cost_kind: Ask whether this cost changes when you make more, or stays the same even if you make nothing.
  c9ss15_profit_loss: Profit is what is left after all expenses. Add up every cost first, then take it away from revenue.
  c9ss15_break_even: At break-even the money earned on each unit above its own cost must pay off the fixed costs exactly. How many units does that take?
concepts:
- code: cbse9us.startup.entrepreneur
  title: Entrepreneurs, business plans and startups
  notes: |
    Entrepreneurship turns an idea into a business: spotting a problem or need, taking risk, combining land,
    labour and capital, and creating value. A business plan is a written roadmap: the need and idea, customers,
    money and costs, location, people, pricing, promotion and challenges. A business has four functional
    areas: management and operations, finance and accounting, human resources, and marketing and sales.
    Examples: Lijjat Papad began in 1959 when seven women in a Mumbai chawl started with ₹80, and grew into a
    large women's cooperative; Mohan Singh Oberoi began as a hotel clerk and built a luxury hotel chain; the
    Nattukottai Chettiars of Tamil Nadu were known for trust-based lending and trade across Southeast Asia.
    India is the world's third-largest startup ecosystem, with about 120 unicorns (startups valued over
    US$1 billion) in 2025, in sectors like e-commerce, fintech, health-tech and agri-tech, and hubs such as
    Bengaluru, Hyderabad, Mumbai and Delhi NCR. Startup India and Atmanirbhar Bharat support new businesses,
    as part of the vision of Viksit Bharat 2047.
  explanations:
    text: Every big business started as one person noticing a problem and daring to solve it. Lijjat Papad started with seven women and ₹80. An entrepreneur writes a plan, finds customers, manages money and people, and takes the risk.
    visual: Draw a light bulb (idea) → a notebook (business plan) → four boxes (operations, finance, people, marketing) → a shop with customers (business).
    step_by_step: 'Step 1: Spot a problem people have. Step 2: Think of a solution. Step 3: Write a business plan: customers, costs, price, place, people. Step 4: Organise the four functional areas. Step 5: Launch, learn and improve.'
    real_world: Kerala Startup Mission runs incubators in Kochi and Thiruvananthapuram where students can turn ideas into startups.
  picture:
    kind: flow
    steps:
    - Spot a problem
    - Idea for a solution
    - Business plan
    - Arrange money and people
    - Launch and sell
    - Learn and grow
    alt: The path from spotting a problem to an idea, a business plan, arranging resources, launching and growing a startup.
  activity:
    type: sort
    prompt: Which functional area of a business?
    bins:
    - Finance and accounting
    - Human resources
    - Marketing and sales
    - Management and operations
    items:
    - label: Keeping track of costs and profit
      bin: Finance and accounting
      clue: Money.
      why: Finance.
    - label: Hiring and training staff
      bin: Human resources
      clue: People.
      why: HR.
    - label: An advertisement for papads
      bin: Marketing and sales
      clue: Promotion.
      why: Marketing.
    - label: Planning daily production
      bin: Management and operations
      clue: Running things.
      why: Operations.
    - label: Setting the price
      bin: Marketing and sales
      clue: Pricing.
      why: Marketing.
  lesson:
    - teach: 'An entrepreneur turns an idea into a business: they spot a problem or need, take a risk, bring together land, labour and capital, and create value. In 1959 seven women in a Mumbai chawl started making papad with just ₹80. Lijjat Papad grew into a huge women''s cooperative. Mohan Singh Oberoi began as a hotel clerk and built a luxury hotel chain. The Nattukottai Chettiars of Tamil Nadu were known for trust-based lending and trade across South-East Asia.'
      check:
        prompt: With how much money did Lijjat Papad start?
        options:
        - ₹80
        - ₹80 lakh
        - ₹8 crore
        answer: ₹80
        why: Seven women began with just ₹80 in 1959.
    - teach: 'A business plan is a written roadmap: the need and the idea, the customers, the money and costs, the location, the people, the price, how it will be promoted, and the challenges. Every business has four functional areas: management and operations, finance and accounting, human resources (hiring, training and caring for people), and marketing and sales.'
      picture:
        kind: compare
        columns:
        - title: Functional area
          points:
          - Operations
          - Finance
          - Human resources
          - Marketing and sales
        - title: Job
          points:
          - Run daily work
          - Handle money and records
          - Hire and train people
          - Reach and sell to customers
        alt: The four functional areas of a business matched with what each one does.
      check:
        prompt: Keeping accounts and managing money belongs to…
        options:
        - Finance
        - Marketing
        - Human resources
        answer: Finance
        why: Finance and accounting look after money.
    - teach: India is the world's third-largest startup ecosystem, with about 120 unicorns (startups valued at over US$1 billion) in 2025, in e-commerce, fintech, health-tech and agri-tech. Hubs include Bengaluru, Hyderabad, Mumbai and Delhi NCR. Startup India and Atmanirbhar Bharat support new businesses, as part of the vision of Viksit Bharat 2047.
      check:
        prompt: A unicorn is a startup valued at over…
        options:
        - US$1 billion
        - US$1 million
        - ₹1 lakh
        answer: US$1 billion
        why: A billion-dollar startup is rare, like a unicorn.
  items:
  - prompt: Lijjat Papad was started in 1959 by…
    options:
    - Seven women in a Mumbai chawl
    - A large foreign company
    - The government of India
