    solution: M. S. Oberoi worked as a clerk and later founded the Oberoi hotels.
    mistakes:
      Amartya Sen: c9ss15_story
  - prompt: Which community of Tamil Nadu was known for trust-based lending and trade across South-East Asia?
    options:
    - The Nattukottai Chettiars
    - The Ahoms
