    answer: Seven women in a Mumbai chawl
    difficulty: 1
    hints:
    - They started with ₹80.
    - It became a women's cooperative.
    solution: 'Step 1: Lijjat began with seven women and ₹80. Step 2: It grew into a large cooperative.'
    mistakes: {"A large foreign company": "s9_lijjat"}
  - prompt: A startup valued at more than US$1 billion is called a…
    options:
    - Unicorn
    - Dragon
    - Tiger
    - Phoenix
    answer: Unicorn
    difficulty: 1
    hints:
    - A rare, magical animal.
    - India has about 120.
    solution: 'Step 1: Such startups are rare. Step 2: They are called unicorns.'
    mistakes: {"Dragon": "s9_unicorn"}
  - prompt: Which functional area of a business deals with hiring, training and motivating people?
    options:
    - Human resources
    - Marketing and sales
    - Finance and accounting
    - Operations
    answer: Human resources
    difficulty: 1
    hints:
    - People.
    - HR.
    solution: 'Step 1: Hiring and training are about people. Step 2: That is human resources.'
    mistakes: {"Marketing and sales": "s9_hr"}
  - prompt: What is a business plan?
    options:
    - A written roadmap of how a business will reach its goals
    - A bank loan
    - A tax form
    - A list of employees only
    answer: A written roadmap of how a business will reach its goals
    difficulty: 2
    hints:
    - Covers customers, costs, pricing.
    - Written before starting.
    solution: 'Step 1: It sets out the idea, customers, costs, pricing and challenges. Step 2: It is a roadmap for the business.'
    mistakes: {"A bank loan": "s9_business_plan"}
  - prompt: Which quality is most essential for an entrepreneur?
    options:
    - Willingness to take risks to solve a problem
