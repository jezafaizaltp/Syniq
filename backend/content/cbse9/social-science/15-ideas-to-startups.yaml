# CBSE Class 9 Social Science (NCERT Understanding Society: India and Beyond, Parts 1 and 2, 2026-27), chapter 15. Format: content/README.md.
subject: cbse9-ss
chapter: 15
title: From Ideas to Startups
tips:
  profit_formula: Profit = total revenue − total expenses; if expenses are larger, the result is a loss.
  fixed_variable: Fixed costs (rent, salaries) stay the same however much you produce; variable costs (raw materials, packaging) rise with output.
concepts:
- code: cbse9us.startup.entrepreneur
  title: Entrepreneurs, business plans and startups
  notes: |
    Entrepreneurship turns an idea into a business: spotting a problem or need, taking risk, combining land,
    labour and capital, and creating value. A business plan is a written roadmap: the need and idea, customers,
    money and costs, location, people, pricing, promotion and challenges. A business has four functional
    areas: management and operations, finance and accounting, human resources, and marketing and sales.
    Examples: Lijjat Papad began in 1959 when seven women in a Mumbai chawl started with ₹80, and grew into a
    large women's cooperative; Mohan Singh Oberoi began as a hotel clerk and built a luxury hotel chain; the
    Nattukottai Chettiars of Tamil Nadu were known for trust-based lending and trade across Southeast Asia.
    India is the world's third-largest startup ecosystem, with about 120 unicorns (startups valued over
    US$1 billion) in 2025, in sectors like e-commerce, fintech, health-tech and agri-tech, and hubs such as
    Bengaluru, Hyderabad, Mumbai and Delhi NCR. Startup India and Atmanirbhar Bharat support new businesses,
    as part of the vision of Viksit Bharat 2047.
  explanations:
    text: Every big business started as one person noticing a problem and daring to solve it. Lijjat Papad started with seven women and ₹80. An entrepreneur writes a plan, finds customers, manages money and people, and takes the risk.
    visual: Draw a light bulb (idea) → a notebook (business plan) → four boxes (operations, finance, people, marketing) → a shop with customers (business).
    step_by_step: 'Step 1: Spot a problem people have. Step 2: Think of a solution. Step 3: Write a business plan: customers, costs, price, place, people. Step 4: Organise the four functional areas. Step 5: Launch, learn and improve.'
    real_world: Kerala Startup Mission runs incubators in Kochi and Thiruvananthapuram where students can turn ideas into startups.
  picture:
    kind: flow
    steps:
    - Spot a problem
    - Idea for a solution
    - Business plan
    - Arrange money and people
    - Launch and sell
    - Learn and grow
    alt: The path from spotting a problem to an idea, a business plan, arranging resources, launching and growing a startup.
  items:
  - prompt: Lijjat Papad was started in 1959 by…
    options:
    - Seven women in a Mumbai chawl
    - A large foreign company
    - The government of India
    - A single factory owner
    answer: Seven women in a Mumbai chawl
    difficulty: 1
    hints:
    - They started with ₹80.
    - It became a women's cooperative.
    solution: 'Step 1: Lijjat began with seven women and ₹80. Step 2: It grew into a large cooperative.'
  - prompt: A startup valued at more than US$1 billion is called a…
    options:
    - Unicorn
    - Dragon
    - Tiger
    - Phoenix
    answer: Unicorn
    difficulty: 1
    hints:
    - A rare, magical animal.
    - India has about 120.
    solution: 'Step 1: Such startups are rare. Step 2: They are called unicorns.'
  - prompt: Which functional area of a business deals with hiring, training and motivating people?
    options:
    - Human resources
    - Marketing and sales
    - Finance and accounting
    - Operations
    answer: Human resources
    difficulty: 1
    hints:
    - People.
    - HR.
    solution: 'Step 1: Hiring and training are about people. Step 2: That is human resources.'
  - prompt: What is a business plan?
    options:
    - A written roadmap of how a business will reach its goals
    - A bank loan
    - A tax form
    - A list of employees only
    answer: A written roadmap of how a business will reach its goals
    difficulty: 2
    hints:
    - Covers customers, costs, pricing.
    - Written before starting.
    solution: 'Step 1: It sets out the idea, customers, costs, pricing and challenges. Step 2: It is a roadmap for the business.'
  - prompt: Which quality is most essential for an entrepreneur?
    options:
    - Willingness to take risks to solve a problem
    - Avoiding all change
    - Waiting for others to decide
    - Never spending money
    answer: Willingness to take risks to solve a problem
    difficulty: 2
    hints:
    - New businesses can fail.
    - Starting something new.
    solution: 'Step 1: A new business is uncertain. Step 2: Entrepreneurs accept that risk to create value.'
  - prompt: India ranks where among the world's startup ecosystems?
    options:
    - Third largest
    - Largest
    - Tenth
    - Twentieth
    answer: Third largest
    difficulty: 2
    hints:
    - After the USA and China.
    - About 120 unicorns.
    solution: 'Step 1: The USA and China lead. Step 2: India is the third-largest startup ecosystem.'
- code: cbse9us.startup.profit
  title: Revenue, costs and profit
  notes: |
    Revenue is the money a business earns from sales: price × quantity sold. Expenses are its costs. Fixed
    costs stay the same whatever the output (rent, salaries, loan interest); variable costs change with output
    (raw materials, packaging, electricity for machines). Total cost = fixed cost + variable cost. Profit =
    total revenue − total expenses; if expenses exceed revenue, there is a loss. A profit and loss account
    records these over a period such as a month or a year. Selling more spreads the fixed cost over more units,
    so the cost per unit falls. The break-even point is where revenue just equals total cost.
  explanations:
    text: If you sell 100 cups of lime juice at ₹20 each, your revenue is ₹2,000. If the stall rent is ₹500 and the lemons, sugar and cups cost ₹800, your total cost is ₹1,300. Your profit is ₹700.
    visual: 'Draw a juice stall. Above it, a bar for revenue ₹2,000; beside it a stacked bar: rent ₹500 (fixed) + lemons and cups ₹800 (variable) = ₹1,300. The gap between the bars is profit ₹700.'
    step_by_step: 'Step 1: Revenue = price × quantity. Step 2: Add fixed and variable costs. Step 3: Profit = revenue − total cost. Step 4: If negative, it''s a loss.'
    real_world: A small Kudumbashree catering unit counts its rent and staff as fixed costs and rice and vegetables as variable costs when pricing its meals.
  picture:
    kind: bars
    bars:
    - label: Revenue
      value: 2000
    - label: Total cost
      value: 1300
    - label: Profit
      value: 700
    unit: ₹
    caption: A lime juice stall's day
    alt: Revenue ₹2,000, total cost ₹1,300, so profit is ₹700.
  items:
  - prompt: A stall sells 50 samosas at ₹12 each. What is its revenue, in rupees?
    answer: '600'
    check: '600'
    difficulty: 1
    hints:
    - Revenue = price × quantity.
    - 12 × 50.
    solution: 'Step 1: Revenue = price × quantity. Step 2: 12 × 50 = ₹600.'
  - prompt: Which of these is a fixed cost for a bakery?
    options:
    - Monthly shop rent
    - Flour
    - Sugar
    - Packaging boxes
    answer: Monthly shop rent
    difficulty: 1
    hints:
    - Same every month.
    - Doesn't change with output.
    solution: 'Step 1: Rent is paid whatever the sales. Step 2: So it is a fixed cost; the others are variable.'
    mistakes:
      Flour: fixed_variable
  - prompt: Revenue is ₹5,000 and total expenses are ₹3,200. What is the profit, in rupees?
    answer: '1800'
    check: '1800'
    difficulty: 1
    hints:
    - Profit = revenue − expenses.
    - 5,000 − 3,200.
    solution: 'Step 1: Profit = revenue − expenses. Step 2: 5,000 − 3,200 = ₹1,800.'
    mistakes:
      '8200': profit_formula
  - prompt: Fixed costs are ₹1,000 and variable costs are ₹1,500. Revenue is ₹2,200. What is the result?
    options:
    - A loss of ₹300
    - A profit of ₹300
    - A profit of ₹700
    - A profit of ₹1,200
    answer: A loss of ₹300
    difficulty: 2
    hints:
    - Total cost = fixed + variable.
    - Compare with revenue.
    solution: 'Step 1: Total cost = 1,000 + 1,500 = ₹2,500. Step 2: 2,200 − 2,500 = −300, a loss of ₹300.'
    mistakes:
      A profit of ₹1,200: profit_formula
      A profit of ₹700: profit_formula
  - prompt: If a business makes more units, what happens to its fixed cost per unit?
    options:
    - It falls
    - It rises
    - It stays the same
    - It becomes variable
    answer: It falls
    difficulty: 2
    hints:
    - The same rent spread over more items.
    - Divide by a bigger number.
    solution: 'Step 1: Total fixed cost stays the same. Step 2: Divided over more units, the cost per unit falls.'
    mistakes:
      It stays the same: fixed_variable
  - prompt: A tailor's fixed costs are ₹3,000 a month. Each shirt earns ₹150 more than its material costs. How many shirts must be sold to break even?
    answer: '20'
    check: '20'
    difficulty: 3
    hints:
    - Each shirt covers ₹150 of fixed cost.
    - 3,000 ÷ 150.
    solution: 'Step 1: Each shirt contributes ₹150 towards fixed costs. Step 2: 3,000 ÷ 150 = 20 shirts.'
