    solution: 'Step 1: The USA and China lead. Step 2: India is the third-largest startup ecosystem.'
    mistakes: {"Largest": "s9_startup_rank", "Tenth": "s9_startup_rank"}
  - prompt: Lijjat Papad grew into what kind of organisation?
    options:
    - A women's cooperative
    - A government ministry
    - A foreign company
    - A bank
    answer: A women's cooperative
    difficulty: 2
    hints:
    - Its members share in its work and profit.
    - It was started by women.
    solution: Lijjat Papad is a cooperative owned and run by its women members.
    mistakes:
      A foreign company: c9ss15_story
  - prompt: Which functional area plans advertisements and talks to customers?
    options:
    - Marketing and sales
    - Finance
    - Human resources
    - Operations
    answer: Marketing and sales
    difficulty: 1
    hints:
    - It is about reaching buyers.
