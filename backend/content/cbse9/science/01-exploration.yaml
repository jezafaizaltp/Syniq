# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 1. Format: content/README.md.
subject: cbse9-sci
chapter: 1
title: 'Exploration: Entering the World of Secondary Science'
tips:
  fair_test_change_many: In a fair test you change only one thing (the variable you are testing) and keep everything else the same.
  hypothesis_is_result: A hypothesis is a testable guess made before the experiment, not the result you observe.
concepts:
- code: cbse9ex.science.method
  title: How scientists find things out
  notes: |
    Science is a way of asking questions about the world and testing answers with evidence. The usual cycle:
    observe, ask a question, make a hypothesis (a testable explanation), predict, test it with a fair
    experiment (change one variable, measure another, keep the rest controlled), record data, analyse, and
    conclude; results are shared and checked by others, and ideas change when new evidence appears. Measurements
    use SI units (metre, kilogram, second, kelvin, mole, ampere) and are repeated to reduce error.
  explanations:
    text: Scientists don't just guess and stop. They make a guess that can be tested (a hypothesis), design a fair test that changes only one thing, measure carefully, and see whether the evidence supports the guess. If it doesn't, they change the idea, not the data.
    visual: 'Draw a circle of arrows: Observe → Question → Hypothesis → Fair test → Results → Conclusion → back to new questions. Science goes round this loop again and again.'
    step_by_step: 'Step 1: Observe something and ask a question. Step 2: Write a hypothesis you can test. Step 3: Plan a fair test: change one variable, measure one, control the rest. Step 4: Repeat measurements and record them. Step 5: Decide whether the results support the hypothesis.'
    real_world: To see whether fertiliser helps beans grow, plant two identical pots in the same soil, light and water, and add fertiliser to only one. Anything else changed would spoil the test.
  picture:
    kind: flow
    steps:
    - Observe and ask a question
    - Make a testable hypothesis
    - Plan a fair test
    - Measure and record
    - Conclude and share
    - New questions
    alt: The cycle of science from observing and asking, through hypothesis, fair test and results, to a conclusion and new questions.
  items:
  - prompt: What is a hypothesis?
    options:
    - A testable explanation made before an experiment
    - The final result of an experiment
    - A proven law
    - A list of equipment
    answer: A testable explanation made before an experiment
    difficulty: 1
    hints:
    - It comes before the test.
    - It can turn out to be wrong.
    solution: 'Step 1: A hypothesis is a possible explanation. Step 2: It must be testable, and it comes before the experiment.'
    mistakes:
      The final result of an experiment: hypothesis_is_result
  - prompt: Which is the SI unit of mass?
    options:
    - Kilogram
    - Gram
    - Newton
    - Litre
    answer: Kilogram
    difficulty: 1
    hints:
    - Not the gram.
    - Newton is a force.
    solution: 'Step 1: The SI base unit of mass is the kilogram (kg).'
  - prompt: 'Testing whether temperature affects how fast sugar dissolves: what must stay the same?'
    options:
    - The amount of sugar, water and stirring
    - The temperature
    - 'Nothing: change everything'
    - Only the cup colour
    answer: The amount of sugar, water and stirring
    difficulty: 2
    hints:
    - Temperature is the thing being tested.
    - Everything else must be controlled.
    solution: 'Step 1: Only temperature changes. Step 2: Sugar amount, water volume and stirring stay the same so the test is fair.'
    mistakes:
      'Nothing: change everything': fair_test_change_many
  - prompt: Why do scientists repeat a measurement several times?
    options:
    - To reduce the effect of random errors
    - To make the result bigger
    - Because the first is always wrong
    - To use up the equipment
    answer: To reduce the effect of random errors
    difficulty: 2
    hints:
    - Each reading can be a little off.
    - Averaging helps.
    solution: 'Step 1: Every reading has small random errors. Step 2: Averaging several readings gives a more reliable value.'
  - prompt: An experiment does not support the hypothesis. What should the scientist do?
    options:
    - Change or reject the hypothesis and test again
    - Change the data to fit
    - Hide the results
    - Stop doing science
    answer: Change or reject the hypothesis and test again
    difficulty: 2
    hints:
    - Evidence decides.
    - Honesty in recording.
    solution: 'Step 1: Data is recorded honestly. Step 2: If it doesn''t support the idea, the idea is changed or rejected.'
  - prompt: 'Two pots of beans: A gets fertiliser and sunlight, B gets neither. A grows taller. What can we conclude?'
    options:
    - 'Nothing certain: two things were changed at once'
    - Fertiliser makes beans grow
    - Sunlight makes beans grow
    - Beans don't need water
    answer: 'Nothing certain: two things were changed at once'
    difficulty: 3
    hints:
    - How many things were different between A and B?
    - Which caused the difference?
    solution: 'Step 1: Both fertiliser and sunlight differed. Step 2: We can''t tell which one caused the extra growth: the test was not fair.'
    mistakes:
      Fertiliser makes beans grow: fair_test_change_many
