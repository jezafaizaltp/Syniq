# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 1. Format: content/README.md.
subject: cbse9-sci
chapter: 1
title: 'Exploration: Entering the World of Secondary Science'
tips:
  pqc9s1_mass_unit: "Kelvin is for temperature and ampere for current. Now look at the unit of mass: does the SI base unit have a prefix in its name?"
  fair_test_change_many: In a fair test you change only one thing (the variable you are testing) and keep everything else the same.
  hypothesis_is_result: A hypothesis is a testable guess made before the experiment, not the result you observe.
  honest_data: "Data is never changed to fit an idea. When results disagree with a hypothesis, which one gives way?"
  repeat_readings: "Every reading has small random errors. What does averaging several readings do to them?"
  si_base_units: "The SI unit for each quantity is fixed: force has its own unit named after a scientist, and the SI unit for mass is a thousand times bigger than the gram."
  c9s1_variable_roles: The variable you change on purpose is the independent one; the one you measure is the dependent one; everything else is kept the same (controlled). Which role does this one play?
  pqc9s1_one_change: In a fair test only one thing is changed on purpose. Look for the choice that changes exactly one.
concepts:
- code: cbse9ex.science.method
  title: How scientists find things out
  notes: |
    Science is a way of asking questions about the world and testing answers with evidence. The usual cycle:
    observe, ask a question, make a hypothesis (a testable explanation), predict, test it with a fair
    experiment (change one variable, measure another, keep the rest controlled), record data, analyse, and
    conclude; results are shared and checked by others, and ideas change when new evidence appears. Measurements
    use SI units (metre, kilogram, second, kelvin, mole, ampere) and are repeated to reduce error.
  explanations:
    text: Scientists don't just guess and stop. They make a guess that can be tested (a hypothesis), design a fair test that changes only one thing, measure carefully, and see whether the evidence supports the guess. If it doesn't, they change the idea, not the data.
    visual: 'Draw a circle of arrows: Observe → Question → Hypothesis → Fair test → Results → Conclusion → back to new questions. Science goes round this loop again and again.'
    step_by_step: 'Step 1: Observe something and ask a question. Step 2: Write a hypothesis you can test. Step 3: Plan a fair test: change one variable, measure one, control the rest. Step 4: Repeat measurements and record them. Step 5: Decide whether the results support the hypothesis.'
    real_world: To see whether fertiliser helps beans grow, plant two identical pots in the same soil, light and water, and add fertiliser to only one. Anything else changed would spoil the test.
  picture:
    kind: flow
    steps:
    - Observe and ask a question
    - Make a testable hypothesis
    - Plan a fair test
    - Measure and record
    - Conclude and share
    - New questions
    alt: The cycle of science from observing and asking, through hypothesis, fair test and results, to a conclusion and new questions.
  activity:
    type: sort
    prompt: 'Fair test: ''Does the amount of sunlight change how tall bean plants grow?'' What do you do with each thing?'
    bins:
    - Change it
    - Measure it
    - Keep it the same
    items:
    - label: Hours of sunlight each day
      bin: Change it
      clue: What is the question asking about?
      why: The question is about sunlight, so that's the one thing you change on purpose.
    - label: Height of the plants after 3 weeks
      bin: Measure it
      clue: Is this something you set, or something you find out at the end?
      why: Height is the result you look at, to see whether sunlight made a difference.
    - label: Amount of water each day
      bin: Keep it the same
      clue: If one plant got more water, could you tell what made it taller?
      why: Water also affects growth. Keep it equal so only sunlight differs.
    - label: Kind of bean seed
      bin: Keep it the same
      clue: Could a different seed grow taller by itself?
      why: Different seeds grow differently, so use the same kind for every plant.
    - label: Size of the pot
      bin: Keep it the same
      clue: Could a bigger pot change the result on its own?
      why: 'Pot size changes root room. Keep it the same: a controlled variable.'
    - label: Type of soil
      bin: Keep it the same
      clue: Would richer soil spoil a fair comparison?
      why: Soil affects growth, so keep it the same for every plant.
    - label: Temperature of the room
      bin: Keep it the same
      clue: If the sunny plants were also warmer, what would you be testing?
      why: Warmth could make plants taller too. Keep it the same, so only sunlight changes.
  lesson:
    - teach: 'Science is a way of asking questions and testing answers with evidence. It often starts with an observation: ''The milk went sour faster in summer.'' Then a question: ''Does temperature affect how fast milk sours?'''
      check:
        prompt: Which of these is a scientific question that can be tested?
        options:
        - Does salt make ice melt faster?
        - Is blue the nicest colour?
        - Will I be happy tomorrow?
        answer: Does salt make ice melt faster?
        why: We can test it by measuring melting with and without salt.
      ways:
      - style: visual
        teach: Science moves in a loop from noticing to testing.
        picture:
          kind: flow
          steps:
          - Observe
          - Ask a question
          - Hypothesis
          - Prediction
          - Test
          - Conclude
          alt: 'The science loop: observe, ask a question, make a hypothesis, predict, test, then conclude, and start again if needed.'
      - style: real_world
        teach: You notice the school garden's tomato plants near the wall are smaller. That is an observation. 'Do the wall plants get less sunlight?' is the question that starts a scientific test.
    - teach: 'A hypothesis is a possible explanation that we can test: ''Milk sours faster when warm, because bacteria grow faster in warmth.'' From it we make a prediction: ''Milk kept at 35 °C will sour before milk kept at 5 °C.'''
      check:
        prompt: 'Quick check: What is a hypothesis?'
        options:
        - A testable explanation made before testing
        - The result of an experiment
        - A proven law
        answer: A testable explanation made before testing
        why: It comes before the test; the experiment then supports it or not.
      ways:
      - style: step_by_step
        teach: 'Step 1: Write a possible reason: ''warm milk sours faster because bacteria grow faster''. Step 2: Turn it into a prediction you can check: ''milk at 35 °C sours before milk at 5 °C''. Step 3: Test it.'
      - style: real_world
        teach: A cricket coach guesses 'the team loses because players are tired'. A prediction would be 'after a rest day, the team will score more'. Only a prediction like this can be checked in the next match.
      - style: visual
        teach: From a hypothesis to a prediction you can check, for the milk test.
        picture:
          kind: flow
          steps:
          - 'Hypothesis: warmth helps bacteria grow'
          - 'Prediction: milk at 35 °C sours first'
          - Test both temperatures
          alt: The hypothesis that warmth helps bacteria grow leads to the prediction that milk at 35 degrees sours before milk at 5 degrees, which can then be tested.
    - teach: 'A fair test changes one thing (the independent variable), measures one thing (the dependent variable) and keeps everything else the same (controlled variables). For the milk test: change temperature, measure time to sour, keep the same milk, amount and container.'
      picture:
        kind: flow
        steps:
        - Observe
        - Ask a question
        - Hypothesis and prediction
        - Fair test
        - Record and analyse data
        - Conclude and share
        alt: The cycle of science from observation to question, hypothesis, fair test, data and conclusion.
      check:
        prompt: In the milk test, which is the dependent variable?
        options:
        - Time taken to sour
        - Temperature
        - Type of container
        answer: Time taken to sour
        why: It is what we measure, and it depends on what we changed.
      ways:
      - style: visual
        teach: In the milk test, one thing changes, one is measured, the rest stay the same.
        picture:
          kind: compare
          columns:
          - title: Change (independent)
            points:
            - temperature
          - title: Measure (dependent)
            points:
            - time to sour
          - title: Keep same (controlled)
            points:
            - milk type
            - amount
            - container
          alt: In the milk test, temperature is changed, time to sour is measured, and milk type, amount and container are kept the same.
      - style: step_by_step
        teach: 'Step 1: Pick the ONE thing you will change. Step 2: Pick what you will measure. Step 3: List everything else that could affect the result. Step 4: Keep all of those the same in every trial.'
    - teach: Measure carefully in SI units (metre, kilogram, second, kelvin, ampere, mole, candela), repeat readings to reduce random errors, and record data honestly, even when it doesn't match your guess. If the results don't support the hypothesis, change it and test again.
      check:
        prompt: Why repeat a measurement three times?
        options:
        - To reduce the effect of random errors
        - To make the table longer
        - To get the answer you wanted
        answer: To reduce the effect of random errors
        why: The average of repeats is more reliable than one reading.
      ways:
      - style: step_by_step
        teach: 'Step 1: Measure in SI units (m, kg, s). Step 2: Take at least three readings and average them. Step 3: Write down every result, even odd ones. Step 4: If results don''t match the hypothesis, change the hypothesis, not the data.'
      - style: visual
        teach: Three readings of the same swing time, and their average.
        picture:
          kind: bars
          bars:
          - label: trial 1
            value: 2.1
          - label: trial 2
            value: 1.9
          - label: trial 3
            value: 2.0
          - label: average
            value: 2.0
          alt: Three timings of 2.1, 1.9 and 2.0 seconds average to 2.0 seconds, which is more reliable than any single reading.
  items:
  - prompt: What is a hypothesis?
    options:
    - "A testable explanation made before an experiment"
    - "The final result written down after an experiment"
    - "A law that has already been proved many times"
    - "A list of the equipment needed for an experiment"
    answer: A testable explanation made before an experiment
    difficulty: 1
    hints:
    - It comes before the test.
    - It can turn out to be wrong.
    solution: 'Step 1: A hypothesis is a possible explanation. Step 2: It must be testable, and it comes before the experiment.'
    mistakes:
      "The final result written down after an experiment": hypothesis_is_result
  - prompt: Which is the SI unit of mass?
    options:
    - Kilogram
    - Gram
    - Newton
    - Litre
    answer: Kilogram
    difficulty: 1
    hints:
    - Not the gram.
    - Newton is a force.
    solution: 'Step 1: The SI base unit of mass is the kilogram (kg).'
    mistakes: {"Gram": "si_base_units", "Newton": "si_base_units"}
  - prompt: 'Testing whether temperature affects how fast sugar dissolves: what must stay the same?'
    options:
    - "The amount of sugar, water and stirring"
    - "The temperature of the water in each cup"
    - "Nothing at all: change everything at once"
    - "Only the colour of the cups that are used"
    answer: The amount of sugar, water and stirring
    difficulty: 2
    hints:
    - Temperature is the thing being tested.
    - Everything else must be controlled.
    solution: 'Step 1: Only temperature changes. Step 2: Sugar amount, water volume and stirring stay the same so the test is fair.'
    mistakes:
      "Nothing at all: change everything at once": fair_test_change_many
  - prompt: Why do scientists repeat a measurement several times?
    options:
    - To reduce the effect of random errors
    - To make the result bigger
    - Because the first is always wrong
    - To use up the equipment
    answer: To reduce the effect of random errors
    difficulty: 2
    hints:
    - Each reading can be a little off.
    - Averaging helps.
    solution: 'Step 1: Every reading has small random errors. Step 2: Averaging several readings gives a more reliable value.'
    mistakes: {"Because the first is always wrong": "repeat_readings", "To make the result bigger": "repeat_readings"}
  - prompt: An experiment does not support the hypothesis. What should the scientist do?
    options:
    - "Change or reject the hypothesis and test again"
    - "Change the data so that it fits the hypothesis"
    - "Hide the results so nobody else can see them"
    - "Stop doing science, since the idea has failed"
    answer: Change or reject the hypothesis and test again
    difficulty: 2
    hints:
    - Evidence decides.
    - Honesty in recording.
    solution: 'Step 1: Data is recorded honestly. Step 2: If it doesn''t support the idea, the idea is changed or rejected.'
    mistakes: {"Change the data so that it fits the hypothesis": "honest_data", "Hide the results so nobody else can see them": "honest_data"}
  - prompt: 'Two pots of beans: A gets fertiliser and sunlight, B gets neither. A grows taller. What can we conclude?'
    options:
    - "Nothing certain: two things were changed at once"
    - "Fertiliser alone makes beans grow taller"
    - "Sunlight alone makes beans grow taller"
    - "Beans do not need any water to grow"
    answer: 'Nothing certain: two things were changed at once'
    difficulty: 3
    hints:
    - How many things were different between A and B?
    - Which caused the difference?
    solution: 'Step 1: Both fertiliser and sunlight differed. Step 2: We can''t tell which one caused the extra growth: the test was not fair.'
    mistakes:
      "Fertiliser alone makes beans grow taller": fair_test_change_many
  - prompt: What is the SI unit of length?
    options:
    - Metre
    - Centimetre
    - Kilometre
    - Foot
    answer: Metre
    difficulty: 1
    hints:
    - SI uses one base unit for each quantity.
    - The others are made from it.
    solution: The SI base unit of length is the metre; cm and km are built from it.
    mistakes:
      Centimetre: si_base_units
      Kilometre: si_base_units
  - prompt: What is the SI unit of time?
    options:
    - Second
    - Minute
    - Hour
    - Day
    answer: Second
    difficulty: 1
    hints:
    - It is the smallest of these.
    - Speeds are written per ___.
    solution: The SI unit of time is the second (s).
    mistakes:
      Minute: si_base_units
  - prompt: 'Testing whether light affects how tall seedlings grow: what is the independent variable?'
    options:
    - The amount of light
    - The height of the seedlings
    - The type of soil
    - The amount of water
    answer: The amount of light
    difficulty: 1
    hints:
    - The independent variable is what you change on purpose.
    - What is the question about?
    solution: We change the light on purpose, so it is the independent variable. Height is measured (dependent).
    mistakes:
      The height of the seedlings: c9s1_variable_roles
      The type of soil: fair_test_change_many
  - prompt: In that seedling test, which should be kept the same?
    options:
    - Soil, water and type of seed
    - The amount of light
    - The height of the seedlings
    - Nothing
    answer: Soil, water and type of seed
    difficulty: 2
    hints:
    - Only one thing should change.
    - Which things could also affect growth?
    solution: Soil, water and seed type are controlled, so only light can explain any difference.
    mistakes:
      Nothing: fair_test_change_many
      The amount of light: c9s1_variable_roles
  - prompt: A student's results don't match the class's expected answer. What should she record?
    options:
    - Her actual readings, and note anything unusual
    - The expected values instead
    - Nothing, and start again silently
    - An average of her values and the expected ones
    answer: Her actual readings, and note anything unusual
    difficulty: 2
    hints:
    - Science depends on honest data.
    - Unexpected results can teach us something.
    solution: Data must be recorded honestly. Unusual results are noted and investigated, never replaced.
    mistakes:
      The expected values instead: honest_data
  - prompt: Which statement is a hypothesis?
    options:
    - "Plants grow taller with more sunlight because they make more food"
    - "The plant in the first pot grew 5 cm taller in two weeks of the test"
    - "Plants are green because their leaves have the pigment chlorophyll"
    - "Measure the height of each plant every day and write it down"
    answer: Plants grow taller with more sunlight because they make more food
    difficulty: 2
    hints:
    - A hypothesis explains and can be tested.
    - A result is something already measured.
    solution: It gives a testable explanation. '5 cm' is a result; 'measure daily' is a method.
    mistakes:
      "The plant in the first pot grew 5 cm taller in two weeks of the test": hypothesis_is_result
  - prompt: Three readings of a pendulum's swing time are 2.1 s, 2.0 s and 2.2 s. What is the average?
    options:
    - 2.1 s
    - 2.0 s
    - 6.3 s
    - 2.2 s
    answer: 2.1 s
    difficulty: 2
    hints:
    - Add the three readings.
    - Divide by 3.
    solution: (2.1 + 2.0 + 2.2) ÷ 3 = 6.3 ÷ 3 = 2.1 s.
    mistakes:
      6.3 s: repeat_readings
  - prompt: Why do scientists share their results for others to check?
    options:
    - "Others may repeat the test and find mistakes or confirm it"
    - "So that they become famous and win prizes for their work"
    - "Because results that are shared can never be wrong"
    - "So that no one ever needs to do the same test again"
    answer: Others may repeat the test and find mistakes or confirm it
    difficulty: 3
    hints:
    - One experiment can have errors.
    - What happens when others repeat it?
    solution: When others repeat an experiment and get the same result, we trust it more; if not, errors come to light.
    mistakes:
      "Because results that are shared can never be wrong": honest_data
  - prompt: Rina waters plant A with fertiliser water at 8 a.m. and plant B with plain water at 6 p.m. A grows more. What is wrong with her test?
    options:
    - 'Two things differ: fertiliser and watering time'
    - Nothing; fertiliser helped
    - She used only two plants, which is always fine
    - She should have measured colour
    answer: 'Two things differ: fertiliser and watering time'
    difficulty: 3
    hints:
    - Count how many things differ between A and B.
    - In a fair test only one thing changes.
    solution: Both fertiliser and watering time changed, so we can't tell which caused the extra growth.
    mistakes:
      Nothing; fertiliser helped: fair_test_change_many
  - prompt: 'Assertion (A): In an experiment, only one variable should be changed at a time.

      Reason (R): Then any change in the result can be linked to that one variable.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both are true. Changing one variable at a time is done precisely so that the effect can be traced to it, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: Anu tests whether fertiliser helps bean plants grow. Pot A gets fertiliser and is kept in the sun; pot B gets none and is kept in the shade. Why is this not a fair test?'
    options:
    - Two things differ, fertiliser and sunlight
    - Only two pots were used for beans
    - Bean plants do not need fertiliser
    answer: Two things differ, fertiliser and sunlight
    hints:
    - How many things are different between the pots?
    - If pot A grows taller, which cause would you blame?
    solution: Both fertiliser and sunlight changed, so any difference can't be traced to fertiliser alone. Keep both pots in the same light.
    mistakes:
      Only two pots were used for beans: fair_test_change_many
      Bean plants do not need fertiliser: hypothesis_is_result
    exam: case
    difficulty: 2
  - prompt: Which of these is NOT an SI base unit?
    options:
    - Gram
    - Kelvin
    - Ampere
    answer: Gram
    hints:
    - The SI base unit of mass has a prefix in its name.
    - Kelvin is for temperature and ampere for current.
    solution: The SI base unit of mass is the kilogram, not the gram.
    mistakes:
      Kelvin: pqc9s1_mass_unit
      Ampere: pqc9s1_mass_unit
    exam: one_mark
    difficulty: 2
