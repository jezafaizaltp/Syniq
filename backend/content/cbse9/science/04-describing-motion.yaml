# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 4. Format: content/README.md.
subject: cbse9-sci
chapter: 4
title: Describing Motion Around Us
tips:
  displacement_shortest: "Displacement is the straight line from start to finish, not the path walked. If you finish where you started, how far are you from the start? For two directions at right angles, use Pythagoras."
  average_speed_total: Average speed = TOTAL distance ÷ TOTAL time, not the average of the two speeds.
  accel_change_over_time: Acceleration = (final velocity − initial velocity) ÷ time. Don't forget to subtract the starting velocity.
  minutes_to_seconds: 'Change minutes to seconds first: 1 minute = 60 s, so speed comes out in m/s.'
  v_squared_root: "The equation gives v², not v. Take the square root at the end: if v² = 49, then v = 7."
  kmh_to_ms: To change km/h to m/s, multiply by 5/18. 36 km/h = 10 m/s.
  graph_slope_meaning: "On a velocity–time graph, the steepness tells you how fast velocity changes, and the area under the line is the distance. For a triangle, area = ½ × base × height."
  circular_constant_velocity: "In uniform circular motion the speed stays the same. But velocity also has a direction. Is the direction staying the same as it goes round?"
  acc_divide_time: "Acceleration = change in velocity ÷ time taken. Divide, don't multiply."
  circle_distance_speed: "One lap is the circumference 2πr. Divide that by the time for one lap."
  flat_position_graph: "A flat line on a position–time graph means the position doesn't change. What does that tell you about motion?"
  speed_divide: "Speed = distance ÷ time. Divide the kilometres by the hours."
  v_u_at: "From rest, u = 0. Use v = u + at."
  vector_direction: "A vector has size AND direction. Which quantity changes if you turn round, even at the same pace?"
concepts:
- code: cbse9ex.motion.speed
  title: Distance, displacement, speed and velocity
  notes: |
    Distance is the path length (scalar); displacement is the shortest distance from initial to final
    position, with direction (vector), and can be zero. Uniform motion: equal distances in equal time
    intervals. Speed = distance / time (m/s). Average speed = total distance / total time. Velocity is
    speed in a given direction. km/h × 5/18 = m/s.
  explanations:
    text: 'Distance is how far you actually travelled; displacement is how far you ended up from the start, in a straight line, with a direction. Run once round a 400 m track: distance 400 m, displacement 0. Speed is distance divided by time; velocity is speed with a direction.'
    visual: 'Draw your path as a wiggly line from A to B: its length is the distance. Now draw a straight arrow from A to B: its length is the displacement, and the arrow shows the direction.'
    step_by_step: 'Step 1: Add up every part of the path for distance. Step 2: Draw a straight line start to end for displacement. Step 3: Speed = distance ÷ time. Step 4: Average speed = total distance ÷ total time. Step 5: Convert km/h to m/s by × 5/18.'
    real_world: 'An autorickshaw meter charges for distance, not displacement: a long detour costs more even if you end up only 1 km from home. A car''s speedometer shows speed, and a GPS showing direction too gives velocity.'
  picture:
    kind: number_line
    from: 0
    to: 6
    step: 1
    points:
    - at: 0
      label: Start
    - at: 2
      label: End
    jumps:
    - from: 0
      to: 5
      label: 5 m east
    - from: 5
      to: 2
      label: 3 m back
    caption: Distance = 5 + 3 = 8 m. Displacement = 2 m east, from Start straight to End.
    alt: 'A walk along a line: 5 m east from 0, then 3 m back to 2. The distance is 8 m but the displacement is only 2 m east.'
  activity:
    type: formula
    prompt: 'A 60 km trip: the first 30 km at speed a, the next 30 km at speed b. Average speed = total distance ÷ total time.'
    inputs:
    - name: a
      label: First half speed a
      min: 10
      max: 120
      step: 10
      start: 10
      unit: km/h
    - name: b
      label: Second half speed b
      min: 10
      max: 120
      step: 10
      start: 10
      unit: km/h
    outputs:
    - name: t1
      label: Time for the first half
      expr: 30/a
      unit: h
      places: 2
    - name: t2
      label: Time for the second half
      expr: 30/b
      unit: h
      places: 2
    - name: avg
      label: Average speed
      expr: 60/(30/a+30/b)
      unit: km/h
      places: 1
    goals:
    - prompt: The first half is at 30 km/h. Make the average speed for the whole trip 40 km/h.
      want:
        a: 30
        avg: 40
      hint: At 40 km/h, 60 km takes 1.5 h. How long has the first half taken already?
      mistakes:
      - when:
          a: 30
          b: 50
        say: '30 and 50 average to 40, but you spend longer at the slow speed: 1 h + 0.6 h = 1.6 h for 60 km is only 37.5 km/h.'
    - prompt: Now the first half is at 40 km/h. Make the average 60 km/h.
      want:
        a: 40
        avg: 60
      mistakes:
      - when:
          a: 40
          b: 80
        say: '40 and 80 average to 60, but the slow half takes 45 min and the fast one 22.5 min: 60 km in 1.125 h is only 53.3 km/h.'
      - when:
          a: 40
          b: 100
        say: 'Closer: 57.1 km/h. 60 km at 60 km/h is 1 hour, and the first half already used 45 minutes.'
  lesson:
    - teach: 'Distance is the total length of the path travelled; it has no direction. Displacement is the straight-line change in position from start to finish, with a direction. Walk 3 m east then 3 m back west: distance 6 m, displacement 0.'
      picture:
        kind: geometry
        points:
          S:
          - 1
          - 2
          P:
          - 7
          - 2
          F:
          - 7
          - 7
        segments:
        - - S
          - P
          - 4 m
        - - P
          - F
          - 3 m
        - - S
          - F
          - 5 m
        caption: Path 4 m + 3 m = 7 m; displacement straight from S to F = 5 m.
        alt: 'Walking 4 m east then 3 m north: distance travelled 7 m, but displacement from start S to finish F is 5 m.'
      check:
        prompt: You walk 4 m east then 3 m north. What is your distance travelled?
        options:
        - 7 m
        - 5 m
        - 1 m
        answer: 7 m
        why: 'Distance adds the path: 4 + 3. The displacement is 5 m.'
    - teach: Speed = distance ÷ time, in m/s (or km/h). Velocity is speed in a stated direction, so it is a vector like displacement. If a car goes round a bend at a steady 40 km/h, its speed is constant but its velocity changes.
      check:
        prompt: Which is a scalar (no direction)?
        options:
        - Speed
        - Velocity
        - Displacement
        answer: Speed
        why: Speed has size only; velocity and displacement have direction too.
    - teach: 'Average speed = total distance ÷ total time, NOT the average of the speeds. 60 km at 30 km/h takes 2 h; 60 km at 60 km/h takes 1 h; average = 120 km ÷ 3 h = 40 km/h. To convert km/h to m/s multiply by 5/18: 36 km/h = 10 m/s.'
      check:
        prompt: Convert 54 km/h to m/s.
        options:
        - 15 m/s
        - 54 m/s
        - 194.4 m/s
        answer: 15 m/s
        why: 54 × 5/18 = 15.
  items:
  - prompt: A car travels 150 km in 3 hours. What is its average speed in km/h?
    answer: '50'
    check: 150/3
    difficulty: 1
    hints:
    - Speed = distance ÷ time.
    - 150 ÷ 3.
    solution: 150 ÷ 3 = 50 km/h.
    mistakes: {"450": "speed_divide", "153": "speed_divide"}
  - prompt: An athlete runs one full round of a 400 m circular track. What is the displacement in m?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Where does the athlete finish?
    - Back at the start.
    solution: Start and finish are the same point, so displacement is 0.
    mistakes:
      '400': displacement_shortest
  - prompt: Convert 72 km/h to m/s.
    answer: '20'
    check: 72*5/18
    difficulty: 1
    hints:
    - Multiply by 5/18.
    - 72 × 5 ÷ 18.
    solution: 72 × 5/18 = 20 m/s.
    mistakes:
      '259.2': kmh_to_ms
  - prompt: A person walks 4 m east and then 3 m north. What is the displacement in m?
    answer: '5'
    check: sqrt(4^2 + 3^2)
    difficulty: 2
    hints:
    - Draw a right triangle.
    - √(16 + 9).
    solution: Displacement = √(4² + 3²) = 5 m (distance is 7 m).
    mistakes:
      '7': displacement_shortest
  - prompt: A bus goes 60 km at 30 km/h and then 60 km at 60 km/h. What is its average speed in km/h?
    answer: '40'
    check: 120/(60/30 + 60/60)
    difficulty: 3
    hints:
    - 'Time for each part: 2 h and 1 h.'
    - 120 km ÷ 3 h.
    solution: 'Step 1: Times are 2 h and 1 h, total 3 h. Step 2: 120 ÷ 3 = 40 km/h.'
    mistakes:
      '45': average_speed_total
  - prompt: Which of these is a vector quantity?
    options:
    - Velocity
    - Speed
    - Distance
    - Time
    answer: Velocity
    difficulty: 2
    hints:
    - A vector has direction.
    - Speed with direction.
    solution: Velocity has size and direction, so it is a vector.
    mistakes: {"Speed": "vector_direction", "Distance": "vector_direction"}
  - prompt: A cyclist covers 600 m in 2 minutes. What is the speed in m/s?
    answer: '5'
    check: 600/120
    difficulty: 2
    hints:
    - 2 minutes = 120 s.
    - 600 ÷ 120.
    solution: 600 ÷ 120 = 5 m/s.
    mistakes:
      '300': minutes_to_seconds
  - prompt: A runner covers 100 m in 20 s. What is her speed in m/s?
    answer: '5'
    check: 100/20
    difficulty: 1
    hints:
    - Speed = distance ÷ time.
    - 100 ÷ 20.
    solution: 100 ÷ 20 = 5 m/s.
    mistakes:
      '2000': speed_divide
      '0.2': speed_divide
  - prompt: Convert 90 km/h to m/s.
    answer: '25'
    check: 90*5/18
    difficulty: 1
    hints:
    - Multiply by 5/18.
    - 90 × 5 ÷ 18.
    solution: 90 × 5/18 = 25 m/s.
    mistakes:
      '324': kmh_to_ms
      '90': kmh_to_ms
  - prompt: A child walks 5 m forward and then 5 m back to the start. What is the displacement in m?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Where does the child end up?
    - Displacement is start to finish.
    solution: The child ends where he started, so displacement is 0 (distance is 10 m).
    mistakes:
      '10': displacement_shortest
  - prompt: A car travels 240 km in 4 hours. What is its average speed in km/h?
    answer: '60'
    check: 240/4
    difficulty: 2
    hints:
    - Total distance ÷ total time.
    - 240 ÷ 4.
    solution: 240 ÷ 4 = 60 km/h.
    mistakes:
      '960': speed_divide
  - prompt: A boy walks 6 m north and then 8 m east. What is his displacement in m?
    answer: '10'
    check: sqrt(36 + 64)
    difficulty: 2
    hints:
    - The two walks make a right angle.
    - √(6² + 8²).
    solution: √(36 + 64) = √100 = 10 m (distance is 14 m).
    mistakes:
      '14': displacement_shortest
      '2': displacement_shortest
  - prompt: A bird flies 3 km in 10 minutes. What is its speed in m/s?
    answer: '5'
    check: 3000/600
    difficulty: 2
    hints:
    - 3 km = 3000 m; 10 min = 600 s.
    - 3000 ÷ 600.
    solution: 3000 ÷ 600 = 5 m/s.
    mistakes:
      '0.3': minutes_to_seconds
      '300': minutes_to_seconds
  - prompt: A train goes 120 km at 60 km/h and returns at 40 km/h. What is its average speed for the whole trip, in km/h?
    answer: '48'
    check: 240/(2 + 3)
    difficulty: 3
    hints:
    - 'Times: 2 h out, 3 h back.'
    - Total distance 240 km ÷ 5 h.
    solution: 240 km ÷ 5 h = 48 km/h, not 50.
    mistakes:
      '50': average_speed_total
  - prompt: Two cars move at 50 km/h, one north and one south. What can you say?
    options:
    - Same speed, different velocities
    - Same velocity
    - Different speeds
    - Both have zero velocity
    answer: Same speed, different velocities
    difficulty: 3
    hints:
    - Velocity includes direction.
    - Their speeds match.
    solution: Speed is the same, 50 km/h, but velocity differs because the directions are opposite.
    mistakes:
      Same velocity: vector_direction
- code: cbse9ex.motion.equations
  title: Acceleration and equations of motion
  after:
  - cbse9ex.motion.speed
  notes: |
    Acceleration a = (v − u)/t (m/s²); negative acceleration is retardation. Uniformly accelerated motion:
    v = u + at; s = ut + ½at²; v² − u² = 2as. Distance–time graph slope = speed; velocity–time graph slope
    = acceleration and area under it = displacement. Uniform circular motion is accelerated because the
    direction changes.
  explanations:
    text: 'Acceleration is how fast velocity changes: (v − u) ÷ t. For steady acceleration there are three equations: v = u + at, s = ut + ½at², and v² = u² + 2as. Pick the one that has the three values you know and the one you want.'
    visual: 'On a velocity–time graph, a straight sloping line means steady acceleration: its slope is a. The area under the line, a triangle or trapezium, is the distance travelled.'
    step_by_step: 'Step 1: List u, v, a, s, t: which are given, which is asked? Step 2: Choose the equation without the unknown you don''t need. Step 3: Put values in with units in SI. Step 4: Solve. A car ''starting from rest'' has u = 0; ''comes to stop'' means v = 0.'
    real_world: A bike that goes from 0 to 20 m/s in 10 s accelerates at 2 m/s². When a bus brakes, its acceleration is negative, which is why you lurch forward.
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 9
    x_label: t (s)
    y_label: v (m/s)
    points:
      u = 2:
      - 0
      - 2
      v = 6:
      - 8
      - 6
      _T:
      - 8
      - 0
    segments:
    - - u = 2
      - v = 6
    - - v = 6
      - _T
    caption: Slope = (6 − 2) ÷ 8 = 0.5 m/s², the acceleration. Area under the line = (2 + 6) ÷ 2 × 8 = 32 m, the distance.
    alt: A velocity–time graph rising in a straight line from 2 m/s to 6 m/s over 8 seconds. Its slope is the acceleration and the area under it is the distance.
  activity:
    type: formula
    prompt: 'A vehicle moving at u brakes with acceleration a (negative). It stops when v = 0: v² − u² = 2as.'
    inputs:
    - name: u
      label: Starting speed u
      min: 0
      max: 40
      step: 1
      start: 0
      unit: m/s
    - name: a
      label: Acceleration a
      min: -10
      max: -0.5
      step: 0.5
      start: -10
      unit: m/s²
    outputs:
    - name: t
      label: Time to stop
      expr: -u/a
      unit: s
      places: 2
    - name: s
      label: Stopping distance
      expr: u^2/(-2*a)
      unit: m
      places: 1
    goals:
    - prompt: A car at 20 m/s must stop in exactly 40 m. Find the braking acceleration.
      want:
        u: 20
        s: 40
      hint: 0 − 20² = 2 × a × 40. What is a?
      mistakes:
      - when:
          u: 20
          a: -10
        say: '−10 m/s² stops it in 20 m. That comes from v² − u² = as, without the 2: the equation is v² − u² = 2as.'
      - when:
          u: 20
          a: -0.5
        say: 'Gentle braking: the car needs 400 m. A shorter stop needs a bigger (more negative) acceleration.'
    - prompt: A scooter at 36 km/h brakes at −2 m/s². Set u in m/s and read its stopping distance.
      want:
        a: -2
        s: 25
      hint: 'Change km/h to m/s: multiply by 5/18.'
      mistakes:
      - when:
          u: 36
        say: '36 is in km/h. Used as m/s, the scooter would need 324 m to stop. Change it first: 36 × 5/18.'
      - when:
          u: 10
          a:
          - -10
          - -2.5
        say: 'The speed is right in m/s now. Check the braking: −2 m/s².'
  lesson:
    - teach: 'Acceleration is how fast velocity changes: a = (v − u) ÷ t, in m/s². u is the starting velocity, v the final one. A car going from 0 to 20 m/s in 5 s has a = 20 ÷ 5 = 4 m/s². Slowing down gives a negative acceleration (retardation).'
      check:
        prompt: A bike slows from 15 m/s to 5 m/s in 2 s. What is its acceleration?
        options:
        - −5 m/s²
        - 5 m/s²
        - −10 m/s²
        answer: −5 m/s²
        why: (5 − 15) ÷ 2 = −5.
    - teach: 'For steady (uniform) acceleration, three equations link u, v, a, t and s (displacement): v = u + at; s = ut + ½at²; v² − u² = 2as. Pick the one that has the quantities you know and the one you want.'
      picture:
        kind: flow
        steps:
        - 'List what you know: u, v, a, t, s'
        - Pick the equation without the one you neither know nor need
        - v = u + at (no s)
        - s = ut + ½at² (no v)
        - v² − u² = 2as (no t)
        alt: How to choose among the three equations of motion by which quantity is missing.
      check:
        prompt: You know u, a and s and want v. Which equation?
        options:
        - v² − u² = 2as
        - v = u + at
        - s = ut + ½at²
        answer: v² − u² = 2as
        why: It has no t, which you don't know.
    - teach: 'Example: a stone falls from rest (u = 0) with a = 10 m/s² for 3 s. v = 0 + 10 × 3 = 30 m/s. s = 0 + ½ × 10 × 9 = 45 m. Always check units and signs.'
      check:
        prompt: From rest, a = 4 m/s² for 5 s. What is s?
        options:
        - 50 m
        - 20 m
        - 100 m
        answer: 50 m
        why: ½ × 4 × 25 = 50.
  items:
  - prompt: A car speeds up from 10 m/s to 30 m/s in 5 s. Find its acceleration in m/s².
    answer: '4'
    check: (30 - 10)/5
    difficulty: 1
    hints:
    - a = (v − u) ÷ t.
    - 20 ÷ 5.
    solution: a = (30 − 10) ÷ 5 = 4 m/s².
    mistakes:
      '6': accel_change_over_time
  - prompt: A bike starts from rest and accelerates at 2 m/s² for 6 s. Find its final velocity in m/s.
    answer: '12'
    check: 0 + 2*6
    difficulty: 1
    hints:
    - v = u + at.
    - u = 0.
    solution: v = 0 + 2 × 6 = 12 m/s.
    mistakes: {"3": "v_u_at", "8": "v_u_at"}
  - prompt: A train starts from rest with acceleration 1 m/s². How far does it go in 10 s, in m?
    answer: '50'
    check: 0*10 + 1/2*1*10^2
    difficulty: 2
    hints:
    - s = ut + ½at².
    - ½ × 1 × 100.
    solution: s = 0 + ½ × 1 × 10² = 50 m.
    mistakes:
      '100': forgot_half
  - prompt: A car moving at 20 m/s brakes and stops in 4 s. Find its acceleration in m/s².
    answer: '-5'
    check: (0 - 20)/4
    difficulty: 2
    hints:
    - v = 0.
    - (0 − 20) ÷ 4.
    solution: a = (0 − 20) ÷ 4 = −5 m/s² (retardation).
    mistakes:
      '5': retardation_sign
  - prompt: A ball rolls from rest with acceleration 2 m/s² for 25 m. Find its final speed in m/s.
    answer: '10'
    check: sqrt(0 + 2*2*25)
    difficulty: 3
    hints:
    - v² = u² + 2as.
    - v² = 100.
    solution: v² = 0 + 2 × 2 × 25 = 100, so v = 10 m/s.
    mistakes:
      '100': v_squared_root
  - prompt: On a velocity–time graph, what does the slope show?
    options:
    - Acceleration
    - Distance
    - Speed
    - Time
    answer: Acceleration
    difficulty: 2
    hints:
    - Slope = change in y ÷ change in x.
    - Change in velocity ÷ time.
    solution: Slope of v–t graph = change in velocity ÷ time = acceleration.
    mistakes:
      Distance: graph_slope_area
  - prompt: Why is uniform circular motion called accelerated motion?
    options:
    - The direction keeps changing
    - The speed keeps increasing
    - The distance is zero
    - It stops often
    answer: The direction keeps changing
    difficulty: 2
    hints:
    - Velocity includes direction.
    - Speed is constant.
    solution: 'Its direction changes all the time, so its velocity changes: it accelerates.'
    mistakes: {"The speed keeps increasing": "circular_constant_velocity", "It stops often": "circular_constant_velocity"}
  - prompt: A scooter speeds up from 4 m/s to 16 m/s in 6 s. Find its acceleration in m/s².
    answer: '2'
    check: (16 - 4)/6
    difficulty: 1
    hints:
    - a = (v − u)/t.
    - 12 ÷ 6.
    solution: (16 − 4) ÷ 6 = 2 m/s².
    mistakes:
      '12': acc_divide_time
      '3.33': accel_change_over_time
  - prompt: A car starts from rest with acceleration 3 m/s². What is its velocity after 8 s, in m/s?
    answer: '24'
    check: 0 + 3*8
    difficulty: 1
    hints:
    - v = u + at.
    - u = 0.
    solution: v = 0 + 3 × 8 = 24 m/s.
    mistakes:
      '11': v_u_at
  - prompt: A bus moving at 15 m/s stops in 5 s. What is its acceleration in m/s²?
    answer: '-3'
    check: (0 - 15)/5
    difficulty: 1
    hints:
    - v = 0.
    - (0 − 15) ÷ 5.
    solution: (0 − 15) ÷ 5 = −3 m/s² (it is slowing down).
    mistakes:
      '3': accel_change_over_time
      '-75': acc_divide_time
  - prompt: A car at 10 m/s accelerates at 2 m/s² for 4 s. How far does it go in that time, in m?
    answer: '56'
    check: 10*4 + 0.5*2*16
    difficulty: 2
    hints:
    - s = ut + ½at².
    - 40 + 16.
    solution: s = 10 × 4 + ½ × 2 × 16 = 40 + 16 = 56 m.
    mistakes:
      '40': v_u_at
      '72': v_u_at
  - prompt: A ball falls from rest for 2 s with acceleration 10 m/s². How far does it fall, in m?
    answer: '20'
    check: 0.5*10*4
    difficulty: 2
    hints:
    - u = 0.
    - s = ½ × 10 × 2².
    solution: ½ × 10 × 4 = 20 m.
    mistakes:
      '10': v_squared_root
      '40': v_squared_root
  - prompt: A train at 20 m/s brakes with acceleration −2 m/s². How far does it travel before stopping, in m?
    answer: '100'
    check: (0 - 400)/(2*-2)
    difficulty: 2
    hints:
    - v² − u² = 2as, with v = 0.
    - 0 − 400 = 2(−2)s.
    solution: −400 = −4s, so s = 100 m.
    mistakes:
      '-100': accel_change_over_time
      '10': v_squared_root
  - prompt: A car accelerates from rest at 5 m/s² over 40 m. What is its final speed, in m/s?
    answer: '20'
    check: sqrt(2*5*40)
    difficulty: 3
    hints:
    - v² = u² + 2as.
    - v² = 400.
    solution: v² = 0 + 2 × 5 × 40 = 400, so v = 20 m/s.
    mistakes:
      '400': v_squared_root
      '200': v_squared_root
  - prompt: A ball is thrown up at 20 m/s and slows at 10 m/s². How long until it stops rising, in s?
    answer: '2'
    check: 20/10
    difficulty: 3
    hints:
    - At the top, v = 0.
    - 0 = 20 − 10t.
    solution: 0 = 20 − 10t gives t = 2 s.
    mistakes:
      '200': acc_divide_time
      '0.5': acc_divide_time
- code: cbse9ex.motion.graphs
  title: Motion graphs and uniform circular motion
  after:
  - cbse9ex.motion.equations
  notes: |
    Position–time graph: a straight sloping line means uniform velocity (slope = velocity); a horizontal line
    means at rest; a curve means changing velocity. Velocity–time graph: a horizontal line means constant
    velocity; a straight sloping line means uniform acceleration (slope = acceleration); the area under the
    graph equals the displacement. The equations of motion can be derived from the v–t graph. Uniform
    circular motion: an object moving in a circle at constant speed; its direction changes at every point, so
    its velocity changes and it is accelerating. Speed in a circle = 2πr ÷ time for one round.
  explanations:
    text: A graph tells the story of a journey. On a position–time graph, steeper means faster and flat means stopped. On a velocity–time graph, the slope gives the acceleration and the area under the line gives the distance covered. Going round a circle at a steady speed still counts as accelerating, because your direction keeps changing.
    visual: 'Draw a v–t graph: a line rising from 0 to 20 m/s over 10 s. The slope is 20 ÷ 10 = 2 m/s². The triangle under it has area ½ × 10 × 20 = 100: the car travelled 100 m.'
    step_by_step: 'Step 1: Check the axes: position or velocity against time? Step 2: Read the slope (rise ÷ run). Step 3: On a p–t graph slope = velocity; on a v–t graph slope = acceleration. Step 4: On a v–t graph, area underneath = displacement.'
    real_world: 'A satellite circles the Earth at a steady speed, yet gravity constantly pulls it towards the centre, changing its direction: it is always accelerating, which is why it stays in orbit.'
  picture:
    kind: geometry
    axes: true
    range:
    - -1
    - 11
    x_label: time (s)
    y_label: velocity (m/s)
    points:
      O:
      - 0
      - 0
      A:
      - 10
      - 10
      _B:
      - 10
      - 0
    segments:
    - - O
      - A
      - v rises steadily
    - - A
      - _B
    caption: Slope = acceleration; area under the line = distance.
    alt: A velocity–time graph with a straight line rising from the origin, showing uniform acceleration; the triangle underneath is the distance.
  activity:
    type: graph
    mode: line
    range:
    - -2
    - 10
    m_step: 0.5
    x_label: time (s)
    y_label: position (m)
    prompt: A position–time graph. The slope is the velocity; where the line meets the position axis is where it starts.
    goals:
    - prompt: Show something at rest, 4 m from the start.
      m: 0
      c: 4
      mistakes:
      - when:
          m: 4
          c: 0
        say: 'This line rises: the position changes by 4 m every second, so it''s moving. At rest, the position never changes.'
      - when:
          m: 0
          c: 0
        say: Flat is right for 'at rest', but this one sits at the start. It should be 4 m away.
    - prompt: Moving away at 2 m/s, starting 1 m from the start.
      m: 2
      c: 1
      mistakes:
      - when:
          m: 1
          c: 2
        say: 'Swapped: this starts at 2 m and moves 1 m each second. The slope is the speed.'
      - when:
          m: 0
          c: 1
        say: A flat line means it isn't moving. Moving away means the position grows every second.
    - prompt: Coming back towards the start at 1 m/s, starting from 6 m.
      m: -1
      c: 6
      mistakes:
      - when:
          m: 1
          c: 6
        say: A rising line means moving away. Coming back, the position shrinks, so the line slopes down.
      - when:
          m: -1
          c: 0
        say: This starts at the start point. The object begins 6 m away.
  lesson:
    - teach: A position–time graph shows where an object is at each moment. A straight sloping line means uniform velocity; its slope (rise ÷ run) is the velocity. A flat line means the object is not moving. A curve means the velocity is changing.
      picture:
        kind: geometry
        axes: true
        range:
        - -1
        - 10
        x_label: time (s)
        y_label: position (m)
        points:
          (0, 0):
          - 0
          - 0
          (4, 8):
          - 4
          - 8
          (8, 8):
          - 8
          - 8
        segments:
        - - (0, 0)
          - (4, 8)
          - moving
        - - (4, 8)
          - (8, 8)
          - at rest
        caption: 'Slope 8 ÷ 4 = 2 m/s, then a flat line: at rest.'
        alt: Position–time graph rising steadily from (0, 0) to (4, 8), then flat to (8, 8) while the object is at rest.
      check:
        prompt: A position–time line rises 30 m in 6 s. What is the velocity?
        options:
        - 5 m/s
        - 180 m/s
        - 36 m/s
        answer: 5 m/s
        why: Slope = 30 ÷ 6 = 5.
    - teach: A velocity–time graph shows velocity at each moment. A flat line means constant velocity. A straight sloping line means uniform acceleration, and its slope is the acceleration. The area under the graph is the displacement.
      check:
        prompt: A v–t graph is a flat line at 10 m/s for 6 s. What is the displacement?
        options:
        - 60 m
        - 16 m
        - 0 m
        answer: 60 m
        why: 'The area is a rectangle: 10 × 6 = 60.'
    - teach: 'In uniform circular motion, an object moves round a circle at steady speed, but its direction keeps changing, so its velocity changes: it is accelerating. Its speed = circumference ÷ time for one round = 2πr ÷ t.'
      check:
        prompt: A stone whirled on a string at steady speed is…
        options:
        - accelerating, because its direction changes
        - not accelerating
        - moving with constant velocity
        answer: accelerating, because its direction changes
        why: Velocity includes direction; a change of direction is a change of velocity.
  items:
  - prompt: On a position–time graph, a horizontal line means the object is…
    options:
    - At rest
    - Moving at constant speed
    - Accelerating
    - Moving backwards
    answer: At rest
    difficulty: 1
    hints:
    - Position doesn't change with time.
    - Slope 0 means velocity 0.
    solution: 'Step 1: The position stays the same. Step 2: So the object isn''t moving.'
    mistakes: {"Moving at constant speed": "flat_position_graph", "Accelerating": "flat_position_graph"}
  - prompt: A car's velocity rises steadily from 0 to 20 m/s in 10 s. What is its acceleration in m/s²?
    answer: '2'
    check: 20/10
    difficulty: 1
    hints:
    - Slope of the v–t graph.
    - 20 ÷ 10.
    solution: 'Step 1: a = (20 − 0) ÷ 10. Step 2: = 2 m/s².'
    mistakes: {"200": "acc_divide_time", "0.5": "acc_divide_time"}
  - prompt: For that car (0 to 20 m/s in 10 s), how far does it travel in m?
    answer: '100'
    check: 1/2*10*20
    difficulty: 2
    hints:
    - Area under the v–t graph.
    - 'Triangle: ½ × base × height.'
    solution: 'Step 1: Area = ½ × 10 × 20. Step 2: = 100 m.'
    mistakes:
      '200': graph_slope_meaning
      '2': graph_slope_meaning
  - prompt: On a velocity–time graph, what does the slope give?
    options:
    - Acceleration
    - Distance
    - Velocity
    - Time
    answer: Acceleration
    difficulty: 2
    hints:
    - Change in velocity ÷ time.
    - Area gives distance.
    solution: 'Step 1: Slope = change in velocity ÷ change in time. Step 2: That is acceleration.'
    mistakes:
      Distance: graph_slope_meaning
  - prompt: Why is a body in uniform circular motion said to be accelerating?
    options:
    - Its direction, and so its velocity, keeps changing
    - Its speed keeps increasing
    - It moves in a straight line
    - It has no velocity
    answer: Its direction, and so its velocity, keeps changing
    difficulty: 2
    hints:
    - '''Uniform'' means the speed is steady.'
    - Velocity includes direction.
    solution: 'Step 1: The speed is constant. Step 2: The direction changes all the time, so the velocity changes: that is acceleration.'
    mistakes:
      Its speed keeps increasing: circular_constant_velocity
  - prompt: An athlete runs once round a circular track of radius 35 m in 44 s. What is the speed in m/s? (π = 22/7)
    answer: '5'
    check: 2*22/7*35/44
    difficulty: 3
    hints:
    - One round = 2πr.
    - 2 × 22/7 × 35 = 220 m.
    solution: 'Step 1: Circumference = 220 m. Step 2: Speed = 220 ÷ 44 = 5 m/s.'
    mistakes: {"2.5": "circle_distance_speed", "0.8": "circle_distance_speed"}
  - prompt: On a position–time graph, a straight line rises 40 m in 8 s. What is the velocity in m/s?
    answer: '5'
    check: 40/8
    difficulty: 1
    hints:
    - Velocity = slope.
    - 40 ÷ 8.
    solution: 40 ÷ 8 = 5 m/s.
    mistakes:
      '320': graph_slope_meaning
  - prompt: On a velocity–time graph, a horizontal line means…
    options:
    - Constant velocity
    - At rest
    - Uniform acceleration
    - Slowing down
    answer: Constant velocity
    difficulty: 1
    hints:
    - The velocity value isn't changing.
    - It is not necessarily zero.
    solution: 'A flat v–t line means the velocity stays the same: no acceleration.'
    mistakes:
      At rest: flat_position_graph
  - prompt: On a velocity–time graph, what does the area under the line give?
    options:
    - Displacement
    - Acceleration
    - Speed
    - Time
    answer: Displacement
    difficulty: 1
    hints:
    - Area = velocity × time for a rectangle.
    - Velocity × time = ?
    solution: Velocity × time is displacement, so the area under a v–t graph is displacement.
    mistakes:
      Acceleration: graph_slope_meaning
  - prompt: A v–t graph goes straight from 5 m/s to 25 m/s in 4 s. What is the acceleration in m/s²?
    answer: '5'
    check: (25 - 5)/4
    difficulty: 2
    hints:
    - Slope = change in v ÷ time.
    - 20 ÷ 4.
    solution: (25 − 5) ÷ 4 = 5 m/s².
    mistakes:
      '20': acc_divide_time
      '6.25': graph_slope_meaning
  - prompt: A v–t graph is a flat line at 12 m/s from 0 to 5 s. What distance is covered, in m?
    answer: '60'
    check: 12*5
    difficulty: 2
    hints:
    - Area of a rectangle.
    - 12 × 5.
    solution: 12 × 5 = 60 m.
    mistakes:
      '2.4': graph_slope_meaning
      '17': graph_slope_meaning
  - prompt: A v–t graph rises straight from 0 to 30 m/s in 6 s. What distance is covered, in m?
    answer: '90'
    check: 0.5*6*30
    difficulty: 2
    hints:
    - The area is a triangle.
    - ½ × 6 × 30.
    solution: ½ × base × height = ½ × 6 × 30 = 90 m.
    mistakes:
      '180': graph_slope_meaning
      '5': graph_slope_meaning
  - prompt: Which position–time graph shows an object speeding up?
    options:
    - A curve getting steeper
    - A straight sloping line
    - A flat line
    - A straight line going down
    answer: A curve getting steeper
    difficulty: 2
    hints:
    - Slope = velocity.
    - Speeding up means the slope grows.
    solution: A steepening curve has an increasing slope, so the velocity increases.
    mistakes:
      A straight sloping line: graph_slope_meaning
      A flat line: flat_position_graph
  - prompt: A satellite circles Earth at a steady speed. Which is true?
    options:
    - Its velocity changes all the time
    - Its velocity is constant
    - It is not accelerating
    - Its speed changes all the time
    answer: Its velocity changes all the time
    difficulty: 3
    hints:
    - Its direction keeps changing.
    - Velocity includes direction.
    solution: 'Speed stays the same but direction changes, so velocity changes: it is accelerating.'
    mistakes:
      Its velocity is constant: circular_constant_velocity
  - prompt: A cyclist goes round a circular track of radius 70 m in 88 s. What is the speed in m/s? (π = 22/7)
    answer: '5'
    check: 2*22/7*70/88
    difficulty: 3
    hints:
    - One round = 2πr = 440 m.
    - 440 ÷ 88.
    solution: 2 × 22/7 × 70 = 440 m; 440 ÷ 88 = 5 m/s.
    mistakes:
      '2.5': circle_distance_speed
      '0.8': circle_distance_speed
