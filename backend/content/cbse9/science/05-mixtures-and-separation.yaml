# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 5. Format: content/README.md.
subject: cbse9-sci
chapter: 5
title: Exploring Mixtures and their Separation
tips:
  mass_by_mass_solution: Concentration by mass uses the mass of the whole SOLUTION (solute + solvent) at the bottom, not just the solvent.
  colloid_not_settle: Colloid particles are too small to settle or be filtered, but big enough to scatter light (Tyndall effect).
  compound_vs_mixture: A compound has fixed proportions and new properties, and needs a chemical reaction to separate. A mixture keeps its parts' properties and can be separated physically.
  c9s5_split_by_reaction: "Water could not be pulled apart by filtering, a magnet or evaporating. It took electricity, a chemical process, and gave two new substances. Which kind of substance needs that?"
  physical_vs_chemical: "Ask: is a new substance made? If you can get the original back easily (melting, dissolving), it is physical. If something new forms (ash, rust), it is chemical."
  concentration_solvent_not_solution: Mass percent uses the mass of the whole solution (solute + solvent) on the bottom, not just the solvent.
  separation_wrong_property: "Choose the method from the property that differs: colours that travel at different speeds on paper, a solid that turns straight into gas, or gases that boil at different temperatures."
  chromatography_dyes: "Ink is a mixture of dyes that dissolve and travel up paper at different speeds. Which method uses that?"
  crystallisation_pure: "When you evaporate everything, where do the dissolved impurities end up?"
  element_one_kind: "An element has only one kind of atom and can't be broken into simpler substances. Salt and sugar are made of more than one."
  mass_by_volume: "Mass by volume % = mass of solute ÷ volume of solution × 100."
  percent_of_mass: "4% of 500 g means 4/100 of 500. The rest is water."
  tyndall_colloid: "Only a colloid scatters a beam of light. True solutions don't. Which choice is cloudy, with suspended particles?"
concepts:
- code: cbse9ex.mixtures.types
  title: Solutions, suspensions and colloids
  notes: |
    A pure substance has one kind of particle. Mixtures are homogeneous (uniform, e.g. salt solution)
    or heterogeneous. A solution is homogeneous, particles < 1 nm, does not scatter light. Concentration
    = mass of solute / mass of solution × 100 (mass by mass %). Suspension: heterogeneous, particles
    visible, settle, scatter light. Colloid: appears homogeneous but is heterogeneous, particles
    1–1000 nm, show the Tyndall effect, don't settle (milk, fog, smoke).
  explanations:
    text: 'Stir salt into water and it disappears: that''s a solution, the same all the way through. Stir chalk into water and it clouds then settles: a suspension. Milk looks even, but a torch beam through it shows a visible path: that''s a colloid, with particles in between in size.'
    visual: 'Shine a torch through three glasses. Salt water: the beam vanishes inside. Milk diluted with water: you see the beam''s path glowing (Tyndall effect). Muddy water: you see the beam, and after a while the mud sinks to the bottom.'
    step_by_step: 'Step 1: Does it settle when left alone? Yes means suspension. Step 2: If not, does a light beam show a path? Yes means colloid. Step 3: If neither, it''s a solution. Step 4: For concentration, divide the solute''s mass by the solution''s total mass and multiply by 100.'
    real_world: 'Sunlight streaming through gaps in a forest canopy shows bright rays because mist is a colloid that scatters light. Sharbat is a solution: the sugar never settles.'
  picture:
    kind: compare
    columns:
    - title: 'Solution: salt water'
      points:
      - Particles too small to see
      - A light beam passes, its path not seen
      - Doesn't settle; filter can't separate it
    - title: 'Colloid: milk'
      points:
      - Particles small but they scatter light
      - The beam's path glows (Tyndall effect)
      - Doesn't settle
    - title: 'Suspension: chalk in water'
      points:
      - Particles big enough to see
      - Cloudy; light is blocked
      - Settles on standing; can be filtered
    alt: 'Solution, colloid and suspension compared: particle size, what a light beam does (the Tyndall effect in a colloid), and whether it settles.'
  activity:
    type: sort
    prompt: Solution, suspension or colloid? Think about particle size, settling and whether a torch beam shows.
    bins:
    - Solution
    - Suspension
    - Colloid
    items:
    - label: Salt water
      bin: Solution
      clue: Does anything settle, even after days?
      why: 'Salt dissolves completely: a clear solution that never settles and doesn''t scatter light.'
    - label: Milk
      bin: Colloid
      clue: Does milk separate if left still? Does a beam show through it?
      why: 'Milk looks uniform and doesn''t settle, but its particles scatter light: a colloid.'
    - label: Muddy water
      bin: Suspension
      clue: What happens if you leave it in a glass?
      why: 'The mud settles to the bottom: a suspension.'
    - label: Chalk powder stirred in water
      bin: Suspension
      clue: Can you see the bits? Do they sink?
      why: 'Chalk bits are visible and settle: a suspension.'
    - label: Fog
      bin: Colloid
      clue: Why can you see car headlight beams in fog?
      why: 'Tiny water droplets in air scatter light (Tyndall effect): a colloid.'
    - label: Soda water
      bin: Solution
      clue: Is the gas spread evenly, with nothing to see?
      why: 'Carbon dioxide dissolved in water: a solution.'
    - label: Smoke
      bin: Colloid
      clue: Do sunbeams show up in smoke?
      why: 'Tiny solid bits in air scatter light and don''t settle quickly: a colloid.'
    - label: Sand in water
      bin: Suspension
      clue: How quickly does it sink?
      why: 'Sand grains are large and settle at once: a suspension.'
    - label: Sugar dissolved in water
      bin: Solution
      clue: Can you see any sugar once it's stirred in?
      why: 'Sugar dissolves: particles under 1 nm, a solution.'
    - label: Shaving cream
      bin: Colloid
      clue: Is it gas spread through a liquid, like a foam?
      why: 'A foam is gas spread through a liquid: a colloid.'
  lesson:
    - teach: 'A pure substance has only one kind of particle: distilled water, gold, sugar. A mixture has two or more substances not chemically joined: sea water, air, soil. A homogeneous mixture looks the same all through (salt water); a heterogeneous one doesn''t (sand in water).'
      check:
        prompt: Which is a homogeneous mixture?
        options:
        - Sugar dissolved in water
        - Sand in water
        - Oil and water
        answer: Sugar dissolved in water
        why: The sugar spreads evenly; every drop is the same.
    - teach: 'Mixtures of a substance in a liquid come in three types, by particle size. Solution: particles under 1 nm, never settle, light passes straight through. Colloid: 1–1000 nm, never settle, but scatter a beam of light (the Tyndall effect): milk, fog, ink. Suspension: big particles you can see, which settle: chalk or mud in water.'
      picture:
        kind: compare
        columns:
        - title: Solution
          points:
          - Particles < 1 nm
          - Don't settle
          - No Tyndall effect
          - Salt water
        - title: Colloid
          points:
          - 1–1000 nm
          - Don't settle
          - Scatter light
          - Milk, fog
        - title: Suspension
          points:
          - Visible particles
          - Settle
          - Scatter light
          - Muddy water
        alt: Solutions, colloids and suspensions compared by particle size, settling and scattering of light.
      check:
        prompt: A torch beam is visible through fog. What is this called?
        options:
        - The Tyndall effect
        - Osmosis
        - Sublimation
        answer: The Tyndall effect
        why: Colloid particles scatter light, making the beam visible.
    - teach: 'The concentration of a solution tells how much solute is in it. Mass by mass % = mass of solute ÷ mass of SOLUTION × 100. The solution is solute + solvent: 10 g salt in 90 g water makes 100 g solution, so 10%.'
      check:
        prompt: 5 g of sugar is dissolved in 45 g of water. What is the mass %?
        options:
        - 10%
        - 11.1%
        - 5%
        answer: 10%
        why: Solution = 50 g; 5 ÷ 50 × 100 = 10. (Dividing by the water gives 11.1, a common slip.)
  items:
  - prompt: Which of these shows the Tyndall effect?
    options:
    - Milk
    - Salt solution
    - Sugar solution
    - Copper sulphate solution
    answer: Milk
    difficulty: 1
    hints:
    - The Tyndall effect is light scattering.
    - Which one is a colloid?
    solution: Milk is a colloid, so its particles scatter a light beam.
    mistakes: {"Salt solution": "tyndall_colloid", "Sugar solution": "tyndall_colloid"}
  - prompt: 20 g of salt is dissolved in 180 g of water. What is the concentration by mass, in percent?
    answer: '10'
    check: 20/(20 + 180)*100
    difficulty: 1
    hints:
    - Mass of solution = 20 + 180.
    - 20 ÷ 200 × 100.
    solution: 'Step 1: Solution mass = 200 g. Step 2: 20 ÷ 200 × 100 = 10%.'
    mistakes:
      '11.1': mass_by_mass_solution
  - prompt: Chalk powder in water settles at the bottom after some time. The mixture is a…
    options:
    - Suspension
    - Solution
    - Colloid
    - Compound
    answer: Suspension
    difficulty: 1
    hints:
    - Its particles are big.
    - They settle.
    solution: Particles that settle when left undisturbed make a suspension.
    mistakes:
      Colloid: colloid_not_settle
  - prompt: A solution contains 40 g of sugar in 320 g of water. Find the concentration by mass, in percent. Give the answer to 1 decimal place.
    answer: '11.1'
    check: round(40/360*100, 1)
    difficulty: 2
    hints:
    - Solution = 40 + 320 = 360 g.
    - 40 ÷ 360 × 100.
    solution: 'Step 1: Solution = 360 g. Step 2: 40 ÷ 360 × 100 ≈ 11.1%.'
    mistakes:
      '12.5': mass_by_mass_solution
  - prompt: Which statement about a colloid is true?
    options:
    - Its particles do not settle and scatter light
    - Its particles settle quickly
    - It can be separated by filter paper
    - It is a pure substance
    answer: Its particles do not settle and scatter light
    difficulty: 2
    hints:
    - Think of milk.
    - Milk doesn't separate on standing.
    solution: Colloid particles are too small to settle or be filtered, but scatter light.
    mistakes:
      Its particles settle quickly: colloid_not_settle
  - prompt: How much salt is needed to make 500 g of a 4% (by mass) salt solution, in grams?
    answer: '20'
    check: 4/100*500
    difficulty: 3
    hints:
    - 4% of the solution is salt.
    - 4 ÷ 100 × 500.
    solution: Salt = 4% of 500 g = 20 g (and 480 g water).
    mistakes: {"2000": "percent_of_mass", "4": "percent_of_mass"}
  - prompt: Which of these is a pure substance?
    options:
    - Distilled water
    - Sea water
    - Air
    - Soil
    answer: Distilled water
    difficulty: 1
    hints:
    - A pure substance has one kind of particle.
    - The others contain many substances.
    solution: Distilled water contains only water molecules; the others are mixtures.
    mistakes:
      Sea water: element_one_kind
      Air: element_one_kind
  - prompt: Muddy water is left to stand, and mud collects at the bottom. What kind of mixture was it?
    options:
    - Suspension
    - Solution
    - Colloid
    - Pure substance
    answer: Suspension
    difficulty: 1
    hints:
    - Which kind of mixture settles?
    - The particles are big enough to see.
    solution: Particles that settle on standing mean a suspension.
    mistakes:
      Colloid: colloid_not_settle
  - prompt: 15 g of salt is dissolved in 135 g of water. What is the concentration by mass, in percent?
    answer: '10'
    check: 15/150*100
    difficulty: 1
    hints:
    - Solution mass = 15 + 135.
    - 15 ÷ 150 × 100.
    solution: 15 ÷ 150 × 100 = 10%.
    mistakes:
      '11.1': concentration_solvent_not_solution
      '11.11': concentration_solvent_not_solution
  - prompt: Which of these is a colloid?
    options:
    - Shaving foam
    - Salt water
    - Sand in water
    - Copper sulphate solution
    answer: Shaving foam
    difficulty: 2
    hints:
    - A colloid looks even but is not a true solution.
    - Gas spread through a liquid.
    solution: 'Foam is gas dispersed in a liquid: a colloid that doesn''t settle and scatters light.'
    mistakes:
      Salt water: tyndall_colloid
      Sand in water: colloid_not_settle
  - prompt: Why can't a colloid be separated by filtering through paper?
    options:
    - Its particles are small enough to pass through the filter paper
    - It settles too fast
    - It is a pure substance
    - Its particles are too big
    answer: Its particles are small enough to pass through the filter paper
    difficulty: 2
    hints:
    - Colloid particles are 1–1000 nm.
    - Filter paper pores are larger.
    solution: Colloid particles pass through ordinary filter paper; they can be separated by centrifuging.
    mistakes:
      It settles too fast: colloid_not_settle
  - prompt: A 250 g solution contains 30 g of glucose. What is its concentration by mass, in percent?
    answer: '12'
    check: 30/250*100
    difficulty: 2
    hints:
    - The 250 g is already the whole solution.
    - 30 ÷ 250 × 100.
    solution: 30 ÷ 250 × 100 = 12%.
    mistakes:
      '13.6': concentration_solvent_not_solution
      '30': percent_of_mass
  - prompt: How much water must be added to 25 g of salt to make a 5% (by mass) solution, in grams?
    answer: '475'
    check: 25/0.05 - 25
    difficulty: 2
    hints:
    - 25 g is 5% of the whole solution.
    - Solution = 500 g; subtract the salt.
    solution: Solution = 25 ÷ 0.05 = 500 g, so water = 500 − 25 = 475 g.
    mistakes:
      '500': mass_by_mass_solution
  - prompt: Which pair shows the Tyndall effect?
    options:
    - Milk and fog
    - Salt water and sugar water
    - Copper sulphate solution and vinegar
    - Pure water and alcohol
    answer: Milk and fog
    difficulty: 3
    hints:
    - The Tyndall effect needs particles big enough to scatter light.
    - Solutions don't scatter light.
    solution: Milk and fog are colloids; their particles scatter light. Solutions do not.
    mistakes:
      Salt water and sugar water: tyndall_colloid
  - prompt: Sunlight entering a dark, dusty room shows a visible beam. Why?
    options:
    - Dust and smoke particles scatter the light
    - The light is coloured
    - Air is a solution that bends light
    - The room is cold
    answer: Dust and smoke particles scatter the light
    difficulty: 3
    hints:
    - Think of the Tyndall effect.
    - Small particles in air.
    solution: 'Tiny particles in the air scatter the light so the beam''s path becomes visible: the Tyndall effect.'
    mistakes:
      Air is a solution that bends light: tyndall_colloid
- code: cbse9ex.mixtures.elements_compounds
  title: Elements, compounds and changes
  after:
  - cbse9ex.mixtures.types
  notes: |
    Elements cannot be broken into simpler substances by chemical reactions (metals, non-metals,
    metalloids). Compounds have elements combined chemically in a fixed ratio and properties different
    from their elements (iron sulphide vs iron + sulphur mixture). Physical changes make no new substance;
    chemical changes do (burning, rusting).
  explanations:
    text: 'An element is the simplest kind of substance, like iron or oxygen. A compound forms when elements join chemically in a fixed ratio, like water (H₂O). A mixture is just things mixed together, like iron filings and sulphur powder: a magnet can still pull the iron out. Heat them and they react to form iron sulphide, a compound a magnet can''t separate.'
    visual: 'Think of Lego. Single bricks are elements. A built model glued together is a compound: fixed design, new shape. Loose bricks tossed in a box are a mixture: easy to pick apart, and each brick is still itself.'
    step_by_step: 'Step 1: Can it be split by a chemical reaction? No means element. Step 2: Is the ratio fixed and are its properties new? Then it''s a compound. Step 3: If the parts keep their properties and can be separated physically, it''s a mixture. Step 4: A change that makes a new substance is chemical; otherwise it''s physical.'
    real_world: 'Melting ghee is a physical change: it sets again in the fridge. Burning a candle wick is a chemical change: the wax and oxygen become carbon dioxide and water, which don''t turn back into wax.'
  picture:
    kind: compare
    columns:
    - title: Physical change
      points:
      - No new substance forms
      - Often easy to reverse
      - Ice melting, sugar dissolving
    - title: Chemical change
      points:
      - A new substance forms
      - Usually can't be reversed
      - Paper burning, iron rusting
    alt: Physical changes make no new substance and are often reversible; chemical changes make a new substance and usually can't be reversed.
  activity:
    type: sort
    prompt: Element, compound or mixture?
    bins:
    - Element
    - Compound
    - Mixture
    items:
    - label: Oxygen gas
      bin: Element
      clue: Can it be broken into anything simpler?
      why: 'Oxygen is one kind of atom: an element.'
    - label: Water
      bin: Compound
      clue: Is it made of more than one element, joined in a fixed ratio?
      why: 'Hydrogen and oxygen joined chemically, always 1 : 8 by mass: a compound.'
    - label: Air
      bin: Mixture
      clue: Is the amount of each gas fixed?
      why: 'Air''s gases are just mixed, in amounts that vary: a mixture.'
    - label: Iron filings and sulphur powder stirred together
      bin: Mixture
      clue: Could a magnet pull the iron out?
      why: 'A magnet can pull the iron out: they are only mixed, not joined.'
    - label: Iron sulphide (iron and sulphur heated together)
      bin: Compound
      clue: After heating, does a magnet still pick out the iron?
      why: 'Heating joins them chemically into a new substance with new properties: a compound.'
    - label: Carbon dioxide
      bin: Compound
      clue: How many different elements are in it?
      why: 'Carbon and oxygen joined in a fixed ratio: a compound.'
    - label: Brass
      bin: Mixture
      clue: Is the ratio of copper to zinc always the same?
      why: 'Brass is an alloy, copper and zinc mixed in varying amounts: a mixture.'
    - label: Copper wire
      bin: Element
      clue: How many kinds of atoms are in pure copper?
      why: 'Only copper atoms: an element.'
    - label: Sea water
      bin: Mixture
      clue: Can you get salt back by evaporating it?
      why: 'Salt and water are just mixed: evaporation separates them.'
    - label: Common salt (sodium chloride)
      bin: Compound
      clue: Does salt behave like sodium metal or chlorine gas?
      why: 'Sodium and chlorine joined chemically, with new properties: a compound.'
  lesson:
    - teach: 'An element is the simplest kind of substance: it can''t be broken into anything simpler by chemical reactions. Iron, oxygen, sodium and carbon are elements. Elements are metals (shiny, conduct), non-metals (dull, poor conductors) or metalloids (in between, like silicon).'
      check:
        prompt: Which is an element?
        options:
        - Oxygen
        - Water
        - Salt
        answer: Oxygen
        why: Water and salt can be broken into elements; oxygen can't.
    - teach: 'A compound forms when elements join chemically in a fixed ratio, and its properties are different from theirs. Iron and sulphur heated together make iron sulphide: no longer magnetic, a new substance. Just mixed without heating, they stay a mixture: a magnet pulls the iron out.'
      picture:
        kind: compare
        columns:
        - title: Mixture of iron and sulphur
          points:
          - Any proportion
          - Magnet removes iron
          - Each keeps its properties
          - No heat taken or given
        - title: 'Compound: iron sulphide'
          points:
          - Fixed ratio by mass
          - Not magnetic
          - New properties
          - Heat given out when formed
        alt: Iron and sulphur as a mixture beside iron sulphide as a compound, compared by ratio, magnetism and properties.
      check:
        prompt: Which is true of a compound?
        options:
        - Its elements are in a fixed ratio
        - It can be separated with a magnet
        - It keeps its elements' properties
        answer: Its elements are in a fixed ratio
        why: Water is always 1 g hydrogen to 8 g oxygen.
    - teach: 'A physical change makes no new substance and can often be reversed: melting ice, dissolving sugar, tearing paper. A chemical change makes a new substance: burning, rusting, cooking an egg. Signs: new colour, gas, heat or light given out.'
      check:
        prompt: Which is a physical change?
        options:
        - Ice melting
        - Milk turning sour
        - Wood burning
        answer: Ice melting
        why: Water stays water; no new substance forms.
  items:
  - prompt: Which of these is a compound?
    options:
    - Water
    - Air
    - Oxygen
    - Brass
    answer: Water
    difficulty: 1
    hints:
    - A compound has elements in a fixed ratio.
    - H₂O.
    solution: Water is H₂O, a compound. Air and brass are mixtures; oxygen is an element.
    mistakes:
      Air: compound_vs_mixture
  - prompt: Which is a chemical change?
    options:
    - Burning of paper
    - Melting of ice
    - Dissolving sugar
    - Breaking glass
    answer: Burning of paper
    difficulty: 1
    hints:
    - Which one makes a new substance?
    - Ash and smoke.
    solution: Burning makes new substances (ash, carbon dioxide), so it's a chemical change.
    mistakes:
      Dissolving sugar: physical_vs_chemical
  - prompt: Iron filings and sulphur are mixed but not heated. How can the iron be separated?
    options:
    - Using a magnet
    - It can't be separated
    - By burning
    - By adding water only
    answer: Using a magnet
    difficulty: 2
    hints:
    - It's still a mixture.
    - Iron keeps its properties.
    solution: In a mixture iron keeps its magnetic property, so a magnet pulls it out.
    mistakes:
      It can't be separated: compound_vs_mixture
  - prompt: Which is an element?
    options:
    - Sodium
    - Salt
    - Sugar
    - Sand
    answer: Sodium
    difficulty: 1
    hints:
    - Elements are on the periodic table.
    - Salt is sodium chloride.
    solution: Sodium is an element. Salt, sugar and sand are compounds.
    mistakes: {"Salt": "element_one_kind", "Sugar": "element_one_kind"}
  - prompt: Rusting of iron is a…
    options:
    - Chemical change
    - Physical change
    - Change of state
    - Mixture forming
    answer: Chemical change
    difficulty: 2
    hints:
    - Rust is a new substance.
    - Iron oxide.
    solution: Rust (iron oxide) is a new substance, so rusting is a chemical change.
    mistakes:
      Physical change: physical_vs_chemical
  - prompt: Which property belongs to a compound but not to a mixture?
    options:
    - Its parts are in a fixed ratio by mass
    - Its parts keep their own properties
    - It can be separated by filtering
    - Its composition can vary
    answer: Its parts are in a fixed ratio by mass
    difficulty: 3
    hints:
    - 'Water is always 1 : 8 hydrogen to oxygen by mass.'
    - Mixtures can vary.
    solution: A compound always has its elements in a fixed ratio by mass.
    mistakes:
      Its composition can vary: compound_vs_mixture
  - prompt: Which of these is a metalloid?
    options:
    - Silicon
    - Copper
    - Sulphur
    - Oxygen
    answer: Silicon
    difficulty: 1
    hints:
    - It is used in computer chips.
    - It has properties between metals and non-metals.
    solution: Silicon is a metalloid, partly like a metal and partly like a non-metal.
    mistakes:
      Copper: element_one_kind
  - prompt: Which of these is a mixture?
    options:
    - Air
    - Carbon dioxide
    - Water
    - Sodium chloride
    answer: Air
    difficulty: 1
    hints:
    - Its parts can vary in amount.
    - Nitrogen, oxygen, argon, carbon dioxide…
    solution: Air is a mixture of gases in varying amounts; the others are compounds.
    mistakes:
      Carbon dioxide: compound_vs_mixture
      Water: compound_vs_mixture
  - prompt: Dissolving sugar in tea is a…
    options:
    - Physical change
    - Chemical change
    - Nuclear change
    - Compound forming
    answer: Physical change
    difficulty: 1
    hints:
    - Is a new substance made?
    - Evaporate the tea and the sugar is back.
    solution: The sugar is still sugar, so it is a physical change.
    mistakes:
      Chemical change: physical_vs_chemical
  - prompt: Water can be split by electricity into hydrogen and oxygen. So water is…
    options:
    - A compound
    - An element
    - A mixture
    - A colloid
    answer: A compound
    difficulty: 2
    hints:
    - It breaks into two different elements.
    - Elements can't be broken down.
    solution: Water breaks into elements by a chemical process, so it is a compound.
    mistakes:
      An element: element_one_kind
      A mixture: c9s5_split_by_reaction
  - prompt: Which is a sign of a chemical change?
    options:
    - A gas forms and the colour changes
    - The shape changes
    - It melts
    - It is cut into pieces
    answer: A gas forms and the colour changes
    difficulty: 2
    hints:
    - Chemical changes make new substances.
    - New substances may bring gas, colour, heat or light.
    solution: A new gas and colour show a new substance has formed.
    mistakes:
      It melts: physical_vs_chemical
  - prompt: In the compound water, hydrogen and oxygen are always in the mass ratio…
    options:
    - '1 : 8'
    - Any ratio
    - '2 : 1'
    - '8 : 1'
    answer: '1 : 8'
    difficulty: 2
    hints:
    - A compound's ratio is fixed.
    - Hydrogen is much lighter.
    solution: Water always has 1 g of hydrogen for every 8 g of oxygen.
    mistakes:
      Any ratio: compound_vs_mixture
      '2 : 1': compound_vs_mixture
  - prompt: Which of these is a chemical change?
    options:
    - Cooking an egg
    - Boiling water
    - Melting butter
    - Breaking glass
    answer: Cooking an egg
    difficulty: 2
    hints:
    - Can you un-cook it?
    - Its proteins change into new forms.
    solution: Cooking changes the egg's proteins into new substances; it can't be undone.
    mistakes:
      Boiling water: physical_vs_chemical
  - prompt: Iron and sulphur are heated together. The product is not attracted by a magnet. Why?
    options:
    - A new compound, iron sulphide, has formed
    - The iron has evaporated
    - Sulphur coats the iron
    - Heat destroys magnets
    answer: A new compound, iron sulphide, has formed
    difficulty: 3
    hints:
    - Is this still a mixture?
    - Compounds have new properties.
    solution: Heating makes iron sulphide, a compound with properties different from iron.
    mistakes:
      Sulphur coats the iron: compound_vs_mixture
  - prompt: Salt can be got back by evaporating salt water. What does this show?
    options:
    - Salt water is a mixture and dissolving is a physical change
    - Salt water is a compound
    - Salt is an element
    - Evaporation is a chemical change
    answer: Salt water is a mixture and dissolving is a physical change
    difficulty: 3
    hints:
    - The salt comes back unchanged.
    - No new substance formed.
    solution: Because the salt is recovered unchanged by a physical process, salt water is a mixture.
    mistakes:
      Salt water is a compound: compound_vs_mixture
      Evaporation is a chemical change: physical_vs_chemical
- code: cbse9ex.mixtures.separation
  title: Concentration and separating mixtures
  after:
  - cbse9ex.mixtures.types
  notes: |
    Concentration of a solution: mass by mass percentage = mass of solute ÷ mass of solution × 100;
    mass by volume percentage = mass of solute (g) ÷ volume of solution (mL) × 100. Separation methods use a
    difference in properties: evaporation and crystallisation (a dissolved solid; crystallisation gives purer
    crystals, e.g. salt, alum, copper sulphate); simple distillation (liquids with very different boiling
    points, or a solid from a liquid you want to keep); fractional distillation (boiling points close, e.g.
    gases of air, petroleum); paper chromatography (colours in ink); sublimation (camphor, ammonium chloride,
    naphthalene from salt); centrifugation (cream from milk, blood tests); separating funnel (oil and water);
    coagulation with alum in water treatment.
  explanations:
    text: 'To separate a mixture, find something that is different about its parts and use it. Salt dissolves and water boils away: evaporate. Ink colours travel different distances up paper: chromatography. Camphor turns straight to gas: sublimation. Cream is lighter than milk: spin it in a centrifuge.'
    visual: 'Draw a strip of filter paper with an ink dot near the bottom, standing in water. As water climbs, the dot splits into bands of blue, yellow and red at different heights: each dye moves at its own speed.'
    step_by_step: 'Step 1: List the parts of the mixture. Step 2: Find a property that differs (dissolving, boiling point, sublimation, density, colour). Step 3: Choose the method that uses it. Step 4: For concentration, mass of solute ÷ mass of solution × 100.'
    real_world: Water works add alum so mud particles clump and settle (coagulation), filter the water, then add chlorine. A dairy's centrifuge spins milk to separate cream.
  picture:
    kind: compare
    columns:
    - title: Mixture
      points:
      - Salt in water
      - Coloured dyes in ink
      - Camphor + salt
      - Cream in milk
      - Oil + water
      - Alcohol + water
    - title: Method
      points:
      - Evaporation / crystallisation
      - Paper chromatography
      - Sublimation
      - Centrifugation
      - Separating funnel
      - Fractional distillation
    alt: Six mixtures matched with the methods that separate them.
  activity:
    type: sort
    prompt: Which method separates each mixture? Use the property that differs.
    bins:
    - Evaporation or crystallisation
    - Distillation
    - Filtration
    - Separating funnel
    - Chromatography
    items:
    - label: Salt from sea water
      bin: Evaporation or crystallisation
      clue: You want the solid that is dissolved. What could you drive off?
      why: Evaporate the water and the salt is left behind.
    - label: Pure water from salt water
      bin: Distillation
      clue: You want the water, not the salt. How do you catch it?
      why: 'Boil it and cool the steam: distillation collects pure water.'
    - label: Sand from water
      bin: Filtration
      clue: Does sand dissolve?
      why: Sand doesn't dissolve, so filter paper holds it back.
    - label: Oil from water
      bin: Separating funnel
      clue: Do oil and water mix, or form two layers?
      why: They form two layers; a separating funnel lets the lower one run off.
    - label: The dyes in black ink
      bin: Chromatography
      clue: How do you separate colours dissolved together?
      why: 'Each dye travels a different distance up the paper: chromatography.'
    - label: Pure copper sulphate crystals from an impure sample
      bin: Evaporation or crystallisation
      clue: Do you want pure crystals from a solution?
      why: Crystallisation gives purer crystals, leaving impurities in the solution.
    - label: Tea leaves from tea
      bin: Filtration
      clue: What does a strainer do?
      why: The leaves don't dissolve, so a strainer, a kind of filter, holds them back.
    - label: Acetone (boils at 56 °C) from water
      bin: Distillation
      clue: Do the two liquids boil at different temperatures?
      why: 'Acetone boils first: distillation separates liquids with different boiling points.'
    - label: Kerosene from water
      bin: Separating funnel
      clue: Does kerosene float on water?
      why: 'They don''t mix and form layers: separating funnel.'
    - label: Coloured pigments from a leaf
      bin: Chromatography
      clue: Are there several colours mixed in one solution?
      why: 'Each pigment moves at its own speed up the paper: chromatography.'
  lesson:
    - teach: 'We separate a mixture by using a property in which its parts differ: size, solubility, boiling point, magnetism, or whether a solid turns straight into a gas. Pick the method that matches the difference.'
      check:
        prompt: 'Iron filings and sawdust: which property helps?'
        options:
        - Only iron is magnetic
        - Both dissolve in water
        - Both are solids
        answer: Only iron is magnetic
        why: A magnet pulls the iron out.
    - teach: 'Methods: evaporation gets a dissolved solid back; crystallisation gives purer crystals; filtration removes undissolved solids; sublimation separates a solid that turns straight to gas (camphor, ammonium chloride, naphthalene); distillation separates liquids with very different boiling points; fractional distillation for close boiling points (liquid air); chromatography separates dyes; a separating funnel separates liquids that don''t mix; centrifuging separates fine particles (cream from milk).'
      picture:
        kind: compare
        columns:
        - title: Mixture
          points:
          - Salt from sea water
          - Camphor and salt
          - Oil and water
          - Dyes in ink
          - Cream from milk
          - Acetone and water
        - title: Method
          points:
          - Evaporation
          - Sublimation
          - Separating funnel
          - Chromatography
          - Centrifugation
          - Distillation
        alt: Six mixtures matched with the separation method that uses the difference in their parts.
      check:
        prompt: How would you separate oil and water?
        options:
        - Separating funnel
        - Sublimation
        - Chromatography
        answer: Separating funnel
        why: They don't mix and form two layers; the lower layer is run off.
    - teach: 'Mass by volume % = mass of solute (g) ÷ volume of solution (mL) × 100: 10 g in 200 mL is 5%. Crystallisation beats evaporation for pure crystals: soluble impurities stay in the leftover liquid, and some solids (like copper sulphate) break down if heated dry.'
      check:
        prompt: 8 g of sugar in 200 mL of solution. Mass by volume %?
        options:
        - 4%
        - 8%
        - 25%
        answer: 4%
        why: 8 ÷ 200 × 100 = 4.
  items:
  - prompt: 20 g of salt is dissolved in 180 g of water. What is the mass percentage of salt in the solution?
    answer: '10'
    check: 20/(20 + 180)*100
    difficulty: 1
    hints:
    - Mass of solution = 20 + 180.
    - 20 ÷ 200 × 100.
    solution: 'Step 1: Solution mass = 200 g. Step 2: 20 ÷ 200 × 100 = 10%.'
    mistakes:
      '11.1': concentration_solvent_not_solution
  - prompt: Which method separates the colours in a drop of black ink?
    options:
    - Paper chromatography
    - Sublimation
    - Centrifugation
    - Separating funnel
    answer: Paper chromatography
    difficulty: 1
    hints:
    - Dyes move up paper at different speeds.
    - Filter paper and water.
    solution: 'Step 1: The dyes dissolve and travel up the paper at different rates. Step 2: That is paper chromatography.'
    mistakes: {"Sublimation": "chromatography_dyes", "Separating funnel": "separation_wrong_property"}
  - prompt: How would you separate camphor from common salt?
    options:
    - Sublimation
    - Filtration
    - Distillation
    - Chromatography
    answer: Sublimation
    difficulty: 1
    hints:
    - Camphor turns from solid straight to vapour.
    - Salt doesn't.
    solution: 'Step 1: Heat the mixture. Step 2: Camphor sublimes and is collected on a cool surface; salt is left behind.'
    mistakes:
      Distillation: separation_wrong_property
  - prompt: Which method separates oxygen and nitrogen from liquid air?
    options:
    - Fractional distillation
    - Simple evaporation
    - Separating funnel
    - Sublimation
    answer: Fractional distillation
    difficulty: 2
    hints:
    - Their boiling points are close.
    - A fractionating column helps.
    solution: 'Step 1: Liquid air is warmed slowly. Step 2: Gases boil off at their own boiling points in a fractionating column.'
    mistakes:
      Simple evaporation: separation_wrong_property
  - prompt: A solution has 15 g of sugar in 250 mL of solution. What is its mass by volume percentage?
    answer: '6'
    check: 15/250*100
    difficulty: 2
    hints:
    - Mass of solute (g) ÷ volume of solution (mL) × 100.
    - 15 ÷ 250.
    solution: 'Step 1: 15 ÷ 250 = 0.06. Step 2: × 100 = 6%.'
    mistakes: {"15": "mass_by_volume", "0.06": "mass_by_volume"}
  - prompt: Why is crystallisation better than evaporation for getting pure copper sulphate from its solution?
    options:
    - Soluble impurities stay in the leftover liquid, and the crystals don't decompose from strong heating
    - It is faster
    - It removes the water completely
    - It needs no heating at all
    answer: Soluble impurities stay in the leftover liquid, and the crystals don't decompose from strong heating
    difficulty: 3
    hints:
    - Evaporating to dryness leaves everything behind.
    - Some solids break down on strong heating.
    solution: 'Step 1: In evaporation, impurities dry onto the solid, and strong heat can decompose it. Step 2: In crystallisation, pure crystals form and the impurities stay dissolved.'
    mistakes: {"It is faster": "crystallisation_pure", "It removes the water completely": "crystallisation_pure"}
  - prompt: Which method separates salt from sea water?
    options:
    - Evaporation
    - Filtration
    - Sublimation
    - Separating funnel
    answer: Evaporation
    difficulty: 1
    hints:
    - The salt is dissolved.
    - Heat drives off the water.
    solution: Evaporating the water leaves the dissolved salt behind.
    mistakes:
      Filtration: separation_wrong_property
  - prompt: Which method removes sand from water?
    options:
    - Filtration
    - Evaporation
    - Chromatography
    - Sublimation
    answer: Filtration
    difficulty: 1
    hints:
    - Sand doesn't dissolve.
    - Use filter paper.
    solution: Undissolved sand is trapped by filter paper; water passes through.
    mistakes:
      Evaporation: separation_wrong_property
  - prompt: Cream is separated from milk in dairies by…
    options:
    - Centrifugation
    - Distillation
    - Sublimation
    - Magnet
    answer: Centrifugation
    difficulty: 1
    hints:
    - Milk is spun very fast.
    - Lighter cream collects in the middle.
    solution: Spinning fast (centrifuging) separates the lighter cream.
    mistakes:
      Distillation: separation_wrong_property
  - prompt: Acetone (boils at 56 °C) is mixed with water (100 °C). Which method separates them?
    options:
    - Distillation
    - Filtration
    - Separating funnel
    - Chromatography
    answer: Distillation
    difficulty: 2
    hints:
    - They mix completely.
    - Their boiling points differ a lot.
    solution: 'Heat: acetone boils first, is cooled and collected; water stays behind.'
    mistakes:
      Separating funnel: separation_wrong_property
  - prompt: Which of these sublimes and can be separated from sand by heating?
    options:
    - Ammonium chloride
    - Common salt
    - Sugar
    - Copper sulphate
    answer: Ammonium chloride
    difficulty: 2
    hints:
    - 'Sublime: solid turns straight into gas.'
    - Camphor and naphthalene do this too.
    solution: Ammonium chloride sublimes; its vapour is cooled and collected away from the sand.
    mistakes:
      Common salt: separation_wrong_property
  - prompt: A solution has 20 g of salt in 400 mL of solution. What is its mass by volume percentage?
    answer: '5'
    check: 20/400*100
    difficulty: 2
    hints:
    - Mass (g) ÷ volume (mL) × 100.
    - 20 ÷ 400 × 100.
    solution: 20 ÷ 400 × 100 = 5%.
    mistakes:
      '20': mass_by_volume
      '0.05': mass_by_volume
  - prompt: Why does paper chromatography separate dyes in ink?
    options:
    - The dyes dissolve and travel up the paper at different speeds
    - The dyes have different boiling points
    - The dyes are magnetic
    - The paper absorbs only one colour
    answer: The dyes dissolve and travel up the paper at different speeds
    difficulty: 2
    hints:
    - Water carries the dyes up the paper.
    - Some stick to the paper more than others.
    solution: More soluble dyes move further with the solvent, so they separate into bands.
    mistakes:
      The dyes have different boiling points: chromatography_dyes
  - prompt: A mixture has salt, sand and camphor. In which order would you separate them?
    options:
    - Sublime camphor, dissolve salt and filter sand, evaporate salt
    - Filter first, then sublime
    - Evaporate first
    - Use a magnet first
    answer: Sublime camphor, dissolve salt and filter sand, evaporate salt
    difficulty: 3
    hints:
    - Camphor would be lost if you heated water with it later.
    - Salt dissolves; sand doesn't.
    solution: Heat to sublime camphor first. Then add water to dissolve the salt, filter out the sand and evaporate the salt water.
    mistakes:
      Use a magnet first: separation_wrong_property
  - prompt: Oxygen boils at −183 °C and nitrogen at −196 °C. Why is fractional distillation used for liquid air rather than simple distillation?
    options:
    - Their boiling points are close together
    - They are solids
    - They don't mix
    - They are the same gas
    answer: Their boiling points are close together
    difficulty: 3
    hints:
    - Difference = 13 °C.
    - Simple distillation needs a big gap.
    solution: With only 13 °C between them, a fractionating column is needed to separate them well.
    mistakes:
      They don't mix: separation_wrong_property
