# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 2. Format: content/README.md.
subject: cbse9-sci
chapter: 2
title: 'Cell: The Building Block of Life'
tips:
  osmosis_direction: In osmosis, water moves from where there is MORE water (dilute solution) to where there is LESS water (concentrated solution).
  cell_wall_plants: "Both plant and animal cells have a thin membrane around them. Plants have an extra, stiff outer layer that keeps them firm. What is it called?"
  powerhouse_mitochondria: "One organelle releases energy from food in respiration (the 'powerhouse'); another uses light to make food and is green. Match the job asked to the right one."
  prokaryote_no_nucleus: "'Pro' means before and 'karyon' means nucleus: cells from before a true nucleus. 'Eu' means true."
  mitosis_meiosis_swap: "One kind of division copies a cell for growth and repair; the other makes sex cells with half the chromosomes. Count the cells each makes, and halve 46 for a gamete."
  prokaryote_nucleus: Prokaryotes (like bacteria) have no proper nucleus with a membrane; their DNA lies in the cytoplasm.
  cancer_uncontrolled: "Normal cells divide only when the body needs more. What goes wrong in cancer?"
  golgi_packaging: "Think of a post office: which organelle packs materials into little bags and sends them out?"
  hooke_cork: "The first person to see 'cells' was looking at a thin slice of cork in 1665. Leeuwenhoek saw living cells later."
  lysosome_enzymes: "Which organelle is full of digestive enzymes that can break down the cell itself if it is damaged?"
  meiosis_gametes: "Mitosis keeps the chromosome number the same. Which division halves it to make sex cells?"
  osmosis_water: "When the moving substance is water through a membrane, the process has its own name. Diffusion of gases is a different case."
  rough_er_ribosomes: "Rough ER is studded with tiny grains that make proteins. What are those grains?"
  selective_membrane: "'Selectively' means it chooses. Does it let everything through, or only some things?"
  c9s2_concentration_side: Water moves to the side where it is less concentrated, the side with more dissolved stuff (salt, sugar). Which side has more salt?
  c9s2_living_cells: "Cork cells are dead and empty, so the first person to name cells never saw a living one. Who looked at pond water through his own home-made lenses?"
concepts:
- code: cbse9ex.cell.membrane
  title: Cells, membranes and osmosis
  notes: |
    Robert Hooke (1665) saw cells in cork; Leeuwenhoek saw living cells. All living things are made of
    cells (cell theory: Schleiden, Schwann, Virchow). Unicellular and multicellular organisms. The plasma
    membrane is selectively permeable. Diffusion moves substances from high to low concentration; osmosis
    is diffusion of water through a selectively permeable membrane. In a hypotonic solution a cell gains
    water and swells; in hypertonic it loses water and shrinks (plasmolysis in plants); isotonic: no net
    change. Plant cells have a cellulose cell wall outside the membrane.
  explanations:
    text: 'Every living thing is made of cells. Each cell is wrapped in a thin plasma membrane that lets some things in and keeps others out. Water crosses it by osmosis: it moves towards the side that is saltier or sweeter. Put a raisin in water and it swells; put a slice of cucumber in salt and it goes limp.'
    visual: Picture a sieve that lets water through but not sugar. Put sugar syrup on one side and plain water on the other. Water flows through to the syrup side, trying to dilute it, so the syrup side rises.
    step_by_step: 'Step 1: Find which side has more water (the more dilute one). Step 2: Water moves from there to the side with less water. Step 3: If water goes into the cell, it swells. Step 4: If water leaves the cell, it shrinks (in plants the membrane pulls away from the wall: plasmolysis).'
    real_world: Salting mango pieces for pickle draws water out of them by osmosis, which also stops germs from growing. Dried chickpeas soaked overnight swell up as water moves in.
  picture:
    kind: flow
    steps:
    - Plain water on one side, sugar solution on the other
    - The membrane lets water through but not sugar
    - Water moves into the sugar side
    - So a raisin in water swells, and grapes in strong sugar syrup shrink
    alt: 'Osmosis in steps: water passes through the membrane into the sugar solution, which is why a raisin swells in water.'
    caption: 'Osmosis: water moves through a membrane from where there is more water to where there is less.'
  activity:
    type: sort
    prompt: Water moves by osmosis towards where there is less water (more dissolved stuff). What happens to each cell?
    bins:
    - Gains water
    - Loses water
    - Stays about the same
    items:
    - label: A raisin in plain water
      bin: Gains water
      clue: 'Where is there more water: inside the raisin or outside?'
      why: Outside is almost pure water, so water moves in and the raisin swells.
    - label: A grape in thick sugar syrup
      bin: Loses water
      clue: Which side has more sugar and less water?
      why: The syrup has less water than the grape, so water leaves and the grape shrinks.
    - label: A red blood cell in pure water
      bin: Gains water
      clue: Is pure water more or less concentrated than the cell?
      why: 'Pure water is hypotonic: water rushes in and the cell swells, and may burst.'
    - label: Mango slices sprinkled with salt
      bin: Loses water
      clue: Where does the juice come from after a while?
      why: 'Salt outside draws water out by osmosis: the juice that collects came from the cells.'
    - label: A cell in a solution as strong as its own sap
      bin: Stays about the same
      clue: Is there more water on one side than the other?
      why: 'Equal concentration (isotonic): water moves in and out equally, so no change.'
    - label: Wilted spinach in fresh water
      bin: Gains water
      clue: Why do shops spray vegetables with water?
      why: Fresh water enters the cells, which become firm again.
    - label: Lettuce leaves in salty water
      bin: Loses water
      clue: Is the salty water more or less watery than the cells?
      why: Salty water has less water than the cells, so they lose water and go limp.
    - label: A red blood cell in blood plasma
      bin: Stays about the same
      clue: Is plasma made to match the cell's insides?
      why: Plasma is isotonic with blood cells, so they keep their shape.
  lesson:
    - teach: In 1665 Robert Hooke looked at a thin slice of cork under his microscope and saw tiny boxes, which he called cells. Later scientists showed that every living thing is made of cells, and new cells come only from existing cells. This is the cell theory.
      check:
        prompt: What did Hooke look at when he first saw cells?
        options:
        - A slice of cork
        - Pond water
        - His own blood
        answer: A slice of cork
        why: Cork cells are dead and empty, so their walls showed up as little boxes.
    - teach: 'Every cell is wrapped in a plasma membrane. It is selectively permeable: it lets some substances through (water, oxygen, carbon dioxide) and stops others. Substances spread from where they are more concentrated to where they are less: diffusion.'
      check:
        prompt: A drop of ink spreads through a glass of water. What is this?
        options:
        - Diffusion
        - Osmosis
        - Photosynthesis
        answer: Diffusion
        why: Ink moves from high to low concentration; no membrane is involved.
    - teach: Osmosis is diffusion of water across a selectively permeable membrane. Water moves towards the side with more dissolved substances. In plain water (hypotonic) a cell takes in water and swells; in strong salt water (hypertonic) it loses water and shrinks; in an equal solution (isotonic) nothing changes overall.
      picture:
        kind: compare
        columns:
        - title: Plain water
          points:
          - Water moves in
          - Cell swells
          - Raisin swells
        - title: Strong salt water
          points:
          - Water moves out
          - Cell shrinks
          - 'Plant cell: plasmolysis'
        alt: In plain water water enters a cell and it swells; in strong salt water water leaves and the cell shrinks.
      check:
        prompt: Grapes are left in strong sugar syrup. What happens?
        options:
        - They lose water and shrink
        - They swell and burst
        - Nothing
        answer: They lose water and shrink
        why: The syrup has more dissolved sugar, so water moves out of the grapes.
    - teach: Plant cells also have a tough cell wall of cellulose outside the membrane. When a plant cell loses water, the membrane pulls away from the wall (plasmolysis), but the wall keeps the shape. In water, the wall stops the cell bursting, so it becomes firm (turgid).
      check:
        prompt: Why doesn't a plant cell burst in plain water?
        options:
        - Its cell wall resists the swelling
        - It has no membrane
        - Water can't enter plant cells
        answer: Its cell wall resists the swelling
        why: The rigid wall pushes back, so the cell becomes turgid instead of bursting.
  items:
  - prompt: Who first saw cells, in a slice of cork?
    options:
    - Robert Hooke
    - Leeuwenhoek
    - Robert Brown
    - Virchow
    answer: Robert Hooke
    difficulty: 1
    hints:
    - '1665.'
    - He called them 'cells' after small rooms.
    solution: Robert Hooke saw cells in cork in 1665.
    mistakes: {"Leeuwenhoek": "hooke_cork", "Robert Brown": "hooke_cork"}
  - prompt: A raisin is placed in plain water. What happens?
    options:
    - It swells
    - It shrinks
    - Nothing
    - It dissolves
    answer: It swells
    difficulty: 1
    hints:
    - The raisin is full of sugar.
    - Water moves in.
    solution: Water moves into the sugary raisin by osmosis, so it swells.
    mistakes:
      It shrinks: osmosis_direction
  - prompt: A plant cell is placed in a strong salt solution. What happens?
    options:
    - It loses water and the membrane shrinks from the wall
    - It gains water and bursts
    - Nothing changes
    - It gains a cell wall
    answer: It loses water and the membrane shrinks from the wall
    difficulty: 2
    hints:
    - Outside has less water.
    - That's plasmolysis.
    solution: Water leaves by osmosis, and the cell contents shrink away from the cell wall (plasmolysis).
    mistakes:
      It gains water and bursts: osmosis_direction
  - prompt: Why is the plasma membrane called selectively permeable?
    options:
    - It lets some substances pass and stops others
    - It lets everything pass
    - It stops everything
    - It is made of cellulose
    answer: It lets some substances pass and stops others
    difficulty: 1
    hints:
    - Selective means choosy.
    - It decides what goes through.
    solution: It allows only some substances to move in and out.
    mistakes: {"It lets everything pass": "selective_membrane", "It is made of cellulose": "selective_membrane"}
  - prompt: Which structure is found in plant cells but not in animal cells?
    options:
    - Cell wall
    - Plasma membrane
    - Nucleus
    - Mitochondria
    answer: Cell wall
    difficulty: 2
    hints:
    - It is made of cellulose.
    - It gives plants stiffness.
    solution: Plant cells have a cellulose cell wall outside the membrane; animal cells don't.
    mistakes:
      Plasma membrane: cell_wall_plants
  - prompt: Movement of water across a selectively permeable membrane is called…
    options:
    - Osmosis
    - Diffusion of gases
    - Endocytosis
    - Plasmolysis
    answer: Osmosis
    difficulty: 2
    hints:
    - It's a special kind of diffusion.
    - Only water.
    solution: Osmosis is the diffusion of water through a selectively permeable membrane.
    mistakes: {"Diffusion of gases": "osmosis_water", "Plasmolysis": "osmosis_water"}
  - prompt: Who said that all cells come from pre-existing cells?
    options:
    - Virchow
    - Hooke
    - Leeuwenhoek
    - Newton
    answer: Virchow
    difficulty: 1
    hints:
    - He added the last part of the cell theory.
    - Hooke only saw dead cork cells.
    solution: Rudolf Virchow (1855) proposed that new cells arise from existing cells.
    mistakes:
      Hooke: hooke_cork
  - prompt: Who first saw living cells, like bacteria, in pond water?
    options:
    - Leeuwenhoek
    - Hooke
    - Virchow
    - Schwann
    answer: Leeuwenhoek
    difficulty: 1
    hints:
    - He made his own powerful lenses.
    - Hooke saw dead cork.
    solution: Anton van Leeuwenhoek saw free-living cells in pond water in 1674.
    mistakes:
      Hooke: c9s2_living_cells
  - prompt: A potato slice is placed in strong salt water for an hour. How does it feel?
    options:
    - Soft and floppy
    - Hard and swollen
    - Exactly the same
    - Hot
    answer: Soft and floppy
    difficulty: 1
    hints:
    - Which side has more salt?
    - Water moves out of the cells.
    solution: Water leaves the potato cells by osmosis, so they lose firmness and the slice goes floppy.
    mistakes:
      Hard and swollen: c9s2_concentration_side
  - prompt: Which gas enters a cell by diffusion when the cell is using it up?
    options:
    - Oxygen
    - Nitrogen only
    - No gas can enter
    - Helium
    answer: Oxygen
    difficulty: 1
    hints:
    - Cells use this gas for respiration.
    - It is less concentrated inside, so it moves in.
    solution: Cells use oxygen, so its level inside is low and it diffuses in from outside.
    mistakes:
      No gas can enter: selective_membrane
  - prompt: What is plasmolysis?
    options:
    - The cell membrane shrinking away from the wall as a plant cell loses water
    - A cell bursting in water
    - A cell dividing
    - Food being made in a cell
    answer: The cell membrane shrinking away from the wall as a plant cell loses water
    difficulty: 2
    hints:
    - It happens in a strong salt solution.
    - The wall stays, the inside shrinks.
    solution: In a hypertonic solution a plant cell loses water by osmosis, so its contents pull away from the rigid wall.
    mistakes:
      A cell bursting in water: osmosis_direction
  - prompt: An animal cell (with no wall) is put in distilled water. What may happen?
    options:
    - It swells and may burst
    - It shrinks
    - It forms a wall
    - Nothing
    answer: It swells and may burst
    difficulty: 2
    hints:
    - Water moves in.
    - No wall pushes back.
    solution: Water enters by osmosis. With no cell wall, the cell may swell until it bursts.
    mistakes:
      It shrinks: c9s2_concentration_side
      It forms a wall: cell_wall_plants
  - prompt: What is the plant cell wall mainly made of?
    options:
    - Cellulose
    - Protein
    - Fat
    - Starch
    answer: Cellulose
    difficulty: 2
    hints:
    - It is a tough carbohydrate.
    - Cotton and paper are mostly this.
    solution: The plant cell wall is made mainly of cellulose, which gives strength.
    mistakes:
      Starch: cell_wall_plants
  - prompt: Why do vegetable sellers sprinkle water on leafy vegetables?
    options:
    - The cells take in water by osmosis and stay firm
    - To wash off germs
    - To make them heavier only
    - To cool the seller
    answer: The cells take in water by osmosis and stay firm
    difficulty: 3
    hints:
    - Wilted leaves have lost water.
    - Water enters the cells and makes them turgid.
    solution: Water enters the leaf cells by osmosis; they become turgid, so the leaves look fresh and firm.
    mistakes:
      To wash off germs: osmosis_water
  - prompt: Salt sprinkled on a garden slug makes it shrivel. Why?
    options:
    - Water leaves its cells by osmosis into the salty surface
    - Salt burns it
    - Salt enters its cells and fills them
    - It hides in its shell
    answer: Water leaves its cells by osmosis into the salty surface
    difficulty: 3
    hints:
    - Where is the salt more concentrated?
    - Water moves towards more salt.
    solution: The salty layer outside draws water out of the slug's cells by osmosis, so it loses water fast.
    mistakes:
      Salt enters its cells and fills them: c9s2_concentration_side
- code: cbse9ex.cell.organelles
  title: Nucleus and cell organelles
  after:
  - cbse9ex.cell.membrane
  notes: |
    Nucleus: double membrane, chromosomes (DNA and protein) carrying genes; controls the cell. Prokaryotes
    (bacteria) lack a nuclear membrane (nucleoid) and membrane-bound organelles; eukaryotes have them.
    Endoplasmic reticulum (rough with ribosomes: proteins; smooth: lipids, detox), Golgi apparatus
    (packaging, lysosome formation), lysosomes (suicide bags, digest waste), mitochondria (powerhouse,
    ATP, own DNA and ribosomes), plastids (chloroplasts for photosynthesis, leucoplasts store starch),
    vacuoles (large in plants). Cell division: mitosis (growth, repair) and meiosis (gametes, halves
    chromosomes).
  explanations:
    text: Inside a cell are small parts called organelles, each with a job. The nucleus is the control room with the DNA. Mitochondria release energy from food. Ribosomes make proteins. The Golgi apparatus packs and ships materials. Lysosomes clean up waste. Plant cells also have chloroplasts to make food from sunlight, and a big vacuole.
    visual: Think of the cell as a school. The nucleus is the principal's office with all the records. Mitochondria are the kitchen giving everyone energy. The ER is the corridors, the Golgi is the office that packs and sends out letters, and lysosomes are the cleaning staff.
    step_by_step: 'Step 1: Ask what job is mentioned: control, energy, proteins, packaging, cleaning, food-making or storage. Step 2: Match: nucleus, mitochondria, ribosomes, Golgi, lysosomes, chloroplasts, vacuoles. Step 3: If there''s no nuclear membrane, it''s a prokaryote.'
    real_world: Your muscle cells have lots of mitochondria because running and lifting need lots of energy. Leaf cells are packed with chloroplasts, which is why leaves are green.
  picture:
    kind: compare
    columns:
    - title: Plant cell
      points:
      - Cell wall outside the membrane
      - Chloroplasts make food
      - One large central vacuole
    - title: Animal cell
      points:
      - Only a cell membrane
      - No chloroplasts
      - Small vacuoles, if any
    alt: Plant cells have a cell wall, chloroplasts and one big vacuole; animal cells have only a membrane, no chloroplasts and small vacuoles.
  activity:
    type: sort
    prompt: Which part of the cell does each job?
    bins:
    - Nucleus
    - Mitochondria
    - Lysosomes
    - Golgi apparatus
    - Chloroplasts
    items:
    - label: Releases energy from food as ATP
      bin: Mitochondria
      clue: Which part is called the powerhouse?
      why: 'Mitochondria release energy as ATP: the cell''s powerhouse.'
    - label: Holds the chromosomes and controls the cell
      bin: Nucleus
      clue: Where is the DNA kept in a plant or animal cell?
      why: The nucleus holds the chromosomes and directs the cell's work.
    - label: Digests worn-out parts of the cell
      bin: Lysosomes
      clue: Which part holds digestive enzymes?
      why: Lysosomes are bags of digestive enzymes that clean up waste.
    - label: Packages and sends out things the cell makes
      bin: Golgi apparatus
      clue: Which part works like a post office?
      why: The Golgi apparatus packs and dispatches materials, and also forms lysosomes.
    - label: Makes food using sunlight
      bin: Chloroplasts
      clue: Which green part is found only in plant cells?
      why: Chloroplasts hold chlorophyll and make food by photosynthesis.
    - label: 'Bursts when a cell is badly damaged: ''suicide bags'''
      bin: Lysosomes
      clue: Which part could digest its own cell?
      why: Lysosomes burst and their enzymes digest the damaged cell.
    - label: Missing in bacteria, which have a nucleoid instead
      bin: Nucleus
      clue: What do prokaryotes not have a membrane around?
      why: Bacteria have no nuclear membrane; their DNA lies in a region called the nucleoid.
    - label: Forms lysosomes
      bin: Golgi apparatus
      clue: Which part packages enzymes into little bags?
      why: The Golgi apparatus packages enzymes into lysosomes.
    - label: Has its own DNA and ribosomes, and makes ATP
      bin: Mitochondria
      clue: Two organelles have their own DNA. Which one makes ATP?
      why: Mitochondria have their own DNA and ribosomes, and make ATP.
    - label: Coloured green by chlorophyll
      bin: Chloroplasts
      clue: Which plastids give leaves their colour?
      why: Chloroplasts contain chlorophyll, which is green.
  lesson:
    - teach: 'The nucleus is the control centre of the cell. It has a double membrane and holds chromosomes, made of DNA and protein, which carry genes: the instructions for building and running the cell.'
      check:
        prompt: Where are the chromosomes of a plant or animal cell?
        options:
        - In the nucleus
        - In the cell wall
        - In the vacuole
        answer: In the nucleus
        why: The nucleus holds the DNA.
    - teach: 'Organelles are the cell''s tiny organs, each with a job. Mitochondria release energy from food (the powerhouse). Ribosomes make proteins. Endoplasmic reticulum (ER) is a network of channels: rough ER has ribosomes; smooth ER makes fats. Golgi apparatus packs and sends out materials.'
      picture:
        kind: compare
        columns:
        - title: Organelle
          points:
          - Mitochondria
          - Ribosomes
          - Rough ER
          - Golgi apparatus
          - Lysosomes
          - Plastids
        - title: Job
          points:
          - Release energy (ATP)
          - Make proteins
          - Carry proteins made on it
          - Pack and send out
          - Digest waste
          - Chloroplasts make food
        alt: Six organelles listed beside their jobs, from mitochondria releasing energy to chloroplasts making food.
      check:
        prompt: Which organelle makes proteins?
        options:
        - Ribosome
        - Lysosome
        - Vacuole
        answer: Ribosome
        why: Ribosomes join amino acids into proteins.
    - teach: 'Lysosomes hold digestive enzymes that break down waste and worn-out parts. If the cell is damaged they can burst and digest the cell itself, so they are called suicide bags. Plant cells have plastids: chloroplasts (green, make food) and leucoplasts (store starch), and a large vacuole full of cell sap.'
      check:
        prompt: Which organelles are found in plant cells but not in animal cells?
        options:
        - Chloroplasts
        - Mitochondria
        - Ribosomes
        answer: Chloroplasts
        why: Both have mitochondria and ribosomes; only plants have chloroplasts.
  items:
  - prompt: Which organelle is called the powerhouse of the cell?
    options:
    - Mitochondria
    - Chloroplast
    - Golgi apparatus
    - Lysosome
    answer: Mitochondria
    difficulty: 1
    hints:
    - It releases energy as ATP.
    - From food, not light.
    solution: 'Mitochondria release energy from food: the powerhouse.'
    mistakes:
      Chloroplast: powerhouse_mitochondria
  - prompt: Which organelle is known as the 'suicide bag' of the cell?
    options:
    - Lysosome
    - Ribosome
    - Vacuole
    - Nucleus
    answer: Lysosome
    difficulty: 1
    hints:
    - It contains digestive enzymes.
    - It can burst and digest its own cell.
    solution: Lysosomes contain digestive enzymes and can digest the cell itself if damaged.
    mistakes: {"Ribosome": "lysosome_enzymes", "Vacuole": "lysosome_enzymes"}
  - prompt: Bacteria have no nuclear membrane. Such cells are called…
    options:
    - Prokaryotic
    - Eukaryotic
    - Plant cells
    - Animal cells
    answer: Prokaryotic
    difficulty: 2
    hints:
    - '''Pro'' means before.'
    - Before a true nucleus.
    solution: Cells without a nuclear membrane are prokaryotic.
    mistakes:
      Eukaryotic: prokaryote_no_nucleus
  - prompt: Which organelle makes food by photosynthesis?
    options:
    - Chloroplast
    - Mitochondria
    - Leucoplast
    - Golgi apparatus
    answer: Chloroplast
    difficulty: 1
    hints:
    - It contains chlorophyll.
    - It's green.
    solution: Chloroplasts use light to make food.
    mistakes:
      Mitochondria: powerhouse_mitochondria
  - prompt: Which organelle packages and sends out materials made in the cell?
    options:
    - Golgi apparatus
    - Nucleus
    - Lysosome
    - Vacuole
    answer: Golgi apparatus
    difficulty: 2
    hints:
    - Think of a post office.
    - It also forms lysosomes.
    solution: The Golgi apparatus packages and dispatches materials.
    mistakes: {"Lysosome": "golgi_packaging", "Nucleus": "golgi_packaging"}
  - prompt: Which type of cell division makes gametes and halves the number of chromosomes?
    options:
    - Meiosis
    - Mitosis
    - Osmosis
    - Diffusion
    answer: Meiosis
    difficulty: 2
    hints:
    - Gametes are sex cells.
    - Mitosis keeps the number the same.
    solution: Meiosis makes gametes with half the chromosomes.
    mistakes: {"Mitosis": "meiosis_gametes", "Osmosis": "meiosis_gametes"}
  - prompt: Rough ER looks rough because it has…
    options:
    - Ribosomes attached
    - Chloroplasts attached
    - Lysosomes inside
    - A cell wall
    answer: Ribosomes attached
    difficulty: 3
    hints:
    - Its job is making proteins.
    - Protein-makers are stuck on it.
    solution: Ribosomes on its surface make it rough; they make proteins.
    mistakes: {"Chloroplasts attached": "rough_er_ribosomes", "Lysosomes inside": "rough_er_ribosomes"}
  - prompt: Which part of the cell carries genes?
    options:
    - Chromosomes
    - Cell wall
    - Vacuole
    - Lysosome
    answer: Chromosomes
    difficulty: 1
    hints:
    - They are in the nucleus.
    - They are made of DNA and protein.
    solution: Genes are parts of the DNA in chromosomes inside the nucleus.
    mistakes:
      Lysosome: lysosome_enzymes
  - prompt: Which organelle has its own DNA and releases energy as ATP?
    options:
    - Mitochondrion
    - Golgi apparatus
    - Lysosome
    - Smooth ER
    answer: Mitochondrion
    difficulty: 1
    hints:
    - It is the powerhouse.
    - Respiration happens here.
    solution: Mitochondria release energy from food as ATP and contain some DNA of their own.
    mistakes:
      Golgi apparatus: golgi_packaging
  - prompt: In plant cells, which organelle stores starch?
    options:
    - Leucoplast
    - Chloroplast
    - Ribosome
    - Lysosome
    answer: Leucoplast
    difficulty: 1
    hints:
    - It is a colourless plastid.
    - '''Leuco'' means white.'
    solution: Leucoplasts are colourless plastids that store starch, oils and proteins.
    mistakes:
      Chloroplast: cell_wall_plants
  - prompt: Which organelle makes fats and helps remove poisons in liver cells?
    options:
    - Smooth endoplasmic reticulum
