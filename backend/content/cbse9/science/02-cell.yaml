    - Nucleus
    - Vacuole
    answer: Smooth endoplasmic reticulum
    difficulty: 2
    hints:
    - It has no ribosomes.
    - Rough ER makes proteins.
    solution: Smooth ER makes lipids and helps detoxify poisons and drugs.
    mistakes:
      Rough endoplasmic reticulum: rough_er_ribosomes
  - prompt: Why are lysosomes called suicide bags?
    options:
    - They can burst and digest their own cell
    - They make the cell divide
    - They store poison from outside
    - They kill bacteria only
    answer: They can burst and digest their own cell
    difficulty: 2
    hints:
    - They hold strong digestive enzymes.
    - What if those leak out?
    solution: When a cell is damaged, lysosomes burst and their enzymes digest the cell.
    mistakes:
      They make the cell divide: lysosome_enzymes
  - prompt: Which structure is large in plant cells and full of cell sap?
    options:
    - Vacuole
    - Nucleus
    - Mitochondrion
    - Ribosome
    answer: Vacuole
    difficulty: 2
    hints:
    - It can take up most of a plant cell.
    - It keeps the cell turgid.
    solution: Plant cells have one large vacuole full of cell sap, which keeps them firm.
    mistakes:
      Nucleus: cell_wall_plants
  - prompt: A cell is making a lot of a protein to send outside. Which pair of organelles is busy?
    options:
    - Rough ER and Golgi apparatus
    - Lysosome and vacuole
    - Chloroplast and cell wall
    - Smooth ER and nucleus only
    answer: Rough ER and Golgi apparatus
    difficulty: 3
    hints:
    - Proteins are made on ribosomes stuck to one kind of ER.
    - Another organelle packs and sends them out.
    solution: Rough ER makes and carries the protein; Golgi packs it and sends it out of the cell.
    mistakes:
      Smooth ER and nucleus only: rough_er_ribosomes
      Lysosome and vacuole: golgi_packaging
  - prompt: Muscle cells in the heart need a lot of energy. Which organelle do they have many of?
    options:
    - Mitochondria
    - Chloroplasts
    - Vacuoles
    - Cell walls
    answer: Mitochondria
    difficulty: 3
    hints:
    - Which organelle releases energy?
    - Animal cells have no chloroplasts.
    solution: Cells that use lots of energy are packed with mitochondria.
    mistakes:
      Chloroplasts: powerhouse_mitochondria
- code: cbse9ex.cell.division
  title: Prokaryotes, eukaryotes and cell division
  after:
  - cbse9ex.cell.organelles
  notes: |
    Prokaryotic cells (bacteria) are small and have no membrane-bound nucleus or organelles; the genetic
    material lies in a region called the nucleoid. Eukaryotic cells (plants, animals, fungi) have a nucleus with
    a nuclear membrane and organelles such as mitochondria. Cells divide: mitosis gives two daughter cells with
    the same number of chromosomes as the parent (growth, repair, asexual reproduction); meiosis, in the
    reproductive organs, gives four cells with half the chromosomes (gametes). Uncontrolled cell division
    can form a tumour; cancer is a disease of cells dividing out of control.
  explanations:
    text: 'Some cells, like bacteria, are simple: no nucleus, just DNA floating inside. These are prokaryotes. Our cells are eukaryotes: they keep DNA in a nucleus. Cells multiply by dividing. Mitosis makes two exact copies for growing and healing; meiosis makes sex cells with half the DNA.'
    visual: 'Draw one cell splitting into two identical cells: mitosis. Then draw one cell splitting into two and each again into two, ending with four smaller cells each holding half the chromosomes: meiosis.'
    step_by_step: 'Step 1: Ask: is there a nucleus with a membrane? No → prokaryote; yes → eukaryote. Step 2: Mitosis: 1 cell → 2 identical cells, same chromosome number. Step 3: Meiosis: 1 cell → 4 cells, half the chromosomes, to make gametes.'
    real_world: When you scrape your knee, mitosis makes new skin cells to close the wound. A tumour forms when cells keep dividing even when the body doesn't need them.
  picture:
    kind: compare
    columns:
    - title: Mitosis
      points:
      - 1 cell → 2 cells
      - Same chromosome number
      - Growth and repair
    - title: Meiosis
      points:
      - 1 cell → 4 cells
      - Half the chromosomes
      - Makes egg and sperm cells
    alt: Mitosis makes two identical cells for growth and repair; meiosis makes four cells with half the chromosomes for reproduction.
  activity:
    type: sort
    prompt: Mitosis or meiosis?
    bins:
    - Mitosis
    - Meiosis
    items:
    - label: Repairs a cut on your skin
      bin: Mitosis
      clue: Do the new skin cells need to be the same as the old ones?
      why: 'Repair needs exact copies with the same chromosomes: mitosis.'
    - label: Makes egg and sperm cells
      bin: Meiosis
      clue: How many chromosomes does a gamete carry?
      why: Gametes carry half the chromosomes, so they are made by meiosis.
    - label: Daughter cells have half the chromosomes
      bin: Meiosis
      clue: Which division halves the number?
      why: Meiosis halves the chromosome number.
    - label: Two daughter cells, identical to the parent
      bin: Mitosis
      clue: Which division makes copies?
      why: Mitosis gives two identical cells with the full set of chromosomes.
    - label: Four daughter cells that differ from each other
      bin: Meiosis
      clue: How many cells, and are they all alike?
      why: Meiosis gives four cells, each with a different mix of genes.
    - label: Makes a plant's root tip grow longer
      bin: Mitosis
      clue: Does growth need copies or gametes?
      why: 'Growth adds identical cells: mitosis in the root tip.'
    - label: Happens in the ovaries and testes to form gametes
      bin: Meiosis
      clue: What do these organs make?
      why: They make gametes, by meiosis.
    - label: Lets a child grow taller
      bin: Mitosis
      clue: Does growing need more of the same cells?
      why: 'Growth needs more identical body cells: mitosis.'
  lesson:
    - teach: 'There are two kinds of cells. Prokaryotic cells (bacteria) are small and simple: no nuclear membrane, so the DNA lies in a region called the nucleoid, and no membrane-bound organelles. Eukaryotic cells (plants, animals, fungi) have a true nucleus and organelles like mitochondria.'
      picture:
        kind: compare
        columns:
        - title: Prokaryotic (bacteria)
          points:
          - No nuclear membrane
          - DNA in the nucleoid
          - No mitochondria
          - Small, 1–10 µm
        - title: Eukaryotic (plants, animals)
          points:
          - True nucleus
          - Membrane-bound organelles
          - Mitochondria present
          - Larger, 5–100 µm
        alt: Prokaryotic cells have no nuclear membrane or organelles; eukaryotic cells have a nucleus and organelles.
      check:
        prompt: What is missing from a prokaryotic cell?
        options:
        - A nuclear membrane
        - DNA
        - A cell membrane
        answer: A nuclear membrane
        why: Its DNA is there, but loose in the nucleoid.
    - teach: Cells divide to grow, repair and reproduce. In mitosis one cell makes two daughter cells, each with the same number of chromosomes as the parent. A cut on your finger heals by mitosis.
      check:
        prompt: A body cell with 46 chromosomes divides by mitosis. How many does each daughter cell have?
        options:
        - '46'
        - '23'
        - '92'
        answer: '46'
        why: Mitosis keeps the number the same.
    - teach: 'In meiosis, cells in the reproductive organs divide to make four gametes (eggs or sperm), each with half the chromosomes: 23 in humans. At fertilisation, egg (23) + sperm (23) gives 46 again. When cells divide out of control, a tumour can form: cancer.'
      check:
        prompt: Why must gametes have half the chromosomes?
        options:
        - So the fertilised egg has the normal number
        - So they are smaller
        - So they divide faster
        answer: So the fertilised egg has the normal number
        why: 23 + 23 = 46.
  items:
  - prompt: Which of these is a prokaryote?
    options:
    - A bacterium
    - An onion peel cell
    - A human cheek cell
    - Yeast
    answer: A bacterium
    difficulty: 1
    hints:
    - No membrane-bound nucleus.
    - Yeast is a fungus with a nucleus.
    solution: 'Step 1: Bacteria have no nuclear membrane. Step 2: Plant, animal and yeast cells are eukaryotic.'
    mistakes:
      Yeast: prokaryote_nucleus
  - prompt: How many daughter cells does mitosis produce from one cell?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Growth needs copies.
    - One splits into…
    solution: 'Step 1: Mitosis divides one cell into 2 identical cells.'
    mistakes:
      '4': mitosis_meiosis_swap
  - prompt: Where in a prokaryotic cell is the genetic material?
    options:
    - In the nucleoid, in the cytoplasm
    - Inside a nuclear membrane
    - In the cell wall
    - In the vacuole
    answer: In the nucleoid, in the cytoplasm
    difficulty: 2
    hints:
    - There is no nuclear membrane.
    - The region has a name ending in -oid.
    solution: 'Step 1: Prokaryotes have no true nucleus. Step 2: Their DNA lies in a region of the cytoplasm called the nucleoid.'
    mistakes:
      Inside a nuclear membrane: prokaryote_nucleus
  - prompt: Which type of division makes egg and sperm cells?
    options:
    - Meiosis
    - Mitosis
    - Osmosis
    - Diffusion
    answer: Meiosis
    difficulty: 2
    hints:
    - Sex cells carry half the chromosomes.
    - Osmosis is about water.
    solution: 'Step 1: Gametes need half the chromosomes so that fertilisation restores the full number. Step 2: Meiosis makes them.'
    mistakes:
      Mitosis: mitosis_meiosis_swap
  - prompt: A human body cell has 46 chromosomes. How many does a human egg cell have?
    answer: '23'
    check: 46/2
    difficulty: 2
    hints:
    - Meiosis halves the number.
    - 46 ÷ 2.
    solution: 'Step 1: Egg cells are made by meiosis. Step 2: 46 ÷ 2 = 23.'
    mistakes:
      '46': mitosis_meiosis_swap
  - prompt: Why is cancer called a disease of cell division?
    options:
    - Cells keep dividing out of control and form a tumour
    - Cells stop dividing completely
    - Cells lose their cell wall
    - Cells turn into bacteria
    answer: Cells keep dividing out of control and form a tumour
    difficulty: 3
    hints:
    - Normally division stops when enough cells are made.
    - A lump of extra cells.
    solution: 'Step 1: Normal cells divide only when needed. Step 2: Cancer cells ignore the controls and keep dividing, forming tumours.'
    mistakes: {"Cells stop dividing completely": "cancer_uncontrolled", "Cells turn into bacteria": "cancer_uncontrolled"}
  - prompt: Which of these cells is eukaryotic?
    options:
    - A human cheek cell
    - A bacterium
    - Blue-green algae (cyanobacteria)
    - E. coli
    answer: A human cheek cell
    difficulty: 1
    hints:
    - Eukaryotic cells have a true nucleus.
    - Bacteria and cyanobacteria don't.
    solution: Human cells have a nucleus with a membrane, so they are eukaryotic.
    mistakes:
      A bacterium: prokaryote_nucleus
      Blue-green algae (cyanobacteria): prokaryote_no_nucleus
  - prompt: Which type of division helps a wound heal?
    options:
    - Mitosis
    - Meiosis
    - Osmosis
    - Diffusion
    answer: Mitosis
    difficulty: 1
    hints:
    - New body cells must be the same as the old ones.
    - Same number of chromosomes.
    solution: Mitosis makes identical new cells for growth and repair.
    mistakes:
      Meiosis: mitosis_meiosis_swap
  - prompt: How many daughter cells does meiosis produce from one cell?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - It divides twice.
    - Not 2.
    solution: Meiosis has two divisions, giving four cells, each with half the chromosomes.
    mistakes:
      '2': meiosis_gametes
  - prompt: A dog's body cells have 78 chromosomes. How many are in a dog's sperm cell?
    answer: '39'
    check: 78/2
    difficulty: 2
    hints:
    - Gametes have half.
    - 78 ÷ 2.
    solution: 'Meiosis halves the number: 39.'
    mistakes:
      '78': meiosis_gametes
      '156': meiosis_gametes
  - prompt: Which organelle do bacteria NOT have?
    options:
    - Mitochondria
    - Ribosomes
    - Cell membrane
    - DNA
    answer: Mitochondria
    difficulty: 2
    hints:
    - Prokaryotes have no membrane-bound organelles.
    - They do make proteins.
    solution: Bacteria have ribosomes and DNA but no membrane-bound organelles like mitochondria.
    mistakes:
      Ribosomes: prokaryote_no_nucleus
      DNA: prokaryote_nucleus
  - prompt: An onion root tip grows longer. Which division happens there?
    options:
    - Mitosis
    - Meiosis
    - Both equally
    - Neither
    answer: Mitosis
    difficulty: 2
    hints:
    - Growth needs more identical cells.
    - Gametes aren't being made.
    solution: Root tips grow by mitosis, making many identical cells.
    mistakes:
      Meiosis: mitosis_meiosis_swap
  - prompt: After fertilisation, a human egg (23) and sperm (23) join. How many chromosomes does the new cell have?
    answer: '46'
    check: 23 + 23
    difficulty: 2
    hints:
    - Add the two.
    - 23 + 23.
    solution: 23 + 23 = 46, the normal number for a body cell.
    mistakes:
      '23': meiosis_gametes
  - prompt: What is a tumour?
    options:
    - A lump formed by cells dividing out of control
    - A kind of bacterium
    - A cell with no nucleus
    - A gamete
    answer: A lump formed by cells dividing out of control
    difficulty: 3
    hints:
    - Normal cells stop dividing when told to.
    - Some don't.
    solution: When cell division escapes control, cells pile up into a lump called a tumour; some tumours are cancer.
    mistakes:
      A kind of bacterium: cancer_uncontrolled
  - prompt: Why would meiosis in body cells (not reproductive organs) be harmful?
    options:
    - The new cells would have half the chromosomes and miss instructions
    - They would make too many mitochondria
    - It would make the body bigger
    - It is not harmful
    answer: The new cells would have half the chromosomes and miss instructions
    difficulty: 3
    hints:
    - What does meiosis do to the chromosome number?
    - Body cells need the full set.
    solution: Meiosis halves the chromosomes. Body cells need the full set of genes, so half a set would be harmful.
    mistakes:
      It is not harmful: mitosis_meiosis_swap
