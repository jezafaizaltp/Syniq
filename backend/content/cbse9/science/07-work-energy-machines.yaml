# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 7. Format: content/README.md.
subject: cbse9-sci
chapter: 7
title: Work, Energy and Simple Machines
tips:
  v_squared_root: 'That is v², not v. Take the square root at the end: if v² = 100, then v = 10.'
  work_zero_no_displacement: 'No displacement in the direction of the force means no work: pushing a wall that doesn''t move does zero work.'
  ke_half: 'Kinetic energy is ½mv²: square the speed, then halve.'
  kwh_unit: 1 kWh = 1 unit of electricity = 1000 W for 1 hour = 3.6 × 10⁶ J.
  ma_inverted: Mechanical advantage = load ÷ effort. If a machine lets a small effort lift a big load, the MA is more than 1.
  machine_saves_work: 'A machine can reduce the force needed, but you then move it a longer distance: it never reduces the work.'
concepts:
- code: cbse9ex.energy.work
  title: Work, kinetic and potential energy
  notes: |
    Work W = F × s when force and displacement are in the same direction (joule, J). Work is negative when
    force opposes motion; zero if there is no displacement or the force is perpendicular. Kinetic energy
    Eₖ = ½mv². Potential energy at height h: Eₚ = mgh. Energy is conserved: it changes form but the total
    stays the same (falling body: Eₚ turns into Eₖ).
  explanations:
    text: 'In science, work is done only when a force moves something: W = F × s. Holding a heavy bag still does no work, however tiring. Moving things have kinetic energy, ½mv². Things lifted up have potential energy, mgh. As a ball falls, its potential energy turns into kinetic energy; the total stays the same.'
    visual: 'Picture a swing. At the top of each swing it stops for a moment: all potential energy. At the bottom it''s fastest: all kinetic energy. It keeps trading one for the other.'
    step_by_step: 'Step 1: Work = force × displacement in the force''s direction. Step 2: KE = ½ × m × v². Step 3: PE = m × g × h. Step 4: For a falling object, PE lost = KE gained.'
    real_world: Water stored high in a dam has potential energy. As it falls through the turbines it gains kinetic energy, which spins generators to make electricity.
  picture:
    kind: flow
    steps:
    - 'Top of the swing: stopped for a moment, all potential energy'
    - 'Going down: potential energy turns into kinetic'
    - 'Bottom: fastest, all kinetic energy'
    - 'Going up: kinetic turns back into potential'
    - The total stays the same, if we ignore friction
    alt: 'A swing trades energy: all potential at the top, all kinetic at the bottom, with the total staying the same.'
  items:
  - prompt: A force of 10 N moves a box 5 m in its direction. Find the work done, in J.
    answer: '50'
    check: 10*5
    difficulty: 1
    hints:
    - W = F × s.
    - 10 × 5.
    solution: W = 10 × 5 = 50 J.
  - prompt: A person pushes hard on a wall, but it doesn't move. How much work is done, in J?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Displacement is 0.
    - W = F × 0.
    solution: No displacement, so W = 0.
    mistakes:
      '1': work_zero_no_displacement
  - prompt: Find the kinetic energy of a 2 kg ball moving at 3 m/s, in J.
    answer: '9'
    check: 1/2*2*3^2
    difficulty: 1
    hints:
    - KE = ½mv².
    - ½ × 2 × 9.
    solution: KE = ½ × 2 × 9 = 9 J.
    mistakes:
      '18': ke_half
      '3': ke_speed_squared
  - prompt: Find the potential energy of a 5 kg object 4 m above the ground (g = 10 m/s²), in J.
    answer: '200'
    check: 5*10*4
    difficulty: 1
    hints:
    - PE = mgh.
    - 5 × 10 × 4.
    solution: PE = 5 × 10 × 4 = 200 J.
  - prompt: A car's speed doubles. Its kinetic energy becomes how many times bigger?
    answer: '4'
    check: 2^2
    difficulty: 2
    hints:
    - KE ∝ v².
    - 2².
    solution: KE ∝ v², so doubling speed makes KE 4 times.
    mistakes:
      '2': ke_speed_squared
  - prompt: A 1 kg ball is dropped from 5 m (g = 10 m/s²). What is its kinetic energy just before hitting the ground, in J?
    answer: '50'
    check: 1*10*5
    difficulty: 2
    hints:
    - PE at top = KE at bottom.
    - mgh = 1 × 10 × 5.
    solution: 'All the PE, mgh = 50 J, turns into KE: 50 J.'
    mistakes:
      '0': energy_conserved
  - prompt: A 1 kg ball is dropped from 5 m (g = 10 m/s²). What is its speed just before hitting the ground, in m/s?
    answer: '10'
    check: sqrt(2*10*5)
    difficulty: 3
    hints:
    - ½mv² = mgh.
    - v² = 2gh = 100.
    solution: ½ × 1 × v² = 50, so v² = 100 and v = 10 m/s.
    mistakes:
      '100': v_squared_root
- code: cbse9ex.energy.power
  title: Power and commercial unit of energy
  after:
  - cbse9ex.energy.work
  notes: |
    Power P = W/t, the rate of doing work (watt, W = J/s; 1 kW = 1000 W). Average power. Commercial unit:
    kilowatt hour, 1 kWh = 3.6 × 10⁶ J = 1 unit of electricity. Energy used = power × time.
  explanations:
    text: 'Power is how quickly work is done: P = W ÷ t, measured in watts. A 100 W bulb uses 100 joules every second. Electricity bills count energy in kilowatt hours (units): a 1000 W heater running for 1 hour uses 1 kWh.'
    visual: Two people carry the same bucket up the same stairs. They do the same work, but the one who runs up in 10 s has more power than the one who walks up in 40 s.
    step_by_step: 'Step 1: Power = work (J) ÷ time (s). Step 2: For energy in kWh, change watts to kilowatts (÷ 1000). Step 3: Multiply by hours. Step 4: 1 kWh = 3.6 × 10⁶ J if joules are needed.'
    real_world: A 1.5 kW AC running 4 hours a day uses 6 units a day. At ₹6 a unit that's ₹36 a day, which is why switching it off matters.
  picture:
    kind: bars
    unit: power in watts (1500 J of work each)
    bars:
    - label: Runs up in 10 s
      value: 150
    - label: Walks up in 30 s
      value: 50
    caption: 'Same work, 1500 J. Power = work ÷ time: 1500 ÷ 10 = 150 W and 1500 ÷ 30 = 50 W.'
    alt: Two people do the same 1500 J of work climbing stairs. The one who takes 10 s has 150 W of power; the one who takes 30 s has 50 W.
  items:
  - prompt: A motor does 600 J of work in 20 s. Find its power, in W.
    answer: '30'
    check: 600/20
    difficulty: 1
    hints:
    - P = W ÷ t.
    - 600 ÷ 20.
    solution: P = 600 ÷ 20 = 30 W.
    mistakes:
      '12000': power_per_time
  - prompt: A 100 W bulb is used for 10 hours. How many kWh (units) does it use?
    answer: '1'
    check: 100/1000*10
    difficulty: 1
    hints:
    - 100 W = 0.1 kW.
    - 0.1 × 10.
    solution: 0.1 kW × 10 h = 1 kWh.
    mistakes:
      '1000': kw_to_w
  - prompt: How many joules are in 1 kWh?
    options:
    - 3.6 × 10⁶ J
    - 1000 J
    - 3600 J
    - 3.6 × 10³ J
    answer: 3.6 × 10⁶ J
    difficulty: 2
    hints:
    - 1000 W × 3600 s.
    - 3,600,000.
    solution: 1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J.
    mistakes:
      3600 J: kwh_unit
  - prompt: A 2 kW heater runs for 3 hours. How many units of electricity does it use?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - kWh = kW × h.
    - 2 × 3.
    solution: 2 × 3 = 6 kWh.
  - prompt: A girl of mass 40 kg climbs 5 m of stairs in 10 s (g = 10 m/s²). Find her power, in W.
    answer: '200'
    check: 40*10*5/10
    difficulty: 3
    hints:
    - Work = mgh.
    - 2000 J ÷ 10 s.
    solution: 'Step 1: W = 40 × 10 × 5 = 2000 J. Step 2: P = 2000 ÷ 10 = 200 W.'
  - prompt: Four 60 W fans run for 5 hours a day. How many units are used per day?
    answer: '1.2'
    check: 4*60/1000*5
    difficulty: 2
    hints:
    - Total power 240 W = 0.24 kW.
    - 0.24 × 5.
    solution: 0.24 kW × 5 h = 1.2 kWh.
    mistakes:
      '1200': kw_to_w
- code: cbse9ex.energy.machines
  title: Simple machines
  after:
  - cbse9ex.energy.work
  notes: |
    Simple machines (lever, pulley, inclined plane, wheel and axle, wedge, screw) make work easier by changing
    the size or direction of a force. Mechanical advantage (MA) = load ÷ effort. A lever balances when
    load × load arm = effort × effort arm. Levers: class 1 (fulcrum between, see-saw, scissors), class 2 (load
    between, nutcracker, wheelbarrow), class 3 (effort between, tongs, forearm). A single fixed pulley changes
    only the direction (MA = 1); a movable pulley halves the effort (ideal MA = 2). Inclined plane: ideal
    MA = length ÷ height. No machine gives more work out than is put in; friction makes real efficiency less
    than 100%.
  explanations:
    text: A simple machine trades distance for force. With a long lever or a ramp, you push with a small force over a long distance to move a heavy load a short distance. MA = load ÷ effort tells you how much the machine multiplies your force.
    visual: 'Draw a see-saw: a 600 N load 1 m from the pivot and you pushing 3 m from the pivot. To balance, effort × 3 = 600 × 1, so effort = 200 N. MA = 600 ÷ 200 = 3.'
    step_by_step: 'Step 1: Identify load, effort and fulcrum (or the slope). Step 2: For a lever, load × load arm = effort × effort arm. Step 3: Find the effort. Step 4: MA = load ÷ effort.'
    real_world: 'A ramp for wheelchairs is a long inclined plane: it takes longer to go up, but the force needed is far less than lifting straight up.'
  picture:
    kind: flow
    steps:
    - Load 600 N at 1 m
    - Effort at 3 m from the pivot
    - Effort × 3 = 600 × 1
    - Effort = 200 N
    - MA = 600 ÷ 200 = 3
    alt: A lever with a 600 newton load 1 metre from the pivot balanced by a 200 newton effort 3 metres away, mechanical advantage 3.
  items:
  - prompt: A machine lifts a 500 N load with an effort of 100 N. What is its mechanical advantage?
    answer: '5'
    check: 500/100
    difficulty: 1
    hints:
    - MA = load ÷ effort.
    - 500 ÷ 100.
    solution: 'Step 1: MA = 500 ÷ 100. Step 2: = 5.'
    mistakes:
      '0.2': ma_inverted
  - prompt: In a nutcracker, where is the load (the nut)?
    options:
    - Between the fulcrum and the effort
    - At the fulcrum
    - Beyond the effort
    - Between two fulcrums
    answer: Between the fulcrum and the effort
    difficulty: 1
    hints:
    - The hinge is the fulcrum.
    - You squeeze at the ends.
    solution: 'Step 1: Fulcrum at the hinge, effort at the handles. Step 2: The nut sits between them: a class 2 lever.'
  - prompt: A lever has a 900 N load 0.5 m from the fulcrum. What effort, 1.5 m from the fulcrum, balances it, in N?
    answer: '300'
    check: 900*0.5/1.5
    difficulty: 2
    hints:
    - Load × load arm = effort × effort arm.
    - 900 × 0.5 = effort × 1.5.
    solution: 'Step 1: 900 × 0.5 = 450. Step 2: 450 ÷ 1.5 = 300 N.'
  - prompt: What does a single fixed pulley do?
    options:
    - Changes the direction of the force, MA = 1
    - Halves the effort
    - Doubles the load
    - Removes friction
    answer: Changes the direction of the force, MA = 1
    difficulty: 2
    hints:
    - Pulling down to lift up.
    - The effort equals the load.
    solution: 'Step 1: You pull down and the load goes up. Step 2: The force needed is the same as the load, so MA = 1.'
  - prompt: A ramp is 6 m long and 1.5 m high. What is its ideal mechanical advantage?
    answer: '4'
    check: 6/1.5
    difficulty: 2
    hints:
    - Ideal MA = length ÷ height.
    - 6 ÷ 1.5.
    solution: 'Step 1: MA = 6 ÷ 1.5 = 4. Step 2: You push with a quarter of the weight, over 4 times the distance.'
  - prompt: A student says a lever with MA = 4 gives four times as much work. Why is this wrong?
    options:
    - Effort moves 4 times as far, so work out is at most work in
    - MA has nothing to do with force
    - Levers always lose half the work
    - Work is not measured in joules
    answer: Effort moves 4 times as far, so work out is at most work in
    difficulty: 3
    hints:
    - Work = force × distance.
    - Energy is conserved.
    solution: 'Step 1: The force is multiplied by 4, but the effort moves 4 times further. Step 2: Work in ≥ work out; machines never create energy.'
    mistakes:
      Levers always lose half the work: machine_saves_work
