# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 7. Format: content/README.md.
subject: cbse9-sci
chapter: 7
title: Work, Energy and Simple Machines
tips:
  v_squared_root: "The equation gives v², not v. Take the square root at the end: if v² = 49, then v = 7."
  work_zero_no_displacement: 'No displacement in the direction of the force means no work: pushing a wall that doesn''t move does zero work.'
  c9s7_right_angle: "Work counts only the part of the motion along the force. Gravity pulls towards the centre; which way does the satellite move compared with that?"
  c9s7_force_against: "Friction points backwards while the box moves forwards. When a force acts against the motion, the work it does has a minus sign: it takes energy away."
  ke_half: 'Kinetic energy is ½mv²: square the speed, then halve.'
  kwh_unit: "1 kWh means 1000 watts for one hour. Change the hour to seconds and multiply: watts × seconds = joules."
  ma_inverted: Mechanical advantage = load ÷ effort. If a machine lets a small effort lift a big load, the MA is more than 1.
  machine_saves_work: 'A machine can reduce the force needed, but you then move it a longer distance: it never reduces the work.'
  fixed_pulley: "With a single fixed pulley you pull down to lift up. Is the force you need any smaller than the load?"
  lever_class_two: "In a nutcracker the hinge is at one end and you squeeze the handles at the other end. Where does the nut sit?"
  lever_moments: "Load × its distance = effort × its distance. Find the load's turning effect, then divide by the effort's distance."
  power_mgh_time: "First find the work done climbing (mass × g × height), then divide by the time."
  ramp_ma: "Ideal mechanical advantage of a ramp = length ÷ height. Divide, don't multiply."
  units_kwh: "One unit = 1 kWh. Multiply the power in kW by the hours."
  work_force_distance: "Work = force × distance moved in the direction of the force. Multiply, don't add."
concepts:
- code: cbse9ex.energy.work
  title: Work, kinetic and potential energy
  notes: |
    Work W = F × s when force and displacement are in the same direction (joule, J). Work is negative when
    force opposes motion; zero if there is no displacement or the force is perpendicular. Kinetic energy
    Eₖ = ½mv². Potential energy at height h: Eₚ = mgh. Energy is conserved: it changes form but the total
    stays the same (falling body: Eₚ turns into Eₖ).
  explanations:
    text: 'In science, work is done only when a force moves something: W = F × s. Holding a heavy bag still does no work, however tiring. Moving things have kinetic energy, ½mv². Things lifted up have potential energy, mgh. As a ball falls, its potential energy turns into kinetic energy; the total stays the same.'
    visual: 'Picture a swing. At the top of each swing it stops for a moment: all potential energy. At the bottom it''s fastest: all kinetic energy. It keeps trading one for the other.'
    step_by_step: 'Step 1: Work = force × displacement in the force''s direction. Step 2: KE = ½ × m × v². Step 3: PE = m × g × h. Step 4: For a falling object, PE lost = KE gained.'
    real_world: Water stored high in a dam has potential energy. As it falls through the turbines it gains kinetic energy, which spins generators to make electricity.
  picture:
    kind: flow
    steps:
    - 'Top of the swing: stopped for a moment, all potential energy'
    - 'Going down: potential energy turns into kinetic'
    - 'Bottom: fastest, all kinetic energy'
    - 'Going up: kinetic turns back into potential'
    - The total stays the same, if we ignore friction
    alt: 'A swing trades energy: all potential at the top, all kinetic at the bottom, with the total staying the same.'
  activity:
    type: formula
    prompt: Drop a ball of mass m from height h (g = 10 m/s²). Its potential energy mgh turns into kinetic energy ½mv².
    inputs:
    - name: m
      label: Mass m
      min: 0.5
      max: 5
      step: 0.5
      start: 0.5
      unit: kg
    - name: h
      label: Height h
      min: 0
      max: 20
      step: 1
      start: 0
      unit: m
    outputs:
    - name: pe
      label: Potential energy at the top
      expr: m*10*h
      unit: J
    - name: ke
      label: Kinetic energy at the ground
      expr: m*10*h
      unit: J
    - name: v
      label: Speed at the ground
      expr: sqrt(20*h)
      unit: m/s
      places: 1
    goals:
    - prompt: Drop a 2 kg ball so it lands with 200 J of kinetic energy.
      want:
        m: 2
        ke: 200
      hint: All the mgh becomes kinetic energy. 2 × 10 × h = 200.
      mistakes:
      - when:
          m: 2
          h: 20
        say: 'From 20 m, mgh = 2 × 10 × 20 = 400 J: twice too much. All the mgh at the top becomes kinetic energy at the ground.'
    - prompt: Make the ball land at 10 m/s.
      want:
        v: 10
      mistakes:
      - when:
          h: 10
        say: 'From 10 m it lands at 14.1 m/s. mgh = ½mv², so v² (not v) grows with height: v² = 2gh.'
      - when:
          h: 20
        say: 'From 20 m it lands at 20 m/s. Twice the height doesn''t give twice the speed: speed grows with √h.'
  lesson:
    - teach: 'In science, work is done only when a force moves something in the direction of the force. Work = force × displacement, W = F × s, measured in joules (J). Push a box with 20 N for 3 m: W = 60 J. Push a wall that doesn''t move: no displacement, so no work, however tired you feel.'
      check:
        prompt: A coolie carries a load and stands still. How much work is done on the load?
        options:
        - Zero
        - A lot
        - Depends on the load
        answer: Zero
        why: The load doesn't move, so displacement and work are zero.
    - teach: Energy is the ability to do work, also in joules. A moving object has kinetic energy, Eₖ = ½mv². An object raised to a height has potential energy, Eₚ = mgh (g ≈ 10 m/s²). Doubling speed makes kinetic energy four times as big, because v is squared.
      check:
        prompt: A 2 kg ball moves at 4 m/s. What is its kinetic energy?
        options:
        - 16 J
        - 8 J
        - 32 J
        answer: 16 J
        why: ½ × 2 × 16 = 16.
    - teach: Energy is never made or destroyed; it only changes form. A falling ball loses potential energy and gains the same amount of kinetic energy. Just before it lands, all the mgh has become ½mv².
      picture:
        kind: bars
        bars:
        - label: 'Top: Eₚ'
          value: 100
        - label: 'Top: Eₖ'
          value: 0
        - label: 'Halfway: Eₚ'
          value: 50
        - label: 'Halfway: Eₖ'
          value: 50
        - label: 'Bottom: Eₚ'
          value: 0
        - label: 'Bottom: Eₖ'
          value: 100
        unit: J
        alt: A falling ball's 100 J of energy shifts from potential at the top to half and half midway to all kinetic at the bottom.
      check:
        prompt: A ball starts with 80 J of potential energy. Halfway down, its kinetic energy is…
        options:
        - 40 J
        - 80 J
        - 0 J
        answer: 40 J
        why: Half of the potential energy has become kinetic; the total stays 80 J.
  items:
  - prompt: A force of 10 N moves a box 5 m in its direction. Find the work done, in J.
    answer: '50'
    check: 10*5
    difficulty: 1
    hints:
    - W = F × s.
    - 10 × 5.
    solution: W = 10 × 5 = 50 J.
    mistakes: {"15": "work_force_distance", "2": "work_force_distance"}
  - prompt: A person pushes hard on a wall, but it doesn't move. How much work is done, in J?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Displacement is 0.
    - W = F × 0.
    solution: No displacement, so W = 0.
    mistakes:
      '1': work_zero_no_displacement
  - prompt: Find the kinetic energy of a 2 kg ball moving at 3 m/s, in J.
    answer: '9'
    check: 1/2*2*3^2
    difficulty: 1
    hints:
    - KE = ½mv².
    - ½ × 2 × 9.
    solution: KE = ½ × 2 × 9 = 9 J.
    mistakes:
      '18': ke_half
      '3': ke_speed_squared
  - prompt: Find the potential energy of a 5 kg object 4 m above the ground (g = 10 m/s²), in J.
    answer: '200'
    check: 5*10*4
    difficulty: 1
    hints:
    - PE = mgh.
    - 5 × 10 × 4.
    solution: PE = 5 × 10 × 4 = 200 J.
    mistakes: {"20": "pe_mgh", "19": "pe_mgh"}
  - prompt: A car's speed doubles. Its kinetic energy becomes how many times bigger?
    answer: '4'
    check: 2^2
    difficulty: 2
    hints:
    - KE ∝ v².
    - 2².
    solution: KE ∝ v², so doubling speed makes KE 4 times.
    mistakes:
      '2': ke_speed_squared
  - prompt: A 1 kg ball is dropped from 5 m (g = 10 m/s²). What is its kinetic energy just before hitting the ground, in J?
    answer: '50'
    check: 1*10*5
    difficulty: 2
    hints:
    - PE at top = KE at bottom.
    - mgh = 1 × 10 × 5.
    solution: 'All the PE, mgh = 50 J, turns into KE: 50 J.'
    mistakes:
      '0': energy_conserved
  - prompt: A 1 kg ball is dropped from 5 m (g = 10 m/s²). What is its speed just before hitting the ground, in m/s?
    answer: '10'
    check: sqrt(2*10*5)
    difficulty: 3
    hints:
    - ½mv² = mgh.
    - v² = 2gh = 100.
    solution: ½ × 1 × v² = 50, so v² = 100 and v = 10 m/s.
    mistakes:
      '100': v_squared_root
  - prompt: A force of 25 N pulls a cart 4 m along its direction. Find the work done, in J.
    answer: '100'
    check: 25*4
    difficulty: 1
    hints:
    - W = F × s.
    - 25 × 4.
    solution: 25 × 4 = 100 J.
    mistakes:
      '6.25': work_force_distance
      '29': work_force_distance
  - prompt: Find the kinetic energy of a 4 kg trolley moving at 5 m/s, in J.
    answer: '50'
    check: 0.5*4*25
    difficulty: 1
    hints:
    - Eₖ = ½mv².
    - ½ × 4 × 25.
    solution: ½ × 4 × 25 = 50 J.
    mistakes:
      '100': ke_half
      '10': ke_half
  - prompt: Find the potential energy of a 10 kg bag lifted 3 m (g = 10 m/s²), in J.
    answer: '300'
    check: 10*10*3
    difficulty: 1
    hints:
    - Eₚ = mgh.
    - 10 × 10 × 3.
    solution: 10 × 10 × 3 = 300 J.
    mistakes:
      '30': work_force_distance
  - prompt: A satellite moves in a circle around Earth. Gravity pulls towards the centre, at right angles to its motion. How much work does gravity do?
    options:
    - Zero
    - Positive
    - Negative
    - It depends on speed
    answer: Zero
    difficulty: 2
    hints:
    - Is there displacement along the force?
    - The force is at right angles to the motion.
    solution: A force at right angles to the displacement does no work.
    mistakes:
      Positive: c9s7_right_angle
  - prompt: A ball's speed triples. How many times bigger is its kinetic energy?
    answer: '9'
    check: 3**2
    difficulty: 2
    hints:
    - Eₖ depends on v².
    - 3².
    solution: (3v)² = 9v², so 9 times.
    mistakes:
      '3': v_squared_root
      '6': v_squared_root
  - prompt: A 2 kg stone is dropped from 20 m (g = 10 m/s²). What is its kinetic energy just before landing, in J?
    answer: '400'
    check: 2*10*20
    difficulty: 2
    hints:
    - All potential energy turns into kinetic.
    - mgh = 2 × 10 × 20.
    solution: Eₖ = mgh = 400 J.
    mistakes:
      '40': work_force_distance
      '200': ke_half
  - prompt: Friction of 15 N acts on a sliding box over 4 m. What work does friction do on the box, in J?
    answer: '-60'
    check: -15*4
    difficulty: 2
    hints:
    - Friction acts against the motion.
    - So the work is negative.
    solution: W = −15 × 4 = −60 J; friction takes energy away.
    mistakes:
      '60': c9s7_force_against
  - prompt: A 0.5 kg ball has 25 J of kinetic energy. What is its speed, in m/s?
    answer: '10'
    check: sqrt(2*25/0.5)
    difficulty: 3
    hints:
    - 25 = ½ × 0.5 × v².
    - v² = 100.
    solution: v² = 25 × 2 ÷ 0.5 = 100, so v = 10 m/s.
    mistakes:
      '100': v_squared_root
      '50': ke_half
- code: cbse9ex.energy.power
  title: Power and commercial unit of energy
  after:
  - cbse9ex.energy.work
  notes: |
    Power P = W/t, the rate of doing work (watt, W = J/s; 1 kW = 1000 W). Average power. Commercial unit:
    kilowatt hour, 1 kWh = 3.6 × 10⁶ J = 1 unit of electricity. Energy used = power × time.
  explanations:
    text: 'Power is how quickly work is done: P = W ÷ t, measured in watts. A 100 W bulb uses 100 joules every second. Electricity bills count energy in kilowatt hours (units): a 1000 W heater running for 1 hour uses 1 kWh.'
    visual: Two people carry the same bucket up the same stairs. They do the same work, but the one who runs up in 10 s has more power than the one who walks up in 40 s.
    step_by_step: 'Step 1: Power = work (J) ÷ time (s). Step 2: For energy in kWh, change watts to kilowatts (÷ 1000). Step 3: Multiply by hours. Step 4: 1 kWh = 3.6 × 10⁶ J if joules are needed.'
    real_world: A 1.5 kW AC running 4 hours a day uses 6 units a day. At ₹6 a unit that's ₹36 a day, which is why switching it off matters.
  picture:
    kind: bars
    unit: power in watts (1500 J of work each)
    bars:
    - label: Runs up in 10 s
      value: 150
    - label: Walks up in 30 s
      value: 50
    caption: 'Same work, 1500 J. Power = work ÷ time: 1500 ÷ 10 = 150 W and 1500 ÷ 30 = 50 W.'
    alt: Two people do the same 1500 J of work climbing stairs. The one who takes 10 s has 150 W of power; the one who takes 30 s has 50 W.
  activity:
    type: formula
    prompt: An appliance of power P runs for some minutes each day. 1 unit = 1 kWh = 1000 W for 1 hour.
    inputs:
    - name: p
      label: Power P
      min: 100
      max: 2000
      step: 100
      start: 100
      unit: W
    - name: t
      label: Minutes a day
      min: 0
      max: 600
      step: 15
      start: 0
      unit: min
    outputs:
    - name: day
      label: Units each day
      expr: p*t/60/1000
      unit: kWh
      places: 2
    - name: month
      label: Units in 30 days
      expr: p*t/60/1000*30
      unit: kWh
      places: 1
    - name: bill
      label: Monthly cost at ₹8 a unit
      expr: p*t/60/1000*30*8
      unit: ₹
      places: 0
    goals:
    - prompt: 'A 2000 W geyser: keep the month''s use to exactly 60 units.'
      want:
        p: 2000
        month: 60
      hint: 60 units in 30 days is how many units a day? How long does 2000 W take to use 1 unit?
      mistakes:
      - when:
          p: 2000
          t: 120
        say: 2 hours a day at 2000 W is 4 units a day, 120 a month. Each hour at 2000 W uses 2 units.
      - when:
          p: 2000
          t: 30
        say: 30 minutes a day is 1 unit a day, 30 a month.
    - prompt: 'A 100 W bulb: how long must it run to use exactly 1 unit a day?'
      want:
        p: 100
        day: 1
      mistakes:
      - when:
          p: 100
          t: 60
        say: 100 W for 1 hour is only 0.1 unit. One unit is 1000 W for an hour, so a 100 W bulb takes longer.
      - when:
          p: 100
          t:
          - 90
          - 120
        say: 1.5 to 2 hours makes only 0.15 to 0.2 unit. A unit counts kilowatts × hours, and 100 W is just 0.1 kW.
  lesson:
    - teach: 'Two people can do the same work, but one faster. Power is the rate of doing work: P = W ÷ t, in watts (W). 1 W = 1 J per second; 1 kW = 1000 W. A 60 W bulb uses 60 J of energy every second.'
      check:
        prompt: A pump does 1200 J of work in 60 s. What is its power?
        options:
        - 20 W
        - 72000 W
        - 1260 W
        answer: 20 W
        why: 1200 ÷ 60 = 20.
    - teach: Joules are tiny for household use, so electricity is sold in kilowatt hours (kWh), called units. 1 kWh is the energy used by a 1 kW appliance in 1 hour = 1000 × 3600 J = 3.6 × 10⁶ J. Energy in kWh = power in kW × time in hours.
      picture:
        kind: flow
        steps:
        - Power in W ÷ 1000 = kW
        - × hours used
        - = kWh (units)
        - × rate per unit = bill
        alt: Steps from an appliance's watts to kilowatt hours to the electricity bill.
      check:
        prompt: A 500 W iron is used for 2 hours. How many units?
        options:
        - '1'
        - '1000'
        - '250'
        answer: '1'
        why: 0.5 kW × 2 h = 1 kWh.
    - teach: 'Lifting yourself up stairs: work = mgh, power = mgh ÷ t. A 50 kg student climbing 6 m in 12 s: W = 50 × 10 × 6 = 3000 J, P = 3000 ÷ 12 = 250 W.'
      check:
        prompt: Running up the same stairs in half the time needs…
        options:
        - Twice the power
        - Twice the work
        - Half the power
        answer: Twice the power
        why: The work is the same; doing it in half the time doubles the power.
  items:
  - prompt: A motor does 600 J of work in 20 s. Find its power, in W.
    answer: '30'
    check: 600/20
    difficulty: 1
    hints:
    - P = W ÷ t.
    - 600 ÷ 20.
    solution: P = 600 ÷ 20 = 30 W.
    mistakes:
      '12000': power_per_time
  - prompt: A 100 W bulb is used for 10 hours. How many kWh (units) does it use?
    answer: '1'
    check: 100/1000*10
    difficulty: 1
    hints:
    - 100 W = 0.1 kW.
    - 0.1 × 10.
    solution: 0.1 kW × 10 h = 1 kWh.
    mistakes:
      '1000': kw_to_w
  - prompt: How many joules are in 1 kWh?
    options:
    - 3.6 × 10⁶ J
    - 1000 J
    - 3600 J
    - 3.6 × 10³ J
    answer: 3.6 × 10⁶ J
    difficulty: 2
    hints:
    - 1000 W × 3600 s.
    - 3,600,000.
    solution: 1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J.
    mistakes:
      3600 J: kwh_unit
  - prompt: A 2 kW heater runs for 3 hours. How many units of electricity does it use?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - kWh = kW × h.
    - 2 × 3.
    solution: 2 × 3 = 6 kWh.
    mistakes: {"6000": "kw_to_w", "5": "units_kwh"}
  - prompt: A girl of mass 40 kg climbs 5 m of stairs in 10 s (g = 10 m/s²). Find her power, in W.
    answer: '200'
    check: 40*10*5/10
    difficulty: 3
    hints:
    - Work = mgh.
    - 2000 J ÷ 10 s.
    solution: 'Step 1: W = 40 × 10 × 5 = 2000 J. Step 2: P = 2000 ÷ 10 = 200 W.'
    mistakes: {"2000": "power_per_time", "20": "power_mgh_time"}
  - prompt: Four 60 W fans run for 5 hours a day. How many units are used per day?
    answer: '1.2'
    check: 4*60/1000*5
    difficulty: 2
    hints:
    - Total power 240 W = 0.24 kW.
    - 0.24 × 5.
    solution: 0.24 kW × 5 h = 1.2 kWh.
    mistakes:
      '1200': kw_to_w
  - prompt: A crane does 50,000 J of work in 25 s. Find its power, in W.
    answer: '2000'
    check: 50000/25
    difficulty: 1
    hints:
    - P = W ÷ t.
    - 50000 ÷ 25.
    solution: 50,000 ÷ 25 = 2000 W = 2 kW.
    mistakes:
      '1250000': power_mgh_time
  - prompt: A 1 kW heater runs for 5 hours. How many units of electricity does it use?
    answer: '5'
    check: 1*5
    difficulty: 1
    hints:
    - kWh = kW × hours.
    - 1 × 5.
    solution: 1 kW × 5 h = 5 kWh = 5 units.
    mistakes:
      '5000': units_kwh
  - prompt: What is the SI unit of power?
    options:
    - Watt
    - Joule
    - Newton
    - Kilowatt hour
    answer: Watt
    difficulty: 1
    hints:
    - It means joules per second.
    - Bulbs are rated in it.
    solution: Power is measured in watts (W), 1 W = 1 J/s.
    mistakes:
      Kilowatt hour: kwh_unit
      Joule: kwh_unit
  - prompt: A 40 W tube light runs 10 hours a day for 30 days. How many units does it use?
    answer: '12'
    check: 0.04*10*30
    difficulty: 2
    hints:
    - 40 W = 0.04 kW.
    - 0.04 × 300 hours.
    solution: 0.04 kW × 300 h = 12 kWh.
    mistakes:
      '12000': units_kwh
  - prompt: Electricity costs ₹6 per unit. A 1.5 kW air-cooler runs 4 hours. What does it cost, in ₹?
    answer: '36'
    check: 1.5*4*6
    difficulty: 2
    hints:
    - Units = 1.5 × 4 = 6.
    - 6 units × ₹6.
    solution: 6 units × ₹6 = ₹36.
    mistakes:
      '6': units_kwh
  - prompt: Convert 2 kWh into joules.
    options:
    - 7.2 × 10⁶ J
    - 2000 J
    - 3.6 × 10⁶ J
    - 7200 J
    answer: 7.2 × 10⁶ J
    difficulty: 2
    hints:
    - 1 kWh = 3.6 × 10⁶ J.
    - Double it.
    solution: 2 × 3.6 × 10⁶ = 7.2 × 10⁶ J.
    mistakes:
      2000 J: units_kwh
      7200 J: units_kwh
  - prompt: A 60 kg man climbs a 10 m staircase in 20 s (g = 10 m/s²). Find his power, in W.
    answer: '300'
    check: 60*10*10/20
    difficulty: 2
    hints:
    - Work = mgh = 6000 J.
    - 6000 ÷ 20.
    solution: mgh = 6000 J; P = 6000 ÷ 20 = 300 W.
    mistakes:
      '6000': power_mgh_time
      '30': power_mgh_time
  - prompt: A motor of power 2 kW lifts water. How much work does it do in 1 minute, in J?
    answer: '120000'
    check: 2000*60
    difficulty: 3
    hints:
    - W = P × t.
    - 2000 W × 60 s.
    solution: 2000 × 60 = 120,000 J.
    mistakes:
      '120': units_kwh
      '2000': power_mgh_time
  - prompt: A family uses a 1 kW fridge for 24 hours, two 100 W fans for 8 hours each and a 2 kW geyser for 1 hour each day. How many units a day?
    answer: '27.6'
    check: 1*24 + 2*0.1*8 + 2*1
    difficulty: 3
    hints:
    - Fridge 24 kWh, fans 2 × 0.8 kWh, geyser 2 kWh.
    - Add them.
    solution: 24 + 1.6 + 2 = 27.6 units.
    mistakes:
      '26.8': units_kwh
- code: cbse9ex.energy.machines
  title: Simple machines
  after:
  - cbse9ex.energy.work
  notes: |
    Simple machines (lever, pulley, inclined plane, wheel and axle, wedge, screw) make work easier by changing
    the size or direction of a force. Mechanical advantage (MA) = load ÷ effort. A lever balances when
    load × load arm = effort × effort arm. Levers: class 1 (fulcrum between, see-saw, scissors), class 2 (load
    between, nutcracker, wheelbarrow), class 3 (effort between, tongs, forearm). A single fixed pulley changes
    only the direction (MA = 1); a movable pulley halves the effort (ideal MA = 2). Inclined plane: ideal
    MA = length ÷ height. No machine gives more work out than is put in; friction makes real efficiency less
    than 100%.
  explanations:
    text: A simple machine trades distance for force. With a long lever or a ramp, you push with a small force over a long distance to move a heavy load a short distance. MA = load ÷ effort tells you how much the machine multiplies your force.
    visual: 'Draw a see-saw: a 600 N load 1 m from the pivot and you pushing 3 m from the pivot. To balance, effort × 3 = 600 × 1, so effort = 200 N. MA = 600 ÷ 200 = 3.'
    step_by_step: 'Step 1: Identify load, effort and fulcrum (or the slope). Step 2: For a lever, load × load arm = effort × effort arm. Step 3: Find the effort. Step 4: MA = load ÷ effort.'
    real_world: 'A ramp for wheelchairs is a long inclined plane: it takes longer to go up, but the force needed is far less than lifting straight up.'
  picture:
    kind: flow
    steps:
    - Load 600 N at 1 m
    - Effort at 3 m from the pivot
    - Effort × 3 = 600 × 1
    - Effort = 200 N
    - MA = 600 ÷ 200 = 3
    alt: A lever with a 600 newton load 1 metre from the pivot balanced by a 200 newton effort 3 metres away, mechanical advantage 3.
  activity:
    type: formula
    prompt: A crowbar lifts a 600 N rock that is 0.5 m from the pivot. You push with effort E at distance d from the pivot.
    inputs:
    - name: e
      label: Effort E
      min: 10
      max: 600
      step: 10
      start: 600
      unit: N
    - name: d
      label: Your distance d
      min: 0.25
      max: 3
      step: 0.25
      start: 0.5
      unit: m
    outputs:
    - name: load
      label: Load × load arm
      expr: 600*0.5
      unit: N m
    - name: eff
      label: Effort × effort arm
      expr: e*d
      unit: N m
    - name: ma
      label: Mechanical advantage = load ÷ effort
      expr: 600/e
      places: 2
    goals:
    - prompt: Push at 1.5 m from the pivot. What effort balances the rock?
      want:
        d: 1.5
        eff: 300
      hint: 'Load × load arm = effort × effort arm: 600 × 0.5 = E × 1.5.'
      mistakes:
      - when:
          d: 1.5
          e: 600
        say: 600 N at 1.5 m turns three times harder than the rock's side. With a longer arm, you need less effort.
      - when:
          d: 1.5
          e: 400
        say: 400 × 1.5 = 600, but the rock's side is 600 × 0.5 = 300.
    - prompt: Make the mechanical advantage 4, still balanced.
      want:
        ma: 4
        eff: 300
      mistakes:
      - when:
          d: 0.5
        say: 'At 0.5 m, the same distance as the rock, you''d need the full 600 N: MA = 1. To multiply your push, move further from the pivot.'
      - when:
          eff: 300
          d:
          - 0.75
          - 1.5
        say: 'Balanced, but the MA is only 1.5 to 3. MA = load ÷ effort, so MA 4 needs a quarter of 600 N: move further from the pivot.'
  lesson:
    - teach: A simple machine makes work easier by letting a small effort move a big load, or by changing the direction of a force. Mechanical advantage MA = load ÷ effort. A jack lifting a 10,000 N car with 500 N effort has MA = 20.
      check:
        prompt: A machine lifts 600 N with 150 N effort. What is its MA?
        options:
        - '4'
        - '450'
        - 1/4
        answer: '4'
        why: 600 ÷ 150 = 4.
    - teach: 'A lever turns about a fulcrum. It balances when load × load arm = effort × effort arm. Class 1: fulcrum in the middle (see-saw, scissors). Class 2: load in the middle (nutcracker, wheelbarrow), MA > 1. Class 3: effort in the middle (tongs, your forearm), MA < 1 but faster movement.'
      picture:
        kind: compare
        columns:
        - title: Class 1
          points:
          - Fulcrum in middle
          - See-saw, scissors, crowbar
        - title: Class 2
          points:
          - Load in middle
          - Nutcracker, wheelbarrow
        - title: Class 3
          points:
          - Effort in middle
          - Tongs, forearm, fishing rod
        alt: 'Three classes of lever by what lies in the middle: fulcrum, load or effort, with examples.'
      check:
        prompt: A wheelbarrow is which class of lever?
        options:
        - Class 2
        - Class 1
        - Class 3
        answer: Class 2
        why: The wheel is the fulcrum at one end, the load in the middle, the effort at the handles.
    - teach: 'Machines never give more work than you put in. A ramp lets you push a heavy box up with less force, but over a longer distance: ideal MA = length ÷ height. A single fixed pulley only changes direction (MA = 1). Real machines lose some energy to friction.'
      check:
        prompt: A ramp is 10 m long and 2 m high. Ideal MA?
        options:
        - '5'
        - '20'
        - '8'
        answer: '5'
        why: 10 ÷ 2 = 5.
  items:
  - prompt: A machine lifts a 500 N load with an effort of 100 N. What is its mechanical advantage?
    answer: '5'
    check: 500/100
    difficulty: 1
    hints:
    - MA = load ÷ effort.
    - 500 ÷ 100.
    solution: 'Step 1: MA = 500 ÷ 100. Step 2: = 5.'
    mistakes:
      '0.2': ma_inverted
  - prompt: In a nutcracker, where is the load (the nut)?
    options:
    - Between the fulcrum and the effort
    - At the fulcrum
    - Beyond the effort
    - Between two fulcrums
    answer: Between the fulcrum and the effort
    difficulty: 1
    hints:
    - The hinge is the fulcrum.
    - You squeeze at the ends.
    solution: 'Step 1: Fulcrum at the hinge, effort at the handles. Step 2: The nut sits between them: a class 2 lever.'
    mistakes: {"At the fulcrum": "lever_class_two", "Beyond the effort": "lever_class_two"}
  - prompt: A lever has a 900 N load 0.5 m from the fulcrum. What effort, 1.5 m from the fulcrum, balances it, in N?
    answer: '300'
    check: 900*0.5/1.5
    difficulty: 2
    hints:
    - Load × load arm = effort × effort arm.
    - 900 × 0.5 = effort × 1.5.
    solution: 'Step 1: 900 × 0.5 = 450. Step 2: 450 ÷ 1.5 = 300 N.'
    mistakes: {"2700": "lever_moments", "450": "lever_moments"}
  - prompt: What does a single fixed pulley do?
    options:
    - Changes the direction of the force, MA = 1
    - Halves the effort
    - Doubles the load
    - Removes friction
    answer: Changes the direction of the force, MA = 1
    difficulty: 2
    hints:
    - Pulling down to lift up.
    - The effort equals the load.
    solution: 'Step 1: You pull down and the load goes up. Step 2: The force needed is the same as the load, so MA = 1.'
    mistakes: {"Halves the effort": "fixed_pulley", "Removes friction": "fixed_pulley"}
  - prompt: A ramp is 6 m long and 1.5 m high. What is its ideal mechanical advantage?
    answer: '4'
    check: 6/1.5
    difficulty: 2
    hints:
    - Ideal MA = length ÷ height.
    - 6 ÷ 1.5.
    solution: 'Step 1: MA = 6 ÷ 1.5 = 4. Step 2: You push with a quarter of the weight, over 4 times the distance.'
    mistakes: {"9": "ramp_ma", "0.25": "ma_inverted"}
  - prompt: A student says a lever with MA = 4 gives four times as much work. Why is this wrong?
    options:
    - Effort moves 4 times as far, so work out is at most work in
    - MA has nothing to do with force
    - Levers always lose half the work
    - Work is not measured in joules
    answer: Effort moves 4 times as far, so work out is at most work in
    difficulty: 3
    hints:
    - Work = force × distance.
    - Energy is conserved.
    solution: 'Step 1: The force is multiplied by 4, but the effort moves 4 times further. Step 2: Work in ≥ work out; machines never create energy.'
    mistakes:
      Levers always lose half the work: machine_saves_work
  - prompt: A lever lifts a 400 N load with an effort of 80 N. What is its MA?
    answer: '5'
    check: 400/80
    difficulty: 1
    hints:
    - MA = load ÷ effort.
    - 400 ÷ 80.
    solution: 400 ÷ 80 = 5.
    mistakes:
      '0.2': ma_inverted
      '320': ma_inverted
  - prompt: Which class of lever is a pair of scissors?
    options:
    - Class 1
    - Class 2
    - Class 3
    - Not a lever
    answer: Class 1
    difficulty: 1
    hints:
    - Where is the pivot screw?
    - Between the handles and the blades.
    solution: 'The fulcrum (pivot) is between effort and load: class 1.'
    mistakes:
      Class 2: lever_class_two
  - prompt: Which class of lever is a pair of kitchen tongs?
    options:
    - Class 3
    - Class 1
    - Class 2
    - Not a lever
    answer: Class 3
    difficulty: 1
    hints:
    - Your fingers press in the middle.
    - The hinge is at one end.
    solution: 'Effort is in the middle, between the fulcrum and the load: class 3.'
    mistakes:
      Class 2: lever_class_two
  - prompt: 'A see-saw: a 300 N child sits 2 m from the pivot. How far from the pivot must a 400 N child sit to balance, in m?'
    answer: '1.5'
    check: 300*2/400
    difficulty: 2
    hints:
    - 300 × 2 = 400 × d.
    - d = 600 ÷ 400.
    solution: 400 × d = 600, so d = 1.5 m.
    mistakes:
      '2.67': lever_moments
  - prompt: A ramp is 8 m long and 2 m high. What is its ideal mechanical advantage?
    answer: '4'
    check: 8/2
    difficulty: 2
    hints:
    - Ideal MA = length ÷ height.
    - 8 ÷ 2.
    solution: 8 ÷ 2 = 4.
    mistakes:
      '0.25': ramp_ma
      '16': ramp_ma
  - prompt: Why do we use a single fixed pulley to raise a flag?
    options:
    - It lets us pull down to lift the flag up
    - It halves the effort
    - It doubles the work
    - It removes friction
    answer: It lets us pull down to lift the flag up
    difficulty: 2
    hints:
    - Its MA is 1.
    - What does it change?
    solution: A fixed pulley changes the direction of the force; pulling down is easier.
    mistakes:
      It halves the effort: fixed_pulley
  - prompt: Which simple machine is a screw most like?
    options:
    - An inclined plane wrapped around a rod
    - A lever
    - A pulley
    - A wheel and axle
    answer: An inclined plane wrapped around a rod
    difficulty: 2
    hints:
    - Follow the thread round and round.
    - It is a long gentle slope.
    solution: A screw's thread is a ramp wound round a cylinder.
    mistakes:
      A pulley: fixed_pulley
  - prompt: With a crowbar, a 50 N effort 1.2 m from the fulcrum lifts a rock 0.2 m from the fulcrum. What load can it lift, in N?
    answer: '300'
    check: 50*1.2/0.2
    difficulty: 3
    hints:
    - Load × 0.2 = 50 × 1.2.
    - 60 ÷ 0.2.
    solution: Load = 60 ÷ 0.2 = 300 N.
    mistakes:
      '8.33': lever_moments
      '12': lever_moments
  - prompt: Pushing a 600 N box up a 5 m ramp to a 1 m high platform takes 150 N. How much work does the person do, in J?
    answer: '750'
    check: 150*5
    difficulty: 3
    hints:
    - Work = effort × distance moved by the effort.
    - 150 × 5.
    solution: 150 × 5 = 750 J. Lifting straight up would need 600 J; the extra 150 J goes to friction.
    mistakes:
      '600': machine_saves_work
      '3000': work_force_distance
