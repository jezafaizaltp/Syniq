# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 12. Format: content/README.md.
subject: cbse9-sci
chapter: 12
title: 'Patterns in Life: Diversity and Classification'
tips:
  kingdom_cell_type: "Ask two questions: does it have a nucleus? Is it one cell or many, and does it make its own food? Only one kingdom lacks a nucleus; mushrooms and yeast are neither plants nor animals."
  binomial_order: In a scientific name the genus comes first with a capital letter, the species second in small letters, both in italics.
  vertebrate_classes: "Use body covering and breathing: scales and gills, moist skin that lives in water and on land, dry scales, feathers, or hair and milk. Lungs and feeding young on milk mark one class."
  virus_living: 'Viruses are not placed in any kingdom: they have no cells and can multiply only inside a living host cell.'
  fern_group: "Ferns have tubes for water but no seeds. Mosses have no tubes; gymnosperms and angiosperms have seeds."
  fungi_no_chlorophyll: "Mushrooms can't make their own food and have no chlorophyll. Plants can. Which kingdom fits?"
  gymnosperm_naked: "'Gymno' means naked. Which group has seeds sitting open on cones, not inside fruit?"
  hierarchy_smallest: "Say the levels in order from the biggest group down (kingdom, phylum, class, order, family, genus…). Which level comes last?"
  jointed_legs: "Jointed legs and a hard outer skeleton (insects, crabs, spiders) mark one animal group. Annelids are soft-bodied worms."
  monocot_signs: "Parallel veins go with one group of flowering plants. How many seed leaves does that group have?"
concepts:
- code: cbse9ex.diversity.kingdoms
  title: Why we classify, five kingdoms and scientific names
  notes: |
    Living things are grouped by shared features so that the huge variety can be studied. Characteristics
    used: cell type (prokaryotic or eukaryotic), body (one cell or many), mode of nutrition (making own food
    or taking it in), and body organisation. Whittaker's five kingdoms: Monera (prokaryotic, single cell:
    bacteria, blue-green algae), Protista (single-celled eukaryotes: Amoeba, Paramecium, diatoms), Fungi
    (eukaryotic, cell wall of chitin, saprophytic: yeast, mushroom, bread mould), Plantae (multicellular,
    cell wall of cellulose, autotrophic) and Animalia (multicellular, no cell wall, heterotrophic).
    Hierarchy: kingdom, phylum/division, class, order, family, genus, species. Binomial nomenclature
    (Linnaeus) gives each species a two-part name: Genus species, e.g. Homo sapiens, Panthera tigris,
    Mangifera indica. Viruses are not placed in any kingdom.
  explanations:
    text: 'Classifying is like sorting a library. The first big shelves are the five kingdoms, decided by questions: does the cell have a nucleus? one cell or many? does it make its own food? Then shelves get smaller down to the species, which gets a two-part scientific name like Homo sapiens.'
    visual: 'Draw five boxes in a row: Monera (no nucleus), Protista (one cell with nucleus), Fungi (absorbs food), Plantae (makes food), Animalia (eats food). Under each draw one example.'
    step_by_step: 'Step 1: Nucleus? No → Monera. Step 2: Yes, one cell → Protista. Step 3: Many cells, absorbs food, cell wall of chitin → Fungi. Step 4: Makes own food → Plantae. Step 5: Eats food, no cell wall → Animalia.'
    real_world: The mango is 'aam' in Hindi and 'manga' in Malayalam, but scientists everywhere call it Mangifera indica, so there's no confusion.
  picture:
    kind: flow
    steps:
    - Kingdom
    - Phylum
    - Class
    - Order
    - Family
    - Genus
    - Species
    alt: The levels of classification from the biggest group, kingdom, down to the smallest, species.
  activity:
    type: sort
    prompt: Which of Whittaker's five kingdoms does each one belong to?
    bins:
    - Monera
    - Protista
    - Fungi
    - Plantae
    - Animalia
    items:
    - label: Bacteria
      bin: Monera
      clue: Do they have a nucleus with a membrane?
      why: 'Bacteria are prokaryotic, single cells: Monera.'
    - label: Blue-green algae
      bin: Monera
      clue: Despite the name, are these cells prokaryotic?
      why: 'Blue-green algae (cyanobacteria) are prokaryotes: Monera, not plants.'
    - label: Amoeba
      bin: Protista
      clue: One cell, but does it have a nucleus?
      why: 'A single eukaryotic cell: Protista.'
    - label: Paramecium
      bin: Protista
      clue: Is it one cell with a nucleus?
      why: 'Single-celled eukaryote: Protista.'
    - label: Mushroom
      bin: Fungi
      clue: Does it make its own food in sunlight?
      why: 'It feeds on dead matter and has cell walls of chitin: Fungi.'
    - label: Yeast
      bin: Fungi
      clue: It is a single cell. Does it feed like a fungus?
      why: Yeast is a single-celled fungus.
    - label: Fern
      bin: Plantae
      clue: Is it green and does it make its own food?
      why: 'Many-celled, makes its own food, cell walls of cellulose: Plantae.'
    - label: Mango tree
      bin: Plantae
      clue: Does it photosynthesise?
      why: 'A green, many-celled plant: Plantae.'
    - label: Sponge
      bin: Animalia
      clue: It doesn't move, but does it make its own food?
      why: 'Sponges take in food and have no cell walls: animals, though they stay in one place.'
    - label: Earthworm
      bin: Animalia
      clue: Does it eat food made by others?
      why: 'Many-celled, no cell walls, takes in food: Animalia.'
  items:
  - prompt: Bacteria have no nucleus. Which kingdom do they belong to?
    options:
    - Monera
    - Protista
    - Fungi
    - Plantae
    answer: Monera
    difficulty: 1
    hints:
    - Prokaryotic cells.
    - The only kingdom without a true nucleus.
    solution: 'Step 1: No nucleus means prokaryotic. Step 2: Prokaryotes are in Monera.'
    mistakes:
      Protista: kingdom_cell_type
  - prompt: Mushrooms and yeast belong to which kingdom?
    options:
    - Fungi
    - Plantae
    - Monera
    - Animalia
    answer: Fungi
    difficulty: 1
    hints:
    - They cannot make their own food.
    - They absorb food from dead matter.
    solution: 'Step 1: They have no chlorophyll and feed on dead matter. Step 2: They are fungi.'
    mistakes: {"Plantae": "fungi_no_chlorophyll", "Monera": "kingdom_cell_type"}
  - prompt: Which of these is the correct way to write the scientific name of the tiger?
    options:
    - Panthera tigris
    - panthera Tigris
    - Tigris panthera
    - PANTHERA TIGRIS
    answer: Panthera tigris
    difficulty: 1
    hints:
    - Genus first.
    - Only the genus starts with a capital letter.
    solution: 'Step 1: Genus (Panthera) with a capital. Step 2: Species (tigris) in small letters.'
    mistakes:
      panthera Tigris: binomial_order
      Tigris panthera: binomial_order
  - prompt: Which is the smallest group in the classification hierarchy?
    options:
    - Species
    - Genus
    - Family
    - Kingdom
    answer: Species
    difficulty: 2
    hints:
    - Members can breed with each other.
    - The second word of a scientific name.
    solution: 'Step 1: The order is kingdom, phylum, class, order, family, genus, species. Step 2: Species is the smallest.'
    mistakes: {"Kingdom": "hierarchy_smallest", "Genus": "hierarchy_smallest"}
  - prompt: Amoeba is a single cell with a nucleus. Which kingdom is it in?
    options:
    - Protista
    - Monera
    - Animalia
    - Fungi
    answer: Protista
    difficulty: 2
    hints:
    - One cell, but eukaryotic.
    - Paramecium is in the same kingdom.
    solution: 'Step 1: It has a nucleus, so not Monera. Step 2: It is one cell, so not Animalia. Step 3: Single-celled eukaryotes are Protista.'
    mistakes:
      Monera: kingdom_cell_type
  - prompt: Why are viruses not placed in any of the five kingdoms?
    options:
    - They have no cells and multiply only inside a host cell
    - They are too large
    - They make their own food
    - They all live in water
    answer: They have no cells and multiply only inside a host cell
    difficulty: 3
    hints:
    - What is a virus made of?
    - Can it reproduce on its own?
    solution: 'Step 1: A virus is genetic material in a protein coat, not a cell. Step 2: It multiplies only inside living cells, so it doesn''t fit any kingdom.'
    mistakes:
      They make their own food: virus_living
- code: cbse9ex.diversity.groups
  title: Groups of plants and animals
  notes: |
    Plants: Thallophyta (algae, no true roots, stems or leaves: Spirogyra), Bryophyta (mosses, liverworts:
    amphibians of the plant world, no vascular tissue), Pteridophyta (ferns: vascular tissue, but no seeds,
    spores), Gymnosperms (naked seeds: pine, cycas, deodar) and Angiosperms (seeds inside fruits; monocots with
    one cotyledon and parallel veins like grass and maize, dicots with two cotyledons and net veins like pea
    and mango). Animals without backbones (invertebrates): Porifera (sponges), Cnidaria (Hydra, jellyfish),
    Platyhelminthes (flatworms, tapeworm), Nematoda (roundworms), Annelida (earthworm, segmented), Arthropoda
    (jointed legs: insects, spiders, crabs; the largest group), Mollusca (snail, octopus, soft body),
    Echinodermata (starfish, spiny skin). Vertebrates (Chordata with backbone): fish (scales, gills),
    amphibians (moist skin, live in water and on land: frog), reptiles (dry scales, lay eggs on land: snake,
    lizard), birds (feathers, beak, warm-blooded) and mammals (hair, mammary glands, warm-blooded).
  explanations:
    text: Plants are sorted by whether they have proper body parts, tubes to carry water, and seeds. Animals are first split by whether they have a backbone; vertebrates are then sorted by skin, breathing and how they keep warm.
    visual: 'Draw a key: Backbone? No → invertebrates (sponge, jellyfish, worms, insects, snails, starfish). Yes → fish (gills, scales), frog (moist skin), lizard (dry scales), bird (feathers), mammal (hair, milk).'
    step_by_step: 'Step 1: Plant with seeds? No → algae, mosses or ferns. Step 2: Seeds naked → gymnosperm; in fruit → angiosperm. Step 3: Animal with backbone? Step 4: Look at skin covering and breathing to choose the vertebrate class.'
    real_world: 'A whale lives in the sea but is a mammal: it breathes air with lungs and feeds its young on milk, unlike a fish.'
  picture:
    kind: compare
    columns:
    - title: Fish
      points:
      - Scales
      - Gills
      - Cold-blooded
    - title: Birds
      points:
      - Feathers
      - Lungs
      - Warm-blooded
    - title: Mammals
      points:
      - Hair
      - Feed young milk
      - Warm-blooded
    alt: Fish, birds and mammals compared by body covering, breathing and body temperature.
  activity:
    type: sort
    prompt: Which class of vertebrates does each animal belong to?
    bins:
    - Fish
    - Amphibians
    - Reptiles
    - Birds
    - Mammals
    items:
    - label: Shark
      bin: Fish
      clue: Does it breathe with gills and have fins?
      why: 'Gills, fins and scales: a fish (with a skeleton of cartilage).'
    - label: Whale
      bin: Mammals
      clue: Does it breathe air and feed its young on milk?
      why: 'Whales breathe with lungs and feed their young milk: mammals, not fish.'
    - label: Bat
      bin: Mammals
      clue: Does it have feathers, or fur?
      why: 'Bats have fur and feed their young milk: mammals, even though they fly.'
    - label: Penguin
      bin: Birds
      clue: Does it have feathers and lay eggs?
      why: 'Penguins have feathers and a beak: birds, even though they can''t fly.'
    - label: Frog
      bin: Amphibians
      clue: Does it live in water when young and on land later?
      why: 'Tadpoles in water, adults on land: amphibians.'
    - label: Salamander
      bin: Amphibians
      clue: Is its skin dry and scaly, or moist?
      why: 'Moist skin and eggs laid in water: an amphibian, not a reptile.'
    - label: Crocodile
      bin: Reptiles
      clue: Does it have dry scales and lay eggs on land?
      why: 'Dry scaly skin, eggs with shells: a reptile.'
    - label: Seahorse
      bin: Fish
      clue: Does it breathe with gills?
      why: 'Seahorses have gills and fins: fish.'
    - label: Platypus
      bin: Mammals
      clue: It lays eggs. Does it also feed its young on milk?
      why: 'The platypus lays eggs but has fur and makes milk: a mammal.'
    - label: Tortoise
      bin: Reptiles
      clue: Does it have dry scales and breathe air?
      why: 'Scaly skin, lungs, eggs on land: a reptile.'
  items:
  - prompt: Which plant group has seeds that are not enclosed in a fruit?
    options:
    - Gymnosperms
    - Angiosperms
    - Bryophyta
    - Thallophyta
    answer: Gymnosperms
    difficulty: 1
    hints:
    - '''Gymno'' means naked.'
    - Pine is an example.
    solution: 'Step 1: Gymnosperm means naked seed. Step 2: Pine and cycas bear seeds on cones, not inside fruits.'
    mistakes: {"Angiosperms": "gymnosperm_naked", "Bryophyta": "gymnosperm_naked"}
  - prompt: An animal has jointed legs and a hard outer covering. Which group is it in?
    options:
    - Arthropoda
    - Annelida
    - Mollusca
    - Porifera
    answer: Arthropoda
    difficulty: 1
    hints:
    - '''Arthro'' means joint.'
    - Insects, crabs and spiders.
    solution: 'Step 1: Jointed legs are the mark of Arthropoda. Step 2: It is the largest animal group.'
    mistakes: {"Annelida": "jointed_legs", "Mollusca": "jointed_legs"}
  - prompt: A frog lives both in water and on land and has moist skin. Which class is it in?
    options:
    - Amphibia
    - Reptilia
    - Pisces
    - Mammalia
    answer: Amphibia
    difficulty: 1
    hints:
    - '''Amphi'' means both.'
    - Moist skin, not dry scales.
    solution: 'Step 1: Two lives, water and land. Step 2: Moist skin without scales. Step 3: Amphibia.'
    mistakes:
      Reptilia: vertebrate_classes
  - prompt: Why is a whale classed as a mammal and not a fish?
    options:
    - It breathes with lungs and feeds its young on milk
    - It lives in the sea
    - It has fins
    - It is very large
    answer: It breathes with lungs and feeds its young on milk
    difficulty: 2
    hints:
    - Living in water doesn't decide the class.
    - What do all mammals do for their young?
    solution: 'Step 1: Fish breathe with gills. Step 2: A whale has lungs and mammary glands, so it is a mammal.'
    mistakes:
      It has fins: vertebrate_classes
      It lives in the sea: vertebrate_classes
  - prompt: A plant has leaves with parallel veins. What else is it likely to have?
    options:
    - One cotyledon in its seed
    - Two cotyledons in its seed
    - No seeds
    - No roots
    answer: One cotyledon in its seed
    difficulty: 2
    hints:
    - Grass and maize have parallel veins.
    - Mono means one.
    solution: 'Step 1: Parallel veins are a monocot feature. Step 2: Monocots have one cotyledon.'
    mistakes: {"Two cotyledons in its seed": "monocot_signs", "No seeds": "monocot_signs"}
  - prompt: Ferns have tubes to carry water but no seeds. Which group are they in?
    options:
    - Pteridophyta
    - Bryophyta
    - Gymnosperms
    - Thallophyta
    answer: Pteridophyta
    difficulty: 2
    hints:
    - They reproduce by spores.
    - Mosses have no water-carrying tubes.
    solution: 'Step 1: Vascular tissue rules out mosses and algae. Step 2: No seeds rules out gymnosperms and angiosperms. Step 3: Pteridophyta.'
    mistakes: {"Bryophyta": "fern_group", "Gymnosperms": "fern_group"}
