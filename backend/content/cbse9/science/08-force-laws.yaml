# CBSE Class 9 Science (NCERT), chapter 8. Format: content/README.md.
subject: cbse9-sci
chapter: 8
title: Force and Laws of Motion

tips:
  momentum_mv: "Momentum p = mass × velocity. Use kg and m/s to get kg m/s."
  balanced_no_change: "Balanced forces cause no change in motion: an object at rest stays at rest, and a moving one keeps its velocity."
  opposite_forces_subtract: "Forces in opposite directions work against each other: subtract them. Add only forces in the same direction."
  recoil_mass_ratio: "The gun is much heavier than the bullet, so it moves much more slowly: v = (bullet mass × bullet speed) ÷ gun mass."
  f_equals_ma: "F = m × a. Force in newtons needs mass in kg and acceleration in m/s²."

concepts:
  - code: cbse9s.force.inertia
    title: Balanced forces and inertia
    notes: |
      Force can change speed, direction or shape. Balanced forces give no net force and no change in
      motion; unbalanced forces cause acceleration. Newton's first law (law of inertia): an object stays at
      rest or in uniform motion unless an unbalanced force acts. Inertia depends on mass: more mass, more
      inertia. Friction opposes motion.
    explanations:
      text: "Things don't like to change what they're doing: that's inertia. A ball at rest stays at rest until you kick it; a rolling ball would roll forever if friction didn't slow it. Heavier objects have more inertia: it's harder to push a car than a bicycle. If the forces on something balance, its motion doesn't change."
      visual: "Picture a tug of war. If both teams pull equally, the rope stays put: balanced forces. If one team pulls harder, the rope moves towards them: an unbalanced force."
      step_by_step: "Step 1: List the forces and their directions. Step 2: If they cancel, motion doesn't change. Step 3: If not, the object accelerates in the direction of the bigger force. Step 4: More mass means more inertia, so a bigger force is needed for the same change."
      real_world: "When a bus starts suddenly, you fall backwards: your body wants to stay at rest. When it brakes, you fall forwards: your body wants to keep moving. That's why seat belts matter."
    items:
      - prompt: "When a bus brakes suddenly, passengers fall forward. Why?"
        options: ["Inertia of motion", "Inertia of rest", "Friction pushes them", "Gravity changes"]
        answer: "Inertia of motion"
        difficulty: 1
        hints: ["They were moving with the bus.", "Their bodies want to keep moving."]
        solution: "Their bodies tend to keep moving forward: inertia of motion."
      - prompt: "Which has more inertia?"
        options: ["A loaded truck", "A bicycle", "A football", "A pencil"]
        answer: "A loaded truck"
        difficulty: 1
        hints: ["Inertia depends on mass.", "Most mass."]
        solution: "The loaded truck has the most mass, so the most inertia."
        mistakes: {"A bicycle": heavier_more_inertia}
      - prompt: "Two people push a box with 50 N each in opposite directions. What happens?"
        options: ["The box does not move", "It moves left", "It moves right", "It speeds up"]
        answer: "The box does not move"
        difficulty: 1
        hints: ["50 − 50 = 0.", "Balanced forces."]
        solution: "The forces are balanced, so the net force is 0 and there's no change in motion."
        mistakes: {"It speeds up": balanced_no_change}
      - prompt: "Two forces of 30 N right and 18 N left act on a cart. What is the net force in N (to the right)?"
        answer: "12"
        check: "30 - 18"
        difficulty: 2
        hints: ["Opposite directions subtract.", "30 − 18."]
        solution: "Net force = 30 − 18 = 12 N to the right."
        mistakes: {"48": opposite_forces_subtract}
      - prompt: "A ball rolling on the ground slowly stops. Which force stops it?"
        options: ["Friction", "Inertia", "Gravity pulling forward", "No force"]
        answer: "Friction"
        difficulty: 2
        hints: ["Without it, the ball would roll forever.", "It opposes motion."]
        solution: "Friction between the ball and the ground opposes its motion and stops it."
      - prompt: "Newton's first law is also called the law of…"
        options: ["Inertia", "Action and reaction", "Gravitation", "Conservation of energy"]
        answer: "Inertia"
        difficulty: 2
        hints: ["Objects resist change.", "First law."]
        solution: "The first law is the law of inertia."

  - code: cbse9s.force.momentum
    title: Momentum, F = ma and action–reaction
    after: [cbse9s.force.inertia]
    notes: |
      Momentum p = mv (kg m/s). Newton's second law: rate of change of momentum is proportional to force,
      F = ma (1 N = 1 kg m/s²). Impulse: catching a ball by pulling hands back increases time and reduces
      force. Third law: every action has an equal and opposite reaction, acting on different bodies.
      Conservation of momentum: total momentum before = after (gun recoil). NOTE: in the rationalised
      book conservation of momentum may be trimmed; kept here as practice.
    explanations:
      text: "Momentum is mass times velocity: a slow truck and a fast cricket ball can both be hard to stop. Force equals mass times acceleration, F = ma. And forces come in pairs: when you push on a wall, the wall pushes back on you just as hard."
      visual: "Picture two skaters facing each other who push off. Both slide apart: the lighter one faster. The pushes were equal and opposite, acting on different people, and their momenta are equal and opposite."
      step_by_step: "Step 1: For momentum, multiply mass (kg) by velocity (m/s). Step 2: For force, F = m × a. Step 3: For a reaction, it's the same size, opposite direction, on the other object. Step 4: For recoil, m₁v₁ = m₂v₂."
      real_world: "A fielder pulls their hands back while catching a fast ball: that makes the stop take longer, so the force on their hands is smaller. A rocket pushes gas down, and the gas pushes the rocket up."
    items:
      - prompt: "Find the momentum of a 2 kg ball moving at 5 m/s, in kg m/s."
        answer: "10"
        check: "2*5"
        difficulty: 1
        hints: ["p = mv.", "2 × 5."]
        solution: "p = 2 × 5 = 10 kg m/s."
        mistakes: {"7": momentum_mv}
      - prompt: "What force gives a 10 kg box an acceleration of 3 m/s², in N?"
        answer: "30"
        check: "10*3"
        difficulty: 1
        hints: ["F = ma.", "10 × 3."]
        solution: "F = 10 × 3 = 30 N."
        mistakes: {"13": f_equals_ma}
      - prompt: "A force of 20 N acts on a 4 kg mass. Find the acceleration in m/s²."
        answer: "5"
        check: "20/4"
        difficulty: 1
        hints: ["a = F ÷ m.", "20 ÷ 4."]
        solution: "a = 20 ÷ 4 = 5 m/s²."
        mistakes: {"80": f_equals_ma}
      - prompt: "Why does a fielder pull their hands back when catching a fast ball?"
        options: ["To increase the time and reduce the force", "To increase the force", "To make the ball faster", "To reduce the ball's mass"]
        answer: "To increase the time and reduce the force"
        difficulty: 2
        hints: ["Force = change in momentum ÷ time.", "Longer time, smaller force."]
        solution: "Pulling back makes the ball stop over a longer time, so the force on the hands is smaller."
      - prompt: "A 1000 kg car's speed changes from 10 m/s to 20 m/s. By how much does its momentum change, in kg m/s?"
        answer: "10000"
        check: "1000*(20 - 10)"
        difficulty: 2
        hints: ["Change = m(v − u).", "1000 × 10."]
        solution: "Δp = 1000 × (20 − 10) = 10,000 kg m/s."
      - prompt: "When you push a wall, the wall pushes you back. This is Newton's…"
        options: ["Third law", "First law", "Second law", "Law of gravitation"]
        answer: "Third law"
        difficulty: 1
        hints: ["Action and reaction.", "Equal and opposite."]
        solution: "Every action has an equal and opposite reaction: the third law."
      - prompt: "A 2 kg gun fires a 0.02 kg bullet at 100 m/s. Find the gun's recoil speed in m/s."
        answer: "1"
        check: "0.02*100/2"
        difficulty: 3
        hints: ["Momentum is conserved: 0 before.", "2v = 0.02 × 100."]
        solution: "Step 1: 0.02 × 100 = 2 kg m/s. Step 2: v = 2 ÷ 2 = 1 m/s backwards."
        mistakes: {"100": recoil_mass_ratio}
