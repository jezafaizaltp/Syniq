# CBSE Class 9 Science (NCERT), chapter 1. Format: content/README.md.
subject: cbse9-sci
chapter: 1
title: Matter in Our Surroundings

tips:
  kelvin_add_273: "To change °C to kelvin, ADD 273: K = °C + 273. To go back, subtract 273."
  evaporation_surface: "Evaporation happens only at the surface and at any temperature below boiling. Boiling happens through the whole liquid at one fixed temperature."
  latent_heat_no_rise: "While a solid melts or a liquid boils, the temperature stays the same: the heat goes into breaking the bonds between particles (latent heat)."
  humidity_slows: "Evaporation is SLOWER when the air is humid, because the air already holds a lot of water vapour."

concepts:
  - code: cbse9s.matter.states
    title: Particles and the states of matter
    notes: |
      Matter is made of tiny particles with spaces between them, which are always moving and attract each
      other. Solids: fixed shape and volume, particles closely packed, least compressible. Liquids: fixed
      volume, take the container's shape, flow. Gases: no fixed shape or volume, highly compressible,
      particles far apart and fast. Diffusion is fastest in gases. Temperature in kelvin = °C + 273.
    explanations:
      text: "Everything around you is made of particles too tiny to see. They have spaces between them, they keep moving, and they pull on each other. In a solid they are packed tight and only jiggle in place. In a liquid they slide past each other. In a gas they fly about freely with big gaps, which is why a gas can be squeezed."
      visual: "Picture a classroom. During a test, everyone sits still in rows: a solid. At lunch, people walk around but stay in the room: a liquid. After the bell, everyone runs out across the playground: a gas."
      step_by_step: "Step 1: Ask, does it keep its shape? If yes, it's a solid. Step 2: If not, does it keep its volume? If yes, it's a liquid. Step 3: If neither, it's a gas. Step 4: The more space between particles, the easier it is to compress and the faster it diffuses."
      real_world: "You smell incense from across the room within seconds because its particles diffuse through the air. A drop of ink spreads in water more slowly, and a solid crystal hardly spreads at all."
    items:
      - prompt: "In which state are particles farthest apart?"
        options: ["Gas", "Liquid", "Solid", "All the same"]
        answer: "Gas"
        difficulty: 1
        hints: ["Which state can be squeezed the most?", "Think of air in a syringe."]
        solution: "Gas particles have the largest spaces between them, so gases are easily compressed."
      - prompt: "Which state has a fixed volume but no fixed shape?"
        options: ["Liquid", "Solid", "Gas", "None"]
        answer: "Liquid"
        difficulty: 1
        hints: ["Pour water from a glass into a plate.", "The amount stays the same; the shape changes."]
        solution: "A liquid keeps its volume but takes the shape of its container."
      - prompt: "Convert 25 °C to kelvin."
        answer: "298"
        check: "25 + 273"
        difficulty: 1
        hints: ["K = °C + 273.", "25 + 273."]
        solution: "25 + 273 = 298 K."
        mistakes: {"248": kelvin_add_273}
      - prompt: "Convert 373 K to °C."
        answer: "100"
        check: "373 - 273"
        difficulty: 2
        hints: ["°C = K − 273.", "373 − 273."]
        solution: "373 − 273 = 100 °C, the boiling point of water."
        mistakes: {"646": kelvin_add_273}
      - prompt: "In which state is diffusion fastest?"
        options: ["Gas", "Liquid", "Solid", "Same in all"]
        answer: "Gas"
        difficulty: 2
        hints: ["Which particles move fastest and have the most space?", "Smells travel quickly."]
        solution: "Gas particles move fastest with the most space, so diffusion is fastest in gases."
      - prompt: "Why can a gas be compressed much more than a solid?"
        options: ["Its particles have large spaces between them", "Its particles are smaller", "Its particles do not move", "Its particles are heavier"]
        answer: "Its particles have large spaces between them"
        difficulty: 2
        hints: ["Compressing means pushing particles closer.", "There must be room to push into."]
        solution: "Gas particles are far apart, so there is a lot of empty space to squeeze out."

  - code: cbse9s.matter.change
    title: Changing state and evaporation
    after: [cbse9s.matter.states]
    notes: |
      Melting point of ice 0 °C (273 K); boiling point of water 100 °C (373 K) at normal pressure.
      Temperature stays constant during a change of state: the heat absorbed is latent heat (of fusion or
      vaporisation). Sublimation: solid to gas directly (camphor, naphthalene, dry ice). Evaporation is a
      surface phenomenon below boiling point; it increases with surface area, temperature and wind speed,
      and decreases with humidity. Evaporation causes cooling.
    explanations:
      text: "Heat ice and it melts at 0 °C; heat water and it boils at 100 °C. While it is melting or boiling, the thermometer stops rising: the heat is used to pull particles apart. That hidden heat is called latent heat. Evaporation is different: water slowly turns to vapour from its surface at any temperature, and it takes heat away, which cools things."
      visual: "Draw a graph of temperature against time while heating ice. It climbs, goes flat at 0 °C (melting), climbs again, goes flat at 100 °C (boiling), then climbs. The flat parts are where latent heat is being absorbed."
      step_by_step: "Step 1: Name the change: solid to liquid is melting, liquid to gas is boiling or evaporation, solid straight to gas is sublimation. Step 2: During melting and boiling, the temperature stays constant. Step 3: Evaporation speeds up with more surface, more heat, more wind, and slows with humid air. Step 4: Evaporation cools the surface left behind."
      real_world: "Water in a clay pot (matka) stays cool because some seeps out and evaporates from the outside, taking heat with it. Clothes dry faster on a sunny, windy day than on a humid monsoon day."
    items:
      - prompt: "What is the boiling point of water in kelvin?"
        answer: "373"
        check: "100 + 273"
        difficulty: 1
        hints: ["Water boils at 100 °C.", "Add 273."]
        solution: "100 + 273 = 373 K."
        mistakes: {"-173": kelvin_add_273}
      - prompt: "Camphor turns directly from solid to vapour. This is called…"
        options: ["Sublimation", "Evaporation", "Melting", "Condensation"]
        answer: "Sublimation"
        difficulty: 1
        hints: ["It skips the liquid state.", "Naphthalene balls do the same."]
        solution: "Changing directly from solid to gas is sublimation."
      - prompt: "Clothes dry fastest on a day that is…"
        options: ["Sunny and windy", "Humid and still", "Cold and humid", "Cloudy and still"]
        answer: "Sunny and windy"
        difficulty: 1
        hints: ["Heat and wind speed up evaporation.", "Humidity slows it."]
        solution: "Higher temperature and wind speed increase evaporation, so a sunny, windy day dries clothes fastest."
        mistakes: {"Humid and still": humidity_slows}
      - prompt: "While ice is melting, what happens to its temperature?"
        options: ["It stays the same", "It rises steadily", "It falls", "It rises then falls"]
        answer: "It stays the same"
        difficulty: 2
        hints: ["Where does the heat go?", "It breaks the bonds between particles."]
        solution: "The temperature stays at 0 °C until all the ice melts; the heat is latent heat of fusion."
        mistakes: {"It rises steadily": latent_heat_no_rise}
      - prompt: "Why does a clay pot keep water cool in summer?"
        options: ["Water evaporating from its surface takes away heat", "Clay is a cold material", "Clay stops sunlight", "Water inside boils"]
        answer: "Water evaporating from its surface takes away heat"
        difficulty: 2
        hints: ["Water seeps through tiny pores.", "Evaporation causes cooling."]
        solution: "Water seeps to the outer surface and evaporates, absorbing heat from the pot and the water inside."
      - prompt: "How is evaporation different from boiling?"
        options: ["Evaporation happens at the surface at any temperature", "Evaporation happens only at 100 °C", "Boiling happens only at the surface", "There is no difference"]
        answer: "Evaporation happens at the surface at any temperature"
        difficulty: 3
        hints: ["A puddle dries without boiling.", "Boiling bubbles form throughout the liquid."]
        solution: "Evaporation is a slow surface change below boiling point; boiling happens throughout the liquid at a fixed temperature."
        mistakes: {"Evaporation happens only at 100 °C": evaporation_surface}
