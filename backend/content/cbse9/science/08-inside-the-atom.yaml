# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 8. Format: content/README.md.
subject: cbse9-sci
chapter: 8
title: Journey Inside the Atom
tips:
  neutrons_mass_minus_atomic: Neutrons = mass number − atomic number. The atomic number counts protons only.
  shell_capacity_2n2: "A shell n holds at most 2n² electrons: work out 2 × n × n. In this class the outer shell holds at most 8."
  valency_from_outer: "If the outer shell has 1–4 electrons, valency = that number. If it has 5–8, valency = 8 − that number. Find the outer shell first."
  rutherford_mostly_empty: Most alpha particles passed straight through gold foil, so most of an atom is empty space; a few bounced back from a tiny dense nucleus.
  isobars_same_mass: "'Iso-bar': same weight. Different elements, same mass number."
  isotopes_same_z: "Same element (same atomic number), different mass numbers. What are such atoms called?"
  mass_number_add: "Mass number = protons + neutrons. Add both kinds of particle in the nucleus."
  neutral_atom_equal: "In a neutral atom the positive and negative charges cancel. How many electrons does that need?"
  neutron_neutral: "Protons are positive and electrons are negative. The third particle's name sounds like 'neutral'."
  thomson_electron: "Cathode-ray experiments revealed the electron. Rutherford found the nucleus, Chadwick the neutron."
  c9s8_last_found: "The particle with no charge was the hardest to detect, so it was found last, in 1932. Thomson found his particle in 1897, decades earlier."
concepts:
- code: cbse9ex.atom.models
  title: Particles and models of the atom
  notes: |
    Electrons (J.J. Thomson, negative), protons (Goldstein's canal rays, positive), neutrons (Chadwick,
    no charge). Thomson's model: positive sphere with embedded electrons. Rutherford's gold foil
    experiment: most alpha particles passed through, few deflected, very few bounced back, so a tiny,
    dense, positive nucleus and mostly empty space. Bohr: electrons in fixed orbits (shells K, L, M, N)
    without radiating energy. Atomic number Z = protons; mass number A = protons + neutrons.
  explanations:
    text: 'An atom has a tiny, heavy centre called the nucleus, made of protons (positive) and neutrons (no charge). Electrons (negative) move around it in shells. Rutherford found this by firing alpha particles at gold foil: most went straight through, showing the atom is mostly empty space with a small dense core.'
    visual: Imagine a cricket stadium as an atom. The nucleus would be a marble at the centre of the pitch, and the electrons like specks flying around the stands. Almost all the stadium is empty.
    step_by_step: 'Step 1: Atomic number (Z) = number of protons = number of electrons in a neutral atom. Step 2: Mass number (A) = protons + neutrons. Step 3: Neutrons = A − Z. Step 4: Electrons fill shells K, L, M in that order.'
    real_world: 'Throwing tennis balls at a fence with a few thin poles: most pass through, a few hit a pole and bounce back. That''s how Rutherford''s alpha particles behaved with gold atoms.'
  picture:
    kind: compare
    columns:
    - title: Thomson
      points:
      - A positive sphere with electrons stuck in it
      - Like a watermelon with seeds
    - title: Rutherford
      points:
      - A tiny, heavy, positive nucleus at the centre
      - Electrons go around it
      - Most of the atom is empty space
    - title: Bohr
      points:
      - Electrons move in fixed orbits (shells)
      - They don't lose energy while in these orbits
    alt: 'Three models of the atom: Thomson''s positive sphere with electrons in it, Rutherford''s nucleus with mostly empty space, and Bohr''s fixed orbits.'
  activity:
    type: sort
    prompt: Who showed or suggested it?
    bins:
    - Thomson
    - Rutherford
    - Bohr
    - Chadwick
    items:
    - label: Electrons dotted in a ball of positive charge
      bin: Thomson
      clue: Whose model is like seeds in a watermelon?
      why: 'Thomson''s ''plum pudding'' model: electrons in a positive sphere.'
    - label: Most alpha particles went straight through gold foil
      bin: Rutherford
      clue: Which experiment fired alpha particles at foil?
      why: 'Rutherford''s gold foil experiment: most passed straight through, so the atom is mostly empty.'
    - label: A tiny, dense, positive nucleus
      bin: Rutherford
      clue: Which experiment found something small and heavy at the centre?
      why: A few alpha particles bounced back, so Rutherford said the positive charge is packed in a tiny nucleus.
    - label: Electrons move only in fixed shells, without losing energy
      bin: Bohr
      clue: Who fixed the problem of electrons spiralling into the nucleus?
      why: Bohr said electrons stay in fixed orbits (K, L, M, N) without radiating energy.
    - label: Discovered the neutron, with no charge
      bin: Chadwick
      clue: Who found the third particle, in 1932?
      why: Chadwick discovered the neutron.
    - label: A very few alpha particles bounced straight back
      bin: Rutherford
      clue: Which result surprised everyone in the foil experiment?
      why: 'Bouncing back meant they hit something dense and positive: Rutherford''s nucleus.'
    - label: Shells named K, L, M and N
      bin: Bohr
      clue: Whose model has electrons in energy levels?
      why: Bohr's model put electrons in named shells.
    - label: Discovered the electron
      bin: Thomson
      clue: Who studied cathode rays and found a negative particle?
      why: J.J. Thomson discovered the electron.
    - label: Explained why atoms weigh more than their protons
      bin: Chadwick
      clue: Which particle adds mass without charge?
      why: 'Neutrons add mass but no charge: Chadwick''s discovery.'
  lesson:
    - teach: 'Atoms were once thought to be the smallest things. Then three smaller particles were found: the electron (negative, J.J. Thomson, 1897), the proton (positive, from Goldstein''s canal rays) and the neutron (no charge, Chadwick, 1932).'
      check:
        prompt: Which particle carries a negative charge?
        options:
        - Electron
        - Proton
        - Neutron
        answer: Electron
        why: Electrons are negative, protons positive, neutrons neutral.
    - teach: Thomson pictured the atom as a positive sphere with electrons stuck in it, like seeds in a watermelon. Rutherford tested this by firing alpha particles at thin gold foil. Most went straight through, a few bent, and about 1 in 20,000 bounced back. So the atom is mostly empty space with a tiny, dense, positive nucleus.
      picture:
        kind: flow
        steps:
        - Alpha particles fired at gold foil
        - 'Most pass straight through: mostly empty space'
        - 'A few deflect: positive charge in the centre'
        - 'Very few bounce back: tiny, dense nucleus'
        alt: Rutherford's gold foil results and what each one showed about the atom.
      check:
        prompt: What did the few alpha particles that bounced back show?
        options:
        - A tiny, dense, positive nucleus
        - Electrons are heavy
        - The foil was too thick
        answer: A tiny, dense, positive nucleus
        why: Only a small, heavy, positive centre could turn them right round.
    - teach: 'Bohr improved the model: electrons move in fixed orbits (shells K, L, M, N) and don''t lose energy while there. The atomic number Z is the number of protons; the mass number A is protons + neutrons. Neutrons = A − Z. In a neutral atom, electrons = protons.'
      check:
        prompt: Z = 6 and A = 14. How many neutrons?
        options:
        - '8'
        - '6'
        - '20'
        answer: '8'
        why: 14 − 6 = 8.
  items:
  - prompt: An atom has atomic number 11 and mass number 23. How many neutrons does it have?
    answer: '12'
    check: 23 - 11
    difficulty: 1
    hints:
    - Neutrons = A − Z.
    - 23 − 11.
    solution: 23 − 11 = 12 neutrons.
    mistakes:
      '34': neutrons_mass_minus_atomic
  - prompt: Which particle has no charge?
    options:
    - Neutron
    - Proton
    - Electron
    - Alpha particle
    answer: Neutron
    difficulty: 1
    hints:
    - '''Neutral''.'
    - Discovered by Chadwick.
    solution: The neutron has no charge.
    mistakes: {"Proton": "neutron_neutral", "Electron": "neutron_neutral"}
  - prompt: In Rutherford's experiment, most alpha particles passed straight through the gold foil. What did this show?
    options:
    - Most of the atom is empty space
    - The atom is a solid ball
    - Electrons are heavy
    - The nucleus is negative
    answer: Most of the atom is empty space
    difficulty: 2
    hints:
    - Nothing stopped them.
    - There was nothing in the way.
    solution: Most passed through undeflected, so most of the atom is empty space.
    mistakes:
      The atom is a solid ball: rutherford_mostly_empty
  - prompt: An atom of chlorine has 17 protons and 18 neutrons. What is its mass number?
    answer: '35'
    check: 17 + 18
    difficulty: 1
    hints:
    - A = protons + neutrons.
    - 17 + 18.
    solution: 17 + 18 = 35.
    mistakes: {"17": "mass_number_add", "1": "mass_number_add"}
  - prompt: A neutral atom has 8 protons. How many electrons does it have?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Neutral means charges balance.
    - Electrons = protons.
    solution: 'In a neutral atom electrons equal protons: 8.'
    mistakes: {"16": "neutral_atom_equal", "0": "neutral_atom_equal"}
  - prompt: Who discovered the electron?
    options:
    - J.J. Thomson
    - E. Rutherford
    - J. Chadwick
    - N. Bohr
    answer: J.J. Thomson
    difficulty: 2
    hints:
    - Cathode ray experiments.
    - He also proposed the 'plum pudding' model.
    solution: J.J. Thomson discovered the electron using cathode rays.
    mistakes: {"E. Rutherford": "thomson_electron", "J. Chadwick": "thomson_electron"}
  - prompt: An atom has 15 protons and 16 neutrons. What is its mass number?
    answer: '31'
    check: 15 + 16
    difficulty: 1
    hints:
    - Mass number = protons + neutrons.
    - 15 + 16.
    solution: 15 + 16 = 31.
    mistakes:
      '15': mass_number_add
      '1': mass_number_add
  - prompt: Which particle has a positive charge?
    options:
    - Proton
    - Electron
    - Neutron
    - Alpha particle only
    answer: Proton
    difficulty: 1
    hints:
    - It is in the nucleus.
    - Its number is the atomic number.
    solution: Protons are positively charged.
    mistakes:
      Neutron: neutron_neutral
  - prompt: Who discovered the neutron?
    options:
    - Chadwick
    - Thomson
    - Rutherford
    - Bohr
    answer: Chadwick
    difficulty: 1
    hints:
    - It was found last, in 1932.
    - Thomson found the electron.
    solution: James Chadwick discovered the neutron in 1932.
    mistakes:
      Thomson: c9s8_last_found
  - prompt: An atom has atomic number 19 and mass number 39. How many neutrons does it have?
    answer: '20'
    check: 39 - 19
    difficulty: 2
    hints:
    - Neutrons = A − Z.
    - 39 − 19.
    solution: 39 − 19 = 20 neutrons.
    mistakes:
      '58': neutrons_mass_minus_atomic
      '19': neutrons_mass_minus_atomic
  - prompt: A neutral atom of aluminium has 13 protons. How many electrons does it have?
    answer: '13'
    check: '13'
    difficulty: 2
    hints:
    - Neutral means no overall charge.
    - Positive and negative must balance.
    solution: 'A neutral atom has equal protons and electrons: 13.'
    mistakes:
      '14': neutral_atom_equal
      '27': neutral_atom_equal
  - prompt: What was Thomson's model of the atom like?
    options:
    - A positive sphere with electrons stuck in it, like a watermelon
    - A tiny nucleus with orbits
    - A solid ball with no parts
    - Electrons in fixed shells
    answer: A positive sphere with electrons stuck in it, like a watermelon
    difficulty: 2
    hints:
    - It came before the gold foil experiment.
    - No nucleus yet.
    solution: Thomson thought positive charge spread through the atom with electrons embedded, like watermelon seeds.
    mistakes:
      A tiny nucleus with orbits: rutherford_mostly_empty
  - prompt: In Rutherford's experiment, why did only a very few alpha particles bounce back?
    options:
    - The nucleus is tiny, so few hit it head-on
    - Gold atoms are mostly electrons
    - Alpha particles have no charge
    - The foil was magnetic
    answer: The nucleus is tiny, so few hit it head-on
    difficulty: 2
    hints:
    - What fraction of the atom is the nucleus?
    - Most space is empty.
    solution: The nucleus is a very small target, so very few alpha particles came close enough to be turned back.
    mistakes:
      Gold atoms are mostly electrons: rutherford_mostly_empty
  - prompt: An ion has 11 protons and 10 electrons. What is its charge?
    options:
    - '+1'
    - −1
    - '0'
    - '+11'
    answer: '+1'
    difficulty: 3
    hints:
    - Compare positive and negative particles.
    - One more proton than electrons.
    solution: 11 positive − 10 negative = +1. This is a sodium ion, Na⁺.
    mistakes:
      −1: neutral_atom_equal
      '0': neutral_atom_equal
  - prompt: What did Bohr add to Rutherford's model?
    options:
    - Electrons move in fixed orbits without losing energy
    - The atom has a nucleus
    - Atoms contain neutrons
    - Atoms are solid spheres
    answer: Electrons move in fixed orbits without losing energy
    difficulty: 3
    hints:
    - 'Rutherford''s model had a problem: why don''t electrons spiral in?'
    - 'Bohr''s answer: special orbits.'
    solution: Bohr said electrons stay in fixed energy shells (K, L, M, …) and don't radiate energy there.
    mistakes:
      The atom has a nucleus: rutherford_mostly_empty
- code: cbse9ex.atom.shells
  title: Electron shells, valency and isotopes
  after:
  - cbse9ex.atom.models
  notes: |
    Shells fill in order K, L, M, N with maximum 2n² electrons (2, 8, 18), and the outermost shell holds
    at most 8. Valence electrons are in the outermost shell. Valency = valence electrons (1–4) or
    8 − valence electrons (5–8); noble gases have valency 0. Isotopes: same atomic number, different mass
    numbers (¹²C, ¹⁴C; protium, deuterium, tritium). Isobars: same mass number, different atomic numbers
    (⁴⁰Ca, ⁴⁰Ar).
  explanations:
    text: 'Electrons sit in shells: the first (K) holds 2, the next (L) holds 8. Sodium has 11 electrons: 2, 8, 1. The outer electrons decide valency: sodium has 1 outer electron, so valency 1. Chlorine is 2, 8, 7: one short of 8, so valency 1. Isotopes are atoms of the same element with different numbers of neutrons.'
    visual: 'Draw rings around a dot. Fill the first ring with 2 dots, the next with up to 8, and so on. Count the dots on the outermost ring: that''s the number of valence electrons.'
    step_by_step: 'Step 1: Write the number of electrons. Step 2: Fill K with 2, then L with up to 8, then M. Step 3: Count the outermost shell''s electrons. Step 4: If 1–4, valency is that; if 5–8, valency is 8 minus that.'
    real_world: Carbon-14, an isotope of carbon, decays slowly at a known rate. Archaeologists use it to date old bones and wood. Cobalt-60, another isotope, is used to treat cancer.
  picture:
    kind: flow
    steps:
    - Sodium has 11 electrons
    - 'First shell (K): 2'
    - 'Second shell (L): 8'
    - 'Third shell (M): 1'
    - 1 electron to give away, so the valency is 1
    alt: Sodium's 11 electrons fill shells as 2, 8 and 1. The single outer electron gives sodium a valency of 1.
  activity:
    type: formula
    prompt: Change the atomic number Z (how many electrons). Shells fill in order K, L, M, N; here K holds 2, L 8 and M 8.
    inputs:
    - name: z
      label: Atomic number Z
      min: 1
      max: 20
      step: 1
      start: 1
    outputs:
    - name: k
      label: K shell
      expr: min(z,2)
    - name: l
      label: L shell
      expr: min(max(z-2,0),8)
    - name: m
      label: M shell
      expr: min(max(z-10,0),8)
    - name: n
      label: N shell
      expr: max(z-18,0)
    goals:
    - prompt: Make an atom with 3 shells and 7 electrons in the outermost one.
      want:
        m: 7
      hint: Fill K, then L, then put 7 in M. How many is that altogether?
      mistakes:
      - when:
          z: 7
        say: '7 electrons in all fill K with 2 and L with 5: only 2 shells (nitrogen). You want 7 in the third shell.'
      - when:
          z: 10
        say: 10 electrons fill K and L exactly. The third shell M is still empty.
    - prompt: Make an atom with 2 electrons in its third shell (M).
      want:
        m: 2
      mistakes:
      - when:
          z: 4
        say: 'That''s 2 in the second shell, L. K and L must fill up first: 2 + 8.'
      - when:
          z: 2
        say: 2 electrons only fill K, the first shell.
    - prompt: 'Argon has 18: 2, 8, 8. Add one more electron. Where does it go?'
      want:
        z: 19
        n: 1
      mistakes:
      - when:
          z: 18
        say: That's argon itself. Add one more electron.
      - when:
          z: 20
        say: That's two more than argon. Calcium, 2, 8, 8, 2.
  lesson:
    - teach: 'Electrons fill shells from the inside out: K (n = 1), L (n = 2), M (n = 3). A shell can hold at most 2n² electrons: 2, 8, 18. But the outermost shell holds at most 8. Oxygen (8 electrons) is 2, 6; sodium (11) is 2, 8, 1.'
      picture:
        kind: bars
        bars:
        - label: K (n = 1)
          value: 2
        - label: L (n = 2)
          value: 8
        - label: M (n = 3)
          value: 18
        unit: max electrons
        alt: 'Maximum electrons per shell from 2n²: K holds 2, L holds 8, M holds 18.'
      check:
        prompt: What is the arrangement for nitrogen (7 electrons)?
        options:
        - 2, 5
        - 2, 8
        - '7'
        answer: 2, 5
        why: K takes 2, the remaining 5 go to L.
    - teach: 'The electrons in the outermost shell are valence electrons. They decide how an atom combines. Valency: with 1–4 valence electrons, valency = that number; with 5–8, valency = 8 − that number. A full outer shell (helium, neon) means valency 0.'
      check:
        prompt: Fluorine is 2, 7. What is its valency?
        options:
        - '1'
        - '7'
        - '2'
        answer: '1'
        why: 'It needs 1 more to reach 8: 8 − 7 = 1.'
    - teach: 'Isotopes are atoms of the same element (same Z) with different mass numbers: ¹H, ²H, ³H; ³⁵Cl and ³⁷Cl. Isobars are different elements (different Z) with the same mass number: ⁴⁰Ar and ⁴⁰Ca. Some isotopes are useful: ⁶⁰Co treats cancer, ²³⁵U fuels nuclear power.'
      check:
        prompt: ³⁵Cl and ³⁷Cl are…
        options:
        - Isotopes
        - Isobars
        - Different elements
        answer: Isotopes
        why: Both are chlorine (Z = 17), with different mass numbers.
  items:
  - prompt: What is the electron arrangement of sodium (11 electrons)?
    options:
    - 2, 8, 1
    - 2, 9
    - 8, 2, 1
    - 2, 8, 2
    answer: 2, 8, 1
    difficulty: 1
    hints:
    - K holds 2, L holds 8.
    - 11 − 10 = 1 left.
    solution: '2 in K, 8 in L, 1 in M: 2, 8, 1.'
    mistakes:
      2, 9: shell_capacity_2n2
  - prompt: Chlorine has the arrangement 2, 8, 7. What is its valency?
    answer: '1'
    check: 8 - 7
    difficulty: 1
    hints:
    - 7 outer electrons.
    - 8 − 7.
    solution: It needs 1 more to make 8, so valency 1.
    mistakes:
      '7': valency_from_outer
  - prompt: What is the maximum number of electrons in the M shell (n = 3)?
    answer: '18'
    check: 2*3^2
    difficulty: 2
    hints:
    - 2n².
    - 2 × 9.
    solution: 2 × 3² = 18.
    mistakes:
      '8': shell_capacity_2n2
  - prompt: Magnesium has 12 electrons. What is its valency?
    answer: '2'
    check: 12 - 2 - 8
    difficulty: 2
    hints:
    - Arrangement 2, 8, 2.
    - 2 outer electrons.
    solution: '2, 8, 2: two valence electrons, valency 2.'
    mistakes:
      '6': valency_from_outer
  - prompt: ¹²C and ¹⁴C are…
    options:
    - Isotopes
    - Isobars
    - Different elements
    - Ions
    answer: Isotopes
    difficulty: 1
    hints:
    - Same element, different mass numbers.
    - Both are carbon.
    solution: 'Same atomic number (6), different mass numbers: isotopes.'
    mistakes: {"Isobars": "isotopes_same_z", "Different elements": "isotopes_same_z"}
  - prompt: ⁴⁰Ca and ⁴⁰Ar have the same mass number but different atomic numbers. They are…
    options:
    - Isobars
    - Isotopes
    - The same element
    - Noble gases
    answer: Isobars
    difficulty: 2
    hints:
    - '''Bar'' for weight.'
    - Same mass number.
    solution: Atoms of different elements with the same mass number are isobars.
    mistakes: {"Isotopes": "isobars_same_mass", "The same element": "isobars_same_mass"}
  - prompt: An element has arrangement 2, 8, 6. What is its valency?
    answer: '2'
    check: 8 - 6
    difficulty: 3
    hints:
    - 6 outer electrons.
    - 8 − 6.
    solution: It needs 2 more to complete 8, so valency 2. (This is sulphur.)
    mistakes:
      '6': valency_from_outer
  - prompt: What is the electron arrangement of magnesium (12 electrons)?
    options:
    - 2, 8, 2
    - 2, 10
    - 8, 4
    - 2, 2, 8
    answer: 2, 8, 2
    difficulty: 1
    hints:
    - K holds 2, L holds 8.
    - The rest go to M.
    solution: '2 in K, 8 in L, 2 in M: 2, 8, 2.'
    mistakes:
      2, 10: shell_capacity_2n2
      2, 2, 8: shell_capacity_2n2
  - prompt: What is the maximum number of electrons in the L shell?
    answer: '8'
    check: 2*2**2
    difficulty: 1
    hints:
    - Use 2n² with n = 2.
    - 2 × 4.
    solution: 2 × 2² = 8.
    mistakes:
      '4': shell_capacity_2n2
      '18': shell_capacity_2n2
  - prompt: Neon is 2, 8. What is its valency?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Its outer shell is full.
    - It neither gives nor takes electrons.
    solution: With a full outer shell of 8, neon has valency 0.
    mistakes:
      '8': valency_from_outer
      '2': valency_from_outer
  - prompt: Sulphur has 16 electrons. What is its electron arrangement?
    options:
    - 2, 8, 6
    - 2, 6, 8
    - 8, 8
    - 2, 14
    answer: 2, 8, 6
    difficulty: 2
    hints:
    - Fill K, then L, then M.
    - 16 − 2 − 8 = 6.
    solution: 2, 8, 6.
    mistakes:
      2, 14: shell_capacity_2n2
  - prompt: Aluminium is 2, 8, 3. What is its valency?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - It has 3 valence electrons.
    - With 1–4, valency equals that number.
    solution: 'Aluminium loses its 3 outer electrons: valency 3.'
    mistakes:
      '5': valency_from_outer
  - prompt: Protium, deuterium and tritium are isotopes of hydrogen. What is the same in all three?
    options:
    - The number of protons
    - The mass number
    - The number of neutrons
    - Nothing
    answer: The number of protons
    difficulty: 2
    hints:
    - They are all hydrogen.
    - What makes an element that element?
    solution: All have 1 proton (Z = 1); they differ in neutrons (0, 1, 2) and so in mass number.
    mistakes:
      The mass number: isotopes_same_z
      The number of neutrons: isotopes_same_z
  - prompt: Which pair are isobars?
    options:
    - ⁴⁰₁₈Ar and ⁴⁰₂₀Ca
    - ¹²₆C and ¹⁴₆C
    - ¹₁H and ²₁H
    - ²³₁₁Na and ²⁴₁₂Mg
    answer: ⁴⁰₁₈Ar and ⁴⁰₂₀Ca
    difficulty: 2
    hints:
    - Isobars share the mass number.
    - But have different atomic numbers.
    solution: 'Ar and Ca both have mass number 40 but Z = 18 and 20: isobars.'
    mistakes:
      ¹²₆C and ¹⁴₆C: isobars_same_mass
  - prompt: Chlorine is 75% ³⁵Cl and 25% ³⁷Cl. What is its average atomic mass?
    answer: '35.5'
    check: 0.75*35 + 0.25*37
    difficulty: 3
    hints:
    - Weighted average.
    - 0.75 × 35 + 0.25 × 37.
    solution: 26.25 + 9.25 = 35.5 u.
    mistakes:
      '36': isotopes_same_z
