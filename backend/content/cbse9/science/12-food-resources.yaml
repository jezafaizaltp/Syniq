# CBSE Class 9 Science (NCERT), chapter 12. Format: content/README.md.
subject: cbse9-sci
chapter: 12
title: Improvement in Food Resources

tips:
  kharif_rabi: "Kharif crops grow in the rainy season (June–October): paddy, maize, cotton. Rabi crops grow in winter (November–April): wheat, gram, mustard."
  manure_vs_fertiliser: "Manure is organic (from animal and plant waste) and improves soil texture. Fertilisers are factory-made nutrients (N, P, K) that act fast but don't add organic matter."
  revolutions: "Green revolution: more grain. White revolution: more milk. Blue revolution: more fish."

concepts:
  - code: cbse9s.food.crops
    title: Crop production and protection
    notes: |
      Kharif (rainy season) and rabi (winter) crops. Improvement in crop yields: crop variety improvement
      (hybridisation, genetic modification) for higher yield, disease resistance, wider adaptability; crop
      production management: nutrients (macronutrients N, P, K, Ca, Mg, S; micronutrients), manure (compost,
      vermicompost, green manure), fertilisers, irrigation (wells, canals, river lift, tanks), cropping
      patterns (mixed cropping, intercropping, crop rotation). Crop protection: weeds, insect pests, diseases;
      storage losses prevented by cleaning, drying and fumigation.
    explanations:
      text: "Farmers grow kharif crops like paddy in the monsoon and rabi crops like wheat in winter. To get more food, scientists breed better crop varieties, farmers feed the soil with manure and fertilisers, water it well, and grow crops in clever patterns: two crops together, or different crops in turns, so the soil stays healthy."
      visual: "Picture one field through a year: paddy growing tall in the July rain, then after harvest, gram planted for the cool months. That's crop rotation, and the gram adds nitrogen back to the soil for next year's paddy."
      step_by_step: "Step 1: Season? Rainy = kharif, winter = rabi. Step 2: Improving yield: better variety, nutrients, water, cropping pattern. Step 3: Organic and slow = manure; chemical and quick = fertiliser. Step 4: Protect crops from weeds, pests and disease, and store grain dry and clean."
      real_world: "In Kerala, farmers grow coconut with pepper vines climbing the trunks and banana in between: intercropping that uses the same land for several crops. Vermicompost made from kitchen waste with earthworms is used in many school gardens."
    picture:
      kind: compare
      columns:
      - title: Kharif crops
        points: ['Grown in the rainy season, June to October', 'Paddy, maize, soybean, cotton']
      - title: Rabi crops
        points: ['Grown in winter, November to April', 'Wheat, gram, peas, mustard']
      alt: Kharif crops such as paddy grow in the rainy season, June to October; rabi crops such as wheat and gram grow in winter, November to April.
    items:
      - prompt: "Which is a kharif crop?"
        options: ["Paddy", "Wheat", "Mustard", "Gram"]
        answer: "Paddy"
        difficulty: 1
        hints: ["Kharif is the rainy season.", "Rice needs a lot of water."]
        solution: "Paddy grows in the rainy season: a kharif crop."
        mistakes: {"Wheat": kharif_rabi}
      - prompt: "Which is a rabi crop?"
        options: ["Wheat", "Paddy", "Maize", "Cotton"]
        answer: "Wheat"
        difficulty: 1
        hints: ["Rabi is the winter season.", "Grown November to April."]
        solution: "Wheat is grown in winter: a rabi crop."
        mistakes: {"Paddy": kharif_rabi}
      - prompt: "Compost made using earthworms is called…"
        options: ["Vermicompost", "Green manure", "Fertiliser", "Fumigation"]
        answer: "Vermicompost"
        difficulty: 1
        hints: ["'Vermi' means worm.", "Earthworms break down waste."]
        solution: "Compost made by earthworms is vermicompost."
      - prompt: "Growing two or more crops in definite rows on the same field at the same time is called…"
        options: ["Intercropping", "Crop rotation", "Mixed cropping", "Hybridisation"]
        answer: "Intercropping"
        difficulty: 2
        hints: ["'Definite rows' is the key.", "Mixed cropping has no row pattern."]
        solution: "Growing crops in a definite row pattern together is intercropping."
      - prompt: "How many macronutrients do plants need from the soil, according to NCERT?"
        answer: "6"
        check: "6"
        difficulty: 2
        hints: ["N, P, K, Ca, Mg, S.", "Count them."]
        solution: "Six macronutrients: nitrogen, phosphorus, potassium, calcium, magnesium and sulphur."
      - prompt: "Which statement about manure is true?"
        options: ["It adds organic matter and improves soil texture", "It is made in factories", "It supplies only nitrogen", "It harms soil over time"]
        answer: "It adds organic matter and improves soil texture"
        difficulty: 2
        hints: ["Manure comes from plant and animal waste.", "Organic."]
        solution: "Manure adds organic matter (humus), which improves soil texture and water holding."
        mistakes: {"It is made in factories": manure_vs_fertiliser}
      - prompt: "Growing different crops on the same field in a planned order across seasons is…"
        options: ["Crop rotation", "Intercropping", "Mixed cropping", "Irrigation"]
        answer: "Crop rotation"
        difficulty: 3
        hints: ["Crops take turns.", "Legumes add nitrogen back."]
        solution: "A planned sequence of crops over seasons is crop rotation."

  - code: cbse9s.food.animals
    title: Animal husbandry
    after: [cbse9s.food.crops]
    notes: |
      Cattle farming for milk (milch) and work (draught); exotic breeds (Jersey, Brown Swiss) for long
      lactation and local breeds (Red Sindhi, Sahiwal) for disease resistance; clean shelter, balanced feed
      (roughage and concentrates), vaccination. Poultry: layers (eggs) and broilers (meat). Fish production:
      capture and culture fishing; marine and inland; composite fish culture (catla, rohu, mrigal, common
      carp, grass carp) using different feeding zones. Bee-keeping (apiculture) for honey and wax; Italian
      bee Apis mellifera.
    explanations:
      text: "Animal husbandry means caring for farm animals to get food. Cattle give milk; poultry give eggs (layers) and meat (broilers); fish farms grow fish; and bee-keepers collect honey. Good shelter, clean water, proper food and vaccination keep animals healthy and productive."
      visual: "Picture a fish pond in layers. Catla feed at the surface, rohu in the middle, mrigal and common carp at the bottom, and grass carp eat weeds. Five species share one pond without competing: composite fish culture."
      step_by_step: "Step 1: Name the animal and its product. Step 2: Choose breeds for what's needed: yield (exotic) or toughness (local), or cross them. Step 3: Give clean shelter, balanced feed and vaccines. Step 4: For fish, use different species that feed at different depths."
      real_world: "Kerala's backwater farms raise karimeen (pearl spot) and prawns. Many farm families keep a few hens and a cow, and bee-keeping boxes in rubber plantations give extra income."
    picture:
      kind: compare
      columns:
      - title: Surface
        points: [Catla]
      - title: Middle
        points: [Rohu]
      - title: Bottom
        points: [Mrigal and common carp]
      alt: 'Composite fish culture in one pond: catla feed at the surface, rohu in the middle and mrigal and common carp at the bottom.'
    items:
      - prompt: "Poultry birds raised for eggs are called…"
        options: ["Layers", "Broilers", "Drones", "Milch"]
        answer: "Layers"
        difficulty: 1
        hints: ["They lay eggs.", "Broilers are for meat."]
        solution: "Egg-laying hens are layers."
      - prompt: "Bee-keeping for honey is called…"
        options: ["Apiculture", "Pisciculture", "Sericulture", "Horticulture"]
        answer: "Apiculture"
        difficulty: 1
        hints: ["Apis is the bee genus.", "Pisci means fish."]
        solution: "Bee-keeping is apiculture."
      - prompt: "In composite fish culture, which fish feeds at the surface?"
        options: ["Catla", "Mrigal", "Common carp", "Rohu"]
        answer: "Catla"
        difficulty: 2
        hints: ["Rohu feeds in the middle.", "Mrigal and common carp feed at the bottom."]
        solution: "Catla are surface feeders."
      - prompt: "How many fish species are typically used together in composite fish culture, as in NCERT?"
        answer: "5"
        check: "5"
        difficulty: 2
        hints: ["Catla, rohu, mrigal, common carp, grass carp.", "Count them."]
        solution: "Five: catla, rohu, mrigal, common carp and grass carp."
      - prompt: "Which revolution increased milk production in India?"
        options: ["White revolution", "Green revolution", "Blue revolution", "Yellow revolution"]
        answer: "White revolution"
        difficulty: 1
        hints: ["Milk is white.", "Operation Flood."]
        solution: "The white revolution (Operation Flood) increased milk production."
        mistakes: {"Green revolution": revolutions}
      - prompt: "Why are exotic and local cattle breeds crossed?"
        options: ["To combine high milk yield with disease resistance", "To make cattle smaller", "To stop them giving milk", "To make them eat less"]
        answer: "To combine high milk yield with disease resistance"
        difficulty: 3
        hints: ["Exotic: long lactation.", "Local: tough and resistant."]
        solution: "Crossbreeding aims to get both long milk production and resistance to local diseases."
