# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 3. Format: content/README.md.
subject: cbse9-sci
chapter: 3
title: Tissues in Action
tips:
  xylem_phloem: "One transport tissue carries water and minerals up from the roots; the other carries food from the leaves. Remember: the water tubes are dead, hollow cells."
  meristem_growth: 'Meristematic tissue is the dividing tissue: apical at tips (length), lateral for girth, intercalary at the base of leaves or internodes.'
  tendon_ligament: "Two tough connectors: one ties muscle to bone, the other ties bone to bone. Which two things does the question join?"
  muscle_kinds: "Think of control: muscles you can move at will are striped; muscles in the gut work without your control; one special kind beats in one organ all your life."
  ligament_tendon_swap: "Two tough connectors: one ties muscle to bone, the other ties bone to bone. Which two things does the question join?"
  adipose_fat: "Which connective tissue is made of cells filled with fat?"
  axon_away: "Dendrites bring signals IN to the cell body. Which part carries them OUT?"
  blood_connective: "Blood joins and carries things between all parts of the body. Which tissue family links and supports?"
  bone_nutrients: "Bones are hardened by one mineral, and one vitamin (made in sunlight) helps the body absorb it."
  epithelium_covers: "Which tissue forms coverings and linings of the body?"
  full_circle_joint: "Moving in every direction needs a ball sitting in a cup. Where in the arm is that joint?"
  joint_movement: "Move your elbow: can it go round in a circle, or only back and forth like a door?"
  muscle_pull_only: "A muscle can only shorten. What does that mean for moving a bone back the other way?"
  sclerenchyma_hard: "Coconut husk is hard and fibrous. Which plant tissue has thick, dead, lignin-filled walls?"
  support_tissues: "Bone, cartilage and ligaments join and support other parts. Which tissue family does that?"
  c9s3_wall_chemical: "Starch is food stored inside cells, not part of the wall. Think of what makes wood hard: the same chemical stiffens these cell walls."
  c9s3_bendy_tissue: "Bone is hard and snaps if bent. Press the tip of your nose or your ear: which softer, springy tissue gives it shape?"
concepts:
- code: cbse9ex.tissue.plant
  title: Plant tissues
  notes: |
    A tissue is a group of cells with similar structure working together. Meristematic tissue divides:
    apical (root and shoot tips, length), lateral (cambium, girth), intercalary (base of leaves,
    internodes). Permanent tissues: simple (parenchyma: storage; collenchyma: flexibility; sclerenchyma:
    hard, dead, lignin, e.g. husk of coconut) and protective (epidermis, cork). Complex: xylem (tracheids,
    vessels, xylem parenchyma, fibres; water and minerals) and phloem (sieve tubes, companion cells,
    phloem parenchyma, fibres; food).
  explanations:
    text: 'Plants grow only at special spots where cells keep dividing: the meristems. At the tips they make the plant longer; in the stem''s sides they make it thicker. Other tissues stop dividing and do one job: parenchyma stores food, sclerenchyma makes things hard like coconut husk, xylem carries water up, and phloem carries food around.'
    visual: 'Picture two pipes in a stem. One carries water up from the roots, like a borewell pipe: that''s xylem. The other carries sugar from the leaves to the roots and fruits, like a delivery van: that''s phloem.'
    step_by_step: 'Step 1: Is it dividing? Then it''s meristematic: tip (apical), side (lateral) or at a node (intercalary). Step 2: If not, is it simple (one cell type) or complex (many)? Step 3: Water up = xylem; food around = phloem. Step 4: Hard and dead = sclerenchyma; bendy = collenchyma; storage = parenchyma.'
    real_world: Grass grows back after mowing because it has intercalary meristem at the base of its leaves. A coconut husk is hard because of sclerenchyma fibres, which are also used to make coir rope.
  picture:
    kind: compare
    columns:
    - title: Xylem
      points:
      - Carries water and minerals
      - Moves them up from the roots
      - 'Mostly dead cells: vessels and tracheids'
    - title: Phloem
      points:
      - Carries food made in the leaves
      - Moves it up and down the plant
      - 'Living cells: sieve tubes, companion cells'
    alt: Xylem carries water and minerals up from the roots; phloem carries food from the leaves both up and down.
  activity:
    type: sort
    prompt: Which kind of plant tissue is it?
    bins:
    - Dividing (meristem)
    - Simple permanent
    - Conducting (xylem, phloem)
    - Protective
    items:
    - label: Tip of a growing root
      bin: Dividing (meristem)
      clue: Where does a root get longer?
      why: Apical meristem at the tip divides to make the root longer.
    - label: Coconut husk fibres
      bin: Simple permanent
      clue: Are these cells hard and dead?
      why: 'Sclerenchyma: hard, dead cells with lignin. A simple permanent tissue.'
    - label: Carries water up from the roots
      bin: Conducting (xylem, phloem)
      clue: Which tissue moves water through the plant?
      why: 'Xylem carries water and minerals up: a complex, conducting tissue.'
    - label: Carries food from the leaves
      bin: Conducting (xylem, phloem)
      clue: Which tissue moves sugar around?
      why: 'Phloem carries food from the leaves: conducting.'
    - label: Cork of an old tree
      bin: Protective
      clue: What is the job of the outer bark?
      why: Cork protects the stem from damage and water loss.
    - label: Stores starch in a potato
      bin: Simple permanent
      clue: Do these cells divide, or just store?
      why: 'Parenchyma stores food: simple permanent tissue.'
    - label: Cambium that makes a stem thicker
      bin: Dividing (meristem)
      clue: Does the stem's girth grow by cells dividing?
      why: Lateral meristem (cambium) divides to make the stem thicker.
    - label: The bendy stalk of a leaf
      bin: Simple permanent
      clue: Which tissue lets parts bend without breaking?
      why: 'Collenchyma gives flexibility: simple permanent tissue.'
    - label: The waxy outer layer of a leaf
      bin: Protective
      clue: What stops a leaf drying out?
      why: The epidermis with its waxy layer protects the leaf.
    - label: Base of grass leaves, so it regrows after mowing
      bin: Dividing (meristem)
      clue: Which part keeps dividing after the top is cut?
      why: Intercalary meristem at the leaf base keeps dividing.
  lesson:
    - teach: 'A tissue is a group of similar cells working together on one job. Plants have two main kinds: meristematic tissue, which keeps dividing to make new cells, and permanent tissue, whose cells have stopped dividing and taken on a fixed job.'
      check:
        prompt: Which plant tissue keeps dividing?
        options:
        - Meristematic tissue
        - Permanent tissue
        - Xylem
        answer: Meristematic tissue
        why: Meristem cells divide to make new cells for growth.
    - teach: Meristems sit where the plant grows. Apical meristem at the root and shoot tips makes them longer. Lateral meristem (cambium) makes stems and roots thicker. Intercalary meristem at the base of leaves and nodes lets grass grow back after cutting.
      picture:
        kind: compare
        columns:
        - title: Meristem
          points:
          - Apical
          - Lateral (cambium)
          - Intercalary
        - title: Where
          points:
          - Root and shoot tips
          - Sides of stem and root
          - Base of leaves, nodes
        - title: Growth
          points:
          - Length
          - Girth (thickness)
          - Regrowth of grass
        alt: Three meristems, where each is found and what growth it causes.
      check:
        prompt: Which meristem makes a tree trunk thicker?
        options:
        - Lateral meristem
        - Apical meristem
        - Intercalary meristem
        answer: Lateral meristem
        why: The cambium on the sides adds girth.
    - teach: 'Simple permanent tissues: parenchyma (soft, stores food), collenchyma (flexible support, lets stems bend), sclerenchyma (hard, dead cells with lignin: coconut husk). The epidermis and cork protect. Complex tissues carry things: xylem carries water and minerals up from the roots; phloem carries food from the leaves.'
      check:
        prompt: Which tissue lets a young stem bend without breaking?
        options:
        - Collenchyma
        - Sclerenchyma
        - Xylem
        answer: Collenchyma
        why: Its cells are thickened at the corners, giving flexible support.
  items:
  - prompt: Which tissue carries water from the roots to the leaves?
    options:
    - Xylem
    - Phloem
    - Parenchyma
    - Cork
    answer: Xylem
    difficulty: 1
    hints:
    - Think of a water pipe going up.
    - Phloem carries food.
    solution: Xylem carries water and minerals upward.
    mistakes:
      Phloem: xylem_phloem
  - prompt: Which tissue increases the length of a root or shoot?
    options:
    - Apical meristem
    - Lateral meristem
    - Sclerenchyma
    - Xylem
    answer: Apical meristem
    difficulty: 1
    hints:
    - Apex means tip.
    - Growth at the tips.
    solution: Apical meristem at the tips increases length.
    mistakes:
      Lateral meristem: meristem_growth
  - prompt: The husk of a coconut is made of which tissue?
    options:
    - Sclerenchyma
    - Parenchyma
    - Collenchyma
    - Phloem
    answer: Sclerenchyma
    difficulty: 2
    hints:
    - It is hard and dead.
    - Its walls contain lignin.
    solution: 'Coconut husk is sclerenchyma: hard fibres with lignin.'
    mistakes: {"Parenchyma": "sclerenchyma_hard", "Collenchyma": "sclerenchyma_hard"}
  - prompt: Which tissue carries food from the leaves to other parts?
    options:
    - Phloem
    - Xylem
    - Epidermis
    - Cork
    answer: Phloem
    difficulty: 1
    hints:
    - Food made in leaves must travel.
    - It has sieve tubes.
    solution: Phloem carries food made in leaves.
    mistakes:
      Xylem: xylem_phloem
  - prompt: Grass grows back after it is cut because of…
    options:
    - Intercalary meristem
    - Apical meristem
    - Cork
    - Xylem
    answer: Intercalary meristem
    difficulty: 2
    hints:
    - The tips have been cut off.
    - Growth from the base of leaves.
    solution: Intercalary meristem at the leaf base keeps dividing.
    mistakes:
      Apical meristem: meristem_growth
  - prompt: Which of these is a dead tissue in xylem that carries water?
    options:
    - Vessels
    - Sieve tubes
    - Companion cells
    - Phloem parenchyma
    answer: Vessels
    difficulty: 3
    hints:
    - Sieve tubes and companion cells are in phloem.
    - Tracheids and vessels are tubes.
    solution: Vessels (and tracheids) are dead tubes in xylem that carry water.
    mistakes:
      Sieve tubes: xylem_phloem
  - prompt: Which tissue stores food in a potato?
    options:
    - Parenchyma
    - Sclerenchyma
    - Xylem
    - Cork
    answer: Parenchyma
    difficulty: 1
    hints:
    - It is soft, living tissue.
    - Its cells are loosely packed.
    solution: Parenchyma cells store starch in a potato.
    mistakes:
      Sclerenchyma: sclerenchyma_hard
  - prompt: Where is apical meristem found?
    options:
    - At the tips of roots and shoots
    - At the base of leaves
    - Inside the bark
    - In the flower
    answer: At the tips of roots and shoots
    difficulty: 1
    hints:
    - '''Apex'' means tip.'
    - It makes them longer.
    solution: Apical meristem is at root and shoot tips and increases length.
    mistakes:
      At the base of leaves: meristem_growth
  - prompt: Which substance makes sclerenchyma cells hard?
    options:
    - Lignin
    - Starch
    - Chlorophyll
    - Water
    answer: Lignin
    difficulty: 1
    hints:
    - It is a tough chemical in the cell walls.
    - Wood has lots of it.
    solution: Lignin thickens sclerenchyma walls, making them hard and stiff.
    mistakes:
      Starch: c9s3_wall_chemical
  - prompt: Which tissue protects older stems of trees from water loss and injury?
    options:
    - Cork
    - Phloem
    - Parenchyma
    - Apical meristem
    answer: Cork
    difficulty: 2
    hints:
    - It forms the bark.
    - Its cells are dead and contain suberin.
    solution: Cork (bark) is dead, waterproof tissue that protects older stems.
    mistakes:
      Phloem: xylem_phloem
  - prompt: Which part of phloem has holes in its end walls so food can pass?
    options:
    - Sieve tubes
    - Vessels
    - Tracheids
    - Fibres of xylem
    answer: Sieve tubes
    difficulty: 2
    hints:
    - Its end walls look like a sieve.
    - Vessels and tracheids are in xylem.
    solution: Sieve tubes, with perforated end walls, carry food in phloem.
    mistakes:
      Vessels: xylem_phloem
      Tracheids: xylem_phloem
  - prompt: In which direction does xylem carry water?
    options:
    - Upwards, from roots to leaves
    - Downwards, from leaves to roots
    - Both ways
    - Only sideways
    answer: Upwards, from roots to leaves
    difficulty: 2
    hints:
    - Water is absorbed by roots.
    - Leaves need it for photosynthesis.
    solution: Xylem carries water and minerals up from the roots. (Phloem can carry food both ways.)
    mistakes:
      Both ways: xylem_phloem
  - prompt: Which tissue has cells with small air spaces and chlorophyll, helping leaves make food?
    options:
    - Chlorenchyma (parenchyma with chloroplasts)
    - Sclerenchyma
    - Cork
    - Xylem
    answer: Chlorenchyma (parenchyma with chloroplasts)
    difficulty: 2
    hints:
    - It is a kind of parenchyma.
    - Green means chlorophyll.
    solution: Parenchyma with chloroplasts is called chlorenchyma; it does photosynthesis.
    mistakes:
      Sclerenchyma: sclerenchyma_hard
  - prompt: A farmer cuts the tips of a hedge. It still grows longer from the base of its leaves and nodes. Which tissue allows this?
    options:
    - Intercalary meristem
    - Apical meristem
    - Cork
    - Xylem
    answer: Intercalary meristem
    difficulty: 3
    hints:
    - The tips (apical meristem) are gone.
    - Which meristem is at the nodes?
    solution: Intercalary meristem at the base of leaves and nodes keeps adding cells even without the tips.
    mistakes:
      Apical meristem: meristem_growth
  - prompt: Why is xylem made of dead cells but phloem mostly of living cells?
    options:
    - Xylem tubes are empty pipes for water; phloem needs living cells to move food
    - Xylem has finished its work
    - Phloem is younger
    - It is random
    answer: Xylem tubes are empty pipes for water; phloem needs living cells to move food
    difficulty: 3
    hints:
    - Empty, hollow cells make good pipes.
    - Moving sugar needs energy.
    solution: Dead, hollow xylem vessels form open pipes for water. Moving food in phloem needs energy, so its sieve tubes and companion cells are living.
    mistakes:
      Xylem has finished its work: xylem_phloem
- code: cbse9ex.tissue.animal
  title: Animal tissues
  after:
  - cbse9ex.tissue.plant
  notes: |
    Epithelial (covering: squamous, cuboidal, columnar, ciliated), connective (blood: plasma, RBC, WBC,
    platelets; bone; cartilage; ligament bone–bone; tendon muscle–bone; areolar; adipose fat), muscular
    (striated/voluntary, smooth/involuntary, cardiac) and nervous (neurons: cell body, dendrites, axon).
  explanations:
    text: 'Animals have four main kinds of tissue. Epithelium covers surfaces, like skin and the lining of your mouth. Connective tissue joins and supports: bone, cartilage, blood, fat, tendons and ligaments. Muscle tissue moves things. Nervous tissue carries messages as electrical signals through neurons.'
    visual: Picture a building. Epithelium is the paint and tiles on every surface. Connective tissue is the steel frame, cement and water pipes. Muscle is the lift motor. Nerves are the wiring that carries signals.
    step_by_step: 'Step 1: Does it cover or line? Epithelial. Step 2: Does it join, support or transport? Connective. Step 3: Does it contract? Muscular: voluntary (striated), involuntary (smooth), or heart (cardiac). Step 4: Does it carry signals? Nervous.'
    real_world: When you sprain an ankle, a ligament (bone to bone) has been stretched or torn. Your heart's cardiac muscle beats about 100,000 times a day without ever resting.
  activity:
    type: sort
    prompt: Which kind of animal tissue is it?
    bins:
    - Epithelial
    - Connective
    - Muscular
    - Nervous
    items:
    - label: Lining of the inside of the cheek
      bin: Epithelial
      clue: Is this a covering or lining layer?
      why: Flat squamous epithelium lines the mouth.
    - label: Blood
      bin: Connective
      clue: Does it link parts of the body, with cells in a liquid matrix?
      why: 'Blood is a fluid connective tissue: cells in plasma.'
    - label: Tendon joining muscle to bone
      bin: Connective
      clue: Does it join one thing to another?
      why: Tendons are connective tissue, tough and fibrous.
    - label: Wall of the heart
      bin: Muscular
      clue: Does it contract on its own, all your life?
      why: Cardiac muscle contracts rhythmically without tiring.
    - label: Cells with long axons that carry messages
      bin: Nervous
      clue: What carries messages fast in the body?
      why: 'Neurons carry impulses: nervous tissue.'
    - label: Fat stored under the skin
      bin: Connective
      clue: Which tissue stores fat and keeps heat in?
      why: Adipose tissue is connective tissue.
    - label: Wall of the stomach that churns food
      bin: Muscular
      clue: What makes the stomach squeeze?
      why: Smooth (involuntary) muscle churns food.
    - label: Brain and spinal cord
      bin: Nervous
      clue: What are they made of?
      why: 'They are made of neurons: nervous tissue.'
    - label: Bone
      bin: Connective
      clue: Does it hold the body up, with a hard matrix?
      why: Bone is a hard connective tissue.
    - label: Outer layer of the skin
      bin: Epithelial
      clue: Is this a covering layer?
      why: The skin's outer layer is epithelium, protecting what's underneath.
  lesson:
    - teach: Animals have four main tissue types. Epithelial tissue covers and lines (skin, inside of the mouth). Connective tissue joins and supports (bone, blood, cartilage, tendons, ligaments, fat). Muscular tissue moves. Nervous tissue carries messages.
      picture:
        kind: compare
        columns:
        - title: Tissue
          points:
          - Epithelial
          - Connective
          - Muscular
          - Nervous
        - title: Job and example
          points:
          - 'Covers: skin, lining of mouth'
          - 'Joins: bone, blood, tendon'
          - 'Moves: biceps, heart'
          - 'Messages: brain, nerves'
        alt: The four animal tissues with their jobs and examples.
      check:
        prompt: Which tissue type is blood?
        options:
        - Connective
        - Epithelial
        - Nervous
        answer: Connective
        why: Blood has a liquid matrix (plasma) with cells, like other connective tissues.
    - teach: 'Connective tissues: tendons join muscle to bone; ligaments join bone to bone; cartilage cushions joints and shapes the nose and ears; adipose tissue stores fat and keeps us warm; blood carries oxygen, food and wastes.'
      check:
        prompt: What joins one bone to another?
        options:
        - Ligament
        - Tendon
        - Cartilage
        answer: Ligament
        why: Ligaments hold bones together at joints.
    - teach: 'Muscle comes in three kinds: striated (skeletal, voluntary), smooth (gut, blood vessels, involuntary) and cardiac (heart, involuntary, never tires). A neuron has a cell body, short branched dendrites that receive signals, and a long axon that carries them away.'
      check:
        prompt: Which part of a neuron receives signals?
        options:
        - Dendrites
        - Axon
        - Nucleus only
        answer: Dendrites
        why: Dendrites bring signals in; the axon sends them away.
  items:
  - prompt: Which tissue joins a muscle to a bone?
    options:
    - Tendon
    - Ligament
    - Cartilage
    - Areolar tissue
    answer: Tendon
    difficulty: 1
    hints:
    - The other joins bone to bone.
    - The Achilles tendon is at your heel.
    solution: Tendons join muscles to bones.
    mistakes:
      Ligament: tendon_ligament
  - prompt: Blood is which type of tissue?
    options:
    - Connective
    - Epithelial
    - Muscular
    - Nervous
    answer: Connective
    difficulty: 1
    hints:
    - It joins and transports.
    - Its cells float in plasma.
    solution: Blood is a fluid connective tissue.
    mistakes: {"Epithelial": "blood_connective", "Muscular": "blood_connective"}
  - prompt: Muscles of the stomach and intestine are…
    options:
    - Smooth (involuntary)
    - Striated (voluntary)
    - Cardiac
    - Skeletal
    answer: Smooth (involuntary)
    difficulty: 2
    hints:
    - You can't control them.
    - They push food along by themselves.
    solution: Gut muscles are smooth and involuntary.
    mistakes:
      Striated (voluntary): muscle_kinds
  - prompt: Which tissue covers the skin and lines the mouth?
    options:
    - Epithelial
    - Connective
    - Muscular
    - Nervous
    answer: Epithelial
    difficulty: 1
    hints:
    - Covering tissue.
    - Cells packed tightly in sheets.
    solution: Epithelial tissue covers and lines body surfaces.
    mistakes: {"Connective": "epithelium_covers", "Muscular": "epithelium_covers"}
  - prompt: Which part of a neuron carries the signal away from the cell body?
    options:
    - Axon
    - Dendrite
    - Nucleus
    - Cell wall
    answer: Axon
    difficulty: 2
    hints:
    - It's the long fibre.
    - Dendrites bring signals in.
    solution: The axon carries impulses away from the cell body.
    mistakes: {"Dendrite": "axon_away", "Cell wall": "axon_away"}
  - prompt: Which muscle works all through life without getting tired?
    options:
    - Cardiac muscle
    - Biceps
    - Smooth muscle of the gut
    - Leg muscle
    answer: Cardiac muscle
    difficulty: 2
    hints:
    - It's in the heart.
    - It never rests.
    solution: Cardiac muscle contracts rhythmically throughout life.
    mistakes:
      Biceps: muscle_kinds
  - prompt: Fat is stored below the skin in which tissue?
    options:
    - Adipose tissue
    - Cartilage
    - Bone
    - Ligament
    answer: Adipose tissue
    difficulty: 3
    hints:
    - It also insulates the body.
    - Its cells are filled with fat globules.
    solution: Adipose tissue stores fat and acts as insulation.
    mistakes: {"Cartilage": "adipose_fat", "Ligament": "adipose_fat"}
  - prompt: Which tissue lines the inside of the mouth?
    options:
    - Squamous epithelium
    - Cartilage
    - Smooth muscle
    - Bone
    answer: Squamous epithelium
    difficulty: 1
    hints:
    - It is a covering tissue.
    - Flat cells like tiles.
    solution: Flat squamous epithelial cells line the mouth.
    mistakes:
      Cartilage: epithelium_covers
  - prompt: Which muscle can you control at will?
    options:
    - Skeletal (striated) muscle
    - Cardiac muscle
    - Smooth muscle
    - All of them
    answer: Skeletal (striated) muscle
    difficulty: 1
    hints:
    - You choose when to lift your arm.
    - It is attached to bones.
    solution: Skeletal muscle is voluntary; you move it when you choose.
    mistakes:
      Cardiac muscle: muscle_kinds
      All of them: muscle_kinds
  - prompt: Which tissue in the nose and ear is firm but bendable?
    options:
    - Cartilage
    - Bone
    - Adipose tissue
    - Blood
    answer: Cartilage
    difficulty: 1
    hints:
    - 'Press your ear: it bends back.'
    - It is softer than bone.
    solution: Cartilage is a flexible connective tissue that shapes the nose and ears.
    mistakes:
      Bone: c9s3_bendy_tissue
  - prompt: Which blood cells carry oxygen?
    options:
    - Red blood cells
    - White blood cells
    - Platelets
    - Plasma
    answer: Red blood cells
    difficulty: 2
    hints:
    - They contain haemoglobin.
    - They give blood its colour.
    solution: Red blood cells contain haemoglobin, which carries oxygen.
    mistakes:
      Platelets: blood_connective
  - prompt: Which cells help blood to clot after a cut?
    options:
    - Platelets
    - Red blood cells
    - Neurons
    - Muscle cells
    answer: Platelets
    difficulty: 2
    hints:
    - They are tiny cell pieces in blood.
    - They plug wounds.
    solution: Platelets gather at a wound and help form a clot.
    mistakes:
      Red blood cells: blood_connective
  - prompt: Ciliated epithelium in the windpipe has tiny hairs. What do they do?
    options:
    - Sweep dust and mucus up and out
    - Make food
    - Carry oxygen in the blood
    - Contract to move bones
    answer: Sweep dust and mucus up and out
    difficulty: 2
    hints:
    - Cilia beat back and forth.
    - They keep the lungs clean.
    solution: The cilia beat to move mucus and trapped dust up and out of the airways.
    mistakes:
      Contract to move bones: epithelium_covers
  - prompt: Which muscle has branched cells and works all through life?
    options:
    - Cardiac muscle
    - Skeletal muscle
    - Smooth muscle
    - Biceps
    answer: Cardiac muscle
    difficulty: 2
    hints:
    - It is found in one organ only.
    - It beats about 70 times a minute.
    solution: Cardiac (heart) muscle has branched cells and contracts rhythmically without tiring.
    mistakes:
      Smooth muscle: muscle_kinds
  - prompt: A long nerve cell runs from the spine to the toes. Which part is long?
    options:
    - The axon
    - The dendrites
    - The cell body
    - The nucleus
    answer: The axon
    difficulty: 3
    hints:
    - It carries signals a long way.
    - Dendrites are short and branched.
    solution: The axon can be over a metre long, carrying signals away from the cell body.
    mistakes:
      The dendrites: axon_away
- code: cbse9ex.tissue.musculoskeletal
  title: Bones, muscles and joints
  after:
  - cbse9ex.tissue.animal
  notes: |
    The musculoskeletal system is built from tissues working together: bone and cartilage (connective tissue)
    give shape and support; skeletal (striated) muscles move bones by contracting, usually in opposing pairs
    (biceps bends the elbow, triceps straightens it); tendons join muscle to bone; ligaments join bone to bone.
    Joints: hinge (elbow, knee, one direction), ball-and-socket (shoulder, hip, all directions), pivot (neck,
    turning), gliding (wrist bones), and fixed joints (skull). Calcium, vitamin D, protein and regular exercise
    keep bones and muscles healthy.
  explanations:
    text: 'Bones are the frame, muscles are the motors and joints are the hinges. Muscles can only pull, so they work in pairs: the biceps pulls your forearm up, the triceps pulls it back down. Tendons tie muscles to bones; ligaments tie bones to each other.'
    visual: 'Draw an arm: upper bone and forearm meeting at the elbow. Draw the biceps on top, joined by tendons to both bones, and the triceps underneath. When the biceps shortens, the forearm swings up like a door on a hinge.'
    step_by_step: 'Step 1: Find the joint and its type (hinge, ball-and-socket, pivot, gliding, fixed). Step 2: Find the muscle pair that moves it. Step 3: The contracting muscle pulls; its partner relaxes. Step 4: Tendons carry the pull to the bone.'
    real_world: A cricket bowler's shoulder (ball-and-socket) swings in a full circle, while the knee (hinge) bends only one way. Warming up and strong muscles protect these joints from injury.
