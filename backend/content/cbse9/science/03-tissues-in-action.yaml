    - Ligament
    - Cartilage
    - Bone
    answer: Tendon
    difficulty: 3
    hints:
    - It joins muscle to bone.
    - The Achilles ___.
    solution: The Achilles tendon joins the calf muscle to the heel bone.
    mistakes:
      Ligament: ligament_tendon_swap
  - prompt: Why do doctors advise children to play in the sun and drink milk?
    options:
    - For vitamin D and calcium, which build strong bones
    - For iron and iodine
    - To make muscles push
    - To grow cartilage into tendons
    answer: For vitamin D and calcium, which build strong bones
    difficulty: 3
    hints:
    - Sunlight helps the skin make one vitamin.
    - Milk is rich in one mineral.
    solution: Sunlight helps the body make vitamin D, which lets it absorb the calcium in milk to build bone.
    mistakes:
      For iron and iodine: bone_nutrients
