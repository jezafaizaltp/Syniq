# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 3. Format: content/README.md.
subject: cbse9-sci
chapter: 3
title: Tissues in Action
tips:
  xylem_phloem: Xylem carries water and minerals up from the roots. Phloem carries food from the leaves to other parts.
  meristem_growth: 'Meristematic tissue is the dividing tissue: apical at tips (length), lateral for girth, intercalary at the base of leaves or internodes.'
  tendon_ligament: Tendons join muscle to bone. Ligaments join bone to bone.
  muscle_kinds: Striated muscles are voluntary (arms, legs); smooth muscles are involuntary (gut, blood vessels); cardiac muscle is in the heart and never tires.
  ligament_tendon_swap: Ligaments join bone to bone at a joint; tendons join muscle to bone.
concepts:
- code: cbse9ex.tissue.plant
  title: Plant tissues
  notes: |
    A tissue is a group of cells with similar structure working together. Meristematic tissue divides:
    apical (root and shoot tips, length), lateral (cambium, girth), intercalary (base of leaves,
    internodes). Permanent tissues: simple (parenchyma: storage; collenchyma: flexibility; sclerenchyma:
    hard, dead, lignin, e.g. husk of coconut) and protective (epidermis, cork). Complex: xylem (tracheids,
    vessels, xylem parenchyma, fibres; water and minerals) and phloem (sieve tubes, companion cells,
    phloem parenchyma, fibres; food).
  explanations:
    text: 'Plants grow only at special spots where cells keep dividing: the meristems. At the tips they make the plant longer; in the stem''s sides they make it thicker. Other tissues stop dividing and do one job: parenchyma stores food, sclerenchyma makes things hard like coconut husk, xylem carries water up, and phloem carries food around.'
    visual: 'Picture two pipes in a stem. One carries water up from the roots, like a borewell pipe: that''s xylem. The other carries sugar from the leaves to the roots and fruits, like a delivery van: that''s phloem.'
    step_by_step: 'Step 1: Is it dividing? Then it''s meristematic: tip (apical), side (lateral) or at a node (intercalary). Step 2: If not, is it simple (one cell type) or complex (many)? Step 3: Water up = xylem; food around = phloem. Step 4: Hard and dead = sclerenchyma; bendy = collenchyma; storage = parenchyma.'
    real_world: Grass grows back after mowing because it has intercalary meristem at the base of its leaves. A coconut husk is hard because of sclerenchyma fibres, which are also used to make coir rope.
  picture:
    kind: compare
    columns:
    - title: Xylem
      points:
      - Carries water and minerals
      - Moves them up from the roots
      - 'Mostly dead cells: vessels and tracheids'
    - title: Phloem
      points:
      - Carries food made in the leaves
      - Moves it up and down the plant
      - 'Living cells: sieve tubes, companion cells'
    alt: Xylem carries water and minerals up from the roots; phloem carries food from the leaves both up and down.
  items:
  - prompt: Which tissue carries water from the roots to the leaves?
    options:
    - Xylem
    - Phloem
    - Parenchyma
    - Cork
    answer: Xylem
    difficulty: 1
    hints:
    - Think of a water pipe going up.
    - Phloem carries food.
    solution: Xylem carries water and minerals upward.
    mistakes:
      Phloem: xylem_phloem
  - prompt: Which tissue increases the length of a root or shoot?
    options:
    - Apical meristem
    - Lateral meristem
    - Sclerenchyma
    - Xylem
    answer: Apical meristem
    difficulty: 1
    hints:
    - Apex means tip.
    - Growth at the tips.
    solution: Apical meristem at the tips increases length.
    mistakes:
      Lateral meristem: meristem_growth
  - prompt: The husk of a coconut is made of which tissue?
    options:
    - Sclerenchyma
    - Parenchyma
    - Collenchyma
    - Phloem
    answer: Sclerenchyma
    difficulty: 2
    hints:
    - It is hard and dead.
    - Its walls contain lignin.
    solution: 'Coconut husk is sclerenchyma: hard fibres with lignin.'
  - prompt: Which tissue carries food from the leaves to other parts?
    options:
    - Phloem
    - Xylem
    - Epidermis
    - Cork
    answer: Phloem
    difficulty: 1
    hints:
    - Food made in leaves must travel.
    - It has sieve tubes.
    solution: Phloem carries food made in leaves.
    mistakes:
      Xylem: xylem_phloem
  - prompt: Grass grows back after it is cut because of…
    options:
    - Intercalary meristem
    - Apical meristem
    - Cork
    - Xylem
    answer: Intercalary meristem
    difficulty: 2
    hints:
    - The tips have been cut off.
    - Growth from the base of leaves.
    solution: Intercalary meristem at the leaf base keeps dividing.
    mistakes:
      Apical meristem: meristem_growth
  - prompt: Which of these is a dead tissue in xylem that carries water?
    options:
    - Vessels
    - Sieve tubes
    - Companion cells
    - Phloem parenchyma
    answer: Vessels
    difficulty: 3
    hints:
    - Sieve tubes and companion cells are in phloem.
    - Tracheids and vessels are tubes.
    solution: Vessels (and tracheids) are dead tubes in xylem that carry water.
    mistakes:
      Sieve tubes: xylem_phloem
- code: cbse9ex.tissue.animal
  title: Animal tissues
  after:
  - cbse9ex.tissue.plant
  notes: |
    Epithelial (covering: squamous, cuboidal, columnar, ciliated), connective (blood: plasma, RBC, WBC,
    platelets; bone; cartilage; ligament bone–bone; tendon muscle–bone; areolar; adipose fat), muscular
    (striated/voluntary, smooth/involuntary, cardiac) and nervous (neurons: cell body, dendrites, axon).
  explanations:
    text: 'Animals have four main kinds of tissue. Epithelium covers surfaces, like skin and the lining of your mouth. Connective tissue joins and supports: bone, cartilage, blood, fat, tendons and ligaments. Muscle tissue moves things. Nervous tissue carries messages as electrical signals through neurons.'
    visual: Picture a building. Epithelium is the paint and tiles on every surface. Connective tissue is the steel frame, cement and water pipes. Muscle is the lift motor. Nerves are the wiring that carries signals.
    step_by_step: 'Step 1: Does it cover or line? Epithelial. Step 2: Does it join, support or transport? Connective. Step 3: Does it contract? Muscular: voluntary (striated), involuntary (smooth), or heart (cardiac). Step 4: Does it carry signals? Nervous.'
    real_world: When you sprain an ankle, a ligament (bone to bone) has been stretched or torn. Your heart's cardiac muscle beats about 100,000 times a day without ever resting.
  items:
  - prompt: Which tissue joins a muscle to a bone?
    options:
    - Tendon
    - Ligament
    - Cartilage
    - Areolar tissue
    answer: Tendon
    difficulty: 1
    hints:
    - The other joins bone to bone.
    - The Achilles tendon is at your heel.
    solution: Tendons join muscles to bones.
    mistakes:
      Ligament: tendon_ligament
  - prompt: Blood is which type of tissue?
    options:
    - Connective
    - Epithelial
    - Muscular
    - Nervous
    answer: Connective
    difficulty: 1
    hints:
    - It joins and transports.
    - Its cells float in plasma.
    solution: Blood is a fluid connective tissue.
  - prompt: Muscles of the stomach and intestine are…
    options:
    - Smooth (involuntary)
    - Striated (voluntary)
    - Cardiac
    - Skeletal
    answer: Smooth (involuntary)
    difficulty: 2
    hints:
    - You can't control them.
    - They push food along by themselves.
    solution: Gut muscles are smooth and involuntary.
    mistakes:
      Striated (voluntary): muscle_kinds
  - prompt: Which tissue covers the skin and lines the mouth?
    options:
    - Epithelial
    - Connective
    - Muscular
    - Nervous
    answer: Epithelial
    difficulty: 1
    hints:
    - Covering tissue.
    - Cells packed tightly in sheets.
    solution: Epithelial tissue covers and lines body surfaces.
  - prompt: Which part of a neuron carries the signal away from the cell body?
    options:
    - Axon
    - Dendrite
    - Nucleus
    - Cell wall
    answer: Axon
    difficulty: 2
    hints:
    - It's the long fibre.
    - Dendrites bring signals in.
    solution: The axon carries impulses away from the cell body.
  - prompt: Which muscle works all through life without getting tired?
    options:
    - Cardiac muscle
    - Biceps
    - Smooth muscle of the gut
    - Leg muscle
    answer: Cardiac muscle
    difficulty: 2
    hints:
    - It's in the heart.
    - It never rests.
    solution: Cardiac muscle contracts rhythmically throughout life.
    mistakes:
      Biceps: muscle_kinds
  - prompt: Fat is stored below the skin in which tissue?
    options:
    - Adipose tissue
    - Cartilage
    - Bone
    - Ligament
    answer: Adipose tissue
    difficulty: 3
    hints:
    - It also insulates the body.
    - Its cells are filled with fat globules.
    solution: Adipose tissue stores fat and acts as insulation.
- code: cbse9ex.tissue.musculoskeletal
  title: Bones, muscles and joints
  after:
  - cbse9ex.tissue.animal
  notes: |
    The musculoskeletal system is built from tissues working together: bone and cartilage (connective tissue)
    give shape and support; skeletal (striated) muscles move bones by contracting, usually in opposing pairs
    (biceps bends the elbow, triceps straightens it); tendons join muscle to bone; ligaments join bone to bone.
    Joints: hinge (elbow, knee, one direction), ball-and-socket (shoulder, hip, all directions), pivot (neck,
    turning), gliding (wrist bones), and fixed joints (skull). Calcium, vitamin D, protein and regular exercise
    keep bones and muscles healthy.
  explanations:
    text: 'Bones are the frame, muscles are the motors and joints are the hinges. Muscles can only pull, so they work in pairs: the biceps pulls your forearm up, the triceps pulls it back down. Tendons tie muscles to bones; ligaments tie bones to each other.'
    visual: 'Draw an arm: upper bone and forearm meeting at the elbow. Draw the biceps on top, joined by tendons to both bones, and the triceps underneath. When the biceps shortens, the forearm swings up like a door on a hinge.'
    step_by_step: 'Step 1: Find the joint and its type (hinge, ball-and-socket, pivot, gliding, fixed). Step 2: Find the muscle pair that moves it. Step 3: The contracting muscle pulls; its partner relaxes. Step 4: Tendons carry the pull to the bone.'
    real_world: A cricket bowler's shoulder (ball-and-socket) swings in a full circle, while the knee (hinge) bends only one way. Warming up and strong muscles protect these joints from injury.
  picture:
    kind: compare
    columns:
    - title: Joint
      points:
      - Hinge
      - Ball-and-socket
      - Pivot
      - Fixed
    - title: Example
      points:
      - Elbow, knee
      - Shoulder, hip
      - Neck (turning head)
      - Skull
    alt: 'Types of joint with examples: hinge in the elbow and knee, ball-and-socket in the shoulder and hip, pivot in the neck, fixed in the skull.'
  items:
  - prompt: What kind of joint is the elbow?
    options:
    - Hinge joint
    - Ball-and-socket joint
    - Pivot joint
    - Fixed joint
    answer: Hinge joint
    difficulty: 1
    hints:
    - It bends one way, like a door.
    - The shoulder is the ball-and-socket.
    solution: 'Step 1: The elbow moves in one plane only. Step 2: That is a hinge joint.'
  - prompt: What joins a muscle to a bone?
    options:
    - Tendon
    - Ligament
    - Cartilage
    - Nerve
    answer: Tendon
    difficulty: 1
    hints:
    - Ligaments join bone to bone.
    - The Achilles ___ in the heel.
    solution: 'Step 1: Tendons connect muscle to bone. Step 2: Ligaments connect bone to bone.'
    mistakes:
      Ligament: ligament_tendon_swap
  - prompt: Why do muscles work in pairs?
    options:
    - A muscle can only pull, not push
    - One muscle is always tired
    - Bones need two muscles to stay alive
    - Pairs make muscles grow faster
    answer: A muscle can only pull, not push
    difficulty: 2
    hints:
    - Muscles contract.
    - Something must pull the bone back.
    solution: 'Step 1: A muscle can only shorten and pull. Step 2: A second muscle is needed to pull the bone back the other way.'
  - prompt: Which joint lets the arm swing in a full circle?
    options:
    - Ball-and-socket joint at the shoulder
    - Hinge joint at the elbow
    - Pivot joint at the neck
    - Gliding joint at the wrist
    answer: Ball-and-socket joint at the shoulder
    difficulty: 2
    hints:
    - A round end fits in a cup.
    - All directions.
    solution: 'Step 1: Movement in all directions needs a ball-and-socket joint. Step 2: The shoulder has one.'
  - prompt: Which tissue type are bone, cartilage and ligaments?
    options:
    - Connective tissue
    - Epithelial tissue
    - Nervous tissue
    - Muscular tissue
    answer: Connective tissue
    difficulty: 2
    hints:
    - They connect and support.
    - Blood is in this group too.
    solution: 'Step 1: Bone, cartilage, ligament, tendon and blood are all connective tissues.'
  - prompt: Which two nutrients matter most for strong bones?
    options:
    - Calcium and vitamin D
    - Sugar and fat
    - Vitamin C and iron
    - Salt and water
    answer: Calcium and vitamin D
    difficulty: 3
    hints:
    - Milk and sunlight.
    - Vitamin D helps absorb the other.
    solution: 'Step 1: Bones are hardened by calcium salts. Step 2: Vitamin D (from sunlight) helps the body absorb calcium.'
