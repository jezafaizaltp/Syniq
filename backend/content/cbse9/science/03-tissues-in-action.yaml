    - Pivot joint
    - Tendon
    - Ligament
    items:
    - label: Elbow
      bin: Hinge joint
      clue: Can it bend in only one direction, like a door?
      why: 'The elbow bends one way only: a hinge joint.'
    - label: Hip
      bin: Ball-and-socket joint
      clue: Can your leg swing forward, back and sideways?
      why: 'The ball of the thigh bone turns in a socket: movement in all directions.'
    - label: Turning your head to say 'no'
      bin: Pivot joint
      clue: Is it bending, or rotating around a peg?
      why: 'The top vertebra rotates around a peg on the one below: a pivot joint.'
    - label: Knee
      bin: Hinge joint
      clue: Which way can your knee bend?
      why: 'The knee bends in one direction: a hinge.'
    - label: Shoulder
      bin: Ball-and-socket joint
      clue: Can you swing your arm in a full circle?
      why: A full circle needs a ball in a socket.
    - label: Joins the calf muscle to the heel bone
      bin: Tendon
      clue: Muscle to bone, or bone to bone?
      why: Muscle to bone is a tendon (here the Achilles tendon).
    - label: Holds the thigh bone to the shin bone
      bin: Ligament
      clue: Muscle to bone, or bone to bone?
      why: Bone to bone is a ligament.
    - label: Pulls on the forearm when the biceps contracts
      bin: Tendon
      clue: What passes the muscle's pull to the bone?
      why: A tendon passes the muscle's pull to the bone.
    - label: Torn in a sprained ankle
      bin: Ligament
      clue: A sprain overstretches what holds the joint's bones together. What is that?
      why: A sprain is a stretched or torn ligament.
    - label: Finger knuckles
      bin: Hinge joint
      clue: Can your fingers bend sideways at the knuckle?
      why: 'The finger joints bend one way: hinge joints.'
  lesson:
    - teach: Tissues work together in systems. In the musculoskeletal system, bone (hard connective tissue with calcium) gives shape and support, cartilage cushions the ends of bones, and skeletal muscles move bones.
      check:
        prompt: Which mineral makes bones hard?
        options:
        - Calcium
        - Iron
        - Iodine
        answer: Calcium
        why: Calcium phosphate in the matrix makes bone hard.
    - teach: A muscle can only pull (contract), never push. So muscles work in opposing pairs. To bend the elbow the biceps contracts and the triceps relaxes; to straighten it the triceps contracts and the biceps relaxes. Tendons connect each muscle to the bone.
      picture:
        kind: compare
        columns:
        - title: Bend the elbow
          points:
          - Biceps contracts
          - Triceps relaxes
        - title: Straighten the elbow
          points:
          - Triceps contracts
          - Biceps relaxes
        alt: 'Biceps and triceps take turns: one pulls while the other relaxes.'
      check:
        prompt: Which muscle contracts to straighten your arm?
        options:
        - Triceps
        - Biceps
        - Both together
        answer: Triceps
        why: The triceps, at the back of the upper arm, pulls the forearm straight.
    - teach: Joints are where bones meet. Hinge joints (elbow, knee) move one way, like a door. Ball-and-socket joints (shoulder, hip) move in all directions. Pivot joints (neck) let the head turn. Ligaments hold the bones together at a joint.
      check:
        prompt: Which joint lets the leg swing forward, back and sideways?
        options:
        - Ball-and-socket at the hip
        - Hinge at the knee
        - Pivot at the neck
        answer: Ball-and-socket at the hip
        why: The ball of the thigh bone turns in the hip socket in all directions.
  items:
  - prompt: What kind of joint is the elbow?
    options:
    - Hinge joint
    - Ball-and-socket joint
    - Pivot joint
    - Fixed joint
    answer: Hinge joint
    difficulty: 1
    hints:
    - It bends one way, like a door.
    - The shoulder is the ball-and-socket.
    solution: 'Step 1: The elbow moves in one plane only. Step 2: That is a hinge joint.'
    mistakes: {"Ball-and-socket joint": "joint_movement", "Pivot joint": "joint_movement"}
  - prompt: What joins a muscle to a bone?
    options:
    - Tendon
    - Ligament
    - Cartilage
    - Nerve
    answer: Tendon
    difficulty: 1
    hints:
    - Ligaments join bone to bone.
    - The Achilles ___ in the heel.
    solution: 'Step 1: Tendons connect muscle to bone. Step 2: Ligaments connect bone to bone.'
    mistakes:
      Ligament: ligament_tendon_swap
  - prompt: Why do muscles work in pairs?
    options:
    - A muscle can only pull, not push
    - One muscle is always tired
    - Bones need two muscles to stay alive
    - Pairs make muscles grow faster
    answer: A muscle can only pull, not push
    difficulty: 2
    hints:
    - Muscles contract.
    - Something must pull the bone back.
    solution: 'Step 1: A muscle can only shorten and pull. Step 2: A second muscle is needed to pull the bone back the other way.'
    mistakes: {"One muscle is always tired": "muscle_pull_only", "Pairs make muscles grow faster": "muscle_pull_only"}
  - prompt: Which joint lets the arm swing in a full circle?
    options:
    - Ball-and-socket joint at the shoulder
    - Hinge joint at the elbow
    - Pivot joint at the neck
    - Gliding joint at the wrist
    answer: Ball-and-socket joint at the shoulder
    difficulty: 2
    hints:
    - A round end fits in a cup.
    - All directions.
    solution: 'Step 1: Movement in all directions needs a ball-and-socket joint. Step 2: The shoulder has one.'
    mistakes: {"Hinge joint at the elbow": "full_circle_joint", "Pivot joint at the neck": "full_circle_joint"}
  - prompt: Which tissue type are bone, cartilage and ligaments?
    options:
    - Connective tissue
    - Epithelial tissue
    - Nervous tissue
    - Muscular tissue
    answer: Connective tissue
    difficulty: 2
    hints:
    - They connect and support.
    - Blood is in this group too.
    solution: 'Step 1: Bone, cartilage, ligament, tendon and blood are all connective tissues.'
    mistakes: {"Epithelial tissue": "support_tissues", "Muscular tissue": "support_tissues"}
  - prompt: Which two nutrients matter most for strong bones?
    options:
    - Calcium and vitamin D
    - Sugar and fat
    - Vitamin C and iron
    - Salt and water
    answer: Calcium and vitamin D
    difficulty: 3
    hints:
    - Milk and sunlight.
    - Vitamin D helps absorb the other.
    solution: 'Step 1: Bones are hardened by calcium salts. Step 2: Vitamin D (from sunlight) helps the body absorb calcium.'
    mistakes: {"Vitamin C and iron": "bone_nutrients", "Sugar and fat": "bone_nutrients"}
  - prompt: What kind of joint is the knee?
    options:
    - Hinge joint
    - Ball-and-socket joint
    - Pivot joint
    - Fixed joint
    answer: Hinge joint
    difficulty: 1
    hints:
    - It bends one way only.
    - Like a door.
    solution: 'The knee moves back and forth in one plane: a hinge joint.'
    mistakes:
      Ball-and-socket joint: joint_movement
  - prompt: What joins two bones together at a joint?
    options:
    - Ligament
    - Tendon
    - Nerve
    - Blood vessel
    answer: Ligament
    difficulty: 1
    hints:
    - Bone to bone.
    - Tendons are muscle to bone.
    solution: Ligaments join bone to bone.
    mistakes:
      Tendon: ligament_tendon_swap
  - prompt: Which joint lets you turn your head from side to side?
    options:
    - Pivot joint
    - Hinge joint
    - Ball-and-socket joint
    - Fixed joint
    answer: Pivot joint
    difficulty: 1
    hints:
    - One bone turns around another.
    - Between the top two neck bones.
    solution: A pivot joint in the neck lets the head rotate.
    mistakes:
      Hinge joint: joint_movement
  - prompt: What cushions the ends of bones at a joint so they don't rub?
    options:
    - Cartilage
    - Tendon
    - Fat
    - Skin
    answer: Cartilage
    difficulty: 2
    hints:
    - It is smooth and slightly bendy.
    - It is also in your ears.
    solution: Smooth cartilage covers bone ends and reduces friction.
    mistakes:
      Tendon: tendon_ligament
  - prompt: When you bend your elbow, what does the triceps do?
    options:
    - Relaxes
    - Contracts
    - Pushes the arm
    - Nothing at all
    answer: Relaxes
    difficulty: 2
    hints:
    - Only one of the pair pulls at a time.
    - The biceps is pulling.
    solution: The biceps contracts and the triceps relaxes.
    mistakes:
      Pushes the arm: muscle_pull_only
      Contracts: muscle_pull_only
  - prompt: Which type of muscle moves the bones of the skeleton?
    options:
    - Striated (skeletal) muscle
    - Smooth muscle
    - Cardiac muscle
    - Ciliated epithelium
    answer: Striated (skeletal) muscle
    difficulty: 2
    hints:
    - It is under our control.
    - It looks striped under a microscope.
    solution: Skeletal muscle is striated and voluntary; it pulls on bones through tendons.
    mistakes:
      Smooth muscle: muscle_kinds
  - prompt: Which joints in the skull don't move at all?
    options:
    - Fixed joints (sutures)
    - Hinge joints
    - Pivot joints
    - Ball-and-socket joints
    answer: Fixed joints (sutures)
    difficulty: 2
    hints:
    - The skull protects the brain.
    - Its bones are locked together.
    solution: Skull bones meet at immovable fixed joints called sutures.
    mistakes:
      Hinge joints: joint_movement
  - prompt: A sportsperson tears the tissue joining the calf muscle to the heel bone. Which tissue is torn?
