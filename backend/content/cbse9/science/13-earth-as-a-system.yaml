    - They don't affect the air
    answer: They take in CO₂ and give out O₂ and water vapour
    difficulty: 2
    hints:
    - Think of photosynthesis and transpiration.
    - Gases move in and out of leaves.
    solution: Through photosynthesis and transpiration, plants exchange gases and water with the air.
    mistakes:
