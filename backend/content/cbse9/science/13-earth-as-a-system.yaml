    solution: 'Step 1: Ozone (O3) high in the atmosphere absorbs UV rays. Step 2: So the ozone layer protects life.'
    mistakes: {"Clouds of water vapour": "ozone_uv", "The nitrogen layer": "ozone_uv"}
  - prompt: Which sphere includes rocks, mountains and soil?
    options:
    - Lithosphere
    - Hydrosphere
    - Atmosphere
    - Biosphere
    answer: Lithosphere
    difficulty: 1
    hints:
    - '''Litho'' means stone.'
    - The solid outer layer.
    solution: The lithosphere is Earth's rocky layer and soil.
    mistakes:
      Hydrosphere: c9s13_sphere_names
  - prompt: About what percentage of air is nitrogen?
    answer: '78'
    check: '78'
    difficulty: 1
    hints:
    - It is the biggest part.
    - Oxygen is about 21%.
    solution: Nitrogen makes up about 78% of air.
    mistakes:
      '21': c9s13_oxygen_share
  - prompt: Rivers, glaciers and oceans together form the…
    options:
    - Hydrosphere
    - Lithosphere
    - Atmosphere
    - Biosphere
    answer: Hydrosphere
    difficulty: 1
    hints:
    - '''Hydro'' means water.'
    - Ice counts too.
    solution: All of Earth's water is the hydrosphere.
    mistakes:
      Lithosphere: c9s13_sphere_names
  - prompt: Which way does a sea breeze blow?
    options:
    - From sea to land, during the day
    - From land to sea, during the day
    - From land to sea, at night
    - Upwards only
    answer: From sea to land, during the day
    difficulty: 2
    hints:
    - By day the land heats faster.
    - Air rises over the land; cooler air flows in.
    solution: By day warm air rises over land, and cooler air from the sea moves in.
    mistakes:
      From land to sea, during the day: wind_direction
  - prompt: What does the ozone layer protect us from?
    options:
    - Ultraviolet rays
    - Rain
    - Meteors only
    - Sound
    answer: Ultraviolet rays
    difficulty: 2
    hints:
    - They can cause skin cancer.
    - They come from the Sun.
