# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 13. Format: content/README.md.
subject: cbse9-sci
chapter: 13
title: 'Earth as a System: Energy, Matter and Life'
tips:
  sun_energy_source: "Almost all energy at Earth's surface drives winds, the water cycle and photosynthesis. Where does that heat and light come from?"
  wind_direction: Warm air rises and leaves low pressure; cooler air moves in from high pressure. Wind blows from high to low pressure.
  cycle_names: "Match the process to the change: gas to liquid droplets, taking CO₂ in to make food, bacteria in root nodules, or bacteria turning soil nitrates back into gas."
  air_nitrogen: "Air is about 78% one gas and 21% oxygen. Which gas is the 78%?"
  biosphere_life: "'Bio' means life. Which sphere is all the living things?"
  fossil_fuel_co2: "Which activity releases carbon stored underground for millions of years? Trees take CO₂ out of the air."
  ozone_uv: "A special form of oxygen, O₃, high up absorbs UV rays. What is that layer called?"
  transpiration_leaves: "Water vapour leaving through tiny holes in leaves has its own name. Condensation and precipitation happen in clouds."
  warm_air_density: "When air is heated it expands. The same air in more space: is it lighter or heavier than the cool air around it?"
concepts:
- code: cbse9ex.earth.spheres
  title: Earth's spheres, the Sun's energy and winds
  notes: |
    Earth works as one system of four parts that keep exchanging matter and energy: the lithosphere (rocks
    and soil), the hydrosphere (water in oceans, rivers, ice, groundwater), the atmosphere (the layer of air:
    about 78% nitrogen, 21% oxygen, small amounts of argon, carbon dioxide and water vapour) and the biosphere
    (all living things, where the other three meet). The Sun is the main source of energy. The atmosphere lets
    sunlight in and traps some heat (greenhouse effect), keeping Earth warm enough for life; the ozone layer
    absorbs harmful ultraviolet rays. Land heats and cools faster than water, so places are heated unevenly.
    Warm air expands, becomes lighter and rises, making low pressure; cooler, heavier air moves in from high
    pressure: this is wind. Sea breeze blows from sea to land in the day; land breeze from land to sea at
    night. Monsoon winds come from the same uneven heating on a large scale.
  explanations:
    text: 'Picture Earth as four layers working together: rock, water, air and life. The Sun heats them unevenly; land warms faster than the sea. Warm air rises, cooler air rushes in to take its place, and that moving air is wind.'
    visual: 'Draw a beach at noon: hot land with an arrow of air rising, the cooler sea with air moving toward land along the ground, and a loop of air back out to sea higher up. That loop is the sea breeze.'
    step_by_step: 'Step 1: Sunlight heats land faster than water. Step 2: Air over the land warms, expands and rises (low pressure). Step 3: Cooler air from over the sea (high pressure) moves in. Step 4: That flow is a sea breeze. At night it reverses.'
    real_world: 'Kerala''s southwest monsoon in June is a giant sea breeze: the hot Indian landmass pulls in moist air from the Arabian Sea, which brings the rain.'
  picture:
    kind: flow
    steps:
    - Sun heats land faster than sea
    - Air over land warms and rises
    - Low pressure over land
    - Cool air flows in from the sea
    - Sea breeze
    alt: How uneven heating of land and sea by the Sun makes a sea breeze.
  activity:
    type: sort
    prompt: Which of Earth's four spheres does each one belong to?
    bins:
    - Lithosphere
    - Hydrosphere
    - Atmosphere
    - Biosphere
    items:
    - label: Soil on a farm
      bin: Lithosphere
      clue: Is it rock, water, air or living?
      why: 'Soil is broken-down rock: the lithosphere.'
    - label: Groundwater in a well
      bin: Hydrosphere
      clue: It's underground, but what is it made of?
      why: 'It is water, even though it''s under the ground: the hydrosphere.'
    - label: Glaciers in the Himalayas
      bin: Hydrosphere
      clue: What is a glacier made of?
      why: 'Ice is water in solid form: the hydrosphere.'
    - label: Nitrogen, about 78% of the air
      bin: Atmosphere
      clue: Is it a gas around the Earth?
      why: Nitrogen is the main gas of the atmosphere.
    - label: Living corals
      bin: Biosphere
      clue: Are corals alive?
      why: 'Corals are living animals: the biosphere.'
    - label: Volcanic rock
      bin: Lithosphere
      clue: Is it solid rock?
      why: Rock is part of the lithosphere.
    - label: The ozone layer
      bin: Atmosphere
      clue: Is it a layer of gas high up?
      why: Ozone is a gas high in the atmosphere.
    - label: A mangrove forest
      bin: Biosphere
      clue: Are the trees living things?
      why: Living trees and animals form the biosphere.
    - label: Bacteria in the soil
      bin: Biosphere
      clue: They live in the soil. Are they alive?
      why: Living things belong to the biosphere, wherever they live.
    - label: The Arabian Sea
      bin: Hydrosphere
      clue: What is a sea mostly made of?
      why: Oceans and seas are the hydrosphere.
  items:
  - prompt: Which gas makes up the largest part of the air?
    options:
    - Nitrogen
    - Oxygen
    - Carbon dioxide
    - Argon
    answer: Nitrogen
    difficulty: 1
    hints:
    - It is about 78%.
    - Oxygen is about 21%.
    solution: 'Step 1: Air is about 78% nitrogen and 21% oxygen. Step 2: Nitrogen is the largest part.'
    mistakes: {"Oxygen": "air_nitrogen", "Carbon dioxide": "air_nitrogen"}
  - prompt: What is the main source of energy for Earth's surface?
    options:
    - The Sun
    - The Moon
    - Volcanoes
    - Ocean tides
    answer: The Sun
    difficulty: 1
    hints:
    - It drives plants and weather.
    - It lights the day.
    solution: 'Step 1: Sunlight drives photosynthesis, winds and the water cycle. Step 2: The Sun is the main source.'
    mistakes:
      Volcanoes: sun_energy_source
  - prompt: Which sphere of the Earth includes all living things?
    options:
    - Biosphere
    - Lithosphere
    - Hydrosphere
    - Atmosphere
    answer: Biosphere
    difficulty: 1
    hints:
    - '''Bio'' means life.'
    - Where land, water and air meet.
    solution: 'Step 1: Bio means life. Step 2: The biosphere is the zone of all living things.'
    mistakes: {"Lithosphere": "biosphere_life", "Hydrosphere": "biosphere_life"}
  - prompt: During a sunny day at the beach, which way does the breeze blow?
    options:
    - From the sea to the land
    - From the land to the sea
    - Straight upward only
    - There is no breeze in the day
    answer: From the sea to the land
    difficulty: 2
    hints:
    - Land heats faster than water.
    - Air moves toward the warmer, low-pressure place.
    solution: 'Step 1: Land warms faster, so air above it rises. Step 2: Cooler air from the sea moves in: a sea breeze.'
    mistakes:
      From the land to the sea: wind_direction
  - prompt: Why does warm air rise?
    options:
    - It expands and becomes lighter than the cooler air around it
    - It contains more oxygen
    - The Sun pulls it up
    - It becomes heavier
    answer: It expands and becomes lighter than the cooler air around it
    difficulty: 2
    hints:
    - Think about density.
    - Hot-air balloons use this.
    solution: 'Step 1: Heating makes air expand. Step 2: The same air in more space is less dense, so it rises.'
    mistakes: {"It becomes heavier": "warm_air_density", "The Sun pulls it up": "warm_air_density"}
  - prompt: Which layer in the atmosphere protects us from the Sun's harmful ultraviolet rays?
    options:
    - The ozone layer
    - The lithosphere
    - Clouds of water vapour
    - The nitrogen layer
    answer: The ozone layer
    difficulty: 2
    hints:
    - It is a form of oxygen, O3.
    - CFCs damage it.
    solution: 'Step 1: Ozone (O3) high in the atmosphere absorbs UV rays. Step 2: So the ozone layer protects life.'
    mistakes: {"Clouds of water vapour": "ozone_uv", "The nitrogen layer": "ozone_uv"}
- code: cbse9ex.earth.cycles
  title: Cycles of water, carbon, nitrogen and oxygen
  notes: |
    Matter on Earth is reused through cycles that link living and non-living parts. Water cycle: the Sun
    evaporates water from seas and lakes and plants give off water (transpiration); vapour cools and condenses
    into clouds; precipitation (rain, snow) returns it; it flows as runoff or soaks in as groundwater. Carbon
    cycle: plants take in carbon dioxide in photosynthesis and make food; animals eat plants; respiration,
    decomposition and burning of fuels return CO2 to air; carbon is also stored in fossil fuels and in
    carbonate rocks. Oxygen cycle: photosynthesis releases oxygen; respiration and burning use it up.
    Nitrogen cycle: most living things cannot use nitrogen gas directly; nitrogen-fixing bacteria (Rhizobium in
    root nodules of legumes) and lightning turn it into compounds; plants take up nitrates to make proteins;
    decomposers turn dead matter into ammonia, then nitrates; denitrifying bacteria return nitrogen gas to air.
    Human activity (burning fuels, cutting forests, too much fertiliser) upsets these balances.
  explanations:
    text: Earth doesn't get new water, carbon or nitrogen; it keeps recycling the same atoms. The water you drink may once have been a cloud over the Himalayas. Plants pull carbon out of the air, animals and fires put it back, and soil bacteria keep moving nitrogen between air and living things.
    visual: 'Draw a circle: sea → (evaporation) → cloud → (condensation) → rain on a hill → river → back to the sea. Draw a second circle: CO2 in air → leaf (photosynthesis) → cow eats grass → breathing out CO2 → air.'
    step_by_step: 'Step 1: Name what moves (water, carbon, nitrogen, oxygen). Step 2: Find what takes it out of the air or sea. Step 3: Find what puts it back. Step 4: Note where it can be stored for a long time (ice, groundwater, fossil fuels, rocks).'
    real_world: Farmers grow pulses like green gram between rice crops because bacteria in their root nodules add nitrogen to the soil, so less fertiliser is needed.
  picture:
    kind: flow
    steps:
    - Evaporation from seas
    - Water vapour rises
    - Condensation into clouds
    - Rain or snow
    - Runoff and groundwater back to the sea
    alt: 'The water cycle: evaporation, condensation into clouds, precipitation and flow back to the sea.'
  activity:
    type: sort
    prompt: 'The carbon cycle: does each one take carbon dioxide out of the air, or put it in?'
    bins:
    - Takes CO₂ out of the air
    - Puts CO₂ into the air
    items:
    - label: Photosynthesis in leaves
      bin: Takes CO₂ out of the air
      clue: What do plants use to make food?
      why: Plants take in CO₂ and use it to make food.
    - label: Respiration in animals
      bin: Puts CO₂ into the air
      clue: What do you breathe out?
      why: Respiration releases CO₂.
    - label: Plants respiring at night
      bin: Puts CO₂ into the air
      clue: Do plants respire too, even without light?
      why: Plants respire all the time; at night there is no photosynthesis, so they give out CO₂.
    - label: Burning petrol and coal
      bin: Puts CO₂ into the air
      clue: What gas comes out of exhausts and chimneys?
      why: Burning fossil fuels releases the carbon stored in them as CO₂.
    - label: Dead leaves rotting
      bin: Puts CO₂ into the air
      clue: What do decomposers do as they feed?
      why: Decomposers respire and release CO₂.
    - label: Ocean water dissolving CO₂
      bin: Takes CO₂ out of the air
      clue: Where does the gas go when water absorbs it?
      why: The ocean absorbs CO₂ from the air.
    - label: Sea animals building shells
      bin: Takes CO₂ out of the air
      clue: What are shells made of? Where does the carbon come from?
      why: Shells are calcium carbonate, which locks away carbon taken from the water and air.
    - label: A volcano erupting
      bin: Puts CO₂ into the air
      clue: What gases come out of a volcano?
      why: Volcanoes release CO₂ from deep inside the Earth.
    - label: Planting a new forest
      bin: Takes CO₂ out of the air
      clue: What does a growing tree build its wood from?
      why: Growing trees take in CO₂ and store the carbon in wood.
  items:
  - prompt: In the water cycle, what is the change of water vapour into clouds called?
    options:
    - Condensation
    - Evaporation
    - Transpiration
    - Precipitation
    answer: Condensation
    difficulty: 1
    hints:
    - The vapour cools down.
    - Gas turns into tiny droplets.
    solution: 'Step 1: Vapour cools high up. Step 2: It turns into droplets: condensation.'
    mistakes:
      Evaporation: cycle_names
  - prompt: Which process removes carbon dioxide from the air?
    options:
    - Photosynthesis
    - Respiration
    - Burning wood
    - Decomposition
    answer: Photosynthesis
    difficulty: 1
    hints:
    - Green plants do it in sunlight.
    - The other three release CO2.
    solution: 'Step 1: Plants take in CO2 to make glucose. Step 2: That is photosynthesis.'
    mistakes:
      Respiration: cycle_names
  - prompt: 'Water given off from the leaves of plants is called:'
    options:
    - Transpiration
    - Condensation
    - Precipitation
    - Infiltration
    answer: Transpiration
    difficulty: 1
    hints:
    - It happens through stomata.
    - A kind of evaporation from plants.
    solution: 'Step 1: Leaves lose water vapour through stomata. Step 2: That is transpiration.'
    mistakes: {"Condensation": "transpiration_leaves", "Precipitation": "transpiration_leaves"}
  - prompt: Why do farmers grow pea or bean plants to improve the soil?
    options:
    - Bacteria in their root nodules fix nitrogen
    - They give off extra oxygen into soil
    - They absorb all the nitrogen
    - They don't need water
    answer: Bacteria in their root nodules fix nitrogen
    difficulty: 2
    hints:
    - Rhizobium.
    - Plants can't use nitrogen gas directly.
    solution: 'Step 1: Rhizobium in legume root nodules turns nitrogen gas into compounds. Step 2: That enriches the soil with nitrogen.'
    mistakes:
      They absorb all the nitrogen: cycle_names
  - prompt: Which human activity adds most carbon dioxide to the air?
    options:
    - Burning fossil fuels
    - Growing trees
    - Building dams
    - Ploughing with bullocks
    answer: Burning fossil fuels
    difficulty: 2
    hints:
    - Coal, petrol and diesel.
    - Carbon stored for millions of years is released.
    solution: 'Step 1: Fossil fuels are stored carbon. Step 2: Burning them releases CO2 into the air.'
    mistakes: {"Growing trees": "fossil_fuel_co2", "Building dams": "fossil_fuel_co2"}
  - prompt: Which process returns nitrogen gas to the air?
    options:
    - Denitrification by bacteria
    - Nitrogen fixation
    - Photosynthesis
    - Transpiration
    answer: Denitrification by bacteria
    difficulty: 3
    hints:
    - Fixation takes nitrogen out of the air.
    - Some soil bacteria break nitrates down.
    solution: 'Step 1: Denitrifying bacteria turn nitrates into nitrogen gas. Step 2: That returns nitrogen to the air.'
    mistakes:
      Nitrogen fixation: cycle_names
