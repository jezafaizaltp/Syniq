# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 9. Format: content/README.md.
subject: cbse9-sci
chapter: 9
title: Atomic Foundations of Matter
tips:
  criss_cross_valency: 'Swap the valencies: the valency of one becomes the subscript of the other. Al³⁺ and O²⁻ give Al₂O₃.'
  molecular_mass_count_all: Multiply each atom's mass by how many of that atom there are, then add. H₂O is 2 × 1 + 16 = 18 u.
  mole_avogadro: One mole has 6.022 × 10²³ particles. Number of moles = given mass ÷ molar mass.
  conservation_of_mass: In a reaction, total mass of reactants = total mass of products. Mass is neither created nor destroyed.
  formula_valency_cross: 'Write the symbols, put each valency under the other symbol (criss-cross), then simplify: Al³⁺ and O²⁻ give Al₂O₃.'
  ionic_covalent_swap: Ionic bonds form when electrons are transferred (usually metal with non-metal); covalent bonds form when non-metals share electrons.
  fixed_ratio: "In water every 1 g of hydrogen combines with 8 g of oxygen. Scale that up for 3 g."
  formula_mass_add: "Add the atomic masses of every atom in the formula: one Na and one Cl."
concepts:
- code: cbse9ex.atoms.laws
  title: Laws of chemical combination and formulae
  notes: |
    Law of conservation of mass: mass is neither created nor destroyed in a chemical reaction. Law of
    constant proportions: a compound always contains the same elements in the same proportion by mass
    (water H:O = 1:8). Dalton's atomic theory. Valency is an atom's combining capacity; formulae of
    ionic compounds are written by criss-crossing valencies (Na⁺Cl⁻ → NaCl, Ca²⁺ Cl⁻ → CaCl₂, Al³⁺ O²⁻ →
    Al₂O₃). Polyatomic ions such as SO₄²⁻, NO₃⁻, OH⁻, CO₃²⁻, NH₄⁺ stay together in brackets.
  explanations:
    text: 'In any reaction the total mass stays the same: the atoms just rearrange. And a compound always has its elements in the same ratio by mass. To write a formula, use valencies: calcium has valency 2 and chlorine 1, so it takes two chlorines for one calcium: CaCl₂.'
    visual: 'Write the two symbols side by side with their valencies above them. Draw an X: each valency drops diagonally to become the small number below the other symbol. Cancel any common factor.'
    step_by_step: 'Step 1: Write the symbols, positive ion first. Step 2: Write each valency above. Step 3: Criss-cross them as subscripts. Step 4: Simplify if both share a factor. Step 5: Put polyatomic ions in brackets if their subscript is more than 1.'
    real_world: 'Burn a candle under a sealed jar on a balance and the reading doesn''t change: the wax and oxygen turn into gases, but nothing escapes. That''s conservation of mass.'
  picture:
    kind: flow
    steps:
    - 'Write the symbols with their valencies: Al (3), O (2)'
    - 'Cross over: Al takes the 2, O takes the 3'
    - 'Formula: Al₂O₃'
    alt: 'The criss-cross method for aluminium oxide: aluminium has valency 3 and oxygen 2, so the formula is Al₂O₃.'
    caption: 'Check: 2 aluminium × 3 = 6 and 3 oxygen × 2 = 6, so the valencies balance.'
  activity:
    type: formula
    prompt: A compound must have no charge left over. Choose how many positive and negative ions are in one unit.
    inputs:
    - name: a
      label: Charge on the metal ion (+)
      min: 1
      max: 3
      step: 1
      start: 1
    - name: x
      label: Metal ions
      min: 1
      max: 3
      step: 1
      start: 1
    - name: b
      label: Charge on the non-metal ion (−)
      min: 1
      max: 3
      step: 1
      start: 1
    - name: y
      label: Non-metal ions
      min: 1
      max: 3
      step: 1
      start: 1
    outputs:
    - name: plus
      label: Total + charge
      expr: a*x
    - name: minus
      label: Total − charge
      expr: b*y
    - name: net
      label: Charge left over
      expr: a*x-b*y
    - name: n
      label: Ions in one unit
      expr: x+y
    goals:
    - prompt: 'Calcium chloride: Ca²⁺ and Cl⁻. Make it neutral.'
      want:
        a: 2
        b: 1
        net: 0
      hint: 'Criss-cross: each ion''s charge number becomes the other ion''s count.'
      mistakes:
      - when:
          a: 2
          b: 1
          x: 2
          y: 1
        say: 'Ca₂Cl has +4 and only −1. Cross the numbers over: Ca''s 2 goes on Cl.'
      - when:
          a: 2
          b: 1
          x: 1
          y: 1
        say: 'CaCl has +2 and −1: one + charge is left over. Every compound is neutral.'
    - prompt: 'Aluminium oxide: Al³⁺ and O²⁻. Make it neutral.'
      want:
        a: 3
        b: 2
        net: 0
      mistakes:
      - when:
          a: 3
          b: 2
          x: 3
          y: 2
        say: 'Al₃O₂ gives +9 and −4. Criss-cross: Al''s 3 goes on O, O''s 2 goes on Al.'
      - when:
          a: 3
          b: 2
          x: 1
          y: 1
        say: 'AlO gives +3 and −2: one + left over.'
    - prompt: 'Magnesium oxide: Mg²⁺ and O²⁻. Make it neutral with the fewest ions.'
      want:
        a: 2
        b: 2
        net: 0
        n: 2
      mistakes:
      - when:
          a: 2
          b: 2
          x: 2
          y: 2
        say: 'Mg₂O₂ is neutral, but it simplifies: the ratio is 1 : 1. Formulas use the simplest ratio.'
  items:
  - prompt: What is the formula of aluminium oxide? (Al has valency 3, O has valency 2.)
    options:
    - Al₂O₃
    - AlO
    - Al₃O₂
    - AlO₃
    answer: Al₂O₃
    difficulty: 1
    hints:
    - Criss-cross the valencies.
    - Al gets 2, O gets 3.
    solution: Criss-crossing 3 and 2 gives Al₂O₃.
    mistakes:
      Al₃O₂: criss_cross_valency
  - prompt: 5.3 g of sodium carbonate reacts with 6 g of acetic acid. The products weigh 2.2 g carbon dioxide plus the rest. What is the mass of the rest, in g?
    answer: '9.1'
    check: 5.3 + 6 - 2.2
    difficulty: 2
    hints:
    - Total mass stays the same.
    - 5.3 + 6 − 2.2.
    solution: 'Step 1: Reactants = 11.3 g. Step 2: Rest = 11.3 − 2.2 = 9.1 g.'
    mistakes:
      '13.5': conservation_of_mass
  - prompt: What is the formula of calcium chloride? (Ca valency 2, Cl valency 1.)
    options:
    - CaCl₂
    - CaCl
    - Ca₂Cl
    - Ca₂Cl₂
    answer: CaCl₂
    difficulty: 1
    hints:
    - One calcium needs two chlorines.
    - Criss-cross 2 and 1.
    solution: Criss-crossing gives Ca₁Cl₂, written CaCl₂.
    mistakes:
      Ca₂Cl: criss_cross_valency
  - prompt: 'In water, hydrogen and oxygen are in the mass ratio 1 : 8. How many grams of oxygen combine with 3 g of hydrogen?'
    answer: '24'
    check: 3*8
    difficulty: 2
    hints:
    - Constant proportions.
    - 3 × 8.
    solution: Oxygen = 3 × 8 = 24 g.
    mistakes: {"8": "fixed_ratio", "11": "fixed_ratio"}
  - prompt: What is the formula of ammonium sulphate? (NH₄⁺ and SO₄²⁻.)
    options:
    - (NH₄)₂SO₄
    - NH₄SO₄
    - NH₄(SO₄)₂
    - (NH₄)₂(SO₄)₂
    answer: (NH₄)₂SO₄
    difficulty: 3
    hints:
    - Valencies 1 and 2.
    - Two ammonium ions, in brackets.
    solution: Criss-crossing gives (NH₄)₂(SO₄)₁ = (NH₄)₂SO₄.
    mistakes:
      NH₄(SO₄)₂: criss_cross_valency
  - prompt: Which law says a compound always has the same elements in the same proportion by mass?
    options:
    - Law of constant proportions
    - Law of conservation of mass
    - Dalton's law of gases
    - Law of inertia
    answer: Law of constant proportions
    difficulty: 1
    hints:
    - Proportion means ratio.
    - 'Water is always 1 : 8.'
    solution: That is the law of constant (definite) proportions.
    mistakes:
      Law of conservation of mass: conservation_of_mass
- code: cbse9ex.atoms.mass
  title: Molecular mass and the mole
  after:
  - cbse9ex.atoms.laws
  notes: |
    Atomic mass unit u = 1/12 of a carbon-12 atom's mass. Molecular mass is the sum of the atomic masses
    (H 1, C 12, N 14, O 16, Na 23, Cl 35.5, S 32, Ca 40). Formula unit mass for ionic compounds.
    One mole = 6.022 × 10²³ particles; molar mass in g equals molecular mass in u; moles = mass ÷ molar mass.
  explanations:
    text: 'Atoms are too light to weigh in grams, so we use atomic mass units: H is 1 u, C is 12 u, O is 16 u. Add up every atom in a molecule to get its molecular mass. CO₂ = 12 + 2 × 16 = 44 u. A mole of anything is 6.022 × 10²³ particles, and it weighs its molecular mass in grams: a mole of CO₂ is 44 g.'
    visual: 'Make a small table: element, how many atoms, mass of one, total. Multiply across each row, then add the last column. For H₂SO₄: H 2 × 1 = 2, S 1 × 32 = 32, O 4 × 16 = 64; total 98 u.'
    step_by_step: 'Step 1: List each element and count its atoms (watch brackets). Step 2: Multiply count by atomic mass. Step 3: Add them all for the molecular mass. Step 4: Moles = mass in grams ÷ molar mass.'
    real_world: 'A dozen always means 12, whether it''s eggs or bananas. A mole is the chemist''s dozen: always 6.022 × 10²³, whether it''s atoms or molecules.'
  picture:
    kind: flow
    steps:
    - H₂SO₄ has 2 H, 1 S and 4 O
    - 'H: 2 × 1 u = 2 u'
    - 'S: 1 × 32 u = 32 u'
    - 'O: 4 × 16 u = 64 u'
    - 'Add: 2 + 32 + 64 = 98 u'
    alt: 'Working out the molecular mass of H₂SO₄: hydrogen 2, sulphur 32, oxygen 64, total 98 u.'
  activity:
    type: formula
    prompt: Build a molecule from carbon (12 u), hydrogen (1 u) and oxygen (16 u) atoms and read its molecular mass.
    inputs:
    - name: c
      label: Carbon atoms
      min: 0
      max: 6
      step: 1
      start: 0
    - name: h
      label: Hydrogen atoms
      min: 0
      max: 12
      step: 1
      start: 0
    - name: o
      label: Oxygen atoms
      min: 0
      max: 6
      step: 1
      start: 0
    outputs:
    - name: mass
      label: Molecular mass
      expr: 12*c+h+16*o
      unit: u
    - name: mol
      label: Moles in 88 g
      expr: 88/max(12*c+h+16*o,1)
      places: 2
    goals:
    - prompt: Make carbon dioxide, CO₂, and check its mass is 44 u.
      want:
        mass: 44
        h: 0
      hint: The small 2 belongs to the atom just before it.
      mistakes:
      - when:
          c: 1
          o: 1
          h: 0
        say: That's CO, 28 u. The 2 in CO₂ means two oxygen atoms, each 16 u.
      - when:
          c: 2
          o: 1
          h: 0
        say: That's C₂O. The 2 in CO₂ is written after O, so it counts the oxygens.
    - prompt: 'Make water, H₂O: 18 u.'
      want:
        mass: 18
        c: 0
      mistakes:
      - when:
          h: 1
          o: 1
          c: 0
        say: 'OH is 17 u. Water has two hydrogens: H₂O.'
      - when:
          h: 2
          o: 2
          c: 0
        say: That's H₂O₂, hydrogen peroxide, 34 u. Water has one oxygen.
    - prompt: Make glucose, C₆H₁₂O₆, and read its mass.
      want:
        mass: 180
      mistakes:
      - when:
          c: 6
          h: 12
          o: 1
        say: 'Only one O: 100 u. The 6 after O means six oxygen atoms.'
      - when:
          c: 1
          h: 1
          o: 1
        say: 'That''s one of each, 29 u. Each small number counts its atoms: multiply, then add.'
  items:
  - prompt: Find the molecular mass of water, H₂O, in u. (H = 1, O = 16.)
    answer: '18'
    check: 2*1 + 16
    difficulty: 1
    hints:
    - Two hydrogens, one oxygen.
    - 2 + 16.
    solution: 2 × 1 + 16 = 18 u.
    mistakes:
      '17': molecular_mass_count_all
  - prompt: Find the molecular mass of CO₂ in u. (C = 12, O = 16.)
    answer: '44'
    check: 12 + 2*16
    difficulty: 1
    hints:
    - One carbon, two oxygens.
    - 12 + 32.
    solution: 12 + 2 × 16 = 44 u.
    mistakes:
      '28': molecular_mass_count_all
  - prompt: Find the formula unit mass of NaCl in u. (Na = 23, Cl = 35.5.)
    answer: '58.5'
    check: 23 + 35.5
    difficulty: 1
    hints:
    - One of each.
    - 23 + 35.5.
    solution: 23 + 35.5 = 58.5 u.
    mistakes: {"35.5": "formula_mass_add", "12.5": "formula_mass_add"}
  - prompt: Find the molecular mass of H₂SO₄ in u. (H = 1, S = 32, O = 16.)
    answer: '98'
    check: 2*1 + 32 + 4*16
    difficulty: 2
    hints:
    - 2 H, 1 S, 4 O.
    - 2 + 32 + 64.
    solution: 2 + 32 + 64 = 98 u.
    mistakes:
      '49': molecular_mass_count_all
  - prompt: How many moles are in 36 g of water? (Molar mass 18 g/mol.)
    answer: '2'
    check: 36/18
    difficulty: 2
    hints:
    - Moles = mass ÷ molar mass.
    - 36 ÷ 18.
    solution: 36 ÷ 18 = 2 mol.
    mistakes:
      '648': mole_avogadro
  - prompt: Find the formula unit mass of CaCO₃ in u. (Ca = 40, C = 12, O = 16.)
    answer: '100'
    check: 40 + 12 + 3*16
    difficulty: 2
    hints:
    - 1 Ca, 1 C, 3 O.
    - 40 + 12 + 48.
    solution: 40 + 12 + 48 = 100 u.
    mistakes:
      '68': molecular_mass_count_all
  - prompt: What is the mass of 0.5 mole of oxygen gas, O₂, in g? (O = 16.)
    answer: '16'
    check: 0.5*32
    difficulty: 3
    hints:
    - Molar mass of O₂ is 32 g.
    - 0.5 × 32.
    solution: 'Step 1: O₂ = 32 g/mol. Step 2: 0.5 × 32 = 16 g.'
    mistakes:
      '8': molecular_mass_count_all
- code: cbse9ex.atoms.compounds
  title: Ions, ionic and covalent compounds, and formulae
  after:
  - cbse9ex.atoms.laws
  notes: |
    Atoms combine to complete their outer shells. A metal atom can lose electrons to become a positive ion
    (cation, Na⁺, Mg²⁺); a non-metal can gain electrons to become a negative ion (anion, Cl⁻, O²⁻). Oppositely
    charged ions attract: ionic compounds (NaCl, MgO) are hard solids with high melting points that conduct
    electricity when melted or dissolved. Non-metal atoms can share electron pairs: covalent compounds (H₂O,
    CH₄, CO₂), often liquids or gases with low melting points that don't conduct. Polyatomic ions act as one
    unit (NH₄⁺, OH⁻, NO₃⁻, SO₄²⁻, CO₃²⁻). Formulae are written by balancing charges (criss-cross the valencies
    and simplify). Formula unit mass of an ionic compound = sum of the atomic masses in one formula unit.
  explanations:
    text: 'Sodium gives its one outer electron to chlorine: Na⁺ and Cl⁻ stick together as NaCl, an ionic compound. Two hydrogen atoms and an oxygen atom share electrons instead: H₂O is covalent. To write a formula, balance the charges: Mg²⁺ with two Cl⁻ makes MgCl₂.'
    visual: 'Write Al and O side by side with their valencies 3 and 2 above them. Draw crossing arrows: the 3 goes down to O and the 2 goes down to Al. You get Al₂O₃: two aluminium (6+) balance three oxygen (6−).'
    step_by_step: 'Step 1: Write the symbols, metal first. Step 2: Write each one''s valency (charge). Step 3: Criss-cross the numbers as subscripts. Step 4: Simplify if both share a factor (Mg₂O₂ → MgO). Step 5: Check the charges add to zero.'
    real_world: 'Table salt (ionic) has to be heated above 800 °C to melt, but candle wax (covalent) melts in your hand''s warmth near a flame: the type of bonding explains the difference.'
  picture:
    kind: compare
    columns:
    - title: Ionic
      points:
      - Electrons transferred
      - Metal + non-metal
      - NaCl, MgO
      - High melting point
      - Conducts when melted or dissolved
    - title: Covalent
      points:
      - Electrons shared
      - Non-metal + non-metal
      - H₂O, CH₄, CO₂
      - Low melting point
      - Usually does not conduct
    alt: Ionic compounds transfer electrons between a metal and a non-metal and have high melting points; covalent compounds share electrons between non-metals and have low melting points.
  activity:
    type: sort
    prompt: Ionic or covalent?
    bins:
    - Ionic
    - Covalent
    items:
    - label: Sodium chloride (NaCl)
      bin: Ionic
      clue: Is it a metal joined to a non-metal?
      why: 'Sodium gives an electron to chlorine: Na⁺ and Cl⁻ ions, an ionic compound.'
    - label: Water (H₂O)
      bin: Covalent
      clue: Are both elements non-metals?
      why: 'Hydrogen and oxygen share electron pairs: covalent.'
    - label: Magnesium oxide (MgO)
      bin: Ionic
      clue: Is magnesium a metal?
      why: 'Magnesium gives 2 electrons to oxygen: Mg²⁺ and O²⁻, ionic.'
    - label: Methane (CH₄)
      bin: Covalent
      clue: Do carbon and hydrogen give away electrons, or share them?
      why: 'Carbon shares electron pairs with four hydrogens: covalent.'
    - label: Carbon dioxide (CO₂)
      bin: Covalent
      clue: Is either element a metal?
      why: 'Two non-metals sharing electrons: covalent.'
    - label: Calcium chloride (CaCl₂)
      bin: Ionic
      clue: Is calcium a metal?
      why: 'Calcium gives one electron to each chlorine: ionic.'
    - label: Conducts electricity when melted
      bin: Ionic
      clue: What can move and carry charge in a melt?
      why: Melted ionic compounds have free ions that carry current.
    - label: Made by sharing pairs of electrons
      bin: Covalent
      clue: Sharing or giving away?
      why: Sharing electron pairs makes covalent bonds.
    - label: Hard crystal with a very high melting point
      bin: Ionic
      clue: Are strong attractions between charged ions needed for this?
      why: Strong forces between + and − ions make ionic solids hard, with high melting points.
    - label: Oxygen gas (O₂)
      bin: Covalent
      clue: Can one oxygen atom take electrons from an identical one?
      why: 'Two identical atoms share electrons: covalent.'
  items:
  - prompt: What is the formula of magnesium chloride (Mg²⁺ and Cl⁻)?
    options:
    - MgCl₂
    - MgCl
    - Mg₂Cl
    - Mg₂Cl₂
    answer: MgCl₂
    difficulty: 1
    hints:
    - Mg has charge 2+, Cl has 1−.
    - Two Cl⁻ balance one Mg²⁺.
    solution: 'Step 1: Mg²⁺ needs two Cl⁻ to balance. Step 2: MgCl₂.'
    mistakes:
      Mg₂Cl: formula_valency_cross
  - prompt: Which compound is covalent?
    options:
    - CH₄ (methane)
    - NaCl
    - MgO
    - CaCl₂
    answer: CH₄ (methane)
    difficulty: 1
    hints:
    - 'Covalent: only non-metals.'
    - Carbon and hydrogen are non-metals.
    solution: 'Step 1: C and H are both non-metals, sharing electrons. Step 2: The others are metal + non-metal: ionic.'
    mistakes:
      NaCl: ionic_covalent_swap
  - prompt: What is the formula of aluminium oxide (Al³⁺ and O²⁻)?
    options:
    - Al₂O₃
    - Al₃O₂
    - AlO
    - AlO₃
    answer: Al₂O₃
    difficulty: 2
    hints:
    - Criss-cross the valencies 3 and 2.
    - 2 × 3+ = 6+, 3 × 2− = 6−.
    solution: 'Step 1: Criss-cross: Al₂O₃. Step 2: Charges: 6+ and 6− balance.'
    mistakes:
      Al₃O₂: formula_valency_cross
  - prompt: What is the formula unit mass of NaCl? (Na = 23 u, Cl = 35.5 u) Give the number in u.
    answer: '58.5'
    check: 23 + 35.5
    difficulty: 2
    hints:
    - Add the atomic masses.
    - 23 + 35.5.
    solution: 'Step 1: 23 + 35.5 = 58.5 u.'
    mistakes: {"35.5": "formula_mass_add", "12.5": "formula_mass_add"}
  - prompt: Why does molten sodium chloride conduct electricity but solid sodium chloride does not?
    options:
    - In the melt the ions are free to move
    - Melting creates new electrons
    - Solid NaCl is covalent
    - Heat itself carries the current
    answer: In the melt the ions are free to move
    difficulty: 2
    hints:
    - Current needs moving charges.
    - In the solid, ions are locked in a lattice.
    solution: 'Step 1: In solid NaCl the ions are fixed in place. Step 2: When melted (or dissolved) they can move and carry current.'
    mistakes: {"Melting creates new electrons": "ions_must_move", "Heat itself carries the current": "ions_must_move"}
  - prompt: What is the formula of calcium hydroxide (Ca²⁺ and OH⁻)?
    options:
    - Ca(OH)₂
    - CaOH
    - CaOH₂
    - Ca₂OH
    answer: Ca(OH)₂
    difficulty: 3
    hints:
    - 'OH⁻ is a polyatomic ion: keep it together in brackets.'
    - Two OH⁻ balance one Ca²⁺.
    solution: 'Step 1: Ca²⁺ needs two OH⁻. Step 2: Bracket the polyatomic ion: Ca(OH)₂.'
    mistakes:
      CaOH₂: formula_valency_cross
