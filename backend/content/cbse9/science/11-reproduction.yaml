# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 11. Format: content/README.md.
subject: cbse9-sci
chapter: 11
title: 'Reproduction: How Life Continues'
tips:
  asexual_two_parents: Asexual reproduction needs only one parent and gives offspring identical to it; sexual needs two gametes.
  pollination_fertilisation_swap: Pollination is pollen reaching the stigma; fertilisation is the male gamete joining the egg in the ovule, afterwards.
  anther_pollen: "The stamen is the male part. Which part of it makes the pollen? The stigma only receives it."
  cycle_month: "The cycle is roughly one month long, though it varies from person to person."
  fertilisation_oviduct: "The egg leaves the ovary and travels down a tube towards the uterus. Where does it meet the sperm?"
  health_information: "Good health comes from care and correct information, not secrecy or avoiding doctors."
  menstruation_lining: "Each month the uterus lining thickens to receive a fertilised egg. What happens to it if no egg arrives?"
  ovary_fruit: "After fertilisation, the ovule becomes the seed. What does the ovary around it become?"
  placenta_exchange: "The baby can't eat or breathe in the uterus. Which organ links the baby to the mother's blood?"
  testis_sperm: "The ovary makes eggs. Which male organ makes sperm?"
  two_parent_mix: "Sexual reproduction joins gametes from two parents. What does that do to the mix of genes?"
  yeast_budding: "Yeast grows a small outgrowth that pinches off as a new cell. Fission splits into two equal halves instead."
  c9s11_ovule_inside: "The ovary is the outer case and the ovules sit inside it. The outer case swells into the part you eat. What does each small ovule inside turn into?"
  c9s11_first_step: "Gametes can't join until pollen has travelled from the anther to the carpel. Which step is that journey?"
  c9s11_method_match: 'Match the method to what you see: splitting into two equal halves (fission), a small outgrowth (budding), tiny spores, a piece that grows (fragmentation), or a new plant from a stem, root or leaf (vegetative).'
  c9s11_flower_part: 'Name the flower''s parts in order: sepals outside, petals, stamens (anther on a filament) and the carpel in the centre (stigma, style, ovary with ovules). Which part does this job?'
  c9s11_hormone_source: "Each organ that makes gametes also makes its own hormones. Is this organ male or female? Then think which hormones cause that body's changes in puberty."
concepts:
- code: cbse9ex.repro.asexual_plants
  title: Asexual reproduction and reproduction in flowering plants
  notes: |
    Reproduction makes new individuals of the same kind. Asexual reproduction uses one parent and gives
    offspring that are copies: binary fission (Amoeba, bacteria), budding (yeast, Hydra), spore formation
    (bread mould Rhizopus), fragmentation (Spirogyra), regeneration (Planaria) and vegetative propagation
    (potato eyes, Bryophyllum leaf buds, rose cuttings). Sexual reproduction joins male and female gametes and
    gives variation. In a flower, the stamen (anther, filament) makes pollen and the pistil (stigma, style,
    ovary with ovules) holds the eggs. Pollination carries pollen to a stigma (self or cross; by wind, insects,
    water, birds); fertilisation follows in the ovule; the ovule becomes the seed and the ovary the fruit;
    seeds are dispersed by wind, water, animals or bursting.
  explanations:
    text: 'Some living things copy themselves from one parent: yeast grows buds, a potato sprouts from its eyes. Flowering plants also reproduce sexually: pollen from the stamen reaches the stigma (pollination), a male cell joins the egg in the ovule (fertilisation), the ovule becomes a seed and the ovary swells into a fruit.'
    visual: 'Draw a flower cut in half: stamens around the edge with anthers full of pollen, the pistil in the middle with sticky stigma, a long style and an ovary at the base holding ovules. Draw a bee carrying pollen from one flower''s anther to another''s stigma.'
    step_by_step: 'Step 1: One parent, identical offspring → asexual (fission, budding, spores, fragmentation, vegetative). Step 2: Two gametes → sexual. Step 3: In flowers: pollination → fertilisation → seed and fruit → dispersal → germination.'
    real_world: Farmers grow sugarcane from stem pieces and bananas from suckers (vegetative propagation), so every plant has the same good qualities as the parent.
  picture:
    kind: flow
    steps:
    - Pollen made in the anther
    - 'Pollination: pollen lands on the stigma'
    - Pollen tube grows down the style
    - Fertilisation in the ovule
    - Ovule → seed, ovary → fruit
    - Seed dispersal and germination
    alt: The steps of sexual reproduction in a flowering plant, from pollen in the anther through pollination and fertilisation to seed, fruit and dispersal.
  activity:
    type: sort
    prompt: How does each one make new individuals from just one parent?
    bins:
    - Binary fission
    - Budding
    - Spore formation
    - Fragmentation
    - Vegetative propagation
    items:
    - label: Amoeba splits into two
      bin: Binary fission
      clue: Does it split into two equal halves?
      why: 'One cell splits into two equal cells: binary fission.'
    - label: Yeast grows a small bulge that breaks off
      bin: Budding
      clue: Is the new one smaller and grows out of the parent?
      why: 'A small outgrowth grows and breaks away: budding.'
    - label: Bread mould's black dots burst open
      bin: Spore formation
      clue: What are the black dots full of?
      why: 'The black dots are sporangia full of spores, which spread and grow: spore formation.'
    - label: A Spirogyra filament breaks into pieces that each grow
      bin: Fragmentation
      clue: Does each broken piece grow into a whole?
      why: 'Each fragment grows into a new filament: fragmentation.'
    - label: Potato eyes sprout new plants
      bin: Vegetative propagation
      clue: Is a part of the plant's body (not a seed) growing?
      why: 'The stem tuber grows new plants: vegetative propagation.'
    - label: Hydra grows a little Hydra on its side
      bin: Budding
      clue: Does a small copy grow out of the parent?
      why: 'A bud grows on the side and detaches: budding.'
    - label: Bryophyllum leaves grow buds on their edges
      bin: Vegetative propagation
      clue: Is a leaf, not a seed, making the new plant?
      why: 'Leaf buds grow into new plants: vegetative propagation.'
    - label: Bacteria divide into two
      bin: Binary fission
      clue: How many new cells, and of what size?
      why: 'One cell becomes two: binary fission.'
    - label: A rose grown from a cutting
      bin: Vegetative propagation
      clue: Is a stem piece being planted?
      why: 'A stem cutting grows roots: vegetative propagation.'
    - label: Planaria cut into pieces, each grows a whole body
      bin: Fragmentation
      clue: Does each piece grow into a full animal?
      why: Each piece regrows the missing parts (regeneration), like fragmentation.
  lesson:
    - teach: 'Living things make more of their own kind: reproduction. In asexual reproduction a single parent produces offspring that are copies of itself. Amoeba and bacteria split in two (binary fission); yeast and Hydra grow buds; bread mould spreads by spores; Spirogyra breaks into pieces (fragmentation); Planaria can regrow a whole body from a piece (regeneration).'
      check:
        prompt: Amoeba divides into two equal halves. What is this called?
        options:
        - Binary fission
        - Budding
        - Spore formation
        answer: Binary fission
        why: '''Binary'' means two: one cell splits into two.'
    - teach: 'Many plants reproduce from their stems, roots or leaves: vegetative propagation. Potato ''eyes'' sprout, Bryophyllum grows plantlets on its leaf edges, rose and sugarcane grow from cuttings. The new plants are exact copies, and farmers get them faster than from seeds.'
      check:
        prompt: A rose plant is grown from a piece of stem. What is this?
        options:
        - Vegetative propagation
        - Pollination
        - Fertilisation
        answer: Vegetative propagation
        why: A stem cutting grows into a new plant, no seeds needed.
    - teach: 'Flowering plants also reproduce sexually. The stamen (male) has an anther that makes pollen. The carpel (female) has a stigma, a style and an ovary with ovules. Pollination: pollen reaches the stigma (by wind, insects, water). A pollen tube grows down to the ovule, and the male gamete fuses with the egg: fertilisation. The ovule becomes the seed and the ovary becomes the fruit.'
      picture:
        kind: flow
        steps:
        - Anther makes pollen
        - 'Pollination: pollen lands on stigma'
        - Pollen tube grows to ovule
        - 'Fertilisation: gametes fuse'
        - Ovule → seed, ovary → fruit
        alt: The steps from pollen to fruit in a flowering plant.
      check:
        prompt: Which part of the flower receives pollen?
        options:
        - Stigma
        - Anther
        - Petal
        answer: Stigma
        why: The sticky stigma at the top of the carpel catches pollen.
  items:
  - prompt: How does yeast usually reproduce?
    options:
    - Budding
    - Binary fission
    - Spore formation
    - Pollination
    answer: Budding
    difficulty: 1
    hints:
    - A small outgrowth appears on the cell.
    - Hydra does this too.
    solution: 'Step 1: Yeast grows a bud that breaks off. Step 2: That is budding.'
    mistakes: {"Binary fission": "yeast_budding", "Pollination": "yeast_budding"}
  - prompt: Which part of a flower makes pollen?
    options:
    - Anther
    - Stigma
    - Ovary
    - Sepal
    answer: Anther
    difficulty: 1
    hints:
    - It's part of the stamen.
    - At the top of the filament.
    solution: 'Step 1: The stamen is the male part. Step 2: Its anther makes pollen.'
    mistakes: {"Stigma": "anther_pollen", "Ovary": "anther_pollen"}
  - prompt: A potato grows new plants from its 'eyes'. What type of reproduction is this?
    options:
    - Vegetative propagation
    - Sexual reproduction
    - Binary fission
    - Pollination
    answer: Vegetative propagation
    difficulty: 1
    hints:
    - A part of the plant other than the seed.
    - One parent.
    solution: 'Step 1: New plants grow from buds on the tuber. Step 2: That is vegetative propagation, a kind of asexual reproduction.'
    mistakes:
      Sexual reproduction: asexual_two_parents
  - prompt: What happens just after pollination?
    options:
    - A pollen tube grows to the ovule and fertilisation takes place
    - The seed is dispersed
    - The petals make pollen
    - The fruit falls
    answer: A pollen tube grows to the ovule and fertilisation takes place
    difficulty: 2
    hints:
    - Pollen is on the stigma.
    - The male cell must reach the egg.
    solution: 'Step 1: The pollen grain grows a tube down the style. Step 2: The male gamete reaches the ovule and fuses with the egg: fertilisation.'
    mistakes:
      The seed is dispersed: pollination_fertilisation_swap
  - prompt: After fertilisation, what does the ovary become?
    options:
    - The fruit
    - The seed
    - The petal
    - The pollen
    answer: The fruit
    difficulty: 2
    hints:
    - The ovule becomes the seed.
    - It swells around the seeds.
    solution: 'Step 1: Ovule → seed. Step 2: Ovary → fruit.'
    mistakes: {"The seed": "ovary_fruit", "The petal": "ovary_fruit"}
  - prompt: Why do sexually produced offspring show more variation than asexual ones?
    options:
    - They get a mix of genes from two parents
    - They are bigger
    - They are made faster
    - Their cells divide by mitosis only
    answer: They get a mix of genes from two parents
    difficulty: 3
    hints:
    - Asexual offspring are copies of one parent.
    - Two gametes join.
    solution: 'Step 1: Each gamete carries a different set of genes. Step 2: Combining them gives new mixes, so offspring differ.'
    mistakes: {"They are bigger": "two_parent_mix", "Their cells divide by mitosis only": "two_parent_mix"}
  - prompt: How does bread mould (Rhizopus) reproduce?
    options:
    - By spores
    - By budding
    - By binary fission
    - By seeds
    answer: By spores
    difficulty: 1
    hints:
    - Look for tiny black dots on old bread.
    - They float in the air.
    solution: Rhizopus makes spores in tiny round cases; they spread and grow into new mould.
    mistakes:
      By budding: c9s11_method_match
  - prompt: Which is the male part of a flower?
    options:
    - Stamen
    - Carpel
    - Sepal
    - Ovary
    answer: Stamen
    difficulty: 1
    hints:
    - It has an anther on a stalk.
    - It makes pollen.
    solution: The stamen (anther and filament) is the male part.
    mistakes:
      Carpel: c9s11_flower_part
      Ovary: c9s11_flower_part
  - prompt: Bryophyllum grows new plants from…
    options:
    - Buds on the edges of its leaves
    - Seeds only
    - Spores
    - Its flowers
    answer: Buds on the edges of its leaves
    difficulty: 1
    hints:
    - It is a vegetative method.
    - Look at the leaf margins.
    solution: Bryophyllum leaves have buds in their notches that grow into new plants.
    mistakes:
      Spores: c9s11_method_match
  - prompt: How many parents does asexual reproduction need?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - '''A-sexual'' means without sex.'
    - No joining of gametes.
    solution: Only one parent; the offspring are copies of it.
    mistakes:
      '2': asexual_two_parents
  - prompt: Hydra grows a small outgrowth that becomes a new Hydra. What is this?
    options:
    - Budding
    - Fragmentation
    - Binary fission
    - Pollination
    answer: Budding
    difficulty: 2
    hints:
    - A small bump grows on the body.
    - Yeast does the same.
    solution: 'Hydra reproduces by budding: a bud grows and then separates.'
    mistakes:
      Binary fission: yeast_budding
  - prompt: What does an ovule become after fertilisation?
    options:
    - The seed
    - The fruit
    - The petal
    - The pollen
    answer: The seed
    difficulty: 2
    hints:
    - The ovary becomes the fruit.
    - What does the ovule inside it become?
    solution: The ovule becomes the seed; the ovary around it becomes the fruit.
    mistakes:
      The fruit: c9s11_ovule_inside
  - prompt: Which comes first in a flowering plant?
    options:
    - Pollination
    - Fertilisation
    - Seed formation
    - Fruit formation
    answer: Pollination
    difficulty: 2
    hints:
    - Pollen must arrive before anything can join.
    - Fertilisation needs the pollen tube.
    solution: Pollination (pollen on stigma) comes first, then the pollen tube, then fertilisation.
    mistakes:
      Fertilisation: c9s11_first_step
  - prompt: Why do farmers grow sugarcane and potatoes by vegetative propagation?
    options:
    - New plants are quicker to grow and identical to good parents
    - These plants have no roots
    - It makes more variation
    - Seeds are illegal
    answer: New plants are quicker to grow and identical to good parents
    difficulty: 3
    hints:
    - Asexual offspring are copies.
    - Good qualities are kept.
    solution: Vegetative propagation is faster and keeps the parent's useful qualities exactly.
    mistakes:
      It makes more variation: two_parent_mix
  - prompt: A Planaria is cut into three pieces, and each grows into a whole worm. What is this?
    options:
    - Regeneration
    - Budding
    - Spore formation
    - Pollination
    answer: Regeneration
    difficulty: 3
    hints:
    - Each piece rebuilds the missing parts.
    - Lizards can regrow tails a little this way.
    solution: 'Planaria regenerates: each piece regrows a complete body.'
    mistakes:
      Budding: c9s11_method_match
- code: cbse9ex.repro.human
  title: Human reproduction and reproductive health
  after:
  - cbse9ex.repro.asexual_plants
  notes: |
    Humans reproduce sexually. The male reproductive system (testes make sperm and the hormone testosterone;
    sperm duct; penis) and female system (ovaries release an egg about once a month and make oestrogen and
    progesterone; oviducts; uterus) make gametes. Fertilisation takes place in the oviduct; the zygote divides
    to form an embryo that implants in the uterus wall; the placenta passes food and oxygen from mother to
    baby; a baby is born after about nine months. If there is no fertilisation, the uterus lining breaks down:
    menstruation, roughly every 28 days. Puberty (about 10 to 14 years) brings body changes caused by
    hormones. Reproductive health includes hygiene, nutrition, avoiding early marriage and pregnancy, and
    protection from infections; contraception lets couples plan families.
  explanations:
    text: 'At puberty, hormones make the body ready to reproduce. The ovaries release an egg each month and the testes make sperm. If a sperm meets the egg in the oviduct, the fertilised egg grows into an embryo in the uterus, fed through the placenta, for about nine months. If not, the uterus lining is shed: that is a period.'
    visual: 'Draw a simple timeline of about 28 days: lining builds up in the uterus, an egg is released around the middle, and if it isn''t fertilised the lining is shed at the start of the next cycle.'
    step_by_step: 'Step 1: Gametes: sperm from testes, egg from ovary. Step 2: Fertilisation in the oviduct makes a zygote. Step 3: Implantation in the uterus wall. Step 4: Placenta feeds the growing baby. Step 5: Birth after about nine months.'
    real_world: School health programmes teach that puberty changes are normal and happen at different ages for different people, and that clean pads, good food and rest matter during periods.
  picture:
    kind: flow
    steps:
    - Egg released from ovary
    - Sperm meets egg in oviduct
    - 'Zygote divides: embryo'
    - Embryo implants in uterus
    - Placenta feeds the baby
    - Birth after ~9 months
    alt: The steps from release of an egg through fertilisation, implantation and growth with the placenta to birth after about nine months.
  activity:
    type: order
    prompt: Put the stages from egg to birth in order.
    steps:
    - An ovary releases an egg
    - 'A sperm joins the egg in the oviduct: fertilisation'
    - The zygote divides again and again into an embryo
    - The embryo implants in the wall of the uterus
    - The placenta passes food and oxygen to the baby
    - After about nine months, the baby is born
    reasons:
      'A sperm joins the egg in the oviduct: fertilisation': There must be an egg in the oviduct before a sperm can fertilise it.
      The zygote divides again and again into an embryo: The zygote only forms at fertilisation.
      The embryo implants in the wall of the uterus: The zygote divides into an embryo as it travels down; only then can it implant.
      The placenta passes food and oxygen to the baby: The placenta forms only after the embryo has implanted in the uterus wall.
      After about nine months, the baby is born: The baby needs months of food and oxygen through the placenta before birth.
  lesson:
    - teach: Humans reproduce sexually. In males, the testes make sperm and the hormone testosterone; sperm travel through the sperm duct. In females, the ovaries release one egg about once a month and make the hormones oestrogen and progesterone; the egg travels down the oviduct towards the uterus.
      check:
        prompt: Which organ releases an egg?
        options:
        - Ovary
        - Uterus
        - Testis
        answer: Ovary
        why: The ovaries make and release eggs.
    - teach: 'If a sperm meets the egg in the oviduct, they fuse: fertilisation. The zygote divides into an embryo, which settles in the thick wall of the uterus. The placenta connects the baby to the mother: food and oxygen pass in, wastes pass out. After about 9 months the baby is born.'
      picture:
        kind: flow
        steps:
        - Egg released from ovary
        - Fertilisation in oviduct
        - Zygote divides into embryo
        - Embryo implants in uterus
        - Placenta feeds and supports baby
        - Birth after about 9 months
        alt: The journey from egg release to birth, with fertilisation in the oviduct and growth in the uterus.
      check:
        prompt: How does a baby in the uterus get oxygen?
        options:
        - Through the placenta from the mother's blood
        - By breathing air
        - From the amniotic fluid
        answer: Through the placenta from the mother's blood
        why: The placenta passes oxygen and food from mother to baby.
    - teach: Each month the uterus lining thickens to be ready for an embryo. If no fertilisation happens, the lining breaks down and leaves the body as menstrual flow, about every 28 days. This is natural and healthy. Good reproductive health means hygiene, good food, rest and asking a trusted adult or doctor for correct information.
      check:
        prompt: Where can a teenager get correct information about body changes?
        options:
        - A parent, teacher or doctor
        - Rumours from friends
        - Keeping it secret
        answer: A parent, teacher or doctor
        why: Trusted adults and doctors give correct, safe information.
  items:
  - prompt: Where does fertilisation usually take place in humans?
    options:
    - In the oviduct
    - In the uterus
    - In the ovary
    - In the vagina
    answer: In the oviduct
    difficulty: 1
    hints:
    - The egg travels from the ovary.
    - The tube between ovary and uterus.
    solution: 'Step 1: The egg moves into the oviduct. Step 2: Sperm meet it there.'
    mistakes: {"In the uterus": "fertilisation_oviduct", "In the ovary": "fertilisation_oviduct"}
  - prompt: Which organ makes sperm?
    options:
    - Testis
    - Ovary
    - Uterus
    - Kidney
    answer: Testis
    difficulty: 1
    hints:
    - Male reproductive organ.
    - It also makes testosterone.
    solution: 'Step 1: The testes make sperm and testosterone.'
    mistakes: {"Ovary": "testis_sperm", "Kidney": "testis_sperm"}
  - prompt: What does the placenta do?
    options:
    - Passes food and oxygen from mother to baby and removes wastes
    - Makes eggs
    - Makes sperm
    - Pumps blood for the mother
    answer: Passes food and oxygen from mother to baby and removes wastes
    difficulty: 2
    hints:
    - It links the embryo to the uterus wall.
    - Exchange of materials.
    solution: 'Step 1: The placenta connects the baby to the mother''s blood supply. Step 2: Food and oxygen pass in; wastes pass out.'
    mistakes: {"Makes eggs": "placenta_exchange", "Pumps blood for the mother": "placenta_exchange"}
  - prompt: Why does menstruation happen?
    options:
    - The egg was not fertilised, so the thickened uterus lining is shed
    - The baby is born
    - The ovary is removed
    - Sperm are released
    answer: The egg was not fertilised, so the thickened uterus lining is shed
    difficulty: 2
    hints:
    - The lining prepares for an embryo.
    - No embryo arrives.
    solution: 'Step 1: Each month the uterus lining thickens. Step 2: If no fertilised egg implants, the lining breaks down and leaves the body.'
    mistakes: {"The baby is born": "menstruation_lining", "Sperm are released": "menstruation_lining"}
  - prompt: About how long is one menstrual cycle, in days?
    answer: '28'
    check: '28'
    difficulty: 2
    hints:
    - Roughly a month.
    - Four weeks.
    solution: 'Step 1: On average about 28 days, though it varies from person to person.'
    mistakes: {"7": "cycle_month", "365": "cycle_month"}
  - prompt: Which is part of good reproductive health?
    options:
    - Personal hygiene, good nutrition and correct information
    - Avoiding all doctors
    - Keeping body changes secret from everyone
    - Marrying as early as possible
    answer: Personal hygiene, good nutrition and correct information
    difficulty: 3
    hints:
    - Health, hygiene and knowledge.
    - Early marriage is harmful.
    solution: 'Step 1: Hygiene, nutrition and correct information protect health. Step 2: Early marriage and pregnancy put young people''s health at risk.'
    mistakes: {"Avoiding all doctors": "health_information", "Keeping body changes secret from everyone": "health_information"}
  - prompt: Which hormone do the testes make?
    options:
    - Testosterone
    - Oestrogen
    - Progesterone
    - Insulin
    answer: Testosterone
    difficulty: 1
    hints:
    - It is the male hormone.
    - Oestrogen comes from the ovaries.
    solution: The testes make testosterone, which causes male body changes.
    mistakes:
      Oestrogen: c9s11_hormone_source
  - prompt: Where does the baby grow during pregnancy?
    options:
    - In the uterus
    - In the ovary
    - In the oviduct
    - In the stomach
    answer: In the uterus
    difficulty: 1
    hints:
    - Also called the womb.
    - The embryo implants in its wall.
    solution: The embryo implants and grows in the uterus.
    mistakes:
      In the oviduct: fertilisation_oviduct
  - prompt: About how often do the ovaries release an egg?
    options:
    - About once a month
    - Every day
    - Once a year
    - Once a week
    answer: About once a month
    difficulty: 1
    hints:
    - It is linked to the menstrual cycle.
    - Around 28 days.
    solution: Usually one egg is released about every 28 days.
    mistakes:
      Every day: cycle_month
  - prompt: What is a zygote?
    options:
    - The cell formed when sperm and egg fuse
    - An unfertilised egg
    - A sperm cell
    - The placenta
    answer: The cell formed when sperm and egg fuse
    difficulty: 2
    hints:
    - It forms at fertilisation.
    - It then divides into an embryo.
    solution: The fertilised egg is called a zygote; it divides to form the embryo.
    mistakes:
      An unfertilised egg: fertilisation_oviduct
  - prompt: What carries sperm from the testes?
    options:
    - The sperm duct
    - The oviduct
    - The placenta
    - The uterus
    answer: The sperm duct
    difficulty: 2
    hints:
    - It is part of the male system.
    - The oviduct is female.
    solution: The sperm duct carries sperm from the testes.
    mistakes:
      The oviduct: testis_sperm
  - prompt: Which hormones do the ovaries make?
    options:
    - Oestrogen and progesterone
    - Testosterone only
    - Insulin and adrenaline
    - Thyroxine
    answer: Oestrogen and progesterone
    difficulty: 2
    hints:
    - These control the menstrual cycle.
    - Testosterone is made in the testes.
    solution: The ovaries make oestrogen and progesterone.
    mistakes:
      Testosterone only: c9s11_hormone_source
  - prompt: What leaves the body during menstruation?
    options:
    - The broken-down uterus lining and blood
    - The baby
    - Sperm
    - The placenta
    answer: The broken-down uterus lining and blood
    difficulty: 2
    hints:
    - The lining thickened for an embryo.
    - No embryo came.
    solution: When the egg isn't fertilised, the thick uterus lining breaks down and leaves with some blood.
    mistakes:
      The placenta: menstruation_lining
  - prompt: Which removes the baby's carbon dioxide and wastes before birth?
    options:
    - The placenta, into the mother's blood
    - The baby's lungs
    - The baby's kidneys only
    - The amniotic fluid
    answer: The placenta, into the mother's blood
    difficulty: 3
    hints:
    - The baby's lungs don't work in the uterus.
    - The same organ brings food and oxygen.
    solution: Wastes pass from the baby's blood through the placenta to the mother's blood, and her body removes them.
    mistakes:
      The baby's lungs: placenta_exchange
  - prompt: Why is good food especially important for teenagers?
    options:
    - Bodies grow fast and change during puberty
    - Teenagers don't need to sleep
    - It prevents all illness forever
    - It stops menstruation
    answer: Bodies grow fast and change during puberty
    difficulty: 3
    hints:
    - Puberty brings a growth spurt.
    - Growth needs protein, iron and calcium.
    solution: Rapid growth in puberty needs a balanced diet with protein, iron and calcium.
    mistakes:
      It prevents all illness forever: health_information
