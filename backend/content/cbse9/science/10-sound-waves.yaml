# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 10. Format: content/README.md.
subject: cbse9-sci
chapter: 10
title: 'Sound Waves: Characteristics and Applications'
tips:
  echo_round_trip: An echo travels to the wall AND back. Distance to the wall = speed × time ÷ 2.
  frequency_period: 'Frequency and time period are reciprocals: f = 1/T. A period of 0.01 s means 100 Hz.'
  pitch_frequency: "Pitch is how high or low a note sounds: it depends on how many vibrations per second. How big each vibration is decides loudness instead."
  reverberation_control: "Echoes bouncing around a hall make sound muddy. What do curved ceilings and soft boards do to those reflections?"
  wavelength_divide: "Wavelength = speed ÷ frequency."
  c9s10_sound_source: "Light and sound are different things. Hum with a hand on your throat: what do you feel moving?"
  c9s10_light_faster: "Lightning and thunder happen at the same moment. Compare how fast light and sound travel to you."
  c9s10_medium_speed: "Air doesn't block sound; it just carries it slowly. In which kind of medium are the particles packed closest, passing the push along fastest?"
  c9s10_upper_limit: "That is the top of the human hearing range, where ultrasound begins. The question asks for the bottom, where infrasound begins."
  c9s10_hearing_range: "Humans hear from about 20 Hz to 20,000 Hz. 'Infra' means below that range and 'ultra' means above it. Where does this sound sit?"
  c9s10_loudness_amplitude: How high or low a sound is (pitch) depends on how fast it vibrates. How loud it is depends on how big the vibrations are. Which one is the question about?
concepts:
- code: cbse9ex.sound.waves
  title: Sound as a wave
  notes: |
    Sound is produced by vibrating objects and needs a medium (cannot travel in vacuum). It travels as a
    longitudinal wave of compressions and rarefactions. Wavelength λ (m), frequency ν (Hz), time period
    T = 1/ν, amplitude. Speed v = νλ. Speed of sound is greatest in solids, then liquids, then gases
    (about 340 m/s in air at room temperature). Pitch depends on frequency; loudness on amplitude.
  explanations:
    text: Sound is made when something vibrates, like a guitar string or your vocal cords. The vibration pushes air particles together (compressions) and pulls them apart (rarefactions), and this pattern travels to your ear. The speed of sound = frequency × wavelength. A high-pitched sound has a high frequency; a loud sound has a big amplitude.
    visual: 'Stretch a slinky along the floor and push one end in and out. You''ll see bunched-up coils (compressions) and spread-out coils (rarefactions) travel along it. The coils themselves only move back and forth: that''s a longitudinal wave.'
    step_by_step: 'Step 1: v = ν × λ. Step 2: Rearrange: ν = v ÷ λ, λ = v ÷ ν. Step 3: Time period T = 1 ÷ ν. Step 4: High frequency means high pitch; large amplitude means loud.'
    real_world: You see lightning before you hear thunder because light is far faster than sound. Count the seconds between them and multiply by about 340 to find how far away the storm is in metres.
  picture:
    kind: compare
    columns:
    - title: Compression
      points:
      - Particles crowded together
      - Higher pressure
    - title: Rarefaction
      points:
      - Particles spread apart
      - Lower pressure
    alt: A sound wave is a row of compressions, where particles crowd together at high pressure, and rarefactions, where they spread apart.
  activity:
    type: formula
    prompt: Speed of sound = frequency × wavelength. Change the frequency and the wavelength.
    inputs:
    - name: f
      label: Frequency
      min: 100
      max: 2000
      step: 10
      start: 100
      unit: Hz
    - name: lam
      label: Wavelength
      min: 0.1
      max: 4
      step: 0.1
      start: 0.1
      unit: m
    outputs:
    - name: v
      label: Speed
      expr: f*lam
      unit: m/s
      places: 1
    - name: t
      label: Time period = 1 ÷ frequency
      expr: 1000/f
      unit: ms
      places: 2
    goals:
    - prompt: In air (340 m/s), a sound has a wavelength of 0.5 m. Find its frequency.
      want:
        lam: 0.5
        v: 340
      hint: v = frequency × λ, so frequency = v ÷ λ.
      mistakes:
      - when:
          lam: 0.5
          f: 170
        say: '170 Hz × 0.5 m = 85 m/s: that''s 340 × 0.5. Frequency is v ÷ λ: a short wave needs a high frequency.'
      - when:
          lam: 0.5
          f: 340
        say: 340 Hz × 0.5 m = 170 m/s. The speed is 340; each wave is only half a metre, so more fit in each second.
    - prompt: 'A higher note in air: 1700 Hz. Make the wavelength fit 340 m/s.'
      want:
        f: 1700
        v: 340
      mistakes:
      - when:
          lam:
          - 1
          - 4
        say: A higher frequency squeezes more waves into each second, so each wave is shorter, not longer.
      - when:
          lam: 0.5
        say: 0.5 m was the 680 Hz note. This note is higher, so its waves are shorter.
    - prompt: In water sound travels at 1500 m/s. Find the wavelength of a 500 Hz sound.
      want:
        f: 500
        v: 1500
      mistakes:
      - when:
          lam: 0.7
        say: About 0.7 m is the wavelength in air. Water carries sound about 4 times faster, so the waves are longer.
      - when:
          lam:
          - 0.1
          - 0.4
        say: Shorter waves would mean slower sound. Water is faster than air.
  lesson:
    - teach: 'Every sound comes from something vibrating: a guitar string, your vocal cords, a drum skin. The vibration pushes on the air next to it, which pushes the next layer, and so on. Sound needs a medium (solid, liquid or gas), so it can''t travel through a vacuum: in space no one can hear you shout.'
      check:
        prompt: Why can't astronauts on the Moon talk without radios?
        options:
        - There is no air to carry sound
        - It is too cold
        - Their voices are too soft
        answer: There is no air to carry sound
        why: Sound needs a medium; the Moon has almost no atmosphere.
    - teach: 'Sound travels as a longitudinal wave: the air particles move back and forth along the direction the wave travels, making compressions (crowded) and rarefactions (spread out). One compression plus one rarefaction is one wavelength, λ.'
      picture:
        kind: flow
        steps:
        - 'Prong moves out: compression (high pressure)'
        - 'Prong moves back: rarefaction (low pressure)'
        - Particles pass the push along
        - Pattern travels; particles only jiggle
        alt: A vibrating tuning fork making compressions and rarefactions that travel through the air.
      check:
        prompt: In a sound wave, a region where air is crowded together is a…
        options:
        - Compression
        - Rarefaction
        - Vacuum
        answer: Compression
        why: 'Crowded particles mean high pressure: a compression.'
    - teach: Frequency ν is the number of vibrations per second (hertz, Hz); time period T = 1/ν. Speed v = ν × λ. Sound is about 340 m/s in air, faster in water (~1500 m/s) and fastest in solids like steel (~5000 m/s). Higher frequency means higher pitch; bigger amplitude means louder.
      check:
        prompt: A 680 Hz sound in air (340 m/s). What is its wavelength?
        options:
        - 0.5 m
        - 2 m
        - 1020 m
        answer: 0.5 m
        why: λ = v ÷ ν = 340 ÷ 680 = 0.5.
  items:
  - prompt: A sound wave has frequency 500 Hz and wavelength 0.68 m. Find its speed in m/s.
    answer: '340'
    check: 500*0.68
    difficulty: 1
    hints:
    - v = νλ.
    - 500 × 0.68.
    solution: v = 500 × 0.68 = 340 m/s.
    mistakes:
      '735.29': wave_equation
  - prompt: Sound cannot travel through…
    options:
    - Vacuum
    - Water
    - Steel
    - Air
    answer: Vacuum
    difficulty: 1
    hints:
    - Sound needs particles to pass the vibration on.
    - Space is silent.
    solution: Sound needs a medium, so it can't travel through a vacuum.
    mistakes:
      Steel: sound_needs_medium
  - prompt: A wave has a time period of 0.02 s. What is its frequency in Hz?
    answer: '50'
    check: 1/0.02
    difficulty: 1
    hints:
    - ν = 1 ÷ T.
    - 1 ÷ 0.02.
    solution: ν = 1 ÷ 0.02 = 50 Hz.
    mistakes:
      '0.02': frequency_period
  - prompt: In which medium does sound travel fastest?
    options:
    - Steel
    - Water
    - Air
    - Vacuum
    answer: Steel
    difficulty: 2
    hints:
    - Solids have closely packed particles.
    - Solid > liquid > gas.
    solution: Sound travels fastest in solids such as steel.
    mistakes:
      Air: speed_in_media
  - prompt: Sound travels at 340 m/s in air. Find the wavelength of a 170 Hz sound, in m.
    answer: '2'
    check: 340/170
    difficulty: 2
    hints:
    - λ = v ÷ ν.
    - 340 ÷ 170.
    solution: λ = 340 ÷ 170 = 2 m.
    mistakes: {"57800": "wavelength_divide", "0.5": "wave_equation"}
  - prompt: Which property of a sound decides its pitch?
    options:
    - Frequency
    - Amplitude
    - Speed
    - Medium
    answer: Frequency
    difficulty: 2
    hints:
    - A whistle vs a drum.
    - Vibrations per second.
    solution: Pitch depends on frequency.
    mistakes:
      Amplitude: pitch_frequency
  - prompt: Thunder is heard 3 s after lightning is seen. If sound travels at 340 m/s, how far away is the lightning, in m?
    answer: '1020'
    check: 340*3
    difficulty: 3
    hints:
    - Light arrives almost instantly.
    - Distance = speed × time.
    solution: Distance = 340 × 3 = 1020 m.
    mistakes:
      '510': echo_round_trip
  - prompt: What makes a sound?
    options:
    - A vibrating object
    - Light
    - Heat only
    - A magnet
    answer: A vibrating object
    difficulty: 1
    hints:
    - Touch your throat while humming.
    - Something moves back and forth.
    solution: All sounds are produced by vibrating objects.
    mistakes:
      Light: c9s10_sound_source
  - prompt: A sound has frequency 250 Hz. What is its time period, in s?
    answer: '0.004'
    check: 1/250
    difficulty: 1
    hints:
    - T = 1/ν.
    - 1 ÷ 250.
    solution: T = 1 ÷ 250 = 0.004 s.
    mistakes:
      '250': frequency_period
  - prompt: Which change makes a sound louder?
    options:
    - Bigger amplitude
    - Higher frequency
    - Shorter wavelength
    - Lower speed
    answer: Bigger amplitude
    difficulty: 1
    hints:
    - Loudness is about how hard it vibrates.
    - Pitch is about how fast.
    solution: Loudness depends on amplitude, the size of the vibrations.
    mistakes:
      Higher frequency: c9s10_loudness_amplitude
  - prompt: A sound wave of wavelength 1.5 m travels at 330 m/s. What is its frequency, in Hz?
    answer: '220'
    check: 330/1.5
    difficulty: 2
    hints:
    - ν = v ÷ λ.
    - 330 ÷ 1.5.
    solution: 330 ÷ 1.5 = 220 Hz.
    mistakes:
      '495': wavelength_divide
  - prompt: A woman's voice usually has a higher pitch than a man's. This means it has a higher…
    options:
    - Frequency
    - Amplitude
    - Speed
    - Wavelength
    answer: Frequency
    difficulty: 2
    hints:
    - Pitch depends on how fast the vocal cords vibrate.
    - Not on loudness.
    solution: Higher pitch means higher frequency.
    mistakes:
      Amplitude: pitch_frequency
  - prompt: Why do we see lightning before we hear thunder?
    options:
    - Light travels much faster than sound
    - Thunder happens later
    - Sound is blocked by clouds
    - Light is louder
    answer: Light travels much faster than sound
    difficulty: 2
    hints:
    - Both start at the same time.
    - Compare their speeds.
    solution: Light is about 3 × 10⁸ m/s and sound only about 340 m/s, so the light arrives first.
    mistakes:
      Thunder happens later: c9s10_light_faster
  - prompt: Put your ear to a long iron railing while a friend taps the far end. Why do you hear the tap first through the rail?
    options:
    - Sound travels faster in solids than in air
    - Iron makes the sound louder only
    - Air blocks sound
    - The tap is closer
    answer: Sound travels faster in solids than in air
    difficulty: 2
    hints:
    - Compare speeds in steel and air.
    - About 5000 m/s vs 340 m/s.
    solution: Sound travels about 15 times faster in iron than in air, so it arrives first.
    mistakes:
      Air blocks sound: c9s10_medium_speed
  - prompt: In a sound wave, the distance between two neighbouring compressions is 0.4 m and the frequency is 850 Hz. Find the speed, in m/s.
    answer: '340'
    check: 850*0.4
    difficulty: 3
    hints:
    - Compression to compression is one wavelength.
    - v = νλ.
    solution: v = 850 × 0.4 = 340 m/s.
    mistakes:
      '2125': wavelength_divide
      '0.47': wavelength_divide
- code: cbse9ex.sound.echo
  title: Echo, range of hearing and ultrasound
  after:
  - cbse9ex.sound.waves
  notes: |
    Reflection of sound; an echo is heard if the reflecting surface is at least about 17.2 m away in air
    (sound returns after 0.1 s or more). Reverberation is repeated reflection; reduced by soft
    absorbing materials. Audible range for humans 20 Hz–20 kHz; below is infrasound, above is
    ultrasound. Ultrasound uses: cleaning, detecting cracks, ultrasonography, SONAR (distance = v × t/2).
  explanations:
    text: An echo is sound bouncing back from a surface. Because the sound goes there and back, the distance to the wall is speed × time ÷ 2. Humans hear from 20 Hz to 20,000 Hz. Sounds above that are ultrasound; bats and dolphins use it, and so do doctors and ships.
    visual: Draw a person, a cliff, and an arrow going to the cliff and another coming back. The total path is twice the distance to the cliff, so halve it.
    step_by_step: 'Step 1: Multiply speed by the echo time to get the total path. Step 2: Divide by 2 for the one-way distance. Step 3: For hearing, check if the frequency is below 20 Hz (infrasound), 20–20,000 Hz (audible), or above (ultrasound).'
    real_world: 'Fishing boats use SONAR: they send ultrasound down and time the echo from the sea bed or a school of fish. Doctors use ultrasound scans to see a baby in the womb safely.'
  picture:
    kind: flow
    steps:
    - 'Clap: the sound travels to the cliff'
    - It bounces back to you
    - You hear the echo 2 s later
    - Sound went 340 m/s × 2 s = 680 m in all
    - The cliff is 680 ÷ 2 = 340 m away
    alt: 'An echo from a cliff heard after 2 seconds: sound travels 680 m there and back, so the cliff is 340 m away.'
  activity:
    type: formula
    prompt: You clap in front of a wall. Move the wall and see how long the echo takes to come back.
    inputs:
    - name: d
      label: Distance to the wall
      min: 0
      max: 3000
      step: 5
      start: 0
      unit: m
    outputs:
    - name: ta
      label: Echo time in air (340 m/s)
      expr: 2*d/340
      unit: s
      places: 3
    - name: tw
      label: Echo time in sea water (1500 m/s)
      expr: 2*d/1500
      unit: s
      places: 3
    goals:
    - prompt: To hear a separate echo in air, it must return after at least 0.1 s. Find the nearest the wall can be (it moves in 5 m steps).
      want:
        ta:
        - 0.1
        - 0.12
      hint: In 0.1 s, sound goes 34 m. But it has to go there and back.
      mistakes:
      - when:
          d: 35
        say: 'At about 34 m, sound reaches the wall in 0.1 s, but the echo has to come back too: 0.2 s in all.'
      - when:
          d:
          - 5
          - 15
        say: 'That''s too close: the echo comes back in under 0.1 s and blends with the clap.'
    - prompt: A ship's SONAR hears the echo from the sea floor after 2 s. How deep is the sea?
      want:
        tw: 2
      mistakes:
      - when:
          d: 3000
        say: At 3000 m the echo would take 4 s. 1500 × 2 is the whole journey down and up; the floor is only half that far.
      - when:
          d: 340
        say: 340 m uses the speed of sound in air. In sea water sound travels at 1500 m/s, so the floor is much deeper.
  lesson:
    - teach: 'Sound bounces off hard surfaces, just like light reflects from a mirror. An echo is a reflected sound you hear separately. Your brain keeps a sound for about 0.1 s, so the echo must come back at least 0.1 s later: in air (≈ 344 m/s) the wall must be at least 17.2 m away.'
      check:
        prompt: Why is there no echo in a small room?
        options:
        - The reflection returns in less than 0.1 s
        - Small rooms absorb all sound
        - Sound can't reflect indoors
        answer: The reflection returns in less than 0.1 s
        why: It mixes with the original sound instead of being heard separately.
    - teach: 'The echo travels to the wall AND back. So distance to the wall = speed × time ÷ 2. SONAR uses this: a ship sends ultrasound down, times the echo from the sea bed, and works out depth = v × t ÷ 2.'
      picture:
        kind: flow
        steps:
        - Shout at the cliff
        - Sound travels to the cliff (d)
        - Echo travels back (d)
        - Total path 2d = v × t
        - d = v × t ÷ 2
        alt: An echo's path goes to the cliff and back, so the distance is speed times time divided by two.
      check:
        prompt: An echo returns after 1 s; sound is 340 m/s. How far is the wall?
        options:
        - 170 m
        - 340 m
        - 680 m
        answer: 170 m
        why: 340 × 1 ÷ 2 = 170.
    - teach: Humans hear 20 Hz to 20,000 Hz. Below 20 Hz is infrasound (elephants, earthquakes); above 20 kHz is ultrasound (bats, dolphins). Ultrasound is used to scan babies in the womb, find cracks in metal, clean small parts and in SONAR. Repeated echoes in a big hall cause reverberation, reduced with curtains, carpets and soft boards.
      check:
        prompt: Bats find insects using…
        options:
        - Ultrasound echoes
        - Infrasound
        - Light
        answer: Ultrasound echoes
        why: They send out ultrasound and listen for echoes.
  items:
  - prompt: A person hears an echo 2 s after shouting at a cliff. Sound travels at 340 m/s. How far is the cliff, in m?
    answer: '340'
    check: 340*2/2
    difficulty: 1
    hints:
    - Sound goes there and back.
    - 340 × 2 ÷ 2.
    solution: Total path = 680 m; one way = 340 m.
    mistakes:
      '680': echo_round_trip
  - prompt: What is the upper limit of human hearing, in Hz?
    answer: '20000'
    check: '20000'
    difficulty: 1
    hints:
    - 20 kHz.
    - 1 kHz = 1000 Hz.
    solution: Humans hear up to about 20,000 Hz.
    mistakes:
      '20': audible_range
  - prompt: Sound of frequency 30 kHz is called…
    options:
    - Ultrasound
    - Infrasound
    - Audible sound
    - Echo
    answer: Ultrasound
    difficulty: 1
    hints:
    - It's above 20 kHz.
    - Ultra means beyond.
    solution: Frequencies above 20 kHz are ultrasound.
    mistakes:
      Infrasound: audible_range
  - prompt: A ship's SONAR gets an echo from the sea bed after 4 s. Sound in sea water travels at 1500 m/s. How deep is the sea, in m?
    answer: '3000'
    check: 1500*4/2
    difficulty: 2
    hints:
    - Distance = v × t ÷ 2.
    - 1500 × 4 ÷ 2.
    solution: Depth = 1500 × 4 ÷ 2 = 3000 m.
    mistakes:
      '6000': echo_round_trip
  - prompt: Why are the ceilings of concert halls often curved and walls covered with soft boards?
    options:
    - To control reflections and reduce reverberation
    - To make sound faster
    - To block all sound
    - To increase echoes
    answer: To control reflections and reduce reverberation
    difficulty: 2
    hints:
    - Too many reflections blur sound.
    - Soft material absorbs.
    solution: Curved ceilings spread sound evenly and soft panels absorb it, reducing reverberation.
    mistakes: {"To increase echoes": "reverberation_control", "To make sound faster": "reverberation_control"}
  - prompt: What is the minimum distance needed between you and a wall to hear a clear echo in air (speed 344 m/s, need 0.1 s), in m?
    answer: '17.2'
    check: 344*0.1/2
    difficulty: 3
    hints:
    - Total path = 344 × 0.1 = 34.4 m.
    - Halve it.
    solution: One-way distance = 34.4 ÷ 2 = 17.2 m.
    mistakes:
      '34.4': echo_round_trip
  - prompt: A boy hears an echo 3 s after clapping near a hill. Sound travels at 340 m/s. How far is the hill, in m?
    answer: '510'
    check: 340*3/2
    difficulty: 1
    hints:
    - Sound goes there and back.
    - 340 × 3 ÷ 2.
    solution: 340 × 3 = 1020 m for the round trip; the hill is 510 m away.
    mistakes:
      '1020': echo_round_trip
  - prompt: What is the lower limit of human hearing, in Hz?
    answer: '20'
    check: '20'
    difficulty: 1
    hints:
    - Below this is infrasound.
    - It is a small number.
    solution: Humans hear from about 20 Hz to 20,000 Hz.
    mistakes:
      '20000': c9s10_upper_limit
  - prompt: Sound of frequency 10 Hz is called…
    options:
    - Infrasound
    - Ultrasound
    - Audible sound
    - Echo
    answer: Infrasound
    difficulty: 1
    hints:
    - It is below 20 Hz.
    - '''Infra'' means below.'
    solution: Sound below 20 Hz is infrasound.
    mistakes:
      Ultrasound: c9s10_hearing_range
  - prompt: A SONAR pulse returns from a submarine after 2 s. Sound in sea water is 1500 m/s. How far is the submarine, in m?
    answer: '1500'
    check: 1500*2/2
    difficulty: 2
    hints:
    - Distance = v × t ÷ 2.
    - 1500 × 2 ÷ 2.
    solution: 1500 × 2 ÷ 2 = 1500 m.
    mistakes:
      '3000': echo_round_trip
      '750': echo_round_trip
  - prompt: Why are cinema walls covered with soft, rough materials?
    options:
    - To absorb sound and reduce reverberation
    - To make echoes louder
    - To keep the hall warm only
    - To reflect more sound
    answer: To absorb sound and reduce reverberation
    difficulty: 2
    hints:
    - Too many reflections blur speech.
    - Soft materials soak up sound.
    solution: Soft materials absorb sound, so it doesn't keep bouncing around.
    mistakes:
      To reflect more sound: reverberation_control
  - prompt: How do doctors see a baby inside the mother's womb safely?
    options:
    - Ultrasound scan
    - Infrasound
    - X-rays every week
    - SONAR from a ship
    answer: Ultrasound scan
    difficulty: 2
    hints:
    - High-frequency sound echoes off tissues.
    - It is safe for the baby.
    solution: An ultrasound scanner sends high-frequency sound and builds a picture from the echoes.
    mistakes:
      Infrasound: c9s10_hearing_range
  - prompt: A ship's SONAR gets an echo from the sea bed after 3 s. Sound in sea water is 1500 m/s. How deep is the sea, in m?
    answer: '2250'
    check: 1500*3/2
    difficulty: 2
    hints:
    - Depth = v × t ÷ 2.
    - 4500 ÷ 2.
    solution: 1500 × 3 ÷ 2 = 2250 m.
    mistakes:
      '4500': echo_round_trip
  - prompt: A person stands 85 m from a wall and claps. Sound is 340 m/s. When is the echo heard, in s?
    answer: '0.5'
    check: 2*85/340
    difficulty: 3
    hints:
    - Total path = 2 × 85 = 170 m.
    - Time = 170 ÷ 340.
    solution: 170 ÷ 340 = 0.5 s.
    mistakes:
      '0.25': echo_round_trip
  - prompt: A dog whistle can be heard by dogs but not by people. What is its frequency likely to be?
    options:
    - About 25,000 Hz
    - About 1000 Hz
    - About 10 Hz
    - About 200 Hz
    answer: About 25,000 Hz
    difficulty: 3
    hints:
    - People hear up to 20,000 Hz.
    - Dogs hear higher.
    solution: Above 20,000 Hz is ultrasound for humans, but dogs can hear up to about 45,000 Hz.
    mistakes:
      About 10 Hz: pitch_frequency
