# CBSE Class 9 Science (NCERT Exploration, 2026-27), chapter 6. Format: content/README.md.
subject: cbse9-sci
chapter: 6
title: How Forces Affect Motion
tips:
  momentum_mv: Momentum p = mass × velocity. Use kg and m/s to get kg m/s.
  balanced_no_change: 'Balanced forces cause no change in motion: an object at rest stays at rest, and a moving one keeps its velocity.'
  opposite_forces_subtract: 'Forces in opposite directions work against each other: subtract them. Add only forces in the same direction.'
  recoil_mass_ratio: 'The gun is much heavier than the bullet, so it moves much more slowly: v = (bullet mass × bullet speed) ÷ gun mass.'
  f_equals_ma: F = m × a. Force in newtons needs mass in kg and acceleration in m/s².
  friction_always_bad: 'Friction opposes motion, but we also need it: to walk, to grip, to brake. Too little is as much a problem as too much.'
  balanced_means_stopped: 'Balanced forces mean no change in motion: the object may be at rest or moving at a steady velocity.'
  first_law_name: "The first law says things keep doing what they are doing unless a force acts. That tendency has a name."
  friction_stops: "A moving ball keeps going unless a force acts. Which force acts where the ball touches the ground?"
  impulse_longer_time: "The ball's momentum must drop to zero either way. Pulling back changes how LONG that takes. What does that do to the force?"
  inertia_of_motion: "The bus stops but the passengers were moving. Which kind of inertia keeps them going?"
  lubricant_smooth: "Which choice puts a slippery layer between surfaces? The others give more grip."
  momentum_change: "Change in momentum = mass × (final velocity − initial velocity)."
  resultant_opposite: "The push and friction act in opposite directions, so subtract the smaller from the bigger."
  rolling_vs_sliding: "Wheels change the kind of friction. Which is smaller: rolling or sliding friction?"
  third_law_pairs: "The wall pushing back is an equal and opposite force in a pair. Which law is about pairs of forces?"
concepts:
- code: cbse9ex.force.inertia
  title: Balanced forces and inertia
  notes: |
    Force can change speed, direction or shape. Balanced forces give no net force and no change in
    motion; unbalanced forces cause acceleration. Newton's first law (law of inertia): an object stays at
    rest or in uniform motion unless an unbalanced force acts. Inertia depends on mass: more mass, more
    inertia. Friction opposes motion.
  explanations:
    text: 'Things don''t like to change what they''re doing: that''s inertia. A ball at rest stays at rest until you kick it; a rolling ball would roll forever if friction didn''t slow it. Heavier objects have more inertia: it''s harder to push a car than a bicycle. If the forces on something balance, its motion doesn''t change.'
    visual: 'Picture a tug of war. If both teams pull equally, the rope stays put: balanced forces. If one team pulls harder, the rope moves towards them: an unbalanced force.'
    step_by_step: 'Step 1: List the forces and their directions. Step 2: If they cancel, motion doesn''t change. Step 3: If not, the object accelerates in the direction of the bigger force. Step 4: More mass means more inertia, so a bigger force is needed for the same change.'
    real_world: 'When a bus starts suddenly, you fall backwards: your body wants to stay at rest. When it brakes, you fall forwards: your body wants to keep moving. That''s why seat belts matter.'
  picture:
    kind: compare
    columns:
    - title: Balanced forces
      points:
      - Equal pulls in opposite directions
      - Add up to zero
      - Speed and direction stay the same
    - title: Unbalanced forces
      points:
      - One side pulls harder
      - There is a net force
      - The object speeds up, slows down or turns
    alt: Balanced forces add to zero and don't change motion; unbalanced forces leave a net force that changes speed or direction.
  activity:
    type: sort
    prompt: What does the object do? Think about whether the forces on it are balanced.
    bins:
    - Stays at rest
    - Keeps moving the same way
    - Speeds up, slows down or turns
    items:
    - label: 'A book on a table: weight down, table pushing up equally'
      bin: Stays at rest
      clue: Are the forces balanced? Was it moving to start with?
      why: Balanced forces and at rest, so it stays at rest.
    - label: 'A car at a steady 60 km/h: engine force equals friction'
      bin: Keeps moving the same way
      clue: Do balanced forces mean stopped?
      why: Balanced forces mean no change in motion, so it keeps going at 60 km/h.
    - label: A football being kicked
      bin: Speeds up, slows down or turns
      clue: Is there an unbalanced force at the kick?
      why: 'The kick is an unbalanced force: the ball speeds up.'
    - label: A space probe far from everything, engines off
      bin: Keeps moving the same way
      clue: Is anything pushing or pulling it?
      why: No force acts, so by inertia it keeps moving in a straight line.
    - label: 'A tug of war: both teams pull 500 N, rope still'
      bin: Stays at rest
      clue: What do equal, opposite pulls add up to?
      why: '500 N each way cancel: no net force, so the rope stays still.'
    - label: A cyclist stops pedalling on a flat road
      bin: Speeds up, slows down or turns
      clue: Is friction still acting? Is anything pushing forward?
      why: Only friction acts, an unbalanced force backwards, so the bicycle slows down.
    - label: A stone whirled at a steady speed on a string
      bin: Speeds up, slows down or turns
      clue: Its speed is steady. Is its direction?
      why: 'Its direction changes all the time, so it is accelerating: the string pulls it inward.'
    - label: Passengers when a bus brakes suddenly
      bin: Keeps moving the same way
      clue: The bus slows. What do the passengers' bodies tend to do?
      why: By inertia their bodies keep moving forward, so they lurch forward.
    - label: A coin on a card when the card is flicked away
      bin: Stays at rest
      clue: The card moves fast. Does the coin get pushed sideways?
      why: The coin's inertia keeps it at rest, so it drops straight into the glass.
  lesson:
    - teach: 'A force is a push or a pull. It can start or stop motion, change speed, change direction, or change shape. When forces on an object cancel out they are balanced: the net force is zero and the motion doesn''t change.'
      check:
        prompt: Two teams pull a rope with equal force in opposite directions. What happens?
        options:
        - The rope doesn't move
        - It moves towards the stronger team
        - It speeds up
        answer: The rope doesn't move
        why: Equal and opposite forces are balanced.
    - teach: Unbalanced forces change motion. Forces in the same direction add; in opposite directions subtract. 40 N right and 25 N left give a net 15 N to the right, so the object speeds up to the right.
      picture:
        kind: number_line
        from: -30
        to: 50
        step: 10
        points:
        - at: 0
          label: start
        - at: 15
          label: net 15 N
        jumps:
        - from: 0
          to: 40
          label: 40 N right
        - from: 40
          to: 15
          label: 25 N left
        alt: 'Adding forces on a line: 40 N to the right and 25 N to the left leave a net force of 15 N to the right.'
      check:
        prompt: Forces of 20 N and 20 N push a box the same way. Net force?
        options:
        - 40 N
        - 0 N
        - 20 N
        answer: 40 N
        why: 'Same direction: add.'
    - teach: 'Newton''s first law: an object stays at rest, or keeps moving at a steady speed in a straight line, unless an unbalanced force acts on it. This resistance to change is inertia, and more mass means more inertia. A moving ball stops on the ground only because friction acts on it.'
      check:
        prompt: Why is a heavy cupboard harder to start moving than a chair?
        options:
        - It has more mass, so more inertia
        - It has less friction
        - It is taller
        answer: It has more mass, so more inertia
        why: Inertia grows with mass.
  items:
  - prompt: When a bus brakes suddenly, passengers fall forward. Why?
    options:
    - Inertia of motion
    - Inertia of rest
    - Friction pushes them
    - Gravity changes
    answer: Inertia of motion
    difficulty: 1
    hints:
    - They were moving with the bus.
    - Their bodies want to keep moving.
    solution: 'Their bodies tend to keep moving forward: inertia of motion.'
    mistakes: {"Inertia of rest": "inertia_of_motion", "Friction pushes them": "inertia_of_motion"}
  - prompt: Which has more inertia?
    options:
    - A loaded truck
    - A bicycle
    - A football
    - A pencil
    answer: A loaded truck
    difficulty: 1
    hints:
    - Inertia depends on mass.
    - Most mass.
    solution: The loaded truck has the most mass, so the most inertia.
    mistakes:
      A bicycle: heavier_more_inertia
  - prompt: Two people push a box with 50 N each in opposite directions. What happens?
    options:
    - The box does not move
    - It moves left
    - It moves right
    - It speeds up
    answer: The box does not move
    difficulty: 1
    hints:
    - 50 − 50 = 0.
    - Balanced forces.
    solution: The forces are balanced, so the net force is 0 and there's no change in motion.
    mistakes:
      It speeds up: balanced_no_change
  - prompt: Two forces of 30 N right and 18 N left act on a cart. What is the net force in N (to the right)?
    answer: '12'
    check: 30 - 18
    difficulty: 2
    hints:
    - Opposite directions subtract.
    - 30 − 18.
    solution: Net force = 30 − 18 = 12 N to the right.
    mistakes:
      '48': opposite_forces_subtract
  - prompt: A ball rolling on the ground slowly stops. Which force stops it?
    options:
    - Friction
    - Inertia
    - Gravity pulling forward
    - No force
    answer: Friction
    difficulty: 2
    hints:
    - Without it, the ball would roll forever.
    - It opposes motion.
    solution: Friction between the ball and the ground opposes its motion and stops it.
    mistakes: {"Inertia": "friction_stops", "No force": "friction_stops"}
  - prompt: Newton's first law is also called the law of…
    options:
    - Inertia
    - Action and reaction
    - Gravitation
    - Conservation of energy
    answer: Inertia
    difficulty: 2
    hints:
    - Objects resist change.
    - First law.
    solution: The first law is the law of inertia.
    mistakes: {"Action and reaction": "first_law_name", "Gravitation": "first_law_name"}
  - prompt: When a moving bus suddenly starts, standing passengers fall…
    options:
    - Backwards
    - Forwards
    - Sideways
    - Upwards
    answer: Backwards
    difficulty: 1
    hints:
    - Their bodies were at rest.
    - The bus moves forward under them.
    solution: By inertia of rest the body stays still while the bus moves forward, so passengers fall back.
    mistakes:
      Forwards: inertia_of_motion
  - prompt: Which has the least inertia?
    options:
    - A tennis ball
    - A cricket ball
    - A football filled with sand
    - A bicycle
    answer: A tennis ball
    difficulty: 1
    hints:
    - Inertia depends on mass.
    - Find the lightest.
    solution: The tennis ball has the smallest mass, so the least inertia.
    mistakes:
      A bicycle: first_law_name
  - prompt: Forces of 50 N right and 50 N left act on a box at rest. What happens?
    options:
    - It stays at rest
    - It moves right
    - It moves left
    - It spins
    answer: It stays at rest
    difficulty: 1
    hints:
    - Find the net force.
    - 50 − 50 = 0.
    solution: The forces are balanced (net 0), so the box stays at rest.
    mistakes:
      It moves right: opposite_forces_subtract
  - prompt: Forces of 45 N east and 70 N west act on a cart. What is the net force, in N, and which way?
    options:
    - 25 N west
    - 115 N west
    - 25 N east
    - 0 N
    answer: 25 N west
    difficulty: 2
    hints:
    - 'Opposite directions: subtract.'
    - The bigger force wins the direction.
    solution: 70 − 45 = 25 N, towards the west.
    mistakes:
      115 N west: opposite_forces_subtract
      25 N east: resultant_opposite
  - prompt: A coin is placed on a card on top of a glass. The card is flicked away fast. Where does the coin go?
    options:
    - Into the glass
    - With the card
    - It flies upwards
    - It stays in the air
    answer: Into the glass
    difficulty: 2
    hints:
    - The coin was at rest.
    - The card moves too fast to drag it.
    solution: By inertia of rest the coin stays put and then falls into the glass.
    mistakes:
      With the card: inertia_of_motion
  - prompt: A spacecraft far from any planet switches off its engines. What does it do?
    options:
    - Keeps moving at the same speed in a straight line
    - Stops at once
    - Slows down and stops
    - Falls
    answer: Keeps moving at the same speed in a straight line
    difficulty: 2
    hints:
    - No friction or gravity to change its motion.
    - First law.
    solution: 'With no unbalanced force, it keeps its velocity: Newton''s first law.'
    mistakes:
      Slows down and stops: balanced_means_stopped
  - prompt: Why do we shake a wet umbrella to dry it?
    options:
    - The cloth stops but the water drops keep moving and fly off
    - Shaking heats the water
    - Friction pushes the water off
    - Gravity gets stronger
    answer: The cloth stops but the water drops keep moving and fly off
    difficulty: 2
    hints:
    - Think of inertia of motion.
    - What happens to the drops when the cloth stops suddenly?
    solution: When the umbrella stops, the drops continue moving by inertia and leave the cloth.
    mistakes:
      Friction pushes the water off: friction_stops
  - prompt: A car moves at a steady 50 km/h on a straight road. The engine's forward force is 2000 N. What is the total backward force (friction and air), in N?
    answer: '2000'
    check: '2000'
    difficulty: 3
    hints:
    - Steady speed in a straight line means no acceleration.
    - So the forces are balanced.
    solution: No acceleration means balanced forces, so the backward forces total 2000 N.
    mistakes:
      '0': balanced_no_change
  - prompt: A ball rolled on smooth glass goes farther than on a carpet. What does this suggest?
    options:
    - With no friction it would keep rolling forever
    - Glass pushes the ball
    - Carpets have more inertia
    - The ball is lighter on glass
    answer: With no friction it would keep rolling forever
    difficulty: 3
    hints:
    - Less friction, farther it goes.
    - Imagine zero friction.
    solution: 'Less friction means less slowing; with none, the ball would keep moving: Galileo''s idea behind the first law.'
    mistakes:
      Carpets have more inertia: friction_stops
- code: cbse9ex.force.momentum
  title: Momentum, F = ma and action–reaction
  after:
  - cbse9ex.force.inertia
  notes: |
    Momentum p = mv (kg m/s). Newton's second law: rate of change of momentum is proportional to force,
    F = ma (1 N = 1 kg m/s²). Impulse: catching a ball by pulling hands back increases time and reduces
    force. Third law: every action has an equal and opposite reaction, acting on different bodies.
    Conservation of momentum: total momentum before = after (gun recoil).
  explanations:
    text: 'Momentum is mass times velocity: a slow truck and a fast cricket ball can both be hard to stop. Force equals mass times acceleration, F = ma. And forces come in pairs: when you push on a wall, the wall pushes back on you just as hard.'
    visual: 'Picture two skaters facing each other who push off. Both slide apart: the lighter one faster. The pushes were equal and opposite, acting on different people, and their momenta are equal and opposite.'
    step_by_step: 'Step 1: For momentum, multiply mass (kg) by velocity (m/s). Step 2: For force, F = m × a. Step 3: For a reaction, it''s the same size, opposite direction, on the other object. Step 4: For recoil, m₁v₁ = m₂v₂.'
    real_world: 'A fielder pulls their hands back while catching a fast ball: that makes the stop take longer, so the force on their hands is smaller. A rocket pushes gas down, and the gas pushes the rocket up.'
  picture:
    kind: flow
    steps:
    - 'Before: two skaters at rest, total momentum 0'
    - 'They push: equal and opposite forces, one on each skater'
    - 'After: equal and opposite momenta, total still 0'
    - The lighter skater moves faster
    alt: Two skaters push apart. The forces are equal and opposite, the total momentum stays 0, and the lighter skater moves faster.
  activity:
    type: formula
    prompt: 'A 0.02 kg bullet leaves a gun at 400 m/s: 8 kg m/s forward. Before firing, gun and bullet were at rest: total momentum 0.'
    inputs:
    - name: m
      label: Gun mass
      min: 1
      max: 8
      step: 0.5
      start: 1
      unit: kg
    - name: v
      label: Gun's recoil speed
      min: 0
      max: 10
      step: 0.5
      start: 0
      unit: m/s
    outputs:
    - name: pb
      label: Bullet's momentum (forward)
      expr: 0.02*400
      unit: kg m/s
    - name: pg
      label: Gun's momentum (backward)
      expr: m*v
      unit: kg m/s
    - name: total
      label: Total momentum after firing
      expr: 0.02*400-m*v
      unit: kg m/s
    goals:
    - prompt: A 4 kg gun fires the bullet. Make the total momentum 0 again.
      want:
        m: 4
        total: 0
      hint: The gun's backward momentum must equal the bullet's 8 kg m/s. Momentum = mass × velocity.
      mistakes:
      - when:
          m: 4
          v: 8
        say: At 8 m/s backward the gun carries 32 kg m/s, four times the bullet's. The heavier gun needs less speed for the same momentum.
      - when:
          m: 4
          v: 0
        say: If the gun didn't move, the total would be 8 kg m/s forward. Before firing it was 0, and momentum is conserved.
    - prompt: Which gun mass would recoil at 4 m/s?
      want:
        v: 4
        total: 0
      mistakes:
      - when:
          v: 4
          m: 8
        say: An 8 kg gun at 4 m/s carries 32 kg m/s backward, four times the bullet's 8. A faster recoil means a lighter gun.
      - when:
          v: 4
          m: 1
        say: 1 kg at 4 m/s is only 4 kg m/s. The gun must balance the bullet's 8.
  lesson:
    - teach: 'Momentum is mass × velocity: p = mv, in kg m/s. A slow truck can have more momentum than a fast bicycle. It is harder to stop something with more momentum.'
      check:
        prompt: What is the momentum of a 50 kg girl running at 4 m/s?
        options:
        - 200 kg m/s
        - 54 kg m/s
        - 12.5 kg m/s
        answer: 200 kg m/s
        why: 50 × 4 = 200.
    - teach: 'Newton''s second law: force causes a change in momentum, F = ma (force = mass × acceleration). 1 newton gives 1 kg an acceleration of 1 m/s². The same change in momentum over a longer time needs a smaller force, so a cricketer pulls the hands back while catching.'
      check:
        prompt: What force accelerates a 5 kg trolley at 2 m/s²?
        options:
        - 10 N
        - 2.5 N
        - 7 N
        answer: 10 N
        why: F = 5 × 2.
    - teach: 'Newton''s third law: when A pushes B, B pushes A back with an equal and opposite force. The pair act on different objects, so they don''t cancel. Total momentum is conserved: a gun recoils backwards as the bullet goes forwards, and m₁v₁ = m₂v₂.'
      picture:
        kind: compare
        columns:
        - title: Action
          points:
          - Gun pushes bullet forward
          - Swimmer pushes water back
          - Rocket pushes gas down
        - title: Reaction
          points:
          - Bullet pushes gun back (recoil)
          - Water pushes swimmer forward
          - Gas pushes rocket up
        alt: 'Three action–reaction pairs: a gun and bullet, a swimmer and water, a rocket and its exhaust gas.'
      check:
        prompt: A boat moves forward when the oars push water…
        options:
        - backwards
        - forwards
        - down only
        answer: backwards
        why: The water pushes the boat forward in reaction.
  items:
  - prompt: Find the momentum of a 2 kg ball moving at 5 m/s, in kg m/s.
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - p = mv.
    - 2 × 5.
    solution: p = 2 × 5 = 10 kg m/s.
    mistakes:
      '7': momentum_mv
  - prompt: What force gives a 10 kg box an acceleration of 3 m/s², in N?
    answer: '30'
    check: 10*3
    difficulty: 1
    hints:
    - F = ma.
    - 10 × 3.
    solution: F = 10 × 3 = 30 N.
    mistakes:
      '13': f_equals_ma
  - prompt: A force of 20 N acts on a 4 kg mass. Find the acceleration in m/s².
    answer: '5'
    check: 20/4
    difficulty: 1
    hints:
    - a = F ÷ m.
    - 20 ÷ 4.
    solution: a = 20 ÷ 4 = 5 m/s².
    mistakes:
      '80': f_equals_ma
  - prompt: Why does a fielder pull their hands back when catching a fast ball?
    options:
    - To increase the time and reduce the force
    - To increase the force
    - To make the ball faster
    - To reduce the ball's mass
    answer: To increase the time and reduce the force
    difficulty: 2
    hints:
    - Force = change in momentum ÷ time.
    - Longer time, smaller force.
    solution: Pulling back makes the ball stop over a longer time, so the force on the hands is smaller.
    mistakes: {"To increase the force": "impulse_longer_time", "To make the ball faster": "impulse_longer_time"}
  - prompt: A 1000 kg car's speed changes from 10 m/s to 20 m/s. By how much does its momentum change, in kg m/s?
    answer: '10000'
    check: 1000*(20 - 10)
    difficulty: 2
    hints:
    - Change = m(v − u).
    - 1000 × 10.
    solution: Δp = 1000 × (20 − 10) = 10,000 kg m/s.
    mistakes: {"20000": "momentum_change", "30000": "momentum_change"}
  - prompt: When you push a wall, the wall pushes you back. This is Newton's…
    options:
    - Third law
    - First law
    - Second law
    - Law of gravitation
    answer: Third law
    difficulty: 1
    hints:
    - Action and reaction.
    - Equal and opposite.
    solution: 'Every action has an equal and opposite reaction: the third law.'
    mistakes: {"First law": "third_law_pairs", "Second law": "third_law_pairs"}
  - prompt: A 2 kg gun fires a 0.02 kg bullet at 100 m/s. Find the gun's recoil speed in m/s.
    answer: '1'
    check: 0.02*100/2
    difficulty: 3
    hints:
    - 'Momentum is conserved: 0 before.'
    - 2v = 0.02 × 100.
    solution: 'Step 1: 0.02 × 100 = 2 kg m/s. Step 2: v = 2 ÷ 2 = 1 m/s backwards.'
    mistakes:
      '100': recoil_mass_ratio
  - prompt: Find the momentum of a 1500 kg car moving at 20 m/s, in kg m/s.
    answer: '30000'
    check: 1500*20
    difficulty: 1
    hints:
    - p = mv.
    - 1500 × 20.
    solution: 1500 × 20 = 30,000 kg m/s.
    mistakes:
      '75': momentum_mv
      '1520': momentum_mv
  - prompt: A 2 kg ball accelerates at 4 m/s². What force acts on it, in N?
    answer: '8'
    check: 2*4
    difficulty: 1
    hints:
    - F = ma.
    - 2 × 4.
    solution: F = 2 × 4 = 8 N.
    mistakes:
      '2': f_equals_ma
      '0.5': f_equals_ma
  - prompt: A 60 N force acts on a 12 kg box. What is its acceleration, in m/s²?
    answer: '5'
    check: 60/12
    difficulty: 1
    hints:
    - a = F ÷ m.
    - 60 ÷ 12.
    solution: a = 60 ÷ 12 = 5 m/s².
    mistakes:
      '720': f_equals_ma
  - prompt: Why are cars fitted with crumple zones and airbags?
    options:
    - They make the stopping time longer, so the force on people is smaller
    - They make the car heavier
    - They stop the car faster
    - They increase momentum
    answer: They make the stopping time longer, so the force on people is smaller
    difficulty: 2
    hints:
    - The momentum change is the same in a crash.
    - Spread over more time, the force is less.
    solution: Force = change in momentum ÷ time. Longer time means less force on passengers.
    mistakes:
      They stop the car faster: impulse_longer_time
  - prompt: A 0.5 kg ball's speed changes from 2 m/s to 8 m/s. By how much does its momentum change, in kg m/s?
    answer: '3'
    check: 0.5*(8 - 2)
    difficulty: 2
    hints:
    - Change = m(v − u).
    - 0.5 × 6.
    solution: 0.5 × (8 − 2) = 3 kg m/s.
    mistakes:
      '5': momentum_change
      '4': momentum_change
  - prompt: A horse pulls a cart and the cart pulls the horse back equally. Why do they still move?
    options:
    - The two forces act on different bodies; the horse's push on the ground moves it forward
    - The horse's force is bigger
    - The forces cancel, so they don't move
    - The cart has no mass
    answer: The two forces act on different bodies; the horse's push on the ground moves it forward
    difficulty: 2
    hints:
    - Action and reaction act on different objects.
    - What pushes the horse forward?
    solution: Action and reaction never cancel because they act on different bodies. The ground's push on the horse's hooves drives them forward.
    mistakes:
      The forces cancel, so they don't move: third_law_pairs
  - prompt: A rocket pushes hot gas downwards. Which law explains why it goes up?
    options:
    - Newton's third law
    - Newton's first law
    - Law of floating
    - Ohm's law
    answer: Newton's third law
    difficulty: 2
    hints:
    - Action and reaction.
    - Gas pushed down, rocket pushed up.
    solution: 'The gas pushes back on the rocket, upwards: Newton''s third law.'
    mistakes:
      Newton's first law: first_law_name
  - prompt: A 4 kg rifle fires a 0.01 kg bullet at 400 m/s. Find the recoil speed of the rifle, in m/s.
    answer: '1'
    check: 0.01*400/4
    difficulty: 3
    hints:
    - Momentum before = 0, so momenta after are equal and opposite.
    - 4 × v = 0.01 × 400.
    solution: 4v = 4, so v = 1 m/s backwards.
    mistakes:
      '4': recoil_mass_ratio
      '1600': recoil_mass_ratio
- code: cbse9ex.force.friction
  title: Resultant force and friction
  after:
  - cbse9ex.force.inertia
  notes: |
    Forces add as vectors: equal and opposite forces are balanced (resultant zero, no change in motion); if
    unbalanced, the resultant force changes speed or direction. Friction is the force between two surfaces
    that opposes their relative motion. Static friction stops a resting object starting to slide (up to a
    limit); sliding friction acts once it moves; rolling friction is much smaller. Friction depends on the
    surfaces and how hard they press together. It is reduced by lubricants, polishing, ball bearings and
    streamlining; increased by treads and grip. It is needed for walking, writing, braking, but causes wear
    and heat.
  explanations:
    text: 'If two teams pull a rope equally hard, nothing moves: the forces are balanced. If one pulls harder, the rope moves towards it. Friction is the ''grip'' between surfaces that pushes against sliding. It wastes energy as heat, but without it you couldn''t even walk.'
    visual: 'Draw a box on the floor with an arrow ''push 50 N'' to the right and an arrow ''friction 50 N'' to the left: balanced, the box stays still (or keeps a steady speed). Make the push 80 N: an unbalanced 30 N to the right speeds it up.'
    step_by_step: 'Step 1: Draw all forces as arrows. Step 2: Add those in the same direction, subtract opposite ones. Step 3: Resultant zero → balanced, no change in motion. Step 4: Resultant not zero → acceleration in its direction.'
    real_world: Tyres have treads to grip the road; on a wet road friction falls and braking distance rises. Bearings in a bicycle wheel reduce friction so it spins freely.
  picture:
    kind: flow
    steps:
    - Push 80 N →
    - ← Friction 50 N
    - Resultant 30 N →
    - Box speeds up to the right
    alt: An 80 newton push against 50 newtons of friction gives a resultant of 30 newtons, so the box accelerates.
  activity:
    type: formula
    prompt: A 10 kg box on the floor. Friction resists up to 60 N, so the resultant force is what's left of the pushes after friction.
    inputs:
    - name: p
      label: Your push
      min: 0
      max: 100
      step: 5
      start: 0
      unit: N
    - name: q
      label: Friend's push (same way)
      min: 0
      max: 100
      step: 5
      start: 0
      unit: N
    outputs:
    - name: push
      label: Total push
      expr: p+q
      unit: N
    - name: res
      label: Resultant force
      expr: max(0,p+q-60)
      unit: N
    - name: acc
      label: Acceleration = resultant ÷ 10 kg
      expr: max(0,p+q-60)/10
      unit: m/s²
      places: 1
    goals:
    - prompt: On your own (friend pushes 0), make the box speed up at 2 m/s².
      want:
        q: 0
        acc: 2
      hint: F = ma needs 20 N of resultant force. What has to be beaten first?
      mistakes:
      - when:
          p: 20
          q: 0
        say: '20 N is less than friction, so the box doesn''t move at all: friction cancels your push. The push must beat friction first.'
      - when:
          p: 60
          q: 0
        say: '60 N only balances friction: no resultant force, so no speeding up.'
    - prompt: Your friend pushes 25 N. How hard must you push for 1.5 m/s²?
      want:
        q: 25
        acc: 1.5
      mistakes:
      - when:
          p: 75
          q: 25
        say: 'That''s 100 N together, 40 N past friction: 4 m/s². Your friend''s 25 N already counts.'
      - when:
          p: 15
          q: 25
        say: '15 + 25 = 40 N, less than friction''s 60 N: the box doesn''t move. Beat friction first, then add 15 N for 1.5 m/s².'
  lesson:
    - teach: 'The resultant (net) force is what you get when all forces on an object are added, taking direction into account. Push a crate with 80 N while friction pulls back 30 N: resultant 50 N forward, so it speeds up.'
      check:
        prompt: Push 100 N, friction 100 N, crate moving. What happens?
        options:
        - It keeps moving at a steady speed
        - It stops at once
        - It speeds up
        answer: It keeps moving at a steady speed
        why: Balanced forces mean no change in motion, not 'stopped'.
    - teach: Friction is the force between two touching surfaces that opposes sliding. Static friction stops a resting object from starting to slide; once it slides, sliding friction acts and is a little smaller. Rolling friction is much smaller still, so wheels make moving easier.
      picture:
        kind: bars
        bars:
        - label: Static (to start)
          value: 10
        - label: Sliding
          value: 8
        - label: Rolling
          value: 1
        unit: relative size
        alt: Static friction is biggest, sliding a little less, and rolling friction much smaller.
      check:
        prompt: Why is it harder to start pushing a heavy box than to keep it moving?
        options:
        - Static friction is bigger than sliding friction
        - The box gets lighter
        - Air pushes it
        answer: Static friction is bigger than sliding friction
        why: You must overcome static friction to start it sliding.
    - teach: Friction depends on how rough the surfaces are and how hard they press together. It is useful (walking, brakes, writing, grip) and sometimes a nuisance (wear, heat). We reduce it with oil, grease, ball bearings, wheels and smooth shapes, and increase it with treads and grips.
      check:
        prompt: Which increases friction?
        options:
        - Treads on shoe soles
        - Oil on a hinge
        - Ball bearings
        answer: Treads on shoe soles
        why: Treads grip the ground and stop slipping.
  items:
  - prompt: A box is pushed with 60 N and friction is 60 N. What happens to its motion?
    options:
    - 'No change: forces are balanced'
    - It speeds up
    - It slows down
    - It flies upwards
    answer: 'No change: forces are balanced'
    difficulty: 1
    hints:
    - 60 − 60 = 0.
    - Zero resultant.
    solution: 'Step 1: Resultant = 60 − 60 = 0. Step 2: Balanced forces don''t change motion: it stays at rest or keeps its steady speed.'
    mistakes:
      It slows down: balanced_means_stopped
  - prompt: A box is pushed right with 90 N while friction is 35 N. What is the resultant force, in N?
    answer: '55'
    check: 90 - 35
    difficulty: 1
    hints:
    - Opposite forces subtract.
    - 90 − 35.
    solution: 'Step 1: 90 − 35 = 55 N to the right.'
    mistakes: {"125": "resultant_opposite", "35": "resultant_opposite"}
  - prompt: Which reduces friction?
    options:
    - Oiling the hinges
    - Adding treads to tyres
    - Sprinkling sand on a slippery path
    - Wearing spiked shoes
    answer: Oiling the hinges
    difficulty: 1
    hints:
    - Lubricants.
    - The others increase grip.
    solution: 'Step 1: A lubricant like oil forms a thin layer between surfaces. Step 2: It reduces friction; the others increase it.'
    mistakes: {"Adding treads to tyres": "lubricant_smooth", "Wearing spiked shoes": "lubricant_smooth"}
  - prompt: Why is it easier to pull a suitcase on wheels than to drag it?
    options:
    - Rolling friction is much less than sliding friction
    - Wheels make it lighter
    - Wheels remove gravity
    - Sliding friction is zero
    answer: Rolling friction is much less than sliding friction
    difficulty: 2
    hints:
    - Compare rolling and sliding.
    - Its weight doesn't change.
    solution: 'Step 1: Dragging means sliding friction. Step 2: Wheels replace it with rolling friction, which is much smaller.'
    mistakes: {"Wheels make it lighter": "rolling_vs_sliding", "Sliding friction is zero": "rolling_vs_sliding"}
  - prompt: A car moves at a constant 60 km/h on a straight road. What can you say about the forces on it?
    options:
    - They are balanced
    - The engine force is bigger than friction
    - There are no forces
    - Friction is bigger than the engine force
    answer: They are balanced
    difficulty: 2
    hints:
    - Constant velocity means no acceleration.
    - No acceleration means resultant zero.
    solution: 'Step 1: Constant velocity, no acceleration. Step 2: So the resultant is zero: the engine''s push equals friction and air resistance.'
    mistakes:
      The engine force is bigger than friction: balanced_means_stopped
  - prompt: Why would walking be almost impossible on a perfectly frictionless floor?
    options:
    - Your foot pushes back on the floor, and only friction pushes you forward
    - Your weight would vanish
    - Air resistance would stop you
    - Your muscles would not work
    answer: Your foot pushes back on the floor, and only friction pushes you forward
    difficulty: 3
    hints:
    - Think of walking on ice.
    - Action and reaction at the foot.
    solution: 'Step 1: When walking, you push the ground backwards. Step 2: Friction from the ground pushes you forwards. Step 3: Without friction your foot just slips.'
    mistakes:
      Air resistance would stop you: friction_always_bad
  - prompt: A box is pushed right with 70 N, and friction is 20 N. What is the resultant force to the right, in N?
    answer: '50'
    check: 70 - 20
    difficulty: 1
    hints:
    - Friction acts the other way.
    - 70 − 20.
    solution: 70 − 20 = 50 N to the right.
    mistakes:
      '90': opposite_forces_subtract
  - prompt: Which of these increases friction?
    options:
    - Sprinkling sand on an icy path
    - Polishing the floor
    - Oiling a cycle chain
    - Using ball bearings
    answer: Sprinkling sand on an icy path
    difficulty: 1
    hints:
    - Which makes the surface rougher?
    - The others make things slide easier.
    solution: Sand makes the ice rough, so feet grip better.
    mistakes:
      Oiling a cycle chain: lubricant_smooth
  - prompt: Why are ball bearings used in machines?
    options:
    - Rolling friction is much less than sliding friction
    - They make machines heavier
    - They increase grip
    - They store energy
    answer: Rolling friction is much less than sliding friction
    difficulty: 1
    hints:
    - Balls roll between the moving parts.
    - Rolling is easier than sliding.
    solution: Bearings replace sliding with rolling, which has much less friction.
    mistakes:
      They increase grip: rolling_vs_sliding
  - prompt: Which is an example of useful friction?
    options:
    - Brakes stopping a bicycle
    - Wearing out of shoe soles
    - Heating of machine parts
    - Erasing your homework by mistake
    answer: Brakes stopping a bicycle
    difficulty: 2
    hints:
    - Which one do we want to happen?
    - Friction slows the wheel.
    solution: Brakes work by friction, which we need to stop safely.
    mistakes:
      Wearing out of shoe soles: friction_always_bad
  - prompt: A heavy box needs 120 N to start moving but only 100 N to keep it moving steadily. What is the sliding friction, in N?
    answer: '100'
    check: '100'
    difficulty: 2
    hints:
    - Steady motion means balanced forces.
    - Push = sliding friction then.
    solution: At steady speed, push = sliding friction = 100 N. (Static friction was up to 120 N.)
    mistakes:
      '120': rolling_vs_sliding
      '20': opposite_forces_subtract
  - prompt: A crate moves at a steady speed while a girl pushes it with 40 N. What is the resultant force on it, in N?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - Steady speed in a straight line.
    - No acceleration means no net force.
    solution: 'Steady velocity means the forces are balanced: resultant 0 N (friction = 40 N).'
    mistakes:
      '40': balanced_means_stopped
  - prompt: Why do aeroplanes and fast cars have smooth, curved (streamlined) shapes?
    options:
    - To reduce air friction (drag)
    - To look nice only
    - To increase weight
    - To increase grip on the air
    answer: To reduce air friction (drag)
    difficulty: 2
    hints:
    - Air is a fluid that resists motion.
    - Smooth shapes let air flow past.
    solution: Streamlining reduces drag, the friction from air.
    mistakes:
      To increase grip on the air: friction_always_bad
  - prompt: Pressing a book harder against a table makes it harder to slide. Why?
    options:
    - Friction increases when surfaces press together harder
    - The book gets heavier
    - The table gets rougher
    - Friction decreases
    answer: Friction increases when surfaces press together harder
    difficulty: 3
    hints:
    - Friction depends on how hard the surfaces press.
    - The surfaces didn't change.
    solution: A bigger pressing force makes the surface bumps lock more tightly, so friction grows.
    mistakes:
      Friction decreases: friction_stops
  - prompt: A 20 kg trolley is pushed with 100 N against 40 N of friction. What is its acceleration, in m/s²?
    answer: '3'
    check: (100 - 40)/20
    difficulty: 3
    hints:
    - Resultant = 100 − 40 = 60 N.
    - a = F ÷ m.
    solution: a = 60 ÷ 20 = 3 m/s².
    mistakes:
      '5': opposite_forces_subtract
      '7': opposite_forces_subtract
