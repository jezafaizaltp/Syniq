title: 'Moments: The Beggar'
concepts:
- code: cbse9e.m9.beggar
  title: The Beggar (Anton Chekhov)
  notes: |
    Lushkoff, a beggar, tells lawyer Sergei a false story to get money. Sergei sees through him, and instead of
    alms offers him work: chopping wood, for which he will pay. Lushkoff, too proud and weak to refuse, goes to
    the woodshed with Sergei's cook, Olga. He is paid half a rouble. Sergei gives him more such odd jobs and
    later gets him a job copying for a friend. Two years later Sergei meets Lushkoff, now a notary, at a
    theatre. Lushkoff thanks him, but admits that it was Olga who saved him: she scolded and pitied him, and
    chopped the wood herself every time, while he only watched. Her kindness and tears made him give up
    drinking. Theme: true kindness and the dignity of work.
  explanations:
    text: 'Sergei, a lawyer, gives the beggar Lushkoff work chopping wood instead of money, and thinks this has reformed him. Years later Lushkoff, now respectable, reveals the truth: Sergei''s cook Olga chopped the wood for him every time, scolding and crying over him, and her kindness is what changed his life.'
    visual: Draw a woodshed. Sergei watches from his window, pleased, thinking Lushkoff is chopping. Inside, draw Olga swinging the axe while Lushkoff sits on a log, head in hands. In a last picture, draw Lushkoff in a smart coat at a theatre, shaking Sergei's hand.
    step_by_step: 'Step 1: Lushkoff begs with a false story. Step 2: Sergei offers him wood-chopping work instead. Step 3: Olga, the cook, secretly chops the wood each time. Step 4: Sergei finds him a job and he does well. Step 5: Two years later, Lushkoff says it was Olga who saved him.'
    real_world: Sometimes the people who quietly help, like a neighbour or a relative, change someone's life more than those who give orders. Lushkoff's story shows how much a little real care can do.
  picture:
    kind: flow
    steps:
    - Lushkoff begs from Sergei with a false story
    - Sergei offers him work chopping wood instead of money
    - Olga, the cook, chops the wood herself while scolding and crying
    - Lushkoff gets more work and a copying job
    - Two years later, now a notary, he meets Sergei
    - He reveals that Olga's kindness saved him
    alt: 'The Beggar in six steps: Sergei gives Lushkoff work, Olga secretly does it for him, and years later Lushkoff says it was her kindness that changed his life.'
