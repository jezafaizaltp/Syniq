# CBSE Class 9 English (NCERT Beehive), unit 4. Written from memory of the NCERT texts: check details against the book.
subject: cbse9-eng
chapter: 4
title: A Truly Beautiful Mind · The Lake Isle of Innisfree

tips:
  einstein_nobel: "Einstein's Nobel Prize in Physics was for 1921, for his explanation of the photoelectric effect, not directly for relativity."

concepts:
  - code: cbse9e.u4.einstein
    title: A Truly Beautiful Mind (Albert Einstein)
    notes: |
      Einstein born 14 March 1879 in Ulm, Germany; a slow talker, nicknamed 'Brother Boring'. Disliked the
      strict Munich school; left without a certificate; studied at a university in Zurich, met Mileva Marić.
      Worked at the patent office in Bern; in 1905 published the special theory of relativity (E = mc²).
      General theory 1915; Nobel Prize for Physics 1921. Moved to the USA in 1933 when the Nazis came to
      power. In 1939 wrote to President Roosevelt warning that Germany could build an atomic bomb; after
      Hiroshima and Nagasaki he campaigned for peace and world government. Died 1955; called a 'world
      citizen'.
    explanations:
      text: "Albert Einstein was a slow talker as a child and was teased as 'Brother Boring'. He disliked his strict school but loved maths and physics. While working in a patent office in Bern, he published the theory of relativity in 1905, with the famous E = mc². He won the Nobel Prize in 1921. Later he warned President Roosevelt about atomic bombs, and after Hiroshima he spent his life working for peace."
      visual: "Draw a timeline: 1879 born in Ulm → Munich school → Zurich university → Bern patent office → 1905 relativity → 1921 Nobel Prize → 1933 to the USA → 1939 letter to Roosevelt → 1955 dies."
      step_by_step: "Step 1: Childhood: Ulm, 'Brother Boring', violin. Step 2: School troubles in Munich. Step 3: Zurich and Mileva. Step 4: Patent office and 1905 papers. Step 5: Fame and the Nobel Prize. Step 6: USA, the bomb letter and work for peace."
      real_world: "Einstein was not a star pupil at school. His story reminds us that everyone learns differently, and that curiosity matters more than marks."
    items:
      - prompt: "In which year was Einstein born?"
        answer: "1879"
        check: "1879"
        difficulty: 1
        hints: ["In Ulm, Germany.", "Late 19th century."]
        solution: "Einstein was born on 14 March 1879."
      - prompt: "What did Einstein's playmates call him?"
        options: ["Brother Boring", "Little Genius", "Professor", "Slow Albert"]
        answer: "Brother Boring"
        difficulty: 1
        hints: ["He didn't like to play.", "Two words starting with B."]
        solution: "They called him 'Brother Boring'."
      - prompt: "In which year did Einstein publish his special theory of relativity?"
        answer: "1905"
        check: "1905"
        difficulty: 2
        hints: ["He was working at the patent office.", "Early 20th century."]
        solution: "He published it in 1905."
      - prompt: "Where did Einstein work when he developed his first famous theories?"
        options: ["A patent office in Bern", "A university in Munich", "A hospital in Ulm", "A bank in Zurich"]
        answer: "A patent office in Bern"
        difficulty: 2
        hints: ["As a 'technical expert, third class'.", "In Switzerland."]
        solution: "He worked at the patent office in Bern."
        mistakes: {"A university in Munich": eng9_read_again}
      - prompt: "In which year did Einstein receive the Nobel Prize in Physics?"
        answer: "1921"
        check: "1921"
        difficulty: 2
        hints: ["Sixteen years after 1905.", "Early 1920s."]
        solution: "He received the Nobel Prize for 1921."
        mistakes: {"1905": einstein_nobel}
      - prompt: "Why did Einstein write to President Roosevelt in 1939?"
        options: ["To warn that Germany might build an atomic bomb", "To ask for a job", "To complain about his school", "To invite him to a concert"]
        answer: "To warn that Germany might build an atomic bomb"
        difficulty: 3
        hints: ["The Second World War was starting.", "A powerful new weapon."]
        solution: "He warned that Nazi Germany could build an atomic bomb."

  - code: cbse9e.u4.innisfree
    title: The Lake Isle of Innisfree (W.B. Yeats)
    after: [cbse9e.u4.einstein]
    notes: |
      The poet longs to go to Innisfree, a small island in Lough Gill, Ireland, and build a small cabin of
      clay and wattles, plant nine bean-rows and keep a hive for the honey-bee, and live alone in the
      'bee-loud glade'. Peace comes 'dropping slow'; midnight 'all a glimmer', noon 'a purple glow', evening
      full of the linnet's wings. Standing on the city 'pavements grey', he hears lake water lapping 'in the
      deep heart's core'.
    explanations:
      text: "Standing on grey city pavements, W.B. Yeats dreams of the small island of Innisfree. He wants to build a little cabin, grow nine rows of beans, keep bees and live alone, listening to the bees and the lake. He hears the lake water in his 'deep heart's core': a longing for the calm of nature."
      visual: "Picture a busy grey street on one side. On the other, a tiny cabin on a green island, nine neat rows of beans, a beehive, and water lapping gently against the shore at sunset."
      step_by_step: "Step 1: Stanza 1: the plan: cabin, nine bean-rows, a beehive. Step 2: Stanza 2: the peace there at morning, midnight, noon and evening. Step 3: Stanza 3: he hears the lake even on city pavements, deep in his heart."
      real_world: "Many people in crowded cities dream of a quiet village home with a vegetable garden. That longing for peace in nature is what Yeats describes."
    items:
      - prompt: "Who wrote 'The Lake Isle of Innisfree'?"
        options: ["W.B. Yeats", "William Wordsworth", "Robert Frost", "James Kirkup"]
        answer: "W.B. Yeats"
        difficulty: 1
        hints: ["An Irish poet.", "Innisfree is in Ireland."]
        solution: "W.B. Yeats."
        mistakes: {"William Wordsworth": eng9_author}
      - prompt: "How many bean-rows does the poet want to plant?"
        answer: "9"
        check: "9"
        difficulty: 1
        hints: ["First stanza.", "Nine."]
        solution: "'Nine bean-rows will I have there.'"
      - prompt: "What will the poet keep on the island besides beans?"
        options: ["A hive for the honey-bee", "A flock of sheep", "A boat", "A horse"]
        answer: "A hive for the honey-bee"
        difficulty: 1
        hints: ["'Bee-loud glade'.", "Honey."]
        solution: "He will keep a hive for the honey-bee."
      - prompt: "Where is the poet standing when he hears the lake water?"
        options: ["On the city pavements", "On the island", "On a boat", "In a forest"]
        answer: "On the city pavements"
        difficulty: 2
        hints: ["'pavements grey'.", "He is far from Innisfree."]
        solution: "He stands on the grey pavements of the city."
      - prompt: "What does the poem mainly express?"
        options: ["A longing for peace in nature", "Love of city life", "Fear of water", "Anger at bees"]
        answer: "A longing for peace in nature"
        difficulty: 2
        hints: ["'Peace comes dropping slow'.", "He wants to escape the city."]
        solution: "The poet longs for the peace and simplicity of nature."
        mistakes: {"Love of city life": eng9_poem_meaning}
      - prompt: "What is the cabin to be made of?"
        options: ["Clay and wattles", "Stone and steel", "Bricks and cement", "Glass"]
        answer: "Clay and wattles"
        difficulty: 3
        hints: ["Simple natural materials.", "Wattles are woven twigs."]
        solution: "'A small cabin build there, of clay and wattles made.'"
