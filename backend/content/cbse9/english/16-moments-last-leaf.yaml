  - prompt: What illness did Johnsy have?
    options:
    - Pneumonia
    - Malaria
    - Typhoid
    - Smallpox
    answer: Pneumonia
    difficulty: 1
    hints:
    - It affects the lungs.
    - Behrman later caught it too.
    solution: Johnsy had pneumonia.
  - prompt: What did Johnsy believe would happen when the last leaf fell?
    options:
    - She would die
    - She would get well
    - Sue would leave
    - Spring would come
    answer: She would die
    difficulty: 1
    hints:
    - She had lost hope.
    - She was counting down.
    solution: She believed she would die when the last ivy leaf fell.
  - prompt: Who was Behrman?
    options:
    - An old painter who lived downstairs
    - Johnsy's doctor
    - Sue's father
    - The landlord
    answer: An old painter who lived downstairs
    difficulty: 2
    hints:
    - He always talked of painting a masterpiece.
    - He was also an artist.
    solution: Behrman was an old, unsuccessful painter in the same building.
    mistakes:
      Johnsy's doctor: eng9_read_again
  - prompt: Why did the last leaf never fall?
    options:
    - Behrman had painted it on the wall
    - It was made of plastic
    - The storm stopped
    - Sue tied it on
    answer: Behrman had painted it on the wall
    difficulty: 2
    hints:
    - He went out in the storm with a ladder.
    - Paint, not a real leaf.
    solution: Behrman painted a leaf on the wall during the stormy night.
  - prompt: Why is the painted leaf called Behrman's masterpiece?
    options:
    - It saved Johnsy's life at the cost of his own
    - It sold for a lot of money
    - It was very large
    - It won a prize
    answer: It saved Johnsy's life at the cost of his own
    difficulty: 3
    hints:
    - He had always wanted to paint one great work.
    - What did the leaf achieve?
    solution: 'His one leaf gave Johnsy the hope to live, and he gave his life painting it: that made it his greatest work.'
