subject: cbse9-eng
chapter: 16
title: 'Moments: The Last Leaf'
concepts:
- code: cbse9e.m7.last_leaf
  title: The Last Leaf (O. Henry)
  notes: |
    Sue and Johnsy are young artists sharing a flat. Johnsy falls ill with pneumonia and loses the will to
    live. Lying in bed, she counts the leaves falling from an old ivy creeper on the wall opposite and believes
    she will die when the last leaf falls. Sue tells Behrman, an old painter who lives downstairs and has long
    talked of painting a masterpiece. That stormy night one leaf remains on the creeper, and it stays through
    the next day and night too. Johnsy feels ashamed of wanting to die and recovers. Sue then tells her that
    Behrman has died of pneumonia: on the stormy night he painted the leaf on the wall. It was his masterpiece.
    Theme: hope, sacrifice and the meaning of art.
  explanations:
    text: 'Johnsy, ill with pneumonia, believes she will die when the last ivy leaf outside her window falls. On a stormy night old Behrman paints a leaf on the wall so that it never falls. Johnsy finds hope and recovers, but Behrman catches pneumonia and dies: the painted leaf was his masterpiece.'
    visual: Draw a window with an old ivy creeper on the brick wall opposite, almost bare. One leaf clings on in the rain. Then draw a ladder, a lantern and paint brushes lying in the wet courtyard below.
    step_by_step: 'Step 1: Johnsy is ill with pneumonia. Step 2: She counts the ivy leaves and expects to die with the last one. Step 3: Sue tells old Behrman. Step 4: One leaf survives the storm, and Johnsy recovers. Step 5: Behrman dies; he had painted the leaf on the wall.'
    real_world: Doctors say a patient's hope can help them recover. A friend's small act, like Behrman's leaf, can give someone a reason to keep fighting.
  picture:
    kind: flow
    steps:
    - Johnsy is ill with pneumonia and loses hope
    - 'She counts falling ivy leaves: she''ll die with the last one'
    - Sue tells Behrman, the old painter downstairs
    - One leaf survives two stormy nights
    - Johnsy finds hope and recovers
    - 'Behrman dies: he had painted the last leaf on the wall'
    alt: 'The Last Leaf in six steps: Johnsy ties her life to the last ivy leaf, Behrman paints one on the wall in a storm, she recovers, and he dies of pneumonia.'
  items:
  - prompt: Who wrote 'The Last Leaf'?
    options:
    - O. Henry
    - Oscar Wilde
    - Anton Chekhov
    - Isaac Asimov
    answer: O. Henry
    difficulty: 1
    hints:
    - An American writer famous for twist endings.
    - A pen name.
