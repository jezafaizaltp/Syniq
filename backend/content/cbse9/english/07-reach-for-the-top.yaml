# CBSE Class 9 English (NCERT Beehive), unit 7. Written from memory of the NCERT texts: check details against the book.
subject: cbse9-eng
chapter: 7
title: Reach for the Top · On Killing a Tree

tips:
  everest_twice: "Santosh Yadav was the first woman in the world to climb Mount Everest twice, in 1992 and 1993."
  tree_roots: "In 'On Killing a Tree', the tree can only be killed by pulling out its roots from the earth; cutting it just makes it grow again."

concepts:
  - code: cbse9e.u7.reach
    title: Reach for the Top (Santosh Yadav and Maria Sharapova)
    notes: |
      Part I: Santosh Yadav, born in Joonthwala (Joditala) village, Rewari district, Haryana. She refused an
      early marriage, studied in Delhi and Jaipur (Maharani College), saw climbers in the Aravallis, joined
      the Uttarkashi Nehru Institute of Mountaineering, then the Indo-Tibetan Border Police. First woman to
      climb Everest twice: 1992 and within a year, 1993. Padma Shri. Part II: Maria Sharapova, Russian
      tennis player; left Siberia for Florida at nine, separated from her mother for two years; world
      number one in 2005 at 18; loves fashion, singing and dancing; 'I am very, very competitive'.
    explanations:
      text: "Two determined women. Santosh Yadav, from a village in Haryana, insisted on studying instead of marrying young, and became the first woman to climb Mount Everest twice, in 1992 and 1993. Maria Sharapova left Siberia for the USA at nine to train in tennis, lived away from her mother, and became world number one by eighteen. Both show courage and hard work."
      visual: "Draw two peaks side by side. On one, a climber with an Indian flag at the top of Everest, labelled 1992 and 1993. On the other, a tennis player holding up a trophy, labelled 'World No. 1, 2005'."
      step_by_step: "Step 1: Santosh: village childhood, insisted on education, saw climbers in the Aravallis, mountaineering training, ITBP, Everest twice. Step 2: Maria: Siberia to Florida at nine, lonely years, hard training, world number one at 18. Step 3: Compare: both sacrificed and stayed determined."
      real_world: "Many young athletes in India leave home for training academies, much like Maria did. Their families make sacrifices too."
    items:
      - prompt: "Which mountain did Santosh Yadav climb twice?"
        options: ["Mount Everest", "Kanchenjunga", "K2", "Nanda Devi"]
        answer: "Mount Everest"
        difficulty: 1
        hints: ["The world's highest peak.", "In Nepal and Tibet."]
        solution: "She climbed Mount Everest twice."
      - prompt: "In which year did Santosh Yadav first climb Everest?"
        answer: "1992"
        check: "1992"
        difficulty: 2
        hints: ["She climbed again the next year.", "Early 1990s."]
        solution: "She first climbed Everest in 1992, and again in 1993."
        mistakes: {"1993": everest_twice}
      - prompt: "From which state does Santosh Yadav come?"
        options: ["Haryana", "Uttarakhand", "Himachal Pradesh", "Rajasthan"]
        answer: "Haryana"
        difficulty: 1
        hints: ["Rewari district.", "North Indian state near Delhi."]
        solution: "She is from Haryana."
      - prompt: "At what age did Maria Sharapova go to the USA to train?"
        answer: "9"
        check: "9"
        difficulty: 2
        hints: ["She was very young.", "Under ten."]
        solution: "She left for Florida at nine."
      - prompt: "Which sport does Maria Sharapova play?"
        options: ["Tennis", "Badminton", "Chess", "Football"]
        answer: "Tennis"
        difficulty: 1
        hints: ["Wimbledon.", "Rackets and a yellow ball."]
        solution: "She is a tennis player."
      - prompt: "At what age did Sharapova become world number one?"
        answer: "18"
        check: "18"
        difficulty: 3
        hints: ["In 2005.", "Just an adult."]
        solution: "She became world number one at 18."

  - code: cbse9e.u7.tree
    title: On Killing a Tree (Gieve Patel)
    after: [cbse9e.u7.reach]
    notes: |
      It takes much time to kill a tree; a simple jab of a knife won't do. The tree has grown slowly,
      consuming the earth, absorbing sunlight, air and water for years, and leprous hide (bark) sprouts
      leaves. Hacking and chopping won't do it: the bleeding bark heals, and twigs sprout again. 'The bole'
      must be pulled out, the roots exposed to sun and air: 'browning, hardening, twisting, withering', and
      then it is done. Ironic tone; theme of the strength of nature and human cruelty.
    explanations:
      text: "Gieve Patel describes, with bitter irony, how hard it is to kill a tree. Cutting it doesn't work: new shoots grow back. The only way is to pull out its roots, the source of its strength, and leave them to dry in the sun. The poem praises the tree's will to live and criticises how people destroy nature."
      visual: "Picture a tree cut down to a stump with tiny green shoots growing from it. Then picture it pulled out of the ground, its roots lying in the sun, turning brown and twisted."
      step_by_step: "Step 1: A knife won't kill a tree; it grew for years. Step 2: Chopping fails: new leaves sprout. Step 3: The roots must be pulled out. Step 4: Exposed to sun and air, they dry and wither. Step 5: The tone is ironic: the poet is against killing trees."
      real_world: "Banyan and neem trees cut by roadsides often sprout again from their stumps. That's the strength the poet describes."
    items:
      - prompt: "Who wrote 'On Killing a Tree'?"
        options: ["Gieve Patel", "James Kirkup", "W.B. Yeats", "Coates Kinney"]
        answer: "Gieve Patel"
        difficulty: 1
        hints: ["An Indian poet and doctor.", "Not Kirkup."]
        solution: "Gieve Patel."
        mistakes: {"James Kirkup": eng9_author}
      - prompt: "What must be done to kill a tree, according to the poem?"
        options: ["Pull out its roots", "Cut off its branches", "Stab it with a knife", "Paint its bark"]
        answer: "Pull out its roots"
        difficulty: 1
        hints: ["Cutting it doesn't work.", "The source of its strength."]
        solution: "The roots must be pulled out and left to dry."
        mistakes: {"Cut off its branches": tree_roots}
      - prompt: "What happens if the tree is only hacked and chopped?"
        options: ["New twigs and leaves sprout again", "It dies at once", "It turns to stone", "It falls into a river"]
        answer: "New twigs and leaves sprout again"
        difficulty: 2
        hints: ["The bark heals.", "It's very strong."]
        solution: "The tree heals and green twigs sprout again."
        mistakes: {"It dies at once": tree_roots}
      - prompt: "What is the tone of the poem?"
        options: ["Ironic, criticising the killing of trees", "Cheerful", "Instructional, encouraging tree cutting", "Funny"]
        answer: "Ironic, criticising the killing of trees"
        difficulty: 2
        hints: ["It sounds like instructions, but…", "The poet loves trees."]
        solution: "It is ironic: the 'instructions' show how cruel and difficult killing a tree is."
        mistakes: {"Instructional, encouraging tree cutting": eng9_poem_meaning}
      - prompt: "What happens to the exposed roots at the end?"
        options: ["They brown, harden, twist and wither", "They grow again", "They are planted elsewhere", "They turn green"]
        answer: "They brown, harden, twist and wither"
        difficulty: 1
        hints: ["Sun and air dry them.", "Four -ing words."]
        solution: "'Browning, hardening, twisting, withering': then it is done."
      - prompt: "Why does the poet describe the tree's growth in detail?"
        options: ["To show how long it took and how strong it is", "To teach botany", "To describe a forest", "To make the poem longer"]
        answer: "To show how long it took and how strong it is"
        difficulty: 3
        hints: ["It consumed the earth for years.", "Strength and patience."]
        solution: "He shows the tree's slow, strong growth so we see how wrong it is to destroy it."
