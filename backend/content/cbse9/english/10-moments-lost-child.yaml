subject: cbse9-eng
chapter: 10
title: 'Moments: The Lost Child'
concepts:
- code: cbse9e.m1.lost_child
  title: The Lost Child (Mulk Raj Anand)
  notes: |
    A child goes with his parents to a spring festival fair. On the way and at the fair he wants many things:
    toys, burfi from the sweetmeat seller, a garland of gulmohur flowers, coloured balloons, to listen to the
    snake-charmer and to ride the roundabout. Each time his parents refuse or he moves on, knowing they will
    say no. At the roundabout he turns and finds his parents gone. Lost in the crowd, he runs about crying. A
    kind man lifts him up and offers him the same things, a ride, music, balloons, a garland, sweets, but the
    child only sobs: 'I want my mother, I want my father!' Theme: a child's real need is his parents' love,
    not the things he wanted.
  explanations:
    text: 'A small boy at a village fair keeps asking for toys, sweets, balloons and a garland, and his parents keep saying no. When he gets separated from them in the crowd, a stranger offers him all those things for free. Now he wants none of them: he only wants his mother and father.'
    visual: 'Draw a crowded fair: a sweet stall, a balloon seller, a snake-charmer and a roundabout. Draw a small boy walking past each one and looking back. Then draw him alone in the middle of the crowd, crying, while a man holds out the very balloon he wanted earlier.'
    step_by_step: 'Step 1: The family walks to the spring fair. Step 2: The child wants toys, burfi, a garland, balloons, the snake-charmer''s music and a roundabout ride. Step 3: He loses his parents. Step 4: A man rescues him and offers him everything. Step 5: He refuses all of it and cries for his parents.'
    real_world: Many children who get lost in a busy railway station or mall stop caring about the shop windows. All that matters is finding the familiar face of a parent.
  picture:
    kind: flow
    steps:
    - Walking to the spring fair with his parents
    - Wants toys, burfi, a garland and balloons, but is told no
    - Stops at the snake-charmer and the roundabout
    - 'Turns round: his parents are gone'
    - A kind man offers him everything he wanted
    - 'He refuses it all: ''I want my mother, I want my father!'''
    alt: 'The story in six steps: the boy wants many things at the fair, gets lost, and then refuses everything a kind stranger offers because he only wants his parents.'
  items:
  - prompt: Who wrote 'The Lost Child'?
    options:
    - Mulk Raj Anand
    - Ruskin Bond
    - R.K. Laxman
    - O. Henry
    answer: Mulk Raj Anand
    difficulty: 1
    hints:
    - An Indian writer of English novels.
    - He also wrote 'Untouchable'.
    solution: Mulk Raj Anand.
    mistakes:
      Ruskin Bond: eng9_author
  - prompt: Where was the child going with his parents?
    options:
    - To a spring festival fair
    - To school
    - To a wedding
    - To the railway station
    answer: To a spring festival fair
    difficulty: 1
    hints:
    - It was spring.
    - There were stalls and a roundabout.
    solution: He was going with his parents to a spring festival fair.
  - prompt: What did the child want from the sweetmeat seller?
    options:
    - Burfi
    - Ice cream
    - Jalebi
    - Chocolate
    answer: Burfi
    difficulty: 1
    hints:
    - A milk sweet.
    - His favourite sweet.
    solution: He wanted burfi, his favourite sweet.
    mistakes:
      Jalebi: eng9_read_again
  - prompt: Where did the child realise he was lost?
    options:
    - At the roundabout
    - At the school gate
    - At the temple pond
    - In the mustard field
    answer: At the roundabout
    difficulty: 2
    hints:
    - He wanted a ride.
    - It was going round and round.
    solution: He was watching the roundabout and wanted a ride; when he turned, his parents were gone.
  - prompt: What did the child say when the man offered him sweets and balloons?
    options:
    - '''I want my mother, I want my father!'''
    - '''Thank you, I''ll take the balloon'''
    - '''Take me on the roundabout'''
    - '''I''m not lost'''
    answer: '''I want my mother, I want my father!'''
    difficulty: 2
    hints:
    - He no longer wanted anything from the fair.
    - He was sobbing.
    solution: He refused everything and sobbed, 'I want my mother, I want my father!'
  - prompt: What is the main message of the story?
    options:
    - A child's real need is his parents' love, not things
    - Fairs are dangerous places
    - Children should never ask for toys
    - Strangers are always unkind
    answer: A child's real need is his parents' love, not things
    difficulty: 3
    hints:
    - What did the child want at the end?
    - Compare the start with the end.
    solution: Once he was lost, all the things he had longed for meant nothing; only his parents mattered.
