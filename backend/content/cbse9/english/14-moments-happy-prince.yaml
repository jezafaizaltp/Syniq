subject: cbse9-eng
chapter: 14
title: 'Moments: The Happy Prince'
concepts:
- code: cbse9e.m5.happy_prince
  title: The Happy Prince (Oscar Wilde)
  notes: |
    A statue of the Happy Prince stands high above the city, gilded with fine gold leaf, with two sapphires
    for eyes and a large ruby on his sword-hilt. When alive he lived in the Palace of Sans-Souci and never saw
    sorrow; now he sees the city's misery and weeps. A swallow, late flying to Egypt, shelters at his feet.
    The Prince asks him to take the ruby to a poor seamstress with a sick son, one sapphire to a young
    playwright too cold and hungry to write, and the other to a little match-girl. Now blind, the Prince asks
    the swallow to give his gold leaf to the poor. The swallow stays, dies of cold, and the Prince's lead heart
    snaps. The town pulls down the shabby statue and melts it, but the broken lead heart will not melt. God
    asks an angel for the two most precious things in the city; the angel brings the lead heart and the dead bird.
  explanations:
    text: A golden statue of a prince sees the suffering of the poor and, with the help of a little swallow, gives away his ruby, his sapphire eyes and his gold leaf. The swallow dies of cold, the prince's heart breaks, and the town throws them away, but God calls the heart and the bird the two most precious things in the city.
    visual: Draw a tall golden statue with blue jewel eyes and a red ruby on its sword. Draw a swallow carrying the ruby to a seamstress, a sapphire to a writer in an attic and another to a match-girl. Finally draw the dull grey statue, now blind, with the swallow lying at its feet.
    step_by_step: 'Step 1: The statue''s jewels and gold. Step 2: The swallow on its way to Egypt. Step 3: The ruby to the seamstress, a sapphire to the playwright, a sapphire to the match-girl. Step 4: The gold leaf to the poor; the swallow dies and the lead heart breaks. Step 5: The angel brings God the heart and the bird.'
    real_world: People who give away what they value, their time, money or comfort, to help others are often not noticed by the world. The story says such kindness is the most precious thing of all.
  picture:
    kind: flow
    steps:
    - A golden statue with sapphire eyes and a ruby sees the city's poor
    - The swallow takes the ruby to a seamstress with a sick son
    - One sapphire goes to a young playwright, the other to a match-girl
    - The gold leaf is given to the poor; the swallow dies of cold
    - The lead heart breaks and will not melt
    - The angel brings God the lead heart and the dead bird
    alt: 'The Happy Prince in six steps: the statue gives away its ruby, sapphires and gold through the swallow, both die, and God calls them the most precious things in the city.'
  items:
  - prompt: Who wrote 'The Happy Prince'?
    options:
    - Oscar Wilde
    - O. Henry
    - Anton Chekhov
    - Ruskin Bond
    answer: Oscar Wilde
    difficulty: 1
    hints:
    - An Irish writer.
    - He also wrote fairy tales like 'The Selfish Giant'.
    solution: Oscar Wilde.
    mistakes:
      O. Henry: eng9_author
  - prompt: What were the statue's eyes made of?
    options:
    - Sapphires
    - Rubies
    - Diamonds
    - Glass
    answer: Sapphires
    difficulty: 1
    hints:
    - Blue jewels.
    - The ruby was on his sword-hilt.
    solution: His eyes were two bright sapphires.
    mistakes:
      Rubies: eng9_read_again
  - prompt: Where was the swallow going?
    options:
    - Egypt
    - India
    - England
    - China
    answer: Egypt
    difficulty: 1
    hints:
    - Where it is warm in winter.
    - His friends had gone ahead.
    solution: The swallow was flying to Egypt for the winter.
  - prompt: To whom did the swallow take the ruby?
    options:
    - A poor seamstress with a sick son
    - A match-girl
    - A young playwright
    - The mayor
    answer: A poor seamstress with a sick son
    difficulty: 2
    hints:
    - Her boy had a fever.
    - She was sewing a gown.
    solution: The ruby went to a poor seamstress whose little son was ill.
  - prompt: Why did the Prince's lead heart break?
    options:
    - The swallow died at his feet
    - The townspeople hit it
    - He lost his ruby
    - Lightning struck it
    answer: The swallow died at his feet
    difficulty: 2
    hints:
    - The swallow stayed too long in the cold.
    - He had grown to love the bird.
    solution: When the swallow died of cold, the Prince's lead heart snapped in two.
  - prompt: What did the angel bring God as the two most precious things?
    options:
    - The lead heart and the dead bird
    - The ruby and the sapphires
    - The gold leaf and the sword
    - The statue and the pillar
    answer: The lead heart and the dead bird
    difficulty: 3
    hints:
    - The town threw them away.
    - Think about what was valuable for its kindness.
    solution: The angel brought the broken lead heart and the dead swallow.
