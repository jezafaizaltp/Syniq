# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 5: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 5
title: The World of Limitless Possibilities · Nine Gold Medals
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_ability: "'Beyond disability' means looking past what someone can't do."
  e9_nine_golds: "Why would the judges give a gold to everyone? Think about how they finished."
  e9_paralympic_year: "Deepa Malik won her medal at the Rio Paralympics."
  e9_runners: "Count the runners at the starting line in the poem."
  e9_setbacks: "Deepa Malik's story is about turning a setback into a new start."
  e9_stumbled: "Something happened to one runner that made the others stop and help."
  e9_tumour_age: "Look in the interview for her age when the tumour was found. She was a young adult."
  e9_unit_link_sport: "Both texts are about athletes with disabilities and what matters in sport."
  c9e5_fact: Go back to the facts in the interview. What year, event, age or award does it name?
  c9e5_attitude: Think about how Deepa Malik responded to paralysis. Did she focus on what she lost or on what she could still do?
  c9e5_turning_point: Look at the moment in the poem when the race changes. What did the other runners choose to do?
  c9e5_winning: Ask what the poem says winning really means. Is it being first, or something more?

concepts:
  - code: cbse9k.u5.deepa
    title: The World of Limitless Possibilities (an interview with Deepa Malik)
    notes: |
      An interview with Dr Deepa Malik, India's para-athlete. At 29 she was found to have a spinal tumour, and
      surgery left her paralysed below the waist. Instead of giving up, she took up sports: swimming, then para
      athletics. At the 2016 Rio Paralympics she won a silver medal in shot put, becoming the first Indian woman
      to win a Paralympic medal. She also became the first Indian woman para-athlete to win an Asian Games medal
      in athletics, and has received the Padma Shri, the Arjuna Award and the Khel Ratna. She speaks of 'ability
      beyond disability': focusing on what one can do, and on society seeing the abilities of persons with
      disabilities. She works for their emotional well-being and for women's empowerment through outdoor
      sports. Message: setbacks can become stepping stones.
    explanations:
      text: "At 29, Deepa Malik lost the use of her legs after surgery for a spinal tumour. She turned to sport, and in 2016 became the first Indian woman to win a Paralympic medal, a silver in shot put at Rio. In the interview she explains that a disability does not limit a person's possibilities."
      visual: "Picture a timeline: age 29, a hospital bed; then a swimming pool; then a shot-put circle with Deepa in her wheelchair throwing; then a podium in Rio with a silver medal."
      step_by_step: "Step 1: Diagnosis at 29 and paralysis. Step 2: Choosing sport over giving up. Step 3: Swimming, then para athletics. Step 4: Rio 2016 silver in shot put. Step 5: Her message: ability beyond disability."
      real_world: "India's para-athletes won 29 medals at the 2024 Paris Paralympics, showing how far para sport has grown since Deepa Malik's first medal."
    activity:
      type: order
      prompt: 'Deepa Malik: put her journey in order.'
      steps:
      - A spinal tumour is found at 29
      - Surgery leaves her paralysed below the waist
      - She takes up swimming
      - She moves on to para athletics
      - Silver in shot put at Rio 2016
      reasons:
        Surgery leaves her paralysed below the waist: The tumour has to be removed first.
        She takes up swimming: After surgery, she chooses sport instead of giving up.
        She moves on to para athletics: Swimming built her confidence for more sport.
        Silver in shot put at Rio 2016: Years of athletics training lead to the Paralympics.
    lesson:
      - teach: 'This lesson is an interview with Dr Deepa Malik, India''s para-athlete. At 29 she was found to have a spinal tumour, and surgery left her paralysed below the waist. Instead of giving up, she took up sport: first swimming, then para athletics.'
        check:
          prompt: What did Deepa Malik do after her surgery?
          options:
          - Took up sport
          - Stopped going out
          - Moved abroad
          answer: Took up sport
          why: She turned to swimming and athletics.
      - teach: At the 2016 Rio Paralympics she won silver in shot put, the first Indian woman to win a Paralympic medal. She was also the first Indian woman para-athlete to win an Asian Games medal in athletics, and has received the Padma Shri, the Arjuna Award and the Khel Ratna.
        picture:
          kind: flow
          steps:
          - 'Age 29: spinal tumour'
          - Paralysed below the waist
          - Swimming, then athletics
          - '2016 Rio: silver in shot put'
          - Padma Shri, Arjuna, Khel Ratna
          alt: Deepa Malik's journey from her illness at 29 to a Paralympic silver in 2016 and national awards.
        check:
          prompt: Which event did she win silver in at Rio?
          options:
          - Shot put
          - Swimming
          - Javelin
          answer: Shot put
          why: She won silver in shot put in 2016.
      - teach: 'She speaks of ''ability beyond disability'': focus on what a person can do, and let society see the abilities of persons with disabilities. She works for their emotional well-being and for women''s empowerment through outdoor sports. Her message: setbacks can become stepping stones.'
        check:
          prompt: '''Setbacks can become stepping stones'' means…'
          options:
          - Difficulties can lead to new growth
          - Stones are dangerous
          - Never try again
          answer: Difficulties can lead to new growth
          why: A setback can be the start of something new.
    items:
      - prompt: "In which event did Deepa Malik win a silver medal at the 2016 Rio Paralympics?"
        options: ["Shot put", "Swimming", "Javelin", "Archery"]
        answer: "Shot put"
        difficulty: 1
        hints: ["A throwing event.", "A heavy metal ball."]
        solution: "Step 1: Her Rio medal was in a throwing event. Step 2: It was shot put."
        mistakes: {"Javelin": eng9_read_again, "Swimming": eng9_read_again}
      - prompt: "In which year did Deepa Malik win her Paralympic medal?"
        answer: "2016"
        check: "2016"
        difficulty: 1
        hints: ["The Rio Paralympics.", "Four years before Tokyo."]
        solution: "Step 1: Her medal came at Rio. Step 2: Rio hosted the Games in 2016."
        mistakes: {"2012": "e9_paralympic_year", "2020": "e9_paralympic_year"}
      - prompt: "At what age was Deepa Malik's spinal tumour found?"
        answer: "29"
        check: "29"
        difficulty: 1
        hints: ["Late twenties.", "One less than thirty."]
        solution: "Step 1: The interview gives her age at diagnosis. Step 2: She was 29."
        mistakes: {"19": "e9_tumour_age", "39": "e9_tumour_age"}
      - prompt: "Why is Deepa Malik's medal historic?"
        options: ["She was the first Indian woman to win a Paralympic medal", "She was the youngest athlete ever", "It was India's first Olympic medal", "She won it without training"]
        answer: "She was the first Indian woman to win a Paralympic medal"
        difficulty: 2
        hints: ["A first for Indian women.", "Paralympics, not Olympics."]
        solution: "Step 1: No Indian woman had won a Paralympic medal before. Step 2: Her 2016 silver was the first."
        mistakes: {"It was India's first Olympic medal": eng9_read_again}
      - prompt: "What does 'ability beyond disability' mean?"
        options: ["Focus on what a person can do, not on what they cannot", "Disabled people should not play sport", "Ability is fixed at birth", "Disability always stops success"]
        answer: "Focus on what a person can do, not on what they cannot"
        difficulty: 2
        hints: ["Look at strengths.", "Her own life shows it."]
        solution: "Step 1: Deepa looks at strengths, not limits. Step 2: The phrase means abilities matter more than a disability."
        mistakes: {"Ability is fixed at birth": "e9_ability"}
      - prompt: "Which of these is the best lesson from the interview?"
        options: ["Setbacks can become stepping stones", "Never try new things after an illness", "Sport is only for the young", "Medals matter more than people"]
        answer: "Setbacks can become stepping stones"
        difficulty: 3
        hints: ["Her paralysis led her to sport.", "Turning a problem into a path."]
        solution: "Step 1: Her paralysis could have ended her dreams. Step 2: She turned it into a new start in sport: setbacks became stepping stones."
        mistakes: {"Never try new things after an illness": "e9_setbacks"}
      - prompt: What kind of text is 'The World of Limitless Possibilities'?
        options:
        - An interview
        - A poem
        - A play
        - A fable
        answer: An interview
        difficulty: 1
        hints:
        - Questions are asked and answered.
        - A real person speaks.
        solution: It is an interview with Deepa Malik.
        mistakes:
          A poem: c9e5_fact
      - prompt: What was the first sport Deepa Malik took up after her surgery?
        options:
        - Swimming
        - Shot put
        - Cricket
        - Chess
        answer: Swimming
        difficulty: 2
        hints:
        - It came before athletics.
        - It is done in water.
        solution: She began with swimming and then moved to para athletics.
        mistakes:
          Shot put: c9e5_fact
      - prompt: Which of these awards has Deepa Malik received?
        options:
        - Khel Ratna
        - Nobel Prize
        - Oscar
        - Booker Prize
        answer: Khel Ratna
        difficulty: 1
        hints:
        - It is a sports award.
        - India's highest sports honour.
        solution: She has received the Khel Ratna, along with the Arjuna Award and Padma Shri.
        mistakes:
          Nobel Prize: c9e5_fact
      - prompt: Which word best describes Deepa Malik's response to her paralysis?
        options:
        - Courageous
        - Hopeless
        - Careless
        - Jealous
        answer: Courageous
        difficulty: 1
        hints:
        - She did not give up.
        - She took on new challenges.
        solution: 'She faced her situation bravely and became a champion: courageous.'
        mistakes:
          Hopeless: c9e5_attitude
      - prompt: What does 'empowerment' mean?
        options:
        - Gaining the strength and confidence to control one's life
        - Losing power
        - Electric power
        - Obeying others
        answer: Gaining the strength and confidence to control one's life
        difficulty: 2
        hints:
        - Em- means to put into.
        - Power plus confidence.
        solution: Empowerment means becoming stronger and more in control of one's own life.
        mistakes:
          Electric power: c9e1_word_meaning
      - prompt: 'Change to reported speech: She said, ''I never gave up.'''
        options:
        - She said that she had never given up.
        - She said that I never gave up.
        - She says she never give up.
        - She said never give up I.
        answer: She said that she had never given up.
        difficulty: 3
        hints:
        - '''I'' becomes ''she''.'
        - Simple past becomes past perfect.
        solution: 'Step 1: Change ''I'' to ''she''. Step 2: ''gave up'' becomes ''had given up''.'
        mistakes:
          She said that I never gave up.: c9e1_grammar
      - prompt: Which outlook does 'ability beyond disability' encourage?
        options:
        - Seeing what people can do
        - Pitying people with disabilities
        - Ignoring people with disabilities
        - Thinking sport is only for some
        answer: Seeing what people can do
        difficulty: 2
        hints:
        - Ability comes first in the phrase.
        - Focus on strengths.
        solution: It asks us to look at abilities, not limitations.
        mistakes:
          Pitying people with disabilities: c9e5_attitude
      - prompt: Where were the 2016 Paralympics held?
        options:
        - Rio de Janeiro
        - Tokyo
        - London
        - Beijing
        answer: Rio de Janeiro
        difficulty: 1
        hints:
        - In Brazil.
        - Often shortened to 'Rio'.
        solution: The 2016 Paralympics were in Rio de Janeiro, Brazil.
        mistakes:
          Tokyo: c9e5_fact
      - prompt: Why does Deepa Malik promote outdoor sports for women?
        options:
        - To build their confidence and strength
        - To keep them at home
        - To win money only
        - Because indoor games are banned
        answer: To build their confidence and strength
        difficulty: 2
        hints:
        - Think of empowerment.
        - Sport builds more than muscles.
        solution: Sport helps women grow in confidence, health and independence.
        mistakes:
          To keep them at home: c9e5_attitude
  - code: cbse9k.u5.medals
    title: Nine Gold Medals (David Roth)
    after: [cbse9k.u5.deepa]
    notes: |
      A narrative poem by David Roth, often sung as a song, based on a race at a games for athletes with
      disabilities. Nine runners line up for the hundred-yard dash, each hoping to win a gold medal. During the
      race one young runner stumbles and falls. Hearing his cry, the other eight stop, turn back and help him up,
      and they all cross the finish line together, arm in arm. The crowd stands and cheers, and the organisers
      give all nine runners gold medals. Message: kindness, friendship and fair play are a greater victory than
      winning alone.
    explanations:
      text: "Nine athletes race for gold. One falls. Instead of rushing to win, the other eight go back, lift him up and finish together. The crowd cheers, and all nine get gold medals: kindness wins the race."
      visual: "Picture a running track: one runner on the ground, eight others turning back towards him, then all nine crossing the finish line holding hands as the stands rise to cheer."
      step_by_step: "Step 1: Nine runners start the race. Step 2: One stumbles and falls. Step 3: The others stop and go back. Step 4: They help him up and finish together. Step 5: All nine get gold medals."
      real_world: "In sport we sometimes see runners help a fallen rival to the finish line; these moments are remembered longer than the winning times."
    activity:
      type: order
      prompt: 'Nine Gold Medals: put the race in order.'
      steps:
      - Nine runners line up for the hundred-yard dash
      - One young runner stumbles and falls
      - The other eight hear his cry and turn back
      - They help him up and cross the line together
      - All nine get gold medals
      reasons:
        One young runner stumbles and falls: The race must start before anyone can fall.
        The other eight hear his cry and turn back: His fall and cry make them stop.
        They help him up and cross the line together: They turn back to help, then finish as one.
        All nine get gold medals: The organisers reward their kindness, not speed.
    lesson:
      - teach: '''Nine Gold Medals'' by David Roth is a narrative poem, often sung, based on a race at a games for athletes with disabilities. Nine runners line up for the hundred-yard dash, each hoping to win gold.'
        check:
          prompt: A poem that tells a story is a…
          options:
          - Narrative poem
          - Recipe
          - Letter
          answer: Narrative poem
          why: It has characters and events.
      - teach: During the race, one young runner stumbles and falls. Hearing his cry, the other eight stop, turn back and help him up. They all cross the finish line together, arm in arm. The crowd stands and cheers, and the organisers give all nine runners gold medals.
        picture:
          kind: flow
          steps:
          - Nine runners start
          - One stumbles and falls
          - Eight turn back to help
          - All finish arm in arm
          - Nine gold medals
          alt: 'The poem''s story: nine runners start, one falls, the others go back, all finish together and all get gold.'
        check:
          prompt: What did the eight runners do when one fell?
          options:
          - Went back and helped him
          - Ran faster
          - Left the track
          answer: Went back and helped him
          why: Kindness mattered more than winning.
      - teach: 'Message: kindness, friendship and fair play are a greater victory than winning alone. It links with Deepa Malik''s interview: both show the spirit of athletes with disabilities and what truly matters in sport.'
        check:
          prompt: What is the true victory in the poem?
          options:
          - Kindness and togetherness
          - Coming first
          - Breaking a record
          answer: Kindness and togetherness
          why: That is why all nine got gold.
    items:
      - prompt: "Who wrote 'Nine Gold Medals'?"
        options: ["David Roth", "Charles Swain", "Rabindranath Tagore", "Maya Anthony"]
        answer: "David Roth"
        difficulty: 1
        hints: ["A singer-songwriter.", "Unit 5."]
        solution: "Step 1: The poem is also a song. Step 2: It is by David Roth."
        mistakes: {"Charles Swain": eng9_author}
      - prompt: "How many runners were in the race?"
        answer: "9"
        check: "9"
        difficulty: 1
        hints: ["Look at the title.", "One medal each."]
        solution: "Step 1: The title is Nine Gold Medals. Step 2: There were nine runners."
        mistakes: {"8": "e9_runners", "10": "e9_runners"}
      - prompt: "What happened to one runner during the race?"
        options: ["He stumbled and fell", "He won easily", "He left the stadium", "He ran the wrong way"]
        answer: "He stumbled and fell"
        difficulty: 1
        hints: ["The others heard him cry out.", "On the track."]
        solution: "Step 1: Midway, a runner tripped. Step 2: He stumbled and fell."
        mistakes: {"He won easily": "e9_stumbled"}
      - prompt: "What did the other runners do when he fell?"
        options: ["They went back, helped him up and finished together", "They ran faster to win", "They laughed at him", "They stopped the race and left"]
        answer: "They went back, helped him up and finished together"
        difficulty: 2
        hints: ["They gave up the chance to win alone.", "Arm in arm."]
        solution: "Step 1: The eight runners turned back. Step 2: They helped him up and crossed the line together."
        mistakes: {"They ran faster to win": eng9_poem_meaning}
      - prompt: "Why were nine gold medals given?"
        options: ["Because all the runners finished together as one", "Because there were extra medals", "Because nobody finished", "Because the judges made a mistake"]
        answer: "Because all the runners finished together as one"
        difficulty: 2
        hints: ["No one came first alone.", "They crossed the line together."]
        solution: "Step 1: All nine crossed the finish line at the same moment. Step 2: So all nine were winners."
        mistakes: {"Because there were extra medals": "e9_nine_golds"}
      - prompt: "How does this poem connect with Deepa Malik's interview?"
        options: ["Both show the spirit of athletes with disabilities and what truly matters in sport", "Both are about cricket", "Both describe losing hope", "They have no connection"]
        answer: "Both show the spirit of athletes with disabilities and what truly matters in sport"
        difficulty: 3
        hints: ["Para sport.", "Courage and kindness."]
        solution: "Step 1: Deepa Malik shows determination in para sport. Step 2: The poem shows kindness in a race of athletes with disabilities. Both show the true spirit of sport."
        mistakes: {"They have no connection": "e9_unit_link_sport"}
      - prompt: How long was the race in the poem?
        options:
        - A hundred-yard dash
        - A marathon
        - A mile
        - A relay of four laps
        answer: A hundred-yard dash
        difficulty: 1
        hints:
        - It is a short sprint.
        - Measured in yards.
        solution: The runners lined up for the hundred-yard dash.
        mistakes:
          A marathon: c9e5_turning_point
      - prompt: How many runners went back to help the one who fell?
        answer: 8
        check: 9 - 1
        difficulty: 1
        hints:
        - There were nine in all.
        - One had fallen.
        solution: 'Step 1: 9 runners in all. Step 2: 9 − 1 = 8 went back.'
        mistakes:
          '9': c9e5_turning_point
      - prompt: How did the crowd react at the end?
        options:
        - It stood and cheered
        - It booed
        - It left quietly
        - It laughed at the fallen runner
        answer: It stood and cheered
        difficulty: 1
        hints:
        - They were moved.
        - Think of applause.
        solution: The crowd rose and cheered the runners' kindness.
        mistakes:
          It booed: c9e5_winning
      - prompt: What did the runners give up by turning back?
        options:
        - Their own chance to win alone
        - Their shoes
        - Their medals
        - Nothing
        answer: Their own chance to win alone
        difficulty: 2
        hints:
        - Each hoped to win gold.
        - Turning back cost them the lead.
        solution: By helping, each gave up the chance of being the sole winner.
        mistakes:
          Nothing: c9e5_winning
      - prompt: Which value does the poem praise most?
        options:
        - Compassion
        - Greed
        - Speed only
        - Pride
        answer: Compassion
        difficulty: 1
        hints:
        - They cared for the fallen runner.
        - Feeling for others.
        solution: Compassion, care for another's pain, moved the runners to help.
        mistakes:
          Speed only: c9e5_winning
      - prompt: 'Choose the correct past tense: ''One runner ___ and fell.'''
        options:
        - stumbled
        - stumble
        - stumbling
        - stumbles yesterday
        answer: stumbled
        difficulty: 1
        hints:
        - Past action.
        - Matches 'fell'.
        solution: 'Simple past: ''stumbled'', to match ''fell''.'
        mistakes:
          stumbles yesterday: c9e1_grammar
      - prompt: Why is the poem often sung?
        options:
        - It has rhythm and a story, like a ballad
        - It has no words
        - It is in a foreign language
        - It is very short
        answer: It has rhythm and a story, like a ballad
        difficulty: 2
        hints:
        - David Roth is also a songwriter.
        - Story poems often become songs.
        solution: Its rhythm and storytelling make it work as a song.
        mistakes:
          It has no words: c9e5_turning_point
      - prompt: '''Arm in arm'' shows that the runners were…'
        options:
        - United and together
        - Fighting
        - Racing against each other
        - Lost
        answer: United and together
        difficulty: 2
        hints:
        - Picture linked arms.
        - How did they cross the line?
        solution: Linking arms shows unity and friendship.
        mistakes:
          Racing against each other: c9e5_winning
      - prompt: If you were the organiser, why would giving nine golds be fair?
        options:
        - All runners showed the true spirit of sport together
        - It saved money
        - Nobody finished
        - They asked for it
        answer: All runners showed the true spirit of sport together
        difficulty: 3
        hints:
        - Who won what?
        - What does sport celebrate?
        solution: 'Step 1: They finished together. Step 2: Each showed the spirit of fair play, so all deserved gold.'
        mistakes:
          It saved money: c9e5_winning
