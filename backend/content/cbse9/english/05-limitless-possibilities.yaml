# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 5: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 5
title: The World of Limitless Possibilities · Nine Gold Medals
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."

concepts:
  - code: cbse9k.u5.deepa
    title: The World of Limitless Possibilities (an interview with Deepa Malik)
    notes: |
      An interview with Dr Deepa Malik, India's para-athlete. At 29 she was found to have a spinal tumour, and
      surgery left her paralysed below the waist. Instead of giving up, she took up sports: swimming, then para
      athletics. At the 2016 Rio Paralympics she won a silver medal in shot put, becoming the first Indian woman
      to win a Paralympic medal. She also became the first Indian woman para-athlete to win an Asian Games medal
      in athletics, and has received the Padma Shri, the Arjuna Award and the Khel Ratna. She speaks of 'ability
      beyond disability': focusing on what one can do, and on society seeing the abilities of persons with
      disabilities. She works for their emotional well-being and for women's empowerment through outdoor
      sports. Message: setbacks can become stepping stones.
    explanations:
      text: "At 29, Deepa Malik lost the use of her legs after surgery for a spinal tumour. She turned to sport, and in 2016 became the first Indian woman to win a Paralympic medal, a silver in shot put at Rio. In the interview she explains that a disability does not limit a person's possibilities."
      visual: "Picture a timeline: age 29, a hospital bed; then a swimming pool; then a shot-put circle with Deepa in her wheelchair throwing; then a podium in Rio with a silver medal."
      step_by_step: "Step 1: Diagnosis at 29 and paralysis. Step 2: Choosing sport over giving up. Step 3: Swimming, then para athletics. Step 4: Rio 2016 silver in shot put. Step 5: Her message: ability beyond disability."
      real_world: "India's para-athletes won 29 medals at the 2024 Paris Paralympics, showing how far para sport has grown since Deepa Malik's first medal."
    activity:
      type: order
      prompt: 'Deepa Malik: put her journey in order.'
      steps:
      - A spinal tumour is found at 29
      - Surgery leaves her paralysed below the waist
      - She takes up swimming
      - She moves on to para athletics
      - Silver in shot put at Rio 2016
      reasons:
        Surgery leaves her paralysed below the waist: The tumour has to be removed first.
        She takes up swimming: After surgery, she chooses sport instead of giving up.
        She moves on to para athletics: Swimming built her confidence for more sport.
        Silver in shot put at Rio 2016: Years of athletics training lead to the Paralympics.
    items:
      - prompt: "In which event did Deepa Malik win a silver medal at the 2016 Rio Paralympics?"
        options: ["Shot put", "Swimming", "Javelin", "Archery"]
        answer: "Shot put"
        difficulty: 1
        hints: ["A throwing event.", "A heavy metal ball."]
        solution: "Step 1: Her Rio medal was in a throwing event. Step 2: It was shot put."
        mistakes: {"Javelin": eng9_read_again, "Swimming": eng9_read_again}
      - prompt: "In which year did Deepa Malik win her Paralympic medal?"
        answer: "2016"
        check: "2016"
        difficulty: 1
        hints: ["The Rio Paralympics.", "Four years before Tokyo."]
        solution: "Step 1: Her medal came at Rio. Step 2: Rio hosted the Games in 2016."
      - prompt: "At what age was Deepa Malik's spinal tumour found?"
        answer: "29"
        check: "29"
        difficulty: 1
        hints: ["Late twenties.", "One less than thirty."]
        solution: "Step 1: The interview gives her age at diagnosis. Step 2: She was 29."
      - prompt: "Why is Deepa Malik's medal historic?"
        options: ["She was the first Indian woman to win a Paralympic medal", "She was the youngest athlete ever", "It was India's first Olympic medal", "She won it without training"]
        answer: "She was the first Indian woman to win a Paralympic medal"
        difficulty: 2
        hints: ["A first for Indian women.", "Paralympics, not Olympics."]
        solution: "Step 1: No Indian woman had won a Paralympic medal before. Step 2: Her 2016 silver was the first."
        mistakes: {"It was India's first Olympic medal": eng9_read_again}
      - prompt: "What does 'ability beyond disability' mean?"
        options: ["Focus on what a person can do, not on what they cannot", "Disabled people should not play sport", "Ability is fixed at birth", "Disability always stops success"]
        answer: "Focus on what a person can do, not on what they cannot"
        difficulty: 2
        hints: ["Look at strengths.", "Her own life shows it."]
        solution: "Step 1: Deepa looks at strengths, not limits. Step 2: The phrase means abilities matter more than a disability."
      - prompt: "Which of these is the best lesson from the interview?"
        options: ["Setbacks can become stepping stones", "Never try new things after an illness", "Sport is only for the young", "Medals matter more than people"]
        answer: "Setbacks can become stepping stones"
        difficulty: 3
        hints: ["Her paralysis led her to sport.", "Turning a problem into a path."]
        solution: "Step 1: Her paralysis could have ended her dreams. Step 2: She turned it into a new start in sport: setbacks became stepping stones."
  - code: cbse9k.u5.medals
    title: Nine Gold Medals (David Roth)
    after: [cbse9k.u5.deepa]
    notes: |
      A narrative poem by David Roth, often sung as a song, based on a race at a games for athletes with
      disabilities. Nine runners line up for the hundred-yard dash, each hoping to win a gold medal. During the
      race one young runner stumbles and falls. Hearing his cry, the other eight stop, turn back and help him up,
      and they all cross the finish line together, arm in arm. The crowd stands and cheers, and the organisers
      give all nine runners gold medals. Message: kindness, friendship and fair play are a greater victory than
      winning alone.
    explanations:
      text: "Nine athletes race for gold. One falls. Instead of rushing to win, the other eight go back, lift him up and finish together. The crowd cheers, and all nine get gold medals: kindness wins the race."
      visual: "Picture a running track: one runner on the ground, eight others turning back towards him, then all nine crossing the finish line holding hands as the stands rise to cheer."
      step_by_step: "Step 1: Nine runners start the race. Step 2: One stumbles and falls. Step 3: The others stop and go back. Step 4: They help him up and finish together. Step 5: All nine get gold medals."
      real_world: "In sport we sometimes see runners help a fallen rival to the finish line; these moments are remembered longer than the winning times."
    activity:
      type: order
      prompt: 'Nine Gold Medals: put the race in order.'
      steps:
      - Nine runners line up for the hundred-yard dash
      - One young runner stumbles and falls
      - The other eight hear his cry and turn back
      - They help him up and cross the line together
      - All nine get gold medals
      reasons:
        One young runner stumbles and falls: The race must start before anyone can fall.
        The other eight hear his cry and turn back: His fall and cry make them stop.
        They help him up and cross the line together: They turn back to help, then finish as one.
        All nine get gold medals: The organisers reward their kindness, not speed.
    items:
      - prompt: "Who wrote 'Nine Gold Medals'?"
        options: ["David Roth", "Charles Swain", "Rabindranath Tagore", "Maya Anthony"]
        answer: "David Roth"
        difficulty: 1
        hints: ["A singer-songwriter.", "Unit 5."]
        solution: "Step 1: The poem is also a song. Step 2: It is by David Roth."
        mistakes: {"Charles Swain": eng9_author}
      - prompt: "How many runners were in the race?"
        answer: "9"
        check: "9"
        difficulty: 1
        hints: ["Look at the title.", "One medal each."]
        solution: "Step 1: The title is Nine Gold Medals. Step 2: There were nine runners."
      - prompt: "What happened to one runner during the race?"
        options: ["He stumbled and fell", "He won easily", "He left the stadium", "He ran the wrong way"]
        answer: "He stumbled and fell"
        difficulty: 1
        hints: ["The others heard him cry out.", "On the track."]
        solution: "Step 1: Midway, a runner tripped. Step 2: He stumbled and fell."
      - prompt: "What did the other runners do when he fell?"
        options: ["They went back, helped him up and finished together", "They ran faster to win", "They laughed at him", "They stopped the race and left"]
        answer: "They went back, helped him up and finished together"
        difficulty: 2
        hints: ["They gave up the chance to win alone.", "Arm in arm."]
        solution: "Step 1: The eight runners turned back. Step 2: They helped him up and crossed the line together."
        mistakes: {"They ran faster to win": eng9_poem_meaning}
      - prompt: "Why were nine gold medals given?"
        options: ["Because all the runners finished together as one", "Because there were extra medals", "Because nobody finished", "Because the judges made a mistake"]
        answer: "Because all the runners finished together as one"
        difficulty: 2
        hints: ["No one came first alone.", "They crossed the line together."]
        solution: "Step 1: All nine crossed the finish line at the same moment. Step 2: So all nine were winners."
      - prompt: "How does this poem connect with Deepa Malik's interview?"
        options: ["Both show the spirit of athletes with disabilities and what truly matters in sport", "Both are about cricket", "Both describe losing hope", "They have no connection"]
        answer: "Both show the spirit of athletes with disabilities and what truly matters in sport"
        difficulty: 3
        hints: ["Para sport.", "Courage and kindness."]
        solution: "Step 1: Deepa Malik shows determination in para sport. Step 2: The poem shows kindness in a race of athletes with disabilities. Both show the true spirit of sport."
