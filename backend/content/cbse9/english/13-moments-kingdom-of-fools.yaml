title: 'Moments: In the Kingdom of Fools'
concepts:
- code: cbse9e.m4.fools
  title: In the Kingdom of Fools (A.K. Ramanujan, Kannada folktale)
  notes: |
    In the Kingdom of Fools the king and his minister are idiots. They order everyone to sleep by day and work
    by night. A guru and his disciple arrive; everything costs a single duddu, so the disciple wants to stay,
    though the guru warns that fools are unpredictable. A thief dies when a merchant's wall falls on him. The
    king blames the merchant, who blames the bricklayer, who blames a dancing girl, who blames a goldsmith.
    The goldsmith is sentenced to death, but he is too thin for the stake, so the king orders a fat man to be
    found: the disciple, grown fat on cheap food. The guru tells the disciple to argue to be executed first,
    and the guru argues too, saying whoever dies on this stake will be reborn a king. The king and minister
    secretly go to the stake themselves and die. The people make the guru king and the disciple minister.
  explanations:
    text: In a kingdom where the king and minister are fools, night is day and everything costs one duddu. After a silly chain of blame, a fat stranger, the disciple, is to be executed. His wise guru tricks the foolish king into believing whoever dies on that stake will be reborn a king, so the king and minister go to the stake themselves.
    visual: 'Draw a chain of people, each pointing at the next: the merchant points at the bricklayer, the bricklayer at the dancing girl, the dancing girl at the goldsmith. Then draw a stake that is too big for the thin goldsmith, and a plump disciple being led towards it, with the clever guru whispering a plan.'
    step_by_step: 'Step 1: The foolish rules: sleep by day, work by night; everything costs a duddu. Step 2: The disciple stays to eat cheap food. Step 3: A wall kills a thief and the blame passes along a chain. Step 4: The fat disciple is chosen for the stake. Step 5: The guru''s trick makes the king and minister die on it, and the guru becomes king.'
    real_world: Some systems blame whoever is easiest to catch rather than whoever is responsible. The story laughs at rulers who act without thinking.
  picture:
    kind: flow
    steps:
    - 'Fools'' rules: work at night, sleep by day; everything costs one duddu'
    - The disciple stays for the cheap food, against the guru's advice
    - A wall kills a thief; the blame passes from person to person
    - The goldsmith is too thin for the stake, so the fat disciple is chosen
    - The guru says whoever dies on the stake will be reborn a king
    - The king and minister go to the stake; the guru becomes king
    alt: The folktale in six steps, from the kingdom's foolish rules and the chain of blame to the guru's trick that ends with the king and minister dying on the stake.
  items:
  - prompt: Who retold 'In the Kingdom of Fools'?
    options:
    - A.K. Ramanujan
    - Oscar Wilde
    - Anton Chekhov
    - R.K. Laxman
    answer: A.K. Ramanujan
    difficulty: 1
    hints:
    - He collected Indian folktales.
    - This one is from Kannada.
    solution: A.K. Ramanujan, who collected folktales.
    mistakes:
      R.K. Laxman: eng9_author
  - prompt: What were the first two orders in the Kingdom of Fools?
    options:
    - Sleep by day and work by night
    - Pay double taxes
    - No one may leave the city
    - Everyone must sing at dawn
    answer: Sleep by day and work by night
    difficulty: 1
    hints:
    - They turned day upside down.
    - Shops opened in the dark.
    solution: Everyone had to sleep during the day and work at night.
  - prompt: How much did everything cost in the kingdom?
    options:
    - One duddu
    - One rupee
    - One gold coin
    - Nothing at all
    answer: One duddu
    difficulty: 1
    hints:
    - The same price for a banana or a bundle of rice.
    - A small coin.
    solution: Everything cost a single duddu.
  - prompt: Why was the disciple chosen for the stake?
    options:
    - He had grown fat and fitted the stake
    - He was the thief
    - He insulted the king
    - He built the wall
    answer: He had grown fat and fitted the stake
    difficulty: 2
    hints:
    - The goldsmith was too thin.
    - He had been eating cheap food.
    solution: The stake was too big for the thin goldsmith, so the king ordered a fat man; the well-fed disciple was found.
    mistakes:
      He was the thief: eng9_read_again
  - prompt: What did the guru claim about the stake?
    options:
    - Whoever died on it would be reborn a king
    - It was made of gold
    - It would break
    - It belonged to the gods
    answer: Whoever died on it would be reborn a king
    difficulty: 2
    hints:
    - He wanted the king to want it.
    - Think of what a king would want next life.
    solution: He claimed that whoever died on that stake would be reborn as a king, and the foolish king wanted that for himself.
  - prompt: Who became king at the end?
    options:
    - The guru
    - The disciple
    - The goldsmith
    - The merchant
    answer: The guru
    difficulty: 3
    hints:
    - The people asked the wise stranger.
    - The disciple became minister.
    solution: The people made the guru their king and the disciple his minister.
