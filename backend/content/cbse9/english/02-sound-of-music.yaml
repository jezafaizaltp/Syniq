# CBSE Class 9 English (NCERT Beehive), unit 2. Written from memory of the NCERT texts: check details against the book.
subject: cbse9-eng
chapter: 2
title: The Sound of Music · Wind

tips:
  glennie_hearing: "Evelyn Glennie is profoundly deaf. She 'hears' music through different parts of her body, feeling the vibrations, and plays barefoot."
  shehnai_origin: "The shehnai grew from the pungi, which Emperor Aurangzeb banned. A barber improved it, and it was first played in a royal chamber (shah) by a barber (nai)."

concepts:
  - code: cbse9e.u2.music
    title: The Sound of Music (Evelyn Glennie and Bismillah Khan)
    notes: |
      Part I, 'Evelyn Glennie Listens to Sound without Hearing It' (Deborah Cowley): Scottish percussionist;
      hearing loss noticed at eight, profoundly deaf by eleven; teacher Ron Forbes taught her to sense
      vibrations; entered the Royal Academy of Music; plays barefoot; gives free concerts in hospitals and
      prisons. Part II, 'The Shehnai of Bismillah Khan': Aurangzeb banned the pungi; a barber improved it
      into the shehnai. Bismillah Khan born 1916 in Dumraon, Bihar; learnt from his uncle Ali Bux in Benaras;
      played at the Red Fort on 15 August 1947; first Indian invited to the Lincoln Center Hall, USA;
      Bharat Ratna 2001; refused to leave Benaras and the Ganga.
    explanations:
      text: "This lesson tells of two great musicians. Evelyn Glennie lost most of her hearing as a child but became a world-famous percussionist by feeling sound vibrations through her body. Bismillah Khan made the shehnai, once played only at weddings and temples, a classical instrument. He played at the Red Fort on India's first Independence Day and won the Bharat Ratna."
      visual: "Picture Evelyn on stage, barefoot, playing a xylophone and feeling each note in her legs. Next to her, picture Bismillah Khan on the steps of the Ganga in Benaras, playing his shehnai at sunrise."
      step_by_step: "Step 1: Evelyn: deaf by 11, taught by Ron Forbes to feel sounds, Royal Academy of Music, free concerts. Step 2: Shehnai: from the pungi, improved by a barber. Step 3: Bismillah Khan: Dumraon, Benaras, Red Fort 1947, Lincoln Center, Bharat Ratna 2001, loved Benaras."
      real_world: "Evelyn Glennie shows that a disability does not decide what you can achieve. Many deaf musicians today use the same idea of feeling vibrations."
    items:
      - prompt: "By what age was Evelyn Glennie profoundly deaf?"
        answer: "11"
        check: "11"
        difficulty: 1
        hints: ["Her hearing loss was noticed at eight.", "Three years later."]
        solution: "She was profoundly deaf by the age of eleven."
      - prompt: "How does Evelyn Glennie 'hear' music?"
        options: ["By feeling vibrations through her body", "With powerful hearing aids only", "By watching other players", "She doesn't play music"]
        answer: "By feeling vibrations through her body"
        difficulty: 1
        hints: ["She plays barefoot.", "Ron Forbes taught her."]
        solution: "She senses vibrations through her body, especially her legs and feet."
        mistakes: {"With powerful hearing aids only": glennie_hearing}
      - prompt: "Which instrument did the shehnai develop from?"
        options: ["Pungi", "Sitar", "Flute", "Tabla"]
        answer: "Pungi"
        difficulty: 1
        hints: ["Aurangzeb banned it.", "A reeded instrument."]
        solution: "The shehnai developed from the pungi."
        mistakes: {"Flute": shehnai_origin}
      - prompt: "In which year did Bismillah Khan receive the Bharat Ratna?"
        answer: "2001"
        check: "2001"
        difficulty: 2
        hints: ["India's highest civilian award.", "Start of the century."]
        solution: "He received the Bharat Ratna in 2001."
      - prompt: "Where did Bismillah Khan play on 15 August 1947?"
        options: ["The Red Fort", "The Lincoln Center", "Kashi Vishwanath temple", "Dumraon"]
        answer: "The Red Fort"
        difficulty: 2
        hints: ["India's first Independence Day.", "In Delhi."]
        solution: "He played at the Red Fort on India's first Independence Day."
      - prompt: "Why did Bismillah Khan refuse to settle in the USA?"
        options: ["He could not leave Benaras and the Ganga", "He disliked music", "He was not invited", "He wanted to live in Delhi"]
        answer: "He could not leave Benaras and the Ganga"
        difficulty: 3
        hints: ["He loved his hometown.", "He asked if they could bring the Ganga there."]
        solution: "He was deeply attached to Benaras and the river Ganga."

  - code: cbse9e.u2.wind
    title: Wind (Subramania Bharati)
    after: [cbse9e.u2.music]
    notes: |
      Translated from Tamil. The poet asks the wind not to break the shutters or scatter papers and books.
      The wind god 'winnows' the weak: crumbling houses, doors, rafters, weak bodies and hearts. So we must
      build strong homes, firm bodies and steady hearts. Then the wind becomes a friend: 'the wind blows out
      weak fires. He makes strong fires roar and flourish. His friendship is good. We praise him every day.'
    explanations:
      text: "The poet speaks to the wind, asking it not to break the windows or scatter books. But the wind only destroys what is weak: crumbling houses, weak bodies, weak hearts. So the poem tells us to make ourselves strong. Then the wind, like the troubles of life, becomes our friend: it blows out weak fires but makes strong ones roar."
      visual: "Picture two lamps in a strong breeze. One small, flickering flame goes out. A big, steady fire grows brighter. The wind is the same; the difference is how strong the fire is."
      step_by_step: "Step 1: The wind is destructive: shutters, papers, books. Step 2: It winnows the weak. Step 3: The message: build firm homes, bodies and hearts. Step 4: Then the wind is a friend that makes strong fires flourish."
      real_world: "Exams and difficulties can feel like strong winds. Preparing steadily, like building a firm house, turns a challenge into something that makes you stronger."
    items:
      - prompt: "From which language was the poem 'Wind' translated?"
        options: ["Tamil", "Malayalam", "Hindi", "Bengali"]
        answer: "Tamil"
        difficulty: 1
        hints: ["Subramania Bharati was a great poet of this language.", "Spoken in Tamil Nadu."]
        solution: "It was translated from Tamil."
      - prompt: "Who wrote 'Wind'?"
        options: ["Subramania Bharati", "Robert Frost", "Coates Kinney", "Gieve Patel"]
        answer: "Subramania Bharati"
        difficulty: 1
        hints: ["A Tamil poet and freedom fighter.", "Also called Mahakavi."]
        solution: "Subramania Bharati."
        mistakes: {"Gieve Patel": eng9_author}
      - prompt: "What does the wind god 'winnow'?"
        options: ["Weak things: crumbling houses, weak bodies and hearts", "Grain only", "Only strong trees", "Rivers"]
        answer: "Weak things: crumbling houses, weak bodies and hearts"
        difficulty: 2
        hints: ["Winnowing separates grain from chaff.", "The weak are blown away."]
        solution: "The wind god winnows the weak: crumbling houses, doors, rafters, weak bodies and hearts."
        mistakes: {"Grain only": eng9_poem_meaning}
      - prompt: "What is the poet's message?"
        options: ["Be strong in body and mind to face difficulties", "Stay indoors when it's windy", "Wind is always an enemy", "Never build houses"]
        answer: "Be strong in body and mind to face difficulties"
        difficulty: 2
        hints: ["The wind stands for hardships.", "Strong fires roar."]
        solution: "We must make ourselves strong so that hardships make us flourish instead of breaking us."
        mistakes: {"Stay indoors when it's windy": eng9_poem_meaning}
      - prompt: "What does the wind do to strong fires?"
        options: ["Makes them roar and flourish", "Blows them out", "Ignores them", "Freezes them"]
        answer: "Makes them roar and flourish"
        difficulty: 1
        hints: ["It blows out weak fires.", "The opposite for strong ones."]
        solution: "He makes strong fires roar and flourish."
      - prompt: "Which things does the poet ask the wind not to do in the opening lines?"
        options: ["Break the shutters and scatter the papers", "Bring rain", "Stop blowing", "Carry the poet away"]
        answer: "Break the shutters and scatter the papers"
        difficulty: 3
        hints: ["Windows and books.", "The first stanza."]
        solution: "He asks the wind not to break the shutters, scatter papers or throw down the books."
