concepts:
- code: cbse9e.m6.ersama
  title: Weathering the Storm in Ersama (Harsh Mander)
  notes: |
    In October 1999 a super cyclone strikes coastal Orissa (now Odisha). Prashant, 19, is visiting a friend in
    Ersama when the storm hits. He shelters on the roof of his friend's house for two days, surrounded by
    floodwater, dead animals and bodies. He then sets out for his own village, Kalikuda, fearing for his
    family, and finds them in a relief shelter. He organises the young people of the shelter: they pressure
    a merchant to give rice, cook it, clean the shelter, care for the injured and help in getting relief.
    When no help comes he gets the youths to signal a helicopter. He enlists women to look after orphaned
    children, and starts food-for-work so widows can earn. Theme: courage, leadership and rebuilding a
    community after disaster.
  explanations:
    text: When the 1999 super cyclone floods Orissa, 19-year-old Prashant survives two days on a rooftop in Ersama, then finds his family in a shelter in his village. Instead of despairing, he organises the young people to get food, clean the shelter, care for the injured and look after orphans, and helps the community rebuild.
    visual: 'Draw a flooded village with only rooftops above the water and a young man sitting on one. Then draw a crowded shelter where he hands out tasks: some youths cook rice, some clean, women hold small children, and others wave at a helicopter.'
    step_by_step: 'Step 1: The super cyclone of October 1999 hits while Prashant is in Ersama. Step 2: Two days on his friend''s roof. Step 3: He wades back to Kalikuda and finds his family in a shelter. Step 4: He organises the youth: food, cleaning, care for the injured. Step 5: Orphans are cared for by women; food-for-work helps widows.'
    real_world: After floods in Kerala in 2018, fishermen and young volunteers rescued and fed thousands. Like Prashant, ordinary young people became leaders when help from outside was slow.
