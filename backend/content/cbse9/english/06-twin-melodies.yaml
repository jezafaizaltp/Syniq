# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 6: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 6
title: Twin Melodies · A Friend Found in Music
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_friend_music: "Read the title again: the friend is found in something."
  e9_fusion: "Shruti wanted to mix Indian and Western music."
  e9_leela_scold: "Leela was upset about how Shruti went about it, not about her playing."
  e9_music_feelings: "Music works through melody and rhythm, not words."
  e9_nabin_change: "Nabin changed his mind after listening, not after an argument or a reward."
  e9_personification: "Giving human qualities to a non-human thing has a special name."
  e9_unit_link_music: "Both texts show what music gives people."
  e9_warm_tone: "The speaker is thankful for music. Is the poem angry or warm?"
  c9e6_character: Go back to who is who in the play. Who is the parent, who is the musician, who are the friends?
  c9e6_conflict: The play's problem is between two kinds of music and two people. Which two?
  c9e6_resolution: Ask what changed the father's mind. Was it an argument, or something he heard?
  c9e6_personify: Ask whether something that is not a person is given human qualities.

concepts:
  - code: cbse9k.u6.twin
    title: Twin Melodies (Mitra Phukan)
    notes: |
      A short play in three acts by Mitra Phukan, the Assamese writer and trained classical singer. Shruti, a
      young violinist, wants to play in an Indo-Western fusion concert with her friends Iqbal, Avinash and
      Peter. Her father Nabin Sharma, a master of classical Hindustani violin, believes classical music is the
      only music worth serious study, so she is afraid to ask him. Her friends urge her to speak to him. At
      dinner he refuses firmly; her mother Leela scolds her for hiding the plan and Shruti promises to be open in
      future. Her parents then come to watch a rehearsal. Hearing the group, Nabin admits he underestimated the
      power of their own music to blend with other traditions, and says he trusts her and will support the group.
      Themes: tradition and modernity can live together, honest talk resolves family conflict, courage to follow
      one's passion.
    explanations:
      text: "Shruti loves fusion music, mixing Indian classical and Western styles. Her father, a strict classical violinist, at first says no. When her parents hear her group play, he realises their own music is strong enough to blend with others, and gives his blessing."
      visual: "Picture a stage: Shruti with a violin in the centre, Iqbal, Avinash and Peter with other instruments around her. In the front row, her father, arms folded at first, then clapping."
      step_by_step: "Step 1: Shruti wants to join a fusion concert. Step 2: She fears her classical-music father. Step 3: Friends push her to ask. Step 4: He refuses; her mother tells her to be honest. Step 5: Parents watch the rehearsal. Step 6: Father accepts and supports her."
      real_world: "Indian musicians like L. Subramaniam have played Carnatic violin with Western orchestras, showing how traditions can meet."
    activity:
      type: sort
      prompt: 'Twin Melodies: who is it?'
      bins:
      - Shruti
      - Nabin Sharma
      - Leela
      items:
      - label: A young violinist who wants to play fusion
        bin: Shruti
        clue: The daughter.
        why: Shruti wants to join the Indo-Western concert.
      - label: Believes only classical music is serious
        bin: Nabin Sharma
        clue: The master of Hindustani violin.
        why: Her father, Nabin, holds this view at first.
      - label: Scolds her for hiding the plan
        bin: Leela
        clue: The mother.
        why: Leela is upset that Shruti was not open with them.
      - label: Promises to be open in future
        bin: Shruti
        clue: Who was hiding the plan?
        why: Shruti hid the plan, so she is the one who promises.
      - label: Admits he underestimated their music
        bin: Nabin Sharma
        clue: Changes his mind at the rehearsal.
        why: After hearing them, Nabin admits he was wrong.
    lesson:
      - teach: '''Twin Melodies'' is a short play in three acts by Mitra Phukan, an Assamese writer and trained classical singer. Shruti, a young violinist, wants to play in an Indo-Western fusion concert with her friends Iqbal, Avinash and Peter. Her father, Nabin Sharma, is a master of classical Hindustani violin and believes only classical music deserves serious study, so she is afraid to ask him.'
        check:
          prompt: Why is Shruti afraid to tell her father?
          options:
          - He values only classical music
          - He hates the violin
          - He wants her to be a doctor
          answer: He values only classical music
          why: Fusion seemed unserious to him.
      - teach: Her friends urge her to speak to him. At dinner he refuses firmly. Her mother Leela scolds Shruti for hiding the plan, and Shruti promises to be open in future. Then her parents come to watch a rehearsal. Hearing the group, Nabin admits he underestimated how their own music can blend with other traditions, and says he trusts her and will support the group.
        picture:
          kind: flow
          steps:
          - Shruti wants fusion concert
          - Afraid to ask father
          - Father refuses at dinner
          - Mother scolds the secrecy
          - Parents hear rehearsal
          - Father supports the group
          alt: The play in order from Shruti's wish to her father's support after hearing the rehearsal.
        check:
          prompt: What changes Nabin's mind?
          options:
          - Hearing the group rehearse
          - A letter from the school
          - Shruti crying
          answer: Hearing the group rehearse
          why: He heard the strength of their own music in it.
      - teach: 'Themes: tradition and modernity can live together; honest talk resolves family conflict; it takes courage to follow your passion. ''Fusion'' means mixing different styles to make something new.'
        check:
          prompt: Indo-Western fusion music…
          options:
          - Mixes Indian and Western styles
          - Uses only drums
          - Has no melody
          answer: Mixes Indian and Western styles
          why: Fusion blends traditions.
    items:
      - prompt: "Who wrote the play 'Twin Melodies'?"
        options: ["Mitra Phukan", "Temsula Ao", "Asha Nehemiah", "Sudha Murty"]
        answer: "Mitra Phukan"
        difficulty: 1
        hints: ["A writer from Assam.", "She is also a classical singer."]
        solution: "Step 1: The play is in Unit 6. Step 2: It is by Mitra Phukan."
        mistakes: {"Temsula Ao": eng9_author}
      - prompt: "Which instrument does Shruti play?"
        options: ["Violin", "Sitar", "Flute", "Tabla"]
        answer: "Violin"
        difficulty: 1
        hints: ["Same as her father.", "Played with a bow."]
        solution: "Step 1: Her father is a master violinist. Step 2: Shruti also plays the violin."
        mistakes: {"Sitar": eng9_read_again}
      - prompt: "What kind of concert does Shruti want to play in?"
        options: ["An Indo-Western fusion concert", "A purely classical recital", "A school drama", "A film song contest"]
        answer: "An Indo-Western fusion concert"
        difficulty: 1
        hints: ["It mixes two traditions.", "Her friends play in it."]
        solution: "Step 1: Her group mixes Indian and Western music. Step 2: It is a fusion concert."
        mistakes: {"A purely classical recital": "e9_fusion"}
      - prompt: "Why is Shruti afraid to tell her father about the concert?"
        options: ["He believes only classical music is worth serious playing", "He dislikes the violin", "He wants her to quit music", "He does not know her friends"]
        answer: "He believes only classical music is worth serious playing"
        difficulty: 2
        hints: ["He is a strict classical musician.", "Fusion is different."]
        solution: "Step 1: Her father is devoted to classical Hindustani music. Step 2: She fears he will reject fusion."
        mistakes: {"He wants her to quit music": eng9_read_again}
      - prompt: "Why does Shruti's mother Leela scold her?"
        options: ["For hiding her plan instead of asking earlier", "For playing badly", "For missing school", "For breaking the violin"]
        answer: "For hiding her plan instead of asking earlier"
        difficulty: 2
        hints: ["It is about honesty.", "Shruti promises to be open after this."]
        solution: "Step 1: Shruti kept the concert a secret. Step 2: Leela scolds her for not telling them sooner."
        mistakes: {"For playing badly": "e9_leela_scold"}
      - prompt: "What makes Nabin Sharma change his mind?"
        options: ["Hearing the group's rehearsal and seeing the strength of their own music in it", "A letter from the school", "Losing an argument with Leela", "A prize promised to Shruti"]
        answer: "Hearing the group's rehearsal and seeing the strength of their own music in it"
        difficulty: 3
        hints: ["He watches them play.", "'I underestimated the power of our own music.'"]
        solution: "Step 1: He watches the rehearsal. Step 2: He sees Indian music holding its own in the fusion and decides to support them."
        mistakes: {"A prize promised to Shruti": "e9_nabin_change", "Losing an argument with Leela": "e9_nabin_change"}
      - prompt: Who is Shruti's mother?
        options:
        - Leela
        - Iqbal
        - Peter
        - Avinash
        answer: Leela
        difficulty: 1
        hints:
        - She scolds Shruti for hiding the plan.
        - The others are Shruti's friends.
        solution: Leela is Shruti's mother.
        mistakes:
          Iqbal: c9e6_character
      - prompt: How many acts does the play have?
        answer: 3
        check: '3'
        difficulty: 1
        hints:
        - It is a short play.
        - Fewer than five.
        solution: '''Twin Melodies'' is a play in three acts.'
        mistakes:
          '2': c9e6_character
          '5': c9e6_character
      - prompt: What is the main conflict in the play?
        options:
        - Shruti's wish for fusion music versus her father's love of classical music
        - A fight over money
        - A lost violin
        - A school exam
        answer: Shruti's wish for fusion music versus her father's love of classical music
        difficulty: 2
        hints:
        - Two kinds of music.
        - Daughter and father.
        solution: The conflict is between Shruti's interest in fusion and her father's belief in classical music.
        mistakes:
          A lost violin: c9e6_conflict
      - prompt: What promise does Shruti make after her mother scolds her?
        options:
        - To be open with her parents in future
        - To stop playing music
        - To leave home
        - To never see her friends
        answer: To be open with her parents in future
        difficulty: 2
        hints:
        - Leela was upset about the secrecy.
        - The opposite of hiding.
        solution: Shruti promises to share her plans openly from now on.
        mistakes:
          To stop playing music: c9e6_resolution
      - prompt: What does the title 'Twin Melodies' suggest?
        options:
        - Two musical traditions that can go together
        - Twins who sing
        - Two violins only
        - A song about twins
        answer: Two musical traditions that can go together
        difficulty: 3
        hints:
        - Twin means a matching pair.
        - Which two kinds of music meet in the play?
        solution: 'Step 1: The play joins classical and Western music. Step 2: ''Twin melodies'' suggests two traditions in harmony.'
        mistakes:
          Twins who sing: c9e6_conflict
      - prompt: Which stage direction might show Nabin's feelings at dinner?
        options:
        - (firmly, putting down his spoon)
        - (laughing loudly)
        - (dancing happily)
        - (falls asleep)
        answer: (firmly, putting down his spoon)
        difficulty: 2
        hints:
        - He refuses firmly.
        - Stage directions describe actions and tone.
        solution: A firm action fits his firm refusal at dinner.
        mistakes:
          (dancing happily): c9e6_character
      - prompt: What lesson does the play teach about families?
        options:
        - Honest conversation can solve disagreements
        - Parents are always wrong
        - Children should keep secrets
        - Never argue
        answer: Honest conversation can solve disagreements
        difficulty: 2
        hints:
        - What went wrong when Shruti hid her plan?
        - How was it fixed?
        solution: Openness and listening brought the family together.
        mistakes:
          Children should keep secrets: c9e6_resolution
      - prompt: Mitra Phukan is from which state?
        options:
        - Assam
        - Kerala
        - Punjab
        - Goa
        answer: Assam
        difficulty: 2
        hints:
        - She is an Assamese writer.
        - In the North-East.
        solution: Mitra Phukan is an Assamese writer and singer.
        mistakes:
          Kerala: c9e6_character
      - prompt: 'Choose the correct word: ''Nabin ___ the group when he heard them play.'''
        options:
        - supported
        - support
        - supporting
        - supports yesterday
        answer: supported
        difficulty: 1
        hints:
        - Past tense.
        - Add -ed.
        solution: 'Simple past: ''Nabin supported the group''.'
        mistakes:
          supports yesterday: c9e1_grammar
  - code: cbse9k.u6.friend
    title: A Friend Found in Music
    after: [cbse9k.u6.twin]
    notes: |
      A short poem paired with Twin Melodies (credited in study guides to Bryanna T. Perkins) in which the speaker
      describes music as a faithful friend: it is there in loneliness and sadness, it comforts, lifts the mood and
      gives a way to express feelings that words cannot. Music is personified as a companion. Read it for the
      central metaphor (music as a friend) and its warm, grateful tone; it links with Shruti's love of the violin.
    explanations:
      text: "The speaker treats music as a best friend: always there, comforting when sad, joyful when happy, and able to say what words can't."
      visual: "Picture a person alone on a bench with headphones, a soft glow of musical notes wrapping round them like an arm over the shoulder."
      step_by_step: "Step 1: Find the main image: music as a friend. Step 2: Notice what this friend does: comforts, cheers, understands. Step 3: Feel the tone: warm and thankful. Step 4: Link to Shruti and her violin."
      real_world: "Doctors and therapists use music to calm patients and help people manage stress, showing how music can comfort like a friend."
    activity:
      type: sort
      prompt: 'A Friend Found in Music: what does music do, like a friend?'
      bins:
      - Comforts
      - Gives a voice
      - Stays by you
      items:
      - label: Soothes you when you are sad
        bin: Comforts
        clue: Makes a hurt feel lighter.
        why: Easing sadness is comfort.
      - label: Says what words cannot
        bin: Gives a voice
        clue: Feelings that are hard to speak.
        why: Expressing feelings without words is giving a voice.
      - label: Is there when you are alone
        bin: Stays by you
        clue: Loneliness.
        why: Being there in loneliness is staying by you.
      - label: Lifts your mood
        bin: Comforts
        clue: From low to better.
        why: Lifting a low mood is a kind of comfort.
      - label: Never leaves you
        bin: Stays by you
        clue: Faithful.
        why: 'A faithful friend stays: music is always there.'
    lesson:
      - teach: '''A Friend Found in Music'' is a short poem paired with Twin Melodies. The speaker describes music as a faithful friend: it is there in loneliness and sadness, it comforts, lifts the mood and expresses feelings that words cannot.'
        check:
          prompt: Who is the friend in the poem?
          options:
          - Music
          - A neighbour
          - A dog
          answer: Music
          why: Music is described as a companion.
      - teach: 'Giving human qualities to something that is not human, like calling music a friend who comforts, is personification. The tone is warm and grateful. The poem links with Shruti''s love of the violin: both show music as a source of joy and connection.'
        picture:
          kind: compare
          columns:
          - title: Music as a friend
            points:
            - Stays in loneliness
            - Comforts in sadness
            - Lifts the mood
          - title: Device
            points:
            - Personification
            - Warm, grateful tone
          alt: How the poem shows music as a friend, and the device and tone it uses.
        check:
          prompt: '''The wind whispered secrets'' is…'
          options:
          - Personification
          - A simile
          - A fact
          answer: Personification
          why: Wind cannot really whisper.
    items:
      - prompt: "In 'A Friend Found in Music', who or what is the friend?"
        options: ["Music", "A violin teacher", "A classmate", "A pet"]
        answer: "Music"
        difficulty: 1
        hints: ["Read the title.", "Found in music."]
        solution: "Step 1: The title says the friend is found in music. Step 2: Music itself is the friend."
        mistakes: {"A violin teacher": "e9_friend_music"}
      - prompt: "Giving music human qualities, like being a friend, is an example of…"
        options: ["Personification", "Alliteration", "Rhyme", "Onomatopoeia"]
        answer: "Personification"
        difficulty: 1
        hints: ["Treating a thing like a person.", "Person-ification."]
        solution: "Step 1: Music is described as a friend, a person. Step 2: That is personification."
        mistakes: {"Alliteration": "e9_personification"}
      - prompt: "What is the tone of the poem?"
        options: ["Warm and grateful", "Angry", "Mocking", "Fearful"]
        answer: "Warm and grateful"
        difficulty: 1
        hints: ["The speaker loves music.", "Thankful."]
        solution: "Step 1: The speaker praises music's comfort. Step 2: The tone is warm and grateful."
        mistakes: {"Mocking": "e9_warm_tone"}
      - prompt: "How does music help the speaker when they feel low?"
        options: ["It comforts them and lifts their mood", "It makes them angry", "It keeps them awake at night", "It tells them to stop feeling"]
        answer: "It comforts them and lifts their mood"
        difficulty: 2
        hints: ["What does a good friend do?", "Comfort."]
        solution: "Step 1: A friend helps in hard times. Step 2: Music comforts the speaker and lifts their mood."
        mistakes: {"It makes them angry": eng9_poem_meaning}
      - prompt: "How does this poem connect with 'Twin Melodies'?"
        options: ["Both show music as a source of joy and connection", "Both are about sports", "Both reject music", "Both are about cooking"]
        answer: "Both show music as a source of joy and connection"
        difficulty: 2
        hints: ["Shruti and her violin.", "Music brings people together."]
        solution: "Step 1: Shruti's music connects her with friends and family. Step 2: The poem shows music as a friend. Both celebrate music."
        mistakes: {"Both reject music": "e9_unit_link_music"}
      - prompt: "Why might music express feelings 'that words cannot'?"
        options: ["Melody and rhythm can carry emotions directly, even without words", "Music has no sound", "Words are always wrong", "Only songs in English carry feelings"]
        answer: "Melody and rhythm can carry emotions directly, even without words"
        difficulty: 3
        hints: ["Think of instrumental music.", "A sad tune makes us feel sad."]
        solution: "Step 1: Even a violin piece with no lyrics can make us feel joy or sorrow. Step 2: So music can express emotions beyond words."
        mistakes: {"Words are always wrong": "e9_music_feelings"}
      - prompt: When does music help the speaker most?
        options:
        - When they feel lonely or sad
        - Only at parties
        - Never
        - Only during exams
        answer: When they feel lonely or sad
        difficulty: 1
        hints:
        - Friends help in hard times.
        - Think of comfort.
        solution: Music comforts the speaker in loneliness and sadness.
        mistakes:
          Never: c9e6_personify
      - prompt: Which line uses personification?
        options:
        - The guitar sang softly to me
        - The guitar has six strings
        - I bought a guitar
        - The guitar is brown
        answer: The guitar sang softly to me
        difficulty: 2
        hints:
        - Which one gives a human action to an object?
        - Can a guitar really sing?
        solution: Giving a guitar the human action of singing is personification.
        mistakes:
          The guitar has six strings: c9e6_personify
      - prompt: Which word best describes the speaker's feeling towards music?
        options:
        - Grateful
        - Angry
        - Bored
        - Afraid
        answer: Grateful
        difficulty: 1
        hints:
        - Music helps them.
        - How do we feel about a good friend?
        solution: 'The speaker is thankful for music''s company: grateful.'
        mistakes:
          Bored: c9e6_personify
      - prompt: What does 'companion' mean?
        options:
        - Someone who spends time with you
        - An enemy
        - A teacher only
        - A stranger
        answer: Someone who spends time with you
        difficulty: 1
        hints:
        - Music is called one.
        - Like a friend by your side.
        solution: A companion is someone who keeps you company.
        mistakes:
          An enemy: c9e1_word_meaning
      - prompt: A slow tune with no lyrics makes you feel sad. What does this show about music?
        options:
        - It can carry emotion without words
        - Music is louder than words
        - Only words carry feelings
        - Music is always happy
        answer: It can carry emotion without words
        difficulty: 3
        hints:
        - Think of a tune that makes you sad without lyrics.
        - Feeling without language.
        solution: 'Step 1: Some feelings are hard to name. Step 2: A melody can express them without words.'
        mistakes:
          Music is louder than words: c9e6_personify
      - prompt: Which character in 'Twin Melodies' would most agree with this poem?
        options:
        - Shruti
        - Nobody
        - A passer-by
        - The dinner cook
        answer: Shruti
        difficulty: 2
        hints:
        - Who loves playing music?
        - She plays the violin.
        solution: Shruti finds joy and connection in music, just like the speaker.
        mistakes:
          Nobody: c9e6_character
      - prompt: 'Choose the correct word: ''Music ___ me when I am sad.'''
        options:
        - comforts
        - comfort
        - comforting
        - comforted tomorrow
        answer: comforts
        difficulty: 1
        hints:
        - Third person singular, present tense.
        - Add -s.
        solution: 'With ''music'' (it) in the present, the verb takes -s: comforts.'
        mistakes:
          comfort: c9e1_grammar
      - prompt: What is the central image of the poem?
        options:
        - Music as a faithful friend
        - A stormy sea
        - A busy market
        - A school bell
        answer: Music as a faithful friend
        difficulty: 1
        hints:
        - Read the title.
        - What is 'found in music'?
        solution: The poem's central image is music as a loyal friend.
        mistakes:
          A stormy sea: c9e6_personify
      - prompt: Which of these is NOT something the poem says music does?
        options:
        - Pays the bills
        - Comforts
        - Lifts the mood
        - Expresses feelings
        answer: Pays the bills
        difficulty: 2
        hints:
        - Three are emotional help.
        - One is about money.
        solution: The poem speaks of comfort, mood and feelings, not money.
        mistakes:
          Comforts: c9e6_personify
