# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 6: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 6
title: Twin Melodies · A Friend Found in Music
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."

concepts:
  - code: cbse9k.u6.twin
    title: Twin Melodies (Mitra Phukan)
    notes: |
      A short play in three acts by Mitra Phukan, the Assamese writer and trained classical singer. Shruti, a
      young violinist, wants to play in an Indo-Western fusion concert with her friends Iqbal, Avinash and
      Peter. Her father Nabin Sharma, a master of classical Hindustani violin, believes classical music is the
      only music worth serious study, so she is afraid to ask him. Her friends urge her to speak to him. At
      dinner he refuses firmly; her mother Leela scolds her for hiding the plan and Shruti promises to be open in
      future. Her parents then come to watch a rehearsal. Hearing the group, Nabin admits he underestimated the
      power of their own music to blend with other traditions, and says he trusts her and will support the group.
      Themes: tradition and modernity can live together, honest talk resolves family conflict, courage to follow
      one's passion.
    explanations:
      text: "Shruti loves fusion music, mixing Indian classical and Western styles. Her father, a strict classical violinist, at first says no. When her parents hear her group play, he realises their own music is strong enough to blend with others, and gives his blessing."
      visual: "Picture a stage: Shruti with a violin in the centre, Iqbal, Avinash and Peter with other instruments around her. In the front row, her father, arms folded at first, then clapping."
      step_by_step: "Step 1: Shruti wants to join a fusion concert. Step 2: She fears her classical-music father. Step 3: Friends push her to ask. Step 4: He refuses; her mother tells her to be honest. Step 5: Parents watch the rehearsal. Step 6: Father accepts and supports her."
      real_world: "Indian musicians like L. Subramaniam have played Carnatic violin with Western orchestras, showing how traditions can meet."
    items:
      - prompt: "Who wrote the play 'Twin Melodies'?"
        options: ["Mitra Phukan", "Temsula Ao", "Asha Nehemiah", "Sudha Murty"]
        answer: "Mitra Phukan"
        difficulty: 1
        hints: ["A writer from Assam.", "She is also a classical singer."]
        solution: "Step 1: The play is in Unit 6. Step 2: It is by Mitra Phukan."
        mistakes: {"Temsula Ao": eng9_author}
      - prompt: "Which instrument does Shruti play?"
        options: ["Violin", "Sitar", "Flute", "Tabla"]
        answer: "Violin"
        difficulty: 1
        hints: ["Same as her father.", "Played with a bow."]
        solution: "Step 1: Her father is a master violinist. Step 2: Shruti also plays the violin."
        mistakes: {"Sitar": eng9_read_again}
      - prompt: "What kind of concert does Shruti want to play in?"
        options: ["An Indo-Western fusion concert", "A purely classical recital", "A school drama", "A film song contest"]
        answer: "An Indo-Western fusion concert"
        difficulty: 1
        hints: ["It mixes two traditions.", "Her friends play in it."]
        solution: "Step 1: Her group mixes Indian and Western music. Step 2: It is a fusion concert."
      - prompt: "Why is Shruti afraid to tell her father about the concert?"
        options: ["He believes only classical music is worth serious playing", "He dislikes the violin", "He wants her to quit music", "He does not know her friends"]
        answer: "He believes only classical music is worth serious playing"
        difficulty: 2
        hints: ["He is a strict classical musician.", "Fusion is different."]
        solution: "Step 1: Her father is devoted to classical Hindustani music. Step 2: She fears he will reject fusion."
        mistakes: {"He wants her to quit music": eng9_read_again}
      - prompt: "Why does Shruti's mother Leela scold her?"
        options: ["For hiding her plan instead of asking earlier", "For playing badly", "For missing school", "For breaking the violin"]
        answer: "For hiding her plan instead of asking earlier"
        difficulty: 2
        hints: ["It is about honesty.", "Shruti promises to be open after this."]
        solution: "Step 1: Shruti kept the concert a secret. Step 2: Leela scolds her for not telling them sooner."
      - prompt: "What makes Nabin Sharma change his mind?"
        options: ["Hearing the group's rehearsal and seeing the strength of their own music in it", "A letter from the school", "Losing an argument with Leela", "A prize promised to Shruti"]
        answer: "Hearing the group's rehearsal and seeing the strength of their own music in it"
        difficulty: 3
        hints: ["He watches them play.", "'I underestimated the power of our own music.'"]
        solution: "Step 1: He watches the rehearsal. Step 2: He sees Indian music holding its own in the fusion and decides to support them."
  - code: cbse9k.u6.friend
    title: A Friend Found in Music
    after: [cbse9k.u6.twin]
    notes: |
      A short poem paired with Twin Melodies (credited in study guides to Bryanna T. Perkins) in which the speaker
      describes music as a faithful friend: it is there in loneliness and sadness, it comforts, lifts the mood and
      gives a way to express feelings that words cannot. Music is personified as a companion. Read it for the
      central metaphor (music as a friend) and its warm, grateful tone; it links with Shruti's love of the violin.
    explanations:
      text: "The speaker treats music as a best friend: always there, comforting when sad, joyful when happy, and able to say what words can't."
      visual: "Picture a person alone on a bench with headphones, a soft glow of musical notes wrapping round them like an arm over the shoulder."
      step_by_step: "Step 1: Find the main image: music as a friend. Step 2: Notice what this friend does: comforts, cheers, understands. Step 3: Feel the tone: warm and thankful. Step 4: Link to Shruti and her violin."
      real_world: "Doctors and therapists use music to calm patients and help people manage stress, showing how music can comfort like a friend."
    items:
      - prompt: "In 'A Friend Found in Music', who or what is the friend?"
        options: ["Music", "A violin teacher", "A classmate", "A pet"]
        answer: "Music"
        difficulty: 1
        hints: ["Read the title.", "Found in music."]
        solution: "Step 1: The title says the friend is found in music. Step 2: Music itself is the friend."
      - prompt: "Giving music human qualities, like being a friend, is an example of…"
        options: ["Personification", "Alliteration", "Rhyme", "Onomatopoeia"]
        answer: "Personification"
        difficulty: 1
        hints: ["Treating a thing like a person.", "Person-ification."]
        solution: "Step 1: Music is described as a friend, a person. Step 2: That is personification."
      - prompt: "What is the tone of the poem?"
        options: ["Warm and grateful", "Angry", "Mocking", "Fearful"]
        answer: "Warm and grateful"
        difficulty: 1
        hints: ["The speaker loves music.", "Thankful."]
        solution: "Step 1: The speaker praises music's comfort. Step 2: The tone is warm and grateful."
      - prompt: "How does music help the speaker when they feel low?"
        options: ["It comforts them and lifts their mood", "It makes them angry", "It keeps them awake at night", "It tells them to stop feeling"]
        answer: "It comforts them and lifts their mood"
        difficulty: 2
        hints: ["What does a good friend do?", "Comfort."]
        solution: "Step 1: A friend helps in hard times. Step 2: Music comforts the speaker and lifts their mood."
        mistakes: {"It makes them angry": eng9_poem_meaning}
      - prompt: "How does this poem connect with 'Twin Melodies'?"
        options: ["Both show music as a source of joy and connection", "Both are about sports", "Both reject music", "Both are about cooking"]
        answer: "Both show music as a source of joy and connection"
        difficulty: 2
        hints: ["Shruti and her violin.", "Music brings people together."]
        solution: "Step 1: Shruti's music connects her with friends and family. Step 2: The poem shows music as a friend. Both celebrate music."
      - prompt: "Why might music express feelings 'that words cannot'?"
        options: ["Melody and rhythm can carry emotions directly, even without words", "Music has no sound", "Words are always wrong", "Only songs in English carry feelings"]
        answer: "Melody and rhythm can carry emotions directly, even without words"
        difficulty: 3
        hints: ["Think of instrumental music.", "A sad tune makes us feel sad."]
        solution: "Step 1: Even a violin piece with no lyrics can make us feel joy or sorrow. Step 2: So music can express emotions beyond words."
