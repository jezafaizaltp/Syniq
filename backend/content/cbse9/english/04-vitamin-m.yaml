# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 4: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 4
title: Vitamin-M · I Cannot Remember My Mother
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_bittersweet: "The poem is about missing someone but holding loving memories."
  e9_grandpa_age: "Look for Grandpa's age in the story. It is given as a number."
  e9_irony: "Irony is when the opposite of what we expect happens. Who was supposed to be forgetful?"
  e9_refrain: "Find the line the poet keeps coming back to, about remembering her mother."
  e9_vidya_forgets: "The surprise is that Vidya, who worries about others forgetting, forgets something about her own family."
  c9e4_who_forgets: Follow the story to the end. Whose memory turns out to be the problem?
  c9e4_irony: Irony is when the result is the opposite of what we expect. Who expected whom to forget?
  c9e4_sense: Ask which sense is at work. Is the poet hearing, smelling or seeing something?
  c9e4_refrain: Look for the line that comes back again and again in the poem.

concepts:
  - code: cbse9k.u4.vitamin
    title: Vitamin-M (Asha Nehemiah)
    notes: |
      A story by Asha Nehemiah set in a busy city where Ravi lives with his mother Vidya and his 75-year-old
      grandfather in a small ("poky") flat. Vidya worries that Grandpa is becoming forgetful and wishes there
      were a memory pill for old people. Ravi is told to keep an eye on Grandpa and secretly follows him around
      the city. He finds that Grandpa remembers a great deal: chess games, family gift traditions and the way
      home. In the end it is Vidya who forgets something important, her own father's birthday, so Grandpa
      jokes that she is the one who needs 'Vitamin-M', M for memory. Themes: respect and dignity for the
      elderly, the generation gap, and the irony that busy younger people can be the forgetful ones.
    explanations:
      text: "Ravi's mother thinks Grandpa is getting forgetful and needs a memory pill. Ravi follows Grandpa and finds he remembers plenty. Then his mother forgets Grandpa's birthday, and Grandpa jokes that she needs 'Vitamin-M', for memory."
      visual: "Picture a small city flat: a worried mother with a list, a grandfather setting up a chess board, and a boy peeping from behind a door. On the calendar, a birthday circled that the mother has missed."
      step_by_step: "Step 1: Vidya worries about Grandpa's memory. Step 2: Ravi is asked to watch him and follows him. Step 3: Grandpa remembers chess, traditions and routes. Step 4: Vidya forgets her father's birthday. Step 5: Grandpa's joke about Vitamin-M."
      real_world: "Many elderly people in Kerala live with busy families; spending time with them often shows how sharp and wise they still are."
    activity:
      type: sort
      prompt: 'Vitamin-M: who forgets, and who remembers?'
      bins:
      - Grandpa remembers
      - Vidya forgets
      items:
      - label: Old chess games
        bin: Grandpa remembers
        clue: Ravi follows him and sees this.
        why: Ravi finds Grandpa remembers chess well; the worry was wrong.
      - label: The way home through the city
        bin: Grandpa remembers
        clue: He walks alone and returns.
        why: Grandpa finds his way home, so his memory is fine.
      - label: Her own father's birthday
        bin: Vidya forgets
        clue: The twist at the end.
        why: 'Vidya, busy with work, forgets her father''s birthday: the irony.'
      - label: Family gift traditions
        bin: Grandpa remembers
        clue: Old family customs.
        why: Grandpa keeps the family's traditions in mind.
      - label: Needs 'Vitamin-M' after all
        bin: Vidya forgets
        clue: Grandpa jokes about who needs it.
        why: The memory pill joke turns back on Vidya, the busy one.
    lesson:
      - teach: '''Vitamin-M'' by Asha Nehemiah is set in a busy city. Ravi lives in a small, cramped (''poky'') flat with his mother Vidya and his 75-year-old grandfather. Vidya worries that Grandpa is becoming forgetful and wishes there were a memory pill for old people. Ravi is told to keep an eye on him, so he secretly follows Grandpa around the city.'
        check:
          prompt: What does Vidya worry about?
          options:
          - Grandpa is becoming forgetful
          - Ravi's marks
          - The rent
          answer: Grandpa is becoming forgetful
          why: She wishes for a memory pill.
      - teach: 'Ravi finds that Grandpa remembers a great deal: chess games, family gift traditions and the way home. In the end it is Vidya who forgets something important, her own father''s birthday. Grandpa jokes that she is the one who needs ''Vitamin-M'', M for memory. This twist is irony: the worried person turns out to be the forgetful one.'
        picture:
          kind: compare
          columns:
          - title: What Vidya expects
            points:
            - Grandpa forgets
            - Grandpa needs a pill
          - title: What happens
            points:
            - Grandpa remembers a lot
            - Vidya forgets his birthday
          alt: 'Irony in the story: Vidya expects Grandpa to be forgetful, but she is the one who forgets.'
        check:
          prompt: What is ironic about the ending?
          options:
          - The worried person forgets
          - Grandpa forgets everything
          - Ravi gets lost
          answer: The worried person forgets
          why: The result is the opposite of what was expected.
      - teach: 'Themes: respect and dignity for the elderly, the gap between generations, and how busy younger people can be the forgetful ones. The story reminds us not to judge older people too quickly.'
        check:
          prompt: Which theme does the story show?
          options:
          - Respect for the elderly
          - Life on Mars
          - Cricket tactics
          answer: Respect for the elderly
          why: Grandpa proves wiser than expected.
    items:
      - prompt: "Who wrote 'Vitamin-M'?"
        options: ["Asha Nehemiah", "Sudha Murty", "Temsula Ao", "Irene Chua"]
        answer: "Asha Nehemiah"
        difficulty: 1
        hints: ["Unit 4.", "A children's author from Chennai."]
        solution: "Step 1: Vitamin-M is in Unit 4. Step 2: It is by Asha Nehemiah."
        mistakes: {"Sudha Murty": eng9_author}
      - prompt: "What does the 'M' in 'Vitamin-M' stand for?"
        options: ["Memory", "Money", "Milk", "Medicine"]
        answer: "Memory"
        difficulty: 1
        hints: ["The family worries about forgetting.", "An imaginary vitamin."]
        solution: "Step 1: The story is about forgetfulness. Step 2: M stands for memory."
        mistakes: {"Money": eng9_read_again}
      - prompt: "How old is Grandpa in the story?"
        answer: "75"
        check: "75"
        difficulty: 1
        hints: ["Over seventy.", "Three-quarters of a century."]
        solution: "Step 1: The story gives Grandpa's age. Step 2: He is 75."
        mistakes: {"57": "e9_grandpa_age", "85": "e9_grandpa_age"}
      - prompt: "What does Ravi do to check on Grandpa?"
        options: ["He secretly follows him around the city", "He locks him at home", "He takes him to a doctor", "He gives him pills"]
        answer: "He secretly follows him around the city"
        difficulty: 2
        hints: ["He doesn't let Grandpa know.", "Out in the city."]
        solution: "Step 1: Ravi is asked to look after Grandpa. Step 2: He secretly follows him and sees what he does."
        mistakes: {"He gives him pills": eng9_read_again}
      - prompt: "What important thing does Vidya forget?"
        options: ["Her own father's birthday", "Her keys", "Ravi's school fees", "Her office address"]
        answer: "Her own father's birthday"
        difficulty: 2
        hints: ["It concerns Grandpa.", "A special day."]
        solution: "Step 1: Vidya worried about Grandpa's memory. Step 2: Yet she forgot his birthday."
        mistakes: {"Her keys": "e9_vidya_forgets"}
      - prompt: "What is ironic about the ending of the story?"
        options: ["The person worried about Grandpa's memory is the one who forgets", "Grandpa really loses his way", "Ravi forgets everything", "Nobody forgets anything"]
        answer: "The person worried about Grandpa's memory is the one who forgets"
        difficulty: 3
        hints: ["Irony is the opposite of what we expect.", "Who needs Vitamin-M in the end?"]
        solution: "Step 1: Vidya worried that Grandpa was forgetful. Step 2: She forgot his birthday, so she needs the memory vitamin: that is irony."
        mistakes: {"Grandpa really loses his way": "e9_irony"}
      - prompt: What does 'poky' mean when describing the flat?
        options:
        - Small and cramped
        - Very large
        - Expensive
        - Noisy
        answer: Small and cramped
        difficulty: 1
        hints:
        - It describes space.
        - Not much room to move.
        solution: A poky flat is small and uncomfortably crowded.
        mistakes:
          Very large: c9e1_word_meaning
      - prompt: Which of these does Grandpa remember well?
        options:
        - Chess games and the way home
        - Nothing at all
        - Only his own name
        - The pill's price
        answer: Chess games and the way home
        difficulty: 1
        hints:
        - What did Ravi discover while following him?
        - Grandpa is sharper than expected.
        solution: Ravi finds that Grandpa remembers chess games, family traditions and the way home.
        mistakes:
          Nothing at all: c9e4_who_forgets
      - prompt: Who jokes that someone needs 'Vitamin-M'?
        options:
        - Grandpa
        - Ravi
        - Vidya
        - A doctor
        answer: Grandpa
        difficulty: 2
        hints:
        - It is a gentle tease at the end.
        - Who was being doubted?
        solution: Grandpa teases Vidya after she forgets his birthday.
        mistakes:
          Vidya: c9e4_irony
      - prompt: What is the 'generation gap'?
        options:
        - Differences in ideas between older and younger people
        - A gap in a wall
        - The age of a building
        - A missing generation
        answer: Differences in ideas between older and younger people
        difficulty: 2
        hints:
        - Grandpa and Vidya see things differently.
        - Generation means people born around the same time.
        solution: The generation gap is the difference in outlook between age groups.
        mistakes:
          A gap in a wall: c9e1_word_meaning
      - prompt: Which example shows irony?
        options:
        - A fire station burns down
        - A dog barks
        - Rain falls in the monsoon
        - A teacher teaches
        answer: A fire station burns down
        difficulty: 3
        hints:
        - Irony is the opposite of what we expect.
        - Who is supposed to stop fires?
        solution: 'Step 1: A fire station should stop fires. Step 2: Its burning is the opposite of what we expect: irony.'
        mistakes:
          A teacher teaches: c9e4_irony
      - prompt: 'Choose the correct form: ''Ravi ___ Grandpa all afternoon.'''
        options:
        - followed
        - follow
        - following
        - has follow
        answer: followed
        difficulty: 1
        hints:
        - It happened in the past.
        - Add -ed.
        solution: 'Simple past: ''Ravi followed Grandpa all afternoon.'''
        mistakes:
          has follow: c9e1_grammar
      - prompt: How does the story want us to treat older people?
        options:
        - With respect, without assuming they are helpless
        - As a burden
        - By ignoring them
        - By locking them at home
        answer: With respect, without assuming they are helpless
        difficulty: 2
        hints:
        - Was Vidya right about Grandpa?
        - Think of dignity.
        solution: The story shows elders deserve respect and trust, not quick judgments.
        mistakes:
          As a burden: c9e4_who_forgets
      - prompt: Why was Ravi asked to keep an eye on Grandpa?
        options:
        - His mother feared Grandpa was getting forgetful
        - Grandpa was a thief
        - Grandpa wanted company at school
        - Ravi had no homework
        answer: His mother feared Grandpa was getting forgetful
        difficulty: 1
        hints:
        - What was Vidya's worry?
        - She wished for a memory pill.
        solution: Vidya was worried about Grandpa's memory, so she asked Ravi to watch him.
        mistakes:
          Grandpa was a thief: c9e4_who_forgets
      - prompt: Which word best describes Grandpa's joke at the end?
        options:
        - Gentle and witty
        - Cruel
        - Angry
        - Confused
        answer: Gentle and witty
        difficulty: 2
        hints:
        - He uses the 'pill' idea in return.
        - He is not upset.
        solution: 'Grandpa turns Vidya''s idea around with good humour: gentle and witty.'
        mistakes:
          Confused: c9e4_irony
  - code: cbse9k.u4.mother
    title: I Cannot Remember My Mother (Rabindranath Tagore)
    after: [cbse9k.u4.vitamin]
    notes: |
      A short poem by Rabindranath Tagore. The speaker lost his mother when he was very young and cannot picture
      her face, yet she comes back to him through his senses: when he plays, a tune seems to hum around his
      playthings like the song she sang while rocking his cradle (hearing); on an early autumn morning the scent
      of shiuli flowers (night jasmine) brings back the scent of the temple worship she did (smell); and when he
      looks at the still blue sky from his window, he feels her gaze resting on him (sight). The refrain "I
      cannot remember my mother" makes the mood bittersweet. Message: a mother's love lives on beyond memory,
      carried by the world around us.
    explanations:
      text: "The poet lost his mother too young to remember her face. But a tune while he plays, the smell of shiuli flowers in autumn, and the quiet blue sky all bring her back. He can't remember her, but he can feel her love."
      visual: "Picture a boy at play with a faint melody drawn as notes around him; then a tree with small white-and-orange shiuli flowers; then a window opening on a still blue sky."
      step_by_step: "Step 1: The speaker cannot remember his mother. Step 2: Sound: a tune at play recalls her song. Step 3: Smell: shiuli flowers recall her worship. Step 4: Sight: the blue sky feels like her gaze. Step 5: Her love remains."
      real_world: "Many people remember a grandparent through a smell, like jasmine or a certain food, more strongly than through a face."
    activity:
      type: sort
      prompt: 'I Cannot Remember My Mother: which sense brings her back?'
      bins:
      - Hearing
      - Smell
      - Sight
      items:
      - label: A tune humming around his toys
        bin: Hearing
        clue: A tune is something you…
        why: 'A tune is heard: the lullaby she sang at his cradle.'
      - label: Shiuli flowers on an autumn morning
        bin: Smell
        clue: Flowers with a scent.
        why: 'The scent of shiuli recalls her temple worship: smell.'
      - label: The still blue sky from his window
        bin: Sight
        clue: He looks out.
        why: 'Looking at the sky, he feels her gaze: sight.'
      - label: The song she sang rocking his cradle
        bin: Hearing
        clue: Songs reach you through the ears.
        why: A song is heard, so this memory comes through hearing.
      - label: Her gaze resting on him
        bin: Sight
        clue: A gaze is a look.
        why: A gaze is about eyes and seeing.
    lesson:
      - teach: 'In this short poem by Rabindranath Tagore, the speaker lost his mother when he was very young and cannot picture her face. Yet she comes back to him through his senses. The line ''I cannot remember my mother'' keeps returning: a refrain.'
        check:
          prompt: A line that is repeated in a poem is a…
          options:
          - Refrain
          - Title
          - Footnote
          answer: Refrain
          why: It comes back again and again.
      - teach: 'Hearing: when he plays, a tune seems to hum around his toys, like the song she sang as she rocked his cradle. Smell: on an early autumn morning, the scent of shiuli flowers (night jasmine) brings back the scent of her temple worship. Sight: looking at the still blue sky from his window, he feels her gaze resting on him.'
        picture:
          kind: compare
          columns:
          - title: Sense
            points:
            - Hearing
            - Smell
            - Sight
          - title: Memory of mother
            points:
            - Tune around his toys
            - Shiuli flowers, temple worship
            - Blue sky like her gaze
          alt: 'Three senses that bring back the mother: hearing a tune, smelling shiuli flowers, seeing the blue sky.'
        check:
          prompt: The shiuli flowers bring her back through which sense?
          options:
          - Smell
          - Hearing
          - Touch
          answer: Smell
          why: Their scent recalls her worship.
      - teach: 'The mood is bittersweet: sad that he cannot remember her face, yet comforted that her love surrounds him. The message: a mother''s love lives on beyond memory, carried by the world around us.'
        check:
          prompt: '''Bittersweet'' means…'
          options:
          - Sad and loving at the same time
          - Only happy
          - Only angry
          answer: Sad and loving at the same time
          why: Both feelings are mixed.
    items:
      - prompt: "Who wrote 'I Cannot Remember My Mother'?"
        options: ["Rabindranath Tagore", "Subramania Bharati", "David Roth", "Charles Swain"]
        answer: "Rabindranath Tagore"
        difficulty: 1
        hints: ["A Nobel Prize winner.", "Wrote India's national anthem."]
        solution: "Step 1: The poem is by a Bengali Nobel laureate. Step 2: It is Rabindranath Tagore."
        mistakes: {"Subramania Bharati": eng9_author}
      - prompt: "Which flower's scent reminds the poet of his mother?"
        options: ["Shiuli", "Rose", "Lotus", "Sunflower"]
        answer: "Shiuli"
        difficulty: 1
        hints: ["Blooms in early autumn.", "Also called night jasmine."]
        solution: "Step 1: The poem mentions an autumn flower. Step 2: It is the shiuli."
        mistakes: {"Rose": eng9_read_again}
      - prompt: "Which line is repeated in the poem?"
        options: ["I cannot remember my mother", "Believe in yourself", "Bharat our land", "Follow that dream"]
        answer: "I cannot remember my mother"
        difficulty: 1
        hints: ["It is the title.", "A refrain."]
        solution: "Step 1: A repeated line is a refrain. Step 2: Here it is 'I cannot remember my mother'."
        mistakes: {"Believe in yourself": "e9_refrain"}
      - prompt: "Through which three senses does the mother come back to the poet?"
        options: ["Hearing, smell and sight", "Taste, touch and hearing", "Only sight", "Only touch"]
        answer: "Hearing, smell and sight"
        difficulty: 2
        hints: ["A tune, a scent, the sky.", "Three different senses."]
        solution: "Step 1: A tune (hearing). Step 2: Shiuli scent (smell). Step 3: The blue sky (sight)."
        mistakes: {"Taste, touch and hearing": eng9_poem_meaning}
      - prompt: "What is the mood of the poem?"
        options: ["Bittersweet: sad but loving", "Angry", "Funny", "Frightening"]
        answer: "Bittersweet: sad but loving"
        difficulty: 2
        hints: ["He lost her, yet feels her love.", "Sad and warm together."]
        solution: "Step 1: Losing his mother is sad. Step 2: Feeling her presence is warm. The mood is bittersweet."
        mistakes: {"Funny": "e9_bittersweet"}
      - prompt: "What is the main message of the poem?"
        options: ["A mother's love lives on even when memory fades", "Children forget their parents quickly", "Autumn is the best season", "The sky is always blue"]
        answer: "A mother's love lives on even when memory fades"
        difficulty: 3
        hints: ["He can't picture her, but he feels her.", "Love beyond memory."]
        solution: "Step 1: He has no memory of her face. Step 2: Yet he senses her love everywhere, so love outlasts memory."
        mistakes: {"Children forget their parents quickly": eng9_poem_meaning}
      - prompt: What can the poet NOT remember about his mother?
        options:
        - Her face
        - Her love
        - Her song's feeling
        - Her presence
        answer: Her face
        difficulty: 1
        hints:
        - He lost her very young.
        - He feels her but cannot picture her.
        solution: He cannot picture his mother's face, though he still feels her love.
        mistakes:
          Her love: c9e4_refrain
      - prompt: What makes the poet feel his mother's gaze?
        options:
        - Looking at the still blue sky
        - Hearing a bell
        - Eating sweets
        - Reading a book
        answer: Looking at the still blue sky
        difficulty: 2
        hints:
        - It is the sense of sight.
        - He looks out of his window.
        solution: The calm blue sky makes him feel his mother looking at him.
        mistakes:
          Hearing a bell: c9e4_sense
      - prompt: When the poet plays, what reminds him of his mother?
        options:
        - A tune that seems to hum around his toys
        - The smell of rain
        - A photograph
        - A letter
        answer: A tune that seems to hum around his toys
        difficulty: 2
        hints:
        - It is the sense of hearing.
        - She sang while rocking his cradle.
        solution: A tune around his playthings recalls the lullaby she sang.
        mistakes:
          The smell of rain: c9e4_sense
      - prompt: Another name for shiuli is…
        options:
        - Night jasmine
        - Rose
        - Lotus
        - Sunflower
        answer: Night jasmine
        difficulty: 2
        hints:
        - It blooms at night.
        - Its flowers fall at dawn.
        solution: Shiuli is also called night jasmine (parijat).
        mistakes:
          Lotus: c9e4_sense
      - prompt: Which language device is 'I cannot remember my mother' used as, repeated through the poem?
        options:
        - Refrain
        - Simile
        - Rhetorical question
        - Alliteration
        answer: Refrain
        difficulty: 2
        hints:
        - It is repeated.
        - Songs have them too.
        solution: A line repeated through a poem is a refrain.
        mistakes:
          Simile: c9e4_refrain
      - prompt: In which season does the shiuli scent come to the poet?
        options:
        - Early autumn
        - Peak summer
        - Deep winter night
        - Monsoon afternoon
        answer: Early autumn
        difficulty: 2
        hints:
        - Shiuli blooms after the rains end.
        - It is an early morning in that season.
        solution: The poet smells shiuli on an early autumn morning.
        mistakes:
          Peak summer: c9e4_sense
      - prompt: 'Choose the word that best completes: ''The poem''s mood is sad ___ comforting.'''
        options:
        - yet
        - because
        - unless
        - so
        answer: yet
        difficulty: 2
        hints:
        - Two contrasting ideas are joined.
        - Similar to 'but'.
        solution: '''Yet'' joins two contrasting ideas: sad yet comforting.'
        mistakes:
          because: c9e1_grammar
      - prompt: What is the poem's main message?
        options:
        - A mother's love lives on even when memory fades
        - Mothers are easy to forget
        - Flowers are beautiful
        - Children should not play
        answer: A mother's love lives on even when memory fades
        difficulty: 2
        hints:
        - He cannot recall her face.
        - But he feels her all around.
        solution: Though memory has faded, her love reaches him through the world around him.
        mistakes:
          Mothers are easy to forget: c9e4_refrain
      - prompt: Why might Tagore use the senses rather than a description of his mother's face?
        options:
        - He cannot recall her face, but he still feels her presence
        - He did not like her face
        - Senses are easier to rhyme
        - He was blind
        answer: He cannot recall her face, but he still feels her presence
        difficulty: 3
        hints:
        - What can he not picture?
        - What does he still feel?
        solution: 'Step 1: Her face is lost to memory. Step 2: Sounds, scents and the sky still bring her close.'
        mistakes:
          He was blind: c9e4_sense
