# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 4: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 4
title: Vitamin-M · I Cannot Remember My Mother
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."

concepts:
  - code: cbse9k.u4.vitamin
    title: Vitamin-M (Asha Nehemiah)
    notes: |
      A story by Asha Nehemiah set in a busy city where Ravi lives with his mother Vidya and his 75-year-old
      grandfather in a small ("poky") flat. Vidya worries that Grandpa is becoming forgetful and wishes there
      were a memory pill for old people. Ravi is told to keep an eye on Grandpa and secretly follows him around
      the city. He finds that Grandpa remembers a great deal: chess games, family gift traditions and the way
      home. In the end it is Vidya who forgets something important, her own father's birthday, so Grandpa
      jokes that she is the one who needs 'Vitamin-M', M for memory. Themes: respect and dignity for the
      elderly, the generation gap, and the irony that busy younger people can be the forgetful ones.
    explanations:
      text: "Ravi's mother thinks Grandpa is getting forgetful and needs a memory pill. Ravi follows Grandpa and finds he remembers plenty. Then his mother forgets Grandpa's birthday, and Grandpa jokes that she needs 'Vitamin-M', for memory."
      visual: "Picture a small city flat: a worried mother with a list, a grandfather setting up a chess board, and a boy peeping from behind a door. On the calendar, a birthday circled that the mother has missed."
      step_by_step: "Step 1: Vidya worries about Grandpa's memory. Step 2: Ravi is asked to watch him and follows him. Step 3: Grandpa remembers chess, traditions and routes. Step 4: Vidya forgets her father's birthday. Step 5: Grandpa's joke about Vitamin-M."
      real_world: "Many elderly people in Kerala live with busy families; spending time with them often shows how sharp and wise they still are."
    items:
      - prompt: "Who wrote 'Vitamin-M'?"
        options: ["Asha Nehemiah", "Sudha Murty", "Temsula Ao", "Irene Chua"]
        answer: "Asha Nehemiah"
        difficulty: 1
        hints: ["Unit 4.", "A children's author from Chennai."]
        solution: "Step 1: Vitamin-M is in Unit 4. Step 2: It is by Asha Nehemiah."
        mistakes: {"Sudha Murty": eng9_author}
      - prompt: "What does the 'M' in 'Vitamin-M' stand for?"
        options: ["Memory", "Money", "Milk", "Medicine"]
        answer: "Memory"
        difficulty: 1
        hints: ["The family worries about forgetting.", "An imaginary vitamin."]
        solution: "Step 1: The story is about forgetfulness. Step 2: M stands for memory."
        mistakes: {"Money": eng9_read_again}
      - prompt: "How old is Grandpa in the story?"
        answer: "75"
        check: "75"
        difficulty: 1
        hints: ["Over seventy.", "Three-quarters of a century."]
        solution: "Step 1: The story gives Grandpa's age. Step 2: He is 75."
      - prompt: "What does Ravi do to check on Grandpa?"
        options: ["He secretly follows him around the city", "He locks him at home", "He takes him to a doctor", "He gives him pills"]
        answer: "He secretly follows him around the city"
        difficulty: 2
        hints: ["He doesn't let Grandpa know.", "Out in the city."]
        solution: "Step 1: Ravi is asked to look after Grandpa. Step 2: He secretly follows him and sees what he does."
        mistakes: {"He gives him pills": eng9_read_again}
      - prompt: "What important thing does Vidya forget?"
        options: ["Her own father's birthday", "Her keys", "Ravi's school fees", "Her office address"]
        answer: "Her own father's birthday"
        difficulty: 2
        hints: ["It concerns Grandpa.", "A special day."]
        solution: "Step 1: Vidya worried about Grandpa's memory. Step 2: Yet she forgot his birthday."
      - prompt: "What is ironic about the ending of the story?"
        options: ["The person worried about Grandpa's memory is the one who forgets", "Grandpa really loses his way", "Ravi forgets everything", "Nobody forgets anything"]
        answer: "The person worried about Grandpa's memory is the one who forgets"
        difficulty: 3
        hints: ["Irony is the opposite of what we expect.", "Who needs Vitamin-M in the end?"]
        solution: "Step 1: Vidya worried that Grandpa was forgetful. Step 2: She forgot his birthday, so she needs the memory vitamin: that is irony."
  - code: cbse9k.u4.mother
    title: I Cannot Remember My Mother (Rabindranath Tagore)
    after: [cbse9k.u4.vitamin]
    notes: |
      A short poem by Rabindranath Tagore. The speaker lost his mother when he was very young and cannot picture
      her face, yet she comes back to him through his senses: when he plays, a tune seems to hum around his
      playthings like the song she sang while rocking his cradle (hearing); on an early autumn morning the scent
      of shiuli flowers (night jasmine) brings back the scent of the temple worship she did (smell); and when he
      looks at the still blue sky from his window, he feels her gaze resting on him (sight). The refrain "I
      cannot remember my mother" makes the mood bittersweet. Message: a mother's love lives on beyond memory,
      carried by the world around us.
    explanations:
      text: "The poet lost his mother too young to remember her face. But a tune while he plays, the smell of shiuli flowers in autumn, and the quiet blue sky all bring her back. He can't remember her, but he can feel her love."
      visual: "Picture a boy at play with a faint melody drawn as notes around him; then a tree with small white-and-orange shiuli flowers; then a window opening on a still blue sky."
      step_by_step: "Step 1: The speaker cannot remember his mother. Step 2: Sound: a tune at play recalls her song. Step 3: Smell: shiuli flowers recall her worship. Step 4: Sight: the blue sky feels like her gaze. Step 5: Her love remains."
      real_world: "Many people remember a grandparent through a smell, like jasmine or a certain food, more strongly than through a face."
    items:
      - prompt: "Who wrote 'I Cannot Remember My Mother'?"
        options: ["Rabindranath Tagore", "Subramania Bharati", "David Roth", "Charles Swain"]
        answer: "Rabindranath Tagore"
        difficulty: 1
        hints: ["A Nobel Prize winner.", "Wrote India's national anthem."]
        solution: "Step 1: The poem is by a Bengali Nobel laureate. Step 2: It is Rabindranath Tagore."
        mistakes: {"Subramania Bharati": eng9_author}
      - prompt: "Which flower's scent reminds the poet of his mother?"
        options: ["Shiuli", "Rose", "Lotus", "Sunflower"]
        answer: "Shiuli"
        difficulty: 1
        hints: ["Blooms in early autumn.", "Also called night jasmine."]
        solution: "Step 1: The poem mentions an autumn flower. Step 2: It is the shiuli."
        mistakes: {"Rose": eng9_read_again}
      - prompt: "Which line is repeated in the poem?"
        options: ["I cannot remember my mother", "Believe in yourself", "Bharat our land", "Follow that dream"]
        answer: "I cannot remember my mother"
        difficulty: 1
        hints: ["It is the title.", "A refrain."]
        solution: "Step 1: A repeated line is a refrain. Step 2: Here it is 'I cannot remember my mother'."
      - prompt: "Through which three senses does the mother come back to the poet?"
        options: ["Hearing, smell and sight", "Taste, touch and hearing", "Only sight", "Only touch"]
        answer: "Hearing, smell and sight"
        difficulty: 2
        hints: ["A tune, a scent, the sky.", "Three different senses."]
        solution: "Step 1: A tune (hearing). Step 2: Shiuli scent (smell). Step 3: The blue sky (sight)."
        mistakes: {"Taste, touch and hearing": eng9_poem_meaning}
      - prompt: "What is the mood of the poem?"
        options: ["Bittersweet: sad but loving", "Angry", "Funny", "Frightening"]
        answer: "Bittersweet: sad but loving"
        difficulty: 2
        hints: ["He lost her, yet feels her love.", "Sad and warm together."]
        solution: "Step 1: Losing his mother is sad. Step 2: Feeling her presence is warm. The mood is bittersweet."
      - prompt: "What is the main message of the poem?"
        options: ["A mother's love lives on even when memory fades", "Children forget their parents quickly", "Autumn is the best season", "The sky is always blue"]
        answer: "A mother's love lives on even when memory fades"
        difficulty: 3
        hints: ["He can't picture her, but he feels her.", "Love beyond memory."]
        solution: "Step 1: He has no memory of her face. Step 2: Yet he senses her love everywhere, so love outlasts memory."
        mistakes: {"Children forget their parents quickly": eng9_poem_meaning}
