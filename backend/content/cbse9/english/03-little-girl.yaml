# CBSE Class 9 English (NCERT Beehive), unit 3. Written from memory of the NCERT texts: check details against the book.
subject: cbse9-eng
chapter: 3
title: The Little Girl · Rain on the Roof

tips:
  kezia_father: "Kezia was afraid of her father because he was strict and stern. Her grandmother was the one who comforted her during the day."

concepts:
  - code: cbse9e.u3.girl
    title: The Little Girl (Katherine Mansfield)
    notes: |
      Kezia is afraid of her stern father. Her grandmother sends her to talk to him on Sundays. For his
      birthday she makes a pin-cushion and stuffs it with papers from his table, which turn out to be his
      great speech for the Port Authority; he punishes her. Next door, the Macdonalds' father plays happily
      with his children. One night, with mother ill and grandmother away, Kezia has a nightmare about a
      butcher; her father comforts her and lets her sleep beside him. She realises he works hard and is
      tired: 'You've got a big heart, father dear.'
    explanations:
      text: "Kezia is scared of her strict father. When she tries to make him a gift, a pin-cushion, she stuffs it with what turns out to be his important speech, and he punishes her. But one night, when she has a nightmare and only he is home, he holds her and lets her sleep next to him. Kezia sees that he works very hard and has a big heart after all."
      visual: "Picture two scenes. Morning: a stern father in a suit, Kezia stammering by the door. Night: the same father in bed, Kezia curled up against his chest, feeling safe."
      step_by_step: "Step 1: Kezia fears her father. Step 2: Stuttering when she talks to him. Step 3: The pin-cushion and the speech; punishment. Step 4: The Macdonalds' happy family. Step 5: Nightmare; father comforts her. Step 6: She understands him."
      real_world: "Sometimes parents seem strict because they are tired or worried about work. Talking with them, and seeing their gentle side, can change how we feel."
    items:
      - prompt: "What is the name of the little girl?"
        options: ["Kezia", "Margie", "Maria", "Evelyn"]
        answer: "Kezia"
        difficulty: 1
        hints: ["Katherine Mansfield's story.", "Not from 'The Fun They Had'."]
        solution: "The little girl is Kezia."
        mistakes: {"Margie": eng9_read_again}
      - prompt: "What did Kezia stuff the pin-cushion with?"
        options: ["Her father's important speech papers", "Cotton wool", "Old clothes", "Leaves"]
        answer: "Her father's important speech papers"
        difficulty: 1
        hints: ["She found papers on his table.", "For the Port Authority."]
        solution: "She used papers that were her father's great speech for the Port Authority."
      - prompt: "Who wrote 'The Little Girl'?"
        options: ["Katherine Mansfield", "Isaac Asimov", "Deborah Cowley", "Vikram Seth"]
        answer: "Katherine Mansfield"
        difficulty: 1
        hints: ["A New Zealand writer.", "Famous for short stories."]
        solution: "Katherine Mansfield."
        mistakes: {"Isaac Asimov": eng9_author}
      - prompt: "Who usually comforted Kezia when she had nightmares?"
        options: ["Her grandmother", "Her father", "Mr Macdonald", "Her teacher"]
        answer: "Her grandmother"
        difficulty: 2
        hints: ["The night of the story she was away.", "That's why father came."]
        solution: "Her grandmother usually comforted her; that night she was away, so her father did."
        mistakes: {"Her father": kezia_father}
      - prompt: "Why did Kezia's view of her father change?"
        options: ["He comforted her after a nightmare and she saw how tired he was", "He bought her a present", "He stopped going to work", "Her grandmother told her to"]
        answer: "He comforted her after a nightmare and she saw how tired he was"
        difficulty: 2
        hints: ["The night scene.", "'You've got a big heart, father dear.'"]
        solution: "When he comforted her at night, she realised he worked hard and loved her."
      - prompt: "Which family next door did Kezia envy?"
        options: ["The Macdonalds", "The Gerrards", "The Fords", "The Sharapovas"]
        answer: "The Macdonalds"
        difficulty: 3
        hints: ["Their father played with the children.", "Mr Mac..."]
        solution: "The Macdonalds, whose father played happily with his children."

  - code: cbse9e.u3.rain
    title: Rain on the Roof (Coates Kinney)
    after: [cbse9e.u3.girl]
    notes: |
      On a humid night when stars are covered by clouds, the poet lies in a cottage bed listening to the
      patter of soft rain on the shingles (roof). Each sound recalls fond memories, especially of his
      mother, who used to watch over him lovingly in childhood. Imagery of sound; nostalgia.
    explanations:
      text: "On a rainy night, the poet lies in bed listening to the soft patter of rain on the roof. The sound brings back sweet memories, especially of his mother, who used to look at him lovingly as he fell asleep as a child. The poem shows how a simple sound can bring back the past."
      visual: "Picture a cosy room at night, rain tapping on the roof, and a person lying in bed, smiling. Above them, like a thought bubble, a mother bending over a little child's bed."
      step_by_step: "Step 1: Setting: night, clouds, rain. Step 2: The pleasure of lying in bed listening. Step 3: Memories wake up with each drop. Step 4: The mother's loving look is the strongest memory."
      real_world: "Many people say the sound of rain or a smell like jasmine reminds them of their grandparents' house. That is what happens to the poet."
    items:
      - prompt: "Who wrote 'Rain on the Roof'?"
        options: ["Coates Kinney", "Robert Frost", "W.B. Yeats", "Phoebe Cary"]
        answer: "Coates Kinney"
        difficulty: 1
        hints: ["An American poet.", "Not Frost."]
        solution: "Coates Kinney."
        mistakes: {"Robert Frost": eng9_author}
      - prompt: "Whom does the poet remember most while listening to the rain?"
        options: ["His mother", "His teacher", "His brother", "His friend"]
        answer: "His mother"
        difficulty: 1
        hints: ["She watched over him as a child.", "Fond look."]
        solution: "He remembers his mother."
      - prompt: "What feeling does the poem mainly express?"
        options: ["Nostalgia, a warm longing for the past", "Fear", "Anger", "Boredom"]
        answer: "Nostalgia, a warm longing for the past"
        difficulty: 2
        hints: ["Memories of childhood.", "Happy and a little sad."]
        solution: "The poem expresses nostalgia."
      - prompt: "Where is the poet while listening to the rain?"
        options: ["In bed in a cottage", "Under a tree", "On a boat", "In a classroom"]
        answer: "In bed in a cottage"
        difficulty: 1
        hints: ["Lying down.", "A cottage chamber bed."]
        solution: "He lies in bed in a cottage."
      - prompt: "What are 'shingles' in the poem?"
        options: ["Roof tiles", "Pebbles on a beach", "Trees", "Clouds"]
        answer: "Roof tiles"
        difficulty: 2
        hints: ["Rain falls on them.", "Part of the roof."]
        solution: "Shingles are the tiles of the roof."
      - prompt: "Which sense does the poem appeal to most?"
        options: ["Hearing", "Taste", "Smell", "Touch"]
        answer: "Hearing"
        difficulty: 3
        hints: ["Patter and tinkle.", "Listening."]
        solution: "The poem is built on the sound of rain, appealing to hearing."
