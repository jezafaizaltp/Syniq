  kalam_teachers: "Sivasubramania Iyer, the science teacher, invited young Kalam to his home for a meal despite caste prejudice; the new teacher who made Kalam move from the front bench was scolded by Lakshmana Sastry."

concepts:
  - code: cbse9e.u6.childhood
    title: My Childhood (A.P.J. Abdul Kalam)
    notes: |
      From Kalam's autobiography 'Wings of Fire'. Born 1931 in Rameswaram, Tamil Nadu, in a middle-class
      Tamil Muslim family; father Jainulabdeen, mother Ashiamma. Friends Ramanadha Sastry (son of the
      high priest Pakshi Lakshmana Sastry), Aravindan and Sivaprakasan. During the Second World War (1939)
      tamarind seeds were in demand; Kalam earned his first wages helping his cousin Samsuddin distribute
      newspapers, which were thrown from the moving train once it stopped halting at Rameswaram. A new teacher made Kalam (with a cap)
      move from the front bench away from Ramanadha; Lakshmana Sastry made the teacher apologise. Science
      teacher Sivasubramania Iyer invited Kalam home for a meal despite his wife's orthodoxy. Kalam left
      Rameswaram to study at Ramanathapuram with his father's blessing.
    explanations:
      text: "In this part of his autobiography, Dr Kalam remembers growing up in Rameswaram. His family was not rich but lived simply and happily. His closest friends came from different religions. He earned his first money as a boy, helping his cousin Samsuddin deliver newspapers during the Second World War. He also tells how some adults stood up against caste and religious prejudice, and how his parents let him leave home to study."
      visual: "Picture a small temple town by the sea. A boy in a cap sits on the front bench beside his friend Ramanadha, son of the temple priest. Later the same boy runs along the railway, catching bundles of newspapers thrown from a train."
      step_by_step: "Step 1: Family: father Jainulabdeen, mother Ashiamma, simple home. Step 2: Friends of different faiths. Step 3: First earnings: newspapers with Samsuddin during the war. Step 4: The new teacher's prejudice and Lakshmana Sastry's response. Step 5: Sivasubramania Iyer's meal. Step 6: Leaving Rameswaram to study."
      real_world: "Dr Kalam later became a rocket scientist and the 11th President of India. His story shows how teachers and friends who rise above prejudice can shape a child's future."
    items:
      - prompt: "Where was A.P.J. Abdul Kalam born?"
        options: ["Rameswaram", "Chennai", "Madurai", "Kanyakumari"]
        answer: "Rameswaram"
        difficulty: 1
        hints: ["An island town in Tamil Nadu.", "Famous for its Shiva temple."]
        solution: "He was born in Rameswaram."
      - prompt: "What was the name of Kalam's father?"
        options: ["Jainulabdeen", "Samsuddin", "Ahmed Jallaluddin", "Lakshmana Sastry"]
        answer: "Jainulabdeen"
        difficulty: 1
        hints: ["He owned boats.", "Not his cousin."]
        solution: "His father was Jainulabdeen."
        mistakes: {"Samsuddin": eng9_read_again}
      - prompt: "From which book is 'My Childhood' taken?"
        options: ["Wings of Fire", "Ignited Minds", "Long Walk to Freedom", "The Story of My Experiments with Truth"]
        answer: "Wings of Fire"
        difficulty: 2
        hints: ["Kalam's autobiography.", "Something that flies."]
        solution: "It is from 'Wings of Fire'."
      - prompt: "How did Kalam earn his first wages?"
        options: ["Helping his cousin distribute newspapers", "Selling fish", "Teaching younger children", "Working in a temple"]
        answer: "Helping his cousin distribute newspapers"
        difficulty: 1
        hints: ["During the Second World War.", "Bundles thrown from a train."]
        solution: "He helped his cousin Samsuddin distribute newspapers."
      - prompt: "Which teacher invited Kalam home for a meal?"
        options: ["Sivasubramania Iyer", "Lakshmana Sastry", "The new teacher", "Ramanadha Sastry"]
        answer: "Sivasubramania Iyer"
        difficulty: 2
        hints: ["His science teacher.", "His wife was orthodox at first."]
        solution: "His science teacher, Sivasubramania Iyer."
        mistakes: {"Lakshmana Sastry": kalam_teachers}
      - prompt: "In which year did the Second World War break out, as mentioned in the lesson?"
        answer: "1939"
        check: "1939"
        difficulty: 3
        hints: ["Tamarind seeds were suddenly in demand.", "Kalam was eight."]
        solution: "The war broke out in 1939."

  - code: cbse9e.u6.foreign
    title: No Men Are Foreign (James Kirkup)
    after: [cbse9e.u6.childhood]
    notes: |
      'Remember, no men are strange, no countries foreign.' Beneath all uniforms, a single body breathes like
      ours; they walk on the same land, see the same sun, air and water; they have hands that work, eyes
      that sleep and wake, and can be won by love. Hating them, we hate ourselves; war ('dust and
      arms') pollutes the earth we share. Theme: universal brotherhood, against war.
    explanations:
      text: "James Kirkup reminds us that people in other countries are just like us. Under every uniform is a body that breathes, eats, works and loves as we do. We share the same earth, sun, air and water. If we hate and fight other people, we harm ourselves and the earth we all share."
      visual: "Draw two soldiers in different uniforms, facing each other. Peel the uniforms away in your mind: underneath, both have the same hands, the same heartbeat, the same sky above them."
      step_by_step: "Step 1: Opening line: no men are strange, no countries foreign. Step 2: We share the same body, land, sun, air, water. Step 3: Everyone can be won by love. Step 4: Hating others is hating ourselves; war defiles the earth."
      real_world: "Sports like the Olympics and the World Cup bring people from every country together. Fans often find that their 'rivals' love the same things they do."
    items:
      - prompt: "Who wrote 'No Men Are Foreign'?"
        options: ["James Kirkup", "Gieve Patel", "Robert Frost", "Subramania Bharati"]
        answer: "James Kirkup"
        difficulty: 1
        hints: ["A British poet.", "Not Patel."]
        solution: "James Kirkup."
        mistakes: {"Gieve Patel": eng9_author}
      - prompt: "What is the main message of the poem?"
        options: ["All people are alike and we should not hate each other", "Our country is better than others", "Travel is dangerous", "Uniforms are important"]
        answer: "All people are alike and we should not hate each other"
        difficulty: 1
        hints: ["Universal brotherhood.", "'No men are strange.'"]
        solution: "The poem says all humans are the same and hatred and war harm us all."
      - prompt: "What lies beneath all uniforms, according to the poet?"
        options: ["A single body that breathes like ours", "Weapons", "Medals", "Nothing"]
        answer: "A single body that breathes like ours"
        difficulty: 2
        hints: ["Uniforms make people look different.", "Underneath, all are human."]
        solution: "'Beneath all uniforms, a single body breathes like ours.'"
        mistakes: {"Weapons": eng9_poem_meaning}
      - prompt: "When we hate others, whom do we really hate, according to the poem?"
        options: ["Ourselves", "Our enemies only", "Our teachers", "Nobody"]
        answer: "Ourselves"
        difficulty: 2
        hints: ["We are all the same.", "'…we hate ourselves.'"]
        solution: "The poet says that in hating others, we betray and hate ourselves."
      - prompt: "Which of these do all people share, according to the poem?"
        options: ["The same sun, air and water", "The same language", "The same food", "The same uniform"]
        answer: "The same sun, air and water"
        difficulty: 1
        hints: ["Nature.", "The earth we live on."]
        solution: "We all share the same sun, air and water."
      - prompt: "What does the poet say war does to the earth?"
        options: ["It pollutes and defiles it", "It makes it greener", "It has no effect", "It makes it peaceful"]
        answer: "It pollutes and defiles it"
        difficulty: 3
        hints: ["'dust and arms'.", "Harm to our shared land."]
        solution: "War defiles the innocent green earth we all share."
