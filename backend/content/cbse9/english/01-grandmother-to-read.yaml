# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 1: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 1
title: How I Taught My Grandmother to Read · Bharat Our Land
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_bharati_lang: "Bengali was Tagore's language. Bharati was born in the far south, in Ettayapuram, and wrote for the people of his own region."
  e9_bharati_role: "Bharati wrote during the struggle against British rule. What else did he do besides write?"
  e9_deadline: "The grandmother tied her goal to a festival when people worship the goddess of learning. Which one fits?"
  e9_honour_teacher: "In Indian tradition, whose feet do we touch to show respect? Think of what the girl had become for her grandmother."
  e9_poem_feeling: "Read the poem's praise of the land again. Is the speaker afraid, sad or proud?"

concepts:
  - code: cbse9k.u1.grandmother
    title: How I Taught My Grandmother to Read (Sudha Murty)
    notes: |
      A true story by Sudha Murty, set in a village in north Karnataka where buses and newspapers came late.
      The narrator, then a twelve-year-old girl, read aloud each week's instalment of the Kannada serial novel
      Kashi Yatre to her grandmother Krishtakka (whom she calls Avva), who was 62 and had never gone to school.
      When the narrator went away to a wedding for a week, Avva could not read the new episode herself and felt
      helpless and ashamed. She decided to learn the Kannada alphabet and set a deadline: Saraswati Puja during
      Dassara. The narrator laughed at first, but Avva said there is no age limit for learning. She worked hard
      and succeeded, and on Saraswati Puja she touched her granddaughter's feet in respect for her teacher.
      Themes: learning at any age, determination, dignity of literacy, respect for teachers.
    explanations:
      text: "A grandmother who has never been to school loves a serialised novel, but can only enjoy it when her granddaughter reads it aloud. When the girl is away for a week, the grandmother feels helpless and decides, at 62, to learn to read. Her twelve-year-old granddaughter becomes her teacher, and she succeeds."
      visual: "Picture a village courtyard: an elderly woman with a slate, carefully copying Kannada letters, while a young girl points at the letters. On the shelf lies a magazine with the serial Kashi Yatre."
      step_by_step: "Step 1: Avva follows Kashi Yatre through her granddaughter's reading. Step 2: The girl goes away for a week. Step 3: Avva feels helpless and resolves to learn. Step 4: She sets Saraswati Puja as her deadline. Step 5: She learns, and honours her young teacher."
      real_world: "Adult literacy classes in Kerala's literacy movement had learners in their seventies and eighties; some still sit and pass equivalency exams today."
    activity:
      type: order
      prompt: 'How I Taught My Grandmother to Read: put the story in order.'
      steps:
      - The girl reads Kashi Yatre aloud to Avva each week
      - The girl goes away to a wedding for a week
      - Avva cannot read the new episode and feels helpless
      - Avva decides to learn the alphabet by Saraswati Puja
      - Avva works hard every day with her granddaughter
      - Avva touches her teacher's feet on Saraswati Puja
      reasons:
        The girl goes away to a wedding for a week: The reading habit is set up first; then she leaves.
        Avva cannot read the new episode and feels helpless: With no reader at home, Avva is stuck with the magazine.
        Avva decides to learn the alphabet by Saraswati Puja: Her helplessness turns into a decision and a deadline.
        Avva works hard every day with her granddaughter: A decision needs daily effort before the deadline.
        Avva touches her teacher's feet on Saraswati Puja: She can read now, so she honours the one who taught her.
    items:
      - prompt: "Who wrote 'How I Taught My Grandmother to Read'?"
        options: ["Sudha Murty", "Temsula Ao", "Asha Nehemiah", "Mitra Phukan"]
        answer: "Sudha Murty"
        difficulty: 1
        hints: ["A well-known writer from Karnataka.", "It is a true story from her childhood."]
        solution: "Step 1: The story is a true account from the writer's own childhood. Step 2: The writer is Sudha Murty."
        mistakes: {"Temsula Ao": eng9_author}
      - prompt: "What was the name of the novel the grandmother loved?"
        options: ["Kashi Yatre", "Malgudi Days", "Panchatantra", "Kalidasa"]
        answer: "Kashi Yatre"
        difficulty: 1
        hints: ["It was about a journey to a holy city.", "It came out in weekly parts."]
        solution: "Step 1: The novel came in a weekly magazine. Step 2: It was Kashi Yatre."
        mistakes: {"Malgudi Days": eng9_read_again}
      - prompt: "How old was the grandmother when she decided to learn to read?"
        answer: "62"
        check: "62"
        difficulty: 1
        hints: ["Over sixty.", "She had never been to school."]
        solution: "Step 1: The story gives her age when she decided. Step 2: She was 62."
        mistakes: {"12": eng9_read_again}
      - prompt: "What made the grandmother decide to learn to read?"
        options: ["She could not read the new episode while her granddaughter was away", "Her teacher told her to", "She wanted to get a job", "She lost a bet"]
        answer: "She could not read the new episode while her granddaughter was away"
        difficulty: 2
        hints: ["The granddaughter went to a wedding.", "The magazine came, but no one could read it to her."]
        solution: "Step 1: The narrator was away for a week. Step 2: Avva could not read the new instalment and felt helpless, so she decided to learn."
        mistakes: {"She wanted to get a job": eng9_read_again}
      - prompt: "What deadline did the grandmother set for learning the alphabet?"
        options: ["Saraswati Puja during Dassara", "Diwali", "Her next birthday", "The end of the monsoon"]
        answer: "Saraswati Puja during Dassara"
        difficulty: 2
        hints: ["A festival of learning.", "The goddess of knowledge."]
        solution: "Step 1: She chose a festival linked to learning. Step 2: It was Saraswati Puja during Dassara."
        mistakes: {"Diwali": "e9_deadline", "Her next birthday": "e9_deadline"}
      - prompt: "Why did the grandmother touch her granddaughter's feet at the end?"
        options: ["To honour her as her teacher", "Because she was angry", "To ask for money", "Because it was the girl's birthday"]
        answer: "To honour her as her teacher"
        difficulty: 3
        hints: ["In Indian tradition we respect our gurus.", "Age doesn't matter for respect to a teacher."]
        solution: "Step 1: The girl had taught her to read. Step 2: Avva showed respect to her teacher, whatever her age."
        mistakes: {"Because she was angry": "e9_honour_teacher", "Because it was the girl's birthday": "e9_honour_teacher"}
  - code: cbse9k.u1.bharat
    title: Bharat Our Land (Subramania Bharati)
    after: [cbse9k.u1.grandmother]
    notes: |
      A patriotic poem by Subramania Bharati, the Tamil poet and freedom fighter (often called Mahakavi
      Bharati), read in English translation. It celebrates India as a land of great mountains, rivers, fields
      and ancient learning, whose many people and regions share one home, and calls on its people to work
      together to make the country strong and great. The tone is proud and hopeful. Read it as a song of love for
      the motherland and of unity in diversity.
    explanations:
      text: "Bharati sings with pride about India: its mountains, rivers and fields, its long tradition of learning, and its people from many regions who share one land. He calls on everyone to work together to make the country great."
      visual: "Picture a map of India with the Himalayas in the north, rivers flowing to the seas, green fields and people of many regions holding hands across it."
      step_by_step: "Step 1: Who is the poet? A Tamil poet and freedom fighter. Step 2: What does he praise? India's land and heritage. Step 3: What does he ask of us? Unity and work to build the nation. Step 4: Feel the tone: proud and hopeful."
      real_world: "Bharati's songs were sung at freedom struggle meetings, and some are still sung at Independence Day events in Tamil Nadu schools."
    activity:
      type: sort
      prompt: 'Bharat Our Land: what does each line of thought show?'
      bins:
      - Pride in the land
      - Unity of many
      - Call to work
      items:
      - label: Great mountains, rivers and fields
        bin: Pride in the land
        clue: These are the country's natural features.
        why: The poet praises what the land itself holds, so this is pride in the land.
      - label: Ancient learning that the world admired
        bin: Pride in the land
        clue: Something old the country is known for.
        why: Praising India's past learning is pride, not a call to act.
      - label: Many regions sharing one home
        bin: Unity of many
        clue: Many, yet one home.
        why: Many parts in one home is the idea of unity in diversity.
      - label: People of many tongues as one family
        bin: Unity of many
        clue: Different languages, one family.
        why: Different people seen as one family shows unity.
      - label: Let us build the country strong
        bin: Call to work
        clue: 'Look for ''let us'': what does it ask readers to do?'
        why: '''Let us'' asks people to act, so it is a call to work, not only praise.'
      - label: Work together to make her great
        bin: Call to work
        clue: This line looks ahead, not back.
        why: 'It asks for future effort together: a call to work.'
    items:
      - prompt: "Who wrote the poem 'Bharat Our Land'?"
        options: ["Subramania Bharati", "Rabindranath Tagore", "Charles Swain", "David Roth"]
        answer: "Subramania Bharati"
        difficulty: 1
        hints: ["A Tamil poet.", "Also a freedom fighter."]
        solution: "Step 1: The poem is translated from Tamil. Step 2: It is by Subramania Bharati."
        mistakes: {"Rabindranath Tagore": eng9_author}
      - prompt: "Subramania Bharati wrote mainly in which language?"
        options: ["Tamil", "Bengali", "Kannada", "Marathi"]
        answer: "Tamil"
        difficulty: 1
        hints: ["He was from the far south.", "Mahakavi of Tamil Nadu."]
        solution: "Step 1: Bharati was from Tamil Nadu. Step 2: He wrote in Tamil."
        mistakes: {"Bengali": "e9_bharati_lang"}
      - prompt: "What is the main feeling of the poem?"
        options: ["Pride and love for the motherland", "Fear of the future", "Sadness about a lost friend", "Anger at nature"]
        answer: "Pride and love for the motherland"
        difficulty: 1
        hints: ["It is a patriotic poem.", "It praises the land."]
        solution: "Step 1: The poet praises India's land and people. Step 2: The feeling is pride and love for the country."
        mistakes: {"Fear of the future": "e9_poem_feeling"}
      - prompt: "Besides being a poet, Subramania Bharati was also a…"
        options: ["Freedom fighter", "Cricketer", "Scientist in space research", "Film director"]
        answer: "Freedom fighter"
        difficulty: 2
        hints: ["He lived during British rule.", "His songs inspired the national movement."]
        solution: "Step 1: Bharati lived from 1882 to 1921. Step 2: He took part in the freedom struggle."
        mistakes: {"Film director": "e9_bharati_role"}
      - prompt: "When a poem praises mountains, rivers and many peoples of one country, what idea does it stress?"
        options: ["Unity in diversity", "Every region should be separate", "Cities are better than villages", "Only one language matters"]
        answer: "Unity in diversity"
        difficulty: 2
        hints: ["Many kinds, one land.", "A common idea about India."]
        solution: "Step 1: The poem names many parts of the land and people. Step 2: Together they form one nation: unity in diversity."
        mistakes: {"Every region should be separate": eng9_poem_meaning}
      - prompt: "What does the poet want the people of the land to do?"
        options: ["Work together to make the nation strong", "Leave the country", "Stop studying", "Forget their heritage"]
        answer: "Work together to make the nation strong"
        difficulty: 3
        hints: ["Patriotic poems often end with a call.", "Building the nation."]
        solution: "Step 1: After praising the land, the poet looks to the future. Step 2: He calls on people to work together for the nation."
        mistakes: {"Forget their heritage": eng9_poem_meaning}
