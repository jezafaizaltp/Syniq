# CBSE Class 9 English (NCERT Beehive), unit 1: a prose lesson and a poem.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse9-eng
chapter: 1
title: The Fun They Had · The Road Not Taken

tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."

concepts:
  - code: cbse9e.u1.fun
    title: The Fun They Had (Isaac Asimov)
    notes: |
      Science fiction set on 17 May 2157. Tommy (13) finds a real printed book about school long ago. Margie
      (11) studies at home with a mechanical teacher; she is doing badly in geography and the County
      Inspector adjusts the teacher. Homework and tests are put into a slot in punch code. Tommy says the old
      teachers were men and children went to a schoolhouse together. Margie thinks of how the children must
      have loved it: 'the fun they had'. Themes: technology vs human teaching, learning together.
    explanations:
      text: "In 2157 children learn alone at home from mechanical teachers on screens. When Tommy finds an old printed book about schools where children learned together from a human teacher, Margie is amazed. She hates her own lessons and imagines how much fun the old schools must have been."
      visual: "Picture two rooms. In one, Margie sits alone facing a big screen that flashes questions. In the other, from the book, many children sit together, laughing and helping each other, with a teacher at the front."
      step_by_step: "Step 1: Setting: 17 May 2157. Step 2: Tommy finds a real book. Step 3: Margie's trouble with her mechanical teacher and the County Inspector. Step 4: Tommy explains old schools. Step 5: Margie imagines 'the fun they had'."
      real_world: "During the pandemic many of us studied online, alone at home. Like Margie, many students said they missed laughing and learning with friends in a real classroom."
    items:
      - prompt: "Who wrote 'The Fun They Had'?"
        options: ["Isaac Asimov", "Robert Frost", "Katherine Mansfield", "Vikram Seth"]
        answer: "Isaac Asimov"
        difficulty: 1
        hints: ["A famous science fiction writer.", "He wrote about robots."]
        solution: "Isaac Asimov."
        mistakes: {"Robert Frost": eng9_author}
      - prompt: "In which year is the story set?"
        answer: "2157"
        check: "2157"
        difficulty: 1
        hints: ["Margie wrote about it in her diary.", "17 May of a future year."]
        solution: "The story is set on 17 May 2157."
      - prompt: "What did Tommy find?"
        options: ["A real printed book", "A mechanical teacher", "An old computer", "A diary"]
        answer: "A real printed book"
        difficulty: 1
        hints: ["Margie wrote 'Today Tommy found a real book!'", "With yellow, crinkly pages."]
        solution: "Tommy found a real printed book about school in the old days."
        mistakes: {"A mechanical teacher": eng9_read_again}
      - prompt: "In which subject was Margie doing badly?"
        options: ["Geography", "History", "Arithmetic", "English"]
        answer: "Geography"
        difficulty: 2
        hints: ["The County Inspector slowed the teacher down.", "Maps and places."]
        solution: "She was doing badly in geography, so the Inspector adjusted the mechanical teacher."
        mistakes: {"Arithmetic": eng9_read_again}
      - prompt: "How old was Margie?"
        answer: "11"
        check: "11"
        difficulty: 2
        hints: ["Tommy was two years older.", "Tommy was 13."]
        solution: "Margie was 11 and Tommy was 13."
        mistakes: {"13": eng9_read_again}
      - prompt: "Why did Margie think the old schools were fun?"
        options: ["Children learned together and helped each other", "There was no homework at all", "The teachers were robots", "School was only on Sundays"]
        answer: "Children learned together and helped each other"
        difficulty: 3
        hints: ["Think about how lonely her own lessons were.", "Friends in one building."]
        solution: "She imagined children of the same age learning together, laughing and helping each other."

  - code: cbse9e.u1.road
    title: The Road Not Taken (Robert Frost)
    after: [cbse9e.u1.fun]
    notes: |
      Two roads diverge in a yellow wood (autumn). The speaker looks down one as far as he can, then takes
      the other, 'just as fair' and perhaps 'having the better claim, because it was grassy and wanted wear',
      though both were worn about the same. He keeps the first 'for another day', doubting he will return.
      'I shall be telling this with a sigh / Somewhere ages and ages hence': he took 'the one less traveled
      by, / And that has made all the difference.' Four stanzas of five lines; rhyme scheme ABAAB. Theme:
      choices in life.
    explanations:
      text: "A traveller stands where a road splits in two in an autumn forest. He can take only one. He chooses the one that seems less used, keeping the other for another day, though he knows he probably won't return. Years later, he says, that choice 'made all the difference'. The roads stand for choices in life."
      visual: "Draw a fork in a path in a forest of yellow leaves. One path bends out of sight; the other is grassier. A person stands at the fork, looking down one, then stepping onto the other."
      step_by_step: "Step 1: Stanza 1: two roads, one traveller, a long look. Step 2: Stanza 2: he takes the other, grassier road. Step 3: Stanza 3: both roads were really about the same; he saves the first for another day. Step 4: Stanza 4: one day he'll tell this 'with a sigh'; the choice made all the difference."
      real_world: "Choosing between science and commerce after Class 10, or between two hobbies, can feel like this. You can't try both at once, and the choice shapes what comes next."
    items:
      - prompt: "Who wrote 'The Road Not Taken'?"
        options: ["Robert Frost", "W.B. Yeats", "William Wordsworth", "James Kirkup"]
        answer: "Robert Frost"
        difficulty: 1
        hints: ["An American poet.", "He wrote about rural New England."]
        solution: "Robert Frost."
        mistakes: {"William Wordsworth": eng9_author}
      - prompt: "What colour was the wood where the roads diverged?"
        options: ["Yellow", "Green", "Dark", "Red"]
        answer: "Yellow"
        difficulty: 1
        hints: ["It's the first line.", "Autumn leaves."]
        solution: "'Two roads diverged in a yellow wood': it was autumn."
      - prompt: "How many lines are there in each stanza of the poem?"
        answer: "5"
        check: "5"
        difficulty: 2
        hints: ["Count the lines of the first stanza.", "Rhyme scheme ABAAB."]
        solution: "Each stanza has five lines."
      - prompt: "What do the two roads stand for?"
        options: ["Choices in life", "Two cities", "Two seasons", "Two friends"]
        answer: "Choices in life"
        difficulty: 2
        hints: ["The poem isn't really about walking.", "Decisions."]
        solution: "The roads are a metaphor for choices we make in life."
        mistakes: {"Two cities": eng9_poem_meaning}
      - prompt: "Which road did the poet take?"
        options: ["The one less traveled by", "The busier one", "Neither", "Both, one after another"]
        answer: "The one less traveled by"
        difficulty: 1
        hints: ["Last stanza.", "'And that has made all the difference.'"]
        solution: "He took 'the one less traveled by'."
      - prompt: "What is the rhyme scheme of each stanza?"
        options: ["ABAAB", "AABB", "ABAB", "ABCD"]
        answer: "ABAAB"
        difficulty: 3
        hints: ["wood, both, stood, could, undergrowth.", "Five lines."]
        solution: "wood (A), both (B), stood (A), could (A), undergrowth (B): ABAAB."
