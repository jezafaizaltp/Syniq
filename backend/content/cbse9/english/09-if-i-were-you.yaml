# CBSE Class 9 English (NCERT Beehive), unit 9. Written from memory of the NCERT texts: check details against the book.
subject: cbse9-eng
chapter: 9
title: If I Were You

tips:
  gerrard_trick: "Gerrard tricks the Intruder by saying he is a criminal too, and gets him to walk into a cupboard (supposedly the way to the garage), then locks him in."

concepts:
  - code: cbse9e.u9.play
    title: If I Were You (Douglas James)
    notes: |
      A one-act play. Gerrard, a playwright, lives in a lonely cottage. An Intruder, a criminal who has
      killed a policeman and is on the run, plans to kill Gerrard and take his identity because they look
      alike. Gerrard stays calm and witty ('I'm used to that'), and invents a story: he too is a criminal
      wanted by the police and the 'props' for his play are evidence. He says the police are coming and
      offers to show the escape route through the garage, but tricks the Intruder into a cupboard and locks
      him in. Then he phones: 'Hello, is that the police? ... I have the man you want.'
    explanations:
      text: "A criminal breaks into the lonely cottage of Gerrard, a playwright, planning to kill him and take over his life because they look alike. Gerrard keeps calm and makes up a story that he himself is a wanted criminal, so taking his identity would be dangerous. He offers to help the intruder escape, tricks him into a cupboard, locks the door, and calls the police."
      visual: "Picture a small cottage room: Gerrard on the phone, calm and smiling, and the Intruder pointing a gun. In the next scene, the Intruder bangs on a locked cupboard door while Gerrard dials the police."
      step_by_step: "Step 1: The Intruder arrives with a gun. Step 2: He explains his plan to become Gerrard. Step 3: Gerrard stays calm and asks questions. Step 4: Gerrard invents that he is a criminal too. Step 5: He leads the Intruder into a cupboard and locks it. Step 6: He calls the police."
      real_world: "Staying calm and thinking clearly in an emergency can be more powerful than strength. Gerrard uses his wit, the playwright's skill of storytelling, to save himself."
    items:
      - prompt: "Who wrote the play 'If I Were You'?"
        options: ["Douglas James", "Vikram Seth", "Isaac Asimov", "Deborah Cowley"]
        answer: "Douglas James"
        difficulty: 1
        hints: ["A British playwright.", "Not Asimov."]
        solution: "Douglas James."
        mistakes: {"Isaac Asimov": eng9_author}
      - prompt: "What is Gerrard's profession?"
        options: ["Playwright", "Police officer", "Doctor", "Shopkeeper"]
        answer: "Playwright"
        difficulty: 1
        hints: ["He writes for the stage.", "He talks about 'props'."]
        solution: "Gerrard is a playwright."
      - prompt: "Why did the Intruder want to kill Gerrard?"
        options: ["To take his identity because they looked alike", "To steal his money", "Because Gerrard insulted him", "By mistake"]
        answer: "To take his identity because they looked alike"
        difficulty: 1
        hints: ["He was running from the police.", "A resemblance."]
        solution: "He wanted to become Gerrard to escape the police."
      - prompt: "How did Gerrard trap the Intruder?"
        options: ["He tricked him into a cupboard and locked it", "He knocked him out", "He called his neighbours", "He ran away"]
        answer: "He tricked him into a cupboard and locked it"
        difficulty: 2
        hints: ["He pretended to show the way to the garage.", "A door that leads nowhere."]
        solution: "He led him into a cupboard, saying it was the way out, and locked him in."
        mistakes: {"He knocked him out": gerrard_trick}
      - prompt: "What story did Gerrard make up to fool the Intruder?"
        options: ["That he was also a criminal wanted by the police", "That he was a police officer", "That he had no money", "That his family was coming"]
        answer: "That he was also a criminal wanted by the police"
        difficulty: 2
        hints: ["Becoming Gerrard would be dangerous.", "He used his 'props' as proof."]
        solution: "He claimed he was a criminal on the run, so the Intruder would want to escape rather than become him."
      - prompt: "Which quality helps Gerrard most?"
        options: ["Presence of mind and wit", "Physical strength", "Wealth", "A weapon"]
        answer: "Presence of mind and wit"
        difficulty: 3
        hints: ["He stays calm and witty.", "'I'm used to that.'"]
        solution: "His calmness, quick thinking and wit save him."
