# CBSE Class 9 English (NCERT Moments, supplementary reader), story 8.
# Written from memory of the NCERT text, not from the printed book: check names and details against it.
subject: cbse9-eng
chapter: 17
title: 'Moments: A House Is Not a Home'
concepts:
- code: cbse9e.m8.house
  title: A House Is Not a Home (Zan Gaudioso)
  notes: |
    A true story told by the narrator, a boy starting high school, who feels lonely in his new school and
    misses his old friends. Soon after, while he is at home, the house catches fire. He and his mother get out,
    but his mother runs back in for important papers and photographs; a firefighter brings her out. The house
    is destroyed, and the boy is upset that his cat is missing. At school he feels even more alone, until
    students and teachers he barely knows bring him clothes, books, supplies and help. Later a woman finds his
    cat and returns it. He learns that people, not things, make a home. Theme: community, kindness and loss.
  explanations:
    text: A lonely boy in a new high school loses his house and almost everything in it to a fire. His cat goes missing too. Then the school community, people he hardly knew, rallies round with clothes and supplies, and his cat is found. He realises that a home is the people who care for you, not the building.
    visual: Draw a house with smoke and flames, a boy and his mother outside, and a firefighter carrying papers out. Next, draw a school locker area with many students holding out bags of clothes and books to the boy. In the last box, draw a woman handing him his cat.
    step_by_step: 'Step 1: Starting high school, the boy feels lonely. Step 2: The house catches fire; his mother runs back in and is rescued. Step 3: The house is lost and the cat is missing. Step 4: Classmates and teachers bring him what he needs. Step 5: The cat is returned, and he learns what a home is.'
    real_world: When a family's house is damaged in a flood or fire, neighbours often bring food, clothes and help. Those moments show that a community can be a home.
  picture:
    kind: flow
    steps:
    - New at high school, the boy feels lonely
    - 'Fire: his mother runs back in for papers; a firefighter brings her out'
    - The house is destroyed and his cat is missing
    - Classmates and teachers bring clothes, books and supplies
    - A woman finds his cat and returns it
    - He learns that people, not a building, make a home
    alt: 'A House Is Not a Home in six steps: loneliness at a new school, the fire, the lost cat, the school community''s help, the cat''s return, and the lesson that people make a home.'
  items:
  - prompt: Who wrote 'A House Is Not a Home'?
    options:
    - Zan Gaudioso
    - Harsh Mander
    - O. Henry
    - Ruskin Bond
    answer: Zan Gaudioso
    difficulty: 1
    hints:
    - It is a true story.
    - Not an Indian writer.
    solution: Zan Gaudioso.
    mistakes:
      Harsh Mander: eng9_author
  - prompt: How did the narrator feel at his new high school at first?
    options:
    - Lonely, missing his old friends
    - Happy and popular
    - Angry with his teachers
    - Proud of his marks
    answer: Lonely, missing his old friends
    difficulty: 1
    hints:
    - Everyone was new to him.
    - His friends were at other schools.
    solution: He felt lonely and missed his old school and friends.
  - prompt: Why did the narrator's mother run back into the burning house?
    options:
    - To get important papers and photographs
    - To save the cat
    - To turn off the stove
    - To call the fire brigade
    answer: To get important papers and photographs
    difficulty: 2
    hints:
    - Things that could not be replaced.
    - A firefighter brought her out.
    solution: She went back for important papers and family photographs.
    mistakes:
      To save the cat: eng9_read_again
  - prompt: What did the narrator miss most after the fire?
    options:
    - His cat
    - His bicycle
    - His computer
    - His trophies
    answer: His cat
    difficulty: 1
    hints:
    - A pet.
    - It was found later.
    solution: He was most upset that his cat was missing.
  - prompt: How did the school community help?
    options:
    - They brought clothes, books and supplies
    - They rebuilt the house in a week
    - They gave him a scholarship
    - They let him skip exams
    answer: They brought clothes, books and supplies
    difficulty: 2
    hints:
    - People he hardly knew.
    - Things he had lost in the fire.
    solution: Students and teachers brought him clothes, school supplies and other things he needed.
  - prompt: What does the title 'A House Is Not a Home' mean?
    options:
    - A home is made by people who care, not by a building
    - Houses are not safe
    - The family should move
    - Only rich people have homes
    answer: A home is made by people who care, not by a building
    difficulty: 3
    hints:
    - He lost the house but found something else.
    - Think about the community.
    solution: Even without the house, the care of family, friends and community gave him a home.
