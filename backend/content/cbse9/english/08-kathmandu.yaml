# CBSE Class 9 English (NCERT Beehive), unit 8. Written from memory of the NCERT texts: check details against the book.
subject: cbse9-eng
chapter: 8
title: Kathmandu · A Slumber Did My Spirit Seal

tips:
  pashupatinath_baudhnath: "Pashupatinath is the noisy, crowded Hindu temple by the Bagmati river. Baudhnath is the calm Buddhist stupa."
  slumber_death: "In Wordsworth's poem, the woman 'neither hears nor sees' and is 'rolled round in earth's diurnal course': she has died and become part of nature."

concepts:
  - code: cbse9e.u8.kathmandu
    title: Kathmandu (Vikram Seth)
    notes: |
      From 'Heaven Lake'. Vikram Seth visits Kathmandu. Pashupatinath: Hindu temple, only Hindus allowed
      inside, crowded with pilgrims, monkeys, priests and hawkers; a body burns on the ghats of the
      Bagmati; a small shrine half-protruding from a stone platform — legend says when it fully emerges, the
      Kaliyug ends. Baudhnath stupa: Buddhist, calm and quiet, Tibetan immigrants. Kathmandu's streets are
      noisy and busy: film posters, vendors, cars. He buys a bar of marzipan, a corn-on-the-cob, comics and
      a Reader's Digest. He watches a flute seller and reflects on flutes in every culture. He decides to
      return home to Delhi by bus and train rather than fly.
    explanations:
      text: "Vikram Seth describes two sacred places in Kathmandu. Pashupatinath, a Hindu temple by the Bagmati river, is crowded, noisy and full of priests, pilgrims and monkeys. The Buddhist stupa of Baudhnath is calm and peaceful. He wanders the lively streets, buys snacks and comics, and is moved by a flute seller's music, thinking about how flutes are played everywhere in the world."
      visual: "Draw a split picture. Left: Pashupatinath, crowded steps, monkeys, smoke from the ghats, a river. Right: the white dome of Baudhnath with prayer flags and quiet monks walking around it. Below: a man with a pole of bamboo flutes, playing."
      step_by_step: "Step 1: Pashupatinath: crowded, noisy, Hindu, by the Bagmati. Step 2: Baudhnath: calm, Buddhist stupa. Step 3: Kathmandu streets: busy, noisy shops. Step 4: The flute seller and the universal music of the flute. Step 5: He decides to go home by road and rail."
      real_world: "Places of worship in India too can be very different in mood: a busy temple festival compared with a quiet monastery or church. Travel writing helps us notice such differences."
    items:
      - prompt: "Who wrote 'Kathmandu'?"
        options: ["Vikram Seth", "Ruskin Bond", "A.P.J. Abdul Kalam", "Katherine Mansfield"]
        answer: "Vikram Seth"
        difficulty: 1
        hints: ["From his book 'Heaven Lake'.", "An Indian writer."]
        solution: "Vikram Seth."
        mistakes: {"A.P.J. Abdul Kalam": eng9_author}
      - prompt: "Which temple in Kathmandu is crowded and noisy?"
        options: ["Pashupatinath", "Baudhnath", "Swayambhunath", "Kashi Vishwanath"]
        answer: "Pashupatinath"
        difficulty: 1
        hints: ["A Hindu temple.", "By the Bagmati."]
        solution: "Pashupatinath was crowded and noisy."
        mistakes: {"Baudhnath": pashupatinath_baudhnath}
      - prompt: "What is Baudhnath?"
        options: ["A Buddhist stupa", "A Hindu temple", "A market", "A river"]
        answer: "A Buddhist stupa"
        difficulty: 1
        hints: ["Calm and quiet.", "Dome-shaped."]
        solution: "Baudhnath is a Buddhist stupa."
        mistakes: {"A Hindu temple": pashupatinath_baudhnath}
      - prompt: "On the banks of which river does Pashupatinath stand?"
        options: ["Bagmati", "Ganga", "Kosi", "Gandak"]
        answer: "Bagmati"
        difficulty: 2
        hints: ["A holy river of Nepal.", "Bodies are cremated on its ghats."]
        solution: "Pashupatinath stands on the Bagmati."
      - prompt: "Which musical instrument does the author write about at the end?"
        options: ["Flute", "Sitar", "Drum", "Shehnai"]
        answer: "Flute"
        difficulty: 1
        hints: ["A seller carried a pole of them.", "Made of bamboo."]
        solution: "He writes about the flute seller and flutes around the world."
      - prompt: "According to the legend at Pashupatinath, what will happen when the small shrine fully emerges from the stone platform?"
        options: ["The Kaliyug will end", "The river will dry", "Nepal will become rich", "The temple will close"]
        answer: "The Kaliyug will end"
        difficulty: 3
        hints: ["An age in Hindu belief.", "The end of the evil age."]
        solution: "Legend says the Kaliyug (evil age) will end when it emerges."

  - code: cbse9e.u8.slumber
    title: A Slumber Did My Spirit Seal (William Wordsworth)
    after: [cbse9e.u8.kathmandu]
    notes: |
      Two stanzas of four lines. Stanza 1: the poet was in a 'slumber', unaware, and thought his beloved
      could not 'feel the touch of earthly years': she seemed beyond ageing and death. Stanza 2: now she has
      'no motion', 'no force'; she 'neither hears nor sees', 'rolled round in earth's diurnal course, with
      rocks, and stones, and trees'. She has died and become one with nature. One of the 'Lucy' poems.
      Rhyme scheme ABAB.
    explanations:
      text: "In the first stanza, the poet says he was as if asleep: he never imagined that the woman he loved could grow old or die. In the second stanza she has died. She cannot move, hear or see, and is now part of the earth, turning with it every day along with rocks, stones and trees."
      visual: "Draw a young woman under a tree in the first picture. In the second, only the tree, rocks and earth, with the planet turning beneath them. She has become part of that scene."
      step_by_step: "Step 1: 'Slumber': he was unaware of death. Step 2: He believed she was beyond time. Step 3: Now she is still and silent. Step 4: She turns with the earth daily: death has joined her to nature."
      real_world: "When we lose someone close, we sometimes feel we never expected it, as the poet did. Many people find comfort in feeling the person is now part of nature."
    items:
      - prompt: "Who wrote 'A Slumber Did My Spirit Seal'?"
        options: ["William Wordsworth", "W.B. Yeats", "Robert Frost", "Phoebe Cary"]
        answer: "William Wordsworth"
        difficulty: 1
        hints: ["An English Romantic poet.", "Wrote about daffodils."]
        solution: "William Wordsworth."
        mistakes: {"W.B. Yeats": eng9_author}
      - prompt: "How many stanzas does the poem have?"
        answer: "2"
        check: "2"
        difficulty: 1
        hints: ["A very short poem.", "Four lines each."]
        solution: "It has two stanzas of four lines each."
      - prompt: "What has happened to the woman in the second stanza?"
        options: ["She has died and become part of nature", "She has gone on a journey", "She is sleeping", "She has become a tree by magic"]
        answer: "She has died and become part of nature"
        difficulty: 2
        hints: ["She neither hears nor sees.", "Rolled round with rocks and stones."]
        solution: "She has died; she is now part of the earth."
        mistakes: {"She is sleeping": slumber_death}
      - prompt: "What does 'diurnal' mean?"
        options: ["Daily", "Yearly", "Nightly", "Weekly"]
        answer: "Daily"
        difficulty: 2
        hints: ["Earth's daily rotation.", "From the Latin for day."]
        solution: "Diurnal means daily."
      - prompt: "What does the 'slumber' in the first line refer to?"
        options: ["The poet's unawareness that she could die", "A real night's sleep", "A dream about a journey", "Being tired after work"]
        answer: "The poet's unawareness that she could die"
        difficulty: 3
        hints: ["He 'had no human fears'.", "He didn't think about death."]
        solution: "It means he was unaware, as if asleep, of the possibility of her death."
        mistakes: {"A real night's sleep": eng9_poem_meaning}
      - prompt: "What is the rhyme scheme of each stanza?"
        options: ["ABAB", "AABB", "ABBA", "AAAA"]
        answer: "ABAB"
        difficulty: 2
        hints: ["seal, fears, feel, years.", "Alternate lines rhyme."]
        solution: "seal (A), fears (B), feel (A), years (B): ABAB."
