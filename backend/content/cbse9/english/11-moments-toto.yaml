subject: cbse9-eng
chapter: 11
title: 'Moments: The Adventures of Toto'
concepts:
- code: cbse9e.m2.toto
  title: The Adventures of Toto (Ruskin Bond)
  notes: |
    Narrated by a boy whose Grandfather keeps a private zoo. Grandfather buys Toto, a pretty little monkey,
    from a tonga-driver for five rupees. Toto is hidden in a cupboard in the narrator's room, but tears the
    wallpaper and the narrator's school blazer. Grandfather takes him by train to Saharanpur in a big black
    kit-bag; Toto pokes his head out, and the ticket-checker says he must have a ticket, treating him as a dog.
    At home Toto enjoys a warm bath, nearly boils himself in a kettle on the fire, eats Grandmother's pulao,
    and breaks dishes. Grandfather finds him too expensive to keep and sells him back to the tonga-driver for
    three rupees. Theme: a lively, mischievous wild animal is hard to keep as a pet.
  explanations:
    text: 'Grandfather buys a cheeky monkey called Toto, and Toto wrecks everything: wallpaper, a school blazer, dishes and a plate of pulao. He even nearly cooks himself in a kettle. In the end the family can''t afford his mischief, and Grandfather sells him back to the tonga-driver he came from.'
    visual: 'Draw a timeline of Toto''s damage: a torn wallpaper and blazer in the cupboard, a monkey''s head poking out of a kit-bag on a train, a monkey in a kettle on the fire, and an empty plate of pulao. At the end, draw Toto back on the tonga.'
    step_by_step: 'Step 1: Grandfather buys Toto for five rupees. Step 2: Toto is hidden in a cupboard and tears the wallpaper and a blazer. Step 3: The train journey to Saharanpur in a kit-bag. Step 4: Mischief at home: the kettle, the pulao, broken dishes. Step 5: Toto is sold back for three rupees.'
    real_world: People sometimes buy wild animals as pets because they look cute. Like Toto, those animals often damage things and are unhappy indoors, which is one reason keeping wild monkeys as pets is now against the law in India.
  picture:
    kind: flow
    steps:
    - Grandfather buys Toto from a tonga-driver for five rupees
    - Hidden in a cupboard, Toto tears the wallpaper and a school blazer
    - 'Train to Saharanpur in a kit-bag: Toto needs a ticket'
    - Warm bath, then nearly boils himself in a kettle
    - Eats Grandmother's pulao and breaks dishes
    - Sold back to the tonga-driver for three rupees
    alt: 'Toto''s adventures in order: bought for five rupees, damage in the cupboard, a train ride, the kettle, the pulao, and finally sold back for three rupees.'
  items:
  - prompt: Who wrote 'The Adventures of Toto'?
    options:
    - Ruskin Bond
    - Mulk Raj Anand
    - Oscar Wilde
    - Anton Chekhov
    answer: Ruskin Bond
    difficulty: 1
    hints:
    - He writes about the hills and his childhood.
    - He also wrote stories about his Grandfather's pets.
    solution: Ruskin Bond.
    mistakes:
      Oscar Wilde: eng9_author
  - prompt: From whom did Grandfather buy Toto?
    options:
    - A tonga-driver
    - A zookeeper
    - A ticket-checker
    - A farmer
    answer: A tonga-driver
    difficulty: 1
    hints:
    - The man drove a horse cart.
    - He kept the monkey tied to a feeding trough.
    solution: He bought Toto from a tonga-driver.
  - prompt: For how many rupees did Grandfather buy Toto?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - It was a small amount.
    - He later sold him for less.
    solution: Grandfather paid five rupees for Toto.
    mistakes:
      '3': eng9_read_again
  - prompt: How did Grandfather carry Toto on the train to Saharanpur?
    options:
    - In a big black kit-bag
    - In a wooden cage
    - On a leash
    - In a basket of fruit
    answer: In a big black kit-bag
    difficulty: 2
    hints:
    - Toto kept poking his head out.
    - It was made of canvas.
    solution: He put Toto in a big black canvas kit-bag.
  - prompt: What nearly happened to Toto in the kitchen?
    options:
    - He nearly boiled himself in a kettle
    - He fell into a well
    - He was bitten by a dog
    - He ate poison
    answer: He nearly boiled himself in a kettle
    difficulty: 2
    hints:
    - He loved warm water.
    - The kettle was on the fire.
    solution: He climbed into a kettle on the fire and nearly boiled himself before he was pulled out.
  - prompt: Why did Grandfather sell Toto back?
    options:
    - Toto's mischief was too costly for the family
    - Toto fell ill
    - The tonga-driver asked for him back
    - Toto ran away
    answer: Toto's mischief was too costly for the family
    difficulty: 3
    hints:
    - Think about the dishes, clothes and food.
    - They were not a rich family.
    solution: Toto broke and tore so many things that the family could not afford to keep him, so Grandfather sold him back for three rupees.
