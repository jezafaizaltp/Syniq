# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 2: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 2
title: The Pot Maker · Gifts of Grace
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_arenla_wish: "Arenla wanted her daughter to learn a different craft, one done with thread and loom."
  e9_clay_distance: "Look for the line about how far they walked to the riverbank to fetch clay."
  e9_grace_tone: "The poem thanks and honours people's work. Is it angry or mocking?"
  e9_matching_pots: "Two rows of pots that look alike, one made by the mother and one by the daughter. What has been handed on?"
  e9_unit_link_craft: "Both texts in this unit are about people who make things by hand."
  e9_vocation: "A 'vocation' is a calling or a kind of work. Which title word means that?"
  c9e2_who: Go back to the list of characters. Who is the mother, who is the daughter, and who is the kind helper?
  c9e2_why_not: Think about what made pottery so hard for the family, from fetching the clay to shaping it.
  c9e2_symbol: Ask what the object stands for, beyond the thing itself. What has passed from one person to another?
  c9e2_vocation: Think of work as more than earning. How does a skill shape the way people see themselves?

concepts:
  - code: cbse9k.u2.pot
    title: The Pot Maker (Temsula Ao)
    notes: |
      A story by Temsula Ao, the Naga writer, set in a village where pottery is a traditional craft. Young
      Sentila longs to become a potter like her mother Arenla, the best potter in the village, but Arenla wants
      her to weave instead, because pottery is hard work: the clay comes from a riverbank about sixteen
      kilometres away down a dangerous path. The village council reminds the family that master craftspeople
      must pass on their skill, so Arenla teaches Sentila, but for a year the girl's tense hands cannot shape the
      clay. In the girls' dormitory, the kind widow Onula calms her and teaches her the steps, and Sentila makes
      her first balanced pot. One day Arenla leaves the work shed early in pain; Sentila finds her rhythm and
      makes a row of pots almost equal to her mother's. She returns home to find her mother has died. Onula sees
      the two matching rows of pots: the craft has passed to the next generation. Themes: craft as heritage,
      mentorship, patience and confidence.
    explanations:
      text: "Sentila wants to be a potter like her mother, the village's master potter. Her mother resists, but the village insists the craft must be passed on. With patient help from Onula, Sentila learns to relax her hands. On the day her mother dies, Sentila's row of pots matches her mother's: the skill lives on."
      visual: "Picture a shed with two rows of clay pots. One row is Arenla's, perfectly shaped. Beside it, Sentila's row, just as fine. Outside, an old woman (Onula) looks at both rows with tears and pride."
      step_by_step: "Step 1: Sentila dreams of pottery. Step 2: Arenla wants her to weave. Step 3: The council says skills must be passed on. Step 4: Sentila struggles for a year. Step 5: Onula teaches her to relax. Step 6: Sentila matches her mother's pots as her mother dies."
      real_world: "Many traditional crafts in India, like Kerala's Aranmula metal mirrors, survive only because masters choose to teach the next generation."
    activity:
      type: sort
      prompt: 'The Pot Maker: who is it?'
      bins:
      - Sentila
      - Arenla
      - Onula
      items:
      - label: Longs to become a potter
        bin: Sentila
        clue: The young girl in the story.
        why: Sentila, the daughter, is the one who longs to learn pottery.
      - label: The best potter in the village
        bin: Arenla
        clue: The mother.
        why: Arenla is the master potter; Sentila is still learning.
      - label: Wants her daughter to weave instead
        bin: Arenla
        clue: Who knows how hard the clay-fetching is?
        why: Arenla knows the 16 km walk for clay, so she wants her daughter to weave.
      - label: The kind widow in the girls' dormitory
        bin: Onula
        clue: She calms the girl down.
        why: Onula is the widow who teaches Sentila calmly, not her mother.
      - label: Her tense hands cannot shape the clay
        bin: Sentila
        clue: Whose hands are nervous for a year?
        why: 'The learner''s tense hands fail at first: that is Sentila.'
      - label: Sees the two matching rows of pots
        bin: Onula
        clue: She notices the craft has passed on.
        why: Onula sees the two rows after Arenla's death and understands.
    lesson:
      - teach: 'Temsula Ao, a Naga writer, sets ''The Pot Maker'' in a village where pottery is a traditional craft. Young Sentila longs to be a potter like her mother Arenla, the best potter in the village. But Arenla wants her to weave, because pottery is hard: the clay comes from a riverbank about sixteen kilometres away, down a dangerous path.'
        check:
          prompt: Why did Arenla not want Sentila to make pots?
          options:
          - Pottery was very hard work
          - Pots were not needed
          - Sentila was too old
          answer: Pottery was very hard work
          why: Even fetching the clay meant a long, dangerous journey.
      - teach: The village council reminds the family that master craftspeople must pass on their skill, so Arenla teaches Sentila. For a whole year the girl's tense hands cannot shape the clay. In the girls' dormitory, a kind widow, Onula, calms her and teaches her the steps, and Sentila makes her first balanced pot.
        picture:
          kind: flow
          steps:
          - Sentila wants to be a potter
          - 'Council: pass on the skill'
          - A year of failure
          - Onula calms and guides her
          - First balanced pot
          alt: Sentila's journey from wanting to be a potter, through failure and Onula's help, to her first balanced pot.
        check:
          prompt: What finally helped Sentila?
          options:
          - Onula calmed her and taught her the steps
          - A new machine
          - Giving up
          answer: Onula calmed her and taught her the steps
          why: A patient mentor helped her relax.
      - teach: 'One day Arenla leaves the work shed early, in pain. Sentila finds her rhythm and makes a row of pots almost equal to her mother''s. She returns home to find her mother has died. Onula sees the two matching rows of pots: the craft has passed to the next generation. Themes: craft as heritage, mentorship, patience and confidence.'
        check:
          prompt: What do the matching rows of pots show?
          options:
          - The craft has passed from mother to daughter
          - The pots were bought
          - Sentila copied a machine
          answer: The craft has passed from mother to daughter
          why: Sentila's pots now match her mother's.
    items:
      - prompt: "Who wrote 'The Pot Maker'?"
        options: ["Temsula Ao", "Sudha Murty", "Mitra Phukan", "Irene Chua"]
        answer: "Temsula Ao"
        difficulty: 1
        hints: ["A writer from Nagaland.", "She writes about the Naga hills."]
        solution: "Step 1: The story is set in a Naga village. Step 2: It is by Temsula Ao."
        mistakes: {"Mitra Phukan": eng9_author}
      - prompt: "What is the name of the girl who wants to become a potter?"
        options: ["Sentila", "Arenla", "Onula", "Shruti"]
        answer: "Sentila"
        difficulty: 1
        hints: ["Arenla is her mother.", "Onula is her teacher in the dormitory."]
        solution: "Step 1: Arenla is the mother. Step 2: The daughter who dreams of pottery is Sentila."
        mistakes: {"Arenla": eng9_read_again, "Onula": eng9_read_again}
      - prompt: "What did Arenla want her daughter to do instead of pottery?"
        options: ["Weaving", "Farming", "Teaching", "Cooking"]
        answer: "Weaving"
        difficulty: 1
        hints: ["Another traditional craft.", "Less physically hard."]
        solution: "Step 1: Pottery was very hard work. Step 2: Arenla wanted Sentila to weave instead."
        mistakes: {"Farming": "e9_arenla_wish", "Teaching": "e9_arenla_wish"}
      - prompt: "About how far away was the riverbank where the clay came from, in kilometres?"
        answer: "16"
        check: "16"
        difficulty: 2
        hints: ["A long, dangerous walk.", "More than ten."]
        solution: "Step 1: The clay was fetched from a distant riverbank. Step 2: It was about sixteen kilometres away."
        mistakes: {"6": "e9_clay_distance", "60": "e9_clay_distance"}
      - prompt: "Who finally helped Sentila shape her first good pot?"
        options: ["Onula, the widow in charge of the girls' dormitory", "The village council", "Her father", "A potter from another village"]
        answer: "Onula, the widow in charge of the girls' dormitory"
        difficulty: 2
        hints: ["Someone calm and patient.", "At the dormitory."]
        solution: "Step 1: Sentila's tense hands could not shape clay. Step 2: Onula calmed her and taught her the steps."
        mistakes: {"Her father": eng9_read_again}
      - prompt: "What do the two matching rows of pots at the end show?"
        options: ["The craft has passed from mother to daughter", "Sentila copied the pots", "The pots will be thrown away", "Arenla made all of them"]
        answer: "The craft has passed from mother to daughter"
        difficulty: 3
        hints: ["Sentila's row equals her mother's.", "Her mother died that day."]
        solution: "Step 1: Sentila's pots now equal her mother's. Step 2: The skill lives on in the next generation."
        mistakes: {"Sentila copied the pots": "e9_matching_pots"}
      - prompt: Temsula Ao comes from which part of India?
        options:
        - Nagaland, in the North-East
        - Kerala
        - Punjab
        - Gujarat
        answer: Nagaland, in the North-East
        difficulty: 1
        hints:
        - She is a Naga writer.
        - The Nagas live in the North-East.
        solution: Temsula Ao is a Naga writer from Nagaland.
        mistakes:
          Kerala: c9e2_who
      - prompt: Who was the best potter in the village?
        options:
        - Arenla
        - Sentila
        - Onula
        - The council head
        answer: Arenla
        difficulty: 1
        hints:
        - She is Sentila's mother.
        - Sentila wanted to be like her.
        solution: Arenla, Sentila's mother, was the village's best potter.
        mistakes:
          Onula: c9e2_who
      - prompt: Why did the village council get involved?
        options:
        - Master craftspeople must pass on their skill
        - Arenla broke a law
        - Sentila stole clay
        - Pots were banned
        answer: Master craftspeople must pass on their skill
        difficulty: 2
        hints:
        - What would happen if no one learnt the craft?
        - Think of tradition.
        solution: The council wanted the craft to survive, so the master had to teach it.
        mistakes:
          Arenla broke a law: c9e2_why_not
      - prompt: Why could Sentila not shape the clay for a whole year?
        options:
        - Her hands were tense and she lacked confidence
        - There was no clay
        - She did not try
        - Her mother hid the wheel
        answer: Her hands were tense and she lacked confidence
        difficulty: 2
        hints:
        - What did Onula do for her?
        - Clay needs relaxed hands.
        solution: 'Step 1: She was anxious and tense. Step 2: Once Onula calmed her, she succeeded.'
        mistakes:
          She did not try: c9e2_why_not
      - prompt: What is a 'mentor'?
        options:
        - A wise guide who helps someone learn
        - A type of pot
        - A river
        - A rival
        answer: A wise guide who helps someone learn
        difficulty: 1
        hints:
        - Onula was one for Sentila.
        - Think of a patient helper.
        solution: A mentor is an experienced person who guides a learner.
        mistakes:
          A rival: c9e2_who
      - prompt: What is the mood at the end of the story?
        options:
        - Sad, yet hopeful
        - Funny
        - Angry
        - Frightening
        answer: Sad, yet hopeful
        difficulty: 3
        hints:
        - Something sad happens to Arenla.
        - But something lives on.
        solution: 'Step 1: Arenla dies, which is sad. Step 2: The craft lives on in Sentila, which is hopeful.'
        mistakes:
          Funny: c9e2_symbol
      - prompt: 'Choose the correct word: ''Sentila ___ her first balanced pot after Onula helped her.'''
        options:
        - made
        - make
        - making
        - will made
        answer: made
        difficulty: 1
        hints:
        - The action is in the past.
        - Simple past of 'make'.
        solution: The simple past of 'make' is 'made'.
        mistakes:
          will made: c9e1_grammar
      - prompt: What does pottery represent in the story?
        options:
        - A heritage that links generations
        - A way to get rich quickly
        - A punishment
        - A game
        answer: A heritage that links generations
        difficulty: 2
        hints:
        - It passes from mother to daughter.
        - Think of tradition.
        solution: Pottery stands for a living tradition handed down through generations.
        mistakes:
          A way to get rich quickly: c9e2_symbol
      - prompt: Where did Onula help Sentila?
        options:
        - In the girls' dormitory
        - At the riverbank
        - At the market
        - In the council hall
        answer: In the girls' dormitory
        difficulty: 2
        hints:
        - Onula was in charge there.
        - Girls stayed there together.
        solution: Onula, the widow in charge of the girls' dormitory, helped Sentila there.
        mistakes:
          At the riverbank: c9e2_who
  - code: cbse9k.u2.grace
    title: "Gifts of Grace: Honouring Our Vocations"
    after: [cbse9k.u2.pot]
    notes: |
      A celebratory piece paired with The Pot Maker that honours the dignity of skilled manual work: the
      carpenter, the shoemaker, the potter, the weaver and others whose hands make everyday life possible. It
      presents each vocation as a gift and a source of pride and identity, with a joyful tone. A key idea is that
      the voice of a person's vocation is the voice of their identity. It asks readers to respect all kinds of
      work, not only office jobs.
    explanations:
      text: "This piece celebrates people who work with their hands: carpenters, potters, shoemakers, weavers. It says their skill is a gift, and that their work is part of who they are. All honest work deserves respect."
      visual: "Picture a row of workshops: a carpenter planing wood, a potter at the wheel, a shoemaker stitching, a weaver at the loom, each with a small glowing star above."
      step_by_step: "Step 1: Notice the workers named. Step 2: Notice the tone: joyful and respectful. Step 3: Find the idea: work is identity. Step 4: Link to The Pot Maker: a craft passed on with pride."
      real_world: "Vishwakarma Puja, celebrated in many parts of India, honours tools and the craftspeople who use them."
    activity:
      type: sort
      prompt: 'Gifts of Grace: whose hands make what?'
      bins:
      - Carpenter
      - Potter
      - Weaver
      - Shoemaker
      items:
      - label: Chairs, doors and tables
        bin: Carpenter
        clue: Made of wood.
        why: Wooden furniture is a carpenter's work.
      - label: Pots and lamps of clay
        bin: Potter
        clue: Shaped on a wheel.
        why: Clay on a wheel is the potter's craft.
      - label: Cloth and saris
        bin: Weaver
        clue: Threads on a loom.
        why: 'Threads crossed on a loom make cloth: the weaver''s work.'
      - label: Sandals stitched from leather
        bin: Shoemaker
        clue: Worn on the feet.
        why: Leather footwear is made by the shoemaker.
      - label: Mats and baskets from fibre
        bin: Weaver
        clue: Strands crossed over and under.
        why: Crossing strands over and under is weaving, even with grass or cane.
    lesson:
      - teach: '''Gifts of Grace: Honouring Our Vocations'' is paired with The Pot Maker. It celebrates skilled work done with the hands: the carpenter, the shoemaker, the potter, the weaver and others whose work makes everyday life possible. Each vocation is shown as a gift and a source of pride. The tone is joyful and respectful.'
        check:
          prompt: What does the piece celebrate?
          options:
          - Skilled work with the hands
          - Only office work
          - Sports
          answer: Skilled work with the hands
          why: It honours craftspeople.
      - teach: 'A key idea: the voice of a person''s vocation is the voice of their identity. Our work is part of who we are. The piece asks us to respect every kind of honest work, not only office jobs.'
        picture:
          kind: compare
          columns:
          - title: Vocation
            points:
            - Carpenter
            - Potter
            - Weaver
            - Shoemaker
          - title: Gift to us
            points:
            - Furniture, homes
            - Pots and lamps
            - Cloth
            - Footwear
          alt: 'Vocations matched with what they give us: carpenter furniture, potter pots, weaver cloth, shoemaker footwear.'
        check:
          prompt: A 'vocation' is a person's…
          options:
          - Work or calling
          - Holiday
          - Clothing
          answer: Work or calling
          why: From Latin vocare, to call.
    items:
      - prompt: "What does 'Gifts of Grace' mainly celebrate?"
        options: ["The dignity of skilled work with the hands", "Expensive presents", "Winning sports medals", "Travel to new places"]
        answer: "The dignity of skilled work with the hands"
        difficulty: 1
        hints: ["Its subtitle is 'Honouring Our Vocations'.", "Carpenters, potters, shoemakers."]
        solution: "Step 1: The subtitle names vocations. Step 2: It celebrates the dignity of skilled manual work."
        mistakes: {"Expensive presents": eng9_poem_meaning}
      - prompt: "What is the tone of 'Gifts of Grace'?"
        options: ["Joyful and respectful", "Angry", "Sad and hopeless", "Mocking"]
        answer: "Joyful and respectful"
        difficulty: 1
        hints: ["It celebrates.", "It honours workers."]
        solution: "Step 1: It praises workers and their skills. Step 2: Its tone is joyful and respectful."
        mistakes: {"Mocking": "e9_grace_tone"}
      - prompt: "Which word in the title means a person's work or calling?"
        options: ["Vocations", "Grace", "Gifts", "Honouring"]
        answer: "Vocations"
        difficulty: 1
        hints: ["A job someone feels called to.", "Like a profession."]
        solution: "Step 1: A vocation is one's calling or work. Step 2: The word in the title is 'Vocations'."
        mistakes: {"Grace": "e9_vocation"}
      - prompt: "'The voice of their vocation is the voice of their identity.' What does this mean?"
        options: ["A person's work is part of who they are", "Workers should stay silent", "Only famous people have identity", "Work has nothing to do with a person"]
        answer: "A person's work is part of who they are"
        difficulty: 2
        hints: ["Vocation = work; identity = who you are.", "A potter is known by her pots."]
        solution: "Step 1: Vocation means work; identity means self. Step 2: The line says our work expresses who we are."
        mistakes: {"Workers should stay silent": eng9_poem_meaning}
      - prompt: "How does 'Gifts of Grace' connect with 'The Pot Maker'?"
        options: ["Both honour traditional crafts and the people who keep them alive", "Both are about space travel", "Both are about sports", "Neither mentions work"]
        answer: "Both honour traditional crafts and the people who keep them alive"
        difficulty: 2
        hints: ["Sentila becomes a potter.", "The poem praises craftspeople."]
        solution: "Step 1: The Pot Maker shows a craft passed on. Step 2: Gifts of Grace celebrates such crafts. Both honour craftspeople."
        mistakes: {"Neither mentions work": "e9_unit_link_craft"}
      - prompt: "What attitude to work does the piece hope readers will have?"
        options: ["Respect for every kind of honest work", "Only office jobs matter", "Manual work is shameful", "Work should be avoided"]
        answer: "Respect for every kind of honest work"
        difficulty: 3
        hints: ["Think of the dignity of labour.", "Each vocation is a gift."]
        solution: "Step 1: It calls each vocation a gift. Step 2: It wants us to respect all honest work."
        mistakes: {"Manual work is shameful": eng9_poem_meaning}
      - prompt: Which of these is a vocation celebrated in 'Gifts of Grace'?
        options:
        - Weaver
        - Video gamer
        - Tourist
        - Spectator
        answer: Weaver
        difficulty: 1
        hints:
        - Think of hand skills.
        - Someone who makes cloth.
        solution: Weavers, potters, carpenters and shoemakers are among the vocations honoured.
        mistakes:
          Tourist: c9e2_vocation
      - prompt: Why are these vocations called 'gifts'?
        options:
        - They give us things we need and are a source of pride
        - They are free of cost
        - They are wrapped in paper
        - They are given at birthdays
        answer: They give us things we need and are a source of pride
        difficulty: 2
        hints:
        - What do craftspeople give society?
        - And what do they feel?
        solution: Their skills give everyday necessities and give the workers pride and identity.
        mistakes:
          They are free of cost: c9e2_vocation
      - prompt: Which pair of words shows the tone of the piece?
        options:
        - Joyful and respectful
        - Bitter and angry
        - Bored and dull
        - Fearful and sad
        answer: Joyful and respectful
        difficulty: 1
        hints:
        - It is a celebration.
        - It honours people.
        solution: A celebration that honours workers has a joyful, respectful tone.
        mistakes:
          Bitter and angry: c9e2_vocation
      - prompt: What is the main message for readers?
        options:
        - Respect every kind of honest work
        - Only office jobs matter
        - Hand work is shameful
        - Machines should replace all craftspeople
        answer: Respect every kind of honest work
        difficulty: 2
        hints:
        - Does it rank jobs?
        - Think of dignity of labour.
        solution: The piece asks readers to value all honest work equally.
        mistakes:
          Only office jobs matter: c9e2_vocation
      - prompt: 'Fill in: ''A carpenter works mainly with ___.'''
        options:
        - wood
        - clay
        - thread
        - leather
        answer: wood
        difficulty: 1
        hints:
        - Think of tables and doors.
        - Potters use clay.
        solution: Carpenters shape wood into furniture and frames.
        mistakes:
          clay: c9e2_vocation
      - prompt: '''The dignity of labour'' means…'
        options:
        - All work deserves respect
        - Work should be avoided
        - Only rich people work
        - Labour is a punishment
        answer: All work deserves respect
        difficulty: 2
        hints:
        - Dignity means worth and honour.
        - Labour means work.
        solution: The phrase means every kind of work has worth and should be honoured.
        mistakes:
          Labour is a punishment: c9e1_word_meaning
      - prompt: Which character from 'The Pot Maker' best fits the idea that a vocation is part of identity?
        options:
        - Arenla, the master potter
        - A passing traveller
        - A shopkeeper in town
        - Nobody
        answer: Arenla, the master potter
        difficulty: 3
        hints:
        - Who is known in the village for her craft?
        - Her skill defines her.
        solution: 'Step 1: Arenla is known as the best potter. Step 2: Her craft is a big part of who she is.'
        mistakes:
          A shopkeeper in town: c9e2_who
      - prompt: Which suffix turns 'weave' into a word for a person who does it?
        options:
        - -er (weaver)
        - -ing (weaving)
        - -ed (weaved)
        - -ly (weavely)
        answer: -er (weaver)
        difficulty: 2
        hints:
        - Think of teach → teacher.
        - It names the doer.
        solution: 'Adding -er makes the doer: weave → weaver.'
        mistakes:
          -ing (weaving): c9e1_grammar
      - prompt: What do 'Gifts of Grace' and 'The Pot Maker' have in common?
        options:
        - Both honour traditional crafts and those who keep them alive
        - Both are about cricket
        - Both are science reports
        - They are not connected
        answer: Both honour traditional crafts and those who keep them alive
        difficulty: 2
        hints:
        - What is Arenla's work?
        - What does Gifts of Grace celebrate?
        solution: Both pieces celebrate skilled hand crafts and the people who pass them on.
        mistakes:
          They are not connected: c9e2_symbol
