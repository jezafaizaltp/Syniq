subject: cbse9-eng
chapter: 12
title: 'Moments: Iswaran the Storyteller'
concepts:
- code: cbse9e.m3.iswaran
  title: Iswaran the Storyteller (R.K. Laxman)
  notes: |
    Mahendra, a junior supervisor posted to different construction sites, has a cook, Iswaran, who follows
    him everywhere. Iswaran is resourceful and a wonderful storyteller, building suspense with gestures. He
    tells how, as a young man, he faced a wild tusker that had broken loose in his town, and brought it
    down by striking it. Mahendra enjoys the stories. Iswaran says the site was once a burial ground and
    that a female ghost carrying a foetus in her arms appears on full-moon nights. Mahendra scoffs, but one
    full-moon night he sees a cloudy shape and hears moaning. The next morning he decides to leave, having
    been frightened out of the haunted site. Theme: the power of a good story and suggestion.
  explanations:
    text: Mahendra's cook Iswaran tells such gripping stories, with pauses and actions, that his listener believes them. After telling Mahendra that a woman's ghost walks the site on full-moon nights, Iswaran's story works so well that Mahendra thinks he sees the ghost and leaves the place.
    visual: Draw a small shed on a lonely site under a full moon. Inside, Iswaran waves his arms as he tells a story; Mahendra listens, half laughing. Then draw Mahendra at the window at midnight, staring at a misty shape, and next morning packing his bags.
    step_by_step: 'Step 1: Mahendra and his cook Iswaran move from site to site. Step 2: Iswaran tells exciting stories, like the one about the wild elephant. Step 3: He says the site is haunted by a female ghost. Step 4: Mahendra sees something on a full-moon night. Step 5: He decides to leave the site.'
    real_world: A friend who tells a ghost story with a torch under their chin can make a whole room jump at a creaking door. Iswaran is that kind of storyteller.
  picture:
    kind: flow
    steps:
    - Mahendra moves from site to site with his cook Iswaran
    - Iswaran thrills him with stories, like the runaway elephant
    - He claims the site was a burial ground with a ghost
    - On a full-moon night Mahendra sees a shape and hears moaning
    - Frightened, Mahendra decides to leave the site
    alt: 'The story''s steps: Iswaran''s gripping tales, the ghost story about the site, Mahendra''s frightening night, and his decision to leave.'
  items:
  - prompt: Who wrote 'Iswaran the Storyteller'?
    options:
    - R.K. Laxman
    - R.K. Narayan
    - Harsh Mander
    - Ruskin Bond
    answer: R.K. Laxman
    difficulty: 1
    hints:
    - He was also a famous cartoonist.
    - He created the 'Common Man'.
    solution: R.K. Laxman, the cartoonist.
    mistakes:
      R.K. Narayan: eng9_author
  - prompt: What was Mahendra's job?
    options:
    - Junior supervisor at construction sites
    - Railway ticket collector
    - School teacher
    - Doctor
    answer: Junior supervisor at construction sites
    difficulty: 1
    hints:
    - He was moved from site to site.
    - He looked after building work.
    solution: He was a junior supervisor posted to different construction sites.
  - prompt: What was Iswaran's special talent?
    options:
    - Telling stories with suspense
    - Painting
    - Singing
    - Taming animals
    answer: Telling stories with suspense
    difficulty: 1
    hints:
    - Look at the title.
    - He used gestures and pauses.
    solution: He was a wonderful storyteller.
  - prompt: Which animal did Iswaran claim he had faced as a young man?
    options:
    - A wild tusker (elephant)
    - A tiger
    - A snake
    - A bear
    answer: A wild tusker (elephant)
    difficulty: 2
    hints:
    - It had broken loose in his town.
    - It had tusks.
    solution: He claimed to have brought down a wild elephant that ran loose in his town.
    mistakes:
      A tiger: eng9_read_again
  - prompt: What kind of ghost did Iswaran say haunted the site?
    options:
    - A female ghost carrying a foetus
    - A headless soldier
    - A ghost dog
    - An old king
    answer: A female ghost carrying a foetus
    difficulty: 2
    hints:
    - She appeared on full-moon nights.
    - She held something in her arms.
    solution: He said a female ghost with a foetus in her arms appeared on full-moon nights.
  - prompt: What did Mahendra finally decide?
    options:
    - To leave the haunted site
    - To sack Iswaran
    - To write a book
    - To catch the ghost
    answer: To leave the haunted site
    difficulty: 3
    hints:
    - He saw something on a full-moon night.
    - He was frightened.
    solution: After his frightening night he decided to leave the place.
