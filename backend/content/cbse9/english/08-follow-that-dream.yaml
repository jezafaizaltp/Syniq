# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 8: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 8
title: Follow That Dream · Believe in Yourself
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_confidence: "Confidence grows from doing hard things again and again."
  e9_direct_address: "When a poem talks to 'you', it is addressing the reader directly."
  e9_dreams_change: "The writer says it is fine if your dream changes."
  e9_encouraging: "The poem cheers the reader on."
  e9_support: "A long journey is easier with help from others."
  e9_ten_years: "The writer says it takes about a decade of steady practice."
  e9_unit_link_dream: "One text is about hard work, the other about believing in yourself."
  c9e8_letter: Go back to the letter. Who is writing to whom, and what advice does she give?
  c9e8_cost: Think about what a big dream asks of a person, in time, effort and sacrifice.
  c9e8_great: Think about what the writer says great people put into their work, year after year, that others often do not.
  c9e8_change: Ask what the writer says about dreams changing. Is that a failure, or a natural part of life?
  c9e8_belief: Ask what the poem says about doubt and failure. Are they the end, or part of the way?

concepts:
  - code: cbse9k.u8.dream
    title: Follow That Dream (Irene Chua)
    notes: |
      A letter of advice from Irene Chua to her teenage daughter Ming, from the collection My Daughter, My
      Friend. She urges Ming to follow her dream wholeheartedly, but honestly explains what it takes. What
      separates the great from the ordinary is the effort and sacrifice put in; reaching world-class standard in
      any field takes at least ten years of focused work. The journey is tiring, so one needs a support network
      of family and friends, and a passion that comes from within. She warns that circumstances can change a
      life's path: during the Japanese invasion in the Second World War many could not continue at Raffles
      College, and poverty forced others to leave school to support their siblings. She asks Ming to weigh the
      cost in years, money and sacrifice, promises never to discourage her, and notes that dreams can change: her
      own youthful dream changed, and her present dream is to publish her book. Message: dreams need long effort,
      planning and support, and are worth pursuing even when they change.
    explanations:
      text: "A mother writes to her daughter: follow your dream, but know it will take years of hard work, sacrifice and support from others. Life may force changes, and dreams can change too. Still, chasing a dream with passion is worth it."
      visual: "Picture a long staircase labelled '10 years' leading to a star. Along it, family members hold out hands to help a girl climbing. At one turn, a signpost points in a new direction: dreams can change."
      step_by_step: "Step 1: The mother encourages Ming to pursue her dream. Step 2: She explains it takes at least ten years of focused effort. Step 3: Support and inner passion are needed. Step 4: Circumstances like war or poverty can change plans. Step 5: Count the cost; dreams may evolve; keep going."
      real_world: "Most top musicians, athletes and scientists say they practised for many years before anyone noticed them; 'overnight success' usually takes a decade."
    activity:
      type: number_line
      min: 0
      max: 20
      step: 1
      start: 0
      prompt: 'Follow That Dream: how many years of focused work for world-class standard, says Irene Chua?'
      goals:
      - prompt: Mark the least number of years she mentions.
        target: 10
        mistakes:
        - when:
            v: 1
          say: One year is far too short. She says greatness takes at least ten years of focused work.
        - when:
            v: 5
          say: 'Half-way. She says at least ten years: effort and sacrifice over a long time.'
        - when:
            v: 20
          say: That's more than she says. Her number is at least ten years.
    lesson:
      - teach: '''Follow That Dream'' is a letter of advice from Irene Chua to her teenage daughter Ming, from the collection My Daughter, My Friend. She urges Ming to follow her dream wholeheartedly, but explains honestly what it takes: what separates the great from the ordinary is effort and sacrifice, and reaching world-class standard in any field takes at least ten years of focused work.'
        check:
          prompt: How long does world-class standard take, says the writer?
          options:
          - At least ten years
          - A few weeks
          - One year
          answer: At least ten years
          why: Excellence needs long, focused effort.
      - teach: 'The journey is tiring, so one needs a support network of family and friends, and a passion from within. Circumstances can change a life''s path: during the Japanese invasion in the Second World War many could not continue at Raffles College, and poverty forced others to leave school to support their siblings.'
        picture:
          kind: flow
          steps:
          - Choose a dream
          - Ten years of focused work
          - Support network
          - Passion from within
          - Dreams may change
          alt: 'What following a dream needs: long work, support, inner passion, and openness to change.'
        check:
          prompt: Why does a dreamer need a support network?
          options:
          - The journey is long and tiring
          - To do the work for them
          - To make them famous
          answer: The journey is long and tiring
          why: No one succeeds alone.
      - teach: 'She asks Ming to weigh the cost in years, money and sacrifice, and promises never to discourage her. She notes that dreams can change: her own youthful dream changed, and now her dream is to publish her book. Message: dreams need long effort, planning and support, and are worth pursuing even when they change.'
        check:
          prompt: What is the writer's present dream?
          options:
          - To publish her book
          - To win a race
          - To travel to space
          answer: To publish her book
          why: Her dream changed over the years.
    items:
      - prompt: "Who is the letter in 'Follow That Dream' written to?"
        options: ["Ming, the writer's daughter", "Shruti, a violinist", "Ravi, a grandson", "Sentila, a potter"]
        answer: "Ming, the writer's daughter"
        difficulty: 1
        hints: ["From the collection 'My Daughter, My Friend'.", "A teenage girl."]
        solution: "Step 1: Irene Chua writes as a mother. Step 2: The letter is to her daughter Ming."
        mistakes: {"Shruti, a violinist": eng9_read_again}
      - prompt: "According to the writer, at least how many years of focused work does it take to reach world-class standard?"
        answer: "10"
        check: "10"
        difficulty: 1
        hints: ["A decade.", "More than five."]
        solution: "Step 1: She says excellence needs long, focused effort. Step 2: At least ten years."
        mistakes: {"1": "e9_ten_years", "100": "e9_ten_years"}
      - prompt: "Who wrote 'Follow That Dream'?"
        options: ["Irene Chua", "Sudha Murty", "Asha Nehemiah", "Mitra Phukan"]
        answer: "Irene Chua"
        difficulty: 1
        hints: ["Ming's mother.", "From 'My Daughter, My Friend'."]
        solution: "Step 1: The letter is from Ming's mother. Step 2: She is Irene Chua."
        mistakes: {"Sudha Murty": eng9_author}
      - prompt: "Why does the writer say a person chasing a dream needs a support network?"
        options: ["The journey is long and tiring, and no one succeeds alone", "Friends will do the work for you", "Support makes success instant", "Dreams are always easy"]
        answer: "The journey is long and tiring, and no one succeeds alone"
        difficulty: 2
        hints: ["Stamina runs out.", "Award winners thank many people."]
        solution: "Step 1: Pursuing a dream is exhausting. Step 2: Family and friends help you keep going; nobody succeeds alone."
        mistakes: {"Friends will do the work for you": "e9_support"}
      - prompt: "Which example does the writer give of circumstances that changed people's dreams?"
        options: ["The Japanese invasion in the Second World War", "A cricket match", "A school holiday", "A new mobile phone"]
        answer: "The Japanese invasion in the Second World War"
        difficulty: 2
        hints: ["A war.", "Students could not continue at Raffles College."]
        solution: "Step 1: She mentions war and poverty. Step 2: The Japanese invasion in WWII stopped many people's studies."
        mistakes: {"A school holiday": eng9_read_again}
      - prompt: "What is the writer's attitude to dreams changing over time?"
        options: ["It is natural; dreams can evolve and are still worth pursuing", "A changed dream means failure", "You must never change your dream", "Dreams are a waste of time"]
        answer: "It is natural; dreams can evolve and are still worth pursuing"
        difficulty: 3
        hints: ["Her own dream changed.", "She now wants to publish a book."]
        solution: "Step 1: Her youthful dream changed. Step 2: She sees this as natural and still encourages Ming to dream."
        mistakes: {"A changed dream means failure": "e9_dreams_change"}
      - prompt: What kind of text is 'Follow That Dream'?
        options:
        - A letter
        - A play
        - A news report
        - A poem
        answer: A letter
        difficulty: 1
        hints:
        - A mother writes to her daughter.
        - It begins with a greeting.
        solution: It is a letter of advice from a mother to her daughter.
        mistakes:
          A play: c9e8_letter
      - prompt: From which collection does the letter come?
        options:
        - My Daughter, My Friend
        - Kashi Yatre
        - Gifts of Grace
        - Twin Melodies
        answer: My Daughter, My Friend
        difficulty: 2
        hints:
        - It is a book of letters.
        - The title names the relationship.
        solution: The letter is from Irene Chua's collection My Daughter, My Friend.
        mistakes:
          Kashi Yatre: c9e8_letter
      - prompt: Which college does the writer mention in her wartime example?
        options:
        - Raffles College
        - Oxford College
        - Presidency College
        - St. Xavier's College
        answer: Raffles College
        difficulty: 3
        hints:
        - It is in Singapore.
        - Studies were stopped by an invasion.
        solution: Many could not continue at Raffles College during the Japanese invasion.
        mistakes:
          Oxford College: c9e8_change
      - prompt: Which word best describes the writer's advice?
        options:
        - Honest and encouraging
        - Harsh and discouraging
        - Careless
        - Boastful
        answer: Honest and encouraging
        difficulty: 2
        hints:
        - She tells the hard truth.
        - But she promises support.
        solution: She is honest about the cost yet encourages Ming to pursue her dream.
        mistakes:
          Harsh and discouraging: c9e8_letter
      - prompt: Why did some young people in the writer's time leave school?
        options:
        - Poverty forced them to support their siblings
        - They disliked books
        - School was too easy
        - They became famous
        answer: Poverty forced them to support their siblings
        difficulty: 2
        hints:
        - Think of family duties.
        - Money was short.
        solution: Poverty made some leave school to earn for younger brothers and sisters.
        mistakes:
          They disliked books: c9e8_change
      - prompt: What 'cost' should Ming weigh before choosing a dream?
        options:
        - Years, money and sacrifice
        - Only the price of a ticket
        - Nothing at all
        - Her friends' opinions only
        answer: Years, money and sacrifice
        difficulty: 2
        hints:
        - Long effort is one cost.
        - Money and giving things up are others.
        solution: The writer asks her to think of time, money and what she must give up.
        mistakes:
          Nothing at all: c9e8_cost
      - prompt: 'Choose the correct modal: ''If you follow your dream, you ___ need patience.'''
        options:
        - will
        - would have
        - did
        - was
        answer: will
        difficulty: 2
        hints:
        - 'A first conditional: if + present tense, then a future form.'
        - Future result.
        solution: 'First conditional: ''If you follow..., you will need...''.'
        mistakes:
          did: c9e1_grammar
      - prompt: What separates the great from the ordinary, according to the writer?
        options:
        - Effort and sacrifice
        - Luck alone
        - Being born rich
        - Talking a lot
        answer: Effort and sacrifice
        difficulty: 1
        hints:
        - Not luck.
        - Think of ten years of work.
        solution: The writer says effort and sacrifice make the difference.
        mistakes:
          Luck alone: c9e8_great
      - prompt: What does 'wholeheartedly' mean?
        options:
        - With full commitment
        - Half-heartedly
        - Sadly
        - Quickly
        answer: With full commitment
        difficulty: 1
        hints:
        - Your whole heart.
        - Nothing held back.
        solution: To do something wholeheartedly is to do it with complete dedication.
        mistakes:
          Half-heartedly: c9e1_word_meaning
  - code: cbse9k.u8.believe
    title: Believe in Yourself
    after: [cbse9k.u8.dream]
    notes: |
      An encouraging poem paired with Follow That Dream. It tells the reader to trust their own abilities, to keep
      going when others doubt them or when they fail, and to see mistakes as steps on the way rather than the end.
      Confidence is presented as something built through effort and persistence, not luck. Read it for its
      motivational tone, its direct address to the reader ('you'), and its link to the idea that dreams need
      self-belief as well as hard work.
    explanations:
      text: "The poem speaks straight to you: trust yourself, keep trying when you fall, and don't let other people's doubts stop you. Self-belief, built through effort, carries you towards your dreams."
      visual: "Picture a young person climbing a hill; behind them are a few small stumbles marked with stars (lessons), and ahead a flag with the words 'I can'."
      step_by_step: "Step 1: Notice who is spoken to: 'you'. Step 2: Find the advice: trust yourself, persist. Step 3: See how failure is treated: as a step, not an end. Step 4: Link to Follow That Dream."
      real_world: "Many students who fail a test once and keep practising do much better next time; believing they can improve is part of why they do."
    activity:
      type: sort
      prompt: 'Believe in Yourself: what does the poem say about each?'
      bins:
      - Keep going
      - Mistakes are steps
      - Confidence is built
      items:
      - label: When others doubt you
        bin: Keep going
        clue: Don't stop because of them.
        why: Others' doubt is a reason to keep going, not to stop.
      - label: When you fail
        bin: Mistakes are steps
        clue: Is failing the end?
        why: A failure is a step on the way, not the end.
      - label: Through effort and persistence
        bin: Confidence is built
        clue: Not luck.
        why: 'Confidence grows from effort: it is built, not given.'
      - label: Wrong turns on the road
        bin: Mistakes are steps
        clue: They still move you forward.
        why: 'Wrong turns teach you: they are steps.'
      - label: Trusting your own abilities
        bin: Confidence is built
        clue: Self-belief.
        why: Trusting yourself is the confidence the poem asks for.
    lesson:
      - teach: '''Believe in Yourself'' is an encouraging poem paired with Follow That Dream. It tells the reader to trust their own abilities, to keep going when others doubt them or when they fail, and to see mistakes as steps on the way, not the end.'
        check:
          prompt: How does the poem see failure?
          options:
          - As a step towards success
          - As the end
          - As shameful
          answer: As a step towards success
          why: Mistakes are part of the journey.
      - teach: 'Confidence is presented as something built through effort and persistence, not luck. The poem speaks directly to ''you'', the reader: this is direct address. Its tone is motivating. It links to Follow That Dream: dreams need self-belief as well as hard work.'
        picture:
          kind: compare
          columns:
          - title: Follow That Dream
            points:
            - Long effort
            - Planning
            - Support
          - title: Believe in Yourself
            points:
            - Self-belief
            - Persistence
            - Learning from failure
          alt: Follow That Dream stresses effort, planning and support; Believe in Yourself stresses self-belief, persistence and learning from failure.
        check:
          prompt: A poem that speaks to 'you' uses…
          options:
          - Direct address
          - A refrain
          - A simile
          answer: Direct address
          why: It talks straight to the reader.
    items:
      - prompt: "What is the main message of 'Believe in Yourself'?"
        options: ["Trust your abilities and keep going despite setbacks", "Always follow the crowd", "Give up after one failure", "Luck is all that matters"]
        answer: "Trust your abilities and keep going despite setbacks"
        difficulty: 1
        hints: ["Read the title.", "Self-belief."]
        solution: "Step 1: The title is the message. Step 2: Trust yourself and persist."
        mistakes: {"Give up after one failure": eng9_poem_meaning}
      - prompt: "What is the tone of the poem?"
        options: ["Encouraging and motivating", "Gloomy", "Angry", "Sarcastic"]
        answer: "Encouraging and motivating"
        difficulty: 1
        hints: ["It cheers the reader on.", "Like a coach."]
        solution: "Step 1: It urges the reader to keep trying. Step 2: The tone is encouraging."
        mistakes: {"Gloomy": "e9_encouraging"}
      - prompt: "When a poem speaks directly to 'you', the reader, it is using…"
        options: ["Direct address", "Simile", "Onomatopoeia", "A refrain"]
        answer: "Direct address"
        difficulty: 2
        hints: ["Talking straight to someone.", "'You can do it.'"]
        solution: "Step 1: The poem speaks to 'you'. Step 2: That is direct address."
        mistakes: {"Simile": "e9_direct_address"}
      - prompt: "How does the poem treat failure?"
        options: ["As a step towards success, not the end", "As proof you have no talent", "As something to hide", "As the end of the dream"]
        answer: "As a step towards success, not the end"
        difficulty: 2
        hints: ["Mistakes teach us.", "Keep going."]
        solution: "Step 1: The poem asks us not to stop after failing. Step 2: It sees failure as a step on the way."
        mistakes: {"As the end of the dream": eng9_poem_meaning}
      - prompt: "How does this poem link with 'Follow That Dream'?"
        options: ["Dreams need both hard work and self-belief", "Both say dreams are useless", "Both are about deserts", "Both are about cooking"]
        answer: "Dreams need both hard work and self-belief"
        difficulty: 2
        hints: ["The letter stresses effort.", "The poem stresses confidence."]
        solution: "Step 1: Follow That Dream shows the effort a dream needs. Step 2: This poem adds self-belief. Together they show both are needed."
        mistakes: {"Both say dreams are useless": "e9_unit_link_dream"}
      - prompt: "According to the poem's idea, where does real confidence come from?"
        options: ["Effort and persistence over time", "Luck alone", "Other people's praise only", "Never trying anything hard"]
        answer: "Effort and persistence over time"
        difficulty: 3
        hints: ["Not luck.", "Built step by step."]
        solution: "Step 1: Confidence grows each time we keep trying. Step 2: So it comes from effort and persistence."
        mistakes: {"Luck alone": "e9_confidence"}
      - prompt: Which line uses direct address?
        options:
        - You can climb any hill you choose
        - The hill was steep
        - She climbed the hill
        - Hills are made of rock
        answer: You can climb any hill you choose
        difficulty: 2
        hints:
        - Look for 'you'.
        - It speaks to the reader.
        solution: Speaking to 'you' directly is direct address.
        mistakes:
          She climbed the hill: c9e8_belief
      - prompt: Someone says, 'You'll never manage it.' What would the poem advise?
        options:
        - Keep going and trust yourself
        - Give up at once
        - Agree with them
        - Stop trying new things
        answer: Keep going and trust yourself
        difficulty: 1
        hints:
        - What does the title say?
        - Others' doubts are not the end.
        solution: The poem urges you to keep going despite others' doubts.
        mistakes:
          Give up at once: c9e8_belief
      - prompt: What does 'persistence' mean?
        options:
        - Continuing firmly despite difficulty
        - Giving up quickly
        - Being lucky
        - Shouting
        answer: Continuing firmly despite difficulty
        difficulty: 1
        hints:
        - The poem says confidence is built this way.
        - Keep at it.
        solution: Persistence means carrying on steadily even when things are hard.
        mistakes:
          Being lucky: c9e1_word_meaning
      - prompt: According to the poem, how is confidence built?
        options:
        - Through effort over time
        - By luck
        - By buying it
        - Overnight
        answer: Through effort over time
        difficulty: 2
        hints:
        - Not luck.
        - Step by step.
        solution: Confidence grows through effort and persistence.
        mistakes:
          By luck: c9e8_belief
      - prompt: Which character from this book best shows the poem's message?
        options:
        - Deepa Malik, who turned to sport after paralysis
        - Vidya, who forgot a birthday
        - A runner who never started
        - Nobody
        answer: Deepa Malik, who turned to sport after paralysis
        difficulty: 3
        hints:
        - Who kept going after a huge setback?
        - Think of Unit 5.
        solution: 'Step 1: Deepa Malik faced paralysis. Step 2: She believed in herself and became a champion.'
        mistakes:
          Nobody: c9e8_belief
      - prompt: 'Choose the correct imperative: ''___ in yourself, even when it is hard.'''
        options:
        - Believe
        - Believing
        - Believed
        - Believes
        answer: Believe
        difficulty: 1
        hints:
        - An instruction or advice.
        - Base form of the verb.
        solution: 'Imperatives use the base form: ''Believe in yourself.'''
        mistakes:
          Believes: c9e1_grammar
      - prompt: Which is the best way to treat a mistake, according to the poem?
        options:
        - Learn from it and try again
        - Hide it
        - Blame others
        - Never try again
        answer: Learn from it and try again
        difficulty: 1
        hints:
        - Mistakes are steps.
        - Steps go forward.
        solution: The poem treats mistakes as lessons on the way to success.
        mistakes:
          Never try again: c9e8_belief
      - prompt: What does 'self-belief' mean?
        options:
        - Trust in your own abilities
        - Believing everything you hear
        - Selfishness
        - Fear of failure
        answer: Trust in your own abilities
        difficulty: 1
        hints:
        - Self + belief.
        - Believing in yourself.
        solution: Self-belief is confidence in what you can do.
        mistakes:
          Selfishness: c9e1_word_meaning
      - prompt: Why are 'Follow That Dream' and 'Believe in Yourself' placed together?
        options:
        - Dreams need both hard work and self-belief
        - Both are about cooking
        - Both are plays
        - They were written by the same person
        answer: Dreams need both hard work and self-belief
        difficulty: 2
        hints:
        - One stresses effort.
        - The other stresses confidence.
        solution: Together they show that reaching a dream needs effort and belief in oneself.
        mistakes:
          They were written by the same person: c9e8_letter
