# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 8: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 8
title: Follow That Dream · Believe in Yourself
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_confidence: "Confidence grows from doing hard things again and again."
  e9_direct_address: "When a poem talks to 'you', it is addressing the reader directly."
  e9_dreams_change: "The writer says it is fine if your dream changes."
  e9_encouraging: "The poem cheers the reader on."
  e9_support: "A long journey is easier with help from others."
  e9_ten_years: "The writer says it takes about a decade of steady practice."
  e9_unit_link_dream: "One text is about hard work, the other about believing in yourself."

concepts:
  - code: cbse9k.u8.dream
    title: Follow That Dream (Irene Chua)
    notes: |
      A letter of advice from Irene Chua to her teenage daughter Ming, from the collection My Daughter, My
      Friend. She urges Ming to follow her dream wholeheartedly, but honestly explains what it takes. What
      separates the great from the ordinary is the effort and sacrifice put in; reaching world-class standard in
      any field takes at least ten years of focused work. The journey is tiring, so one needs a support network
      of family and friends, and a passion that comes from within. She warns that circumstances can change a
      life's path: during the Japanese invasion in the Second World War many could not continue at Raffles
      College, and poverty forced others to leave school to support their siblings. She asks Ming to weigh the
      cost in years, money and sacrifice, promises never to discourage her, and notes that dreams can change: her
      own youthful dream changed, and her present dream is to publish her book. Message: dreams need long effort,
      planning and support, and are worth pursuing even when they change.
    explanations:
      text: "A mother writes to her daughter: follow your dream, but know it will take years of hard work, sacrifice and support from others. Life may force changes, and dreams can change too. Still, chasing a dream with passion is worth it."
      visual: "Picture a long staircase labelled '10 years' leading to a star. Along it, family members hold out hands to help a girl climbing. At one turn, a signpost points in a new direction: dreams can change."
      step_by_step: "Step 1: The mother encourages Ming to pursue her dream. Step 2: She explains it takes at least ten years of focused effort. Step 3: Support and inner passion are needed. Step 4: Circumstances like war or poverty can change plans. Step 5: Count the cost; dreams may evolve; keep going."
      real_world: "Most top musicians, athletes and scientists say they practised for many years before anyone noticed them; 'overnight success' usually takes a decade."
    activity:
      type: number_line
      min: 0
      max: 20
      step: 1
      start: 0
      prompt: 'Follow That Dream: how many years of focused work for world-class standard, says Irene Chua?'
      goals:
      - prompt: Mark the least number of years she mentions.
        target: 10
        mistakes:
        - when:
            v: 1
          say: One year is far too short. She says greatness takes at least ten years of focused work.
        - when:
            v: 5
          say: 'Half-way. She says at least ten years: effort and sacrifice over a long time.'
        - when:
            v: 20
          say: That's more than she says. Her number is at least ten years.
    items:
      - prompt: "Who is the letter in 'Follow That Dream' written to?"
        options: ["Ming, the writer's daughter", "Shruti, a violinist", "Ravi, a grandson", "Sentila, a potter"]
        answer: "Ming, the writer's daughter"
        difficulty: 1
        hints: ["From the collection 'My Daughter, My Friend'.", "A teenage girl."]
        solution: "Step 1: Irene Chua writes as a mother. Step 2: The letter is to her daughter Ming."
        mistakes: {"Shruti, a violinist": eng9_read_again}
      - prompt: "According to the writer, at least how many years of focused work does it take to reach world-class standard?"
        answer: "10"
        check: "10"
        difficulty: 1
        hints: ["A decade.", "More than five."]
        solution: "Step 1: She says excellence needs long, focused effort. Step 2: At least ten years."
        mistakes: {"1": "e9_ten_years", "100": "e9_ten_years"}
      - prompt: "Who wrote 'Follow That Dream'?"
        options: ["Irene Chua", "Sudha Murty", "Asha Nehemiah", "Mitra Phukan"]
        answer: "Irene Chua"
        difficulty: 1
        hints: ["Ming's mother.", "From 'My Daughter, My Friend'."]
        solution: "Step 1: The letter is from Ming's mother. Step 2: She is Irene Chua."
        mistakes: {"Sudha Murty": eng9_author}
      - prompt: "Why does the writer say a person chasing a dream needs a support network?"
        options: ["The journey is long and tiring, and no one succeeds alone", "Friends will do the work for you", "Support makes success instant", "Dreams are always easy"]
        answer: "The journey is long and tiring, and no one succeeds alone"
        difficulty: 2
        hints: ["Stamina runs out.", "Award winners thank many people."]
        solution: "Step 1: Pursuing a dream is exhausting. Step 2: Family and friends help you keep going; nobody succeeds alone."
        mistakes: {"Friends will do the work for you": "e9_support"}
      - prompt: "Which example does the writer give of circumstances that changed people's dreams?"
        options: ["The Japanese invasion in the Second World War", "A cricket match", "A school holiday", "A new mobile phone"]
        answer: "The Japanese invasion in the Second World War"
        difficulty: 2
        hints: ["A war.", "Students could not continue at Raffles College."]
        solution: "Step 1: She mentions war and poverty. Step 2: The Japanese invasion in WWII stopped many people's studies."
        mistakes: {"A school holiday": eng9_read_again}
      - prompt: "What is the writer's attitude to dreams changing over time?"
        options: ["It is natural; dreams can evolve and are still worth pursuing", "A changed dream means failure", "You must never change your dream", "Dreams are a waste of time"]
        answer: "It is natural; dreams can evolve and are still worth pursuing"
        difficulty: 3
        hints: ["Her own dream changed.", "She now wants to publish a book."]
        solution: "Step 1: Her youthful dream changed. Step 2: She sees this as natural and still encourages Ming to dream."
        mistakes: {"A changed dream means failure": "e9_dreams_change"}
  - code: cbse9k.u8.believe
    title: Believe in Yourself
    after: [cbse9k.u8.dream]
    notes: |
      An encouraging poem paired with Follow That Dream. It tells the reader to trust their own abilities, to keep
      going when others doubt them or when they fail, and to see mistakes as steps on the way rather than the end.
      Confidence is presented as something built through effort and persistence, not luck. Read it for its
      motivational tone, its direct address to the reader ('you'), and its link to the idea that dreams need
      self-belief as well as hard work.
    explanations:
      text: "The poem speaks straight to you: trust yourself, keep trying when you fall, and don't let other people's doubts stop you. Self-belief, built through effort, carries you towards your dreams."
      visual: "Picture a young person climbing a hill; behind them are a few small stumbles marked with stars (lessons), and ahead a flag with the words 'I can'."
      step_by_step: "Step 1: Notice who is spoken to: 'you'. Step 2: Find the advice: trust yourself, persist. Step 3: See how failure is treated: as a step, not an end. Step 4: Link to Follow That Dream."
      real_world: "Many students who fail a test once and keep practising do much better next time; believing they can improve is part of why they do."
    activity:
      type: sort
      prompt: 'Believe in Yourself: what does the poem say about each?'
      bins:
      - Keep going
      - Mistakes are steps
      - Confidence is built
      items:
      - label: When others doubt you
        bin: Keep going
        clue: Don't stop because of them.
        why: Others' doubt is a reason to keep going, not to stop.
      - label: When you fail
        bin: Mistakes are steps
        clue: Is failing the end?
        why: A failure is a step on the way, not the end.
      - label: Through effort and persistence
        bin: Confidence is built
        clue: Not luck.
        why: 'Confidence grows from effort: it is built, not given.'
      - label: Wrong turns on the road
        bin: Mistakes are steps
        clue: They still move you forward.
        why: 'Wrong turns teach you: they are steps.'
      - label: Trusting your own abilities
        bin: Confidence is built
        clue: Self-belief.
        why: Trusting yourself is the confidence the poem asks for.
    items:
      - prompt: "What is the main message of 'Believe in Yourself'?"
        options: ["Trust your abilities and keep going despite setbacks", "Always follow the crowd", "Give up after one failure", "Luck is all that matters"]
        answer: "Trust your abilities and keep going despite setbacks"
        difficulty: 1
        hints: ["Read the title.", "Self-belief."]
        solution: "Step 1: The title is the message. Step 2: Trust yourself and persist."
        mistakes: {"Give up after one failure": eng9_poem_meaning}
      - prompt: "What is the tone of the poem?"
        options: ["Encouraging and motivating", "Gloomy", "Angry", "Sarcastic"]
        answer: "Encouraging and motivating"
        difficulty: 1
        hints: ["It cheers the reader on.", "Like a coach."]
        solution: "Step 1: It urges the reader to keep trying. Step 2: The tone is encouraging."
        mistakes: {"Gloomy": "e9_encouraging"}
      - prompt: "When a poem speaks directly to 'you', the reader, it is using…"
        options: ["Direct address", "Simile", "Onomatopoeia", "A refrain"]
        answer: "Direct address"
        difficulty: 2
        hints: ["Talking straight to someone.", "'You can do it.'"]
        solution: "Step 1: The poem speaks to 'you'. Step 2: That is direct address."
        mistakes: {"Simile": "e9_direct_address"}
      - prompt: "How does the poem treat failure?"
        options: ["As a step towards success, not the end", "As proof you have no talent", "As something to hide", "As the end of the dream"]
        answer: "As a step towards success, not the end"
        difficulty: 2
        hints: ["Mistakes teach us.", "Keep going."]
        solution: "Step 1: The poem asks us not to stop after failing. Step 2: It sees failure as a step on the way."
        mistakes: {"As the end of the dream": eng9_poem_meaning}
      - prompt: "How does this poem link with 'Follow That Dream'?"
        options: ["Dreams need both hard work and self-belief", "Both say dreams are useless", "Both are about deserts", "Both are about cooking"]
        answer: "Dreams need both hard work and self-belief"
        difficulty: 2
        hints: ["The letter stresses effort.", "The poem stresses confidence."]
        solution: "Step 1: Follow That Dream shows the effort a dream needs. Step 2: This poem adds self-belief. Together they show both are needed."
        mistakes: {"Both say dreams are useless": "e9_unit_link_dream"}
      - prompt: "According to the poem's idea, where does real confidence come from?"
        options: ["Effort and persistence over time", "Luck alone", "Other people's praise only", "Never trying anything hard"]
        answer: "Effort and persistence over time"
        difficulty: 3
        hints: ["Not luck.", "Built step by step."]
        solution: "Step 1: Confidence grows each time we keep trying. Step 2: So it comes from effort and persistence."
        mistakes: {"Luck alone": "e9_confidence"}
