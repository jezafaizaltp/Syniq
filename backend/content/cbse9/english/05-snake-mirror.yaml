# CBSE Class 9 English (NCERT Beehive), unit 5. Written from memory of the NCERT texts: check details against the book.
subject: cbse9-eng
chapter: 5
title: The Snake and the Mirror · A Legend of the Northland

tips:
  basheer_malayalam: "Vaikom Muhammad Basheer wrote in Malayalam; 'The Snake and the Mirror' is translated from his story."
  woodpecker_greed: "The old lady was turned into a woodpecker because she was too greedy to give even a small cake to a hungry saint."

concepts:
  - code: cbse9e.u5.snake
    title: The Snake and the Mirror (Vaikom Muhammad Basheer)
    notes: |
      A humorous story told by a poor homeopath doctor about his rented room with no ceiling. One hot night
      he looks in his mirror, decides to shave daily, grow a moustache and marry a fat lady doctor with money.
      A snake drops onto his shoulder and coils around his arm; he sits frozen 'like a stone image', praying.
      The snake turns to look at itself in the mirror, and the doctor escapes. Next day the snake has left;
      The snake is gone the next morning, as are the doctor's grand plans.
      Translated from Malayalam.
    explanations:
      text: "A young homeopath doctor, admiring himself in the mirror, decides to look smart and marry a rich lady doctor. Suddenly a snake falls onto his shoulder and wraps around his arm. Terrified, he sits like a statue. Then the snake turns to look at itself in the mirror, and the doctor slowly slips away. The funny twist: even the snake seemed vain about its looks."
      visual: "Picture a small room with a lamp and a mirror on the table. A young man sits frozen, a snake around his arm, its head turned towards the mirror. Above them, a roof with no ceiling where rats run about."
      step_by_step: "Step 1: The doctor's poor room and his hopes. Step 2: He looks in the mirror and makes big plans. Step 3: The snake falls on him; he freezes and prays. Step 4: The snake looks into the mirror. Step 5: He escapes; the snake is gone the next day."
      real_world: "Basheer laughs at how people dream of looking good and getting rich. The story reminds us that pride can vanish in a moment of fear."
    items:
      - prompt: "Who wrote 'The Snake and the Mirror'?"
        options: ["Vaikom Muhammad Basheer", "A.P.J. Abdul Kalam", "Katherine Mansfield", "Gieve Patel"]
        answer: "Vaikom Muhammad Basheer"
        difficulty: 1
        hints: ["A famous Malayalam writer.", "From Vaikom, Kerala."]
        solution: "Vaikom Muhammad Basheer."
        mistakes: {"A.P.J. Abdul Kalam": eng9_author}
      - prompt: "From which language was the story translated?"
        options: ["Malayalam", "Tamil", "Hindi", "Bengali"]
        answer: "Malayalam"
        difficulty: 1
        hints: ["Basheer's language.", "Spoken in Kerala."]
        solution: "It was translated from Malayalam."
        mistakes: {"Tamil": basheer_malayalam}
      - prompt: "What was the narrator's profession?"
        options: ["Homeopath doctor", "Teacher", "Snake charmer", "Shopkeeper"]
        answer: "Homeopath doctor"
        difficulty: 1
        hints: ["He mentions his small practice.", "Medicine."]
        solution: "He was a homeopath doctor."
      - prompt: "Where did the snake coil itself?"
        options: ["Around the doctor's left arm", "Around the mirror", "Around the lamp", "Around the bed"]
        answer: "Around the doctor's left arm"
        difficulty: 2
        hints: ["It fell on his shoulder first.", "An arm."]
        solution: "It coiled around his left arm above the elbow."
      - prompt: "How did the doctor escape the snake?"
        options: ["The snake turned to look into the mirror", "He shouted for help", "He killed the snake", "A neighbour pulled it away"]
        answer: "The snake turned to look into the mirror"
        difficulty: 2
        hints: ["The title is a clue.", "Even the snake was curious about its looks."]
        solution: "The snake moved to look at itself in the mirror, and he slipped away."
      - prompt: "What did the doctor decide while looking in the mirror?"
        options: ["To shave daily, grow a moustache and marry a rich lady doctor", "To leave medicine", "To buy a snake", "To move to Delhi"]
        answer: "To shave daily, grow a moustache and marry a rich lady doctor"
        difficulty: 3
        hints: ["He wanted to look smart.", "He dreamt of marriage."]
        solution: "He resolved to shave every day, grow a thin moustache and marry a fat lady doctor with money."

  - code: cbse9e.u5.legend
    title: A Legend of the Northland (Phoebe Cary)
    after: [cbse9e.u5.snake]
    notes: |
      A ballad from the cold northern lands where days are short and nights long. Saint Peter, hungry and
      tired, asks a little old lady for a cake from her store. Each cake she bakes seems too large to give
      away; she bakes smaller ones and still keeps them. The saint, angered, turns her into a woodpecker
      that must bore into wood for food. She flies up the chimney; her red cap and black gown remain. Moral:
      greed and selfishness are punished; kindness matters. Ballad form, rhyme scheme ABCB.
    explanations:
      text: "In the far north, Saint Peter, hungry from fasting, asks a little old woman for a cake. She bakes one, but thinks it's too big to give away. She tries smaller and smaller cakes but keeps them all. Angry at her greed, the saint turns her into a woodpecker who must peck at hard wood for food. Her red cap and black dress remain as the woodpecker's colours."
      visual: "Picture a snowy village. In a hut, an old woman in a black gown and red cap stands at the oven, holding a tiny cake. A tired traveller waits. Then she rises up the chimney as a black woodpecker with a red head."
      step_by_step: "Step 1: Setting: the cold Northland. Step 2: Saint Peter asks for one cake. Step 3: She bakes smaller ones but won't part with any. Step 4: The saint's curse: she becomes a woodpecker. Step 5: Moral: be generous."
      real_world: "Legends like this explain nature (why a woodpecker looks as it does) while teaching a lesson, like the Panchatantra stories we hear as children."
    items:
      - prompt: "Who wrote 'A Legend of the Northland'?"
        options: ["Phoebe Cary", "Coates Kinney", "W.B. Yeats", "Robert Frost"]
        answer: "Phoebe Cary"
        difficulty: 1
        hints: ["An American woman poet.", "Not Kinney."]
        solution: "Phoebe Cary."
        mistakes: {"Coates Kinney": eng9_author}
      - prompt: "What did Saint Peter ask the old lady for?"
        options: ["A cake", "Water", "A blanket", "Money"]
        answer: "A cake"
        difficulty: 1
        hints: ["He was hungry.", "She was baking."]
        solution: "He asked for a single cake from her store."
      - prompt: "What was the old lady turned into?"
        options: ["A woodpecker", "A crow", "A stone", "A snake"]
        answer: "A woodpecker"
        difficulty: 1
        hints: ["She had to bore into wood for food.", "A bird."]
        solution: "She was turned into a woodpecker."
      - prompt: "Why was she punished?"
        options: ["She was too greedy to give even a small cake", "She stole from Saint Peter", "She was rude to her neighbour", "She burnt the cakes"]
        answer: "She was too greedy to give even a small cake"
        difficulty: 2
        hints: ["Each cake seemed too big to give away.", "Selfishness."]
        solution: "She was too selfish and greedy to share any cake."
        mistakes: {"She stole from Saint Peter": woodpecker_greed}
      - prompt: "What is the poem's form?"
        options: ["A ballad", "A sonnet", "A haiku", "A limerick"]
        answer: "A ballad"
        difficulty: 2
        hints: ["It tells a story in short stanzas.", "Meant to be sung or recited."]
        solution: "It is a ballad: a story told in verse."
      - prompt: "What remained of the old lady's clothes on the woodpecker?"
        options: ["Her red cap and black gown", "Her white apron", "Her blue shawl", "Nothing"]
        answer: "Her red cap and black gown"
        difficulty: 3
        hints: ["The colours of the bird.", "Red head, black body."]
        solution: "Her red cap and black gown remain as the woodpecker's colours."
