# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 3: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 3
title: Winds of Change · Canvas of Soil
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_canvas: "A canvas is what a painter works on. In the title, what plays that part?"
  e9_metaphor: "A simile uses 'like' or 'as'. Saying one thing IS another is a different figure of speech."
  e9_more_than_cooling: "Pankhas are painted and woven in each region's own style. What do they carry besides air?"
  e9_pankha: "A pankha is waved to make a breeze."
  e9_pankha_decline: "What newer machines now do the pankha's job?"
  e9_title_double: "'Winds' can be real breezes and 'change' can be what happens to old crafts. Look for the choice with both meanings."
  e9_unit_link_land: "Both texts link making things with the land and old traditions."
  c9e3_region: Each region made fans from what it had and what its artisans did best. Match the material or decoration to the place.
  c9e3_change: Ask what new invention took over the fan's old job.
  c9e3_two_meanings: Some titles mean two things at once. Think of the literal meaning and the deeper one.
  c9e3_figure: Ask whether the line compares using 'like' or 'as', or says one thing simply is another.
  c9e3_image: Picture the poem's main image. If the earth is a canvas, who would be painting on it?

concepts:
  - code: cbse9k.u3.winds
    title: Winds of Change
    notes: |
      An informative prose piece about the pankha, the Indian hand fan. Once an everyday object for cooling
      oneself, the pankha became a work of craft and a traded cultural good, and each region developed its own
      style: appliqué and zari (zardozi) fans in Rajasthan, mirror-work and beaded fans in Gujarat, fans made from
      the soft white pith of the sola plant in West Bengal, and woven bamboo fans in Bihar and Uttar Pradesh.
      Pankhas travelled along trade routes and became symbols of regional identity, used also in rituals and
      celebrations. With electric fans and air-conditioners, everyday use declined, and the craft now supports
      artisans mainly as decorative and cultural work. The piece asks how traditional crafts can survive change:
      through new designs, markets and public appreciation.
    explanations:
      text: "The humble hand fan, the pankha, is more than a way to keep cool. Every region of India made its own kind: mirror-work in Gujarat, sola pith in Bengal, bamboo in Bihar. Electric fans changed everyday life, so now the craft survives by finding new uses and admirers."
      visual: "Picture a wall display of fans: a round Gujarati fan sparkling with mirrors, a white sola fan from Bengal, a woven bamboo fan from Bihar, and a Rajasthani fan stitched with gold thread. Below, an electric ceiling fan spins."
      step_by_step: "Step 1: The pankha begins as a daily cooling tool. Step 2: Regions develop their own styles. Step 3: Trade spreads them and they become cultural symbols. Step 4: Electric fans reduce daily use. Step 5: Artisans adapt to keep the craft alive."
      real_world: "Craft fairs like Dilli Haat and the Kerala Arts and Crafts Village at Kovalam help artisans sell traditional items, including hand fans, to new buyers."
    activity:
      type: sort
      prompt: 'Winds of Change: which region''s pankha?'
      bins:
      - Rajasthan
      - Gujarat
      - West Bengal
      - Bihar and UP
      items:
      - label: Appliqué and zari work
        bin: Rajasthan
        clue: Gold thread embroidery.
        why: Zari and appliqué fans belong to Rajasthan.
      - label: Mirror-work and beads
        bin: Gujarat
        clue: Small shining mirrors.
        why: Mirror-work and beaded fans are from Gujarat.
      - label: Soft white pith of the sola plant
        bin: West Bengal
        clue: A light white plant material.
        why: Sola pith fans are West Bengal's.
      - label: Woven bamboo
        bin: Bihar and UP
        clue: Split cane crossed together.
        why: Woven bamboo fans come from Bihar and Uttar Pradesh.
    lesson:
      - teach: '''Winds of Change'' is an informative piece about the pankha, the Indian hand fan. Once an everyday object for cooling, it became a work of craft and a traded cultural good. Each region had its own style.'
        picture:
          kind: compare
          columns:
          - title: Region
            points:
            - Rajasthan
            - Gujarat
            - West Bengal
            - Bihar and UP
          - title: Pankha style
            points:
            - Appliqué and zari
            - Mirror-work and beads
            - Sola pith
            - Woven bamboo
          alt: 'Regional styles of hand fans: Rajasthan appliqué and zari, Gujarat mirror-work, West Bengal sola pith, Bihar and UP woven bamboo.'
        check:
          prompt: Which state is known for mirror-work fans?
          options:
          - Gujarat
          - West Bengal
          - Bihar
          answer: Gujarat
          why: Gujarat fans use mirror-work and beads.
      - teach: 'Pankhas travelled along trade routes, became symbols of regional identity, and were used in rituals and celebrations. With electric fans and air-conditioners their everyday use declined; today the craft survives mainly as decorative and cultural work. The piece asks how crafts can survive change: through new designs, new markets and public appreciation. The title has two meanings: the breeze of a fan, and the changes that affect old crafts.'
        check:
          prompt: Why did everyday use of pankhas decline?
          options:
          - Electric fans and ACs replaced them
          - People stopped feeling hot
          - They were banned
          answer: Electric fans and ACs replaced them
          why: New technology took over the cooling job.
    items:
      - prompt: "What is a 'pankha'?"
        options: ["A hand fan", "A water pot", "A woven mat", "A musical instrument"]
        answer: "A hand fan"
        difficulty: 1
        hints: ["Used to keep cool.", "Waved by hand."]
        solution: "Step 1: The piece is about cooling tools. Step 2: A pankha is a hand fan."
        mistakes: {"A woven mat": "e9_pankha"}
      - prompt: "In West Bengal, some hand fans are made from the pith of which plant?"
        options: ["Sola", "Bamboo", "Coconut", "Banana"]
        answer: "Sola"
        difficulty: 1
        hints: ["Soft and white.", "Also used for decorations in Bengal."]
        solution: "Step 1: Bengal's fans use a soft white pith. Step 2: It comes from the sola plant."
        mistakes: {"Bamboo": eng9_read_again}
      - prompt: "Which state's fans are known for mirror-work and beads?"
        options: ["Gujarat", "Bihar", "West Bengal", "Kerala"]
        answer: "Gujarat"
        difficulty: 1
        hints: ["Famous for mirror embroidery.", "Western India."]
        solution: "Step 1: Mirror-work embroidery is a hallmark of one western state. Step 2: That is Gujarat."
        mistakes: {"Bihar": eng9_read_again}
      - prompt: "Why did the everyday use of pankhas decline?"
        options: ["Electric fans and air-conditioners replaced them", "People stopped feeling heat", "They were banned", "Artisans forgot how to make them"]
        answer: "Electric fans and air-conditioners replaced them"
        difficulty: 2
        hints: ["Technology changed.", "What cools most homes today?"]
        solution: "Step 1: New technology cools rooms easily. Step 2: So hand fans were used less in daily life."
        mistakes: {"They were banned": "e9_pankha_decline"}
      - prompt: "Why does the piece call pankhas 'more than cooling devices'?"
        options: ["They carry regional culture, craft skills and identity", "They are very expensive", "They are used only by kings", "They work without hands"]
        answer: "They carry regional culture, craft skills and identity"
        difficulty: 2
        hints: ["Each region has its own style.", "Used in rituals too."]
        solution: "Step 1: Every region's fan shows its own art. Step 2: So pankhas carry culture and identity, not just air."
        mistakes: {"They are very expensive": "e9_more_than_cooling"}
      - prompt: "What does the title 'Winds of Change' suggest?"
        options: ["Both the breeze of a fan and the changes that affect old crafts", "A storm that destroyed a village", "A change in the monsoon only", "A sailing race"]
        answer: "Both the breeze of a fan and the changes that affect old crafts"
        difficulty: 3
        hints: ["A fan makes wind.", "Times have changed for the craft."]
        solution: "Step 1: Fans make a breeze. Step 2: The phrase also means change over time. The title plays on both."
        mistakes: {"A change in the monsoon only": "e9_title_double"}
      - prompt: What kind of writing is 'Winds of Change'?
        options:
        - An informative prose piece
        - A poem
        - A play
        - A diary entry
        answer: An informative prose piece
        difficulty: 1
        hints:
        - It gives facts about a craft.
        - It is not in verse.
        solution: It is informative prose about the history and craft of the pankha.
        mistakes:
          A poem: c9e3_figure
      - prompt: Fans of woven bamboo are typical of…
        options:
        - Bihar and Uttar Pradesh
        - Gujarat
        - Rajasthan
        - Kerala
        answer: Bihar and Uttar Pradesh
        difficulty: 2
        hints:
        - Bamboo grows in the plains.
        - Not the mirror-work state.
        solution: Woven bamboo pankhas are typical of Bihar and UP.
        mistakes:
          Gujarat: c9e3_region
      - prompt: Appliqué and zari fans come from…
        options:
        - Rajasthan
        - West Bengal
        - Bihar
        - Assam
        answer: Rajasthan
        difficulty: 2
        hints:
        - Zari is gold or silver thread work.
        - A desert state famous for bright textiles.
        solution: Rajasthan is known for appliqué and zari pankhas.
        mistakes:
          West Bengal: c9e3_region
      - prompt: How did pankhas become 'more than cooling devices'?
        options:
        - They carried regional culture, craft and identity
        - They began to fly
        - They turned into heaters
        - They were used as plates
        answer: They carried regional culture, craft and identity
        difficulty: 2
        hints:
        - Each region had its own style.
        - They were used in rituals too.
        solution: Pankhas became symbols of regional craft and culture.
        mistakes:
          They turned into heaters: c9e3_change
      - prompt: Which is one way the piece suggests a traditional craft can survive?
        options:
        - New designs and new markets
        - Stopping all production
        - Hiding the craft
        - Banning electric fans
        answer: New designs and new markets
        difficulty: 2
        hints:
        - How can artisans keep earning?
        - Change can help too.
        solution: Fresh designs, markets and appreciation help crafts adapt.
        mistakes:
          Banning electric fans: c9e3_change
      - prompt: In the phrase 'winds of change', the word 'change' refers to…
        options:
        - New times and technology affecting old crafts
        - Loose coins
        - Changing clothes
        - Weather only
        answer: New times and technology affecting old crafts
        difficulty: 3
        hints:
        - The title has two meanings.
        - What changed for pankha makers?
        solution: 'Step 1: ''Winds'' recalls the fan''s breeze. Step 2: ''Change'' points to new technology and times that affected the craft.'
        mistakes:
          Weather only: c9e3_two_meanings
      - prompt: What does 'artisan' mean?
        options:
        - A skilled worker who makes things by hand
        - A painter of portraits only
        - A shop owner
        - A machine
        answer: A skilled worker who makes things by hand
        difficulty: 1
        hints:
        - Fan makers are artisans.
        - Related to 'art'.
        solution: An artisan is a craftsperson who makes things by hand.
        mistakes:
          A machine: c9e1_word_meaning
      - prompt: 'Choose the correct form: ''Today pankhas ___ mainly as decorations.'''
        options:
        - are used
        - is used
        - used
        - using
        answer: are used
        difficulty: 2
        hints:
        - Pankhas is plural.
        - Present passive voice.
        solution: 'Plural subject + present passive: ''pankhas are used''.'
        mistakes:
          is used: c9e1_grammar
      - prompt: Why did pankhas travel along trade routes?
        options:
        - They were valued goods that traders bought and sold
        - They were blown by wind
        - Kings banned them at home
        - They were too heavy to keep
        answer: They were valued goods that traders bought and sold
        difficulty: 2
        hints:
        - The piece calls them a traded good.
        - Craft objects were sold far away.
        solution: As crafted goods, pankhas were traded across regions.
        mistakes:
          They were blown by wind: c9e3_two_meanings
  - code: cbse9k.u3.canvas
    title: Canvas of Soil (Maya Anthony)
    after: [cbse9k.u3.winds]
    notes: |
      A poem paired with Winds of Change, which imagines the earth as a canvas on which people and nature create.
      The soil is pictured as a surface that farmers, potters and artisans shape, and on which seasons paint
      colour. It links creativity to the land and asks us to see the work of hands on the earth as a kind of art,
      and to care for the soil that makes it possible. Read it for its central image (soil as canvas) and its
      gentle, admiring tone.
    explanations:
      text: "The poet sees the earth as a painter's canvas. Fields, crops and the things people make from clay and soil are the paintings. The poem asks us to value both the land and the hands that work on it."
      visual: "Picture a painter's easel, but the canvas is a field: green rice rows as brush strokes, a red clay path, and a potter's pots drying at the edge."
      step_by_step: "Step 1: Find the main image: soil as canvas. Step 2: Ask who 'paints' on it: farmers, artisans, seasons. Step 3: Feel the tone: admiring. Step 4: Link to the prose: crafts grow from the land."
      real_world: "Kerala's paddy fields change colour from green to gold through the season, like a painting changing on a canvas."
    activity:
      type: sort
      prompt: 'Canvas of Soil: literal or the poem''s picture?'
      bins:
      - What soil really is
      - The poem's image
      items:
      - label: Earth where seeds grow
        bin: What soil really is
        clue: A plain fact.
        why: Seeds growing in soil is a fact, not an image.
      - label: A canvas that farmers paint
        bin: The poem's image
        clue: Farmers don't use brushes.
        why: 'Soil ''painted'' by farmers is a metaphor: the poem''s image.'
      - label: Seasons painting colours on the land
        bin: The poem's image
        clue: Can a season hold a brush?
        why: Seasons can't paint; the poet gives them an artist's action.
      - label: Clay that potters dig and shape
        bin: What soil really is
        clue: Potters really do this.
        why: Potters really use clay from the soil, so this is literal.
      - label: Fields as an artist's work
        bin: The poem's image
        clue: Fields compared to art.
        why: Calling fields art is the central image of the poem.
    lesson:
      - teach: '''Canvas of Soil'' by Maya Anthony is paired with Winds of Change. It imagines the earth as a canvas on which people and nature create. Farmers, potters and artisans shape the soil, and the seasons paint it with colour.'
        check:
          prompt: In the poem, the soil is compared to…
          options:
          - A painter's canvas
          - A river
          - A machine
          answer: A painter's canvas
          why: Things are created on it, like a painting.
      - teach: Saying one thing IS another, 'the soil is a canvas', is a metaphor. Saying it is LIKE another, 'the soil is like a canvas', is a simile. The poem links creativity to the land, asks us to see work on the earth as art, and to care for the soil. Its tone is gentle and admiring.
        picture:
          kind: compare
          columns:
          - title: Metaphor
            points:
            - Says A is B
            - The soil is a canvas
          - title: Simile
            points:
            - Says A is like B
            - The soil is like a canvas
          alt: A metaphor says one thing is another; a simile says one thing is like another.
        check:
          prompt: '''The fields are a green carpet'' is a…'
          options:
          - Metaphor
          - Simile
          - Question
          answer: Metaphor
          why: 'No ''like'' or ''as'': it says the fields ARE a carpet.'
    items:
      - prompt: "In the title 'Canvas of Soil', what is compared to a painter's canvas?"
        options: ["The soil or earth", "A sail", "A tent", "A fan"]
        answer: "The soil or earth"
        difficulty: 1
        hints: ["Read the title closely.", "Canvas of ..."]
        solution: "Step 1: A canvas is what a painter paints on. Step 2: The title compares the soil to it."
        mistakes: {"A sail": "e9_canvas"}
      - prompt: "Who wrote 'Canvas of Soil'?"
        options: ["Maya Anthony", "Charles Swain", "Rabindranath Tagore", "Subramania Bharati"]
        answer: "Maya Anthony"
        difficulty: 1
        hints: ["Not Tagore or Bharati.", "Listed with Unit 3."]
        solution: "Step 1: The poem is in Unit 3. Step 2: It is by Maya Anthony."
        mistakes: {"Charles Swain": eng9_author}
      - prompt: "A comparison that says one thing IS another, like 'the soil is a canvas', is called a…"
        options: ["Metaphor", "Simile", "Rhyme", "Refrain"]
        answer: "Metaphor"
        difficulty: 1
        hints: ["No 'like' or 'as'.", "A direct comparison."]
        solution: "Step 1: A simile uses 'like' or 'as'. Step 2: A direct comparison is a metaphor."
        mistakes: {"Simile": "e9_metaphor"}
      - prompt: "If the soil is the canvas, who might be the 'artists' in the poem's idea?"
        options: ["Farmers, potters and the seasons", "Only city painters", "Machines alone", "Nobody"]
        answer: "Farmers, potters and the seasons"
        difficulty: 2
        hints: ["Who shapes the land?", "What changes its colours?"]
        solution: "Step 1: People who work the land shape it. Step 2: Seasons change its colours. They are the artists."
        mistakes: {"Only city painters": eng9_poem_meaning}
      - prompt: "How does this poem link with 'Winds of Change'?"
        options: ["Both connect crafts and creativity to the land and tradition", "Both are about space", "Both are about cricket", "They have no link"]
        answer: "Both connect crafts and creativity to the land and tradition"
        difficulty: 2
        hints: ["Pankhas are crafts.", "The soil is a canvas for making."]
        solution: "Step 1: The prose is about a traditional craft. Step 2: The poem sees the earth as a base for creation. Both link craft and land."
        mistakes: {"They have no link": "e9_unit_link_land"}
      - prompt: "What attitude to the earth does the poem encourage?"
        options: ["Respect and care for the soil", "Using it up quickly", "Ignoring it", "Fear of it"]
        answer: "Respect and care for the soil"
        difficulty: 3
        hints: ["A painter treasures the canvas.", "No canvas, no art."]
        solution: "Step 1: Without the canvas there is no painting. Step 2: So the poem asks us to value and care for the soil."
        mistakes: {"Using it up quickly": eng9_poem_meaning}
      - prompt: '''Her smile was like sunshine.'' This is a…'
        options:
        - Simile
        - Metaphor
        - Rhyme
        - Question
        answer: Simile
        difficulty: 1
        hints:
        - Look for 'like' or 'as'.
        - It compares two things.
        solution: A comparison using 'like' is a simile.
        mistakes:
          Metaphor: c9e3_figure
      - prompt: In the poem's idea, who might the 'artists' on the canvas of soil be?
        options:
        - Farmers, potters and the seasons
        - Only painters in cities
        - Cars and buses
        - Nobody
        answer: Farmers, potters and the seasons
        difficulty: 2
        hints:
        - Who shapes the soil?
        - What gives it colour?
        solution: Farmers and potters shape the soil and the seasons colour it.
        mistakes:
          Only painters in cities: c9e3_image
      - prompt: What is the tone of 'Canvas of Soil'?
        options:
        - Gentle and admiring
        - Angry and harsh
        - Fearful
        - Mocking
        answer: Gentle and admiring
        difficulty: 1
        hints:
        - Does the poet love or dislike the earth?
        - It praises creation.
        solution: The poem admires the soil and its makers in a gentle way.
        mistakes:
          Mocking: c9e3_image
      - prompt: Which line is a metaphor?
        options:
        - The river is a silver ribbon
        - The river shines like silver
        - The river is long
        - Is the river cold?
        answer: The river is a silver ribbon
        difficulty: 2
        hints:
        - No 'like' or 'as'.
        - It says one thing IS another.
        solution: Calling the river a ribbon, without 'like', is a metaphor.
        mistakes:
          The river shines like silver: c9e3_figure
      - prompt: What does the poem ask us to do for the soil?
        options:
        - Respect and care for it
        - Cover it with concrete
        - Ignore it
        - Sell it all
        answer: Respect and care for it
        difficulty: 1
        hints:
        - Without soil, can farmers and potters create?
        - Think of the poem's admiration.
        solution: The poem asks us to care for the soil that makes creation possible.
        mistakes:
          Ignore it: c9e3_image
      - prompt: Which of these would a potter use from the 'canvas of soil'?
        options:
        - Clay
        - Plastic
        - Glass bottles
        - Steel
        answer: Clay
        difficulty: 1
        hints:
        - It comes from the earth.
        - Arenla fetched it from a riverbank.
        solution: Potters shape clay, which comes from the soil.
        mistakes:
          Plastic: c9e3_image
      - prompt: How does 'Canvas of Soil' link with 'Winds of Change'?
        options:
        - Both connect crafts and creativity to the land and tradition
        - Both are about computers
        - Both describe a war
        - They have no link
        answer: Both connect crafts and creativity to the land and tradition
        difficulty: 2
        hints:
        - What are pankhas made from?
        - Where does craft begin?
        solution: Both pieces tie crafts and creativity to natural materials and tradition.
        mistakes:
          They have no link: c9e3_two_meanings
      - prompt: '''The seasons paint the hills in gold.'' What is being described?'
        options:
        - The colours that changing seasons bring
        - People painting hills with brushes
        - Gold mining
        - A flood
        answer: The colours that changing seasons bring
        difficulty: 3
        hints:
        - Can seasons hold a brush?
        - Think of ripe crops or autumn leaves.
        solution: 'Step 1: Seasons cannot literally paint. Step 2: The line means seasons bring colours, like golden crops, to the land.'
        mistakes:
          People painting hills with brushes: c9e3_figure
      - prompt: 'Choose the correct plural: ''The poet admires the ___ of the earth.'''
        options:
        - colours
        - colour's
        - colourss
        - colouring's
        answer: colours
        difficulty: 1
        hints:
        - Plural, not possessive.
        - No apostrophe needed.
        solution: The plural of 'colour' is 'colours'; an apostrophe shows possession, not plural.
        mistakes:
          colour's: c9e1_grammar
