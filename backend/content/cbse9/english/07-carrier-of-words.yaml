# CBSE Class 9 English (NCERT Kaveri, 2026-27), unit 7: a prose lesson and a poem.
# Written from published summaries of the new book, not from the printed copy: check names and details against it.
subject: cbse9-eng
chapter: 7
title: Carrier of Words · Words
tips:
  eng9_read_again: "Go back to the lesson: the answer is in the text. Find the paragraph about that person or event."
  eng9_author: "Match each lesson with its writer: the name is under the title, and the writer's note is at the end."
  eng9_poem_meaning: "Poems often mean more than they say. Ask what the picture in the poem stands for in life."
  e9_akaal: "'Akaal' is a hard time when there is no rain and no crop."
  e9_choose_words: "The poem asks us to think before we speak."
  e9_harsh_words: "Once a harsh word is said, can you take it back?"
  e9_khetaram_place: "Khetaram delivers letters in a desert. Which desert?"
  e9_rhyme: "Mark the last word of each line with a letter. Which lines rhyme with each other?"
  e9_service: "The lesson honours someone who does his duty quietly and well."
  e9_trust: "Khetaram never fails to bring the villagers' letters, money and news."
  e9_unit_link_words: "One text carries words as letters, the other talks about the power of words."
  c9e7_place: Picture where Khetaram works. Is it green and wet, or hot, sandy and dry, near a border?
  c9e7_role: Think about everything Khetaram carries and does, beyond simply dropping off envelopes.
  c9e7_rhyme: Mark the last word of each line with a letter. Same sound, same letter. What pattern do you get?
  c9e7_kind_harsh: Ask what the words do to the listener. Do they heal and build, or hurt and break?

concepts:
  - code: cbse9k.u7.carrier
    title: Carrier of Words
    notes: |
      A reportage-style feature about Khetaram, a Gramin Dak Sevak (rural postman) in a remote village in the Thar
      desert of western Rajasthan, near the India–Pakistan border. Every day he walks long distances across hot
      sand dunes, in a land where 'akaal' (famine and drought) is a way of life, to deliver letters, money orders
      and pension payments. For scattered families he is a link to the outside world: he reads letters aloud to
      those who cannot read and carries news of jobs, relatives and government help. The villagers trust him
      completely. The writer pays tribute to his quiet service. Themes: dignity of labour, duty, trust and the
      importance of communication in remote places.
    explanations:
      text: "Khetaram is a village postman in the Thar desert. Day after day he walks across burning sand to bring letters, money and news to families far from towns. For them he is not just a postman but a trusted link to the world."
      visual: "Picture a lone man with a khaki bag walking over golden dunes under a blazing sun, a few huts far ahead, and a woman waiting at a door for a letter."
      step_by_step: "Step 1: Meet Khetaram, a Gramin Dak Sevak. Step 2: The setting: the Thar desert near the border. Step 3: His work: long walks with letters, money orders and pensions. Step 4: His role: reading letters, carrying news. Step 5: The villagers' trust and the writer's tribute."
      real_world: "India Post's Gramin Dak Sevaks still deliver pensions and bank services in villages where there is no bank branch, including in Kerala's hill areas."
    activity:
      type: sort
      prompt: 'Carrier of Words: what does Khetaram carry or do?'
      bins:
      - Delivers
      - Helps people understand
      - Faces hardship
      items:
      - label: Money orders and pensions
        bin: Delivers
        clue: Things handed over at the door.
        why: Money orders and pensions are delivered by the postman.
      - label: Reads letters aloud
        bin: Helps people understand
        clue: For those who cannot read.
        why: Reading aloud helps people who cannot read understand their mail.
      - label: Walks across hot sand dunes
        bin: Faces hardship
        clue: The Thar desert.
        why: The hot desert walk is the hardship of his job.
      - label: News of jobs and relatives
        bin: Helps people understand
        clue: Information from outside.
        why: He passes on news, linking villagers to the world.
      - label: '''Akaal'' as a way of life'
        bin: Faces hardship
        clue: Famine and drought.
        why: 'Akaal means famine and drought: a constant hardship.'
    lesson:
      - teach: '''Carrier of Words'' is a feature about Khetaram, a Gramin Dak Sevak (rural postman) in a remote village in the Thar desert of western Rajasthan, near the India–Pakistan border. Every day he walks long distances across hot sand dunes, in a land where ''akaal'' (famine and drought) is a way of life.'
        check:
          prompt: What does 'akaal' mean?
          options:
          - Famine or drought
          - Festival
          - Flood
          answer: Famine or drought
          why: Drought is common in the Thar desert.
      - teach: 'He delivers letters, money orders and pension payments. For scattered families he is a link to the outside world: he reads letters aloud to those who cannot read, and brings news of jobs, relatives and government help. The villagers trust him completely. The writer pays tribute to his quiet service.'
        picture:
          kind: compare
          columns:
          - title: What he carries
            points:
            - Letters
            - Money orders
            - Pensions
          - title: What he gives
            points:
            - Reads letters aloud
            - News of jobs and family
            - A link to the world
          alt: What Khetaram carries, letters, money orders and pensions, and what he gives the villagers beyond that.
        check:
          prompt: How does Khetaram help villagers who cannot read?
          options:
          - He reads their letters aloud
          - He throws letters away
          - He sends them to school
          answer: He reads their letters aloud
          why: He goes beyond his duty.
      - teach: 'Themes: dignity of labour, duty, trust, and the importance of communication in remote places. A ''reportage'' feature describes real people and events, like a news report, but with feeling.'
        check:
          prompt: Which value does the lesson celebrate?
          options:
          - Quiet, dutiful service
          - Fame
          - Laziness
          answer: Quiet, dutiful service
          why: Khetaram serves without seeking praise.
    items:
      - prompt: "What is Khetaram's job?"
        options: ["A rural postman (Gramin Dak Sevak)", "A camel trader", "A teacher", "A soldier"]
        answer: "A rural postman (Gramin Dak Sevak)"
        difficulty: 1
        hints: ["He carries letters.", "The title: carrier of words."]
        solution: "Step 1: He delivers letters and money orders. Step 2: He is a Gramin Dak Sevak, a rural postman."
        mistakes: {"A soldier": eng9_read_again}
      - prompt: "Where does Khetaram work?"
        options: ["In the Thar desert of Rajasthan", "In the hills of Kerala", "In a Mumbai post office", "In the Sundarbans"]
        answer: "In the Thar desert of Rajasthan"
        difficulty: 1
        hints: ["Sand dunes.", "Near the Pakistan border."]
        solution: "Step 1: The feature describes dunes and drought. Step 2: He works in the Thar desert of western Rajasthan."
        mistakes: {"In a Mumbai post office": "e9_khetaram_place"}
      - prompt: "What does the word 'akaal' mean in the lesson?"
        options: ["Famine or drought", "A festival", "A letter", "A camel"]
        answer: "Famine or drought"
        difficulty: 1
        hints: ["Something common in a desert.", "'A way of life here.'"]
        solution: "Step 1: The desert gets little rain. Step 2: Akaal means famine or drought."
        mistakes: {"A festival": "e9_akaal"}
      - prompt: "Besides delivering letters, how does Khetaram help villagers who cannot read?"
        options: ["He reads their letters aloud to them", "He writes their exams", "He builds their houses", "He drives them to town"]
        answer: "He reads their letters aloud to them"
        difficulty: 2
        hints: ["Words on paper.", "Not everyone is literate."]
        solution: "Step 1: Some villagers cannot read. Step 2: Khetaram reads their letters aloud for them."
        mistakes: {"He writes their exams": eng9_read_again}
      - prompt: "Why do the villagers trust Khetaram so much?"
        options: ["He faithfully brings their letters, money and news despite hardship", "He is their landlord", "He gives them free food", "He is famous on television"]
        answer: "He faithfully brings their letters, money and news despite hardship"
        difficulty: 2
        hints: ["Money orders and pensions.", "Every day, in any weather."]
        solution: "Step 1: He carries their money and private news. Step 2: He does it reliably, so they trust him."
        mistakes: {"He is their landlord": "e9_trust"}
      - prompt: "What value does the lesson mainly celebrate?"
        options: ["The dignity of quiet, dutiful service", "Becoming rich quickly", "Avoiding hard work", "Living in cities"]
        answer: "The dignity of quiet, dutiful service"
        difficulty: 3
        hints: ["Khetaram is not famous.", "The writer pays tribute."]
        solution: "Step 1: Khetaram works hard without fame. Step 2: The lesson honours the dignity of such service."
        mistakes: {"Becoming rich quickly": "e9_service"}
      - prompt: Near which border does Khetaram work?
        options:
        - India–Pakistan
        - India–China
        - India–Nepal
        - India–Bangladesh
        answer: India–Pakistan
        difficulty: 1
        hints:
        - Western Rajasthan.
        - The Thar desert stretches across it.
        solution: His village in western Rajasthan lies near the India–Pakistan border.
        mistakes:
          India–Nepal: c9e7_place
      - prompt: What is a 'money order'?
        options:
        - Money sent through the post office to a person
        - A shop's bill
        - A bank robbery
        - A kind of letterbox
        answer: Money sent through the post office to a person
        difficulty: 2
        hints:
        - Khetaram delivers these.
        - Families far away send money home.
        solution: A money order lets someone send money by post, delivered in cash by the postman.
        mistakes:
          A shop's bill: c9e7_role
      - prompt: Why is Khetaram's job hard?
        options:
        - He walks long distances over hot sand dunes
        - He works in an air-conditioned office
        - He has nothing to deliver
        - He drives a fast car
        answer: He walks long distances over hot sand dunes
        difficulty: 1
        hints:
        - Think of the desert.
        - Villages are far apart.
        solution: The desert heat and long walks between scattered homes make his work tough.
        mistakes:
          He works in an air-conditioned office: c9e7_place
      - prompt: What does 'Gramin Dak Sevak' mean?
        options:
        - Rural postal servant
        - City police officer
        - Village teacher
        - Desert guide
        answer: Rural postal servant
        difficulty: 2
        hints:
        - Gramin means rural.
        - Dak means post.
        solution: 'Gramin (rural) + Dak (post) + Sevak (servant): a rural postman.'
        mistakes:
          Village teacher: c9e7_role
      - prompt: Why is a postman especially important in a remote desert village?
        options:
        - He connects isolated families with the outside world
        - There is lots of internet there
        - Villagers don't need news
        - He sells groceries
        answer: He connects isolated families with the outside world
        difficulty: 2
        hints:
        - Homes are scattered and far from towns.
        - How else would news arrive?
        solution: In remote places with few links, the postman brings news, money and help.
        mistakes:
          There is lots of internet there: c9e7_place
      - prompt: Which phrase best describes Khetaram's character?
        options:
        - Dutiful and trustworthy
        - Lazy and careless
        - Proud and boastful
        - Rude and impatient
        answer: Dutiful and trustworthy
        difficulty: 1
        hints:
        - Villagers trust him.
        - He works hard every day.
        solution: 'He does his duty faithfully and earns trust: dutiful and trustworthy.'
        mistakes:
          Proud and boastful: c9e7_role
      - prompt: 'Choose the correct form: ''Every day Khetaram ___ many kilometres.'''
        options:
        - walks
        - walk
        - walking
        - walked tomorrow
        answer: walks
        difficulty: 1
        hints:
        - A habit in the present.
        - Third person singular.
        solution: 'Simple present for a daily habit, with -s: walks.'
        mistakes:
          walk: c9e1_grammar
      - prompt: Why might the title call him a 'carrier of words'?
        options:
        - He carries messages that connect people
        - He carries dictionaries
        - He writes books
        - He shouts loudly
        answer: He carries messages that connect people
        difficulty: 3
        hints:
        - What is in letters?
        - Words link families.
        solution: 'Step 1: Letters are words. Step 2: By carrying them, he links people far apart.'
        mistakes:
          He carries dictionaries: c9e7_role
      - prompt: What does 'tribute' mean in 'the writer pays tribute'?
        options:
        - Words of praise and respect
        - A tax
        - A river branch
        - A punishment
        answer: Words of praise and respect
        difficulty: 2
        hints:
        - The writer admires Khetaram.
        - Honour shown in words.
        solution: To pay tribute is to express admiration and respect.
        mistakes:
          A tax: c9e1_word_meaning
  - code: cbse9k.u7.words
    title: Words (Charles Swain)
    after: [cbse9k.u7.carrier]
    notes: |
      A short rhyming poem by Charles Swain, the nineteenth-century English poet, written in four-line stanzas
      with an ABAB rhyme scheme. It reflects on the power of words: a few kind, sincere words can comfort, heal and
      build friendship, while careless or harsh words can wound deeply and cannot be taken back. It urges us to
      speak gently and truthfully. Read it alongside Carrier of Words: there, words carried by a postman connect
      people; here, the words we choose shape our relationships.
    explanations:
      text: "Words seem small, but the poet says they are powerful. Kind, honest words can heal a hurt or win a friend; harsh words can wound and can never be unsaid. So we should choose our words with care."
      visual: "Picture two speech bubbles: one soft and glowing, with a plant growing from it; the other sharp and jagged, with a crack running from it."
      step_by_step: "Step 1: Notice the subject: words. Step 2: Find what good words do: comfort, heal, connect. Step 3: Find what harsh words do: hurt, cannot be taken back. Step 4: The lesson: speak gently and sincerely."
      real_world: "A kind message from a friend before an exam can calm us, while an unkind comment online can hurt someone for a long time."
    activity:
      type: sort
      prompt: 'Words (Charles Swain): kind words or harsh words?'
      bins:
      - Kind words
      - Harsh words
      items:
      - label: Comfort and heal
        bin: Kind words
        clue: What helps a hurt?
        why: Healing comes from gentle, sincere words.
      - label: Wound deeply
        bin: Harsh words
        clue: What causes a hurt?
        why: Careless words wound; that's the warning.
      - label: Build friendship
        bin: Kind words
        clue: What brings people closer?
        why: Friendship grows from kind words.
      - label: Cannot be taken back
        bin: Harsh words
        clue: The poet's warning.
        why: A harsh word, once said, can't be unsaid.
      - label: Speak gently and truly
        bin: Kind words
        clue: The poem's advice.
        why: The advice is to speak kindly and sincerely.
    lesson:
      - teach: '''Words'' is a short rhyming poem by Charles Swain, a nineteenth-century English poet. It reflects on the power of words: a few kind, sincere words can comfort, heal and build friendship, while careless or harsh words can wound deeply and cannot be taken back. It urges us to speak gently and truthfully.'
        check:
          prompt: What can kind words do, says the poem?
          options:
          - Comfort and heal
          - Break friendships
          - Nothing
          answer: Comfort and heal
          why: Gentle words build people up.
      - teach: 'The poem is in four-line stanzas with an ABAB rhyme scheme: lines 1 and 3 rhyme, and lines 2 and 4 rhyme. It links with Carrier of Words: there, words carried by a postman connect people; here, the words we choose shape our relationships.'
        picture:
          kind: compare
          columns:
          - title: Line
            points:
            - 1 ... day
            - 2 ... true
            - 3 ... way
            - 4 ... you
          - title: Rhyme letter
            points:
            - A
            - B
            - A
            - B
          alt: 'An ABAB stanza: lines ending day and way rhyme as A, true and you as B.'
        check:
          prompt: In ABAB, which lines rhyme with each other?
          options:
          - 1 and 3, and 2 and 4
          - 1 and 2 only
          - None
          answer: 1 and 3, and 2 and 4
          why: Same letters rhyme.
    items:
      - prompt: "Who wrote the poem 'Words'?"
        options: ["Charles Swain", "David Roth", "Rabindranath Tagore", "Maya Anthony"]
        answer: "Charles Swain"
        difficulty: 1
        hints: ["A nineteenth-century English poet.", "Unit 7."]
        solution: "Step 1: The poem is paired with Carrier of Words. Step 2: It is by Charles Swain."
        mistakes: {"David Roth": eng9_author}
      - prompt: "What is the rhyme scheme of each stanza?"
        options: ["ABAB", "AABB", "ABBA", "No rhyme"]
        answer: "ABAB"
        difficulty: 2
        hints: ["Lines 1 and 3 rhyme.", "Lines 2 and 4 rhyme."]
        solution: "Step 1: The first and third lines rhyme. Step 2: So do the second and fourth: ABAB."
        mistakes: {"AABB": "e9_rhyme", "ABBA": "e9_rhyme"}
      - prompt: "According to the poem, what can kind words do?"
        options: ["Comfort and heal", "Break friendships", "Cause wars", "Do nothing at all"]
        answer: "Comfort and heal"
        difficulty: 1
        hints: ["The good side of words.", "Like medicine."]
        solution: "Step 1: The poem contrasts kind and harsh words. Step 2: Kind words comfort and heal."
        mistakes: {"Do nothing at all": eng9_poem_meaning}
      - prompt: "Why does the poet warn us about harsh words?"
        options: ["They can hurt deeply and cannot be taken back", "They are hard to spell", "They are too long", "They are not in the dictionary"]
        answer: "They can hurt deeply and cannot be taken back"
        difficulty: 2
        hints: ["Once said, they stay.", "They wound."]
        solution: "Step 1: Spoken words cannot be unsaid. Step 2: Harsh ones can wound for a long time."
        mistakes: {"They are hard to spell": "e9_harsh_words"}
      - prompt: "What advice does the poem give?"
        options: ["Choose your words carefully and speak kindly", "Never speak at all", "Speak as loudly as possible", "Use difficult words to impress"]
        answer: "Choose your words carefully and speak kindly"
        difficulty: 1
        hints: ["Words have power.", "Speak gently."]
        solution: "Step 1: Words can heal or hurt. Step 2: So we should choose them with care and kindness."
        mistakes: {"Never speak at all": "e9_choose_words"}
      - prompt: "How does 'Words' link with 'Carrier of Words'?"
        options: ["Both show how words connect and affect people", "Both are about deserts", "Both are about music", "They have no link"]
        answer: "Both show how words connect and affect people"
        difficulty: 3
        hints: ["Letters carry words.", "Words shape relationships."]
        solution: "Step 1: Khetaram carries words that link families. Step 2: The poem shows words shaping relationships. Both are about the power of words."
        mistakes: {"They have no link": "e9_unit_link_words"}
      - prompt: Lines end with 'sky', 'tree', 'high', 'free'. What is the rhyme scheme?
        options:
        - ABAB
        - AABB
        - ABBA
        - AAAA
        answer: ABAB
        difficulty: 2
        hints:
        - Sky and high rhyme.
        - Tree and free rhyme.
        solution: 'Step 1: Lines 1 and 3 rhyme (A). Step 2: Lines 2 and 4 rhyme (B): ABAB.'
        mistakes:
          AABB: c9e7_rhyme
      - prompt: Lines end with 'cat', 'hat', 'dog', 'log'. What is the rhyme scheme?
        options:
        - AABB
        - ABAB
        - ABCD
        - ABBA
        answer: AABB
        difficulty: 2
        hints:
        - Cat and hat are next to each other.
        - So are dog and log.
        solution: 'Pairs of neighbouring lines rhyme: AABB.'
        mistakes:
          ABAB: c9e7_rhyme
      - prompt: Why can't harsh words be 'taken back'?
        options:
        - Once said, the hurt has already been done
        - Words are too heavy
        - They are written in stone
        - Nobody hears them
        answer: Once said, the hurt has already been done
        difficulty: 2
        hints:
        - Can you un-say something?
        - Think of the listener's feelings.
        solution: Even with an apology, the pain of harsh words remains.
        mistakes:
          Nobody hears them: c9e7_kind_harsh
      - prompt: Which of these is an example of kind words?
        options:
        - '''Don''t worry, I''ll help you.'''
        - '''You always fail.'''
        - '''Go away!'''
        - '''That''s stupid.'''
        answer: '''Don''t worry, I''ll help you.'''
        difficulty: 1
        hints:
        - Which one comforts?
        - Which one offers help?
        solution: Offering help and comfort is kind; the others hurt.
        mistakes:
          '''You always fail.''': c9e7_kind_harsh
      - prompt: In which century did Charles Swain write?
        options:
        - Nineteenth century
        - Twenty-first century
        - Tenth century
        - Fifteenth century
        answer: Nineteenth century
        difficulty: 2
        hints:
        - The 1800s.
        - He was an English poet of that time.
        solution: Charles Swain was a nineteenth-century English poet.
        mistakes:
          Twenty-first century: eng9_author
      - prompt: How many lines are there in each stanza of 'Words'?
        answer: 4
        check: '4'
        difficulty: 1
        hints:
        - The rhyme scheme has four letters.
        - ABAB.
        solution: Each stanza has four lines, rhyming ABAB.
        mistakes:
          '2': c9e7_rhyme
      - prompt: A four-line stanza is called a…
        options:
        - Quatrain
        - Couplet
        - Sonnet
        - Refrain
        answer: Quatrain
        difficulty: 3
        hints:
        - Quatr- means four.
        - A couplet has two lines.
        solution: A stanza of four lines is a quatrain.
        mistakes:
          Couplet: c9e7_rhyme
      - prompt: 'Choose the correct word: ''Think before you ___.'''
        options:
        - speak
        - speaking
        - spoke
        - speaks
        answer: speak
        difficulty: 1
        hints:
        - After 'you', present tense.
        - Base form.
        solution: '''Think before you speak'' uses the base verb after ''you''.'
        mistakes:
          speaks: c9e1_grammar
      - prompt: What does the poem suggest about the power of words?
        options:
        - Words can build or break relationships
        - Words have no effect
        - Only written words matter
        - Silence is always wrong
        answer: Words can build or break relationships
        difficulty: 2
        hints:
        - Kind words heal.
        - Harsh words wound.
        solution: The poem shows words can strengthen or damage bonds between people.
        mistakes:
          Words have no effect: c9e7_kind_harsh
