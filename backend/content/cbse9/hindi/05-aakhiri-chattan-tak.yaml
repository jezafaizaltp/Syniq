        why: अरब सागर, हिंद महासागर और बंगाल की खाड़ी।
    - teach: 'लेखक सूर्यास्त देखने रेत के ऊँचे टीलों (सैंड हिल) पर चढ़ता है। सूरज के पानी को छूते ही रंग बदलते हैं: सुनहरा, फिर बैंगनी, फिर काला। अँधेरा होने पर वह लौटता है, बढ़ते पानी और लहरों से घबराकर दौड़ता है और एक चट्टान से टकराकर हल्की चोट खाता है। तट की रेत के अनोखे रंगों को वह ''अनाम'' रंग कहता है।'
