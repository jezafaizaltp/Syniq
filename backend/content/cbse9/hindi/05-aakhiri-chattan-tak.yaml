subject: cbse9-hin
chapter: 5
title: आखिरी चट्टान तक
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_kanyakumari: "शीर्षक 'आखिरी चट्टान' भारत के सबसे दक्षिणी छोर की ओर इशारा करता है। शिमला और दार्जिलिंग पहाड़ों पर हैं।"
  h9_lehre: "लेखक अँधेरे में तट पर था। समुद्र के पास अँधेरे में क्या खतरा हो सकता है?"
  h9_teen_samudra: "कन्याकुमारी पर बंगाल की खाड़ी, अरब सागर और हिंद महासागर मिलते हैं। गिनें।"
concepts:
- code: hin9g.c5.chattan
  title: आखिरी चट्टान तक (मोहन राकेश)
  notes: |
    मोहन राकेश का यात्रा-वृत्तांत, भारत के दक्षिणी छोर कन्याकुमारी की यात्रा पर। कन्याकुमारी में अरब सागर,
    हिंद महासागर और बंगाल की खाड़ी मिलते हैं। लेखक सूर्यास्त देखने के लिए रेत के ऊँचे टीलों (सैंड हिल) पर
    चढ़ता है और सूरज के पानी को छूते ही रंगों का बदलना देखता है: सुनहरा, फिर बैंगनी, फिर काला। अँधेरा होने पर
    वह तट से लौटने का निर्णय लेता है, बढ़ते पानी और लहरों से घबराकर दौड़ता है और एक चट्टान से टकराकर
    हल्की चोट खाता है। तट की रेत के अनोखे रंगों को वह 'अनाम' रंग कहता है। सुबह सूर्योदय देखता है, फिर
    मछुआरों की नाव से विवेकानंद चट्टान ('आखिरी चट्टान') तक जाता है, जहाँ एक पढ़े-लिखे बेरोज़गार युवक से
    बात होती है। संदेश: प्रकृति की विराटता मनुष्य को अपनी सीमा का बोध और आत्म-चिंतन देती है; सौंदर्य के
    बीच समाज की सच्चाइयाँ भी दिखती हैं।
  explanations:
    text: मोहन राकेश भारत के आखिरी सिरे, कन्याकुमारी पहुँचते हैं, जहाँ तीन समुद्र मिलते हैं। वे रेत के टीलों से सूर्यास्त के बदलते रंग देखते हैं, अँधेरे में लहरों से डरते हैं, और सुबह नाव से विवेकानंद चट्टान तक जाते हैं। यात्रा बाहर के दृश्य के साथ मन के भीतर की यात्रा भी है।
    visual: भारत का नक्शा, नीचे की नोक पर कन्याकुमारी। बाएँ अरब सागर, नीचे हिंद महासागर, दाएँ बंगाल की खाड़ी। तट पर रेत के टीले और सामने समुद्र में एक चट्टान।
    step_by_step: 'चरण 1: स्थान: कन्याकुमारी, तीन समुद्रों का संगम। चरण 2: सैंड हिल से सूर्यास्त। चरण 3: अँधेरे में लौटते समय लहरों का डर। चरण 4: सूर्योदय। चरण 5: नाव से विवेकानंद चट्टान और युवक से बातचीत।'
    real_world: केरल से पास होने के कारण कई परिवार कन्याकुमारी में सूर्योदय और सूर्यास्त दोनों एक ही जगह से देखने जाते हैं।
  items:
  - prompt: '''आखिरी चट्टान तक'' के लेखक कौन हैं?'
    options:
    - मोहन राकेश
    - शेखर जोशी
    - प्रेमचंद
    - पदुमलाल पुन्नालाल बख्शी
    answer: मोहन राकेश
    difficulty: 1
    hints:
    - '''आषाढ़ का एक दिन'' नाटक के लेखक।'
    - नई कहानी आंदोलन।
    solution: 'चरण 1: यह एक यात्रा-वृत्तांत है। चरण 2: इसके लेखक मोहन राकेश हैं।'
    mistakes:
      शेखर जोशी: hin9g_author
  - prompt: लेखक ने किस स्थान की यात्रा का वर्णन किया है?
    options:
    - कन्याकुमारी
    - शिमला
    - दार्जिलिंग
    - जैसलमेर
    answer: कन्याकुमारी
    difficulty: 1
    hints:
    - भारत का दक्षिणी छोर।
    - तीन समुद्रों का संगम।
    solution: 'चरण 1: पाठ में तीन समुद्रों के संगम का वर्णन है। चरण 2: यह कन्याकुमारी है।'
    mistakes: {"शिमला": "h9_kanyakumari", "जैसलमेर": "h9_kanyakumari"}
  - prompt: कन्याकुमारी में कितने समुद्र मिलते हैं?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - अरब सागर, हिंद महासागर और…
    - बंगाल की खाड़ी भी।
    solution: 'चरण 1: अरब सागर, हिंद महासागर, बंगाल की खाड़ी। चरण 2: कुल 3।'
    mistakes: {"2": "h9_teen_samudra", "4": "h9_teen_samudra"}
  - prompt: '''आखिरी चट्टान'' किसे कहा गया है?'
    options:
    - विवेकानंद चट्टान
    - सैंड हिल
    - केप होटल
    - गवर्नमेंट गेस्ट हाउस
    answer: विवेकानंद चट्टान
    difficulty: 2
    hints:
    - समुद्र के बीच की चट्टान।
    - मान्यता है कि वहाँ स्वामी जी ने ध्यान किया।
    solution: 'चरण 1: लेखक सुबह नाव से समुद्र की चट्टान तक जाता है। चरण 2: यही विवेकानंद चट्टान है।'
    mistakes:
      सैंड हिल: hin9g_read_again
  - prompt: लौटते समय लेखक क्यों घबरा गया?
    options:
    - अँधेरे में तट पर पानी और लहरें बढ़ने लगीं
    - उसका सामान चोरी हो गया
    - उसे रास्ता बताने वाला नहीं मिला
    - होटल बंद हो गया
    answer: अँधेरे में तट पर पानी और लहरें बढ़ने लगीं
    difficulty: 2
    hints:
    - वह तट से लौट रहा था।
    - दौड़ते हुए चट्टान से टकराया।
    solution: 'चरण 1: अँधेरा होने पर वह समुद्र-तट से लौटा। चरण 2: बढ़ते पानी और लहरों से घबराकर दौड़ा और चोट खाई।'
    mistakes: {"उसका सामान चोरी हो गया": "h9_lehre"}
  - prompt: इस यात्रा-वृत्तांत से क्या संदेश मिलता है?
    options:
    - प्रकृति की विराटता मनुष्य को अपनी सीमा का बोध और आत्म-चिंतन देती है
    - यात्रा करना समय की बर्बादी है
    - समुद्र से हमेशा दूर रहना चाहिए
    - केवल सूर्यास्त देखना ही यात्रा है
    answer: प्रकृति की विराटता मनुष्य को अपनी सीमा का बोध और आत्म-चिंतन देती है
    difficulty: 3
    hints:
    - विशाल समुद्र के सामने मनुष्य छोटा लगता है।
    - बाहरी और भीतरी यात्रा।
    solution: 'चरण 1: विशाल समुद्र और बदलते रंग लेखक को अपनी सीमा दिखाते हैं। चरण 2: इससे वह भीतर झाँकता है: यही संदेश है।'
    mistakes:
      यात्रा करना समय की बर्बादी है: hin9g_poem_meaning
