        alt: 'कन्याकुमारी पर मिलने वाले तीन जल: पश्चिम में अरब सागर, दक्षिण में हिंद महासागर, पूर्व में बंगाल की खाड़ी।'
      check:
        prompt: कन्याकुमारी में कितने जल मिलते हैं?
