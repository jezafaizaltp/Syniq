        why: अँधेरा होते-होते सब काला हो गया।
    - teach: 'सुबह वह सूर्योदय देखता है, फिर मछुआरों की नाव से विवेकानंद चट्टान (''आखिरी चट्टान'') तक जाता है, जहाँ एक पढ़े-लिखे बेरोज़गार युवक से बात होती है। संदेश: प्रकृति की विराटता मनुष्य को अपनी सीमा का बोध और आत्म-चिंतन देती है; सौंदर्य के बीच समाज की सच्चाइयाँ भी दिखती हैं।'
      check:
