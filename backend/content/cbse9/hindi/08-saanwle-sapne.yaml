# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 8
title: साँवले सपनों की याद
concepts:
- code: hin9c.k8.salim_ali
  title: साँवले सपनों की याद (जाबिर हुसैन)
  notes: |
    जाबिर हुसैन का संस्मरण, प्रसिद्ध पक्षी-विज्ञानी सालिम अली की मृत्यु के बाद लिखा गया। सालिम अली 'बर्ड
    वॉचर' थे; उनकी अंतिम यात्रा को लेखक सपनों के सफ़र जैसा बताते हैं। बचपन में एयरगन से एक गौरैया (पीले
    कंठ वाली) के घायल होकर गिरने की घटना ने उन्हें पक्षियों की खोज की ओर मोड़ा; आत्मकथा 'फ़ॉल ऑफ़ ए
    स्पैरो'। वे प्रकृति को उसी रूप में देखना चाहते थे जैसी वह है। केरल की 'साइलेंट वैली' को बचाने के लिए
    उन्होंने प्रधानमंत्री चौधरी चरण सिंह से बात की, जिनकी आँखें नम हो गईं। पत्नी तहमीना ने उनका साथ दिया।
    लेखक वृंदावन और कृष्ण की बाँसुरी की यादें भी जोड़ते हैं, और डी.एच. लॉरेंस का उल्लेख करते हैं।
  explanations:
    text: यह पाठ पक्षी-प्रेमी सालिम अली की याद में लिखा गया है। बचपन में एक घायल गौरैया को देखकर उनका जीवन पक्षियों की खोज में लग गया। वे जीवन भर प्रकृति को समझते और बचाते रहे, यहाँ तक कि केरल की साइलेंट वैली के लिए प्रधानमंत्री से भी मिले।
    visual: एक दूरबीन लिए बूढ़े व्यक्ति को जंगल में पेड़ों के बीच पक्षी देखते हुए सोचिए। पीछे एक छोटा लड़का एयरगन लिए है और नीचे एक घायल गौरैया गिरी है। फिर नक्शे पर केरल की हरी 'साइलेंट वैली'।
    step_by_step: 1. सालिम अली की मृत्यु और 'सपनों का सफ़र'। 2. बचपन की गौरैया वाली घटना। 3. 'बर्ड वॉचर' का जीवन, प्रकृति को सहज रूप में देखना। 4. साइलेंट वैली और चौधरी चरण सिंह। 5. पत्नी तहमीना और लेखक की श्रद्धांजलि।
    real_world: आज भी कई पक्षी-प्रेमी सुबह-सुबह दूरबीन लेकर झीलों और जंगलों में पक्षियों की गिनती करते हैं। सालिम अली इस काम के भारत में अग्रणी थे।
  picture:
    kind: flow
    steps:
    - 'बचपन: एयरगन से घायल गौरैया गिरती है'
    - पक्षियों को समझने की लगन जागती है
    - जीवन भर 'बर्ड वॉचर' बनकर पक्षियों की खोज
    - केरल की साइलेंट वैली बचाने के लिए प्रधानमंत्री से बात
    - 'मृत्यु के बाद लेखक की श्रद्धांजलि: ''साँवले सपनों की याद'''
    alt: 'सालिम अली का जीवन क्रम से: बचपन की गौरैया वाली घटना, पक्षियों की खोज, साइलेंट वैली को बचाने का प्रयास, और लेखक की श्रद्धांजलि।'
  items:
  - prompt: '''साँवले सपनों की याद'' के लेखक कौन हैं?'
    options:
    - जाबिर हुसैन
    - श्यामाचरण दुबे
    - प्रेमचंद
    - महादेवी वर्मा
    answer: जाबिर हुसैन
    difficulty: 1
    hints:
    - उन्होंने सालिम अली को याद किया है।
    - बिहार के लेखक और राजनेता।
    solution: जाबिर हुसैन।
    mistakes:
      महादेवी वर्मा: hcbse_author
  - prompt: यह पाठ किसकी याद में लिखा गया है?
    options:
    - सालिम अली
    - चौधरी चरण सिंह
    - डी.एच. लॉरेंस
    - राहुल सांकृत्यायन
    answer: सालिम अली
    difficulty: 1
    hints:
    - एक प्रसिद्ध पक्षी-विज्ञानी।
    - '''बर्ड वॉचर''।'
    solution: प्रसिद्ध पक्षी-विज्ञानी सालिम अली की याद में।
    mistakes:
      चौधरी चरण सिंह: hcbse_read_again
  - prompt: किस घटना ने सालिम अली को पक्षियों की ओर मोड़ा?
    options:
    - बचपन में एयरगन से घायल हुई गौरैया
    - एक पुस्तक पढ़ना
    - चिड़ियाघर की सैर
    - शिक्षक की डाँट
    answer: बचपन में एयरगन से घायल हुई गौरैया
    difficulty: 1
    hints:
    - उनकी आत्मकथा का नाम इसी से है।
    - '''फ़ॉल ऑफ़ ए स्पैरो''।'
    solution: बचपन में एयरगन से एक गौरैया घायल होकर गिरी, और इस घटना ने उन्हें पक्षियों की खोज की ओर मोड़ दिया।
  - prompt: सालिम अली की आत्मकथा का नाम क्या है?
    options:
    - फ़ॉल ऑफ़ ए स्पैरो
    - माई चाइल्डहुड
    - विंग्स ऑफ़ फ़ायर
    - द बर्ड्स
    answer: फ़ॉल ऑफ़ ए स्पैरो
    difficulty: 2
    hints:
    - गौरैया का गिरना।
    - अंग्रेज़ी में 'sparrow'।
    solution: '''फ़ॉल ऑफ़ ए स्पैरो''।'
  - prompt: सालिम अली ने केरल की किस जगह को बचाने के लिए प्रधानमंत्री से बात की?
    options:
    - साइलेंट वैली
    - मुन्नार
    - कोवलम
    - पेरियार
    answer: साइलेंट वैली
    difficulty: 2
    hints:
    - एक घाटी।
    - '''शांत घाटी''।'
    solution: केरल की साइलेंट वैली को पर्यावरण के ख़तरे से बचाने के लिए।
  - prompt: '''साँवले सपनों की याद'' शीर्षक से लेखक क्या कहना चाहते हैं?'
    options:
    - सालिम अली की मधुर, सपनों-सी यादें जो अब बस याद बनकर रह गईं
    - रात में आने वाले डरावने सपने
    - पक्षियों का रंग साँवला होना
    - वृंदावन की यात्रा का वर्णन
    answer: सालिम अली की मधुर, सपनों-सी यादें जो अब बस याद बनकर रह गईं
    difficulty: 3
    hints:
    - '''साँवले'' में करुणा और कोमलता है।'
    - उनकी मृत्यु के बाद लिखा गया।
    solution: सालिम अली के साथ जुड़ी कोमल, सपनों जैसी यादें, जो उनकी मृत्यु के बाद याद भर रह गई हैं।
    mistakes:
      रात में आने वाले डरावने सपने: hcbse_poem_meaning
