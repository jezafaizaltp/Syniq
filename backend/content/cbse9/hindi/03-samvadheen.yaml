subject: cbse9-hin
chapter: 3
title: संवादहीन
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_tai_akeli: "ताई का परिवार था, पर सब कहीं और चले गए। बेटे-बहू और बेटियाँ कहाँ गए? पाठ में देखें।"
  h9g_akelapan: सोचो कि ताई के परिवार के लोग कहाँ चले गए, और घर में कौन बचा।
  h9g_shirshak: 'शीर्षक के शब्द को तोड़कर देखो: ''संवाद'' और ''हीन''। कहानी के अंत में क्या नहीं लौटता?'
  h9g_nakal: सोचो कि क्या कोई दूसरा, बिल्कुल वैसा दिखने वाला, पुराने साथी की जगह ले सकता है।
concepts:
- code: hin9g.c3.samvadheen
  title: संवादहीन (शेखर जोशी)
  notes: |
    शेखर जोशी की कहानी। गाँव में ताई अपने बड़े पुश्तैनी घर में अकेली रह गई हैं: बेटे-बहू शहरों में बस गए,
    बेटियाँ ससुराल चली गईं, खेती-कारोबार छूटने से नौकर भी नहीं रहे। गणपत उनके लिए एक पहाड़ी तोता लाता
    है, जिसका नाम मिट्ठू पड़ता है। तोते की मीठी बोली से घर में फिर रौनक और बातचीत लौट आती है; ताई उसे
    खिलाती, उससे बात करती और नोक-झोंक करती हैं, पड़ोस की बहू-बेटियाँ भी उसे सुनने आती हैं। कुंभ-स्नान
    जाते समय ताई मिट्ठू को जगन मास्टर के घर छोड़ जाती हैं। पिंजरे में बंद तोते को देखकर मास्टर जी
    दुखी होते हैं और उसे कुछ देर खुला छोड़ते हैं; एक दिन वह रोशनदान से उड़ जाता है। गणपत ताई को दुख से
    बचाने के लिए वैसा ही दूसरा तोता ले आता है, पर लौटने पर ताई को वह तोता पहचान से जवाब नहीं देता; ताई
    पुकारती रह जाती हैं और संवाद नहीं लौटता। विषय: बुढ़ापे का अकेलापन, पलायन, आत्मीयता की जगह कोई
    नकल नहीं ले सकती, स्वतंत्रता और बंधन।
  explanations:
    text: 'ताई का भरा-पूरा घर खाली हो गया है। एक बोलने वाला तोता, मिट्ठू, उनका साथी बनकर उनके जीवन में फिर बातचीत लौटा देता है। जब तोता उड़ जाता है और उसकी जगह दूसरा तोता लाया जाता है, तो ताई समझ जाती हैं कि अपनापन बदला नहीं जा सकता: घर फिर संवादहीन हो जाता है।'
    visual: एक बड़ा सूना आँगन, बीच में पिंजरा। पहले चित्र में ताई तोते से हँसकर बात कर रही हैं। दूसरे में रोशनदान से उड़ता तोता। तीसरे में ताई नए तोते को पुकार रही हैं, पर तोता चुप है।
    step_by_step: 'चरण 1: ताई का अकेलापन। चरण 2: गणपत तोता लाता है। चरण 3: मिट्ठू से घर में रौनक। चरण 4: ताई कुंभ जाती हैं, तोता जगन मास्टर के घर। चरण 5: तोता उड़ जाता है। चरण 6: दूसरा तोता, पर संवाद नहीं लौटता।'
    real_world: आज कई गाँवों में बच्चे नौकरी के लिए शहर या विदेश चले जाते हैं और बुज़ुर्ग माता-पिता अकेले रह जाते हैं; उनसे नियमित बात करना उनके लिए बहुत मायने रखता है।
  activity:
    type: order
    prompt: ताई की कहानी क्रम से लगाओ।
    steps:
    - बच्चे शहर-ससुराल चले गए, ताई अकेली
    - गणपत एक पहाड़ी तोता लाता है
    - घर में फिर रौनक और बातचीत लौटती है
    - कुंभ जाते समय तोता जगन मास्टर के घर
    - तोता रोशनदान से उड़ जाता है
    - गणपत वैसा ही दूसरा तोता लाता है
    - ताई पुकारती हैं, पर तोता जवाब नहीं देता
    reasons:
      गणपत एक पहाड़ी तोता लाता है: तोता ताई के अकेलेपन को दूर करने के लिए आया।
      घर में फिर रौनक और बातचीत लौटती है: तोते की मीठी बोली से ही घर बोलने लगा।
      कुंभ जाते समय तोता जगन मास्टर के घर: 'ताई तोते को छोड़कर गईं: तोता पहले से उनके पास था।'
      तोता रोशनदान से उड़ जाता है: 'मास्टर जी ने उसे खुला छोड़ा, तभी वह उड़ सका: उनके घर पहुँचने के बाद।'
      गणपत वैसा ही दूसरा तोता लाता है: पहला तोता उड़ गया, इसलिए दूसरा लाना पड़ा।
      ताई पुकारती हैं, पर तोता जवाब नहीं देता: कुंभ से लौटकर ताई नए तोते से मिलती हैं।
  lesson:
    - teach: शेखर जोशी की कहानी 'संवादहीन' में गाँव की ताई अपने बड़े पुश्तैनी घर में अकेली रह गई हैं। बेटे-बहू शहरों में बस गए, बेटियाँ ससुराल चली गईं, और खेती-कारोबार छूटने से नौकर भी नहीं रहे। गणपत उनके लिए एक पहाड़ी तोता लाता है, जिसका नाम मिट्ठू पड़ता है।
      check:
        prompt: ताई अकेली क्यों रह गई थीं?
        options:
        - बच्चे शहर और ससुराल चले गए
        - वे शहर में रहती थीं
        - उन्होंने सबको निकाल दिया
        answer: बच्चे शहर और ससुराल चले गए
        why: पलायन ने घर सूना कर दिया।
    - teach: मिट्ठू की मीठी बोली से घर में फिर रौनक और बातचीत लौट आती है। ताई उसे खिलाती हैं, उससे बात करती हैं, नोक-झोंक करती हैं; पड़ोस की बहू-बेटियाँ भी उसे सुनने आती हैं। कुंभ-स्नान जाते समय ताई मिट्ठू को जगन मास्टर के घर छोड़ जाती हैं। पिंजरे में बंद तोते को देखकर मास्टर जी दुखी होते हैं और उसे कुछ देर खुला छोड़ते हैं; एक दिन वह रोशनदान से उड़ जाता है।
      picture:
        kind: flow
        steps:
        - ताई अकेली
        - गणपत तोता लाता है
        - घर में रौनक
        - मास्टर जी के घर
        - मिट्ठू उड़ जाता है
        - नया तोता, पर संवाद नहीं
        alt: 'कहानी का क्रम: अकेली ताई, तोते का आना, रौनक, मास्टर जी के घर, तोते का उड़ना, नया तोता पर बातचीत नहीं।'
      check:
        prompt: मिट्ठू कहाँ से उड़ा?
        options:
        - जगन मास्टर के घर से
        - ताई के घर से
        - कुंभ मेले से
        answer: जगन मास्टर के घर से
        why: खुला छोड़ने पर वह रोशनदान से उड़ गया।
    - teach: 'गणपत ताई को दुख से बचाने के लिए वैसा ही दूसरा तोता ले आता है। पर लौटने पर वह तोता ताई की पुकार पर पहचान से जवाब नहीं देता; ताई पुकारती रह जाती हैं और संवाद नहीं लौटता। विषय: बुढ़ापे का अकेलापन, पलायन, आत्मीयता की जगह कोई नकल नहीं ले सकती, और स्वतंत्रता बनाम बंधन।'
      check:
        prompt: नया तोता ताई की कमी क्यों नहीं भर पाया?
        options:
        - उससे आत्मीय रिश्ता नहीं था
        - वह बहुत बड़ा था
        - वह उड़ नहीं सकता था
        answer: उससे आत्मीय रिश्ता नहीं था
        why: अपनापन नकल से नहीं आता।
  items:
  - prompt: '''संवादहीन'' कहानी के लेखक कौन हैं?'
    options:
    - शेखर जोशी
    - मोहन राकेश
    - जगदीशचंद्र माथुर
    - यतीन्द्र मिश्र
    answer: शेखर जोशी
    difficulty: 1
    hints:
    - पहाड़ी जीवन के कहानीकार।
    - '''कोसी का घटवार'' भी इन्हीं की कहानी है।'
    solution: 'चरण 1: यह एक कहानी है। चरण 2: इसके लेखक शेखर जोशी हैं।'
    mistakes:
      मोहन राकेश: hin9g_author
  - prompt: ताई के तोते का नाम क्या था?
    options:
    - मिट्ठू
    - गंगाराम
    - हीरा
    - मोती
    answer: मिट्ठू
    difficulty: 1
    hints:
    - तोतों का एक जाना-पहचाना प्यारा नाम।
    - हीरा-मोती तो बैल थे।
    solution: 'चरण 1: गणपत पहाड़ी तोता लाया। चरण 2: उसका नाम मिट्ठू था।'
    mistakes:
      गंगाराम: hin9g_read_again
      हीरा: hin9g_read_again
  - prompt: ताई के लिए तोता कौन लाया था?
    options:
    - गणपत
    - जगन मास्टर
    - ताई का बेटा
    - पड़ोस की बहू
    answer: गणपत
    difficulty: 1
    hints:
    - वही बाद में दूसरा तोता भी लाता है।
    - मास्टर जी नहीं।
    solution: 'चरण 1: तोता ताई का अकेलापन दूर करने के लिए आया। चरण 2: उसे गणपत लाया था।'
    mistakes:
      जगन मास्टर: hin9g_read_again
  - prompt: ताई घर में अकेली क्यों रह गई थीं?
    options:
    - बेटे-बहू शहर में बस गए और बेटियाँ ससुराल चली गईं
    - उन्होंने सबको घर से निकाल दिया
    - वे शहर में रहती थीं
    - उनका कोई परिवार नहीं था
    answer: बेटे-बहू शहर में बस गए और बेटियाँ ससुराल चली गईं
    difficulty: 2
    hints:
    - पलायन।
    - परिवार बिखर गया।
    solution: 'चरण 1: बेटे-बहू रोज़गार के लिए शहर चले गए। चरण 2: बेटियाँ ब्याहकर अपने घर गईं। ताई अकेली रह गईं।'
    mistakes: {"उनका कोई परिवार नहीं था": "h9_tai_akeli"}
  - prompt: मिट्ठू कैसे उड़ गया?
    options:
    - जगन मास्टर के घर पर खुला छोड़ने पर वह रोशनदान से उड़ गया
    - ताई ने उसे उड़ा दिया
    - बिल्ली ने पिंजरा खोल दिया
    - गणपत उसे बेच आया
    answer: जगन मास्टर के घर पर खुला छोड़ने पर वह रोशनदान से उड़ गया
    difficulty: 2
    hints:
    - ताई कुंभ-स्नान गई थीं।
    - मास्टर जी को बंद तोता देखकर दुख होता था।
    solution: 'चरण 1: ताई के जाने पर तोता जगन मास्टर के घर था। चरण 2: मास्टर जी उसे कुछ देर खुला छोड़ते थे; एक दिन वह रोशनदान से उड़ गया।'
    mistakes:
      ताई ने उसे उड़ा दिया: hin9g_read_again
  - prompt: कहानी का शीर्षक 'संवादहीन' क्यों उचित है?
    options:
    - ताई का जीवन बातचीत के बिना सूना है और नकली तोता संवाद नहीं लौटा पाता
    - कहानी में कोई पात्र बोलता ही नहीं
    - तोता गूँगा था
    - कहानी केवल चित्रों में है
    answer: ताई का जीवन बातचीत के बिना सूना है और नकली तोता संवाद नहीं लौटा पाता
    difficulty: 3
    hints:
    - संवाद = बातचीत।
    - अंत में ताई पुकारती रह जाती हैं।
    solution: 'चरण 1: ताई का दुख बातचीत की कमी है। चरण 2: मिट्ठू ने संवाद लौटाया, पर उसकी जगह आया तोता नहीं; इसलिए शीर्षक ''संवादहीन'' है।'
    mistakes:
      कहानी में कोई पात्र बोलता ही नहीं: hin9g_poem_meaning
  - prompt: ताई कुंभ-स्नान जाते समय मिट्ठू को किसके घर छोड़ गईं?
    options:
    - जगन मास्टर
    - गणपत
    - अपनी बेटी
    - पड़ोस की बहू
    answer: जगन मास्टर
    difficulty: 1
    hints:
    - वे पढ़ाने वाले थे।
    - उन्हें पिंजरा देखकर दुख हुआ।
    solution: ताई मिट्ठू को जगन मास्टर के घर छोड़ गई थीं।
    mistakes:
      गणपत: h9g_patra
  - prompt: तोता आने के बाद ताई के घर में क्या बदलाव आया?
    options:
    - फिर से रौनक और बातचीत लौट आई
    - घर और सूना हो गया
    - ताई शहर चली गईं
    - पड़ोसी नाराज़ हो गए
    answer: फिर से रौनक और बातचीत लौट आई
    difficulty: 1
    hints:
    - तोता बोलता था।
    - पड़ोस की बहू-बेटियाँ भी आने लगीं।
    solution: मिट्ठू की बोली से घर में फिर चहल-पहल और बातचीत लौट आई।
    mistakes:
      घर और सूना हो गया: h9g_akelapan
  - prompt: '''संवादहीन'' शब्द का अर्थ है…'
    options:
    - बातचीत से रहित
    - बहुत बातें करने वाला
    - गाने वाला
