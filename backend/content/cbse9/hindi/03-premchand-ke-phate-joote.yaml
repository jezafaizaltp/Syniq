# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 3
title: प्रेमचंद के फटे जूते

tips:
  hcbse_tila: "'टीला' समाज की कुरीतियों और बाधाओं का प्रतीक है, जिन पर प्रेमचंद जीवन भर ठोकर मारते रहे।"

concepts:
  - code: hin9c.k3.joote
    title: प्रेमचंद के फटे जूते (हरिशंकर परसाई)
    notes: |
      हरिशंकर परसाई का व्यंग्य निबंध। लेखक प्रेमचंद और उनकी पत्नी की एक फ़ोटो देखते हैं: प्रेमचंद धोती-कुरता
      और टोपी पहने, कनपटी चिपकी, मूँछें; पैरों में केनवस के जूते, बाएँ जूते में बड़ा छेद, जिससे अँगुली बाहर
      निकली है। फिर भी चेहरे पर बेपरवाही और व्यंग्य भरी मुसकान। लेखक सोचते हैं: लोग इत्र लगाकर फ़ोटो
      खिंचाते हैं, उधार के कपड़े पहनते हैं; प्रेमचंद ने दिखावा नहीं किया। जूता टोपी से महँगा; अनेक टोपियाँ
      जूतों पर न्योछावर। लेखक का अपना जूता ऊपर से ठीक है पर तला घिस गया है, अँगूठा ज़मीन से रगड़ता है:
      वह परदा रखता है। प्रेमचंद ने किसी 'टीले' (समाज की कुरीतियों, बाधाओं) पर ठोकर मारी होगी, उससे बचकर
      नहीं निकले। अँगुली का इशारा उन लोगों की ओर जो टीले से बचकर निकल जाते हैं। विषय: सादगी, दिखावे पर
      व्यंग्य, संघर्ष।
    explanations:
      text: "परसाई जी प्रेमचंद की एक पुरानी फ़ोटो देखते हैं जिसमें उनका जूता फटा हुआ है और अँगुली बाहर दिख रही है। फिर भी प्रेमचंद मुसकरा रहे हैं, उन्हें दिखावे की कोई परवाह नहीं। लेखक व्यंग्य करते हैं कि आज लोग फ़ोटो के लिए उधार के कपड़े पहन लेते हैं। फटा जूता बताता है कि प्रेमचंद समाज की बुराइयों से टकराते रहे, उनसे बचकर नहीं निकले।"
      visual: "एक पुरानी फ़ोटो की कल्पना कीजिए: धोती-कुरता, टोपी, मूँछें, और बाएँ केनवस के जूते से झाँकती अँगुली। उसके पास लेखक का जूता: ऊपर से चमकदार, नीचे तला घिसा हुआ।"
      step_by_step: "1. फ़ोटो का वर्णन: सादे कपड़े, फटा जूता। 2. चेहरे की मुसकान और बेपरवाही। 3. दिखावा करने वालों पर व्यंग्य। 4. लेखक का अपना जूता: परदा। 5. 'टीले' पर ठोकर: कुरीतियों से संघर्ष। 6. अँगुली का इशारा: बचकर निकलने वालों पर व्यंग्य।"
      real_world: "सोशल मीडिया पर लोग अक्सर अपनी असली ज़िंदगी से अलग, चमकदार तस्वीरें डालते हैं। प्रेमचंद की तरह सादा और सच्चा रहना कठिन पर सम्मान योग्य है।"
    items:
      - prompt: "'प्रेमचंद के फटे जूते' के लेखक कौन हैं?"
        options: ["हरिशंकर परसाई", "प्रेमचंद", "महादेवी वर्मा", "राहुल सांकृत्यायन"]
        answer: "हरिशंकर परसाई"
        difficulty: 1
        hints: ["हिंदी के प्रसिद्ध व्यंग्यकार।", "पाठ प्रेमचंद के बारे में है, उनका लिखा नहीं।"]
        solution: "हरिशंकर परसाई।"
        mistakes: {"प्रेमचंद": hcbse_author}
      - prompt: "फ़ोटो में प्रेमचंद के साथ कौन हैं?"
        options: ["उनकी पत्नी", "उनका बेटा", "हरिशंकर परसाई", "कोई नहीं"]
        answer: "उनकी पत्नी"
        difficulty: 1
        hints: ["पाठ के आरंभ में।", "पति-पत्नी की फ़ोटो।"]
        solution: "फ़ोटो में प्रेमचंद अपनी पत्नी के साथ हैं।"
      - prompt: "प्रेमचंद के किस जूते में छेद था?"
        options: ["बाएँ जूते में", "दाएँ जूते में", "दोनों में", "किसी में नहीं"]
        answer: "बाएँ जूते में"
        difficulty: 2
        hints: ["उससे अँगुली बाहर निकली थी।", "बायाँ।"]
        solution: "बाएँ जूते में बड़ा छेद था, जिससे अँगुली बाहर निकली थी।"
      - prompt: "यह पाठ किस विधा का है?"
        options: ["व्यंग्य निबंध", "कहानी", "कविता", "यात्रा-वृत्तांत"]
        answer: "व्यंग्य निबंध"
        difficulty: 1
        hints: ["परसाई इसी के लिए प्रसिद्ध हैं।", "हँसी के साथ चोट।"]
        solution: "यह एक व्यंग्य निबंध है।"
      - prompt: "पाठ में 'टीला' किसका प्रतीक है?"
        options: ["समाज की कुरीतियाँ और बाधाएँ", "एक पहाड़", "प्रेमचंद का घर", "जूते की दुकान"]
        answer: "समाज की कुरीतियाँ और बाधाएँ"
        difficulty: 2
        hints: ["प्रेमचंद उस पर ठोकर मारते रहे।", "प्रतीक है, असली टीला नहीं।"]
        solution: "टीला समाज की बुराइयों और बाधाओं का प्रतीक है।"
        mistakes: {"एक पहाड़": hcbse_tila}
      - prompt: "लेखक के अपने जूते की क्या हालत थी?"
        options: ["ऊपर से ठीक, पर तला घिसा हुआ", "पूरी तरह नया", "बाएँ में छेद", "जूता था ही नहीं"]
        answer: "ऊपर से ठीक, पर तला घिसा हुआ"
        difficulty: 3
        hints: ["दिखावे पर व्यंग्य।", "अँगूठा नीचे ज़मीन से रगड़ता था।"]
        solution: "लेखक का जूता ऊपर से ठीक था पर तला घिस गया था: वह परदा रखता था।"
