# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 12
title: ग्राम श्री
concepts:
- code: hin9c.k12.gram_shri
  title: ग्राम श्री (सुमित्रानंदन पंत)
  notes: |
    सुमित्रानंदन पंत, 'प्रकृति के सुकुमार कवि', छायावाद के प्रमुख कवि। कविता में सर्दियों के अंत में गाँव की
    हरियाली और सुंदरता का चित्र: 'फैली खेतों में दूर तलक मखमल की कोमल हरियाली'; धूप में चाँदी-सी चमकती
    हरियाली, नीला आकाश। फ़सलें: जौ-गेहूँ की बालियाँ, अरहर-सनई की सोने की किंकिणियाँ, पीली सरसों, अलसी, मटर।
    आम के पेड़ों पर बौर, कटहल, जामुन, अमरूद, बेर, आड़ू, नारंगी; आलू, गोभी, बैंगन, टमाटर। गंगा तट पर
    'बालू के साँपों से अंकित गंगा की सतरंगी रेती'; पक्षी: बगुले, मगरौठी। गाँव 'मरकत डिब्बे-सा खुला ग्राम'।
  explanations:
    text: 'पंत जी सर्दियों के बाद के गाँव का सुंदर चित्र बनाते हैं: दूर तक मखमल जैसी हरी फ़सलें, पीली सरसों, अरहर और सनई, आम के बौर, तरह-तरह के फल-सब्ज़ियाँ, और गंगा किनारे सात रंगों से चमकती रेत। पूरा गाँव पन्ने (मरकत) के खुले डिब्बे जैसा लगता है।'
    visual: एक बड़ा हरा खेत बनाइए, बीच-बीच में पीली सरसों की पट्टियाँ, दूर आम के पेड़ों पर बौर, और नीचे गंगा का किनारा जहाँ रेत पर लहरों के साँप-जैसे निशान हों और बगुले खड़े हों।
    step_by_step: '1. कवि का परिचय: प्रकृति के सुकुमार कवि। 2. खेतों की मखमली हरियाली और धूप। 3. फ़सलें: जौ, गेहूँ, अरहर, सनई, सरसों, मटर। 4. पेड़, फल और सब्ज़ियाँ। 5. गंगा तट की रेत और पक्षी; ''मरकत डिब्बे-सा'' गाँव।'
    real_world: सर्दियों के बाद पंजाब या उत्तर प्रदेश के गाँवों में सरसों के पीले फूलों के खेत आज भी ऐसे ही दिखते हैं, जैसे कविता में।
  picture:
    kind: compare
    columns:
    - title: खेत
      points:
      - मखमल-सी हरियाली
      - जौ-गेहूँ की बालियाँ
      - अरहर, सनई, पीली सरसों, मटर
    - title: पेड़ और बाग़
      points:
      - आम के पेड़ों पर बौर
      - कटहल, जामुन, अमरूद, बेर
      - आलू, गोभी, बैंगन, टमाटर
    - title: गंगा तट
      points:
      - बालू के 'साँपों' से अंकित रेत
      - सतरंगी चमकती रेती
      - बगुले और मगरौठी
    alt: 'तीन स्तंभों में गाँव की सुंदरता: खेतों में हरियाली, जौ-गेहूँ और सरसों; पेड़ों पर आम के बौर और कई फल-सब्ज़ियाँ; और गंगा तट की सतरंगी रेत और पक्षी।'
  items:
  - prompt: '''ग्राम श्री'' के कवि कौन हैं?'
    options:
    - सुमित्रानंदन पंत
    - माखनलाल चतुर्वेदी
    - सर्वेश्वर दयाल सक्सेना
    - रसखान
    answer: सुमित्रानंदन पंत
    difficulty: 1
    hints:
    - '''प्रकृति के सुकुमार कवि''।'
    - छायावाद के कवि।
    solution: सुमित्रानंदन पंत।
    mistakes:
      सर्वेश्वर दयाल सक्सेना: hcbse_author
  - prompt: कवि ने खेतों की हरियाली की तुलना किससे की है?
    options:
    - मखमल से
    - रेशम की रस्सी से
    - समुद्र से
    - बादलों से
    answer: मखमल से
    difficulty: 1
    hints:
    - '''मखमल की कोमल हरियाली''।'
    - मुलायम कपड़ा।
    solution: मखमल की कोमल हरियाली से।
  - prompt: कविता में किस ऋतु के बाद के गाँव का वर्णन है?
    options:
    - सर्दियों के अंत में
    - भरी बरसात में
    - तपती गर्मी में
    - पतझड़ में
    answer: सर्दियों के अंत में
    difficulty: 2
    hints:
    - सरसों फूली है, आम पर बौर।
    - वसंत आने वाला है।
    solution: सर्दियों के अंत, वसंत के आगमन का समय।
  - prompt: कवि ने गाँव की तुलना किससे की है?
    options:
    - मरकत (पन्ने) के खुले डिब्बे से
    - सोने के महल से
    - चाँदी की थाली से
    - कोयले की खान से
    answer: मरकत (पन्ने) के खुले डिब्बे से
    difficulty: 2
    hints:
    - मरकत हरे रंग का रत्न है।
    - '''मरकत डिब्बे-सा खुला ग्राम''।'
    solution: हरे-भरे गाँव को मरकत (पन्ना रत्न) के खुले डिब्बे जैसा बताया है।
    mistakes:
      सोने के महल से: hcbse_poem_meaning
  - prompt: गंगा की रेत पर 'साँप' किसे कहा गया है?
    options:
    - लहरों से बने टेढ़े-मेढ़े निशान
    - असली साँप
    - नावों की रस्सियाँ
    - पेड़ों की जड़ें
    answer: लहरों से बने टेढ़े-मेढ़े निशान
    difficulty: 3
    hints:
    - '''बालू के साँपों से अंकित''।'
    - पानी के उतरने पर रेत पर बनी रेखाएँ।
    solution: लहरों के कारण रेत पर बने टेढ़े-मेढ़े निशान साँपों जैसे दिखते हैं।
    mistakes:
      असली साँप: hcbse_poem_meaning
  - prompt: कविता में सरसों का रंग कैसा बताया गया है?
    options:
    - पीला
    - नीला
    - लाल
    - बैंगनी
    answer: पीला
    difficulty: 1
    hints:
    - उसके फूल धूप जैसे।
    - '''पीली-पीली सरसों''।'
    solution: पीली सरसों फूली है।
