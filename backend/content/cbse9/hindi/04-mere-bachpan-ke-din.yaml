# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 4
title: मेरे बचपन के दिन

tips:
  hcbse_subhadra: "छात्रावास में महादेवी की कमरे की साथी (सीनियर) सुभद्रा कुमारी चौहान थीं, जो तब भी कविता लिखती थीं।"

concepts:
  - code: hin9c.k4.bachpan
    title: मेरे बचपन के दिन (महादेवी वर्मा)
    notes: |
      महादेवी वर्मा का संस्मरण। उनके परिवार में लगभग 200 वर्षों तक कोई लड़की नहीं हुई थी (लड़कियों को
      मार दिया जाता था); बाबा ने दुर्गा-पूजा की, इसलिए उनका स्वागत हुआ, पढ़ाई का अवसर मिला। पहले
      मिशन स्कूल, फिर इलाहाबाद के क्रास्थवेट गर्ल्स कॉलेज। छात्रावास में सुभद्रा कुमारी चौहान उनकी सीनियर
      और कमरे की साथी, जिन्होंने उनकी छिपी कविताएँ पकड़ लीं। कवि सम्मेलनों में पुरस्कार; एक बार चाँदी का
      कटोरा मिला, जिसे उन्होंने गांधी जी को दे दिया (आनंद भवन)। छात्रावास में अलग-अलग भाषा और धर्म की
      लड़कियाँ साथ रहतीं। जवारा के नवाब का परिवार पड़ोसी; बेगम (ताई) ने भाई का नाम मनमोहन रखा; राखी,
      त्योहार साथ मनाते। संदेश: सांप्रदायिक सौहार्द और स्त्री-शिक्षा।
    explanations:
      text: "महादेवी वर्मा अपने बचपन को याद करती हैं। उनके परिवार में लगभग 200 साल बाद लड़की पैदा हुई थी, इसलिए उनका बहुत स्वागत हुआ और उन्हें पढ़ने का मौक़ा मिला। इलाहाबाद के क्रास्थवेट कॉलेज के छात्रावास में उनकी दोस्ती सुभद्रा कुमारी चौहान से हुई, और दोनों कविता लिखने लगीं। पड़ोस के नवाब परिवार से गहरा प्रेम था: वह समय हिंदू-मुसलमान मेल-जोल का था।"
      visual: "तीन चित्र: 1. एक घर जहाँ बच्ची के जन्म पर उत्सव है। 2. छात्रावास का कमरा, दो लड़कियाँ कविता लिख रही हैं। 3. पड़ोस की बेगम, एक छोटे बच्चे को गोद में लिए, राखी का त्योहार।"
      step_by_step: "1. 200 वर्ष बाद बेटी का जन्म। 2. पढ़ाई: मिशन स्कूल, फिर क्रास्थवेट कॉलेज। 3. सुभद्रा कुमारी चौहान से मित्रता, कविता। 4. कवि सम्मेलन और चाँदी का कटोरा, गांधी जी को भेंट। 5. नवाब परिवार से प्रेम, भाई का नाम मनमोहन।"
      real_world: "आज भी 'बेटी बचाओ, बेटी पढ़ाओ' जैसे अभियान वही बात कहते हैं जो महादेवी के अनुभव से दिखती है: बेटियों को जन्म और शिक्षा का पूरा अधिकार है।"
    items:
      - prompt: "'मेरे बचपन के दिन' की लेखिका कौन हैं?"
        options: ["महादेवी वर्मा", "सुभद्रा कुमारी चौहान", "प्रेमचंद", "राहुल सांकृत्यायन"]
        answer: "महादेवी वर्मा"
        difficulty: 1
        hints: ["छायावाद की प्रमुख कवयित्री।", "सुभद्रा उनकी सहेली थीं।"]
        solution: "महादेवी वर्मा।"
        mistakes: {"सुभद्रा कुमारी चौहान": hcbse_author}
      - prompt: "महादेवी के परिवार में लगभग कितने वर्षों तक कोई लड़की पैदा नहीं हुई थी?"
        answer: "200"
        check: "200"
        difficulty: 1
        hints: ["दो सौ।", "पाठ के आरंभ में।"]
        solution: "लगभग 200 वर्षों तक।"
      - prompt: "छात्रावास में महादेवी की कमरे की साथी कौन थीं?"
        options: ["सुभद्रा कुमारी चौहान", "ज़ेबुन्निसा", "बेगम ताई", "सरोजिनी नायडू"]
        answer: "सुभद्रा कुमारी चौहान"
        difficulty: 1
        hints: ["'झाँसी की रानी' कविता की कवयित्री।", "वे सीनियर थीं।"]
        solution: "सुभद्रा कुमारी चौहान।"
        mistakes: {"ज़ेबुन्निसा": hcbse_subhadra}
      - prompt: "महादेवी किस कॉलेज में पढ़ीं?"
        options: ["क्रास्थवेट गर्ल्स कॉलेज, इलाहाबाद", "मिशन कॉलेज, दिल्ली", "शांतिनिकेतन", "बनारस हिंदू विश्वविद्यालय"]
        answer: "क्रास्थवेट गर्ल्स कॉलेज, इलाहाबाद"
        difficulty: 2
        hints: ["इलाहाबाद में।", "अंग्रेज़ी नाम वाला कॉलेज।"]
        solution: "क्रास्थवेट गर्ल्स कॉलेज, इलाहाबाद।"
      - prompt: "कवि सम्मेलन में मिला चाँदी का कटोरा महादेवी ने किसे दे दिया?"
        options: ["गांधी जी को", "सुभद्रा को", "अपनी माँ को", "बेगम ताई को"]
        answer: "गांधी जी को"
        difficulty: 2
        hints: ["आनंद भवन में।", "स्वतंत्रता आंदोलन के नेता।"]
        solution: "उन्होंने वह कटोरा गांधी जी को दे दिया।"
      - prompt: "नवाब परिवार की बेगम (ताई) ने महादेवी के छोटे भाई का क्या नाम रखा?"
        options: ["मनमोहन", "मोहन", "मनोहर", "मुरली"]
        answer: "मनमोहन"
        difficulty: 3
        hints: ["बाद में वे प्रोफ़ेसर बने।", "मन + मोहन।"]
        solution: "बेगम ने भाई का नाम मनमोहन रखा: हिंदू-मुस्लिम प्रेम का उदाहरण।"
