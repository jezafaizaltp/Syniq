# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 13
title: बच्चे काम पर जा रहे हैं
concepts:
- code: hin9c.k13.bachche
  title: बच्चे काम पर जा रहे हैं (राजेश जोशी)
  notes: |
    राजेश जोशी की कविता, बाल-मज़दूरी पर। 'कोहरे से ढँकी सड़क पर बच्चे काम पर जा रहे हैं सुबह-सुबह' — कवि कहते
    हैं कि इसे विवरण की तरह नहीं, सवाल की तरह लिखा जाना चाहिए: 'काम पर क्यों जा रहे हैं बच्चे?' वे पूछते हैं:
    क्या अंतरिक्ष में गिर गई हैं सारी गेंदें? क्या दीमकों ने खा लिया है सारी रंग-बिरंगी किताबों को? क्या काले
    पहाड़ के नीचे दब गए हैं सारे खिलौने? क्या किसी भूकंप में ढह गई हैं सारे मदरसों की इमारतें? सब कुछ है,
    फिर भी बच्चे काम पर जा रहे हैं — यह 'हमारे समय की सबसे भयानक पंक्ति' है। समाज की संवेदनहीनता पर प्रश्न।
  explanations:
    text: 'कवि सुबह-सुबह कोहरे में बच्चों को खेलने या स्कूल जाने के बजाय काम पर जाते देखते हैं। वे पूछते हैं: क्या दुनिया की सारी गेंदें, किताबें, खिलौने और स्कूल ख़त्म हो गए? सब कुछ होते हुए भी बच्चों का काम पर जाना हमारे समय की सबसे भयानक बात है।'
    visual: कोहरे से ढँकी एक सड़क, जिस पर छोटे बच्चे थैले लिए चले जा रहे हैं। सड़क के एक तरफ़ एक स्कूल है जिसका दरवाज़ा खुला है, और एक मैदान में अकेली पड़ी गेंद।
    step_by_step: '1. दृश्य: कोहरे में सुबह-सुबह बच्चे काम पर। 2. इसे सवाल की तरह पूछना चाहिए। 3. कवि के प्रश्न: गेंदें, किताबें, खिलौने, मदरसे कहाँ गए? 4. सब कुछ है, फिर भी बच्चे काम पर। 5. ''हमारे समय की सबसे भयानक पंक्ति''।'
    real_world: भारत में 14 साल से कम उम्र के बच्चों से ख़तरनाक काम करवाना क़ानून के ख़िलाफ़ है, फिर भी ढाबों और दुकानों पर बच्चे काम करते दिखते हैं। कवि चाहते हैं कि हम इसे देखकर चुप न रहें।
  picture:
    kind: flow
    steps:
    - कोहरे से ढँकी सड़क पर सुबह-सुबह बच्चे काम पर जा रहे हैं
    - 'कवि: इसे सवाल की तरह पूछो, ''काम पर क्यों?'''
    - क्या सारी गेंदें, किताबें और खिलौने ख़त्म हो गए?
    - क्या सारे मदरसे भूकंप में ढह गए?
    - 'सब कुछ है, फिर भी बच्चे काम पर: सबसे भयानक बात'
    alt: 'कविता का क्रम: कोहरे में काम पर जाते बच्चे, कवि का प्रश्न, गेंदों, किताबों, खिलौनों और स्कूलों के बारे में सवाल, और यह निष्कर्ष कि सब कुछ होते हुए भी बच्चों का काम पर जाना सबसे भयानक है।'
  items:
  - prompt: '''बच्चे काम पर जा रहे हैं'' के कवि कौन हैं?'
    options:
    - राजेश जोशी
    - सुमित्रानंदन पंत
    - माखनलाल चतुर्वेदी
    - हरिशंकर परसाई
    answer: राजेश जोशी
    difficulty: 1
    hints:
    - समकालीन कवि।
    - नाम 'जोशी'।
    solution: राजेश जोशी।
    mistakes:
      हरिशंकर परसाई: hcbse_author
  - prompt: कविता किस सामाजिक समस्या पर है?
    options:
    - बाल-मज़दूरी
    - प्रदूषण
    - बेरोज़गारी
    - दहेज
    answer: बाल-मज़दूरी
    difficulty: 1
    hints:
    - बच्चे काम पर जा रहे हैं।
    - बचपन छिन रहा है।
    solution: बाल-मज़दूरी पर।
  - prompt: बच्चे किस समय काम पर जा रहे हैं?
    options:
    - सुबह-सुबह, कोहरे में
    - दोपहर में
    - रात में
    - शाम को
    answer: सुबह-सुबह, कोहरे में
    difficulty: 1
    hints:
    - सड़क कोहरे से ढँकी है।
    - दिन शुरू हो रहा है।
    solution: सुबह-सुबह कोहरे से ढँकी सड़क पर।
  - prompt: कवि के अनुसार इस बात को कैसे लिखा जाना चाहिए?
    options:
    - सवाल की तरह
    - एक विवरण की तरह
    - एक कहानी की तरह
    - एक विज्ञापन की तरह
    answer: सवाल की तरह
    difficulty: 2
    hints:
    - '''काम पर क्यों जा रहे हैं बच्चे?'''
    - समाज से पूछना है।
    solution: 'विवरण की तरह नहीं, सवाल की तरह: बच्चे काम पर क्यों जा रहे हैं?'
    mistakes:
      एक विवरण की तरह: hcbse_poem_meaning
  - prompt: '''क्या दीमकों ने खा लिया है सारी रंग-बिरंगी किताबों को'' से कवि क्या पूछ रहे हैं?'
    options:
    - बच्चों को पढ़ने का अवसर क्यों नहीं मिल रहा
    - दीमक कैसे भगाएँ
    - किताबें कहाँ मिलती हैं
    - किताबें किस रंग की हों
    answer: बच्चों को पढ़ने का अवसर क्यों नहीं मिल रहा
    difficulty: 2
    hints:
    - किताबें शिक्षा का प्रतीक हैं।
    - किताबें तो हैं, फिर?
    solution: किताबें मौजूद हैं, फिर भी बच्चे पढ़ने के बजाय काम पर क्यों हैं, यह सवाल है।
    mistakes:
      दीमक कैसे भगाएँ: hcbse_poem_meaning
  - prompt: कवि ने 'हमारे समय की सबसे भयानक पंक्ति' किसे कहा है?
    options:
    - बच्चे काम पर जा रहे हैं
    - कोहरे से ढँकी सड़क
    - मदरसे ढह गए
    - गेंदें अंतरिक्ष में गिर गईं
    answer: बच्चे काम पर जा रहे हैं
    difficulty: 3
    hints:
    - कविता का शीर्षक।
    - सब कुछ होते हुए भी जो हो रहा है।
    solution: '''बच्चे काम पर जा रहे हैं'' — क्योंकि सब कुछ होते हुए भी बच्चों का बचपन छिन रहा है।'
