# CBSE Class 9 Hindi (NCERT Ganga, 2026-27; replaces both Hindi A and Hindi B), chapter 8. Format: content/README.md.
# Written from published summaries of the new book and memory of the texts, not the printed copy. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse9-hin
chapter: 8
title: पद (रैदास)
tips:
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_deepak_baati: "तेल दीपक में भरा जाता है और खत्म हो जाता है। दीपक की लौ किस चीज़ के सहारे जलती है? भक्त वही बनना चाहता है।"
  h9_sant_naam: "रैदास अपने से पहले के संत-कवियों का नाम लेते हैं। तुलसी, सूर और मीरा बाद के कवि हैं।"
  h9g_jodi: पद की जोड़ियाँ याद करो। हर जोड़ी में प्रभु एक चीज़ हैं और भक्त उससे जुड़ी दूसरी चीज़। कौन किसके बिना अधूरा है?
  h9g_nirgun: सोचो कि यह कवि ईश्वर को किसी मूर्ति या रूप में देखता है, या बिना रूप के मन के भीतर?
  h9g_kripa: दूसरे पद में प्रभु किन लोगों को ऊँचा उठाते हैं? समाज जिन्हें नीचा समझता था, उनके बारे में सोचो।
concepts:
- code: hin9g.c8.raidas
  title: पद (रैदास)
  notes: |
    संत रैदास (रविदास) के दो पद, जो निर्गुण भक्ति के कवि थे। पहले पद "अब कैसे छूटै राम नाम रट लागी" में
    भक्त कहता है कि प्रभु के नाम की रट अब छूट नहीं सकती, और भक्त-भगवान के अटूट संबंध को उपमाओं से बताता
    है: प्रभु चंदन, हम पानी; प्रभु घन (बादल), हम बन के मोर; प्रभु चंद्रमा, हम चकोर; प्रभु दीपक, हम बाती;
    प्रभु मोती, हम धागा; प्रभु सोना, हम सुहागा; प्रभु स्वामी, हम दास। दूसरे पद "ऐसी लाल तुझ बिनु कउनु करै"
    में वे प्रभु को 'गरीब निवाजु' कहते हैं, जो नीच समझे जाने वालों को भी ऊँचा कर देते हैं और किसी से नहीं
    डरते; नामदेव, कबीर, त्रिलोचन, सधना और सैन जैसे संत भी उनकी कृपा से तर गए। भाव: बाहरी दिखावे के बजाय
    भीतर की सच्ची भक्ति; ईश्वर के सामने सब बराबर हैं।
  explanations:
    text: 'रैदास कहते हैं कि भगवान और भक्त का संबंध ऐसा है जैसे चंदन और पानी: पानी चंदन में मिलकर सुगंधित हो जाता है। दूसरे पद में वे कहते हैं कि प्रभु गरीबों पर दया करते हैं और जिन्हें समाज नीचा समझता है, उन्हें भी ऊँचा उठा देते हैं।'
    visual: 'दो खाने बनाइए। बाएँ ''प्रभु'': चंदन, बादल, चाँद, दीपक, मोती, सोना। दाएँ ''भक्त'': पानी, मोर, चकोर, बाती, धागा, सुहागा। हर जोड़ी के बीच एक रेखा।'
    step_by_step: 'चरण 1: पहचानें कि रैदास निर्गुण भक्त कवि हैं। चरण 2: पहले पद में जोड़ियाँ देखें: प्रभु और भक्त। चरण 3: दूसरे पद में ''गरीब निवाजु'' का भाव। चरण 4: तरने वाले संतों के नाम। चरण 5: संदेश: सच्ची भक्ति, सबकी बराबरी।'
    real_world: गुरु ग्रंथ साहिब में रविदास जी की वाणी शामिल है और रविदास जयंती पूरे भारत में मनाई जाती है।
  activity:
    type: sort
    prompt: 'पहले पद की हर जोड़ी में: कौन प्रभु है और कौन भक्त (''हम'')?'
    bins:
    - प्रभु
    - भक्त
    items:
    - label: चंदन
      bin: प्रभु
      clue: चंदन और पानी में किसकी सुगंध दूसरे में फैलती है?
      why: 'प्रभु चंदन, हम पानी: प्रभु की सुगंध भक्त में बस जाती है।'
    - label: पानी
      bin: भक्त
      clue: पानी चंदन से क्या पाता है?
      why: भक्त पानी है, जो चंदन की महक पाता है।
    - label: घन (बादल)
      bin: प्रभु
      clue: मोर किसे देखकर नाचता है?
      why: प्रभु घन, हम बन के मोर।
    - label: बन का मोर
      bin: भक्त
      clue: कौन किसे देखकर खुश होता है?
      why: भक्त मोर की तरह प्रभु को देखकर प्रसन्न।
    - label: चंद्रमा
      bin: प्रभु
      clue: चकोर किसे निहारता रहता है?
      why: प्रभु चंद्रमा, हम चकोर।
    - label: चकोर
      bin: भक्त
      clue: एकटक देखनेवाला कौन है?
      why: भक्त चकोर की तरह प्रभु को निहारता है।
    - label: दीपक
      bin: प्रभु
      clue: बाती किसमें जलती है?
      why: प्रभु दीपक, हम बाती।
    - label: धागा
      bin: भक्त
      clue: मोती और धागे में किसकी कीमत है, कौन उसे पिरोता है?
      why: प्रभु मोती, हम धागा।
  lesson:
    - teach: 'संत रैदास (रविदास) निर्गुण भक्ति के कवि थे: वे ईश्वर को किसी रूप या मूर्ति में नहीं, मन के भीतर मानते थे। पहले पद ''अब कैसे छूटै राम नाम रट लागी'' में भक्त कहता है कि प्रभु के नाम की रट अब छूट नहीं सकती।'
      check:
        prompt: निर्गुण भक्ति में ईश्वर को कैसा माना जाता है?
        options:
        - बिना रूप का, मन के भीतर
        - केवल मूर्ति में
        - राजा के रूप में
        answer: बिना रूप का, मन के भीतर
        why: निर्गुण यानी गुणों और आकार से परे।
    - teach: 'रैदास भक्त और भगवान के अटूट संबंध को उपमाओं से बताते हैं: प्रभु चंदन, हम पानी; प्रभु घन (बादल), हम बन के मोर; प्रभु चंद्रमा, हम चकोर; प्रभु दीपक, हम बाती; प्रभु मोती, हम धागा; प्रभु सोना, हम सुहागा; प्रभु स्वामी, हम दास।'
      picture:
        kind: compare
        columns:
        - title: प्रभु
          points:
          - चंदन
          - घन (बादल)
          - चंद्रमा
          - दीपक
          - मोती
          - सोना
        - title: भक्त
          points:
          - पानी
          - मोर
          - चकोर
          - बाती
          - धागा
          - सुहागा
        alt: 'रैदास की जोड़ियाँ: प्रभु चंदन तो भक्त पानी, बादल तो मोर, चंद्रमा तो चकोर, दीपक तो बाती, मोती तो धागा, सोना तो सुहागा।'
      check:
        prompt: प्रभु बादल हैं तो भक्त क्या है?
        options:
        - बन का मोर
        - चकोर
        - धागा
        answer: बन का मोर
        why: बादल देखकर मोर नाचता है।
    - teach: 'दूसरे पद ''ऐसी लाल तुझ बिनु कउनु करै'' में वे प्रभु को ''गरीब निवाजु'' कहते हैं, जो नीच समझे जाने वालों को भी ऊँचा कर देते हैं और किसी से नहीं डरते। नामदेव, कबीर, त्रिलोचन, सधना और सैन जैसे संत भी उनकी कृपा से तर गए। भाव: बाहरी दिखावे के बजाय भीतर की सच्ची भक्ति; ईश्वर के सामने सब बराबर हैं।'
      check:
        prompt: रैदास के अनुसार ईश्वर के सामने…
        options:
        - सब बराबर हैं
        - केवल धनी ऊँचे हैं
        - केवल राजा प्रिय हैं
        answer: सब बराबर हैं
        why: प्रभु दीन-हीन को भी ऊँचा उठाते हैं।
  items:
  - prompt: ये पद किस संत कवि के हैं?
    options:
    - रैदास
    - तुलसीदास
    - सूरदास
    - मीराबाई
    answer: रैदास
    difficulty: 1
    hints:
    - इन्हें रविदास भी कहते हैं।
    - निर्गुण भक्ति।
    solution: 'चरण 1: ''प्रभु जी तुम चंदन हम पानी'' प्रसिद्ध पंक्ति है। चरण 2: यह रैदास का पद है।'
    mistakes:
      तुलसीदास: hin9g_author
  - prompt: '''प्रभु जी, तुम चंदन हम पानी'' में भक्त स्वयं को क्या कहता है?'
    options:
    - पानी
    - चंदन
    - दीपक
    - मोती
    answer: पानी
    difficulty: 1
    hints:
    - प्रभु चंदन हैं।
    - जो चंदन में मिलकर महकता है।
    solution: 'चरण 1: प्रभु चंदन हैं। चरण 2: भक्त पानी है, जो चंदन घिसने से सुगंधित हो जाता है।'
    mistakes:
      चंदन: hin9g_poem_meaning
  - prompt: पहले पद में 'प्रभु दीपक' हैं तो भक्त क्या है?
    options:
    - बाती
    - तेल
    - धागा
    - मोर
    answer: बाती
    difficulty: 1
    hints:
    - दीपक में जलती है।
    - दोनों साथ रोशनी देते हैं।
    solution: 'चरण 1: दीपक के साथ बाती जलती है। चरण 2: भक्त स्वयं को बाती कहता है।'
    mistakes: {"तेल": "h9_deepak_baati"}
  - prompt: दूसरे पद में प्रभु को 'गरीब निवाजु' क्यों कहा गया है?
    options:
    - वे गरीबों और दीन-हीन लोगों पर कृपा करते हैं
    - वे गरीबों को और गरीब बनाते हैं
    - वे केवल राजाओं की सुनते हैं
    - वे गरीबों से डरते हैं
    answer: वे गरीबों और दीन-हीन लोगों पर कृपा करते हैं
    difficulty: 2
    hints:
    - निवाजना = कृपा करना।
    - नीच को भी ऊँचा करते हैं।
    solution: 'चरण 1: ''निवाजु'' का अर्थ है कृपा करने वाला। चरण 2: प्रभु गरीबों और दीनों पर दया करते हैं।'
    mistakes:
      वे केवल राजाओं की सुनते हैं: hin9g_poem_meaning
  - prompt: दूसरे पद में किन संतों के प्रभु-कृपा से तरने की बात है?
    options:
    - नामदेव, कबीर, त्रिलोचन, सधना और सैन
    - तुलसी, सूर और मीरा
    - राम और लक्ष्मण
    - बुद्ध और महावीर
    answer: नामदेव, कबीर, त्रिलोचन, सधना और सैन
    difficulty: 2
    hints:
    - कबीर का नाम इसमें है।
    - पाँच संत।
    solution: 'चरण 1: रैदास उन संतों के नाम लेते हैं जो साधारण परिवारों से थे। चरण 2: नामदेव, कबीर, त्रिलोचन, सधना और सैन।'
    mistakes: {"तुलसी, सूर और मीरा": "h9_sant_naam"}
  - prompt: रैदास के पदों का मुख्य संदेश क्या है?
    options:
    - सच्ची भीतरी भक्ति और ईश्वर के सामने सबकी बराबरी
    - मंदिर में दिखावा करना
    - केवल धनी लोग ईश्वर को पा सकते हैं
    - भक्ति का कोई महत्व नहीं
    answer: सच्ची भीतरी भक्ति और ईश्वर के सामने सबकी बराबरी
    difficulty: 3
    hints:
    - दिखावे के बजाय मन की भक्ति।
    - नीच को भी ऊँचा करना।
    solution: 'चरण 1: पहला पद भीतरी प्रेम-भक्ति दिखाता है। चरण 2: दूसरा बताता है कि प्रभु सबको बराबर मानते हैं।'
    mistakes:
      केवल धनी लोग ईश्वर को पा सकते हैं: hin9g_poem_meaning
  - prompt: प्रभु चंद्रमा हैं तो भक्त कौन है?
    options:
    - चकोर
    - मोर
    - बाती
    - धागा
    answer: चकोर
    difficulty: 1
    hints:
    - यह पक्षी चाँद को एकटक देखता है।
    - मोर बादल वाली जोड़ी में है।
    solution: चकोर पक्षी चंद्रमा को निहारता रहता है; भक्त प्रभु रूपी चंद्रमा का चकोर है।
    mistakes:
      मोर: h9g_jodi
  - prompt: प्रभु मोती हैं तो भक्त क्या है?
    options:
    - धागा
    - पानी
    - सुहागा
    - दास
    answer: धागा
    difficulty: 1
    hints:
    - मोतियों की माला किससे बनती है?
    - जो मोतियों को पिरोता है।
    solution: धागा मोतियों को पिरोकर माला बनाता है; भक्त प्रभु से वैसे ही जुड़ा है।
    mistakes:
      पानी: h9g_jodi
  - prompt: सोने के साथ 'सुहागा' क्यों जोड़ा गया है?
    options:
    - सुहागा सोने को और चमकाता है
    - सुहागा सोने को पिघलाकर नष्ट करता है
    - दोनों का कोई संबंध नहीं
    - सुहागा एक फूल है
    answer: सुहागा सोने को और चमकाता है
    difficulty: 3
    hints:
    - सुनार इसे सोना साफ़ करने में लगाते हैं।
    - दोनों मिलकर और सुंदर होते हैं।
    solution: 'चरण 1: सुहागा सोने को शुद्ध कर चमक बढ़ाता है। चरण 2: भक्त और प्रभु का मेल भी ऐसा ही है।'
    mistakes:
      सुहागा सोने को पिघलाकर नष्ट करता है: h9g_jodi
  - prompt: '''अब कैसे छूटै राम नाम रट लागी'' का भाव है…'
    options:
    - प्रभु के नाम की लगन अब छूट नहीं सकती
    - राम का नाम भूल गया
    - रटना बुरी बात है
    - भक्ति छोड़ देनी चाहिए
    answer: प्रभु के नाम की लगन अब छूट नहीं सकती
    difficulty: 2
    hints:
    - '''रट लागी'' यानी लगन लग गई।'
    - '''कैसे छूटै'' यानी कैसे छूटे?'
    solution: भक्त कहता है कि प्रभु-नाम की रट ऐसी लगी है कि अब छूट ही नहीं सकती।
    mistakes:
      रटना बुरी बात है: h9g_nirgun
  - prompt: रैदास किस भक्ति-धारा के कवि थे?
    options:
    - निर्गुण भक्ति
    - सगुण कृष्ण-भक्ति
    - रीतिकाल
    - छायावाद
    answer: निर्गुण भक्ति
    difficulty: 2
    hints:
