# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 5
title: साखियाँ एवं सबद

tips:
  hcbse_kabir_god: "कबीर कहते हैं कि ईश्वर मंदिर-मस्जिद, काबा-कैलाश या कर्मकांड में नहीं, हर प्राणी की साँस में, हमारे भीतर है।"

concepts:
  - code: hin9c.k5.kabir
    title: साखियाँ एवं सबद (कबीर)
    notes: |
      कबीर, भक्तिकाल की निर्गुण धारा के संत कवि; भाषा सधुक्कड़ी (पंचमेल खिचड़ी)। साखियाँ: 'मानसरोवर सुभर
      जल, हंसा केलि कराहिं। मुकताफल मुकता चुगैं...' (हंस = मुक्त आत्मा, मोती = ज्ञान/मुक्ति); 'प्रेमी ढूँढ़त
      मैं फिरौं, प्रेमी मिले न कोइ...'; 'हस्ती चढ़िए ज्ञान कौ, सहज दुलीचा डारि। स्वान रूप संसार है...';
      'पखापखी के कारनै, सब जग रहा भुलान...'; 'काबा फिरि कासी भया, रामहिं भया रहीम...'; 'ऊँचे कुल का
      जनमिया, जे करनी ऊँच न होइ। सुबरन कलस सुरा भरा, साधू निंदा सोइ'। सबद: 'मोकों कहाँ ढूँढ़े बंदे, मैं
      तो तेरे पास में' (ईश्वर हर साँस में); 'संतौं भाई आई ग्याँन की आँधी रे' (ज्ञान की आँधी से भ्रम की टाटी
      उड़ जाती है)। विषय: बाह्य आडंबर का विरोध, ज्ञान, प्रेम, कर्म की महत्ता।
    explanations:
      text: "कबीर कहते हैं कि ईश्वर को मंदिर, मस्जिद, काबा या काशी में ढूँढ़ने की ज़रूरत नहीं: वह हमारे भीतर, हर साँस में है। ऊँचे कुल में जन्म से कोई बड़ा नहीं होता, बड़ा वह है जिसके कर्म ऊँचे हैं। ज्ञान की आँधी आने पर अंधविश्वास और भ्रम की दीवारें गिर जाती हैं।"
      visual: "एक साधक की कल्पना कीजिए जो मंदिर-मस्जिद के बीच भटक रहा है, जबकि उसके दिल में एक दीपक जल रहा है। दूसरी ओर, सोने का कलश जिसमें शराब भरी है: बाहर सुंदर, भीतर बुरा, जैसे बिना अच्छे कर्म का ऊँचा कुल।"
      step_by_step: "1. पंक्ति पढ़ें और प्रतीक पहचानें (हंस, मोती, हाथी, कुत्ता, कलश, आँधी)। 2. प्रतीक का अर्थ लगाएँ: हंस = आत्मा, ज्ञान का हाथी, संसार = भौंकता कुत्ता। 3. कबीर का संदेश जोड़ें: आडंबर छोड़ो, ज्ञान और प्रेम अपनाओ।"
      real_world: "आज भी हम कभी-कभी लोगों को उनकी जाति, पैसे या कपड़ों से परखते हैं। कबीर याद दिलाते हैं कि इंसान की असली पहचान उसके कर्म हैं।"
    items:
      - prompt: "कबीर भक्तिकाल की किस धारा के कवि थे?"
        options: ["निर्गुण", "सगुण राम-भक्ति", "सगुण कृष्ण-भक्ति", "रीतिकाल"]
        answer: "निर्गुण"
        difficulty: 1
        hints: ["वे निराकार ईश्वर को मानते थे।", "मूर्ति पूजा के विरोधी।"]
        solution: "कबीर निर्गुण भक्ति धारा के संत कवि थे।"
      - prompt: "'मोकों कहाँ ढूँढ़े बंदे, मैं तो तेरे पास में' — यहाँ ईश्वर कहाँ बताए गए हैं?"
        options: ["मनुष्य के भीतर, हर साँस में", "काबा में", "कैलाश पर्वत पर", "मंदिर की मूर्ति में"]
        answer: "मनुष्य के भीतर, हर साँस में"
        difficulty: 1
        hints: ["'मैं तो तेरे पास में'।", "बाहर ढूँढ़ने की ज़रूरत नहीं।"]
        solution: "ईश्वर हर प्राणी के भीतर, उसकी साँसों में है।"
        mistakes: {"काबा में": hcbse_kabir_god}
      - prompt: "'मानसरोवर' वाली साखी में 'हंस' किसका प्रतीक है?"
        options: ["मुक्त आत्मा / ज्ञानी जीव", "एक पक्षी मात्र", "राजा", "धन"]
        answer: "मुक्त आत्मा / ज्ञानी जीव"
        difficulty: 2
        hints: ["हंस मोती चुगता है।", "प्रतीकात्मक अर्थ।"]
        solution: "हंस मुक्त, ज्ञानी आत्मा का प्रतीक है, जो ज्ञान रूपी मोती चुगती है।"
        mistakes: {"एक पक्षी मात्र": hcbse_poem_meaning}
      - prompt: "'सुबरन कलस सुरा भरा' से कबीर क्या कहना चाहते हैं?"
        options: ["ऊँचे कुल में जन्म से नहीं, अच्छे कर्मों से इंसान बड़ा होता है", "सोने के बर्तन अच्छे होते हैं", "शराब पीना अच्छा है", "कलश में पानी भरना चाहिए"]
        answer: "ऊँचे कुल में जन्म से नहीं, अच्छे कर्मों से इंसान बड़ा होता है"
        difficulty: 2
        hints: ["'ऊँचे कुल का जनमिया, जे करनी ऊँच न होइ'।", "बाहर सोना, भीतर शराब।"]
        solution: "जैसे सोने के कलश में भरी शराब बुरी ही है, वैसे ही बुरे कर्म वाला ऊँचे कुल का व्यक्ति भी निंदनीय है।"
        mistakes: {"सोने के बर्तन अच्छे होते हैं": hcbse_poem_meaning}
      - prompt: "कबीर की भाषा को क्या कहा जाता है?"
        options: ["सधुक्कड़ी", "शुद्ध संस्कृत", "अवधी", "खड़ी बोली"]
        answer: "सधुक्कड़ी"
        difficulty: 2
        hints: ["कई भाषाओं का मेल।", "पंचमेल खिचड़ी भी कहते हैं।"]
        solution: "उनकी भाषा सधुक्कड़ी (पंचमेल खिचड़ी) कहलाती है।"
      - prompt: "'संतौं भाई आई ग्याँन की आँधी रे' में ज्ञान की आँधी से क्या उड़ जाता है?"
        options: ["भ्रम और अंधविश्वास की टाटी", "घर की छत", "पेड़ों के पत्ते", "मंदिर का झंडा"]
        answer: "भ्रम और अंधविश्वास की टाटी"
        difficulty: 3
        hints: ["'भ्रम की टाटी सबै उड़ानी'।", "प्रतीक।"]
        solution: "ज्ञान की आँधी से भ्रम की टाटी (दीवार) उड़ जाती है और मोह-माया के बंधन टूट जाते हैं।"
