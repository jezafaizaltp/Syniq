subject: cbse9-hin
chapter: 4
title: ऐसी भी बातें होती हैं
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_lata_umra: "लता जी ने बहुत छोटी उम्र में, स्कूल जाने की उम्र के आसपास, पिता से सीखना शुरू किया। साक्षात्कार में उम्र खोजें।"
  h9_pita_seekh: "पिता ने रियाज़ और लगन पर ज़ोर दिया, जल्दी प्रसिद्धि पर नहीं।"
  h9_sakshatkar: "साक्षात्कार में कोई किसी से प्रश्न पूछता है। कविता, नाटक और यात्रा-वर्णन अलग विधाएँ हैं।"
  h9g_sakshatkar_tathya: 'साक्षात्कार में दिए तथ्य याद करो: किसने बात की, किससे सीखा, किस उम्र में?'
  h9g_seekh: सोचो कि लता जी ने कठिन समय में किन गुणों से काम लिया।
  h9g_vidha_pehchan: पाठ में प्रश्न और उत्तर हैं या कथा है? विधा उसी से पहचानो।
concepts:
- code: hin9g.c4.lata
  title: ऐसी भी बातें होती हैं (लता मंगेशकर से साक्षात्कार, यतीन्द्र मिश्र)
  notes: |
    यतीन्द्र मिश्र द्वारा लिया गया स्वर-कोकिला लता मंगेशकर का साक्षात्कार। लता जी ने लगभग पाँच वर्ष की उम्र
    में अपने पिता, संगीतज्ञ और रंगमंच-कलाकार पं. दीनानाथ मंगेशकर से गाना सीखना शुरू किया; उनसे उन्हें
    अनुशासन, धैर्य और संगीत के प्रति समर्पण मिला। पिता के निधन के बाद बहुत कम उम्र में परिवार की ज़िम्मेदारी
    उन पर आ गई और उन्होंने संघर्ष करते हुए काम शुरू किया, पर अपने मूल्य और चरित्र नहीं छोड़े। बातचीत में
    वे उस्ताद अली अकबर खाँ, पं. रविशंकर, पं. कुमार गंधर्व, नौशाद, मदन मोहन, एस. डी. बर्मन, आर. डी. बर्मन
    जैसे कलाकारों को याद करती हैं, और 'आएगा आने वाला' (महल) जैसे गीतों की चर्चा करती हैं। उनकी प्रसिद्ध
    बात: "मेरी आवाज़ ही पहचान है।" संदेश: संगीत भावनाओं की भाषा है; मेहनत, समर्पण और आत्मसम्मान से
    सफलता मिलती है; परिवार के संस्कार जीवन की नींव हैं।
  explanations:
    text: 'इस साक्षात्कार में लता मंगेशकर अपनी कहानी खुद सुनाती हैं: पिता से बचपन में संगीत सीखना, कम उम्र में घर की ज़िम्मेदारी उठाना, और बड़े संगीतकारों के साथ काम करना। उनकी बातों से पता चलता है कि महान कलाकार बनने के पीछे कितनी मेहनत और अनुशासन होता है।'
    visual: एक छोटी बच्ची तानपुरे के साथ पिता के सामने बैठी है; फिर एक युवती रिकॉर्डिंग माइक के सामने; अंत में मंच पर एक वरिष्ठ गायिका, पीछे दर्शकों की तालियाँ।
    step_by_step: 'चरण 1: साक्षात्कार क्या है: प्रश्न और उत्तर में किसी के जीवन की बातें। चरण 2: लता जी के गुरु: पिता दीनानाथ मंगेशकर। चरण 3: संघर्ष: कम उम्र में परिवार की ज़िम्मेदारी। चरण 4: साथी कलाकार और गीत। चरण 5: संदेश: मेहनत और समर्पण।'
    real_world: भारत सरकार ने लता मंगेशकर को 2001 में भारत रत्न से सम्मानित किया था।
  activity:
    type: sort
    prompt: लता जी के जीवन की यह बात पिता से सीखी गई, या पिता के निधन के बाद की है?
    bins:
    - पिता से सीखा
    - पिता के निधन के बाद
    items:
    - label: पाँच वर्ष की उम्र में गाना सीखना
      bin: पिता से सीखा
      clue: लता जी के पहले गुरु कौन थे?
      why: पं. दीनानाथ मंगेशकर से गाना सीखना शुरू किया।
    - label: अनुशासन
      bin: पिता से सीखा
      clue: संगीतज्ञ पिता से संगीत के साथ और क्या मिला?
      why: पिता से अनुशासन, धैर्य और समर्पण मिला।
    - label: धैर्य और संगीत के प्रति समर्पण
      bin: पिता से सीखा
      clue: यह गुण किससे मिला?
      why: पिता की सीख।
    - label: कम उम्र में परिवार की ज़िम्मेदारी
      bin: पिता के निधन के बाद
      clue: घर की ज़िम्मेदारी लता जी पर कब आई?
      why: पिता के जाने के बाद परिवार उन पर निर्भर हुआ।
    - label: संघर्ष करते हुए काम शुरू किया
      bin: पिता के निधन के बाद
      clue: काम क्यों शुरू करना पड़ा?
      why: 'परिवार चलाने के लिए: पिता के निधन के बाद।'
  lesson:
    - teach: यह पाठ यतीन्द्र मिश्र द्वारा लिया गया स्वर-कोकिला लता मंगेशकर का साक्षात्कार है। साक्षात्कार में किसी व्यक्ति से प्रश्न पूछकर उसके विचार और अनुभव जाने जाते हैं। लता जी ने लगभग पाँच वर्ष की उम्र में अपने पिता, संगीतज्ञ और रंगमंच-कलाकार पं. दीनानाथ मंगेशकर से गाना सीखना शुरू किया। उनसे उन्हें अनुशासन, धैर्य और संगीत के प्रति समर्पण मिला।
      check:
