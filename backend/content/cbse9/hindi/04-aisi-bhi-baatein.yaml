chapter: 4
title: ऐसी भी बातें होती हैं
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
concepts:
- code: hin9g.c4.lata
  title: ऐसी भी बातें होती हैं (लता मंगेशकर से साक्षात्कार, यतीन्द्र मिश्र)
  notes: |
    यतीन्द्र मिश्र द्वारा लिया गया स्वर-कोकिला लता मंगेशकर का साक्षात्कार। लता जी ने लगभग पाँच वर्ष की उम्र
    में अपने पिता, संगीतज्ञ और रंगमंच-कलाकार पं. दीनानाथ मंगेशकर से गाना सीखना शुरू किया; उनसे उन्हें
    अनुशासन, धैर्य और संगीत के प्रति समर्पण मिला। पिता के निधन के बाद बहुत कम उम्र में परिवार की ज़िम्मेदारी
    उन पर आ गई और उन्होंने संघर्ष करते हुए काम शुरू किया, पर अपने मूल्य और चरित्र नहीं छोड़े। बातचीत में
    वे उस्ताद अली अकबर खाँ, पं. रविशंकर, पं. कुमार गंधर्व, नौशाद, मदन मोहन, एस. डी. बर्मन, आर. डी. बर्मन
    जैसे कलाकारों को याद करती हैं, और 'आएगा आने वाला' (महल) जैसे गीतों की चर्चा करती हैं। उनकी प्रसिद्ध
    बात: "मेरी आवाज़ ही पहचान है।" संदेश: संगीत भावनाओं की भाषा है; मेहनत, समर्पण और आत्मसम्मान से
    सफलता मिलती है; परिवार के संस्कार जीवन की नींव हैं।
  explanations:
    text: 'इस साक्षात्कार में लता मंगेशकर अपनी कहानी खुद सुनाती हैं: पिता से बचपन में संगीत सीखना, कम उम्र में घर की ज़िम्मेदारी उठाना, और बड़े संगीतकारों के साथ काम करना। उनकी बातों से पता चलता है कि महान कलाकार बनने के पीछे कितनी मेहनत और अनुशासन होता है।'
    visual: एक छोटी बच्ची तानपुरे के साथ पिता के सामने बैठी है; फिर एक युवती रिकॉर्डिंग माइक के सामने; अंत में मंच पर एक वरिष्ठ गायिका, पीछे दर्शकों की तालियाँ।
    step_by_step: 'चरण 1: साक्षात्कार क्या है: प्रश्न और उत्तर में किसी के जीवन की बातें। चरण 2: लता जी के गुरु: पिता दीनानाथ मंगेशकर। चरण 3: संघर्ष: कम उम्र में परिवार की ज़िम्मेदारी। चरण 4: साथी कलाकार और गीत। चरण 5: संदेश: मेहनत और समर्पण।'
    real_world: भारत सरकार ने लता मंगेशकर को 2001 में भारत रत्न से सम्मानित किया था।
  items:
  - prompt: इस पाठ में लता मंगेशकर का साक्षात्कार किसने लिया है?
    options:
    - यतीन्द्र मिश्र
    - प्रेमचंद
    - मोहन राकेश
    - कन्हैयालाल मिश्र 'प्रभाकर'
    answer: यतीन्द्र मिश्र
    difficulty: 1
    hints:
    - संगीत और कला पर लिखने वाले लेखक।
    - पाठ 4।
    solution: 'चरण 1: पाठ एक साक्षात्कार है। चरण 2: प्रश्न पूछने वाले लेखक यतीन्द्र मिश्र हैं।'
    mistakes:
      मोहन राकेश: hin9g_author
  - prompt: लता मंगेशकर के पिता का नाम क्या था?
    options:
    - पं. दीनानाथ मंगेशकर
    - पं. रविशंकर
    - नौशाद
    - पं. कुमार गंधर्व
    answer: पं. दीनानाथ मंगेशकर
    difficulty: 1
    hints:
    - उपनाम वही है।
    - वे संगीतज्ञ और रंगमंच-कलाकार थे।
    solution: 'चरण 1: लता जी ने पिता से संगीत सीखा। चरण 2: उनके पिता पं. दीनानाथ मंगेशकर थे।'
    mistakes:
      पं. रविशंकर: hin9g_read_again
  - prompt: लता जी ने लगभग कितने वर्ष की उम्र में पिता से गाना सीखना शुरू किया?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - बहुत छोटी उम्र।
    - दस से कम।
    solution: 'चरण 1: पाठ के अनुसार उन्होंने बचपन में ही सीखना शुरू किया। चरण 2: लगभग पाँच वर्ष की उम्र में।'
  - prompt: '''साक्षात्कार'' विधा में क्या होता है?'
    options:
    - किसी व्यक्ति से प्रश्न पूछकर उसके विचार और अनुभव जाने जाते हैं
    - कविता में कहानी कही जाती है
    - मंच पर नाटक खेला जाता है
    - यात्रा का वर्णन किया जाता है
    answer: किसी व्यक्ति से प्रश्न पूछकर उसके विचार और अनुभव जाने जाते हैं
    difficulty: 2
    hints:
    - प्रश्न और उत्तर।
    - अंग्रेज़ी में इंटरव्यू।
    solution: 'चरण 1: साक्षात्कार में एक व्यक्ति प्रश्न पूछता है। चरण 2: दूसरा अपने अनुभव और विचार बताता है।'
  - prompt: पिता से लता जी को कौन-सी सीख मिली?
    options:
    - अनुशासन, धैर्य और संगीत के प्रति समर्पण
    - जल्दी प्रसिद्ध होने के उपाय
    - केवल फ़िल्मी गीत गाना
    - रियाज़ न करना
    answer: अनुशासन, धैर्य और संगीत के प्रति समर्पण
    difficulty: 2
    hints:
    - गुरु के रूप में पिता।
    - रोज़ का अभ्यास।
    solution: 'चरण 1: पिता उनके पहले गुरु थे। चरण 2: उनसे अनुशासन, धैर्य और समर्पण की सीख मिली।'
  - prompt: लता जी के जीवन से सबसे बड़ी सीख क्या मिलती है?
    options:
    - कठिनाइयों में भी मेहनत, समर्पण और आत्मसम्मान से सफलता मिलती है
    - प्रतिभा हो तो मेहनत की ज़रूरत नहीं
    - परिवार की ज़िम्मेदारी से बचना चाहिए
    - संगीत केवल मनोरंजन है
    answer: कठिनाइयों में भी मेहनत, समर्पण और आत्मसम्मान से सफलता मिलती है
    difficulty: 3
    hints:
    - कम उम्र में घर सँभाला।
    - फिर भी अपने मूल्य नहीं छोड़े।
    solution: 'चरण 1: उन्होंने कम उम्र में संघर्ष किया। चरण 2: मेहनत और आत्मसम्मान बनाए रखकर वे महान गायिका बनीं।'
    mistakes:
      प्रतिभा हो तो मेहनत की ज़रूरत नहीं: hin9g_poem_meaning
