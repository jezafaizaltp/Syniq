# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 2
title: ल्हासा की ओर

tips:
  hcbse_tibet_society: "लेखक ने बताया कि तिब्बत में जाति-पाँति और छुआछूत नहीं था, और स्त्रियाँ परदा नहीं करती थीं।"

concepts:
  - code: hin9c.k2.lhasa
    title: ल्हासा की ओर (राहुल सांकृत्यायन)
    notes: |
      राहुल सांकृत्यायन का यात्रा-वृत्तांत; उनकी पहली तिब्बत यात्रा (1929–30) का अंश, जब भारतीयों को
      तिब्बत जाने की अनुमति नहीं थी, इसलिए वे भिखमंगे के वेश में गए। नेपाल से तिब्बत जाने का पुराना
      व्यापारिक और सैनिक रास्ता। साथी मंगोल भिक्षु सुमति, जिनकी यजमानों में बड़ी पहचान थी और जो बोधगया
      के गंडे (कपड़े की पट्टी) बाँटते थे। थोङ्ला का डाँडा (ऊँचा पहाड़ी रास्ता, सोलह-सत्रह हज़ार फ़ीट),
      डाकुओं का डर; लङ्कोर में देर से पहुँचने पर सुमति नाराज़। तिब्बती समाज: जाति-पाँति और छुआछूत नहीं,
      स्त्रियाँ परदा नहीं करतीं; अपरिचित भी घर में चाय बनवा सकते हैं। शेकर विहार, तिङ्री का मैदान।
      लेखक को 'घुमक्कड़ शास्त्र' के लिए जाना जाता है; 'महापंडित'।
    explanations:
      text: "राहुल सांकृत्यायन बहुत बड़े यात्री थे। इस पाठ में वे 1929–30 की अपनी तिब्बत यात्रा का वर्णन करते हैं। उस समय भारतीयों को तिब्बत जाने की अनुमति नहीं थी, इसलिए वे भिखमंगे के वेश में मंगोल भिक्षु सुमति के साथ गए। वे ऊँचे पहाड़ी दर्रों, डाकुओं के डर और तिब्बती समाज के खुलेपन के बारे में बताते हैं।"
      visual: "नक्शे पर रेखा खींचिए: नेपाल → थोङ्ला का डाँडा (बर्फ़ीला, ऊँचा) → लङ्कोर → तिङ्री → शेकर विहार → ल्हासा की ओर। रास्ते में घोड़े, चाय की केतली और डाकुओं के डर का निशान।"
      step_by_step: "1. यात्रा का समय और भिखमंगे का वेश। 2. साथी सुमति और गंडे। 3. थोङ्ला का डाँडा पार करना। 4. घोड़ा धीमा, लेखक पीछे रह गया; सुमति नाराज़। 5. तिब्बती समाज की विशेषताएँ।"
      real_world: "आज भी लद्दाख और सिक्किम के ऊँचे दर्रों पर यात्री साँस फूलने और ठंड से जूझते हैं। लेखक ने यह सब बिना आधुनिक सुविधाओं के किया।"
    items:
      - prompt: "'ल्हासा की ओर' के लेखक कौन हैं?"
        options: ["राहुल सांकृत्यायन", "प्रेमचंद", "हरिशंकर परसाई", "सर्वेश्वर दयाल सक्सेना"]
        answer: "राहुल सांकृत्यायन"
        difficulty: 1
        hints: ["घुमक्कड़ लेखक।", "'महापंडित' कहलाते हैं।"]
        solution: "राहुल सांकृत्यायन।"
        mistakes: {"प्रेमचंद": hcbse_author}
      - prompt: "लेखक यात्रा में किस वेश में गए थे?"
        options: ["भिखमंगे के वेश में", "व्यापारी के वेश में", "सैनिक के वेश में", "राजा के वेश में"]
        answer: "भिखमंगे के वेश में"
        difficulty: 1
        hints: ["भारतीयों को अनुमति नहीं थी।", "छिपकर जाना था।"]
        solution: "वे भिखमंगे के वेश में गए थे।"
      - prompt: "यात्रा में लेखक के साथी का नाम क्या था?"
        options: ["सुमति", "झूरी", "गया", "सुभद्रा"]
        answer: "सुमति"
        difficulty: 1
        hints: ["एक मंगोल भिक्षु।", "गंडे बाँटते थे।"]
        solution: "मंगोल भिक्षु सुमति।"
        mistakes: {"झूरी": hcbse_read_again}
      - prompt: "लेखक की यह पहली तिब्बत यात्रा किस वर्ष शुरू हुई थी?"
        answer: "1929"
        check: "1929"
        difficulty: 2
        hints: ["1929–30 की यात्रा।", "पहला वर्ष लिखें।"]
        solution: "यह यात्रा 1929–30 में हुई थी।"
      - prompt: "तिब्बती समाज की कौन-सी बात लेखक को अच्छी लगी?"
        options: ["जाति-पाँति और छुआछूत नहीं था, स्त्रियाँ परदा नहीं करती थीं", "सभी लोग बहुत अमीर थे", "वहाँ कोई डाकू नहीं था", "सब हिंदी बोलते थे"]
        answer: "जाति-पाँति और छुआछूत नहीं था, स्त्रियाँ परदा नहीं करती थीं"
        difficulty: 2
        hints: ["समाज का खुलापन।", "अपरिचित भी घर में चाय बनवा सकते थे।"]
        solution: "तिब्बत में जाति-पाँति, छुआछूत और परदा प्रथा नहीं थी।"
        mistakes: {"वहाँ कोई डाकू नहीं था": hcbse_tibet_society}
      - prompt: "सुमति लङ्कोर में लेखक पर क्यों नाराज़ हुए?"
        options: ["लेखक बहुत देर से पहुँचे", "लेखक ने चाय गिरा दी", "लेखक ने गंडे खो दिए", "लेखक रास्ता भूलकर लौट गए"]
        answer: "लेखक बहुत देर से पहुँचे"
        difficulty: 3
        hints: ["लेखक का घोड़ा धीमा था।", "वे रास्ता भटक गए थे।"]
        solution: "घोड़ा धीमा होने और रास्ता भटकने से लेखक देर से पहुँचे, इसलिए सुमति नाराज़ हुए।"
