# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 7
title: उपभोक्तावाद की संस्कृति
concepts:
- code: hin9c.k7.upbhoktavad
  title: उपभोक्तावाद की संस्कृति (श्यामाचरण दुबे)
  notes: |
    श्यामाचरण दुबे का निबंध। जीवन की शैली बदल रही है; एक नई संस्कृति, उपभोक्तावाद, पनप रही है जिसमें उत्पादन
    पर ज़ोर है और 'सुख' की परिभाषा बदल गई है: उत्पादों का उपभोग ही सुख माना जाने लगा है। विज्ञापनों से
    प्रभावित होकर लोग महँगे टूथपेस्ट, सौंदर्य प्रसाधन, ब्रांडेड कपड़े, म्यूज़िक सिस्टम, पाँच सितारा होटल और
    महँगे अस्पताल-स्कूल चुनते हैं, अक्सर दिखावे और प्रतिष्ठा के लिए। हम पश्चिम की नकल कर रहे हैं; परंपराओं
    का अवमूल्यन, आस्थाओं का क्षरण। संसाधनों का अपव्यय, सामाजिक दूरी और अशांति बढ़ती है। गांधीजी की सलाह:
    स्वस्थ सांस्कृतिक प्रभावों के लिए दरवाज़े-खिड़कियाँ खुले रखें, पर अपनी बुनियाद पर कायम रहें।
  explanations:
    text: लेखक कहते हैं कि आज हम चीज़ें ज़रूरत से नहीं, विज्ञापन और दिखावे के लिए ख़रीदते हैं। धीरे-धीरे चीज़ें ही हमें चलाने लगती हैं। इससे पैसा और संसाधन बर्बाद होते हैं, अमीर-ग़रीब की दूरी बढ़ती है, और हम अपनी संस्कृति भूलकर पश्चिम की नकल करने लगते हैं।
    visual: 'एक तराज़ू सोचिए: एक पलड़े पर ''ज़रूरत'' (साधारण टूथपेस्ट, साफ़ कपड़े), दूसरे पर ''दिखावा'' (महँगा ब्रांड, विज्ञापन वाला सामान)। उपभोक्तावाद में दिखावे वाला पलड़ा भारी होता जाता है।'
    step_by_step: '1. नई जीवन-शैली और उपभोक्तावाद का अर्थ। 2. सुख की बदली परिभाषा: उपभोग ही सुख। 3. विज्ञापन और दिखावा: टूथपेस्ट से पाँच सितारा होटल तक। 4. दुष्परिणाम: अपव्यय, सामाजिक दूरी, अशांति। 5. गांधीजी की सलाह।'
    real_world: दोस्तों में किसी के पास नया महँगा फ़ोन आने पर बाक़ी लोग भी वैसा ही चाहने लगते हैं, भले पुराना फ़ोन ठीक चल रहा हो। यही उपभोक्तावाद है।
  picture:
    kind: compare
    columns:
    - title: ज़रूरत के लिए ख़रीदना
      points:
      - सामान काम आए, इसलिए
      - अपनी जेब के हिसाब से
      - संसाधनों की बचत
    - title: दिखावे के लिए ख़रीदना
      points:
      - विज्ञापन और ब्रांड देखकर
      - प्रतिष्ठा दिखाने के लिए
      - अपव्यय और सामाजिक दूरी
    alt: 'दो स्तंभ: ज़रूरत के लिए ख़रीदना, जो काम और बजट के हिसाब से होता है, और दिखावे के लिए ख़रीदना, जो विज्ञापन और प्रतिष्ठा के लिए होता है और अपव्यय बढ़ाता है।'
  items:
  - prompt: '''उपभोक्तावाद की संस्कृति'' के लेखक कौन हैं?'
    options:
    - श्यामाचरण दुबे
    - जाबिर हुसैन
    - राहुल सांकृत्यायन
    - हरिशंकर परसाई
    answer: श्यामाचरण दुबे
    difficulty: 1
    hints:
    - एक समाजशास्त्री लेखक।
    - उपनाम 'दुबे'।
    solution: श्यामाचरण दुबे।
    mistakes:
      हरिशंकर परसाई: hcbse_author
  - prompt: लेखक के अनुसार उपभोक्तावाद में 'सुख' का क्या अर्थ हो गया है?
    options:
    - उत्पादों का उपभोग
    - परिवार के साथ समय
    - सादा जीवन
    - दूसरों की सेवा
    answer: उत्पादों का उपभोग
    difficulty: 1
    hints:
    - सुख की परिभाषा बदल गई है।
    - चीज़ें ख़रीदना और भोगना।
    solution: उत्पादों के उपभोग को ही सुख मान लिया गया है।
  - prompt: लोग महँगी चीज़ें अक्सर किस कारण ख़रीदते हैं?
    options:
    - दिखावे और प्रतिष्ठा के लिए
    - क्योंकि सस्ती चीज़ें मिलती ही नहीं
    - सरकार के आदेश से
    - दान करने के लिए
    answer: दिखावे और प्रतिष्ठा के लिए
    difficulty: 1
    hints:
    - विज्ञापन क्या दिखाते हैं?
    - समाज में हैसियत।
    solution: लोग प्रतिष्ठा-चिह्न के रूप में, दिखावे के लिए, महँगी चीज़ें ख़रीदते हैं।
  - prompt: उपभोक्तावाद का समाज पर क्या असर बताया गया है?
    options:
    - सामाजिक दूरी और अशांति बढ़ती है
    - सब बराबर हो जाते हैं
    - परंपराएँ मज़बूत होती हैं
    - संसाधन बचते हैं
    answer: सामाजिक दूरी और अशांति बढ़ती है
    difficulty: 2
    hints:
    - अमीर और ग़रीब के बीच क्या होता है?
    - आक्रोश और असंतोष।
    solution: वर्गों में दूरी बढ़ती है, जिससे अशांति और आक्रोश पैदा होते हैं।
    mistakes:
      परंपराएँ मज़बूत होती हैं: hcbse_read_again
  - prompt: गांधीजी ने इस बारे में क्या सलाह दी थी?
    options:
    - अच्छे प्रभावों के लिए खिड़कियाँ खुली रखें पर अपनी बुनियाद पर टिके रहें
    - विदेशी चीज़ें पूरी तरह छोड़ दें
    - जितना हो सके उतना ख़रीदें
    - विज्ञापन बंद कर दें
    answer: अच्छे प्रभावों के लिए खिड़कियाँ खुली रखें पर अपनी बुनियाद पर टिके रहें
    difficulty: 2
    hints:
    - दरवाज़े-खिड़कियाँ खुले रखने की बात।
    - पर अपनी जड़ें न छोड़ें।
    solution: स्वस्थ सांस्कृतिक प्रभावों के लिए दरवाज़े-खिड़कियाँ खुली रखें, पर अपनी बुनियाद पर कायम रहें।
  - prompt: लेखक किस बात से सबसे अधिक चिंतित हैं?
    options:
    - हम अपनी संस्कृति छोड़कर अंधी नकल कर रहे हैं
    - लोग बहुत कम ख़रीदते हैं
    - दुकानें बहुत दूर हैं
    - विज्ञापन बहुत छोटे हैं
    answer: हम अपनी संस्कृति छोड़कर अंधी नकल कर रहे हैं
    difficulty: 3
    hints:
    - पश्चिम की नकल।
    - परंपराओं का अवमूल्यन।
    solution: उन्हें चिंता है कि दिखावे की इस संस्कृति में हम अपनी परंपराएँ और पहचान खो रहे हैं।
