# CBSE Class 9 Hindi (NCERT Ganga, 2026-27; replaces both Hindi A and Hindi B), chapter 10. Format: content/README.md.
# Written from published summaries of the new book and memory of the texts, not the printed copy. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse9-hin
chapter: 10
title: भारति, जय, विजयकरे!
tips:
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_bharat_mata: "कविता 'भारति' को संबोधित करती है। भारत को किस रूप में देखा गया है?"
  h9_ganga_haar: "हार गले में पहना जाता है और चमकता है। भारत में कौन-सी उजली धारा उत्तर से बहती है?"
  h9_sagar: "सागर भारत के चरणों के पास है। चरणों के पास बैठकर कोई क्या करता है?"
  h9_tatsam: "कविता में संस्कृत से आए (तत्सम) शब्द बहुत हैं और लय भी है।"
  h9g_bharat_chitra: कविता में भारत माता को देवी की तरह सजाया गया है। प्रकृति की कौन-सी चीज़ उनका कौन-सा गहना या वस्त्र है?
  h9g_tatsam: शब्द का रूप देखो। संस्कृत से बिना बदले आया शब्द तत्सम है, बदला हुआ रूप तद्भव।
  h9g_samas_arth: शब्द को तोड़कर देखो। दोनों हिस्से मिलकर क्या अर्थ बनाते हैं?
concepts:
- code: hin9g.c10.bharati
  title: भारति, जय, विजयकरे! (सूर्यकांत त्रिपाठी 'निराला')
  notes: |
    महाकवि सूर्यकांत त्रिपाठी 'निराला' का राष्ट्र-वंदना गीत, जिसमें भारत माता को देवी के रूप में चित्रित किया
    गया है। कवि उनकी जय-विजय की कामना करता है; वे हाथों में सोने जैसी फ़सल (कनक-शस्य) और कमल धारण किए
    हैं। लंका उनके चरणों के नीचे सौ पंखुड़ियों वाले कमल (शतदल) जैसी है और गरजता सागर उनके पवित्र चरण
    धोता हुआ स्तुति करता है। पेड़, घास, वन और लताएँ उनके वस्त्र हैं, जिनके आँचल में फूल टँके हैं; गंगा की
    उजली धारा गले का हार है। हिमालय की बर्फ़ उनका श्वेत मुकुट है, ओंकार उनका प्राण है, और दिशाएँ उनकी
    स्तुति से गूँज रही हैं। भाव: भारत की प्राकृतिक सुंदरता, समृद्धि और आध्यात्मिक चेतना के प्रति गर्व।
    तत्सम शब्दों से भरी, संगीतमय भाषा।
  explanations:
    text: 'निराला भारत को एक देवी की तरह देखते हैं: हिमालय उसका मुकुट है, गंगा उसके गले का हार, वन-लताएँ उसके वस्त्र, और समुद्र उसके चरण धोता है। कवि उसकी जय-जयकार करता है।'
    visual: 'भारत के नक्शे पर एक देवी का रूप: सिर पर बर्फ़ीला हिमालय-मुकुट, गले में गंगा की उजली धारा, हरे वन का आँचल, और पैरों के पास लहराता सागर और कमल जैसी लंका।'
    step_by_step: 'चरण 1: कवि भारत माता की जय की कामना करता है। चरण 2: पैरों के पास: लंका और सागर। चरण 3: शरीर पर: वन-लता के वस्त्र, फूल, गंगा का हार। चरण 4: सिर पर: हिमालय का मुकुट। चरण 5: प्राण में: ओंकार।'
    real_world: स्वतंत्रता दिवस और गणतंत्र दिवस पर विद्यालयों में ऐसे राष्ट्र-वंदना गीत गाए जाते हैं।
  activity:
    type: sort
    prompt: गीत में प्रकृति का हर अंश भारत माता का क्या है?
    bins:
    - मुकुट
    - हार
    - वस्त्र
    - चरणों के पास
    items:
    - label: हिमालय की बर्फ़
      bin: मुकुट
      clue: देश के सबसे ऊपर क्या है?
      why: हिमालय की बर्फ़ श्वेत मुकुट है।
    - label: गंगा की उजली धारा
      bin: हार
      clue: लंबी, चमकती धारा शरीर पर कहाँ सजेगी?
      why: गंगा की धारा गले का हार है।
    - label: पेड़, घास, वन, लताएँ
      bin: वस्त्र
      clue: धरती को ढकने वाली हरियाली क्या बनती है?
      why: ये वस्त्र हैं, जिनके आँचल में फूल टँके हैं।
    - label: लंका, शतदल कमल जैसी
      bin: चरणों के पास
      clue: लंका भारत के किस छोर के पास है?
      why: दक्षिण में, चरणों के नीचे शतदल जैसी।
    - label: गरजता सागर
      bin: चरणों के पास
      clue: सागर माँ के कौन-से अंग धोता है?
      why: सागर पवित्र चरण धोता हुआ स्तुति करता है।
  lesson:
    - teach: '''भारति, जय, विजयकरे!'' महाकवि सूर्यकांत त्रिपाठी ''निराला'' का राष्ट्र-वंदना गीत है। इसमें भारत माता को देवी के रूप में चित्रित किया गया है। कवि उनकी जय-विजय की कामना करता है; वे हाथों में सोने जैसी फ़सल (कनक-शस्य) और कमल धारण किए हैं।'
      check:
        prompt: '''कनक-शस्य'' का अर्थ है…'
        options:
        - सोने जैसी फ़सल
        - कमल का फूल
        - सागर की लहर
        answer: सोने जैसी फ़सल
        why: कनक यानी सोना, शस्य यानी फ़सल।
    - teach: लंका उनके चरणों के नीचे सौ पंखुड़ियों वाले कमल (शतदल) जैसी है, और गरजता सागर उनके पवित्र चरण धोता हुआ स्तुति करता है। पेड़, घास, वन और लताएँ उनके वस्त्र हैं, जिनके आँचल में फूल टँके हैं। गंगा की उजली धारा गले का हार है। हिमालय की बर्फ़ उनका श्वेत मुकुट है, ओंकार उनका प्राण है, और दिशाएँ उनकी स्तुति से गूँज रही हैं।
      picture:
        kind: compare
        columns:
        - title: प्रकृति
          points:
          - हिमालय की बर्फ़
          - गंगा की धारा
          - पेड़, वन, लताएँ
          - सागर
          - लंका
        - title: भारत माता का
          points:
          - श्वेत मुकुट
          - गले का हार
          - वस्त्र
          - चरण धोता है
          - चरणों में शतदल
        alt: 'कविता में प्रकृति के अंग भारत माता के श्रृंगार बने: हिमालय मुकुट, गंगा हार, वन वस्त्र, सागर चरण धोता, लंका चरणों में कमल।'
      check:
        prompt: भारत माता के वस्त्र किन्हें कहा गया है?
        options:
        - पेड़, घास, वन और लताएँ
        - बादल
        - नदियाँ
        answer: पेड़, घास, वन और लताएँ
        why: हरियाली उनका परिधान है।
    - teach: 'भाव: भारत की प्राकृतिक सुंदरता, समृद्धि और आध्यात्मिक चेतना के प्रति गर्व। भाषा तत्सम शब्दों से भरी और संगीतमय है। तत्सम शब्द संस्कृत से बिना बदले आते हैं (जैसे ''कनक'', ''शतदल''), तद्भव शब्द बदले हुए रूप में (जैसे ''सोना'')।'
      check:
        prompt: '''शतदल'' कैसा शब्द है?'
        options:
        - तत्सम
        - तद्भव
        - विदेशी
        answer: तत्सम
        why: यह संस्कृत से बिना बदले आया है।
  items:
  - prompt: '''भारति, जय, विजयकरे!'' कविता के कवि कौन हैं?'
    options:
    - सूर्यकांत त्रिपाठी 'निराला'
    - सुभद्रा कुमारी चौहान
    - भवानीप्रसाद मिश्र
    - तुलसीदास
    answer: सूर्यकांत त्रिपाठी 'निराला'
    difficulty: 1
    hints:
    - छायावाद के प्रमुख कवि।
    - उपनाम 'निराला'।
    solution: 'चरण 1: यह राष्ट्र-वंदना गीत छायावादी कवि का है। चरण 2: कवि सूर्यकांत त्रिपाठी ''निराला'' हैं।'
    mistakes:
      भवानीप्रसाद मिश्र: hin9g_author
  - prompt: कविता में भारत माता का मुकुट किसे बताया गया है?
    options:
    - हिमालय की श्वेत बर्फ़
    - गंगा की धारा
    - लंका
    - सागर की लहरें
    answer: हिमालय की श्वेत बर्फ़
    difficulty: 1
    hints:
    - सबसे ऊपर, उत्तर में।
    - '''मुकुट शुभ्र हिम-तुषार''।'
    solution: 'चरण 1: मुकुट सिर पर होता है। चरण 2: भारत के उत्तर में बर्फ़ से ढका हिमालय है: वही मुकुट है।'
    mistakes:
      गंगा की धारा: hin9g_poem_meaning
  - prompt: भारत माता के गले का हार किसे कहा गया है?
    options:
    - गंगा की उजली धारा
    - हिमालय
    - कमल
    - सागर
    answer: गंगा की उजली धारा
    difficulty: 1
    hints:
    - एक नदी।
    - '''धवल-धार हार गले''।'
    solution: 'चरण 1: हार गले में होता है। चरण 2: कवि गंगा की उजली धारा को हार कहता है।'
    mistakes: {"हिमालय": "h9_ganga_haar"}
  - prompt: कविता में सागर क्या कर रहा है?
    options:
    - भारत माता के चरण धोकर स्तुति कर रहा है
    - भारत को डुबो रहा है
    - शांत सोया है
    - हिमालय से टकरा रहा है
    answer: भारत माता के चरण धोकर स्तुति कर रहा है
    difficulty: 2
    hints:
    - सागर दक्षिण में, चरणों के पास है।
    - गरजती लहरें।
    solution: 'चरण 1: सागर भारत के दक्षिण में है। चरण 2: कवि कहता है कि वह गरजती लहरों से चरण धोते हुए स्तुति करता है।'
    mistakes: {"भारत को डुबो रहा है": "h9_sagar"}
  - prompt: कविता में भारत को किस रूप में चित्रित किया गया है?
    options:
    - एक देवी (भारत माता) के रूप में
    - एक राजा के रूप में
    - एक नदी के रूप में
    - एक पक्षी के रूप में
    answer: एक देवी (भारत माता) के रूप में
    difficulty: 2
    hints:
    - '''भारति'' संबोधन।'
    - मुकुट, हार, वस्त्र।
    solution: 'चरण 1: कवि भारत को मुकुट, हार, वस्त्र पहने दिखाता है। चरण 2: यह देवी, भारत माता का रूप है।'
    mistakes: {"एक राजा के रूप में": "h9_bharat_mata"}
  - prompt: इस कविता की भाषा की मुख्य विशेषता क्या है?
    options:
    - तत्सम शब्दों से भरी, संगीतमय भाषा
    - बोलचाल की अंग्रेज़ी
    - केवल उर्दू शब्द
    - गद्य जैसी सपाट भाषा
    answer: तत्सम शब्दों से भरी, संगीतमय भाषा
    difficulty: 3
    hints:
    - '''कनक-शस्य'', ''शतदल'', ''हिम-तुषार''।'
    - इसे गाया जा सकता है।
    solution: 'चरण 1: शब्द संस्कृत से आए तत्सम हैं। चरण 2: लय और तुक इसे गीत जैसा बनाते हैं।'
    mistakes: {"बोलचाल की अंग्रेज़ी": "h9_tatsam"}
  - prompt: '''शतदल'' का अर्थ है…'
    options:
    - सौ पंखुड़ियों वाला कमल
    - सौ सैनिकों का दल
    - सौ नदियाँ
    - सौ पेड़
    answer: सौ पंखुड़ियों वाला कमल
    difficulty: 2
    hints:
    - शत यानी सौ।
    - दल यानी पंखुड़ी।
    solution: शत (सौ) + दल (पंखुड़ी) = सौ पंखुड़ियों वाला, यानी कमल।
    mistakes:
      सौ सैनिकों का दल: h9g_samas_arth
  - prompt: कविता में लंका को कहाँ दिखाया गया है?
    options:
    - भारत माता के चरणों के नीचे कमल जैसी
    - माथे पर मुकुट जैसी
    - गले के हार जैसी
    - हाथ में फ़सल जैसी
    answer: भारत माता के चरणों के नीचे कमल जैसी
    difficulty: 2
    hints:
    - नक्शे में लंका भारत के नीचे है।
    - शतदल की उपमा।
    solution: लंका भारत के दक्षिण में है, इसलिए उसे चरणों के नीचे शतदल जैसा बताया गया।
    mistakes:
      माथे पर मुकुट जैसी: h9g_bharat_chitra
  - prompt: निम्न में से तद्भव शब्द कौन-सा है?
    options:
    - सोना
    - कनक
    - स्वर्ण
    - शतदल
    answer: सोना
    difficulty: 2
    hints:
    - तीन शब्द संस्कृत रूप में हैं।
    - जो रोज़ बोलचाल का रूप है।
    solution: '''स्वर्ण'' से बदलकर बना ''सोना'' तद्भव है; कनक, स्वर्ण, शतदल तत्सम हैं।'
    mistakes:
      कनक: h9g_tatsam
  - prompt: '''वंदना'' का अर्थ है…'
    options:
    - स्तुति, प्रार्थना
    - युद्ध
    - शिकायत
    - यात्रा
    answer: स्तुति, प्रार्थना
    difficulty: 1
    hints:
    - यह राष्ट्र-वंदना गीत है।
    - आदर से गुणगान।
    solution: वंदना यानी आदरपूर्वक स्तुति या प्रार्थना।
    mistakes:
      शिकायत: h9g_shabd_arth
  - prompt: कविता में भारत माता का 'प्राण' किसे कहा गया है?
    options:
    - ओंकार
    - गंगा
    - हिमालय
    - सागर
    answer: ओंकार
    difficulty: 3
    hints:
    - यह आध्यात्मिक चेतना का प्रतीक है।
    - एक पवित्र ध्वनि।
    solution: कवि ने ओंकार (ॐ) को भारत माता का प्राण कहा, जो उसकी आध्यात्मिक चेतना दिखाता है।
    mistakes:
      गंगा: h9g_bharat_chitra
  - prompt: '''निराला'' किस काव्य-धारा के प्रमुख कवि थे?'
    options:
    - छायावाद
    - भक्तिकाल
    - रीतिकाल
    - वीरगाथा काल
    answer: छायावाद
    difficulty: 3
