subject: cbse9-hin
chapter: 2
title: क्या लिखूँ?
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_nibandh_ang: "लेखक निबंध की बात कर रहे हैं, लिखने के सामान की नहीं। क्या लिखा जाए और कैसे लिखा जाए: ये दो अंग हैं।"
  h9_sudhar: "हर युग में समाज बदलता है। बदलाव के साथ क्या नया पैदा होता रहता है?"
  h9g_nibandh_vishay: लेखक की उलझन याद करो। उसे किन विषयों पर, और किस तरह का निबंध लिखना था?
  h9g_muhavara: मुहावरे या लोकोक्ति का शब्दशः अर्थ नहीं, उसका छिपा हुआ भाव देखो।
  h9g_sudhar_karan: सोचो कि हर नया समय अपने साथ क्या लेकर आता है। क्या पुराने सुधार काफ़ी रहते हैं?
  h9g_vidha: पाठ के रूप को पहचानो। क्या यह कहानी है, कविता है, या विचारों से भरा गद्य है?
concepts:
- code: hin9g.c2.likhoon
  title: क्या लिखूँ? (पदुमलाल पुन्नालाल बख्शी)
  notes: |
    पदुमलाल पुन्नालाल बख्शी का ललित निबंध। लेखक को दो विषयों पर आदर्श निबंध लिखने हैं: "दूर के ढोल
    सुहावने होते हैं" और "समाज-सुधार"। वह सोचता है कि क्या लिखे और कैसे लिखे। वह बताता है कि निबंध के दो
    अंग हैं: सामग्री और शैली; पहले सामग्री जुटानी चाहिए, फिर शैली तय करनी चाहिए, और रूपरेखा बनाने से
    विचार क्रम में आते हैं। वह अंग्रेज़ी निबंधकार ए. जी. गार्डिनर और निबंध-शैली के प्रवर्तक मोंतेन का
    उल्लेख करता है, जो मन की मौज में स्वच्छंद निबंध लिखते थे। "दूर के ढोल" का अर्थ है कि दूरी कठोर सच
    को ढक देती है और कल्पना उसमें मधुरता भर देती है। समाज-सुधार हर युग में ज़रूरी रहा है (बुद्ध,
    कबीर, नानक, राममोहन राय, दयानंद, गांधी), क्योंकि हर युग में नए दोष पैदा होते हैं। युवा भविष्य को
    और वृद्ध अतीत को वर्तमान में लाना चाहते हैं। अंत में समय कम होने से लेखक दोनों विषयों को एक ही
    निबंध में समेट देता है। पाठ हल्के-फुल्के व्यंग्य और आत्मीय शैली में है।
  explanations:
    text: 'लेखक को दो विषयों पर निबंध लिखना है और वह उलझन में है कि क्या लिखे। इसी उलझन में वह हमें निबंध लिखना सिखा देता है: पहले सामग्री, फिर शैली, फिर रूपरेखा। ''दूर के ढोल सुहावने'' का मतलब है कि दूर की चीज़ें कल्पना में अच्छी लगती हैं।'
    visual: 'एक मेज़ पर बैठा लेखक, सामने कोरा कागज़। ऊपर दो बादल: ''दूर के ढोल सुहावने होते हैं'' और ''समाज-सुधार''। कागज़ पर तीन सीढ़ियाँ: सामग्री, शैली, रूपरेखा।'
    step_by_step: 'चरण 1: लेखक के सामने दो विषय हैं। चरण 2: वह निबंध के अंग सोचता है: सामग्री और शैली। चरण 3: रूपरेखा का महत्व। चरण 4: दोनों विषयों पर विचार। चरण 5: समय कम होने से दोनों को एक निबंध में समेटना।'
    real_world: परीक्षा में निबंध लिखते समय पहले दो मिनट बिंदु लिख लेने (रूपरेखा) से निबंध साफ़ और क्रम में बनता है।
  activity:
    type: sort
    prompt: निबंध में यह बात किस विषय के अंतर्गत आती है?
    bins:
    - दूर के ढोल सुहावने
    - समाज-सुधार
    items:
    - label: दूरी कठोर सच को ढक देती है
      bin: दूर के ढोल सुहावने
      clue: ढोल पास से कैसा लगता है, दूर से कैसा?
      why: 'दूर से कठोर सच नहीं दिखता: यही ढोल का सुहावनापन है।'
    - label: कल्पना उसमें मधुरता भर देती है
      bin: दूर के ढोल सुहावने
      clue: जो चीज़ दूर है, उसकी कमी कौन भरता है?
      why: दूरी पर कल्पना मीठे रंग भरती है।
    - label: बुद्ध, कबीर, नानक
      bin: समाज-सुधार
      clue: इन सबने समाज के किस काम में भाग लिया?
      why: हर युग के समाज-सुधारकों की सूची।
    - label: राममोहन राय, दयानंद, गांधी
      bin: समाज-सुधार
      clue: ये किस तरह के नाम हैं?
      why: आधुनिक युग के समाज-सुधारक।
    - label: हर युग में नए दोष पैदा होते हैं
      bin: समाज-सुधार
      clue: सुधार हर युग में क्यों चाहिए?
      why: नए दोष आते रहते हैं, इसलिए सुधार हर युग में ज़रूरी।
  lesson:
    - teach: '''क्या लिखूँ?'' पदुमलाल पुन्नालाल बख्शी का ललित निबंध है। लेखक को दो विषयों पर आदर्श निबंध लिखने हैं: ''दूर के ढोल सुहावने होते हैं'' और ''समाज-सुधार''। वह सोचता है कि क्या लिखे और कैसे लिखे। वह बताता है कि निबंध के दो अंग हैं: सामग्री और शैली। पहले सामग्री जुटानी चाहिए, फिर शैली तय करनी चाहिए, और रूपरेखा बनाने से विचार क्रम में आते हैं।'
      picture:
        kind: flow
        steps:
        - विषय चुनो
        - सामग्री जुटाओ
        - रूपरेखा बनाओ
        - शैली तय करो
        - निबंध लिखो
        alt: 'निबंध लिखने का क्रम: विषय, सामग्री, रूपरेखा, शैली, फिर लिखना।'
      check:
        prompt: लेखक के अनुसार पहले क्या करना चाहिए?
        options:
        - सामग्री जुटानी चाहिए
        - सीधे लिखना शुरू करना चाहिए
        - शीर्षक बदलना चाहिए
        answer: सामग्री जुटानी चाहिए
        why: बिना सामग्री के शैली किस पर चलेगी?
    - teach: लेखक अंग्रेज़ी निबंधकार ए. जी. गार्डिनर और निबंध-शैली के प्रवर्तक मोंतेन का उल्लेख करता है, जो मन की मौज में स्वच्छंद निबंध लिखते थे। 'दूर के ढोल सुहावने' का भाव है कि दूरी कठोर सच को ढक देती है और कल्पना उसमें मधुरता भर देती है।
      check:
        prompt: '''दूर के ढोल सुहावने'' का भाव है…'
        options:
        - दूर की चीज़ें कल्पना में अच्छी लगती हैं
        - ढोल दूर से नहीं सुनाई देता
        - पास की चीज़ें हमेशा सुंदर होती हैं
        answer: दूर की चीज़ें कल्पना में अच्छी लगती हैं
        why: पास जाने पर सच्चाई दिखती है।
    - teach: 'समाज-सुधार हर युग में ज़रूरी रहा है: बुद्ध, कबीर, नानक, राममोहन राय, दयानंद, गांधी। क्योंकि हर युग में नए दोष पैदा होते हैं। युवा भविष्य को और वृद्ध अतीत को वर्तमान में लाना चाहते हैं। अंत में समय कम होने से लेखक दोनों विषयों को एक ही निबंध में समेट देता है। पाठ हल्के-फुल्के व्यंग्य और आत्मीय शैली में है।'
      check:
        prompt: युवा किसे वर्तमान में लाना चाहते हैं?
        options:
        - भविष्य को
        - अतीत को
        - किसी को नहीं
        answer: भविष्य को
        why: युवा आगे की ओर देखते हैं; वृद्ध अतीत की ओर।
  items:
  - prompt: '''क्या लिखूँ?'' निबंध के लेखक कौन हैं?'
    options:
    - पदुमलाल पुन्नालाल बख्शी
    - प्रेमचंद
    - मोहन राकेश
    - शेखर जोशी
    answer: पदुमलाल पुन्नालाल बख्शी
    difficulty: 1
    hints:
    - सरस्वती पत्रिका के प्रसिद्ध संपादक।
    - ललित निबंधकार।
    solution: 'चरण 1: यह एक ललित निबंध है। चरण 2: इसके लेखक पदुमलाल पुन्नालाल बख्शी हैं।'
    mistakes:
      प्रेमचंद: hin9g_author
  - prompt: लेखक को किन दो विषयों पर निबंध लिखना था?
    options:
    - दूर के ढोल सुहावने होते हैं और समाज-सुधार
    - मेरा गाँव और मेरा देश
    - विज्ञान और धर्म
    - पर्यावरण और प्रदूषण
    answer: दूर के ढोल सुहावने होते हैं और समाज-सुधार
    difficulty: 1
    hints:
    - एक विषय एक कहावत है।
    - दूसरा समाज को बदलने से जुड़ा है।
    solution: 'चरण 1: पहला विषय कहावत ''दूर के ढोल सुहावने होते हैं'' है। चरण 2: दूसरा ''समाज-सुधार''।'
    mistakes:
      मेरा गाँव और मेरा देश: hin9g_read_again
  - prompt: लेखक के अनुसार निबंध के दो मुख्य अंग कौन-से हैं?
    options:
    - सामग्री और शैली
    - कागज़ और कलम
    - शीर्षक और अंत
    - प्रश्न और उत्तर
    answer: सामग्री और शैली
    difficulty: 1
    hints:
    - क्या कहना है और कैसे कहना है।
    - पहले जुटाई जाती है, फिर सजाई जाती है।
    solution: 'चरण 1: क्या लिखना है = सामग्री। चरण 2: कैसे लिखना है = शैली।'
    mistakes: {"कागज़ और कलम": "h9_nibandh_ang", "शीर्षक और अंत": "h9_nibandh_ang"}
  - prompt: '''दूर के ढोल सुहावने होते हैं'' का भाव क्या है?'
    options:
    - दूर की चीज़ें कल्पना में अच्छी लगती हैं, पास जाने पर सच्चाई कुछ और होती है
    - ढोल हमेशा मधुर बजता है
    - दूर रहना सबसे अच्छा है
    - ढोल पास से ज़्यादा सुंदर लगता है
    answer: दूर की चीज़ें कल्पना में अच्छी लगती हैं, पास जाने पर सच्चाई कुछ और होती है
    difficulty: 2
    hints:
    - दूरी कठोरता को ढक देती है।
    - कल्पना मिठास भर देती है।
    solution: 'चरण 1: दूर से कठोर ध्वनि भी मधुर लगती है। चरण 2: उसी तरह दूर की चीज़ें कल्पना में सुंदर लगती हैं; पास से सच दिखता है।'
    mistakes:
      दूर रहना सबसे अच्छा है: hin9g_poem_meaning
  - prompt: लेखक के अनुसार समाज-सुधार की ज़रूरत हर युग में क्यों बनी रहती है?
    options:
    - क्योंकि हर युग में नए दोष पैदा होते रहते हैं
    - क्योंकि समाज कभी नहीं बदलता
    - क्योंकि सुधारक नहीं होते
    - क्योंकि पुराने सुधार गलत थे
    answer: क्योंकि हर युग में नए दोष पैदा होते रहते हैं
    difficulty: 2
    hints:
    - बुद्ध से गांधी तक सुधारक हुए।
    - समय के साथ नई समस्याएँ।
    solution: 'चरण 1: समाज बदलता रहता है। चरण 2: बदलाव से नए दोष आते हैं, इसलिए नए सुधार भी चाहिए।'
    mistakes: {"क्योंकि समाज कभी नहीं बदलता": "h9_sudhar"}
  - prompt: अंत में लेखक दोनों विषयों के साथ क्या करता है?
    options:
    - समय कम होने से दोनों को एक ही निबंध में समेट देता है
    - दोनों विषय छोड़ देता है
    - केवल समाज-सुधार पर लिखता है
    - किसी और से लिखवा लेता है
    answer: समय कम होने से दोनों को एक ही निबंध में समेट देता है
    difficulty: 3
    hints:
    - समय और सामग्री दोनों कम थे।
    - एक तीर से दो निशाने।
    solution: 'चरण 1: लेखक के पास समय कम था। चरण 2: इसलिए उसने दोनों विषयों को एक ही निबंध में जोड़ दिया।'
    mistakes:
      दोनों विषय छोड़ देता है: hin9g_read_again
  - prompt: '''क्या लिखूँ?'' किस विधा की रचना है?'
    options:
    - ललित निबंध
    - कहानी
    - कविता
    - नाटक
    answer: ललित निबंध
    difficulty: 1
    hints:
    - इसमें लेखक अपने विचार आत्मीय ढंग से रखता है।
    - यह गद्य है, कथा नहीं।
    solution: यह पदुमलाल पुन्नालाल बख्शी का ललित निबंध है।
    mistakes:
      कहानी: h9g_vidha
  - prompt: निबंध-शैली का प्रवर्तक किसे माना जाता है?
    options:
    - मोंतेन
    - कबीर
    - प्रेमचंद
    - गांधी
    answer: मोंतेन
    difficulty: 2
    hints:
    - वह एक फ्रांसीसी लेखक थे।
    - मन की मौज में स्वच्छंद निबंध लिखते थे।
    solution: लेखक मोंतेन को निबंध-शैली का प्रवर्तक बताता है।
    mistakes:
      कबीर: h9g_nibandh_vishay
