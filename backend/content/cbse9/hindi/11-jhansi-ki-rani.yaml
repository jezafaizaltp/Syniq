    - झाँसी ने कर नहीं दिया था
    - रानी ने उन्हें बुलाया था
    - झाँसी में सोने की खान मिली थी
    answer: राजा की मृत्यु के बाद निःसंतान राज्य को हड़पने की नीति से
    difficulty: 2
    hints:
    - डलहौज़ी की नीति।
    - राजा का अपना पुत्र नहीं था।
    solution: 'चरण 1: राजा गंगाधर राव की मृत्यु हो गई। चरण 2: डलहौज़ी की नीति से अंग्रेज़ निःसंतान राज्य हड़प लेते थे।'
    mistakes: {"झाँसी ने कर नहीं दिया था": "h9_hadap_niti"}
  - prompt: इस कविता का मुख्य भाव क्या है?
    options:
