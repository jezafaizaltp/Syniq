subject: cbse9-hin
chapter: 11
title: झाँसी की रानी
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_1857: "रानी लक्ष्मीबाई अंग्रेज़ों के विरुद्ध पहले बड़े संग्राम में लड़ीं, जो 1947 से लगभग नब्बे साल पहले हुआ था।"
  h9_hadap_niti: "राजा की मृत्यु के बाद उनका अपना बेटा नहीं था। अंग्रेज़ों की एक नीति ऐसे राज्यों को हड़प लेती थी।"
  h9_tek: "टेक हर पद के अंत में लौटती है। इस कविता में कौन-सी पंक्ति बार-बार आती है?"
concepts:
- code: hin9g.c11.jhansi
  title: झाँसी की रानी (सुभद्रा कुमारी चौहान)
  notes: |
    सुभद्रा कुमारी चौहान की प्रसिद्ध वीर-रस की कविता, जिसकी टेक है: "बुंदेले हरबोलों के मुँह हमने सुनी कहानी
    थी, खूब लड़ी मर्दानी वह तो झाँसी वाली रानी थी।" कविता 1857 के स्वतंत्रता संग्राम में रानी लक्ष्मीबाई के
    जीवन और संघर्ष की कथा है। वे पिता की अकेली संतान थीं, बचपन से तलवार, बरछी, कटार चलाना और घुड़सवारी
    सीखी; नाना साहब उनके मुँहबोले भाई थे। झाँसी के राजा गंगाधर राव से विवाह हुआ; राजा की मृत्यु के बाद
    अंग्रेज़ों (डलहौज़ी) ने निःसंतान राज्य को हड़पने की नीति से झाँसी पर कब्ज़ा करना चाहा। रानी ने अंग्रेज़ों
    से लोहा लिया, कालपी और ग्वालियर तक लड़ीं और ग्वालियर के पास लड़ते-लड़ते वीरगति पाई। कवि लिखती हैं कि वे
    केवल तेईस वर्ष की थीं (कविता के अनुसार)। भाव: साहस, देशभक्ति, स्त्री-शक्ति और स्वतंत्रता के लिए बलिदान।
  explanations:
    text: 'यह कविता झाँसी की रानी लक्ष्मीबाई की कहानी गीत की तरह सुनाती है: बचपन में तलवार चलाना सीखने से लेकर 1857 में अंग्रेज़ों से वीरता से लड़ने और देश के लिए प्राण देने तक। हर छंद के अंत में टेक आती है: ''खूब लड़ी मर्दानी वह तो झाँसी वाली रानी थी।'''
    visual: घोड़े पर सवार रानी, एक हाथ में तलवार, पीठ पर बच्चा बँधा हुआ, पीछे झाँसी का किला और आगे अंग्रेज़ी सेना।
    step_by_step: 'चरण 1: बचपन और शस्त्र-शिक्षा। चरण 2: झाँसी के राजा गंगाधर राव से विवाह। चरण 3: राजा की मृत्यु और अंग्रेज़ों का झाँसी हड़पना। चरण 4: 1857 का युद्ध। चरण 5: ग्वालियर के पास वीरगति। चरण 6: टेक में उनकी वीरता का गुणगान।'
    real_world: नेताजी सुभाष चंद्र बोस की आज़ाद हिंद फ़ौज में महिलाओं की टुकड़ी का नाम 'झाँसी की रानी रेजिमेंट' रखा गया था।
  items:
  - prompt: '''झाँसी की रानी'' कविता की कवयित्री कौन हैं?'
    options:
    - सुभद्रा कुमारी चौहान
    - महादेवी वर्मा
    - मीराबाई
    - सरोजिनी नायडू
    answer: सुभद्रा कुमारी चौहान
    difficulty: 1
    hints:
    - स्वयं भी स्वतंत्रता सेनानी।
    - '''खूब लड़ी मर्दानी…'''
    solution: 'चरण 1: यह प्रसिद्ध वीर-रस की कविता है। चरण 2: इसे सुभद्रा कुमारी चौहान ने लिखा।'
    mistakes:
      महादेवी वर्मा: hin9g_author
  - prompt: रानी लक्ष्मीबाई ने किस वर्ष के स्वतंत्रता संग्राम में भाग लिया?
    answer: '1857'
    check: '1857'
    difficulty: 1
    hints:
    - भारत का पहला स्वतंत्रता संग्राम।
    - उन्नीसवीं सदी का मध्य।
    solution: 'चरण 1: कविता 1857 के संग्राम की है। चरण 2: उत्तर: 1857।'
    mistakes: {"1947": "h9_1857", "1942": "h9_1857"}
  - prompt: कविता की टेक (बार-बार आने वाली पंक्ति) क्या है?
    options:
    - खूब लड़ी मर्दानी वह तो झाँसी वाली रानी थी
    - प्रभु जी तुम चंदन हम पानी
    - भारति, जय, विजयकरे
    - मैं और मेरा देश
    answer: खूब लड़ी मर्दानी वह तो झाँसी वाली रानी थी
    difficulty: 1
    hints:
    - हर छंद के अंत में आती है।
    - रानी की वीरता।
    solution: 'चरण 1: टेक हर छंद के अंत में दोहराई जाती है। चरण 2: वह है ''खूब लड़ी मर्दानी वह तो झाँसी वाली रानी थी''।'
    mistakes: {"प्रभु जी तुम चंदन हम पानी": "h9_tek"}
  - prompt: रानी लक्ष्मीबाई के पति कौन थे?
    options:
    - झाँसी के राजा गंगाधर राव
    - नाना साहब
    - तात्या टोपे
    - डलहौज़ी
    answer: झाँसी के राजा गंगाधर राव
    difficulty: 2
    hints:
    - झाँसी के राजा।
    - नाना साहब मुँहबोले भाई थे।
    solution: 'चरण 1: लक्ष्मीबाई का विवाह झाँसी के राजा से हुआ। चरण 2: वे गंगाधर राव थे।'
    mistakes:
      नाना साहब: hin9g_read_again
  - prompt: अंग्रेज़ों ने झाँसी पर कब्ज़ा करना क्यों चाहा?
    options:
    - राजा की मृत्यु के बाद निःसंतान राज्य को हड़पने की नीति से
    - झाँसी ने कर नहीं दिया था
    - रानी ने उन्हें बुलाया था
    - झाँसी में सोने की खान मिली थी
    answer: राजा की मृत्यु के बाद निःसंतान राज्य को हड़पने की नीति से
    difficulty: 2
    hints:
    - डलहौज़ी की नीति।
    - राजा का अपना पुत्र नहीं था।
    solution: 'चरण 1: राजा गंगाधर राव की मृत्यु हो गई। चरण 2: डलहौज़ी की नीति से अंग्रेज़ निःसंतान राज्य हड़प लेते थे।'
    mistakes: {"झाँसी ने कर नहीं दिया था": "h9_hadap_niti"}
  - prompt: इस कविता का मुख्य भाव क्या है?
    options:
    - साहस, देशभक्ति और स्वतंत्रता के लिए बलिदान
    - प्रकृति की सुंदरता
    - बचपन की शरारतें
    - घर की याद
    answer: साहस, देशभक्ति और स्वतंत्रता के लिए बलिदान
    difficulty: 3
    hints:
    - वीर रस।
    - रानी ने प्राण दिए।
    solution: 'चरण 1: कविता रानी की वीरता बताती है। चरण 2: उसका भाव साहस, देशभक्ति और बलिदान है।'
    mistakes:
      प्रकृति की सुंदरता: hin9g_poem_meaning
