    - रानी ने प्राण दिए।
    solution: 'चरण 1: कविता रानी की वीरता बताती है। चरण 2: उसका भाव साहस, देशभक्ति और बलिदान है।'
    mistakes:
      प्रकृति की सुंदरता: hin9g_poem_meaning
  - prompt: कविता के अनुसार रानी लक्ष्मीबाई की उम्र वीरगति के समय कितनी थी?
    answer: 23
    check: '23'
    difficulty: 2
    hints:
    - कवयित्री कहती हैं वे बहुत युवा थीं।
    - बीस से कुछ अधिक।
    solution: कविता में कहा गया है कि रानी केवल तेईस वर्ष की थीं।
