  - prompt: रानी लक्ष्मीबाई के पति कौन थे?
    options:
    - झाँसी के राजा गंगाधर राव
    - नाना साहब
    - तात्या टोपे
    - डलहौज़ी
    answer: झाँसी के राजा गंगाधर राव
