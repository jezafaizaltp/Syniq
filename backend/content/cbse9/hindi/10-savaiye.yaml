# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 10
title: सवैये
concepts:
- code: hin9c.k10.raskhan
  title: सवैये (रसखान)
  notes: |
    रसखान, कृष्ण-भक्त मुस्लिम कवि; भाषा ब्रजभाषा, छंद सवैया। पहला सवैया: 'मानुष हौं तो वही रसखानि बसौं ब्रज
    गोकुल गाँव के ग्वारन' — हर जन्म में ब्रज से जुड़ा रहना चाहते हैं: मनुष्य हों तो ग्वाला, पशु हों तो नंद की
    गायों में, पत्थर हों तो गोवर्धन पर्वत का, पक्षी हों तो कालिंदी (यमुना) के कदंब पर बसेरा। दूसरा: 'या
    लकुटी अरु कामरिया पर राज तिहूँ पुर को तजि डारौं' — कृष्ण की लाठी और कंबल के लिए तीनों लोकों का राज्य
    छोड़ने को तैयार; आठों सिद्धियाँ और नौ निधियाँ भी। तीसरा: गोपी कृष्ण का रूप धरना चाहती है — मोरपंख, गुंजा की
    माला, पीतांबर, लाठी — पर मुरली अधरों पर नहीं रखेगी। चौथा: मुरली की धुन और मुस्कान से बच न पाने की बात।
  explanations:
    text: 'रसखान कृष्ण के इतने बड़े भक्त हैं कि हर जन्म में ब्रज में ही रहना चाहते हैं: मनुष्य बनें तो ग्वाला, पशु बनें तो नंद की गाय, पत्थर बनें तो गोवर्धन का, पक्षी बनें तो यमुना किनारे कदंब पर। कृष्ण की लाठी और कंबल के लिए वे तीनों लोकों का राज भी छोड़ देंगे।'
    visual: 'चार चित्र बनाइए: ब्रज का ग्वाला, नंद की गाय, गोवर्धन पर्वत का पत्थर, और यमुना किनारे कदंब के पेड़ पर बैठा पक्षी। ये चारों रूप रसखान की इच्छा हैं।'
    step_by_step: '1. कवि और ब्रजभाषा के सवैये का परिचय। 2. हर जन्म में ब्रज: ग्वाला, गाय, पत्थर, पक्षी। 3. लाठी और कंबल के लिए तीनों लोकों का त्याग। 4. गोपी का कृष्ण का रूप धरना, पर मुरली नहीं। 5. मुरली की धुन का जादू।'
    real_world: जिस जगह से हमें गहरा लगाव होता है, जैसे अपना गाँव, वहाँ हम बार-बार लौटना चाहते हैं। रसखान को ब्रज से ऐसा ही प्रेम था।
  picture:
    kind: compare
    columns:
    - title: अगले जन्म में रूप
      points:
      - 'मनुष्य: गोकुल का ग्वाला'
      - 'पशु: नंद की गाय'
      - 'पत्थर: गोवर्धन पर्वत का'
      - 'पक्षी: कालिंदी किनारे कदंब पर'
    - title: जिसके लिए सब छोड़ दें
      points:
      - कृष्ण की लाठी और कंबल
      - तीनों लोकों का राज
      - आठ सिद्धियाँ, नौ निधियाँ
    alt: 'पहले स्तंभ में अगले जन्मों के चार रूप हैं: ग्वाला, नंद की गाय, गोवर्धन का पत्थर और कदंब पर पक्षी। दूसरे में वह है जो रसखान कृष्ण की लाठी और कंबल के लिए छोड़ देंगे: तीनों लोकों का राज और सिद्धियाँ-निधियाँ।'
  items:
  - prompt: सवैयों के रचयिता कौन हैं?
    options:
    - रसखान
    - कबीर
    - तुलसीदास
    - बिहारी
    answer: रसखान
    difficulty: 1
    hints:
    - कृष्ण-भक्त मुस्लिम कवि।
    - नाम में 'रस' है।
    solution: रसखान।
    mistakes:
      कबीर: hcbse_author
  - prompt: रसखान के सवैये किस भाषा में हैं?
    options:
    - ब्रजभाषा
    - अवधी
    - खड़ी बोली
    - कश्मीरी
    answer: ब्रजभाषा
    difficulty: 1
    hints:
    - कृष्ण की भूमि की भाषा।
    - ब्रज।
    solution: ब्रजभाषा में।
  - prompt: कवि पशु बनें तो कहाँ रहना चाहते हैं?
    options:
    - नंद की गायों के बीच
    - जंगल में शेरों के साथ
    - राजा के अस्तबल में
    - पहाड़ पर बकरियों के साथ
    answer: नंद की गायों के बीच
    difficulty: 1
    hints:
    - कृष्ण के पिता नंद।
    - चरैं नित नंद की धेनु मँझारन।
    solution: नंद की गायों के बीच चरना चाहते हैं।
    mistakes:
      राजा के अस्तबल में: hcbse_read_again
  - prompt: पत्थर बनें तो कवि किस पर्वत का पत्थर बनना चाहते हैं?
    options:
    - गोवर्धन
    - हिमालय
    - विंध्याचल
    - कैलाश
    answer: गोवर्धन
    difficulty: 2
    hints:
    - जिसे कृष्ण ने उँगली पर उठाया।
    - ब्रज में है।
    solution: गोवर्धन पर्वत का, जिसे कृष्ण ने उठाया था।
  - prompt: कवि किसके लिए तीनों लोकों का राज छोड़ने को तैयार हैं?
    options:
    - कृष्ण की लाठी और कंबल के लिए
    - सोने के महल के लिए
    - राजा की कृपा के लिए
    - मुरली सीखने के लिए
    answer: कृष्ण की लाठी और कंबल के लिए
    difficulty: 2
    hints:
    - '''या लकुटी अरु कामरिया पर''।'
    - लकुटी = लाठी, कामरिया = कंबल।
    solution: कृष्ण की लकुटी (लाठी) और कामरिया (कंबल) के लिए।
  - prompt: गोपी कृष्ण का रूप धरती है, पर कौन-सी चीज़ अपने होंठों पर नहीं रखेगी?
    options:
    - मुरली
    - मोरपंख
    - गुंजा की माला
    - पीतांबर
    answer: मुरली
    difficulty: 3
    hints:
    - उसे उस चीज़ से ईर्ष्या है।
    - जो कृष्ण के होंठों से लगी रहती है।
    solution: वह मुरली अपने अधरों पर नहीं रखेगी, क्योंकि वह कृष्ण के होंठों से लगी रहने वाली उसकी 'सौतन' है।
    mistakes:
      मोरपंख: hcbse_poem_meaning
