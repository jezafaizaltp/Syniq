          - उमा बोल उठती है
          - '''लड़कियाँ बेजान सामान नहीं'''
          - शंकर की असलियत बताती है
          alt: गोपाल प्रसाद उमा से सामान की तरह गाने, सिलाई और पेंटिंग पर सवाल करते हैं; उमा बोल उठती है कि लड़कियाँ बेजान सामान नहीं, और शंकर की असलियत बताती है।
      - style: real_world
        teach: कोई दुकान में सब्ज़ी उलट-पलटकर देखता है कि ताज़ी है या नहीं। गोपाल प्रसाद उमा से वैसे ही सवाल पूछते हैं, जैसे कोई चीज़ ख़रीद रहे हों। उमा का विरोध इसी अपमान के ख़िलाफ़ है।
    - teach: 'शंकर को ''बिना रीढ़ की हड्डी'' का कहा गया है: वह पिता की हर बात मानता है, उसका अपना कोई मत नहीं। विषय: दहेज और स्त्री-शिक्षा पर समाज की सोच, और स्त्री का आत्मसम्मान।'
      check:
        prompt: '''बिना रीढ़ की हड्डी'' का अर्थ है…'
