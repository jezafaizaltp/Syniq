    - teach: 'शंकर को ''बिना रीढ़ की हड्डी'' का कहा गया है: वह पिता की हर बात मानता है, उसका अपना कोई मत नहीं। विषय: दहेज और स्त्री-शिक्षा पर समाज की सोच, और स्त्री का आत्मसम्मान।'
      check:
