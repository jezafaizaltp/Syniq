        answer: लड़के वाले कम पढ़ी लड़की चाहते थे
        why: यह समाज की संकीर्ण सोच दिखाता है।
    - teach: 'गोपाल प्रसाद (वकील) अपने बेटे शंकर (मेडिकल का छात्र) के साथ आते हैं और उमा से गाने, सिलाई, पेंटिंग के बारे में ऐसे पूछताछ करते हैं, जैसे कोई सामान ख़रीद रहे हों। अंत में उमा बोल उठती है: लड़कियाँ भी इंसान हैं, बेजान सामान नहीं। वह बताती है कि शंकर पिछली फ़रवरी में लड़कियों के हॉस्टल के आस-पास पकड़ा गया था।'
      picture:
