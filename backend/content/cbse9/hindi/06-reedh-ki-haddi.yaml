subject: cbse9-hin
chapter: 6
title: रीढ़ की हड्डी
tips:
  hcbse_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hcbse_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे और परिचय पाठ के आरंभ में दिया गया है।'
  hcbse_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
concepts:
- code: hin9g.c6.reedh
  title: रीढ़ की हड्डी (जगदीश चंद्र माथुर)
  notes: |
    जगदीश चंद्र माथुर का एकांकी। रामस्वरूप अपनी बेटी उमा की शादी के लिए लड़के वालों के आने की तैयारी करते
    हैं; पत्नी प्रेमा और नौकर रतन मदद करते हैं। उमा बी.ए. पास है, पर लड़के वाले कम पढ़ी लड़की चाहते हैं,
    इसलिए उसकी पढ़ाई छिपाई जाती है। गोपाल प्रसाद (वकील) अपने बेटे शंकर (मेडिकल का छात्र) के साथ आते हैं और
    उमा से गाने, सिलाई, पेंटिंग के बारे में पूछताछ करते हैं, जैसे कोई सामान ख़रीद रहे हों। उमा अंत में बोल
    उठती है: लड़कियाँ भी इंसान हैं, बेजान सामान नहीं; वह बताती है कि शंकर पिछली फ़रवरी में लड़कियों के
    हॉस्टल के आस-पास पकड़ा गया था। शंकर को 'बिना रीढ़ की हड्डी' का कहा गया है: वह पिता की हर बात मानता है,
    अपना कोई मत नहीं। विषय: दहेज और स्त्री-शिक्षा पर समाज की सोच, स्त्री का आत्मसम्मान।
  explanations:
    text: इस एकांकी में उमा पढ़ी-लिखी है, पर लड़के वाले कम पढ़ी बहू चाहते हैं, इसलिए उसके पिता यह बात छिपाते हैं। लड़के के पिता उमा को सामान की तरह जाँचते हैं। अंत में उमा साहस से बोलती है कि लड़कियाँ भी इंसान हैं, और लड़के शंकर की कमज़ोरी उजागर करती है, जिसकी अपनी कोई 'रीढ़ की हड्डी' नहीं।
    visual: 'एक मंच बनाइए: बीच में तख़्त पर चाय-नाश्ता, एक तरफ़ रामस्वरूप और उमा, दूसरी तरफ़ गोपाल प्रसाद और झुका हुआ, सिकुड़ा बैठा शंकर। अंत के दृश्य में उमा खड़ी होकर बोल रही है और सब चौंके हुए हैं।'
    step_by_step: '1. रामस्वरूप की तैयारी और उमा की पढ़ाई छिपाना। 2. गोपाल प्रसाद और शंकर का आना। 3. उमा से सामान की तरह पूछताछ। 4. उमा का साहस से बोलना और शंकर की पोल खोलना। 5. शीर्षक का अर्थ: बिना रीढ़ का शंकर।'
    real_world: आज भी कई जगह रिश्ते के समय लड़कियों से ऐसे सवाल पूछे जाते हैं जैसे वे कोई सामान हों। उमा की तरह अपनी बात कहने का साहस बदलाव लाता है।
  picture:
    kind: flow
    steps:
    - रामस्वरूप बेटी उमा के रिश्ते के लिए तैयारी करते हैं
    - उमा की बी.ए. की पढ़ाई लड़के वालों से छिपाई जाती है
    - गोपाल प्रसाद और बेटा शंकर आते हैं; उमा से सामान की तरह पूछताछ
    - 'उमा साहस से बोलती है: लड़कियाँ भी इंसान हैं'
    - 'वह शंकर की कमज़ोरी उजागर करती है: ''बिना रीढ़ की हड्डी'''
    alt: 'एकांकी का क्रम: रिश्ते की तैयारी, उमा की पढ़ाई छिपाना, लड़के वालों की पूछताछ, उमा का साहसी जवाब, और शंकर की कमज़ोरी का खुलना।'
  items:
  - prompt: '''रीढ़ की हड्डी'' के लेखक कौन हैं?'
    options:
    - जगदीश चंद्र माथुर
    - फणीश्वरनाथ रेणु
    - मृदुला गर्ग
    - राजेश जोशी
    answer: जगदीश चंद्र माथुर
    difficulty: 1
    hints:
    - एकांकीकार।
    - '''कोणार्क'' नाटक भी लिखा।'
    solution: जगदीश चंद्र माथुर।
    mistakes:
      राजेश जोशी: hcbse_author
  - prompt: '''रीढ़ की हड्डी'' किस विधा की रचना है?'
    options:
    - एकांकी
    - रिपोर्ताज
    - कविता
    - यात्रा-वृत्तांत
    answer: एकांकी
    difficulty: 1
    hints:
    - एक अंक का नाटक।
    - मंच पर खेला जाता है।
    solution: यह एक एकांकी है।
  - prompt: उमा की पढ़ाई क्यों छिपाई गई?
    options:
    - लड़के वाले कम पढ़ी लड़की चाहते थे
    - उमा फ़ेल हो गई थी
    - उमा को पढ़ाई पसंद नहीं थी
    - पिता को पढ़ाई पर शर्म थी
    answer: लड़के वाले कम पढ़ी लड़की चाहते थे
    difficulty: 1
    hints:
    - उमा बी.ए. पास थी।
    - गोपाल प्रसाद की सोच।
    solution: गोपाल प्रसाद को ज़्यादा पढ़ी लड़की नहीं चाहिए थी, इसलिए उमा की बी.ए. की पढ़ाई छिपाई गई।
    mistakes:
      उमा फ़ेल हो गई थी: hcbse_read_again
  - prompt: गोपाल प्रसाद के बेटे का नाम क्या है?
    options:
    - शंकर
    - रतन
    - रामस्वरूप
    - प्रेमा
    answer: शंकर
    difficulty: 1
    hints:
    - मेडिकल का छात्र।
    - रतन नौकर है।
    solution: शंकर।
    mistakes:
      रतन: hcbse_read_again
  - prompt: उमा ने अंत में क्या कहा?
    options:
    - लड़कियाँ भी इंसान हैं, बेजान सामान नहीं
    - वह शादी के लिए तैयार है
    - वह गाना सुनाएगी
    - वह घर छोड़ देगी
    answer: लड़कियाँ भी इंसान हैं, बेजान सामान नहीं
    difficulty: 2
    hints:
    - उसे सामान की तरह जाँचा जा रहा था।
    - उसका आत्मसम्मान।
    solution: उसने कहा कि लड़कियाँ भी इंसान हैं, उनका भी दिल होता है; उन्हें सामान की तरह नहीं परखा जा सकता।
  - prompt: शीर्षक 'रीढ़ की हड्डी' किसकी ओर संकेत करता है?
    options:
    - शंकर, जिसकी अपनी कोई राय या दृढ़ता नहीं
    - उमा की बीमारी
    - गोपाल प्रसाद की चोट
    - रामस्वरूप की कुर्सी
    answer: शंकर, जिसकी अपनी कोई राय या दृढ़ता नहीं
    difficulty: 3
    hints:
    - वह झुककर बैठता है और पिता की हर बात मानता है।
    - 'मुहावरा: रीढ़ न होना = दृढ़ता न होना।'
    solution: 'शंकर बिना रीढ़ का है: उसका अपना कोई मत या साहस नहीं, वह पिता की हाँ में हाँ मिलाता है।'
    mistakes:
      उमा की बीमारी: hcbse_poem_meaning
