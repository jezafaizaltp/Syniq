subject: cbse9-hin
chapter: 6
title: रीढ़ की हड्डी
tips:
  hcbse_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hcbse_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे और परिचय पाठ के आरंभ में दिया गया है।'
  hcbse_poem_meaning: 'कविता में कही बात के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_ekanki: "रिपोर्ताज किसी घटना की रिपोर्ट होता है। 'रीढ़ की हड्डी' मंच पर खेला जाने वाला एक अंक का नाटक है।"
  h9_uma: "उमा अंत में चुप नहीं रहती। वह लड़कियों के सम्मान के बारे में क्या कहती है?"
  h9g_ekanki_patra: एकांकी के पात्र याद करो। कौन पिता है, कौन माँ, कौन नौकर, कौन लड़के वाले?
  h9g_reedh_arth: रीढ़ शरीर को सीधा खड़ा रखती है। सोचो, 'बिना रीढ़ का' व्यक्ति अपने विचारों पर खड़ा रह पाता है या नहीं?
  h9g_uma_vichar: उमा के अंतिम शब्दों को याद करो। वह लड़कियों को सामान मानती है या इंसान?
  h9g_samaj_soch: सोचो कि लड़के वालों को उमा की पढ़ाई से क्या आपत्ति थी, और यह समाज की किस सोच को दिखाता है।
  pqc9h6_apna_mat: रीढ़ की हड्डी शरीर को सीधा खड़ा रखती है। जिस व्यक्ति का अपना कोई मत नहीं, उसे क्या कहेंगे?
concepts:
- code: hin9g.c6.reedh
  title: रीढ़ की हड्डी (जगदीश चंद्र माथुर)
  notes: |
    जगदीश चंद्र माथुर का एकांकी। रामस्वरूप अपनी बेटी उमा की शादी के लिए लड़के वालों के आने की तैयारी करते
    हैं; पत्नी प्रेमा और नौकर रतन मदद करते हैं। उमा बी.ए. पास है, पर लड़के वाले कम पढ़ी लड़की चाहते हैं,
    इसलिए उसकी पढ़ाई छिपाई जाती है। गोपाल प्रसाद (वकील) अपने बेटे शंकर (मेडिकल का छात्र) के साथ आते हैं और
    उमा से गाने, सिलाई, पेंटिंग के बारे में पूछताछ करते हैं, जैसे कोई सामान ख़रीद रहे हों। उमा अंत में बोल
    उठती है: लड़कियाँ भी इंसान हैं, बेजान सामान नहीं; वह बताती है कि शंकर पिछली फ़रवरी में लड़कियों के
    हॉस्टल के आस-पास पकड़ा गया था। शंकर को 'बिना रीढ़ की हड्डी' का कहा गया है: वह पिता की हर बात मानता है,
    अपना कोई मत नहीं। विषय: दहेज और स्त्री-शिक्षा पर समाज की सोच, स्त्री का आत्मसम्मान।
  explanations:
    text: इस एकांकी में उमा पढ़ी-लिखी है, पर लड़के वाले कम पढ़ी बहू चाहते हैं, इसलिए उसके पिता यह बात छिपाते हैं। लड़के के पिता उमा को सामान की तरह जाँचते हैं। अंत में उमा साहस से बोलती है कि लड़कियाँ भी इंसान हैं, और लड़के शंकर की कमज़ोरी उजागर करती है, जिसकी अपनी कोई 'रीढ़ की हड्डी' नहीं।
    visual: 'एक मंच बनाइए: बीच में तख़्त पर चाय-नाश्ता, एक तरफ़ रामस्वरूप और उमा, दूसरी तरफ़ गोपाल प्रसाद और झुका हुआ, सिकुड़ा बैठा शंकर। अंत के दृश्य में उमा खड़ी होकर बोल रही है और सब चौंके हुए हैं।'
    step_by_step: '1. रामस्वरूप की तैयारी और उमा की पढ़ाई छिपाना। 2. गोपाल प्रसाद और शंकर का आना। 3. उमा से सामान की तरह पूछताछ। 4. उमा का साहस से बोलना और शंकर की पोल खोलना। 5. शीर्षक का अर्थ: बिना रीढ़ का शंकर।'
    real_world: आज भी कई जगह रिश्ते के समय लड़कियों से ऐसे सवाल पूछे जाते हैं जैसे वे कोई सामान हों। उमा की तरह अपनी बात कहने का साहस बदलाव लाता है।
  picture:
    kind: flow
    steps:
    - रामस्वरूप बेटी उमा के रिश्ते के लिए तैयारी करते हैं
    - उमा की बी.ए. की पढ़ाई लड़के वालों से छिपाई जाती है
    - गोपाल प्रसाद और बेटा शंकर आते हैं; उमा से सामान की तरह पूछताछ
    - 'उमा साहस से बोलती है: लड़कियाँ भी इंसान हैं'
    - 'वह शंकर की कमज़ोरी उजागर करती है: ''बिना रीढ़ की हड्डी'''
    alt: 'एकांकी का क्रम: रिश्ते की तैयारी, उमा की पढ़ाई छिपाना, लड़के वालों की पूछताछ, उमा का साहसी जवाब, और शंकर की कमज़ोरी का खुलना।'
  activity:
    type: sort
    prompt: एकांकी में यह किसके बारे में है?
    bins:
    - रामस्वरूप
    - गोपाल प्रसाद
    - शंकर
    - उमा
    items:
    - label: बेटी की बी.ए. की पढ़ाई छिपाते हैं
      bin: रामस्वरूप
      clue: उमा की शादी की चिंता किसे है?
      why: लड़के वाले कम पढ़ी लड़की चाहते हैं, इसलिए पिता पढ़ाई छिपाते हैं।
    - label: लड़के वालों के आने की तैयारी
      bin: रामस्वरूप
      clue: किसके घर मेहमान आ रहे हैं?
      why: रामस्वरूप प्रेमा और रतन के साथ तैयारी करते हैं।
    - label: गाने-सिलाई की पूछताछ, जैसे सामान खरीदना
      bin: गोपाल प्रसाद
      clue: लड़के का पिता कौन है?
      why: वकील गोपाल प्रसाद उमा को सामान की तरह परखते हैं।
    - label: पिता की हर बात मानता है
      bin: शंकर
      clue: बिना रीढ़ की हड्डी किसे कहा गया?
      why: शंकर का अपना कोई मत नहीं।
    - label: लड़कियों के हॉस्टल के पास पकड़ा गया था
      bin: शंकर
      clue: उमा किसकी पोल खोलती है?
      why: उमा बताती है कि शंकर पिछली फ़रवरी में पकड़ा गया था।
    - label: '"लड़कियाँ भी इंसान हैं"'
      bin: उमा
      clue: अंत में कौन बोल उठती है?
      why: उमा अपने आत्मसम्मान के लिए बोलती है।
  lesson:
    - teach: '''रीढ़ की हड्डी'' जगदीश चंद्र माथुर का एकांकी है। एकांकी एक अंक का नाटक होता है। रामस्वरूप अपनी बेटी उमा की शादी के लिए लड़के वालों के आने की तैयारी करते हैं; पत्नी प्रेमा और नौकर रतन मदद करते हैं। उमा बी.ए. पास है, पर लड़के वाले कम पढ़ी लड़की चाहते हैं, इसलिए उसकी पढ़ाई छिपाई जाती है।'
      check:
        prompt: 'जाँचो: उमा की पढ़ाई क्यों छिपाई गई?'
        options:
        - लड़के वाले कम पढ़ी लड़की चाहते थे
        - उमा फ़ेल हुई थी
        - उमा ने कहा था
        answer: लड़के वाले कम पढ़ी लड़की चाहते थे
        why: यह समाज की संकीर्ण सोच दिखाता है।
      ways:
      - style: visual
        teach: एकांकी के मुख्य पात्र और उनकी भूमिका, दो परिवारों में बाँटकर।
        picture:
          kind: compare
          columns:
          - title: लड़की वाले
            points:
            - रामस्वरूप (पिता)
            - प्रेमा (माँ)
            - उमा (बी.ए. पास)
            - रतन (नौकर)
          - title: लड़के वाले
            points:
            - गोपाल प्रसाद (वकील)
            - शंकर (मेडिकल छात्र)
          alt: लड़की वालों में रामस्वरूप, प्रेमा, उमा और नौकर रतन हैं; लड़के वालों में वकील गोपाल प्रसाद और उनका बेटा शंकर हैं।
      - style: step_by_step
        teach: 'पहला: विधा पहचानो: एकांकी, यानी एक अंक का नाटक। दूसरा: स्थिति: उमा की शादी के लिए लड़के वाले आने वाले हैं। तीसरा: समस्या: उमा बी.ए. पास है, पर लड़के वाले कम पढ़ी लड़की चाहते हैं। चौथा: इसलिए उसकी पढ़ाई छिपाई जाती है।'
    - teach: 'गोपाल प्रसाद (वकील) अपने बेटे शंकर (मेडिकल का छात्र) के साथ आते हैं और उमा से गाने, सिलाई, पेंटिंग के बारे में ऐसे पूछताछ करते हैं, जैसे कोई सामान ख़रीद रहे हों। अंत में उमा बोल उठती है: लड़कियाँ भी इंसान हैं, बेजान सामान नहीं। वह बताती है कि शंकर पिछली फ़रवरी में लड़कियों के हॉस्टल के आस-पास पकड़ा गया था।'
      picture:
        kind: compare
        columns:
        - title: लड़के वालों की सोच
          points:
          - कम पढ़ी लड़की चाहिए
          - लड़की से सामान जैसी पूछताछ
