subject: cbse9-hin
chapter: 7
title: मैं और मेरा देश
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  h9_japani_yuvak: "जापानी युवक ने पैसे नहीं लिए। उसे अपने देश की इज़्ज़त की चिंता थी।"
  h9_pustakalay: "एक विद्यार्थी ने पुस्तकालय में गलत काम किया। उसका असर किस पर पड़ा: केवल उस पर या उसके पूरे देश पर?"
  h9_vote: "लेखक नागरिक से अपेक्षा करते हैं कि वह सोच-समझकर वोट दे।"
  h9g_udaharan: लेखक के उदाहरण याद करो। किस प्रसंग में कौन व्यक्ति था और उसने क्या किया?
  h9g_desh_samman: सोचो कि एक नागरिक का व्यवहार दूसरों की नज़र में पूरे देश की छवि कैसे बनाता है।
  h9g_kartavya: 'लेखक के बताए कर्तव्य याद करो: देश की शक्ति, सुंदरता और सम्मान बढ़ाने वाले काम।'
concepts:
- code: hin9g.c7.desh
  title: मैं और मेरा देश (कन्हैयालाल मिश्र 'प्रभाकर')
  notes: |
    कन्हैयालाल मिश्र 'प्रभाकर' का निबंध, व्यक्ति और देश के अटूट संबंध पर। लेखक पहले मानता है कि घर,
    पड़ोस और नगर से जुड़कर वह पूर्ण है, पर लाला लाजपत राय की बात पढ़कर, जिन्होंने विदेश में भारत की
    गुलामी का कलंक अपने माथे पर महसूस किया, उसके मन में 'मानसिक भूकंप' आता है: देश की उच्चता या हीनता
    हर नागरिक के सम्मान से जुड़ी है। उदाहरण: स्वामी रामतीर्थ से एक जापानी युवक ने फलों का मूल्य यही माँगा
    कि वे अपने देश जाकर यह न कहें कि जापान में अच्छे फल नहीं मिलते; एक विदेशी युवक की चोरी के कारण उसके
    देश के लोगों का एक पुस्तकालय में प्रवेश रोक दिया गया; तुर्की के राष्ट्रपति कमालपाशा ने एक बूढ़े किसान
    की थोड़ी-सी शहद की भेंट सम्मान से ली; नेहरू जी ने किसान की रंगीन खाट स्वीकार की। लेखक कहता है कि
    जीवन एक युद्ध है जिसमें 'जय बोलने वाले' भी ज़रूरी हैं, और 'अकेला चना भाड़ नहीं फोड़ सकता' को अपने
    अनुभव से गलत मानता है। कर्तव्य: देश के शक्तिबोध और सौंदर्यबोध (स्वच्छता, शिष्टता) को बढ़ाना, कोई ऐसा
    काम न करना जिससे देश का सम्मान घटे, और सही व्यक्ति को वोट देना।
  explanations:
    text: 'लेखक कहते हैं: मैं ही अपना देश हूँ। विदेश में किसी एक नागरिक का अच्छा या बुरा व्यवहार पूरे देश की छवि बनाता या बिगाड़ता है। इसलिए हर नागरिक का छोटा-सा काम भी देश के सम्मान से जुड़ा है।'
    visual: 'एक बड़े तिरंगे के बीच बहुत-से छोटे लोग: एक कूड़ा उठाता बच्चा, वोट देती महिला, सड़क पार कराता युवक। हर व्यक्ति से तिरंगे तक एक चमकती रेखा।'
    step_by_step: 'चरण 1: व्यक्ति घर-नगर से जुड़कर पूर्ण नहीं होता। चरण 2: लाला लाजपत राय का अनुभव: देश का अपमान = मेरा अपमान। चरण 3: जापान, पुस्तकालय, कमालपाशा, नेहरू के उदाहरण। चरण 4: कर्तव्य और अधिकार। चरण 5: अकेला व्यक्ति भी बदलाव ला सकता है।'
    real_world: विदेश में भारतीय खिलाड़ी या यात्री का अच्छा व्यवहार वहाँ के लोगों के मन में भारत की अच्छी छवि बनाता है।
  activity:
    type: sort
    prompt: निबंध के उदाहरण देश का सम्मान बढ़ाते हैं या घटाते हैं?
    bins:
    - सम्मान बढ़ाया
    - सम्मान घटाया
    items:
    - label: जापानी युवक ने फलों के बदले देश का मान माँगा
      bin: सम्मान बढ़ाया
      clue: युवक ने स्वामी रामतीर्थ से पैसों के बदले क्या माँगा?
      why: वह चाहता था कि कोई न कहे कि जापान में अच्छे फल नहीं मिलते।
    - label: विदेशी युवक ने पुस्तकालय में चोरी की
      bin: सम्मान घटाया
      clue: उसके बाद उसके देशवासियों के साथ क्या हुआ?
      why: एक की चोरी से पूरे देश के लोगों का प्रवेश रुका।
    - label: कमालपाशा ने किसान का शहद सम्मान से लिया
      bin: सम्मान बढ़ाया
      clue: राष्ट्रपति ने छोटी भेंट को कैसे लिया?
      why: 'छोटे किसान का मान: देश का मान।'
    - label: नेहरू जी ने किसान की रंगीन खाट स्वीकारी
      bin: सम्मान बढ़ाया
      clue: यह उदाहरण कमालपाशा जैसा है या चोरी जैसा?
      why: आम नागरिक की भेंट का आदर।
    - label: सार्वजनिक जगह पर गंदगी फैलाना
      bin: सम्मान घटाया
      clue: लेखक देश के किस 'सौंदर्यबोध' की बात करता है?
      why: स्वच्छता देश का सौंदर्यबोध है; गंदगी उसे घटाती है।
    - label: बिना सोचे गलत व्यक्ति को वोट देना
      bin: सम्मान घटाया
      clue: लेखक नागरिक का कौन-सा कर्तव्य बताता है?
      why: सही व्यक्ति को वोट देना कर्तव्य है।
  lesson:
    - teach: '''मैं और मेरा देश'' कन्हैयालाल मिश्र ''प्रभाकर'' का निबंध है, व्यक्ति और देश के अटूट संबंध पर। लेखक पहले मानता है कि घर, पड़ोस और नगर से जुड़कर वह पूर्ण है। पर लाला लाजपत राय की बात पढ़कर, जिन्होंने विदेश में भारत की गुलामी का कलंक अपने माथे पर महसूस किया, उसके मन में ''मानसिक भूकंप'' आता है: देश की उच्चता या हीनता हर नागरिक के सम्मान से जुड़ी है।'
      check:
        prompt: लेखक के मन में 'मानसिक भूकंप' किसकी बात पढ़कर आया?
        options:
        - लाला लाजपत राय
        - नेहरू जी
        - कमालपाशा
        answer: लाला लाजपत राय
        why: उन्होंने विदेश में गुलामी का कलंक महसूस किया था।
    - teach: 'उदाहरण: एक जापानी युवक ने स्वामी रामतीर्थ से फलों का मूल्य यही माँगा कि वे अपने देश जाकर यह न कहें कि जापान में अच्छे फल नहीं मिलते। एक विदेशी युवक की चोरी के कारण उसके देश के लोगों का एक पुस्तकालय में प्रवेश रोक दिया गया। तुर्की के राष्ट्रपति कमालपाशा ने एक बूढ़े किसान की थोड़ी-सी शहद की भेंट सम्मान से ली; नेहरू जी ने किसान की रंगीन खाट स्वीकार की।'
      picture:
        kind: compare
        columns:
        - title: देश का सम्मान बढ़ा
          points:
          - जापानी युवक की फल-भेंट
          - कमालपाशा ने शहद लिया
          - नेहरू ने खाट ली
        - title: देश का सम्मान घटा
          points:
          - एक युवक की चोरी
          - उसके देश के लोगों पर रोक
        alt: 'निबंध के उदाहरण: किन कामों से देश का सम्मान बढ़ा और किससे घटा।'
      check:
        prompt: एक युवक की चोरी का क्या परिणाम हुआ?
        options:
        - उसके देश के सब लोगों का पुस्तकालय में प्रवेश रुका
        - उसे इनाम मिला
        - कुछ नहीं हुआ
        answer: उसके देश के सब लोगों का पुस्तकालय में प्रवेश रुका
        why: एक व्यक्ति का काम पूरे देश की छवि बनाता है।
    - teach: 'लेखक कहता है कि जीवन एक युद्ध है जिसमें ''जय बोलने वाले'' भी ज़रूरी हैं, और ''अकेला चना भाड़ नहीं फोड़ सकता'' को अपने अनुभव से गलत मानता है। नागरिक के कर्तव्य: देश के शक्तिबोध और सौंदर्यबोध (स्वच्छता, शिष्टता) को बढ़ाना, ऐसा कोई काम न करना जिससे देश का सम्मान घटे, और सही व्यक्ति को वोट देना।'
      check:
        prompt: सौंदर्यबोध बढ़ाने का एक उदाहरण है…
        options:
        - सड़क पर कूड़ा न फेंकना
        - झगड़ा करना
        - चोरी करना
        answer: सड़क पर कूड़ा न फेंकना
        why: स्वच्छता देश को सुंदर बनाती है।
  items:
  - prompt: '''मैं और मेरा देश'' निबंध के लेखक कौन हैं?'
    options:
    - कन्हैयालाल मिश्र 'प्रभाकर'
    - पदुमलाल पुन्नालाल बख्शी
    - यतीन्द्र मिश्र
    - जगदीशचंद्र माथुर
    answer: कन्हैयालाल मिश्र 'प्रभाकर'
    difficulty: 1
    hints:
    - उपनाम 'प्रभाकर'।
    - स्वतंत्रता सेनानी और पत्रकार।
    solution: 'चरण 1: निबंध व्यक्ति और देश के संबंध पर है। चरण 2: लेखक कन्हैयालाल मिश्र ''प्रभाकर'' हैं।'
    mistakes:
      पदुमलाल पुन्नालाल बख्शी: hin9g_author
  - prompt: किसने विदेश में भारत की गुलामी का कलंक अपने माथे पर महसूस किया?
    options:
    - लाला लाजपत राय
    - महात्मा गांधी
    - स्वामी विवेकानंद
    - भगत सिंह
    answer: लाला लाजपत राय
    difficulty: 1
    hints:
    - '''पंजाब केसरी''।'
    - इससे लेखक के मन में 'मानसिक भूकंप' आया।
    solution: 'चरण 1: लेखक ने लाला जी का अनुभव पढ़ा। चरण 2: लाला लाजपत राय ने विदेश में यह कलंक महसूस किया।'
    mistakes:
      महात्मा गांधी: hin9g_read_again
  - prompt: स्वामी रामतीर्थ से फलों के बदले जापानी युवक ने क्या माँगा?
    options:
    - कि वे अपने देश जाकर न कहें कि जापान में अच्छे फल नहीं मिलते
    - बहुत सारा पैसा
    - एक पुस्तक
    - भारत आने का निमंत्रण
    answer: कि वे अपने देश जाकर न कहें कि जापान में अच्छे फल नहीं मिलते
    difficulty: 2
    hints:
    - उसे अपने देश के सम्मान की चिंता थी।
    - मूल्य पैसे में नहीं था।
    solution: 'चरण 1: स्वामी जी ने कहा था कि जापान में अच्छे फल नहीं मिलते। चरण 2: युवक ने फल लाकर मूल्य यही माँगा कि यह बात कहीं न कहें।'
    mistakes: {"बहुत सारा पैसा": "h9_japani_yuvak"}
  - prompt: पुस्तकालय वाले प्रसंग से क्या सीख मिलती है?
    options:
    - एक व्यक्ति का गलत आचरण पूरे देश की छवि बिगाड़ता है
    - पुस्तकालय में नहीं जाना चाहिए
    - विदेशी किताबें नहीं पढ़नी चाहिए
    - चोरी से कोई फ़र्क नहीं पड़ता
    answer: एक व्यक्ति का गलत आचरण पूरे देश की छवि बिगाड़ता है
    difficulty: 2
    hints:
    - एक युवक की चोरी।
    - उसके पूरे देश के लोगों पर रोक लगी।
    solution: 'चरण 1: एक विदेशी युवक ने चोरी की। चरण 2: उसके देश के सब लोगों का प्रवेश रोका गया: एक का आचरण पूरे देश से जुड़ा है।'
    mistakes: {"चोरी से कोई फ़र्क नहीं पड़ता": "h9_pustakalay"}
  - prompt: लेखक 'अकेला चना भाड़ नहीं फोड़ सकता' कहावत के बारे में क्या मानते हैं?
    options:
    - 'इसे अपने अनुभव से गलत मानते हैं: एक व्यक्ति भी बदलाव ला सकता है'
    - इसे पूरी तरह सही मानते हैं
    - इसका पाठ में कोई उल्लेख नहीं
    - वे कहते हैं कि अकेले कुछ नहीं करना चाहिए
    answer: 'इसे अपने अनुभव से गलत मानते हैं: एक व्यक्ति भी बदलाव ला सकता है'
    difficulty: 2
    hints:
    - हर नागरिक की भूमिका।
    - '''मैं अपना देश हूँ।'''
    solution: 'चरण 1: कहावत कहती है कि अकेला व्यक्ति कुछ नहीं कर सकता। चरण 2: लेखक अनुभव से मानते हैं कि एक व्यक्ति भी बहुत कुछ कर सकता है।'
    mistakes:
      इसे पूरी तरह सही मानते हैं: hin9g_read_again
  - prompt: लेखक के अनुसार चुनाव में नागरिक का कर्तव्य क्या है?
    options:
    - सही व्यक्ति को वोट देना ताकि गलत लोग सत्ता में न आएँ
    - वोट न देना
    - पैसे लेकर वोट देना
    - केवल जाति देखकर वोट देना
    answer: सही व्यक्ति को वोट देना ताकि गलत लोग सत्ता में न आएँ
    difficulty: 3
    hints:
