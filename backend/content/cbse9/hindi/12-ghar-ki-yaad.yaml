    - वे हमेशा बीमार रहते हैं
    - वे बहुत चुप रहते हैं
    - वे शहर में रहते हैं
    answer: वे भजन गाते और कसरत करते हैं
    difficulty: 2
    hints:
    - उन्हें बुढ़ापा छू भी नहीं गया।
    - वे फुर्तीले और खुशमिज़ाज हैं।
    solution: पिता दौड़ते, खिलखिलाते, भजन गाते और कसरत करते हैं।
    mistakes:
      वे हमेशा बीमार रहते हैं: h9g_ghar_sadasy
  - prompt: कवि जेल में क्यों था?
    options:
    - देश की आज़ादी के आंदोलन में भाग लेने के कारण
    - चोरी के कारण
    - झगड़े के कारण
