subject: cbse9-hin
chapter: 12
title: घर की याद
tips:
  hin9g_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hin9g_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम पाठ के आरंभ में दिया गया है।'
  hin9g_poem_meaning: 'पंक्ति के पीछे का भाव समझें: चित्र या प्रतीक जीवन की किस बात की ओर इशारा करता है?'
  h9_bharat_chhodo: "असहयोग आंदोलन में कवि छोटे थे। वे गांधी जी के 'करो या मरो' वाले आंदोलन में जेल गए थे।"
  h9_jail: "कवि भवानीप्रसाद मिश्र स्वतंत्रता आंदोलन में बंदी थे। वे घर से दूर कहाँ थे?"
  h9_sawan: "कविता में बारिश की झड़ी लगी है। बारिश का महीना कौन-सा है?"
concepts:
- code: hin9g.c12.ghar
  title: घर की याद (भवानीप्रसाद मिश्र)
  notes: |
    भवानीप्रसाद मिश्र की कविता, जो उन्होंने 1942 के 'भारत छोड़ो' आंदोलन के समय जेल में रहते हुए लिखी।
    सावन की रात है, लगातार बारिश हो रही है, और कवि को घर की बहुत याद आती है। वह घर के एक-एक सदस्य को याद
    करता है: चार भाई, चार बहनें, अनपढ़ पर ममता से भरी माँ, और पिता जी, जिन्हें बुढ़ापा छू भी नहीं गया, जो
    दौड़ते, खिलखिलाते, भजन गाते और कसरत करते हैं। वह सोचता है कि उसके बिना घर कैसा होगा, माँ-पिता उसकी याद
    में रोते होंगे। वह सावन से कहता है कि वह दूत बनकर उनके पास जाए और कहे कि उनका बेटा जेल में मज़े में है,
    खुश है, खाता-पीता और गाता है, ताकि वे दुखी न हों; अपना दुख उन्हें न बताए। भाव: परिवार से गहरा
    लगाव, देश के लिए त्याग और माता-पिता की चिंता न बढ़ाने की कोमल भावना।
  explanations:
    text: 'जेल में बंद कवि बरसात की रात घर को याद करता है: भाई-बहन, माँ और हमेशा जवान लगने वाले पिता। वह बादलों से कहता है कि जाकर माँ-पिता को बता दो कि मैं ठीक हूँ, ताकि वे दुखी न हों। देश के लिए जेल गया बेटा भी अपने परिवार को उतना ही प्यार करता है।'
    visual: जेल की खिड़की से बाहर गिरती बारिश; बादलों में एक घर का चित्र जिसमें माँ, पिता, भाई-बहन बैठे हैं; एक बादल उस घर की ओर संदेश लेकर उड़ रहा है।
    step_by_step: 'चरण 1: स्थिति: 1942, जेल, सावन की बारिश। चरण 2: घर के सदस्यों की याद। चरण 3: पिता का उत्साही स्वभाव, माँ की ममता। चरण 4: घरवालों के दुख की कल्पना। चरण 5: सावन को संदेशवाहक बनाना: कहना कि मैं मज़े में हूँ।'
    real_world: 'घर से दूर पढ़ने या काम करने वाले बच्चे अक्सर फ़ोन पर माता-पिता से कहते हैं ''मैं ठीक हूँ'', ताकि वे चिंता न करें: कवि की भावना भी यही है।'
  items:
  - prompt: '''घर की याद'' कविता के कवि कौन हैं?'
    options:
    - भवानीप्रसाद मिश्र
    - सूर्यकांत त्रिपाठी 'निराला'
    - रामनरेश त्रिपाठी
    - रैदास
    answer: भवानीप्रसाद मिश्र
    difficulty: 1
    hints:
    - '''गीत फ़रोश'' के कवि।'
    - 1942 में जेल गए।
    solution: 'चरण 1: कविता जेल में लिखी गई। चरण 2: कवि भवानीप्रसाद मिश्र हैं।'
    mistakes:
      रामनरेश त्रिपाठी: hin9g_author
  - prompt: कवि ने यह कविता कहाँ रहते हुए लिखी?
    options:
    - जेल में
    - विदेश में
    - गाँव के खेत में
    - विद्यालय में
    answer: जेल में
    difficulty: 1
    hints:
    - '''भारत छोड़ो'' आंदोलन।'
    - वे स्वतंत्रता सेनानी थे।
    solution: 'चरण 1: 1942 के आंदोलन में कवि गिरफ़्तार हुए। चरण 2: कविता जेल में लिखी गई।'
    mistakes: {"विदेश में": "h9_jail"}
  - prompt: कविता किस आंदोलन के समय की है?
    options:
    - भारत छोड़ो आंदोलन, 1942
    - असहयोग आंदोलन, 1920
    - 1857 का संग्राम
    - चिपको आंदोलन
    answer: भारत छोड़ो आंदोलन, 1942
    difficulty: 2
    hints:
    - '''करो या मरो''।'
    - द्वितीय विश्व युद्ध का समय।
    solution: 'चरण 1: कवि 1942 में जेल गए। चरण 2: यह भारत छोड़ो आंदोलन का समय था।'
    mistakes: {"असहयोग आंदोलन, 1920": "h9_bharat_chhodo"}
  - prompt: कविता में घर की याद किस मौसम में आती है?
    options:
    - सावन की बारिश में
    - कड़ी गर्मी में
    - सर्दी की धूप में
    - वसंत के मेले में
    answer: सावन की बारिश में
    difficulty: 1
    hints:
    - रात भर पानी गिरता है।
    - बादल संदेशवाहक बनते हैं।
    solution: 'चरण 1: कविता की शुरुआत लगातार बरसते पानी से होती है। चरण 2: यह सावन का मौसम है।'
    mistakes: {"कड़ी गर्मी में": "h9_sawan"}
  - prompt: कवि सावन से माता-पिता तक क्या संदेश पहुँचाने को कहता है?
    options:
    - कि उनका बेटा मज़े में और खुश है
    - कि वह बहुत दुखी है
    - कि उसे तुरंत छुड़ाया जाए
    - कि वह घर नहीं लौटेगा
    answer: कि उनका बेटा मज़े में और खुश है
    difficulty: 2
    hints:
    - वह उनकी चिंता नहीं बढ़ाना चाहता।
    - अपना दुख छिपाता है।
    solution: 'चरण 1: कवि नहीं चाहता कि माता-पिता दुखी हों। चरण 2: वह कहलवाता है कि वह मज़े में है।'
    mistakes:
      कि वह बहुत दुखी है: hin9g_poem_meaning
  - prompt: कवि अपने पिता का वर्णन कैसे करता है?
    options:
    - ऐसे व्यक्ति जिन्हें बुढ़ापा छू भी नहीं गया, जो दौड़ते, हँसते और भजन गाते हैं
    - बीमार और चुपचाप रहने वाले
    - बहुत कठोर और गुस्सैल
    - हमेशा परदेस में रहने वाले
    answer: ऐसे व्यक्ति जिन्हें बुढ़ापा छू भी नहीं गया, जो दौड़ते, हँसते और भजन गाते हैं
    difficulty: 3
    hints:
    - उत्साह से भरे।
    - कसरत भी करते हैं।
    solution: 'चरण 1: कवि पिता को उत्साही बताता है। चरण 2: वे बूढ़े होकर भी जवानों जैसे दौड़ते, खिलखिलाते और भजन गाते हैं।'
    mistakes:
      बीमार और चुपचाप रहने वाले: hin9g_read_again
