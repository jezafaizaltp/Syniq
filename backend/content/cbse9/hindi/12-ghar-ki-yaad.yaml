    - वह उनसे नाराज़ है
    - उसे कोई दुख नहीं
    - वह उन्हें भूल गया
    answer: ताकि वे और दुखी न हों
    difficulty: 2
    hints:
    - वे पहले से उसकी याद में रोते होंगे।
    - बेटे की कोमल भावना।
    solution: कवि नहीं चाहता कि उसके दुख से माता-पिता की चिंता और बढ़े।
    mistakes:
      वह उनसे नाराज़ है: h9g_sandesh_saawan
  - prompt: कवि के पिता की कौन-सी बात कविता में बताई गई है?
    options:
