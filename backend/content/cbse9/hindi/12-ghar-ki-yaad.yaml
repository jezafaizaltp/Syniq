    answer: देश की आज़ादी के आंदोलन में भाग लेने के कारण
    difficulty: 2
    hints:
    - 1942 का साल याद करो।
    - बहुत से स्वतंत्रता सेनानी जेल गए।
    solution: कवि भारत छोड़ो आंदोलन में भाग लेने के कारण जेल में था।
