# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 6
title: मेघ आए

tips:
  hcbse_megh_guest: "कवि ने बादलों (मेघ) को शहर से सज-धजकर आए मेहमान (दामाद/पाहुन) के रूप में दिखाया है।"

concepts:
  - code: hin9c.k6.megh
    title: मेघ आए (सर्वेश्वर दयाल सक्सेना)
    notes: |
      सर्वेश्वर दयाल सक्सेना की कविता। मेघ को गाँव में बहुत दिनों बाद आए शहरी मेहमान (पाहुन/दामाद) की
      तरह चित्रित किया गया है: 'मेघ आए बड़े बन-ठन के सँवर के'। आगे-आगे बयार नाचती-गाती चलती है;
      लोग खिड़की-दरवाज़े खोलकर देखते हैं; पेड़ गरदन उचकाकर झाँकते हैं; आँधी चली, धूल घाघरा उठाए भागी;
      नदी ठिठकी, घूँघट सरकाकर देखती है; बूढ़े पीपल ने आगे बढ़कर जुहार की; 'बरस बाद सुधि लीन्हीं' कहकर
      लता किवाड़ की ओट से उलाहना देती है; ताल परात भर पानी लाया; क्षितिज अटारी पर बिजली चमकी; 'क्षमा करो
      गाँठ खुल गई अब भरम की'; मिलन के आँसू ढलके (बारिश)। मानवीकरण अलंकार, ग्रामीण संस्कृति।
    explanations:
      text: "इस कविता में बादल ऐसे आते हैं जैसे कोई दामाद बहुत दिनों बाद सज-धजकर ससुराल आया हो। हवा आगे-आगे नाचती-गाती चलती है, पेड़ झाँकते हैं, नदी घूँघट सरकाकर देखती है, बूढ़ा पीपल स्वागत करता है, और लता शिकायत करती है कि इतने दिन बाद याद आई। अंत में बिजली चमकती है और मिलन के आँसू, यानी बारिश, बरसने लगते हैं।"
      visual: "गाँव का दृश्य: आसमान में बादल (मेहमान), आगे भागती हवा, झुककर झाँकते पेड़, घूँघट वाली नदी, दरवाज़े पर बूढ़ा पीपल, किवाड़ के पीछे शरमाई लता, पानी से भरी परात लिए तालाब।"
      step_by_step: "1. मेघ = सजा-धजा मेहमान। 2. बयार = आगे चलने वाली, मेहमान के आने की ख़बर। 3. पेड़, नदी, पीपल, लता, ताल = गाँव के लोग। 4. बिजली और बारिश = मिलन और ख़ुशी के आँसू। 5. अलंकार: मानवीकरण।"
      real_world: "केरल में जून में जब मानसून आता है, सब लोग जैसे किसी प्रिय मेहमान की प्रतीक्षा करते हैं। यह कविता उसी ख़ुशी को गाँव के रिश्तों के रूप में दिखाती है।"
    items:
      - prompt: "'मेघ आए' कविता के कवि कौन हैं?"
        options: ["सर्वेश्वर दयाल सक्सेना", "कबीर", "सुमित्रानंदन पंत", "माखनलाल चतुर्वेदी"]
        answer: "सर्वेश्वर दयाल सक्सेना"
        difficulty: 1
        hints: ["आधुनिक कवि।", "'तीसरा सप्तक' के कवि।"]
        solution: "सर्वेश्वर दयाल सक्सेना।"
        mistakes: {"कबीर": hcbse_author}
      - prompt: "कविता में मेघों की तुलना किससे की गई है?"
        options: ["शहर से आए सजे-धजे मेहमान (दामाद) से", "राजा से", "सैनिक से", "बच्चों से"]
        answer: "शहर से आए सजे-धजे मेहमान (दामाद) से"
        difficulty: 1
        hints: ["'बड़े बन-ठन के सँवर के'।", "पाहुन।"]
        solution: "मेघ शहरी मेहमान/दामाद की तरह आते हैं।"
        mistakes: {"राजा से": hcbse_megh_guest}
      - prompt: "मेहमान का स्वागत किसने आगे बढ़कर किया?"
        options: ["बूढ़े पीपल ने", "नदी ने", "लता ने", "बिजली ने"]
        answer: "बूढ़े पीपल ने"
        difficulty: 2
        hints: ["घर के बड़े-बुज़ुर्ग की तरह।", "'जुहार की'।"]
        solution: "बूढ़े पीपल ने आगे बढ़कर जुहार (स्वागत) किया।"
      - prompt: "कविता में मुख्य रूप से कौन-सा अलंकार है?"
        options: ["मानवीकरण", "यमक", "श्लेष", "अनुप्रास मात्र"]
        answer: "मानवीकरण"
        difficulty: 2
        hints: ["पेड़, नदी, हवा इंसानों जैसे व्यवहार करते हैं।", "मानव जैसा बनाना।"]
        solution: "प्रकृति को मनुष्य की तरह दिखाया गया है: मानवीकरण।"
      - prompt: "'ताल' (तालाब) मेहमान के लिए क्या लाया?"
        options: ["परात भर पानी", "फूलों की माला", "मिठाई", "दीपक"]
        answer: "परात भर पानी"
        difficulty: 2
        hints: ["मेहमान के पैर धोने के लिए।", "पुरानी ग्रामीण परंपरा।"]
        solution: "ताल परात भर पानी लाया, मेहमान के पैर धोने के लिए।"
      - prompt: "कविता के अंत में 'मिलन के आँसू' किसके प्रतीक हैं?"
        options: ["बारिश के", "दुख के", "बिजली के", "हवा के"]
        answer: "बारिश के"
        difficulty: 3
        hints: ["मेघ और धरती का मिलन।", "बादल बरसे।"]
        solution: "मिलन के आँसू बरसती बारिश के प्रतीक हैं।"
        mistakes: {"दुख के": hcbse_poem_meaning}
