    - हम बचपन में फरसा चलाते थे
    - हमने बचपन में बहुत पढ़ाई की
    answer: हमने बचपन में बहुत-सी धनुहियाँ तोड़ीं
    difficulty: 2
    hints:
    - छोटे धनुष।
    - तब आपने क्रोध नहीं किया।
    solution: लक्ष्मण कहते हैं कि बचपन में बहुत धनुहियाँ तोड़ीं, तब तो आप नाराज़ नहीं हुए।
    mistakes: {"हमने बचपन में बहुत युद्ध जीते": "h9_dhanuhi"}
  - prompt: राम का स्वभाव इस संवाद में कैसा है?
    options:
    - विनम्र और शांत
    - क्रोधी
    - व्यंग्यपूर्ण
    - डरपोक
    answer: विनम्र और शांत
    difficulty: 1
    hints:
    - वे परशुराम को 'नाथ' कहते हैं।
    - स्थिति सँभालते हैं।
    solution: राम विनम्रता और शांति से परशुराम का क्रोध कम करने का प्रयास करते हैं।
    mistakes: {"व्यंग्यपूर्ण": "h9_ram_swabhav", "क्रोधी": "h9_ram_swabhav"}
  - prompt: '''कुम्हड़बतिया'' से लक्ष्मण का क्या आशय है?'
    options:
    - कमज़ोर जो तर्जनी देखते ही मुरझा जाए
    - बहुत बलवान योद्धा
    - एक प्रकार का धनुष
    - परशुराम का फरसा
    answer: कमज़ोर जो तर्जनी देखते ही मुरझा जाए
    difficulty: 2
    hints:
    - छोटा कोमल फल।
    - हम ऐसे नहीं हैं।
    solution: लक्ष्मण कहते हैं कि वे कुम्हड़बतिया जैसे कमज़ोर नहीं जो उँगली देखकर डर जाएँ।
    mistakes: {"बहुत बलवान योद्धा": "h9_kumhadbatiya"}
  - prompt: यह अंश किस छंद में है?
    options:
    - दोहा-चौपाई
    - सवैया
    - पद
    - मुक्त छंद
    answer: दोहा-चौपाई
    difficulty: 2
    hints:
    - रामचरितमानस का छंद।
    - अवधी भाषा।
    solution: रामचरितमानस दोहा-चौपाई छंद में लिखा गया है।
    mistakes: {"सवैया": "h9_doha_chaupai", "पद": "h9_doha_chaupai"}
  - prompt: यह अंश रामचरितमानस के किस कांड से है?
    options:
    - बालकांड
    - अयोध्याकांड
    - सुंदरकांड
    - लंकाकांड
    answer: बालकांड
    difficulty: 2
    hints:
    - राम-सीता विवाह से पहले की कथा।
    - राम के बचपन और युवावस्था का भाग।
    solution: सीता-स्वयंवर की कथा बालकांड में है।
    mistakes:
      सुंदरकांड: h9g_granth
  - prompt: रामचरितमानस किस भाषा में लिखा गया है?
    options:
