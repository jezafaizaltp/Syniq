        answer: विनम्रता से
        why: राम शांत रहकर स्थिति सँभालते हैं।
    - teach: 'लक्ष्मण व्यंग्य करते हैं: बचपन में हमने ऐसी बहुत-सी धनुहियाँ (छोटे धनुष) तोड़ीं, तब आपने क्रोध नहीं किया; यह पुराना धनुष तो राम के छूते ही टूट गया। परशुराम अपने फरसे, बाल-ब्रह्मचारी होने और सहस्रबाहु की भुजाएँ काटने की बात कहकर डराते हैं।'
      picture:
        kind: compare
