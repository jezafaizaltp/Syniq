          - शांत
          - स्थिति सँभालते हैं
        - title: लक्ष्मण
          points:
          - व्यंग्य करते हैं
          - निडर
          - तर्क देते हैं
        - title: परशुराम
          points:
          - क्रोधित
          - फरसा दिखाते हैं
          - अपनी वीरता गिनाते हैं
        alt: 'संवाद के तीन पात्रों का स्वभाव: राम विनम्र, लक्ष्मण व्यंग्य करने वाले, परशुराम क्रोधित।'
      check:
        prompt: परशुराम किस हथियार से डराते हैं?
