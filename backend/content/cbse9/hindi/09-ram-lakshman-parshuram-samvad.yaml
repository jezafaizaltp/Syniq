        answer: युद्ध में
        why: सच्चे वीर अपनी वीरता का बखान नहीं करते।
  items:
  - prompt: यह अंश किस ग्रंथ से लिया गया है?
    options:
    - रामचरितमानस
    - सूरसागर
    - पद्मावत
    - कामायनी
    answer: रामचरितमानस
    difficulty: 1
    hints:
    - तुलसीदास की रचना।
    - बालकांड।
    solution: यह तुलसीदास के रामचरितमानस के बालकांड से है।
