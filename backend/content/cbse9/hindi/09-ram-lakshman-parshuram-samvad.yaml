    - ब्रज
    - खड़ी बोली
    - संस्कृत
    answer: अवधी
    difficulty: 2
    hints:
    - अयोध्या क्षेत्र की बोली।
    - सूरदास ब्रज में लिखते थे।
    solution: तुलसीदास ने रामचरितमानस अवधी में लिखा।
    mistakes:
      ब्रज: h9g_granth
  - prompt: '''धनुही'' का अर्थ है…'
    options:
    - छोटा धनुष
    - बड़ा धनुष
    - तीर
    - ढाल
    answer: छोटा धनुष
    difficulty: 1
    hints:
    - लक्ष्मण ने बचपन में ऐसी कई तोड़ीं।
    - बच्चों के खेलने वाला।
    solution: धनुही यानी छोटा धनुष, जिससे बच्चे खेलते हैं।
    mistakes:
      बड़ा धनुष: h9g_shabd_arth
  - prompt: परशुराम ने किसकी भुजाएँ काटने की बात कही?
    options:
    - सहस्रबाहु
    - रावण
    - कंस
    - दुर्योधन
    answer: सहस्रबाहु
    difficulty: 2
    hints:
    - नाम में 'हज़ार भुजाओं' का भाव है।
    - वह एक प्रतापी राजा था।
    solution: परशुराम ने सहस्रबाहु की भुजाएँ काटने का गर्व से उल्लेख किया।
    mistakes:
      रावण: h9g_swabhav
  - prompt: संवाद के समय विश्वामित्र क्या करते हैं?
    options:
    - मन ही मन हँसते हैं
