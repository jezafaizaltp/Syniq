subject: cbse9-hin
chapter: 9
title: राम-लक्ष्मण-परशुराम संवाद
tips:
  h9_dhanuhi: "लक्ष्मण कहते हैं कि बचपन में ऐसी चीज़ें बहुत तोड़ीं। धनुष के छोटे रूप को क्या कहते हैं?"
  h9_dhanush: "परशुराम शिव के भक्त थे। सभा में शिव से जुड़ी कौन-सी चीज़ टूट गई थी?"
  h9_doha_chaupai: "यह अंश तुलसीदास के रामचरितमानस से है। मानस किन छंदों में लिखा गया है?"
  h9_kumhadbatiya: "कुम्हड़ा (कद्दू) के छोटे फल उँगली दिखाने से मुरझा जाते हैं, ऐसी लोक-मान्यता है। लक्ष्मण इसे किस अर्थ में कहते हैं?"
  h9_ram_swabhav: "लक्ष्मण व्यंग्य करते हैं, परशुराम क्रोध करते हैं। राम कैसे बोलते हैं?"
  h9g_swabhav: तीनों पात्रों का स्वभाव याद करो। कौन शांत और विनम्र है, कौन व्यंग्य करता है, कौन क्रोधित है?
  h9g_vyangya: लक्ष्मण सीधे नहीं बोलते, बात घुमाकर चुभाते हैं। उनके कथन का छिपा अर्थ क्या है?
  h9g_granth: सोचो कि यह कथा किस बड़े ग्रंथ के किस भाग से है और किस भाषा में लिखी गई।

concepts:
- code: hin9g.c9.samvad
  title: राम-लक्ष्मण-परशुराम संवाद
  notes: |
    तुलसीदास के 'रामचरितमानस' (बालकांड) से, अवधी में, दोहा-चौपाई छंद। सीता-स्वयंवर में राम द्वारा शिव-धनुष तोड़े
    जाने पर परशुराम क्रोधित होकर आते हैं। राम विनम्रता से कहते हैं कि धनुष तोड़ने वाला कोई आपका दास ही होगा।
    लक्ष्मण व्यंग्य करते हैं कि बचपन में हमने ऐसी बहुत-सी धनुहियाँ तोड़ीं, तब आपने क्रोध नहीं किया; यह पुराना
    धनुष तो राम के छूते ही टूट गया। परशुराम अपने फरसे, बाल-ब्रह्मचारी होने और सहस्रबाहु की भुजाएँ काटने की
    बात कहकर डराते हैं। लक्ष्मण कहते हैं कि वीर युद्ध में पराक्रम दिखाते हैं, बातों में नहीं; हम कुम्हड़बतिया
    (छुई-मुई) नहीं जो तर्जनी देखकर मुरझा जाएँ। विश्वामित्र मन ही मन हँसते हैं; राम शांत रहकर स्थिति सँभालते हैं।
  explanations:
    text: 'शिव का धनुष टूटने पर परशुराम बहुत क्रोधित होते हैं। राम विनम्र रहते हैं, पर लक्ष्मण व्यंग्य से उनका क्रोध और भड़का देते हैं: बचपन में तो हमने बहुत धनुहियाँ तोड़ी थीं! यह संवाद क्रोध और विनम्रता, वीरता और डींग के बीच का अंतर दिखाता है।'
    visual: 'कल्पना कीजिए: स्वयंवर-सभा में टूटा धनुष, फरसा उठाए क्रोधित परशुराम, मुस्कुराते लक्ष्मण, हाथ जोड़े शांत राम, और पास बैठे मन ही मन हँसते विश्वामित्र।'
    step_by_step: '1. प्रसंग: धनुष-भंग। 2. राम की विनम्रता। 3. लक्ष्मण के व्यंग्य: धनुहियाँ, पुराना धनुष। 4. परशुराम की डींग: फरसा, सहस्रबाहु। 5. लक्ष्मण का उत्तर: वीर बातें नहीं, काम करते हैं।'
    real_world: बहस में शांत रहने वाला अक्सर बात बिगड़ने से बचा लेता है, जैसे राम ने किया, जबकि चुभते व्यंग्य से गुस्सा और बढ़ता है।
  picture:
    kind: compare
    columns:
    - title: राम
      points:
      - विनम्र और शांत
      - धनुष तोड़ने वाला आपका दास होगा
      - क्रोध को शांत करते हैं
    - title: लक्ष्मण
      points:
      - व्यंग्य करते हैं
      - बचपन में बहुत धनुहियाँ तोड़ीं
      - वीर बातें नहीं, काम करते हैं
    - title: परशुराम
      points:
      - अत्यंत क्रोधित
      - फरसा और सहस्रबाहु की बात
      - अपनी वीरता की डींग
    alt: राम विनम्र और शांत हैं, लक्ष्मण व्यंग्य करते हैं, और परशुराम क्रोध में अपनी वीरता की बातें करते हैं।
  activity:
    type: sort
    prompt: संवाद में यह बात किसकी है?
    bins:
    - राम
    - लक्ष्मण
    - परशुराम
    items:
    - label: धनुष तोड़नेवाला कोई आपका दास होगा
      bin: राम
      clue: विनम्रता से कौन बोलता है?
      why: राम क्रोध को शांत करने के लिए विनम्र रहते हैं।
    - label: बचपन में बहुत-सी धनुहियाँ तोड़ीं
      bin: लक्ष्मण
      clue: व्यंग्य कौन करता है?
      why: लक्ष्मण कहते हैं, तब तो आपने क्रोध नहीं किया।
    - label: पुराना धनुष छूते ही टूट गया
      bin: लक्ष्मण
      clue: धनुष को मामूली कौन बता रहा है?
      why: 'लक्ष्मण का व्यंग्य: राम का दोष नहीं।'
    - label: हम कुम्हड़बतिया नहीं
      bin: लक्ष्मण
      clue: तर्जनी देखकर मुरझाने वाली बात कौन कहता है?
      why: लक्ष्मण बताते हैं कि वे डरनेवाले नहीं।
    - label: फरसा और सहस्रबाहु की भुजाएँ
      bin: परशुराम
      clue: डराने के लिए अपने पराक्रम की बात कौन करता है?
      why: परशुराम अपने फरसे से डराते हैं।
    - label: बाल-ब्रह्मचारी होने की बात
      bin: परशुराम
      clue: यह अपनी बड़ाई कौन कर रहा है?
      why: परशुराम अपना परिचय देकर धमकाते हैं।
  lesson:
    - teach: यह अंश तुलसीदास के 'रामचरितमानस' के बालकांड से है, जो अवधी भाषा में और दोहा-चौपाई छंद में है। सीता-स्वयंवर में राम ने शिव का धनुष तोड़ दिया, तो परशुराम क्रोधित होकर आते हैं। राम विनम्रता से कहते हैं कि धनुष तोड़ने वाला कोई आपका दास ही होगा।
      check:
        prompt: राम ने परशुराम से कैसे बात की?
        options:
        - विनम्रता से
        - क्रोध से
