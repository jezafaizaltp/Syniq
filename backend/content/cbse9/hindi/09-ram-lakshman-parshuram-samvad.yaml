        answer: फरसा
        why: फरसा परशुराम का प्रसिद्ध शस्त्र है।
    - teach: लक्ष्मण कहते हैं कि वीर युद्ध में पराक्रम दिखाते हैं, बातों में नहीं; हम कुम्हड़बतिया (छुई-मुई) नहीं जो तर्जनी देखकर मुरझा जाएँ। विश्वामित्र मन ही मन हँसते हैं, और राम शांत रहकर स्थिति सँभालते हैं।
      check:
        prompt: लक्ष्मण के अनुसार वीर अपना पराक्रम कहाँ दिखाते हैं?
