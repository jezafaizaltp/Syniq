# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 11
title: कैदी और कोकिला
concepts:
- code: hin9c.k11.kaidi_kokila
  title: कैदी और कोकिला (माखनलाल चतुर्वेदी)
  notes: |
    माखनलाल चतुर्वेदी ('एक भारतीय आत्मा'), स्वतंत्रता सेनानी कवि। कविता में अंग्रेज़ी शासन में जेल में बंद एक
    स्वतंत्रता सेनानी आधी रात को कोयल की आवाज़ सुनकर उससे पूछता है: 'क्या गाती हो? क्यों रह-रह जाती हो?
    कोकिल बोलो तो!' वह जेल की यातनाएँ बताता है: काली कोठरी, हथकड़ियाँ, पेट पर जुआ, मोट खींचना, गिट्टी
    तोड़ना, चोरों-डाकुओं के साथ रहना, कम भोजन, और 'गिट्टी पर अँगुलियों ने लिखे गान'। उसे लगता है कोयल ने
    कोई दावानल (विद्रोह) की चिंगारी देखी है। अंत में कोयल की कूक में उसे आज़ादी के लिए विद्रोह का स्वर सुनाई
    देता है और वह भी बलिदान को तैयार है। काला रंग: काली रात, काली कोठरी, काली कोयल, काला शासन।
  explanations:
    text: जेल में बंद एक स्वतंत्रता सेनानी आधी रात को कोयल की कूक सुनकर उससे बातें करता है। वह बताता है कि अंग्रेज़ी जेल में उससे बैल की तरह मोट खिंचवाया जाता है, हथकड़ियाँ पहनाई जाती हैं और भूखा रखा जाता है। उसे कोयल की आवाज़ में आज़ादी की लड़ाई का संदेश सुनाई देता है।
    visual: एक अँधेरी काली कोठरी, दीवार पर ऊँची छोटी खिड़की, बाहर पेड़ पर बैठी काली कोयल और चाँद। अंदर हथकड़ियों में बँधा कैदी ऊपर देख रहा है।
    step_by_step: '1. आधी रात, जेल, कोयल की कूक। 2. कैदी के प्रश्न: क्या गाती हो? 3. जेल की यातनाएँ: हथकड़ी, मोट, गिट्टी, भूख। 4. चारों ओर कालापन: रात, कोठरी, कोयल, शासन। 5. कोयल की कूक में विद्रोह और बलिदान का संदेश।'
    real_world: भगत सिंह और कई सेनानियों ने जेल में रहकर भी आज़ादी के गीत और पत्र लिखे। यह कविता उसी हिम्मत की आवाज़ है।
  picture:
    kind: flow
    steps:
    - 'आधी रात: जेल में कैदी कोयल की कूक सुनता है'
    - 'पूछता है: ''क्या गाती हो? क्यों रह-रह जाती हो?'''
    - 'जेल की यातनाएँ: हथकड़ियाँ, मोट खींचना, गिट्टी तोड़ना'
    - 'सब काला: रात, कोठरी, कोयल और अंग्रेज़ी शासन'
    - कोयल की कूक में आज़ादी के विद्रोह का स्वर
    alt: 'कविता का क्रम: आधी रात को कोयल की आवाज़, कैदी के प्रश्न, जेल की यातनाएँ, चारों ओर का कालापन, और कूक में आज़ादी का संदेश।'
  items:
  - prompt: '''कैदी और कोकिला'' के कवि कौन हैं?'
    options:
    - माखनलाल चतुर्वेदी
    - सुमित्रानंदन पंत
    - रसखान
    - राजेश जोशी
    answer: माखनलाल चतुर्वेदी
    difficulty: 1
    hints:
    - '''एक भारतीय आत्मा'' के नाम से प्रसिद्ध।'
    - स्वतंत्रता सेनानी कवि।
    solution: माखनलाल चतुर्वेदी।
    mistakes:
      सुमित्रानंदन पंत: hcbse_author
  - prompt: कैदी कोयल की आवाज़ कब सुनता है?
    options:
    - आधी रात को
    - भोर में
    - दोपहर में
    - शाम को
    answer: आधी रात को
    difficulty: 1
    hints:
    - अँधेरा था।
    - '''आधी रात'' का उल्लेख।'
    solution: आधी रात को।
  - prompt: कविता में कैदी कौन है?
    options:
    - अंग्रेज़ी शासन में बंद स्वतंत्रता सेनानी
    - एक चोर
    - एक डाकू
    - एक राजा
    answer: अंग्रेज़ी शासन में बंद स्वतंत्रता सेनानी
    difficulty: 1
    hints:
    - उसे चोरों-डाकुओं के साथ रखा गया है।
    - वह आज़ादी चाहता है।
    solution: वह अंग्रेज़ों की जेल में बंद एक स्वतंत्रता सेनानी है।
    mistakes:
      एक चोर: hcbse_read_again
  - prompt: कैदी से जेल में कौन-सा काम करवाया जाता है?
    options:
    - बैल की तरह मोट खींचना
    - किताबें लिखना
    - बाग़ में फूल लगाना
    - खाना बनाना
    answer: बैल की तरह मोट खींचना
    difficulty: 2
    hints:
    - कुएँ से पानी खींचने का चमड़े का थैला।
    - पेट पर जुआ बाँधकर।
    solution: पेट पर जुआ बाँधकर बैल की तरह मोट (कुएँ से पानी का थैला) खिंचवाया जाता है।
  - prompt: '''गिट्टी पर अँगुलियों ने लिखे गान'' का क्या अर्थ है?'
    options:
    - पत्थर तोड़ते समय भी आज़ादी के गीत मन में रचना
    - पत्थर पर चित्र बनाना
    - अँगुलियों में चोट लगना
    - गाना भूल जाना
    answer: पत्थर तोड़ते समय भी आज़ादी के गीत मन में रचना
    difficulty: 2
    hints:
    - गिट्टी तोड़ना सज़ा थी।
    - कष्ट में भी उत्साह।
    solution: कठोर सज़ा में गिट्टी तोड़ते हुए भी वह आज़ादी के गीत रचता रहा।
    mistakes:
      अँगुलियों में चोट लगना: hcbse_poem_meaning
  - prompt: कविता में 'काला' रंग किन-किन चीज़ों का है?
    options:
    - रात, कोठरी, कोयल और अंग्रेज़ी शासन
    - केवल रात
    - केवल कोयल
    - हथकड़ियाँ और पानी
    answer: रात, कोठरी, कोयल और अंग्रेज़ी शासन
    difficulty: 3
    hints:
    - कवि चारों ओर कालापन देखता है।
    - शासन के कारनामे भी काले।
    solution: काली रात, काली कोठरी, काली कोयल और अंग्रेज़ों का काला (अन्यायपूर्ण) शासन।
