# CBSE Class 9 Hindi (NCERT Ganga, 2026-27; replaces both Hindi A and Hindi B), chapter 1. Format: content/README.md.
# Written from published summaries of the new book and memory of the texts, not the printed copy. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse9-hin
chapter: 1
title: दो बैलों की कथा
tips:
  hcbse_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही मिलेगा: उस पात्र या घटना वाला अनुच्छेद खोजें।'
  hcbse_author: 'पाठ और लेखक को साथ याद रखें: लेखक का नाम शीर्षक के नीचे और परिचय पाठ के आरंभ में दिया गया है।'
  hcbse_heera_moti: "कहानी के पहले अनुच्छेद को फिर से पढ़ो: झूरी बैलों का मालिक था और गया उसका रिश्तेदार। बैलों के नाम कीमती रत्नों के नाम पर हैं।"
  h9_bail_message: "कहानी में बैल बार-बार कैद से छूटना चाहते हैं और एक-दूसरे का साथ नहीं छोड़ते। इन दोनों बातों से क्या संदेश मिलता है?"
  h9_kanjihouse: "बैलों ने केवल अपने लिए नहीं सोचा। काँजीहौस में बंद दूसरे जानवरों के साथ उन्होंने क्या किया? वह अंश फिर पढ़ें।"
  h9_moti_friend: "मोती भाग सकता था, पर हीरा बँधा था। सच्चा मित्र ऐसे समय क्या करता है?"
  h9g_kahani_ghatna: कहानी में वह हिस्सा फिर से याद करो जहाँ यह घटना होती है। पाठ में ठीक-ठीक क्या लिखा है?
  h9g_patra: पात्रों की सूची याद करो। कौन मालिक है, कौन ले जाता है, कौन चुपके से मदद करता है?
  h9g_shabd_arth: वाक्य में शब्द को रखकर देखो। कौन-सा अर्थ वाक्य में ठीक बैठता है?
  h9g_vyakaran: वाक्य में कर्ता, लिंग और वचन देखो। फिर वही रूप चुनो जो मेल खाए।
  h9g_sandesh: सोचो कि लेखक बार-बार किस बात की ओर ध्यान खींचता है। वही मुख्य संदेश है।
concepts:
- code: hin9g.c1.bail
  title: दो बैलों की कथा (प्रेमचंद)
  notes: |
    प्रेमचंद की कहानी। झूरी काछी के दो बैल हीरा और मोती, गहरे दोस्त, मूक भाषा में बात करते। झूरी का
    साला गया उन्हें अपने घर ले जाता है; बैल समझते हैं उन्हें बेच दिया गया; रात को पगहे तुड़ाकर लौट आते
    हैं। गया फिर ले जाता है, रूखा भूसा देता है, मारता है; गया की छोटी लड़की (जिसकी माँ मर चुकी थी, सौतेली
    माँ सताती थी) चुपके से रोटियाँ खिलाती है और रस्सी खोल देती है। रास्ते में साँड़ से मिलकर लड़ते हैं और
    भगा देते हैं; मटर के खेत में पकड़े जाकर काँजीहौस में बंद होते हैं, वहाँ दीवार तोड़कर दूसरे जानवरों को
    भगाते हैं, मोती भाग सकता था पर हीरा को छोड़कर नहीं गया। नीलामी में दढ़ियल आदमी (कसाई) खरीदता है; रास्ता
    पहचानकर वे झूरी के घर भाग आते हैं। झूरी और उसकी पत्नी उन्हें प्यार करते हैं। संदेश: स्वतंत्रता, मित्रता,
    अन्याय का विरोध; गधे को 'सीधेपन' का प्रतीक बताया गया है।
  explanations:
    text: हीरा और मोती दो बैल हैं जो एक-दूसरे से बहुत प्यार करते हैं और अपने मालिक झूरी को नहीं छोड़ना चाहते। जब उन्हें गया के घर भेजा जाता है, वे बार-बार भाग आते हैं, अन्याय सहते नहीं, और मुसीबत में एक-दूसरे का साथ नहीं छोड़ते। अंत में वे झूरी के घर लौट आते हैं। कहानी आज़ादी और सच्ची दोस्ती का संदेश देती है।
    visual: 'कहानी का रास्ता बनाइए: झूरी का घर → गया का घर (भूसा, मार, छोटी लड़की की रोटियाँ) → साँड़ से लड़ाई → मटर का खेत → काँजीहौस (दीवार तोड़ना) → दढ़ियल का साथ → फिर झूरी का घर।'
    step_by_step: 1. हीरा-मोती की दोस्ती। 2. गया उन्हें ले जाता है; वे भाग आते हैं। 3. गया का कठोर व्यवहार, छोटी लड़की की दया। 4. साँड़ से मुकाबला। 5. काँजीहौस में बंदी और दूसरों को आज़ाद करना। 6. दढ़ियल से छूटकर घर वापसी।
    real_world: आज़ादी के आंदोलन के समय लिखी यह कहानी बताती है कि अन्याय के सामने चुप रहना ठीक नहीं, और सच्चे दोस्त मुश्किल में साथ नहीं छोड़ते।
  activity:
    type: order
    prompt: हीरा और मोती की यात्रा क्रम से लगाओ।
    steps:
    - गया बैलों को अपने घर ले जाता है
    - रात को पगहे तुड़ाकर झूरी के पास लौटते हैं
    - गया की लड़की रोटियाँ खिलाकर रस्सी खोलती है
    - साँड़ से लड़कर उसे भगा देते हैं
    - मटर के खेत में पकड़े जाकर काँजीहौस में बंद
    - नीलामी में दढ़ियल आदमी खरीदता है
    - रास्ता पहचानकर झूरी के घर भाग आते हैं
    reasons:
      रात को पगहे तुड़ाकर झूरी के पास लौटते हैं: लौटने के लिए पहले उन्हें झूरी के घर से दूर ले जाया जाना ज़रूरी है।
      गया की लड़की रोटियाँ खिलाकर रस्सी खोलती है: 'यह दूसरी बार गया के घर की बात है: पहली बार वे खुद भागे थे।'
      साँड़ से लड़कर उसे भगा देते हैं: रस्सी खुलने के बाद ही वे रास्ते में निकले, जहाँ साँड़ मिला।
      मटर के खेत में पकड़े जाकर काँजीहौस में बंद: साँड़ से निपटकर, भूखे होकर वे खेत में चरने लगे।
      नीलामी में दढ़ियल आदमी खरीदता है: काँजीहौस के जानवरों की ही नीलामी होती है।
      रास्ता पहचानकर झूरी के घर भाग आते हैं: दढ़ियल उन्हें ले जा रहा था, तभी उन्होंने रास्ता पहचाना।
  lesson:
    - teach: प्रेमचंद की इस कहानी में झूरी काछी के दो बैल हैं, हीरा और मोती। दोनों गहरे दोस्त हैं और मूक भाषा में एक-दूसरे से बात करते हैं। झूरी का साला गया उन्हें अपने घर ले जाता है। बैल समझते हैं कि उन्हें बेच दिया गया, इसलिए रात को पगहे तुड़ाकर झूरी के पास लौट आते हैं।
      check:
        prompt: बैल रात को क्यों लौट आए?
        options:
        - उन्हें लगा कि उन्हें बेच दिया गया
        - उन्हें भूख नहीं थी
        - गया ने उन्हें भेजा
        answer: उन्हें लगा कि उन्हें बेच दिया गया
        why: वे अपने मालिक झूरी से अलग नहीं होना चाहते थे।
    - teach: गया फिर उन्हें ले जाता है, रूखा भूसा देता है और मारता है। गया की छोटी लड़की, जिसकी माँ मर चुकी थी और सौतेली माँ सताती थी, चुपके से उन्हें रोटियाँ खिलाती है और रस्सी खोल देती है। रास्ते में वे साँड़ से लड़कर उसे भगा देते हैं। मटर के खेत में पकड़े जाकर काँजीहौस में बंद होते हैं; वहाँ दीवार तोड़कर दूसरे जानवरों को भगा देते हैं। मोती भाग सकता था, पर हीरा को छोड़कर नहीं गया।
      picture:
        kind: flow
        steps:
        - झूरी के घर
        - गया ले जाता है
        - लड़की रस्सी खोलती है
        - साँड़ से लड़ाई
        - काँजीहौस
        - नीलामी
        - झूरी के घर वापस
        alt: 'कहानी का क्रम: झूरी का घर, गया के घर, लड़की की मदद, साँड़ से लड़ाई, काँजीहौस, नीलामी, फिर झूरी के घर वापसी।'
      check:
        prompt: मोती काँजीहौस से अकेला क्यों नहीं भागा?
        options:
        - वह हीरा को अकेला छोड़ना नहीं चाहता था
        - दरवाज़ा बंद था
        - वह थका था
        answer: वह हीरा को अकेला छोड़ना नहीं चाहता था
        why: सच्ची मित्रता मुश्किल में साथ नहीं छोड़ती।
    - teach: 'नीलामी में एक दढ़ियल आदमी (कसाई) उन्हें खरीदता है, पर रास्ता पहचानकर वे झूरी के घर भाग आते हैं, जहाँ झूरी और उसकी पत्नी उन्हें प्यार करते हैं। कहानी के संदेश: स्वतंत्रता का मूल्य, सच्ची मित्रता और अन्याय का विरोध। लेखक ने गधे को ''सीधेपन'' का प्रतीक बताया है।'
      check:
        prompt: कहानी का एक मुख्य संदेश क्या है?
        options:
        - स्वतंत्रता का मूल्य
        - पैसे का महत्व
        - खेती छोड़ देना
        answer: स्वतंत्रता का मूल्य
        why: बैल बार-बार बंधन तोड़कर अपने घर लौटते हैं।
  items:
  - prompt: '''दो बैलों की कथा'' के लेखक कौन हैं?'
    options:
    - प्रेमचंद
    - हरिशंकर परसाई
    - महादेवी वर्मा
    - राहुल सांकृत्यायन
    answer: प्रेमचंद
    difficulty: 1
    hints:
    - उपन्यास सम्राट।
    - '''गोदान'' के लेखक।'
    solution: प्रेमचंद।
    mistakes:
      हरिशंकर परसाई: hcbse_author
  - prompt: दोनों बैलों के नाम क्या थे?
    options:
    - हीरा और मोती
    - झूरी और गया
    - राम और श्याम
    - नंदी और भोला
    answer: हीरा और मोती
    difficulty: 1
    hints:
    - दो कीमती रत्नों के नाम।
    - झूरी और गया तो लोग हैं।
    solution: हीरा और मोती।
    mistakes:
      झूरी और गया: hcbse_heera_moti
  - prompt: बैलों को गुपचुप रोटियाँ कौन खिलाता था?
    options:
    - गया की छोटी लड़की
    - झूरी की पत्नी
    - गया
    - दढ़ियल आदमी
    answer: गया की छोटी लड़की
    difficulty: 1
    hints:
    - उसकी माँ मर चुकी थी।
    - उसने रस्सी भी खोल दी।
    solution: गया की छोटी लड़की, जिसकी सौतेली माँ उसे सताती थी।
    mistakes:
      झूरी की पत्नी: hcbse_read_again
  - prompt: काँजीहौस में बैलों ने क्या किया?
    options:
    - दीवार तोड़कर दूसरे जानवरों को भगा दिया
    - चुपचाप भूखे पड़े रहे
    - चौकीदार को मार डाला
    - खुद अकेले भाग गए
    answer: दीवार तोड़कर दूसरे जानवरों को भगा दिया
    difficulty: 2
    hints:
    - वे दूसरों की भी आज़ादी चाहते थे।
    - मोती ने सींगों से दीवार गिराई।
    solution: उन्होंने दीवार तोड़ी और बाकी जानवरों को आज़ाद कर दिया।
    mistakes: {"खुद अकेले भाग गए": "h9_kanjihouse", "चुपचाप भूखे पड़े रहे": "h9_kanjihouse"}
  - prompt: मोती काँजीहौस से भाग सकता था, फिर भी क्यों नहीं भागा?
    options:
    - वह हीरा को अकेला छोड़ना नहीं चाहता था
    - उसे रास्ता नहीं पता था
    - वह थका हुआ था
    - उसे भूख लगी थी
    answer: वह हीरा को अकेला छोड़ना नहीं चाहता था
    difficulty: 2
    hints:
    - हीरा रस्सी से बँधा था।
    - सच्ची मित्रता।
    solution: 'हीरा बँधा था, इसलिए मोती उसे छोड़कर नहीं गया: सच्ची दोस्ती।'
    mistakes: {"वह थका हुआ था": "h9_moti_friend"}
  - prompt: कहानी का मुख्य संदेश क्या है?
    options:
    - स्वतंत्रता का मूल्य और सच्ची मित्रता
    - पशुओं को बेच देना चाहिए
    - हमेशा चुप रहना चाहिए
    - खेती कठिन काम है
    answer: स्वतंत्रता का मूल्य और सच्ची मित्रता
    difficulty: 3
    hints:
    - बैल अन्याय सहते नहीं।
    - आज़ादी के आंदोलन का समय।
    solution: कहानी आज़ादी, अन्याय के विरोध और सच्ची दोस्ती का संदेश देती है।
    mistakes: {"हमेशा चुप रहना चाहिए": "h9_bail_message"}
  - prompt: हीरा और मोती किसके बैल थे?
    options:
    - झूरी काछी
    - गया
    - दढ़ियल आदमी
    - काँजीहौस वाले
    answer: झूरी काछी
    difficulty: 1
    hints:
    - कहानी उसी के घर से शुरू होती है।
    - अंत में बैल उसी के घर लौटते हैं।
    solution: हीरा और मोती झूरी काछी के बैल थे।
    mistakes:
      गया: h9g_patra
  - prompt: गया का झूरी से क्या रिश्ता था?
    options:
    - साला
    - भाई
    - पिता
    - पड़ोसी
    answer: साला
    difficulty: 2
    hints:
    - वह झूरी की पत्नी का भाई था।
    - पत्नी के भाई को क्या कहते हैं?
    solution: पत्नी का भाई साला कहलाता है; गया झूरी का साला था।
    mistakes:
      भाई: h9g_patra
  - prompt: बैल किस खेत में पकड़े गए थे?
    options:
    - मटर के खेत में
    - गेहूँ के खेत में
    - गन्ने के खेत में
    - धान के खेत में
