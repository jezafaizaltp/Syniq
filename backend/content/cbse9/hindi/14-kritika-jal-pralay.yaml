# CBSE Class 9 Hindi A (NCERT Kritika, supplementary reader). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 14
title: 'कृतिका: इस जल प्रलय में'
concepts:
- code: hin9c.kr1.jal_pralay
  title: इस जल प्रलय में (फणीश्वरनाथ रेणु)
  notes: |
    फणीश्वरनाथ रेणु का रिपोर्ताज। लेखक बिहार के उस अंचल से हैं जहाँ बाढ़ बार-बार आती है; उन्होंने बाढ़ पीड़ितों
    की सेवा की थी, पर स्वयं बाढ़ में कभी नहीं घिरे थे। 1975 में पटना में बाढ़ आती है। लेखक राजेंद्र नगर में
    अपने घर से पानी को बढ़ते देखते हैं: लोग छतों पर, दुकानों से सामान निकालते लोग, रेडियो पर ख़बरें, गांधी
    मैदान तक पानी। रात भर पानी के आने का इंतज़ार और डर। वे पहले की बाढ़ों की यादें बताते हैं, जब वे राहत
    कार्य में गए थे और देखा कि बाढ़ में भी लोग गीत-संगीत और जीवन का उत्सव नहीं छोड़ते। रिपोर्ताज = आँखों
    देखी घटना का सजीव, साहित्यिक वर्णन।
  explanations:
    text: 'रेणु जी पटना की 1975 की बाढ़ का आँखों देखा हाल बताते हैं: कैसे पानी धीरे-धीरे शहर में बढ़ता गया, लोग डरे और इंतज़ार करते रहे। साथ ही वे पहले की बाढ़ों की यादें जोड़ते हैं, जब उन्होंने देखा कि मुसीबत में भी लोग हँसना-गाना नहीं छोड़ते।'
    visual: 'एक शहर का नक्शा सोचिए जिसमें नीला पानी धीरे-धीरे गली-गली फैल रहा है: पहले गांधी मैदान, फिर बाज़ार, फिर घरों के आँगन। छतों पर लोग खड़े हैं और एक व्यक्ति खिड़की से नोटबुक लिए देख रहा है।'
    step_by_step: 1. लेखक का बाढ़ वाला अंचल और राहत-कार्य का अनुभव। 2. 1975 में पटना में बाढ़ का आना। 3. पानी का बढ़ना, लोगों का डर और इंतज़ार। 4. पुरानी बाढ़ों की यादें। 5. मुसीबत में भी जीवन का उत्सव।
    real_world: 2018 में केरल और 2019 में पटना में भी ऐसी ही बाढ़ आई थी। उस समय भी लोगों ने एक-दूसरे की मदद की और हिम्मत नहीं हारी।
  picture:
    kind: flow
    steps:
    - लेखक ने बाढ़ पीड़ितों की सेवा की, पर कभी स्वयं नहीं घिरे
    - '1975: पटना में बाढ़ का पानी आने लगा'
    - लोग छतों पर, दुकानें ख़ाली, रात भर इंतज़ार
    - पहले की बाढ़ों की यादें
    - मुसीबत में भी लोग गीत और जीवन नहीं छोड़ते
    alt: 'रिपोर्ताज का क्रम: लेखक का अनुभव, 1975 में पटना में बाढ़, लोगों का डर और इंतज़ार, पुरानी यादें, और कठिनाई में भी जीवन का उत्सव।'
  items:
  - prompt: '''इस जल प्रलय में'' के लेखक कौन हैं?'
    options:
    - फणीश्वरनाथ रेणु
    - मृदुला गर्ग
    - जगदीश चंद्र माथुर
    - प्रेमचंद
    answer: फणीश्वरनाथ रेणु
    difficulty: 1
    hints:
    - '''मैला आँचल'' के लेखक।'
    - बिहार के आंचलिक लेखक।
    solution: फणीश्वरनाथ रेणु।
    mistakes:
      प्रेमचंद: hcbse_author
  - prompt: यह पाठ किस विधा में है?
    options:
    - रिपोर्ताज
    - एकांकी
    - कविता
    - आत्मकथा
    answer: रिपोर्ताज
    difficulty: 1
    hints:
    - आँखों देखी घटना का सजीव वर्णन।
    - पत्रकारिता से मिलती विधा।
    solution: यह एक रिपोर्ताज है।
    mistakes:
      एकांकी: hcbse_read_again
  - prompt: पाठ में किस शहर की बाढ़ का वर्णन है?
    options:
    - पटना
    - कोलकाता
    - मुंबई
    - लखनऊ
    answer: पटना
    difficulty: 1
    hints:
    - बिहार की राजधानी।
    - गांधी मैदान वहीं है।
    solution: पटना की बाढ़ का।
  - prompt: पटना की यह बाढ़ किस वर्ष आई थी?
    answer: '1975'
    check: '1975'
    difficulty: 2
    hints:
    - आपातकाल वाला वर्ष।
    - सत्तर के दशक के बीच में।
    solution: 1975 में।
  - prompt: बाढ़ से पहले लेखक का बाढ़ से क्या संबंध था?
    options:
    - वे बाढ़ पीड़ितों की सेवा कर चुके थे, पर कभी स्वयं नहीं घिरे थे
    - वे बाढ़ में कई बार डूब चुके थे
    - वे बाढ़ के बारे में कुछ नहीं जानते थे
    - वे नाव चलाते थे
    answer: वे बाढ़ पीड़ितों की सेवा कर चुके थे, पर कभी स्वयं नहीं घिरे थे
    difficulty: 2
    hints:
    - उनका अंचल बाढ़ वाला था।
    - उन्होंने राहत कार्य किया था।
    solution: वे राहत कार्य में बाढ़ पीड़ितों की मदद कर चुके थे, पर ख़ुद कभी बाढ़ में नहीं घिरे थे।
  - prompt: पुरानी बाढ़ों की यादों से लेखक क्या दिखाते हैं?
    options:
    - मुसीबत में भी लोग जीवन का उत्सव नहीं छोड़ते
    - बाढ़ हमेशा सुखद होती है
    - सरकार ने कभी मदद नहीं की
    - लोग गाँव छोड़कर भाग गए
    answer: मुसीबत में भी लोग जीवन का उत्सव नहीं छोड़ते
    difficulty: 3
    hints:
    - राहत शिविर में भी गीत-संगीत।
    - जीवन की जिजीविषा।
    solution: बाढ़ जैसी मुसीबत में भी लोग हँसते-गाते रहे, यह जीवन की ताक़त दिखाता है।
