# CBSE Class 9 Hindi A (NCERT Kshitij). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 9
title: वाख
concepts:
- code: hin9c.k9.vakh
  title: वाख (ललद्यद)
  notes: |
    ललद्यद (लल्लेश्वरी), चौदहवीं सदी की कश्मीरी संत-कवयित्री; उनकी काव्य-शैली 'वाख' कहलाती है, जैसे कबीर के
    दोहे। अनुवाद: मीरा कांत। पहला वाख: 'रस्सी कच्चे धागे की, खींच रही मैं नाव' — कमज़ोर साधनों से जीवन की नाव
    खींचना, प्रभु मिलन की बेचैनी। दूसरा: 'खा-खाकर कुछ पाएगा नहीं, न खाकर बनेगा अहंकारी' — भोग और त्याग के
    बीच संतुलन (समभाव)। तीसरा: 'आई सीधी राह से, गई न सीधी राह' — जीवन व्यर्थ गया, पछतावा। चौथा: 'थल-थल में
    बसता है शिव ही' — ईश्वर हर जगह है, हिंदू-मुसलमान में भेद न करो; आत्मज्ञान ही ईश्वर-ज्ञान।
  explanations:
    text: ललद्यद कश्मीर की संत-कवयित्री थीं। उनके वाख कहते हैं कि जीवन कच्चे धागे की रस्सी से नाव खींचने जैसा कठिन है, न बहुत भोग अच्छा है न बहुत त्याग, बीच का रास्ता ठीक है, और ईश्वर हर जगह है, इसलिए हिंदू-मुसलमान में भेद मत करो।
    visual: 'एक नाव को कच्चे धागे की रस्सी से खींचती स्त्री की कल्पना कीजिए; रस्सी कभी भी टूट सकती है। फिर एक तराज़ू: एक तरफ़ ''भोग'', दूसरी तरफ़ ''त्याग'', और बीच में संतुलन।'
    step_by_step: '1. कवयित्री और ''वाख'' का परिचय। 2. कच्चे धागे की रस्सी और नाव: प्रभु से मिलने की बेचैनी। 3. भोग और त्याग के बीच समभाव। 4. सीधी राह से आई, पर टेढ़ी राह गई: पछतावा। 5. शिव हर जगह: भेदभाव मत करो।'
    real_world: 'आज भी कई लोग कहते हैं कि सबसे अच्छा रास्ता बीच का है: न बहुत ज़्यादा खाना, न भूखा रहना। ललद्यद ने यही बात सदियों पहले कही थी।'
  picture:
    kind: flow
    steps:
    - 'कच्चे धागे की रस्सी से नाव खींचना: जीवन कठिन, साधन कमज़ोर'
    - 'न बहुत भोग, न बहुत त्याग: समभाव रखो'
    - 'सीधी राह से आई, पर सीधी राह न गई: पछतावा'
    - 'शिव थल-थल में बसते हैं: हिंदू-मुसलमान में भेद मत करो'
    alt: 'ललद्यद के चार वाखों का सार: कमज़ोर साधनों से जीवन की नाव, भोग और त्याग में संतुलन, जीवन के व्यर्थ जाने का पछतावा, और ईश्वर का हर जगह होना।'
  items:
  - prompt: '''वाख'' की रचयिता कौन हैं?'
    options:
    - ललद्यद
    - मीराबाई
    - महादेवी वर्मा
    - सुभद्रा कुमारी चौहान
    answer: ललद्यद
    difficulty: 1
    hints:
    - कश्मीर की संत-कवयित्री।
    - लल्लेश्वरी भी कहलाती हैं।
    solution: ललद्यद (लल्लेश्वरी)।
    mistakes:
      मीराबाई: hcbse_author
  - prompt: ललद्यद किस भाषा की कवयित्री थीं?
    options:
    - कश्मीरी
    - ब्रजभाषा
    - अवधी
    - मराठी
    answer: कश्मीरी
    difficulty: 1
    hints:
    - कश्मीर की।
    - हिंदी में अनुवाद मीरा कांत ने किया।
    solution: वे कश्मीरी भाषा की कवयित्री थीं।
  - prompt: '''रस्सी कच्चे धागे की'' से कवयित्री का क्या आशय है?'
    options:
    - कमज़ोर, नश्वर साधनों से जीवन की नाव खींचना
    - मज़बूत रस्सी से नाव बाँधना
    - धागा कातने का काम
    - नदी पार करने का खेल
    answer: कमज़ोर, नश्वर साधनों से जीवन की नाव खींचना
    difficulty: 2
    hints:
    - कच्चा धागा कभी भी टूट सकता है।
    - नाव जीवन का प्रतीक है।
    solution: कच्चे धागे की रस्सी कमज़ोर साँसों और साधनों का प्रतीक है, जिनसे वह जीवन की नाव खींच रही हैं।
    mistakes:
      मज़बूत रस्सी से नाव बाँधना: hcbse_poem_meaning
  - prompt: '''खा-खाकर कुछ पाएगा नहीं, न खाकर बनेगा अहंकारी'' में क्या सीख है?'
    options:
    - भोग और त्याग के बीच संतुलन रखो
    - ख़ूब खाओ
    - हमेशा उपवास करो
    - खाना बाँटो मत
    answer: भोग और त्याग के बीच संतुलन रखो
    difficulty: 2
    hints:
    - अति हर तरफ़ बुरी है।
    - '''समभाव'' शब्द।'
    solution: न अधिक भोग से कुछ मिलेगा, न अधिक त्याग से; बीच का रास्ता, समभाव, अपनाओ।
  - prompt: चौथे वाख के अनुसार ईश्वर कहाँ है?
    options:
    - हर जगह, थल-थल में
    - केवल मंदिर में
    - केवल पहाड़ों पर
    - केवल आकाश में
    answer: हर जगह, थल-थल में
    difficulty: 1
    hints:
    - '''थल-थल में बसता है शिव ही''।'
    - हिंदू-मुसलमान में भेद नहीं।
    solution: शिव (ईश्वर) हर जगह बसते हैं, इसलिए किसी में भेद नहीं करना चाहिए।
  - prompt: '''आई सीधी राह से, गई न सीधी राह'' में कवयित्री का भाव क्या है?'
    options:
    - जीवन व्यर्थ जाने का पछतावा
    - यात्रा की ख़ुशी
    - रास्ता भटकने का डर
    - घर लौटने की जल्दी
    answer: जीवन व्यर्थ जाने का पछतावा
    difficulty: 3
    hints:
    - जन्म सहज था, पर जीवन?
    - आगे वे अपनी जेब ख़ाली होने की बात करती हैं।
    solution: वे सीधे रास्ते से संसार में आईं, पर जीवन प्रभु-भक्ति के सही रास्ते पर नहीं बीता, इसका पछतावा है।
    mistakes:
      रास्ता भटकने का डर: hcbse_poem_meaning
