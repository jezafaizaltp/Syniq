# CBSE Class 9 Hindi A (NCERT Kritika, supplementary reader). See chapter 1 for notes on these packs.
subject: cbse9-hin
chapter: 15
title: 'कृतिका: मेरे संग की औरतें'
concepts:
- code: hin9c.kr2.auraten
  title: मेरे संग की औरतें (मृदुला गर्ग)
  notes: |
    मृदुला गर्ग का संस्मरण, अपने परिवार की स्त्रियों के बारे में। नानी: परदा करती थीं, पर स्वतंत्रता की भावना
    रखती थीं; मृत्यु से पहले उन्होंने एक स्वतंत्रता सेनानी (प्यारेलाल शर्मा) से कहा कि उनकी बेटी (लेखिका
    की माँ) की शादी किसी आज़ादी के सिपाही से कराएँ। माँ: घर का काम नहीं करती थीं, किताबें पढ़तीं और संगीत
    सुनतीं; ईमानदारी और निष्पक्षता के कारण सब उनका आदर करते थे; कभी झूठ नहीं बोलती थीं, दूसरों की गोपनीय बात
    नहीं बताती थीं। परदादी ने मन्नत माँगी कि पहला बच्चा लड़की हो। बहनें: चित्रा, मंजुल भगत, रेणु (जो स्कूल की
    गाड़ी होने पर भी पैदल जाती थी), अचला। लेखिका ने कर्नाटक के बागलकोट में बच्चों के लिए स्कूल खुलवाया।
  explanations:
    text: 'लेखिका अपने परिवार की अलग-अलग स्त्रियों को याद करती हैं: परदे में रहकर भी आज़ादी चाहने वाली नानी, घर का काम न करके भी ईमानदारी के लिए सबसे सम्मानित माँ, लड़की की मन्नत माँगने वाली परदादी, और अपनी ज़िद्दी, अनोखी बहनें। सबने अपने ढंग से जीवन जिया।'
    visual: 'एक परिवार-वृक्ष बनाइए: सबसे ऊपर परदादी, फिर नानी, फिर माँ, और नीचे पाँच बहनें। हर एक के पास एक छोटा चिह्न: नानी के पास तिरंगा, माँ के पास किताब, रेणु के पास पैदल चलते जूते।'
    step_by_step: '1. नानी: परदा, पर आज़ादी के लिए बेटी की शादी सेनानी से। 2. माँ: ईमानदारी, किताबें, संगीत; सबका आदर। 3. परदादी की लड़की वाली मन्नत। 4. बहनों की अनोखी आदतें, जैसे रेणु का पैदल जाना। 5. लेखिका का बागलकोट में स्कूल खुलवाना।'
    real_world: हर परिवार में कोई न कोई ऐसी दादी, नानी या माँ होती है जो अपने समय से आगे सोचती है। यह पाठ ऐसी ही स्त्रियों को सम्मान देता है।
  picture:
    kind: compare
    columns:
    - title: नानी और परदादी
      points:
      - नानी परदे में रहीं, पर आज़ादी चाहती थीं
      - बेटी की शादी आज़ादी के सिपाही से चाही
      - परदादी ने पहली संतान लड़की होने की मन्नत माँगी
    - title: माँ
      points:
      - घर का काम नहीं, किताबें और संगीत
      - कभी झूठ नहीं, किसी का भेद नहीं खोला
      - ईमानदारी के कारण सबका आदर
    - title: बहनें और लेखिका
      points:
      - रेणु गाड़ी होने पर भी पैदल स्कूल जाती
      - बहनें लेखन और अपने रास्ते चुनती हैं
      - लेखिका ने बागलकोट में स्कूल खुलवाया
    alt: 'तीन स्तंभ: नानी और परदादी की आज़ाद सोच, माँ की ईमानदारी और पढ़ने का शौक़, और बहनों व लेखिका के अपने रास्ते, जैसे बागलकोट में स्कूल खुलवाना।'
  items:
  - prompt: '''मेरे संग की औरतें'' की लेखिका कौन हैं?'
    options:
    - मृदुला गर्ग
    - महादेवी वर्मा
    - ललद्यद
    - मंजुल भगत
    answer: मृदुला गर्ग
    difficulty: 1
    hints:
    - आधुनिक कथा-लेखिका।
    - उनकी बहन मंजुल भगत भी लेखिका थीं।
    solution: मृदुला गर्ग।
    mistakes:
      मंजुल भगत: hcbse_author
  - prompt: नानी ने मृत्यु से पहले क्या इच्छा जताई?
    options:
    - बेटी की शादी किसी आज़ादी के सिपाही से हो
    - उनका घर बेच दिया जाए
    - बेटी विदेश पढ़ने जाए
    - परिवार गाँव लौट जाए
    answer: बेटी की शादी किसी आज़ादी के सिपाही से हो
    difficulty: 2
    hints:
    - उन्होंने एक स्वतंत्रता सेनानी को बुलाया।
    - देश-प्रेम की भावना।
    solution: उन्होंने चाहा कि उनकी बेटी की शादी किसी स्वतंत्रता सेनानी से हो।
    mistakes:
      बेटी विदेश पढ़ने जाए: hcbse_read_again
  - prompt: लेखिका की माँ का सब आदर क्यों करते थे?
    options:
    - वे ईमानदार थीं, कभी झूठ नहीं बोलती थीं
    - वे घर का सारा काम करती थीं
    - वे बहुत अमीर थीं
    - वे बहुत सख़्त थीं
    answer: वे ईमानदार थीं, कभी झूठ नहीं बोलती थीं
    difficulty: 1
    hints:
    - वे घर का काम नहीं करती थीं।
    - किसी का भेद नहीं खोलती थीं।
    solution: वे ईमानदार और निष्पक्ष थीं, झूठ नहीं बोलती थीं और किसी की गोपनीय बात नहीं बताती थीं।
    mistakes:
      वे घर का सारा काम करती थीं: hcbse_read_again
  - prompt: परदादी ने क्या मन्नत माँगी थी?
    options:
    - पहली संतान लड़की हो
    - पहली संतान लड़का हो
    - घर में धन आए
    - बेटी की शादी जल्दी हो
    answer: पहली संतान लड़की हो
    difficulty: 2
    hints:
    - उस समय यह अनोखी बात थी।
    - लोग प्रायः उलटा माँगते थे।
    solution: उन्होंने मन्नत माँगी कि पहली संतान लड़की हो।
  - prompt: बहन रेणु की कौन-सी आदत अनोखी थी?
    options:
    - स्कूल की गाड़ी होने पर भी पैदल जाती थी
    - रोज़ देर से उठती थी
    - केवल अंग्रेज़ी बोलती थी
    - कभी स्कूल नहीं जाती थी
    answer: स्कूल की गाड़ी होने पर भी पैदल जाती थी
    difficulty: 2
    hints:
    - बारिश में भी।
    - अपनी ज़िद पर अड़ी रहती।
    solution: स्कूल की गाड़ी होने पर भी वह पैदल ही जाती थी।
  - prompt: लेखिका ने बागलकोट में क्या किया?
    options:
    - बच्चों के लिए स्कूल खुलवाया
    - अस्पताल बनवाया
    - पुस्तक मेला लगाया
    - नाटक मंच बनाया
    answer: बच्चों के लिए स्कूल खुलवाया
    difficulty: 3
    hints:
    - वहाँ अच्छे स्कूल नहीं थे।
    - कन्नड़, अंग्रेज़ी और हिंदी पढ़ाने वाला।
    solution: उन्होंने वहाँ बच्चों के लिए स्कूल खुलवाया।
