# Class 9 Biology, chapter 4. Format: content/README.md.
subject: bio
chapter: 4
title: Behind Movements

tips:
  fixed_joint: "Not every joint moves. Some bones fit tightly together to protect what lies inside them."
  striated_involuntary: "Two kinds of muscle look striped under a microscope, and two kinds work without your control. Which kind is in both lists?"
  bone_density_age: "With age, bones slowly lose minerals. What does that do to their strength?"
  uneven_load: "Think about what a heavy load always on one side does to the spine over months."
  joint_types: "Move each joint yourself: one swings in all directions like a ball in a cup, one opens and closes like a door, and one lets you turn your head."
  muscles_pull: "Muscles can only pull (contract), never push. So they work in pairs: one bends a joint, the other straightens it."
  biceps_triceps: "Muscles only pull. To bend the elbow, the muscle on the front of the upper arm shortens; the one at the back shortens to straighten it."
  muscle_types: "Think of where each kind works: muscles you control move bones; the gut and blood vessels work without your control; one special kind beats non-stop in one organ only."
  ligament_tendon: "Two kinds of tough band work at joints: one ties muscle to bone, the other ties bone to bone. Which two things does the question join?"
  calcium_vitamin_d: "Bones are hardened by a mineral found in milk. The body needs the sunshine vitamin to absorb it; without it, children's bones become soft and bent."
  cartilage_role: "Cartilage is a smooth, flexible tissue at joints and in the ear and nose that reduces friction and gives shape."
  bones_206: "A newborn has about 300 bones, but many fuse as we grow, so an adult has fewer. Recall the adult figure from your textbook."
  exercise_bones: "Exercise makes bones denser and stronger, not softer."
  fracture_first_aid: "Moving or straightening a broken bone can make it worse. Keep it still and get medical help."
  gout_uric_acid: "Gout comes from a waste acid made when the body breaks down certain food substances (purines). Its crystals collect in joints, especially the big toe."
  marrow_blood: "Blood cells are made in the soft tissue inside the hollow of long bones. Ligaments and cartilage are tough connective tissue that make no blood."
  per_day_steps: "A day has 24 hours and each hour 60 minutes. Multiply by both."
  ribs_protect: "The skull protects the brain; the rib cage protects the heart and lungs."
  joint_moves_check: Move that joint yourself. Does it swing all round, open and shut like a door, or not move at all?
  bone_jobs: Bones do more than hold us up. Think about what lies inside the skull and the rib cage, and what is made inside long bones.
  pull_only: A muscle can only shorten and pull. Which muscle is on the side the arm bends towards?
  control_or_not: Ask two things about each muscle type, whether it looks striped and whether you can control it, then match.
  sunshine_vitamin: Calcium in food is of little use unless the body can absorb it, which needs a vitamin the skin makes in sunlight.
  move_less_not_more: Gentle, regular exercise keeps bones strong. Heavy loads, bad posture and no exercise do the harm.

concepts:
  - code: bio9.movement.skeleton
    title: The skeleton and joints
    notes: |
      The adult human skeleton has 206 bones. It supports the body, protects organs (skull — brain,
      ribs — heart and lungs), lets us move, makes blood cells in the bone marrow, and stores
      calcium. Cartilage covers bone ends at joints and shapes the ear and nose. Joints: movable
      (synovial) — ball and socket (shoulder, hip), hinge (elbow, knee), pivot (between first two
      neck vertebrae), gliding (wrist, ankle bones); slightly movable (between vertebrae); fixed (skull
      sutures). Ligaments join bones at joints; synovial fluid lubricates them.
    explanations:
      text: "Your skeleton is a living frame. Where bones meet are joints. Swing your arm in a full circle: the shoulder is a ball and socket joint. Bend your elbow: it only opens and closes like a door hinge. Turn your head 'no': a pivot joint. Your skull bones are joined so tightly they cannot move at all, protecting the brain."
      visual: "Draw a ball fitting into a cup (shoulder), a door hinge (elbow), a ring turning on a peg (neck) and two flat plates sliding over each other (wrist)."
      step_by_step: "Which joint is in the knee? Step 1: The knee bends and straightens. Step 2: It does not rotate in a full circle. Step 3: Movement in one plane: a hinge joint."
      real_world: "Doctors replace worn-out hip joints with metal balls and plastic sockets, copying the ball and socket design."
    activity:
      type: sort
      prompt: What kind of joint is it?
      bins:
      - Ball and socket
      - Hinge
      - Pivot
      - Fixed
      items:
      - label: Shoulder
        bin: Ball and socket
        clue: Can your arm swing round in a full circle?
        why: 'Moves in all directions: ball and socket.'
      - label: Hip
        bin: Ball and socket
        clue: Can your leg move forwards, backwards and sideways?
        why: 'Moves in many directions: ball and socket.'
      - label: Knee
        bin: Hinge
        clue: Does it bend only one way, like a door?
        why: Bends one way, like a door hinge.
      - label: Elbow
        bin: Hinge
        clue: Does it bend only one way?
        why: 'One way only: a hinge joint.'
      - label: Turning the head (neck)
        bin: Pivot
        clue: Your head turns side to side on the top of the spine. What kind of movement is that?
        why: 'Turning round a peg: a pivot joint.'
      - label: Bones of the skull
        bin: Fixed
        clue: Can the skull bones move at all?
        why: 'They don''t move: fixed joints.'
    lesson:
      - teach: An adult skeleton has 206 bones. It gives the body shape and support, protects soft organs (the skull guards the brain, the ribs guard the heart and lungs), lets us move, makes blood cells in the bone marrow, and stores calcium.
        check:
          prompt: Which bones protect the brain?
          options:
          - The skull
          - The ribs
          - The backbone
          answer: The skull
          why: The skull is a hard box around the brain.
      - teach: 'Where two bones meet is a joint. Some move freely: ball and socket (shoulder, hip) moves in all directions; hinge (elbow, knee) moves one way like a door; pivot (top of the neck) lets the head turn. Some move slightly (between vertebrae). Some are fixed (skull bones).'
        picture:
          kind: compare
          columns:
          - title: Ball and socket
            points:
            - shoulder, hip
            - moves all round
          - title: Hinge
            points:
            - elbow, knee
            - moves one way
          - title: Pivot and fixed
            points:
            - 'pivot: top of the neck, turns the head'
            - 'fixed: skull, no movement'
          alt: Types of joints and how they move.
        check:
          prompt: Which joint lets the arm swing in a full circle?
          options:
          - Ball and socket at the shoulder
          - Hinge at the elbow
          - Fixed joint in the skull
          answer: Ball and socket at the shoulder
          why: The ball turns in its cup in all directions.
      - teach: Moving joints are held together by ligaments, tough bands joining bone to bone. Bone ends are covered with smooth cartilage, and synovial fluid oils the joint so the bones glide without wearing out.
        check:
          prompt: What does synovial fluid do?
          options:
          - Lubricates the joint
          - Joins muscle to bone
          - Makes blood cells
          answer: Lubricates the joint
          why: It reduces friction so bones move smoothly.
    items:
      - prompt: "How many bones are there in the adult human skeleton?"
        answer: "206"
        check: "206"
        difficulty: 1
        hints: ["A little over 200."]
        solution: "The adult skeleton has 206 bones."
        mistakes: {"300": "bones_206", "260": "bones_206"}
      - prompt: "Which type of joint is found at the shoulder?"
        options: ["Ball and socket joint", "Hinge joint", "Pivot joint", "Fixed joint"]
        answer: "Ball and socket joint"
        difficulty: 1
        hints: ["The arm can swing in a full circle."]
        solution: "The round head of the arm bone fits into a cup in the shoulder blade."
        mistakes: {"Hinge joint": joint_types}
      - prompt: "Which type of joint is found at the elbow?"
        options: ["Hinge joint", "Ball and socket joint", "Pivot joint", "Gliding joint"]
        answer: "Hinge joint"
        difficulty: 1
        hints: ["It bends in one direction, like a door."]
        solution: "The elbow moves in one plane: a hinge joint."
        mistakes: {"Ball and socket joint": joint_types}
      - prompt: "Which structure joins one bone to another at a joint?"
        options: ["Ligament", "Tendon", "Cartilage", "Muscle"]
        answer: "Ligament"
        difficulty: 2
        hints: ["Tendons connect muscles to bones."]
        solution: "Ligaments are strong bands joining bone to bone."
        mistakes: {"Tendon": ligament_tendon}
      - prompt: "Where in the body are some blood cells made?"
        options: ["Bone marrow", "Cartilage", "Ligaments", "Synovial fluid"]
        answer: "Bone marrow"
        difficulty: 2
        hints: ["The soft tissue inside some bones."]
        solution: "Red bone marrow produces blood cells."
        mistakes: {"Cartilage": "marrow_blood", "Ligaments": "marrow_blood"}
      - prompt: "Which bones protect the heart and lungs?"
        options: ["Ribs", "Skull", "Pelvis", "Femur"]
        answer: "Ribs"
        difficulty: 1
        hints: ["They form a cage in the chest."]
        solution: "The rib cage protects the heart and lungs."
        mistakes: {"Skull": "ribs_protect", "Pelvis": "ribs_protect"}
      - prompt: "Which joint lets you turn your head from side to side?"
        options: ["Pivot joint", "Hinge joint", "Gliding joint", "Fixed joint"]
        answer: "Pivot joint"
        difficulty: 3
        hints: ["One bone rotates around a peg on another."]
        solution: "The pivot joint between the first two neck vertebrae allows rotation."
        mistakes: {"Hinge joint": joint_types}
      - prompt: "Your knee lets your leg swing back and forth but not sideways. Which other joint moves in the same way?"
        options: ["Elbow", "Shoulder", "Hip", "The joint that turns your head"]
        answer: "Elbow"
        difficulty: 2
        hints: ["A joint that moves like a door is a hinge joint.", "Which choice opens and closes in one plane?"]
        solution: "Step 1: The knee is a hinge joint. Step 2: The elbow is also a hinge joint; shoulder and hip are ball and socket, the neck joint is a pivot."
        mistakes: {"Shoulder": joint_types, "Hip": joint_types, "The joint that turns your head": joint_types}
      - prompt: "Why can you move your leg in far more directions at the hip than at the knee?"
        options: ["The hip is a ball and socket joint", "The hip has more muscles than the knee", "The knee has no cartilage", "The thigh bone is longer than the shin bone"]
        answer: "The hip is a ball and socket joint"
        difficulty: 3
        hints: ["What type of joint is the knee?", "Which joint type allows movement in all directions?"]
        solution: "Step 1: The knee is a hinge joint, moving in one plane. Step 2: The hip is a ball and socket joint, so it can move in all directions."
        mistakes: {"The hip has more muscles than the knee": joint_types, "The knee has no cartilage": cartilage_role, "The thigh bone is longer than the shin bone": joint_types}
      - prompt: "The bones of the adult skull are locked together and cannot move against each other. What kind of joint is this?"
        options: ["Fixed (immovable) joint", "Hinge joint", "Pivot joint", "Gliding joint"]
        answer: "Fixed (immovable) joint"
        difficulty: 2
        hints: ["Do skull bones move?", "Their job is to protect the brain."]
        solution: "Step 1: Skull bones don't move against each other. Step 2: Such joints are fixed or immovable joints; they make a strong case for the brain."
        mistakes: {"Hinge joint": fixed_joint, "Pivot joint": fixed_joint, "Gliding joint": fixed_joint}
      - prompt: Which type of joint is found at the knee?
        options:
        - Hinge joint
        - Ball and socket joint
        - Pivot joint
        - Fixed joint
        answer: Hinge joint
        difficulty: 1
        hints:
        - 'Bend your knee: how many ways can it move?'
        - It moves like a door.
        solution: 'Step 1: The knee bends and straightens in one direction. Step 2: It moves like a door on hinges. Step 3: It is a hinge joint.'
        mistakes:
          Ball and socket joint: joint_moves_check
      - prompt: Which type of joint is at the hip?
        options:
        - Ball and socket joint
        - Hinge joint
        - Pivot joint
        - Gliding joint
        answer: Ball and socket joint
        difficulty: 1
        hints:
        - You can swing your leg forward, back and to the side.
        - Which joint allows movement in many directions?
        solution: 'Step 1: The leg moves in many directions at the hip. Step 2: The rounded top of the thigh bone fits a cup in the hip bone. Step 3: It is a ball and socket joint.'
        mistakes:
          Hinge joint: joint_moves_check
      - prompt: What covers the ends of bones at a joint and lets them slide smoothly?
        options:
        - Cartilage
        - Tendon
        - Muscle
        - Marrow
        answer: Cartilage
        difficulty: 2
        hints:
        - It is smooth and flexible.
        - The same tissue shapes your ear.
        solution: 'Step 1: Bone ends need a smooth covering. Step 2: Cartilage is smooth and flexible. Step 3: It reduces rubbing at the joint.'
        mistakes:
          Tendon: ligament_tendon
      - prompt: Which is NOT a job of the skeleton?
        options:
        - Digesting food
        - Protecting organs
        - Making blood cells
        - Storing calcium
        answer: Digesting food
        difficulty: 2
        hints:
        - Three of these are done by bones.
        - Which one belongs to a different system?
        solution: 'Step 1: Bones protect organs, make blood cells and store calcium. Step 2: Digestion is done by the digestive system. Step 3: Digesting food is not a job of the skeleton.'
        mistakes:
          Making blood cells: bone_jobs
      - prompt: The joints between the vertebrae of the backbone allow only a little movement. What are they called?
        options:
        - Slightly movable joints
        - Fixed joints
        - Ball and socket joints
        - Hinge joints
        answer: Slightly movable joints
        difficulty: 3
        hints:
        - You can bend your back, but each vertebra moves only a bit.
        - Which group is in between freely movable and fixed?
        solution: 'Step 1: The spine as a whole bends. Step 2: Each joint between vertebrae moves only a little. Step 3: They are slightly movable joints.'
        mistakes:
          Fixed joints: fixed_joint

  - code: bio9.movement.muscles
    title: Muscles and movement
    after: [bio9.movement.skeleton]
    notes: |
      Muscles move bones by contracting; they can only pull. Skeletal muscles work in antagonistic
      pairs: biceps contracts to bend (flex) the elbow while triceps relaxes; triceps contracts to
      straighten (extend) it. Tendons attach muscles to bones. Types: skeletal (striated, voluntary),
      smooth (unstriated, involuntary: stomach, intestine, blood vessels), cardiac (striated,
      involuntary, never fatigues). Muscle contraction needs energy (ATP) from respiration.
    explanations:
      text: "A muscle is like a rope: it can pull but not push. To bend your arm, the biceps on the front shortens and pulls your forearm up. To straighten it again, the biceps can't push, so the triceps at the back pulls. Such opposing pairs are everywhere in your body."
      visual: "Draw the upper arm with a muscle on the front (biceps) and one on the back (triceps). Arm bent: biceps fat and short, triceps long. Arm straight: the opposite."
      step_by_step: "Which muscle contracts when you do a push-up and straighten your arms? Step 1: Straightening the elbow is extension. Step 2: Extension at the elbow is done by the triceps. Step 3: Triceps contracts, biceps relaxes."
      real_world: "Your heart's cardiac muscle beats about 100,000 times a day for a lifetime without tiring."
    activity:
      type: sort
      prompt: Which kind of muscle?
      bins:
      - Skeletal (voluntary)
      - Smooth (involuntary)
      - Cardiac
      items:
      - label: Biceps
        bin: Skeletal (voluntary)
        clue: Can you move it when you decide to?
        why: 'You control it: skeletal, voluntary muscle.'
      - label: Triceps
        bin: Skeletal (voluntary)
        clue: Can you move it when you decide to?
        why: 'You control it: skeletal muscle.'
      - label: Heart wall
        bin: Cardiac
        clue: Does it work all the time without you deciding? Is it only in one organ?
        why: Only the heart has cardiac muscle.
      - label: Stomach wall
        bin: Smooth (involuntary)
        clue: Do you decide when your stomach churns?
        why: 'It works on its own: smooth, involuntary muscle.'
      - label: Intestine wall
        bin: Smooth (involuntary)
        clue: Do you decide when food is pushed along?
        why: 'It works on its own: smooth muscle.'
      - label: Leg muscles
        bin: Skeletal (voluntary)
        clue: Can you move them when you decide to?
        why: 'Voluntary: skeletal muscle.'
    lesson:
      - teach: Bones can't move themselves. Muscles move them by contracting (getting shorter). A muscle can only pull, never push. Tendons are strong cords that attach muscles to bones.
        check:
          prompt: What connects a muscle to a bone?
          options:
          - Tendon
          - Ligament
          - Cartilage
          answer: Tendon
          why: Tendons join muscle to bone; ligaments join bone to bone.
      - teach: Because muscles only pull, they work in pairs. To bend your arm, the biceps (front) contracts and the triceps (back) relaxes. To straighten it, the triceps contracts and the biceps relaxes. Such pairs are called antagonistic muscles.
        picture:
          kind: compare
          columns:
          - title: Bending the arm
            points:
            - biceps contracts
            - triceps relaxes
          - title: Straightening the arm
            points:
            - triceps contracts
            - biceps relaxes
          alt: Biceps and triceps take turns to bend and straighten the arm.
        check:
          prompt: Which muscle contracts to straighten the arm?
          options:
          - Triceps
          - Biceps
          - Both together
          answer: Triceps
          why: The triceps at the back pulls the forearm straight.
      - teach: There are three kinds of muscle. Skeletal muscle moves bones, is striped and is under our control (voluntary). Smooth muscle lines the gut and blood vessels and works on its own (involuntary). Cardiac muscle in the heart is striped, involuntary and never tires.
        check:
          prompt: Which muscle is found only in the heart?
          options:
          - Cardiac muscle
          - Smooth muscle
          - Skeletal muscle
          answer: Cardiac muscle
          why: Cardiac muscle beats all our life without tiring.
    items:
      - prompt: "Which muscle contracts to bend the arm at the elbow?"
        options: ["Biceps", "Triceps", "Cardiac muscle", "Diaphragm"]
        answer: "Biceps"
        difficulty: 1
        hints: ["The muscle on the front of the upper arm."]
        solution: "The biceps contracts and pulls the forearm up."
        mistakes: {"Triceps": biceps_triceps}
      - prompt: "Why do skeletal muscles work in pairs?"
        options: ["Muscles can only pull, not push", "One muscle is always resting", "Bones need two muscles to grow", "It saves energy"]
        answer: "Muscles can only pull, not push"
        difficulty: 2
        hints: ["How does a bent arm get straightened again?"]
        solution: "Because a muscle can only pull, another muscle is needed to move the bone back."
        mistakes: {"One muscle is always resting": muscles_pull}
      - prompt: "Which type of muscle is found in the walls of the stomach and intestine?"
        options: ["Smooth muscle", "Skeletal muscle", "Cardiac muscle", "Striated voluntary muscle"]
        answer: "Smooth muscle"
        difficulty: 2
        hints: ["It works without our control."]
        solution: "Smooth (involuntary) muscle moves food along the gut."
        mistakes: {"Skeletal muscle": muscle_types, "Cardiac muscle": muscle_types}
      - prompt: "What connects a muscle to a bone?"
        options: ["Tendon", "Ligament", "Cartilage", "Nerve"]
        answer: "Tendon"
        difficulty: 1
        hints: ["Feel the cord at the back of your ankle."]
        solution: "Tendons attach muscles to bones (the Achilles tendon is at the ankle)."
        mistakes: {"Ligament": ligament_tendon}
      - prompt: "Which muscle works throughout life without getting tired?"
        options: ["Cardiac muscle", "Biceps", "Smooth muscle of the gut", "Triceps"]
        answer: "Cardiac muscle"
        difficulty: 2
        hints: ["It is only found in one organ."]
        solution: "Heart (cardiac) muscle never fatigues."
        mistakes: {"Biceps": muscle_types}
      - prompt: "A heart beats 72 times a minute. How many times does it beat in a day?"
        answer: "103680"
        check: "72*60*24"
        difficulty: 3
        hints: ["72 × 60 × 24."]
        solution: "72 × 60 = 4320 per hour; × 24 = 103,680 per day."

        mistakes: {"4320": "per_day_steps", "1728": "per_day_steps"}
      - prompt: "When you straighten your arm at the elbow, what do the biceps and triceps do?"
        options: ["Triceps contracts and biceps relaxes", "Biceps contracts and triceps relaxes", "Both contract together", "Biceps pushes the arm straight"]
        answer: "Triceps contracts and biceps relaxes"
        difficulty: 2
        hints: ["Muscles can only pull.", "Which muscle is at the back of the upper arm?"]
        solution: "Step 1: To straighten, the arm must be pulled from the back. Step 2: The triceps contracts while the biceps relaxes."
        mistakes: {"Biceps contracts and triceps relaxes": biceps_triceps, "Both contract together": muscles_pull, "Biceps pushes the arm straight": muscles_pull}
      - prompt: "Which kind of muscle is striated (striped) and also involuntary?"
        options: ["Cardiac muscle", "Skeletal muscle", "Smooth muscle", "None of them"]
        answer: "Cardiac muscle"
        difficulty: 3
        hints: ["Skeletal muscle is striated but you control it.", "Smooth muscle works on its own but is not striated."]
        solution: "Step 1: Striated: skeletal and cardiac. Step 2: Involuntary: smooth and cardiac. Step 3: Both: cardiac muscle."
        mistakes: {"Skeletal muscle": striated_involuntary, "Smooth muscle": striated_involuntary, "None of them": striated_involuntary}
      - prompt: "The strong cord at the back of your heel (the Achilles tendon) joins:"
        options: ["The calf muscle to the heel bone", "Two bones of the ankle", "Two muscles of the leg", "The skin to the heel bone"]
        answer: "The calf muscle to the heel bone"
        difficulty: 2
        hints: ["What do tendons join?", "Ligaments join bone to bone."]
        solution: "Step 1: Tendons join muscles to bones. Step 2: The Achilles tendon joins the calf muscle to the heel bone, so the muscle can lift the heel."
        mistakes: {"Two bones of the ankle": ligament_tendon, "Two muscles of the leg": ligament_tendon, "The skin to the heel bone": ligament_tendon}
      - prompt: Can a muscle push a bone?
        options:
        - No, muscles can only pull
        - Yes, muscles push and pull
        - Only the biceps can push
        - Only when it is relaxed
        answer: No, muscles can only pull
        difficulty: 1
        hints:
        - A muscle works by getting shorter.
        - Can getting shorter push something away?
        solution: 'Step 1: Muscles contract, or shorten. Step 2: Shortening can only pull. Step 3: That is why muscles work in pairs.'
        mistakes:
          Yes, muscles push and pull: muscles_pull
      - prompt: 'Muscles that we can move when we choose are called:'
        options:
        - Voluntary muscles
        - Involuntary muscles
        - Cardiac muscles
        - Smooth muscles
        answer: Voluntary muscles
        difficulty: 1
        hints:
        - Think of lifting your hand.
        - The word comes from 'will'.
        solution: 'Step 1: Skeletal muscles move when we decide. Step 2: Such muscles are under our will. Step 3: They are voluntary muscles.'
        mistakes:
          Involuntary muscles: control_or_not
      - prompt: When you bend your arm to lift a bag, what does the triceps do?
        options:
        - It relaxes
        - It contracts
        - It pushes the arm up
        - It becomes a tendon
        answer: It relaxes
        difficulty: 2
        hints:
        - Bending the arm is the biceps' job.
        - What must its partner do?
        solution: 'Step 1: The biceps contracts to bend the arm. Step 2: Its partner must let go. Step 3: The triceps relaxes.'
        mistakes:
          It contracts: biceps_triceps
      - prompt: Food is pushed along the intestine without our control. Which type of muscle does this?
        options:
        - Smooth muscle
        - Skeletal muscle
        - Cardiac muscle
        - Biceps
        answer: Smooth muscle
        difficulty: 2
        hints:
        - It works on its own, in the walls of the gut.
        - It is not striped.
        solution: 'Step 1: The gut works without our control. Step 2: Its walls have unstriped, involuntary muscle. Step 3: That is smooth muscle.'
        mistakes:
          Cardiac muscle: muscle_types
      - prompt: A heart beats 70 times a minute. How many times does it beat in a day?
        answer: '100800'
        check: 70*60*24
        difficulty: 3
        hints:
        - Find the beats in an hour first.
        - Then multiply by the hours in a day.
        solution: 'Step 1: 70 × 60 = 4200 beats an hour. Step 2: × 24 hours. Step 3: = 100,800 beats a day.'
        mistakes:
          '4200': per_day_steps
          '1680': per_day_steps
      - prompt: Where does a muscle get the energy to contract?
        options:
        - From respiration in its cells
        - From the bones
        - From the tendons
        - From sunlight
        answer: From respiration in its cells
        difficulty: 2
        hints:
        - Contracting uses energy.
        - Which process releases energy from glucose?
        solution: 'Step 1: Contraction needs energy. Step 2: Muscle cells break down glucose. Step 3: Respiration supplies the energy (as ATP).'
        mistakes:
          From the tendons: ligament_tendon
  - code: bio9.movement.health
    title: Keeping bones and muscles healthy
    after: [bio9.movement.muscles]
    notes: |
      Bones need calcium and phosphorus; vitamin D (made in skin in sunlight) helps absorb calcium.
      Lack of vitamin D causes rickets in children; loss of bone density with age causes osteoporosis;
      inflamed joints is arthritis (gout from uric acid crystals). Regular exercise strengthens bones
      and muscles. Correct posture, a balanced diet and avoiding heavy school bags protect the spine.
      Fractures are first given support with splints and medical help.
    explanations:
      text: "Bones are alive and keep rebuilding. They need calcium from milk, ragi and greens, and vitamin D, which your skin makes in sunlight. Children short of vitamin D get soft, bent bones (rickets). Old people may get thin, brittle bones (osteoporosis). Exercise makes both bones and muscles stronger."
      visual: "Draw a healthy bone as a solid honeycomb and an osteoporotic bone as a honeycomb with big holes."
      step_by_step: "First aid for a suspected arm fracture: Step 1: Keep the arm still. Step 2: Support it with a splint or sling. Step 3: Do not try to straighten it. Step 4: Get medical help."
      real_world: "Morning sunlight for a few minutes a day helps the body make vitamin D for strong bones."
    activity:
      type: sort
      prompt: Good or bad for bones and muscles?
      bins:
      - Good
      - Bad
      items:
      - label: Drinking milk and eating greens
        bin: Good
        clue: What do bones need to be strong?
        why: Calcium from milk and greens builds strong bones.
      - label: Some sunlight every day (vitamin D)
        bin: Good
        clue: What does the skin make in sunlight?
        why: Sunlight helps the skin make vitamin D, which bones need.
      - label: Regular exercise
        bin: Good
        clue: What happens to muscles that are used?
        why: Exercise strengthens muscles and bones.
      - label: Slouching for hours
        bin: Bad
        clue: What happens to the back when it is bent for hours?
        why: Poor posture strains the spine and muscles.
      - label: Sitting all day without moving
        bin: Bad
        clue: What happens to muscles that aren't used?
        why: Unused muscles weaken and joints stiffen.
      - label: Carrying a heavy bag on one shoulder
        bin: Bad
        clue: Is the weight shared evenly?
        why: One side takes all the weight, which bends the spine.
    lesson:
      - teach: Bones are hardened by calcium and phosphorus from milk, curd, ragi and small fish. Vitamin D lets the body absorb calcium. The skin makes vitamin D in sunlight, so playing outdoors helps bones too.
        check:
          prompt: Why does a child need some sunlight for strong bones?
          options:
          - The skin makes vitamin D, which helps absorb calcium
          - Sunlight adds calcium to bones
          - Sunlight makes muscles stronger
          answer: The skin makes vitamin D, which helps absorb calcium
          why: Without vitamin D, calcium from food isn't absorbed well.
      - teach: 'Problems: lack of vitamin D in children causes rickets (soft, bent bones). In old age, bones lose density and break easily (osteoporosis). Arthritis is painful, swollen joints; gout is one kind, caused by uric acid crystals.'
        picture:
          kind: compare
          columns:
          - title: Rickets
            points:
            - children
            - lack of vitamin D
            - soft, bent bones
          - title: Osteoporosis
            points:
            - older people
            - bones lose density
            - break easily
          - title: Gout
            points:
            - uric acid crystals
            - painful joints
          alt: Three bone and joint disorders and their causes.
        check:
          prompt: What causes rickets?
          options:
          - Lack of vitamin D
          - Too much exercise
          - Uric acid crystals
          answer: Lack of vitamin D
          why: Without vitamin D, bones can't take up enough calcium.
      - teach: 'Keep bones and muscles healthy with regular exercise, good posture, a balanced diet, and a school bag carried on both shoulders. For a suspected fracture, don''t straighten it: keep it still with a splint and get medical help.'
        check:
          prompt: What should you NOT do with a suspected broken arm?
          options:
          - Try to straighten it
          - Keep it still with a splint
          - Get medical help
          answer: Try to straighten it
          why: Moving a broken bone can make the injury worse.
    items:
      - prompt: "Which vitamin helps the body absorb calcium for bones?"
        options: ["Vitamin D", "Vitamin C", "Vitamin A", "Vitamin K"]
        answer: "Vitamin D"
        difficulty: 1
        hints: ["The 'sunshine vitamin'."]
        solution: "Vitamin D helps absorb calcium from food."
        mistakes: {"Vitamin C": calcium_vitamin_d}
      - prompt: "Soft, bent bones in children caused by lack of vitamin D is called:"
        options: ["Rickets", "Arthritis", "Osteoporosis", "Gout"]
        answer: "Rickets"
        difficulty: 2
        hints: ["A deficiency disease of children."]
        solution: "Rickets is due to vitamin D deficiency."
        mistakes: {"Osteoporosis": calcium_vitamin_d}
      - prompt: "Which mineral is the main component that makes bones hard?"
        options: ["Calcium", "Iron", "Iodine", "Sodium"]
        answer: "Calcium"
        difficulty: 1
        hints: ["Found in milk."]
        solution: "Calcium phosphate makes bones hard."
        mistakes: {"Iron": calcium_vitamin_d}
      - prompt: "What is the right first aid for a suspected broken bone?"
        options: ["Keep it still with a splint and get medical help", "Straighten it quickly", "Massage it hard", "Ask the person to walk on it"]
        answer: "Keep it still with a splint and get medical help"
        difficulty: 2
        hints: ["Moving it can cause more damage."]
        solution: "Immobilise it and get medical care."
        mistakes: {"Straighten it quickly": "fracture_first_aid", "Massage it hard": "fracture_first_aid"}
      - prompt: "Why does regular exercise help bones?"
        options: ["It makes bones denser and stronger", "It makes bones softer", "It stops bones growing", "It removes calcium from bones"]
        answer: "It makes bones denser and stronger"
        difficulty: 2
        hints: ["Bones respond to load."]
        solution: "Weight-bearing exercise stimulates bone to build up and stay strong."
        mistakes: {"It makes bones softer": "exercise_bones", "It removes calcium from bones": "exercise_bones"}
      - prompt: "Gout is caused by crystals of which substance collecting in joints?"
        options: ["Uric acid", "Calcium carbonate", "Glucose", "Salt"]
        answer: "Uric acid"
        difficulty: 3
        hints: ["A waste product of protein breakdown."]
        solution: "Uric acid crystals deposit in joints, causing painful gout."
        mistakes: {"Calcium carbonate": "gout_uric_acid", "Glucose": "gout_uric_acid"}
      - prompt: "A child drinks plenty of milk but stays indoors all day and still develops soft, bent leg bones. What is most likely missing?"
        options: ["Sunlight, so the body makes too little vitamin D", "Calcium", "Protein", "Iron"]
        answer: "Sunlight, so the body makes too little vitamin D"
        difficulty: 3
        hints: ["Milk already gives calcium.", "What does the body need to absorb that calcium, and how is it made?"]
        solution: "Step 1: Milk supplies calcium. Step 2: Without sunlight the skin makes little vitamin D, so calcium isn't absorbed well, causing rickets."
        mistakes: {"Calcium": calcium_vitamin_d, "Protein": calcium_vitamin_d, "Iron": iron_anaemia}
      - prompt: "Why do bones break more easily in many older people (osteoporosis)?"
        options: ["Bones lose density with age and become brittle", "Muscles become too strong for the bones", "Bones take in too much calcium", "The joints fuse together"]
        answer: "Bones lose density with age and become brittle"
        difficulty: 2
        hints: ["What makes bones hard?", "What happens to bone minerals with age?"]
        solution: "Step 1: With age, bones lose calcium and become less dense. Step 2: Thinner, more porous bones break easily."
        mistakes: {"Muscles become too strong for the bones": bone_density_age, "Bones take in too much calcium": bone_density_age, "The joints fuse together": bone_density_age}
      - prompt: "Why is carrying a heavy school bag on one shoulder every day harmful?"
        options: ["It pulls the spine to one side and spoils posture", "It makes the bones grow faster", "It improves balance", "It has no effect on the body"]
        answer: "It pulls the spine to one side and spoils posture"
        difficulty: 2
        hints: ["Which way does the body lean to balance the load?", "Think about the spine over many months."]
        solution: "Step 1: The body leans to balance the one-sided load. Step 2: Over time this bends the spine and strains muscles; two straps share the load."
        mistakes: {"It makes the bones grow faster": uneven_load, "It improves balance": uneven_load, "It has no effect on the body": uneven_load}
      - prompt: Which food is a good source of calcium?
        options:
        - Ragi
        - Sugar
        - Cooking oil
        - Salt
        answer: Ragi
        difficulty: 1
        hints:
        - Calcium is a mineral found in milk and some grains.
        - Which of these is a millet?
        solution: 'Step 1: Sugar, oil and salt give little calcium. Step 2: Ragi (finger millet) is rich in calcium. Step 3: Ragi is the good source.'
        mistakes:
          Sugar: calcium_vitamin_d
      - prompt: 'Bones becoming weak and brittle in old age is called:'
        options:
        - Osteoporosis
        - Rickets
        - Gout
        - Anaemia
        answer: Osteoporosis
        difficulty: 1
        hints:
        - It happens in older people.
        - Bones lose density.
        solution: 'Step 1: With age, bones lose minerals. Step 2: They become less dense and break easily. Step 3: This is osteoporosis.'
        mistakes:
          Rickets: bone_density_age
      - prompt: A child plays football and twists an ankle, which swells and hurts badly. What is the best first step?
        options:
        - Keep the ankle still and get medical help
        - Make the child walk it off
        - Rub it hard
        - Pull the foot to straighten it
        answer: Keep the ankle still and get medical help
        difficulty: 2
        hints:
        - It could be a sprain or a fracture.
        - Should you move it or not?
        solution: 'Step 1: It could be a fracture. Step 2: Moving it may make it worse. Step 3: Keep it still and get medical help.'
        mistakes:
          Pull the foot to straighten it: fracture_first_aid
      - prompt: Which habit helps keep the spine healthy?
        options:
        - Sitting upright and carrying the bag on both shoulders
        - Slouching while reading
        - Carrying a heavy bag on one shoulder
        - Never exercising
        answer: Sitting upright and carrying the bag on both shoulders
        difficulty: 1
        hints:
        - The spine likes even loads.
        - Which choice spreads weight evenly?
        solution: 'Step 1: Slouching bends the spine. Step 2: One-shoulder loads pull it sideways. Step 3: Good posture and both straps keep it straight.'
        mistakes:
          Carrying a heavy bag on one shoulder: uneven_load
      - prompt: A girl drinks milk daily but has weak bones. A doctor finds she is short of vitamin D. What would help most?
        options:
        - Spending some time outdoors in sunlight
        - Drinking even more milk only
        - Avoiding all exercise
        - Eating more sugar
        answer: Spending some time outdoors in sunlight
        difficulty: 3
        hints:
        - She already gets calcium.
        - What does the body need to absorb it, and where does that come from?
        solution: 'Step 1: Milk gives calcium. Step 2: Without vitamin D, little calcium is absorbed. Step 3: Sunlight lets the skin make vitamin D.'
        mistakes:
          Drinking even more milk only: sunshine_vitamin
      - prompt: Why do doctors advise older people to walk regularly?
        options:
        - Weight-bearing exercise keeps bones denser and stronger
        - Walking adds vitamin D to food
        - It stops all ageing
        - Resting makes bones stronger
        answer: Weight-bearing exercise keeps bones denser and stronger
        difficulty: 2
        hints:
        - Bones respond to being used.
        - Does exercise make bones stronger or weaker?
        solution: 'Step 1: Bones get stronger when they carry weight. Step 2: Walking is gentle weight-bearing exercise. Step 3: It slows bone loss with age.'
        mistakes:
          Resting makes bones stronger: move_less_not_more
