# Class 9 Biology, chapter 3. Format: content/README.md.
# Also uses tips from earlier chapters: count_atoms.
subject: bio
chapter: 3
title: Respiration and Excretion

tips:
  breathing_not_respiration: "Breathing moves air in and out of the lungs. Respiration is the release of energy from food inside cells."
  anaerobic_products: "Without oxygen, muscle cells make lactic acid; yeast makes ethanol and carbon dioxide. Aerobic respiration makes carbon dioxide and water."
  aerobic_more_energy: "Aerobic respiration releases far more energy from each glucose than anaerobic respiration."
  diaphragm_inhale: "Breathing in: the diaphragm contracts and flattens, the ribs move up and out, the chest gets bigger and air rushes in."
  alveoli_exchange: "Gas exchange happens in the alveoli, tiny air sacs with thin walls surrounded by capillaries."
  nephron_unit: "The nephron is the working unit of the kidney: it filters blood and forms urine."
  urea_kidney: "Urea is made in the liver and removed by the kidneys. Lungs remove carbon dioxide; skin removes sweat."

concepts:
  - code: bio9.respiration.cellular
    title: Respiration in cells
    notes: |
      Respiration releases energy from food (glucose) inside cells, stored as ATP. Aerobic respiration
      (with oxygen, in mitochondria): C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy. Anaerobic respiration
      (without oxygen): in yeast, glucose → ethanol + CO₂ + a little energy (fermentation); in muscles
      during heavy exercise, glucose → lactic acid + a little energy, causing cramps. Aerobic
      respiration releases much more energy. The first step, glucose → pyruvate, happens in the
      cytoplasm.
    explanations:
      text: "Every cell burns glucose slowly to get energy, but with no flame. With plenty of oxygen, in the mitochondria, glucose is broken all the way to carbon dioxide and water, releasing lots of energy. When a sprinter runs out of oxygen, muscle cells break glucose only to lactic acid, which gives much less energy and causes cramps."
      visual: "Draw a fork: glucose at the top, splitting into pyruvate. One branch, 'with oxygen, in mitochondria', leads to CO₂ + water + lots of energy. The other, 'no oxygen', leads to lactic acid (muscle) or ethanol + CO₂ (yeast) + a little energy."
      step_by_step: "Why does dough rise? Step 1: Yeast in the dough respires anaerobically. Step 2: It makes carbon dioxide gas (and a little ethanol). Step 3: The gas bubbles make the dough swell."
      real_world: "Appam and idli batter rise because yeast and bacteria ferment it, releasing carbon dioxide."
    items:
      - prompt: "Where in the cell does aerobic respiration mainly take place?"
        options: ["Mitochondria", "Chloroplasts", "Nucleus", "Cell wall"]
        answer: "Mitochondria"
        difficulty: 1
        hints: ["The powerhouse of the cell."]
        solution: "Mitochondria carry out aerobic respiration."
      - prompt: "What are the products of aerobic respiration?"
        options: ["Carbon dioxide, water and energy", "Lactic acid and energy", "Ethanol and carbon dioxide", "Glucose and oxygen"]
        answer: "Carbon dioxide, water and energy"
        difficulty: 1
        hints: ["Glucose is broken down completely."]
        solution: "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy."
        mistakes: {"Lactic acid and energy": anaerobic_products, "Glucose and oxygen": breathing_not_respiration}
      - prompt: "What causes muscle cramps after heavy exercise?"
        options: ["Build-up of lactic acid", "Build-up of ethanol", "Too much oxygen", "Too much glucose"]
        answer: "Build-up of lactic acid"
        difficulty: 2
        hints: ["Muscles respire without enough oxygen."]
        solution: "Anaerobic respiration in muscles makes lactic acid."
        mistakes: {"Build-up of ethanol": anaerobic_products}
      - prompt: "Which gas makes bread dough and appam batter rise?"
        options: ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"]
        answer: "Carbon dioxide"
        difficulty: 1
        hints: ["Yeast ferments sugar."]
        solution: "Yeast respiring anaerobically releases carbon dioxide."
        mistakes: {"Oxygen": anaerobic_products}
      - prompt: "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, how many water molecules are made from one glucose molecule?"
        answer: "6"
        check: "12/2"
        difficulty: 2
        hints: ["Glucose has 12 hydrogen atoms; each water takes 2."]
        solution: "12 H atoms ÷ 2 per water = 6 water molecules."
        mistakes: {"12": count_atoms, "1": count_atoms}
      - prompt: "Why does aerobic respiration give a cell more energy than anaerobic respiration?"
        options: ["Glucose is broken down completely to carbon dioxide and water", "It uses more glucose", "It happens faster", "It happens in the nucleus"]
        answer: "Glucose is broken down completely to carbon dioxide and water"
        difficulty: 3
        hints: ["Lactic acid and ethanol still contain energy."]
        solution: "Anaerobic respiration leaves energy locked in lactic acid or ethanol; aerobic respiration releases it all."
        mistakes: {"It uses more glucose": aerobic_more_energy}

  - code: bio9.respiration.breathing
    title: Breathing and the lungs
    after: [bio9.respiration.cellular]
    notes: |
      Air passes nose → pharynx → larynx → trachea → bronchi → bronchioles → alveoli. Inhaling: the
      diaphragm contracts and flattens and the intercostal muscles lift the ribs, so the chest volume
      increases, pressure falls and air flows in. Exhaling: they relax and air is pushed out. Gas
      exchange is by diffusion in the alveoli: oxygen into the blood, carbon dioxide out. Rings of
      cartilage keep the trachea open.
    explanations:
      text: "Your lungs are like sponges full of millions of tiny balloons, the alveoli. When the dome-shaped diaphragm below them pulls down, the chest gets bigger and air is sucked in. In each alveolus, oxygen slips across a wall one cell thick into the blood, and carbon dioxide slips out."
      visual: "Draw a bell jar model: the jar is the chest, two balloons are the lungs, and a rubber sheet at the bottom is the diaphragm. Pull the sheet down: the balloons fill. Push it up: they empty."
      step_by_step: "Path of air to the blood: Step 1: Nose (filtered and warmed). Step 2: Trachea (kept open by cartilage rings). Step 3: Bronchi and bronchioles. Step 4: Alveoli: oxygen diffuses into the capillaries."
      real_world: "Smoking damages the alveoli and the cilia in the airways, which is why smokers become breathless and cough."
    items:
      - prompt: "Where does gas exchange take place in the lungs?"
        options: ["Alveoli", "Trachea", "Bronchi", "Larynx"]
        answer: "Alveoli"
        difficulty: 1
        hints: ["Tiny air sacs."]
        solution: "The alveoli have thin walls and many capillaries for gas exchange."
        mistakes: {"Trachea": alveoli_exchange, "Bronchi": alveoli_exchange}
      - prompt: "What happens to the diaphragm when we breathe in?"
        options: ["It contracts and flattens", "It relaxes and becomes dome-shaped", "It does not move", "It moves upward"]
        answer: "It contracts and flattens"
        difficulty: 1
        hints: ["The chest must get bigger."]
        solution: "The diaphragm contracts and flattens, enlarging the chest."
        mistakes: {"It relaxes and becomes dome-shaped": diaphragm_inhale, "It moves upward": diaphragm_inhale}
      - prompt: "Which is the correct order of the air passage?"
        options: ["Trachea → bronchi → bronchioles → alveoli", "Bronchi → trachea → alveoli → bronchioles", "Alveoli → bronchioles → bronchi → trachea", "Trachea → alveoli → bronchi → bronchioles"]
        answer: "Trachea → bronchi → bronchioles → alveoli"
        difficulty: 2
        hints: ["From the biggest tube to the smallest sac."]
        solution: "The windpipe branches into bronchi, then bronchioles, ending in alveoli."
      - prompt: "What keeps the trachea from collapsing?"
        options: ["Rings of cartilage", "Muscles of the diaphragm", "Mucus", "The ribs"]
        answer: "Rings of cartilage"
        difficulty: 2
        hints: ["Feel the ridges at the front of your throat."]
        solution: "C-shaped cartilage rings hold the trachea open."
      - prompt: "Breathing and respiration are different. Which statement is correct?"
        options: ["Breathing moves air; respiration releases energy in cells", "They are the same process", "Respiration moves air; breathing releases energy", "Only plants respire"]
        answer: "Breathing moves air; respiration releases energy in cells"
        difficulty: 2
        hints: ["One is physical, one is chemical."]
        solution: "Breathing is moving air in and out; respiration is the chemical release of energy from food."
        mistakes: {"They are the same process": breathing_not_respiration, "Respiration moves air; breathing releases energy": breathing_not_respiration}
      - prompt: "A person breathes 16 times a minute, taking in 0.5 litres each breath. How many litres of air do they breathe in per minute?"
        answer: "8"
        check: "16*Rational(1, 2)"
        difficulty: 3
        hints: ["16 × 0.5."]
        solution: "16 × 0.5 = 8 litres per minute"

  - code: bio9.excretion.kidney
    title: Excretion and the kidneys
    after: [bio9.respiration.cellular, bio9.transport.blood]
    notes: |
      Excretion is the removal of metabolic wastes. Urea (from breaking down extra amino acids in the
      liver) is removed by the kidneys; CO₂ by the lungs; sweat (water, salts, some urea) by the skin.
      The urinary system: two kidneys, ureters, urinary bladder, urethra. Each kidney has about a
      million nephrons. In a nephron, blood is filtered in the glomerulus inside Bowman's capsule;
      useful substances (glucose, most water, salts) are reabsorbed in the tubule; the rest is urine.
    explanations:
      text: "Your kidneys clean your blood all day. In each nephron, a tiny knot of capillaries (the glomerulus) squeezes fluid out of the blood into a cup (Bowman's capsule). As this fluid flows along the tubule, the body takes back the glucose, salts and most of the water it needs. What is left, mostly water and urea, is urine."
      visual: "Draw a cup holding a ball of wool (Bowman's capsule and glomerulus), with a long winding tube leading from the cup. Arrows show filtering into the cup, and taking back useful things from the tube into the surrounding blood."
      step_by_step: "Path of urine: Step 1: Formed in nephrons in the kidneys. Step 2: Carried down the ureters. Step 3: Stored in the urinary bladder. Step 4: Passed out through the urethra."
      real_world: "When kidneys fail, a dialysis machine filters the patient's blood instead. Drinking enough water helps prevent kidney stones."
    items:
      - prompt: "What is the working unit of the kidney?"
        options: ["Nephron", "Neuron", "Alveolus", "Villus"]
        answer: "Nephron"
        difficulty: 1
        hints: ["Each kidney has about a million of them."]
        solution: "The nephron filters blood and forms urine."
        mistakes: {"Neuron": nephron_unit, "Alveolus": nephron_unit}
      - prompt: "Which organ removes carbon dioxide from the body?"
        options: ["Lungs", "Kidneys", "Liver", "Stomach"]
        answer: "Lungs"
        difficulty: 1
        hints: ["We breathe it out."]
        solution: "CO₂ is excreted through the lungs when we breathe out."
        mistakes: {"Kidneys": urea_kidney}
      - prompt: "Where is urea made in the body?"
        options: ["Liver", "Kidneys", "Bladder", "Lungs"]
        answer: "Liver"
        difficulty: 2
        hints: ["Made in one organ, removed by another."]
        solution: "The liver makes urea from extra amino acids; the kidneys remove it."
        mistakes: {"Kidneys": urea_kidney}
      - prompt: "Which tube carries urine from the kidney to the bladder?"
        options: ["Ureter", "Urethra", "Renal artery", "Bronchus"]
        answer: "Ureter"
        difficulty: 2
        hints: ["Two of them, one from each kidney."]
        solution: "Ureters carry urine to the bladder; the urethra carries it out of the body."
      - prompt: "In a healthy person, which substance is filtered into the nephron but fully reabsorbed, so it is not found in urine?"
        options: ["Glucose", "Urea", "Excess salt", "Excess water"]
        answer: "Glucose"
        difficulty: 3
        hints: ["The body needs it for energy."]
        solution: "All glucose is reabsorbed in the tubule. Glucose in urine is a sign of diabetes."
      - prompt: "The kidneys filter about 180 litres of fluid a day, and about 1.5 litres leave as urine. How many litres are reabsorbed?"
        answer: "178.5"
        check: "180 - Rational(3, 2)"
        difficulty: 2
        hints: ["Subtract the urine from the filtrate."]
        solution: "180 − 1.5 = 178.5 litres are taken back into the blood."
