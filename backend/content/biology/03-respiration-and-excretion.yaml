# Class 9 Biology, chapter 3. Format: content/README.md.
# Also uses tips from earlier chapters: count_atoms.
subject: bio
chapter: 3
title: Respiration and Excretion

tips:
  aerobic_air: '"Aerobic" comes from the Greek for air. Which gas from the air do cells use up, and which do they give out?'
  complete_breakdown: Ethanol and lactic acid still hold energy. Which kind of respiration breaks glucose down all the way to carbon dioxide and water?
  below_lungs: The heart sits between the lungs. Look for the dome-shaped muscle sheet under the lungs that separates the chest from the belly.
  ribs_bigger_chest: Breathing in needs a bigger chest. Which way must the ribs move to make more room?
  oxygen_debt: "During the race the muscles ran short of oxygen and made a substance that must now be cleared. What does clearing it need?"
  diaphragm_exhale: "Breathing out is the reverse of breathing in. What does a contracted, flat diaphragm do when it relaxes?"
  many_alveoli: "Gas exchange happens across a surface. What do millions of tiny sacs give the lungs?"
  oxygen_used: "Find the oxygen that went in and the oxygen that came out. The blood kept the difference."
  water_balance: "The kidneys keep the body's water steady. With extra water coming in, what must go out?"
  urine_path: "Urine is made in the kidney, carried down to be stored, then let out. Put the tubes and the bladder in that order."
  breathing_not_respiration: "Breathing moves air in and out of the lungs. Respiration is the release of energy from food inside cells."
  anaerobic_products: "With oxygen, glucose breaks down fully to a gas and water. Without oxygen, muscles and yeast make different products. Bread rises because yeast gives off a gas."
  aerobic_more_energy: "Aerobic respiration releases far more energy from each glucose than anaerobic respiration."
  diaphragm_inhale: "Breathing in: the diaphragm contracts and flattens, the ribs move up and out, the chest gets bigger and air rushes in."
  alveoli_exchange: "The windpipe and its branches only carry air. Gases cross into blood where walls are one cell thin, in millions of tiny sacs at the very ends of the branches."
  nephron_unit: "The kidney's working unit is a tiny filter-and-tube that makes urine. A neuron belongs to the nervous system and an alveolus to the lungs."
  urea_kidney: "Each waste has a maker and a remover: carbon dioxide leaves with every breath out, and urea is made in the big organ that processes food and drugs before the kidneys remove it."
  airway_order: "Air goes in through the windpipe (trachea) first, which branches into bronchi, then smaller bronchioles, ending in the alveoli."
  cartilage_rings: "Feel the front of your throat: firm, C-shaped bands hold the windpipe open. Mucus only traps dust, and the diaphragm is below the lungs."
  glucose_reabsorbed: "Urine carries away wastes and extras. Which substance is too useful as fuel to waste, so a healthy kidney takes all of it back?"
  mitochondria_power: "Each organelle has one main job: one makes food with light, one controls the cell, and one releases energy from food. Which is called the powerhouse of the cell?"
  subtract_reabsorbed: "What is reabsorbed is what is filtered minus what leaves as urine."
  ureter_urethra: "Two tubes with similar names: the one from each kidney down to the bladder is the longer word ending -er; the single tube out of the body ends -ra."
  count_atoms_r: The number in front multiplies every atom in that formula. Count the atoms of the element asked on the side asked.
  ratio_divide: '"How many times more" means divide one amount by the other, not subtract.'

concepts:
  - code: bio9.respiration.cellular
    title: Respiration in cells
    notes: |
      Respiration releases energy from food (glucose) inside cells, stored as ATP. Aerobic respiration
      (with oxygen, in mitochondria): C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy. Anaerobic respiration
      (without oxygen): in yeast, glucose → ethanol + CO₂ + a little energy (fermentation); in muscles
      during heavy exercise, glucose → lactic acid + a little energy, causing cramps. Aerobic
      respiration releases much more energy. The first step, glucose → pyruvate, happens in the
      cytoplasm.
    explanations:
      text: "Every cell burns glucose slowly to get energy, but with no flame. With plenty of oxygen, in the mitochondria, glucose is broken all the way to carbon dioxide and water, releasing lots of energy. When a sprinter runs out of oxygen, muscle cells break glucose only to lactic acid, which gives much less energy and causes cramps."
      visual: "Draw a fork: glucose at the top, splitting into pyruvate. One branch, 'with oxygen, in mitochondria', leads to CO₂ + water + lots of energy. The other, 'no oxygen', leads to lactic acid (muscle) or ethanol + CO₂ (yeast) + a little energy."
      step_by_step: "Why does dough rise? Step 1: Yeast in the dough respires anaerobically. Step 2: It makes carbon dioxide gas (and a little ethanol). Step 3: The gas bubbles make the dough swell."
      real_world: "Appam and idli batter rise because yeast and bacteria ferment it, releasing carbon dioxide."
    activity:
      type: sort
      prompt: Aerobic (with oxygen) or anaerobic (without)?
      bins:
      - Aerobic
      - Anaerobic
      items:
      - label: Uses oxygen
        bin: Aerobic
        clue: Which kind needs the air we breathe in?
        why: Using oxygen is aerobic.
      - label: Makes lactic acid in tired muscles
        bin: Anaerobic
        clue: When muscles run short of oxygen, which kind takes over?
        why: Without enough oxygen, muscles respire anaerobically and make lactic acid.
      - label: Yeast making alcohol
        bin: Anaerobic
        clue: Is there oxygen inside a sealed dough or brew?
        why: 'Without oxygen, yeast makes alcohol: anaerobic.'
      - label: Releases the most energy
        bin: Aerobic
        clue: Which one breaks glucose down completely?
        why: 'Aerobic respiration breaks glucose down fully: the most energy.'
      - label: Gives carbon dioxide and water
        bin: Aerobic
        clue: Which one breaks glucose all the way down?
        why: 'Complete breakdown with oxygen gives CO₂ and water: aerobic.'
      - label: Causes cramps after a hard run
        bin: Anaerobic
        clue: What builds up in muscles short of oxygen?
        why: Lactic acid from anaerobic respiration.
    lesson:
      - teach: 'Every cell needs energy to work. It gets it by respiration: breaking down glucose from food. Respiration is not breathing; it happens inside every cell. The energy is stored in a molecule called ATP, the cell''s energy currency.'
        check:
          prompt: Where does respiration take place?
          options:
          - Inside every living cell
          - Only in the lungs
          - Only in the nose
          answer: Inside every living cell
          why: Breathing happens in the lungs, but respiration happens in cells.
        ways:
        - style: real_world
          teach: Breathing is like a lorry bringing fuel to a factory. Respiration is the factory burning that fuel to make power. It happens inside every cell, breaking down glucose, and the energy is stored in ATP, like charged batteries the cell can spend.
      - teach: 'With oxygen, cells use aerobic respiration, mainly in the mitochondria: glucose + oxygen → carbon dioxide + water + a lot of energy. C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O. Glucose is broken down completely.'
        check:
          prompt: Which cell part is called the powerhouse of the cell?
          options:
          - Mitochondria
          - Nucleus
          - Chloroplast
          answer: Mitochondria
          why: Most of aerobic respiration happens there.
        ways:
        - style: step_by_step
          teach: 'Step 1: glucose enters the cell. Step 2: with oxygen, it is broken down fully in the mitochondria. Step 3: the products are carbon dioxide and water. Step 4: a lot of energy is released, which is why mitochondria are called the powerhouse.'
      - teach: Without oxygen, cells use anaerobic respiration and get much less energy. Yeast makes ethanol and carbon dioxide (fermentation; the gas makes appam batter rise). Our muscles, short of oxygen in a sprint, make lactic acid, which causes cramps.
        picture:
          kind: compare
          columns:
          - title: Aerobic
            points:
            - needs oxygen
            - CO₂ + water
            - lots of energy
          - title: Anaerobic (yeast)
            points:
            - no oxygen
            - ethanol + CO₂
            - little energy
          - title: Anaerobic (muscle)
            points:
            - short of oxygen
            - lactic acid
            - little energy, cramps
          alt: Aerobic respiration gives much more energy than the two kinds of anaerobic respiration.
        check:
          prompt: What does yeast make without oxygen?
          options:
          - Ethanol and carbon dioxide
          - Lactic acid
          - Water and oxygen
          answer: Ethanol and carbon dioxide
          why: This is fermentation; muscles make lactic acid instead.
        ways:
        - style: real_world
          teach: 'Appam batter left overnight rises and smells slightly sour: yeast in it respires without oxygen, making ethanol and carbon dioxide bubbles. During a fast race, your leg muscles also run short of oxygen and make lactic acid, which causes cramps. Without oxygen, cells get much less energy.'
    items:
      - prompt: "Where in the cell does aerobic respiration mainly take place?"
        options: ["Mitochondria", "Chloroplasts", "Nucleus", "Cell wall"]
        answer: "Mitochondria"
        difficulty: 1
        hints: ["The powerhouse of the cell."]
        solution: "Mitochondria carry out aerobic respiration."
        mistakes: {"Chloroplasts": "mitochondria_power", "Nucleus": "mitochondria_power"}
      - prompt: "What are the products of aerobic respiration?"
        options: ["Carbon dioxide, water and energy", "Lactic acid and energy", "Ethanol and carbon dioxide", "Glucose and oxygen"]
        answer: "Carbon dioxide, water and energy"
        difficulty: 1
        hints: ["Glucose is broken down completely."]
        solution: "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy."
        mistakes: {"Lactic acid and energy": anaerobic_products, "Glucose and oxygen": breathing_not_respiration}
      - prompt: "What causes muscle cramps after heavy exercise?"
        options: ["Build-up of lactic acid", "Build-up of ethanol", "Too much oxygen", "Too much glucose"]
        answer: "Build-up of lactic acid"
        difficulty: 2
        hints: ["Muscles respire without enough oxygen."]
        solution: "Anaerobic respiration in muscles makes lactic acid."
        mistakes: {"Build-up of ethanol": anaerobic_products}
      - prompt: "Which gas makes bread dough and appam batter rise?"
        options: ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"]
        answer: "Carbon dioxide"
        difficulty: 1
        hints: ["Yeast ferments sugar."]
        solution: "Yeast respiring anaerobically releases carbon dioxide."
        mistakes: {"Oxygen": anaerobic_products}
      - prompt: "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, how many water molecules are made from one glucose molecule?"
        answer: "6"
        check: "12/2"
        difficulty: 2
        hints: ["Glucose has 12 hydrogen atoms; each water takes 2."]
        solution: "12 H atoms ÷ 2 per water = 6 water molecules."
        mistakes: {"12": count_atoms, "1": count_atoms}
      - prompt: "Why does aerobic respiration give a cell more energy than anaerobic respiration?"
        options: ["Glucose is broken down completely to carbon dioxide and water", "It uses more glucose", "It happens faster", "It happens in the nucleus"]
        answer: "Glucose is broken down completely to carbon dioxide and water"
        difficulty: 3
        hints: ["Lactic acid and ethanol still contain energy."]
        solution: "Anaerobic respiration leaves energy locked in lactic acid or ethanol; aerobic respiration releases it all."
        mistakes: {"It uses more glucose": aerobic_more_energy}
      - prompt: "Yeast is kept in a sealed bottle of sugar solution with no air. What does it make?"
        options: ["Ethanol and carbon dioxide", "Lactic acid", "Oxygen and water", "Glucose and oxygen"]
        answer: "Ethanol and carbon dioxide"
        difficulty: 2
        hints: ["No air means anaerobic respiration.", "What do yeast make in fermentation?"]
        solution: "Step 1: Without oxygen yeast respire anaerobically. Step 2: Glucose → ethanol + carbon dioxide + a little energy."
        mistakes: {"Lactic acid": anaerobic_products, "Oxygen and water": anaerobic_products, "Glucose and oxygen": breathing_not_respiration}
      - prompt: "After a race, an athlete keeps breathing hard for some minutes even though they have stopped running. Why?"
        options: ["Extra oxygen is needed to break down the lactic acid made during the race", "To cool the body down", "Because the lungs are tired", "To make more glucose"]
        answer: "Extra oxygen is needed to break down the lactic acid made during the race"
        difficulty: 3
        hints: ["During the race, muscles respired without enough oxygen.", "What built up in them?"]
        solution: "Step 1: Muscles made lactic acid by anaerobic respiration. Step 2: Clearing it needs oxygen, so heavy breathing continues (an 'oxygen debt')."
        mistakes: {"To cool the body down": oxygen_debt, "Because the lungs are tired": oxygen_debt, "To make more glucose": oxygen_debt}
      - prompt: "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, how many oxygen atoms are on the right-hand side?"
        answer: "18"
        check: "6*2 + 6*1"
        difficulty: 3
        hints: ["6CO₂ has 6 × 2 oxygen atoms.", "6H₂O has 6 × 1."]
        solution: "Step 1: 6CO₂: 12 O atoms. Step 2: 6H₂O: 6 O atoms. Step 3: Total 18 (matching 6 in glucose + 12 in 6O₂)."
        mistakes: {"12": count_atoms, "6": count_atoms, "3": count_atoms}
      - prompt: Which gas is needed for aerobic respiration?
        options:
        - Oxygen
        - Carbon dioxide
        - Nitrogen
        - Hydrogen
        answer: Oxygen
        difficulty: 1
        hints:
        - '''Aerobic'' comes from the word for air.'
        - Which gas in air do cells use?
        solution: 'Step 1: Aerobic means with air. Step 2: Cells use one gas from air to break down glucose. Step 3: That gas is oxygen.'
        mistakes:
          Carbon dioxide: aerobic_air
      - prompt: In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, how many carbon dioxide molecules come from one glucose molecule?
        answer: '6'
        check: '6'
        difficulty: 1
        hints:
        - Look at the number in front of CO₂.
        - 'Glucose has 6 carbon atoms: where do they go?'
        solution: 'Step 1: Glucose has 6 carbon atoms. Step 2: Each CO₂ has one carbon. Step 3: 6 CO₂ molecules form.'
        mistakes:
          '12': count_atoms_r
          '1': count_atoms_r
      - prompt: Why do idli and dosa batters rise when left overnight?
        options:
        - Yeast and bacteria respire anaerobically and release carbon dioxide
        - Water evaporates
        - Oxygen is absorbed
        - The rice grows
        answer: Yeast and bacteria respire anaerobically and release carbon dioxide
        difficulty: 2
        hints:
        - Microbes in the batter are respiring.
        - Which gas makes bubbles?
        solution: 'Step 1: Microbes in the batter ferment its sugars. Step 2: Fermentation releases carbon dioxide. Step 3: The gas bubbles make the batter rise.'
        mistakes:
          Oxygen is absorbed: anaerobic_products
      - prompt: Which kind of respiration gives the most energy from one glucose molecule?
        options:
        - Aerobic respiration
        - Anaerobic respiration in yeast
        - Anaerobic respiration in muscles
        - They all give the same
        answer: Aerobic respiration
        difficulty: 2
        hints:
        - Which kind breaks glucose down completely?
        - Ethanol and lactic acid still hold energy.
        solution: 'Step 1: Anaerobic products (ethanol, lactic acid) still hold energy. Step 2: Aerobic respiration breaks glucose fully to CO₂ and water. Step 3: It releases the most energy.'
        mistakes:
          They all give the same: complete_breakdown
      - prompt: A sprinter's legs ache at the end of a 100 m race. Which substance has built up in the muscles?
        options:
        - Lactic acid
        - Ethanol
        - Glucose
        - Urea
        answer: Lactic acid
        difficulty: 2
        hints:
        - The muscles ran short of oxygen.
        - What do muscles make without oxygen?
        solution: 'Step 1: Sprinting uses oxygen faster than it arrives. Step 2: Muscles switch to anaerobic respiration. Step 3: Lactic acid builds up and causes aching.'
        mistakes:
          Ethanol: anaerobic_products
      - prompt: In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, how many hydrogen atoms are on the right-hand side?
        answer: '12'
        check: 6*2
        difficulty: 3
        hints:
        - Hydrogen is only in water on the right.
        - Each H₂O has 2 hydrogens; there are 6 of them.
        solution: 'Step 1: Hydrogen appears only in 6H₂O. Step 2: 6 × 2 = 12. Step 3: 12 hydrogen atoms, matching the 12 in glucose.'
        mistakes:
          '2': count_atoms_r
          '6': count_atoms_r

  - code: bio9.respiration.breathing
    title: Breathing and the lungs
    after: [bio9.respiration.cellular]
    notes: |
      Air passes nose → pharynx → larynx → trachea → bronchi → bronchioles → alveoli. Inhaling: the
      diaphragm contracts and flattens and the intercostal muscles lift the ribs, so the chest volume
      increases, pressure falls and air flows in. Exhaling: they relax and air is pushed out. Gas
      exchange is by diffusion in the alveoli: oxygen into the blood, carbon dioxide out. Rings of
      cartilage keep the trachea open.
    explanations:
      text: "Your lungs are like sponges full of millions of tiny balloons, the alveoli. When the dome-shaped diaphragm below them pulls down, the chest gets bigger and air is sucked in. In each alveolus, oxygen slips across a wall one cell thick into the blood, and carbon dioxide slips out."
      visual: "Draw a bell jar model: the jar is the chest, two balloons are the lungs, and a rubber sheet at the bottom is the diaphragm. Pull the sheet down: the balloons fill. Push it up: they empty."
      step_by_step: "Path of air to the blood: Step 1: Nose (filtered and warmed). Step 2: Trachea (kept open by cartilage rings). Step 3: Bronchi and bronchioles. Step 4: Alveoli: oxygen diffuses into the capillaries."
      real_world: "Smoking damages the alveoli and the cilia in the airways, which is why smokers become breathless and cough."
    activity:
      type: order
      prompt: Put the path of air into the lungs in order.
      steps:
      - Nose
      - Pharynx
      - Larynx
      - Trachea
      - Bronchi
      - Bronchioles
      - Alveoli
      reasons:
        Pharynx: Air comes in through the nose first.
        Larynx: The pharynx (throat) leads to the voice box.
        Trachea: The windpipe starts below the voice box.
        Bronchi: The trachea splits into two bronchi.
        Bronchioles: The bronchi branch into smaller bronchioles.
        Alveoli: The tiny air sacs are at the very ends of the bronchioles.
    lesson:
      - teach: Breathing moves air in and out of the lungs. Air enters through the nose, where hairs and mucus trap dust, then goes down the trachea (windpipe), held open by rings of cartilage. The trachea splits into two bronchi, which branch into bronchioles, ending in tiny air sacs, the alveoli.
        picture:
          kind: flow
          steps:
          - Nose
          - Pharynx and larynx
          - Trachea
          - Bronchi
          - Bronchioles
          - Alveoli
          alt: Air passes from the nose through the trachea, bronchi and bronchioles to the alveoli.
        check:
          prompt: Which tube comes right after the trachea?
          options:
          - Bronchi
          - Alveoli
          - Nose
          answer: Bronchi
          why: The trachea divides into two bronchi, one for each lung.
        ways:
        - style: step_by_step
          teach: 'Step 1: air enters the nose, where hairs and mucus trap dust. Step 2: it goes down the trachea. Step 3: the trachea splits into two bronchi, one for each lung. Step 4: these branch into bronchioles, ending in tiny air sacs, the alveoli.'
      - teach: To breathe in, the diaphragm (a dome-shaped muscle below the lungs) contracts and flattens, and the rib muscles lift the ribs. The chest gets bigger, the pressure inside falls, and air rushes in. To breathe out, they relax and air is pushed out.
        check:
          prompt: When the chest gets bigger, what happens to the air pressure inside the lungs?
          options:
          - It falls, so air flows in
          - It rises, so air flows out
          - It stays the same
          answer: It falls, so air flows in
          why: More space means lower pressure; air moves in from outside.
        ways:
        - style: real_world
          teach: 'Pull the plunger of a syringe with its tip in water, and water rushes in. Making the space bigger lowers the pressure inside. Your diaphragm and rib muscles do this to your chest: the space grows, pressure falls, and air rushes into the lungs.'
      - teach: 'In the alveoli, gases are exchanged by diffusion. Oxygen passes from the air into the blood; carbon dioxide passes from the blood into the air. Alveoli have walls one cell thin, a rich blood supply, and there are about 300 million of them: a huge surface.'
        check:
          prompt: Which gas passes from the blood into the alveoli?
          options:
          - Carbon dioxide
          - Oxygen
          - Nitrogen
          answer: Carbon dioxide
          why: Blood brings CO₂ from the cells to be breathed out.
        ways:
        - style: step_by_step
          teach: 'Step 1: in the alveoli, the air has lots of oxygen and the blood has little, so oxygen moves into the blood. Step 2: the blood has lots of carbon dioxide and the air has little, so carbon dioxide moves out. Step 3: thin walls and a huge number of alveoli make it fast.'
    items:
      - prompt: "Where does gas exchange take place in the lungs?"
        options: ["Alveoli", "Trachea", "Bronchi", "Larynx"]
        answer: "Alveoli"
        difficulty: 1
        hints: ["Tiny air sacs."]
        solution: "The alveoli have thin walls and many capillaries for gas exchange."
        mistakes: {"Trachea": alveoli_exchange, "Bronchi": alveoli_exchange}
      - prompt: "What happens to the diaphragm when we breathe in?"
        options: ["It contracts and flattens", "It relaxes and becomes dome-shaped", "It does not move", "It moves upward"]
        answer: "It contracts and flattens"
        difficulty: 1
        hints: ["The chest must get bigger."]
        solution: "The diaphragm contracts and flattens, enlarging the chest."
        mistakes: {"It relaxes and becomes dome-shaped": diaphragm_inhale, "It moves upward": diaphragm_inhale}
      - prompt: "Which is the correct order of the air passage?"
        options: ["Trachea → bronchi → bronchioles → alveoli", "Bronchi → trachea → alveoli → bronchioles", "Alveoli → bronchioles → bronchi → trachea", "Trachea → alveoli → bronchi → bronchioles"]
        answer: "Trachea → bronchi → bronchioles → alveoli"
        difficulty: 2
        hints: ["From the biggest tube to the smallest sac."]
        solution: "The windpipe branches into bronchi, then bronchioles, ending in alveoli."
        mistakes: {"Bronchi → trachea → alveoli → bronchioles": "airway_order", "Alveoli → bronchioles → bronchi → trachea": "airway_order", "Trachea → alveoli → bronchi → bronchioles": "airway_order"}
      - prompt: "What keeps the trachea from collapsing?"
        options: ["Rings of cartilage", "Muscles of the diaphragm", "Mucus", "The ribs"]
        answer: "Rings of cartilage"
        difficulty: 2
        hints: ["Feel the ridges at the front of your throat."]
        solution: "C-shaped cartilage rings hold the trachea open."
        mistakes: {"Mucus": "cartilage_rings", "Muscles of the diaphragm": "cartilage_rings"}
      - prompt: "Breathing and respiration are different. Which statement is correct?"
        options: ["Breathing moves air; respiration releases energy in cells", "They are the same process", "Respiration moves air; breathing releases energy", "Only plants respire"]
        answer: "Breathing moves air; respiration releases energy in cells"
        difficulty: 2
        hints: ["One is physical, one is chemical."]
        solution: "Breathing is moving air in and out; respiration is the chemical release of energy from food."
        mistakes: {"They are the same process": breathing_not_respiration, "Respiration moves air; breathing releases energy": breathing_not_respiration}
      - prompt: "A person breathes 16 times a minute, taking in 0.5 litres each breath. How many litres of air do they breathe in per minute?"
        answer: "8"
        check: "16*Rational(1, 2)"
        difficulty: 3
        hints: ["16 × 0.5."]
        solution: "16 × 0.5 = 8 litres per minute"

        mistakes: {"32": "times_not_plus", "16.5": "times_not_plus"}
      - prompt: "When we breathe out, what happens to the diaphragm?"
        options: ["It relaxes and becomes dome-shaped", "It contracts and flattens", "It moves down", "It stays still"]
        answer: "It relaxes and becomes dome-shaped"
        difficulty: 2
        hints: ["Breathing in: it contracts and flattens.", "Breathing out is the opposite."]
        solution: "Step 1: The diaphragm relaxes and rises into a dome. Step 2: The chest gets smaller and air is pushed out."
        mistakes: {"It contracts and flattens": diaphragm_exhale, "It moves down": diaphragm_exhale, "It stays still": diaphragm_exhale}
      - prompt: "Human lungs have about 300 million alveoli. What is the advantage of having so many?"
        options: ["They give a huge surface for gas exchange", "They store a lot of air for later", "They make mucus to trap dust", "They make red blood cells"]
        answer: "They give a huge surface for gas exchange"
        difficulty: 2
        hints: ["What happens across the alveolus walls?", "Many small sacs have far more surface than one big sac."]
        solution: "Step 1: Gases diffuse across alveolus walls. Step 2: Millions of tiny sacs give a surface of about 70 m², so exchange is fast."
        mistakes: {"They store a lot of air for later": many_alveoli, "They make mucus to trap dust": many_alveoli, "They make red blood cells": many_alveoli}
      - prompt: "Air breathed in is about 21% oxygen and air breathed out about 16%. A person breathes 8 litres of air a minute. About how many litres of oxygen does the blood take in each minute?"
        answer: "0.4"
        check: "8*(21-16)/100"
        difficulty: 3
        hints: ["The blood keeps 21% − 16% of the air.", "5% of 8 litres."]
        solution: "Step 1: Oxygen kept = 5% of the air. Step 2: 5% of 8 = 0.4 litres a minute."
        mistakes: {"5": oxygen_used, "1.68": oxygen_used, "1.28": oxygen_used}
      - prompt: Which muscle sheet below the lungs helps us breathe?
        options:
        - Diaphragm
        - Biceps
        - Heart
        - Stomach wall
        answer: Diaphragm
        difficulty: 1
        hints:
        - It separates the chest from the abdomen.
        - It is dome-shaped when relaxed.
        solution: 'Step 1: Breathing needs the chest to change size. Step 2: A dome-shaped muscle below the lungs does this. Step 3: It is the diaphragm.'
        mistakes:
          Heart: below_lungs
      - prompt: 'Tiny air sacs at the ends of the bronchioles are called:'
        options:
        - Alveoli
        - Villi
        - Nephrons
        - Stomata
        answer: Alveoli
        difficulty: 1
        hints:
        - They are in the lungs.
        - Villi are in the small intestine.
        solution: 'Step 1: Bronchioles end in tiny sacs. Step 2: Gas exchange happens there. Step 3: They are alveoli.'
        mistakes:
          Villi: many_alveoli
          Nephrons: nephron_unit
      - prompt: When we breathe in, what do the ribs do?
        options:
        - Move up and out
        - Move down and in
        - Stay still
        - Break apart
        answer: Move up and out
        difficulty: 2
        hints:
        - Breathing in makes the chest bigger.
        - Which movement of the ribs would do that?
        solution: 'Step 1: Breathing in needs a bigger chest. Step 2: Rib muscles lift the ribs. Step 3: The ribs move up and out.'
        mistakes:
          Move down and in: ribs_bigger_chest
      - prompt: A person breathes 15 times a minute, taking in 0.4 litres each time. How many litres of air do they breathe in per minute?
        answer: '6'
        check: 15*0.4
        difficulty: 2
        hints:
        - Air per breath × breaths per minute.
        - 15 × 0.4.
        solution: 'Step 1: 0.4 L per breath. Step 2: 15 breaths. Step 3: 15 × 0.4 = 6 litres a minute.'
        mistakes:
          '37.5': oxygen_used
      - prompt: Why do we breathe faster when we run?
        options:
        - Muscles respire faster and need more oxygen
        - The lungs shrink
        - The heart stops
        - We need less carbon dioxide
        answer: Muscles respire faster and need more oxygen
        difficulty: 2
        hints:
        - Running muscles use a lot of energy.
        - What does respiration need?
        solution: 'Step 1: Running muscles need more energy. Step 2: They respire faster and need more oxygen. Step 3: Faster breathing supplies it and removes the extra CO₂.'
        mistakes:
          The lungs shrink: breathing_not_respiration
      - prompt: Air breathed in is about 0.04% carbon dioxide and air breathed out about 4%. How many times more carbon dioxide does breathed-out air hold?
        answer: '100'
        check: 4/0.04
        difficulty: 3
        hints:
        - '''How many times'' means divide.'
        - 4 ÷ 0.04.
        solution: 'Step 1: Out: 4%. Step 2: In: 0.04%. Step 3: 4 ÷ 0.04 = 100 times.'
        mistakes:
          '3.96': ratio_divide
  - code: bio9.excretion.kidney
    title: Excretion and the kidneys
    after: [bio9.respiration.cellular, bio9.transport.blood]
    notes: |
      Excretion is the removal of metabolic wastes. Urea (from breaking down extra amino acids in the
      liver) is removed by the kidneys; CO₂ by the lungs; sweat (water, salts, some urea) by the skin.
      The urinary system: two kidneys, ureters, urinary bladder, urethra. Each kidney has about a
      million nephrons. In a nephron, blood is filtered in the glomerulus inside Bowman's capsule;
      useful substances (glucose, most water, salts) are reabsorbed in the tubule; the rest is urine.
    explanations:
      text: "Your kidneys clean your blood all day. In each nephron, a tiny knot of capillaries (the glomerulus) squeezes fluid out of the blood into a cup (Bowman's capsule). As this fluid flows along the tubule, the body takes back the glucose, salts and most of the water it needs. What is left, mostly water and urea, is urine."
      visual: "Draw a cup holding a ball of wool (Bowman's capsule and glomerulus), with a long winding tube leading from the cup. Arrows show filtering into the cup, and taking back useful things from the tube into the surrounding blood."
      step_by_step: "Path of urine: Step 1: Formed in nephrons in the kidneys. Step 2: Carried down the ureters. Step 3: Stored in the urinary bladder. Step 4: Passed out through the urethra."
      real_world: "When kidneys fail, a dialysis machine filters the patient's blood instead. Drinking enough water helps prevent kidney stones."
    activity:
      type: order
      prompt: Put the path of urine in order.
      steps:
      - Blood is filtered in the kidneys
      - Urine flows down the ureters
      - It is stored in the urinary bladder
      - It leaves through the urethra
      reasons:
        Urine flows down the ureters: There's no urine until the kidneys have filtered the blood.
        It is stored in the urinary bladder: Urine reaches the bladder through the ureters.
        It leaves through the urethra: Urine waits in the bladder before it leaves.
    lesson:
      - teach: Cells make wastes as they work. Removing them is excretion. Lungs remove carbon dioxide; skin removes some water and salt in sweat; kidneys remove urea, a waste made in the liver from extra proteins.
        check:
          prompt: Which organ removes urea?
          options:
          - Kidneys
          - Lungs
          - Stomach
          answer: Kidneys
          why: Urea is made in the liver and removed by the kidneys in urine.
        ways:
        - style: real_world
          teach: Every working factory makes rubbish that must be cleared. Our cells do too. The lungs clear carbon dioxide, the skin clears some salt and water in sweat, and the kidneys clear urea, made in the liver from extra protein.
      - teach: 'The urinary system: two kidneys make urine, two ureters carry it to the urinary bladder, which stores it, and the urethra carries it out of the body.'
        picture:
          kind: flow
          steps:
          - Kidney (makes urine)
          - Ureter
          - Urinary bladder (stores)
          - Urethra (out)
          alt: Urine travels from the kidneys through the ureters to the bladder and out through the urethra.
        check:
          prompt: Which organ stores urine?
          options:
          - Urinary bladder
          - Kidney
          - Ureter
          answer: Urinary bladder
          why: The bladder stores urine until it is passed out.
        ways:
        - style: step_by_step
          teach: 'Step 1: the kidneys filter the blood and make urine. Step 2: the ureters carry urine down. Step 3: the urinary bladder stores it. Step 4: the urethra carries it out of the body.'
      - teach: Each kidney has about a million nephrons. In each, blood is filtered in a knot of capillaries (the glomerulus) inside Bowman's capsule. Then, along the tubule, useful things like glucose, most water and salts are taken back into the blood. What is left is urine.
        check:
          prompt: Why is there no glucose in a healthy person's urine?
          options:
          - It is all reabsorbed in the tubule
          - It is never filtered
          - It turns into urea
          answer: It is all reabsorbed in the tubule
          why: Glucose is filtered, then fully taken back because it is useful.
        ways:
        - style: real_world
          teach: 'Imagine sorting a messy cupboard: first tip everything out, then put back what you want to keep, and what''s left goes in the bin. A nephron filters the blood at the glomerulus, then takes back glucose, most water and salts along the tubule. What remains is urine.'
    items:
      - prompt: "What is the working unit of the kidney?"
        options: ["Nephron", "Neuron", "Alveolus", "Villus"]
        answer: "Nephron"
        difficulty: 1
        hints: ["Each kidney has about a million of them."]
        solution: "The nephron filters blood and forms urine."
        mistakes: {"Neuron": nephron_unit, "Alveolus": nephron_unit}
      - prompt: "Which organ removes carbon dioxide from the body?"
        options: ["Lungs", "Kidneys", "Liver", "Stomach"]
        answer: "Lungs"
        difficulty: 1
        hints: ["We breathe it out."]
        solution: "CO₂ is excreted through the lungs when we breathe out."
        mistakes: {"Kidneys": urea_kidney}
      - prompt: "Where is urea made in the body?"
        options: ["Liver", "Kidneys", "Bladder", "Lungs"]
        answer: "Liver"
        difficulty: 2
        hints: ["Made in one organ, removed by another."]
        solution: "The liver makes urea from extra amino acids; the kidneys remove it."
        mistakes: {"Kidneys": urea_kidney}
      - prompt: "Which tube carries urine from the kidney to the bladder?"
        options: ["Ureter", "Urethra", "Renal artery", "Bronchus"]
        answer: "Ureter"
        difficulty: 2
        hints: ["Two of them, one from each kidney."]
        solution: "Ureters carry urine to the bladder; the urethra carries it out of the body."
        mistakes: {"Urethra": "ureter_urethra", "Renal artery": "ureter_urethra"}
      - prompt: "In a healthy person, which substance is filtered into the nephron but fully reabsorbed, so it is not found in urine?"
        options: ["Glucose", "Urea", "Excess salt", "Excess water"]
        answer: "Glucose"
        difficulty: 3
        hints: ["The body needs it for energy."]
        solution: "All glucose is reabsorbed in the tubule. Glucose in urine is a sign of diabetes."
        mistakes: {"Urea": "glucose_reabsorbed", "Excess salt": "glucose_reabsorbed", "Excess water": "glucose_reabsorbed"}
      - prompt: "The kidneys filter about 180 litres of fluid a day, and about 1.5 litres leave as urine. How many litres are reabsorbed?"
        answer: "178.5"
        check: "180 - Rational(3, 2)"
        difficulty: 2
        hints: ["Subtract the urine from the filtrate."]
        solution: "180 − 1.5 = 178.5 litres are taken back into the blood."
        mistakes: {"181.5": "subtract_reabsorbed", "1.5": "subtract_reabsorbed"}
      - prompt: "Which is the correct path of urine?"
        options: ["Kidney → ureter → bladder → urethra", "Kidney → urethra → bladder → ureter", "Bladder → kidney → ureter → urethra", "Kidney → bladder → ureter → urethra"]
        answer: "Kidney → ureter → bladder → urethra"
        difficulty: 2
        hints: ["Urine is made in the kidney.", "The longer-named tube comes first."]
        solution: "Step 1: Ureters carry urine from each kidney to the bladder. Step 2: The urethra takes it out of the body."
        mistakes: {"Kidney → urethra → bladder → ureter": ureter_urethra, "Bladder → kidney → ureter → urethra": urine_path, "Kidney → bladder → ureter → urethra": urine_path}
      - prompt: "On a cool day a person drinks much more water than usual. How do the kidneys respond?"
        options: ["They make more urine, which is more dilute", "They make less urine", "They make more concentrated urine", "Nothing changes"]
        answer: "They make more urine, which is more dilute"
        difficulty: 2
        hints: ["The body must keep its water content steady.", "On a cool day little water is lost as sweat."]
        solution: "Step 1: Extra water must be removed. Step 2: The kidneys reabsorb less water, so more, paler urine is made."
        mistakes: {"They make less urine": water_balance, "They make more concentrated urine": water_balance, "Nothing changes": water_balance}
      - prompt: "Blood plasma has about 0.04 g of urea in 100 mL, and urine about 2 g in 100 mL. How many times as concentrated is urea in urine?"
        answer: "50"
        check: "2/0.04"
        difficulty: 3
        hints: ["'How many times as' means divide.", "2 ÷ 0.04."]
        solution: "Step 1: 2 ÷ 0.04 = 50. Step 2: Urea is about 50 times as concentrated in urine, because water is reabsorbed."
        mistakes: {"1.96": ratio_subtracted, "0.02": ratio_subtracted, "5": ratio_subtracted}
      - prompt: Which part of the nephron filters the blood?
        options:
        - Glomerulus in Bowman's capsule
        - Ureter
        - Urethra
        - Bladder
        answer: Glomerulus in Bowman's capsule
        difficulty: 2
        hints:
        - Filtering happens at the start of the nephron.
        - It is a knot of capillaries in a cup.
        solution: 'Step 1: The nephron starts with a cup (Bowman''s capsule). Step 2: Inside it is a knot of capillaries, the glomerulus. Step 3: Blood is filtered there.'
        mistakes:
          Ureter: urine_path
      - prompt: What does sweat contain?
        options:
        - Water, salts and a little urea
        - Only oxygen
        - Glucose and proteins
        - Only carbon dioxide
        answer: Water, salts and a little urea
        difficulty: 1
        hints:
        - Sweat tastes salty.
        - The skin helps excretion a little.
        solution: 'Step 1: Sweat is mostly water. Step 2: It tastes salty, so it has salts. Step 3: It also carries a little urea.'
        mistakes:
          Only carbon dioxide: urea_kidney
      - prompt: Which tube carries urine out of the body from the bladder?
        options:
        - Urethra
        - Ureter
        - Trachea
        - Oesophagus
        answer: Urethra
        difficulty: 1
        hints:
        - Two tubes have similar names.
        - This one leaves the bladder, not the kidney.
        solution: 'Step 1: Ureters join the kidneys to the bladder. Step 2: A single tube leads out from the bladder. Step 3: That is the urethra.'
        mistakes:
          Ureter: ureter_urethra
      - prompt: The kidneys filter 170 litres of fluid in a day, and 1.2 litres leave as urine. How many litres are reabsorbed?
        answer: '168.8'
        check: 170-1.2
        difficulty: 2
        hints:
        - Reabsorbed = filtered − urine.
        - 170 − 1.2.
        solution: 'Step 1: Filtered: 170 L. Step 2: Urine: 1.2 L. Step 3: Reabsorbed: 168.8 L.'
        mistakes:
          '171.2': subtract_reabsorbed
      - prompt: On a very hot day you sweat a lot and drink little. What will your urine be like?
        options:
        - Less, and darker (more concentrated)
        - More, and paler
        - The same as usual
        - It will contain glucose
        answer: Less, and darker (more concentrated)
        difficulty: 3
        hints:
        - The body is losing water as sweat.
        - Will the kidneys save water or let more go?
        solution: 'Step 1: Sweating loses water. Step 2: The kidneys reabsorb more water to save it. Step 3: Less urine is made, and it is more concentrated.'
        mistakes:
          More, and paler: water_balance
      - prompt: If a person's kidneys fail, a machine can clean their blood. What is this called?
        options:
        - Dialysis
        - Digestion
        - Transpiration
        - Respiration
        answer: Dialysis
        difficulty: 3
        hints:
        - The machine does the kidneys' job of filtering blood.
        - It is not a natural body process.
        solution: 'Step 1: Failed kidneys can''t remove urea. Step 2: A machine filters the blood instead. Step 3: This is dialysis.'
        mistakes:
          Respiration: nephron_unit
