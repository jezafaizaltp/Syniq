# Class 9 Biology, chapter 2. Format: content/README.md.
subject: bio
chapter: 2
title: Digestion and Transport of Nutrients

tips:
  enzyme_food_match: "Amylase digests starch, pepsin and trypsin digest protein, lipase digests fat."
  digestion_order: "Food passes mouth → oesophagus → stomach → small intestine → large intestine."
  absorption_small_intestine: "Most digested food is absorbed in the small intestine, through its villi."
  bile_no_enzyme: "Bile has no enzymes. It breaks fat into small droplets (emulsification) so lipase can work faster."
  arteries_veins: "Arteries carry blood away from the heart; veins carry blood back to the heart."
  blood_cell_jobs: "Red blood cells carry oxygen, white blood cells fight germs, platelets help blood clot."
  heart_sides: "The right side of the heart pumps deoxygenated blood to the lungs; the left side pumps oxygenated blood to the body."
  double_circulation: "In one full circuit, blood passes through the heart twice: once for the lungs and once for the body."

concepts:
  - code: bio9.digestion.organs
    title: The digestive system
    notes: |
      Digestion breaks large, insoluble food molecules into small, soluble ones the body can absorb.
      The alimentary canal: mouth (chewing, saliva with salivary amylase) → oesophagus (peristalsis) →
      stomach (HCl, pepsin) → small intestine (bile from the liver, pancreatic juice, intestinal juice;
      digestion completed and absorption) → large intestine (water absorbed) → rectum and anus. The
      liver, gall bladder and pancreas are associated glands.
    explanations:
      text: "Food is a long journey through a tube about 9 metres long. Teeth and saliva start the work in the mouth, muscular waves push it down the food pipe, the stomach churns it with acid, the small intestine finishes digestion and absorbs nutrients, and the large intestine takes back water."
      visual: "Draw the tube from mouth to anus and label each stop: mouth, oesophagus, stomach, small intestine (long and coiled), large intestine. Put the liver above the stomach and the pancreas just below it."
      step_by_step: "Trace a bite of rice: Step 1: Mouth: chewed; amylase starts on starch. Step 2: Oesophagus: pushed down by peristalsis. Step 3: Stomach: churned with acid. Step 4: Small intestine: starch finished into glucose and absorbed. Step 5: Large intestine: water absorbed from what is left."
      real_world: "Chewing rice for a long time makes it taste sweet: amylase in saliva has started turning starch into sugar."
    items:
      - prompt: "Where does the digestion of starch begin?"
        options: ["Mouth", "Stomach", "Small intestine", "Large intestine"]
        answer: "Mouth"
        difficulty: 1
        hints: ["Saliva contains an enzyme."]
        solution: "Salivary amylase starts breaking starch in the mouth."
        mistakes: {"Stomach": digestion_order}
      - prompt: "Where is most digested food absorbed into the blood?"
        options: ["Small intestine", "Stomach", "Large intestine", "Oesophagus"]
        answer: "Small intestine"
        difficulty: 1
        hints: ["It is long and has villi."]
        solution: "The small intestine has a huge surface of villi for absorption."
        mistakes: {"Large intestine": absorption_small_intestine, "Stomach": absorption_small_intestine}
      - prompt: "Which part comes immediately after the stomach?"
        options: ["Small intestine", "Large intestine", "Oesophagus", "Rectum"]
        answer: "Small intestine"
        difficulty: 1
        hints: ["Its first part is the duodenum."]
        solution: "From the stomach, food passes into the small intestine."
        mistakes: {"Large intestine": digestion_order, "Oesophagus": digestion_order}
      - prompt: "What is the main job of the large intestine?"
        options: ["Absorbing water", "Digesting proteins", "Producing bile", "Chewing food"]
        answer: "Absorbing water"
        difficulty: 2
        hints: ["What is left after nutrients are absorbed?"]
        solution: "The large intestine absorbs water from undigested remains."
        mistakes: {"Digesting proteins": absorption_small_intestine}
      - prompt: "The wave-like muscle movement that pushes food along the alimentary canal is called:"
        options: ["Peristalsis", "Emulsification", "Absorption", "Assimilation"]
        answer: "Peristalsis"
        difficulty: 2
        hints: ["It works even if you eat upside down."]
        solution: "Peristalsis is the rhythmic contraction of the gut muscles."
        mistakes: {"Emulsification": bile_no_enzyme}
      - prompt: "Why is the inner wall of the small intestine folded into millions of villi?"
        options: ["To increase the surface area for absorption", "To make the food move faster", "To store food", "To produce saliva"]
        answer: "To increase the surface area for absorption"
        difficulty: 3
        hints: ["More surface, more absorption."]
        solution: "Villi greatly increase the surface area, so nutrients are absorbed quickly."

  - code: bio9.digestion.enzymes
    title: Digestive juices and enzymes
    after: [bio9.digestion.organs]
    notes: |
      Enzymes are biological catalysts. Salivary amylase: starch → maltose. Stomach: HCl kills germs
      and makes the medium acidic; pepsin: proteins → peptides. Liver: bile (no enzymes) emulsifies
      fats. Pancreas: pancreatic amylase, trypsin (proteins → peptides), lipase (fats → fatty acids +
      glycerol). Intestinal juice completes digestion: carbohydrates → glucose, proteins → amino acids.
    explanations:
      text: "Each enzyme is a key for one kind of lock. Amylase only cuts starch. Pepsin and trypsin cut proteins. Lipase cuts fats. By the end of the small intestine, starch has become glucose, proteins amino acids, and fats fatty acids and glycerol: all small enough to absorb."
      visual: "Make a three-row table: starch → glucose (amylase), protein → amino acids (pepsin, trypsin), fat → fatty acids + glycerol (lipase, helped by bile)."
      step_by_step: "How is a fried egg digested? Step 1: Its protein is cut by pepsin in the stomach. Step 2: Bile breaks the oil into tiny droplets. Step 3: Lipase and trypsin from the pancreas finish fat and protein. Step 4: Intestinal juice gives amino acids, fatty acids and glycerol."
      real_world: "People whose gall bladder is removed are told to eat less fatty food: without stored bile, fats are emulsified less well."
    items:
      - prompt: "Which enzyme digests starch?"
        options: ["Amylase", "Pepsin", "Lipase", "Trypsin"]
        answer: "Amylase"
        difficulty: 1
        hints: ["In saliva."]
        solution: "Amylase breaks starch into maltose."
        mistakes: {"Pepsin": enzyme_food_match, "Lipase": enzyme_food_match}
      - prompt: "Which enzyme digests fats?"
        options: ["Lipase", "Amylase", "Pepsin", "Maltase"]
        answer: "Lipase"
        difficulty: 1
        hints: ["Lipids are fats."]
        solution: "Lipase breaks fats into fatty acids and glycerol."
        mistakes: {"Pepsin": enzyme_food_match}
      - prompt: "What does bile do?"
        options: ["Breaks fats into small droplets", "Digests proteins", "Digests starch", "Kills germs with acid"]
        answer: "Breaks fats into small droplets"
        difficulty: 2
        hints: ["Bile has no enzymes."]
        solution: "Bile emulsifies fats, giving lipase a larger surface to act on."
        mistakes: {"Digests proteins": bile_no_enzyme}
      - prompt: "Proteins are finally digested into:"
        options: ["Amino acids", "Glucose", "Fatty acids", "Glycerol"]
        answer: "Amino acids"
        difficulty: 2
        hints: ["The building blocks of proteins."]
        solution: "Proteins are broken down into amino acids."
        mistakes: {"Glucose": enzyme_food_match}
      - prompt: "Why does the stomach produce hydrochloric acid?"
        options: ["To kill germs and give the acidic medium pepsin needs", "To digest starch", "To absorb water", "To make bile"]
        answer: "To kill germs and give the acidic medium pepsin needs"
        difficulty: 2
        hints: ["Pepsin works only in acid."]
        solution: "HCl kills microbes in food and gives pepsin the acidic medium it works in."
      - prompt: "Which organ produces trypsin, lipase and amylase together?"
        options: ["Pancreas", "Liver", "Stomach", "Salivary gland"]
        answer: "Pancreas"
        difficulty: 3
        hints: ["Its juice enters the small intestine."]
        solution: "Pancreatic juice contains all three."
        mistakes: {"Liver": bile_no_enzyme}

  - code: bio9.transport.blood
    title: Blood and blood vessels
    after: [bio9.digestion.organs]
    notes: |
      Blood is a fluid connective tissue: plasma (about 55%: water with dissolved food, salts,
      hormones, wastes, CO₂) and cells: red blood cells (haemoglobin, carry O₂), white blood cells
      (defence), platelets (clotting). Arteries carry blood away from the heart (thick elastic walls,
      high pressure); veins carry blood to the heart (thinner walls, valves); capillaries are one
      cell thick where exchange happens. Lymph carries absorbed fats and returns tissue fluid.
    explanations:
      text: "Blood is the body's delivery service. Plasma carries dissolved food, salts and wastes. Red cells, packed with haemoglobin, carry oxygen. White cells are the security guards. Platelets patch leaks. Arteries are the highways out from the heart, veins the roads back, and capillaries the tiny lanes that reach every cell."
      visual: "Draw a loop: heart → thick artery → branching capillaries around cells → joining into a vein with little valve flaps → back to the heart."
      step_by_step: "Why do veins have valves? Step 1: Blood in veins is at low pressure. Step 2: In the legs it must flow upward against gravity. Step 3: Valves stop it flowing backwards."
      real_world: "A blood test counts red cells, white cells and platelets. A low platelet count, as in dengue fever, means blood clots poorly."
    items:
      - prompt: "Which blood cells carry oxygen?"
        options: ["Red blood cells", "White blood cells", "Platelets", "Plasma cells"]
        answer: "Red blood cells"
        difficulty: 1
        hints: ["They contain haemoglobin."]
        solution: "Haemoglobin in red blood cells binds oxygen."
        mistakes: {"White blood cells": blood_cell_jobs, "Platelets": blood_cell_jobs}
      - prompt: "Which blood vessels carry blood away from the heart?"
        options: ["Arteries", "Veins", "Capillaries", "Lymph vessels"]
        answer: "Arteries"
        difficulty: 1
        hints: ["A for Away."]
        solution: "Arteries carry blood away from the heart."
        mistakes: {"Veins": arteries_veins}
      - prompt: "In dengue fever, the platelet count falls. Which job of blood is affected?"
        options: ["Clotting", "Carrying oxygen", "Fighting germs", "Carrying digested food"]
        answer: "Clotting"
        difficulty: 2
        hints: ["Platelets patch leaks."]
        solution: "Platelets help blood clot, so low platelets can cause bleeding."
        mistakes: {"Carrying oxygen": blood_cell_jobs, "Fighting germs": blood_cell_jobs}
      - prompt: "Why are capillary walls only one cell thick?"
        options: ["So materials can pass easily between blood and cells", "To carry blood at high pressure", "To store blood", "To pump blood"]
        answer: "So materials can pass easily between blood and cells"
        difficulty: 2
        hints: ["Exchange happens here."]
        solution: "Thin walls let oxygen, food and wastes diffuse through quickly."
      - prompt: "Plasma is about 55% of blood. In 5 litres of blood, about how many litres are plasma?"
        answer: "2.75"
        check: "Rational(55, 100)*5"
        difficulty: 2
        hints: ["55% of 5."]
        solution: "0.55 × 5 = 2.75 litres"
      - prompt: "Which vessels have valves to stop blood flowing backwards?"
        options: ["Veins", "Arteries", "Capillaries", "All vessels equally"]
        answer: "Veins"
        difficulty: 3
        hints: ["Blood pressure is low in them."]
        solution: "Veins carry low-pressure blood back to the heart and need valves."
        mistakes: {"Arteries": arteries_veins}

  - code: bio9.transport.heart
    title: The heart and circulation
    after: [bio9.transport.blood]
    notes: |
      The human heart has four chambers: two atria (receive blood) and two ventricles (pump blood).
      The right side receives deoxygenated blood from the body (vena cava) and pumps it to the lungs
      (pulmonary artery). The left side receives oxygenated blood from the lungs (pulmonary vein) and
      pumps it to the body (aorta). Valves prevent backflow. Blood passes through the heart twice in
      one circuit: double circulation. The left ventricle has the thickest wall.
    explanations:
      text: "The heart is two pumps side by side. The right pump sends used blood to the lungs to pick up oxygen. The left pump sends the fresh blood all round the body. The left ventricle has the thickest wall because it pushes blood the furthest. A normal heart beats about 72 times a minute at rest."
      visual: "Draw a box split into four rooms: top two are atria, bottom two ventricles. Colour the right side blue (deoxygenated) and the left side red (oxygenated). Arrows: body → right atrium → right ventricle → lungs → left atrium → left ventricle → body."
      step_by_step: "How many times does a heart beating 72 times a minute beat in an hour? Step 1: 60 minutes in an hour. Step 2: 72 × 60 = 4320 beats."
      real_world: "A doctor's stethoscope hears the 'lub-dub' of the heart valves closing. A blood-pressure reading like 120/80 measures pressure in the arteries."
    items:
      - prompt: "How many chambers does the human heart have?"
        answer: "4"
        check: "2 + 2"
        difficulty: 1
        hints: ["Two atria and two ventricles."]
        solution: "2 atria + 2 ventricles = 4 chambers."
        mistakes: {"2": heart_sides}
      - prompt: "Which chamber pumps oxygenated blood to the whole body?"
        options: ["Left ventricle", "Right ventricle", "Left atrium", "Right atrium"]
        answer: "Left ventricle"
        difficulty: 1
        hints: ["It has the thickest wall."]
        solution: "The left ventricle pumps blood into the aorta."
        mistakes: {"Right ventricle": heart_sides}
      - prompt: "Which blood vessel carries blood from the heart to the lungs?"
        options: ["Pulmonary artery", "Pulmonary vein", "Aorta", "Vena cava"]
        answer: "Pulmonary artery"
        difficulty: 2
        hints: ["Away from the heart, so an artery."]
        solution: "The pulmonary artery carries deoxygenated blood to the lungs."
        mistakes: {"Pulmonary vein": arteries_veins}
      - prompt: "A heart beats 72 times a minute. How many times does it beat in one hour?"
        answer: "4320"
        check: "72*60"
        difficulty: 2
        hints: ["72 × 60."]
        solution: "72 × 60 = 4320 beats"
      - prompt: "Why is it called double circulation?"
        options: ["Blood passes through the heart twice in one full circuit", "There are two hearts", "Blood flows in both directions", "Each cell gets blood twice a day"]
        answer: "Blood passes through the heart twice in one full circuit"
        difficulty: 2
        hints: ["Body → heart → lungs → heart → body."]
        solution: "Once on the way to the lungs and again on the way to the body."
        mistakes: {"Blood flows in both directions": double_circulation}
      - prompt: "Why does the left ventricle have a thicker wall than the right ventricle?"
        options: ["It pumps blood to the whole body, which needs more force", "It holds more blood", "It receives blood from the lungs", "It pumps deoxygenated blood"]
        answer: "It pumps blood to the whole body, which needs more force"
        difficulty: 3
        hints: ["The lungs are close; the toes are far."]
        solution: "The body circuit is much longer than the lung circuit, so the left ventricle needs stronger muscle."
        mistakes: {"It pumps deoxygenated blood": heart_sides}
