        - More infections only
        - Higher body temperature
        answer: Tiredness, because less oxygen is carried
        difficulty: 3
        hints:
        - What do red cells carry?
        - What happens with fewer of them?
        solution: 'Step 1: Red cells carry oxygen. Step 2: Fewer red cells carry less oxygen. Step 3: Cells get less energy, so the person feels tired (anaemia).'
        mistakes:
          Blood that clots too fast: blood_cell_jobs

  - code: bio9.transport.heart
    title: The heart and circulation
    after: [bio9.transport.blood]
    notes: |
      The human heart has four chambers: two atria (receive blood) and two ventricles (pump blood).
      The right side receives deoxygenated blood from the body (vena cava) and pumps it to the lungs
      (pulmonary artery). The left side receives oxygenated blood from the lungs (pulmonary vein) and
      pumps it to the body (aorta). Valves prevent backflow. Blood passes through the heart twice in
      one circuit: double circulation. The left ventricle has the thickest wall.
    explanations:
      text: "The heart is two pumps side by side. The right pump sends used blood to the lungs to pick up oxygen. The left pump sends the fresh blood all round the body. The left ventricle has the thickest wall because it pushes blood the furthest. A normal heart beats about 72 times a minute at rest."
      visual: "Draw a box split into four rooms: top two are atria, bottom two ventricles. Colour the right side blue (deoxygenated) and the left side red (oxygenated). Arrows: body → right atrium → right ventricle → lungs → left atrium → left ventricle → body."
      step_by_step: "How many times does a heart beating 72 times a minute beat in an hour? Step 1: 60 minutes in an hour. Step 2: 72 × 60 = 4320 beats."
      real_world: "A doctor's stethoscope hears the 'lub-dub' of the heart valves closing. A blood-pressure reading like 120/80 measures pressure in the arteries."
    activity:
      type: order
      prompt: Follow the blood through the heart, starting from the body.
      steps:
      - Body (blood arrives by the vena cava)
      - Right atrium
      - Right ventricle
      - Lungs (by the pulmonary artery)
      - Left atrium
      - Left ventricle
      - Aorta, out to the body
      reasons:
        Right atrium: Blood from the body enters the heart at the right atrium.
        Right ventricle: The atrium pushes blood down into the ventricle below it.
        Lungs (by the pulmonary artery): The right ventricle pumps blood to the lungs to pick up oxygen.
        Left atrium: Blood comes back from the lungs into the left atrium.
        Left ventricle: The left atrium passes blood down to the left ventricle.
        Aorta, out to the body: The strong left ventricle pumps it out through the aorta.
    lesson:
      - teach: 'The heart is a muscular pump about the size of your fist. It has four chambers: two atria on top receive blood, and two ventricles below pump it out. Valves between them make sure blood flows only one way.'
        check:
          prompt: Which chambers pump blood out of the heart?
          options:
          - The ventricles
          - The atria
          - The valves
          answer: The ventricles
          why: Atria receive blood; ventricles pump it out.
      - teach: 'The right side handles oxygen-poor blood: it arrives from the body through the vena cava into the right atrium, then the right ventricle pumps it to the lungs. The left side handles oxygen-rich blood: it comes from the lungs into the left atrium, and the left ventricle pumps it through the aorta to the whole body.'
        picture:
          kind: flow
          steps:
          - Body → right atrium
          - Right ventricle → lungs
          - Lungs → left atrium
          - Left ventricle → aorta → body
          alt: Blood goes from the body to the right side, to the lungs, to the left side, and out to the body.
        check:
          prompt: Which side of the heart pumps blood to the lungs?
          options:
          - Right side
          - Left side
          - Both sides
          answer: Right side
          why: The right ventricle sends oxygen-poor blood to the lungs.
      - teach: 'In one full trip round the body, blood passes through the heart twice: once on the way to the lungs and once on the way to the body. This is double circulation. The left ventricle has the thickest wall because it must push blood all around the body.'
        check:
          prompt: How many times does blood pass through the heart in one full circuit?
          options:
          - Twice
          - Once
          - Four times
          answer: Twice
          why: 'Once for the lungs and once for the body: double circulation.'
    items:
      - prompt: "How many chambers does the human heart have?"
        answer: "4"
        check: "2 + 2"
        difficulty: 1
        hints: ["Two atria and two ventricles."]
        solution: "2 atria + 2 ventricles = 4 chambers."
        mistakes: {"2": heart_sides}
      - prompt: "Which chamber pumps oxygenated blood to the whole body?"
        options: ["Left ventricle", "Right ventricle", "Left atrium", "Right atrium"]
        answer: "Left ventricle"
        difficulty: 1
        hints: ["It has the thickest wall."]
        solution: "The left ventricle pumps blood into the aorta."
        mistakes: {"Right ventricle": heart_sides}
      - prompt: "Which blood vessel carries blood from the heart to the lungs?"
        options: ["Pulmonary artery", "Pulmonary vein", "Aorta", "Vena cava"]
        answer: "Pulmonary artery"
        difficulty: 2
        hints: ["Away from the heart, so an artery."]
        solution: "The pulmonary artery carries deoxygenated blood to the lungs."
        mistakes: {"Pulmonary vein": arteries_veins}
      - prompt: "A heart beats 72 times a minute. How many times does it beat in one hour?"
        answer: "4320"
        check: "72*60"
        difficulty: 2
        hints: ["72 × 60."]
        solution: "72 × 60 = 4320 beats"
        mistakes: {"132": "per_minute_to_hour", "432": "per_minute_to_hour"}
      - prompt: "Why is it called double circulation?"
        options: ["Blood passes through the heart twice in one full circuit", "There are two hearts", "Blood flows in both directions", "Each cell gets blood twice a day"]
        answer: "Blood passes through the heart twice in one full circuit"
        difficulty: 2
        hints: ["Body → heart → lungs → heart → body."]
        solution: "Once on the way to the lungs and again on the way to the body."
        mistakes: {"Blood flows in both directions": double_circulation}
      - prompt: "Why does the left ventricle have a thicker wall than the right ventricle?"
        options: ["It pumps blood to the whole body, which needs more force", "It holds more blood", "It receives blood from the lungs", "It pumps deoxygenated blood"]
        answer: "It pumps blood to the whole body, which needs more force"
        difficulty: 3
        hints: ["The lungs are close; the toes are far."]
        solution: "The body circuit is much longer than the lung circuit, so the left ventricle needs stronger muscle."
        mistakes: {"It pumps deoxygenated blood": heart_sides}
      - prompt: "Which is the path of blood from the right atrium to the aorta?"
        options: ["Right atrium → right ventricle → lungs → left atrium → left ventricle → aorta", "Right atrium → left atrium → left ventricle → aorta", "Right atrium → right ventricle → aorta", "Right atrium → right ventricle → left atrium → lungs → aorta"]
        answer: "Right atrium → right ventricle → lungs → left atrium → left ventricle → aorta"
        difficulty: 3
        hints: ["The right side sends blood to the lungs.", "Blood comes back from the lungs into the left side."]
        solution: "Step 1: Right atrium → right ventricle → pulmonary artery → lungs. Step 2: Pulmonary vein → left atrium → left ventricle → aorta."
        mistakes: {"Right atrium → left atrium → left ventricle → aorta": heart_sides, "Right atrium → right ventricle → aorta": double_circulation, "Right atrium → right ventricle → left atrium → lungs → aorta": heart_sides}
      - prompt: "A heart pumps 70 mL of blood with each beat and beats 72 times a minute. How many litres does it pump in a minute?"
        answer: "5.04"
        check: "70*72/1000"
        difficulty: 3
        hints: ["70 × 72 gives mL per minute.", "1 litre = 1000 mL."]
        solution: "Step 1: 70 × 72 = 5040 mL a minute. Step 2: 5040 ÷ 1000 = 5.04 litres."
        mistakes: {"5040": ml_to_litre, "302400": per_minute_to_hour, "142": ml_to_litre}
      - prompt: "A fish's heart has two chambers, and its blood passes through the heart once in each trip around the body. What is this called?"
        options: ["Single circulation", "Double circulation", "Open circulation", "Pulmonary circulation"]
        answer: "Single circulation"
        difficulty: 2
        hints: ["How many times does human blood pass the heart in one trip?", "The fish's blood passes only once."]
        solution: "Step 1: Humans have double circulation: twice through the heart. Step 2: Fish blood passes once: single circulation."
        mistakes: {"Double circulation": single_double, "Open circulation": single_double, "Pulmonary circulation": single_double}
      - prompt: Which blood vessel carries oxygenated blood from the heart to the body?
        options:
        - Aorta
        - Vena cava
        - Pulmonary artery
        - Pulmonary vein
        answer: Aorta
        difficulty: 1
        hints:
        - It leaves the left ventricle.
        - It is the biggest artery.
        solution: 'Step 1: Oxygenated blood leaves the left ventricle. Step 2: It goes out through the largest artery. Step 3: That is the aorta.'
        mistakes:
          Pulmonary vein: pulmonary_vessels
      - prompt: Which chamber receives deoxygenated blood from the body?
        options:
        - Right atrium
        - Left atrium
        - Left ventricle
        - Right ventricle
        answer: Right atrium
        difficulty: 1
        hints:
        - Atria receive blood.
        - Which side handles oxygen-poor blood?
        solution: 'Step 1: Atria receive, ventricles pump. Step 2: The right side handles oxygen-poor blood. Step 3: The right atrium receives it.'
        mistakes:
          Left atrium: heart_sides
      - prompt: A resting heart beats 75 times a minute. How many times does it beat in one hour?
        answer: '4500'
        check: 75*60
        difficulty: 2
        hints:
        - How many minutes are in an hour?
        - Multiply the beats per minute by that.
        solution: 'Step 1: 1 hour = 60 minutes. Step 2: 75 × 60. Step 3: = 4500 beats.'
        mistakes:
          '1.25': per_minute_to_hour
          '135': per_minute_to_hour
      - prompt: What do the valves in the heart do?
        options:
        - Stop blood flowing backwards
        - Add oxygen to blood
        - Make blood cells
        - Pump blood
        answer: Stop blood flowing backwards
        difficulty: 1
        hints:
        - They are flaps between chambers.
        - Blood must go only one way.
        solution: 'Step 1: Valves are flaps between chambers and vessels. Step 2: They open one way only. Step 3: They stop backflow.'
        mistakes:
          Pump blood: heart_sides
      - prompt: A heart pumps 80 mL of blood with each beat and beats 75 times a minute. How many litres does it pump in a minute?
        answer: '6'
        check: 80*75/1000
        difficulty: 3
        hints:
        - First find the millilitres per minute.
        - 1 litre = 1000 mL.
        solution: 'Step 1: 80 × 75 = 6000 mL. Step 2: 6000 ÷ 1000. Step 3: = 6 litres per minute.'
        mistakes:
          '6000': ml_to_litre
          '155': ml_to_litre
      - prompt: Why is double circulation useful for mammals and birds?
        options:
        - Oxygen-rich and oxygen-poor blood don't mix, so lots of oxygen reaches the body
        - It makes the heart smaller
        - Blood passes through the lungs twice
        - It keeps blood cold
        answer: Oxygen-rich and oxygen-poor blood don't mix, so lots of oxygen reaches the body
        difficulty: 3
        hints:
        - The two sides of the heart are kept separate.
        - Warm-blooded animals need a lot of energy.
        solution: 'Step 1: Each side keeps its own blood. Step 2: Oxygen-rich blood is not diluted. Step 3: Cells get plenty of oxygen for the energy mammals and birds need.'
        mistakes:
          Blood passes through the lungs twice: double_circulation
