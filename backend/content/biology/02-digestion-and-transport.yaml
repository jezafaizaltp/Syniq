# Class 9 Biology, chapter 2. Format: content/README.md.
subject: bio
chapter: 2
title: Digestion and Transport of Nutrients

tips:
  acid_for_pepsin: Protein digestion starts with an enzyme that works only in acid. The acid is made where that enzyme works, in the bag-shaped organ just after the food pipe.
  lipase_fat: Lip- comes from the Greek for fat. Look for the pancreatic enzyme that works on proteins instead.
  plant_pigment: Chlorophyll is the green pigment of plants. Blood's oxygen carrier is a red pigment that contains iron.
  big_molecules: "Only small, soluble molecules can pass through the intestine wall into the blood. Is starch a small molecule or a long chain?"
  enzyme_conditions: "Each enzyme works best in particular conditions. Think about why the stomach makes acid."
  thin_air: "What is different about the air high in the mountains, and which cells carry that gas?"
  pulmonary_vessels: "Vessels are named by direction: arteries leave the heart, veins return to it. Then ask where this vessel comes from."
  ml_to_litre: "Multiply to get millilitres per minute, then divide by 1000 for litres."
  single_double: "Count how many times blood passes through the heart in one full trip around the body."
  enzyme_food_match: "Enzyme names often hint at their food: amyl- is from the Greek for starch, lip- for fat, and protein enzymes include pepsin and trypsin. Proteins are chains of smaller building blocks: recall their name."
  digestion_order: "Trace a bite of food from where you chew it: the food pipe, then the stomach, then the long, narrow tube, then the wider tube. Saliva already has an enzyme for starch."
  absorption_small_intestine: "Absorption needs a huge surface: look for the part lined with millions of finger-like villi. The last, wider part mainly takes back water."
  bile_no_enzyme: "Bile has no enzymes. It breaks fat into small droplets (emulsification) so lipase can work faster."
  arteries_veins: "A for Away: one kind of vessel carries blood away from the heart under high pressure; the other brings it back at low pressure and needs valves. The lungs' vessel names follow the same rule."
  blood_cell_jobs: "Each blood part has one main job: one carries oxygen using haemoglobin, one fights germs, and the smallest bits help a cut seal. Which job fails when those small bits fall?"
  heart_sides: "The right side of the heart pumps deoxygenated blood to the lungs; the left side pumps oxygenated blood to the body."
  double_circulation: "In one full circuit, blood passes through the heart twice: once for the lungs and once for the body."
  capillary_thin: "Capillaries are thin so materials can pass through them. The thick-walled, high-pressure vessels are the arteries; the heart does the pumping."
  hcl_role: "Stomach acid kills germs and gives pepsin the acid it needs. It doesn't digest starch itself, and bile is made by the liver."
  per_minute_to_hour: "There are 60 minutes in an hour, so multiply the beats per minute by 60."
  percent_of: "To find 55% of 5 litres, multiply 5 by 0.55. Don't just move the decimal point."
  villi_surface: "Villi don't store food or push it along. Their folds give a huge surface for digested food to be absorbed."

concepts:
  - code: bio9.digestion.organs
    title: The digestive system
    notes: |
      Digestion breaks large, insoluble food molecules into small, soluble ones the body can absorb.
      The alimentary canal: mouth (chewing, saliva with salivary amylase) → oesophagus (peristalsis) →
      stomach (HCl, pepsin) → small intestine (bile from the liver, pancreatic juice, intestinal juice;
      digestion completed and absorption) → large intestine (water absorbed) → rectum and anus. The
      liver, gall bladder and pancreas are associated glands.
    explanations:
      text: "Food is a long journey through a tube about 9 metres long. Teeth and saliva start the work in the mouth, muscular waves push it down the food pipe, the stomach churns it with acid, the small intestine finishes digestion and absorbs nutrients, and the large intestine takes back water."
      visual: "Draw the tube from mouth to anus and label each stop: mouth, oesophagus, stomach, small intestine (long and coiled), large intestine. Put the liver above the stomach and the pancreas just below it."
      step_by_step: "Trace a bite of rice: Step 1: Mouth: chewed; amylase starts on starch. Step 2: Oesophagus: pushed down by peristalsis. Step 3: Stomach: churned with acid. Step 4: Small intestine: starch finished into glucose and absorbed. Step 5: Large intestine: water absorbed from what is left."
      real_world: "Chewing rice for a long time makes it taste sweet: amylase in saliva has started turning starch into sugar."
    activity:
      type: order
      prompt: Put the path of food in order.
      steps:
      - Mouth
      - Oesophagus
      - Stomach
      - Small intestine
      - Large intestine
      - Rectum
      - Anus
      reasons:
        Oesophagus: Food is chewed in the mouth before it is swallowed down the oesophagus.
        Stomach: The oesophagus carries food down to the stomach.
        Small intestine: The stomach churns food first, then passes it on.
        Large intestine: Food is absorbed in the small intestine before water is taken back in the large.
        Rectum: Waste is stored in the rectum after the large intestine.
        Anus: The anus is the way out, at the very end.
    lesson:
      - teach: 'A chapati is made of starch: long chains of sugar far too big to pass into the blood. Digestion breaks such big, insoluble food molecules into small, soluble ones that can be absorbed. It happens along a long tube, the alimentary canal, about 9 m long in an adult.'
        check:
          prompt: Why must food be digested?
          options:
          - Big food molecules can't pass into the blood
          - To make food tastier
          - To store it in the stomach
          answer: Big food molecules can't pass into the blood
          why: Only small, soluble molecules can be absorbed.
      - teach: 'Follow a bite of food. Mouth: teeth chew and saliva starts digesting starch. Oesophagus: waves of muscle (peristalsis) push it down. Stomach: acid and pepsin work on proteins. Small intestine: digestion finishes and food is absorbed. Large intestine: water is taken back. Then rectum and anus.'
        picture:
          kind: flow
          steps:
          - Mouth
          - Oesophagus
          - Stomach
          - Small intestine
          - Large intestine
          - Rectum and anus
          alt: The path of food through the alimentary canal.
        check:
          prompt: What comes right after the oesophagus?
          options:
          - Stomach
          - Small intestine
          - Mouth
          answer: Stomach
          why: The oesophagus carries food from the mouth to the stomach.
      - teach: 'The small intestine''s inner wall has millions of finger-like villi. They give a huge surface, so digested food is absorbed quickly into the blood. Glands outside the canal help too: the liver makes bile (stored in the gall bladder) and the pancreas makes pancreatic juice.'
        check:
          prompt: What do villi do?
          options:
          - Give a large surface for absorption
          - Push food along
          - Make bile
          answer: Give a large surface for absorption
          why: More surface means faster absorption of digested food.
    items:
      - prompt: "Where does the digestion of starch begin?"
        options: ["Mouth", "Stomach", "Small intestine", "Large intestine"]
        answer: "Mouth"
        difficulty: 1
        hints: ["Saliva contains an enzyme."]
        solution: "Salivary amylase starts breaking starch in the mouth."
        mistakes: {"Stomach": digestion_order}
      - prompt: "Where is most digested food absorbed into the blood?"
        options: ["Small intestine", "Stomach", "Large intestine", "Oesophagus"]
        answer: "Small intestine"
        difficulty: 1
        hints: ["It is long and has villi."]
        solution: "The small intestine has a huge surface of villi for absorption."
        mistakes: {"Large intestine": absorption_small_intestine, "Stomach": absorption_small_intestine}
      - prompt: "Which part comes immediately after the stomach?"
        options: ["Small intestine", "Large intestine", "Oesophagus", "Rectum"]
        answer: "Small intestine"
        difficulty: 1
        hints: ["Its first part is the duodenum."]
        solution: "From the stomach, food passes into the small intestine."
        mistakes: {"Large intestine": digestion_order, "Oesophagus": digestion_order}
      - prompt: "What is the main job of the large intestine?"
        options: ["Absorbing water", "Digesting proteins", "Producing bile", "Chewing food"]
        answer: "Absorbing water"
        difficulty: 2
        hints: ["What is left after nutrients are absorbed?"]
        solution: "The large intestine absorbs water from undigested remains."
        mistakes: {"Digesting proteins": absorption_small_intestine}
      - prompt: "The wave-like muscle movement that pushes food along the alimentary canal is called:"
        options: ["Peristalsis", "Emulsification", "Absorption", "Assimilation"]
        answer: "Peristalsis"
        difficulty: 2
        hints: ["It works even if you eat upside down."]
        solution: "Peristalsis is the rhythmic contraction of the gut muscles."
        mistakes: {"Emulsification": bile_no_enzyme}
      - prompt: "Why is the inner wall of the small intestine folded into millions of villi?"
        options: ["To increase the surface area for absorption", "To make the food move faster", "To store food", "To produce saliva"]
        answer: "To increase the surface area for absorption"
        difficulty: 3
        hints: ["More surface, more absorption."]
        solution: "Villi greatly increase the surface area, so nutrients are absorbed quickly."

        mistakes: {"To store food": "villi_surface", "To make the food move faster": "villi_surface"}
      - prompt: "A person has had their gall bladder removed. Digestion of which food is most likely to be affected?"
        options: ["Fats", "Starch", "Proteins", "Vitamins"]
        answer: "Fats"
        difficulty: 3
        hints: ["The gall bladder stores something made by the liver.", "What does bile act on?"]
        solution: "Step 1: The gall bladder stores bile and releases it after meals. Step 2: Bile breaks fats into droplets, so fat digestion suffers."
        mistakes: {"Starch": bile_no_enzyme, "Proteins": bile_no_enzyme, "Vitamins": bile_no_enzyme}
      - prompt: "Which is the correct order of parts that food passes through?"
        options: ["Mouth, oesophagus, stomach, small intestine, large intestine", "Mouth, stomach, oesophagus, small intestine, large intestine", "Mouth, oesophagus, stomach, large intestine, small intestine", "Mouth, oesophagus, small intestine, stomach, large intestine"]
        answer: "Mouth, oesophagus, stomach, small intestine, large intestine"
        difficulty: 2
        hints: ["The food pipe comes straight after the mouth.", "Water is absorbed near the end."]
        solution: "Step 1: Mouth → oesophagus → stomach. Step 2: Then the small intestine (digestion and absorption) and the large intestine (water)."
        mistakes: {"Mouth, stomach, oesophagus, small intestine, large intestine": digestion_order, "Mouth, oesophagus, stomach, large intestine, small intestine": digestion_order, "Mouth, oesophagus, small intestine, stomach, large intestine": digestion_order}
      - prompt: "Why must starch be digested before the body can absorb it?"
        options: ["Its molecules are too large and insoluble to pass into the blood", "It is poisonous until digested", "It is digested only to make it taste sweet", "Blood cannot carry any carbohydrate"]
        answer: "Its molecules are too large and insoluble to pass into the blood"
        difficulty: 2
        hints: ["What is absorbed through the villi?", "Starch is a long chain of glucose units."]
        solution: "Step 1: Starch molecules are huge and don't dissolve. Step 2: Only after being broken into glucose can they pass into the blood."
        mistakes: {"It is poisonous until digested": big_molecules, "It is digested only to make it taste sweet": big_molecules, "Blood cannot carry any carbohydrate": big_molecules}
      - prompt: Which organ makes bile?
        options:
        - Liver
        - Pancreas
        - Stomach
        - Gall bladder
        answer: Liver
        difficulty: 1
        hints:
        - Bile is stored in one organ but made in another.
        - Which large gland makes it?
        solution: 'Step 1: Bile is stored in the gall bladder. Step 2: It is made in the liver. Step 3: The liver makes bile.'
        mistakes:
          Gall bladder: bile_no_enzyme
      - prompt: In which part of the alimentary canal is food mixed with hydrochloric acid?
        options:
        - Stomach
        - Mouth
        - Small intestine
        - Large intestine
        answer: Stomach
        difficulty: 1
        hints:
        - The acid helps an enzyme that digests proteins.
        - Where does protein digestion begin?
        solution: 'Step 1: Protein digestion begins with pepsin. Step 2: Pepsin needs an acid. Step 3: Hydrochloric acid is made in the stomach.'
        mistakes:
          Small intestine: acid_for_pepsin
      - prompt: Food takes about 4 hours in the stomach and 3 hours in the small intestine. Which part does most of the absorption?
        options:
        - Small intestine
        - Stomach
        - Oesophagus
        - Mouth
        answer: Small intestine
        difficulty: 2
        hints:
        - Time spent is not what decides it.
        - Which part has villi?
        solution: 'Step 1: Absorption needs a large surface. Step 2: The small intestine has millions of villi. Step 3: It absorbs most digested food.'
        mistakes:
          Stomach: absorption_small_intestine
      - prompt: What is the role of the oesophagus?
        options:
        - To carry food from the mouth to the stomach
        - To digest proteins
        - To absorb water
        - To make bile
        answer: To carry food from the mouth to the stomach
        difficulty: 1
        hints:
        - It is the food pipe.
        - Where does it start and end?
        solution: 'Step 1: The oesophagus is the food pipe. Step 2: It joins the mouth to the stomach. Step 3: Peristalsis moves food along it.'
        mistakes:
          To absorb water: digestion_order
      - prompt: A person has diarrhoea and passes very watery stools. Which part of the canal is not doing its main job well?
        options:
        - Large intestine
        - Stomach
        - Oesophagus
        - Mouth
        answer: Large intestine
        difficulty: 3
        hints:
        - Watery stools mean water is not being taken back.
        - Which part mainly absorbs water?
        solution: 'Step 1: Normally water is taken back into the body. Step 2: That is the main job of the large intestine. Step 3: Watery stools show it is not absorbing enough.'
        mistakes:
          Stomach: absorption_small_intestine
      - prompt: Why does a person with fewer villi (as in some gut diseases) lose weight even when eating well?
        options:
        - Less surface means less food is absorbed
        - Villi make bile
        - Villi digest starch
        - Villi push food too fast
        answer: Less surface means less food is absorbed
        difficulty: 3
        hints:
        - What do villi provide?
        - What happens to absorption if that is reduced?
        solution: 'Step 1: Villi give a huge surface. Step 2: Fewer villi mean less surface. Step 3: Less food is absorbed, so the body gets less nourishment.'
        mistakes:
          Villi digest starch: villi_surface
  - code: bio9.digestion.enzymes
    title: Digestive juices and enzymes
    after: [bio9.digestion.organs]
    notes: |
      Enzymes are biological catalysts. Salivary amylase: starch → maltose. Stomach: HCl kills germs
      and makes the medium acidic; pepsin: proteins → peptides. Liver: bile (no enzymes) emulsifies
      fats. Pancreas: pancreatic amylase, trypsin (proteins → peptides), lipase (fats → fatty acids +
      glycerol). Intestinal juice completes digestion: carbohydrates → glucose, proteins → amino acids.
    explanations:
      text: "Each enzyme is a key for one kind of lock. Amylase only cuts starch. Pepsin and trypsin cut proteins. Lipase cuts fats. By the end of the small intestine, starch has become glucose, proteins amino acids, and fats fatty acids and glycerol: all small enough to absorb."
      visual: "Make a three-row table: starch → glucose (amylase), protein → amino acids (pepsin, trypsin), fat → fatty acids + glycerol (lipase, helped by bile)."
      step_by_step: "How is a fried egg digested? Step 1: Its protein is cut by pepsin in the stomach. Step 2: Bile breaks the oil into tiny droplets. Step 3: Lipase and trypsin from the pancreas finish fat and protein. Step 4: Intestinal juice gives amino acids, fatty acids and glycerol."
      real_world: "People whose gall bladder is removed are told to eat less fatty food: without stored bile, fats are emulsified less well."
    activity:
      type: sort
      prompt: What does each enzyme digest?
      bins:
      - Starch
      - Protein
      - Fat
      items:
      - label: Salivary amylase
        bin: Starch
        clue: Chew plain rice for a long time and it starts to taste sweet. What is saliva breaking down?
        why: Amylase digests starch.
      - label: Pepsin
        bin: Protein
        clue: It works in the acid of the stomach. What is digested there first?
        why: Pepsin digests protein.
      - label: Lipase
        bin: Fat
        clue: Lipids are fats. What does lip-ase digest?
        why: Lipase digests fat.
      - label: Trypsin
        bin: Protein
        clue: It comes from the pancreas and carries on pepsin's job.
        why: Trypsin digests protein.
      - label: Pancreatic amylase
        bin: Starch
        clue: 'Amylase again: what does it digest?'
        why: Amylase digests starch, wherever it comes from.
    lesson:
      - teach: 'Digestion is done by enzymes: proteins that act as biological catalysts. Each enzyme works on one kind of food. Amylase breaks starch into sugar. Protein enzymes (pepsin, trypsin) break proteins into smaller pieces. Lipase breaks fats into fatty acids and glycerol.'
        picture:
          kind: compare
          columns:
          - title: Carbohydrates
            points:
            - amylase
            - starch → maltose → glucose
          - title: Proteins
            points:
            - pepsin, trypsin
            - proteins → peptides → amino acids
          - title: Fats
            points:
            - lipase (with bile)
            - fats → fatty acids + glycerol
          alt: 'Enzymes match their food: amylase for starch, pepsin and trypsin for proteins, lipase for fats.'
        check:
          prompt: Which enzyme breaks down proteins in the stomach?
          options:
          - Pepsin
          - Amylase
          - Lipase
          answer: Pepsin
          why: Pepsin starts protein digestion in the stomach.
      - teach: Enzymes need the right conditions. Salivary amylase works in the near-neutral mouth. Pepsin needs acid, which is why the stomach makes hydrochloric acid; the acid also kills germs. In the small intestine the juices are alkaline, which suits trypsin and lipase.
        check:
          prompt: Why does the stomach make hydrochloric acid?
          options:
          - Pepsin needs acid, and it kills germs
          - It digests fat
          - It makes bile
          answer: Pepsin needs acid, and it kills germs
          why: The acid gives pepsin its working conditions and protects us from germs.
      - teach: 'Bile has no enzymes. It breaks large fat drops into tiny droplets (emulsification), giving lipase much more surface to work on. Finally, intestinal juice completes digestion: carbohydrates to glucose, proteins to amino acids.'
        check:
          prompt: What does bile do to fats?
          options:
          - Breaks them into tiny droplets
          - Digests them into glycerol
          - Turns them into starch
          answer: Breaks them into tiny droplets
          why: Bile emulsifies fats; lipase then digests them.
    items:
      - prompt: "Which enzyme digests starch?"
        options: ["Amylase", "Pepsin", "Lipase", "Trypsin"]
        answer: "Amylase"
        difficulty: 1
        hints: ["In saliva."]
        solution: "Amylase breaks starch into maltose."
        mistakes: {"Pepsin": enzyme_food_match, "Lipase": enzyme_food_match}
      - prompt: "Which enzyme digests fats?"
        options: ["Lipase", "Amylase", "Pepsin", "Maltase"]
        answer: "Lipase"
        difficulty: 1
        hints: ["Lipids are fats."]
        solution: "Lipase breaks fats into fatty acids and glycerol."
        mistakes: {"Pepsin": enzyme_food_match}
      - prompt: "What does bile do?"
        options: ["Breaks fats into small droplets", "Digests proteins", "Digests starch", "Kills germs with acid"]
        answer: "Breaks fats into small droplets"
        difficulty: 2
        hints: ["Bile has no enzymes."]
        solution: "Bile emulsifies fats, giving lipase a larger surface to act on."
        mistakes: {"Digests proteins": bile_no_enzyme}
      - prompt: "Proteins are finally digested into:"
        options: ["Amino acids", "Glucose", "Fatty acids", "Glycerol"]
        answer: "Amino acids"
        difficulty: 2
        hints: ["The building blocks of proteins."]
        solution: "Proteins are broken down into amino acids."
        mistakes: {"Glucose": enzyme_food_match}
      - prompt: "Why does the stomach produce hydrochloric acid?"
        options: ["To kill germs and give the acidic medium pepsin needs", "To digest starch", "To absorb water", "To make bile"]
        answer: "To kill germs and give the acidic medium pepsin needs"
        difficulty: 2
        hints: ["Pepsin works only in acid."]
        solution: "HCl kills microbes in food and gives pepsin the acidic medium it works in."
        mistakes: {"To digest starch": "hcl_role", "To make bile": "hcl_role"}
      - prompt: "Which organ produces trypsin, lipase and amylase together?"
        options: ["Pancreas", "Liver", "Stomach", "Salivary gland"]
        answer: "Pancreas"
        difficulty: 3
        hints: ["Its juice enters the small intestine."]
        solution: "Pancreatic juice contains all three."
        mistakes: {"Liver": bile_no_enzyme}
      - prompt: "A piece of plain bread chewed for a long time begins to taste sweet. Why?"
        options: ["Salivary amylase turns starch into sugar", "Saliva contains sugar", "Teeth release sugar", "Stomach acid has already reached the mouth"]
        answer: "Salivary amylase turns starch into sugar"
        difficulty: 2
        hints: ["Bread is mostly starch.", "Which enzyme is in saliva?"]
        solution: "Step 1: Saliva has amylase. Step 2: It breaks starch into maltose, which tastes sweet."
        mistakes: {"Saliva contains sugar": enzyme_food_match, "Teeth release sugar": enzyme_food_match, "Stomach acid has already reached the mouth": hcl_role}
      - prompt: "Pepsin works in the stomach. How would it work in the small intestine, where the juices are alkaline?"
        options: ["It would hardly work", "It would work faster", "It would start digesting starch", "It would turn into trypsin"]
        answer: "It would hardly work"
        difficulty: 3
        hints: ["Why does the stomach make hydrochloric acid?", "Enzymes need the right conditions."]
        solution: "Step 1: Pepsin needs an acidic medium. Step 2: In alkaline conditions it hardly works; trypsin digests proteins there instead."
        mistakes: {"It would work faster": enzyme_conditions, "It would start digesting starch": enzyme_food_match, "It would turn into trypsin": enzyme_conditions}
      - prompt: "Fats are finally digested into:"
        options: ["Fatty acids and glycerol", "Amino acids", "Glucose", "Maltose"]
        answer: "Fatty acids and glycerol"
        difficulty: 2
        hints: ["Which enzyme digests fat?", "Amino acids come from proteins, glucose from carbohydrates."]
        solution: "Step 1: Lipase acts on fats. Step 2: It breaks them into fatty acids and glycerol."
        mistakes: {"Amino acids": enzyme_food_match, "Glucose": enzyme_food_match, "Maltose": enzyme_food_match}
      - prompt: Starch is first broken down into which sugar?
        options:
        - Maltose
        - Glucose
        - Sucrose
        - Amino acids
        answer: Maltose
        difficulty: 2
        hints:
        - Amylase works on starch first.
        - The final sugar comes later; what comes before it?
        solution: 'Step 1: Amylase acts on starch. Step 2: It produces maltose. Step 3: Later, maltose becomes glucose.'
        mistakes:
          Amino acids: enzyme_food_match
      - prompt: Which enzyme in pancreatic juice digests proteins?
        options:
        - Trypsin
        - Lipase
        - Amylase
        - Pepsin
        answer: Trypsin
        difficulty: 2
        hints:
        - Pepsin is in the stomach, not the pancreas.
        - Which pancreatic enzyme works on proteins?
        solution: 'Step 1: Pancreatic juice has amylase, trypsin and lipase. Step 2: Amylase is for starch, lipase for fat. Step 3: Trypsin digests proteins.'
        mistakes:
          Lipase: lipase_fat
          Pepsin: enzyme_conditions
      - prompt: What are enzymes?
        options:
        - Biological catalysts
        - Types of food
        - Vitamins
        - Waste products
        answer: Biological catalysts
        difficulty: 1
        hints:
        - They speed up reactions in the body.
        - They are not used up.
        solution: 'Step 1: Enzymes speed up digestion reactions. Step 2: They are not used up. Step 3: They are biological catalysts.'
        mistakes:
          Vitamins: enzyme_food_match
      - prompt: Does bile contain any digestive enzyme?
        options:
        - No, it only breaks fat into droplets
        - Yes, lipase
        - Yes, amylase
        - Yes, pepsin
        answer: No, it only breaks fat into droplets
        difficulty: 2
        hints:
        - Bile helps fat digestion, but how?
        - Does it break chemical bonds, or just make drops smaller?
        solution: 'Step 1: Bile emulsifies fat. Step 2: That is a physical change, making small droplets. Step 3: Bile has no enzymes; lipase comes from the pancreas.'
        mistakes:
          Yes, lipase: bile_no_enzyme
      - prompt: Salivary amylase is added to a starch solution with a few drops of strong acid. What happens to the starch?
        options:
        - It is hardly digested
        - It is digested faster
        - It turns into protein
        - It turns into fat
        answer: It is hardly digested
        difficulty: 3
        hints:
        - Salivary amylase works in the mouth.
        - Is the mouth acidic or nearly neutral?
        solution: 'Step 1: Salivary amylase works best near neutral. Step 2: Strong acid stops it working. Step 3: The starch is hardly digested.'
        mistakes:
          It is digested faster: enzyme_conditions
      - prompt: 'The final products of carbohydrate digestion are absorbed as:'
        options:
        - Glucose
        - Starch
        - Fatty acids
        - Peptides
        answer: Glucose
        difficulty: 1
        hints:
        - Only small sugars can be absorbed.
        - What is starch made of?
        solution: 'Step 1: Starch is a chain of glucose. Step 2: Digestion breaks it all the way down. Step 3: Glucose is absorbed.'
        mistakes:
          Starch: big_molecules

  - code: bio9.transport.blood
    title: Blood and blood vessels
    after: [bio9.digestion.organs]
    notes: |
      Blood is a fluid connective tissue: plasma (about 55%: water with dissolved food, salts,
      hormones, wastes, CO₂) and cells: red blood cells (haemoglobin, carry O₂), white blood cells
      (defence), platelets (clotting). Arteries carry blood away from the heart (thick elastic walls,
      high pressure); veins carry blood to the heart (thinner walls, valves); capillaries are one
      cell thick where exchange happens. Lymph carries absorbed fats and returns tissue fluid.
    explanations:
      text: "Blood is the body's delivery service. Plasma carries dissolved food, salts and wastes. Red cells, packed with haemoglobin, carry oxygen. White cells are the security guards. Platelets patch leaks. Arteries are the highways out from the heart, veins the roads back, and capillaries the tiny lanes that reach every cell."
      visual: "Draw a loop: heart → thick artery → branching capillaries around cells → joining into a vein with little valve flaps → back to the heart."
      step_by_step: "Why do veins have valves? Step 1: Blood in veins is at low pressure. Step 2: In the legs it must flow upward against gravity. Step 3: Valves stop it flowing backwards."
      real_world: "A blood test counts red cells, white cells and platelets. A low platelet count, as in dengue fever, means blood clots poorly."
    activity:
      type: sort
      prompt: Artery, vein or capillary?
      bins:
      - Artery
      - Vein
      - Capillary
      items:
      - label: Carries blood away from the heart
        bin: Artery
        clue: 'A for Away: which vessel?'
        why: Arteries carry blood away from the heart.
      - label: Has thick, elastic walls
        bin: Artery
        clue: Which vessel takes the strong push of each heartbeat?
        why: Arteries need thick walls for the high pressure.
      - label: Carries blood back to the heart
        bin: Vein
        clue: Which vessel brings blood home?
        why: Veins carry blood back to the heart.
      - label: Has valves to stop blood flowing back
        bin: Vein
        clue: Which vessel has low pressure and needs help to keep blood going one way?
        why: Veins have valves.
      - label: Wall is one cell thick
        bin: Capillary
        clue: Which vessel is so thin things can pass through it?
        why: Capillaries are one cell thick.
      - label: Where materials pass to the cells
        bin: Capillary
        clue: Where can food and oxygen get out of the blood?
        why: Through the thin capillary walls.
    lesson:
      - teach: 'Blood is a liquid tissue. About 55% is plasma: water carrying dissolved food, salts, hormones, wastes and carbon dioxide. The rest is cells: red blood cells carry oxygen using haemoglobin, white blood cells fight germs, and platelets help blood clot at a cut.'
        picture:
          kind: compare
          columns:
          - title: Red blood cells
            points:
            - haemoglobin
            - carry oxygen
          - title: White blood cells
            points:
            - fight germs
          - title: Platelets
            points:
            - help blood clot
          alt: The jobs of red cells, white cells and platelets.
        check:
          prompt: Which part of blood helps a cut stop bleeding?
          options:
          - Platelets
          - Red blood cells
          - Plasma
          answer: Platelets
          why: Platelets start clotting at a wound.
      - teach: Blood flows in three kinds of vessels. Arteries carry blood Away from the heart; they have thick, elastic walls for the high pressure. Veins bring blood back; they have thinner walls and valves to stop backflow. Capillaries, one cell thick, link them and let materials pass to and from cells.
        check:
          prompt: Which vessels have walls just one cell thick?
          options:
          - Capillaries
          - Arteries
          - Veins
          answer: Capillaries
          why: Thin walls let food, oxygen and wastes pass through.
      - teach: 'Usually arteries carry oxygen-rich blood and veins carry oxygen-poor blood. The lung vessels are the exception: the pulmonary artery carries oxygen-poor blood to the lungs, and the pulmonary vein brings oxygen-rich blood back. The names follow direction, not oxygen.'
        check:
          prompt: Which artery carries deoxygenated blood?
          options:
          - Pulmonary artery
          - Aorta
          - None
          answer: Pulmonary artery
          why: It carries blood from the heart to the lungs to pick up oxygen.
    items:
      - prompt: "Which blood cells carry oxygen?"
        options: ["Red blood cells", "White blood cells", "Platelets", "Plasma cells"]
        answer: "Red blood cells"
