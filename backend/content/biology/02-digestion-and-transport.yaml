        hints: ["A for Away."]
        solution: "Arteries carry blood away from the heart."
        mistakes: {"Veins": arteries_veins}
      - prompt: "In dengue fever, the platelet count falls. Which job of blood is affected?"
        options: ["Clotting", "Carrying oxygen", "Fighting germs", "Carrying digested food"]
        answer: "Clotting"
        difficulty: 2
        hints: ["Platelets patch leaks."]
        solution: "Platelets help blood clot, so low platelets can cause bleeding."
        mistakes: {"Carrying oxygen": blood_cell_jobs, "Fighting germs": blood_cell_jobs}
      - prompt: "Why are capillary walls only one cell thick?"
        options: ["So materials can pass easily between blood and cells", "To carry blood at high pressure", "To store blood", "To pump blood"]
        answer: "So materials can pass easily between blood and cells"
        difficulty: 2
        hints: ["Exchange happens here."]
        solution: "Thin walls let oxygen, food and wastes diffuse through quickly."
        mistakes: {"To carry blood at high pressure": "capillary_thin", "To pump blood": "capillary_thin"}
      - prompt: "Plasma is about 55% of blood. In 5 litres of blood, about how many litres are plasma?"
        answer: "2.75"
        check: "Rational(55, 100)*5"
        difficulty: 2
        hints: ["55% of 5."]
        solution: "0.55 × 5 = 2.75 litres"
        mistakes: {"0.55": "percent_of", "27.5": "percent_of"}
      - prompt: "Which vessels have valves to stop blood flowing backwards?"
        options: ["Veins", "Arteries", "Capillaries", "All vessels equally"]
        answer: "Veins"
        difficulty: 3
        hints: ["Blood pressure is low in them."]
        solution: "Veins carry low-pressure blood back to the heart and need valves."
        mistakes: {"Arteries": arteries_veins}
      - prompt: "A blood sample has about 5,000,000 red cells and 8,000 white cells in each mm³. About how many times as many red cells as white cells is that?"
        answer: "625"
        check: "5000000/8000"
        difficulty: 2
        hints: ["'How many times as many' means divide.", "5,000,000 ÷ 8,000."]
        solution: "Step 1: 5,000,000 ÷ 8,000 = 625. Step 2: About 625 red cells for every white cell."
        mistakes: {"4992000": ratio_subtracted, "0.0016": ratio_subtracted}
      - prompt: "People who live high in the mountains usually have more red blood cells than people at sea level. Why?"
        options: ["The air has less oxygen, so more cells are needed to carry enough", "Cold air makes the body make more blood", "There are more germs in the mountains", "Their blood needs to clot faster"]
        answer: "The air has less oxygen, so more cells are needed to carry enough"
        difficulty: 3
        hints: ["What do red cells carry?", "How is mountain air different?"]
        solution: "Step 1: High up, each breath holds less oxygen. Step 2: More red cells (more haemoglobin) let the blood carry enough oxygen."
        mistakes: {"Cold air makes the body make more blood": thin_air, "There are more germs in the mountains": blood_cell_jobs, "Their blood needs to clot faster": blood_cell_jobs}
      - prompt: "Why is the pulmonary vein unusual among veins?"
        options: ["It carries oxygenated blood", "It carries blood away from the heart", "It has very thick walls", "It carries blood to the lungs"]
        answer: "It carries oxygenated blood"
        difficulty: 3
        hints: ["Where does the pulmonary vein bring blood from?", "Blood leaving the lungs has just picked up oxygen."]
        solution: "Step 1: It brings blood from the lungs back to the heart, so it is a vein. Step 2: That blood has just been oxygenated, unlike the blood in other veins."
        mistakes: {"It carries blood away from the heart": pulmonary_vessels, "It has very thick walls": arteries_veins, "It carries blood to the lungs": pulmonary_vessels}
      - prompt: Which blood cells fight germs?
        options:
        - White blood cells
        - Red blood cells
        - Platelets
        - Plasma
        answer: White blood cells
        difficulty: 1
        hints:
        - Each part of blood has one main job.
        - Which cells defend the body?
        solution: 'Step 1: Red cells carry oxygen. Step 2: Platelets help clotting. Step 3: White blood cells fight germs.'
        mistakes:
          Platelets: blood_cell_jobs
      - prompt: Which pigment in red blood cells carries oxygen?
        options:
        - Haemoglobin
        - Chlorophyll
        - Melanin
        - Bile
        answer: Haemoglobin
        difficulty: 1
        hints:
        - It contains iron and makes blood red.
        - Chlorophyll is in plants.
        solution: 'Step 1: Red cells carry oxygen. Step 2: They use a red, iron-containing pigment. Step 3: It is haemoglobin.'
        mistakes:
          Chlorophyll: plant_pigment
      - prompt: Which vessels carry blood back to the heart at low pressure?
        options:
        - Veins
        - Arteries
        - Capillaries
        - Lymph vessels only
        answer: Veins
        difficulty: 1
        hints:
        - Arteries carry blood away from the heart.
        - Which vessels bring it back?
        solution: 'Step 1: Arteries take blood away at high pressure. Step 2: Veins bring it back at low pressure. Step 3: Veins have valves to stop backflow.'
        mistakes:
          Arteries: arteries_veins
      - prompt: A person has 6 litres of blood, and 55% of it is plasma. How many litres of plasma is that?
        answer: '3.3'
        check: 6*0.55
        difficulty: 2
        hints:
        - Find 55% of 6.
        - Multiply 6 by 0.55.
        solution: 'Step 1: 55% = 0.55. Step 2: 6 × 0.55. Step 3: = 3.3 litres.'
        mistakes:
          '0.33': percent_of
          '2.7': percent_of
      - prompt: Why do arteries have thick, elastic walls?
        options:
        - They carry blood at high pressure from the heart
        - They carry blood back to the heart
        - Materials must pass through them
        - They store blood
        answer: They carry blood at high pressure from the heart
        difficulty: 2
        hints:
        - Think about where arteries start.
        - What is blood pressure like right after the heart pumps?
        solution: 'Step 1: Arteries leave the heart. Step 2: Blood leaves the heart at high pressure. Step 3: Thick, elastic walls withstand it.'
        mistakes:
          Materials must pass through them: capillary_thin
      - prompt: A person's blood has 3,000,000 red cells per mm³, while 4,500,000 is normal. Which problem is most likely?
        options:
