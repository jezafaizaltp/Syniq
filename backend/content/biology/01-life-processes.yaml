# Class 9 Biology, chapter 1. Format: content/README.md.
subject: bio
chapter: 1
title: Life Processes

tips:
  parasite_host: "Does it feed on living or on dead organisms? Feeding on a living host has its own name."
  wastes_from_cells: "Undigested food never entered the body's cells. Removing wastes made by the cells' own chemistry has a different name."
  poor_soil: "These plants are green, so they make their own sugar. What might the boggy soil they grow in be short of?"
  co2_needed: "Potassium hydroxide takes one of the raw materials of photosynthesis out of the air in the jar."
  net_gas: "The plant respires all the time, using up some of the oxygen it makes. Only the extra leaves the leaf."
  floating_leaf: "Where can air reach a leaf that lies flat on a pond?"
  life_process_list: "A life process is something a living body must keep doing to stay alive, like taking in food or getting rid of what it doesn't need. Burning wood happens to non-living things too."
  autotroph_makes_food: "'Auto' means self and 'hetero' means other: the name tells you who makes the food. Organisms that feed on dead, rotting matter have their own name, from the Greek for rotten."
  photosynthesis_inputs: "Write the word equation: carbon dioxide + water, with light, gives glucose + a gas. One gas goes in, the other comes out. Which one do we breathe in?"
  oxygen_from_water: "Experiments with marked oxygen atoms showed where the released gas comes from: the molecule that is split using light energy, not the one that ends up in glucose."
  stomata_role: "Gases and water vapour pass through tiny pores in the leaf, each between two bean-shaped cells. When those cells fill with water they bend apart; on a hot day the plant wants to save water."
  chlorophyll_light: "Photosynthesis needs light and the green pigment, which sits in a special green organelle. With no light there is no new starch, and at night only respiration goes on."
  count_atoms: "Count the atoms on each side: the numbers in front multiply every atom in the formula."
  energy_always_needed: "Cells keep working while you sleep: the heart beats, you breathe and cells are repaired. All of that needs energy."
  ratio_subtracted: "'How many times as many' means divide one by the other, not subtract."
  starch_test_iodine: "Iodine turns blue-black with starch. Alcohol only removes the green colour first; lime water tests for carbon dioxide; litmus tests for acids and bases."
  stomata_lower: "Leaves lose water through their pores. Which side of a leaf is shaded and cooler, so that open pores there lose less water?"
  transport_distance: "A big body's inner cells are far from the surface. Diffusion is too slow over that distance, so blood has to carry materials there."

concepts:
  - code: bio9.life.processes
    title: What life processes are
    notes: |
      Life processes are the basic activities that maintain life: nutrition (getting food), respiration
      (releasing energy from food), transport (moving materials in the body), excretion (removing
      wastes), plus growth, movement, response and reproduction. Organisms need energy all the time,
      even at rest, to repair and maintain their bodies. Single-celled organisms do these through
      their surface; large organisms need special organ systems.
    explanations:
      text: "Even when you sleep, your body is busy: your heart pumps, you breathe, your cells repair themselves. This needs energy from food. Getting food (nutrition), releasing its energy (respiration), carrying things around (transport) and removing waste (excretion) are the life processes that keep you alive."
      visual: "Draw a circle labelled 'Body' with four arrows: food in (nutrition), oxygen in and carbon dioxide out (respiration), a loop inside (transport), and wastes out (excretion)."
      step_by_step: "Why does an amoeba not need lungs? Step 1: It is a single cell. Step 2: Every part of it touches the water outside. Step 3: Gases and food pass straight through its surface. Step 4: A large animal's inner cells are far from the surface, so it needs lungs, blood and a heart."
      real_world: "Doctors check life processes first in an emergency: is the person breathing, does the heart beat, is blood flowing?"
    activity:
      type: sort
      prompt: Which life process is it?
      bins:
      - Nutrition
      - Respiration
      - Excretion
      items:
      - label: Eating rice
        bin: Nutrition
        clue: Is it taking food in, getting energy out of food, or removing waste?
        why: 'Taking in food: nutrition.'
      - label: Leaves making food in sunlight
        bin: Nutrition
        clue: Is the plant taking in or making food?
        why: Making its own food is nutrition (photosynthesis).
      - label: Cells releasing energy from glucose
        bin: Respiration
        clue: Is this about getting energy out of food?
        why: Releasing energy from glucose is respiration.
      - label: Breathing in oxygen for the cells
        bin: Respiration
        clue: What do cells use oxygen for?
        why: 'Oxygen is used to release energy: respiration.'
      - label: Passing urine
        bin: Excretion
        clue: Is it taking something in, or removing waste?
        why: 'Removing waste made by the body: excretion.'
      - label: Sweating out salts
        bin: Excretion
        clue: Is something being removed from the body?
        why: 'Removing waste salts: excretion.'
    items:
      - prompt: "Which of these is a life process?"
        options: ["Respiration", "Burning of wood", "Rusting of iron", "Melting of ice"]
        answer: "Respiration"
        difficulty: 1
        hints: ["Which one happens only in living things?"]
        solution: "Respiration releases energy from food inside living cells. The others happen in non-living things."
        mistakes: {"Burning of wood": life_process_list}
      - prompt: "The process of removing waste products from the body is called:"
        options: ["Excretion", "Nutrition", "Respiration", "Transport"]
        answer: "Excretion"
        difficulty: 1
        hints: ["Kidneys and skin help with it."]
        solution: "Excretion removes metabolic wastes such as urea and carbon dioxide."
        mistakes: {"Nutrition": life_process_list}
      - prompt: "Why do organisms need energy even while they are asleep?"
        options: ["To maintain and repair their bodies", "To grow taller only at night", "They don't need energy while asleep", "To digest sleep"]
        answer: "To maintain and repair their bodies"
        difficulty: 2
        hints: ["The heart beats and cells keep working."]
        solution: "Breathing, heartbeat and repair of cells all go on during sleep and need energy."
        mistakes: {"They don't need energy while asleep": "energy_always_needed"}
      - prompt: "Why does a large animal need a transport system, but an amoeba does not?"
        options: ["Its inner cells are far from the surface", "It eats more food", "It lives on land", "It has no cells"]
        answer: "Its inner cells are far from the surface"
        difficulty: 2
        hints: ["How does each cell get oxygen?"]
        solution: "Diffusion through the surface is too slow to reach cells deep inside a large body, so blood carries materials to them."
        mistakes: {"It eats more food": "transport_distance", "It lives on land": "transport_distance"}
      - prompt: "Organisms that make their own food are called:"
        options: ["Autotrophs", "Heterotrophs", "Parasites", "Saprophytes"]
        answer: "Autotrophs"
        difficulty: 1
        hints: ["Auto means self."]
        solution: "Autotrophs (green plants) make their own food by photosynthesis."
        mistakes: {"Heterotrophs": autotroph_makes_food}
      - prompt: "Mushrooms feed on dead and decaying matter. What kind of nutrition is this?"
        options: ["Saprophytic", "Autotrophic", "Parasitic", "Holozoic"]
        answer: "Saprophytic"
        difficulty: 3
        hints: ["Sapro means rotten."]
        solution: "Saprophytes, like mushrooms, absorb food from dead and decaying matter."
        mistakes: {"Autotrophic": autotroph_makes_food}
      - prompt: "Cuscuta (dodder) is a yellow plant that winds around other plants and takes its food from them. What kind of nutrition does it have?"
        options: ["Parasitic", "Saprophytic", "Autotrophic", "Insectivorous"]
        answer: "Parasitic"
        difficulty: 3
        hints: ["It has no green colour, so it cannot make its own food.", "It feeds on a living plant, not on dead matter."]
        solution: "Step 1: Cuscuta can't photosynthesise. Step 2: It takes food from a living host plant, so it is a parasite."
        mistakes: {"Saprophytic": parasite_host, "Autotrophic": autotroph_makes_food, "Insectivorous": parasite_host}
      - prompt: "Which name is given to removing the wastes made by the chemical reactions in the body's cells?"
        options: ["Excretion", "Egestion", "Digestion", "Respiration"]
        answer: "Excretion"
        difficulty: 3
        hints: ["Getting rid of undigested food is not the same thing.", "Urea and carbon dioxide are made inside the body."]
        solution: "Step 1: Removing undigested food is egestion. Step 2: Removing metabolic wastes such as urea and CO₂ is excretion."
        mistakes: {"Egestion": wastes_from_cells, "Digestion": life_process_list, "Respiration": life_process_list}
      - prompt: "The pitcher plant is green and makes its own food, yet it also traps and digests insects. Why?"
        options: ["To get nitrogen that is scarce in the soil where it grows", "Because it cannot photosynthesise", "To get water", "To get oxygen"]
        answer: "To get nitrogen that is scarce in the soil where it grows"
        difficulty: 3
        hints: ["It already makes sugar by photosynthesis.", "Insects are rich in proteins. Which element do proteins contain that sugar does not?"]
        solution: "Step 1: The plant makes carbohydrates itself. Step 2: It grows in poor, boggy soil short of nitrogen, so it gets nitrogen from insect proteins."
        mistakes: {"Because it cannot photosynthesise": poor_soil, "To get water": poor_soil, "To get oxygen": poor_soil}

  - code: bio9.life.photosynthesis
    title: Photosynthesis
    after: [bio9.life.processes]
    notes: |
      Photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, in the presence of sunlight and chlorophyll. It
      happens in chloroplasts, mostly in leaf cells. Steps: light energy is absorbed by chlorophyll;
      water is split into hydrogen and oxygen (oxygen released); carbon dioxide is reduced to glucose.
      Glucose is stored as starch. CO₂ enters through stomata; water comes from the roots through
      xylem. The starch test uses iodine (blue-black).
    explanations:
      text: "A leaf is a food factory. Sunlight is the power, chlorophyll the machine, and carbon dioxide and water the raw materials. The product is glucose, and oxygen is given off as a by-product. Every breath we take depends on this oxygen."
      visual: "Draw a leaf with arrows: sunlight in from above, CO₂ in through tiny pores underneath, water up from the stem, oxygen out through the pores, and glucose moving to the rest of the plant."
      step_by_step: "Show a leaf made starch: Step 1: Boil it in water to kill it. Step 2: Boil it in alcohol to remove chlorophyll. Step 3: Rinse and add iodine. Step 4: It turns blue-black: starch is present."
      real_world: "Farmers in greenhouses sometimes add extra carbon dioxide to the air to make plants photosynthesise and grow faster."
    activity:
      type: order
      prompt: Put the stages of photosynthesis in a leaf in order.
      steps:
      - Chlorophyll traps sunlight
      - Light energy splits water
      - Oxygen is given out
      - Carbon dioxide is turned into glucose
      - Extra glucose is stored as starch
      reasons:
        Light energy splits water: Splitting water needs the light energy that chlorophyll traps first.
        Oxygen is given out: The oxygen comes from the split water, so water must be split first.
        Carbon dioxide is turned into glucose: Building glucose uses the energy and hydrogen made in the light stage.
        Extra glucose is stored as starch: There's nothing to store until glucose has been made.
    items:
      - prompt: "Which gas is given out during photosynthesis?"
        options: ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"]
        answer: "Oxygen"
        difficulty: 1
        hints: ["The gas we breathe in."]
        solution: "Plants release oxygen during photosynthesis."
        mistakes: {"Carbon dioxide": photosynthesis_inputs}
      - prompt: "Where in a plant cell does photosynthesis take place?"
        options: ["Chloroplast", "Mitochondrion", "Nucleus", "Vacuole"]
        answer: "Chloroplast"
        difficulty: 1
        hints: ["The green organelle."]
        solution: "Chloroplasts contain chlorophyll."
        mistakes: {"Mitochondrion": chlorophyll_light}
      - prompt: "Through which structures does carbon dioxide enter a leaf?"
        options: ["Stomata", "Roots", "Xylem", "Flowers"]
        answer: "Stomata"
        difficulty: 1
        hints: ["Tiny pores on the leaf surface."]
        solution: "CO₂ diffuses in through the stomata."
        mistakes: {"Roots": stomata_role}
      - prompt: "Which reagent is used to test a leaf for starch?"
        options: ["Iodine solution", "Lime water", "Litmus", "Alcohol"]
        answer: "Iodine solution"
        difficulty: 2
        hints: ["It turns blue-black with starch."]
        solution: "Iodine turns blue-black where starch is present. Alcohol is only used to remove chlorophyll."
        mistakes: {"Alcohol": "starch_test_iodine", "Lime water": "starch_test_iodine", "Litmus": "starch_test_iodine"}
      - prompt: "In 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, how many molecules of carbon dioxide are needed to make one molecule of glucose?"
        answer: "6"
        check: "6"
        difficulty: 2
        hints: ["Glucose has 6 carbon atoms, and each CO₂ brings one."]
        solution: "Six CO₂ molecules supply the 6 carbon atoms of one glucose."
        mistakes: {"1": count_atoms}
      - prompt: "In 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, how many oxygen atoms are in 6O₂?"
        answer: "12"
        check: "6*2"
        difficulty: 2
        hints: ["Each O₂ has 2 oxygen atoms."]
        solution: "6 × 2 = 12 oxygen atoms."
        mistakes: {"6": count_atoms, "8": count_atoms}
      - prompt: "A potted plant is kept in the dark for two days and then a leaf is tested with iodine. What happens?"
        options: ["It stays brown: no starch", "It turns blue-black", "It turns green", "It turns red"]
        answer: "It stays brown: no starch"
        difficulty: 3
        hints: ["Without light, photosynthesis stops and stored starch is used up."]
        solution: "In the dark the plant uses up its starch and cannot make more, so there is no blue-black colour."
        mistakes: {"It turns blue-black": chlorophyll_light}
      - prompt: "The oxygen given out in photosynthesis comes from:"
        options: ["Water", "Carbon dioxide", "Glucose", "Chlorophyll"]
        answer: "Water"
        difficulty: 3
        hints: ["Light splits one of the raw materials."]
        solution: "Light energy splits water molecules; their oxygen is released."
        mistakes: {"Carbon dioxide": oxygen_from_water}
      - prompt: "A leaf with green and white patches is picked after a sunny day and tested with iodine. Where does it turn blue-black?"
        options: ["Only in the green parts", "Only in the white parts", "All over the leaf", "Nowhere"]
        answer: "Only in the green parts"
        difficulty: 2
        hints: ["Blue-black means starch is present.", "Which parts have chlorophyll?"]
        solution: "Step 1: Only the green parts have chlorophyll and could photosynthesise. Step 2: So only they made starch and turn blue-black."
        mistakes: {"Only in the white parts": chlorophyll_light, "All over the leaf": chlorophyll_light, "Nowhere": chlorophyll_light}
      - prompt: "A plant kept in the dark for two days is put in sunlight inside a sealed jar with potassium hydroxide, which absorbs carbon dioxide. Later a leaf is tested with iodine. What happens?"
        options: ["It stays brown: no starch", "It turns blue-black", "It turns green", "It turns red"]
        answer: "It stays brown: no starch"
        difficulty: 3
        hints: ["The dark days used up the starch already in the leaf.", "What does the plant lack inside the jar?"]
        solution: "Step 1: The leaf started with no starch. Step 2: Without carbon dioxide it cannot photosynthesise, so no new starch forms."
        mistakes: {"It turns blue-black": co2_needed, "It turns green": starch_test_iodine, "It turns red": starch_test_iodine}
      - prompt: "How many atoms in all are in one molecule of glucose, C₆H₁₂O₆?"
        answer: "24"
        check: "6+12+6"
        difficulty: 2
        hints: ["Read each small number after a letter.", "6 C, 12 H, 6 O."]
        solution: "Step 1: 6 + 12 + 6. Step 2: 24 atoms."
        mistakes: {"3": count_atoms, "18": count_atoms}

  - code: bio9.life.leaf
    title: The leaf and gas exchange
    after: [bio9.life.photosynthesis]
    notes: |
      Leaves are broad and thin for light and gas exchange. Stomata (mostly on the lower surface) are
      pores bounded by two guard cells; guard cells swell with water to open the pore and shrink to
      close it. Through stomata CO₂ enters, O₂ leaves, and water vapour escapes (transpiration).
      Plants respire all the time; in bright light photosynthesis is faster, so they give out O₂ overall.
    explanations:
      text: "The underside of a leaf is dotted with thousands of tiny mouths, the stomata. Each is guarded by two bean-shaped guard cells. When the plant has plenty of water, they swell and the pore opens to let carbon dioxide in. On hot, dry afternoons they close to save water."
      visual: "Draw two kidney beans facing each other with a slit between: the guard cells and the stoma. Fat beans: slit open. Thin beans: slit closed."
      step_by_step: "Why does a plant give out carbon dioxide at night? Step 1: Respiration goes on all the time. Step 2: At night there is no photosynthesis. Step 3: So CO₂ from respiration is released and not used."
      real_world: "Leaves of desert plants like cactus are reduced to spines, and their stomata open only at night, to save water."
    activity:
      type: sort
      prompt: What does each part of the leaf do?
      bins:
      - Gas exchange
      - Carrying water
      - Carrying food
      - Making food
      items:
      - label: Stomata
        bin: Gas exchange
        clue: They are tiny holes. What passes through them?
        why: Gases go in and out through the stomata.
      - label: Guard cells
        bin: Gas exchange
        why: 'They open and close the stomata: gas exchange.'
        clue: They sit around the stomata. What do they control?
      - label: Xylem
        bin: Carrying water
        clue: Which tube brings water up from the roots?
        why: Xylem carries water.
      - label: Phloem
        bin: Carrying food
        clue: Which tube takes sugar from the leaf to the rest of the plant?
        why: Phloem carries food.
      - label: Chloroplasts
        bin: Making food
        clue: Where is the green chlorophyll?
        why: Chloroplasts trap light to make food.
      - label: Palisade cells
        bin: Making food
        clue: These top cells are packed with chloroplasts. Why?
        why: Packed with chloroplasts, they make most of the food.
    items:
      - prompt: "What controls the opening and closing of a stoma?"
        options: ["Guard cells", "Xylem", "Chloroplasts in the root", "The cuticle"]
        answer: "Guard cells"
        difficulty: 1
        hints: ["Two bean-shaped cells."]
        solution: "Guard cells swell to open and shrink to close the pore."
        mistakes: {"Xylem": stomata_role}
      - prompt: "On which surface of most leaves are stomata more numerous?"
        options: ["Lower surface", "Upper surface", "Both equally", "On the stem only"]
        answer: "Lower surface"
        difficulty: 1
        hints: ["Away from direct sun to reduce water loss."]
        solution: "The lower surface is shaded, so less water is lost through stomata there."
        mistakes: {"Upper surface": "stomata_lower", "Both equally": "stomata_lower"}
      - prompt: "What happens to the guard cells when they take in water?"
        options: ["They swell and the stoma opens", "They shrink and the stoma closes", "They burst", "Nothing changes"]
        answer: "They swell and the stoma opens"
        difficulty: 2
        hints: ["Fat beans: open slit."]
        solution: "Turgid guard cells bend apart, opening the pore."
        mistakes: {"They shrink and the stoma closes": stomata_role}
      - prompt: "At night, a green plant mainly:"
        options: ["Takes in oxygen and gives out carbon dioxide", "Takes in carbon dioxide and gives out oxygen", "Does not exchange any gases", "Makes glucose"]
        answer: "Takes in oxygen and gives out carbon dioxide"
        difficulty: 2
        hints: ["No light, so only respiration."]
        solution: "Only respiration happens at night: O₂ in, CO₂ out."
        mistakes: {"Takes in carbon dioxide and gives out oxygen": chlorophyll_light}
      - prompt: "A leaf has 300 stomata per mm² on its lower surface and 60 per mm² on its upper surface. How many times as many are on the lower surface?"
        answer: "5"
        check: "300/60"
        difficulty: 2
        hints: ["Divide 300 by 60."]
        solution: "300 ÷ 60 = 5 times"
        mistakes: {"240": "ratio_subtracted"}
      - prompt: "Why do many plants close their stomata on a hot afternoon?"
        options: ["To reduce water loss", "To take in more carbon dioxide", "Because there is no light", "To release more oxygen"]
        answer: "To reduce water loss"
        difficulty: 3
        hints: ["Water vapour escapes through stomata."]
        solution: "Closing stomata cuts transpiration and saves water, though it also slows photosynthesis."
        mistakes: {"To take in more carbon dioxide": stomata_role}
      - prompt: "On a hot afternoon the guard cells of a leaf lose water. What happens?"
        options: ["They go limp and the stoma closes", "They swell and the stoma opens", "Nothing changes", "The stoma opens wider to cool the leaf"]
        answer: "They go limp and the stoma closes"
        difficulty: 2
        hints: ["Guard cells open the pore when they are full of water.", "What happens when they lose it?"]
        solution: "Step 1: Guard cells that lose water become limp (flaccid). Step 2: The pore between them closes, cutting water loss."
        mistakes: {"They swell and the stoma opens": stomata_role, "Nothing changes": stomata_role, "The stoma opens wider to cool the leaf": stomata_role}
      - prompt: "In bright light a plant makes 30 units of oxygen an hour and uses 5 units an hour in respiration. How many units of oxygen does it give out each hour?"
        answer: "25"
        check: "30-5"
        difficulty: 3
        hints: ["The plant uses some of its own oxygen.", "Given out = made − used."]
        solution: "Step 1: Made = 30, used = 5. Step 2: Given out = 25 units an hour."
        mistakes: {"35": net_gas, "30": net_gas, "6": ratio_subtracted}
      - prompt: "The leaves of a water lily float on the pond. Why are most of their stomata on the upper surface?"
        options: ["The lower surface lies on water, so air can't reach it", "So they can lose more water", "The upper surface is shaded", "To keep insects out"]
        answer: "The lower surface lies on water, so air can't reach it"
        difficulty: 3
        hints: ["Stomata are for gas exchange with the air.", "Which side of a floating leaf touches the air?"]
        solution: "Step 1: Gases pass through stomata to and from the air. Step 2: The lower side touches water, so the stomata are on top."
        mistakes: {"So they can lose more water": floating_leaf, "The upper surface is shaded": stomata_lower, "To keep insects out": floating_leaf}
