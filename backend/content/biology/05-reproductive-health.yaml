# Class 9 Biology, chapter 5. Format: content/README.md.
# Written to be age-appropriate for Class 9: science facts, health and respect.
subject: bio
chapter: 5
title: Reproductive Health

tips:
  foetus_needs: The foetus cannot eat or breathe air. What must reach it from the mother's blood, and what must it get rid of?
  mosquito_not_hiv: Malaria comes from a parasite spread by mosquitoes. HIV is a virus that slowly weakens the body's defence system.
  sperm_path: "Follow the path of sperms after they are made: which tube leads from the testes towards the urethra?"
  half_set: "A gamete carries half the chromosomes of a body cell, so that two gametes together make a full set."
  embryo_grows: "Fertilisation happens in one place, but the embryo needs a protected, blood-rich lining to grow. Which organ has it?"
  oil_glands: "Puberty hormones make some glands in the skin more active. Which ones can block pores?"
  count_back: "Ovulation comes about 14 days before the next period starts. Count back from the cycle's length."
  both_change: "Some changes happen only in boys and some only in girls. Look for one that happens in both."
  immune_deficiency: "AIDS stands for acquired immune deficiency syndrome. What does 'immune deficiency' tell you?"
  iron_foods: "Which choice is rich in iron? Leafy greens, jaggery and dates are traditional sources."
  gamete_names: "Each sex has its own gamete and organ that makes it: a small, swimming male cell, and a large female egg cell made in the ovaries. A fertilised egg has a different name."
  fertilisation_site: "The ovum is caught by the tube leading from the ovary to the uterus, and sperm meet it there. The uterus is where the embryo later grows."
  puberty_hormones: "Male puberty is driven by a hormone made in the testes; female puberty by two hormones made in the ovaries."
  menstrual_cycle: "The cycle lasts about four weeks, and ovulation is roughly halfway through. If the ovum is not fertilised, the uterus lining is not needed and is shed."
  chromosome_count: "Each gamete carries half the body's set. When the two gametes join, add their chromosomes together."
  infection_spread: "HIV and other sexually transmitted infections spread through body fluids such as blood; not by touching, hugging, sharing food or mosquito bites."
  placenta_role: "The placenta passes food and oxygen from the mother's blood to the foetus and takes away waste; the two bloods do not mix."
  hygiene_change: "Changing pads regularly and washing keep the body clean and prevent infection. Bathing during periods is safe and good."
  iron_anaemia: "Iron makes haemoglobin; without enough, anaemia follows. Calcium is for bones and iodine prevents goitre."
  marriage_age: "Indian law sets a different minimum marriage age for women and for men; for women it is the same age as the voting age."
  pituitary_master: "The pituitary, the master gland, controls the testes and ovaries. The thyroid controls metabolism."
  puberty_varies: "Puberty begins at different ages for different people. Starting earlier or later is normal."
  reliable_source: "Rumours and random posts are often wrong. Doctors, nurses, parents and teachers give correct facts."
  testes_cooler: "Sperms need a temperature 2–3 °C lower than the body, which is why the testes hang outside the abdomen."
  weeks_divide: "Divide the days by 7 to get weeks, not by 4 or 30."
  zygote_first: The very first cell of a new life forms when the two gametes join. The ball of cells that grows from it later has another name.
  menses_meaning: If no fertilised egg arrives, the thick lining that was prepared is not needed. What happens to it?
  no_casual_spread: HIV lives in blood and some body fluids. Everyday contact like shaking hands passes none of these.
  growth_needs: Growing bodies need iron for blood and protein for building. Which choice is a balanced, healthy plate?

concepts:
  - code: bio9.repro.systems
    title: Reproductive systems and fertilisation
    notes: |
      Human reproduction is sexual: a male gamete (sperm, made in the testes) joins a female gamete
      (ovum, released by an ovary) to form a zygote. Male system: testes (in the scrotum, slightly
      cooler than the body), vas deferens, seminal vesicles and prostate (fluids), urethra. Female
      system: ovaries, oviducts (fallopian tubes), uterus, vagina. Fertilisation usually happens in the
      oviduct. The zygote divides into an embryo that implants in the uterus wall; the placenta
      supplies food and oxygen. Pregnancy lasts about 9 months (about 280 days). Gametes have 23
      chromosomes; the zygote has 46.
    explanations:
      text: "Every person began as a single cell, the zygote, formed when a sperm from the father joined an ovum from the mother. Each gamete carries half the instructions (23 chromosomes), so the zygote has the full set of 46. It then divides again and again, settles in the uterus, and over about nine months grows into a baby, fed through the placenta."
      visual: "Draw a flow chart: ovary releases ovum → oviduct (meets sperm, fertilisation) → zygote divides → embryo implants in uterus → placenta and umbilical cord → foetus."
      step_by_step: "How many chromosomes does a zygote have? Step 1: Sperm has 23. Step 2: Ovum has 23. Step 3: 23 + 23 = 46."
      real_world: "Doctors use ultrasound scans, not X-rays, to check on a growing baby, because ultrasound is safe for the foetus."
    activity:
      type: sort
      prompt: Which system is each part in?
      bins:
      - Male reproductive system
      - Female reproductive system
      items:
      - label: Testis
        bin: Male reproductive system
        clue: Where are sperm made?
        why: 'Sperm are made in the testes: male.'
      - label: Sperm duct
        bin: Male reproductive system
        clue: What does this tube carry?
        why: 'It carries sperm: male.'
      - label: Seminal vesicle
        bin: Male reproductive system
        clue: It adds fluid to sperm.
        why: Part of the male system.
      - label: Ovary
        bin: Female reproductive system
        clue: Where are egg cells made?
        why: 'Eggs are made in the ovaries: female.'
      - label: Oviduct (fallopian tube)
        bin: Female reproductive system
        clue: Ovi- means egg. What does it carry?
        why: 'It carries the egg from the ovary: female.'
      - label: Uterus
        bin: Female reproductive system
        clue: Where does a baby grow?
        why: 'The baby grows in the uterus: female.'
    lesson:
      - teach: Humans reproduce sexually. A male gamete, the sperm, joins a female gamete, the ovum (egg). Sperms are made in the testes; ova are released by the ovaries. Joining is called fertilisation, and the single cell it makes is the zygote.
        check:
          prompt: What is the cell formed by fertilisation called?
          options:
          - Zygote
          - Ovum
          - Sperm
          answer: Zygote
          why: Sperm and ovum fuse to form the zygote.
      - teach: Body cells have 46 chromosomes. Gametes carry only half, 23, so that when sperm and ovum join, the zygote again has 46. Fertilisation usually happens in the oviduct (fallopian tube).
        picture:
          kind: flow
          steps:
          - Sperm (23)
          - + Ovum (23)
          - Fertilisation in the oviduct
          - Zygote (46)
          alt: A sperm and an ovum, each with 23 chromosomes, fuse into a zygote with 46.
        check:
          prompt: How many chromosomes does an ovum carry?
          options:
          - '23'
          - '46'
          - '92'
          answer: '23'
          why: Gametes carry half the body's 46.
      - teach: 'The zygote divides again and again to become an embryo, which settles into the thick wall of the uterus. The placenta links it to the mother: food and oxygen pass in, wastes pass out. After about 9 months (about 280 days) the baby is born.'
        check:
          prompt: Where does the embryo grow?
          options:
          - In the uterus
          - In the ovary
          - In the oviduct
          answer: In the uterus
          why: The embryo implants in the uterus wall and grows there.
    items:
      - prompt: "Where are sperms produced?"
        options: ["Testes", "Ovaries", "Uterus", "Prostate gland"]
        answer: "Testes"
        difficulty: 1
        hints: ["The male gonads."]
        solution: "Sperms are made in the testes."
        mistakes: {"Ovaries": gamete_names}
      - prompt: "What is the female gamete called?"
        options: ["Ovum", "Sperm", "Zygote", "Embryo"]
        answer: "Ovum"
        difficulty: 1
        hints: ["It is released by the ovary."]
        solution: "The ovum (egg) is the female gamete."
        mistakes: {"Sperm": gamete_names, "Zygote": gamete_names}
      - prompt: "Where does fertilisation usually take place in humans?"
        options: ["Oviduct (fallopian tube)", "Uterus", "Ovary", "Vagina"]
        answer: "Oviduct (fallopian tube)"
        difficulty: 2
        hints: ["The ovum meets the sperm on its way to the uterus."]
        solution: "Fertilisation happens in the oviduct; the embryo then moves to the uterus."
        mistakes: {"Uterus": fertilisation_site}
      - prompt: "A sperm has 23 chromosomes and an ovum has 23. How many chromosomes does the zygote have?"
        answer: "46"
        check: "23 + 23"
        difficulty: 1
        hints: ["Add the two sets."]
        solution: "23 + 23 = 46"
        mistakes: {"23": chromosome_count}
      - prompt: "What is the role of the placenta?"
        options: ["Passes food and oxygen from the mother to the foetus", "Produces the ovum", "Makes sperms", "Pumps the mother's blood into the foetus"]
        answer: "Passes food and oxygen from the mother to the foetus"
        difficulty: 2
        hints: ["It joins the foetus to the uterus wall."]
        solution: "The placenta exchanges food, oxygen and wastes between mother and foetus without the bloods mixing."
        mistakes: {"Pumps the mother's blood into the foetus": placenta_role}
      - prompt: "Why are the testes placed in the scrotum, outside the abdomen?"
        options: ["Sperms develop best at a temperature slightly below body temperature", "To protect them from injury", "So they can make more hormones", "There is no room inside"]
        answer: "Sperms develop best at a temperature slightly below body temperature"
        difficulty: 3
        hints: ["Think about temperature."]
        solution: "The scrotum keeps the testes about 2–3 °C cooler than the body, which sperm production needs."
        mistakes: {"To protect them from injury": "testes_cooler", "So they can make more hormones": "testes_cooler"}
      - prompt: "A pregnancy lasts about 280 days. About how many weeks is that?"
        answer: "40"
        check: "280/7"
        difficulty: 2
        hints: ["7 days in a week."]
        solution: "280 ÷ 7 = 40 weeks"

        mistakes: {"70": "weeks_divide", "9": "weeks_divide"}
      - prompt: "What does the vas deferens carry?"
        options: ["Sperms from the testes towards the urethra", "Ova from the ovary to the uterus", "Urine from the kidney", "Blood to the testes"]
        answer: "Sperms from the testes towards the urethra"
        difficulty: 2
        hints: ["The vas deferens is part of the male system.", "Which tube carries ova in females?"]
        solution: "Step 1: The vas deferens is a tube in the male system. Step 2: It carries sperms from the testes towards the urethra."
        mistakes: {"Ova from the ovary to the uterus": sperm_path, "Urine from the kidney": ureter_urethra, "Blood to the testes": sperm_path}
      - prompt: "A human body cell has 46 chromosomes. How many chromosomes are in a sperm cell?"
        answer: "23"
        check: "46/2"
        difficulty: 2
        hints: ["A sperm joins an ovum to make a full set.", "Each gamete carries half."]
        solution: "Step 1: The zygote must have 46. Step 2: So each gamete carries 46 ÷ 2 = 23."
        mistakes: {"46": half_set, "92": half_set}
      - prompt: "After fertilisation, where does the embryo attach and grow?"
        options: ["Uterus", "Oviduct", "Ovary", "Vagina"]
        answer: "Uterus"
        difficulty: 2
        hints: ["Fertilisation happens in the oviduct.", "Where is the thick, blood-rich lining?"]
        solution: "Step 1: The zygote divides as it moves down the oviduct. Step 2: The embryo implants in the uterus wall, where the placenta forms."
        mistakes: {"Oviduct": embryo_grows, "Ovary": embryo_grows, "Vagina": embryo_grows}
      - prompt: "A zygote has 46 chromosomes. Why must the sperm and the ovum each carry only 23?"
        options:
        - "So that joining them restores the full set of 46 instead of doubling it"
        - "Because sperm are smaller than ova"
        - "Because only boys need 23"
        - "So that the zygote has 23"
        answer: "So that joining them restores the full set of 46 instead of doubling it"
        difficulty: 3
        hints: ["Add the chromosomes of the two gametes together.", "What would happen to the number in each generation if gametes carried 46?"]
        solution: "Step 1: The zygote gets one set from each gamete. Step 2: 23 + 23 = 46, the normal number. Step 3: If each gamete carried 46, the zygote would have 92 and the number would double every generation."
        mistakes: {"So that the zygote has 23": half_set, "Because sperm are smaller than ova": chromosome_count}
      - prompt: Which organ releases the ovum?
        options:
        - Ovary
        - Uterus
        - Oviduct
        - Placenta
        answer: Ovary
        difficulty: 1
        hints:
        - The female gamete is made in a pair of organs.
        - Their name comes from the word for egg.
        solution: 'Step 1: Ova are the female gametes. Step 2: They are made in a pair of organs. Step 3: The ovaries release them.'
        mistakes:
          Uterus: embryo_grows
      - prompt: 'A ball of cells forming from the zygote and settling into the uterus wall is called:'
        options:
        - An embryo
        - A gamete
        - An ovum
        - A sperm
        answer: An embryo
        difficulty: 1
        hints:
        - It is no longer a single cell.
        - It has not yet become a baby with all organs.
        solution: 'Step 1: The zygote divides many times. Step 2: The ball of cells implants in the uterus. Step 3: It is called an embryo.'
        mistakes:
          An ovum: zygote_first
      - prompt: A pregnancy lasts about 266 days from fertilisation. About how many weeks is that?
        answer: '38'
        check: 266/7
        difficulty: 2
        hints:
        - How many days are in a week?
        - Divide the days by that.
        solution: 'Step 1: 1 week = 7 days. Step 2: 266 ÷ 7. Step 3: = 38 weeks.'
        mistakes:
          '66.5': weeks_divide
      - prompt: What passes from the mother to the foetus through the placenta?
        options:
        - Food and oxygen
        - Only carbon dioxide
        - Urea
        - Sperms
        answer: Food and oxygen
        difficulty: 2
        hints:
        - The foetus cannot eat or breathe air.
        - What does it need from the mother?
        solution: 'Step 1: The foetus can''t eat or breathe. Step 2: The placenta brings what it needs. Step 3: Food and oxygen pass in; wastes pass out.'
        mistakes:
          Urea: foetus_needs
  - code: bio9.repro.puberty
    title: Puberty and hormones
    after: [bio9.repro.systems]
    notes: |
      Puberty is the stage (about 10–14 years in girls, 12–16 in boys, and different for everyone)
      when the body becomes able to reproduce. Hormones bring the changes: testosterone in boys
      (deeper voice, facial hair, broader shoulders) and oestrogen and progesterone in girls (breast
      development, wider hips, start of menstruation). Both: growth spurt, body hair, sweat and oil
      glands more active (acne). The pituitary gland controls the gonads. The menstrual cycle lasts
      about 28 days; ovulation is around the middle. Emotional changes are normal too.
    explanations:
      text: "Puberty is the body's switch from child to adult, and it starts at different times for different people, which is completely normal. The pituitary gland in the brain signals the testes or ovaries to make hormones, and these cause the changes. Talking to a parent, teacher or doctor about questions is a healthy thing to do."
      visual: "Draw a chain: pituitary gland → testes → testosterone → changes in boys; pituitary gland → ovaries → oestrogen, progesterone → changes in girls."
      step_by_step: "If a menstrual cycle started on 1 March and the cycle is 28 days, when does the next start? Step 1: 1 + 28 = 29. Step 2: The next cycle starts around 29 March."
      real_world: "Acne in teenagers comes from oil glands made more active by puberty hormones; washing the face gently and not squeezing pimples helps."
    activity:
      type: sort
      prompt: Where does it come from, or who does it happen to?
      bins:
      - Testes
      - Ovaries
      - Both boys and girls
      items:
      - label: Testosterone
        bin: Testes
        clue: Which organ makes the male hormone?
        why: Testosterone is made in the testes.
      - label: Oestrogen
        bin: Ovaries
        clue: Which organ makes the female hormone?
        why: Oestrogen is made in the ovaries.
      - label: Progesterone
        bin: Ovaries
        clue: It prepares the uterus each month. Which organ makes it?
        why: Progesterone is made in the ovaries.
      - label: A growth spurt
        bin: Both boys and girls
        clue: Do only boys or only girls grow taller quickly?
        why: Both boys and girls have a growth spurt.
      - label: Hair under the arms
        bin: Both boys and girls
        clue: Do only boys or only girls get it?
        why: Both boys and girls.
      - label: Pimples from active skin glands
        bin: Both boys and girls
        clue: Do only boys or only girls get pimples?
        why: 'Both: skin glands become more active in everyone.'
    lesson:
      - teach: Puberty is the time when the body grows up and becomes able to reproduce. In girls it often begins around 10–14 years, in boys around 12–16, but everyone has their own timing, and earlier or later is normal.
        check:
          prompt: A boy notices his friends' voices changed a year before his. Is this normal?
          options:
          - Yes, puberty starts at different ages
          - No, puberty always starts at 12
          - No, something is wrong
          answer: Yes, puberty starts at different ages
          why: Every body has its own timing.
      - teach: 'Hormones bring the changes. The pituitary gland, the master gland, signals the testes and ovaries. Testes make testosterone (deeper voice, facial hair, broader shoulders). Ovaries make oestrogen and progesterone (breast growth, wider hips, periods). Both: a growth spurt, body hair, more sweat and oil (pimples).'
        picture:
          kind: compare
          columns:
          - title: Boys (testosterone)
            points:
            - deeper voice
            - facial hair
            - broader shoulders
          - title: Girls (oestrogen, progesterone)
            points:
            - breasts develop
            - wider hips
            - periods begin
          - title: Both
            points:
            - growth spurt
            - body hair
            - more sweat and oil
          alt: Puberty changes in boys, in girls, and in both.
        check:
          prompt: Which gland controls the testes and ovaries?
          options:
          - Pituitary
          - Thyroid
          - Salivary
          answer: Pituitary
          why: The pituitary is the master gland.
      - teach: Periods (menstruation) are part of a cycle of about 28 days. Each month the uterus lining thickens and an ovum is released around the middle of the cycle (ovulation). If it isn't fertilised, the lining breaks down and leaves the body for a few days. This is healthy and normal.
        check:
          prompt: In a 28-day cycle, roughly when is the ovum released?
          options:
          - Around day 14
          - Day 1
          - Day 28
          answer: Around day 14
          why: Ovulation is about halfway through.
    items:
      - prompt: "Which hormone causes changes such as a deeper voice and facial hair in boys?"
        options: ["Testosterone", "Oestrogen", "Insulin", "Thyroxine"]
        answer: "Testosterone"
        difficulty: 1
        hints: ["Made in the testes."]
        solution: "Testosterone from the testes causes male puberty changes."
        mistakes: {"Oestrogen": puberty_hormones}
      - prompt: "Which hormones bring about puberty changes in girls?"
        options: ["Oestrogen and progesterone", "Testosterone", "Adrenaline", "Growth hormone only"]
        answer: "Oestrogen and progesterone"
        difficulty: 1
        hints: ["Made in the ovaries."]
        solution: "The ovaries make oestrogen and progesterone."
        mistakes: {"Testosterone": puberty_hormones}
      - prompt: "Which gland controls the testes and ovaries?"
        options: ["Pituitary gland", "Thyroid gland", "Pancreas", "Adrenal gland"]
        answer: "Pituitary gland"
        difficulty: 2
        hints: ["Called the 'master gland', at the base of the brain."]
        solution: "The pituitary releases hormones that make the gonads produce their own hormones."
        mistakes: {"Thyroid gland": "pituitary_master", "Adrenal gland": "pituitary_master"}
      - prompt: "About how many days long is a typical menstrual cycle?"
        answer: "28"
        check: "28"
        difficulty: 1
        hints: ["About four weeks."]
        solution: "A typical cycle is about 28 days, though it varies."
        mistakes: {"7": menstrual_cycle}
      - prompt: "What happens to the thickened lining of the uterus if the ovum is not fertilised?"
        options: ["It breaks down and leaves the body as menstruation", "It turns into a placenta", "It stays for the next cycle", "It becomes an ovum"]
        answer: "It breaks down and leaves the body as menstruation"
        difficulty: 2
        hints: ["The lining was prepared for an embryo."]
        solution: "Without an embryo, the lining breaks down and flows out with some blood: menstruation."
        mistakes: {"It stays for the next cycle": menstrual_cycle}
      - prompt: "Two friends of the same age start puberty two years apart. What does this show?"
        options: ["Puberty starts at different ages for different people, and both are normal", "One of them is unhealthy", "The later one will not go through puberty", "Puberty depends only on height"]
        answer: "Puberty starts at different ages for different people, and both are normal"
        difficulty: 2
        hints: ["There is a range of normal ages."]
        solution: "The timing of puberty varies widely; both are normal."
        mistakes: {"One of them is unhealthy": "puberty_varies", "The later one will not go through puberty": "puberty_varies"}
      - prompt: "In a 28-day cycle, ovulation happens about halfway. On which day is that?"
        answer: "14"
        check: "28/2"
        difficulty: 3
        hints: ["Half of 28."]
        solution: "28 ÷ 2 = 14, so around day 14."
        mistakes: {"28": menstrual_cycle}
      - prompt: "Why do many teenagers get pimples (acne)?"
        options: ["Oil glands in the skin become more active during puberty", "Eating chocolate is the only cause", "Not drinking enough milk", "Catching it from friends"]
        answer: "Oil glands in the skin become more active during puberty"
        difficulty: 2
        hints: ["Puberty hormones affect the skin.", "Which glands make the skin oily?"]
        solution: "Step 1: Puberty hormones make oil (sebaceous) glands more active. Step 2: Extra oil can block pores, causing pimples. Gentle washing helps."
        mistakes: {"Eating chocolate is the only cause": oil_glands, "Not drinking enough milk": oil_glands, "Catching it from friends": oil_glands}
      - prompt: "A girl's cycle is 30 days long. Ovulation usually happens about 14 days before the next period starts. On about which day of her cycle does she ovulate?"
        answer: "16"
        check: "30-14"
        difficulty: 3
        hints: ["The next period starts on about day 31.", "Count back 14 days from the end of the cycle."]
        solution: "Step 1: The cycle is 30 days. Step 2: 30 − 14 = day 16. (For a 28-day cycle that gives day 14, halfway.)"
        mistakes: {"15": count_back, "14": count_back, "44": count_back}
      - prompt: "Which change of puberty happens in both boys and girls?"
        options: ["A growth spurt and new body hair", "The voice becomes much deeper", "Breasts develop", "A beard grows"]
        answer: "A growth spurt and new body hair"
        difficulty: 2
        hints: ["Which changes are caused by testosterone only?", "Which by oestrogen only?"]
        solution: "Step 1: Deeper voice and beard: mostly boys. Breasts: girls. Step 2: Both have a growth spurt and new body hair."
        mistakes: {"The voice becomes much deeper": both_change, "Breasts develop": both_change, "A beard grows": both_change}
      - prompt: Which hormone do the testes make?
        options:
        - Testosterone
        - Oestrogen
        - Progesterone
        - Insulin
        answer: Testosterone
        difficulty: 1
        hints:
        - Its name comes from the organ that makes it.
        - Oestrogen and progesterone come from the ovaries.
        solution: 'Step 1: Testes are the male gonads. Step 2: Their hormone causes boys'' puberty changes. Step 3: It is testosterone.'
        mistakes:
          Oestrogen: puberty_hormones
      - prompt: During puberty, the voice box grows and the voice deepens, especially in boys. What is the voice box called?
        options:
        - Larynx
        - Pharynx
        - Trachea
        - Pituitary
        answer: Larynx
        difficulty: 2
        hints:
        - It is at the top of the windpipe.
        - In boys it can stick out as the 'Adam's apple'.
        solution: 'Step 1: The voice is made in the voice box. Step 2: It sits at the top of the trachea. Step 3: It is the larynx.'
        mistakes:
          Pharynx: airway_order
      - prompt: 'If the ovum is not fertilised, the uterus lining breaks down and leaves the body. This is called:'
        options:
        - Menstruation
        - Ovulation
        - Fertilisation
        - Implantation
        answer: Menstruation
        difficulty: 1
        hints:
        - It happens about once a month.
        - Ovulation is the release of the ovum, not this.
        solution: 'Step 1: The lining was prepared for an embryo. Step 2: No embryo came. Step 3: The lining is shed: menstruation.'
        mistakes:
          Ovulation: menses_meaning
      - prompt: A girl's cycle is 26 days long. Ovulation is usually about 14 days before the next period starts. On about which day of her cycle does she ovulate?
        answer: '12'
        check: 26-14
        difficulty: 3
        hints:
        - Count back 14 days from the end of the cycle.
        - 26 − 14.
        solution: 'Step 1: The next period starts after day 26. Step 2: Ovulation is 14 days before. Step 3: 26 − 14 = day 12.'
        mistakes:
          '13': count_back
          '14': count_back
      - prompt: Why do teenagers need to bathe daily and wash their faces more often?
        options:
        - Sweat and oil glands become more active
        - The skin stops making oil
        - Hair stops growing
        - Bones get softer
        answer: Sweat and oil glands become more active
        difficulty: 2
        hints:
        - Puberty hormones affect the skin.
        - Which glands get busier?
        solution: 'Step 1: Hormones make sweat and oil glands more active. Step 2: This can cause body odour and pimples. Step 3: Daily bathing keeps skin healthy.'
        mistakes:
          The skin stops making oil: oil_glands

  - code: bio9.repro.health
    title: Reproductive health and hygiene
    after: [bio9.repro.puberty]
    notes: |
      Reproductive health means physical, mental and social well-being in matters of reproduction.
      It includes personal hygiene (daily bathing, clean undergarments, menstrual hygiene with
      clean pads or cups changed regularly), a balanced diet rich in iron and protein during
      adolescence, avoiding tobacco, alcohol and drugs, and correct information. Sexually
      transmitted infections (STIs) such as HIV/AIDS, syphilis and gonorrhoea spread through sexual
      contact, infected blood, shared needles and from mother to baby. HIV does not spread by
      touching, hugging, sharing food or mosquito bites, and people living with HIV deserve respect.
      In India the legal age of marriage is 21 for men and 18 for women. Child marriage harms
      health and education.
    explanations:
      text: "Growing up healthy means looking after your body and your mind. Simple hygiene prevents infections. Iron-rich food like greens, dates and ragi matters a lot in adolescence, especially for girls, to prevent anaemia. Myths spread fear: you cannot get HIV by sitting next to someone, sharing a meal or from a mosquito. Getting facts from a doctor, nurse or teacher is the safe choice."
      visual: "Draw two columns. 'Spreads HIV': infected blood transfusion, shared needles, mother to baby, unprotected sexual contact. 'Does NOT spread HIV': hugging, shaking hands, sharing food, mosquito bites, using the same toilet."
      step_by_step: "Is a blood transfusion safe? Step 1: Infections like HIV can spread through blood. Step 2: Blood banks test all donated blood. Step 3: So tested blood from a licensed blood bank is safe."
      real_world: "School health programmes in Kerala give iron and folic acid tablets to adolescents to prevent anaemia."
    activity:
      type: sort
      prompt: A healthy habit, or a myth?
      bins:
      - Healthy habit
      - Myth
      items:
      - label: Changing sanitary pads every 4 to 6 hours
        bin: Healthy habit
        clue: Does it keep the body clean and prevent infection?
        why: 'Changing often prevents infection: a healthy habit.'
      - label: Bathing every day
        bin: Healthy habit
        clue: Does it help with sweat and skin glands?
        why: 'Daily bathing keeps skin healthy: a healthy habit.'
      - label: Menstruation makes a girl impure
        bin: Myth
        why: 'It is a normal body process: this is a myth.'
        clue: Is menstruation a normal body process?
      - label: Talking to a trusted adult or doctor about changes
        bin: Healthy habit
        clue: Is it good to get correct information?
        why: Getting correct help is healthy.
      - label: Girls must not play sports during periods
        bin: Myth
        why: 'Gentle exercise often helps: this is a myth.'
        clue: Does gentle exercise harm or help?
    lesson:
      - teach: 'Reproductive health means being well in body, mind and relationships as we grow up. Simple habits help: bathing daily, clean undergarments, and during periods using clean pads or cups, changing them regularly and washing hands.'
        check:
          prompt: Which is a good habit during periods?
          options:
          - Changing pads regularly and washing hands
          - Not bathing
          - Using the same pad all day
          answer: Changing pads regularly and washing hands
          why: Regular changes and clean hands prevent infection.
      - teach: 'Teenagers grow fast and need good food: iron (leafy greens, jaggery, dates) to prevent anaemia, protein for growth, and calcium for bones. Tobacco, alcohol and drugs harm the growing body and mind.'
        check:
          prompt: 'Lack of iron in the diet causes:'
          options:
          - Anaemia
          - Rickets
          - Goitre
          answer: Anaemia
          why: Iron is needed to make haemoglobin.
      - teach: 'Some infections spread through sexual contact, infected blood, shared needles, or from mother to baby: HIV/AIDS, syphilis, gonorrhoea, hepatitis B. HIV does NOT spread by touching, hugging, sharing food or mosquito bites. People living with HIV deserve respect and care. Good information comes from doctors, nurses, parents and teachers.'
        picture:
          kind: compare
          columns:
          - title: HIV can spread by
            points:
            - infected blood
            - shared needles
            - sexual contact
            - mother to baby
          - title: HIV does NOT spread by
            points:
            - touching or hugging
            - sharing food or plates
            - mosquito bites
          alt: How HIV spreads, and everyday contact that does not spread it.
        check:
          prompt: Can sharing a meal with someone who has HIV spread the virus?
          options:
          - 'No'
          - 'Yes'
          - Only on the same plate
          answer: 'No'
          why: HIV does not spread through food or everyday contact.
    items:
      - prompt: "Which of these does NOT spread HIV?"
        options: ["Hugging or sharing food", "Sharing injection needles", "Transfusion of infected blood", "From an infected mother to her baby"]
        answer: "Hugging or sharing food"
        difficulty: 1
        hints: ["HIV spreads through body fluids like blood."]
        solution: "Casual contact like hugging or sharing food does not spread HIV."
        mistakes: {"Sharing injection needles": infection_spread}
      - prompt: "Can a mosquito bite spread HIV?"
        options: ["No", "Yes, always", "Only at night", "Only in the rainy season"]
        answer: "No"
        difficulty: 2
        hints: ["HIV cannot survive and multiply in a mosquito."]
        solution: "Mosquitoes do not transmit HIV."
        mistakes: {"Yes, always": infection_spread}
      - prompt: "Why is iron especially important in the diet of adolescents?"
        options: ["To prevent anaemia during rapid growth", "To make bones hard", "To prevent goitre", "To improve eyesight"]
        answer: "To prevent anaemia during rapid growth"
        difficulty: 2
        hints: ["Iron is needed for haemoglobin."]
        solution: "Iron forms haemoglobin; growth and menstruation increase the need, so lack of it causes anaemia."
        mistakes: {"To make bones hard": "iron_anaemia", "To prevent goitre": "iron_anaemia"}
      - prompt: "Which is a good menstrual hygiene practice?"
        options: ["Changing pads regularly and washing hands", "Using the same pad all day", "Avoiding bathing during periods", "Not talking to anyone about it"]
        answer: "Changing pads regularly and washing hands"
        difficulty: 1
        hints: ["Prevents infections."]
        solution: "Regular changing and washing keeps the body clean and prevents infections."
        mistakes: {"Avoiding bathing during periods": "hygiene_change", "Using the same pad all day": "hygiene_change"}
      - prompt: "What is the legal minimum age of marriage for women in India?"
        answer: "18"
        check: "18"
        difficulty: 2
        hints: ["For men it is 21."]
        solution: "18 years for women and 21 for men."
        mistakes: {"21": "marriage_age", "16": "marriage_age"}
      - prompt: "Which is the best way to get correct information about puberty and reproductive health?"
        options: ["Ask a doctor, nurse, parent or teacher", "Believe rumours from friends", "Trust random social media posts", "Avoid the topic completely"]
        answer: "Ask a doctor, nurse, parent or teacher"
        difficulty: 1
        hints: ["Choose someone trained and trustworthy."]
        solution: "Health workers, parents and teachers give reliable facts."
        mistakes: {"Believe rumours from friends": "reliable_source", "Trust random social media posts": "reliable_source"}
      - prompt: "Why do blood banks test donated blood before giving it to patients?"
        options: ["To make sure it does not carry infections such as HIV or hepatitis", "To find out the donor's name", "To make the blood thicker", "To change its blood group"]
        answer: "To make sure it does not carry infections such as HIV or hepatitis"
        difficulty: 3
        hints: ["Some infections spread through blood."]
        solution: "Screening blood stops infections spreading through transfusion."
        mistakes: {"To make the blood thicker": infection_spread}
      - prompt: "HIV weakens which body system?"
        options: ["The immune system", "The digestive system", "The skeletal system", "The respiratory system"]
        answer: "The immune system"
        difficulty: 2
        hints: ["What does the 'I' in HIV stand for?", "HIV attacks a kind of white blood cell."]
        solution: "Step 1: HIV is the human immunodeficiency virus. Step 2: It destroys white blood cells that fight infection, weakening the immune system."
        mistakes: {"The digestive system": immune_deficiency, "The skeletal system": immune_deficiency, "The respiratory system": immune_deficiency}
      - prompt: "Which of these foods best helps prevent anaemia in a growing teenager?"
        options: ["Green leafy vegetables, jaggery and dates", "Potato chips", "Soft drinks", "White sugar"]
        answer: "Green leafy vegetables, jaggery and dates"
        difficulty: 2
        hints: ["Anaemia is often from too little iron.", "Which choice is rich in iron?"]
        solution: "Step 1: Iron is needed to make haemoglobin. Step 2: Leafy greens, jaggery and dates are good iron sources; the others give little."
        mistakes: {"Potato chips": iron_foods, "Soft drinks": iron_foods, "White sugar": iron_foods}
      - prompt: "Why must needles and syringes never be shared?"
        options: ["Infections such as HIV and hepatitis B can spread through blood left on them", "They become blunt", "It costs more", "They rust faster"]
        answer: "Infections such as HIV and hepatitis B can spread through blood left on them"
        difficulty: 2
        hints: ["What could be left on a used needle?", "Which infections spread through blood?"]
        solution: "Step 1: A used needle can carry tiny amounts of blood. Step 2: Viruses such as HIV and hepatitis B spread this way, so needles must be single-use."
        mistakes: {"They become blunt": infection_spread, "It costs more": infection_spread, "They rust faster": infection_spread}
      - prompt: "A classmate's parent has HIV. Which of these could spread the virus to others?"
        options:
        - "Sharing an unsterilised needle"
        - "Hugging them"
        - "Eating lunch with them"
        - "A mosquito bite"
        answer: "Sharing an unsterilised needle"
        difficulty: 3
        hints: ["HIV spreads only through certain body fluids getting into the blood.", "Which of these lets blood from one person reach another?"]
        solution: "Step 1: HIV spreads through sexual contact, infected blood, shared needles and from mother to baby. Step 2: Touching, hugging, sharing food and mosquito bites do not spread it. Step 3: So only the shared needle carries a risk."
        mistakes: {"Hugging them": infection_spread, "Eating lunch with them": infection_spread, "A mosquito bite": infection_spread}
      - prompt: Which disease is caused by HIV?
        options:
        - AIDS
        - Malaria
        - Tuberculosis
        - Rickets
        answer: AIDS
        difficulty: 1
        hints:
        - HIV is a virus that weakens the immune system.
        - The disease's name ends in 'immune deficiency syndrome'.
        solution: 'Step 1: HIV attacks the immune system. Step 2: Over time the body can''t fight infections. Step 3: This condition is AIDS.'
        mistakes:
          Malaria: mosquito_not_hiv
      - prompt: Which is the minimum legal age of marriage for men in India?
        answer: '21'
        check: '21'
        difficulty: 2
        hints:
        - It is higher than the age for women.
        - The age for women is 18.
        solution: 'Step 1: The law sets different ages for women and men. Step 2: For women it is 18. Step 3: For men it is 21.'
        mistakes:
          '18': marriage_age
      - prompt: Which plate is the best choice for a growing teenager?
        options:
        - Rice, dal, leafy greens and a piece of jaggery
        - Chips and a cola
        - Only rice and pickle
        - Sweets only
        answer: Rice, dal, leafy greens and a piece of jaggery
        difficulty: 1
        hints:
        - Growth needs energy, protein and iron.
        - Which plate has all three?
        solution: 'Step 1: Rice gives energy. Step 2: Dal gives protein. Step 3: Leafy greens and jaggery give iron.'
        mistakes:
          Only rice and pickle: growth_needs
      - prompt: Which of these can spread HIV?
        options:
        - Using an unsterilised needle used by someone else
        - Shaking hands
        - Sitting in the same classroom
        - A mosquito bite
        answer: Using an unsterilised needle used by someone else
        difficulty: 2
        hints:
        - HIV lives in blood.
        - Which choice could carry someone else's blood?
        solution: 'Step 1: HIV spreads through infected blood. Step 2: A used needle may carry blood. Step 3: Shared needles can spread it; everyday contact cannot.'
        mistakes:
          Shaking hands: no_casual_spread
          A mosquito bite: infection_spread
