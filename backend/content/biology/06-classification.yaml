# Class 9 Biology, chapter 6. Format: content/README.md.
subject: bio
chapter: 6
title: Classification

tips:
  fertile_offspring: "A species is a group that can interbreed and have offspring that can themselves have young."
  one_cell_nucleus: "Look at the cell first: one cell, with a true nucleus. Which kingdom holds those, whether they make food or not?"
  fungal_wall: "Plant cell walls are made of cellulose. Fungi use a different tough substance, also found in insect shells."
  binomial_rules: "Scientific names have two parts in italics: the first starts with a capital letter, and the second is written all in small letters."
  genus_species: "In a two-part name, the first word is the larger group shared by close relatives (lion and tiger share it), and the second marks the exact kind."
  hierarchy_order: "Remember the levels, largest to smallest, with a sentence such as 'King Philip Came Over For Good Soup'. The first letters stand for the levels."
  hierarchy_size: "The higher the level, the more kinds of organisms it holds but the fewer features they share. Lower levels hold fewer kinds that are more alike. Tigers and cows share hair and milk, but not a family."
  prokaryote_monera: "Prokaryotes have no true nucleus, and bacteria are prokaryotes. Of the five kingdoms, only one is made of prokaryotes; single cells with a nucleus go elsewhere."
  fungi_not_plants: "Plants make their own food using a green pigment. Mushrooms grow on dead matter and absorb food from it, so they form their own kingdom."
  five_kingdoms: "Two scientists: an 18th-century Swede gave us two-part names; an American in 1969 sorted life into five kingdoms. Single cells with a true nucleus are neither plants nor animals and get a kingdom of their own."
  binomial_two: "'Bi' means two: a binomial name has two words, genus and species."
  classification_why: "Classification doesn't change organisms. It groups them so we can see how they are related."
  division_plants: "Botanists use a different word for the level just below kingdom: it means splitting into parts."
  scientific_name_why: "Local names differ between places and languages. One scientific name is understood by everyone in the world."
  seven_levels: "Count the levels: Kingdom, Phylum, Class, Order, Family, Genus, Species."
  virus_not_cells: "Viruses aren't made of cells and can't live on their own, so they don't fit any kingdom."

concepts:
  - code: bio9.class.naming
    title: Why classify, and binomial nomenclature
    notes: |
      Classification is grouping organisms by their similarities and differences. It makes the huge
      variety of life easier to study, shows relationships and evolution, and gives every organism one
      name understood worldwide. Carolus Linnaeus introduced binomial nomenclature: genus + species,
      e.g. Homo sapiens (human), Mangifera indica (mango), Panthera tigris (tiger), Oryza sativa
      (rice). Rules: genus starts with a capital letter, species with a small letter; both printed
      in italics (underlined separately when handwritten). Local names vary from place to place.
    explanations:
      text: "A mango is 'maanga' in Malayalam, 'aam' in Hindi and 'mango' in English, but scientists everywhere call it Mangifera indica. The first word, Mangifera, is the genus (the group of close relatives); the second, indica, is the species. Linnaeus gave us this two-name system in the 1700s."
      visual: "Write Panthera tigris. Draw an arrow from 'Panthera' to 'genus — capital letter' and from 'tigris' to 'species — small letter'. Box the whole name and label it 'italics'."
      step_by_step: "Is 'oryza Sativa' written correctly? Step 1: The genus must start with a capital: Oryza. Step 2: The species must be all small: sativa. Step 3: Correct form: Oryza sativa, in italics."
      real_world: "Doctors and scientists in Kerala and in Japan can talk about the same mosquito, Aedes aegypti, without confusion, though local names differ."
    activity:
      type: sort
      prompt: Is the scientific name written correctly? (Genus with a capital, species small.)
      bins:
      - Correct
      - Wrong
      items:
      - label: Homo sapiens
        bin: Correct
        clue: Genus capital, species small?
        why: 'Homo (capital) sapiens (small): correct.'
      - label: Mangifera indica
        bin: Correct
        clue: Genus capital, species small?
        why: 'Mangifera indica: correct.'
      - label: homo Sapiens
        bin: Wrong
        why: Genus starts with a capital; species is all small. This is the wrong way round.
        clue: Look at the capital letters.
      - label: Panthera tigris
        bin: Correct
        clue: Genus capital, species small?
        why: 'Panthera tigris: correct.'
      - label: Felis Catus
        bin: Wrong
        clue: Is the species name small?
        why: 'The species name must be small: Felis catus.'
      - label: Oryza sativa
        bin: Correct
        clue: Genus capital, species small?
        why: 'Oryza sativa (rice): correct.'
    items:
      - prompt: "Who introduced the binomial system of naming organisms?"
        options: ["Carolus Linnaeus", "R. H. Whittaker", "Charles Darwin", "Robert Hooke"]
        answer: "Carolus Linnaeus"
        difficulty: 1
        hints: ["A Swedish scientist of the 1700s."]
        solution: "Carolus Linnaeus introduced binomial nomenclature."
        mistakes: {"R. H. Whittaker": five_kingdoms}
      - prompt: "Which is the correct way to write the scientific name of humans?"
        options: ["Homo sapiens", "homo sapiens", "Homo Sapiens", "HOMO SAPIENS"]
        answer: "Homo sapiens"
        difficulty: 1
        hints: ["Capital for the genus only."]
        solution: "Genus with a capital letter, species with a small letter: Homo sapiens."
        mistakes: {"homo sapiens": binomial_rules, "Homo Sapiens": binomial_rules}
      - prompt: "In Mangifera indica, what does 'Mangifera' stand for?"
        options: ["Genus", "Species", "Family", "Kingdom"]
        answer: "Genus"
        difficulty: 2
        hints: ["The first word of the name."]
        solution: "The first word is the genus; indica is the species."
        mistakes: {"Species": genus_species}
      - prompt: "Why do scientists use scientific names instead of local names?"
        options: ["One name is understood all over the world", "Local names are too short", "Scientific names are easier to say", "Local names are wrong"]
        answer: "One name is understood all over the world"
        difficulty: 1
        hints: ["Think of the mango's many names."]
        solution: "A single scientific name avoids confusion between languages and regions."
        mistakes: {"Scientific names are easier to say": "scientific_name_why", "Local names are wrong": "scientific_name_why"}
      - prompt: "How many words are there in a binomial name?"
        answer: "2"
        check: "2"
        difficulty: 1
        hints: ["Bi means two."]
        solution: "Two: genus and species."
        mistakes: {"3": "binomial_two", "1": "binomial_two"}
      - prompt: "Which of these is a benefit of classification?"
        options: ["It shows how organisms are related to each other", "It changes the features of organisms", "It reduces the number of species", "It makes organisms grow faster"]
        answer: "It shows how organisms are related to each other"
        difficulty: 2
        hints: ["Grouping by similarity."]
        solution: "Classification groups similar organisms, revealing relationships and evolution."
        mistakes: {"It changes the features of organisms": "classification_why", "It reduces the number of species": "classification_why"}
      - prompt: "Panthera tigris (tiger) and Panthera leo (lion) share the same:"
        options: ["Genus", "Species", "Both genus and species", "Neither"]
        answer: "Genus"
        difficulty: 3
        hints: ["Compare the first words."]
        solution: "Both are Panthera, so they share a genus but are different species."
        mistakes: {"Species": genus_species, "Both genus and species": genus_species}
      - prompt: "Which of these follows the rules for writing a scientific name?"
        options: ["Panthera leo", "panthera leo", "Panthera Leo", "PANTHERA LEO"]
        answer: "Panthera leo"
        difficulty: 2
        hints: ["The genus starts with a capital letter.", "The species name is all small letters."]
        solution: "Step 1: Genus with a capital: Panthera. Step 2: Species in small letters: leo. (In print both are in italics.)"
        mistakes: {"panthera leo": binomial_rules, "Panthera Leo": binomial_rules, "PANTHERA LEO": binomial_rules}
      - prompt: "Rice is Oryza sativa. What does 'sativa' name?"
        options: ["The species", "The genus", "The family", "The kingdom"]
        answer: "The species"
        difficulty: 2
        hints: ["A binomial name is genus + species.", "Which word comes second?"]
        solution: "Step 1: The first word, Oryza, is the genus. Step 2: The second word, sativa, is the species."
        mistakes: {"The genus": genus_species, "The family": binomial_two, "The kingdom": binomial_two}
      - prompt: "The cat is Felis catus, the lion Panthera leo and the leopard Panthera pardus. Which two are most closely related?"
        options: ["Lion and leopard", "Cat and lion", "Cat and leopard", "All three equally"]
        answer: "Lion and leopard"
        difficulty: 3
        hints: ["Compare the first word of each name.", "Sharing a genus means closer relatives."]
        solution: "Step 1: Lion and leopard share the genus Panthera. Step 2: The cat is in a different genus, Felis, so lion and leopard are closest."
        mistakes: {"Cat and lion": genus_species, "Cat and leopard": genus_species, "All three equally": genus_species}

  - code: bio9.class.hierarchy
    title: Levels of classification
    after: [bio9.class.naming]
    notes: |
      Organisms are placed in a hierarchy of groups: Kingdom → Phylum (Division for plants) → Class →
      Order → Family → Genus → Species. Species is the basic unit: a group of organisms that can
      interbreed and produce fertile offspring. Going down the hierarchy, the number of organisms in a
      group decreases and the number of shared features increases. Example, human: Animalia,
      Chordata, Mammalia, Primates, Hominidae, Homo, sapiens.
    explanations:
      text: "Think of an address: country, state, district, town, street, house. Each step narrows it down. Classification works the same way: kingdom is like the country (huge, many members), species is like one house (very few, very alike). A tiger and a lion share the same genus; a tiger and a cow only share up to class (both mammals)."
      visual: "Draw an upside-down pyramid of seven layers: Kingdom at the wide top, Species at the narrow bottom. Write 'more organisms' at the top and 'more similarities' at the bottom."
      step_by_step: "Which comes between Class and Family? Step 1: Order is K, P, C, O, F, G, S. Step 2: After Class (C) comes Order (O), then Family (F). Step 3: The answer is Order."
      real_world: "A memory trick: 'King Philip Came Over For Good Soup' gives Kingdom, Phylum, Class, Order, Family, Genus, Species."
    activity:
      type: order
      prompt: Put the levels in order, from biggest group to smallest.
      steps:
      - Kingdom
      - Phylum
      - Class
      - Order
      - Family
      - Genus
      - Species
      reasons:
        Phylum: Kingdom is the biggest group of all.
        Class: A phylum is split into classes.
        Order: A class is split into orders.
        Family: An order is split into families.
        Genus: A family is split into genera.
        Species: 'Species is the smallest group: one kind of living thing.'
    items:
      - prompt: "Which is the smallest (most basic) unit of classification?"
        options: ["Species", "Genus", "Kingdom", "Family"]
        answer: "Species"
        difficulty: 1
        hints: ["Members can interbreed."]
        solution: "Species is the basic unit."
        mistakes: {"Kingdom": hierarchy_order, "Genus": hierarchy_order}
      - prompt: "Which level comes directly after Class?"
        options: ["Order", "Family", "Phylum", "Genus"]
        answer: "Order"
        difficulty: 1
        hints: ["K, P, C, O, F, G, S."]
        solution: "Class → Order → Family."
        mistakes: {"Family": hierarchy_order, "Phylum": hierarchy_order}
      - prompt: "In plants, which word is used instead of Phylum?"
        options: ["Division", "Order", "Class", "Section"]
        answer: "Division"
        difficulty: 2
        hints: ["It begins with D."]
        solution: "Plant kingdom uses Division in place of Phylum."
        mistakes: {"Order": "division_plants", "Class": "division_plants"}
      - prompt: "Which group contains the most kinds of organisms?"
        options: ["Kingdom", "Family", "Genus", "Species"]
        answer: "Kingdom"
        difficulty: 2
        hints: ["The top of the hierarchy."]
        solution: "Kingdom is the broadest group."
        mistakes: {"Species": hierarchy_size}
      - prompt: "Members of which group share the most features?"
        options: ["Species", "Order", "Phylum", "Kingdom"]
        answer: "Species"
        difficulty: 2
        hints: ["The lowest level."]
        solution: "The lower the level, the more alike the members."
        mistakes: {"Kingdom": hierarchy_size}
      - prompt: "How many main levels are there from Kingdom to Species?"
        answer: "7"
        check: "7"
        difficulty: 1
        hints: ["King Philip Came Over For Good Soup."]
        solution: "Kingdom, Phylum, Class, Order, Family, Genus, Species: 7."
        mistakes: {"6": "seven_levels", "8": "seven_levels"}
      - prompt: "A tiger and a cow are both mammals. Which is the lowest group they certainly share?"
        options: ["Class", "Genus", "Species", "Family"]
        answer: "Class"
        difficulty: 3
        hints: ["Both are mammals. Which level of the ladder (kingdom, phylum, class, order...) is the group 'Mammalia'?"]
        solution: "Both belong to Class Mammalia but to different orders, families and genera."
        mistakes: {"Genus": hierarchy_size}
      - prompt: "Human: Animalia, Chordata, Mammalia, Primates, Hominidae, Homo, sapiens. Which level is Hominidae?"
        options: ["Family", "Order", "Genus", "Class"]
        answer: "Family"
        difficulty: 2
        hints: ["Match each word to Kingdom, Phylum, Class, Order, Family, Genus, Species.", "Hominidae is the fifth."]
        solution: "Step 1: Animalia = kingdom, Chordata = phylum, Mammalia = class, Primates = order. Step 2: Hominidae is the family."
        mistakes: {"Order": hierarchy_order, "Genus": hierarchy_order, "Class": hierarchy_order}
      - prompt: "Two animals are in the same order. Which group must they also share?"
        options: ["Class", "Family", "Genus", "Species"]
        answer: "Class"
        difficulty: 3
        hints: ["Each level sits inside the one above it. Which level is just above order?", "Groups below the order may differ."]
        solution: "Step 1: Every order lies inside a single class. Step 2: So the same order means the same class; they may still be in different families."
        mistakes: {"Family": hierarchy_size, "Genus": hierarchy_size, "Species": hierarchy_size}
      - prompt: "A horse and a donkey can have a foal together, a mule, but mules cannot have young of their own. What does this show?"
        options: ["Horses and donkeys are different species", "Horses and donkeys are the same species", "Mules are a new species", "Horses and donkeys are in different kingdoms"]
        answer: "Horses and donkeys are different species"
        difficulty: 3
        hints: ["What is the definition of a species?", "Are the offspring fertile?"]
        solution: "Step 1: A species interbreeds to produce fertile offspring. Step 2: Mules are infertile, so horses and donkeys are separate species (in the same genus, Equus)."
        mistakes: {"Horses and donkeys are the same species": fertile_offspring, "Mules are a new species": fertile_offspring, "Horses and donkeys are in different kingdoms": hierarchy_size}

  - code: bio9.class.kingdoms
    title: The five kingdoms
    after: [bio9.class.hierarchy]
    notes: |
      R. H. Whittaker (1969) proposed five kingdoms, based on cell type, body organisation and mode of
      nutrition. Monera: prokaryotic, unicellular (bacteria, cyanobacteria). Protista: unicellular
      eukaryotes (Amoeba, Paramecium, Euglena, diatoms). Fungi: eukaryotic, no chlorophyll,
      saprophytic, cell wall of chitin (mushroom, yeast, Rhizopus). Plantae: multicellular,
      autotrophic, cell wall of cellulose. Animalia: multicellular, heterotrophic, no cell wall.
      Viruses are not placed in any kingdom because they are not cells.
    explanations:
      text: "Whittaker asked three questions: Does the cell have a true nucleus? Is the body one cell or many? How does it get food? Bacteria have no true nucleus: Monera. Amoeba is one cell with a nucleus: Protista. Mushrooms can't make food and absorb it from dead matter: Fungi. Mango trees make food: Plantae. Cows eat food: Animalia."
      visual: "Draw a decision tree: true nucleus? No → Monera. Yes → one cell? Yes → Protista. No → makes own food? Yes → Plantae. No → absorbs from dead matter → Fungi; eats food → Animalia."
      step_by_step: "Classify yeast. Step 1: It has a true nucleus (eukaryote). Step 2: It has no chlorophyll. Step 3: It absorbs food and has a chitin cell wall. Step 4: Kingdom Fungi."
      real_world: "Curd is made by bacteria (Monera), and appam batter rises thanks to yeast (Fungi): two kingdoms in a Kerala kitchen."
    activity:
      type: sort
      prompt: Which kingdom?
      bins:
      - Monera
      - Protista
      - Fungi
      - Plantae
      - Animalia
      items:
      - label: Bacteria
        bin: Monera
        clue: Do its cells have a nucleus?
        why: 'No nucleus: Monera.'
      - label: Amoeba
        bin: Protista
        clue: One cell with a nucleus?
        why: 'A single cell with a nucleus: Protista.'
      - label: Mushroom
        bin: Fungi
        clue: Does it make its own food? Is it a plant?
        why: 'It can''t make food; it feeds on dead matter: Fungi.'
      - label: Yeast
        bin: Fungi
        clue: It is used to make bread rise. Plant, animal or something else?
        why: Yeast is a fungus.
      - label: Mango tree
        bin: Plantae
        clue: Does it make its own food?
        why: 'It makes food by photosynthesis: Plantae.'
      - label: Fish
        bin: Animalia
        clue: Does it eat other living things and move about?
        why: 'Many cells, eats food, moves: Animalia.'
    items:
      - prompt: "Who proposed the five-kingdom classification?"
        options: ["R. H. Whittaker", "Carolus Linnaeus", "Gregor Mendel", "Louis Pasteur"]
        answer: "R. H. Whittaker"
        difficulty: 1
        hints: ["Proposed in 1969."]
        solution: "R. H. Whittaker proposed five kingdoms in 1969."
        mistakes: {"Carolus Linnaeus": five_kingdoms}
      - prompt: "Bacteria belong to which kingdom?"
        options: ["Monera", "Protista", "Fungi", "Plantae"]
        answer: "Monera"
        difficulty: 1
        hints: ["They have no true nucleus."]
        solution: "Bacteria are prokaryotes: Kingdom Monera."
        mistakes: {"Protista": prokaryote_monera}
      - prompt: "Mushrooms belong to which kingdom?"
        options: ["Fungi", "Plantae", "Monera", "Protista"]
        answer: "Fungi"
        difficulty: 1
        hints: ["They have no chlorophyll."]
        solution: "Mushrooms absorb food from dead matter: Kingdom Fungi."
        mistakes: {"Plantae": fungi_not_plants}
      - prompt: "Amoeba and Paramecium are unicellular organisms with a true nucleus. Their kingdom is:"
        options: ["Protista", "Monera", "Animalia", "Fungi"]
        answer: "Protista"
        difficulty: 2
        hints: ["Single-celled eukaryotes."]
        solution: "Unicellular eukaryotes are placed in Protista."
        mistakes: {"Monera": prokaryote_monera, "Animalia": five_kingdoms}
      - prompt: "Which kingdom has organisms without a true nucleus?"
        options: ["Monera", "Fungi", "Plantae", "Animalia"]
        answer: "Monera"
        difficulty: 2
        hints: ["Prokaryotes."]
        solution: "Only Monera are prokaryotic."
        mistakes: {"Fungi": prokaryote_monera}
      - prompt: "Why are fungi not placed in the plant kingdom?"
        options: ["They have no chlorophyll and cannot make their own food", "They are too small", "They have no cells", "They live only in water"]
        answer: "They have no chlorophyll and cannot make their own food"
        difficulty: 2
        hints: ["Think about how they get food."]
        solution: "Fungi are saprophytes without chlorophyll, unlike autotrophic plants."
        mistakes: {"They have no cells": fungi_not_plants}
      - prompt: "How many kingdoms are there in Whittaker's system?"
        answer: "5"
        check: "5"
        difficulty: 1
        hints: ["It is called the ___-kingdom classification."]
        solution: "Five: Monera, Protista, Fungi, Plantae, Animalia."
        mistakes: {"4": "five_kingdoms", "6": "five_kingdoms"}
      - prompt: "Why are viruses not placed in any of the five kingdoms?"
        options: ["They are not made of cells", "They are too large", "They make their own food", "They live only in plants"]
        answer: "They are not made of cells"
        difficulty: 3
        hints: ["All five kingdoms are made of cells."]
        solution: "Viruses are not cells and reproduce only inside living cells, so they are kept outside the kingdoms."
        mistakes: {"They are too large": "virus_not_cells", "They make their own food": "virus_not_cells"}
      - prompt: "Euglena is a single cell with a true nucleus. It has chlorophyll and also swims with a whip-like flagellum. Which kingdom is it in?"
        options: ["Protista", "Plantae", "Animalia", "Monera"]
        answer: "Protista"
        difficulty: 3
        hints: ["How many cells does it have?", "Does it have a true nucleus?"]
        solution: "Step 1: Unicellular with a true nucleus. Step 2: That places it in Protista, whatever its way of feeding."
        mistakes: {"Plantae": one_cell_nucleus, "Animalia": one_cell_nucleus, "Monera": prokaryote_monera}
      - prompt: "What are the cell walls of fungi made of?"
        options: ["Chitin", "Cellulose", "They have no cell wall", "Starch"]
        answer: "Chitin"
        difficulty: 2
        hints: ["Plant walls are cellulose.", "Fungi use the same substance as insect shells."]
        solution: "Step 1: Fungi have cell walls. Step 2: They are made of chitin, not cellulose, one reason fungi are not plants."
        mistakes: {"Cellulose": fungal_wall, "They have no cell wall": fungal_wall, "Starch": fungal_wall}
      - prompt: "Cyanobacteria make their own food by photosynthesis. Why are they put in Monera and not in Plantae?"
        options: ["They have no true nucleus", "They are blue-green in colour", "They live in water", "They are too small to see"]
        answer: "They have no true nucleus"
        difficulty: 3
        hints: ["Whittaker looked at the type of cell first.", "Are cyanobacteria prokaryotes?"]
        solution: "Step 1: Cyanobacteria are prokaryotes: no true nucleus. Step 2: All prokaryotes are in Monera, even those that photosynthesise."
        mistakes: {"They are blue-green in colour": prokaryote_monera, "They live in water": prokaryote_monera, "They are too small to see": prokaryote_monera}
