# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse11-math
chapter: 5
title: Linear Inequalities
tips:
  c11_flip: "Multiplying or dividing an inequality by a negative number reverses the sign. Check the sign after you divide."
  m11_at_least: "'At least 20' means 20 or more."
  m11_average_ineq: "Average = total ÷ number of tests, and 'at least' means ≥."
  m11_average_need: "Average ≥ 60 over three tests means the total must be at least 180."
  m11_convert_ineq: "Solve for F: multiply by 9/5 and add 32 to each part. F is strictly greater than the lower value."
  m11_count_integers: "Solve to get the interval, then list the integers in it, checking which ends are included."
  m11_number_line: "≤ includes the end point (filled circle). 'Less than' is towards the left."
  m11_odd_pair: "Call them x and x + 2. Solve x + (x + 2) < 40, then pick the largest odd x that works."
  m11_strict: "Solve the inequality for x first. With a strict sign (< or >), the boundary number itself does not count."
  m11_triangle_ineq: "Any two sides must add to more than the third. The third side must exceed the difference of the other two."
  m11_whole_items: "You can only buy whole pens and must not overspend. Round the division down."
  c11m5_flip: Multiplying or dividing both sides by a negative number reverses the inequality sign.
  c11m5_ends: 'Check the end points: is the inequality strict (<, >) or does it include the end (≤, ≥)?'
  c11m5_words: 'Translate the words first: at least is ≥, at most is ≤, more than is >, less than is <.'
concepts:
- code: cbse11m.ineq.one
  title: Solving inequalities in one variable
  notes: |
    Rules: adding or subtracting the same number keeps the sign; multiplying or dividing by a positive number keeps it;
    by a negative number reverses it. Solution set shown on a number line (open circle for <, >; filled for ≤, ≥).
    Integer and natural solutions. Double inequalities: −3 ≤ 2x + 1 < 5 → −2 ≤ x < 2. Word problems: marks needed
    for an average.
  explanations:
    text: 'Solve an inequality like an equation, with one big rule: if you multiply or divide by a negative number, flip the sign. So −2x < 6 becomes x > −3. Show the answer on a number line.'
    visual: Draw a number line. For x > −3, put an open circle at −3 and shade everything to the right. For x ≤ 2, put a filled circle at 2 and shade to the left.
    step_by_step: 'Step 1: Collect x terms on one side. Step 2: Move numbers to the other side. Step 3: Divide by the coefficient; flip the sign if it''s negative. Step 4: Draw on a number line.'
    real_world: To average at least 60 marks over three tests after scoring 52 and 58, you need x with (52 + 58 + x)/3 ≥ 60, so x ≥ 70.
  picture:
    kind: number_line
    from: -5
    to: 5
    step: 1
    points:
    - at: -3
      label: −3 (open)
    alt: 'The solution x > −3: an open circle at −3 with everything to its right shaded.'
  activity:
    type: number_line
    min: -16
    max: 16
    step: 1
    start: 0
    prompt: Solve each inequality, then mark the number it asks for.
    goals:
    - prompt: 3x − 7 ≤ 8. Mark the largest x that works.
      target: 5
      mistakes:
      - when:
          v: 15
        say: 3x ≤ 15 still needs dividing by 3.
      - when:
          v:
          - 0
          - 1
        say: 'Undo − 7 by adding 7 to both sides: 3x ≤ 15.'
      - when:
          v: 4
        say: 'Try x = 5: 3 × 5 − 7 = 8, and 8 ≤ 8 is true. ≤ includes the boundary.'
    - prompt: −2x > 6. Mark the largest whole number that works.
      target: -4
      mistakes:
      - when:
          v: -3
        say: x = −3 gives −2 × −3 = 6, which is not more than 6. A strict > leaves the boundary out.
      - when:
          v:
          - -2
          - 16
        say: 'Try it: x = −2 gives 4, not more than 6. Dividing by −2 flips the sign: x < −3.'
    - prompt: (x + 4)/2 < x + 1. Mark the smallest whole number that works.
      target: 3
      mistakes:
      - when:
          v: 2
        say: x = 2 gives 3 < 3, which is false. A strict < leaves the boundary out.
      - when:
          v:
          - -16
          - 1
        say: 'Try x = 0: (0 + 4)/2 = 2, and 2 < 1 is false. Multiply both sides by 2 first: x + 4 < 2x + 2.'
    - prompt: −5 ≤ 2x + 1 < 9. Mark the smallest whole number that works.
      target: -3
      mistakes:
      - when:
          v: -6
        say: '−6 is the bound for 2x. Divide all three parts by 2: −3 ≤ x < 4.'
      - when:
          v: -2
        say: 'x = −3 gives 2 × −3 + 1 = −5, and −5 ≤ −5 is true: ≤ keeps the end.'
      - when:
          v: 3
        say: 3 is the largest that works. The question asks for the smallest.
  lesson:
    - teach: 'Solve an inequality like an equation: add or subtract the same number on both sides, and multiply or divide by a positive number. The sign stays the same.'
      check:
        prompt: Solve x − 7 > 2.
        options:
        - x > 9
        - x > −5
        - x < 9
        answer: x > 9
        why: Add 7 to both sides.
      ways:
      - style: visual
        teach: Solving 3x + 4 < 19 step by step, ending on a number line.
        picture:
          kind: number_line
          from: 0
          to: 8
          points:
          - at: 5
            label: x < 5 (open dot)
          - at: 4
            label: largest integer 4
          alt: A number line with an open dot at 5 and everything to its left shaded; 4 is the largest whole number that works.
      - style: step_by_step
        teach: 'Step 1: Move the constant: 3x + 4 < 19 gives 3x < 15. Step 2: Divide by the positive 3: x < 5. Step 3: The sign stays the same because 3 is positive. Step 4: Show it with an open dot at 5.'
    - teach: 'Multiplying or dividing by a negative number reverses the sign: from −3x ≤ 12 we get x ≥ −4.'
      picture:
        kind: number_line
        from: -6
        to: 2
        points:
        - at: -4
          label: −4 (filled)
        alt: 'x ≥ −4: filled circle at −4, shaded to the right.'
      check:
        prompt: Solve −5x > 20.
        options:
        - x < −4
        - x > −4
        - x < 4
        answer: x < −4
        why: Dividing by −5 reverses > to <.
      ways:
      - style: step_by_step
        teach: 'Step 1: Spot the negative number you must divide by. Step 2: Divide both sides by it. Step 3: Turn the sign round. Example: −3x ≤ 12 → x ≥ −4. Step 4: Check with x = 0: −3(0) ≤ 12 is true and 0 ≥ −4 too.'
      - style: real_world
        teach: '5 is more than 2. Now owe the money instead: a debt of ₹5 is worse than a debt of ₹2, so −5 < −2. Turning numbers negative turns the order round, and so does multiplying an inequality by a negative.'
    - teach: 'A double inequality like 1 < 3x − 2 ≤ 7 is solved on all three parts at once: add 2 to get 3 < 3x ≤ 9, divide by 3 to get 1 < x ≤ 3.'
      check:
        prompt: Solve 2 ≤ x + 3 < 6.
        options:
        - −1 ≤ x < 3
        - 5 ≤ x < 9
        - −1 < x ≤ 3
        answer: −1 ≤ x < 3
        why: Subtract 3 from all three parts; the signs stay.
      ways:
      - style: visual
        teach: '1 < x ≤ 3: an open dot at 1, a closed dot at 3, shaded between.'
        picture:
          kind: number_line
          from: -1
          to: 5
          points:
          - at: 1
            label: 'open: x > 1'
          - at: 3
            label: 'closed: x ≤ 3'
          alt: A number line with an open dot at 1, a filled dot at 3 and the part between them shaded.
      - style: step_by_step
        teach: 'Step 1: Do the same thing to all three parts: add 2 to get 3 < 3x ≤ 9. Step 2: Divide all three parts by 3: 1 < x ≤ 3. Step 3: Read off the integers that fit: 2 and 3.'
  items:
  - prompt: Solve 3x + 4 < 19. What is the largest integer x can be?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - 3x < 15.
    - x < 5.
    solution: x < 5, so the largest integer is 4.
    mistakes: {"5": "m11_strict"}
  - prompt: Solve −2x < 6.
    options:
    - x > −3
    - x < −3
    - x > 3
    - x < 3
    answer: x > −3
    difficulty: 1
    hints:
    - Divide by −2.
    - Flip the sign.
    solution: 'Dividing by −2 flips the sign: x > −3.'
    mistakes:
      x < −3: c11_flip
  - prompt: Solve −3 ≤ 2x + 1 < 5. How many integer solutions are there?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - −4 ≤ 2x < 4.
    - −2 ≤ x < 2.
    solution: 'x = −2, −1, 0, 1: four integers.'
    mistakes: {"3": "m11_count_integers", "5": "m11_count_integers"}
  - prompt: A student scored 52 and 58 in two tests. What is the least mark needed in the third to average at least 60?
    answer: '70'
    check: 180 - 110
    difficulty: 2
    hints:
    - (52 + 58 + x)/3 ≥ 60.
    - x ≥ 180 − 110.
    solution: x ≥ 70.
    mistakes: {"60": "m11_average_need", "50": "m11_average_need"}
  - prompt: Find the smallest natural number x with 5x − 3 > 17.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 5x > 20.
    - x > 4.
    solution: x > 4, so the smallest natural number is 5.
    mistakes: {"4": "m11_strict"}
  - prompt: Which number line shows x ≤ 2?
    options:
    - Filled circle at 2, shaded left
    - Open circle at 2, shaded left
    - Filled circle at 2, shaded right
    - Open circle at 2, shaded right
    answer: Filled circle at 2, shaded left
    difficulty: 1
    hints:
    - ≤ includes 2.
    - Smaller numbers are on the left.
    solution: Filled circle (2 included), shaded to the left.
    mistakes: {"Open circle at 2, shaded left": "m11_number_line", "Filled circle at 2, shaded right": "m11_number_line", "Open circle at 2, shaded right": "m11_number_line"}
  - prompt: Solve 4x − 5 ≥ 11.
    options:
    - x ≥ 4
    - x ≥ 1.5
    - x ≤ 4
    answer: x ≥ 4
    difficulty: 1
    hints:
    - Add 5 to both sides.
    - Divide by a positive number.
    solution: 'Step 1: 4x ≥ 16. Step 2: x ≥ 4.'
    mistakes:
      x ≥ 1.5: c11m5_flip
      x ≤ 4: c11m5_flip
  - prompt: Solve 6 − 2x > 0.
    options:
    - x < 3
    - x > 3
    - x > −3
    answer: x < 3
    difficulty: 2
    hints:
    - Move 6 across.
    - You will divide by −2.
    solution: 'Step 1: −2x > −6. Step 2: x < 3.'
    mistakes:
      x > 3: c11m5_flip
      x > −3: c11m5_flip
  - prompt: How many natural numbers satisfy 2x + 1 < 11?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Solve for x first.
    - Natural numbers start at 1.
    solution: 'Step 1: x < 5. Step 2: x = 1, 2, 3, 4: four numbers.'
    mistakes:
      '5': c11m5_ends
      '6': c11m5_ends
  - prompt: Solve x/3 + 2 ≤ 5.
    options:
    - x ≤ 9
    - x ≤ 1
    - x ≥ 9
    answer: x ≤ 9
    difficulty: 1
    hints:
    - Subtract 2 first.
    - Then multiply by 3.
    solution: 'Step 1: x/3 ≤ 3. Step 2: x ≤ 9.'
    mistakes:
      x ≤ 1: c11m5_flip
      x ≥ 9: c11m5_flip
  - prompt: How many integers satisfy −1 < 3 − 2x ≤ 7?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - Subtract 3 from all parts, then divide by −2.
    - Both signs flip.
    solution: 'Step 1: −4 < −2x ≤ 4 gives −2 ≤ x < 2. Step 2: −2, −1, 0, 1: four integers.'
    mistakes:
      '5': c11m5_ends
      '3': c11m5_flip
  - prompt: Which value is NOT a solution of 5 − x < 2?
    options:
    - '3'
    - '4'
    - '10'
    answer: '3'
    difficulty: 2
    hints:
    - 'Solve: x > 3.'
    - Is 3 itself allowed?
    solution: 'Step 1: x > 3. Step 2: 3 is not greater than 3.'
    mistakes:
      '4': c11m5_ends
      '10': c11m5_ends
  - prompt: 'On a number line, x > −1 is shown by:'
    options:
    - an open circle at −1, shaded right
    - a filled circle at −1, shaded right
    - an open circle at −1, shaded left
    answer: an open circle at −1, shaded right
    difficulty: 1
    hints:
    - Is −1 included?
    - Greater means to the right.
    solution: 'Step 1: strict, so open circle. Step 2: shade right.'
    mistakes:
      a filled circle at −1, shaded right: c11m5_ends
      an open circle at −1, shaded left: c11m5_ends
  - prompt: Solve 3(x − 2) ≤ 5x + 4.
    options:
    - x ≥ −5
    - x ≤ −5
    - x ≥ 5
    answer: x ≥ −5
    difficulty: 3
    hints:
    - Expand and gather x terms on one side.
    - Watch for division by a negative.
    solution: 'Step 1: 3x − 6 ≤ 5x + 4 gives −2x ≤ 10. Step 2: x ≥ −5.'
    mistakes:
      x ≤ −5: c11m5_flip
      x ≥ 5: c11m5_flip
  - prompt: Marks of 62 and 70 so far. What is the least mark in the third test for an average of at least 65?
    answer: '63'
    check: 195-132
    difficulty: 2
    hints:
    - Average ≥ 65 means total ≥ 3 × 65.
    - Subtract the marks you have.
    solution: 'Step 1: 62 + 70 + x ≥ 195. Step 2: x ≥ 63.'
    mistakes:
      '65': c11m5_words
      '64': c11m5_ends
  - prompt: 'Assertion (A): If −2x > 8, then x > −4.

      Reason (R): Dividing both sides of an inequality by a negative number reverses the sign.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Dividing by −2 must reverse the sign, giving x < −4, so A is false. R is the correct rule.
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: Solve (x − 2)/3 ≥ (x + 1)/4. What is the least value x can take?
    options:
    - '11'
    - −11
    - '5'
    answer: '11'
    hints:
    - Multiply both sides by 12, a positive number.
    - 4(x − 2) ≥ 3(x + 1).
    solution: 4x − 8 ≥ 3x + 3, so x ≥ 11. The least value is 11.
    mistakes:
      −11: c11m5_flip
      '5': m11_convert_ineq
    exam: short
    difficulty: 2
  - prompt: Which number line shows x ≥ −2?
    options:
    - A filled dot at −2, shaded to the right
    - An open dot at −2, shaded to the right
    - A filled dot at −2, shaded to the left
    answer: A filled dot at −2, shaded to the right
    hints:
    - Is −2 itself included?
    - Greater than means which direction?
    solution: ≥ includes −2 (filled dot) and greater means to the right.
    mistakes:
      An open dot at −2, shaded to the right: m11_strict
      A filled dot at −2, shaded to the left: m11_number_line
    exam: one_mark
    difficulty: 2
- code: cbse11m.ineq.applications
  title: Inequalities in real problems
  after:
  - cbse11m.ineq.one
  notes: |
    Many problems lead to linear inequalities: budgets (cost ≤ money), temperatures (convert using C = 5(F − 32)/9),
    solutions mixing (percentages between limits), consecutive integers with conditions, sides of triangles. Translate
    'at least' as ≥, 'at most' as ≤, 'more than' as >, 'less than' as <. Check that the answer makes sense (e.g. whole
    numbers of objects).
  explanations:
    text: 'Inequalities describe limits in everyday life: spending at most ₹500, scoring at least 40, keeping a temperature between two values. Translate the words into symbols, solve, and check the answer makes sense.'
    visual: 'Draw a ''words to symbols'' table: at least → ≥, at most → ≤, more than → >, less than → <, between → two inequalities.'
    step_by_step: 'Step 1: Pick a letter for the unknown. Step 2: Translate the words into an inequality. Step 3: Solve. Step 4: Interpret: whole numbers? positive?'
    real_world: A shopkeeper with ₹1,000 buying pens at ₹35 each can buy at most 28 pens, since 35p ≤ 1000 gives p ≤ 28.57.
  picture:
    kind: compare
    columns:
    - title: Words
      points:
      - at least
      - at most
      - more than
      - less than
    - title: Symbol
      points:
      - ≥
      - ≤
      - '>'
      - <
    alt: At least means ≥, at most means ≤, more than means >, and less than means <.
  activity:
    type: formula
    prompt: A student needs an average of at least a set mark over three tests. Set the first two marks and the third.
    inputs:
    - name: a
      label: First test
      min: 0
      max: 100
      step: 5
      start: 50
    - name: b
      label: Second test
      min: 0
      max: 100
      step: 5
      start: 50
    - name: x
      label: Third test
      min: 0
      max: 100
      step: 1
      start: 0
    outputs:
    - name: avg
      label: Average of the three
      expr: (a+b+x)/3
      places: 2
    goals:
    - prompt: Ravi scored 70 and 75. Find the smallest third mark that makes his average at least 60.
      want:
        a: 70
        b: 75
        x: 35
      hint: (70 + 75 + x)/3 ≥ 60 means 70 + 75 + x ≥ 180.
      mistakes:
      - when:
          a: 70
          b: 75
          x: 60
        say: 60 is the average he needs, not the mark. His first two marks are already above 60, which helps him.
      - when:
          a: 70
          b: 75
          x:
          - 0
          - 34
        say: The average is below 60. Solve x ≥ 180 − 145.
      - when:
          a: 70
          b: 75
          x:
          - 36
          - 59
        say: That works, but it isn't the smallest. Solve x ≥ 180 − 145.
    - prompt: Meera scored 55 and 50. Find the smallest third mark for an average of at least 60.
      want:
        a: 55
        b: 50
        x: 75
      mistakes:
      - when:
          a: 55
          b: 50
          x:
          - 0
          - 74
        say: 'The average is still below 60: 55 + 50 + x must reach 180.'
      - when:
          a: 55
          b: 50
          x:
          - 76
          - 100
        say: That works, but it isn't the smallest.
    - prompt: Arun scored 85 and 75 and wants an average of MORE than 80. Find the smallest whole mark.
      want:
        a: 85
        b: 75
        x: 81
      mistakes:
      - when:
          a: 85
          b: 75
          x: 80
        say: 80 gives an average of exactly 80. 'More than' is >, which leaves 80 itself out.
      - when:
          a: 85
          b: 75
          x:
          - 0
          - 79
        say: 'The average is below 80: 85 + 75 + x must be more than 240.'
  lesson:
    - teach: Word problems become inequalities. 'At least 50' is x ≥ 50; 'at most 20' is x ≤ 20; 'more than 5' is x > 5; 'less than 8' is x < 8.
      check:
        prompt: '''You can spend at most ₹200'' is written as:'
        options:
        - s ≤ 200
        - s ≥ 200
        - s < 200
        answer: s ≤ 200
        why: At most means 200 or less.
      ways:
      - style: visual
        teach: Four everyday phrases and the inequality signs they turn into.
        picture:
          kind: compare
          columns:
          - title: Includes the number
            points:
            - at least 50 → x ≥ 50
            - at most 20 → x ≤ 20
          - title: Leaves it out
            points:
            - more than 5 → x > 5
            - less than 8 → x < 8
          alt: At least means greater than or equal, at most means less than or equal; more than and less than leave the number itself out.
      - style: real_world
        teach: 'A lift sign says ''maximum 8 people'': that is at most 8, p ≤ 8. A ride sign says ''at least 120 cm tall'': h ≥ 120. A child of exactly 120 cm may ride; with ''more than 120 cm'' they could not.'
    - teach: 'Budgets: cost of items ≤ money. If a notebook costs ₹45 and you have ₹500, then 45n ≤ 500, so n ≤ 11.1; since n is whole, at most 11 notebooks.'
      check:
        prompt: Pencils cost ₹8. You have ₹60. At most how many pencils?
        options:
        - '7'
        - '8'
        - '7.5'
        answer: '7'
        why: 8n ≤ 60 gives n ≤ 7.5; whole pencils, so 7.
      ways:
      - style: step_by_step
        teach: 'Step 1: Let n be the number of items. Step 2: Write cost ≤ money: 45n ≤ 500. Step 3: Divide: n ≤ 11.1. Step 4: n must be a whole number, so round DOWN: at most 11 notebooks.'
      - style: visual
        teach: '₹500 for notebooks at ₹45: 11 fit, the 12th does not.'
        picture:
          kind: bars
          unit: ₹
          bars:
          - label: budget
            value: 500
          - label: 11 notebooks
            value: 495
          - label: 12 notebooks
            value: 540
          alt: The budget bar is 500 rupees; 11 notebooks cost 495, just under it; 12 notebooks cost 540, over the budget.
    - teach: 'Triangle sides: each side must be less than the sum of the other two and more than their difference. With sides 4 and 7, the third side x satisfies 3 < x < 11.'
      check:
        prompt: 'Two sides are 6 and 10. The third side must be less than:'
        options:
        - '16'
        - '4'
        - '60'
        answer: '16'
        why: Any side is less than the sum of the other two.
      ways:
      - style: visual
        teach: 'Sides 4 and 7: the third side x must lie strictly between 3 and 11.'
        picture:
          kind: number_line
          from: 0
          to: 12
          points:
          - at: 3
            label: 7 − 4 = 3 (open)
          - at: 11
            label: 7 + 4 = 11 (open)
          alt: A number line with open dots at 3 and 11; the third side must lie between them.
      - style: real_world
        teach: 'Try to make a triangle with sticks of 4 cm, 7 cm and 12 cm: the two short sticks can''t even reach across the long one. With 4, 7 and 2 the short ones flop flat. Only a third stick between 3 cm and 11 cm closes the triangle.'
  items:
  - prompt: Pens cost ₹35 each. What is the greatest number you can buy with ₹1,000?
    answer: '28'
    check: floor(Rational(1000,35))
    difficulty: 1
    hints:
    - 35p ≤ 1000.
    - p ≤ 28.57.
    solution: p ≤ 28.57, so at most 28 pens.
    mistakes: {"29": "m11_whole_items", "28.5": "m11_whole_items"}
  - prompt: Two consecutive odd natural numbers are both greater than 10 and their sum is less than 40. What is the largest possible value of the smaller one?
    answer: '17'
    check: '17'
    difficulty: 2
    hints:
    - x + (x + 2) < 40.
    - x < 19, x odd.
    solution: 2x + 2 < 40 gives x < 19, so the largest odd x is 17.
    mistakes: {"19": "m11_odd_pair", "18": "m11_odd_pair"}
  - prompt: '''The temperature must be at least 20°C'' is written as:'
    options:
    - T ≥ 20
    - T ≤ 20
    - T > 20
    - T < 20
    answer: T ≥ 20
    difficulty: 1
    hints:
    - At least.
    - Greater than or equal.
    solution: At least 20 means T ≥ 20.
    mistakes: {"T ≤ 20": "m11_at_least", "T > 20": "m11_at_least", "T < 20": "m11_at_least"}
  - prompt: Celsius C = 5(F − 32)/9. If 30 < C < 35, what is the lowest whole-number Fahrenheit value F can take?
    answer: '87'
    check: '87'
    difficulty: 2
    hints:
    - F = 9C/5 + 32.
    - C > 30 gives F > 86.
    solution: 86 < F < 95, so the lowest whole number is 87.
    mistakes: {"86": "m11_convert_ineq", "95": "m11_convert_ineq"}
  - prompt: A triangle has sides 5 cm and 9 cm. The third side x must be greater than what (in cm)?
    answer: '4'
    check: 9 - 5
    difficulty: 2
    hints:
    - 'Triangle inequality: x + 5 > 9.'
    - x > 4.
    solution: x > 9 − 5 = 4.
