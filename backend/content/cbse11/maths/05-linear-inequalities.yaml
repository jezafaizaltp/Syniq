# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse11-math
chapter: 5
title: Linear Inequalities
tips:
  c11_flip: 'Multiplying or dividing an inequality by a negative number reverses the sign: −2x < 6 gives x > −3.'
concepts:
- code: cbse11m.ineq.one
  title: Solving inequalities in one variable
  notes: |
    Rules: adding or subtracting the same number keeps the sign; multiplying or dividing by a positive number keeps it;
    by a negative number reverses it. Solution set shown on a number line (open circle for <, >; filled for ≤, ≥).
    Integer and natural solutions. Double inequalities: −3 ≤ 2x + 1 < 5 → −2 ≤ x < 2. Word problems: marks needed
    for an average.
  explanations:
    text: 'Solve an inequality like an equation, with one big rule: if you multiply or divide by a negative number, flip the sign. So −2x < 6 becomes x > −3. Show the answer on a number line.'
    visual: Draw a number line. For x > −3, put an open circle at −3 and shade everything to the right. For x ≤ 2, put a filled circle at 2 and shade to the left.
    step_by_step: 'Step 1: Collect x terms on one side. Step 2: Move numbers to the other side. Step 3: Divide by the coefficient; flip the sign if it''s negative. Step 4: Draw on a number line.'
    real_world: To average at least 60 marks over three tests after scoring 52 and 58, you need x with (52 + 58 + x)/3 ≥ 60, so x ≥ 70.
  picture:
    kind: number_line
    from: -5
    to: 5
    step: 1
    points:
    - at: -3
      label: −3 (open)
    alt: 'The solution x > −3: an open circle at −3 with everything to its right shaded.'
  items:
  - prompt: Solve 3x + 4 < 19. What is the largest integer x can be?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - 3x < 15.
    - x < 5.
    solution: x < 5, so the largest integer is 4.
  - prompt: Solve −2x < 6.
    options:
    - x > −3
    - x < −3
    - x > 3
    - x < 3
    answer: x > −3
    difficulty: 1
    hints:
    - Divide by −2.
    - Flip the sign.
    solution: 'Dividing by −2 flips the sign: x > −3.'
    mistakes:
      x < −3: c11_flip
  - prompt: Solve −3 ≤ 2x + 1 < 5. How many integer solutions are there?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - −4 ≤ 2x < 4.
    - −2 ≤ x < 2.
    solution: 'x = −2, −1, 0, 1: four integers.'
  - prompt: A student scored 52 and 58 in two tests. What is the least mark needed in the third to average at least 60?
    answer: '70'
    check: 180 - 110
    difficulty: 2
    hints:
    - (52 + 58 + x)/3 ≥ 60.
    - x ≥ 180 − 110.
    solution: x ≥ 70.
  - prompt: Find the smallest natural number x with 5x − 3 > 17.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 5x > 20.
    - x > 4.
    solution: x > 4, so the smallest natural number is 5.
  - prompt: Which number line shows x ≤ 2?
    options:
    - Filled circle at 2, shaded left
    - Open circle at 2, shaded left
    - Filled circle at 2, shaded right
    - Open circle at 2, shaded right
    answer: Filled circle at 2, shaded left
    difficulty: 1
    hints:
    - ≤ includes 2.
    - Smaller numbers are on the left.
    solution: Filled circle (2 included), shaded to the left.
- code: cbse11m.ineq.applications
  title: Inequalities in real problems
  after:
  - cbse11m.ineq.one
  notes: |
    Many problems lead to linear inequalities: budgets (cost ≤ money), temperatures (convert using C = 5(F − 32)/9),
    solutions mixing (percentages between limits), consecutive integers with conditions, sides of triangles. Translate
    'at least' as ≥, 'at most' as ≤, 'more than' as >, 'less than' as <. Check that the answer makes sense (e.g. whole
    numbers of objects).
  explanations:
    text: 'Inequalities describe limits in everyday life: spending at most ₹500, scoring at least 40, keeping a temperature between two values. Translate the words into symbols, solve, and check the answer makes sense.'
    visual: 'Draw a ''words to symbols'' table: at least → ≥, at most → ≤, more than → >, less than → <, between → two inequalities.'
    step_by_step: 'Step 1: Pick a letter for the unknown. Step 2: Translate the words into an inequality. Step 3: Solve. Step 4: Interpret: whole numbers? positive?'
    real_world: A shopkeeper with ₹1,000 buying pens at ₹35 each can buy at most 28 pens, since 35p ≤ 1000 gives p ≤ 28.57.
  picture:
    kind: compare
    columns:
    - title: Words
      points:
      - at least
      - at most
      - more than
      - less than
    - title: Symbol
      points:
      - ≥
      - ≤
      - '>'
      - <
    alt: At least means ≥, at most means ≤, more than means >, and less than means <.
  items:
  - prompt: Pens cost ₹35 each. What is the greatest number you can buy with ₹1,000?
    answer: '28'
    check: floor(Rational(1000,35))
    difficulty: 1
    hints:
    - 35p ≤ 1000.
    - p ≤ 28.57.
    solution: p ≤ 28.57, so at most 28 pens.
  - prompt: Two consecutive odd natural numbers are both greater than 10 and their sum is less than 40. What is the largest possible value of the smaller one?
    answer: '17'
    check: '17'
    difficulty: 2
    hints:
    - x + (x + 2) < 40.
    - x < 19, x odd.
    solution: 2x + 2 < 40 gives x < 19, so the largest odd x is 17.
  - prompt: '''The temperature must be at least 20°C'' is written as:'
    options:
    - T ≥ 20
    - T ≤ 20
    - T > 20
    - T < 20
    answer: T ≥ 20
    difficulty: 1
    hints:
    - At least.
    - Greater than or equal.
    solution: At least 20 means T ≥ 20.
  - prompt: Celsius C = 5(F − 32)/9. If 30 < C < 35, what is the lowest whole-number Fahrenheit value F can take?
    answer: '87'
    check: '87'
    difficulty: 2
    hints:
    - F = 9C/5 + 32.
    - C > 30 gives F > 86.
    solution: 86 < F < 95, so the lowest whole number is 87.
  - prompt: A triangle has sides 5 cm and 9 cm. The third side x must be greater than what (in cm)?
    answer: '4'
    check: 9 - 5
    difficulty: 2
    hints:
    - 'Triangle inequality: x + 5 > 9.'
    - x > 4.
    solution: x > 9 − 5 = 4.
  - prompt: Ravi's three test marks are 70, 75 and x. The average must be at least 75. Which inequality is correct?
    options:
    - (70 + 75 + x)/3 ≥ 75
    - (70 + 75 + x)/3 ≤ 75
    - 70 + 75 + x ≥ 75
    - x ≥ 75
    answer: (70 + 75 + x)/3 ≥ 75
    difficulty: 1
    hints:
    - Average = total ÷ 3.
    - At least.
    solution: Average ≥ 75 gives (70 + 75 + x)/3 ≥ 75.
