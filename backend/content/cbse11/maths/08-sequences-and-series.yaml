# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse11-math
chapter: 8
title: Sequences and Series
tips:
  c11_gp_ratio: 'In a GP, divide a term by the one before it to get the common ratio r. Don''t subtract: that is for APs.'
  c11_am_gm: For positive a and b, AM = (a + b)/2 and GM = √(ab), and AM ≥ GM always.
concepts:
- code: cbse11m.seq.ap
  title: Sequences and arithmetic progressions
  notes: |
    A sequence is an ordered list a₁, a₂, ...; a series is their sum. AP: constant difference d; aₙ = a + (n − 1)d;
    Sₙ = n/2 [2a + (n − 1)d] = n/2 (a + l). Arithmetic mean of a and b: (a + b)/2. Sum of first n natural numbers:
    n(n + 1)/2. (Detailed AP work was done in Class 10; Class 11 focuses on GP and special sums.)
  explanations:
    text: 'A sequence is a list of numbers in order; a series is their sum. In an arithmetic progression (AP) you add the same difference each time: 3, 7, 11, 15. The nth term is a + (n − 1)d and the sum of n terms is n/2 × (first + last).'
    visual: 'Write 1 + 2 + ... + 100 forwards and backwards in two rows. Each column adds to 101, and there are 100 columns: twice the sum is 10,100, so the sum is 5,050.'
    step_by_step: 'Step 1: Find a (first term) and d (difference). Step 2: For the nth term, use a + (n − 1)d. Step 3: For the sum, use n/2 (2a + (n − 1)d). Step 4: Check with a small case.'
    real_world: Saving ₹100 in month 1, ₹150 in month 2, ₹200 in month 3 ... is an AP; the total saved after a year is its sum.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 1
    points:
    - at: 3
      label: '3'
    - at: 7
      label: '7'
    - at: 11
      label: '11'
    - at: 15
      label: '15'
    - at: 19
      label: '19'
    alt: The AP 3, 7, 11, 15, 19 on a number line, each jump being 4.
    jumps:
    - from: 3
      to: 7
      label: '+4'
    - from: 7
      to: 11
      label: '+4'
    - from: 11
      to: 15
      label: '+4'
    - from: 15
      to: 19
      label: '+4'
  activity:
    type: formula
    prompt: An AP starts at a and adds d each time. aₙ = a + (n − 1)d and Sₙ = n/2 × (2a + (n − 1)d).
    inputs:
    - name: a
      label: First term a
      min: -10
      max: 30
      step: 1
      start: 0
    - name: d
      label: Common difference d
      min: -5
      max: 5
      step: 1
      start: 0
    - name: n
      label: Number of terms n
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: an
      label: nth term aₙ
      expr: a+(n-1)*d
    - name: sn
      label: Sum Sₙ
      expr: n*(2*a+(n-1)*d)/2
    goals:
    - prompt: 'Insert 3 arithmetic means between 1 and 13: make 1, _, _, _, 13.'
      want:
        a: 1
        n: 5
        an: 13
      hint: 3 means plus the two ends make 5 terms, with 4 gaps.
      mistakes:
      - when:
          a: 1
          d: 4
        say: 'With d = 4 you go 1, 5, 9, 13: only 2 numbers between. 3 means make 4 gaps, so d = 12 ÷ 4.'
      - when:
          a: 1
          n: 4
          an: 13
        say: n = 4 leaves only 2 numbers between 1 and 13. 3 means plus the two ends make 5 terms.
    - prompt: How many odd numbers 1 + 3 + 5 + … add up to 225?
      want:
        a: 1
        d: 2
        sn: 225
      mistakes:
      - when:
          a: 1
          d: 2
          n:
          - 16
          - 30
        say: 'Too many terms: the sum has gone past 225.'
      - when:
          a: 1
          d: 2
          n:
          - 1
          - 14
        say: 'Not enough terms yet: the sum is below 225. Keep adding odd numbers.'
    - prompt: Start at a = 21 with d = −3. How many terms add up to 0?
      want:
        a: 21
        d: -3
        sn: 0
      mistakes:
      - when:
          a: 21
          d: -3
          an: 0
        say: 'That''s the term that equals 0 (the 8th). The sum is still positive there: the negative terms after it have to cancel the positive ones.'
  items:
  - prompt: Find the 10th term of the AP 3, 7, 11, ...
    answer: '39'
    check: 3 + 9*4
    difficulty: 1
    hints:
    - a = 3, d = 4.
    - 3 + 9 × 4.
    solution: a₁₀ = 3 + 36 = 39.
  - prompt: Find the sum 1 + 2 + 3 + ... + 100.
    answer: '5050'
    check: 100*101/2
    difficulty: 1
    hints:
    - n(n + 1)/2.
    - 100 × 101/2.
    solution: 5,050.
  - prompt: Find the sum of the first 20 terms of 2, 5, 8, ...
    answer: '610'
    check: 10*(2*2 + 19*3)
    difficulty: 2
    hints:
    - a = 2, d = 3.
    - 20/2 (4 + 57).
    solution: 10 × 61 = 610.
  - prompt: Find the arithmetic mean of 8 and 20.
    answer: '14'
    check: (8+20)/2
    difficulty: 1
    hints:
    - (a + b)/2.
    - 28/2.
    solution: '14.'
  - prompt: Which term of the AP 5, 9, 13, ... is 81?
    answer: '20'
    check: (81-5)/4 + 1
    difficulty: 2
    hints:
    - 5 + (n − 1)4 = 81.
    - n − 1 = 19.
    solution: n = 20.
  - prompt: Which is an AP?
    options:
    - 4, 9, 14, 19
    - 2, 4, 8, 16
    - 1, 4, 9, 16
    - 1, 1, 2, 3
    answer: 4, 9, 14, 19
    difficulty: 1
    hints:
    - Same difference each time.
    - '+5.'
    solution: 4, 9, 14, 19 increases by 5 each time.
- code: cbse11m.seq.gp
  title: Geometric progressions
  after:
  - cbse11m.seq.ap
  notes: |
    GP: each term = previous × r (common ratio). aₙ = arⁿ⁻¹. Sₙ = a(rⁿ − 1)/(r − 1) for r ≠ 1 (or a(1 − rⁿ)/(1 − r)).
    Infinite GP with |r| < 1: S = a/(1 − r). Geometric mean of a, b: √(ab). AM ≥ GM for positive numbers. Special sums:
    Σn = n(n + 1)/2, Σn² = n(n + 1)(2n + 1)/6, Σn³ = [n(n + 1)/2]². Example: 1 + 2 + 4 + ... + 2⁹ = 1023.
  explanations:
    text: 'In a geometric progression (GP) you multiply by the same ratio each time: 2, 6, 18, 54 (× 3). The nth term is arⁿ⁻¹ and the sum of n terms is a(rⁿ − 1)/(r − 1). If the ratio is between −1 and 1, the infinite sum settles at a/(1 − r).'
    visual: 'Fold a strip of paper in half again and again: lengths 1, 1/2, 1/4, 1/8, ... Lay the pieces end to end: they get closer and closer to 2 but never pass it.'
    step_by_step: 'Step 1: Find a and r = (any term) ÷ (previous term). Step 2: nth term arⁿ⁻¹. Step 3: Sum of n terms a(rⁿ − 1)/(r − 1). Step 4: For an infinite GP with |r| < 1, use a/(1 − r).'
    real_world: 'A population of bacteria doubling every hour grows as a GP: 1, 2, 4, 8, ... After 10 hours there are 2¹⁰ = 1,024 times as many.'
  picture:
    kind: bars
    bars:
    - label: '1'
      value: 1
    - label: '2'
      value: 2
    - label: '3'
      value: 4
    - label: '4'
      value: 8
    - label: '5'
      value: 16
    - label: '6'
      value: 32
    alt: 'A GP with ratio 2: the terms 1, 2, 4, 8, 16, 32 double each time.'
  activity:
    type: formula
    prompt: A GP multiplies by r each time. When −1 < r < 1 the terms shrink and the sum heads to S∞ = a ÷ (1 − r).
    inputs:
    - name: a
      label: First term a
      min: 1
      max: 20
      step: 1
      start: 1
    - name: r
      label: Common ratio r
      min: -0.9
      max: 0.9
      step: 0.1
      start: 0
    outputs:
    - name: t2
      label: 2nd term
      expr: a*r
      places: 3
    - name: t3
      label: 3rd term
      expr: a*r^2
      places: 3
    - name: sinf
      label: Sum to infinity
      expr: a/(1-r)
      places: 3
    goals:
    - prompt: Make 1 + ½ + ¼ + …
      want:
        a: 1
        r: 0.5
      mistakes:
      - when:
          a: 1
          r: -0.5
        say: '−0.5 makes the terms switch sign: 1 − ½ + ¼ … Each term is half the one before, so r = +0.5.'
      - when:
          a: 2
        say: a is the first term, 1.
    - prompt: First term 6, sum to infinity 10. Find r.
      want:
        a: 6
        sinf: 10
      mistakes:
      - when:
          a: 6
          r:
          - -0.9
          - -0.1
        say: A negative r makes the sum smaller than a. To grow from 6 to 10, r must be positive.
      - when:
          a: 6
          sinf:
          - 10.1
          - 60
        say: 'Too big: r is too close to 1. 10 = 6 ÷ (1 − r), so 1 − r = 0.6.'
    - prompt: Sum to infinity 15, common ratio 0.2. Find a.
      want:
        r: 0.2
        sinf: 15
      mistakes:
      - when:
          r: 0.2
          a: 15
        say: 'a = 15 gives S∞ = 15 ÷ 0.8 = 18.75. With r > 0 the sum is bigger than a: a = S∞ × (1 − r).'
  items:
  - prompt: Find the 6th term of the GP 2, 6, 18, ...
    answer: '486'
    check: 2*3**5
    difficulty: 1
    hints:
    - a = 2, r = 3.
    - 2 × 3⁵.
    solution: 2 × 243 = 486.
    mistakes:
      '30': c11_gp_ratio
  - prompt: Find 1 + 2 + 4 + ... + 2⁹.
    answer: '1023'
    check: 2**10 - 1
    difficulty: 2
    hints:
    - a = 1, r = 2, n = 10.
    - 2¹⁰ − 1.
    solution: 2¹⁰ − 1 = 1,023.
  - prompt: Find the sum to infinity of 1 + 1/2 + 1/4 + ...
    answer: '2'
    check: 1/(1-Rational(1,2))
    difficulty: 1
    hints:
    - a/(1 − r).
    - 1/(1/2).
    solution: S = 1/(1 − 1/2) = 2.
  - prompt: Find the geometric mean of 4 and 16.
    answer: '8'
    check: sqrt(4*16)
    difficulty: 1
    hints:
    - √(ab).
    - √64.
    solution: √64 = 8.
    mistakes:
      '10': c11_am_gm
  - prompt: Find 1² + 2² + ... + 10².
    answer: '385'
    check: 10*11*21/6
    difficulty: 2
    hints:
    - n(n + 1)(2n + 1)/6.
    - 10 × 11 × 21/6.
    solution: '385.'
  - prompt: Find 1³ + 2³ + ... + 5³.
    answer: '225'
    check: 15**2
    difficulty: 2
    hints:
    - '[n(n + 1)/2]².'
    - 15².
    solution: 15² = 225.
