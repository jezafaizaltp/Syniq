# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse11-math
chapter: 8
title: Sequences and Series
tips:
  c11_gp_ratio: 'In a GP, divide a term by the one before it to get the common ratio r. Don''t subtract: that is for APs.'
  c11_am_gm: For positive a and b, AM = (a + b)/2 and GM = √(ab), and AM ≥ GM always.
  m11_am: "The arithmetic mean of two numbers is their sum divided by 2."
  m11_ap_nth: "aₙ = a + (n − 1)d. The 10th term adds the difference only 9 times."
  m11_ap_sum: "Sₙ = n(first + last)/2. Pair first with last: each pair has the same sum."
  m11_ap_sum_n: "Sₙ = n/2 [2a + (n − 1)d]. Find a and d first."
  m11_gp_infinity: "S∞ = a/(1 − r) for |r| < 1."
  m11_gp_sum: "Sₙ = a(rⁿ − 1)/(r − 1). Count the terms: from 2⁰ to 2⁹ is 10 terms."
  m11_is_ap: "Subtract each term from the next. In an AP the differences are all the same."
  m11_sum_cubes: "Σk³ = [n(n + 1)/2]². Find the sum of the first n numbers, then square it."
  m11_sum_squares: "Σk² = n(n + 1)(2n + 1)/6. You are adding squares, not the numbers."
  m11_which_term: "Set a + (n − 1)d equal to 81 and solve for n."
  c11m8_d: 'Find the common difference d = a₂ − a₁ first, and count n carefully: the first term uses (n − 1) = 0.'
  c11m8_r: Find the common ratio r = a₂ ÷ a₁ first; the nth term uses r to the power n − 1.
  c11m8_sum: Write the right sum formula first, then substitute a, d or r, and n.
concepts:
- code: cbse11m.seq.ap
  title: Sequences and arithmetic progressions
  notes: |
    A sequence is an ordered list a₁, a₂, ...; a series is their sum. AP: constant difference d; aₙ = a + (n − 1)d;
    Sₙ = n/2 [2a + (n − 1)d] = n/2 (a + l). Arithmetic mean of a and b: (a + b)/2. Sum of first n natural numbers:
    n(n + 1)/2. (Detailed AP work was done in Class 10; Class 11 focuses on GP and special sums.)
  explanations:
    text: 'A sequence is a list of numbers in order; a series is their sum. In an arithmetic progression (AP) you add the same difference each time: 3, 7, 11, 15. The nth term is a + (n − 1)d and the sum of n terms is n/2 × (first + last).'
    visual: 'Write 1 + 2 + ... + 100 forwards and backwards in two rows. Each column adds to 101, and there are 100 columns: twice the sum is 10,100, so the sum is 5,050.'
    step_by_step: 'Step 1: Find a (first term) and d (difference). Step 2: For the nth term, use a + (n − 1)d. Step 3: For the sum, use n/2 (2a + (n − 1)d). Step 4: Check with a small case.'
    real_world: Saving ₹100 in month 1, ₹150 in month 2, ₹200 in month 3 ... is an AP; the total saved after a year is its sum.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 1
    points:
    - at: 3
      label: '3'
    - at: 7
      label: '7'
    - at: 11
      label: '11'
    - at: 15
      label: '15'
    - at: 19
      label: '19'
    alt: The AP 3, 7, 11, 15, 19 on a number line, each jump being 4.
    jumps:
    - from: 3
      to: 7
      label: '+4'
    - from: 7
      to: 11
      label: '+4'
    - from: 11
      to: 15
      label: '+4'
    - from: 15
      to: 19
      label: '+4'
  activity:
    type: formula
    prompt: An AP starts at a and adds d each time. aₙ = a + (n − 1)d and Sₙ = n/2 × (2a + (n − 1)d).
    inputs:
    - name: a
      label: First term a
      min: -10
      max: 30
      step: 1
      start: 0
    - name: d
      label: Common difference d
      min: -5
      max: 5
      step: 1
      start: 0
    - name: n
      label: Number of terms n
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: an
      label: nth term aₙ
      expr: a+(n-1)*d
    - name: sn
      label: Sum Sₙ
      expr: n*(2*a+(n-1)*d)/2
    goals:
    - prompt: 'Insert 3 arithmetic means between 1 and 13: make 1, _, _, _, 13.'
      want:
        a: 1
        n: 5
        an: 13
      hint: 3 means plus the two ends make 5 terms, with 4 gaps.
      mistakes:
      - when:
          a: 1
          d: 4
        say: 'With d = 4 you go 1, 5, 9, 13: only 2 numbers between. 3 means make 4 gaps, so d = 12 ÷ 4.'
      - when:
          a: 1
          n: 4
          an: 13
        say: n = 4 leaves only 2 numbers between 1 and 13. 3 means plus the two ends make 5 terms.
    - prompt: How many odd numbers 1 + 3 + 5 + … add up to 225?
      want:
        a: 1
        d: 2
        sn: 225
      mistakes:
      - when:
          a: 1
          d: 2
          n:
          - 16
          - 30
        say: 'Too many terms: the sum has gone past 225.'
      - when:
          a: 1
          d: 2
          n:
          - 1
          - 14
        say: 'Not enough terms yet: the sum is below 225. Keep adding odd numbers.'
    - prompt: Start at a = 21 with d = −3. How many terms add up to 0?
      want:
        a: 21
        d: -3
        sn: 0
      mistakes:
      - when:
          a: 21
          d: -3
          an: 0
        say: 'That''s the term that equals 0 (the 8th). The sum is still positive there: the negative terms after it have to cancel the positive ones.'
  lesson:
    - teach: 'A sequence is an ordered list a₁, a₂, a₃, ...; a series is the sum of its terms. In an arithmetic progression (AP) each term is the previous one plus a fixed d: aₙ = a + (n − 1)d.'
      check:
        prompt: Find the 5th term of 2, 6, 10, ...
        options:
        - '18'
        - '22'
        - '20'
        answer: '18'
        why: a + 4d = 2 + 16 = 18.
      ways:
      - style: visual
        teach: 'The AP 3, 7, 11, 15: every bar is 4 taller than the one before.'
        picture:
          kind: bars
          bars:
          - label: a₁
            value: 3
          - label: a₂
            value: 7
          - label: a₃
            value: 11
          - label: a₄
            value: 15
          alt: Bars of height 3, 7, 11 and 15 rise by the same step of 4 each time, the common difference.
      - style: step_by_step
        teach: 'Step 1: a = first term. Step 2: d = second term − first. Step 3: aₙ = a + (n − 1)d: from term 1 to term n you take n − 1 steps. For 3, 7, 11, …: a₁₀ = 3 + 9 × 4 = 39.'
    - teach: 'Sum of the first n terms of an AP: Sₙ = n/2 [2a + (n − 1)d] = n/2 (first + last). Gauss''s trick pairs the first and last terms.'
      picture:
        kind: flow
        steps:
        - 1 + 100 = 101
        - 2 + 99 = 101
        - '... 50 pairs'
        - 50 × 101 = 5050
        alt: Pairing terms to add 1 to 100.
      check:
        prompt: Find 1 + 2 + ... + 20.
        options:
        - '210'
        - '200'
        - '420'
        answer: '210'
        why: 20 × 21/2 = 210.
      ways:
      - style: step_by_step
        teach: 'Step 1: Know the last term? Use Sₙ = n/2 (first + last). Step 2: Don''t know it? Use Sₙ = n/2 [2a + (n − 1)d]. Example: 2, 5, 8, … 20 terms: 10 × (4 + 57) = 610.'
      - style: real_world
        teach: 'Saving ₹10 the first week, ₹20 the second, ₹30 the third and so on: after 10 weeks pair week 1 with week 10, week 2 with week 9 … each pair is ₹110 and there are 5 pairs, so ₹550.'
    - teach: The arithmetic mean of a and b is (a + b)/2. Inserting n means between a and b makes an AP of n + 2 terms.
      check:
        prompt: Arithmetic mean of 7 and 19?
        options:
        - '13'
        - '12'
        - '26'
        answer: '13'
        why: (7 + 19)/2 = 13.
      ways:
      - style: visual
        teach: Inserting 3 arithmetic means between 2 and 14 makes an AP of 5 terms.
        picture:
          kind: number_line
          from: 0
          to: 16
          points:
          - at: 2
            label: '2'
          - at: 5
            label: A₁ = 5
          - at: 8
            label: A₂ = 8
          - at: 11
            label: A₃ = 11
          - at: 14
            label: '14'
          alt: Between 2 and 14 the points 5, 8 and 11 are equally spaced 3 apart, making an AP of five terms.
      - style: step_by_step
        teach: 'Step 1: With n means there are n + 2 terms. Step 2: Last = a + (n + 1)d, so d = (b − a)/(n + 1). Step 3: Add d again and again. Between 2 and 14 with 3 means: d = 12/4 = 3, giving 5, 8, 11.'
  items:
  - prompt: Find the 10th term of the AP 3, 7, 11, ...
    answer: '39'
    check: 3 + 9*4
    difficulty: 1
    hints:
    - a = 3, d = 4.
    - 3 + 9 × 4.
    solution: a₁₀ = 3 + 36 = 39.
    mistakes: {"43": "m11_ap_nth", "40": "m11_ap_nth"}
  - prompt: Find the sum 1 + 2 + 3 + ... + 100.
    answer: '5050'
    check: 100*101/2
    difficulty: 1
    hints:
    - n(n + 1)/2.
    - 100 × 101/2.
    solution: 5,050.
    mistakes: {"5000": "m11_ap_sum", "10100": "m11_ap_sum"}
  - prompt: Find the sum of the first 20 terms of 2, 5, 8, ...
    answer: '610'
    check: 10*(2*2 + 19*3)
    difficulty: 2
    hints:
    - a = 2, d = 3.
    - 20/2 (4 + 57).
    solution: 10 × 61 = 610.
    mistakes: {"1220": "m11_ap_sum_n", "59": "m11_ap_sum_n"}
  - prompt: Find the arithmetic mean of 8 and 20.
    answer: '14'
    check: (8+20)/2
    difficulty: 1
    hints:
    - (a + b)/2.
    - 28/2.
    solution: '14.'
    mistakes: {"28": "m11_am", "12": "m11_am"}
  - prompt: Which term of the AP 5, 9, 13, ... is 81?
    answer: '20'
    check: (81-5)/4 + 1
    difficulty: 2
    hints:
    - 5 + (n − 1)4 = 81.
    - n − 1 = 19.
    solution: n = 20.
    mistakes: {"19": "m11_which_term", "21": "m11_which_term"}
  - prompt: Which is an AP?
    options:
    - 4, 9, 14, 19
    - 2, 4, 8, 16
    - 1, 4, 9, 16
    - 1, 1, 2, 3
    answer: 4, 9, 14, 19
    difficulty: 1
    hints:
    - Same difference each time.
    - '+5.'
    solution: 4, 9, 14, 19 increases by 5 each time.
    mistakes: {"2, 4, 8, 16": "m11_is_ap", "1, 4, 9, 16": "m11_is_ap", "1, 1, 2, 3": "m11_is_ap"}
  - prompt: Find the 15th term of the AP 10, 7, 4, ...
    answer: '-32'
    check: 10+14*(-3)
    difficulty: 2
    hints:
    - Here d is negative.
    - Use a + 14d.
    solution: 'Step 1: d = −3. Step 2: 10 − 42 = −32.'
    mistakes:
      '52': c11m8_d
      '-35': c11m8_d
  - prompt: Find the sum of the first 10 odd numbers.
    answer: '100'
    check: 10**2
    difficulty: 1
    hints:
    - 1 + 3 + 5 + ... ten terms.
    - First 1, last 19.
    solution: 'Step 1: S = 10/2 × (1 + 19). Step 2: 100.'
    mistakes:
      '110': c11m8_sum
      '55': c11m8_sum
  - prompt: How many terms of 3, 6, 9, ... make a sum of 165?
    answer: '10'
    check: '10'
    difficulty: 3
    hints:
    - Sₙ = 3n(n + 1)/2.
    - Solve n(n + 1) = 110.
    solution: 'Step 1: 3n(n + 1)/2 = 165 gives n(n + 1) = 110. Step 2: n = 10.'
    mistakes:
      '11': c11m8_sum
      '55': c11m8_sum
  - prompt: The 3rd term of an AP is 12 and the 7th is 24. Find d.
    answer: '3'
    check: (24-12)/4
    difficulty: 2
    hints:
    - From term 3 to term 7 is 4 steps of d.
    - Divide the difference by 4.
    solution: 'Step 1: 4d = 12. Step 2: d = 3.'
    mistakes:
      '12': c11m8_d
      '4': c11m8_d
  - prompt: Insert 3 arithmetic means between 2 and 18. What is the middle one?
    answer: '10'
    check: (2+18)/2
    difficulty: 2
    hints:
    - The AP has 5 terms from 2 to 18.
    - Find d, or use symmetry.
    solution: 'Step 1: 2, 6, 10, 14, 18 (d = 4). Step 2: middle mean 10.'
    mistakes:
      '8': c11m8_d
      '6': c11m8_d
  - prompt: Is 1, 4, 9, 16, ... an AP?
    options:
    - 'No'
    - Yes, d = 3
    - Yes, d = 5
    answer: 'No'
    difficulty: 1
    hints:
    - Find the differences between neighbours.
    - Are they all equal?
    solution: 'Step 1: differences 3, 5, 7. Step 2: not constant, so not an AP.'
    mistakes:
      Yes, d = 3: c11m8_d
      Yes, d = 5: c11m8_d
  - prompt: Sum of all two-digit multiples of 5?
    answer: '945'
    check: 18*(10+95)/2
    difficulty: 3
    hints:
    - They run 10, 15, ..., 95.
    - Count the terms, then use n/2 (first + last).
    solution: 'Step 1: 18 terms. Step 2: 18/2 × (10 + 95) = 945.'
    mistakes:
      '1050': c11m8_sum
      '900': c11m8_sum
  - prompt: Which term of 100, 96, 92, ... is 0?
    answer: '26'
    check: '26'
    difficulty: 2
    hints:
    - Set 100 + (n − 1)(−4) = 0.
    - Solve for n.
    solution: 'Step 1: (n − 1) × 4 = 100. Step 2: n = 26.'
    mistakes:
      '25': c11m8_d
      '24': c11m8_d
  - prompt: If 2k, k + 10 and 3k + 2 are in AP, find k.
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - Middle term = mean of the outer two.
    - 2(k + 10) = 2k + 3k + 2.
    solution: 'Step 1: 2k + 20 = 5k + 2. Step 2: k = 6.'
    mistakes:
      '18': c11m8_d
      '4': c11m8_d
  - prompt: 'Assertion (A): The sum of the first 100 natural numbers is 5050.

      Reason (R): Sₙ = n(n + 1)/2 for the first n natural numbers.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true: 100 × 101/2 = 5050, using R, so R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: An auditorium has 20 seats in the first row, and each row has 2 more seats than the row in front. There are 30 rows. How many seats are there in all?'
    options:
    - '1470'
    - '78'
    - '1500'
    answer: '1470'
    hints:
    - a = 20, d = 2, n = 30.
    - Sₙ = n/2 [2a + (n − 1)d].
    solution: S₃₀ = 15 × (40 + 58) = 15 × 98 = 1470.
    mistakes:
      '78': m11_ap_nth
      '1500': m11_ap_sum
    exam: case
    difficulty: 2
  - prompt: Which term of the AP 5, 9, 13, … is 81?
    options:
    - 20th
    - 19th
    - 21st
    answer: 20th
    hints:
    - 5 + (n − 1) × 4 = 81.
    - Solve for n.
    solution: (n − 1) × 4 = 76 → n − 1 = 19 → n = 20.
    mistakes:
      19th: m11_which_term
      21st: c11m8_d
    exam: short
    difficulty: 2
- code: cbse11m.seq.gp
  title: Geometric progressions
  after:
  - cbse11m.seq.ap
  notes: |
    GP: each term = previous × r (common ratio). aₙ = arⁿ⁻¹. Sₙ = a(rⁿ − 1)/(r − 1) for r ≠ 1 (or a(1 − rⁿ)/(1 − r)).
    Infinite GP with |r| < 1: S = a/(1 − r). Geometric mean of a, b: √(ab). AM ≥ GM for positive numbers. Special sums:
    Σn = n(n + 1)/2, Σn² = n(n + 1)(2n + 1)/6, Σn³ = [n(n + 1)/2]². Example: 1 + 2 + 4 + ... + 2⁹ = 1023.
  explanations:
    text: 'In a geometric progression (GP) you multiply by the same ratio each time: 2, 6, 18, 54 (× 3). The nth term is arⁿ⁻¹ and the sum of n terms is a(rⁿ − 1)/(r − 1). If the ratio is between −1 and 1, the infinite sum settles at a/(1 − r).'
    visual: 'Fold a strip of paper in half again and again: lengths 1, 1/2, 1/4, 1/8, ... Lay the pieces end to end: they get closer and closer to 2 but never pass it.'
    step_by_step: 'Step 1: Find a and r = (any term) ÷ (previous term). Step 2: nth term arⁿ⁻¹. Step 3: Sum of n terms a(rⁿ − 1)/(r − 1). Step 4: For an infinite GP with |r| < 1, use a/(1 − r).'
    real_world: 'A population of bacteria doubling every hour grows as a GP: 1, 2, 4, 8, ... After 10 hours there are 2¹⁰ = 1,024 times as many.'
  picture:
    kind: bars
    bars:
    - label: '1'
      value: 1
    - label: '2'
      value: 2
    - label: '3'
      value: 4
    - label: '4'
      value: 8
    - label: '5'
      value: 16
    - label: '6'
      value: 32
    alt: 'A GP with ratio 2: the terms 1, 2, 4, 8, 16, 32 double each time.'
  activity:
    type: formula
    prompt: A GP multiplies by r each time. When −1 < r < 1 the terms shrink and the sum heads to S∞ = a ÷ (1 − r).
    inputs:
    - name: a
      label: First term a
      min: 1
      max: 20
      step: 1
      start: 1
    - name: r
      label: Common ratio r
      min: -0.9
      max: 0.9
      step: 0.1
      start: 0
    outputs:
    - name: t2
      label: 2nd term
      expr: a*r
      places: 3
    - name: t3
      label: 3rd term
      expr: a*r^2
      places: 3
    - name: sinf
      label: Sum to infinity
      expr: a/(1-r)
      places: 3
    goals:
    - prompt: Make 1 + ½ + ¼ + …
      want:
        a: 1
        r: 0.5
      mistakes:
      - when:
          a: 1
          r: -0.5
        say: '−0.5 makes the terms switch sign: 1 − ½ + ¼ … Each term is half the one before, so r = +0.5.'
      - when:
          a: 2
        say: a is the first term, 1.
    - prompt: First term 6, sum to infinity 10. Find r.
      want:
        a: 6
        sinf: 10
      mistakes:
      - when:
          a: 6
          r:
          - -0.9
          - -0.1
        say: A negative r makes the sum smaller than a. To grow from 6 to 10, r must be positive.
      - when:
          a: 6
          sinf:
          - 10.1
          - 60
        say: 'Too big: r is too close to 1. 10 = 6 ÷ (1 − r), so 1 − r = 0.6.'
    - prompt: Sum to infinity 15, common ratio 0.2. Find a.
      want:
        r: 0.2
        sinf: 15
      mistakes:
      - when:
          r: 0.2
          a: 15
        say: 'a = 15 gives S∞ = 15 ÷ 0.8 = 18.75. With r > 0 the sum is bigger than a: a = S∞ × (1 − r).'
  lesson:
    - teach: 'In a geometric progression (GP) each term is the previous one times a fixed ratio r: aₙ = arⁿ⁻¹. Example: 3, 6, 12, 24 has r = 2.'
      check:
        prompt: Common ratio of 81, 27, 9, ...?
        options:
        - 1/3
        - '3'
        - −54
        answer: 1/3
        why: 27/81 = 1/3.
      ways:
      - style: visual
        teach: 'The GP 3, 6, 12, 24: each bar doubles the one before.'
        picture:
          kind: bars
          bars:
          - label: a₁
            value: 3
          - label: a₂
            value: 6
          - label: a₃
            value: 12
          - label: a₄
            value: 24
          alt: 'Bars of height 3, 6, 12 and 24 each double the previous bar: the common ratio is 2.'
      - style: real_world
        teach: 'A rumour told to 2 new people each hour, a bacteria colony doubling every 20 minutes, money growing at a fixed rate every year: each step multiplies by the same number. Adding the same amount is an AP; multiplying is a GP.'
    - teach: 'Sum of n terms of a GP: Sₙ = a(rⁿ − 1)/(r − 1) for r ≠ 1. If |r| < 1 the infinite sum exists: S∞ = a/(1 − r).'
      picture:
        kind: bars
        unit: partial sum
        bars:
        - label: S1
          value: 1
        - label: S2
          value: 1.5
        - label: S3
          value: 1.75
        - label: S4
          value: 1.875
        alt: Partial sums of 1 + 1/2 + 1/4 + ... creep towards 2.
      check:
        prompt: Sum to infinity of 3 + 1 + 1/3 + ...?
        options:
        - 9/2
        - '4'
        - '6'
        answer: 9/2
        why: a/(1 − r) = 3/(2/3) = 9/2.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find a and r. Step 2: If r > 1 use Sₙ = a(rⁿ − 1)/(r − 1). Step 3: If |r| < 1 and the sum goes on forever, use S∞ = a/(1 − r). Example: 1 + 1/2 + 1/4 + … = 1/(1 − 1/2) = 2.'
      - style: real_world
        teach: 'Walk half the way to a wall, then half of what is left, then half again. You cover 1/2 + 1/4 + 1/8 + … of the distance and get ever closer to the wall but never pass it: the infinite sum is exactly 1.'
    - teach: 'The geometric mean of a and b is √(ab), and for positive numbers AM ≥ GM. Special sums: Σn = n(n+1)/2, Σn² = n(n+1)(2n+1)/6, Σn³ = [n(n+1)/2]².'
      check:
        prompt: Geometric mean of 2 and 18?
        options:
        - '6'
        - '10'
        - '36'
        answer: '6'
        why: √(36) = 6.
      ways:
      - style: visual
        teach: 'For 4 and 16: the arithmetic mean is 10, the geometric mean is 8.'
        picture:
          kind: number_line
          from: 0
          to: 18
          points:
          - at: 4
            label: '4'
          - at: 8
            label: GM = 8
          - at: 10
            label: AM = 10
          - at: 16
            label: '16'
          alt: Between 4 and 16 the geometric mean 8 lies to the left of the arithmetic mean 10, showing AM is at least GM.
      - style: step_by_step
        teach: 'Step 1: AM of a and b = (a + b)/2. Step 2: GM = √(ab). Step 3: For positive a, b, AM ≥ GM, with equality only when a = b. Step 4: For Σn³, square Σn: 1³ + 2³ + 3³ = (1 + 2 + 3)² = 36.'
  items:
  - prompt: Find the 6th term of the GP 2, 6, 18, ...
    answer: '486'
    check: 2*3**5
    difficulty: 1
    hints:
    - a = 2, r = 3.
    - 2 × 3⁵.
    solution: 2 × 243 = 486.
