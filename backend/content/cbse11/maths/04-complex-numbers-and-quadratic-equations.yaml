# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse11-math
chapter: 4
title: Complex Numbers and Quadratic Equations
tips:
  c11_i_powers: 'Powers of i repeat every 4: i, −1, −i, 1. Divide the power by 4 and use the remainder.'
  c11_modulus: '|a + ib| = √(a² + b²). Square both parts, add, then take the square root.'
  m11_complex_mult: "Expand fully and remember i² = −1. Collect the terms without i."
  m11_conj_product: "(a + bi)(a − bi) = a² + b², because −(bi)² becomes +b²."
  m11_conj_roots: "Complex roots of a real quadratic come in conjugate pairs: same real part, opposite imaginary part."
  m11_conjugate: "The conjugate keeps the real part and flips only the sign of the imaginary part."
  m11_discriminant: "D = b² − 4ac. Write a, b and c first, then substitute carefully with signs."
  m11_quadratic_formula: "x = (−b ± √D)/2a. Find √D using i, then divide every term by 2a."
  m11_rationalise: "Multiply top and bottom by the conjugate 1 − i. The bottom becomes a real number."
  m11_root_product: "Product of roots = c/a."
  m11_root_sum: "Sum of roots = −b/a. Watch the sign of b."
  m11_sqrt_negative: "x² = −9. The square root of a negative number brings in i; √9 is 3."
  c11m4_i: Powers of i repeat every 4. Divide the power by 4 and use the remainder.
  c11m4_mult: Multiply like brackets, then replace i² by −1 and collect real and imaginary parts.
  c11m4_conj: To divide, multiply top and bottom by the conjugate of the bottom.
  c11m4_disc: Work out D = b² − 4ac carefully, then use x = (−b ± √D)/2a.
concepts:
- code: cbse11m.cx.algebra
  title: Complex numbers and their algebra
  notes: |
    i = √−1, i² = −1, i³ = −i, i⁴ = 1 (powers cycle every 4). A complex number z = a + ib: real part a, imaginary part b.
    Add/subtract parts separately; multiply using i² = −1; (a + ib)(a − ib) = a² + b². Conjugate z̄ = a − ib. Modulus
    |z| = √(a² + b²). Division: multiply numerator and denominator by the conjugate of the denominator. Argand plane:
    z as point (a, b); |z| is distance from the origin. Polar form z = r(cos θ + i sin θ).
  explanations:
    text: Complex numbers use i, where i² = −1. A complex number a + ib has a real part a and an imaginary part b. Add parts separately; when multiplying, replace i² with −1. The modulus |a + ib| = √(a² + b²) is its distance from 0 on the Argand plane.
    visual: 'Draw axes: real numbers along the horizontal, imaginary along the vertical. Plot 3 + 4i at (3, 4). The line from the origin to it has length 5: that is |3 + 4i|.'
    step_by_step: 'Step 1: Write numbers as a + ib. Step 2: Add or multiply, treating i like a letter. Step 3: Replace i² with −1. Step 4: For division, multiply top and bottom by the conjugate.'
    real_world: Electrical engineers use complex numbers to describe alternating current, where voltage and current are out of step.
  picture:
    kind: geometry
    points:
      O:
      - 1
      - 1
      Z:
      - 7
      - 9
      _A:
      - 7
      - 1
    segments:
    - - O
      - Z
      - '|z| = 5'
    - - O
      - _A
      - '3'
    - - _A
      - Z
      - '4'
    alt: On the Argand plane, z = 3 + 4i is the point (3, 4) and its distance from the origin is 5.
  activity:
    type: formula
    prompt: Multiply (a + ib)(c + id). Remember i² = −1, so the product is (ac − bd) + i(ad + bc).
    inputs:
    - name: a
      label: a, real part of the first
      min: -5
      max: 5
      step: 1
      start: 0
    - name: b
      label: b, i part of the first
      min: -5
      max: 5
      step: 1
      start: 0
    - name: c
      label: c, real part of the second
      min: -5
      max: 5
      step: 1
      start: 0
    - name: d
      label: d, i part of the second
      min: -5
      max: 5
      step: 1
      start: 0
    outputs:
    - name: re
      label: Real part ac − bd
      expr: a*c-b*d
    - name: im
      label: i part ad + bc
      expr: a*d+b*c
    goals:
    - prompt: Make the first number 3 + 4i. Choose c + id so the product is a positive real number.
      want:
        a: 3
        b: 4
        im: 0
        re:
        - 1
        - 100
      hint: Which number cancels the i part of 3 + 4i?
      mistakes:
      - when:
          a: 3
          b: 4
          c: 3
          d: 4
        say: '(3 + 4i)(3 + 4i) = 9 + 24i + 16i² = −7 + 24i. To cancel the i parts, flip the sign of the i part only: the conjugate.'
      - when:
          a: 3
          b: 4
          re:
          - -100
          - -1
          im: 0
        say: 'That''s real but negative: you flipped the real part too. The conjugate keeps the real part and flips only the i part.'
    - prompt: Keep a = c = 0, so both numbers are pure i numbers. Make the product −4.
      want:
        a: 0
        c: 0
        re: -4
        im: 0
      mistakes:
      - when:
          a: 0
          c: 0
          re: 4
        say: bi × di = bd·i², and i² = −1, so the product is −bd. To get −4, bd must be +4.
    - prompt: Make the first number 1 + i. Choose c + id so the product is 2i.
      want:
        a: 1
        b: 1
        re: 0
        im: 2
      mistakes:
      - when:
          a: 1
          b: 1
          re: 2
          im: 0
        say: 'That''s 2, a real number: (1 + i)(1 − i) = 1 − i² = 2. To leave only an i part, the real part c − d must be 0.'
  lesson:
    - teach: 'i is a number with i² = −1. Its powers cycle: i, −1, −i, 1, then repeat. A complex number z = a + ib has real part a and imaginary part b.'
      picture:
        kind: flow
        steps:
        - i¹ = i
        - i² = −1
        - i³ = −i
        - i⁴ = 1
        - repeat
        alt: Powers of i cycle every four.
      check:
        prompt: What is i⁷?
        options:
        - −i
        - i
        - −1
        answer: −i
        why: 7 leaves remainder 3 on division by 4, and i³ = −i.
    - teach: Add and subtract real and imaginary parts separately. Multiply like brackets and use i² = −1. The conjugate of a + ib is a − ib, and (a + ib)(a − ib) = a² + b², a real number.
      check:
        prompt: Find (2 + i)(2 − i).
        options:
        - '5'
        - '3'
        - 4 − i
        answer: '5'
        why: a² + b² = 4 + 1 = 5.
    - teach: On the Argand plane z = a + ib is the point (a, b). Its modulus |z| = √(a² + b²) is its distance from the origin. To divide, multiply top and bottom by the conjugate of the bottom.
      check:
        prompt: Find |6 − 8i|.
        options:
        - '10'
        - '14'
        - '2'
        answer: '10'
        why: √(36 + 64) = √100 = 10.
  items:
  - prompt: Find the modulus of 3 + 4i.
    answer: '5'
    check: sqrt(3**2 + 4**2)
    difficulty: 1
    hints:
    - √(3² + 4²).
    - √25.
    solution: '|3 + 4i| = 5.'
    mistakes:
      '7': c11_modulus
  - prompt: What is i¹⁰?
    options:
    - −1
    - '1'
    - i
    - −i
    answer: −1
    difficulty: 1
    hints:
    - 10 = 4 × 2 + 2.
    - i² = −1.
    solution: i¹⁰ = i² = −1.
    mistakes:
      '1': c11_i_powers
  - prompt: Find the real part of (2 + 3i)(1 − i).
    answer: '5'
    check: re((2+3*I)*(1-I))
    difficulty: 2
    hints:
    - 'Expand: 2 − 2i + 3i − 3i².'
    - −3i² = +3.
    solution: (2 + 3i)(1 − i) = 5 + i; real part 5.
    mistakes: {"2": "m11_complex_mult", "-1": "m11_complex_mult"}
  - prompt: Find (1 + 2i)(1 − 2i).
    answer: '5'
    check: expand((1+2*I)*(1-2*I))
    difficulty: 1
    hints:
    - (a + ib)(a − ib) = a² + b².
    - 1 + 4.
    solution: 1 + 4 = 5.
    mistakes: {"-3": "m11_conj_product", "1": "m11_conj_product"}
  - prompt: What is the conjugate of 5 − 7i?
    options:
    - 5 + 7i
    - −5 + 7i
    - −5 − 7i
    - 7 − 5i
    answer: 5 + 7i
    difficulty: 1
    hints:
    - Change the sign of the imaginary part.
    - Keep the real part.
    solution: The conjugate is 5 + 7i.
    mistakes: {"−5 + 7i": "m11_conjugate", "−5 − 7i": "m11_conjugate", "7 − 5i": "m11_conjugate"}
  - prompt: Find the imaginary part of 1/(1 + i).
    answer: -1/2
    check: im(1/(1+I))
    difficulty: 2
    hints:
    - Multiply by (1 − i)/(1 − i).
    - (1 − i)/2.
    solution: 1/(1 + i) = (1 − i)/2; imaginary part −1/2.
    mistakes: {"1/2": "m11_rationalise", "-1": "m11_rationalise"}
  - prompt: What is i²³?
    options:
    - −i
    - i
    - '1'
    answer: −i
    difficulty: 1
    hints:
    - Divide 23 by 4.
    - Look up the remainder in the cycle.
    solution: 'Step 1: 23 = 4 × 5 + 3. Step 2: i³ = −i.'
    mistakes:
      i: c11m4_i
      '1': c11m4_i
  - prompt: Find the imaginary part of (3 + 2i)(1 + 4i).
    answer: '14'
    check: 3*4+2*1
    difficulty: 2
    hints:
    - Expand all four products.
    - Collect the terms with i.
    solution: 'Step 1: 3 + 12i + 2i + 8i² = −5 + 14i. Step 2: imaginary part 14.'
    mistakes:
      '8': c11m4_mult
      '11': c11m4_mult
  - prompt: Find the real part of (3 + 2i)(1 + 4i).
    answer: '-5'
    check: 3-8
    difficulty: 2
    hints:
    - Expand, then use i² = −1.
    - The 8i² term becomes real.
    solution: 'Step 1: 3 + 14i + 8(−1). Step 2: real part −5.'
    mistakes:
      '11': c11m4_mult
      '3': c11m4_mult
  - prompt: Find |1 + i|.
    options:
    - √2
    - '2'
    - '1'
    answer: √2
    difficulty: 1
    hints:
    - Use √(a² + b²).
    - a = 1, b = 1.
    solution: 'Step 1: √(1 + 1). Step 2: √2.'
    mistakes:
      '2': c11m4_mult
      '1': c11m4_mult
  - prompt: Express (1 + i)/(1 − i) in the form a + ib.
    options:
    - i
    - '1'
    - −i
    answer: i
    difficulty: 3
    hints:
    - Multiply top and bottom by 1 + i.
    - The bottom becomes 1 + 1.
    solution: 'Step 1: (1 + i)²/2 = (1 + 2i − 1)/2. Step 2: = i.'
    mistakes:
      '1': c11m4_conj
      −i: c11m4_conj
  - prompt: If z = 4 − 3i, find z + z̄.
    answer: '8'
    check: 4+4
    difficulty: 1
    hints:
    - Write the conjugate first.
    - The imaginary parts cancel.
    solution: 'Step 1: z̄ = 4 + 3i. Step 2: z + z̄ = 8.'
    mistakes:
      '-6': c11m4_conj
      '0': c11m4_conj
  - prompt: Find (1 + i)².
    options:
    - 2i
    - '2'
    - 1 + i²
    answer: 2i
    difficulty: 2
    hints:
    - Expand (a + b)².
    - Use i² = −1.
    solution: 'Step 1: 1 + 2i + i². Step 2: 1 + 2i − 1 = 2i.'
    mistakes:
      '2': c11m4_mult
      1 + i²: c11m4_mult
  - prompt: Which point represents −2 + 5i on the Argand plane?
    options:
    - (−2, 5)
    - (5, −2)
    - (2, −5)
    answer: (−2, 5)
    difficulty: 2
    hints:
    - Real part on the x-axis.
    - Imaginary part on the y-axis.
    solution: 'Step 1: a = −2, b = 5. Step 2: point (−2, 5).'
    mistakes:
      (5, −2): c11m4_conj
      (2, −5): c11m4_conj
  - prompt: Find i + i² + i³ + i⁴.
    answer: '0'
    check: '0'
    difficulty: 3
    hints:
    - Write each power using the cycle.
    - Add them up.
    solution: 'Step 1: i − 1 − i + 1. Step 2: 0.'
    mistakes:
      '1': c11m4_i
      '4': c11m4_i
- code: cbse11m.cx.quadratic
  title: Quadratic equations with complex roots
  after:
  - cbse11m.cx.algebra
  notes: |
    ax² + bx + c = 0, discriminant D = b² − 4ac. D > 0: two real roots; D = 0: equal real roots; D < 0: two complex
    conjugate roots x = (−b ± i√(−D))/(2a). Sum of roots = −b/a, product = c/a. Example: x² + x + 1 = 0 has
    x = (−1 ± i√3)/2. x² + 9 = 0 gives x = ±3i.
  explanations:
    text: 'Every quadratic equation has roots, even when the discriminant b² − 4ac is negative: then the roots are complex numbers that come in conjugate pairs. For x² + 9 = 0, x = ±3i.'
    visual: 'Picture the graph of y = x² + 2x + 5: it never touches the x-axis, so there are no real roots. The two complex roots, −1 ± 2i, sit on the Argand plane as mirror images.'
    step_by_step: 'Step 1: Find D = b² − 4ac. Step 2: If D < 0, write √D = i√(−D). Step 3: Use x = (−b ± √D)/(2a). Step 4: Check: sum of roots = −b/a.'
    real_world: 'Engineers designing springs and circuits look at the discriminant: complex roots mean the system wobbles (oscillates) as it settles.'
  picture:
    kind: compare
    columns:
    - title: Discriminant
      points:
      - D > 0
      - D = 0
      - D < 0
    - title: Roots
      points:
      - two real
      - two equal real
      - two complex conjugates
    alt: If the discriminant is positive there are two real roots, if zero two equal roots, and if negative two complex conjugate roots.
  activity:
    type: formula
    prompt: Roots of x² + bx + c = 0 are −b/2 ± √D/2, with D = b² − 4c. When D < 0 the ± part is an i number.
    inputs:
    - name: b
      label: b
      min: -10
      max: 10
      step: 1
      start: 0
    - name: c
      label: c
      min: -10
      max: 30
      step: 1
      start: 0
    outputs:
    - name: disc
      label: D = b² − 4c
      expr: b^2-4*c
    - name: re
      label: Centre of the roots, −b/2
      expr: -b/2
    - name: sp
      label: Spread √|D| ÷ 2
      expr: sqrt(abs(b^2-4*c))/2
      places: 3
    goals:
    - prompt: Make the roots −1 ± 2i.
      want:
        re: -1
        disc: -16
      mistakes:
      - when:
          b: -2
        say: 'With b = −2 the centre is +1: it is −b/2, so the sign flips.'
      - when:
          re: -1
          disc: 16
        say: 'D = 16 is positive: that gives the real roots −1 ± 2, which are 1 and −3. Complex roots need D below 0.'
    - prompt: Make equal roots, both 3.
      want:
        re: 3
        disc: 0
      mistakes:
      - when:
          b: 6
        say: 'b = 6 centres the roots at −3: the centre is −b/2.'
      - when:
          re: 3
          disc:
          - 1
          - 40
        say: D > 0 splits the roots apart. Equal roots need D = 0.
    - prompt: Make the roots ±3i, with no real part.
      want:
        re: 0
        disc: -36
      mistakes:
      - when:
          b: 0
          c: -9
        say: 'c = −9 gives x² = 9: real roots ±3. For ±3i, x² must be −9, so x² + 9 = 0.'
  lesson:
    - teach: 'For ax² + bx + c = 0 the discriminant D = b² − 4ac decides the roots: D > 0 two real roots, D = 0 equal roots, D < 0 two complex roots.'
      check:
        prompt: x² + 4x + 13 = 0. What kind of roots does it have?
        options:
        - two complex roots
        - two real roots
        - equal real roots
        answer: two complex roots
        why: D = 16 − 52 = −36 < 0.
    - teach: When D < 0 the roots are x = (−b ± i√(−D))/(2a). They come as a conjugate pair p ± iq when the coefficients are real.
      check:
        prompt: Solve x² + 16 = 0.
        options:
        - ±4i
        - ±4
        - ±16i
        answer: ±4i
        why: x² = −16 gives x = ±√(−16) = ±4i.
    - teach: Sum of roots = −b/a and product of roots = c/a, whether the roots are real or complex.
      check:
        prompt: Product of the roots of 3x² + x + 6 = 0?
        options:
        - '2'
        - −1/3
        - '6'
        answer: '2'
        why: c/a = 6/3 = 2.
  items:
  - prompt: Find the discriminant of x² + 2x + 5 = 0.
    answer: '-16'
    check: 2**2 - 4*1*5
    difficulty: 1
    hints:
    - b² − 4ac.
    - 4 − 20.
    solution: D = 4 − 20 = −16.
    mistakes: {"16": "m11_discriminant", "24": "m11_discriminant"}
  - prompt: 'The roots of x² + 9 = 0 are:'
    options:
    - ±3i
    - ±3
    - ±9i
    - 3 and −9
    answer: ±3i
    difficulty: 1
    hints:
    - x² = −9.
    - √−9 = 3i.
    solution: x = ±3i.
    mistakes: {"±3": "m11_sqrt_negative", "±9i": "m11_sqrt_negative", "3 and −9": "m11_sqrt_negative"}
  - prompt: 'The roots of x² + 2x + 5 = 0 are:'
    options:
    - −1 ± 2i
    - 1 ± 2i
    - −2 ± i
    - −1 ± 4i
    answer: −1 ± 2i
    difficulty: 2
    hints:
    - D = −16, √D = 4i.
    - (−2 ± 4i)/2.
    solution: x = (−2 ± 4i)/2 = −1 ± 2i.
    mistakes: {"1 ± 2i": "m11_quadratic_formula", "−2 ± i": "m11_quadratic_formula", "−1 ± 4i": "m11_quadratic_formula"}
  - prompt: Find the sum of the roots of 2x² − 3x + 7 = 0.
    answer: 3/2
    check: Rational(3,2)
    difficulty: 1
    hints:
    - Sum = −b/a.
    - 3/2.
    solution: Sum = 3/2.
    mistakes: {"-3/2": "m11_root_sum", "7/2": "m11_root_sum"}
  - prompt: Find the product of the roots of x² + x + 1 = 0.
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Product = c/a.
    - 1/1.
    solution: Product = 1.
    mistakes: {"-1": "m11_root_product"}
  - prompt: 'If one root of a real quadratic is 2 + 3i, the other is:'
    options:
    - 2 − 3i
    - −2 + 3i
    - 3 + 2i
    - −2 − 3i
    answer: 2 − 3i
    difficulty: 2
    hints:
    - Complex roots come in conjugate pairs.
    - Change the sign of i.
    solution: The other root is the conjugate, 2 − 3i.
    mistakes: {"−2 + 3i": "m11_conj_roots", "3 + 2i": "m11_conj_roots", "−2 − 3i": "m11_conj_roots"}
  - prompt: Find the discriminant of x² − 4x + 8 = 0.
    answer: '-16'
    check: 16-32
    difficulty: 1
    hints:
    - D = b² − 4ac.
    - b = −4, a = 1, c = 8.
    solution: 'Step 1: 16 − 32. Step 2: D = −16.'
    mistakes:
      '16': c11m4_disc
      '48': c11m4_disc
  - prompt: Solve x² − 4x + 8 = 0.
    options:
    - 2 ± 2i
    - −2 ± 2i
    - 4 ± 2i
    answer: 2 ± 2i
    difficulty: 2
    hints:
    - D = −16.
    - x = (4 ± 4i)/2.
    solution: 'Step 1: x = (4 ± √−16)/2. Step 2: x = 2 ± 2i.'
    mistakes:
      −2 ± 2i: c11m4_disc
      4 ± 2i: c11m4_disc
  - prompt: Sum of the roots of x² + 6x + 10 = 0?
    answer: '-6'
    check: '-6'
    difficulty: 1
    hints:
    - Use −b/a.
    - b = 6.
    solution: 'Step 1: −6/1. Step 2: −6.'
    mistakes:
      '6': c11m4_disc
      '10': c11m4_disc
  - prompt: For which k does x² + kx + 9 = 0 have equal roots (k > 0)?
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - Equal roots mean D = 0.
    - k² = 36.
    solution: 'Step 1: k² − 36 = 0. Step 2: k = 6.'
    mistakes:
      '9': c11m4_disc
      '3': c11m4_disc
  - prompt: Solve 2x² + 2x + 1 = 0.
    options:
    - (−1 ± i)/2
    - −1 ± i
    - (1 ± i)/2
    answer: (−1 ± i)/2
    difficulty: 3
    hints:
    - D = 4 − 8 = −4.
    - x = (−2 ± 2i)/4.
    solution: 'Step 1: x = (−2 ± 2i)/4. Step 2: (−1 ± i)/2.'
    mistakes:
      −1 ± i: c11m4_disc
      (1 ± i)/2: c11m4_disc
  - prompt: 'One root of a real quadratic is 1 − 4i. The other root is:'
    options:
    - 1 + 4i
    - −1 + 4i
    - 4 − i
    answer: 1 + 4i
    difficulty: 1
    hints:
    - Complex roots of real equations come in pairs.
    - Change only the sign of the imaginary part.
    solution: 'Step 1: conjugate pair. Step 2: 1 + 4i.'
    mistakes:
      −1 + 4i: c11m4_conj
      4 − i: c11m4_conj
  - prompt: Roots 3 ± i. What is their product?
    answer: '10'
    check: 9+1
    difficulty: 2
    hints:
    - (a + ib)(a − ib) = a² + b².
    - a = 3, b = 1.
    solution: 'Step 1: 9 + 1. Step 2: 10.'
    mistakes:
      '8': c11m4_conj
      '6': c11m4_conj
  - prompt: Which quadratic has roots 3 ± i?
    options:
    - x² − 6x + 10 = 0
    - x² + 6x + 10 = 0
    - x² − 6x + 8 = 0
    answer: x² − 6x + 10 = 0
    difficulty: 3
    hints:
    - Use x² − (sum)x + (product) = 0.
    - Sum 6, product 10.
    solution: 'Step 1: sum 6, product 10. Step 2: x² − 6x + 10 = 0.'
    mistakes:
      x² + 6x + 10 = 0: c11m4_disc
      x² − 6x + 8 = 0: c11m4_conj
  - prompt: Is the discriminant of x² + x + 1 = 0 positive, zero or negative?
    options:
    - negative
    - positive
    - zero
    answer: negative
    difficulty: 2
    hints:
    - Compute b² − 4ac.
    - 1 − 4.
    solution: 'Step 1: D = 1 − 4 = −3. Step 2: negative.'
    mistakes:
      positive: c11m4_disc
      zero: c11m4_disc
