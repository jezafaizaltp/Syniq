# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse11-math
chapter: 10
title: Conic Sections
tips:
  c11_ellipse_c: For an ellipse c² = a² − b²; for a hyperbola c² = a² + b². Don't mix them up.
  c11_parabola_a: In y² = 4ax, the focus is (a, 0). Compare the coefficient with 4a, then divide by 4.
  m11_circle_r: "x² + y² = r². The number on the right is r², not r."
  m11_complete_square: "Complete the square in x and y to get (x − h)² + (y − k)² = r². Then take the square root."
  m11_conic_cut: "Slice a cone straight across, like cutting an ice-cream cone level. What shape is the edge?"
  m11_directrix: "For y² = 4ax the focus is (a, 0) and the directrix is on the opposite side of the vertex."
  m11_eccentricity: "A circle has e = 0, an ellipse is between 0 and 1, a hyperbola is above 1. The parabola sits exactly on the boundary between the last two."
  m11_ellipse_c: "For an ellipse c² = a² − b² (subtract). For a hyperbola you add."
  m11_ellipse_e: "e = c/a, and for an ellipse e is less than 1."
  m11_hyperbola_c: "For a hyperbola c² = a² + b² (add)."
  m11_hyperbola_e: "e = c/a, and for a hyperbola e is greater than 1. a is under x²."
  m11_latus: "For y² = 4ax, the latus rectum is 4a. First find a."
  m11_major_axis: "The major axis is 2a, where a² is the larger denominator."
  c11m10_circle: Complete the square in x and in y, or use centre (−g, −f) and radius √(g² + f² − c).
  c11m10_para: Match the equation to y² = 4ax or x² = 4ay first, and read off a.
  c11m10_ec: For an ellipse c² = a² − b²; for a hyperbola c² = a² + b². Then e = c/a.
concepts:
- code: cbse11m.conic.circle_parabola
  title: Circles and parabolas
  notes: |
    Conic sections: curves cut from a double cone by a plane (circle, ellipse, parabola, hyperbola). Circle with centre
    (h, k), radius r: (x − h)² + (y − k)² = r²; general x² + y² + 2gx + 2fy + c = 0 has centre (−g, −f), radius
    √(g² + f² − c). Parabola: points equidistant from a focus and a directrix. y² = 4ax: focus (a, 0), directrix x = −a,
    latus rectum 4a; x² = 4ay opens upward with focus (0, a).
  explanations:
    text: 'Slicing a cone at different angles gives circles, ellipses, parabolas and hyperbolas. A circle is all points at distance r from a centre: (x − h)² + (y − k)² = r². A parabola is all points as far from a fixed point (focus) as from a fixed line (directrix); y² = 4ax has its focus at (a, 0).'
    visual: 'Picture a torch beam on a wall: pointed straight, it makes a circle; tilted, an ellipse; tilted more, a parabola. A satellite dish is a parabola that sends incoming signals to the focus.'
    step_by_step: 'Step 1: Recognise the form. Step 2: For a circle, complete the square to find centre and radius. Step 3: For a parabola, compare with y² = 4ax or x² = 4ay to find a. Step 4: Read off focus, directrix and latus rectum.'
    real_world: 'Car headlights and satellite dishes are parabolic: light from the focus goes out in parallel beams, and signals coming in meet at the focus.'
  picture:
    kind: compare
    columns:
    - title: Circle
      points:
      - (x − h)² + (y − k)² = r²
      - centre (h, k)
      - radius r
    - title: Parabola y² = 4ax
      points:
      - focus (a, 0)
      - directrix x = −a
      - latus rectum 4a
    alt: A circle (x − h)² + (y − k)² = r² has centre (h, k) and radius r; the parabola y² = 4ax has focus (a, 0), directrix x = −a and latus rectum 4a.
  activity:
    type: formula
    prompt: x² + y² + 2gx + 2fy + c = 0 is a circle with centre (−g, −f) and r² = g² + f² − c.
    inputs:
    - name: g
      label: g
      min: -6
      max: 6
      step: 1
      start: 0
    - name: f
      label: f
      min: -6
      max: 6
      step: 1
      start: 0
    - name: c
      label: c
      min: -30
      max: 30
      step: 1
      start: 0
    outputs:
    - name: h
      label: Centre x, −g
      expr: -g
    - name: k
      label: Centre y, −f
      expr: -f
    - name: rr
      label: r² = g² + f² − c
      expr: g^2+f^2-c
    - name: rad
      label: Radius r
      expr: sqrt(max(0,g^2+f^2-c))
      places: 2
    goals:
    - prompt: Make the circle with centre (2, −3) and radius 5.
      want:
        h: 2
        k: -3
        rad: 5
      mistakes:
      - when:
          g: 2
          f: -3
        say: 'The centre is (−g, −f): g = 2 puts it at x = −2. Flip both signs.'
      - when:
          h: 2
          k: -3
          c: 25
        say: c isn't r². r² = g² + f² − c, so c = 4 + 9 − 25.
      - when:
          h: 2
          k: -3
          c: -25
        say: c = −25 makes r² = 13 + 25 = 38. You need g² + f² − c = 25.
    - prompt: Make a circle centred at (3, 4) that passes through the origin.
      want:
        h: 3
        k: 4
        c: 0
      mistakes:
      - when:
          h: 3
          k: 4
          c: -25
        say: 'That gives r² = 50: too big. Put x = y = 0 into the equation: if (0, 0) is on the circle, c = 0.'
      - when:
          h: 3
          k: 4
          c: 25
        say: 'r² = 25 − 25 = 0: just a single point. Put x = y = 0 into the equation: c = 0.'
    - prompt: Keep the centre (1, 1) but make the equation describe no circle at all (r² < 0).
      want:
        h: 1
        k: 1
        rr:
        - -30
        - -1
      mistakes:
      - when:
          h: 1
          k: 1
          rr: 0
        say: r² = 0 is a single point, a 'point circle'. Push c higher so r² goes below 0.
  lesson:
    - teach: 'Conic sections are curves cut from a double cone by a plane: circle, ellipse, parabola, hyperbola. A circle with centre (h, k) and radius r is (x − h)² + (y − k)² = r².'
      check:
        prompt: Centre of (x − 2)² + (y + 5)² = 16?
        options:
        - (2, −5)
        - (−2, 5)
        - (2, 5)
        answer: (2, −5)
        why: 'Compare with (x − h)² + (y − k)²: h = 2, k = −5.'
    - teach: The general circle x² + y² + 2gx + 2fy + c = 0 has centre (−g, −f) and radius √(g² + f² − c). Completing the square gives the same result.
      check:
        prompt: Radius of x² + y² − 4x − 6y + 9 = 0?
        options:
        - '2'
        - '3'
        - '4'
        answer: '2'
        why: 'g = −2, f = −3: √(4 + 9 − 9) = 2.'
    - teach: 'A parabola is the set of points equally far from a focus and a directrix. For y² = 4ax: focus (a, 0), directrix x = −a, latus rectum 4a. For x² = 4ay: focus (0, a), opening upward.'
      picture:
        kind: compare
        columns:
        - title: y² = 4ax
          points:
          - opens right
          - focus (a, 0)
          - directrix x = −a
        - title: x² = 4ay
          points:
          - opens up
          - focus (0, a)
          - directrix y = −a
        alt: The two standard parabolas.
      check:
        prompt: Focus of x² = 8y?
        options:
        - (0, 2)
        - (2, 0)
        - (0, 8)
        answer: (0, 2)
        why: 4a = 8 gives a = 2; focus (0, a).
  items:
  - prompt: Find the radius of the circle x² + y² = 49.
    answer: '7'
    check: sqrt(49)
    difficulty: 1
    hints:
    - r² = 49.
    - √49.
    solution: r = 7.
    mistakes: {"49": "m11_circle_r", "24.5": "m11_circle_r"}
  - prompt: Find the radius of x² + y² − 6x + 8y = 0.
    answer: '5'
    check: sqrt(3**2 + 4**2)
    difficulty: 2
    hints:
    - Centre (3, −4).
    - √(9 + 16 − 0).
    solution: r = 5.
    mistakes: {"25": "m11_complete_square", "10": "m11_complete_square"}
  - prompt: For the parabola y² = 12x, find the x-coordinate of the focus.
    answer: '3'
    check: 12/4
    difficulty: 1
    hints:
    - 4a = 12.
    - a = 3.
    solution: Focus (3, 0).
    mistakes:
      '12': c11_parabola_a
  - prompt: Find the length of the latus rectum of y² = 8x.
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - 4a = 8.
    - Latus rectum = 4a.
    solution: '8.'
    mistakes: {"2": "m11_latus", "4": "m11_latus"}
  - prompt: 'The directrix of y² = 12x is:'
    options:
    - x = −3
    - x = 3
    - y = −3
    - y = 3
    answer: x = −3
    difficulty: 2
    hints:
    - a = 3.
    - x = −a.
    solution: Directrix x = −3.
    mistakes: {"x = 3": "m11_directrix", "y = −3": "m11_directrix", "y = 3": "m11_directrix"}
  - prompt: Which curve do you get when a plane cuts a cone parallel to its base?
    options:
    - Circle
    - Parabola
    - Hyperbola
    - Straight line
    answer: Circle
    difficulty: 1
    hints:
    - Horizontal slice.
    - Round.
    solution: A slice parallel to the base is a circle.
    mistakes: {"Parabola": "m11_conic_cut", "Hyperbola": "m11_conic_cut", "Straight line": "m11_conic_cut"}
  - prompt: Radius of the circle (x + 1)² + (y − 3)² = 25?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - The right side is r².
    - Take the square root.
    solution: 'Step 1: r² = 25. Step 2: r = 5.'
    mistakes:
      '25': c11m10_circle
      '3': c11m10_circle
  - prompt: Equation of the circle with centre (0, 0) and radius 6?
    options:
    - x² + y² = 36
    - x² + y² = 6
    - x + y = 6
    answer: x² + y² = 36
    difficulty: 1
    hints:
    - Use x² + y² = r².
    - Square the radius.
    solution: 'Step 1: r = 6. Step 2: x² + y² = 36.'
    mistakes:
      x² + y² = 6: c11m10_circle
      x + y = 6: c11m10_circle
  - prompt: Centre of x² + y² + 8x − 2y − 8 = 0?
    options:
    - (−4, 1)
    - (4, −1)
    - (8, −2)
    answer: (−4, 1)
    difficulty: 2
    hints:
    - 2g = 8, 2f = −2.
    - Centre is (−g, −f).
    solution: 'Step 1: g = 4, f = −1. Step 2: centre (−4, 1).'
    mistakes:
      (4, −1): c11m10_circle
      (8, −2): c11m10_circle
  - prompt: Radius of x² + y² + 8x − 2y − 8 = 0?
    answer: '5'
    check: (16+1+8)**0.5
    difficulty: 2
    hints:
    - √(g² + f² − c).
    - c = −8.
    solution: 'Step 1: √(16 + 1 + 8). Step 2: 5.'
    mistakes:
      '3': c11m10_circle
      '17': c11m10_circle
  - prompt: Latus rectum length of x² = 20y?
    answer: '20'
    check: '20'
    difficulty: 2
    hints:
    - Latus rectum = 4a.
    - 4a is the coefficient on the right.
    solution: 'Step 1: 4a = 20. Step 2: length 20.'
    mistakes:
      '5': c11m10_para
      '10': c11m10_para
  - prompt: Directrix of y² = −16x?
    options:
    - x = 4
    - x = −4
    - y = 4
    answer: x = 4
    difficulty: 3
    hints:
    - Here 4a = −16, so a = −4 and the parabola opens left.
    - Directrix x = −a.
    solution: 'Step 1: a = −4. Step 2: directrix x = 4.'
    mistakes:
      x = −4: c11m10_para
      y = 4: c11m10_para
  - prompt: Which way does y² = −8x open?
    options:
    - left
    - right
    - up
    answer: left
    difficulty: 2
    hints:
    - x must be ≤ 0 for y² to be ≥ 0.
    - So the curve lies on which side?
    solution: 'Step 1: y² ≥ 0 forces x ≤ 0. Step 2: opens left.'
    mistakes:
      right: c11m10_para
      up: c11m10_para
  - prompt: A circle has centre (3, 4) and passes through the origin. Its radius?
    answer: '5'
    check: (9+16)**0.5
    difficulty: 2
    hints:
    - Radius = distance from centre to the origin.
    - √(3² + 4²).
    solution: 'Step 1: √25. Step 2: 5.'
    mistakes:
      '7': c11m10_circle
      '25': c11m10_circle
  - prompt: A plane cuts a cone parallel to a slant side. Which conic appears?
    options:
    - parabola
    - ellipse
    - hyperbola
    answer: parabola
    difficulty: 3
    hints:
    - Tilt the plane until it is parallel to the cone's edge.
    - The curve opens and never closes, on one nappe only.
    solution: 'Step 1: parallel to a generator. Step 2: parabola.'
    mistakes:
      ellipse: c11m10_para
      hyperbola: c11m10_para
- code: cbse11m.conic.ellipse_hyperbola
  title: Ellipses and hyperbolas
  after:
  - cbse11m.conic.circle_parabola
  notes: |
    Ellipse: sum of distances from two foci is constant (2a). x²/a² + y²/b² = 1 (a > b): foci (±c, 0), c² = a² − b²;
    major axis 2a, minor axis 2b; eccentricity e = c/a < 1; latus rectum 2b²/a. Hyperbola: difference of distances is
    constant (2a). x²/a² − y²/b² = 1: foci (±c, 0), c² = a² + b², e = c/a > 1, latus rectum 2b²/a. Circle e = 0, parabola
    e = 1.
  explanations:
    text: 'An ellipse is a stretched circle: the sum of the distances from any point on it to two foci stays the same. For x²/a² + y²/b² = 1, the foci are at (±c, 0) with c² = a² − b². A hyperbola has two open branches, and its foci have c² = a² + b². Eccentricity e = c/a tells how stretched the curve is.'
    visual: 'Pin two drawing pins in paper, loop a string around them, and trace with a pencil keeping the string tight: you draw an ellipse. The pins are the foci.'
    step_by_step: 'Step 1: Compare with x²/a² ± y²/b² = 1 to get a and b. Step 2: Ellipse: c² = a² − b². Hyperbola: c² = a² + b². Step 3: Foci (±c, 0). Step 4: e = c/a.'
    real_world: Planets move in ellipses with the Sun at one focus; Earth's orbit has eccentricity about 0.017, almost a circle.
  picture:
    kind: compare
    columns:
    - title: Ellipse
      points:
      - x²/a² + y²/b² = 1
      - c² = a² − b²
      - e < 1
    - title: Hyperbola
      points:
      - x²/a² − y²/b² = 1
      - c² = a² + b²
      - e > 1
    alt: An ellipse x²/a² + y²/b² = 1 has c² = a² − b² and e < 1; a hyperbola x²/a² − y²/b² = 1 has c² = a² + b² and e > 1.
  activity:
    type: formula
    prompt: 'For x²/a² ± y²/b² = 1: an ellipse has foci at ±c with c² = a² − b²; a hyperbola has c² = a² + b². e = c ÷ a.'
    inputs:
    - name: a
      label: a
      min: 1
      max: 10
      step: 1
      start: 2
    - name: b
      label: b
      min: 1
      max: 10
      step: 1
      start: 1
    outputs:
    - name: ce
      label: Ellipse c (a > b)
      expr: sqrt(max(0,a^2-b^2))
      places: 2
    - name: e
      label: Ellipse e = c/a
      expr: sqrt(max(0,a^2-b^2))/a
      places: 3
    - name: ch
      label: Hyperbola c
      expr: sqrt(a^2+b^2)
      places: 2
    - name: eh
      label: Hyperbola e
      expr: sqrt(a^2+b^2)/a
      places: 3
    goals:
    - prompt: Make an ellipse with vertices (±5, 0) and foci (±4, 0).
      want:
        a: 5
        ce: 4
      mistakes:
      - when:
          a: 5
          b: 4
        say: b = 4 puts the foci at ±3. c² = a² − b², so b² = 25 − 16.
      - when:
          a: 4
        say: a is the vertex distance, 5. The foci sit inside the ellipse, at ±c.
    - prompt: Make a hyperbola with vertices (±3, 0) and foci (±5, 0).
      want:
        a: 3
        ch: 5
      mistakes:
      - when:
          a: 5
        say: a is the vertex distance, 3. A hyperbola's foci lie beyond its vertices.
      - when:
          a: 3
          b:
          - 1
          - 3
        say: For a hyperbola c² = a² + b², so b² = 25 − 9.
    - prompt: Make an ellipse with a = 10 and eccentricity 0.6.
      want:
        a: 10
        e: 0.6
      mistakes:
      - when:
          a: 10
          b: 6
        say: b = 6 gives c = 8 and e = 0.8. e = c/a = 0.6 means c = 6, then b² = 100 − 36.
      - when:
          a: 10
          eh:
          - 1
          - 2
        say: 'Read the ellipse row: a hyperbola''s e is always more than 1.'
  lesson:
    - teach: 'An ellipse is the set of points whose distances from two foci add to a constant 2a. For x²/a² + y²/b² = 1 (a > b): foci (±c, 0) with c² = a² − b²; major axis 2a, minor axis 2b.'
      check:
        prompt: For x²/100 + y²/36 = 1, find c.
        options:
        - '8'
        - '10'
        - '6'
        answer: '8'
        why: c² = 100 − 36 = 64.
    - teach: 'Eccentricity e = c/a measures how stretched a conic is: circle e = 0, ellipse 0 < e < 1, parabola e = 1, hyperbola e > 1. Latus rectum of the ellipse or hyperbola: 2b²/a.'
      picture:
        kind: bars
        unit: eccentricity
        bars:
        - label: circle
          value: 0
        - label: ellipse
          value: 0.6
        - label: parabola
          value: 1
        - label: hyperbola
          value: 1.5
        alt: Eccentricity grows from circle to hyperbola.
      check:
        prompt: Which conic has eccentricity 0?
        options:
        - circle
        - parabola
        - hyperbola
        answer: circle
        why: Its two foci coincide at the centre, so c = 0.
    - teach: 'A hyperbola is the set of points whose distances from two foci differ by 2a. For x²/a² − y²/b² = 1: c² = a² + b², foci (±c, 0), e = c/a > 1.'
      check:
        prompt: For x²/9 − y²/16 = 1, find c.
        options:
        - '5'
        - √7
        - '7'
        answer: '5'
        why: c² = 9 + 16 = 25.
  items:
  - prompt: For x²/25 + y²/9 = 1, find c (the distance from the centre to a focus).
    answer: '4'
    check: sqrt(25-9)
    difficulty: 1
    hints:
    - c² = 25 − 9.
    - √16.
    solution: c = 4.
    mistakes: {"34": "m11_ellipse_c", "5": "m11_ellipse_c"}
  - prompt: Find the eccentricity of x²/25 + y²/9 = 1.
    answer: 4/5
    check: Rational(4,5)
    difficulty: 2
    hints:
    - e = c/a.
    - c = 4, a = 5.
    solution: e = 4/5.
    mistakes: {"3/5": "m11_ellipse_e", "5/4": "m11_ellipse_e"}
  - prompt: Find the length of the major axis of x²/36 + y²/16 = 1.
    answer: '12'
    check: 2*6
    difficulty: 1
    hints:
    - Major axis = 2a.
    - a = 6.
    solution: 2 × 6 = 12.
    mistakes: {"6": "m11_major_axis", "36": "m11_major_axis"}
  - prompt: For x²/16 − y²/9 = 1, find c.
    answer: '5'
    check: sqrt(16+9)
    difficulty: 1
    hints:
    - 'Hyperbola: c² = a² + b².'
    - 16 + 9.
    solution: c = 5.
    mistakes: {"7": "m11_hyperbola_c"}
  - prompt: Find the eccentricity of x²/16 − y²/9 = 1.
    answer: 5/4
    check: Rational(5,4)
    difficulty: 2
    hints:
    - e = c/a.
    - 5/4.
    solution: e = 5/4.
    mistakes: {"4/5": "m11_hyperbola_e", "5/3": "m11_hyperbola_e"}
  - prompt: What is the eccentricity of a parabola?
    options:
    - '1'
    - '0'
    - Less than 1
    - More than 1
    answer: '1'
    difficulty: 2
    hints:
    - Between ellipse and hyperbola.
    - Exactly 1.
    solution: A parabola has e = 1.
    mistakes: {"0": "m11_eccentricity", "Less than 1": "m11_eccentricity", "More than 1": "m11_eccentricity"}
  - prompt: Length of the minor axis of x²/49 + y²/25 = 1?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - Minor axis is 2b.
    - b² = 25.
    solution: 'Step 1: b = 5. Step 2: 2b = 10.'
    mistakes:
      '14': c11m10_ec
      '5': c11m10_ec
  - prompt: Eccentricity of x²/100 + y²/36 = 1?
    options:
    - 4/5
    - 3/5
    - 5/4
    answer: 4/5
    difficulty: 2
    hints:
    - Find c from c² = a² − b².
    - e = c/a.
    solution: 'Step 1: c = 8, a = 10. Step 2: e = 4/5.'
    mistakes:
      3/5: c11m10_ec
      5/4: c11m10_ec
  - prompt: Eccentricity of x²/9 − y²/16 = 1?
    options:
    - 5/3
    - 4/3
    - 3/5
    answer: 5/3
    difficulty: 2
    hints:
    - c² = a² + b² for a hyperbola.
    - e = c/a.
    solution: 'Step 1: c = 5, a = 3. Step 2: e = 5/3.'
    mistakes:
      4/3: c11m10_ec
      3/5: c11m10_ec
  - prompt: Latus rectum of x²/25 + y²/16 = 1?
    options:
    - 32/5
    - 25/2
    - '8'
    answer: 32/5
    difficulty: 3
    hints:
    - Use 2b²/a.
    - a = 5, b = 4.
    solution: 'Step 1: 2 × 16/5. Step 2: 32/5.'
    mistakes:
      25/2: c11m10_ec
      '8': c11m10_ec
  - prompt: An ellipse has foci (±3, 0) and major axis 10. Find b².
    answer: '16'
    check: 25-9
    difficulty: 3
    hints:
    - Major axis 2a = 10 gives a.
    - b² = a² − c².
    solution: 'Step 1: a = 5, c = 3. Step 2: b² = 25 − 9 = 16.'
    mistakes:
      '34': c11m10_ec
      '4': c11m10_ec
  - prompt: Which equation is a hyperbola?
    options:
    - x²/4 − y²/9 = 1
    - x²/4 + y²/9 = 1
    - y² = 4x
