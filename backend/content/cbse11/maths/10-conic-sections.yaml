# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse11-math
chapter: 10
title: Conic Sections
tips:
  c11_ellipse_c: For an ellipse c² = a² − b²; for a hyperbola c² = a² + b². Don't mix them up.
  c11_parabola_a: In y² = 4ax, the focus is (a, 0). Compare the coefficient with 4a, then divide by 4.
  m11_circle_r: "x² + y² = r². The number on the right is r², not r."
  m11_complete_square: "Complete the square in x and y to get (x − h)² + (y − k)² = r². Then take the square root."
  m11_conic_cut: "Slice a cone straight across, like cutting an ice-cream cone level. What shape is the edge?"
  m11_directrix: "For y² = 4ax the focus is (a, 0) and the directrix is on the opposite side of the vertex."
  m11_eccentricity: "A circle has e = 0, an ellipse is between 0 and 1, a hyperbola is above 1. The parabola sits exactly on the boundary between the last two."
  m11_ellipse_c: "For an ellipse c² = a² − b² (subtract). For a hyperbola you add."
  m11_ellipse_e: "e = c/a, and for an ellipse e is less than 1."
  m11_hyperbola_c: "For a hyperbola c² = a² + b² (add)."
  m11_hyperbola_e: "e = c/a, and for a hyperbola e is greater than 1. a is under x²."
  m11_latus: "For y² = 4ax, the latus rectum is 4a. First find a."
  m11_major_axis: "The major axis is 2a, where a² is the larger denominator."
concepts:
- code: cbse11m.conic.circle_parabola
  title: Circles and parabolas
  notes: |
    Conic sections: curves cut from a double cone by a plane (circle, ellipse, parabola, hyperbola). Circle with centre
    (h, k), radius r: (x − h)² + (y − k)² = r²; general x² + y² + 2gx + 2fy + c = 0 has centre (−g, −f), radius
    √(g² + f² − c). Parabola: points equidistant from a focus and a directrix. y² = 4ax: focus (a, 0), directrix x = −a,
    latus rectum 4a; x² = 4ay opens upward with focus (0, a).
  explanations:
    text: 'Slicing a cone at different angles gives circles, ellipses, parabolas and hyperbolas. A circle is all points at distance r from a centre: (x − h)² + (y − k)² = r². A parabola is all points as far from a fixed point (focus) as from a fixed line (directrix); y² = 4ax has its focus at (a, 0).'
    visual: 'Picture a torch beam on a wall: pointed straight, it makes a circle; tilted, an ellipse; tilted more, a parabola. A satellite dish is a parabola that sends incoming signals to the focus.'
    step_by_step: 'Step 1: Recognise the form. Step 2: For a circle, complete the square to find centre and radius. Step 3: For a parabola, compare with y² = 4ax or x² = 4ay to find a. Step 4: Read off focus, directrix and latus rectum.'
    real_world: 'Car headlights and satellite dishes are parabolic: light from the focus goes out in parallel beams, and signals coming in meet at the focus.'
  picture:
    kind: compare
    columns:
    - title: Circle
      points:
      - (x − h)² + (y − k)² = r²
      - centre (h, k)
      - radius r
    - title: Parabola y² = 4ax
      points:
      - focus (a, 0)
      - directrix x = −a
      - latus rectum 4a
    alt: A circle (x − h)² + (y − k)² = r² has centre (h, k) and radius r; the parabola y² = 4ax has focus (a, 0), directrix x = −a and latus rectum 4a.
  activity:
    type: formula
    prompt: x² + y² + 2gx + 2fy + c = 0 is a circle with centre (−g, −f) and r² = g² + f² − c.
    inputs:
    - name: g
      label: g
      min: -6
      max: 6
      step: 1
      start: 0
    - name: f
      label: f
      min: -6
      max: 6
      step: 1
      start: 0
    - name: c
      label: c
      min: -30
      max: 30
      step: 1
      start: 0
    outputs:
    - name: h
      label: Centre x, −g
      expr: -g
    - name: k
      label: Centre y, −f
      expr: -f
    - name: rr
      label: r² = g² + f² − c
      expr: g^2+f^2-c
    - name: rad
      label: Radius r
      expr: sqrt(max(0,g^2+f^2-c))
      places: 2
    goals:
    - prompt: Make the circle with centre (2, −3) and radius 5.
      want:
        h: 2
        k: -3
        rad: 5
      mistakes:
      - when:
          g: 2
          f: -3
        say: 'The centre is (−g, −f): g = 2 puts it at x = −2. Flip both signs.'
      - when:
          h: 2
          k: -3
          c: 25
        say: c isn't r². r² = g² + f² − c, so c = 4 + 9 − 25.
      - when:
          h: 2
          k: -3
          c: -25
        say: c = −25 makes r² = 13 + 25 = 38. You need g² + f² − c = 25.
    - prompt: Make a circle centred at (3, 4) that passes through the origin.
      want:
        h: 3
        k: 4
        c: 0
      mistakes:
      - when:
          h: 3
          k: 4
          c: -25
        say: 'That gives r² = 50: too big. Put x = y = 0 into the equation: if (0, 0) is on the circle, c = 0.'
      - when:
          h: 3
          k: 4
          c: 25
        say: 'r² = 25 − 25 = 0: just a single point. Put x = y = 0 into the equation: c = 0.'
    - prompt: Keep the centre (1, 1) but make the equation describe no circle at all (r² < 0).
      want:
        h: 1
        k: 1
        rr:
        - -30
        - -1
      mistakes:
      - when:
          h: 1
          k: 1
          rr: 0
        say: r² = 0 is a single point, a 'point circle'. Push c higher so r² goes below 0.
  items:
  - prompt: Find the radius of the circle x² + y² = 49.
    answer: '7'
    check: sqrt(49)
    difficulty: 1
    hints:
    - r² = 49.
    - √49.
    solution: r = 7.
    mistakes: {"49": "m11_circle_r", "24.5": "m11_circle_r"}
  - prompt: Find the radius of x² + y² − 6x + 8y = 0.
    answer: '5'
    check: sqrt(3**2 + 4**2)
    difficulty: 2
    hints:
    - Centre (3, −4).
    - √(9 + 16 − 0).
    solution: r = 5.
    mistakes: {"25": "m11_complete_square", "10": "m11_complete_square"}
  - prompt: For the parabola y² = 12x, find the x-coordinate of the focus.
    answer: '3'
    check: 12/4
    difficulty: 1
    hints:
    - 4a = 12.
    - a = 3.
    solution: Focus (3, 0).
    mistakes:
      '12': c11_parabola_a
  - prompt: Find the length of the latus rectum of y² = 8x.
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - 4a = 8.
    - Latus rectum = 4a.
    solution: '8.'
    mistakes: {"2": "m11_latus", "4": "m11_latus"}
  - prompt: 'The directrix of y² = 12x is:'
    options:
    - x = −3
    - x = 3
    - y = −3
    - y = 3
    answer: x = −3
    difficulty: 2
    hints:
    - a = 3.
    - x = −a.
    solution: Directrix x = −3.
    mistakes: {"x = 3": "m11_directrix", "y = −3": "m11_directrix", "y = 3": "m11_directrix"}
  - prompt: Which curve do you get when a plane cuts a cone parallel to its base?
    options:
    - Circle
    - Parabola
    - Hyperbola
    - Straight line
    answer: Circle
    difficulty: 1
    hints:
    - Horizontal slice.
    - Round.
    solution: A slice parallel to the base is a circle.
    mistakes: {"Parabola": "m11_conic_cut", "Hyperbola": "m11_conic_cut", "Straight line": "m11_conic_cut"}
- code: cbse11m.conic.ellipse_hyperbola
  title: Ellipses and hyperbolas
  after:
  - cbse11m.conic.circle_parabola
  notes: |
    Ellipse: sum of distances from two foci is constant (2a). x²/a² + y²/b² = 1 (a > b): foci (±c, 0), c² = a² − b²;
    major axis 2a, minor axis 2b; eccentricity e = c/a < 1; latus rectum 2b²/a. Hyperbola: difference of distances is
    constant (2a). x²/a² − y²/b² = 1: foci (±c, 0), c² = a² + b², e = c/a > 1, latus rectum 2b²/a. Circle e = 0, parabola
    e = 1.
  explanations:
    text: 'An ellipse is a stretched circle: the sum of the distances from any point on it to two foci stays the same. For x²/a² + y²/b² = 1, the foci are at (±c, 0) with c² = a² − b². A hyperbola has two open branches, and its foci have c² = a² + b². Eccentricity e = c/a tells how stretched the curve is.'
    visual: 'Pin two drawing pins in paper, loop a string around them, and trace with a pencil keeping the string tight: you draw an ellipse. The pins are the foci.'
    step_by_step: 'Step 1: Compare with x²/a² ± y²/b² = 1 to get a and b. Step 2: Ellipse: c² = a² − b². Hyperbola: c² = a² + b². Step 3: Foci (±c, 0). Step 4: e = c/a.'
    real_world: Planets move in ellipses with the Sun at one focus; Earth's orbit has eccentricity about 0.017, almost a circle.
  picture:
    kind: compare
    columns:
    - title: Ellipse
      points:
      - x²/a² + y²/b² = 1
      - c² = a² − b²
      - e < 1
    - title: Hyperbola
      points:
      - x²/a² − y²/b² = 1
      - c² = a² + b²
      - e > 1
    alt: An ellipse x²/a² + y²/b² = 1 has c² = a² − b² and e < 1; a hyperbola x²/a² − y²/b² = 1 has c² = a² + b² and e > 1.
  activity:
    type: formula
    prompt: 'For x²/a² ± y²/b² = 1: an ellipse has foci at ±c with c² = a² − b²; a hyperbola has c² = a² + b². e = c ÷ a.'
    inputs:
    - name: a
      label: a
      min: 1
      max: 10
      step: 1
      start: 2
    - name: b
      label: b
      min: 1
      max: 10
      step: 1
      start: 1
    outputs:
    - name: ce
      label: Ellipse c (a > b)
      expr: sqrt(max(0,a^2-b^2))
      places: 2
    - name: e
      label: Ellipse e = c/a
      expr: sqrt(max(0,a^2-b^2))/a
      places: 3
    - name: ch
      label: Hyperbola c
      expr: sqrt(a^2+b^2)
      places: 2
    - name: eh
      label: Hyperbola e
      expr: sqrt(a^2+b^2)/a
      places: 3
    goals:
    - prompt: Make an ellipse with vertices (±5, 0) and foci (±4, 0).
      want:
        a: 5
        ce: 4
      mistakes:
      - when:
          a: 5
          b: 4
        say: b = 4 puts the foci at ±3. c² = a² − b², so b² = 25 − 16.
      - when:
          a: 4
        say: a is the vertex distance, 5. The foci sit inside the ellipse, at ±c.
    - prompt: Make a hyperbola with vertices (±3, 0) and foci (±5, 0).
      want:
        a: 3
        ch: 5
      mistakes:
      - when:
          a: 5
        say: a is the vertex distance, 3. A hyperbola's foci lie beyond its vertices.
      - when:
          a: 3
          b:
          - 1
          - 3
        say: For a hyperbola c² = a² + b², so b² = 25 − 9.
    - prompt: Make an ellipse with a = 10 and eccentricity 0.6.
      want:
        a: 10
        e: 0.6
      mistakes:
      - when:
          a: 10
          b: 6
        say: b = 6 gives c = 8 and e = 0.8. e = c/a = 0.6 means c = 6, then b² = 100 − 36.
      - when:
          a: 10
          eh:
          - 1
          - 2
        say: 'Read the ellipse row: a hyperbola''s e is always more than 1.'
  items:
  - prompt: For x²/25 + y²/9 = 1, find c (the distance from the centre to a focus).
    answer: '4'
    check: sqrt(25-9)
    difficulty: 1
    hints:
    - c² = 25 − 9.
    - √16.
    solution: c = 4.
    mistakes: {"34": "m11_ellipse_c", "5": "m11_ellipse_c"}
  - prompt: Find the eccentricity of x²/25 + y²/9 = 1.
    answer: 4/5
    check: Rational(4,5)
    difficulty: 2
    hints:
    - e = c/a.
    - c = 4, a = 5.
    solution: e = 4/5.
    mistakes: {"3/5": "m11_ellipse_e", "5/4": "m11_ellipse_e"}
  - prompt: Find the length of the major axis of x²/36 + y²/16 = 1.
    answer: '12'
    check: 2*6
    difficulty: 1
    hints:
    - Major axis = 2a.
    - a = 6.
    solution: 2 × 6 = 12.
    mistakes: {"6": "m11_major_axis", "36": "m11_major_axis"}
  - prompt: For x²/16 − y²/9 = 1, find c.
    answer: '5'
    check: sqrt(16+9)
    difficulty: 1
    hints:
    - 'Hyperbola: c² = a² + b².'
    - 16 + 9.
    solution: c = 5.
    mistakes: {"7": "m11_hyperbola_c"}
  - prompt: Find the eccentricity of x²/16 − y²/9 = 1.
    answer: 5/4
    check: Rational(5,4)
    difficulty: 2
    hints:
    - e = c/a.
    - 5/4.
    solution: e = 5/4.
    mistakes: {"4/5": "m11_hyperbola_e", "5/3": "m11_hyperbola_e"}
  - prompt: What is the eccentricity of a parabola?
    options:
    - '1'
    - '0'
    - Less than 1
    - More than 1
    answer: '1'
    difficulty: 2
    hints:
    - Between ellipse and hyperbola.
    - Exactly 1.
    solution: A parabola has e = 1.
    mistakes: {"0": "m11_eccentricity", "Less than 1": "m11_eccentricity", "More than 1": "m11_eccentricity"}
