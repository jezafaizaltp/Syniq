# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse11-math
chapter: 1
title: Sets
tips:
  c11_subsets: 'A set with n elements has 2ⁿ subsets, counting the empty set and the set itself. Each element is either in or out: 2 choices each.'
  c11_union_count: n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Subtract the overlap, or it is counted twice.
  m11_brackets: "A square bracket includes the end point; a round one leaves it out. Check each end separately."
  m11_complement: "A′ is what is left in U after removing A. Count U, then take away A."
  m11_de_morgan: "Draw the Venn diagram: shade everything outside both circles. Is that 'outside A and outside B', or 'outside A or outside B'?"
  m11_difference: "A − B keeps the elements of A that are not in B. Cross out the shared ones from A only."
  m11_empty_set: "An empty set has nothing in it. A set that contains 0, or contains ∅, still has a member."
  m11_inclusion: "n(A ∪ B) = n(A) + n(B) − n(A ∩ B). The students who like both were counted twice."
  m11_power_set: "Each element is either in a subset or not: two choices per element. Multiply the choices."
  m11_proper_subset: "A proper subset leaves at least one element out. Of all 2ⁿ subsets, which one is not proper?"
  m11_square_list: "List the natural numbers one at a time and square each: stop as soon as the square reaches 30."
  m11_union_count: "Write A ∪ B out in full, listing shared elements only once, then count."
  c11m1_list: Write the set out in roster form first, then count or compare element by element.
  c11m1_subset: 'Each element is either in a subset or not: two choices per element.'
  c11m1_venn: Draw the Venn diagram and fill the overlap first, then the outer parts.
  c11m1_interval: Square bracket means the end point is included; round bracket means it is not.
concepts:
- code: cbse11m.sets.basics
  title: Sets, subsets and intervals
  notes: |
    A set is a well-defined collection of distinct objects. Roster form {1, 2, 3}; set-builder form {x : x is a natural
    number, x < 4}. Empty set ∅ has no elements. Finite and infinite sets; equal sets have exactly the same elements.
    A ⊆ B if every element of A is in B; a set with n elements has 2ⁿ subsets (2ⁿ − 1 proper subsets). Power set P(A)
    is the set of all subsets. Universal set U. Intervals: (a, b) open, [a, b] closed, [a, b) half-open. N ⊂ Z ⊂ Q ⊂ R.
  explanations:
    text: A set is a clear collection of different objects, like {2, 4, 6}. If every element of A is also in B, A is a subset of B. A set with n elements has 2ⁿ subsets, because each element can be either in or out. Intervals like [2, 5) describe sets of real numbers.
    visual: 'Draw a big rectangle (the universal set U). Inside it draw circle B, and inside B a smaller circle A: A ⊆ B. For intervals, draw a number line: a filled dot means the end is included, an open dot means it isn''t.'
    step_by_step: 'Step 1: List the elements. Step 2: Check each element of A is in B for A ⊆ B. Step 3: Count elements n; subsets = 2ⁿ. Step 4: For intervals, decide which ends are included: square bracket yes, round bracket no.'
    real_world: A class's set of students who play football is a subset of all the students in the class; a database query picks out such subsets.
  picture:
    kind: number_line
    from: 0
    to: 6
    step: 1
    points:
    - at: 2
      label: 2 (included)
    - at: 5
      label: 5 (not included)
    alt: 'The interval [2, 5) on a number line: 2 is included and 5 is not.'
  activity:
    type: sort
    prompt: 'Is it a set? A set needs a clear rule: anyone can check whether a thing belongs.'
    bins:
    - Well-defined set
    - Not a set
    items:
    - label: The vowels of the English alphabet
      bin: Well-defined set
      clue: Could two people disagree about which letters belong?
      why: 'a, e, i, o, u: anyone can check, so the collection is well-defined.'
    - label: The tall students in your class
      bin: Not a set
      clue: Who decides how tall counts as 'tall'?
      why: '''Tall'' is a matter of opinion, so nobody can say for sure who belongs.'
    - label: Prime numbers less than 20
      bin: Well-defined set
      clue: Can you test any number to see if it belongs?
      why: '2, 3, 5, 7, 11, 13, 17, 19: a clear test, so it is a set.'
    - label: The good cricket players of India
      bin: Not a set
      clue: Would every fan make the same list?
      why: '''Good'' changes from person to person, so membership is not well-defined.'
    - label: The rivers of India
      bin: Well-defined set
      clue: Does a river either flow in India or not?
      why: Each river is either in India or not, so the collection is well-defined.
    - label: The difficult chapters in this book
      bin: Not a set
      clue: Is a chapter difficult for everyone?
      why: 'One learner''s hard chapter is another''s easy one: no clear rule.'
    - label: The solutions of x² = 4
      bin: Well-defined set
      clue: Can you list exactly which numbers work?
      why: Only −2 and 2 work, so this is the set {−2, 2}.
    - label: Natural numbers greater than 100
      bin: Well-defined set
      clue: It never ends. Does that stop it being a set?
      why: 'It is infinite, but any number can be tested: 101 is in, 99 is not. Infinite sets are still sets.'
    - label: The most beautiful flowers in a garden
      bin: Not a set
      clue: Is beauty something you can measure?
      why: Beauty is opinion, so membership can't be checked.
    - label: Even prime numbers
      bin: Well-defined set
      clue: Can you find one? Is there more than one?
      why: Only 2 is even and prime, so this is the set {2}, a singleton.
  lesson:
    - teach: 'A set is a well-defined collection of distinct objects. Roster form lists them: {2, 4, 6}. Set-builder form describes them: {x : x is an even natural number, x ≤ 6}. Repeated elements count once.'
      check:
        prompt: How many elements does {a, b, a, c, b} have?
        options:
        - '3'
        - '5'
        - '2'
        answer: '3'
        why: 'Repeats count once: the distinct elements are a, b, c.'
      ways:
      - style: visual
        teach: 'The same set written two ways: as a list and as a rule.'
        picture:
          kind: compare
          columns:
          - title: Roster form
            points:
            - '{2, 4, 6}'
            - list every element
            - repeats written once
          - title: Set-builder form
            points:
            - '{x : x even, x ≤ 6}'
            - give the rule
            - good for big sets
          alt: Roster form lists the elements 2, 4, 6; set-builder form gives the rule x is an even natural number up to 6. Both describe the same set.
      - style: real_world
        teach: 'A class register is a roster: every name written out. ''All students taller than 150 cm'' is set-builder: a rule that decides who belongs. ''Good singers'' is not a set, because people disagree on who is in it.'
    - teach: A ⊆ B means every element of A is in B. For a set with n elements, each element is either in or out of a subset, giving 2ⁿ subsets; leaving out the set itself gives 2ⁿ − 1 proper subsets. The power set P(A) is the set of all subsets.
      picture:
        kind: bars
        unit: subsets
        bars:
        - label: n = 1
          value: 2
        - label: n = 2
          value: 4
        - label: n = 3
          value: 8
        - label: n = 4
          value: 16
        alt: The number of subsets doubles with each extra element.
      check:
        prompt: How many subsets does a 2-element set {p, q} have?
        options:
        - '4'
        - '2'
        - '3'
        answer: '4'
        why: '∅, {p}, {q}, {p, q}: 2² = 4.'
      ways:
      - style: step_by_step
        teach: 'Step 1: Count the elements, n. Step 2: Each element is either in a subset or out: 2 choices. Step 3: Multiply: 2ⁿ subsets. Step 4: Drop the set itself for proper subsets: 2ⁿ − 1. For {a, b, c}: 8 subsets, 7 proper.'
      - style: real_world
        teach: 'A pizza shop offers 3 toppings and you may take any mix, even none. Each topping is yes or no, so there are 2 × 2 × 2 = 8 possible pizzas: exactly the 8 subsets of a 3-element set.'
    - teach: Intervals are subsets of R. (a, b) excludes both ends; [a, b] includes both; [a, b) includes a but not b. The empty set ∅ has no elements, and N ⊂ Z ⊂ Q ⊂ R.
      picture:
        kind: number_line
        from: 0
        to: 8
        points:
        - at: 2
          label: '[2'
        - at: 6
          label: 6)
        alt: 'The interval [2, 6) on a number line: 2 included, 6 excluded.'
      check:
        prompt: Is 6 in the interval [2, 6)?
        options:
        - 'No'
        - 'Yes'
        - Only if 6 is rational
        answer: 'No'
        why: The round bracket at 6 means 6 is excluded.
      ways:
      - style: step_by_step
        teach: 'Step 1: Look at the left bracket: [ means a is in, ( means a is out. Step 2: Do the same for the right end. Step 3: Read it aloud: [2, 5) is ''from 2, including 2, up to 5, not including 5''.'
      - style: real_world
        teach: A bus pass valid 'from 1 June to 30 June, both days included' is a closed interval [1, 30]. An offer 'until midnight' that ends the moment the clock strikes 12 leaves the end out, like a round bracket.
  items:
  - prompt: How many subsets does the set {a, b, c} have?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - Each element is in or out.
    - 2³.
    solution: 2³ = 8 subsets.
    mistakes:
      '6': c11_subsets
  - prompt: How many proper subsets does a set with 4 elements have?
    answer: '15'
    check: 2**4 - 1
    difficulty: 2
    hints:
    - 'All subsets: 2⁴.'
    - Leave out the set itself.
    solution: 2⁴ − 1 = 15.
    mistakes: {"16": "m11_proper_subset"}
  - prompt: 'How many elements are in {x : x is a natural number, x² < 30}?'
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Try x = 1, 2, 3, ...
    - 5² = 25 < 30, 6² = 36.
    solution: 'x = 1, 2, 3, 4, 5: five elements.'
    mistakes: {"30": "m11_square_list", "6": "m11_square_list"}
  - prompt: Which of these is the empty set?
    options:
    - '{x : x is a natural number, x < 1}'
    - '{0}'
    - '{x : x² = 4}'
    - '{∅, 1}'
    answer: '{x : x is a natural number, x < 1}'
    difficulty: 2
    hints:
    - Natural numbers start at 1.
    - '{0} has one element.'
    solution: No natural number is less than 1, so the set is empty.
    mistakes: {"{0}": "m11_empty_set", "{x : x² = 4}": "m11_empty_set", "{∅, 1}": "m11_empty_set"}
  - prompt: Which interval contains 3 but not 7?
    options:
    - '[3, 7)'
    - (3, 7]
    - (3, 7)
    - '[3, 7]'
    answer: '[3, 7)'
    difficulty: 1
    hints:
    - Square bracket includes.
    - Round bracket excludes.
    solution: '[3, 7) includes 3 and excludes 7.'
    mistakes: {"(3, 7]": "m11_brackets", "(3, 7)": "m11_brackets", "[3, 7]": "m11_brackets"}
  - prompt: How many elements does the power set of a 5-element set have?
    answer: '32'
    check: 2**5
    difficulty: 2
    hints:
    - P(A) contains all subsets.
    - 2⁵.
    solution: 2⁵ = 32.
    mistakes: {"25": "m11_power_set", "10": "m11_power_set", "31": "m11_power_set"}
  - prompt: How many proper subsets does {1, 2, 3} have?
    answer: '7'
    check: 2**3-1
    difficulty: 1
    hints:
    - Count all subsets first, using two choices per element.
    - Then leave out the set itself.
    solution: 'Step 1: 2³ = 8 subsets. Step 2: 8 − 1 = 7 proper subsets.'
    mistakes:
      '8': c11m1_subset
      '6': c11m1_subset
  - prompt: 'How many elements are in {x : x is a prime number, x < 20}?'
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - List the primes one by one.
    - Remember 1 is not prime.
    solution: 'Step 1: 2, 3, 5, 7, 11, 13, 17, 19. Step 2: 8 elements.'
    mistakes:
      '9': c11m1_list
      '7': c11m1_list
  - prompt: Which set is infinite?
    options:
    - '{x : x is a multiple of 3}'
    - '{x : x is a letter of ''SCHOOL''}'
    - '{x : x is a month of the year}'
    answer: '{x : x is a multiple of 3}'
    difficulty: 1
    hints:
    - Try listing each set. Does the list ever stop?
    - Months and letters can be counted to the end.
    solution: 'Step 1: letters and months are finite. Step 2: multiples of 3 go on forever.'
    mistakes:
      '{x : x is a letter of ''SCHOOL''}': c11m1_list
      '{x : x is a month of the year}': c11m1_list
  - prompt: A has 3 elements. How many elements does P(P(A)) have?
    answer: '256'
    check: 2**(2**3)
    difficulty: 3
    hints:
    - First find how many elements P(A) has.
    - Then use the same rule again on P(A).
    solution: 'Step 1: n(P(A)) = 2³ = 8. Step 2: n(P(P(A))) = 2⁸ = 256.'
    mistakes:
      '64': c11m1_subset
      '16': c11m1_subset
  - prompt: 'Write {x ∈ R : −1 < x ≤ 4} in interval notation.'
    options:
    - (−1, 4]
    - '[−1, 4)'
    - '[−1, 4]'
    answer: (−1, 4]
    difficulty: 2
    hints:
    - Is −1 included? Is 4 included?
    - Strict inequality gets a round bracket.
    solution: 'Step 1: −1 excluded, 4 included. Step 2: (−1, 4].'
    mistakes:
      '[−1, 4)': c11m1_interval
      '[−1, 4]': c11m1_interval
  - prompt: 'Are A = {x : x² = 4} and B = {−2, 2} equal sets?'
    options:
    - 'Yes'
    - No, A has only 2
    - No, B has extra elements
    answer: 'Yes'
    difficulty: 2
    hints:
    - Solve x² = 4 fully.
    - Equal sets have exactly the same elements.
    solution: 'Step 1: x² = 4 gives x = ±2. Step 2: A = {−2, 2} = B.'
    mistakes:
      No, A has only 2: c11m1_list
      No, B has extra elements: c11m1_list
  - prompt: Which statement is true?
    options:
    - ∅ ⊆ A for every set A
    - ∅ ∈ A for every set A
    - '{∅} = ∅'
    answer: ∅ ⊆ A for every set A
    difficulty: 3
    hints:
    - Check 'every element of ∅ is in A'. Is there anything to fail?
    - '{∅} has one element; ∅ has none.'
    solution: 'Step 1: ∅ has no elements, so it is a subset of every set. Step 2: it need not be an element, and {∅} ≠ ∅.'
    mistakes:
      ∅ ∈ A for every set A: c11m1_subset
      '{∅} = ∅': c11m1_list
  - prompt: How many integers lie in the interval [−3, 2)?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - List the integers from the left end.
    - Stop before the excluded end.
    solution: 'Step 1: −3, −2, −1, 0, 1. Step 2: 5 integers.'
    mistakes:
      '6': c11m1_interval
      '4': c11m1_interval
  - prompt: A set has 64 subsets. How many elements does it have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Subsets = 2 to the power n.
    - Which power of 2 gives 64?
    solution: 'Step 1: 2ⁿ = 64. Step 2: n = 6.'
    mistakes:
      '8': c11m1_subset
      '32': c11m1_subset
  - prompt: 'Assertion (A): The set of all natural numbers less than 1 is the empty set.

      Reason (R): The smallest natural number is 1.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. No natural number is below 1, because 1 is the smallest; that is why the set is empty, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: A canteen lets you choose any of 4 add-ons (cheese, onion, corn, olives) for your sandwich, including none. How many different sandwiches are possible?'
    options:
    - '16'
    - '15'
    - '8'
    answer: '16'
    hints:
    - Each add-on is a yes or a no.
    - How many choices for 4 add-ons together?
    solution: 'Each of the 4 add-ons is in or out: 2⁴ = 16 sandwiches, counting the plain one.'
    mistakes:
      '15': m11_proper_subset
      '8': m11_power_set
    exam: competency
    difficulty: 2
  - prompt: 'Write the interval {x : −3 < x ≤ 4, x ∈ R} in interval notation.'
    options:
    - (−3, 4]
    - '[−3, 4)'
    - '[−3, 4]'
    answer: (−3, 4]
    hints:
    - Is −3 itself allowed?
    - Is 4 itself allowed?
    solution: −3 is left out (strict <) and 4 is included (≤), so (−3, 4].
    mistakes:
      '[−3, 4)': m11_brackets
      '[−3, 4]': c11m1_interval
    exam: one_mark
    difficulty: 2
- code: cbse11m.sets.ops
  title: Operations on sets and Venn diagrams
  after:
  - cbse11m.sets.basics
  notes: |
    Union A ∪ B: elements in A or B (or both). Intersection A ∩ B: in both. Difference A − B: in A but not B. Complement
    A′ = U − A. Disjoint sets: A ∩ B = ∅. De Morgan's laws: (A ∪ B)′ = A′ ∩ B′, (A ∩ B)′ = A′ ∪ B′. Counting:
    n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Venn diagrams show these regions.
  explanations:
    text: Union joins two sets; intersection keeps what they share; difference A − B keeps what is only in A. To count students who like tea or coffee, add both groups and subtract those who like both, because they were counted twice.
    visual: Draw two overlapping circles A and B in a rectangle. The overlap is A ∩ B. Both circles together are A ∪ B. The part of A outside B is A − B. Everything outside A is A′.
    step_by_step: 'Step 1: Draw the Venn diagram. Step 2: Fill the overlap first. Step 3: Fill ''only A'' = n(A) − overlap and ''only B'' = n(B) − overlap. Step 4: Add the regions you need.'
    real_world: 'In a survey of 60 people, 35 read English papers, 30 read Malayalam papers and 10 read both: 35 + 30 − 10 = 55 read at least one.'
  picture:
    kind: compare
    columns:
    - title: Operation
      points:
      - A ∪ B
      - A ∩ B
      - A − B
    - title: Meaning
      points:
      - in A or B
      - in both
      - in A, not in B
    alt: A ∪ B is everything in A or B, A ∩ B is what is in both, and A − B is what is in A but not B.
  activity:
    type: formula
    prompt: Two sets A and B overlap. Set n(A), n(B) and the overlap n(A ∩ B). n(A ∪ B) = n(A) + n(B) − n(A ∩ B).
    inputs:
    - name: a
      label: n(A)
      min: 0
      max: 40
      step: 1
      start: 10
    - name: b
      label: n(B)
      min: 0
      max: 40
      step: 1
      start: 10
    - name: x
      label: n(A ∩ B), in both
      min: 0
      max: 20
      step: 1
      start: 0
    outputs:
    - name: u
      label: n(A ∪ B)
      expr: a+b-x
    - name: ao
      label: Only in A
      expr: a-x
    - name: bo
      label: Only in B
      expr: b-x
    goals:
    - prompt: In a class of 40, 25 take Hindi (A) and 26 take Sanskrit (B). Every student takes at least one. How many take both?
      want:
        a: 25
        b: 26
        u: 40
      hint: Every student is in A ∪ B, so n(A ∪ B) = 40.
      mistakes:
      - when:
          u: 51
        say: '51 is more than the whole class: the students who take both were counted twice, once in each set. Take the overlap away once.'
      - when:
          a: 25
          b: 26
          x:
          - 12
          - 20
        say: 'The overlap is too big now: n(A ∪ B) has dropped below 40, so some students would take neither. The class has nobody like that.'
    - prompt: Make n(A) = 12 and n(B) = 9 with A and B disjoint.
      want:
        a: 12
        b: 9
        x: 0
      mistakes:
      - when:
          a: 12
          b: 9
          x:
          - 1
          - 9
        say: Disjoint sets share nothing, so n(A ∩ B) = 0 and n(A ∪ B) is just 12 + 9.
    - prompt: 21 are only in A, 10 only in B, and n(A ∪ B) = 39. Set n(A), n(B) and the overlap.
      want:
        ao: 21
        bo: 10
        u: 39
      hint: Only-A + only-B + both = the union.
      mistakes:
      - when:
          a: 21
          b: 10
        say: n(A) counts everything in A, the overlap too. 21 is only the part of A outside B, so n(A) = 21 + overlap.
      - when:
          ao: 21
          bo: 10
          u:
          - 31
          - 38
        say: The union is still short of 39. The 8 in the gap are the ones in both sets.
  lesson:
    - teach: Union A ∪ B holds elements in A or B (or both). Intersection A ∩ B holds elements in both. Difference A − B holds elements of A not in B. Sets with A ∩ B = ∅ are disjoint.
      check:
        prompt: A = {1, 2, 3}, B = {2, 3, 4}. What is A ∩ B?
        options:
        - '{2, 3}'
        - '{1, 2, 3, 4}'
        - '{1}'
        answer: '{2, 3}'
        why: Only 2 and 3 are in both sets.
      ways:
      - style: visual
        teach: Union, intersection and difference for A = {1, 2, 3, 4} and B = {3, 4, 5}.
        picture:
          kind: compare
          columns:
          - title: A ∪ B
            points:
            - '{1, 2, 3, 4, 5}'
            - in A or B
          - title: A ∩ B
            points:
            - '{3, 4}'
            - in both
          - title: A − B
            points:
            - '{1, 2}'
            - in A, not in B
          alt: 'For A equal to 1, 2, 3, 4 and B equal to 3, 4, 5: the union is 1 to 5, the intersection is 3 and 4, and A minus B is 1 and 2.'
      - style: real_world
        teach: Club A is the chess club, club B the quiz club. The union is everyone in at least one club; the intersection is students in both; A − B is chess players who skip quiz. If no one is in both, the clubs are disjoint.
    - teach: 'The complement A′ = U − A holds everything in the universal set U that is not in A. De Morgan''s laws: (A ∪ B)′ = A′ ∩ B′ and (A ∩ B)′ = A′ ∪ B′.'
      check:
        prompt: U = {1, ..., 6}, A = {1, 2}. What is A′?
        options:
        - '{3, 4, 5, 6}'
        - '{1, 2}'
        - ∅
        answer: '{3, 4, 5, 6}'
        why: Everything in U except 1 and 2.
      ways:
      - style: visual
        teach: Shading outside both circles shows (A ∪ B)′ is the same as A′ ∩ B′.
        picture:
          kind: flow
          steps:
          - Shade A ∪ B
          - 'Take what is left in U: (A ∪ B)′'
          - That is outside A AND outside B
          - So it equals A′ ∩ B′
          alt: Shade the union, take the part of U left over, notice it is outside A and outside B, so it equals A complement intersect B complement.
      - style: step_by_step
        teach: 'Step 1: Write the complement of the whole bracket. Step 2: Put a dash on each set inside. Step 3: Flip the sign: ∪ becomes ∩ and ∩ becomes ∪. So (A ∩ B)′ = A′ ∪ B′.'
    - teach: 'Counting with Venn diagrams: n(A ∪ B) = n(A) + n(B) − n(A ∩ B), because the overlap is counted twice. Fill the overlap first, then each ''only'' region.'
      picture:
        kind: flow
        steps:
        - fill A ∩ B
        - A only = n(A) − n(A ∩ B)
        - B only = n(B) − n(A ∩ B)
        - add the three regions
        alt: Steps to fill a two-set Venn diagram.
      check:
        prompt: n(A) = 10, n(B) = 8, n(A ∩ B) = 3. Find n(A ∪ B).
        options:
        - '15'
        - '18'
        - '21'
        answer: '15'
        why: 10 + 8 − 3 = 15; the overlap is counted once.
      ways:
      - style: step_by_step
        teach: 'Step 1: Put n(A ∩ B) in the overlap. Step 2: A only = n(A) − overlap. Step 3: B only = n(B) − overlap. Step 4: Add the three regions. With n(A) = 35, n(B) = 30, overlap 10: 25 + 10 + 20 = 55.'
      - style: real_world
        teach: In a class, 20 students play cricket and 15 play football, and 5 play both. Counting heads at the cricket nets and then the football field counts those 5 twice, so the real total is 20 + 15 − 5 = 30.
