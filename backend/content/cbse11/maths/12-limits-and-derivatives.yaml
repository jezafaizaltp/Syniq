# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse11-math
chapter: 12
title: Limits and Derivatives
tips:
  c11_power_rule: 'd/dx(xⁿ) = nxⁿ⁻¹: bring the power down in front, then reduce the power by 1.'
  c11_zero_zero: If substituting gives 0/0, factorise and cancel first, or use a standard limit like lim (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹.
  m11_deriv_cos: "At x = 0, cos x is at its peak and starting to fall. Is the slope there positive or negative?"
  m11_direct_sub: "A polynomial is continuous: just substitute x = 3."
  m11_factor_cancel: "Substitution gives 0/0. Factorise the top as a difference of squares and cancel."
  m11_power_rule: "Differentiate term by term: d/dx(xⁿ) = nxⁿ⁻¹, constants vanish. Then put x = 1."
  m11_product_rule: "Product rule: (uv)′ = u′v + uv′. Then put x = 0 into both parts."
  m11_quotient_rule: "Quotient rule: (u/v)′ = (u′v − uv′)/v². Put x = 1 at the end."
  m11_sin_ax: "Rewrite so the angle inside sine matches the denominator, then use lim sin θ/θ = 1."
  m11_sinx_x: "Try x = 0.01 rad on a calculator: sin x and x are nearly equal."
  m11_velocity: "Velocity is the derivative of height. Differentiate h(t), then put t = 1."
  m11_xn_limit: "Use lim (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹."
concepts:
- code: cbse11m.calc.limits
  title: Limits
  notes: |
    lim(x→a) f(x) = L means f(x) gets as close as we like to L as x approaches a (from both sides). Left- and right-hand
    limits must be equal. Algebra of limits: sum, product, quotient. Methods: substitution; factorise and cancel for
    0/0; standard limits lim(x→a) (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹; lim(x→0) sin x/x = 1; lim(x→0) (1 − cos x)/x = 0.
  explanations:
    text: 'A limit asks what value f(x) approaches as x gets closer and closer to a number. Often you just substitute. If you get 0/0, simplify first: lim(x→2) (x² − 4)/(x − 2) = lim (x + 2) = 4. A key result: sin x / x → 1 as x → 0 (x in radians).'
    visual: 'Make a table for (x² − 4)/(x − 2) with x = 1.9, 1.99, 2.01, 2.1: values 3.9, 3.99, 4.01, 4.1. They close in on 4, even though x = 2 itself gives 0/0.'
    step_by_step: 'Step 1: Try substituting. Step 2: If you get a number, that''s the limit. Step 3: If 0/0, factorise and cancel, or use a standard limit. Step 4: Substitute again.'
    real_world: 'A car''s speedometer shows a limit: the distance covered in a tiny time divided by that time, as the time shrinks to zero.'
  picture:
    kind: number_line
    from: 1.8
    to: 2.2
    step: 0.05
    points:
    - at: 1.9
      label: '3.9'
    - at: 1.95
      label: '3.95'
    - at: 2
      label: → 4
    - at: 2.05
      label: '4.05'
    - at: 2.1
      label: '4.1'
    alt: As x approaches 2 from both sides, (x² − 4)/(x − 2) approaches 4.
  activity:
    type: formula
    prompt: f(x) = (x² − 4) ÷ (x − 2) has no value at x = 2 (0 ÷ 0). Move x close to 2 and watch f(x).
    inputs:
    - name: x
      label: x
      min: 1.505
      max: 2.495
      step: 0.01
      start: 1.505
    outputs:
    - name: num
      label: Top, x² − 4
      expr: x^2-4
      places: 4
    - name: den
      label: Bottom, x − 2
      expr: x-2
      places: 3
    - name: f
      label: f(x)
      expr: (x^2-4)/(x-2)
      places: 3
    goals:
    - prompt: Come towards 2 from the left until f(x) is within 0.01 of where it's heading.
      want:
        f:
        - 3.99
        - 3.9999
      mistakes:
      - when:
          x:
          - 2.005
          - 2.495
        say: That's to the right of 2. Approach from the left, with x below 2.
      - when:
          f:
          - 3.5
          - 3.985
        say: Closer, but f is still more than 0.01 below its limit. Nudge x nearer to 2.
    - prompt: Now come from the right until f(x) is within 0.01 of the limit.
      want:
        f:
        - 4.0001
        - 4.01
      mistakes:
      - when:
          x:
          - 1.505
          - 1.995
        say: That's left of 2. Approach from above.
      - when:
          f:
          - 4.015
          - 4.5
        say: Closer, but still more than 0.01 above. Move x nearer to 2.
    - prompt: Make the top, x² − 4, within 0.03 of zero. What is f(x) doing as both top and bottom shrink?
      want:
        num:
        - -0.03
        - 0.03
      mistakes:
      - when:
          num:
          - -1.8
          - -0.031
        say: 'Still too far below: x² − 4 shrinks only as x comes very close to 2.'
      - when:
          num:
          - 0.031
          - 2.3
        say: 'Still too far above: bring x closer to 2.'
  items:
  - prompt: Find lim(x→3) (x² + 1).
    answer: '10'
    check: limit(x**2+1, x, 3)
    difficulty: 1
    hints:
    - Substitute.
    - 9 + 1.
    solution: '10.'
    mistakes: {"9": "m11_direct_sub", "7": "m11_direct_sub"}
  - prompt: Find lim(x→2) (x² − 4)/(x − 2).
    answer: '4'
    check: limit((x**2-4)/(x-2), x, 2)
    difficulty: 1
    hints:
    - 'Factorise: (x − 2)(x + 2).'
    - Cancel, then x + 2.
    solution: '4.'
    mistakes:
      '0': c11_zero_zero
  - prompt: Find lim(x→1) (x⁵ − 1)/(x − 1).
    answer: '5'
    check: limit((x**5-1)/(x-1), x, 1)
    difficulty: 2
    hints:
    - Standard limit naⁿ⁻¹.
    - 5 × 1⁴.
    solution: '5.'
    mistakes: {"0": "m11_xn_limit", "1": "m11_xn_limit"}
  - prompt: Find lim(x→0) sin(3x)/x.
    answer: '3'
    check: limit(sin(3*x)/x, x, 0)
    difficulty: 2
    hints:
    - Write as 3 · sin 3x/(3x).
    - sin u/u → 1.
    solution: '3.'
    mistakes: {"1": "m11_sin_ax", "1/3": "m11_sin_ax"}
  - prompt: Find lim(x→0) sin x / x.
    answer: '1'
    check: limit(sin(x)/x, x, 0)
    difficulty: 1
    hints:
    - Standard limit.
    - x in radians.
    solution: '1.'
    mistakes: {"0": "m11_sinx_x"}
  - prompt: Find lim(x→3) (x² − 9)/(x − 3).
    answer: '6'
    check: limit((x**2-9)/(x-3), x, 3)
    difficulty: 1
    hints:
    - (x − 3)(x + 3).
    - x + 3 at 3.
    solution: '6.'
    mistakes: {"0": "m11_factor_cancel", "3": "m11_factor_cancel"}
- code: cbse11m.calc.derivatives
  title: Derivatives
  after:
  - cbse11m.calc.limits
  notes: |
    Derivative of f at a: f′(a) = lim(h→0) [f(a + h) − f(a)]/h: the slope of the tangent, the instantaneous rate of
    change. Rules: d/dx(xⁿ) = nxⁿ⁻¹; constant → 0; (cf)′ = cf′; (u ± v)′ = u′ ± v′; product (uv)′ = u′v + uv′;
    quotient (u/v)′ = (u′v − uv′)/v². d/dx sin x = cos x; d/dx cos x = −sin x. Example: d/dx(3x² + 5x) = 6x + 5.
  explanations:
    text: 'The derivative measures how fast something changes: the slope of a curve at a point. For powers, bring the power down and reduce it by one: the derivative of x³ is 3x². Sums are differentiated term by term, and there are rules for products and quotients.'
    visual: On the curve y = x², draw a chord from (1, 1) to (1 + h, (1 + h)²). As h shrinks, the chord turns into the tangent at (1, 1), whose slope is 2.
    step_by_step: 'Step 1: Split the function into terms. Step 2: Apply d/dx(xⁿ) = nxⁿ⁻¹ to each. Step 3: Constants vanish. Step 4: Use the product or quotient rule when terms multiply or divide. Step 5: Substitute x for a value.'
    real_world: 'If a stone''s height is h(t) = 20t − 5t², its speed at time t is h′(t) = 20 − 10t: at t = 1 second it is rising at 10 m/s.'
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - xⁿ
      - sin x
      - cos x
    - title: Derivative
      points:
      - nxⁿ⁻¹
      - cos x
      - −sin x
    alt: The derivative of xⁿ is nxⁿ⁻¹, of sin x is cos x, and of cos x is −sin x.
  activity:
    type: formula
    prompt: For y = x³, the secant from x = a to x = a + h has slope ((a + h)³ − a³) ÷ h. As h shrinks it heads to the tangent slope, 3a².
    inputs:
    - name: a
      label: Point a
      min: -3
      max: 3
      step: 1
      start: -3
    - name: h
      label: Step h
      min: 0.01
      max: 1
      step: 0.01
      start: 1
    outputs:
    - name: sec
      label: Secant slope
      expr: ((a+h)^3-a^3)/h
      places: 3
    - name: tan
      label: Tangent slope 3a²
      expr: 3*a^2
    goals:
    - prompt: At a = 1, shrink h until the secant slope is within 0.1 of the tangent slope.
      want:
        a: 1
        sec:
        - 2.9
        - 3.1
      mistakes:
      - when:
          a: 1
          h:
          - 0.5
          - 1
        say: h is still big, so the secant reaches far up the curve and is much steeper than the tangent. Shrink h.
      - when:
          a: 1
          sec:
          - 3.11
          - 3.99
        say: 'Closer. Keep shrinking h: the slope is heading to 3 × 1² = 3.'
    - prompt: Find the point where the tangent to y = x³ is flat.
      want:
        tan: 0
      mistakes:
      - when:
          a: -1
        say: 'At a = −1 the slope is 3(−1)² = +3: squaring makes it positive. x³ rises on both sides of 0; only a = 0 makes 3a² zero.'
    - prompt: At a = 2, shrink h until the secant slope is within 0.5 of the tangent slope.
      want:
        a: 2
        sec:
        - 11.5
        - 12.5
      mistakes:
      - when:
          a: 2
          h:
          - 0.3
          - 1
        say: 'h is too big: the secant is much steeper than the tangent, 3 × 2² = 12.'
      - when:
          a: 2
          sec:
          - 12.51
          - 15
        say: Closer. Shrink h a little more.
  items:
  - prompt: Find the derivative of x³ at x = 2.
    answer: '12'
    check: diff(x**3, x).subs(x, 2)
    difficulty: 1
    hints:
    - d/dx x³ = 3x².
    - 3 × 4.
    solution: '12.'
    mistakes:
      '8': c11_power_rule
  - prompt: f(x) = 3x² + 5x − 7. Find f′(1).
    answer: '11'
    check: diff(3*x**2+5*x-7, x).subs(x, 1)
    difficulty: 1
    hints:
    - f′(x) = 6x + 5.
    - 6 + 5.
    solution: '11.'
    mistakes: {"6": "m11_power_rule", "1": "m11_power_rule"}
  - prompt: Find the derivative of x · sin x at x = 0.
    answer: '0'
    check: diff(x*sin(x), x).subs(x, 0)
    difficulty: 2
    hints:
    - 'Product rule: sin x + x cos x.'
    - 'At 0: 0 + 0.'
    solution: '0.'
    mistakes: {"1": "m11_product_rule"}
  - prompt: Find d/dx (x²/(x + 1)) at x = 1.
    answer: 3/4
    check: diff(x**2/(x+1), x).subs(x, 1)
    difficulty: 2
    hints:
    - 'Quotient rule: (2x(x + 1) − x²)/(x + 1)².'
    - (4 − 1)/4.
    solution: 3/4.
    mistakes: {"1": "m11_quotient_rule", "1/2": "m11_quotient_rule"}
  - prompt: A stone's height is h(t) = 20t − 5t². Find its speed h′(1) (in m/s).
    answer: '10'
    check: 20 - 10*1
    difficulty: 2
    hints:
    - h′(t) = 20 − 10t.
    - t = 1.
    solution: 10 m/s.
    mistakes: {"15": "m11_velocity", "20": "m11_velocity"}
  - prompt: What is the derivative of cos x?
    options:
    - −sin x
    - sin x
    - cos x
    - −cos x
    answer: −sin x
    difficulty: 1
    hints:
    - Standard result.
    - Negative sign.
    solution: d/dx cos x = −sin x.
    mistakes: {"sin x": "m11_deriv_cos", "cos x": "m11_deriv_cos", "−cos x": "m11_deriv_cos"}
