# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse11-math
chapter: 12
title: Limits and Derivatives
tips:
  c11_power_rule: 'd/dx(xⁿ) = nxⁿ⁻¹: bring the power down in front, then reduce the power by 1.'
  c11_zero_zero: If substituting gives 0/0, factorise and cancel first, or use a standard limit like lim (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹.
  m11_deriv_cos: "At x = 0, cos x is at its peak and starting to fall. Is the slope there positive or negative?"
  m11_direct_sub: "A polynomial is continuous: just substitute x = 3."
  m11_factor_cancel: "Substitution gives 0/0. Factorise the top as a difference of squares and cancel."
  m11_power_rule: "Differentiate term by term: d/dx(xⁿ) = nxⁿ⁻¹, constants vanish. Then put x = 1."
  m11_product_rule: "Product rule: (uv)′ = u′v + uv′. Write both parts, then put x = 0 into each. Remember sin 0 = 0."
  m11_quotient_rule: "Quotient rule: (u/v)′ = (u′v − uv′)/v². Put x = 1 at the end."
  m11_sin_ax: "Rewrite so the angle inside sine matches the denominator, then use lim sin θ/θ = 1."
  m11_sinx_x: "Try x = 0.01 rad on a calculator: sin x and x are nearly equal."
  m11_velocity: "Velocity is the derivative of height. Differentiate h(t), then put t = 1."
  m11_xn_limit: "Use lim (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹."
  c11m12_sub: First try putting the value straight in. Only if you get 0/0 do you need to simplify.
  c11m12_std: Match the limit to a standard form, such as (xⁿ − aⁿ)/(x − a) or sin x / x, and adjust the inside.
  c11m12_rule: Name the rule first (power, product or quotient), then differentiate each part carefully.
concepts:
- code: cbse11m.calc.limits
  title: Limits
  notes: |
    lim(x→a) f(x) = L means f(x) gets as close as we like to L as x approaches a (from both sides). Left- and right-hand
    limits must be equal. Algebra of limits: sum, product, quotient. Methods: substitution; factorise and cancel for
    0/0; standard limits lim(x→a) (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹; lim(x→0) sin x/x = 1; lim(x→0) (1 − cos x)/x = 0.
  explanations:
    text: 'A limit asks what value f(x) approaches as x gets closer and closer to a number. Often you just substitute. If you get 0/0, simplify first: lim(x→2) (x² − 4)/(x − 2) = lim (x + 2) = 4. A key result: sin x / x → 1 as x → 0 (x in radians).'
    visual: 'Make a table for (x² − 4)/(x − 2) with x = 1.9, 1.99, 2.01, 2.1: values 3.9, 3.99, 4.01, 4.1. They close in on 4, even though x = 2 itself gives 0/0.'
    step_by_step: 'Step 1: Try substituting. Step 2: If you get a number, that''s the limit. Step 3: If 0/0, factorise and cancel, or use a standard limit. Step 4: Substitute again.'
    real_world: 'A car''s speedometer shows a limit: the distance covered in a tiny time divided by that time, as the time shrinks to zero.'
  picture:
    kind: number_line
    from: 1.8
    to: 2.2
    step: 0.05
    points:
    - at: 1.9
      label: '3.9'
    - at: 1.95
      label: '3.95'
    - at: 2
      label: → 4
    - at: 2.05
      label: '4.05'
    - at: 2.1
      label: '4.1'
    alt: As x approaches 2 from both sides, (x² − 4)/(x − 2) approaches 4.
  activity:
    type: formula
    prompt: f(x) = (x² − 4) ÷ (x − 2) has no value at x = 2 (0 ÷ 0). Move x close to 2 and watch f(x).
    inputs:
    - name: x
      label: x
      min: 1.505
      max: 2.495
      step: 0.01
      start: 1.505
    outputs:
    - name: num
      label: Top, x² − 4
      expr: x^2-4
      places: 4
    - name: den
      label: Bottom, x − 2
      expr: x-2
      places: 3
    - name: f
      label: f(x)
      expr: (x^2-4)/(x-2)
      places: 3
    goals:
    - prompt: Come towards 2 from the left until f(x) is within 0.01 of where it's heading.
      want:
        f:
        - 3.99
        - 3.9999
      mistakes:
      - when:
          x:
          - 2.005
          - 2.495
        say: That's to the right of 2. Approach from the left, with x below 2.
      - when:
          f:
          - 3.5
          - 3.985
        say: Closer, but f is still more than 0.01 below its limit. Nudge x nearer to 2.
    - prompt: Now come from the right until f(x) is within 0.01 of the limit.
      want:
        f:
        - 4.0001
        - 4.01
      mistakes:
      - when:
          x:
          - 1.505
          - 1.995
        say: That's left of 2. Approach from above.
      - when:
          f:
          - 4.015
          - 4.5
        say: Closer, but still more than 0.01 above. Move x nearer to 2.
    - prompt: Make the top, x² − 4, within 0.03 of zero. What is f(x) doing as both top and bottom shrink?
      want:
        num:
        - -0.03
        - 0.03
      mistakes:
      - when:
          num:
          - -1.8
          - -0.031
        say: 'Still too far below: x² − 4 shrinks only as x comes very close to 2.'
      - when:
          num:
          - 0.031
          - 2.3
        say: 'Still too far above: bring x closer to 2.'
  lesson:
    - teach: lim(x→a) f(x) = L means f(x) gets as close as we like to L when x is close to a (from both sides). The value at a itself does not matter. For polynomials just substitute.
      check:
        prompt: Find lim(x→2) (3x + 1).
        options:
        - '7'
        - '6'
        - '5'
        answer: '7'
        why: 'Substitute: 3(2) + 1 = 7.'
    - teach: 'If substitution gives 0/0, factorise and cancel the common factor, then substitute. Example: (x² − 1)/(x − 1) = x + 1, so the limit as x → 1 is 2.'
      check:
        prompt: lim(x→4) (x² − 16)/(x − 4) = ?
        options:
        - '8'
        - '0'
        - '4'
        answer: '8'
        why: (x − 4)(x + 4)/(x − 4) = x + 4 → 8.
    - teach: 'Standard limits: lim(x→a) (xⁿ − aⁿ)/(x − a) = naⁿ⁻¹ and lim(x→0) sin x / x = 1 (x in radians). So sin(kx)/x → k.'
      picture:
        kind: flow
        steps:
        - Substitute
        - 0/0?
        - Factorise or use a standard limit
        - Substitute again
        alt: Steps for finding a limit.
      check:
        prompt: lim(x→0) sin(5x)/x = ?
        options:
        - '5'
        - '1'
        - '0'
        answer: '5'
        why: sin(5x)/x = 5 · sin(5x)/(5x) → 5 × 1.
  items:
  - prompt: Find lim(x→3) (x² + 1).
    answer: '10'
    check: limit(x**2+1, x, 3)
    difficulty: 1
    hints:
    - Substitute.
    - 9 + 1.
    solution: '10.'
    mistakes: {"9": "m11_direct_sub", "7": "m11_direct_sub"}
  - prompt: Find lim(x→2) (x² − 4)/(x − 2).
    answer: '4'
    check: limit((x**2-4)/(x-2), x, 2)
    difficulty: 1
    hints:
    - 'Factorise: (x − 2)(x + 2).'
    - Cancel, then x + 2.
    solution: '4.'
    mistakes:
      '0': c11_zero_zero
  - prompt: Find lim(x→1) (x⁵ − 1)/(x − 1).
    answer: '5'
    check: limit((x**5-1)/(x-1), x, 1)
    difficulty: 2
    hints:
    - Standard limit naⁿ⁻¹.
    - 5 × 1⁴.
    solution: '5.'
    mistakes: {"0": "m11_xn_limit", "1": "m11_xn_limit"}
  - prompt: Find lim(x→0) sin(3x)/x.
    answer: '3'
    check: limit(sin(3*x)/x, x, 0)
    difficulty: 2
    hints:
    - Write as 3 · sin 3x/(3x).
    - sin u/u → 1.
    solution: '3.'
    mistakes: {"1": "m11_sin_ax", "1/3": "m11_sin_ax"}
  - prompt: Find lim(x→0) sin x / x.
    answer: '1'
    check: limit(sin(x)/x, x, 0)
    difficulty: 1
    hints:
    - Standard limit.
    - x in radians.
    solution: '1.'
    mistakes: {"0": "m11_sinx_x"}
  - prompt: Find lim(x→3) (x² − 9)/(x − 3).
    answer: '6'
    check: limit((x**2-9)/(x-3), x, 3)
    difficulty: 1
    hints:
    - (x − 3)(x + 3).
    - x + 3 at 3.
    solution: '6.'
    mistakes: {"0": "m11_factor_cancel", "3": "m11_factor_cancel"}
  - prompt: Find lim(x→−1) (x³ + 2x).
    answer: '-3'
    check: '-3'
    difficulty: 1
    hints:
    - It is a polynomial.
    - Put x = −1 in each term.
    solution: 'Step 1: (−1)³ + 2(−1) = −1 − 2. Step 2: −3.'
    mistakes:
      '1': c11m12_sub
      '-1': c11m12_sub
  - prompt: Find lim(x→5) (x² − 25)/(x − 5).
    answer: '10'
    check: '10'
    difficulty: 1
    hints:
    - Direct substitution gives 0/0.
    - Use a² − b² = (a − b)(a + b).
    solution: 'Step 1: (x − 5)(x + 5)/(x − 5) = x + 5. Step 2: 5 + 5 = 10.'
    mistakes:
      '0': c11m12_sub
      '5': c11m12_sub
  - prompt: Find lim(x→2) (x⁴ − 16)/(x − 2).
    answer: '32'
    check: 4*2**3
    difficulty: 2
    hints:
    - 16 = 2⁴.
    - Use the (xⁿ − aⁿ)/(x − a) form.
    solution: 'Step 1: n = 4, a = 2. Step 2: 4 × 2³ = 32.'
    mistakes:
      '8': c11m12_std
      '16': c11m12_std
  - prompt: Find lim(x→0) sin(2x)/sin(3x).
    answer: 2/3
    check: 2/3
    difficulty: 2
    hints:
    - Divide top and bottom by x.
    - Each part becomes a standard sin(kx)/x limit.
    solution: 'Step 1: [sin 2x / x] / [sin 3x / x] → 2/3. Step 2: 2/3.'
    mistakes:
      3/2: c11m12_std
      '1': c11m12_std
  - prompt: Find lim(x→0) (1 − cos x)/x.
    options:
    - '0'
    - '1'
    - does not exist
    answer: '0'
    difficulty: 2
    hints:
    - This is one of the standard limits.
    - Compare it with sin x / x.
    solution: 'Step 1: (1 − cos x)/x is a standard limit. Step 2: its value is 0.'
    mistakes:
      '1': c11m12_std
      does not exist: c11m12_std
  - prompt: For lim(x→a) f(x) to exist, what must be true?
    options:
    - left-hand and right-hand limits are equal
    - f(a) must be defined
    - f must be a polynomial
    answer: left-hand and right-hand limits are equal
    difficulty: 1
    hints:
    - Think about approaching a from both sides.
    - The value at a itself does not matter.
    solution: 'Step 1: x can approach a from left or right. Step 2: both must lead to the same number.'
    mistakes:
      f(a) must be defined: c11m12_sub
      f must be a polynomial: c11m12_sub
  - prompt: Find lim(x→1) (x² + x − 2)/(x − 1).
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Factorise the top.
    - One factor will cancel with (x − 1).
    solution: 'Step 1: (x − 1)(x + 2)/(x − 1) = x + 2. Step 2: 1 + 2 = 3.'
    mistakes:
      '0': c11m12_sub
      '2': c11m12_sub
  - prompt: Find lim(x→0) tan x / x.
    answer: '1'
    check: '1'
    difficulty: 3
    hints:
    - tan x = sin x / cos x.
    - Split into (sin x / x) · (1 / cos x).
    solution: 'Step 1: (sin x / x)(1/cos x). Step 2: 1 × 1 = 1.'
    mistakes:
      '0': c11m12_std
  - prompt: Find lim(x→3) (x³ − 27)/(x² − 9).
    answer: 9/2
    check: 27/6
    difficulty: 3
    hints:
    - Both top and bottom give 0 at x = 3.
    - 'Factor each: a³ − b³ and a² − b².'
    solution: 'Step 1: (x − 3)(x² + 3x + 9)/((x − 3)(x + 3)). Step 2: 27/6 = 9/2.'
    mistakes:
      '3': c11m12_std
      27/9: c11m12_std
- code: cbse11m.calc.derivatives
  title: Derivatives
  after:
  - cbse11m.calc.limits
  notes: |
    Derivative of f at a: f′(a) = lim(h→0) [f(a + h) − f(a)]/h: the slope of the tangent, the instantaneous rate of
    change. Rules: d/dx(xⁿ) = nxⁿ⁻¹; constant → 0; (cf)′ = cf′; (u ± v)′ = u′ ± v′; product (uv)′ = u′v + uv′;
    quotient (u/v)′ = (u′v − uv′)/v². d/dx sin x = cos x; d/dx cos x = −sin x. Example: d/dx(3x² + 5x) = 6x + 5.
  explanations:
    text: 'The derivative measures how fast something changes: the slope of a curve at a point. For powers, bring the power down and reduce it by one: the derivative of x³ is 3x². Sums are differentiated term by term, and there are rules for products and quotients.'
    visual: On the curve y = x², draw a chord from (1, 1) to (1 + h, (1 + h)²). As h shrinks, the chord turns into the tangent at (1, 1), whose slope is 2.
    step_by_step: 'Step 1: Split the function into terms. Step 2: Apply d/dx(xⁿ) = nxⁿ⁻¹ to each. Step 3: Constants vanish. Step 4: Use the product or quotient rule when terms multiply or divide. Step 5: Substitute x for a value.'
    real_world: 'If a stone''s height is h(t) = 20t − 5t², its speed at time t is h′(t) = 20 − 10t: at t = 1 second it is rising at 10 m/s.'
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - xⁿ
      - sin x
      - cos x
    - title: Derivative
      points:
      - nxⁿ⁻¹
      - cos x
      - −sin x
    alt: The derivative of xⁿ is nxⁿ⁻¹, of sin x is cos x, and of cos x is −sin x.
  activity:
    type: formula
    prompt: For y = x³, the secant from x = a to x = a + h has slope ((a + h)³ − a³) ÷ h. As h shrinks it heads to the tangent slope, 3a².
    inputs:
    - name: a
      label: Point a
      min: -3
      max: 3
      step: 1
      start: -3
    - name: h
      label: Step h
      min: 0.01
      max: 1
      step: 0.01
      start: 1
    outputs:
    - name: sec
      label: Secant slope
      expr: ((a+h)^3-a^3)/h
      places: 3
    - name: tan
      label: Tangent slope 3a²
      expr: 3*a^2
    goals:
    - prompt: At a = 1, shrink h until the secant slope is within 0.1 of the tangent slope.
      want:
        a: 1
        sec:
        - 2.9
        - 3.1
      mistakes:
      - when:
          a: 1
          h:
          - 0.5
          - 1
        say: h is still big, so the secant reaches far up the curve and is much steeper than the tangent. Shrink h.
      - when:
          a: 1
          sec:
          - 3.11
          - 3.99
        say: 'Closer. Keep shrinking h: the slope is heading to 3 × 1² = 3.'
    - prompt: Find the point where the tangent to y = x³ is flat.
      want:
        tan: 0
      mistakes:
      - when:
          a: -1
        say: 'At a = −1 the slope is 3(−1)² = +3: squaring makes it positive. x³ rises on both sides of 0; only a = 0 makes 3a² zero.'
    - prompt: At a = 2, shrink h until the secant slope is within 0.5 of the tangent slope.
      want:
        a: 2
        sec:
        - 11.5
        - 12.5
      mistakes:
      - when:
          a: 2
          h:
          - 0.3
          - 1
        say: 'h is too big: the secant is much steeper than the tangent, 3 × 2² = 12.'
      - when:
          a: 2
          sec:
          - 12.51
          - 15
        say: Closer. Shrink h a little more.
  lesson:
    - teach: The derivative f′(a) = lim(h→0) [f(a + h) − f(a)]/h. It is the slope of the tangent at a, the instantaneous rate of change.
      check:
        prompt: 'For f(x) = x², [f(1 + h) − f(1)]/h simplifies to:'
        options:
        - 2 + h
        - h
        - 2h
        answer: 2 + h
        why: (1 + 2h + h² − 1)/h = 2 + h, which tends to 2.
    - teach: Power rule d/dx(xⁿ) = nxⁿ⁻¹. Constants give 0. Sums are differentiated term by term, and constant multiples stay in front.
      check:
        prompt: d/dx (4x³ − 2x + 9) = ?
        options:
        - 12x² − 2
        - 12x² − 2 + 9
        - 4x² − 2
        answer: 12x² − 2
        why: 4·3x² − 2·1 + 0.
    - teach: Product rule (uv)′ = u′v + uv′. Quotient rule (u/v)′ = (u′v − uv′)/v². Also d/dx sin x = cos x and d/dx cos x = −sin x.
      picture:
        kind: compare
        columns:
        - title: Function
          points:
          - xⁿ
          - sin x
          - cos x
          - uv
        - title: Derivative
          points:
          - nxⁿ⁻¹
          - cos x
          - −sin x
          - u′v + uv′
        alt: Common derivatives.
      check:
        prompt: d/dx (x² sin x) = ?
        options:
        - 2x sin x + x² cos x
        - 2x cos x
        - 2x sin x − x² cos x
        answer: 2x sin x + x² cos x
        why: 'u = x², v = sin x: u′v + uv′.'
  items:
  - prompt: Find the derivative of x³ at x = 2.
    answer: '12'
    check: diff(x**3, x).subs(x, 2)
    difficulty: 1
    hints:
    - d/dx x³ = 3x².
    - 3 × 4.
    solution: '12.'
    mistakes:
      '8': c11_power_rule
  - prompt: f(x) = 3x² + 5x − 7. Find f′(1).
    answer: '11'
    check: diff(3*x**2+5*x-7, x).subs(x, 1)
    difficulty: 1
    hints:
    - f′(x) = 6x + 5.
    - 6 + 5.
    solution: '11.'
    mistakes: {"6": "m11_power_rule", "1": "m11_power_rule"}
  - prompt: Find the derivative of x · sin x at x = 0.
    answer: '0'
    check: diff(x*sin(x), x).subs(x, 0)
    difficulty: 2
    hints:
    - 'Product rule: sin x + x cos x.'
    - 'At 0: 0 + 0.'
    solution: '0.'
    mistakes: {"1": "m11_product_rule"}
  - prompt: Find d/dx (x²/(x + 1)) at x = 1.
    answer: 3/4
    check: diff(x**2/(x+1), x).subs(x, 1)
    difficulty: 2
    hints:
    - 'Quotient rule: (2x(x + 1) − x²)/(x + 1)².'
    - (4 − 1)/4.
    solution: 3/4.
    mistakes: {"1": "m11_quotient_rule", "1/2": "m11_quotient_rule"}
  - prompt: A stone's height is h(t) = 20t − 5t². Find its speed h′(1) (in m/s).
    answer: '10'
    check: 20 - 10*1
    difficulty: 2
    hints:
    - h′(t) = 20 − 10t.
    - t = 1.
    solution: 10 m/s.
    mistakes: {"15": "m11_velocity", "20": "m11_velocity"}
  - prompt: What is the derivative of cos x?
    options:
    - −sin x
    - sin x
    - cos x
    - −cos x
    answer: −sin x
    difficulty: 1
    hints:
    - Standard result.
    - Negative sign.
    solution: d/dx cos x = −sin x.
    mistakes: {"sin x": "m11_deriv_cos", "cos x": "m11_deriv_cos", "−cos x": "m11_deriv_cos"}
  - prompt: f(x) = x⁴. Find f′(1).
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Use the power rule.
    - Then substitute x = 1.
    solution: 'Step 1: f′(x) = 4x³. Step 2: f′(1) = 4.'
    mistakes:
      '1': c11m12_rule
      '3': c11m12_rule
  - prompt: f(x) = 5x² − 3x + 2. Find f′(2).
    answer: '17'
    check: 10*2-3
    difficulty: 1
    hints:
    - Differentiate term by term.
    - The constant 2 contributes 0.
    solution: 'Step 1: f′(x) = 10x − 3. Step 2: f′(2) = 17.'
    mistakes:
      '19': c11m12_rule
      '20': c11m12_rule
  - prompt: What is the derivative of sin x?
    options:
    - cos x
    - −cos x
    - −sin x
    answer: cos x
    difficulty: 1
    hints:
    - Think of the slope of the sine curve at x = 0.
    - Its slope there is 1.
    solution: 'Step 1: d/dx sin x is the standard result. Step 2: cos x.'
    mistakes:
      −cos x: c11m12_rule
      −sin x: c11m12_rule
  - prompt: f(x) = 1/x. Find f′(2).
    answer: -1/4
    check: -1/4
    difficulty: 2
    hints:
    - Write 1/x as x⁻¹.
    - Power rule with n = −1.
    solution: 'Step 1: f′(x) = −x⁻² = −1/x². Step 2: f′(2) = −1/4.'
    mistakes:
      1/4: c11m12_rule
      -1/2: c11m12_rule
  - prompt: f(x) = (x + 1)(x − 2). Find f′(3).
    answer: '5'
    check: 2*3-1
    difficulty: 2
    hints:
    - Expand or use the product rule.
    - x² − x − 2 is the expanded form.
    solution: 'Step 1: f′(x) = 2x − 1. Step 2: f′(3) = 5.'
    mistakes:
      '4': c11m12_rule
      '8': c11m12_rule
  - prompt: Find d/dx (x / (x + 2)) at x = 0.
    answer: 1/2
    check: 2/4
    difficulty: 2
    hints:
    - Use the quotient rule.
    - u = x, v = x + 2.
    solution: 'Step 1: (1·(x + 2) − x·1)/(x + 2)² = 2/(x + 2)². Step 2: at 0, 2/4 = 1/2.'
    mistakes:
      '1': c11m12_rule
      '0': c11m12_rule
  - prompt: Find the slope of the tangent to y = x² − 4x at x = 5.
    answer: '6'
    check: 2*5-4
    difficulty: 2
    hints:
    - The slope of the tangent is the derivative.
    - Differentiate, then put x = 5.
    solution: 'Step 1: y′ = 2x − 4. Step 2: 10 − 4 = 6.'
    mistakes:
      '5': c11m12_rule
      '10': c11m12_rule
  - prompt: Find d/dx (sin x · cos x) at x = 0.
    answer: '1'
    check: '1'
    difficulty: 3
    hints:
    - Product rule with u = sin x, v = cos x.
    - cos 0 = 1, sin 0 = 0.
    solution: 'Step 1: cos x · cos x + sin x · (−sin x) = cos²x − sin²x. Step 2: at 0: 1.'
    mistakes:
      '0': c11m12_rule
      '-1': c11m12_rule
  - prompt: Using the first principle, lim(h→0) [(2 + h)³ − 8]/h = ?
    answer: '12'
