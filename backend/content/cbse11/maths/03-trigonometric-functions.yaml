# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-math
chapter: 3
title: Trigonometric Functions
tips:
  c11_radian: To convert degrees to radians multiply by π/180; radians to degrees multiply by 180/π.
  c11_quadrant: 'ASTC: All positive in quadrant I, Sine in II, Tan in III, Cos in IV.'
  m11_allied: "π − x is in the second quadrant, where sine is positive. And π keeps sin as sin."
  m11_arc: "Arc length l = rθ with θ in radians."
  m11_compound: "75° = 45° + 30°. Use sin(A + B) = sin A cos B + cos A sin B with the table values."
  m11_compound_cos: "15° = 45° − 30°. Use cos(A − B) = cos A cos B + sin A sin B. Note the sign is plus."
  m11_cos_double: "cos 2x = 2cos² x − 1. Square first, double, then subtract 1."
  m11_double_angle: "sin 2x = 2 sin x cos x. Don't forget the 2."
  m11_pythag_trig: "Use sin² x + cos² x = 1, or draw a 3-4-5 triangle. In the first quadrant cos is positive."
  m11_rad_deg: "π radians = 180°. Divide 180 by the denominator."
  m11_tan_sum: "tan(A + B) = (tan A + tan B)/(1 − tan A tan B). Work out top and bottom separately."
  m11_trig_values: "Write down sin 30° and cos 60° separately from the table, then add."
concepts:
- code: cbse11m.trig.angles
  title: Radian measure and trigonometric functions
  notes: |
    Angle measure: 360° = 2π radians, so π rad = 180°, 1 rad ≈ 57°16′. Arc length l = rθ (θ in radians). Trigonometric
    functions of any angle via the unit circle: cos x and sin x are the coordinates of the point. sin² x + cos² x = 1,
    1 + tan² x = sec² x. Signs by quadrant (ASTC). Periods: sin, cos 2π; tan π. sin(−x) = −sin x, cos(−x) = cos x.
    Values: sin 30° = 1/2, cos 60° = 1/2, tan 45° = 1, sin 90° = 1.
  explanations:
    text: 'Angles can be measured in radians: a full turn is 2π radians, so π radians = 180°. On a circle of radius r, an angle θ (in radians) cuts an arc of length rθ. On the unit circle, the point at angle x has coordinates (cos x, sin x), which defines trig functions for every angle.'
    visual: 'Draw a unit circle centred at the origin. Mark a point P at angle x from the positive x-axis. Drop a perpendicular to the x-axis: the horizontal distance is cos x and the vertical is sin x.'
    step_by_step: 'Step 1: Convert to radians if needed (× π/180). Step 2: Find the quadrant. Step 3: Use a reference angle for the value. Step 4: Fix the sign using ASTC.'
    real_world: A wheel of radius 35 cm turning through 2 radians moves a point on the rim 70 cm along the arc.
  picture:
    kind: geometry
    points:
      O:
      - 5
      - 5
      P:
      - 8
      - 7.5
      _Q:
      - 8
      - 5
      X:
      - 9.5
      - 5
    segments:
    - - O
      - P
      - '1'
    - - P
      - _Q
      - sin x
    - - O
      - _Q
      - cos x
    - - O
      - X
    angles:
    - at: O
      from: X
      to: P
      label: x
    alt: On a unit circle, the point P at angle x has horizontal distance cos x and vertical distance sin x from the centre O.
  activity:
    type: formula
    prompt: 'π radians is half a turn, 180°. Turn the angle and choose a radius r: the arc it cuts is l = rθ (θ in radians).'
    inputs:
    - name: d
      label: Angle in degrees
      min: 0
      max: 360
      step: 5
      start: 0
      unit: °
    - name: r
      label: Radius r
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: rad
      label: Angle in radians
      expr: d*pi/180
      places: 3
    - name: fr
      label: Angle as a part of π
      expr: d/180
      places: 3
    - name: arc
      label: Arc length l = rθ
      expr: r*d*pi/180
      unit: cm
      places: 2
    goals:
    - prompt: Make an angle of π/4 radians.
      want:
        d: 45
      mistakes:
      - when:
          d: 90
        say: 90° is a quarter turn, which is π/2. π stands for 180°, so π/4 is 180° ÷ 4.
      - when:
          d: 180
        say: 180° is π itself. π/4 is a quarter of that.
    - prompt: Make an angle of 3 radians, as close as the steps allow.
      want:
        rad:
        - 2.95
        - 3.06
      hint: 1 radian ≈ 57.3°. Is 3 radians more or less than half a turn?
      mistakes:
      - when:
          d:
          - 0
          - 15
        say: '3° is tiny. 3 radians means the arc is 3 radii long: almost half a turn.'
      - when:
          d: 180
        say: 180° is π ≈ 3.14 radians, a little more than 3. Turn back slightly.
    - prompt: On a circle of radius 12 cm, make an arc 4π ≈ 12.57 cm long.
      want:
        r: 12
        arc:
        - 12.5
        - 12.6
      mistakes:
      - when:
          r: 12
          d: 30
        say: 'That arc is 2π ≈ 6.28 cm. l = rθ uses the radius, not the diameter: θ = 4π ÷ 12 = π/3.'
      - when:
          r: 12
          d:
          - 5
          - 15
        say: Did you use θ in degrees? l = rθ needs θ in radians. θ = 4π ÷ 12 = π/3 radians.
    - prompt: Make 7π/6 radians, past a half turn.
      want:
        d: 210
      mistakes:
      - when:
          d: 150
        say: 150° is 5π/6, short of a half turn. π/6 is 30°, so 7π/6 is 7 × 30°.
      - when:
          d: 360
        say: 360° is 2π, a full turn. 7π/6 is only a little past π.
  items:
  - prompt: Convert 60° into radians, as a multiple of π. Write the coefficient of π.
    answer: 1/3
    check: Rational(60,180)
    difficulty: 1
    hints:
    - × π/180.
    - 60/180.
    solution: 60° = π/3, so the coefficient is 1/3.
    mistakes:
      '3': c11_radian
  - prompt: Convert π/4 radians into degrees.
    answer: '45'
    check: 180/4
    difficulty: 1
    hints:
    - × 180/π.
    - 180/4.
    solution: π/4 = 45°.
    mistakes: {"90": "m11_rad_deg", "180": "m11_rad_deg"}
  - prompt: A circle has radius 10 cm. Find the arc length for a central angle of 2 radians (in cm).
    answer: '20'
    check: 10*2
    difficulty: 1
    hints:
    - l = rθ.
    - 10 × 2.
    solution: l = 10 × 2 = 20 cm.
    mistakes: {"5": "m11_arc", "10": "m11_arc"}
  - prompt: Find sin 30° + cos 60°.
    answer: '1'
    check: sin(pi/6) + cos(pi/3)
    difficulty: 1
    hints:
    - Both equal 1/2.
    - Add.
    solution: 1/2 + 1/2 = 1.
    mistakes: {"2": "m11_trig_values", "1/2": "m11_trig_values"}
  - prompt: In which quadrant are sine and cosine both negative?
    options:
    - Third
    - First
    - Second
    - Fourth
    answer: Third
    difficulty: 2
    hints:
    - ASTC.
    - Only tan is positive there.
    solution: In quadrant III, sin and cos are negative.
    mistakes:
      Second: c11_quadrant
  - prompt: If sin x = 3/5 and x is in the first quadrant, find cos x.
    answer: 4/5
    check: sqrt(1 - Rational(9,25))
    difficulty: 2
    hints:
    - sin² + cos² = 1.
    - 1 − 9/25 = 16/25.
    solution: cos x = 4/5.
    mistakes: {"3/4": "m11_pythag_trig", "2/5": "m11_pythag_trig"}
- code: cbse11m.trig.identities
  title: Compound angles and trigonometric identities
  after:
  - cbse11m.trig.angles
  notes: |
    sin(x ± y) = sin x cos y ± cos x sin y; cos(x ± y) = cos x cos y ∓ sin x sin y; tan(x + y) = (tan x + tan y)/(1 −
    tan x tan y). Double angle: sin 2x = 2 sin x cos x; cos 2x = cos² x − sin² x = 1 − 2 sin² x = 2 cos² x − 1;
    tan 2x = 2 tan x/(1 − tan² x). sin 3x = 3 sin x − 4 sin³ x. Allied angles: sin(π − x) = sin x, cos(π − x) = −cos x,
    sin(π/2 − x) = cos x. Example: sin 75° = sin(45° + 30°) = (√6 + √2)/4.
  explanations:
    text: 'Compound angle formulas let you find values like sin 75° by splitting it into known angles: 45° + 30°. Double-angle formulas, like sin 2x = 2 sin x cos x, come from putting y = x. These identities simplify expressions and solve equations.'
    visual: Write 75° as 45° + 30° on two adjacent wedges of a circle. Apply sin(A + B) = sin A cos B + cos A sin B with the known values of 45° and 30°.
    step_by_step: 'Step 1: Split the angle into known angles (30°, 45°, 60°, 90°). Step 2: Choose the right formula. Step 3: Substitute values. Step 4: Simplify.'
    real_world: Engineers adding two waves (like sound signals) use these formulas to find the combined wave.
  picture:
    kind: flow
    steps:
    - sin 75°
    - = sin(45° + 30°)
    - = sin 45° cos 30° + cos 45° sin 30°
    - = (√2/2)(√3/2) + (√2/2)(1/2)
    - = (√6 + √2)/4
    alt: Finding sin 75° by splitting it into 45° + 30° and using the sine addition formula.
  activity:
    type: sort
    prompt: Is it an identity, true for every angle? If you think not, try x = 90° or x = y = 90°.
    bins:
    - True for every angle
    - Not always true
    items:
    - label: sin²x + cos²x = 1
      bin: True for every angle
      clue: Picture the unit circle. What is x² + y² on it?
      why: On the unit circle cos x and sin x are the coordinates, and x² + y² = 1 always.
    - label: sin(x + y) = sin x + sin y
      bin: Not always true
      clue: Try x = y = 90°. What is sin 180°?
      why: sin 180° = 0, but sin 90° + sin 90° = 2. sin doesn't split over a sum.
    - label: cos(−x) = cos x
      bin: True for every angle
      clue: Reflect the angle in the x-axis. What happens to its x-coordinate?
      why: 'Turning the other way keeps the x-coordinate, so cos is even: cos(−x) = cos x.'
    - label: sin(−x) = sin x
      bin: Not always true
      clue: Reflect the angle in the x-axis. What happens to its y-coordinate?
      why: 'The y-coordinate changes sign: sin(−x) = −sin x. Try x = 90°: −1, not 1.'
    - label: sin 2x = 2 sin x
      bin: Not always true
      clue: Try x = 90°. What is sin 180°?
      why: sin 180° = 0, but 2 sin 90° = 2. The right rule is sin 2x = 2 sin x cos x.
    - label: sin 2x = 2 sin x cos x
      bin: True for every angle
      clue: Put y = x in sin(x + y). What do you get?
      why: sin(x + x) = sin x cos x + cos x sin x = 2 sin x cos x.
    - label: cos 2x = cos²x − sin²x
      bin: True for every angle
      clue: Put y = x in cos(x + y). What do you get?
      why: cos(x + x) = cos x cos x − sin x sin x.
    - label: 1 + tan²x = sec²x
      bin: True for every angle
      clue: Divide sin²x + cos²x = 1 by cos²x. What comes out?
      why: Dividing every term by cos²x gives tan²x + 1 = sec²x (wherever cos x ≠ 0).
    - label: cos(x + y) = cos x cos y + sin x sin y
      bin: Not always true
      clue: Try x = y = 90°. What is cos 180°?
      why: 'cos 180° = −1, but the right side gives 0 + 1 = 1. The sign is minus: cos x cos y − sin x sin y.'
    - label: sin(π/2 − x) = cos x
      bin: True for every angle
      clue: In a right triangle, what is the sine of the other acute angle?
      why: The complementary angle swaps sine and cosine.
  items:
  - prompt: Find sin 75°.
    options:
    - (√6 + √2)/4
    - (√6 − √2)/4
    - (√3 + 1)/2
    - √3/2
    answer: (√6 + √2)/4
    difficulty: 2
    hints:
    - 75° = 45° + 30°.
    - Use sin(A + B).
    solution: sin 75° = (√6 + √2)/4.
    mistakes: {"(√6 − √2)/4": "m11_compound", "(√3 + 1)/2": "m11_compound", "√3/2": "m11_compound"}
  - prompt: If sin x = 3/5 and cos x = 4/5, find sin 2x.
    answer: 24/25
    check: 2*Rational(3,5)*Rational(4,5)
    difficulty: 1
    hints:
    - sin 2x = 2 sin x cos x.
    - 2 × 3/5 × 4/5.
    solution: sin 2x = 24/25.
    mistakes: {"12/25": "m11_double_angle", "6/5": "m11_double_angle"}
  - prompt: If cos x = 1/3, find cos 2x.
    answer: -7/9
    check: 2*Rational(1,9) - 1
    difficulty: 2
    hints:
    - cos 2x = 2cos² x − 1.
    - 2/9 − 1.
    solution: cos 2x = 2/9 − 1 = −7/9.
    mistakes: {"2/3": "m11_cos_double", "7/9": "m11_cos_double", "-1/3": "m11_cos_double"}
  - prompt: Find cos 15°.
    options:
    - (√6 + √2)/4
    - (√6 − √2)/4
    - (√2 − 1)/2
    - 1/2
    answer: (√6 + √2)/4
    difficulty: 2
    hints:
    - 15° = 45° − 30°.
    - cos(A − B) = cos A cos B + sin A sin B.
    solution: cos 15° = (√6 + √2)/4.
    mistakes: {"(√6 − √2)/4": "m11_compound_cos", "(√2 − 1)/2": "m11_compound_cos", "1/2": "m11_compound_cos"}
  - prompt: 'sin(π − x) equals:'
    options:
    - sin x
    - −sin x
    - cos x
    - −cos x
    answer: sin x
    difficulty: 1
    hints:
    - Quadrant II, sine positive.
    - Allied angle.
    solution: sin(π − x) = sin x.
    mistakes: {"−sin x": "m11_allied", "cos x": "m11_allied", "−cos x": "m11_allied"}
  - prompt: If tan A = 1/2 and tan B = 1/3, find tan(A + B).
    answer: '1'
    check: (Rational(1,2)+Rational(1,3))/(1-Rational(1,6))
    difficulty: 2
    hints:
    - (tan A + tan B)/(1 − tan A tan B).
    - (5/6)/(5/6).
    solution: tan(A + B) = (5/6)/(1 − 1/6) = 1.
    mistakes: {"5/6": "m11_tan_sum", "1/6": "m11_tan_sum"}
