# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse11-math
chapter: 11
title: Introduction to Three Dimensional Geometry
tips:
  c11_octant: 'The signs of (x, y, z) decide the octant: all positive is octant I. Check each sign one at a time.'
  c11_dist3d: 'In 3D add all three squared differences: √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²).'
  m11_collinear_3d: "If Q lies on the segment PR, walking P to Q and then Q to R covers the whole of PR."
  m11_distance_3d: "Subtract coordinates pairwise, square, add, then square-root."
  m11_distance_origin: "Distance = √(x² + y² + z²). Square, add, then take the square root."
  m11_k_distance: "Only z differs, so the distance is |k − 5|. Set it equal to 3, with k > 5."
  m11_octants: "Two lines make 4 quadrants in a plane. The third axis splits each of those into above and below."
  m11_on_axis: "Two of the coordinates are zero. A point like (3, 0, 0) lies along the x-axis. Which coordinate isn't zero here?"
  m11_plane_distance: "The distance from the xy-plane is the height, given by the z-coordinate."
  m11_plane_eq: "A point in the xy-plane has no height above or below it."
  c11m11_coord: Read the coordinates in order (x, y, z). Zero coordinates tell you which axis or plane the point is on.
  c11m11_dist: Subtract matching coordinates, square each difference, add, then take the square root.
  c11m11_sign: 'Write the sign of each coordinate: + or −. The octant is fixed by those three signs.'
concepts:
- code: cbse11m.3d.coords
  title: Coordinates in space
  notes: |
    Three mutually perpendicular axes x, y, z meet at the origin O. A point P(x, y, z): its distances from the yz, zx and
    xy planes. The three coordinate planes divide space into 8 octants (signs of x, y, z). A point on the x-axis is
    (x, 0, 0); in the xy-plane (x, y, 0). Distance from the origin: √(x² + y² + z²).
  explanations:
    text: 'In space we need three numbers to fix a point: (x, y, z). Picture the corner of a room: the floor edges are the x- and y-axes and the vertical edge is the z-axis. The three walls (coordinate planes) split space into 8 octants.'
    visual: Stand in the corner of a room. A fly 3 m along one wall, 4 m along the other and 2 m up is at (3, 4, 2). A point on the floor has z = 0.
    step_by_step: 'Step 1: Read x, y, z. Step 2: A zero coordinate means the point lies in a coordinate plane; two zeros mean it''s on an axis. Step 3: Signs tell the octant.'
    real_world: 'Drones and aircraft report their position with three numbers: two for the map position and one for height.'
  picture:
    kind: geometry
    points:
      O:
      - 3
      - 3
      X:
      - 9
      - 2
      Y:
      - 7
      - 6
      Z:
      - 3
      - 9
    segments:
    - - O
      - X
      - x
    - - O
      - Y
      - y
    - - O
      - Z
      - z
    alt: Three axes x, y and z meeting at the origin O, like the corner of a room.
  activity:
    type: sort
    prompt: Where does each point sit in space? Count how many coordinates are 0.
    bins:
    - On an axis
    - In a coordinate plane
    - Inside an octant
    items:
    - label: (0, 0, 5)
      bin: On an axis
      clue: How many coordinates are 0?
      why: x = y = 0, so the point lies on the z-axis.
    - label: (3, 0, −2)
      bin: In a coordinate plane
      clue: Which coordinate is 0?
      why: y = 0 only, so it lies in the xz-plane.
    - label: (1, 2, 3)
      bin: Inside an octant
      clue: Is any coordinate 0?
      why: 'None is 0, so it is inside an octant: all positive, octant I.'
    - label: (−4, 0, 0)
      bin: On an axis
      clue: How many coordinates are 0?
      why: y = z = 0, so it lies on the x-axis, on the negative side.
    - label: (2, −1, 0)
      bin: In a coordinate plane
      clue: What is z?
      why: z = 0 only, so it lies in the xy-plane.
    - label: (0, 7, −1)
      bin: In a coordinate plane
      clue: Which coordinate is 0?
      why: x = 0 only, so it lies in the yz-plane.
    - label: (−1, −2, −3)
      bin: Inside an octant
      clue: Any zeros at all?
      why: 'No zeros: inside the octant where all three are negative.'
    - label: (5, −5, 2)
      bin: Inside an octant
      clue: Is any coordinate 0?
      why: No zeros, so it is inside an octant, with y negative.
    - label: (0, −3, 0)
      bin: On an axis
      clue: How many coordinates are 0?
      why: x = z = 0, so it lies on the y-axis.
  lesson:
    - teach: 'In space we use three perpendicular axes x, y and z through the origin O. A point is written P(x, y, z): its signed distances from the yz-, zx- and xy-planes.'
      check:
        prompt: The point (4, −2, 7) is how far from the xy-plane?
        options:
        - '7'
        - '4'
        - '2'
        answer: '7'
        why: Distance from the xy-plane is |z| = 7.
    - teach: 'Points on an axis have the other two coordinates 0: on the z-axis (0, 0, z). Points in a coordinate plane have one coordinate 0: in the yz-plane (0, y, z).'
      check:
        prompt: Where does (0, 0, −3) lie?
        options:
        - on the z-axis
        - in the xy-plane
        - on the x-axis
        answer: on the z-axis
        why: x = 0 and y = 0, so only z can vary.
    - teach: 'The three coordinate planes cut space into 8 octants, one for each sign pattern (±, ±, ±). Distance from the origin: √(x² + y² + z²).'
      picture:
        kind: compare
        columns:
        - title: Octant
          points:
          - I
          - II
          - V
          - VIII
        - title: Signs
          points:
          - (+, +, +)
          - (−, +, +)
          - (+, +, −)
          - (+, −, −)
        alt: Some octants and their sign patterns.
      check:
        prompt: Distance of (1, 2, 2) from the origin?
        options:
        - '3'
        - '5'
        - '9'
        answer: '3'
        why: √(1 + 4 + 4) = 3.
  items:
  - prompt: How many octants do the coordinate planes divide space into?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - Each of x, y, z can be + or −.
    - 2 × 2 × 2.
    solution: 8 octants.
    mistakes: {"4": "m11_octants", "6": "m11_octants"}
  - prompt: Find the distance of the point (2, 3, 6) from the origin.
    answer: '7'
    check: sqrt(2**2+3**2+6**2)
    difficulty: 1
    hints:
    - √(4 + 9 + 36).
    - √49.
    solution: '7.'
    mistakes: {"11": "m11_distance_origin", "49": "m11_distance_origin"}
  - prompt: Where does the point (0, 5, 0) lie?
    options:
    - On the y-axis
    - On the x-axis
    - In the xz-plane only
    - In octant I
    answer: On the y-axis
    difficulty: 1
    hints:
    - Two coordinates are zero.
    - Only y is non-zero.
    solution: x = z = 0, so it is on the y-axis.
    mistakes: {"On the x-axis": "m11_on_axis", "In the xz-plane only": "m11_on_axis", "In octant I": "m11_on_axis"}
  - prompt: 'The point (−2, 3, 4) lies in the octant where the signs are:'
    options:
    - (−, +, +)
    - (+, +, +)
    - (−, −, +)
    - (+, −, −)
    answer: (−, +, +)
    difficulty: 1
    hints:
    - Read each sign.
    - x negative.
    solution: Signs (−, +, +).
    mistakes:
      (+, +, +): c11_octant
  - prompt: 'Every point in the xy-plane has:'
    options:
    - z = 0
    - x = 0
    - y = 0
    - x = y
    answer: z = 0
    difficulty: 1
    hints:
    - The floor.
    - No height.
    solution: In the xy-plane z = 0.
    mistakes: {"x = 0": "m11_plane_eq", "y = 0": "m11_plane_eq", "x = y": "m11_plane_eq"}
  - prompt: What is the distance of the point (3, −4, 5) from the xy-plane?
    answer: '5'
    check: abs(5)
    difficulty: 2
    hints:
    - Distance from xy-plane = |z|.
    - '|5|.'
    solution: '5.'
    mistakes: {"3": "m11_plane_distance", "-4": "m11_plane_distance"}
  - prompt: Distance of (6, −2, 3) from the origin?
    answer: '7'
    check: (36+4+9)**0.5
    difficulty: 1
    hints:
    - Square each coordinate.
    - Add, then square root.
    solution: 'Step 1: 36 + 4 + 9 = 49. Step 2: 7.'
    mistakes:
      '11': c11m11_dist
      '49': c11m11_dist
  - prompt: In which octant sign pattern is (−1, −5, 2)?
    options:
    - (−, −, +)
    - (+, −, +)
    - (−, +, −)
    answer: (−, −, +)
    difficulty: 1
    hints:
    - Check each coordinate's sign in order.
    - x, then y, then z.
    solution: 'Step 1: x < 0, y < 0, z > 0. Step 2: (−, −, +).'
    mistakes:
      (+, −, +): c11m11_sign
      (−, +, −): c11m11_sign
  - prompt: 'Every point on the y-axis has the form:'
    options:
    - (0, y, 0)
    - (x, 0, z)
    - (0, 0, z)
    answer: (0, y, 0)
    difficulty: 1
    hints:
    - Moving along the y-axis changes only y.
    - The other two stay zero.
    solution: 'Step 1: x = 0, z = 0. Step 2: (0, y, 0).'
    mistakes:
      (x, 0, z): c11m11_coord
      (0, 0, z): c11m11_coord
  - prompt: Distance of (5, −3, 8) from the yz-plane?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - The yz-plane is where x = 0.
    - Distance is |x|.
    solution: 'Step 1: |x| = 5. Step 2: 5.'
    mistakes:
      '3': c11m11_coord
      '8': c11m11_coord
  - prompt: Foot of the perpendicular from (3, 4, 5) to the xy-plane?
    options:
    - (3, 4, 0)
    - (0, 0, 5)
    - (3, 0, 5)
    answer: (3, 4, 0)
    difficulty: 2
    hints:
    - Drop straight down to z = 0.
    - x and y stay the same.
    solution: 'Step 1: set z = 0. Step 2: (3, 4, 0).'
    mistakes:
      (0, 0, 5): c11m11_coord
      (3, 0, 5): c11m11_coord
  - prompt: How many coordinates are zero for a point in the zx-plane (not on an axis)?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - The zx-plane is y = 0.
    - x and z are free.
    solution: 'Step 1: only y = 0. Step 2: 1 coordinate.'
    mistakes:
      '2': c11m11_coord
      '0': c11m11_coord
  - prompt: Distance of (2, −3, 6) from the z-axis?
    options:
    - √13
    - '6'
    - '7'
    answer: √13
    difficulty: 3
    hints:
    - The nearest point on the z-axis is (0, 0, 6).
    - Only x and y matter.
    solution: 'Step 1: √(2² + 3²). Step 2: √13.'
    mistakes:
      '6': c11m11_coord
      '7': c11m11_dist
  - prompt: Which point lies in octant I?
    options:
    - (1, 2, 3)
    - (−1, 2, 3)
    - (1, −2, 3)
    answer: (1, 2, 3)
    difficulty: 1
    hints:
    - Octant I has all coordinates positive.
    - Check each sign.
    solution: 'Step 1: all positive. Step 2: (1, 2, 3).'
    mistakes:
      (−1, 2, 3): c11m11_sign
      (1, −2, 3): c11m11_sign
  - prompt: Point (a, 0, 0) is 4 units from the origin and a < 0. Find a.
    answer: '-4'
    check: '-4'
    difficulty: 3
    hints:
    - Distance from the origin is |a|.
    - Choose the negative value.
    solution: 'Step 1: |a| = 4. Step 2: a = −4.'
    mistakes:
      '4': c11m11_sign
      '-2': c11m11_dist
- code: cbse11m.3d.distance
  title: Distance between two points in space
  after:
  - cbse11m.3d.coords
  notes: |
    PQ = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²). Uses: show points are collinear (PQ + QR = PR), vertices of a right or
    isosceles triangle, points equidistant from two given points. (Section formula in 3D is no longer in the rationalised
    syllabus.)
  explanations:
    text: 'The distance formula in 3D is like the 2D one with one more term: √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²). It works because of Pythagoras used twice: once across the floor, once up the height.'
    visual: 'Picture a box 2 by 3 by 6. The diagonal from one corner to the opposite corner: across the floor is √(4 + 9), then up 6. Total √(4 + 9 + 36) = 7.'
    step_by_step: 'Step 1: Subtract x''s, y''s and z''s. Step 2: Square each difference. Step 3: Add. Step 4: Take the square root.'
    real_world: The longest stick that fits in a box is its space diagonal, found with this formula.
  picture:
    kind: flow
    steps:
    - 'Floor diagonal: √(Δx² + Δy²)'
    - Add height Δz
    - Pythagoras again
    - Distance = √(Δx² + Δy² + Δz²)
    alt: Using Pythagoras twice, first across the floor and then up the height, gives the 3D distance formula.
  activity:
    type: formula
    prompt: P is fixed at (1, 2, 3). Move Q. PQ = √((x − 1)² + (y − 2)² + (z − 3)²).
    inputs:
    - name: x
      label: Q's x
      min: -6
      max: 10
      step: 1
      start: 0
    - name: y
      label: Q's y
      min: -6
      max: 10
      step: 1
      start: 0
    - name: z
      label: Q's z
      min: -6
      max: 12
      step: 1
      start: 0
    outputs:
    - name: walk
      label: Walk along the edges
      expr: abs(x-1)+abs(y-2)+abs(z-3)
    - name: flat
      label: Distance using x and y only
      expr: sqrt((x-1)^2+(y-2)^2)
      places: 2
    - name: d
      label: PQ
      expr: sqrt((x-1)^2+(y-2)^2+(z-3)^2)
      places: 2
    goals:
    - prompt: Move Q to exactly 7 units from P, with x, y and z all different from P's.
      want:
        d: 7
        flat:
        - 0.5
        - 6.9
      hint: Which three whole numbers have squares adding to 49? Try 2, 3 and 6.
      mistakes:
      - when:
          flat: 7
        say: Q is 7 away across x and y, but it's also above or below P, so PQ is more than 7. Use all three differences.
      - when:
          walk: 7
        say: Walking along the edges takes 7, but the straight line cuts across, so PQ is shorter than 7.
    - prompt: Put Q at the mirror image of P in the xy-plane.
      want:
        x: 1
        y: 2
        z: -3
      mistakes:
      - when:
          x: -1
          y: -2
          z: -3
        say: 'That''s the reflection through the origin. The xy-plane is the floor: only the height z changes sign.'
      - when:
          x: -1
          y: -2
          z: 3
        say: That flips x and y. A mirror in the xy-plane keeps x and y and flips z.
    - prompt: Find a point Q on the x-axis, with x positive, that is 7 units from P.
      want:
        y: 0
        z: 0
        d: 7
        x:
        - 0
        - 10
      mistakes:
      - when:
          y: 0
          z: 0
          x: 8
        say: 'That''s 8 from the origin, but Q must be 7 from P: (x − 1)² + 2² + 3² = 49.'
      - when:
          y: 0
          z: 0
          x: -5
        say: That's 7 from P too, but on the negative side. The question wants x positive.
  lesson:
    - teach: 'Distance between P(x₁, y₁, z₁) and Q(x₂, y₂, z₂): PQ = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²). It is Pythagoras used twice.'
      check:
        prompt: Distance between (1, 1, 1) and (3, 1, 1)?
        options:
        - '2'
        - '4'
        - √2
        answer: '2'
        why: Only x changes, by 2.
    - teach: 'Collinear test: Q lies between P and R on one line exactly when PQ + QR = PR.'
      picture:
        kind: flow
        steps:
        - find PQ
        - find QR
        - find PR
        - check PQ + QR = PR
        alt: Steps to test three points for collinearity.
      check:
        prompt: PQ = 3, QR = 4, PR = 7. Are P, Q, R collinear?
        options:
        - 'Yes'
        - 'No'
        - Cannot tell
        answer: 'Yes'
        why: 3 + 4 = 7.
    - teach: 'Distances also check shapes: a triangle is right-angled if the squares of two sides add to the square of the third, and isosceles if two sides are equal.'
      check:
        prompt: 'Sides squared are 9, 16 and 25. The triangle is:'
        options:
        - right-angled
        - equilateral
        - not a triangle
        answer: right-angled
        why: 9 + 16 = 25.
  items:
  - prompt: Find the distance between (1, 2, 3) and (4, 6, 15).
    answer: '13'
    check: sqrt(3**2+4**2+12**2)
    difficulty: 1
    hints:
    - Differences 3, 4, 12.
    - √(9 + 16 + 144).
    solution: √169 = 13.
    mistakes: {"19": "m11_distance_3d", "169": "m11_distance_3d"}
  - prompt: Find the distance between (2, −1, 3) and (−2, 1, 3).
    options:
    - 2√5
    - √6
    - '6'
    - 4√2
    answer: 2√5
    difficulty: 2
    hints:
    - Differences −4, 2, 0.
    - √(16 + 4).
    solution: √20 = 2√5.
    mistakes: {"√6": "m11_distance_3d", "6": "m11_distance_3d", "4√2": "m11_distance_3d"}
  - prompt: A box is 2 m by 3 m by 6 m. Find the length of its longest diagonal (in m).
    answer: '7'
    check: sqrt(4+9+36)
    difficulty: 1
    hints:
    - √(4 + 9 + 36).
    - √49.
    solution: 7 m.
    mistakes: {"11": "m11_distance_origin", "49": "m11_distance_origin"}
  - prompt: 'P, Q and R are collinear (Q between) if:'
    options:
    - PQ + QR = PR
    - PQ = QR = PR
    - PQ × QR = PR
    - PQ − QR = 0
    answer: PQ + QR = PR
    difficulty: 2
    hints:
    - Q lies on the segment PR.
    - Lengths add.
    solution: Collinear with Q between means PQ + QR = PR.
    mistakes: {"PQ = QR = PR": "m11_collinear_3d", "PQ × QR = PR": "m11_collinear_3d", "PQ − QR = 0": "m11_collinear_3d"}
  - prompt: Find the distance between (0, 0, 0) and (1, 1, 1).
    options:
    - √3
    - '3'
    - '1'
    - √2
    answer: √3
    difficulty: 1
    hints:
    - √(1 + 1 + 1).
    - √3.
    solution: √3.
    mistakes: {"3": "m11_distance_3d", "1": "m11_distance_3d", "√2": "m11_distance_3d"}
  - prompt: Find k if the distance between (1, 2, k) and (1, 2, 5) is 3 and k > 5.
    answer: '8'
    check: 5 + 3
    difficulty: 2
    hints:
    - Only z differs.
    - '|k − 5| = 3.'
    solution: k = 8.
    mistakes: {"2": "m11_k_distance", "5": "m11_k_distance"}
  - prompt: Distance between (2, 3, 5) and (4, 3, 1)?
    options:
    - 2√5
    - √20 + 1
    - '6'
    answer: 2√5
    difficulty: 1
    hints:
    - 'Differences: 2, 0, −4.'
    - √(4 + 0 + 16).
    solution: 'Step 1: √20. Step 2: 2√5.'
    mistakes:
      √20 + 1: c11m11_dist
      '6': c11m11_dist
  - prompt: Distance between (−1, 3, 4) and (1, −3, 1)?
    answer: '7'
    check: (4+36+9)**0.5
    difficulty: 2
    hints:
    - 'Differences: 2, −6, −3.'
    - Square and add.
    solution: 'Step 1: 4 + 36 + 9 = 49. Step 2: 7.'
    mistakes:
      '5': c11m11_dist
      '49': c11m11_dist
  - prompt: A room is 3 m × 4 m × 12 m. Length of its longest diagonal (m)?
    answer: '13'
    check: (9+16+144)**0.5
    difficulty: 2
    hints:
    - Corner to opposite corner.
    - √(3² + 4² + 12²).
    solution: 'Step 1: √169. Step 2: 13 m.'
    mistakes:
      '19': c11m11_dist
      '5': c11m11_dist
  - prompt: Find y > 0 if the distance between (0, y, 0) and (0, 0, 0) is 9.
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - Only y is non-zero.
    - Distance = |y|.
    solution: 'Step 1: |y| = 9. Step 2: y = 9.'
    mistakes:
      '3': c11m11_dist
      '81': c11m11_dist
  - prompt: Are (0, 0, 0), (1, 1, 1) and (2, 2, 2) collinear?
    options:
    - 'Yes'
    - 'No'
    - Only in octant I
    answer: 'Yes'
    difficulty: 2
    hints:
    - Find the three distances.
    - √3 + √3 = ?
    solution: 'Step 1: PQ = √3, QR = √3, PR = 2√3. Step 2: √3 + √3 = 2√3, collinear.'
    mistakes:
      'No': c11m11_dist
      Only in octant I: c11m11_sign
  - prompt: Find k > 0 if the distance between (k, 0, 0) and (0, 4, 0) is 5.
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - k² + 16 = 25.
    - Solve for k.
    solution: 'Step 1: k² = 9. Step 2: k = 3.'
    mistakes:
      '1': c11m11_dist
      '9': c11m11_dist
  - prompt: Triangle with A(0, 0, 0), B(3, 0, 0), C(0, 4, 0). Length of BC?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - 'Differences: −3, 4, 0.'
    - √(9 + 16).
    solution: 'Step 1: √25. Step 2: 5.'
    mistakes:
      '7': c11m11_dist
      '1': c11m11_dist
  - prompt: Is the triangle A(0, 0, 0), B(3, 0, 0), C(0, 4, 0) right-angled?
    options:
    - Yes, at A
    - Yes, at B
    - 'No'
    answer: Yes, at A
    difficulty: 3
    hints:
    - AB² = 9, AC² = 16, BC² = 25.
    - Which angle is opposite the longest side?
    solution: 'Step 1: 9 + 16 = 25. Step 2: right angle opposite BC, at A.'
    mistakes:
      Yes, at B: c11m11_dist
      'No': c11m11_dist
  - prompt: Distance between (a, b, c) and (a, b, c + 6)?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Only one coordinate changes.
    - By how much?
    solution: 'Step 1: Δz = 6. Step 2: distance 6.'
