# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse11-math
chapter: 13
title: Statistics
tips:
  c11_variance: Variance is the mean of the squared deviations from the mean; standard deviation is its square root.
  c11_cv: Coefficient of variation = (σ ÷ mean) × 100. The smaller CV is the more consistent series.
  m11_cv: "CV = (σ / mean) × 100."
  m11_dispersion_why: "Compare 49, 50, 51 with 0, 50, 100. Same mean, very different data. What does the mean miss?"
  m11_mean: "Add all values and divide by how many there are."
  m11_mean_dev: "Take |x − mean| for each value (no negatives), add them, and divide by the number of values."
  m11_median: "Sort the data first, then pick the middle value."
  m11_range_stat: "Range = largest value − smallest value."
  m11_sd: "Standard deviation is the square root of the variance."
  m11_shift_sd: "Adding the same number to every value moves the data but does not stretch it."
  m11_variance: "Variance = mean of the squared deviations from the mean."
  c11m13_md: Find the mean first, then the distance of each value from it (ignore signs), then average those distances.
  c11m13_var: Square each deviation from the mean before averaging. Standard deviation is the square root of variance.
  c11m13_shift: Adding a constant moves the data but not its spread. Multiplying stretches the spread.
concepts:
- code: cbse11m.stat.dispersion
  title: 'Measures of dispersion: range and mean deviation'
  notes: |
    Dispersion measures how spread out data are. Range = max − min. Mean deviation about the mean (or median):
    M.D. = Σ|xᵢ − x̄|/n (ungrouped); for frequency data Σfᵢ|xᵢ − x̄|/N. Example: 3, 4, 5, 6, 7 → mean 5, deviations 2, 1, 0,
    1, 2 → M.D. = 6/5 = 1.2. Two sets can have the same mean but very different spreads.
  explanations:
    text: 'Averages don''t tell the whole story: two classes can have the same average mark but very different spreads. Range (largest − smallest) is a quick measure. Mean deviation is the average distance of the values from the mean.'
    visual: 'Plot 3, 4, 5, 6, 7 on a number line with the mean 5 marked. Draw arrows from each value to 5: lengths 2, 1, 0, 1, 2. Their average, 1.2, is the mean deviation.'
    step_by_step: 'Step 1: Find the mean. Step 2: Find each value''s distance from the mean (ignore signs). Step 3: Add these distances. Step 4: Divide by the number of values.'
    real_world: Two batsmen both average 50 runs; the one with smaller spread in scores is more dependable.
  picture:
    kind: number_line
    from: 2
    to: 8
    step: 1
    points:
    - at: 3
      label: '3'
    - at: 4
      label: '4'
    - at: 5
      label: mean 5
    - at: 6
      label: '6'
    - at: 7
      label: '7'
    alt: The values 3, 4, 5, 6 and 7 around their mean 5; their distances from the mean are 2, 1, 0, 1 and 2.
  activity:
    type: formula
    prompt: Four marks. Range = biggest − smallest. Mean deviation = the average distance of the marks from their mean.
    inputs:
    - name: w
      label: Mark 1
      min: 0
      max: 16
      step: 1
      start: 2
    - name: x
      label: Mark 2
      min: 0
      max: 16
      step: 1
      start: 6
    - name: y
      label: Mark 3
      min: 0
      max: 16
      step: 1
      start: 12
    - name: z
      label: Mark 4
      min: 0
      max: 16
      step: 1
      start: 14
    outputs:
    - name: mean
      label: Mean
      expr: (w+x+y+z)/4
      places: 2
    - name: rng
      label: Range
      expr: max(max(w,x),max(y,z))-min(min(w,x),min(y,z))
    - name: md
      label: Mean deviation
      expr: (abs(w-(w+x+y+z)/4)+abs(x-(w+x+y+z)/4)+abs(y-(w+x+y+z)/4)+abs(z-(w+x+y+z)/4))/4
      places: 2
    goals:
    - prompt: Make the mean 10 and the range 0.
      want:
        mean: 10
        rng: 0
      mistakes:
      - when:
          mean: 10
          rng:
          - 1
          - 16
        say: The mean is 10, but the marks differ. A range of 0 means every mark is the same.
    - prompt: Keep the mean at 10, but make the mean deviation 5.
      want:
        mean: 10
        md: 5
      mistakes:
      - when:
          mean: 10
          rng: 5
        say: 'A range of 5 isn''t a mean deviation of 5. MD averages how far EACH mark is from 10: every mark must be 5 away.'
      - when:
          mean: 10
          md:
          - 0
          - 4.9
        say: Spread the marks further from 10.
    - prompt: 'Mean 10, range 10, mean deviation 2.5: same range, less spread.'
      want:
        mean: 10
        rng: 10
        md: 2.5
      mistakes:
      - when:
          mean: 10
          rng: 10
          md: 5
        say: Every mark sits at an end (5 or 15), so the MD is 5. Pull two marks in to the mean, 10.
  lesson:
    - teach: Two classes can have the same average mark but very different spreads. Dispersion measures that spread. The simplest is the range = largest − smallest.
      check:
        prompt: Range of 8, 15, 3, 11?
        options:
        - '12'
        - '15'
        - '8'
        answer: '12'
        why: 15 − 3 = 12.
    - teach: 'Mean deviation about the mean: find x̄, take |xᵢ − x̄| for each value, then average: M.D. = Σ|xᵢ − x̄|/n. The absolute value stops + and − deviations cancelling.'
      check:
        prompt: Why use |xᵢ − x̄| and not (xᵢ − x̄)?
        options:
        - the plain deviations always add to 0
        - to make numbers bigger
        - the mean is unknown
        answer: the plain deviations always add to 0
        why: Σ(xᵢ − x̄) = 0 for any data, so it says nothing about spread.
    - teach: For frequency data use M.D. = Σfᵢ|xᵢ − x̄|/N, where N = Σfᵢ. Mean deviation can also be taken about the median.
      picture:
        kind: flow
        steps:
        - Find the mean
        - Find |xᵢ − x̄|
        - Add them
        - Divide by n
        alt: Steps for mean deviation.
      check:
        prompt: Data 1, 3, 5 (mean 3). Mean deviation about the mean?
        options:
        - 4/3
        - '2'
        - '0'
        answer: 4/3
        why: Deviations 2, 0, 2 add to 4; 4/3.
  items:
  - prompt: Find the range of 12, 7, 19, 3, 15.
    answer: '16'
    check: 19 - 3
    difficulty: 1
    hints:
    - Largest − smallest.
    - 19 − 3.
    solution: '16.'
    mistakes: {"12": "m11_range_stat", "19": "m11_range_stat"}
  - prompt: Find the mean deviation about the mean of 3, 4, 5, 6, 7.
    answer: 6/5
    check: Rational(2+1+0+1+2,5)
    difficulty: 2
    hints:
    - Mean 5.
    - Distances 2, 1, 0, 1, 2.
    solution: 6/5 = 1.2.
    mistakes: {"0": "m11_mean_dev", "2": "m11_mean_dev"}
  - prompt: Find the mean of 2, 4, 6, 8, 10.
    answer: '6'
    check: Rational(30,5)
    difficulty: 1
    hints:
    - Add and divide by 5.
    - 30/5.
    solution: '6.'
    mistakes: {"5": "m11_mean", "30": "m11_mean"}
  - prompt: Find the mean deviation about the mean of 2, 4, 6, 8, 10.
    answer: 12/5
    check: Rational(12,5)
    difficulty: 2
    hints:
    - Distances 4, 2, 0, 2, 4.
    - 12/5.
    solution: 12/5 = 2.4.
    mistakes: {"0": "m11_mean_dev", "4": "m11_mean_dev"}
  - prompt: Why do we need measures of dispersion?
    options:
    - Two data sets can have the same mean but different spreads
    - The mean is always wrong
    - To find the largest value only
    - To avoid using numbers
    answer: Two data sets can have the same mean but different spreads
    difficulty: 1
    hints:
    - Average hides spread.
    - Consistency.
    solution: The mean alone doesn't show how spread out data are.
    mistakes: {"The mean is always wrong": "m11_dispersion_why", "To find the largest value only": "m11_dispersion_why", "To avoid using numbers": "m11_dispersion_why"}
  - prompt: Find the median of 3, 9, 4, 7, 5.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 'Order: 3, 4, 5, 7, 9.'
    - Middle value.
    solution: '5.'
    mistakes: {"4": "m11_median", "7": "m11_median"}
  - prompt: Find the range of 45, 32, 60, 28, 51.
    answer: '32'
    check: 60-28
    difficulty: 1
    hints:
    - Find the largest and the smallest.
    - Subtract.
    solution: 'Step 1: max 60, min 28. Step 2: 32.'
    mistakes:
      '60': c11m13_md
      '28': c11m13_md
  - prompt: Find the mean deviation about the mean of 4, 6, 8.
    answer: 4/3
    check: 4/3
    difficulty: 1
    hints:
    - The mean is the middle value here.
    - 'Deviations from it: 2, 0, 2.'
    solution: 'Step 1: mean 6; |deviations| 2, 0, 2. Step 2: 4/3.'
    mistakes:
      '0': c11m13_md
      '2': c11m13_md
  - prompt: Find the mean deviation about the mean of 10, 20, 30, 40.
    answer: '10'
    check: 40/4
    difficulty: 2
    hints:
    - Mean = 100/4.
    - Deviations are 15, 5, 5, 15.
    solution: 'Step 1: mean 25; |deviations| 15, 5, 5, 15 = 40. Step 2: 40/4 = 10.'
    mistakes:
      '0': c11m13_md
      '15': c11m13_md
  - prompt: Find the mean deviation about the median of 2, 5, 6, 9, 13.
    answer: '3'
    check: 15/5
    difficulty: 2
    hints:
    - The median of 5 sorted values is the third.
    - Add |xᵢ − 6| and divide by 5.
    solution: 'Step 1: median 6; |deviations| 4, 1, 0, 3, 7 = 15. Step 2: 15/5 = 3.'
    mistakes:
      '15': c11m13_md
      '6': c11m13_md
  - prompt: Values 1, 2, 3 with frequencies 2, 1, 2. Find the mean deviation about the mean.
    answer: 4/5
    check: 4/5
    difficulty: 3
    hints:
    - N = 5 and the mean is 10/5.
    - Weight each |xᵢ − x̄| by its frequency.
    solution: 'Step 1: mean 2; Σf|x − 2| = 2(1) + 1(0) + 2(1) = 4. Step 2: 4/5.'
    mistakes:
      2/3: c11m13_md
      '0': c11m13_md
  - prompt: 'Sets A: 5, 5, 5, 5 and B: 0, 5, 5, 10 have the same mean. Which has the larger mean deviation?'
    options:
    - B
    - A
    - they are equal
    answer: B
    difficulty: 1
    hints:
    - Same mean, 5.
    - Which set has values far from 5?
    solution: 'Step 1: A''s deviations are all 0. Step 2: B has deviations 5, 0, 0, 5, so B.'
    mistakes:
      A: c11m13_md
      they are equal: c11m13_md
  - prompt: Find the mean of 7, 9, 11, 13, 15.
    answer: '11'
    check: 55/5
    difficulty: 1
    hints:
    - Add all five values.
    - Divide by 5.
    solution: 'Step 1: sum 55. Step 2: 55/5 = 11.'
    mistakes:
      '55': c11m13_md
      '9': c11m13_md
  - prompt: 'The sum of the deviations (xᵢ − x̄) of any data from its mean is:'
    options:
    - '0'
    - n
    - the range
    answer: '0'
    difficulty: 2
    hints:
    - Values above and below the mean balance.
    - Try 1, 2, 3.
    solution: 'Step 1: Σxᵢ − n x̄ = n x̄ − n x̄. Step 2: 0.'
    mistakes:
      n: c11m13_md
      the range: c11m13_md
  - prompt: Find the mean deviation about the mean of 3, 7, 7, 19.
    answer: '5'
    check: 20/4
    difficulty: 3
    hints:
    - Mean = 36/4.
    - 'Deviations from 9: 6, 2, 2, 10.'
    solution: 'Step 1: mean 9; Σ|d| = 6 + 2 + 2 + 10 = 20. Step 2: 20/4 = 5.'
    mistakes:
      '9': c11m13_md
      '4': c11m13_md
- code: cbse11m.stat.variance
  title: Variance and standard deviation
  after:
  - cbse11m.stat.dispersion
  notes: |
    Variance σ² = Σ(xᵢ − x̄)²/n = Σxᵢ²/n − x̄². Standard deviation σ = √variance. For frequency data use fᵢ. Adding a
    constant to every value doesn't change σ; multiplying by k multiplies σ by |k|. Coefficient of variation CV =
    (σ/x̄) × 100: compares variability; lower CV = more consistent. Example 2, 4, 6, 8, 10: mean 6, variance 8, σ = 2√2.
  explanations:
    text: 'Variance is the average of the squared distances from the mean; standard deviation is its square root, back in the original units. To compare consistency of two series with different means, use the coefficient of variation, σ/mean × 100: the lower one is more consistent.'
    visual: 'For 2, 4, 6, 8, 10 with mean 6, draw squares on each deviation: sides 4, 2, 0, 2, 4, areas 16, 4, 0, 4, 16. The average area, 8, is the variance.'
    step_by_step: 'Step 1: Find the mean. Step 2: Square each deviation. Step 3: Average the squares: variance. Step 4: Square root: standard deviation. Step 5: CV = σ/mean × 100 to compare.'
    real_world: Factories measure the standard deviation of bottle volumes; a small σ means each bottle is filled almost exactly the same.
  picture:
    kind: bars
    bars:
    - label: '2'
      value: 16
    - label: '4'
      value: 4
    - label: '6'
      value: 0
    - label: '8'
      value: 4
    - label: '10'
      value: 16
    alt: 'Squared deviations from the mean 6 for the values 2, 4, 6, 8, 10: 16, 4, 0, 4 and 16, which average to a variance of 8.'
  activity:
    type: formula
    prompt: The data 2, 4, 4, 4, 5, 5, 7, 9 has mean 5 and σ = 2. Change every value to m × value + k.
    inputs:
    - name: m
      label: Multiply by m
      min: -4
      max: 4
      step: 0.5
      start: 1
    - name: k
      label: Then add k
      min: -10
      max: 15
      step: 1
      start: 0
    outputs:
    - name: mean
      label: New mean
      expr: 5*m+k
      places: 2
    - name: sd
      label: New σ
      expr: 2*abs(m)
      places: 2
    - name: var
      label: New variance σ²
      expr: 4*m^2
      places: 2
    goals:
    - prompt: Keep m = 1. Add a number so the mean becomes 12.
      want:
        m: 1
        mean: 12
      mistakes:
      - when:
          m: 1
          k: 12
        say: 'Adding 12 makes the mean 17: k is added to the old mean of 5.'
    - prompt: Make σ = 6.
      want:
        sd: 6
      mistakes:
      - when:
          m: 1
          k:
          - -10
          - 10
        say: 'Adding moves every value along but keeps the gaps, so σ stays 2. Stretch the data: change m.'
      - when:
          m: 1.5
        say: '×1.5 makes σ = 3. σ scales by the same factor as the data: 2 × ? = 6.'
    - prompt: Make the variance 16.
      want:
        var: 16
      mistakes:
      - when:
          m: 4
        say: ×4 makes σ = 8 and the variance 64. Variance scales by m², so m² = 4.
      - when:
          m: -4
        say: ×(−4) makes σ = 8 and the variance 64. Variance scales by m², so m² = 4.
  lesson:
    - teach: 'Variance squares each deviation before averaging: σ² = Σ(xᵢ − x̄)²/n. Squaring makes every deviation positive and weights big ones more.'
      check:
        prompt: Data 1, 3 (mean 2). Variance?
        options:
        - '1'
        - '2'
        - '0'
        answer: '1'
        why: Deviations −1, 1; squares 1, 1; average 1.
    - teach: 'Standard deviation σ = √variance, in the same units as the data. A short-cut: σ² = Σxᵢ²/n − x̄².'
      check:
        prompt: Variance is 49. Standard deviation?
        options:
        - '7'
        - '49'
        - '24.5'
        answer: '7'
        why: σ = √49 = 7.
    - teach: 'Adding a constant to every value leaves σ unchanged. Multiplying every value by k multiplies σ by |k|. The coefficient of variation CV = σ/x̄ × 100 compares spread: lower CV means more consistent.'
      picture:
        kind: compare
        columns:
        - title: Change to data
          points:
          - add 10
          - multiply by 3
        - title: Effect on σ
          points:
          - same σ
          - 3σ
        alt: How shifting and scaling data change the standard deviation.
      check:
        prompt: σ = 2. Every value is multiplied by 5. New σ?
        options:
        - '10'
        - '2'
        - '7'
        answer: '10'
        why: σ is multiplied by |5|.
  items:
  - prompt: Find the variance of 2, 4, 6, 8, 10.
    answer: '8'
    check: Rational(16+4+0+4+16,5)
    difficulty: 2
    hints:
    - Mean 6; squared deviations 16, 4, 0, 4, 16.
    - 40/5.
    solution: Variance = 8.
    mistakes:
      '6': c11_variance
  - prompt: If the variance is 25, what is the standard deviation?
    answer: '5'
    check: sqrt(25)
    difficulty: 1
    hints:
    - σ = √variance.
    - √25.
    solution: '5.'
    mistakes: {"25": "m11_sd", "625": "m11_sd", "12.5": "m11_sd"}
  - prompt: Find the variance of 1, 2, 3, 4, 5.
    answer: '2'
    check: Rational(10,5)
    difficulty: 2
    hints:
    - Mean 3; squared deviations 4, 1, 0, 1, 4.
    - 10/5.
    solution: '2.'
    mistakes: {"3": "m11_variance", "10": "m11_variance", "1": "m11_variance"}
  - prompt: A series has mean 50 and standard deviation 10. Find its coefficient of variation (%).
    answer: '20'
    check: Rational(10,50)*100
    difficulty: 1
    hints:
    - σ/mean × 100.
    - 10/50 × 100.
    solution: 20%.
    mistakes: {"5": "m11_cv", "500": "m11_cv"}
  - prompt: Series A has CV 15% and series B has CV 25%. Which is more consistent?
    options:
    - A
    - B
    - Both equal
    - Cannot tell
    answer: A
    difficulty: 1
    hints:
    - Lower CV.
    - Less variation.
    solution: A has the lower CV, so it is more consistent.
    mistakes:
      B: c11_cv
  - prompt: Each value in a data set with σ = 4 is increased by 7. What is the new standard deviation?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Adding a constant shifts all values.
    - Spread is unchanged.
    solution: σ stays 4.
    mistakes: {"11": "m11_shift_sd", "28": "m11_shift_sd"}
  - prompt: Find the variance of 4, 8.
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - The mean is halfway between.
    - Deviations are −2 and +2.
    solution: 'Step 1: mean 6; squares 4, 4. Step 2: 8/2 = 4.'
    mistakes:
      '2': c11m13_var
      '8': c11m13_var
  - prompt: If the variance is 0.36, what is the standard deviation?
    answer: '0.6'
    check: '0.6'
    difficulty: 1
    hints:
    - Standard deviation is a square root.
    - 0.6 × 0.6 = ?
    solution: 'Step 1: σ = √0.36. Step 2: 0.6.'
    mistakes:
      '0.18': c11m13_var
      '0.06': c11m13_var
  - prompt: Find the variance of 3, 5, 7.
    answer: 8/3
    check: 8/3
    difficulty: 2
    hints:
    - Mean is 5.
    - 'Squared deviations: 4, 0, 4.'
    solution: 'Step 1: Σd² = 8. Step 2: 8/3.'
    mistakes:
      4/3: c11m13_var
      '2': c11m13_var
  - prompt: For 5 values, Σx = 20 and Σx² = 100. Find the variance.
    answer: '4'
    check: 100/5-(20/5)**2
    difficulty: 2
    hints:
    - Use σ² = Σx²/n − x̄².
    - x̄ = 20/5.
    solution: 'Step 1: 100/5 = 20, x̄ = 4. Step 2: 20 − 16 = 4.'
    mistakes:
      '20': c11m13_var
      '16': c11m13_var
  - prompt: Each value of a data set with σ = 3 is multiplied by −2. New standard deviation?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Standard deviation can never be negative.
    - Use |k|.
    solution: 'Step 1: σ becomes |−2| × 3. Step 2: 6.'
    mistakes:
      '-6': c11m13_shift
      '3': c11m13_shift
  - prompt: Mean 40, σ = 8. Find the coefficient of variation (%).
    answer: '20'
    check: 8/40*100
    difficulty: 1
    hints:
    - CV = σ / mean × 100.
    - 8/40 = 0.2.
    solution: 'Step 1: 8/40 = 0.2. Step 2: 20%.'
    mistakes:
      '5': c11m13_var
      '32': c11m13_var
  - prompt: 'Batsman P: mean 50, σ 15. Batsman Q: mean 40, σ 8. Who is more consistent?'
    options:
    - Q
    - P
    - both equally
    answer: Q
    difficulty: 2
    hints:
    - Compare CVs, not means.
    - Lower CV means more consistent.
    solution: 'Step 1: CV(P) = 30%, CV(Q) = 20%. Step 2: Q.'
    mistakes:
      P: c11m13_var
      both equally: c11m13_var
  - prompt: 'If every value is increased by 5, the variance:'
    options:
    - stays the same
    - increases by 5
    - increases by 25
    answer: stays the same
    difficulty: 2
    hints:
    - The mean also moves by 5.
    - Look at xᵢ − x̄.
    solution: 'Step 1: each deviation xᵢ − x̄ is unchanged. Step 2: variance stays the same.'
    mistakes:
      increases by 5: c11m13_shift
      increases by 25: c11m13_shift
  - prompt: Find the standard deviation of 2, 4, 4, 4, 5, 5, 7, 9.
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Mean = 40/8.
    - Squared deviations add to 32.
    solution: 'Step 1: mean 5; Σd² = 9 + 1 + 1 + 1 + 0 + 0 + 4 + 16 = 32. Step 2: σ² = 4, σ = 2.'
    mistakes:
      '4': c11m13_var
      '32': c11m13_var
