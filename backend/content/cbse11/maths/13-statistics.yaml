# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse11-math
chapter: 13
title: Statistics
tips:
  c11_variance: Variance is the mean of the squared deviations from the mean; standard deviation is its square root.
  c11_cv: Coefficient of variation = (σ ÷ mean) × 100. The smaller CV is the more consistent series.
concepts:
- code: cbse11m.stat.dispersion
  title: 'Measures of dispersion: range and mean deviation'
  notes: |
    Dispersion measures how spread out data are. Range = max − min. Mean deviation about the mean (or median):
    M.D. = Σ|xᵢ − x̄|/n (ungrouped); for frequency data Σfᵢ|xᵢ − x̄|/N. Example: 3, 4, 5, 6, 7 → mean 5, deviations 2, 1, 0,
    1, 2 → M.D. = 6/5 = 1.2. Two sets can have the same mean but very different spreads.
  explanations:
    text: 'Averages don''t tell the whole story: two classes can have the same average mark but very different spreads. Range (largest − smallest) is a quick measure. Mean deviation is the average distance of the values from the mean.'
    visual: 'Plot 3, 4, 5, 6, 7 on a number line with the mean 5 marked. Draw arrows from each value to 5: lengths 2, 1, 0, 1, 2. Their average, 1.2, is the mean deviation.'
    step_by_step: 'Step 1: Find the mean. Step 2: Find each value''s distance from the mean (ignore signs). Step 3: Add these distances. Step 4: Divide by the number of values.'
    real_world: Two batsmen both average 50 runs; the one with smaller spread in scores is more dependable.
  picture:
    kind: number_line
    from: 2
    to: 8
    step: 1
    points:
    - at: 3
      label: '3'
    - at: 4
      label: '4'
    - at: 5
      label: mean 5
    - at: 6
      label: '6'
    - at: 7
      label: '7'
    alt: The values 3, 4, 5, 6 and 7 around their mean 5; their distances from the mean are 2, 1, 0, 1 and 2.
  activity:
    type: formula
    prompt: Four marks. Range = biggest − smallest. Mean deviation = the average distance of the marks from their mean.
    inputs:
    - name: w
      label: Mark 1
      min: 0
      max: 16
      step: 1
      start: 2
    - name: x
      label: Mark 2
      min: 0
      max: 16
      step: 1
      start: 6
    - name: y
      label: Mark 3
      min: 0
      max: 16
      step: 1
      start: 12
    - name: z
      label: Mark 4
      min: 0
      max: 16
      step: 1
      start: 14
    outputs:
    - name: mean
      label: Mean
      expr: (w+x+y+z)/4
      places: 2
    - name: rng
      label: Range
      expr: max(max(w,x),max(y,z))-min(min(w,x),min(y,z))
    - name: md
      label: Mean deviation
      expr: (abs(w-(w+x+y+z)/4)+abs(x-(w+x+y+z)/4)+abs(y-(w+x+y+z)/4)+abs(z-(w+x+y+z)/4))/4
      places: 2
    goals:
    - prompt: Make the mean 10 and the range 0.
      want:
        mean: 10
        rng: 0
      mistakes:
      - when:
          mean: 10
          rng:
          - 1
          - 16
        say: The mean is 10, but the marks differ. A range of 0 means every mark is the same.
    - prompt: Keep the mean at 10, but make the mean deviation 5.
      want:
        mean: 10
        md: 5
      mistakes:
      - when:
          mean: 10
          rng: 5
        say: 'A range of 5 isn''t a mean deviation of 5. MD averages how far EACH mark is from 10: every mark must be 5 away.'
      - when:
          mean: 10
          md:
          - 0
          - 4.9
        say: Spread the marks further from 10.
    - prompt: 'Mean 10, range 10, mean deviation 2.5: same range, less spread.'
      want:
        mean: 10
        rng: 10
        md: 2.5
      mistakes:
      - when:
          mean: 10
          rng: 10
          md: 5
        say: Every mark sits at an end (5 or 15), so the MD is 5. Pull two marks in to the mean, 10.
  items:
  - prompt: Find the range of 12, 7, 19, 3, 15.
    answer: '16'
    check: 19 - 3
    difficulty: 1
    hints:
    - Largest − smallest.
    - 19 − 3.
    solution: '16.'
  - prompt: Find the mean deviation about the mean of 3, 4, 5, 6, 7.
    answer: 6/5
    check: Rational(2+1+0+1+2,5)
    difficulty: 2
    hints:
    - Mean 5.
    - Distances 2, 1, 0, 1, 2.
    solution: 6/5 = 1.2.
  - prompt: Find the mean of 2, 4, 6, 8, 10.
    answer: '6'
    check: Rational(30,5)
    difficulty: 1
    hints:
    - Add and divide by 5.
    - 30/5.
    solution: '6.'
  - prompt: Find the mean deviation about the mean of 2, 4, 6, 8, 10.
    answer: 12/5
    check: Rational(12,5)
    difficulty: 2
    hints:
    - Distances 4, 2, 0, 2, 4.
    - 12/5.
    solution: 12/5 = 2.4.
  - prompt: Why do we need measures of dispersion?
    options:
    - Two data sets can have the same mean but different spreads
    - The mean is always wrong
    - To find the largest value only
    - To avoid using numbers
    answer: Two data sets can have the same mean but different spreads
    difficulty: 1
    hints:
    - Average hides spread.
    - Consistency.
    solution: The mean alone doesn't show how spread out data are.
  - prompt: Find the median of 3, 9, 4, 7, 5.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 'Order: 3, 4, 5, 7, 9.'
    - Middle value.
    solution: '5.'
- code: cbse11m.stat.variance
  title: Variance and standard deviation
  after:
  - cbse11m.stat.dispersion
  notes: |
    Variance σ² = Σ(xᵢ − x̄)²/n = Σxᵢ²/n − x̄². Standard deviation σ = √variance. For frequency data use fᵢ. Adding a
    constant to every value doesn't change σ; multiplying by k multiplies σ by |k|. Coefficient of variation CV =
    (σ/x̄) × 100: compares variability; lower CV = more consistent. Example 2, 4, 6, 8, 10: mean 6, variance 8, σ = 2√2.
  explanations:
    text: 'Variance is the average of the squared distances from the mean; standard deviation is its square root, back in the original units. To compare consistency of two series with different means, use the coefficient of variation, σ/mean × 100: the lower one is more consistent.'
    visual: 'For 2, 4, 6, 8, 10 with mean 6, draw squares on each deviation: sides 4, 2, 0, 2, 4, areas 16, 4, 0, 4, 16. The average area, 8, is the variance.'
    step_by_step: 'Step 1: Find the mean. Step 2: Square each deviation. Step 3: Average the squares: variance. Step 4: Square root: standard deviation. Step 5: CV = σ/mean × 100 to compare.'
    real_world: Factories measure the standard deviation of bottle volumes; a small σ means each bottle is filled almost exactly the same.
  picture:
    kind: bars
    bars:
    - label: '2'
      value: 16
    - label: '4'
      value: 4
    - label: '6'
      value: 0
    - label: '8'
      value: 4
    - label: '10'
      value: 16
    alt: 'Squared deviations from the mean 6 for the values 2, 4, 6, 8, 10: 16, 4, 0, 4 and 16, which average to a variance of 8.'
  activity:
    type: formula
    prompt: The data 2, 4, 4, 4, 5, 5, 7, 9 has mean 5 and σ = 2. Change every value to m × value + k.
    inputs:
    - name: m
      label: Multiply by m
      min: -4
      max: 4
      step: 0.5
      start: 1
    - name: k
      label: Then add k
      min: -10
      max: 15
      step: 1
      start: 0
    outputs:
    - name: mean
      label: New mean
      expr: 5*m+k
      places: 2
    - name: sd
      label: New σ
      expr: 2*abs(m)
      places: 2
    - name: var
      label: New variance σ²
      expr: 4*m^2
      places: 2
    goals:
    - prompt: Keep m = 1. Add a number so the mean becomes 12.
      want:
        m: 1
        mean: 12
      mistakes:
      - when:
          m: 1
          k: 12
        say: 'Adding 12 makes the mean 17: k is added to the old mean of 5.'
    - prompt: Make σ = 6.
      want:
        sd: 6
      mistakes:
      - when:
          m: 1
          k:
          - -10
          - 10
        say: 'Adding moves every value along but keeps the gaps, so σ stays 2. Stretch the data: change m.'
      - when:
          m: 1.5
        say: '×1.5 makes σ = 3. σ scales by the same factor as the data: 2 × ? = 6.'
    - prompt: Make the variance 16.
      want:
        var: 16
      mistakes:
      - when:
          m: 4
        say: ×4 makes σ = 8 and the variance 64. Variance scales by m², so m² = 4.
      - when:
          m: -4
        say: ×(−4) makes σ = 8 and the variance 64. Variance scales by m², so m² = 4.
  items:
  - prompt: Find the variance of 2, 4, 6, 8, 10.
    answer: '8'
    check: Rational(16+4+0+4+16,5)
    difficulty: 2
    hints:
    - Mean 6; squared deviations 16, 4, 0, 4, 16.
    - 40/5.
    solution: Variance = 8.
    mistakes:
      '6': c11_variance
  - prompt: If the variance is 25, what is the standard deviation?
    answer: '5'
    check: sqrt(25)
    difficulty: 1
    hints:
    - σ = √variance.
    - √25.
    solution: '5.'
  - prompt: Find the variance of 1, 2, 3, 4, 5.
    answer: '2'
    check: Rational(10,5)
    difficulty: 2
    hints:
    - Mean 3; squared deviations 4, 1, 0, 1, 4.
    - 10/5.
    solution: '2.'
  - prompt: A series has mean 50 and standard deviation 10. Find its coefficient of variation (%).
    answer: '20'
    check: Rational(10,50)*100
    difficulty: 1
    hints:
    - σ/mean × 100.
    - 10/50 × 100.
    solution: 20%.
  - prompt: Series A has CV 15% and series B has CV 25%. Which is more consistent?
    options:
    - A
    - B
    - Both equal
    - Cannot tell
    answer: A
    difficulty: 1
    hints:
    - Lower CV.
    - Less variation.
    solution: A has the lower CV, so it is more consistent.
    mistakes:
      B: c11_cv
  - prompt: Each value in a data set with σ = 4 is increased by 7. What is the new standard deviation?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Adding a constant shifts all values.
    - Spread is unchanged.
    solution: σ stays 4.
