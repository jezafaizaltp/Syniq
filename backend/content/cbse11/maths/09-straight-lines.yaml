# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-math
chapter: 9
title: Straight Lines
tips:
  c11_slope: Slope = rise ÷ run = (y₂ − y₁)/(x₂ − x₁). Keep the same order of points on top and bottom.
  c11_perp: 'Perpendicular lines have slopes that multiply to −1: flip the fraction and change its sign.'
  m11_collinear: "Collinear points give the same slope between any two pairs. Equate the slopes and solve."
  m11_find_c: "Substitute the point into y = 4x + c and solve for c."
  m11_horizontal: "A horizontal line does not rise as you move right. Rise ÷ run = ?"
  m11_intercept_form: "Put x = 2 into x/4 + y/6 = 1, then solve for y."
  m11_parallel_dist: "Distance = |C₁ − C₂| / √(A² + B²). Watch the signs when subtracting."
  m11_point_line: "Distance = |Ax₁ + By₁ + C| / √(A² + B²). Don't forget to divide."
  m11_slope_general: "Rewrite as y = mx + c, or use m = −A/B for Ax + By + C = 0."
  m11_slope_tan: "Slope m = tan θ. Use the value of tan at that angle, not the angle itself."
  m11_slope_two: "Slope = (y₂ − y₁)/(x₂ − x₁). Keep the order the same on top and bottom."
  m11_y_intercept: "Put x = 0 and solve for y."
  c11m9_slope: 'Slope is rise over run: (y₂ − y₁)/(x₂ − x₁). Keep the same order on top and bottom.'
  c11m9_form: Rearrange to y = mx + c, or read slope −A/B and y-intercept −C/B from Ax + By + C = 0.
  c11m9_dist: Put the point into Ax + By + C, take the absolute value, then divide by √(A² + B²).
concepts:
- code: cbse11m.lines.slope
  title: Slope of a line
  notes: |
    Slope (gradient) m = tan θ, θ = angle with the positive x-axis; through (x₁, y₁), (x₂, y₂): m = (y₂ − y₁)/(x₂ − x₁).
    Horizontal line m = 0; vertical line slope undefined. Parallel lines: equal slopes. Perpendicular: m₁m₂ = −1. Three
    points collinear if slopes AB = BC. Angle between lines: tan θ = |(m₂ − m₁)/(1 + m₁m₂)|.
  explanations:
    text: 'The slope of a line tells how steep it is: rise divided by run, (y₂ − y₁)/(x₂ − x₁). Parallel lines have equal slopes. Perpendicular lines have slopes that multiply to −1, like 2 and −1/2.'
    visual: 'Plot A(1, 2) and B(4, 8). From A, walk right 3 and up 6 to reach B. Slope = 6/3 = 2: up 2 for every 1 across.'
    step_by_step: 'Step 1: Label the points (x₁, y₁) and (x₂, y₂). Step 2: Subtract y''s and x''s in the same order. Step 3: Divide. Step 4: Compare slopes for parallel (equal) or perpendicular (product −1).'
    real_world: 'Road signs show a slope like ''1 in 10'': the road rises 1 m for every 10 m across, a slope of 0.1.'
  picture:
    kind: geometry
    points:
      A:
      - 2
      - 2
      B:
      - 6
      - 8
      _C:
      - 6
      - 2
    segments:
    - - A
      - B
    - - A
      - _C
      - run 3
    - - _C
      - B
      - rise 6
    alt: A line through A and B, with a run of 3 and a rise of 6, so its slope is 2.
  activity:
    type: graph
    mode: line
    range:
    - -6
    - 6
    m_step: 0.5
    prompt: Tilt the line to change its slope m, and slide it to change where it crosses the y-axis.
    goals:
    - prompt: Make the line through (0, 3) perpendicular to y = 2x + 1.
      m: -0.5
      c: 3
      mistakes:
      - when:
          m: -2
          c: 3
        say: 'Slope −2 only flips the sign. Perpendicular slopes multiply to −1: 2 × m = −1.'
      - when:
          m: 0.5
          c: 3
        say: ½ is the reciprocal, but 2 × ½ = +1. Flip it AND change the sign.
      - when:
          m: 2
          c: 3
        say: Slope 2 is parallel to y = 2x + 1. Perpendicular slopes multiply to −1.
    - prompt: Make the line through (−2, −1) and (2, 5).
      through:
      - - -2
        - -1
      - - 2
        - 5
      hint: Slope = rise ÷ run between the two points.
      mistakes:
      - when:
          m: -1.5
        say: That line falls. From (−2, −1) to (2, 5), y goes up.
      - when:
          m: 1
          c: 1
        say: Slope 1 rises 4 over the run of 4. The rise is 5 − (−1) = 6.
    - prompt: Make a line at 45° to the x-axis that crosses the y-axis at −4.
      m: 1
      c: -4
      mistakes:
      - when:
          m: -1
          c: -4
        say: Slope −1 makes 135° with the x-axis. tan 45° = 1.
      - when:
          m: 1
          c: 4
        say: That crosses at +4. Slide it down to −4.
    - prompt: Make the horizontal line through (3, 2).
      m: 0
      c: 2
      mistakes:
      - when:
          m: 0
          c: 3
        say: This line is at height 3. Horizontal means y stays the same everywhere, so y = 2.
      - when:
          c: 2
          m:
          - -10
          - 10
        say: It passes (0, 2), but it's tilted. A horizontal line has slope 0.
  lesson:
    - teach: 'Slope m measures steepness: m = tan θ, where θ is the angle the line makes with the positive x-axis. Through (x₁, y₁) and (x₂, y₂), m = (y₂ − y₁)/(x₂ − x₁).'
      check:
        prompt: Slope of the line through (0, 0) and (2, 6)?
        options:
        - '3'
        - 1/3
        - '6'
        answer: '3'
        why: (6 − 0)/(2 − 0) = 3.
      ways:
      - style: visual
        teach: 'From (2, 1) to (5, 7): rise 6 over run 3, so the slope is 2.'
        picture:
          kind: geometry
          axes: true
          range:
          - -1
          - 8
          points:
            A:
            - 2
            - 1
            B:
            - 5
            - 7
            _c:
            - 5
            - 1
          segments:
          - - A
            - B
          - - A
            - _c
            - run 3
          - - _c
            - B
            - rise 6
          alt: A right triangle under the line from A at 2, 1 to B at 5, 7 has run 3 and rise 6, so the slope is 6 over 3, which is 2.
      - style: real_world
        teach: 'A road sign saying ''1 in 10 gradient'' means you climb 1 m for every 10 m along: slope 0.1. A wheelchair ramp is kept to about 1 in 12. The steeper the hill, the bigger the slope.'
    - teach: A horizontal line has slope 0; a vertical line's slope is undefined. Parallel lines have equal slopes; perpendicular lines have m₁ × m₂ = −1.
      picture:
        kind: compare
        columns:
        - title: Parallel
          points:
          - m₁ = m₂
          - e.g. 2 and 2
        - title: Perpendicular
          points:
          - m₁m₂ = −1
          - e.g. 2 and −1/2
        alt: Slope rules for parallel and perpendicular lines.
      check:
        prompt: A line has slope −4. Slope of a line perpendicular to it?
        options:
        - 1/4
        - '4'
        - −1/4
        answer: 1/4
        why: −4 × 1/4 = −1.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find both slopes. Step 2: Equal slopes → parallel. Step 3: Multiply them: −1 → perpendicular. Step 4: To get a perpendicular slope, flip the fraction and change its sign: 4/5 becomes −5/4.'
      - style: real_world
        teach: 'Railway tracks are parallel: they climb at exactly the same slope. A ladder against a wall meets the floor; the wall is vertical with undefined slope, and the floor is horizontal with slope 0.'
    - teach: 'Three points are collinear if the slope from the first to the second equals the slope from the second to the third. The angle between two lines: tan θ = |(m₂ − m₁)/(1 + m₁m₂)|.'
      check:
        prompt: Slopes 1 and 0. What is the angle between the lines?
        options:
        - 45°
        - 90°
        - 30°
        answer: 45°
        why: tan θ = |1 − 0|/(1 + 0) = 1, so θ = 45°.
      ways:
      - style: visual
        teach: 'A(0, 1), B(1, 3), C(2, 5): the slopes AB and BC are both 2, so the points are on one line.'
        picture:
          kind: geometry
          axes: true
          range:
          - -1
          - 6
          points:
            A:
            - 0
            - 1
            B:
            - 1
            - 3
            C:
            - 2
            - 5
          segments:
          - - A
            - B
            - slope 2
          - - B
            - C
            - slope 2
          alt: Points A at 0, 1, B at 1, 3 and C at 2, 5 lie on one straight line because the slope from A to B and from B to C are both 2.
      - style: step_by_step
        teach: 'Step 1: Angle between two lines: find m₁ and m₂. Step 2: Put them in tan θ = |(m₂ − m₁)/(1 + m₁m₂)|. Step 3: If 1 + m₁m₂ = 0 the lines are perpendicular. Example: m₁ = 1, m₂ = 0: tan θ = 1, θ = 45°.'
  items:
  - prompt: Find the slope of the line through (1, 2) and (4, 8).
    answer: '2'
    check: Rational(8-2,4-1)
    difficulty: 1
    hints:
    - (8 − 2)/(4 − 1).
    - 6/3.
    solution: "m = (y₂ − y₁)/(x₂ − x₁) = (8 − 2)/(4 − 1) = 6/3 = 2."
    mistakes:
      1/2: c11_slope
  - prompt: A line makes an angle of 45° with the positive x-axis. Find its slope.
    answer: '1'
    check: tan(pi/4)
    difficulty: 1
    hints:
    - m = tan θ.
    - tan 45°.
    solution: "m = tan θ = tan 45° = 1."
    mistakes: {"45": "m11_slope_tan", "0": "m11_slope_tan"}
  - prompt: A line has slope 2/3. Find the slope of a line perpendicular to it.
    answer: -3/2
    check: -1/Rational(2,3)
    difficulty: 1
    hints:
    - m₁m₂ = −1.
    - Flip and change sign.
    solution: "Perpendicular slopes multiply to −1: m = −1/(2/3) = −3/2."
    mistakes:
      3/2: c11_perp
  - prompt: What is the slope of a horizontal line?
    options:
    - '0'
    - '1'
    - Undefined
    - −1
    answer: '0'
    difficulty: 1
    hints:
    - No rise.
    - 0 ÷ run.
    solution: A horizontal line has slope 0.
    mistakes: {"1": "m11_horizontal", "Undefined": "m11_horizontal", "−1": "m11_horizontal"}
  - prompt: The points (1, 1), (2, 3) and (k, 7) are collinear. Find k.
    answer: '4'
    check: 1 + 6/2
    difficulty: 2
    hints:
    - Slope of first two = 2.
    - (7 − 1)/(k − 1) = 2.
    solution: k − 1 = 3, so k = 4.
    mistakes: {"5": "m11_collinear", "3": "m11_collinear"}
  - prompt: Find the slope of the line through (−2, 5) and (3, −5).
    answer: '-2'
    check: Rational(-10,5)
    difficulty: 1
    hints:
    - (−5 − 5)/(3 + 2).
    - −10/5.
    solution: "m = (−5 − 5)/(3 − (−2)) = −10/5 = −2."
    mistakes: {"2": "m11_slope_two", "-1/2": "m11_slope_two"}
  - prompt: Slope of the line through (2, −1) and (5, 8)?
    answer: '3'
    check: 9/3
    difficulty: 1
    hints:
    - 'Rise: 8 − (−1).'
    - 'Run: 5 − 2.'
    solution: 'Step 1: 9/3. Step 2: 3.'
    mistakes:
      7/3: c11m9_slope
      1/3: c11m9_slope
  - prompt: 'A line makes 60° with the positive x-axis. Its slope is:'
    options:
    - √3
    - 1/√3
    - 1/2
    answer: √3
    difficulty: 1
    hints:
    - m = tan θ.
    - tan 60°.
    solution: 'Step 1: m = tan 60°. Step 2: √3.'
    mistakes:
      1/√3: c11m9_slope
      1/2: c11m9_slope
  - prompt: Slope of the line through (3, 4) and (3, 9)?
    options:
    - undefined
    - '0'
    - '5'
    answer: undefined
    difficulty: 2
    hints:
    - Look at the x-coordinates.
    - Run is zero.
    solution: 'Step 1: x₂ − x₁ = 0. Step 2: vertical line, slope undefined.'
    mistakes:
      '0': c11m9_slope
      '5': c11m9_slope
  - prompt: Lines with slopes 3/4 and k are parallel. Find k.
    options:
    - 3/4
    - −4/3
    - 4/3
    answer: 3/4
    difficulty: 1
    hints:
    - Parallel lines share a slope.
    - No sign change needed.
    solution: 'Step 1: equal slopes. Step 2: k = 3/4.'
    mistakes:
      −4/3: c11m9_slope
      4/3: c11m9_slope
  - prompt: A(0, 2), B(1, 5), C(3, k) are collinear. Find k.
    answer: '11'
    check: 2+3*3
    difficulty: 2
    hints:
    - Slope AB = 3.
    - Slope BC must also be 3.
    solution: 'Step 1: (k − 5)/2 = 3. Step 2: k = 11.'
    mistakes:
      '8': c11m9_slope
      '9': c11m9_slope
  - prompt: Find the acute angle between lines of slopes √3 and 0.
    options:
    - 60°
    - 30°
    - 90°
    answer: 60°
    difficulty: 2
    hints:
    - tan θ = |√3 − 0|/(1 + 0).
    - Which angle has tan = √3?
    solution: 'Step 1: tan θ = √3. Step 2: θ = 60°.'
    mistakes:
      30°: c11m9_slope
      90°: c11m9_slope
  - prompt: Are lines with slopes 2 and −1/2 perpendicular?
    options:
    - 'Yes'
    - 'No'
    - Only if they meet at the origin
    answer: 'Yes'
    difficulty: 1
    hints:
    - Multiply the slopes.
    - Is it −1?
    solution: 'Step 1: 2 × (−1/2) = −1. Step 2: yes.'
    mistakes:
      'No': c11m9_slope
      Only if they meet at the origin: c11m9_slope
  - prompt: The line through (k, 3) and (2, 7) has slope 2. Find k.
    answer: '0'
    check: 2-2
    difficulty: 3
    hints:
    - (7 − 3)/(2 − k) = 2.
    - Solve for k.
    solution: 'Step 1: 4 = 2(2 − k). Step 2: k = 0.'
    mistakes:
      '4': c11m9_slope
      '2': c11m9_slope
  - prompt: Lines of slopes 1/2 and 3. Find tan of the acute angle between them.
    answer: '1'
    check: (3-0.5)/(1+1.5)
    difficulty: 3
    hints:
    - '|(m₂ − m₁)/(1 + m₁m₂)|.'
    - Top 5/2, bottom 5/2.
    solution: 'Step 1: (5/2)/(5/2). Step 2: tan θ = 1, so θ = 45°.'
    mistakes:
      '2.5': c11m9_slope
      '5': c11m9_slope
  - prompt: 'Assertion (A): The lines y = 2x + 3 and y = 2x − 5 never meet.

      Reason (R): Lines with equal slopes and different y-intercepts are parallel.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true: the slopes are both 2 and the intercepts differ, so they are parallel and never meet; R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A straight road rises 15 m over a horizontal distance of 300 m. An engineer calls its slope the ''gradient''. What is the gradient?'
    options:
    - 1/20
    - '20'
    - 1/15
    answer: 1/20
    hints:
    - Slope = rise ÷ run.
    - 15 ÷ 300.
    solution: "Gradient = rise/run = 15/300 = 1/20."
    mistakes:
      '20': c11m9_slope
      1/15: m11_slope_two
    exam: case
    difficulty: 2
  - prompt: Find k if the line through (2, k) and (4, 7) is parallel to a line of slope 3.
    options:
    - '1'
    - '13'
    - −1
    answer: '1'
    hints:
    - Set (7 − k)/(4 − 2) = 3.
    - Solve for k.
    solution: (7 − k)/2 = 3 → 7 − k = 6 → k = 1.
    mistakes:
      '13': m11_slope_two
      −1: c11_slope
    exam: short
    difficulty: 2
- code: cbse11m.lines.equations
  title: Equations of a line and distance
  after:
  - cbse11m.lines.slope
  notes: |
    Forms: point-slope y − y₁ = m(x − x₁); two-point; slope-intercept y = mx + c; intercept x/a + y/b = 1; general
    Ax + By + C = 0 (slope −A/B, y-intercept −C/B). Distance of (x₁, y₁) from Ax + By + C = 0: |Ax₁ + By₁ + C|/√(A² + B²).
    Distance between parallel lines Ax + By + C₁ = 0 and Ax + By + C₂ = 0: |C₁ − C₂|/√(A² + B²).
  explanations:
    text: 'A straight line can be written as y = mx + c, where m is the slope and c is where it crosses the y-axis. Knowing a point and the slope gives y − y₁ = m(x − x₁). The distance from a point to a line has its own formula: |Ax₁ + By₁ + C|/√(A² + B²).'
    visual: 'Draw y = 2x + 1: start at (0, 1) on the y-axis and climb 2 for every 1 across. The line also passes through (1, 3) and (2, 5).'
    step_by_step: 'Step 1: Choose the form that fits what you know. Step 2: Substitute. Step 3: Rearrange to y = mx + c or Ax + By + C = 0. Step 4: For distance, substitute the point into Ax + By + C and divide by √(A² + B²).'
    real_world: A delivery app finds the shortest distance from a shop to a straight road using the point-to-line distance formula.
  picture:
    kind: compare
    columns:
    - title: Form
      points:
      - y = mx + c
      - y − y₁ = m(x − x₁)
      - x/a + y/b = 1
    - title: Use when you know
      points:
      - slope and y-intercept
      - slope and a point
      - both intercepts
    alt: Use y = mx + c with a slope and y-intercept, the point-slope form with a slope and a point, and x/a + y/b = 1 with both intercepts.
  activity:
    type: formula
    prompt: The distance from a point (p, q) to the line 3x − 4y + C = 0 is |3p − 4q + C| ÷ √(3² + 4²) = |3p − 4q + C| ÷ 5.
    inputs:
    - name: p
      label: Point's x, p
      min: -6
      max: 6
      step: 1
      start: 0
    - name: q
      label: Point's y, q
      min: -6
      max: 6
      step: 1
      start: 0
    - name: c
      label: C
      min: -20
      max: 20
      step: 1
      start: 0
    outputs:
    - name: val
      label: 3p − 4q + C
      expr: 3*p-4*q+c
    - name: dist
      label: Distance to the line
      expr: abs(3*p-4*q+c)/5
      places: 2
    goals:
    - prompt: Keep the point at the origin. Choose C > 0 so the line is 3 units away.
      want:
        p: 0
        q: 0
        dist: 3
        c:
        - 1
        - 20
      mistakes:
      - when:
          p: 0
          q: 0
          c: 3
        say: 'C = 3 puts the line only 0.6 away. Divide by √(3² + 4²) = 5: |C| ÷ 5 = 3.'
      - when:
          p: 0
          q: 0
          c: -15
        say: That's 3 away too, on the other side of the origin. The question asks for C > 0.
    - prompt: Keep C = 5. Move the point onto the line 3x − 4y + 5 = 0.
      want:
        c: 5
        dist: 0
      mistakes:
      - when:
          c: 5
          p: 0
          q: 0
        say: 'The origin gives 3(0) − 4(0) + 5 = 5, not 0: it''s 1 unit off the line.'
      - when:
          c: 5
          val:
          - -30
          - -1
        say: '3p − 4q + 5 is negative: the point is on the other side. You need 3p − 4q = −5.'
    - prompt: Take C = −2. Find a point on the y-axis, above the x-axis, 2 units from the line.
      want:
        p: 0
        c: -2
        dist: 2
        q:
        - 1
        - 6
      mistakes:
      - when:
          p: 0
          c: -2
          q: -3
        say: That's 2 away too, but below the x-axis.
      - when:
          p:
          - -6
          - -1
          c: -2
        say: A point on the y-axis has p = 0.
      - when:
          p:
          - 1
          - 6
          c: -2
        say: A point on the y-axis has p = 0.
  lesson:
    - teach: 'Point-slope form: y − y₁ = m(x − x₁). Slope-intercept form: y = mx + c, where c is where the line meets the y-axis.'
      check:
        prompt: 'Line through (1, 2) with slope 3: what is c in y = 3x + c?'
        options:
        - −1
        - '5'
        - '2'
        answer: −1
        why: 2 = 3(1) + c gives c = −1.
      ways:
      - style: visual
        teach: 'y = 2x + 1: it crosses the y-axis at 1 and climbs 2 for every 1 across.'
        picture:
          kind: geometry
          axes: true
          range:
          - -3
          - 6
          points:
            (0, 1):
            - 0
            - 1
            (2, 5):
            - 2
            - 5
            (−2, −3):
            - -2
            - -3
          segments:
          - - (−2, −3)
            - (2, 5)
          alt: The line y equals 2x plus 1 passes through 0, 1 on the y-axis and climbs to 2, 5, rising 2 for every 1 across.
      - style: step_by_step
        teach: 'Step 1: Have a point and a slope? Write y − y₁ = m(x − x₁). Step 2: Expand and tidy into y = mx + c. Example: through (1, 2) with m = 3: y − 2 = 3(x − 1), so y = 3x − 1 and c = −1.'
    - teach: Intercept form x/a + y/b = 1 meets the axes at (a, 0) and (0, b). General form Ax + By + C = 0 has slope −A/B and y-intercept −C/B.
      check:
        prompt: Slope of 4x − 2y + 7 = 0?
        options:
        - '2'
        - −2
        - 1/2
        answer: '2'
        why: −A/B = −4/(−2) = 2.
      ways:
      - style: visual
        teach: x/3 + y/2 = 1 cuts the x-axis at 3 and the y-axis at 2.
        picture:
          kind: geometry
          axes: true
          range:
          - -1
          - 5
          points:
            (3, 0):
            - 3
            - 0
            (0, 2):
            - 0
            - 2
          segments:
          - - (3, 0)
            - (0, 2)
          alt: The line joining 3, 0 and 0, 2 is x over 3 plus y over 2 equals 1; its intercepts are 3 and 2.
      - style: step_by_step
        teach: 'Step 1: From Ax + By + C = 0, slope = −A/B. Step 2: y-intercept: put x = 0, so −C/B. Step 3: x-intercept: put y = 0, so −C/A. For 4x + 3y − 12 = 0: slope −4/3, y-intercept 4, x-intercept 3.'
    - teach: Distance from (x₁, y₁) to Ax + By + C = 0 is |Ax₁ + By₁ + C|/√(A² + B²). Between parallel lines Ax + By + C₁ = 0 and Ax + By + C₂ = 0 it is |C₁ − C₂|/√(A² + B²).
      picture:
        kind: flow
        steps:
        - substitute the point
        - take |value|
        - divide by √(A² + B²)
        alt: Steps for the distance of a point from a line.
      check:
        prompt: Distance from the origin to 3x + 4y − 10 = 0?
        options:
        - '2'
        - '10'
        - '5'
        answer: '2'
        why: '|−10|/5 = 2.'
      ways:
      - style: step_by_step
        teach: 'Step 1: Write the line as Ax + By + C = 0. Step 2: Put the point into the left side and take the absolute value. Step 3: Divide by √(A² + B²). Example: (1, 2) to 3x + 4y − 1 = 0: |3 + 8 − 1|/5 = 2.'
      - style: real_world
        teach: The shortest path from your house to a straight canal is straight across at right angles, not slanting. The point-to-line distance formula measures exactly that perpendicular path.
  items:
  - prompt: Find the y-intercept of the line 3x + 2y − 6 = 0.
    answer: '3'
    check: 6/2
    difficulty: 1
    hints:
    - Put x = 0.
    - 2y = 6.
    solution: "Put x = 0: 2y = 6, so y = 3."
    mistakes: {"2": "m11_y_intercept", "6": "m11_y_intercept"}
  - prompt: Find the slope of the line 3x + 2y − 6 = 0.
    answer: -3/2
    check: Rational(-3,2)
    difficulty: 1
    hints:
    - Slope = −A/B.
    - −3/2.
    solution: "Rewrite as y = −(3/2)x + 3, so m = −3/2 (or m = −A/B = −3/2)."
    mistakes: {"3/2": "m11_slope_general", "-2/3": "m11_slope_general"}
  - prompt: A line through (2, 3) has slope 4. Find its y-intercept c in y = mx + c.
    answer: '-5'
    check: 3 - 8
    difficulty: 2
    hints:
    - 3 = 4 × 2 + c.
    - c = 3 − 8.
    solution: "3 = 4 × 2 + c, so c = 3 − 8 = −5."
    mistakes: {"5": "m11_find_c", "11": "m11_find_c"}
  - prompt: Find the distance of the point (3, 4) from the line 3x + 4y − 5 = 0.
    answer: '4'
    check: abs(3*3+4*4-5)/sqrt(3**2+4**2)
    difficulty: 2
    hints:
    - '|9 + 16 − 5|/√(9 + 16).'
    - 20/5.
    solution: "d = |3 × 3 + 4 × 4 − 5|/√(3² + 4²) = |20|/5 = 4."
    mistakes: {"20": "m11_point_line", "5": "m11_point_line"}
  - prompt: Find the distance between the parallel lines 3x + 4y + 7 = 0 and 3x + 4y − 8 = 0.
    answer: '3'
    check: abs(7-(-8))/sqrt(3**2+4**2)
    difficulty: 2
    hints:
    - '|C₁ − C₂|/√(A² + B²).'
    - 15/5.
    solution: "d = |C₁ − C₂|/√(A² + B²) = |7 − (−8)|/5 = 15/5 = 3."
    mistakes: {"1/5": "m11_parallel_dist", "15": "m11_parallel_dist"}
  - prompt: A line cuts the x-axis at 4 and the y-axis at 6. Using x/4 + y/6 = 1, find y when x = 2.
    answer: '3'
    check: 6*(1-Rational(2,4))
    difficulty: 1
    hints:
    - 2/4 + y/6 = 1.
    - y/6 = 1/2.
    solution: "2/4 + y/6 = 1 gives y/6 = 1/2, so y = 3."
    mistakes: {"2": "m11_intercept_form", "4": "m11_intercept_form"}
  - prompt: Find the equation of the line with slope 2 and y-intercept −3.
    options:
    - y = 2x − 3
    - y = −3x + 2
    - y = 2x + 3
    answer: y = 2x − 3
    difficulty: 1
    hints:
    - Use y = mx + c.
    - m = 2, c = −3.
    solution: 'Step 1: substitute. Step 2: y = 2x − 3.'
    mistakes:
      y = −3x + 2: c11m9_form
      y = 2x + 3: c11m9_form
  - prompt: x-intercept of 2x + 5y − 10 = 0?
    answer: '5'
    check: 10/2
    difficulty: 1
    hints:
    - Put y = 0.
    - Solve 2x = 10.
    solution: 'Step 1: 2x − 10 = 0. Step 2: x = 5.'
    mistakes:
      '2': c11m9_form
      '-5': c11m9_form
  - prompt: 'Line through (1, 1) and (3, 5): what is its y-intercept?'
    answer: '-1'
    check: 1-2*1
    difficulty: 2
    hints:
    - Find the slope first.
    - Then use y = mx + c with one point.
    solution: 'Step 1: m = 4/2 = 2. Step 2: 1 = 2 + c gives c = −1.'
    mistakes:
      '1': c11m9_form
      '3': c11m9_form
  - prompt: Distance of (2, 1) from 4x − 3y + 5 = 0?
    answer: '2'
    check: abs(8-3+5)/5
    difficulty: 2
    hints:
    - 'Substitute: 4(2) − 3(1) + 5.'
    - Divide by √(16 + 9).
    solution: 'Step 1: |10|/5. Step 2: 2.'
    mistakes:
      '10': c11m9_dist
      '0': c11m9_dist
  - prompt: Distance between 5x + 12y + 4 = 0 and 5x + 12y − 22 = 0?
    answer: '2'
    check: 26/13
    difficulty: 2
    hints:
    - Same A and B, so parallel.
    - '|C₁ − C₂|/√(A² + B²).'
    solution: 'Step 1: |4 − (−22)| = 26, √169 = 13. Step 2: 2.'
    mistakes:
      18/13: c11m9_dist
      '26': c11m9_dist
  - prompt: Equation of the line through (2, 3) parallel to y = 4x + 1?
    options:
    - y = 4x − 5
    - y = 4x + 3
    - y = −x/4 + 3.5
    answer: y = 4x − 5
    difficulty: 2
    hints:
    - Keep the slope 4.
    - Find c using (2, 3).
    solution: 'Step 1: 3 = 8 + c gives c = −5. Step 2: y = 4x − 5.'
    mistakes:
      y = 4x + 3: c11m9_form
      y = −x/4 + 3.5: c11m9_slope
  - prompt: Intercept form of the line meeting the axes at (3, 0) and (0, −2)?
    options:
    - x/3 − y/2 = 1
    - x/3 + y/2 = 1
    - x/2 − y/3 = 1
    answer: x/3 − y/2 = 1
    difficulty: 3
    hints:
    - x/a + y/b = 1 with a = 3, b = −2.
    - Mind the sign of b.
    solution: 'Step 1: x/3 + y/(−2) = 1. Step 2: x/3 − y/2 = 1.'
    mistakes:
      x/3 + y/2 = 1: c11m9_form
      x/2 − y/3 = 1: c11m9_form
  - prompt: Equation of the line through (1, 2) perpendicular to y = x?
    options:
    - x + y = 3
    - x − y = −1
    - y = 2x
    answer: x + y = 3
    difficulty: 3
    hints:
    - Perpendicular slope is −1.
    - Use point-slope form.
    solution: 'Step 1: y − 2 = −(x − 1). Step 2: x + y = 3.'
    mistakes:
      x − y = −1: c11m9_slope
      y = 2x: c11m9_form
  - prompt: Find k if (k, 2) lies on 3x − y + 4 = 0.
    options:
    - −2/3
    - 2/3
    - −2
    answer: −2/3
    difficulty: 2
    hints:
    - Substitute x = k, y = 2.
    - 3k + 2 = 0.
    solution: 'Step 1: 3k − 2 + 4 = 0. Step 2: k = −2/3.'
    mistakes:
      2/3: c11m9_form
      −2: c11m9_form
  - prompt: 'Assertion (A): The distance of the origin from the line 3x + 4y = 10 is 2.

      Reason (R): The perpendicular distance of (x₁, y₁) from Ax + By + C = 0 is |Ax₁ + By₁ + C|/√(A² + B²).'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true: |0 + 0 − 10|/5 = 2, found with R, so R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: Find the equation of the line with intercepts 4 and −3 on the x- and y-axes.
    options:
    - 3x − 4y = 12
    - 4x − 3y = 12
    - 3x + 4y = 12
    answer: 3x − 4y = 12
    hints:
    - x/4 + y/(−3) = 1.
    - Multiply through by 12.
    solution: x/4 − y/3 = 1 → 3x − 4y = 12.
    mistakes:
      4x − 3y = 12: m11_intercept_form
      3x + 4y = 12: c11m9_form
    exam: short
    difficulty: 2
  - prompt: Find the distance between the parallel lines 3x + 4y + 7 = 0 and 3x + 4y − 3 = 0.
    options:
    - '2'
    - 4/5
    - '10'
    answer: '2'
    hints:
    - Use |C₁ − C₂|/√(A² + B²).
    - '|7 − (−3)| = 10.'
    solution: 10/√(9 + 16) = 10/5 = 2.
    mistakes:
      4/5: m11_parallel_dist
      '10': c11m9_dist
    exam: one_mark
    difficulty: 2
