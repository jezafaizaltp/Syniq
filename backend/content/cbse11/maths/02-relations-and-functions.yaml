# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse11-math
chapter: 2
title: Relations and Functions
tips:
  c11_product_count: 'The number of ordered pairs in A × B is n(A) × n(B): multiply, don''t add.'
  c11_function: A function gives each input exactly one output. One input with two outputs is not a function.
  m11_cartesian_size: "If A has n elements, A × A has n × n. Which n gives 9?"
  m11_domain_zero: "Division by zero is not allowed. Which x makes the denominator zero? Everything else is fine."
  m11_f_plus_g: "(f + g)(2) = f(2) + g(2). Work out each one at 2, then add."
  m11_floor: "The greatest integer function gives the largest integer not more than the number. Look left on the number line."
  m11_modulus: "Find |−5| first (distance from 0, never negative), then subtract."
  m11_order_matters: "Think of (row, column) on a seating chart: is seat (2, 3) the same as seat (3, 2)?"
  m11_ordered_pair: "Equal ordered pairs match term by term: first with first, second with second. Solve each equation."
  m11_range: "The range is the set of second entries of the pairs. Read off the right-hand number of each pair."
  m11_relations_count: "A relation is any subset of A × B. First count the pairs in A × B, then count its subsets."
  m11_substitute: "Replace x with the number, then follow the order: power first, then add."
concepts:
- code: cbse11m.rel.relations
  title: Cartesian products and relations
  notes: |
    Ordered pair (a, b): order matters; (a, b) = (c, d) iff a = c and b = d. Cartesian product A × B = {(a, b) : a ∈ A,
    b ∈ B}; n(A × B) = n(A)·n(B). A relation R from A to B is any subset of A × B; domain = set of first elements, range =
    set of second elements, codomain = B. Number of relations from A to B = 2^(pq) where n(A) = p, n(B) = q.
  explanations:
    text: An ordered pair (a, b) has a first and a second place. The Cartesian product A × B is every pair you can make with the first from A and the second from B. A relation is any collection of such pairs, chosen by a rule.
    visual: 'Make a grid: elements of A down the side, B across the top. Each cell is one ordered pair. Shading some cells picks out a relation.'
    step_by_step: 'Step 1: List A and B. Step 2: Pair each element of A with each of B. Step 3: Count: n(A) × n(B). Step 4: For a relation, keep only pairs that obey the rule; read off domain and range.'
    real_world: 'A timetable pairs days with periods: Monday × period 1 and so on. Each cell is an ordered pair from the product of two sets.'
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: x
    - size: 1
      label: y
    rows:
    - size: 1
      label: '1'
    - size: 1
      label: '2'
    - size: 1
      label: '3'
    cells:
    - - (1, x)
      - (1, y)
    - - (2, x)
      - (2, y)
    - - (3, x)
      - (3, y)
    alt: 'A grid for A × B with A = {1, 2, 3} and B = {x, y}: six ordered pairs.'
  activity:
    type: formula
    prompt: A × B pairs every element of A with every element of B. A relation from A to B is any subset of A × B.
    inputs:
    - name: p
      label: n(A)
      min: 1
      max: 8
      step: 1
      start: 1
    - name: q
      label: n(B)
      min: 1
      max: 16
      step: 1
      start: 1
    outputs:
    - name: pairs
      label: Pairs in A × B
      expr: p*q
    - name: rels
      label: Relations from A to B
      expr: 2^(p*q)
    goals:
    - prompt: A has 3 elements. Choose n(B) so there are exactly 64 relations from A to B.
      want:
        p: 3
        rels: 64
      hint: 'Each pair is either in the relation or out of it: 2 choices per pair.'
      mistakes:
      - when:
          p: 3
          q: 6
        say: B with 6 elements makes 18 pairs, so 2¹⁸ relations. 64 = 2⁶ means A × B needs 6 pairs, so 3 × n(B) = 6.
      - when:
          p: 3
          q: 3
        say: 3 × 3 = 9 pairs gives 2⁹ = 512 relations. You need 2⁶.
    - prompt: A × B has 12 pairs and n(B) = 4. Set n(A).
      want:
        pairs: 12
        q: 4
      mistakes:
      - when:
          p: 8
          q: 4
        say: '12 − 4 = 8, but A × B multiplies the sizes: n(A) × 4 = 12.'
    - prompt: A has 1 element. Make exactly 16 relations from A to B.
      want:
        p: 1
        rels: 16
      mistakes:
      - when:
          p: 1
          q: 16
        say: 16 is the number of relations, not pairs. 16 pairs would give 2¹⁶ relations. 16 = 2⁴, so A × B needs 4 pairs.
  items:
  - prompt: If n(A) = 3 and n(B) = 4, how many elements are in A × B?
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - Multiply.
    - 3 × 4.
    solution: 3 × 4 = 12 ordered pairs.
    mistakes:
      '7': c11_product_count
  - prompt: If (x + 1, y − 2) = (3, 1), find x + y.
    answer: '5'
    check: 2 + 3
    difficulty: 1
    hints:
    - x + 1 = 3, y − 2 = 1.
    - x = 2, y = 3.
    solution: x = 2, y = 3, so x + y = 5.
    mistakes: {"4": "m11_ordered_pair", "6": "m11_ordered_pair"}
  - prompt: How many relations are there from a 2-element set to a 3-element set?
    answer: '64'
    check: 2**6
    difficulty: 2
    hints:
    - Relations are subsets of A × B.
    - 'A × B has 6 pairs: 2⁶.'
    solution: 2^(2×3) = 64.
    mistakes: {"6": "m11_relations_count", "32": "m11_relations_count", "5": "m11_relations_count"}
  - prompt: R = {(1, 2), (2, 4), (3, 6)}. What is the range of R?
    options:
    - '{2, 4, 6}'
    - '{1, 2, 3}'
    - '{1, 2, 3, 4, 6}'
    - '{2, 3}'
    answer: '{2, 4, 6}'
    difficulty: 1
    hints:
    - Range = second elements.
    - 2, 4, 6.
    solution: The second elements are 2, 4, 6.
    mistakes: {"{1, 2, 3}": "m11_range", "{1, 2, 3, 4, 6}": "m11_range"}
  - prompt: Is (2, 3) the same ordered pair as (3, 2)?
    options:
    - No, order matters
    - Yes, always
    - Only if 2 = 3
    - Only in a relation
    answer: No, order matters
    difficulty: 1
    hints:
    - Ordered pair.
    - First place differs.
    solution: (2, 3) ≠ (3, 2) because order matters.
    mistakes: {"Yes, always": "m11_order_matters", "Only in a relation": "m11_order_matters"}
  - prompt: A × A has 9 elements, two of which are (−1, 0) and (0, 1). How many elements does A have?
    answer: '3'
    check: sqrt(9)
    difficulty: 2
    hints:
    - n(A)² = 9.
    - √9.
    solution: n(A) = 3 (A = {−1, 0, 1}).
    mistakes: {"9": "m11_cartesian_size", "2": "m11_cartesian_size"}
- code: cbse11m.rel.functions
  title: Functions and their graphs
  after:
  - cbse11m.rel.relations
  notes: |
    A function f : A → B is a relation in which every element of A has exactly one image in B. Domain A, codomain B,
    range = set of images. Real functions: identity f(x) = x, constant, polynomial, rational (denominator ≠ 0), modulus
    |x|, signum, greatest integer [x]. Algebra: (f + g)(x), (fg)(x), (f/g)(x) where g(x) ≠ 0. Vertical line test on graphs.
    Domain of f(x) = √(x − 2) is x ≥ 2; of 1/(x − 3) is x ≠ 3.
  explanations:
    text: A function is a rule that gives each input exactly one output. f(x) = x² sends 3 to 9. The domain is the inputs allowed; for 1/(x − 3), x cannot be 3. On a graph, a vertical line should cross a function at most once.
    visual: 'Picture a machine: drop in 3, out comes 9 for f(x) = x². Every input gives one output. If one input gave two outputs, it would not be a function.'
    step_by_step: 'Step 1: Check each input has one output. Step 2: Find the domain: avoid dividing by zero and square roots of negatives. Step 3: Substitute to find values. Step 4: For f + g or fg, work out each, then combine.'
    real_world: 'A taxi fare that depends on distance is a function: each distance gives one fare.'
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - f(x) = |x|
      - f(x) = 1/(x − 3)
      - f(x) = √(x − 2)
    - title: Domain
      points:
      - all real numbers
      - x ≠ 3
      - x ≥ 2
    alt: The modulus function works for all real numbers, 1/(x − 3) needs x ≠ 3, and √(x − 2) needs x ≥ 2.
  activity:
    type: sort
    prompt: Each one is a rule from a set A to a set B. Is it a function? Every element of A needs exactly one image.
    bins:
    - Function
    - Not a function
    items:
    - label: '{(1, 2), (2, 4), (3, 6)}'
      bin: Function
      clue: Does each first element appear exactly once?
      why: 1, 2 and 3 each have one image, so it is a function.
    - label: '{(1, 2), (1, 3), (2, 4)}'
      bin: Not a function
      clue: Look at the first elements. Any repeats?
      why: 1 is sent to both 2 and 3. One input can't have two images.
    - label: '{(1, 5), (2, 5), (3, 5)}'
      bin: Function
      clue: Is it a problem if two inputs share an output?
      why: 'Many inputs may share one image (here 5): each input still has exactly one. A constant function.'
    - label: 'A = {1, 2, 3}: {(1, a), (2, b)}'
      bin: Not a function
      clue: Has every element of A been used?
      why: 3 has no image at all. Every element of the domain needs one.
    - label: y = x², x real
      bin: Function
      clue: Can one x give two different y?
      why: Each x gives one value of x², even though 2 and −2 share 4.
    - label: y² = x, x ≥ 0, y real
      bin: Not a function
      clue: Try x = 4. How many y work?
      why: 'x = 4 gives y = 2 and y = −2: two images for one input.'
    - label: The vertical line x = 3
      bin: Not a function
      clue: How many points sit above x = 3?
      why: 'x = 3 meets every y: one input, infinitely many images.'
    - label: y = |x|
      bin: Function
      clue: Does |x| ever give two answers?
      why: '|x| gives exactly one value for each x, so it passes the vertical line test.'
    - label: The circle x² + y² = 25
      bin: Not a function
      clue: Draw a vertical line at x = 3. How many times does it cut?
      why: 'x = 3 gives y = 4 and y = −4: a vertical line cuts twice.'
    - label: Each student → their roll number
      bin: Function
      clue: Can a student have two roll numbers?
      why: Each student has exactly one roll number.
    - label: Each positive number → its square roots
      bin: Not a function
      clue: How many square roots does 9 have?
      why: 9 has two square roots, 3 and −3.
  items:
  - prompt: f(x) = x² + 1. Find f(3).
    answer: '10'
    check: 3**2 + 1
    difficulty: 1
    hints:
    - Replace x with 3.
    - 9 + 1.
    solution: f(3) = 9 + 1 = 10.
    mistakes: {"7": "m11_substitute", "9": "m11_substitute"}
  - prompt: Which relation is a function from {1, 2, 3}?
    options:
    - '{(1, 4), (2, 5), (3, 4)}'
    - '{(1, 4), (1, 5), (2, 6), (3, 7)}'
    - '{(1, 4), (2, 5)}'
    - '{(1, 4), (2, 5), (2, 6), (3, 7)}'
    answer: '{(1, 4), (2, 5), (3, 4)}'
    difficulty: 2
    hints:
    - Every input once.
    - Two inputs may share an output.
    solution: Each of 1, 2, 3 has exactly one image.
    mistakes:
      '{(1, 4), (1, 5), (2, 6), (3, 7)}': c11_function
  - prompt: f(x) = |x| − 2. Find f(−5).
    answer: '3'
    check: abs(-5) - 2
    difficulty: 1
    hints:
    - '|−5| = 5.'
    - 5 − 2.
    solution: f(−5) = 5 − 2 = 3.
    mistakes: {"-7": "m11_modulus", "7": "m11_modulus"}
  - prompt: For the greatest integer function, what is [2.7]?
    answer: '2'
    check: floor(Rational(27,10))
    difficulty: 1
    hints:
    - Largest integer ≤ 2.7.
    - Round down.
    solution: '[2.7] = 2.'
    mistakes: {"3": "m11_floor"}
  - prompt: f(x) = 2x + 1 and g(x) = x². Find (f + g)(2).
    answer: '9'
    check: (2*2+1) + 2**2
    difficulty: 2
    hints:
    - f(2) = 5, g(2) = 4.
    - Add.
    solution: 5 + 4 = 9.
    mistakes: {"5": "m11_f_plus_g", "4": "m11_f_plus_g"}
  - prompt: What is the domain of f(x) = 1/(x − 3)?
    options:
    - All real numbers except 3
    - All real numbers
    - x > 3 only
    - x = 3 only
    answer: All real numbers except 3
    difficulty: 2
    hints:
    - Avoid dividing by zero.
    - x − 3 ≠ 0.
    solution: x cannot be 3.
    mistakes: {"All real numbers": "m11_domain_zero", "x > 3 only": "m11_domain_zero", "x = 3 only": "m11_domain_zero"}
