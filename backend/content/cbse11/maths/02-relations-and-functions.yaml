# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse11-math
chapter: 2
title: Relations and Functions
tips:
  c11_product_count: 'The number of ordered pairs in A × B is n(A) × n(B): multiply, don''t add.'
  c11_function: A function gives each input exactly one output. One input with two outputs is not a function.
  m11_cartesian_size: "If A has n elements, A × A has n × n. Which n gives 9?"
  m11_domain_zero: "Division by zero is not allowed. Which x makes the denominator zero? Everything else is fine."
  m11_f_plus_g: "(f + g)(2) = f(2) + g(2). Work out each one at 2, then add."
  m11_floor: "The greatest integer function gives the largest integer not more than the number. Look left on the number line."
  m11_modulus: "Find |−5| first (distance from 0, never negative), then subtract."
  m11_order_matters: "Think of (row, column) on a seating chart: is seat (2, 3) the same as seat (3, 2)?"
  m11_ordered_pair: "Equal ordered pairs match term by term: first with first, second with second. Solve each equation."
  m11_range: "The range is the set of second entries of the pairs. Read off the right-hand number of each pair."
  m11_relations_count: "A relation is any subset of A × B. First count the pairs in A × B, then count its subsets."
  m11_substitute: "Replace x with the number, then follow the order: power first, then add."
  c11m2_pair: In an ordered pair the first entry comes from the first set. Keep the order.
  c11m2_count: Count the elements of each set first, then multiply or use the power rule.
  c11m2_func: A function gives each input exactly one output. Check every input once.
  c11m2_domain: 'Find the inputs that break the rule: zero in a denominator, or a negative under a square root.'
concepts:
- code: cbse11m.rel.relations
  title: Cartesian products and relations
  notes: |
    Ordered pair (a, b): order matters; (a, b) = (c, d) iff a = c and b = d. Cartesian product A × B = {(a, b) : a ∈ A,
    b ∈ B}; n(A × B) = n(A)·n(B). A relation R from A to B is any subset of A × B; domain = set of first elements, range =
    set of second elements, codomain = B. Number of relations from A to B = 2^(pq) where n(A) = p, n(B) = q.
  explanations:
    text: An ordered pair (a, b) has a first and a second place. The Cartesian product A × B is every pair you can make with the first from A and the second from B. A relation is any collection of such pairs, chosen by a rule.
    visual: 'Make a grid: elements of A down the side, B across the top. Each cell is one ordered pair. Shading some cells picks out a relation.'
    step_by_step: 'Step 1: List A and B. Step 2: Pair each element of A with each of B. Step 3: Count: n(A) × n(B). Step 4: For a relation, keep only pairs that obey the rule; read off domain and range.'
    real_world: 'A timetable pairs days with periods: Monday × period 1 and so on. Each cell is an ordered pair from the product of two sets.'
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: x
    - size: 1
      label: y
    rows:
    - size: 1
      label: '1'
    - size: 1
      label: '2'
    - size: 1
      label: '3'
    cells:
    - - (1, x)
      - (1, y)
    - - (2, x)
      - (2, y)
    - - (3, x)
      - (3, y)
    alt: 'A grid for A × B with A = {1, 2, 3} and B = {x, y}: six ordered pairs.'
  activity:
    type: formula
    prompt: A × B pairs every element of A with every element of B. A relation from A to B is any subset of A × B.
    inputs:
    - name: p
      label: n(A)
      min: 1
      max: 8
      step: 1
      start: 1
    - name: q
      label: n(B)
      min: 1
      max: 16
      step: 1
      start: 1
    outputs:
    - name: pairs
      label: Pairs in A × B
      expr: p*q
    - name: rels
      label: Relations from A to B
      expr: 2^(p*q)
    goals:
    - prompt: A has 3 elements. Choose n(B) so there are exactly 64 relations from A to B.
      want:
        p: 3
        rels: 64
      hint: 'Each pair is either in the relation or out of it: 2 choices per pair.'
      mistakes:
      - when:
          p: 3
          q: 6
        say: B with 6 elements makes 18 pairs, so 2¹⁸ relations. 64 = 2⁶ means A × B needs 6 pairs, so 3 × n(B) = 6.
      - when:
          p: 3
          q: 3
        say: 3 × 3 = 9 pairs gives 2⁹ = 512 relations. You need 2⁶.
    - prompt: A × B has 12 pairs and n(B) = 4. Set n(A).
      want:
        pairs: 12
        q: 4
      mistakes:
      - when:
          p: 8
          q: 4
        say: '12 − 4 = 8, but A × B multiplies the sizes: n(A) × 4 = 12.'
    - prompt: A has 1 element. Make exactly 16 relations from A to B.
      want:
        p: 1
        rels: 16
      mistakes:
      - when:
          p: 1
          q: 16
        say: 16 is the number of relations, not pairs. 16 pairs would give 2¹⁶ relations. 16 = 2⁴, so A × B needs 4 pairs.
  lesson:
    - teach: An ordered pair (a, b) has a first and a second entry; (a, b) = (c, d) only when a = c and b = d. The Cartesian product A × B is the set of all pairs (a, b) with a ∈ A and b ∈ B, so n(A × B) = n(A) · n(B).
      check:
        prompt: A = {1, 2}, B = {x, y, z}. How many pairs are in A × B?
        options:
        - '6'
        - '5'
        - '8'
        answer: '6'
        why: 'Each of the 2 elements of A pairs with each of the 3 in B: 2 × 3.'
      ways:
      - style: visual
        teach: 'A × B for A = {1, 2} and B = {x, y, z} as a grid: 2 rows times 3 columns.'
        picture:
          kind: area_grid
          cols:
          - size: 1
            label: x
          - size: 1
            label: y
          - size: 1
            label: z
          rows:
          - size: 1
            label: '1'
          - size: 1
            label: '2'
          cells:
          - - (1, x)
            - (1, y)
            - (1, z)
          - - (2, x)
            - (2, y)
            - (2, z)
          alt: A grid with rows 1 and 2 and columns x, y, z; each box is one ordered pair, giving 6 pairs in all.
      - style: real_world
        teach: 'A restaurant offers 5 starters and 4 main courses. Every possible meal is a pair (starter, main), so there are 5 × 4 = 20 meals. Order matters: (soup, rice) is a starter then a main, not the other way.'
    - teach: A relation from A to B is any subset of A × B. Its domain is the set of first entries, its range the set of second entries, and B is the codomain.
      check:
        prompt: R = {(1, a), (2, b), (2, c)}. What is the domain of R?
        options:
        - '{1, 2}'
        - '{a, b, c}'
        - '{1, 2, a, b, c}'
        answer: '{1, 2}'
        why: 'The domain collects the first entries: 1 and 2.'
      ways:
      - style: visual
        teach: 'Arrow diagram of a relation: domain is where arrows start, range is where they land.'
        picture:
          kind: compare
          columns:
          - title: A (first entries)
            points:
            - 1 → 4
            - 2 → 5
            - 3 → (no arrow)
          - title: Read off
            points:
            - domain {1, 2}
            - range {4, 5}
            - codomain = all of B
          alt: Arrows go from 1 to 4 and from 2 to 5, and 3 has no arrow, so the domain is 1 and 2 and the range is 4 and 5.
      - style: step_by_step
        teach: 'Step 1: Write the relation as a list of pairs. Step 2: Collect the first entries: that is the domain. Step 3: Collect the second entries: that is the range. Step 4: The codomain is the whole set B, whether or not every element is used.'
    - teach: Since a relation is any subset of A × B, and A × B has pq elements when n(A) = p and n(B) = q, there are 2^(pq) relations from A to B.
      check:
        prompt: n(A) = 1, n(B) = 2. How many relations from A to B?
        options:
        - '4'
        - '2'
        - '3'
        answer: '4'
        why: A × B has 2 elements, so 2² = 4 subsets.
      ways:
      - style: step_by_step
        teach: 'Step 1: n(A × B) = pq. Step 2: Each of the pq pairs is either in the relation or not. Step 3: That gives 2 × 2 × … (pq times) = 2^(pq) relations. For p = 3, q = 3: 2⁹ = 512.'
      - style: visual
        teach: The number of relations grows very fast as the two sets grow.
        picture:
          kind: bars
          bars:
          - label: '1×1: 2¹'
            value: 2
          - label: '1×2: 2²'
            value: 4
          - label: '1×3: 2³'
            value: 8
          - label: '2×2: 2⁴'
            value: 16
          alt: From a 1 element set to a 1 element set there are 2 relations, then 4 for 1 by 2, 8 for 1 by 3 and 16 for 2 by 2.
  items:
  - prompt: If n(A) = 3 and n(B) = 4, how many elements are in A × B?
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - Multiply.
    - 3 × 4.
    solution: 3 × 4 = 12 ordered pairs.
    mistakes:
      '7': c11_product_count
  - prompt: If (x + 1, y − 2) = (3, 1), find x + y.
    answer: '5'
    check: 2 + 3
    difficulty: 1
    hints:
    - x + 1 = 3, y − 2 = 1.
    - x = 2, y = 3.
    solution: x = 2, y = 3, so x + y = 5.
    mistakes: {"4": "m11_ordered_pair", "6": "m11_ordered_pair"}
  - prompt: How many relations are there from a 2-element set to a 3-element set?
    answer: '64'
    check: 2**6
    difficulty: 2
    hints:
    - Relations are subsets of A × B.
    - 'A × B has 6 pairs: 2⁶.'
    solution: 2^(2×3) = 64.
    mistakes: {"6": "m11_relations_count", "32": "m11_relations_count", "5": "m11_relations_count"}
  - prompt: R = {(1, 2), (2, 4), (3, 6)}. What is the range of R?
    options:
    - '{2, 4, 6}'
    - '{1, 2, 3}'
    - '{1, 2, 3, 4, 6}'
    - '{2, 3}'
    answer: '{2, 4, 6}'
    difficulty: 1
    hints:
    - Range = second elements.
    - 2, 4, 6.
    solution: The second elements are 2, 4, 6.
    mistakes: {"{1, 2, 3}": "m11_range", "{1, 2, 3, 4, 6}": "m11_range"}
  - prompt: Is (2, 3) the same ordered pair as (3, 2)?
    options:
    - No, order matters
    - Yes, always
    - Only if 2 = 3
    - Only in a relation
    answer: No, order matters
    difficulty: 1
    hints:
    - Ordered pair.
    - First place differs.
    solution: (2, 3) ≠ (3, 2) because order matters.
    mistakes: {"Yes, always": "m11_order_matters", "Only in a relation": "m11_order_matters"}
  - prompt: A × A has 9 elements, two of which are (−1, 0) and (0, 1). How many elements does A have?
    answer: '3'
    check: sqrt(9)
    difficulty: 2
    hints:
    - n(A)² = 9.
    - √9.
    solution: n(A) = 3 (A = {−1, 0, 1}).
    mistakes: {"9": "m11_cartesian_size", "2": "m11_cartesian_size"}
  - prompt: If (2a − 1, b + 3) = (5, 7), find a + b.
    answer: '7'
    check: 3+4
    difficulty: 1
    hints:
    - Match first entries, then second entries.
    - Solve two small equations.
    solution: 'Step 1: 2a − 1 = 5 gives a = 3; b + 3 = 7 gives b = 4. Step 2: a + b = 7.'
    mistakes:
      '12': c11m2_pair
      '6': c11m2_pair
  - prompt: n(A) = 2, n(B) = 2. How many relations are there from A to B?
    answer: '16'
    check: 2**(2*2)
    difficulty: 2
    hints:
    - First count the pairs in A × B.
    - Every subset of A × B is a relation.
    solution: 'Step 1: n(A × B) = 4. Step 2: 2⁴ = 16 relations.'
    mistakes:
      '4': c11m2_count
      '8': c11m2_count
  - prompt: A = {1, 2, 3}. How many elements does A × A × A have?
    answer: '27'
    check: 3**3
    difficulty: 2
    hints:
    - Each of the three places can take any of 3 values.
    - Multiply.
    solution: 'Step 1: 3 × 3 × 3. Step 2: 27.'
    mistakes:
      '9': c11m2_count
      '6': c11m2_count
  - prompt: 'R = {(x, x + 2) : x ∈ {1, 2, 3}}. What is the range of R?'
    options:
    - '{3, 4, 5}'
    - '{1, 2, 3}'
    - '{1, 2, 3, 4, 5}'
    answer: '{3, 4, 5}'
    difficulty: 2
    hints:
    - List the pairs.
    - Collect the second entries.
    solution: 'Step 1: pairs (1, 3), (2, 4), (3, 5). Step 2: range {3, 4, 5}.'
    mistakes:
      '{1, 2, 3}': c11m2_pair
      '{1, 2, 3, 4, 5}': c11m2_pair
  - prompt: A × B = {(p, 1), (p, 2), (q, 1), (q, 2)}. What is B?
    options:
    - '{1, 2}'
    - '{p, q}'
    - '{p, q, 1, 2}'
    answer: '{1, 2}'
    difficulty: 1
    hints:
    - B supplies the second entries.
    - Collect them without repeats.
    solution: 'Step 1: second entries 1, 2. Step 2: B = {1, 2}.'
    mistakes:
      '{p, q}': c11m2_pair
      '{p, q, 1, 2}': c11m2_pair
  - prompt: If n(A × B) = 15 and n(A) = 3, find n(B).
    answer: '5'
    check: 15/3
    difficulty: 1
    hints:
    - n(A × B) is a product.
    - Divide.
    solution: 'Step 1: 3 · n(B) = 15. Step 2: n(B) = 5.'
    mistakes:
      '12': c11m2_count
      '45': c11m2_count
  - prompt: R on {1, 2, 3, 4} is defined by a R b if b = a + 1. How many pairs are in R?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - Try each a and see if a + 1 is in the set.
    - 4 + 1 is not in the set.
    solution: 'Step 1: (1, 2), (2, 3), (3, 4). Step 2: 3 pairs.'
    mistakes:
      '4': c11m2_pair
      '2': c11m2_pair
  - prompt: Is A × B equal to B × A when A = {1} and B = {2}?
    options:
    - 'No'
    - 'Yes'
    - Only if A ⊆ B
    answer: 'No'
    difficulty: 2
    hints:
    - Write both products out.
    - Does (1, 2) equal (2, 1)?
    solution: 'Step 1: A × B = {(1, 2)}, B × A = {(2, 1)}. Step 2: order matters, so they differ.'
    mistakes:
      'Yes': c11m2_pair
      Only if A ⊆ B: c11m2_pair
  - prompt: A × B has 6 elements, including (a, x), (b, y) and (c, x). If n(B) = 2, what is n(A)?
    answer: '3'
    check: 6/2
    difficulty: 3
    hints:
    - List the different first entries you can see.
    - Check with n(A) · n(B) = 6.
    solution: 'Step 1: first entries a, b, c, so n(A) ≥ 3. Step 2: 3 × 2 = 6, so n(A) = 3.'
    mistakes:
      '6': c11m2_count
      '2': c11m2_count
  - prompt: 'Assertion (A): If n(A) = 2 and n(B) = 3, then the number of relations from A to B is 64.

      Reason (R): The number of relations from A to B is 2 raised to n(A) × n(B).'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true: 2^(2×3) = 2⁶ = 64, and R gives exactly the rule used, so R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A school has 3 houses and 4 colours for the sports day flag. Each flag pairs one house with one colour. How many different flags are possible?'
    options:
    - '12'
    - '7'
    - '81'
    answer: '12'
    hints:
    - Each flag is an ordered pair (house, colour).
    - 'Count pairs: houses × colours.'
    solution: 'The flags are the elements of Houses × Colours: 3 × 4 = 12.'
    mistakes:
      '7': m11_cartesian_size
      '81': c11m2_count
    exam: case
    difficulty: 2
  - prompt: 'If A × B = {(a, 1), (a, 2), (b, 1), (b, 2)}, then B is:'
    options:
    - '{1, 2}'
    - '{a, b}'
    - '{a, 1}'
    answer: '{1, 2}'
    hints:
    - B holds the second entries.
    - List each second entry once.
    solution: The second entries are 1 and 2, so B = {1, 2}.
    mistakes:
      '{a, b}': m11_ordered_pair
      '{a, 1}': c11m2_pair
    exam: one_mark
    difficulty: 2
- code: cbse11m.rel.functions
  title: Functions and their graphs
  after:
  - cbse11m.rel.relations
  notes: |
    A function f : A → B is a relation in which every element of A has exactly one image in B. Domain A, codomain B,
    range = set of images. Real functions: identity f(x) = x, constant, polynomial, rational (denominator ≠ 0), modulus
    |x|, signum, greatest integer [x]. Algebra: (f + g)(x), (fg)(x), (f/g)(x) where g(x) ≠ 0. Vertical line test on graphs.
    Domain of f(x) = √(x − 2) is x ≥ 2; of 1/(x − 3) is x ≠ 3.
  explanations:
    text: A function is a rule that gives each input exactly one output. f(x) = x² sends 3 to 9. The domain is the inputs allowed; for 1/(x − 3), x cannot be 3. On a graph, a vertical line should cross a function at most once.
    visual: 'Picture a machine: drop in 3, out comes 9 for f(x) = x². Every input gives one output. If one input gave two outputs, it would not be a function.'
    step_by_step: 'Step 1: Check each input has one output. Step 2: Find the domain: avoid dividing by zero and square roots of negatives. Step 3: Substitute to find values. Step 4: For f + g or fg, work out each, then combine.'
    real_world: 'A taxi fare that depends on distance is a function: each distance gives one fare.'
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - f(x) = |x|
      - f(x) = 1/(x − 3)
      - f(x) = √(x − 2)
    - title: Domain
      points:
      - all real numbers
      - x ≠ 3
      - x ≥ 2
    alt: The modulus function works for all real numbers, 1/(x − 3) needs x ≠ 3, and √(x − 2) needs x ≥ 2.
  activity:
    type: sort
    prompt: Each one is a rule from a set A to a set B. Is it a function? Every element of A needs exactly one image.
    bins:
    - Function
    - Not a function
    items:
    - label: '{(1, 2), (2, 4), (3, 6)}'
      bin: Function
      clue: Does each first element appear exactly once?
      why: 1, 2 and 3 each have one image, so it is a function.
    - label: '{(1, 2), (1, 3), (2, 4)}'
      bin: Not a function
      clue: Look at the first elements. Any repeats?
      why: 1 is sent to both 2 and 3. One input can't have two images.
    - label: '{(1, 5), (2, 5), (3, 5)}'
      bin: Function
      clue: Is it a problem if two inputs share an output?
      why: 'Many inputs may share one image (here 5): each input still has exactly one. A constant function.'
    - label: 'A = {1, 2, 3}: {(1, a), (2, b)}'
      bin: Not a function
      clue: Has every element of A been used?
      why: 3 has no image at all. Every element of the domain needs one.
    - label: y = x², x real
      bin: Function
      clue: Can one x give two different y?
      why: Each x gives one value of x², even though 2 and −2 share 4.
    - label: y² = x, x ≥ 0, y real
      bin: Not a function
      clue: Try x = 4. How many y work?
      why: 'x = 4 gives y = 2 and y = −2: two images for one input.'
    - label: The vertical line x = 3
      bin: Not a function
      clue: How many points sit above x = 3?
      why: 'x = 3 meets every y: one input, infinitely many images.'
    - label: y = |x|
      bin: Function
      clue: Does |x| ever give two answers?
      why: '|x| gives exactly one value for each x, so it passes the vertical line test.'
    - label: The circle x² + y² = 25
      bin: Not a function
      clue: Draw a vertical line at x = 3. How many times does it cut?
      why: 'x = 3 gives y = 4 and y = −4: a vertical line cuts twice.'
    - label: Each student → their roll number
      bin: Function
      clue: Can a student have two roll numbers?
      why: Each student has exactly one roll number.
    - label: Each positive number → its square roots
      bin: Not a function
      clue: How many square roots does 9 have?
      why: 9 has two square roots, 3 and −3.
  lesson:
    - teach: 'A function f : A → B is a relation in which every element of A has exactly one image in B. Two inputs may share an output, but one input may not have two outputs.'
      picture:
        kind: compare
        columns:
        - title: Function
          points:
          - 1 → 4
          - 2 → 5
          - 3 → 4
        - title: Not a function
          points:
          - 1 → 4
          - 1 → 5
          - 2 → 6
        alt: In a function each input has one output; the right column gives input 1 two outputs.
      check:
        prompt: Is {(1, 2), (1, 3), (2, 4)} a function?
        options:
        - 'No'
        - 'Yes'
        - Only if 2 = 3
        answer: 'No'
        why: Input 1 has two images, 2 and 3.
      ways:
      - style: step_by_step
        teach: 'Step 1: List every element of A. Step 2: Check each has an arrow. Step 3: Check none has two arrows. Both yes means a function. Two inputs landing on the same output is allowed.'
      - style: real_world
        teach: 'Each student gets exactly one roll number: that is a function from students to numbers. Two students may share a birthday (same output), but no one has two birthdays. A student with two roll numbers would break the rule.'
    - teach: The domain of a real function is the set of x where the rule makes sense. Exclude x that makes a denominator zero; for √(expression) keep the expression ≥ 0.
      check:
        prompt: What is the domain of f(x) = √(x + 1)?
        options:
        - x ≥ −1
        - x > 1
        - all real x
        answer: x ≥ −1
        why: We need x + 1 ≥ 0.
      ways:
      - style: visual
        teach: What to keep out of the domain of f(x) = √(x − 2)/(x − 5).
        picture:
          kind: number_line
          from: 0
          to: 8
          points:
          - at: 2
            label: 'start: x ≥ 2'
          - at: 5
            label: x ≠ 5
          alt: A number line from 0 to 8 with the domain starting at 2 and the point 5 removed, because the bottom would be zero there.
      - style: real_world
        teach: 'A vending machine only works with certain inputs: it rejects a torn note. A rule like 1/(x − 3) rejects x = 3, and √x rejects negatives. The domain is the list of inputs the machine accepts.'
    - teach: 'Special functions: modulus |x| (distance from 0), greatest integer [x] (largest integer ≤ x), signum (1, 0 or −1). Functions combine: (f + g)(x) = f(x) + g(x), (fg)(x) = f(x)·g(x).'
      picture:
        kind: number_line
        from: -3
        to: 3
        points:
        - at: -2
          label: '[−1.3] = −2'
        - at: -1.3
          label: −1.3
        alt: Greatest integer of −1.3 is −2, the integer just to its left.
      check:
        prompt: What is [−1.3]?
        options:
        - −2
        - −1
        - '1'
        answer: −2
        why: The greatest integer not more than −1.3 is −2.
      ways:
      - style: visual
        teach: 'Greatest integer [x]: every x is pushed down to the integer at or below it.'
        picture:
          kind: number_line
          from: -3
          to: 3
          points:
          - at: 2.7
            label: x = 2.7
          - at: 2
            label: '[2.7] = 2'
          - at: -1.5
            label: x = −1.5
          - at: -2
            label: '[−1.5] = −2'
          jumps:
          - from: 2.7
            to: 2
            label: down
          - from: -1.5
            to: -2
            label: down
          alt: 'On a number line, 2.7 moves down to 2 and minus 1.5 moves down to minus 2: the greatest integer always rounds down.'
      - style: step_by_step
        teach: 'Step 1: For |x|, drop the sign: |−5| = 5. Step 2: For [x], move left to the nearest integer: [−1.5] = −2. Step 3: For signum, ask only the sign: positive 1, zero 0, negative −1. Step 4: For f + g, add the two outputs at the same x.'
  items:
  - prompt: f(x) = x² + 1. Find f(3).
    answer: '10'
    check: 3**2 + 1
    difficulty: 1
    hints:
    - Replace x with 3.
    - 9 + 1.
    solution: f(3) = 9 + 1 = 10.
    mistakes: {"7": "m11_substitute", "9": "m11_substitute"}
  - prompt: Which relation is a function from {1, 2, 3}?
    options:
    - '{(1, 4), (2, 5), (3, 4)}'
    - '{(1, 4), (1, 5), (2, 6), (3, 7)}'
    - '{(1, 4), (2, 5)}'
    - '{(1, 4), (2, 5), (2, 6), (3, 7)}'
    answer: '{(1, 4), (2, 5), (3, 4)}'
    difficulty: 2
    hints:
    - Every input once.
    - Two inputs may share an output.
    solution: Each of 1, 2, 3 has exactly one image.
    mistakes:
      '{(1, 4), (1, 5), (2, 6), (3, 7)}': c11_function
  - prompt: f(x) = |x| − 2. Find f(−5).
    answer: '3'
    check: abs(-5) - 2
    difficulty: 1
    hints:
    - '|−5| = 5.'
    - 5 − 2.
    solution: f(−5) = 5 − 2 = 3.
    mistakes: {"-7": "m11_modulus", "7": "m11_modulus"}
  - prompt: For the greatest integer function, what is [2.7]?
    answer: '2'
    check: floor(Rational(27,10))
    difficulty: 1
    hints:
    - Largest integer ≤ 2.7.
    - Round down.
    solution: '[2.7] = 2.'
    mistakes: {"3": "m11_floor"}
  - prompt: f(x) = 2x + 1 and g(x) = x². Find (f + g)(2).
    answer: '9'
    check: (2*2+1) + 2**2
    difficulty: 2
    hints:
    - f(2) = 5, g(2) = 4.
    - Add.
    solution: 5 + 4 = 9.
    mistakes: {"5": "m11_f_plus_g", "4": "m11_f_plus_g"}
  - prompt: What is the domain of f(x) = 1/(x − 3)?
    options:
    - All real numbers except 3
    - All real numbers
    - x > 3 only
    - x = 3 only
    answer: All real numbers except 3
    difficulty: 2
    hints:
    - Avoid dividing by zero.
    - x − 3 ≠ 0.
    solution: x cannot be 3.
    mistakes: {"All real numbers": "m11_domain_zero", "x > 3 only": "m11_domain_zero", "x = 3 only": "m11_domain_zero"}
  - prompt: f(x) = 3x − 4. Find f(−2).
    answer: '-10'
    check: 3*(-2)-4
    difficulty: 1
    hints:
    - Put −2 in place of x.
    - Mind the sign when multiplying.
    solution: 'Step 1: 3(−2) − 4. Step 2: −6 − 4 = −10.'
    mistakes:
      '2': c11m2_func
      '-2': c11m2_func
  - prompt: What is the domain of f(x) = 1/(x² − 4)?
    options:
    - all real x except 2 and −2
    - all real x except 4
    - x > 2
    answer: all real x except 2 and −2
    difficulty: 2
    hints:
    - When is the denominator zero?
    - x² = 4 has two solutions.
    solution: 'Step 1: x² − 4 = 0 at x = ±2. Step 2: exclude both.'
    mistakes:
      all real x except 4: c11m2_domain
      x > 2: c11m2_domain
  - prompt: f(x) = x² and g(x) = x + 1. Find (fg)(2).
    answer: '12'
    check: 4*3
    difficulty: 2
    hints:
    - Find f(2) and g(2) separately.
    - Multiply them.
    solution: 'Step 1: f(2) = 4, g(2) = 3. Step 2: 4 × 3 = 12.'
    mistakes:
      '7': c11m2_func
      '9': c11m2_func
  - prompt: What is the range of f(x) = |x|?
    options:
    - '[0, ∞)'
    - all real numbers
    - (0, ∞)
    answer: '[0, ∞)'
    difficulty: 2
    hints:
    - Can a distance be negative?
    - Can it be zero?
    solution: 'Step 1: |x| ≥ 0 always, and |0| = 0. Step 2: range [0, ∞).'
    mistakes:
      all real numbers: c11m2_func
      (0, ∞): c11m2_func
  - prompt: How many functions are there from a 2-element set to a 3-element set?
    answer: '9'
    check: 3**2
    difficulty: 3
    hints:
    - Each input chooses one output.
    - Two inputs, three choices each.
    solution: 'Step 1: 3 choices for each of 2 inputs. Step 2: 3² = 9.'
    mistakes:
      '6': c11m2_count
      '8': c11m2_count
  - prompt: What is the domain of f(x) = √(5 − x)?
    options:
    - x ≤ 5
    - x ≥ 5
    - x < 5
    answer: x ≤ 5
    difficulty: 2
    hints:
    - The expression under the root must not be negative.
    - Solve 5 − x ≥ 0.
    solution: 'Step 1: 5 − x ≥ 0. Step 2: x ≤ 5.'
    mistakes:
      x ≥ 5: c11m2_domain
      x < 5: c11m2_domain
  - prompt: 'Signum function: what is sgn(−7)?'
    answer: '-1'
    check: '-1'
    difficulty: 1
    hints:
    - Signum only tells the sign.
    - Negative inputs all give the same value.
    solution: 'Step 1: −7 is negative. Step 2: sgn(−7) = −1.'
    mistakes:
      '-7': c11m2_func
      '7': c11m2_func
  - prompt: 'f(x) = (x² − 9)/(x − 3). For x ≠ 3, f(x) equals:'
    options:
    - x + 3
    - x − 3
    - x² − 3
    answer: x + 3
    difficulty: 3
    hints:
    - Factor the numerator.
    - Difference of squares.
    solution: 'Step 1: x² − 9 = (x − 3)(x + 3). Step 2: cancel (x − 3) to get x + 3.'
    mistakes:
      x − 3: c11m2_domain
      x² − 3: c11m2_domain
  - prompt: f(x) = [x], the greatest integer function. Find f(3.99) + f(−0.5).
    answer: '2'
    check: 3+(-1)
    difficulty: 3
    hints:
    - Find each greatest integer separately.
    - For −0.5 move left to the next integer.
    solution: 'Step 1: [3.99] = 3, [−0.5] = −1. Step 2: 3 + (−1) = 2.'
    mistakes:
      '3': c11m2_func
      '4': c11m2_func
  - prompt: 'Assertion (A): The relation {(1, 2), (1, 3), (2, 4)} is a function.

      Reason (R): In a function, each element of the domain has exactly one image.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: '1 has two images (2 and 3), so it is not a function: A is false. R is the correct definition.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: Find the domain of f(x) = 1/(x² − 9).
    options:
    - R − {3, −3}
    - R − {3}
    - R − {9}
    answer: R − {3, −3}
    hints:
    - When is the bottom zero?
    - x² = 9 has two solutions.
    solution: 'x² − 9 = 0 at x = 3 and x = −3, so remove both: R − {−3, 3}.'
    mistakes:
      R − {3}: m11_domain_zero
      R − {9}: c11m2_domain
    exam: short
    difficulty: 2
  - prompt: 'Situation: A taxi charges ₹50 plus ₹15 per km, so the fare is f(x) = 50 + 15x for x km. What is the fare for a 6 km ride?'
    options:
    - ₹140
    - ₹90
    - ₹65
    answer: ₹140
    hints:
    - Substitute x = 6.
    - 15 × 6 first, then add 50.
    solution: f(6) = 50 + 15 × 6 = 50 + 90 = ₹140.
    mistakes:
      ₹90: m11_substitute
      ₹65: m11_substitute
    exam: competency
    difficulty: 2
