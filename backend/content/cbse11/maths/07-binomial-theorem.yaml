# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-math
chapter: 7
title: Binomial Theorem
tips:
  c11_general_term: The general term is T(r+1) = nCr a^(n−r) b^r. The (r+1)th term uses r, not r + 1.
  c11_middle: For even n there is one middle term, the (n/2 + 1)th. For odd n there are two.
  m11_bin_101: "101² = (100 + 1)². Expand: 100² + 2·100·1 + 1²."
  m11_bin_coeff: "The x² term is ³C₁ · x² · 2¹. Include both the binomial coefficient and the power of 2."
  m11_bin_coeff_2x: "The x² term is ⁴C₂ (2x)². Square the 2 as well."
  m11_bin_coeff_ab: "The a²b² term uses ⁴C₂. Work it out."
  m11_bin_coeff_x: "The x³ term of (1 + x)⁵ has coefficient ⁵C₃."
  m11_bin_negative: "The x⁵ term is ⁷C₅ (−x)⁵. An odd power of a negative stays negative."
  m11_independent: "General term: ⁶Cᵣ x^(6−r) x^(−r). Find r that makes the power of x zero."
  m11_middle: "An odd power gives an even number of terms. How many sit in the middle then?"
  m11_sum_coeff: "Put a = b = 1. The expansion becomes (1 + 1)ⁿ."
  m11_terms_count: "(a + b)ⁿ has one more term than the power. Check with (a + b)² = a² + 2ab + b²."
concepts:
- code: cbse11m.bin.expand
  title: Binomial expansion and Pascal's triangle
  notes: |
    (a + b)ⁿ = nC0 aⁿ + nC1 aⁿ⁻¹b + nC2 aⁿ⁻²b² + ... + nCn bⁿ for positive integer n. n + 1 terms; powers of a fall, of b
    rise; each term's powers add to n. Coefficients nCr form Pascal's triangle (each number = sum of the two above),
    known in India as Meru Prastara (Pingala). Sum of coefficients = 2ⁿ (put a = b = 1). (a − b)ⁿ: signs alternate.
    Example (x + 2)³ = x³ + 6x² + 12x + 8. Use for approximations: (1.01)⁵ ≈ 1.051.
  explanations:
    text: The binomial theorem expands (a + b)ⁿ quickly. The coefficients come from Pascal's triangle (Pingala's Meru Prastara), where each number is the sum of the two above. There are n + 1 terms, and the powers of a go down while the powers of b go up.
    visual: 'Write Pascal''s triangle: 1; 1 1; 1 2 1; 1 3 3 1; 1 4 6 4 1. The row for n = 4 gives (a + b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴.'
    step_by_step: 'Step 1: Find n and the row of coefficients. Step 2: Write powers of a from n down to 0. Step 3: Write powers of b from 0 up to n. Step 4: Multiply coefficient × a-power × b-power for each term and simplify.'
    real_world: Banks use (1 + r)ⁿ for compound interest; for small r, the first few binomial terms give a quick estimate.
  picture:
    kind: flow
    steps:
    - '1'
    - 1 1
    - 1 2 1
    - 1 3 3 1
    - 1 4 6 4 1
    alt: 'Pascal''s triangle rows 0 to 4: each number is the sum of the two above it.'
  activity:
    type: formula
    prompt: '(1 + x)ⁿ = nC0 + nC1 x + nC2 x² + …: the coefficients are row n of Pascal''s triangle.'
    inputs:
    - name: n
      label: n
      min: 1
      max: 8
      step: 1
      start: 1
    - name: r
      label: r, the power of x
      min: 0
      max: 4
      step: 1
      start: 0
    outputs:
    - name: coef
      label: Coefficient nCr
      expr: ((1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4)))/((1+min(1,max(0,r))*(r-1))*(1+min(1,max(0,r-1))*(r-2))*(1+min(1,max(0,r-2))*(r-3))*(1+min(1,max(0,r-3))*(r-4)))
    - name: sum
      label: All coefficients added, 2ⁿ
      expr: 2^n
    goals:
    - prompt: Find a coefficient of 15 in (1 + x)⁶.
      want:
        n: 6
        coef: 15
      mistakes:
      - when:
          n: 6
          r: 3
        say: 6C3 = 20, the middle and biggest one. 15 sits either side of it.
      - when:
          n: 6
          r: 1
        say: 6C1 = 6, the x term. Move further in.
    - prompt: Make the coefficients of (1 + x)ⁿ add up to 128.
      want:
        sum: 128
      hint: 'Put x = 1: (1 + 1)ⁿ adds every coefficient.'
      mistakes:
      - when:
          sum: 64
        say: '2⁶ = 64: one row short.'
      - when:
          sum:
          - 2
          - 32
        say: Too small. Each row adds to twice the row before.
    - prompt: In (1 + x)ⁿ the x term is 8x. Set n and r.
      want:
        r: 1
        coef: 8
      mistakes:
      - when:
          r: 0
        say: r = 0 is the first term, 1, with no x in it.
      - when:
          r: 1
          n:
          - 1
          - 7
        say: 'Too small: in (1 + x)ⁿ the x term is nC1 x = nx.'
  items:
  - prompt: How many terms are in the expansion of (a + b)⁷?
    answer: '8'
    check: 7 + 1
    difficulty: 1
    hints:
    - n + 1 terms.
    - 7 + 1.
    solution: 8 terms.
    mistakes: {"7": "m11_terms_count"}
  - prompt: Find the coefficient of x² in (x + 2)³.
    answer: '6'
    check: binomial(3,1)*2
    difficulty: 1
    hints:
    - ³C₁ x² · 2.
    - 3 × 2.
    solution: The x² term is 3 · x² · 2 = 6x².
    mistakes: {"3": "m11_bin_coeff", "12": "m11_bin_coeff"}
  - prompt: Find the sum of the coefficients in (a + b)⁶.
    answer: '64'
    check: 2**6
    difficulty: 1
    hints:
    - Put a = b = 1.
    - 2⁶.
    solution: 2⁶ = 64.
    mistakes: {"12": "m11_sum_coeff", "32": "m11_sum_coeff"}
  - prompt: Find the coefficient of a²b² in (a + b)⁴.
    answer: '6'
    check: binomial(4,2)
    difficulty: 1
    hints:
    - ⁴C₂.
    - Pascal's row 4.
    solution: ⁴C₂ = 6.
    mistakes: {"4": "m11_bin_coeff_ab", "1": "m11_bin_coeff_ab"}
  - prompt: Expand (1 + x)⁵ and find the coefficient of x³.
    answer: '10'
    check: binomial(5,3)
    difficulty: 2
    hints:
    - ⁵C₃.
    - '10.'
    solution: ⁵C₃ = 10.
    mistakes: {"5": "m11_bin_coeff_x", "20": "m11_bin_coeff_x"}
  - prompt: Using the binomial theorem, find 101² exactly.
    answer: '10201'
    check: 101**2
    difficulty: 2
    hints:
    - (100 + 1)².
    - 10000 + 200 + 1.
    solution: 100² + 2·100 + 1 = 10,201.
    mistakes: {"10001": "m11_bin_101", "1201": "m11_bin_101"}
- code: cbse11m.bin.terms
  title: General and middle terms
  after:
  - cbse11m.bin.expand
  notes: |
    General term T(r+1) = nCr aⁿ⁻ʳ bʳ. To find the coefficient of xᵏ, write the general term, collect the power of x and
    solve for r. Middle term: n even → T(n/2 + 1); n odd → T((n+1)/2) and T((n+3)/2). Term independent of x: power of x
    = 0. Example: in (x + 1/x)⁶ the term independent of x is ⁶C₃ = 20.
  explanations:
    text: Any term of (a + b)ⁿ can be found directly from the general term T(r+1) = nCr aⁿ⁻ʳ bʳ. To find a particular power of x, write the general term, find the power of x in terms of r, and solve.
    visual: 'For (x + 1/x)⁶ the general term is ⁶Cr x⁶⁻ʳ x⁻ʳ = ⁶Cr x⁶⁻²ʳ. Set 6 − 2r = 0: r = 3. The term is ⁶C₃ = 20.'
    step_by_step: 'Step 1: Write T(r+1) = nCr aⁿ⁻ʳ bʳ. Step 2: Simplify the power of x. Step 3: Set it equal to the power you want. Step 4: Solve for r and substitute.'
    real_world: Probability problems (like the chance of exactly 3 heads in 10 tosses) use the same general term, ¹⁰C₃.
  picture:
    kind: compare
    columns:
    - title: n even (e.g. 6)
      points:
      - one middle term
      - T(n/2 + 1)
      - 4th term
    - title: n odd (e.g. 7)
      points:
      - two middle terms
      - T((n+1)/2), T((n+3)/2)
      - 4th and 5th terms
    alt: For even n like 6 there is one middle term, the 4th; for odd n like 7 there are two, the 4th and 5th.
  activity:
    type: formula
    prompt: In (1 + 2x)ⁿ the general term is T(r+1) = nCr (2x)ʳ, so its coefficient is nCr × 2ʳ.
    inputs:
    - name: n
      label: n
      min: 1
      max: 8
      step: 1
      start: 1
    - name: r
      label: r
      min: 0
      max: 4
      step: 1
      start: 0
    outputs:
    - name: plain
      label: nCr
      expr: ((1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4)))/((1+min(1,max(0,r))*(r-1))*(1+min(1,max(0,r-1))*(r-2))*(1+min(1,max(0,r-2))*(r-3))*(1+min(1,max(0,r-3))*(r-4)))
    - name: pw
      label: 2ʳ
      expr: 2^r
    - name: coef
      label: Coefficient nCr × 2ʳ
      expr: ((1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4)))/((1+min(1,max(0,r))*(r-1))*(1+min(1,max(0,r-1))*(r-2))*(1+min(1,max(0,r-2))*(r-3))*(1+min(1,max(0,r-3))*(r-4)))*2^r
    goals:
    - prompt: Make the x² coefficient of (1 + 2x)ⁿ equal 40.
      want:
        r: 2
        coef: 40
      mistakes:
      - when:
          r: 2
          n:
          - 6
          - 8
        say: 'Too big. Keep the 2² = 4 in mind: you need nC2 × 4 = 40, so nC2 = 10.'
      - when:
          r: 2
          n:
          - 1
          - 4
        say: Too small. You need nC2 × 4 = 40, so nC2 = 10.
    - prompt: Find the 4th term's coefficient in (1 + 2x)⁶.
      want:
        n: 6
        r: 3
      mistakes:
      - when:
          n: 6
          r: 4
        say: The 4th term is T(r + 1) with r + 1 = 4, so r = 3. r = 4 gives the 5th term.
    - prompt: Find the middle term of (1 + 2x)⁸.
      want:
        n: 8
        r: 4
      mistakes:
      - when:
          n: 8
          r: 3
        say: '(1 + 2x)⁸ has 9 terms, so the middle one is the 5th: r + 1 = 5.'
  items:
  - prompt: Find the 3rd term coefficient in (x + 2)⁵ (the number multiplying x³).
    answer: '40'
    check: binomial(5,2)*2**2
    difficulty: 2
    hints:
    - 'T₃: r = 2.'
    - ⁵C₂ · 2².
    solution: 10 × 4 = 40.
    mistakes:
      '80': c11_general_term
  - prompt: Find the term independent of x in (x + 1/x)⁶.
    answer: '20'
    check: binomial(6,3)
    difficulty: 2
    hints:
    - Power 6 − 2r = 0.
    - 'r = 3: ⁶C₃.'
    solution: ⁶C₃ = 20.
    mistakes: {"15": "m11_independent", "6": "m11_independent"}
  - prompt: Which term is the middle term of (a + b)¹⁰? Give its number.
    answer: '6'
    check: 10/2 + 1
    difficulty: 1
    hints:
    - 'n even: n/2 + 1.'
    - 10/2 + 1.
    solution: The 6th term.
    mistakes:
      '5': c11_middle
  - prompt: How many middle terms does (a + b)⁹ have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - n is odd.
    - Two middle terms.
    solution: 'Two: the 5th and 6th.'
    mistakes: {"1": "m11_middle"}
  - prompt: Find the coefficient of x² in (1 + 2x)⁴.
    answer: '24'
    check: binomial(4,2)*4
    difficulty: 2
    hints:
    - ⁴C₂ (2x)².
    - 6 × 4.
    solution: 6 × 4 = 24.
    mistakes: {"6": "m11_bin_coeff_2x", "12": "m11_bin_coeff_2x"}
  - prompt: Find the coefficient of x⁵ in (1 − x)⁷.
    answer: '-21'
    check: -binomial(7,5)
    difficulty: 2
    hints:
    - ⁷C₅ (−x)⁵.
    - Odd power is negative.
    solution: −⁷C₅ = −21.
    mistakes: {"21": "m11_bin_negative", "-35": "m11_bin_negative"}
