# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-math
chapter: 7
title: Binomial Theorem
tips:
  c11_general_term: The general term is T(r+1) = nCr a^(n−r) b^r. The (r+1)th term uses r, not r + 1.
  c11_middle: For even n there is one middle term, the (n/2 + 1)th. For odd n there are two.
  m11_bin_101: "101² = (100 + 1)². Expand: 100² + 2·100·1 + 1²."
  m11_bin_coeff: "The x² term is ³C₁ · x² · 2¹. Include both the binomial coefficient and the power of 2."
  m11_bin_coeff_2x: "The x² term is ⁴C₂ (2x)². Square the 2 as well."
  m11_bin_coeff_ab: "The a²b² term uses ⁴C₂. Work it out."
  m11_bin_coeff_x: "The x³ term of (1 + x)⁵ has coefficient ⁵C₃."
  m11_bin_negative: "The x⁵ term is ⁷C₅ (−x)⁵. An odd power of a negative stays negative."
  m11_independent: "General term: ⁶Cᵣ x^(6−r) x^(−r). Find r that makes the power of x zero."
  m11_middle: "An odd power gives an even number of terms. How many sit in the middle then?"
  m11_sum_coeff: "Put a = b = 1. The expansion becomes (1 + 1)ⁿ."
  m11_terms_count: "(a + b)ⁿ has one more term than the power. Check with (a + b)² = a² + 2ab + b²."
  c11m7_term: Write the general term T(r+1) = nCr aⁿ⁻ʳ bʳ first, then match the power you need.
  c11m7_coeff: 'Include every number in the term: the nCr and any constants raised to a power.'
  c11m7_count: (a + b)ⁿ has n + 1 terms; count from T1, not from T0.
concepts:
- code: cbse11m.bin.expand
  title: Binomial expansion and Pascal's triangle
  notes: |
    (a + b)ⁿ = nC0 aⁿ + nC1 aⁿ⁻¹b + nC2 aⁿ⁻²b² + ... + nCn bⁿ for positive integer n. n + 1 terms; powers of a fall, of b
    rise; each term's powers add to n. Coefficients nCr form Pascal's triangle (each number = sum of the two above),
    known in India as Meru Prastara (Pingala). Sum of coefficients = 2ⁿ (put a = b = 1). (a − b)ⁿ: signs alternate.
    Example (x + 2)³ = x³ + 6x² + 12x + 8. Use for approximations: (1.01)⁵ ≈ 1.051.
  explanations:
    text: The binomial theorem expands (a + b)ⁿ quickly. The coefficients come from Pascal's triangle (Pingala's Meru Prastara), where each number is the sum of the two above. There are n + 1 terms, and the powers of a go down while the powers of b go up.
    visual: 'Write Pascal''s triangle: 1; 1 1; 1 2 1; 1 3 3 1; 1 4 6 4 1. The row for n = 4 gives (a + b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴.'
    step_by_step: 'Step 1: Find n and the row of coefficients. Step 2: Write powers of a from n down to 0. Step 3: Write powers of b from 0 up to n. Step 4: Multiply coefficient × a-power × b-power for each term and simplify.'
    real_world: Banks use (1 + r)ⁿ for compound interest; for small r, the first few binomial terms give a quick estimate.
  picture:
    kind: flow
    steps:
    - '1'
    - 1 1
    - 1 2 1
    - 1 3 3 1
    - 1 4 6 4 1
    alt: 'Pascal''s triangle rows 0 to 4: each number is the sum of the two above it.'
  activity:
    type: formula
    prompt: '(1 + x)ⁿ = nC0 + nC1 x + nC2 x² + …: the coefficients are row n of Pascal''s triangle.'
    inputs:
    - name: n
      label: n
      min: 1
      max: 8
      step: 1
      start: 1
    - name: r
      label: r, the power of x
      min: 0
      max: 4
      step: 1
      start: 0
    outputs:
    - name: coef
      label: Coefficient nCr
      expr: ((1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4)))/((1+min(1,max(0,r))*(r-1))*(1+min(1,max(0,r-1))*(r-2))*(1+min(1,max(0,r-2))*(r-3))*(1+min(1,max(0,r-3))*(r-4)))
    - name: sum
      label: All coefficients added, 2ⁿ
      expr: 2^n
    goals:
    - prompt: Find a coefficient of 15 in (1 + x)⁶.
      want:
        n: 6
        coef: 15
      mistakes:
      - when:
          n: 6
          r: 3
        say: 6C3 = 20, the middle and biggest one. 15 sits either side of it.
      - when:
          n: 6
          r: 1
        say: 6C1 = 6, the x term. Move further in.
    - prompt: Make the coefficients of (1 + x)ⁿ add up to 128.
      want:
        sum: 128
      hint: 'Put x = 1: (1 + 1)ⁿ adds every coefficient.'
      mistakes:
      - when:
          sum: 64
        say: '2⁶ = 64: one row short.'
      - when:
          sum:
          - 2
          - 32
        say: Too small. Each row adds to twice the row before.
    - prompt: In (1 + x)ⁿ the x term is 8x. Set n and r.
      want:
        r: 1
        coef: 8
      mistakes:
      - when:
          r: 0
        say: r = 0 is the first term, 1, with no x in it.
      - when:
          r: 1
          n:
          - 1
          - 7
        say: 'Too small: in (1 + x)ⁿ the x term is nC1 x = nx.'
  lesson:
    - teach: (a + b)ⁿ = nC0 aⁿ + nC1 aⁿ⁻¹b + nC2 aⁿ⁻²b² + ... + nCn bⁿ. There are n + 1 terms; the power of a falls by 1 and the power of b rises by 1 each time, always adding to n.
      check:
        prompt: How many terms does (x + y)¹² have?
        options:
        - '13'
        - '12'
        - '24'
        answer: '13'
        why: n + 1 = 13.
      ways:
      - style: visual
        teach: '(a + b)⁴ term by term: the powers always add to 4.'
        picture:
          kind: compare
          columns:
          - title: Power of a
            points:
            - '4'
            - '3'
            - '2'
            - '1'
            - '0'
          - title: Power of b
            points:
            - '0'
            - '1'
            - '2'
            - '3'
            - '4'
          - title: Coefficient ⁴Cr
            points:
            - '1'
            - '4'
            - '6'
            - '4'
            - '1'
          alt: In the expansion of a plus b to the 4, the power of a falls 4, 3, 2, 1, 0, the power of b rises 0 to 4, and the coefficients are 1, 4, 6, 4, 1.
      - style: step_by_step
        teach: 'Step 1: Write n + 1 blank terms. Step 2: Fill powers of a from n down to 0. Step 3: Fill powers of b from 0 up to n. Step 4: Put nC0, nC1, … nCn in front. Example: (a + b)³ = a³ + 3a²b + 3ab² + b³.'
    - teach: 'The coefficients nCr form Pascal''s triangle (Meru Prastara in Pingala''s work): each number is the sum of the two above it. Row 4 is 1 4 6 4 1.'
      picture:
        kind: flow
        steps:
        - '1'
        - 1 1
        - 1 2 1
        - 1 3 3 1
        - 1 4 6 4 1
        alt: Rows 0 to 4 of Pascal's triangle.
      check:
        prompt: What comes after 1 5 10 in row 5 of Pascal's triangle?
        options:
        - '10'
        - '15'
        - '5'
        answer: '10'
        why: Row 5 is 1 5 10 10 5 1; it is symmetric.
      ways:
      - style: step_by_step
        teach: 'Step 1: Start each row with 1. Step 2: Add the two numbers just above to get each inner number. Step 3: End with 1. Row 3 (1 3 3 1) gives row 4: 1, 1+3, 3+3, 3+1, 1 = 1 4 6 4 1.'
      - style: real_world
        teach: 'Toss 4 coins. There is 1 way to get 4 heads, 4 ways to get 3 heads, 6 ways to get 2, 4 ways to get 1, 1 way to get none: the row 1 4 6 4 1 of Pascal''s triangle counts these.'
    - teach: Putting a = b = 1 shows the coefficients add to 2ⁿ. For (a − b)ⁿ the signs alternate +, −, +, ... .
      check:
        prompt: Sum of the coefficients of (x + y)⁸?
        options:
        - '256'
        - '16'
        - '64'
        answer: '256'
        why: 2⁸ = 256.
      ways:
      - style: visual
        teach: 'Sign pattern in (a − b)ⁿ: write −b as the second term and the signs alternate.'
        picture:
          kind: flow
          steps:
          - (a − b)³ = (a + (−b))³
          - a³ + 3a²(−b) + 3a(−b)² + (−b)³
          - a³ − 3a²b + 3ab² − b³
          alt: Rewrite a minus b as a plus negative b, expand normally, and the odd powers of negative b give minus signs, so the signs alternate.
      - style: step_by_step
        teach: 'Step 1: Put a = 1 and b = 1 in (a + b)ⁿ. Step 2: The left side becomes 2ⁿ. Step 3: The right side becomes the sum of all coefficients. So nC0 + nC1 + … + nCn = 2ⁿ. For n = 6 that is 64.'
  items:
  - prompt: How many terms are in the expansion of (a + b)⁷?
    answer: '8'
    check: 7 + 1
    difficulty: 1
    hints:
    - n + 1 terms.
    - 7 + 1.
    solution: 8 terms.
    mistakes: {"7": "m11_terms_count"}
  - prompt: Find the coefficient of x² in (x + 2)³.
    answer: '6'
    check: binomial(3,1)*2
    difficulty: 1
    hints:
    - ³C₁ x² · 2.
    - 3 × 2.
    solution: The x² term is 3 · x² · 2 = 6x².
    mistakes: {"3": "m11_bin_coeff", "12": "m11_bin_coeff"}
  - prompt: Find the sum of the coefficients in (a + b)⁶.
    answer: '64'
    check: 2**6
    difficulty: 1
    hints:
    - Put a = b = 1.
    - 2⁶.
    solution: 2⁶ = 64.
    mistakes: {"12": "m11_sum_coeff", "32": "m11_sum_coeff"}
  - prompt: Find the coefficient of a²b² in (a + b)⁴.
    answer: '6'
    check: binomial(4,2)
    difficulty: 1
    hints:
    - ⁴C₂.
    - Pascal's row 4.
    solution: ⁴C₂ = 6.
    mistakes: {"4": "m11_bin_coeff_ab", "1": "m11_bin_coeff_ab"}
  - prompt: Expand (1 + x)⁵ and find the coefficient of x³.
    answer: '10'
    check: binomial(5,3)
    difficulty: 2
    hints:
    - ⁵C₃.
    - '10.'
    solution: ⁵C₃ = 10.
    mistakes: {"5": "m11_bin_coeff_x", "20": "m11_bin_coeff_x"}
  - prompt: Using the binomial theorem, find 101² exactly.
    answer: '10201'
    check: 101**2
    difficulty: 2
    hints:
    - (100 + 1)².
    - 10000 + 200 + 1.
    solution: 100² + 2·100 + 1 = 10,201.
    mistakes: {"10001": "m11_bin_101", "1201": "m11_bin_101"}
  - prompt: Find the coefficient of x in (x + 3)⁴.
    answer: '108'
    check: 4*27
    difficulty: 2
    hints:
    - The x term has x¹ and 3³.
    - Multiply by ⁴C₃.
    solution: 'Step 1: ⁴C₃ x · 3³. Step 2: 4 × 27 = 108.'
    mistakes:
      '12': c11m7_coeff
      '4': c11m7_coeff
  - prompt: Expand (x − 1)³.
    options:
    - x³ − 3x² + 3x − 1
    - x³ + 3x² + 3x + 1
    - x³ − 1
    answer: x³ − 3x² + 3x − 1
    difficulty: 1
    hints:
    - Coefficients 1 3 3 1.
    - Signs alternate for a minus.
    solution: 'Step 1: 1, 3, 3, 1. Step 2: x³ − 3x² + 3x − 1.'
    mistakes:
      x³ + 3x² + 3x + 1: c11m7_coeff
      x³ − 1: c11m7_count
  - prompt: How many terms are in (2x − y)⁹?
    answer: '10'
    check: 9+1
    difficulty: 1
    hints:
    - The numbers inside do not change the count.
    - n + 1.
    solution: 'Step 1: n = 9. Step 2: 10 terms.'
    mistakes:
      '9': c11m7_count
      '18': c11m7_count
  - prompt: Find 99² using (100 − 1)².
    answer: '9801'
    check: 99**2
    difficulty: 2
    hints:
    - (a − b)² = a² − 2ab + b².
    - a = 100, b = 1.
    solution: 'Step 1: 10000 − 200 + 1. Step 2: 9801.'
    mistakes:
      '9999': c11m7_coeff
      '9800': c11m7_coeff
  - prompt: Sum of the coefficients of (1 + x)¹⁰?
    answer: '1024'
    check: 2**10
    difficulty: 1
    hints:
    - Put x = 1.
    - 2 to the power 10.
    solution: 'Step 1: (1 + 1)¹⁰. Step 2: 1024.'
    mistakes:
      '20': c11m7_coeff
      '11': c11m7_count
  - prompt: Find the coefficient of x²y³ in (x + y)⁵.
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - The power of y tells r.
    - ⁵C₃.
    solution: 'Step 1: r = 3. Step 2: ⁵C₃ = 10.'
    mistakes:
      '5': c11m7_term
      '20': c11m7_term
  - prompt: Find the coefficient of x² in (1 − 3x)⁴.
    answer: '54'
    check: 6*9
    difficulty: 3
    hints:
    - The x² term uses (−3x)².
    - Multiply by ⁴C₂.
    solution: 'Step 1: ⁴C₂ (−3)² = 6 × 9. Step 2: 54.'
    mistakes:
      '-54': c11m7_coeff
      '18': c11m7_coeff
  - prompt: 'Which is larger: (1.1)¹⁰ or 2?'
    options:
    - (1.1)¹⁰
    - '2'
    - they are equal
    answer: (1.1)¹⁰
    difficulty: 3
    hints:
    - Expand (1 + 0.1)¹⁰ and look at the first two terms.
    - 1 + 10 × 0.1 already makes 2.
    solution: 'Step 1: (1 + 0.1)¹⁰ = 1 + 1 + (positive terms). Step 2: so it is more than 2.'
    mistakes:
      '2': c11m7_coeff
      they are equal: c11m7_coeff
  - prompt: In Pascal's triangle, what is the 3rd number in row 6 (row 0 is 1)?
    answer: '15'
    check: '15'
    difficulty: 2
    hints:
    - Row 6 starts 1, 6, ...
    - That number is ⁶C₂.
    solution: 'Step 1: row 6: 1 6 15 20 15 6 1. Step 2: 15.'
    mistakes:
      '6': c11m7_count
      '20': c11m7_count
  - prompt: 'Assertion (A): The expansion of (x + y)⁸ has 8 terms.

      Reason (R): The expansion of (a + b)ⁿ has n + 1 terms.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: By R, (x + y)⁸ has 8 + 1 = 9 terms, so A is false while R is true.
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: Using the binomial theorem, find (99)³ by writing 99 = 100 − 1.
    options:
    - '970299'
    - '970301'
    - '999999'
    answer: '970299'
    hints:
    - (100 − 1)³ = 100³ − 3·100²·1 + 3·100·1 − 1.
    - Watch the alternating signs.
    solution: 1000000 − 30000 + 300 − 1 = 970299.
    mistakes:
      '970301': m11_bin_negative
      '999999': m11_bin_101
    exam: short
    difficulty: 2
  - prompt: What is the sum of the coefficients in the expansion of (1 + x)¹⁰?
    options:
    - '1024'
    - '10'
    - '20'
    answer: '1024'
    hints:
    - Put x = 1.
    - That gives 2 to what power?
    solution: 'Put x = 1: (1 + 1)¹⁰ = 2¹⁰ = 1024.'
    mistakes:
      '10': m11_sum_coeff
      '20': m11_sum_coeff
    exam: one_mark
    difficulty: 2
- code: cbse11m.bin.terms
  title: General and middle terms
  after:
  - cbse11m.bin.expand
  notes: |
    General term T(r+1) = nCr aⁿ⁻ʳ bʳ. To find the coefficient of xᵏ, write the general term, collect the power of x and
    solve for r. Middle term: n even → T(n/2 + 1); n odd → T((n+1)/2) and T((n+3)/2). Term independent of x: power of x
    = 0. Example: in (x + 1/x)⁶ the term independent of x is ⁶C₃ = 20.
  explanations:
    text: Any term of (a + b)ⁿ can be found directly from the general term T(r+1) = nCr aⁿ⁻ʳ bʳ. To find a particular power of x, write the general term, find the power of x in terms of r, and solve.
    visual: 'For (x + 1/x)⁶ the general term is ⁶Cr x⁶⁻ʳ x⁻ʳ = ⁶Cr x⁶⁻²ʳ. Set 6 − 2r = 0: r = 3. The term is ⁶C₃ = 20.'
    step_by_step: 'Step 1: Write T(r+1) = nCr aⁿ⁻ʳ bʳ. Step 2: Simplify the power of x. Step 3: Set it equal to the power you want. Step 4: Solve for r and substitute.'
    real_world: Probability problems (like the chance of exactly 3 heads in 10 tosses) use the same general term, ¹⁰C₃.
  picture:
    kind: compare
    columns:
    - title: n even (e.g. 6)
      points:
      - one middle term
      - T(n/2 + 1)
      - 4th term
    - title: n odd (e.g. 7)
      points:
      - two middle terms
      - T((n+1)/2), T((n+3)/2)
      - 4th and 5th terms
    alt: For even n like 6 there is one middle term, the 4th; for odd n like 7 there are two, the 4th and 5th.
  activity:
    type: formula
    prompt: In (1 + 2x)ⁿ the general term is T(r+1) = nCr (2x)ʳ, so its coefficient is nCr × 2ʳ.
    inputs:
    - name: n
      label: n
      min: 1
      max: 8
      step: 1
      start: 1
    - name: r
      label: r
      min: 0
      max: 4
      step: 1
      start: 0
    outputs:
    - name: plain
      label: nCr
      expr: ((1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4)))/((1+min(1,max(0,r))*(r-1))*(1+min(1,max(0,r-1))*(r-2))*(1+min(1,max(0,r-2))*(r-3))*(1+min(1,max(0,r-3))*(r-4)))
    - name: pw
      label: 2ʳ
      expr: 2^r
    - name: coef
      label: Coefficient nCr × 2ʳ
      expr: ((1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4)))/((1+min(1,max(0,r))*(r-1))*(1+min(1,max(0,r-1))*(r-2))*(1+min(1,max(0,r-2))*(r-3))*(1+min(1,max(0,r-3))*(r-4)))*2^r
    goals:
    - prompt: Make the x² coefficient of (1 + 2x)ⁿ equal 40.
      want:
        r: 2
        coef: 40
      mistakes:
      - when:
          r: 2
          n:
          - 6
          - 8
        say: 'Too big. Keep the 2² = 4 in mind: you need nC2 × 4 = 40, so nC2 = 10.'
      - when:
          r: 2
          n:
          - 1
          - 4
        say: Too small. You need nC2 × 4 = 40, so nC2 = 10.
    - prompt: Find the 4th term's coefficient in (1 + 2x)⁶.
      want:
        n: 6
        r: 3
      mistakes:
      - when:
          n: 6
          r: 4
        say: The 4th term is T(r + 1) with r + 1 = 4, so r = 3. r = 4 gives the 5th term.
    - prompt: Find the middle term of (1 + 2x)⁸.
      want:
        n: 8
        r: 4
      mistakes:
      - when:
          n: 8
          r: 3
        say: '(1 + 2x)⁸ has 9 terms, so the middle one is the 5th: r + 1 = 5.'
  lesson:
    - teach: The general term of (a + b)ⁿ is T(r+1) = nCr aⁿ⁻ʳ bʳ. To find a particular term, write T(r+1), collect powers, and solve for r.
      check:
        prompt: Which term of (a + b)ⁿ contains b⁴?
        options:
        - T5
        - T4
        - T6
        answer: T5
        why: b⁴ needs r = 4, which is T(r+1) = T5.
      ways:
      - style: step_by_step
        teach: 'Step 1: Write T(r+1) = nCr aⁿ⁻ʳ bʳ with your a and b. Step 2: Collect the power of x. Step 3: Set it equal to the power you want and solve for r. Step 4: Put r back in. Example: x³ in (x + 2)⁵: x^(5−r) = x³, r = 2, ⁵C₂ · 2² = 40.'
      - style: visual
        teach: Finding the x³ term of (x + 2)⁵ by walking along the general term.
        picture:
          kind: flow
          steps:
          - T(r+1) = ⁵Cr x^(5−r) 2ʳ
          - 'Want x³: 5 − r = 3'
          - r = 2
          - ⁵C₂ · 2² = 10 · 4 = 40
          alt: Write the general term, set the power of x to 3, find r equals 2, and get the coefficient 10 times 4, which is 40.
    - teach: 'Middle term: if n is even there is one, T(n/2 + 1); if n is odd there are two, T((n+1)/2) and T((n+3)/2).'
      check:
        prompt: What is the middle term number of (a + b)⁸?
        options:
        - '5'
        - '4'
        - '9'
        answer: '5'
        why: n/2 + 1 = 5.
      ways:
      - style: visual
        teach: Where the middle term sits for even and odd n.
        picture:
          kind: compare
          columns:
          - title: 'n = 10 (even): 11 terms'
            points:
            - one middle term
            - T6 = T(n/2 + 1)
          - title: 'n = 7 (odd): 8 terms'
            points:
            - two middle terms
            - T4 and T5
          alt: With n equal to 10 there are 11 terms and one middle term, the 6th; with n equal to 7 there are 8 terms and two middle terms, the 4th and 5th.
      - style: real_world
        teach: 'In a queue of 11 people, the one in the middle is the 6th: 5 ahead and 5 behind. In a queue of 8 there is no single middle person: the 4th and 5th share it. The terms of (a + b)ⁿ queue up the same way, n + 1 of them.'
    - teach: 'Term independent of x: set the power of x in the general term to 0. In (x + 1/x)⁴, T(r+1) has x^(4 − 2r), so r = 2 and the term is ⁴C₂ = 6.'
      check:
        prompt: In (x + 1/x)², what is the term independent of x?
        options:
        - '2'
        - '1'
        - '4'
        answer: '2'
        why: 'x² + 2 + 1/x²: the constant is 2.'
      ways:
      - style: visual
        teach: In (x + 1/x)⁶ the power of x drops by 2 each term; the constant sits where it hits 0.
        picture:
          kind: number_line
          from: -6
          to: 6
          points:
          - at: 6
