# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 14. Format: content/README.md.
subject: cbse11-math
chapter: 14
title: Probability
tips:
  c11_complement: P(not A) = 1 − P(A). For 'at least one', it is often easiest to find 1 − P(none).
  c11_addition: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). Subtract the overlap so it isn't counted twice.
  m11_exclusive: "Can one roll be both even and odd? Do the two events together cover every outcome?"
  m11_impossible: "A sure event always happens. What do we call the opposite?"
  m11_list_sum: "List the pairs: (1, 6), (2, 5)… Remember (1, 6) and (6, 1) are different outcomes. Count them."
  m11_not_a: "P(not A) = 1 − P(A)."
  m11_prob_count: "List the favourable faces (more than 4, so 4 itself doesn't count) and divide by 6."
  m11_prob_dice: "Count the pairs that make the sum and divide by 36."
  m11_sample_space: "List them: HH, HT, ... Each coin has 2 outcomes; multiply."
  m11_union_prob: "P(A ∪ B) = P(A) + P(B) − P(A ∩ B). The overlap was counted twice."
  c11m14_space: 'List the sample space carefully, or count it: each coin gives 2 choices, each die 6, and choices multiply.'
  c11m14_count: Count the favourable outcomes one by one, then divide by the total number of outcomes.
  c11m14_rule: For 'A or B', add the two probabilities and take away the overlap once. For 'not A', subtract from 1.
concepts:
- code: cbse11m.prob.events
  title: Random experiments, sample spaces and events
  notes: |
    Random experiment: outcomes not certain in advance. Sample space S: set of all outcomes (two coins: {HH, HT, TH, TT};
    a die: 6 outcomes; two dice: 36). Event: subset of S. Simple, compound, sure (S), impossible (∅) events. Complement
    A′ ('not A'), A ∪ B ('A or B'), A ∩ B ('A and B'). Mutually exclusive: A ∩ B = ∅. Exhaustive: union is S.
  explanations:
    text: A random experiment is one where you can't predict the result, like tossing a coin. The sample space lists every possible outcome; an event is any group of outcomes. Two events are mutually exclusive if they can't happen together, like getting 2 and 5 on one roll.
    visual: 'Draw a 6 × 6 grid for two dice: rows for the first die, columns for the second. 36 cells = 36 outcomes. Shade the cells where the sum is 7: there are 6.'
    step_by_step: 'Step 1: List the sample space. Step 2: Count its outcomes. Step 3: Mark the outcomes in the event. Step 4: Check whether events overlap.'
    real_world: Weather apps and cricket win predictions all start from listing what could happen.
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: H
    - size: 1
      label: T
    rows:
    - size: 1
      label: H
    - size: 1
      label: T
    cells:
    - - HH
      - HT
    - - TH
      - TT
    alt: 'Sample space for tossing two coins: HH, HT, TH and TT.'
  activity:
    type: sort
    prompt: Can both events happen on the same go?
    bins:
    - Mutually exclusive
    - Can happen together
    items:
    - label: 'One die: A even, B odd'
      bin: Mutually exclusive
      clue: Is there a number that is even and odd?
      why: No number is both even and odd, so A and B can't happen together.
    - label: 'One die: A more than 3, B even'
      bin: Can happen together
      clue: Does 4 or 6 fit both?
      why: 4 and 6 are in both, so both can happen at once.
    - label: 'One die: A a 6, B less than 3'
      bin: Mutually exclusive
      clue: Can a 6 be less than 3?
      why: 'A 6 is never below 3: no shared outcome.'
    - label: 'One die: A prime, B even'
      bin: Can happen together
      clue: Is there an even prime on a die?
      why: 2 is prime and even, so they overlap.
    - label: 'One card: A a king, B a heart'
      bin: Can happen together
      clue: Is there a card that is both?
      why: The king of hearts is both.
    - label: 'One card: A a red card, B a spade'
      bin: Mutually exclusive
      clue: What colour are spades?
      why: Spades are black, so no card is red and a spade.
    - label: 'Two coins: A two heads, B at least one tail'
      bin: Mutually exclusive
      clue: If both coins are heads, can there be a tail?
      why: HH has no tail, so these two never happen together.
    - label: 'Two coins: A at least one head, B at least one tail'
      bin: Can happen together
      clue: What about HT?
      why: HT has a head and a tail, so both happen.
    - label: 'Two dice: A total 12, B a double'
      bin: Can happen together
      clue: How do you make 12?
      why: Only (6, 6) makes 12, and it is a double.
    - label: 'Two dice: A total 7, B a double'
      bin: Mutually exclusive
      clue: Can two equal numbers add to 7?
      why: Two equal numbers make an even total, never 7.
  lesson:
    - teach: 'A random experiment has outcomes we cannot predict for sure. The sample space S is the set of all its outcomes. One coin: {H, T}. One die: {1, 2, 3, 4, 5, 6}.'
      check:
        prompt: Sample space for tossing one coin and rolling one die has how many outcomes?
        options:
        - '12'
        - '8'
        - '6'
        answer: '12'
        why: 2 × 6 = 12.
    - teach: An event is a subset of S. A sure event is S itself; an impossible event is ∅. The complement A′ is everything in S that is not in A.
      check:
        prompt: One die. A = {2, 4, 6}. A′ = ?
        options:
        - '{1, 3, 5}'
        - '{1, 2, 3}'
        - '{6}'
        answer: '{1, 3, 5}'
        why: All outcomes not in A.
    - teach: A ∪ B means 'A or B', A ∩ B means 'A and B'. A and B are mutually exclusive if A ∩ B = ∅ (they cannot happen together); exhaustive if A ∪ B = S.
      picture:
        kind: compare
        columns:
        - title: Words
          points:
          - A or B
          - A and B
          - not A
        - title: Sets
          points:
          - A ∪ B
          - A ∩ B
          - A′
        alt: Words and set symbols for events.
      check:
        prompt: 'One die: ''getting 1'' and ''getting 6'' are:'
        options:
        - mutually exclusive but not exhaustive
        - exhaustive
        - the same event
        answer: mutually exclusive but not exhaustive
        why: They cannot both happen, but 2–5 are left out.
  items:
  - prompt: How many outcomes are there when two coins are tossed?
    answer: '4'
    check: 2*2
    difficulty: 1
    hints:
    - HH, HT, TH, TT.
    - 2 × 2.
    solution: '4.'
    mistakes: {"2": "m11_sample_space", "3": "m11_sample_space"}
  - prompt: How many outcomes are there when two dice are rolled?
    answer: '36'
    check: 6*6
    difficulty: 1
    hints:
    - 6 × 6.
    - Ordered pairs.
    solution: '36.'
    mistakes: {"12": "m11_sample_space", "6": "m11_sample_space"}
  - prompt: Two dice are rolled. In how many outcomes is the sum 7?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - (1,6), (2,5), ...
    - Count them.
    solution: 6 outcomes.
    mistakes: {"1": "m11_list_sum", "7": "m11_list_sum"}
  - prompt: 'Getting an even number and getting an odd number on one die roll are:'
    options:
    - mutually exclusive and exhaustive
    - not mutually exclusive
    - impossible events
    - the same event
    answer: mutually exclusive and exhaustive
    difficulty: 2
    hints:
    - Can both happen? Do they cover everything?
    - No overlap, all covered.
    solution: They can't both happen, and together they cover all outcomes.
    mistakes: {"not mutually exclusive": "m11_exclusive", "impossible events": "m11_exclusive", "the same event": "m11_exclusive"}
  - prompt: Three coins are tossed. How many outcomes are in the sample space?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - 2³.
    - Each coin H or T.
    solution: '8.'
    mistakes: {"6": "m11_sample_space", "3": "m11_sample_space"}
  - prompt: 'An event that can never happen is called:'
    options:
    - an impossible event
    - a sure event
    - a simple event
    - a compound event
    answer: an impossible event
    difficulty: 1
    hints:
    - Like rolling a 7 on a die.
    - Empty set.
    solution: It is an impossible event.
    mistakes: {"a sure event": "m11_impossible", "a simple event": "m11_impossible", "a compound event": "m11_impossible"}
  - prompt: How many outcomes are there when four coins are tossed?
    answer: '16'
    check: 2**4
    difficulty: 1
    hints:
    - Each coin has 2 outcomes.
    - Multiply for four coins.
    solution: 'Step 1: 2 × 2 × 2 × 2. Step 2: 16.'
    mistakes:
      '8': c11m14_space
      '4': c11m14_space
  - prompt: Two dice are rolled. In how many outcomes is the sum 10?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - List pairs (first die, second die).
    - Remember (4, 6) and (6, 4) are different.
    solution: 'Step 1: (4, 6), (5, 5), (6, 4). Step 2: 3.'
    mistakes:
      '2': c11m14_count
      '4': c11m14_count
  - prompt: 'Two coins are tossed. Event A: at least one head. How many outcomes are in A?'
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - S = {HH, HT, TH, TT}.
    - Leave out only the outcome with no head.
    solution: 'Step 1: HH, HT, TH. Step 2: 3.'
    mistakes:
      '2': c11m14_count
      '1': c11m14_count
  - prompt: 'An event that is the whole sample space is called:'
    options:
    - a sure event
    - an impossible event
    - a simple event
    answer: a sure event
    difficulty: 1
    hints:
    - Every outcome belongs to it.
    - So it always happens.
    solution: 'Step 1: E = S contains every outcome. Step 2: it is a sure event.'
    mistakes:
      an impossible event: c11m14_space
      a simple event: c11m14_space
  - prompt: One die. A = {1, 2, 3}, B = {3, 4}. A ∩ B = ?
    options:
    - '{3}'
    - '{1, 2, 3, 4}'
    - ∅
    answer: '{3}'
    difficulty: 2
    hints:
    - ∩ means 'and'.
    - Which outcome is in both?
    solution: 'Step 1: common outcomes of A and B. Step 2: {3}.'
    mistakes:
      '{1, 2, 3, 4}': c11m14_rule
      ∅: c11m14_rule
  - prompt: 'One die. A: ''number less than 3'', B: ''number more than 3''. A and B are:'
    options:
    - mutually exclusive, not exhaustive
    - mutually exclusive and exhaustive
    - not mutually exclusive
    answer: mutually exclusive, not exhaustive
    difficulty: 2
    hints:
    - Can a number be both less than 3 and more than 3?
    - Is every outcome covered? Check 3.
    solution: 'Step 1: A ∩ B = ∅. Step 2: 3 is in neither, so not exhaustive.'
    mistakes:
      mutually exclusive and exhaustive: c11m14_space
      not mutually exclusive: c11m14_space
  - prompt: Two dice are rolled. How many outcomes show a doublet (same number on both)?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - (1, 1) is one doublet.
    - How many numbers can repeat?
    solution: 'Step 1: (1,1), (2,2), …, (6,6). Step 2: 6.'
    mistakes:
      '36': c11m14_count
      '12': c11m14_count
  - prompt: A family has 3 children. How many outcomes have exactly two girls?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - Write G or B for each child, in order.
    - Where can the one boy be?
    solution: 'Step 1: GGB, GBG, BGG. Step 2: 3.'
    mistakes:
      '2': c11m14_count
      '1': c11m14_count
  - prompt: A coin is tossed until a head appears, at most 3 times. How many outcomes in S?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - Stop as soon as you get H.
    - H, TH, TTH, …
    solution: 'Step 1: S = {H, TH, TTH, TTT}. Step 2: 4.'
    mistakes:
      '8': c11m14_space
      '3': c11m14_space
- code: cbse11m.prob.axioms
  title: Probability of events
  after:
  - cbse11m.prob.events
  notes: |
    Axiomatic approach: 0 ≤ P(A) ≤ 1, P(S) = 1, P(∅) = 0. Equally likely outcomes: P(A) = n(A)/n(S). P(A′) = 1 − P(A).
    Addition rule: P(A ∪ B) = P(A) + P(B) − P(A ∩ B); for mutually exclusive events P(A ∪ B) = P(A) + P(B). Example: a card
    from 52: P(king or heart) = 4/52 + 13/52 − 1/52 = 16/52 = 4/13.
  explanations:
    text: Probability is a number from 0 (impossible) to 1 (certain). With equally likely outcomes, P(A) = favourable outcomes ÷ total outcomes. P(not A) = 1 − P(A). For 'A or B', add the probabilities and subtract the overlap.
    visual: In a pack of 52 cards, circle the 13 hearts and the 4 kings. One card (king of hearts) is in both circles, so 'king or heart' covers 13 + 4 − 1 = 16 cards.
    step_by_step: 'Step 1: Count the sample space. Step 2: Count favourable outcomes. Step 3: Divide. Step 4: For ''or'', use the addition rule; for ''not'', use 1 − P.'
    real_world: If the chance of rain is 0.3, the chance of no rain is 0.7.
  picture:
    kind: compare
    columns:
    - title: Rule
      points:
      - P(A′)
      - P(A ∪ B)
      - Mutually exclusive
    - title: Formula
      points:
      - 1 − P(A)
      - P(A) + P(B) − P(A ∩ B)
      - P(A) + P(B)
    alt: P(not A) = 1 − P(A); P(A or B) = P(A) + P(B) − P(A and B); for mutually exclusive events just add.
  activity:
    type: formula
    prompt: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). The overlap is counted twice in P(A) + P(B), so it is taken away once.
    inputs:
    - name: pa
      label: P(A)
      min: 0
      max: 1
      step: 0.05
      start: 0
    - name: pb
      label: P(B)
      min: 0
      max: 1
      step: 0.05
      start: 0
    - name: pab
      label: P(A ∩ B), both
      min: 0
      max: 1
      step: 0.05
      start: 0
    outputs:
    - name: u
      label: P(A ∪ B), A or B
      expr: pa+pb-pab
      places: 2
    - name: na
      label: P(not A)
      expr: 1-pa
      places: 2
    goals:
    - prompt: P(A) = 0.5, P(B) = 0.4 and P(A ∪ B) = 0.7. Find P(A ∩ B).
      want:
        pa: 0.5
        pb: 0.4
        u: 0.7
      mistakes:
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0
        say: With no overlap the union would be 0.9. The overlap is counted twice in P(A) + P(B).
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0.7
        say: 0.7 is the union, 'A or B'. 'A and B' is the overlap, which can't be bigger than P(B).
    - prompt: A and B are mutually exclusive, P(A) = 0.35 and P(B) = 0.45. Find P(A ∪ B).
      want:
        pa: 0.35
        pb: 0.45
        pab: 0
      mistakes:
      - when:
          pa: 0.35
          pb: 0.45
          pab:
          - 0.05
          - 0.45
        say: Mutually exclusive events can't happen together, so P(A ∩ B) = 0.
    - prompt: P(A) = 0.8 and P(B) = 0.6. What is the smallest P(A ∩ B) can be?
      want:
        pa: 0.8
        pb: 0.6
        pab: 0.4
      mistakes:
      - when:
          pa: 0.8
          pb: 0.6
          u:
          - 1.01
          - 1.4
        say: 'P(A ∪ B) is over 1, which is impossible: the overlap must be bigger.'
      - when:
          pa: 0.8
          pb: 0.6
          pab:
          - 0.45
          - 0.6
        say: That works, but it isn't the smallest. Push P(A ∪ B) up to its limit, 1.
  lesson:
    - teach: 'Every probability lies between 0 and 1: P(∅) = 0 and P(S) = 1. With equally likely outcomes, P(A) = n(A)/n(S).'
      check:
        prompt: A die is rolled. P(a multiple of 3)?
        options:
        - 1/3
        - 1/2
        - 1/6
        answer: 1/3
        why: '{3, 6}: 2 of 6.'
    - teach: 'Complement rule: P(not A) = 1 − P(A). Very useful for ''at least one'' questions: P(at least one) = 1 − P(none).'
      check:
        prompt: Two coins. P(at least one tail)?
        options:
        - 3/4
        - 1/4
        - 1/2
        answer: 3/4
        why: 1 − P(HH) = 1 − 1/4.
    - teach: 'Addition rule: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). If A and B are mutually exclusive, the overlap is 0, so just add.'
      picture:
        kind: flow
        steps:
        - Add P(A) and P(B)
        - Overlap counted twice
        - Subtract P(A ∩ B) once
        alt: Why the addition rule subtracts the overlap.
      check:
        prompt: P(A) = 0.3, P(B) = 0.5, A and B mutually exclusive. P(A or B)?
        options:
        - '0.8'
        - '0.15'
        - '0.2'
        answer: '0.8'
        why: 'No overlap: 0.3 + 0.5.'
  items:
  - prompt: A die is rolled. Find the probability of getting a number greater than 4.
    answer: 1/3
    check: Rational(2,6)
    difficulty: 1
    hints:
    - 5 and 6.
    - 2/6.
    solution: 2/6 = 1/3.
    mistakes: {"1/2": "m11_prob_count", "2/3": "m11_prob_count"}
  - prompt: Two dice are rolled. Find the probability that the sum is 7.
    answer: 1/6
    check: Rational(6,36)
    difficulty: 1
    hints:
    - 6 favourable of 36.
    - 6/36.
    solution: 1/6.
    mistakes: {"7/36": "m11_prob_dice", "1/12": "m11_prob_dice"}
  - prompt: A card is drawn from a pack of 52. Find P(king or heart).
    answer: 4/13
    check: Rational(4+13-1,52)
    difficulty: 2
    hints:
    - 4/52 + 13/52 − 1/52.
    - 16/52.
    solution: 4/13.
    mistakes:
      17/52: c11_addition
  - prompt: P(A) = 0.35. Find P(not A).
    answer: 13/20
    check: 1 - Rational(35,100)
    difficulty: 1
    hints:
    - 1 − 0.35.
    - 0.65.
    solution: 0.65 = 13/20.
    mistakes: {"7/20": "m11_not_a", "-13/20": "m11_not_a"}
  - prompt: Three coins are tossed. Find the probability of at least one head.
    answer: 7/8
    check: 1 - Rational(1,8)
    difficulty: 2
    hints:
    - 1 − P(no heads).
    - 1 − 1/8.
    solution: 7/8.
    mistakes:
      3/8: c11_complement
  - prompt: P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.2. Find P(A ∪ B).
    answer: 7/10
    check: Rational(5,10)+Rational(4,10)-Rational(2,10)
    difficulty: 2
    hints:
    - 0.5 + 0.4 − 0.2.
    - 0.7.
    solution: 0.7 = 7/10.
    mistakes: {"9/10": "m11_union_prob", "1/2": "m11_union_prob"}
  - prompt: A die is rolled. Find the probability of a prime number.
    answer: 1/2
    check: 3/6
    difficulty: 1
    hints:
    - 'Primes on a die: list them.'
    - Remember 1 is not prime.
    solution: 'Step 1: {2, 3, 5}. Step 2: 3/6 = 1/2.'
    mistakes:
      2/3: c11m14_count
      1/3: c11m14_count
  - prompt: P(A) = 2/7. Find P(not A).
    answer: 5/7
    check: 1-2/7
    difficulty: 1
    hints:
    - Use the complement rule.
    - Subtract from 1.
    solution: 'Step 1: 1 − 2/7. Step 2: 5/7.'
    mistakes:
      2/7: c11m14_rule
      7/2: c11m14_rule
  - prompt: A card is drawn from a pack of 52. Find P(a red queen).
    answer: 1/26
    check: 2/52
    difficulty: 1
    hints:
    - There are 4 queens.
    - Half of them are red.
    solution: 'Step 1: 2 red queens. Step 2: 2/52 = 1/26.'
    mistakes:
      1/13: c11m14_count
      1/52: c11m14_count
  - prompt: Which of these can NOT be a probability?
    options:
    - '1.2'
    - '0'
    - '0.99'
    answer: '1.2'
    difficulty: 1
    hints:
    - Probabilities have a lower and an upper limit.
    - What is the largest possible value?
    solution: 'Step 1: 0 ≤ P ≤ 1. Step 2: 1.2 is too big.'
    mistakes:
      '0': c11m14_rule
      '0.99': c11m14_rule
  - prompt: Two dice are rolled. Find P(sum = 10).
    answer: 1/12
    check: 3/36
    difficulty: 2
    hints:
    - Count the pairs that add to 10.
    - There are 36 outcomes in all.
    solution: 'Step 1: (4,6), (5,5), (6,4) = 3. Step 2: 3/36 = 1/12.'
    mistakes:
      1/18: c11m14_count
      1/6: c11m14_count
  - prompt: P(A) = 0.6, P(B) = 0.3, P(A ∩ B) = 0.1. Find P(A ∪ B).
    answer: 4/5
    check: 0.6+0.3-0.1
    difficulty: 2
    hints:
    - Use the addition rule.
    - Subtract the overlap once.
    solution: 'Step 1: 0.6 + 0.3 − 0.1. Step 2: 0.8 = 4/5.'
    mistakes:
      9/10: c11m14_rule
      '1': c11m14_rule
  - prompt: Four coins are tossed. Find P(at least one head).
    answer: 15/16
    check: 1-1/16
    difficulty: 2
    hints:
    - Find P(no head) first.
    - Then use the complement.
    solution: 'Step 1: P(TTTT) = 1/16. Step 2: 1 − 1/16 = 15/16.'
    mistakes:
      1/16: c11m14_rule
      1/2: c11m14_rule
  - prompt: 'A card is drawn from 52. Find P(a face card or a spade). (Face cards: J, Q, K.)'
    answer: 11/26
    check: (12+13-3)/52
    difficulty: 3
    hints:
    - 12 face cards, 13 spades.
    - Some cards are both.
    solution: 'Step 1: 12 + 13 − 3 = 22. Step 2: 22/52 = 11/26.'
    mistakes:
      25/52: c11m14_rule
      3/52: c11m14_rule
  - prompt: A bag has 4 red, 5 blue and 6 green balls. One is drawn. Find P(not blue).
    answer: 2/3
    check: 10/15
    difficulty: 3
    hints:
    - Total balls = 15.
    - Not blue means red or green.
    solution: 'Step 1: 4 + 6 = 10 not blue. Step 2: 10/15 = 2/3.'
    mistakes:
      1/3: c11m14_rule
      3/5: c11m14_rule
