# CBSE Class 11 Mathematics (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse11-math
chapter: 6
title: Permutations and Combinations
tips:
  c11_perm_comb: Order matters → permutation (nPr). Order doesn't matter (choosing a group) → combination (nCr).
  c11_fact: n! = n × (n − 1) × ... × 1, and 0! = 1.
  m11_choose_both: "Choose boys and girls separately, then multiply the two counts."
  m11_diagonals: "Joining any 2 of the 6 vertices gives a segment. Some of those segments are sides, not diagonals."
  m11_factorial: "First chair: 6 choices, next: 5, and so on down to 1. Multiply them all."
  m11_handshake: "A handshake is a pair of people; A–B is the same as B–A. Choose 2 from 10."
  m11_ncr: "ⁿCᵣ = ⁿPᵣ ÷ r!. Order does not matter, so divide the arrangements by 2!."
  m11_ncr_equal: "ⁿCₓ = ⁿCᵧ with x ≠ y means x + y = n."
  m11_no_repeat: "Fill the three places one by one. After using a digit, one fewer is left for the next place."
  m11_npr: "ⁿPᵣ = n(n − 1)… for r factors. Multiply 3 numbers counting down from 7."
  m11_repeated_letters: "6! counts swaps of identical letters as different. Divide by the factorial of each repeated letter's count."
  m11_with_repeat: "With repetition, every place has all 10 digits available. Multiply 10 for each place."
  c11m6_order: 'Ask first: does the order matter? Arrangements use nPr; selections use nCr.'
  c11m6_slots: Draw one box per position and write how many choices go in each box, then multiply.
  c11m6_fact: Expand the factorials and cancel before multiplying.
  c11m6_repeat: Divide by the factorial of each group of identical items.
concepts:
- code: cbse11m.pc.perm
  title: Counting principle and permutations
  notes: |
    Fundamental principle of counting: if one event can happen in m ways and another in n ways, both happen in m × n
    ways. n! = n(n − 1)...1, 0! = 1. Permutations (arrangements, order matters) of n different things taken r at a time:
    nPr = n!/(n − r)!. All n things: n!. With repeats allowed: nʳ. With identical objects: n!/(p! q! ...)
    (e.g. letters of MISSISSIPPI: 11!/(4! 4! 2!)).
  explanations:
    text: 'If you can choose a shirt in 3 ways and trousers in 4 ways, there are 3 × 4 = 12 outfits. Arranging things in order is a permutation: 5 people can stand in a line in 5! = 120 ways. If some items are identical, divide by the arrangements of the repeats.'
    visual: 'Draw r blanks in a row. Write how many choices fit in each: 5, then 4, then 3 for arranging 3 of 5 people. Multiply: 60.'
    step_by_step: 'Step 1: Decide if order matters (yes for permutations). Step 2: Count choices for each position. Step 3: Multiply. Step 4: Divide by factorials of repeated items if any.'
    real_world: A 4-digit PIN with digits 0–9 repeating allowed has 10⁴ = 10,000 possibilities.
  picture:
    kind: flow
    steps:
    - 'Choose 1st place: 5 ways'
    - '2nd place: 4 ways'
    - '3rd place: 3 ways'
    - 'Multiply: 5 × 4 × 3 = 60'
    alt: 'Arranging 3 of 5 people: 5 choices, then 4, then 3, so 60 arrangements.'
  activity:
    type: formula
    prompt: 'Arrange r things chosen from n different things. Order matters: nPr = n × (n − 1) × … (r numbers).'
    inputs:
    - name: n
      label: n, things to choose from
      min: 1
      max: 10
      step: 1
      start: 1
    - name: r
      label: r, places to fill
      min: 1
      max: 4
      step: 1
      start: 1
    outputs:
    - name: perm
      label: nPr, no repeats
      expr: (1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4))
    - name: rep
      label: With repeats allowed, nʳ
      expr: n^r
    goals:
    - prompt: A 4-digit PIN uses the digits 0 to 9 with no digit repeated. Set n and r.
      want:
        n: 10
        r: 4
      mistakes:
      - when:
          n: 9
          r: 4
        say: '0 is a digit too: 0 to 9 makes 10 choices.'
      - when:
          n: 4
        say: n is how many digits you can choose from. The 4 is the number of places, r.
    - prompt: Find n so that nP2 = 56.
      want:
        r: 2
        perm: 56
      mistakes:
      - when:
          r: 2
          n: 7
        say: 7P2 = 7 × 6 = 42. You need two whole numbers in a row that multiply to 56.
      - when:
          r: 2
          n:
          - 9
          - 10
        say: 'Too many: nP2 is n × (n − 1), and that''s past 56.'
    - prompt: '3-letter ''words'' with no repeated letter: make exactly 120 of them.'
      want:
        r: 3
        perm: 120
      mistakes:
      - when:
          r: 3
          rep: 125
        say: '125 = 5³ lets letters repeat, like AAB. Without repeats each place has one fewer choice: 5 × 4 × 3 = 60.'
      - when:
          r: 3
          n:
          - 7
          - 10
        say: 'Too many letters: nP3 = n(n − 1)(n − 2) is past 120.'
  lesson:
    - teach: 'Fundamental principle of counting: if one job can be done in m ways and the next in n ways, together they can be done in m × n ways. Draw a box for each step and multiply.'
      picture:
        kind: flow
        steps:
        - 'shirt: 3 ways'
        - 'trousers: 4 ways'
        - 3 × 4 = 12 outfits
        alt: Counting outfits by multiplying choices.
      check:
        prompt: 3 routes from A to B and 2 from B to C. How many routes from A to C via B?
        options:
        - '6'
        - '5'
        - '9'
        answer: '6'
        why: 3 × 2 = 6.
      ways:
      - style: step_by_step
        teach: 'Step 1: Break the task into jobs done one after another. Step 2: Count the ways for each job. Step 3: Multiply. Example: 3 shirts and 4 trousers: 3 × 4 = 12 outfits. Step 4: Use ''or'' (add) only when you do one job OR the other.'
      - style: real_world
        teach: 'A bike lock has 3 wheels, each showing 0–9. The first wheel has 10 settings, and for each of those the second has 10, and the third 10 again: 10 × 10 × 10 = 1000 codes. That is why a 3-wheel lock can be tried out in an afternoon.'
    - teach: 'n! (n factorial) = n × (n − 1) × ... × 1, with 0! = 1. Arranging n different things in a row: n! ways. Arranging r of n different things: nPr = n!/(n − r)!.'
      check:
        prompt: Find ⁵P₂.
        options:
        - '20'
        - '10'
        - '25'
        answer: '20'
        why: 5!/3! = 5 × 4 = 20.
      ways:
      - style: visual
        teach: 'Arranging 3 of 7 books on a shelf: fill the slots left to right.'
        picture:
          kind: flow
          steps:
          - 'Slot 1: 7 choices'
          - 'Slot 2: 6 left'
          - 'Slot 3: 5 left'
          - 7 × 6 × 5 = 210 = ⁷P₃
          alt: 'Three slots: 7 choices for the first, 6 for the second, 5 for the third, giving 210, which is 7 P 3.'
      - style: real_world
        teach: 'Choosing a class captain, vice-captain and secretary from 7 students: the first post has 7 options, the second 6, the third 5. Order matters because a captain is not a secretary, so this is ⁷P₃ = 210.'
    - teach: 'If repetition is allowed, each of r places has n choices: nʳ. If some objects are identical, divide by the factorial of each repeat: letters of LEVEL give 5!/(2! 2!) = 30.'
      check:
        prompt: How many arrangements of the letters of NOON?
        options:
        - '6'
        - '24'
        - '12'
        answer: '6'
        why: 4!/(2! 2!) = 24/4 = 6.
      ways:
      - style: visual
        teach: 'LEVEL: 5 letters with L twice and E twice.'
        picture:
          kind: flow
          steps:
          - 'All different: 5! = 120'
          - 'Swap the two L''s: same word, ÷ 2!'
          - 'Swap the two E''s: same word, ÷ 2!'
          - 120 ÷ 4 = 30 words
          alt: If all letters were different there would be 120 arrangements; swapping the two L's or the two E's gives the same word, so divide by 2 factorial twice to get 30.
      - style: step_by_step
        teach: 'Step 1: Is repetition allowed? If yes, each place has n choices: nʳ. Step 2: If not, use nPr. Step 3: Are some objects identical? Divide n! by p! q! … for each repeated group.'
  items:
  - prompt: Find 5!.
    answer: '120'
    check: factorial(5)
    difficulty: 1
    hints:
    - 5 × 4 × 3 × 2 × 1.
    - Multiply.
    solution: 5! = 120.
    mistakes:
      '25': c11_fact
  - prompt: Find ⁷P₃.
    answer: '210'
    check: factorial(7)/factorial(4)
    difficulty: 1
    hints:
    - 7!/4!.
    - 7 × 6 × 5.
    solution: 7 × 6 × 5 = 210.
    mistakes: {"35": "m11_npr", "343": "m11_npr", "21": "m11_npr"}
  - prompt: How many 3-digit numbers can be made from 1, 2, 3, 4, 5 without repeating digits?
    answer: '60'
    check: 5*4*3
    difficulty: 1
    hints:
    - 5 × 4 × 3.
    - Order matters.
    solution: 5 × 4 × 3 = 60.
    mistakes: {"125": "m11_no_repeat", "10": "m11_no_repeat"}
  - prompt: How many 4-digit PINs are possible using digits 0–9 with repetition?
    answer: '10000'
    check: 10**4
    difficulty: 1
    hints:
    - 10 choices each.
    - 10⁴.
    solution: 10⁴ = 10,000.
    mistakes: {"5040": "m11_with_repeat", "40": "m11_with_repeat"}
  - prompt: How many different arrangements of the letters of the word BANANA are there?
    answer: '60'
    check: factorial(6)/(factorial(3)*factorial(2))
    difficulty: 2
    hints:
    - '6 letters: A×3, N×2.'
    - 6!/(3! 2!).
    solution: 720/(6 × 2) = 60.
    mistakes: {"720": "m11_repeated_letters", "120": "m11_repeated_letters"}
  - prompt: In how many ways can 6 people sit in a row of 6 chairs?
    answer: '720'
    check: factorial(6)
    difficulty: 1
    hints:
    - 6!.
    - All arranged.
    solution: 6! = 720.
    mistakes: {"36": "m11_factorial", "6": "m11_factorial"}
  - prompt: Find 6!/4!.
    answer: '30'
    check: 6*5
    difficulty: 1
    hints:
    - Write 6! = 6 × 5 × 4!.
    - Cancel 4!.
    solution: 'Step 1: 6 × 5 × 4!/4!. Step 2: 30.'
    mistakes:
      '2': c11m6_fact
      '720': c11m6_fact
  - prompt: In how many ways can 4 books be arranged on a shelf?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - All the books are different.
    - 4 choices for the first place, then fewer.
    solution: 'Step 1: 4 × 3 × 2 × 1. Step 2: 24.'
    mistakes:
      '16': c11m6_slots
      '4': c11m6_slots
  - prompt: How many 3-letter codes can be made from A–Z if letters may repeat?
    answer: '17576'
    check: 26**3
    difficulty: 2
    hints:
    - Each place has the same number of choices.
    - 26 choices, three times.
    solution: 'Step 1: 26 × 26 × 26. Step 2: 17576.'
    mistakes:
      '15600': c11m6_slots
      '78': c11m6_slots
  - prompt: How many arrangements of the letters of APPLE are there?
    answer: '60'
    check: 120//2
    difficulty: 2
    hints:
    - 5 letters, one letter repeats.
    - Divide by 2! for the two Ps.
    solution: 'Step 1: 5! = 120. Step 2: 120/2! = 60.'
    mistakes:
      '120': c11m6_repeat
      '30': c11m6_repeat
  - prompt: How many even 3-digit numbers can be formed from 1, 2, 3, 4, 5 without repetition?
    answer: '24'
    check: 2*4*3
    difficulty: 3
    hints:
    - 'Fill the units place first: it must be even.'
    - Then fill the other two places from what is left.
    solution: 'Step 1: units 2 ways (2 or 4). Step 2: 4 × 3 for the rest: 2 × 12 = 24.'
    mistakes:
      '60': c11m6_slots
      '30': c11m6_slots
  - prompt: Find ⁸P₂.
    answer: '56'
    check: 8*7
    difficulty: 1
    hints:
    - 8!/6!.
    - Two factors from 8 downwards.
    solution: 'Step 1: 8 × 7. Step 2: 56.'
    mistakes:
      '28': c11m6_order
      '16': c11m6_fact
  - prompt: In how many ways can 5 people stand in a line if two particular people must stand together?
    answer: '48'
    check: 24*2
    difficulty: 3
    hints:
    - Treat the pair as one block.
    - The pair can swap places inside the block.
    solution: 'Step 1: 4 units: 4! = 24. Step 2: × 2 for the pair: 48.'
    mistakes:
      '24': c11m6_slots
      '120': c11m6_slots
  - prompt: If ⁿP₂ = 30, find n.
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - ⁿP₂ = n(n − 1).
    - Which two consecutive numbers multiply to 30?
    solution: 'Step 1: n(n − 1) = 30. Step 2: n = 6.'
    mistakes:
      '5': c11m6_fact
      '15': c11m6_fact
  - prompt: How many arrangements of the letters of ARRANGE?
    answer: '1260'
    check: 5040//4
    difficulty: 3
    hints:
    - '7 letters: A twice, R twice.'
    - Divide 7! by 2! × 2!.
    solution: 'Step 1: 7! = 5040. Step 2: 5040/4 = 1260.'
    mistakes:
      '5040': c11m6_repeat
      '2520': c11m6_repeat
  - prompt: 'Assertion (A): The number of 3-digit numbers that can be made from 1, 2, 3, 4, 5 with repetition allowed is 125.

      Reason (R): With repetition, each of the 3 places can be filled in 5 ways.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true: 5 × 5 × 5 = 125, and R is the reason, so R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: In how many ways can the letters of the word APPLE be arranged?
    options:
    - '60'
    - '120'
    - '24'
    answer: '60'
    hints:
    - Which letter repeats?
    - Divide 5! by 2!.
    solution: 'APPLE has 5 letters with P twice: 5!/2! = 120/2 = 60.'
    mistakes:
      '120': m11_repeated_letters
      '24': c11m6_repeat
    exam: one_mark
    difficulty: 2
  - prompt: 'Situation: A café has a 4-digit PIN for its Wi-Fi, digits 0–9, no digit repeated. How many PINs are possible?'
    options:
    - '5040'
    - '10000'
    - '210'
    answer: '5040'
    hints:
    - 'First digit: 10 choices; then one fewer each time.'
    - 10 × 9 × 8 × 7.
    solution: 10 × 9 × 8 × 7 = 5040 = ¹⁰P₄.
    mistakes:
      '10000': m11_no_repeat
      '210': c11m6_order
    exam: competency
    difficulty: 2
- code: cbse11m.pc.comb
  title: Combinations
  after:
  - cbse11m.pc.perm
  notes: |
    Combinations (selections, order doesn't matter): nCr = n!/(r!(n − r)!) = nPr/r!. nCr = nC(n − r); nC0 = nCn = 1;
    nCr + nC(r − 1) = (n + 1)Cr. Applications: choosing committees, teams, handshakes (nC2), diagonals of an n-gon
    (nC2 − n), lines through points. Mixed problems: choose then arrange (multiply nCr by r!).
  explanations:
    text: 'When order doesn''t matter, like choosing a team, use combinations: nCr = n!/(r!(n − r)!). Choosing 3 from 5 gives 10 teams, fewer than the 60 ordered arrangements, because each team was counted 3! = 6 times.'
    visual: 'List teams of 2 from A, B, C, D: AB, AC, AD, BC, BD, CD. Six teams. AB and BA are the same team: that''s why we divide by 2!.'
    step_by_step: 'Step 1: Check order doesn''t matter. Step 2: Find n (total) and r (chosen). Step 3: Compute n!/(r!(n − r)!). Step 4: For ''at least'' problems, add cases.'
    real_world: If 10 people each shake hands once with everyone else, there are ¹⁰C₂ = 45 handshakes.
  picture:
    kind: compare
    columns:
    - title: Permutation
      points:
      - order matters
      - arranging
      - nPr = n!/(n − r)!
    - title: Combination
      points:
      - order doesn't matter
      - choosing
      - nCr = n!/(r!(n − r)!)
    alt: Permutations count arrangements where order matters; combinations count selections where it doesn't.
  activity:
    type: formula
    prompt: 'Choose r from n when order doesn''t matter: nCr = nPr ÷ r!. Each group of r appears r! times among the arrangements.'
    inputs:
    - name: n
      label: n, things to choose from
      min: 1
      max: 10
      step: 1
      start: 1
    - name: r
      label: r, how many to choose
      min: 1
      max: 4
      step: 1
      start: 1
    outputs:
    - name: perm
      label: nPr, ordered
      expr: (1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4))
    - name: comb
      label: nCr, unordered
      expr: ((1+min(1,max(0,r))*(n-1))*(1+min(1,max(0,r-1))*(n-2))*(1+min(1,max(0,r-2))*(n-3))*(1+min(1,max(0,r-3))*(n-4)))/((1+min(1,max(0,r))*(r-1))*(1+min(1,max(0,r-1))*(r-2))*(1+min(1,max(0,r-2))*(r-3))*(1+min(1,max(0,r-3))*(r-4)))
    goals:
    - prompt: A committee of 3 can be chosen from n people in 35 ways. Find n.
      want:
        r: 3
        comb: 35
      mistakes:
      - when:
          r: 3
          n:
          - 8
          - 10
        say: Too many people. A committee has no order, so divide nP3 by 3! = 6.
      - when:
          r: 3
          n:
          - 3
          - 6
        say: 'Too few: nC3 is still below 35.'
    - prompt: 'Everyone at a party shakes hands once with everyone else: 10 handshakes. How many people?'
      want:
        r: 2
        comb: 10
      mistakes:
      - when:
          r: 2
          n: 10
        say: 10 is the number of handshakes, not people. 10 people would make 10C2 = 45.
      - when:
          r: 2
          n: 4
        say: 4 people make only 4C2 = 6 handshakes.
    - prompt: With n = 6, find a different r that gives the same as 6C2 = 15.
      want:
        n: 6
        comb: 15
        r: 4
      mistakes:
      - when:
          n: 6
          r: 2
        say: That's 6C2 itself. Choosing 2 to take is the same as choosing the other 4 to leave behind.
      - when:
          n: 6
          r: 3
        say: 6C3 = 20, the biggest in the row. Look one step further along.
  lesson:
    - teach: A combination is a selection where order does not matter. nCr = n!/(r!(n − r)!) = nPr/r!. Choosing {A, B} is the same as choosing {B, A}.
      check:
        prompt: Find ⁶C₂.
        options:
        - '15'
        - '30'
        - '12'
        answer: '15'
        why: 6 × 5/2 = 15.
      ways:
      - style: visual
        teach: 'From A, B, C choose 2: as an arrangement or as a selection.'
        picture:
          kind: compare
          columns:
          - title: Arrangements ³P₂ = 6
            points:
            - AB, BA
            - AC, CA
            - BC, CB
          - title: Selections ³C₂ = 3
            points:
            - '{A, B}'
            - '{A, C}'
            - '{B, C}'
          alt: Arranging 2 of A, B, C gives 6 orders; selecting 2 gives only 3 groups, because AB and BA are the same group.
      - style: step_by_step
        teach: 'Step 1: Ask: does swapping two chosen items give something new? Step 2: Yes → permutation, nPr. Step 3: No → combination, nCr. Step 4: nCr = nPr ÷ r!, because each group can be ordered in r! ways.'
    - teach: 'Useful facts: nCr = nC(n − r), nC0 = nCn = 1, and nCr + nC(r − 1) = (n + 1)Cr. So ¹⁰C₈ = ¹⁰C₂ = 45.'
      check:
        prompt: Find ²⁰C₁₈.
        options:
        - '190'
        - '380'
        - '20'
        answer: '190'
        why: ²⁰C₁₈ = ²⁰C₂ = 20 × 19/2 = 190.
      ways:
      - style: visual
        teach: Choosing 8 to take is the same as choosing 2 to leave behind.
        picture:
          kind: compare
          columns:
          - title: Choose 8 of 10 to go
            points:
            - ¹⁰C₈
          - title: Choose 2 of 10 to stay
            points:
            - ¹⁰C₂ = 45
          alt: Picking 8 of 10 people to go on a trip is the same as picking the 2 who stay, so 10 C 8 equals 10 C 2, which is 45.
      - style: step_by_step
        teach: 'Step 1: If r is more than half of n, switch to nC(n − r). Step 2: Compute the smaller one: ¹⁰C₂ = (10 × 9)/(2 × 1) = 45. Step 3: Remember nC0 = nCn = 1: one way to pick nothing, one way to pick all.'
    - teach: 'Applications: handshakes among n people = nC2; diagonals of an n-gon = nC2 − n; choose a group then arrange it: nCr × r! = nPr.'
      picture:
        kind: compare
        columns:
        - title: Order matters
          points:
          - arranging
          - rankings
          - nPr
        - title: Order does not matter
          points:
          - choosing
          - committees
          - nCr
        alt: When to use permutations and when to use combinations.
      check:
        prompt: How many lines through 6 points, no three in a line?
        options:
        - '15'
        - '30'
        - '6'
        answer: '15'
        why: 'Each line is a choice of 2 points: ⁶C₂ = 15.'
      ways:
      - style: step_by_step
        teach: 'Step 1: Handshakes: each pair of people shakes once, nC2. Step 2: Diagonals: every pair of vertices joins, nC2, minus the n sides. Step 3: Committees with posts: choose nCr, then arrange the posts r!.'
      - style: real_world
        teach: In a league where every team plays every other team once, a match is a pair of teams. With 8 teams there are ⁸C₂ = 28 matches, exactly like 8 people shaking hands once each.
  items:
  - prompt: Find ⁵C₂.
    answer: '10'
    check: binomial(5,2)
    difficulty: 1
    hints:
    - 5!/(2! 3!).
    - (5 × 4)/2.
    solution: ⁵C₂ = 10.
    mistakes: {"20": "m11_ncr", "5": "m11_ncr"}
  - prompt: 10 people shake hands once with each other. How many handshakes?
    answer: '45'
    check: binomial(10,2)
    difficulty: 1
    hints:
    - Choose 2 of 10.
    - ¹⁰C₂.
    solution: ¹⁰C₂ = 45.
    mistakes: {"90": "m11_handshake", "100": "m11_handshake"}
  - prompt: A committee of 3 is chosen from 8 people. How many committees are possible?
    answer: '56'
    check: binomial(8,3)
    difficulty: 1
    hints:
    - ⁸C₃.
    - (8 × 7 × 6)/6.
    solution: ⁸C₃ = 56.
    mistakes:
      '336': c11_perm_comb
  - prompt: How many diagonals does a hexagon have?
    answer: '9'
    check: binomial(6,2) - 6
    difficulty: 2
    hints:
    - 'Lines joining 2 of 6 vertices: ⁶C₂.'
    - Subtract the 6 sides.
    solution: 15 − 6 = 9.
    mistakes: {"15": "m11_diagonals", "6": "m11_diagonals"}
  - prompt: If ⁿC₈ = ⁿC₂, find n.
    answer: '10'
    check: 8 + 2
