# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-chem
chapter: 3
title: Classification of Elements and Periodicity in Properties
tips:
  c11c_trend: 'Across a period: size falls, ionisation enthalpy and electronegativity rise. Down a group: the opposite.'
  c11c_block: "The block is set by the subshell that receives the last electron. Read the last subshell in the configuration."
  c11_d_block: "In groups 3–12, the electron fills a d subshell."
  c11_eg_cl: "F is so small that an extra electron is crowded and repelled. The next halogen down has more room."
  c11_eka: "'Eka' means 'one beyond'. The element just below aluminium in group 13 was found in 1875."
  c11_en: "Electronegativity rises across a period and falls down a group. Look top right, leaving out noble gases."
  c11_groups: "Count the columns of the long form of the table."
  c11_ie_half_filled: "N has a half-filled 2p subshell (2p³), which is extra stable. O must lose a paired electron."
  c11_isoelectronic: "Same number of electrons; more protons pull them in tighter. Which ion has the most protons?"
  c11_period: "The period is the highest shell number used in the configuration."
  c11_periodic_law: "Moseley showed properties repeat with nuclear charge, not mass."
  c11c03_place: Period = the highest shell number in the configuration. The last subshell filled gives the block.
  c11c03_trend: Across a period the nuclear pull grows (smaller atoms, harder to ionise). Down a group new shells are added (bigger atoms, easier to ionise).
concepts:
- code: cbse11c.periodic.table
  title: The modern periodic table
  notes: |
    Early attempts: Döbereiner's triads, Newlands' octaves, Mendeleev's table (atomic mass, gaps for undiscovered elements
    like eka-aluminium = gallium). Moseley: atomic number is the basis. Modern periodic law: properties are periodic
    functions of atomic number. Long form: 18 groups, 7 periods. Period number = outermost shell n. Blocks: s (groups 1–2),
    p (13–18), d (3–12, transition), f (lanthanoids, actinoids). Metals, non-metals, metalloids. IUPAC names for Z > 100
    (e.g. 101: unnilunium, Unu).
  explanations:
    text: The periodic table arranges elements by atomic number, so elements with similar outer electrons fall in the same column. Mendeleev even left gaps for elements nobody had found yet, and predicted their properties.
    visual: 'Picture the table as four blocks: two tall columns on the left (s), a block of six on the right (p), a middle stretch of ten (d), and two rows underneath (f).'
    step_by_step: 'Step 1: Write the electronic configuration. Step 2: Period = highest shell number. Step 3: Block = subshell of the last electron. Step 4: Group from the outer electrons.'
    real_world: Mendeleev's predicted 'eka-aluminium' was found as gallium, which melts in your hand.
  picture:
    kind: compare
    columns:
    - title: Block
      points:
      - s
      - p
      - d
      - f
    - title: Groups
      points:
      - 1–2
      - 13–18
      - 3–12
      - lanthanoids/actinoids
    alt: The four blocks of the periodic table and where they sit.
  activity:
    type: sort
    prompt: Which block is each element in? The block is the subshell its last electron goes into.
    bins:
    - s-block
    - p-block
    - d-block
    - f-block
    items:
    - label: Sodium, Na
      bin: s-block
      clue: Na is 1s² 2s² 2p⁶ 3s¹. Where did the last electron go?
      why: The last electron enters 3s, so Na is in the s-block (group 1).
    - label: Calcium, Ca
      bin: s-block
      clue: Ca ends …4s². Which subshell fills last?
      why: 4s fills last, so Ca is an s-block element (group 2).
    - label: Helium, He
      bin: s-block
      clue: He is 1s². Is there any p electron?
      why: Its electrons are all 1s, so He belongs to the s-block, though it is placed with the noble gases.
    - label: Aluminium, Al
      bin: p-block
      clue: Al is …3s² 3p¹. Where is the last electron?
      why: 'The last electron enters 3p: p-block, group 13.'
    - label: Chlorine, Cl
      bin: p-block
      clue: Cl is …3s² 3p⁵. Which subshell fills last?
      why: 'The last electron is in 3p: p-block, group 17.'
    - label: Neon, Ne
      bin: p-block
      clue: Ne is 1s² 2s² 2p⁶. Which subshell was filled last?
      why: 2p fills last, so Ne is in the p-block.
    - label: Iron, Fe
      bin: d-block
      clue: Fe is [Ar] 3d⁶ 4s². Which subshell is being filled across this row?
      why: Across the transition metals the 3d subshell fills, so Fe is d-block.
    - label: Copper, Cu
      bin: d-block
      clue: Cu is [Ar] 3d¹⁰ 4s¹. Which inner subshell is it completing?
      why: 'Cu completes the 3d subshell: d-block.'
    - label: Zinc, Zn
      bin: d-block
      clue: Zn is [Ar] 3d¹⁰ 4s². Is it in the middle of the table?
      why: Zn sits in group 12 at the end of the d-block, though it isn't a typical transition metal.
    - label: Cerium, Ce
      bin: f-block
      clue: Ce is a lanthanoid. Which deep subshell do the lanthanoids fill?
      why: The lanthanoids fill 4f, so Ce is f-block.
    - label: Uranium, U
      bin: f-block
      clue: U is an actinoid. Which subshell do actinoids fill?
      why: 'The actinoids fill 5f: f-block.'
  lesson:
    - teach: 'Mendeleev arranged elements by atomic mass and left gaps, predicting new elements (eka-aluminium became gallium). Moseley showed atomic number is the true basis. Modern law: properties repeat periodically with atomic number.'
      check:
        prompt: 'The modern periodic table is arranged by:'
        options:
        - atomic number
        - atomic mass
        - number of neutrons
        answer: atomic number
        why: Moseley's work.
    - teach: The long form has 18 groups and 7 periods. Period number = outermost shell number n. Elements in a group have similar outer configurations and similar chemistry.
      check:
        prompt: 'Element 1s² 2s² 2p⁶ 3s¹ is in period:'
        options:
        - '3'
        - '1'
        - '11'
        answer: '3'
        why: Outermost shell n = 3.
    - teach: 'Blocks come from the last subshell filled: s-block (groups 1–2), p-block (13–18), d-block (3–12, transition metals), f-block (lanthanoids and actinoids).'
      picture:
        kind: compare
        columns:
        - title: Block
          points:
          - s
          - p
          - d
          - f
        - title: Groups
          points:
          - 1–2
          - 13–18
          - 3–12
          - lanthanoids, actinoids
        alt: Blocks of the periodic table.
      check:
        prompt: Configuration ending in 3d⁶ 4s². Block?
        options:
        - d
        - s
        - p
        answer: d
        why: The d subshell is being filled.
  items:
  - prompt: How many groups are there in the modern periodic table?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Long form.
    - Count columns.
    solution: '18.'
    mistakes: {"8": "c11_groups", "7": "c11_groups", "16": "c11_groups"}
  - prompt: An element has configuration 1s² 2s² 2p⁶ 3s² 3p⁴. In which period is it?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Highest shell.
    - n = 3.
    solution: Period 3 (it's sulfur).
    mistakes: {"4": "c11_period", "6": "c11_period", "2": "c11_period"}
  - prompt: 'The modern periodic law is based on:'
    options:
    - atomic number
    - atomic mass
    - number of neutrons
    - density
    answer: atomic number
    difficulty: 1
    hints:
    - Moseley.
    - Z.
    solution: Properties repeat with atomic number.
    mistakes: {"atomic mass": "c11_periodic_law", "number of neutrons": "c11_periodic_law", "density": "c11_periodic_law"}
  - prompt: 'Elements of groups 3 to 12 are called:'
    options:
    - d-block (transition) elements
    - s-block elements
    - noble gases
    - halogens
    answer: d-block (transition) elements
    difficulty: 1
    hints:
    - Middle of the table.
    - d subshell filling.
    solution: Transition (d-block) elements.
    mistakes: {"s-block elements": "c11_d_block", "noble gases": "c11_d_block", "halogens": "c11_d_block"}
  - prompt: 'An element with configuration [Ar] 3d¹⁰ 4s² 4p⁵ is in the:'
    options:
    - p-block
    - s-block
    - d-block
    - f-block
    answer: p-block
    difficulty: 2
    hints:
    - Last electron in 4p.
    - Bromine.
    solution: The last electron enters p, so p-block.
    mistakes:
      d-block: c11c_block
  - prompt: 'Mendeleev''s eka-aluminium was later found as:'
    options:
    - gallium
    - germanium
    - scandium
    - aluminium
    answer: gallium
    difficulty: 2
    hints:
    - Below aluminium.
    - Melts at 30 °C.
    solution: Gallium.
    mistakes: {"germanium": "c11_eka", "scandium": "c11_eka", "aluminium": "c11_eka"}
  - prompt: How many periods are there in the modern periodic table?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Periods are rows.
    - Count shells up to the heaviest elements.
    solution: 'Step 1: rows 1 to 7. Step 2: 7.'
    mistakes:
      '18': c11c03_place
      '8': c11c03_place
  - prompt: Sodium (1s² 2s² 2p⁶ 3s¹) belongs to which block?
    options:
    - s-block
    - p-block
    - d-block
    answer: s-block
    difficulty: 1
    hints:
    - Look at the last subshell filled.
    - It is 3s.
    solution: 'Step 1: last electron in 3s. Step 2: s-block.'
    mistakes:
      p-block: c11c03_place
      d-block: c11c03_place
  - prompt: 'Group 18 elements are called:'
    options:
    - noble gases
    - halogens
    - alkali metals
    answer: noble gases
    difficulty: 1
    hints:
    - They have full outer shells.
    - They rarely react.
    solution: 'Step 1: group 18 has ns² np⁶. Step 2: noble gases.'
    mistakes:
      halogens: c11c03_place
      alkali metals: c11c03_place
  - prompt: 'An element has configuration 1s² 2s² 2p⁶ 3s² 3p⁵. Its group number is:'
    answer: '17'
    check: '17'
    difficulty: 2
    hints:
    - 'p-block: group = 10 + outer electrons.'
    - 'Outer electrons: 3s² 3p⁵ = 7.'
    solution: 'Step 1: 7 valence electrons in the p-block. Step 2: group 17.'
    mistakes:
      '7': c11c03_place
      '5': c11c03_place
  - prompt: What is the IUPAC symbol for element 105?
    options:
    - Unp
    - Unh
    - Uup
    answer: Unp
    difficulty: 2
    hints:
    - 'Digits: 0 nil, 1 un, 5 pent.'
    - 1-0-5.
    solution: 'Step 1: un-nil-pentium. Step 2: Unp.'
    mistakes:
      Unh: c11c03_place
      Uup: c11c03_place
  - prompt: 'Lanthanoids and actinoids are placed in the:'
    options:
    - f-block
    - d-block
    - s-block
    answer: f-block
    difficulty: 2
    hints:
    - They fill 4f and 5f.
    - Usually drawn below the main table.
    solution: 'Step 1: f subshells being filled. Step 2: f-block.'
    mistakes:
      d-block: c11c03_place
      s-block: c11c03_place
  - prompt: Which pair of elements shows a diagonal relationship?
    options:
    - Li and Mg
    - Li and Na
    - Be and Ca
    answer: Li and Mg
    difficulty: 2
    hints:
    - Diagonal means one period down and one group right.
    - Start from period 2, group 1.
    solution: 'Step 1: Li (period 2, group 1) and Mg (period 3, group 2). Step 2: Li and Mg.'
    mistakes:
      Li and Na: c11c03_place
      Be and Ca: c11c03_place
  - prompt: An element with Z = 20 is in which period and group?
    options:
    - period 4, group 2
    - period 3, group 2
    - period 4, group 20
    answer: period 4, group 2
    difficulty: 3
    hints:
    - 'Write the configuration: [Ar] 4s².'
    - Outer shell n and the s electrons.
    solution: 'Step 1: [Ar] 4s². Step 2: period 4, group 2.'
    mistakes:
      period 3, group 2: c11c03_place
      period 4, group 20: c11c03_place
  - prompt: Why did Mendeleev place iodine after tellurium even though tellurium is heavier?
    options:
    - iodine's properties match the halogens
    - iodine is more common
    - tellurium is a metal
    answer: iodine's properties match the halogens
    difficulty: 3
    hints:
    - Mendeleev trusted similar properties over exact masses.
    - Which group's chemistry fits iodine?
    solution: 'Step 1: iodine behaves like Cl and Br. Step 2: properties won over mass.'
    mistakes:
      iodine is more common: c11c03_place
      tellurium is a metal: c11c03_place
- code: cbse11c.periodic.trends
  title: Periodic trends
  after:
  - cbse11c.periodic.table
  notes: |
    Atomic radius: decreases across a period (greater nuclear charge, same shell), increases down a group (new shells).
    Ionic radius: cations smaller, anions larger than their atoms; isoelectronic species: more protons → smaller. Ionisation
    enthalpy: increases across, decreases down; exceptions (N > O, Be > B) from stable configurations. Electron gain
    enthalpy: more negative across (halogens most negative; Cl more negative than F); noble gases positive. Electronegativity
    (Pauling): F highest (4.0); rises across, falls down. Valence and metallic character trends; diagonal relationship.
  explanations:
    text: Moving across a row, atoms get smaller and hold their electrons more tightly. Moving down a column, atoms grow bigger and lose electrons more easily. That's why metals are on the left and reactive non-metals like fluorine on the top right.
    visual: Draw an arrow across the table to the right labelled 'smaller, holds electrons tighter', and an arrow downward labelled 'bigger, loses electrons easily'.
    step_by_step: 'Step 1: Locate both elements. Step 2: Same period: further right is smaller, higher ionisation enthalpy. Step 3: Same group: lower down is bigger, lower ionisation enthalpy. Step 4: Check for exceptions (N/O, Be/B).'
    real_world: Caesium is so reactive that it explodes in water, because its outer electron is far from the nucleus and easily lost.
  picture:
    kind: bars
    bars:
    - label: Li
      value: 520
    - label: Be
      value: 899
    - label: B
      value: 801
    - label: C
      value: 1086
    - label: N
      value: 1402
    - label: O
      value: 1314
    - label: F
      value: 1681
    - label: Ne
      value: 2081
    alt: First ionisation enthalpy across period 2 rises overall, with dips at boron and oxygen.
    unit: kJ/mol
  activity:
    type: order
    prompt: Put these Period 3 elements in order of first ionisation enthalpy, lowest first.
    steps:
    - Sodium, Na (496 kJ/mol)
    - Aluminium, Al (577)
    - Magnesium, Mg (738)
    - Silicon, Si (786)
    - Sulfur, S (1000)
    - Phosphorus, P (1012)
    - Chlorine, Cl (1251)
    - Argon, Ar (1521)
    reasons:
      Aluminium, Al (577): Al has more protons than Na, so it holds its electrons more tightly than Na, whose single 3s electron is easy to remove.
      Magnesium, Mg (738): 'Mg comes before Al in the period but needs more energy: its electron comes from a full 3s², while Al''s 3p electron is higher in energy and easier to remove.'
      Silicon, Si (786): Si has 14 protons pulling on its 3p electrons; that extra nuclear charge lifts it above Mg.
      Sulfur, S (1000): S has still more nuclear charge than Si, so its electrons are held more tightly.
      Phosphorus, P (1012): 'P comes before S but needs more energy: its half-filled 3p³ is extra stable, while S loses a paired 3p electron that is pushed out by its partner.'
      Chlorine, Cl (1251): Cl has more protons and a smaller atom than P, so it holds its electrons even more tightly.
      Argon, Ar (1521): Ar's full octet is the hardest of all to break into.
  lesson:
    - teach: Atomic radius decreases across a period (more protons pull the same shell in) and increases down a group (new shells are added).
      check:
        prompt: 'Larger atom: Na or Cl?'
        options:
        - Na
        - Cl
        - same
        answer: Na
        why: Same period; Na is on the left.
    - teach: 'Ionisation enthalpy (energy to remove an electron) rises across a period and falls down a group. Exceptions: N > O and Be > B, because half-filled and filled subshells are stable.'
      check:
        prompt: 'Higher first ionisation enthalpy: Na or Mg?'
        options:
        - Mg
        - Na
        - same
        answer: Mg
        why: Mg is to the right in the same period.
    - teach: Electronegativity (pull on shared electrons) rises across and falls down; fluorine is highest. Electron gain enthalpy is most negative for halogens, with Cl more negative than F (F is small and crowded). For isoelectronic ions, more protons means smaller size.
      picture:
        kind: compare
        columns:
        - title: Property
          points:
          - atomic radius
          - ionisation enthalpy
          - electronegativity
        - title: Across a period → / down a group ↓
          points:
          - decreases / increases
          - increases / decreases
          - increases / decreases
        alt: Main periodic trends.
      check:
        prompt: 'Smaller ion: O²⁻ or F⁻ (both 10 electrons)?'
        options:
        - F⁻
        - O²⁻
        - same
        answer: F⁻
        why: F has 9 protons, O has 8.
  items:
  - prompt: Which has the largest atomic radius?
    options:
    - Cs
    - Li
    - Na
    - K
    answer: Cs
    difficulty: 1
    hints:
    - Down group 1.
    - More shells.
    solution: Caesium.
    mistakes:
      Li: c11c_trend
  - prompt: Which element has the highest electronegativity?
    options:
    - fluorine
    - oxygen
    - chlorine
    - nitrogen
    answer: fluorine
    difficulty: 1
    hints:
    - Top right.
    - Pauling 4.0.
    solution: Fluorine.
    mistakes: {"oxygen": "c11_en", "chlorine": "c11_en", "nitrogen": "c11_en"}
  - prompt: Which has the higher first ionisation enthalpy?
    options:
    - N
    - O
    - B
    answer: N
    difficulty: 2
    hints:
    - N has half-filled 2p.
    - Extra stability.
    solution: Nitrogen, because its half-filled 2p is stable.
    mistakes: {"O": "c11_ie_half_filled", "B": "c11_ie_half_filled"}
  - prompt: 'Among the isoelectronic ions Na⁺, Mg²⁺ and Al³⁺, the smallest is:'
    options:
    - Al³⁺
    - Na⁺
    - Mg²⁺
    - all equal
    answer: Al³⁺
    difficulty: 2
    hints:
    - Same electrons, more protons.
    - Z = 13.
    solution: Al³⁺ has the most protons pulling 10 electrons.
    mistakes: {"Na⁺": "c11_isoelectronic", "Mg²⁺": "c11_isoelectronic", "all equal": "c11_isoelectronic"}
  - prompt: 'Across a period from left to right, atomic radius generally:'
    options:
    - decreases
    - increases
    - stays the same
    - doubles
    answer: decreases
    difficulty: 1
    hints:
    - More protons, same shell.
    - Pulled inward.
    solution: It decreases.
    mistakes:
      increases: c11c_trend
  - prompt: Which has the most negative electron gain enthalpy?
    options:
    - Cl
    - F
    - O
    - Ne
    answer: Cl
    difficulty: 2
    hints:
    - F is small and crowded.
    - Exception.
    solution: Chlorine (fluorine's small size causes repulsion).
    mistakes: {"F": "c11_eg_cl", "O": "c11_eg_cl", "Ne": "c11_eg_cl"}
  - prompt: Which has the smallest atomic radius?
    options:
    - F
    - Li
    - C
    answer: F
    difficulty: 1
    hints:
    - All three are in period 2.
    - Radius shrinks to the right.
    solution: 'Step 1: same period. Step 2: F is furthest right.'
    mistakes:
      Li: c11c03_trend
      C: c11c03_trend
  - prompt: 'Down group 1, ionisation enthalpy:'
    options:
    - decreases
    - increases
    - stays the same
    answer: decreases
    difficulty: 1
    hints:
    - The outer electron is further from the nucleus.
    - Easier to remove.
    solution: 'Step 1: bigger atoms down the group. Step 2: decreases.'
    mistakes:
      increases: c11c03_trend
      stays the same: c11c03_trend
  - prompt: 'Compared with a sodium atom, the Na⁺ ion is:'
    options:
    - smaller
    - larger
    - the same size
    answer: smaller
    difficulty: 1
    hints:
    - Na⁺ has lost its 3s electron.
    - One fewer shell.
    solution: 'Step 1: outer shell removed. Step 2: smaller.'
    mistakes:
      larger: c11c03_trend
      the same size: c11c03_trend
  - prompt: Which has a higher first ionisation enthalpy?
    options:
    - Be
    - B
    - same
    answer: Be
    difficulty: 2
    hints:
    - Compare 2s² with 2s² 2p¹.
    - A lone 2p electron is easier to remove.
    solution: 'Step 1: B''s 2p electron is less tightly held. Step 2: Be is higher.'
    mistakes:
      B: c11c03_trend
      same: c11c03_trend
  - prompt: Which has the most positive (least favourable) electron gain enthalpy?
    options:
    - Ne
    - Cl
    - O
    answer: Ne
    difficulty: 2
    hints:
    - An added electron would go into a new shell.
    - Which has a full outer shell?
    solution: 'Step 1: noble gases resist gaining electrons. Step 2: Ne.'
    mistakes:
      Cl: c11c03_trend
      O: c11c03_trend
  - prompt: 'Arrange by size, largest first: Mg²⁺, Na⁺, F⁻.'
    options:
    - F⁻ > Na⁺ > Mg²⁺
    - Mg²⁺ > Na⁺ > F⁻
    - Na⁺ > F⁻ > Mg²⁺
    answer: F⁻ > Na⁺ > Mg²⁺
    difficulty: 2
    hints:
    - All have 10 electrons.
    - More protons pull them in tighter.
    solution: 'Step 1: protons 9, 11, 12. Step 2: F⁻ biggest, Mg²⁺ smallest.'
    mistakes:
      Mg²⁺ > Na⁺ > F⁻: c11c03_trend
      Na⁺ > F⁻ > Mg²⁺: c11c03_trend
  - prompt: 'Metallic character across a period from left to right:'
    options:
    - decreases
    - increases
    - stays the same
    answer: decreases
    difficulty: 2
    hints:
    - Metals lose electrons easily.
    - Ionisation enthalpy rises to the right.
    solution: 'Step 1: harder to lose electrons. Step 2: less metallic.'
    mistakes:
      increases: c11c03_trend
      stays the same: c11c03_trend
  - prompt: Why is chlorine's electron gain enthalpy more negative than fluorine's?
    options:
    - fluorine is small, so the added electron is crowded by others
    - chlorine has more protons in its outer shell
    - fluorine is a metal
    answer: fluorine is small, so the added electron is crowded by others
    difficulty: 3
    hints:
    - Compare the sizes of the 2p and 3p shells.
    - Electrons repel each other.
    solution: 'Step 1: F''s compact 2p shell repels the new electron. Step 2: Cl releases more energy.'
    mistakes:
      chlorine has more protons in its outer shell: c11c03_trend
      fluorine is a metal: c11c03_trend
  - prompt: An element has successive ionisation enthalpies 738, 1451, 7733 kJ/mol. Which group is it most likely in?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Look for the big jump.
    - The jump comes after removing all outer electrons.
    solution: 'Step 1: jump after the 2nd electron. Step 2: 2 outer electrons: group 2.'
    mistakes:
      '3': c11c03_trend
      '1': c11c03_trend
