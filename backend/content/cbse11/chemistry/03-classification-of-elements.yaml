# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-chem
chapter: 3
title: Classification of Elements and Periodicity in Properties
tips:
  c11c_trend: 'Across a period: size falls, ionisation enthalpy and electronegativity rise. Down a group: the opposite.'
  c11c_block: "The block is set by the subshell that receives the last electron. Read the last subshell in the configuration."
  c11_d_block: "In groups 3–12, the electron fills a d subshell."
  c11_eg_cl: "F is so small that an extra electron is crowded and repelled. The next halogen down has more room."
  c11_eka: "'Eka' means 'one beyond'. The element just below aluminium in group 13 was found in 1875."
  c11_en: "Electronegativity rises across a period and falls down a group. Look top right, leaving out noble gases."
  c11_groups: "Count the columns of the long form of the table."
  c11_ie_half_filled: "N has a half-filled 2p subshell (2p³), which is extra stable. O must lose a paired electron."
  c11_isoelectronic: "Same number of electrons; more protons pull them in tighter. Which ion has the most protons?"
  c11_period: "The period is the highest shell number used in the configuration."
  c11_periodic_law: "Moseley showed properties repeat with nuclear charge, not mass."
concepts:
- code: cbse11c.periodic.table
  title: The modern periodic table
  notes: |
    Early attempts: Döbereiner's triads, Newlands' octaves, Mendeleev's table (atomic mass, gaps for undiscovered elements
    like eka-aluminium = gallium). Moseley: atomic number is the basis. Modern periodic law: properties are periodic
    functions of atomic number. Long form: 18 groups, 7 periods. Period number = outermost shell n. Blocks: s (groups 1–2),
    p (13–18), d (3–12, transition), f (lanthanoids, actinoids). Metals, non-metals, metalloids. IUPAC names for Z > 100
    (e.g. 101: unnilunium, Unu).
  explanations:
    text: The periodic table arranges elements by atomic number, so elements with similar outer electrons fall in the same column. Mendeleev even left gaps for elements nobody had found yet, and predicted their properties.
    visual: 'Picture the table as four blocks: two tall columns on the left (s), a block of six on the right (p), a middle stretch of ten (d), and two rows underneath (f).'
    step_by_step: 'Step 1: Write the electronic configuration. Step 2: Period = highest shell number. Step 3: Block = subshell of the last electron. Step 4: Group from the outer electrons.'
    real_world: Mendeleev's predicted 'eka-aluminium' was found as gallium, which melts in your hand.
  picture:
    kind: compare
    columns:
    - title: Block
      points:
      - s
      - p
      - d
      - f
    - title: Groups
      points:
      - 1–2
      - 13–18
      - 3–12
      - lanthanoids/actinoids
    alt: The four blocks of the periodic table and where they sit.
  activity:
    type: sort
    prompt: Which block is each element in? The block is the subshell its last electron goes into.
    bins:
    - s-block
    - p-block
    - d-block
    - f-block
    items:
    - label: Sodium, Na
      bin: s-block
      clue: Na is 1s² 2s² 2p⁶ 3s¹. Where did the last electron go?
      why: The last electron enters 3s, so Na is in the s-block (group 1).
    - label: Calcium, Ca
      bin: s-block
      clue: Ca ends …4s². Which subshell fills last?
      why: 4s fills last, so Ca is an s-block element (group 2).
    - label: Helium, He
      bin: s-block
      clue: He is 1s². Is there any p electron?
      why: Its electrons are all 1s, so He belongs to the s-block, though it is placed with the noble gases.
    - label: Aluminium, Al
      bin: p-block
      clue: Al is …3s² 3p¹. Where is the last electron?
      why: 'The last electron enters 3p: p-block, group 13.'
    - label: Chlorine, Cl
      bin: p-block
      clue: Cl is …3s² 3p⁵. Which subshell fills last?
      why: 'The last electron is in 3p: p-block, group 17.'
    - label: Neon, Ne
      bin: p-block
      clue: Ne is 1s² 2s² 2p⁶. Which subshell was filled last?
      why: 2p fills last, so Ne is in the p-block.
    - label: Iron, Fe
      bin: d-block
      clue: Fe is [Ar] 3d⁶ 4s². Which subshell is being filled across this row?
      why: Across the transition metals the 3d subshell fills, so Fe is d-block.
    - label: Copper, Cu
      bin: d-block
      clue: Cu is [Ar] 3d¹⁰ 4s¹. Which inner subshell is it completing?
      why: 'Cu completes the 3d subshell: d-block.'
    - label: Zinc, Zn
      bin: d-block
      clue: Zn is [Ar] 3d¹⁰ 4s². Is it in the middle of the table?
      why: Zn sits in group 12 at the end of the d-block, though it isn't a typical transition metal.
    - label: Cerium, Ce
      bin: f-block
      clue: Ce is a lanthanoid. Which deep subshell do the lanthanoids fill?
      why: The lanthanoids fill 4f, so Ce is f-block.
    - label: Uranium, U
      bin: f-block
      clue: U is an actinoid. Which subshell do actinoids fill?
      why: 'The actinoids fill 5f: f-block.'
  items:
  - prompt: How many groups are there in the modern periodic table?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Long form.
    - Count columns.
    solution: '18.'
    mistakes: {"8": "c11_groups", "7": "c11_groups", "16": "c11_groups"}
  - prompt: An element has configuration 1s² 2s² 2p⁶ 3s² 3p⁴. In which period is it?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Highest shell.
    - n = 3.
    solution: Period 3 (it's sulfur).
    mistakes: {"4": "c11_period", "6": "c11_period", "2": "c11_period"}
  - prompt: 'The modern periodic law is based on:'
    options:
    - atomic number
    - atomic mass
    - number of neutrons
    - density
    answer: atomic number
    difficulty: 1
    hints:
    - Moseley.
    - Z.
    solution: Properties repeat with atomic number.
    mistakes: {"atomic mass": "c11_periodic_law", "number of neutrons": "c11_periodic_law", "density": "c11_periodic_law"}
  - prompt: 'Elements of groups 3 to 12 are called:'
    options:
    - d-block (transition) elements
    - s-block elements
    - noble gases
    - halogens
    answer: d-block (transition) elements
    difficulty: 1
    hints:
    - Middle of the table.
    - d subshell filling.
    solution: Transition (d-block) elements.
    mistakes: {"s-block elements": "c11_d_block", "noble gases": "c11_d_block", "halogens": "c11_d_block"}
  - prompt: 'An element with configuration [Ar] 3d¹⁰ 4s² 4p⁵ is in the:'
    options:
    - p-block
    - s-block
    - d-block
    - f-block
    answer: p-block
    difficulty: 2
    hints:
    - Last electron in 4p.
    - Bromine.
    solution: The last electron enters p, so p-block.
    mistakes:
      d-block: c11c_block
  - prompt: 'Mendeleev''s eka-aluminium was later found as:'
    options:
    - gallium
    - germanium
    - scandium
    - aluminium
    answer: gallium
    difficulty: 2
    hints:
    - Below aluminium.
    - Melts at 30 °C.
    solution: Gallium.
    mistakes: {"germanium": "c11_eka", "scandium": "c11_eka", "aluminium": "c11_eka"}
- code: cbse11c.periodic.trends
  title: Periodic trends
  after:
  - cbse11c.periodic.table
  notes: |
    Atomic radius: decreases across a period (greater nuclear charge, same shell), increases down a group (new shells).
    Ionic radius: cations smaller, anions larger than their atoms; isoelectronic species: more protons → smaller. Ionisation
    enthalpy: increases across, decreases down; exceptions (N > O, Be > B) from stable configurations. Electron gain
    enthalpy: more negative across (halogens most negative; Cl more negative than F); noble gases positive. Electronegativity
    (Pauling): F highest (4.0); rises across, falls down. Valence and metallic character trends; diagonal relationship.
  explanations:
    text: Moving across a row, atoms get smaller and hold their electrons more tightly. Moving down a column, atoms grow bigger and lose electrons more easily. That's why metals are on the left and reactive non-metals like fluorine on the top right.
    visual: Draw an arrow across the table to the right labelled 'smaller, holds electrons tighter', and an arrow downward labelled 'bigger, loses electrons easily'.
    step_by_step: 'Step 1: Locate both elements. Step 2: Same period: further right is smaller, higher ionisation enthalpy. Step 3: Same group: lower down is bigger, lower ionisation enthalpy. Step 4: Check for exceptions (N/O, Be/B).'
    real_world: Caesium is so reactive that it explodes in water, because its outer electron is far from the nucleus and easily lost.
  picture:
    kind: bars
    bars:
    - label: Li
      value: 520
    - label: Be
      value: 899
    - label: B
      value: 801
    - label: C
      value: 1086
    - label: N
      value: 1402
    - label: O
      value: 1314
    - label: F
      value: 1681
    - label: Ne
      value: 2081
    alt: First ionisation enthalpy across period 2 rises overall, with dips at boron and oxygen.
    unit: kJ/mol
  activity:
    type: order
    prompt: Put these Period 3 elements in order of first ionisation enthalpy, lowest first.
    steps:
    - Sodium, Na (496 kJ/mol)
    - Aluminium, Al (577)
    - Magnesium, Mg (738)
    - Silicon, Si (786)
    - Sulfur, S (1000)
    - Phosphorus, P (1012)
    - Chlorine, Cl (1251)
    - Argon, Ar (1521)
    reasons:
      Aluminium, Al (577): Al has more protons than Na, so it holds its electrons more tightly than Na, whose single 3s electron is easy to remove.
      Magnesium, Mg (738): 'Mg comes before Al in the period but needs more energy: its electron comes from a full 3s², while Al''s 3p electron is higher in energy and easier to remove.'
      Silicon, Si (786): Si has 14 protons pulling on its 3p electrons; that extra nuclear charge lifts it above Mg.
      Sulfur, S (1000): S has still more nuclear charge than Si, so its electrons are held more tightly.
      Phosphorus, P (1012): 'P comes before S but needs more energy: its half-filled 3p³ is extra stable, while S loses a paired 3p electron that is pushed out by its partner.'
      Chlorine, Cl (1251): Cl has more protons and a smaller atom than P, so it holds its electrons even more tightly.
      Argon, Ar (1521): Ar's full octet is the hardest of all to break into.
  items:
  - prompt: Which has the largest atomic radius?
    options:
    - Cs
    - Li
    - Na
    - K
    answer: Cs
    difficulty: 1
    hints:
    - Down group 1.
    - More shells.
    solution: Caesium.
    mistakes:
      Li: c11c_trend
  - prompt: Which element has the highest electronegativity?
    options:
    - fluorine
    - oxygen
    - chlorine
    - nitrogen
    answer: fluorine
    difficulty: 1
    hints:
    - Top right.
    - Pauling 4.0.
    solution: Fluorine.
    mistakes: {"oxygen": "c11_en", "chlorine": "c11_en", "nitrogen": "c11_en"}
  - prompt: Which has the higher first ionisation enthalpy?
    options:
    - N
    - O
    - B
    answer: N
    difficulty: 2
    hints:
    - N has half-filled 2p.
    - Extra stability.
    solution: Nitrogen, because its half-filled 2p is stable.
    mistakes: {"O": "c11_ie_half_filled", "B": "c11_ie_half_filled"}
  - prompt: 'Among the isoelectronic ions Na⁺, Mg²⁺ and Al³⁺, the smallest is:'
    options:
    - Al³⁺
    - Na⁺
    - Mg²⁺
    - all equal
    answer: Al³⁺
    difficulty: 2
    hints:
    - Same electrons, more protons.
    - Z = 13.
    solution: Al³⁺ has the most protons pulling 10 electrons.
    mistakes: {"Na⁺": "c11_isoelectronic", "Mg²⁺": "c11_isoelectronic", "all equal": "c11_isoelectronic"}
  - prompt: 'Across a period from left to right, atomic radius generally:'
    options:
    - decreases
    - increases
    - stays the same
    - doubles
    answer: decreases
    difficulty: 1
    hints:
    - More protons, same shell.
    - Pulled inward.
    solution: It decreases.
    mistakes:
      increases: c11c_trend
  - prompt: Which has the most negative electron gain enthalpy?
    options:
    - Cl
    - F
    - O
    - Ne
    answer: Cl
    difficulty: 2
    hints:
    - F is small and crowded.
    - Exception.
    solution: Chlorine (fluorine's small size causes repulsion).
    mistakes: {"F": "c11_eg_cl", "O": "c11_eg_cl", "Ne": "c11_eg_cl"}
