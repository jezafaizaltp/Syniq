# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-chem
chapter: 3
title: Classification of Elements and Periodicity in Properties
tips:
  c11c_trend: 'Across a period: size falls, ionisation enthalpy and electronegativity rise. Down a group: the opposite.'
  c11c_block: 'The block is set by the subshell that receives the last electron: s, p, d or f.'
concepts:
- code: cbse11c.periodic.table
  title: The modern periodic table
  notes: |
    Early attempts: Döbereiner's triads, Newlands' octaves, Mendeleev's table (atomic mass, gaps for undiscovered elements
    like eka-aluminium = gallium). Moseley: atomic number is the basis. Modern periodic law: properties are periodic
    functions of atomic number. Long form: 18 groups, 7 periods. Period number = outermost shell n. Blocks: s (groups 1–2),
    p (13–18), d (3–12, transition), f (lanthanoids, actinoids). Metals, non-metals, metalloids. IUPAC names for Z > 100
    (e.g. 101: unnilunium, Unu).
  explanations:
    text: The periodic table arranges elements by atomic number, so elements with similar outer electrons fall in the same column. Mendeleev even left gaps for elements nobody had found yet, and predicted their properties.
    visual: 'Picture the table as four blocks: two tall columns on the left (s), a block of six on the right (p), a middle stretch of ten (d), and two rows underneath (f).'
    step_by_step: 'Step 1: Write the electronic configuration. Step 2: Period = highest shell number. Step 3: Block = subshell of the last electron. Step 4: Group from the outer electrons.'
    real_world: Mendeleev's predicted 'eka-aluminium' was found as gallium, which melts in your hand.
  picture:
    kind: compare
    columns:
    - title: Block
      points:
      - s
      - p
      - d
      - f
    - title: Groups
      points:
      - 1–2
      - 13–18
      - 3–12
      - lanthanoids/actinoids
    alt: The four blocks of the periodic table and where they sit.
  items:
  - prompt: How many groups are there in the modern periodic table?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Long form.
    - Count columns.
    solution: '18.'
  - prompt: An element has configuration 1s² 2s² 2p⁶ 3s² 3p⁴. In which period is it?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Highest shell.
    - n = 3.
    solution: Period 3 (it's sulfur).
  - prompt: 'The modern periodic law is based on:'
    options:
    - atomic number
    - atomic mass
    - number of neutrons
    - density
    answer: atomic number
    difficulty: 1
    hints:
    - Moseley.
    - Z.
    solution: Properties repeat with atomic number.
  - prompt: 'Elements of groups 3 to 12 are called:'
    options:
    - d-block (transition) elements
    - s-block elements
    - noble gases
    - halogens
    answer: d-block (transition) elements
    difficulty: 1
    hints:
    - Middle of the table.
    - d subshell filling.
    solution: Transition (d-block) elements.
  - prompt: 'An element with configuration [Ar] 3d¹⁰ 4s² 4p⁵ is in the:'
    options:
    - p-block
    - s-block
    - d-block
    - f-block
    answer: p-block
    difficulty: 2
    hints:
    - Last electron in 4p.
    - Bromine.
    solution: The last electron enters p, so p-block.
    mistakes:
      d-block: c11c_block
  - prompt: 'Mendeleev''s eka-aluminium was later found as:'
    options:
    - gallium
    - germanium
    - scandium
    - aluminium
    answer: gallium
    difficulty: 2
    hints:
    - Below aluminium.
    - Melts at 30 °C.
    solution: Gallium.
- code: cbse11c.periodic.trends
  title: Periodic trends
  after:
  - cbse11c.periodic.table
  notes: |
    Atomic radius: decreases across a period (greater nuclear charge, same shell), increases down a group (new shells).
    Ionic radius: cations smaller, anions larger than their atoms; isoelectronic species: more protons → smaller. Ionisation
    enthalpy: increases across, decreases down; exceptions (N > O, Be > B) from stable configurations. Electron gain
    enthalpy: more negative across (halogens most negative; Cl more negative than F); noble gases positive. Electronegativity
    (Pauling): F highest (4.0); rises across, falls down. Valence and metallic character trends; diagonal relationship.
  explanations:
    text: Moving across a row, atoms get smaller and hold their electrons more tightly. Moving down a column, atoms grow bigger and lose electrons more easily. That's why metals are on the left and reactive non-metals like fluorine on the top right.
    visual: Draw an arrow across the table to the right labelled 'smaller, holds electrons tighter', and an arrow downward labelled 'bigger, loses electrons easily'.
    step_by_step: 'Step 1: Locate both elements. Step 2: Same period: further right is smaller, higher ionisation enthalpy. Step 3: Same group: lower down is bigger, lower ionisation enthalpy. Step 4: Check for exceptions (N/O, Be/B).'
    real_world: Caesium is so reactive that it explodes in water, because its outer electron is far from the nucleus and easily lost.
  picture:
    kind: bars
    bars:
    - label: Li
      value: 520
    - label: Be
      value: 899
    - label: B
      value: 801
    - label: C
      value: 1086
    - label: N
      value: 1402
    - label: O
      value: 1314
    - label: F
      value: 1681
    - label: Ne
      value: 2081
    alt: First ionisation enthalpy across period 2 rises overall, with dips at boron and oxygen.
    unit: kJ/mol
  items:
  - prompt: Which has the largest atomic radius?
    options:
    - Cs
    - Li
    - Na
    - K
    answer: Cs
    difficulty: 1
    hints:
    - Down group 1.
    - More shells.
    solution: Caesium.
    mistakes:
      Li: c11c_trend
  - prompt: Which element has the highest electronegativity?
    options:
    - fluorine
    - oxygen
    - chlorine
    - nitrogen
    answer: fluorine
    difficulty: 1
    hints:
    - Top right.
    - Pauling 4.0.
    solution: Fluorine.
  - prompt: Which has the higher first ionisation enthalpy?
    options:
    - N
    - O
    - B
    answer: N
    difficulty: 2
    hints:
    - N has half-filled 2p.
    - Extra stability.
    solution: Nitrogen, because its half-filled 2p is stable.
  - prompt: 'Among the isoelectronic ions Na⁺, Mg²⁺ and Al³⁺, the smallest is:'
    options:
    - Al³⁺
    - Na⁺
    - Mg²⁺
    - all equal
    answer: Al³⁺
    difficulty: 2
    hints:
    - Same electrons, more protons.
    - Z = 13.
    solution: Al³⁺ has the most protons pulling 10 electrons.
  - prompt: 'Across a period from left to right, atomic radius generally:'
    options:
    - decreases
    - increases
    - stays the same
    - doubles
    answer: decreases
    difficulty: 1
    hints:
    - More protons, same shell.
    - Pulled inward.
    solution: It decreases.
    mistakes:
      increases: c11c_trend
  - prompt: Which has the most negative electron gain enthalpy?
    options:
    - Cl
    - F
    - O
    - Ne
    answer: Cl
    difficulty: 2
    hints:
    - F is small and crowded.
    - Exception.
    solution: Chlorine (fluorine's small size causes repulsion).
