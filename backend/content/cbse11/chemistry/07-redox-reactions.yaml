# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-chem
chapter: 7
title: Redox Reactions
tips:
  c11c_ox: Oxidation is loss of electrons (oxidation number goes up); reduction is gain (oxidation number goes down).
  c11c_onum: Oxidation numbers in a neutral compound add up to 0; in an ion, to the ion's charge. O is usually −2, H +1.
concepts:
- code: cbse11c.redox.onum
  title: Oxidation, reduction and oxidation numbers
  notes: |
    Classical view: oxidation = addition of oxygen/removal of hydrogen; reduction the reverse. Electronic view: oxidation =
    loss of electrons, reduction = gain (OIL RIG). Oxidising agent gets reduced; reducing agent gets oxidised. Oxidation
    number rules: elements 0; monatomic ion = charge; O −2 (peroxides −1, OF₂ +2); H +1 (metal hydrides −1); F −1; sum =
    charge. Types of redox reactions: combination, decomposition, displacement (metal and non-metal), disproportionation
    (same element both oxidised and reduced, e.g. 2H₂O₂ → 2H₂O + O₂).
  explanations:
    text: 'In a redox reaction one substance loses electrons (oxidation) and another gains them (reduction); they always go together. Oxidation numbers are a bookkeeping tool: if an atom''s number goes up it was oxidised, if it goes down it was reduced.'
    visual: 'Remember OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons). Draw an arrow of electrons from zinc to copper ions in Zn + Cu²⁺ → Zn²⁺ + Cu.'
    step_by_step: 'Step 1: Give O −2 and H +1. Step 2: Let the unknown be x. Step 3: Make the total equal the overall charge. Step 4: Compare numbers before and after.'
    real_world: 'Rusting is a slow redox reaction: iron loses electrons to oxygen. Painting or galvanising blocks it.'
  picture:
    kind: compare
    columns:
    - title: Change
      points:
      - oxidation
      - reduction
    - title: Electrons
      points:
      - lost
      - gained
    - title: Oxidation number
      points:
      - increases
      - decreases
    alt: Oxidation loses electrons and raises oxidation number; reduction gains electrons and lowers it.
  items:
  - prompt: Find the oxidation number of S in H₂SO₄.
    answer: '6'
    check: 0 - 2*1 - 4*(-2)
    difficulty: 1
    hints:
    - 2(+1) + x + 4(−2) = 0.
    - x = 6.
    solution: '+6.'
    mistakes:
      '-6': c11c_onum
  - prompt: Find the oxidation number of Mn in KMnO₄.
    answer: '7'
    check: 0 - 1 - 4*(-2)
    difficulty: 1
    hints:
    - +1 + x − 8 = 0.
    - x = 7.
    solution: '+7.'
  - prompt: Find the oxidation number of Cr in Cr₂O₇²⁻.
    answer: '6'
    check: (-2 - 7*(-2))/2
    difficulty: 2
    hints:
    - 2x − 14 = −2.
    - x = 6.
    solution: '+6.'
  - prompt: Find the oxidation number of O in H₂O₂.
    answer: '-1'
    check: (0-2)/2
    difficulty: 2
    hints:
    - Peroxide.
    - 2(+1) + 2x = 0.
    solution: −1.
  - prompt: In Zn + Cu²⁺ → Zn²⁺ + Cu, which species is oxidised?
    options:
    - Zn
    - Cu²⁺
    - Zn²⁺
    - Cu
    answer: Zn
    difficulty: 1
    hints:
    - Loses electrons.
    - 0 → +2.
    solution: Zinc is oxidised.
    mistakes:
      Cu²⁺: c11c_ox
  - prompt: '2H₂O₂ → 2H₂O + O₂ is an example of:'
    options:
    - disproportionation
    - combination
    - displacement
    - neutralisation
    answer: disproportionation
    difficulty: 2
    hints:
    - O goes from −1 to −2 and 0.
    - Same element both ways.
    solution: Disproportionation.
- code: cbse11c.redox.balance
  title: Balancing redox reactions and electrode processes
  after:
  - cbse11c.redox.onum
  notes: |
    Balancing: oxidation number method (equalise increase and decrease) and half-reaction (ion–electron) method: split
    into halves, balance atoms other than O and H, then O with H₂O, H with H⁺ (acid) or OH⁻ (base), charge with electrons,
    multiply to equal electrons, add. Redox titrations (KMnO₄ self-indicator; K₂Cr₂O₇). Electrode processes: Daniell cell
    Zn | Zn²⁺ || Cu²⁺ | Cu; oxidation at anode, reduction at cathode; standard electrode potential E° (SHE = 0); more
    negative E° = stronger reducing agent; electrochemical series.
  explanations:
    text: To balance a redox equation, make sure electrons lost equal electrons gained. The half-reaction method writes oxidation and reduction separately, balances each, then adds them. In a cell, oxidation happens at the anode and reduction at the cathode.
    visual: 'Draw the Daniell cell: a zinc rod in zinc sulfate, a copper rod in copper sulfate, a salt bridge between, and electrons flowing through the wire from zinc to copper.'
    step_by_step: 'Step 1: Write the two half-reactions. Step 2: Balance atoms, then O with H₂O and H with H⁺. Step 3: Balance charge with electrons. Step 4: Multiply so electrons match, and add.'
    real_world: Batteries in phones and torches are redox reactions arranged so the electrons flow through a circuit and do useful work.
  picture:
    kind: flow
    steps:
    - Split into half-reactions
    - Balance atoms, O and H
    - Balance charge with e⁻
    - Equalise electrons
    - Add and simplify
    alt: The half-reaction method for balancing a redox equation, step by step.
  items:
  - prompt: In MnO₄⁻ → Mn²⁺, how many electrons are gained per Mn?
    answer: '5'
    check: 7-2
    difficulty: 1
    hints:
    - +7 to +2.
    - Difference.
    solution: 5 electrons.
  - prompt: In Fe²⁺ → Fe³⁺, how many electrons are lost per iron ion?
    answer: '1'
    check: 3-2
    difficulty: 1
    hints:
    - +2 to +3.
    - One.
    solution: 1 electron.
  - prompt: How many Fe²⁺ ions does one MnO₄⁻ oxidise?
    answer: '5'
    check: 5/1
    difficulty: 2
    hints:
    - MnO₄⁻ gains 5 e⁻.
    - Each Fe²⁺ gives 1.
    solution: 5 Fe²⁺.
  - prompt: 'In the Daniell cell, oxidation occurs at the:'
    options:
    - zinc anode
    - copper cathode
    - salt bridge
    - copper anode
    answer: zinc anode
    difficulty: 1
    hints:
    - Anode = oxidation.
    - Zn → Zn²⁺.
    solution: At the zinc anode.
  - prompt: 'A metal with a more negative standard electrode potential is a:'
    options:
    - stronger reducing agent
    - stronger oxidising agent
    - noble metal
    - non-conductor
    answer: stronger reducing agent
    difficulty: 2
    hints:
    - Loses electrons easily.
    - Lithium.
    solution: Stronger reducing agent.
  - prompt: 'In balancing a half-reaction in acidic solution, oxygen atoms are balanced by adding:'
    options:
    - H₂O
    - H⁺
    - OH⁻
    - electrons
    answer: H₂O
    difficulty: 2
    hints:
    - Then H with H⁺.
    - Water carries O.
    solution: Add H₂O to balance oxygen.
