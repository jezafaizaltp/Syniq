# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-chem
chapter: 7
title: Redox Reactions
tips:
  c11c_ox: Oxidation is loss of electrons (oxidation number goes up); reduction is gain (oxidation number goes down).
  c11c_onum: Oxidation numbers in a neutral compound add up to 0; in an ion, to the ion's charge. O is usually −2, H +1.
  c11_anode: "'An Ox': oxidation at the anode. Which metal is more reactive and loses electrons?"
  c11_balance_acid: "In acid, balance O first with the molecule that contains O and is the solvent; then H with H⁺."
  c11_disproportionation: "Track O: from −1 in H₂O₂ to −2 in water and 0 in O₂. One element both oxidised and reduced."
  c11_electrode_potential: "A more negative E° means the metal gives up electrons more easily. Giving electrons = reducing others."
  c11_electron_match: "Electrons lost must equal electrons gained. One MnO₄⁻ gains how many? Each Fe²⁺ gives one."
  c11_electrons_gained: "Mn goes from +7 to +2. Electrons gained = change in oxidation number."
  c11_electrons_lost: "Fe goes from +2 to +3."
  c11_oxidation_number: "Sum of oxidation numbers = overall charge. K = +1, O = −2."
  c11_peroxide: "In a peroxide, the O–O bond means each O is less negative than in water."
  c11c07_on: Oxidation numbers in a formula add up to its overall charge. Use O = −2 and H = +1 unless it is a peroxide or a metal hydride.
  c11c07_redox: Oxidation is loss of electrons (oxidation number goes up); reduction is gain (it goes down). The oxidising agent is the one that is reduced.
  c11c07_bal: Match the electrons lost with the electrons gained, then balance O with H₂O and H with H⁺.
concepts:
- code: cbse11c.redox.onum
  title: Oxidation, reduction and oxidation numbers
  notes: |
    Classical view: oxidation = addition of oxygen/removal of hydrogen; reduction the reverse. Electronic view: oxidation =
    loss of electrons, reduction = gain (OIL RIG). Oxidising agent gets reduced; reducing agent gets oxidised. Oxidation
    number rules: elements 0; monatomic ion = charge; O −2 (peroxides −1, OF₂ +2); H +1 (metal hydrides −1); F −1; sum =
    charge. Types of redox reactions: combination, decomposition, displacement (metal and non-metal), disproportionation
    (same element both oxidised and reduced, e.g. 2H₂O₂ → 2H₂O + O₂).
  explanations:
    text: 'In a redox reaction one substance loses electrons (oxidation) and another gains them (reduction); they always go together. Oxidation numbers are a bookkeeping tool: if an atom''s number goes up it was oxidised, if it goes down it was reduced.'
    visual: 'Remember OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons). Draw an arrow of electrons from zinc to copper ions in Zn + Cu²⁺ → Zn²⁺ + Cu.'
    step_by_step: 'Step 1: Give O −2 and H +1. Step 2: Let the unknown be x. Step 3: Make the total equal the overall charge. Step 4: Compare numbers before and after.'
    real_world: 'Rusting is a slow redox reaction: iron loses electrons to oxygen. Painting or galvanising blocks it.'
  picture:
    kind: compare
    columns:
    - title: Change
      points:
      - oxidation
      - reduction
    - title: Electrons
      points:
      - lost
      - gained
    - title: Oxidation number
      points:
      - increases
      - decreases
    alt: Oxidation loses electrons and raises oxidation number; reduction gains electrons and lowers it.
  activity:
    type: formula
    prompt: 'Call the unknown oxidation number x. Add up every atom''s number: it must equal the overall charge. (O is −2, K and H are +1.)'
    inputs:
    - name: x
      label: x
      min: -4
      max: 12
      step: 1
      start: 0
    outputs:
    - name: k2
      label: K₂Cr₂O₇ total (x on Cr)
      expr: 2+2*x-14
    - name: km
      label: KMnO₄ total (x on Mn)
      expr: 1+x-8
    - name: so4
      label: SO₄²⁻ total (x on S)
      expr: x-8
    - name: hp
      label: H₂O₂ total (x on O)
      expr: 2+2*x
    goals:
    - prompt: Find Cr in K₂Cr₂O₇ (a neutral compound).
      want:
        k2: 0
      mistakes:
      - when:
          x: 12
        say: 12 is for both Cr atoms together. There are two Cr, so each is 12 ÷ 2.
      - when:
          x: 7
        say: 'With x = 7 the total is +2, not 0. Two K (+2) and seven O (−14): 2x = 12.'
    - prompt: Find Mn in KMnO₄.
      want:
        km: 0
      mistakes:
      - when:
          x: 8
        say: 'K brings +1: 1 + x − 8 = 0.'
    - prompt: Find S in the sulfate ion SO₄²⁻.
      want:
        so4: -2
      mistakes:
      - when:
          x: 8
        say: '+8 makes the ion neutral, but SO₄²⁻ carries −2: x − 8 = −2.'
    - prompt: Find O in hydrogen peroxide, H₂O₂.
      want:
        hp: 0
      mistakes:
      - when:
          x: -2
        say: 'O is usually −2, but in a peroxide the O–O bond means each O is −1: 2(+1) + 2x = 0.'
  lesson:
    - teach: Oxidation is loss of electrons; reduction is gain (OIL RIG). They always happen together. The oxidising agent takes electrons, so it is reduced; the reducing agent gives electrons, so it is oxidised.
      check:
        prompt: 'In Mg + Cl₂ → MgCl₂, Mg is:'
        options:
        - oxidised
        - reduced
        - neither
        answer: oxidised
        why: Mg loses 2 electrons to become Mg²⁺.
      ways:
      - style: visual
        teach: Oxidation and reduction side by side, with the agents that cause them.
        picture:
          kind: compare
          columns:
          - title: Oxidation
            points:
            - loses electrons
            - oxidation number rises
            - done by an oxidising agent
          - title: Reduction
            points:
            - gains electrons
            - oxidation number falls
            - done by a reducing agent
          alt: Oxidation is loss of electrons and a rise in oxidation number; reduction is gain of electrons and a fall in oxidation number. The oxidising agent is itself reduced and the reducing agent is itself oxidised.
      - style: real_world
        teach: Think of electrons as money. The reducing agent is a generous friend who gives money away (and is oxidised); the oxidising agent is the one who takes it (and is reduced). One can't happen without the other.
    - teach: 'Oxidation number rules: an element alone is 0; a simple ion equals its charge; O is −2 (−1 in peroxides); H is +1 (−1 in metal hydrides); F is −1; the total equals the charge on the species.'
      check:
        prompt: Oxidation number of N in NH₃?
        options:
        - −3
        - '+3'
        - '0'
        answer: −3
        why: N + 3(+1) = 0.
      ways:
      - style: step_by_step
        teach: 'Step 1: Write x for the unknown element. Step 2: Put in the fixed values: O = −2, H = +1, K or Na = +1. Step 3: Set the total equal to the charge on the species. Step 4: Solve. Example: KClO₃: 1 + x − 6 = 0, so Cl = +5.'
      - style: visual
        teach: Working out the oxidation number of P in H₃PO₄ as a sum.
        picture:
          kind: compare
          columns:
          - title: Known parts
            points:
            - '3 H: 3 × (+1) = +3'
            - '4 O: 4 × (−2) = −8'
          - title: Total must be 0
            points:
            - +3 + x − 8 = 0
            - 'P: x = +5'
          alt: Three hydrogens give plus 3 and four oxygens give minus 8; for the molecule to total zero, phosphorus must be plus 5.
    - teach: 'Kinds of redox reactions: combination, decomposition, displacement (Zn + CuSO₄) and disproportionation, where one element is both oxidised and reduced (2H₂O₂ → 2H₂O + O₂).'
      picture:
        kind: compare
        columns:
        - title: Change
          points:
          - oxidation number goes up
          - oxidation number goes down
        - title: Name
          points:
          - oxidation
          - reduction
        alt: Oxidation and reduction as changes in oxidation number.
      check:
        prompt: 'Cl₂ + 2OH⁻ → Cl⁻ + ClO⁻ + H₂O is:'
        options:
        - disproportionation
        - combination
        - decomposition
        answer: disproportionation
        why: Cl goes from 0 to −1 and to +1.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find each element''s oxidation number before and after. Step 2: If one element goes both up and down, it''s disproportionation. Step 3: If a free element pushes another out of its compound, it''s displacement. Example: Cl₂ + 2OH⁻ → Cl⁻ + ClO⁻ + H₂O: Cl goes 0 → −1 and 0 → +1.'
      - style: real_world
        teach: 'Rust forming on an iron gate is a combination redox: iron is oxidised by oxygen. Dipping an iron nail in blue copper sulphate solution coats it with copper and fades the blue: a displacement redox, as iron gives electrons to copper ions.'
  items:
  - prompt: Find the oxidation number of S in H₂SO₄.
    answer: '6'
    check: 0 - 2*1 - 4*(-2)
    difficulty: 1
    hints:
    - 2(+1) + x + 4(−2) = 0.
    - x = 6.
    solution: "2(+1) + x + 4(−2) = 0, so x = +6."
    mistakes:
      '-6': c11c_onum
  - prompt: Find the oxidation number of Mn in KMnO₄.
    answer: '7'
    check: 0 - 1 - 4*(-2)
    difficulty: 1
    hints:
    - +1 + x − 8 = 0.
    - x = 7.
    solution: "+1 + x + 4(−2) = 0, so x = +7."
    mistakes: {"5": "c11_oxidation_number", "8": "c11_oxidation_number", "4": "c11_oxidation_number"}
  - prompt: Find the oxidation number of Cr in Cr₂O₇²⁻.
    answer: '6'
    check: (-2 - 7*(-2))/2
    difficulty: 2
    hints:
    - 2x − 14 = −2.
    - x = 6.
    solution: "2x + 7(−2) = −2, so 2x = 12 and x = +6."
    mistakes: {"7": "c11_oxidation_number", "12": "c11_oxidation_number", "3": "c11_oxidation_number"}
  - prompt: Find the oxidation number of O in H₂O₂.
    answer: '-1'
    check: (0-2)/2
    difficulty: 2
    hints:
    - Peroxide.
    - 2(+1) + 2x = 0.
    solution: "In a peroxide 2(+1) + 2x = 0, so x = −1."
    mistakes: {"-2": "c11_peroxide", "1": "c11_peroxide", "-0.5": "c11_peroxide"}
  - prompt: In Zn + Cu²⁺ → Zn²⁺ + Cu, which species is oxidised?
    options:
    - Zn
    - Cu²⁺
    - Zn²⁺
    - Cu
    answer: Zn
    difficulty: 1
    hints:
    - Loses electrons.
    - 0 → +2.
    solution: "Zn goes from 0 to +2, losing 2 electrons, so zinc is oxidised (and Cu²⁺ is reduced)."
    mistakes:
      Cu²⁺: c11c_ox
  - prompt: '2H₂O₂ → 2H₂O + O₂ is an example of:'
    options:
    - disproportionation
    - combination
    - displacement
    - neutralisation
    answer: disproportionation
    difficulty: 2
    hints:
    - O goes from −1 to −2 and 0.
    - Same element both ways.
    solution: "O in H₂O₂ is −1; it goes down to −2 in H₂O and up to 0 in O₂. One element both oxidised and reduced: disproportionation."
    mistakes: {"combination": "c11_disproportionation", "displacement": "c11_disproportionation", "neutralisation": "c11_disproportionation"}
  - prompt: Find the oxidation number of C in CO₂.
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Two O atoms at −2 each.
    - The total must be 0.
    solution: 'Step 1: C + 2(−2) = 0. Step 2: +4.'
    mistakes:
      '-4': c11c07_on
      '2': c11c07_on
  - prompt: Find the oxidation number of N in HNO₃.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - H is +1, each O is −2.
    - 1 + N − 6 = 0.
    solution: 'Step 1: N = 6 − 1. Step 2: +5.'
    mistakes:
      '3': c11c07_on
      '-5': c11c07_on
  - prompt: 'In Fe₂O₃ + 3CO → 2Fe + 3CO₂, the reducing agent is:'
    options:
    - CO
    - Fe₂O₃
    - CO₂
    answer: CO
    difficulty: 1
    hints:
    - The reducing agent gets oxidised.
    - Which carbon's oxidation number goes up?
    solution: 'Step 1: C goes +2 → +4. Step 2: CO is the reducing agent.'
    mistakes:
      Fe₂O₃: c11c07_redox
      CO₂: c11c07_redox
  - prompt: Find the oxidation number of H in NaH.
    answer: '-1'
    check: '-1'
    difficulty: 2
    hints:
    - NaH is a metal hydride.
    - Na is +1.
    solution: 'Step 1: +1 + H = 0. Step 2: −1.'
    mistakes:
      '1': c11c07_on
      '0': c11c07_on
  - prompt: Find the oxidation number of S in S₂O₃²⁻ (average).
    answer: '2'
    check: (6-2)/2
    difficulty: 2
    hints:
    - Three O at −2 make −6.
    - 2S − 6 = −2.
    solution: 'Step 1: 2S = 4. Step 2: +2.'
    mistakes:
      '4': c11c07_on
      '-2': c11c07_on
  - prompt: In Cu + 2Ag⁺ → Cu²⁺ + 2Ag, which is reduced?
    options:
    - Ag⁺
    - Cu
    - Cu²⁺
    answer: Ag⁺
    difficulty: 2
    hints:
    - Reduction is gain of electrons.
    - Which goes from + to 0?
    solution: 'Step 1: Ag⁺ + e⁻ → Ag. Step 2: Ag⁺ is reduced.'
    mistakes:
      Cu: c11c07_redox
      Cu²⁺: c11c07_redox
  - prompt: Find the oxidation number of O in OF₂.
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - F is always −1.
    - O + 2(−1) = 0.
    solution: 'Step 1: O = +2. Step 2: +2.'
    mistakes:
      '-2': c11c07_on
      '-1': c11c07_on
  - prompt: Find the oxidation number of Fe in Fe₃O₄ (average).
    answer: 8/3
    check: 8/3
    difficulty: 3
    hints:
    - Four O at −2 make −8.
    - 3Fe = 8.
    solution: 'Step 1: 3Fe − 8 = 0. Step 2: +8/3.'
    mistakes:
      '3': c11c07_on
      '2': c11c07_on
  - prompt: Which reaction is NOT a redox reaction?
    options:
    - NaOH + HCl → NaCl + H₂O
    - Zn + CuSO₄ → ZnSO₄ + Cu
    - 2Mg + O₂ → 2MgO
    answer: NaOH + HCl → NaCl + H₂O
    difficulty: 3
    hints:
    - Check whether any oxidation number changes.
    - Neutralisation only swaps partners.
    solution: 'Step 1: Na, O, H, Cl keep their numbers. Step 2: not redox.'
    mistakes:
      Zn + CuSO₄ → ZnSO₄ + Cu: c11c07_redox
      2Mg + O₂ → 2MgO: c11c07_redox
  - prompt: 'Assertion (A): In the reaction Zn + CuSO₄ → ZnSO₄ + Cu, zinc acts as the reducing agent.

      Reason (R): Zinc loses electrons and its oxidation number rises from 0 to +2.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. Zinc gives its electrons to Cu²⁺, which makes it the reducing agent: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: Find the oxidation number of Mn in MnO₂.
    options:
    - '+4'
    - '+2'
    - −4
    answer: '+4'
    hints:
    - Each O is −2.
    - x + 2(−2) = 0.
    solution: x − 4 = 0, so Mn = +4.
    mistakes:
      '+2': c11_oxidation_number
      −4: c11c_onum
    exam: one_mark
    difficulty: 2
  - prompt: 'Case: In the thermite reaction 2Al + Fe₂O₃ → Al₂O₃ + 2Fe, used to weld railway tracks, which species is the oxidising agent?'
    options:
    - Fe₂O₃
    - Al
    - Al₂O₃
    answer: Fe₂O₃
    hints:
    - Which element's oxidation number falls?
    - The species containing it is the oxidising agent.
    solution: Fe goes from +3 to 0 (reduced), so Fe₂O₃ is the oxidising agent; Al is the reducing agent.
    mistakes:
      Al: c11c07_redox
      Al₂O₃: c11c_ox
    exam: case
    difficulty: 2
- code: cbse11c.redox.balance
  title: Balancing redox reactions and electrode processes
  after:
  - cbse11c.redox.onum
  notes: |
    Balancing: oxidation number method (equalise increase and decrease) and half-reaction (ion–electron) method: split
    into halves, balance atoms other than O and H, then O with H₂O, H with H⁺ (acid) or OH⁻ (base), charge with electrons,
    multiply to equal electrons, add. Redox titrations (KMnO₄ self-indicator; K₂Cr₂O₇). Electrode processes: Daniell cell
    Zn | Zn²⁺ || Cu²⁺ | Cu; oxidation at anode, reduction at cathode; standard electrode potential E° (SHE = 0); more
    negative E° = stronger reducing agent; electrochemical series.
  explanations:
    text: To balance a redox equation, make sure electrons lost equal electrons gained. The half-reaction method writes oxidation and reduction separately, balances each, then adds them. In a cell, oxidation happens at the anode and reduction at the cathode.
    visual: 'Draw the Daniell cell: a zinc rod in zinc sulfate, a copper rod in copper sulfate, a salt bridge between, and electrons flowing through the wire from zinc to copper.'
    step_by_step: 'Step 1: Write the two half-reactions. Step 2: Balance atoms, then O with H₂O and H with H⁺. Step 3: Balance charge with electrons. Step 4: Multiply so electrons match, and add.'
    real_world: Batteries in phones and torches are redox reactions arranged so the electrons flow through a circuit and do useful work.
  picture:
    kind: flow
    steps:
    - Split into half-reactions
    - Balance atoms, O and H
    - Balance charge with e⁻
    - Equalise electrons
    - Add and simplify
    alt: The half-reaction method for balancing a redox equation, step by step.
  activity:
    type: formula
    prompt: Electrons lost must equal electrons gained. MnO₄⁻ → Mn²⁺ gains 5 e⁻; Cr₂O₇²⁻ → 2Cr³⁺ gains 6 e⁻; Fe²⁺ → Fe³⁺ loses 1 e⁻.
    inputs:
    - name: a
      label: Oxidant ions
      min: 1
      max: 5
      step: 1
      start: 1
    - name: b
      label: Fe²⁺ ions
      min: 1
      max: 12
      step: 1
      start: 1
    outputs:
    - name: lost
      label: Electrons lost by Fe²⁺
      expr: b
    - name: nm
      label: 'If MnO₄⁻: gained − lost'
      expr: 5*a-b
    - name: nc
      label: 'If Cr₂O₇²⁻: gained − lost'
      expr: 6*a-b
    goals:
    - prompt: Balance one MnO₄⁻ with Fe²⁺.
      want:
        a: 1
        nm: 0
      mistakes:
      - when:
          a: 1
          b: 1
        say: 'One Fe²⁺ gives only 1 electron. Mn goes from +7 to +2: it needs 5.'
      - when:
          a: 1
          b: 7
        say: Mn goes from +7 to +2, a change of 5, not 7.
    - prompt: Balance one Cr₂O₇²⁻ with Fe²⁺.
      want:
        a: 1
        nc: 0
      mistakes:
      - when:
          a: 1
          b: 3
        say: 'Each Cr gains 3, but there are two Cr in Cr₂O₇²⁻: 6 electrons.'
    - prompt: Balance two MnO₄⁻ with Fe²⁺.
      want:
        a: 2
        nm: 0
      mistakes:
      - when:
          a: 2
          b: 5
        say: 5 Fe²⁺ balance only one MnO₄⁻. Two need 10 electrons.
  lesson:
    - teach: 'Half-reaction method: split into oxidation and reduction halves; balance atoms other than O and H; balance O with H₂O, then H with H⁺ (in acid); balance charge with electrons.'
      check:
        prompt: 'In acid, extra hydrogen atoms in a half-reaction are balanced by adding:'
        options:
        - H⁺
        - H₂O
        - OH⁻
        answer: H⁺
        why: Acidic solution supplies H⁺.
      ways:
      - style: visual
        teach: The half-reaction method as a sequence of steps for an acidic solution.
        picture:
          kind: flow
          steps:
          - Split into oxidation and reduction halves
          - Balance atoms other than O and H
          - Add H₂O for O, then H⁺ for H
          - Add e⁻ to balance charge
          - Match electrons and add the halves
          alt: Split the reaction into two halves, balance atoms other than oxygen and hydrogen, add water for oxygen and H plus for hydrogen, add electrons for charge, then match the electrons and add.
      - style: step_by_step
        teach: 'Step 1: MnO₂ → Mn²⁺. Step 2: Two O on the left, so add 2H₂O on the right. Step 3: That needs 4H⁺ on the left. Step 4: Charge: left +4, right +2, so add 2e⁻ on the left: MnO₂ + 4H⁺ + 2e⁻ → Mn²⁺ + 2H₂O.'
    - teach: 'Then multiply the halves so the electrons lost equal the electrons gained, and add. Example: MnO₄⁻ gains 5 e⁻, Fe²⁺ loses 1 e⁻, so one MnO₄⁻ oxidises 5 Fe²⁺.'
      check:
        prompt: Cr₂O₇²⁻ → 2Cr³⁺ gains 6 e⁻. How many Fe²⁺ does it oxidise?
        options:
        - '6'
        - '1'
        - '3'
        answer: '6'
        why: Each Fe²⁺ gives 1 e⁻.
      ways:
      - style: step_by_step
        teach: 'Step 1: Count electrons lost in one half and gained in the other. Step 2: Find their lowest common multiple. Step 3: Multiply each half to reach it. Step 4: Add and cancel. Example: Cl₂ gains 2 e⁻ and each Br⁻ loses 1, so Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂.'
      - style: visual
        teach: 'Matching electrons: aluminium loses 3, copper ions gain 2, so use 6.'
        picture:
          kind: compare
          columns:
          - title: Oxidation (× 2)
            points:
            - Al → Al³⁺ + 3e⁻
            - 2 Al give 6 e⁻
          - title: Reduction (× 3)
            points:
            - Cu²⁺ + 2e⁻ → Cu
            - 3 Cu²⁺ take 6 e⁻
          alt: Each aluminium loses 3 electrons and each copper ion gains 2; doubling the first and tripling the second matches 6 electrons, giving 2Al plus 3Cu2+ goes to 2Al3+ plus 3Cu.
    - teach: In a cell like Daniell's (Zn | Zn²⁺ || Cu²⁺ | Cu), oxidation happens at the anode and reduction at the cathode. Standard electrode potentials E° are measured against hydrogen (0 V); a more negative E° means a stronger reducing agent.
      picture:
        kind: flow
        steps:
        - Split into halves
        - Balance atoms, O with H₂O, H with H⁺
        - Add electrons
        - Equalise electrons
        - Add halves
        alt: Steps of the half-reaction method.
      check:
        prompt: E°(Zn²⁺/Zn) = −0.76 V, E°(Cu²⁺/Cu) = +0.34 V. Better reducing agent?
        options:
        - Zn
        - Cu
        - same
        answer: Zn
        why: More negative E°.
      ways:
      - style: step_by_step
        teach: 'Step 1: Anode = oxidation, cathode = reduction (vowels together, consonants together). Step 2: Electrons flow from anode to cathode through the wire. Step 3: The more negative E° metal is the anode. Step 4: E°cell = E°cathode − E°anode.'
      - style: real_world
        teach: 'Galvanised iron buckets are coated with zinc. Zinc has a more negative electrode potential than iron, so if the coat is scratched, the zinc gives up electrons and corrodes instead of the iron: the zinc sacrifices itself.'
  items:
  - prompt: In MnO₄⁻ → Mn²⁺, how many electrons are gained per Mn?
    answer: '5'
    check: 7-2
    difficulty: 1
    hints:
    - +7 to +2.
    - Difference.
    solution: "Mn goes from +7 to +2: 7 − 2 = 5 electrons gained."
    mistakes: {"2": "c11_electrons_gained", "7": "c11_electrons_gained", "3": "c11_electrons_gained"}
  - prompt: In Fe²⁺ → Fe³⁺, how many electrons are lost per iron ion?
    answer: '1'
    check: 3-2
    difficulty: 1
    hints:
    - +2 to +3.
    - One.
    solution: "Fe goes from +2 to +3, so it loses 1 electron."
    mistakes: {"2": "c11_electrons_lost", "3": "c11_electrons_lost"}
  - prompt: How many Fe²⁺ ions does one MnO₄⁻ oxidise?
    answer: '5'
    check: 5/1
    difficulty: 2
    hints:
