# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse11-chem
chapter: 1
title: Some Basic Concepts of Chemistry
tips:
  c11c_mole: Moles = mass ÷ molar mass. One mole of anything contains 6.022 × 10²³ particles.
  c11c_molarity: Molarity = moles of solute ÷ volume of SOLUTION in litres (not millilitres, not volume of water).
  c11_amu: "The modern standard is carbon-12, chosen in 1961. One amu is a set fraction of its mass."
  c11_avogadro: "Molecules = moles × 6.022 × 10²³."
  c11_empirical: "Divide every subscript by their highest common factor to get the simplest ratio."
  c11_law_definite: "Water from a river or a lab always has H and O in the same mass ratio. Which law says the ratio is fixed?"
  c11_mass_from_mol: "Mass = moles × molar mass. Find the molar mass of NaOH first."
  c11_molality: "Volume changes with temperature, mass does not. Which unit uses mass of solvent, not volume of solution?"
  c11_molar_mass: "Add the atomic masses of every atom: two H and one O."
  c11_mole_ratio: "Read the coefficients: 2 mol H₂ gives 2 mol H₂O. Scale up."
  c11_percent: "% O = mass of O in one molecule ÷ molar mass × 100."
  c11c01_mole: Moles = mass ÷ molar mass. Add up atomic masses carefully, counting every atom in the formula.
  c11c01_ratio: Use the balanced equation's numbers as a mole ratio. Convert grams to moles first.
  c11c01_conc: Molarity uses litres of SOLUTION; molality uses kilograms of SOLVENT. Change mL to L first.
concepts:
- code: cbse11c.basic.mole
  title: Laws of combination and the mole
  notes: |
    Matter: elements, compounds, mixtures. SI units, significant figures. Laws of chemical combination: conservation of
    mass (Lavoisier), definite proportions (Proust), multiple proportions (Dalton), Gay-Lussac's law of gaseous volumes,
    Avogadro's law. Dalton's atomic theory. Atomic mass unit (1/12 of C-12); average atomic mass from isotopes; molecular
    mass, formula mass. Mole: 6.022 × 10²³ entities (Avogadro constant). Molar mass in g/mol equals the molecular mass.
    Moles n = m/M. Molar volume of an ideal gas at STP ≈ 22.7 L (22.4 L in older books).
  explanations:
    text: 'Chemists count atoms in moles: one mole is 6.022 × 10²³ particles. The mass of one mole in grams equals the formula mass, so 18 g of water is one mole of water molecules. This lets us turn grams into numbers of particles.'
    visual: 'Draw a bridge: grams on one side, moles in the middle, particles on the other. Divide by molar mass to cross from grams to moles; multiply by 6.022 × 10²³ to reach particles.'
    step_by_step: 'Step 1: Find the molar mass by adding atomic masses. Step 2: Moles = mass ÷ molar mass. Step 3: Particles = moles × 6.022 × 10²³.'
    real_world: Pharmacists use moles to make sure a medicine has exactly the right number of active molecules per tablet.
  picture:
    kind: flow
    steps:
    - Mass in grams
    - ÷ molar mass
    - Moles
    - × 6.022 × 10²³
    - Number of particles
    alt: Converting grams to moles by dividing by molar mass, then to particles by multiplying by Avogadro's number.
  activity:
    type: formula
    prompt: Choose a substance by its molar mass M, then weigh some out. Moles n = mass ÷ M; one mole holds 6.022 × 10²³ particles.
    inputs:
    - name: mm
      label: Molar mass M
      min: 1
      max: 100
      step: 1
      start: 1
      unit: g/mol
    - name: m
      label: Mass weighed
      min: 0
      max: 100
      step: 1
      start: 0
      unit: g
    outputs:
    - name: n
      label: Moles
      expr: m/mm
      unit: mol
      places: 3
    - name: p
      label: Particles (× 10²³)
      expr: m/mm*6.022
      places: 3
    goals:
    - prompt: Weigh out exactly 1 mole of water, H₂O.
      want:
        mm: 18
        n: 1
      mistakes:
      - when:
          mm: 17
        say: '17 is OH. Water has two H atoms: 2 × 1 + 16.'
      - when:
          mm: 10
        say: 'H₂O: 2 × 1 + 16 = 18. The 2 multiplies the H only.'
    - prompt: Weigh out 0.5 mol of carbon dioxide, CO₂.
      want:
        mm: 44
        n: 0.5
      mistakes:
      - when:
          mm: 28
        say: '28 is CO. CO₂ has two O atoms: 12 + 2 × 16.'
      - when:
          mm: 44
          m: 88
        say: 88 g is 2 mol. Half a mole is half of 44 g.
    - prompt: Weigh out 12.044 × 10²³ molecules of oxygen gas, O₂.
      want:
        mm: 32
        p:
        - 12.04
        - 12.05
      mistakes:
      - when:
          mm: 16
        say: '16 is one O atom. Oxygen gas is O₂: 32 g/mol.'
      - when:
          mm: 32
          m: 32
        say: 32 g is one mole, 6.022 × 10²³ molecules. You need twice that.
  lesson:
    - teach: 'Laws of combination: mass is conserved in a reaction (Lavoisier); a compound always has the same elements in the same mass ratio (Proust); gases react in simple whole-number volume ratios (Gay-Lussac).'
      check:
        prompt: 10 g of A reacts fully with 5 g of B. Mass of products?
        options:
        - 15 g
        - 5 g
        - 50 g
        answer: 15 g
        why: Mass is conserved.
      ways:
      - style: visual
        teach: Three laws of chemical combination and what each one says.
        picture:
          kind: compare
          columns:
          - title: Conservation of mass
            points:
            - Lavoisier
            - mass in = mass out
          - title: Definite proportions
            points:
            - Proust
            - same compound, same mass ratio
          - title: Gaseous volumes
            points:
            - Gay-Lussac
            - gases react in simple volume ratios
          alt: 'Lavoisier: mass is conserved in a reaction. Proust: a compound always has the same mass ratio of elements. Gay-Lussac: gases react in simple whole-number volume ratios.'
      - style: real_world
        teach: 'Pure water from a Kerala well and from a glacier in the Himalayas both have hydrogen and oxygen in the mass ratio 1 : 8. Wherever a compound comes from, its make-up is fixed: that is the law of definite proportions.'
    - teach: 'Atomic masses are measured in u, where 1 u is 1/12 of a carbon-12 atom. Molecular mass is the sum of atomic masses in the formula: CO₂ = 12 + 2 × 16 = 44 u.'
      check:
        prompt: Molecular mass of NH₃ (N = 14, H = 1)?
        options:
        - 17 u
        - 15 u
        - 42 u
        answer: 17 u
        why: 14 + 3 × 1.
      ways:
      - style: step_by_step
        teach: 'Step 1: Write the formula. Step 2: Multiply each element''s atomic mass by how many atoms it has. Step 3: Add. Example: NH₃ = 14 + 3 × 1 = 17 u. Step 4: For an ionic solid, the same sum is called the formula mass: NaCl = 23 + 35.5 = 58.5 u.'
      - style: visual
        teach: Molecular mass of sucrose, C₁₂H₂₂O₁₁, built up atom by atom.
        picture:
          kind: bars
          unit: u
          bars:
          - label: '12 C: 12 × 12'
            value: 144
          - label: '22 H: 22 × 1'
            value: 22
          - label: '11 O: 11 × 16'
            value: 176
          - label: sucrose
            value: 342
          alt: In sucrose, 12 carbons give 144 u, 22 hydrogens give 22 u and 11 oxygens give 176 u, adding up to 342 u.
    - teach: 'One mole is 6.022 × 10²³ particles. Its mass in grams equals the molecular mass: 1 mol of CO₂ is 44 g. So moles n = mass ÷ molar mass.'
      picture:
        kind: flow
        steps:
        - Mass (g)
        - ÷ molar mass
        - Moles
        - × 6.022 × 10²³
        - Particles
        alt: Converting between mass, moles and particles.
      check:
        prompt: How many moles are in 36 g of water (M = 18)?
        options:
        - '2'
        - '0.5'
        - '648'
        answer: '2'
        why: 36 ÷ 18.
      ways:
      - style: step_by_step
        teach: 'Step 1: Mass → moles: divide by molar mass. Step 2: Moles → particles: multiply by 6.022 × 10²³. Step 3: Moles → gas volume at STP: multiply by 22.4 L. Example: 34 g of NH₃ (M = 17) is 2 mol, about 12 × 10²³ molecules.'
      - style: real_world
        teach: 'A shopkeeper sells eggs by the dozen and paper by the ream of 500 sheets. Chemists count atoms by the mole: 6.022 × 10²³ of them. A mole of water is just 18 g, about a tablespoonful, yet holds that many molecules.'
  items:
  - prompt: Find the molar mass of water, H₂O, in g/mol (H = 1, O = 16).
    answer: '18'
    check: 2*1+16
    difficulty: 1
    hints:
    - 2 × 1 + 16.
    - Add atomic masses.
    solution: 18 g/mol.
    mistakes: {"17": "c11_molar_mass", "10": "c11_molar_mass", "34": "c11_molar_mass"}
  - prompt: How many moles are in 88 g of CO₂ (C = 12, O = 16)?
    answer: '2'
    check: 88/(12+2*16)
    difficulty: 1
    hints:
    - M = 44 g/mol.
    - 88 ÷ 44.
    solution: 2 mol.
    mistakes:
      '176': c11c_mole
  - prompt: Find the mass (in g) of 0.5 mol of NaOH (Na = 23, O = 16, H = 1).
    answer: '20'
    check: Rational(1,2)*(23+16+1)
    difficulty: 1
    hints:
    - M = 40.
    - 0.5 × 40.
    solution: 20 g.
    mistakes: {"40": "c11_mass_from_mol", "80": "c11_mass_from_mol", "10": "c11_mass_from_mol"}
  - prompt: How many molecules are in 2 mol of oxygen gas, in units of 10²³? (use 6.022)
    answer: '12.044'
    check: 2*Rational(6022,1000)
    difficulty: 2
    hints:
    - n × Nₐ.
    - 2 × 6.022.
    solution: 12.044 × 10²³ molecules.
    mistakes: {"6.022": "c11_avogadro", "24.088": "c11_avogadro", "3.011": "c11_avogadro"}
  - prompt: Which law says a compound always contains the same elements in the same mass ratio?
    options:
    - law of definite proportions
    - law of multiple proportions
    - law of conservation of mass
    - Avogadro's law
    answer: law of definite proportions
    difficulty: 2
    hints:
    - Proust.
    - Water is always 1:8 H:O by mass.
    solution: The law of definite proportions.
    mistakes: {"law of multiple proportions": "c11_law_definite", "law of conservation of mass": "c11_law_definite", "Avogadro's law": "c11_law_definite"}
  - prompt: 'One atomic mass unit is defined as:'
    options:
    - 1/12 of the mass of a carbon-12 atom
    - the mass of a hydrogen atom
    - 1/16 of an oxygen atom
    - the mass of a proton exactly
    answer: 1/12 of the mass of a carbon-12 atom
    difficulty: 2
    hints:
    - Carbon-12 standard.
    - Twelfth.
    solution: 1 u = 1/12 of a C-12 atom's mass.
    mistakes: {"the mass of a hydrogen atom": "c11_amu", "1/16 of an oxygen atom": "c11_amu", "the mass of a proton exactly": "c11_amu"}
  - prompt: Find the molar mass of CaCO₃ (Ca = 40, C = 12, O = 16) in g/mol.
    answer: '100'
    check: 40+12+48
    difficulty: 1
    hints:
    - Count three oxygen atoms.
    - Add 40 + 12 + 3 × 16.
    solution: 'Step 1: 40 + 12 + 48. Step 2: 100 g/mol.'
    mistakes:
      '68': c11c01_mole
      '84': c11c01_mole
  - prompt: How many moles are in 11.5 g of sodium (Na = 23)?
    answer: '0.5'
    check: 11.5/23
    difficulty: 1
    hints:
    - n = m/M.
    - 11.5 ÷ 23.
    solution: 'Step 1: 11.5/23. Step 2: 0.5 mol.'
    mistakes:
      '2': c11c01_mole
      '264.5': c11c01_mole
  - prompt: 'The mass of 1 mol of any substance in grams equals its:'
    options:
    - molecular (or formula) mass
    - atomic number
    - number of atoms
    answer: molecular (or formula) mass
    difficulty: 1
    hints:
    - Think of 1 mol of CO₂.
    - Its mass is the same number as its u value.
    solution: 'Step 1: 1 mol CO₂ = 44 g; CO₂ = 44 u. Step 2: molecular mass.'
    mistakes:
      atomic number: c11c01_mole
      number of atoms: c11c01_mole
  - prompt: Find the mass (in g) of 0.25 mol of H₂SO₄ (H = 1, S = 32, O = 16).
    answer: '24.5'
    check: 0.25*98
    difficulty: 2
    hints:
    - Molar mass of H₂SO₄ = 2 + 32 + 64.
    - Multiply by 0.25.
    solution: 'Step 1: M = 98. Step 2: 0.25 × 98 = 24.5 g.'
    mistakes:
      '392': c11c01_mole
      '12.25': c11c01_mole
  - prompt: How many atoms are in 0.5 mol of carbon, in units of 10²³ (use 6.022)?
    answer: '3.011'
    check: 0.5*6.022
    difficulty: 2
    hints:
    - Particles = n × Nₐ.
    - Half of 6.022.
    solution: 'Step 1: 0.5 × 6.022. Step 2: 3.011 × 10²³.'
    mistakes:
      '12.044': c11c01_mole
      '6.022': c11c01_mole
  - prompt: 'Carbon and oxygen form CO and CO₂. With 12 g of C, oxygen masses are 16 g and 32 g, a 1 : 2 ratio. This shows the law of:'
    options:
    - multiple proportions
    - definite proportions
    - conservation of mass
    answer: multiple proportions
    difficulty: 2
    hints:
    - Two different compounds of the same elements.
    - Fixed mass of one element, simple ratio of the other.
    solution: 'Step 1: two compounds, simple ratio. Step 2: multiple proportions.'
    mistakes:
      definite proportions: c11c01_ratio
      conservation of mass: c11c01_ratio
  - prompt: Chlorine is 75% ³⁵Cl and 25% ³⁷Cl. Find its average atomic mass (u).
    answer: '35.5'
    check: 0.75*35+0.25*37
    difficulty: 2
    hints:
    - Weighted average of isotope masses.
    - 0.75 × 35 + 0.25 × 37.
    solution: 'Step 1: 26.25 + 9.25. Step 2: 35.5 u.'
    mistakes:
      '36': c11c01_mole
      '72': c11c01_mole
  - prompt: At STP (molar volume 22.4 L), what volume (in L) does 8 g of O₂ (M = 32) occupy?
    answer: '5.6'
    check: 8/32*22.4
    difficulty: 3
    hints:
    - Find moles first.
    - Multiply by 22.4.
    solution: 'Step 1: 0.25 mol. Step 2: 0.25 × 22.4 = 5.6 L.'
    mistakes:
      '179.2': c11c01_mole
      '11.2': c11c01_mole
  - prompt: How many hydrogen atoms are in 1 mol of CH₄, in units of 10²³ (use 6.022)?
    answer: '24.088'
    check: 4*6.022
    difficulty: 3
    hints:
    - Each CH₄ has 4 H atoms.
    - 4 × Nₐ.
    solution: 'Step 1: 4 mol of H atoms. Step 2: 4 × 6.022 = 24.088 × 10²³.'
    mistakes:
      '6.022': c11c01_mole
      '30.11': c11c01_mole
  - prompt: 'Assertion (A): 1 mol of oxygen gas (O₂) and 1 mol of nitrogen gas (N₂) contain the same number of molecules.

      Reason (R): One mole of any substance contains 6.022 × 10²³ elementary particles.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. A mole is a fixed count of particles whatever the substance, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A tablet contains 0.36 g of aspirin, C₉H₈O₄ (molar mass 180 g/mol). How many moles of aspirin are in it?'
    options:
    - 0.002 mol
    - 0.5 mol
    - 64.8 mol
    answer: 0.002 mol
    hints:
    - n = mass ÷ molar mass.
    - 0.36 ÷ 180.
    solution: n = 0.36/180 = 0.002 mol.
    mistakes:
      0.5 mol: c11c_mole
      64.8 mol: c11_mass_from_mol
    exam: case
    difficulty: 2
  - prompt: Which law is illustrated when 2 volumes of hydrogen react with 1 volume of oxygen to give 2 volumes of steam?
    options:
    - Gay-Lussac's law of gaseous volumes
    - Law of conservation of mass
    - Law of multiple proportions
    answer: Gay-Lussac's law of gaseous volumes
    hints:
    - The data are volumes of gases.
    - Which law is about simple volume ratios?
    solution: 'The volumes are in the simple ratio 2 : 1 : 2, which is Gay-Lussac''s law.'
    mistakes:
      Law of conservation of mass: c11_law_definite
      Law of multiple proportions: c11_law_definite
    exam: one_mark
    difficulty: 2
- code: cbse11c.basic.stoich
  title: Formulae, concentration and stoichiometry
  after:
  - cbse11c.basic.mole
  notes: |
    Percentage composition = (mass of element ÷ molar mass) × 100. Empirical formula (simplest ratio) and molecular formula
    (= n × empirical). Balanced equations give mole ratios. Stoichiometry: mass–mass, mass–volume calculations. Limiting
    reagent: the reactant used up first fixes the amount of product. Concentration: mass percent, mole fraction, molarity
    M = moles of solute / litres of solution, molality m = moles of solute / kg of solvent (independent of temperature).
  explanations:
    text: 'A balanced equation is a recipe in moles: 2H₂ + O₂ → 2H₂O means 2 moles of hydrogen need 1 mole of oxygen. Concentration tells how much solute is in a solution, most often as molarity, moles per litre.'
    visual: 'Picture making sandwiches: 2 slices of bread per sandwich. With 10 slices and 3 fillings, you make only 3 sandwiches: the filling is the limiting reagent.'
    step_by_step: 'Step 1: Balance the equation. Step 2: Turn given masses into moles. Step 3: Use the mole ratio. Step 4: Turn moles of product back into mass or volume.'
    real_world: Saline drips in hospitals are 0.9% NaCl by mass, chosen to match the salt concentration of blood.
  picture:
    kind: compare
    columns:
    - title: Measure
      points:
      - molarity
      - molality
      - mole fraction
    - title: Definition
      points:
      - mol solute per L solution
      - mol solute per kg solvent
      - mol of part ÷ total mol
    alt: 'Three ways to express concentration: molarity, molality and mole fraction.'
  activity:
    type: formula
    prompt: N₂ + 3H₂ → 2NH₃. Whichever runs out first, the limiting reagent, decides how much ammonia forms.
    inputs:
    - name: a
      label: N₂
      min: 0
      max: 10
      step: 1
      start: 0
      unit: mol
    - name: b
      label: H₂
      min: 0
      max: 30
      step: 1
      start: 0
      unit: mol
    outputs:
    - name: nh3
      label: NH₃ made
      expr: 2*min(a,b/3)
      unit: mol
      places: 2
    - name: ln
      label: N₂ left over
      expr: a-min(a,b/3)
      unit: mol
      places: 2
    - name: lh
      label: H₂ left over
      expr: b-3*min(a,b/3)
      unit: mol
      places: 2
    goals:
    - prompt: Make 4 mol of NH₃ with nothing left over.
      want:
        nh3: 4
        ln: 0
        lh: 0
      mistakes:
      - when:
          a: 2
          b: 2
        say: '1 : 1 isn''t the recipe. Each N₂ needs three H₂.'
      - when:
          a: 4
          b: 12
        say: 'That makes 8 mol: each N₂ gives two NH₃.'
    - prompt: You have 5 mol of N₂. Add H₂ to make 6 mol of NH₃.
      want:
        a: 5
        nh3: 6
      mistakes:
      - when:
          a: 5
          b: 6
        say: '6 mol of H₂ makes only 4 mol of NH₃: 3 H₂ for every 2 NH₃.'
      - when:
          a: 5
          b: 15
        say: 15 mol of H₂ uses up all the N₂ and makes 10 mol.
    - prompt: Use 4 mol of N₂ and make N₂ the limiting reagent, with 2 mol of H₂ left over.
      want:
        a: 4
        lh: 2
      mistakes:
      - when:
          a: 4
          b:
          - 0
          - 11
        say: 'Now H₂ runs out first: 4 N₂ need 12 H₂.'
  lesson:
    - teach: Percentage of an element = (its total mass in the formula ÷ molar mass) × 100. The empirical formula is the simplest whole-number ratio; molecular formula = n × empirical formula.
      check:
        prompt: Empirical formula of C₂H₄?
        options:
        - CH₂
        - C₂H₄
        - CH
        answer: CH₂
        why: Divide by 2.
      ways:
      - style: step_by_step
        teach: 'Step 1: Percentages → grams in 100 g. Step 2: Divide each by its atomic mass to get moles. Step 3: Divide all by the smallest. Step 4: Round to whole numbers (multiply if you get halves). Example: C 40%, H 6.7%, O 53.3% → 3.33 : 6.7 : 3.33 → CH₂O.'
      - style: visual
        teach: From percentages to an empirical formula, one step at a time.
        picture:
          kind: flow
          steps:
          - '% by mass → grams in 100 g'
          - grams ÷ atomic mass → moles
          - ÷ smallest → simple ratio
          - ratio → empirical formula
          - × n = molar mass ÷ empirical mass
          alt: Turn percentages into grams in a 100 gram sample, divide by atomic masses to get moles, divide by the smallest to get a simple ratio, write the empirical formula, then multiply by n to get the molecular formula.
    - teach: A balanced equation gives mole ratios. In N₂ + 3H₂ → 2NH₃, 1 mol N₂ uses 3 mol H₂ and makes 2 mol NH₃. The reactant that runs out first is the limiting reagent.
      check:
        prompt: N₂ + 3H₂ → 2NH₃. 2 mol N₂ makes how much NH₃?
        options:
        - 4 mol
        - 2 mol
        - 6 mol
        answer: 4 mol
        why: 'Ratio 1 : 2.'
      ways:
      - style: visual
        teach: In N₂ + 3H₂ → 2NH₃ with 2 mol N₂ and 3 mol H₂, hydrogen runs out first.
        picture:
          kind: bars
          unit: mol
          bars:
          - label: N₂ available
            value: 2
          - label: N₂ needed for 3 mol H₂
            value: 1
          - label: H₂ available
            value: 3
          - label: H₂ needed for 2 mol N₂
            value: 6
          alt: 'With 2 moles of nitrogen and 3 of hydrogen, the hydrogen would need only 1 mole of nitrogen, but the nitrogen would need 6 moles of hydrogen: hydrogen runs out first and is the limiting reagent.'
      - style: real_world
        teach: 'Making sandwiches needs 2 slices of bread and 1 slice of cheese each. With 10 slices of bread and 8 of cheese you can make only 5 sandwiches: the bread runs out first. In a reaction, that runs-out-first reactant is the limiting reagent.'
    - teach: Molarity M = moles of solute ÷ litres of solution. Molality m = moles of solute ÷ kg of solvent; it does not change with temperature because masses do not.
      picture:
        kind: compare
        columns:
        - title: Unit
          points:
          - molarity (M)
          - molality (m)
          - mole fraction
        - title: Divides by
          points:
          - litres of solution
          - kg of solvent
          - total moles
        alt: Concentration units.
      check:
        prompt: 0.2 mol in 500 mL of solution. Molarity?
        options:
        - 0.4 M
        - 0.1 M
        - 100 M
        answer: 0.4 M
        why: 0.2 ÷ 0.5 L.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find moles of solute. Step 2: For molarity, divide by litres of SOLUTION (mL ÷ 1000). Step 3: For molality, divide by kg of SOLVENT. Example: 0.5 mol of glucose made up to 2 L is 0.25 M.'
      - style: real_world
        teach: 'A ready-mix juice says ''one sachet per litre of drink'': that''s like molarity, per volume of the final drink. Volumes swell slightly in the heat, but the mass of water doesn''t, which is why molality stays the same when temperature changes.'
  items:
  - prompt: 4 g of NaOH (M = 40) is dissolved to make 250 mL of solution. Find its molarity (mol/L).
    answer: '0.4'
    check: Rational(4,40)/Rational(1,4)
    difficulty: 2
    hints:
    - n = 0.1 mol.
    - 0.1 ÷ 0.25 L.
    solution: 0.4 M.
    mistakes:
      '0.0004': c11c_molarity
  - prompt: In 2H₂ + O₂ → 2H₂O, how many moles of water form from 4 mol of H₂?
    answer: '4'
    check: 4*2/2
    difficulty: 1
