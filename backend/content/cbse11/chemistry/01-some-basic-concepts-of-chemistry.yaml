# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse11-chem
chapter: 1
title: Some Basic Concepts of Chemistry
tips:
  c11c_mole: Moles = mass ÷ molar mass. One mole of anything contains 6.022 × 10²³ particles.
  c11c_molarity: Molarity = moles of solute ÷ volume of SOLUTION in litres (not millilitres, not volume of water).
  c11_amu: "The modern standard is carbon-12, chosen in 1961. One amu is a set fraction of its mass."
  c11_avogadro: "Molecules = moles × 6.022 × 10²³."
  c11_empirical: "Divide every subscript by their highest common factor to get the simplest ratio."
  c11_law_definite: "Water from a river or a lab always has H and O in the same mass ratio. Which law says the ratio is fixed?"
  c11_mass_from_mol: "Mass = moles × molar mass. Find the molar mass of NaOH first."
  c11_molality: "Volume changes with temperature, mass does not. Which unit uses mass of solvent, not volume of solution?"
  c11_molar_mass: "Add the atomic masses of every atom: two H and one O."
  c11_mole_ratio: "Read the coefficients: 2 mol H₂ gives 2 mol H₂O. Scale up."
  c11_percent: "% O = mass of O in one molecule ÷ molar mass × 100."
concepts:
- code: cbse11c.basic.mole
  title: Laws of combination and the mole
  notes: |
    Matter: elements, compounds, mixtures. SI units, significant figures. Laws of chemical combination: conservation of
    mass (Lavoisier), definite proportions (Proust), multiple proportions (Dalton), Gay-Lussac's law of gaseous volumes,
    Avogadro's law. Dalton's atomic theory. Atomic mass unit (1/12 of C-12); average atomic mass from isotopes; molecular
    mass, formula mass. Mole: 6.022 × 10²³ entities (Avogadro constant). Molar mass in g/mol equals the molecular mass.
    Moles n = m/M. Molar volume of an ideal gas at STP ≈ 22.7 L (22.4 L in older books).
  explanations:
    text: 'Chemists count atoms in moles: one mole is 6.022 × 10²³ particles. The mass of one mole in grams equals the formula mass, so 18 g of water is one mole of water molecules. This lets us turn grams into numbers of particles.'
    visual: 'Draw a bridge: grams on one side, moles in the middle, particles on the other. Divide by molar mass to cross from grams to moles; multiply by 6.022 × 10²³ to reach particles.'
    step_by_step: 'Step 1: Find the molar mass by adding atomic masses. Step 2: Moles = mass ÷ molar mass. Step 3: Particles = moles × 6.022 × 10²³.'
    real_world: Pharmacists use moles to make sure a medicine has exactly the right number of active molecules per tablet.
  picture:
    kind: flow
    steps:
    - Mass in grams
    - ÷ molar mass
    - Moles
    - × 6.022 × 10²³
    - Number of particles
    alt: Converting grams to moles by dividing by molar mass, then to particles by multiplying by Avogadro's number.
  activity:
    type: formula
    prompt: Choose a substance by its molar mass M, then weigh some out. Moles n = mass ÷ M; one mole holds 6.022 × 10²³ particles.
    inputs:
    - name: mm
      label: Molar mass M
      min: 1
      max: 100
      step: 1
      start: 1
      unit: g/mol
    - name: m
      label: Mass weighed
      min: 0
      max: 100
      step: 1
      start: 0
      unit: g
    outputs:
    - name: n
      label: Moles
      expr: m/mm
      unit: mol
      places: 3
    - name: p
      label: Particles (× 10²³)
      expr: m/mm*6.022
      places: 3
    goals:
    - prompt: Weigh out exactly 1 mole of water, H₂O.
      want:
        mm: 18
        n: 1
      mistakes:
      - when:
          mm: 17
        say: '17 is OH. Water has two H atoms: 2 × 1 + 16.'
      - when:
          mm: 10
        say: 'H₂O: 2 × 1 + 16 = 18. The 2 multiplies the H only.'
    - prompt: Weigh out 0.5 mol of carbon dioxide, CO₂.
      want:
        mm: 44
        n: 0.5
      mistakes:
      - when:
          mm: 28
        say: '28 is CO. CO₂ has two O atoms: 12 + 2 × 16.'
      - when:
          mm: 44
          m: 88
        say: 88 g is 2 mol. Half a mole is half of 44 g.
    - prompt: Weigh out 12.044 × 10²³ molecules of oxygen gas, O₂.
      want:
        mm: 32
        p:
        - 12.04
        - 12.05
      mistakes:
      - when:
          mm: 16
        say: '16 is one O atom. Oxygen gas is O₂: 32 g/mol.'
      - when:
          mm: 32
          m: 32
        say: 32 g is one mole, 6.022 × 10²³ molecules. You need twice that.
  items:
  - prompt: Find the molar mass of water, H₂O, in g/mol (H = 1, O = 16).
    answer: '18'
    check: 2*1+16
    difficulty: 1
    hints:
    - 2 × 1 + 16.
    - Add atomic masses.
    solution: 18 g/mol.
    mistakes: {"17": "c11_molar_mass", "10": "c11_molar_mass", "34": "c11_molar_mass"}
  - prompt: How many moles are in 88 g of CO₂ (C = 12, O = 16)?
    answer: '2'
    check: 88/(12+2*16)
    difficulty: 1
    hints:
    - M = 44 g/mol.
    - 88 ÷ 44.
    solution: 2 mol.
    mistakes:
      '176': c11c_mole
  - prompt: Find the mass (in g) of 0.5 mol of NaOH (Na = 23, O = 16, H = 1).
    answer: '20'
    check: Rational(1,2)*(23+16+1)
    difficulty: 1
    hints:
    - M = 40.
    - 0.5 × 40.
    solution: 20 g.
    mistakes: {"40": "c11_mass_from_mol", "80": "c11_mass_from_mol", "10": "c11_mass_from_mol"}
  - prompt: How many molecules are in 2 mol of oxygen gas, in units of 10²³? (use 6.022)
    answer: '12.044'
    check: 2*Rational(6022,1000)
    difficulty: 2
    hints:
    - n × Nₐ.
    - 2 × 6.022.
    solution: 12.044 × 10²³ molecules.
    mistakes: {"6.022": "c11_avogadro", "24.088": "c11_avogadro", "3.011": "c11_avogadro"}
  - prompt: Which law says a compound always contains the same elements in the same mass ratio?
    options:
    - law of definite proportions
    - law of multiple proportions
    - law of conservation of mass
    - Avogadro's law
    answer: law of definite proportions
    difficulty: 2
    hints:
    - Proust.
    - Water is always 1:8 H:O by mass.
    solution: The law of definite proportions.
    mistakes: {"law of multiple proportions": "c11_law_definite", "law of conservation of mass": "c11_law_definite", "Avogadro's law": "c11_law_definite"}
  - prompt: 'One atomic mass unit is defined as:'
    options:
    - 1/12 of the mass of a carbon-12 atom
    - the mass of a hydrogen atom
    - 1/16 of an oxygen atom
    - the mass of a proton exactly
    answer: 1/12 of the mass of a carbon-12 atom
    difficulty: 2
    hints:
    - Carbon-12 standard.
    - Twelfth.
    solution: 1 u = 1/12 of a C-12 atom's mass.
    mistakes: {"the mass of a hydrogen atom": "c11_amu", "1/16 of an oxygen atom": "c11_amu", "the mass of a proton exactly": "c11_amu"}
- code: cbse11c.basic.stoich
  title: Formulae, concentration and stoichiometry
  after:
  - cbse11c.basic.mole
  notes: |
    Percentage composition = (mass of element ÷ molar mass) × 100. Empirical formula (simplest ratio) and molecular formula
    (= n × empirical). Balanced equations give mole ratios. Stoichiometry: mass–mass, mass–volume calculations. Limiting
    reagent: the reactant used up first fixes the amount of product. Concentration: mass percent, mole fraction, molarity
    M = moles of solute / litres of solution, molality m = moles of solute / kg of solvent (independent of temperature).
  explanations:
    text: 'A balanced equation is a recipe in moles: 2H₂ + O₂ → 2H₂O means 2 moles of hydrogen need 1 mole of oxygen. Concentration tells how much solute is in a solution, most often as molarity, moles per litre.'
    visual: 'Picture making sandwiches: 2 slices of bread per sandwich. With 10 slices and 3 fillings, you make only 3 sandwiches: the filling is the limiting reagent.'
    step_by_step: 'Step 1: Balance the equation. Step 2: Turn given masses into moles. Step 3: Use the mole ratio. Step 4: Turn moles of product back into mass or volume.'
    real_world: Saline drips in hospitals are 0.9% NaCl by mass, chosen to match the salt concentration of blood.
  picture:
    kind: compare
    columns:
    - title: Measure
      points:
      - molarity
      - molality
      - mole fraction
    - title: Definition
      points:
      - mol solute per L solution
      - mol solute per kg solvent
      - mol of part ÷ total mol
    alt: 'Three ways to express concentration: molarity, molality and mole fraction.'
  activity:
    type: formula
    prompt: N₂ + 3H₂ → 2NH₃. Whichever runs out first, the limiting reagent, decides how much ammonia forms.
    inputs:
    - name: a
      label: N₂
      min: 0
      max: 10
      step: 1
      start: 0
      unit: mol
    - name: b
      label: H₂
      min: 0
      max: 30
      step: 1
      start: 0
      unit: mol
    outputs:
    - name: nh3
      label: NH₃ made
      expr: 2*min(a,b/3)
      unit: mol
      places: 2
    - name: ln
      label: N₂ left over
      expr: a-min(a,b/3)
      unit: mol
      places: 2
    - name: lh
      label: H₂ left over
      expr: b-3*min(a,b/3)
      unit: mol
      places: 2
    goals:
    - prompt: Make 4 mol of NH₃ with nothing left over.
      want:
        nh3: 4
        ln: 0
        lh: 0
      mistakes:
      - when:
          a: 2
          b: 2
        say: '1 : 1 isn''t the recipe. Each N₂ needs three H₂.'
      - when:
          a: 4
          b: 12
        say: 'That makes 8 mol: each N₂ gives two NH₃.'
    - prompt: You have 5 mol of N₂. Add H₂ to make 6 mol of NH₃.
      want:
        a: 5
        nh3: 6
      mistakes:
      - when:
          a: 5
          b: 6
        say: '6 mol of H₂ makes only 4 mol of NH₃: 3 H₂ for every 2 NH₃.'
      - when:
          a: 5
          b: 15
        say: 15 mol of H₂ uses up all the N₂ and makes 10 mol.
    - prompt: Use 4 mol of N₂ and make N₂ the limiting reagent, with 2 mol of H₂ left over.
      want:
        a: 4
        lh: 2
      mistakes:
      - when:
          a: 4
          b:
          - 0
          - 11
        say: 'Now H₂ runs out first: 4 N₂ need 12 H₂.'
  items:
  - prompt: 4 g of NaOH (M = 40) is dissolved to make 250 mL of solution. Find its molarity (mol/L).
    answer: '0.4'
    check: Rational(4,40)/Rational(1,4)
    difficulty: 2
    hints:
    - n = 0.1 mol.
    - 0.1 ÷ 0.25 L.
    solution: 0.4 M.
    mistakes:
      '0.0004': c11c_molarity
  - prompt: In 2H₂ + O₂ → 2H₂O, how many moles of water form from 4 mol of H₂?
    answer: '4'
    check: 4*2/2
    difficulty: 1
    hints:
    - 'Ratio H₂ : H₂O = 2 : 2.'
    - Same number.
    solution: 4 mol.
    mistakes: {"2": "c11_mole_ratio", "8": "c11_mole_ratio"}
  - prompt: In 2H₂ + O₂ → 2H₂O, how many moles of O₂ are needed for 6 mol of H₂?
    answer: '3'
    check: 6/2
    difficulty: 1
    hints:
    - 'Ratio 2 : 1.'
    - 6 ÷ 2.
    solution: 3 mol.
    mistakes: {"6": "c11_mole_ratio", "12": "c11_mole_ratio", "2": "c11_mole_ratio"}
  - prompt: Find the percentage of oxygen by mass in water (H = 1, O = 16), to the nearest whole number.
    answer: '89'
    check: round(Rational(16,18)*100)
    difficulty: 2
    hints:
    - 16/18 × 100.
    - 88.9.
    solution: About 89%.
    mistakes: {"33": "c11_percent", "11": "c11_percent", "50": "c11_percent"}
  - prompt: 'The empirical formula of glucose, C₆H₁₂O₆, is:'
    options:
    - CH₂O
    - C₆H₁₂O₆
    - C₂H₄O₂
    - CHO
    answer: CH₂O
    difficulty: 2
    hints:
    - Divide by 6.
    - Simplest ratio.
    solution: CH₂O.
    mistakes: {"C₆H₁₂O₆": "c11_empirical", "C₂H₄O₂": "c11_empirical", "CHO": "c11_empirical"}
  - prompt: Which concentration unit does not change with temperature?
    options:
    - molality
    - molarity
    - grams per litre
    - normality
    answer: molality
    difficulty: 2
    hints:
    - Volume changes with T.
    - Mass doesn't.
    solution: Molality uses mass of solvent, so it doesn't change.
    mistakes: {"molarity": "c11_molality", "grams per litre": "c11_molality", "normality": "c11_molality"}
