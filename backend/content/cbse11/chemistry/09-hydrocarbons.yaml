# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-chem
chapter: 9
title: Hydrocarbons
tips:
  c11c_markov: 'Markovnikov: in HX addition, H goes to the carbon that already has more hydrogens. Peroxide reverses this only for HBr.'
  c11c_huckel: "Aromatic rings have (4n + 2) π electrons. Benzene has 6 π electrons: set 4n + 2 = 6 and solve for n."
  c11_alkane: "Alkanes are CₙH₂ₙ₊₂."
  c11_alkyne: "Alkynes are CₙH₂ₙ₋₂."
  c11_aromatic_sub: "Addition would destroy the stable aromatic ring. So benzene swaps an H instead."
  c11_benzene_pi: "Benzene has three C=C double bonds in the Kekulé structure; each π bond has 2 electrons."
  c11_bromine_test: "Both burn. The C=C double bond adds bromine across it, removing the orange colour."
  c11_friedel: "Friedel–Crafts needs a Lewis acid that must be kept dry."
  c11_hybrid_triple: "A triple-bonded carbon has two electron groups: a linear molecule."
  c11_meta: "Electron-withdrawing groups deactivate the ring and direct meta. Which group pulls electrons away?"
  c11_nitronium: "The electrophile must be positive. HNO₃ + H₂SO₄ make it."
  c11_staggered: "Look along the C–C bond. In which form are the H atoms on the front and back carbons furthest apart, with least repulsion?"
concepts:
- code: cbse11c.hc.aliphatic
  title: Alkanes, alkenes and alkynes
  notes: |
    Alkanes CₙH₂ₙ₊₂ (saturated, sp³): preparation (hydrogenation, Wurtz, decarboxylation); free-radical halogenation,
    combustion; conformations of ethane (staggered more stable than eclipsed; Newman projections). Alkenes CₙH₂ₙ (sp², C=C,
    geometrical isomerism cis/trans): electrophilic addition of H₂, X₂, HX (Markovnikov's rule; anti-Markovnikov with HBr
    and peroxide), ozonolysis, polymerisation; bromine water decolourised. Alkynes CₙH₂ₙ₋₂ (sp, C≡C, linear): acidic H in
    ethyne, addition reactions, from calcium carbide.
  explanations:
    text: Hydrocarbons contain only carbon and hydrogen. Alkanes have only single bonds and are fairly unreactive; alkenes have a double bond and alkynes a triple bond, which add other atoms across them easily.
    visual: 'Draw propene and add HBr: the H joins the end carbon (which already has more H), the Br joins the middle carbon, giving 2-bromopropane. That''s Markovnikov''s rule.'
    step_by_step: 'Step 1: Use the formula to tell the family (CₙH₂ₙ₊₂, CₙH₂ₙ, CₙH₂ₙ₋₂). Step 2: Alkenes and alkynes undergo addition. Step 3: Apply Markovnikov''s rule for HX.'
    real_world: LPG is mostly propane and butane, alkanes that burn cleanly to give heat.
  picture:
    kind: compare
    columns:
    - title: Family
      points:
      - alkane
      - alkene
      - alkyne
    - title: General formula
      points:
      - CₙH₂ₙ₊₂
      - CₙH₂ₙ
      - CₙH₂ₙ₋₂
    - title: Bond
      points:
      - C–C
      - C=C
      - C≡C
    alt: Alkanes, alkenes and alkynes with their general formulae and carbon–carbon bonds.
  activity:
    type: sort
    prompt: 'Open-chain hydrocarbons: alkanes are CₙH₂ₙ₊₂, alkenes CₙH₂ₙ (one C=C), alkynes CₙH₂ₙ₋₂ (one C≡C). Sort each formula.'
    bins:
    - Alkane
    - Alkene
    - Alkyne
    items:
    - label: C₄H₁₀
      bin: Alkane
      clue: n = 4. Is 10 equal to 2n + 2, 2n or 2n − 2?
      why: '2 × 4 + 2 = 10: saturated, so an alkane (butane).'
    - label: CH₄
      bin: Alkane
      clue: n = 1. Which rule gives 4?
      why: '2 × 1 + 2 = 4: methane, an alkane.'
    - label: C₆H₁₄
      bin: Alkane
      clue: n = 6. What is 2n + 2?
      why: '2 × 6 + 2 = 14: hexane, an alkane.'
    - label: C₃H₆ (open chain)
      bin: Alkene
      clue: n = 3. Is 6 equal to 2n?
      why: '2 × 3 = 6: two H fewer than the alkane, so one C=C: propene.'
    - label: C₅H₁₀ (open chain)
      bin: Alkene
      clue: n = 5. Which rule gives 10?
      why: '2 × 5 = 10: one double bond, an alkene.'
    - label: C₂H₄
      bin: Alkene
      clue: n = 2. Compare 4 with 2n + 2 = 6.
      why: 'Two H fewer than ethane: ethene, with one C=C.'
    - label: C₂H₂
      bin: Alkyne
      clue: n = 2. Which rule gives 2?
      why: '2 × 2 − 2 = 2: four H fewer than ethane, a triple bond: ethyne.'
    - label: C₃H₄ (one triple bond)
      bin: Alkyne
      clue: n = 3. What is 2n − 2?
      why: '2 × 3 − 2 = 4: propyne.'
    - label: C₄H₆ (one triple bond)
      bin: Alkyne
      clue: n = 4. Which rule gives 6?
      why: '2 × 4 − 2 = 6: a butyne.'
  items:
  - prompt: How many hydrogen atoms are in an alkane with 5 carbons?
    answer: '12'
    check: 2*5+2
    difficulty: 1
    hints:
    - CₙH₂ₙ₊₂.
    - 2 × 5 + 2.
    solution: 12 (pentane, C₅H₁₂).
    mistakes: {"10": "c11_alkane", "8": "c11_alkane", "5": "c11_alkane"}
  - prompt: How many hydrogen atoms are in an alkyne with 4 carbons?
    answer: '6'
    check: 2*4-2
    difficulty: 1
    hints:
    - CₙH₂ₙ₋₂.
    - 8 − 2.
    solution: 6 (butyne, C₄H₆).
    mistakes: {"8": "c11_alkyne", "10": "c11_alkyne", "4": "c11_alkyne"}
  - prompt: 'Propene + HBr (no peroxide) gives mainly:'
    options:
    - 2-bromopropane
    - 1-bromopropane
    - propane
    - 1,2-dibromopropane
    answer: 2-bromopropane
    difficulty: 2
    hints:
    - Markovnikov.
    - Br to the middle carbon.
    solution: 2-bromopropane.
    mistakes:
      1-bromopropane: c11c_markov
  - prompt: Which conformation of ethane is more stable?
    options:
    - staggered
    - eclipsed
    - both equal
    - neither exists
    answer: staggered
    difficulty: 2
    hints:
    - H atoms farther apart.
    - Less repulsion.
    solution: Staggered.
    mistakes: {"eclipsed": "c11_staggered", "both equal": "c11_staggered", "neither exists": "c11_staggered"}
  - prompt: 'A test that tells an alkene from an alkane is:'
    options:
    - bromine water is decolourised
    - it burns
    - it dissolves in water
    - it turns litmus red
    answer: bromine water is decolourised
    difficulty: 1
    hints:
    - Addition of Br₂.
    - Orange to colourless.
    solution: Alkenes decolourise bromine water.
    mistakes: {"it burns": "c11_bromine_test", "it dissolves in water": "c11_bromine_test", "it turns litmus red": "c11_bromine_test"}
  - prompt: 'The carbon atoms in ethyne are:'
    options:
    - sp hybridised
    - sp² hybridised
    - sp³ hybridised
    - not hybridised
    answer: sp hybridised
    difficulty: 1
    hints:
    - Triple bond.
    - Linear.
    solution: sp.
    mistakes: {"sp² hybridised": "c11_hybrid_triple", "sp³ hybridised": "c11_hybrid_triple", "not hybridised": "c11_hybrid_triple"}
- code: cbse11c.hc.aromatic
  title: Aromatic hydrocarbons
  after:
  - cbse11c.hc.aliphatic
  notes: |
    Benzene C₆H₆: Kekulé structures; resonance; all C–C bonds equal (139 pm); sp²; delocalised π electrons. Aromaticity
    (Hückel's rule): planar, cyclic, conjugated, (4n + 2) π electrons. Electrophilic substitution (not addition):
    nitration (conc. HNO₃ + H₂SO₄ → NO₂⁺), halogenation (FeCl₃), sulfonation, Friedel–Crafts alkylation and acylation
    (AlCl₃). Directive influence: ortho/para directors (–OH, –NH₂, –CH₃, halogens) and meta directors (–NO₂, –CHO, –COOH).
    Carcinogenicity and toxicity of some polynuclear hydrocarbons.
  explanations:
    text: Benzene is a ring of six carbons whose π electrons are shared around the whole ring, which makes it unusually stable. So benzene prefers substitution, swapping an H for another group, rather than addition, which would break the ring's special stability.
    visual: 'Draw benzene as a hexagon with a circle inside: the circle shows six π electrons spread evenly round the ring.'
    step_by_step: 'Step 1: Check aromaticity with Hückel''s rule (4n + 2 π electrons). Step 2: Benzene reacts by electrophilic substitution. Step 3: An existing group decides where the next one goes (o/p or m).'
    real_world: Some smoke from burning coal and tobacco contains polynuclear aromatic hydrocarbons, which can cause cancer.
  picture:
    kind: flow
    steps:
    - Make electrophile (e.g. NO₂⁺)
    - Electrophile attacks the ring
    - Carbocation intermediate
    - H⁺ lost, ring restored
    alt: 'Electrophilic substitution in benzene: the electrophile attacks, a carbocation forms, then H⁺ leaves and the ring is restored.'
  activity:
    type: sort
    prompt: 'Hückel''s rule: a ring is aromatic if it is flat, fully conjugated and has (4n + 2) π electrons: 2, 6, 10 …'
    bins:
    - Aromatic
    - Not aromatic
    items:
    - label: Benzene, C₆H₆
      bin: Aromatic
      clue: How many π electrons do its three C=C give?
      why: 6 π electrons (n = 1) in a flat ring of sp² carbons.
    - label: Cyclobutadiene
      bin: Not aromatic
      clue: Count the π electrons. Is 4 a number of the form 4n + 2?
      why: '4 π electrons fails the rule: it is antiaromatic and very unstable.'
    - label: Cyclopentadienyl anion, C₅H₅⁻
      bin: Aromatic
      clue: Two C=C give 4 π electrons. What does the extra lone pair add?
      why: 4 + 2 = 6 π electrons, spread around a flat ring.
    - label: Cyclopentadiene, C₅H₆
      bin: Not aromatic
      clue: One ring carbon has two H. Is it sp² or sp³?
      why: The CH₂ carbon is sp³ and breaks the ring of p orbitals.
    - label: Tropylium cation, C₇H₇⁺
      bin: Aromatic
      clue: Three C=C and an empty p orbital. How many π electrons?
      why: 6 π electrons over 7 flat, conjugated carbons.
    - label: Cyclooctatetraene
      bin: Not aromatic
      clue: '8 π electrons: fits 4n + 2? Is the ring flat?'
      why: 8 doesn't fit 4n + 2, and the ring folds into a tub, so it isn't aromatic.
    - label: Naphthalene
      bin: Aromatic
      clue: Two fused rings with five C=C. How many π electrons?
      why: 10 π electrons (n = 2) in a flat system.
    - label: Cyclohexene
      bin: Not aromatic
      clue: Only one C=C. Is the ring fully conjugated?
      why: Most ring carbons are sp³; there's no ring of p orbitals.
    - label: Pyridine, C₅H₅N
      bin: Aromatic
      clue: Like benzene with one N. How many π electrons?
      why: 6 π electrons; the N's lone pair points outward and isn't part of them.
  items:
  - prompt: How many π electrons does benzene have?
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - Three double bonds.
    - 2 each.
    solution: '6.'
    mistakes: {"3": "c11_benzene_pi", "12": "c11_benzene_pi", "2": "c11_benzene_pi"}
  - prompt: In Hückel's rule 4n + 2, what is n for benzene?
    answer: '1'
    check: (6-2)/4
    difficulty: 2
    hints:
    - 4n + 2 = 6.
    - n = 1.
    solution: n = 1.
    mistakes:
      '6': c11c_huckel
  - prompt: 'Benzene mainly undergoes:'
    options:
    - electrophilic substitution
    - electrophilic addition
    - nucleophilic addition
    - elimination
    answer: electrophilic substitution
    difficulty: 1
    hints:
    - Keeps the aromatic ring.
    - Swaps H.
    solution: Electrophilic substitution.
    mistakes: {"electrophilic addition": "c11_aromatic_sub", "nucleophilic addition": "c11_aromatic_sub", "elimination": "c11_aromatic_sub"}
  - prompt: 'The electrophile in the nitration of benzene is:'
    options:
    - NO₂⁺
    - NO₃⁻
    - HNO₃
    - H⁺
    answer: NO₂⁺
    difficulty: 2
    hints:
    - Nitronium ion.
    - From HNO₃ + H₂SO₄.
    solution: The nitronium ion, NO₂⁺.
    mistakes: {"NO₃⁻": "c11_nitronium", "HNO₃": "c11_nitronium", "H⁺": "c11_nitronium"}
  - prompt: Which group directs incoming groups to the meta position?
    options:
    - –NO₂
    - –OH
    - –CH₃
    - –NH₂
    answer: –NO₂
    difficulty: 2
    hints:
    - Electron-withdrawing.
    - Deactivating.
    solution: –NO₂ is a meta director.
    mistakes: {"–OH": "c11_meta", "–CH₃": "c11_meta", "–NH₂": "c11_meta"}
  - prompt: Friedel–Crafts alkylation uses which catalyst?
    options:
    - anhydrous AlCl₃
    - Ni
    - H₂SO₄ only
    - Pt
    answer: anhydrous AlCl₃
    difficulty: 2
    hints:
    - Lewis acid.
    - Aluminium chloride.
    solution: Anhydrous AlCl₃.
    mistakes: {"Ni": "c11_friedel", "H₂SO₄ only": "c11_friedel", "Pt": "c11_friedel"}
