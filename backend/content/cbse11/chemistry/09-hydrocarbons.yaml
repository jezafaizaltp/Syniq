# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-chem
chapter: 9
title: Hydrocarbons
tips:
  c11c_markov: 'Markovnikov: in HX addition, H goes to the carbon that already has more hydrogens. Peroxide reverses this only for HBr.'
  c11c_huckel: 'Aromatic: cyclic, planar, fully conjugated, with (4n + 2) π electrons. Benzene has 6 (n = 1).'
concepts:
- code: cbse11c.hc.aliphatic
  title: Alkanes, alkenes and alkynes
  notes: |
    Alkanes CₙH₂ₙ₊₂ (saturated, sp³): preparation (hydrogenation, Wurtz, decarboxylation); free-radical halogenation,
    combustion; conformations of ethane (staggered more stable than eclipsed; Newman projections). Alkenes CₙH₂ₙ (sp², C=C,
    geometrical isomerism cis/trans): electrophilic addition of H₂, X₂, HX (Markovnikov's rule; anti-Markovnikov with HBr
    and peroxide), ozonolysis, polymerisation; bromine water decolourised. Alkynes CₙH₂ₙ₋₂ (sp, C≡C, linear): acidic H in
    ethyne, addition reactions, from calcium carbide.
  explanations:
    text: Hydrocarbons contain only carbon and hydrogen. Alkanes have only single bonds and are fairly unreactive; alkenes have a double bond and alkynes a triple bond, which add other atoms across them easily.
    visual: 'Draw propene and add HBr: the H joins the end carbon (which already has more H), the Br joins the middle carbon, giving 2-bromopropane. That''s Markovnikov''s rule.'
    step_by_step: 'Step 1: Use the formula to tell the family (CₙH₂ₙ₊₂, CₙH₂ₙ, CₙH₂ₙ₋₂). Step 2: Alkenes and alkynes undergo addition. Step 3: Apply Markovnikov''s rule for HX.'
    real_world: LPG is mostly propane and butane, alkanes that burn cleanly to give heat.
  picture:
    kind: compare
    columns:
    - title: Family
      points:
      - alkane
      - alkene
      - alkyne
    - title: General formula
      points:
      - CₙH₂ₙ₊₂
      - CₙH₂ₙ
      - CₙH₂ₙ₋₂
    - title: Bond
      points:
      - C–C
      - C=C
      - C≡C
    alt: Alkanes, alkenes and alkynes with their general formulae and carbon–carbon bonds.
  items:
  - prompt: How many hydrogen atoms are in an alkane with 5 carbons?
    answer: '12'
    check: 2*5+2
    difficulty: 1
    hints:
    - CₙH₂ₙ₊₂.
    - 2 × 5 + 2.
    solution: 12 (pentane, C₅H₁₂).
  - prompt: How many hydrogen atoms are in an alkyne with 4 carbons?
    answer: '6'
    check: 2*4-2
    difficulty: 1
    hints:
    - CₙH₂ₙ₋₂.
    - 8 − 2.
    solution: 6 (butyne, C₄H₆).
  - prompt: 'Propene + HBr (no peroxide) gives mainly:'
    options:
    - 2-bromopropane
    - 1-bromopropane
    - propane
    - 1,2-dibromopropane
    answer: 2-bromopropane
    difficulty: 2
    hints:
    - Markovnikov.
    - Br to the middle carbon.
    solution: 2-bromopropane.
    mistakes:
      1-bromopropane: c11c_markov
  - prompt: Which conformation of ethane is more stable?
    options:
    - staggered
    - eclipsed
    - both equal
    - neither exists
    answer: staggered
    difficulty: 2
    hints:
    - H atoms farther apart.
    - Less repulsion.
    solution: Staggered.
  - prompt: 'A test that tells an alkene from an alkane is:'
    options:
    - bromine water is decolourised
    - it burns
    - it dissolves in water
    - it turns litmus red
    answer: bromine water is decolourised
    difficulty: 1
    hints:
    - Addition of Br₂.
    - Orange to colourless.
    solution: Alkenes decolourise bromine water.
  - prompt: 'The carbon atoms in ethyne are:'
    options:
    - sp hybridised
    - sp² hybridised
    - sp³ hybridised
    - not hybridised
    answer: sp hybridised
    difficulty: 1
    hints:
    - Triple bond.
    - Linear.
    solution: sp.
- code: cbse11c.hc.aromatic
  title: Aromatic hydrocarbons
  after:
  - cbse11c.hc.aliphatic
  notes: |
    Benzene C₆H₆: Kekulé structures; resonance; all C–C bonds equal (139 pm); sp²; delocalised π electrons. Aromaticity
    (Hückel's rule): planar, cyclic, conjugated, (4n + 2) π electrons. Electrophilic substitution (not addition):
    nitration (conc. HNO₃ + H₂SO₄ → NO₂⁺), halogenation (FeCl₃), sulfonation, Friedel–Crafts alkylation and acylation
    (AlCl₃). Directive influence: ortho/para directors (–OH, –NH₂, –CH₃, halogens) and meta directors (–NO₂, –CHO, –COOH).
    Carcinogenicity and toxicity of some polynuclear hydrocarbons.
  explanations:
    text: Benzene is a ring of six carbons whose π electrons are shared around the whole ring, which makes it unusually stable. So benzene prefers substitution, swapping an H for another group, rather than addition, which would break the ring's special stability.
    visual: 'Draw benzene as a hexagon with a circle inside: the circle shows six π electrons spread evenly round the ring.'
    step_by_step: 'Step 1: Check aromaticity with Hückel''s rule (4n + 2 π electrons). Step 2: Benzene reacts by electrophilic substitution. Step 3: An existing group decides where the next one goes (o/p or m).'
    real_world: Some smoke from burning coal and tobacco contains polynuclear aromatic hydrocarbons, which can cause cancer.
  picture:
    kind: flow
    steps:
    - Make electrophile (e.g. NO₂⁺)
    - Electrophile attacks the ring
    - Carbocation intermediate
    - H⁺ lost, ring restored
    alt: 'Electrophilic substitution in benzene: the electrophile attacks, a carbocation forms, then H⁺ leaves and the ring is restored.'
  items:
  - prompt: How many π electrons does benzene have?
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - Three double bonds.
    - 2 each.
    solution: '6.'
  - prompt: In Hückel's rule 4n + 2, what is n for benzene?
    answer: '1'
    check: (6-2)/4
    difficulty: 2
    hints:
    - 4n + 2 = 6.
    - n = 1.
    solution: n = 1.
    mistakes:
      '6': c11c_huckel
  - prompt: 'Benzene mainly undergoes:'
    options:
    - electrophilic substitution
    - electrophilic addition
    - nucleophilic addition
    - elimination
    answer: electrophilic substitution
    difficulty: 1
    hints:
    - Keeps the aromatic ring.
    - Swaps H.
    solution: Electrophilic substitution.
  - prompt: 'The electrophile in the nitration of benzene is:'
    options:
    - NO₂⁺
    - NO₃⁻
    - HNO₃
    - H⁺
    answer: NO₂⁺
    difficulty: 2
    hints:
    - Nitronium ion.
    - From HNO₃ + H₂SO₄.
    solution: The nitronium ion, NO₂⁺.
  - prompt: Which group directs incoming groups to the meta position?
    options:
    - –NO₂
    - –OH
    - –CH₃
    - –NH₂
    answer: –NO₂
    difficulty: 2
    hints:
    - Electron-withdrawing.
    - Deactivating.
    solution: –NO₂ is a meta director.
  - prompt: Friedel–Crafts alkylation uses which catalyst?
    options:
    - anhydrous AlCl₃
    - Ni
    - H₂SO₄ only
    - Pt
    answer: anhydrous AlCl₃
    difficulty: 2
    hints:
    - Lewis acid.
    - Aluminium chloride.
    solution: Anhydrous AlCl₃.
