# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-chem
chapter: 9
title: Hydrocarbons
tips:
  c11c_markov: 'Markovnikov: in HX addition, H goes to the carbon that already has more hydrogens. Peroxide reverses this only for HBr.'
  c11c_huckel: "Aromatic rings have (4n + 2) π electrons. Benzene has 6 π electrons: set 4n + 2 = 6 and solve for n."
  c11_alkane: "Alkanes are CₙH₂ₙ₊₂."
  c11_alkyne: "Alkynes are CₙH₂ₙ₋₂."
  c11_aromatic_sub: "Addition would destroy the stable aromatic ring. So benzene swaps an H instead."
  c11_benzene_pi: "Benzene has three C=C double bonds in the Kekulé structure; each π bond has 2 electrons."
  c11_bromine_test: "Both burn. The C=C double bond adds bromine across it, removing the orange colour."
  c11_friedel: "Friedel–Crafts needs a Lewis acid that must be kept dry."
  c11_hybrid_triple: "A triple-bonded carbon has two electron groups: a linear molecule."
  c11_meta: "Electron-withdrawing groups deactivate the ring and direct meta. Which group pulls electrons away?"
  c11_nitronium: "The electrophile must be positive. HNO₃ + H₂SO₄ make it."
  c11_staggered: "Look along the C–C bond. In which form are the H atoms on the front and back carbons furthest apart, with least repulsion?"
  c11c09_formula: Alkanes CₙH₂ₙ₊₂, alkenes CₙH₂ₙ, alkynes CₙH₂ₙ₋₂. Put n in carefully.
  c11c09_add: 'Markovnikov: in HX addition, H goes to the double-bond carbon that already has more H. With HBr and peroxide it is the other way.'
  c11c09_arom: Benzene keeps its ring and swaps an H in electrophilic substitution. –OH, –NH₂, –CH₃ and halogens send new groups ortho/para; –NO₂, –CHO, –COOH send them meta.
concepts:
- code: cbse11c.hc.aliphatic
  title: Alkanes, alkenes and alkynes
  notes: |
    Alkanes CₙH₂ₙ₊₂ (saturated, sp³): preparation (hydrogenation, Wurtz, decarboxylation); free-radical halogenation,
    combustion; conformations of ethane (staggered more stable than eclipsed; Newman projections). Alkenes CₙH₂ₙ (sp², C=C,
    geometrical isomerism cis/trans): electrophilic addition of H₂, X₂, HX (Markovnikov's rule; anti-Markovnikov with HBr
    and peroxide), ozonolysis, polymerisation; bromine water decolourised. Alkynes CₙH₂ₙ₋₂ (sp, C≡C, linear): acidic H in
    ethyne, addition reactions, from calcium carbide.
  explanations:
    text: Hydrocarbons contain only carbon and hydrogen. Alkanes have only single bonds and are fairly unreactive; alkenes have a double bond and alkynes a triple bond, which add other atoms across them easily.
    visual: 'Draw propene and add HBr: the H joins the end carbon (which already has more H), the Br joins the middle carbon, giving 2-bromopropane. That''s Markovnikov''s rule.'
    step_by_step: 'Step 1: Use the formula to tell the family (CₙH₂ₙ₊₂, CₙH₂ₙ, CₙH₂ₙ₋₂). Step 2: Alkenes and alkynes undergo addition. Step 3: Apply Markovnikov''s rule for HX.'
    real_world: LPG is mostly propane and butane, alkanes that burn cleanly to give heat.
  picture:
    kind: compare
    columns:
    - title: Family
      points:
      - alkane
      - alkene
      - alkyne
    - title: General formula
      points:
      - CₙH₂ₙ₊₂
      - CₙH₂ₙ
      - CₙH₂ₙ₋₂
    - title: Bond
      points:
      - C–C
      - C=C
      - C≡C
    alt: Alkanes, alkenes and alkynes with their general formulae and carbon–carbon bonds.
  activity:
    type: sort
    prompt: 'Open-chain hydrocarbons: alkanes are CₙH₂ₙ₊₂, alkenes CₙH₂ₙ (one C=C), alkynes CₙH₂ₙ₋₂ (one C≡C). Sort each formula.'
    bins:
    - Alkane
    - Alkene
    - Alkyne
    items:
    - label: C₄H₁₀
      bin: Alkane
      clue: n = 4. Is 10 equal to 2n + 2, 2n or 2n − 2?
      why: '2 × 4 + 2 = 10: saturated, so an alkane (butane).'
    - label: CH₄
      bin: Alkane
      clue: n = 1. Which rule gives 4?
      why: '2 × 1 + 2 = 4: methane, an alkane.'
    - label: C₆H₁₄
      bin: Alkane
      clue: n = 6. What is 2n + 2?
      why: '2 × 6 + 2 = 14: hexane, an alkane.'
    - label: C₃H₆ (open chain)
      bin: Alkene
      clue: n = 3. Is 6 equal to 2n?
      why: '2 × 3 = 6: two H fewer than the alkane, so one C=C: propene.'
    - label: C₅H₁₀ (open chain)
      bin: Alkene
      clue: n = 5. Which rule gives 10?
      why: '2 × 5 = 10: one double bond, an alkene.'
    - label: C₂H₄
      bin: Alkene
      clue: n = 2. Compare 4 with 2n + 2 = 6.
      why: 'Two H fewer than ethane: ethene, with one C=C.'
    - label: C₂H₂
      bin: Alkyne
      clue: n = 2. Which rule gives 2?
      why: '2 × 2 − 2 = 2: four H fewer than ethane, a triple bond: ethyne.'
    - label: C₃H₄ (one triple bond)
      bin: Alkyne
      clue: n = 3. What is 2n − 2?
      why: '2 × 3 − 2 = 4: propyne.'
    - label: C₄H₆ (one triple bond)
      bin: Alkyne
      clue: n = 4. Which rule gives 6?
      why: '2 × 4 − 2 = 6: a butyne.'
  lesson:
    - teach: Alkanes (CₙH₂ₙ₊₂) have only single bonds; they burn and undergo free-radical substitution with chlorine in light. Ethane's staggered conformation is more stable than eclipsed.
      check:
        prompt: Formula of propane?
        options:
        - C₃H₈
        - C₃H₆
        - C₃H₄
        answer: C₃H₈
        why: 'n = 3: 2n + 2 = 8.'
      ways:
      - style: visual
        teach: 'Three-carbon hydrocarbons: one, two or three bonds between carbons change the formula.'
        picture:
          kind: compare
          columns:
          - title: Alkane CₙH₂ₙ₊₂
            points:
            - propane C₃H₈
            - C–C single
            - sp³
          - title: Alkene CₙH₂ₙ
            points:
            - propene C₃H₆
            - one C=C
            - sp²
          - title: Alkyne CₙH₂ₙ₋₂
            points:
            - propyne C₃H₄
            - one C≡C
            - sp
          alt: Propane C3H8 has only single bonds, propene C3H6 has one double bond, and propyne C3H4 has one triple bond; each extra bond removes two hydrogens.
      - style: step_by_step
        teach: 'Step 1 (initiation): light splits Cl₂ into 2Cl•. Step 2 (propagation): Cl• takes an H from CH₄, giving •CH₃; •CH₃ takes a Cl from Cl₂, making CH₃Cl and a new Cl•. Step 3 (termination): two radicals join and the chain stops.'
    - teach: 'Alkenes (CₙH₂ₙ, C=C, sp²) add things across the double bond. With HX, Markovnikov''s rule: the H joins the carbon that already has more H. With HBr and peroxide the addition reverses (anti-Markovnikov). Alkenes decolourise bromine water.'
      check:
        prompt: 'Propene + HCl gives mainly:'
        options:
        - 2-chloropropane
        - 1-chloropropane
        - propane
        answer: 2-chloropropane
        why: H to the CH₂ end, Cl to the middle carbon.
      ways:
      - style: visual
        teach: 'Markovnikov addition of HBr to but-1-ene: H goes to the CH₂ end.'
        picture:
          kind: flow
          steps:
          - CH₂=CH–CH₂CH₃ + HBr
          - H⁺ adds to C1 (it has more H)
          - Secondary carbocation on C2
          - 'Br⁻ joins C2: 2-bromobutane'
          alt: H plus adds to the end carbon that already has more hydrogens, making a more stable secondary carbocation on carbon 2, where bromide then attaches to give 2-bromobutane.
      - style: real_world
        teach: 'A handy way to remember Markovnikov: ''the rich get richer''. The carbon already holding more hydrogens gets the new hydrogen too. Peroxides flip this for HBr only, because the reaction then goes through radicals instead of ions.'
    - teach: Alkynes (CₙH₂ₙ₋₂, C≡C, sp, linear) also add across the bond. Ethyne's H is weakly acidic. Ethyne is made from calcium carbide and water.
      picture:
        kind: compare
        columns:
        - title: Family
          points:
          - alkane
          - alkene
          - alkyne
        - title: Formula and bond
          points:
          - CₙH₂ₙ₊₂, C–C
          - CₙH₂ₙ, C=C
          - CₙH₂ₙ₋₂, C≡C
        alt: Hydrocarbon families.
      check:
        prompt: Hybridisation of carbon in ethene?
        options:
        - sp²
        - sp
        - sp³
        answer: sp²
        why: Double-bonded carbon.
      ways:
      - style: step_by_step
        teach: 'Step 1: An alkyne can add twice across its triple bond. Step 2: Ethyne + Br₂ → 1,2-dibromoethene; + another Br₂ → 1,1,2,2-tetrabromoethane. Step 3: The sp carbons hold the C–H electrons tightly, so ethyne''s H can be removed by a strong base like NaNH₂.'
      - style: real_world
        teach: 'Gas welders burn ethyne (acetylene) with oxygen: the flame reaches about 3000 °C, hot enough to cut steel. Old miners'' lamps made their own ethyne by dripping water onto calcium carbide and burning the gas.'
  items:
  - prompt: How many hydrogen atoms are in an alkane with 5 carbons?
    answer: '12'
    check: 2*5+2
    difficulty: 1
    hints:
    - CₙH₂ₙ₊₂.
    - 2 × 5 + 2.
    solution: "Alkanes are CₙH₂ₙ₊₂: 2 × 5 + 2 = 12 (pentane, C₅H₁₂)."
    mistakes: {"10": "c11_alkane", "8": "c11_alkane", "5": "c11_alkane"}
  - prompt: How many hydrogen atoms are in an alkyne with 4 carbons?
    answer: '6'
    check: 2*4-2
    difficulty: 1
    hints:
    - CₙH₂ₙ₋₂.
    - 8 − 2.
    solution: "Alkynes are CₙH₂ₙ₋₂: 2 × 4 − 2 = 6 (butyne, C₄H₆)."
    mistakes: {"8": "c11_alkyne", "10": "c11_alkyne", "4": "c11_alkyne"}
  - prompt: 'Propene + HBr (no peroxide) gives mainly:'
    options:
    - 2-bromopropane
    - 1-bromopropane
    - propane
    - 1,2-dibromopropane
    answer: 2-bromopropane
    difficulty: 2
    hints:
    - Markovnikov.
    - Br to the middle carbon.
    solution: "Markovnikov's rule: H goes to the carbon that already has more H, Br to the middle carbon, giving 2-bromopropane."
    mistakes:
      1-bromopropane: c11c_markov
  - prompt: Which conformation of ethane is more stable?
    options:
    - staggered
    - eclipsed
    - both equal
    - neither exists
    answer: staggered
    difficulty: 2
    hints:
    - H atoms farther apart.
    - Less repulsion.
    solution: "In the staggered form the C–H bonds are as far apart as possible, so repulsion is least."
    mistakes: {"eclipsed": "c11_staggered", "both equal": "c11_staggered", "neither exists": "c11_staggered"}
  - prompt: 'A test that tells an alkene from an alkane is:'
    options:
    - "bromine water is decolourised"
    - "it burns in air with a flame"
    - "it dissolves easily in water"
    - "it turns blue litmus paper red"
    answer: bromine water is decolourised
    difficulty: 1
    hints:
    - Addition of Br₂.
    - Orange to colourless.
    solution: "Bromine adds across the C=C double bond, so the orange colour disappears; alkanes do not react."
    mistakes: {"it burns in air with a flame": "c11_bromine_test", "it dissolves easily in water": "c11_bromine_test", "it turns blue litmus paper red": "c11_bromine_test"}
  - prompt: 'The carbon atoms in ethyne are:'
    options:
    - sp hybridised
    - sp² hybridised
    - sp³ hybridised
    - not hybridised
    answer: sp hybridised
    difficulty: 1
    hints:
    - Triple bond.
    - Linear.
    solution: "Each C forms 2 σ bonds (1 H, 1 C) and 2 π bonds, so it is sp hybridised (linear, 180°)."
    mistakes: {"sp² hybridised": "c11_hybrid_triple", "sp³ hybridised": "c11_hybrid_triple", "not hybridised": "c11_hybrid_triple"}
  - prompt: How many H atoms are in an alkene with 6 carbons?
    answer: '12'
    check: 2*6
    difficulty: 1
    hints:
    - Alkenes are CₙH₂ₙ.
    - n = 6.
    solution: 'Step 1: 2 × 6. Step 2: 12.'
    mistakes:
      '14': c11c09_formula
      '10': c11c09_formula
  - prompt: Which hydrocarbon decolourises bromine water?
    options:
    - ethene
    - ethane
    - methane
    answer: ethene
    difficulty: 1
    hints:
    - Bromine adds across a multiple bond.
    - Which one has C=C?
    solution: 'Step 1: ethene has a double bond. Step 2: it adds Br₂.'
    mistakes:
      ethane: c11c09_add
      methane: c11c09_add
  - prompt: 'Ethyne is prepared from water and:'
    options:
    - calcium carbide
    - calcium carbonate
    - sodium chloride
    answer: calcium carbide
    difficulty: 1
    hints:
    - The reagent contains C₂²⁻.
    - CaC₂.
    solution: 'Step 1: CaC₂ + 2H₂O → C₂H₂ + Ca(OH)₂. Step 2: calcium carbide.'
    mistakes:
      calcium carbonate: c11c09_formula
      sodium chloride: c11c09_formula
  - prompt: 'Propene + HBr in the presence of peroxide gives mainly:'
    options:
    - 1-bromopropane
    - 2-bromopropane
    - 1,2-dibromopropane
    answer: 1-bromopropane
    difficulty: 2
    hints:
    - Peroxide reverses Markovnikov.
    - Br goes to the end carbon.
    solution: 'Step 1: anti-Markovnikov (peroxide effect). Step 2: 1-bromopropane.'
    mistakes:
      2-bromopropane: c11c09_add
      1,2-dibromopropane: c11c09_add
  - prompt: How many moles of H₂ are needed to turn 1 mol of ethyne into ethane?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - C≡C → C=C → C–C.
    - Each step adds one H₂.
    solution: 'Step 1: two π bonds. Step 2: 2 mol H₂.'
    mistakes:
      '1': c11c09_add
      '3': c11c09_add
  - prompt: 'Chlorination of methane in sunlight goes by:'
    options:
    - free-radical substitution
    - electrophilic addition
    - nucleophilic substitution
    answer: free-radical substitution
    difficulty: 2
    hints:
    - Light splits Cl₂ homolytically.
    - H is replaced by Cl.
    solution: 'Step 1: Cl• radicals form. Step 2: free-radical substitution.'
    mistakes:
      electrophilic addition: c11c09_add
      nucleophilic substitution: c11c09_add
  - prompt: 'Ozonolysis of but-2-ene gives two molecules of:'
    options:
    - ethanal
    - methanal
    - propanone
    answer: ethanal
    difficulty: 2
    hints:
    - Ozonolysis cuts the C=C and makes C=O on each side.
    - Each half has 2 carbons.
    solution: 'Step 1: CH₃CH=CHCH₃ splits into two CH₃CHO. Step 2: ethanal.'
    mistakes:
      methanal: c11c09_add
      propanone: c11c09_add
  - prompt: 'Sodium + CH₃Br (Wurtz reaction) gives:'
    options:
    - ethane
    - methane
    - propane
    answer: ethane
    difficulty: 3
    hints:
    - Wurtz joins two alkyl groups.
    - Two methyls make which alkane?
    solution: 'Step 1: 2CH₃Br + 2Na → CH₃–CH₃. Step 2: ethane.'
    mistakes:
      methane: c11c09_formula
      propane: c11c09_formula
  - prompt: Why is ethyne more acidic than ethane?
    options:
    - "its carbon is sp, with more s character"
    - "it has more hydrogen atoms per molecule"
    - "it is a gas at room temperature and pressure"
    answer: its carbon is sp, with more s character
    difficulty: 3
    hints:
    - Compare sp (50% s) with sp³ (25% s).
    - More s character holds electrons closer.
    solution: 'Step 1: sp carbon is more electronegative. Step 2: its C–H gives up H⁺ more easily.'
    mistakes:
      "it has more hydrogen atoms per molecule": c11c09_formula
      "it is a gas at room temperature and pressure": c11c09_formula
  - prompt: 'Assertion (A): Alkenes decolourise bromine water but alkanes do not.

      Reason (R): Alkenes have a C=C double bond across which bromine can add.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Bromine adds across the double bond, using up the orange bromine; alkanes have no such bond, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A gas X decolourises bromine water. 1 mol of X adds 2 mol of H₂ to form propane. What is X?'
    options:
    - Propyne
    - Propene
    - Propane
    answer: Propyne
    hints:
    - Adding 2 mol H₂ means two π bonds.
    - Which three-carbon compound has a triple bond?
    solution: 'Two π bonds need 2 mol H₂: X is propyne, CH₃C≡CH.'
    mistakes:
      Propene: c11_alkyne
      Propane: c11_bromine_test
    exam: case
    difficulty: 2
  - prompt: What is the main product when HCl adds to propene?
    options:
    - 2-Chloropropane
    - 1-Chloropropane
    - 1,2-Dichloropropane
    answer: 2-Chloropropane
    hints:
    - Use Markovnikov's rule.
    - Which carbon has more H to start with?
    solution: 'H goes to the CH₂ end (C1), Cl to C2: 2-chloropropane.'
    mistakes:
      1-Chloropropane: c11c_markov
      1,2-Dichloropropane: c11c09_add
    exam: one_mark
    difficulty: 2
- code: cbse11c.hc.aromatic
  title: Aromatic hydrocarbons
  after:
  - cbse11c.hc.aliphatic
  notes: |
    Benzene C₆H₆: Kekulé structures; resonance; all C–C bonds equal (139 pm); sp²; delocalised π electrons. Aromaticity
    (Hückel's rule): planar, cyclic, conjugated, (4n + 2) π electrons. Electrophilic substitution (not addition):
    nitration (conc. HNO₃ + H₂SO₄ → NO₂⁺), halogenation (FeCl₃), sulfonation, Friedel–Crafts alkylation and acylation
    (AlCl₃). Directive influence: ortho/para directors (–OH, –NH₂, –CH₃, halogens) and meta directors (–NO₂, –CHO, –COOH).
    Carcinogenicity and toxicity of some polynuclear hydrocarbons.
  explanations:
    text: Benzene is a ring of six carbons whose π electrons are shared around the whole ring, which makes it unusually stable. So benzene prefers substitution, swapping an H for another group, rather than addition, which would break the ring's special stability.
    visual: 'Draw benzene as a hexagon with a circle inside: the circle shows six π electrons spread evenly round the ring.'
    step_by_step: 'Step 1: Check aromaticity with Hückel''s rule (4n + 2 π electrons). Step 2: Benzene reacts by electrophilic substitution. Step 3: An existing group decides where the next one goes (o/p or m).'
    real_world: Some smoke from burning coal and tobacco contains polynuclear aromatic hydrocarbons, which can cause cancer.
  picture:
    kind: flow
    steps:
    - Make electrophile (e.g. NO₂⁺)
    - Electrophile attacks the ring
    - Carbocation intermediate
    - H⁺ lost, ring restored
    alt: 'Electrophilic substitution in benzene: the electrophile attacks, a carbocation forms, then H⁺ leaves and the ring is restored.'
  activity:
    type: sort
    prompt: 'Hückel''s rule: a ring is aromatic if it is flat, fully conjugated and has (4n + 2) π electrons: 2, 6, 10 …'
    bins:
    - Aromatic
    - Not aromatic
    items:
    - label: Benzene, C₆H₆
      bin: Aromatic
      clue: How many π electrons do its three C=C give?
      why: 6 π electrons (n = 1) in a flat ring of sp² carbons.
    - label: Cyclobutadiene
      bin: Not aromatic
      clue: Count the π electrons. Is 4 a number of the form 4n + 2?
      why: '4 π electrons fails the rule: it is antiaromatic and very unstable.'
    - label: Cyclopentadienyl anion, C₅H₅⁻
      bin: Aromatic
      clue: Two C=C give 4 π electrons. What does the extra lone pair add?
      why: 4 + 2 = 6 π electrons, spread around a flat ring.
    - label: Cyclopentadiene, C₅H₆
      bin: Not aromatic
      clue: One ring carbon has two H. Is it sp² or sp³?
      why: The CH₂ carbon is sp³ and breaks the ring of p orbitals.
    - label: Tropylium cation, C₇H₇⁺
      bin: Aromatic
      clue: Three C=C and an empty p orbital. How many π electrons?
      why: 6 π electrons over 7 flat, conjugated carbons.
    - label: Cyclooctatetraene
      bin: Not aromatic
      clue: '8 π electrons: fits 4n + 2? Is the ring flat?'
      why: 8 doesn't fit 4n + 2, and the ring folds into a tub, so it isn't aromatic.
    - label: Naphthalene
      bin: Aromatic
      clue: Two fused rings with five C=C. How many π electrons?
      why: 10 π electrons (n = 2) in a flat system.
    - label: Cyclohexene
      bin: Not aromatic
      clue: Only one C=C. Is the ring fully conjugated?
      why: Most ring carbons are sp³; there's no ring of p orbitals.
    - label: Pyridine, C₅H₅N
      bin: Aromatic
      clue: Like benzene with one N. How many π electrons?
      why: 6 π electrons; the N's lone pair points outward and isn't part of them.
  lesson:
    - teach: Benzene (C₆H₆) is a flat ring of sp² carbons. Its 6 π electrons are spread around the whole ring (resonance), so all six C–C bonds are equal (139 pm).
      check:
        prompt: 'All C–C bonds in benzene are:'
        options:
        - equal in length
        - alternately single and double
        - triple
        answer: equal in length
        why: Delocalised π electrons.
      ways:
      - style: visual
        teach: Kekulé structures versus the real benzene ring.
        picture:
          kind: compare
          columns:
          - title: Kekulé's two structures
            points:
            - alternating single and double bonds
            - C–C 154 pm and C=C 134 pm expected
          - title: Real benzene
            points:
            - resonance hybrid
            - all C–C bonds equal, 139 pm
            - π electrons spread round the ring
          alt: Kekulé's structures show alternating single and double bonds of different lengths; real benzene is a resonance hybrid with all six carbon-carbon bonds equal at 139 picometres.
      - style: real_world
        teach: 'A mule is not a horse one moment and a donkey the next: it is always a blend of both. Benzene is not flipping between two Kekulé structures; it is always the single blended structure, the resonance hybrid.'
    - teach: 'Hückel''s rule: a planar, cyclic, fully conjugated ring with (4n + 2) π electrons is aromatic and extra stable. Benzene: n = 1, 6 electrons.'
      check:
        prompt: Which π-electron count fits 4n + 2?
        options:
        - '10'
        - '8'
        - '4'
        answer: '10'
        why: n = 2.
      ways:
      - style: step_by_step
        teach: 'Step 1: Is the ring flat? Step 2: Is it cyclic? Step 3: Does every ring atom carry a p orbital (full conjugation)? Step 4: Count π electrons: 2, 6, 10, 14 (4n + 2) → aromatic. Example: the cyclopentadienyl anion C₅H₅⁻ has 6 π electrons and is aromatic.'
      - style: visual
        teach: Checking rings with Hückel's 4n + 2 rule.
        picture:
          kind: compare
          columns:
          - title: Aromatic
            points:
            - 'C₅H₅⁻: 6 π, n = 1'
            - 'pyridine: 6 π, n = 1'
          - title: Not aromatic
            points:
            - 'cyclooctatetraene: 8 π, not flat'
            - 'cyclopentadiene: one sp³ carbon'
          alt: The cyclopentadienyl anion and pyridine have 6 pi electrons and are aromatic; cyclooctatetraene is not flat and cyclopentadiene has an sp3 carbon, so neither is aromatic.
    - teach: 'Benzene prefers electrophilic substitution, which keeps the ring: nitration (NO₂⁺ from conc. HNO₃ + H₂SO₄), halogenation (FeCl₃), sulfonation, Friedel–Crafts (AlCl₃). Existing groups steer new ones: –OH, –NH₂, –CH₃, halogens to ortho/para; –NO₂, –CHO, –COOH to meta.'
      picture:
        kind: compare
        columns:
        - title: Group on ring
          points:
          - –OH, –NH₂, –CH₃
          - –NO₂, –CHO, –COOH
        - title: New group goes
          points:
          - ortho / para
          - meta
        alt: Directing effects in benzene substitution.
      check:
        prompt: 'Nitration of toluene (–CH₃) gives mainly:'
        options:
        - ortho and para products
        - meta product
        - no reaction
        answer: ortho and para products
        why: –CH₃ is an ortho/para director.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find the group already on the ring. Step 2: Electron-pushing groups (–CH₃, –OH, –NH₂, –Cl) send new groups to ortho and para. Step 3: Electron-pulling groups (–NO₂, –CHO, –COOH) send them to meta. Example: toluene + nitrating mixture → mainly o- and p-nitrotoluene.'
      - style: real_world
        teach: Electrophilic substitution on benzene rings is how many dyes, painkillers like paracetamol, and plastics begin in chemical factories. Choosing which group to add first decides where the next one lands.
  items:
  - prompt: How many π electrons does benzene have?
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - Three double bonds.
    - 2 each.
    solution: "Benzene has 3 C=C π bonds with 2 electrons each: 3 × 2 = 6."
    mistakes: {"3": "c11_benzene_pi", "12": "c11_benzene_pi", "2": "c11_benzene_pi"}
  - prompt: In Hückel's rule 4n + 2, what is n for benzene?
    answer: '1'
    check: (6-2)/4
    difficulty: 2
    hints:
    - 4n + 2 = 6.
    - n = 1.
    solution: "4n + 2 = 6 gives n = 1, so benzene is aromatic."
    mistakes:
      '6': c11c_huckel
  - prompt: 'Benzene mainly undergoes:'
    options:
    - electrophilic substitution
    - electrophilic addition
    - nucleophilic addition
    - elimination
    answer: electrophilic substitution
    difficulty: 1
    hints:
    - Keeps the aromatic ring.
    - Swaps H.
    solution: "Substitution keeps the stable aromatic ring, while addition would destroy it, so benzene prefers electrophilic substitution."
    mistakes: {"electrophilic addition": "c11_aromatic_sub", "nucleophilic addition": "c11_aromatic_sub", "elimination": "c11_aromatic_sub"}
  - prompt: 'The electrophile in the nitration of benzene is:'
    options:
    - NO₂⁺
    - NO₃⁻
    - HNO₃
    - H⁺
    answer: NO₂⁺
    difficulty: 2
    hints:
    - Nitronium ion.
    - From HNO₃ + H₂SO₄.
    solution: "Concentrated H₂SO₄ removes water from HNO₃ to give the nitronium ion, NO₂⁺, which attacks the ring."
    mistakes: {"NO₃⁻": "c11_nitronium", "HNO₃": "c11_nitronium", "H⁺": "c11_nitronium"}
  - prompt: Which group directs incoming groups to the meta position?
    options:
    - –NO₂
    - –OH
    - –CH₃
    - –NH₂
    answer: –NO₂
    difficulty: 2
    hints:
    - Electron-withdrawing.
    - Deactivating.
    solution: –NO₂ is a meta director.
    mistakes: {"–OH": "c11_meta", "–CH₃": "c11_meta", "–NH₂": "c11_meta"}
  - prompt: Friedel–Crafts alkylation uses which catalyst?
    options:
    - anhydrous AlCl₃
    - Ni
    - H₂SO₄ only
    - Pt
    answer: anhydrous AlCl₃
    difficulty: 2
    hints:
    - Lewis acid.
    - Aluminium chloride.
    solution: "Anhydrous AlCl₃ (a Lewis acid) pulls the halogen off R–Cl to make the R⁺ electrophile."
    mistakes: {"Ni": "c11_friedel", "H₂SO₄ only": "c11_friedel", "Pt": "c11_friedel"}
  - prompt: How many σ bonds are in a benzene molecule?
    answer: '12'
    check: 6+6
    difficulty: 1
    hints:
    - Count C–C bonds in the ring.
    - Add the C–H bonds.
    solution: 'Step 1: 6 C–C + 6 C–H. Step 2: 12.'
    mistakes:
      '6': c11c09_arom
      '9': c11c09_arom
  - prompt: Hybridisation of carbon in benzene?
    options:
    - sp²
    - sp³
    - sp
    answer: sp²
    difficulty: 1
    hints:
    - Each C has three σ bonds.
    - Flat ring, 120° angles.
    solution: 'Step 1: trigonal planar carbons. Step 2: sp².'
    mistakes:
      sp³: c11c09_arom
      sp: c11c09_arom
  - prompt: 'Benzene + Cl₂ with FeCl₃ gives:'
    options:
    - chlorobenzene
    - hexachlorocyclohexane
    - no reaction
    answer: chlorobenzene
    difficulty: 1
    hints:
    - FeCl₃ makes an electrophile.
    - Benzene keeps its ring.
    solution: 'Step 1: electrophilic substitution. Step 2: C₆H₅Cl.'
    mistakes:
      hexachlorocyclohexane: c11c09_arom
      no reaction: c11c09_arom
  - prompt: 'Nitrobenzene is nitrated further. The new –NO₂ goes mainly to the:'
    options:
    - meta position
    - ortho position
    - para position
    answer: meta position
    difficulty: 2
    hints:
    - –NO₂ pulls electrons from the ring.
    - It is a deactivating group.
    solution: 'Step 1: –NO₂ is a meta director. Step 2: meta.'
    mistakes:
      ortho position: c11c09_arom
      para position: c11c09_arom
  - prompt: Which reagent pair gives acetophenone (C₆H₅COCH₃) from benzene?
    options:
    - CH₃COCl and anhydrous AlCl₃
    - CH₃Cl and anhydrous AlCl₃
    - conc. HNO₃ and conc. H₂SO₄
    answer: CH₃COCl and anhydrous AlCl₃
    difficulty: 2
    hints:
    - Adding an acyl group is Friedel–Crafts acylation.
    - The acyl group comes from an acid chloride.
    solution: 'Step 1: acylation needs CH₃COCl. Step 2: with AlCl₃.'
    mistakes:
      CH₃Cl and anhydrous AlCl₃: c11c09_arom
      conc. HNO₃ and conc. H₂SO₄: c11c09_arom
  - prompt: Why does benzene resist addition reactions?
    options:
    - "addition would destroy its aromatic stability"
    - "it has no π electrons at all in its ring"
    - "it is fully saturated, like the alkanes"
    answer: addition would destroy its aromatic stability
    difficulty: 2
    hints:
    - Think about the delocalised ring.
    - Substitution keeps it; addition breaks it.
    solution: 'Step 1: resonance energy would be lost. Step 2: substitution is preferred.'
    mistakes:
      "it has no π electrons at all in its ring": c11c09_arom
      "it is fully saturated, like the alkanes": c11c09_arom
  - prompt: How many π electrons does naphthalene (C₁₀H₈) have?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - Two fused rings with 5 C=C in Kekulé form.
    - 2 electrons per double bond.
    solution: 'Step 1: 5 double bonds × 2. Step 2: 10.'
    mistakes:
      '12': c11c09_arom
      '6': c11c09_arom
  - prompt: 'Cyclobutadiene (4 π electrons, planar ring) is:'
    options:
    - not aromatic
    - aromatic
    - aromatic only when heated
    answer: not aromatic
    difficulty: 3
    hints:
    - Test 4 against 4n + 2.
    - Can n be a whole number?
    solution: 'Step 1: 4n + 2 = 4 gives n = ½. Step 2: not aromatic.'
    mistakes:
      aromatic: c11c09_arom
      aromatic only when heated: c11c09_arom
  - prompt: 'Phenol reacts with bromine water much faster than benzene because –OH:'
    options:
    - pushes electrons into the ring
    - pulls electrons out of the ring
    - makes benzene non-aromatic
    answer: pushes electrons into the ring
    difficulty: 3
    hints:
    - –OH is an activating group.
    - Its lone pair joins the ring's π system.
    solution: 'Step 1: +R effect enriches the ring. Step 2: faster electrophilic attack.'
    mistakes:
      pulls electrons out of the ring: c11c09_arom
      makes benzene non-aromatic: c11c09_arom
  - prompt: 'Assertion (A): Benzene undergoes substitution rather than addition reactions.

      Reason (R): Substitution keeps the delocalised 6π electron system of the ring intact.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Addition would break the stable aromatic ring, while substitution keeps it, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: A chemist brominates methoxybenzene (anisole, C₆H₅OCH₃) with Br₂/FeBr₃. Where does the bromine mainly go?'
    options:
    - Ortho and para positions
    - Meta position
    - It replaces the –OCH₃ group
    answer: Ortho and para positions
    hints:
    - Is –OCH₃ electron-pushing or pulling?
    - Pushing groups direct to which positions?
    solution: –OCH₃ pushes electrons into the ring by resonance, so it directs Br to the ortho and para positions.
    mistakes:
      Meta position: c11_meta
      It replaces the –OCH₃ group: c11_aromatic_sub
    exam: competency
    difficulty: 2
  - prompt: How many π electrons does the tropylium ion, C₇H₇⁺ (a flat seven-membered ring), have, and is it aromatic?
    options:
    - 6, aromatic
    - 7, not aromatic
    - 8, not aromatic
    answer: 6, aromatic
    hints:
    - Three C=C bonds give the π electrons; the + carbon has an empty p orbital.
    - Does that count fit 4n + 2?
    solution: '3 C=C give 6 π electrons and the empty p orbital completes the ring: 6 = 4(1) + 2, so it is aromatic.'
    mistakes:
      7, not aromatic: c11c_huckel
      8, not aromatic: c11c_huckel
    exam: short
    difficulty: 2
