# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse11-chem
chapter: 4
title: Chemical Bonding and Molecular Structure
tips:
  c11c_vsepr: Count electron pairs around the central atom (bonding + lone). 4 pairs with 0 lone = tetrahedral; 1 lone = pyramidal; 2 lone = bent.
  c11c_bo: Bond order = (bonding electrons − antibonding electrons) ÷ 2. Zero bond order means no stable molecule.
concepts:
- code: cbse11c.bond.types
  title: Ionic and covalent bonds, VSEPR
  notes: |
    Kössel–Lewis: atoms reach an octet. Ionic bond: transfer of electrons (NaCl); lattice enthalpy. Covalent bond: sharing
    (single, double, triple). Lewis structures, formal charge = V − L − ½B. Limits of octet rule (BF₃, PCl₅, SF₆). Bond
    parameters: length, angle, enthalpy, bond order; resonance (O₃, CO₃²⁻). Polarity and dipole moment (μ = q × d; CO₂ zero,
    H₂O nonzero). Fajans' rules. VSEPR: electron pairs repel; lone pair–lone pair > lone–bond > bond–bond. Shapes: linear
    (BeCl₂), trigonal planar (BF₃), tetrahedral (CH₄ 109.5°), pyramidal (NH₃ 107°), bent (H₂O 104.5°), trigonal
    bipyramidal (PCl₅), octahedral (SF₆).
  explanations:
    text: Atoms bond to get a stable set of outer electrons. Ionic bonds form when one atom gives electrons to another; covalent bonds form when atoms share. VSEPR theory says electron pairs around an atom push as far apart as they can, which sets the molecule's shape.
    visual: 'Draw methane: four bonds pointing to the corners of a tetrahedron, 109.5° apart. Replace one bond with a lone pair to get ammonia''s pyramid, and two to get water''s bent shape.'
    step_by_step: 'Step 1: Count valence electrons on the central atom. Step 2: Count bonding pairs and lone pairs. Step 3: Choose the shape from the total pairs. Step 4: Lone pairs squeeze bond angles smaller.'
    real_world: Water's bent shape makes it polar, which is why it dissolves salt and sugar so well.
  picture:
    kind: compare
    columns:
    - title: Molecule
      points:
      - CH₄
      - NH₃
      - H₂O
    - title: Lone pairs
      points:
      - '0'
      - '1'
      - '2'
    - title: Shape
      points:
      - tetrahedral
      - trigonal pyramidal
      - bent
    alt: Methane, ammonia and water all have four electron pairs, but 0, 1 and 2 lone pairs give different shapes.
  items:
  - prompt: What is the shape of NH₃?
    options:
    - trigonal pyramidal
    - trigonal planar
    - tetrahedral
    - bent
    answer: trigonal pyramidal
    difficulty: 1
    hints:
    - 3 bond pairs, 1 lone pair.
    - Pyramid.
    solution: Trigonal pyramidal.
    mistakes:
      trigonal planar: c11c_vsepr
  - prompt: What is the bond angle (in degrees) in methane? Give it to one decimal place.
    answer: '109.5'
    check: Rational(1095,10)
    difficulty: 1
    hints:
    - Tetrahedral.
    - Regular tetrahedron.
    solution: 109.5°.
  - prompt: Which molecule has zero dipole moment?
    options:
    - CO₂
    - H₂O
    - NH₃
    - HCl
    answer: CO₂
    difficulty: 2
    hints:
    - Linear and symmetric.
    - Dipoles cancel.
    solution: CO₂ is linear, so its bond dipoles cancel.
  - prompt: 'The bond in NaCl is:'
    options:
    - ionic
    - covalent
    - metallic
    - hydrogen
    answer: ionic
    difficulty: 1
    hints:
    - Metal + non-metal.
    - Electron transfer.
    solution: Ionic.
  - prompt: What is the shape of SF₆?
    options:
    - octahedral
    - tetrahedral
    - trigonal bipyramidal
    - square planar
    answer: octahedral
    difficulty: 2
    hints:
    - Six bond pairs.
    - 90° apart.
    solution: Octahedral.
  - prompt: Find the formal charge on the central O in ozone if it has 6 valence electrons, 2 non-bonding electrons and 6 bonding electrons.
    answer: '1'
    check: 6-2-Rational(6,2)
    difficulty: 2
    hints:
    - V − L − ½B.
    - 6 − 2 − 3.
    solution: '+1.'
- code: cbse11c.bond.theories
  title: Hybridisation, molecular orbitals and hydrogen bonds
  after:
  - cbse11c.bond.types
  notes: |
    Valence bond theory: overlap of orbitals; σ (head-on) and π (sideways) bonds; a double bond = 1σ + 1π. Hybridisation:
    sp (linear, 180°, BeCl₂, C₂H₂), sp² (trigonal planar, 120°, BF₃, C₂H₄), sp³ (tetrahedral, CH₄), sp³d (PCl₅), sp³d²
    (SF₆). Molecular orbital theory: bonding and antibonding MOs; bond order = ½(Nb − Na); bond order 0 → doesn't exist
    (He₂); O₂ has two unpaired electrons, so it is paramagnetic. Hydrogen bonding: intermolecular (HF, H₂O, high boiling
    point) and intramolecular (o-nitrophenol).
  explanations:
    text: 'Atoms mix their orbitals to form new hybrid orbitals that point in the best directions for bonding. Molecular orbital theory goes further: electrons spread over the whole molecule, and counting bonding versus antibonding electrons gives the bond order.'
    visual: 'Draw energy levels for O₂: bonding orbitals below, antibonding above. Fill 16 electrons; the last two go singly into two π* orbitals, so O₂ is attracted to a magnet.'
    step_by_step: 'Step 1: Count electron pairs (bonds + lone pairs) around the central atom. Step 2: 2 → sp, 3 → sp², 4 → sp³, 5 → sp³d, 6 → sp³d². Step 3: For MO, bond order = (bonding − antibonding)/2.'
    real_world: Ice floats because hydrogen bonds hold water molecules in an open structure that is less dense than liquid water.
  picture:
    kind: flow
    steps:
    - 2 pairs → sp, 180°
    - 3 pairs → sp², 120°
    - 4 pairs → sp³, 109.5°
    - 5 pairs → sp³d
    - 6 pairs → sp³d²
    alt: 'Hybridisation from the number of electron pairs: sp, sp², sp³, sp³d and sp³d².'
  items:
  - prompt: What is the hybridisation of carbon in ethene, C₂H₄?
    options:
    - sp²
    - sp
    - sp³
    - sp³d
    answer: sp²
    difficulty: 1
    hints:
    - Double bond.
    - 3 σ bonds per carbon.
    solution: sp².
  - prompt: How many σ bonds are there in ethene, C₂H₄?
    answer: '5'
    check: 4+1
    difficulty: 2
    hints:
    - 4 C–H + 1 C–C σ.
    - The double bond has one σ.
    solution: 5 σ bonds (and 1 π).
  - prompt: N₂ has 10 bonding and 4 antibonding valence electrons. Find its bond order.
    answer: '3'
    check: (10-4)/2
    difficulty: 1
    hints:
    - (Nb − Na)/2.
    - (10 − 4)/2.
    solution: 3 (a triple bond).
    mistakes:
      '7': c11c_bo
  - prompt: He₂ would have 2 bonding and 2 antibonding electrons. What is its bond order?
    answer: '0'
    check: (2-2)/2
    difficulty: 1
    hints:
    - (2 − 2)/2.
    - Zero.
    solution: 0, so He₂ does not exist.
  - prompt: 'Oxygen gas is paramagnetic because:'
    options:
    - it has two unpaired electrons in π* orbitals
    - it has a triple bond
    - all its electrons are paired
    - it is an ion
    answer: it has two unpaired electrons in π* orbitals
    difficulty: 2
    hints:
    - MO theory.
    - Hund's rule in π*.
    solution: MO theory gives O₂ two unpaired electrons.
  - prompt: 'Water has an unusually high boiling point because of:'
    options:
    - hydrogen bonding
    - ionic bonding
    - metallic bonding
    - its large molar mass
    answer: hydrogen bonding
    difficulty: 1
    hints:
    - O–H…O attraction.
    - Strong intermolecular force.
    solution: Hydrogen bonds between molecules.
