# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse11-chem
chapter: 4
title: Chemical Bonding and Molecular Structure
tips:
  c11c_vsepr: Count electron pairs around the central atom (bonding + lone). 4 pairs with 0 lone = tetrahedral; 1 lone = pyramidal; 2 lone = bent.
  c11c_bo: Bond order = (bonding electrons − antibonding electrons) ÷ 2. Zero bond order means no stable molecule.
  c11_bond_order: "Bond order = (bonding − antibonding)/2."
  c11_dipole_cancel: "A linear molecule with two equal bonds in opposite directions: the pulls cancel."
  c11_formal_charge: "Formal charge = valence − non-bonding − ½(bonding)."
  c11_h_bond: "H₂S is heavier but boils far lower than water. What extra attraction does water have between its molecules?"
  c11_hybrid_double: "Each C in ethene has three electron groups (two H and one double bond). Three groups need three hybrid orbitals."
  c11_ionic: "Na gives an electron to Cl. A full transfer of electrons forms which bond?"
  c11_o2_para: "Paramagnetic means attracted to a magnet, which needs unpaired electrons. Look at O₂'s antibonding π orbitals."
  c11_sf6: "Six bond pairs and no lone pairs around S point to the corners of a shape with eight faces."
  c11_sigma_count: "Every single bond is one σ; a double bond is one σ + one π. Count all bonds: 4 C–H and the C=C."
  c11_tetrahedral: "Methane has four bond pairs around C, spread as a tetrahedron."
  c11c04_shape: Count bond pairs and lone pairs on the central atom. Lone pairs push harder and squeeze the bond angles.
  c11c04_bond: "Ask whether electrons are transferred or shared. A large electronegativity difference, as between a metal and a non-metal, means transfer."
  c11c04_mo: 'Bond order = ½(bonding − antibonding electrons). Count σ bonds: every single bond is one σ, every double bond has one σ and one π.'
concepts:
- code: cbse11c.bond.types
  title: Ionic and covalent bonds, VSEPR
  notes: |
    Kössel–Lewis: atoms reach an octet. Ionic bond: transfer of electrons (NaCl); lattice enthalpy. Covalent bond: sharing
    (single, double, triple). Lewis structures, formal charge = V − L − ½B. Limits of octet rule (BF₃, PCl₅, SF₆). Bond
    parameters: length, angle, enthalpy, bond order; resonance (O₃, CO₃²⁻). Polarity and dipole moment (μ = q × d; CO₂ zero,
    H₂O nonzero). Fajans' rules. VSEPR: electron pairs repel; lone pair–lone pair > lone–bond > bond–bond. Shapes: linear
    (BeCl₂), trigonal planar (BF₃), tetrahedral (CH₄ 109.5°), pyramidal (NH₃ 107°), bent (H₂O 104.5°), trigonal
    bipyramidal (PCl₅), octahedral (SF₆).
  explanations:
    text: Atoms bond to get a stable set of outer electrons. Ionic bonds form when one atom gives electrons to another; covalent bonds form when atoms share. VSEPR theory says electron pairs around an atom push as far apart as they can, which sets the molecule's shape.
    visual: 'Draw methane: four bonds pointing to the corners of a tetrahedron, 109.5° apart. Replace one bond with a lone pair to get ammonia''s pyramid, and two to get water''s bent shape.'
    step_by_step: 'Step 1: Count valence electrons on the central atom. Step 2: Count bonding pairs and lone pairs. Step 3: Choose the shape from the total pairs. Step 4: Lone pairs squeeze bond angles smaller.'
    real_world: Water's bent shape makes it polar, which is why it dissolves salt and sugar so well.
  picture:
    kind: compare
    columns:
    - title: Molecule
      points:
      - CH₄
      - NH₃
      - H₂O
    - title: Lone pairs
      points:
      - '0'
      - '1'
      - '2'
    - title: Shape
      points:
      - tetrahedral
      - trigonal pyramidal
      - bent
    alt: Methane, ammonia and water all have four electron pairs, but 0, 1 and 2 lone pairs give different shapes.
  activity:
    type: sort
    prompt: 'VSEPR: count the electron pairs around the central atom, bonding and lone. What shape is the molecule?'
    bins:
    - Linear
    - Trigonal planar
    - Tetrahedral
    - Trigonal pyramidal
    - Bent
    items:
    - label: CO₂
      bin: Linear
      clue: C makes two double bonds and has no lone pair. How far apart do two groups push?
      why: 'Two bonding groups, no lone pairs: 180°, linear.'
    - label: BeCl₂
      bin: Linear
      clue: Be has two bond pairs and no lone pairs. What angle?
      why: 'Two pairs push to opposite sides: linear, 180°.'
    - label: BF₃
      bin: Trigonal planar
      clue: B has three bond pairs and no lone pair. Flat or not?
      why: 'Three pairs spread out flat at 120°: trigonal planar.'
    - label: BCl₃
      bin: Trigonal planar
      clue: Like BF₃, how many pairs does B have?
      why: 'Three bond pairs, no lone pair: trigonal planar.'
    - label: CH₄
      bin: Tetrahedral
      clue: Four bond pairs, no lone pair. Is the shape flat?
      why: Four pairs point to the corners of a tetrahedron, 109.5°.
    - label: CCl₄
      bin: Tetrahedral
      clue: How many bond pairs does C have?
      why: 'Four bond pairs and no lone pair: tetrahedral.'
    - label: NH₄⁺
      bin: Tetrahedral
      clue: N has used its lone pair to bond H⁺. How many bond pairs now?
      why: 'Four bond pairs, no lone pair: tetrahedral, like CH₄.'
    - label: NH₃
      bin: Trigonal pyramidal
      clue: N has three bond pairs and one lone pair. What does the lone pair do?
      why: The lone pair takes a corner of the tetrahedron, leaving a pyramid of 3 H, about 107°.
    - label: PCl₃
      bin: Trigonal pyramidal
      clue: P has three bonds and one lone pair. Like which molecule?
      why: 'Like NH₃: 3 bond pairs + 1 lone pair, a pyramid.'
    - label: H₂O
      bin: Bent
      clue: O has two bond pairs and two lone pairs. Is the molecule straight?
      why: 'Two lone pairs squeeze the two bonds to about 104.5°: bent.'
    - label: SO₂
      bin: Bent
      clue: S has two bonded O and one lone pair. Can it be straight?
      why: 'Three electron groups, one a lone pair: the molecule is bent, about 119°.'
  lesson:
    - teach: 'Atoms bond to reach a stable octet. Ionic bonds form by transferring electrons (Na gives one to Cl: Na⁺Cl⁻). Covalent bonds form by sharing pairs: single, double or triple.'
      check:
        prompt: 'The bond in Cl₂ is:'
        options:
        - covalent
        - ionic
        - metallic
        answer: covalent
        why: Two identical atoms share electrons.
    - teach: 'VSEPR: electron pairs around the central atom spread out as far as possible. Lone pairs repel more than bond pairs, so CH₄ is 109.5°, NH₃ (one lone pair) 107°, H₂O (two lone pairs) 104.5°.'
      check:
        prompt: Shape of H₂O?
        options:
        - bent
        - linear
        - tetrahedral
        answer: bent
        why: Two bond pairs plus two lone pairs.
    - teach: 'A polar bond has a dipole μ = q × d. A molecule''s dipoles can cancel by symmetry: CO₂ (linear) has μ = 0, H₂O (bent) does not. Shapes by pairs: 2 linear, 3 trigonal planar, 4 tetrahedral, 5 trigonal bipyramidal, 6 octahedral.'
      picture:
        kind: compare
        columns:
        - title: Electron pairs
          points:
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
        - title: Shape (no lone pairs)
          points:
          - linear
          - trigonal planar
          - tetrahedral
          - trigonal bipyramidal
          - octahedral
        alt: VSEPR shapes for two to six electron pairs.
      check:
        prompt: Shape of BF₃?
        options:
        - trigonal planar
        - pyramidal
        - T-shaped
        answer: trigonal planar
        why: Three bond pairs, no lone pair.
  items:
  - prompt: What is the shape of NH₃?
    options:
    - trigonal pyramidal
    - trigonal planar
    - tetrahedral
    - bent
    answer: trigonal pyramidal
    difficulty: 1
    hints:
    - 3 bond pairs, 1 lone pair.
    - Pyramid.
    solution: Trigonal pyramidal.
    mistakes:
      trigonal planar: c11c_vsepr
  - prompt: What is the bond angle (in degrees) in methane? Give it to one decimal place.
    answer: '109.5'
    check: Rational(1095,10)
    difficulty: 1
    hints:
    - Tetrahedral.
    - Regular tetrahedron.
    solution: 109.5°.
    mistakes: {"90": "c11_tetrahedral", "120": "c11_tetrahedral", "107": "c11_tetrahedral"}
  - prompt: Which molecule has zero dipole moment?
    options:
    - CO₂
    - H₂O
    - NH₃
    - HCl
    answer: CO₂
    difficulty: 2
    hints:
    - Linear and symmetric.
    - Dipoles cancel.
    solution: CO₂ is linear, so its bond dipoles cancel.
    mistakes: {"H₂O": "c11_dipole_cancel", "NH₃": "c11_dipole_cancel", "HCl": "c11_dipole_cancel"}
  - prompt: 'The bond in NaCl is:'
    options:
    - ionic
    - covalent
    - metallic
    - hydrogen
    answer: ionic
    difficulty: 1
    hints:
    - Metal + non-metal.
    - Electron transfer.
    solution: Ionic.
    mistakes: {"covalent": "c11_ionic", "metallic": "c11_ionic", "hydrogen": "c11_ionic"}
  - prompt: What is the shape of SF₆?
    options:
    - octahedral
    - tetrahedral
    - trigonal bipyramidal
    - square planar
    answer: octahedral
    difficulty: 2
    hints:
    - Six bond pairs.
    - 90° apart.
    solution: Octahedral.
    mistakes: {"tetrahedral": "c11_sf6", "trigonal bipyramidal": "c11_sf6", "square planar": "c11_sf6"}
  - prompt: Find the formal charge on the central O in ozone if it has 6 valence electrons, 2 non-bonding electrons and 6 bonding electrons.
    answer: '1'
    check: 6-2-Rational(6,2)
    difficulty: 2
    hints:
    - V − L − ½B.
    - 6 − 2 − 3.
    solution: '+1.'
    mistakes: {"-1": "c11_formal_charge", "0": "c11_formal_charge", "3": "c11_formal_charge"}
  - prompt: What is the shape of BeCl₂?
    options:
    - linear
    - bent
    - trigonal planar
    answer: linear
    difficulty: 1
    hints:
    - Be has two bond pairs and no lone pairs.
    - Two pairs spread out opposite.
    solution: 'Step 1: 2 bond pairs. Step 2: linear, 180°.'
    mistakes:
      bent: c11c04_shape
      trigonal planar: c11c04_shape
  - prompt: 'The bond in MgO is:'
    options:
    - ionic
    - covalent
    - hydrogen
    answer: ionic
    difficulty: 1
    hints:
    - A metal with a non-metal.
    - Mg gives two electrons to O.
    solution: 'Step 1: electron transfer. Step 2: ionic.'
    mistakes:
      covalent: c11c04_bond
      hydrogen: c11c04_bond
  - prompt: Which molecule does NOT obey the octet rule at its central atom?
    options:
    - BF₃
    - CH₄
    - NH₃
    answer: BF₃
    difficulty: 1
    hints:
    - Count electrons around the central atom.
    - Boron forms only three bonds.
    solution: 'Step 1: B has 6 electrons around it. Step 2: BF₃.'
    mistakes:
      CH₄: c11c04_bond
      NH₃: c11c04_bond
  - prompt: What is the bond angle (degrees) in water, to one decimal place?
    answer: '104.5'
    check: '104.5'
    difficulty: 2
    hints:
    - Start from tetrahedral 109.5°.
    - Two lone pairs squeeze it more than NH₃'s one.
    solution: 'Step 1: lone pairs reduce the angle. Step 2: 104.5°.'
    mistakes:
      '107': c11c04_shape
      '109.5': c11c04_shape
  - prompt: Which has a dipole moment?
    options:
    - NH₃
    - BF₃
    - CH₄
    answer: NH₃
    difficulty: 2
    hints:
    - Symmetric shapes cancel their bond dipoles.
    - Which shape is not symmetric?
    solution: 'Step 1: pyramidal NH₃ does not cancel. Step 2: NH₃.'
    mistakes:
      BF₃: c11c04_shape
      CH₄: c11c04_shape
  - prompt: What is the shape of PCl₅?
    options:
    - trigonal bipyramidal
    - square planar
    - octahedral
    answer: trigonal bipyramidal
    difficulty: 2
    hints:
    - Five bond pairs, no lone pairs.
    - Three around the middle, two above and below.
    solution: 'Step 1: 5 pairs. Step 2: trigonal bipyramidal.'
    mistakes:
      square planar: c11c04_shape
      octahedral: c11c04_shape
  - prompt: 'Ozone (O₃) is described by resonance structures. Its two O–O bonds are:'
    options:
    - equal in length
    - one single and one double
    - both triple
    answer: equal in length
    difficulty: 2
    hints:
    - The real molecule is a blend of the structures.
    - Each bond is in between single and double.
    solution: 'Step 1: resonance hybrid. Step 2: both bonds equal.'
    mistakes:
      one single and one double: c11c04_bond
      both triple: c11c04_bond
  - prompt: Find the formal charge on N in NH₄⁺ (N has 5 valence electrons, 0 non-bonding, 8 bonding).
    answer: '1'
    check: 5-0-8/2
    difficulty: 3
    hints:
    - FC = V − L − ½B.
    - 5 − 0 − 4.
    solution: 'Step 1: 5 − 0 − 4. Step 2: +1.'
    mistakes:
      '0': c11c04_bond
      '-1': c11c04_bond
  - prompt: By Fajans' rules, which is most covalent?
    options:
    - AlCl₃
    - NaCl
    - MgCl₂
    answer: AlCl₃
    difficulty: 3
    hints:
    - A small, highly charged cation distorts the anion most.
    - Compare Na⁺, Mg²⁺ and Al³⁺.
    solution: 'Step 1: Al³⁺ is smallest with the highest charge. Step 2: AlCl₃.'
    mistakes:
      NaCl: c11c04_bond
      MgCl₂: c11c04_bond
- code: cbse11c.bond.theories
  title: Hybridisation, molecular orbitals and hydrogen bonds
  after:
  - cbse11c.bond.types
  notes: |
    Valence bond theory: overlap of orbitals; σ (head-on) and π (sideways) bonds; a double bond = 1σ + 1π. Hybridisation:
    sp (linear, 180°, BeCl₂, C₂H₂), sp² (trigonal planar, 120°, BF₃, C₂H₄), sp³ (tetrahedral, CH₄), sp³d (PCl₅), sp³d²
    (SF₆). Molecular orbital theory: bonding and antibonding MOs; bond order = ½(Nb − Na); bond order 0 → doesn't exist
    (He₂); O₂ has two unpaired electrons, so it is paramagnetic. Hydrogen bonding: intermolecular (HF, H₂O, high boiling
    point) and intramolecular (o-nitrophenol).
  explanations:
    text: 'Atoms mix their orbitals to form new hybrid orbitals that point in the best directions for bonding. Molecular orbital theory goes further: electrons spread over the whole molecule, and counting bonding versus antibonding electrons gives the bond order.'
    visual: 'Draw energy levels for O₂: bonding orbitals below, antibonding above. Fill 16 electrons; the last two go singly into two π* orbitals, so O₂ is attracted to a magnet.'
    step_by_step: 'Step 1: Count electron pairs (bonds + lone pairs) around the central atom. Step 2: 2 → sp, 3 → sp², 4 → sp³, 5 → sp³d, 6 → sp³d². Step 3: For MO, bond order = (bonding − antibonding)/2.'
    real_world: Ice floats because hydrogen bonds hold water molecules in an open structure that is less dense than liquid water.
  picture:
    kind: flow
    steps:
    - 2 pairs → sp, 180°
    - 3 pairs → sp², 120°
    - 4 pairs → sp³, 109.5°
    - 5 pairs → sp³d
    - 6 pairs → sp³d²
    alt: 'Hybridisation from the number of electron pairs: sp, sp², sp³, sp³d and sp³d².'
  activity:
    type: sort
    prompt: Which hybridisation does the central atom use? Count σ bonds plus lone pairs on it.
    bins:
    - sp
    - sp²
    - sp³
    - sp³d
    - sp³d²
    items:
    - label: BeCl₂
      bin: sp
      clue: Be has 2 σ bonds and no lone pair. How many orbitals mix?
      why: '2 groups → two hybrid orbitals: one s + one p, linear.'
    - label: C₂H₂ (each C)
      bin: sp
      clue: Each C forms a triple bond and one C–H. How many σ bonds?
      why: '2 σ bonds per C: one s + one p mix; the other two p make the π bonds.'
    - label: BF₃
      bin: sp²
      clue: B has 3 σ bonds and no lone pair. How many orbitals?
      why: '3 groups → three hybrids from one s + two p: trigonal planar.'
    - label: C₂H₄ (each C)
      bin: sp²
      clue: Each C has two C–H and one C=C. How many σ bonds?
      why: '3 σ bonds per C: three hybrids, and the leftover p forms the π bond.'
    - label: CH₄
      bin: sp³
      clue: 4 σ bonds, no lone pair. How many orbitals mix?
      why: '4 groups → one s + three p: tetrahedral.'
    - label: NH₃
      bin: sp³
      clue: 3 σ bonds + 1 lone pair. How many groups?
      why: 4 groups (one a lone pair) → four hybrids.
    - label: H₂O
      bin: sp³
      clue: 2 σ bonds + 2 lone pairs. How many groups?
      why: 4 groups → four hybrids, two holding lone pairs.
    - label: PCl₅
      bin: sp³d
      clue: P has 5 σ bonds. Can 4 orbitals hold them?
      why: '5 groups need five hybrids: one s, three p and one d. Trigonal bipyramidal.'
    - label: SF₆
      bin: sp³d²
      clue: S has 6 σ bonds. How many orbitals mix?
      why: '6 groups → six hybrids, one s + three p + two d: octahedral.'
  lesson:
    - teach: 'Valence bond theory: bonds form when orbitals overlap. Head-on overlap gives a σ bond; sideways overlap gives a π bond. A double bond is 1σ + 1π; a triple is 1σ + 2π.'
      check:
        prompt: Bonds in N≡N?
        options:
        - 1σ and 2π
        - 3σ
        - 2σ and 1π
        answer: 1σ and 2π
        why: Only one σ in any multiple bond.
    - teach: 'Hybridisation mixes orbitals: sp (linear, 180°), sp² (trigonal planar, 120°), sp³ (tetrahedral, 109.5°), sp³d (PCl₅), sp³d² (SF₆).'
      check:
        prompt: Hybridisation of C in CH₄?
        options:
        - sp³
        - sp²
        - sp
        answer: sp³
        why: Four σ bonds, tetrahedral.
    - teach: 'Molecular orbital theory: bond order = ½(bonding − antibonding electrons). Bond order 0 means the molecule does not exist (He₂). Unpaired electrons make a substance paramagnetic (O₂). Hydrogen bonds (H with F, O or N) raise boiling points.'
      picture:
        kind: compare
        columns:
        - title: Hybridisation
          points:
          - sp
          - sp²
          - sp³
        - title: Shape and angle
          points:
          - linear, 180°
          - trigonal planar, 120°
          - tetrahedral, 109.5°
        alt: Hybridisation and geometry.
      check:
        prompt: Bond order with 8 bonding and 4 antibonding electrons?
        options:
        - '2'
        - '4'
        - '6'
        answer: '2'
        why: ½(8 − 4).
  items:
  - prompt: What is the hybridisation of carbon in ethene, C₂H₄?
    options:
    - sp²
    - sp
    - sp³
    - sp³d
    answer: sp²
    difficulty: 1
    hints:
    - Double bond.
    - 3 σ bonds per carbon.
    solution: sp².
    mistakes: {"sp": "c11_hybrid_double", "sp³": "c11_hybrid_double", "sp³d": "c11_hybrid_double"}
  - prompt: How many σ bonds are there in ethene, C₂H₄?
    answer: '5'
    check: 4+1
    difficulty: 2
    hints:
    - 4 C–H + 1 C–C σ.
    - The double bond has one σ.
    solution: 5 σ bonds (and 1 π).
    mistakes: {"6": "c11_sigma_count", "4": "c11_sigma_count"}
  - prompt: N₂ has 10 bonding and 4 antibonding valence electrons. Find its bond order.
    answer: '3'
    check: (10-4)/2
    difficulty: 1
    hints:
    - (Nb − Na)/2.
    - (10 − 4)/2.
    solution: 3 (a triple bond).
    mistakes:
      '7': c11c_bo
  - prompt: He₂ would have 2 bonding and 2 antibonding electrons. What is its bond order?
    answer: '0'
    check: (2-2)/2
    difficulty: 1
    hints:
    - (2 − 2)/2.
    - Zero.
    solution: 0, so He₂ does not exist.
    mistakes: {"1": "c11_bond_order", "2": "c11_bond_order"}
  - prompt: 'Oxygen gas is paramagnetic because:'
    options:
    - it has two unpaired electrons in π* orbitals
    - it has a triple bond
    - all its electrons are paired
    - it is an ion
    answer: it has two unpaired electrons in π* orbitals
    difficulty: 2
    hints:
    - MO theory.
    - Hund's rule in π*.
    solution: MO theory gives O₂ two unpaired electrons.
    mistakes: {"it has a triple bond": "c11_o2_para", "all its electrons are paired": "c11_o2_para", "it is an ion": "c11_o2_para"}
  - prompt: 'Water has an unusually high boiling point because of:'
    options:
    - hydrogen bonding
    - ionic bonding
    - metallic bonding
    - its large molar mass
    answer: hydrogen bonding
    difficulty: 1
    hints:
    - O–H…O attraction.
    - Strong intermolecular force.
    solution: Hydrogen bonds between molecules.
    mistakes: {"ionic bonding": "c11_h_bond", "metallic bonding": "c11_h_bond", "its large molar mass": "c11_h_bond"}
  - prompt: Hybridisation of carbon in ethyne, C₂H₂?
    options:
    - sp
    - sp²
    - sp³
    answer: sp
    difficulty: 1
    hints:
    - Ethyne has a triple bond.
    - Each C forms two σ bonds.
    solution: 'Step 1: two σ bonds, linear. Step 2: sp.'
    mistakes:
      sp²: c11c04_mo
      sp³: c11c04_mo
  - prompt: How many π bonds are in ethyne, C₂H₂?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - A triple bond is 1σ + 2π.
    - C–H bonds are σ.
    solution: 'Step 1: one C≡C. Step 2: 2 π bonds.'
    mistakes:
      '3': c11c04_mo
      '1': c11c04_mo
  - prompt: 'Hydrogen bonding can occur when H is bonded to:'
    options:
    - F, O or N
    - C or S
    - any metal
    answer: F, O or N
    difficulty: 1
    hints:
    - It needs a very electronegative, small atom.
    - Think of HF, H₂O, NH₃.
    solution: 'Step 1: highly electronegative small atoms. Step 2: F, O, N.'
    mistakes:
      C or S: c11c04_mo
      any metal: c11c04_mo
  - prompt: O₂ has 10 bonding and 6 antibonding valence electrons. Find its bond order.
    answer: '2'
    check: (10-6)/2
    difficulty: 2
    hints:
    - Bond order = ½(Nb − Na).
    - ½ × 4.
    solution: 'Step 1: ½(10 − 6). Step 2: 2.'
    mistakes:
      '4': c11c04_mo
      '8': c11c04_mo
  - prompt: How many σ bonds are in ethane, C₂H₆?
    answer: '7'
    check: 6+1
    difficulty: 2
    hints:
    - Count six C–H bonds.
    - Plus one C–C.
    solution: 'Step 1: 6 + 1. Step 2: 7 σ bonds.'
    mistakes:
      '6': c11c04_mo
      '8': c11c04_mo
  - prompt: Hybridisation of the central atom in SF₆?
    options:
    - sp³d²
    - sp³d
    - sp³
    answer: sp³d²
    difficulty: 2
    hints:
    - Six bond pairs.
    - Octahedral needs six hybrid orbitals.
    solution: 'Step 1: 6 hybrid orbitals: s + 3p + 2d. Step 2: sp³d².'
    mistakes:
      sp³d: c11c04_mo
      sp³: c11c04_mo
  - prompt: Which species is diamagnetic?
    options:
    - N₂
    - O₂
    - B₂
    answer: N₂
    difficulty: 2
    hints:
    - Diamagnetic means every electron is paired.
    - O₂ and B₂ each have two unpaired electrons.
    solution: 'Step 1: N₂''s MOs are fully paired. Step 2: N₂.'
    mistakes:
      O₂: c11c04_mo
      B₂: c11c04_mo
  - prompt: Bond order of O₂⁺ (10 bonding, 5 antibonding)?
    answer: 5/2
    check: (10-5)/2
    difficulty: 3
    hints:
    - One electron is removed from an antibonding orbital.
    - ½(10 − 5).
    solution: 'Step 1: ½ × 5. Step 2: 2.5.'
    mistakes:
      '2': c11c04_mo
      '3': c11c04_mo
  - prompt: 'o-Nitrophenol boils lower than p-nitrophenol because o-nitrophenol has:'
    options:
    - intramolecular hydrogen bonds
    - no hydrogen bonds at all
    - ionic bonds
    answer: intramolecular hydrogen bonds
    difficulty: 3
    hints:
    - In the ortho form, –OH and –NO₂ sit side by side.
