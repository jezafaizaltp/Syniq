# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse11-chem
chapter: 8
title: 'Organic Chemistry: Some Basic Principles and Techniques'
tips:
  c11c_iupac: 'IUPAC name: find the longest chain, number from the end nearest the substituent, list prefixes alphabetically.'
  c11c_effect: Inductive effect works through σ bonds and fades with distance; resonance works through π electrons.
concepts:
- code: cbse11c.org.naming
  title: Structure, classification and IUPAC naming
  notes: |
    Carbon: tetravalent, catenation; hybridisation sp³/sp²/sp. Structural representations: complete, condensed, bond-line,
    3D (wedge-dash). Classification: acyclic, alicyclic, aromatic; functional groups; homologous series (differ by CH₂).
    IUPAC nomenclature: word root (meth, eth, prop, but, pent, hex...), primary suffix (-ane/-ene/-yne), secondary suffix
    (functional group: -ol, -al, -one, -oic acid), prefixes for substituents; lowest locant rule. Isomerism: structural
    (chain, position, functional group, metamerism) and stereoisomerism (geometrical, optical).
  explanations:
    text: 'Organic chemistry is the chemistry of carbon compounds. Carbon forms four bonds and long chains, so there are millions of compounds. IUPAC names describe a structure exactly: the root gives the chain length, the ending gives the functional group.'
    visual: 'Draw a chain of five carbons with an OH on the second: root ''pent'', ending ''-ol'', number 2: pentan-2-ol.'
    step_by_step: 'Step 1: Find the longest carbon chain with the functional group. Step 2: Number it so the group gets the lowest number. Step 3: Name and number substituents. Step 4: Put prefixes in alphabetical order.'
    real_world: Medicines have long IUPAC names (paracetamol is N-(4-hydroxyphenyl)acetamide) so chemists everywhere know the exact structure.
  picture:
    kind: compare
    columns:
    - title: Group
      points:
      - –OH
      - –CHO
      - C=O (in chain)
      - –COOH
    - title: Suffix
      points:
      - -ol
      - -al
      - -one
      - -oic acid
    alt: 'Functional groups and their IUPAC suffixes: alcohol -ol, aldehyde -al, ketone -one, carboxylic acid -oic acid.'
  items:
  - prompt: How many carbon atoms are in hexane?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - hex = 6.
    - Word root.
    solution: '6.'
  - prompt: Consecutive members of a homologous series differ by CH₂. Find the mass (in u) of this unit (C = 12, H = 1).
    answer: '14'
    check: 12+2*1
    difficulty: 1
    hints:
    - 12 + 2.
    - CH₂.
    solution: 14 u.
  - prompt: 'CH₃CH₂OH is named:'
    options:
    - ethanol
    - methanol
    - ethanal
    - ethanoic acid
    answer: ethanol
    difficulty: 1
    hints:
    - Two carbons.
    - –OH ending -ol.
    solution: Ethanol.
  - prompt: 'CH₃CH(CH₃)CH₂CH₃ is named:'
    options:
    - 2-methylbutane
    - 3-methylbutane
    - pentane
    - 2-ethylpropane
    answer: 2-methylbutane
    difficulty: 2
    hints:
    - Longest chain = 4.
    - Number from the nearer end.
    solution: 2-methylbutane.
    mistakes:
      3-methylbutane: c11c_iupac
  - prompt: 'Butane and 2-methylpropane are:'
    options:
    - chain isomers
    - position isomers
    - functional group isomers
    - the same compound
    answer: chain isomers
    difficulty: 2
    hints:
    - Same formula C₄H₁₀.
    - Different chains.
    solution: Chain isomers.
  - prompt: CH₃COCH₃ contains which functional group?
    options:
    - ketone
    - aldehyde
    - alcohol
    - ester
    answer: ketone
    difficulty: 1
    hints:
    - C=O in the middle.
    - Propanone.
    solution: A ketone (propanone).
- code: cbse11c.org.mechanism
  title: Reaction ideas and purification methods
  after:
  - cbse11c.org.naming
  notes: |
    Bond fission: homolytic (free radicals) and heterolytic (carbocations, carbanions). Carbocation stability: 3° > 2° > 1°
    > methyl (hyperconjugation, +I). Electrophiles (electron-seeking: H⁺, NO₂⁺) and nucleophiles (nucleus-seeking: OH⁻,
    CN⁻, NH₃). Electron displacement effects: inductive (−I: NO₂, halogens; +I: alkyl), resonance/mesomeric, electromeric,
    hyperconjugation. Reaction types: substitution, addition, elimination, rearrangement. Purification: sublimation,
    crystallisation, distillation (simple, fractional, under reduced pressure, steam), differential extraction,
    chromatography (Rf = distance by substance / distance by solvent). Qualitative analysis: Lassaigne's test; quantitative
    estimation of C, H, N (Dumas, Kjeldahl), halogens (Carius).
  explanations:
    text: Organic reactions happen when electron-rich species (nucleophiles) attack electron-poor ones (electrophiles). Groups can push or pull electrons along a molecule, making some sites more reactive. Chemists purify compounds by methods like distillation and chromatography.
    visual: 'Draw a paper chromatogram: a spot of ink near the bottom, solvent rising, the colours separating. Rf = distance the colour moved ÷ distance the solvent moved.'
    step_by_step: 'Step 1: Identify electron-rich and electron-poor sites. Step 2: Decide on the effect (inductive, resonance). Step 3: For purification, match the method to the property (boiling point, solubility, adsorption).'
    real_world: Crude oil is separated into petrol, diesel and kerosene by fractional distillation, because each fraction boils at a different temperature.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - crystallisation
      - distillation
      - chromatography
      - sublimation
    - title: Used when
      points:
      - solubility differs
      - boiling points differ
      - adsorption differs
      - solid turns straight to vapour
    alt: Purification methods and the property each one uses.
  items:
  - prompt: A spot moves 3 cm while the solvent moves 6 cm. Find Rf.
    answer: '0.5'
    check: Rational(3,6)
    difficulty: 1
    hints:
    - Rf = spot ÷ solvent.
    - 3/6.
    solution: 0.5.
  - prompt: Which carbocation is most stable?
    options:
    - tertiary
    - secondary
    - primary
    - methyl
    answer: tertiary
    difficulty: 2
    hints:
    - More alkyl groups.
    - Hyperconjugation.
    solution: Tertiary.
  - prompt: Which is a nucleophile?
    options:
    - OH⁻
    - H⁺
    - NO₂⁺
    - BF₃
    answer: OH⁻
    difficulty: 1
    hints:
    - Electron-rich.
    - Has a lone pair and charge.
    solution: OH⁻ is a nucleophile.
  - prompt: 'Breaking a bond so that each atom keeps one electron is called:'
    options:
    - homolytic fission
    - heterolytic fission
    - ionisation
    - hydrolysis
    answer: homolytic fission
    difficulty: 2
    hints:
    - Gives free radicals.
    - Equal split.
    solution: Homolytic fission.
  - prompt: The –NO₂ group shows which inductive effect?
    options:
    - −I (pulls electrons)
    - +I (pushes electrons)
    - no effect
    - +R only
    answer: −I (pulls electrons)
    difficulty: 2
    hints:
    - Very electronegative.
    - Withdraws.
    solution: −I effect.
    mistakes:
      +I (pushes electrons): c11c_effect
  - prompt: 'Liquids with close boiling points are separated by:'
    options:
    - fractional distillation
    - simple distillation
    - sublimation
    - filtration
    answer: fractional distillation
    difficulty: 1
    hints:
    - Fractionating column.
    - Many vaporisations.
    solution: Fractional distillation.
