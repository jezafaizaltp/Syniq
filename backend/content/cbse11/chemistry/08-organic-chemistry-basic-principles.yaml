# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse11-chem
chapter: 8
title: 'Organic Chemistry: Some Basic Principles and Techniques'
tips:
  c11c_iupac: 'IUPAC name: find the longest chain, number from the end nearest the substituent, list prefixes alphabetically.'
  c11c_effect: Inductive effect works through σ bonds and fades with distance; resonance works through π electrons.
  c11_carbocation: "More alkyl groups push electrons into the positive carbon, spreading the charge."
  c11_ch2: "One C + two H."
  c11_chain_isomer: "Same formula, C₄H₁₀, but one is straight and one branched. The carbon skeleton differs."
  c11_fractional: "Simple distillation works when boiling points are far apart. For close ones you need a column."
  c11_homolytic: "'Homo' means same: each side gets the same share, one electron each."
  c11_iupac_alcohol: "Two carbons = 'eth'. –OH ends in '-ol', –CHO in '-al', –COOH in '-oic acid'."
  c11_ketone: "C=O in the middle of the chain, flanked by two carbons. An aldehyde has C=O at the end."
  c11_nucleophile: "'Nucleus-loving' species have spare electrons to donate. Which one is negatively charged?"
  c11_prefix: "Meth 1, eth 2, prop 3, but 4, pent 5, ... 'Hex' as in hexagon."
  c11_rf: "Rf = distance moved by spot ÷ distance moved by solvent."
  c11c08_name: Find the longest carbon chain for the word root, number from the end nearer the main group or branch, then add prefixes and suffixes.
  c11c08_effect: Alkyl groups push electrons (+I) and steady a positive carbon; groups like –NO₂ and halogens pull electrons (−I).
  c11c08_sep: 'Choose the method by the property that differs: boiling point (distillation), solubility (crystallisation, extraction) or how far a spot travels (chromatography).'
concepts:
- code: cbse11c.org.naming
  title: Structure, classification and IUPAC naming
  notes: |
    Carbon: tetravalent, catenation; hybridisation sp³/sp²/sp. Structural representations: complete, condensed, bond-line,
    3D (wedge-dash). Classification: acyclic, alicyclic, aromatic; functional groups; homologous series (differ by CH₂).
    IUPAC nomenclature: word root (meth, eth, prop, but, pent, hex...), primary suffix (-ane/-ene/-yne), secondary suffix
    (functional group: -ol, -al, -one, -oic acid), prefixes for substituents; lowest locant rule. Isomerism: structural
    (chain, position, functional group, metamerism) and stereoisomerism (geometrical, optical).
  explanations:
    text: 'Organic chemistry is the chemistry of carbon compounds. Carbon forms four bonds and long chains, so there are millions of compounds. IUPAC names describe a structure exactly: the root gives the chain length, the ending gives the functional group.'
    visual: 'Draw a chain of five carbons with an OH on the second: root ''pent'', ending ''-ol'', number 2: pentan-2-ol.'
    step_by_step: 'Step 1: Find the longest carbon chain with the functional group. Step 2: Number it so the group gets the lowest number. Step 3: Name and number substituents. Step 4: Put prefixes in alphabetical order.'
    real_world: Medicines have long IUPAC names (paracetamol is N-(4-hydroxyphenyl)acetamide) so chemists everywhere know the exact structure.
  picture:
    kind: compare
    columns:
    - title: Group
      points:
      - –OH
      - –CHO
      - C=O (in chain)
      - –COOH
    - title: Suffix
      points:
      - -ol
      - -al
      - -one
      - -oic acid
    alt: 'Functional groups and their IUPAC suffixes: alcohol -ol, aldehyde -al, ketone -one, carboxylic acid -oic acid.'
  activity:
    type: sort
    prompt: Which suffix does its IUPAC name end in? Look for the functional group.
    bins:
    - -ol
    - -al
    - -one
    - -oic acid
    - -ene
    items:
    - label: CH₃CH₂OH
      bin: -ol
      clue: 'Which group is at the end: –OH, –CHO or –COOH?'
      why: 'An –OH group on a saturated carbon: an alcohol, ethanol.'
    - label: CH₃CH(OH)CH₃
      bin: -ol
      clue: What is attached to the middle carbon?
      why: 'An –OH group: propan-2-ol.'
    - label: CH₃CHO
      bin: -al
      clue: Is the C=O at the end of the chain, with an H on it?
      why: '–CHO at the end of the chain is an aldehyde: ethanal.'
    - label: HCHO
      bin: -al
      clue: One carbon with C=O and H. Which family?
      why: Methanal, the simplest aldehyde.
    - label: CH₃COCH₃
      bin: -one
      clue: Is the C=O in the middle, between two carbons?
      why: 'C=O in the middle of a chain is a ketone: propanone.'
    - label: CH₃COCH₂CH₃
      bin: -one
      clue: 'Where is the C=O: at an end or inside the chain?'
      why: 'C=O inside the chain: butan-2-one.'
    - label: CH₃COOH
      bin: -oic acid
      clue: Is there an –OH on the same carbon as the C=O?
      why: '–COOH is a carboxylic acid: ethanoic acid.'
    - label: CH₃CH₂COOH
      bin: -oic acid
      clue: Count the carbons, including the one in –COOH. Which group is it?
      why: 'Three carbons ending in –COOH: propanoic acid.'
    - label: CH₂=CH₂
      bin: -ene
      clue: Is there a C=C double bond?
      why: 'A C=C double bond: ethene, an alkene.'
    - label: CH₃CH=CHCH₃
      bin: -ene
      clue: Any O at all? Look for a double bond between carbons.
      why: 'C=C in the middle of four carbons: but-2-ene.'
  lesson:
    - teach: Carbon forms four bonds and links into long chains and rings (catenation). Compounds are grouped by functional group, and a homologous series (methane, ethane, propane …) differs by one CH₂ each step.
      check:
        prompt: Next member after C₂H₆ in the alkane series?
        options:
        - C₃H₈
        - C₃H₆
        - C₂H₄
        answer: C₃H₈
        why: Add CH₂.
    - teach: 'IUPAC names: word root for the longest chain (meth 1, eth 2, prop 3, but 4, pent 5, hex 6) + primary suffix for bonds (-ane, -ene, -yne) + secondary suffix for the main group (-ol, -al, -one, -oic acid). Number the chain to give the lowest locants.'
      check:
        prompt: 'CH₃CH₂CH₂OH is named:'
        options:
        - propan-1-ol
        - propanal
        - propan-2-ol
        answer: propan-1-ol
        why: 3 carbons, –OH on carbon 1.
    - teach: Isomers share a molecular formula but differ in structure. Structural isomers differ in chain, position or functional group; stereoisomers differ only in 3D arrangement (geometrical cis/trans, optical).
      picture:
        kind: compare
        columns:
        - title: Group
          points:
          - –OH
          - –CHO
          - C=O (in chain)
          - –COOH
        - title: Suffix
          points:
          - -ol
          - -al
          - -one
          - -oic acid
        alt: Functional groups and their name endings.
      check:
        prompt: 'Ethanol and dimethyl ether (both C₂H₆O) are:'
        options:
        - functional group isomers
        - chain isomers
        - the same compound
        answer: functional group isomers
        why: Alcohol vs ether.
  items:
  - prompt: How many carbon atoms are in hexane?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - hex = 6.
    - Word root.
    solution: '6.'
    mistakes: {"5": "c11_prefix", "4": "c11_prefix", "8": "c11_prefix"}
  - prompt: Consecutive members of a homologous series differ by CH₂. Find the mass (in u) of this unit (C = 12, H = 1).
    answer: '14'
    check: 12+2*1
    difficulty: 1
    hints:
    - 12 + 2.
    - CH₂.
    solution: 14 u.
    mistakes: {"12": "c11_ch2", "13": "c11_ch2", "16": "c11_ch2"}
  - prompt: 'CH₃CH₂OH is named:'
    options:
    - ethanol
    - methanol
    - ethanal
    - ethanoic acid
    answer: ethanol
    difficulty: 1
    hints:
    - Two carbons.
    - –OH ending -ol.
    solution: Ethanol.
    mistakes: {"methanol": "c11_iupac_alcohol", "ethanal": "c11_iupac_alcohol", "ethanoic acid": "c11_iupac_alcohol"}
  - prompt: 'CH₃CH(CH₃)CH₂CH₃ is named:'
    options:
    - 2-methylbutane
    - 3-methylbutane
    - pentane
    - 2-ethylpropane
    answer: 2-methylbutane
    difficulty: 2
    hints:
    - Longest chain = 4.
    - Number from the nearer end.
    solution: 2-methylbutane.
    mistakes:
      3-methylbutane: c11c_iupac
  - prompt: 'Butane and 2-methylpropane are:'
    options:
    - chain isomers
    - position isomers
    - functional group isomers
    - the same compound
    answer: chain isomers
    difficulty: 2
    hints:
    - Same formula C₄H₁₀.
    - Different chains.
    solution: Chain isomers.
    mistakes: {"position isomers": "c11_chain_isomer", "functional group isomers": "c11_chain_isomer", "the same compound": "c11_chain_isomer"}
  - prompt: CH₃COCH₃ contains which functional group?
    options:
    - ketone
    - aldehyde
    - alcohol
    - ester
    answer: ketone
    difficulty: 1
    hints:
    - C=O in the middle.
    - Propanone.
    solution: A ketone (propanone).
    mistakes: {"aldehyde": "c11_ketone", "alcohol": "c11_ketone", "ester": "c11_ketone"}
  - prompt: How many carbon atoms are in pentane?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - '''Pent'' is the word root.'
    - Think of a pentagon.
    solution: 'Step 1: pent = 5. Step 2: 5.'
    mistakes:
      '6': c11c08_name
      '4': c11c08_name
  - prompt: 'HCHO is named:'
    options:
    - methanal
    - methanol
    - methanoic acid
    answer: methanal
    difficulty: 1
    hints:
    - One carbon with a –CHO group.
    - Aldehydes end in -al.
    solution: 'Step 1: meth + -al. Step 2: methanal.'
    mistakes:
      methanol: c11c08_name
      methanoic acid: c11c08_name
  - prompt: CH₃COOH contains which functional group?
    options:
    - carboxylic acid
    - aldehyde
    - ketone
    answer: carboxylic acid
    difficulty: 1
    hints:
    - Look at –COOH.
    - It is in vinegar.
    solution: 'Step 1: –COOH. Step 2: carboxylic acid.'
    mistakes:
      aldehyde: c11c08_name
      ketone: c11c08_name
  - prompt: Molecular formula of the alkane with 8 carbons? Give the number of H atoms.
    answer: '18'
    check: 2*8+2
    difficulty: 2
    hints:
    - Alkanes are CₙH₂ₙ₊₂.
    - n = 8.
    solution: 'Step 1: 2 × 8 + 2. Step 2: 18.'
    mistakes:
      '16': c11c08_name
      '14': c11c08_name
  - prompt: 'CH₃CH₂CH(OH)CH₃ is named:'
    options:
    - butan-2-ol
    - butan-3-ol
    - butan-1-ol
    answer: butan-2-ol
    difficulty: 2
    hints:
    - Four carbons with –OH.
    - Number to give the –OH the lowest locant.
    solution: 'Step 1: numbering from the right puts –OH on C2. Step 2: butan-2-ol.'
    mistakes:
      butan-3-ol: c11c08_name
      butan-1-ol: c11c08_name
  - prompt: 'Propan-1-ol and propan-2-ol are:'
    options:
    - position isomers
    - chain isomers
    - functional group isomers
    answer: position isomers
    difficulty: 2
    hints:
    - Same chain and same group.
    - Only the place of –OH differs.
    solution: 'Step 1: –OH moves from C1 to C2. Step 2: position isomers.'
    mistakes:
      chain isomers: c11c08_name
      functional group isomers: c11c08_name
  - prompt: Which compound can show cis–trans (geometrical) isomerism?
    options:
    - but-2-ene
    - but-1-ene
    - propene
    answer: but-2-ene
    difficulty: 2
    hints:
    - Each C of the double bond needs two different groups.
    - Check the end carbon of but-1-ene and propene.
    solution: 'Step 1: in but-2-ene each C=C carbon has H and CH₃. Step 2: cis and trans exist.'
    mistakes:
      but-1-ene: c11c08_name
      propene: c11c08_name
  - prompt: '(CH₃)₃C–CH₃ is named:'
    options:
    - 2,2-dimethylpropane
    - tetramethylmethane
    - 2-methylbutane
    answer: 2,2-dimethylpropane
    difficulty: 3
    hints:
    - 'Longest chain: 3 carbons.'
    - Two methyls on the middle carbon.
    solution: 'Step 1: propane chain. Step 2: methyls on C2 twice: 2,2-dimethylpropane.'
    mistakes:
      tetramethylmethane: c11c08_name
      2-methylbutane: c11c08_name
  - prompt: How many structural isomers does C₅H₁₂ have?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - Straight chain, one branch, two branches.
    - Pentane, 2-methylbutane, 2,2-dimethylpropane.
    solution: 'Step 1: list the three skeletons. Step 2: 3.'
    mistakes:
      '2': c11c08_name
      '5': c11c08_name
- code: cbse11c.org.mechanism
  title: Reaction ideas and purification methods
  after:
  - cbse11c.org.naming
  notes: |
    Bond fission: homolytic (free radicals) and heterolytic (carbocations, carbanions). Carbocation stability: 3° > 2° > 1°
    > methyl (hyperconjugation, +I). Electrophiles (electron-seeking: H⁺, NO₂⁺) and nucleophiles (nucleus-seeking: OH⁻,
    CN⁻, NH₃). Electron displacement effects: inductive (−I: NO₂, halogens; +I: alkyl), resonance/mesomeric, electromeric,
    hyperconjugation. Reaction types: substitution, addition, elimination, rearrangement. Purification: sublimation,
    crystallisation, distillation (simple, fractional, under reduced pressure, steam), differential extraction,
    chromatography (Rf = distance by substance / distance by solvent). Qualitative analysis: Lassaigne's test; quantitative
    estimation of C, H, N (Dumas, Kjeldahl), halogens (Carius).
  explanations:
    text: Organic reactions happen when electron-rich species (nucleophiles) attack electron-poor ones (electrophiles). Groups can push or pull electrons along a molecule, making some sites more reactive. Chemists purify compounds by methods like distillation and chromatography.
    visual: 'Draw a paper chromatogram: a spot of ink near the bottom, solvent rising, the colours separating. Rf = distance the colour moved ÷ distance the solvent moved.'
    step_by_step: 'Step 1: Identify electron-rich and electron-poor sites. Step 2: Decide on the effect (inductive, resonance). Step 3: For purification, match the method to the property (boiling point, solubility, adsorption).'
    real_world: Crude oil is separated into petrol, diesel and kerosene by fractional distillation, because each fraction boils at a different temperature.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - crystallisation
      - distillation
      - chromatography
      - sublimation
    - title: Used when
      points:
      - solubility differs
      - boiling points differ
      - adsorption differs
      - solid turns straight to vapour
    alt: Purification methods and the property each one uses.
  activity:
    type: order
    prompt: Put these carbocations in order of stability, least stable first.
    steps:
    - CH₃⁺ (methyl)
    - CH₃CH₂⁺ (primary, 1°)
    - (CH₃)₂CH⁺ (secondary, 2°)
    - (CH₃)₃C⁺ (tertiary, 3°)
    reasons:
      CH₃CH₂⁺ (primary, 1°): One alkyl group pushes electrons toward the positive carbon (+I effect and hyperconjugation), so it is more stable than CH₃⁺, which has none.
      (CH₃)₂CH⁺ (secondary, 2°): Two alkyl groups spread the positive charge more than one can.
      (CH₃)₃C⁺ (tertiary, 3°): Three alkyl groups give the most electron push and the most hyperconjugation, so this is the most stable.
  lesson:
    - teach: 'A covalent bond can break two ways. Homolytic: each atom keeps one electron (free radicals). Heterolytic: one atom takes both (a carbocation, positive, and a carbanion or anion).'
      check:
        prompt: 'Cl–Cl → 2Cl• in sunlight is:'
        options:
        - homolytic fission
        - heterolytic fission
        - ionisation
        answer: homolytic fission
        why: Each Cl keeps one electron.
    - teach: 'Electrophiles seek electrons (H⁺, NO₂⁺, carbocations). Nucleophiles seek a positive centre and bring a lone pair (OH⁻, CN⁻, NH₃). Alkyl groups push electrons (+I) and steady carbocations: 3° > 2° > 1° > methyl.'
      check:
        prompt: Which is an electrophile?
        options:
        - NO₂⁺
        - NH₃
        - Cl⁻
        answer: NO₂⁺
        why: Positive and electron-hungry.
    - teach: 'Purification: crystallisation (solids), distillation by boiling point (fractional for close values, steam for volatile, water-insoluble ones), extraction, and chromatography where Rf = distance moved by spot ÷ distance moved by solvent.'
      picture:
        kind: compare
        columns:
        - title: Carbocation
          points:
          - 3°
          - 2°
          - 1°
          - methyl
        - title: Stability
          points:
          - most
          - more
          - less
          - least
        alt: Carbocation stability order.
      check:
        prompt: Spot 2 cm, solvent 8 cm. Rf?
        options:
        - '0.25'
        - '4'
        - '0.75'
        answer: '0.25'
        why: 2 ÷ 8.
  items:
  - prompt: A spot moves 3 cm while the solvent moves 6 cm. Find Rf.
    answer: '0.5'
    check: Rational(3,6)
    difficulty: 1
    hints:
    - Rf = spot ÷ solvent.
    - 3/6.
    solution: 0.5.
    mistakes: {"2": "c11_rf", "3": "c11_rf"}
  - prompt: Which carbocation is most stable?
    options:
    - tertiary
    - secondary
    - primary
    - methyl
    answer: tertiary
    difficulty: 2
    hints:
    - More alkyl groups.
    - Hyperconjugation.
    solution: Tertiary.
    mistakes: {"secondary": "c11_carbocation", "primary": "c11_carbocation", "methyl": "c11_carbocation"}
  - prompt: Which is a nucleophile?
    options:
    - OH⁻
    - H⁺
    - NO₂⁺
    - BF₃
    answer: OH⁻
    difficulty: 1
    hints:
    - Electron-rich.
    - Has a lone pair and charge.
    solution: OH⁻ is a nucleophile.
    mistakes: {"H⁺": "c11_nucleophile", "NO₂⁺": "c11_nucleophile", "BF₃": "c11_nucleophile"}
  - prompt: 'Breaking a bond so that each atom keeps one electron is called:'
    options:
    - homolytic fission
    - heterolytic fission
    - ionisation
    - hydrolysis
    answer: homolytic fission
    difficulty: 2
    hints:
    - Gives free radicals.
    - Equal split.
    solution: Homolytic fission.
    mistakes: {"heterolytic fission": "c11_homolytic", "ionisation": "c11_homolytic", "hydrolysis": "c11_homolytic"}
  - prompt: The –NO₂ group shows which inductive effect?
    options:
    - −I (pulls electrons)
    - +I (pushes electrons)
    - no effect
    - +R only
    answer: −I (pulls electrons)
    difficulty: 2
    hints:
    - Very electronegative.
    - Withdraws.
    solution: −I effect.
    mistakes:
      +I (pushes electrons): c11c_effect
  - prompt: 'Liquids with close boiling points are separated by:'
    options:
    - fractional distillation
    - simple distillation
    - sublimation
    - filtration
    answer: fractional distillation
    difficulty: 1
    hints:
    - Fractionating column.
    - Many vaporisations.
    solution: Fractional distillation.
    mistakes: {"simple distillation": "c11_fractional", "sublimation": "c11_fractional", "filtration": "c11_fractional"}
  - prompt: A spot moves 4.5 cm while the solvent moves 9 cm. Find Rf.
    answer: '0.5'
    check: 4.5/9
    difficulty: 1
    hints:
    - Rf = spot distance ÷ solvent distance.
    - 4.5 ÷ 9.
    solution: 'Step 1: 4.5/9. Step 2: 0.5.'
    mistakes:
      '2': c11c08_sep
      '13.5': c11c08_sep
  - prompt: Pick the nucleophile.
    options:
    - CN⁻
    - H⁺
    - BF₃
    answer: CN⁻
    difficulty: 1
    hints:
    - Nucleophiles carry a lone pair to share.
    - Usually negative or neutral with lone pairs.
    solution: 'Step 1: CN⁻ has a lone pair and a negative charge. Step 2: nucleophile.'
    mistakes:
      H⁺: c11c08_effect
      BF₃: c11c08_effect
  - prompt: 'A mixture of a solid that sublimes and one that does not is best separated by:'
    options:
    - sublimation
    - distillation
    - chromatography
    answer: sublimation
    difficulty: 1
    hints:
    - One solid turns straight to vapour.
    - Collect it on a cool surface.
    solution: 'Step 1: heat; the subliming solid leaves. Step 2: sublimation.'
    mistakes:
      distillation: c11c08_sep
      chromatography: c11c08_sep
  - prompt: Which carbocation is least stable?
    options:
    - CH₃⁺
    - (CH₃)₂CH⁺
    - (CH₃)₃C⁺
    answer: CH₃⁺
    difficulty: 2
    hints:
    - Alkyl groups push electrons and steady the charge.
    - Which has no alkyl group?
    solution: 'Step 1: methyl has no +I support. Step 2: least stable.'
    mistakes:
      (CH₃)₂CH⁺: c11c08_effect
      (CH₃)₃C⁺: c11c08_effect
  - prompt: 'Aniline (insoluble in water, volatile in steam) is purified by:'
    options:
    - steam distillation
    - simple crystallisation
    - sublimation
    answer: steam distillation
    difficulty: 2
    hints:
    - It is a liquid that does not mix with water.
    - It carries over with steam.
    solution: 'Step 1: steam-volatile, water-insoluble. Step 2: steam distillation.'
    mistakes:
      simple crystallisation: c11c08_sep
      sublimation: c11c08_sep
  - prompt: CH₃CH₂Br + OH⁻ → CH₃CH₂OH + Br⁻ is which type of reaction?
    options:
    - substitution
    - addition
    - elimination
    answer: substitution
    difficulty: 2
    hints:
    - One group replaces another.
    - Br leaves, OH comes in.
    solution: 'Step 1: OH takes Br''s place. Step 2: substitution.'
    mistakes:
      addition: c11c08_effect
      elimination: c11c08_effect
  - prompt: Which acid is stronger because of the −I effect of chlorine?
    options:
    - ClCH₂COOH
    - CH₃COOH
    - CH₃CH₂COOH
    answer: ClCH₂COOH
    difficulty: 2
    hints:
    - Electron-pulling groups steady the anion.
    - Which acid has a chlorine?
    solution: 'Step 1: Cl pulls electrons, steadying the anion. Step 2: chloroacetic acid.'
    mistakes:
      CH₃COOH: c11c08_effect
      CH₃CH₂COOH: c11c08_effect
  - prompt: 'In Lassaigne''s test, nitrogen gives a Prussian blue colour. This comes from:'
    options:
    - sodium cyanide formed during fusion
    - sodium sulfide
    - sodium chloride
    answer: sodium cyanide formed during fusion
    difficulty: 3
    hints:
    - Fusing with sodium turns N into a sodium salt.
    - That salt contains CN⁻.
    solution: 'Step 1: Na + C + N → NaCN. Step 2: with Fe salts gives Prussian blue.'
    mistakes:
      sodium sulfide: c11c08_sep
      sodium chloride: c11c08_sep
  - prompt: 'Hyperconjugation in a carbocation involves:'
    options:
    - σ electrons of C–H bonds next to the positive carbon
    - lone pairs on oxygen
    - π electrons of benzene
    answer: σ electrons of C–H bonds next to the positive carbon
    difficulty: 3
    hints:
    - It is also called no-bond resonance.
    - More neighbouring C–H bonds means more of it.
    solution: 'Step 1: adjacent C–H σ electrons spread into the empty p orbital. Step 2: that steadies the ion.'
    mistakes:
      lone pairs on oxygen: c11c08_effect
      π electrons of benzene: c11c08_effect
