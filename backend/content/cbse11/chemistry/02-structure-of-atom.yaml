# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse11-chem
chapter: 2
title: Structure of Atom
tips:
  c11c_quantum: For a given n, l runs from 0 to n − 1, and m from −l to +l. Orbitals in a shell = n².
  c11c_aufbau: 'Fill orbitals in order of n + l: 1s 2s 2p 3s 3p 4s 3d 4p... 4s fills before 3d.'
  c11_bohr_energy: "Eₙ = −13.6/n² eV. Square n before dividing; the sign stays negative."
  c11_bohr_radius: "rₙ ∝ n². For n = 2, multiply r₁ by 2²."
  c11_config: "Fill in order 1s, 2s, 2p, 3s. A p subshell holds at most 6 electrons."
  c11_d_orbitals: "Orbitals in a subshell = 2l + 1, with l = 2 for d."
  c11_de_broglie: "de Broglie extended wave–particle duality to matter: λ = h/p."
  c11_isotopes: "These atoms have the same Z, so they sit in the same place in the periodic table, but different A. The Greek for 'same place' names them."
  c11_neutrons: "Neutrons = mass number − atomic number."
  c11_rutherford: "Most α-particles went straight through, a very few bounced back. What does that say about where mass and charge are?"
  c11_shell_max: "Maximum electrons in shell n = 2n²."
concepts:
- code: cbse11c.atom.models
  title: Particles, atomic models and Bohr's model
  notes: |
    Electron (J.J. Thomson, cathode rays, e/m), proton, neutron (Chadwick). Thomson's plum-pudding model; Rutherford's
    α-scattering: tiny dense positive nucleus; failure: could not explain stability or line spectra. Atomic number Z
    (protons), mass number A (protons + neutrons); isotopes, isobars. Electromagnetic radiation: c = νλ; Planck E = hν;
    photoelectric effect. Line spectrum of hydrogen. Bohr's model: fixed energy orbits, Eₙ = −2.18 × 10⁻¹⁸ (Z²/n²) J,
    angular momentum mvr = nh/2π, radius rₙ = 52.9 n²/Z pm. Limitations; de Broglie λ = h/mv; Heisenberg uncertainty.
  explanations:
    text: Atoms have a tiny heavy nucleus of protons and neutrons, with electrons around it. Rutherford found the nucleus; Bohr suggested electrons sit in fixed energy levels and give out light of exact colours when they jump down.
    visual: Draw circles around a nucleus labelled n = 1, 2, 3. An electron jumping from n = 3 to n = 2 gives out a photon with exactly the energy difference.
    step_by_step: 'Step 1: Protons = Z. Step 2: Neutrons = A − Z. Step 3: Electrons = Z for a neutral atom. Step 4: For Bohr, energy ∝ −Z²/n².'
    real_world: Street lamps glow yellow because sodium electrons all drop between the same two energy levels.
  picture:
    kind: compare
    columns:
    - title: Model
      points:
      - Thomson
      - Rutherford
      - Bohr
    - title: Key idea
      points:
      - positive sphere with electrons
      - tiny dense nucleus
      - fixed energy levels
    alt: 'Three atomic models: Thomson''s sphere, Rutherford''s nucleus and Bohr''s energy levels.'
  activity:
    type: formula
    prompt: In Bohr's hydrogen atom, Eₙ = −13.6 ÷ n² eV. An electron falling from an upper level to a lower one gives a photon of λ = 1240 ÷ ΔE nm.
    inputs:
    - name: u
      label: Upper level
      min: 2
      max: 7
      step: 1
      start: 2
    - name: d
      label: Lower level
      min: 1
      max: 6
      step: 1
      start: 1
    outputs:
    - name: e
      label: Energy given out ΔE
      expr: 13.6*abs(1/d^2-1/u^2)
      unit: eV
      places: 2
    - name: lam
      label: Wavelength
      expr: 1240/max(0.1,13.6*abs(1/d^2-1/u^2))
      unit: nm
      places: 1
    goals:
    - prompt: Make the red Balmer line, near 656 nm.
      want:
        lam:
        - 650
        - 660
      mistakes:
      - when:
          d: 1
        say: Lines ending on n = 1 are the Lyman series, ultraviolet. Visible Balmer lines end on n = 2.
      - when:
          u: 4
          d: 2
        say: 4 → 2 gives 486 nm, blue-green. Red is the smallest Balmer jump, so the least energy.
    - prompt: Make a jump that gives out 12.09 eV.
      want:
        e:
        - 12
        - 12.2
      mistakes:
      - when:
          d: 2
        say: Any fall to n = 2 gives out at most 3.4 eV. Big energies come from falls to n = 1.
    - prompt: Make the Balmer line with the shortest wavelength these levels allow.
      want:
        u: 7
        d: 2
      mistakes:
      - when:
          u: 3
          d: 2
        say: 'That''s the longest Balmer line, the red one. Shorter wavelength means more energy: a bigger fall.'
  items:
  - prompt: How many neutrons are in an atom with Z = 17 and A = 35?
    answer: '18'
    check: 35-17
    difficulty: 1
    hints:
    - A − Z.
    - 35 − 17.
    solution: 18 neutrons.
    mistakes: {"17": "c11_neutrons", "35": "c11_neutrons", "52": "c11_neutrons"}
  - prompt: Bohr radius of hydrogen's n = 1 orbit is 52.9 pm. Find the radius (in pm) of its n = 2 orbit.
    answer: '211.6'
    check: Rational(529,10)*4
    difficulty: 2
    hints:
    - r ∝ n².
    - 52.9 × 4.
    solution: 211.6 pm.
    mistakes: {"105.8": "c11_bohr_radius", "26.45": "c11_bohr_radius"}
  - prompt: If the energy of hydrogen's n = 1 level is −13.6 eV, find the energy (in eV) of n = 2.
    answer: '-3.4'
    check: Rational(-136,10)/4
    difficulty: 2
    hints:
    - E ∝ 1/n².
    - −13.6 ÷ 4.
    solution: −3.4 eV.
    mistakes: {"-6.8": "c11_bohr_energy", "3.4": "c11_bohr_energy", "-27.2": "c11_bohr_energy"}
  - prompt: 'Rutherford''s α-particle experiment showed that:'
    options:
    - the atom has a tiny dense positive nucleus
    - electrons are in fixed orbits
    - atoms are indivisible
    - neutrons exist
    answer: the atom has a tiny dense positive nucleus
    difficulty: 1
    hints:
    - Most passed straight through.
    - A few bounced back.
    solution: A tiny, dense, positive nucleus.
    mistakes: {"electrons are in fixed orbits": "c11_rutherford", "atoms are indivisible": "c11_rutherford", "neutrons exist": "c11_rutherford"}
  - prompt: 'Atoms of the same element with different mass numbers are called:'
    options:
    - isotopes
    - isobars
    - isotones
    - allotropes
    answer: isotopes
    difficulty: 1
    hints:
    - Same Z.
    - Different A.
    solution: Isotopes.
    mistakes: {"isobars": "c11_isotopes", "isotones": "c11_isotopes", "allotropes": "c11_isotopes"}
  - prompt: 'de Broglie said that moving particles have:'
    options:
    - a wavelength λ = h/mv
    - no mass
    - fixed orbits
    - zero momentum
    answer: a wavelength λ = h/mv
    difficulty: 2
    hints:
    - Matter waves.
    - Wave–particle.
    solution: λ = h/mv.
    mistakes: {"no mass": "c11_de_broglie", "fixed orbits": "c11_de_broglie", "zero momentum": "c11_de_broglie"}
- code: cbse11c.atom.quantum
  title: Quantum numbers and electronic configuration
  after:
  - cbse11c.atom.models
  notes: |
    Quantum mechanical model (Schrödinger); orbitals as regions of high probability. Quantum numbers: principal n (shell,
    size), azimuthal l = 0…n−1 (subshell s, p, d, f; shape), magnetic m = −l…+l (orientation), spin s = ±½. Orbitals per
    subshell 2l + 1; electrons per shell 2n². Aufbau (n + l rule), Pauli exclusion (no two electrons with the same four
    quantum numbers), Hund's rule (fill singly first). Exceptions: Cr 3d⁵4s¹, Cu 3d¹⁰4s¹ (half/full-filled stability).
  explanations:
    text: 'Each electron has an address made of four quantum numbers: shell, subshell, orbital and spin. Electrons fill the lowest energy orbitals first, at most two per orbital with opposite spins, and spread out in equal orbitals before pairing.'
    visual: 'Draw boxes for orbitals: one box for 1s, one for 2s, three for 2p. Fill nitrogen''s 7 electrons: 2 in 1s, 2 in 2s, then one in each 2p box (Hund''s rule).'
    step_by_step: 'Step 1: Count the electrons. Step 2: Fill in order 1s 2s 2p 3s 3p 4s 3d 4p. Step 3: s holds 2, p 6, d 10. Step 4: Watch for Cr and Cu exceptions.'
    real_world: The colours of fireworks come from electrons of different metals jumping between orbitals.
  picture:
    kind: flow
    steps:
    - 1s
    - 2s
    - 2p
    - 3s
    - 3p
    - 4s
    - 3d
    - 4p
    alt: 'Order of filling orbitals by the Aufbau principle: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p.'
  activity:
    type: sort
    prompt: Can an electron have this set of quantum numbers (n, l, mₗ, mₛ)?
    bins:
    - Possible
    - Impossible
    items:
    - label: n = 2, l = 1, mₗ = 0, mₛ = +½
      bin: Possible
      clue: 'Check: l < n? mₗ between −l and +l?'
      why: 'A 2p electron: l = 1 < 2, mₗ = 0 is in −1 … +1, mₛ = +½.'
    - label: n = 1, l = 1, mₗ = 0, mₛ = +½
      bin: Impossible
      clue: How large can l be when n = 1?
      why: l goes from 0 to n − 1, so n = 1 allows only l = 0. There is no 1p.
    - label: n = 3, l = 2, mₗ = −2, mₛ = −½
      bin: Possible
      clue: Is −2 inside −l … +l?
      why: 'A 3d electron: mₗ = −2 is in −2 … +2.'
    - label: n = 2, l = 0, mₗ = 1, mₛ = +½
      bin: Impossible
      clue: When l = 0, which values can mₗ take?
      why: mₗ runs from −l to +l, so l = 0 allows only mₗ = 0.
    - label: n = 3, l = 1, mₗ = −1, mₛ = 0
      bin: Impossible
      clue: What values can spin take?
      why: mₛ is only +½ or −½; 0 isn't a spin.
    - label: n = 4, l = 3, mₗ = +3, mₛ = +½
      bin: Possible
      clue: Is l = 3 below n = 4? Is +3 inside −3 … +3?
      why: 'A 4f electron: every rule holds.'
    - label: n = 0, l = 0, mₗ = 0, mₛ = +½
      bin: Impossible
      clue: Which number does the shell count start at?
      why: n starts at 1; there's no shell 0.
    - label: n = 3, l = 3, mₗ = 0, mₛ = −½
      bin: Impossible
      clue: Can l equal n?
      why: l can be at most n − 1, so n = 3 has no l = 3 (there is no 3f).
    - label: n = 4, l = 2, mₗ = −1, mₛ = −½
      bin: Possible
      clue: Check each rule in turn.
      why: 'A 4d electron: l < n, mₗ in −2 … +2, spin −½.'
  items:
  - prompt: What is the maximum number of electrons in the n = 3 shell?
    answer: '18'
    check: 2*3**2
    difficulty: 1
    hints:
    - 2n².
    - 2 × 9.
    solution: '18.'
    mistakes: {"8": "c11_shell_max", "9": "c11_shell_max", "32": "c11_shell_max"}
  - prompt: How many orbitals are in a d subshell?
    answer: '5'
    check: 2*2+1
    difficulty: 1
    hints:
    - 2l + 1, l = 2.
    - '5.'
    solution: 5 orbitals.
    mistakes: {"3": "c11_d_orbitals", "7": "c11_d_orbitals", "10": "c11_d_orbitals"}
  - prompt: How many orbitals are in the n = 4 shell?
    answer: '16'
    check: 4**2
    difficulty: 2
    hints:
    - n².
    - '16.'
    solution: '16.'
    mistakes:
      '32': c11c_quantum
  - prompt: Which set of quantum numbers is NOT allowed?
    options:
    - n = 2, l = 2
    - n = 2, l = 1
    - n = 3, l = 0
    - n = 3, l = 2
    answer: n = 2, l = 2
    difficulty: 2
    hints:
    - l goes up to n − 1.
    - For n = 2, l is 0 or 1.
    solution: l cannot equal n.
    mistakes:
      n = 3, l = 2: c11c_quantum
  - prompt: 'The electronic configuration of sodium (Z = 11) is:'
    options:
    - 1s² 2s² 2p⁶ 3s¹
    - 1s² 2s² 2p⁷
    - 1s² 2s² 2p⁵ 3s²
    - 1s² 2s² 3s² 2p⁵
    answer: 1s² 2s² 2p⁶ 3s¹
    difficulty: 1
    hints:
    - Fill in order.
    - 11 electrons.
    solution: 1s² 2s² 2p⁶ 3s¹.
    mistakes: {"1s² 2s² 2p⁷": "c11_config", "1s² 2s² 2p⁵ 3s²": "c11_config", "1s² 2s² 3s² 2p⁵": "c11_config"}
  - prompt: Which orbital fills first?
    options:
    - 4s
    - 3d
    - 4p
    - 4d
    answer: 4s
    difficulty: 2
    hints:
    - n + l rule.
    - '4s: 4, 3d: 5.'
    solution: 4s (n + l = 4) fills before 3d (n + l = 5).
    mistakes:
      3d: c11c_aufbau
