# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse11-chem
chapter: 6
title: Equilibrium
tips:
  c11c_kc: Kc = [products]^coefficients ÷ [reactants]^coefficients; leave out pure solids and liquids.
  c11c_ph: pH = −log[H⁺]. Each step of 1 in pH is a tenfold change in [H⁺]; pH + pOH = 14 at 25 °C.
  c11_bronsted: "Brønsted–Lowry is all about H⁺. An acid gives it; a base takes it."
  c11_buffer: "Blood is a buffer: add a little acid or base and pH barely moves."
  c11_catalyst: "A catalyst speeds up the forward and backward reactions equally."
  c11_kc: "Kc = [products]/[reactants]."
  c11_le_chatelier_p: "Count gas moles: 4 on the left, 2 on the right. Higher pressure favours fewer moles."
  c11_ph_base: "pOH = −log[OH⁻] first, then pH = 14 − pOH."
  c11_pkw: "pH + pOH = 14 at 25 °C."
  c11_q_k: "Q < K means there are too few products for equilibrium yet."
concepts:
- code: cbse11c.eq.chemical
  title: Chemical equilibrium and Le Chatelier
  notes: |
    Dynamic equilibrium: forward and backward rates equal; concentrations constant. Physical equilibria (ice–water, vapour
    pressure). Law of mass action: for aA + bB ⇌ cC + dD, Kc = [C]^c[D]^d/([A]^a[B]^b); Kp = Kc(RT)^Δn. Reaction quotient
    Q: Q < K forward, Q > K backward. Large K: products favoured. Heterogeneous equilibria omit pure solids/liquids.
    Le Chatelier's principle: a system at equilibrium shifts to oppose a change in concentration, pressure (towards fewer gas
    moles when pressure rises) or temperature (heating favours the endothermic direction). Catalyst doesn't shift K.
    Haber process conditions.
  explanations:
    text: 'At equilibrium, the forward and backward reactions keep going at the same rate, so amounts stop changing. The equilibrium constant K tells you which side is favoured. Le Chatelier''s principle: disturb an equilibrium and it shifts to undo the disturbance.'
    visual: Picture two rooms connected by a door, with people walking both ways at the same rate. The numbers in each room stay steady even though people keep moving. Push more people into one room and the flow evens it out.
    step_by_step: 'Step 1: Write Kc from the balanced equation (products over reactants, powers = coefficients). Step 2: Put in equilibrium concentrations. Step 3: For a change, ask which way opposes it.'
    real_world: The Haber process uses high pressure to push N₂ + 3H₂ ⇌ 2NH₃ towards ammonia, which has fewer gas molecules.
  picture:
    kind: flow
    steps:
    - Equilibrium
    - Add reactant / raise pressure / heat
    - System is disturbed
    - Shifts to oppose the change
    - New equilibrium
    alt: 'Le Chatelier''s principle: a disturbed equilibrium shifts to oppose the change, then settles again.'
  activity:
    type: sort
    prompt: 'N₂ + 3H₂ ⇌ 2NH₃, ΔH = −92 kJ. Le Chatelier: the equilibrium shifts to undo each change. Which way?'
    bins:
    - 'Shifts right: more NH₃'
    - 'Shifts left: less NH₃'
    - No shift
    items:
    - label: Add more N₂
      bin: 'Shifts right: more NH₃'
      clue: Which side gets crowded? Which way would use it up?
      why: Extra N₂ is used up by making more NH₃.
    - label: Remove NH₃ as it forms
      bin: 'Shifts right: more NH₃'
      clue: If product is taken away, what does the system make more of?
      why: The system replaces the lost NH₃.
    - label: Raise the pressure
      bin: 'Shifts right: more NH₃'
      clue: 'Count gas moles: 4 on the left, 2 on the right. Which side takes less room?'
      why: 'Higher pressure favours fewer gas moles: the right.'
    - label: Raise the temperature
      bin: 'Shifts left: less NH₃'
      clue: The forward reaction gives out heat. Which direction absorbs heat?
      why: Heating favours the endothermic backward reaction.
    - label: Lower the pressure
      bin: 'Shifts left: less NH₃'
      clue: Which side has more gas moles?
      why: 'Lower pressure favours more gas moles: the left side.'
    - label: Cool it
      bin: 'Shifts right: more NH₃'
      clue: Removing heat favours the direction that gives heat out. Which is that?
      why: The forward reaction is exothermic, so cooling favours NH₃ (though slowly).
    - label: Remove some H₂
      bin: 'Shifts left: less NH₃'
      clue: If a reactant is taken away, what does the system do?
      why: The system makes more H₂ by breaking up NH₃.
    - label: Add a catalyst
      bin: No shift
      clue: Does a catalyst speed one direction or both?
      why: 'A catalyst speeds both directions equally: equilibrium is reached sooner, but not moved.'
    - label: Add argon at constant volume
      bin: No shift
      clue: Does argon change any of the three gases' partial pressures?
      why: At fixed volume the partial pressures of N₂, H₂ and NH₃ don't change.
    - label: Add more NH₃
      bin: 'Shifts left: less NH₃'
      clue: Where is the extra? Which way would use it up?
      why: The system breaks up some of the extra NH₃, though more remains overall.
  items:
  - prompt: For H₂ + I₂ ⇌ 2HI, [H₂] = [I₂] = 0.1 M and [HI] = 0.8 M. Find Kc.
    answer: '64'
    check: Rational(8,10)**2/(Rational(1,10)*Rational(1,10))
    difficulty: 2
    hints:
    - '[HI]²/([H₂][I₂]).'
    - 0.64 ÷ 0.01.
    solution: Kc = 64.
    mistakes:
      '80': c11c_kc
  - prompt: For A ⇌ B, [A] = 0.2 M and [B] = 0.6 M at equilibrium. Find Kc.
    answer: '3'
    check: Rational(6,10)/Rational(2,10)
    difficulty: 1
    hints:
    - '[B]/[A].'
    - 0.6 ÷ 0.2.
    solution: '3.'
    mistakes: {"1/3": "c11_kc", "0.12": "c11_kc", "0.4": "c11_kc"}
  - prompt: 'In N₂ + 3H₂ ⇌ 2NH₃, raising the pressure shifts equilibrium:'
    options:
    - towards NH₃
    - towards N₂ and H₂
    - nowhere
    - it stops the reaction
    answer: towards NH₃
    difficulty: 1
    hints:
    - 4 gas moles → 2.
    - Fewer moles.
    solution: Towards ammonia, the side with fewer gas moles.
    mistakes: {"towards N₂ and H₂": "c11_le_chatelier_p", "nowhere": "c11_le_chatelier_p", "it stops the reaction": "c11_le_chatelier_p"}
  - prompt: 'Adding a catalyst to a system at equilibrium:'
    options:
    - does not change K
    - increases K
    - shifts it to products
    - shifts it to reactants
    answer: does not change K
    difficulty: 2
    hints:
    - Speeds both ways equally.
    - Reach equilibrium sooner.
    solution: K is unchanged.
    mistakes: {"increases K": "c11_catalyst", "shifts it to products": "c11_catalyst", "shifts it to reactants": "c11_catalyst"}
  - prompt: 'If Q < K, the reaction will:'
    options:
    - move forward
    - move backward
    - stay put
    - stop
    answer: move forward
    difficulty: 2
    hints:
    - Too few products.
    - Make more.
    solution: It moves forward to make more products.
    mistakes: {"move backward": "c11_q_k", "stay put": "c11_q_k", "stop": "c11_q_k"}
  - prompt: 'For CaCO₃(s) ⇌ CaO(s) + CO₂(g), Kc equals:'
    options:
    - '[CO₂]'
    - '[CaO][CO₂]/[CaCO₃]'
    - '[CaCO₃]'
    - 1/[CO₂]
    answer: '[CO₂]'
    difficulty: 2
    hints:
    - Pure solids are left out.
    - Only the gas remains.
    solution: Kc = [CO₂].
    mistakes:
      '[CaO][CO₂]/[CaCO₃]': c11c_kc
- code: cbse11c.eq.ionic
  title: Ionic equilibrium, acids, bases and pH
  after:
  - cbse11c.eq.chemical
  notes: |
    Arrhenius, Brønsted–Lowry (proton donor/acceptor; conjugate pairs) and Lewis (electron pair acceptor/donor) acids and
    bases. Ionic product of water Kw = [H⁺][OH⁻] = 10⁻¹⁴ at 25 °C. pH = −log[H⁺]; pH + pOH = 14. Weak acids: Ka, degree of
    ionisation α = √(Ka/C). Kw = Ka × Kb for a conjugate pair. Common ion effect. Hydrolysis of salts. Buffer solutions:
    resist pH change (acetic acid + sodium acetate; Henderson equation pH = pKa + log[salt]/[acid]). Solubility product Ksp;
    precipitation when ionic product > Ksp.
  explanations:
    text: 'Acids give H⁺ ions; bases take them. pH measures [H⁺] on a scale where each step is ten times stronger: pH 3 has ten times more H⁺ than pH 4. Buffers are mixtures that keep pH nearly steady.'
    visual: 'Draw a pH line from 0 to 14: acids on the left, neutral 7 in the middle, bases on the right. Lemon juice near 2, blood near 7.4, soap near 10.'
    step_by_step: 'Step 1: Find [H⁺] (for a strong acid, equals its concentration). Step 2: pH = −log[H⁺]. Step 3: pOH = 14 − pH. Step 4: For buffers use the Henderson equation.'
    real_world: Blood is a buffer that holds pH at about 7.4; even small changes can make a person very ill.
  picture:
    kind: number_line
    from: 0
    to: 14
    step: 1
    points:
    - at: 2
      label: lemon
    - at: 7
      label: pure water
    - at: 10
      label: soap
    alt: The pH scale from 0 to 14 with lemon juice near 2, pure water at 7 and soap near 10.
  activity:
    type: number_line
    min: 0
    max: 14
    step: 1
    start: 7
    prompt: At 25 °C, pH = −log[H⁺] and pH + pOH = 14. Mark the pH.
    goals:
    - prompt: '[H⁺] = 10⁻³ M.'
      target: 3
      mistakes:
      - when:
          v: 11
        say: '11 would be the pH if [OH⁻] were 10⁻³. pH comes from [H⁺]: drop the minus sign from the power.'
      - when:
          v: 7
        say: pH 7 is neutral, [H⁺] = 10⁻⁷. 10⁻³ M is far more acid.
    - prompt: '[OH⁻] = 10⁻⁴ M.'
      target: 10
      mistakes:
      - when:
          v: 4
        say: 4 is the pOH. pH + pOH = 14 at 25 °C.
    - prompt: 0.01 M HCl, a strong acid.
      target: 2
      mistakes:
      - when:
          v: 1
        say: 'Count the places: 0.01 = 10⁻², so pH 2.'
      - when:
          v:
          - 8
          - 14
        say: 'HCl is an acid: its pH is below 7.'
    - prompt: Dilute that pH 2 acid 10 times with water.
      target: 3
      mistakes:
      - when:
          v: 1
        say: Diluting lowers [H⁺] from 10⁻² to 10⁻³, so the pH goes UP by 1.
      - when:
          v: 7
        say: 'One tenfold dilution doesn''t make it neutral: there''s just 10 times less acid.'
  items:
  - prompt: Find the pH of 0.001 M HCl.
    answer: '3'
    check: -log(Rational(1,1000),10)
    difficulty: 1
    hints:
    - '[H⁺] = 10⁻³.'
    - −log 10⁻³.
    solution: pH = 3.
    mistakes:
      '-3': c11c_ph
  - prompt: A solution has pH 4. Find its pOH at 25 °C.
    answer: '10'
    check: 14-4
    difficulty: 1
    hints:
    - pH + pOH = 14.
    - 14 − 4.
    solution: '10.'
    mistakes: {"4": "c11_pkw", "-10": "c11_pkw", "18": "c11_pkw"}
  - prompt: Find the pH of 0.01 M NaOH at 25 °C.
    answer: '12'
    check: 14 + log(Rational(1,100),10)
    difficulty: 2
    hints:
    - pOH = 2.
    - 14 − 2.
    solution: pH = 12.
    mistakes: {"2": "c11_ph_base", "10": "c11_ph_base", "1": "c11_ph_base"}
  - prompt: A solution of pH 3 has how many times more H⁺ than one of pH 5?
    answer: '100'
    check: 10**(5-3)
    difficulty: 2
    hints:
    - Each unit is ×10.
    - 10².
    solution: 100 times.
    mistakes:
      '2': c11c_ph
  - prompt: 'According to Brønsted–Lowry, a base is:'
    options:
    - a proton acceptor
    - a proton donor
    - an electron acceptor
    - a source of OH⁻ only
    answer: a proton acceptor
    difficulty: 1
    hints:
    - Takes H⁺.
    - NH₃ + H⁺ → NH₄⁺.
    solution: A proton acceptor.
    mistakes: {"a proton donor": "c11_bronsted", "an electron acceptor": "c11_bronsted", "a source of OH⁻ only": "c11_bronsted"}
  - prompt: 'A buffer solution:'
    options:
    - resists changes in pH
    - always has pH 7
    - is a strong acid
    - has no ions
    answer: resists changes in pH
    difficulty: 1
    hints:
    - Weak acid + its salt.
    - Absorbs small additions.
    solution: It resists pH change.
    mistakes: {"always has pH 7": "c11_buffer", "is a strong acid": "c11_buffer", "has no ions": "c11_buffer"}
