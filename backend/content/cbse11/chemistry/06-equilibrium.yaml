      '0.1': c11c06_ph
  - prompt: AgCl has Ksp = 1.0 × 10⁻¹⁰. Find its solubility in water (mol/L), in units of 10⁻⁵.
    answer: '1'
    check: (1e-10)**0.5/1e-5
    difficulty: 3
    hints:
    - Ksp = s × s.
    - s = √Ksp.
    solution: 'Step 1: s² = 10⁻¹⁰. Step 2: s = 10⁻⁵ mol/L.'
    mistakes:
      '10': c11c06_ph
      '0.5': c11c06_ph
  - prompt: 'Assertion (A): The pH of pure water at 25 °C is 7.

      Reason (R): In pure water, [H⁺] = [OH⁻] = 10⁻⁷ M at 25 °C.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. With [H⁺] = 10⁻⁷ M, pH = −log 10⁻⁷ = 7, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: Soil with pH 5 is too acidic for a crop that grows best at pH 7. How many times higher is its [H⁺] than the crop''s ideal?'
