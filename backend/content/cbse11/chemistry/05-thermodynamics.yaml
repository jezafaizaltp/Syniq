# CBSE Class 11 Chemistry (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse11-chem
chapter: 5
title: Thermodynamics
tips:
  c11c_sign: "A negative ΔH means the products have less energy than the reactants: the extra energy goes out as heat. Exo = out, endo = in."
  c11c_gibbs: "ΔG = ΔH − TΔS. Work out T × ΔS first, then subtract. A reaction goes on its own when ΔG is below zero."
  c11_delta_g_sign: "ΔG = ΔH − TΔS. With both positive, which T makes the TΔS term win?"
  c11_delta_g_zero: "ΔG = ΔH − TΔS = 0 gives T = ΔH/ΔS. Convert both to the same energy unit."
  c11_entropy: "Entropy measures disorder. Which state has molecules moving most freely?"
  c11_first_law: "ΔU = q + w. Heat absorbed and work done on the system both add."
  c11_hess: "Climb a hill by any path: the height gained is the same. Which law says that for enthalpy?"
  c11_hess_formation: "ΔH = Σ products − Σ reactants. Count 2 × H₂O, and O₂ is zero."
  c11_isolated: "Open swaps matter and energy, closed swaps only energy. Which swaps neither?"
  c11_state_function: "A state function depends only on start and end, not the route. Heat and work depend on the route."
  c11_third_law: "S = k ln W. A perfect crystal at absolute zero has just one possible arrangement, so W = 1. What is ln 1?"
  c11c05_sign: 'In chemistry, heat absorbed by the system and work done ON the system are positive: ΔU = q + w.'
  c11c05_hess: ΔH(reaction) = Σ ΔfH(products) − Σ ΔfH(reactants). Multiply by the coefficients; elements have ΔfH = 0.
  c11c05_gibbs: ΔG = ΔH − TΔS. Keep units the same (kJ with kJ/K) and use kelvin. Negative ΔG means spontaneous.
concepts:
- code: cbse11c.thermo.enthalpy
  title: First law and enthalpy
  notes: |
    System, surroundings; open, closed, isolated systems. State functions (U, H, S, G) vs path functions (q, w). First law:
    ΔU = q + w (chemistry sign convention: work done on the system positive). Work of expansion w = −pΔV. Enthalpy H = U +
    pV; ΔH = ΔU + Δn_g RT. Extensive vs intensive properties. Heat capacity, calorimetry (bomb calorimeter gives ΔU, coffee
    cup gives ΔH). Standard enthalpies: formation, combustion, atomisation, bond enthalpy, solution. Hess's law: total ΔH is
    independent of path. ΔH_reaction = Σ ΔfH(products) − Σ ΔfH(reactants).
  explanations:
    text: 'Thermodynamics tracks energy in reactions. Enthalpy change, ΔH, is the heat given out or taken in at constant pressure: negative for exothermic reactions like burning, positive for endothermic ones. Hess''s law says the total ΔH is the same whatever route you take.'
    visual: 'Draw an energy diagram: reactants at a higher level, products lower, an arrow down labelled ΔH < 0. That''s an exothermic reaction.'
    step_by_step: 'Step 1: Write the reaction. Step 2: Add up ΔfH of products. Step 3: Subtract ΔfH of reactants. Step 4: Negative means heat is released.'
    real_world: Instant cold packs use an endothermic dissolving process (ammonium nitrate in water) to cool sprains.
  picture:
    kind: flow
    steps:
    - Reactants
    - Break bonds (takes energy)
    - Make new bonds (gives energy)
    - Products, ΔH = net change
    alt: A reaction breaks bonds, which takes energy, then makes new ones, which releases energy; ΔH is the net change.
  activity:
    type: formula
    prompt: H₂ + Cl₂ → 2HCl. Breaking bonds costs energy; making bonds gives it out. ΔH = energy to break − energy released by making.
    inputs:
    - name: x
      label: H–H bonds broken (436 kJ each)
      min: 0
      max: 4
      step: 1
      start: 0
    - name: y
      label: Cl–Cl bonds broken (242 kJ each)
      min: 0
      max: 4
      step: 1
      start: 0
    - name: z
      label: H–Cl bonds made (431 kJ each)
      min: 0
      max: 8
      step: 1
      start: 0
    outputs:
    - name: brk
      label: Energy to break
      expr: 436*x+242*y
      unit: kJ
    - name: mk
      label: Energy from making
      expr: 431*z
      unit: kJ
    - name: dh
      label: ΔH
      expr: 436*x+242*y-431*z
      unit: kJ
    goals:
    - prompt: Set up H₂ + Cl₂ → 2HCl.
      want:
        x: 1
        y: 1
        z: 2
      mistakes:
      - when:
          x: 1
          y: 1
          z: 1
        say: Two HCl molecules form, so two H–Cl bonds are made.
      - when:
          x: 2
          y: 2
          z: 2
        say: 'One H₂ and one Cl₂ are enough for 2HCl: each molecule splits into two atoms.'
    - prompt: Make 4 HCl. Read ΔH.
      want:
        x: 2
        y: 2
        z: 4
      mistakes:
      - when:
          x: 2
          y: 2
          z: 2
        say: 4 HCl means 4 H–Cl bonds made.
      - when:
          x: 4
          y: 4
          z: 4
        say: '4 HCl need only 2 H₂ and 2 Cl₂: each molecule gives two atoms.'
    - prompt: 'Show that only breaking bonds is endothermic: break one H₂ and one Cl₂, make nothing.'
      want:
        x: 1
        y: 1
        z: 0
      mistakes:
      - when:
          dh:
          - -1000
          - -1
        say: A negative ΔH means energy is given out, which needs bonds to be made.
  lesson:
    - teach: A system can be open (exchanges matter and energy), closed (energy only) or isolated (neither). State functions such as U and H depend only on the state, not on how it was reached; heat q and work w depend on the path.
      check:
        prompt: 'A sealed flask that lets heat through is:'
        options:
        - closed
        - open
        - isolated
        answer: closed
        why: Energy passes, matter does not.
    - teach: 'First law (chemistry signs): ΔU = q + w, where q is heat absorbed and w is work done on the system. Expansion work w = −pΔV. Enthalpy H = U + pV, so ΔH = ΔU + Δn_g RT.'
      check:
        prompt: System absorbs 50 J and does 20 J of work. ΔU?
        options:
        - 30 J
        - 70 J
        - −30 J
        answer: 30 J
        why: q = +50, w = −20.
    - teach: 'Hess''s law: the total ΔH is the same whatever route is taken. So ΔH(reaction) = Σ ΔfH(products) − Σ ΔfH(reactants). Negative ΔH: exothermic; positive: endothermic.'
      picture:
        kind: flow
        steps:
        - Write the balanced equation
        - Multiply each ΔfH by its coefficient
        - Products minus reactants
        alt: Using enthalpies of formation.
      check:
        prompt: 'ΔfH of O₂(g) is:'
        options:
        - '0'
        - −393 kJ/mol
        - it depends
        answer: '0'
        why: Elements in their standard state have ΔfH = 0.
  items:
  - prompt: A system absorbs 300 J of heat and 100 J of work is done on it. Find ΔU (in J).
    answer: '400'
    check: 300+100
    difficulty: 1
    hints:
    - ΔU = q + w.
    - 300 + 100.
    solution: 400 J.
    mistakes: {"200": "c11_first_law", "-200": "c11_first_law", "300": "c11_first_law"}
  - prompt: 'ΔfH: CO₂ = −393, H₂O(l) = −286, CH₄ = −75 kJ/mol. Find ΔH (kJ/mol) for CH₄ + 2O₂ → CO₂ + 2H₂O.'
    answer: '-890'
    check: (-393 + 2*(-286)) - (-75)
    difficulty: 2
    hints:
    - Products − reactants; O₂ is 0.
    - (−393 − 572) − (−75).
    solution: −890 kJ/mol.
    mistakes: {"-604": "c11_hess_formation", "890": "c11_hess_formation", "-1040": "c11_hess_formation"}
  - prompt: 'A reaction with ΔH = −50 kJ/mol is:'
    options:
    - exothermic
    - endothermic
    - at equilibrium
    - impossible
    answer: exothermic
    difficulty: 1
    hints:
    - Negative ΔH.
    - Heat given out.
    solution: Exothermic.
    mistakes:
      endothermic: c11c_sign
  - prompt: Which is a state function?
    options:
    - enthalpy
    - heat
    - work
    - path length
    answer: enthalpy
    difficulty: 2
    hints:
    - Depends only on start and end.
    - Not on the route.
    solution: Enthalpy is a state function.
    mistakes: {"heat": "c11_state_function", "work": "c11_state_function", "path length": "c11_state_function"}
  - prompt: 'Hess''s law states that:'
    options:
    - total enthalpy change is the same whatever the route
    - energy flows from hot to cold
    - entropy always rises
    - heat equals work
    answer: total enthalpy change is the same whatever the route
    difficulty: 1
    hints:
    - Path independence.
    - ΔH is a state function.
    solution: ΔH doesn't depend on the path.
    mistakes: {"energy flows from hot to cold": "c11_hess", "entropy always rises": "c11_hess", "heat equals work": "c11_hess"}
  - prompt: 'A system that exchanges neither energy nor matter with its surroundings is:'
    options:
    - isolated
    - open
    - closed
    - adiabatic only
    answer: isolated
    difficulty: 1
    hints:
    - Nothing crosses.
    - Thermos flask (ideal).
    solution: An isolated system.
    mistakes: {"open": "c11_isolated", "closed": "c11_isolated", "adiabatic only": "c11_isolated"}
  - prompt: A system releases 200 J of heat and 50 J of work is done on it. Find ΔU (in J).
    answer: '-150'
    check: -200+50
    difficulty: 1
    hints:
    - Heat released means q is negative.
    - Work on the system is positive.
    solution: 'Step 1: −200 + 50. Step 2: −150 J.'
    mistakes:
      '150': c11c05_sign
      '-250': c11c05_sign
  - prompt: 'A reaction with ΔH = +30 kJ/mol is:'
    options:
    - endothermic
    - exothermic
    - at equilibrium
    answer: endothermic
    difficulty: 1
    hints:
    - Positive ΔH means heat is taken in.
    - '''Endo'' means inward.'
    solution: 'Step 1: heat absorbed. Step 2: endothermic.'
    mistakes:
      exothermic: c11c05_sign
      at equilibrium: c11c05_sign
  - prompt: Which is an intensive property?
    options:
    - temperature
    - volume
    - mass
    answer: temperature
    difficulty: 1
    hints:
    - Intensive properties do not depend on the amount.
    - 'Split a cup of tea in two: what stays the same?'
    solution: 'Step 1: halving the sample keeps T. Step 2: temperature.'
    mistakes:
      volume: c11c05_sign
      mass: c11c05_sign
  - prompt: A gas expands by 2 L against a constant 1 atm. Find w (in L atm).
    answer: '-2'
    check: -1*2
    difficulty: 2
    hints:
    - w = −pΔV.
    - 'Expansion: the system does work.'
    solution: 'Step 1: −1 × 2. Step 2: −2 L atm.'
    mistakes:
      '2': c11c05_sign
      '0': c11c05_sign
  - prompt: 'ΔfH: CO₂ = −393, H₂O(l) = −286 kJ/mol. Find ΔH for C + O₂ → CO₂ (kJ/mol).'
    answer: '-393'
    check: '-393'
    difficulty: 2
    hints:
    - C and O₂ are elements in their standard states.
    - Products minus reactants.
    solution: 'Step 1: −393 − (0 + 0). Step 2: −393 kJ/mol.'
    mistakes:
      '393': c11c05_hess
      '-679': c11c05_hess
  - prompt: 'ΔfH: NH₃ = −46 kJ/mol. Find ΔH for N₂ + 3H₂ → 2NH₃ (kJ/mol).'
    answer: '-92'
    check: 2*(-46)
    difficulty: 2
    hints:
    - Two moles of NH₃ form.
    - Elements have ΔfH = 0.
    solution: 'Step 1: 2 × (−46). Step 2: −92 kJ/mol.'
    mistakes:
      '-46': c11c05_hess
      '92': c11c05_hess
  - prompt: 'A bomb calorimeter (constant volume) measures:'
    options:
    - ΔU
    - ΔH
    - ΔG
    answer: ΔU
    difficulty: 2
    hints:
    - No expansion work at constant volume.
    - So q equals the change in internal energy.
    solution: 'Step 1: w = 0 at constant V. Step 2: q = ΔU.'
    mistakes:
      ΔH: c11c05_sign
      ΔG: c11c05_sign
  - prompt: For N₂ + 3H₂ → 2NH₃ (all gases), what is Δn_g?
    answer: '-2'
    check: 2-4
    difficulty: 3
    hints:
    - Gas moles of products minus gas moles of reactants.
    - 2 − (1 + 3).
    solution: 'Step 1: 2 − 4. Step 2: −2.'
    mistakes:
      '2': c11c05_hess
      '-4': c11c05_hess
  - prompt: ΔH for A → B is +20 kJ and for B → C is −50 kJ. Find ΔH for A → C (kJ).
    answer: '-30'
    check: 20-50
    difficulty: 3
    hints:
    - 'Hess''s law: add the steps.'
    - +20 + (−50).
    solution: 'Step 1: 20 − 50. Step 2: −30 kJ.'
    mistakes:
      '70': c11c05_hess
      '30': c11c05_hess
- code: cbse11c.thermo.spont
  title: Entropy and Gibbs energy
  after:
  - cbse11c.thermo.enthalpy
  notes: |
    Spontaneous process: happens on its own. Entropy S: measure of disorder/energy dispersal; ΔS = q_rev/T; gases > liquids
    > solids; ΔS_total > 0 for spontaneous change. Gibbs energy G = H − TS; ΔG = ΔH − TΔS. ΔG < 0 spontaneous; ΔG = 0
    equilibrium; ΔG > 0 non-spontaneous. Four cases of ΔH and ΔS signs. Relation to equilibrium: ΔG° = −RT ln K. Third
    law: entropy of a perfect crystal at 0 K is zero.
  explanations:
    text: 'Some changes happen on their own, like ice melting in a warm room. Entropy measures how spread out energy and matter are. Gibbs energy combines enthalpy and entropy: if ΔG is negative, the change can happen by itself.'
    visual: 'Draw a table of four cases: ΔH negative and ΔS positive is always spontaneous; ΔH positive and ΔS negative never; the other two depend on temperature.'
    step_by_step: 'Step 1: Find ΔH and ΔS (keep units the same: kJ and kJ/K). Step 2: Use ΔG = ΔH − TΔS with T in kelvin. Step 3: Negative ΔG means spontaneous.'
    real_world: Ice melts above 0 °C because there the TΔS term is bigger than ΔH, making ΔG negative.
  picture:
    kind: compare
    columns:
    - title: ΔH
      points:
      - −
      - +
      - −
      - +
    - title: ΔS
      points:
      - +
      - −
      - −
      - +
    - title: Spontaneous?
      points:
      - always
      - never
      - at low T
      - at high T
    alt: Four sign combinations of ΔH and ΔS and when each process is spontaneous.
  activity:
    type: formula
    prompt: 'Gibbs energy: ΔG = ΔH − TΔS. A reaction goes on its own when ΔG < 0.'
    inputs:
    - name: t
      label: Temperature T
      min: 100
      max: 1500
      step: 10
      start: 300
      unit: K
    - name: h
      label: ΔH
      min: -200
      max: 200
      step: 20
      start: 0
      unit: kJ/mol
    - name: s
      label: ΔS
      min: -0.3
      max: 0.3
      step: 0.05
      start: 0
      unit: kJ/(mol K)
    outputs:
    - name: dg
      label: ΔG
      expr: h-t*s
      unit: kJ/mol
      places: 1
    goals:
    - prompt: 'Limestone breaking down: ΔH = +180, ΔS = +0.15. Find the lowest temperature where ΔG < 0.'
      want:
        h: 180
        s: 0.15
        dg:
        - -1.6
        - -1
      mistakes:
      - when:
          h: 180
          s: 0.15
          t: 1200
        say: 'At 1200 K, ΔG = 0: equilibrium, no drive either way. It must be just above.'
      - when:
          h: 180
          s: 0.15
          t:
          - 100
          - 1190
        say: ΔG is still positive. Heat it more until TΔS beats ΔH.
      - when:
          h: 180
          s: 0.15
          t:
          - 1220
          - 1500
        say: That works, but it isn't the lowest. Come down until ΔG is just below 0.
    - prompt: Make a reaction that goes on its own at every temperature.
      want:
        h:
        - -200
        - -20
        s:
        - 0.05
        - 0.3
      mistakes:
      - when:
          h:
          - -200
          - -20
          s:
          - -0.3
          - -0.05
        say: 'Exothermic, but the entropy falls: at high T the −TΔS term turns positive and wins.'
      - when:
          h:
          - 20
          - 200
          s:
          - 0.05
          - 0.3
        say: Endothermic with rising entropy goes only when T is high enough.
    - prompt: ΔH = −100, ΔS = −0.2. Find the highest temperature where it still goes.
      want:
        h: -100
        s: -0.2
        dg:
        - -2.5
        - -0.1
      mistakes:
      - when:
          h: -100
          s: -0.2
          t:
          - 510
          - 1500
        say: 'Above 500 K, −TΔS (positive here) beats ΔH: ΔG > 0.'
      - when:
          h: -100
          s: -0.2
          t: 500
        say: 'At 500 K, ΔG = 0: equilibrium. Go just below.'
  lesson:
    - teach: 'A spontaneous process happens on its own, given the chance (ice melting in a warm room). Entropy S measures how spread out energy and matter are: gas > liquid > solid.'
      check:
        prompt: Which change increases entropy?
        options:
        - water evaporating
        - water freezing
        - steam condensing
        answer: water evaporating
        why: A gas is more spread out than a liquid.
    - teach: 'Gibbs energy G = H − TS, so ΔG = ΔH − TΔS. ΔG < 0: spontaneous; ΔG = 0: equilibrium; ΔG > 0: not spontaneous. Temperature can flip the sign when ΔH and ΔS have the same sign.'
      check:
        prompt: ΔH = −20 kJ, ΔS = +0.05 kJ/K. Spontaneous?
        options:
        - at all temperatures
        - only at high T
        - never
        answer: at all temperatures
        why: Both terms make ΔG negative.
    - teach: 'At equilibrium ΔG = 0, so T = ΔH/ΔS is the switch-over temperature. Also ΔG° = −RT ln K: a negative ΔG° means K > 1. Third law: a perfect crystal at 0 K has zero entropy.'
      picture:
        kind: compare
        columns:
        - title: ΔH, ΔS
          points:
          - −, +
          - +, −
          - −, −
          - +, +
        - title: Spontaneous?
          points:
          - always
          - never
          - at low T
          - at high T
        alt: Spontaneity from the signs of ΔH and ΔS.
      check:
        prompt: 'ΔH = 30 kJ, ΔS = 0.1 kJ/K. ΔG = 0 at:'
        options:
        - 300 K
        - 3 K
        - 3000 K
        answer: 300 K
        why: 30 ÷ 0.1.
  items:
  - prompt: ΔH = 40 kJ/mol and ΔS = 0.1 kJ/(mol K). Find ΔG (kJ/mol) at 500 K.
    answer: '-10'
    check: 40 - 500*Rational(1,10)
    difficulty: 2
    hints:
    - ΔG = ΔH − TΔS.
    - 40 − 50.
    solution: −10 kJ/mol, so spontaneous.
    mistakes:
      '10': c11c_gibbs
  - prompt: For the same values, at what temperature (K) is ΔG = 0?
    answer: '400'
    check: 40/Rational(1,10)
    difficulty: 2
    hints:
    - T = ΔH/ΔS.
    - 40/0.1.
    solution: 400 K.
    mistakes: {"0.4": "c11_delta_g_zero", "40": "c11_delta_g_zero", "4000": "c11_delta_g_zero"}
  - prompt: 'A reaction is spontaneous when ΔG is:'
    options:
    - negative
    - positive
    - zero
    - any value
    answer: negative
    difficulty: 1
    hints:
    - Downhill.
    - ΔG < 0.
    solution: Negative.
    mistakes:
      positive: c11c_gibbs
  - prompt: Which has the highest entropy?
    options:
    - steam
    - ice
    - liquid water
    - all the same
    answer: steam
    difficulty: 1
    hints:
    - Gas is most disordered.
    - Molecules spread out.
    solution: Steam.
    mistakes: {"ice": "c11_entropy", "liquid water": "c11_entropy", "all the same": "c11_entropy"}
  - prompt: 'A reaction with ΔH > 0 and ΔS > 0 is spontaneous:'
    options:
    - at high temperature
    - at low temperature
    - always
    - never
    answer: at high temperature
    difficulty: 2
    hints:
    - TΔS must beat ΔH.
    - Big T.
    solution: At high temperature.
    mistakes: {"at low temperature": "c11_delta_g_sign", "always": "c11_delta_g_sign", "never": "c11_delta_g_sign"}
  - prompt: 'The third law says the entropy of a perfect crystal at 0 K is:'
    options:
    - zero
    - infinite
    - negative
    - equal to R
    answer: zero
    difficulty: 2
    hints:
    - Perfect order.
    - No disorder.
    solution: Zero.
    mistakes: {"infinite": "c11_third_law", "negative": "c11_third_law", "equal to R": "c11_third_law"}
  - prompt: ΔH = −60 kJ/mol, ΔS = −0.1 kJ/(mol K). Find ΔG at 300 K (kJ/mol).
    answer: '-30'
    check: -60-300*(-0.1)
    difficulty: 1
    hints:
    - ΔG = ΔH − TΔS.
    - −TΔS = +30.
    solution: 'Step 1: −60 + 30. Step 2: −30 kJ/mol.'
    mistakes:
      '-90': c11c05_gibbs
      '30': c11c05_gibbs
  - prompt: 'When ΔG = 0, the system is:'
    options:
    - at equilibrium
    - spontaneous
    - non-spontaneous
    answer: at equilibrium
    difficulty: 1
    hints:
    - No driving force either way.
    - Forward and backward balance.
    solution: 'Step 1: ΔG = 0. Step 2: equilibrium.'
    mistakes:
      spontaneous: c11c05_gibbs
      non-spontaneous: c11c05_gibbs
  - prompt: Which has the lowest entropy?
    options:
    - ice
    - liquid water
    - steam
    answer: ice
    difficulty: 1
    hints:
    - Which is most ordered?
    - Molecules are fixed in a crystal.
    solution: 'Step 1: solids are most ordered. Step 2: ice.'
    mistakes:
      liquid water: c11c05_gibbs
      steam: c11c05_gibbs
  - prompt: ΔH = −10 kJ/mol, ΔS = −0.05 kJ/(mol K). Above what temperature (K) is it non-spontaneous?
    answer: '200'
    check: 10/0.05
    difficulty: 2
    hints:
    - Find T where ΔG = 0.
    - T = ΔH/ΔS.
    solution: 'Step 1: 10/0.05. Step 2: 200 K.'
    mistakes:
      '0.5': c11c05_gibbs
      '500': c11c05_gibbs
  - prompt: 'A reaction with ΔH > 0 and ΔS < 0 is:'
    options:
    - never spontaneous
    - always spontaneous
    - spontaneous at high T
    answer: never spontaneous
    difficulty: 2
    hints:
    - Check the signs of ΔH and −TΔS.
    - Both are positive.
    solution: 'Step 1: ΔG = (+) − T(−) > 0. Step 2: never spontaneous.'
    mistakes:
      always spontaneous: c11c05_gibbs
      spontaneous at high T: c11c05_gibbs
  - prompt: Ice melts at 273 K with ΔH = 6.0 kJ/mol. Find ΔS (in J/mol K, nearest whole).
    answer: '22'
    check: round(6000/273)
    difficulty: 2
    hints:
    - At the melting point ΔG = 0.
    - ΔS = ΔH/T, using joules.
    solution: 'Step 1: 6000/273 ≈ 21.98. Step 2: 22 J/mol K.'
    mistakes:
      '0.022': c11c05_gibbs
      '1638': c11c05_gibbs
  - prompt: 'For a spontaneous process in an isolated system, ΔS is:'
    options:
    - positive
    - negative
    - zero
    answer: positive
    difficulty: 2
    hints:
    - Second law of thermodynamics.
    - Total entropy can only grow.
    solution: 'Step 1: ΔS_total > 0. Step 2: positive.'
    mistakes:
      negative: c11c05_gibbs
      zero: c11c05_gibbs
  - prompt: 'If ΔG° is negative, the equilibrium constant K is:'
    options:
    - greater than 1
    - less than 1
    - exactly 1
    answer: greater than 1
    difficulty: 3
    hints:
    - ΔG° = −RT ln K.
    - Negative ΔG° means ln K is positive.
