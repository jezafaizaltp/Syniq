- code: cbse11e.h4.tut
  title: 'Discovering Tut: the Saga Continues (A.R. Williams)'
  notes: |
    Tutankhamun, the boy king of ancient Egypt, died at about nineteen, more than 3,300 years ago; he was the last of a
    powerful family. His tomb was discovered in 1922 by the British archaeologist Howard Carter, who found it full of
    treasures; the mummy was stuck to its coffin by hardened resins and Carter's team cut it apart. Tut's father or
    grandfather, Amenhotep III, ruled for almost forty years; Amenhotep IV (Akhenaten) promoted worship of the Aten, the
    sun disc, and moved the capital; Tut restored the old gods. In 2005 Zahi Hawass, head of Egypt's antiquities council,
    had the mummy scanned in a portable CT machine, producing about 1,700 images, to learn how he lived and died.
  explanations:
    text: Tutankhamun was a young Egyptian king who died at about nineteen. Howard Carter found his treasure-filled tomb in 1922. In 2005, scientists scanned his mummy with a CT scanner to learn how he lived and died, without harming it further.
    visual: Picture a golden mask in a tomb lit by lanterns in 1922; then, in 2005, a mummy sliding into a white CT scanner in a trailer beside the tomb at night.
    step_by_step: 'Step 1: Who Tut was. Step 2: Carter''s discovery in 1922. Step 3: Tut''s family and the religious changes. Step 4: The 2005 CT scan and what it could show.'
    real_world: Hospitals use the same CT technology to look inside the body without surgery.
