# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 4.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 4
title: 'Discovering Tut: the Saga Continues (A.R. Williams)'
tips:
  e11_aten: "Akhenaten took a new name honouring the god he promoted. Look at the end of his name; this god was shown as a disc with rays."
  e11_carter: "Carter's discovery came in the 1920s, just after the First World War."
  e11_ct_images: "The scan produced a huge number of images in a short time, more than a thousand."
  e11_ct_year: "The CT scan was done in the 21st century, on 5 January."
  e11_tut_age: "Tut became king as a boy and died as a teenager."
  e11x04_fact: 'Go back to the facts the chapter gives: who, when, and what each person did.'
  e11x04_why: Ask what the scientists hoped to learn, and why the old methods were not enough.

concepts:
- code: cbse11e.h4.tut
  title: 'Discovering Tut: the Saga Continues (A.R. Williams)'
  notes: |
    Tutankhamun, the boy king of ancient Egypt, died at about nineteen, more than 3,300 years ago; he was the last of a
    powerful family. His tomb was discovered in 1922 by the British archaeologist Howard Carter, who found it full of
    treasures; the mummy was stuck to its coffin by hardened resins and Carter's team cut it apart. Tut's father or
    grandfather, Amenhotep III, ruled for almost forty years; Amenhotep IV (Akhenaten) promoted worship of the Aten, the
    sun disc, and moved the capital; Tut restored the old gods. In 2005 Zahi Hawass, head of Egypt's antiquities council,
    had the mummy scanned in a portable CT machine, producing about 1,700 images, to learn how he lived and died.
  explanations:
    text: Tutankhamun was a young Egyptian king who died at about nineteen. Howard Carter found his treasure-filled tomb in 1922. In 2005, scientists scanned his mummy with a CT scanner to learn how he lived and died, without harming it further.
    visual: Picture a golden mask in a tomb lit by lanterns in 1922; then, in 2005, a mummy sliding into a white CT scanner in a trailer beside the tomb at night.
    step_by_step: 'Step 1: Who Tut was. Step 2: Carter''s discovery in 1922. Step 3: Tut''s family and the religious changes. Step 4: The 2005 CT scan and what it could show.'
    real_world: Hospitals use the same CT technology to look inside the body without surgery.
  picture:
    kind: flow
    steps:
    - Tut dies at about 19
    - '1922: Howard Carter finds the tomb'
    - Mummy cut from the coffin
    - '2005: CT scan led by Zahi Hawass'
    - About 1,700 images made
    alt: Tutankhamun's story from his death to Carter's discovery and the 2005 CT scan.
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: 'Discovering Tut: mark the numbers.'
    goals:
    - prompt: Tut's age when he died.
      target: 19
      mistakes:
      - when:
          v: 40
        say: That's how long Amenhotep III ruled. Tut died as a teenager.
      - when:
          v: 9
        say: Too young. He died at about nineteen.
    - prompt: Years Amenhotep III ruled.
      target: 40
      mistakes:
      - when:
          v: 19
        say: That's Tut's age at death. His father or grandfather ruled far longer, almost four decades.
  lesson:
    - teach: Tutankhamun was a boy king of ancient Egypt. He died at about nineteen, more than 3,300 years ago, and was the last of a powerful family. Because he died so young, people have always wondered how he lived and how he died.
      check:
        prompt: Why has Tut's death interested people for so long?
        options:
        - he died very young and the cause was unclear
        - he ruled for a hundred years
        - his tomb was never found
        answer: he died very young and the cause was unclear
        why: A king dying at about nineteen raised questions that lasted centuries.
    - teach: 'In 1922 Howard Carter found Tut''s tomb, full of gold and treasure. The mummy was stuck to its coffin by hardened resins, so Carter''s team cut the body apart to remove it. Tut''s family history matters too: Amenhotep III ruled almost forty years; Akhenaten turned to one god, the Aten; Tut brought back the old gods.'
      picture:
        kind: flow
        steps:
        - Amenhotep III rules ~40 years
        - 'Akhenaten: worship of the Aten'
        - Tut restores old gods
        - Tut dies at ~19
        - '1922: Carter finds tomb'
        - '2005: CT scan'
        alt: Timeline from Amenhotep III, through Akhenaten and Tut, to Carter's discovery and the CT scan.
      check:
        prompt: Why did Carter's team cut the mummy apart?
        options:
        - it was stuck to the coffin by hardened resins
        - they wanted to sell the gold
        - the tomb was flooding
        answer: it was stuck to the coffin by hardened resins
        why: The resins had set like rock, so the body could not be lifted out whole.
    - teach: In 2005 Zahi Hawass, head of Egypt's antiquities council, had the mummy scanned in a portable CT machine. The scan made about 1,700 images, giving a 3-D view of the body. Modern science could now look for clues about Tut's life and death without damaging him further.
      check:
        prompt: What was the main advantage of the CT scan?
        options:
        - it showed the inside of the body without cutting it
        - it made the mummy younger
        - it found new gold
        answer: it showed the inside of the body without cutting it
        why: CT builds images of the inside layer by layer.
  items:
  - prompt: At about what age did Tutankhamun die?
    answer: '19'
    check: '19'
    difficulty: 1
    hints:
    - A teenager.
    - Nineteen.
    solution: About 19.
    mistakes: {"18": "e11_tut_age", "25": "e11_tut_age", "9": "e11_tut_age"}
  - prompt: In which year did Howard Carter discover Tut's tomb?
    answer: '1922'
    check: '1922'
    difficulty: 1
    hints:
    - Early twentieth century.
    - 1920s.
    solution: '1922.'
    mistakes: {"1920": "e11_carter", "1925": "e11_carter", "1952": "e11_carter"}
  - prompt: In which year was Tut's mummy CT-scanned?
    answer: '2005'
    check: '2005'
    difficulty: 2
    hints:
    - Twenty-first century.
    - Zahi Hawass.
    solution: '2005.'
    mistakes: {"2000": "e11_ct_year", "1995": "e11_ct_year", "2015": "e11_ct_year"}
  - prompt: Who discovered Tutankhamun's tomb?
    options:
    - Howard Carter
    - Zahi Hawass
    - Amenhotep
    - A.R. Williams
    answer: Howard Carter
    difficulty: 1
    hints:
    - British archaeologist.
    - '1922.'
    solution: Howard Carter.
    mistakes:
      Zahi Hawass: eng11_read_again
  - prompt: 'Akhenaten promoted the worship of:'
    options:
    - the Aten (sun disc)
    - Amun only
    - the Nile
    - the moon
    answer: the Aten (sun disc)
    difficulty: 2
    hints:
    - Changed his name to honour it.
    - Sun.
    solution: The Aten, the sun disc.
    mistakes: {"Amun only": "e11_aten", "the Nile": "e11_aten", "the moon": "e11_aten"}
  - prompt: About how many images did the CT scan produce?
    answer: '1700'
    check: '1700'
    difficulty: 2
    hints:
    - A large number.
    - Seventeen hundred.
    solution: About 1,700.
    mistakes: {"17": "e11_ct_images", "170": "e11_ct_images", "17000": "e11_ct_images"}
  - prompt: Tutankhamun was a ruler of which ancient land?
    options:
    - Egypt
    - Greece
    - Persia
    answer: Egypt
    difficulty: 1
    hints:
    - Think of pyramids and the Nile.
    - The antiquities council in the chapter belongs to this country.
    solution: 'Step 1: Tut was a pharaoh. Step 2: Egypt.'
    mistakes:
      Greece: e11x04_fact
      Persia: e11x04_fact
  - prompt: What was Howard Carter's profession?
    options:
    - archaeologist
    - doctor
    - king
    answer: archaeologist
    difficulty: 1
    hints:
    - He dug up ancient sites.
    - He studied the past through objects.
    solution: 'Step 1: he searched for tombs. Step 2: archaeologist.'
    mistakes:
      doctor: e11x04_fact
      king: e11x04_fact
  - prompt: What did Carter find in Tut's tomb besides the mummy?
    options:
    - treasures
    - an empty room
    - modern machines
    answer: treasures
    difficulty: 1
    hints:
    - Kings were buried with riches.
    - Think of gold.
    solution: 'Step 1: the tomb was full. Step 2: treasures.'
    mistakes:
      an empty room: e11x04_fact
      modern machines: e11x04_fact
  - prompt: Who was Zahi Hawass?
    options:
    - head of Egypt's antiquities council
    - Tut's father
    - the man who found the tomb in 1922
    answer: head of Egypt's antiquities council
    difficulty: 1
    hints:
    - He led the 2005 study.
    - He guarded Egypt's ancient heritage.
    solution: 'Step 1: he ordered the CT scan. Step 2: antiquities chief.'
    mistakes:
      Tut's father: e11x04_fact
      the man who found the tomb in 1922: e11x04_fact
  - prompt: Which king ruled for almost forty years in Tut's family?
    options:
    - Amenhotep III
    - Akhenaten
    - Tutankhamun
    answer: Amenhotep III
    difficulty: 2
    hints:
    - He came before Akhenaten.
    - He was Tut's father or grandfather.
    solution: 'Step 1: the long reign came first. Step 2: Amenhotep III.'
    mistakes:
      Akhenaten: e11x04_fact
      Tutankhamun: e11x04_fact
  - prompt: What did Tut do about Akhenaten's changes in religion?
    options:
    - he restored the old gods
    - he made the Aten the only god
    - he banned all temples
    answer: he restored the old gods
    difficulty: 2
    hints:
    - He undid his predecessor's change.
    - Many gods returned.
    solution: 'Step 1: Akhenaten pushed one god. Step 2: Tut brought back the old ones.'
    mistakes:
      he made the Aten the only god: e11x04_fact
      he banned all temples: e11x04_fact
  - prompt: How many years passed between Carter's discovery and the CT scan?
    answer: '83'
    check: 2005 - 1922
    difficulty: 2
    hints:
    - Use the two years from the chapter.
    - Subtract the earlier year from the later one.
    solution: 'Step 1: 1922 and 2005. Step 2: 2005 - 1922 = 83.'
    mistakes:
      '73': e11x04_fact
      '93': e11x04_fact
  - prompt: Why were scientists still curious about Tut in 2005?
    options:
    - they wanted to learn how he lived and died
    - they wanted to rebury him in Greece
    - they had just discovered his name
    answer: they wanted to learn how he lived and died
    difficulty: 3
    hints:
    - Think of the open questions about his young death.
    - The scan looked for clues on the body.
    solution: 'Step 1: the death was a mystery. Step 2: CT could give clues.'
    mistakes:
      they wanted to rebury him in Greece: e11x04_why
      they had just discovered his name: e11x04_why
  - prompt: What does the chapter suggest about how Carter's team treated the mummy?
    options:
    - their methods damaged it
    - they handled it with modern scanners
    - they never touched it
    answer: their methods damaged it
    difficulty: 3
    hints:
    - Remember the resins.
    - They had to cut through the body.
    solution: 'Step 1: the mummy was stuck. Step 2: cutting it apart caused damage.'
    mistakes:
      they handled it with modern scanners: e11x04_why
      they never touched it: e11x04_why
