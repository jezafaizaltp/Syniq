concepts:
- code: cbse11e.s2.address
  title: The Address (Marga Minco)
  notes: |
    Set in the Netherlands after the Second World War. During the war, a Jewish mother's acquaintance, Mrs Dorling, took
    away many of the family's valuable possessions to "keep them safe". After the war, the daughter (narrator), whose
    mother has died, goes to 46 Marconi Street. Mrs Dorling opens the door, pretends not to recognise her, and shuts it.
    The narrator returns another day, when Mrs Dorling's daughter lets her in; she sees her mother's things: the
    tablecloth with a burn mark, the silver cutlery, the antique pewter plate, the green tea set, the hanukkah
    candle-holder. Surrounded by them in a stranger's room, she feels they have lost their value, cut off from the life she
    remembers. She decides to forget the address. Themes: war, loss, memory, letting go.
  explanations:
    text: After the Second World War, a young woman visits the house where a family acquaintance, Mrs Dorling, took her mother's belongings during the war. Mrs Dorling won't let her in at first. When she finally sees her mother's things in a stranger's home, they feel lifeless, so she decides to forget the address and let go of the past.
    visual: Picture a woman standing at the door of number 46 Marconi Street; then sitting in a dim room among familiar silver, a burnt tablecloth and a tea set, feeling like a stranger; then walking away.
    step_by_step: 'Step 1: The war and Mrs Dorling taking the things. Step 2: First visit: the door is shut. Step 3: Second visit: seeing the belongings. Step 4: Her feelings. Step 5: Her decision to forget.'
    real_world: People who lose homes in floods or wars often find that objects can't bring back the life they shared with loved ones.
  picture:
    kind: flow
    steps:
    - 'War: Mrs Dorling takes the family''s things'
    - 'After the war: the daughter visits'
    - Mrs Dorling shuts the door
    - 'Second visit: she sees her mother''s things'
    - She decides to forget the address
    alt: 'The Address: the belongings taken in the war, the two visits and the daughter''s decision to forget.'
  activity:
    type: order
    prompt: 'The Address: put the narrator''s visits in order.'
    steps:
    - Mrs Dorling takes the family's things in wartime
    - After the war, the narrator goes to 46 Marconi Street
    - Mrs Dorling shuts the door
    - The daughter lets her in another day
    - She sees her mother's things in a stranger's room
    - She decides to forget the address
    reasons:
      After the war, the narrator goes to 46 Marconi Street: She wants to see her mother's things.
      Mrs Dorling shuts the door: She pretends not to know her.
      The daughter lets her in another day: She tries again.
      She sees her mother's things in a stranger's room: Inside, she finds the tablecloth and silver.
      She decides to forget the address: The things have lost their value to her.
