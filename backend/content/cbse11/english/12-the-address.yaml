subject: cbse11-eng
chapter: 12
title: The Address (Marga Minco)
tips:
  e11_address_no: "The narrator remembers the number her mother said once: '... Marconi Street'."
  e11_first_visit: "On the first visit, Mrs Dorling did not let her in."
  e11_netherlands: "The author Marga Minco is Dutch, and the story is set after the German occupation."
  e11_tablecloth: "She noticed something she remembered from home, damaged in a particular way."
  e11x12_story: 'Keep the two visits apart: the first, when the door shut, and the second, when she got in.'
  e11x12_meaning: Ask what the objects meant in her mother's home, and what they mean in a stranger's room.

concepts:
- code: cbse11e.s2.address
  title: The Address (Marga Minco)
  notes: |
    Set in the Netherlands after the Second World War. During the war, a Jewish mother's acquaintance, Mrs Dorling, took
    away many of the family's valuable possessions to "keep them safe". After the war, the daughter (narrator), whose
    mother has died, goes to 46 Marconi Street. Mrs Dorling opens the door, pretends not to recognise her, and shuts it.
    The narrator returns another day, when Mrs Dorling's daughter lets her in; she sees her mother's things: the
    tablecloth with a burn mark, the silver cutlery, the antique pewter plate, the green tea set, the hanukkah
    candle-holder. Surrounded by them in a stranger's room, she feels they have lost their value, cut off from the life she
    remembers. She decides to forget the address. Themes: war, loss, memory, letting go.
  explanations:
    text: After the Second World War, a young woman visits the house where a family acquaintance, Mrs Dorling, took her mother's belongings during the war. Mrs Dorling won't let her in at first. When she finally sees her mother's things in a stranger's home, they feel lifeless, so she decides to forget the address and let go of the past.
    visual: Picture a woman standing at the door of number 46 Marconi Street; then sitting in a dim room among familiar silver, a burnt tablecloth and a tea set, feeling like a stranger; then walking away.
    step_by_step: 'Step 1: The war and Mrs Dorling taking the things. Step 2: First visit: the door is shut. Step 3: Second visit: seeing the belongings. Step 4: Her feelings. Step 5: Her decision to forget.'
    real_world: People who lose homes in floods or wars often find that objects can't bring back the life they shared with loved ones.
  picture:
    kind: flow
    steps:
    - 'War: Mrs Dorling takes the family''s things'
    - 'After the war: the daughter visits'
    - Mrs Dorling shuts the door
    - 'Second visit: she sees her mother''s things'
    - She decides to forget the address
    alt: 'The Address: the belongings taken in the war, the two visits and the daughter''s decision to forget.'
  activity:
    type: order
    prompt: 'The Address: put the narrator''s visits in order.'
    steps:
    - Mrs Dorling takes the family's things in wartime
    - After the war, the narrator goes to 46 Marconi Street
    - Mrs Dorling shuts the door
    - The daughter lets her in another day
    - She sees her mother's things in a stranger's room
    - She decides to forget the address
    reasons:
      After the war, the narrator goes to 46 Marconi Street: She wants to see her mother's things.
      Mrs Dorling shuts the door: She pretends not to know her.
      The daughter lets her in another day: She tries again.
      She sees her mother's things in a stranger's room: Inside, she finds the tablecloth and silver.
      She decides to forget the address: The things have lost their value to her.
  lesson:
    - teach: Marga Minco's story is set in the Netherlands after the Second World War. During the war, Mrs Dorling, an acquaintance of the narrator's Jewish mother, took away many of the family's valuable things, saying she would keep them safe. The narrator's mother has since died.
      check:
        prompt: Why did the family let Mrs Dorling take their things?
        options:
        - she said she would keep them safe during the war
        - she bought them at a fair price
        - they were broken
        answer: she said she would keep them safe during the war
        why: Jewish families feared losing everything, so her offer seemed kind.
      ways:
      - style: visual
        teach: What happened during the war, and the situation after it.
        picture:
          kind: flow
          steps:
          - 'War: Mrs Dorling takes the family''s valuables'
          - She says she will keep them safe
          - The narrator's mother dies
          - 'After the war: the daughter seeks the address'
          alt: During the war Mrs Dorling took the family's valuables, saying she would keep them safe; the mother has since died, and after the war the daughter goes looking for the address.
      - style: real_world
        teach: During the Second World War, Jewish families in occupied Europe often handed valuables to neighbours before being taken away. After the war, survivors who went back sometimes found people living with their things and unwilling to return them.
    - teach: 'After the war the daughter goes to the address, 46 Marconi Street. Mrs Dorling opens the door, pretends not to know her, and shuts it. The narrator comes back another day; Mrs Dorling''s daughter lets her in. In the room she sees her mother''s things: the tablecloth with a burn mark, the silver cutlery, the pewter plate, the green tea set, the Hanukkah candle-holder.'
      picture:
        kind: flow
        steps:
        - 'War: Mrs Dorling takes the things'
        - Mother dies
        - 'First visit: door shut'
        - 'Second visit: daughter lets her in'
        - Decides to forget the address
        alt: The order of events in The Address.
      check:
        prompt: What did Mrs Dorling's behaviour on the first visit show?
        options:
        - she did not want to give anything back
        - she was very ill
        - she did not speak Dutch
        answer: she did not want to give anything back
        why: Pretending not to recognise someone avoids a claim on the goods.
      ways:
      - style: step_by_step
        teach: 'Step 1: First visit: Mrs Dorling opens the door, pretends not to know her and shuts it. Step 2: Second visit: Mrs Dorling''s daughter lets her in. Step 3: Inside she recognises her mother''s things. Step 4: Notice how strange it feels to see them in a stranger''s room.'
      - style: real_world
        teach: Imagine finding your grandmother's favourite steel tumbler in a shop or a stranger's kitchen. It is the same object, but without the home it belonged to, it feels oddly empty. The narrator feels this about the tablecloth and the cutlery.
    - teach: Among her mother's things, in a stranger's room, the narrator feels they have lost their value. They belonged to a life that no longer exists. She decides to forget the address. Letting go of the objects is a way of keeping the real memory of her mother.
      check:
        prompt: Why does she decide to forget the address?
        options:
        - the objects mean nothing cut off from her mother's home
        - she found a better house
        - Mrs Dorling paid her
        answer: the objects mean nothing cut off from her mother's home
        why: Their value was in the life they were part of, not in the things.
      ways:
      - style: visual
        teach: Why the narrator decides to forget the address.
        picture:
          kind: compare
          columns:
          - title: In her mother's home
            points:
            - part of daily family life
            - full of meaning
          - title: In a stranger's room
            points:
            - cut off from that life
            - have lost their value
          alt: In her mother's home the objects were full of meaning; in a stranger's room they are cut off from that life and have lost their value.
      - style: step_by_step
        teach: 'Step 1: Ask what the things meant to her: memories of her mother. Step 2: Ask what they mean now: nothing, in the wrong setting. Step 3: Ask what she chooses: to forget the address. Step 4: Ask why: to keep the true memory of her mother, not the objects.'
  items:
  - prompt: What was the house number on Marconi Street?
    answer: '46'
    check: '46'
    difficulty: 1
    hints:
    - Mrs Dorling's house.
    - Forty-six.
    solution: "The mother gave the narrator the address: number 46, Marconi Street."
    mistakes: {"64": "e11_address_no", "4": "e11_address_no", "16": "e11_address_no"}
  - prompt: Who had taken the mother's belongings?
    options:
    - Mrs Dorling
    - The narrator's aunt
    - The soldiers
    - A neighbour's son
    answer: Mrs Dorling
    difficulty: 1
    hints:
    - An acquaintance.
    - Marconi Street.
    solution: "Mrs Dorling took the family's things for 'safe keeping' during the war and kept them."
    mistakes:
      The soldiers: eng11_read_again
  - prompt: In which country is the story set?
    options:
    - the Netherlands
    - India
    - France
    - Germany
    answer: the Netherlands
    difficulty: 2
    hints:
    - Dutch writer.
    - Holland.
    solution: "Marga Minco's story is set in the Netherlands during and after the Second World War."
    mistakes: {"India": "e11_netherlands", "France": "e11_netherlands", "Germany": "e11_netherlands"}
  - prompt: What happened on the narrator's first visit?
    options:
    - "Mrs Dorling shut the door on her"
    - "She was welcomed warmly inside"
    - "Nobody was at home when she came"
    - "She got all her things back at once"
    answer: Mrs Dorling shut the door on her
    difficulty: 1
    hints:
    - Pretended not to know her.
    - Closed.
    solution: Mrs Dorling closed the door.
    mistakes: {"She was welcomed warmly inside": "e11_first_visit", "Nobody was at home when she came": "e11_first_visit", "She got all her things back at once": "e11_first_visit"}
  - prompt: Why did the narrator decide to forget the address?
    options:
    - "The objects had lost their meaning away from her mother's home"
    - "She was afraid that Mrs Dorling would call the police on her"
    - "She was moving abroad soon and could not take things with her"
    - "The house had been pulled down and the street no longer existed"
    answer: The objects had lost their meaning away from her mother's home
    difficulty: 2
    hints:
    - In strange surroundings.
    - Memories, not things.
    solution: The things felt lifeless, cut off from the life she remembered.
    mistakes:
      "She was afraid that Mrs Dorling would call the police on her": eng11_irony
  - prompt: Which of these did she recognise in Mrs Dorling's house?
    options:
    - "the tablecloth with a burn mark"
    - "an old piano in the corner"
    - "a car parked outside the door"
    - "her own school books on a shelf"
    answer: the tablecloth with a burn mark
    difficulty: 2
    hints:
    - A small mark.
    - On the table.
    solution: The tablecloth with a burn mark.
    mistakes: {"an old piano in the corner": "e11_tablecloth", "a car parked outside the door": "e11_tablecloth", "her own school books on a shelf": "e11_tablecloth"}
  - prompt: Which war is the background of the story?
    options:
    - the Second World War
    - the First World War
    - the Kalinga war
    answer: the Second World War
    difficulty: 1
    hints:
    - Jewish families were in danger.
    - The story is set after it ended.
    solution: 'Step 1: Jewish persecution in Europe. Step 2: the Second World War.'
    mistakes:
      the First World War: e11x12_story
      the Kalinga war: e11x12_story
  - prompt: Who let the narrator into the house on her second visit?
    options:
    - Mrs Dorling's daughter
    - Mrs Dorling
    - a policeman
    answer: Mrs Dorling's daughter
    difficulty: 1
    hints:
    - Mrs Dorling was out.
    - A younger member of the family.
    solution: 'Step 1: second visit. Step 2: the daughter opened the door.'
    mistakes:
      Mrs Dorling: e11x12_story
      a policeman: e11x12_story
  - prompt: What was the mother's religion, as the story suggests?
    options:
    - Jewish
    - Hindu
    - Buddhist
    answer: Jewish
    difficulty: 1
    hints:
    - Think of the Hanukkah candle-holder.
    - Who was persecuted in the war?
    solution: 'Step 1: Hanukkah is a Jewish festival. Step 2: Jewish.'
    mistakes:
      Hindu: e11x12_story
      Buddhist: e11x12_story
  - prompt: Which object had a burn mark?
    options:
    - the tablecloth
    - the pewter plate
    - the tea set
    answer: the tablecloth
    difficulty: 2
    hints:
    - It was made of cloth.
    - It showed she recognised it at once.
    solution: 'Step 1: a burn mark on fabric. Step 2: the tablecloth.'
    mistakes:
      the pewter plate: e11x12_story
      the tea set: e11x12_story
  - prompt: What colour was the tea set?
    options:
    - green
    - red
    - black
    answer: green
    difficulty: 2
    hints:
    - It is one of the remembered things.
    - Think of the list in the room.
    solution: 'Step 1: she lists her mother''s things. Step 2: a green tea set.'
    mistakes:
      red: e11x12_story
      black: e11x12_story
  - prompt: Why did Mrs Dorling pretend not to recognise the narrator?
    options:
    - "she wanted to keep the valuables"
    - "her eyesight had become very weak"
    - "she had truly never met her before"
    answer: she wanted to keep the valuables
    difficulty: 2
    hints:
    - What would recognising her lead to?
    - She had the family's things.
    solution: 'Step 1: recognition would mean returning things. Step 2: greed.'
    mistakes:
      "her eyesight had become very weak": e11x12_meaning
      "she had truly never met her before": e11x12_meaning
  - prompt: How did seeing the things in Mrs Dorling's room make the narrator feel?
    options:
    - "that they were lifeless and out of place"
    - "happy and grateful to have them back"
    - "proud of how well Mrs Dorling kept them"
    answer: that they were lifeless and out of place
    difficulty: 3
    hints:
    - They were in a stranger's room.
    - Their connection to her mother was missing.
    solution: 'Step 1: familiar things, wrong place. Step 2: they felt lifeless.'
    mistakes:
      "happy and grateful to have them back": e11x12_meaning
      "proud of how well Mrs Dorling kept them": e11x12_meaning
  - prompt: What is the main theme of 'The Address'?
    options:
    - "loss, memory and letting go after war"
    - "winning a hard battle in the war"
    - "travelling to new places for fun"
    answer: loss, memory and letting go after war
    difficulty: 3
    hints:
    - She lost her mother and home.
    - She chooses to let go.
    solution: 'Step 1: war took her family''s life. Step 2: she lets go of the objects.'
    mistakes:
      "winning a hard battle in the war": e11x12_meaning
      "travelling to new places for fun": e11x12_meaning
  - prompt: Did the narrator take her mother's things home?
    options:
    - "no, she left them and decided to forget the address"
    - "yes, she packed them up and took them home that day"
    - "she took the silver cutlery and carried it away"
    answer: no, she left them and decided to forget the address
    difficulty: 2
    hints:
    - Look at the ending.
    - She chose to let go.
    solution: 'Step 1: the objects felt meaningless. Step 2: she left them.'
    mistakes:
      "yes, she packed them up and took them home that day": e11x12_meaning
      "she took the silver cutlery and carried it away": e11x12_meaning
  - prompt: 'Assertion (A): The narrator decides to forget the address.

      Reason (R): Her mother''s things, in a stranger''s room, no longer hold the life they once belonged to.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The objects have lost their meaning, so she lets go of the address; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: On her first visit, Mrs Dorling opens the door, pretends not to know the narrator, and shuts it. What does this suggest about Mrs Dorling?'
    options:
    - "She wants to keep the family's things for herself"
    - "She has truly forgotten who the narrator is"
    - "She is too busy that day to stop and talk"
    answer: She wants to keep the family's things for herself
    hints:
    - What did Mrs Dorling take during the war?
    - Why might she pretend?
    solution: Pretending not to know her lets Mrs Dorling avoid returning the valuables she took.
    mistakes:
      "She has truly forgotten who the narrator is": e11x12_story
      "She is too busy that day to stop and talk": e11x12_story
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student thinks the narrator should have fought to get the things back. Which reason from the story explains why she did not?'
    options:
    - "The objects had lost their meaning away from her mother's life"
    - "She was afraid of Mrs Dorling's daughter and her sharp words"
    - "She already had better and newer things in her own home"
    answer: The objects had lost their meaning away from her mother's life
    hints:
    - How did she feel seeing them in that room?
    - What mattered more to her than the objects?
    solution: Cut off from her mother's home, the objects meant nothing; she chose to keep her memories instead.
    mistakes:
      "She was afraid of Mrs Dorling's daughter and her sharp words": e11x12_meaning
      "She already had better and newer things in her own home": e11x12_meaning
    exam: competency
    difficulty: 2
  - prompt: Why did the narrator's mother give her valuables to Mrs Dorling during the war?
    options:
    - "Mrs Dorling said she would keep them safe"
    - "She sold them to Mrs Dorling for money"
    - "She gave them away as a wedding gift"
    answer: Mrs Dorling said she would keep them safe
    hints:
    - What did Mrs Dorling promise?
    - Why would a Jewish family fear for its things in wartime?
    solution: Mrs Dorling took the things, saying she would keep them safe through the war.
    mistakes:
      "She sold them to Mrs Dorling for money": e11x12_story
      "She gave them away as a wedding gift": e11x12_story
    exam: short
    difficulty: 2
