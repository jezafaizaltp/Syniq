# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 7.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 7
title: Childhood (Markus Natten)
tips:
  e11_childhood_age: "The first stanza names the day he passed a certain birthday."
  e11_childhood_end: "The last stanza says childhood went to some forgotten place: into the face of a very young child."
  e11_childhood_q: "Every stanza ends with the same question. Which one?"
  e11_growing_up: "The poet learns that adults are hypocrites and that his mind is his own. What did he gain, and what did he lose?"
  e11_hell_heaven: "He realised that Hell and Heaven could not be found on a map. Which school subject teaches maps?"
  e11x07_stage: Each stanza offers one possible moment when childhood ended. Find the one the question points to.
  e11x07_idea: "Ask what each discovery takes away from the child, and what it gives in return."

concepts:
- code: cbse11e.h7.childhood
  title: Childhood (Markus Natten)
  notes: |
    The poet asks when his childhood ended. Was it the day he ceased to be eleven? Was it when he realised that Hell and
    Heaven could not be found in geography, so they might not exist? Was it when he saw that adults were not all they
    seemed, that they talked of love and preached of love but did not act so lovingly? Was it when he found his mind was
    his own, to use any way he chose, thinking his own thoughts? It went to some forgotten place, "hidden in an infant's
    face". Theme: growing up as the loss of innocence and the gaining of reason, independence and individuality.
  explanations:
    text: The poet wonders when exactly his childhood was lost. Was it turning eleven, realising heaven and hell aren't on any map, seeing that adults don't practise what they preach, or finding that his mind was his own? He decides childhood now lives only in a baby's innocent face.
    visual: 'Picture a boy at three doors: one labelled ''age eleven'', one with a world map showing no heaven or hell, one with adults saying ''love'' but frowning, and one where he thinks for himself. Behind them all, a baby''s smiling face.'
    step_by_step: 'Step 1: Note the repeated question. Step 2: List each possible moment. Step 3: Connect each to growing up (reason, doubt, independence). Step 4: Read the ending: childhood is in an infant''s face.'
    real_world: Many teenagers notice when adults say one thing and do another, just as the poet did.
  picture:
    kind: flow
    steps:
    - When he stopped being eleven?
    - When heaven and hell weren't in geography?
    - When adults seemed hypocritical?
    - When his mind became his own?
    - Childhood hides in an infant's face
    alt: The poet's questions about when childhood ended, and the answer that it lives in an infant's face.
  activity:
    type: sort
    prompt: 'Childhood: which question shows what he learnt?'
    bins:
    - Geography and faith
    - Adults' hypocrisy
    - His own mind
    items:
    - label: Hell and Heaven can't be found on a map
      bin: Geography and faith
      clue: Where are Hell and Heaven?
      why: He couldn't find them in geography, so he began to doubt them.
    - label: They talked of love but didn't act lovingly
      bin: Adults' hypocrisy
      clue: Saying vs doing.
      why: 'Adults preached love but didn''t practise it: hypocrisy.'
    - label: Thinking his own thoughts
      bin: His own mind
      clue: Independence.
      why: Finding his mind was his own shows individuality.
    - label: Adults were not all they seemed
      bin: Adults' hypocrisy
      clue: Grown-ups.
      why: Seeing through adults is about their hypocrisy.
    - label: Using his mind any way he chose
      bin: His own mind
      clue: Choice.
      why: Choosing how to think is his own mind at work.
  lesson:
    - teach: 'Markus Natten''s poem keeps asking one question: when did my childhood go? Each stanza suggests a different moment. The first is simply an age: was it the day the poet stopped being eleven?'
      check:
        prompt: How is the poem built?
        options:
        - as a series of questions about when childhood ended
        - as a story about a school trip
        - as a list of toys
        answer: as a series of questions about when childhood ended
        why: Each stanza asks again, with a new possible answer.
    - teach: 'The next moments are discoveries. Hell and Heaven could not be found in geography, so maybe they were not real: reason began to question what he had been told. Adults talked and preached of love but did not always act lovingly: he began to see hypocrisy.'
      check:
        prompt: 'Seeing that adults preached love but did not act lovingly is noticing:'
        options:
        - hypocrisy
        - kindness
        - geography
        answer: hypocrisy
        why: Saying one thing and doing another is hypocrisy.
    - teach: 'The last moment: finding that his mind was his own, to use any way he chose. Growing up means losing innocence but gaining reason, independence and individuality. Childhood has gone to some forgotten place, ''hidden in an infant''s face''.'
      picture:
        kind: flow
        steps:
        - Turning eleven?
        - 'Reason: Hell and Heaven not in geography'
        - Seeing adults' hypocrisy
        - Mind of my own
        - 'Childhood: hidden in an infant''s face'
        alt: The possible moments when the poet's childhood ended, in order.
      check:
        prompt: Why does the poet say childhood is 'hidden in an infant's face'?
        options:
        - innocence now lives only in the very young
        - he has a baby photo
        - infants hide things
        answer: innocence now lives only in the very young
        why: Only a small child still has that pure innocence.
  items:
  - prompt: What is the main question of the poem?
    options:
    - When did my childhood go?
    - Where is my school?
    - Why is it raining?
    - Who are my friends?
    answer: When did my childhood go?
    difficulty: 1
    hints:
    - Repeated.
    - Refrain.
    solution: When did my childhood go?
    mistakes: {"Where is my school?": "e11_childhood_q", "Why is it raining?": "e11_childhood_q", "Who are my friends?": "e11_childhood_q"}
  - prompt: At what age does the poet first wonder if childhood ended?
    answer: '11'
    check: '11'
    difficulty: 1
    hints:
    - The day he ceased to be...
    - Eleven.
    solution: Eleven.
    mistakes: {"12": "e11_childhood_age", "10": "e11_childhood_age", "13": "e11_childhood_age"}
  - prompt: Where could the poet not find Hell and Heaven?
    options:
    - In geography
    - In the sky
    - In books of poems
    - In the garden
    answer: In geography
    difficulty: 2
    hints:
    - Maps.
    - A school subject.
    solution: In geography.
    mistakes: {"In the sky": "e11_hell_heaven", "In books of poems": "e11_hell_heaven", "In the garden": "e11_hell_heaven"}
  - prompt: What did the poet notice about adults?
    options:
    - They preached love but didn't act lovingly
    - They were always kind
    - They never spoke
    - They were all teachers
    answer: They preached love but didn't act lovingly
    difficulty: 2
    hints:
    - Hypocrisy.
    - Not what they seemed.
    solution: They didn't practise what they preached.
    mistakes:
      They were always kind: eng11_poem_meaning
  - prompt: Where does the poet say his childhood went?
    options:
    - Hidden in an infant's face
    - Into a box
    - Up to the stars
    - Into the sea
    answer: Hidden in an infant's face
    difficulty: 1
    hints:
    - The last line.
    - Innocence.
    solution: To some forgotten place, hidden in an infant's face.
    mistakes: {"Into a box": "e11_childhood_end", "Up to the stars": "e11_childhood_end", "Into the sea": "e11_childhood_end"}
  - prompt: 'The poem suggests that growing up means:'
    options:
    - thinking for yourself and losing innocence
    - getting taller only
    - going to a new school
    - forgetting how to read
    answer: thinking for yourself and losing innocence
    difficulty: 2
    hints:
    - His mind became his own.
    - Reason replaces belief.
    solution: Gaining independence and reason, and losing innocence.
    mistakes: {"getting taller only": "e11_growing_up", "going to a new school": "e11_growing_up", "forgetting how to read": "e11_growing_up"}
  - prompt: Which tone best describes the poem?
    options:
    - thoughtful and questioning
    - angry and loud
    - funny and silly
    answer: thoughtful and questioning
    difficulty: 1
    hints:
    - Notice how many lines end with a question mark.
    - The poet is reflecting.
    solution: 'Step 1: many questions. Step 2: a thoughtful tone.'
    mistakes:
      angry and loud: e11x07_idea
      funny and silly: e11x07_idea
  - prompt: Who wrote the poem 'Childhood'?
    options:
    - Markus Natten
    - Ted Hughes
    - Walt Whitman
    answer: Markus Natten
    difficulty: 1
    hints:
    - The other two wrote other poems in this book.
    - Look at the byline.
    solution: 'Step 1: check the author. Step 2: Markus Natten.'
    mistakes:
      Ted Hughes: e11x07_stage
      Walt Whitman: e11x07_stage
  - prompt: Why could Hell and Heaven not be found in geography?
    options:
    - they are not places shown on any map
    - the poet lost his atlas
    - they were in history books
    answer: they are not places shown on any map
    difficulty: 1
    hints:
    - Geography studies real places.
    - No map marks them.
    solution: 'Step 1: geography maps the world. Step 2: Hell and Heaven are not on it.'
    mistakes:
      the poet lost his atlas: e11x07_stage
      they were in history books: e11x07_stage
  - prompt: What did the poet gain by questioning Hell and Heaven?
    options:
    - the habit of reasoning for himself
    - a new map
    - a prize
    answer: the habit of reasoning for himself
    difficulty: 2
    hints:
    - He stopped accepting things without proof.
    - Think of logic.
    solution: 'Step 1: he tested an idea against facts. Step 2: reasoning.'
    mistakes:
      a new map: e11x07_idea
      a prize: e11x07_idea
  - prompt: '''His mind was his own'' means the poet discovered:'
    options:
    - he could think his own thoughts
    - he had forgotten everything
    - his parents decided for him
    answer: he could think his own thoughts
    difficulty: 2
    hints:
    - It is about independence.
    - Nobody else controls his thinking.
    solution: 'Step 1: ownership of the mind. Step 2: independent thought.'
    mistakes:
      he had forgotten everything: e11x07_idea
      his parents decided for him: e11x07_idea
  - prompt: What does the poet lose in growing up?
    options:
    - innocence
    - his name
    - his home
    answer: innocence
    difficulty: 2
    hints:
    - Childhood trusts everything.
    - That trust fades.
    solution: 'Step 1: discoveries end simple trust. Step 2: innocence is lost.'
    mistakes:
      his name: e11x07_idea
      his home: e11x07_idea
  - prompt: Does the poet find a clear answer to his question?
    options:
    - no, he suggests possibilities but ends uncertain
    - yes, exactly at age eleven
    - yes, on his birthday party
    answer: no, he suggests possibilities but ends uncertain
    difficulty: 3
    hints:
    - Look at the last stanza.
    - Childhood went to 'some forgotten place'.
    solution: 'Step 1: several moments are offered. Step 2: none is fixed as the answer.'
    mistakes:
      yes, exactly at age eleven: e11x07_stage
      yes, on his birthday party: e11x07_stage
  - prompt: What is the difference between how adults talked and acted, in the poem?
    options:
    - they spoke of love but did not always act lovingly
    - they never spoke at all
    - they acted kindly but spoke rudely
    answer: they spoke of love but did not always act lovingly
    difficulty: 3
    hints:
    - Compare words with deeds.
    - They preached one thing.
    solution: 'Step 1: words of love. Step 2: actions that did not match.'
    mistakes:
      they never spoke at all: e11x07_stage
      they acted kindly but spoke rudely: e11x07_stage
  - prompt: 'The poem treats growing up as mainly a change of:'
    options:
    - mind and understanding
    - height and weight
    - school and class
    answer: mind and understanding
    difficulty: 3
    hints:
    - None of the stanzas talk about the body after the first.
    - Each one is a discovery.
    solution: 'Step 1: reason, seeing hypocrisy, independence. Step 2: changes of the mind.'
    mistakes:
      height and weight: e11x07_idea
      school and class: e11x07_idea
