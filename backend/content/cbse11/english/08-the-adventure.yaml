concepts:
- code: cbse11e.h8.adventure
  title: The Adventure (Jayant Narlikar)
  notes: |
    Professor Gangadharpant Gaitonde, a historian, travels to Bombay. After a collision with a truck near Khandala (in the
    real world), he wakes in an alternative world where the Marathas won the Third Battle of Panipat (1761): Vishwasrao
    survived because a bullet narrowly missed him, Bhausaheb led the army to victory, and the Marathas ruled India; the
    East India Company was kept in check, and Bombay shows signs of an independent, modern India (the Peshwa's rule,
    British only as traders). In the town hall library he reads history books showing this. At a meeting in Azad Maidan he
    sits in the empty chair reserved for the president and is thrown out; he comes back to his own world. His friend,
    physicist Rajendra Deshpande, explains with catastrophe theory and quantum theory (the observer, alternative
    realities): a small event can change everything. Themes: history, science fiction, cause and effect.
  explanations:
    text: Professor Gaitonde, a historian, finds himself in a Bombay where the Marathas won the Battle of Panipat and the British never ruled India. After he is thrown out of a public meeting, he returns to his own world. His physicist friend Rajendra explains how a tiny event, like a bullet missing, could lead to a different history.
    visual: 'Draw two roads splitting at Panipat in 1761: on one, a bullet hits Vishwasrao and the Marathas lose (our world); on the other, it misses and the Marathas win (Gaitonde''s adventure).'
    step_by_step: 'Step 1: Gaitonde''s journey and accident. Step 2: The different Bombay he sees. Step 3: What the history books say. Step 4: The meeting and his return. Step 5: Rajendra''s scientific explanation.'
    real_world: People often wonder 'what if' about big moments, like a missed train that changed someone's life; this story turns that idea into science fiction.
  picture:
    kind: flow
    steps:
    - Gaitonde travels to Bombay
    - Wakes in a different world
    - Learns the Marathas won Panipat
    - Thrown out of the meeting
    - Rajendra explains catastrophe theory
    alt: 'The Adventure: Gaitonde''s trip, the alternative world, the history he finds, the meeting and Rajendra''s explanation.'
  activity:
    type: sort
    prompt: 'The Adventure: which world?'
    bins:
    - Gaitonde's real world
    - The alternative world
    items:
    - label: The Marathas lost at Panipat in 1761
      bin: Gaitonde's real world
      clue: What happened in our history.
      why: In real history the Marathas lost.
    - label: Vishwasrao survives a bullet
      bin: The alternative world
      clue: A bullet just missed.
      why: His survival changed history in the other world.
    - label: The British rule India
      bin: Gaitonde's real world
      clue: Our history.
      why: In the real world the British took over.
    - label: The British are only traders
      bin: The alternative world
      clue: The Company kept in check.
      why: In the other world the East India Company stayed traders.
    - label: Rajendra explains it with catastrophe theory
      bin: Gaitonde's real world
      clue: After he returns.
      why: Rajendra explains it after Gaitonde is back home.
  items:
  - prompt: Which battle had a different result in Gaitonde's adventure?
    options:
    - Third Battle of Panipat
    - Battle of Plassey
    - Battle of Haldighati
    - Battle of Buxar
    answer: Third Battle of Panipat
    difficulty: 1
    hints:
    - '1761.'
    - Marathas.
    solution: The Third Battle of Panipat.
    mistakes:
      Battle of Plassey: eng11_read_again
  - prompt: In which year was the Third Battle of Panipat fought?
    answer: '1761'
    check: '1761'
    difficulty: 2
    hints:
    - Eighteenth century.
    - 1700s.
    solution: '1761.'
    mistakes: {"1526": "e11_panipat", "1556": "e11_panipat", "1857": "e11_panipat"}
  - prompt: What is Rajendra Deshpande's profession?
    options:
    - Physicist
    - Historian
    - Doctor
    - Lawyer
    answer: Physicist
    difficulty: 1
    hints:
    - Explains with science.
    - Quantum theory.
    solution: A physicist.
    mistakes: {"Historian": "e11_rajendra", "Doctor": "e11_rajendra", "Lawyer": "e11_rajendra"}
  - prompt: Which theory does Rajendra use to explain the adventure?
    options:
    - Catastrophe theory
    - Germ theory
    - Big Bang theory
    - Theory of evolution
    answer: Catastrophe theory
    difficulty: 2
    hints:
    - Small change, big effect.
    - Catastrophe.
    solution: Catastrophe theory.
    mistakes: {"Germ theory": "e11_catastrophe", "Big Bang theory": "e11_catastrophe", "Theory of evolution": "e11_catastrophe"}
  - prompt: 'In the alternative world, Vishwasrao survived because:'
    options:
    - a bullet narrowly missed him
    - he did not fight
    - he ran away
    - the battle was cancelled
    answer: a bullet narrowly missed him
    difficulty: 2
    hints:
    - A small event.
    - Changed history.
    solution: A bullet missed him.
    mistakes: {"he did not fight": "e11_vishwasrao", "he ran away": "e11_vishwasrao", "the battle was cancelled": "e11_vishwasrao"}
  - prompt: Why was Gaitonde thrown out of the meeting?
    options:
    - He sat in the president's empty chair
    - He shouted
    - He had no ticket
    - He was late
    answer: He sat in the president's empty chair
    difficulty: 2
    hints:
    - A tradition there.
    - Empty chair.
    solution: He sat in the chair kept empty for the president.
    mistakes: {"He shouted": "e11_gaitonde_chair", "He had no ticket": "e11_gaitonde_chair", "He was late": "e11_gaitonde_chair"}
