# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 8.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 8
title: The Adventure (Jayant Narlikar)
tips:
  e11_catastrophe: "The theory is about sudden jumps after small changes, named after disasters."
  e11_gaitonde_chair: "At the Azad Maidan meeting, Gaitonde saw the chair empty and did something forbidden."
  e11_panipat: "The Third Battle of Panipat was in the 18th century, between Marathas and Afghans."
  e11_rajendra: "Rajendra explains the event with a scientific theory. What field is he an expert in?"
  e11_vishwasrao: "In real history he was killed by a bullet. In the alternative world, what happened to that bullet?"
  e11x08_world: 'Keep the two worlds apart: the real one, and the one where Panipat ended differently.'
  e11x08_science: 'Rajendra''s idea: one small change at a key moment can lead to a very different outcome.'

concepts:
- code: cbse11e.h8.adventure
  title: The Adventure (Jayant Narlikar)
  notes: |
    Professor Gangadharpant Gaitonde, a historian, travels to Bombay. After a collision with a truck near Khandala (in the
    real world), he wakes in an alternative world where the Marathas won the Third Battle of Panipat (1761): Vishwasrao
    survived because a bullet narrowly missed him, Bhausaheb led the army to victory, and the Marathas ruled India; the
    East India Company was kept in check, and Bombay shows signs of an independent, modern India (the Peshwa's rule,
    British only as traders). In the town hall library he reads history books showing this. At a meeting in Azad Maidan he
    sits in the empty chair reserved for the president and is thrown out; he comes back to his own world. His friend,
    physicist Rajendra Deshpande, explains with catastrophe theory and quantum theory (the observer, alternative
    realities): a small event can change everything. Themes: history, science fiction, cause and effect.
  explanations:
    text: Professor Gaitonde, a historian, finds himself in a Bombay where the Marathas won the Battle of Panipat and the British never ruled India. After he is thrown out of a public meeting, he returns to his own world. His physicist friend Rajendra explains how a tiny event, like a bullet missing, could lead to a different history.
    visual: 'Draw two roads splitting at Panipat in 1761: on one, a bullet hits Vishwasrao and the Marathas lose (our world); on the other, it misses and the Marathas win (Gaitonde''s adventure).'
    step_by_step: 'Step 1: Gaitonde''s journey and accident. Step 2: The different Bombay he sees. Step 3: What the history books say. Step 4: The meeting and his return. Step 5: Rajendra''s scientific explanation.'
    real_world: People often wonder 'what if' about big moments, like a missed train that changed someone's life; this story turns that idea into science fiction.
  picture:
    kind: flow
    steps:
    - Gaitonde travels to Bombay
    - Wakes in a different world
    - Learns the Marathas won Panipat
    - Thrown out of the meeting
    - Rajendra explains catastrophe theory
    alt: 'The Adventure: Gaitonde''s trip, the alternative world, the history he finds, the meeting and Rajendra''s explanation.'
  activity:
    type: sort
    prompt: 'The Adventure: which world?'
    bins:
    - Gaitonde's real world
    - The alternative world
    items:
    - label: The Marathas lost at Panipat in 1761
      bin: Gaitonde's real world
      clue: What happened in our history.
      why: In real history the Marathas lost.
    - label: Vishwasrao survives a bullet
      bin: The alternative world
      clue: A bullet just missed.
      why: His survival changed history in the other world.
    - label: The British rule India
      bin: Gaitonde's real world
      clue: Our history.
      why: In the real world the British took over.
    - label: The British are only traders
      bin: The alternative world
      clue: The Company kept in check.
      why: In the other world the East India Company stayed traders.
    - label: Rajendra explains it with catastrophe theory
      bin: Gaitonde's real world
      clue: After he returns.
      why: Rajendra explains it after Gaitonde is back home.
  lesson:
    - teach: Jayant Narlikar, a scientist, wrote this story. Professor Gaitonde, a historian, is travelling to Bombay. Near Khandala his car collides with a truck, and he wakes up in a different world, one that looks like Bombay but whose history went another way.
      check:
        prompt: What sends Gaitonde into the other world?
        options:
        - a collision with a truck near Khandala
        - a dream after reading a novel
        - a time machine
        answer: a collision with a truck near Khandala
        why: The accident is the moment his experience shifts.
      ways:
      - style: visual
        teach: Two characters in the story and what each one stands for.
        picture:
          kind: compare
          columns:
          - title: Professor Gaitonde
            points:
            - historian
            - experiences the other world
          - title: Rajendra Deshpande
            points:
            - physicist
            - explains it with science
          alt: Professor Gaitonde, a historian, experiences the other world, and his friend Rajendra Deshpande, a physicist, explains it with science.
      - style: step_by_step
        teach: 'Step 1: Note the journey: Gaitonde is travelling to Bombay. Step 2: Note the accident near Khandala: his car hits a truck. Step 3: Note what he finds when he wakes: a Bombay that looks familiar but is different. Step 4: Ask what could explain this change.'
    - teach: In this world the Marathas won the Third Battle of Panipat (1761). A bullet narrowly missed Vishwasrao, Bhausaheb led the army to victory, and the Marathas ruled India. The East India Company stayed only as traders. In the town hall library Gaitonde reads history books that tell this story.
      picture:
        kind: compare
        columns:
        - title: Real history
          points:
          - Marathas lost Panipat, 1761
          - British took power
          - Vishwasrao killed
        - title: Gaitonde's world
          points:
          - Marathas won Panipat
          - British only as traders
          - Vishwasrao survived
        alt: Comparison of real history with the history of the world Gaitonde visits.
      check:
        prompt: What one small event changed the history of Gaitonde's world?
        options:
        - a bullet narrowly missed Vishwasrao
        - a ship sank at Bombay
        - a king was born early
        answer: a bullet narrowly missed Vishwasrao
        why: His survival kept the army together and turned the battle.
      ways:
      - style: step_by_step
        teach: 'Step 1: Real history: the Marathas lost the Third Battle of Panipat in 1761. Step 2: Story history: a bullet misses Vishwasrao and the Marathas win. Step 3: Result: the Marathas rule India and the East India Company stays as traders. Step 4: One small change reshapes everything after it.'
      - style: real_world
        teach: Imagine one cricket match where a single dropped catch was held instead. The team might win the series, the captain might keep the job, and a whole career could turn out differently. The story asks the same 'what if' about Indian history.
    - teach: At a meeting in Azad Maidan Gaitonde sits in the empty president's chair, is thrown out, and returns to his own world. His friend Rajendra Deshpande, a physicist, explains it with catastrophe theory (a small change can cause a huge effect) and quantum ideas about alternative realities.
      check:
        prompt: 'Catastrophe theory, as Rajendra uses it, says:'
        options:
        - a small change at a key point can produce a big effect
        - all accidents are planned
        - history never changes
        answer: a small change at a key point can produce a big effect
        why: The near-miss bullet is that kind of small change.
      ways:
      - style: visual
        teach: How the story ends and how science explains it.
        picture:
          kind: flow
          steps:
          - Gaitonde sits in the empty president's chair
          - He is thrown out of the meeting
          - He returns to his own world
          - 'Rajendra explains: catastrophe theory'
          - And quantum ideas of other realities
          alt: At Azad Maidan Gaitonde sits in the empty president's chair, is thrown out and returns to his own world; Rajendra explains it using catastrophe theory and quantum ideas about other realities.
      - style: real_world
        teach: 'Weather scientists say a tiny change in air at one place can lead to a big storm elsewhere weeks later. Catastrophe theory in the story is the same idea: small causes can have huge effects.'
  items:
  - prompt: Which battle had a different result in Gaitonde's adventure?
    options:
    - Third Battle of Panipat
    - Battle of Plassey
    - Battle of Haldighati
    - Battle of Buxar
    answer: Third Battle of Panipat
    difficulty: 1
    hints:
    - '1761.'
    - Marathas.
    solution: The Third Battle of Panipat.
    mistakes:
      Battle of Plassey: eng11_read_again
  - prompt: In which year was the Third Battle of Panipat fought?
    answer: '1761'
    check: '1761'
    difficulty: 2
    hints:
    - Eighteenth century.
    - 1700s.
    solution: '1761.'
    mistakes: {"1526": "e11_panipat", "1556": "e11_panipat", "1857": "e11_panipat"}
  - prompt: What is Rajendra Deshpande's profession?
    options:
    - Physicist
    - Historian
    - Doctor
    - Lawyer
    answer: Physicist
    difficulty: 1
    hints:
    - Explains with science.
    - Quantum theory.
    solution: A physicist.
    mistakes: {"Historian": "e11_rajendra", "Doctor": "e11_rajendra", "Lawyer": "e11_rajendra"}
  - prompt: Which theory does Rajendra use to explain the adventure?
    options:
    - Catastrophe theory
    - Germ theory
    - Big Bang theory
    - Theory of evolution
    answer: Catastrophe theory
    difficulty: 2
    hints:
    - Small change, big effect.
    - Catastrophe.
    solution: Catastrophe theory.
    mistakes: {"Germ theory": "e11_catastrophe", "Big Bang theory": "e11_catastrophe", "Theory of evolution": "e11_catastrophe"}
  - prompt: 'In the alternative world, Vishwasrao survived because:'
    options:
    - a bullet narrowly missed him
    - he did not fight
    - he ran away
    - the battle was cancelled
    answer: a bullet narrowly missed him
    difficulty: 2
    hints:
    - A small event.
    - Changed history.
    solution: A bullet missed him.
    mistakes: {"he did not fight": "e11_vishwasrao", "he ran away": "e11_vishwasrao", "the battle was cancelled": "e11_vishwasrao"}
  - prompt: Why was Gaitonde thrown out of the meeting?
    options:
    - He sat in the president's empty chair
    - He shouted
    - He had no ticket
    - He was late
    answer: He sat in the president's empty chair
    difficulty: 2
    hints:
    - A tradition there.
    - Empty chair.
    solution: He sat in the chair kept empty for the president.
    mistakes: {"He shouted": "e11_gaitonde_chair", "He had no ticket": "e11_gaitonde_chair", "He was late": "e11_gaitonde_chair"}
  - prompt: What subject did Professor Gaitonde specialise in?
    options:
    - history
    - physics
    - medicine
    answer: history
    difficulty: 1
    hints:
    - He notices that the books in the library are 'wrong'.
    - His friend is the scientist.
    solution: 'Step 1: he studies the past. Step 2: history.'
    mistakes:
      physics: e11x08_world
      medicine: e11x08_world
  - prompt: Which city was Gaitonde travelling to?
    options:
    - Bombay
    - Delhi
    - Calcutta
    answer: Bombay
    difficulty: 1
    hints:
    - Khandala is on the way.
    - Azad Maidan is there.
    solution: 'Step 1: Khandala, Azad Maidan. Step 2: Bombay.'
    mistakes:
      Delhi: e11x08_world
      Calcutta: e11x08_world
  - prompt: Where did Gaitonde read the history of the other world?
    options:
    - the town hall library
    - a newspaper on the train
    - his own diary
    answer: the town hall library
    difficulty: 1
    hints:
    - He looked for books.
    - It is a public place.
    solution: 'Step 1: he wanted written history. Step 2: the town hall library.'
    mistakes:
      a newspaper on the train: e11x08_world
      his own diary: e11x08_world
  - prompt: Who led the Maratha army to victory in Gaitonde's world?
    options:
    - Bhausaheb
    - Rajendra
    - Gaitonde
    answer: Bhausaheb
    difficulty: 2
    hints:
    - He was a Maratha commander.
    - Not one of the modern characters.
    solution: 'Step 1: the battle was in 1761. Step 2: Bhausaheb led it.'
    mistakes:
      Rajendra: e11x08_world
      Gaitonde: e11x08_world
  - prompt: 'In Gaitonde''s world, the East India Company was:'
    options:
    - kept in check, trading only
    - ruling all of India
    - never formed
    answer: kept in check, trading only
    difficulty: 2
    hints:
    - The Marathas held power.
    - The British could still trade.
    solution: 'Step 1: Maratha victory. Step 2: British limited to trade.'
    mistakes:
      ruling all of India: e11x08_world
      never formed: e11x08_world
  - prompt: What did the Bombay of Gaitonde's world show signs of?
    options:
    - an independent, modern India
    - a British colony
    - a deserted city
    answer: an independent, modern India
    difficulty: 2
    hints:
    - Who held power after Panipat there?
    - The British were only traders.
    solution: 'Step 1: the Marathas ruled. Step 2: India stayed independent and modernised.'
    mistakes:
      a British colony: e11x08_world
      a deserted city: e11x08_world
  - prompt: What role does the empty chair at Azad Maidan play in the plot?
    options:
    - it causes the event that sends Gaitonde back
    - it is a gift to Gaitonde
    - it starts the battle
    answer: it causes the event that sends Gaitonde back
    difficulty: 3
    hints:
    - What happened after he sat in it?
    - Being thrown out was the turning point.
    solution: 'Step 1: he sat in the president''s seat. Step 2: thrown out, he returned to his world.'
    mistakes:
      it is a gift to Gaitonde: e11x08_science
      it starts the battle: e11x08_science
  - prompt: Why is Rajendra, a physicist, needed in the story?
    options:
    - to give a scientific explanation of the two worlds
    - to drive the car
    - to rule the Marathas
    answer: to give a scientific explanation of the two worlds
    difficulty: 3
    hints:
    - The story is science fiction.
    - He explains with theories.
    solution: 'Step 1: Gaitonde cannot explain it. Step 2: Rajendra uses catastrophe and quantum ideas.'
    mistakes:
      to drive the car: e11x08_science
      to rule the Marathas: e11x08_science
  - prompt: Which genre best fits 'The Adventure'?
    options:
    - science fiction
    - a cookbook
    - a fairy tale with talking animals
    answer: science fiction
    difficulty: 1
    hints:
    - It uses ideas from physics.
    - It imagines another reality.
    solution: 'Step 1: scientific theory and an alternative world. Step 2: science fiction.'
    mistakes:
      a cookbook: e11x08_science
      a fairy tale with talking animals: e11x08_science
  - prompt: 'Assertion (A): In Gaitonde''s other world, the East India Company stayed only as traders.

      Reason (R): The Marathas won the Third Battle of Panipat in that world.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. A Maratha victory left no room for Company rule, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In the other world, a bullet narrowly misses Vishwasrao and the Marathas win at Panipat. Which idea from the story does this one small change illustrate?'
    options:
    - 'Catastrophe theory: a small change can cause a huge effect'
    - Gravity
    - The water cycle
    answer: 'Catastrophe theory: a small change can cause a huge effect'
    hints:
    - How big was the change at Panipat?
    - How big were the results for India?
    solution: A single near-miss changed the whole course of history, which is the heart of catastrophe theory.
    mistakes:
      Gravity: e11x08_science
      The water cycle: e11x08_science
    exam: case
    difficulty: 2
  - prompt: 'Situation: A reader wonders why Narlikar, a scientist, made a historian the main character. What is the most likely reason?'
    options:
    - A historian can notice how different the other world's history is
    - Historians are good drivers
    - Scientists cannot be characters in stories
    answer: A historian can notice how different the other world's history is
    hints:
    - What does Gaitonde read in the library?
    - Who would spot changes in history?
    solution: Only someone who knows real history well can recognise that the other world went another way.
    mistakes:
      Historians are good drivers: e11x08_world
      Scientists cannot be characters in stories: e11x08_world
    exam: competency
    difficulty: 2
  - prompt: What did Gaitonde do at the meeting in Azad Maidan that led to his return?
    options:
    - Sat in the empty president's chair
    - Gave a speech on history
    - Left quietly
    answer: Sat in the empty president's chair
    hints:
    - What was empty on the stage?
    - Why was he thrown out?
    solution: He sat in the empty president's chair, was thrown out, and returned to his own world.
    mistakes:
      Gave a speech on history: e11x08_world
      Left quietly: e11x08_world
    exam: short
    difficulty: 2
