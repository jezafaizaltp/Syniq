    reasons:
      They hide the horse in Fetvajian's barn: They can't take it home.
      They ride every morning: Hidden, the horse can be ridden daily.
      John Byro visits and mentions his stolen horse: The owner suspects but trusts the family.
      The boys return the horse: Their honesty wins over temptation.
      Byro finds it better trained: Mourad's way with animals shows.
