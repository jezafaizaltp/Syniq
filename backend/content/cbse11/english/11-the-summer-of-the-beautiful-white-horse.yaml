concepts:
- code: cbse11e.s1.horse
  title: The Summer of the Beautiful White Horse (William Saroyan)
  notes: |
    Aram, aged nine, and his cousin Mourad, thirteen, belong to the Garoghlanian tribe, a poor Armenian family famous for
    honesty. One summer morning Mourad arrives at 4 a.m. on a beautiful white horse and lets Aram ride. They hide the horse
    in the barn of a deserted vineyard of a farmer named Fetvajian and ride it every morning. Mourad has a way with
    animals; the horse throws Aram. Uncle Khosrove, a man with an enormous moustache who shouts "It is no harm; pay no
    attention to it", appears briefly. John Byro, an Assyrian farmer, whose horse was stolen, visits Aram's home and says
    he would think the horse he saw was his, but he knows the family's honesty. The boys return the horse; Byro finds
    it better trained than before. Themes: honesty, temptation, childhood desire.
  explanations:
    text: Aram and his cousin Mourad, from a family known for honesty, ride a beautiful white horse every morning in secret. It actually belongs to a farmer, John Byro. When Byro sees the horse and says he trusts the family's honesty, the boys return it, and the farmer finds it even better behaved.
    visual: Picture two boys on a white horse galloping along a country road at dawn, then hiding it in an old barn, and finally leading it back to the farmer's vineyard.
    step_by_step: 'Step 1: Who Aram and Mourad are and their family''s honesty. Step 2: The horse arrives at dawn. Step 3: Hiding and riding it. Step 4: John Byro''s visit. Step 5: Returning the horse.'
    real_world: Borrowing something without asking, even meaning to give it back, is still taking it; the boys learn that honesty matters more than a thrill.
