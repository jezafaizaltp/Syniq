# CBSE Class 11 English (NCERT Snapshots, supplementary reader, rationalised syllabus), chapter 11.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 11
title: The Summer of the Beautiful White Horse (William Saroyan)
tips:
  e11_aram_age: "Aram is the narrator and the younger cousin."
  e11_garoghlanian: "The boys struggle with the idea of stealing because their tribe was known for one quality."
  e11_khosrove: "Uncle Khosrove waves away every problem with the same calm phrase."
  e11_mourad_age: "Mourad is the older cousin."
  e11x11_plot: 'Put the events in order: the horse arrives, it is hidden, John Byro visits, the horse goes back.'
  e11x11_honest: Think about the family's famous honesty, and how the boys' wish for a horse tested it.

concepts:
- code: cbse11e.s1.horse
  title: The Summer of the Beautiful White Horse (William Saroyan)
  notes: |
    Aram, aged nine, and his cousin Mourad, thirteen, belong to the Garoghlanian tribe, a poor Armenian family famous for
    honesty. One summer morning Mourad arrives at 4 a.m. on a beautiful white horse and lets Aram ride. They hide the horse
    in the barn of a deserted vineyard of a farmer named Fetvajian and ride it every morning. Mourad has a way with
    animals; the horse throws Aram. Uncle Khosrove, a man with an enormous moustache who shouts "It is no harm; pay no
    attention to it", appears briefly. John Byro, an Assyrian farmer, whose horse was stolen, visits Aram's home and says
    he would think the horse he saw was his, but he knows the family's honesty. The boys return the horse; Byro finds
    it better trained than before. Themes: honesty, temptation, childhood desire.
  explanations:
    text: Aram and his cousin Mourad, from a family known for honesty, ride a beautiful white horse every morning in secret. It actually belongs to a farmer, John Byro. When Byro sees the horse and says he trusts the family's honesty, the boys return it, and the farmer finds it even better behaved.
    visual: Picture two boys on a white horse galloping along a country road at dawn, then hiding it in an old barn, and finally leading it back to the farmer's vineyard.
    step_by_step: 'Step 1: Who Aram and Mourad are and their family''s honesty. Step 2: The horse arrives at dawn. Step 3: Hiding and riding it. Step 4: John Byro''s visit. Step 5: Returning the horse.'
    real_world: Borrowing something without asking, even meaning to give it back, is still taking it; the boys learn that honesty matters more than a thrill.
  picture:
    kind: flow
    steps:
    - Mourad arrives with the white horse at dawn
    - The boys ride and hide it in a barn
    - John Byro says his horse was stolen
    - Byro trusts the family's honesty
    - The boys return the horse
    alt: 'The white horse story: the boys ride it in secret, the owner visits, and they return it.'
  activity:
    type: order
    prompt: 'The Summer of the Beautiful White Horse: put the story in order.'
    steps:
    - Mourad arrives at 4 a.m. on a white horse
    - They hide the horse in Fetvajian's barn
    - They ride every morning
    - John Byro visits and mentions his stolen horse
    - The boys return the horse
    - Byro finds it better trained
    reasons:
      They hide the horse in Fetvajian's barn: They can't take it home.
      They ride every morning: Hidden, the horse can be ridden daily.
      John Byro visits and mentions his stolen horse: The owner suspects but trusts the family.
      The boys return the horse: Their honesty wins over temptation.
      Byro finds it better trained: Mourad's way with animals shows.
  lesson:
    - teach: 'William Saroyan''s story is told by Aram, aged nine. He and his cousin Mourad, thirteen, belong to the Garoghlanian tribe: a poor Armenian family famous for its honesty. They had no money, but nobody in the family would ever steal.'
      check:
        prompt: Why is it shocking when Mourad turns up on a horse?
        options:
        - the family was poor and famous for honesty, so the horse must have been taken
        - Mourad was afraid of horses
        - horses were not allowed in the town
        answer: the family was poor and famous for honesty, so the horse must have been taken
        why: They could not have bought it, yet stealing went against everything the family stood for.
      ways:
      - style: visual
        teach: The two cousins and the family they belong to.
        picture:
          kind: compare
          columns:
          - title: Aram
            points:
            - narrator
            - aged nine
            - longs to ride a horse
          - title: Mourad
            points:
            - cousin, aged thirteen
            - brings the horse
          - title: Garoghlanian tribe
            points:
            - poor Armenian family
            - famous for honesty
            - never steal
          alt: Aram, nine, is the narrator; Mourad, thirteen, is his cousin; both belong to the poor but famously honest Garoghlanian family.
      - style: step_by_step
        teach: 'Step 1: Note the family''s poverty. Step 2: Note its proud honesty. Step 3: Ask what happens when a poor boy longs for something costly, like a horse. Step 4: Expect a test of honesty: that is the conflict of the story.'
    - teach: One summer morning at 4 a.m., Mourad arrives on a beautiful white horse and lets Aram ride. Aram badly wants to ride, so he persuades himself that taking a horse for a ride is not really stealing, as long as they do not sell it. They hide the horse in the barn of a deserted vineyard of a farmer named Fetvajian and ride it every morning. Mourad has a way with animals; the horse throws Aram.
      picture:
        kind: flow
        steps:
        - '4 a.m.: Mourad arrives on the horse'
        - Hidden in Fetvajian's barn
        - Morning rides
        - John Byro visits
        - Horse returned, better trained
        alt: The order of events in the story, from the horse's arrival to its return.
      check:
        prompt: How does Aram persuade himself the ride is not stealing?
        options:
        - they are not selling the horse
        - they paid for it
        - John Byro lent it
        answer: they are not selling the horse
        why: Riding without selling is how he excuses it to himself.
      ways:
      - style: step_by_step
        teach: 'Step 1: Mourad arrives at 4 a.m. on a white horse. Step 2: Aram wants to ride and argues that riding is not stealing if they do not sell it. Step 3: They hide the horse in a deserted vineyard barn. Step 4: They ride it every morning in secret.'
      - style: real_world
        teach: Have you ever borrowed a friend's cycle without asking, telling yourself you would bring it back soon? Aram does the same kind of thinking, and the story asks whether a good reason makes it right.
    - teach: John Byro, an Assyrian farmer whose horse was stolen, visits Aram's home. He sees the horse later and says he would think it was his, but he knows the family's honesty. The boys return the horse, and Byro finds it better trained than before. Temptation lost to honesty in the end.
      check:
        prompt: Why does John Byro not accuse the boys directly?
        options:
        - he trusts the family's reputation for honesty
        - he does not care about the horse
        - he is scared of Mourad
        answer: he trusts the family's reputation for honesty
        why: Their good name made him give them a chance to return it.
      ways:
      - style: visual
        teach: How the story is resolved once the owner appears.
        picture:
          kind: flow
          steps:
          - John Byro, the owner, visits Aram's home
          - He sees the horse later
          - He trusts the family's honesty
          - The boys return the horse
          - Byro finds it better trained
          alt: John Byro visits, later sees the horse but trusts the family's honesty; the boys return it, and Byro finds it better trained than before.
      - style: real_world
        teach: In many small towns, a family's good name is worth more than money. Byro does not accuse the boys because of their family's reputation, and that trust is what makes them return the horse.
  items:
  - prompt: How old was Aram?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - Younger cousin.
    - Nine.
    solution: "Aram, the narrator, was nine years old."
    mistakes: {"13": "e11_aram_age", "11": "e11_aram_age", "15": "e11_aram_age"}
  - prompt: How old was Mourad?
    answer: '13'
    check: '13'
    difficulty: 1
    hints:
    - Older cousin.
    - Thirteen.
    solution: "Mourad, Aram's cousin, was thirteen."
    mistakes: {"9": "e11_mourad_age", "11": "e11_mourad_age", "15": "e11_mourad_age"}
  - prompt: Who owned the white horse?
    options:
    - John Byro
    - Uncle Khosrove
    - Fetvajian
    - Mourad's father
    answer: John Byro
    difficulty: 1
    hints:
    - An Assyrian farmer.
    - His horse was stolen.
    solution: "The horse belonged to John Byro, a farmer, who later recognised it."
    mistakes:
      Fetvajian: eng11_read_again
  - prompt: 'The Garoghlanian family was famous for its:'
    options:
    - honesty
    - wealth
    - music
    - horses
    answer: honesty
    difficulty: 1
    hints:
    - Poor but...
    - Trust.
    solution: "The family was famous for honesty, so the boys returned the horse rather than keep a stolen one."
    mistakes: {"wealth": "e11_garoghlanian", "music": "e11_garoghlanian", "horses": "e11_garoghlanian"}
  - prompt: What did Uncle Khosrove often say?
    options:
    - It is no harm; pay no attention to it
    - Get out of my house
    - Bring me the horse
    - Who stole my money?
    answer: It is no harm; pay no attention to it
    difficulty: 2
    hints:
    - A big moustache.
    - Calming words.
    solution: '''It is no harm; pay no attention to it.'''
    mistakes: {"Get out of my house": "e11_khosrove", "Bring me the horse": "e11_khosrove", "Who stole my money?": "e11_khosrove"}
  - prompt: What surprised John Byro when the horse came back?
    options:
    - It was better trained than before
    - It was injured
    - It had grown
    - It had a foal
    answer: It was better trained than before
    difficulty: 2
    hints:
    - Mourad's way with animals.
    - More gentle.
    solution: It was better tempered and trained.
    mistakes:
      It was injured: eng11_irony
  - prompt: Who tells the story?
    options:
    - Aram
    - Mourad
    - John Byro
    answer: Aram
    difficulty: 1
    hints:
    - The narrator is the younger cousin.
    - The story uses 'I'.
    solution: 'Step 1: the narrator is nine. Step 2: Aram.'
    mistakes:
      Mourad: e11x11_plot
      John Byro: e11x11_plot
  - prompt: At what time did Mourad arrive with the horse?
    options:
    - 4 a.m.
    - noon
    - midnight
    answer: 4 a.m.
    difficulty: 1
    hints:
    - It was very early.
    - The town was still asleep.
    solution: 'Step 1: before dawn. Step 2: 4 a.m.'
    mistakes:
      noon: e11x11_plot
      midnight: e11x11_plot
  - prompt: Where did the boys hide the horse?
    options:
    - in the barn of a deserted vineyard
    - in their kitchen
    - in John Byro's field
    answer: in the barn of a deserted vineyard
    difficulty: 1
    hints:
    - Fetvajian owned the place.
    - Nobody was using it.
    solution: 'Step 1: they needed a secret place. Step 2: an empty vineyard barn.'
    mistakes:
      in their kitchen: e11x11_plot
      in John Byro's field: e11x11_plot
  - prompt: What nationality was the Garoghlanian family?
    options:
    - Armenian
    - Assyrian
    - English
    answer: Armenian
    difficulty: 2
    hints:
    - John Byro was the Assyrian.
    - The family came from a country in the Caucasus whose people have names ending in -ian.
    solution: 'Step 1: Byro is Assyrian. Step 2: the family is Armenian.'
    mistakes:
      Assyrian: e11x11_plot
      English: e11x11_plot
  - prompt: Who was the more skilled rider of the two cousins?
    options:
    - Mourad
    - Aram
    - both were equally poor riders
    answer: Mourad
    difficulty: 2
    hints:
    - One of them was thrown off.
    - One 'had a way with animals'.
    solution: 'Step 1: the horse threw Aram. Step 2: Mourad handled it well.'
    mistakes:
      Aram: e11x11_plot
      both were equally poor riders: e11x11_plot
  - prompt: How many years older was Mourad than Aram?
    answer: '4'
    check: 13 - 9
    difficulty: 1
    hints:
    - Use the two ages from the story.
    - Subtract the smaller from the larger.
    solution: 'Step 1: 13 and 9. Step 2: 13 - 9 = 4.'
    mistakes:
      '3': e11x11_plot
      '22': e11x11_plot
  - prompt: What moral struggle does Aram face?
    options:
    - his wish to ride against his family's honesty
    - school against play
    - city against village
    answer: his wish to ride against his family's honesty
    difficulty: 3
    hints:
    - He wanted a horse all his life.
    - Stealing was unthinkable in his family.
    solution: 'Step 1: strong desire. Step 2: strong family value. The conflict is between them.'
    mistakes:
      school against play: e11x11_honest
      city against village: e11x11_honest
  - prompt: Why might the horse have been better trained when it came back?
    options:
    - Mourad had been riding and handling it every morning
    - John Byro trained it at night
    - a circus borrowed it
    answer: Mourad had been riding and handling it every morning
    difficulty: 3
    hints:
    - Who rode it daily?
    - Mourad had a way with animals.
    solution: 'Step 1: daily rides. Step 2: Mourad''s skill trained it.'
    mistakes:
      John Byro trained it at night: e11x11_honest
      a circus borrowed it: e11x11_honest
  - prompt: What finally made the boys return the horse?
    options:
    - their sense of the family's honesty after Byro's visit
    - the horse ran away
    - the police caught them
    answer: their sense of the family's honesty after Byro's visit
    difficulty: 3
    hints:
    - Byro trusted their family.
    - They could not betray that trust.
    solution: 'Step 1: Byro''s trust. Step 2: honesty wins; they return it.'
    mistakes:
      the horse ran away: e11x11_honest
      the police caught them: e11x11_honest
  - prompt: 'Assertion (A): John Byro does not accuse the boys of stealing his horse.

      Reason (R): He knows how honest the Garoghlanian family is.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. His trust in the family's honesty is why he does not accuse them, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Aram tells himself that taking the horse for a ride is not really stealing, as long as they do not sell it. What does this show?'
    options:
    - He is persuading himself because he badly wants to ride
    - He does not know what stealing is
    - Mourad forced him to think so
    answer: He is persuading himself because he badly wants to ride
    hints:
    - What does Aram want most?
    - Why would he need an excuse?
    solution: Aram's longing to ride makes him invent an excuse to quiet his honest conscience.
    mistakes:
      He does not know what stealing is: e11x11_honest
      Mourad forced him to think so: e11x11_plot
    exam: case
    difficulty: 2
  - prompt: 'Situation: A reader asks what finally wins in the story, temptation or honesty. What is the best answer?'
    options:
    - 'Honesty: the boys return the horse'
    - 'Temptation: the boys keep the horse'
    - 'Neither: the horse runs away'
    answer: 'Honesty: the boys return the horse'
    hints:
    - What happens to the horse at the end?
    - Who returns it?
    solution: The boys return the horse to John Byro, so honesty wins over temptation.
    mistakes:
      'Temptation: the boys keep the horse': e11x11_plot
      'Neither: the horse runs away': e11x11_plot
    exam: competency
    difficulty: 2
  - prompt: When John Byro returns his horse, how does he find it?
    options:
    - Better trained than before
    - Thin and badly hurt
    - Unable to be ridden
    answer: Better trained than before
    hints:
    - The boys rode it every morning.
    - What would daily riding do to a horse?
    solution: After the boys' daily rides, Byro finds the horse better trained than before.
    mistakes:
      Thin and badly hurt: e11x11_plot
      Unable to be ridden: e11x11_plot
    exam: short
    difficulty: 2
