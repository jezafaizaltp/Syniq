    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - Younger cousin.
    - Nine.
    solution: Nine.
    mistakes: {"13": "e11_aram_age", "11": "e11_aram_age", "15": "e11_aram_age"}
  - prompt: How old was Mourad?
    answer: '13'
    check: '13'
    difficulty: 1
    hints:
    - Older cousin.
    - Thirteen.
    solution: Thirteen.
    mistakes: {"9": "e11_mourad_age", "11": "e11_mourad_age", "15": "e11_mourad_age"}
  - prompt: Who owned the white horse?
    options:
