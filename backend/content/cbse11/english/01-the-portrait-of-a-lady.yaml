concepts:
- code: cbse11e.h1.portrait
  title: The Portrait of a Lady (Khushwant Singh)
  notes: |
    Khushwant Singh's sketch of his grandmother. She was old, short, fat and slightly bent, always dressed in spotless
    white, telling her rosary beads. In the village she woke him, got him ready for school, went with him to the temple
    school and fed the village dogs with stale chapattis. In the city he went to an English school by motor bus; their
    friendship changed: she couldn't help with his lessons, disliked that there was no teaching about God, and was upset
    that he was taught music, which she thought was not for gentlefolk. She began feeding sparrows in the courtyard. When
    he went abroad for five years, she saw him off silently at the station. On his return she spent an evening singing and
    beating a drum, missing her prayers; she fell ill, prayed, and died peacefully. Thousands of sparrows sat silently
    around her body, ignored the bread crumbs, and flew away after her body was carried off.
  explanations:
    text: 'Khushwant Singh remembers his grandmother: in the village they were close friends; in the city they grew apart as his English schooling and music lessons were things she couldn''t share. She found comfort feeding sparrows. When she died, thousands of sparrows came to mourn her in silence.'
    visual: 'Picture three scenes: a small boy and his grandmother walking to the village temple school; the grandmother alone in a city courtyard surrounded by chirping sparrows; and the sparrows sitting silent around her body.'
    step_by_step: 'Step 1: The village years: close friendship. Step 2: The city: drifting apart (English school, music). Step 3: Going abroad and returning. Step 4: Her death and the sparrows'' silent tribute.'
    real_world: Many grandparents find it hard to share in grandchildren's online classes and new subjects, just as the grandmother couldn't share his English lessons.
  picture:
    kind: flow
    steps:
    - 'Village: walks to temple school together'
    - 'City: English school, they drift apart'
    - She feeds sparrows
    - He goes abroad for five years
    - She dies; sparrows mourn in silence
    alt: 'The Portrait of a Lady: closeness in the village, drifting apart in the city, the sparrows, and her death.'
  items:
  - prompt: What did the grandmother feed the village dogs?
    options:
    - Stale chapattis
    - Rice
    - Milk
    - Biscuits
    answer: Stale chapattis
    difficulty: 1
    hints:
    - On the way back from school.
    - Leftover bread.
    solution: She fed them stale chapattis.
    mistakes:
      Rice: eng11_read_again
  - prompt: Why did the grandmother dislike his music lessons?
    options:
    - She thought music was not for gentlefolk
    - It was too loud
    - It cost too much
    - She wanted him to dance
    answer: She thought music was not for gentlefolk
    difficulty: 2
    hints:
    - Associated with beggars and harlots.
    - Disapproval.
    solution: She felt music was not meant for respectable people.
  - prompt: For how many years did the author go abroad?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - University studies.
    - Five.
    solution: Five years.
  - prompt: Which birds did she feed in the city?
    options:
    - Sparrows
    - Pigeons
    - Crows
    - Parrots
    answer: Sparrows
    difficulty: 1
    hints:
    - In the courtyard.
    - Small brown birds.
    solution: Sparrows.
  - prompt: What did the grandmother do on the evening of his return?
    options:
    - She sang and beat a drum with village women
    - She cried all night
    - She went to the temple
    - She cooked a feast alone
    answer: She sang and beat a drum with village women
    difficulty: 2
    hints:
    - Songs of warriors coming home.
    - She missed her prayers.
    solution: She sang and beat an old drum, and missed her prayers.
  - prompt: What did the sparrows do after she died?
    options:
    - Sat silently and ignored the bread
    - Chirped loudly
    - Ate all the crumbs
    - Flew away at once
    answer: Sat silently and ignored the bread
    difficulty: 2
    hints:
    - A silent tribute.
    - Left when the body was taken.
    solution: They sat in silence, ignored the crumbs and flew away when her body was carried off.
