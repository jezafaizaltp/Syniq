# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 1.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 1
title: The Portrait of a Lady (Khushwant Singh)
tips:
  eng11_read_again: 'Go back to the text: the answer is there. Find the part about that person or moment.'
  eng11_poem_meaning: Poems say more than their words. Ask what the picture in the poem stands for in life.
  eng11_irony: 'Look for the gap between what people expect and what really happens: that''s where the story''s point usually is.'
  e11_drum: "It was the only time she forgot to pray. She gathered women of the neighbourhood with an old instrument."
  e11_portrait_music: "The grandmother linked music with beggars and prostitutes. What did she feel it was not suitable for?"
  e11_sparrows: "In the city she sat in the courtyard, breaking bread for small brown birds."
  e11_sparrows_end: "The birds showed grief too. What did they do with the crumbs the author's mother threw?"
  e11_years: "Re-read the part where he goes abroad and returns. The time is mentioned in years."
  e11x01_text: 'Go back to the part of the story the question names: village, city, or the time after the author returned.'
  e11x01_change: Track how the friendship changes at each stage of the author's life, and why.
concepts:
- code: cbse11e.h1.portrait
  title: The Portrait of a Lady (Khushwant Singh)
  notes: |
    Khushwant Singh's sketch of his grandmother. She was old, short, fat and slightly bent, always dressed in spotless
    white, telling her rosary beads. In the village she woke him, got him ready for school, went with him to the temple
    school and fed the village dogs with stale chapattis. In the city he went to an English school by motor bus; their
    friendship changed: she couldn't help with his lessons, disliked that there was no teaching about God, and was upset
    that he was taught music, which she thought was not for gentlefolk. She began feeding sparrows in the courtyard. When
    he went abroad for five years, she saw him off silently at the station. On his return she spent an evening singing and
    beating a drum, missing her prayers; she fell ill, prayed, and died peacefully. Thousands of sparrows sat silently
    around her body, ignored the bread crumbs, and flew away after her body was carried off.
  explanations:
    text: 'Khushwant Singh remembers his grandmother: in the village they were close friends; in the city they grew apart as his English schooling and music lessons were things she couldn''t share. She found comfort feeding sparrows. When she died, thousands of sparrows came to mourn her in silence.'
    visual: 'Picture three scenes: a small boy and his grandmother walking to the village temple school; the grandmother alone in a city courtyard surrounded by chirping sparrows; and the sparrows sitting silent around her body.'
    step_by_step: 'Step 1: The village years: close friendship. Step 2: The city: drifting apart (English school, music). Step 3: Going abroad and returning. Step 4: Her death and the sparrows'' silent tribute.'
    real_world: Many grandparents find it hard to share in grandchildren's online classes and new subjects, just as the grandmother couldn't share his English lessons.
  picture:
    kind: flow
    steps:
    - 'Village: walks to temple school together'
    - 'City: English school, they drift apart'
    - She feeds sparrows
    - He goes abroad for five years
    - She dies; sparrows mourn in silence
    alt: 'The Portrait of a Lady: closeness in the village, drifting apart in the city, the sparrows, and her death.'
  activity:
    type: sort
    prompt: 'The Portrait of a Lady: in the village or the city?'
    bins:
    - Village
    - City
    items:
    - label: She walked with him to the temple school
      bin: Village
      clue: A school at a temple.
      why: The temple school was in the village.
    - label: She fed the village dogs
      bin: Village
      clue: Stale chapattis.
      why: Feeding dogs on the way to school was in the village.
    - label: He went to school by motor bus
      bin: City
      clue: An English school.
      why: The motor bus and English school were in the city.
    - label: She fed sparrows in the courtyard
      bin: City
      clue: After their friendship changed.
      why: In the city she turned to feeding sparrows.
    - label: She disliked music lessons
      bin: City
      clue: Taught at his English school.
      why: Music was taught at the city school; she disapproved.
  lesson:
    - teach: Khushwant Singh draws a portrait of his grandmother. She was old, short, fat and a little bent, always in spotless white, always telling the beads of her rosary. He found it hard to believe she was ever young and pretty.
      check:
        prompt: What did the grandmother always carry and use while praying?
        options:
        - a rosary
        - a drum
        - a book of songs
        answer: a rosary
        why: Her lips moved in prayer as she told its beads.
      ways:
      - style: visual
        teach: 'The grandmother as the author sees her: how she looks and what she does.'
        picture:
          kind: compare
          columns:
          - title: How she looks
            points:
            - old, short, fat, a little bent
            - always in spotless white
          - title: What she does
            points:
            - tells the beads of her rosary
            - prays almost all the time
          alt: The grandmother is old, short and a little bent, always dressed in spotless white, and is always praying with her rosary.
      - style: step_by_step
        teach: 'Step 1: Note each physical detail the author gives. Step 2: Note each habit. Step 3: Ask what feeling they create together: calm, faith and dignity. Step 4: Notice that the author cannot imagine her young, which shows how fixed her picture is in his mind.'
    - teach: 'The story has three stages. In the village they were close: she readied him for school and went with him to the temple school. In the city, at an English school, she could no longer help, and they drifted. When he went to university he got his own room, and their friendship was broken.'
      check:
        prompt: Why could the grandmother no longer help with lessons in the city?
        options:
        - he was taught English and science she did not know
        - she lost her eyesight
        - she moved away
        answer: he was taught English and science she did not know
        why: The school taught things outside her world.
      ways:
      - style: visual
        teach: The three stages of the friendship between grandmother and grandson.
        picture:
          kind: flow
          steps:
          - 'Village: very close, temple school together'
          - 'City: English school, she can''t help, they drift'
          - 'University: own room, the gap is complete'
          alt: In the village grandmother and grandson were very close; in the city the English school separated them; at university he got his own room and the gap was complete.
      - style: real_world
        teach: 'Many families see this today: a grandparent who walked a child to the village school feels lost when the child moves to a city school and a phone full of new interests. Love stays, but shared daily life shrinks.'
    - teach: 'Her quiet strength shows at the end: she is silent when he goes abroad, celebrates with singing when he returns, and then dies peacefully while praying. The sparrows'' silent mourning shows how much she was loved.'
      picture:
        kind: flow
        steps:
        - 'Village: close friends'
        - 'City school: drifting apart'
        - 'University: own room'
        - Abroad and back
        - Peaceful death
        alt: Stages of the author's relationship with his grandmother.
      check:
        prompt: 'The sparrows'' behaviour after her death mainly shows:'
        options:
        - even nature mourned her
        - they were not hungry
        - it was winter
        answer: even nature mourned her
        why: They ignored the bread and sat silent.
      ways:
      - style: step_by_step
        teach: 'Step 1: Look at her reaction when he leaves: silence and calm. Step 2: Look at the night of his return: she sings and beats a drum, and skips her prayers. Step 3: Look at her death: peaceful, while praying. Step 4: Each scene shows a different side of the same strong, loving person.'
      - style: real_world
        teach: Think of someone in your street who feeds birds every morning. If that person were gone, would the birds notice? The story uses the sparrows to show that her quiet kindness left a mark even on creatures she fed.
  items:
  - prompt: What did the grandmother feed the village dogs?
    options:
    - Stale chapattis
    - Rice
    - Milk
    - Biscuits
    answer: Stale chapattis
    difficulty: 1
    hints:
    - On the way back from school.
    - Leftover bread.
    solution: She fed them stale chapattis.
    mistakes:
      Rice: eng11_read_again
  - prompt: Why did the grandmother dislike his music lessons?
    options:
    - She thought music was not for gentlefolk
    - It was too loud
    - It cost too much
    - She wanted him to dance
    answer: She thought music was not for gentlefolk
    difficulty: 2
    hints:
    - Associated with beggars and harlots.
    - Disapproval.
    solution: She felt music was not meant for respectable people.
    mistakes: {"It was too loud": "e11_portrait_music", "It cost too much": "e11_portrait_music", "She wanted him to dance": "e11_portrait_music"}
  - prompt: For how many years did the author go abroad?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - University studies.
    - Five.
    solution: Five years.
    mistakes: {"2": "e11_years", "10": "e11_years", "3": "e11_years"}
  - prompt: Which birds did she feed in the city?
    options:
    - Sparrows
    - Pigeons
    - Crows
    - Parrots
    answer: Sparrows
    difficulty: 1
    hints:
    - In the courtyard.
    - Small brown birds.
    solution: Sparrows.
    mistakes: {"Pigeons": "e11_sparrows", "Crows": "e11_sparrows", "Parrots": "e11_sparrows"}
  - prompt: What did the grandmother do on the evening of his return?
    options:
    - She sang and beat a drum with village women
    - She cried all night
    - She went to the temple
    - She cooked a feast alone
    answer: She sang and beat a drum with village women
    difficulty: 2
    hints:
    - Songs of warriors coming home.
    - She missed her prayers.
    solution: She sang and beat an old drum, and missed her prayers.
    mistakes: {"She cried all night": "e11_drum", "She went to the temple": "e11_drum", "She cooked a feast alone": "e11_drum"}
  - prompt: What did the sparrows do after she died?
    options:
    - Sat silently and ignored the bread
    - Chirped loudly
    - Ate all the crumbs
    - Flew away at once
    answer: Sat silently and ignored the bread
    difficulty: 2
    hints:
    - A silent tribute.
    - Left when the body was taken.
    solution: They sat in silence, ignored the crumbs and flew away when her body was carried off.
    mistakes: {"Chirped loudly": "e11_sparrows_end", "Ate all the crumbs": "e11_sparrows_end", "Flew away at once": "e11_sparrows_end"}
  - prompt: Who accompanied the author to school in the village?
    options:
    - his grandmother
    - his father
    - a servant
    answer: his grandmother
    difficulty: 1
    hints:
    - Think of the village days.
    - She also carried bread for the dogs.
    solution: 'Step 1: in the village she went with him daily. Step 2: his grandmother.'
    mistakes:
      his father: e11x01_text
      a servant: e11x01_text
  - prompt: Where was the village school?
    options:
    - attached to the temple
    - in the city
    - in the grandmother's house
    answer: attached to the temple
    difficulty: 1
    hints:
    - The priest taught there.
    - She read scriptures while he learnt.
    solution: 'Step 1: the priest taught the alphabet. Step 2: a temple school.'
    mistakes:
      in the city: e11x01_text
      in the grandmother's house: e11x01_text
  - prompt: How did the author travel to school in the city?
    options:
    - by motor bus
    - on foot with his grandmother
    - by train
    answer: by motor bus
    difficulty: 1
    hints:
    - She could no longer go with him.
    - It was a modern school.
    solution: 'Step 1: city life changed things. Step 2: he went by bus.'
    mistakes:
      on foot with his grandmother: e11x01_text
      by train: e11x01_text
  - prompt: 'The turning point in their friendship came when the author:'
    options:
    - went to university and got his own room
    - left the village
    - learnt the alphabet
    answer: went to university and got his own room
    difficulty: 2
    hints:
    - The common link of friendship was snapped.
    - They no longer shared a room.
    solution: 'Step 1: separate room at university. Step 2: friendship broke.'
    mistakes:
      left the village: e11x01_change
      learnt the alphabet: e11x01_change
  - prompt: How did the grandmother react when the author left for abroad?
    options:
    - she was silent and kissed his forehead
    - she wept loudly
    - she refused to come to the station
    answer: she was silent and kissed his forehead
    difficulty: 2
    hints:
    - She was not sentimental.
    - Her lips moved in prayer.
    solution: 'Step 1: she came to the station. Step 2: silent, praying, a kiss.'
    mistakes:
      she wept loudly: e11x01_change
      she refused to come to the station: e11x01_change
  - prompt: What does the grandmother feeding sparrows in the city show?
    options:
    - she found new company after her grandson grew distant
    - she disliked dogs
    - she wanted to sell birds
    answer: she found new company after her grandson grew distant
    difficulty: 2
    hints:
    - Her grandson was busy with his own life.
    - The birds became her friends.
    solution: 'Step 1: loneliness in the city. Step 2: sparrows became her companions.'
    mistakes:
      she disliked dogs: e11x01_change
      she wanted to sell birds: e11x01_change
  - prompt: 'The word ''spotless'' describes her:'
    options:
    - white clothes
    - garden
    - teeth
    answer: white clothes
    difficulty: 2
    hints:
    - Her dress is part of her portrait.
    - It suggests purity.
    solution: 'Step 1: she always wore white. Step 2: spotless clothes.'
    mistakes:
      garden: e11x01_text
      teeth: e11x01_text
  - prompt: The grandmother stopped praying on the evening of the author's return. Why was this unusual?
    options:
    - she never missed her prayers
    - she disliked singing
    - she was ill
    answer: she never missed her prayers
    difficulty: 3
    hints:
    - Think of how she is described all through.
    - What did she do at every quiet moment?
    solution: 'Step 1: she prayed all her life. Step 2: missing prayers showed her joy.'
    mistakes:
      she disliked singing: e11x01_change
      she was ill: e11x01_change
  - prompt: Which phrase best sums up the grandmother?
    options:
    - deeply religious, loving and dignified
    - proud and harsh
    - modern and fashionable
    answer: deeply religious, loving and dignified
    difficulty: 3
    hints:
    - Think of the rosary, the dogs and the sparrows.
    - Think of how she faced death.
    solution: 'Step 1: prayer, kindness to animals, quiet strength. Step 2: religious, loving, dignified.'
    mistakes:
      proud and harsh: e11x01_change
      modern and fashionable: e11x01_change
  - prompt: 'Assertion (A): The grandmother disapproved of the music lessons at the city school.

      Reason (R): She believed music was not meant for gentlefolk.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Her belief about music is the reason she disapproved, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: On the evening of the author''s return, the grandmother gathers women of the neighbourhood, sings and beats an old drum, and forgets her prayers. What does this tell us about her?'
    options:
    - Her joy at his return was greater than even her daily habit of prayer
    - She had stopped believing in prayer
    - She did not care about her grandson
    answer: Her joy at his return was greater than even her daily habit of prayer
    hints:
    - How unusual was it for her to miss prayers?
    - What feeling made her do it?
    solution: Missing prayers was rare for her, so it shows how overwhelming her happiness was.
    mistakes:
      She had stopped believing in prayer: e11x01_text
      She did not care about her grandson: eng11_read_again
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student says the sparrows at the end are just a description of birds. How would you show they matter to the story''s meaning?'
    options:
    - Their silent mourning shows how deeply she was loved
    - They show the city had many birds
    - They show the author liked birdwatching
    answer: Their silent mourning shows how deeply she was loved
    hints:
    - What do the sparrows do after she dies?
    - What does that suggest about her bond with them?
    solution: The sparrows sit silently and ignore the bread, showing grief for the person who fed them every day.
    mistakes:
      They show the city had many birds: eng11_poem_meaning
      They show the author liked birdwatching: e11x01_change
    exam: competency
    difficulty: 2
  - prompt: Which change ended the closeness between the author and his grandmother?
    options:
    - Going to university and getting his own room
    - Moving from the village to the city
    - Going abroad for five years
    answer: Going to university and getting his own room
    hints:
    - The city brought some distance, but not the end.
    - When did the 'turning point' come?
    solution: The final break in their friendship came when he went to university and got a room of his own.
    mistakes:
      Moving from the village to the city: e11x01_change
      Going abroad for five years: e11x01_change
    exam: short
    difficulty: 2
