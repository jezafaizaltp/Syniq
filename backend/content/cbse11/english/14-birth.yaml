# CBSE Class 11 English (NCERT Snapshots, supplementary reader, rationalised syllabus), chapter 14.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 14
title: Birth (A.J. Cronin)
tips:
  e11_birth_feel: "Andrew was tired of routine work. Reviving the baby made him feel what?"
  e11_citadel: "'Birth' is taken from Cronin's novel named after a fortress."
  e11_manson: "Joe Morgan is the father. The doctor is the hero of Cronin's novel."
  e11_morgan_years: "The Morgans had waited a long time, two decades."
  e11_save_first: "The baby seemed lifeless, so Andrew had to choose who needed him first."
  e11x14_events: 'Put the night in order: the call, the difficult birth, saving the mother, then the baby.'
  e11x14_doctor: Think about what this night means to a young doctor at the start of his career.

concepts:
- code: cbse11e.s4.birth
  title: Birth (A.J. Cronin)
  notes: |
    An extract from A.J. Cronin's novel The Citadel. Andrew Manson, a newly qualified young doctor in a Welsh mining
    town, is called near midnight to Joe Morgan's house, where Joe's wife Susan is giving birth to their first child after
    twenty years of marriage. Andrew is upset after an evening with Christine; the birth is difficult. The baby is born
    apparently lifeless (stillborn), and the mother is also in danger; Andrew first saves the mother with an injection,
    then works on the baby. Remembering a case he had seen, he tries alternately dipping the baby into hot and icy cold
    water and rubbing it, and after half an hour the child breathes. Mrs Morgan's old mother and the nurse watch; he
    says "I've done it... I've done something real at last." Themes: a doctor's dedication, life and death.
  explanations:
    text: Young Dr Andrew Manson helps at a difficult birth in a Welsh mining town. The baby seems to be born dead, but after saving the mother, Andrew refuses to give up. He dips the baby alternately in hot and cold water and rubs it until, after half an hour, it breathes.
    visual: Picture a small room lit by a lamp at night; a young doctor holding a limp baby, dipping it into a basin of hot water, then cold, rubbing its chest, until a faint cry breaks the silence.
    step_by_step: 'Step 1: Andrew''s situation and the late call. Step 2: The difficult birth. Step 3: Saving the mother first. Step 4: Reviving the baby. Step 5: His feeling of achievement.'
    real_world: 'Doctors and nurses in labour wards today still follow the idea Andrew learned: never give up too early on a newborn who isn''t breathing.'
  picture:
    kind: flow
    steps:
    - Andrew called to Joe Morgan's house
    - Difficult birth; baby seems dead
    - He saves the mother first
    - Hot and cold water, rubbing
    - The baby breathes
    alt: 'Birth: the call, the difficult delivery, saving the mother, reviving the baby and its first breath.'
  activity:
    type: order
    prompt: 'Birth: put Andrew''s night in order.'
    steps:
    - Andrew is called to Joe Morgan's house
    - The baby is born apparently lifeless
    - He saves the mother with an injection
    - He dips the baby in hot and icy water
    - The child breathes
    reasons:
      The baby is born apparently lifeless: The birth is difficult.
      He saves the mother with an injection: She is also in danger.
      He dips the baby in hot and icy water: Then he works on the baby.
      The child breathes: After half an hour of effort.
  lesson:
    - teach: '''Birth'' is an extract from A.J. Cronin''s novel The Citadel. Andrew Manson is a newly qualified doctor in a Welsh mining town. Near midnight, still upset after an evening with Christine, he is called to the house of Joe Morgan, whose wife Susan is having their first child after twenty years of marriage.'
      check:
        prompt: Why is this birth so important to the Morgans?
        options:
        - it is their first child after twenty years of marriage
        - it is their tenth child
        - they want to sell the house
        answer: it is their first child after twenty years of marriage
        why: They had waited a very long time for a child.
      ways:
      - style: visual
        teach: Who is who in 'Birth' and where it is set.
        picture:
          kind: compare
          columns:
          - title: Doctor
            points:
            - Andrew Manson
            - newly qualified
            - Welsh mining town
          - title: Family
            points:
            - Joe Morgan, the father
            - Susan, the mother
            - first child after 20 years
          alt: Andrew Manson is a newly qualified doctor in a Welsh mining town; Joe and Susan Morgan are expecting their first child after twenty years of marriage.
      - style: step_by_step
        teach: 'Step 1: Note where the extract comes from: The Citadel. Step 2: Note Andrew''s mood: upset after an evening with Christine. Step 3: Note the call near midnight. Step 4: Note why this birth matters so much: the Morgans have waited twenty years.'
    - teach: 'The birth is difficult. The baby is born apparently lifeless, and the mother is also in danger. Andrew must choose: he saves the mother first with an injection. Then he turns to the baby that the nurse has put aside.'
      picture:
        kind: flow
        steps:
        - Midnight call to the Morgans
        - Difficult birth
        - 'Mother in danger: injection'
        - Baby lifeless
        - Hot and cold water, rubbing
        - Baby breathes
        alt: The order of events on the night of the birth.
      check:
        prompt: Why does Andrew treat the mother first?
        options:
        - she is in danger and can still be saved
        - he forgot the baby
        - the nurse told him to leave
        answer: she is in danger and can still be saved
        why: A doctor acts first where life can clearly be saved.
      ways:
      - style: step_by_step
        teach: 'Step 1: The baby is born apparently lifeless. Step 2: The mother is in danger too. Step 3: Andrew must decide whom to help first. Step 4: He saves the mother with an injection. Step 5: Only then does he turn to the baby the nurse has put aside.'
      - style: real_world
        teach: Doctors and nurses in emergency rooms make this kind of choice every day, deciding who needs help first. It is called triage. Andrew, alone at midnight, makes such a choice quickly and calmly.
    - teach: Remembering a case he had seen, Andrew dips the baby by turns into hot water and icy cold water, and rubs it. After about half an hour the child breathes. Andrew says he has done something real at last. The story shows a doctor's dedication and refusal to give up.
      check:
        prompt: What quality does Andrew show with the baby?
        options:
        - he refuses to give up
        - he is careless
        - he is afraid to touch it
        answer: he refuses to give up
        why: He keeps working for half an hour on a child others thought dead.
      ways:
      - style: visual
        teach: How Andrew revives the baby that seemed lifeless.
        picture:
          kind: flow
          steps:
          - Remembers a case he had seen
          - Dips the baby in hot water
          - Then in icy cold water
          - Rubs the baby, again and again
          - After about half an hour, it breathes
          alt: Remembering a case he had seen, Andrew dips the baby in hot and icy water by turns and rubs it, and after about half an hour the baby breathes.
      - style: real_world
        teach: Young doctors in rural hospitals often say one difficult night taught them more than months of routine work. For Andrew, saving this baby is the moment he feels he has done something real.
  items:
  - prompt: What is the young doctor's name?
    options:
    - Andrew Manson
    - Joe Morgan
    - Gaitonde
    - Rajendra
    answer: Andrew Manson
    difficulty: 1
    hints:
    - Hero of The Citadel.
    - Newly qualified.
    solution: "The young doctor is Andrew Manson."
    mistakes: {"Joe Morgan": "e11_manson", "Gaitonde": "e11_manson", "Rajendra": "e11_manson"}
  - prompt: From which novel is 'Birth' taken?
    options:
    - The Citadel
    - Mother's Day
    - The Address
    - Silk Road
    answer: The Citadel
    difficulty: 2
    hints:
    - A.J. Cronin novel.
    - Medical life.
    solution: "'Birth' is an extract from A.J. Cronin's novel The Citadel."
    mistakes: {"Mother's Day": "e11_citadel", "The Address": "e11_citadel", "Silk Road": "e11_citadel"}
  - prompt: After how many years of marriage was this the Morgans' first child?
    answer: '20'
    check: '20'
    difficulty: 2
    hints:
    - A long wait.
    - Twenty.
    solution: "The Morgans had been married twenty years before this first child."
    mistakes: {"10": "e11_morgan_years", "5": "e11_morgan_years", "25": "e11_morgan_years"}
  - prompt: How did Andrew revive the baby?
    options:
    - By dipping it in hot and cold water and rubbing it
    - With a machine
    - By giving it medicine
    - By singing
    answer: By dipping it in hot and cold water and rubbing it
    difficulty: 1
    hints:
    - Alternating temperatures.
    - He remembered a case.
    solution: Alternating hot and icy water and rubbing it.
    mistakes:
      With a machine: eng11_read_again
  - prompt: Whom did Andrew save first?
    options:
    - the mother
    - the baby
    - the grandmother
    - Joe Morgan
    answer: the mother
    difficulty: 2
    hints:
    - She was in danger too.
    - An injection.
    solution: "Andrew first attended to the mother, who was in danger, then revived the baby that seemed stillborn."
    mistakes: {"the baby": "e11_save_first", "the grandmother": "e11_save_first", "Joe Morgan": "e11_save_first"}
  - prompt: What did Andrew feel after reviving the baby?
    options:
    - He had done something real at last
    - Very angry
    - That he should leave medicine
    - Nothing at all
    answer: He had done something real at last
    difficulty: 2
    hints:
    - His words.
    - Achievement.
    solution: That he had 'done something real at last'.
    mistakes: {"Very angry": "e11_birth_feel", "That he should leave medicine": "e11_birth_feel", "Nothing at all": "e11_birth_feel"}
  - prompt: Who wrote the novel The Citadel?
    options:
    - A.J. Cronin
    - J.B. Priestley
    - William Saroyan
    answer: A.J. Cronin
    difficulty: 1
    hints:
    - The other two wrote other pieces in this book.
    - He was himself a doctor.
    solution: 'Step 1: ''Birth'' is from The Citadel. Step 2: A.J. Cronin.'
    mistakes:
      J.B. Priestley: e11x14_events
      William Saroyan: e11x14_events
  - prompt: In what kind of town did Andrew work?
    options:
    - a Welsh mining town
    - a fishing village in Kerala
    - a big city in America
    answer: a Welsh mining town
    difficulty: 1
    hints:
    - It is in Wales.
    - Men worked underground.
    solution: 'Step 1: Wales. Step 2: a mining town.'
    mistakes:
      a fishing village in Kerala: e11x14_events
      a big city in America: e11x14_events
  - prompt: At about what time was Andrew called?
    options:
    - near midnight
    - early morning
    - at lunchtime
    answer: near midnight
    difficulty: 1
    hints:
    - It was late at night.
    - He had just come back from an evening out.
    solution: 'Step 1: after his evening. Step 2: near midnight.'
    mistakes:
      early morning: e11x14_events
      at lunchtime: e11x14_events
  - prompt: How did Andrew help the mother?
    options:
    - with an injection
    - with an operation
    - with a cup of tea
    answer: with an injection
    difficulty: 2
    hints:
    - It was quick.
    - Medicine through a needle.
    solution: 'Step 1: she was in danger. Step 2: he gave an injection.'
    mistakes:
      with an operation: e11x14_events
      with a cup of tea: e11x14_events
  - prompt: For about how long did Andrew work on the baby?
    options:
    - half an hour
    - two minutes
    - all of the next day
    answer: half an hour
    difficulty: 2
    hints:
    - It felt long.
    - Thirty minutes.
    solution: 'Step 1: he kept trying. Step 2: about half an hour.'
    mistakes:
      two minutes: e11x14_events
      all of the next day: e11x14_events
  - prompt: Where did Andrew get the idea of the hot and cold water method?
    options:
    - from a case he had seen before
    - from the nurse
    - from Joe Morgan
    answer: from a case he had seen before
    difficulty: 2
    hints:
    - It came from memory.
    - It was not in his textbooks.
    solution: 'Step 1: he remembered something. Step 2: a case he had seen.'
    mistakes:
      from the nurse: e11x14_events
      from Joe Morgan: e11x14_events
  - prompt: Why does Andrew feel he has 'done something real at last'?
    options:
    - he has saved two lives by his own effort
    - he has been paid a lot
    - he has finished his exams
    answer: he has saved two lives by his own effort
    difficulty: 3
    hints:
    - Mother and baby both lived.
    - He is new to his work.
    solution: 'Step 1: both survive. Step 2: he feels his work truly matters.'
    mistakes:
      he has been paid a lot: e11x14_doctor
      he has finished his exams: e11x14_doctor
  - prompt: What does Andrew's mood before the call add to the story?
    options:
    - it shows he puts his own troubles aside for his patient
    - it makes him refuse the call
    - it has no link at all
    answer: it shows he puts his own troubles aside for his patient
    difficulty: 3
    hints:
    - He was upset after seeing Christine.
    - He still went and worked all night.
    solution: 'Step 1: he was troubled. Step 2: duty came first.'
    mistakes:
      it makes him refuse the call: e11x14_doctor
      it has no link at all: e11x14_doctor
  - prompt: What is the main theme of 'Birth'?
    options:
    - a doctor's dedication in a fight between life and death
    - a family holiday
    - a mining strike
    answer: a doctor's dedication in a fight between life and death
    difficulty: 3
    hints:
    - A baby nearly died.
    - One person would not give up.
    solution: 'Step 1: life against death. Step 2: the doctor''s dedication wins.'
    mistakes:
      a family holiday: e11x14_doctor
      a mining strike: e11x14_doctor
  - prompt: 'Assertion (A): Andrew attended to the mother before the baby.

      Reason (R): The mother''s life was in danger and needed immediate care.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Her immediate danger is why he saved her first, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: The nurse puts the apparently lifeless baby aside, but Andrew spends half an hour trying to revive it. What quality does this show?'
    options:
    - Dedication and refusal to give up
    - Carelessness about the mother
    - That he did not trust the nurse at all
    answer: Dedication and refusal to give up
    hints:
    - Had the nurse given up?
    - Why keep trying for so long?
    solution: Andrew keeps trying when others have given up, showing dedication to saving life.
    mistakes:
      Carelessness about the mother: e11x14_events
      That he did not trust the nurse at all: e11x14_doctor
    exam: case
    difficulty: 2
  - prompt: 'Situation: Andrew says he has done something real at last. Why does this night matter so much to him?'
    options:
    - Saving a life showed him the true worth of his work
    - He was paid a large fee
    - He had never seen a baby before
    answer: Saving a life showed him the true worth of his work
    hints:
    - How did he feel before the call?
    - What did he achieve that night?
    solution: After routine work and a low evening, saving the baby gave him a real sense of purpose as a doctor.
    mistakes:
      He was paid a large fee: e11x14_doctor
      He had never seen a baby before: e11x14_doctor
    exam: competency
    difficulty: 2
  - prompt: How did Andrew save the mother before turning to the baby?
    options:
    - With an injection
    - By dipping her in cold water
    - By calling another doctor
    answer: With an injection
    hints:
    - The hot and cold water was for someone else.
    - He acted alone and quickly.
    solution: Andrew saved the mother first with an injection, then turned to the baby.
    mistakes:
      By dipping her in cold water: e11x14_events
      By calling another doctor: e11x14_events
    exam: short
    difficulty: 2
