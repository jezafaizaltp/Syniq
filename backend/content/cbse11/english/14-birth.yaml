concepts:
- code: cbse11e.s4.birth
  title: Birth (A.J. Cronin)
  notes: |
    An extract from A.J. Cronin's novel The Citadel. Andrew Manson, a newly qualified young doctor in a Welsh mining
    town, is called near midnight to Joe Morgan's house, where Joe's wife Susan is giving birth to their first child after
    twenty years of marriage. Andrew is upset after an evening with Christine; the birth is difficult. The baby is born
    apparently lifeless (stillborn), and the mother is also in danger; Andrew first saves the mother with an injection,
    then works on the baby. Remembering a case he had seen, he tries alternately dipping the baby into hot and icy cold
    water and rubbing it, and after half an hour the child breathes. Mrs Morgan's old mother and the nurse watch; he
    says "I've done it... I've done something real at last." Themes: a doctor's dedication, life and death.
  explanations:
    text: Young Dr Andrew Manson helps at a difficult birth in a Welsh mining town. The baby seems to be born dead, but after saving the mother, Andrew refuses to give up. He dips the baby alternately in hot and cold water and rubs it until, after half an hour, it breathes.
    visual: Picture a small room lit by a lamp at night; a young doctor holding a limp baby, dipping it into a basin of hot water, then cold, rubbing its chest, until a faint cry breaks the silence.
    step_by_step: 'Step 1: Andrew''s situation and the late call. Step 2: The difficult birth. Step 3: Saving the mother first. Step 4: Reviving the baby. Step 5: His feeling of achievement.'
    real_world: 'Doctors and nurses in labour wards today still follow the idea Andrew learned: never give up too early on a newborn who isn''t breathing.'
