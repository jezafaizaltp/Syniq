subject: cbse11-eng
chapter: 5
title: The Laburnum Top (Ted Hughes)
tips:
  e11_goldfinch: "Ted Hughes describes a small yellow-and-black bird whose colour matches the laburnum."
  e11_laburnum_end: "The poem opens with a silent, still tree. What does it go back to?"
  e11_month: "The poem begins on an autumn afternoon, early in the season."
  e11_poets: "Match each poem to its poet using the list of poems in Hornbill. 'The Laburnum Top' is by a British poet laureate."
  e11_yellow: "Laburnum leaves in autumn and the goldfinch share a colour."

concepts:
- code: cbse11e.h5.laburnum
  title: The Laburnum Top (Ted Hughes)
  notes: |
    A laburnum tree in September afternoon sunshine, with a few yellow leaves and seeds fallen, is silent and still. A
    goldfinch arrives with a "chirrup", and the tree comes alive: the bird flicks about, "tremor", "flirts", and her nest
    is described with her young; she is "the engine of her family". Then she leaves, and the tree returns to stillness.
    Imagery of colour (yellow), sound and movement; metaphor of the engine; the cycle of life and of stillness and
    activity.
  explanations:
    text: A quiet laburnum tree in September comes alive when a goldfinch arrives to feed her chicks in her nest. The bird's chirping and movement fill the tree with life, and when she flies off, the tree is still and silent again.
    visual: Picture a still yellow tree in autumn sunlight. A small goldfinch flits in, chirping, and the leaves tremble; then she darts away and all is quiet again.
    step_by_step: 'Step 1: The still tree. Step 2: The goldfinch arrives. Step 3: The tree comes alive with her family. Step 4: She leaves; stillness returns. Step 5: Look at the ''engine'' metaphor.'
    real_world: A quiet house suddenly filling with noise when children come home from school is like the tree coming alive when the goldfinch arrives.
  picture:
    kind: flow
    steps:
    - Tree silent and still
    - Goldfinch arrives chirping
    - Tree comes alive
    - Goldfinch flies away
    - Tree is still again
    alt: 'The Laburnum Top: stillness, the goldfinch''s arrival, the tree alive, and stillness again.'
  activity:
    type: order
    prompt: 'The Laburnum Top: put the poem''s moments in order.'
    steps:
    - The tree is silent and still
    - A goldfinch arrives with a chirrup
    - The tree comes alive with her family
    - She leaves
    - The tree is still again
    reasons:
      A goldfinch arrives with a chirrup: Stillness is broken by the bird.
      The tree comes alive with her family: Her arrival wakes up the nest.
      She leaves: She is 'the engine of her family' and moves on.
      The tree is still again: Without her, the stillness returns.
  items:
  - prompt: Which bird visits the laburnum tree?
    options:
    - A goldfinch
    - A sparrow
    - A crow
    - A robin
    answer: A goldfinch
    difficulty: 1
    hints:
    - Yellow and black.
    - Gold in its name.
    solution: A goldfinch.
    mistakes: {"A sparrow": "e11_goldfinch", "A crow": "e11_goldfinch", "A robin": "e11_goldfinch"}
  - prompt: In which month is the poem set?
    options:
    - September
    - January
    - May
    - July
    answer: September
    difficulty: 1
    hints:
    - Autumn.
    - Afternoon sunshine.
    solution: September.
    mistakes: {"January": "e11_month", "May": "e11_month", "July": "e11_month"}
  - prompt: 'The goldfinch is called ''the engine of her family'' because:'
    options:
    - she keeps her family going with her energy
    - she is noisy like a machine
    - she is made of metal
    - she pulls a cart
    answer: she keeps her family going with her energy
    difficulty: 2
    hints:
    - Metaphor.
    - Drives life.
    solution: She powers and sustains her family.
    mistakes:
      she is noisy like a machine: eng11_poem_meaning
  - prompt: What happens to the tree when the bird leaves?
    options:
    - It returns to stillness
    - It falls down
    - It flowers
    - It catches fire
    answer: It returns to stillness
    difficulty: 1
    hints:
    - Ending.
    - Like the start.
    solution: It becomes still again.
    mistakes: {"It falls down": "e11_laburnum_end", "It flowers": "e11_laburnum_end", "It catches fire": "e11_laburnum_end"}
  - prompt: What colour dominates the poem?
    options:
    - yellow
    - red
    - blue
    - white
    answer: yellow
    difficulty: 2
    hints:
    - Laburnum leaves.
    - Goldfinch.
    solution: Yellow.
    mistakes: {"red": "e11_yellow", "blue": "e11_yellow", "white": "e11_yellow"}
  - prompt: Who wrote 'The Laburnum Top'?
    options:
    - Ted Hughes
    - Walt Whitman
    - Elizabeth Jennings
    - Shirley Toulson
    answer: Ted Hughes
    difficulty: 2
    hints:
    - English poet laureate.
    - Wrote about animals.
    solution: Ted Hughes.
    mistakes: {"Walt Whitman": "e11_poets", "Elizabeth Jennings": "e11_poets", "Shirley Toulson": "e11_poets"}
