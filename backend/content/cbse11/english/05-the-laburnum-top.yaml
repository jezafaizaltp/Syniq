# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 5.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 5
title: The Laburnum Top (Ted Hughes)
tips:
  e11_goldfinch: "Ted Hughes describes a small yellow-and-black bird whose colour matches the laburnum."
  e11_laburnum_end: "The poem opens with a silent, still tree. What does it go back to?"
  e11_month: "The poem begins on an autumn afternoon, early in the season."
  e11_poets: "Match each poem to its poet using the list of poems in Hornbill. 'The Laburnum Top' is by a British poet laureate."
  e11_yellow: "Laburnum leaves in autumn and the goldfinch share a colour."
  e11x05_image: 'Read the poem as three moments: stillness, arrival of the bird, stillness again.'
  e11x05_device: 'Name what the poet is doing with words: picture, sound, comparison.'

concepts:
- code: cbse11e.h5.laburnum
  title: The Laburnum Top (Ted Hughes)
  notes: |
    A laburnum tree in September afternoon sunshine, with a few yellow leaves and seeds fallen, is silent and still. A
    goldfinch arrives with a "chirrup", and the tree comes alive: the bird flicks about, "tremor", "flirts", and her nest
    is described with her young; she is "the engine of her family". Then she leaves, and the tree returns to stillness.
    Imagery of colour (yellow), sound and movement; metaphor of the engine; the cycle of life and of stillness and
    activity.
  explanations:
    text: A quiet laburnum tree in September comes alive when a goldfinch arrives to feed her chicks in her nest. The bird's chirping and movement fill the tree with life, and when she flies off, the tree is still and silent again.
    visual: Picture a still yellow tree in autumn sunlight. A small goldfinch flits in, chirping, and the leaves tremble; then she darts away and all is quiet again.
    step_by_step: 'Step 1: The still tree. Step 2: The goldfinch arrives. Step 3: The tree comes alive with her family. Step 4: She leaves; stillness returns. Step 5: Look at the ''engine'' metaphor.'
    real_world: A quiet house suddenly filling with noise when children come home from school is like the tree coming alive when the goldfinch arrives.
  picture:
    kind: flow
    steps:
    - Tree silent and still
    - Goldfinch arrives chirping
    - Tree comes alive
    - Goldfinch flies away
    - Tree is still again
    alt: 'The Laburnum Top: stillness, the goldfinch''s arrival, the tree alive, and stillness again.'
  activity:
    type: order
    prompt: 'The Laburnum Top: put the poem''s moments in order.'
    steps:
    - The tree is silent and still
    - A goldfinch arrives with a chirrup
    - The tree comes alive with her family
    - She leaves
    - The tree is still again
    reasons:
      A goldfinch arrives with a chirrup: Stillness is broken by the bird.
      The tree comes alive with her family: Her arrival wakes up the nest.
      She leaves: She is 'the engine of her family' and moves on.
      The tree is still again: Without her, the stillness returns.
  lesson:
    - teach: Ted Hughes opens with a laburnum tree on a September afternoon. A few leaves are yellow, some seeds have fallen, and the tree is silent and still. The quiet scene sets up a contrast with what comes next.
      check:
        prompt: How is the tree at the start of the poem?
        options:
        - silent and still
        - full of noisy birds
        - being cut down
        answer: silent and still
        why: The opening shows calm before the bird arrives.
      ways:
      - style: visual
        teach: 'The opening scene: signs of a still September afternoon.'
        picture:
          kind: compare
          columns:
          - title: What we see
            points:
            - a few yellow leaves
            - some seeds fallen
          - title: What we feel
            points:
            - silence
            - stillness
          alt: At the start the laburnum has a few yellow leaves and fallen seeds, and the scene is silent and still.
      - style: step_by_step
        teach: 'Step 1: Read the first lines slowly. Step 2: Underline the words for time and colour. Step 3: Underline the words for sound and movement, and notice there are almost none. Step 4: Ask why a poet starts so quietly: to make the coming action stand out.'
    - teach: 'A goldfinch arrives with a sharp ''chirrup''. Suddenly the tree is full of movement: the bird flicks and flirts about, and her young in the nest wake up. Hughes calls her ''the engine of her family'', a metaphor for the energy that drives the nest.'
      check:
        prompt: 'Calling the bird ''the engine of her family'' is an example of:'
        options:
        - a metaphor
        - a rhyme
        - a question
        answer: a metaphor
        why: It says she is an engine, a direct comparison without 'like' or 'as'.
      ways:
      - style: visual
        teach: 'The poem''s pattern: stillness, life, stillness.'
        picture:
          kind: flow
          steps:
          - Still, silent tree
          - Goldfinch arrives with a chirrup
          - Nest wakes, tree full of movement
          - Goldfinch leaves
          - Tree still again
          alt: The silent tree comes alive when the goldfinch arrives and the nest wakes, then returns to stillness when she leaves.
      - style: real_world
        teach: A quiet classroom at lunch suddenly fills with noise when the class rushes back in, then falls silent again when they leave for games. The poem captures the same rush of life and the calm after it.
    - teach: Then the goldfinch leaves, and the tree goes back to stillness. The poem moves from stillness to life and back again, like the cycle of life itself. Notice the colour yellow throughout, and the sounds and movement words.
      picture:
        kind: flow
        steps:
        - Tree silent and still
        - 'Goldfinch arrives: chirrup'
        - Tree comes alive
        - Bird leaves
        - Stillness returns
        alt: 'The three moments of the poem: stillness, life with the bird, stillness again.'
      check:
        prompt: 'The shape of the poem, still to lively to still, suggests:'
        options:
        - the cycle of life
        - a storm coming
        - the tree dying
        answer: the cycle of life
        why: Activity rises and falls, as life does.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find the metaphor ''the engine of her family''. Step 2: Ask what an engine does: it gives power and keeps things running. Step 3: Ask what the goldfinch does: feeds and drives her young. Step 4: Link them: her energy powers the nest.'
      - style: real_world
        teach: 'In many homes one person, often a parent, keeps everything running: up first, cooking, sending children off, sorting problems. People sometimes call such a person the engine of the house, just as Hughes does for the goldfinch.'
  items:
  - prompt: Which bird visits the laburnum tree?
    options:
    - A goldfinch
    - A sparrow
    - A crow
    - A robin
    answer: A goldfinch
    difficulty: 1
    hints:
    - Yellow and black.
    - Gold in its name.
    solution: "A goldfinch comes to its nest in the tree and brings it to life."
    mistakes: {"A sparrow": "e11_goldfinch", "A crow": "e11_goldfinch", "A robin": "e11_goldfinch"}
  - prompt: In which month is the poem set?
    options:
    - September
    - January
    - May
    - July
    answer: September
    difficulty: 1
    hints:
    - Autumn.
    - Afternoon sunshine.
    solution: "The poem is set in September, when the laburnum's leaves are turning yellow."
    mistakes: {"January": "e11_month", "May": "e11_month", "July": "e11_month"}
  - prompt: 'The goldfinch is called ''the engine of her family'' because:'
    options:
    - she keeps her family going with her energy
    - she is noisy like a machine
    - she is made of metal
    - she pulls a cart
    answer: she keeps her family going with her energy
    difficulty: 2
    hints:
    - Metaphor.
    - Drives life.
    solution: She powers and sustains her family.
    mistakes:
      she is noisy like a machine: eng11_poem_meaning
  - prompt: What happens to the tree when the bird leaves?
    options:
    - It returns to stillness
    - It falls down
    - It flowers
    - It catches fire
    answer: It returns to stillness
    difficulty: 1
    hints:
    - Ending.
    - Like the start.
    solution: "When the goldfinch flies off, the tree returns to its earlier stillness."
    mistakes: {"It falls down": "e11_laburnum_end", "It flowers": "e11_laburnum_end", "It catches fire": "e11_laburnum_end"}
  - prompt: What colour dominates the poem?
    options:
    - yellow
    - red
    - blue
    - white
    answer: yellow
    difficulty: 2
    hints:
    - Laburnum leaves.
    - Goldfinch.
    solution: "The yellowing leaves and the goldfinch's yellow markings make yellow the main colour."
    mistakes: {"red": "e11_yellow", "blue": "e11_yellow", "white": "e11_yellow"}
  - prompt: Who wrote 'The Laburnum Top'?
    options:
    - Ted Hughes
    - Walt Whitman
    - Elizabeth Jennings
    - Shirley Toulson
    answer: Ted Hughes
    difficulty: 2
    hints:
    - English poet laureate.
    - Wrote about animals.
    solution: "'The Laburnum Top' is by the English poet Ted Hughes."
    mistakes: {"Walt Whitman": "e11_poets", "Elizabeth Jennings": "e11_poets", "Shirley Toulson": "e11_poets"}
  - prompt: Part of which day does the poem describe?
    options:
    - an afternoon
    - midnight
    - dawn
    answer: an afternoon
    difficulty: 1
    hints:
    - The sun is shining on the tree.
    - Look at the first line's time.
    solution: 'Step 1: September sunlight. Step 2: afternoon.'
    mistakes:
      midnight: e11x05_image
      dawn: e11x05_image
  - prompt: What sound announces the goldfinch?
    options:
    - a chirrup
    - a roar
    - a hoot
    answer: a chirrup
    difficulty: 1
    hints:
    - It is a small bird's sound.
    - It is short and sharp.
    solution: 'Step 1: the bird calls as it lands. Step 2: chirrup.'
    mistakes:
      a roar: e11x05_device
      a hoot: e11x05_device
  - prompt: Who are woken by the goldfinch's arrival?
    options:
    - her young in the nest
    - the poet's children
    - the farmers
    answer: her young in the nest
    difficulty: 1
    hints:
    - Look inside the tree.
    - She is their parent.
    solution: 'Step 1: the nest is in the tree. Step 2: her young.'
    mistakes:
      the poet's children: e11x05_image
      the farmers: e11x05_image
  - prompt: Which season is suggested by the yellowing leaves and fallen seeds?
    options:
    - early autumn
    - spring
    - monsoon
    answer: early autumn
    difficulty: 2
    hints:
    - The month is September.
    - Leaves turn before falling.
    solution: 'Step 1: September, leaves yellowing. Step 2: early autumn.'
    mistakes:
      spring: e11x05_image
      monsoon: e11x05_image
  - prompt: 'Words like ''flicks'' and ''tremor'' mainly create a sense of:'
    options:
    - quick movement
    - sadness
    - silence
    answer: quick movement
    difficulty: 2
    hints:
    - Picture a small bird hopping.
    - These are action words.
    solution: 'Step 1: verbs of motion. Step 2: quick, lively movement.'
    mistakes:
      sadness: e11x05_device
      silence: e11x05_device
  - prompt: What is the central contrast in the poem?
    options:
    - stillness and activity
    - rich and poor
    - city and village
    answer: stillness and activity
    difficulty: 2
    hints:
    - Compare the tree before and during the bird's visit.
    - Calm, then life.
    solution: 'Step 1: quiet tree, lively bird. Step 2: stillness vs activity.'
    mistakes:
      rich and poor: e11x05_image
      city and village: e11x05_image
  - prompt: The goldfinch's visit is brief. What does this tell us about the life it brings?
    options:
    - life's busy moments come and go
    - the tree dislikes birds
    - the bird is lost
    answer: life's busy moments come and go
    difficulty: 3
    hints:
    - The tree is still again at the end.
    - Think of the cycle.
    solution: 'Step 1: activity arrives and leaves. Step 2: moments of life pass.'
    mistakes:
      the tree dislikes birds: e11x05_image
      the bird is lost: e11x05_image
  - prompt: Which sense does the poet appeal to with the colour yellow?
    options:
    - sight
    - taste
    - smell
    answer: sight
    difficulty: 1
    hints:
    - Colour is something we see.
    - This is visual imagery.
    solution: 'Step 1: colour. Step 2: sight.'
    mistakes:
      taste: e11x05_device
      smell: e11x05_device
  - prompt: Why might Hughes compare a small bird to an engine?
    options:
    - both supply the power that keeps something going
    - both are made of metal
    - both are noisy and harmful
    answer: both supply the power that keeps something going
    difficulty: 3
    hints:
    - What does an engine do for a machine?
    - What does the mother do for the nest?
    solution: 'Step 1: an engine drives a machine. Step 2: she drives her family''s life.'
    mistakes:
      both are made of metal: e11x05_device
      both are noisy and harmful: e11x05_device
  - prompt: 'Assertion (A): The poem ends with the tree returning to stillness.

      Reason (R): The goldfinch, which brought life to the tree, has flown away.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The bird's leaving takes the movement away, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In the middle of the poem the tree is full of quick movement and sound, but at the start and end it is still. What does this pattern suggest?'
    options:
    - Life's busy moments come and go, like a cycle
    - The tree is dying
    - The bird is afraid of the tree
    answer: Life's busy moments come and go, like a cycle
    hints:
    - What brings the movement?
    - What happens when it leaves?
    solution: The shift from stillness to life and back again mirrors the cycle of life.
    mistakes:
      The tree is dying: e11x05_image
      The bird is afraid of the tree: e11x05_image
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student is asked which poetic device is used in ''the engine of her family''. What is the best answer?'
    options:
    - Metaphor
    - Simile
    - Alliteration
    answer: Metaphor
    hints:
    - Is 'like' or 'as' used?
    - Is the bird called an engine directly?
    solution: The bird is called an engine directly, without 'like' or 'as', so it is a metaphor.
    mistakes:
      Simile: e11x05_device
      Alliteration: e11x05_device
    exam: competency
    difficulty: 2
  - prompt: Which season do the yellowing leaves and fallen seeds suggest?
    options:
    - Early autumn
    - Spring
    - Midwinter
    answer: Early autumn
    hints:
    - Which month is the poem set in?
    - When do leaves start to yellow?
    solution: A September afternoon with yellowing leaves and fallen seeds suggests early autumn.
    mistakes:
      Spring: e11x05_image
      Midwinter: e11x05_image
    exam: short
    difficulty: 2
