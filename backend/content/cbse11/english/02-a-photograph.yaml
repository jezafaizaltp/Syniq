# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 2.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 2
title: A Photograph (Shirley Toulson)
concepts:
- code: cbse11e.h2.photograph
  title: A Photograph (Shirley Toulson)
  notes: |
    The poet looks at an old cardboard photograph of her mother as a girl of about twelve, on a sea holiday, paddling with
    two girl cousins, all holding hands and smiling; her uncle had taken the picture. Years later the mother would laugh
    at the photo and say "See where Betty and Dolly dressed us for the beach". The sea, which has changed least, washed
    their "terribly transient feet". The mother has now been dead for twelve years. Three stages: the girl's childhood;
    the mother's nostalgia; the poet's grief. "Its silence silences": the poet can't speak about her loss. Themes: time,
    change, loss, memory.
  explanations:
    text: The poet looks at an old photograph of her mother as a girl, paddling at the beach with her cousins. Her mother used to laugh at it and remember. Now her mother is dead, and the photograph's silence leaves the poet with nothing to say.
    visual: 'Picture a faded beach photograph: three smiling girls holding hands in the waves. Then a grown woman laughing at the picture. Then the poet alone, holding the photo, silent.'
    step_by_step: 'Step 1: The photo: the girl and her cousins at the beach. Step 2: Years later: the mother laughs at it. Step 3: Now: the mother is dead, and the poet grieves. Step 4: Notice the contrast between the unchanging sea and changing people.'
    real_world: Looking through family albums often brings both smiles and sadness, the mix of feelings this poem captures.
  picture:
    kind: flow
    steps:
    - Mother as a girl paddling at the beach
    - Mother, grown up, laughs at the photo
    - Mother has been dead twelve years
    - The poet is silenced by grief
    alt: 'Three moments in A Photograph: the girl at the beach, the mother remembering, and the poet''s grief.'
  activity:
    type: order
    prompt: 'A Photograph: put the three moments in order.'
    steps:
    - The mother as a girl paddles at the beach
    - Years later she laughs at the photo
    - Twelve years after her death, the poet grieves
    reasons:
      Years later she laughs at the photo: The girl grows up and looks back.
      Twelve years after her death, the poet grieves: The mother dies; now the poet looks at it.
  items:
  - prompt: How old was the girl (the poet's mother) in the photograph?
    options:
    - About twelve
    - About five
    - Twenty
    - Thirty
    answer: About twelve
    difficulty: 1
    hints:
    - A big girl.
    - Twelve years or so.
    solution: About twelve.
  - prompt: Who took the photograph?
    options:
    - Her uncle
    - Her father
    - Her cousin
    - The poet
    answer: Her uncle
    difficulty: 2
    hints:
    - A relative.
    - Not the poet.
    solution: Her uncle took it.
  - prompt: For how many years has the mother been dead?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - Same as the girl's age.
    - Twelve.
    solution: Twelve years.
  - prompt: What does 'terribly transient feet' suggest?
    options:
    - Human life passes quickly
    - The girls ran fast
    - Their feet were hurt
    - The water was cold
    answer: Human life passes quickly
    difficulty: 2
    hints:
    - Transient = short-lived.
    - The sea stays, people change.
    solution: That human life is short, while the sea hardly changes.
    mistakes:
      The girls ran fast: eng11_poem_meaning
  - prompt: Which changed least, according to the poem?
    options:
    - The sea
    - The girl
    - The cousins
    - The photograph
    answer: The sea
    difficulty: 1
    hints:
    - Nature.
    - It washed their feet.
    solution: The sea.
  - prompt: What does 'Its silence silences' mean?
    options:
    - The poet has no words for her grief
    - The photo makes noise
    - The sea is quiet
    - Her mother is shy
    answer: The poet has no words for her grief
    difficulty: 2
    hints:
    - The situation of loss.
    - Nothing to say.
    solution: Her mother's death leaves the poet speechless.
