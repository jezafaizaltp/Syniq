# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 2.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 2
title: A Photograph (Shirley Toulson)
tips:
  e11_photo_age: "The girl is with two younger cousins on a beach, so she is the big cousin, not yet a teenager."
  e11_photo_sea: "People in the photo have grown old or died. What part of nature stays the same?"
  e11_photo_who: "The photograph was taken by an older family member; the poet is not yet born then."
  e11_photo_years: "Read the last stanza: 'Both wry with the laboured ease of loss' and the number of years since she died."
  e11_silence: "The poet cannot speak about the loss. Whose silence is it, and what does it do to her?"
  e11x02_stage: 'The poem has three stanzas: the girl at the beach, the mother looking back, the poet now. Decide which one the question is about.'
  e11x02_image: 'Ask what an image stands for: the sea for what lasts, the feet for what passes.'

concepts:
- code: cbse11e.h2.photograph
  title: A Photograph (Shirley Toulson)
  notes: |
    The poet looks at an old cardboard photograph of her mother as a girl of about twelve, on a sea holiday, paddling with
    two girl cousins, all holding hands and smiling; her uncle had taken the picture. Years later the mother would laugh
    at the photo and say "See where Betty and Dolly dressed us for the beach". The sea, which has changed least, washed
    their "terribly transient feet". The mother has now been dead for twelve years. Three stages: the girl's childhood;
    the mother's nostalgia; the poet's grief. "Its silence silences": the poet can't speak about her loss. Themes: time,
    change, loss, memory.
  explanations:
    text: The poet looks at an old photograph of her mother as a girl, paddling at the beach with her cousins. Her mother used to laugh at it and remember. Now her mother is dead, and the photograph's silence leaves the poet with nothing to say.
    visual: 'Picture a faded beach photograph: three smiling girls holding hands in the waves. Then a grown woman laughing at the picture. Then the poet alone, holding the photo, silent.'
    step_by_step: 'Step 1: The photo: the girl and her cousins at the beach. Step 2: Years later: the mother laughs at it. Step 3: Now: the mother is dead, and the poet grieves. Step 4: Notice the contrast between the unchanging sea and changing people.'
    real_world: Looking through family albums often brings both smiles and sadness, the mix of feelings this poem captures.
  picture:
    kind: flow
    steps:
    - Mother as a girl paddling at the beach
    - Mother, grown up, laughs at the photo
    - Mother has been dead twelve years
    - The poet is silenced by grief
    alt: 'Three moments in A Photograph: the girl at the beach, the mother remembering, and the poet''s grief.'
  activity:
    type: order
    prompt: 'A Photograph: put the three moments in order.'
    steps:
    - The mother as a girl paddles at the beach
    - Years later she laughs at the photo
    - Twelve years after her death, the poet grieves
    reasons:
      Years later she laughs at the photo: The girl grows up and looks back.
      Twelve years after her death, the poet grieves: The mother dies; now the poet looks at it.
  lesson:
    - teach: Shirley Toulson looks at an old cardboard photograph of her mother at about twelve, on a beach holiday with two cousins, paddling and smiling, while her uncle takes the picture.
      check:
        prompt: What is the photograph mounted on?
        options:
        - cardboard
        - glass
        - metal
        answer: cardboard
        why: It is an old photo, mounted on card.
      ways:
      - style: visual
        teach: Who is in the photograph and who is behind the camera.
        picture:
          kind: compare
          columns:
          - title: In the picture
            points:
            - the poet's mother, about twelve
            - two cousins, Betty and Dolly
            - paddling, smiling
          - title: Behind the camera
            points:
            - her uncle
            - taking a holiday snapshot
          alt: The photograph shows the poet's mother at about twelve with two cousins paddling and smiling, while her uncle takes the picture.
      - style: step_by_step
        teach: 'Step 1: Picture the scene: a beach, three girls, the sea. Step 2: Notice that the photo is on old cardboard. Step 3: Ask what an old photo does: it freezes one moment. Step 4: Keep that frozen moment in mind as the poem moves forward in time.'
    - teach: Years later the mother would laugh at the photograph, recalling how Betty and Dolly dressed them for the beach. The sea has hardly changed, but the people have; their 'terribly transient feet' show how short life is.
      check:
        prompt: Who were Betty and Dolly?
        options:
        - the cousins in the photograph
        - the poet's daughters
        - the photographer's sisters
        answer: the cousins in the photograph
        why: The mother named them when looking back.
      ways:
      - style: visual
        teach: The three times the poem moves through, from then to now.
        picture:
          kind: flow
          steps:
          - 'Then: the girl on the beach, about twelve'
          - 'Later: the mother laughs at the photo'
          - 'Now: mother dead, poet grieves in silence'
          alt: The poem moves from the girl on the beach, to the grown mother laughing at the photo years later, to the present, when the mother is dead and the poet grieves.
      - style: real_world
        teach: Look at a photo of your parents as children. They may laugh at their old clothes and hairstyles, just as the mother laughs here. The place in the photo may look the same today, but the people have changed.
    - teach: 'Now the mother has been dead for twelve years. The poet has no words for her grief: ''Its silence silences.'' The poem moves through three times and shows time, change, loss and memory.'
      picture:
        kind: flow
        steps:
        - 'Stanza 1: girl at the beach'
        - 'Stanza 2: mother laughs at the photo'
        - 'Stanza 3: poet grieves'
        alt: The three stages of the poem.
      check:
        prompt: What feeling does the last stanza mainly show?
        options:
        - grief
        - excitement
        - anger
        answer: grief
        why: The poet mourns her mother.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find what stays the same: the sea. Step 2: Find what changes: the people and their ''terribly transient feet''. Step 3: Find how each person reacts: the mother laughs at her past; the poet is silent with grief. Step 4: Put it together: time, change, loss and memory.'
      - style: real_world
        teach: 'When someone we love dies, we sometimes cannot speak about it at all. That is what ''Its silence silences'' means: the grief is so big that words stop. Many people feel this when looking at old family albums.'
  items:
  - prompt: How old was the girl (the poet's mother) in the photograph?
    options:
    - About twelve
    - About five
    - Twenty
    - Thirty
    answer: About twelve
    difficulty: 1
    hints:
    - A big girl.
    - Twelve years or so.
    solution: About twelve.
    mistakes: {"About five": "e11_photo_age", "Twenty": "e11_photo_age", "Thirty": "e11_photo_age"}
  - prompt: Who took the photograph?
    options:
    - Her uncle
    - Her father
    - Her cousin
    - The poet
    answer: Her uncle
    difficulty: 2
    hints:
    - A relative.
    - Not the poet.
    solution: Her uncle took it.
    mistakes: {"Her father": "e11_photo_who", "Her cousin": "e11_photo_who", "The poet": "e11_photo_who"}
  - prompt: For how many years has the mother been dead?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - Same as the girl's age.
    - Twelve.
    solution: Twelve years.
    mistakes: {"40": "e11_photo_years", "20": "e11_photo_years", "30": "e11_photo_years"}
  - prompt: What does 'terribly transient feet' suggest?
    options:
    - Human life passes quickly
    - The girls ran fast
    - Their feet were hurt
    - The water was cold
    answer: Human life passes quickly
    difficulty: 2
    hints:
    - Transient = short-lived.
    - The sea stays, people change.
    solution: That human life is short, while the sea hardly changes.
    mistakes:
      The girls ran fast: eng11_poem_meaning
  - prompt: Which changed least, according to the poem?
    options:
    - The sea
    - The girl
    - The cousins
    - The photograph
    answer: The sea
    difficulty: 1
    hints:
    - Nature.
    - It washed their feet.
    solution: The sea.
    mistakes: {"The girl": "e11_photo_sea", "The cousins": "e11_photo_sea", "The photograph": "e11_photo_sea"}
  - prompt: What does 'Its silence silences' mean?
    options:
    - The poet has no words for her grief
    - The photo makes noise
    - The sea is quiet
    - Her mother is shy
    answer: The poet has no words for her grief
    difficulty: 2
    hints:
    - The situation of loss.
    - Nothing to say.
    solution: Her mother's death leaves the poet speechless.
    mistakes: {"The photo makes noise": "e11_silence", "The sea is quiet": "e11_silence", "Her mother is shy": "e11_silence"}
  - prompt: How many girls are in the photograph?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - The mother and her cousins.
    - Two cousins plus one more.
    solution: 'Step 1: mother + two cousins. Step 2: 3.'
    mistakes:
      '2': e11x02_stage
      '4': e11x02_stage
  - prompt: What were the girls doing in the photograph?
    options:
    - paddling in the sea
    - building sand castles
    - swimming far out
    answer: paddling in the sea
    difficulty: 1
    hints:
    - They are at the water's edge.
    - Their feet are in the water.
    solution: 'Step 1: holding hands at the edge. Step 2: paddling.'
    mistakes:
      building sand castles: e11x02_stage
      swimming far out: e11x02_stage
  - prompt: Why did the mother laugh when she looked at the photograph?
    options:
    - it reminded her of happy times and how they were dressed
    - it was badly taken
    - her uncle looked funny
    answer: it reminded her of happy times and how they were dressed
    difficulty: 1
    hints:
    - Remember the line about Betty and Dolly.
    - Old pictures bring back memories.
    solution: 'Step 1: nostalgia. Step 2: happy memories of the beach.'
    mistakes:
      it was badly taken: e11x02_stage
      her uncle looked funny: e11x02_stage
  - prompt: 'The word ''transient'' means:'
    options:
    - lasting only a short time
    - very strong
    - beautiful
    answer: lasting only a short time
    difficulty: 2
    hints:
    - Compare the feet with the sea.
    - Life passes; the sea stays.
    solution: 'Step 1: opposite of permanent. Step 2: short-lived.'
    mistakes:
      very strong: e11x02_image
      beautiful: e11x02_image
  - prompt: What does the sea stand for in the poem?
    options:
    - something that lasts while people change
    - danger
    - a holiday
    answer: something that lasts while people change
    difficulty: 2
    hints:
    - It 'has changed less' than the people.
    - Contrast it with the feet.
    solution: 'Step 1: sea is nearly unchanged. Step 2: it shows permanence.'
    mistakes:
      danger: e11x02_image
      a holiday: e11x02_image
  - prompt: 'In the second stanza, the mother''s laugh shows her feeling for:'
    options:
    - her own past
    - her daughter's future
    - the uncle
    answer: her own past
    difficulty: 2
    hints:
    - She is looking back many years.
    - The word for this feeling is nostalgia.
    solution: 'Step 1: she remembers her girlhood. Step 2: nostalgia for her past.'
    mistakes:
      her daughter's future: e11x02_stage
      the uncle: e11x02_stage
  - prompt: Both the mother and the poet look back at the past. How are their feelings different?
    options:
    - the mother laughs; the poet grieves
    - both laugh
    - both are angry
    answer: the mother laughs; the poet grieves
    difficulty: 2
    hints:
    - Compare stanza 2 with stanza 3.
    - The mother is alive in one and dead in the other.
    solution: 'Step 1: mother''s happy nostalgia. Step 2: poet''s sorrow.'
    mistakes:
      both laugh: e11x02_stage
      both are angry: e11x02_stage
  - prompt: Who is the poet of 'A Photograph'?
    options:
    - Shirley Toulson
    - Ted Hughes
    - Walt Whitman
    answer: Shirley Toulson
    difficulty: 1
    hints:
    - A British poet.
    - She writes about her own mother.
    solution: 'Step 1: author of this poem. Step 2: Shirley Toulson.'
    mistakes:
      Ted Hughes: e11x02_stage
      Walt Whitman: e11x02_stage
  - prompt: Which theme is NOT central to the poem?
    options:
    - adventure at sea
    - the passing of time
    - loss of a loved one
    answer: adventure at sea
    difficulty: 3
    hints:
    - The sea is only the setting.
    - Think about what the poet feels.
    solution: 'Step 1: themes are time, change, loss, memory. Step 2: not adventure.'
    mistakes:
      the passing of time: e11x02_image
      loss of a loved one: e11x02_image
  - prompt: 'Assertion (A): The sea is shown as unchanged in the poem.

      Reason (R): The poet contrasts the lasting sea with short human lives.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The lasting sea is used to set off how quickly people change, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In the poem, the mother laughs at the old photograph, but the poet cannot laugh at it now. Why is their response different?'
    options:
    - The mother remembers her happy past; the poet is grieving her mother's death
    - The poet dislikes old photographs
    - The mother is angry about the photo
    answer: The mother remembers her happy past; the poet is grieving her mother's death
    hints:
    - Who is alive when each one looks at the photo?
    - What does the poet feel in the last stanza?
    solution: The mother looked back with fond amusement; the poet now looks at it after her mother's death, with grief.
    mistakes:
      The poet dislikes old photographs: e11x02_stage
      The mother is angry about the photo: e11x02_stage
    exam: case
    difficulty: 2
  - prompt: 'Situation: A reader says the poem is mainly about a beach holiday. What better describes its central concern?'
    options:
    - The passing of time and the loss of a loved one
    - How to take good photographs
    - The beauty of the seaside
    answer: The passing of time and the loss of a loved one
    hints:
    - What has happened to the mother by the last stanza?
    - What does the photo help the poet remember?
    solution: The holiday is the starting point; the poem is really about time, change, loss and memory.
    mistakes:
      How to take good photographs: e11x02_image
      The beauty of the seaside: e11x02_image
    exam: competency
    difficulty: 2
  - prompt: What does the phrase 'terribly transient feet' suggest?
    options:
    - Human life passes quickly
    - The girls were walking fast
    - The sand was hot
    answer: Human life passes quickly
    hints:
    - What does 'transient' mean?
    - Why might the poet call it 'terrible'?
    solution: Transient means short-lived; the phrase shows how briefly human life lasts compared with the sea.
    mistakes:
      The girls were walking fast: e11x02_image
      The sand was hot: e11x02_image
    exam: short
    difficulty: 2
