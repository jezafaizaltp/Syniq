# CBSE Class 11 English (NCERT Snapshots, supplementary reader, rationalised syllabus), chapter 13.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 13
title: Mother's Day (J.B. Priestley)
tips:
  e11_authors: "Match authors to texts in Snapshots: Saroyan (white horse), Cronin (Birth), Seth (Melon City)."
  e11_doris_boyfriend: "Doris is going out with Charlie; what is his surname?"
  e11_fitzgerald: "Mrs Fitzgerald reads cards and palms, and says she learned it in the East."
  e11_mothers_day_theme: "Why does Mrs Pearson need help to change her family? What were they not noticing?"
  e11_rummy: "At the end, Mrs Pearson calmly suggests a card game."
  e11x13_swap: "Remember the swap: after the spell, each woman's personality is in the other's body. Track whose personality you see in each scene."
  e11x13_point: 'Ask what Priestley is laughing at: a family that takes a mother''s work for granted.'

concepts:
- code: cbse11e.s3.mothersday
  title: Mother's Day (J.B. Priestley)
  notes: |
    A comic one-act play. Mrs Annie Pearson is treated like a servant by her husband George and grown children Doris and
    Cyril. Her neighbour, Mrs Fitzgerald, a strong, confident fortune-teller who learned magic in the East, persuades
    her to swap personalities (bodies) by a spell. Mrs Pearson (as Mrs Fitzgerald) takes charge: she smokes, drinks stout,
    refuses to iron or cook, mocks Doris's boyfriend Charlie Spence and Cyril's habits, and tells George the people at
    the club laugh at him. The family is shocked and begins to show respect. They swap back; Mrs Pearson, now firm,
    suggests a game of rummy while the family makes dinner. Themes: recognition of a mother's work, family roles, humour,
    satire.
  explanations:
    text: Mrs Pearson's family treats her like a maid. Her bold neighbour, Mrs Fitzgerald, swaps bodies with her by magic and, in Mrs Pearson's body, shocks the family by refusing to serve them and speaking her mind. When they swap back, the family has learned to respect Mrs Pearson.
    visual: Picture a tired mother in an apron serving everyone, then the same woman, now confident, sitting with her feet up while her surprised family hovers around her.
    step_by_step: 'Step 1: Mrs Pearson''s situation. Step 2: Mrs Fitzgerald''s plan. Step 3: The swap and the shocking behaviour. Step 4: The family''s change. Step 5: The swap back and the ending.'
    real_world: Mothers' unpaid work at home often goes unnoticed; this play, though written long ago, still makes families think.
  picture:
    kind: compare
    columns:
    - title: Mrs Pearson
      points:
      - meek and pleasant
      - treated like a servant
      - learns to be firm
    - title: Mrs Fitzgerald
      points:
      - bold and confident
      - a fortune-teller
      - teaches the family a lesson
    alt: 'Mrs Pearson and Mrs Fitzgerald compared: the meek mother and the bold neighbour who swaps with her.'
  activity:
    type: sort
    prompt: 'Mother''s Day: before or after the swap?'
    bins:
    - Before the swap
    - After the swap
    items:
    - label: Annie waits on her family like a servant
      bin: Before the swap
      clue: How the play begins.
      why: At the start, the family treats her as a servant.
    - label: '''Mrs Pearson'' smokes and drinks stout'
      bin: After the swap
      clue: Mrs Fitzgerald's ways.
      why: After the spell, Mrs Fitzgerald is in Mrs Pearson's body.
    - label: George is told people at the club laugh at him
      bin: After the swap
      clue: Bold words.
      why: The swapped mother says this to shock him.
    - label: The family begins to show respect
      bin: After the swap
      clue: Their change.
      why: Shock makes them respect her.
    - label: Annie is too timid to stand up to them
      bin: Before the swap
      clue: The family takes her for granted.
      why: Before the spell she can't say no; that is why Mrs Fitzgerald steps in.
  lesson:
    - teach: J.B. Priestley's 'Mother's Day' is a comic one-act play. Mrs Annie Pearson does everything at home, but her husband George and grown children Doris and Cyril treat her like a servant. She is too gentle to stand up to them.
      check:
        prompt: What is Mrs Pearson's problem at the start?
        options:
        - her family takes her for granted
        - she has no family
        - she is very rich
        answer: her family takes her for granted
        why: They expect her to serve them and never thank her.
      ways:
      - style: visual
        teach: The Pearson family at the start of the play.
        picture:
          kind: compare
          columns:
          - title: Mrs Annie Pearson
            points:
            - does all the housework
            - too gentle to stand up for herself
          - title: George, Doris, Cyril
            points:
            - husband and grown children
            - treat her like a servant
          alt: Mrs Pearson does all the housework and is too gentle to object, while her husband George and children Doris and Cyril treat her like a servant.
      - style: real_world
        teach: In many homes one person cooks, cleans and organises everything, and others only notice when something is missing. The play makes us laugh at this, but also makes us ask who does the unpaid work in our own homes.
    - teach: Her neighbour, Mrs Fitzgerald, is strong and confident and learned fortune-telling and magic in the East. She uses a spell to swap their personalities. Now Mrs Pearson's body holds the bold Mrs Fitzgerald, who smokes, drinks stout, refuses to cook or iron, and tells each family member some hard truths.
      picture:
        kind: compare
        columns:
        - title: Before the swap
          points:
          - Meek, does all the work
          - Family orders her about
          - Never says no
        - title: After the swap
          points:
          - Bold, refuses to cook or iron
          - Mocks their habits
          - Family is shocked into respect
        alt: How Mrs Pearson behaves before and after the personality swap.
      check:
        prompt: Why does the swap work as a solution?
        options:
        - the family finally faces someone who will not be a servant
        - Mrs Fitzgerald moves into the house forever
        - George leaves home
        answer: the family finally faces someone who will not be a servant
        why: The shock makes them see how they treated her.
      ways:
      - style: step_by_step
        teach: 'Step 1: Mrs Fitzgerald casts a spell. Step 2: The two women swap personalities. Step 3: The bold Mrs Fitzgerald, in Mrs Pearson''s body, smokes, drinks stout and refuses to cook or iron. Step 4: She tells each family member hard truths. Keep track: the body is Mrs Pearson''s, the personality is Mrs Fitzgerald''s.'
      - style: real_world
        teach: Comedy films often use a body-swap so characters see life from the other side. Priestley uses the same trick in 1950s England, and it works because the family is shocked to hear their gentle mother speak so firmly.
    - teach: The family begins to show respect. The two women swap back, and Mrs Pearson, now firmer, suggests a game of rummy while the family makes dinner. The play's satire is aimed at families who take a mother's unpaid work for granted.
      check:
        prompt: What does the ending show about Mrs Pearson?
        options:
        - she has learnt to be firm with her family
        - she has forgotten everything
        - she leaves the family
        answer: she has learnt to be firm with her family
        why: She now asks the family to cook while she relaxes.
      ways:
      - style: visual
        teach: How things change by the end of the play.
        picture:
          kind: flow
          steps:
          - Family begins to show respect
          - The women swap back
          - Mrs Pearson is now firmer
          - She suggests rummy while the family cooks dinner
          alt: The family starts to respect Mrs Pearson, the women swap back, and the firmer Mrs Pearson suggests a game of rummy while the family makes dinner.
      - style: step_by_step
        teach: 'Step 1: Ask who is being laughed at: the selfish family. Step 2: Ask what the play criticises: taking a mother''s unpaid work for granted. Step 3: Ask how it criticises: through humour and exaggeration. Step 4: That combination is satire.'
  items:
  - prompt: Who wrote 'Mother's Day'?
    options:
    - J.B. Priestley
    - William Saroyan
    - A.J. Cronin
    - Vikram Seth
    answer: J.B. Priestley
    difficulty: 1
    hints:
    - English playwright.
    - An Inspector Calls.
    solution: "'Mother's Day' is a one-act comic play by J.B. Priestley."
    mistakes: {"William Saroyan": "e11_authors", "A.J. Cronin": "e11_authors", "Vikram Seth": "e11_authors"}
  - prompt: What is Mrs Fitzgerald's skill?
    options:
    - fortune-telling
    - cooking
    - singing
    - sewing
    answer: fortune-telling
    difficulty: 1
    hints:
    - Learned in the East.
    - Reads cards.
    solution: "Mrs Fitzgerald tells fortunes, and uses a magic spell to swap personalities with Mrs Pearson."
    mistakes: {"cooking": "e11_fitzgerald", "singing": "e11_fitzgerald", "sewing": "e11_fitzgerald"}
  - prompt: How does the family treat Mrs Pearson at first?
    options:
    - like a servant
    - like a queen
    - like a guest
    - like a teacher
    answer: like a servant
    difficulty: 1
    hints:
    - Unappreciated.
    - Does everything.
    solution: "The husband and children order Mrs Pearson about and take her work for granted, as if she were a servant."
    mistakes:
      like a queen: eng11_read_again
  - prompt: Who is Doris's boyfriend?
    options:
    - Charlie Spence
    - Cyril
    - George
    - Henry
    answer: Charlie Spence
    difficulty: 2
    hints:
    - Mocked by 'Mrs Pearson'.
    - Charlie.
    solution: "Doris is going out with Charlie Spence."
    mistakes: {"Cyril": "e11_doris_boyfriend", "George": "e11_doris_boyfriend", "Henry": "e11_doris_boyfriend"}
  - prompt: What does the play mainly criticise?
    options:
    - "families taking a mother's work for granted"
    - "fortune-telling and belief in magic"
    - "smoking and drinking in the home"
    - "going out to clubs every evening"
    answer: families taking a mother's work for granted
    difficulty: 2
    hints:
    - Satire.
    - Unrecognised work.
    solution: Taking a mother's work for granted.
    mistakes: {"fortune-telling and belief in magic": "e11_mothers_day_theme", "smoking and drinking in the home": "e11_mothers_day_theme", "going out to clubs every evening": "e11_mothers_day_theme"}
  - prompt: What does Mrs Pearson suggest at the end while the family makes dinner?
    options:
    - a game of rummy
    - a walk
    - a nap
    - a party
    answer: a game of rummy
    difficulty: 2
    hints:
    - Card game.
    - She stays firm.
    solution: "Once the family respects her, Mrs Pearson suggests a game of rummy while they make the dinner."
    mistakes: {"a walk": "e11_rummy", "a nap": "e11_rummy", "a party": "e11_rummy"}
  - prompt: What kind of play is 'Mother's Day'?
    options:
    - a comic one-act play
    - a tragedy in five acts
    - a musical
    answer: a comic one-act play
    difficulty: 1
    hints:
    - It makes us laugh.
    - It is short.
    solution: 'Step 1: humour. Step 2: one act.'
    mistakes:
      a tragedy in five acts: e11x13_point
      a musical: e11x13_point
  - prompt: What is Mrs Pearson's husband called?
    options:
    - George
    - Cyril
    - Charlie
    answer: George
    difficulty: 1
    hints:
    - Cyril is the son.
    - Charlie is Doris's boyfriend.
    solution: 'Step 1: list the family. Step 2: George is the husband.'
    mistakes:
      Cyril: e11x13_swap
      Charlie: e11x13_swap
  - prompt: Where did Mrs Fitzgerald learn her magic?
    options:
    - in the East
    - at a school in London
    - from George
    answer: in the East
    difficulty: 1
    hints:
    - She had travelled.
    - It was a faraway place.
    solution: 'Step 1: she lived abroad. Step 2: in the East.'
    mistakes:
      at a school in London: e11x13_swap
      from George: e11x13_swap
  - prompt: How are the women's personalities exchanged?
    options:
    - by a spell
    - by a letter
    - by a doctor's medicine
    answer: by a spell
    difficulty: 2
    hints:
    - Mrs Fitzgerald knows magic.
    - It is fantasy.
    solution: 'Step 1: magic from the East. Step 2: a spell.'
    mistakes:
      by a letter: e11x13_swap
      by a doctor's medicine: e11x13_swap
  - prompt: What does Mrs Pearson (after the swap) tell George about his club?
    options:
    - people there laugh at him
    - they want him as president
    - it is closing
    answer: people there laugh at him
    difficulty: 2
    hints:
    - It hurts his pride.
    - It is a hard truth.
    solution: 'Step 1: she tells each family member something hard. Step 2: the club laughs at George.'
    mistakes:
      they want him as president: e11x13_swap
      it is closing: e11x13_swap
  - prompt: Who is shown as strong and confident from the beginning?
    options:
    - Mrs Fitzgerald
    - Mrs Pearson
    - Doris
    answer: Mrs Fitzgerald
    difficulty: 2
    hints:
    - She is the neighbour.
    - She tells Mrs Pearson to stand up for herself.
    solution: 'Step 1: one woman is bold from the start. Step 2: Mrs Fitzgerald.'
    mistakes:
      Mrs Pearson: e11x13_swap
      Doris: e11x13_swap
  - prompt: Why does Priestley use magic rather than a calm family talk?
    options:
    - "the sudden change shocks the family and makes the point funny"
    - "magic was believed to be real in England at the time"
    - "the family did not speak English well enough to talk"
    answer: the sudden change shocks the family and makes the point funny
    difficulty: 3
    hints:
    - It is a comedy.
    - A gentle talk had not worked.
    solution: 'Step 1: Mrs Pearson was too meek to speak. Step 2: the swap creates shock and humour.'
    mistakes:
      "magic was believed to be real in England at the time": e11x13_point
      "the family did not speak English well enough to talk": e11x13_point
  - prompt: What is satire?
    options:
    - "using humour to criticise people's faults"
    - "a sad love story with a tragic ending"
    - "a true news report of real events"
    answer: using humour to criticise people's faults
    difficulty: 3
    hints:
    - The play laughs at the family.
    - But it has a serious point.
    solution: 'Step 1: laughter with a purpose. Step 2: satire criticises through humour.'
    mistakes:
      "a sad love story with a tragic ending": e11x13_point
      "a true news report of real events": e11x13_point
  - prompt: What lesson does the family learn?
    options:
    - "to respect and share a mother's work"
    - "to buy a bigger new house in town"
    - "to leave home and live on their own"
    answer: to respect and share a mother's work
    difficulty: 2
    hints:
    - Look at who makes dinner at the end.
    - They show respect.
    solution: 'Step 1: they are shocked. Step 2: they begin to respect her and help.'
    mistakes:
      "to buy a bigger new house in town": e11x13_point
      "to leave home and live on their own": e11x13_point
  - prompt: 'Assertion (A): Mother''s Day is a satire.

      Reason (R): It uses humour to criticise families who take a mother''s work for granted.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Using humour to criticise is what satire means, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: After the swap, ''Mrs Pearson'' smokes, drinks stout, refuses to iron and speaks sharply to her family. Whose personality is speaking?'
    options:
    - Mrs Fitzgerald's
    - Mrs Pearson's
    - Doris's
    answer: Mrs Fitzgerald's
    hints:
    - What did the spell swap?
    - Which woman was bold and confident?
    solution: The spell swapped personalities, so the bold behaviour in Mrs Pearson's body is Mrs Fitzgerald's.
    mistakes:
      Mrs Pearson's: e11x13_swap
      Doris's: e11x13_swap
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student says the play is only a funny story about magic. What deeper point would you add?'
    options:
    - "It criticises families who take a mother's unpaid work for granted"
    - "It teaches the audience how to tell fortunes with playing cards"
    - "It shows that magic is real and can change people for ever"
    answer: It criticises families who take a mother's unpaid work for granted
    hints:
    - What changes in the family by the end?
    - What were they not noticing at the start?
    solution: The magic is a device; the play's satire targets families who exploit a mother's work.
    mistakes:
      "It teaches the audience how to tell fortunes with playing cards": e11x13_point
      "It shows that magic is real and can change people for ever": e11x13_point
    exam: competency
    difficulty: 2
  - prompt: What does Mrs Pearson suggest at the end of the play?
    options:
    - "A game of rummy while the family makes dinner"
    - "That she leaves home for good and lives alone"
    - "That Mrs Fitzgerald moves in with the family"
    answer: A game of rummy while the family makes dinner
    hints:
    - It is a card game.
    - Who cooks dinner now?
    solution: The firmer Mrs Pearson suggests rummy while the family prepares dinner.
    mistakes:
      "That she leaves home for good and lives alone": e11x13_point
      "That Mrs Fitzgerald moves in with the family": e11x13_swap
    exam: short
    difficulty: 2
