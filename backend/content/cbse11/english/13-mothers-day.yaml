subject: cbse11-eng
chapter: 13
title: Mother's Day (J.B. Priestley)
concepts:
- code: cbse11e.s3.mothersday
  title: Mother's Day (J.B. Priestley)
  notes: |
    A comic one-act play. Mrs Annie Pearson is treated like a servant by her husband George and grown children Doris and
    Cyril. Her neighbour, Mrs Fitzgerald, a strong, confident fortune-teller who learned magic in the East, persuades
    her to swap personalities (bodies) by a spell. Mrs Pearson (as Mrs Fitzgerald) takes charge: she smokes, drinks stout,
    refuses to iron or cook, mocks Doris's boyfriend Charlie Spence and Cyril's habits, and tells George the people at
    the club laugh at him. The family is shocked and begins to show respect. They swap back; Mrs Pearson, now firm,
    suggests a game of rummy while the family makes dinner. Themes: recognition of a mother's work, family roles, humour,
    satire.
  explanations:
    text: Mrs Pearson's family treats her like a maid. Her bold neighbour, Mrs Fitzgerald, swaps bodies with her by magic and, in Mrs Pearson's body, shocks the family by refusing to serve them and speaking her mind. When they swap back, the family has learned to respect Mrs Pearson.
    visual: Picture a tired mother in an apron serving everyone, then the same woman, now confident, sitting with her feet up while her surprised family hovers around her.
    step_by_step: 'Step 1: Mrs Pearson''s situation. Step 2: Mrs Fitzgerald''s plan. Step 3: The swap and the shocking behaviour. Step 4: The family''s change. Step 5: The swap back and the ending.'
    real_world: Mothers' unpaid work at home often goes unnoticed; this play, though written long ago, still makes families think.
  picture:
    kind: compare
    columns:
    - title: Mrs Pearson
      points:
      - meek and pleasant
      - treated like a servant
      - learns to be firm
    - title: Mrs Fitzgerald
      points:
