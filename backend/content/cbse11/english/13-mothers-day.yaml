concepts:
- code: cbse11e.s3.mothersday
  title: Mother's Day (J.B. Priestley)
  notes: |
    A comic one-act play. Mrs Annie Pearson is treated like a servant by her husband George and grown children Doris and
    Cyril. Her neighbour, Mrs Fitzgerald, a strong, confident fortune-teller who learned magic in the East, persuades
    her to swap personalities (bodies) by a spell. Mrs Pearson (as Mrs Fitzgerald) takes charge: she smokes, drinks stout,
    refuses to iron or cook, mocks Doris's boyfriend Charlie Spence and Cyril's habits, and tells George the people at
    the club laugh at him. The family is shocked and begins to show respect. They swap back; Mrs Pearson, now firm,
    suggests a game of rummy while the family makes dinner. Themes: recognition of a mother's work, family roles, humour,
    satire.
  explanations:
    text: Mrs Pearson's family treats her like a maid. Her bold neighbour, Mrs Fitzgerald, swaps bodies with her by magic and, in Mrs Pearson's body, shocks the family by refusing to serve them and speaking her mind. When they swap back, the family has learned to respect Mrs Pearson.
    visual: Picture a tired mother in an apron serving everyone, then the same woman, now confident, sitting with her feet up while her surprised family hovers around her.
    step_by_step: 'Step 1: Mrs Pearson''s situation. Step 2: Mrs Fitzgerald''s plan. Step 3: The swap and the shocking behaviour. Step 4: The family''s change. Step 5: The swap back and the ending.'
    real_world: Mothers' unpaid work at home often goes unnoticed; this play, though written long ago, still makes families think.
  picture:
    kind: compare
    columns:
    - title: Mrs Pearson
      points:
      - meek and pleasant
      - treated like a servant
      - learns to be firm
    - title: Mrs Fitzgerald
      points:
      - bold and confident
      - a fortune-teller
      - teaches the family a lesson
    alt: 'Mrs Pearson and Mrs Fitzgerald compared: the meek mother and the bold neighbour who swaps with her.'
  activity:
    type: sort
    prompt: 'Mother''s Day: before or after the swap?'
    bins:
    - Before the swap
    - After the swap
    items:
    - label: Annie waits on her family like a servant
      bin: Before the swap
      clue: How the play begins.
      why: At the start, the family treats her as a servant.
    - label: '''Mrs Pearson'' smokes and drinks stout'
      bin: After the swap
      clue: Mrs Fitzgerald's ways.
      why: After the spell, Mrs Fitzgerald is in Mrs Pearson's body.
    - label: George is told people at the club laugh at him
      bin: After the swap
      clue: Bold words.
      why: The swapped mother says this to shock him.
    - label: The family begins to show respect
      bin: After the swap
      clue: Their change.
      why: Shock makes them respect her.
    - label: Annie is too timid to stand up to them
      bin: Before the swap
      clue: The family takes her for granted.
      why: Before the spell she can't say no; that is why Mrs Fitzgerald steps in.
  items:
  - prompt: Who wrote 'Mother's Day'?
    options:
    - J.B. Priestley
    - William Saroyan
    - A.J. Cronin
    - Vikram Seth
    answer: J.B. Priestley
    difficulty: 1
    hints:
    - English playwright.
    - An Inspector Calls.
    solution: J.B. Priestley.
    mistakes: {"William Saroyan": "e11_authors", "A.J. Cronin": "e11_authors", "Vikram Seth": "e11_authors"}
  - prompt: What is Mrs Fitzgerald's skill?
    options:
    - fortune-telling
    - cooking
    - singing
    - sewing
    answer: fortune-telling
    difficulty: 1
    hints:
    - Learned in the East.
    - Reads cards.
    solution: She is a fortune-teller.
    mistakes: {"cooking": "e11_fitzgerald", "singing": "e11_fitzgerald", "sewing": "e11_fitzgerald"}
  - prompt: How does the family treat Mrs Pearson at first?
    options:
    - like a servant
    - like a queen
    - like a guest
    - like a teacher
    answer: like a servant
    difficulty: 1
    hints:
    - Unappreciated.
    - Does everything.
    solution: Like a servant.
    mistakes:
      like a queen: eng11_read_again
  - prompt: Who is Doris's boyfriend?
    options:
    - Charlie Spence
    - Cyril
    - George
    - Henry
    answer: Charlie Spence
    difficulty: 2
    hints:
    - Mocked by 'Mrs Pearson'.
    - Charlie.
    solution: Charlie Spence.
    mistakes: {"Cyril": "e11_doris_boyfriend", "George": "e11_doris_boyfriend", "Henry": "e11_doris_boyfriend"}
  - prompt: What does the play mainly criticise?
    options:
    - families taking a mother's work for granted
    - fortune-telling
    - smoking
    - going to clubs
    answer: families taking a mother's work for granted
    difficulty: 2
    hints:
    - Satire.
    - Unrecognised work.
    solution: Taking a mother's work for granted.
    mistakes: {"fortune-telling": "e11_mothers_day_theme", "smoking": "e11_mothers_day_theme", "going to clubs": "e11_mothers_day_theme"}
  - prompt: What does Mrs Pearson suggest at the end while the family makes dinner?
    options:
    - a game of rummy
    - a walk
    - a nap
    - a party
    answer: a game of rummy
    difficulty: 2
    hints:
    - Card game.
    - She stays firm.
    solution: A game of rummy.
    mistakes: {"a walk": "e11_rummy", "a nap": "e11_rummy", "a party": "e11_rummy"}
