# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 9.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 9
title: Silk Road (Nick Middleton)
tips:
  e11_hor: "Hor was on the shores of a holy lake, but the town itself was grey and littered."
  e11_kailash: "Middleton was on a pilgrimage route to a holy mountain in Tibet, sacred to Hindus and Buddhists."
  e11_kora: "The kora is what pilgrims do around Mount Kailash: a walk in a circle."
  e11_middleton_ill: "Think about the conditions on a high Tibetan plateau at night."
  e11_norbu: "He met a Tibetan academic from Beijing at the guesthouse in Darchen."
  e11x09_route: 'Follow the journey in order: Ravu, the high passes, Hor, then Darchen.'
  e11x09_feel: Ask how the place or event made Middleton feel, and what caused that feeling.

concepts:
- code: cbse11e.h9.silkroad
  title: Silk Road (Nick Middleton)
  notes: |
    An extract from Nick Middleton's travel writing about his journey in Tibet to Mount Kailash, the sacred mountain,
    to perform a kora (circling pilgrimage). He sets out from Ravu with his driver Tsetan (and Daniel, a Chinese guide
    who leaves at Lhasa road). They take a shortcut over high passes, see nomads' tents, drogpas (nomads) with herds of
    yaks, fierce mastiffs, and wild asses (kiang). At high altitude he gets a bad cold and altitude sickness; at Hor, a
    bleak, dirty town by Lake Mansarovar, he is disappointed. In Darchen a doctor treats him; he meets Norbu, a Tibetan
    scholar who also plans to do the kora, and the arrival of pilgrims gives him hope. Themes: travel, endurance, culture,
    landscape.
  explanations:
    text: Nick Middleton travels across Tibet to Mount Kailash to walk the sacred circuit around it. He crosses high passes, meets nomads and their fierce dogs, suffers altitude sickness, is disappointed by the dirty town of Hor, and finds a companion, Norbu, in Darchen.
    visual: Picture a jeep bumping across a vast, bare Tibetan plateau, snowy peaks far off, yaks grazing by black nomad tents, and a giant mastiff charging towards the car.
    step_by_step: 'Step 1: The goal: a kora around Mount Kailash. Step 2: The journey with Tsetan. Step 3: Nomads, animals, high passes. Step 4: Altitude sickness and Hor. Step 5: Darchen and meeting Norbu.'
    real_world: Many Indian pilgrims travel to Kailash Mansarovar; they must acclimatise slowly to avoid altitude sickness, just as Middleton found.
  picture:
    kind: flow
    steps:
    - Leaves Ravu with Tsetan
    - Crosses high passes, sees nomads
    - Suffers altitude sickness
    - Disappointed by Hor
    - Meets Norbu in Darchen
    alt: 'Silk Road: from Ravu across the passes, altitude sickness, Hor and meeting Norbu in Darchen.'
  activity:
    type: order
    prompt: 'Silk Road: put Middleton''s journey in order.'
    steps:
    - He sets out from Ravu with Tsetan
    - They cross high passes and see drogpas
    - He gets altitude sickness
    - He is disappointed at Hor
    - A doctor treats him in Darchen
    - He meets Norbu, who will do the kora
    reasons:
      They cross high passes and see drogpas: The shortcut takes them over passes.
      He gets altitude sickness: The high altitude affects him.
      He is disappointed at Hor: Ill, he finds a bleak town.
      A doctor treats him in Darchen: He reaches Darchen still ill.
      He meets Norbu, who will do the kora: Feeling better, he finds a companion.
  lesson:
    - teach: 'Nick Middleton''s travel writing follows his journey across Tibet to Mount Kailash, a mountain sacred to several religions. His aim is to perform a kora: a pilgrimage walk all the way around the mountain. He sets out from Ravu with his driver, Tsetan.'
      check:
        prompt: What was the purpose of Middleton's journey?
        options:
        - to walk the kora around Mount Kailash
        - to buy silk to sell
        - to climb to the top of Everest
        answer: to walk the kora around Mount Kailash
        why: A kora circles a sacred place; it does not climb it.
    - teach: Tsetan takes a shortcut over high passes. Middleton sees nomads' tents, drogpas with herds of yaks, fierce mastiffs guarding the camps, and wild asses called kiang. The landscape is huge, empty and beautiful, but the altitude is very high.
      picture:
        kind: flow
        steps:
        - 'Ravu: set out with Tsetan'
        - 'High passes: nomads, yaks, kiang'
        - Altitude sickness, cold
        - 'Hor: bleak town'
        - 'Darchen: doctor, meets Norbu'
        alt: Middleton's route from Ravu over the passes to Hor and Darchen.
      check:
        prompt: Who are the drogpas?
        options:
        - Tibetan nomads who herd yaks
        - Chinese soldiers
        - mountain guides from Nepal
        answer: Tibetan nomads who herd yaks
        why: The chapter describes their tents and herds on the plateau.
    - teach: High altitude and cold make Middleton ill. At Hor, a bleak and dirty town by Lake Mansarovar, he is disappointed. In Darchen a doctor treats him, and he meets Norbu, a Tibetan scholar who also plans the kora. The pilgrims arriving give him new hope. The piece is about endurance as much as place.
      check:
        prompt: What lifted Middleton's spirits at Darchen?
        options:
        - meeting Norbu and seeing pilgrims arrive
        - finding a hotel with heating
        - getting a flight home
        answer: meeting Norbu and seeing pilgrims arrive
        why: Company for the kora and the pilgrims' arrival meant the walk could go ahead.
  items:
  - prompt: Which mountain was Middleton travelling to?
    options:
    - Mount Kailash
    - Mount Everest
    - Kanchenjunga
    - Mount Fuji
    answer: Mount Kailash
    difficulty: 1
    hints:
    - Sacred mountain in Tibet.
    - Pilgrimage.
    solution: Mount Kailash.
    mistakes: {"Mount Everest": "e11_kailash", "Kanchenjunga": "e11_kailash", "Mount Fuji": "e11_kailash"}
  - prompt: What is a 'kora'?
    options:
    - A pilgrimage walk around a sacred place
    - A kind of tea
    - A Tibetan dog
    - A high pass
    answer: A pilgrimage walk around a sacred place
    difficulty: 2
    hints:
    - Circling.
    - Religious journey.
    solution: A circling pilgrimage.
    mistakes: {"A kind of tea": "e11_kora", "A Tibetan dog": "e11_kora", "A high pass": "e11_kora"}
  - prompt: Who was Middleton's driver?
    options:
    - Tsetan
    - Norbu
    - Daniel
    - Lhamo
    answer: Tsetan
    difficulty: 1
    hints:
    - Drove the jeep.
    - Took a shortcut.
    solution: Tsetan.
    mistakes:
      Norbu: eng11_read_again
  - prompt: Why did Middleton fall ill?
    options:
    - High altitude and cold
    - Bad food
    - A dog bite
    - A car accident
    answer: High altitude and cold
    difficulty: 2
    hints:
    - Thin air.
    - Altitude sickness.
    solution: Altitude sickness and a bad cold.
    mistakes: {"Bad food": "e11_middleton_ill", "A dog bite": "e11_middleton_ill", "A car accident": "e11_middleton_ill"}
  - prompt: How did Middleton feel about Hor?
    options:
    - 'Disappointed: it was bleak and dirty'
    - Delighted by its beauty
    - Afraid of its people
    - He never went there
    answer: 'Disappointed: it was bleak and dirty'
    difficulty: 2
    hints:
    - By Lake Mansarovar.
    - Not what he hoped.
    solution: He was disappointed by how bleak and dirty it was.
    mistakes: {"Delighted by its beauty": "e11_hor", "Afraid of its people": "e11_hor", "He never went there": "e11_hor"}
  - prompt: Whom did Middleton meet in Darchen who planned to do the kora too?
