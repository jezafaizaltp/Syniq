    solution: 'Step 1: nomads keep guard dogs. Step 2: mastiffs.'
    mistakes:
      soldiers: e11x09_route
      geese: e11x09_route
  - prompt: Which lake is Hor beside?
    options:
    - Lake Mansarovar
    - Dal Lake
    - Chilika Lake
