    mistakes:
      Dal Lake: e11x09_route
      Chilika Lake: e11x09_route
  - prompt: Why did Tsetan take the route over the high passes?
    options:
    - it was a shortcut
    - the main road was full of tourists
    - Middleton wanted snow
    answer: it was a shortcut
    difficulty: 2
    hints:
