  - prompt: Why did Middleton fall ill?
    options:
    - High altitude and cold
    - Bad food
    - A dog bite
    - A car accident
    answer: High altitude and cold
    difficulty: 2
    hints:
    - Thin air.
    - Altitude sickness.
    solution: Altitude sickness and a bad cold.
    mistakes: {"Bad food": "e11_middleton_ill", "A dog bite": "e11_middleton_ill", "A car accident": "e11_middleton_ill"}
  - prompt: How did Middleton feel about Hor?
    options:
    - 'Disappointed: it was bleak and dirty'
