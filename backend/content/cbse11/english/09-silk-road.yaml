    solution: He was disappointed by how bleak and dirty it was.
    mistakes: {"Delighted by its beauty": "e11_hor", "Afraid of its people": "e11_hor", "He never went there": "e11_hor"}
  - prompt: Whom did Middleton meet in Darchen who planned to do the kora too?
