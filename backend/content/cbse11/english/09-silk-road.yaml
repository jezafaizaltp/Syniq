    - He kept going.
    solution: 'Step 1: hardship after hardship. Step 2: endurance.'
    mistakes:
      cooking skill: e11x09_feel
      speed in running: e11x09_feel
  - prompt: What kind of writing is 'Silk Road'?
    options:
    - travel writing
    - a play
    - a science report
    answer: travel writing
    difficulty: 1
    hints:
    - It describes a real journey.
    - Places, people and landscapes.
    solution: 'Step 1: first-person journey. Step 2: travel writing.'
    mistakes:
      a play: e11x09_feel
      a science report: e11x09_feel
  - prompt: 'Assertion (A): Middleton fell ill during the journey.

      Reason (R): The very high altitude and cold were hard on his body.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. High altitude and cold caused his illness, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Middleton reaches Hor, by Lake Mansarovar, and finds it bleak and dirty. How does he feel, and why?'
    options:
    - Disappointed, because it did not match the sacred place he imagined
    - Delighted, because it was a grand city
    - Angry with his driver
    answer: Disappointed, because it did not match the sacred place he imagined
    hints:
    - How does the text describe Hor?
    - What had he hoped a holy lake town would be like?
    solution: Hor's bleakness and dirt did not fit his idea of a sacred place, so he was disappointed.
    mistakes:
      Delighted, because it was a grand city: e11x09_feel
      Angry with his driver: e11x09_feel
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student calls ''Silk Road'' just a description of places. What else is the piece about?'
    options:
    - Endurance and keeping hope on a hard journey
    - How to drive a jeep
    - The history of silk trading
    answer: Endurance and keeping hope on a hard journey
    hints:
    - What happens to Middleton's health?
    - What lifts his spirits at the end?
    solution: Through illness and disappointment Middleton keeps going and finds hope, so the piece is about endurance.
    mistakes:
      How to drive a jeep: e11x09_route
      The history of silk trading: e11x09_route
    exam: competency
    difficulty: 2
  - prompt: What is a kora?
    options:
    - A pilgrimage walk all the way round a sacred mountain
    - A Tibetan tent
    - A kind of wild ass
    answer: A pilgrimage walk all the way round a sacred mountain
    hints:
    - What did Middleton want to do at Kailash?
    - Kiang are the wild asses.
    solution: A kora is a circuit walked around a sacred mountain such as Kailash.
    mistakes:
      A Tibetan tent: e11x09_route
      A kind of wild ass: e11x09_route
    exam: short
    difficulty: 2
