    - It was a quicker way.
    solution: 'Step 1: Tsetan chose a quicker route. Step 2: a shortcut.'
    mistakes:
      the main road was full of tourists: e11x09_route
      Middleton wanted snow: e11x09_route
  - prompt: Who treated Middleton in Darchen?
    options:
