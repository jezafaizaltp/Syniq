    - Religious journey.
    solution: A circling pilgrimage.
    mistakes: {"A kind of tea": "e11_kora", "A Tibetan dog": "e11_kora", "A high pass": "e11_kora"}
  - prompt: Who was Middleton's driver?
    options:
    - Tsetan
    - Norbu
    - Daniel
    - Lhamo
    answer: Tsetan
    difficulty: 1
    hints:
