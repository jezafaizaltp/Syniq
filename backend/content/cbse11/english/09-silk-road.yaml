    - Compare expectation with reality.
    - Look at how he describes the town.
    solution: 'Step 1: he expected beauty near a sacred lake. Step 2: he found a grim town.'
    mistakes:
      it had too many trees: e11x09_feel
      he lost his passport: e11x09_feel
  - prompt: Which quality does the journey most test in Middleton?
    options:
