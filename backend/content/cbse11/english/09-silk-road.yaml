subject: cbse11-eng
chapter: 9
title: Silk Road (Nick Middleton)
concepts:
- code: cbse11e.h9.silkroad
  title: Silk Road (Nick Middleton)
  notes: |
    An extract from Nick Middleton's travel writing about his journey in Tibet to Mount Kailash, the sacred mountain,
    to perform a kora (circling pilgrimage). He sets out from Ravu with his driver Tsetan (and Daniel, a Chinese guide
    who leaves at Lhasa road). They take a shortcut over high passes, see nomads' tents, drogpas (nomads) with herds of
    yaks, fierce mastiffs, and wild asses (kiang). At high altitude he gets a bad cold and altitude sickness; at Hor, a
    bleak, dirty town by Lake Mansarovar, he is disappointed. In Darchen a doctor treats him; he meets Norbu, a Tibetan
    scholar who also plans to do the kora, and the arrival of pilgrims gives him hope. Themes: travel, endurance, culture,
    landscape.
  explanations:
    text: Nick Middleton travels across Tibet to Mount Kailash to walk the sacred circuit around it. He crosses high passes, meets nomads and their fierce dogs, suffers altitude sickness, is disappointed by the dirty town of Hor, and finds a companion, Norbu, in Darchen.
    visual: Picture a jeep bumping across a vast, bare Tibetan plateau, snowy peaks far off, yaks grazing by black nomad tents, and a giant mastiff charging towards the car.
    step_by_step: 'Step 1: The goal: a kora around Mount Kailash. Step 2: The journey with Tsetan. Step 3: Nomads, animals, high passes. Step 4: Altitude sickness and Hor. Step 5: Darchen and meeting Norbu.'
    real_world: Many Indian pilgrims travel to Kailash Mansarovar; they must acclimatise slowly to avoid altitude sickness, just as Middleton found.
  picture:
    kind: flow
    steps:
    - Leaves Ravu with Tsetan
    - Crosses high passes, sees nomads
    - Suffers altitude sickness
    - Disappointed by Hor
    - Meets Norbu in Darchen
    alt: 'Silk Road: from Ravu across the passes, altitude sickness, Hor and meeting Norbu in Darchen.'
