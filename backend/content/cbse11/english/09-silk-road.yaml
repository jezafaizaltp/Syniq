    - Sacred mountain in Tibet.
    - Pilgrimage.
    solution: Mount Kailash.
    mistakes: {"Mount Everest": "e11_kailash", "Kanchenjunga": "e11_kailash", "Mount Fuji": "e11_kailash"}
  - prompt: What is a 'kora'?
    options:
    - A pilgrimage walk around a sacred place
    - A kind of tea
    - A Tibetan dog
    - A high pass
    answer: A pilgrimage walk around a sacred place
    difficulty: 2
    hints:
