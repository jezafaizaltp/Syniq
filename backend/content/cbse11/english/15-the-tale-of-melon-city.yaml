concepts:
- code: cbse11e.s5.melon
  title: The Tale of Melon City (Vikram Seth)
  notes: |
    A humorous narrative poem. A just and placid king orders an arch built across a thoroughfare to edify the spectators.
    Riding under it, he knocks off his crown and orders the chief of builders hanged. The blame passes from the builders
    to the workmen, to the masons, to the architect, and then to the king himself, who had approved the measurements; a
    wise man is consulted and blames the arch, but the crowd wants a hanging. The noose is set at a height only one person
    fits: the king, who is hanged. The ministers then decide that the next king will be the first person to pass the City
    Gate: an idiot, who, asked who should be king, says "a melon". So a melon is crowned, and the people are content as
    long as they are left alone. Themes: satire on foolish rulers, blind justice, irony.
  explanations:
    text: A foolish 'just and placid' king hits his crown on a new arch and wants someone hanged. The blame passes from person to person until the noose fits only the king himself. The ministers then let an idiot choose the next ruler, and he picks a melon. The people don't mind, as long as they're left in peace.
    visual: Picture a king's crown falling under a low arch, a line of people pointing at each other, a noose too high for anyone but the tall king, and finally a melon wearing a crown on a throne.
    step_by_step: 'Step 1: The arch and the fallen crown. Step 2: The chain of blame. Step 3: The noose fits the king. Step 4: Choosing a new king by the City Gate. Step 5: The melon is crowned.'
    real_world: The poem pokes fun at leaders who care more about appearing just than being sensible, a kind of satire still common in cartoons today.
  picture:
    kind: flow
    steps:
    - King's crown knocked off by the arch
    - Blame passes from builder to workmen to masons
    - Architect blames the king
    - 'Noose fits only the king: he is hanged'
    - An idiot chooses a melon as king
    alt: 'The Tale of Melon City: the arch, the chain of blame, the king hanged, and a melon crowned.'
  activity:
    type: order
    prompt: 'The Tale of Melon City: put the blame chain in order.'
    steps:
    - The king's crown is knocked off by the arch
    - He orders the chief of builders hanged
    - The blame passes to workmen, masons, architect
    - The architect blames the king himself
    - The king fits the noose and is hanged
    - A melon is crowned king
    reasons:
      He orders the chief of builders hanged: He blames whoever built it.
      The blame passes to workmen, masons, architect: Each blames the next.
      The architect blames the king himself: He approved the measurements.
      The king fits the noose and is hanged: Only he fits its height.
      A melon is crowned king: The first person through the gate chooses.
  lesson:
    - teach: Vikram Seth's 'The Tale of Melon City' is a funny poem that tells a story. A 'just and placid' king orders an arch built across a road to edify, or improve, the spectators. When he rides under it, it knocks off his crown, and he orders the chief of builders hanged.
      check:
        prompt: What is funny about calling the king 'just and placid'?
        options:
        - he quickly orders a hanging over a knocked-off crown
        - he is very kind to everyone
        - he never gives orders
        answer: he quickly orders a hanging over a knocked-off crown
        why: His actions are the opposite of just and calm, which is the poem's irony.
    - teach: 'The blame then passes along: the builders blame the workmen, the workmen the masons, the masons the architect, and the architect says the king approved the measurements. A wise man blames the arch itself, but the crowd wants a hanging. The noose is set so high that only one person fits it: the king. So the king is hanged.'
      picture:
        kind: flow
        steps:
        - Chief of builders
        - Workmen
        - Masons
        - Architect
        - The king
        - Noose fits only the king
        alt: How the blame passes from one person to the next until it reaches the king.
      check:
        prompt: Why did the king end up hanged?
        options:
        - he was the only one tall enough to fit the noose
        - he confessed to building the arch
        - the wise man chose him
        answer: he was the only one tall enough to fit the noose
        why: Justice was decided by the noose's height, not by guilt.
    - teach: The ministers decide the next king will be chosen by the first person to pass the City Gate. That person is an idiot, who answers 'a melon'. So a melon is crowned. The people do not mind, as long as they are left alone. The poem mocks foolish rulers, blind justice and citizens who do not care who rules them.
      check:
        prompt: What does the people's attitude to the melon king show?
        options:
        - they care only about being left in peace
        - they love melons
        - they plan a revolt
        answer: they care only about being left in peace
        why: Anyone, even a melon, is acceptable if it does not disturb them.
  items:
