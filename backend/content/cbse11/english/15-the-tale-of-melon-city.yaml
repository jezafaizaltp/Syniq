    answer: The first person to pass the City Gate chose
    difficulty: 2
    hints:
    - An idiot came by.
    - City Gate.
    solution: The first person through the City Gate decided.
    mistakes: {"By an election": "e11_melon_rule", "By a battle": "e11_melon_rule", "The queen chose": "e11_melon_rule"}
  - prompt: Who was crowned the new king?
