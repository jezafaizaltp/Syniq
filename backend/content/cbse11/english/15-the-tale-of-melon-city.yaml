    - Blame passes from builder to workmen to masons
    - Architect blames the king
    - 'Noose fits only the king: he is hanged'
    - An idiot chooses a melon as king
    alt: 'The Tale of Melon City: the arch, the chain of blame, the king hanged, and a melon crowned.'
