concepts:
- code: cbse11e.s5.melon
  title: The Tale of Melon City (Vikram Seth)
  notes: |
    A humorous narrative poem. A just and placid king orders an arch built across a thoroughfare to edify the spectators.
    Riding under it, he knocks off his crown and orders the chief of builders hanged. The blame passes from the builders
    to the workmen, to the masons, to the architect, and then to the king himself, who had approved the measurements; a
    wise man is consulted and blames the arch, but the crowd wants a hanging. The noose is set at a height only one person
    fits: the king, who is hanged. The ministers then decide that the next king will be the first person to pass the City
    Gate: an idiot, who, asked who should be king, says "a melon". So a melon is crowned, and the people are content as
    long as they are left alone. Themes: satire on foolish rulers, blind justice, irony.
  explanations:
    text: A foolish 'just and placid' king hits his crown on a new arch and wants someone hanged. The blame passes from person to person until the noose fits only the king himself. The ministers then let an idiot choose the next ruler, and he picks a melon. The people don't mind, as long as they're left in peace.
    visual: Picture a king's crown falling under a low arch, a line of people pointing at each other, a noose too high for anyone but the tall king, and finally a melon wearing a crown on a throne.
    step_by_step: 'Step 1: The arch and the fallen crown. Step 2: The chain of blame. Step 3: The noose fits the king. Step 4: Choosing a new king by the City Gate. Step 5: The melon is crowned.'
    real_world: The poem pokes fun at leaders who care more about appearing just than being sensible, a kind of satire still common in cartoons today.
