    options:
    - His crown was knocked off by the arch
    - He lost a battle
    - His horse ran away
    - The people laughed at him
    answer: His crown was knocked off by the arch
    difficulty: 1
    hints:
    - Riding under it.
    - Too low.
    solution: The arch knocked off his crown.
    mistakes: {"He lost a battle": "e11_melon_arch", "His horse ran away": "e11_melon_arch", "The people laughed at him": "e11_melon_arch"}
  - prompt: Who was finally hanged?
    options:
