    solution: They were content as long as they were left in peace.
    mistakes: {"They rebelled": "e11_melon_people", "They were afraid": "e11_melon_people", "They left the city": "e11_melon_people"}
  - prompt: Who wrote 'The Tale of Melon City'?
    options:
