# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 6.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 6
title: The Voice of the Rain (Walt Whitman)
tips:
  e11_impalpable: "'Palpable' means able to be touched. Add 'im-'."
  e11_latent_seeds: "'Latent' means hidden and waiting. What does rain give a seed lying in dry soil?"
  e11_rain_song: "Read the last lines: the rain comes from the heart and returns to it, unnoticed. What else is made that way and given back?"
  e11_water_cycle: "The rain rises from land and sea, goes up, and comes back down. What cycle is that?"

concepts:
- code: cbse11e.h6.rain
  title: The Voice of the Rain (Walt Whitman)
  notes: |
    A conversation between the poet and the rain. Asked who it is, the rain answers that it is the "Poem of Earth". It
    rises "impalpable" from land and the bottomless sea, forms clouds, and comes down to wash the drouths, atoms and
    latent seeds, giving life and beauty, then returns to its origin. The last lines (in brackets) compare the rain to a
    song: like music, which rises from the poet's heart, wanders, and comes back to it with love. Themes: the water cycle,
    rain as a giver of life, the parallel between rain and poetry.
  explanations:
    text: The poet asks the falling rain who it is, and the rain answers that it is the Poem of the Earth. It rises from land and sea, falls to give life to seeds and the dry earth, and returns to where it came from, just as a song goes out from a poet's heart and comes back to it.
    visual: 'Draw a circle: water rises from the sea as vapour, forms clouds, falls as rain on seeds and fields, and flows back to the sea. Beside it, a song going out from a heart and returning.'
    step_by_step: 'Step 1: The question and the rain''s answer. Step 2: The rain''s journey (the water cycle). Step 3: What rain gives the earth. Step 4: The comparison with a song.'
    real_world: Kerala's monsoon fills wells, rivers and paddy fields, showing how rain brings the land back to life each year.
  picture:
    kind: flow
    steps:
    - Rises from land and sea
    - Forms clouds
    - Falls as rain
    - Gives life to seeds and dry land
    - Returns to its origin
    alt: 'The rain''s cycle in the poem: rising, forming clouds, falling, giving life and returning.'
  activity:
    type: order
    prompt: 'The Voice of the Rain: put the rain''s journey in order.'
    steps:
    - Rises impalpable from land and sea
    - Forms clouds
    - Comes down to wash the dry land
    - Gives life to latent seeds
    - Returns to its origin
    reasons:
      Forms clouds: Rising water vapour gathers.
      Comes down to wash the dry land: Clouds release rain.
      Gives life to latent seeds: Rain soaks the earth.
      Returns to its origin: The cycle completes.
  items:
  - prompt: What does the rain call itself?
    options:
    - The Poem of Earth
    - The Song of the Sky
    - The Tears of God
    - The River's Child
    answer: The Poem of Earth
    difficulty: 1
    hints:
    - Its answer to the poet.
    - Poem.
    solution: The Poem of Earth.
    mistakes:
      The Song of the Sky: eng11_read_again
  - prompt: 'The rain''s journey in the poem describes the:'
    options:
    - water cycle
    - food chain
    - rock cycle
    - seasons only
    answer: water cycle
    difficulty: 1
    hints:
    - Rises and falls.
    - Returns.
    solution: The water cycle.
    mistakes: {"food chain": "e11_water_cycle", "rock cycle": "e11_water_cycle", "seasons only": "e11_water_cycle"}
  - prompt: What is the rain compared to in the last lines?
    options:
    - A song
    - A river
    - A child
    - A bird
    answer: A song
    difficulty: 2
    hints:
    - In brackets.
    - Comes back to the poet's heart.
    solution: A song.
    mistakes: {"A river": "e11_rain_song", "A child": "e11_rain_song", "A bird": "e11_rain_song"}
  - prompt: Who wrote 'The Voice of the Rain'?
    options:
    - Walt Whitman
    - Ted Hughes
    - Markus Natten
    - Elizabeth Jennings
    answer: Walt Whitman
    difficulty: 1
    hints:
    - American poet.
    - Leaves of Grass.
    solution: Walt Whitman.
    mistakes: {"Ted Hughes": "e11_poets", "Markus Natten": "e11_poets", "Elizabeth Jennings": "e11_poets"}
  - prompt: What does 'impalpable' mean in the poem?
    options:
    - Cannot be touched or felt
    - Very heavy
    - Loud
    - Bright
    answer: Cannot be touched or felt
    difficulty: 2
    hints:
    - Vapour.
    - Not solid.
    solution: Something that cannot be touched.
    mistakes: {"Very heavy": "e11_impalpable", "Loud": "e11_impalpable", "Bright": "e11_impalpable"}
  - prompt: What does the rain do for 'latent seeds'?
    options:
    - Helps them grow
    - Washes them away
    - Freezes them
    - Eats them
    answer: Helps them grow
    difficulty: 2
    hints:
    - Latent = hidden, waiting.
    - Gives life.
    solution: It brings them to life.
    mistakes: {"Washes them away": "e11_latent_seeds", "Freezes them": "e11_latent_seeds", "Eats them": "e11_latent_seeds"}
