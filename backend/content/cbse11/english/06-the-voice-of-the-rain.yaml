# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 6.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 6
title: The Voice of the Rain (Walt Whitman)
tips:
  e11_impalpable: "'Palpable' means able to be touched. Add 'im-'."
  e11_latent_seeds: "'Latent' means hidden and waiting. What does rain give a seed lying in dry soil?"
  e11_rain_song: "Read the last lines: the rain comes from the heart and returns to it, unnoticed. What else is made that way and given back?"
  e11_water_cycle: "The rain rises from land and sea, goes up, and comes back down. What cycle is that?"
  e11x06_cycle: 'Follow the rain''s journey: up from land and sea, into clouds, down to earth, back home.'
  e11x06_song: "Look at the lines in brackets: they compare the rain with something a person in the poem makes. Who is that person?"

concepts:
- code: cbse11e.h6.rain
  title: The Voice of the Rain (Walt Whitman)
  notes: |
    A conversation between the poet and the rain. Asked who it is, the rain answers that it is the "Poem of Earth". It
    rises "impalpable" from land and the bottomless sea, forms clouds, and comes down to wash the drouths, atoms and
    latent seeds, giving life and beauty, then returns to its origin. The last lines (in brackets) compare the rain to a
    song: like music, which rises from the poet's heart, wanders, and comes back to it with love. Themes: the water cycle,
    rain as a giver of life, the parallel between rain and poetry.
  explanations:
    text: The poet asks the falling rain who it is, and the rain answers that it is the Poem of the Earth. It rises from land and sea, falls to give life to seeds and the dry earth, and returns to where it came from, just as a song goes out from a poet's heart and comes back to it.
    visual: 'Draw a circle: water rises from the sea as vapour, forms clouds, falls as rain on seeds and fields, and flows back to the sea. Beside it, a song going out from a heart and returning.'
    step_by_step: 'Step 1: The question and the rain''s answer. Step 2: The rain''s journey (the water cycle). Step 3: What rain gives the earth. Step 4: The comparison with a song.'
    real_world: Kerala's monsoon fills wells, rivers and paddy fields, showing how rain brings the land back to life each year.
  picture:
    kind: flow
    steps:
    - Rises from land and sea
    - Forms clouds
    - Falls as rain
    - Gives life to seeds and dry land
    - Returns to its origin
    alt: 'The rain''s cycle in the poem: rising, forming clouds, falling, giving life and returning.'
  activity:
    type: order
    prompt: 'The Voice of the Rain: put the rain''s journey in order.'
    steps:
    - Rises impalpable from land and sea
    - Forms clouds
    - Comes down to wash the dry land
    - Gives life to latent seeds
    - Returns to its origin
    reasons:
      Forms clouds: Rising water vapour gathers.
      Comes down to wash the dry land: Clouds release rain.
      Gives life to latent seeds: Rain soaks the earth.
      Returns to its origin: The cycle completes.
  lesson:
    - teach: Walt Whitman's poem is a short conversation. The poet asks the falling shower who it is, and, strangely, the rain answers. Giving the rain a voice is personification.
      check:
        prompt: 'Making the rain speak like a person is called:'
        options:
        - personification
        - alliteration
        - rhyme
        answer: personification
        why: Human qualities, like speech, are given to a non-human thing.
      ways:
      - style: visual
        teach: Who speaks in the poem, and the device that makes it possible.
        picture:
          kind: compare
          columns:
          - title: 'Speaker 1: the poet'
            points:
            - asks the shower who it is
          - title: 'Speaker 2: the rain'
            points:
            - answers and tells its story
            - 'personification: a thing given a voice'
          alt: The poet asks the shower who it is, and the rain answers; giving the rain a voice is personification.
      - style: step_by_step
        teach: 'Step 1: Spot the question the poet asks. Step 2: Spot who answers. Step 3: Ask whether rain can really speak: no. Step 4: So the poet gives a non-human thing human speech: that is personification.'
    - teach: The rain describes its journey. It rises, unseen and untouchable ('impalpable'), from land and the bottomless sea, gathers as clouds, and comes down to wash dry lands and dust and to wake latent seeds. Then it returns to where it began. This is the water cycle told as a story.
      picture:
        kind: flow
        steps:
        - Rises from land and sea
        - Forms clouds
        - Falls as rain
        - Gives life to seeds and dry land
        - Returns to its origin
        alt: The rain's journey in the poem, shown as the water cycle.
      check:
        prompt: Why does the rain call itself 'impalpable' when it rises?
        options:
        - as vapour it cannot be touched
        - it is very heavy
        - it is very loud
        answer: as vapour it cannot be touched
        why: Water vapour is invisible and cannot be felt.
      ways:
      - style: step_by_step
        teach: 'Step 1: Rises from land and sea, unseen. Step 2: Gathers as clouds. Step 3: Falls to wash dry lands and dust. Step 4: Wakes latent seeds, giving life. Step 5: Returns to where it began. These steps are the water cycle.'
      - style: real_world
        teach: After the first monsoon showers in June, dry fields in Kerala suddenly turn green as seeds that lay hidden in the soil sprout. That is what the rain means when it says it wakes latent seeds.
    - teach: The last lines, in brackets, compare the rain to a song. A song rises from the poet's heart, travels out, and, loved or not, comes back to its source. Rain and poetry both give life and beauty and return home.
      check:
        prompt: 'Like the rain, a song in the poem:'
        options:
        - goes out and returns to its source
        - stays locked in a book
        - is forgotten at once
        answer: goes out and returns to its source
        why: Both make a full circle back to where they began.
      ways:
      - style: visual
        teach: How the rain and a song follow the same path.
        picture:
          kind: compare
          columns:
          - title: Rain
            points:
            - rises from earth and sea
            - falls and gives life
            - returns to its origin
          - title: Song
            points:
            - rises from the poet's heart
            - travels out to people
            - comes back to its source
          alt: Rain rises from the earth, gives life and returns to its source; a song rises from the poet's heart, travels to people and comes back to the poet.
      - style: real_world
        teach: 'A song you write and share with friends may be loved or ignored, but it still comes back to you: you remember it, sing it again, and it shapes you. Whitman says rain and poetry both go out and come home.'
  items:
  - prompt: What does the rain call itself?
    options:
    - The Poem of Earth
    - The Song of the Sky
    - The Tears of God
    - The River's Child
    answer: The Poem of Earth
    difficulty: 1
    hints:
    - Its answer to the poet.
    - Poem.
    solution: The Poem of Earth.
    mistakes:
      The Song of the Sky: eng11_read_again
  - prompt: 'The rain''s journey in the poem describes the:'
    options:
    - water cycle
    - food chain
    - rock cycle
    - seasons only
    answer: water cycle
    difficulty: 1
    hints:
    - Rises and falls.
    - Returns.
    solution: The water cycle.
    mistakes: {"food chain": "e11_water_cycle", "rock cycle": "e11_water_cycle", "seasons only": "e11_water_cycle"}
  - prompt: What is the rain compared to in the last lines?
    options:
    - A song
    - A river
    - A child
    - A bird
    answer: A song
    difficulty: 2
    hints:
    - In brackets.
    - Comes back to the poet's heart.
    solution: A song.
    mistakes: {"A river": "e11_rain_song", "A child": "e11_rain_song", "A bird": "e11_rain_song"}
  - prompt: Who wrote 'The Voice of the Rain'?
    options:
    - Walt Whitman
    - Ted Hughes
    - Markus Natten
    - Elizabeth Jennings
    answer: Walt Whitman
    difficulty: 1
    hints:
    - American poet.
    - Leaves of Grass.
    solution: Walt Whitman.
    mistakes: {"Ted Hughes": "e11_poets", "Markus Natten": "e11_poets", "Elizabeth Jennings": "e11_poets"}
  - prompt: What does 'impalpable' mean in the poem?
    options:
    - Cannot be touched or felt
    - Very heavy
    - Loud
    - Bright
    answer: Cannot be touched or felt
    difficulty: 2
    hints:
    - Vapour.
    - Not solid.
    solution: Something that cannot be touched.
    mistakes: {"Very heavy": "e11_impalpable", "Loud": "e11_impalpable", "Bright": "e11_impalpable"}
  - prompt: What does the rain do for 'latent seeds'?
    options:
    - Helps them grow
    - Washes them away
    - Freezes them
    - Eats them
    answer: Helps them grow
    difficulty: 2
    hints:
    - Latent = hidden, waiting.
    - Gives life.
    solution: It brings them to life.
    mistakes: {"Washes them away": "e11_latent_seeds", "Freezes them": "e11_latent_seeds", "Eats them": "e11_latent_seeds"}
  - prompt: Who asks the rain a question at the start?
    options:
    - the poet
    - a farmer
    - a child
    answer: the poet
    difficulty: 1
    hints:
    - The poem is a conversation.
    - The speaker of the poem asks.
    solution: 'Step 1: the speaker questions the shower. Step 2: the poet.'
    mistakes:
      a farmer: e11x06_song
      a child: e11x06_song
  - prompt: From where does the rain say it rises?
    options:
    - land and the bottomless sea
    - only mountains
    - the moon
    answer: land and the bottomless sea
    difficulty: 1
    hints:
    - Think of evaporation.
    - Water rises from earth's surfaces.
    solution: 'Step 1: water evaporates. Step 2: from land and sea.'
    mistakes:
      only mountains: e11x06_cycle
      the moon: e11x06_cycle
  - prompt: What does the rain wash when it falls?
    options:
    - dry lands and dust
    - city cars
    - clothes
    answer: dry lands and dust
    difficulty: 1
    hints:
    - Think of droughts.
    - It cleans the earth.
    solution: 'Step 1: rain falls on parched ground. Step 2: dry lands and dust.'
    mistakes:
      city cars: e11x06_cycle
      clothes: e11x06_cycle
  - prompt: What does 'latent' mean in 'latent seeds'?
    options:
    - hidden, not yet active
    - dead
    - roasted
    answer: hidden, not yet active
    difficulty: 2
    hints:
    - The seeds are waiting.
    - They have life inside that has not shown.
    solution: 'Step 1: the seeds have not sprouted. Step 2: hidden, waiting.'
    mistakes:
      dead: e11x06_cycle
      roasted: e11x06_cycle
  - prompt: Where does the rain go at the end of its journey?
    options:
    - back to its origin
    - into space
    - it disappears forever
    answer: back to its origin
    difficulty: 2
    hints:
    - It is a cycle.
    - Think of where it began.
    solution: 'Step 1: water returns to the sea and land. Step 2: back to its origin.'
    mistakes:
      into space: e11x06_cycle
      it disappears forever: e11x06_cycle
  - prompt: What literary device makes the rain speak?
    options:
    - personification
    - simile
    - onomatopoeia
    answer: personification
    difficulty: 2
    hints:
    - The rain behaves like a person.
    - It has a voice.
    solution: 'Step 1: speech is human. Step 2: personification.'
    mistakes:
      simile: e11x06_song
      onomatopoeia: e11x06_song
  - prompt: Why are the last lines placed in brackets?
    options:
    - they are the poet's own reflection, set apart from the rain's words
    - they are a mistake
    - they are a title
    answer: they are the poet's own reflection, set apart from the rain's words
    difficulty: 3
    hints:
    - Who is speaking there?
    - It is an aside.
    solution: 'Step 1: the rain has finished speaking. Step 2: the poet adds a thought.'
    mistakes:
      they are a mistake: e11x06_song
      they are a title: e11x06_song
  - prompt: What do rain and poetry share, according to the poem?
    options:
    - both give life and beauty and return to their source
    - both are always sad
    - both are made of water
    answer: both give life and beauty and return to their source
    difficulty: 3
    hints:
    - Compare the rain's journey with the song's.
    - Both travel out and come back.
    solution: 'Step 1: rain refreshes the earth; a song refreshes listeners. Step 2: both return home.'
    mistakes:
      both are always sad: e11x06_song
      both are made of water: e11x06_song
  - prompt: 'The form of the poem is mainly a:'
    options:
    - dialogue between poet and rain
    - list of facts
    - letter to a friend
    answer: dialogue between poet and rain
    difficulty: 1
    hints:
    - One asks, one answers.
    - Two voices.
    solution: 'Step 1: question and answer. Step 2: a dialogue.'
    mistakes:
      list of facts: e11x06_song
      letter to a friend: e11x06_song
  - prompt: 'Assertion (A): The rain in the poem is described as impalpable when it rises.

      Reason (R): Water vapour cannot be seen or touched.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Rising vapour is unseen and untouchable, which is what impalpable means, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: The last lines of the poem, set in brackets, say the song rises from the poet''s heart and returns to it. Why does the poet compare a song with rain?'
    options:
    - Both go out, give life or beauty, and return to their source
    - Both are wet
    - Both are sad
    answer: Both go out, give life or beauty, and return to their source
    hints:
    - Trace the path of the rain.
    - Trace the path of the song.
    solution: Rain and song both travel out from their origin, enrich the world and come back home.
    mistakes:
      Both are wet: e11x06_song
      Both are sad: e11x06_song
    exam: case
    difficulty: 2
  - prompt: 'Situation: A science teacher wants to use this poem in a lesson. Which topic does it fit best?'
    options:
    - The water cycle
    - Photosynthesis
    - The solar system
    answer: The water cycle
    hints:
    - Where does the rain say it comes from?
    - Where does it say it goes?
    solution: The rain describes rising, forming clouds, falling and returning, which is the water cycle.
    mistakes:
      Photosynthesis: e11x06_cycle
      The solar system: e11x06_cycle
    exam: competency
    difficulty: 2
  - prompt: What figure of speech is used when the rain answers the poet?
    options:
    - Personification
    - Simile
    - Hyperbole
    answer: Personification
    hints:
    - Can rain really talk?
    - What do we call giving a thing human qualities?
    solution: Giving rain a voice is personification.
    mistakes:
      Simile: e11x06_song
      Hyperbole: e11x06_song
    exam: short
    difficulty: 2
