concepts:
- code: cbse11e.h3.wavewalker
  title: We're Not Afraid to Die... (Gordon Cook and Alan East)
  notes: |
    The narrator, his wife Mary, son Jonathan (6) and daughter Suzanne (7) set out from Plymouth, England, in July 1976 to
    sail round the world, as Captain Cook had done, in their boat Wavewalker. Two crewmen joined for the hardest part,
    Larry Vigil and Herb Seigler. In the southern Indian Ocean, on 2 January, a huge wave hit; the boat filled with water;
    the narrator was hurt (ribs, head), Sue was badly hurt on the head but didn't complain. They pumped for hours. Using
    navigation, he aimed for a tiny island, Ile Amsterdam; Jon asked if they would die, and said they weren't afraid of
    dying "if we can all be together". They reached the island and were helped by its inhabitants. Themes: courage,
    teamwork, hope, family.
  explanations:
    text: A family sailing round the world is hit by a giant wave in the southern Indian Ocean. The boat is badly damaged and the children are hurt, but everyone works together, and the father navigates to the tiny island of Ile Amsterdam. The children's courage gives the adults strength.
    visual: Picture a small sailing boat on a mountain of water; then people pumping out water all night; then a tiny island appearing on the horizon.
    step_by_step: 'Step 1: The voyage and crew. Step 2: The storm and giant wave. Step 3: Damage and injuries. Step 4: Pumping and navigation. Step 5: Reaching Ile Amsterdam.'
    real_world: Like the crew of Wavewalker, rescue teams in floods survive by staying calm and each doing their part.
  picture:
    kind: flow
    steps:
    - 'July 1976: set sail from Plymouth'
    - Huge wave hits in the Indian Ocean
    - Boat damaged; Sue and the narrator hurt
    - Everyone pumps and works together
    - They reach Ile Amsterdam
    alt: 'The voyage: setting sail, the giant wave, the damage, working together and reaching the island.'
  activity:
    type: order
    prompt: 'We''re Not Afraid to Die: put the voyage in order.'
    steps:
    - They set out from Plymouth in July 1976
    - Two crewmen join for the hardest part
    - A huge wave hits on 2 January
    - They pump water for hours
    - He aims for Ile Amsterdam
    - Islanders help them
    reasons:
      Two crewmen join for the hardest part: They need help before the southern ocean.
      A huge wave hits on 2 January: In the southern Indian Ocean.
      They pump water for hours: The wave floods the boat.
      He aims for Ile Amsterdam: With the boat damaged, they need land.
      Islanders help them: They reach the island.
