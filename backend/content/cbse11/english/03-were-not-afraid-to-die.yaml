subject: cbse11-eng
chapter: 3
title: We're Not Afraid to Die... if We Can All Be Together (Gordon Cook and Alan East)
tips:
  e11_island: "A tiny French island in the southern Indian Ocean; Sue called him 'the best daddy in the world'."
  e11_jonathan: "The words were spoken by the young son, not the narrator or his wife."
  e11_set_sail: "They set off from a port in south-west England."
  e11_theme_courage: "Think about what kept the family alive: what did each of them do in the storm?"
  e11_voyage_year: "The voyage started in the summer of the bicentennial year of US independence."
  e11x03_text: 'Go back to the part of the voyage the question is about: the start, the storm, or the search for land.'
  e11x03_theme: Think about how each person behaved in the danger and what that shows.

concepts:
- code: cbse11e.h3.wavewalker
  title: We're Not Afraid to Die... (Gordon Cook and Alan East)
  notes: |
    The narrator, his wife Mary, son Jonathan (6) and daughter Suzanne (7) set out from Plymouth, England, in July 1976 to
    sail round the world, as Captain Cook had done, in their boat Wavewalker. Two crewmen joined for the hardest part,
    Larry Vigil and Herb Seigler. In the southern Indian Ocean, on 2 January, a huge wave hit; the boat filled with water;
    the narrator was hurt (ribs, head), Sue was badly hurt on the head but didn't complain. They pumped for hours. Using
    navigation, he aimed for a tiny island, Ile Amsterdam; Jon asked if they would die, and said they weren't afraid of
    dying "if we can all be together". They reached the island and were helped by its inhabitants. Themes: courage,
    teamwork, hope, family.
  explanations:
    text: A family sailing round the world is hit by a giant wave in the southern Indian Ocean. The boat is badly damaged and the children are hurt, but everyone works together, and the father navigates to the tiny island of Ile Amsterdam. The children's courage gives the adults strength.
    visual: Picture a small sailing boat on a mountain of water; then people pumping out water all night; then a tiny island appearing on the horizon.
    step_by_step: 'Step 1: The voyage and crew. Step 2: The storm and giant wave. Step 3: Damage and injuries. Step 4: Pumping and navigation. Step 5: Reaching Ile Amsterdam.'
    real_world: Like the crew of Wavewalker, rescue teams in floods survive by staying calm and each doing their part.
  picture:
    kind: flow
    steps:
    - 'July 1976: set sail from Plymouth'
    - Huge wave hits in the Indian Ocean
    - Boat damaged; Sue and the narrator hurt
    - Everyone pumps and works together
    - They reach Ile Amsterdam
    alt: 'The voyage: setting sail, the giant wave, the damage, working together and reaching the island.'
  activity:
    type: order
    prompt: 'We''re Not Afraid to Die: put the voyage in order.'
    steps:
    - They set out from Plymouth in July 1976
    - Two crewmen join for the hardest part
    - A huge wave hits on 2 January
    - They pump water for hours
    - He aims for Ile Amsterdam
    - Islanders help them
    reasons:
      Two crewmen join for the hardest part: They need help before the southern ocean.
      A huge wave hits on 2 January: In the southern Indian Ocean.
      They pump water for hours: The wave floods the boat.
      He aims for Ile Amsterdam: With the boat damaged, they need land.
      Islanders help them: They reach the island.
  lesson:
    - teach: In July 1976 the narrator, his wife Mary, son Jonathan and daughter Suzanne left Plymouth to sail round the world in their boat Wavewalker, following Captain Cook's route. Two crewmen joined for the roughest stretch.
      check:
        prompt: Whose voyage was the family following?
        options:
        - Captain James Cook's
        - Columbus's
        - Vasco da Gama's
        answer: Captain James Cook's
        why: They wanted to repeat his round-the-world route.
    - teach: In the southern Indian Ocean a giant wave struck. The deck was smashed and water poured in. The narrator was injured, Sue had a serious head wound but did not complain, and everyone pumped and bailed for hours.
      check:
        prompt: How did Sue behave after her head injury?
        options:
        - she did not complain so as not to worry others
        - she cried all night
        - she stopped helping
        answer: she did not complain so as not to worry others
        why: She showed great courage.
    - teach: The narrator used careful navigation to find tiny Ile Amsterdam. Jonathan said they were not afraid to die if they could all be together. They reached the island safely. The story is about courage, teamwork and hope.
      picture:
        kind: flow
        steps:
        - Set sail from Plymouth
        - Giant wave strikes
        - Pumping and repairs
        - Navigating to a tiny island
        - Safe landing
        alt: The main events of the voyage.
      check:
        prompt: What helped them most to find the island?
        options:
        - the narrator's careful navigation
        - a passing ship
        - a radio signal from the island
        answer: the narrator's careful navigation
        why: He worked out their position and course.
  items:
  - prompt: What was the name of the family's boat?
    options:
    - Wavewalker
    - Seahorse
    - Endeavour
    - Ocean Star
    answer: Wavewalker
    difficulty: 1
    hints:
    - Walks on waves.
    - Named in the story.
    solution: Wavewalker.
    mistakes:
      Endeavour: eng11_read_again
  - prompt: In which year did the voyage begin?
    answer: '1976'
    check: '1976'
    difficulty: 1
    hints:
    - July of that year.
    - The 1970s.
    solution: '1976.'
    mistakes: {"1975": "e11_voyage_year", "1977": "e11_voyage_year", "1980": "e11_voyage_year"}
  - prompt: From where did they set sail?
    options:
    - Plymouth
    - London
    - Cape Town
    - Sydney
    answer: Plymouth
    difficulty: 2
    hints:
    - A port in England.
    - South-west.
    solution: Plymouth, England.
    mistakes: {"London": "e11_set_sail", "Cape Town": "e11_set_sail", "Sydney": "e11_set_sail"}
  - prompt: Which island did they finally reach?
    options:
    - Ile Amsterdam
    - Madagascar
    - Mauritius
    - Sri Lanka
    answer: Ile Amsterdam
    difficulty: 2
    hints:
    - A tiny French island.
    - In the Indian Ocean.
    solution: Ile Amsterdam.
    mistakes: {"Madagascar": "e11_island", "Mauritius": "e11_island", "Sri Lanka": "e11_island"}
  - prompt: Who said they weren't afraid of dying if they could all be together?
    options:
    - Jonathan
    - Mary
    - Larry
    - Herb
    answer: Jonathan
    difficulty: 2
    hints:
    - The young son.
    - Six years old.
    solution: Jonathan, the son.
    mistakes: {"Mary": "e11_jonathan", "Larry": "e11_jonathan", "Herb": "e11_jonathan"}
  - prompt: What is the main theme of the story?
    options:
    - Courage and teamwork in danger
    - The joy of shopping
    - Life in a city
    - School exams
    answer: Courage and teamwork in danger
    difficulty: 1
    hints:
    - How they survived.
    - Everyone helped.
    solution: Courage, teamwork and hope.
    mistakes: {"The joy of shopping": "e11_theme_courage", "Life in a city": "e11_theme_courage", "School exams": "e11_theme_courage"}
  - prompt: How old was Suzanne at the start of the voyage?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - She was the older child.
    - Jonathan was six.
    solution: 'Step 1: Jonathan 6, Suzanne one year older. Step 2: 7.'
    mistakes:
      '6': e11x03_text
      '10': e11x03_text
  - prompt: In which ocean did the giant wave strike?
    options:
    - the southern Indian Ocean
    - the Atlantic Ocean
    - the Arctic Ocean
    answer: the southern Indian Ocean
    difficulty: 1
    hints:
    - It was after they left Cape Town.
    - Ile Amsterdam is in this ocean.
    solution: 'Step 1: heading east from Africa. Step 2: southern Indian Ocean.'
    mistakes:
      the Atlantic Ocean: e11x03_text
      the Arctic Ocean: e11x03_text
  - prompt: Who was the narrator's wife?
    options:
    - Mary
    - Sue
    - Herb
    answer: Mary
    difficulty: 1
    hints:
    - Sue was a child.
    - Herb was a crewman.
    solution: 'Step 1: the narrator''s wife. Step 2: Mary.'
    mistakes:
      Sue: e11x03_text
      Herb: e11x03_text
  - prompt: Why did the family take two extra crewmen?
    options:
    - to help with the hardest part of the journey
    - to cook for them
    - to teach the children
    answer: to help with the hardest part of the journey
    difficulty: 2
    hints:
    - They knew rough seas lay ahead.
    - Larry and Herb joined.
    solution: 'Step 1: very rough waters expected. Step 2: extra help needed.'
    mistakes:
      to cook for them: e11x03_theme
      to teach the children: e11x03_theme
  - prompt: 'Jonathan''s words ''we''re not afraid of dying if we can all be together'' show:'
    options:
    - his love for his family and his courage
    - that he wanted to give up
    - that he was not hurt
    answer: his love for his family and his courage
    difficulty: 2
    hints:
    - He was only six.
    - What mattered most to him?
    solution: 'Step 1: he valued being together. Step 2: love and bravery.'
    mistakes:
      that he wanted to give up: e11x03_theme
      that he was not hurt: e11x03_theme
  - prompt: What did Sue give her father after they sighted the island?
    options:
    - a card she had made, thanking him and her mother
    - a map
    - a bottle of water
    answer: a card she had made, thanking him and her mother
    difficulty: 2
    hints:
    - She drew funny pictures on it.
    - It showed her love and thanks.
    solution: 'Step 1: home-made card. Step 2: thanks and love.'
    mistakes:
      a map: e11x03_text
      a bottle of water: e11x03_text
  - prompt: Why was finding Ile Amsterdam so hard?
    options:
    - it was a tiny island in a vast ocean
    - it was hidden by mountains
    - it had no name
    answer: it was a tiny island in a vast ocean
    difficulty: 2
    hints:
    - A small mistake in direction could miss it.
    - It was only a few miles across.
    solution: 'Step 1: tiny target, huge sea. Step 2: very hard to find.'
    mistakes:
      it was hidden by mountains: e11x03_text
      it had no name: e11x03_text
  - prompt: What made the family survive, according to the story?
    options:
    - courage, teamwork and optimism
    - luck alone
    - help from a navy ship
    answer: courage, teamwork and optimism
    difficulty: 3
    hints:
    - Everyone did a job.
    - Nobody gave up.
    solution: 'Step 1: all worked together bravely. Step 2: courage, teamwork, hope.'
    mistakes:
      luck alone: e11x03_theme
      help from a navy ship: e11x03_theme
  - prompt: 'The title ''We''re Not Afraid to Die... if We Can All Be Together'' comes from the words of:'
    options:
    - the narrator's young son
    - the narrator
    - a crewman
    answer: the narrator's young son
    difficulty: 3
    hints:
    - A child said it during the danger.
    - He was six.
    solution: 'Step 1: spoken by Jonathan. Step 2: the son.'
    mistakes:
      the narrator: e11x03_text
      a crewman: e11x03_text
