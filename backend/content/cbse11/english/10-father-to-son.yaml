# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 10.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 10
title: Father to Son (Elizabeth Jennings)
tips:
  e11_father_admit: "'I do not understand this child / Though we have lived together now...' What does the father admit?"
  e11_forgive: "The last lines speak of both wishing for something they both need."
  e11_generation_gap: "A father and son who cannot understand each other. What kind of gap is that?"
  e11_prodigal: "The Bible tells of a son who leaves home, wastes his money and returns to be welcomed."
  e11x10_gap: The poem is about distance between two people in the same house. Find what keeps them apart.
  e11x10_voice: 'Remember who is speaking: the father, about his grown son.'

concepts:
- code: cbse11e.h10.father
  title: Father to Son (Elizabeth Jennings)
  notes: |
    A father speaks about his grown son: "I do not understand this child / Though we have lived together now / In the same
    house for years." He knows nothing of him, and they seem strangers. He wants to build a relationship "from the same
    root", sees the son making a "world" he doesn't recognise; he would like the son to return like the prodigal son,
    and both are hurt; the father is ready to forgive but they don't speak the same language. Ends with both shown
    "Each wish to be forgiven, / Yet neither can explain what love we have". Theme: generation gap, communication,
    love that can't be expressed.
  explanations:
    text: A father admits that he doesn't understand his son, even though they've lived in the same house for years. He wants to reach him but they can't find words. Both want to be forgiven and love each other, but neither can explain or show it.
    visual: 'Picture a father and son in the same room, back to back, each with a speech bubble that is empty: both want to talk, neither can.'
    step_by_step: 'Step 1: The father''s confession. Step 2: The distance between them. Step 3: His wish to reconnect. Step 4: The ending: both want forgiveness but can''t express their love.'
    real_world: Many families feel this gap between generations; talking openly, even awkwardly, is the first step across it.
  picture:
    kind: compare
    columns:
    - title: The father
      points:
      - doesn't understand his son
      - wants to bring him back
      - ready to forgive
    - title: The son
      points:
      - builds his own world
      - seems a stranger
      - also wants forgiveness
    alt: 'Father and son in the poem: both want to connect and be forgiven, but can''t express their love.'
  activity:
    type: sort
    prompt: 'Father to Son: what does the father feel?'
    bins:
    - Distance
    - Wish to reconnect
    - Love not spoken
    items:
    - label: I do not understand this child
      bin: Distance
      clue: The opening line.
      why: Not understanding his son shows distance.
    - label: Build from the same root
      bin: Wish to reconnect
      clue: Something they share.
      why: He wants a relationship from their shared root.
    - label: Neither can explain what love we have
      bin: Love not spoken
      clue: The last line.
      why: They love each other but can't say it.
    - label: We seem strangers in the same house
      bin: Distance
      clue: Years together.
      why: Living together yet strangers is distance.
    - label: Like the prodigal son, return
      bin: Wish to reconnect
      clue: A son coming home.
      why: He hopes his son comes back to him.
  lesson:
    - teach: In Elizabeth Jennings's poem a father speaks about his grown son. They have lived in the same house for years, yet the father says he does not understand him and knows nothing of him. Living close does not mean being close.
      check:
        prompt: What is surprising about the father's confession?
        options:
        - they share a house but are like strangers
        - they have never met
        - the son lives abroad
        answer: they share a house but are like strangers
        why: Physical closeness has not brought understanding.
    - teach: The father wants to build a bond 'from the same root' they share. But the son is making a world the father does not recognise. The father would like him to come back like the prodigal son of the Bible story, who returned home and was forgiven.
      check:
        prompt: Why does the father think of the prodigal son?
        options:
        - he hopes his son will come back to him and be welcomed
        - his son has wasted money
        - he wants to send his son away
        answer: he hopes his son will come back to him and be welcomed
        why: The prodigal son's return is a story of reunion and forgiveness.
    - teach: Both are hurt. The father is ready to forgive, but they do not speak the same language of feeling. The poem ends with each wishing to be forgiven, yet neither able to explain the love they have. The theme is the generation gap and love that cannot find words.
      picture:
        kind: flow
        steps:
        - Same house for years
        - 'Father: I do not understand him'
        - Wants a bond from the same root
        - Both hurt, no shared language
        - Each wishes to be forgiven
        alt: How the poem moves from confession to a shared, unspoken wish for forgiveness.
      check:
        prompt: Why does the poem end without a reunion?
        options:
        - neither can put his love into words
        - the son leaves forever
        - the father dies
        answer: neither can put his love into words
        why: The love is there, but communication fails.
  items:
  - prompt: What does the father admit at the start?
    options:
    - He does not understand his son
    - He is angry with his son
    - He is leaving home
    - He is ill
    answer: He does not understand his son
    difficulty: 1
    hints:
    - First line.
    - Same house for years.
    solution: That he does not understand his son.
    mistakes: {"He is angry with his son": "e11_father_admit", "He is leaving home": "e11_father_admit", "He is ill": "e11_father_admit"}
  - prompt: What is the main theme of the poem?
    options:
    - The gap between generations
    - Love of nature
    - War
    - Travel
    answer: The gap between generations
    difficulty: 1
    hints:
    - Father and son.
    - Communication.
    solution: The generation gap and failed communication.
    mistakes: {"Love of nature": "e11_generation_gap", "War": "e11_generation_gap", "Travel": "e11_generation_gap"}
  - prompt: What do both father and son wish at the end?
    options:
    - To be forgiven
    - To move away
    - To become rich
    - To win an argument
    answer: To be forgiven
    difficulty: 2
    hints:
    - Each wishes...
    - Forgiveness.
    solution: Each wishes to be forgiven.
    mistakes: {"To move away": "e11_forgive", "To become rich": "e11_forgive", "To win an argument": "e11_forgive"}
  - prompt: Why can't they reconnect?
    options:
    - They can't express their love to each other
    - They live in different cities
    - They speak different languages literally
    - The son is a baby
    answer: They can't express their love to each other
    difficulty: 2
    hints:
    - Neither can explain.
    - Silence.
    solution: Neither can explain or show their love.
    mistakes:
      They speak different languages literally: eng11_poem_meaning
  - prompt: Who wrote 'Father to Son'?
    options:
    - Elizabeth Jennings
    - Shirley Toulson
    - Ted Hughes
    - Walt Whitman
    answer: Elizabeth Jennings
    difficulty: 1
    hints:
    - English poet.
    - Woman poet.
    solution: Elizabeth Jennings.
    mistakes: {"Shirley Toulson": "e11_poets", "Ted Hughes": "e11_poets", "Walt Whitman": "e11_poets"}
  - prompt: 'The father compares the son''s possible return to that of the:'
    options:
    - prodigal son
    - lost sheep
    - hero of a war
    - king
    answer: prodigal son
    difficulty: 2
    hints:
    - Bible story.
    - A son who comes home.
    solution: The prodigal son.
    mistakes: {"lost sheep": "e11_prodigal", "hero of a war": "e11_prodigal", "king": "e11_prodigal"}
  - prompt: Who is the speaker of the poem?
    options:
    - the father
    - the son
    - the mother
    answer: the father
    difficulty: 1
    hints:
    - Read the title.
    - He speaks of 'this child'.
    solution: 'Step 1: the title is ''Father to Son''. Step 2: the father speaks.'
    mistakes:
      the son: e11x10_voice
      the mother: e11x10_voice
  - prompt: How long have father and son lived in the same house?
    options:
    - for years
    - for one week
    - never
    answer: for years
    difficulty: 1
    hints:
    - This makes the distance more painful.
    - It has been a long time.
    solution: 'Step 1: they have lived together long. Step 2: for years.'
    mistakes:
      for one week: e11x10_gap
      never: e11x10_gap
  - prompt: 'The ''same root'' the father mentions suggests:'
    options:
    - their shared family bond
    - a tree in the garden
    - a vegetable
    answer: their shared family bond
    difficulty: 2
    hints:
    - It is a metaphor.
    - They come from one family.
    solution: 'Step 1: a root links a plant''s parts. Step 2: their family link.'
    mistakes:
      a tree in the garden: e11x10_gap
      a vegetable: e11x10_gap
  - prompt: What is the son building, according to the father?
    options:
    - a world the father does not recognise
    - a new house
    - a business
    answer: a world the father does not recognise
    difficulty: 2
    hints:
    - It is his own way of life.
    - The father feels shut out of it.
    solution: 'Step 1: the son has his own interests. Step 2: a world strange to the father.'
    mistakes:
      a new house: e11x10_gap
      a business: e11x10_gap
  - prompt: Is the father ready to forgive?
    options:
    - 'yes'
    - no, never
    - the poem never mentions forgiveness
    answer: 'yes'
    difficulty: 2
    hints:
    - Think of the prodigal son story.
    - The father wants him back.
    solution: 'Step 1: he hopes for a return. Step 2: he is ready to forgive.'
    mistakes:
      no, never: e11x10_voice
      the poem never mentions forgiveness: e11x10_voice
  - prompt: 'When the poem says father and son speak like strangers, it means:'
    options:
    - they cannot share their feelings with each other
    - one speaks Hindi and one English
    - the son cannot talk
    answer: they cannot share their feelings with each other
    difficulty: 2
    hints:
    - It is not about real languages.
    - Think of understanding.
    solution: 'Step 1: same words, different meanings. Step 2: no shared language of feeling.'
    mistakes:
      one speaks Hindi and one English: e11x10_gap
      the son cannot talk: e11x10_gap
  - prompt: Who is to blame for the distance, as the poem presents it?
    options:
    - both share it; each wants forgiveness
    - only the son
    - only the neighbours
    answer: both share it; each wants forgiveness
    difficulty: 3
    hints:
    - Look at the last lines.
    - Each wishes to be forgiven.
    solution: 'Step 1: both are hurt. Step 2: both seek forgiveness, so both share it.'
    mistakes:
      only the son: e11x10_voice
      only the neighbours: e11x10_voice
  - prompt: Which feeling is strongest at the end of the poem?
    options:
    - sad love that cannot be expressed
    - anger and hatred
    - pure happiness
    answer: sad love that cannot be expressed
    difficulty: 3
    hints:
    - Love is mentioned in the last line.
    - But it cannot be explained.
    solution: 'Step 1: love exists. Step 2: it stays unspoken, which is sad.'
    mistakes:
      anger and hatred: e11x10_gap
      pure happiness: e11x10_gap
  - prompt: Which problem does the poem show?
    options:
    - the generation gap
    - poverty
    - war
    answer: the generation gap
    difficulty: 1
    hints:
    - A parent and a grown child.
    - Different ages, different worlds.
    solution: 'Step 1: father and son cannot connect. Step 2: the generation gap.'
    mistakes:
      poverty: e11x10_gap
      war: e11x10_gap
