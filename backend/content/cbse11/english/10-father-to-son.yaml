# CBSE Class 11 English (NCERT Hornbill, rationalised syllabus), chapter 10.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse11-eng
chapter: 10
title: Father to Son (Elizabeth Jennings)
concepts:
- code: cbse11e.h10.father
  title: Father to Son (Elizabeth Jennings)
  notes: |
    A father speaks about his grown son: "I do not understand this child / Though we have lived together now / In the same
    house for years." He knows nothing of him, and they seem strangers. He wants to build a relationship "from the same
    root", sees the son making a "world" he doesn't recognise; he would like the son to return like the prodigal son,
    and both are hurt; the father is ready to forgive but they don't speak the same language. Ends with both shown
    "Each wish to be forgiven, / Yet neither can explain what love we have". Theme: generation gap, communication,
    love that can't be expressed.
  explanations:
    text: A father admits that he doesn't understand his son, even though they've lived in the same house for years. He wants to reach him but they can't find words. Both want to be forgiven and love each other, but neither can explain or show it.
    visual: 'Picture a father and son in the same room, back to back, each with a speech bubble that is empty: both want to talk, neither can.'
    step_by_step: 'Step 1: The father''s confession. Step 2: The distance between them. Step 3: His wish to reconnect. Step 4: The ending: both want forgiveness but can''t express their love.'
    real_world: Many families feel this gap between generations; talking openly, even awkwardly, is the first step across it.
  picture:
    kind: compare
    columns:
    - title: The father
      points:
      - doesn't understand his son
      - wants to bring him back
      - ready to forgive
    - title: The son
      points:
      - builds his own world
      - seems a stranger
      - also wants forgiveness
    alt: 'Father and son in the poem: both want to connect and be forgiven, but can''t express their love.'
  activity:
    type: sort
    prompt: 'Father to Son: what does the father feel?'
    bins:
    - Distance
    - Wish to reconnect
    - Love not spoken
    items:
    - label: I do not understand this child
      bin: Distance
      clue: The opening line.
      why: Not understanding his son shows distance.
    - label: Build from the same root
      bin: Wish to reconnect
      clue: Something they share.
      why: He wants a relationship from their shared root.
    - label: Neither can explain what love we have
      bin: Love not spoken
      clue: The last line.
      why: They love each other but can't say it.
    - label: We seem strangers in the same house
      bin: Distance
      clue: Years together.
      why: Living together yet strangers is distance.
    - label: Like the prodigal son, return
      bin: Wish to reconnect
      clue: A son coming home.
      why: He hopes his son comes back to him.
  items:
  - prompt: What does the father admit at the start?
    options:
    - He does not understand his son
    - He is angry with his son
    - He is leaving home
    - He is ill
    answer: He does not understand his son
    difficulty: 1
    hints:
    - First line.
    - Same house for years.
    solution: That he does not understand his son.
  - prompt: What is the main theme of the poem?
    options:
    - The gap between generations
    - Love of nature
    - War
    - Travel
    answer: The gap between generations
    difficulty: 1
    hints:
    - Father and son.
    - Communication.
    solution: The generation gap and failed communication.
  - prompt: What do both father and son wish at the end?
    options:
    - To be forgiven
    - To move away
    - To become rich
    - To win an argument
    answer: To be forgiven
    difficulty: 2
    hints:
    - Each wishes...
    - Forgiveness.
    solution: Each wishes to be forgiven.
  - prompt: Why can't they reconnect?
    options:
    - They can't express their love to each other
    - They live in different cities
    - They speak different languages literally
    - The son is a baby
    answer: They can't express their love to each other
    difficulty: 2
    hints:
    - Neither can explain.
    - Silence.
    solution: Neither can explain or show their love.
    mistakes:
      They speak different languages literally: eng11_poem_meaning
  - prompt: Who wrote 'Father to Son'?
    options:
    - Elizabeth Jennings
    - Shirley Toulson
    - Ted Hughes
    - Walt Whitman
    answer: Elizabeth Jennings
    difficulty: 1
    hints:
    - English poet.
    - Woman poet.
    solution: Elizabeth Jennings.
  - prompt: 'The father compares the son''s possible return to that of the:'
    options:
    - prodigal son
    - lost sheep
    - hero of a war
    - king
    answer: prodigal son
    difficulty: 2
    hints:
    - Bible story.
    - A son who comes home.
    solution: The prodigal son.
