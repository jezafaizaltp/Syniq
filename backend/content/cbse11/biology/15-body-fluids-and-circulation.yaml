# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 15. Format: content/README.md.
subject: cbse11-bio
chapter: 15
title: Body Fluids and Circulation
tips:
  c11b_blood: 'Universal donor: O negative (no A/B antigens). Universal recipient: AB (no anti-A or anti-B antibodies).'
  c11b_cardiac: Cardiac output = stroke volume × heart rate (about 70 mL × 72 = 5 L/min).
  b11_cardiac_cycle: "One cycle = 60 s ÷ beats per minute."
  b11_clot_calcium: "Clotting needs a mineral also found in bones and milk."
  b11_hypertension: "'Hyper' means high, 'tension' means pressure."
  b11_mitral: "The right side valve has three cusps; the left side valve has two, like a bishop's mitre."
  b11_neutrophils: "Which WBC is the first responder to bacteria and makes up most of pus? The first responders are also the most numerous."
  b11_plasma: "Plasma is just over half the blood; cells make up the rest."
  b11_platelets: "RBCs carry oxygen, WBCs fight infection. Platelets stop bleeding."
  b11_qrs: "P wave = atria depolarise; T wave = ventricles repolarise. QRS is between them."
  b11_rbc_life: "RBCs have no nucleus and wear out after about four months."
  b11_sa_node: "The AV node passes the signal on, the bundle of His and Purkinje fibres spread it. The heartbeat starts at the node in the wall of the right atrium, near where blood enters."
  c11b15_blood: 'Sort blood parts by job: plasma carries, RBCs carry oxygen, WBCs defend, platelets clot.'
  c11b15_heart: Follow blood through the heart in order and name each valve it passes. For numbers, use cardiac output = stroke volume × heart rate.
concepts:
- code: cbse11b.circ.blood
  title: Blood and lymph
  notes: |
    Blood: plasma (55%: water, proteins—fibrinogen, globulins, albumin; clotting factors) and formed elements: RBCs
    (erythrocytes, 5–5.5 million/mm³, biconcave, no nucleus in mammals, haemoglobin, life 120 days, destroyed in spleen),
    WBCs (6000–8000/mm³: neutrophils most, lymphocytes, monocytes, eosinophils, basophils), platelets (1.5–3.5 lakh/mm³,
    clotting). Blood groups: ABO (antigens A, B; antibodies), Rh factor (erythroblastosis foetalis). Coagulation: thrombokinase
    → prothrombin → thrombin → fibrinogen → fibrin; Ca²⁺ needed. Lymph (tissue fluid): carries fats, immune cells.
  explanations:
    text: Blood is a liquid (plasma) carrying red cells (oxygen), white cells (defence) and platelets (clotting). Blood groups depend on markers on red cells; matching them matters for safe transfusion.
    visual: 'Draw a test tube of spun blood: yellow plasma on top (about 55%), a thin white layer of white cells and platelets, and red cells at the bottom.'
    step_by_step: 'Step 1: Identify the component. Step 2: Recall its job. Step 3: For transfusion, check antigens of donor against antibodies of recipient.'
    real_world: Blood donation camps in colleges collect blood that is stored by group and Rh type for emergencies.
  picture:
    kind: compare
    columns:
    - title: Group
      points:
      - A
      - B
      - AB
      - O
    - title: Antigen on RBC
      points:
      - A
      - B
      - A and B
      - none
    - title: Antibody in plasma
      points:
      - anti-B
      - anti-A
      - none
      - anti-A and anti-B
    alt: ABO blood groups with their antigens and antibodies.
  activity:
    type: sort
    prompt: Which part of blood is it?
    bins:
    - Red blood cells
    - White blood cells
    - Platelets
    - Plasma
    items:
    - label: Carry haemoglobin
      bin: Red blood cells
      clue: Which cells carry oxygen?
      why: Erythrocytes are packed with haemoglobin.
    - label: Have no nucleus in most mammals
      bin: Red blood cells
      clue: Which cells lose their nucleus to fit more haemoglobin?
      why: Mammalian RBCs have no nucleus.
    - label: Live about 120 days
      bin: Red blood cells
      clue: Which cells are broken down in the spleen after about four months?
      why: RBCs.
    - label: Neutrophils and monocytes eat germs
      bin: White blood cells
      clue: Which cells defend the body?
      why: Phagocytic leucocytes.
    - label: Lymphocytes make antibodies
      bin: White blood cells
      clue: Which cells give immunity?
      why: B and T lymphocytes.
    - label: Basophils release histamine
      bin: White blood cells
      clue: Which cells cause inflammation?
      why: Basophils, a kind of leucocyte.
    - label: Release factors that start clotting
      bin: Platelets
      clue: Which cell fragments help blood clot?
      why: Thrombocytes.
    - label: Fragments of megakaryocytes
      bin: Platelets
      clue: Which parts of blood are pieces of bone-marrow cells?
      why: Platelets.
    - label: Fibrinogen
      bin: Plasma
      clue: Which part of blood carries clotting proteins in solution?
      why: Fibrinogen is a plasma protein.
    - label: Albumin, which keeps water balance
      bin: Plasma
      clue: Which part carries dissolved proteins?
      why: Albumin is a plasma protein.
    - label: About 55% of the blood
      bin: Plasma
      clue: Which straw-coloured part is the largest?
      why: Plasma makes up about 55%.
  lesson:
    - teach: 'Blood is plasma (about 55%: water, proteins such as fibrinogen, globulins and albumin) plus formed elements: red cells, white cells and platelets.'
      check:
        prompt: Which plasma protein is needed for clotting?
        options:
        - fibrinogen
        - albumin
        - globulin
        answer: fibrinogen
        why: It becomes fibrin threads.
      ways:
      - style: visual
        teach: What a blood sample separates into when it is spun.
        picture:
          kind: bars
          unit: '% of blood volume'
          bars:
          - label: Plasma
            value: 55
          - label: Formed elements
            value: 45
          alt: Spun blood separates into pale plasma, a little over half the volume, and formed elements, a little under half.
      - style: real_world
        teach: 'Blood banks often split one donation into parts: red cells for a patient after heavy bleeding, platelets for a dengue patient whose count has fallen, and plasma for burn patients. One donor can help several people.'
    - teach: 'RBCs (about 5 million per mm³) are biconcave, have no nucleus in mammals, carry haemoglobin and live about 120 days. WBCs defend: neutrophils (most), lymphocytes, monocytes, eosinophils, basophils. Platelets help clotting.'
      check:
        prompt: Which WBCs make antibodies?
        options:
        - lymphocytes
        - neutrophils
        - basophils
        answer: lymphocytes
        why: B-lymphocytes make antibodies.
      ways:
      - style: visual
        teach: Red cells, white cells and platelets compared.
        picture:
          kind: compare
          columns:
          - title: Red cells
            points:
            - most numerous
            - no nucleus in mammals
            - carry O₂ with haemoglobin
          - title: White cells
            points:
            - have a nucleus
            - fewer in number
            - fight infection
          - title: Platelets
            points:
            - cell fragments
            - from megakaryocytes
            - help blood clot
          alt: Red cells are most numerous, lack a nucleus and carry oxygen; white cells have a nucleus and fight infection; platelets are cell fragments that help blood clot.
      - style: step_by_step
        teach: 'Step 1: Is the white cell granular? Neutrophils, eosinophils and basophils are. Step 2: Neutrophils and monocytes eat germs (phagocytes). Step 3: Eosinophils rise in allergies. Step 4: Basophils release histamine and heparin. Step 5: Lymphocytes (B and T) make the immune response.'
    - teach: 'ABO groups depend on antigens A and B on RBCs; O has none, AB has both. Rh⁺ people carry the Rh antigen. Clotting: thrombokinase → prothrombin to thrombin → fibrinogen to fibrin, needing Ca²⁺. Lymph carries fats and immune cells.'
      picture:
        kind: compare
        columns:
        - title: Group
          points:
          - A
          - B
          - AB
          - O
        - title: Antibodies in plasma
          points:
          - anti-B
          - anti-A
          - none
          - anti-A and anti-B
        alt: ABO blood groups and their antibodies.
      check:
        prompt: 'Group O blood can be given to all groups because it has:'
        options:
        - no A or B antigens
        - no antibodies
        - both antigens
        answer: no A or B antigens
        why: Nothing for the recipient's antibodies to attack.
      ways:
      - style: step_by_step
        teach: 'Step 1: Note the donor''s antigens on red cells. Step 2: Note the antibodies in the receiver''s plasma. Step 3: If they match (anti-A meets A), the red cells clump: unsafe. Step 4: Group O red cells have no A or B, so they suit every ABO group in an emergency.'
      - style: real_world
        teach: When you cut a finger, the bleeding stops in a few minutes because a mesh of fibrin threads traps blood cells into a clot. People with haemophilia lack a clotting factor, so a small cut can bleed for a long time.
  items:
  - prompt: Plasma makes up about what percentage of blood?
    answer: '55'
    check: '55'
    difficulty: 1
    hints:
    - More than half.
    - Formed elements 45%.
    solution: "Plasma is about 55% of blood; the cells (formed elements) make up about 45%."
    mistakes: {"45": "b11_plasma", "90": "b11_plasma", "25": "b11_plasma"}
  - prompt: A red blood cell lives about how many days?
    answer: '120'
    check: '120'
    difficulty: 1
    hints:
    - About four months.
    - Then destroyed in spleen.
    solution: "RBCs have no nucleus and wear out after about 120 days; the spleen removes them."
    mistakes: {"30": "b11_rbc_life", "365": "b11_rbc_life", "7": "b11_rbc_life"}
  - prompt: Which blood group can receive blood from all groups?
    options:
    - AB
    - O
    - A
    - B
    answer: AB
    difficulty: 2
    hints:
    - No antibodies.
    - Universal recipient.
    solution: "AB blood has no anti-A or anti-B antibodies, so it can receive any group: the universal recipient."
    mistakes:
      O: c11b_blood
  - prompt: 'The most numerous white blood cells are:'
    options:
    - neutrophils
    - lymphocytes
    - monocytes
    - basophils
    answer: neutrophils
    difficulty: 2
    hints:
    - 60–65%.
    - Phagocytic.
    solution: "Neutrophils make up about 60–65% of WBCs and are the first to attack germs."
    mistakes: {"lymphocytes": "b11_neutrophils", "monocytes": "b11_neutrophils", "basophils": "b11_neutrophils"}
  - prompt: Which ion is needed for blood clotting?
    options:
    - Ca²⁺
    - Na⁺
    - K⁺
    - Fe²⁺
    answer: Ca²⁺
    difficulty: 2
    hints:
    - Calcium.
    - Clotting factor.
    solution: "Calcium ions are needed at several steps of the clotting chain."
    mistakes: {"Na⁺": "b11_clot_calcium", "K⁺": "b11_clot_calcium", "Fe²⁺": "b11_clot_calcium"}
  - prompt: 'Platelets help mainly in:'
    options:
    - blood clotting
    - carrying oxygen
    - fighting infection
    - making antibodies
    answer: blood clotting
    difficulty: 1
    hints:
    - Thrombocytes.
    - Stop bleeding.
    solution: "Platelets release factors that start clotting and plug damaged vessels."
    mistakes: {"carrying oxygen": "b11_platelets", "fighting infection": "b11_platelets", "making antibodies": "b11_platelets"}
  - prompt: 'Normal WBC count is about 6000–8000 per mm³. RBC count is about:'
    options:
    - 5 million per mm³
    - 8000 per mm³
    - 3 lakh per mm³
    answer: 5 million per mm³
    difficulty: 1
    hints:
    - RBCs are by far the most numerous.
    - Millions, not thousands.
    solution: 'Step 1: most numerous cells. Step 2: about 5 million.'
    mistakes:
      8000 per mm³: c11b15_blood
      3 lakh per mm³: c11b15_blood
  - prompt: 'Old RBCs are destroyed mainly in the:'
    options:
    - spleen
    - kidney
    - heart
    answer: spleen
    difficulty: 1
    hints:
    - It is called the graveyard of RBCs.
    - An organ near the stomach.
    solution: 'Step 1: removes worn-out RBCs. Step 2: spleen.'
    mistakes:
      kidney: c11b15_blood
      heart: c11b15_blood
  - prompt: Which blood group is the universal donor?
    options:
    - O
    - AB
    - A
    answer: O
    difficulty: 1
    hints:
    - Its red cells carry no A or B antigen.
    - It can go to every group.
    solution: 'Step 1: no antigens. Step 2: O.'
    mistakes:
      AB: c11b15_blood
      A: c11b15_blood
  - prompt: 'Fluid that leaves capillaries and bathes cells is called:'
    options:
    - "tissue fluid (interstitial fluid)"
    - "plasma (the fluid part of blood)"
    - "serum (plasma without clotting factors)"
    answer: tissue fluid (interstitial fluid)
    difficulty: 2
    hints:
    - It has the same minerals as plasma but less protein.
    - When it drains into lymph vessels it is lymph.
    solution: 'Step 1: fluid between cells. Step 2: tissue fluid.'
    mistakes:
      "plasma (the fluid part of blood)": c11b15_blood
      "serum (plasma without clotting factors)": c11b15_blood
  - prompt: 'Plasma without clotting factors is called:'
    options:
    - serum
    - lymph
    - haemoglobin
    answer: serum
    difficulty: 2
    hints:
    - Clotted blood leaves behind a clear fluid.
    - Used in many tests.
    solution: 'Step 1: plasma minus fibrinogen and factors. Step 2: serum.'
    mistakes:
      lymph: c11b15_blood
      haemoglobin: c11b15_blood
  - prompt: 'Erythroblastosis foetalis can affect a second Rh⁺ baby of a mother who is:'
    options:
    - Rh⁻
    - Rh⁺
    - group AB
    answer: Rh⁻
    difficulty: 2
    hints:
    - The mother makes anti-Rh antibodies after the first baby.
    - She herself lacks the Rh antigen.
    solution: 'Step 1: Rh⁻ mother, Rh⁺ baby. Step 2: antibodies attack the next baby''s RBCs.'
    mistakes:
      Rh⁺: c11b15_blood
      group AB: c11b15_blood
  - prompt: 'Heparin-releasing white cells involved in inflammation are:'
    options:
    - basophils
    - neutrophils
    - lymphocytes
    answer: basophils
    difficulty: 2
    hints:
    - They are the fewest WBCs.
    - They release histamine and heparin.
    solution: 'Step 1: release histamine, serotonin, heparin. Step 2: basophils.'
    mistakes:
      neutrophils: c11b15_blood
      lymphocytes: c11b15_blood
  - prompt: Someone with group A blood has which antibodies in plasma?
    options:
    - anti-B
    - anti-A
    - none
    answer: anti-B
    difficulty: 3
    hints:
    - The body does not make antibodies against its own antigen.
    - It makes them against the other one.
    solution: 'Step 1: antigen A on cells. Step 2: anti-B in plasma.'
    mistakes:
      anti-A: c11b15_blood
      none: c11b15_blood
  - prompt: Why do mammalian RBCs lack a nucleus?
    options:
    - "to make room for more haemoglobin"
    - "they never need any energy at all"
    - "so that they can live for many years"
    answer: to make room for more haemoglobin
    difficulty: 3
    hints:
    - Their job is to carry oxygen.
    - More space, more carrier protein.
    solution: 'Step 1: no nucleus frees space. Step 2: more haemoglobin, more O₂.'
    mistakes:
      "they never need any energy at all": c11b15_blood
      "so that they can live for many years": c11b15_blood
  - prompt: 'Assertion (A): Mammalian red blood cells cannot divide.

      Reason (R): Mature mammalian red blood cells have no nucleus.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Without a nucleus there is no DNA to copy, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Serum contains fibrinogen.

      Reason (R): Serum is plasma without clotting factors.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: fibrinogen is a clotting factor, so it is absent from serum. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A patient with group B blood needs a transfusion. Donors with groups A, B, AB and O are available. Which two groups are safe?'
    options:
    - B and O
    - B and AB
    - A and O
    answer: B and O
    hints:
    - Which antibody is in group B plasma?
    - Which donor red cells carry the A antigen?
    solution: Group B plasma has anti-A, so donor cells with A (groups A and AB) would clump; B and O are safe.
    mistakes:
      B and AB: c11b15_blood
      A and O: c11b15_blood
    exam: case
    difficulty: 2
  - prompt: 'Situation: An Rh⁻ mother is carrying her second Rh⁺ baby. Her first baby was also Rh⁺. Why might this baby be at risk?'
    options:
    - "Her anti-Rh antibodies can cross the placenta and destroy the baby's red cells"
    - "Her red cells will cross the placenta and block the baby's own blood vessels"
    - "Rh⁺ babies cannot make any haemoglobin if their mother happens to be Rh⁻"
    answer: Her anti-Rh antibodies can cross the placenta and destroy the baby's red cells
    hints:
    - What did the mother's body make after the first birth?
    - Can antibodies cross the placenta?
    solution: After the first birth she made anti-Rh antibodies; in the next Rh⁺ pregnancy they attack the baby's red cells (erythroblastosis foetalis).
    mistakes:
      "Her red cells will cross the placenta and block the baby's own blood vessels": c11b15_blood
      "Rh⁺ babies cannot make any haemoglobin if their mother happens to be Rh⁻": c11b15_blood
    exam: competency
    difficulty: 2
- code: cbse11b.circ.heart
  title: Heart, cardiac cycle and circulation
  after:
  - cbse11b.circ.blood
  notes: |
    Open and closed circulatory systems. Human heart: four chambers, pericardium; valves tricuspid, bicuspid (mitral),
    semilunar. Nodal tissue: SA node (pacemaker), AV node, bundle of His, Purkinje fibres. Cardiac cycle (about 0.8 s at 72
    beats/min): atrial systole, ventricular systole, diastole; lub (AV valves close) and dub (semilunar valves close).
    Stroke volume about 70 mL; cardiac output = stroke volume × heart rate ≈ 5 L/min. ECG: P wave (atrial depolarisation),
    QRS (ventricular depolarisation), T wave (ventricular repolarisation). Double circulation: pulmonary and systemic;
    hepatic portal system; coronary circulation. Disorders: hypertension (above 140/90), coronary artery disease, angina,
    heart failure.
  explanations:
    text: 'The heart is a four-chambered pump with its own built-in pacemaker, the SA node. Blood passes through the heart twice in each round trip: once to the lungs and once to the body. That''s double circulation.'
    visual: 'Draw the heart''s path: body → right atrium → right ventricle → lungs → left atrium → left ventricle → body.'
    step_by_step: 'Step 1: Trace blood through the chambers and valves. Step 2: Link each ECG wave to an event. Step 3: Cardiac output = stroke volume × heart rate.'
    real_world: A heart rate of about 72 per minute pumps about 5 litres of blood a minute, the whole blood volume of an adult.
  picture:
    kind: flow
    steps:
    - Right atrium
    - Right ventricle
    - Lungs
    - Left atrium
    - Left ventricle
    - Body
    alt: 'Double circulation: right side to the lungs, left side to the body.'
  activity:
    type: order
    prompt: Put one heartbeat's electrical signal in order.
    steps:
    - The SA node fires (the pacemaker)
    - The atria contract
    - The AV node picks up the signal and delays it
    - The bundle of His carries it down the septum
    - Purkinje fibres spread it through the ventricle walls
    - The ventricles contract
    reasons:
      The atria contract: The atria contract only after the SA node's signal spreads across them.
      The AV node picks up the signal and delays it: The AV node is reached only after the signal crosses the atria; the delay lets the atria empty.
      The bundle of His carries it down the septum: The bundle of His starts at the AV node, so it comes after it.
      Purkinje fibres spread it through the ventricle walls: Purkinje fibres branch off the bundle of His.
      The ventricles contract: The ventricles contract last, once the Purkinje fibres have spread the signal.
  lesson:
    - teach: 'The human heart has four chambers. Valves keep blood moving one way: tricuspid (right side), bicuspid or mitral (left side) and semilunar valves at the exits to the arteries.'
      check:
        prompt: 'The valve between the right atrium and right ventricle is the:'
        options:
        - tricuspid
        - bicuspid
        - semilunar
        answer: tricuspid
        why: Three flaps on the right side.
      ways:
      - style: visual
        teach: The path blood takes through the heart and lungs.
        picture:
          kind: flow
          steps:
          - Body → vena cava → right atrium
          - Tricuspid valve → right ventricle
          - Pulmonary artery → lungs
          - Pulmonary veins → left atrium
          - Mitral valve → left ventricle
          - Aorta → body
          alt: Blood from the body enters the right atrium and right ventricle, goes to the lungs, returns to the left atrium and left ventricle, and leaves through the aorta to the body.
      - style: real_world
        teach: When a doctor listens with a stethoscope, the 'lub' is the tricuspid and mitral valves shutting and the 'dub' is the semilunar valves shutting. A whooshing sound between them can mean a leaky valve, called a murmur.
    - teach: The heartbeat starts in the SA node (pacemaker), passes to the AV node, the bundle of His and Purkinje fibres. One cardiac cycle takes about 0.8 s at 72 beats per minute. 'Lub' is the AV valves closing; 'dub' the semilunar valves closing.
      check:
        prompt: 'The ''dub'' sound comes from:'
        options:
        - semilunar valves closing
        - AV valves closing
        - atria contracting
        answer: semilunar valves closing
        why: Second heart sound.
      ways:
      - style: visual
        teach: How the heartbeat signal spreads through the heart.
        picture:
          kind: flow
          steps:
          - SA node fires (pacemaker)
          - Atria contract
          - AV node delays the signal
          - Bundle of His
          - Purkinje fibres
          - Ventricles contract
          alt: The SA node fires, the atria contract, the AV node delays the signal, which then runs down the bundle of His and Purkinje fibres so the ventricles contract.
      - style: step_by_step
        teach: 'Step 1: Cardiac cycle time = 60 ÷ heart rate. Step 2: At 60 beats a minute each cycle lasts 1 s. Step 3: Cardiac output = stroke volume × heart rate. Step 4: For example, 60 mL × 80 beats = 4800 mL a minute.'
    - teach: 'Cardiac output = stroke volume (about 70 mL) × heart rate (about 72) ≈ 5 L/min. ECG: P wave (atria excited), QRS (ventricles excited), T wave (ventricles recover). Double circulation: pulmonary (heart–lungs) and systemic (heart–body).'
      picture:
        kind: flow
        steps:
        - SA node
        - Atria contract
        - AV node
        - Bundle of His
        - Purkinje fibres
        - Ventricles contract
        alt: How the heartbeat signal travels.
      check:
        prompt: 'The T wave of an ECG shows:'
        options:
        - ventricles recovering (repolarisation)
        - atria contracting
        - SA node firing
        answer: ventricles recovering (repolarisation)
        why: It follows the QRS complex.
      ways:
      - style: step_by_step
        teach: 'Step 1: The P wave shows the atria being excited, just before they contract. Step 2: The QRS complex shows the ventricles being excited. Step 3: The T wave shows the ventricles recovering. Step 4: Counting QRS complexes in a minute gives the heart rate.'
      - style: real_world
        teach: Smartwatches and hospital monitors draw the ECG trace you see in films. A doctor who sees an unusual shape, say a missing P wave, can tell which part of the heart's wiring is not working properly.
  items:
  - prompt: Heart rate is 72 beats per minute. How long (in s) is one cardiac cycle, to one decimal place?
    answer: '0.8'
    check: round(Rational(60,72),1)
    difficulty: 2
    hints:
    - 60 ÷ 72.
    - About 0.83.
    solution: "One cycle = 60 s/72 ≈ 0.83 s, about 0.8 s."
    mistakes: {"1.2": "b11_cardiac_cycle", "72": "b11_cardiac_cycle", "0.72": "b11_cardiac_cycle"}
  - prompt: Stroke volume 70 mL and heart rate 72 per minute. Find cardiac output (in mL/min).
    answer: '5040'
    check: 70*72
    difficulty: 1
    hints:
    - SV × HR.
    - 70 × 72.
    solution: 5,040 mL/min (about 5 L).
    mistakes:
      '142': c11b_cardiac
  - prompt: 'The pacemaker of the heart is the:'
    options:
    - SA node
    - AV node
    - bundle of His
    - Purkinje fibres
    answer: SA node
    difficulty: 1
    hints:
    - Starts each beat.
    - Right atrium wall.
    solution: "The SA node makes the most impulses per minute, so it sets the heartbeat rate."
    mistakes: {"AV node": "b11_sa_node", "bundle of His": "b11_sa_node", "Purkinje fibres": "b11_sa_node"}
  - prompt: 'The QRS complex of an ECG shows:'
    options:
    - depolarisation of the ventricles
    - atrial depolarisation
    - ventricular repolarisation
    - valve closing
    answer: depolarisation of the ventricles
    difficulty: 2
    hints:
    - Big spike.
