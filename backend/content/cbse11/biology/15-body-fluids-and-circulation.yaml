# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 15. Format: content/README.md.
subject: cbse11-bio
chapter: 15
title: Body Fluids and Circulation
tips:
  c11b_blood: 'Universal donor: O negative (no A/B antigens). Universal recipient: AB (no anti-A or anti-B antibodies).'
  c11b_cardiac: Cardiac output = stroke volume × heart rate (about 70 mL × 72 = 5 L/min).
concepts:
- code: cbse11b.circ.blood
  title: Blood and lymph
  notes: |
    Blood: plasma (55%: water, proteins—fibrinogen, globulins, albumin; clotting factors) and formed elements: RBCs
    (erythrocytes, 5–5.5 million/mm³, biconcave, no nucleus in mammals, haemoglobin, life 120 days, destroyed in spleen),
    WBCs (6000–8000/mm³: neutrophils most, lymphocytes, monocytes, eosinophils, basophils), platelets (1.5–3.5 lakh/mm³,
    clotting). Blood groups: ABO (antigens A, B; antibodies), Rh factor (erythroblastosis foetalis). Coagulation: thrombokinase
    → prothrombin → thrombin → fibrinogen → fibrin; Ca²⁺ needed. Lymph (tissue fluid): carries fats, immune cells.
  explanations:
    text: Blood is a liquid (plasma) carrying red cells (oxygen), white cells (defence) and platelets (clotting). Blood groups depend on markers on red cells; matching them matters for safe transfusion.
    visual: 'Draw a test tube of spun blood: yellow plasma on top (about 55%), a thin white layer of white cells and platelets, and red cells at the bottom.'
    step_by_step: 'Step 1: Identify the component. Step 2: Recall its job. Step 3: For transfusion, check antigens of donor against antibodies of recipient.'
    real_world: Blood donation camps in colleges collect blood that is stored by group and Rh type for emergencies.
  picture:
    kind: compare
    columns:
    - title: Group
      points:
      - A
      - B
      - AB
      - O
    - title: Antigen on RBC
      points:
      - A
      - B
      - A and B
      - none
    - title: Antibody in plasma
      points:
      - anti-B
      - anti-A
      - none
      - anti-A and anti-B
    alt: ABO blood groups with their antigens and antibodies.
  items:
  - prompt: Plasma makes up about what percentage of blood?
    answer: '55'
    check: '55'
    difficulty: 1
    hints:
    - More than half.
    - Formed elements 45%.
    solution: About 55%.
  - prompt: A red blood cell lives about how many days?
    answer: '120'
    check: '120'
    difficulty: 1
    hints:
    - About four months.
    - Then destroyed in spleen.
    solution: About 120 days.
  - prompt: Which blood group can receive blood from all groups?
    options:
    - AB
    - O
    - A
    - B
    answer: AB
    difficulty: 2
    hints:
    - No antibodies.
    - Universal recipient.
    solution: AB.
    mistakes:
      O: c11b_blood
  - prompt: 'The most numerous white blood cells are:'
    options:
    - neutrophils
    - lymphocytes
    - monocytes
    - basophils
    answer: neutrophils
    difficulty: 2
    hints:
    - 60–65%.
    - Phagocytic.
    solution: Neutrophils.
  - prompt: Which ion is needed for blood clotting?
    options:
    - Ca²⁺
    - Na⁺
    - K⁺
    - Fe²⁺
    answer: Ca²⁺
    difficulty: 2
    hints:
    - Calcium.
    - Clotting factor.
    solution: Calcium.
  - prompt: 'Platelets help mainly in:'
    options:
    - blood clotting
    - carrying oxygen
    - fighting infection
    - making antibodies
    answer: blood clotting
    difficulty: 1
    hints:
    - Thrombocytes.
    - Stop bleeding.
    solution: Clotting.
- code: cbse11b.circ.heart
  title: Heart, cardiac cycle and circulation
  after:
  - cbse11b.circ.blood
  notes: |
    Open and closed circulatory systems. Human heart: four chambers, pericardium; valves tricuspid, bicuspid (mitral),
    semilunar. Nodal tissue: SA node (pacemaker), AV node, bundle of His, Purkinje fibres. Cardiac cycle (about 0.8 s at 72
    beats/min): atrial systole, ventricular systole, diastole; lub (AV valves close) and dub (semilunar valves close).
    Stroke volume about 70 mL; cardiac output = stroke volume × heart rate ≈ 5 L/min. ECG: P wave (atrial depolarisation),
    QRS (ventricular depolarisation), T wave (ventricular repolarisation). Double circulation: pulmonary and systemic;
    hepatic portal system; coronary circulation. Disorders: hypertension (above 140/90), coronary artery disease, angina,
    heart failure.
  explanations:
    text: 'The heart is a four-chambered pump with its own built-in pacemaker, the SA node. Blood passes through the heart twice in each round trip: once to the lungs and once to the body. That''s double circulation.'
    visual: 'Draw the heart''s path: body → right atrium → right ventricle → lungs → left atrium → left ventricle → body.'
    step_by_step: 'Step 1: Trace blood through the chambers and valves. Step 2: Link each ECG wave to an event. Step 3: Cardiac output = stroke volume × heart rate.'
    real_world: A heart rate of about 72 per minute pumps about 5 litres of blood a minute, the whole blood volume of an adult.
  picture:
    kind: flow
    steps:
    - Right atrium
    - Right ventricle
    - Lungs
    - Left atrium
    - Left ventricle
    - Body
    alt: 'Double circulation: right side to the lungs, left side to the body.'
  items:
  - prompt: Heart rate is 72 beats per minute. How long (in s) is one cardiac cycle, to one decimal place?
    answer: '0.8'
    check: round(Rational(60,72),1)
    difficulty: 2
    hints:
    - 60 ÷ 72.
    - About 0.83.
    solution: About 0.8 s.
  - prompt: Stroke volume 70 mL and heart rate 72 per minute. Find cardiac output (in mL/min).
    answer: '5040'
    check: 70*72
    difficulty: 1
    hints:
    - SV × HR.
    - 70 × 72.
    solution: 5,040 mL/min (about 5 L).
    mistakes:
      '142': c11b_cardiac
  - prompt: 'The pacemaker of the heart is the:'
    options:
    - SA node
    - AV node
    - bundle of His
    - Purkinje fibres
    answer: SA node
    difficulty: 1
    hints:
    - Starts each beat.
    - Right atrium wall.
    solution: The SA node.
  - prompt: 'The QRS complex of an ECG shows:'
    options:
    - depolarisation of the ventricles
    - atrial depolarisation
    - ventricular repolarisation
    - valve closing
    answer: depolarisation of the ventricles
    difficulty: 2
    hints:
    - Big spike.
    - Before ventricles contract.
    solution: Ventricular depolarisation.
  - prompt: 'The valve between the left atrium and left ventricle is the:'
    options:
    - bicuspid (mitral) valve
    - tricuspid valve
    - semilunar valve
    - pulmonary valve
    answer: bicuspid (mitral) valve
    difficulty: 2
    hints:
    - Two flaps.
    - Left side.
    solution: The bicuspid (mitral) valve.
  - prompt: 'Blood pressure regularly above about 140/90 mm Hg is called:'
    options:
    - hypertension
    - angina
    - heart failure
    - anaemia
    answer: hypertension
    difficulty: 1
    hints:
    - High BP.
    - Normal 120/80.
    solution: Hypertension.
