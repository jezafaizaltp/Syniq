# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 19. Format: content/README.md.
subject: cbse11-bio
chapter: 19
title: Chemical Coordination and Integration
tips:
  c11b_insulin: "Two pancreatic hormones work against each other: one raises blood sugar between meals, the other lowers it after meals. Which comes from beta cells?"
  c11b_master: "The pituitary is called the master gland, but it takes orders from the part of the brain just above it, which links the nervous and hormone systems."
  b11_adrenaline: "Made by the adrenal medulla in emergencies."
  b11_adrenaline_chem: "Adrenaline is made from the amino acid tyrosine."
  b11_cortisol: "Cortisol comes from the adrenal cortex and is made from cholesterol."
  b11_gigantism: "Too little growth hormone causes dwarfism. Too much, before bones stop growing?"
  b11_goitre: "The thyroid makes thyroxine, which needs a mineral found in iodised salt."
  b11_insulin_receptor: "Insulin is a protein and cannot cross the lipid membrane."
  b11_negative_feedback: "Like a thermostat: when the room warms enough, the heater switches off."
  b11_pineal: "A small gland deep in the brain, sensitive to light and dark."
  b11_second_messenger: "The hormone is the first messenger at the membrane; a small molecule made inside carries the signal on."
  b11_steroid_action: "Steroids are lipids: they pass through the membrane and bind receptors that act on DNA."
  c11b19_gland: Link each hormone to its gland and its main effect. Too much and too little usually cause opposite problems.
  c11b19_act: "Ask whether the hormone can cross the cell membrane: fat-soluble hormones go inside; water-soluble ones use surface receptors and second messengers."
concepts:
- code: cbse11b.endo.glands
  title: Endocrine glands and hormones
  notes: |
    Hormones: non-nutrient chemicals acting as intercellular messengers in trace amounts. Hypothalamus (releasing and
    inhibiting hormones). Pituitary: adenohypophysis—GH (gigantism, dwarfism), PRL, TSH, ACTH, LH, FSH, MSH;
    neurohypophysis—oxytocin, vasopressin (ADH). Pineal: melatonin (day–night rhythm). Thyroid: T₃, T₄ (iodine; goitre,
    cretinism, hypothyroidism, Graves' disease), thyrocalcitonin. Parathyroid: PTH raises blood Ca²⁺. Thymus: thymosins
    (immunity). Adrenal: medulla—adrenaline, noradrenaline (fight or flight); cortex—glucocorticoids (cortisol),
    mineralocorticoids (aldosterone); Addison's disease. Pancreas (islets of Langerhans): insulin (β), glucagon (α);
    diabetes mellitus. Testis: androgens; ovary: oestrogen, progesterone. Heart (ANF), kidney (erythropoietin), GI tract
    (gastrin, secretin, CCK).
  explanations:
    text: Hormones are chemical messengers carried in the blood from endocrine glands to target organs. The pituitary, controlled by the hypothalamus, directs many other glands. Insulin lowers blood sugar, adrenaline prepares us for emergencies, and thyroid hormones set our metabolic rate.
    visual: 'Draw a body outline with glands marked: hypothalamus and pituitary in the head, thyroid in the neck, adrenals on the kidneys, pancreas below the stomach, and testes or ovaries.'
    step_by_step: 'Step 1: Name the gland. Step 2: Name its hormone. Step 3: Name the effect. Step 4: Link too much or too little to a disorder.'
    real_world: Iodised salt is sold across India to prevent goitre, a swelling of the thyroid caused by too little iodine.
  picture:
    kind: compare
    columns:
    - title: Gland
      points:
      - pancreas
      - thyroid
      - adrenal medulla
      - pituitary
    - title: Hormone
      points:
      - insulin, glucagon
      - thyroxine
      - adrenaline
      - growth hormone and others
    - title: Effect
      points:
      - blood sugar control
      - metabolic rate
      - fight or flight
      - growth, controls other glands
    alt: Major endocrine glands, their hormones and effects.
  activity:
    type: sort
    prompt: Which gland makes this hormone?
    bins:
    - Hypothalamus
    - Pituitary
    - Thyroid
    - Adrenal
    - Pancreas
    items:
    - label: GnRH (releases gonadotrophins)
      bin: Hypothalamus
      clue: Which part of the brain sends 'releasing' hormones to the pituitary?
      why: GnRH comes from the hypothalamus.
    - label: Growth hormone
      bin: Pituitary
      clue: Which 'master gland' controls growth?
      why: The anterior pituitary.
    - label: TSH (thyroid-stimulating hormone)
      bin: Pituitary
      clue: Which gland tells the thyroid what to do?
      why: TSH comes from the pituitary.
    - label: Thyroxine
      bin: Thyroid
      clue: Which iodine-using gland in the neck?
      why: The thyroid.
    - label: Thyrocalcitonin
      bin: Thyroid
      clue: Which neck gland lowers blood calcium?
      why: The thyroid.
    - label: Adrenaline
      bin: Adrenal
      clue: The 'fight or flight' hormone comes from which gland's medulla?
      why: The adrenal medulla.
    - label: Cortisol
      bin: Adrenal
      clue: A stress glucocorticoid from which cortex?
      why: The adrenal cortex.
    - label: Aldosterone
      bin: Adrenal
      clue: It saves Na⁺ in the kidney. Which gland?
      why: The adrenal cortex.
    - label: Insulin
      bin: Pancreas
      clue: Which gland's β-cells lower blood sugar?
      why: The islets of Langerhans.
    - label: Glucagon
      bin: Pancreas
      clue: Which gland's α-cells raise blood sugar?
      why: The pancreas.
  lesson:
    - teach: Hormones are chemical messengers made in tiny amounts and carried by blood to target cells. The hypothalamus controls the pituitary using releasing and inhibiting hormones.
      check:
        prompt: 'Hormones reach their targets through the:'
        options:
        - blood
        - nerves
        - ducts
        answer: blood
        why: Endocrine glands are ductless.
    - teach: 'Pituitary: the front part makes GH, prolactin, TSH, ACTH, LH, FSH and MSH; the back part releases oxytocin and ADH made by the hypothalamus. Pineal: melatonin (sleep–wake rhythm). Thyroid: T₃, T₄ (need iodine) and calcitonin. Parathyroid: PTH raises blood Ca²⁺.'
      check:
        prompt: Which hormone makes the uterus contract during birth?
        options:
        - oxytocin
        - prolactin
        - ADH
        answer: oxytocin
        why: Released from the posterior pituitary.
    - teach: 'Adrenal medulla: adrenaline and noradrenaline (fight or flight). Adrenal cortex: cortisol (glucocorticoid) and aldosterone (mineralocorticoid). Pancreatic islets: insulin (β cells, lowers sugar) and glucagon (α cells, raises sugar). Gonads make sex hormones.'
      picture:
        kind: compare
        columns:
        - title: Hormone
          points:
          - insulin
          - glucagon
          - adrenaline
          - thyroxine
        - title: Gland and effect
          points:
          - 'pancreas β: lowers sugar'
          - 'pancreas α: raises sugar'
          - 'adrenal medulla: fight or flight'
          - 'thyroid: sets metabolic rate'
        alt: Some hormones, their glands and effects.
      check:
        prompt: 'Glucagon is made by:'
        options:
        - α cells of the islets
        - β cells of the islets
        - the adrenal cortex
        answer: α cells of the islets
        why: β cells make insulin.
  items:
  - prompt: Which hormone lowers blood sugar?
    options:
    - insulin
    - glucagon
    - adrenaline
    - thyroxine
    answer: insulin
    difficulty: 1
    hints:
    - Beta cells.
    - Diabetes when low.
    solution: Insulin.
    mistakes:
      glucagon: c11b_insulin
  - prompt: 'Goitre is caused by a lack of:'
    options:
    - iodine
    - iron
    - calcium
    - vitamin C
    answer: iodine
    difficulty: 1
    hints:
    - Thyroid swells.
    - Iodised salt.
    solution: Iodine.
    mistakes: {"iron": "b11_goitre", "calcium": "b11_goitre", "vitamin C": "b11_goitre"}
  - prompt: 'The ''fight or flight'' hormone is:'
    options:
    - adrenaline
    - insulin
    - melatonin
    - oxytocin
    answer: adrenaline
    difficulty: 1
    hints:
    - Adrenal medulla.
    - Emergency.
    solution: Adrenaline.
    mistakes: {"insulin": "b11_adrenaline", "melatonin": "b11_adrenaline", "oxytocin": "b11_adrenaline"}
  - prompt: 'Too much growth hormone in childhood causes:'
    options:
    - gigantism
    - dwarfism
    - cretinism
    - goitre
    answer: gigantism
    difficulty: 2
    hints:
    - Very tall.
    - Pituitary.
    solution: Gigantism.
    mistakes: {"dwarfism": "b11_gigantism", "cretinism": "b11_gigantism", "goitre": "b11_gigantism"}
  - prompt: Which gland controls the pituitary?
    options:
    - hypothalamus
    - thyroid
    - adrenal
    - pineal
    answer: hypothalamus
    difficulty: 2
    hints:
    - Releasing hormones.
    - Above the pituitary.
    solution: The hypothalamus.
    mistakes:
      thyroid: c11b_master
  - prompt: 'Melatonin, which regulates sleep–wake cycles, is made by the:'
    options:
    - pineal gland
    - thymus
    - parathyroid
    - pancreas
    answer: pineal gland
    difficulty: 2
    hints:
    - Day–night rhythm.
    - In the brain.
    solution: The pineal gland.
    mistakes: {"thymus": "b11_pineal", "parathyroid": "b11_pineal", "pancreas": "b11_pineal"}
  - prompt: 'Diabetes mellitus is caused by a lack of or poor response to:'
    options:
    - insulin
    - glucagon
    - thyroxine
    answer: insulin
    difficulty: 1
    hints:
    - Blood sugar stays too high.
    - This hormone lowers sugar.
    solution: 'Step 1: sugar not taken into cells. Step 2: insulin problem.'
    mistakes:
      glucagon: c11b19_gland
      thyroxine: c11b19_gland
  - prompt: Which gland is called the master gland?
    options:
    - pituitary
    - thyroid
    - pancreas
    answer: pituitary
    difficulty: 1
    hints:
    - It controls many other glands.
    - It hangs below the hypothalamus.
    solution: 'Step 1: makes tropic hormones. Step 2: pituitary.'
    mistakes:
      thyroid: c11b19_gland
      pancreas: c11b19_gland
  - prompt: 'The thymus mainly helps:'
    options:
    - develop immunity (T-lymphocytes)
    - control blood sugar
    - regulate calcium
    answer: develop immunity (T-lymphocytes)
    difficulty: 1
    hints:
    - It shrinks in old age.
    - Thymosins help white cells mature.
    solution: 'Step 1: thymosins. Step 2: T-cell development.'
    mistakes:
      control blood sugar: c11b19_gland
      regulate calcium: c11b19_gland
  - prompt: 'Underactive thyroid in a growing child, causing stunted growth and learning delay, is:'
    options:
    - cretinism
    - Graves' disease
    - Addison's disease
    answer: cretinism
    difficulty: 2
    hints:
    - It is hypothyroidism in children.
    - Graves' disease is overactivity.
    solution: 'Step 1: low thyroid hormone in childhood. Step 2: cretinism.'
    mistakes:
      Graves' disease: c11b19_gland
      Addison's disease: c11b19_gland
  - prompt: 'Addison''s disease is caused by underactive:'
    options:
    - adrenal cortex
    - adrenal medulla
    - pituitary
    answer: adrenal cortex
    difficulty: 2
    hints:
    - Too little cortisol and aldosterone.
    - The outer part of the adrenal gland.
    solution: 'Step 1: low corticoid output. Step 2: adrenal cortex.'
    mistakes:
      adrenal medulla: c11b19_gland
      pituitary: c11b19_gland
  - prompt: Which hormone lowers blood calcium?
    options:
    - thyrocalcitonin
    - parathyroid hormone
    - aldosterone
    answer: thyrocalcitonin
    difficulty: 2
    hints:
    - PTH does the opposite.
    - It comes from the thyroid.
    solution: 'Step 1: opposes PTH. Step 2: thyrocalcitonin.'
    mistakes:
      parathyroid hormone: c11b19_gland
      aldosterone: c11b19_gland
  - prompt: 'Erythropoietin, made by the kidney, stimulates:'
    options:
    - red blood cell formation
    - urine formation
    - insulin release
    answer: red blood cell formation
    difficulty: 2
    hints:
    - Erythro = red.
    - It acts on bone marrow.
    solution: 'Step 1: acts on marrow. Step 2: more RBCs.'
    mistakes:
      urine formation: c11b19_gland
      insulin release: c11b19_gland
  - prompt: 'Too much growth hormone in adults (after growth stops) causes:'
    options:
    - acromegaly
    - gigantism
    - dwarfism
    answer: acromegaly
    difficulty: 3
    hints:
    - Long bones can no longer lengthen.
    - Face, hands and feet thicken.
    solution: 'Step 1: excess GH after growth plates close. Step 2: acromegaly.'
    mistakes:
      gigantism: c11b19_gland
      dwarfism: c11b19_gland
  - prompt: 'Secretin, from the duodenum, makes the pancreas release:'
    options:
    - water and bicarbonate
    - insulin
    - glucagon
    answer: water and bicarbonate
    difficulty: 3
    hints:
    - It neutralises stomach acid entering the gut.
    - A digestive, not a sugar, hormone.
    solution: 'Step 1: acid food reaches duodenum. Step 2: secretin triggers bicarbonate release.'
    mistakes:
      insulin: c11b19_gland
      glucagon: c11b19_gland
- code: cbse11b.endo.action
  title: How hormones act
  after:
  - cbse11b.endo.glands
  notes: |
    Hormone receptors: on the membrane (for protein/peptide hormones and amines, e.g. insulin, adrenaline) or inside the
    cell (for steroid hormones and iodothyronines, e.g. cortisol, oestrogen, thyroxine). Membrane-bound receptors use second
    messengers (cyclic AMP, IP₃, Ca²⁺) for biochemical changes; intracellular receptors form hormone–receptor complexes that
    regulate gene expression. Chemical classes: peptides/proteins (insulin, glucagon, pituitary hormones), steroids
    (cortisol, testosterone, oestrogen, progesterone), iodothyronines (thyroid hormones), amino-acid derivatives
    (adrenaline, noradrenaline). Feedback regulation (negative feedback keeps hormone levels steady).
  explanations:
    text: Hormones work only on cells with the right receptor. Protein hormones can't enter cells, so they bind outside and trigger a second messenger inside. Steroid hormones pass through the membrane and act on genes directly.
    visual: 'Draw two cells: one with insulin docking on the surface and a second messenger (cAMP) carrying the signal inside; one with a steroid passing through the membrane to a receptor in the nucleus.'
    step_by_step: 'Step 1: Identify the hormone''s chemical type. Step 2: Protein → membrane receptor and second messenger. Step 3: Steroid or thyroid → intracellular receptor and gene action.'
    real_world: Many sports drugs are steroid hormones; they act on genes, which is why their effects last long and can harm health.
  picture:
    kind: flow
    steps:
    - Hormone binds membrane receptor
    - Second messenger (cAMP) made
    - Enzymes activated
    - Cell response
    alt: How a protein hormone acts through a membrane receptor and a second messenger.
  activity:
    type: sort
    prompt: Where does each hormone's receptor sit?
    bins:
    - On the cell membrane
    - Inside the cell
    items:
    - label: Insulin
      bin: On the cell membrane
      clue: It's a protein. Can it pass through the fatty membrane?
      why: Protein hormones bind membrane receptors and work through second messengers.
    - label: Glucagon
      bin: On the cell membrane
      clue: A peptide. Can it enter the cell?
      why: It binds a membrane receptor and raises cAMP.
    - label: FSH
      bin: On the cell membrane
      clue: A glycoprotein. Water-soluble or fat-soluble?
      why: 'A large water-soluble hormone: membrane receptor.'
    - label: Adrenaline
      bin: On the cell membrane
      clue: An amine. Does it use cAMP as a second messenger?
      why: Adrenaline binds membrane receptors.
    - label: Cortisol
      bin: Inside the cell
      clue: A steroid. Can fat-soluble molecules cross the membrane?
      why: Steroids pass the membrane and bind receptors inside.
    - label: Testosterone
      bin: Inside the cell
      clue: A steroid. Where can it go?
      why: Inside the cell, to affect genes.
    - label: Oestradiol
      bin: Inside the cell
      clue: A steroid. Can it cross the membrane?
      why: Intracellular receptor.
    - label: Thyroxine
      bin: Inside the cell
      clue: An iodothyronine that acts on genes. Where is its receptor?
      why: Thyroid hormones bind receptors in the nucleus.
  lesson:
    - teach: A hormone only affects cells with a matching receptor. Receptors are either on the cell membrane or inside the cell.
      check:
        prompt: Why does a hormone affect only some cells?
        options:
        - only they have matching receptors
        - it reaches only those cells
        - other cells destroy it
        answer: only they have matching receptors
        why: Blood takes it everywhere.
    - teach: Protein hormones (insulin, glucagon) and amines (adrenaline) cannot cross the membrane. They bind surface receptors, and a second messenger (cyclic AMP, IP₃, Ca²⁺) carries the signal inside.
      check:
        prompt: 'Adrenaline acts through:'
        options:
        - a membrane receptor and a second messenger
        - a receptor in the nucleus
        - direct entry into DNA
        answer: a membrane receptor and a second messenger
        why: It is water-soluble.
    - teach: 'Steroids (cortisol, oestrogen, testosterone) and thyroid hormones pass through the membrane, bind receptors inside, and switch genes on or off. Negative feedback keeps hormone levels steady: more effect, less release.'
      picture:
        kind: compare
        columns:
        - title: Hormone type
          points:
          - protein / amine
          - steroid / thyroid
        - title: Receptor and action
          points:
          - on membrane; second messenger
          - inside cell; changes gene expression
        alt: Two ways hormones act on cells.
      check:
        prompt: 'Testosterone is a:'
        options:
        - steroid
        - peptide
        - amine
        answer: steroid
        why: Made from cholesterol.
  items:
  - prompt: 'Insulin binds to receptors:'
    options:
    - on the cell membrane
    - inside the nucleus
    - in mitochondria
    - it needs no receptor
    answer: on the cell membrane
    difficulty: 1
    hints:
    - Protein hormone.
    - Can't cross membrane.
    solution: On the cell membrane.
    mistakes: {"inside the nucleus": "b11_insulin_receptor", "in mitochondria": "b11_insulin_receptor", "it needs no receptor": "b11_insulin_receptor"}
  - prompt: 'Steroid hormones act mainly by:'
    options:
    - regulating gene expression
    - forming cAMP at the membrane
    - breaking down glucose directly
    - blocking nerves
    answer: regulating gene expression
    difficulty: 2
    hints:
    - Pass through the membrane.
    - Hormone–receptor complex.
    solution: Regulating genes.
    mistakes: {"forming cAMP at the membrane": "b11_steroid_action", "breaking down glucose directly": "b11_steroid_action", "blocking nerves": "b11_steroid_action"}
  - prompt: Which is a common second messenger?
    options:
    - cyclic AMP
    - glucose
    - ATP synthase
    - haemoglobin
    answer: cyclic AMP
    difficulty: 1
    hints:
    - cAMP.
    - Inside the cell.
    solution: Cyclic AMP.
    mistakes: {"glucose": "b11_second_messenger", "ATP synthase": "b11_second_messenger", "haemoglobin": "b11_second_messenger"}
  - prompt: 'Cortisol is a:'
    options:
    - steroid hormone
    - peptide hormone
    - amino-acid derivative
    - iodothyronine
    answer: steroid hormone
    difficulty: 2
    hints:
    - Adrenal cortex.
    - From cholesterol.
    solution: A steroid hormone.
    mistakes: {"peptide hormone": "b11_cortisol", "amino-acid derivative": "b11_cortisol", "iodothyronine": "b11_cortisol"}
  - prompt: 'Adrenaline is chemically an:'
    options:
    - amino-acid derivative
    - steroid
    - iodothyronine
    - fatty acid
    answer: amino-acid derivative
    difficulty: 2
    hints:
    - From tyrosine.
    - Catecholamine.
    solution: An amino-acid derivative.
    mistakes: {"steroid": "b11_adrenaline_chem", "iodothyronine": "b11_adrenaline_chem", "fatty acid": "b11_adrenaline_chem"}
  - prompt: 'Negative feedback in hormone control means:'
    options:
    - a rise in a hormone's effect reduces its further release
    - hormones keep rising
    - glands stop working
    - hormones change into nerves
    answer: a rise in a hormone's effect reduces its further release
    difficulty: 2
    hints:
    - Like a thermostat.
    - Keeps levels steady.
    solution: The response switches off further release.
    mistakes: {"hormones keep rising": "b11_negative_feedback", "glands stop working": "b11_negative_feedback", "hormones change into nerves": "b11_negative_feedback"}
  - prompt: 'Thyroxine acts by binding receptors:'
    options:
    - inside the cell
    - only on the membrane
    - in the blood
    answer: inside the cell
    difficulty: 1
    hints:
    - It is an iodothyronine.
    - It can cross the membrane.
    solution: 'Step 1: lipid-soluble. Step 2: intracellular receptor.'
    mistakes:
      only on the membrane: c11b19_act
      in the blood: c11b19_act
  - prompt: 'Insulin is chemically a:'
    options:
    - peptide (protein) hormone
    - steroid
    - amine
    answer: peptide (protein) hormone
    difficulty: 1
    hints:
    - It is made of two amino-acid chains.
    - It cannot be taken by mouth because it is digested.
    solution: 'Step 1: chains of amino acids. Step 2: peptide hormone.'
    mistakes:
      steroid: c11b19_act
      amine: c11b19_act
  - prompt: Oestrogen and progesterone belong to which class?
    options:
    - steroids
    - peptides
    - amino-acid derivatives
    answer: steroids
    difficulty: 1
    hints:
    - Sex hormones from the ovary.
    - Made from cholesterol.
    solution: 'Step 1: cholesterol-based. Step 2: steroids.'
    mistakes:
      peptides: c11b19_act
      amino-acid derivatives: c11b19_act
  - prompt: 'A hormone–receptor complex inside the nucleus mainly changes:'
    options:
    - which genes are switched on
    - the cell's shape directly
    - membrane charge only
    answer: which genes are switched on
    difficulty: 2
    hints:
    - It binds DNA.
    - New proteins may be made.
    solution: 'Step 1: complex binds the genome. Step 2: gene expression changes.'
    mistakes:
      the cell's shape directly: c11b19_act
      membrane charge only: c11b19_act
  - prompt: Which is NOT a second messenger?
    options:
    - oestrogen
    - cyclic AMP
    - IP₃
    answer: oestrogen
    difficulty: 2
    hints:
    - Second messengers are made inside the cell.
    - Which one is itself a hormone?
    solution: 'Step 1: oestrogen is a steroid hormone. Step 2: not a second messenger.'
    mistakes:
      cyclic AMP: c11b19_act
      IP₃: c11b19_act
  - prompt: 'High thyroxine reduces TSH release from the pituitary. This is:'
    options:
    - negative feedback
    - positive feedback
    - a reflex arc
    answer: negative feedback
    difficulty: 2
    hints:
    - The output switches off its own trigger.
    - It keeps levels steady.
    solution: 'Step 1: product inhibits the signal. Step 2: negative feedback.'
    mistakes:
      positive feedback: c11b19_act
      a reflex arc: c11b19_act
  - prompt: Why can steroid hormones enter cells easily?
    options:
    - they are lipid-soluble and pass through the membrane
    - they are very large
    - they are pumped in
    answer: they are lipid-soluble and pass through the membrane
    difficulty: 2
    hints:
    - The membrane is a lipid bilayer.
    - Like dissolves like.
    solution: 'Step 1: fat-soluble. Step 2: cross the bilayer.'
    mistakes:
      they are very large: c11b19_act
      they are pumped in: c11b19_act
  - prompt: 'Glucagon raises blood sugar quickly because the cAMP it triggers:'
    options:
    - switches on enzymes that break down glycogen
    - makes new genes
    - makes insulin
    answer: switches on enzymes that break down glycogen
    difficulty: 3
    hints:
    - Second messengers usually activate enzymes.
    - Glycogen is stored sugar.
    solution: 'Step 1: cAMP activates kinases. Step 2: glycogen → glucose.'
    mistakes:
      makes new genes: c11b19_act
      makes insulin: c11b19_act
  - prompt: 'Oxytocin release during childbirth increases contractions, which cause more oxytocin release. This is:'
    options:
    - positive feedback
    - negative feedback
    - no feedback
    answer: positive feedback
    difficulty: 3
    hints:
    - The effect boosts its own cause.
    - It builds until birth.
    solution: 'Step 1: contractions → more oxytocin → stronger contractions. Step 2: positive feedback.'
    mistakes:
      negative feedback: c11b19_act
      no feedback: c11b19_act
