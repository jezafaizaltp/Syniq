# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 19. Format: content/README.md.
subject: cbse11-bio
chapter: 19
title: Chemical Coordination and Integration
tips:
  c11b_insulin: "Two pancreatic hormones work against each other: one raises blood sugar between meals, the other lowers it after meals. Which comes from beta cells?"
  c11b_master: "The pituitary is called the master gland, but it takes orders from the part of the brain just above it, which links the nervous and hormone systems."
  b11_adrenaline: "Made by the adrenal medulla in emergencies."
  b11_adrenaline_chem: "Adrenaline is made from the amino acid tyrosine."
  b11_cortisol: "Cortisol comes from the adrenal cortex and is made from cholesterol."
  b11_gigantism: "Too little growth hormone causes dwarfism. Too much, before bones stop growing?"
  b11_goitre: "The thyroid makes thyroxine, which needs a mineral found in iodised salt."
  b11_insulin_receptor: "Insulin is a protein and cannot cross the lipid membrane."
  b11_negative_feedback: "Like a thermostat: when the room warms enough, the heater switches off."
  b11_pineal: "A small gland deep in the brain, sensitive to light and dark."
  b11_second_messenger: "The hormone is the first messenger at the membrane; a small molecule made inside carries the signal on."
  b11_steroid_action: "Steroids are lipids: they pass through the membrane and bind receptors that act on DNA."
concepts:
- code: cbse11b.endo.glands
  title: Endocrine glands and hormones
  notes: |
    Hormones: non-nutrient chemicals acting as intercellular messengers in trace amounts. Hypothalamus (releasing and
    inhibiting hormones). Pituitary: adenohypophysis—GH (gigantism, dwarfism), PRL, TSH, ACTH, LH, FSH, MSH;
    neurohypophysis—oxytocin, vasopressin (ADH). Pineal: melatonin (day–night rhythm). Thyroid: T₃, T₄ (iodine; goitre,
    cretinism, hypothyroidism, Graves' disease), thyrocalcitonin. Parathyroid: PTH raises blood Ca²⁺. Thymus: thymosins
    (immunity). Adrenal: medulla—adrenaline, noradrenaline (fight or flight); cortex—glucocorticoids (cortisol),
    mineralocorticoids (aldosterone); Addison's disease. Pancreas (islets of Langerhans): insulin (β), glucagon (α);
    diabetes mellitus. Testis: androgens; ovary: oestrogen, progesterone. Heart (ANF), kidney (erythropoietin), GI tract
    (gastrin, secretin, CCK).
  explanations:
    text: Hormones are chemical messengers carried in the blood from endocrine glands to target organs. The pituitary, controlled by the hypothalamus, directs many other glands. Insulin lowers blood sugar, adrenaline prepares us for emergencies, and thyroid hormones set our metabolic rate.
    visual: 'Draw a body outline with glands marked: hypothalamus and pituitary in the head, thyroid in the neck, adrenals on the kidneys, pancreas below the stomach, and testes or ovaries.'
    step_by_step: 'Step 1: Name the gland. Step 2: Name its hormone. Step 3: Name the effect. Step 4: Link too much or too little to a disorder.'
    real_world: Iodised salt is sold across India to prevent goitre, a swelling of the thyroid caused by too little iodine.
  picture:
    kind: compare
    columns:
    - title: Gland
      points:
      - pancreas
      - thyroid
      - adrenal medulla
      - pituitary
    - title: Hormone
      points:
      - insulin, glucagon
      - thyroxine
      - adrenaline
      - growth hormone and others
    - title: Effect
      points:
      - blood sugar control
      - metabolic rate
      - fight or flight
      - growth, controls other glands
    alt: Major endocrine glands, their hormones and effects.
  activity:
    type: sort
    prompt: Which gland makes this hormone?
    bins:
    - Hypothalamus
    - Pituitary
    - Thyroid
    - Adrenal
    - Pancreas
    items:
    - label: GnRH (releases gonadotrophins)
      bin: Hypothalamus
      clue: Which part of the brain sends 'releasing' hormones to the pituitary?
      why: GnRH comes from the hypothalamus.
    - label: Growth hormone
      bin: Pituitary
      clue: Which 'master gland' controls growth?
      why: The anterior pituitary.
    - label: TSH (thyroid-stimulating hormone)
      bin: Pituitary
      clue: Which gland tells the thyroid what to do?
      why: TSH comes from the pituitary.
    - label: Thyroxine
      bin: Thyroid
      clue: Which iodine-using gland in the neck?
      why: The thyroid.
    - label: Thyrocalcitonin
      bin: Thyroid
      clue: Which neck gland lowers blood calcium?
      why: The thyroid.
    - label: Adrenaline
      bin: Adrenal
      clue: The 'fight or flight' hormone comes from which gland's medulla?
      why: The adrenal medulla.
    - label: Cortisol
      bin: Adrenal
      clue: A stress glucocorticoid from which cortex?
      why: The adrenal cortex.
    - label: Aldosterone
      bin: Adrenal
      clue: It saves Na⁺ in the kidney. Which gland?
      why: The adrenal cortex.
    - label: Insulin
      bin: Pancreas
      clue: Which gland's β-cells lower blood sugar?
      why: The islets of Langerhans.
    - label: Glucagon
      bin: Pancreas
      clue: Which gland's α-cells raise blood sugar?
      why: The pancreas.
  items:
  - prompt: Which hormone lowers blood sugar?
    options:
    - insulin
    - glucagon
    - adrenaline
    - thyroxine
    answer: insulin
    difficulty: 1
    hints:
    - Beta cells.
    - Diabetes when low.
    solution: Insulin.
    mistakes:
      glucagon: c11b_insulin
  - prompt: 'Goitre is caused by a lack of:'
    options:
    - iodine
    - iron
    - calcium
    - vitamin C
    answer: iodine
    difficulty: 1
    hints:
    - Thyroid swells.
    - Iodised salt.
    solution: Iodine.
    mistakes: {"iron": "b11_goitre", "calcium": "b11_goitre", "vitamin C": "b11_goitre"}
  - prompt: 'The ''fight or flight'' hormone is:'
    options:
    - adrenaline
    - insulin
    - melatonin
    - oxytocin
    answer: adrenaline
    difficulty: 1
    hints:
    - Adrenal medulla.
    - Emergency.
    solution: Adrenaline.
    mistakes: {"insulin": "b11_adrenaline", "melatonin": "b11_adrenaline", "oxytocin": "b11_adrenaline"}
  - prompt: 'Too much growth hormone in childhood causes:'
    options:
    - gigantism
    - dwarfism
    - cretinism
    - goitre
    answer: gigantism
    difficulty: 2
    hints:
    - Very tall.
    - Pituitary.
    solution: Gigantism.
    mistakes: {"dwarfism": "b11_gigantism", "cretinism": "b11_gigantism", "goitre": "b11_gigantism"}
  - prompt: Which gland controls the pituitary?
    options:
    - hypothalamus
    - thyroid
    - adrenal
    - pineal
    answer: hypothalamus
    difficulty: 2
    hints:
    - Releasing hormones.
    - Above the pituitary.
    solution: The hypothalamus.
    mistakes:
      thyroid: c11b_master
  - prompt: 'Melatonin, which regulates sleep–wake cycles, is made by the:'
    options:
    - pineal gland
    - thymus
    - parathyroid
    - pancreas
    answer: pineal gland
    difficulty: 2
    hints:
    - Day–night rhythm.
    - In the brain.
    solution: The pineal gland.
    mistakes: {"thymus": "b11_pineal", "parathyroid": "b11_pineal", "pancreas": "b11_pineal"}
- code: cbse11b.endo.action
  title: How hormones act
  after:
  - cbse11b.endo.glands
  notes: |
    Hormone receptors: on the membrane (for protein/peptide hormones and amines, e.g. insulin, adrenaline) or inside the
    cell (for steroid hormones and iodothyronines, e.g. cortisol, oestrogen, thyroxine). Membrane-bound receptors use second
    messengers (cyclic AMP, IP₃, Ca²⁺) for biochemical changes; intracellular receptors form hormone–receptor complexes that
    regulate gene expression. Chemical classes: peptides/proteins (insulin, glucagon, pituitary hormones), steroids
    (cortisol, testosterone, oestrogen, progesterone), iodothyronines (thyroid hormones), amino-acid derivatives
    (adrenaline, noradrenaline). Feedback regulation (negative feedback keeps hormone levels steady).
  explanations:
    text: Hormones work only on cells with the right receptor. Protein hormones can't enter cells, so they bind outside and trigger a second messenger inside. Steroid hormones pass through the membrane and act on genes directly.
    visual: 'Draw two cells: one with insulin docking on the surface and a second messenger (cAMP) carrying the signal inside; one with a steroid passing through the membrane to a receptor in the nucleus.'
    step_by_step: 'Step 1: Identify the hormone''s chemical type. Step 2: Protein → membrane receptor and second messenger. Step 3: Steroid or thyroid → intracellular receptor and gene action.'
    real_world: Many sports drugs are steroid hormones; they act on genes, which is why their effects last long and can harm health.
  picture:
    kind: flow
    steps:
    - Hormone binds membrane receptor
    - Second messenger (cAMP) made
    - Enzymes activated
    - Cell response
    alt: How a protein hormone acts through a membrane receptor and a second messenger.
  activity:
    type: sort
    prompt: Where does each hormone's receptor sit?
    bins:
    - On the cell membrane
    - Inside the cell
    items:
    - label: Insulin
      bin: On the cell membrane
      clue: It's a protein. Can it pass through the fatty membrane?
      why: Protein hormones bind membrane receptors and work through second messengers.
    - label: Glucagon
      bin: On the cell membrane
      clue: A peptide. Can it enter the cell?
      why: It binds a membrane receptor and raises cAMP.
    - label: FSH
      bin: On the cell membrane
      clue: A glycoprotein. Water-soluble or fat-soluble?
      why: 'A large water-soluble hormone: membrane receptor.'
    - label: Adrenaline
      bin: On the cell membrane
      clue: An amine. Does it use cAMP as a second messenger?
      why: Adrenaline binds membrane receptors.
    - label: Cortisol
      bin: Inside the cell
      clue: A steroid. Can fat-soluble molecules cross the membrane?
      why: Steroids pass the membrane and bind receptors inside.
    - label: Testosterone
      bin: Inside the cell
      clue: A steroid. Where can it go?
      why: Inside the cell, to affect genes.
    - label: Oestradiol
      bin: Inside the cell
      clue: A steroid. Can it cross the membrane?
      why: Intracellular receptor.
    - label: Thyroxine
      bin: Inside the cell
      clue: An iodothyronine that acts on genes. Where is its receptor?
      why: Thyroid hormones bind receptors in the nucleus.
  items:
  - prompt: 'Insulin binds to receptors:'
    options:
    - on the cell membrane
    - inside the nucleus
    - in mitochondria
    - it needs no receptor
    answer: on the cell membrane
    difficulty: 1
    hints:
    - Protein hormone.
    - Can't cross membrane.
    solution: On the cell membrane.
    mistakes: {"inside the nucleus": "b11_insulin_receptor", "in mitochondria": "b11_insulin_receptor", "it needs no receptor": "b11_insulin_receptor"}
  - prompt: 'Steroid hormones act mainly by:'
    options:
    - regulating gene expression
    - forming cAMP at the membrane
    - breaking down glucose directly
    - blocking nerves
    answer: regulating gene expression
    difficulty: 2
    hints:
    - Pass through the membrane.
    - Hormone–receptor complex.
    solution: Regulating genes.
    mistakes: {"forming cAMP at the membrane": "b11_steroid_action", "breaking down glucose directly": "b11_steroid_action", "blocking nerves": "b11_steroid_action"}
  - prompt: Which is a common second messenger?
    options:
    - cyclic AMP
    - glucose
    - ATP synthase
    - haemoglobin
    answer: cyclic AMP
    difficulty: 1
    hints:
    - cAMP.
    - Inside the cell.
    solution: Cyclic AMP.
    mistakes: {"glucose": "b11_second_messenger", "ATP synthase": "b11_second_messenger", "haemoglobin": "b11_second_messenger"}
  - prompt: 'Cortisol is a:'
    options:
    - steroid hormone
    - peptide hormone
    - amino-acid derivative
    - iodothyronine
    answer: steroid hormone
    difficulty: 2
    hints:
    - Adrenal cortex.
    - From cholesterol.
    solution: A steroid hormone.
    mistakes: {"peptide hormone": "b11_cortisol", "amino-acid derivative": "b11_cortisol", "iodothyronine": "b11_cortisol"}
  - prompt: 'Adrenaline is chemically an:'
    options:
    - amino-acid derivative
    - steroid
    - iodothyronine
    - fatty acid
    answer: amino-acid derivative
    difficulty: 2
    hints:
    - From tyrosine.
    - Catecholamine.
    solution: An amino-acid derivative.
    mistakes: {"steroid": "b11_adrenaline_chem", "iodothyronine": "b11_adrenaline_chem", "fatty acid": "b11_adrenaline_chem"}
  - prompt: 'Negative feedback in hormone control means:'
    options:
    - a rise in a hormone's effect reduces its further release
    - hormones keep rising
    - glands stop working
    - hormones change into nerves
    answer: a rise in a hormone's effect reduces its further release
    difficulty: 2
    hints:
    - Like a thermostat.
    - Keeps levels steady.
    solution: The response switches off further release.
    mistakes: {"hormones keep rising": "b11_negative_feedback", "glands stop working": "b11_negative_feedback", "hormones change into nerves": "b11_negative_feedback"}
