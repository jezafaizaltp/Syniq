# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-bio
chapter: 7
title: Structural Organisation in Animals
tips:
  c11b_tissue: 'Four animal tissues: epithelial (covering), connective (support and link), muscular (movement), neural (control).'
  c11b_frog: "On land a frog uses lungs. Buried in mud during hibernation, it can't use its lungs, so it uses another moist surface that gases can cross."
  b11_alveoli_lining: "Gases must cross the alveolar wall fast. Which epithelium is thinnest, one flat layer?"
  b11_cardiac: "Intercalated discs connect cells so the whole organ beats together. Which organ beats?"
  b11_frog_excretion: "Tadpoles excrete ammonia; adult frogs on land convert it to a less toxic waste."
  b11_frog_fert: "Frogs lay eggs in water and the male releases sperm over them."
  b11_frog_nerves: "Humans have 12 pairs of cranial nerves; frogs have fewer."
  b11_gap_junction: "Gap junctions are tiny channels between neighbouring cells. What can pass through a channel?"
  b11_nictitating: "The nictitating membrane is a third eyelid that keeps something moist underwater."
  b11_tendon: "Ligaments hold bone to bone. Tendons let a muscle pull on what?"
  b11_tissue_types: "Epithelial, connective, muscular, neural. Count."
concepts:
- code: cbse11b.org.tissues
  title: Animal tissues
  notes: |
    Tissue: group of similar cells with a common function. Epithelial: simple (squamous—air sacs, blood vessels; cuboidal
    —kidney tubules, glands; columnar—stomach, intestine; ciliated) and compound (stratified, skin; protection); glands
    (exocrine, endocrine); cell junctions (tight, adhering, gap). Connective: loose (areolar, adipose), dense (tendons,
    ligaments), specialised (cartilage, bone, blood). Muscle: skeletal (striated, voluntary), smooth (unstriated,
    involuntary), cardiac (striated, involuntary, intercalated discs). Neural tissue: neurons, neuroglia.
  explanations:
    text: Animal bodies are built from four kinds of tissue. Epithelium covers and lines surfaces; connective tissue joins and supports (bone, blood, fat); muscle moves things; nervous tissue carries messages.
    visual: 'Draw three muscle cells: long striped fibres (skeletal), spindle-shaped without stripes (smooth), and branched striped cells joined by discs (cardiac).'
    step_by_step: 'Step 1: Covering or lining? Epithelium. Step 2: Support or binding, with lots of matrix? Connective. Step 3: Contracts? Muscle. Step 4: Carries impulses? Neural.'
    real_world: Tendons, which join muscle to bone, are dense connective tissue; a torn Achilles tendon takes months to heal.
  picture:
    kind: compare
    columns:
    - title: Muscle
      points:
      - skeletal
      - smooth
      - cardiac
    - title: Stripes
      points:
      - 'yes'
      - 'no'
      - 'yes'
    - title: Control
      points:
      - voluntary
      - involuntary
      - involuntary
    alt: Three kinds of muscle compared by stripes and control.
  activity:
    type: sort
    prompt: Which of the four animal tissues is it?
    bins:
    - Epithelial
    - Connective
    - Muscle
    - Neural
    items:
    - label: Lining of blood vessels
      bin: Epithelial
      clue: Is it a thin covering layer?
      why: Squamous epithelium lines blood vessels.
    - label: Inner lining of the stomach
      bin: Epithelial
      clue: Does it line a surface and secrete?
      why: Columnar epithelium lines the stomach.
    - label: Outer layer of the skin
      bin: Epithelial
      clue: Many layers protecting a surface. Which tissue?
      why: Compound (stratified) epithelium.
    - label: Blood
      bin: Connective
      clue: Cells in a fluid matrix that link body parts. Which tissue?
      why: Blood is a fluid connective tissue.
    - label: Cartilage
      bin: Connective
      clue: Cells in a firm matrix. Which tissue?
      why: A specialised connective tissue.
    - label: Tendon
      bin: Connective
      clue: It joins muscle to bone with collagen fibres. Which tissue?
      why: Dense regular connective tissue.
    - label: Bone
      bin: Connective
      clue: Hard matrix of calcium salts, with cells. Which tissue?
      why: A specialised connective tissue.
    - label: Biceps
      bin: Muscle
      clue: Does it contract to move a bone?
      why: Skeletal muscle.
    - label: Wall of the heart
      bin: Muscle
      clue: It contracts all life long without tiring. Which tissue?
      why: Cardiac muscle.
    - label: Wall of the intestine (moving food along)
      bin: Muscle
      clue: Which tissue squeezes food along?
      why: Smooth muscle in the intestine wall.
    - label: Neuroglia
      bin: Neural
      clue: These cells support and protect neurons. Which tissue?
      why: Neuroglia are part of neural tissue.
    - label: Neuron
      bin: Neural
      clue: It carries impulses. Which tissue?
      why: The unit of neural tissue.
  items:
  - prompt: How many basic types of animal tissue are there?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Epithelial, connective, muscular, neural.
    - Count.
    solution: Four.
    mistakes: {"3": "b11_tissue_types", "5": "b11_tissue_types"}
  - prompt: 'Blood is a type of:'
    options:
    - connective tissue
    - epithelial tissue
    - muscular tissue
    - neural tissue
    answer: connective tissue
    difficulty: 2
    hints:
    - Fluid matrix (plasma).
    - Specialised connective.
    solution: Connective tissue.
    mistakes:
      epithelial tissue: c11b_tissue
  - prompt: Which muscle has intercalated discs?
    options:
    - cardiac
    - skeletal
    - smooth
    - all of them
    answer: cardiac
    difficulty: 2
    hints:
    - Heart.
    - Cells beat together.
    solution: Cardiac muscle.
    mistakes: {"skeletal": "b11_cardiac", "smooth": "b11_cardiac", "all of them": "b11_cardiac"}
  - prompt: 'Tendons connect:'
    options:
    - muscle to bone
    - bone to bone
    - skin to muscle
    - nerve to muscle
    answer: muscle to bone
    difficulty: 1
    hints:
    - 'Ligaments: bone to bone.'
    - Pulls bone.
    solution: Muscle to bone.
    mistakes: {"bone to bone": "b11_tendon", "skin to muscle": "b11_tendon", "nerve to muscle": "b11_tendon"}
  - prompt: 'The air sacs of lungs are lined by:'
    options:
    - simple squamous epithelium
    - stratified epithelium
    - columnar epithelium
    - cartilage
    answer: simple squamous epithelium
    difficulty: 2
    hints:
    - Thin for diffusion.
    - Flat cells.
    solution: Simple squamous epithelium.
    mistakes: {"stratified epithelium": "b11_alveoli_lining", "columnar epithelium": "b11_alveoli_lining", "cartilage": "b11_alveoli_lining"}
  - prompt: 'Gap junctions allow:'
    options:
    - cells to share ions and small molecules
    - cells to stick tightly
    - blood to flow
    - muscles to contract
    answer: cells to share ions and small molecules
    difficulty: 2
    hints:
    - Channels between cells.
    - Communication.
    solution: Fast communication between cells.
    mistakes: {"cells to stick tightly": "b11_gap_junction", "blood to flow": "b11_gap_junction", "muscles to contract": "b11_gap_junction"}
- code: cbse11b.org.frog
  title: 'Frog: morphology and organ systems'
  after:
  - cbse11b.org.tissues
  notes: |
    Frog (Rana tigrina, now Hoplobatrachus tigerinus): poikilotherm, camouflage, hibernation/aestivation. Morphology: head
    and trunk, moist slimy skin, webbed hind limbs, nictitating membrane, tympanum. Digestive: short alimentary canal
    (carnivore), bilobed tongue. Respiration: cutaneous in water, pulmonary on land, buccal cavity. Circulation: closed,
    three-chambered heart (2 atria, 1 ventricle), sinus venosus, conus arteriosus; hepatic and renal portal systems.
    Excretion: kidneys, ureotelic (urea). Nervous system: brain, 10 pairs of cranial nerves. Reproduction: external
    fertilisation in water, tadpole metamorphosis. Uses: eat insects, frog legs as food.
  explanations:
    text: The frog is a model animal for studying organ systems. It is cold-blooded, breathes through its skin in water and with lungs on land, has a three-chambered heart, and its eggs become tadpoles that change into frogs.
    visual: 'Draw the frog life cycle: eggs in water → tadpole with gills and tail → tadpole with legs → young frog → adult frog.'
    step_by_step: 'Step 1: Note the frog''s habitat (land and water). Step 2: Link each organ system to how it fits that life. Step 3: Compare with humans (frog: 3 chambers, external fertilisation).'
    real_world: Frogs eat huge numbers of insects, so they help farmers by controlling crop pests.
  picture:
    kind: flow
    steps:
    - Eggs in water
    - Tadpole (gills, tail)
    - Legs grow
    - Tail absorbed
    - Adult frog (lungs)
    alt: Frog metamorphosis from eggs to tadpole to adult.
  activity:
    type: sort
    prompt: Which organ system of the frog does each part belong to?
    bins:
    - Digestive
    - Respiratory
    - Circulatory
    - Excretory
    - Nervous
    items:
    - label: Liver and gall bladder
      bin: Digestive
      clue: They make and store bile. Which system?
      why: 'Bile helps digest fat: digestive.'
    - label: Lungs
      bin: Respiratory
      clue: Used for breathing on land. Which system?
      why: Respiratory.
    - label: Moist skin, in water
      bin: Respiratory
      clue: In water, how does a frog take in oxygen?
      why: 'Gases pass through its moist skin: cutaneous respiration.'
    - label: Three-chambered heart
      bin: Circulatory
      clue: It pumps blood. Which system?
      why: 'Circulatory: two atria and one ventricle.'
    - label: Sinus venosus
      bin: Circulatory
      clue: A chamber that joins the right atrium. Which system?
      why: 'Circulatory: it collects blood for the heart.'
    - label: Hepatic portal system
      bin: Circulatory
      clue: Veins carrying blood from the gut to the liver. Which system?
      why: Circulatory.
    - label: Kidneys
      bin: Excretory
      clue: They filter waste from blood. Which system?
      why: 'Excretory: frogs pass urea.'
    - label: Urinary bladder
      bin: Excretory
      clue: It stores urine. Which system?
      why: Excretory.
    - label: Ten pairs of cranial nerves
      bin: Nervous
      clue: Nerves from the brain. Which system?
      why: Nervous.
    - label: Medulla oblongata
      bin: Nervous
      clue: Part of the brain. Which system?
      why: Nervous.
  items:
  - prompt: How many chambers does a frog's heart have?
    answer: '3'
    check: 2+1
    difficulty: 1
    hints:
    - 2 atria + 1 ventricle.
    - Amphibian.
    solution: '3.'
    mistakes: {"2": "b11_heart_chambers", "4": "b11_heart_chambers"}
  - prompt: How many pairs of cranial nerves does a frog have?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - Fewer than humans (12).
    - Ten.
    solution: 10 pairs.
    mistakes: {"12": "b11_frog_nerves", "31": "b11_frog_nerves"}
  - prompt: 'During hibernation, a frog breathes through its:'
    options:
    - skin
    - lungs
    - gills
    - mouth only
    answer: skin
    difficulty: 1
    hints:
    - Cutaneous respiration.
    - Moist skin.
    solution: Skin.
    mistakes:
      lungs: c11b_frog
  - prompt: 'Frogs excrete nitrogen mainly as:'
    options:
    - urea
    - ammonia
    - uric acid
    - amino acids
    answer: urea
    difficulty: 2
    hints:
    - Ureotelic.
    - Adult frog.
    solution: Urea.
    mistakes: {"ammonia": "b11_frog_excretion", "uric acid": "b11_frog_excretion", "amino acids": "b11_frog_excretion"}
  - prompt: 'Fertilisation in frogs is:'
    options:
    - external, in water
    - internal
    - absent
    - by spores
    answer: external, in water
    difficulty: 1
    hints:
    - Eggs laid in water.
    - Sperm released over them.
    solution: External.
    mistakes: {"internal": "b11_frog_fert", "absent": "b11_frog_fert", "by spores": "b11_frog_fert"}
  - prompt: 'The nictitating membrane in a frog protects its:'
    options:
    - eyes
    - ears
    - nostrils
    - skin
    answer: eyes
    difficulty: 2
    hints:
    - Third eyelid.
    - Under water.
    solution: Eyes.
    mistakes: {"ears": "b11_nictitating", "nostrils": "b11_nictitating", "skin": "b11_nictitating"}
