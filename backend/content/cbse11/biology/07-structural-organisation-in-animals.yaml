# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-bio
chapter: 7
title: Structural Organisation in Animals
tips:
  c11b_tissue: 'Four animal tissues: epithelial (covering), connective (support and link), muscular (movement), neural (control).'
  c11b_frog: "On land a frog uses lungs. Buried in mud during hibernation, it can't use its lungs, so it uses another moist surface that gases can cross."
  b11_alveoli_lining: "Gases must cross the alveolar wall fast. Which epithelium is thinnest, one flat layer?"
  b11_cardiac: "Intercalated discs connect cells so the whole organ beats together. Which organ beats?"
  b11_frog_excretion: "Tadpoles excrete ammonia; adult frogs on land convert it to a less toxic waste."
  b11_frog_fert: "Frogs lay eggs in water and the male releases sperm over them."
  b11_frog_nerves: "Humans have 12 pairs of cranial nerves; frogs have fewer."
  b11_gap_junction: "Gap junctions are tiny channels between neighbouring cells. What can pass through a channel?"
  b11_nictitating: "The nictitating membrane is a third eyelid that keeps something moist underwater."
  b11_tendon: "Ligaments hold bone to bone. Tendons let a muscle pull on what?"
  b11_tissue_types: "Epithelial, connective, muscular, neural. Count."
  c11b07_tis: 'Match the tissue to its job: covering (epithelial), linking and supporting (connective), moving (muscle), signalling (neural).'
  c11b07_frog: 'Think about where the frog lives: water and land. Its skin, lungs, heart and development all fit that double life.'
concepts:
- code: cbse11b.org.tissues
  title: Animal tissues
  notes: |
    Tissue: group of similar cells with a common function. Epithelial: simple (squamous—air sacs, blood vessels; cuboidal
    —kidney tubules, glands; columnar—stomach, intestine; ciliated) and compound (stratified, skin; protection); glands
    (exocrine, endocrine); cell junctions (tight, adhering, gap). Connective: loose (areolar, adipose), dense (tendons,
    ligaments), specialised (cartilage, bone, blood). Muscle: skeletal (striated, voluntary), smooth (unstriated,
    involuntary), cardiac (striated, involuntary, intercalated discs). Neural tissue: neurons, neuroglia.
  explanations:
    text: Animal bodies are built from four kinds of tissue. Epithelium covers and lines surfaces; connective tissue joins and supports (bone, blood, fat); muscle moves things; nervous tissue carries messages.
    visual: 'Draw three muscle cells: long striped fibres (skeletal), spindle-shaped without stripes (smooth), and branched striped cells joined by discs (cardiac).'
    step_by_step: 'Step 1: Covering or lining? Epithelium. Step 2: Support or binding, with lots of matrix? Connective. Step 3: Contracts? Muscle. Step 4: Carries impulses? Neural.'
    real_world: Tendons, which join muscle to bone, are dense connective tissue; a torn Achilles tendon takes months to heal.
  picture:
    kind: compare
    columns:
    - title: Muscle
      points:
      - skeletal
      - smooth
      - cardiac
    - title: Stripes
      points:
      - 'yes'
      - 'no'
      - 'yes'
    - title: Control
      points:
      - voluntary
      - involuntary
      - involuntary
    alt: Three kinds of muscle compared by stripes and control.
  activity:
    type: sort
    prompt: Which of the four animal tissues is it?
    bins:
    - Epithelial
    - Connective
    - Muscle
    - Neural
    items:
    - label: Lining of blood vessels
      bin: Epithelial
      clue: Is it a thin covering layer?
      why: Squamous epithelium lines blood vessels.
    - label: Inner lining of the stomach
      bin: Epithelial
      clue: Does it line a surface and secrete?
      why: Columnar epithelium lines the stomach.
    - label: Outer layer of the skin
      bin: Epithelial
      clue: Many layers protecting a surface. Which tissue?
      why: Compound (stratified) epithelium.
    - label: Blood
      bin: Connective
      clue: Cells in a fluid matrix that link body parts. Which tissue?
      why: Blood is a fluid connective tissue.
    - label: Cartilage
      bin: Connective
      clue: Cells in a firm matrix. Which tissue?
      why: A specialised connective tissue.
    - label: Tendon
      bin: Connective
      clue: It joins muscle to bone with collagen fibres. Which tissue?
      why: Dense regular connective tissue.
    - label: Bone
      bin: Connective
      clue: Hard matrix of calcium salts, with cells. Which tissue?
      why: A specialised connective tissue.
    - label: Biceps
      bin: Muscle
      clue: Does it contract to move a bone?
      why: Skeletal muscle.
    - label: Wall of the heart
      bin: Muscle
      clue: It contracts all life long without tiring. Which tissue?
      why: Cardiac muscle.
    - label: Wall of the intestine (moving food along)
      bin: Muscle
      clue: Which tissue squeezes food along?
      why: Smooth muscle in the intestine wall.
    - label: Neuroglia
      bin: Neural
      clue: These cells support and protect neurons. Which tissue?
      why: Neuroglia are part of neural tissue.
    - label: Neuron
      bin: Neural
      clue: It carries impulses. Which tissue?
      why: The unit of neural tissue.
  lesson:
    - teach: 'A tissue is a group of similar cells doing one job. Animals have four basic kinds: epithelial (covering and lining), connective (linking and support), muscle (movement) and neural (signals).'
      check:
        prompt: The lining of the stomach is which kind of tissue?
        options:
        - epithelial
        - connective
        - neural
        answer: epithelial
        why: It lines a surface.
      ways:
      - style: visual
        teach: The four basic animal tissues and what each one does.
        picture:
          kind: compare
          columns:
          - title: Epithelial, connective
            points:
            - 'epithelial: covers and lines'
            - 'connective: links and supports'
          - title: Muscle, neural
            points:
            - 'muscle: contracts to move'
            - 'neural: carries signals'
          alt: Epithelial tissue covers and lines, connective tissue links and supports, muscle tissue contracts and neural tissue carries signals.
      - style: real_world
        teach: 'Pick up a pen and all four tissues work at once: skin epithelium covers your hand, tendons and bone (connective) hold the fingers, muscles pull them, and nerves carry the command from your brain.'
    - teach: 'Epithelia: simple squamous (thin, flat; air sacs, blood vessels), cuboidal (kidney tubules, glands), columnar (intestine), ciliated (windpipe), compound/stratified (skin, protection). Cells are joined by tight, adhering and gap junctions.'
      check:
        prompt: 'Many layers of cells that protect against wear, as in skin, form:'
        options:
        - compound (stratified) epithelium
        - simple squamous
        - cuboidal
        answer: compound (stratified) epithelium
        why: Several layers give protection.
      ways:
      - style: visual
        teach: Simple epithelia by cell shape, with where each is found.
        picture:
          kind: compare
          columns:
          - title: Squamous
            points:
            - flat, thin cells
            - air sacs, blood vessel walls
          - title: Cuboidal
            points:
            - cube-shaped cells
            - kidney tubules, glands
          - title: Columnar
            points:
            - tall cells
            - stomach and intestine lining
          alt: Flat squamous cells line air sacs and blood vessels; cube-shaped cuboidal cells line kidney tubules and glands; tall columnar cells line the stomach and intestine.
      - style: step_by_step
        teach: 'Step 1: Ask what the lining must do. Step 2: Let gases pass easily → thin flat squamous. Step 3: Absorb or secrete → cuboidal or columnar, often with microvilli. Step 4: Move mucus → ciliated. Step 5: Resist rubbing → many layers (stratified), as in skin.'
    - teach: 'Connective tissues: loose (areolar, adipose), dense (tendons link muscle to bone; ligaments link bone to bone) and specialised (cartilage, bone, blood). Muscles: skeletal (striped, voluntary), smooth (unstriped, involuntary), cardiac (striped, involuntary, intercalated discs).'
      picture:
        kind: compare
        columns:
        - title: Muscle
          points:
          - skeletal
          - smooth
          - cardiac
        - title: Striped? Voluntary?
          points:
          - yes, yes
          - no, no
          - yes, no
        alt: The three kinds of muscle compared.
      check:
        prompt: 'Ligaments join:'
        options:
        - bone to bone
        - muscle to bone
        - skin to muscle
        answer: bone to bone
        why: Tendons join muscle to bone.
      ways:
      - style: step_by_step
        teach: 'Step 1: Look at the stripes. None → smooth muscle. Step 2: Striped and branched with intercalated discs → cardiac. Step 3: Striped, long, many nuclei → skeletal. Step 4: Ask if you control it: only skeletal muscle is voluntary.'
      - style: real_world
        teach: When you sprain an ankle, a ligament (bone to bone) is stretched. A pulled heel cord is a tendon (muscle to bone). Your ear flap bends and springs back because it is cartilage, not bone.
  items:
  - prompt: How many basic types of animal tissue are there?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Epithelial, connective, muscular, neural.
    - Count.
    solution: Four.
    mistakes: {"3": "b11_tissue_types", "5": "b11_tissue_types"}
  - prompt: 'Blood is a type of:'
    options:
    - connective tissue
    - epithelial tissue
    - muscular tissue
    - neural tissue
    answer: connective tissue
    difficulty: 2
    hints:
    - Fluid matrix (plasma).
    - Specialised connective.
    solution: Connective tissue.
    mistakes:
      epithelial tissue: c11b_tissue
  - prompt: Which muscle has intercalated discs?
    options:
    - cardiac
    - skeletal
    - smooth
    - all of them
    answer: cardiac
    difficulty: 2
    hints:
    - Heart.
    - Cells beat together.
    solution: Cardiac muscle.
    mistakes: {"skeletal": "b11_cardiac", "smooth": "b11_cardiac", "all of them": "b11_cardiac"}
  - prompt: 'Tendons connect:'
    options:
    - muscle to bone
    - bone to bone
    - skin to muscle
    - nerve to muscle
    answer: muscle to bone
    difficulty: 1
    hints:
    - 'Ligaments: bone to bone.'
    - Pulls bone.
    solution: Muscle to bone.
    mistakes: {"bone to bone": "b11_tendon", "skin to muscle": "b11_tendon", "nerve to muscle": "b11_tendon"}
  - prompt: 'The air sacs of lungs are lined by:'
    options:
    - simple squamous epithelium
    - stratified epithelium
    - columnar epithelium
    - cartilage
    answer: simple squamous epithelium
    difficulty: 2
    hints:
    - Thin for diffusion.
    - Flat cells.
    solution: Simple squamous epithelium.
    mistakes: {"stratified epithelium": "b11_alveoli_lining", "columnar epithelium": "b11_alveoli_lining", "cartilage": "b11_alveoli_lining"}
  - prompt: 'Gap junctions allow:'
    options:
    - cells to share ions and small molecules
    - cells to stick tightly
    - blood to flow
    - muscles to contract
    answer: cells to share ions and small molecules
    difficulty: 2
    hints:
    - Channels between cells.
    - Communication.
    solution: Fast communication between cells.
    mistakes: {"cells to stick tightly": "b11_gap_junction", "blood to flow": "b11_gap_junction", "muscles to contract": "b11_gap_junction"}
  - prompt: Fat is stored in which connective tissue?
    options:
    - adipose
    - areolar
    - cartilage
    answer: adipose
    difficulty: 1
    hints:
    - Its cells are full of fat droplets.
    - It lies under the skin.
    solution: 'Step 1: fat-storing cells. Step 2: adipose.'
    mistakes:
      areolar: c11b07_tis
      cartilage: c11b07_tis
  - prompt: 'Muscles of the gut wall are:'
    options:
    - smooth
    - skeletal
    - cardiac
    answer: smooth
    difficulty: 1
    hints:
    - They work without our control.
    - They have no stripes.
    solution: 'Step 1: involuntary, unstriped. Step 2: smooth.'
    mistakes:
      skeletal: c11b07_tis
      cardiac: c11b07_tis
  - prompt: 'Kidney tubules are lined by:'
    options:
    - cuboidal epithelium
    - squamous epithelium
    - stratified epithelium
    answer: cuboidal epithelium
    difficulty: 1
    hints:
    - Cells are cube-shaped.
    - They help absorb and secrete.
    solution: 'Step 1: cube-shaped cells. Step 2: cuboidal.'
    mistakes:
      squamous epithelium: c11b07_tis
      stratified epithelium: c11b07_tis
  - prompt: 'Tight junctions mainly:'
    options:
    - stop substances leaking between cells
    - let ions pass between cells
    - glue cells loosely
    answer: stop substances leaking between cells
    difficulty: 2
    hints:
    - They seal neighbouring cells.
    - Gap junctions do the passing.
    solution: 'Step 1: they seal the gaps. Step 2: prevent leaks.'
    mistakes:
      let ions pass between cells: c11b07_tis
      glue cells loosely: c11b07_tis
  - prompt: 'Salivary glands, which pour their product through ducts, are:'
    options:
    - exocrine glands
    - endocrine glands
    - neural tissue
    answer: exocrine glands
    difficulty: 2
    hints:
    - Exo means outside.
    - Endocrine glands release into blood with no duct.
    solution: 'Step 1: ducted. Step 2: exocrine.'
    mistakes:
      endocrine glands: c11b07_tis
      neural tissue: c11b07_tis
  - prompt: 'Cells that support and protect neurons are called:'
    options:
    - neuroglia
    - osteocytes
    - chondrocytes
    answer: neuroglia
    difficulty: 2
    hints:
    - Glia means glue.
    - They make up more than half of neural tissue.
    solution: 'Step 1: support cells in nervous tissue. Step 2: neuroglia.'
    mistakes:
      osteocytes: c11b07_tis
      chondrocytes: c11b07_tis
  - prompt: The windpipe is lined by which epithelium that sweeps mucus?
    options:
    - ciliated
    - squamous
    - keratinised
    answer: ciliated
    difficulty: 2
    hints:
    - Tiny hair-like structures beat together.
    - They move particles away.
    solution: 'Step 1: cilia move mucus. Step 2: ciliated epithelium.'
    mistakes:
      squamous: c11b07_tis
      keratinised: c11b07_tis
  - prompt: 'Bone is hard because its matrix contains:'
    options:
    - calcium salts and collagen
    - only fat
    - only water
    answer: calcium salts and collagen
    difficulty: 3
    hints:
    - Think of what milk builds.
    - Fibres give it some toughness.
    solution: 'Step 1: calcium salts make it hard. Step 2: collagen adds strength.'
    mistakes:
      only fat: c11b07_tis
      only water: c11b07_tis
  - prompt: 'Intercalated discs let cardiac muscle cells:'
    options:
    - contract together as one unit
    - contract voluntarily
    - store fat
    answer: contract together as one unit
    difficulty: 3
    hints:
    - They link neighbouring cells.
    - The heart must beat in step.
    solution: 'Step 1: junctions join the cells. Step 2: they contract together.'
    mistakes:
      contract voluntarily: c11b07_tis
      store fat: c11b07_tis
  - prompt: 'Assertion (A): Cardiac muscle never tires the way skeletal muscle does.

      Reason (R): Cardiac muscle cells are joined by intercalated discs.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, but R does not explain A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true, but the discs help the cells beat together; they do not explain why the heart resists fatigue. So R does not explain A.
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Blood is a connective tissue.

      Reason (R): Blood has cells in a fluid matrix and links distant parts of the body.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Cells in a matrix that connect organs is what connective tissue means, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A tissue sample has cells with stripes and many nuclei per cell, and the person can move it at will. Which tissue is it?'
    options:
    - Skeletal muscle
    - Cardiac muscle
    - Smooth muscle
    answer: Skeletal muscle
    hints:
    - Which muscle types are striped?
    - Which one can you control?
    solution: Striped, many-nucleated and voluntary describes skeletal muscle.
    mistakes:
      Cardiac muscle: c11b07_tis
      Smooth muscle: c11b07_tis
    exam: case
    difficulty: 2
  - prompt: 'Situation: A doctor needs a lining that lets oxygen pass very fast from air to blood. Which epithelium is best suited?'
    options:
    - Simple squamous
    - Stratified squamous
    - Simple columnar
    answer: Simple squamous
    hints:
    - Thinner lining means a shorter path.
    - Is one layer or many layers better for passing gases?
    solution: A single layer of flat cells gives the shortest path, which is why it lines the air sacs.
    mistakes:
      Stratified squamous: c11b_tissue
      Simple columnar: c11b07_tis
    exam: competency
    difficulty: 2
- code: cbse11b.org.frog
  title: 'Frog: morphology and organ systems'
  after:
  - cbse11b.org.tissues
  notes: |
    Frog (Rana tigrina, now Hoplobatrachus tigerinus): poikilotherm, camouflage, hibernation/aestivation. Morphology: head
    and trunk, moist slimy skin, webbed hind limbs, nictitating membrane, tympanum. Digestive: short alimentary canal
    (carnivore), bilobed tongue. Respiration: cutaneous in water, pulmonary on land, buccal cavity. Circulation: closed,
    three-chambered heart (2 atria, 1 ventricle), sinus venosus, conus arteriosus; hepatic and renal portal systems.
    Excretion: kidneys, ureotelic (urea). Nervous system: brain, 10 pairs of cranial nerves. Reproduction: external
    fertilisation in water, tadpole metamorphosis. Uses: eat insects, frog legs as food.
  explanations:
    text: The frog is a model animal for studying organ systems. It is cold-blooded, breathes through its skin in water and with lungs on land, has a three-chambered heart, and its eggs become tadpoles that change into frogs.
    visual: 'Draw the frog life cycle: eggs in water → tadpole with gills and tail → tadpole with legs → young frog → adult frog.'
    step_by_step: 'Step 1: Note the frog''s habitat (land and water). Step 2: Link each organ system to how it fits that life. Step 3: Compare with humans (frog: 3 chambers, external fertilisation).'
    real_world: Frogs eat huge numbers of insects, so they help farmers by controlling crop pests.
  picture:
    kind: flow
    steps:
    - Eggs in water
    - Tadpole (gills, tail)
    - Legs grow
    - Tail absorbed
    - Adult frog (lungs)
    alt: Frog metamorphosis from eggs to tadpole to adult.
  activity:
    type: sort
    prompt: Which organ system of the frog does each part belong to?
    bins:
    - Digestive
    - Respiratory
    - Circulatory
    - Excretory
    - Nervous
    items:
    - label: Liver and gall bladder
      bin: Digestive
      clue: They make and store bile. Which system?
      why: 'Bile helps digest fat: digestive.'
    - label: Lungs
      bin: Respiratory
      clue: Used for breathing on land. Which system?
      why: Respiratory.
    - label: Moist skin, in water
      bin: Respiratory
      clue: In water, how does a frog take in oxygen?
      why: 'Gases pass through its moist skin: cutaneous respiration.'
    - label: Three-chambered heart
      bin: Circulatory
      clue: It pumps blood. Which system?
      why: 'Circulatory: two atria and one ventricle.'
    - label: Sinus venosus
      bin: Circulatory
      clue: A chamber that joins the right atrium. Which system?
      why: 'Circulatory: it collects blood for the heart.'
    - label: Hepatic portal system
      bin: Circulatory
      clue: Veins carrying blood from the gut to the liver. Which system?
      why: Circulatory.
    - label: Kidneys
      bin: Excretory
      clue: They filter waste from blood. Which system?
      why: 'Excretory: frogs pass urea.'
    - label: Urinary bladder
      bin: Excretory
      clue: It stores urine. Which system?
      why: Excretory.
    - label: Ten pairs of cranial nerves
      bin: Nervous
      clue: Nerves from the brain. Which system?
      why: Nervous.
    - label: Medulla oblongata
      bin: Nervous
      clue: Part of the brain. Which system?
      why: Nervous.
  lesson:
    - teach: 'The Indian bullfrog is cold-blooded (poikilotherm): its body temperature follows the surroundings. It hides from extreme cold (hibernation) and heat (aestivation) and changes colour to blend in.'
      check:
        prompt: 'Summer sleep in frogs is called:'
        options:
        - aestivation
        - hibernation
        - metamorphosis
        answer: aestivation
        why: Hibernation is winter sleep.
      ways:
      - style: visual
        teach: How a frog copes with very cold and very hot seasons.
        picture:
          kind: compare
          columns:
          - title: Hibernation
            points:
            - winter sleep
            - buried in mud
            - breathes through skin
          - title: Aestivation
            points:
            - summer sleep
            - hides from heat and dryness
            - body processes slow down
          alt: In winter a frog hibernates buried in mud, breathing through its skin; in hot dry summers it aestivates, slowing its body processes.
      - style: real_world
        teach: Frogs vanish in the dry months before the monsoon and then suddenly croak loudly after the first heavy rain in Kerala. They spent the heat dormant under damp ground and come out to breed in the new pools.
    - teach: Frogs breathe through the skin in water and with lungs on land. The heart has three chambers (two atria, one ventricle) plus a sinus venosus and conus arteriosus. They excrete urea.
      check:
        prompt: 'Breathing through the skin is called:'
        options:
        - cutaneous respiration
        - pulmonary respiration
        - buccal respiration
        answer: cutaneous respiration
        why: Cutis means skin.
      ways:
      - style: visual
        teach: The path blood takes through the chambers of a frog's heart.
        picture:
          kind: flow
          steps:
          - Body blood → sinus venosus
          - Right atrium
          - Lung and skin blood → left atrium
          - Single ventricle mixes them
          - Conus arteriosus → arteries
          alt: Body blood enters the sinus venosus and right atrium; blood from lungs and skin enters the left atrium; both pass to one ventricle and leave through the conus arteriosus.
      - style: step_by_step
        teach: 'Step 1: In water the frog takes in oxygen through moist skin. Step 2: On land, it also gulps air into its lungs through the nostrils. Step 3: Wastes are filtered by the kidneys and leave as urea. Step 4: Urine, faeces and sex cells all exit through the cloaca.'
    - teach: Frogs have 10 pairs of cranial nerves. Fertilisation is external in water; the egg grows into a tadpole that changes into an adult (metamorphosis). Frogs eat insects and help farmers.
      picture:
        kind: flow
        steps:
        - Eggs in water
        - Tadpole with gills
        - Legs grow, tail shrinks
        - Adult frog
        alt: The frog life cycle.
      check:
        prompt: 'A tadpole turning into a frog is called:'
        options:
        - metamorphosis
        - regeneration
        - budding
        answer: metamorphosis
        why: A big change in body form.
      ways:
      - style: step_by_step
        teach: 'Step 1: The female lays eggs in water and the male releases sperm over them: external fertilisation. Step 2: The egg hatches into a tadpole that breathes with gills and has a tail. Step 3: Legs grow, lungs form and the tail is absorbed. Step 4: The young frog moves to land: metamorphosis.'
      - style: real_world
        teach: In paddy fields a single frog eats many insects that would otherwise damage the crop. Fewer frogs can mean more pests and more pesticide, which is why frogs are called farmers' friends.
  items:
  - prompt: How many chambers does a frog's heart have?
    answer: '3'
    check: 2+1
    difficulty: 1
    hints:
    - 2 atria + 1 ventricle.
    - Amphibian.
    solution: '3.'
    mistakes: {"2": "b11_heart_chambers", "4": "b11_heart_chambers"}
  - prompt: How many pairs of cranial nerves does a frog have?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - Fewer than humans (12).
    - Ten.
    solution: 10 pairs.
    mistakes: {"12": "b11_frog_nerves", "31": "b11_frog_nerves"}
  - prompt: 'During hibernation, a frog breathes through its:'
    options:
    - skin
    - lungs
    - gills
    - mouth only
    answer: skin
    difficulty: 1
    hints:
    - Cutaneous respiration.
    - Moist skin.
    solution: Skin.
    mistakes:
      lungs: c11b_frog
  - prompt: 'Frogs excrete nitrogen mainly as:'
    options:
    - urea
    - ammonia
    - uric acid
    - amino acids
    answer: urea
    difficulty: 2
    hints:
    - Ureotelic.
    - Adult frog.
    solution: Urea.
    mistakes: {"ammonia": "b11_frog_excretion", "uric acid": "b11_frog_excretion", "amino acids": "b11_frog_excretion"}
  - prompt: 'Fertilisation in frogs is:'
    options:
    - external, in water
    - internal
    - absent
    - by spores
    answer: external, in water
    difficulty: 1
    hints:
    - Eggs laid in water.
    - Sperm released over them.
    solution: External.
    mistakes: {"internal": "b11_frog_fert", "absent": "b11_frog_fert", "by spores": "b11_frog_fert"}
  - prompt: 'The nictitating membrane in a frog protects its:'
    options:
    - eyes
    - ears
    - nostrils
