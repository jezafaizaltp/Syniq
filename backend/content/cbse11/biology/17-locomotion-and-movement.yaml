# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 17. Format: content/README.md.
subject: cbse11-bio
chapter: 17
title: Locomotion and Movement
tips:
  c11b_bones: "A newborn has about 300 bones, many of which fuse. The adult count is 80 axial + 126 appendicular: add them."
  c11b_sliding: "In contraction the filaments slide, so the bands made only of thin or only of thick filaments shorten. The band set by the full length of the thick myosin filaments doesn't change."
  b11_cervical: "Nearly all mammals, even giraffes, share the same number of neck vertebrae."
  b11_cilia_egg: "Cilia line the tube that carries the egg from ovary to uterus."
  b11_gout: "Gout links to purine-rich food and a nitrogen waste that crystallises in joints."
  b11_knee: "The knee bends one way only, like a door."
  b11_myoglobin: "Haemoglobin is in blood. The red oxygen-storing pigment inside muscle is its cousin."
  b11_ribs: "Humans have a dozen pairs of ribs."
  b11_sarcomere: "The unit between two Z lines that shortens during contraction."
  b11_sr: "Muscle ER has a special name: sarco- (flesh) + plasmic reticulum."
  b11_tetany: "Muscles need a mineral, also used for clotting, to work properly."
  b11_troponin: "Calcium binds a regulatory protein on the thin filament, which moves tropomyosin off actin's binding sites."
  c11b17_muscle: 'Picture the sarcomere: thin actin filaments slide over thick myosin. Bands with only actin shrink; the myosin band does not.'
  c11b17_bone: "Count bones region by region: the cranium and face, then the vertebrae, ribs, sternum, limbs and girdles. Recall each region's own count."
concepts:
- code: cbse11b.move.muscle
  title: Types of movement and muscle contraction
  notes: |
    Movement types: amoeboid (pseudopodia, macrophages), ciliary (trachea, fallopian tube), muscular. Muscle: skeletal,
    visceral, cardiac. Skeletal muscle structure: fascicles, muscle fibres (syncytial), sarcolemma, sarcoplasmic
    reticulum (Ca²⁺ store), myofibrils with sarcomeres (Z line to Z line); light I band (actin), dark A band (myosin), H
    zone. Contractile proteins: actin (thin, with troponin and tropomyosin), myosin (thick, heads with ATPase). Sliding
    filament theory: nerve signal → acetylcholine → action potential → Ca²⁺ released → binds troponin → myosin heads bind
    actin, cross-bridges, power stroke using ATP. Red (myoglobin, aerobic) and white fibres.
  explanations:
    text: Muscles contract when thin actin filaments slide over thick myosin filaments, pulled by myosin heads that use ATP. A nerve signal releases calcium, which unlocks the actin so myosin can grab it.
    visual: 'Draw a sarcomere: Z lines at each end, actin attached to them, myosin in the middle. On contraction, the actin slides inward, the Z lines come closer and the light bands shrink.'
    step_by_step: 'Step 1: Nerve signal arrives. Step 2: Calcium is released from the sarcoplasmic reticulum. Step 3: Myosin binds actin and pulls (ATP). Step 4: Calcium is pumped back; muscle relaxes.'
    real_world: After death, ATP runs out and myosin can't let go of actin, causing the stiffness called rigor mortis.
  picture:
    kind: flow
    steps:
    - Nerve impulse
    - Acetylcholine released
    - Ca²⁺ released
    - Myosin binds actin
    - Filaments slide, muscle shortens
    alt: Steps of muscle contraction from nerve impulse to sliding filaments.
  activity:
    type: order
    prompt: Put the steps of a skeletal muscle contraction in order.
    steps:
    - A nerve impulse reaches the neuromuscular junction
    - Acetylcholine is released
    - An action potential spreads; Ca²⁺ is released
    - Ca²⁺ binds troponin, uncovering sites on actin
    - Myosin heads bind actin and pull, using ATP
    - Actin slides inward; the sarcomere shortens
    reasons:
      Acetylcholine is released: Acetylcholine is released from the nerve ending only when the impulse arrives.
      An action potential spreads; Ca²⁺ is released: The muscle fibre is excited only after acetylcholine binds to it.
      Ca²⁺ binds troponin, uncovering sites on actin: Calcium must be released first before it can bind troponin.
      Myosin heads bind actin and pull, using ATP: Myosin can't bind until the sites on actin are uncovered.
      Actin slides inward; the sarcomere shortens: The filaments slide only once the cross bridges pull.
  lesson:
    - teach: 'Three kinds of movement: amoeboid (pseudopodia, as in white blood cells), ciliary (cilia sweep mucus in the windpipe, eggs in the oviduct) and muscular (limbs, jaws).'
      check:
        prompt: 'Macrophages move by:'
        options:
        - amoeboid movement
        - ciliary movement
        - muscular movement
        answer: amoeboid movement
        why: They use pseudopodia.
      ways:
      - style: visual
        teach: Three kinds of movement in the body, with examples.
        picture:
          kind: compare
          columns:
          - title: Amoeboid
            points:
            - false feet (pseudopodia)
            - Amoeba, white blood cells
          - title: Ciliary
            points:
            - many beating cilia
            - windpipe lining, oviduct
          - title: Muscular
            points:
            - muscle contraction
            - limbs, jaws, tongue
          alt: Amoeboid movement uses pseudopodia, as in white blood cells; ciliary movement uses beating cilia, as in the windpipe; muscular movement moves limbs and jaws.
      - style: real_world
        teach: When you breathe in dust, it sticks to mucus in your windpipe and cilia sweep it up towards the throat, where you swallow or cough it out. Smoking damages these cilia, which is one reason smokers cough so much.
    - teach: A skeletal muscle fibre is full of myofibrils divided into sarcomeres (Z line to Z line). The light I band has only thin actin; the dark A band holds thick myosin. The sarcoplasmic reticulum stores Ca²⁺.
      check:
        prompt: 'The thin filaments are made of:'
        options:
        - actin
        - myosin
        - keratin
        answer: actin
        why: Myosin forms the thick filaments.
      ways:
      - style: visual
        teach: The bands of a sarcomere and what each band holds.
        picture:
          kind: compare
          columns:
          - title: I band (light)
            points:
            - thin actin only
            - Z line runs through its middle
            - shortens in contraction
          - title: A band (dark)
            points:
            - thick myosin (with some actin)
            - 'H zone in the middle: myosin only'
            - same length in contraction
          alt: The light I band has only actin and a Z line through its middle and shortens on contraction; the dark A band holds myosin, has an H zone in the middle and keeps its length.
      - style: step_by_step
        teach: 'Step 1: Zoom from muscle to fascicle (bundle) to muscle fibre (one cell). Step 2: Inside the fibre are myofibrils. Step 3: Each myofibril is a chain of sarcomeres. Step 4: Each sarcomere has overlapping thin (actin) and thick (myosin) filaments.'
    - teach: 'Sliding filament theory: a nerve releases acetylcholine, Ca²⁺ is released and binds troponin, uncovering sites on actin; myosin heads (using ATP) grab actin and pull it inwards. The I band and H zone shorten; the A band stays the same.'
      picture:
        kind: flow
        steps:
        - Nerve signal
        - Acetylcholine released
        - Ca²⁺ released from SR
        - Ca²⁺ binds troponin
        - Myosin pulls actin
        - Sarcomere shortens
        alt: Steps of muscle contraction.
      check:
        prompt: What provides energy for the myosin head to move?
        options:
        - ATP
        - glucose directly
        - calcium
        answer: ATP
        why: Myosin heads have ATPase.
      ways:
      - style: step_by_step
        teach: 'Step 1: Myosin head splits ATP and cocks back. Step 2: It binds an exposed site on actin, forming a cross-bridge. Step 3: It swings, pulling actin towards the centre (power stroke). Step 4: A new ATP releases the head and the cycle repeats while Ca²⁺ is present.'
      - style: real_world
        teach: 'A tug-of-war team pulls a rope hand over hand: each person grabs, pulls, lets go and grabs again further along. Myosin heads do the same along actin. The rope (actin) slides, but the people (myosin) stay where they are.'
  items:
  - prompt: 'The functional unit of a myofibril is the:'
    options:
    - sarcomere
    - sarcolemma
    - fascicle
    - tendon
    answer: sarcomere
    difficulty: 1
    hints:
    - Z line to Z line.
    - Repeating unit.
    solution: "The sarcomere, from one Z line to the next, is the unit that shortens in contraction."
    mistakes: {"sarcolemma": "b11_sarcomere", "fascicle": "b11_sarcomere", "tendon": "b11_sarcomere"}
  - prompt: 'Calcium is stored in muscle fibres in the:'
    options:
    - sarcoplasmic reticulum
    - nucleus
    - mitochondria
    - sarcolemma
    answer: sarcoplasmic reticulum
    difficulty: 2
    hints:
    - Special ER.
    - Released on signal.
    solution: "The sarcoplasmic reticulum stores Ca²⁺ and releases it when a nerve signal arrives."
    mistakes: {"nucleus": "b11_sr", "mitochondria": "b11_sr", "sarcolemma": "b11_sr"}
  - prompt: During contraction, which band stays the same length?
    options:
    - A band
    - I band
    - H zone
    - the whole sarcomere
    answer: A band
    difficulty: 2
    hints:
    - Myosin length.
    - It doesn't shrink.
    solution: "Actin slides over myosin; the A band is the length of the myosin filaments, so it does not change."
    mistakes:
      I band: c11b_sliding
  - prompt: 'Calcium starts contraction by binding to:'
    options:
    - troponin
    - myosin
    - actin directly
    - ATP
    answer: troponin
    difficulty: 2
    hints:
    - Moves tropomyosin.
    - Uncovers sites.
    solution: "Ca²⁺ binds troponin, which moves tropomyosin off the binding sites on actin so myosin can attach."
    mistakes: {"myosin": "b11_troponin", "actin directly": "b11_troponin", "ATP": "b11_troponin"}
  - prompt: 'Red muscle fibres are red because they contain plenty of:'
    options:
    - myoglobin
    - haemoglobin
    - melanin
    - keratin
    answer: myoglobin
    difficulty: 2
    hints:
    - Stores oxygen.
    - Aerobic.
    solution: "Red fibres contain much myoglobin, a red oxygen-storing protein, plus many mitochondria."
    mistakes: {"haemoglobin": "b11_myoglobin", "melanin": "b11_myoglobin", "keratin": "b11_myoglobin"}
  - prompt: 'Ciliary movement moves eggs along the:'
    options:
    - fallopian tube
    - oesophagus
    - blood vessels
    - bone marrow
    answer: fallopian tube
    difficulty: 1
    hints:
    - Cilia beat.
    - Also trachea.
    solution: "Cilia lining the fallopian tube beat to move the ovum towards the uterus."
    mistakes: {"oesophagus": "b11_cilia_egg", "blood vessels": "b11_cilia_egg", "bone marrow": "b11_cilia_egg"}
  - prompt: 'A sarcomere lies between two:'
    options:
    - Z lines
    - H zones
    - A bands
    answer: Z lines
    difficulty: 1
    hints:
    - They are thin dark lines in the I band.
    - One unit repeats between them.
    solution: 'Step 1: Z to Z. Step 2: Z lines.'
    mistakes:
      H zones: c11b17_muscle
      A bands: c11b17_muscle
  - prompt: 'The cell membrane of a muscle fibre is called the:'
    options:
    - sarcolemma
    - sarcomere
    - sarcoplasm
    answer: sarcolemma
    difficulty: 1
    hints:
    - Lemma means sheath.
    - Sarcoplasm is the cytoplasm.
    solution: 'Step 1: muscle cell membrane. Step 2: sarcolemma.'
    mistakes:
      sarcomere: c11b17_muscle
      sarcoplasm: c11b17_muscle
  - prompt: Which muscle fibres are best for long, steady activity?
    options:
    - red fibres
    - white fibres
    - neither
    answer: red fibres
    difficulty: 1
    hints:
    - They have many mitochondria and myoglobin.
    - They work aerobically.
    solution: 'Step 1: aerobic, rich in myoglobin. Step 2: red fibres.'
    mistakes:
      white fibres: c11b17_muscle
      neither: c11b17_muscle
  - prompt: 'During contraction, the H zone:'
    options:
    - shortens or disappears
    - lengthens
    - stays the same
    answer: shortens or disappears
    difficulty: 2
    hints:
    - It is the middle zone with no actin overlap.
    - Actin slides into it.
    solution: 'Step 1: actin moves inwards. Step 2: H zone narrows.'
    mistakes:
      lengthens: c11b17_muscle
      stays the same: c11b17_muscle
  - prompt: 'Tropomyosin and troponin are found on the:'
    options:
    - thin (actin) filaments
    - thick (myosin) filaments
    - Z line only
    answer: thin (actin) filaments
    difficulty: 2
    hints:
    - They cover the binding sites at rest.
    - Ca²⁺ moves them aside.
    solution: 'Step 1: regulatory proteins. Step 2: on actin filaments.'
    mistakes:
      thick (myosin) filaments: c11b17_muscle
      Z line only: c11b17_muscle
  - prompt: 'When the nerve signal stops, muscle relaxes because:'
    options:
    - "Ca²⁺ is pumped back into the sarcoplasmic reticulum"
    - "actin filaments break down until the next signal"
    - "myosin disappears from the sarcomere for a while"
    answer: Ca²⁺ is pumped back into the sarcoplasmic reticulum
    difficulty: 2
    hints:
    - What started contraction?
    - Remove it and the sites are covered again.
    solution: 'Step 1: Ca²⁺ returns to store. Step 2: actin sites covered, muscle relaxes.'
    mistakes:
      "actin filaments break down until the next signal": c11b17_muscle
      "myosin disappears from the sarcomere for a while": c11b17_muscle
  - prompt: 'Each skeletal muscle fibre has many nuclei. It is called:'
    options:
    - syncytial
    - uninucleate
    - anucleate
    answer: syncytial
    difficulty: 2
    hints:
    - Many cells fused in development.
    - Shared cytoplasm, many nuclei.
    solution: 'Step 1: fused cells. Step 2: syncytium.'
    mistakes:
      uninucleate: c11b17_muscle
      anucleate: c11b17_muscle
  - prompt: A sarcomere is 2.5 μm relaxed and each I band half shortens by 0.3 μm on contraction. New sarcomere length (μm)?
    answer: '1.9'
    check: 2.5-2*0.3
    difficulty: 3
    hints:
    - Both ends shorten.
    - Subtract twice 0.3.
    solution: 'Step 1: 2.5 − 0.6. Step 2: 1.9 μm.'
    mistakes:
      '2.2': c11b17_muscle
      '1.6': c11b17_muscle
  - prompt: 'Muscles get tired in hard work mainly because:'
    options:
    - "lactic acid builds up from anaerobic breakdown of glycogen"
    - "they run out of actin, which takes days to be made again"
    - "the calcium in them is used up for good and never returns"
    answer: lactic acid builds up from anaerobic breakdown of glycogen
    difficulty: 3
    hints:
    - Oxygen supply can't keep up.
    - Glycogen is broken down without oxygen.
    solution: 'Step 1: anaerobic respiration. Step 2: lactic acid causes fatigue.'
    mistakes:
      "they run out of actin, which takes days to be made again": c11b17_muscle
      "the calcium in them is used up for good and never returns": c11b17_muscle
  - prompt: 'Assertion (A): During muscle contraction the A band stays the same length.

      Reason (R): Contraction happens by actin sliding over myosin, not by the filaments getting shorter.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The myosin length sets the A band, and myosin does not shorten, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Red muscle fibres tire quickly.

      Reason (R): Red fibres have many mitochondria and much myoglobin.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: red fibres work aerobically for a long time without tiring. R is true and is the reason.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A muscle fibre is placed in a solution with ATP but no calcium ions. It does not contract. Why not?'
    options:
    - "Without Ca²⁺, troponin keeps the binding sites on actin covered"
    - "ATP blocks the myosin heads permanently so they cannot bind"
    - "Actin dissolves completely when there is no calcium around it"
    answer: Without Ca²⁺, troponin keeps the binding sites on actin covered
    hints:
    - What does calcium bind to?
    - What must happen to actin before myosin can grab it?
    solution: Ca²⁺ binds troponin, which moves tropomyosin off actin's binding sites; without it myosin cannot bind.
    mistakes:
      "ATP blocks the myosin heads permanently so they cannot bind": c11b_sliding
      "Actin dissolves completely when there is no calcium around it": c11b_sliding
    exam: case
    difficulty: 2
  - prompt: 'Situation: A marathon runner and a sprinter are compared. Which type of muscle fibre would you expect more of in the marathon runner''s legs?'
    options:
    - "Red fibres with more myoglobin and mitochondria"
    - "White fibres with little myoglobin and few mitochondria"
    - "Smooth muscle fibres, like those in the gut wall"
    answer: Red fibres with more myoglobin and mitochondria
    hints:
    - Long races need steady energy using oxygen.
    - Which fibres store oxygen?
    solution: Red fibres store oxygen in myoglobin and have many mitochondria, suiting long aerobic effort.
    mistakes:
      "White fibres with little myoglobin and few mitochondria": b11_myoglobin
      "Smooth muscle fibres, like those in the gut wall": b11_myoglobin
    exam: competency
    difficulty: 2
- code: cbse11b.move.skeleton
  title: Skeleton, joints and disorders
  after:
  - cbse11b.move.muscle
  notes: |
    Skeletal system: 206 bones; axial (80: skull 22 = 8 cranial + 14 facial, hyoid, ear ossicles 6, vertebral column 26,
    sternum, 12 pairs of ribs—7 true, 3 false, 2 floating) and appendicular (126: limbs and girdles). Vertebral column:
    cervical 7, thoracic 12, lumbar 5, sacral (1, fused), coccygeal (1). Joints: fibrous (skull sutures), cartilaginous
    (between vertebrae), synovial (ball and socket—shoulder, hip; hinge—knee, elbow; pivot—atlas–axis; gliding—carpals;
    saddle—thumb). Disorders: myasthenia gravis, muscular dystrophy, tetany (low Ca²⁺), arthritis, osteoporosis, gout.
  explanations:
    text: 'The adult skeleton has 206 bones, split into the axial skeleton (skull, spine, ribs) and the appendicular skeleton (limbs and girdles). Joints let bones move: ball-and-socket joints move in all directions; hinges only bend one way.'
    visual: 'Draw your arm: a ball-and-socket joint at the shoulder (moves in circles), a hinge at the elbow (bends one way), and a pivot near the neck for turning the head.'
    step_by_step: 'Step 1: Axial or appendicular? Step 2: Count bones from the region list. Step 3: Name the joint from its movement. Step 4: Link disorders to causes (low calcium, uric acid, loss of bone mass).'
    real_world: Osteoporosis, where bones become brittle, is common in older women; calcium, vitamin D and exercise help prevent it.
  picture:
    kind: compare
    columns:
    - title: Joint
      points:
      - ball and socket
      - hinge
      - pivot
      - saddle
    - title: Example
      points:
      - shoulder, hip
      - knee, elbow
      - atlas and axis
      - thumb
    alt: Kinds of synovial joints with examples.
  activity:
    type: sort
    prompt: What kind of joint is it?
    bins:
    - Fibrous (no movement)
    - Cartilaginous (a little)
    - Synovial (free)
    items:
    - label: Sutures between skull bones
      bin: Fibrous (no movement)
      clue: Can the skull bones move against each other?
      why: 'Dense fibres lock the skull bones: no movement.'
    - label: Tooth in its socket
      bin: Fibrous (no movement)
      clue: Does a healthy tooth move in its socket?
      why: 'Held by fibres: an immovable joint.'
    - label: Between vertebrae
      bin: Cartilaginous (a little)
      clue: What pads sit between vertebrae?
      why: Cartilage discs allow slight movement.
    - label: Pubic symphysis
      bin: Cartilaginous (a little)
      clue: Joined by cartilage. How much can it move?
      why: Slightly movable.
    - label: Shoulder (ball and socket)
      bin: Synovial (free)
      clue: Can the arm swing in all directions?
      why: A fluid-filled cavity allows free movement.
    - label: Knee (hinge)
      bin: Synovial (free)
      clue: Does it bend freely one way?
      why: A synovial hinge joint.
    - label: Atlas and axis (pivot)
      bin: Synovial (free)
      clue: Which joint lets you shake your head?
      why: A synovial pivot joint.
    - label: Between carpals (gliding)
      bin: Synovial (free)
      clue: Do the wrist bones slide over each other?
      why: A synovial gliding joint.
    - label: Thumb's base (saddle)
      bin: Synovial (free)
      clue: Can the thumb move across the palm?
      why: A synovial saddle joint.
  lesson:
    - teach: 'The adult skeleton has 206 bones: axial (80: skull, vertebral column, sternum, ribs) and appendicular (126: limbs and girdles). The skull has 8 cranial and 14 facial bones.'
      check:
        prompt: How many bones are in the axial skeleton?
        options:
        - '80'
        - '126'
        - '206'
        answer: '80'
        why: 206 − 126.
      ways:
      - style: visual
        teach: How the adult skeleton's bones split into the axial and appendicular groups.
        picture:
          kind: compare
          columns:
          - title: Axial skeleton
            points:
            - skull
            - vertebral column
            - sternum
            - ribs
          - title: Appendicular skeleton
            points:
            - arms and legs
            - pectoral girdles
            - pelvic girdles
          alt: The axial skeleton is the skull, backbone, sternum and ribs; the appendicular skeleton is the limbs and the shoulder and hip girdles.
      - style: real_world
        teach: A newborn baby has around 300 bony parts, many still cartilage. As the child grows, several fuse, such as skull plates and parts of the sacrum, which is why adults have fewer bones than babies.
    - teach: 'The vertebral column has 26 bones: cervical 7, thoracic 12, lumbar 5, sacrum 1 (fused), coccyx 1. There are 12 pairs of ribs: 7 true (joined to the sternum), 3 false, 2 floating.'
      check:
        prompt: How many pairs of floating ribs are there?
        options:
        - '2'
        - '3'
        - '7'
        answer: '2'
        why: The last two pairs.
      ways:
      - style: visual
        teach: The regions of the vertebral column from top to bottom.
        picture:
          kind: flow
          steps:
          - 'Cervical: neck'
          - 'Thoracic: carry the ribs'
          - 'Lumbar: lower back, largest'
          - 'Sacrum: fused, joins the hips'
          - 'Coccyx: fused tail bone'
          alt: From top to bottom the backbone has cervical vertebrae in the neck, thoracic vertebrae carrying the ribs, large lumbar vertebrae, a fused sacrum and a fused coccyx.
      - style: real_world
        teach: A giraffe's long neck and a mouse's short neck have the same number of neck vertebrae as yours; in giraffes each one is just much longer. That number is shared by almost all mammals.
    - teach: 'Joints: fibrous (no movement, skull sutures), cartilaginous (little movement, between vertebrae) and synovial (free movement): ball and socket (shoulder, hip), hinge (knee, elbow), pivot (atlas–axis), gliding (carpals), saddle (thumb).'
      picture:
        kind: compare
        columns:
        - title: Synovial joint
          points:
          - ball and socket
          - hinge
          - pivot
          - saddle
        - title: Example
          points:
          - shoulder
          - knee
          - atlas–axis
          - thumb base
        alt: Types of synovial joints with examples.
      check:
        prompt: 'The joint that lets the head turn side to side is a:'
        options:
        - pivot joint
        - hinge joint
        - fibrous joint
        answer: pivot joint
        why: Between atlas and axis.
      ways:
      - style: step_by_step
        teach: 'Step 1: Can the joint move? No → fibrous (skull sutures). Step 2: A little, padded by cartilage → cartilaginous (between vertebrae). Step 3: Freely, with fluid inside → synovial. Step 4: Then name the synovial type by its motion: all directions, one plane like a door, rotation, or sliding.'
      - style: real_world
        teach: Elderly people, especially women after menopause, can lose bone mass and break a wrist or hip from a small fall. Weight-bearing exercise, calcium, vitamin D and sunlight in youth help build strong bones for later life.
  items:
  - prompt: How many bones are in the adult human skeleton?
    answer: '206'
    check: 80+126
    difficulty: 1
    hints:
    - Axial 80 + appendicular 126.
    - Add.
    solution: "The adult skeleton has 206 bones (80 axial + 126 appendicular)."
    mistakes:
      '212': c11b_bones
  - prompt: How many cervical (neck) vertebrae do humans have?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Same as a giraffe.
    - Seven.
    solution: "Humans, like almost all mammals, have 7 cervical vertebrae."
    mistakes: {"12": "b11_cervical", "5": "b11_cervical", "33": "b11_cervical"}
  - prompt: How many pairs of ribs do humans have?
    answer: '12'
    check: 7+3+2
    difficulty: 1
    hints:
    - 7 true, 3 false, 2 floating.
    - Add.
    solution: "Humans have 12 pairs of ribs: 7 true, 3 false and 2 floating."
    mistakes: {"24": "b11_ribs", "10": "b11_ribs", "7": "b11_ribs"}
  - prompt: 'The knee is an example of a:'
    options:
    - hinge joint
    - ball and socket joint
    - pivot joint
