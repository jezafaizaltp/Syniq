# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 17. Format: content/README.md.
subject: cbse11-bio
chapter: 17
title: Locomotion and Movement
tips:
  c11b_bones: "A newborn has about 300 bones, many of which fuse. The adult count is 80 axial + 126 appendicular: add them."
  c11b_sliding: "In contraction the filaments slide, so the bands made only of thin or only of thick filaments shorten. The band set by the full length of the thick myosin filaments doesn't change."
  b11_cervical: "Nearly all mammals, even giraffes, share the same number of neck vertebrae."
  b11_cilia_egg: "Cilia line the tube that carries the egg from ovary to uterus."
  b11_gout: "Gout links to purine-rich food and a nitrogen waste that crystallises in joints."
  b11_knee: "The knee bends one way only, like a door."
  b11_myoglobin: "Haemoglobin is in blood. The red oxygen-storing pigment inside muscle is its cousin."
  b11_ribs: "Humans have a dozen pairs of ribs."
  b11_sarcomere: "The unit between two Z lines that shortens during contraction."
  b11_sr: "Muscle ER has a special name: sarco- (flesh) + plasmic reticulum."
  b11_tetany: "Muscles need a mineral, also used for clotting, to work properly."
  b11_troponin: "Calcium binds a regulatory protein on the thin filament, which moves tropomyosin off actin's binding sites."
concepts:
- code: cbse11b.move.muscle
  title: Types of movement and muscle contraction
  notes: |
    Movement types: amoeboid (pseudopodia, macrophages), ciliary (trachea, fallopian tube), muscular. Muscle: skeletal,
    visceral, cardiac. Skeletal muscle structure: fascicles, muscle fibres (syncytial), sarcolemma, sarcoplasmic
    reticulum (Ca²⁺ store), myofibrils with sarcomeres (Z line to Z line); light I band (actin), dark A band (myosin), H
    zone. Contractile proteins: actin (thin, with troponin and tropomyosin), myosin (thick, heads with ATPase). Sliding
    filament theory: nerve signal → acetylcholine → action potential → Ca²⁺ released → binds troponin → myosin heads bind
    actin, cross-bridges, power stroke using ATP. Red (myoglobin, aerobic) and white fibres.
  explanations:
    text: Muscles contract when thin actin filaments slide over thick myosin filaments, pulled by myosin heads that use ATP. A nerve signal releases calcium, which unlocks the actin so myosin can grab it.
    visual: 'Draw a sarcomere: Z lines at each end, actin attached to them, myosin in the middle. On contraction, the actin slides inward, the Z lines come closer and the light bands shrink.'
    step_by_step: 'Step 1: Nerve signal arrives. Step 2: Calcium is released from the sarcoplasmic reticulum. Step 3: Myosin binds actin and pulls (ATP). Step 4: Calcium is pumped back; muscle relaxes.'
    real_world: After death, ATP runs out and myosin can't let go of actin, causing the stiffness called rigor mortis.
  picture:
    kind: flow
    steps:
    - Nerve impulse
    - Acetylcholine released
    - Ca²⁺ released
    - Myosin binds actin
    - Filaments slide, muscle shortens
    alt: Steps of muscle contraction from nerve impulse to sliding filaments.
  activity:
    type: order
    prompt: Put the steps of a skeletal muscle contraction in order.
    steps:
    - A nerve impulse reaches the neuromuscular junction
    - Acetylcholine is released
    - An action potential spreads; Ca²⁺ is released
    - Ca²⁺ binds troponin, uncovering sites on actin
    - Myosin heads bind actin and pull, using ATP
    - Actin slides inward; the sarcomere shortens
    reasons:
      Acetylcholine is released: Acetylcholine is released from the nerve ending only when the impulse arrives.
      An action potential spreads; Ca²⁺ is released: The muscle fibre is excited only after acetylcholine binds to it.
      Ca²⁺ binds troponin, uncovering sites on actin: Calcium must be released first before it can bind troponin.
      Myosin heads bind actin and pull, using ATP: Myosin can't bind until the sites on actin are uncovered.
      Actin slides inward; the sarcomere shortens: The filaments slide only once the cross bridges pull.
  items:
  - prompt: 'The functional unit of a myofibril is the:'
    options:
    - sarcomere
    - sarcolemma
    - fascicle
    - tendon
    answer: sarcomere
    difficulty: 1
    hints:
    - Z line to Z line.
    - Repeating unit.
    solution: The sarcomere.
    mistakes: {"sarcolemma": "b11_sarcomere", "fascicle": "b11_sarcomere", "tendon": "b11_sarcomere"}
  - prompt: 'Calcium is stored in muscle fibres in the:'
    options:
    - sarcoplasmic reticulum
    - nucleus
    - mitochondria
    - sarcolemma
    answer: sarcoplasmic reticulum
    difficulty: 2
    hints:
    - Special ER.
    - Released on signal.
    solution: Sarcoplasmic reticulum.
    mistakes: {"nucleus": "b11_sr", "mitochondria": "b11_sr", "sarcolemma": "b11_sr"}
  - prompt: During contraction, which band stays the same length?
    options:
    - A band
    - I band
    - H zone
    - the whole sarcomere
    answer: A band
    difficulty: 2
    hints:
    - Myosin length.
    - It doesn't shrink.
    solution: The A band.
    mistakes:
      I band: c11b_sliding
  - prompt: 'Calcium starts contraction by binding to:'
    options:
    - troponin
    - myosin
    - actin directly
    - ATP
    answer: troponin
    difficulty: 2
    hints:
    - Moves tropomyosin.
    - Uncovers sites.
    solution: Troponin.
    mistakes: {"myosin": "b11_troponin", "actin directly": "b11_troponin", "ATP": "b11_troponin"}
  - prompt: 'Red muscle fibres are red because they contain plenty of:'
    options:
    - myoglobin
    - haemoglobin
    - melanin
    - keratin
    answer: myoglobin
    difficulty: 2
    hints:
    - Stores oxygen.
    - Aerobic.
    solution: Myoglobin.
    mistakes: {"haemoglobin": "b11_myoglobin", "melanin": "b11_myoglobin", "keratin": "b11_myoglobin"}
  - prompt: 'Ciliary movement moves eggs along the:'
    options:
    - fallopian tube
    - oesophagus
    - blood vessels
    - bone marrow
    answer: fallopian tube
    difficulty: 1
    hints:
    - Cilia beat.
    - Also trachea.
    solution: The fallopian tube.
    mistakes: {"oesophagus": "b11_cilia_egg", "blood vessels": "b11_cilia_egg", "bone marrow": "b11_cilia_egg"}
- code: cbse11b.move.skeleton
  title: Skeleton, joints and disorders
  after:
  - cbse11b.move.muscle
  notes: |
    Skeletal system: 206 bones; axial (80: skull 22 = 8 cranial + 14 facial, hyoid, ear ossicles 6, vertebral column 26,
    sternum, 12 pairs of ribs—7 true, 3 false, 2 floating) and appendicular (126: limbs and girdles). Vertebral column:
    cervical 7, thoracic 12, lumbar 5, sacral (1, fused), coccygeal (1). Joints: fibrous (skull sutures), cartilaginous
    (between vertebrae), synovial (ball and socket—shoulder, hip; hinge—knee, elbow; pivot—atlas–axis; gliding—carpals;
    saddle—thumb). Disorders: myasthenia gravis, muscular dystrophy, tetany (low Ca²⁺), arthritis, osteoporosis, gout.
  explanations:
    text: 'The adult skeleton has 206 bones, split into the axial skeleton (skull, spine, ribs) and the appendicular skeleton (limbs and girdles). Joints let bones move: ball-and-socket joints move in all directions; hinges only bend one way.'
    visual: 'Draw your arm: a ball-and-socket joint at the shoulder (moves in circles), a hinge at the elbow (bends one way), and a pivot near the neck for turning the head.'
    step_by_step: 'Step 1: Axial or appendicular? Step 2: Count bones from the region list. Step 3: Name the joint from its movement. Step 4: Link disorders to causes (low calcium, uric acid, loss of bone mass).'
    real_world: Osteoporosis, where bones become brittle, is common in older women; calcium, vitamin D and exercise help prevent it.
  picture:
    kind: compare
    columns:
    - title: Joint
      points:
      - ball and socket
      - hinge
      - pivot
      - saddle
    - title: Example
      points:
      - shoulder, hip
      - knee, elbow
      - atlas and axis
      - thumb
    alt: Kinds of synovial joints with examples.
  activity:
    type: sort
    prompt: What kind of joint is it?
    bins:
    - Fibrous (no movement)
    - Cartilaginous (a little)
    - Synovial (free)
    items:
    - label: Sutures between skull bones
      bin: Fibrous (no movement)
      clue: Can the skull bones move against each other?
      why: 'Dense fibres lock the skull bones: no movement.'
    - label: Tooth in its socket
      bin: Fibrous (no movement)
      clue: Does a healthy tooth move in its socket?
      why: 'Held by fibres: an immovable joint.'
    - label: Between vertebrae
      bin: Cartilaginous (a little)
      clue: What pads sit between vertebrae?
      why: Cartilage discs allow slight movement.
    - label: Pubic symphysis
      bin: Cartilaginous (a little)
      clue: Joined by cartilage. How much can it move?
      why: Slightly movable.
    - label: Shoulder (ball and socket)
      bin: Synovial (free)
      clue: Can the arm swing in all directions?
      why: A fluid-filled cavity allows free movement.
    - label: Knee (hinge)
      bin: Synovial (free)
      clue: Does it bend freely one way?
      why: A synovial hinge joint.
    - label: Atlas and axis (pivot)
      bin: Synovial (free)
      clue: Which joint lets you shake your head?
      why: A synovial pivot joint.
    - label: Between carpals (gliding)
      bin: Synovial (free)
      clue: Do the wrist bones slide over each other?
      why: A synovial gliding joint.
    - label: Thumb's base (saddle)
      bin: Synovial (free)
      clue: Can the thumb move across the palm?
      why: A synovial saddle joint.
  items:
  - prompt: How many bones are in the adult human skeleton?
    answer: '206'
    check: 80+126
    difficulty: 1
    hints:
    - Axial 80 + appendicular 126.
    - Add.
    solution: '206.'
    mistakes:
      '212': c11b_bones
  - prompt: How many cervical (neck) vertebrae do humans have?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Same as a giraffe.
    - Seven.
    solution: '7.'
    mistakes: {"12": "b11_cervical", "5": "b11_cervical", "33": "b11_cervical"}
  - prompt: How many pairs of ribs do humans have?
    answer: '12'
    check: 7+3+2
    difficulty: 1
    hints:
    - 7 true, 3 false, 2 floating.
    - Add.
    solution: 12 pairs.
    mistakes: {"24": "b11_ribs", "10": "b11_ribs", "7": "b11_ribs"}
  - prompt: 'The knee is an example of a:'
    options:
    - hinge joint
    - ball and socket joint
    - pivot joint
    - gliding joint
    answer: hinge joint
    difficulty: 1
    hints:
    - Bends one way.
    - Like a door.
    solution: A hinge joint.
    mistakes: {"ball and socket joint": "b11_knee", "pivot joint": "b11_knee", "gliding joint": "b11_knee"}
  - prompt: 'Gout is caused by the build-up of:'
    options:
    - uric acid crystals in joints
    - too little calcium
    - loss of bone mass
    - autoimmune attack on muscles
    answer: uric acid crystals in joints
    difficulty: 2
    hints:
    - Painful joints.
    - Uric acid.
    solution: Uric acid crystals.
    mistakes: {"too little calcium": "b11_gout", "loss of bone mass": "b11_gout", "autoimmune attack on muscles": "b11_gout"}
  - prompt: 'Tetany (rapid muscle spasms) is caused by low levels of:'
    options:
    - calcium in body fluids
    - sodium
    - glucose
    - iron
    answer: calcium in body fluids
    difficulty: 2
    hints:
    - Ca²⁺ needed for normal muscle.
    - Low Ca²⁺.
    solution: Low calcium.
    mistakes: {"sodium": "b11_tetany", "glucose": "b11_tetany", "iron": "b11_tetany"}
