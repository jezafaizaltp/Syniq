# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse11-bio
chapter: 6
title: Anatomy of Flowering Plants
tips:
  c11b_bundle: "Dicot stems have bundles in a ring, with cambium. In which group are they scattered all over the stem, with no cambium?"
  c11b_rings: Each year one light (spring) and one dark (autumn) band of wood forms; counting pairs gives the age.
  b11_bulliform: "Grass leaves roll up in dry weather to save water. Which leaf type is grass?"
  b11_casparian: "The Casparian strip controls what enters the vascular core. Which innermost cortical layer encircles it?"
  b11_collenchyma: "Sclerenchyma is rigid and dead. Which living tissue with thickened corners still bends?"
  b11_companion: "Sieve tubes have no nucleus and need neighbour cells to run them. Where are sieve tubes?"
  b11_guard_grass: "Dicot guard cells are bean-shaped; grass guard cells have a narrow middle and swollen ends."
  b11_intercalary: "'Intercalary' means inserted in between. Grasses regrow after grazing from where?"
  b11_open_bundle: "Cambium lets the bundle keep making new tissue. Is such a bundle shut off from further growth, or not?"
  b11_palisade: "A dorsiventral leaf has a distinct upper and lower side; palisade sits under the upper surface."
  b11_sclerenchyma: "Sclerenchyma gives hard support, like coconut fibres. Is that tissue alive and soft?"
  b11_xylem: "Phloem moves food. Which tissue carries water up from roots?"
  c11b06_tis: 'Ask: is the cell living or dead, thin- or thick-walled, and what job does it do (store, support, conduct)?'
  c11b06_organ: Monocot or dicot? Count the xylem bundles in roots; look for a ring or a scatter of bundles in stems.
concepts:
- code: cbse11b.anat.tissues
  title: Tissues and tissue systems
  notes: |
    Meristems: apical, intercalary, lateral (cambium); primary and secondary growth. Permanent tissues: simple—parenchyma,
    collenchyma (thickened corners, support in young stems), sclerenchyma (fibres, sclereids; lignified, dead); complex—
    xylem (tracheids, vessels, xylem fibres, xylem parenchyma; protoxylem, metaxylem; endarch in stems, exarch in roots)
    and phloem (sieve tubes, companion cells, phloem parenchyma, fibres). Tissue systems: epidermal (cuticle, stomata
    with guard cells: bean-shaped in dicots, dumb-bell in grasses; trichomes, root hairs), ground, vascular. Vascular bundles:
    radial, conjoint, open/closed.
  explanations:
    text: Plants have growing tissues (meristems) at their tips and sides, and permanent tissues that do particular jobs. Xylem carries water up; phloem carries food. The epidermis protects, and stomata in it let gases in and out.
    visual: 'Draw a tree trunk''s tissues as pipes: xylem as water pipes going up, phloem as food pipes going both ways, and cambium as a thin growing layer between them.'
    step_by_step: 'Step 1: Is the tissue dividing? Meristem. Step 2: Living with thin walls? Parenchyma. Step 3: Dead and lignified? Sclerenchyma. Step 4: Conducting water or food? Xylem or phloem.'
    real_world: Jute and coir fibres, used for sacks and ropes, are sclerenchyma fibres.
  picture:
    kind: compare
    columns:
    - title: Tissue
      points:
      - xylem
      - phloem
      - sclerenchyma
      - collenchyma
    - title: Job
      points:
      - carries water and minerals
      - carries food
      - strength (dead cells)
      - flexible support
    alt: Plant tissues and their jobs.
  activity:
    type: sort
    prompt: Sort each plant tissue.
    bins:
    - Meristematic
    - Simple permanent
    - Complex permanent
    items:
    - label: Apical meristem
      bin: Meristematic
      clue: Do its cells keep dividing?
      why: Actively dividing cells at shoot and root tips.
    - label: Vascular cambium
      bin: Meristematic
      clue: Does it still divide, adding new tissue?
      why: A lateral meristem that makes secondary growth.
    - label: Intercalary meristem
      bin: Meristematic
      clue: Found at the base of grass leaves. Does it divide?
      why: A dividing tissue between mature tissues.
    - label: Parenchyma
      bin: Simple permanent
      clue: Is it made of one kind of cell, which no longer divides?
      why: 'One cell type, thin walls, stores food: simple permanent.'
    - label: Collenchyma
      bin: Simple permanent
      clue: One cell type with corners thickened by pectin?
      why: A simple tissue that supports young stems.
    - label: Sclerenchyma
      bin: Simple permanent
      clue: One kind of dead, thick-walled cell?
      why: 'Fibres and sclereids: simple permanent tissue.'
    - label: Xylem
      bin: Complex permanent
      clue: 'How many cell types: tracheids, vessels, fibres, parenchyma?'
      why: 'Several cell types working together: complex.'
    - label: Phloem
      bin: Complex permanent
      clue: Sieve tubes, companion cells, fibres, parenchyma. One type or many?
      why: 'Several cell types: complex permanent.'
  lesson:
    - teach: 'Meristems are dividing tissues: apical (tips of root and shoot, growth in length), intercalary (base of grass internodes) and lateral (cambium, growth in width).'
      check:
        prompt: 'Growth in girth comes from:'
        options:
        - lateral meristem (cambium)
        - apical meristem
        - intercalary meristem
        answer: lateral meristem (cambium)
        why: It lies along the sides.
      ways:
      - style: visual
        teach: Where the three kinds of meristem sit and what each one adds.
        picture:
          kind: compare
          columns:
          - title: Apical
            points:
            - tips of root and shoot
            - adds length
          - title: Intercalary
            points:
            - between mature tissues
            - grasses regrow after grazing
          - title: Lateral
            points:
            - along the sides (cambium)
            - adds girth
          alt: Apical meristems at root and shoot tips add length; intercalary meristems between mature tissues let grasses regrow; lateral meristems along the sides add girth.
      - style: real_world
        teach: A lawn mown flat grows back within days because growth restarts from tissue low down on each grass shoot, not from the cut tip. A coconut palm grows tall but hardly fattens, because it has almost no lateral meristem.
    - teach: 'Simple permanent tissues: parenchyma (living, thin walls, storage), collenchyma (living, thickened corners, flexible support), sclerenchyma (dead, lignified fibres and sclereids, hard support).'
      check:
        prompt: 'The gritty feel of a pear comes from:'
        options:
        - sclereids
        - collenchyma
        - parenchyma
        answer: sclereids
        why: Stone cells are a kind of sclerenchyma.
      ways:
      - style: visual
        teach: Three simple permanent tissues compared by wall, life and job.
        picture:
          kind: compare
          columns:
          - title: Parenchyma
            points:
            - thin cellulose walls
            - living
            - storage, photosynthesis
          - title: Collenchyma
            points:
            - thick at the corners (pectin)
            - living
            - bendable support
          - title: Sclerenchyma
            points:
            - thick lignified walls
            - dead
            - 'hard support: fibres, sclereids'
          alt: Parenchyma is living with thin walls and stores food; collenchyma is living with corner thickenings and gives flexible support; sclerenchyma is dead with lignified walls and gives hard support.
      - style: real_world
        teach: The gritty bits you feel when biting a guava or pear are stone cells, a kind of sclereid. Jute and coir ropes are bundles of long sclerenchyma fibres. The soft white of a potato is mostly parenchyma packed with starch.
    - teach: 'Complex tissues: xylem carries water up (tracheids, vessels, fibres, parenchyma) and phloem carries food (sieve tubes, companion cells, parenchyma, fibres). Epidermis has cuticle, stomata with guard cells and hairs.'
      picture:
        kind: compare
        columns:
        - title: Tissue
          points:
          - xylem
          - phloem
        - title: Carries
          points:
          - water and minerals, upward
          - food, both ways
        alt: What xylem and phloem carry.
      check:
        prompt: 'Sugar from leaves to roots moves in:'
        options:
        - phloem
        - xylem
        - cortex
        answer: phloem
        why: Phloem carries food.
      ways:
      - style: step_by_step
        teach: 'Step 1: Ask what the tissue carries. Water and minerals → xylem; food → phloem. Step 2: In xylem, find tracheids and vessels: dead, lignified tubes. Step 3: In phloem, find sieve tubes with sieve plates. Step 4: A sieve tube has no nucleus, so a companion cell beside it runs it.'
      - style: real_world
        teach: 'Stand a white flower stalk in water with ink or food colour. After a few hours, coloured streaks show inside the stem and petals: the water has climbed through the xylem. Aphids sip sugary sap by pushing their mouthparts into phloem.'
  items:
  - prompt: 'Water is conducted upward by:'
    options:
    - xylem
    - phloem
    - cambium
    - epidermis
    answer: xylem
    difficulty: 1
    hints:
    - Vessels and tracheids.
    - Dead cells.
    solution: "Xylem vessels and tracheids carry water and minerals up from the roots."
    mistakes: {"phloem": "b11_xylem", "cambium": "b11_xylem", "epidermis": "b11_xylem"}
  - prompt: 'Companion cells are found in:'
    options:
    - phloem
    - xylem
    - cork
    - collenchyma
    answer: phloem
    difficulty: 2
    hints:
    - Help sieve tubes.
    - Food transport.
    solution: "Companion cells sit beside sieve tubes in phloem and keep them working."
    mistakes: {"xylem": "b11_companion", "cork": "b11_companion", "collenchyma": "b11_companion"}
  - prompt: 'Guard cells in grasses are:'
    options:
    - dumb-bell shaped
    - bean shaped
    - star shaped
    - absent
    answer: dumb-bell shaped
    difficulty: 2
    hints:
    - Monocot grasses.
    - 'Dicots: bean.'
    solution: "In grasses guard cells are dumb-bell shaped; in dicots they are bean shaped."
    mistakes: {"bean shaped": "b11_guard_grass", "star shaped": "b11_guard_grass", "absent": "b11_guard_grass"}
  - prompt: 'Intercalary meristem is found:'
    options:
    - "at the base of internodes in grasses"
    - "at the tips of roots in all plants"
    - "in the cork layer of old stems"
    - "only in the leaves of dicots"
    answer: at the base of internodes in grasses
    difficulty: 2
    hints:
    - Grass regrows after grazing.
    - Between mature tissues.
    solution: At internode bases in grasses.
    mistakes: {"at the tips of roots in all plants": "b11_intercalary", "in the cork layer of old stems": "b11_intercalary", "only in the leaves of dicots": "b11_intercalary"}
  - prompt: 'Sclerenchyma cells are usually:'
    options:
    - dead with lignified walls
    - living and thin-walled
    - photosynthetic
    - dividing
    answer: dead with lignified walls
    difficulty: 1
    hints:
    - Strength.
    - Fibres.
    solution: "Sclerenchyma (fibres and sclereids) have thick lignified walls and are usually dead at maturity."
    mistakes: {"living and thin-walled": "b11_sclerenchyma", "photosynthetic": "b11_sclerenchyma", "dividing": "b11_sclerenchyma"}
  - prompt: Which tissue gives flexible support to young stems and leaf stalks?
    options:
    - collenchyma
    - sclerenchyma
    - xylem
    - phloem
    answer: collenchyma
    difficulty: 2
    hints:
    - Thick corners.
    - Living.
    solution: "Collenchyma has living cells thickened at the corners, giving support while still bending."
    mistakes: {"sclerenchyma": "b11_collenchyma", "xylem": "b11_collenchyma", "phloem": "b11_collenchyma"}
  - prompt: Which xylem element is found mainly in angiosperms, not gymnosperms?
    options:
    - vessels
    - tracheids
    - xylem parenchyma
    answer: vessels
    difficulty: 1
    hints:
    - They are long tubes of joined cells.
    - Gymnosperms rely on tracheids.
    solution: 'Step 1: vessels are an angiosperm feature. Step 2: vessels.'
    mistakes:
      tracheids: c11b06_tis
      xylem parenchyma: c11b06_tis
  - prompt: 'Stomata are surrounded by:'
    options:
    - guard cells
    - companion cells
    - sieve cells
    answer: guard cells
    difficulty: 1
    hints:
    - They open and close the pore.
    - Bean-shaped in dicots.
    solution: 'Step 1: two cells around each pore. Step 2: guard cells.'
    mistakes:
      companion cells: c11b06_tis
      sieve cells: c11b06_tis
  - prompt: 'Apical meristem is found at:'
    options:
    - root and shoot tips
    - base of internodes
    - sides of the stem
    answer: root and shoot tips
    difficulty: 1
    hints:
    - Apex means tip.
    - It makes the plant longer.
    solution: 'Step 1: at the apex. Step 2: root and shoot tips.'
    mistakes:
      base of internodes: c11b06_tis
      sides of the stem: c11b06_tis
  - prompt: Which phloem element is dead at maturity?
    options:
    - "phloem fibres"
    - "sieve tubes"
    - "phloem parenchyma"
    answer: phloem fibres
    difficulty: 2
    hints:
    - Fibres are sclerenchyma.
    - Sclerenchyma cells are usually dead.
    solution: 'Step 1: fibres are lignified. Step 2: dead.'
    mistakes:
      "sieve tubes": c11b06_tis
      "phloem parenchyma": c11b06_tis
  - prompt: 'In stems, the first-formed xylem (protoxylem) lies towards the centre. This is called:'
    options:
    - endarch
    - exarch
    - mesarch
    answer: endarch
    difficulty: 2
    hints:
    - Endo means inside.
    - In roots it is the reverse.
    solution: 'Step 1: protoxylem toward the pith. Step 2: endarch.'
    mistakes:
      exarch: c11b06_tis
      mesarch: c11b06_tis
  - prompt: 'Parenchyma cells mainly:'
    options:
    - "store food and carry out photosynthesis"
    - "conduct water up from the roots"
    - "give hard support to old stems"
    answer: store food and carry out photosynthesis
    difficulty: 2
    hints:
    - They are living and thin-walled.
    - They make up most of the soft ground tissue.
    solution: 'Step 1: living, thin-walled. Step 2: storage and photosynthesis.'
    mistakes:
      "conduct water up from the roots": c11b06_tis
      "give hard support to old stems": c11b06_tis
  - prompt: 'Root hairs are outgrowths of the:'
    options:
    - epidermis
    - cortex
    - endodermis
    answer: epidermis
    difficulty: 2
    hints:
    - They are on the surface.
    - Each is one long cell.
    solution: 'Step 1: surface cells grow out. Step 2: epidermis.'
    mistakes:
      cortex: c11b06_tis
      endodermis: c11b06_tis
  - prompt: 'Vascular bundles where xylem and phloem are on different radii, as in roots, are:'
    options:
    - radial
    - conjoint
    - closed
    answer: radial
    difficulty: 3
    hints:
    - They alternate around the centre.
    - Not side by side on one radius.
    solution: 'Step 1: separate radii. Step 2: radial.'
    mistakes:
      conjoint: c11b06_tis
      closed: c11b06_tis
  - prompt: 'Companion cells help sieve tubes because sieve tubes:'
    options:
    - "have no nucleus when mature"
    - "are dead cells with no contents"
    - "carry water instead of food"
    answer: have no nucleus when mature
    difficulty: 3
    hints:
    - Sieve tubes are living but lose their nucleus.
    - Something must control them.
    solution: 'Step 1: no nucleus in mature sieve tube. Step 2: companion cell controls it.'
    mistakes:
      "are dead cells with no contents": c11b06_tis
      "carry water instead of food": c11b06_tis
  - prompt: 'Assertion (A): Sclerenchyma gives mechanical strength to plant organs.

      Reason (R): Sclerenchyma cells have thick lignified walls.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Lignin makes the walls hard and rigid, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Sieve tubes can carry food without a nucleus.

      Reason (R): Companion cells control the sieve tubes through connections called plasmodesmata.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The companion cell's nucleus runs the sieve tube through pit connections, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A cross-section of a young sunflower stem shows living cells just below the epidermis with walls thickened only at the corners. Which tissue is this, and what does it do?'
    options:
    - 'Collenchyma: flexible support'
    - 'Sclerenchyma: hard support'
    - 'Parenchyma: storage'
    answer: 'Collenchyma: flexible support'
    hints:
    - Where is the thickening?
    - Is the tissue living or dead?
    solution: Corner thickening in living cells is collenchyma, which supports young growing stems while letting them bend.
    mistakes:
      'Sclerenchyma: hard support': c11b06_tis
      'Parenchyma: storage': c11b06_tis
    exam: case
    difficulty: 2
  - prompt: 'Situation: A tree trunk is ringed (a strip of bark removed all round). After some weeks the bark above the ring swells. Which tissue was cut?'
    options:
    - Phloem
    - Xylem
    - Cambium only
    answer: Phloem
    hints:
    - Bark contains which conducting tissue?
    - Food moving down gets stuck above the cut.
    solution: Removing the bark cuts the phloem, so food coming down from the leaves piles up above the ring.
    mistakes:
      Xylem: c11b06_tis
      Cambium only: c11b06_tis
    exam: competency
    difficulty: 2
- code: cbse11b.anat.organs
  title: Dicot and monocot anatomy
  after:
  - cbse11b.anat.tissues
  notes: |
    Dicot root: epidermis, cortex, endodermis (Casparian strips), pericycle, radial bundles (2–4 xylem), pith small.
    Monocot root: more than six xylem bundles, large pith. Dicot stem: epidermis with cuticle, hypodermis (collenchyma),
    cortex, endodermis (starch sheath), pericycle, vascular bundles in a ring, conjoint, open, endarch; pith. Monocot stem:
    sclerenchymatous hypodermis, scattered closed bundles with bundle sheath, no pith distinction. Dorsiventral (dicot)
    leaf: palisade and spongy mesophyll; isobilateral (monocot) leaf: bulliform cells. (Secondary growth is outside the
    rationalised syllabus in some years; cambium and annual rings are outlined.)
  explanations:
    text: 'Cut across a stem and look under a microscope: dicot stems have bundles of xylem and phloem in a neat ring, with cambium that lets them thicken. Monocot stems, like maize, have bundles scattered about and no cambium.'
    visual: 'Draw two circles: one with bundles arranged in a ring (dicot stem), one with bundles dotted all over (monocot stem).'
    step_by_step: 'Step 1: Look at bundle arrangement: ring or scattered. Step 2: Check for cambium (open) or not (closed). Step 3: In roots, count xylem bundles: few (dicot), many (monocot).'
    real_world: Counting annual rings in a tree trunk gives its age; wide rings mean good growing years.
  picture:
    kind: compare
    columns:
    - title: Feature
      points:
      - vascular bundles
      - cambium
      - pith
    - title: Dicot stem
      points:
      - in a ring
      - present (open)
      - large
    - title: Monocot stem
      points:
      - scattered
      - absent (closed)
      - not distinct
    alt: 'Dicot and monocot stems compared: bundle arrangement, cambium and pith.'
  activity:
    type: sort
    prompt: Which organ shows this feature in a cross-section?
    bins:
    - Dicot root
    - Monocot root
    - Dicot stem
    - Monocot stem
    items:
    - label: 2 to 4 xylem bundles; pith small or absent
      bin: Dicot root
      clue: Roots have radial bundles. How many xylem groups here?
      why: 'Few xylem bundles (di- to tetrarch) and little pith: a dicot root.'
    - label: Secondary growth from cambium between xylem and phloem
      bin: Dicot root
      clue: Which root type can thicken later?
      why: Dicot roots develop cambium; monocot roots don't.
    - label: More than 6 xylem bundles; large pith
      bin: Monocot root
      clue: Radial bundles, many of them. Which root?
      why: 'Polyarch xylem and a large pith: monocot root.'
    - label: Vascular bundles in a ring, open, with cambium
      bin: Dicot stem
      clue: Are the bundles in a ring or scattered?
      why: 'A ring of open bundles: a dicot stem.'
    - label: Hypodermis of collenchyma
      bin: Dicot stem
      clue: Which stem has collenchyma just below the epidermis?
      why: Dicot stems have a collenchyma hypodermis.
    - label: Bundles scattered, each with a sclerenchyma sheath
      bin: Monocot stem
      clue: Are the bundles in a ring?
      why: 'Scattered closed bundles: a monocot stem.'
    - label: Water-filled cavities inside the bundles
      bin: Monocot stem
      clue: Which stem has water cavities in its bundles?
      why: A feature of monocot stems.
    - label: Hypodermis of sclerenchyma
      bin: Monocot stem
      clue: Which stem has a hard sclerenchyma hypodermis?
      why: Monocot stems have a sclerenchymatous hypodermis.
  lesson:
    - teach: 'Root: epidermis, cortex, endodermis (with Casparian strips that control what enters), pericycle, radial bundles. Dicot roots have 2–4 xylem bundles and a small pith; monocot roots have more than six and a large pith.'
      check:
        prompt: 'A root with 12 xylem bundles and a large pith is a:'
        options:
        - monocot root
        - dicot root
        - stem
        answer: monocot root
        why: Many bundles, big pith.
      ways:
      - style: visual
        teach: Dicot and monocot roots in cross-section, side by side.
        picture:
          kind: compare
          columns:
          - title: Dicot root
            points:
            - few xylem bundles
            - small or no pith
            - cambium forms later
          - title: Monocot root
            points:
            - many xylem bundles
            - large pith
            - no secondary growth
          alt: A dicot root has few xylem bundles, a small pith and later forms cambium; a monocot root has many xylem bundles, a large pith and no secondary growth.
      - style: step_by_step
        teach: 'Step 1: Water enters a root hair. Step 2: It crosses the cortex through cell walls and cells. Step 3: At the endodermis, the Casparian strip blocks the wall path. Step 4: Water must pass through living cells, which choose what goes in. Step 5: It reaches the xylem.'
    - teach: 'Dicot stem: bundles in a ring, conjoint, open (with cambium), with a central pith. Monocot stem: many scattered, closed bundles with a sclerenchyma sheath, no clear pith.'
      check:
        prompt: 'Vascular bundles in a ring with cambium are typical of a:'
        options:
        - dicot stem
        - monocot stem
        - monocot root
        answer: dicot stem
        why: Ring and open bundles.
      ways:
      - style: visual
        teach: Dicot and monocot stems compared feature by feature.
        picture:
          kind: compare
          columns:
          - title: Dicot stem
            points:
            - bundles in a ring
            - 'open: cambium present'
            - clear pith in the centre
            - collenchyma hypodermis
          - title: Monocot stem
            points:
            - bundles scattered
            - 'closed: no cambium'
            - no distinct pith
            - sclerenchyma hypodermis
          alt: A dicot stem has bundles in a ring, open bundles with cambium and a central pith; a monocot stem has scattered closed bundles and no distinct pith.
      - style: real_world
        teach: 'Slice a maize stalk and you see many dots scattered all over the cut face: monocot bundles. Slice a young sunflower stem and the dots form one neat ring around a soft centre: dicot bundles around a pith.'
    - teach: 'Dicot leaves are dorsiventral: palisade on top, spongy below, more stomata on the lower side. Monocot leaves are isobilateral, with bulliform cells that let grass leaves roll up in dry weather. Annual rings in wood record yearly growth.'
      picture:
        kind: compare
        columns:
        - title: Dicot stem
          points:
          - bundles in a ring
          - open bundles
          - clear pith
        - title: Monocot stem
          points:
          - bundles scattered
          - closed bundles
          - no clear pith
        alt: Dicot and monocot stems compared.
      check:
        prompt: 'Bulliform cells are found in:'
        options:
        - grass leaves
        - dicot roots
        - dicot stems
        answer: grass leaves
        why: They help leaves roll.
      ways:
      - style: step_by_step
        teach: 'Step 1: Cut a leaf across. Step 2: Is there a tall palisade layer only under the upper surface? → dorsiventral (dicot). Step 3: Is the mesophyll alike all through, with stomata on both sides? → isobilateral (monocot). Step 4: Look for big bulliform cells on the upper side: a grass leaf.'
      - style: real_world
        teach: 'Stumps of old trees cut for a road show rings: a wide pale band of spring wood and a thin dark band of autumn wood each year. Ring counts and widths help scientists read past rainfall, called dendrochronology.'
  items:
  - prompt: 'Scattered vascular bundles are characteristic of a:'
    options:
    - monocot stem
    - dicot stem
    - dicot root
    - dicot leaf
    answer: monocot stem
    difficulty: 1
    hints:
    - Maize.
    - No ring.
    solution: "In a monocot stem the vascular bundles are scattered through the ground tissue; dicot stems have them in a ring."
    mistakes:
      dicot stem: c11b_bundle
  - prompt: 'Casparian strips are found in the:'
    options:
    - endodermis
    - epidermis
    - pericycle
    - pith
    answer: endodermis
    difficulty: 2
    hints:
    - Innermost cortex layer.
    - Suberin bands.
    solution: "Casparian strips are bands of suberin in the walls of endodermis cells that control water entry."
    mistakes: {"epidermis": "b11_casparian", "pericycle": "b11_casparian", "pith": "b11_casparian"}
  - prompt: 'Bulliform cells, which help leaves roll up, are found in:'
    options:
    - monocot (grass) leaves
    - dicot leaves
    - roots
    - stems
    answer: monocot (grass) leaves
    difficulty: 2
    hints:
    - Isobilateral leaves.
    - Water loss.
    solution: "Bulliform cells in grass leaves lose water and shrink, rolling the leaf to cut water loss."
    mistakes: {"dicot leaves": "b11_bulliform", "roots": "b11_bulliform", "stems": "b11_bulliform"}
  - prompt: 'Palisade mesophyll is found in a:'
    options:
    - "dorsiventral (dicot) leaf"
    - "monocot root (fibrous)"
    - "monocot stem (scattered)"
    - "dicot root (tap root)"
    answer: dorsiventral (dicot) leaf
    difficulty: 2
    hints:
    - Upper side.
    - Column cells.
    solution: "A dicot leaf is dorsiventral, with tall palisade cells under the upper surface."
    mistakes: {"monocot root (fibrous)": "b11_palisade", "monocot stem (scattered)": "b11_palisade", "dicot root (tap root)": "b11_palisade"}
  - prompt: A tree trunk shows 25 pairs of light and dark rings. How old is the tree (in years)?
    answer: '25'
    check: '25'
    difficulty: 1
    hints:
    - One pair per year.
    - Count pairs.
    solution: "Each year adds one light (spring) and one dark (autumn) ring, so 25 pairs = 25 years."
    mistakes:
      '50': c11b_rings
  - prompt: 'Vascular bundles with cambium between xylem and phloem are called:'
    options:
    - open
    - closed
    - radial
    - concentric
    answer: open
    difficulty: 2
    hints:
    - Can grow more.
    - Dicot stem.
    solution: "Cambium can make new xylem and phloem, so these bundles are called open."
    mistakes: {"closed": "b11_open_bundle", "radial": "b11_open_bundle", "concentric": "b11_open_bundle"}
  - prompt: 'Casparian strips are made of:'
    options:
    - suberin
    - cellulose only
    - chitin
    answer: suberin
    difficulty: 1
    hints:
    - A waxy, waterproof substance.
    - It blocks the path between cells.
    solution: 'Step 1: waxy band in endodermal walls. Step 2: suberin.'
    mistakes:
      cellulose only: c11b06_organ
      chitin: c11b06_organ
  - prompt: 'Lateral roots arise from the:'
    options:
    - pericycle
    - epidermis
    - cortex
    answer: pericycle
    difficulty: 1
    hints:
    - It is just inside the endodermis.
    - It can divide.
    solution: 'Step 1: inner layer that keeps dividing. Step 2: pericycle.'
    mistakes:
      epidermis: c11b06_organ
      cortex: c11b06_organ
  - prompt: 'In a dicot leaf, more stomata are usually on the:'
    options:
    - lower surface
    - upper surface
    - petiole
    answer: lower surface
    difficulty: 1
    hints:
    - Less direct sunlight there.
    - Less water lost.
    solution: 'Step 1: shaded side. Step 2: lower surface.'
    mistakes:
      upper surface: c11b06_organ
      petiole: c11b06_organ
  - prompt: 'Monocot stem bundles are ''closed'' because they:'
    options:
    - have no cambium
    - have no xylem
    - are inside a pith
    answer: have no cambium
    difficulty: 2
    hints:
    - Open bundles can make more tissue.
    - What is missing between xylem and phloem?
    solution: 'Step 1: no cambium. Step 2: closed bundles.'
    mistakes:
      have no xylem: c11b06_organ
      are inside a pith: c11b06_organ
  - prompt: 'The hypodermis of a dicot stem is made of:'
    options:
    - collenchyma
    - sclerenchyma
    - xylem
    answer: collenchyma
    difficulty: 2
    hints:
    - It gives flexible support to young stems.
    - Monocot stems use sclerenchyma instead.
    solution: 'Step 1: living, thickened corners. Step 2: collenchyma.'
    mistakes:
      sclerenchyma: c11b06_organ
      xylem: c11b06_organ
  - prompt: 'In a dicot stem the endodermis is rich in starch and is also called the:'
    options:
    - starch sheath
    - pericycle
    - bundle cap
    answer: starch sheath
    difficulty: 2
    hints:
    - Its cells store starch grains.
    - The name says what it holds.
    solution: 'Step 1: starchy endodermis. Step 2: starch sheath.'
    mistakes:
      pericycle: c11b06_organ
      bundle cap: c11b06_organ
  - prompt: A dicot root usually has how many xylem bundles?
    options:
    - 2 to 4
    - more than 6
    - exactly 1
    answer: 2 to 4
    difficulty: 2
    hints:
    - Fewer than a monocot root.
    - Diarch to tetrarch.
    solution: 'Step 1: few xylem patches. Step 2: 2 to 4.'
    mistakes:
      more than 6: c11b06_organ
      exactly 1: c11b06_organ
  - prompt: 'Light-coloured wood formed in spring with wide vessels is called:'
    options:
    - early wood (spring wood)
    - late wood
    - heartwood
    answer: early wood (spring wood)
    difficulty: 3
    hints:
    - Cambium is very active in spring.
    - Autumn wood is darker and denser.
    solution: 'Step 1: active growth, wide vessels. Step 2: spring wood.'
    mistakes:
      late wood: c11b06_organ
      heartwood: c11b06_organ
  - prompt: Why do monocot stems usually not grow much thicker with age?
    options:
    - "their bundles are closed, with no cambium"
    - "they have no xylem at all in their bundles"
    - "they lack an epidermis around the stem"
    answer: their bundles are closed, with no cambium
    difficulty: 3
    hints:
    - Secondary growth needs a dividing layer.
    - Is it present in monocot bundles?
    solution: 'Step 1: no vascular cambium. Step 2: little secondary growth.'
    mistakes:
      "they have no xylem at all in their bundles": c11b06_organ
      "they lack an epidermis around the stem": c11b06_organ
  - prompt: 'Assertion (A): Monocot stems do not show secondary growth in thickness.

      Reason (R): Their vascular bundles are closed, with no cambium.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Without cambium no new xylem and phloem can form, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Grass leaves roll up during dry weather.

      Reason (R): Bulliform cells lose water and become flaccid.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Limp bulliform cells let the leaf curl and cut water loss, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A section shows radial bundles, a Casparian strip in the endodermis, about eight xylem bundles and a large pith. Which organ is it?'
    options:
    - Monocot root
    - Dicot root
    - Monocot stem
    answer: Monocot root
    hints:
    - Radial bundles and an endodermis with strips mean which organ?
    - How many xylem bundles does a dicot root usually have?
    solution: Radial bundles with Casparian strips mean a root; many xylem bundles and a large pith mean a monocot root.
    mistakes:
      Dicot root: c11b_bundle
      Monocot stem: c11b06_organ
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student examines a leaf section with palisade cells only under the upper epidermis and more stomata on the lower surface. What kind of leaf is it?'
    options:
    - Dorsiventral (dicot) leaf
    - Isobilateral (monocot) leaf
    - A stem, not a leaf
    answer: Dorsiventral (dicot) leaf
    hints:
    - Are the two sides of the leaf alike?
    - Which leaf has palisade on one side only?
    solution: Different upper and lower sides with palisade above make it a dorsiventral dicot leaf.
    mistakes:
      Isobilateral (monocot) leaf: c11b06_organ
      A stem, not a leaf: c11b06_organ
    exam: competency
    difficulty: 2
