# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse11-bio
chapter: 6
title: Anatomy of Flowering Plants
tips:
  c11b_bundle: "Dicot stems have bundles in a ring, with cambium. In which group are they scattered all over the stem, with no cambium?"
  c11b_rings: Each year one light (spring) and one dark (autumn) band of wood forms; counting pairs gives the age.
  b11_bulliform: "Grass leaves roll up in dry weather to save water. Which leaf type is grass?"
  b11_casparian: "The Casparian strip controls what enters the vascular core. Which innermost cortical layer encircles it?"
  b11_collenchyma: "Sclerenchyma is rigid and dead. Which living tissue with thickened corners still bends?"
  b11_companion: "Sieve tubes have no nucleus and need neighbour cells to run them. Where are sieve tubes?"
  b11_guard_grass: "Dicot guard cells are bean-shaped; grass guard cells have a narrow middle and swollen ends."
  b11_intercalary: "'Intercalary' means inserted in between. Grasses regrow after grazing from where?"
  b11_open_bundle: "Cambium lets the bundle keep making new tissue. Is such a bundle shut off from further growth, or not?"
  b11_palisade: "A dorsiventral leaf has a distinct upper and lower side; palisade sits under the upper surface."
  b11_sclerenchyma: "Sclerenchyma gives hard support, like coconut fibres. Is that tissue alive and soft?"
  b11_xylem: "Phloem moves food. Which tissue carries water up from roots?"
concepts:
- code: cbse11b.anat.tissues
  title: Tissues and tissue systems
  notes: |
    Meristems: apical, intercalary, lateral (cambium); primary and secondary growth. Permanent tissues: simple—parenchyma,
    collenchyma (thickened corners, support in young stems), sclerenchyma (fibres, sclereids; lignified, dead); complex—
    xylem (tracheids, vessels, xylem fibres, xylem parenchyma; protoxylem, metaxylem; endarch in stems, exarch in roots)
    and phloem (sieve tubes, companion cells, phloem parenchyma, fibres). Tissue systems: epidermal (cuticle, stomata
    with guard cells: bean-shaped in dicots, dumb-bell in grasses; trichomes, root hairs), ground, vascular. Vascular bundles:
    radial, conjoint, open/closed.
  explanations:
    text: Plants have growing tissues (meristems) at their tips and sides, and permanent tissues that do particular jobs. Xylem carries water up; phloem carries food. The epidermis protects, and stomata in it let gases in and out.
    visual: 'Draw a tree trunk''s tissues as pipes: xylem as water pipes going up, phloem as food pipes going both ways, and cambium as a thin growing layer between them.'
    step_by_step: 'Step 1: Is the tissue dividing? Meristem. Step 2: Living with thin walls? Parenchyma. Step 3: Dead and lignified? Sclerenchyma. Step 4: Conducting water or food? Xylem or phloem.'
    real_world: Jute and coir fibres, used for sacks and ropes, are sclerenchyma fibres.
  picture:
    kind: compare
    columns:
    - title: Tissue
      points:
      - xylem
      - phloem
      - sclerenchyma
      - collenchyma
    - title: Job
      points:
      - carries water and minerals
      - carries food
      - strength (dead cells)
      - flexible support
    alt: Plant tissues and their jobs.
  activity:
    type: sort
    prompt: Sort each plant tissue.
    bins:
    - Meristematic
    - Simple permanent
    - Complex permanent
    items:
    - label: Apical meristem
      bin: Meristematic
      clue: Do its cells keep dividing?
      why: Actively dividing cells at shoot and root tips.
    - label: Vascular cambium
      bin: Meristematic
      clue: Does it still divide, adding new tissue?
      why: A lateral meristem that makes secondary growth.
    - label: Intercalary meristem
      bin: Meristematic
      clue: Found at the base of grass leaves. Does it divide?
      why: A dividing tissue between mature tissues.
    - label: Parenchyma
      bin: Simple permanent
      clue: Is it made of one kind of cell, which no longer divides?
      why: 'One cell type, thin walls, stores food: simple permanent.'
    - label: Collenchyma
      bin: Simple permanent
      clue: One cell type with corners thickened by pectin?
      why: A simple tissue that supports young stems.
    - label: Sclerenchyma
      bin: Simple permanent
      clue: One kind of dead, thick-walled cell?
      why: 'Fibres and sclereids: simple permanent tissue.'
    - label: Xylem
      bin: Complex permanent
      clue: 'How many cell types: tracheids, vessels, fibres, parenchyma?'
      why: 'Several cell types working together: complex.'
    - label: Phloem
      bin: Complex permanent
      clue: Sieve tubes, companion cells, fibres, parenchyma. One type or many?
      why: 'Several cell types: complex permanent.'
  items:
  - prompt: 'Water is conducted upward by:'
    options:
    - xylem
    - phloem
    - cambium
    - epidermis
    answer: xylem
    difficulty: 1
    hints:
    - Vessels and tracheids.
    - Dead cells.
    solution: Xylem.
    mistakes: {"phloem": "b11_xylem", "cambium": "b11_xylem", "epidermis": "b11_xylem"}
  - prompt: 'Companion cells are found in:'
    options:
    - phloem
    - xylem
    - cork
    - collenchyma
    answer: phloem
    difficulty: 2
    hints:
    - Help sieve tubes.
    - Food transport.
    solution: Phloem.
    mistakes: {"xylem": "b11_companion", "cork": "b11_companion", "collenchyma": "b11_companion"}
  - prompt: 'Guard cells in grasses are:'
    options:
    - dumb-bell shaped
    - bean shaped
    - star shaped
    - absent
    answer: dumb-bell shaped
    difficulty: 2
    hints:
    - Monocot grasses.
    - 'Dicots: bean.'
    solution: Dumb-bell shaped.
    mistakes: {"bean shaped": "b11_guard_grass", "star shaped": "b11_guard_grass", "absent": "b11_guard_grass"}
  - prompt: 'Intercalary meristem is found:'
    options:
    - at the base of internodes in grasses
    - at root tips
    - in cork
    - in leaves only
    answer: at the base of internodes in grasses
    difficulty: 2
    hints:
    - Grass regrows after grazing.
    - Between mature tissues.
    solution: At internode bases in grasses.
    mistakes: {"at root tips": "b11_intercalary", "in cork": "b11_intercalary", "in leaves only": "b11_intercalary"}
  - prompt: 'Sclerenchyma cells are usually:'
    options:
    - dead with lignified walls
    - living and thin-walled
    - photosynthetic
    - dividing
    answer: dead with lignified walls
    difficulty: 1
    hints:
    - Strength.
    - Fibres.
    solution: Dead and lignified.
    mistakes: {"living and thin-walled": "b11_sclerenchyma", "photosynthetic": "b11_sclerenchyma", "dividing": "b11_sclerenchyma"}
  - prompt: Which tissue gives flexible support to young stems and leaf stalks?
    options:
    - collenchyma
    - sclerenchyma
    - xylem
    - phloem
    answer: collenchyma
    difficulty: 2
    hints:
    - Thick corners.
    - Living.
    solution: Collenchyma.
    mistakes: {"sclerenchyma": "b11_collenchyma", "xylem": "b11_collenchyma", "phloem": "b11_collenchyma"}
- code: cbse11b.anat.organs
  title: Dicot and monocot anatomy
  after:
  - cbse11b.anat.tissues
  notes: |
    Dicot root: epidermis, cortex, endodermis (Casparian strips), pericycle, radial bundles (2–4 xylem), pith small.
    Monocot root: more than six xylem bundles, large pith. Dicot stem: epidermis with cuticle, hypodermis (collenchyma),
    cortex, endodermis (starch sheath), pericycle, vascular bundles in a ring, conjoint, open, endarch; pith. Monocot stem:
    sclerenchymatous hypodermis, scattered closed bundles with bundle sheath, no pith distinction. Dorsiventral (dicot)
    leaf: palisade and spongy mesophyll; isobilateral (monocot) leaf: bulliform cells. (Secondary growth is outside the
    rationalised syllabus in some years; cambium and annual rings are outlined.)
  explanations:
    text: 'Cut across a stem and look under a microscope: dicot stems have bundles of xylem and phloem in a neat ring, with cambium that lets them thicken. Monocot stems, like maize, have bundles scattered about and no cambium.'
    visual: 'Draw two circles: one with bundles arranged in a ring (dicot stem), one with bundles dotted all over (monocot stem).'
    step_by_step: 'Step 1: Look at bundle arrangement: ring or scattered. Step 2: Check for cambium (open) or not (closed). Step 3: In roots, count xylem bundles: few (dicot), many (monocot).'
    real_world: Counting annual rings in a tree trunk gives its age; wide rings mean good growing years.
  picture:
    kind: compare
    columns:
    - title: Feature
      points:
      - vascular bundles
      - cambium
      - pith
    - title: Dicot stem
      points:
      - in a ring
      - present (open)
      - large
    - title: Monocot stem
      points:
      - scattered
      - absent (closed)
      - not distinct
    alt: 'Dicot and monocot stems compared: bundle arrangement, cambium and pith.'
  activity:
    type: sort
    prompt: Which organ shows this feature in a cross-section?
    bins:
    - Dicot root
    - Monocot root
    - Dicot stem
    - Monocot stem
    items:
    - label: 2 to 4 xylem bundles; pith small or absent
      bin: Dicot root
      clue: Roots have radial bundles. How many xylem groups here?
      why: 'Few xylem bundles (di- to tetrarch) and little pith: a dicot root.'
    - label: Secondary growth from cambium between xylem and phloem
      bin: Dicot root
      clue: Which root type can thicken later?
      why: Dicot roots develop cambium; monocot roots don't.
    - label: More than 6 xylem bundles; large pith
      bin: Monocot root
      clue: Radial bundles, many of them. Which root?
      why: 'Polyarch xylem and a large pith: monocot root.'
    - label: Vascular bundles in a ring, open, with cambium
      bin: Dicot stem
      clue: Are the bundles in a ring or scattered?
      why: 'A ring of open bundles: a dicot stem.'
    - label: Hypodermis of collenchyma
      bin: Dicot stem
      clue: Which stem has collenchyma just below the epidermis?
      why: Dicot stems have a collenchyma hypodermis.
    - label: Bundles scattered, each with a sclerenchyma sheath
      bin: Monocot stem
      clue: Are the bundles in a ring?
      why: 'Scattered closed bundles: a monocot stem.'
    - label: Water-filled cavities inside the bundles
      bin: Monocot stem
      clue: Which stem has water cavities in its bundles?
      why: A feature of monocot stems.
    - label: Hypodermis of sclerenchyma
      bin: Monocot stem
      clue: Which stem has a hard sclerenchyma hypodermis?
      why: Monocot stems have a sclerenchymatous hypodermis.
  items:
  - prompt: 'Scattered vascular bundles are characteristic of a:'
    options:
    - monocot stem
    - dicot stem
    - dicot root
    - dicot leaf
    answer: monocot stem
    difficulty: 1
    hints:
    - Maize.
    - No ring.
    solution: Monocot stem.
    mistakes:
      dicot stem: c11b_bundle
  - prompt: 'Casparian strips are found in the:'
    options:
    - endodermis
    - epidermis
    - pericycle
    - pith
    answer: endodermis
    difficulty: 2
    hints:
    - Innermost cortex layer.
    - Suberin bands.
    solution: Endodermis.
    mistakes: {"epidermis": "b11_casparian", "pericycle": "b11_casparian", "pith": "b11_casparian"}
  - prompt: 'Bulliform cells, which help leaves roll up, are found in:'
    options:
    - monocot (grass) leaves
    - dicot leaves
    - roots
    - stems
    answer: monocot (grass) leaves
    difficulty: 2
    hints:
    - Isobilateral leaves.
    - Water loss.
    solution: Grass leaves.
    mistakes: {"dicot leaves": "b11_bulliform", "roots": "b11_bulliform", "stems": "b11_bulliform"}
  - prompt: 'Palisade mesophyll is found in a:'
    options:
    - dorsiventral (dicot) leaf
    - monocot root
    - monocot stem
    - dicot root
    answer: dorsiventral (dicot) leaf
    difficulty: 2
    hints:
    - Upper side.
    - Column cells.
    solution: A dicot leaf.
    mistakes: {"monocot root": "b11_palisade", "monocot stem": "b11_palisade", "dicot root": "b11_palisade"}
  - prompt: A tree trunk shows 25 pairs of light and dark rings. How old is the tree (in years)?
    answer: '25'
    check: '25'
    difficulty: 1
    hints:
    - One pair per year.
    - Count pairs.
    solution: 25 years.
    mistakes:
      '50': c11b_rings
  - prompt: 'Vascular bundles with cambium between xylem and phloem are called:'
    options:
    - open
    - closed
    - radial
    - concentric
    answer: open
    difficulty: 2
    hints:
    - Can grow more.
    - Dicot stem.
    solution: Open bundles.
    mistakes: {"closed": "b11_open_bundle", "radial": "b11_open_bundle", "concentric": "b11_open_bundle"}
