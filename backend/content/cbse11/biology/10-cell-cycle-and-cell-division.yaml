# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse11-bio
chapter: 10
title: Cell Cycle and Cell Division
tips:
  c11b_phase: 'Mitosis phases in order: prophase, metaphase, anaphase, telophase (PMAT). Chromosomes line up in metaphase and separate in anaphase.'
  c11b_meiosis: Mitosis gives 2 identical diploid cells; meiosis gives 4 different haploid cells.
  b11_anaphase1: "In meiosis I the pairs part; sister chromatids stay together until meiosis II."
  b11_cell_plate: "Plant cells have rigid walls and cannot pinch in. They build a new wall from the middle outward."
  b11_cycle_time: "A human cell divides about once a day."
  b11_g0: "G0 is the resting stage outside the cycle, like nerve cells."
  b11_meiosis_half: "Meiosis halves the chromosome number."
  b11_pachytene: "Crossing over needs chromosomes already paired and thickened. It happens in the stage right after pairing is complete."
  b11_s_phase: "'S' stands for synthesis. Of what?"
  b11_variation: "Two events in prophase I and metaphase I shuffle genes: one swaps segments, the other lines up pairs randomly."
  b11_zygotene: "Synapsis follows leptotene, the second stage of prophase I. 'Zygo' means yoke or pairing."
concepts:
- code: cbse11b.cycle.mitosis
  title: Cell cycle and mitosis
  notes: |
    Cell cycle: interphase (G1, S—DNA replication, G2) and M phase (karyokinesis + cytokinesis). Human cell cycle about 24
    h; yeast about 90 min; M phase about an hour. G0 (quiescent stage). Mitosis (equational division): prophase
    (chromatin condenses, spindle forms), metaphase (chromosomes at equatorial plate, attached to spindle by kinetochores),
    anaphase (centromeres split, chromatids move to poles), telophase (nuclear envelope reforms). Cytokinesis: furrow in
    animal cells, cell plate in plant cells. Significance: growth, repair, keeps chromosome number constant.
  explanations:
    text: Cells grow and copy their DNA during interphase, then divide in mitosis. Mitosis makes two daughter cells with exactly the same chromosomes as the parent, which is how we grow and heal wounds.
    visual: 'Draw four pictures: chromosomes thickening (prophase), lined up across the middle (metaphase), pulled apart (anaphase), two new nuclei forming (telophase).'
    step_by_step: 'Step 1: Interphase: G1 (growth), S (DNA copied), G2 (prepare). Step 2: Mitosis: PMAT. Step 3: Cytokinesis splits the cytoplasm.'
    real_world: Cancer happens when cells escape the controls of the cell cycle and keep dividing.
  picture:
    kind: flow
    steps:
    - G1 (growth)
    - S (DNA copied)
    - G2 (prepare)
    - Mitosis
    - Cytokinesis
    alt: 'The cell cycle: G1, S, G2, mitosis, then cytokinesis.'
  activity:
    type: order
    prompt: Put the cell cycle in order, from just after a division.
    steps:
    - 'G1: the cell grows'
    - 'S: the DNA is copied'
    - 'G2: proteins for division are made'
    - 'Prophase: chromosomes condense'
    - 'Metaphase: chromosomes line up in the middle'
    - 'Anaphase: sister chromatids are pulled apart'
    - 'Telophase: nuclear envelopes form again'
    - 'Cytokinesis: the cytoplasm divides'
    reasons:
      'S: the DNA is copied': DNA is copied only after the cell has grown in G1.
      'G2: proteins for division are made': 'G2 follows S: the cell checks its copied DNA and prepares to divide.'
      'Prophase: chromosomes condense': Mitosis begins only after interphase (G1, S, G2) is complete.
      'Metaphase: chromosomes line up in the middle': Chromosomes must first condense and attach to spindle fibres before they line up.
      'Anaphase: sister chromatids are pulled apart': Chromatids separate only once every chromosome is lined up on the metaphase plate.
      'Telophase: nuclear envelopes form again': Nuclei re-form only after the chromatids reach the poles.
      'Cytokinesis: the cytoplasm divides': The cell splits in two last, after the nuclei have formed.
  items:
  - prompt: A human cell cycle takes about how many hours?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - About a day.
    - M phase about 1 h.
    solution: About 24 hours.
    mistakes: {"12": "b11_cycle_time", "48": "b11_cycle_time", "1": "b11_cycle_time"}
  - prompt: A cell with 46 chromosomes divides by mitosis. How many chromosomes does each daughter cell have?
    answer: '46'
    check: '46'
    difficulty: 1
    hints:
    - Equational division.
    - Same as parent.
    solution: '46.'
    mistakes:
      '23': c11b_meiosis
  - prompt: 'DNA is copied during the:'
    options:
    - S phase
    - G1 phase
    - G2 phase
    - M phase
    answer: S phase
    difficulty: 1
    hints:
    - Synthesis.
    - Interphase.
    solution: S phase.
    mistakes: {"G1 phase": "b11_s_phase", "G2 phase": "b11_s_phase", "M phase": "b11_s_phase"}
  - prompt: 'Chromosomes line up at the equator during:'
    options:
    - metaphase
    - prophase
    - anaphase
    - telophase
    answer: metaphase
    difficulty: 1
    hints:
    - Middle.
    - M for middle.
    solution: Metaphase.
    mistakes:
      anaphase: c11b_phase
  - prompt: 'In plant cells, cytokinesis takes place by forming a:'
    options:
    - cell plate
    - cleavage furrow
    - spindle
    - nucleolus
    answer: cell plate
    difficulty: 2
    hints:
    - Rigid wall.
    - Builds from the middle.
    solution: A cell plate.
    mistakes: {"cleavage furrow": "b11_cell_plate", "spindle": "b11_cell_plate", "nucleolus": "b11_cell_plate"}
  - prompt: 'Cells that stop dividing and leave the cycle enter:'
    options:
    - G0 phase
    - S phase
    - M phase
    - G2 phase
    answer: G0 phase
    difficulty: 2
    hints:
    - Quiescent.
    - Like many nerve cells.
    solution: G0 phase.
    mistakes: {"S phase": "b11_g0", "M phase": "b11_g0", "G2 phase": "b11_g0"}
- code: cbse11b.cycle.meiosis
  title: Meiosis
  after:
  - cbse11b.cycle.mitosis
  notes: |
    Meiosis (reductional division) in gamete/spore formation: one DNA replication, two divisions, four haploid cells.
    Meiosis I: prophase I (leptotene, zygotene—synapsis, synaptonemal complex, bivalents; pachytene—crossing over,
    recombination nodules; diplotene—chiasmata; diakinesis), metaphase I (bivalents at equator), anaphase I (homologous
    chromosomes separate), telophase I. Interkinesis. Meiosis II resembles mitosis (sister chromatids separate).
    Significance: keeps chromosome number constant across generations; variation through crossing over and independent
    assortment.
  explanations:
    text: Meiosis makes sex cells (gametes). It halves the chromosome number, so when sperm and egg join, the baby has the right number. Swapping bits between chromosomes (crossing over) makes each gamete different, giving variation.
    visual: Draw one cell with two pairs of chromosomes. After meiosis I there are two cells with one of each pair; after meiosis II, four cells, each with half the chromosomes.
    step_by_step: 'Step 1: Meiosis I separates homologous pairs (number halves). Step 2: Meiosis II separates sister chromatids. Step 3: Result: four haploid cells.'
    real_world: Crossing over is why brothers and sisters look different even with the same parents.
  picture:
    kind: flow
    steps:
    - Leptotene
    - Zygotene (pairing)
    - Pachytene (crossing over)
    - Diplotene (chiasmata)
    - Diakinesis
    alt: The five stages of prophase I in meiosis.
  activity:
    type: order
    prompt: Put the stages of prophase I of meiosis in order.
    steps:
    - 'Leptotene: chromosomes become visible'
    - 'Zygotene: homologous chromosomes pair up (synapsis)'
    - 'Pachytene: crossing over between chromatids'
    - 'Diplotene: homologues pull apart except at chiasmata'
    - 'Diakinesis: chiasmata end; nuclear envelope breaks'
    reasons:
      'Zygotene: homologous chromosomes pair up (synapsis)': Chromosomes must first be visible as threads before the homologous pairs can find each other.
      'Pachytene: crossing over between chromatids': Crossing over needs the homologues already paired as bivalents.
      'Diplotene: homologues pull apart except at chiasmata': The X-shaped chiasmata show where crossing over has already happened.
      'Diakinesis: chiasmata end; nuclear envelope breaks': This is the last stage, leading into metaphase I.
  items:
  - prompt: How many daughter cells does one meiosis produce?
    answer: '4'
    check: 2*2
    difficulty: 1
    hints:
    - Two divisions.
    - 2 × 2.
    solution: Four.
    mistakes:
      '2': c11b_meiosis
  - prompt: A cell with 46 chromosomes undergoes meiosis. How many chromosomes are in each gamete?
    answer: '23'
    check: 46/2
    difficulty: 1
    hints:
    - Halved.
    - 46 ÷ 2.
    solution: '23.'
    mistakes: {"46": "b11_meiosis_half", "92": "b11_meiosis_half", "12": "b11_meiosis_half"}
  - prompt: 'Crossing over happens during:'
    options:
    - pachytene
    - leptotene
    - zygotene
    - diakinesis
    answer: pachytene
    difficulty: 2
    hints:
    - Thick threads.
    - Recombination nodules.
    solution: Pachytene.
    mistakes: {"leptotene": "b11_pachytene", "zygotene": "b11_pachytene", "diakinesis": "b11_pachytene"}
  - prompt: 'Pairing of homologous chromosomes (synapsis) begins in:'
    options:
    - zygotene
    - pachytene
    - diplotene
    - leptotene
    answer: zygotene
    difficulty: 2
    hints:
    - Zygo = paired.
    - Synaptonemal complex.
    solution: Zygotene.
    mistakes: {"pachytene": "b11_zygotene", "diplotene": "b11_zygotene", "leptotene": "b11_zygotene"}
  - prompt: In anaphase I, what separates?
    options:
    - homologous chromosomes
    - sister chromatids
    - centrioles only
    - nucleoli
    answer: homologous chromosomes
    difficulty: 2
    hints:
    - Reductional.
    - Chromatids stay together.
    solution: Homologous chromosomes.
    mistakes: {"sister chromatids": "b11_anaphase1", "centrioles only": "b11_anaphase1", "nucleoli": "b11_anaphase1"}
  - prompt: 'The main sources of variation in meiosis are:'
    options:
    - crossing over and independent assortment
    - DNA copying errors only
    - mitosis and cytokinesis
    - cell plate formation
    answer: crossing over and independent assortment
    difficulty: 2
    hints:
    - Mixing genes.
    - Random lining up.
    solution: Crossing over and independent assortment.
    mistakes: {"DNA copying errors only": "b11_variation", "mitosis and cytokinesis": "b11_variation", "cell plate formation": "b11_variation"}
