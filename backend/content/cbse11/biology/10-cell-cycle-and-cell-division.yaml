# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse11-bio
chapter: 10
title: Cell Cycle and Cell Division
tips:
  c11b_phase: "Mitosis phases go P M A T. Chromosomes gather in the middle (meta = middle) and then move apart (ana = apart). Which one is lining up?"
  c11b_meiosis: "Mitosis makes identical copies with the same chromosome number. Meiosis has two divisions in a row: how many cells come from one?"
  b11_anaphase1: "In meiosis I the pairs part; sister chromatids stay together until meiosis II."
  b11_cell_plate: "Plant cells have rigid walls and cannot pinch in. They build a new wall from the middle outward."
  b11_cycle_time: "A human cell divides about once a day."
  b11_g0: "G0 is the resting stage outside the cycle, like nerve cells."
  b11_meiosis_half: "Meiosis halves the chromosome number."
  b11_pachytene: "Crossing over needs chromosomes already paired and thickened. It happens in the stage right after pairing is complete."
  b11_s_phase: "'S' stands for synthesis. Of what?"
  b11_variation: "Two events in prophase I and metaphase I shuffle genes: one swaps segments, the other lines up pairs randomly."
  b11_zygotene: "Synapsis follows leptotene, the second stage of prophase I. 'Zygo' means yoke or pairing."
  c11b10_mit: 'Mitosis keeps the chromosome number the same; meiosis halves it. Picture each phase: condense, line up, pull apart, rebuild.'
  c11b10_mei: In meiosis I homologous pairs separate; in meiosis II sister chromatids separate.
concepts:
- code: cbse11b.cycle.mitosis
  title: Cell cycle and mitosis
  notes: |
    Cell cycle: interphase (G1, S—DNA replication, G2) and M phase (karyokinesis + cytokinesis). Human cell cycle about 24
    h; yeast about 90 min; M phase about an hour. G0 (quiescent stage). Mitosis (equational division): prophase
    (chromatin condenses, spindle forms), metaphase (chromosomes at equatorial plate, attached to spindle by kinetochores),
    anaphase (centromeres split, chromatids move to poles), telophase (nuclear envelope reforms). Cytokinesis: furrow in
    animal cells, cell plate in plant cells. Significance: growth, repair, keeps chromosome number constant.
  explanations:
    text: Cells grow and copy their DNA during interphase, then divide in mitosis. Mitosis makes two daughter cells with exactly the same chromosomes as the parent, which is how we grow and heal wounds.
    visual: 'Draw four pictures: chromosomes thickening (prophase), lined up across the middle (metaphase), pulled apart (anaphase), two new nuclei forming (telophase).'
    step_by_step: 'Step 1: Interphase: G1 (growth), S (DNA copied), G2 (prepare). Step 2: Mitosis: PMAT. Step 3: Cytokinesis splits the cytoplasm.'
    real_world: Cancer happens when cells escape the controls of the cell cycle and keep dividing.
  picture:
    kind: flow
    steps:
    - G1 (growth)
    - S (DNA copied)
    - G2 (prepare)
    - Mitosis
    - Cytokinesis
    alt: 'The cell cycle: G1, S, G2, mitosis, then cytokinesis.'
  activity:
    type: order
    prompt: Put the cell cycle in order, from just after a division.
    steps:
    - 'G1: the cell grows'
    - 'S: the DNA is copied'
    - 'G2: proteins for division are made'
    - 'Prophase: chromosomes condense'
    - 'Metaphase: chromosomes line up in the middle'
    - 'Anaphase: sister chromatids are pulled apart'
    - 'Telophase: nuclear envelopes form again'
    - 'Cytokinesis: the cytoplasm divides'
    reasons:
      'S: the DNA is copied': DNA is copied only after the cell has grown in G1.
      'G2: proteins for division are made': 'G2 follows S: the cell checks its copied DNA and prepares to divide.'
      'Prophase: chromosomes condense': Mitosis begins only after interphase (G1, S, G2) is complete.
      'Metaphase: chromosomes line up in the middle': Chromosomes must first condense and attach to spindle fibres before they line up.
      'Anaphase: sister chromatids are pulled apart': Chromatids separate only once every chromosome is lined up on the metaphase plate.
      'Telophase: nuclear envelopes form again': Nuclei re-form only after the chromatids reach the poles.
      'Cytokinesis: the cytoplasm divides': The cell splits in two last, after the nuclei have formed.
  lesson:
    - teach: The cell cycle has interphase (G1 growth, S DNA copying, G2 preparation) and M phase (division). Interphase takes most of the time. Cells that stop dividing enter G0.
      check:
        prompt: 'DNA content doubles in:'
        options:
        - S phase
        - G1 phase
        - M phase
        answer: S phase
        why: S = synthesis of DNA.
    - teach: 'Mitosis: prophase (chromosomes condense, spindle forms), metaphase (chromosomes line up at the equator, held at kinetochores), anaphase (centromeres split, chromatids move to poles), telophase (nuclei reform).'
      check:
        prompt: 'Sister chromatids separate in:'
        options:
        - anaphase
        - metaphase
        - prophase
        answer: anaphase
        why: Centromeres split and chromatids move apart.
    - teach: 'Cytokinesis splits the cytoplasm: a furrow in animal cells, a cell plate in plant cells. Mitosis keeps the chromosome number the same and is used for growth and repair.'
      picture:
        kind: flow
        steps:
        - Prophase
        - Metaphase
        - Anaphase
        - Telophase
        - Cytokinesis
        alt: Stages of mitosis in order.
      check:
        prompt: 'Mitosis in a cell with 20 chromosomes gives cells with:'
        options:
        - 20 each
        - 10 each
        - 40 each
        answer: 20 each
        why: Equational division.
  items:
  - prompt: A human cell cycle takes about how many hours?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - About a day.
    - M phase about 1 h.
    solution: About 24 hours.
    mistakes: {"12": "b11_cycle_time", "48": "b11_cycle_time", "1": "b11_cycle_time"}
  - prompt: A cell with 46 chromosomes divides by mitosis. How many chromosomes does each daughter cell have?
    answer: '46'
    check: '46'
    difficulty: 1
    hints:
    - Equational division.
    - Same as parent.
    solution: '46.'
    mistakes:
      '23': c11b_meiosis
  - prompt: 'DNA is copied during the:'
    options:
    - S phase
    - G1 phase
    - G2 phase
    - M phase
    answer: S phase
    difficulty: 1
    hints:
    - Synthesis.
    - Interphase.
    solution: S phase.
    mistakes: {"G1 phase": "b11_s_phase", "G2 phase": "b11_s_phase", "M phase": "b11_s_phase"}
  - prompt: 'Chromosomes line up at the equator during:'
    options:
    - metaphase
    - prophase
    - anaphase
    - telophase
    answer: metaphase
    difficulty: 1
    hints:
    - Middle.
    - M for middle.
    solution: Metaphase.
    mistakes:
      anaphase: c11b_phase
  - prompt: 'In plant cells, cytokinesis takes place by forming a:'
    options:
    - cell plate
    - cleavage furrow
    - spindle
    - nucleolus
    answer: cell plate
    difficulty: 2
    hints:
    - Rigid wall.
    - Builds from the middle.
    solution: A cell plate.
    mistakes: {"cleavage furrow": "b11_cell_plate", "spindle": "b11_cell_plate", "nucleolus": "b11_cell_plate"}
  - prompt: 'Cells that stop dividing and leave the cycle enter:'
    options:
    - G0 phase
    - S phase
    - M phase
    - G2 phase
    answer: G0 phase
    difficulty: 2
    hints:
    - Quiescent.
    - Like many nerve cells.
    solution: G0 phase.
    mistakes: {"S phase": "b11_g0", "M phase": "b11_g0", "G2 phase": "b11_g0"}
  - prompt: A yeast cell cycle takes about how many minutes?
    answer: '90'
    check: '90'
    difficulty: 1
    hints:
    - Much shorter than a human cell's 24 hours.
    - About an hour and a half.
    solution: 'Step 1: about 1.5 h. Step 2: 90 minutes.'
    mistakes:
      '24': c11b10_mit
      '60': c11b10_mit
  - prompt: 'The nuclear envelope re-forms in:'
    options:
    - telophase
    - prophase
    - metaphase
    answer: telophase
    difficulty: 1
    hints:
    - It is the last stage.
    - Two new nuclei form.
    solution: 'Step 1: chromosomes at poles. Step 2: envelope re-forms in telophase.'
    mistakes:
      prophase: c11b10_mit
      metaphase: c11b10_mit
  - prompt: 'Mitosis is also called:'
    options:
    - equational division
    - reductional division
    - budding
    answer: equational division
    difficulty: 1
    hints:
    - Daughter cells have the same number as the parent.
    - Equal number of chromosomes.
    solution: 'Step 1: number unchanged. Step 2: equational division.'
    mistakes:
      reductional division: c11b10_mit
      budding: c11b10_mit
  - prompt: 'Spindle fibres attach to chromosomes at the:'
    options:
    - kinetochores
    - telomeres
    - nucleoli
    answer: kinetochores
    difficulty: 2
    hints:
    - Small disc-shaped structures at the centromere.
    - Kineto relates to movement.
    solution: 'Step 1: attachment points on centromeres. Step 2: kinetochores.'
    mistakes:
      telomeres: c11b10_mit
      nucleoli: c11b10_mit
  - prompt: A cell has 8 chromosomes in G1. How many chromatids does it have in G2?
    answer: '16'
    check: 8*2
    difficulty: 2
    hints:
    - DNA is copied in S phase.
    - Each chromosome then has two chromatids.
    solution: 'Step 1: 8 chromosomes × 2 chromatids. Step 2: 16.'
    mistakes:
      '8': c11b10_mit
      '32': c11b10_mit
  - prompt: Chromosomes are best studied at which stage?
    options:
    - metaphase
    - interphase
    - telophase
    answer: metaphase
    difficulty: 2
    hints:
    - They are most condensed then.
    - They line up neatly.
    solution: 'Step 1: maximum condensation. Step 2: metaphase.'
    mistakes:
      interphase: c11b10_mit
      telophase: c11b10_mit
  - prompt: Why can't a plant cell divide by forming a furrow?
    options:
    - its rigid cell wall cannot pinch in
    - it has no cytoplasm
    - it has no spindle
    answer: its rigid cell wall cannot pinch in
    difficulty: 2
    hints:
    - Animal cells are soft at the edge.
    - What surrounds a plant cell?
    solution: 'Step 1: wall is rigid. Step 2: cell plate forms from the middle instead.'
    mistakes:
      it has no cytoplasm: c11b10_mit
      it has no spindle: c11b10_mit
  - prompt: In a cell cycle of 24 h, M phase takes about 1 h. What fraction of the time is interphase?
    answer: 23/24
    check: 23/24
    difficulty: 3
    hints:
    - Interphase = total − M phase.
    - Divide by 24.
    solution: 'Step 1: 23 h. Step 2: 23/24.'
    mistakes:
      1/24: c11b10_mit
      1/2: c11b10_mit
  - prompt: 'Mature heart muscle cells and neurons mostly do not divide. They are in:'
    options:
    - G0
    - S phase
    - anaphase
    answer: G0
    difficulty: 3
    hints:
    - They have left the cycle.
    - A resting, non-dividing stage.
    solution: 'Step 1: quiescent cells. Step 2: G0.'
    mistakes:
      S phase: c11b10_mit
      anaphase: c11b10_mit
- code: cbse11b.cycle.meiosis
  title: Meiosis
  after:
  - cbse11b.cycle.mitosis
  notes: |
    Meiosis (reductional division) in gamete/spore formation: one DNA replication, two divisions, four haploid cells.
    Meiosis I: prophase I (leptotene, zygotene—synapsis, synaptonemal complex, bivalents; pachytene—crossing over,
    recombination nodules; diplotene—chiasmata; diakinesis), metaphase I (bivalents at equator), anaphase I (homologous
    chromosomes separate), telophase I. Interkinesis. Meiosis II resembles mitosis (sister chromatids separate).
    Significance: keeps chromosome number constant across generations; variation through crossing over and independent
    assortment.
  explanations:
    text: Meiosis makes sex cells (gametes). It halves the chromosome number, so when sperm and egg join, the baby has the right number. Swapping bits between chromosomes (crossing over) makes each gamete different, giving variation.
    visual: Draw one cell with two pairs of chromosomes. After meiosis I there are two cells with one of each pair; after meiosis II, four cells, each with half the chromosomes.
    step_by_step: 'Step 1: Meiosis I separates homologous pairs (number halves). Step 2: Meiosis II separates sister chromatids. Step 3: Result: four haploid cells.'
    real_world: Crossing over is why brothers and sisters look different even with the same parents.
  picture:
    kind: flow
    steps:
    - Leptotene
    - Zygotene (pairing)
    - Pachytene (crossing over)
    - Diplotene (chiasmata)
    - Diakinesis
    alt: The five stages of prophase I in meiosis.
  activity:
    type: order
    prompt: Put the stages of prophase I of meiosis in order.
    steps:
    - 'Leptotene: chromosomes become visible'
    - 'Zygotene: homologous chromosomes pair up (synapsis)'
    - 'Pachytene: crossing over between chromatids'
    - 'Diplotene: homologues pull apart except at chiasmata'
    - 'Diakinesis: chiasmata end; nuclear envelope breaks'
    reasons:
      'Zygotene: homologous chromosomes pair up (synapsis)': Chromosomes must first be visible as threads before the homologous pairs can find each other.
      'Pachytene: crossing over between chromatids': Crossing over needs the homologues already paired as bivalents.
      'Diplotene: homologues pull apart except at chiasmata': The X-shaped chiasmata show where crossing over has already happened.
      'Diakinesis: chiasmata end; nuclear envelope breaks': This is the last stage, leading into metaphase I.
  lesson:
    - teach: Meiosis makes gametes or spores. One DNA copying is followed by two divisions, giving four haploid cells. It halves the chromosome number so fertilisation can restore it.
      check:
        prompt: 'Meiosis in a cell with 2n = 20 gives cells with:'
        options:
        - 10 chromosomes
        - 20 chromosomes
        - 40 chromosomes
        answer: 10 chromosomes
        why: Reductional division.
    - teach: 'Prophase I has five stages: leptotene (threads), zygotene (homologues pair: synapsis), pachytene (crossing over), diplotene (chiasmata visible), diakinesis (terminalisation).'
      check:
        prompt: 'X-shaped chiasmata become visible in:'
        options:
        - diplotene
        - leptotene
        - zygotene
        answer: diplotene
        why: Homologues start separating but stay linked at crossovers.
    - teach: In anaphase I homologous chromosomes separate; in anaphase II sister chromatids separate, as in mitosis. Crossing over and independent assortment create variation.
      picture:
        kind: compare
        columns:
        - title: Mitosis
          points:
          - 1 division
          - 2 cells
          - same number
        - title: Meiosis
          points:
          - 2 divisions
          - 4 cells
          - half the number
        alt: Mitosis and meiosis compared.
      check:
        prompt: 'Sister chromatids separate in:'
        options:
        - anaphase II
        - anaphase I
        - prophase I
        answer: anaphase II
        why: Meiosis II resembles mitosis.
  items:
  - prompt: How many daughter cells does one meiosis produce?
    answer: '4'
    check: 2*2
    difficulty: 1
    hints:
    - Two divisions.
    - 2 × 2.
    solution: Four.
    mistakes:
      '2': c11b_meiosis
  - prompt: A cell with 46 chromosomes undergoes meiosis. How many chromosomes are in each gamete?
    answer: '23'
    check: 46/2
    difficulty: 1
    hints:
    - Halved.
    - 46 ÷ 2.
    solution: '23.'
    mistakes: {"46": "b11_meiosis_half", "92": "b11_meiosis_half", "12": "b11_meiosis_half"}
  - prompt: 'Crossing over happens during:'
    options:
    - pachytene
    - leptotene
    - zygotene
    - diakinesis
    answer: pachytene
    difficulty: 2
    hints:
    - Thick threads.
    - Recombination nodules.
    solution: Pachytene.
    mistakes: {"leptotene": "b11_pachytene", "zygotene": "b11_pachytene", "diakinesis": "b11_pachytene"}
  - prompt: 'Pairing of homologous chromosomes (synapsis) begins in:'
    options:
    - zygotene
    - pachytene
    - diplotene
    - leptotene
    answer: zygotene
    difficulty: 2
    hints:
    - Zygo = paired.
    - Synaptonemal complex.
    solution: Zygotene.
    mistakes: {"pachytene": "b11_zygotene", "diplotene": "b11_zygotene", "leptotene": "b11_zygotene"}
  - prompt: In anaphase I, what separates?
    options:
    - homologous chromosomes
    - sister chromatids
    - centrioles only
    - nucleoli
    answer: homologous chromosomes
    difficulty: 2
    hints:
    - Reductional.
    - Chromatids stay together.
    solution: Homologous chromosomes.
    mistakes: {"sister chromatids": "b11_anaphase1", "centrioles only": "b11_anaphase1", "nucleoli": "b11_anaphase1"}
  - prompt: 'The main sources of variation in meiosis are:'
    options:
    - crossing over and independent assortment
    - DNA copying errors only
    - mitosis and cytokinesis
    - cell plate formation
    answer: crossing over and independent assortment
    difficulty: 2
    hints:
    - Mixing genes.
    - Random lining up.
    solution: Crossing over and independent assortment.
    mistakes: {"DNA copying errors only": "b11_variation", "mitosis and cytokinesis": "b11_variation", "cell plate formation": "b11_variation"}
  - prompt: A dog has 78 chromosomes in body cells. How many are in its sperm?
    answer: '39'
    check: 78/2
    difficulty: 1
    hints:
    - Gametes come from meiosis.
    - Halve the number.
    solution: 'Step 1: 78 ÷ 2. Step 2: 39.'
    mistakes:
      '78': c11b10_mei
      '156': c11b10_mei
  - prompt: 'The first stage of prophase I, where chromosomes appear as thin threads, is:'
    options:
    - leptotene
    - pachytene
    - diakinesis
    answer: leptotene
    difficulty: 1
    hints:
    - Lepto means thin.
    - It comes before pairing.
    solution: 'Step 1: thin threads appear. Step 2: leptotene.'
    mistakes:
      pachytene: c11b10_mei
      diakinesis: c11b10_mei
  - prompt: 'Paired homologous chromosomes are called:'
    options:
    - bivalents (tetrads)
    - chromatids
    - centromeres
    answer: bivalents (tetrads)
    difficulty: 1
    hints:
    - Two chromosomes, four chromatids.
    - Formed in zygotene.
    solution: 'Step 1: two homologues together. Step 2: bivalent.'
    mistakes:
      chromatids: c11b10_mei
      centromeres: c11b10_mei
  - prompt: 'The structure that holds homologues together during synapsis is the:'
    options:
    - synaptonemal complex
    - spindle
    - cell plate
    answer: synaptonemal complex
    difficulty: 2
    hints:
    - It forms in zygotene.
    - A protein ladder between the homologues.
    solution: 'Step 1: protein framework during pairing. Step 2: synaptonemal complex.'
    mistakes:
      spindle: c11b10_mei
      cell plate: c11b10_mei
  - prompt: 'Crossing over is helped by enzymes at structures called:'
    options:
    - recombination nodules
    - kinetochores
    - telomeres
    answer: recombination nodules
    difficulty: 2
    hints:
    - They appear in pachytene.
    - They mark where swapping happens.
    solution: 'Step 1: sites of exchange. Step 2: recombination nodules.'
    mistakes:
      kinetochores: c11b10_mei
      telomeres: c11b10_mei
  - prompt: 'The short gap between meiosis I and meiosis II is called:'
    options:
    - interkinesis
    - interphase with S phase
    - G0
    answer: interkinesis
    difficulty: 2
    hints:
    - There is no DNA copying in it.
    - It is usually brief.
    solution: 'Step 1: short pause without replication. Step 2: interkinesis.'
    mistakes:
      interphase with S phase: c11b10_mei
      G0: c11b10_mei
  - prompt: How many times is DNA copied in one complete meiosis?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - Copying happens before meiosis I.
    - Not again before meiosis II.
    solution: 'Step 1: one S phase. Step 2: once.'
    mistakes:
      '2': c11b10_mei
      '4': c11b10_mei
  - prompt: A cell has 2 pairs of homologous chromosomes. How many different gamete combinations can independent assortment give?
    answer: '4'
    check: 2**2
    difficulty: 3
    hints:
    - Each pair can line up two ways.
    - Combinations = 2ⁿ.
    solution: 'Step 1: n = 2. Step 2: 2² = 4.'
    mistakes:
      '2': c11b10_mei
      '8': c11b10_mei
  - prompt: Why is meiosis important for a species?
    options:
    - it keeps chromosome numbers constant over generations and adds variation
    - it heals wounds
    - it makes cells bigger
    answer: it keeps chromosome numbers constant over generations and adds variation
    difficulty: 3
    hints:
    - Think of fertilisation joining two gametes.
    - Offspring differ from parents.
    solution: 'Step 1: halving balances fertilisation. Step 2: crossing over adds variety.'
    mistakes:
      it heals wounds: c11b10_mei
      it makes cells bigger: c11b10_mei
