# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse11-bio
chapter: 4
title: Animal Kingdom
tips:
  c11b_coelom: 'Acoelomate: no body cavity (flatworms); pseudocoelomate: cavity not lined fully by mesoderm (roundworms); coelomate: true coelom (annelids onwards).'
  c11b_chordate: "Many chordates (like Amphioxus) have no backbone. The rod that all chordates have at some stage is named after the Greek for back + string."
  b11_arthropoda: "Insects alone make up most known animal species. Which phylum do insects belong to?"
  b11_birds: "Hollow bones make the body light for flight."
  b11_cartilage_fish: "Sharks have skeletons of cartilage, not bone. 'Chondros' means cartilage."
  b11_cnidoblast: "The group is named after these stinging cells."
  b11_flame_cells: "Flame cells are found in flatworms like tapeworms and planaria."
  b11_germ_layers: "'Triplo' means three, 'diplo' means two. Count the layers."
  b11_heart_chambers: "Hearts gained chambers through evolution: fish have the simplest, birds and mammals the most. Amphibians sit in between."
  b11_monotreme: "Kangaroos carry babies in pouches. Egg-laying mammals are monotremes, like the duck-billed one."
  b11_water_vascular: "Starfish and sea urchins move with tube feet. Which phylum has spiny skins?"
  c11b04_basis: 'Check the body plan step by step: symmetry, number of germ layers, type of body cavity, then special features.'
  c11b04_phylum: 'Match the special feature to its phylum: canals (sponges), stinging cells (cnidarians), flame cells (flatworms), segments (annelids), jointed legs (arthropods), tube feet (echinoderms).'
  c11b04_chord: Count heart chambers and look at skin, scales and how the young develop to place a vertebrate in its class.
concepts:
- code: cbse11b.animals.basis
  title: Basis of classification and non-chordates
  notes: |
    Basis: levels of organisation (cellular, tissue, organ, organ system), symmetry (asymmetrical, radial, bilateral),
    germ layers (diploblastic, triploblastic), coelom (acoelomate, pseudocoelomate, coelomate), segmentation (metamerism),
    notochord. Non-chordate phyla: Porifera (sponges, canals, choanocytes, spicules), Coelenterata/Cnidaria (cnidoblasts,
    Hydra, Physalia, polyp and medusa), Ctenophora (comb plates, bioluminescence), Platyhelminthes (flatworms, flame cells,
    Taenia, Fasciola), Aschelminthes (roundworms, Ascaris), Annelida (metameric, nephridia, earthworm, leech), Arthropoda
    (largest phylum, jointed legs, chitin exoskeleton), Mollusca (mantle, radula), Echinodermata (water vascular system,
    tube feet, starfish), Hemichordata (Balanoglossus).
  explanations:
    text: Animals are classified by body organisation, symmetry, number of germ layers, body cavity and segmentation. Non-chordates range from simple sponges with no tissues to arthropods, the biggest group, with jointed legs and hard outer skeletons.
    visual: 'Draw a line of animals: sponge (cells only), Hydra (two layers, radial), flatworm (three layers, no cavity), earthworm (true cavity, segments), insect (jointed legs).'
    step_by_step: 'Step 1: Check symmetry. Step 2: Count germ layers. Step 3: Look for a body cavity and segments. Step 4: Look for special features (cnidoblasts, jointed legs, tube feet).'
    real_world: Arthropods include more than two-thirds of all named animal species, from mosquitoes to crabs.
  picture:
    kind: compare
    columns:
    - title: Phylum
      points:
      - Porifera
      - Cnidaria
      - Annelida
      - Arthropoda
      - Echinodermata
    - title: Key feature
      points:
      - canal system, spicules
      - cnidoblasts (stinging cells)
      - segmented body
      - jointed legs
      - water vascular system
    alt: Five non-chordate phyla and their key features.
  activity:
    type: sort
    prompt: Sort each animal into its phylum.
    bins:
    - Porifera
    - Cnidaria
    - Platyhelminthes
    - Annelida
    - Arthropoda
    items:
    - label: Sycon
      bin: Porifera
      clue: Does its body have pores and canals with no true tissues?
      why: 'A sponge: cellular level, pores and canals.'
    - label: Spongilla
      bin: Porifera
      clue: A freshwater sponge. Which phylum?
      why: Porifera.
    - label: Hydra
      bin: Cnidaria
      clue: Does it have stinging cells (cnidoblasts) and tentacles?
      why: 'Cnidoblasts, a single body opening, radial symmetry: Cnidaria.'
    - label: Physalia (Portuguese man-of-war)
      bin: Cnidaria
      clue: Stinging cells? Radial symmetry?
      why: Cnidaria.
    - label: Adamsia (sea anemone)
      bin: Cnidaria
      clue: Tentacles with stinging cells. Which phylum?
      why: Cnidaria.
    - label: Taenia (tapeworm)
      bin: Platyhelminthes
      clue: Flat body, no body cavity, hooks and suckers?
      why: 'Flatworm: Platyhelminthes.'
    - label: Fasciola (liver fluke)
      bin: Platyhelminthes
      clue: Flattened top to bottom, no coelom. Which phylum?
      why: Platyhelminthes.
    - label: Nereis
      bin: Annelida
      clue: Is its body divided into ring-like segments?
      why: 'Segmented with a true coelom: Annelida.'
    - label: Pheretima (earthworm)
      bin: Annelida
      clue: Segmented body, no jointed legs. Which phylum?
      why: Annelida.
    - label: Hirudinaria (leech)
      bin: Annelida
      clue: Segmented? Jointed legs?
      why: 'Segments, no jointed legs: Annelida.'
    - label: Locust
      bin: Arthropoda
      clue: Does it have jointed legs and a chitin exoskeleton?
      why: 'Jointed appendages: Arthropoda.'
    - label: Scorpion
      bin: Arthropoda
      clue: Jointed legs? Exoskeleton?
      why: Arthropoda.
  lesson:
    - teach: 'Animals are classified by level of organisation (cell, tissue, organ, organ system), symmetry (none, radial, bilateral) and number of germ layers: two (diploblastic, like Hydra) or three (triploblastic, like flatworms onward).'
      check:
        prompt: A starfish adult shows which symmetry?
        options:
        - radial
        - bilateral
        - none
        answer: radial
        why: Parts arranged around a centre.
      ways:
      - style: visual
        teach: Three body plans by symmetry, with examples.
        picture:
          kind: compare
          columns:
          - title: Asymmetrical
            points:
            - no plane divides it equally
            - most sponges
          - title: Radial
            points:
            - any plane through the centre
            - jellyfish, adult starfish
          - title: Bilateral
            points:
            - 'only one plane: left and right'
            - earthworm, insects, humans
          alt: Sponges are mostly asymmetrical; jellyfish and adult starfish are radially symmetrical; earthworms, insects and humans are bilaterally symmetrical with matching left and right halves.
      - style: step_by_step
        teach: 'Step 1: Level of organisation: cells only (sponges), tissues (cnidarians), organs (flatworms) or organ systems. Step 2: Symmetry. Step 3: Germ layers: two or three. Step 4: Body cavity. Step 5: Segmentation and notochord.'
    - teach: 'The body cavity (coelom) is another key: acoelomate (none, flatworms), pseudocoelomate (cavity not lined fully by mesoderm, roundworms) and coelomate (true coelom, annelids onward).'
      check:
        prompt: 'Ascaris (roundworm) is a:'
        options:
        - pseudocoelomate
        - acoelomate
        - coelomate
        answer: pseudocoelomate
        why: Its cavity is not fully lined by mesoderm.
      ways:
      - style: visual
        teach: Three kinds of body cavity seen in cross-section.
        picture:
          kind: compare
          columns:
          - title: Acoelomate
            points:
            - no cavity
            - flatworms (tapeworm)
          - title: Pseudocoelomate
            points:
            - cavity not fully lined by mesoderm
            - roundworms (Ascaris)
          - title: Coelomate
            points:
            - true cavity lined by mesoderm
            - annelids to chordates
          alt: Flatworms have no body cavity; roundworms have a false cavity not fully lined by mesoderm; annelids and later phyla have a true coelom lined by mesoderm.
      - style: real_world
        teach: Think of a body as a tube within a tube. A flatworm is a solid sandwich with no space between the tubes; a roundworm has a space, but only partly lined; an earthworm has a proper lined space where organs can move and grow.
    - teach: 'Phyla in order: Porifera (sponges), Cnidaria (stinging cells), Ctenophora (comb plates), Platyhelminthes (flatworms), Aschelminthes (roundworms), Annelida (segments), Arthropoda (jointed legs), Mollusca (mantle, radula), Echinodermata (tube feet), Hemichordata.'
      picture:
        kind: compare
        columns:
        - title: Body cavity
          points:
          - none
          - false (pseudocoel)
          - true coelom
        - title: Example
          points:
          - tapeworm
          - Ascaris
          - earthworm
        alt: Types of body cavity with examples.
      check:
        prompt: 'Metameric segmentation is first seen in:'
        options:
        - Annelida
        - Cnidaria
        - Porifera
        answer: Annelida
        why: Earthworm body has repeated segments.
      ways:
      - style: step_by_step
        teach: 'Step 1: Pores and canals → Porifera. Step 2: Stinging cells → Cnidaria. Step 3: Comb plates → Ctenophora. Step 4: Flat, flame cells → Platyhelminthes. Step 5: Round, unsegmented → Aschelminthes. Step 6: Segmented → Annelida. Step 7: Jointed legs → Arthropoda. Step 8: Soft body, mantle → Mollusca. Step 9: Spiny skin, tube feet → Echinodermata.'
      - style: real_world
        teach: 'The earthworm in your garden (Annelida), the cockroach in the kitchen (Arthropoda), the snail on a wet wall (Mollusca) and the starfish on the beach at Kovalam (Echinodermata): four different phyla, each with its own body plan.'
  items:
  - prompt: 'The largest animal phylum is:'
    options:
    - Arthropoda
    - Mollusca
    - Chordata
    - Annelida
    answer: Arthropoda
    difficulty: 1
    hints:
    - Insects.
    - Jointed legs.
    solution: "Arthropoda includes insects and has about two-thirds of all named animal species."
    mistakes: {"Mollusca": "b11_arthropoda", "Chordata": "b11_arthropoda", "Annelida": "b11_arthropoda"}
  - prompt: 'Stinging cells (cnidoblasts) are found in:'
    options:
    - Cnidaria
    - Porifera
    - Annelida
    - Mollusca
    answer: Cnidaria
    difficulty: 1
    hints:
    - Hydra, jellyfish.
    - Named after them.
    solution: "Cnidarians such as Hydra use cnidoblasts to sting prey and defend themselves."
    mistakes: {"Porifera": "b11_cnidoblast", "Annelida": "b11_cnidoblast", "Mollusca": "b11_cnidoblast"}
  - prompt: 'Roundworms like Ascaris are:'
    options:
    - pseudocoelomates
    - acoelomates
    - coelomates
    - diploblastic
    answer: pseudocoelomates
    difficulty: 2
    hints:
    - Cavity not fully lined.
    - Aschelminthes.
    solution: "Their body cavity is not fully lined by mesoderm, so it is a pseudocoelom."
    mistakes:
      acoelomates: c11b_coelom
  - prompt: 'Tube feet and a water vascular system are found in:'
    options:
    - echinoderms
    - molluscs
    - sponges
    - flatworms
    answer: echinoderms
    difficulty: 2
    hints:
    - Starfish.
    - Spiny skin.
    solution: "The water vascular system with tube feet is unique to echinoderms (starfish, sea urchins)."
    mistakes: {"molluscs": "b11_water_vascular", "sponges": "b11_water_vascular", "flatworms": "b11_water_vascular"}
  - prompt: 'Flame cells help in excretion in:'
    options:
    - Platyhelminthes
    - Annelida
    - Arthropoda
    - Porifera
    answer: Platyhelminthes
    difficulty: 2
    hints:
    - Flatworms.
    - Tapeworm.
    solution: "Flatworms (Platyhelminthes) excrete through flame cells."
    mistakes: {"Annelida": "b11_flame_cells", "Arthropoda": "b11_flame_cells", "Porifera": "b11_flame_cells"}
  - prompt: 'An animal with three germ layers is called:'
    options:
    - triploblastic
    - diploblastic
    - acoelomate
    - radial
    answer: triploblastic
    difficulty: 1
    hints:
    - Ectoderm, mesoderm, endoderm.
    - Three.
    solution: "Ectoderm, mesoderm and endoderm: three layers makes it triploblastic."
    mistakes: {"diploblastic": "b11_germ_layers", "acoelomate": "b11_germ_layers", "radial": "b11_germ_layers"}
  - prompt: 'Sponges belong to the phylum:'
    options:
    - Porifera
    - Cnidaria
    - Mollusca
    answer: Porifera
    difficulty: 1
    hints:
    - Their bodies are full of pores and canals.
    - Pori = pores.
    solution: 'Step 1: pore-bearing animals. Step 2: Porifera.'
    mistakes:
      Cnidaria: c11b04_phylum
      Mollusca: c11b04_phylum
  - prompt: 'Octopus and snails belong to:'
    options:
    - Mollusca
    - Arthropoda
    - Annelida
    answer: Mollusca
    difficulty: 1
    hints:
    - Soft body, often a shell.
    - They have a mantle and radula.
    solution: 'Step 1: soft-bodied with mantle. Step 2: Mollusca.'
    mistakes:
      Arthropoda: c11b04_phylum
      Annelida: c11b04_phylum
  - prompt: Hydra has how many germ layers?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Cnidarians are diploblastic.
    - Ectoderm and endoderm only.
    solution: 'Step 1: ectoderm + endoderm. Step 2: 2.'
    mistakes:
      '3': c11b04_basis
      '1': c11b04_basis
  - prompt: 'Comb plates for swimming are found in:'
    options:
    - Ctenophora
    - Cnidaria
    - Porifera
    answer: Ctenophora
    difficulty: 2
    hints:
    - Cteno means comb.
    - Sea walnuts are an example.
    solution: 'Step 1: eight rows of comb plates. Step 2: Ctenophora.'
    mistakes:
      Cnidaria: c11b04_phylum
      Porifera: c11b04_phylum
  - prompt: 'The two body forms of cnidarians are:'
    options:
    - polyp and medusa
    - larva and pupa
    - scolex and proglottid
    answer: polyp and medusa
    difficulty: 2
    hints:
    - One is fixed and cylinder-shaped; one floats like an umbrella.
    - Obelia shows both.
    solution: 'Step 1: sessile polyp, free medusa. Step 2: polyp and medusa.'
    mistakes:
      larva and pupa: c11b04_phylum
      scolex and proglottid: c11b04_phylum
  - prompt: 'Excretion in earthworms is by:'
    options:
    - nephridia
    - flame cells
    - Malpighian tubules
    answer: nephridia
    difficulty: 2
    hints:
    - Annelids have segmental excretory tubes.
    - Flame cells belong to flatworms.
    solution: 'Step 1: segmental tubules. Step 2: nephridia.'
    mistakes:
      flame cells: c11b04_phylum
      Malpighian tubules: c11b04_phylum
  - prompt: Which phylum has an open circulatory system and jointed appendages?
    options:
    - Arthropoda
    - Annelida
    - Echinodermata
    answer: Arthropoda
    difficulty: 2
    hints:
    - Arthro = joint, poda = foot.
    - Insects, spiders, crabs.
    solution: 'Step 1: jointed legs. Step 2: Arthropoda.'
    mistakes:
      Annelida: c11b04_phylum
      Echinodermata: c11b04_phylum
  - prompt: 'Balanoglossus, once placed with chordates, is now put in:'
    options:
    - Hemichordata
    - Echinodermata
    - Cephalochordata
    answer: Hemichordata
    difficulty: 3
    hints:
    - It has a stomochord, not a true notochord.
    - Hemi means half.
    solution: 'Step 1: stomochord only. Step 2: Hemichordata.'
    mistakes:
      Echinodermata: c11b04_phylum
      Cephalochordata: c11b04_phylum
  - prompt: 'Echinoderm larvae show bilateral symmetry while adults show:'
    options:
    - radial symmetry
    - no symmetry
    - bilateral symmetry too
    answer: radial symmetry
    difficulty: 3
    hints:
    - Think of an adult starfish.
    - Its arms are arranged around the centre.
    solution: 'Step 1: larva bilateral. Step 2: adult radial.'
    mistakes:
      no symmetry: c11b04_basis
      bilateral symmetry too: c11b04_basis
  - prompt: 'Assertion (A): Earthworms are called true coelomates.

      Reason (R): Their body cavity is fully lined by mesoderm.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. A cavity lined by mesoderm is a true coelom, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: An animal has a segmented body, a true coelom, a closed circulatory system and nephridia for excretion. To which phylum does it belong?'
    options:
    - Annelida
    - Arthropoda
    - Mollusca
    answer: Annelida
    hints:
    - Nephridia are the clue.
    - Arthropods have an open circulatory system.
    solution: Segments, nephridia and a closed circulation are features of Annelida, like the earthworm.
    mistakes:
      Arthropoda: c11b04_phylum
      Mollusca: c11b04_basis
    exam: case
    difficulty: 2
  - prompt: Which phylum shows tissue-level organisation and two germ layers?
    options:
    - Cnidaria
    - Porifera
    - Platyhelminthes
    answer: Cnidaria
    hints:
    - Sponges have only cells, no true tissues.
    - Flatworms have three layers.
    solution: Cnidarians like Hydra are diploblastic with a tissue level of organisation.
    mistakes:
      Porifera: c11b04_basis
      Platyhelminthes: b11_germ_layers
    exam: one_mark
    difficulty: 2
- code: cbse11b.animals.chordates
  title: Chordates and vertebrate classes
  after:
  - cbse11b.animals.basis
  notes: |
    Phylum Chordata: notochord, dorsal hollow nerve cord, paired pharyngeal gill slits, post-anal tail. Subphyla
    Urochordata (notochord in larval tail: Ascidia), Cephalochordata (notochord throughout: Amphioxus), Vertebrata
    (vertebral column). Classes: Cyclostomata (jawless, Petromyzon), Chondrichthyes (cartilaginous fish, sharks, placoid
    scales), Osteichthyes (bony fish, swim bladder, operculum), Amphibia (moist skin, three-chambered heart, frog),
    Reptilia (dry scaly skin, mostly three-chambered heart; crocodile four), Aves (feathers, beak, air sacs, hollow bones,
    four-chambered heart), Mammalia (mammary glands, hair, external ears, four-chambered heart; platypus lays eggs).
  explanations:
    text: Chordates have a stiff rod (notochord) along the back at some stage, a nerve cord above it and gill slits. Vertebrates, a big chordate group, replace the notochord with a backbone. They're sorted into fishes, amphibians, reptiles, birds and mammals.
    visual: 'Draw a table of hearts: fish 2 chambers, amphibians 3, most reptiles 3, birds and mammals 4.'
    step_by_step: 'Step 1: Notochord, nerve cord, gill slits? Chordate. Step 2: Backbone? Vertebrate. Step 3: Use skin, heart chambers and breathing to choose the class.'
    real_world: The platypus is a mammal that lays eggs, showing how mammals link back to reptile-like ancestors.
  picture:
    kind: bars
    bars:
    - label: fish
      value: 2
    - label: amphibian
      value: 3
    - label: reptile
      value: 3
    - label: bird
      value: 4
    - label: mammal
      value: 4
    alt: 'Heart chambers: fish 2, amphibians 3, most reptiles 3, birds 4 and mammals 4.'
    unit: chambers
  activity:
    type: sort
    prompt: Sort each vertebrate into its group.
    bins:
    - Fishes
    - Amphibia
    - Reptilia
    - Aves
    - Mammalia
    items:
    - label: Scoliodon (dogfish)
      bin: Fishes
      clue: Gills and fins, cartilage skeleton. Which group?
      why: A cartilaginous fish.
    - label: Labeo (rohu)
      bin: Fishes
      clue: Gills, fins, bony skeleton. Which group?
      why: A bony fish.
    - label: Hippocampus (sea horse)
      bin: Fishes
      clue: It breathes with gills and has fins. Which group?
      why: Despite its shape, the sea horse is a bony fish.
    - label: Salamandra (salamander)
      bin: Amphibia
      clue: Moist skin, lives on land and in water. Which group?
      why: Amphibia.
    - label: Ichthyophis
      bin: Amphibia
      clue: A limbless animal with moist skin. Is it a snake?
      why: 'Ichthyophis is a limbless amphibian, not a snake: its skin is moist, with no scales.'
    - label: Chelone (turtle)
      bin: Reptilia
      clue: Dry scaly skin, lays eggs on land. Which group?
      why: Reptilia.
    - label: Naja (cobra)
      bin: Reptilia
      clue: Dry scales, cold-blooded. Which group?
      why: Reptilia.
    - label: Columba (pigeon)
      bin: Aves
      clue: Feathers and a beak. Which group?
      why: Aves.
    - label: Pavo (peacock)
      bin: Aves
      clue: Feathers? Lays eggs?
      why: Aves.
    - label: Ornithorhynchus (platypus)
      bin: Mammalia
      clue: It lays eggs, but does it have hair and feed milk?
      why: Hair and milk glands make it a mammal, even though it lays eggs.
    - label: Pteropus (flying fox)
      bin: Mammalia
      clue: It flies, but does it have feathers or hair?
      why: 'A bat has hair and feeds its young milk: a mammal.'
    - label: Balaenoptera (blue whale)
      bin: Mammalia
      clue: It lives in the sea, but does it breathe with gills or lungs?
      why: 'Lungs, hair and milk: a mammal.'
  lesson:
    - teach: Chordates have, at some stage, a notochord, a dorsal hollow nerve cord, pharyngeal gill slits and a post-anal tail. Non-chordates lack a notochord and have a ventral solid nerve cord.
      check:
        prompt: 'In chordates the nerve cord is:'
        options:
        - dorsal, hollow and single
        - ventral, solid and double
        - absent
        answer: dorsal, hollow and single
        why: It lies above the gut.
      ways:
      - style: visual
        teach: Chordates and non-chordates compared, feature by feature.
        picture:
          kind: compare
          columns:
          - title: Chordates
            points:
            - notochord present
            - nerve cord dorsal, hollow
            - gill slits in the pharynx
            - heart on the ventral side
          - title: Non-chordates
            points:
            - no notochord
            - nerve cord ventral, solid
            - no gill slits
            - heart dorsal (if any)
          alt: Chordates have a notochord, a dorsal hollow nerve cord, pharyngeal gill slits and a ventral heart; non-chordates lack a notochord and gill slits and have a ventral solid nerve cord and a dorsal heart.
      - style: real_world
        teach: 'You are a chordate too: as an early embryo you had a notochord, gill-slit pouches in the throat and a tail. Most of these changed or disappeared before birth, but your spinal cord is still dorsal and hollow.'
    - teach: 'Subphyla: Urochordata (notochord only in larval tail, Ascidia), Cephalochordata (notochord head to tail all life, Amphioxus), Vertebrata (notochord replaced by a backbone).'
      check:
        prompt: 'Amphioxus keeps its notochord:'
        options:
        - throughout life, head to tail
        - only in the larval tail
        - never
        answer: throughout life, head to tail
        why: Cephalochordate.
      ways:
      - style: visual
        teach: Where the notochord is found in each subphylum.
        picture:
          kind: compare
          columns:
          - title: Urochordata
            points:
            - only in the larval tail
            - Ascidia, Salpa
          - title: Cephalochordata
            points:
            - head to tail, all life
            - Amphioxus
          - title: Vertebrata
            points:
            - embryo only
            - replaced by backbone
          alt: In urochordates the notochord is only in the larval tail; in cephalochordates it runs head to tail throughout life; in vertebrates it is present in the embryo and replaced by the backbone.
      - style: step_by_step
        teach: 'Step 1: Does the adult have a backbone? Yes → Vertebrata. Step 2: If not, does the notochord run from head to tail for life? → Cephalochordata. Step 3: Is it only in the tail of the larva? → Urochordata. Remember: all vertebrates are chordates, but not all chordates are vertebrates.'
    - teach: 'Vertebrate classes: Cyclostomata (jawless), Chondrichthyes (cartilage fish, 2-chambered heart), Osteichthyes (bony fish), Amphibia (moist skin, 3 chambers), Reptilia (dry scales, mostly 3), Aves (feathers, 4) and Mammalia (hair, milk glands, 4).'
      picture:
        kind: compare
        columns:
        - title: Class
          points:
          - fish
          - amphibians
          - most reptiles
          - birds and mammals
        - title: Heart chambers
          points:
          - '2'
          - '3'
          - 3 (crocodile 4)
          - '4'
        alt: Heart chambers in vertebrate classes.
      check:
        prompt: Which reptile has a four-chambered heart?
        options:
        - crocodile
        - lizard
        - snake
        answer: crocodile
        why: The one exception among reptiles.
      ways:
      - style: step_by_step
        teach: 'Step 1: Jaws? None → Cyclostomata. Step 2: Fins and gills: cartilage → Chondrichthyes, bone → Osteichthyes. Step 3: Moist skin, lives in water and on land → Amphibia. Step 4: Dry scaly skin → Reptilia. Step 5: Feathers → Aves. Step 6: Hair and milk → Mammalia.'
      - style: real_world
        teach: 'On a day out in Kerala you might see a catfish in a paddy canal (bony fish), a frog after rain (amphibian), a rat snake (reptile), a kingfisher (bird) and a bat at dusk (mammal): five vertebrate classes in one village.'
  items:
  - prompt: How many chambers does a frog's heart have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Amphibian.
    - Two atria, one ventricle.
    solution: "Two atria and one ventricle: 3 chambers."
    mistakes: {"2": "b11_heart_chambers", "4": "b11_heart_chambers"}
  - prompt: How many chambers does a fish heart have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - One atrium, one ventricle.
    - Single circulation.
    solution: "Fish have one atrium and one ventricle: 2 chambers."
    mistakes: {"3": "b11_heart_chambers", "4": "b11_heart_chambers"}
  - prompt: Which feature is found in all chordates at some stage?
    options:
    - notochord
    - backbone
    - four-chambered heart
    - hair
    answer: notochord
    difficulty: 1
    hints:
    - Even in larvae.
    - Rod-like.
    solution: "Every chordate has a notochord at some stage, even if it is replaced by a backbone later."
    mistakes:
      backbone: c11b_chordate
  - prompt: 'Sharks belong to:'
    options:
    - Chondrichthyes
    - Osteichthyes
    - Cyclostomata
    - Amphibia
    answer: Chondrichthyes
    difficulty: 2
    hints:
    - Cartilage skeleton.
    - Placoid scales.
    solution: "Sharks have a cartilage skeleton, so they are Chondrichthyes (cartilaginous fish)."
    mistakes: {"Osteichthyes": "b11_cartilage_fish", "Cyclostomata": "b11_cartilage_fish", "Amphibia": "b11_cartilage_fish"}
  - prompt: Which mammal lays eggs?
    options:
    - platypus
    - kangaroo
    - bat
    - whale
    answer: platypus
    difficulty: 1
    hints:
    - Monotreme.
    - Duck-billed.
    solution: "The platypus is a monotreme, an egg-laying mammal; it still feeds its young on milk."
    mistakes: {"kangaroo": "b11_monotreme", "bat": "b11_monotreme", "whale": "b11_monotreme"}
  - prompt: 'Air sacs and hollow bones are adaptations of:'
    options:
    - birds
    - reptiles
    - mammals
    - fishes
    answer: birds
    difficulty: 2
    hints:
    - Light body for flight.
    - Aves.
    solution: "Air sacs help breathing and hollow (pneumatic) bones lighten the body, both suited to flight in birds."
    mistakes: {"reptiles": "b11_birds", "mammals": "b11_birds", "fishes": "b11_birds"}
  - prompt: How many chambers does a bird's heart have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Birds are warm-blooded.
    - Oxygenated and deoxygenated blood are fully separate.
    solution: 'Step 1: two atria, two ventricles. Step 2: 4.'
    mistakes:
      '3': c11b04_chord
      '2': c11b04_chord
  - prompt: 'Lampreys (Petromyzon) belong to:'
    options:
    - Cyclostomata
    - Chondrichthyes
    - Osteichthyes
    answer: Cyclostomata
    difficulty: 1
    hints:
    - They have no jaws.
    - A circular sucking mouth.
    solution: 'Step 1: jawless, round mouth. Step 2: Cyclostomata.'
    mistakes:
      Chondrichthyes: c11b04_chord
      Osteichthyes: c11b04_chord
  - prompt: 'Mammals are named after their:'
    options:
    - mammary (milk) glands
    - hair
    - four-chambered heart
    answer: mammary (milk) glands
    difficulty: 1
    hints:
    - The name tells you.
    - They feed their young with milk.
    solution: 'Step 1: mamma = breast. Step 2: milk glands.'
    mistakes:
      hair: c11b04_chord
      four-chambered heart: c11b04_chord
  - prompt: 'Bony fishes stay afloat with the help of a:'
    options:
    - "swim bladder (air bladder)"
    - "placoid scale on the skin"
    - "lateral line along the body"
    answer: swim bladder (air bladder)
    difficulty: 2
    hints:
    - Sharks lack it and must keep swimming.
    - It is a gas-filled sac.
    solution: 'Step 1: gas sac controls buoyancy. Step 2: swim bladder.'
    mistakes:
      "placoid scale on the skin": c11b04_chord
      "lateral line along the body": c11b04_chord
  - prompt: 'Gill slits in bony fish are covered by an:'
    options:
    - operculum
    - cloaca
    - air sac
    answer: operculum
    difficulty: 2
    hints:
    - It is a bony flap.
    - Cartilage fish have naked gill slits.
    solution: 'Step 1: bony gill cover. Step 2: operculum.'
    mistakes:
      cloaca: c11b04_chord
      air sac: c11b04_chord
  - prompt: Which feature do all vertebrates share?
    options:
    - a vertebral column
    - feathers
    - mammary glands
    answer: a vertebral column
    difficulty: 2
    hints:
    - The name of the group tells you.
    - It replaces the notochord in adults.
    solution: 'Step 1: backbone. Step 2: vertebral column.'
    mistakes:
      feathers: c11b04_chord
      mammary glands: c11b04_chord
  - prompt: 'Frogs are amphibians because they:'
    options:
    - "live both in water and on land"
    - "have dry scales all over"
    - "lay their eggs on dry land"
    answer: live both in water and on land
    difficulty: 2
    hints:
    - Amphi means both.
    - Tadpoles live in water.
    solution: 'Step 1: double life. Step 2: water and land.'
    mistakes:
      "have dry scales all over": c11b04_chord
      "lay their eggs on dry land": c11b04_chord
  - prompt: 'Bats fly and whales swim, yet both are mammals because they:'
    options:
    - have hair and feed their young on milk
    - have four-chambered hearts only
    - lay eggs
    answer: have hair and feed their young on milk
    difficulty: 3
    hints:
    - Flying and swimming are not class features.
    - Which features define a mammal?
    solution: 'Step 1: hair and mammary glands. Step 2: both are mammals.'
    mistakes:
      have four-chambered hearts only: c11b04_chord
      lay eggs: c11b04_chord
  - prompt: 'In Ascidia (Urochordata), the notochord is found:'
    options:
    - only in the larval tail
    - throughout life
    - never
    answer: only in the larval tail
    difficulty: 3
    hints:
    - Uro means tail.
    - The adult loses it.
    solution: 'Step 1: present in larva''s tail. Step 2: lost in the adult.'
    mistakes:
      throughout life: c11b04_chord
      never: c11b04_chord
  - prompt: 'Assertion (A): All vertebrates are chordates but all chordates are not vertebrates.

      Reason (R): Some chordates, such as Amphioxus, keep a notochord throughout life and never form a backbone.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Chordates like Amphioxus and Ascidia have a notochord but no vertebral column, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: A student finds an animal with dry, scaly skin that lays shelled eggs on land and has a three-chambered heart. Which class is it?'
    options:
    - Reptilia
    - Amphibia
    - Aves
    answer: Reptilia
    hints:
    - Dry scales rule out amphibians.
    - Birds have feathers and four chambers.
    solution: Dry scales, shelled eggs and mostly three chambers fit Reptilia (crocodiles have four).
    mistakes:
      Amphibia: c11b04_chord
      Aves: b11_heart_chambers
    exam: competency
    difficulty: 2
  - prompt: Which feature separates Osteichthyes from Chondrichthyes?
    options:
    - "Bony skeleton and a gill cover"
    - "Paired fins on the sides of the body"
    - "A two-chambered heart pumping blood"
    answer: Bony skeleton and a gill cover
    hints:
    - Both are fish with fins and a 2-chambered heart.
    - What is the skeleton made of?
    solution: Bony fish have a bony skeleton and an operculum over the gills; cartilaginous fish have cartilage and uncovered gill slits.
    mistakes:
      "Paired fins on the sides of the body": c11b04_chord
      "A two-chambered heart pumping blood": b11_cartilage_fish
    exam: short
    difficulty: 2
