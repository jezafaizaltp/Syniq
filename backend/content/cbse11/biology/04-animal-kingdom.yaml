# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse11-bio
chapter: 4
title: Animal Kingdom
tips:
  c11b_coelom: 'Acoelomate: no body cavity (flatworms); pseudocoelomate: cavity not lined fully by mesoderm (roundworms); coelomate: true coelom (annelids onwards).'
  c11b_chordate: "Many chordates (like Amphioxus) have no backbone. The rod that all chordates have at some stage is named after the Greek for back + string."
  b11_arthropoda: "Insects alone make up most known animal species. Which phylum do insects belong to?"
  b11_birds: "Hollow bones make the body light for flight."
  b11_cartilage_fish: "Sharks have skeletons of cartilage, not bone. 'Chondros' means cartilage."
  b11_cnidoblast: "The group is named after these stinging cells."
  b11_flame_cells: "Flame cells are found in flatworms like tapeworms and planaria."
  b11_germ_layers: "'Triplo' means three, 'diplo' means two. Count the layers."
  b11_heart_chambers: "Hearts gained chambers through evolution: fish have the simplest, birds and mammals the most. Amphibians sit in between."
  b11_monotreme: "Kangaroos carry babies in pouches. Egg-laying mammals are monotremes, like the duck-billed one."
  b11_water_vascular: "Starfish and sea urchins move with tube feet. Which phylum has spiny skins?"
concepts:
- code: cbse11b.animals.basis
  title: Basis of classification and non-chordates
  notes: |
    Basis: levels of organisation (cellular, tissue, organ, organ system), symmetry (asymmetrical, radial, bilateral),
    germ layers (diploblastic, triploblastic), coelom (acoelomate, pseudocoelomate, coelomate), segmentation (metamerism),
    notochord. Non-chordate phyla: Porifera (sponges, canals, choanocytes, spicules), Coelenterata/Cnidaria (cnidoblasts,
    Hydra, Physalia, polyp and medusa), Ctenophora (comb plates, bioluminescence), Platyhelminthes (flatworms, flame cells,
    Taenia, Fasciola), Aschelminthes (roundworms, Ascaris), Annelida (metameric, nephridia, earthworm, leech), Arthropoda
    (largest phylum, jointed legs, chitin exoskeleton), Mollusca (mantle, radula), Echinodermata (water vascular system,
    tube feet, starfish), Hemichordata (Balanoglossus).
  explanations:
    text: Animals are classified by body organisation, symmetry, number of germ layers, body cavity and segmentation. Non-chordates range from simple sponges with no tissues to arthropods, the biggest group, with jointed legs and hard outer skeletons.
    visual: 'Draw a line of animals: sponge (cells only), Hydra (two layers, radial), flatworm (three layers, no cavity), earthworm (true cavity, segments), insect (jointed legs).'
    step_by_step: 'Step 1: Check symmetry. Step 2: Count germ layers. Step 3: Look for a body cavity and segments. Step 4: Look for special features (cnidoblasts, jointed legs, tube feet).'
    real_world: Arthropods include more than two-thirds of all named animal species, from mosquitoes to crabs.
  picture:
    kind: compare
    columns:
    - title: Phylum
      points:
      - Porifera
      - Cnidaria
      - Annelida
      - Arthropoda
      - Echinodermata
    - title: Key feature
      points:
      - canal system, spicules
      - cnidoblasts (stinging cells)
      - segmented body
      - jointed legs
      - water vascular system
    alt: Five non-chordate phyla and their key features.
  activity:
    type: sort
    prompt: Sort each animal into its phylum.
    bins:
    - Porifera
    - Cnidaria
    - Platyhelminthes
    - Annelida
    - Arthropoda
    items:
    - label: Sycon
      bin: Porifera
      clue: Does its body have pores and canals with no true tissues?
      why: 'A sponge: cellular level, pores and canals.'
    - label: Spongilla
      bin: Porifera
      clue: A freshwater sponge. Which phylum?
      why: Porifera.
    - label: Hydra
      bin: Cnidaria
      clue: Does it have stinging cells (cnidoblasts) and tentacles?
      why: 'Cnidoblasts, a single body opening, radial symmetry: Cnidaria.'
    - label: Physalia (Portuguese man-of-war)
      bin: Cnidaria
      clue: Stinging cells? Radial symmetry?
      why: Cnidaria.
    - label: Adamsia (sea anemone)
      bin: Cnidaria
      clue: Tentacles with stinging cells. Which phylum?
      why: Cnidaria.
    - label: Taenia (tapeworm)
      bin: Platyhelminthes
      clue: Flat body, no body cavity, hooks and suckers?
      why: 'Flatworm: Platyhelminthes.'
    - label: Fasciola (liver fluke)
      bin: Platyhelminthes
      clue: Flattened top to bottom, no coelom. Which phylum?
      why: Platyhelminthes.
    - label: Nereis
      bin: Annelida
      clue: Is its body divided into ring-like segments?
      why: 'Segmented with a true coelom: Annelida.'
    - label: Pheretima (earthworm)
      bin: Annelida
      clue: Segmented body, no jointed legs. Which phylum?
      why: Annelida.
    - label: Hirudinaria (leech)
      bin: Annelida
      clue: Segmented? Jointed legs?
      why: 'Segments, no jointed legs: Annelida.'
    - label: Locust
      bin: Arthropoda
      clue: Does it have jointed legs and a chitin exoskeleton?
      why: 'Jointed appendages: Arthropoda.'
    - label: Scorpion
      bin: Arthropoda
      clue: Jointed legs? Exoskeleton?
      why: Arthropoda.
  items:
  - prompt: 'The largest animal phylum is:'
    options:
    - Arthropoda
    - Mollusca
    - Chordata
    - Annelida
    answer: Arthropoda
    difficulty: 1
    hints:
    - Insects.
    - Jointed legs.
    solution: Arthropoda.
    mistakes: {"Mollusca": "b11_arthropoda", "Chordata": "b11_arthropoda", "Annelida": "b11_arthropoda"}
  - prompt: 'Stinging cells (cnidoblasts) are found in:'
    options:
    - Cnidaria
    - Porifera
    - Annelida
    - Mollusca
    answer: Cnidaria
    difficulty: 1
    hints:
    - Hydra, jellyfish.
    - Named after them.
    solution: Cnidaria.
    mistakes: {"Porifera": "b11_cnidoblast", "Annelida": "b11_cnidoblast", "Mollusca": "b11_cnidoblast"}
  - prompt: 'Roundworms like Ascaris are:'
    options:
    - pseudocoelomates
    - acoelomates
    - coelomates
    - diploblastic
    answer: pseudocoelomates
    difficulty: 2
    hints:
    - Cavity not fully lined.
    - Aschelminthes.
    solution: Pseudocoelomates.
    mistakes:
      acoelomates: c11b_coelom
  - prompt: 'Tube feet and a water vascular system are found in:'
    options:
    - echinoderms
    - molluscs
    - sponges
    - flatworms
    answer: echinoderms
    difficulty: 2
    hints:
    - Starfish.
    - Spiny skin.
    solution: Echinoderms.
    mistakes: {"molluscs": "b11_water_vascular", "sponges": "b11_water_vascular", "flatworms": "b11_water_vascular"}
  - prompt: 'Flame cells help in excretion in:'
    options:
    - Platyhelminthes
    - Annelida
    - Arthropoda
    - Porifera
    answer: Platyhelminthes
    difficulty: 2
    hints:
    - Flatworms.
    - Tapeworm.
    solution: Platyhelminthes.
    mistakes: {"Annelida": "b11_flame_cells", "Arthropoda": "b11_flame_cells", "Porifera": "b11_flame_cells"}
  - prompt: 'An animal with three germ layers is called:'
    options:
    - triploblastic
    - diploblastic
    - acoelomate
    - radial
    answer: triploblastic
    difficulty: 1
    hints:
    - Ectoderm, mesoderm, endoderm.
    - Three.
    solution: Triploblastic.
    mistakes: {"diploblastic": "b11_germ_layers", "acoelomate": "b11_germ_layers", "radial": "b11_germ_layers"}
- code: cbse11b.animals.chordates
  title: Chordates and vertebrate classes
  after:
  - cbse11b.animals.basis
  notes: |
    Phylum Chordata: notochord, dorsal hollow nerve cord, paired pharyngeal gill slits, post-anal tail. Subphyla
    Urochordata (notochord in larval tail: Ascidia), Cephalochordata (notochord throughout: Amphioxus), Vertebrata
    (vertebral column). Classes: Cyclostomata (jawless, Petromyzon), Chondrichthyes (cartilaginous fish, sharks, placoid
    scales), Osteichthyes (bony fish, swim bladder, operculum), Amphibia (moist skin, three-chambered heart, frog),
    Reptilia (dry scaly skin, mostly three-chambered heart; crocodile four), Aves (feathers, beak, air sacs, hollow bones,
    four-chambered heart), Mammalia (mammary glands, hair, external ears, four-chambered heart; platypus lays eggs).
  explanations:
    text: Chordates have a stiff rod (notochord) along the back at some stage, a nerve cord above it and gill slits. Vertebrates, a big chordate group, replace the notochord with a backbone. They're sorted into fishes, amphibians, reptiles, birds and mammals.
    visual: 'Draw a table of hearts: fish 2 chambers, amphibians 3, most reptiles 3, birds and mammals 4.'
    step_by_step: 'Step 1: Notochord, nerve cord, gill slits? Chordate. Step 2: Backbone? Vertebrate. Step 3: Use skin, heart chambers and breathing to choose the class.'
    real_world: The platypus is a mammal that lays eggs, showing how mammals link back to reptile-like ancestors.
  picture:
    kind: bars
    bars:
    - label: fish
      value: 2
    - label: amphibian
      value: 3
    - label: reptile
      value: 3
    - label: bird
      value: 4
    - label: mammal
      value: 4
    alt: 'Heart chambers: fish 2, amphibians 3, most reptiles 3, birds 4 and mammals 4.'
    unit: chambers
  activity:
    type: sort
    prompt: Sort each vertebrate into its group.
    bins:
    - Fishes
    - Amphibia
    - Reptilia
    - Aves
    - Mammalia
    items:
    - label: Scoliodon (dogfish)
      bin: Fishes
      clue: Gills and fins, cartilage skeleton. Which group?
      why: A cartilaginous fish.
    - label: Labeo (rohu)
      bin: Fishes
      clue: Gills, fins, bony skeleton. Which group?
      why: A bony fish.
    - label: Hippocampus (sea horse)
      bin: Fishes
      clue: It breathes with gills and has fins. Which group?
      why: Despite its shape, the sea horse is a bony fish.
    - label: Salamandra (salamander)
      bin: Amphibia
      clue: Moist skin, lives on land and in water. Which group?
      why: Amphibia.
    - label: Ichthyophis
      bin: Amphibia
      clue: A limbless animal with moist skin. Is it a snake?
      why: 'Ichthyophis is a limbless amphibian, not a snake: its skin is moist, with no scales.'
    - label: Chelone (turtle)
      bin: Reptilia
      clue: Dry scaly skin, lays eggs on land. Which group?
      why: Reptilia.
    - label: Naja (cobra)
      bin: Reptilia
      clue: Dry scales, cold-blooded. Which group?
      why: Reptilia.
    - label: Columba (pigeon)
      bin: Aves
      clue: Feathers and a beak. Which group?
      why: Aves.
    - label: Pavo (peacock)
      bin: Aves
      clue: Feathers? Lays eggs?
      why: Aves.
    - label: Ornithorhynchus (platypus)
      bin: Mammalia
      clue: It lays eggs, but does it have hair and feed milk?
      why: Hair and milk glands make it a mammal, even though it lays eggs.
    - label: Pteropus (flying fox)
      bin: Mammalia
      clue: It flies, but does it have feathers or hair?
      why: 'A bat has hair and feeds its young milk: a mammal.'
    - label: Balaenoptera (blue whale)
      bin: Mammalia
      clue: It lives in the sea, but does it breathe with gills or lungs?
      why: 'Lungs, hair and milk: a mammal.'
  items:
  - prompt: How many chambers does a frog's heart have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Amphibian.
    - Two atria, one ventricle.
    solution: '3.'
    mistakes: {"2": "b11_heart_chambers", "4": "b11_heart_chambers"}
  - prompt: How many chambers does a fish heart have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - One atrium, one ventricle.
    - Single circulation.
    solution: '2.'
    mistakes: {"3": "b11_heart_chambers", "4": "b11_heart_chambers"}
  - prompt: Which feature is found in all chordates at some stage?
    options:
    - notochord
    - backbone
    - four-chambered heart
    - hair
    answer: notochord
    difficulty: 1
    hints:
    - Even in larvae.
    - Rod-like.
    solution: A notochord.
    mistakes:
      backbone: c11b_chordate
  - prompt: 'Sharks belong to:'
    options:
    - Chondrichthyes
    - Osteichthyes
    - Cyclostomata
    - Amphibia
    answer: Chondrichthyes
    difficulty: 2
    hints:
    - Cartilage skeleton.
    - Placoid scales.
    solution: Chondrichthyes.
    mistakes: {"Osteichthyes": "b11_cartilage_fish", "Cyclostomata": "b11_cartilage_fish", "Amphibia": "b11_cartilage_fish"}
  - prompt: Which mammal lays eggs?
    options:
    - platypus
    - kangaroo
    - bat
    - whale
    answer: platypus
    difficulty: 1
    hints:
    - Monotreme.
    - Duck-billed.
    solution: The platypus.
    mistakes: {"kangaroo": "b11_monotreme", "bat": "b11_monotreme", "whale": "b11_monotreme"}
  - prompt: 'Air sacs and hollow bones are adaptations of:'
    options:
    - birds
    - reptiles
    - mammals
    - fishes
    answer: birds
    difficulty: 2
    hints:
    - Light body for flight.
    - Aves.
    solution: Birds.
    mistakes: {"reptiles": "b11_birds", "mammals": "b11_birds", "fishes": "b11_birds"}
