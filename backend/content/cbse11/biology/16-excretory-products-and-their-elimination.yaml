# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 16. Format: content/README.md.
subject: cbse11-bio
chapter: 16
title: Excretory Products and their Elimination
tips:
  c11b_nitrogen: "Animals excrete nitrogen in three ways: ammonia (lots of water), urea, or a nearly solid paste that saves water. Birds lay eggs and must save water."
  c11b_filter: "Reabsorbed = filtered − urine. Divide by the amount filtered and × 100."
  b11_adh: "ADH = antidiuretic: it works against making lots of urine."
  b11_ammonia_toxic: "Urea is made from a more toxic waste to save water; uric acid saves even more."
  b11_ammonotelic: "Bony fish live in plenty of water and can wash away the most toxic waste directly."
  b11_ascending: "The descending limb lets water out; the ascending limb does the opposite job."
  b11_dialysis: "An artificial kidney passes blood through a machine. 'Haemo' means blood."
  b11_gfr: "125 mL × 60 × 24, then convert mL to litres."
  b11_malpighian_tubules: "Nephridia are in earthworms, flame cells in flatworms. Insects use tubules named after Malpighi."
  b11_nephrons: "About a million nephrons in each kidney."
  b11_pct: "Most useful substances, including all glucose, are taken back in the first, coiled part of the tubule."
  b11_renal_corpuscle: "The filtering unit is named after Malpighi too, but it is a 'body', not a tubule."
  c11b16_n: "Match the waste to the water supply: the more toxic the waste, the more water it takes to flush away. Which animals must save water?"
  c11b16_neph: 'Follow the filtrate along the nephron: filter (glomerulus), take back (PCT, loop, DCT), concentrate (collecting duct).'
concepts:
- code: cbse11b.excr.kidney
  title: Nitrogen waste and the human kidney
  notes: |
    Nitrogenous wastes: ammonia (most toxic, needs most water; ammonotelic—bony fish, aquatic amphibians), urea (ureotelic
    —mammals, terrestrial amphibians), uric acid (least toxic, little water; uricotelic—birds, reptiles, land snails,
    insects). Excretory organs: protonephridia (flatworms), nephridia (earthworm), Malpighian tubules (insects), antennal
    glands (prawns), kidneys (vertebrates). Human system: two kidneys, ureters, bladder, urethra. Kidney: cortex, medulla
    (pyramids), pelvis. Nephron (about 1 million per kidney): glomerulus + Bowman's capsule (Malpighian body), PCT, loop of
    Henle, DCT, collecting duct; cortical and juxtamedullary nephrons; vasa recta.
  explanations:
    text: Animals must get rid of nitrogen waste from proteins. Fish release ammonia, mammals make urea, and birds make uric acid, which saves water. In humans, each kidney has about a million tiny filtering units called nephrons.
    visual: 'Draw a nephron: a cup (Bowman''s capsule) around a knot of capillaries (glomerulus), then a twisted tube, a long U-shaped loop of Henle, another twisted tube, and a collecting duct.'
    step_by_step: 'Step 1: Match the animal to its waste and its water supply. Step 2: Name the excretory organ. Step 3: Trace a nephron''s parts in order.'
    real_world: Birds' white droppings are mostly uric acid, a paste that wastes very little water.
  picture:
    kind: flow
    steps:
    - Glomerulus + Bowman's capsule
    - PCT
    - Loop of Henle
    - DCT
    - Collecting duct
    alt: Parts of a nephron in order, from the filtering cup to the collecting duct.
  activity:
    type: sort
    prompt: Which nitrogenous waste does each animal mainly excrete?
    bins:
    - Ammonia
    - Urea
    - Uric acid
    items:
    - label: Bony fishes
      bin: Ammonia
      clue: A toxic waste that dissolves easily needs lots of water. Who has plenty?
      why: 'Ammonotelic: ammonia diffuses out through the gills.'
    - label: Tadpoles
      bin: Ammonia
      clue: Do tadpoles live in water?
      why: Aquatic tadpoles are ammonotelic.
    - label: Aquatic insects
      bin: Ammonia
      clue: Plenty of water around. Which waste?
      why: Ammonotelic.
    - label: Humans
      bin: Urea
      clue: Mammals make the liver convert ammonia. Into what?
      why: Mammals are ureotelic.
    - label: Marine fishes
      bin: Urea
      clue: Sea water draws water out. Which less toxic waste do they keep?
      why: Many marine fishes are ureotelic.
    - label: Adult frogs on land
      bin: Urea
      clue: Which waste needs moderate water?
      why: Terrestrial amphibians are ureotelic.
    - label: Birds
      bin: Uric acid
      clue: Which waste can be passed as a paste with almost no water?
      why: 'Uricotelic: saves water.'
    - label: Reptiles
      bin: Uric acid
      clue: Living in dry places, which waste saves water?
      why: Uricotelic.
    - label: Land snails
      bin: Uric acid
      clue: Which waste suits life on dry land?
      why: Uricotelic.
    - label: Land insects
      bin: Uric acid
      clue: Which nearly insoluble waste do they make?
      why: Uricotelic.
  lesson:
    - teach: 'Animals get rid of nitrogen waste as ammonia (most toxic, needs much water: bony fish), urea (mammals, land amphibians) or uric acid (least toxic, saves water: birds, reptiles, insects).'
      check:
        prompt: 'Humans are:'
        options:
        - ureotelic
        - ammonotelic
        - uricotelic
        answer: ureotelic
        why: We excrete mainly urea.
      ways:
      - style: visual
        teach: Three nitrogen wastes compared by toxicity and water needed.
        picture:
          kind: compare
          columns:
          - title: Ammonia
            points:
            - most toxic
            - needs most water
            - bony fish, tadpoles
          - title: Urea
            points:
            - less toxic
            - moderate water
            - mammals, adult frogs
          - title: Uric acid
            points:
            - least toxic
            - little water, a paste
            - birds, reptiles, insects
          alt: Ammonia is most toxic and needs the most water; urea is less toxic; uric acid is least toxic and leaves the body as a paste, saving water.
      - style: real_world
        teach: The white part of bird droppings on a car is uric acid, a near-dry paste. Birds lose very little water this way, which helps them fly light and live in dry places.
    - teach: 'Excretory organs vary: protonephridia (flatworms), nephridia (earthworms), Malpighian tubules (insects), antennal glands (prawns), kidneys (vertebrates). Humans have two kidneys, ureters, a bladder and a urethra.'
      check:
        prompt: 'Prawns excrete through:'
        options:
        - antennal (green) glands
        - nephridia
        - Malpighian tubules
        answer: antennal (green) glands
        why: A crustacean organ.
      ways:
      - style: visual
        teach: Excretory organs across animal groups, from worms to us.
        picture:
          kind: compare
          columns:
          - title: Invertebrates
            points:
            - 'flame cells: flatworms'
            - 'nephridia: earthworm'
            - 'Malpighian tubules: insects'
            - 'green glands: prawn'
          - title: Vertebrates
            points:
            - kidneys
            - with ureters, bladder and urethra in humans
          alt: Flatworms use flame cells, earthworms nephridia, insects Malpighian tubules and prawns green glands; vertebrates use kidneys.
      - style: step_by_step
        teach: 'Step 1: Kidney → ureter, a tube that carries urine down. Step 2: Ureter → urinary bladder, which stores it. Step 3: Bladder → urethra, out of the body. Step 4: Inside the kidney, the outer cortex holds the glomeruli and the inner medulla holds the loops and collecting ducts.'
    - teach: Each kidney has about a million nephrons. A nephron is a glomerulus in Bowman's capsule (together the Malpighian body), then the PCT, loop of Henle, DCT and collecting duct. Juxtamedullary nephrons have long loops and the vasa recta.
      picture:
        kind: flow
        steps:
        - Glomerulus + Bowman's capsule
        - PCT
        - Loop of Henle
        - DCT
        - Collecting duct
        alt: Parts of a nephron in order.
      check:
        prompt: 'The part of the nephron that dips into the medulla is the:'
        options:
        - loop of Henle
        - PCT
        - Bowman's capsule
        answer: loop of Henle
        why: It forms a hairpin into the medulla.
      ways:
      - style: step_by_step
        teach: 'Step 1: Blood enters by the afferent arteriole into the glomerulus. Step 2: Fluid is pushed into Bowman''s capsule. Step 3: It flows through the PCT, the loop of Henle and the DCT. Step 4: Many nephrons empty into one collecting duct, which leads to the pelvis and ureter.'
      - style: real_world
        teach: Each nephron is a tiny filter-and-recover unit, like a water purifier that pushes water through a filter and then puts the useful minerals back. Losing a few nephrons is fine; we have huge spare capacity.
  items:
  - prompt: About how many nephrons are in each human kidney (in millions)?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - About a million.
    - Each kidney.
    solution: "Each kidney has about one million nephrons, its filtering units."
    mistakes: {"10": "b11_nephrons", "100": "b11_nephrons", "2": "b11_nephrons"}
  - prompt: 'Birds excrete nitrogen mainly as:'
    options:
    - uric acid
    - urea
    - ammonia
    - amino acids
    answer: uric acid
    difficulty: 1
    hints:
    - Uricotelic.
    - Saves water.
    solution: "Uric acid needs very little water to remove, which suits birds' light bodies: they are uricotelic."
    mistakes:
      urea: c11b_nitrogen
  - prompt: 'Bony fish are:'
    options:
    - ammonotelic
    - ureotelic
    - uricotelic
    - none
    answer: ammonotelic
    difficulty: 2
    hints:
    - Plenty of water.
    - Ammonia diffuses out.
    solution: "Bony fish live in water and can remove toxic ammonia by diffusion through the gills: ammonotelic."
    mistakes: {"ureotelic": "b11_ammonotelic", "uricotelic": "b11_ammonotelic", "none": "b11_ammonotelic"}
  - prompt: 'Insects excrete through:'
    options:
    - Malpighian tubules
    - nephridia
    - flame cells
    - kidneys
    answer: Malpighian tubules
    difficulty: 2
    hints:
    - Attached to the gut.
    - Named after Malpighi.
    solution: "Malpighian tubules remove wastes from the haemolymph into the gut."
    mistakes: {"nephridia": "b11_malpighian_tubules", "flame cells": "b11_malpighian_tubules", "kidneys": "b11_malpighian_tubules"}
  - prompt: 'Glomerulus and Bowman''s capsule together form the:'
    options:
    - Malpighian body (renal corpuscle)
    - loop of Henle
    - collecting duct
    - renal pelvis
    answer: Malpighian body (renal corpuscle)
    difficulty: 2
    hints:
    - Filtering unit.
    - In the cortex.
    solution: "The glomerulus (capillary knot) and its cup, Bowman's capsule, together form the Malpighian body."
    mistakes: {"loop of Henle": "b11_renal_corpuscle", "collecting duct": "b11_renal_corpuscle", "renal pelvis": "b11_renal_corpuscle"}
  - prompt: Which waste is most toxic and needs the most water to remove?
    options:
    - ammonia
    - urea
    - uric acid
    - carbon dioxide
    answer: ammonia
    difficulty: 1
    hints:
    - Very soluble.
    - Fish.
    solution: "Ammonia is the most toxic and very soluble, so it must be diluted with much water."
    mistakes: {"urea": "b11_ammonia_toxic", "uric acid": "b11_ammonia_toxic", "carbon dioxide": "b11_ammonia_toxic"}
  - prompt: 'Reptiles and birds save water by excreting:'
    options:
    - uric acid
    - ammonia
    - urea
    answer: uric acid
    difficulty: 1
    hints:
    - It is a paste or pellet.
    - Least toxic, least water.
    solution: 'Step 1: water-saving waste. Step 2: uric acid.'
    mistakes:
      ammonia: c11b16_n
      urea: c11b16_n
  - prompt: 'Urine is carried from the kidney to the bladder by the:'
    options:
    - ureter
    - urethra
    - renal artery
    answer: ureter
    difficulty: 1
    hints:
    - One tube from each kidney.
    - The urethra leads out of the bladder.
    solution: 'Step 1: kidney to bladder. Step 2: ureter.'
    mistakes:
      urethra: c11b16_n
      renal artery: c11b16_n
  - prompt: 'Flatworms like Planaria excrete with:'
    options:
    - protonephridia (flame cells)
    - kidneys
    - Malpighian tubules
    answer: protonephridia (flame cells)
    difficulty: 1
    hints:
    - Their cilia flicker like a flame.
    - Proto means first, simple.
    solution: 'Step 1: simple tubules with flame cells. Step 2: protonephridia.'
    mistakes:
      kidneys: c11b16_n
      Malpighian tubules: c11b16_n
  - prompt: 'Urea is made in the:'
    options:
    - liver
    - kidney
    - bladder
    answer: liver
    difficulty: 2
    hints:
    - The kidney only removes it.
    - The ornithine cycle runs there.
    solution: 'Step 1: ammonia converted to urea. Step 2: in the liver.'
    mistakes:
      kidney: c11b16_n
      bladder: c11b16_n
  - prompt: 'The outer layer of the kidney containing glomeruli is the:'
    options:
    - cortex
    - medulla
    - pelvis
    answer: cortex
    difficulty: 2
    hints:
    - Malpighian bodies lie here.
    - The medulla holds the pyramids.
    solution: 'Step 1: glomeruli are in the outer zone. Step 2: cortex.'
    mistakes:
      medulla: c11b16_n
      pelvis: c11b16_n
  - prompt: 'Blood enters the glomerulus through the:'
    options:
    - afferent arteriole
    - efferent arteriole
    - vasa recta
    answer: afferent arteriole
    difficulty: 2
    hints:
    - Afferent means carrying towards.
    - It is wider than the exit vessel.
    solution: 'Step 1: incoming vessel. Step 2: afferent arteriole.'
    mistakes:
      efferent arteriole: c11b16_neph
      vasa recta: c11b16_neph
  - prompt: Why do bony fish excrete ammonia safely?
    options:
    - it dissolves and washes away easily in surrounding water
    - they make very little
    - it is non-toxic to fish
    answer: it dissolves and washes away easily in surrounding water
    difficulty: 2
    hints:
    - Ammonia is very soluble.
    - They live surrounded by water.
    solution: 'Step 1: plenty of water. Step 2: ammonia diffuses away.'
    mistakes:
      they make very little: c11b16_n
      it is non-toxic to fish: c11b16_n
  - prompt: 'Extensions of the renal cortex between the medullary pyramids are the:'
    options:
    - columns of Bertini
    - calyces
    - hilum
    answer: columns of Bertini
    difficulty: 3
    hints:
    - They are named after a scientist.
    - Cortex tissue dipping between pyramids.
    solution: 'Step 1: cortical extensions. Step 2: columns of Bertini.'
    mistakes:
      calyces: c11b16_n
      hilum: c11b16_n
  - prompt: Which nephrons help most in making concentrated urine?
    options:
    - juxtamedullary nephrons
    - cortical nephrons
    - both equally
    answer: juxtamedullary nephrons
    difficulty: 3
    hints:
    - Their loops of Henle are long.
    - They run deep into the medulla with the vasa recta.
    solution: 'Step 1: long loops. Step 2: build the concentration gradient.'
    mistakes:
      cortical nephrons: c11b16_neph
      both equally: c11b16_neph
  - prompt: 'Assertion (A): Birds excrete uric acid.

      Reason (R): Uric acid needs very little water to remove, which saves water.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Saving water is why birds excrete uric acid, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Ammonia is the least toxic nitrogenous waste.

      Reason (R): Ammonia is very soluble in water.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: ammonia is the most toxic. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A desert lizard passes a whitish paste instead of liquid urine. What is its main nitrogen waste, and why does this help it?'
    options:
    - Uric acid; it saves water
    - Ammonia; it is easy to remove
    - Urea; it needs most water
    answer: Uric acid; it saves water
    hints:
    - Which waste comes out as a paste?
    - What is short in a desert?
    solution: Uric acid is passed as a near-dry paste, so very little water is lost.
    mistakes:
      Ammonia; it is easy to remove: c11b_nitrogen
      Urea; it needs most water: c11b_nitrogen
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student sees nephrons whose loops of Henle dip deep into the medulla. What is their special role?'
    options:
    - Making concentrated urine
    - Making urea
    - Storing urine
    answer: Making concentrated urine
    hints:
    - Deep loops are longer.
    - What does a long loop in a salty medulla help with?
    solution: Juxtamedullary nephrons with long loops help build the salty medulla and concentrate urine.
    mistakes:
      Making urea: c11b16_neph
      Storing urine: c11b16_neph
    exam: competency
    difficulty: 2
- code: cbse11b.excr.urine
  title: Urine formation and regulation
  after:
  - cbse11b.excr.kidney
  notes: |
    Urine formation: glomerular filtration (ultrafiltration; GFR about 125 mL/min = 180 L/day), selective reabsorption
    (about 99%; PCT reabsorbs glucose, amino acids, most Na⁺ and water), tubular secretion (H⁺, K⁺, NH₃). Loop of Henle:
    descending limb permeable to water, ascending limb to salts; counter-current mechanism with vasa recta concentrates
    urine. Regulation: ADH (vasopressin) increases water reabsorption; renin–angiotensin–aldosterone; ANF (atrial
    natriuretic factor) opposes. Micturition (reflex). Other organs: lungs (CO₂), liver (bile pigments), skin (sweat,
    sebum). Disorders: uraemia, kidney failure (haemodialysis, transplant), renal calculi, glomerulonephritis.
  explanations:
    text: 'Kidneys make urine in three steps: filtration of blood, reabsorption of useful substances like glucose and most water, and secretion of extra wastes. Hormones like ADH adjust how much water is kept, so urine can be dilute or concentrated.'
    visual: 'Picture a sieve and a sorter: the glomerulus sieves out a lot of fluid, then the tubules pick back everything useful, leaving only waste and extra water.'
    step_by_step: 'Step 1: Filtration in the glomerulus. Step 2: Reabsorption mostly in the PCT. Step 3: Secretion in the tubules. Step 4: Concentration in the loop of Henle and collecting duct, controlled by ADH.'
    real_world: People with failed kidneys survive with haemodialysis, where a machine filters their blood several times a week.
  picture:
    kind: bars
    bars:
    - label: filtrate per day
      value: 180
    - label: urine per day
      value: 1.5
    alt: About 180 litres of filtrate are made each day, but only about 1.5 litres of urine are passed.
    unit: L
  activity:
    type: formula
    prompt: The kidneys filter blood at the GFR, then take most of the filtrate back. What isn't taken back leaves as urine.
    inputs:
    - name: g
      label: GFR
      min: 50
      max: 200
      step: 5
      start: 50
      unit: mL/min
    - name: r
      label: Filtrate taken back
      min: 90
      max: 100
      step: 0.5
      start: 90
      unit: '%'
    outputs:
    - name: filt
      label: Filtrate per day
      expr: g*1440/1000
      unit: L
      places: 1
    - name: urine
      label: Urine per day
      expr: g*1440/1000*(1-r/100)
      unit: L
      places: 2
    goals:
    - prompt: A healthy kidney filters 125 mL/min. Take back enough to make about 1.8 L of urine a day.
      want:
        g: 125
        urine:
        - 1.7
        - 1.9
      mistakes:
      - when:
          g: 125
          r: 90
        say: 'Taking back only 90% would lose 18 L of water a day! The tubules return almost all of it: 99%.'
      - when:
          g: 125
          r:
          - 99.5
          - 100
        say: 'Too little urine: waste can''t leave the body.'
    - prompt: Make the filtrate about 180 L a day.
      want:
        filt: 180
      mistakes:
      - when:
          g: 180
        say: '180 is litres per DAY. The GFR is mL per MINUTE: 180 000 mL ÷ 1440 min.'
      - when:
          g:
          - 50
          - 120
        say: 'Too little filtered: under 180 L a day.'
    - prompt: ADH is high because the body is short of water. With GFR 125, make about 0.9 L of urine.
      want:
        g: 125
        urine:
        - 0.85
        - 0.95
      mistakes:
      - when:
          g: 125
          r:
          - 90
          - 98.5
        say: More water lost, not less. ADH makes the tubules take back MORE water.
      - when:
          g:
          - 130
          - 200
        say: ADH doesn't change how fast the blood is filtered. Keep the GFR at 125 and change how much is taken back.
  lesson:
    - teach: 'Urine forms in three steps: glomerular filtration (blood pressure pushes fluid into Bowman''s capsule; GFR about 125 mL/min, 180 L a day), reabsorption (about 99% taken back) and tubular secretion (H⁺, K⁺, NH₃ added).'
      check:
        prompt: About how much of the filtrate is reabsorbed?
        options:
        - 99%
        - 50%
        - 1%
        answer: 99%
        why: Only about 1.5 L of urine forms from 180 L.
      ways:
      - style: visual
        teach: Three processes that turn blood into urine.
        picture:
          kind: flow
          steps:
          - 'Filtration: glomerulus → Bowman''s capsule'
          - 'Reabsorption: most water, glucose, salts back to blood'
          - 'Secretion: H⁺, K⁺, ammonia added to the tubule'
          - Urine to the collecting duct
          alt: Blood is filtered in the glomerulus, most of the filtrate is reabsorbed, extra wastes are secreted into the tubule, and urine flows to the collecting duct.
      - style: step_by_step
        teach: 'Step 1: Filtrate per minute is the GFR. Step 2: Per hour = GFR × 60; per day = GFR × 60 × 24. Step 3: For example, 100 mL/min × 1440 = 144 000 mL = 144 L a day. Step 4: Urine = filtrate − amount reabsorbed.'
    - teach: The descending loop of Henle lets water out; the ascending loop lets salts out but not water. With the vasa recta this counter-current system makes the medulla salty, so water leaves the collecting duct and urine becomes concentrated.
      check:
        prompt: 'The descending limb of Henle''s loop is permeable to:'
        options:
        - water
        - salts only
        - nothing
        answer: water
        why: Water leaves into the salty medulla.
      ways:
      - style: visual
        teach: The two limbs of the loop of Henle and what each lets out.
        picture:
          kind: compare
          columns:
          - title: Descending limb
            points:
            - lets water out
            - salts stay in
            - filtrate gets more concentrated
          - title: Ascending limb
            points:
            - lets salts out
            - water cannot leave
            - filtrate gets more dilute
          alt: The descending limb lets water out so the filtrate concentrates; the ascending limb lets salts out but not water, so the filtrate becomes dilute.
      - style: real_world
        teach: On a hot day after football, your urine is dark and small in amount; after drinking lots of water it is pale and plentiful. The salty medulla and ADH decide how much water the collecting ducts take back.
    - teach: 'Hormones control it: ADH (vasopressin) makes the kidney take back more water; the renin–angiotensin–aldosterone system raises blood pressure and Na⁺ uptake; ANF does the opposite. Lungs, liver and skin also excrete. Failure is treated by haemodialysis or transplant.'
      picture:
        kind: flow
        steps:
        - Filtration at glomerulus
        - Reabsorption in tubules
        - Secretion into tubules
        - Concentration in collecting duct
        alt: Steps of urine formation.
      check:
        prompt: 'Little ADH makes urine:'
        options:
        - large in volume and dilute
        - small and concentrated
        - unchanged
        answer: large in volume and dilute
        why: Less water is taken back.
      ways:
      - style: step_by_step
        teach: 'Step 1: Blood volume or pressure falls. Step 2: The JG cells release renin. Step 3: Renin turns angiotensinogen into angiotensin I, then II. Step 4: Angiotensin II narrows vessels and triggers aldosterone. Step 5: Aldosterone makes the DCT take back Na⁺ and water, raising pressure.'
      - style: real_world
        teach: People whose kidneys fail go to a dialysis centre two or three times a week. Their blood passes through a machine with a thin membrane that removes urea, and a kidney transplant from a matching donor is the long-term fix.
  items:
  - prompt: GFR is 125 mL/min. How much filtrate (in L) is made per day, to the nearest litre?
    answer: '180'
    check: round(125*60*24/Rational(1000))
    difficulty: 2
    hints:
    - 125 × 60 × 24 mL.
    - 180,000 mL.
    solution: "125 mL × 1440 min = 180,000 mL ≈ 180 L per day."
    mistakes: {"125": "b11_gfr", "3000": "b11_gfr", "1.8": "b11_gfr"}
  - prompt: If 180 L is filtered and 1.8 L of urine is passed, what percentage is reabsorbed?
    answer: '99'
    check: (180-Rational(18,10))*100/180
    difficulty: 2
    hints:
    - (180 − 1.8)/180 × 100.
    - 99%.
    solution: "Urine is 1.8/180 = 1% of the filtrate, so 99% is reabsorbed."
    mistakes:
      '1': c11b_filter
  - prompt: 'Glucose is reabsorbed mainly in the:'
    options:
    - proximal convoluted tubule
    - loop of Henle
    - collecting duct
    - urethra
    answer: proximal convoluted tubule
    difficulty: 2
    hints:
    - PCT.
    - First tubule.
    solution: "The PCT reabsorbs nearly all glucose, amino acids and much water and salt."
    mistakes: {"loop of Henle": "b11_pct", "collecting duct": "b11_pct", "urethra": "b11_pct"}
  - prompt: 'ADH (vasopressin) makes the kidney:'
    options:
    - reabsorb more water
    - lose more water
    - filter faster
    - make more urea
    answer: reabsorb more water
    difficulty: 1
    hints:
    - Anti-diuretic.
    - Concentrated urine.
    solution: "ADH makes the tubules more permeable to water, so more water is reabsorbed and urine is concentrated."
    mistakes: {"lose more water": "b11_adh", "filter faster": "b11_adh", "make more urea": "b11_adh"}
  - prompt: 'The ascending limb of the loop of Henle is:'
    options:
    - impermeable to water but lets salts out
    - permeable to water
    - the site of filtration
    - full of glucose
    answer: impermeable to water but lets salts out
    difficulty: 2
    hints:
    - Counter-current.
    - Salt pumped out.
    solution: Impermeable to water; salts move out.
    mistakes: {"permeable to water": "b11_ascending", "the site of filtration": "b11_ascending", "full of glucose": "b11_ascending"}
  - prompt: 'A machine that filters blood when kidneys fail performs:'
    options:
    - haemodialysis
    - transplant
    - angioplasty
    - ultrafiltration in the liver
    answer: haemodialysis
    difficulty: 1
    hints:
    - Artificial kidney.
    - Dialysis.
    solution: "In haemodialysis blood flows past a membrane in dialysing fluid, so urea diffuses out."
    mistakes: {"transplant": "b11_dialysis", "angioplasty": "b11_dialysis", "ultrafiltration in the liver": "b11_dialysis"}
  - prompt: GFR is 120 mL/min. Find the filtrate per hour (mL).
    answer: '7200'
    check: 120*60
    difficulty: 1
    hints:
    - 60 minutes in an hour.
    - 120 × 60.
    solution: 'Step 1: 120 × 60. Step 2: 7200 mL.'
    mistakes:
      '2': c11b16_neph
      '180': c11b16_neph
  - prompt: 'Kidney stones are called:'
