      so blood pressure rises: c11b16_neph
  - prompt: 'Assertion (A): Glucose is not normally found in urine.

      Reason (R): Glucose is almost completely reabsorbed in the proximal convoluted tubule.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Full reabsorption in the PCT keeps glucose out of urine, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Alcohol makes people pass more urine.

      Reason (R): Alcohol reduces the release of ADH.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Less ADH means less water taken back, so more urine forms; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A person''s GFR is 110 mL/min and they pass 1.5 L of urine a day. Roughly how much filtrate forms per day, and what percentage is reabsorbed?'
    options:
    - About 158 L; about 99%
    - About 6.6 L; about 77%
    - About 158 L; about 1%
    answer: About 158 L; about 99%
    hints:
    - There are 1440 minutes in a day.
    - Reabsorbed = filtered − urine.
    solution: 110 × 1440 = 158 400 mL ≈ 158 L. Reabsorbed ≈ (158 − 1.5) ÷ 158 ≈ 99%.
    mistakes:
      About 6.6 L; about 77%: c11b_filter
      About 158 L; about 1%: c11b_filter
    exam: case
    difficulty: 2
  - prompt: 'Situation: A person with a rare condition makes too little ADH. What happens to their urine?'
    options:
    - Large amounts of dilute urine
    - Small amounts of concentrated urine
    - No change
    answer: Large amounts of dilute urine
    hints:
    - What does ADH do in the collecting ducts?
    - Less ADH means more or less water taken back?
    solution: Without ADH, collecting ducts take back little water, so a lot of dilute urine is passed (diabetes insipidus).
    mistakes:
      Small amounts of concentrated urine: b11_adh
      No change: c11b16_neph
    exam: competency
    difficulty: 2
