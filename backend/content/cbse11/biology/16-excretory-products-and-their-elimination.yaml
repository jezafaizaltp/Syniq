# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 16. Format: content/README.md.
subject: cbse11-bio
chapter: 16
title: Excretory Products and their Elimination
tips:
  c11b_nitrogen: 'Ammonotelic (ammonia: fish), ureotelic (urea: mammals, frogs), uricotelic (uric acid: birds, reptiles, insects).'
  c11b_filter: 'Kidneys filter about 180 L of filtrate a day, yet only about 1.5 L of urine is passed: about 99% is reabsorbed.'
  b11_adh: "ADH = antidiuretic: it works against making lots of urine."
  b11_ammonia_toxic: "Urea is made from a more toxic waste to save water; uric acid saves even more."
  b11_ammonotelic: "Bony fish live in plenty of water and can wash away the most toxic waste directly."
  b11_ascending: "The descending limb lets water out; the ascending limb does the opposite job."
  b11_dialysis: "An artificial kidney passes blood through a machine. 'Haemo' means blood."
  b11_gfr: "125 mL × 60 × 24, then convert mL to litres."
  b11_malpighian_tubules: "Nephridia are in earthworms, flame cells in flatworms. Insects use tubules named after Malpighi."
  b11_nephrons: "About a million nephrons in each kidney."
  b11_pct: "Most useful substances, including all glucose, are taken back in the first, coiled part of the tubule."
  b11_renal_corpuscle: "The filtering unit is named after Malpighi too, but it is a 'body', not a tubule."
concepts:
- code: cbse11b.excr.kidney
  title: Nitrogen waste and the human kidney
  notes: |
    Nitrogenous wastes: ammonia (most toxic, needs most water; ammonotelic—bony fish, aquatic amphibians), urea (ureotelic
    —mammals, terrestrial amphibians), uric acid (least toxic, little water; uricotelic—birds, reptiles, land snails,
    insects). Excretory organs: protonephridia (flatworms), nephridia (earthworm), Malpighian tubules (insects), antennal
    glands (prawns), kidneys (vertebrates). Human system: two kidneys, ureters, bladder, urethra. Kidney: cortex, medulla
    (pyramids), pelvis. Nephron (about 1 million per kidney): glomerulus + Bowman's capsule (Malpighian body), PCT, loop of
    Henle, DCT, collecting duct; cortical and juxtamedullary nephrons; vasa recta.
  explanations:
    text: Animals must get rid of nitrogen waste from proteins. Fish release ammonia, mammals make urea, and birds make uric acid, which saves water. In humans, each kidney has about a million tiny filtering units called nephrons.
    visual: 'Draw a nephron: a cup (Bowman''s capsule) around a knot of capillaries (glomerulus), then a twisted tube, a long U-shaped loop of Henle, another twisted tube, and a collecting duct.'
    step_by_step: 'Step 1: Match the animal to its waste and its water supply. Step 2: Name the excretory organ. Step 3: Trace a nephron''s parts in order.'
    real_world: Birds' white droppings are mostly uric acid, a paste that wastes very little water.
  picture:
    kind: flow
    steps:
    - Glomerulus + Bowman's capsule
    - PCT
    - Loop of Henle
    - DCT
    - Collecting duct
    alt: Parts of a nephron in order, from the filtering cup to the collecting duct.
  activity:
    type: sort
    prompt: Which nitrogenous waste does each animal mainly excrete?
    bins:
    - Ammonia
    - Urea
    - Uric acid
    items:
    - label: Bony fishes
      bin: Ammonia
      clue: A toxic waste that dissolves easily needs lots of water. Who has plenty?
      why: 'Ammonotelic: ammonia diffuses out through the gills.'
    - label: Tadpoles
      bin: Ammonia
      clue: Do tadpoles live in water?
      why: Aquatic tadpoles are ammonotelic.
    - label: Aquatic insects
      bin: Ammonia
      clue: Plenty of water around. Which waste?
      why: Ammonotelic.
    - label: Humans
      bin: Urea
      clue: Mammals make the liver convert ammonia. Into what?
      why: Mammals are ureotelic.
    - label: Marine fishes
      bin: Urea
      clue: Sea water draws water out. Which less toxic waste do they keep?
      why: Many marine fishes are ureotelic.
    - label: Adult frogs on land
      bin: Urea
      clue: Which waste needs moderate water?
      why: Terrestrial amphibians are ureotelic.
    - label: Birds
      bin: Uric acid
      clue: Which waste can be passed as a paste with almost no water?
      why: 'Uricotelic: saves water.'
    - label: Reptiles
      bin: Uric acid
      clue: Living in dry places, which waste saves water?
      why: Uricotelic.
    - label: Land snails
      bin: Uric acid
      clue: Which waste suits life on dry land?
      why: Uricotelic.
    - label: Land insects
      bin: Uric acid
      clue: Which nearly insoluble waste do they make?
      why: Uricotelic.
  items:
  - prompt: About how many nephrons are in each human kidney (in millions)?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - About a million.
    - Each kidney.
    solution: About 1 million.
    mistakes: {"10": "b11_nephrons", "100": "b11_nephrons", "2": "b11_nephrons"}
  - prompt: 'Birds excrete nitrogen mainly as:'
    options:
    - uric acid
    - urea
    - ammonia
    - amino acids
    answer: uric acid
    difficulty: 1
    hints:
    - Uricotelic.
    - Saves water.
    solution: Uric acid.
    mistakes:
      urea: c11b_nitrogen
  - prompt: 'Bony fish are:'
    options:
    - ammonotelic
    - ureotelic
    - uricotelic
    - none
    answer: ammonotelic
    difficulty: 2
    hints:
    - Plenty of water.
    - Ammonia diffuses out.
    solution: Ammonotelic.
    mistakes: {"ureotelic": "b11_ammonotelic", "uricotelic": "b11_ammonotelic", "none": "b11_ammonotelic"}
  - prompt: 'Insects excrete through:'
    options:
    - Malpighian tubules
    - nephridia
    - flame cells
    - kidneys
    answer: Malpighian tubules
    difficulty: 2
    hints:
    - Attached to the gut.
    - Named after Malpighi.
    solution: Malpighian tubules.
    mistakes: {"nephridia": "b11_malpighian_tubules", "flame cells": "b11_malpighian_tubules", "kidneys": "b11_malpighian_tubules"}
  - prompt: 'Glomerulus and Bowman''s capsule together form the:'
    options:
    - Malpighian body (renal corpuscle)
    - loop of Henle
    - collecting duct
    - renal pelvis
    answer: Malpighian body (renal corpuscle)
    difficulty: 2
    hints:
    - Filtering unit.
    - In the cortex.
    solution: The Malpighian body.
    mistakes: {"loop of Henle": "b11_renal_corpuscle", "collecting duct": "b11_renal_corpuscle", "renal pelvis": "b11_renal_corpuscle"}
  - prompt: Which waste is most toxic and needs the most water to remove?
    options:
    - ammonia
    - urea
    - uric acid
    - carbon dioxide
    answer: ammonia
    difficulty: 1
    hints:
    - Very soluble.
    - Fish.
    solution: Ammonia.
    mistakes: {"urea": "b11_ammonia_toxic", "uric acid": "b11_ammonia_toxic", "carbon dioxide": "b11_ammonia_toxic"}
- code: cbse11b.excr.urine
  title: Urine formation and regulation
  after:
  - cbse11b.excr.kidney
  notes: |
    Urine formation: glomerular filtration (ultrafiltration; GFR about 125 mL/min = 180 L/day), selective reabsorption
    (about 99%; PCT reabsorbs glucose, amino acids, most Na⁺ and water), tubular secretion (H⁺, K⁺, NH₃). Loop of Henle:
    descending limb permeable to water, ascending limb to salts; counter-current mechanism with vasa recta concentrates
    urine. Regulation: ADH (vasopressin) increases water reabsorption; renin–angiotensin–aldosterone; ANF (atrial
    natriuretic factor) opposes. Micturition (reflex). Other organs: lungs (CO₂), liver (bile pigments), skin (sweat,
    sebum). Disorders: uraemia, kidney failure (haemodialysis, transplant), renal calculi, glomerulonephritis.
  explanations:
    text: 'Kidneys make urine in three steps: filtration of blood, reabsorption of useful substances like glucose and most water, and secretion of extra wastes. Hormones like ADH adjust how much water is kept, so urine can be dilute or concentrated.'
    visual: 'Picture a sieve and a sorter: the glomerulus sieves out a lot of fluid, then the tubules pick back everything useful, leaving only waste and extra water.'
    step_by_step: 'Step 1: Filtration in the glomerulus. Step 2: Reabsorption mostly in the PCT. Step 3: Secretion in the tubules. Step 4: Concentration in the loop of Henle and collecting duct, controlled by ADH.'
    real_world: People with failed kidneys survive with haemodialysis, where a machine filters their blood several times a week.
  picture:
    kind: bars
    bars:
    - label: filtrate per day
      value: 180
    - label: urine per day
      value: 1.5
    alt: About 180 litres of filtrate are made each day, but only about 1.5 litres of urine are passed.
    unit: L
  activity:
    type: formula
    prompt: The kidneys filter blood at the GFR, then take most of the filtrate back. What isn't taken back leaves as urine.
    inputs:
    - name: g
      label: GFR
      min: 50
      max: 200
      step: 5
      start: 50
      unit: mL/min
    - name: r
      label: Filtrate taken back
      min: 90
      max: 100
      step: 0.5
      start: 90
      unit: '%'
    outputs:
    - name: filt
      label: Filtrate per day
      expr: g*1440/1000
      unit: L
      places: 1
    - name: urine
      label: Urine per day
      expr: g*1440/1000*(1-r/100)
      unit: L
      places: 2
    goals:
    - prompt: A healthy kidney filters 125 mL/min. Take back enough to make about 1.8 L of urine a day.
      want:
        g: 125
        urine:
        - 1.7
        - 1.9
      mistakes:
      - when:
          g: 125
          r: 90
        say: 'Taking back only 90% would lose 18 L of water a day! The tubules return almost all of it: 99%.'
      - when:
          g: 125
          r:
          - 99.5
          - 100
        say: 'Too little urine: waste can''t leave the body.'
    - prompt: Make the filtrate about 180 L a day.
      want:
        filt: 180
      mistakes:
      - when:
          g: 180
        say: '180 is litres per DAY. The GFR is mL per MINUTE: 180 000 mL ÷ 1440 min.'
      - when:
          g:
          - 50
          - 120
        say: 'Too little filtered: under 180 L a day.'
    - prompt: ADH is high because the body is short of water. With GFR 125, make about 0.9 L of urine.
      want:
        g: 125
        urine:
        - 0.85
        - 0.95
      mistakes:
      - when:
          g: 125
          r:
          - 90
          - 98.5
        say: More water lost, not less. ADH makes the tubules take back MORE water.
      - when:
          g:
          - 130
          - 200
        say: ADH doesn't change how fast the blood is filtered. Keep the GFR at 125 and change how much is taken back.
  items:
  - prompt: GFR is 125 mL/min. How much filtrate (in L) is made per day, to the nearest litre?
    answer: '180'
    check: round(125*60*24/Rational(1000))
    difficulty: 2
    hints:
    - 125 × 60 × 24 mL.
    - 180,000 mL.
    solution: About 180 L.
    mistakes: {"125": "b11_gfr", "3000": "b11_gfr", "1.8": "b11_gfr"}
  - prompt: If 180 L is filtered and 1.8 L of urine is passed, what percentage is reabsorbed?
    answer: '99'
    check: (180-Rational(18,10))*100/180
    difficulty: 2
    hints:
    - (180 − 1.8)/180 × 100.
    - 99%.
    solution: 99%.
    mistakes:
      '1': c11b_filter
  - prompt: 'Glucose is reabsorbed mainly in the:'
    options:
    - proximal convoluted tubule
    - loop of Henle
    - collecting duct
    - urethra
    answer: proximal convoluted tubule
    difficulty: 2
    hints:
    - PCT.
    - First tubule.
    solution: The PCT.
    mistakes: {"loop of Henle": "b11_pct", "collecting duct": "b11_pct", "urethra": "b11_pct"}
  - prompt: 'ADH (vasopressin) makes the kidney:'
    options:
    - reabsorb more water
    - lose more water
    - filter faster
    - make more urea
    answer: reabsorb more water
    difficulty: 1
    hints:
    - Anti-diuretic.
    - Concentrated urine.
    solution: Reabsorb more water.
    mistakes: {"lose more water": "b11_adh", "filter faster": "b11_adh", "make more urea": "b11_adh"}
  - prompt: 'The ascending limb of the loop of Henle is:'
    options:
    - impermeable to water but lets salts out
    - permeable to water
    - the site of filtration
    - full of glucose
    answer: impermeable to water but lets salts out
    difficulty: 2
    hints:
    - Counter-current.
    - Salt pumped out.
    solution: Impermeable to water; salts move out.
    mistakes: {"permeable to water": "b11_ascending", "the site of filtration": "b11_ascending", "full of glucose": "b11_ascending"}
  - prompt: 'A machine that filters blood when kidneys fail performs:'
    options:
    - haemodialysis
    - transplant
    - angioplasty
    - ultrafiltration in the liver
    answer: haemodialysis
    difficulty: 1
    hints:
    - Artificial kidney.
    - Dialysis.
    solution: Haemodialysis.
    mistakes: {"transplant": "b11_dialysis", "angioplasty": "b11_dialysis", "ultrafiltration in the liver": "b11_dialysis"}
