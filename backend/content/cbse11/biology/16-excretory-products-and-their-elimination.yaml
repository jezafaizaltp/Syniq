# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 16. Format: content/README.md.
subject: cbse11-bio
chapter: 16
title: Excretory Products and their Elimination
tips:
  c11b_nitrogen: 'Ammonotelic (ammonia: fish), ureotelic (urea: mammals, frogs), uricotelic (uric acid: birds, reptiles, insects).'
  c11b_filter: 'Kidneys filter about 180 L of filtrate a day, yet only about 1.5 L of urine is passed: about 99% is reabsorbed.'
concepts:
- code: cbse11b.excr.kidney
  title: Nitrogen waste and the human kidney
  notes: |
    Nitrogenous wastes: ammonia (most toxic, needs most water; ammonotelic—bony fish, aquatic amphibians), urea (ureotelic
    —mammals, terrestrial amphibians), uric acid (least toxic, little water; uricotelic—birds, reptiles, land snails,
    insects). Excretory organs: protonephridia (flatworms), nephridia (earthworm), Malpighian tubules (insects), antennal
    glands (prawns), kidneys (vertebrates). Human system: two kidneys, ureters, bladder, urethra. Kidney: cortex, medulla
    (pyramids), pelvis. Nephron (about 1 million per kidney): glomerulus + Bowman's capsule (Malpighian body), PCT, loop of
    Henle, DCT, collecting duct; cortical and juxtamedullary nephrons; vasa recta.
  explanations:
    text: Animals must get rid of nitrogen waste from proteins. Fish release ammonia, mammals make urea, and birds make uric acid, which saves water. In humans, each kidney has about a million tiny filtering units called nephrons.
    visual: 'Draw a nephron: a cup (Bowman''s capsule) around a knot of capillaries (glomerulus), then a twisted tube, a long U-shaped loop of Henle, another twisted tube, and a collecting duct.'
    step_by_step: 'Step 1: Match the animal to its waste and its water supply. Step 2: Name the excretory organ. Step 3: Trace a nephron''s parts in order.'
    real_world: Birds' white droppings are mostly uric acid, a paste that wastes very little water.
  picture:
    kind: flow
    steps:
    - Glomerulus + Bowman's capsule
    - PCT
    - Loop of Henle
    - DCT
    - Collecting duct
    alt: Parts of a nephron in order, from the filtering cup to the collecting duct.
  items:
  - prompt: About how many nephrons are in each human kidney (in millions)?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - About a million.
    - Each kidney.
    solution: About 1 million.
  - prompt: 'Birds excrete nitrogen mainly as:'
    options:
    - uric acid
    - urea
    - ammonia
    - amino acids
    answer: uric acid
    difficulty: 1
    hints:
    - Uricotelic.
    - Saves water.
    solution: Uric acid.
    mistakes:
      urea: c11b_nitrogen
  - prompt: 'Bony fish are:'
    options:
    - ammonotelic
    - ureotelic
    - uricotelic
    - none
    answer: ammonotelic
    difficulty: 2
    hints:
    - Plenty of water.
    - Ammonia diffuses out.
    solution: Ammonotelic.
  - prompt: 'Insects excrete through:'
    options:
    - Malpighian tubules
    - nephridia
    - flame cells
    - kidneys
    answer: Malpighian tubules
    difficulty: 2
    hints:
    - Attached to the gut.
    - Named after Malpighi.
    solution: Malpighian tubules.
  - prompt: 'Glomerulus and Bowman''s capsule together form the:'
    options:
    - Malpighian body (renal corpuscle)
    - loop of Henle
    - collecting duct
    - renal pelvis
    answer: Malpighian body (renal corpuscle)
    difficulty: 2
    hints:
    - Filtering unit.
    - In the cortex.
    solution: The Malpighian body.
  - prompt: Which waste is most toxic and needs the most water to remove?
    options:
    - ammonia
    - urea
    - uric acid
    - carbon dioxide
    answer: ammonia
    difficulty: 1
    hints:
    - Very soluble.
    - Fish.
    solution: Ammonia.
- code: cbse11b.excr.urine
  title: Urine formation and regulation
  after:
  - cbse11b.excr.kidney
  notes: |
    Urine formation: glomerular filtration (ultrafiltration; GFR about 125 mL/min = 180 L/day), selective reabsorption
    (about 99%; PCT reabsorbs glucose, amino acids, most Na⁺ and water), tubular secretion (H⁺, K⁺, NH₃). Loop of Henle:
    descending limb permeable to water, ascending limb to salts; counter-current mechanism with vasa recta concentrates
    urine. Regulation: ADH (vasopressin) increases water reabsorption; renin–angiotensin–aldosterone; ANF (atrial
    natriuretic factor) opposes. Micturition (reflex). Other organs: lungs (CO₂), liver (bile pigments), skin (sweat,
    sebum). Disorders: uraemia, kidney failure (haemodialysis, transplant), renal calculi, glomerulonephritis.
  explanations:
    text: 'Kidneys make urine in three steps: filtration of blood, reabsorption of useful substances like glucose and most water, and secretion of extra wastes. Hormones like ADH adjust how much water is kept, so urine can be dilute or concentrated.'
    visual: 'Picture a sieve and a sorter: the glomerulus sieves out a lot of fluid, then the tubules pick back everything useful, leaving only waste and extra water.'
    step_by_step: 'Step 1: Filtration in the glomerulus. Step 2: Reabsorption mostly in the PCT. Step 3: Secretion in the tubules. Step 4: Concentration in the loop of Henle and collecting duct, controlled by ADH.'
    real_world: People with failed kidneys survive with haemodialysis, where a machine filters their blood several times a week.
  picture:
    kind: bars
    bars:
    - label: filtrate per day
      value: 180
    - label: urine per day
      value: 1.5
    alt: About 180 litres of filtrate are made each day, but only about 1.5 litres of urine are passed.
    unit: L
  items:
  - prompt: GFR is 125 mL/min. How much filtrate (in L) is made per day, to the nearest litre?
    answer: '180'
    check: round(125*60*24/Rational(1000))
    difficulty: 2
    hints:
    - 125 × 60 × 24 mL.
    - 180,000 mL.
    solution: About 180 L.
  - prompt: If 180 L is filtered and 1.8 L of urine is passed, what percentage is reabsorbed?
    answer: '99'
    check: (180-Rational(18,10))*100/180
    difficulty: 2
    hints:
    - (180 − 1.8)/180 × 100.
    - 99%.
    solution: 99%.
    mistakes:
      '1': c11b_filter
  - prompt: 'Glucose is reabsorbed mainly in the:'
    options:
    - proximal convoluted tubule
    - loop of Henle
    - collecting duct
    - urethra
    answer: proximal convoluted tubule
    difficulty: 2
    hints:
    - PCT.
    - First tubule.
    solution: The PCT.
  - prompt: 'ADH (vasopressin) makes the kidney:'
    options:
    - reabsorb more water
    - lose more water
    - filter faster
    - make more urea
    answer: reabsorb more water
    difficulty: 1
    hints:
    - Anti-diuretic.
    - Concentrated urine.
    solution: Reabsorb more water.
  - prompt: 'The ascending limb of the loop of Henle is:'
    options:
    - impermeable to water but lets salts out
    - permeable to water
    - the site of filtration
    - full of glucose
    answer: impermeable to water but lets salts out
    difficulty: 2
    hints:
    - Counter-current.
    - Salt pumped out.
    solution: Impermeable to water; salts move out.
  - prompt: 'A machine that filters blood when kidneys fail performs:'
    options:
    - haemodialysis
    - transplant
    - angioplasty
    - ultrafiltration in the liver
    answer: haemodialysis
    difficulty: 1
    hints:
    - Artificial kidney.
    - Dialysis.
    solution: Haemodialysis.
