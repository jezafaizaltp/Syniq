# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse11-bio
chapter: 13
title: Plant Growth and Development
tips:
  c11b_hormone: 'Auxin: shoot growth and apical dominance. Gibberellin: stem lengthening. Cytokinin: cell division. Ethylene: ripening. ABA: stress and dormancy.'
  c11b_photo: Photoperiodism responds to the length of the DARK period; short-day plants need a long night.
  b11_24d: "2,4-D kills broadleaf weeds by causing uncontrolled growth, mimicking the first plant hormone discovered."
  b11_aba: "Drought: the plant needs to close stomata and stop growth. Which inhibitor is the stress hormone?"
  b11_absolute_growth: "Absolute growth = final − initial."
  b11_bakanae: "A fungus, Gibberella, made rice seedlings grow too tall. The hormone is named after the fungus."
  b11_dedifferentiation: "Differentiated cells lose the ability to divide; regaining it reverses the process ('de-')."
  b11_indeterminate: "Plants keep tissues at root and shoot tips that never stop dividing."
  b11_plasticity: "The plant follows different paths of development with conditions; that flexibility is called?"
  b11_relative_growth: "Relative growth = growth ÷ initial size × 100."
  b11_sigmoid: "An S-shaped curve: slow start, rapid middle, flat end. Three phases."
  b11_vernalisation: "'Vernal' means spring. Cold exposure in winter prepares the plant to flower in spring."
concepts:
- code: cbse11b.growth.growth
  title: Growth, differentiation and development
  notes: |
    Growth: irreversible permanent increase in size; indeterminate in plants (meristems). Phases: meristematic,
    elongation, maturation. Growth rate: arithmetic (Lt = L0 + rt) and geometric (W1 = W0 e^(rt)); sigmoid curve (lag, log,
    stationary). Absolute and relative growth rate. Conditions: water, oxygen, nutrients, temperature, light.
    Differentiation, dedifferentiation (e.g. interfascicular cambium, cork cambium), redifferentiation. Development:
    all changes in the life cycle; plasticity (heterophylly in cotton, coriander, larkspur, buttercup).
  explanations:
    text: 'Plants keep growing all their lives at their meristems. Growth follows an S-shaped curve: slow at first, then fast, then levelling off. Cells can specialise (differentiate), and some can even go back and start dividing again.'
    visual: 'Draw an S-curve: a flat lag phase, a steep log phase, and a flat stationary phase at the top.'
    step_by_step: 'Step 1: Identify the phase of growth. Step 2: For arithmetic growth, add a fixed amount each step. Step 3: For geometric, multiply. Step 4: Relate cell changes to differentiation terms.'
    real_world: Bamboo can grow about 90 cm in a day, one of the fastest growth rates of any plant.
  picture:
    kind: flow
    steps:
    - Lag phase (slow)
    - Log phase (fast)
    - Stationary phase (levels off)
    alt: 'The S-shaped growth curve: lag, log and stationary phases.'
  activity:
    type: sort
    prompt: Arithmetic or geometric growth?
    bins:
    - Arithmetic
    - Geometric
    items:
    - label: One daughter cell divides on, the other matures
      bin: Arithmetic
      clue: Does the number of dividing cells grow, or stay the same?
      why: 'Only one cell divides each time, so growth adds a fixed amount: arithmetic.'
    - label: A root tip lengthening at a steady rate
      bin: Arithmetic
      clue: Is the same length added each day?
      why: A constant rate gives Lₜ = L₀ + rt.
    - label: A straight line when size is plotted against time
      bin: Arithmetic
      clue: What does a straight-line graph mean?
      why: 'Equal amounts added in equal times: arithmetic.'
    - label: Lₜ = L₀ + rt
      bin: Arithmetic
      clue: Is r added or multiplied?
      why: 'r is added each unit of time: arithmetic.'
    - label: Both daughter cells keep dividing
      bin: Geometric
      clue: If every cell divides, what happens to the number?
      why: 'The number doubles each time: geometric.'
    - label: The early cell divisions of an embryo
      bin: Geometric
      clue: Do all the cells keep dividing?
      why: All cells divide, so numbers multiply.
    - label: 'An S-shaped curve: lag, log and stationary phases'
      bin: Geometric
      clue: Which kind of growth gives a fast 'log' phase?
      why: The sigmoid curve comes from geometric growth slowed by limited food.
    - label: W₁ = W₀ e^(rt)
      bin: Geometric
      clue: Does the size multiply by a factor or add a fixed amount?
      why: 'Exponential: geometric growth.'
  items:
  - prompt: A leaf grows from 5 cm² to 10 cm² in a day. Find its absolute growth (in cm²).
    answer: '5'
    check: 10-5
    difficulty: 1
    hints:
    - Final − initial.
    - 10 − 5.
    solution: 5 cm².
    mistakes: {"10": "b11_absolute_growth", "15": "b11_absolute_growth", "2": "b11_absolute_growth"}
  - prompt: For that leaf, find its relative growth rate as a percentage.
    answer: '100'
    check: Rational(5,5)*100
    difficulty: 2
    hints:
    - Growth ÷ initial × 100.
    - 5/5 × 100.
    solution: 100%.
    mistakes: {"50": "b11_relative_growth", "5": "b11_relative_growth", "200": "b11_relative_growth"}
  - prompt: 'A sigmoid growth curve has the phases:'
    options:
    - lag, log and stationary
    - only log
    - rapid then decline
    - constant
    answer: lag, log and stationary
    difficulty: 1
    hints:
    - S-shape.
    - Slow, fast, flat.
    solution: Lag, log, stationary.
    mistakes: {"only log": "b11_sigmoid", "rapid then decline": "b11_sigmoid", "constant": "b11_sigmoid"}
  - prompt: 'Cells that regain the ability to divide undergo:'
    options:
    - dedifferentiation
    - differentiation
    - senescence
    - abscission
    answer: dedifferentiation
    difficulty: 2
    hints:
    - Cork cambium forms this way.
    - Going back.
    solution: Dedifferentiation.
    mistakes: {"differentiation": "b11_dedifferentiation", "senescence": "b11_dedifferentiation", "abscission": "b11_dedifferentiation"}
  - prompt: 'Different leaf shapes on the same plant (heterophylly) show:'
    options:
    - plasticity
    - dormancy
    - vernalisation
    - senescence
    answer: plasticity
    difficulty: 2
    hints:
    - Cotton, coriander.
    - Response to environment.
    solution: Plasticity.
    mistakes: {"dormancy": "b11_plasticity", "vernalisation": "b11_plasticity", "senescence": "b11_plasticity"}
  - prompt: 'Plant growth is called indeterminate because:'
    options:
    - meristems keep dividing throughout life
    - plants stop growing early
    - it happens only at night
    - cells never divide
    answer: meristems keep dividing throughout life
    difficulty: 2
    hints:
    - Open growth.
    - Tips keep growing.
    solution: Meristems stay active.
    mistakes: {"plants stop growing early": "b11_indeterminate", "it happens only at night": "b11_indeterminate", "cells never divide": "b11_indeterminate"}
- code: cbse11b.growth.regulators
  title: Plant growth regulators
  after:
  - cbse11b.growth.growth
  notes: |
    Plant growth regulators (PGRs): promoters—auxins (IAA, IBA; Darwin's coleoptile experiments, Went; apical dominance,
    rooting, parthenocarpy, 2,4-D weedicide), gibberellins (GA₃; bakanae disease of rice; stem elongation, bolting,
    sugarcane yield, malting), cytokinins (kinetin, zeatin; cell division, delay senescence, overcome apical dominance);
    inhibitors—abscisic acid (ABA; stress hormone, stomatal closure, dormancy) and ethylene (gas; fruit ripening,
    abscission, flowering in pineapple; ethephon). Photoperiodism (short-day, long-day, day-neutral plants; site of
    perception is the leaf). Vernalisation (cold treatment to induce flowering in wheat, biennials).
  explanations:
    text: Plant hormones control growth. Auxin makes shoots grow and bend toward light; gibberellins make stems longer; cytokinins make cells divide; ethylene ripens fruit; and abscisic acid helps plants cope with stress like drought.
    visual: 'Picture a ripe banana in a bag with green tomatoes: the ethylene gas from the banana makes the tomatoes ripen faster.'
    step_by_step: 'Step 1: Identify the effect (growth, division, ripening, closing stomata). Step 2: Match it to the hormone. Step 3: For flowering, check day length and cold.'
    real_world: Fruit sellers ripen mangoes and bananas quickly with ethylene, which is safer than calcium carbide.
  picture:
    kind: compare
    columns:
    - title: Hormone
      points:
      - auxin
      - gibberellin
      - cytokinin
      - ethylene
      - abscisic acid
    - title: Main effect
      points:
      - shoot growth, apical dominance
      - stem lengthening
      - cell division
      - fruit ripening
      - stress, dormancy
    alt: Five plant hormones and their main effects.
  activity:
    type: sort
    prompt: Which plant growth regulator does this?
    bins:
    - Auxin
    - Gibberellin
    - Cytokinin
    - Ethylene
    - Abscisic acid
    items:
    - label: Keeps the top bud growing, holding side buds back
      bin: Auxin
      clue: Which regulator, made at the shoot tip, causes apical dominance?
      why: Auxin from the tip suppresses lateral buds.
    - label: Helps stem cuttings form roots
      bin: Auxin
      clue: Which regulator do gardeners dip cuttings in?
      why: IBA and NAA, auxins, start rooting.
    - label: 2,4-D kills broad-leaved weeds
      bin: Auxin
      clue: 2,4-D is a synthetic version of which regulator?
      why: A synthetic auxin used as a weedkiller.
    - label: 'Bolting: cabbage stems shoot up before flowering'
      bin: Gibberellin
      clue: Which regulator lengthens internodes?
      why: Gibberellins cause bolting.
    - label: Lengthens grape stalks
      bin: Gibberellin
      clue: Which regulator makes stalks longer?
      why: GA₃ lengthens grape stalks.
    - label: Starts side shoots, breaking apical dominance
      bin: Cytokinin
      clue: Which regulator works against auxin at side buds?
      why: Cytokinins promote lateral shoots.
    - label: Delays leaf ageing (senescence)
      bin: Cytokinin
      clue: Which regulator keeps leaves green longer?
      why: Cytokinins delay senescence.
    - label: Ripens fruits
      bin: Ethylene
      clue: Which gas speeds ripening?
      why: Ethylene ripens fruits.
    - label: Makes leaves and flowers fall (abscission)
      bin: Ethylene
      clue: Which gas promotes shedding?
      why: Ethylene promotes abscission of leaves and flowers.
    - label: Closes stomata in a drought
      bin: Abscisic acid
      clue: Which regulator is the 'stress hormone'?
      why: ABA closes stomata.
    - label: Keeps seeds dormant
      bin: Abscisic acid
      clue: Which regulator stops seeds sprouting too soon?
      why: ABA induces dormancy.
  items:
  - prompt: Which hormone ripens fruit?
    options:
    - ethylene
    - auxin
    - gibberellin
    - cytokinin
    answer: ethylene
    difficulty: 1
    hints:
    - A gas.
    - Banana in a bag.
    solution: Ethylene.
    mistakes:
      auxin: c11b_hormone
  - prompt: 'The stress hormone that closes stomata during drought is:'
    options:
    - abscisic acid
    - auxin
    - gibberellin
    - cytokinin
    answer: abscisic acid
    difficulty: 1
    hints:
    - ABA.
    - Saves water.
    solution: Abscisic acid.
    mistakes: {"auxin": "b11_aba", "gibberellin": "b11_aba", "cytokinin": "b11_aba"}
  - prompt: 'Bakanae (foolish seedling) disease of rice led to the discovery of:'
    options:
    - gibberellins
    - auxins
    - cytokinins
    - ethylene
    answer: gibberellins
    difficulty: 2
    hints:
    - Very tall seedlings.
    - Fungus Gibberella.
    solution: Gibberellins.
    mistakes: {"auxins": "b11_bakanae", "cytokinins": "b11_bakanae", "ethylene": "b11_bakanae"}
  - prompt: '2,4-D, a weedicide, is a synthetic:'
    options:
    - auxin
    - gibberellin
    - cytokinin
    - abscisic acid
    answer: auxin
    difficulty: 2
    hints:
    - Kills dicot weeds.
    - Spares cereals.
    solution: Auxin.
    mistakes: {"gibberellin": "b11_24d", "cytokinin": "b11_24d", "abscisic acid": "b11_24d"}
  - prompt: 'Short-day plants actually need:'
    options:
    - a long uninterrupted dark period
    - a short night
    - continuous light
    - cold only
    answer: a long uninterrupted dark period
    difficulty: 2
    hints:
    - Critical night length.
    - Dark matters.
    solution: A long night.
    mistakes:
      a short night: c11b_photo
  - prompt: 'Cold treatment that brings on flowering is called:'
    options:
    - vernalisation
    - photoperiodism
    - dormancy
    - senescence
    answer: vernalisation
    difficulty: 2
    hints:
    - Winter wheat.
    - Vernal = spring.
    solution: Vernalisation.
    mistakes: {"photoperiodism": "b11_vernalisation", "dormancy": "b11_vernalisation", "senescence": "b11_vernalisation"}
