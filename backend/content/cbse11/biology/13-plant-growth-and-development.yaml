# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse11-bio
chapter: 13
title: Plant Growth and Development
tips:
  c11b_hormone: "Each plant hormone has a main job. Fruit ripening is caused by the only plant hormone that is a gas."
  c11b_photo: Photoperiodism responds to the length of the DARK period; short-day plants need a long night.
  b11_24d: "2,4-D kills broadleaf weeds by causing uncontrolled growth, mimicking the first plant hormone discovered."
  b11_aba: "Drought: the plant needs to close stomata and stop growth. Which inhibitor is the stress hormone?"
  b11_absolute_growth: "Absolute growth = final − initial."
  b11_bakanae: "A fungus, Gibberella, made rice seedlings grow too tall. The hormone is named after the fungus."
  b11_dedifferentiation: "Differentiated cells lose the ability to divide; regaining it reverses the process ('de-')."
  b11_indeterminate: "Plants keep tissues at root and shoot tips that never stop dividing."
  b11_plasticity: "The plant follows different paths of development with conditions; that flexibility is called?"
  b11_relative_growth: "Relative growth = growth ÷ initial size × 100. How much did the leaf grow, compared with how big it started?"
  b11_sigmoid: "An S-shaped curve: slow start, rapid middle, flat end. Three phases."
  b11_vernalisation: "'Vernal' means spring. Cold exposure in winter prepares the plant to flower in spring."
  c11b13_growth: Absolute growth is the plain increase; relative growth is that increase divided by the starting size.
  c11b13_pgr: "Match the hormone to its signature job. Which hormone keeps cells dividing and young, and which one ages and ripens?"
concepts:
- code: cbse11b.growth.growth
  title: Growth, differentiation and development
  notes: |
    Growth: irreversible permanent increase in size; indeterminate in plants (meristems). Phases: meristematic,
    elongation, maturation. Growth rate: arithmetic (Lt = L0 + rt) and geometric (W1 = W0 e^(rt)); sigmoid curve (lag, log,
    stationary). Absolute and relative growth rate. Conditions: water, oxygen, nutrients, temperature, light.
    Differentiation, dedifferentiation (e.g. interfascicular cambium, cork cambium), redifferentiation. Development:
    all changes in the life cycle; plasticity (heterophylly in cotton, coriander, larkspur, buttercup).
  explanations:
    text: 'Plants keep growing all their lives at their meristems. Growth follows an S-shaped curve: slow at first, then fast, then levelling off. Cells can specialise (differentiate), and some can even go back and start dividing again.'
    visual: 'Draw an S-curve: a flat lag phase, a steep log phase, and a flat stationary phase at the top.'
    step_by_step: 'Step 1: Identify the phase of growth. Step 2: For arithmetic growth, add a fixed amount each step. Step 3: For geometric, multiply. Step 4: Relate cell changes to differentiation terms.'
    real_world: Bamboo can grow about 90 cm in a day, one of the fastest growth rates of any plant.
  picture:
    kind: flow
    steps:
    - Lag phase (slow)
    - Log phase (fast)
    - Stationary phase (levels off)
    alt: 'The S-shaped growth curve: lag, log and stationary phases.'
  activity:
    type: sort
    prompt: Arithmetic or geometric growth?
    bins:
    - Arithmetic
    - Geometric
    items:
    - label: One daughter cell divides on, the other matures
      bin: Arithmetic
      clue: Does the number of dividing cells grow, or stay the same?
      why: 'Only one cell divides each time, so growth adds a fixed amount: arithmetic.'
    - label: A root tip lengthening at a steady rate
      bin: Arithmetic
      clue: Is the same length added each day?
      why: A constant rate gives Lₜ = L₀ + rt.
    - label: A straight line when size is plotted against time
      bin: Arithmetic
      clue: What does a straight-line graph mean?
      why: 'Equal amounts added in equal times: arithmetic.'
    - label: Lₜ = L₀ + rt
      bin: Arithmetic
      clue: Is r added or multiplied?
      why: 'r is added each unit of time: arithmetic.'
    - label: Both daughter cells keep dividing
      bin: Geometric
      clue: If every cell divides, what happens to the number?
      why: 'The number doubles each time: geometric.'
    - label: The early cell divisions of an embryo
      bin: Geometric
      clue: Do all the cells keep dividing?
      why: All cells divide, so numbers multiply.
    - label: 'An S-shaped curve: lag, log and stationary phases'
      bin: Geometric
      clue: Which kind of growth gives a fast 'log' phase?
      why: The sigmoid curve comes from geometric growth slowed by limited food.
    - label: W₁ = W₀ e^(rt)
      bin: Geometric
      clue: Does the size multiply by a factor or add a fixed amount?
      why: 'Exponential: geometric growth.'
  lesson:
    - teach: 'Growth is a permanent, irreversible increase in size. In plants it is indeterminate: meristems keep adding cells all life long. Growth passes through meristematic, elongation and maturation phases.'
      check:
        prompt: Why is a seed swelling with water not counted as growth?
        options:
        - it can be reversed by drying
        - it is too slow
        - seeds never grow
        answer: it can be reversed by drying
        why: Growth must be irreversible.
      ways:
      - style: visual
        teach: Three zones of a growing root tip, from the tip upwards.
        picture:
          kind: flow
          steps:
          - 'Meristematic: small cells dividing'
          - 'Elongation: cells grow longer, vacuoles form'
          - 'Maturation: cells reach full size and specialise'
          alt: At the root tip, cells divide in the meristematic zone, lengthen in the elongation zone and specialise in the maturation zone.
      - style: real_world
        teach: 'Mark a germinating bean root with ink dots spaced equally. After a day, the dots just behind the tip move far apart while those near the seed stay close: most stretching happens in the zone of elongation.'
    - teach: 'Arithmetic growth: one daughter cell keeps dividing, the other differentiates (Lt = L0 + rt, a straight line). Geometric growth: both daughters divide (W1 = W0e^(rt)), giving an S-shaped (sigmoid) curve with lag, log and stationary phases.'
      check:
        prompt: 'A root lengthening at a steady rate shows:'
        options:
        - arithmetic growth
        - geometric growth
        - no growth
        answer: arithmetic growth
        why: Constant rate gives a straight line.
      ways:
      - style: visual
        teach: Arithmetic and geometric growth compared side by side.
        picture:
          kind: compare
          columns:
          - title: Arithmetic
            points:
            - one daughter divides, one specialises
            - same amount added each time
            - straight-line graph
            - root growing at a steady rate
          - title: Geometric
            points:
            - both daughters divide
            - amount added keeps rising
            - 'lag, log, then stationary: S-curve'
            - cells in a culture
          alt: In arithmetic growth one daughter cell keeps dividing and the graph is a straight line; in geometric growth both divide, giving an S-shaped curve with lag, log and stationary phases.
      - style: step_by_step
        teach: 'Step 1: Absolute growth = final size − starting size. Step 2: Relative growth = absolute growth ÷ starting size. Step 3: Times 100 for a percentage. Example: a stem from 40 cm to 52 cm grows 12 cm, which is 12 ÷ 40 = 30%.'
    - teach: 'Cells differentiate into special types. Some living cells can dedifferentiate (regain the power to divide, like cork cambium) and then redifferentiate. Plants also show plasticity: different leaf shapes on one plant (heterophylly).'
      picture:
        kind: flow
        steps:
        - 'Lag phase: slow start'
        - 'Log phase: fast growth'
        - 'Stationary phase: levels off'
        alt: Phases of a sigmoid growth curve.
      check:
        prompt: 'In the log phase of a sigmoid curve, growth is:'
        options:
        - fastest
        - zero
        - negative
        answer: fastest
        why: Both daughter cells keep dividing.
      ways:
      - style: step_by_step
        teach: 'Step 1: A cell from the meristem specialises: differentiation. Step 2: A specialised living cell starts dividing again: dedifferentiation. Step 3: Its daughters specialise again: redifferentiation. Example: parenchyma forms cork cambium, which makes cork.'
      - style: real_world
        teach: A single leaf piece of African violet placed on moist soil grows a whole new plant. Its specialised leaf cells dedifferentiate, divide, and redifferentiate into roots and shoots. Plant tissue culture labs use the same ability.
  items:
  - prompt: A leaf grows from 5 cm² to 10 cm² in a day. Find its absolute growth (in cm²).
    answer: '5'
    check: 10-5
    difficulty: 1
    hints:
    - Final − initial.
    - 10 − 5.
    solution: 5 cm².
    mistakes: {"10": "b11_absolute_growth", "15": "b11_absolute_growth", "2": "b11_absolute_growth"}
  - prompt: For that leaf, find its relative growth rate as a percentage.
    answer: '100'
    check: Rational(5,5)*100
    difficulty: 2
    hints:
    - Growth ÷ initial × 100.
    - 5/5 × 100.
    solution: 100%.
    mistakes: {"50": "b11_relative_growth", "5": "b11_relative_growth", "200": "b11_relative_growth"}
  - prompt: 'A sigmoid growth curve has the phases:'
    options:
    - lag, log and stationary
    - only log
    - rapid then decline
    - constant
    answer: lag, log and stationary
    difficulty: 1
    hints:
    - S-shape.
    - Slow, fast, flat.
    solution: Lag, log, stationary.
    mistakes: {"only log": "b11_sigmoid", "rapid then decline": "b11_sigmoid", "constant": "b11_sigmoid"}
  - prompt: 'Cells that regain the ability to divide undergo:'
    options:
    - dedifferentiation
    - differentiation
    - senescence
    - abscission
    answer: dedifferentiation
    difficulty: 2
    hints:
    - Cork cambium forms this way.
    - Going back.
    solution: Dedifferentiation.
    mistakes: {"differentiation": "b11_dedifferentiation", "senescence": "b11_dedifferentiation", "abscission": "b11_dedifferentiation"}
  - prompt: 'Different leaf shapes on the same plant (heterophylly) show:'
    options:
    - plasticity
    - dormancy
    - vernalisation
    - senescence
    answer: plasticity
    difficulty: 2
    hints:
    - Cotton, coriander.
    - Response to environment.
    solution: Plasticity.
    mistakes: {"dormancy": "b11_plasticity", "vernalisation": "b11_plasticity", "senescence": "b11_plasticity"}
  - prompt: 'Plant growth is called indeterminate because:'
    options:
    - meristems keep dividing throughout life
    - plants stop growing early
    - it happens only at night
    - cells never divide
    answer: meristems keep dividing throughout life
    difficulty: 2
    hints:
    - Open growth.
    - Tips keep growing.
    solution: Meristems stay active.
    mistakes: {"plants stop growing early": "b11_indeterminate", "it happens only at night": "b11_indeterminate", "cells never divide": "b11_indeterminate"}
  - prompt: A plant grows from 20 cm to 30 cm. Find its absolute growth (cm).
    answer: '10'
    check: 30-20
    difficulty: 1
    hints:
    - Absolute growth = final − initial.
    - 30 − 20.
    solution: 'Step 1: 30 − 20. Step 2: 10 cm.'
    mistakes:
      '50': c11b13_growth
      '1.5': c11b13_growth
  - prompt: 'The phase of growth just behind the root tip where cells get longer is the:'
    options:
    - phase of elongation
    - meristematic phase
    - phase of maturation
    answer: phase of elongation
    difficulty: 1
    hints:
    - Cells enlarge and form vacuoles.
    - It lies between the dividing and the mature zone.
    solution: 'Step 1: cells stretch. Step 2: elongation.'
    mistakes:
      meristematic phase: c11b13_growth
      phase of maturation: c11b13_growth
  - prompt: Which is NOT needed for plant growth?
    options:
    - darkness all the time
    - water
    - oxygen
    answer: darkness all the time
    difficulty: 1
    hints:
    - Growing cells need water, oxygen and food.
    - Light helps many processes.
    solution: 'Step 1: water, O₂, nutrients and light help. Step 2: constant darkness does not.'
    mistakes:
      water: c11b13_growth
      oxygen: c11b13_growth
  - prompt: Leaf A grows 5 → 10 cm² and leaf B grows 20 → 25 cm². Which has the higher relative growth rate?
    options:
    - A
    - B
    - equal
    answer: A
    difficulty: 2
    hints:
    - Both grew 5 cm².
    - Divide by the starting size.
    solution: 'Step 1: A = 5/5 = 100%, B = 5/20 = 25%. Step 2: A.'
    mistakes:
      B: c11b13_growth
      equal: c11b13_growth
  - prompt: A cell grows from 50 μm³ to 75 μm³. Find its relative growth (%).
    answer: '50'
    check: 25/50*100
    difficulty: 2
    hints:
    - Increase = 25.
    - Divide by 50, times 100.
    solution: 'Step 1: 25/50. Step 2: 50%.'
    mistakes:
      '25': c11b13_growth
      '150': c11b13_growth
  - prompt: 'Cotton and coriander have different leaves in young and mature plants. This is:'
    options:
    - heterophylly
    - vernalisation
    - dedifferentiation
    answer: heterophylly
    difficulty: 2
    hints:
    - Hetero = different, phyll = leaf.
    - It shows plasticity.
    solution: 'Step 1: different leaf forms. Step 2: heterophylly.'
    mistakes:
      vernalisation: c11b13_growth
      dedifferentiation: c11b13_growth
  - prompt: 'Tracheary elements lose their protoplasm when mature. This is an example of:'
    options:
    - differentiation
    - dedifferentiation
    - redifferentiation
    answer: differentiation
    difficulty: 2
    hints:
    - Cells change to do one special job.
    - They become water pipes.
    solution: 'Step 1: specialisation. Step 2: differentiation.'
    mistakes:
      dedifferentiation: c11b13_growth
      redifferentiation: c11b13_growth
  - prompt: 'In buttercup, leaves in water differ from leaves in air. This shows the plant''s response to:'
    options:
    - environment
    - age only
    - hormones only
    answer: environment
    difficulty: 3
    hints:
    - Same plant, different surroundings.
    - Water versus air.
    solution: 'Step 1: habitat changes leaf form. Step 2: environmental plasticity.'
    mistakes:
      age only: c11b13_growth
      hormones only: c11b13_growth
  - prompt: 'Interfascicular cambium forms from mature parenchyma. This is:'
    options:
    - dedifferentiation
    - differentiation
    - senescence
    answer: dedifferentiation
    difficulty: 3
    hints:
    - Mature cells regain the power to divide.
    - '''De'' means undo.'
    solution: 'Step 1: mature cells become meristematic. Step 2: dedifferentiation.'
    mistakes:
      differentiation: c11b13_growth
      senescence: c11b13_growth
  - prompt: 'Assertion (A): Growth in plants is called open or indeterminate.

      Reason (R): Plants keep meristems that can divide throughout life.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Lasting meristems let plants keep adding cells, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Heterophylly in cotton is an example of plasticity.

      Reason (R): Plasticity means a plant forms different structures in response to its stage of life or the environment.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Different leaves in young and mature cotton plants are a form of plasticity, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A bacterial culture in a flask grows slowly at first, then very fast, and finally levels off as food runs low. What is the shape of its growth curve?'
    options:
    - Sigmoid (S-shaped)
    - A straight line
    - A falling line
    answer: Sigmoid (S-shaped)
    hints:
    - 'Slow, fast, then flat: what shape is that?'
    - Name the three phases.
    solution: Lag, log and stationary phases make an S-shaped sigmoid curve.
    mistakes:
      A straight line: b11_sigmoid
      A falling line: b11_sigmoid
    exam: case
    difficulty: 2
  - prompt: 'Situation: A stem grows from 30 cm to 36 cm and a seedling grows from 3 cm to 5 cm in the same week. Which has the higher relative growth rate?'
    options:
    - The seedling
    - The stem
    - Both are equal
    answer: The seedling
    hints:
    - Find growth ÷ starting size for each.
    - A small plant can grow faster relative to its size.
    solution: 'Stem: 6 ÷ 30 = 20%. Seedling: 2 ÷ 3 ≈ 67%. The seedling grows faster relative to its size.'
    mistakes:
      The stem: b11_relative_growth
      Both are equal: c11b13_growth
    exam: short
    difficulty: 2
- code: cbse11b.growth.regulators
  title: Plant growth regulators
  after:
  - cbse11b.growth.growth
  notes: |
    Plant growth regulators (PGRs): promoters—auxins (IAA, IBA; Darwin's coleoptile experiments, Went; apical dominance,
    rooting, parthenocarpy, 2,4-D weedicide), gibberellins (GA₃; bakanae disease of rice; stem elongation, bolting,
    sugarcane yield, malting), cytokinins (kinetin, zeatin; cell division, delay senescence, overcome apical dominance);
    inhibitors—abscisic acid (ABA; stress hormone, stomatal closure, dormancy) and ethylene (gas; fruit ripening,
    abscission, flowering in pineapple; ethephon). Photoperiodism (short-day, long-day, day-neutral plants; site of
    perception is the leaf). Vernalisation (cold treatment to induce flowering in wheat, biennials).
  explanations:
    text: Plant hormones control growth. Auxin makes shoots grow and bend toward light; gibberellins make stems longer; cytokinins make cells divide; ethylene ripens fruit; and abscisic acid helps plants cope with stress like drought.
    visual: 'Picture a ripe banana in a bag with green tomatoes: the ethylene gas from the banana makes the tomatoes ripen faster.'
    step_by_step: 'Step 1: Identify the effect (growth, division, ripening, closing stomata). Step 2: Match it to the hormone. Step 3: For flowering, check day length and cold.'
    real_world: Fruit sellers ripen mangoes and bananas quickly with ethylene, which is safer than calcium carbide.
  picture:
    kind: compare
    columns:
    - title: Hormone
      points:
      - auxin
      - gibberellin
      - cytokinin
      - ethylene
      - abscisic acid
    - title: Main effect
      points:
      - shoot growth, apical dominance
      - stem lengthening
      - cell division
      - fruit ripening
      - stress, dormancy
    alt: Five plant hormones and their main effects.
  activity:
    type: sort
    prompt: Which plant growth regulator does this?
    bins:
    - Auxin
    - Gibberellin
    - Cytokinin
    - Ethylene
    - Abscisic acid
    items:
    - label: Keeps the top bud growing, holding side buds back
      bin: Auxin
      clue: Which regulator, made at the shoot tip, causes apical dominance?
      why: Auxin from the tip suppresses lateral buds.
    - label: Helps stem cuttings form roots
      bin: Auxin
      clue: Which regulator do gardeners dip cuttings in?
      why: IBA and NAA, auxins, start rooting.
    - label: 2,4-D kills broad-leaved weeds
      bin: Auxin
      clue: 2,4-D is a synthetic version of which regulator?
      why: A synthetic auxin used as a weedkiller.
    - label: 'Bolting: cabbage stems shoot up before flowering'
      bin: Gibberellin
      clue: Which regulator lengthens internodes?
      why: Gibberellins cause bolting.
    - label: Lengthens grape stalks
      bin: Gibberellin
      clue: Which regulator makes stalks longer?
      why: GA₃ lengthens grape stalks.
    - label: Starts side shoots, breaking apical dominance
      bin: Cytokinin
      clue: Which regulator works against auxin at side buds?
      why: Cytokinins promote lateral shoots.
    - label: Delays leaf ageing (senescence)
      bin: Cytokinin
      clue: Which regulator keeps leaves green longer?
      why: Cytokinins delay senescence.
    - label: Ripens fruits
      bin: Ethylene
      clue: Which gas speeds ripening?
      why: Ethylene ripens fruits.
    - label: Makes leaves and flowers fall (abscission)
      bin: Ethylene
      clue: Which gas promotes shedding?
      why: Ethylene promotes abscission of leaves and flowers.
    - label: Closes stomata in a drought
      bin: Abscisic acid
      clue: Which regulator is the 'stress hormone'?
      why: ABA closes stomata.
    - label: Keeps seeds dormant
      bin: Abscisic acid
      clue: Which regulator stops seeds sprouting too soon?
      why: ABA induces dormancy.
  lesson:
    - teach: 'Plant growth regulators are small chemicals. Promoters: auxins (IAA; apical dominance, rooting of cuttings, 2,4-D kills broad-leaved weeds), gibberellins (stem lengthening, bolting, bigger grapes), cytokinins (cell division, delay ageing).'
      check:
        prompt: Which hormone helps cuttings form roots?
        options:
        - auxin
        - abscisic acid
        - ethylene
        answer: auxin
        why: Auxins start roots.
      ways:
      - style: visual
        teach: The five main plant growth regulators and one big job of each.
        picture:
          kind: compare
          columns:
          - title: Promoters
            points:
            - 'auxin: rooting, apical dominance'
            - 'gibberellin: stem lengthening'
            - 'cytokinin: cell division, delays ageing'
          - title: Inhibitors
            points:
            - 'ABA: closes stomata, seed dormancy'
            - 'ethylene: ripening, leaf and fruit fall'
          alt: Auxins help rooting and apical dominance, gibberellins lengthen stems, cytokinins promote cell division; ABA closes stomata and keeps seeds dormant, and ethylene ripens fruit and makes leaves fall.
      - style: real_world
        teach: Gardeners dip cuttings of rose or hibiscus in a rooting powder before planting; it contains an auxin. Tea gardens in Munnar keep bushes low and wide by plucking the tips, which removes apical dominance and makes side shoots grow.
    - teach: 'Inhibitors: abscisic acid (ABA) is the stress hormone that closes stomata and keeps seeds dormant; ethylene is a gas that ripens fruit and causes leaves and fruits to fall.'
      check:
        prompt: Which hormone is a gas?
        options:
        - ethylene
        - auxin
        - cytokinin
        answer: ethylene
        why: It spreads through air.
      ways:
      - style: visual
        teach: Uses of ABA and ethylene that farmers and shops rely on.
        picture:
          kind: compare
          columns:
          - title: ABA
            points:
            - closes stomata in drought
            - keeps seeds and buds dormant
            - helps plants survive stress
          - title: Ethylene
            points:
            - ripens fruit evenly
            - breaks seed and bud dormancy
            - flowering in pineapple
          alt: ABA closes stomata in drought and keeps seeds dormant; ethylene ripens fruit, breaks some dormancy and brings on flowering in pineapples.
      - style: step_by_step
        teach: 'Step 1: Name the effect. Step 2: Fruit ripening or leaf fall → ethylene. Step 3: Stomata closing or dormancy → ABA. Step 4: Bigger, longer stems or fruits → gibberellin. Step 5: New shoots in a culture or delayed ageing → cytokinin. Step 6: Roots on cuttings or killing weeds → auxin.'
    - teach: 'Photoperiodism: flowering depends on day length (short-day, long-day, day-neutral plants), sensed by leaves; short-day plants really need a long unbroken night. Vernalisation: a cold spell triggers flowering (winter wheat, biennials).'
      picture:
        kind: compare
        columns:
        - title: Hormone
          points:
          - auxin
          - gibberellin
          - cytokinin
          - ABA
          - ethylene
        - title: Main job
          points:
          - rooting, apical dominance
          - stem lengthening
          - cell division
          - stress, dormancy
          - ripening
        alt: Plant hormones and their main jobs.
      check:
        prompt: 'Day length is sensed by the:'
        options:
        - leaves
        - roots
        - flowers
        answer: leaves
        why: Leaves detect the photoperiod.
      ways:
      - style: step_by_step
        teach: 'Step 1: A leaf measures how long the night is. Step 2: A long-day plant flowers when nights fall below a critical length. Step 3: A short-day plant flowers only after nights longer than its critical length. Step 4: A flash of light in the middle breaks the night into two short ones.'
      - style: real_world
        teach: Chrysanthemum growers in hill farms cover plants with black cloth in the evening to give them long nights, and they flower in time for festivals. Winter wheat must pass through cold weather before it can flower.
  items:
  - prompt: Which hormone ripens fruit?
    options:
    - ethylene
    - auxin
    - gibberellin
    - cytokinin
    answer: ethylene
    difficulty: 1
    hints:
    - A gas.
    - Banana in a bag.
    solution: Ethylene.
    mistakes:
      auxin: c11b_hormone
  - prompt: 'The stress hormone that closes stomata during drought is:'
    options:
    - abscisic acid
    - auxin
    - gibberellin
    - cytokinin
    answer: abscisic acid
    difficulty: 1
    hints:
    - ABA.
    - Saves water.
    solution: Abscisic acid.
    mistakes: {"auxin": "b11_aba", "gibberellin": "b11_aba", "cytokinin": "b11_aba"}
  - prompt: 'Bakanae (foolish seedling) disease of rice led to the discovery of:'
    options:
    - gibberellins
    - auxins
    - cytokinins
    - ethylene
    answer: gibberellins
    difficulty: 2
    hints:
    - Very tall seedlings.
    - Fungus Gibberella.
    solution: Gibberellins.
    mistakes: {"auxins": "b11_bakanae", "cytokinins": "b11_bakanae", "ethylene": "b11_bakanae"}
  - prompt: '2,4-D, a weedicide, is a synthetic:'
    options:
    - auxin
    - gibberellin
    - cytokinin
