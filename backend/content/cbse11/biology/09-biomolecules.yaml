# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-bio
chapter: 9
title: Biomolecules
tips:
  c11b_enzyme: Enzymes are mostly proteins that speed reactions by lowering activation energy; they are not used up.
  c11b_bond: "Each biomolecule has its own linking bond: sugars join by glycosidic bonds, nucleotides by phosphodiester bonds. The bond between amino acids is named after short chains of them."
  b11_amino: "Proteins are built from about two dozen common amino acids. Count the standard set."
  b11_collagen: "RuBisCO is most abundant on Earth overall, in plants. In animals, the protein of skin, tendon and bone is?"
  b11_competitive: "A look-alike that sits in the active site 'competes' with the substrate."
  b11_denature: "Enzymes are proteins. What does heat do to an egg's protein when you fry it?"
  b11_glycogen: "Starch is plant storage, cellulose plant walls, chitin insect shells. Animals store sugar in liver and muscle as?"
  b11_haemoglobin: "Haemoglobin is a tetramer: two α and two β chains."
  b11_holoenzyme: "Apoenzyme is the incomplete protein; with its cofactor it becomes whole ('holo')."
  b11_hydrolase: "'Hydro' means water and '-lase' means breaking."
  b11_ribozyme: "Ribo- (RNA) + -zyme (enzyme)."
  b11_uracil: "DNA has A, T, G, C. RNA swaps one base for another."
  c11b09_mol: 'Name the building block first: sugars make carbohydrates, amino acids make proteins, fatty acids and glycerol make fats, nucleotides make nucleic acids.'
  c11b09_enz: Enzymes are catalysts with an active site. Think about what changes the shape of that site (heat, pH) or blocks it (inhibitors).
concepts:
- code: cbse11b.bio.molecules
  title: Carbohydrates, proteins, lipids and nucleic acids
  notes: |
    Chemical analysis of tissue: acid-soluble pool (micromolecules < 1000 Da) and acid-insoluble (macromolecules). Amino
    acids (amino group, carboxyl, R group; 20 types; essential and non-essential). Lipids: fatty acids (saturated,
    unsaturated), glycerol, triglycerides, phospholipids. Nucleotides: base + sugar + phosphate; purines (A, G),
    pyrimidines (C, T, U). Polysaccharides: starch (plants), glycogen (animals), cellulose (homopolymer, plant cell walls),
    chitin; glycosidic bonds. Proteins: polypeptides with peptide bonds; structure levels: primary, secondary (α-helix),
    tertiary, quaternary (haemoglobin: 4 subunits). Collagen most abundant protein in animals, RuBisCO in the biosphere.
    Nucleic acids: DNA, RNA; phosphodiester bonds; B-DNA double helix.
  explanations:
    text: 'Living cells are built from four big kinds of molecules: carbohydrates (energy and structure), proteins (enzymes and body parts), lipids (fats and membranes) and nucleic acids (DNA and RNA, the instructions). Each is a chain of smaller units.'
    visual: 'Draw four chains: beads of glucose (starch), beads of amino acids (protein), nucleotides (DNA), and a glycerol with three fatty-acid tails (fat).'
    step_by_step: 'Step 1: Identify the building blocks. Step 2: Name the bond that joins them. Step 3: Link the molecule to its job.'
    real_world: RuBisCO, the enzyme that captures carbon in photosynthesis, is the most abundant protein on Earth.
  picture:
    kind: compare
    columns:
    - title: Molecule
      points:
      - protein
      - starch
      - DNA
      - fat
    - title: Unit
      points:
      - amino acid
      - glucose
      - nucleotide
      - fatty acid + glycerol
    - title: Bond
      points:
      - peptide
      - glycosidic
      - phosphodiester
      - ester
    alt: Biomolecules, their building blocks and the bonds that join them.
  activity:
    type: sort
    prompt: Which kind of biomolecule is it?
    bins:
    - Carbohydrate
    - Protein
    - Lipid
    - Nucleic acid
    items:
    - label: Glucose
      bin: Carbohydrate
      clue: 'C₆H₁₂O₆: a simple sugar. Which group?'
      why: A monosaccharide.
    - label: Starch
      bin: Carbohydrate
      clue: A chain of glucose units stored in plants. Which group?
      why: A polysaccharide.
    - label: Cellulose
      bin: Carbohydrate
      clue: Glucose chains in plant cell walls. Which group?
      why: A polysaccharide.
    - label: Haemoglobin
      bin: Protein
      clue: A chain of amino acids that carries O₂. Which group?
      why: A protein.
    - label: Collagen
      bin: Protein
      clue: The most plentiful amino-acid chain in animals. Which group?
      why: A protein.
    - label: Trypsin
      bin: Protein
      clue: A digestive enzyme. What are most enzymes made of?
      why: Most enzymes, trypsin included, are proteins.
    - label: RuBisCO
      bin: Protein
      clue: The most plentiful enzyme on Earth. Which group?
      why: A protein.
    - label: Lecithin
      bin: Lipid
      clue: A phospholipid in membranes. Which group?
      why: A lipid.
    - label: Palmitic acid
      bin: Lipid
      clue: A fatty acid with 16 carbons. Which group?
      why: A lipid.
    - label: Cholesterol
      bin: Lipid
      clue: A steroid in membranes. Which group?
      why: Steroids are lipids.
    - label: DNA
      bin: Nucleic acid
      clue: Built from nucleotides. Which group?
      why: A nucleic acid.
    - label: RNA
      bin: Nucleic acid
      clue: Nucleotides with ribose. Which group?
      why: A nucleic acid.
  lesson:
    - teach: Grinding tissue in acid splits it into an acid-soluble pool of small molecules (sugars, amino acids, nucleotides) and an acid-insoluble pool of large ones (proteins, nucleic acids, polysaccharides). Lipids land in the insoluble part because they form membranes.
      check:
        prompt: Proteins appear in which fraction?
        options:
        - acid-insoluble
        - acid-soluble
        - both equally
        answer: acid-insoluble
        why: They are large polymers.
    - teach: Amino acids have an amino group, a carboxyl group and an R group; 20 kinds build proteins, joined by peptide bonds. Protein structure has four levels; haemoglobin has four subunits (quaternary).
      check:
        prompt: 'The sequence of amino acids is a protein''s:'
        options:
        - primary structure
        - secondary structure
        - quaternary structure
        answer: primary structure
        why: The first, simplest level.
    - teach: 'Polysaccharides: starch (plant store), glycogen (animal store), cellulose (plant walls), chitin (insect skeletons, fungal walls), joined by glycosidic bonds. Nucleotides = base + sugar + phosphate, linked by phosphodiester bonds. Purines: A, G; pyrimidines: C, T, U.'
      picture:
        kind: compare
        columns:
        - title: Polymer
          points:
          - protein
          - polysaccharide
          - nucleic acid
        - title: Bond
          points:
          - peptide
          - glycosidic
          - phosphodiester
        alt: Large biomolecules and the bonds that join their units.
      check:
        prompt: 'Cellulose is a polymer of:'
        options:
        - glucose
        - amino acids
        - nucleotides
        answer: glucose
        why: It is a homopolymer of glucose.
  items:
  - prompt: How many types of amino acids commonly make up proteins?
    answer: '20'
    check: '20'
    difficulty: 1
    hints:
    - Standard amino acids.
    - Twenty.
    solution: '20.'
    mistakes: {"22": "b11_amino", "64": "b11_amino", "4": "b11_amino"}
  - prompt: How many polypeptide subunits does haemoglobin have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Quaternary structure.
    - 2α + 2β.
    solution: '4.'
    mistakes: {"2": "b11_haemoglobin", "1": "b11_haemoglobin"}
  - prompt: 'Amino acids in a protein are joined by:'
    options:
    - peptide bonds
    - glycosidic bonds
    - ester bonds
    - hydrogen bonds only
    answer: peptide bonds
    difficulty: 1
    hints:
    - –CO–NH–.
    - Between amino acids.
    solution: Peptide bonds.
    mistakes:
      glycosidic bonds: c11b_bond
  - prompt: 'The storage polysaccharide of animals is:'
    options:
    - glycogen
    - starch
    - cellulose
    - chitin
    answer: glycogen
    difficulty: 1
    hints:
    - Liver, muscles.
    - Animal starch.
    solution: Glycogen.
    mistakes: {"starch": "b11_glycogen", "cellulose": "b11_glycogen", "chitin": "b11_glycogen"}
  - prompt: Which base is found in RNA but not in DNA?
    options:
    - uracil
    - thymine
    - adenine
    - guanine
    answer: uracil
    difficulty: 1
    hints:
    - U replaces T.
    - Pyrimidine.
    solution: Uracil.
    mistakes: {"thymine": "b11_uracil", "adenine": "b11_uracil", "guanine": "b11_uracil"}
  - prompt: 'The most abundant protein in animals is:'
    options:
    - collagen
    - RuBisCO
    - haemoglobin
    - insulin
    answer: collagen
    difficulty: 2
    hints:
    - Skin, tendons.
    - RuBisCO is in plants.
    solution: Collagen.
    mistakes: {"RuBisCO": "b11_collagen", "haemoglobin": "b11_collagen", "insulin": "b11_collagen"}
  - prompt: 'The most abundant protein in the whole biosphere is:'
    options:
    - RuBisCO
    - collagen
    - haemoglobin
    answer: RuBisCO
    difficulty: 1
    hints:
    - It is in every green leaf.
    - It fixes CO₂.
    solution: 'Step 1: present in all plants. Step 2: RuBisCO.'
    mistakes:
      collagen: c11b09_mol
      haemoglobin: c11b09_mol
  - prompt: 'Adenine and guanine are:'
    options:
    - purines
    - pyrimidines
    - amino acids
    answer: purines
    difficulty: 1
    hints:
    - They have two rings.
    - C, T and U are the other group.
    solution: 'Step 1: double-ring bases. Step 2: purines.'
    mistakes:
      pyrimidines: c11b09_mol
      amino acids: c11b09_mol
  - prompt: 'Fats are made of glycerol and:'
    options:
    - fatty acids
    - amino acids
    - glucose
    answer: fatty acids
    difficulty: 1
    hints:
    - Triglycerides have three of these.
    - Long carbon chains with –COOH.
    solution: 'Step 1: glycerol + 3 fatty acids. Step 2: fatty acids.'
    mistakes:
      amino acids: c11b09_mol
      glucose: c11b09_mol
  - prompt: 'Amino acids the body cannot make and must get from food are:'
    options:
    - essential amino acids
    - non-essential amino acids
    - fatty acids
    answer: essential amino acids
    difficulty: 2
    hints:
    - Essential means needed in the diet.
    - The body cannot build them.
    solution: 'Step 1: must come from food. Step 2: essential.'
    mistakes:
      non-essential amino acids: c11b09_mol
      fatty acids: c11b09_mol
  - prompt: 'A fatty acid with one or more C=C double bonds is:'
    options:
    - unsaturated
    - saturated
    - a phospholipid
    answer: unsaturated
    difficulty: 2
    hints:
    - It could take more hydrogen.
    - Oils are rich in these.
    solution: 'Step 1: double bonds present. Step 2: unsaturated.'
    mistakes:
      saturated: c11b09_mol
      a phospholipid: c11b09_mol
  - prompt: 'The exoskeleton of insects is made of:'
    options:
    - chitin
    - cellulose
    - glycogen
    answer: chitin
    difficulty: 2
    hints:
    - Fungal walls use it too.
    - It is a polysaccharide with nitrogen.
    solution: 'Step 1: tough N-containing polysaccharide. Step 2: chitin.'
    mistakes:
      cellulose: c11b09_mol
      glycogen: c11b09_mol
  - prompt: 'Lecithin, found in cell membranes, is a:'
    options:
    - phospholipid
    - protein
    - polysaccharide
    answer: phospholipid
    difficulty: 2
    hints:
    - It contains phosphorus.
    - Membranes are built of these.
    solution: 'Step 1: lipid with phosphate. Step 2: phospholipid.'
    mistakes:
      protein: c11b09_mol
      polysaccharide: c11b09_mol
  - prompt: In B-DNA, one full turn of the helix contains about how many base pairs?
    answer: '10'
    check: '10'
    difficulty: 3
    hints:
    - The pitch is 3.4 nm.
    - The rise per base pair is 0.34 nm.
    solution: 'Step 1: 3.4 ÷ 0.34. Step 2: 10.'
    mistakes:
      '20': c11b09_mol
      '34': c11b09_mol
  - prompt: 'Starch turns blue-black with iodine, but cellulose does not, because cellulose:'
    options:
    - has no helices to hold iodine
    - is not made of glucose
    - is a protein
    answer: has no helices to hold iodine
    difficulty: 3
    hints:
    - Iodine fits inside the coiled parts of starch.
    - Cellulose chains are straight.
    solution: 'Step 1: starch forms helices that trap I₂. Step 2: cellulose does not coil.'
    mistakes:
      is not made of glucose: c11b09_mol
      is a protein: c11b09_mol
- code: cbse11b.bio.enzymes
  title: Enzymes
  after:
  - cbse11b.bio.molecules
  notes: |
    Metabolism: anabolic and catabolic pathways; metabolites (primary and secondary: alkaloids, pigments, drugs). Living
    state is non-equilibrium steady state. Enzymes: mostly proteins (ribozymes are RNA); active site; lower activation
    energy; enzyme–substrate complex (induced fit). Factors: temperature, pH (optimum), substrate concentration (Vmax, Km).
    Inhibition: competitive (inhibitor resembles substrate, e.g. malonate for succinic dehydrogenase). Classes:
    oxidoreductases, transferases, hydrolases, lyases, isomerases, ligases. Cofactors: prosthetic groups (haem), coenzymes
    (NAD, NADP from vitamin niacin), metal ions (Zn²⁺ for carboxypeptidase); apoenzyme + cofactor = holoenzyme.
  explanations:
    text: 'Enzymes are biological catalysts: they speed up reactions in cells without being used up. Each enzyme fits its substrate like a key in a lock. They work best at a particular temperature and pH, and can be blocked by inhibitors.'
    visual: 'Draw an energy hill: the reaction without an enzyme climbs a tall hill; with an enzyme, the hill is much lower, so the reaction goes faster.'
    step_by_step: 'Step 1: Find the substrate and product. Step 2: Identify the enzyme class from the change. Step 3: Consider temperature, pH and inhibitors.'
    real_world: Washing powders contain enzymes like proteases and lipases that break down food and grease stains in cool water.
  picture:
    kind: flow
    steps:
    - Enzyme + substrate
    - Enzyme–substrate complex
    - Enzyme–product complex
    - Enzyme + product
    alt: An enzyme binds its substrate, forms a complex, converts it, then releases the product and is free again.
  activity:
    type: formula
    prompt: 'Enzyme rate: v = Vmax × [S] ÷ (Km + [S]). Km is the substrate concentration at which the rate is half of Vmax.'
    inputs:
    - name: s
      label: Substrate [S]
      min: 0
      max: 100
      step: 1
      start: 0
    - name: km
      label: Km
      min: 1
      max: 50
      step: 1
      start: 1
    - name: vmax
      label: Vmax
      min: 10
      max: 100
      step: 10
      start: 10
    outputs:
    - name: v
      label: Rate v
      expr: vmax*s/(km+s)
      places: 1
    - name: frac
      label: v as a part of Vmax
      expr: s/(km+s)
      places: 3
    goals:
    - prompt: Vmax = 100 and Km = 20. Set [S] so the rate is half of Vmax.
      want:
        km: 20
        vmax: 100
        v: 50
      mistakes:
      - when:
          km: 20
          vmax: 100
          s: 50
        say: '[S] = 50 gives 71, not 50. The rate is half Vmax exactly when [S] equals Km: that is what Km means.'
      - when:
          km: 20
          vmax: 100
          s: 40
        say: '[S] = 40 gives 66.7. Half speed comes when [S] = Km.'
    - prompt: An enzyme with Vmax = 100 runs at 50 when [S] = 5. Set its Km.
      want:
        vmax: 100
        s: 5
        v: 50
      mistakes:
      - when:
          vmax: 100
          s: 5
          km: 50
        say: Km = 50 gives only 9. Km is the [S] at half Vmax, here 5.
    - prompt: Vmax = 100, Km = 10. How much substrate brings the rate up to 80?
      want:
        vmax: 100
        km: 10
        v: 80
      mistakes:
      - when:
          vmax: 100
          km: 10
          s: 20
        say: '[S] = 2 × Km gives two-thirds of Vmax (66.7). The rate doesn''t rise in step with [S]: it levels off.'
      - when:
          vmax: 100
          km: 10
          s: 80
        say: 80 is the rate you want, not the [S]. It gives 88.9.
  lesson:
    - teach: Enzymes are biological catalysts, mostly proteins (ribozymes are RNA). The substrate fits the active site, forming an enzyme–substrate complex; the enzyme lowers the activation energy and is not used up.
      check:
        prompt: 'Enzymes speed reactions by:'
        options:
        - lowering the activation energy
        - raising the temperature
        - being used up
        answer: lowering the activation energy
        why: Less energy is needed to start the reaction.
    - teach: Each enzyme works best at an optimum temperature and pH. Too much heat denatures it. Rate rises with substrate until the enzyme is saturated (Vmax). A competitive inhibitor looks like the substrate and blocks the active site (malonate blocks succinic dehydrogenase).
      check:
        prompt: Adding more substrate helps overcome which inhibitor?
        options:
        - competitive
        - non-competitive
        - neither
        answer: competitive
        why: Substrate can out-compete it for the site.
    - teach: 'Six classes: oxidoreductases, transferases, hydrolases, lyases, isomerases, ligases. Many need cofactors: prosthetic groups (haem), coenzymes (NAD, from niacin) or metal ions (Zn²⁺). Apoenzyme + cofactor = holoenzyme.'
      picture:
        kind: flow
        steps:
        - Enzyme + substrate
        - Enzyme–substrate complex
        - Enzyme–product complex
        - Enzyme + product
        alt: How an enzyme works step by step.
      check:
        prompt: NAD is a coenzyme made from which vitamin?
        options:
        - niacin
        - vitamin C
        - vitamin D
        answer: niacin
        why: Niacin is a B vitamin.
  items:
  - prompt: 'Enzymes speed up reactions by:'
    options:
    - lowering the activation energy
    - raising the temperature
    - being used up
    - changing the products
    answer: lowering the activation energy
    difficulty: 1
    hints:
    - Lower hill.
    - Not consumed.
    solution: Lowering activation energy.
    mistakes:
      being used up: c11b_enzyme
  - prompt: 'An inhibitor that resembles the substrate and competes for the active site is:'
    options:
    - a competitive inhibitor
    - a coenzyme
    - a cofactor
    - a ribozyme
    answer: a competitive inhibitor
    difficulty: 2
    hints:
    - Malonate.
    - Same shape.
    solution: A competitive inhibitor.
    mistakes: {"a coenzyme": "b11_competitive", "a cofactor": "b11_competitive", "a ribozyme": "b11_competitive"}
  - prompt: 'Enzymes that break bonds by adding water are:'
    options:
    - hydrolases
    - ligases
    - isomerases
    - transferases
    answer: hydrolases
    difficulty: 2
    hints:
    - Hydro = water.
    - Digestive enzymes.
    solution: Hydrolases.
    mistakes: {"ligases": "b11_hydrolase", "isomerases": "b11_hydrolase", "transferases": "b11_hydrolase"}
  - prompt: 'An enzyme made of RNA is called a:'
    options:
    - ribozyme
    - coenzyme
    - apoenzyme
    - zymogen
    answer: ribozyme
    difficulty: 2
    hints:
    - Not all enzymes are proteins.
    - RNA catalyst.
    solution: A ribozyme.
    mistakes: {"coenzyme": "b11_ribozyme", "apoenzyme": "b11_ribozyme", "zymogen": "b11_ribozyme"}
  - prompt: 'Apoenzyme + cofactor together make a:'
    options:
    - holoenzyme
    - coenzyme
    - prosthetic group
    - substrate
    answer: holoenzyme
    difficulty: 2
    hints:
    - Whole enzyme.
    - Active form.
    solution: A holoenzyme.
    mistakes: {"coenzyme": "b11_holoenzyme", "prosthetic group": "b11_holoenzyme", "substrate": "b11_holoenzyme"}
  - prompt: 'Very high temperatures usually stop enzymes working because:'
    options:
    - the protein is denatured
    - the substrate disappears
    - pH drops
    - they multiply
    answer: the protein is denatured
    difficulty: 1
    hints:
    - Shape changes.
    - Active site lost.
    solution: The enzyme protein is denatured.
    mistakes: {"the substrate disappears": "b11_denature", "pH drops": "b11_denature", "they multiply": "b11_denature"}
  - prompt: 'Enzymes that join two molecules using ATP are:'
    options:
    - ligases
    - lyases
    - hydrolases
    answer: ligases
    difficulty: 1
    hints:
    - Ligate means to tie.
    - DNA ligase joins DNA pieces.
    solution: 'Step 1: joining with energy. Step 2: ligases.'
    mistakes:
      lyases: c11b09_enz
      hydrolases: c11b09_enz
  - prompt: 'The protein part of an enzyme without its cofactor is the:'
    options:
    - apoenzyme
    - holoenzyme
    - coenzyme
    answer: apoenzyme
    difficulty: 1
    hints:
    - It is inactive alone.
    - Add the cofactor to get the holoenzyme.
    solution: 'Step 1: protein only. Step 2: apoenzyme.'
    mistakes:
      holoenzyme: c11b09_enz
      coenzyme: c11b09_enz
  - prompt: 'Pepsin works best in the stomach because its optimum pH is:'
    options:
    - acidic (about 2)
    - neutral (7)
    - basic (about 9)
    answer: acidic (about 2)
    difficulty: 1
    hints:
    - The stomach has hydrochloric acid.
    - Each enzyme has its own optimum.
    solution: 'Step 1: stomach is acidic. Step 2: pepsin works at low pH.'
    mistakes:
      neutral (7): c11b09_enz
      basic (about 9): c11b09_enz
  - prompt: 'Enzymes that rearrange a molecule into its isomer are:'
    options:
    - isomerases
    - transferases
    - oxidoreductases
    answer: isomerases
    difficulty: 2
    hints:
    - The name says it.
    - Glucose-6-phosphate ⇌ fructose-6-phosphate.
    solution: 'Step 1: same formula, new arrangement. Step 2: isomerases.'
    mistakes:
      transferases: c11b09_enz
      oxidoreductases: c11b09_enz
  - prompt: Carboxypeptidase needs which metal ion as a cofactor?
    options:
    - Zn²⁺
    - Fe²⁺
    - Na⁺
    answer: Zn²⁺
    difficulty: 2
    hints:
    - It is a trace metal.
    - Also important for many other enzymes.
    solution: 'Step 1: zinc forms bonds at the active site. Step 2: Zn²⁺.'
    mistakes:
      Fe²⁺: c11b09_enz
      Na⁺: c11b09_enz
  - prompt: 'At low temperatures enzymes are:'
    options:
    - temporarily inactive, not destroyed
    - permanently denatured
    - turned into substrate
    answer: temporarily inactive, not destroyed
    difficulty: 2
    hints:
    - Seeds survive the cold.
    - Warming them restores activity.
    solution: 'Step 1: slowed, not damaged. Step 2: temporarily inactive.'
    mistakes:
      permanently denatured: c11b09_enz
      turned into substrate: c11b09_enz
  - prompt: 'Secondary metabolites such as alkaloids and rubber:'
    options:
    - are not needed for basic life processes
    - are the main energy source
    - are found in all organisms
    answer: are not needed for basic life processes
    difficulty: 2
    hints:
    - Primary metabolites run the cell.
    - Secondary ones may help defence.
    solution: 'Step 1: not for basic metabolism. Step 2: special roles only.'
    mistakes:
      are the main energy source: c11b09_enz
      are found in all organisms: c11b09_enz
  - prompt: 'Haem in peroxidase is an example of a:'
    options:
    - prosthetic group
    - coenzyme
    - metal ion
    answer: prosthetic group
    difficulty: 3
    hints:
    - It is tightly bound to the enzyme.
    - Coenzymes bind only briefly.
    solution: 'Step 1: firmly attached organic cofactor. Step 2: prosthetic group.'
    mistakes:
      coenzyme: c11b09_enz
      metal ion: c11b09_enz
  - prompt: Why do we say living things are in a non-equilibrium steady state?
    options:
    - their reactions never reach equilibrium while they live
    - they have no reactions
    - they are always at equilibrium
    answer: their reactions never reach equilibrium while they live
    difficulty: 3
    hints:
    - Equilibrium means no net change and no work.
    - Living cells keep doing work.
    solution: 'Step 1: constant flow of matter and energy. Step 2: equilibrium would mean death.'
    mistakes:
      they have no reactions: c11b09_enz
      they are always at equilibrium: c11b09_enz
