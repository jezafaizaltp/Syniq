# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-bio
chapter: 9
title: Biomolecules
tips:
  c11b_enzyme: Enzymes are mostly proteins that speed reactions by lowering activation energy; they are not used up.
  c11b_bond: 'Proteins: peptide bonds; carbohydrates: glycosidic bonds; nucleic acids: phosphodiester bonds; fats: ester bonds.'
  b11_amino: "Proteins are built from about two dozen common amino acids. Count the standard set."
  b11_collagen: "RuBisCO is most abundant on Earth overall, in plants. In animals, the protein of skin, tendon and bone is?"
  b11_competitive: "A look-alike that sits in the active site 'competes' with the substrate."
  b11_denature: "Enzymes are proteins. What does heat do to an egg's protein when you fry it?"
  b11_glycogen: "Starch is plant storage, cellulose plant walls, chitin insect shells. Animals store sugar in liver and muscle as?"
  b11_haemoglobin: "Haemoglobin is a tetramer: two α and two β chains."
  b11_holoenzyme: "Apoenzyme is the incomplete protein; with its cofactor it becomes whole ('holo')."
  b11_hydrolase: "'Hydro' means water and '-lase' means breaking."
  b11_ribozyme: "Ribo- (RNA) + -zyme (enzyme)."
  b11_uracil: "DNA has A, T, G, C. RNA swaps one base for another."
concepts:
- code: cbse11b.bio.molecules
  title: Carbohydrates, proteins, lipids and nucleic acids
  notes: |
    Chemical analysis of tissue: acid-soluble pool (micromolecules < 1000 Da) and acid-insoluble (macromolecules). Amino
    acids (amino group, carboxyl, R group; 20 types; essential and non-essential). Lipids: fatty acids (saturated,
    unsaturated), glycerol, triglycerides, phospholipids. Nucleotides: base + sugar + phosphate; purines (A, G),
    pyrimidines (C, T, U). Polysaccharides: starch (plants), glycogen (animals), cellulose (homopolymer, plant cell walls),
    chitin; glycosidic bonds. Proteins: polypeptides with peptide bonds; structure levels: primary, secondary (α-helix),
    tertiary, quaternary (haemoglobin: 4 subunits). Collagen most abundant protein in animals, RuBisCO in the biosphere.
    Nucleic acids: DNA, RNA; phosphodiester bonds; B-DNA double helix.
  explanations:
    text: 'Living cells are built from four big kinds of molecules: carbohydrates (energy and structure), proteins (enzymes and body parts), lipids (fats and membranes) and nucleic acids (DNA and RNA, the instructions). Each is a chain of smaller units.'
    visual: 'Draw four chains: beads of glucose (starch), beads of amino acids (protein), nucleotides (DNA), and a glycerol with three fatty-acid tails (fat).'
    step_by_step: 'Step 1: Identify the building blocks. Step 2: Name the bond that joins them. Step 3: Link the molecule to its job.'
    real_world: RuBisCO, the enzyme that captures carbon in photosynthesis, is the most abundant protein on Earth.
  picture:
    kind: compare
    columns:
    - title: Molecule
      points:
      - protein
      - starch
      - DNA
      - fat
    - title: Unit
      points:
      - amino acid
      - glucose
      - nucleotide
      - fatty acid + glycerol
    - title: Bond
      points:
      - peptide
      - glycosidic
      - phosphodiester
      - ester
    alt: Biomolecules, their building blocks and the bonds that join them.
  activity:
    type: sort
    prompt: Which kind of biomolecule is it?
    bins:
    - Carbohydrate
    - Protein
    - Lipid
    - Nucleic acid
    items:
    - label: Glucose
      bin: Carbohydrate
      clue: 'C₆H₁₂O₆: a simple sugar. Which group?'
      why: A monosaccharide.
    - label: Starch
      bin: Carbohydrate
      clue: A chain of glucose units stored in plants. Which group?
      why: A polysaccharide.
    - label: Cellulose
      bin: Carbohydrate
      clue: Glucose chains in plant cell walls. Which group?
      why: A polysaccharide.
    - label: Haemoglobin
      bin: Protein
      clue: A chain of amino acids that carries O₂. Which group?
      why: A protein.
    - label: Collagen
      bin: Protein
      clue: The most plentiful amino-acid chain in animals. Which group?
      why: A protein.
    - label: Trypsin
      bin: Protein
      clue: A digestive enzyme. What are most enzymes made of?
      why: Most enzymes, trypsin included, are proteins.
    - label: RuBisCO
      bin: Protein
      clue: The most plentiful enzyme on Earth. Which group?
      why: A protein.
    - label: Lecithin
      bin: Lipid
      clue: A phospholipid in membranes. Which group?
      why: A lipid.
    - label: Palmitic acid
      bin: Lipid
      clue: A fatty acid with 16 carbons. Which group?
      why: A lipid.
    - label: Cholesterol
      bin: Lipid
      clue: A steroid in membranes. Which group?
      why: Steroids are lipids.
    - label: DNA
      bin: Nucleic acid
      clue: Built from nucleotides. Which group?
      why: A nucleic acid.
    - label: RNA
      bin: Nucleic acid
      clue: Nucleotides with ribose. Which group?
      why: A nucleic acid.
  items:
  - prompt: How many types of amino acids commonly make up proteins?
    answer: '20'
    check: '20'
    difficulty: 1
    hints:
    - Standard amino acids.
    - Twenty.
    solution: '20.'
    mistakes: {"22": "b11_amino", "64": "b11_amino", "4": "b11_amino"}
  - prompt: How many polypeptide subunits does haemoglobin have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Quaternary structure.
    - 2α + 2β.
    solution: '4.'
    mistakes: {"2": "b11_haemoglobin", "1": "b11_haemoglobin"}
  - prompt: 'Amino acids in a protein are joined by:'
    options:
    - peptide bonds
    - glycosidic bonds
    - ester bonds
    - hydrogen bonds only
    answer: peptide bonds
    difficulty: 1
    hints:
    - –CO–NH–.
    - Between amino acids.
    solution: Peptide bonds.
    mistakes:
      glycosidic bonds: c11b_bond
  - prompt: 'The storage polysaccharide of animals is:'
    options:
    - glycogen
    - starch
    - cellulose
    - chitin
    answer: glycogen
    difficulty: 1
    hints:
    - Liver, muscles.
    - Animal starch.
    solution: Glycogen.
    mistakes: {"starch": "b11_glycogen", "cellulose": "b11_glycogen", "chitin": "b11_glycogen"}
  - prompt: Which base is found in RNA but not in DNA?
    options:
    - uracil
    - thymine
    - adenine
    - guanine
    answer: uracil
    difficulty: 1
    hints:
    - U replaces T.
    - Pyrimidine.
    solution: Uracil.
    mistakes: {"thymine": "b11_uracil", "adenine": "b11_uracil", "guanine": "b11_uracil"}
  - prompt: 'The most abundant protein in animals is:'
    options:
    - collagen
    - RuBisCO
    - haemoglobin
    - insulin
    answer: collagen
    difficulty: 2
    hints:
    - Skin, tendons.
    - RuBisCO is in plants.
    solution: Collagen.
    mistakes: {"RuBisCO": "b11_collagen", "haemoglobin": "b11_collagen", "insulin": "b11_collagen"}
- code: cbse11b.bio.enzymes
  title: Enzymes
  after:
  - cbse11b.bio.molecules
  notes: |
    Metabolism: anabolic and catabolic pathways; metabolites (primary and secondary: alkaloids, pigments, drugs). Living
    state is non-equilibrium steady state. Enzymes: mostly proteins (ribozymes are RNA); active site; lower activation
    energy; enzyme–substrate complex (induced fit). Factors: temperature, pH (optimum), substrate concentration (Vmax, Km).
    Inhibition: competitive (inhibitor resembles substrate, e.g. malonate for succinic dehydrogenase). Classes:
    oxidoreductases, transferases, hydrolases, lyases, isomerases, ligases. Cofactors: prosthetic groups (haem), coenzymes
    (NAD, NADP from vitamin niacin), metal ions (Zn²⁺ for carboxypeptidase); apoenzyme + cofactor = holoenzyme.
  explanations:
    text: 'Enzymes are biological catalysts: they speed up reactions in cells without being used up. Each enzyme fits its substrate like a key in a lock. They work best at a particular temperature and pH, and can be blocked by inhibitors.'
    visual: 'Draw an energy hill: the reaction without an enzyme climbs a tall hill; with an enzyme, the hill is much lower, so the reaction goes faster.'
    step_by_step: 'Step 1: Find the substrate and product. Step 2: Identify the enzyme class from the change. Step 3: Consider temperature, pH and inhibitors.'
    real_world: Washing powders contain enzymes like proteases and lipases that break down food and grease stains in cool water.
  picture:
    kind: flow
    steps:
    - Enzyme + substrate
    - Enzyme–substrate complex
    - Enzyme–product complex
    - Enzyme + product
    alt: An enzyme binds its substrate, forms a complex, converts it, then releases the product and is free again.
  activity:
    type: formula
    prompt: 'Enzyme rate: v = Vmax × [S] ÷ (Km + [S]). Km is the substrate concentration at which the rate is half of Vmax.'
    inputs:
    - name: s
      label: Substrate [S]
      min: 0
      max: 100
      step: 1
      start: 0
    - name: km
      label: Km
      min: 1
      max: 50
      step: 1
      start: 1
    - name: vmax
      label: Vmax
      min: 10
      max: 100
      step: 10
      start: 10
    outputs:
    - name: v
      label: Rate v
      expr: vmax*s/(km+s)
      places: 1
    - name: frac
      label: v as a part of Vmax
      expr: s/(km+s)
      places: 3
    goals:
    - prompt: Vmax = 100 and Km = 20. Set [S] so the rate is half of Vmax.
      want:
        km: 20
        vmax: 100
        v: 50
      mistakes:
      - when:
          km: 20
          vmax: 100
          s: 50
        say: '[S] = 50 gives 71, not 50. The rate is half Vmax exactly when [S] equals Km: that is what Km means.'
      - when:
          km: 20
          vmax: 100
          s: 40
        say: '[S] = 40 gives 66.7. Half speed comes when [S] = Km.'
    - prompt: An enzyme with Vmax = 100 runs at 50 when [S] = 5. Set its Km.
      want:
        vmax: 100
        s: 5
        v: 50
      mistakes:
      - when:
          vmax: 100
          s: 5
          km: 50
        say: Km = 50 gives only 9. Km is the [S] at half Vmax, here 5.
    - prompt: Vmax = 100, Km = 10. How much substrate brings the rate up to 80?
      want:
        vmax: 100
        km: 10
        v: 80
      mistakes:
      - when:
          vmax: 100
          km: 10
          s: 20
        say: '[S] = 2 × Km gives two-thirds of Vmax (66.7). The rate doesn''t rise in step with [S]: it levels off.'
      - when:
          vmax: 100
          km: 10
          s: 80
        say: 80 is the rate you want, not the [S]. It gives 88.9.
  items:
  - prompt: 'Enzymes speed up reactions by:'
    options:
    - lowering the activation energy
    - raising the temperature
    - being used up
    - changing the products
    answer: lowering the activation energy
    difficulty: 1
    hints:
    - Lower hill.
    - Not consumed.
    solution: Lowering activation energy.
    mistakes:
      being used up: c11b_enzyme
  - prompt: 'An inhibitor that resembles the substrate and competes for the active site is:'
    options:
    - a competitive inhibitor
    - a coenzyme
    - a cofactor
    - a ribozyme
    answer: a competitive inhibitor
    difficulty: 2
    hints:
    - Malonate.
    - Same shape.
    solution: A competitive inhibitor.
    mistakes: {"a coenzyme": "b11_competitive", "a cofactor": "b11_competitive", "a ribozyme": "b11_competitive"}
  - prompt: 'Enzymes that break bonds by adding water are:'
    options:
    - hydrolases
    - ligases
    - isomerases
    - transferases
    answer: hydrolases
    difficulty: 2
    hints:
    - Hydro = water.
    - Digestive enzymes.
    solution: Hydrolases.
    mistakes: {"ligases": "b11_hydrolase", "isomerases": "b11_hydrolase", "transferases": "b11_hydrolase"}
  - prompt: 'An enzyme made of RNA is called a:'
    options:
    - ribozyme
    - coenzyme
    - apoenzyme
    - zymogen
    answer: ribozyme
    difficulty: 2
    hints:
    - Not all enzymes are proteins.
    - RNA catalyst.
    solution: A ribozyme.
    mistakes: {"coenzyme": "b11_ribozyme", "apoenzyme": "b11_ribozyme", "zymogen": "b11_ribozyme"}
  - prompt: 'Apoenzyme + cofactor together make a:'
    options:
    - holoenzyme
    - coenzyme
    - prosthetic group
    - substrate
    answer: holoenzyme
    difficulty: 2
    hints:
    - Whole enzyme.
    - Active form.
    solution: A holoenzyme.
    mistakes: {"coenzyme": "b11_holoenzyme", "prosthetic group": "b11_holoenzyme", "substrate": "b11_holoenzyme"}
  - prompt: 'Very high temperatures usually stop enzymes working because:'
    options:
    - the protein is denatured
    - the substrate disappears
    - pH drops
    - they multiply
    answer: the protein is denatured
    difficulty: 1
    hints:
    - Shape changes.
    - Active site lost.
    solution: The enzyme protein is denatured.
    mistakes: {"the substrate disappears": "b11_denature", "pH drops": "b11_denature", "they multiply": "b11_denature"}
