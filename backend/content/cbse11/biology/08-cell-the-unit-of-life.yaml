# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse11-bio
chapter: 8
title: 'Cell: The Unit of Life'
tips:
  c11b_prok: Prokaryotes have no nucleus and no membrane-bound organelles; their ribosomes are 70S. Eukaryotic cytoplasm has 80S ribosomes.
  c11b_organelle: Mitochondria make ATP (aerobic respiration); chloroplasts do photosynthesis; ribosomes make proteins; lysosomes digest.
  b11_axoneme: "Nine outer doublets surround a central pair. Count the centre."
  b11_fluid_mosaic: "Watson and Crick gave the DNA model. The 1972 membrane model has two names joined by 'and'."
  b11_largest_cell: "Nerve cells are long but thin. Which single cell can you hold in your hand?"
  b11_mesosome: "Cristae are in mitochondria, thylakoids in chloroplasts. Bacteria have neither."
  b11_metacentric: "'Meta' means middle here. Acro- and telo- mean near the end."
  b11_own_dna: "Endosymbiosis: which organelles were once free-living bacteria and still have their own ring DNA?"
  b11_plasmid: "The nucleoid is the main bacterial chromosome. The extra small rings are used in genetic engineering."
  b11_prokaryote: "Prokaryotes have no nucleus. Fungi, plants and animals all have nuclei."
  b11_rough_er: "The bumps on rough ER make proteins. What organelle makes proteins?"
  b11_virchow: "Schleiden and Schwann gave cell theory; a later scientist added that cells come only from cells."
  c11b08_prok: Prokaryotes have no nucleus and no membrane-bound organelles. Their DNA lies in a nucleoid; ribosomes are 70S.
  c11b08_org: 'Link each organelle to its job: energy (mitochondria), food making (chloroplast), proteins (ribosomes, rough ER), packaging (Golgi), digestion (lysosomes).'
concepts:
- code: cbse11b.cell.theory
  title: Cell theory and prokaryotic cells
  notes: |
    Cell theory: Schleiden and Schwann (all organisms made of cells), Virchow (omnis cellula-e cellula: cells arise from
    pre-existing cells). Unicellular and multicellular organisms. Cells vary in size (mycoplasma 0.3 μm, bacteria 3–5 μm,
    ostrich egg largest single cell) and shape. Prokaryotic cell: cell envelope (glycocalyx, cell wall, plasma membrane);
    Gram-positive and Gram-negative; mesosomes; nucleoid (naked circular DNA), plasmids; 70S ribosomes (50S + 30S),
    polysomes; inclusion bodies; flagella, pili, fimbriae.
  explanations:
    text: 'Cell theory says every living thing is made of cells, and every cell comes from an existing cell. Prokaryotic cells, like bacteria, are small and simple: no nucleus, just a loop of DNA in the cytoplasm.'
    visual: 'Draw a bacterium: a capsule outside, a cell wall, a membrane, a coiled DNA loop with no nuclear membrane, small ribosomes, and a tail-like flagellum.'
    step_by_step: 'Step 1: Look for a nucleus. Step 2: No nucleus → prokaryote. Step 3: Check ribosomes (70S) and membrane folds (mesosomes).'
    real_world: Plasmids from bacteria are used in genetic engineering to carry useful genes, such as the gene for human insulin.
  picture:
    kind: compare
    columns:
    - title: Feature
      points:
      - nucleus
      - ribosomes
      - organelles
    - title: Prokaryote
      points:
      - absent (nucleoid)
      - 70S
      - no membrane-bound
    - title: Eukaryote
      points:
      - present
      - 80S
      - membrane-bound
    alt: Prokaryotic and eukaryotic cells compared.
  activity:
    type: sort
    prompt: Is it found in prokaryotic cells, eukaryotic cells, or both?
    bins:
    - Prokaryotic only
    - Eukaryotic only
    - Both
    items:
    - label: Nucleus with a nuclear envelope
      bin: Eukaryotic only
      clue: Does a bacterium wrap its DNA in a membrane?
      why: Only eukaryotes have a membrane-bound nucleus.
    - label: 'Nucleoid: naked DNA in the cytoplasm'
      bin: Prokaryotic only
      clue: Which cells keep their DNA without an envelope?
      why: Prokaryotes.
    - label: 'Mesosome: infolded cell membrane'
      bin: Prokaryotic only
      clue: Which cells fold their membrane to help make a wall and copy DNA?
      why: A prokaryote feature.
    - label: Peptidoglycan cell wall
      bin: Prokaryotic only
      clue: Plant walls are cellulose. Whose walls are peptidoglycan?
      why: Bacterial walls.
    - label: Pili and fimbriae
      bin: Prokaryotic only
      clue: Surface hairs that help cells stick. Whose?
      why: Bacteria have pili and fimbriae.
    - label: Mitochondria
      bin: Eukaryotic only
      clue: Do bacteria have membrane-bound organelles?
      why: Only eukaryotes have mitochondria.
    - label: Endoplasmic reticulum
      bin: Eukaryotic only
      clue: A network of inner membranes. Which cells?
      why: Eukaryotes.
    - label: Golgi apparatus
      bin: Eukaryotic only
      clue: Membrane stacks that pack proteins. Which cells?
      why: Eukaryotes.
    - label: Ribosomes
      bin: Both
      clue: Does every cell need to make proteins?
      why: 'Both have ribosomes: 70S in prokaryotes, 80S in eukaryotic cytoplasm.'
    - label: Plasma membrane
      bin: Both
      clue: Can any cell manage without an outer membrane?
      why: Every cell has a plasma membrane.
    - label: Cytoplasm
      bin: Both
      clue: Is there a fluid inside every cell?
      why: All cells have cytoplasm.
  lesson:
    - teach: 'Cell theory: Schleiden (plants) and Schwann (animals) said all living things are made of cells. Virchow added that all cells come from earlier cells (omnis cellula-e cellula).'
      check:
        prompt: Who studied plant cells for the cell theory?
        options:
        - Schleiden
        - Schwann
        - Virchow
        answer: Schleiden
        why: Schwann studied animal cells.
    - teach: 'Cells vary hugely in size: mycoplasma about 0.3 μm, bacteria 3–5 μm, an ostrich egg the largest single cell. Shapes fit jobs: long nerve cells, disc-shaped red cells.'
      check:
        prompt: 'The smallest cells known are:'
        options:
        - mycoplasma
        - red blood cells
        - nerve cells
        answer: mycoplasma
        why: About 0.3 μm.
    - teach: Prokaryotic cells (bacteria) have a cell envelope (glycocalyx, wall, membrane), no nucleus (DNA in a nucleoid), plasmids, 70S ribosomes and infoldings called mesosomes. Gram-positive bacteria keep the Gram stain; Gram-negative do not.
      picture:
        kind: compare
        columns:
        - title: Prokaryote
          points:
          - no nucleus
          - 70S ribosomes
          - no membrane organelles
        - title: Eukaryote
          points:
          - true nucleus
          - 80S ribosomes
          - many membrane organelles
        alt: Prokaryotic and eukaryotic cells compared.
      check:
        prompt: 'Bacterial DNA lies in the:'
        options:
        - nucleoid
        - nucleus
        - mitochondrion
        answer: nucleoid
        why: No membrane around it.
  items:
  - prompt: Who said 'omnis cellula-e cellula' (all cells arise from pre-existing cells)?
    options:
    - Rudolf Virchow
    - Schleiden
    - Schwann
    - Robert Hooke
    answer: Rudolf Virchow
    difficulty: 2
    hints:
    - Modified cell theory.
    - '1855.'
    solution: Virchow.
    mistakes: {"Schleiden": "b11_virchow", "Schwann": "b11_virchow", "Robert Hooke": "b11_virchow"}
  - prompt: 'Prokaryotic ribosomes are:'
    options:
    - 70S
    - 80S
    - 60S
    - 40S
    answer: 70S
    difficulty: 1
    hints:
    - Smaller.
    - 50S + 30S.
    solution: 70S.
    mistakes:
      80S: c11b_prok
  - prompt: 'The largest single cell is the:'
    options:
    - ostrich egg
    - nerve cell
    - red blood cell
    - bacterium
    answer: ostrich egg
    difficulty: 1
    hints:
    - Bird egg.
    - Biggest bird.
    solution: The ostrich egg.
    mistakes: {"nerve cell": "b11_largest_cell", "red blood cell": "b11_largest_cell", "bacterium": "b11_largest_cell"}
  - prompt: 'Extra small circular DNA in bacteria is called a:'
    options:
    - plasmid
    - nucleoid
    - mesosome
    - ribosome
    answer: plasmid
    difficulty: 2
    hints:
    - Outside the main DNA.
    - Antibiotic resistance.
    solution: A plasmid.
    mistakes: {"nucleoid": "b11_plasmid", "mesosome": "b11_plasmid", "ribosome": "b11_plasmid"}
  - prompt: 'Infoldings of the bacterial plasma membrane are:'
    options:
    - mesosomes
    - cristae
    - thylakoids
    - pili
    answer: mesosomes
    difficulty: 2
    hints:
    - Help in respiration and division.
    - Bacteria.
    solution: Mesosomes.
    mistakes: {"cristae": "b11_mesosome", "thylakoids": "b11_mesosome", "pili": "b11_mesosome"}
  - prompt: Which organisms are prokaryotes?
    options:
    - bacteria
    - fungi
    - plants
    - animals
    answer: bacteria
    difficulty: 1
    hints:
    - Monera.
    - No nucleus.
    solution: Bacteria.
    mistakes: {"fungi": "b11_prokaryote", "plants": "b11_prokaryote", "animals": "b11_prokaryote"}
  - prompt: Who proposed that all animals are made of cells?
    options:
    - Theodor Schwann
    - Robert Brown
    - Rudolf Virchow
    answer: Theodor Schwann
    difficulty: 1
    hints:
    - He worked with Schleiden.
    - He studied animal tissues.
    solution: 'Step 1: animal cell work. Step 2: Schwann.'
    mistakes:
      Robert Brown: c11b08_prok
      Rudolf Virchow: c11b08_prok
  - prompt: 70S ribosomes are made of which two subunits?
    options:
    - 50S and 30S
    - 60S and 40S
    - 40S and 30S
    answer: 50S and 30S
    difficulty: 1
    hints:
    - S values do not simply add.
    - The larger one is 50S.
    solution: 'Step 1: prokaryotic subunits. Step 2: 50S + 30S.'
    mistakes:
      60S and 40S: c11b08_prok
      40S and 30S: c11b08_prok
  - prompt: 'Hair-like structures that help bacteria stick to surfaces are:'
    options:
    - fimbriae
    - flagella
    - mesosomes
    answer: fimbriae
    difficulty: 1
    hints:
    - They are not for swimming.
    - Small bristles on the surface.
    solution: 'Step 1: attachment bristles. Step 2: fimbriae.'
    mistakes:
      flagella: c11b08_prok
      mesosomes: c11b08_prok
  - prompt: 'Several ribosomes on one mRNA form a:'
    options:
    - polysome
    - plasmid
    - nucleoid
    answer: polysome
    difficulty: 2
    hints:
    - Poly means many.
    - Each makes a copy of the same protein.
    solution: 'Step 1: many ribosomes on one mRNA. Step 2: polysome.'
    mistakes:
      plasmid: c11b08_prok
      nucleoid: c11b08_prok
  - prompt: 'Gram-positive bacteria:'
    options:
    - keep the Gram stain
    - lose the Gram stain
    - have no cell wall
    answer: keep the Gram stain
    difficulty: 2
    hints:
    - Positive means the stain stays.
    - Their wall is thick.
    solution: 'Step 1: stain retained. Step 2: Gram-positive.'
    mistakes:
      lose the Gram stain: c11b08_prok
      have no cell wall: c11b08_prok
  - prompt: 'Plasmids are useful in genetic engineering because they:'
    options:
    - can carry foreign genes into bacteria
    - make ribosomes
    - form cell walls
    answer: can carry foreign genes into bacteria
    difficulty: 2
    hints:
    - They are small circular DNA.
    - They copy themselves.
    solution: 'Step 1: self-copying small DNA. Step 2: used as vectors.'
    mistakes:
      make ribosomes: c11b08_prok
      form cell walls: c11b08_prok
  - prompt: 'The outer sticky layer of a bacterial cell envelope is the:'
    options:
    - glycocalyx
    - plasma membrane
    - nucleoid
    answer: glycocalyx
    difficulty: 2
    hints:
    - Glyco means sugar.
    - It may be a loose slime layer or a capsule.
    solution: 'Step 1: outermost sugary layer. Step 2: glycocalyx.'
    mistakes:
      plasma membrane: c11b08_prok
      nucleoid: c11b08_prok
  - prompt: 'Mesosomes in bacteria help in:'
    options:
    - cell wall formation, DNA copying and respiration
    - photosynthesis only
    - making proteins
    answer: cell wall formation, DNA copying and respiration
    difficulty: 3
    hints:
    - They are folds of the plasma membrane.
    - They increase membrane area.
    solution: 'Step 1: extra membrane surface. Step 2: wall-making, DNA copying, respiration.'
    mistakes:
      photosynthesis only: c11b08_prok
      making proteins: c11b08_prok
  - prompt: Why are viruses not covered by the cell theory?
    options:
    - they are not made of cells
    - they are too big
    - they have nuclei
    answer: they are not made of cells
    difficulty: 3
    hints:
    - Cell theory is about things built of cells.
    - What is a virus made of?
    solution: 'Step 1: nucleic acid + protein coat. Step 2: not cells.'
    mistakes:
      they are too big: c11b08_prok
      they have nuclei: c11b08_prok
- code: cbse11b.cell.eukaryote
  title: Eukaryotic cell organelles
  after:
  - cbse11b.cell.theory
  notes: |
    Cell membrane: fluid mosaic model (Singer and Nicolson, 1972); lipid bilayer with proteins; passive and active
    transport. Plant cell wall (cellulose, middle lamella of calcium pectate). Endomembrane system: ER (rough, with
    ribosomes, protein synthesis; smooth, lipids), Golgi apparatus (packaging, glycoproteins), lysosomes (hydrolytic
    enzymes), vacuoles (tonoplast). Mitochondria (double membrane, cristae, own DNA and 70S ribosomes; ATP). Plastids:
    chloroplasts (grana, stroma), chromoplasts, leucoplasts. Ribosomes 80S (60S + 40S). Cytoskeleton, cilia and flagella
    (9 + 2), centrosome/centrioles (9 + 0, animal cells). Nucleus: nuclear envelope with pores, nucleolus, chromatin;
    chromosomes—centromere positions (metacentric, submetacentric, acrocentric, telocentric). Microbodies.
  explanations:
    text: Eukaryotic cells are like factories with departments. The nucleus holds the instructions, ribosomes build proteins, the ER and Golgi process and pack them, mitochondria supply energy, and chloroplasts (in plants) make food.
    visual: 'Draw a cell membrane as two rows of lipid heads and tails with proteins floating in it like boats on a sea: the fluid mosaic model.'
    step_by_step: 'Step 1: Name the organelle. Step 2: Note its membrane (single, double, none). Step 3: Match it to its job. Step 4: Remember mitochondria and chloroplasts have their own DNA.'
    real_world: Some inherited diseases come from faulty mitochondria, which are passed down only from the mother.
  picture:
    kind: compare
    columns:
    - title: Organelle
      points:
      - mitochondrion
      - chloroplast
      - ribosome
      - lysosome
      - Golgi
    - title: Job
      points:
      - makes ATP
      - photosynthesis
      - makes proteins
      - digests
      - packs and sends
    alt: Organelles and their jobs.
  activity:
    type: sort
    prompt: What is each organelle or part mainly for?
    bins:
    - Releasing energy (ATP)
    - Making proteins
    - Packing and sending out
    - Breaking things down
    - Making food
    items:
    - label: Mitochondrion
      bin: Releasing energy (ATP)
      clue: Where does aerobic respiration happen?
      why: The powerhouse of the cell.
    - label: Cristae
      bin: Releasing energy (ATP)
      clue: Infoldings of which organelle's inner membrane?
      why: Cristae of mitochondria hold the enzymes for ATP synthesis.
    - label: Ribosome
      bin: Making proteins
      clue: Where are amino acids joined?
      why: Ribosomes build proteins.
    - label: Rough ER
      bin: Making proteins
      clue: Why is it 'rough'?
      why: Ribosomes stud its surface, making proteins.
    - label: Golgi apparatus
      bin: Packing and sending out
      clue: Which organelle modifies and dispatches proteins?
      why: Golgi bodies pack materials into vesicles.
    - label: Cisternae of the Golgi
      bin: Packing and sending out
      clue: Flattened sacs stacked near the nucleus. What do they do?
      why: They modify and package products.
    - label: Lysosome
      bin: Breaking things down
      clue: A bag of digestive enzymes. What does it do?
      why: It digests worn-out parts and food.
    - label: Acid hydrolase enzymes
      bin: Breaking things down
      clue: Which organelle holds them?
      why: Lysosomal enzymes break molecules down.
    - label: Chloroplast
      bin: Making food
      clue: Which organelle traps light?
      why: Photosynthesis happens in chloroplasts.
    - label: Grana and stroma
      bin: Making food
      clue: Parts of which organelle?
      why: Grana trap light; the stroma builds sugar.
  lesson:
    - teach: 'The plasma membrane is a lipid bilayer with proteins floating in it: the fluid mosaic model (Singer and Nicolson, 1972). Plant cells also have a cellulose wall, joined by a middle lamella of calcium pectate.'
      check:
        prompt: '''Fluid'' in the fluid mosaic model means:'
        options:
        - lipids and proteins can move sideways
        - the membrane is liquid water
        - the cell has no shape
        answer: lipids and proteins can move sideways
        why: The bilayer is not rigid.
    - teach: 'Endomembrane system: rough ER (with ribosomes, makes proteins), smooth ER (lipids), Golgi apparatus (packages and sends out), lysosomes (digestive enzymes), vacuoles. Mitochondria make ATP and have their own DNA.'
      check:
        prompt: 'Steroid hormones are made mainly in:'
        options:
        - smooth ER
        - rough ER
        - lysosomes
        answer: smooth ER
        why: Smooth ER makes lipids.
    - teach: 'Plastids: chloroplasts (photosynthesis, grana in stroma), chromoplasts (colours), leucoplasts (storage). Eukaryotic ribosomes are 80S. Cilia and flagella are 9 + 2; centrioles are 9 + 0. The nucleus has a double envelope with pores and a nucleolus.'
      picture:
        kind: compare
        columns:
        - title: Organelle
          points:
          - mitochondrion
          - chloroplast
          - Golgi
          - lysosome
        - title: Job
          points:
          - ATP (energy)
          - photosynthesis
          - packaging
          - digestion
        alt: Main organelles and their jobs.
      check:
        prompt: Which organelle digests worn-out cell parts?
        options:
        - lysosome
        - ribosome
        - nucleolus
        answer: lysosome
        why: It holds hydrolytic enzymes.
  items:
  - prompt: 'The powerhouse of the cell is the:'
    options:
    - mitochondrion
    - nucleus
    - Golgi body
    - ribosome
    answer: mitochondrion
    difficulty: 1
    hints:
    - Makes ATP.
    - Cristae.
    solution: The mitochondrion.
    mistakes:
      ribosome: c11b_organelle
  - prompt: 'The fluid mosaic model of the membrane was given by:'
    options:
    - Singer and Nicolson
    - Watson and Crick
    - Schleiden and Schwann
    - Robertson
    answer: Singer and Nicolson
    difficulty: 2
    hints:
    - '1972.'
    - Lipids and floating proteins.
    solution: Singer and Nicolson.
    mistakes: {"Watson and Crick": "b11_fluid_mosaic", "Schleiden and Schwann": "b11_fluid_mosaic", "Robertson": "b11_fluid_mosaic"}
  - prompt: Which organelles have their own DNA?
    options:
    - mitochondria and chloroplasts
    - Golgi and ER
    - lysosomes and vacuoles
    - ribosomes and centrioles
    answer: mitochondria and chloroplasts
    difficulty: 2
    hints:
    - Semi-autonomous.
    - Double membrane.
    solution: Mitochondria and chloroplasts.
    mistakes: {"Golgi and ER": "b11_own_dna", "lysosomes and vacuoles": "b11_own_dna", "ribosomes and centrioles": "b11_own_dna"}
  - prompt: 'Cilia and flagella have a microtubule arrangement of:'
    options:
    - 9 + 2
    - 9 + 0
    - 9 + 3
    - 6 + 2
    answer: 9 + 2
    difficulty: 2
    hints:
    - Axoneme.
    - Two central.
    solution: 9 + 2.
    mistakes: {"9 + 0": "b11_axoneme", "9 + 3": "b11_axoneme", "6 + 2": "b11_axoneme"}
  - prompt: 'A chromosome with its centromere exactly in the middle is:'
    options:
    - metacentric
    - acrocentric
    - telocentric
    - submetacentric
    answer: metacentric
    difficulty: 2
    hints:
    - Equal arms.
    - Meta = middle.
    solution: Metacentric.
    mistakes: {"acrocentric": "b11_metacentric", "telocentric": "b11_metacentric", "submetacentric": "b11_metacentric"}
  - prompt: 'Rough ER is rough because it carries:'
    options:
    - ribosomes
    - lysosomes
    - DNA
    - chlorophyll
    answer: ribosomes
    difficulty: 1
    hints:
    - Protein synthesis.
    - Dots on surface.
    solution: Ribosomes.
    mistakes: {"lysosomes": "b11_rough_er", "DNA": "b11_rough_er", "chlorophyll": "b11_rough_er"}
  - prompt: 'Eukaryotic ribosomes are:'
    options:
    - 80S
    - 70S
    - 60S
    answer: 80S
    difficulty: 1
    hints:
    - Larger than bacterial ones.
    - Made of 60S and 40S subunits.
    solution: 'Step 1: 60S + 40S. Step 2: 80S.'
    mistakes:
      70S: c11b08_org
      60S: c11b08_org
  - prompt: 'The membrane around a plant vacuole is the:'
    options:
    - tonoplast
    - plasmalemma
    - nuclear envelope
    answer: tonoplast
    difficulty: 1
    hints:
    - It controls what enters the vacuole.
    - Tono relates to tension.
    solution: 'Step 1: vacuole membrane. Step 2: tonoplast.'
    mistakes:
      plasmalemma: c11b08_org
      nuclear envelope: c11b08_org
  - prompt: 'Coloured plastids in flowers and fruits are:'
    options:
    - chromoplasts
    - leucoplasts
    - chloroplasts
    answer: chromoplasts
    difficulty: 1
    hints:
    - Chromo means colour.
    - Carrot's orange comes from them.
    solution: 'Step 1: colour-bearing. Step 2: chromoplasts.'
    mistakes:
      leucoplasts: c11b08_org
      chloroplasts: c11b08_org
  - prompt: 'Ribosomal RNA is made in the:'
    options:
    - nucleolus
    - Golgi apparatus
    - lysosome
    answer: nucleolus
    difficulty: 2
    hints:
    - It is inside the nucleus.
    - It is very active in protein-making cells.
    solution: 'Step 1: rRNA synthesis site. Step 2: nucleolus.'
    mistakes:
      Golgi apparatus: c11b08_org
      lysosome: c11b08_org
  - prompt: 'Inner folds of the mitochondrial membrane are called:'
    options:
    - cristae
    - grana
    - cisternae
    answer: cristae
    difficulty: 2
    hints:
    - They increase surface area.
    - Grana are in chloroplasts.
    solution: 'Step 1: infoldings of inner membrane. Step 2: cristae.'
    mistakes:
      grana: c11b08_org
      cisternae: c11b08_org
  - prompt: Centrioles have which microtubule pattern?
    options:
    - 9 + 0 (nine triplets)
    - 9 + 2
    - 2 + 9
    answer: 9 + 0 (nine triplets)
    difficulty: 2
    hints:
    - Unlike cilia, they have no central pair.
    - Cartwheel structure.
    solution: 'Step 1: nine peripheral triplets. Step 2: no central microtubules.'
    mistakes:
      9 + 2: c11b08_org
      2 + 9: c11b08_org
  - prompt: 'A chromosome with the centromere at one end is:'
    options:
    - telocentric
    - metacentric
    - acrocentric
    answer: telocentric
    difficulty: 2
    hints:
    - Telo means end.
    - Acrocentric has it very close to an end, not at it.
    solution: 'Step 1: centromere terminal. Step 2: telocentric.'
    mistakes:
      metacentric: c11b08_org
      acrocentric: c11b08_org
  - prompt: 'Glycoproteins and glycolipids are mainly formed in the:'
    options:
    - Golgi apparatus
    - mitochondria
    - nucleus
    answer: Golgi apparatus
    difficulty: 3
    hints:
    - It adds sugars to products from the ER.
    - Then it packs them for export.
    solution: 'Step 1: modification and packaging centre. Step 2: Golgi.'
    mistakes:
      mitochondria: c11b08_org
      nucleus: c11b08_org
  - prompt: Why are mitochondria called semi-autonomous?
    options:
    - they have their own DNA and ribosomes
    - they move freely
    - they make their own membranes from nothing
    answer: they have their own DNA and ribosomes
    difficulty: 3
    hints:
    - They can make some of their own proteins.
    - They still need the nucleus for others.
    solution: 'Step 1: own DNA and 70S ribosomes. Step 2: partly independent.'
    mistakes:
      they move freely: c11b08_org
      they make their own membranes from nothing: c11b08_org
