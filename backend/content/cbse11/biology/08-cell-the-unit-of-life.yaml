# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse11-bio
chapter: 8
title: 'Cell: The Unit of Life'
tips:
  c11b_prok: Prokaryotes have no nucleus and no membrane-bound organelles; their ribosomes are 70S. Eukaryotic cytoplasm has 80S ribosomes.
  c11b_organelle: Mitochondria make ATP (aerobic respiration); chloroplasts do photosynthesis; ribosomes make proteins; lysosomes digest.
concepts:
- code: cbse11b.cell.theory
  title: Cell theory and prokaryotic cells
  notes: |
    Cell theory: Schleiden and Schwann (all organisms made of cells), Virchow (omnis cellula-e cellula: cells arise from
    pre-existing cells). Unicellular and multicellular organisms. Cells vary in size (mycoplasma 0.3 μm, bacteria 3–5 μm,
    ostrich egg largest single cell) and shape. Prokaryotic cell: cell envelope (glycocalyx, cell wall, plasma membrane);
    Gram-positive and Gram-negative; mesosomes; nucleoid (naked circular DNA), plasmids; 70S ribosomes (50S + 30S),
    polysomes; inclusion bodies; flagella, pili, fimbriae.
  explanations:
    text: 'Cell theory says every living thing is made of cells, and every cell comes from an existing cell. Prokaryotic cells, like bacteria, are small and simple: no nucleus, just a loop of DNA in the cytoplasm.'
    visual: 'Draw a bacterium: a capsule outside, a cell wall, a membrane, a coiled DNA loop with no nuclear membrane, small ribosomes, and a tail-like flagellum.'
    step_by_step: 'Step 1: Look for a nucleus. Step 2: No nucleus → prokaryote. Step 3: Check ribosomes (70S) and membrane folds (mesosomes).'
    real_world: Plasmids from bacteria are used in genetic engineering to carry useful genes, such as the gene for human insulin.
  picture:
    kind: compare
    columns:
    - title: Feature
      points:
      - nucleus
      - ribosomes
      - organelles
    - title: Prokaryote
      points:
      - absent (nucleoid)
      - 70S
      - no membrane-bound
    - title: Eukaryote
      points:
      - present
      - 80S
      - membrane-bound
    alt: Prokaryotic and eukaryotic cells compared.
  items:
  - prompt: Who said 'omnis cellula-e cellula' (all cells arise from pre-existing cells)?
    options:
    - Rudolf Virchow
    - Schleiden
    - Schwann
    - Robert Hooke
    answer: Rudolf Virchow
    difficulty: 2
    hints:
    - Modified cell theory.
    - '1855.'
    solution: Virchow.
  - prompt: 'Prokaryotic ribosomes are:'
    options:
    - 70S
    - 80S
    - 60S
    - 40S
    answer: 70S
    difficulty: 1
    hints:
    - Smaller.
    - 50S + 30S.
    solution: 70S.
    mistakes:
      80S: c11b_prok
  - prompt: 'The largest single cell is the:'
    options:
    - ostrich egg
    - nerve cell
    - red blood cell
    - bacterium
    answer: ostrich egg
    difficulty: 1
    hints:
    - Bird egg.
    - Biggest bird.
    solution: The ostrich egg.
  - prompt: 'Extra small circular DNA in bacteria is called a:'
    options:
    - plasmid
    - nucleoid
    - mesosome
    - ribosome
    answer: plasmid
    difficulty: 2
    hints:
    - Outside the main DNA.
    - Antibiotic resistance.
    solution: A plasmid.
  - prompt: 'Infoldings of the bacterial plasma membrane are:'
    options:
    - mesosomes
    - cristae
    - thylakoids
    - pili
    answer: mesosomes
    difficulty: 2
    hints:
    - Help in respiration and division.
    - Bacteria.
    solution: Mesosomes.
  - prompt: Which organisms are prokaryotes?
    options:
    - bacteria
    - fungi
    - plants
    - animals
    answer: bacteria
    difficulty: 1
    hints:
    - Monera.
    - No nucleus.
    solution: Bacteria.
- code: cbse11b.cell.eukaryote
  title: Eukaryotic cell organelles
  after:
  - cbse11b.cell.theory
  notes: |
    Cell membrane: fluid mosaic model (Singer and Nicolson, 1972); lipid bilayer with proteins; passive and active
    transport. Plant cell wall (cellulose, middle lamella of calcium pectate). Endomembrane system: ER (rough, with
    ribosomes, protein synthesis; smooth, lipids), Golgi apparatus (packaging, glycoproteins), lysosomes (hydrolytic
    enzymes), vacuoles (tonoplast). Mitochondria (double membrane, cristae, own DNA and 70S ribosomes; ATP). Plastids:
    chloroplasts (grana, stroma), chromoplasts, leucoplasts. Ribosomes 80S (60S + 40S). Cytoskeleton, cilia and flagella
    (9 + 2), centrosome/centrioles (9 + 0, animal cells). Nucleus: nuclear envelope with pores, nucleolus, chromatin;
    chromosomes—centromere positions (metacentric, submetacentric, acrocentric, telocentric). Microbodies.
  explanations:
    text: Eukaryotic cells are like factories with departments. The nucleus holds the instructions, ribosomes build proteins, the ER and Golgi process and pack them, mitochondria supply energy, and chloroplasts (in plants) make food.
    visual: 'Draw a cell membrane as two rows of lipid heads and tails with proteins floating in it like boats on a sea: the fluid mosaic model.'
    step_by_step: 'Step 1: Name the organelle. Step 2: Note its membrane (single, double, none). Step 3: Match it to its job. Step 4: Remember mitochondria and chloroplasts have their own DNA.'
    real_world: Some inherited diseases come from faulty mitochondria, which are passed down only from the mother.
  picture:
    kind: compare
    columns:
    - title: Organelle
      points:
      - mitochondrion
      - chloroplast
      - ribosome
      - lysosome
      - Golgi
    - title: Job
      points:
      - makes ATP
      - photosynthesis
      - makes proteins
      - digests
      - packs and sends
    alt: Organelles and their jobs.
  items:
  - prompt: 'The powerhouse of the cell is the:'
    options:
    - mitochondrion
    - nucleus
    - Golgi body
    - ribosome
    answer: mitochondrion
    difficulty: 1
    hints:
    - Makes ATP.
    - Cristae.
    solution: The mitochondrion.
    mistakes:
      ribosome: c11b_organelle
  - prompt: 'The fluid mosaic model of the membrane was given by:'
    options:
    - Singer and Nicolson
    - Watson and Crick
    - Schleiden and Schwann
    - Robertson
    answer: Singer and Nicolson
    difficulty: 2
    hints:
    - '1972.'
    - Lipids and floating proteins.
    solution: Singer and Nicolson.
  - prompt: Which organelles have their own DNA?
    options:
    - mitochondria and chloroplasts
    - Golgi and ER
    - lysosomes and vacuoles
    - ribosomes and centrioles
    answer: mitochondria and chloroplasts
    difficulty: 2
    hints:
    - Semi-autonomous.
    - Double membrane.
    solution: Mitochondria and chloroplasts.
  - prompt: 'Cilia and flagella have a microtubule arrangement of:'
    options:
    - 9 + 2
    - 9 + 0
    - 9 + 3
    - 6 + 2
    answer: 9 + 2
    difficulty: 2
    hints:
    - Axoneme.
    - Two central.
    solution: 9 + 2.
  - prompt: 'A chromosome with its centromere exactly in the middle is:'
    options:
    - metacentric
    - acrocentric
    - telocentric
    - submetacentric
    answer: metacentric
    difficulty: 2
    hints:
    - Equal arms.
    - Meta = middle.
    solution: Metacentric.
  - prompt: 'Rough ER is rough because it carries:'
    options:
    - ribosomes
    - lysosomes
    - DNA
    - chlorophyll
    answer: ribosomes
    difficulty: 1
    hints:
    - Protein synthesis.
    - Dots on surface.
    solution: Ribosomes.
