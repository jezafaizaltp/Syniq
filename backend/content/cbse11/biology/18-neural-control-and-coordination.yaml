# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 18. Format: content/README.md.
subject: cbse11-bio
chapter: 18
title: Neural Control and Coordination
tips:
  c11b_impulse: At rest the inside of a neuron is negative (about −70 mV); during an impulse it becomes positive as Na⁺ rushes in.
  c11b_brain: 'Cerebrum: thinking, memory, senses. Cerebellum: balance and coordination. Medulla: breathing, heartbeat.'
concepts:
- code: cbse11b.neural.neuron
  title: Neurons and the nerve impulse
  notes: |
    Neural system: CNS (brain, spinal cord) and PNS (somatic and autonomic: sympathetic, parasympathetic). Neuron: cell body
    (Nissl's granules), dendrites, axon; myelinated (Schwann cells, nodes of Ranvier; saltatory conduction—faster) and
    non-myelinated. Multipolar, bipolar, unipolar. Resting potential: Na⁺/K⁺ pump (3 Na⁺ out, 2 K⁺ in), inside negative
    (polarised). Action potential: Na⁺ channels open, depolarisation; K⁺ out, repolarisation. Synapse: electrical and
    chemical; neurotransmitters (acetylcholine) cross the synaptic cleft and bind receptors.
  explanations:
    text: Neurons carry messages as electrical impulses. At rest, the inside is negative. When stimulated, sodium ions rush in and the inside briefly turns positive; this wave travels along the axon. At a synapse, chemicals carry the message to the next cell.
    visual: 'Draw a neuron: branched dendrites, a cell body, a long axon wrapped in myelin with gaps (nodes of Ranvier), and endings that touch the next cell at a synapse.'
    step_by_step: 'Step 1: Resting: inside negative, Na⁺ outside. Step 2: Stimulus: Na⁺ flows in (depolarisation). Step 3: K⁺ flows out (repolarisation). Step 4: At the synapse, neurotransmitter crosses the gap.'
    real_world: Myelinated nerves carry signals up to about 120 m/s, which is why you snatch your hand from a hot pan before you feel the pain.
  picture:
    kind: flow
    steps:
    - Dendrites receive
    - Cell body
    - Impulse along axon
    - Axon terminal
    - Neurotransmitter crosses synapse
    alt: How a message passes through a neuron and across a synapse.
  activity:
    type: order
    prompt: Put the steps of a nerve impulse passing to the next neuron in order.
    steps:
    - 'At rest: inside negative, outside positive'
    - A stimulus opens Na⁺ channels
    - 'Na⁺ rushes in: the inside turns positive (depolarisation)'
    - The impulse travels along the axon
    - At the axon terminal, vesicles release neurotransmitter
    - Neurotransmitter binds receptors on the next neuron
    reasons:
      A stimulus opens Na⁺ channels: There has to be a resting potential to disturb before a stimulus can change it.
      'Na⁺ rushes in: the inside turns positive (depolarisation)': Na⁺ can flood in only after its channels open.
      The impulse travels along the axon: Each patch of membrane depolarises in turn, so the impulse moves only after the first patch fires.
      At the axon terminal, vesicles release neurotransmitter: Neurotransmitter is released only when the impulse reaches the terminal.
      Neurotransmitter binds receptors on the next neuron: It must cross the synaptic cleft after release before it can bind.
  items:
  - prompt: The resting potential of a neuron is about −70 mV. What is its size in mV (ignore the sign)?
    answer: '70'
    check: '70'
    difficulty: 1
    hints:
    - About −70 mV.
    - Magnitude.
    solution: 70 mV (inside negative).
  - prompt: The sodium–potassium pump moves how many Na⁺ ions out per cycle?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 3 Na⁺ out, 2 K⁺ in.
    - Three.
    solution: '3.'
  - prompt: During depolarisation, which ions rush into the neuron?
    options:
    - Na⁺
    - K⁺
    - Cl⁻
    - Ca²⁺ only
    answer: Na⁺
    difficulty: 1
    hints:
    - Sodium channels open.
    - Inside turns positive.
    solution: Sodium ions.
    mistakes:
      K⁺: c11b_impulse
  - prompt: 'Impulses jump from node to node in myelinated nerves; this is called:'
    options:
    - saltatory conduction
    - diffusion
    - osmosis
    - synaptic delay
    answer: saltatory conduction
    difficulty: 2
    hints:
    - Saltare = to jump.
    - Faster.
    solution: Saltatory conduction.
  - prompt: 'A common neurotransmitter is:'
    options:
    - acetylcholine
    - insulin
    - haemoglobin
    - pepsin
    answer: acetylcholine
    difficulty: 1
    hints:
    - Nerve to muscle.
    - ACh.
    solution: Acetylcholine.
  - prompt: 'The brain and spinal cord together form the:'
    options:
    - central nervous system
    - peripheral nervous system
    - autonomic nervous system
    - somatic system only
    answer: central nervous system
    difficulty: 1
    hints:
    - CNS.
    - Control centre.
    solution: The CNS.
- code: cbse11b.neural.brain
  title: The brain and reflex action
  after:
  - cbse11b.neural.neuron
  notes: |
    Brain protected by skull, cranial meninges (dura, arachnoid, pia), cerebrospinal fluid. Forebrain: cerebrum (two
    hemispheres joined by corpus callosum; cortex grey matter; sensory, motor and association areas), thalamus,
    hypothalamus (temperature, hunger, thirst, hormones), limbic system (emotions, memory). Midbrain (corpora
    quadrigemina). Hindbrain: pons, cerebellum (balance, posture, coordination), medulla oblongata (breathing, heartbeat,
    swallowing, vomiting). Brain stem = midbrain + pons + medulla. Reflex action: involuntary, quick; reflex arc: receptor
    → afferent (sensory) neuron → spinal cord → efferent (motor) neuron → effector; knee-jerk reflex.
  explanations:
    text: The brain has three main parts. The forebrain (cerebrum) handles thinking, memory and the senses; the cerebellum keeps balance; the medulla runs automatic jobs like breathing and heartbeat. Reflexes are fast automatic responses run by the spinal cord.
    visual: 'Draw the knee-jerk reflex arc: a tap on the knee → sensory neuron → spinal cord → motor neuron → thigh muscle kicks, without waiting for the brain.'
    step_by_step: 'Step 1: Match the job to the brain part. Step 2: For a reflex, trace receptor → sensory neuron → spinal cord → motor neuron → muscle.'
    real_world: Doctors tap your knee to test the reflex arc; a missing or exaggerated kick can point to a nerve problem.
  picture:
    kind: flow
    steps:
    - Receptor
    - Sensory (afferent) neuron
    - Spinal cord
    - Motor (efferent) neuron
    - Effector (muscle)
    alt: The reflex arc from receptor to effector.
  activity:
    type: sort
    prompt: Which part of the brain is it in?
    bins:
    - Forebrain
    - Midbrain
    - Hindbrain
    items:
    - label: Cerebrum
      bin: Forebrain
      clue: The largest part, with the cortex. Front, middle or back?
      why: The cerebrum is the main part of the forebrain.
    - label: Thalamus
      bin: Forebrain
      clue: It relays sensory signals to the cerebrum. Where is it?
      why: The thalamus sits in the forebrain.
    - label: Hypothalamus
      bin: Forebrain
      clue: Controls temperature, hunger and thirst. Where?
      why: Forebrain, at the base of the thalamus.
    - label: Limbic system
      bin: Forebrain
      clue: Emotions and memory. Where?
      why: The limbic system lies deep in the forebrain.
    - label: Corpora quadrigemina
      bin: Midbrain
      clue: Four round lobes for sight and hearing reflexes. Where?
      why: The midbrain.
    - label: Cerebral aqueduct
      bin: Midbrain
      clue: A canal between the 3rd and 4th ventricles. Where does it run?
      why: Through the midbrain.
    - label: Cerebellum
      bin: Hindbrain
      clue: Balance and smooth movement. Where?
      why: Part of the hindbrain.
    - label: Pons
      bin: Hindbrain
      clue: Helps control breathing. Front or back?
      why: Part of the hindbrain.
    - label: Medulla oblongata
      bin: Hindbrain
      clue: Controls heartbeat and breathing; joins the spinal cord. Where?
      why: Hindbrain.
  items:
  - prompt: 'Balance and coordination of movements are controlled by the:'
    options:
    - cerebellum
    - cerebrum
    - medulla
    - hypothalamus
    answer: cerebellum
    difficulty: 1
    hints:
    - Little brain.
    - Hindbrain.
    solution: The cerebellum.
    mistakes:
      cerebrum: c11b_brain
  - prompt: 'Breathing and heartbeat are controlled by the:'
    options:
    - medulla oblongata
    - cerebrum
    - cerebellum
    - thalamus
    answer: medulla oblongata
    difficulty: 1
    hints:
    - Automatic.
    - Brain stem.
    solution: The medulla.
  - prompt: 'Body temperature, hunger and thirst are regulated by the:'
    options:
    - hypothalamus
    - cerebellum
    - pons
    - corpus callosum
    answer: hypothalamus
    difficulty: 2
    hints:
    - Below the thalamus.
    - Thermostat.
    solution: The hypothalamus.
  - prompt: 'The two cerebral hemispheres are joined by the:'
    options:
    - corpus callosum
    - pons
    - medulla
    - spinal cord
    answer: corpus callosum
    difficulty: 2
    hints:
    - Nerve fibre bridge.
    - Big band.
    solution: The corpus callosum.
  - prompt: 'In a reflex arc, the neuron carrying signals to the spinal cord is:'
    options:
    - sensory (afferent)
    - motor (efferent)
    - relay only
    - autonomic
    answer: sensory (afferent)
    difficulty: 2
    hints:
    - Toward the CNS.
    - Afferent = arriving.
    solution: The sensory (afferent) neuron.
  - prompt: How many meninges (protective layers) cover the brain?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Dura, arachnoid, pia.
    - Count.
    solution: Three.
