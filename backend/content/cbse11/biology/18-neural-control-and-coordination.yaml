# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 18. Format: content/README.md.
subject: cbse11-bio
chapter: 18
title: Neural Control and Coordination
tips:
  c11b_impulse: At rest the inside of a neuron is negative (about −70 mV); during an impulse it becomes positive as Na⁺ rushes in.
  c11b_brain: "The large cerebrum handles thinking and the medulla handles breathing and heartbeat. Balance and smooth movement are run by the 'little brain' at the back."
  b11_afferent: "Afferent = towards the CNS; efferent = away from it."
  b11_cns: "Central = in the middle of the body, inside skull and spine."
  b11_corpus_callosum: "A thick band of nerve fibres bridges the left and right halves."
  b11_hypothalamus: "A small region below the thalamus acts as the body's thermostat and hunger centre."
  b11_medulla_oblongata: "The cerebellum handles balance, the cerebrum thought. Vital automatic functions sit in the lowest part of the brain stem."
  b11_meninges: "Dura, arachnoid and pia mater. Count."
  b11_na_k_pump: "The pump moves unequal numbers: more of one ion goes out than of the other comes in. Which ion leaves in the larger number?"
  b11_neurotransmitter: "Insulin is a hormone, haemoglobin carries oxygen, pepsin digests. Which one carries a signal across a synapse?"
  b11_resting: "Ignore the minus sign."
  b11_saltatory: "'Saltare' means to jump in Latin."
  c11b18_imp: 'Track the ions: at rest the inside is negative; Na⁺ rushing in makes it positive (depolarisation); K⁺ leaving restores it.'
  c11b18_brain: 'Match the job to the part: thinking (cerebrum), balance (cerebellum), automatic life functions (medulla), body settings like temperature (hypothalamus).'
concepts:
- code: cbse11b.neural.neuron
  title: Neurons and the nerve impulse
  notes: |
    Neural system: CNS (brain, spinal cord) and PNS (somatic and autonomic: sympathetic, parasympathetic). Neuron: cell body
    (Nissl's granules), dendrites, axon; myelinated (Schwann cells, nodes of Ranvier; saltatory conduction—faster) and
    non-myelinated. Multipolar, bipolar, unipolar. Resting potential: Na⁺/K⁺ pump (3 Na⁺ out, 2 K⁺ in), inside negative
    (polarised). Action potential: Na⁺ channels open, depolarisation; K⁺ out, repolarisation. Synapse: electrical and
    chemical; neurotransmitters (acetylcholine) cross the synaptic cleft and bind receptors.
  explanations:
    text: Neurons carry messages as electrical impulses. At rest, the inside is negative. When stimulated, sodium ions rush in and the inside briefly turns positive; this wave travels along the axon. At a synapse, chemicals carry the message to the next cell.
    visual: 'Draw a neuron: branched dendrites, a cell body, a long axon wrapped in myelin with gaps (nodes of Ranvier), and endings that touch the next cell at a synapse.'
    step_by_step: 'Step 1: Resting: inside negative, Na⁺ outside. Step 2: Stimulus: Na⁺ flows in (depolarisation). Step 3: K⁺ flows out (repolarisation). Step 4: At the synapse, neurotransmitter crosses the gap.'
    real_world: Myelinated nerves carry signals up to about 120 m/s, which is why you snatch your hand from a hot pan before you feel the pain.
  picture:
    kind: flow
    steps:
    - Dendrites receive
    - Cell body
    - Impulse along axon
    - Axon terminal
    - Neurotransmitter crosses synapse
    alt: How a message passes through a neuron and across a synapse.
  activity:
    type: order
    prompt: Put the steps of a nerve impulse passing to the next neuron in order.
    steps:
    - 'At rest: inside negative, outside positive'
    - A stimulus opens Na⁺ channels
    - 'Na⁺ rushes in: the inside turns positive (depolarisation)'
    - The impulse travels along the axon
    - At the axon terminal, vesicles release neurotransmitter
    - Neurotransmitter binds receptors on the next neuron
    reasons:
      A stimulus opens Na⁺ channels: There has to be a resting potential to disturb before a stimulus can change it.
      'Na⁺ rushes in: the inside turns positive (depolarisation)': Na⁺ can flood in only after its channels open.
      The impulse travels along the axon: Each patch of membrane depolarises in turn, so the impulse moves only after the first patch fires.
      At the axon terminal, vesicles release neurotransmitter: Neurotransmitter is released only when the impulse reaches the terminal.
      Neurotransmitter binds receptors on the next neuron: It must cross the synaptic cleft after release before it can bind.
  lesson:
    - teach: The nervous system has the CNS (brain and spinal cord) and the PNS (nerves). The PNS has a somatic part (voluntary, to skeletal muscles) and an autonomic part (sympathetic and parasympathetic, to organs).
      check:
        prompt: 'Nerves to the heart and gut belong to the:'
        options:
        - autonomic system
        - somatic system
        - central nervous system
        answer: autonomic system
        why: Involuntary organs.
    - teach: A neuron has a cell body (with Nissl's granules), dendrites (bring signals in) and an axon (sends them out). Myelinated axons, wrapped by Schwann cells, conduct faster because the impulse jumps from node of Ranvier to node.
      check:
        prompt: 'Signals usually travel into the cell body along the:'
        options:
        - dendrites
        - axon
        - myelin sheath
        answer: dendrites
        why: The axon carries signals away.
    - teach: 'At rest the inside of the axon is about −70 mV (polarised); the Na⁺/K⁺ pump moves 3 Na⁺ out for 2 K⁺ in. A stimulus opens Na⁺ channels: Na⁺ rushes in (depolarisation). Then K⁺ leaves (repolarisation). At a chemical synapse, transmitters like acetylcholine cross the gap.'
      picture:
        kind: flow
        steps:
        - 'Resting: inside −70 mV'
        - 'Na⁺ rushes in: depolarised'
        - 'K⁺ flows out: repolarised'
        - Pump restores ions
        alt: Stages of a nerve impulse.
      check:
        prompt: 'During depolarisation the inside of the axon becomes:'
        options:
        - positive
        - more negative
        - neutral and stays so
        answer: positive
        why: Na⁺ ions enter.
  items:
  - prompt: The resting potential of a neuron is about −70 mV. What is its size in mV (ignore the sign)?
    answer: '70'
    check: '70'
    difficulty: 1
    hints:
    - About −70 mV.
    - Magnitude.
    solution: 70 mV (inside negative).
    mistakes: {"-70": "b11_resting", "35": "b11_resting"}
  - prompt: The sodium–potassium pump moves how many Na⁺ ions out per cycle?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 3 Na⁺ out, 2 K⁺ in.
    - Three.
    solution: '3.'
    mistakes: {"2": "b11_na_k_pump", "1": "b11_na_k_pump"}
  - prompt: During depolarisation, which ions rush into the neuron?
    options:
    - Na⁺
    - K⁺
    - Cl⁻
    - Ca²⁺ only
    answer: Na⁺
    difficulty: 1
    hints:
    - Sodium channels open.
    - Inside turns positive.
    solution: Sodium ions.
    mistakes:
      K⁺: c11b_impulse
  - prompt: 'Impulses jump from node to node in myelinated nerves; this is called:'
    options:
    - saltatory conduction
    - diffusion
    - osmosis
    - synaptic delay
    answer: saltatory conduction
    difficulty: 2
    hints:
    - Saltare = to jump.
    - Faster.
    solution: Saltatory conduction.
    mistakes: {"diffusion": "b11_saltatory", "osmosis": "b11_saltatory", "synaptic delay": "b11_saltatory"}
  - prompt: 'A common neurotransmitter is:'
    options:
    - acetylcholine
    - insulin
    - haemoglobin
    - pepsin
    answer: acetylcholine
    difficulty: 1
    hints:
    - Nerve to muscle.
    - ACh.
    solution: Acetylcholine.
    mistakes: {"insulin": "b11_neurotransmitter", "haemoglobin": "b11_neurotransmitter", "pepsin": "b11_neurotransmitter"}
  - prompt: 'The brain and spinal cord together form the:'
    options:
    - central nervous system
    - peripheral nervous system
    - autonomic nervous system
    - somatic system only
    answer: central nervous system
    difficulty: 1
    hints:
    - CNS.
    - Control centre.
    solution: The CNS.
    mistakes: {"peripheral nervous system": "b11_cns", "autonomic nervous system": "b11_cns", "somatic system only": "b11_cns"}
  - prompt: 'The gaps between Schwann cells on a myelinated axon are:'
    options:
    - nodes of Ranvier
    - synapses
    - dendrites
    answer: nodes of Ranvier
    difficulty: 1
    hints:
    - Named after a French scientist.
    - The impulse jumps between them.
    solution: 'Step 1: bare patches of axon. Step 2: nodes of Ranvier.'
    mistakes:
      synapses: c11b18_imp
      dendrites: c11b18_imp
  - prompt: The Na⁺/K⁺ pump brings how many K⁺ ions in per cycle?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - It moves 3 Na⁺ out.
    - Fewer K⁺ come in.
    solution: 'Step 1: 3 out, 2 in. Step 2: 2.'
    mistakes:
      '3': c11b18_imp
      '1': c11b18_imp
  - prompt: Which part of the PNS prepares the body for emergencies?
    options:
    - sympathetic
    - parasympathetic
    - somatic
    answer: sympathetic
    difficulty: 1
    hints:
    - Fight or flight.
    - It speeds the heart.
    solution: 'Step 1: emergency response. Step 2: sympathetic.'
    mistakes:
      parasympathetic: c11b18_imp
      somatic: c11b18_imp
  - prompt: 'A neuron with one axon and two or more dendrites is:'
    options:
    - multipolar
    - bipolar
    - unipolar
    answer: multipolar
    difficulty: 2
    hints:
    - Many processes from the cell body.
    - Found in the cerebral cortex.
    solution: 'Step 1: many poles. Step 2: multipolar.'
    mistakes:
      bipolar: c11b18_imp
      unipolar: c11b18_imp
  - prompt: A resting axon at −70 mV reaches +30 mV at the peak of an action potential. Total change (mV)?
    answer: '100'
    check: 30-(-70)
    difficulty: 2
    hints:
    - Subtract the start from the end.
    - Careful with the minus sign.
    solution: 'Step 1: 30 + 70. Step 2: 100 mV.'
    mistakes:
      '40': c11b18_imp
      '-40': c11b18_imp
  - prompt: Why do myelinated nerves conduct faster?
    options:
    - the impulse jumps between nodes
    - they are thicker only
    - they have no ions
    answer: the impulse jumps between nodes
    difficulty: 2
    hints:
    - Myelin insulates most of the axon.
    - Saltatory means jumping.
    solution: 'Step 1: only nodes depolarise. Step 2: impulse jumps, so it is faster.'
    mistakes:
      they are thicker only: c11b18_imp
      they have no ions: c11b18_imp
  - prompt: 'At a chemical synapse, the neurotransmitter is released from the:'
    options:
    - axon terminal (presynaptic membrane)
    - dendrite of the next neuron
    - myelin sheath
    answer: axon terminal (presynaptic membrane)
    difficulty: 2
    hints:
    - Vesicles fuse with the membrane before the gap.
    - It then crosses the synaptic cleft.
    solution: 'Step 1: vesicles in the axon terminal. Step 2: released into the cleft.'
    mistakes:
      dendrite of the next neuron: c11b18_imp
      myelin sheath: c11b18_imp
  - prompt: 'Nissl''s granules in the cell body are clusters of:'
    options:
    - ribosomes
    - mitochondria
    - lysosomes
    answer: ribosomes
    difficulty: 3
    hints:
    - They make proteins.
    - They are not found in the axon.
    solution: 'Step 1: rough ER with ribosomes. Step 2: protein synthesis.'
    mistakes:
      mitochondria: c11b18_imp
      lysosomes: c11b18_imp
  - prompt: Why does an impulse travel only one way across a chemical synapse?
    options:
    - transmitter is released only from the presynaptic side
    - the cleft is too wide
    - dendrites cannot conduct
    answer: transmitter is released only from the presynaptic side
    difficulty: 3
    hints:
    - Only one side has the vesicles.
    - Only the other side has receptors.
    solution: 'Step 1: vesicles on one side, receptors on the other. Step 2: one-way flow.'
    mistakes:
      the cleft is too wide: c11b18_imp
      dendrites cannot conduct: c11b18_imp
- code: cbse11b.neural.brain
  title: The brain and reflex action
  after:
  - cbse11b.neural.neuron
  notes: |
    Brain protected by skull, cranial meninges (dura, arachnoid, pia), cerebrospinal fluid. Forebrain: cerebrum (two
    hemispheres joined by corpus callosum; cortex grey matter; sensory, motor and association areas), thalamus,
    hypothalamus (temperature, hunger, thirst, hormones), limbic system (emotions, memory). Midbrain (corpora
    quadrigemina). Hindbrain: pons, cerebellum (balance, posture, coordination), medulla oblongata (breathing, heartbeat,
    swallowing, vomiting). Brain stem = midbrain + pons + medulla. Reflex action: involuntary, quick; reflex arc: receptor
    → afferent (sensory) neuron → spinal cord → efferent (motor) neuron → effector; knee-jerk reflex.
  explanations:
    text: The brain has three main parts. The forebrain (cerebrum) handles thinking, memory and the senses; the cerebellum keeps balance; the medulla runs automatic jobs like breathing and heartbeat. Reflexes are fast automatic responses run by the spinal cord.
    visual: 'Draw the knee-jerk reflex arc: a tap on the knee → sensory neuron → spinal cord → motor neuron → thigh muscle kicks, without waiting for the brain.'
    step_by_step: 'Step 1: Match the job to the brain part. Step 2: For a reflex, trace receptor → sensory neuron → spinal cord → motor neuron → muscle.'
    real_world: Doctors tap your knee to test the reflex arc; a missing or exaggerated kick can point to a nerve problem.
  picture:
    kind: flow
    steps:
    - Receptor
    - Sensory (afferent) neuron
    - Spinal cord
    - Motor (efferent) neuron
    - Effector (muscle)
    alt: The reflex arc from receptor to effector.
  activity:
    type: sort
    prompt: Which part of the brain is it in?
    bins:
    - Forebrain
    - Midbrain
    - Hindbrain
    items:
    - label: Cerebrum
      bin: Forebrain
      clue: The largest part, with the cortex. Front, middle or back?
      why: The cerebrum is the main part of the forebrain.
    - label: Thalamus
      bin: Forebrain
      clue: It relays sensory signals to the cerebrum. Where is it?
      why: The thalamus sits in the forebrain.
    - label: Hypothalamus
      bin: Forebrain
      clue: Controls temperature, hunger and thirst. Where?
      why: Forebrain, at the base of the thalamus.
    - label: Limbic system
      bin: Forebrain
      clue: Emotions and memory. Where?
      why: The limbic system lies deep in the forebrain.
    - label: Corpora quadrigemina
      bin: Midbrain
      clue: Four round lobes for sight and hearing reflexes. Where?
      why: The midbrain.
    - label: Cerebral aqueduct
      bin: Midbrain
      clue: A canal between the 3rd and 4th ventricles. Where does it run?
      why: Through the midbrain.
    - label: Cerebellum
      bin: Hindbrain
      clue: Balance and smooth movement. Where?
      why: Part of the hindbrain.
    - label: Pons
      bin: Hindbrain
      clue: Helps control breathing. Front or back?
      why: Part of the hindbrain.
    - label: Medulla oblongata
      bin: Hindbrain
      clue: Controls heartbeat and breathing; joins the spinal cord. Where?
      why: Hindbrain.
  lesson:
    - teach: The brain is protected by the skull, three meninges (dura, arachnoid, pia mater) and cerebrospinal fluid. The forebrain includes the cerebrum (two hemispheres linked by the corpus callosum), thalamus and hypothalamus.
      check:
        prompt: 'The innermost meninx, touching the brain, is the:'
        options:
        - pia mater
        - dura mater
        - arachnoid
        answer: pia mater
        why: Pia is soft and thin, right on the brain.
    - teach: The cerebrum handles thinking, memory, senses and voluntary movement. The hypothalamus controls temperature, hunger, thirst and many hormones. The limbic system handles emotions. The midbrain has the corpora quadrigemina.
      check:
        prompt: 'Memory and reasoning are mainly functions of the:'
        options:
        - cerebrum
        - medulla
        - cerebellum
        answer: cerebrum
        why: Association areas of the cortex.
    - teach: 'Hindbrain: pons, cerebellum (balance and coordination) and medulla (breathing, heartbeat, swallowing, vomiting). A reflex is a fast automatic response: receptor → sensory neuron → spinal cord → motor neuron → effector (knee-jerk).'
      picture:
        kind: flow
        steps:
        - Receptor
        - Sensory (afferent) neuron
        - Spinal cord
        - Motor (efferent) neuron
        - Effector muscle
        alt: The path of a reflex arc.
      check:
        prompt: 'The knee-jerk reflex is processed in the:'
        options:
        - spinal cord
        - cerebrum
        - cerebellum
        answer: spinal cord
        why: No brain decision is needed.
  items:
  - prompt: 'Balance and coordination of movements are controlled by the:'
    options:
    - cerebellum
    - cerebrum
    - medulla
    - hypothalamus
    answer: cerebellum
    difficulty: 1
    hints:
    - Little brain.
    - Hindbrain.
    solution: The cerebellum.
    mistakes:
      cerebrum: c11b_brain
  - prompt: 'Breathing and heartbeat are controlled by the:'
    options:
    - medulla oblongata
    - cerebrum
    - cerebellum
    - thalamus
    answer: medulla oblongata
    difficulty: 1
    hints:
    - Automatic.
    - Brain stem.
    solution: The medulla.
    mistakes: {"cerebrum": "b11_medulla_oblongata", "cerebellum": "b11_medulla_oblongata", "thalamus": "b11_medulla_oblongata"}
  - prompt: 'Body temperature, hunger and thirst are regulated by the:'
    options:
    - hypothalamus
    - cerebellum
    - pons
    - corpus callosum
    answer: hypothalamus
    difficulty: 2
    hints:
    - Below the thalamus.
    - Thermostat.
    solution: The hypothalamus.
    mistakes: {"cerebellum": "b11_hypothalamus", "pons": "b11_hypothalamus", "corpus callosum": "b11_hypothalamus"}
  - prompt: 'The two cerebral hemispheres are joined by the:'
    options:
    - corpus callosum
    - pons
    - medulla
    - spinal cord
    answer: corpus callosum
    difficulty: 2
    hints:
    - Nerve fibre bridge.
    - Big band.
    solution: The corpus callosum.
    mistakes: {"pons": "b11_corpus_callosum", "medulla": "b11_corpus_callosum", "spinal cord": "b11_corpus_callosum"}
  - prompt: 'In a reflex arc, the neuron carrying signals to the spinal cord is:'
    options:
    - sensory (afferent)
    - motor (efferent)
    - relay only
    - autonomic
    answer: sensory (afferent)
    difficulty: 2
    hints:
    - Toward the CNS.
    - Afferent = arriving.
    solution: The sensory (afferent) neuron.
    mistakes: {"motor (efferent)": "b11_afferent", "relay only": "b11_afferent", "autonomic": "b11_afferent"}
  - prompt: How many meninges (protective layers) cover the brain?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Dura, arachnoid, pia.
    - Count.
    solution: Three.
    mistakes: {"2": "b11_meninges", "4": "b11_meninges"}
  - prompt: 'The outer grey layer of the cerebrum is the:'
    options:
    - cerebral cortex
    - corpus callosum
    - medulla
    answer: cerebral cortex
    difficulty: 1
    hints:
    - It is folded into ridges.
    - It holds cell bodies.
    solution: 'Step 1: outer grey matter. Step 2: cerebral cortex.'
    mistakes:
      corpus callosum: c11b18_brain
      medulla: c11b18_brain
  - prompt: 'Coughing, sneezing and vomiting are controlled by the:'
    options:
    - medulla oblongata
    - cerebellum
    - thalamus
    answer: medulla oblongata
    difficulty: 1
    hints:
    - It controls many automatic actions.
    - It joins the spinal cord.
    solution: 'Step 1: reflex centres. Step 2: medulla.'
    mistakes:
      cerebellum: c11b18_brain
      thalamus: c11b18_brain
  - prompt: A person who has had too much alcohol walks unsteadily. Which part is affected most?
    options:
    - cerebellum
    - medulla
    - hypothalamus
    answer: cerebellum
    difficulty: 1
    hints:
    - It keeps balance.
    - It coordinates movement.
    solution: 'Step 1: balance lost. Step 2: cerebellum.'
    mistakes:
      medulla: c11b18_brain
      hypothalamus: c11b18_brain
  - prompt: 'The brain stem is made of:'
    options:
    - midbrain, pons and medulla
    - cerebrum and cerebellum
    - thalamus and hypothalamus
    answer: midbrain, pons and medulla
    difficulty: 2
    hints:
    - It connects the brain to the spinal cord.
    - Three parts.
    solution: 'Step 1: lower brain parts. Step 2: midbrain, pons, medulla.'
    mistakes:
      cerebrum and cerebellum: c11b18_brain
      thalamus and hypothalamus: c11b18_brain
  - prompt: 'Corpora quadrigemina, involved in visual and hearing reflexes, are in the:'
    options:
    - midbrain
    - forebrain
    - hindbrain
    answer: midbrain
    difficulty: 2
    hints:
    - Four rounded bumps.
    - Between forebrain and hindbrain.
    solution: 'Step 1: four lobes on the midbrain roof. Step 2: midbrain.'
    mistakes:
      forebrain: c11b18_brain
      hindbrain: c11b18_brain
  - prompt: 'The neuron that carries signals from the spinal cord to a muscle is:'
    options:
    - motor (efferent)
    - sensory (afferent)
    - relay only
    answer: motor (efferent)
    difficulty: 2
    hints:
    - Efferent means carrying away.
    - It ends at an effector.
    solution: 'Step 1: CNS to muscle. Step 2: motor neuron.'
    mistakes:
      sensory (afferent): c11b18_brain
      relay only: c11b18_brain
  - prompt: Which part relays sensory signals to the cerebrum?
    options:
    - thalamus
    - pons
    - cerebellum
    answer: thalamus
    difficulty: 2
    hints:
    - It is a major relay station.
    - It sits above the hypothalamus.
    solution: 'Step 1: sensory relay. Step 2: thalamus.'
    mistakes:
      pons: c11b18_brain
      cerebellum: c11b18_brain
  - prompt: 'Damage to the corpus callosum would mainly affect:'
    options:
    - communication between the two hemispheres
    - breathing
    - balance
    answer: communication between the two hemispheres
    difficulty: 3
    hints:
    - It is a thick band of fibres.
    - It joins left and right cerebrum.
    solution: 'Step 1: it links the hemispheres. Step 2: they would not share information well.'
    mistakes:
      breathing: c11b18_brain
      balance: c11b18_brain
  - prompt: Why is a reflex faster than a voluntary action?
    options:
    - the signal goes through the spinal cord without waiting for the brain
    - reflex nerves are longer
    - muscles move on their own
    answer: the signal goes through the spinal cord without waiting for the brain
    difficulty: 3
    hints:
    - Fewer steps, shorter path.
    - No thinking is needed.
    solution: 'Step 1: short reflex arc. Step 2: quicker response.'
    mistakes:
      reflex nerves are longer: c11b18_brain
      muscles move on their own: c11b18_brain
