# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse11-bio
chapter: 12
title: Respiration in Plants
tips:
  c11b_atp: Aerobic respiration yields about 38 ATP per glucose (36 in eukaryotes in some books); fermentation only 2.
  c11b_rq: 'Respiratory quotient RQ = CO₂ released ÷ O₂ used: 1 for carbohydrates, about 0.7 for fats.'
concepts:
- code: cbse11b.resp.glycolysis
  title: Glycolysis and fermentation
  notes: |
    Respiration: breakdown of food (C–C bonds) to release energy as ATP. Plants have no special respiratory organs; gas
    exchange by stomata and lenticels. Glycolysis (EMP pathway) in cytoplasm: glucose → 2 pyruvate; net 2 ATP + 2 NADH.
    Fate of pyruvate: anaerobic—lactic acid fermentation (muscles, bacteria) or alcoholic fermentation (yeast: ethanol +
    CO₂); aerobic—into mitochondria. Fermentation gives only 2 ATP per glucose; yeast poisons itself above about 13% alcohol.
  explanations:
    text: Respiration releases energy from food. It starts with glycolysis in the cytoplasm, which splits glucose into two pyruvate molecules and makes a little ATP. Without oxygen, pyruvate is turned into alcohol (in yeast) or lactic acid (in muscles).
    visual: 'Draw glucose (6 carbons) splitting into two pyruvates (3 carbons each). Then two roads: with oxygen to mitochondria; without oxygen to alcohol or lactic acid.'
    step_by_step: 'Step 1: Glycolysis: glucose → 2 pyruvate, net 2 ATP. Step 2: Is oxygen present? Step 3: No → fermentation. Yes → Krebs cycle and electron transport.'
    real_world: Idli and dosa batter rises overnight because yeast and bacteria ferment it, releasing carbon dioxide.
  picture:
    kind: flow
    steps:
    - Glucose (6C)
    - Glycolysis in cytoplasm
    - 2 pyruvate (3C)
    - 'No O₂: fermentation'
    - 'With O₂: mitochondria'
    alt: Glycolysis splits glucose into two pyruvates, which go to fermentation without oxygen or to mitochondria with oxygen.
  activity:
    type: sort
    prompt: Is it part of glycolysis, alcoholic fermentation or lactic acid fermentation?
    bins:
    - Glycolysis
    - Alcoholic fermentation
    - Lactic acid fermentation
    items:
    - label: Glucose is split into 2 pyruvate
      bin: Glycolysis
      clue: Which stage breaks glucose in two?
      why: Glycolysis splits glucose into two pyruvic acid molecules.
    - label: Net gain of 2 ATP per glucose
      bin: Glycolysis
      clue: Which stage makes a little ATP from glucose without O₂?
      why: 'Glycolysis makes 4 ATP but uses 2: a net gain of 2.'
    - label: Hexokinase adds phosphate to glucose
      bin: Glycolysis
      clue: This is the first step of which pathway?
      why: The first step of glycolysis.
    - label: NAD⁺ is turned into NADH
      bin: Glycolysis
      clue: Which stage makes NADH as triose is oxidised?
      why: Glycolysis makes 2 NADH; fermentation uses them up.
    - label: Pyruvate → ethanol + CO₂
      bin: Alcoholic fermentation
      clue: Which product makes bread rise?
      why: Yeast turns pyruvate into ethanol and CO₂.
    - label: Yeast making dough rise
      bin: Alcoholic fermentation
      clue: Which gas makes the bubbles?
      why: CO₂ from alcoholic fermentation.
    - label: Toddy made from palm sap
      bin: Alcoholic fermentation
      clue: Which product makes it a drink?
      why: Yeast turns sugar into alcohol.
    - label: Muscles in a sprint, short of O₂
      bin: Lactic acid fermentation
      clue: What builds up in tired muscles?
      why: Muscle cells turn pyruvate into lactic acid.
    - label: Curd from milk
      bin: Lactic acid fermentation
      clue: Which acid sours milk?
      why: Lactobacillus makes lactic acid.
    - label: Pyruvate → lactic acid, no CO₂
      bin: Lactic acid fermentation
      clue: Is any CO₂ given off?
      why: Lactic acid fermentation releases no CO₂.
  items:
  - prompt: How many pyruvate molecules does one glucose give in glycolysis?
    answer: '2'
    check: 6/3
    difficulty: 1
    hints:
    - 6C → 2 × 3C.
    - Two.
    solution: '2.'
  - prompt: What is the net gain of ATP per glucose in glycolysis?
    answer: '2'
    check: 4-2
    difficulty: 1
    hints:
    - 4 made, 2 used.
    - Net.
    solution: 2 ATP.
  - prompt: 'Glycolysis takes place in the:'
    options:
    - cytoplasm
    - mitochondrial matrix
    - chloroplast
    - nucleus
    answer: cytoplasm
    difficulty: 1
    hints:
    - Before mitochondria.
    - All cells.
    solution: Cytoplasm.
  - prompt: 'Yeast ferments sugar into:'
    options:
    - ethanol and CO₂
    - lactic acid
    - water and CO₂
    - oxygen
    answer: ethanol and CO₂
    difficulty: 1
    hints:
    - Alcoholic fermentation.
    - Bread rises.
    solution: Ethanol and carbon dioxide.
  - prompt: 'Tired muscles in hard exercise make:'
    options:
    - lactic acid
    - ethanol
    - methane
    - citric acid
    answer: lactic acid
    difficulty: 2
    hints:
    - Not enough oxygen.
    - Cramps.
    solution: Lactic acid.
  - prompt: 'Plants exchange gases for respiration mainly through:'
    options:
    - stomata and lenticels
    - lungs
    - gills
    - roots only
    answer: stomata and lenticels
    difficulty: 2
    hints:
    - No special organs.
    - Pores.
    solution: Stomata and lenticels.
- code: cbse11b.resp.aerobic
  title: Krebs cycle, electron transport and RQ
  after:
  - cbse11b.resp.glycolysis
  notes: |
    Link reaction: pyruvate → acetyl CoA + CO₂ + NADH (pyruvate dehydrogenase) in matrix. Krebs (TCA/citric acid) cycle:
    acetyl CoA + OAA → citrate; per turn 3 NADH, 1 FADH₂, 1 GTP/ATP, 2 CO₂; two turns per glucose. Electron transport
    system in inner mitochondrial membrane (complexes I–IV, cytochrome c oxidase); oxygen the final electron acceptor,
    forming water. Oxidative phosphorylation via ATP synthase (F₀–F₁). Each NADH ≈ 3 ATP, FADH₂ ≈ 2 ATP. Net about 38 ATP
    per glucose (theoretical). Amphibolic pathway (respiration links breakdown and building). RQ: carbohydrates 1, fats
    about 0.7, proteins about 0.9.
  explanations:
    text: With oxygen, pyruvate enters the mitochondrion and is fully broken down in the Krebs cycle, releasing CO₂. The electrons collected pass along a chain to oxygen, making lots of ATP. Altogether one glucose yields about 38 ATP, compared with 2 from fermentation.
    visual: 'Draw a mitochondrion: the Krebs cycle turning in the matrix, and the electron transport chain along the folded inner membrane, with ATP synthase like a turbine.'
    step_by_step: 'Step 1: Pyruvate → acetyl CoA. Step 2: Krebs cycle gives NADH, FADH₂, ATP, CO₂. Step 3: Electron transport turns NADH and FADH₂ into ATP. Step 4: Oxygen accepts electrons, forming water.'
    real_world: Cyanide is deadly because it blocks cytochrome c oxidase, stopping the electron transport chain.
  picture:
    kind: bars
    bars:
    - label: fermentation
      value: 2
    - label: aerobic
      value: 38
    alt: 'ATP per glucose: about 2 from fermentation and about 38 from aerobic respiration.'
    unit: ATP
  activity:
    type: formula
    prompt: Respiratory quotient RQ = CO₂ given out ÷ O₂ taken in. Carbohydrates give 1, fats about 0.7, organic acids above 1.
    inputs:
    - name: c
      label: CO₂ molecules given out
      min: 1
      max: 150
      step: 1
      start: 10
    - name: o
      label: O₂ molecules taken in
      min: 1
      max: 150
      step: 1
      start: 20
    outputs:
    - name: rq
      label: RQ
      expr: c/o
      places: 2
    goals:
    - prompt: 'Tripalmitin, a fat: 2 C₅₁H₉₈O₆ + 145 O₂ → 102 CO₂ + 98 H₂O. Set the gases.'
      want:
        c: 102
        o: 145
      mistakes:
      - when:
          c: 145
          o: 102
        say: 'Upside down: RQ = CO₂ given out ÷ O₂ taken in. Fats need lots of O₂, so their RQ is below 1.'
      - when:
          c: 98
        say: '98 is the water. Count the CO₂: 102.'
    - prompt: 'Malic acid: C₄H₆O₅ + 3 O₂ → 4 CO₂ + 3 H₂O. Set the gases.'
      want:
        c: 4
        o: 3
      mistakes:
      - when:
          c: 3
          o: 4
        say: 'Upside down again: CO₂ goes on top. Organic acids already hold lots of oxygen, so their RQ is above 1.'
    - prompt: Using 7 CO₂, choose O₂ so the RQ is about 0.7, like a fat.
      want:
        c: 7
        rq:
        - 0.69
        - 0.71
      mistakes:
      - when:
          c: 7
          o: 5
        say: '7 ÷ 5 = 1.4: that''s like an organic acid. Fats use more O₂ than the CO₂ they give.'
      - when:
          c: 7
          o: 7
        say: That's RQ 1, like a carbohydrate.
  items:
  - prompt: How many CO₂ molecules are released per turn of the Krebs cycle?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Two decarboxylations.
    - Acetyl group has 2 C.
    solution: '2.'
  - prompt: How many turns of the Krebs cycle happen per glucose?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Two acetyl CoA.
    - Two pyruvate.
    solution: '2.'
  - prompt: About how many ATP does aerobic respiration yield per glucose (theoretical)?
    answer: '38'
    check: '38'
    difficulty: 1
    hints:
    - 2 + 2 + 34.
    - Book value.
    solution: About 38.
    mistakes:
      '2': c11b_atp
  - prompt: 'Find the RQ for glucose: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O.'
    answer: '1'
    check: 6/6
    difficulty: 2
    hints:
    - CO₂ ÷ O₂.
    - 6/6.
    solution: RQ = 1.
    mistakes:
      '0.7': c11b_rq
  - prompt: 'The final electron acceptor in aerobic respiration is:'
    options:
    - oxygen
    - NAD⁺
    - pyruvate
    - water
    answer: oxygen
    difficulty: 1
    hints:
    - Forms water.
    - End of the chain.
    solution: Oxygen.
  - prompt: 'Respiration is called amphibolic because it:'
    options:
    - involves both breakdown and building
    - only breaks down food
    - only builds molecules
    - needs light
    answer: involves both breakdown and building
    difficulty: 2
    hints:
    - Intermediates used for synthesis.
    - Both ways.
    solution: It links catabolism and anabolism.
