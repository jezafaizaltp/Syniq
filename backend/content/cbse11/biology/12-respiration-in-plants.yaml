# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse11-bio
chapter: 12
title: Respiration in Plants
tips:
  c11b_atp: "Fermentation gives only 2 ATP per glucose. Full aerobic respiration gives many times more: add up glycolysis, Krebs and the electron transport chain in your textbook's table."
  c11b_rq: "RQ = CO₂ released ÷ O₂ used. Read the two numbers from the balanced equation and divide."
  b11_amphibolic: "'Amphi' means both. Respiration breaks down food and supplies building blocks too."
  b11_final_acceptor: "At the end of the electron transport chain, electrons combine with the gas we breathe in, forming water."
  b11_glycolysis_atp: "Glycolysis makes 4 ATP but spends some at the start. Subtract what is spent from what is made."
  b11_glycolysis_site: "Glycolysis needs no organelle and happens even in bacteria."
  b11_krebs_co2: "Each turn takes in acetyl CoA, a 2-carbon unit. All its carbons leave as CO₂. How many?"
  b11_krebs_turns: "One glucose gives two pyruvates, so two acetyl CoA."
  b11_lactic: "Sore muscles after a sprint; yogurt has the same acid."
  b11_plant_gas: "Plants have no lungs or gills. Leaves have pores and bark has openings."
  b11_pyruvate: "Glucose has 6 carbons; pyruvate has 3."
  b11_yeast: "Yeast makes bread rise and is used in brewing. What gas and alcohol does it make?"
  c11b12_gly: Glycolysis happens in the cytoplasm, without oxygen, and splits one glucose into two pyruvate.
  c11b12_krebs: Count per pyruvate, then double for one glucose. NADH ≈ 3 ATP, FADH₂ ≈ 2 ATP.
  c11b12_rq: RQ = CO₂ given out ÷ O₂ taken in. Count the molecules in the balanced equation.
concepts:
- code: cbse11b.resp.glycolysis
  title: Glycolysis and fermentation
  notes: |
    Respiration: breakdown of food (C–C bonds) to release energy as ATP. Plants have no special respiratory organs; gas
    exchange by stomata and lenticels. Glycolysis (EMP pathway) in cytoplasm: glucose → 2 pyruvate; net 2 ATP + 2 NADH.
    Fate of pyruvate: anaerobic—lactic acid fermentation (muscles, bacteria) or alcoholic fermentation (yeast: ethanol +
    CO₂); aerobic—into mitochondria. Fermentation gives only 2 ATP per glucose; yeast poisons itself above about 13% alcohol.
  explanations:
    text: Respiration releases energy from food. It starts with glycolysis in the cytoplasm, which splits glucose into two pyruvate molecules and makes a little ATP. Without oxygen, pyruvate is turned into alcohol (in yeast) or lactic acid (in muscles).
    visual: 'Draw glucose (6 carbons) splitting into two pyruvates (3 carbons each). Then two roads: with oxygen to mitochondria; without oxygen to alcohol or lactic acid.'
    step_by_step: 'Step 1: Glycolysis: glucose → 2 pyruvate, net 2 ATP. Step 2: Is oxygen present? Step 3: No → fermentation. Yes → Krebs cycle and electron transport.'
    real_world: Idli and dosa batter rises overnight because yeast and bacteria ferment it, releasing carbon dioxide.
  picture:
    kind: flow
    steps:
    - Glucose (6C)
    - Glycolysis in cytoplasm
    - 2 pyruvate (3C)
    - 'No O₂: fermentation'
    - 'With O₂: mitochondria'
    alt: Glycolysis splits glucose into two pyruvates, which go to fermentation without oxygen or to mitochondria with oxygen.
  activity:
    type: sort
    prompt: Is it part of glycolysis, alcoholic fermentation or lactic acid fermentation?
    bins:
    - Glycolysis
    - Alcoholic fermentation
    - Lactic acid fermentation
    items:
    - label: Glucose is split into 2 pyruvate
      bin: Glycolysis
      clue: Which stage breaks glucose in two?
      why: Glycolysis splits glucose into two pyruvic acid molecules.
    - label: Net gain of 2 ATP per glucose
      bin: Glycolysis
      clue: Which stage makes a little ATP from glucose without O₂?
      why: 'Glycolysis makes 4 ATP but uses 2: a net gain of 2.'
    - label: Hexokinase adds phosphate to glucose
      bin: Glycolysis
      clue: This is the first step of which pathway?
      why: The first step of glycolysis.
    - label: NAD⁺ is turned into NADH
      bin: Glycolysis
      clue: Which stage makes NADH as triose is oxidised?
      why: Glycolysis makes 2 NADH; fermentation uses them up.
    - label: Pyruvate → ethanol + CO₂
      bin: Alcoholic fermentation
      clue: Which product makes bread rise?
      why: Yeast turns pyruvate into ethanol and CO₂.
    - label: Yeast making dough rise
      bin: Alcoholic fermentation
      clue: Which gas makes the bubbles?
      why: CO₂ from alcoholic fermentation.
    - label: Toddy made from palm sap
      bin: Alcoholic fermentation
      clue: Which product makes it a drink?
      why: Yeast turns sugar into alcohol.
    - label: Muscles in a sprint, short of O₂
      bin: Lactic acid fermentation
      clue: What builds up in tired muscles?
      why: Muscle cells turn pyruvate into lactic acid.
    - label: Curd from milk
      bin: Lactic acid fermentation
      clue: Which acid sours milk?
      why: Lactobacillus makes lactic acid.
    - label: Pyruvate → lactic acid, no CO₂
      bin: Lactic acid fermentation
      clue: Is any CO₂ given off?
      why: Lactic acid fermentation releases no CO₂.
  lesson:
    - teach: 'Respiration breaks C–C bonds in food to release energy, which is trapped as ATP. Plants have no lungs: gases move in and out through stomata and lenticels, and every cell respires.'
      check:
        prompt: 'Energy from respiration is stored as:'
        options:
        - ATP
        - glucose
        - oxygen
        answer: ATP
        why: The cell's energy currency.
    - teach: 'Glycolysis (EMP pathway), in the cytoplasm: glucose (6C) → 2 pyruvate (3C), with a net gain of 2 ATP and 2 NADH. It needs no oxygen.'
      check:
        prompt: Glycolysis needs oxygen?
        options:
        - 'no'
        - 'yes'
        - only in plants
        answer: 'no'
        why: It runs in all organisms, even without O₂.
    - teach: 'Without oxygen, pyruvate is fermented: to lactic acid (muscles, some bacteria) or to ethanol + CO₂ (yeast). Fermentation gives only the 2 ATP from glycolysis; yeast dies when alcohol reaches about 13%.'
      picture:
        kind: flow
        steps:
        - Glucose
        - Glycolysis
        - 2 pyruvate
        - 'No O₂: ethanol or lactic acid'
        - 'With O₂: into mitochondria'
        alt: What happens to pyruvate with and without oxygen.
      check:
        prompt: 'Bread rises because yeast releases:'
        options:
        - CO₂
        - O₂
        - lactic acid
        answer: CO₂
        why: Alcoholic fermentation gives CO₂.
  items:
  - prompt: How many pyruvate molecules does one glucose give in glycolysis?
    answer: '2'
    check: 6/3
    difficulty: 1
    hints:
    - 6C → 2 × 3C.
    - Two.
    solution: '2.'
    mistakes: {"1": "b11_pyruvate", "3": "b11_pyruvate", "6": "b11_pyruvate"}
  - prompt: What is the net gain of ATP per glucose in glycolysis?
    answer: '2'
    check: 4-2
    difficulty: 1
    hints:
    - 4 made, 2 used.
    - Net.
    solution: 2 ATP.
    mistakes: {"4": "b11_glycolysis_atp", "36": "b11_glycolysis_atp", "38": "b11_glycolysis_atp"}
  - prompt: 'Glycolysis takes place in the:'
    options:
    - cytoplasm
    - mitochondrial matrix
    - chloroplast
    - nucleus
    answer: cytoplasm
    difficulty: 1
    hints:
    - Before mitochondria.
    - All cells.
    solution: Cytoplasm.
    mistakes: {"mitochondrial matrix": "b11_glycolysis_site", "chloroplast": "b11_glycolysis_site", "nucleus": "b11_glycolysis_site"}
  - prompt: 'Yeast ferments sugar into:'
    options:
    - ethanol and CO₂
    - lactic acid
    - water and CO₂
    - oxygen
    answer: ethanol and CO₂
    difficulty: 1
    hints:
    - Alcoholic fermentation.
    - Bread rises.
    solution: Ethanol and carbon dioxide.
    mistakes: {"lactic acid": "b11_yeast", "water and CO₂": "b11_yeast", "oxygen": "b11_yeast"}
  - prompt: 'Tired muscles in hard exercise make:'
    options:
    - lactic acid
    - ethanol
    - methane
    - citric acid
    answer: lactic acid
    difficulty: 2
    hints:
    - Not enough oxygen.
    - Cramps.
    solution: Lactic acid.
    mistakes: {"ethanol": "b11_lactic", "methane": "b11_lactic", "citric acid": "b11_lactic"}
  - prompt: 'Plants exchange gases for respiration mainly through:'
    options:
    - stomata and lenticels
    - lungs
    - gills
    - roots only
    answer: stomata and lenticels
    difficulty: 2
    hints:
    - No special organs.
    - Pores.
    solution: Stomata and lenticels.
    mistakes: {"lungs": "b11_plant_gas", "gills": "b11_plant_gas", "roots only": "b11_plant_gas"}
  - prompt: 'Glycolysis is also called the:'
    options:
    - EMP pathway
    - Krebs cycle
    - Calvin cycle
    answer: EMP pathway
    difficulty: 1
    hints:
    - Named after Embden, Meyerhof and Parnas.
    - Three initials.
    solution: 'Step 1: discoverers'' initials. Step 2: EMP pathway.'
    mistakes:
      Krebs cycle: c11b12_gly
      Calvin cycle: c11b12_gly
  - prompt: Pyruvate has how many carbon atoms?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Glucose (6C) splits in half.
    - 6 ÷ 2.
    solution: 'Step 1: one glucose → two pyruvate. Step 2: 3 carbons each.'
    mistakes:
      '6': c11b12_gly
      '2': c11b12_gly
  - prompt: 'Openings in woody stems for gas exchange are:'
    options:
    - lenticels
    - stomata
    - hydathodes
    answer: lenticels
    difficulty: 1
    hints:
    - They are in the bark.
    - Small raised pores.
    solution: 'Step 1: pores in bark. Step 2: lenticels.'
    mistakes:
      stomata: c11b12_gly
      hydathodes: c11b12_gly
  - prompt: How many NADH are made (net) in glycolysis per glucose?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - One per glyceraldehyde-3-phosphate oxidised.
    - Two of those form per glucose.
    solution: 'Step 1: 2 triose molecules oxidised. Step 2: 2 NADH.'
    mistakes:
      '4': c11b12_gly
      '1': c11b12_gly
  - prompt: Why do muscles feel tired and sore after hard exercise?
    options:
    - lactic acid builds up when oxygen runs short
    - too much oxygen
    - glucose turns to fat
    answer: lactic acid builds up when oxygen runs short
    difficulty: 2
    hints:
    - Breathing can't keep up.
    - Pyruvate is reduced without O₂.
    solution: 'Step 1: anaerobic in muscle. Step 2: lactic acid builds up.'
    mistakes:
      too much oxygen: c11b12_gly
      glucose turns to fat: c11b12_gly
  - prompt: How many ATP are used up in the early steps of glycolysis?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Glucose and fructose-6-phosphate are phosphorylated.
    - 4 are made, net gain is 2.
    solution: 'Step 1: 4 made − ? used = 2 net. Step 2: 2 used.'
    mistakes:
      '4': c11b12_gly
      '0': c11b12_gly
  - prompt: 'In alcoholic fermentation, pyruvate is first turned into acetaldehyde by:'
    options:
    - pyruvic acid decarboxylase
    - alcohol dehydrogenase
    - lactate dehydrogenase
    answer: pyruvic acid decarboxylase
    difficulty: 2
    hints:
    - CO₂ is removed in this step.
    - De-carboxyl-ase.
    solution: 'Step 1: removes CO₂. Step 2: pyruvic acid decarboxylase.'
    mistakes:
      alcohol dehydrogenase: c11b12_gly
      lactate dehydrogenase: c11b12_gly
  - prompt: Fermentation gives what fraction of the ATP of full aerobic respiration (2 out of 38)?
    answer: 1/19
    check: 2/38
    difficulty: 3
    hints:
    - 2 ÷ 38.
    - Simplify the fraction.
    solution: 'Step 1: 2/38. Step 2: 1/19.'
    mistakes:
      1/2: c11b12_gly
      '19': c11b12_gly
  - prompt: Why does yeast stop fermenting at about 13% alcohol?
    options:
    - the alcohol becomes toxic to the yeast
    - it runs out of CO₂
    - it needs oxygen
    answer: the alcohol becomes toxic to the yeast
    difficulty: 3
    hints:
    - Its own waste product builds up.
    - Too much kills the cells.
    solution: 'Step 1: ethanol accumulates. Step 2: it poisons the yeast.'
    mistakes:
      it runs out of CO₂: c11b12_gly
      it needs oxygen: c11b12_gly
- code: cbse11b.resp.aerobic
  title: Krebs cycle, electron transport and RQ
  after:
  - cbse11b.resp.glycolysis
  notes: |
    Link reaction: pyruvate → acetyl CoA + CO₂ + NADH (pyruvate dehydrogenase) in matrix. Krebs (TCA/citric acid) cycle:
    acetyl CoA + OAA → citrate; per turn 3 NADH, 1 FADH₂, 1 GTP/ATP, 2 CO₂; two turns per glucose. Electron transport
    system in inner mitochondrial membrane (complexes I–IV, cytochrome c oxidase); oxygen the final electron acceptor,
    forming water. Oxidative phosphorylation via ATP synthase (F₀–F₁). Each NADH ≈ 3 ATP, FADH₂ ≈ 2 ATP. Net about 38 ATP
    per glucose (theoretical). Amphibolic pathway (respiration links breakdown and building). RQ: carbohydrates 1, fats
    about 0.7, proteins about 0.9.
  explanations:
    text: With oxygen, pyruvate enters the mitochondrion and is fully broken down in the Krebs cycle, releasing CO₂. The electrons collected pass along a chain to oxygen, making lots of ATP. Altogether one glucose yields about 38 ATP, compared with 2 from fermentation.
    visual: 'Draw a mitochondrion: the Krebs cycle turning in the matrix, and the electron transport chain along the folded inner membrane, with ATP synthase like a turbine.'
    step_by_step: 'Step 1: Pyruvate → acetyl CoA. Step 2: Krebs cycle gives NADH, FADH₂, ATP, CO₂. Step 3: Electron transport turns NADH and FADH₂ into ATP. Step 4: Oxygen accepts electrons, forming water.'
    real_world: Cyanide is deadly because it blocks cytochrome c oxidase, stopping the electron transport chain.
  picture:
    kind: bars
    bars:
    - label: fermentation
      value: 2
    - label: aerobic
      value: 38
    alt: 'ATP per glucose: about 2 from fermentation and about 38 from aerobic respiration.'
    unit: ATP
  activity:
    type: formula
    prompt: Respiratory quotient RQ = CO₂ given out ÷ O₂ taken in. Carbohydrates give 1, fats about 0.7, organic acids above 1.
    inputs:
    - name: c
      label: CO₂ molecules given out
      min: 1
      max: 150
      step: 1
      start: 10
    - name: o
      label: O₂ molecules taken in
      min: 1
      max: 150
      step: 1
      start: 20
    outputs:
    - name: rq
      label: RQ
      expr: c/o
      places: 2
    goals:
    - prompt: 'Tripalmitin, a fat: 2 C₅₁H₉₈O₆ + 145 O₂ → 102 CO₂ + 98 H₂O. Set the gases.'
      want:
        c: 102
        o: 145
      mistakes:
      - when:
          c: 145
          o: 102
        say: 'Upside down: RQ = CO₂ given out ÷ O₂ taken in. Fats need lots of O₂, so their RQ is below 1.'
      - when:
          c: 98
        say: '98 is the water. Count the CO₂: 102.'
    - prompt: 'Malic acid: C₄H₆O₅ + 3 O₂ → 4 CO₂ + 3 H₂O. Set the gases.'
      want:
        c: 4
        o: 3
      mistakes:
      - when:
          c: 3
          o: 4
        say: 'Upside down again: CO₂ goes on top. Organic acids already hold lots of oxygen, so their RQ is above 1.'
    - prompt: Using 7 CO₂, choose O₂ so the RQ is about 0.7, like a fat.
      want:
        c: 7
        rq:
        - 0.69
        - 0.71
      mistakes:
      - when:
          c: 7
          o: 5
        say: '7 ÷ 5 = 1.4: that''s like an organic acid. Fats use more O₂ than the CO₂ they give.'
      - when:
          c: 7
          o: 7
        say: That's RQ 1, like a carbohydrate.
  lesson:
    - teach: With oxygen, pyruvate enters the mitochondrion. The link reaction turns it into acetyl CoA, releasing CO₂ and making NADH. Acetyl CoA joins OAA to form citrate and starts the Krebs (citric acid) cycle.
      check:
        prompt: 'The Krebs cycle takes place in the:'
        options:
        - mitochondrial matrix
        - cytoplasm
        - chloroplast
        answer: mitochondrial matrix
        why: Inside the mitochondrion.
    - teach: Each Krebs turn gives 3 NADH, 1 FADH₂, 1 ATP (GTP) and 2 CO₂; two turns per glucose. The electron transport chain on the inner membrane passes electrons to O₂, the final acceptor, making water; ATP synthase uses the proton flow to make ATP.
      check:
        prompt: 'Water in aerobic respiration forms when electrons reach:'
        options:
        - oxygen
        - NAD⁺
        - pyruvate
        answer: oxygen
        why: O₂ is the final electron acceptor.
    - teach: 'About 38 ATP per glucose (theoretical). Respiration is amphibolic: it breaks down food and also supplies building blocks. RQ = CO₂ out ÷ O₂ in: carbohydrates 1, fats about 0.7, proteins about 0.9.'
      picture:
        kind: compare
        columns:
        - title: Food respired
          points:
          - carbohydrate
          - protein
          - fat
        - title: RQ
          points:
          - '1'
          - about 0.9
          - about 0.7
        alt: Respiratory quotients of different foods.
      check:
        prompt: 'An RQ below 1 suggests the food is:'
        options:
        - fat
        - carbohydrate
        - organic acid
        answer: fat
        why: Fats need more O₂ than CO₂ released.
  items:
  - prompt: How many CO₂ molecules are released per turn of the Krebs cycle?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Two decarboxylations.
    - Acetyl group has 2 C.
    solution: '2.'
    mistakes: {"3": "b11_krebs_co2", "1": "b11_krebs_co2", "6": "b11_krebs_co2"}
  - prompt: How many turns of the Krebs cycle happen per glucose?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Two acetyl CoA.
    - Two pyruvate.
    solution: '2.'
    mistakes: {"1": "b11_krebs_turns", "4": "b11_krebs_turns"}
  - prompt: About how many ATP does aerobic respiration yield per glucose (theoretical)?
    answer: '38'
    check: '38'
    difficulty: 1
    hints:
    - 2 + 2 + 34.
    - Book value.
    solution: About 38.
    mistakes:
      '2': c11b_atp
  - prompt: 'Find the RQ for glucose: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O.'
    answer: '1'
    check: 6/6
    difficulty: 2
    hints:
    - CO₂ ÷ O₂.
    - 6/6.
    solution: RQ = 1.
    mistakes:
      '0.7': c11b_rq
  - prompt: 'The final electron acceptor in aerobic respiration is:'
    options:
    - oxygen
    - NAD⁺
    - pyruvate
    - water
    answer: oxygen
    difficulty: 1
    hints:
    - Forms water.
    - End of the chain.
    solution: Oxygen.
    mistakes: {"NAD⁺": "b11_final_acceptor", "pyruvate": "b11_final_acceptor", "water": "b11_final_acceptor"}
  - prompt: 'Respiration is called amphibolic because it:'
    options:
    - involves both breakdown and building
    - only breaks down food
    - only builds molecules
    - needs light
    answer: involves both breakdown and building
    difficulty: 2
    hints:
    - Intermediates used for synthesis.
    - Both ways.
    solution: It links catabolism and anabolism.
    mistakes: {"only breaks down food": "b11_amphibolic", "only builds molecules": "b11_amphibolic", "needs light": "b11_amphibolic"}
  - prompt: How many NADH does one Krebs turn make?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Isocitrate, α-ketoglutarate and malate steps.
    - One each.
    solution: 'Step 1: three dehydrogenation steps. Step 2: 3.'
    mistakes:
      '2': c11b12_krebs
      '1': c11b12_krebs
  - prompt: 'The Krebs cycle is also called the:'
    options:
    - citric acid cycle
    - Calvin cycle
    - urea cycle
    answer: citric acid cycle
    difficulty: 1
    hints:
    - Its first product is citrate.
    - Also called the TCA cycle.
    solution: 'Step 1: starts by forming citrate. Step 2: citric acid cycle.'
    mistakes:
      Calvin cycle: c11b12_krebs
      urea cycle: c11b12_krebs
  - prompt: Acetyl CoA has how many carbon atoms in its acetyl group?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Pyruvate (3C) loses one CO₂.
    - 3 − 1.
    solution: 'Step 1: decarboxylation removes 1 C. Step 2: 2.'
    mistakes:
      '3': c11b12_krebs
      '4': c11b12_krebs
  - prompt: How many CO₂ are released in total from one glucose in the link reaction and Krebs cycle?
    answer: '6'
    check: 2+4
    difficulty: 2
    hints:
    - 'Link reaction: 1 per pyruvate.'
    - 'Krebs: 2 per turn, 2 turns.'
    solution: 'Step 1: 2 + 4. Step 2: 6.'
    mistakes:
      '4': c11b12_krebs
      '2': c11b12_krebs
  - prompt: How many ATP are made from 2 NADH and 1 FADH₂ (NADH = 3, FADH₂ = 2)?
    answer: '8'
    check: 2*3+2
    difficulty: 2
    hints:
    - Multiply each by its value.
    - Add them.
    solution: 'Step 1: 6 + 2. Step 2: 8.'
    mistakes:
      '5': c11b12_krebs
      '11': c11b12_krebs
  - prompt: 'ATP synthase has two parts:'
    options:
    - F₀ (proton channel) and F₁ (head that makes ATP)
    - PS I and PS II
    - matrix and cristae
    answer: F₀ (proton channel) and F₁ (head that makes ATP)
    difficulty: 2
    hints:
    - One part sits in the membrane.
    - The other sticks into the matrix.
    solution: 'Step 1: F₀ lets protons through. Step 2: F₁ makes ATP.'
    mistakes:
      PS I and PS II: c11b12_krebs
      matrix and cristae: c11b12_krebs
  - prompt: 'Find the RQ for tripalmitin: 2C₅₁H₉₈O₆ + 145O₂ → 102CO₂ + 98H₂O (to 2 decimal places).'
    answer: '0.70'
    check: round(102/145,2)
    difficulty: 2
    hints:
    - RQ = CO₂ ÷ O₂.
    - 102 ÷ 145.
    solution: 'Step 1: 102/145 ≈ 0.703. Step 2: 0.70.'
    mistakes:
      '1.42': c11b12_rq
      '1': c11b12_rq
  - prompt: 'When oxygen is absent, the electron transport chain:'
    options:
    - stops, because there is no final electron acceptor
    - speeds up
    - uses CO₂ instead
    answer: stops, because there is no final electron acceptor
    difficulty: 3
    hints:
    - Electrons must go somewhere at the end.
    - Without O₂ the chain backs up.
    solution: 'Step 1: O₂ accepts the electrons. Step 2: no O₂, chain stops.'
    mistakes:
      speeds up: c11b12_krebs
      uses CO₂ instead: c11b12_krebs
  - prompt: 'Malic acid (C₄H₆O₅) respires: C₄H₆O₅ + 3O₂ → 4CO₂ + 3H₂O. Find its RQ (as a fraction).'
    answer: 4/3
    check: 4/3
    difficulty: 3
    hints:
    - Count CO₂ out and O₂ in.
    - 4 ÷ 3.
    solution: 'Step 1: 4 CO₂, 3 O₂. Step 2: 4/3.'
    mistakes:
      3/4: c11b12_rq
      '1': c11b12_rq
