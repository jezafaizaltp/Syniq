# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse11-bio
chapter: 1
title: The Living World
tips:
  c11b_taxa: "Say the ranks from broad to narrow with a memory sentence: King Philip Came Over For Good Soup. Which word sits between O and G?"
  c11b_binomial: In a scientific name the genus starts with a capital, the species epithet is lower case, and both are italic (or underlined when handwritten).
  b11_binomial: "Darwin gave evolution, Whittaker five kingdoms. The two-part Latin naming system came from an 18th-century Swedish botanist."
  b11_codes: "Read the letters: the B in the plant code stands for Botanical; Z is zoological, V viral."
  b11_division: "In plants, the rank just below kingdom has a different name from animals' phylum. It means 'a split'."
  b11_genus_species: "In a binomial name, the first word (capitalised) is the broader group; the second narrows it down."
  b11_herbarium: "A zoo and a museum keep animals. Dried, pressed plant sheets are stored in a place named after 'herb'."
  b11_key: "A key gives you two opposite choices at each step: 'leaves simple' or 'leaves compound'."
  b11_metabolism: "Growth and mass gain also happen in crystals and mountains. Which feature is found only in living things?"
  b11_mule: "Many living things cannot reproduce: mules, worker bees, sterile humans. So is reproduction a defining feature?"
  b11_rank_share: "The lower the rank, the closer the members. Which rank sits at the very bottom?"
  b11_ranks: "List them: kingdom, phylum, class, order, family, genus, species. Count."
concepts:
- code: cbse11b.living.features
  title: What is living? Diversity and naming
  notes: |
    Features of living organisms: growth, reproduction, metabolism, cellular organisation, response to stimuli
    (consciousness). Defining features: metabolism, cellular organisation, consciousness (growth and reproduction are not
    defining alone: crystals grow, mules don't reproduce). Biodiversity: about 1.7–1.8 million species described.
    Nomenclature: ICBN (plants), ICZN (animals); binomial nomenclature by Linnaeus: genus + specific epithet, e.g.
    Mangifera indica, Homo sapiens; italics; author's name abbreviated after (Linn.).
  explanations:
    text: Living things grow, reproduce, use energy (metabolism) and respond to their surroundings. Because there are millions of kinds, scientists give each a two-part Latin name, like Homo sapiens for humans, so everyone means the same organism.
    visual: 'Write Mangifera indica: the first word (capital) is the genus, the second (small letter) is the species. Both are in italics.'
    step_by_step: 'Step 1: Check for metabolism and cellular organisation. Step 2: For naming, write genus with a capital letter. Step 3: Species epithet in small letters. Step 4: Italicise or underline both.'
    real_world: The common name 'jungle crow' might mean different birds in different places; the scientific name Corvus macrorhynchos means exactly one species everywhere.
  picture:
    kind: compare
    columns:
    - title: Common name
      points:
      - mango
      - human
      - housefly
    - title: Scientific name
      points:
      - Mangifera indica
      - Homo sapiens
      - Musca domestica
    alt: 'Common names and their binomial scientific names: mango, human and housefly.'
  activity:
    type: sort
    prompt: Which features belong only to living things, and which can non-living things show too?
    bins:
    - Only living things
    - Non-living things too
    items:
    - label: 'Metabolism: chemical reactions in the body'
      bin: Only living things
      clue: Does a crystal or a stone carry out chemical reactions inside cells?
      why: 'Metabolism is a defining feature: no non-living object does it. Even outside the body, these reactions are not ''alive''.'
    - label: Cellular organisation
      bin: Only living things
      clue: Is anything non-living built from cells?
      why: Every living thing is made of cells; nothing non-living is.
    - label: Sensing and responding to surroundings
      bin: Only living things
      clue: Do plants respond to light? Does a stone?
      why: All living things sense their surroundings (consciousness, in NCERT's words), so this defines life.
    - label: Growth
      bin: Non-living things too
      clue: Can a crystal or a mountain get bigger?
      why: Crystals and mountains grow by adding material from outside, so growth alone doesn't prove life.
    - label: Reproduction
      bin: Non-living things too
      clue: Can a mule or a worker bee reproduce? Are they alive?
      why: Mules and worker bees can't reproduce but are alive, so reproduction isn't a defining feature.
    - label: Increase in mass
      bin: Non-living things too
      clue: Does a sand dune gain mass?
      why: Non-living things gain mass by accumulation, so mass gain alone doesn't define life.
    - label: Responding to light, as a plant bends toward it
      bin: Only living things
      clue: Which defining feature does this show?
      why: 'Bending toward light is a plant sensing its surroundings and responding: a sign of life.'
  items:
  - prompt: Which is a defining feature of living organisms?
    options:
    - metabolism
    - growth
    - increase in mass
    - movement
    answer: metabolism
    difficulty: 2
    hints:
    - Crystals grow too.
    - Chemical reactions in cells.
    solution: Metabolism is a defining property; growth alone isn't.
    mistakes: {"growth": "b11_metabolism", "increase in mass": "b11_metabolism", "movement": "b11_metabolism"}
  - prompt: Who introduced binomial nomenclature?
    options:
    - Carolus Linnaeus
    - Charles Darwin
    - Ernst Mayr
    - R.H. Whittaker
    answer: Carolus Linnaeus
    difficulty: 1
    hints:
    - Swedish botanist.
    - Two-part names.
    solution: Linnaeus.
    mistakes: {"Charles Darwin": "b11_binomial", "Ernst Mayr": "b11_binomial", "R.H. Whittaker": "b11_binomial"}
  - prompt: 'In Mangifera indica, ''Mangifera'' is the:'
    options:
    - genus
    - species
    - family
    - order
    answer: genus
    difficulty: 1
    hints:
    - First word.
    - Capital letter.
    solution: The genus.
    mistakes: {"species": "b11_genus_species", "family": "b11_genus_species", "order": "b11_genus_species"}
  - prompt: Which is written correctly?
    options:
    - Homo sapiens (in italics)
    - homo Sapiens
    - Homo Sapiens
    - HOMO SAPIENS
    answer: Homo sapiens (in italics)
    difficulty: 2
    hints:
    - Genus capital, species small.
    - Italics.
    solution: Homo sapiens, in italics.
    mistakes:
      Homo Sapiens: c11b_binomial
  - prompt: Why is a mule's inability to reproduce not proof that it is non-living?
    options:
    - reproduction is not a defining feature of life
    - mules are non-living
    - mules grow
    - mules respond to light
    answer: reproduction is not a defining feature of life
    difficulty: 2
    hints:
    - Many living things can't reproduce.
    - Worker bees too.
    solution: Reproduction isn't a defining property.
    mistakes: {"mules are non-living": "b11_mule", "mules grow": "b11_mule", "mules respond to light": "b11_mule"}
  - prompt: Plant names follow which code?
    options:
    - ICBN
    - ICZN
    - ICVN
    - ICNB
    answer: ICBN
    difficulty: 2
    hints:
    - B for botanical.
    - Z for zoological.
    solution: International Code for Botanical Nomenclature.
    mistakes: {"ICZN": "b11_codes", "ICVN": "b11_codes", "ICNB": "b11_codes"}
- code: cbse11b.living.taxonomy
  title: Taxonomic categories and aids
  after:
  - cbse11b.living.features
  notes: |
    Taxonomy: characterisation, identification, nomenclature, classification. Systematics includes evolutionary
    relationships. Taxonomic categories (hierarchy): kingdom → phylum (division in plants) → class → order → family →
    genus → species. Species: a group of individuals with fundamental similarities, able to interbreed. Each rank is a
    taxon. Example: mango—Plantae, Angiospermae, Dicotyledonae, Sapindales, Anacardiaceae, Mangifera, indica. Taxonomic
    aids: herbarium, botanical gardens, museums, zoological parks, keys (couplets of contrasting characters).
  explanations:
    text: Biologists sort organisms into nested groups, from the biggest (kingdom) to the smallest (species). Each step down, the members share more features. Herbariums, museums, zoos and identification keys help scientists study and identify organisms.
    visual: 'Draw a funnel: Kingdom at the wide top, then Phylum, Class, Order, Family, Genus, and Species at the narrow bottom.'
    step_by_step: 'Step 1: List the ranks in order. Step 2: The lower the rank, the more features members share. Step 3: Use a key: answer one pair of choices at a time until you reach a name.'
    real_world: The herbarium at the Botanical Survey of India in Kolkata holds over a million dried, labelled plant specimens.
  picture:
    kind: flow
    steps:
    - Kingdom
    - Phylum / Division
    - Class
    - Order
    - Family
    - Genus
    - Species
    alt: The taxonomic hierarchy from kingdom down to species.
  activity:
    type: order
    prompt: Put the taxonomic categories in order, broadest first.
    steps:
    - Kingdom
    - Phylum (or Division in plants)
    - Class
    - Order
    - Family
    - Genus
    - Species
    reasons:
      Phylum (or Division in plants): 'A kingdom is split into phyla: each phylum holds fewer kinds of organism than its kingdom.'
      Class: Several classes make up one phylum, so a class is narrower than a phylum.
      Order: An order groups related families; several orders make up a class.
      Family: A family groups related genera; several families make an order.
      Genus: A genus groups closely related species; several genera make a family.
      Species: 'The species is the most specific category: the basic unit, named after the genus (as in Mangifera indica).'
  items:
  - prompt: How many main taxonomic ranks are there from kingdom to species?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - K P C O F G S.
    - Count.
    solution: Seven.
    mistakes: {"5": "b11_ranks", "8": "b11_ranks", "6": "b11_ranks"}
  - prompt: Which rank comes between order and genus?
    options:
    - family
    - class
    - phylum
    - species
    answer: family
    difficulty: 1
    hints:
    - O, F, G.
    - Order, ..., genus.
    solution: Family.
    mistakes:
      class: c11b_taxa
  - prompt: Members of which rank share the most characters?
    options:
    - species
    - genus
    - family
    - kingdom
    answer: species
    difficulty: 2
    hints:
    - Lowest rank.
    - Can interbreed.
    solution: Species.
    mistakes: {"genus": "b11_rank_share", "family": "b11_rank_share", "kingdom": "b11_rank_share"}
  - prompt: 'A store of dried, pressed and labelled plant specimens is a:'
    options:
    - herbarium
    - botanical garden
    - museum of animals
    - zoo
    answer: herbarium
    difficulty: 1
    hints:
    - Sheets of dried plants.
    - Labelled.
    solution: A herbarium.
    mistakes: {"botanical garden": "b11_herbarium", "museum of animals": "b11_herbarium", "zoo": "b11_herbarium"}
  - prompt: 'A taxonomic key is based on:'
    options:
    - pairs of contrasting characters
    - colour only
    - the size of the organism
    - where it lives
    answer: pairs of contrasting characters
    difficulty: 2
    hints:
    - Couplets.
    - Lead and choose.
    solution: Contrasting pairs of characters (couplets).
    mistakes: {"colour only": "b11_key", "the size of the organism": "b11_key", "where it lives": "b11_key"}
  - prompt: 'In plants, the rank equivalent to phylum is:'
    options:
    - division
    - order
    - class
    - family
    answer: division
    difficulty: 2
    hints:
    - Botanical term.
    - Same level.
    solution: Division.
    mistakes: {"order": "b11_division", "class": "b11_division", "family": "b11_division"}
