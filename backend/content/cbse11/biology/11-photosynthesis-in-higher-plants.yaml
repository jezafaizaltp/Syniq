# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse11-bio
chapter: 11
title: Photosynthesis in Higher Plants
tips:
  c11b_light: Light reaction (in thylakoids) makes ATP, NADPH and O₂; the Calvin cycle (in the stroma) uses them to fix CO₂.
  c11b_c4: C₃ plants make a 3-carbon first product (PGA); C₄ plants make a 4-carbon one (OAA) and avoid photorespiration.
concepts:
- code: cbse11b.ps.light
  title: Pigments and the light reaction
  notes: |
    Early experiments: Priestley (plants restore air), Ingenhousz (sunlight needed), Sachs (starch), Engelmann (action
    spectrum with algae and bacteria), van Niel (O₂ comes from water). Site: chloroplast; grana (thylakoids) for light
    reaction, stroma for dark reaction. Pigments: chlorophyll a (main), chlorophyll b, xanthophylls, carotenoids
    (accessory, protect). Absorption peaks in blue and red. Light reaction: photosystems PS I (P700) and PS II (P680);
    photolysis of water (2H₂O → 4H⁺ + O₂ + 4e⁻) at PS II; Z-scheme non-cyclic photophosphorylation makes ATP + NADPH;
    cyclic (PS I only) makes ATP. Chemiosmosis: proton gradient across thylakoid drives ATP synthase.
  explanations:
    text: Photosynthesis happens in chloroplasts. In the light reaction, chlorophyll traps light energy, water is split (releasing oxygen), and the energy is stored as ATP and NADPH. These then power the making of sugar.
    visual: 'Draw the Z-scheme: electrons from water climb up at PS II, roll down a chain making ATP, climb again at PS I, and end up in NADPH.'
    step_by_step: 'Step 1: Light is absorbed by PS II and PS I. Step 2: Water is split; O₂ is released. Step 3: Electrons flow, making ATP (chemiosmosis). Step 4: NADP⁺ is reduced to NADPH.'
    real_world: All the oxygen we breathe comes from water split during the light reaction.
  picture:
    kind: flow
    steps:
    - Light hits PS II
    - Water split, O₂ released
    - Electron transport makes ATP
    - Light hits PS I
    - NADPH formed
    alt: 'The light reaction: PS II splits water, electron flow makes ATP, PS I makes NADPH.'
  items:
  - prompt: 'The oxygen released in photosynthesis comes from:'
    options:
    - water
    - carbon dioxide
    - glucose
    - chlorophyll
    answer: water
    difficulty: 1
    hints:
    - van Niel; isotope studies.
    - Photolysis.
    solution: Water.
  - prompt: 'The reaction centre of PS II is:'
    options:
    - P680
    - P700
    - P650
    - P800
    answer: P680
    difficulty: 2
    hints:
    - PS I is P700.
    - Absorbs at 680 nm.
    solution: P680.
  - prompt: 'The light reaction takes place in the:'
    options:
    - thylakoid membranes
    - stroma
    - cytoplasm
    - mitochondria
    answer: thylakoid membranes
    difficulty: 1
    hints:
    - Grana.
    - Pigments there.
    solution: Thylakoids.
    mistakes:
      stroma: c11b_light
  - prompt: 'Cyclic photophosphorylation produces:'
    options:
    - ATP only
    - ATP and NADPH
    - NADPH only
    - oxygen
    answer: ATP only
    difficulty: 2
    hints:
    - Only PS I.
    - Electrons come back.
    solution: ATP only.
  - prompt: How many molecules of water are split to release one molecule of O₂?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 2H₂O → 4H⁺ + O₂ + 4e⁻.
    - Two.
    solution: '2.'
  - prompt: Chlorophyll absorbs light mainly in which regions?
    options:
    - blue and red
    - green and yellow
    - green only
    - infrared
    answer: blue and red
    difficulty: 1
    hints:
    - Green is reflected.
    - Peaks.
    solution: Blue and red.
- code: cbse11b.ps.calvin
  title: Calvin cycle, C₄ pathway and photorespiration
  after:
  - cbse11b.ps.light
  notes: |
    Biosynthetic phase in stroma. Calvin cycle (C₃): carboxylation of RuBP by RuBisCO → 2 PGA (3-carbon); reduction to
    glyceraldehyde-3-phosphate using ATP and NADPH; regeneration of RuBP. For one glucose: 6 turns, 18 ATP, 12 NADPH. C₄
    pathway (Hatch–Slack; maize, sugarcane): PEP carboxylase in mesophyll fixes CO₂ into OAA (4-carbon); Kranz anatomy
    (bundle sheath cells) where CO₂ is released for the Calvin cycle; no photorespiration. Photorespiration in C₃ plants:
    RuBisCO binds O₂, wastes energy. Factors: light, CO₂, temperature, water; Blackman's law of limiting factors.
  explanations:
    text: In the Calvin cycle, the plant uses ATP and NADPH from the light reaction to turn carbon dioxide into sugar. The enzyme RuBisCO grabs the CO₂. Some tropical plants, like maize, use an extra C₄ step to concentrate CO₂ and waste less energy.
    visual: 'Draw the Calvin cycle as a wheel: CO₂ joins RuBP, makes PGA, which is reduced to sugar, and some is used to rebuild RuBP so the wheel keeps turning.'
    step_by_step: 'Step 1: Carboxylation (CO₂ + RuBP → PGA). Step 2: Reduction (uses ATP, NADPH). Step 3: Regeneration of RuBP. Step 4: For C₄, check for Kranz anatomy and a 4-carbon first product.'
    real_world: Sugarcane and maize are C₄ plants, which is why they grow so fast in hot, sunny Indian fields.
  picture:
    kind: flow
    steps:
    - 'Carboxylation: CO₂ + RuBP'
    - PGA (3-carbon)
    - Reduction with ATP + NADPH
    - Sugar made
    - RuBP regenerated
    alt: 'The Calvin cycle: carboxylation, reduction and regeneration.'
  items:
  - prompt: How many turns of the Calvin cycle make one glucose molecule?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - One CO₂ per turn.
    - Glucose has 6 C.
    solution: '6.'
  - prompt: How many ATP molecules are used to make one glucose in the Calvin cycle?
    answer: '18'
    check: 3*6
    difficulty: 2
    hints:
    - 3 ATP per CO₂.
    - 3 × 6.
    solution: '18.'
  - prompt: How many NADPH are used to make one glucose in the Calvin cycle?
    answer: '12'
    check: 2*6
    difficulty: 2
    hints:
    - 2 NADPH per CO₂.
    - 2 × 6.
    solution: '12.'
  - prompt: 'The first stable product in C₄ plants is:'
    options:
    - oxaloacetic acid (4-carbon)
    - PGA (3-carbon)
    - glucose
    - RuBP
    answer: oxaloacetic acid (4-carbon)
    difficulty: 2
    hints:
    - Hence 'C₄'.
    - PEP carboxylase.
    solution: Oxaloacetic acid.
    mistakes:
      PGA (3-carbon): c11b_c4
  - prompt: 'Kranz anatomy is found in:'
    options:
    - C₄ plants
    - C₃ plants
    - CAM plants only
    - algae
    answer: C₄ plants
    difficulty: 2
    hints:
    - Wreath of bundle sheath cells.
    - Maize.
    solution: C₄ plants.
  - prompt: 'Photorespiration happens because RuBisCO can also bind:'
    options:
    - oxygen
    - nitrogen
    - water
    - glucose
    answer: oxygen
    difficulty: 2
    hints:
    - Oxygenase activity.
    - Wastes energy.
    solution: Oxygen.
