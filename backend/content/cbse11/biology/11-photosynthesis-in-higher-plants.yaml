# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse11-bio
chapter: 11
title: Photosynthesis in Higher Plants
tips:
  pqc11b11_low_co2: "When CO₂ inside the leaf runs low, RuBisCO starts binding O₂ instead. Which wasteful process does that set off?"
  c11b_light: Light reaction (in thylakoids) makes ATP, NADPH and O₂; the Calvin cycle (in the stroma) uses them to fix CO₂.
  c11b_c4: C₃ plants make a 3-carbon first product (PGA); C₄ plants make a 4-carbon one (OAA) and avoid photorespiration.
  b11_absorb: "Leaves look green because green light is reflected, not absorbed."
  b11_calvin_atp: "Each turn uses 3 ATP. How many turns per glucose?"
  b11_calvin_nadph: "Each turn uses 2 NADPH. How many turns per glucose?"
  b11_calvin_turns: "Each turn fixes one CO₂. Glucose has six carbons."
  b11_cyclic: "In cyclic flow, electrons return to PS I and never reach NADP⁺. Water is not split either."
  b11_kranz: "Kranz (wreath) anatomy has bundle-sheath cells ringed by mesophyll: a feature of maize and sugarcane."
  b11_o2_source: "Isotope experiments with heavy oxygen showed the O₂ comes from the molecule split by light."
  b11_p680: "PS II's reaction centre absorbs at a shorter wavelength than PS I's P700."
  b11_photoresp: "Photorespiration rises on hot days when stomata close and CO₂ inside the leaf falls. Which gas then builds up and competes?"
  b11_water_split: "Write the balanced equation for splitting water into O₂, H⁺ and electrons. How many H₂O give one O₂?"
  c11b11_light: "Ask where the reaction happens and what goes in and comes out there. Sugar is made later, in the stroma."
  c11b11_calvin: Count per CO₂ first (3 ATP, 2 NADPH, 1 turn), then multiply by 6 for one glucose.
concepts:
- code: cbse11b.ps.light
  title: Pigments and the light reaction
  notes: |
    Early experiments: Priestley (plants restore air), Ingenhousz (sunlight needed), Sachs (starch), Engelmann (action
    spectrum with algae and bacteria), van Niel (O₂ comes from water). Site: chloroplast; grana (thylakoids) for light
    reaction, stroma for dark reaction. Pigments: chlorophyll a (main), chlorophyll b, xanthophylls, carotenoids
    (accessory, protect). Absorption peaks in blue and red. Light reaction: photosystems PS I (P700) and PS II (P680);
    photolysis of water (2H₂O → 4H⁺ + O₂ + 4e⁻) at PS II; Z-scheme non-cyclic photophosphorylation makes ATP + NADPH;
    cyclic (PS I only) makes ATP. Chemiosmosis: proton gradient across thylakoid drives ATP synthase.
  explanations:
    text: Photosynthesis happens in chloroplasts. In the light reaction, chlorophyll traps light energy, water is split (releasing oxygen), and the energy is stored as ATP and NADPH. These then power the making of sugar.
    visual: 'Draw the Z-scheme: electrons from water climb up at PS II, roll down a chain making ATP, climb again at PS I, and end up in NADPH.'
    step_by_step: 'Step 1: Light is absorbed by PS II and PS I. Step 2: Water is split; O₂ is released. Step 3: Electrons flow, making ATP (chemiosmosis). Step 4: NADP⁺ is reduced to NADPH.'
    real_world: All the oxygen we breathe comes from water split during the light reaction.
  picture:
    kind: flow
    steps:
    - Light hits PS II
    - Water split, O₂ released
    - Electron transport makes ATP
    - Light hits PS I
    - NADPH formed
    alt: 'The light reaction: PS II splits water, electron flow makes ATP, PS I makes NADPH.'
  activity:
    type: sort
    prompt: Does it happen in the light reaction or the Calvin cycle?
    bins:
    - Light reaction (thylakoids)
    - Calvin cycle (stroma)
    items:
    - label: Water is split
      bin: Light reaction (thylakoids)
      clue: Which stage needs electrons from water?
      why: Photolysis of water near photosystem II gives electrons for the light reaction.
    - label: O₂ is released
      bin: Light reaction (thylakoids)
      clue: Where does the oxygen come from?
      why: O₂ comes from splitting water, in the light reaction.
    - label: ATP is made by photophosphorylation
      bin: Light reaction (thylakoids)
      clue: Which stage uses light energy to make ATP?
      why: The light reaction makes ATP through chemiosmosis.
    - label: NADPH is made
      bin: Light reaction (thylakoids)
      clue: Where do electrons reduce NADP⁺?
      why: At the end of the electron transport chain in the thylakoids.
    - label: Photosystem II absorbs light at 680 nm
      bin: Light reaction (thylakoids)
      clue: Do the pigments catch light here?
      why: P680 is the reaction centre of photosystem II.
    - label: CO₂ is fixed by RuBisCO
      bin: Calvin cycle (stroma)
      clue: Which stage takes in CO₂?
      why: 'Carboxylation: RuBP + CO₂ → 3-PGA.'
    - label: 3-PGA is reduced to a triose sugar
      bin: Calvin cycle (stroma)
      clue: Which stage spends ATP and NADPH to build sugar?
      why: Reduction uses the light reaction's ATP and NADPH.
    - label: RuBP is regenerated
      bin: Calvin cycle (stroma)
      clue: Which stage keeps the CO₂ acceptor coming back?
      why: Regeneration keeps the Calvin cycle turning.
    - label: Glucose is built
      bin: Calvin cycle (stroma)
      clue: Which stage makes sugar?
      why: Six turns make one glucose.
  lesson:
    - teach: 'Key experiments: Priestley (a plant restores air for a candle), Ingenhousz (only in sunlight, only green parts), Engelmann (blue and red light work best), van Niel (O₂ comes from water, not CO₂).'
      check:
        prompt: Who showed that plants restore air only in sunlight?
        options:
        - Ingenhousz
        - Priestley
        - van Niel
        answer: Ingenhousz
        why: He tested light versus dark.
      ways:
      - style: visual
        teach: Four early experiments and what each one showed.
        picture:
          kind: flow
          steps:
          - 'Priestley: a mint plant restores air for a candle'
          - 'Ingenhousz: only in light, only green parts'
          - 'Sachs: green parts make starch'
          - 'Engelmann: blue and red light work best'
          - 'van Niel: oxygen comes from water'
          alt: Priestley showed plants restore air, Ingenhousz showed light and green parts are needed, Sachs found starch made in green parts, Engelmann found blue and red light work best, and van Niel showed oxygen comes from water.
      - style: real_world
        teach: 'Aquarium shops put water plants like Hydrilla in fish tanks. In bright light you can see tiny bubbles rising from the leaves: that is oxygen from photosynthesis, which helps the fish breathe.'
    - teach: 'Photosynthesis happens in chloroplasts: light reactions on thylakoid membranes (grana) and sugar-making in the stroma. Chlorophyll a is the main pigment; chlorophyll b, carotenoids and xanthophylls are accessory pigments that widen the light range and protect it.'
      check:
        prompt: 'The main photosynthetic pigment is:'
        options:
        - chlorophyll a
        - chlorophyll b
        - carotene
        answer: chlorophyll a
        why: It forms the reaction centres.
      ways:
      - style: visual
        teach: Where the two stages of photosynthesis happen in a chloroplast.
        picture:
          kind: compare
          columns:
          - title: Thylakoid membranes (grana)
            points:
            - light is trapped
            - water split, O₂ released
            - ATP and NADPH made
          - title: Stroma
            points:
            - no light needed directly
            - CO₂ fixed
            - sugars made using ATP and NADPH
          alt: Light reactions on the thylakoid membranes split water and make ATP and NADPH; in the stroma these are used to fix CO2 into sugar.
      - style: step_by_step
        teach: 'Step 1: Accessory pigments (chlorophyll b, carotenoids) catch light the main pigment misses. Step 2: They pass the energy inwards. Step 3: It reaches chlorophyll a at the reaction centre. Step 4: Only the reaction centre gives away an excited electron.'
    - teach: 'Two photosystems: PS II (P680) splits water, releasing O₂, H⁺ and electrons; electrons pass to PS I (P700) and then to NADP⁺ (the Z-scheme), making NADPH. A proton gradient across the thylakoid drives ATP synthase (chemiosmosis). Cyclic flow (PS I only) makes ATP but no NADPH.'
      picture:
        kind: flow
        steps:
        - Water split at PS II
        - Electrons to PS I
        - NADP⁺ → NADPH
        - H⁺ gradient → ATP
        alt: Non-cyclic electron flow in the light reaction.
      check:
        prompt: 'The reaction centre of PS I is:'
        options:
        - P700
        - P680
        - P600
        answer: P700
        why: It absorbs best at 700 nm.
      ways:
      - style: step_by_step
        teach: 'Step 1: In non-cyclic flow, electrons go from water through PS II and PS I to NADP⁺: ATP, NADPH and O₂ are made. Step 2: In cyclic flow, only PS I works and electrons come back to it. Step 3: So cyclic flow makes ATP but no NADPH and no O₂.'
      - style: real_world
        teach: In autumn in cold countries, leaves turn yellow and orange. The green chlorophyll breaks down first, uncovering carotenoids that were there all along, helping catch light and shielding chlorophyll from too much light.
  items:
  - prompt: 'The oxygen released in photosynthesis comes from:'
    options:
    - water
    - carbon dioxide
    - glucose
    - chlorophyll
    answer: water
    difficulty: 1
    hints:
    - van Niel; isotope studies.
    - Photolysis.
    solution: Water.
    mistakes: {"carbon dioxide": "b11_o2_source", "glucose": "b11_o2_source", "chlorophyll": "b11_o2_source"}
  - prompt: 'The reaction centre of PS II is:'
    options:
    - P680
    - P700
    - P650
    - P800
    answer: P680
    difficulty: 2
    hints:
    - PS I is P700.
    - Absorbs at 680 nm.
    solution: P680.
    mistakes: {"P700": "b11_p680", "P650": "b11_p680", "P800": "b11_p680"}
  - prompt: 'The light reaction takes place in the:'
    options:
    - thylakoid membranes
    - stroma
    - cytoplasm
    - mitochondria
    answer: thylakoid membranes
    difficulty: 1
    hints:
    - Grana.
    - Pigments there.
    solution: Thylakoids.
    mistakes:
      stroma: c11b_light
  - prompt: 'Cyclic photophosphorylation produces:'
    options:
    - ATP only
    - ATP and NADPH
    - NADPH only
    - oxygen
    answer: ATP only
    difficulty: 2
    hints:
    - Only PS I.
    - Electrons come back.
    solution: ATP only.
    mistakes: {"ATP and NADPH": "b11_cyclic", "NADPH only": "b11_cyclic", "oxygen": "b11_cyclic"}
  - prompt: How many molecules of water are split to release one molecule of O₂?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 2H₂O → 4H⁺ + O₂ + 4e⁻.
    - Two.
    solution: '2.'
    mistakes: {"1": "b11_water_split", "4": "b11_water_split"}
  - prompt: Chlorophyll absorbs light mainly in which regions?
    options:
    - blue and red
    - green and yellow
    - green only
    - infrared
    answer: blue and red
    difficulty: 1
    hints:
    - Green is reflected.
    - Peaks.
    solution: Blue and red.
    mistakes: {"green and yellow": "b11_absorb", "green only": "b11_absorb", "infrared": "b11_absorb"}
  - prompt: Who showed starch forms in green parts of a plant during photosynthesis?
    options:
    - Julius von Sachs
    - Joseph Priestley
    - Engelmann
    answer: Julius von Sachs
    difficulty: 1
    hints:
    - He worked in 1854.
    - He tested leaves for starch.
    solution: 'Step 1: starch in green parts. Step 2: Sachs.'
    mistakes:
      Joseph Priestley: c11b11_light
      Engelmann: c11b11_light
  - prompt: 'Stacks of thylakoids are called:'
    options:
    - grana
    - stroma
    - cristae
    answer: grana
    difficulty: 1
    hints:
    - They look like piles of coins.
    - Stroma is the fluid around them.
    solution: 'Step 1: thylakoid stacks. Step 2: grana.'
    mistakes:
      stroma: c11b11_light
      cristae: c11b11_light
  - prompt: 'The products of the light reaction are:'
    options:
    - ATP, NADPH and O₂
    - glucose only
    - CO₂ and water
    answer: ATP, NADPH and O₂
    difficulty: 1
    hints:
    - Sugar is made later in the stroma.
    - Oxygen is a by-product.
    solution: 'Step 1: energy carriers and O₂. Step 2: ATP, NADPH, O₂.'
    mistakes:
      glucose only: c11b11_light
      CO₂ and water: c11b11_light
  - prompt: 'Carotenoids help the plant by:'
    options:
    - absorbing extra wavelengths and protecting chlorophyll
    - fixing CO₂
    - splitting water
    answer: absorbing extra wavelengths and protecting chlorophyll
    difficulty: 2
    hints:
    - They are accessory pigments.
    - They also shield against strong light.
    solution: 'Step 1: widen absorbed light. Step 2: protect from photo-oxidation.'
    mistakes:
      fixing CO₂: c11b11_light
      splitting water: c11b11_light
  - prompt: Water splitting is linked to which photosystem?
    options:
    - PS II
    - PS I
    - both equally
    answer: PS II
    difficulty: 2
    hints:
    - It needs to refill lost electrons.
    - Its reaction centre is P680.
    solution: 'Step 1: PS II loses electrons first. Step 2: water replaces them.'
    mistakes:
      PS I: c11b11_light
      both equally: c11b11_light
  - prompt: 'In chemiosmosis, protons build up:'
    options:
    - inside the thylakoid lumen
    - in the stroma
    - outside the chloroplast
    answer: inside the thylakoid lumen
    difficulty: 2
    hints:
    - Water splitting releases H⁺ inside.
    - Protons flow out through ATP synthase.
    solution: 'Step 1: H⁺ gathers in the lumen. Step 2: outflow makes ATP.'
    mistakes:
      in the stroma: c11b11_light
      outside the chloroplast: c11b11_light
  - prompt: 'Engelmann used bacteria and Cladophora to show:'
    options:
    - blue and red light give the most photosynthesis
    - green light is best
    - light is not needed
    answer: blue and red light give the most photosynthesis
    difficulty: 2
    hints:
    - Bacteria gathered where O₂ was released.
    - That gave the first action spectrum.
    solution: 'Step 1: bacteria clustered at blue and red. Step 2: those colours work best.'
    mistakes:
      green light is best: c11b11_light
      light is not needed: c11b11_light
  - prompt: How many electrons are released when 2 water molecules are split?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - 2H₂O → 4H⁺ + O₂ + ? e⁻.
    - Charges must balance.
    solution: 'Step 1: 4 H⁺ formed. Step 2: 4 electrons.'
    mistakes:
      '2': c11b11_light
      '8': c11b11_light
  - prompt: 'Cyclic photophosphorylation happens mainly in the:'
    options:
    - stroma lamellae
    - grana
    - nucleus
    answer: stroma lamellae
    difficulty: 3
    hints:
    - Those membranes have PS I but not PS II.
    - No NADPH reductase there.
    solution: 'Step 1: PS I only. Step 2: stroma lamellae.'
    mistakes:
      grana: c11b11_light
      nucleus: c11b11_light
  - prompt: 'Assertion (A): The O₂ released in photosynthesis comes from water.

      Reason (R): Water is split near PS II, releasing O₂, protons and electrons.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Splitting water at PS II is the source of the O₂, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Cyclic photophosphorylation produces NADPH.

      Reason (R): In cyclic flow electrons return to PS I instead of reaching NADP⁺.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: no NADPH forms in cyclic flow. R is true and is the reason no NADPH forms.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A plant is given water containing heavy oxygen (¹⁸O) and normal CO₂. Where will the heavy oxygen show up?'
    options:
    - In the O₂ released
    - In the glucose made
    - Nowhere; it stays in the water
    answer: In the O₂ released
    hints:
    - Which molecule is split to give O₂?
    - Recall van Niel's idea.
    solution: The O₂ released comes from splitting water, so the labelled oxygen appears in the O₂ gas.
    mistakes:
      In the glucose made: b11_o2_source
      Nowhere; it stays in the water: c11b_light
    exam: case
    difficulty: 2
  - prompt: 'Situation: A herbicide blocks PS II. Which product of the light reaction will stop being made first?'
    options:
    - O₂ from water splitting
    - Glucose in the stroma only
    - Carotenoids
    answer: O₂ from water splitting
    hints:
    - Which photosystem is linked to water splitting?
    - What does water splitting release?
    solution: Water is split at PS II, so blocking it stops O₂ release and the electron flow to NADP⁺.
    mistakes:
      Glucose in the stroma only: c11b_light
      Carotenoids: b11_absorb
    exam: competency
    difficulty: 2
- code: cbse11b.ps.calvin
  title: Calvin cycle, C₄ pathway and photorespiration
  after:
  - cbse11b.ps.light
  notes: |
    Biosynthetic phase in stroma. Calvin cycle (C₃): carboxylation of RuBP by RuBisCO → 2 PGA (3-carbon); reduction to
    glyceraldehyde-3-phosphate using ATP and NADPH; regeneration of RuBP. For one glucose: 6 turns, 18 ATP, 12 NADPH. C₄
    pathway (Hatch–Slack; maize, sugarcane): PEP carboxylase in mesophyll fixes CO₂ into OAA (4-carbon); Kranz anatomy
    (bundle sheath cells) where CO₂ is released for the Calvin cycle; no photorespiration. Photorespiration in C₃ plants:
    RuBisCO binds O₂, wastes energy. Factors: light, CO₂, temperature, water; Blackman's law of limiting factors.
  explanations:
    text: In the Calvin cycle, the plant uses ATP and NADPH from the light reaction to turn carbon dioxide into sugar. The enzyme RuBisCO grabs the CO₂. Some tropical plants, like maize, use an extra C₄ step to concentrate CO₂ and waste less energy.
    visual: 'Draw the Calvin cycle as a wheel: CO₂ joins RuBP, makes PGA, which is reduced to sugar, and some is used to rebuild RuBP so the wheel keeps turning.'
    step_by_step: 'Step 1: Carboxylation (CO₂ + RuBP → PGA). Step 2: Reduction (uses ATP, NADPH). Step 3: Regeneration of RuBP. Step 4: For C₄, check for Kranz anatomy and a 4-carbon first product.'
    real_world: Sugarcane and maize are C₄ plants, which is why they grow so fast in hot, sunny Indian fields.
  picture:
    kind: flow
    steps:
    - 'Carboxylation: CO₂ + RuBP'
    - PGA (3-carbon)
    - Reduction with ATP + NADPH
    - Sugar made
    - RuBP regenerated
    alt: 'The Calvin cycle: carboxylation, reduction and regeneration.'
  activity:
    type: formula
    prompt: Each turn of the Calvin cycle fixes one CO₂ and uses 3 ATP and 2 NADPH. Glucose has 6 carbons.
    inputs:
    - name: t
      label: Turns of the cycle
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: co2
      label: CO₂ fixed
      expr: t
    - name: glu
      label: Glucose made
      expr: t/6
      places: 2
    - name: atp
      label: ATP used
      expr: 3*t
    - name: nadph
      label: NADPH used
      expr: 2*t
    goals:
    - prompt: Make one glucose.
      want:
        glu: 1
      mistakes:
      - when:
          t: 3
        say: '3 turns fix 3 carbons: half a glucose. Glucose has 6 carbons, one per turn.'
      - when:
          t: 2
        say: Each turn fixes one carbon. Glucose has 6.
    - prompt: Make 2 glucose. Read the ATP used.
      want:
        glu: 2
      mistakes:
      - when:
          t: 2
        say: 2 turns fix only 2 carbons. Two glucose need 12 carbons.
    - prompt: Use exactly 30 NADPH.
      want:
        nadph: 30
      mistakes:
      - when:
          atp: 30
        say: That's 30 ATP. Each turn uses 3 ATP but only 2 NADPH.
      - when:
          t: 30
        say: '30 turns use 60 NADPH: 2 per turn.'
  lesson:
    - teach: 'In the stroma, the Calvin cycle uses ATP and NADPH to turn CO₂ into sugar. Step 1: RuBisCO joins CO₂ to RuBP (5C), giving two 3-carbon PGA. Step 2: PGA is reduced. Step 3: RuBP is regenerated.'
      check:
        prompt: 'The first stable product in C₃ plants is:'
        options:
        - 3-phosphoglyceric acid (PGA)
        - oxaloacetic acid
        - glucose
        answer: 3-phosphoglyceric acid (PGA)
        why: A 3-carbon acid, hence C₃.
      ways:
      - style: visual
        teach: The three stages of the Calvin cycle in a loop.
        picture:
          kind: flow
          steps:
          - 'Carboxylation: CO₂ + RuBP → 2 PGA (RuBisCO)'
          - 'Reduction: PGA → sugar, using ATP and NADPH'
          - 'Regeneration: RuBP remade, using ATP'
          - Back to carboxylation
          alt: In carboxylation RuBisCO joins CO2 to RuBP giving PGA; in reduction PGA becomes sugar using ATP and NADPH; in regeneration RuBP is remade using ATP and the cycle repeats.
      - style: real_world
        teach: RuBisCO is slow, so leaves make huge amounts of it; it is the most common protein on Earth. A rice leaf has more RuBisCO than any other protein, all working to grab CO₂ from the air.
    - teach: 'Per CO₂: 3 ATP and 2 NADPH. One glucose needs 6 turns: 18 ATP and 12 NADPH. RuBisCO can also grab O₂ (photorespiration), wasting energy, especially when it is hot.'
      check:
        prompt: ATP needed per CO₂ fixed in the Calvin cycle?
        options:
        - '3'
        - '2'
        - '18'
        answer: '3'
        why: 18 ÷ 6.
      ways:
      - style: visual
        teach: C₃ and C₄ plants compared on the points exams ask about.
        picture:
          kind: compare
          columns:
          - title: C₃ plants
            points:
            - 'first product: PGA (3C)'
            - one cell type fixes CO₂
            - photorespiration high in heat
            - rice, wheat
          - title: C₄ plants
            points:
            - 'first product: OAA (4C)'
            - Kranz anatomy, two cell types
            - little photorespiration
            - maize, sugarcane
          alt: C3 plants make PGA first and lose more to photorespiration in heat; C4 plants make OAA first, have Kranz anatomy and little photorespiration.
      - style: step_by_step
        teach: 'Step 1: In hot, dry weather stomata close and CO₂ inside the leaf falls. Step 2: RuBisCO then grabs O₂ instead of CO₂. Step 3: This gives one PGA and a 2-carbon compound that is broken down, releasing CO₂. Step 4: No sugar or ATP is gained: photorespiration wastes energy.'
    - teach: C₄ plants (maize, sugarcane) first fix CO₂ with PEP carboxylase in mesophyll cells into a 4-carbon acid (OAA). It is carried to bundle-sheath cells (Kranz anatomy), where CO₂ is released for the Calvin cycle, so photorespiration is avoided.
      picture:
        kind: compare
        columns:
        - title: C₃
          points:
          - first product PGA
          - RuBisCO only
          - photorespiration
        - title: C₄
          points:
          - first product OAA
          - PEP case + RuBisCO
          - no photorespiration
        alt: C₃ and C₄ plants compared.
      check:
        prompt: 'The first CO₂ acceptor in C₄ plants is:'
        options:
        - PEP
        - RuBP
        - OAA
        answer: PEP
        why: PEP carboxylase fixes CO₂ onto it.
      ways:
      - style: step_by_step
        teach: 'Step 1: In mesophyll cells PEP carboxylase fixes CO₂ into a 4-carbon acid. Step 2: The acid moves into bundle-sheath cells. Step 3: It releases CO₂ there, so CO₂ around RuBisCO stays high. Step 4: High CO₂ keeps RuBisCO from grabbing O₂.'
      - style: real_world
        teach: In a hot Tamil Nadu summer, maize and sugarcane fields stay green and keep growing, while some C₃ crops slow down. The C₄ pump lets them fix carbon efficiently even when stomata are partly closed.
  items:
  - prompt: How many turns of the Calvin cycle make one glucose molecule?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - One CO₂ per turn.
    - Glucose has 6 C.
    solution: '6.'
    mistakes: {"1": "b11_calvin_turns", "3": "b11_calvin_turns", "12": "b11_calvin_turns"}
  - prompt: How many ATP molecules are used to make one glucose in the Calvin cycle?
    answer: '18'
    check: 3*6
    difficulty: 2
    hints:
