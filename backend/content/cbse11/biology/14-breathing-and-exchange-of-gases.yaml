# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 14. Format: content/README.md.
subject: cbse11-bio
chapter: 14
title: Breathing and Exchange of Gases
tips:
  c11b_volume: Vital capacity = tidal volume + IRV + ERV. Total lung capacity = vital capacity + residual volume.
  c11b_o2: "Nearly all oxygen travels bound to haemoglobin: check the textbook figure (it is close to 100%). Most CO₂ travels dissolved in plasma as an ion made with carbonic anhydrase."
  b11_alveoli: "Trachea, bronchi and larynx only conduct air. Exchange needs tiny thin-walled sacs."
  b11_breath_rate: "72 is the heart rate; breathing is much slower. Count your own breaths for 15 seconds and multiply by 4, then read which end of the range the question wants."
  b11_carbonic: "The enzyme is named after carbonic acid. Amylase, pepsin and lipase are digestive."
  b11_diaphragm: "Inspiration makes the chest bigger. A domed muscle that contracts pulls down and flattens."
  b11_emphysema: "Emphysema breaks down the walls of the tiny air sacs, reducing surface area."
  b11_medulla: "Automatic functions like breathing are run from the brain stem part just above the spinal cord."
  b11_minute_volume: "Total = tidal volume × number of breaths."
  b11_po2_diff: "Difference = larger − smaller."
  b11_tracheae: "Insects have a network of air tubes opening through spiracles."
  c11b14_vol: 'Lung volumes add up: vital capacity = TV + IRV + ERV; total lung capacity adds residual volume.'
  c11b14_gas: Gases move from high partial pressure to low. Follow pO₂ and pCO₂ from alveoli to blood to tissues.
concepts:
- code: cbse11b.breath.mechanism
  title: Respiratory organs and breathing
  notes: |
    Respiratory organs: body surface (sponges), skin (earthworm), tracheae (insects), gills (fish), lungs (land
    vertebrates). Human respiratory system: nostrils, pharynx, larynx (voice box), trachea, bronchi, bronchioles, alveoli;
    pleura. Steps: breathing, diffusion across alveoli, transport by blood, diffusion to tissues, cellular respiration.
    Inspiration: diaphragm and external intercostals contract, thoracic volume rises, pressure falls, air enters.
    Expiration: muscles relax (passive). Breathing rate 12–16 per minute. Volumes: tidal (about 500 mL), IRV, ERV, residual
    (1100–1200 mL); capacities: vital, total lung. Spirometer.
  explanations:
    text: Breathing moves air in and out of the lungs. When the diaphragm flattens and the ribs lift, the chest gets bigger, pressure inside drops, and air rushes in. Relaxing them pushes air out. In the alveoli, oxygen passes into the blood.
    visual: 'Draw the chest as a box with a flexible floor (the diaphragm). Pull the floor down: the box gets bigger and air flows in. Let it go: air flows out.'
    step_by_step: 'Step 1: Diaphragm contracts and flattens. Step 2: Ribs move up and out. Step 3: Lung volume rises, pressure falls. Step 4: Air flows in. Reverse for breathing out.'
    real_world: Doctors use a spirometer to test lung capacity in people with asthma.
  picture:
    kind: flow
    steps:
    - Nose
    - Pharynx
    - Larynx
    - Trachea
    - Bronchi
    - Bronchioles
    - Alveoli
    alt: The path of air from the nose to the alveoli.
  activity:
    type: order
    prompt: Put the steps of breathing in (inspiration) in order.
    steps:
    - The diaphragm and external intercostal muscles contract
    - The diaphragm flattens and the ribs and sternum lift
    - The volume of the chest cavity increases
    - Pressure in the lungs falls below the air outside
    - Air rushes in through the nose and trachea
    - The alveoli fill and gas exchange begins
    reasons:
      The diaphragm flattens and the ribs and sternum lift: 'The muscles have to contract first: their pull is what flattens the diaphragm and lifts the ribs.'
      The volume of the chest cavity increases: The chest only gets bigger once the diaphragm has moved down and the ribs out.
      Pressure in the lungs falls below the air outside: The pressure drops because the volume has increased (more space, same air).
      Air rushes in through the nose and trachea: 'Air moves only when there''s a pressure difference: from high outside to low inside.'
      The alveoli fill and gas exchange begins: Gas exchange needs fresh air to have reached the alveoli.
  lesson:
    - teach: 'Different animals breathe differently: skin (earthworm), tracheae (insects), gills (fish), lungs (reptiles, birds, mammals). In humans air passes nostrils → pharynx → larynx → trachea → bronchi → bronchioles → alveoli.'
      check:
        prompt: 'Earthworms breathe through their:'
        options:
        - moist skin
        - gills
        - lungs
        answer: moist skin
        why: Gases diffuse across the skin.
    - teach: 'Inspiration: the diaphragm and external intercostal muscles contract, the chest gets bigger, pressure inside falls and air rushes in. Expiration: they relax and air is pushed out.'
      check:
        prompt: 'Air enters the lungs because lung pressure becomes:'
        options:
        - lower than the air outside
        - higher than outside
        - equal to outside
        answer: lower than the air outside
        why: Air flows from high to low pressure.
    - teach: 'Volumes: tidal volume (about 500 mL per normal breath), IRV and ERV (extra in or out by force), residual volume (left after full exhalation, about 1100–1200 mL). Vital capacity = TV + IRV + ERV. A spirometer measures them.'
      picture:
        kind: compare
        columns:
        - title: Volume
          points:
          - tidal
          - IRV
          - ERV
          - residual
        - title: Typical (mL)
          points:
          - '500'
          - 2500–3000
          - 1000–1100
          - 1100–1200
        alt: Typical human lung volumes.
      check:
        prompt: 'Air left in the lungs after the strongest breath out is the:'
        options:
        - residual volume
        - tidal volume
        - vital capacity
        answer: residual volume
        why: It can never be breathed out.
  items:
  - prompt: A normal adult breathes about how many times per minute (lower value of the range 12–16)?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - Normal rate.
    - 12–16.
    solution: 12–16 times; lower value 12.
    mistakes: {"16": "b11_breath_rate", "72": "b11_breath_rate", "20": "b11_breath_rate"}
  - prompt: Tidal volume is 500 mL. How much air (in mL) is breathed in 12 breaths?
    answer: '6000'
    check: 500*12
    difficulty: 1
    hints:
    - 500 × 12.
    - Per minute.
    solution: 6,000 mL.
    mistakes: {"500": "b11_minute_volume", "512": "b11_minute_volume", "5000": "b11_minute_volume"}
  - prompt: Tidal volume 500 mL, IRV 3000 mL, ERV 1000 mL. Find the vital capacity (in mL).
    answer: '4500'
    check: 500+3000+1000
    difficulty: 2
    hints:
    - TV + IRV + ERV.
    - Add.
    solution: 4,500 mL.
    mistakes:
      '5700': c11b_volume
  - prompt: 'Gas exchange in the lungs takes place in the:'
    options:
    - alveoli
    - trachea
    - bronchi
    - larynx
    answer: alveoli
    difficulty: 1
    hints:
    - Tiny air sacs.
    - Thin walls.
    solution: Alveoli.
    mistakes: {"trachea": "b11_alveoli", "bronchi": "b11_alveoli", "larynx": "b11_alveoli"}
  - prompt: 'During inspiration, the diaphragm:'
    options:
    - contracts and flattens
    - relaxes and domes up
    - stays still
    - moves sideways
    answer: contracts and flattens
    difficulty: 2
    hints:
    - Volume increases.
    - Pulls down.
    solution: It contracts and flattens.
    mistakes: {"relaxes and domes up": "b11_diaphragm", "stays still": "b11_diaphragm", "moves sideways": "b11_diaphragm"}
  - prompt: 'Insects breathe through:'
    options:
    - tracheae
    - lungs
    - gills
    - skin only
    answer: tracheae
    difficulty: 2
    hints:
    - Tubes with spiracles.
    - Air tubes.
    solution: Tracheal tubes.
    mistakes: {"lungs": "b11_tracheae", "gills": "b11_tracheae", "skin only": "b11_tracheae"}
  - prompt: Tidal volume 500 mL, breathing rate 15 per minute. Find the air breathed per minute (mL).
    answer: '7500'
    check: 500*15
    difficulty: 1
    hints:
    - Multiply volume by rate.
    - 500 × 15.
    solution: 'Step 1: 500 × 15. Step 2: 7500 mL.'
    mistakes:
      '515': c11b14_vol
      '33': c11b14_vol
  - prompt: 'The voice box is the:'
    options:
    - larynx
    - pharynx
    - trachea
    answer: larynx
    difficulty: 1
    hints:
    - It contains vocal cords.
    - Its cartilage forms the Adam's apple.
    solution: 'Step 1: sound box. Step 2: larynx.'
    mistakes:
      pharynx: c11b14_vol
      trachea: c11b14_vol
  - prompt: 'The lungs are covered by a double membrane called the:'
    options:
    - pleura
    - pericardium
    - peritoneum
    answer: pleura
    difficulty: 1
    hints:
    - Fluid between its layers reduces friction.
    - Pericardium covers the heart.
    solution: 'Step 1: lung covering. Step 2: pleura.'
    mistakes:
      pericardium: c11b14_vol
      peritoneum: c11b14_vol
  - prompt: TV 500 mL, IRV 2500 mL, ERV 1000 mL, residual 1200 mL. Find total lung capacity (mL).
    answer: '5200'
    check: 500+2500+1000+1200
    difficulty: 2
    hints:
    - Total = vital capacity + residual.
    - Add all four.
    solution: 'Step 1: 4000 + 1200. Step 2: 5200 mL.'
    mistakes:
      '4000': c11b14_vol
      '4700': c11b14_vol
  - prompt: Find the expiratory capacity (TV + ERV) if TV = 500 mL and ERV = 1100 mL.
    answer: '1600'
    check: 500+1100
    difficulty: 2
    hints:
    - Add the two.
    - 500 + 1100.
    solution: 'Step 1: 500 + 1100. Step 2: 1600 mL.'
    mistakes:
      '600': c11b14_vol
      '2200': c11b14_vol
  - prompt: Which muscles help forced breathing out?
    options:
    - internal intercostals and abdominal muscles
    - external intercostals only
    - the diaphragm contracting
    answer: internal intercostals and abdominal muscles
    difficulty: 2
    hints:
    - Normal expiration is passive.
    - Forced expiration pulls ribs down and pushes the diaphragm up.
    solution: 'Step 1: extra muscles reduce chest volume. Step 2: internal intercostals and abdominals.'
    mistakes:
      external intercostals only: c11b14_vol
      the diaphragm contracting: c11b14_vol
  - prompt: 'Food does not enter the windpipe when we swallow because of the:'
    options:
    - epiglottis
    - glottis staying open
    - uvula only
    answer: epiglottis
    difficulty: 2
    hints:
    - It is a flap of cartilage.
    - It covers the glottis.
    solution: 'Step 1: flap closes the airway. Step 2: epiglottis.'
    mistakes:
      glottis staying open: c11b14_vol
      uvula only: c11b14_vol
  - prompt: Functional residual capacity = ERV + RV. Find it if ERV = 1000 mL and RV = 1200 mL.
    answer: '2200'
    check: 1000+1200
    difficulty: 3
    hints:
    - Add the two volumes.
    - Air left after a normal breath out.
    solution: 'Step 1: 1000 + 1200. Step 2: 2200 mL.'
    mistakes:
      '200': c11b14_vol
      '1700': c11b14_vol
  - prompt: Why can't all the air ever be breathed out of the lungs?
    options:
    - the alveoli would collapse; residual air keeps them open
    - the trachea is too narrow
    - the diaphragm cannot move
    answer: the alveoli would collapse; residual air keeps them open
    difficulty: 3
    hints:
    - Think of the residual volume.
    - Tiny sacs must stay inflated.
    solution: 'Step 1: residual volume remains. Step 2: keeps alveoli open.'
    mistakes:
      the trachea is too narrow: c11b14_vol
      the diaphragm cannot move: c11b14_vol
- code: cbse11b.breath.transport
  title: Gas transport and disorders
  after:
  - cbse11b.breath.mechanism
  notes: |
    Partial pressures: alveoli pO₂ 104 mm Hg, pCO₂ 40; deoxygenated blood pO₂ 40, pCO₂ 45; tissues pO₂ 40, pCO₂ 45.
    Diffusion membrane: alveolar wall, basement membrane, capillary wall. CO₂ is 20–25 times more soluble than O₂.
    Transport of O₂: about 97% as oxyhaemoglobin, 3% dissolved; oxygen dissociation curve (sigmoid); high pCO₂, H⁺,
    temperature shift it right. Transport of CO₂: about 20–25% as carbaminohaemoglobin, 70% as bicarbonate (carbonic
    anhydrase), 7% dissolved. Regulation: respiratory rhythm centre in medulla, pneumotaxic centre in pons, chemosensitive
    area. Disorders: asthma, emphysema (alveolar walls damaged, smoking), occupational respiratory disorders (silicosis,
    asbestosis).
  explanations:
    text: Oxygen moves from the air sacs into the blood because there's more of it in the lungs, and red blood cells carry it as oxyhaemoglobin. Carbon dioxide travels back mostly as bicarbonate in the plasma. Smoking and dust can damage the lungs.
    visual: 'Draw two boxes, alveolus and blood, with oxygen pressure 104 in the alveolus and 40 in the blood: oxygen flows downhill into the blood. CO₂ flows the other way (45 to 40).'
    step_by_step: 'Step 1: Compare partial pressures. Step 2: Gas moves from high to low. Step 3: Name how it is carried (oxyhaemoglobin, bicarbonate).'
    real_world: Workers in stone quarries can get silicosis from breathing dust; masks and wet drilling protect them.
  picture:
    kind: bars
    bars:
    - label: as bicarbonate
      value: 70
    - label: bound to haemoglobin
      value: 23
    - label: dissolved
      value: 7
    alt: 'How carbon dioxide is carried in blood: about 70% as bicarbonate, 20–25% bound to haemoglobin and 7% dissolved.'
    unit: '%'
  activity:
    type: sort
    prompt: Is each fact about how oxygen or carbon dioxide is carried?
    bins:
    - Oxygen
    - Carbon dioxide
    items:
    - label: About 97% is carried by haemoglobin
      bin: Oxygen
      clue: Which gas rides almost entirely on haemoglobin?
      why: About 97% of O₂ travels as oxyhaemoglobin.
    - label: pO₂ is high in the alveoli, 104 mm Hg
      bin: Oxygen
      clue: 'pO₂ or pCO₂: which is written?'
      why: Alveolar air is rich in O₂, so O₂ moves into the blood.
    - label: Binds haemoglobin more when pH is high and temperature low
      bin: Oxygen
      clue: Which gas is loaded in the lungs, where pH is higher?
      why: These conditions in the lungs favour O₂ loading.
    - label: About 70% is carried as bicarbonate
      bin: Carbon dioxide
      clue: Which gas becomes HCO₃⁻ in the blood?
      why: CO₂ + H₂O → H₂CO₃ → HCO₃⁻ + H⁺.
    - label: 20–25% is carried as carbamino-haemoglobin
      bin: Carbon dioxide
      clue: Which gas binds the amino groups of haemoglobin?
      why: CO₂ binds haemoglobin as carbamino-haemoglobin.
    - label: Carbonic anhydrase speeds up how it is carried
      bin: Carbon dioxide
      clue: Which gas does this enzyme turn into bicarbonate?
      why: Carbonic anhydrase helps carry CO₂.
    - label: Partial pressure 45 mm Hg in tissues, 40 in the alveoli
      bin: Carbon dioxide
      clue: Which gas is higher in the tissues?
      why: CO₂ is made by tissues, so it moves from tissues to blood to alveoli.
    - label: 20–25 times more soluble, so it diffuses faster
      bin: Carbon dioxide
      clue: Which gas dissolves far more easily in water?
      why: CO₂ is much more soluble, so it crosses the membrane easily.
  lesson:
    - teach: 'Gases diffuse from higher to lower partial pressure. In alveoli pO₂ is 104 mm Hg, in returning blood 40: O₂ moves in. pCO₂ is 45 in blood and 40 in alveoli: CO₂ moves out. CO₂ is 20–25 times more soluble than O₂.'
      check:
        prompt: 'O₂ moves from alveoli into blood because:'
        options:
        - pO₂ is higher in the alveoli
        - blood pulls it
        - pCO₂ is higher in alveoli
        answer: pO₂ is higher in the alveoli
        why: Diffusion follows the gradient.
    - teach: About 97% of O₂ travels as oxyhaemoglobin and 3% dissolved. The oxygen dissociation curve is S-shaped; high pCO₂, acid, and heat shift it right, so tissues get more O₂. CO₂ travels mainly as bicarbonate (about 70%), helped by carbonic anhydrase.
      check:
        prompt: Each haemoglobin can carry how many O₂ molecules?
        options:
        - '4'
        - '1'
        - '2'
        answer: '4'
        why: One per haem group.
    - teach: 'Breathing is controlled by the respiratory rhythm centre in the medulla, adjusted by the pneumotaxic centre in the pons and by sensors for CO₂ and H⁺. Disorders: asthma, emphysema (damaged alveoli, smoking), occupational dust diseases.'
      picture:
        kind: compare
        columns:
        - title: Gas
          points:
          - O₂
          - CO₂
        - title: Mainly carried as
          points:
          - oxyhaemoglobin (97%)
          - bicarbonate (about 70%)
        alt: How oxygen and carbon dioxide travel in blood.
      check:
        prompt: 'Rising CO₂ in blood makes us breathe:'
        options:
        - faster
        - slower
        - the same
        answer: faster
        why: Chemosensors signal the rhythm centre.
  items:
  - prompt: pO₂ in alveoli is 104 mm Hg and in deoxygenated blood 40 mm Hg. Find the difference (mm Hg).
    answer: '64'
    check: 104-40
    difficulty: 1
    hints:
    - 104 − 40.
    - Drives diffusion.
    solution: 64 mm Hg.
    mistakes: {"144": "b11_po2_diff", "40": "b11_po2_diff", "104": "b11_po2_diff"}
  - prompt: About what percentage of oxygen is carried as oxyhaemoglobin?
    answer: '97'
    check: 100-3
    difficulty: 1
    hints:
    - Most of it.
    - 3% dissolved.
    solution: About 97%.
    mistakes:
      '70': c11b_o2
  - prompt: 'Most CO₂ is carried in blood as:'
    options:
    - bicarbonate ions
    - carbaminohaemoglobin
    - dissolved gas
    - carbon monoxide
    answer: bicarbonate ions
    difficulty: 2
    hints:
    - About 70%.
    - Carbonic anhydrase.
    solution: Bicarbonate.
    mistakes:
      carbaminohaemoglobin: c11b_o2
  - prompt: 'The respiratory rhythm centre is in the:'
    options:
    - medulla
    - cerebrum
    - cerebellum
    - spinal cord
    answer: medulla
    difficulty: 2
    hints:
    - Brain stem.
    - Involuntary control.
    solution: The medulla.
    mistakes: {"cerebrum": "b11_medulla", "cerebellum": "b11_medulla", "spinal cord": "b11_medulla"}
  - prompt: 'Emphysema, often caused by smoking, damages the:'
    options:
    - alveolar walls
    - trachea only
    - heart valves
    - kidneys
    answer: alveolar walls
    difficulty: 2
    hints:
    - Less surface area.
    - Air sacs.
    solution: The alveolar walls.
    mistakes: {"trachea only": "b11_emphysema", "heart valves": "b11_emphysema", "kidneys": "b11_emphysema"}
  - prompt: 'The enzyme that speeds the conversion of CO₂ to bicarbonate is:'
    options:
    - carbonic anhydrase
    - amylase
    - pepsin
    - lipase
    answer: carbonic anhydrase
    difficulty: 2
    hints:
    - In red blood cells.
    - CO₂ + H₂O.
    solution: Carbonic anhydrase.
    mistakes: {"amylase": "b11_carbonic", "pepsin": "b11_carbonic", "lipase": "b11_carbonic"}
  - prompt: pCO₂ in deoxygenated blood is 45 mm Hg and in alveoli 40. Find the difference (mm Hg).
    answer: '5'
    check: 45-40
    difficulty: 1
    hints:
    - Subtract.
    - 45 − 40.
    solution: 'Step 1: 45 − 40. Step 2: 5 mm Hg.'
    mistakes:
      '85': c11b14_gas
      '64': c11b14_gas
  - prompt: 'Asthma is caused by:'
    options:
    - inflammation and narrowing of bronchi
    - damaged alveolar walls
    - silica dust
    answer: inflammation and narrowing of bronchi
    difficulty: 1
    hints:
    - Breathing becomes wheezy.
    - The air tubes tighten.
    solution: 'Step 1: bronchi swell. Step 2: narrow airways.'
    mistakes:
      damaged alveolar walls: c11b14_gas
      silica dust: c11b14_gas
  - prompt: About what percentage of CO₂ is carried as bicarbonate?
    answer: '70'
    check: '70'
    difficulty: 1
    hints:
    - Most of it.
    - The rest as carbaminohaemoglobin or dissolved.
    solution: 'Step 1: carbonic anhydrase helps. Step 2: about 70%.'
    mistakes:
      '20': c11b14_gas
      '7': c11b14_gas
  - prompt: 'The pneumotaxic centre is in the:'
    options:
    - pons
    - medulla
    - cerebrum
    answer: pons
    difficulty: 2
    hints:
    - It can shorten each breath in.
    - It sits above the medulla.
    solution: 'Step 1: it moderates the rhythm. Step 2: pons.'
    mistakes:
      medulla: c11b14_gas
      cerebrum: c11b14_gas
  - prompt: 'Silicosis and asbestosis are:'
    options:
    - occupational respiratory disorders
    - inherited diseases
    - heart disorders
    answer: occupational respiratory disorders
    difficulty: 2
    hints:
    - Workers breathe in dust.
    - Stone-crushing and asbestos factories.
    solution: 'Step 1: caused by workplace dust. Step 2: occupational.'
    mistakes:
      inherited diseases: c11b14_gas
      heart disorders: c11b14_gas
  - prompt: 'Haemoglobin binding O₂ well in the lungs is favoured by:'
    options:
    - high pO₂, low pCO₂, low H⁺, lower temperature
    - high pCO₂ and high H⁺
    - high temperature
    answer: high pO₂, low pCO₂, low H⁺, lower temperature
    difficulty: 2
    hints:
    - Lungs are rich in O₂ and poor in CO₂.
    - Tissue conditions favour release instead.
    solution: 'Step 1: lung conditions. Step 2: favour loading.'
    mistakes:
      high pCO₂ and high H⁺: c11b14_gas
      high temperature: c11b14_gas
  - prompt: Which gas binds haemoglobin much more strongly than O₂ and is dangerous?
    options:
    - carbon monoxide
    - nitrogen
    - carbon dioxide
    answer: carbon monoxide
    difficulty: 2
    hints:
    - It comes from incomplete burning.
    - It forms carboxyhaemoglobin.
    solution: 'Step 1: very strong binding. Step 2: carbon monoxide.'
    mistakes:
      nitrogen: c11b14_gas
      carbon dioxide: c11b14_gas
  - prompt: Why does CO₂ diffuse across the alveoli easily despite a small pressure difference?
    options:
    - it is 20–25 times more soluble than O₂
    - it is lighter than O₂
    - it is pumped actively
    answer: it is 20–25 times more soluble than O₂
    difficulty: 3
    hints:
    - Compare solubility.
    - More soluble gases cross membranes faster.
    solution: 'Step 1: high solubility. Step 2: fast diffusion.'
    mistakes:
      it is lighter than O₂: c11b14_gas
      it is pumped actively: c11b14_gas
  - prompt: Every 100 mL of oxygenated blood gives about 5 mL of O₂ to tissues. How much (mL) is delivered by 1 L?
    answer: '50'
    check: 5*10
    difficulty: 3
    hints:
    - 1 L = 10 × 100 mL.
    - Multiply by 5.
    solution: 'Step 1: 10 × 5. Step 2: 50 mL.'
    mistakes:
      '5': c11b14_gas
      '500': c11b14_gas
