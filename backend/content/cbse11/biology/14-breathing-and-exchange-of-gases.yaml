# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 14. Format: content/README.md.
subject: cbse11-bio
chapter: 14
title: Breathing and Exchange of Gases
tips:
  c11b_volume: Vital capacity = tidal volume + IRV + ERV. Total lung capacity = vital capacity + residual volume.
  c11b_o2: "Nearly all oxygen travels bound to haemoglobin: check the textbook figure (it is close to 100%). Most CO₂ travels dissolved in plasma as an ion made with carbonic anhydrase."
  b11_alveoli: "Trachea, bronchi and larynx only conduct air. Exchange needs tiny thin-walled sacs."
  b11_breath_rate: "A healthy adult breathes about 12 to 16 times a minute; 72 is the heart rate. Read which end of the range the question wants."
  b11_carbonic: "The enzyme is named after carbonic acid. Amylase, pepsin and lipase are digestive."
  b11_diaphragm: "Inspiration makes the chest bigger. A domed muscle that contracts pulls down and flattens."
  b11_emphysema: "Emphysema breaks down the walls of the tiny air sacs, reducing surface area."
  b11_medulla: "Automatic functions like breathing are run from the brain stem part just above the spinal cord."
  b11_minute_volume: "Total = tidal volume × number of breaths."
  b11_po2_diff: "Difference = larger − smaller."
  b11_tracheae: "Insects have a network of air tubes opening through spiracles."
concepts:
- code: cbse11b.breath.mechanism
  title: Respiratory organs and breathing
  notes: |
    Respiratory organs: body surface (sponges), skin (earthworm), tracheae (insects), gills (fish), lungs (land
    vertebrates). Human respiratory system: nostrils, pharynx, larynx (voice box), trachea, bronchi, bronchioles, alveoli;
    pleura. Steps: breathing, diffusion across alveoli, transport by blood, diffusion to tissues, cellular respiration.
    Inspiration: diaphragm and external intercostals contract, thoracic volume rises, pressure falls, air enters.
    Expiration: muscles relax (passive). Breathing rate 12–16 per minute. Volumes: tidal (about 500 mL), IRV, ERV, residual
    (1100–1200 mL); capacities: vital, total lung. Spirometer.
  explanations:
    text: Breathing moves air in and out of the lungs. When the diaphragm flattens and the ribs lift, the chest gets bigger, pressure inside drops, and air rushes in. Relaxing them pushes air out. In the alveoli, oxygen passes into the blood.
    visual: 'Draw the chest as a box with a flexible floor (the diaphragm). Pull the floor down: the box gets bigger and air flows in. Let it go: air flows out.'
    step_by_step: 'Step 1: Diaphragm contracts and flattens. Step 2: Ribs move up and out. Step 3: Lung volume rises, pressure falls. Step 4: Air flows in. Reverse for breathing out.'
    real_world: Doctors use a spirometer to test lung capacity in people with asthma.
  picture:
    kind: flow
    steps:
    - Nose
    - Pharynx
    - Larynx
    - Trachea
    - Bronchi
    - Bronchioles
    - Alveoli
    alt: The path of air from the nose to the alveoli.
  activity:
    type: order
    prompt: Put the steps of breathing in (inspiration) in order.
    steps:
    - The diaphragm and external intercostal muscles contract
    - The diaphragm flattens and the ribs and sternum lift
    - The volume of the chest cavity increases
    - Pressure in the lungs falls below the air outside
    - Air rushes in through the nose and trachea
    - The alveoli fill and gas exchange begins
    reasons:
      The diaphragm flattens and the ribs and sternum lift: 'The muscles have to contract first: their pull is what flattens the diaphragm and lifts the ribs.'
      The volume of the chest cavity increases: The chest only gets bigger once the diaphragm has moved down and the ribs out.
      Pressure in the lungs falls below the air outside: The pressure drops because the volume has increased (more space, same air).
      Air rushes in through the nose and trachea: 'Air moves only when there''s a pressure difference: from high outside to low inside.'
      The alveoli fill and gas exchange begins: Gas exchange needs fresh air to have reached the alveoli.
  items:
  - prompt: A normal adult breathes about how many times per minute (lower value of the range 12–16)?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - Normal rate.
    - 12–16.
    solution: 12–16 times; lower value 12.
    mistakes: {"16": "b11_breath_rate", "72": "b11_breath_rate", "20": "b11_breath_rate"}
  - prompt: Tidal volume is 500 mL. How much air (in mL) is breathed in 12 breaths?
    answer: '6000'
    check: 500*12
    difficulty: 1
    hints:
    - 500 × 12.
    - Per minute.
    solution: 6,000 mL.
    mistakes: {"500": "b11_minute_volume", "512": "b11_minute_volume", "5000": "b11_minute_volume"}
  - prompt: Tidal volume 500 mL, IRV 3000 mL, ERV 1000 mL. Find the vital capacity (in mL).
    answer: '4500'
    check: 500+3000+1000
    difficulty: 2
    hints:
    - TV + IRV + ERV.
    - Add.
    solution: 4,500 mL.
    mistakes:
      '5700': c11b_volume
  - prompt: 'Gas exchange in the lungs takes place in the:'
    options:
    - alveoli
    - trachea
    - bronchi
    - larynx
    answer: alveoli
    difficulty: 1
    hints:
    - Tiny air sacs.
    - Thin walls.
    solution: Alveoli.
    mistakes: {"trachea": "b11_alveoli", "bronchi": "b11_alveoli", "larynx": "b11_alveoli"}
  - prompt: 'During inspiration, the diaphragm:'
    options:
    - contracts and flattens
    - relaxes and domes up
    - stays still
    - moves sideways
    answer: contracts and flattens
    difficulty: 2
    hints:
    - Volume increases.
    - Pulls down.
    solution: It contracts and flattens.
    mistakes: {"relaxes and domes up": "b11_diaphragm", "stays still": "b11_diaphragm", "moves sideways": "b11_diaphragm"}
  - prompt: 'Insects breathe through:'
    options:
    - tracheae
    - lungs
    - gills
    - skin only
    answer: tracheae
    difficulty: 2
    hints:
    - Tubes with spiracles.
    - Air tubes.
    solution: Tracheal tubes.
    mistakes: {"lungs": "b11_tracheae", "gills": "b11_tracheae", "skin only": "b11_tracheae"}
- code: cbse11b.breath.transport
  title: Gas transport and disorders
  after:
  - cbse11b.breath.mechanism
  notes: |
    Partial pressures: alveoli pO₂ 104 mm Hg, pCO₂ 40; deoxygenated blood pO₂ 40, pCO₂ 45; tissues pO₂ 40, pCO₂ 45.
    Diffusion membrane: alveolar wall, basement membrane, capillary wall. CO₂ is 20–25 times more soluble than O₂.
    Transport of O₂: about 97% as oxyhaemoglobin, 3% dissolved; oxygen dissociation curve (sigmoid); high pCO₂, H⁺,
    temperature shift it right. Transport of CO₂: about 20–25% as carbaminohaemoglobin, 70% as bicarbonate (carbonic
    anhydrase), 7% dissolved. Regulation: respiratory rhythm centre in medulla, pneumotaxic centre in pons, chemosensitive
    area. Disorders: asthma, emphysema (alveolar walls damaged, smoking), occupational respiratory disorders (silicosis,
    asbestosis).
  explanations:
    text: Oxygen moves from the air sacs into the blood because there's more of it in the lungs, and red blood cells carry it as oxyhaemoglobin. Carbon dioxide travels back mostly as bicarbonate in the plasma. Smoking and dust can damage the lungs.
    visual: 'Draw two boxes, alveolus and blood, with oxygen pressure 104 in the alveolus and 40 in the blood: oxygen flows downhill into the blood. CO₂ flows the other way (45 to 40).'
    step_by_step: 'Step 1: Compare partial pressures. Step 2: Gas moves from high to low. Step 3: Name how it is carried (oxyhaemoglobin, bicarbonate).'
    real_world: Workers in stone quarries can get silicosis from breathing dust; masks and wet drilling protect them.
  picture:
    kind: bars
    bars:
    - label: as bicarbonate
      value: 70
    - label: bound to haemoglobin
      value: 23
    - label: dissolved
      value: 7
    alt: 'How carbon dioxide is carried in blood: about 70% as bicarbonate, 20–25% bound to haemoglobin and 7% dissolved.'
    unit: '%'
  activity:
    type: sort
    prompt: Is each fact about how oxygen or carbon dioxide is carried?
    bins:
    - Oxygen
    - Carbon dioxide
    items:
    - label: About 97% is carried by haemoglobin
      bin: Oxygen
      clue: Which gas rides almost entirely on haemoglobin?
      why: About 97% of O₂ travels as oxyhaemoglobin.
    - label: pO₂ is high in the alveoli, 104 mm Hg
      bin: Oxygen
      clue: 'pO₂ or pCO₂: which is written?'
      why: Alveolar air is rich in O₂, so O₂ moves into the blood.
    - label: Binds haemoglobin more when pH is high and temperature low
      bin: Oxygen
      clue: Which gas is loaded in the lungs, where pH is higher?
      why: These conditions in the lungs favour O₂ loading.
    - label: About 70% is carried as bicarbonate
      bin: Carbon dioxide
      clue: Which gas becomes HCO₃⁻ in the blood?
      why: CO₂ + H₂O → H₂CO₃ → HCO₃⁻ + H⁺.
    - label: 20–25% is carried as carbamino-haemoglobin
      bin: Carbon dioxide
      clue: Which gas binds the amino groups of haemoglobin?
      why: CO₂ binds haemoglobin as carbamino-haemoglobin.
    - label: Carbonic anhydrase speeds up how it is carried
      bin: Carbon dioxide
      clue: Which gas does this enzyme turn into bicarbonate?
      why: Carbonic anhydrase helps carry CO₂.
    - label: Partial pressure 45 mm Hg in tissues, 40 in the alveoli
      bin: Carbon dioxide
      clue: Which gas is higher in the tissues?
      why: CO₂ is made by tissues, so it moves from tissues to blood to alveoli.
    - label: 20–25 times more soluble, so it diffuses faster
      bin: Carbon dioxide
      clue: Which gas dissolves far more easily in water?
      why: CO₂ is much more soluble, so it crosses the membrane easily.
  items:
  - prompt: pO₂ in alveoli is 104 mm Hg and in deoxygenated blood 40 mm Hg. Find the difference (mm Hg).
    answer: '64'
    check: 104-40
    difficulty: 1
    hints:
    - 104 − 40.
    - Drives diffusion.
    solution: 64 mm Hg.
    mistakes: {"144": "b11_po2_diff", "40": "b11_po2_diff", "104": "b11_po2_diff"}
  - prompt: About what percentage of oxygen is carried as oxyhaemoglobin?
    answer: '97'
    check: 100-3
    difficulty: 1
    hints:
    - Most of it.
    - 3% dissolved.
    solution: About 97%.
    mistakes:
      '70': c11b_o2
  - prompt: 'Most CO₂ is carried in blood as:'
    options:
    - bicarbonate ions
    - carbaminohaemoglobin
    - dissolved gas
    - carbon monoxide
    answer: bicarbonate ions
    difficulty: 2
    hints:
    - About 70%.
    - Carbonic anhydrase.
    solution: Bicarbonate.
    mistakes:
      carbaminohaemoglobin: c11b_o2
  - prompt: 'The respiratory rhythm centre is in the:'
    options:
    - medulla
    - cerebrum
    - cerebellum
    - spinal cord
    answer: medulla
    difficulty: 2
    hints:
    - Brain stem.
    - Involuntary control.
    solution: The medulla.
    mistakes: {"cerebrum": "b11_medulla", "cerebellum": "b11_medulla", "spinal cord": "b11_medulla"}
  - prompt: 'Emphysema, often caused by smoking, damages the:'
    options:
    - alveolar walls
    - trachea only
    - heart valves
    - kidneys
    answer: alveolar walls
    difficulty: 2
    hints:
    - Less surface area.
    - Air sacs.
    solution: The alveolar walls.
    mistakes: {"trachea only": "b11_emphysema", "heart valves": "b11_emphysema", "kidneys": "b11_emphysema"}
  - prompt: 'The enzyme that speeds the conversion of CO₂ to bicarbonate is:'
    options:
    - carbonic anhydrase
    - amylase
    - pepsin
    - lipase
    answer: carbonic anhydrase
    difficulty: 2
    hints:
    - In red blood cells.
    - CO₂ + H₂O.
    solution: Carbonic anhydrase.
    mistakes: {"amylase": "b11_carbonic", "pepsin": "b11_carbonic", "lipase": "b11_carbonic"}
