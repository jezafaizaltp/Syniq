# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-bio
chapter: 3
title: Plant Kingdom
tips:
  c11b_alternation: "In mosses, the green, leafy plant you see is the haploid stage; the stalk with a capsule depends on it. Which stage is the main, lasting one?"
  c11b_seed: "'Gymno' means naked and 'angio' means vessel. Where do the seeds sit in each group: in a covering or out in the open?"
  b11_agar: "Agar comes from Gelidium and Gracilaria. Their main pigment, phycoerythrin, gives them a colour. Which algae group has that colour?"
  b11_bryophyte_amphibian: "Amphibians live on land but return to water to breed. What do bryophyte sperms need to swim?"
  b11_coralloid: "Coralloid roots fix nitrogen with help from blue-green partners."
  b11_double_fert: "Double fertilisation forms both the embryo and the endosperm. Which plants have endosperm from triple fusion?"
  b11_fucoxanthin: "Fucoxanthin is a brown-gold pigment. Which algae are named after their colour?"
  b11_gemmae: "Marchantia has small cups on its thallus with tiny green buds that splash out in rain."
  b11_heterospory: "Two sizes of spores, one female spore kept on the plant: what later structure does this resemble?"
  b11_peat: "Peat forms in bogs from a moss that holds water like a sponge."
  b11_pteridophyte: "Bryophytes and algae have no xylem or phloem. Ferns came before seed plants."
  b11_triple_fusion: "Triple fusion joins one male gamete with two polar nuclei. Add up the chromosome sets."
  c11b03_alg: 'Sort algae by colour pigment and stored food: green (starch), brown (fucoxanthin, laminarin), red (phycoerythrin, floridean starch).'
  c11b03_life: 'Ask which generation is the main plant body: gametophyte in bryophytes, sporophyte in pteridophytes and seed plants.'
  c11b03_seed: Gymnosperm seeds are naked; angiosperm seeds are inside a fruit. Only angiosperms have double fertilisation.
  pqc11b3_pigment: Each algal class is named after a colour. Which pigment gives that colour, and what food does the class store?
concepts:
- code: cbse11b.plants.lower
  title: Algae and bryophytes
  notes: |
    Classification systems: artificial (Linnaeus), natural, phylogenetic; numerical, cyto-, chemotaxonomy. Algae: simple,
    thalloid, mostly aquatic, photosynthetic; reproduction vegetative, asexual (zoospores), sexual (isogamous, anisogamous,
    oogamous). Chlorophyceae (green, chlorophyll a,b, starch: Chlamydomonas, Spirogyra), Phaeophyceae (brown, fucoxanthin,
    laminarin: Laminaria, Sargassum), Rhodophyceae (red, r-phycoerythrin, floridean starch: Polysiphonia, Gracilaria).
    Uses: agar, carrageen, algin, Chlorella as food. Bryophytes: amphibians of the plant kingdom; gametophyte dominant;
    rhizoids; liverworts (Marchantia, gemmae) and mosses (Funaria, Sphagnum—peat).
  explanations:
    text: 'Algae are simple water plants without true roots, stems or leaves. They are grouped by colour: green, brown and red. Bryophytes, like mosses, are small land plants that still need water for fertilisation: the ''amphibians'' of the plant world.'
    visual: 'Draw a moss: a leafy green plant (the gametophyte) with a thin stalk and capsule on top (the sporophyte), which depends on the green part for food.'
    step_by_step: 'Step 1: Thalloid and mostly aquatic? Algae; sort by pigment. Step 2: Small land plant with rhizoids and dominant gametophyte? Bryophyte.'
    real_world: Agar, used to grow bacteria in labs and to set jelly desserts, comes from red algae like Gracilaria.
  picture:
    kind: compare
    columns:
    - title: Algae
      points:
      - green
      - brown
      - red
    - title: Pigment
      points:
      - chlorophyll a and b
      - fucoxanthin
      - r-phycoerythrin
    - title: Example
      points:
      - Spirogyra
      - Laminaria
      - Polysiphonia
    alt: Three classes of algae with their main pigment and an example.
  activity:
    type: sort
    prompt: Sort each into green, brown or red algae, or the bryophytes.
    bins:
    - Green algae
    - Brown algae
    - Red algae
    - Bryophytes
    items:
    - label: Chlamydomonas
      bin: Green algae
      clue: Which pigments mainly? Does it store starch?
      why: 'Chlorophyll a and b and starch stores: Chlorophyceae.'
    - label: Spirogyra
      bin: Green algae
      clue: Spiral chloroplasts, freshwater. Which class?
      why: A green alga of fresh water.
    - label: Ulothrix
      bin: Green algae
      clue: A thread of cells with chlorophyll b. Which class?
      why: Chlorophyceae.
    - label: Laminaria (kelp)
      bin: Brown algae
      clue: Which pigment gives it its colour, fucoxanthin or phycoerythrin?
      why: 'Fucoxanthin and laminarin stores: Phaeophyceae.'
    - label: Fucus
      bin: Brown algae
      clue: A large seaweed with mannitol stores. Which class?
      why: Phaeophyceae.
    - label: Sargassum
      bin: Brown algae
      clue: Which pigment makes it olive-brown?
      why: 'Fucoxanthin: Phaeophyceae.'
    - label: Polysiphonia
      bin: Red algae
      clue: Which pigment gives a red colour?
      why: 'Phycoerythrin and floridean starch: Rhodophyceae.'
    - label: Gracilaria
      bin: Red algae
      clue: Agar is made from it. Which class?
      why: A red alga used for agar.
    - label: Porphyra
      bin: Red algae
      clue: An edible seaweed with phycoerythrin. Which class?
      why: Rhodophyceae.
    - label: Marchantia (liverwort)
      bin: Bryophytes
      clue: Does it live on land, with a thallus and rhizoids?
      why: 'A land plant with no vascular tissue: a bryophyte.'
    - label: Funaria (moss)
      bin: Bryophytes
      clue: Is the dominant stage a green gametophyte on land?
      why: Mosses are bryophytes.
  lesson:
    - teach: Algae are simple, mostly aquatic, photosynthetic plants with a thallus body (no true roots, stems or leaves). They reproduce vegetatively, by spores (zoospores), and sexually.
      check:
        prompt: 'An algal body without true roots, stem or leaves is a:'
        options:
        - thallus
        - mycelium
        - rhizome
        answer: thallus
        why: Thallus means an undivided body.
      ways:
      - style: visual
        teach: Three ways algae reproduce, from simplest to sexual.
        picture:
          kind: flow
          steps:
          - 'Vegetative: a piece breaks off and grows'
          - 'Asexual: flagellated zoospores'
          - 'Sexual: two gametes fuse'
          - isogamy, anisogamy or oogamy
          alt: Algae reproduce vegetatively by fragments, asexually by flagellated zoospores, and sexually by fusing gametes, which may be equal, unequal or egg and sperm.
      - style: real_world
        teach: The green scum on a pond in summer is often Spirogyra. Seaweeds washed up on the Gulf of Mannar coast are harvested for agar, used in ice creams, jellies and to grow bacteria in labs.
    - teach: 'Three algal classes: green (Chlorophyceae: chlorophyll a and b, starch; Spirogyra), brown (Phaeophyceae: fucoxanthin, laminarin; Laminaria) and red (Rhodophyceae: r-phycoerythrin, floridean starch; Gracilaria, source of agar).'
      check:
        prompt: 'Spirogyra is a:'
        options:
        - green alga
        - brown alga
        - red alga
        answer: green alga
        why: Chlorophyceae.
      ways:
      - style: visual
        teach: Green, brown and red algae compared by pigment and stored food.
        picture:
          kind: compare
          columns:
          - title: Green (Chlorophyceae)
            points:
            - chlorophyll a, b
            - store starch
            - Chlamydomonas, Ulothrix
          - title: Brown (Phaeophyceae)
            points:
            - fucoxanthin
            - store laminarin, mannitol
            - Dictyota, Fucus
          - title: Red (Rhodophyceae)
            points:
            - r-phycoerythrin
            - store floridean starch
            - Polysiphonia, Porphyra
          alt: Green algae have chlorophyll a and b and store starch; brown algae have fucoxanthin and store laminarin; red algae have r-phycoerythrin and store floridean starch.
      - style: step_by_step
        teach: 'Step 1: Check the main pigment. Step 2: Check the stored food. Step 3: Check where it usually lives: green in fresh water, brown and red mostly in the sea, red often deep down. Step 4: Name the class from these three clues.'
    - teach: Bryophytes (liverworts like Marchantia, mosses like Funaria, Sphagnum) live on land but need water for fertilisation, so they are the 'amphibians' of plants. The gametophyte is the main plant; rhizoids anchor it.
      picture:
        kind: compare
        columns:
        - title: Algal class
          points:
          - green
          - brown
          - red
        - title: Stored food
          points:
          - starch
          - laminarin, mannitol
          - floridean starch
        alt: Stored food in the three algal classes.
      check:
        prompt: 'In a moss, the leafy green plant is the:'
        options:
        - gametophyte
        - sporophyte
        - prothallus
        answer: gametophyte
        why: It is haploid and dominant.
      ways:
      - style: step_by_step
        teach: 'Step 1: The leafy green plant is the gametophyte (haploid). Step 2: Sperms swim through water to reach the egg. Step 3: The zygote grows into a sporophyte that stays attached. Step 4: Spores grow into a protonema (in mosses) and then a new leafy plant.'
      - style: real_world
        teach: After the first monsoon rains, compound walls and tree trunks in Kerala turn velvety green with mosses. They spread when wet because their sperms need water to swim; in the dry months they dry out and wait.
  items:
  - prompt: 'Agar is obtained from:'
    options:
    - red algae
    - green algae
    - brown algae
    - mosses
    answer: red algae
    difficulty: 1
    hints:
    - Gracilaria, Gelidium.
    - Rhodophyceae.
    solution: "Agar, used to grow microbes and in jellies, comes from red algae such as Gelidium and Gracilaria."
    mistakes: {"green algae": "b11_agar", "brown algae": "b11_agar", "mosses": "b11_agar"}
  - prompt: 'Bryophytes are called the amphibians of the plant kingdom because:'
    options:
    - "they live on land but need water for fertilisation"
    - "they live only in water and never on land"
    - "they have no chlorophyll and cannot make food"
    - "they catch and eat small insects in water"
    answer: they live on land but need water for fertilisation
    difficulty: 1
    hints:
    - Sperm swim.
    - Moist places.
    solution: They need water to reproduce sexually.
    mistakes: {"they live only in water and never on land": "b11_bryophyte_amphibian", "they have no chlorophyll and cannot make food": "b11_bryophyte_amphibian", "they catch and eat small insects in water": "b11_bryophyte_amphibian"}
  - prompt: 'The dominant phase in a moss is the:'
    options:
    - gametophyte
    - sporophyte
    - seed
    - embryo
    answer: gametophyte
    difficulty: 2
    hints:
    - Haploid green plant.
    - Sporophyte depends on it.
    solution: "The green leafy moss plant we see is the gametophyte; the sporophyte grows on it."
    mistakes:
      sporophyte: c11b_alternation
  - prompt: 'Peat, used as fuel, comes from:'
    options:
    - Sphagnum
    - Funaria
    - Marchantia
    - Spirogyra
    answer: Sphagnum
    difficulty: 2
    hints:
    - A moss.
    - Bogs.
    solution: "Dead Sphagnum moss builds up in bogs and slowly forms peat."
    mistakes: {"Funaria": "b11_peat", "Marchantia": "b11_peat", "Spirogyra": "b11_peat"}
  - prompt: 'Fucoxanthin is the characteristic pigment of:'
    options:
    - brown algae
    - red algae
    - green algae
    - liverworts
    answer: brown algae
    difficulty: 2
    hints:
    - Phaeophyceae.
    - Brown colour.
    solution: "Brown algae (Phaeophyceae) owe their colour to fucoxanthin."
    mistakes: {"red algae": "b11_fucoxanthin", "green algae": "b11_fucoxanthin", "liverworts": "b11_fucoxanthin"}
  - prompt: 'Marchantia reproduces asexually by:'
    options:
    - gemmae
    - seeds
    - zoospores
    - spores from cones
    answer: gemmae
    difficulty: 2
    hints:
    - Gemma cups.
    - Liverwort.
    solution: "Marchantia forms gemmae, small green buds in gemma cups, which grow into new plants."
    mistakes: {"seeds": "b11_gemmae", "zoospores": "b11_gemmae", "spores from cones": "b11_gemmae"}
  - prompt: 'Algin is obtained from:'
    options:
    - brown algae
    - green algae
    - red algae
    answer: brown algae
    difficulty: 1
    hints:
    - Large seaweeds like Laminaria.
    - They contain fucoxanthin.
    solution: 'Step 1: algin comes from kelps. Step 2: brown algae.'
    mistakes:
      green algae: c11b03_alg
      red algae: c11b03_alg
  - prompt: 'Chlorella is used by space travellers as a source of:'
    options:
    - protein-rich food
    - agar
    - peat
    answer: protein-rich food
    difficulty: 1
    hints:
    - It is a single-celled green alga.
    - It grows fast and is nutritious.
    solution: 'Step 1: rich in protein. Step 2: used as food supplement.'
    mistakes:
      agar: c11b03_alg
      peat: c11b03_alg
  - prompt: 'Bryophytes are anchored to the soil by:'
    options:
    - rhizoids
    - true roots
    - hyphae
    answer: rhizoids
    difficulty: 1
    hints:
    - They have no true roots.
    - These are thin hair-like threads.
    solution: 'Step 1: no roots in bryophytes. Step 2: rhizoids.'
    mistakes:
      true roots: c11b03_life
      hyphae: c11b03_life
  - prompt: 'Fusion of a large non-motile female gamete with a small motile male gamete is called:'
    options:
    - oogamy
    - isogamy
    - anisogamy
    answer: oogamy
    difficulty: 2
    hints:
    - The egg does not move.
    - Iso means equal; aniso means unequal but both motile.
    solution: 'Step 1: big still egg, small moving sperm. Step 2: oogamy.'
    mistakes:
      isogamy: c11b03_alg
      anisogamy: c11b03_alg
  - prompt: 'Carrageen is obtained from:'
    options:
    - red algae
    - brown algae
    - mosses
    answer: red algae
    difficulty: 2
    hints:
    - It is used to thicken foods, like agar.
    - It comes from the same class as Gracilaria.
    solution: 'Step 1: hydrocolloid from Rhodophyceae. Step 2: red algae.'
    mistakes:
      brown algae: c11b03_alg
      mosses: c11b03_alg
  - prompt: Why do red algae grow at greater depths than green algae?
    options:
    - "r-phycoerythrin absorbs the blue-green light that reaches deep water"
    - "they need much less light than any other kind of algae to survive"
    - "they are heavier than green algae, so they sink to the bottom"
    answer: r-phycoerythrin absorbs the blue-green light that reaches deep water
    difficulty: 2
    hints:
    - Red light is absorbed near the surface.
    - What pigment do red algae have?
    solution: 'Step 1: only blue-green light reaches deep water. Step 2: phycoerythrin can use it.'
    mistakes:
      "they need much less light than any other kind of algae to survive": c11b03_alg
      "they are heavier than green algae, so they sink to the bottom": c11b03_alg
  - prompt: 'Sphagnum is useful to gardeners because it:'
    options:
    - "holds water well when used as packing"
    - "fixes nitrogen from the air into the soil"
    - "kills pests that attack garden plants"
    answer: holds water well when used as packing
    difficulty: 2
    hints:
    - It is a moss that soaks up water.
    - Used for moving living plants.
    solution: 'Step 1: high water capacity. Step 2: used as packing material.'
    mistakes:
      "fixes nitrogen from the air into the soil": c11b03_life
      "kills pests that attack garden plants": c11b03_life
  - prompt: 'In a moss, the sporophyte is:'
    options:
    - "attached to and partly dependent on the gametophyte"
    - "the main free-living plant that we see as moss"
    - "absent, as mosses have only a gametophyte stage"
    answer: attached to and partly dependent on the gametophyte
    difficulty: 3
    hints:
    - It grows from the fertilised egg on the gametophyte.
    - It has foot, seta and capsule.
    solution: 'Step 1: grows on the gametophyte. Step 2: depends on it for food.'
    mistakes:
      "the main free-living plant that we see as moss": c11b03_life
      "absent, as mosses have only a gametophyte stage": c11b03_life
  - prompt: 'The first stage of a moss gametophyte, a creeping green branched filament, is the:'
    options:
    - protonema
    - prothallus
    - capsule
    answer: protonema
    difficulty: 3
    hints:
    - It grows straight from a spore.
    - The leafy stage comes after it.
    solution: 'Step 1: spore germinates into a filament. Step 2: protonema.'
    mistakes:
      prothallus: c11b03_life
      capsule: c11b03_life
  - prompt: 'Assertion (A): Bryophytes need water for sexual reproduction.

      Reason (R): Their male gametes swim with flagella to reach the egg.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Swimming sperms need a film of water, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A seaweed collected from deep water appears red and stores floridean starch. To which class does it belong?'
    options:
    - Rhodophyceae
    - Phaeophyceae
    - Chlorophyceae
    answer: Rhodophyceae
    hints:
    - Which class is named for red?
    - Floridean starch is stored by which class?
    solution: Red colour from r-phycoerythrin and floridean starch place it in Rhodophyceae.
    mistakes:
      Phaeophyceae: pqc11b3_pigment
      Chlorophyceae: pqc11b3_pigment
    exam: case
    difficulty: 2
  - prompt: 'In bryophytes, the main plant body is:'
    options:
    - Haploid gametophyte
    - Diploid sporophyte
    - Triploid endosperm
    answer: Haploid gametophyte
    hints:
    - Which stage is the green leafy plant?
    - The sporophyte depends on it.
    solution: The leafy plant of a moss or liverwort is the haploid gametophyte.
    mistakes:
      Diploid sporophyte: c11b_alternation
      Triploid endosperm: c11b03_life
    exam: one_mark
    difficulty: 2
- code: cbse11b.plants.vascular
  title: Pteridophytes, gymnosperms and angiosperms
  after:
  - cbse11b.plants.lower
  notes: |
    Pteridophytes: first terrestrial plants with xylem and phloem; sporophyte dominant with roots, stems, leaves;
    sporangia on sporophylls (strobili); homosporous (most) and heterosporous (Selaginella, Salvinia: precursor to seed
    habit); prothallus gametophyte needs water. Examples: Equisetum, ferns (Dryopteris, Pteris, Adiantum). Gymnosperms: naked
    ovules; cones; Cycas (coralloid roots with cyanobacteria), Pinus (mycorrhiza), Ginkgo; wind pollination. Angiosperms:
    flowering plants, ovules in ovary; dicots and monocots; double fertilisation (syngamy + triple fusion giving 3n
    endosperm). Plant life cycles: haplontic, diplontic, haplo-diplontic.
  explanations:
    text: Pteridophytes, like ferns, were the first plants with tubes (xylem and phloem) to carry water. Gymnosperms, like pine, have seeds but no fruit around them. Angiosperms are flowering plants with seeds inside fruits, and they show double fertilisation.
    visual: Draw a pine cone (naked seeds on scales) next to a mango (seed hidden inside a fruit). That's the gymnosperm–angiosperm difference.
    step_by_step: 'Step 1: Vascular tissue but no seeds? Pteridophyte. Step 2: Naked seeds? Gymnosperm. Step 3: Flowers and seeds in fruits? Angiosperm.'
    real_world: Ferns are popular house plants; their young leaves uncurl like a violin's head, called fiddleheads.
  picture:
    kind: flow
    steps:
    - Algae
    - Bryophytes
    - Pteridophytes (vascular)
    - Gymnosperms (naked seeds)
    - Angiosperms (flowers, fruits)
    alt: 'Plant groups from simplest to most complex: algae, bryophytes, pteridophytes, gymnosperms and angiosperms.'
  activity:
    type: sort
    prompt: 'Sort each plant: pteridophyte, gymnosperm or angiosperm.'
    bins:
    - Pteridophyte
    - Gymnosperm
    - Angiosperm
    items:
    - label: Selaginella
      bin: Pteridophyte
      clue: Does it make seeds or spores?
      why: 'Vascular tissue but spores, no seeds: a pteridophyte.'
    - label: Equisetum (horsetail)
      bin: Pteridophyte
      clue: Seeds or spores?
      why: A spore-bearing vascular plant.
    - label: Dryopteris (fern)
      bin: Pteridophyte
      clue: Fern leaves carry sori underneath. Seeds or spores?
      why: Ferns are pteridophytes.
    - label: Salvinia
      bin: Pteridophyte
      clue: A floating water fern. Does it make seeds?
      why: Salvinia is a heterosporous fern, with no seeds.
    - label: Pinus
      bin: Gymnosperm
      clue: Are its seeds enclosed in a fruit?
      why: 'Naked seeds on cones: a gymnosperm.'
    - label: Cycas
      bin: Gymnosperm
      clue: Its seeds sit on open scales. Is there a fruit?
      why: 'No fruit, naked ovules: gymnosperm.'
    - label: Ginkgo
      bin: Gymnosperm
      clue: Does it have flowers and fruits?
      why: 'Ginkgo has naked seeds: a gymnosperm.'
    - label: Cedrus (deodar)
      bin: Gymnosperm
      clue: A conifer. Are its seeds covered?
      why: Conifers are gymnosperms.
    - label: Mango
      bin: Angiosperm
      clue: Does it make flowers and fruits?
      why: 'Seeds inside a fruit: an angiosperm.'
    - label: Wheat
      bin: Angiosperm
      clue: Does it flower?
      why: Wheat is a flowering plant, a monocot.
    - label: Sunflower
      bin: Angiosperm
      clue: Flowers and seeds in fruits?
      why: 'A flowering plant: angiosperm.'
  lesson:
    - teach: Pteridophytes (ferns, Equisetum, Selaginella) were the first land plants with xylem and phloem. The main plant is the sporophyte with true roots, stems and leaves, but the small gametophyte (prothallus) still needs water for fertilisation.
      check:
        prompt: 'The main plant body of a fern is the:'
        options:
        - sporophyte
        - gametophyte
        - protonema
        answer: sporophyte
        why: Diploid and dominant.
      ways:
      - style: visual
        teach: 'Fern life cycle: a big sporophyte and a tiny independent gametophyte.'
        picture:
          kind: flow
          steps:
          - Fern plant (sporophyte, 2n)
          - Spores (n) from sori under leaves
          - Prothallus (gametophyte, n)
          - Sperm swims to egg in water
          - Zygote grows into a new fern
          alt: The fern plant is the sporophyte; it makes spores that grow into a small heart-shaped prothallus; sperm swim to the egg in water and the zygote grows into a new fern.
      - style: real_world
        teach: Brown dots in rows under a fern leaf are sori, clusters of spore sacs. Ferns grow along shady, damp roadsides in the Western Ghats because their tiny prothallus still needs water for fertilisation.
    - teach: Gymnosperms (Cycas, Pinus, Ginkgo) have naked ovules and seeds, not covered by an ovary or fruit. Cycas has coralloid roots with cyanobacteria; Pinus roots have mycorrhizal fungi.
      check:
        prompt: 'Gymnosperm seeds are called naked because:'
        options:
        - they are not enclosed in a fruit
        - they have no seed coat
        - they have no food
        answer: they are not enclosed in a fruit
        why: No ovary wall around them.
      ways:
      - style: visual
        teach: Gymnosperms and angiosperms side by side.
        picture:
          kind: compare
          columns:
          - title: Gymnosperms
            points:
            - naked ovules and seeds
            - no fruit
            - Cycas, Pinus, Ginkgo
          - title: Angiosperms
            points:
            - ovules inside an ovary
            - seeds in a fruit
            - mango, wheat, coconut
          alt: Gymnosperms like Cycas and Pinus bear naked ovules and seeds with no fruit; angiosperms like mango enclose ovules in an ovary, so seeds sit inside a fruit.
      - style: real_world
        teach: 'A pine cone in Ooty holds its seeds out on woody scales with nothing around them: naked seeds. A mango hides its seed inside a juicy fruit that grew from the ovary: an angiosperm.'
    - teach: 'Angiosperms (flowering plants) have ovules in an ovary. Double fertilisation: one male gamete fuses with the egg (zygote, 2n) and another with two polar nuclei (endosperm, 3n). Dicots and monocots are its two groups.'
      picture:
        kind: flow
        steps:
        - Algae
        - Bryophytes
        - Pteridophytes
        - Gymnosperms
        - Angiosperms
        alt: Major plant groups from simplest to most advanced.
      check:
        prompt: 'Fusion of a male gamete with the two polar nuclei is called:'
        options:
        - triple fusion
        - syngamy
        - pollination
        answer: triple fusion
        why: Three nuclei fuse.
      ways:
      - style: step_by_step
        teach: 'Step 1: The pollen tube brings two male gametes. Step 2: One fuses with the egg → zygote (2n) → embryo. Step 3: The other fuses with the two polar nuclei → primary endosperm nucleus (3n). Step 4: Two fusions at once, so it is called double fertilisation.'
      - style: real_world
        teach: The white kernel and water of a tender coconut are endosperm, the food store made by triple fusion. The embryo is a tiny peg near one 'eye' of the shell, which uses that food when the coconut sprouts.
  items:
  - prompt: 'The first terrestrial plants with vascular tissue were:'
    options:
    - pteridophytes
    - bryophytes
    - algae
    - gymnosperms
    answer: pteridophytes
    difficulty: 1
    hints:
    - Ferns.
    - Xylem and phloem.
    solution: "Pteridophytes (ferns and their relatives) were the first land plants with xylem and phloem."
    mistakes: {"bryophytes": "b11_pteridophyte", "algae": "b11_pteridophyte", "gymnosperms": "b11_pteridophyte"}
  - prompt: 'Gymnosperms differ from angiosperms in having:'
    options:
    - naked seeds
    - flowers
    - fruits
    - double fertilisation
    answer: naked seeds
    difficulty: 1
    hints:
    - No ovary wall.
    - Pine cone.
    solution: "'Gymno' means naked: the ovules and seeds are not enclosed in an ovary or fruit."
    mistakes:
      fruits: c11b_seed
  - prompt: The endosperm of angiosperms forms by triple fusion. What is its ploidy (number of chromosome sets)?
    answer: '3'
    check: 1+1+1
    difficulty: 2
    hints:
    - Two polar nuclei + one male gamete.
    - n + n + n.
    solution: "Triple fusion joins 1 male gamete (n) with 2 polar nuclei (n + n): 3n, triploid."
    mistakes: {"2": "b11_triple_fusion", "1": "b11_triple_fusion", "5": "b11_triple_fusion"}
  - prompt: 'Heterospory in Selaginella is seen as a step towards:'
    options:
    - the seed habit
    - losing leaves
    - aquatic life
    - parasitism
    answer: the seed habit
    difficulty: 2
    hints:
    - Two kinds of spores.
    - Megaspore retained.
    solution: "Making two kinds of spores (large and small) is a step towards the seed habit."
    mistakes: {"losing leaves": "b11_heterospory", "aquatic life": "b11_heterospory", "parasitism": "b11_heterospory"}
  - prompt: 'Coralloid roots of Cycas contain:'
    options:
    - cyanobacteria
    - fungi
    - nematodes
    - mosses
    answer: cyanobacteria
    difficulty: 2
    hints:
    - Nitrogen fixers.
    - Anabaena.
    solution: "Coralloid roots of Cycas hold nitrogen-fixing cyanobacteria."
    mistakes: {"fungi": "b11_coralloid", "nematodes": "b11_coralloid", "mosses": "b11_coralloid"}
  - prompt: 'Double fertilisation is a characteristic of:'
    options:
    - angiosperms
    - gymnosperms
    - pteridophytes
    - bryophytes
    answer: angiosperms
    difficulty: 1
    hints:
    - Syngamy + triple fusion.
    - Flowering plants.
    solution: "Only angiosperms have double fertilisation: syngamy plus triple fusion."
    mistakes: {"gymnosperms": "b11_double_fert", "pteridophytes": "b11_double_fert", "bryophytes": "b11_double_fert"}
  - prompt: Which pteridophyte is heterosporous?
    options:
    - Selaginella
    - Dryopteris
    - Pteris
    answer: Selaginella
    difficulty: 1
    hints:
    - It makes two kinds of spores.
    - Salvinia is another example.
    solution: 'Step 1: megaspores and microspores. Step 2: Selaginella.'
    mistakes:
      Dryopteris: c11b03_life
      Pteris: c11b03_life
  - prompt: 'Pinus roots have fungal partners called:'
    options:
    - mycorrhiza
    - coralloid roots
    - rhizoids
    answer: mycorrhiza
    difficulty: 1
    hints:
    - Myco = fungus, rhiza = root.
    - They help absorb water and minerals.
    solution: 'Step 1: fungus with root. Step 2: mycorrhiza.'
    mistakes:
      coralloid roots: c11b03_seed
      rhizoids: c11b03_seed
  - prompt: How many male gametes take part in double fertilisation?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - One fuses with the egg.
    - The other fuses with the polar nuclei.
    solution: 'Step 1: syngamy + triple fusion. Step 2: 2.'
    mistakes:
      '1': c11b03_seed
      '3': c11b03_seed
  - prompt: 'The fern gametophyte is a small heart-shaped structure called the:'
    options:
    - prothallus
    - protonema
    - strobilus
    answer: prothallus
    difficulty: 2
    hints:
    - It grows from a spore on damp soil.
    - It carries antheridia and archegonia.
    solution: 'Step 1: small free-living gametophyte. Step 2: prothallus.'
    mistakes:
      protonema: c11b03_life
      strobilus: c11b03_life
  - prompt: 'In gymnosperms, the ploidy of the endosperm is:'
    options:
    - n (haploid)
    - 2n
    - 3n
    answer: n (haploid)
    difficulty: 2
    hints:
    - There is no triple fusion in gymnosperms.
    - Their endosperm is the female gametophyte tissue.
    solution: 'Step 1: formed before fertilisation from the female gametophyte. Step 2: haploid.'
    mistakes:
      2n: c11b03_seed
      3n: c11b03_seed
  - prompt: Most algae such as Volvox and Spirogyra have which life cycle?
    options:
    - haplontic
    - diplontic
    - haplo-diplontic
    answer: haplontic
    difficulty: 2
    hints:
    - Only the zygote is diploid.
    - The free-living plant is haploid.
    solution: 'Step 1: zygote is the only 2n stage. Step 2: haplontic.'
    mistakes:
      diplontic: c11b03_life
      haplo-diplontic: c11b03_life
  - prompt: Bryophytes and pteridophytes show which life cycle?
    options:
    - haplo-diplontic
    - haplontic
    - diplontic
    answer: haplo-diplontic
    difficulty: 2
    hints:
    - Both generations are multicellular.
    - Neither phase is a single cell.
    solution: 'Step 1: multicellular gametophyte and sporophyte. Step 2: haplo-diplontic.'
    mistakes:
      haplontic: c11b03_life
      diplontic: c11b03_life
  - prompt: Why is heterospory a step towards seeds?
    options:
    - "the female gametophyte stays on the parent and the embryo develops there"
    - "it makes far more spores, so more of them land in good places to grow"
    - "it removes the need for roots, so plants can grow on bare rock"
    answer: the female gametophyte stays on the parent and the embryo develops there
    difficulty: 3
    hints:
    - Think of what a seed protects.
    - The megaspore is kept, not shed.
    solution: 'Step 1: megaspore retained on the sporophyte. Step 2: embryo grows there, like a seed.'
    mistakes:
      "it makes far more spores, so more of them land in good places to grow": c11b03_seed
      "it removes the need for roots, so plants can grow on bare rock": c11b03_seed
  - prompt: Angiosperms show which life cycle?
    options:
    - diplontic
    - haplontic
    - haplo-diplontic
    answer: diplontic
    difficulty: 3
    hints:
    - The plant you see is diploid.
    - The gametophyte is reduced to a few cells.
    solution: 'Step 1: dominant 2n sporophyte, tiny gametophyte. Step 2: diplontic.'
    mistakes:
      haplontic: c11b03_life
      haplo-diplontic: c11b03_life
  - prompt: 'Assertion (A): Gymnosperms do not produce fruits.

      Reason (R): Gymnosperms have no ovary; a fruit develops from the ovary.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. With no ovary there is nothing to ripen into a fruit, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: A student finds a plant with leaves bearing sori and a small, separate heart-shaped green structure nearby on wet soil. What group does the plant belong to?'
    options:
    - Pteridophyte
    - Gymnosperm
    - Bryophyte
    answer: Pteridophyte
    hints:
    - Sori hold spores under fern leaves.
    - The heart shape is a prothallus.
    solution: Sori and a free-living prothallus are typical of ferns, which are pteridophytes.
    mistakes:
      Gymnosperm: c11b03_seed
      Bryophyte: c11b03_life
    exam: competency
    difficulty: 2
  - prompt: 'In angiosperms, the zygote and the primary endosperm nucleus are respectively:'
    options:
    - 2n and 3n
    - n and 2n
    - 3n and 2n
    answer: 2n and 3n
    hints:
    - Egg + one male gamete.
    - Two polar nuclei + one male gamete.
    solution: Zygote = n + n = 2n; endosperm nucleus = n + n + n = 3n.
    mistakes:
      n and 2n: b11_triple_fusion
      3n and 2n: b11_double_fert
    exam: short
    difficulty: 2
