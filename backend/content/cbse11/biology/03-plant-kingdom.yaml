# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-bio
chapter: 3
title: Plant Kingdom
tips:
  c11b_alternation: In bryophytes the gametophyte (haploid) is dominant; from pteridophytes onward the sporophyte (diploid) is dominant.
  c11b_seed: Gymnosperms have naked seeds (no fruit); angiosperms have seeds enclosed in a fruit.
  b11_agar: "Agar comes from Gelidium and Gracilaria. Which algae group do they belong to? Think of their pigment, phycoerythrin."
  b11_bryophyte_amphibian: "Amphibians live on land but return to water to breed. What do bryophyte sperms need to swim?"
  b11_coralloid: "Coralloid roots fix nitrogen with help from blue-green partners."
  b11_double_fert: "Double fertilisation forms both the embryo and the endosperm. Which plants have endosperm from triple fusion?"
  b11_fucoxanthin: "Fucoxanthin is a brown-gold pigment. Which algae are named after their colour?"
  b11_gemmae: "Marchantia has small cups on its thallus with tiny green buds that splash out in rain."
  b11_heterospory: "Two sizes of spores, one female spore kept on the plant: what later structure does this resemble?"
  b11_peat: "Peat forms in bogs from a moss that holds water like a sponge."
  b11_pteridophyte: "Bryophytes and algae have no xylem or phloem. Ferns came before seed plants."
  b11_triple_fusion: "Triple fusion joins one male gamete with two polar nuclei. Add up the chromosome sets."
concepts:
- code: cbse11b.plants.lower
  title: Algae and bryophytes
  notes: |
    Classification systems: artificial (Linnaeus), natural, phylogenetic; numerical, cyto-, chemotaxonomy. Algae: simple,
    thalloid, mostly aquatic, photosynthetic; reproduction vegetative, asexual (zoospores), sexual (isogamous, anisogamous,
    oogamous). Chlorophyceae (green, chlorophyll a,b, starch: Chlamydomonas, Spirogyra), Phaeophyceae (brown, fucoxanthin,
    laminarin: Laminaria, Sargassum), Rhodophyceae (red, r-phycoerythrin, floridean starch: Polysiphonia, Gracilaria).
    Uses: agar, carrageen, algin, Chlorella as food. Bryophytes: amphibians of the plant kingdom; gametophyte dominant;
    rhizoids; liverworts (Marchantia, gemmae) and mosses (Funaria, Sphagnum—peat).
  explanations:
    text: 'Algae are simple water plants without true roots, stems or leaves. They are grouped by colour: green, brown and red. Bryophytes, like mosses, are small land plants that still need water for fertilisation: the ''amphibians'' of the plant world.'
    visual: 'Draw a moss: a leafy green plant (the gametophyte) with a thin stalk and capsule on top (the sporophyte), which depends on the green part for food.'
    step_by_step: 'Step 1: Thalloid and mostly aquatic? Algae; sort by pigment. Step 2: Small land plant with rhizoids and dominant gametophyte? Bryophyte.'
    real_world: Agar, used to grow bacteria in labs and to set jelly desserts, comes from red algae like Gracilaria.
  picture:
    kind: compare
    columns:
    - title: Algae
      points:
      - green
      - brown
      - red
    - title: Pigment
      points:
      - chlorophyll a and b
      - fucoxanthin
      - r-phycoerythrin
    - title: Example
      points:
      - Spirogyra
      - Laminaria
      - Polysiphonia
    alt: Three classes of algae with their main pigment and an example.
  activity:
    type: sort
    prompt: Sort each into green, brown or red algae, or the bryophytes.
    bins:
    - Green algae
    - Brown algae
    - Red algae
    - Bryophytes
    items:
    - label: Chlamydomonas
      bin: Green algae
      clue: Which pigments mainly? Does it store starch?
      why: 'Chlorophyll a and b and starch stores: Chlorophyceae.'
    - label: Spirogyra
      bin: Green algae
      clue: Spiral chloroplasts, freshwater. Which class?
      why: A green alga of fresh water.
    - label: Ulothrix
      bin: Green algae
      clue: A thread of cells with chlorophyll b. Which class?
      why: Chlorophyceae.
    - label: Laminaria (kelp)
      bin: Brown algae
      clue: Which pigment gives it its colour, fucoxanthin or phycoerythrin?
      why: 'Fucoxanthin and laminarin stores: Phaeophyceae.'
    - label: Fucus
      bin: Brown algae
      clue: A large seaweed with mannitol stores. Which class?
      why: Phaeophyceae.
    - label: Sargassum
      bin: Brown algae
      clue: Which pigment makes it olive-brown?
      why: 'Fucoxanthin: Phaeophyceae.'
    - label: Polysiphonia
      bin: Red algae
      clue: Which pigment gives a red colour?
      why: 'Phycoerythrin and floridean starch: Rhodophyceae.'
    - label: Gracilaria
      bin: Red algae
      clue: Agar is made from it. Which class?
      why: A red alga used for agar.
    - label: Porphyra
      bin: Red algae
      clue: An edible seaweed with phycoerythrin. Which class?
      why: Rhodophyceae.
    - label: Marchantia (liverwort)
      bin: Bryophytes
      clue: Does it live on land, with a thallus and rhizoids?
      why: 'A land plant with no vascular tissue: a bryophyte.'
    - label: Funaria (moss)
      bin: Bryophytes
      clue: Is the dominant stage a green gametophyte on land?
      why: Mosses are bryophytes.
  items:
  - prompt: 'Agar is obtained from:'
    options:
    - red algae
    - green algae
    - brown algae
    - mosses
    answer: red algae
    difficulty: 1
    hints:
    - Gracilaria, Gelidium.
    - Rhodophyceae.
    solution: Red algae.
    mistakes: {"green algae": "b11_agar", "brown algae": "b11_agar", "mosses": "b11_agar"}
  - prompt: 'Bryophytes are called the amphibians of the plant kingdom because:'
    options:
    - they live on land but need water for fertilisation
    - they live only in water
    - they have no chlorophyll
    - they eat insects
    answer: they live on land but need water for fertilisation
    difficulty: 1
    hints:
    - Sperm swim.
    - Moist places.
    solution: They need water to reproduce sexually.
    mistakes: {"they live only in water": "b11_bryophyte_amphibian", "they have no chlorophyll": "b11_bryophyte_amphibian", "they eat insects": "b11_bryophyte_amphibian"}
  - prompt: 'The dominant phase in a moss is the:'
    options:
    - gametophyte
    - sporophyte
    - seed
    - embryo
    answer: gametophyte
    difficulty: 2
    hints:
    - Haploid green plant.
    - Sporophyte depends on it.
    solution: The gametophyte.
    mistakes:
      sporophyte: c11b_alternation
  - prompt: 'Peat, used as fuel, comes from:'
    options:
    - Sphagnum
    - Funaria
    - Marchantia
    - Spirogyra
    answer: Sphagnum
    difficulty: 2
    hints:
    - A moss.
    - Bogs.
    solution: Sphagnum moss.
    mistakes: {"Funaria": "b11_peat", "Marchantia": "b11_peat", "Spirogyra": "b11_peat"}
  - prompt: 'Fucoxanthin is the characteristic pigment of:'
    options:
    - brown algae
    - red algae
    - green algae
    - liverworts
    answer: brown algae
    difficulty: 2
    hints:
    - Phaeophyceae.
    - Brown colour.
    solution: Brown algae.
    mistakes: {"red algae": "b11_fucoxanthin", "green algae": "b11_fucoxanthin", "liverworts": "b11_fucoxanthin"}
  - prompt: 'Marchantia reproduces asexually by:'
    options:
    - gemmae
    - seeds
    - zoospores
    - spores from cones
    answer: gemmae
    difficulty: 2
    hints:
    - Gemma cups.
    - Liverwort.
    solution: Gemmae.
    mistakes: {"seeds": "b11_gemmae", "zoospores": "b11_gemmae", "spores from cones": "b11_gemmae"}
- code: cbse11b.plants.vascular
  title: Pteridophytes, gymnosperms and angiosperms
  after:
  - cbse11b.plants.lower
  notes: |
    Pteridophytes: first terrestrial plants with xylem and phloem; sporophyte dominant with roots, stems, leaves;
    sporangia on sporophylls (strobili); homosporous (most) and heterosporous (Selaginella, Salvinia: precursor to seed
    habit); prothallus gametophyte needs water. Examples: Equisetum, ferns (Dryopteris, Pteris, Adiantum). Gymnosperms: naked
    ovules; cones; Cycas (coralloid roots with cyanobacteria), Pinus (mycorrhiza), Ginkgo; wind pollination. Angiosperms:
    flowering plants, ovules in ovary; dicots and monocots; double fertilisation (syngamy + triple fusion giving 3n
    endosperm). Plant life cycles: haplontic, diplontic, haplo-diplontic.
  explanations:
    text: Pteridophytes, like ferns, were the first plants with tubes (xylem and phloem) to carry water. Gymnosperms, like pine, have seeds but no fruit around them. Angiosperms are flowering plants with seeds inside fruits, and they show double fertilisation.
    visual: Draw a pine cone (naked seeds on scales) next to a mango (seed hidden inside a fruit). That's the gymnosperm–angiosperm difference.
    step_by_step: 'Step 1: Vascular tissue but no seeds? Pteridophyte. Step 2: Naked seeds? Gymnosperm. Step 3: Flowers and seeds in fruits? Angiosperm.'
    real_world: Ferns are popular house plants; their young leaves uncurl like a violin's head, called fiddleheads.
  picture:
    kind: flow
    steps:
    - Algae
    - Bryophytes
    - Pteridophytes (vascular)
    - Gymnosperms (naked seeds)
    - Angiosperms (flowers, fruits)
    alt: 'Plant groups from simplest to most complex: algae, bryophytes, pteridophytes, gymnosperms and angiosperms.'
  activity:
    type: sort
    prompt: 'Sort each plant: pteridophyte, gymnosperm or angiosperm.'
    bins:
    - Pteridophyte
    - Gymnosperm
    - Angiosperm
    items:
    - label: Selaginella
      bin: Pteridophyte
      clue: Does it make seeds or spores?
      why: 'Vascular tissue but spores, no seeds: a pteridophyte.'
    - label: Equisetum (horsetail)
      bin: Pteridophyte
      clue: Seeds or spores?
      why: A spore-bearing vascular plant.
    - label: Dryopteris (fern)
      bin: Pteridophyte
      clue: Fern leaves carry sori underneath. Seeds or spores?
      why: Ferns are pteridophytes.
    - label: Salvinia
      bin: Pteridophyte
      clue: A floating water fern. Does it make seeds?
      why: Salvinia is a heterosporous fern, with no seeds.
    - label: Pinus
      bin: Gymnosperm
      clue: Are its seeds enclosed in a fruit?
      why: 'Naked seeds on cones: a gymnosperm.'
    - label: Cycas
      bin: Gymnosperm
      clue: Its seeds sit on open scales. Is there a fruit?
      why: 'No fruit, naked ovules: gymnosperm.'
    - label: Ginkgo
      bin: Gymnosperm
      clue: Does it have flowers and fruits?
      why: 'Ginkgo has naked seeds: a gymnosperm.'
    - label: Cedrus (deodar)
      bin: Gymnosperm
      clue: A conifer. Are its seeds covered?
      why: Conifers are gymnosperms.
    - label: Mango
      bin: Angiosperm
      clue: Does it make flowers and fruits?
      why: 'Seeds inside a fruit: an angiosperm.'
    - label: Wheat
      bin: Angiosperm
      clue: Does it flower?
      why: Wheat is a flowering plant, a monocot.
    - label: Sunflower
      bin: Angiosperm
      clue: Flowers and seeds in fruits?
      why: 'A flowering plant: angiosperm.'
  items:
  - prompt: 'The first terrestrial plants with vascular tissue were:'
    options:
    - pteridophytes
    - bryophytes
    - algae
    - gymnosperms
    answer: pteridophytes
    difficulty: 1
    hints:
    - Ferns.
    - Xylem and phloem.
    solution: Pteridophytes.
    mistakes: {"bryophytes": "b11_pteridophyte", "algae": "b11_pteridophyte", "gymnosperms": "b11_pteridophyte"}
  - prompt: 'Gymnosperms differ from angiosperms in having:'
    options:
    - naked seeds
    - flowers
    - fruits
    - double fertilisation
    answer: naked seeds
    difficulty: 1
    hints:
    - No ovary wall.
    - Pine cone.
    solution: Naked seeds.
    mistakes:
      fruits: c11b_seed
  - prompt: The endosperm of angiosperms forms by triple fusion. What is its ploidy (number of chromosome sets)?
    answer: '3'
    check: 1+1+1
    difficulty: 2
    hints:
    - Two polar nuclei + one male gamete.
    - n + n + n.
    solution: Triploid (3n).
    mistakes: {"2": "b11_triple_fusion", "1": "b11_triple_fusion", "5": "b11_triple_fusion"}
  - prompt: 'Heterospory in Selaginella is seen as a step towards:'
    options:
    - the seed habit
    - losing leaves
    - aquatic life
    - parasitism
    answer: the seed habit
    difficulty: 2
    hints:
    - Two kinds of spores.
    - Megaspore retained.
    solution: Seed habit.
    mistakes: {"losing leaves": "b11_heterospory", "aquatic life": "b11_heterospory", "parasitism": "b11_heterospory"}
  - prompt: 'Coralloid roots of Cycas contain:'
    options:
    - cyanobacteria
    - fungi
    - nematodes
    - mosses
    answer: cyanobacteria
    difficulty: 2
    hints:
    - Nitrogen fixers.
    - Anabaena.
    solution: Cyanobacteria.
    mistakes: {"fungi": "b11_coralloid", "nematodes": "b11_coralloid", "mosses": "b11_coralloid"}
  - prompt: 'Double fertilisation is a characteristic of:'
    options:
    - angiosperms
    - gymnosperms
    - pteridophytes
    - bryophytes
    answer: angiosperms
    difficulty: 1
    hints:
    - Syngamy + triple fusion.
    - Flowering plants.
    solution: Angiosperms.
    mistakes: {"gymnosperms": "b11_double_fert", "pteridophytes": "b11_double_fert", "bryophytes": "b11_double_fert"}
