# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-bio
chapter: 3
title: Plant Kingdom
tips:
  c11b_alternation: In bryophytes the gametophyte (haploid) is dominant; from pteridophytes onward the sporophyte (diploid) is dominant.
  c11b_seed: Gymnosperms have naked seeds (no fruit); angiosperms have seeds enclosed in a fruit.
concepts:
- code: cbse11b.plants.lower
  title: Algae and bryophytes
  notes: |
    Classification systems: artificial (Linnaeus), natural, phylogenetic; numerical, cyto-, chemotaxonomy. Algae: simple,
    thalloid, mostly aquatic, photosynthetic; reproduction vegetative, asexual (zoospores), sexual (isogamous, anisogamous,
    oogamous). Chlorophyceae (green, chlorophyll a,b, starch: Chlamydomonas, Spirogyra), Phaeophyceae (brown, fucoxanthin,
    laminarin: Laminaria, Sargassum), Rhodophyceae (red, r-phycoerythrin, floridean starch: Polysiphonia, Gracilaria).
    Uses: agar, carrageen, algin, Chlorella as food. Bryophytes: amphibians of the plant kingdom; gametophyte dominant;
    rhizoids; liverworts (Marchantia, gemmae) and mosses (Funaria, Sphagnum—peat).
  explanations:
    text: 'Algae are simple water plants without true roots, stems or leaves. They are grouped by colour: green, brown and red. Bryophytes, like mosses, are small land plants that still need water for fertilisation: the ''amphibians'' of the plant world.'
    visual: 'Draw a moss: a leafy green plant (the gametophyte) with a thin stalk and capsule on top (the sporophyte), which depends on the green part for food.'
    step_by_step: 'Step 1: Thalloid and mostly aquatic? Algae; sort by pigment. Step 2: Small land plant with rhizoids and dominant gametophyte? Bryophyte.'
    real_world: Agar, used to grow bacteria in labs and to set jelly desserts, comes from red algae like Gracilaria.
  picture:
    kind: compare
    columns:
    - title: Algae
      points:
      - green
      - brown
      - red
    - title: Pigment
      points:
      - chlorophyll a and b
      - fucoxanthin
      - r-phycoerythrin
    - title: Example
      points:
      - Spirogyra
      - Laminaria
      - Polysiphonia
    alt: Three classes of algae with their main pigment and an example.
  items:
  - prompt: 'Agar is obtained from:'
    options:
    - red algae
    - green algae
    - brown algae
    - mosses
    answer: red algae
    difficulty: 1
    hints:
    - Gracilaria, Gelidium.
    - Rhodophyceae.
    solution: Red algae.
  - prompt: 'Bryophytes are called the amphibians of the plant kingdom because:'
    options:
    - they live on land but need water for fertilisation
    - they live only in water
    - they have no chlorophyll
    - they eat insects
    answer: they live on land but need water for fertilisation
    difficulty: 1
    hints:
    - Sperm swim.
    - Moist places.
    solution: They need water to reproduce sexually.
  - prompt: 'The dominant phase in a moss is the:'
    options:
    - gametophyte
    - sporophyte
    - seed
    - embryo
    answer: gametophyte
    difficulty: 2
    hints:
    - Haploid green plant.
    - Sporophyte depends on it.
    solution: The gametophyte.
    mistakes:
      sporophyte: c11b_alternation
  - prompt: 'Peat, used as fuel, comes from:'
    options:
    - Sphagnum
    - Funaria
    - Marchantia
    - Spirogyra
    answer: Sphagnum
    difficulty: 2
    hints:
    - A moss.
    - Bogs.
    solution: Sphagnum moss.
  - prompt: 'Fucoxanthin is the characteristic pigment of:'
    options:
    - brown algae
    - red algae
    - green algae
    - liverworts
    answer: brown algae
    difficulty: 2
    hints:
    - Phaeophyceae.
    - Brown colour.
    solution: Brown algae.
  - prompt: 'Marchantia reproduces asexually by:'
    options:
    - gemmae
    - seeds
    - zoospores
    - spores from cones
    answer: gemmae
    difficulty: 2
    hints:
    - Gemma cups.
    - Liverwort.
    solution: Gemmae.
- code: cbse11b.plants.vascular
  title: Pteridophytes, gymnosperms and angiosperms
  after:
  - cbse11b.plants.lower
  notes: |
    Pteridophytes: first terrestrial plants with xylem and phloem; sporophyte dominant with roots, stems, leaves;
    sporangia on sporophylls (strobili); homosporous (most) and heterosporous (Selaginella, Salvinia: precursor to seed
    habit); prothallus gametophyte needs water. Examples: Equisetum, ferns (Dryopteris, Pteris, Adiantum). Gymnosperms: naked
    ovules; cones; Cycas (coralloid roots with cyanobacteria), Pinus (mycorrhiza), Ginkgo; wind pollination. Angiosperms:
    flowering plants, ovules in ovary; dicots and monocots; double fertilisation (syngamy + triple fusion giving 3n
    endosperm). Plant life cycles: haplontic, diplontic, haplo-diplontic.
  explanations:
    text: Pteridophytes, like ferns, were the first plants with tubes (xylem and phloem) to carry water. Gymnosperms, like pine, have seeds but no fruit around them. Angiosperms are flowering plants with seeds inside fruits, and they show double fertilisation.
    visual: Draw a pine cone (naked seeds on scales) next to a mango (seed hidden inside a fruit). That's the gymnosperm–angiosperm difference.
    step_by_step: 'Step 1: Vascular tissue but no seeds? Pteridophyte. Step 2: Naked seeds? Gymnosperm. Step 3: Flowers and seeds in fruits? Angiosperm.'
    real_world: Ferns are popular house plants; their young leaves uncurl like a violin's head, called fiddleheads.
  picture:
    kind: flow
    steps:
    - Algae
    - Bryophytes
    - Pteridophytes (vascular)
    - Gymnosperms (naked seeds)
    - Angiosperms (flowers, fruits)
    alt: 'Plant groups from simplest to most complex: algae, bryophytes, pteridophytes, gymnosperms and angiosperms.'
  items:
  - prompt: 'The first terrestrial plants with vascular tissue were:'
    options:
    - pteridophytes
    - bryophytes
    - algae
    - gymnosperms
    answer: pteridophytes
    difficulty: 1
    hints:
    - Ferns.
    - Xylem and phloem.
    solution: Pteridophytes.
  - prompt: 'Gymnosperms differ from angiosperms in having:'
    options:
    - naked seeds
    - flowers
    - fruits
    - double fertilisation
    answer: naked seeds
    difficulty: 1
    hints:
    - No ovary wall.
    - Pine cone.
    solution: Naked seeds.
    mistakes:
      fruits: c11b_seed
  - prompt: The endosperm of angiosperms forms by triple fusion. What is its ploidy (number of chromosome sets)?
    answer: '3'
    check: 1+1+1
    difficulty: 2
    hints:
    - Two polar nuclei + one male gamete.
    - n + n + n.
    solution: Triploid (3n).
  - prompt: 'Heterospory in Selaginella is seen as a step towards:'
    options:
    - the seed habit
    - losing leaves
    - aquatic life
    - parasitism
    answer: the seed habit
    difficulty: 2
    hints:
    - Two kinds of spores.
    - Megaspore retained.
    solution: Seed habit.
  - prompt: 'Coralloid roots of Cycas contain:'
    options:
    - cyanobacteria
    - fungi
    - nematodes
    - mosses
    answer: cyanobacteria
    difficulty: 2
    hints:
    - Nitrogen fixers.
    - Anabaena.
    solution: Cyanobacteria.
  - prompt: 'Double fertilisation is a characteristic of:'
    options:
    - angiosperms
    - gymnosperms
    - pteridophytes
    - bryophytes
    answer: angiosperms
    difficulty: 1
    hints:
    - Syngamy + triple fusion.
    - Flowering plants.
    solution: Angiosperms.
