# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse11-bio
chapter: 2
title: Biological Classification
tips:
  c11b_kingdoms: 'Whittaker''s five kingdoms: Monera, Protista, Fungi, Plantae, Animalia.'
  c11b_virus: 'Viruses are not placed in any kingdom: they are not cells and can only reproduce inside a host cell.'
concepts:
- code: cbse11b.class.kingdoms
  title: Five kingdoms, Monera and Protista
  notes: |
    Two-kingdom system (Linnaeus) was inadequate. Whittaker (1969) five kingdoms based on cell structure, body organisation,
    mode of nutrition, reproduction, phylogeny: Monera, Protista, Fungi, Plantae, Animalia. Monera: bacteria, prokaryotic;
    shapes coccus, bacillus, vibrium, spirillum; archaebacteria (halophiles, thermoacidophiles, methanogens in cattle
    gut), eubacteria (cyanobacteria like Nostoc, Anabaena fix nitrogen; heterocysts), mycoplasma (no cell wall).
    Protista: unicellular eukaryotes—chrysophytes (diatoms), dinoflagellates (red tides), euglenoids (Euglena),
    slime moulds, protozoans (amoeboid, flagellated like Trypanosoma, ciliated like Paramecium, sporozoans like Plasmodium).
  explanations:
    text: 'Whittaker sorted living things into five kingdoms by their cells, body plan and how they get food. Monera are bacteria: single cells with no nucleus. Protista are single cells with a nucleus, like Amoeba and Euglena.'
    visual: 'Draw a five-branch tree: Monera (no nucleus), Protista (one cell with nucleus), Fungi (absorb food), Plantae (make food) and Animalia (eat food).'
    step_by_step: 'Step 1: Prokaryotic? Monera. Step 2: Eukaryotic and mostly single-celled? Protista. Step 3: Many-celled: absorbs food (Fungi), makes food (Plantae) or ingests it (Animalia).'
    real_world: Methanogen bacteria in cows' stomachs make methane, which is captured in gobar gas plants in Indian villages.
  picture:
    kind: compare
    columns:
    - title: Kingdom
      points:
      - Monera
      - Protista
      - Fungi
      - Plantae
      - Animalia
    - title: Cell type
      points:
      - prokaryotic
      - eukaryotic, mostly one cell
      - eukaryotic
      - eukaryotic
      - eukaryotic
    alt: 'The five kingdoms: Monera are prokaryotic; the other four are eukaryotic.'
  items:
  - prompt: How many kingdoms are there in Whittaker's system?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Monera to Animalia.
    - Count.
    solution: Five.
  - prompt: Which kingdom contains prokaryotes?
    options:
    - Monera
    - Protista
    - Fungi
    - Plantae
    answer: Monera
    difficulty: 1
    hints:
    - Bacteria.
    - No nucleus.
    solution: Monera.
    mistakes:
      Protista: c11b_kingdoms
  - prompt: 'Methanogens are a type of:'
    options:
    - archaebacteria
    - eubacteria
    - fungi
    - protozoa
    answer: archaebacteria
    difficulty: 2
    hints:
    - Extreme conditions.
    - Cattle gut.
    solution: Archaebacteria.
  - prompt: 'Specialised nitrogen-fixing cells in Anabaena are called:'
    options:
    - heterocysts
    - spores
    - cysts
    - akinetes only
    answer: heterocysts
    difficulty: 2
    hints:
    - Cyanobacteria.
    - Thick walls.
    solution: Heterocysts.
  - prompt: 'The malarial parasite Plasmodium is a:'
    options:
    - sporozoan protozoan
    - ciliate
    - bacterium
    - fungus
    answer: sporozoan protozoan
    difficulty: 2
    hints:
    - Spore-like stage.
    - Protista.
    solution: A sporozoan.
  - prompt: 'Organisms with no cell wall, the smallest living cells, are:'
    options:
    - mycoplasma
    - diatoms
    - cyanobacteria
    - yeast
    answer: mycoplasma
    difficulty: 2
    hints:
    - Bacteria without walls.
    - Can live without oxygen.
    solution: Mycoplasma.
- code: cbse11b.class.fungi
  title: Fungi, viruses and lichens
  after:
  - cbse11b.class.kingdoms
  notes: |
    Fungi: heterotrophic (saprophytes, parasites, symbionts), cell wall of chitin, body of hyphae forming mycelium
    (coenocytic or septate). Reproduction: vegetative, asexual spores, sexual (plasmogamy, karyogamy, meiosis). Classes:
    Phycomycetes (Mucor, Rhizopus, Albugo), Ascomycetes (yeast, Penicillium, Neurospora; ascospores), Basidiomycetes
    (mushrooms, rusts, smuts; basidiospores), Deuteromycetes (imperfect fungi). Viruses: nucleoprotein, RNA or DNA, obligate
    parasites; TMV (Ivanowsky, Stanley crystallised); bacteriophages; viroids (free RNA, potato spindle tuber); prions
    (abnormal proteins: mad cow disease). Lichens: algae (phycobiont) + fungi (mycobiont); pollution indicators.
  explanations:
    text: Fungi feed by absorbing food from dead or living things; their bodies are threads called hyphae. Viruses aren't cells at all, just genetic material in a protein coat, so they aren't in any kingdom. Lichens are partnerships of a fungus and an alga.
    visual: 'Draw a lichen as two partners: the alga makes food by photosynthesis and shares it; the fungus gives shelter and absorbs water and minerals.'
    step_by_step: 'Step 1: Cell wall of chitin and absorbs food? A fungus. Step 2: Not a cell, multiplies only in a host? A virus. Step 3: Alga + fungus together? A lichen.'
    real_world: Lichens don't grow in polluted cities, so ecologists use them to judge air quality.
  picture:
    kind: compare
    columns:
    - title: Group
      points:
      - Phycomycetes
      - Ascomycetes
      - Basidiomycetes
      - Deuteromycetes
    - title: Example
      points:
      - Rhizopus (bread mould)
      - yeast, Penicillium
      - mushroom, rust
      - imperfect fungi
    alt: Four classes of fungi with an example of each.
  items:
  - prompt: 'The cell wall of fungi is made of:'
    options:
    - chitin
    - cellulose
    - peptidoglycan
    - silica
    answer: chitin
    difficulty: 1
    hints:
    - Also in insect skeletons.
    - Not cellulose.
    solution: Chitin.
  - prompt: 'Mushrooms belong to:'
    options:
    - Basidiomycetes
    - Ascomycetes
    - Phycomycetes
    - Deuteromycetes
    answer: Basidiomycetes
    difficulty: 2
    hints:
    - Basidiospores.
    - Club fungi.
    solution: Basidiomycetes.
  - prompt: 'Viruses are not included in the five kingdoms because:'
    options:
    - they are not cells
    - they are too small to see
    - they cause disease
    - they contain DNA
    answer: they are not cells
    difficulty: 2
    hints:
    - No cytoplasm or metabolism.
    - Need a host.
    solution: They are not cellular.
    mistakes:
      they cause disease: c11b_virus
  - prompt: 'A lichen is an association between:'
    options:
    - an alga and a fungus
    - a bacterium and a plant
    - two fungi
    - a virus and a bacterium
    answer: an alga and a fungus
    difficulty: 1
    hints:
    - Phycobiont + mycobiont.
    - Partnership.
    solution: An alga and a fungus.
  - prompt: 'Free infectious RNA with no protein coat is a:'
    options:
    - viroid
    - prion
    - bacteriophage
    - plasmid
    answer: viroid
    difficulty: 2
    hints:
    - Potato spindle tuber disease.
    - Smaller than a virus.
    solution: A viroid.
  - prompt: Who first crystallised a virus (TMV)?
    options:
    - W.M. Stanley
    - D.J. Ivanowsky
    - M.W. Beijerinck
    - Louis Pasteur
    answer: W.M. Stanley
    difficulty: 2
    hints:
    - '1935.'
    - Showed viruses can crystallise.
    solution: Stanley.
