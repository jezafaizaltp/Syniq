# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse11-bio
chapter: 2
title: Biological Classification
tips:
  c11b_kingdoms: 'Whittaker''s five kingdoms: Monera, Protista, Fungi, Plantae, Animalia.'
  c11b_virus: 'Viruses are not placed in any kingdom: they are not cells and can only reproduce inside a host cell.'
  b11_archaea: "Methanogens live in extreme places like marshes and cow guts. Which ancient bacterial group is known for extreme habitats?"
  b11_chitin: "Cellulose is plant walls, peptidoglycan bacterial walls. Fungi share their wall material with insect shells."
  b11_heterocyst: "These are special thick-walled cells, different ('hetero') from the rest of the filament."
  b11_lichen: "Lichens: one partner makes food by photosynthesis, the other gives shelter and water."
  b11_mushroom: "Mushrooms make spores on club-shaped structures (basidia). The group is named after them."
  b11_mycoplasma: "Diatoms have silica shells, cyanobacteria and yeast have walls. Which tiny organisms lack a wall entirely?"
  b11_plasmodium: "Plasmodium has no cilia and no way to move; it spreads by spore-like stages through mosquitoes."
  b11_tmv: "Ivanowsky and Beijerinck described the infectious agent; crystallising it came later, in 1935, by an American."
  b11_viroid: "A prion is protein only; a viroid is the reverse. Which is 'bare RNA'?"
  b11_whittaker: "Whittaker's kingdoms: Monera, Protista, Fungi, Plantae, Animalia. Count them."
concepts:
- code: cbse11b.class.kingdoms
  title: Five kingdoms, Monera and Protista
  notes: |
    Two-kingdom system (Linnaeus) was inadequate. Whittaker (1969) five kingdoms based on cell structure, body organisation,
    mode of nutrition, reproduction, phylogeny: Monera, Protista, Fungi, Plantae, Animalia. Monera: bacteria, prokaryotic;
    shapes coccus, bacillus, vibrium, spirillum; archaebacteria (halophiles, thermoacidophiles, methanogens in cattle
    gut), eubacteria (cyanobacteria like Nostoc, Anabaena fix nitrogen; heterocysts), mycoplasma (no cell wall).
    Protista: unicellular eukaryotes—chrysophytes (diatoms), dinoflagellates (red tides), euglenoids (Euglena),
    slime moulds, protozoans (amoeboid, flagellated like Trypanosoma, ciliated like Paramecium, sporozoans like Plasmodium).
  explanations:
    text: 'Whittaker sorted living things into five kingdoms by their cells, body plan and how they get food. Monera are bacteria: single cells with no nucleus. Protista are single cells with a nucleus, like Amoeba and Euglena.'
    visual: 'Draw a five-branch tree: Monera (no nucleus), Protista (one cell with nucleus), Fungi (absorb food), Plantae (make food) and Animalia (eat food).'
    step_by_step: 'Step 1: Prokaryotic? Monera. Step 2: Eukaryotic and mostly single-celled? Protista. Step 3: Many-celled: absorbs food (Fungi), makes food (Plantae) or ingests it (Animalia).'
    real_world: Methanogen bacteria in cows' stomachs make methane, which is captured in gobar gas plants in Indian villages.
  picture:
    kind: compare
    columns:
    - title: Kingdom
      points:
      - Monera
      - Protista
      - Fungi
      - Plantae
      - Animalia
    - title: Cell type
      points:
      - prokaryotic
      - eukaryotic, mostly one cell
      - eukaryotic
      - eukaryotic
      - eukaryotic
    alt: 'The five kingdoms: Monera are prokaryotic; the other four are eukaryotic.'
  activity:
    type: sort
    prompt: 'Five kingdoms (Whittaker): sort each organism.'
    bins:
    - Monera
    - Protista
    - Fungi
    - Plantae
    - Animalia
    items:
    - label: Bacteria such as Lactobacillus
      bin: Monera
      clue: Does its cell have a nucleus with a membrane?
      why: 'Bacteria are prokaryotes with no true nucleus: Monera.'
    - label: Nostoc, a cyanobacterium
      bin: Monera
      clue: It photosynthesises, but is its cell prokaryotic?
      why: Cyanobacteria are prokaryotes, so they belong with bacteria, not plants.
    - label: Amoeba
      bin: Protista
      clue: One cell with a nucleus. Is it a plant, animal or fungus?
      why: Single-celled eukaryotes go in Protista.
    - label: Diatoms
      bin: Protista
      clue: Single-celled, with a nucleus and silica walls. Which kingdom?
      why: Diatoms are single-celled eukaryotes, the chrysophytes of Protista.
    - label: Euglena
      bin: Protista
      clue: It photosynthesises in light and feeds in the dark. One cell or many?
      why: 'A single-celled eukaryote that is part plant-like, part animal-like: Protista.'
    - label: Yeast
      bin: Fungi
      clue: Does it photosynthesise? What is its wall made of?
      why: 'Yeast has a chitin wall and absorbs food: a single-celled fungus.'
    - label: Mushroom (Agaricus)
      bin: Fungi
      clue: Does it have chlorophyll? How does it feed?
      why: 'No chlorophyll; it absorbs food from dead matter, with chitin walls: Fungi.'
    - label: Moss (Funaria)
      bin: Plantae
      clue: Is it many-celled, with chlorophyll and cellulose walls?
      why: 'A many-celled photosynthetic eukaryote: Plantae.'
    - label: Fern
      bin: Plantae
      clue: Many-celled, green, with vascular tissue. Which kingdom?
      why: Ferns are plants.
    - label: Sponge
      bin: Animalia
      clue: Does it have cell walls? How does it get food?
      why: 'Sponges are many-celled, have no cell walls and take in food: animals.'
    - label: Earthworm
      bin: Animalia
      clue: Many-celled, no cell walls, eats food. Which kingdom?
      why: Animalia.
  items:
  - prompt: How many kingdoms are there in Whittaker's system?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Monera to Animalia.
    - Count.
    solution: Five.
    mistakes: {"3": "b11_whittaker", "4": "b11_whittaker", "6": "b11_whittaker"}
  - prompt: Which kingdom contains prokaryotes?
    options:
    - Monera
    - Protista
    - Fungi
    - Plantae
    answer: Monera
    difficulty: 1
    hints:
    - Bacteria.
    - No nucleus.
    solution: Monera.
    mistakes:
      Protista: c11b_kingdoms
  - prompt: 'Methanogens are a type of:'
    options:
    - archaebacteria
    - eubacteria
    - fungi
    - protozoa
    answer: archaebacteria
    difficulty: 2
    hints:
    - Extreme conditions.
    - Cattle gut.
    solution: Archaebacteria.
    mistakes: {"eubacteria": "b11_archaea", "fungi": "b11_archaea", "protozoa": "b11_archaea"}
  - prompt: 'Specialised nitrogen-fixing cells in Anabaena are called:'
    options:
    - heterocysts
    - spores
    - cysts
    - akinetes only
    answer: heterocysts
    difficulty: 2
    hints:
    - Cyanobacteria.
    - Thick walls.
    solution: Heterocysts.
    mistakes: {"spores": "b11_heterocyst", "cysts": "b11_heterocyst", "akinetes only": "b11_heterocyst"}
  - prompt: 'The malarial parasite Plasmodium is a:'
    options:
    - sporozoan protozoan
    - ciliate
    - bacterium
    - fungus
    answer: sporozoan protozoan
    difficulty: 2
    hints:
    - Spore-like stage.
    - Protista.
    solution: A sporozoan.
    mistakes: {"ciliate": "b11_plasmodium", "bacterium": "b11_plasmodium", "fungus": "b11_plasmodium"}
  - prompt: 'Organisms with no cell wall, the smallest living cells, are:'
    options:
    - mycoplasma
    - diatoms
    - cyanobacteria
    - yeast
    answer: mycoplasma
    difficulty: 2
    hints:
    - Bacteria without walls.
    - Can live without oxygen.
    solution: Mycoplasma.
    mistakes: {"diatoms": "b11_mycoplasma", "cyanobacteria": "b11_mycoplasma", "yeast": "b11_mycoplasma"}
- code: cbse11b.class.fungi
  title: Fungi, viruses and lichens
  after:
  - cbse11b.class.kingdoms
  notes: |
    Fungi: heterotrophic (saprophytes, parasites, symbionts), cell wall of chitin, body of hyphae forming mycelium
    (coenocytic or septate). Reproduction: vegetative, asexual spores, sexual (plasmogamy, karyogamy, meiosis). Classes:
    Phycomycetes (Mucor, Rhizopus, Albugo), Ascomycetes (yeast, Penicillium, Neurospora; ascospores), Basidiomycetes
    (mushrooms, rusts, smuts; basidiospores), Deuteromycetes (imperfect fungi). Viruses: nucleoprotein, RNA or DNA, obligate
    parasites; TMV (Ivanowsky, Stanley crystallised); bacteriophages; viroids (free RNA, potato spindle tuber); prions
    (abnormal proteins: mad cow disease). Lichens: algae (phycobiont) + fungi (mycobiont); pollution indicators.
  explanations:
    text: Fungi feed by absorbing food from dead or living things; their bodies are threads called hyphae. Viruses aren't cells at all, just genetic material in a protein coat, so they aren't in any kingdom. Lichens are partnerships of a fungus and an alga.
    visual: 'Draw a lichen as two partners: the alga makes food by photosynthesis and shares it; the fungus gives shelter and absorbs water and minerals.'
    step_by_step: 'Step 1: Cell wall of chitin and absorbs food? A fungus. Step 2: Not a cell, multiplies only in a host? A virus. Step 3: Alga + fungus together? A lichen.'
    real_world: Lichens don't grow in polluted cities, so ecologists use them to judge air quality.
  picture:
    kind: compare
    columns:
    - title: Group
      points:
      - Phycomycetes
      - Ascomycetes
      - Basidiomycetes
      - Deuteromycetes
    - title: Example
      points:
      - Rhizopus (bread mould)
      - yeast, Penicillium
      - mushroom, rust
      - imperfect fungi
    alt: Four classes of fungi with an example of each.
  activity:
    type: sort
    prompt: Sort each fungus into its class.
    bins:
    - Phycomycetes
    - Ascomycetes
    - Basidiomycetes
    - Deuteromycetes
    items:
    - label: Mucor
      bin: Phycomycetes
      clue: Are its hyphae divided by walls (septate)?
      why: 'Aseptate, coenocytic hyphae and spores in sporangia: Phycomycetes.'
    - label: Rhizopus, bread mould
      bin: Phycomycetes
      clue: Do its hyphae have cross-walls?
      why: 'No cross-walls; sporangiospores: Phycomycetes.'
    - label: Albugo, white rust of mustard
      bin: Phycomycetes
      clue: Does it make zoospores in water or damp places?
      why: A parasitic phycomycete with aseptate hyphae.
    - label: Penicillium
      bin: Ascomycetes
      clue: Its sexual spores form inside a sac. What is the sac called?
      why: 'Sexual spores in an ascus: Ascomycetes (sac fungi).'
    - label: Aspergillus
      bin: Ascomycetes
      clue: Septate hyphae, conidia, and ascospores in sacs. Which class?
      why: Ascomycetes.
    - label: Neurospora
      bin: Ascomycetes
      clue: Used in genetics, it makes spores in sacs. Which class?
      why: 'Ascospores in asci: Ascomycetes.'
    - label: Agaricus, mushroom
      bin: Basidiomycetes
      clue: Its spores form on a club-shaped cell. What is it called?
      why: 'Basidiospores on a basidium: Basidiomycetes.'
    - label: Ustilago, smut
      bin: Basidiomycetes
      clue: Does it make basidiospores?
      why: 'Smuts are club fungi: Basidiomycetes.'
    - label: Puccinia, rust of wheat
      bin: Basidiomycetes
      clue: Is it a club fungus?
      why: 'Rusts form basidiospores: Basidiomycetes.'
    - label: Alternaria
      bin: Deuteromycetes
      clue: Has a sexual stage ever been found?
      why: Only asexual spores are known, so it is an 'imperfect fungus'.
    - label: Trichoderma
      bin: Deuteromycetes
      clue: Is a sexual stage known?
      why: 'No sexual stage known: Deuteromycetes.'
    - label: Colletotrichum
      bin: Deuteromycetes
      clue: Only conidia are known. Which class?
      why: 'Imperfect fungi: Deuteromycetes.'
  items:
  - prompt: 'The cell wall of fungi is made of:'
    options:
    - chitin
    - cellulose
    - peptidoglycan
    - silica
    answer: chitin
    difficulty: 1
    hints:
    - Also in insect skeletons.
    - Not cellulose.
    solution: Chitin.
    mistakes: {"cellulose": "b11_chitin", "peptidoglycan": "b11_chitin", "silica": "b11_chitin"}
  - prompt: 'Mushrooms belong to:'
    options:
    - Basidiomycetes
    - Ascomycetes
    - Phycomycetes
    - Deuteromycetes
    answer: Basidiomycetes
    difficulty: 2
    hints:
    - Basidiospores.
    - Club fungi.
    solution: Basidiomycetes.
    mistakes: {"Ascomycetes": "b11_mushroom", "Phycomycetes": "b11_mushroom", "Deuteromycetes": "b11_mushroom"}
  - prompt: 'Viruses are not included in the five kingdoms because:'
    options:
    - they are not cells
    - they are too small to see
    - they cause disease
    - they contain DNA
    answer: they are not cells
    difficulty: 2
    hints:
    - No cytoplasm or metabolism.
    - Need a host.
    solution: They are not cellular.
    mistakes:
      they cause disease: c11b_virus
  - prompt: 'A lichen is an association between:'
    options:
    - an alga and a fungus
    - a bacterium and a plant
    - two fungi
    - a virus and a bacterium
    answer: an alga and a fungus
    difficulty: 1
    hints:
    - Phycobiont + mycobiont.
    - Partnership.
    solution: An alga and a fungus.
    mistakes: {"a bacterium and a plant": "b11_lichen", "two fungi": "b11_lichen", "a virus and a bacterium": "b11_lichen"}
  - prompt: 'Free infectious RNA with no protein coat is a:'
    options:
    - viroid
    - prion
    - bacteriophage
    - plasmid
    answer: viroid
    difficulty: 2
    hints:
    - Potato spindle tuber disease.
    - Smaller than a virus.
    solution: A viroid.
    mistakes: {"prion": "b11_viroid", "bacteriophage": "b11_viroid", "plasmid": "b11_viroid"}
  - prompt: Who first crystallised a virus (TMV)?
    options:
    - W.M. Stanley
    - D.J. Ivanowsky
    - M.W. Beijerinck
    - Louis Pasteur
    answer: W.M. Stanley
    difficulty: 2
    hints:
    - '1935.'
    - Showed viruses can crystallise.
    solution: Stanley.
    mistakes: {"D.J. Ivanowsky": "b11_tmv", "M.W. Beijerinck": "b11_tmv", "Louis Pasteur": "b11_tmv"}
