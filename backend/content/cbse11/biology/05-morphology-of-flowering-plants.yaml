    - Count.
    solution: Four.
    mistakes: {"3": "b11_whorls", "5": "b11_whorls"}
  - prompt: 'A guava flower with the ovary below the other parts is:'
    options:
    - epigynous
    - hypogynous
    - perigynous
    - agynous
    answer: epigynous
    difficulty: 2
    hints:
    - Inferior ovary.
    - Parts on top.
    solution: Epigynous.
    mistakes:
      hypogynous: c11b_ovary
  - prompt: 'A fruit that develops without fertilisation is:'
    options:
    - parthenocarpic
    - aggregate
    - composite
