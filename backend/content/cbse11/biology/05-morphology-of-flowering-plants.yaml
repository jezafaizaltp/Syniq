  - prompt: 'Assertion (A): Mango is called a drupe.

      Reason (R): Its fruit develops from a monocarpellary superior ovary and has a stony endocarp.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. A drupe has one seed inside a hard endocarp, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): A seed develops from the ovary.

      Reason (R): After fertilisation the ovules develop into seeds.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: the ovary becomes the fruit and ovules become seeds. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A flower has its sepals, petals and stamens attached above the ovary, and the ovary is sunk into the thalamus. What is its position?'
    options:
    - Epigynous, inferior ovary
    - Hypogynous, superior ovary
    - Perigynous, half-inferior ovary
    answer: Epigynous, inferior ovary
    hints:
    - Are the other parts above or below the ovary?
    - An ovary below the other parts is called what?
    solution: When other parts arise above the ovary, the flower is epigynous and the ovary is inferior.
    mistakes:
      Hypogynous, superior ovary: c11b_ovary
      Perigynous, half-inferior ovary: c11b_ovary
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student cuts across a mustard ovary and sees ovules on the inner wall of a single chamber that later gets a false partition. What placentation is this?'
    options:
