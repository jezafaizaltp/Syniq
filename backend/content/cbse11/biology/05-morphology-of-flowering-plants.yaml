    - Fabaceae
    - Liliaceae
    - Brassicaceae
    answer: Solanaceae
    difficulty: 2
    hints:
    - Potato family.
    - Solanum.
    solution: Solanaceae.
    mistakes: {"Fabaceae": "b11_solanaceae", "Liliaceae": "b11_solanaceae", "Brassicaceae": "b11_solanaceae"}
  - prompt: 'Onion and lily belong to the family:'
    options:
    - Liliaceae
    - Fabaceae
    - Solanaceae
    answer: Liliaceae
