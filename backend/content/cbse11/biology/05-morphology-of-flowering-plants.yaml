# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse11-bio
chapter: 5
title: Morphology of Flowering Plants
tips:
  c11b_root: "Tap roots grow from the radicle in most dicots. Wheat is a grass, a monocot: its roots spring from the base of the stem as a tuft."
  c11b_ovary: "'Hypo' means below and 'epi' means upon. If the ovary is below the other parts, the other parts sit upon it."
  b11_cactus_spine: "Cactus stems do the photosynthesis. Which organ was reduced to stop water loss?"
  b11_fabaceae: "Pea and beans are legumes with pods. The family is named after the Latin word for bean, 'faba'."
  b11_parthenocarpy: "Seedless bananas form without fertilisation. 'Partheno' means virgin."
  b11_pinnate: "Neem leaflets are arranged along a central axis like a feather (pinna)."
  b11_pneumatophore: "Mangrove mud has little air. Roots grow upward out of the mud to do what?"
  b11_potato: "A potato has 'eyes' (nodes with buds). Roots don't have nodes or buds."
  b11_scutellum: "In grasses the single cotyledon is shield-shaped. Coleoptile covers the plumule."
  b11_solanaceae: "Potato, tomato and brinjal belong to the potato family, named after Solanum."
  b11_venation: "Grass and banana leaves have veins running side by side. Which group is grass?"
  b11_whorls: "Calyx, corolla, androecium, gynoecium. Count them."
  c11b05_veg: "Ask where the part grows from and whether it has nodes, buds or scale leaves. Nodes and buds point to one organ, even underground."
  c11b05_flower: "Find where the ovary sits compared with the other flower parts, then match the line in the formula to that position."
concepts:
- code: cbse11b.morph.vegetative
  title: Root, stem and leaf
  notes: |
    Root: tap root (mustard), fibrous (wheat), adventitious (grass, banyan); regions: root cap, meristematic, elongation,
    maturation (root hairs). Modifications: storage (carrot, turnip, sweet potato), prop roots (banyan), stilt roots (maize,
    sugarcane), pneumatophores (Rhizophora). Stem: nodes, internodes, buds; modifications: underground storage (potato
    tuber, ginger rhizome, onion bulb, colocasia corm), tendrils (cucumber), thorns (Bougainvillea, Citrus), phylloclade
    (Opuntia), runners/stolons/offsets. Leaf: base, petiole, lamina; venation reticulate (dicots) or parallel (monocots);
    simple and compound (pinnate: neem; palmate: silk cotton); phyllotaxy alternate, opposite, whorled; modified as
    tendrils (pea), spines (cactus).
  explanations:
    text: 'Roots hold the plant and absorb water; stems carry water and food and hold up leaves; leaves make food. Each can be modified for special jobs: carrots store food in roots, potatoes in stems, and cactus spines are leaves.'
    visual: 'Draw a potato with its ''eyes'': each eye is a bud at a node, which proves the potato is a stem, not a root.'
    step_by_step: 'Step 1: Look for nodes and buds (stem). Step 2: Look for a root cap and no nodes (root). Step 3: Check leaf venation: net (dicot) or parallel (monocot).'
    real_world: Mangroves along Kerala's coast have breathing roots (pneumatophores) that stick up out of the salty mud.
  picture:
    kind: compare
    columns:
    - title: Food store
      points:
      - carrot
      - potato
      - ginger
      - onion
    - title: Plant part
      points:
      - tap root
      - stem tuber
      - rhizome (stem)
      - bulb (leaves)
    alt: Food storage organs and the part of the plant each one comes from.
  activity:
    type: sort
    prompt: Which part of the plant has been modified?
    bins:
    - Root
    - Stem
    - Leaf
    items:
    - label: Carrot
      bin: Root
      clue: Does it have nodes, buds or leaves on it?
      why: 'No nodes or buds: a tap root swollen with food.'
    - label: Sweet potato
      bin: Root
      clue: Does it have eyes (buds) like a potato?
      why: A swollen adventitious root, with no nodes.
    - label: Pneumatophores of mangroves
      bin: Root
      clue: Do these grow up out of the mud to breathe?
      why: Breathing roots that grow upward in swamps.
    - label: Prop roots of banyan
      bin: Root
      clue: Do they grow down from branches into the soil?
      why: Hanging adventitious roots that support the branches.
    - label: Potato
      bin: Stem
      clue: Look for 'eyes'. What are they?
      why: The eyes are buds at nodes, so a potato is a stem tuber.
    - label: Ginger
      bin: Stem
      clue: Does it have nodes and scale leaves?
      why: Nodes and buds mark it as an underground stem (rhizome).
    - label: Thorns of Citrus
      bin: Stem
      clue: 'Where does a thorn grow: from a leaf base or an axillary bud?'
      why: Thorns grow from axillary buds, so they are modified stems.
    - label: Tendrils of cucumber
      bin: Stem
      clue: Do they grow from axillary buds?
      why: 'Cucumber tendrils come from axillary buds: stem tendrils.'
    - label: Flattened green stem of Opuntia
      bin: Stem
      clue: It looks like a leaf. Does it have nodes?
      why: A flattened stem (phylloclade) does the photosynthesis.
    - label: Spines of cactus
      bin: Leaf
      clue: 'Where do the spines grow: as leaves or from buds?'
      why: Leaves reduced to spines cut water loss.
    - label: Tendrils of pea
      bin: Leaf
      clue: Do they grow where leaflets would be?
      why: Pea tendrils are modified leaflets.
    - label: Pitcher of a pitcher plant
      bin: Leaf
      clue: Which part forms the pitcher and its lid?
      why: The leaf is modified into a pitcher that traps insects.
  lesson:
    - teach: 'Roots: tap root (main root with branches, mustard), fibrous (many equal roots, wheat) and adventitious (from other parts, banyan prop roots). Some store food (carrot), some prop the plant (maize stilt roots), some breathe (mangrove pneumatophores).'
      check:
        prompt: 'A carrot is a modified:'
        options:
        - tap root
        - stem
        - leaf
        answer: tap root
        why: It stores food in the main root.
      ways:
      - style: visual
        teach: Three kinds of root system, with what each looks like.
        picture:
          kind: compare
          columns:
          - title: Tap root
            points:
            - one main root from the radicle
            - side branches
            - mustard, gram
          - title: Fibrous root
            points:
            - many roots of equal size
            - from the base of the stem
            - rice, grasses
          - title: Adventitious root
            points:
            - grows from a part other than the radicle
            - Monstera, prop roots
          alt: A tap root has one main root with branches; a fibrous system has many equal roots from the stem base; adventitious roots grow from parts other than the radicle.
      - style: real_world
        teach: Pull up a mustard seedling and a rice seedling in a school garden. Mustard comes out with one thick root and thin branches; rice comes out with a tuft of thin roots all alike. Carrot and radish are swollen tap roots that store food.
    - teach: 'Stems have nodes, internodes and buds. Modified stems: potato tuber (eyes are buds), ginger rhizome, onion bulb, tendrils (cucumber), thorns (Citrus), flat green phylloclades (Opuntia), runners.'
      check:
        prompt: Why is a potato a stem, not a root?
        options:
        - it has nodes with buds (eyes)
        - it grows underground
        - it stores starch
        answer: it has nodes with buds (eyes)
        why: Buds are a stem feature.
      ways:
      - style: visual
        teach: Underground and above-ground modified stems, and how to tell they are stems.
        picture:
          kind: compare
          columns:
          - title: Underground stems
            points:
            - 'tuber: potato'
            - 'rhizome: turmeric'
            - 'corm: Colocasia'
            - 'bulb: garlic'
          - title: Above-ground changes
            points:
            - 'tendril: grapevine'
            - 'thorn: Bougainvillea'
            - 'phylloclade: Euphorbia'
            - 'runner: grass'
          alt: Potato, turmeric, Colocasia and garlic are underground stems; tendrils, thorns, flat green phylloclades and runners are stems changed above ground.
      - style: step_by_step
        teach: 'Step 1: Look for nodes and internodes. Step 2: Look for buds or scale leaves at the nodes. Step 3: If a buried part has these, it is a stem, not a root. Step 4: A stem tendril or thorn grows from a bud position, in the axil of a leaf.'
    - teach: 'Leaves: lamina, petiole, base. Venation is reticulate (net, dicots) or parallel (monocots). Compound leaves are pinnate (neem) or palmate (silk cotton). Modified leaves: tendrils (pea), spines (cactus).'
      picture:
        kind: compare
        columns:
        - title: Part
          points:
          - potato
          - ginger
          - pea tendril
          - cactus spine
        - title: Modified from
          points:
          - stem
          - stem
          - leaf
          - leaf
        alt: Common plant modifications and their origin.
      check:
        prompt: 'Net-like (reticulate) venation is typical of:'
        options:
        - dicots
        - monocots
        - both equally
        answer: dicots
        why: Monocots usually have parallel veins.
      ways:
      - style: step_by_step
        teach: 'Step 1: Find the bud. A bud sits in the axil of a whole leaf, never of a leaflet. Step 2: If there is a bud only at the base of the petiole, it is one compound leaf. Step 3: Leaflets along a central axis: pinnate. Step 4: Leaflets from one point at the tip: palmate.'
      - style: real_world
        teach: 'Tear a banana or coconut leaf and it splits neatly along straight lines: the veins run parallel, as in most monocots. Tear a hibiscus leaf and it tears raggedly, because its veins form a net, as in dicots.'
  items:
  - prompt: 'A potato is a modified:'
    options:
    - stem
    - root
    - leaf
    - fruit
    answer: stem
    difficulty: 1
    hints:
    - Has eyes (buds).
    - Nodes.
    solution: A stem (tuber).
    mistakes: {"root": "b11_potato", "leaf": "b11_potato", "fruit": "b11_potato"}
  - prompt: Wheat has which type of root system?
    options:
    - fibrous
    - tap
    - prop
    - pneumatophore
    answer: fibrous
    difficulty: 1
    hints:
    - Monocot.
    - Many thin roots.
    solution: Fibrous.
    mistakes:
      tap: c11b_root
  - prompt: 'Pneumatophores help mangroves to:'
    options:
    - get oxygen for respiration
    - store food
    - climb
    - catch insects
    answer: get oxygen for respiration
    difficulty: 2
    hints:
    - Waterlogged mud.
    - Grow upward.
    solution: They take in air.
    mistakes: {"store food": "b11_pneumatophore", "climb": "b11_pneumatophore", "catch insects": "b11_pneumatophore"}
  - prompt: 'Spines of cactus are modified:'
    options:
    - leaves
    - stems
    - roots
    - flowers
    answer: leaves
    difficulty: 2
    hints:
    - Reduce water loss.
    - The stem is green.
    solution: Leaves.
    mistakes: {"stems": "b11_cactus_spine", "roots": "b11_cactus_spine", "flowers": "b11_cactus_spine"}
  - prompt: 'Parallel venation is typical of:'
    options:
    - monocots
    - dicots
    - gymnosperms
    - ferns
    answer: monocots
    difficulty: 1
    hints:
    - Grass, banana.
    - Veins side by side.
    solution: Monocots.
    mistakes: {"dicots": "b11_venation", "gymnosperms": "b11_venation", "ferns": "b11_venation"}
  - prompt: Neem has which type of compound leaf?
    options:
    - pinnately compound
    - palmately compound
    - simple
    - needle-like
    answer: pinnately compound
    difficulty: 2
    hints:
    - Leaflets along an axis.
    - Like a feather.
    solution: Pinnately compound.
    mistakes: {"palmately compound": "b11_pinnate", "simple": "b11_pinnate", "needle-like": "b11_pinnate"}
  - prompt: 'Ginger is a modified:'
    options:
    - stem (rhizome)
    - root
    - leaf
    answer: stem (rhizome)
    difficulty: 1
    hints:
    - It has nodes and scale leaves.
    - It grows sideways underground.
    solution: 'Step 1: nodes and buds. Step 2: rhizome stem.'
    mistakes:
      root: c11b05_veg
      leaf: c11b05_veg
  - prompt: 'Prop roots that hang down from branches are seen in:'
    options:
    - banyan
    - maize
    - carrot
    answer: banyan
    difficulty: 1
    hints:
    - They support large spreading branches.
    - A big Indian tree.
    solution: 'Step 1: aerial supporting roots. Step 2: banyan.'
    mistakes:
      maize: c11b05_veg
      carrot: c11b05_veg
  - prompt: 'Sweet potato is a modified:'
    options:
    - root
    - stem
    - leaf
    answer: root
    difficulty: 1
    hints:
    - It has no nodes or buds.
    - Compare with potato.
    solution: 'Step 1: no eyes or nodes. Step 2: root.'
    mistakes:
      stem: c11b05_veg
      leaf: c11b05_veg
  - prompt: 'The flat green stem of Opuntia that does photosynthesis is a:'
    options:
    - phylloclade
    - rhizome
    - tendril
    answer: phylloclade
    difficulty: 2
    hints:
    - The leaves are reduced to spines.
    - The stem takes over leaf work.
    solution: 'Step 1: leaf-like stem. Step 2: phylloclade.'
    mistakes:
      rhizome: c11b05_veg
      tendril: c11b05_veg
  - prompt: 'In Citrus and Bougainvillea, thorns are modified:'
    options:
    - axillary buds (stems)
    - leaves
    - roots
    answer: axillary buds (stems)
    difficulty: 2
    hints:
    - They grow from the leaf axil.
    - That is where buds grow.
    solution: 'Step 1: from axillary buds. Step 2: stem thorns.'
    mistakes:
      leaves: c11b05_veg
      roots: c11b05_veg
  - prompt: Leaves arranged two at each node, opposite each other, as in guava, show which phyllotaxy?
    options:
    - opposite
    - alternate
    - whorled
    answer: opposite
    difficulty: 2
    hints:
    - Count leaves at one node.
    - Two facing each other.
    solution: 'Step 1: pair at each node. Step 2: opposite.'
    mistakes:
      alternate: c11b05_veg
      whorled: c11b05_veg
  - prompt: 'Root hairs are found in the region of:'
    options:
    - maturation
    - elongation
    - root cap
    answer: maturation
    difficulty: 2
    hints:
    - They grow from cells that have finished lengthening.
    - They absorb water.
    solution: 'Step 1: cells differentiate there. Step 2: maturation region.'
    mistakes:
      elongation: c11b05_veg
      root cap: c11b05_veg
  - prompt: 'Pistia and water hyacinth spread by short, thick horizontal stems called:'
    options:
    - offsets
    - rhizomes
    - tubers
    answer: offsets
    difficulty: 3
    hints:
    - Each node gives a rosette of leaves and roots.
    - Common in aquatic plants.
    solution: 'Step 1: one-internode runners. Step 2: offsets.'
    mistakes:
      rhizomes: c11b05_veg
      tubers: c11b05_veg
  - prompt: 'Silk cotton has leaflets attached at one point on the petiole tip. Its leaf is:'
    options:
    - palmately compound
    - pinnately compound
    - simple
    answer: palmately compound
    difficulty: 3
    hints:
    - Like fingers on a palm.
    - Neem's leaflets are along a rachis instead.
    solution: 'Step 1: leaflets from one point. Step 2: palmately compound.'
    mistakes:
      pinnately compound: c11b05_veg
      simple: c11b05_veg
  - prompt: 'Assertion (A): A potato is a stem and not a root.

      Reason (R): The eyes of a potato are nodes bearing buds.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Roots have no nodes or buds; the buds in the eyes show it is a stem tuber, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Pneumatophores grow upwards out of the soil.

      Reason (R): Mangrove soil is waterlogged and short of oxygen.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The roots rise above the mud to take in air, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A student digs up a swollen underground part of a plant. It has rings of nodes with small dry scale leaves and buds. Which part has the student found?'
    options:
    - A modified stem
    - A modified root
    - A modified leaf
    answer: A modified stem
    hints:
    - Which plant part has nodes?
    - Roots never carry buds or scale leaves.
    solution: Nodes, scale leaves and buds belong only to stems, so it is an underground stem such as a rhizome.
    mistakes:
      A modified root: c11b05_veg
      A modified leaf: c11b05_veg
    exam: case
    difficulty: 2
  - prompt: 'Situation: A gardener sees thin coiled threads holding a cucumber vine to a fence. They grow from axillary buds. What are they?'
    options:
    - Stem tendrils
    - Leaf tendrils
    - Aerial roots
    answer: Stem tendrils
    hints:
    - Where do they grow from?
    - What grows out of an axillary bud?
    solution: Anything from an axillary bud is a modified stem; in cucumber the tendrils are stem tendrils.
    mistakes:
      Leaf tendrils: c11b05_veg
      Aerial roots: c11b_root
    exam: competency
    difficulty: 2
  - prompt: Name two plants with modified roots that store food.
    options:
    - Carrot and sweet potato
    - Potato and ginger
    - Onion and garlic
    answer: Carrot and sweet potato
    hints:
    - Rule out anything with buds or scale leaves.
    - Which of these have no nodes?
    solution: Carrot (tap root) and sweet potato (adventitious root) store food in roots; potato, ginger, onion and garlic are stems.
    mistakes:
      Potato and ginger: b11_potato
      Onion and garlic: c11b05_veg
    exam: one_mark
    difficulty: 2
- code: cbse11b.morph.flower
  title: Flower, fruit, seed and families
  after:
  - cbse11b.morph.vegetative
  notes: |
    Inflorescence: racemose (main axis grows on) and cymose (main axis ends in a flower). Flower: modified shoot;
    actinomorphic/zygomorphic; bisexual/unisexual; hypogynous (superior ovary: mustard, china rose), perigynous (plum,
    rose), epigynous (inferior ovary: guava, cucumber). Whorls: calyx, corolla (aestivation: valvate, twisted, imbricate,
    vexillary), androecium (epipetalous stamens), gynoecium (apocarpous/syncarpous; placentation: marginal, axile,
    parietal, free central, basal). Fruit: ripened ovary; parthenocarpic fruits. Seed: dicot (bean) and monocot (maize,
    with endosperm, scutellum, coleoptile). Semi-technical description and floral formula; families Fabaceae (pea),
    Solanaceae (potato, tomato), Liliaceae (onion).
  explanations:
    text: 'A flower is a shoot built for reproduction, with four rings of parts: sepals, petals, stamens and carpels. After fertilisation, the ovary becomes a fruit and ovules become seeds. Botanists write a floral formula to describe a flower briefly.'
    visual: 'Draw a flower in cross-section: sepals outside, then petals, then stamens, and the carpel with the ovary at the centre. Mark whether the ovary sits above (superior) or below (inferior) the other parts.'
    step_by_step: 'Step 1: Count each whorl. Step 2: Note symmetry and ovary position. Step 3: Write the floral formula (K, C, A, G). Step 4: Identify the fruit type.'
    real_world: 'Bananas sold in markets are parthenocarpic: they develop without fertilisation, so they have no proper seeds.'
  picture:
    kind: flow
    steps:
    - Calyx (sepals)
    - Corolla (petals)
    - Androecium (stamens)
    - Gynoecium (carpels)
    alt: The four whorls of a flower from outside to inside.
  activity:
    type: sort
    prompt: Where does the ovary sit compared with the other floral parts?
    bins:
    - Superior (hypogynous)
    - Half-inferior (perigynous)
    - Inferior (epigynous)
    items:
    - label: Mustard
      bin: Superior (hypogynous)
      clue: Do the petals and sepals grow from below the ovary?
      why: The ovary sits on top, with the other parts below it.
    - label: China rose (hibiscus)
      bin: Superior (hypogynous)
      clue: Is the ovary at the highest point of the thalamus?
      why: The other parts arise below the ovary.
    - label: Brinjal
      bin: Superior (hypogynous)
      clue: Where are the sepals compared with the ovary?
      why: Sepals, petals and stamens arise below the ovary.
    - label: Plum
      bin: Half-inferior (perigynous)
      clue: Do the other parts arise from a rim around the ovary, at about its level?
      why: The thalamus forms a cup, with the parts on its rim at the ovary's level.
    - label: Rose
      bin: Half-inferior (perigynous)
      clue: Is the ovary inside a cup, with parts on the rim?
      why: A cup-shaped thalamus, parts at the same level as the ovary.
    - label: Peach
      bin: Half-inferior (perigynous)
      clue: Is the thalamus a cup around the ovary but not fused to it?
      why: The ovary is half-inferior.
    - label: Guava
      bin: Inferior (epigynous)
      clue: Look for the sepal remains on the fruit. Top or bottom?
      why: 'The sepals are on top of the fruit: the thalamus has grown around the ovary and fused with it.'
    - label: Cucumber
      bin: Inferior (epigynous)
      clue: Is the flower above the young fruit?
      why: The ovary is fused inside the thalamus, with the other parts above it.
    - label: Ray florets of sunflower
      bin: Inferior (epigynous)
      clue: Do the other parts arise above the ovary?
      why: The ovary is below, fused with the thalamus.
  lesson:
    - teach: 'A flower is a modified shoot with four whorls: calyx (sepals), corolla (petals), androecium (stamens) and gynoecium (carpels). In racemose inflorescence the main axis keeps growing; in cymose it ends in a flower.'
      check:
        prompt: 'The male whorl of a flower is the:'
        options:
        - androecium
        - gynoecium
        - calyx
        answer: androecium
        why: Andro means male.
      ways:
      - style: visual
        teach: The four whorls of a flower from outside to inside.
        picture:
          kind: flow
          steps:
          - 'Calyx: sepals, protect the bud'
          - 'Corolla: petals, attract insects'
          - 'Androecium: stamens, make pollen'
          - 'Gynoecium: carpels, hold ovules'
          alt: From outside in, a flower has the calyx of sepals, the corolla of petals, the androecium of stamens and the gynoecium of carpels.
      - style: real_world
        teach: 'Pull apart a hibiscus flower: green sepals outside, five red petals, a long column of many stamens, and the stigma lobes at its tip. Count each ring and you have counted the four whorls.'
    - teach: 'Ovary position: hypogynous (superior ovary, mustard), perigynous (half, rose), epigynous (inferior ovary, guava, cucumber). Placentation: marginal (pea), axile (tomato), parietal (mustard), free central (Dianthus), basal (sunflower).'
      check:
        prompt: 'In mustard the ovary is:'
        options:
        - superior (hypogynous)
        - inferior (epigynous)
        - half-inferior
        answer: superior (hypogynous)
        why: Other parts attach below it.
      ways:
      - style: visual
        teach: Where the ovary sits compared with the other flower parts.
        picture:
          kind: compare
          columns:
          - title: Hypogynous
            points:
            - other parts below the ovary
            - ovary superior
            - brinjal, China rose
          - title: Perigynous
            points:
            - parts at the rim of a cup
            - ovary half-inferior
            - plum, peach
          - title: Epigynous
            points:
            - parts above the ovary
            - ovary inferior
            - sunflower ray florets
          alt: In a hypogynous flower the ovary is superior with parts below it; in perigynous flowers parts sit on a cup rim; in epigynous flowers the ovary is inferior with parts above it.
      - style: step_by_step
        teach: 'Step 1: Cut the ovary across. Step 2: Count the chambers. Step 3: One chamber with ovules on one edge → marginal; on the wall → parietal; on a central column with no walls → free central; one ovule at the base → basal. Step 4: Several chambers with ovules on a central axis → axile.'
    - teach: 'A fruit is a ripened ovary; a seed is a ripened ovule. A fruit formed without fertilisation is parthenocarpic (banana). Monocot seeds like maize have an endosperm, a scutellum and a coleoptile. Key families: Fabaceae (pea), Solanaceae (potato), Liliaceae (onion).'
      picture:
        kind: compare
        columns:
        - title: Flower type
          points:
          - hypogynous
          - perigynous
          - epigynous
        - title: Ovary
          points:
          - superior
          - half-inferior
          - inferior
        alt: Ovary positions in flowers.
      check:
        prompt: 'A fruit develops from the:'
        options:
        - ovary
        - ovule
        - petal
        answer: ovary
        why: Ovules become seeds.
      ways:
      - style: step_by_step
        teach: 'Step 1: After fertilisation the ovary becomes the fruit and its wall the pericarp. Step 2: Each ovule becomes a seed. Step 3: In a drupe like mango or coconut the pericarp has three layers: skin (epicarp), fleshy or fibrous middle (mesocarp) and stony inside (endocarp).'
      - style: real_world
        teach: 'A coconut is a drupe: the smooth green skin is the epicarp, the coir fibre used for ropes in Alappuzha is the mesocarp, and the hard shell is the endocarp. A soaked gram seed shows two cotyledons once the seed coat slips off.'
  items:
  - prompt: How many whorls does a typical complete flower have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
